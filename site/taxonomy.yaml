# Controlled vocabularies for entry frontmatter (v3 pipeline).
#
# Single source of truth. site/content_model.py validates every entry's
# tags / regions / sectors / cves[] fields against this file and
# site/build.py + tools/check_run.py fail on any value not listed below.
# The prompts (prompts/cti-run.md, prompts/quality-audit.md) reference
# this file by name; do not duplicate the lists into the prompts.
#
# Lowercase, hyphenated, ASCII only. Add values when a real item needs one,
# never preemptively. Removing a value is a breaking change for historical
# pages — prefer leaving an obsolete value in place over removing it.

# Theme tags (entry `tags:`). One or more per entry — entries typically
# carry several at once (e.g. "ransomware, data-breach" or
# "vulnerabilities, actively-exploited, rce, pre-auth, cisa-kev").
themes:
  # Threat type
  - ransomware
  - nation-state
  - espionage
  - hacktivism
  - organized-crime
  - law-enforcement
  - vulnerabilities
  - supply-chain
  - data-breach
  - phishing
  - ddos
  - wiper
  - infostealer
  - botnet
  - cryptocrime
  - insider-threat
  - disinformation
  - ot-ics
  - cloud
  - identity
  - mobile
  - ai-abuse

  # Vulnerability characteristics — also appear as theme tags so list pages
  # surface them naturally. CVE-typed items duplicate the relevant subset
  # into the dedicated CVE metadata fields.
  - zero-day
  - actively-exploited
  - zero-click
  - pre-auth
  - default-config
  - rce
  - lpe
  - priv-esc
  - auth-bypass
  - dos
  - info-disclosure
  - path-traversal
  - sqli

  # Status flags applicable to vulns
  - cisa-kev
  - enisa-critical
  - poc-public
  - patch-available
  - no-patch

  # Organization-profile flag. Carried ONLY by entries included because
  # of a config/org-profile.yaml watchlist match (alongside
  # `watchlist_hit: true`) — entries that clear the general relevance
  # bar on their own do not carry it. Lets readers and the trends
  # dashboard slice org-specific signal from general coverage.
  - watchlist

# Sector tags (entry `sectors:`). Zero or more per entry, alongside
# tags + regions. Threat/incident entries typically carry one or two.
sectors:
  - public-sector
  - healthcare
  - energy
  - finance
  - telco
  - manufacturing
  - defense
  - media
  - education
  - transport
  - retail
  - aviation
  - water
  - legal-services
  - technology

# Nexus tags. Zero or more per entry, alongside theme tags. Used to flag
# the geopolitical attribution layer when a public source has stated it.
nexus:
  - china-nexus
  - russia-nexus
  - north-korea-nexus
  - iran-nexus
  - vietnam-nexus
  - us-nexus
  - eu-nexus

# Region tags (entry `regions:`). One or more per entry. `global` only for genuinely global
# events; default to the most specific region that fits.
regions:
  - global
  - us
  - europe
  - switzerland
  - dach
  - uk
  - nordics
  - apac
  - latam
  - africa
  - middle-east
  - russia-cis

# CVE record fields (entry `cves[]`): every record carries type / vector /
# auth / status from the lists below; content_model.validate_entry refuses
# records that omit vector, auth, or status.

cve_types:
  - rce
  - lpe
  - priv-esc
  - auth-bypass
  - info-disclosure
  - dos
  - ssrf
  - xss
  - sqli
  - deserialization
  - path-traversal
  - memory-corruption
  - logic-flaw

# `vector` encodes the VICTIM-INTERACTION requirement only — `zero-click`
# means attacker-initiated with no victim interaction, independent of the
# auth precondition (which `cve_auth` carries): an authenticated,
# no-interaction bug is `vector: zero-click` + `auth: post-auth`.
cve_vectors:
  - zero-click
  - user-interaction
  - physical
  - local

cve_auth:
  - pre-auth
  - post-auth
  - admin-required
  - default-config

cve_status:
  - exploited
  - cisa-kev
  - enisa-critical
  - poc-public
  - patch-available
  - no-patch
  - mitigation-only

# Render-section keys. The build emits each entry card inside a
# `<section data-section>` whose value is one of these — the filter UI uses
# them as toggle keys. Kind → section mapping lives in site/content_model.py
# (KIND_DAILY_SECTION); `updates` is derived from the entries' changelog
# (`updates[]` records dated in the rendered day/window), not from a kind.
# The legacy weekly-only section keys were retired with the weekly routine
# (v4.0); pre-v4 strategic entries keep their `weekly_section` value as an
# archived field that no renderer keys on.
sections:
  - tldr
  - immediate-actions
  - active-threats
  - trending-vulnerabilities
  - research
  - updates
  - deep-dive
  - action-items
  - verification-notes
