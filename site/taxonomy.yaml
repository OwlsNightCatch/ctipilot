# Controlled vocabularies for the CTI brief metadata footer.
#
# Single source of truth. The build (site/build.py) parses this file and
# fails on any post-cut-over item that uses a value not listed below. The
# prompts (prompts/daily-cti-brief.md, prompts/weekly-summary.md) reference
# this file by name; do not duplicate the lists into the prompts.
#
# Lowercase, hyphenated, ASCII only. Add values when a real item needs one,
# never preemptively. Removing a value is a breaking change for historical
# pages — prefer leaving an obsolete value in place over removing it.

# Theme tags. One or more per item. The list is intentionally rich because
# items typically carry several theme tags at once (e.g. "ransomware,
# data-breach, healthcare", or "vulnerabilities, actively-exploited, rce,
# pre-auth, cisa-kev"). The build does not police minimum count, but the
# prompt instructs the agent that a TL;DR-only line is the only place a
# single tag is acceptable.
themes:
  # Threat type
  - ransomware
  - nation-state
  - espionage
  - hacktivism
  - organized-crime
  - law-enforcement
  - vulnerabilities
  - supply-chain
  - data-breach
  - phishing
  - ddos
  - wiper
  - infostealer
  - botnet
  - cryptocrime
  - insider-threat
  - disinformation
  - ot-ics
  - cloud
  - identity
  - mobile
  - ai-abuse

  # Vulnerability characteristics — also appear as theme tags so list pages
  # surface them naturally. CVE-typed items duplicate the relevant subset
  # into the dedicated CVE metadata fields.
  - zero-day
  - actively-exploited
  - zero-click
  - pre-auth
  - default-config
  - rce
  - lpe
  - priv-esc
  - auth-bypass
  - dos
  - info-disclosure
  - path-traversal
  - sqli

  # Status flags applicable to vulns
  - cisa-kev
  - enisa-critical
  - poc-public
  - patch-available
  - no-patch

# Sector tags. Zero or more per item, alongside theme + region. Items in
# §3 "Active Threats…" typically carry one or two sector tags.
sectors:
  - public-sector
  - healthcare
  - energy
  - finance
  - telco
  - manufacturing
  - defense
  - media
  - education
  - transport
  - retail
  - aviation
  - water
  - legal-services
  - technology

# Nexus tags. Zero or more per item, alongside theme tags. Used to flag
# the geopolitical attribution layer when a public source has stated it.
nexus:
  - china-nexus
  - russia-nexus
  - north-korea-nexus
  - iran-nexus
  - us-nexus
  - eu-nexus

# Region tags. One or more per item. `global` only for genuinely global
# events; default to the most specific region that fits.
regions:
  - global
  - us
  - europe
  - switzerland
  - dach
  - uk
  - nordics
  - apac
  - latam
  - africa
  - middle-east
  - russia-cis

# CVE-only metadata fields. These appear on the `Trending Vulnerabilities`
# items only; the build refuses CVE entries that omit `Vector`, `Auth`, or
# `Status` after cut-over.

cve_types:
  - rce
  - lpe
  - priv-esc
  - auth-bypass
  - info-disclosure
  - dos
  - ssrf
  - xss
  - sqli
  - deserialization
  - path-traversal
  - memory-corruption
  - logic-flaw

cve_vectors:
  - zero-click
  - user-interaction
  - physical
  - local

cve_auth:
  - pre-auth
  - post-auth
  - admin-required
  - default-config

cve_status:
  - exploited
  - cisa-kev
  - enisa-critical
  - poc-public
  - patch-available
  - no-patch
  - mitigation-only

# Section keys. The build emits each item inside a `<section data-section>`
# whose value is one of these — the filter UI uses these as the toggle keys.
sections:
  - tldr
  - immediate-actions
  - active-threats
  - trending-vulnerabilities
  - research
  - updates
  - deep-dive
  - action-items
  - verification-notes
  # Weekly-only sections. The weekly brief uses a superset.
  - weekly-glance
  - weekly-top-stories
  - weekly-multi-day
  - weekly-vuln-rollup
  - weekly-sector-patterns
  - weekly-incidents-recap
  - weekly-annual-reports
  - weekly-long-running
  - weekly-policy
  - weekly-looking-ahead
