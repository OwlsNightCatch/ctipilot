<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0e1116" />
  <meta name="description" content="Daily and weekly cyber threat intelligence briefs covering Switzerland, Europe, and the public sector — autonomously generated, source-linked, IOC-free." />

  <!--
    Content-Security-Policy: declared as a meta tag so it ships with the SPA
    on GitHub Pages (which doesn't let us set HTTP headers).

    default-src 'self'        — refuse cross-origin loads by default
    script-src  'self'        — only our vendored + same-origin JS; no inline,
                                no eval, no third-party scripts
    style-src   'self' 'unsafe-inline' — needed because brief markdown rendering
                                emits inline `style=""` attributes through
                                marked + DOMPurify (DOMPurify already strips
                                <script> and on*)
    img-src     'self' data:  — favicon and any inlined data: images
    connect-src 'self'        — fetch() only to same origin (data/ + briefs/)
    object-src 'none'
    base-uri    'self'
    form-action 'none'        — site has no forms; this kills any injected ones
    frame-ancestors 'none'    — clickjack defence
    upgrade-insecure-requests — Pages serves HTTPS; force any stray http:// up
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />

  <title>CTI Briefs — Switzerland, Europe & Public Sector</title>

  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23e85d75'/%3E%3Ctext x='50%25' y='52%25' text-anchor='middle' dominant-baseline='middle' font-family='ui-monospace,monospace' font-size='15' font-weight='700' fill='%230e1116'%3ECTI%3C/text%3E%3C/svg%3E" />

  <!-- marked.js for markdown rendering, DOMPurify for safe HTML. Vendored locally for offline use and reproducibility. -->
  <script defer src="assets/vendor/marked.min.js"></script>
  <script defer src="assets/vendor/purify.min.js"></script>

  <!-- App scripts. Loaded as modules in order; each defines globals. -->
  <script defer src="assets/js/personal.js"></script>
  <script defer src="assets/js/store.js"></script>
  <script defer src="assets/js/search.js"></script>
  <script defer src="assets/js/render.js"></script>
  <script defer src="assets/js/router.js"></script>
  <script defer src="assets/js/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="topbar">
    <div class="bar-inner">
      <a class="brand" href="#/" aria-label="Home">
        <span class="brand-mark" aria-hidden="true">CTI</span>
        <span class="brand-text">
          <strong>CTI&nbsp;Briefs</strong>
          <small>Switzerland · Europe · Public sector</small>
        </span>
      </a>

      <nav class="nav" aria-label="Primary">
        <a href="#/" data-route="home">Home</a>
        <a href="#/briefs" data-route="briefs">Briefs</a>
        <a href="#/cves" data-route="cves">CVEs</a>
        <a href="#/topics" data-route="topics">Topics</a>
        <a href="#/sources" data-route="sources">Sources</a>
        <a href="#/about" data-route="about">About</a>
      </nav>

      <form class="searchbox" role="search" onsubmit="return false;">
        <label class="visually-hidden" for="q">Search briefs, CVEs, topics, sources</label>
        <input
          id="q"
          type="search"
          autocomplete="off"
          spellcheck="false"
          placeholder="Search briefs · CVEs · topics · sources    /"
          aria-label="Search"
        />
        <kbd class="kbd-hint" aria-hidden="true">/</kbd>
        <ul id="suggestions" class="suggestions" role="listbox" hidden></ul>
      </form>
    </div>
  </header>

  <main id="main" class="main">
    <div id="view" class="view" aria-live="polite">
      <p class="loading">Loading…</p>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <p>
        <strong>AI-generated content.</strong>
        Every brief is produced autonomously by an LLM running as a Claude Code routine; every claim links to a primary source. <a href="#/about">How this works →</a>
      </p>
      <p class="meta" id="footer-meta"></p>
    </div>
  </footer>
</body>
</html>
