    aliases: []
    nexus: null
    summary: "Intrusion confirmed by Brinks Home as detected on 2026-07-20, with the company stating its alarm monitoring and system functionality were unaffected and its incident FAQ saying it has not yet confirmed exactly what information was involved or whose. ShinyHunters claims the breach began on 13 July through a Microsoft Entra voice-phishing call and asserts specific data volumes; BleepingComputer reports two unreconciled Salesforce record figures and states it has not reviewed the data and could not verify the actor's claims (BleepingComputer, 2026-07-30)."
    first_seen: 2026-07-31
    relations:
