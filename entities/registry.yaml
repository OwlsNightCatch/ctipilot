    aliases: ["Cyberangriff auf SharePoint-Server des BIT", "Bundesamt für Informatik und Telekommunikation SharePoint-Angriff"]
    nexus: null
    summary: "Intrusion into the on-premises Microsoft SharePoint Servers operated by Switzerland's Bundesamt für Informatik und Telekommunikation (BIT) in the Confederation's own data centres. Anomalies were noticed 2026-07-28 and credential compromise of roughly 200 user and technical accounts was confirmed 2026-07-31; BIT states the attack was carried out by previously unknown actors and presumably enabled by exploitation of the SharePoint flaws Microsoft disclosed in mid-July 2026, with no indication of further data exfiltration. Disclosed by the Federal Council / BIT on 2026-08-04; the affected servers are being rebuilt (Der Bundesrat / BIT, 2026-08-04)."
    first_seen: 2026-08-05
  - key: "incident:hungary-treasury-mvh-bytetobreach-2026-08"
