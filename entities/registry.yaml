  - key: "incident:liechtenstein-vwbp-register-breach-2026-07"
    type: incident
    name: "Liechtenstein VwbP beneficial-ownership register breach (July 2026)"
    aliases: ["Cyberangriff auf das Verzeichnis wirtschaftlich berechtigter Personen", "Liechtenstein beneficial ownership register hack"]
    nexus: null
    summary: "Unauthorised digital access overnight into 2026-07-30 to Liechtenstein's Verzeichnis wirtschaftlich berechtigter Personen (VwbP), the national beneficial-ownership register operated by the Amt fuer Justiz under the VwbPG implementing the EU 5th Anti-Money-Laundering Directive; copies of records for roughly 31,000 legal entities were taken. The government declared it a personal-data breach under GDPR Article 33, convened a crisis unit under Head of Government Brigitte Haas and Justice Minister Emanuel Schaedler, and progressively took the eMWST VAT portal, the Lides reporting platform, the central account register and the Intax tax system offline as precautions. First forensic findings describe a targeted attack on the register with no attacks detected on other systems; no initial-access vector, actor or ransom demand had been disclosed (Regierung des Fuerstentums Liechtenstein, 2026-08-02 / 2026-08-03)."
    first_seen: 2026-08-04
  - key: "trend:llm-fabricated-cve-advisory-wave-2026-07"
    type: trend
    name: "LLM-fabricated CVE advisory wave (programmervuln/cveadvisory-)"
    aliases: ["LLM slop CVEs", "AI slop CVEs", "fake SQLite CVEs", "slop CVEs"]
    nexus: null
    summary: "Batch of 55 fabricated vulnerability advisories published through a single newly created GitHub repository (programmervuln/cveadvisory-) in late July 2026. JFrog Security Research reproduction-tested six SQLite entries under AddressSanitizer and found none valid, assessing 54 of the 55 as completely fabricated with one real bug wrapped in unverified metadata; SQLite's maintainer reported the same wave independently on 2026-07-29. The records reached NVD, CISA ADP enrichment, GHSA, Red Hat, BSI CERT-Bund (WID-SEC-2026-2581, WID-SEC-2026-2604) and NCSC-NL (NCSC-2026-0268) before the two national CERTs withdrew their advisories on 2026-08-03 (JFrog Security Research, 2026-07-30; NCSC-NL and BSI CERT-Bund, 2026-08-03)."
    first_seen: 2026-08-04
  - key: "report:crowdstrike-threat-hunting-2026"
    type: report
    name: "CrowdStrike 2026 Threat Hunting Report"
    aliases: ["CrowdStrike Threat Hunting Report 2026"]
    nexus: null
    summary: "Annual report from CrowdStrike Counter Adversary Operations (published 2026-08-03) drawing on OverWatch managed-hunting and CrowdStrike Intelligence telemetry from January to June 2026 across 290+ tracked adversaries. Headline findings: 88% of observed exploitation of vulnerabilities carrying a public proof-of-concept occurred within 48 hours of the PoC's release; npm accounted for 87% of identified software-registry threats in H1 2026; vishing intrusions doubled against H2 2025 and monthly device-code phishing attempts rose 15x; AI-agent-triggered detection leads now surface at 2.5x the rate of manually driven activity (CrowdStrike Counter Adversary Operations, 2026-08-03)."
    first_seen: 2026-08-04
