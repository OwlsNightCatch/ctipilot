    summary: "Loader-stage implant named by IBM X-Force for the side-loaded DLL component in ITG27 intrusion chains. It copies the side-loading pair into a new installation directory, commonly under the system-wide program-data path, establishes persistence, recovers embedded shellcode and executes the Toneshell payload by abusing a Windows locale-enumeration API as a callback. X-Force notes another vendor previously reported overlapping activity while categorising parts of the toolchain differently, so this is X-Force's own naming of a component already described elsewhere under a different grouping (IBM X-Force, 2026-08-20)."
    first_seen: 2026-08-21
  - key: "incident:france-education-ministry-breach-2026-07"
    type: incident
    name: "French Ministry of National Education data breach (2026)"
    aliases: []
    nexus: null
    summary: "The Ministry of National Education disclosed on 31 July 2026 a fraudulent intrusion into one of its information systems that may have led to exfiltration of personal data on a significant number of its staff. Per the ministry's own account, the data concerns agents who worked in an académie since 2001 — identity elements and professional information, status and functions — with contact details, postal address, telephone number and French social-security number for a subset; the system holds no banking data, no passwords and no student data. On 18 August 2026 the actor ZeroBytes claimed 346 million raw lines and asserted it had been detected but not evicted; the minister's office confirmed to franceinfo that the claim corresponds to the already-disclosed intrusion, and continues technical work on the actor's separate claim to hold student records. The actor link rests on French media reporting rather than an attribution by any authority, and no source states an access mechanism for this intrusion (franceinfo, 2026-08-18)."
    first_seen: 2026-08-21
  - key: "incident:france-bloctel-breach-2026-08"
    type: incident
    name: "Bloctel telemarketing opt-out registry breach (France, 2026)"
    aliases: []
    nexus: null
    summary: "France's consumer-protection directorate DGCCRF disclosed on 12 August 2026 that a fraudulent access to a professional account let a cybercriminal retrieve files containing 3 million telephone numbers, 600,000 of them registered on the Bloctel telemarketing opt-out list. DGCCRF states no personal data such as name or address was disclosed, that the compromised account was blocked as soon as the incident was noticed and all professional accounts subsequently reviewed, and that the Bloctel database itself was not compromised. DGCCRF names no threat actor, and no source ties this breach to the actor behind the contemporaneous DGFiP and Education Ministry intrusions — a linkage that was in circulation and does not survive tracing the citation chain (DGCCRF, 2026-08-12; OCCRP, 2026-08-20)."
    first_seen: 2026-08-21
