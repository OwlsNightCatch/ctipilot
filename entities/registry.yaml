  - key: "tool:overlord-rat"
    type: tool
    name: "Overlord"
    aliases: []
    nexus: null
    summary: "Open-source Go remote-access framework, publicly hosted, abused as a cross-platform RAT — keylogging, screen/audio/webcam capture, filesystem access and arbitrary script execution, with optional LaunchAgent persistence and encrypted-WebSocket C2. Jamf Threat Labs observed it staged as a Garble-obfuscated Go build by the first .NET-based macOS downloader it has recorded, delivered inside a counterfeit Zoom installer (2026-08-06). Jamf records two separate similarity observations and draws no conclusion from either: Overlord was also used by UNK_DeadDrop, a cluster Proofpoint assesses as likely North Korean, with no direct overlap identified to the fake-Zoom campaign; and this variant's LaunchAgent label and plist name match FlexibleFerret, a DPRK-attributed macOS family tied to the Contagious Interview campaign per SentinelOne (February 2025). Jamf does not attribute this malware to a specific threat actor."
    first_seen: 2026-08-07
