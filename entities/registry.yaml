  - key: "campaign:stopandprotect"
    type: campaign
    name: "StopAndProtect"
    aliases: []
    nexus: null
    summary: "Criminal toolkit operation first observed by Check Point Research in mid-May 2026 that hosts its payload delivery, command-and-control and stolen-data collection on compromised WordPress sites rather than on dedicated infrastructure, with close to 2,000 hijacked domains listed in the operators' own tracking files. Persistence on each site is a must-use plugin written to wp-content/mu-plugins/wp-sec.php — auto-loaded on every request and absent from the standard plugin list — registering a hidden REST route authenticated by hardcoded credentials that writes files, including PHP, almost anywhere under the site root, after which the installer deactivates and self-deletes. Delivery is a fake-CAPTCHA paste-and-run lure leading through two PowerShell and two .NET in-memory loader stages to a component set covering file encryption, an SMB/USB worm, a script spreader, a lock screen, a credential and screenshot collector and an operator chat utility. Check Point states no initial WordPress compromise vector, names no actor, and asserts no lineage to any previously tracked operation (Check Point Research, 2026-08-18)."
    first_seen: 2026-08-19
    relations:
      - to: "malware:silentencryptor"
        type: uses
        source: "2026-08-19/stopandprotect-wordpress-hosted-extortion-mu-plugin"
