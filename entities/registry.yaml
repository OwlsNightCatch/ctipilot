    name: "Beacon CRM access-key breach affecting around 1,500 UK charities"
    aliases: []
    nexus: null
    summary: "UK charity-sector CRM provider Beacon disclosed (update of 2026-08-04) that a compromised access key was used to reach its systems and that copies of database backups were made and likely downloaded, advising customers to assume all stored data including attachments was taken. Beacon states data is stored encrypted but that its experts assess the attacker could plausibly have decrypted it before copying. Named affected charities include Victim Support, Myton Hospices, Sheffield Hospital Charity, Priscilla Bacon Hospice Charity, Rowcroft Hospice and The Clock Tower Sanctuary; Victim Support reported to the UK ICO and the Charity Commission."
