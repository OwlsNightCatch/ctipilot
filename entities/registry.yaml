  - key: "malware:octlurk"
    type: malware
    name: "OctLurk"
    aliases: []
    nexus: china-nexus
    summary: "Plugin-based Windows backdoor deployed against government, healthcare, research, law-enforcement and education organisations in Afghanistan, Kyrgyzstan, Tajikistan, Uzbekistan, Kazakhstan and Syria since at least January 2025. Delivered by a malicious loader DLL invoked through a repointed Windows service ServiceMain value, which decrypts its payload with a hard-coded key plus a second key derived from the victim machine's C: drive serial number and loads it reflectively into memory. Pulls File Manager, Command Shell and Interaction Manager plugins directly from its command server into memory (Kaspersky GReAT, 2026-07-30)."
    first_seen: 2026-07-31
    relations:
