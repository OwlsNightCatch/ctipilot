    nexus: null
    summary: "Late-July 2026 intrusion into Hungary's Magyar Államkincstár (State Treasury), specifically its Agricultural and Rural Development Office (MVH), attributed by Hungarian reporting to the actor ByteToBreach. Cybersecurity experts consulted by Telex.hu on attacker-leaked screenshots describe entry through an unpatched Oracle WebLogic Server carrying fixes from an October 2017 patch cycle, escalation to Windows domain-administrator privileges across a reported 116 virtual machines, and ransomware encryption of employee workstation files; Treasury officials state citizen data was unaffected (Telex.hu, 2026-08-03; Risky Bulletin, 2026-08-05)."
