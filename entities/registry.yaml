  - key: "report:talos-ir-trends-q2-2026"
    type: report
    name: "Cisco Talos IR Trends Q2 2026"
    aliases: []
    nexus: null
    summary: "Cisco Talos Incident Response's quarterly incident-response trends report, published 2026-07-28. Records phishing as the initial-access vector in over half of its engagements, authentication abuse as the most prevalent weakness at 65 percent (adversary-in-the-middle proxies, session-token theft, MFA fatigue, attacker device registration and legacy authentication protocols), and insufficient logging in 42 percent — stating that in several engagements the resulting gaps prevented definitive determination of the initial access vector or the scope of exfiltration. Healthcare led targeted sectors for a second quarter at 17 percent, with public administration and manufacturing at 14 percent each, almost all of the public-administration victims being local governments. All percentages are shares of Talos's own engagement case load, not landscape measurements."
    first_seen: 2026-07-29
  - key: "tool:nightledger-backdoor"
    type: tool
    name: "NightLedger"
    aliases: []
    nexus: null
    summary: "Windows backdoor attributed by Kaspersky to Mirage Kitten (tracked in this registry as Screening Serpens) on code and behavioural similarity to the group's historical implants. Masquerades as SspiCli.dll and loads under a legitimate AppVShNotify.exe binary through a DLL search-order hijack of the delay-load that RPCRT4.dll performs when it invokes an authenticated RPC API, forwarding expected exports to the genuine DLL so the host process keeps functioning. Beacons over HTTPS, tokenizes C2 responses with a custom delimiter, and dispatches 16 numeric commands including host and network reconnaissance, file operations, screenshot capture, DLL loading, process listing and termination, and collection of the Windows domain-join diagnostic log. Kaspersky notes its command dispatch resembles TWOSTROKE, an implant previously documented as the same actor's (Kaspersky Securelist, 2026-07-28)."
    first_seen: 2026-07-29
  - key: "tool:bridgehead-tunneler"
    type: tool
    name: "BridgeHead"
    aliases: []
    nexus: null
    summary: "Mirage Kitten WebSocket SOCKS5 tunneling proxy engineered to operate through defended networks: on an HTTP 407 proxy-authentication challenge it queries the supported auth schemes, selects Negotiate in preference to NTLM, supplies null credentials so Windows fills in the logged-in user's single-sign-on context, and retries, falling back to exponential connection retry capped at 60 seconds. Once connected the operator drives all tunnel connections server-side and the implant only forwards, making the victim host a relay whose traffic appears to originate inside its own network. Execution is gated on a hardcoded 3-character substring of the lowercased Windows username, so a sample exits silently anywhere but its intended host. Kaspersky states its proxy-traversal logic closely mirrors a backdoor it tracks internally as Retrograde, which it says overlaps with tooling publicly reported as MiniFast/MiniUpdate (Kaspersky Securelist, 2026-07-28)."
    first_seen: 2026-07-29
  - key: "tool:arcbridge-tunneler"
    type: tool
    name: "ArcBridge"
    aliases: []
    nexus: null
    summary: "WebSocket tunneling tool Kaspersky states was developed and used by Mirage Kitten, first identified April 2026. Implements a simpler control surface than the related BridgeHead — an OPEN command to create a proxy/tunnel session and a DNS command for hostname resolution — with an embedded configuration block carrying C2 host, port, retry/timeout value, an SSL flag and a likely implant identifier (Kaspersky Securelist, 2026-07-28)."
    first_seen: 2026-07-29
  - key: "trend:nightmare-eclipse-legacyhive-profile-registry-hijack-2026-07"
    type: trend
    name: "LegacyHive"
    aliases: []
    nexus: null
    summary: "Nightmare Eclipse's Windows profile-initialization abuse technique, published shortly after the July 2026 Patch Tuesday and analysed by LevelBlue SpiderLabs. Not a software vulnerability and carrying no CVE: it edits a helper account's ntuser.dat offline through Microsoft's Registry Offline API to repoint the User Shell Folders Local AppData value into an attacker-created NT Object Manager namespace, uses a batch opportunistic lock on UsrClass.dat to pause deterministically until profile initialization reaches the right point, then forces a profile load via CreateProcessWithLogonW with LOGON_WITH_PROFILE — reaching a third account's profile data without ever holding that account's credentials. Strictly post-compromise: the released proof-of-concept requires a low-privileged session plus a separate helper account's credentials. LevelBlue reproduced the full chain on fully patched Windows with July 2026 updates installed and reports no Microsoft mitigation for the class (LevelBlue SpiderLabs, 2026-07-27)."
    first_seen: 2026-07-29
  - key: "incident:minnesota-water-utilities-coordinated-cyberattack-2026-07"
    type: incident
    name: "Minnesota coordinated water-utility OT cyberattack (July 2026)"
    aliases: []
    nexus: null
    summary: "Coordinated cyberattack over 26-27 July 2026 that Minnesota IT Services announced had disrupted water and wastewater utilities in more than 30 communities, affecting programmable logic controllers and cellular-connected equipment at water towers and lift stations. Plymouth disconnected affected cellular equipment from its network; Braham's water plant went offline and the city briefly asked residents to minimise use on tank level; South St. Paul reported impact to certain automated controls. No source reports impact to drinking-water safety or treatment quality. No named authority has attributed the attack to any actor — the affected city says unknown actors, and the Center for Internet Security states it has not been attributed and that it is unclear whether the internet-exposed PLC vector of joint advisory AA26-097A was involved (StateScoop, Cybersecurity Dive, 2026-07-28)."
    first_seen: 2026-07-29
  - key: "incident:uvvg-arad-cyberattack-2026-07"
    type: incident
    name: "UVVG Arad cyberattack (July 2026)"
    aliases: []
    nexus: null
    summary: "Cyberattack confirmed on 2026-07-28 by Universitatea de Vest 'Vasile Goldis' din Arad, a Romanian public university, as having affected its IT infrastructure and the digital services used in academic and administrative work. The university notified the national cybersecurity directorate DNSC, the data-protection authority ANSPDCP and organised-crime prosecutors DIICOT, and reported technical teams working with external specialists on gradual restoration, while declining to specify which systems were unavailable, whether personal data was accessed or exfiltrated, when the attack occurred, or who was responsible. The Qilin ransomware operation separately listed the university on its leak site with an estimated attack date of 2026-07-26; that claim rests solely on the leak-site listing and is mentioned by none of the Romanian reporting (Aradon.ro, Radio Romania, 2026-07-28)."
    first_seen: 2026-07-29
  - key: "actor:sapphire-sleet"
    type: actor
    name: "Sapphire Sleet"
    aliases:
      - "STARDUST CHOLLIMA"
      - "BlueNoroff"
      - "CageyChameleon"
      - "Alluring Pisces"
      - "UNC1069"
      - "MIDNIGHT NEPTUNE"
    nexus: north-korea-nexus
    summary: "DPRK-linked cluster that Amazon Threat Intelligence assesses with medium confidence — on the basis of command-and-control indicators and TTPs — to be behind the September 2025 compromises of the npm packages debug and chalk and the March 2026 compromise of axios, in each case obtaining publishing access by socially engineering a trusted package maintainer rather than exploiting a registry flaw. Amazon further assesses that a small March 2025 compromise of a package named typo-crypto — into which the actor committed a trojanised file that detonated only on a specific input value and then fetched an operating-system-appropriate second stage — was a testing ground for those later, higher-impact supply-chain operations. The attribution is Amazon's own medium-confidence assessment, independently corroborated on 2026-07-30 when Google's threat-intelligence group separately credited the axios compromise to the cluster it tracks as UNC1069 — already an alias on this record — under its new cryptonym MIDNIGHT NEPTUNE; the alias UNC1069 is sourced to CyberScoop's reporting on Amazon's media roundtable rather than to Amazon's own publication (AWS Security Blog, CyberScoop, 2026-07-29; Google Cloud/GTIG, 2026-07-30)."
    first_seen: 2026-07-30
  - key: "actor:knaithe-knyuan"
    type: actor
    name: "knaithe / KnYuan"
    aliases: ["knaithe", "KnYuan"]
    nexus: china-nexus
    summary: "Chinese-speaking, Zhuhai-based exploit operator, self-described binary-security researcher and maintainer of an automated vulnerability-alerting pipeline. Ran an autonomous offensive stack pairing DeepSeek with the open-source Hermes Agent against seven CVEs and more than 460 targets; Unit 42 reports every autonomous exploitation attempt failed on target-side configuration, while the confirmed impact — all of it recorded by Unit 42 as manual rather than autonomous — spans four CVEs: data exfiltration from three Citrix NetScaler targets (CVE-2026-3055), command execution confirmed on 11 Marimo Notebook endpoints (CVE-2026-39987), Java deserialization reverse-shell attempts against nine Apache Tomcat servers (CVE-2026-34486) and reverse-shell callbacks from three IKE VPN endpoints (CVE-2026-33824), including multi-day targeting of a Malaysian government entity (Unit 42, 2026-07-30; scope corrected against the primary by the 2026-08-02 quality audit)."
    first_seen: 2026-07-31
    relations:
      - to: "tool:hermes-ai-agent"
        type: uses
        source: "2026-07-31/unit42-autonomous-deepseek-hermes-netscaler-cve-2026-3055"
        note: "Unit 42 states the actor primarily used the Hermes Agent with DeepSeek as its reasoning agent for the attack phase of the campaign."
  - key: "tool:owareaper"
    type: tool
    name: "OWAReaper"
    aliases: []
    nexus: russia-nexus
    summary: "JavaScript browser implant delivered by TA488/LAUNDRY BEAR through the Exchange Outlook Web Access stored-XSS flaw CVE-2026-42897. Executes entirely in the OWA reading pane with no host-file footprint, harvests browser-autofilled OWA credentials via invisible input elements, steals OAuth tokens through mailbox add-ins holding read-write mailbox permission, persists in browser localStorage under a legitimate OWA settings key and in the offline message cache, and grants the Exchange 'Default' alias Owner permission on mail folders for server-side persistence that Proofpoint states survives credential rotation and device re-imaging. Proofpoint assesses it an evolution of the same actor's Zimbra implant (Proofpoint, 2026-07-29)."
    first_seen: 2026-07-31
    relations:
