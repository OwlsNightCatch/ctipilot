    summary: "Recorded Future's designation for the North Korean IT-worker cluster — a state-directed network of covert technology workers who pose as independent contractors and job-seeking developers to obtain remote employment, with earnings funnelled back through layered individual accounts. Insikt Group states the group overlaps with the vendor designations Jasper Sleet, UNC5267, Wagemole and Famous Chollima. Between late 2024 and early 2025 one cluster applied to over 1,100 companies, at times 60 positions a day, running at least 22 fabricated personas, some of which Insikt records as supported by AI-generated profile photographs from a face-swapping service, identity documents from an illicit document-generation service and purpose-configured chatbot assistants used to answer interview questions in real time, alongside fabricated code-hosting contribution histories; Insikt assesses the operators were highly likely employed by at least ten organisations. Employer-issued laptops are physically held by facilitators and worked remotely over commercial remote-desktop software with a commercial VPN marketed for circumventing China's national firewall, and Insikt places many operators' nexus in Shenyang, China. Roughly 80% of target companies were North American but operators applied in every region of the world (Insikt Group, 2026-08-18)."
