  - key: "malware:genielocker"
    type: malware
    name: "GenieLocker"
    aliases: []
    nexus: null
    summary: "Custom Windows and Linux/ESXi ransomware active since March 2026. Refuses to execute unless its first command-line argument hashes to a value compiled into the binary, which Kaspersky assesses is intended to defeat sandboxes and automated analysis and to prevent unauthorised reuse by other actors; runs a watchdog thread polling for debuggers every 500 milliseconds and recomputing a checksum of its own code section on each pass; and deliberately writes no ransom note, which Kaspersky assesses is an attempt to avoid detection triggered by the creation of multiple readme files. The ESXi build stops running virtual machines before encrypting their disks (Kaspersky, 2026-07-30)."
    first_seen: 2026-07-31
    relations: []
  - key: "actor:exfilsquad"
