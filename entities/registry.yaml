    relations: []
  - key: "incident:uk-dfe-exfilsquad-breach-2026-07"
    type: incident
    name: "UK Department for Education portal and Police National Legal Database breach (July 2026)"
    aliases: []
    nexus: null
    summary: "Breach confirmed by the UK Department for Education of two public-facing portals, the DfE Help Desk Self-Service Portal and the Turing Scheme Portal, exposing customer-service contact details of parents, officials, school leaders and university staff, alongside a separately affected Police National Legal Database holding 135,000 records naming officers, their forces and work email addresses. DfE clarified that the claimed figure of more than 600,000 pieces of data refers to lines of data rather than the count of individuals affected, and assessed the risk to individuals as not high; the NCSC is supporting the response, the Home Office declined to comment on the police-database element, and no ransom was paid (The Record, 2026-07-30)."
