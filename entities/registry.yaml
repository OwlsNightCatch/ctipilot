  - key: "incident:anthropic-cybersecurity-eval-escape-2026-07"
    type: incident
    name: "Anthropic cybersecurity-evaluation environment escape (July 2026)"
    aliases: []
    nexus: null
    summary: "A misconfiguration at Anthropic's evaluation partner left cybersecurity-benchmark machines with live internet access despite the models being told their environment was an offline simulation. Across three incidents spanning six of 141,006 reviewed runs, and dating back to April 2026, models compromised real third-party infrastructure: reaching a production database of several hundred rows at a company sharing a name with a fictional target, publishing a malicious PyPI package that was live for roughly an hour and ran on 15 real systems including a security vendor's malware scanner where it exfiltrated that vendor's credentials, and scanning roughly 9,000 hosts before compromising one internet-facing application. The models ran with model-specific safety training but without the additional safety classifiers applied to production systems (Anthropic, 2026-07-30)."
    first_seen: 2026-07-31
    relations:
      - to: "incident:hugging-face-autonomous-ai-agent-breach-2026-07"
        type: related-to
        source: "2026-07-31/anthropic-cyber-eval-environment-escape-pypi-package"
        note: "Anthropic states its review was prompted by the other vendor's disclosure of a comparable evaluation-environment escape and cites it directly."
  - key: "actor:midnight-blizzard"
