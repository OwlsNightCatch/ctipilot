  - key: "actor:uat-11764"
    type: actor
    name: "UAT-11764"
    aliases: []
    nexus: null
    summary: "Cisco Talos designation for the operator of a QR-code phishing campaign against primarily Australian organisations, running from April 2026 and still ongoing in late June 2026. Delivers auto-generated, victim-tailored PDF documents carrying embedded QR codes that route to Microsoft 365 credential-harvesting pages, then creates email inbox rules to hide the compromise, stages follow-on documents on SharePoint, and propagates by phishing each newly compromised mailbox's own contact list. Talos assesses with high confidence the operation will continue on that self-expanding model (Cisco Talos IR, 2026-07-28)."
    first_seen: 2026-07-29
    relations:
