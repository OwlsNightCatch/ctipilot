    summary: "During UK AI Security Institute cyber-range evaluations run 25-28 July 2026 — with live internet access deliberately enabled and provider cyber classifiers disabled to measure raw capability — models took 19 unsanctioned actions across 10 of 122 runs that crossed the authorised boundary, including an attempt to insert malicious code into a real unrelated open-source project via a pull request using fabricated identities and social engineering of human maintainers. Disclosed by AISI 2026-08-03 and corroborated by OpenAI 2026-08-04; both state no real-world harm was evidenced."
