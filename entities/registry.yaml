    summary: "Financially motivated intrusion cluster tracked by Sophos X-Ops, running Microsoft Teams voice-phishing against North American organisations between February and June 2026 by impersonating IT helpdesk personas from its own IT-themed domains registered under the .top TLD rather than spoofing onmicrosoft.com tenants. Talks victims into a remote-support session (Quick Assist initially, the less-commonly-blocklisted RemSupp by preference from April 2026), enables RDP via msconfig service reconfiguration, and runs Golang implants that embed CA certificates and complete TLS only against C2 servers presenting a matching issuer. At least three compromises ended in Chaos ransomware, one within 17 hours of initial access. Sophos assesses financial motivation with high confidence but states there is insufficient evidence for actor attribution, and explicitly found no evidence linking the cluster to MuddyWater (Sophos X-Ops, 2026-07-28)."
    first_seen: 2026-07-29
    relations:
      - to: "actor:chaos-ransomware"
        type: related-to
        source: "2026-07-29/stac4749-teams-vishing-certificate-pinned-golang-chaos"
        note: "Sophos states at least three STAC4749 compromises led to Chaos ransomware deployment, but assesses only that the operators either deployed it directly OR coordinated with affiliates — the untyped edge is deliberate, since collaborates-with would assert the second branch of a disjunction the source leaves open"
  - key: "actor:sinobi-ransomware"
    type: actor
    name: "Sinobi"
    aliases: []
    nexus: null
    summary: "Ransomware-as-a-service operation active for roughly a year with minimal public reporting on its operators, encrypting with the .SINOBI extension. In Cisco Talos Incident Response's first engagement with the group (April 2026) the operators used a trojanized MeshAgent binary — the agent component of the open-source MeshCentral remote-management platform — installed as a SYSTEM-level auto-start service as their primary command-and-control mechanism over encrypted WebSocket, a tactic Talos states had not previously been associated with the group; they held access about three days, cracked a weak service-account password obtained from ntds.dit, moved laterally over RDP and WinRM, and deployed ransomware domain-wide through a malicious Group Policy Object logon script with rclone staging exfiltration (Cisco Talos IR, 2026-07-28)."
    first_seen: 2026-07-29
    relations:
      - to: "report:talos-ir-trends-q2-2026"
        type: documented-in
        source: "2026-07-29/talos-ir-trends-q2-2026-rmm-weaponization-auth-abuse"
  - key: "actor:warlock-storm-2603"
    type: actor
    name: "Warlock"
    aliases:
      - "Storm-2603"
    nexus: null
    summary: "Ransomware operation, tracked by Microsoft as Storm-2603, observed by Cisco Talos Incident Response deploying an installer for the Zoho Assist Unattended Agent — an RMM capability allowing administrative remote control of an endpoint with no user logged in — a tool Talos states it had not previously seen attributed to the group. The engagement in question did not reach encryption but Talos assessed the activity consistent with a Warlock attack it observed in May 2026 that did (Cisco Talos IR, 2026-07-28)."
    first_seen: 2026-07-29
    relations:
