  - key: "malware:e4del"
    type: malware
    name: "E4del"
    aliases: []
    nexus: null
    summary: "Node.js remote-access trojan documented by SOCRadar's Threat Research Unit that abuses Electron application architecture: the actors ship a legitimate, digitally signed vendor chat executable with the runtime libraries it expects and replace the contents of its resource archive with their own logic, so the operating system sees a correctly signed binary loading trusted dependencies. Runs the host application windowless, enumerates installed security products before beaconing, refuses to execute unless invoked with an argument matching the intended victim's username, and persists by registering the signed host binary as a login item. Its escalation command loads a native module SOCRadar could not retrieve, so the privilege-escalation route is unknown (SOCRadar Threat Research Unit, 2026-08-21)."
    first_seen: 2026-08-22
  - key: "malware:pinhole-rat"
    type: malware
    name: "PINHOLE"
    aliases: []
    nexus: null
    summary: "Shellcode-staged remote-access trojan documented by SOCRadar's Threat Research Unit and built for endpoint-sensor evasion: it recovers syscall numbers from neighbouring unhooked functions to issue direct calls, keeps only a small slice of its payload resident in memory at a time, and injects its final stage into a suspended standard Windows interface-host process. Its command-and-control configuration is held in ordinary consumer web platforms rather than on takedown-exposed attacker infrastructure. Delivered by the same FTP-banner dead-drop chain as E4del, which SOCRadar assesses is a separate cluster using the same technique (SOCRadar Threat Research Unit, 2026-08-21)."
    first_seen: 2026-08-22
  - key: "policy:apobank-psd2-ruling-2026"
