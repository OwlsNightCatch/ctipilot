    summary: "Open-source web-proxy and URL-rewriting library repurposed by phishing kits to build browser-service-worker-based transparent adversary-in-the-middle proxies that rewrite every link and form on a page so subsequent traffic relays through attacker infrastructure (Kaspersky Securelist, 2026-08-04)."
