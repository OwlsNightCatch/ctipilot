  - key: "campaign:shai-hulud-chaindrop-2026-08"
    type: campaign
    name: "Shai-Hulud CHAINDROP wave"
    aliases: ["CHAINDROP"]
    nexus: null
    summary: "Elastic Security Labs' designation for an npm supply-chain worm wave identified on 2026-08-04 that began with the compromise of the keyv maintainer and backdoored over 400 packages totalling more than 1.3 billion monthly downloads. CHAINDROP executes from a package.json preinstall hook via a downloaded Bun runtime, harvests over 300 credential patterns including AI-assistant, cloud, GitHub, Vault, SSH and Kubernetes secrets, self-propagates only through npm tokens that can publish without two-factor authentication, and resolves its exfiltration endpoint from an Ethereum smart contract at runtime. Elastic frames it as the return of the Shai-Hulud lineage rather than a new family (Elastic Security Labs, 2026-08-06)."
    first_seen: 2026-08-06
  - key: "tool:endlessdoors"
    type: tool
    name: "ENDLESSDOORS"
    aliases: []
    nexus: null
    summary: "VulnCheck's designation for a factory-installed remote-access implant found pre-installed on twenty Zbtlink router and CPE models and their rebrands, tracked as CVE-2026-66747. A customised build of the open-source rctl tool, it is started at boot by the vendor's own init script, masquerades as a kernel worker thread, registers unauthenticated to hardcoded command-and-control hosts and executes whatever the server sends as uid 0. VulnCheck's remediation guidance is device replacement rather than a firmware fix (VulnCheck, 2026-08-05)."
    first_seen: 2026-08-06
