    summary: "Intrusion into the public-facing Microsoft SharePoint server operated by Canton Graubünden's Amt für Informatik, which hosts the cantonal administration's web presence. The canton dates the attack to the afternoon of 29 July 2026 and disclosed it on 2026-08-05, one day after the Swiss Confederation's IT provider BIT disclosed its own on-premises SharePoint intrusion; two files were placed on the server without their code executing, and a first analysis found no compromised accounts and no data exfiltration (Kanton Graubünden, 2026-08-05)."
