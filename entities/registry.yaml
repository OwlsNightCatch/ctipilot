  - key: "malware:cornflake-go-rat"
    type: malware
    name: "CornFlake"
    aliases: []
    nexus: null
    summary: "Storm-2945's primary persistent Windows implant, written in Go and delivered by the CaptiveCrunch captive-portal lures. Runs first in dropper mode behind a configurable fake progress window imitating Windows Update, a security scan or a redistributable installer, then registers as a Windows service masquerading as a cloud-sync utility. Establishes redundant persistence across service registration, Registry Run keys and scheduled tasks with a watchdog that restores anything defenders remove; command and control uses ephemeral ECDH P-256 key exchange with SHA-256 session-key derivation over a custom JSON protocol. Collection covers keylogging, clipboard, screenshots, microphone and webcam capture, removable media, browser credential theft and an eighteen-category host security-posture sweep (Microsoft Threat Intelligence, 2026-07-31)."
    first_seen: 2026-08-01
  - key: "tool:chocoshell-powershell-stealer"
    type: tool
    name: "ChocoShell"
    aliases: []
    nexus: null
    summary: "Storm-2945's in-memory PowerShell infostealer, deployed alongside CornFlake in the CaptiveCrunch operation for high-volume theft of browser session cookies, saved passwords, Microsoft 365 SSO tokens and Wi-Fi credentials. Disables AMSI via .NET reflection, performs a timing-based sandbox check, and escalates through three silent UAC-bypass techniques in ordered fallback before reverting to a visible prompt. Defeats Chrome App-Bound Encryption both by impersonating a SYSTEM token and by driving the browser's own DevTools Protocol, and collects Microsoft 365 and Azure AD access, refresh and Web Account Manager tokens from the Token Broker cache, enabling SSO session replay without browser cookies (Microsoft Threat Intelligence, 2026-07-31)."
    first_seen: 2026-08-01
  - key: "malware:xcsset"
    type: malware
    name: "XCSSET"
    aliases: ["XCSSET v40"]
    nexus: null
    summary: "Modular macOS malware family targeting Apple-ecosystem developers by infecting Xcode projects and Git repositories, so the payload executes when a developer builds an infected project locally. First documented by Trend Micro in 2020 with two further versions documented by Microsoft in 2025. Version 40, analysed by Unit 42 on 2026-07-31, keeps its core logic in memory and deletes its installation files, recompiles payloads polymorphically, and adds fileless persistence that stores a Base64 staging payload in a per-host macOS defaults preferences domain. It degrades platform defences by disabling the software-update configuration channel, terminating the cloud telemetry process, holding an exclusive file lock on the XProtect signature database, and resetting the TCC AppleEvents permission database to re-prompt a user who declines (Palo Alto Networks Unit 42, 2026-07-31)."
    first_seen: 2026-08-01
  - key: "incident:france-education-nationale-agent-training-breach-2026-07"
    type: incident
    name: "French Éducation nationale agent-training system breach (July 2026)"
    aliases: []
    nexus: null
    summary: "Compromise of a French Ministry of Education professional account overnight on 2026-07-25, used to reach the ministry's internal information system for managing agent training. Identity and professional data for every agent who has worked in a French académie since 2001 was present in the environment, with postal address, telephone number and social-security number (NIR) for a subset; the ministry states the system held no passwords, banking details or pupil data, and that it is not established that every record was actually viewed or downloaded. External access was suspended on 26 July, ANSSI and the CNIL were notified and a criminal complaint filed. Third confirmed Éducation nationale data incident of 2026, after the March COMPAS breach of roughly 243,000 agent and trainee records and an April incident exposing pupil data through an ÉduConnect-linked service (Cyberattaque.org, franceinfo, Clubic, 2026-07-31)."
    first_seen: 2026-08-01
  - key: "incident:adform-supply-chain-crypto-clipper-2026-07"
    type: incident
    name: "Adform trackpoint-async.js supply-chain crypto-clipper compromise (July 2026)"
    aliases: []
    nexus: null
    summary: "Compromise of the shared JavaScript tracking library trackpoint-async.js served by Copenhagen-headquartered ad-tech platform Adform from s2.adform.net and embedded across customer websites. Two obfuscated blocks appended to the legitimate library monitored the clipboard, hooked input value setters and intercepted copy, cut, paste and input events to substitute attacker-controlled Bitcoin, Ethereum and Tron wallet addresses, and rewrote addresses displayed on the page. Discovered by researcher Kevin Beaumont; Adform states it detected the activity on 2026-07-27, removed the code and reported it to the authorities, and identifies 27 July as the affected date, while Beaumont describes roughly a week of activity and the oldest archived sample dates to 2026-07-26. The sample carried no antivirus detections and Adform has published no indicators of compromise or attacker attribution (Adform, 2026-07-31; BleepingComputer, 2026-07-31; The Hacker News, 2026-08-01)."
    first_seen: 2026-08-02
  - key: "incident:cci-nice-cote-dazur-edrh-breach-2026-07"
    type: incident
    name: "CCI Nice Côte d'Azur eDRH administrator-account export breach (July 2026)"
    aliases: []
    nexus: null
    summary: "Compromise of an administrator account on the eDRH candidate-and-company platform of the Chambre de commerce et d'industrie Nice Côte d'Azur, the French public-law chamber of commerce for the Alpes-Maritimes. On 2026-07-18 an unauthorised party used the account's legitimate export functions to generate several exports of registered candidate and company data, including name, email, telephone, date of birth, professional history, education level and account timestamps. The chamber has not disclosed the account-takeover vector, the duration of access, or the number of people affected (Cyberattaque.org, FrenchBreaches.com, 2026-07-31/2026-08-01)."
    first_seen: 2026-08-02
  - key: "incident:coldcard-rng-fallback-seed-theft-2026"
    type: incident
    name: "COLDCARD hardware-RNG fallback wallet-seed theft (2026)"
    aliases: ["Coldcard entropy issue", "Coldcard RNG hack"]
    nexus: null
    summary: "Mass theft from Coinkite COLDCARD hardware wallets whose seeds were generated by firmware that routed key generation to MicroPython's software PRNG instead of the intended STM32 hardware TRNG. The defect entered during the March 2021 libNgU migration because the guarding preprocessor directive tested whether MICROPY_HW_ENABLE_RNG was defined rather than whether its value was non-zero, and the two implementations shared a function signature so the build succeeded. Coinkite estimates the resulting effective search space at about 40 bits on Mk2/Mk3 (firmware 4.0.1 through 4.1.9) and about 72 bits on Mk4, Mk5 and Q. Exploitation was confirmed under way by 2026-07-30, when Block Engineering published its root-cause analysis citing active exploitation; no cited source dates its start. Galaxy Research estimated 1,367.05 BTC drained across 4,585 addresses by 2026-08-01 over three waves, all funds unspent. Coinkite assumes but does not establish that an adversary found the defect using AI review of its public firmware source (Coinkite, 2026-07-30; Block Engineering, 2026-07-30; Galaxy Research via CryptoTimes, 2026-08-01)."
    first_seen: 2026-08-02
  - key: "campaign:fakeagent"
    type: campaign
    name: "FakeAgent"
    aliases: []
    nexus: null
    summary: "Malvertising campaign named by Huntress that compromised at least 29 organisations between 2026-07-21 and 2026-07-22. Sponsored search results for the Claude Desktop application linked to a genuine claude.ai URL whose destination was a public user-created artifact on the platform imitating the official download page, viewed roughly 7,100 times before removal, so the ad, the domain and the certificate all presented as legitimate before an onward redirect to attacker infrastructure served the installer. Execution runs through signed-binary side-loading — a repurposed JetBrains Chromium Embedded Framework helper loading a VMProtect-packed trojanised libcef.dll, with a second chain using an IBM SPSS binary and a compiled DirectX shader as its decryption routine — and delivers SectopRAT (Huntress, 2026-07-22; Help Net Security, 2026-07-23; BleepingComputer, 2026-07-23)."
    first_seen: 2026-08-02
    relations:
      - to: "malware:sectoprat"
        type: uses
        source: "2026-07-26/fakeagent-claude-artifact-lure-sectoprat-dll-sideloading"
        note: "BleepingComputer names SectopRAT as the payload the FakeAgent installer delivers."
  - key: "malware:sectoprat"
    type: malware
    name: "SectopRAT"
    aliases: []
    nexus: null
    summary: "Information stealer and remote-access tool with hands-on-keyboard capability, delivered by the FakeAgent malvertising campaign through DLL side-loading under signed third-party binaries. Huntress documents plaintext strings referencing browser logins, cookies, autofills and credit cards, and command-and-control data stored in the Ethereum blockchain — the takedown-resistant technique known as EtherHiding (Huntress, 2026-07-22; BleepingComputer, 2026-07-23)."
    first_seen: 2026-08-02
  - key: "malware:teleshim"
    type: malware
    name: "TELESHIM"
    aliases: []
    nexus: null
    summary: "First-stage Windows backdoor in a three-stage espionage toolkit Zscaler ThreatLabz documented against government entities in the Middle East, attributed with moderate-to-high confidence to an actor operating out of East Asia on the basis of IP geolocation, system locale and operational hours. Delivered by an ISO carrying a legitimate ASUSTek executable (RegSchdTask.exe, staged as shimgen.exe) that side-loads a malicious AsTaskSched.dll, so first execution runs under a trusted vendor binary. Persists through scheduled tasks and abuses the Telegram Bot API for command-and-control so its egress resolves to a mainstream service; carries control-flow flattening, mixed boolean arithmetic and opaque predicates (Zscaler ThreatLabz, 2026-07-20)."
    first_seen: 2026-08-02
    relations:
      - to: "tool:mixedkey"
        type: related-to
        source: "2026-07-26/teleshim-bindcloak-volume-serial-keying-government-espionage"
        note: "Zscaler describes MIXEDKEY as the reflective loader stage of the same three-stage chain."
      - to: "malware:bindcloak"
        type: related-to
        source: "2026-07-26/teleshim-bindcloak-volume-serial-keying-government-espionage"
        note: "Zscaler describes BINDCLOAK as the final implant of the same three-stage chain."
  - key: "tool:mixedkey"
    type: tool
    name: "MIXEDKEY"
    aliases: []
    nexus: null
    summary: "Reflective loader stage of the TELESHIM / MIXEDKEY / BINDCLOAK espionage toolkit documented by Zscaler ThreatLabz against Middle East government entities. Shares the chain's heavy obfuscation — control-flow flattening, mixed boolean arithmetic and opaque predicates — and loads the final BINDCLOAK implant into memory (Zscaler ThreatLabz, 2026-07-20)."
    first_seen: 2026-08-02
  - key: "malware:bindcloak"
    type: malware
    name: "BINDCLOAK"
    aliases: []
    nexus: null
    summary: "Final-stage implant of the TELESHIM / MIXEDKEY / BINDCLOAK espionage toolkit documented by Zscaler ThreatLabz against Middle East government entities. Environmentally keyed: it decrypts only with a key derived from the victim machine's volume serial number, so a captured sample will not execute in a sandbox or on an analyst workstation and a negative dynamic-analysis result is not evidence the file is benign (Zscaler ThreatLabz, 2026-07-20)."
    first_seen: 2026-08-02
