    name: "CaptiveCrunch"
    aliases: []
    nexus: russia-nexus
    summary: "Operation active since early May 2026 in which Storm-2945 manipulates DNS and HTTP traffic on hospitality-sector networks served by captive portals worldwide, redirecting connecting users through actor-controlled infrastructure and answering automatic browser connectivity checks with ClickFix-style fake browser and operating-system update lures that deliver the CornFlake RAT and the ChocoShell stealer. Since 16 July 2026 a portion of the landing pages also drive Entra ID device-code phishing. Microsoft's investigation into how the captive-portal networks were initially compromised remains open, but it notes commonalities in equipment and management systems suggesting possible access to shared services within parts of the captive-portal ecosystem (Microsoft Threat Intelligence, 2026-07-31)."
    first_seen: 2026-08-01
    relations:
      - to: "actor:storm-2945"
        type: attributed-to
        source: "2026-08-01/captivecrunch-storm-2945-hospitality-captive-portal-rat"
