    summary: "Large-scale ConnectWise ScreenConnect distribution campaign documented by LevelBlue SpiderLabs (2026-08-07). Impersonates the Google Meet pre-join screen, the Microsoft Store and the Apple App Store with interactive modal update dialogs, delivers a batch-to-PowerShell-to-MSI silent install, and binds each installer by embedded public key to a specific attacker-controlled ScreenConnect relay so it self-registers on install at guest-level permission. Payloads are hosted on AWS S3 and Cloudflare R2 behind anti-automation gating and victim fingerprinting, with operator notification via the Telegram Bot API."
    first_seen: 2026-08-08
  - key: "incident:beacon-crm-uk-charities-breach-2026-08"
