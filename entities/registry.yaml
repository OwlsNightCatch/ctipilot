    name: "Digitaal Vlaanderen compromise disclosed in the Stykas North Korea victim-set research"
    aliases: []
    nexus: north-korea-nexus
    summary: "Researcher Vangelis Stykas disclosed at Black Hat USA on 2026-08-05, from nearly two years of maintained access to North Korean actors' servers, that 1,640 organisations across 57 countries were impacted, 700 to 800 of them with intrusions he describes as really damaging. Digitaal Vlaanderen, part of the Flemish Government in Belgium, confirmed to WIRED that Belgium's Centre for Cybersecurity notified it on 2026-03-03, that the affected workstation was isolated and exposed credentials rotated, and that the incident is contained and remediated. Compromised external contractors holding access to many organisations at once — up to 30 in cases Stykas observed — were the principal blast-radius multiplier."
    first_seen: 2026-08-08
    relations:
      - to: "campaign:contagious-interview"
        type: related-to
        source: "2026-08-08/dprk-contagious-interview-blast-radius-flemish-government"
        note: "WIRED reports the fake-interview technique behind the victim set is the one Microsoft tracks as the Contagious Interview campaign, active since as early as 2022; the reporting does not assign the victim set itself to that campaign"
  - key: "incident:metabase-sqli-zeroday-2026-08"
    type: incident
    name: "Metabase unauthenticated SQL-injection zero-day exploitation (August 2026)"
    aliases: ["Metabase reset_password zero-day"]
    nexus: null
    summary: "Metabase disclosed on 2026-08-06 that its Metabase Cloud platform was attacked through a previously unknown vulnerability affecting versions 1.58 and above: an unauthenticated caller injects arbitrary SQL against the application database via the /api/session/reset_password endpoint and obtains administrator access to the instance, exposing stored credentials for connected databases and any data reachable through them. No CVE identifier was assigned. Framework and Tally each confirmed customer data was stolen from their instances on 2026-08-03; no other organisation has been reported as having data taken through this flaw."
    first_seen: 2026-08-09
  - key: "policy:eu-ai-act-digital-omnibus-2026"
    type: policy
    name: "EU AI Act Digital Omnibus (Regulation (EU) 2026/1744)"
    aliases: ["Digital Omnibus on AI", "AI Act Omnibus", "Regulation (EU) 2026/1744"]
    nexus: eu-nexus
    summary: "Regulation amending the EU AI Act (Regulation (EU) 2024/1689), published in the Official Journal on 24 July 2026 and in force from 27 July 2026, which rewrites Article 113's application-date carve-outs: high-risk obligations for standalone Annex III systems move to 2 December 2027, Annex I embedded high-risk systems to 2 August 2028, and Articles 102-110 apply from 27 July 2026 (EUR-Lex, 2026-07-24)."
    first_seen: 2026-08-09
  - key: "policy:cisa-ci-fortify-ot-isolation-guidance-2026"
    type: policy
    name: "CI Fortify — Advice for isolating vital systems"
    aliases: ["CI Fortify Initiative", "CI Fortify OT isolation guidance"]
    nexus: null
    summary: "Joint guidance from CISA, the Australian Signals Directorate's ACSC (lead author), NCSC UK and the Canadian Centre for Cyber Security, first published 28 July 2026, giving critical-infrastructure operators a structured method to isolate vital operational technology and its enabling systems during a cyber incident — including the instruction to treat any carrier-provided service as untrusted and to implement encryption over such links on a dedicated device rather than in the OT device itself (ASD ACSC, 2026-07-28)."
    first_seen: 2026-08-09
  - key: "policy:ncsc-uk-forensic-observability-network-devices-2026"
    type: policy
    name: "NCSC UK forensic observability for network devices"
    aliases: ["Making forensic observability the norm for network devices"]
    nexus: null
    summary: "NCSC UK publication of 29 July 2026 urging buyers to make forensic observability — telemetry, logging, configuration state and the ability to collect forensic data from memory and data at rest — a standard procurement evaluation criterion for edge network devices, and confirming that an international reference architecture for vendors is in development (NCSC UK, 2026-07-29)."
    first_seen: 2026-08-09
  - key: "policy:cisa-sbom-minimum-elements-2026"
    type: policy
    name: "2026 Minimum Elements for a Software Bill of Materials"
    aliases: ["CISA SBOM Minimum Elements 2026", "2026 SBOM Minimum Elements"]
    nexus: null
    summary: "Guidance published 29 July 2026 by CISA, the NSA, the FBI and fifteen international co-authoring agencies including BSI, ANSSI and NCSC-NL, replacing NTIA's 2021 SBOM minimum elements: it confirms applicability to open-source, AI and SaaS software and adds component hash value and algorithm, component licence, SBOM author signature, tool name and version, and generation context as required data elements (CISA, 2026-07-29)."
    first_seen: 2026-08-09
  - key: "policy:netherlands-nis2-cyberbeveiligingswet-2026"
    type: policy
    name: "Netherlands Cyberbeveiligingswet (NIS2 transposition)"
    aliases: ["Cbw", "Cyberbeveiligingswet", "Dutch NIS2 law"]
    nexus: eu-nexus
    summary: "Dutch NIS2-transposition law approved by the Eerste Kamer on 7 July 2026 and entering into force on 15 August 2026, replacing the Wbni and imposing registration in NCSC-NL's national entity register, a duty of care, an incident-notification duty and board-level accountability on more than 8,000 organisations across 18 sectors (Rijksoverheid, 2026-07-07)."
    first_seen: 2026-08-09
  - key: "policy:germany-nis2-registration-forbearance-2026"
    type: policy
    name: "Germany NIS2 registration deadline and enforcement gap"
    aliases: ["BSI NIS2 Registrierungspflicht", "NIS-2-Umsetzungsgesetz Registrierungspflicht"]
    nexus: eu-nexus
    summary: "Germany's NIS2-Umsetzungsgesetz statutory registration duty, whose deadline BSI's own landing page recorded as expired when checked on 9 August 2026. BSI states roughly 29,500 entities are obligated; the Federal Government's written answer to parliament records 11,388 registered as of 5 March 2026 (Bundestag Drucksache 21/4657). Later counts and a 31 July 2026 grace period circulate attributed to BSI but were not confirmed against a first-party BSI publication."
    first_seen: 2026-08-09
  - key: "policy:switzerland-isv-federal-isms-deadline-2026"
    type: policy
    name: "Swiss ISV Article 51 federal-administration ISMS transition deadline"
    aliases: ["Informationssicherheitsverordnung Uebergangsbestimmungen", "ISV Art. 51"]
    nexus: null
    summary: "The Swiss Informationssicherheitsverordnung (SR 128.1), in force since 1 January 2024, requires the federal administrative units falling under its Article 2(1)(c) to build their own information-security management system within three years of entry into force — i.e. by 1 January 2027 — per Article 51(4) (Fedlex, ordinance text)."
    first_seen: 2026-08-09
  - key: "trend:passkey-webauthn-attack-surface-2026-08"
    type: trend
    name: "Passkey / WebAuthn attack-surface disclosure convergence (2026-08)"
    aliases: ["Pass-ta-key", "Pass-the-Passkey", "Borrowing Windows Hello keys"]
    nexus: null
    summary: "Cluster of independent research and criminal activity published in ISO week 2026-W32 attacking passkey and WebAuthn authenticators from multiple directions: Unit 42's Pass-ta-key work against Chrome/Google synced passkeys, Google Threat Intelligence Group's UNC6671 reporting on vishing whose pretext is a FIDO2 passkey enrolment, and Black Hat USA 2026 work by Dirk-jan Mollema on borrowing Windows Hello for Business keys to authenticate to Microsoft Entra ID (no CVE, not patched) and by Michael Grafnetter on a related class whose event-log element is CVE-2026-34348. The grouping is an analytical cluster surfaced by this pipeline, not an attribution claim by any cited source."
    first_seen: 2026-08-09
  - key: "actor:interlock"
    type: actor
    name: "Interlock"
    aliases: ["GOLD EMBRACE"]
    nexus: null
    summary: "Financially motivated double-extortion ransomware group operating the Interlock encryptor, first observed in late September 2024 and tracked by Sophos Counter Threat Unit as GOLD EMBRACE; targets organisations across North America and Europe. In a March 2026 intrusion investigated by Sophos, the operator reached credential access by acquiring a physical-memory image with WinPmem and running Volatility3's hash-dump and cached-credential plugins against it offline, in place of a commodity credential dumper (Sophos X-Ops, 2026-08-07)."
    first_seen: 2026-08-10
    relations:
      - to: "malware:nodesnake"
        type: uses
        source: "2026-08-10/interlock-volatility3-winpmem-credential-theft"
        note: "Sophos records the Node.js-based remote-access trojan re-established through a scheduled task masquerading as the built-in defragmentation task"
  - key: "malware:nodesnake"
    type: malware
    name: "NodeSnake"
    aliases: []
    nexus: null
    summary: "Node.js-based remote-access trojan used by the Interlock/GOLD EMBRACE ransomware operation for persistence after ClickFix delivery, executed via a bundled node.exe launched from a scheduled task named to imitate the built-in Windows disk-defragmentation task (Sophos X-Ops, 2026-08-07)."
    first_seen: 2026-08-10
  - key: "campaign:groupib-xmrig-pam-forensic-smokescreen"
    type: campaign
    name: "PAM-impersonation Monero-mining campaign"
    aliases: []
    nexus: null
    summary: "Covert Monero-mining intrusion documented by Group-IB (published 2026-07-30, activity observed May 2026). Initial access came through a trusted third-party relationship; after escalating to root the operator abused the pam_rootok policy to assume the identities of multiple low-privileged users without their passwords, planted redundant cron persistence across those unmonitored accounts, stopped core logging services, tampered with authentication logs, and ran a self-unlinking payload entirely from memory."
    first_seen: 2026-08-10
  - key: "report:intrinsec-ai-agents-digital-forensics-series"
    type: report
    name: "Intrinsec AI Agents X Digital Forensics series"
    aliases: []
    nexus: null
    summary: "CERT Intrinsec forensic-artefact-mapping series for autonomous AI coding-agent CLIs: Part 1 on OpenCode (2026-07-27) and Part 2 on OpenAI Codex CLI (2026-07-31), documenting on-disk configuration, session databases, prompt history and authentication files including cleartext API keys and access tokens."
    first_seen: 2026-08-10
  - key: "actor:unc5537"
    type: actor
    name: "UNC5537"
    aliases: ["Judische", "Waifu"]
    nexus: null
    summary: "Mandiant-designated cluster behind the 2024 mass credential-based extortion campaign against customer tenants of a shared cloud data platform. Connor Riley Moucka, a Canadian national operating principally as Judische and Waifu, pleaded guilty on 2026-08-05 to four federal counts over a campaign the U.S. Department of Justice records as compromising over 165 victim organisations, stealing billions of customer records and yielding over $2.5 million in ransom payments; sentencing is set for 2026-10-27. The access path was stolen credentials against tenants that did not enforce multi-factor authentication, with no vulnerability in the provider alleged (DOJ, 2026-08-05; KrebsOnSecurity, 2026-08-06)."
    first_seen: 2026-08-10
  - key: "actor:cameron-wagenius"
    type: actor
    name: "Cameron Wagenius"
    aliases: ["Kiberphant0m"]
    nexus: null
    summary: "U.S. Army soldier and admitted co-conspirator in the 2024 cloud-tenant extortion campaign, who pleaded guilty in July 2025 to extorting two telecommunications carriers for customer account data; sentencing scheduled for 2026-09-03 (KrebsOnSecurity, 2026-08-06)."
    first_seen: 2026-08-10
    relations:
      - to: "actor:unc5537"
        type: collaborates-with
        source: "2026-08-10/unc5537-moucka-guilty-plea-saas-tenant-extortion-template"
        note: "KrebsOnSecurity names Wagenius as one of Moucka's admitted co-conspirators; the DOJ release names no co-conspirators"
  - key: "incident:zabka-supplier-account-jira-gitlab-secrets-2026-07"
    type: incident
    name: "Zabka supplier-account ticketing-system intrusion"
    aliases: ["Żabka Jira incident"]
    nexus: null
    summary: "Unauthorised access at Żabka, Poland's largest convenience-store franchise chain, confirmed by the company at the start of August 2026: the access came through an external service provider's account and, to Żabka's stated current knowledge, reached the ticketing system; it was detected and immediately blocked, with the data-protection regulator, law enforcement and CERT Polska notified. A criminal-forum seller separately claimed a far larger scope reaching source-code repositories and production infrastructure — a claim the reporting outlets explicitly frame as the attacker's own and unverified (Niebezpiecznik, Sekurak, 2026-08-03)."
    first_seen: 2026-08-10
  - key: "trend:natjack-nat-trust-assumption-attack-class"
    type: trend
    name: "NatJack"
    aliases: ["NAT trust-assumption attack class"]
    nexus: null
    summary: "Attack class presented at Black Hat USA 2026 against the unstated assumption that devices sharing a network-address-translation table can trust one another, comprising five primitives: TCP session hijack by downstream spoofing, the same hijack coordinated with an upstream attacker-controlled server, DNS response hijack, disclosure of a victim's externally mapped address and port, and NAT-table exhaustion. Three CVEs are assigned: CVE-2026-56181 (Windows NAT / Hyper-V, downstream spoofing), CVE-2026-56179 (Windows NAT / Hyper-V, upstream spoofing; the Windows mitigation ships disabled by default and enabled only via a registry key) and CVE-2026-63913 (Linux netfilter, a partial mitigation rather than a complete fix); the remaining primitives carry no identifier and no vendor fix."
    first_seen: 2026-08-10
  - key: "trend:coding-agent-ci-harness-trust-boundary-2026-08"
    type: trend
    name: "Coding-agent CI harness trust-boundary failures"
    aliases: []
    nexus: null
    summary: "Cluster of three independently root-caused trust-boundary failures in AI coding-agent continuous-integration harnesses, published by Novee Security at Black Hat USA 2026 (2026-08-05): a Claude Code Action command validator that strips single-quoted content before inspecting a command and a read-only allowlist exempt from path checking (CVE-2026-54316, fixed 2026-06-13); a Gemini CLI harness flaw (CVE-2026-12537, fixed 2026-04-24); and an OpenAI Codex workflow in which two agent passes shared one checkout, letting the first pass rewrite the agent instruction file the second pass treats as authoritative — the last carrying no CVE and fixed only in the vendor's own repository."
    first_seen: 2026-08-10
  - key: "incident:retelit-qilin-2026"
    type: incident
    name: "Retelit / Qilin extortion attack"
    aliases: []
    nexus: null
    summary: "Extortion attack on Retelit, one of Italy's largest business telecommunications and cloud operators, claimed by Qilin with a leak-site post on 11 July 2026, a sample published 14 July and a larger dump between 30 July and 1 August; IrpiMedia counted 270,000 files listed and estimated at least 300 GB. Retelit issued no public statement through its own channels and gave its account only in a right-of-reply to IrpiMedia after publication, confirming an 8 June 2026 attack attributed to Qilin, notified to ACN, CSIRT-ITA, the postal police and the data-protection Garante, and scoped to virtualisation infrastructure in 3 of 38 national data centres. IrpiMedia names those sites as Verona, Rome and Milan, the last being the site certified for Retelit's own backup and continuity capability, and reports customer complaints of backup-recovery failure (IrpiMedia, 2026-08-04 / 2026-08-06)."
    first_seen: 2026-08-10
    relations:
      - to: "actor:qilin"
        type: attributed-to
        source: "2026-08-10/retelit-qilin-italian-telco-cloud-operator-public-sector"
        note: "Retelit's own right-of-reply attributes the 8 June 2026 attack to Qilin, matching Qilin's leak-site claim of 11 July"
  - key: "actor:gunra"
    type: actor
    name: "Gunra"
    aliases: ["Golden Community"]
    nexus: null
    summary: "Double-extortion ransomware-as-a-service that the FBI first observed in April 2025 and which the authoring agencies of joint advisory AA26-222A assess to be based on, or significantly influenced by, the Conti source code leaked in 2022. It formalised an affiliate programme on criminal forums as of January 2026, supplying a management panel, a configurable builder and cross-platform lockers, and also operates under the name Golden Community. Initial access is primarily exploitation of known FortiOS and FortiProxy authentication-bypass flaws on internet-facing appliances; documented tradecraft includes creating a persistent super-user account on the exploited firewall, sniffing VDI authentication traffic from an SSL-VPN appliance, and editing a VDI authentication portal's processing files so one attacker-chosen one-time-password value always validates. The Linux encryptor seeds its keys with the system clock, which the advisory states lets defenders reconstruct keys from file timestamps (FBI/CISA/DC3/NSA/USSS/KNPA, 2026-08-10)."
    first_seen: 2026-08-11
  - key: "incident:ceva-logistics-fulfilment-breach-2026-08"
    type: incident
    name: "CEVA Logistics European fulfilment-systems breach (August 2026)"
    aliases: ["CEVA Logistics order-processing breach 2026"]
    nexus: null
    summary: "Intrusion into order-processing systems at CEVA Logistics, the contract-logistics arm of CMA CGM, which the company confirmed to affected customers on 1 August 2026 and scoped to eight European warehouses. Because CEVA processes fulfilment data for unrelated clients, the compromise produced independent GDPR notification duties at ten organisations, confirmed by the Dutch data protection authority; named affected parties include ING, bol.com, De Bijenkorf, AFC Ajax, Ace & Tate and Valve. bol.com states two order-processing systems at one fulfilment centre were involved and that customer data may have been viewed or copied. No initial-access vector, malware family or actor has been disclosed by any party, CEVA has published no statement of its own, and it disputes that a dataset offered on a criminal forum relates to this incident (bol.com, 2026-08-06; TechCrunch, 2026-08-10; ICTMagazine.nl, 2026-08-10)."
    first_seen: 2026-08-11
  - key: "actor:lazarus-group"
    type: actor
    name: "Lazarus Group"
    aliases: []
    nexus: north-korea-nexus
    summary: "DPRK-linked state threat actor that Check Point Research names as the group the long-running Operation Dream Job campaign is affiliated to. In the 2026 wave Check Point documents it deploying FudModule, which it describes as Lazarus' kernel-mode rootkit, by exploiting a zero-day use-after-free in the Windows Ancillary Function Driver for WinSock (CVE-2026-68820) for SYSTEM privileges, alongside the ForestTiger backdoor it describes as widely attributed to the group and a previously undocumented backdoor named Troy (Check Point Research, 2026-08-11)."
    first_seen: 2026-08-12
  - key: "campaign:operation-dream-job"
    type: campaign
    name: "Operation Dream Job"
    aliases: []
    nexus: north-korea-nexus
    summary: "Long-running fake-job-offer campaign Check Point Research tracks against organisations worldwide with a particular focus on the defence sector, and which it states is affiliated to the DPRK-linked Lazarus group. Its 2026 wave targets defence, aerospace and aviation organisations, with successful targeting observed in Western Europe including France and Germany, and in India; delivery runs through trojanised PDF viewers distributed both as encrypted archives and from SEO-boosted impersonation websites, and command-and-control runs on compromised Roundcube and WordPress servers (Check Point Research, 2026-08-11)."
    first_seen: 2026-08-12
    relations:
      - to: "actor:lazarus-group"
        type: attributed-to
        source: "2026-08-12/lazarus-operation-dream-job-cve-2026-68820-afd-fudmodule"
        note: "Check Point states the campaign is affiliated to the DPRK-linked Lazarus group"
      - to: "malware:mistpen"
        type: uses
        source: "2026-08-12/lazarus-operation-dream-job-cve-2026-68820-afd-fudmodule"
        note: "MISTPEN is the in-memory downloader executed by the DLL-sideloading chain"
      - to: "malware:foresttiger"
        type: uses
        source: "2026-08-12/lazarus-operation-dream-job-cve-2026-68820-afd-fudmodule"
        note: "ForestTiger is the final backdoor delivered by MISTPEN in the sideloading chain"
      - to: "malware:troy-backdoor"
        type: uses
        source: "2026-08-12/lazarus-operation-dream-job-cve-2026-68820-afd-fudmodule"
        note: "Troy is reflectively loaded by the payload the trojanised SecurityPDF viewer extracts"
      - to: "tool:relayshell"
        type: uses
        source: "2026-08-12/lazarus-operation-dream-job-cve-2026-68820-afd-fudmodule"
        note: "RelayShell is planted on compromised Roundcube and WordPress servers used as C2 relay nodes"
  - key: "tool:fudmodule"
    type: tool
    name: "FudModule"
    aliases: []
    nexus: null
    summary: "Kernel-mode rootkit Check Point Research describes as Lazarus' privilege-escalation tool, reported in use since around 2021 and previously documented abusing CVE-2024-38193 in the same Windows afd.sys driver. Version 3.1, analysed in August 2026, retains the FudModule v3 telemetry teardown — process, thread and image notify callbacks, object and registry callbacks, minifilter removal by altitude band, termination of the NT Kernel Logger and crash-dump suppression — and adds Smart App Control tampering that zeroes a code-integrity policy state value and forces an in-place policy reload from a SYSTEM-level msiexec.exe child process (Check Point Research, 2026-08-11)."
    first_seen: 2026-08-12
  - key: "malware:mistpen"
    type: malware
    name: "MISTPEN"
    aliases: []
    nexus: null
    summary: "Lightweight in-memory downloader used in the 2026 Operation Dream Job wave, which retrieves and runs further modules in memory using the Microsoft Graph API against OneDrive as its command-and-control channel. It stages reconnaissance and persistence modules before loading the in-memory privilege-escalation module that exploits CVE-2026-68820, and its final payload in the DLL-sideloading chain is the ForestTiger backdoor (Check Point Research, 2026-08-11)."
    first_seen: 2026-08-12
  - key: "malware:foresttiger"
    type: malware
    name: "ForestTiger"
    aliases: []
    nexus: null
    summary: "Backdoor Check Point Research describes as a well-documented malware family widely attributed to the Lazarus threat group, delivered as the final MISTPEN payload in the DLL-sideloading chain of the 2026 Operation Dream Job wave and providing long-term remote access to the compromised host (Check Point Research, 2026-08-11)."
    first_seen: 2026-08-12
  - key: "malware:troy-backdoor"
    type: malware
    name: "Troy"
    aliases: []
    nexus: null
    summary: "Previously undocumented modular remote-access backdoor first observed in the 2026 Operation Dream Job wave, delivered as a 64-bit DLL reflectively loaded by the executable that the trojanised SecurityPDF viewer extracts from a crafted PDF, and supporting 17 operator commands. Check Point derived the name from a PDB path embedded in the sample and notes the term has appeared in PDB paths of previously documented Lazarus samples (Check Point Research, 2026-08-11)."
    first_seen: 2026-08-12
  - key: "tool:relayshell"
    type: tool
    name: "RelayShell"
    aliases: []
    nexus: null
    summary: "PHP web shell that repurposes compromised web servers as relay nodes in the Operation Dream Job command-and-control infrastructure, deployed on Roundcube webmail and content-management servers reached through leaked credentials combined with CVE-2025-49113. It splits into victim and operator modes and passes operator commands through a file-based channel rather than executing them in the web request itself (Check Point Research, 2026-08-11)."
    first_seen: 2026-08-12
  - key: "actor:storm-1175"
    type: actor
    name: "Storm-1175"
    aliases: []
    nexus: china-nexus
    summary: "Financially motivated ransomware actor that Microsoft Threat Intelligence links to China and which it previously described as running high-velocity ransomware campaigns exploiting recently disclosed and zero-day flaws in internet-facing software, in some cases a week before public disclosure, moving from initial access to full encryption in under 24 hours. It used Medusa ransomware against healthcare, professional services and finance organisations in Australia, Britain and the United States; from 2 August 2026 Microsoft observed it deploying a new strain, StormEncryptor, and assesses it is likely exploiting CVE-2026-18577 in N-able N-central, without formally confirming the access vector (Microsoft Threat Intelligence via The Record, 2026-08-10)."
    first_seen: 2026-08-12
    relations:
      - to: "malware:stormencryptor"
        type: uses
        source: "2026-08-12/n-able-n-central-storm-1175-stormencryptor"
        note: "Microsoft Threat Intelligence reports Storm-1175 began deploying StormEncryptor on 2 August 2026"
  - key: "malware:stormencryptor"
    type: malware
    name: "StormEncryptor"
    aliases: []
    nexus: null
    summary: "Previously undocumented ransomware strain Microsoft Threat Intelligence reports Storm-1175 began deploying on 2 August 2026, the day the N-able N-central authentication-bypass flaw CVE-2026-18577 was disclosed. It marks the actor's departure from the Medusa ransomware it had used previously (Microsoft Threat Intelligence via The Record, 2026-08-10)."
    first_seen: 2026-08-12
  - key: "trend:shieldbreak-defender-rogueplanet-patch-bypass-2026-08"
    type: trend
    name: "ShieldBreak"
    aliases: []
    nexus: null
    summary: "Proof-of-concept published by the Nightmare Eclipse persona on 11-12 August 2026 and described by the researcher as a full bypass of the patch Microsoft shipped in July for RoguePlanet (CVE-2026-50656), the Microsoft Malware Protection Engine elevation-of-privilege flaw fixed in engine build 1.1.26060.3008 on 9 July 2026. It is listed with a 100 percent success rate where RoguePlanet was an unreliable race condition, and as tested on Windows Server 2025 alongside Windows 11 25H2 and the Canary channel. No patch exists, no vendor had publicly reproduced it and Microsoft had not commented at publication; application allowlisting is the control reported to block the predecessor by default (Cyber Kendra, 2026-08-12; Rapid7, 2026-08-11)."
    first_seen: 2026-08-12
  - key: "incident:stiftung-brandenburgische-gedenkstaetten-ransomware-2026-08"
    type: incident
    name: "Stiftung Brandenburgische Gedenkstätten ransomware attack (August 2026)"
    aliases: []
    nexus: null
    summary: "Ransomware attack detected on 5 August 2026 against the German public-law foundation that operates seven memorial sites including Sachsenhausen and Ravensbrück, funded by the Brandenburg state ministry for science and culture and the federal commissioner for culture and media. Parts of the IT systems and data were encrypted and a ransom note left; the foundation states it must assume data was downloaded before encryption. All seven sites and the central office are affected, all network and internet connections were disconnected, and the foundation is rebuilding its IT from scratch rather than restoring from backup, with a BSI-recommended incident-response provider. No actor, ransomware family or initial-access vector has been disclosed (Stiftung Brandenburgische Gedenkstätten, 2026-08-11; heise online, 2026-08-11)."
    first_seen: 2026-08-12
  - key: "incident:mydr-poland-ehr-breach-2026"
    type: incident
    name: "MyDr electronic health record platform breach (Poland, 2026)"
    aliases: ["MyDr PESEL breach", "wyciek danych MyDr"]
    nexus: null
    summary: "Intrusion into MyDr, one of Poland's largest electronic medical record platforms, serving thousands of healthcare facilities. The company confirmed on 12 August 2026 that it had been the target of a deliberate external criminal act affecting part of its data, likely historical data from 2024 and earlier, and that it could not yet state the quantity or type of data involved. People presenting as the perpetrators claim 18,814,422 unique PESEL national identity numbers and 2.5 TB of data, and describe an access chain — remote code execution via an XXE flaw in PKCS#12 certificate handling, then a GitHub API key, source code and AWS infrastructure — that the reporting outlet states it could not independently verify. Because MyDr is a GDPR processor and the controllers are thousands of individual clinics, affected individuals cannot be notified centrally (MyDr, 2026-08-12; Zaufana Trzecia Strona, 2026-08-10)."
    first_seen: 2026-08-13
  - key: "incident:acro-criminal-records-office-cms-breach-2022"
    type: incident
    name: "ACRO Criminal Records Office website and CMS compromise (2022-2023)"
    aliases: []
    nexus: null
    summary: "Unauthorised access to the public website and content management system of ACRO Criminal Records Office, the UK national policing body running criminal-record-check services, between August 2022 and March 2023. Personal data of up to 10,920 people was staged for exfiltration, including National Insurance numbers, passport and driving licence details, bank account information, biometric data and criminal-offence records; ACRO could not determine conclusively whether it was removed. The UK Information Commissioner's Office issued a reprimand dated 7 August 2026 and announced on 12 August 2026 for infringements of UK GDPR Article 32, finding that patch management had been outsourced without clear internal accountability for identifying critical CMS updates and that security alerts were not adequately investigated, while crediting network segmentation with preventing movement into core systems (UK Information Commissioner's Office, 2026-08-12)."
    first_seen: 2026-08-13
  - key: "malware:windrelay"
    type: malware
    name: "WindRelay"
    aliases: []
    nexus: null
    summary: "Purpose-built Android NFC-relay malware family first documented by Group-IB on 12 August 2026, which captures contactless card data at the moment of tap and relays it in real time to a second device the fraudster presents to a physical payment terminal. It is installed silently by a paired SpyNote remote-access trojan during a live voice-phishing call and requests a permission set built for the fraud, including near-field communication, network access, contacts, an unusual diagnostic-dump permission and custom self-declared permissions that hinder security tooling. Group-IB correlated 23 samples uploaded to a public malware-sharing service between November 2025 and July 2026, impersonating institutions in Czechia, Slovakia and Slovenia (Group-IB, 2026-08-12)."
    first_seen: 2026-08-13
    relations:
      - to: "malware:spynote"
        type: related-to
        source: "2026-08-13/windrelay-nfc-relay-spynote-rat-live-call-bank-fraud"
        note: "Group-IB reports the two are deployed together, with SpyNote's Accessibility Service access used to sideload and activate WindRelay silently"
  - key: "malware:spynote"
    type: malware
    name: "SpyNote"
    aliases: ["SpyNote RAT"]
    nexus: null
    summary: "Long-running commodity Android remote access trojan distributed through a builder toolkit that lets an operator compile a per-victim application with a chosen label, name and package before deployment. In the fraud scheme Group-IB documented on 12 August 2026 the label carried the victim's own name as a trust-abuse tactic, and the trojan's Accessibility Service access was used to install a second-stage NFC-relay component silently, without triggering screen-sharing detection (Group-IB, 2026-08-12)."
    first_seen: 2026-08-13
  - key: "incident:france-dgfip-tax-breach-2026-08"
    type: incident
    name: "DGFiP tax-authority intrusion (France, 2026)"
    aliases: ["DGFiP breach"]
    nexus: null
    summary: "Intrusions into the information system of France's Direction générale des Finances publiques during June and July 2026, carried out with impersonated credentials of a DGFiP agent and of an authorised third party. The ministry confirmed on 14 August 2026 that the accesses had been used to view and extract data on 678,000 individuals and businesses — reference taxable income, family quotient, withholding rates, company names and SIREN identifiers, and cadastral data on property addresses and surface areas. DGFiP cut the accounts on detection, but its access reviews at the time did not establish that data had been stolen; that emerged only from investigations opened after the dataset was advertised on a cybercrime forum on 12 August (Ministère de l'Économie et des Finances, 2026-08-14)."
    first_seen: 2026-08-15
    relations:
      - to: "actor:zerobytes"
        type: attributed-to
        source: "2026-08-15/france-dgfip-tax-authority-credential-intrusion"
        note: "Self-claimed rather than government-attributed: the actor advertised the stolen dataset on a cybercrime forum and claimed retained access, a claim the French government disputes"
  - key: "actor:zerobytes"
    type: actor
    name: "ZeroBytes"
    aliases: []
    nexus: null
    summary: "Alias used by the party that advertised the stolen French DGFiP tax dataset on a cybercrime forum on 12 August 2026, claimed the database held details of more than 2 million French taxpayers against the 678,000 the ministry has established, claimed a multi-factor-authentication bypass, and claimed continued access to DGFiP systems — a claim the French government disputes (The Register, 2026-08-14)."
    first_seen: 2026-08-15
  - key: "incident:nhs-blood-transplant-pager-breach-2026-08"
    type: incident
    name: "NHS Blood and Transplant unencrypted pager exposure"
    aliases: ["NHSBT pager breach"]
    nexus: null
    summary: "NHS Blood and Transplant routinely transmitted transplant-patient names, dates of birth, organ types, tissue-match scores and immunosuppression risk factors to hospital transplant teams over an unencrypted pager network, unaware the channel carried no encryption. Disclosed by a BBC investigation on 14 August 2026; NHSBT acknowledged the data breach after being alerted, reported it to the UK Information Commissioner's Office and stopped sending patient data by that route. Because pager broadcasts are one-way and receivers cannot be tracked, NHSBT states it cannot determine whether the data was accessed or how many people are affected (BBC News, 2026-08-14)."
    first_seen: 2026-08-15
  - key: "incident:threema-nine-ddos-2026-08"
    type: incident
    name: "Threema / Nine DDoS campaign (August 2026)"
    aliases: []
    nexus: null
    summary: "A series of large-scale, continuously adapting distributed denial-of-service attacks that targeted the Swiss encrypted messenger Threema and its Swiss colocation partner Nine over two days in August 2026, causing a four-hour outage on the Tuesday evening and intermittent interruptions into Wednesday. Threema states it is unclear whether it was the primary target, that only availability was affected and no systems or data were accessed, and that customers running Threema OnPrem on their own infrastructure were unaffected throughout (Threema, 2026-08-14)."
    first_seen: 2026-08-15
  - key: "actor:mustang-panda"
    type: actor
    name: "Mustang Panda"
    aliases: ["HoneyMyte"]
    nexus: null
    summary: "Cyber-espionage group, tracked by Kaspersky as HoneyMyte and stated by it to be also known as Mustang Panda, conducting campaigns against organisations across Asia and Russia. It uses PlugX as its initial post-compromise implant before transitioning to the CoolClient secondary backdoor, and has previously fielded kernel-mode functionality in its ToneShell malware family (Kaspersky Securelist, 2026-08-14)."
    first_seen: 2026-08-15
    relations:
      - to: "malware:coolclient"
        type: uses
        source: "2026-08-15/mustang-panda-coolclient-signed-kernel-driver-rootkit"
        note: "Kaspersky attributes the CoolClient backdoor family to this group"
      - to: "malware:plugx"
        type: uses
        source: "2026-08-15/mustang-panda-coolclient-signed-kernel-driver-rootkit"
        note: "Kaspersky reports PlugX as the initial post-compromise implant preceding CoolClient across the observed intrusions"
      - to: "malware:toneshell"
        type: uses
        source: "2026-08-15/mustang-panda-coolclient-signed-kernel-driver-rootkit"
        note: "Kaspersky names ToneShell as the family in which the group previously introduced kernel-mode functionality"
  - key: "malware:coolclient"
    type: malware
    name: "CoolClient"
    aliases: []
    nexus: null
    summary: "Multi-stage Windows backdoor family attributed by Kaspersky to Mustang Panda (HoneyMyte) and consistently deployed as a secondary implant following a PlugX infection. The variant documented on 14 August 2026 adds a previously undocumented kernel-mode driver installed as a Windows service, implementing 33 IOCTL handlers covering process, file and registry concealment and a hook that strips the implant's own command-and-control addresses from the network information Windows returns to user-mode tools. The driver is deployed only where the implant already holds Service Control Manager access and SeTcbPrivilege (Kaspersky Securelist, 2026-08-14)."
    first_seen: 2026-08-15
  - key: "malware:plugx"
    type: malware
    name: "PlugX"
    aliases: []
    nexus: null
    summary: "Long-running remote-access implant. In the Mustang Panda intrusions Kaspersky documented in August 2026 it serves as the initial post-compromise implant, deployed before the group transitions to its CoolClient secondary backdoor (Kaspersky Securelist, 2026-08-14)."
    first_seen: 2026-08-15
  - key: "malware:toneshell"
    type: malware
    name: "ToneShell"
    aliases: []
    nexus: null
    summary: "Malware family associated with Mustang Panda (HoneyMyte) in which, per Kaspersky, the group previously introduced kernel-mode functionality — cited as the design precedent for the kernel-mode driver added to CoolClient in 2026 (Kaspersky Securelist, 2026-08-14)."
    first_seen: 2026-08-15
  - key: "tool:jwr-phishing-framework"
    type: tool
    name: "JWR"
    aliases: []
    nexus: null
    summary: "Phishing-as-a-service client framework, internally branded JWR by its developer and dissected by Cisco Talos on 13 August 2026. It holds an AES-CTR-encrypted WebSocket open between the victim's browser and the operator's console for the whole session, streaming keystrokes so the operator sees partial card numbers, passwords and verification codes as they are typed, and lets the operator direct the victim to an SMS, authenticator-app, PIN or two-factor verification page at the moment a one-time code is needed. It impersonates login and checkout flows for several payment gateways including Shopify, PayPal, Apple, Klarna and banks, and was observed delivered through SMS lures about toll and courier fees (Cisco Talos, 2026-08-13)."
    first_seen: 2026-08-15
    relations:
      - to: "campaign:outsider-phaas-gemini-2026"
        type: related-to
        source: "2026-08-15/jwr-phishing-framework-realtime-operator-websocket-mfa"
        note: "Talos assesses with medium confidence that JWR is a variant of The Outsider, based on similarities in the client engine scripts and functionality of the two platforms"
  - key: "actor:jewelbug"
    type: actor
    name: "Jewelbug"
    aliases: ["Earth Alux", "REF7707", "CL-STA-0049"]
    nexus: china-nexus
    summary: "China-based hackers-for-hire group that Symantec's Threat Hunter Team describes as running two missions from one team, shared infrastructure and a single control panel: espionage against government ministries and militaries across the Middle East, Southeast Asia and South Asia, and a for-profit cryptocurrency-fraud business aimed at Chinese-speaking victims. Symantec states the group is also tracked as Earth Alux, REF7707 and CL-STA-0049, and assesses with high confidence that its fraud and search-engine-optimisation arm is run by the sole legal representative of a registered Changsha company, on the basis of government-issued identity documents, a business licence and a signed authorisation letter recovered from the operators. Its largest documented operation compromised a state telecommunications provider's shared web-hosting platform to plant a watering hole on more than 15 government webmail tenants at once (Symantec Threat Hunter Team, 2026-08-13)."
    first_seen: 2026-08-16
    relations:
      - to: "tool:xg-web"
        type: uses
        source: "2026-08-16/jewelbug-pdf-viewer-extension-native-messaging-webmail-hole"
        note: "Symantec states both the espionage and crypto-fraud missions are administered from a single control panel, XG-Web"
      - to: "malware:antino"
        type: uses
        source: "2026-08-16/jewelbug-pdf-viewer-extension-native-messaging-webmail-hole"
        note: "Symantec names Antino as the group's main implant and Windows backdoor"
      - to: "malware:jewelbug-pdf-viewer-extension"
        type: uses
        source: "2026-08-16/jewelbug-pdf-viewer-extension-native-messaging-webmail-hole"
        note: "Symantec describes the malicious Chrome and Firefox extension posing as 'PDF Viewer' as the group's primary implant"
      - to: "malware:clientking"
        type: uses
        source: "2026-08-16/jewelbug-pdf-viewer-extension-native-messaging-webmail-hole"
        note: "Symantec counts 37 builds of the Rust implant the group's developers call ClientKing, reaching servers and network devices"
  - key: "tool:xg-web"
    type: tool
    name: "XG-Web"
    aliases: []
    nexus: null
    summary: "Jewelbug's browser-centric remote-access and information-stealing control panel — a React front end over a Node.js backend with a MySQL database that doubles as the rendezvous point for victim implants. Its developers describe it in their own documentation as a 'penetration-testing platform', while its internal function names include browser hijacking, data theft and man-in-the-middle attack. It administers both the group's government-espionage campaigns and its cryptocurrency-fraud operation, and its victim database recorded more than one million implant check-in rows and more than 580,000 stolen browser cookies (Symantec Threat Hunter Team, 2026-08-13)."
    first_seen: 2026-08-16
  - key: "malware:antino"
    type: malware
    name: "Antino"
    aliases: []
    nexus: null
    summary: "Jewelbug's Windows backdoor, delivered through malicious HTML Application downloaders themed on current geopolitical events and as a fake Adobe Flash or Adobe installer downloaded from group-controlled domains. It uses the Microsoft Graph API as its command-and-control channel so its traffic sits inside legitimate Microsoft cloud services, and on installation it side-loads the group's 'PDF Viewer' browser extension into the victim's browser profile, drops the native-messaging helper and writes the registry value that enables it (Symantec Threat Hunter Team, 2026-08-13)."
    first_seen: 2026-08-16
  - key: "malware:jewelbug-pdf-viewer-extension"
    type: malware
    name: "PDF Viewer (Jewelbug browser extension)"
    aliases: []
    nexus: null
    summary: "Jewelbug's primary implant: a malicious extension built for both Chrome and Firefox that masquerades as a document reader while requesting cookies, scripting, debugger access, web-request interception, download monitoring and native messaging across all sites. A background service worker gives the operator a full bridge into the browser API; it harvests credentials by hooking login forms, exfiltrates the cookie jar, subscribes to live cookie-change events to steal new session tokens in near real time, and captures history, bookmarks, screenshots, clipboard and intercepted traffic. It escapes the browser sandbox through a native-messaging host registered under the misleading name com.microsoft.runedge, which runs operator commands through the Windows command interpreter. A clipboard module able to swap copied cryptocurrency addresses is present and was active on victims, but Symantec records that no address-replacement rules were deployed during the observed period (Symantec Threat Hunter Team, 2026-08-13)."
    first_seen: 2026-08-16
  - key: "malware:clientking"
    type: malware
    name: "ClientKing"
    aliases: []
    nexus: null
    summary: "Rust implant developed by Jewelbug for servers and network devices rather than browsers, observed by Symantec across 37 builds spanning x86-64 servers, ARM64 devices and consumer routers. It supports five command-and-control transports including a custom DNS tunnel and offers an interactive shell, SOCKS pivoting and the ability to load kernel modules directly from memory; a companion toolkit adds a kernel-module rootkit and a malicious authentication module hooked into su and sudo to steal credentials. Its command-and-control server was hosted on the same network range as the XG-Web server (Symantec Threat Hunter Team, 2026-08-13)."
    first_seen: 2026-08-16
  - key: "tool:evooo1bot"
    type: tool
    name: "Evooo1Bot"
    aliases: []
    nexus: null
    summary: "Mirai-derived modular Linux botnet documented by FortiGuard Labs on 2026-08-13 and active since at least July 2026, named after a hardcoded string present in every sample. It reuses the leaked Mirai denial-of-service engine and adds encrypted command-and-control over TCP/443, an SSH brute-force scanner with a 150-entry dictionary carrying enterprise service-account names and two-stage honeypot detection, a SOCKS5 relay in both direct and reverse modes, an HTTP credential sniffer that reads the kernel TCP connection table for Basic-Auth and cookie headers, and an exploit module that reaches Atlassian Confluence, WSO2 products and the Kubernetes ingress-nginx admission controller alongside the usual consumer router, camera and OT-gateway targets (FortiGuard Labs, 2026-08-13)."
    first_seen: 2026-08-16
  - key: "actor:krybit"
    type: actor
    name: "Krybit"
    aliases: []
    nexus: null
    summary: "Newly active ransomware leak-site operation identified by Check Point Research in its State of Ransomware Q2 2026 report (2026-08-13) as one of the quarter's fastest-growing groups. Check Point records that Krybit, alongside The Gentlemen, targets the United States noticeably less often than the ecosystem average, and names the two of them as the main reason the US share of leak-site victims fell from 50% in Q1 2026 to 42% in Q2. No tooling, initial-access tradecraft or attribution is published for the group in that report."
    first_seen: 2026-08-16
  - key: "report:dragos-industrial-ransomware-q2-2026"
    type: report
    name: "Dragos Industrial Ransomware Analysis: Q2 2026"
    aliases: []
    nexus: null
    summary: "Dragos's quarterly analysis of ransomware affecting industrial organisations, published 2026-08-10. Identifies 1,140 incidents in Q2 2026, a 12% increase over Q1's 1,020, with manufacturing the most affected sector at 747 incidents (65%) and ICS-related organisations second at 117; the United States is the most impacted country at 431 incidents (38%) while Germany showed the greatest quarter-over-quarter increase, from 37 incidents to 68. Its load-bearing negative finding for OT defenders is that Dragos observed no case in Q2 2026 in which a ransomware operator reached Stage 2 of the ICS Cyber Kill Chain or directly manipulated a control system — operational disruption followed compromise of the enterprise and virtualisation systems OT depends on."
    first_seen: 2026-08-16
  - key: "report:checkpoint-state-of-ransomware-q2-2026"
    type: report
    name: "Check Point Research: The State of Ransomware Q2 2026"
    aliases: []
    nexus: null
    summary: "Check Point Research's quarterly cross-sector ransomware landscape report, published 2026-08-13 from data-leak-site victim data. Counts 2,139 victims in Q2 2026, essentially flat quarter over quarter and up 33% year over year, with the top ten groups' share falling from 71% to 57.6% while the number of active groups climbed from 71 to 93, a new high for the tracked period. Records Qilin as the most prolific operator for a fourth straight quarter at 279 victims despite a 17% fall, The Gentlemen surging 62% to 269, the US victim share falling from 50% to 42%, ransom payment rates at a multi-year low near 23%, and a narrowing exploitation window with AI increasingly cited as the accelerant."
    first_seen: 2026-08-16
  - key: "actor:apt36"
    type: actor
    name: "APT36"
    aliases:
      - "Transparent Tribe"
    nexus: null
    summary: "Pakistan-linked espionage cluster historically documented against government, military and diplomatic organisations in India and the wider South Asian region. Acronis Threat Research Unit assesses with moderate confidence that the PATCHCORD / SHEETCORD / HACKERAI activity against Afghan telecom providers and South Asian critical infrastructure overlaps with this cluster or a closely related Pakistan-linked actor, resting on sustained Afghan telecom and government targeting, a browser-credential harvesting tool previously seen in the group's operations, a command-and-control framework independently documented as part of its toolkit, and a Google Sheets channel resembling earlier work attributed at medium confidence to the same cluster (Acronis TRU, 2026-08-13)."
    first_seen: 2026-08-17
  - key: "malware:patchcord"
    type: malware
    name: "PATCHCORD"
    aliases: []
    nexus: null
    summary: "Compiled C/C++ Windows backdoor delivered through Inno Setup installers impersonating Afghan Telecom service-management and VPN software and Afghanistan's Ministry of Communications and Information Technology. It persists by rewriting Microsoft Edge, Google Chrome and Mozilla Firefox shortcuts across five locations to launch itself with the real browser path as an argument while preserving the original icon, fingerprints the host, and polls a hardcoded server. Its most consequential command decodes an operator-supplied payload and executes it entirely in memory via VirtualAlloc, VirtualProtect and CreateThread, writing nothing to disk. A different variant, used in what Acronis calls an earlier campaign against India's energy sector in March 2026, carries virtual-machine, debugger, analysis-process and user-input checks that trigger a randomised sleep rather than process termination (Acronis TRU, 2026-08-13)."
    first_seen: 2026-08-17
    relations:
      - to: "actor:apt36"
        type: overlaps-with
        source: "2026-08-17/patchcord-sheetcord-google-sheets-c2-browser-shortcut-hijack"
        note: "Acronis TRU assesses at moderate confidence that the activity overlaps with the APT36 cluster or a closely related Pakistan-linked actor; the lab states an overlap, not an attribution"
  - key: "malware:sheetcord"
    type: malware
    name: "SHEETCORD"
    aliases: []
    nexus: null
    summary: "Go-based Windows implant from the same operator as PATCHCORD, whose command-and-control runs through the Google Sheets API v4: it authenticates with a cloud service-account credential hardcoded in the binary and creates a per-victim tab in the operator's spreadsheet for bidirectional tasking and results, a design Acronis records as consistent with the previously documented SHEETCREEP implant. It runs commands through PowerShell with script-block wrapping rather than the Windows command interpreter, collects markedly less host information than PATCHCORD, widens the browser-shortcut hijack from three browsers to six by adding Brave, Opera and Vivaldi using a generated temporary script instead of COM interfaces, and adds Startup-folder script persistence with a matching per-user Run key written by shelling out to reg.exe (Acronis TRU, 2026-08-13)."
    first_seen: 2026-08-17
    relations:
      - to: "malware:patchcord"
        type: overlaps-with
        source: "2026-08-17/patchcord-sheetcord-google-sheets-c2-browser-shortcut-hijack"
        note: "Acronis records SHEETCORD as combining functionality previously observed in the SHEETCREEP RAT with capabilities introduced in PATCHCORD, on shared operator infrastructure"
  - key: "malware:hackerai-c2-agent"
    type: malware
    name: "HACKERAI C2 Agent"
    aliases: []
    nexus: null
    summary: "Third implant in the PATCHCORD cluster, distributed from the earliest domain in the operator's infrastructure and named by Acronis Threat Research Unit. It shares the cluster's system fingerprinting, remote command execution and browser-shortcut hijacking, but replaces PATCHCORD's custom HTTP server and SHEETCORD's Google Sheets with GitHub Gists for both tasking and exfiltration — a third distinct command-and-control mechanism across one operator's toolset. Its anti-analysis features are comparatively basic, including a routine that loads placeholder strings in a loop with randomised sleeps to introduce execution delays without calling conventional sleep APIs (Acronis TRU, 2026-08-13)."
    first_seen: 2026-08-17
    relations:
      - to: "malware:patchcord"
        type: overlaps-with
        source: "2026-08-17/patchcord-sheetcord-google-sheets-c2-browser-shortcut-hijack"
        note: "Acronis states HACKERAI C2 Agent shares multiple capabilities with PATCHCORD and SHEETCORD, differing in its command-and-control transport"
  - key: "incident:zurich-lockergoga-megacortex-nefilim-trial-2026"
    type: incident
    name: "Zurich District Court LockerGoga / MegaCortex / Nefilim ransomware trial (2026)"
    aliases:
      - "Stadler Rail ransomware trial"
    nexus: null
    summary: "Trial opened at Zurich District Court on 2026-08-17 of a 52-year-old Ukrainian software developer resident in canton Basel-Landschaft, in custody since October 2021, charged with commercial extortion, multiple counts of serious data corruption, serious money laundering and possession of child pornography over an international ransomware operation running December 2018 to May 2020. The indictment lists ten victim companies, four of them Swiss — Stadler Rail, Meier Tobler, Crealogix and IHI Ionbond (20 Minuten) — with Netzwoche placing the ten across Switzerland, France, Norway, Scotland, Canada, the Netherlands and the United States, with economic damage put by the prosecution above CHF 100 million (20 Minuten) or above CHF 130 million (Netzwoche); three non-Swiss victims paid CHF 4.5 million in ransoms and the Swiss companies paid none. The charge sheet describes the intrusion pattern as obtaining access, switching off monitoring processes, then encrypting servers and workstations including backup files, with roughly 500 GB exfiltrated from Stadler Rail under threat of publication. Prosecutors allege the group's Moscow-based principal operated under a cover identity of Russia's FSB; the defendant contests the charges and no verdict has been reached (cash.ch, 20 Minuten, Netzwoche, 2026-08-17)."
    first_seen: 2026-08-18
    relations:
      - to: "malware:lockergoga"
        type: uses
        source: "2026-08-18/zurich-trial-lockergoga-megacortex-nefilim-swiss-victims"
        note: "named in the Zurich charge sheet as one of the three ransomware families deployed in the prosecuted operation"
      - to: "malware:megacortex"
        type: uses
        source: "2026-08-18/zurich-trial-lockergoga-megacortex-nefilim-swiss-victims"
        note: "named in the Zurich charge sheet as one of the three ransomware families deployed in the prosecuted operation"
      - to: "malware:nefilim"
        type: uses
        source: "2026-08-18/zurich-trial-lockergoga-megacortex-nefilim-swiss-victims"
        note: "named in the Zurich charge sheet as one of the three ransomware families deployed in the prosecuted operation"
  - key: "malware:lockergoga"
    type: malware
    name: "LockerGoga"
    aliases: []
    nexus: null
    summary: "One of three ransomware families named in the Zurich District Court charge sheet covering an operation that ran December 2018 to May 2020, on trial from 2026-08-17; prosecutors allege the accused developed it largely independently on the instruction of a co-accused based in Moscow (cash.ch, 2026-08-17). The charge sheet attributes attacks using the three families collectively and no source in this run's reporting separates which victims received which family. The operation's pattern as described in the indictment was to obtain access, disable monitoring processes, then encrypt servers and workstations (cash.ch), with the stated objective of encrypting data including backup files (20 Minuten, 2026-08-17)."
    first_seen: 2026-08-18
  - key: "malware:megacortex"
    type: malware
    name: "MegaCortex"
    aliases: []
    nexus: null
    summary: "Ransomware family named in the Zurich District Court charge sheet alongside LockerGoga and Nefilim for the December 2018 to May 2020 extortion operation; prosecutors allege the accused contributed to its development after building LockerGoga (cash.ch, 2026-08-17). Netzwoche reports the operation as a whole reaching ten companies in Switzerland, France, Norway, Scotland, Canada, the Netherlands and the United States; no source in this run's reporting separates which victims received which family (Netzwoche, 2026-08-17)."
    first_seen: 2026-08-18
  - key: "malware:nefilim"
    type: malware
    name: "Nefilim"
    aliases: []
    nexus: null
    summary: "Ransomware family named in the Zurich District Court charge sheet alongside LockerGoga and MegaCortex for the December 2018 to May 2020 extortion operation prosecuted from 2026-08-17. The charge sheet attributes cyberattacks using all three families to the accused; no source in this run's reporting separates which victims received which family (Netzwoche, 2026-08-17)."
    first_seen: 2026-08-18
  - key: "incident:ak-oberoesterreich-cyberattack-2026-08"
    type: incident
    name: "Arbeiterkammer Oberösterreich cyberattack (2026)"
    aliases:
      - "AK Oberösterreich breach"
    nexus: null
    summary: "Attack on the Upper Austrian Chamber of Labour's IT systems on 2026-08-10, disclosed to members on 2026-08-16. Unknown perpetrators reached parts of the IT estate and obtained access to data; the organisation states the extent cannot be established — nor whether and which members' personal data were specifically affected — because the attackers deliberately removed the traces, so it is treating all member data it holds as potentially affected and notifying every member individually by post under Article 34 GDPR. Police and the Austrian data protection authority were notified and the whole data and IT infrastructure was moved into a segregated environment. No ransomware family, actor or initial-access vector has been disclosed by any party (Arbeiterkammer Oberösterreich, 2026-08-16; APA via news.at, 2026-08-17)."
    first_seen: 2026-08-18
  - key: "malware:medusa"
    type: malware
    name: "Medusa"
    aliases: []
    nexus: null
    summary: "Ransomware-as-a-service operation that emerged in 2021 as a closed group and moved to an affiliate model in 2023, tracked by CISA, the FBI and HHS in the joint #StopRansomware advisory AA25-071A. The 2026-08-18 update, carrying FBI investigative data through April 2026, raised the recorded victim count from more than 300 to more than 500; the only sector list the cited reporting carries covers medical, education, legal, insurance and manufacturing. The agencies state affiliates exploit newly announced vulnerabilities within 24 hours and have been observed using exploits up to a week before public disclosure while developing no zero-day or N-day flaws of their own, obtaining that exploit access from sources the agencies could not identify. Separately from exploit access, initial-access brokers who sell entry into victim networks are paid between $100 and $1 million with a premium for exclusivity; post-compromise the affiliates use legitimate remote-management software and RDP rather than bespoke tooling. The group had added no new leak-site victims since April at the time of the update (CyberScoop and The Record, both 2026-08-18). Distinct from the unrelated MedusaLocker and MedusaHVNC families already tracked in this registry."
    first_seen: 2026-08-19
