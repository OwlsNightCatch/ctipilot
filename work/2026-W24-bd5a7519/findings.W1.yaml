  # news report about the same June 4 Volexity primary (BRICKSTORM BSD variant on pfSense).
  # W23 weekly covered the original Volexity June 4 primary. The June 8 follow-up is new.
  - title: "actor:VerdantBamboo — BRICKSTORM BSD variant on pfSense confirmed, plus PLENET/.NET Native AOT backdoor on Synology NAS"
    key: actor:VerdantBamboo
    sources:
      - { url: "https://www.volexity.com/blog/2026/06/04/verdantbamboo-just-another-brickstorm-in-the-firewall/", publisher: "Volexity", date: "2026-06-04", role: "primary" }
      - { url: "https://thehackernews.com/2026/06/verdantbamboo-deploys-bsd-variant-of.html", publisher: "The Hacker News", date: "2026-06-08", role: "corroborating" }
    discovery_trace: |
      first seen at: WebSearch ("VerdantBamboo BRICKSTORM new update June 2026") →
      pivot: thomasharris6.wordpress.com relay article (2026-06-08) citing THN →
      The Hacker News 2026-06-08 article on BSD variant →
      primary: Volexity 2026-06-04 blog post (original primary).
    summary: |
      Volexity's June 4 forensic report (covered in W23 daily/weekly) describes VerdantBamboo
      (UNC5221 / Clay Typhoon / WARP PANDA) deploying a BSD-compiled variant of the BRICKSTORM
      Golang backdoor on an MSP customer's pfSense firewall, after compromising the network
      through an Egnyte Storage Sync appliance. The attackers leveraged a local privilege-escalation
      weakness in Egnyte's default egnyteservice sudo permissions (fixed in Storage Sync v13.13)
      to pivot to root on the NAS. Volexity additionally discovered PLENET, a previously-undocumented
      .NET Native AOT-compiled backdoor deployed on a Synology NAS, and AGENTPSD, a dropper.
      The intrusion began in September 2025 and went undetected until Volexity IR engagement.
      BRICKSTORM supports interactive shell, remote command execution, file manipulation, and
      C2 server switching. The BSD variant confirms VerdantBamboo's capability to target
      non-Linux Unix appliances (pfSense is FreeBSD-based), expanding the threat surface beyond
      Linux-only enterprise EDR visibility.
      Follow-up June 8 reporting confirms the full technical chain and adds context that 18-month
      access was used to proxy through the MSP into Microsoft 365 tenants via Conditional Access bypass.
    ch_eu_nexus: "global; EU MSP and critical-infrastructure edge-appliance environments directly affected"
    public_sector_nexus: "HIGH — MSPs servicing government and critical-infrastructure tenants"
    sector: "technology, government, finance"
