  # --- Gogs CVE-2026-52806 PATCHED ---
  # NEW STATUS CHANGE: Gogs 0.14.3 released June 7. Was tracked as unpatched in W22/W23.
  - title: "Gogs argument-injection RCE (CVE-2026-52806) PATCHED — version 0.14.3 released 7 June"
    key: "CVE-2026-52806"
    sources:
      - { url: "https://www.bleepingcomputer.com/news/security/gogs-patches-critical-zero-day-enabling-remote-code-execution/", publisher: "BleepingComputer", date: "2026-06-08", role: "primary" }
      - { url: "https://www.rapid7.com/blog/post/ve-authenticated-rce-via-argument-injection-gogs-unfixed/", publisher: "Rapid7", date: "2026-05-28", role: "original-disclosure" }
    discovery_trace: |
      first seen at: WebSearch ("Gogs argument injection CVE unpatched RCE June 2026") →
      BleepingComputer 2026-06-08 patch article →
      Rapid7 original disclosure (original tracker of unpatched status)
    summary: |
      Gogs released version 0.14.3 on 7 June 2026, incorporating Rapid7's upstream patch for
      CVE-2026-52806 (CVSSv4 9.4, CWE-88 argument injection). The vulnerability, disclosed by
      Rapid7 on 28 May with a Metasploit module, allows any authenticated user to achieve RCE
      by creating a pull request with a malicious branch name injecting `--exec` into
      `git rebase` during the "Rebase before merging" merge strategy. On default-configured Gogs
      instances (open registration enabled, no repository creation limit), an unauthenticated
      attacker can register an account and exploit without prior access.
      The 90-day responsible-disclosure deadline was originally missed by the maintainer
      (reported March 17, tracked as unpatched in W22/W23 weekly briefs). The maintainer
      ultimately accepted Rapid7's patch for 0.14.3.
      Action: All Gogs operators should upgrade to 0.14.3. If immediate patching is not possible,
      set `DISABLE_REGISTRATION = true` in `app.ini` and disable the "Rebase before merging"
      strategy. ~1,141 internet-facing Gogs instances were visible on Shodan at disclosure.
      Monitor for `git` child processes carrying `--exec` under the Gogs binary (Sysmon EID 1,
      auditd EXECVE).
    ch_eu_nexus: "global; Gogs used in EU/CH public-sector lightweight self-hosted git deployments"
    public_sector_nexus: "MEDIUM — government/research code infrastructure"
    sector: "technology, public-sector"
    cves: [CVE-2026-52806]
