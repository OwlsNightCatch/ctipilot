  # --- Windows zero-days: YellowKey / GreenPlasma / MiniPlasma patch status ---
  # NEW STATUS CHANGE: June Patch Tuesday (June 9) patched all three.
  # W22 weekly (last mention) noted "June 2026 Patch Tuesday is the expected first fix."
  # W23 weekly also noted GreatXML as NEW unpatched zero-day (June 11).
  # This IS a new development: the three long-tracked zero-days ARE NOW PATCHED.
  - title: "Chaotic Eclipse / Nightmare Eclipse zero-day cluster — YellowKey (CVE-2026-45585), GreenPlasma (CVE-2026-45586), MiniPlasma PATCHED in June Patch Tuesday; new GreatXML remains open"
    key: "chaotic-eclipse-zero-day-cluster"
    sources:
      - { url: "https://www.bleepingcomputer.com/news/microsoft/microsoft-june-2026-patch-tuesday-fixes-6-zero-days-200-flaws/", publisher: "BleepingComputer", date: "2026-06-10", role: "primary" }
      - { url: "https://www.tenable.com/blog/microsofts-june-2026-patch-tuesday-addresses-198-cves-cve-2026-49160-cve-2026-50507", publisher: "Tenable", date: "2026-06-10", role: "corroborating" }
      - { url: "https://www.securityweek.com/greatxml-zero-day-exploit-bypasses-bitlocker/", publisher: "SecurityWeek", date: "2026-06-11", role: "corroborating" }
    discovery_trace: |
      first seen at: WebSearch ("Windows zero-day Chaotic Eclipse YellowKey GreenPlasma MiniPlasma June 2026") →
      windowsforum.com thread confirming patch →
      BleepingComputer June PT article (2026-06-10) →
      Tenable June PT analysis (2026-06-10) →
      SecurityWeek GreatXML article (2026-06-11)
    summary: |
      Microsoft's June 2026 Patch Tuesday (released 9 June) closed three long-tracked zero-days from
      the Chaotic Eclipse (also: Nightmare Eclipse) researcher disclosure series, all of which have
      been in the unpatched state since May 2026 (and tracked across W20, W21, W22 weekly briefs):
      - CVE-2026-45585 (YellowKey, CVSS 6.8): BitLocker bypass via Windows Recovery Environment
        (WinRE) NTFS transaction replay — physical access required, defeats TPM-only disk encryption.
        Patched in June CU. Previous mitigation (WinRE registry `BootExecute` removal) can be
        removed once the patch is applied; BitLocker PIN policy should be retained regardless.
      - CVE-2026-45586 (GreenPlasma): Elevation of Privilege in the Windows Collaborative
        Translation Framework (CTFMON) — local attacker achieves SYSTEM from standard user account.
        Patched in June CU.
      - MiniPlasma (regression of CVE-2020-17103): Cloud Filter driver (cldflt.sys)
        CfAbortHydration path re-enables a previously-believed-fixed SYSTEM EoP. Patched in
        June CU (re-closes the original CVE-2020-17103).
      However, a FOURTH Chaotic Eclipse disclosure (GreatXML, 11 June) is NOT addressed by
      June PT: a BitLocker bypass via crafted unattend.xml in the recovery partition processed
      by Defender Offline scan (see 2026-06-12 daily). No CVE assigned, no patch.
      Deploy June CU immediately to close the three patched zero-days.
