  # --- campaign:ironworm / miasma / mini-shai-hulud ---
  # UPDATE: Atomic Arch second wave (900→1500+ packages) is covered in 2026-06-13 daily.
  # Mini-Shai-Hulud open-source and Phantom Gyp derivative covered 2026-06-09.
  # Hades PyPI variant covered 2026-06-10.
  # Second wave (bun install js-digest delivery change) is a new delta NOT explicitly in daily.
  - title: "campaign:atomic-arch-aur-supply-chain-2026 — second wave reaches 900–1,500+ packages with delivery method change"
    key: campaign:atomic-arch-aur-supply-chain-2026
    sources:
      - { url: "https://www.sonatype.com/blog/atomic-arch-npm-campaign-adds-malicious-dependency", publisher: "Sonatype", date: "2026-06-11", role: "primary" }
      - { url: "https://thehackernews.com/2026/06/over-400-arch-linux-aur-packages.html", publisher: "The Hacker News", date: "2026-06-13", role: "corroborating" }
    discovery_trace: |
      first seen at: WebSearch ("Atomic Arch AUR 900 1500 packages second wave June 12-14 2026") →
      linuxorg.threads discussion citing PrivacyGuides count of 900+ →
      thecybersecguru.com article on 900+ count →
      primary: Sonatype blog 2026-06-11 →
      corroborating: The Hacker News 2026-06-13
    summary: |
      The Atomic Arch AUR supply-chain attack (first covered 2026-06-13 daily with 408 packages)
      expanded to a second wave by 12 June, pushing the compromised-package count to 900+ (per
      PrivacyGuides) or potentially 1,500+ by end of day. The second wave introduced a delivery
      change: some PKGBUILDs switched from the original npm dependency injection to
      `bun install js-digest`, indicating the operators are iterating the delivery mechanism
      in response to detection. The payload remains a Rust-written credential harvester targeting
      SSH keys, browser sessions, GitHub/npm tokens, Slack/Discord data, HashiCorp Vault tokens
      and cloud credentials (exfiltrated via Tor-connected C2), paired with an eBPF rootkit that
      intercepts directory-listing syscalls to hide malicious service files from `ls`. Official
      Arch Linux core/extra repositories were not affected; only AUR packages adopted through
      the standard orphan-adoption mechanism were compromised. Community detection scripts
      (`github.com/lenucksi/aur-malware-check`, `github.com/jasonherald/atomic-arch-check`)
      are available. Sonatype linked the npm delivery mechanism to the broader Shai-Hulud supply-chain
      family (IronWorm/Miasma), suggesting shared infrastructure or operator overlap.
    ch_eu_nexus: "global; EU developer environments and CI/CD systems using AUR"
    public_sector_nexus: "MEDIUM — government DevOps/CI using Arch Linux or AUR-based tooling"
    sector: "technology, software-development"
