  item: "Atomic Arch AUR wave — package count"
  url_or_quote: "a second wave pushed the compromised count toward 900-1,500 packages"
  summary: "Inline-cited THN AUR article reports 400+/~408, not 900-1500; ~1,500 is from Sonatype, 900 from PrivacyGuides (uncited inline). Mitigated by section 10 reduced-confidence note. Attribute upper bound to Sonatype or tighten phrasing."
