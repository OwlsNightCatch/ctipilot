items:
  - title: "European Commission refers France and Spain to CJEU over NIS2 non-transposition — 19+ months past the October 2024 deadline"
    sources:
      - url: "https://brusselssignal.eu/2026/06/eu-takes-france-and-spain-to-court-over-cybersecurity-law-delay/"
        publisher: "Brussels Signal"
        date: "2026-06-09"
        role: "primary"
      - url: "https://industrialcyber.co/regulation-standards-and-compliance/european-commission-adopts-infringement-decisions-against-member-states-for-not-transposing-security-directives/"
        publisher: "Industrial Cyber"
        date: "2026-06-09"
        role: "corroborating"
    discovery_trace: "first seen at: WebSearch (\"European Commission NIS2 infringement referral Court of Justice June 2026\") → primary: Brussels Signal, URL https://brusselssignal.eu/2026/06/eu-takes-france-and-spain-to-court-over-cybersecurity-law-delay/ → corroborating: Industrial Cyber, URL https://industrialcyber.co/regulation-standards-and-compliance/european-commission-adopts-infringement-decisions-against-member-states-for-not-transposing-security-directives/"
    summary: |
      The European Commission formally referred France and Spain to the Court of Justice of the European Union on approximately 9 June 2026 for failing to transpose the NIS2 Directive (Directive 2022/2555) into national law — 19+ months past the October 17, 2024 deadline. This is the third and final stage of the EU infringement procedure; the CJEU can impose lump-sum fines and ongoing daily penalties until transposition is complete. The Commission had opened infringement proceedings against 23 member states in November 2024 and escalated to reasoned opinions against 19 states on 7 May 2025. As of June 2026, France and Spain are the two states still without adopted legislation. Spain's Council of Ministers approved a draft cybersecurity bill in January 2025 but the final text remains unpromulgated. France folded NIS2 requirements into a broader critical-infrastructure law that has not been fully enacted. For public-sector entities in both countries — and for pan-EU operators with regulated entities in France or Spain — NIS2 requirements (incident reporting, supply-chain security, risk-management measures) technically apply but national enforcement guidance remains incomplete. CJEU referral creates financial risk for the two states and signals that the Commission will continue escalating against the five remaining non-transposers (Ireland, Luxembourg, Netherlands also named in earlier proceedings). Swiss public-sector entities are not directly subject to NIS2, but Swiss federal agencies and cantonal governments with EU-regulated counterparts or outsourced service providers in France/Spain need to understand the applicable regulatory obligations.
    ch_eu_nexus: "EU-wide; France and Spain operate pan-EU critical infrastructure; cross-border Swiss operators with French/Spanish cloud or OT providers affected indirectly"
    public_sector_nexus: "direct — NIS2 explicitly covers public administration entities; court referral accelerates compliance pressure on all EU public-sector NIS2 entities"
    sector: "public-administration, critical-infrastructure, energy, transport, health, finance, digital-infrastructure"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "The European Commission has referred France and Spain to the European Union's highest court for failing to bring in the bloc's flagship cybersecurity law more than a year after the deadline passed."
        attribution: "Brussels Signal"
        source_url: "https://brusselssignal.eu/2026/06/eu-takes-france-and-spain-to-court-over-cybersecurity-law-delay/"
      - quote: "Both governments stand accused of not writing the NIS2 Directive into national law. CJEU can impose lump-sum fines and daily charges."
        attribution: "Brussels Signal"
        source_url: "https://brusselssignal.eu/2026/06/eu-takes-france-and-spain-to-court-over-cybersecurity-law-delay/"
    extended_notes: |
      Defender/compliance takeaway: EU public-sector entities in non-transposed states operate in a legal grey zone — NIS2's substantive obligations apply (Article 21 security measures, Article 23 reporting windows) even without a national implementing law, because directly effective portions of the Directive bind member states. However, competent authorities, registration processes, and enforcement routes remain undefined. For Swiss federal agencies with data processing arrangements in France or Spain, the recommended posture is to treat NIS2 Article 21 requirements as the floor regardless of whether national enforcement has begun.

  - title: "Germany Bundestag opens first reading of CRA domestic-implementation bill (Drucksache 21/6134) — 11 June 2026"
    sources:
      - url: "https://www.bundestag.de/dokumente/textarchiv/2026/kw24-de-cyberresilienz-1181930"
        publisher: "Deutscher Bundestag"
        date: "2026-06-11"
        role: "primary"
    discovery_trace: "first seen at: WebSearch (\"Germany Cybersicherheitsstärkungsgesetz Bundestag Bundesrat law 2026 passed\") → WebSearch result includes Bundestag reference kw24-de-cyberresilienz → primary: Bundestag.de, URL https://www.bundestag.de/dokumente/textarchiv/2026/kw24-de-cyberresilienz-1181930"
    summary: |
      The German Bundestag held its first reading on 11 June 2026 of the government bill (Drucksache 21/6134) titled "zur Durchführung der Verordnung (EU) 2024/2847 über horizontale Cybersicherheitsanforderungen für Produkte mit digitalen Elementen" — the domestic law needed to operationalise EU Regulation 2024/2847 (the Cyber Resilience Act) within Germany. The bill designates national authorities, notified bodies, and enforcement mechanisms under the CRA. This is a first reading; the bill proceeds to committee stage (likely Ausschuss Digitales and/or Innenausschuss) before a second and third reading and Bundesrat consent. Germany's designation of the BSI as the primary CRA market-surveillance authority was already signalled in the February 2026 ministerial draft; the bill's first reading marks the formal parliamentary clock starting. The CRA's Chapter IV (notified bodies) entered force EU-wide on 11 June 2026 simultaneously, creating the need for Germany to have a competent national authority in place for the September 11 reporting-platform deadline. For German public-sector procurers and ICT vendors shipping to German public-sector entities, this is the legislative timeline to track: committee amendments, second reading likely Q3 2026, Bundesrat in Q4 2026.
    ch_eu_nexus: "Germany-specific; direct CRA relevance for EU-wide ICT vendors and procurers including Swiss exporters selling digital products to the German public sector"
    public_sector_nexus: "direct — German public-sector entities as CRA-regulated procurers; BSI as designated authority"
    sector: "public-administration, technology, digital-products"
    cves: []
    actors_campaigns_malware: []
    verification: SINGLE-SOURCE-NATIONAL-AUTHORITY
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Der Bundestag hat am Donnerstag, 11. Juni 2026, erstmals über den Gesetzentwurf der Bundesregierung 'zur Durchführung der Verordnung (EU) 2024/2847 über horizontale Cybersicherheitsanforderungen für Produkte mit digitalen Elementen' (Cyberresilienz-Verordnung, 21/6134) [debated]"
        attribution: "Deutscher Bundestag"
        source_url: "https://www.bundestag.de/dokumente/textarchiv/2026/kw24-de-cyberresilienz-1181930"
    extended_notes: |
      Note: The W23 weekly already covered the CRA June-11 notifying-authority deadline as a milestone. This item is the *legislative* step — Germany's Bundestag formally picking up the domestic implementation bill — which is a new and distinct development from the general CRA milestone covered previously.

  - title: "ENISA publishes SBOM Adoption State of Play 2026 — CRA drives SDLC integration but operational deployment lags"
    sources:
      - url: "https://www.enisa.europa.eu/publications/sbom-adoption-state-of-play-2026"
        publisher: "ENISA"
        date: "2026-06-09"
        role: "primary"
    discovery_trace: "first seen at: bridge fetch enisa.europa.eu/publications/technical-competence-requirements-for-cra-notified-bodies — sidebar links revealed SBOM Adoption State of Play - 2026, URL https://www.enisa.europa.eu/publications/sbom-adoption-state-of-play-2026 → primary: ENISA, URL https://www.enisa.europa.eu/publications/sbom-adoption-state-of-play-2026"
    summary: |
      ENISA published the results of its end-2025 survey on Software Bill of Materials (SBOM) adoption on 9 June 2026 — the first EU-wide empirical baseline on SBOM practice. The report (PDF available at https://www.enisa.europa.eu/sites/default/files/2026-06/SBOM%20Adoption%20State%20of%20Play%202026.pdf) confirms that the CRA's mandatory SBOM requirements are the primary driver of accelerated adoption timelines across EU organisations. Key findings (from the survey abstract and search-sourced summaries): organisations are broadly investing in SBOM generation and automation tools; CRA acts as the accelerant; most organisations are integrating SBOMs into CI/CD pipelines, but operational maturity — particularly SBOM consumption (ingesting a vendor's SBOM into an organisation's own vulnerability-management workflow) — lags behind generation. For EU public-sector ICT departments and Swiss organisations exporting digital products to the EU, the takeaway is that CRA compliance will require not just generating SBOMs but demonstrating that supplier SBOMs are being consumed and feeding patching/risk decisions. The report lands 94 days before the CRA's September 11, 2026 vulnerability-reporting platform goes live.
    ch_eu_nexus: "EU-wide; directly relevant to Swiss ICT exporters subject to CRA and to Swiss public-sector ICT procurement teams evaluating CRA-compliant suppliers"
    public_sector_nexus: "direct — EU public-sector entities procuring digital products must demand CRA-compliant SBOM documentation"
    sector: "technology, public-administration, digital-products"
    cves: []
    actors_campaigns_malware: []
    verification: SINGLE-SOURCE-NATIONAL-AUTHORITY
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "ENISA launched a survey at the end of 2025 to gather factual data on how organisations across industries and of varying sizes are approaching Software Bill of Materials (SBOM) adoption in response to the EU Cyber Resilience Act (CRA). This report analyses the survey results, which confirm that the CRA acts as an accelerator for SBOM adoption."
        attribution: "ENISA"
        source_url: "https://www.enisa.europa.eu/publications/sbom-adoption-state-of-play-2026"
    extended_notes: |
      Hunt / detection operational angle: SBOM-driven vulnerability discovery creates a new detection surface. Organisations consuming vendor SBOMs can correlate known-bad components against MITRE CVE feeds automatically. Public-sector procurement teams should be requesting SBOM deliverables in tenders now so they have baseline coverage before the September 2026 reporting-platform deadline.

  - title: "NCSC-CH issues G7 Évian hacktivist-DDoS pre-event advisory — operationally active through 17 June summit"
    sources:
      - url: "https://www.ncsc.admin.ch/ncsc/en/home/aktuell/im-fokus/2026/massnahmen-grossanlaesse-konferenzen-g7.html"
        publisher: "NCSC Switzerland"
        date: "2026-06-01"
        role: "primary"
    discovery_trace: "first seen at: WebSearch (\"NCSC admin.ch G7 Evian cyber security advisory 2026 June\") → primary: NCSC-CH, URL https://www.ncsc.admin.ch/ncsc/en/home/aktuell/im-fokus/2026/massnahmen-grossanlaesse-konferenzen-g7.html (fetched via bridge)"
    summary: |
      NCSC Switzerland published a specific advisory on 1 June 2026 (updated from the general major-events guidance) warning of hacktivist DDoS disruption during the G7 summit at Évian-les-Bains (France, adjacent to the Swiss border), 15–17 June 2026. The NCSC directly names Swiss organisations as the DDoS target pool, noting that hacktivist groups — particularly politically/ideologically motivated actors seeking media visibility — use such events to time attack waves. The advisory explicitly asks journalists not to amplify DDoS outcomes, thereby reducing the reward signal. The NCSC published a G7-specific DDoS guidance PDF (bacs-leitfaden-ddos-angriffen-g7_en.pdf, 29.05.2026) supplementing the advisory. This advisory is published just outside the 8-day window (June 1 vs. window start June 6) but remains operationally active throughout W24 as the summit runs June 15-17. Guidance covers: network-layer rate limiting and upstream scrubbing activation readiness, CDN failover, anycast routing, contact with upstream ISPs for black-holing, incident-response runbooks. The NCSC is working directly with organisations involved in staging the G7 and with Swiss critical-infrastructure operators. Expected actor profile: NoName057(16) and aligned Telegram-coordinated hacktivist clusters, no credentialed attribution available, consistent with past summit-adjacent patterns.
    ch_eu_nexus: "Switzerland-primary; G7 summit physically proximate to Swiss border; Swiss organisations explicitly named as DDoS target surface"
    public_sector_nexus: "direct — Swiss federal and cantonal e-government portals, critical-infrastructure operators"
