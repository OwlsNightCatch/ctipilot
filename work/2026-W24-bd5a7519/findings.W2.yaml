    verification: SINGLE-SOURCE-NATIONAL-CERT
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "The National Cyber Security Centre (NCSC) therefore expects disruptive maneuvers in cyberspace again in the context of the G7 summit, organised by France, which will take place from 15 to 17 June 2026 in Évian."
        attribution: "NCSC Switzerland"
        source_url: "https://www.ncsc.admin.ch/ncsc/en/home/aktuell/im-fokus/2026/massnahmen-grossanlaesse-konferenzen-g7.html"
      - quote: "The NCSC anticipates that there will be disruptive cyberoperations during the G7 summit, particularly distributed denial-of-service (DDoS) attacks targeting Swiss organisations."
        attribution: "NCSC Switzerland"
        source_url: "https://www.ncsc.admin.ch/ncsc/en/home/aktuell/im-fokus/2026/massnahmen-grossanlaesse-konferenzen-g7.html"
    extended_notes: |
      Defender actions ahead of 15 June: (1) Confirm upstream DDoS scrubbing contract covers peak-event burst capacity. (2) Test CDN failover path — edge-layer absorbs volumetric flood before it reaches origin. (3) Pre-position OOB communication path (Signal/SIEM/NOC bridge) for when primary portals are under flood. (4) Review NCSC G7 DDoS guidance PDF. (5) Monitor NCSC Security Hub for live advisories during 15-17 June. MITRE ATT&CK T1498 (Network Denial of Service) / T1499 (Endpoint Denial of Service) are the relevant technique classes; no credential-harvesting or intrusion-related risk claimed by NCSC for this pattern.

  - title: "MariaDB CVE-2026-49261 (CVSS 10.0): Galera cluster wsrep_notify_cmd OS command injection — pre-auth lateral RCE across all cluster nodes"
    sources:
      - url: "https://security-hub.ncsc.admin.ch/#/posts/12627"
        publisher: "NCSC Switzerland Security Hub"
        date: "2026-06-11"
        role: "primary"
      - url: "https://mariadb.com/docs/server/security/cve/community-server"
        publisher: "MariaDB Documentation"
        date: "2026-06-11"
        role: "corroborating"
      - url: "https://www.thehackerwire.com/mariadb-critical-rce-via-wsrep_notify_cmd-cve-2026-49261/"
        publisher: "TheHackerWire"
        date: "2026-06-11"
        role: "corroborating"
    discovery_trace: "first seen at: ncsc-csh recent 15 (bridge) → post 12627 published 2026-06-11 → primary: NCSC-CH Security Hub, URL https://security-hub.ncsc.admin.ch/#/posts/12627 → corroborating: MariaDB CVE page + TheHackerWire analysis"
    summary: |
      CVE-2026-49261 (CVSS3.1 10.0 Critical) is an OS command injection in MariaDB Community Server and Enterprise Server when running in Galera cluster mode with the wsrep_notify_cmd configuration directive enabled. The vulnerability is in the wsrep_notify_status() function: when a new node joins the Galera cluster, MariaDB builds a shell notification command by directly interpolating the peer's wsrep_node_name and wsrep_node_incoming_address fields — without sanitisation or escaping — and passes the result to sh -c. A malicious or compromised Galera cluster peer that announces a node name containing shell metacharacters can therefore inject arbitrary OS-level commands that execute on every cluster member with a wsrep_notify_cmd configured, with the privileges of the database process. This effectively means any cluster node that has been compromised or is under attacker control can achieve lateral RCE on all other database nodes in the cluster, bypassing DB authentication entirely. Affected versions: MariaDB Community Server < 10.6.27, < 10.11.18, < 11.4.12, < 11.8.8, < 12.3.2; MariaDB Enterprise Server < 11.8.6-4, < 11.4.10-8, < 10.6.25-22. Patched versions fix the wsrep_notify_cmd function by escaping peer-supplied fields before shell substitution (JIRA MDEV-39721). No public exploit at NCSC-CH advisory time. Workaround: disable wsrep_notify_cmd if patching is not immediately possible. MariaDB is widely deployed in EU/Swiss public-sector database tiers (Nextcloud, Moodle, GLPI, open-source ERP), particularly where administrators chose MariaDB over MySQL for licensing reasons.
    ch_eu_nexus: "global; MariaDB is a widely-deployed open-source RDBMS in EU and Swiss public-sector ICT stacks"
    public_sector_nexus: "indirect — MariaDB commonly underpins public-sector OSS deployments (Nextcloud, Moodle, service-management platforms)"
    sector: "public-administration, education, technology"
    cves: [CVE-2026-49261]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "MariaDB Server, when running as part of a Galera cluster with a notification command configured (wsrep_notify_cmd), builds that command by inserting the cluster members' node names and addresses directly into a string that is then executed by the system shell, without validating or escaping them."
        attribution: "NCSC Switzerland Security Hub"
        source_url: "https://security-hub.ncsc.admin.ch/#/posts/12627"
      - quote: "A cluster peer that announces a node name (wsrep_node_name) or incoming address containing shell metacharacters can therefore cause arbitrary operating-system commands to run on every cluster member that has a notification command configured, with the privileges of the database process."
        attribution: "NCSC Switzerland Security Hub"
        source_url: "https://security-hub.ncsc.admin.ch/#/posts/12627"
    extended_notes: |
      Detection: Review Galera cluster configurations for wsrep_notify_cmd presence; treat any node in a cluster with that setting as a potential blast-radius node. Audit database process logs for unexpected child-process spawning (Sysmon EID 1 with MariaDB/mysqld parent). Hardening: patch to fixed versions immediately; if Galera with wsrep_notify_cmd is required, validate that only trusted internal nodes can initiate joins (network-layer ACL at Galera port 4567/4568). Note this CVE falls in the vulnerability category but is flagged here because the NCSC-CH Security Hub advisory (post 12627, June 11) is the primary source and falls within W2's source-list scope.

