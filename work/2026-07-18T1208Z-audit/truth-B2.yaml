- entry: entries/2026-07-15/microsoft-july-patch-tuesday-sharepoint-dynamics-followup.md
  verdict: imprecision
  defect: "Entry states 'None is confirmed exploited in the wild yet' for the four CVEs including CVE-2026-58644. MSRC's own revision history for CVE-2026-58644 (revision 1.2, dated 2026-07-15 — same day as this entry's run) states: 'Corrected the Exploitability Index, Exploited flag and CVSS vector which was incorrect at the time of publication on 7/14/2026' — the corrected page now reads Exploited: Yes, Exploitability assessment: Exploitation Detected, Exploit Code Maturity: Functional. CISA subsequently added CVE-2026-58644 to the KEV catalog on 2026-07-16 (dateAdded confirmed in the live KEV feed), one day after this entry's run. The entry's claim was very likely accurate at compose time (04:36Z on 2026-07-15, plausibly before MSRC's same-day revision landed during US business hours) but is now stale relative to current ground truth on the very source it cites. Not a hallucination — the CVSS base score (9.8) and all other cited facts remain correct — but the exploitation-status claim no longer matches the cited primary source and no follow-up/delta entry was found correcting it."
  ground_truth: "MSRC CVE-2026-58644 page, revision 1.2 (2026-07-15): Exploited=Yes, Exploitability assessment=Exploitation Detected, Exploit Code Maturity=Functional. CISA KEV catalog: CVE-2026-58644 added 2026-07-16."
  ground_truth_url: "https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-58644"

