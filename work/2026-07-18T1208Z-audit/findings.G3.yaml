  - title: "Varonis: 'Rogue Agent' permission-boundary flaw in Google Dialogflow CX enabled VPC-SC bypass and silent conversation exfiltration"
    sources:
      - { url: "https://www.varonis.com/blog/rogue-agent-dialogflow-attack", publisher: "Varonis Threat Labs", date: "last updated 2026-07-07", role: primary }
      - { url: "https://www.darkreading.com/application-security/dialogflow-cx-rogue-agent-flaw-enabled-ai-chatbot-data-theft", publisher: "Dark Reading", date: "2026-07-14", role: corroborating }
    discovery_trace: >
      first seen at: checkpoint-research weekly digest, URL
      https://research.checkpoint.com/2026/13th-july-threat-intelligence-report/ (roll-up,
      discovery-only) → pivot: Dark Reading, URL
      https://www.darkreading.com/application-security/dialogflow-cx-rogue-agent-flaw-enabled-ai-chatbot-data-theft
      → primary: Varonis Threat Labs, URL https://www.varonis.com/blog/rogue-agent-dialogflow-attack
    summary: |
      Varonis Threat Labs disclosed "Rogue Agent," a permission-boundary flaw in Google Dialogflow
      CX requiring only the dialogflow.playbooks.update permission (grantable at the single-agent
      level) to exploit. Dialogflow CX's "Code Blocks" feature runs embedded Python inside a
      Google-managed Cloud Run service SHARED across every agent in the same GCP project; an
      attacker could overwrite the code_execution_env.py file to inject code that intercepts live
      conversations, exfiltrates data, and manipulates chatbot responses — then restore the
      original configuration so the Dialogflow Console UI shows nothing abnormal while the
      malicious code persists invisibly in the underlying Cloud Run environment. Because the shared
      Cloud Run instances retain default public egress, the flaw also bypassed VPC Service Controls
      perimeters. Google shipped an initial fix in April 2026 and a full resolution in June 2026;
      Google states no confirmed in-the-wild exploitation before the patch.
      Why it's borderline on recency: Varonis's own writeup is dated "last updated 2026-07-07"
      (outside the 2026-07-11 window start), but a wave of press coverage (Dark Reading, Dataconomy,
      GBHackers, TheHackerNews, CyberPress) ran 2026-07-14, inside the window — this reads as a
      delayed-disclosure press wave rather than fresh technical development, so it is offered for
      the main agent's recency judgment rather than composed outright. Not in the assigned G3
      publisher slice (Varonis) — surfaced via the Check Point weekly roll-up's outbound links.
    region_nexus: "global; Dialogflow CX is used by public-sector/citizen-service chatbot deployments, including in the EU"
