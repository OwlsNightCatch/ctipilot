  - title: "Kaspersky GReAT: OkoBot — 20+-payload crypto-wallet-stealing framework distributed via a fake SQL Server Management Studio GitHub repo"
    sources:
      - { url: "https://securelist.com/okobot-framework-targets-cryptocurrency-wallets/120660/", publisher: "Kaspersky Securelist (GReAT)", date: "2026-07-15", role: primary }
    discovery_trace: >
      first seen at: kaspersky-securelist listing sweep, URL https://securelist.com/
      (title surfaced without a visible date) → WebSearch ("Kaspersky Securelist GReAT OkoBot new
      malware framework cryptocurrency 2026") → primary: Kaspersky Securelist, URL
      https://securelist.com/okobot-framework-targets-cryptocurrency-wallets/120660/
    summary: |
      Kaspersky GReAT (published 15 July 2026) details OkoBot, an actively-developed (ongoing since
      early 2025, still active at publication) malicious framework built on the existing TookPS
      loader and targeting cryptocurrency users and IT/developer staff specifically. Initial access
      is via ClickFix-style lures and a malicious GitHub repository (active March-June 2025)
      masquerading as SQL Server Management Studio installation guidance; both vectors trigger
      TookPS, which installs SSH on the victim host and opens an attacker-controlled SSH tunnel used
      to push 20+ payloads/implants (browser-extension loaders, wallet stealers, keyloggers,
      SeedHunter, MC Keylogger). The new OkoSpyware module hooks Chromium's extension-loading
      function to silently install malicious extensions when a new browser window opens, and
      separately hooks internal Electron framework functions (used by Ledger Live, Exodus, Trezor
      Suite, Tonkeeper, MetaMask) to record FFmpeg-captured video of wallet-app windows plus
      keystrokes, storing MP4 + JSON metadata for exfiltration — effectively defeating password
      managers/hardware-wallet UIs that rely on on-screen confirmation by recording the screen
      itself rather than stealing a static secret. Victims span 25+ countries (concentrated in
      Brazil, Vietnam, Canada, Mexico, Türkiye); Kaspersky assesses a Russian-speaking operator
      based on geoblocking, Russian-language code comments, and prior Rilide distribution on
      Russian-language forums.
      Why it clears the gate: new malware family, hunt-actionable tradecraft (Chromium
      extension-hook + Electron-framework-hook screen/keylog capture is a technique class not
      widely covered elsewhere; developer/IT-staff targeting via a trojanized GitHub tooling repo is
      directly relevant to any org's software-supply-chain and developer-endpoint hygiene, including
      public-sector dev teams). Not present in the 69-item prior-coverage window.
    region_nexus: "global distribution (25+ countries); developer/IT-staff targeting vector is transferable to any Swiss/EU organisation running internal dev tooling"
    primary_sector_nexus: "indirect — targets IT/developer personnel broadly, not government-specific"
    sector: "finance (cryptocurrency), public-sector (developer endpoints generally)"
    cves: []
    techniques: [T1204.001, T1176, T1555.003, T1113, T1056.001]
    affected_products: []
