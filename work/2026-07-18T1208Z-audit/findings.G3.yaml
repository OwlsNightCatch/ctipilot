  - title: "KELA: ByteToBreach data-leak operator's July update names Romania's ANCPI cadastral agency among government/bank victims"
    sources:
      - { url: "https://www.kelacyber.com/blog/bytetobreach-a-deep-dive-into-a-persistent-data-leak-operator/", publisher: "KELA Cybercrime Threat Intelligence", date: "2026-07-17 (updated; original Nov 2025)", role: primary }
