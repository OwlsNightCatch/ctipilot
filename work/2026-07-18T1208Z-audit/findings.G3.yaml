      - { key: "tool:tookps-loader", type: tool, name: "TookPS", aliases: [],
          summary: "SSH-tunnel-installing loader that both OkoBot infection vectors trigger to establish the initial attacker-controlled channel (Kaspersky, 2026-07-15)." }
    relation_suggestions:
