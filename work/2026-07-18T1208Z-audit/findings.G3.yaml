items:
  - title: "Kaspersky GReAT: GoSerpent backdoor evolves — dwell-time-integrated exfiltration against Southeast Asian government/diplomatic targets"
    sources:
      - { url: "https://securelist.com/goserpent-backdoor-in-southeast-asia/120687/", publisher: "Kaspersky Securelist (GReAT)", date: "2026-07-16", role: primary }
    discovery_trace: >
      first seen at: kaspersky-securelist listing sweep, URL https://securelist.com/
      (title surfaced without a visible date on the WebFetch listing summary) →
      WebSearch ("Kaspersky Securelist GoSerpent persistent threat evolves backdoor 2026")
      → primary: Kaspersky Securelist, URL https://securelist.com/goserpent-backdoor-in-southeast-asia/120687/
    summary: |
      Kaspersky GReAT (published 16 July 2026) documents the continued evolution of GoSerpent, a
      Go-based RAT active since at least 2021 and re-tooled in 2025-2026, targeting government and
      diplomatic entities in Southeast Asia — including police complaint-management systems,
      biometric databases, criminal-case files, and hotel/tenant records tied to national identity
      registries. The backdoor receives base64-encoded, AES-CBC-encrypted command-line arguments
      carrying the C2 address and a communication password whose SHA-256 hash becomes the ChaCha20
      session key. Deployed alongside it: a SOCKS5 proxy, remote-shell execution, and secondary
      collection tools (ThumbcacheService — a malicious DLL Windows service that harvests
      .doc/.docx/.pdf/.xls/.xlsx files; Mimikatz and QuarksDumpLocalHash for credential dumping).
      The hallmark tradecraft is deliberate dwell time: operators plant the backdoor, wait weeks
      while documents accumulate, then return with an evolved proxy (Stowaway) and
      TmcLoader/TmcPayload to 7-Zip-compress and exfiltrate the archive over stolen-credential
      network shares — a cadence explicitly designed to outlast standard log-retention windows.
      Kaspersky hedges attribution: "indications of a potential link to the TetrisPhantom threat
      actor" rather than a firm claim. This is a strong transferable-lesson item for any
      government/diplomatic-facing SOC — the AES-CBC arg-decryption + ChaCha20 C2 channel and the
      staged collect-then-wait-then-exfil pattern are hunt-actionable independent of the Southeast
      Asian victim geography.
      Why it clears the gate: new/evolved malware targeting government & diplomatic entities with
      hunt-actionable tradecraft (technique class: T1027 Obfuscated Files or Information for the
      AES-CBC arg encoding, T1573.001 Symmetric Cryptography for the ChaCha20 C2 channel, T1005 Data
      from Local System / T1560.001 Archive via Utility for the ThumbcacheService+7-Zip collection
      stage, T1003.001 OS Credential Dumping: LSASS Memory via Mimikatz, T1090.002 External Proxy
      via Stowaway). Not present anywhere in the 69-item prior-coverage window (checked title,
      entity, and CVE fields — no match).
    region_nexus: "Southeast Asia (victim geography); TTPs (dwell-time exfil against government/diplomatic targets) transferable to any Swiss/EU public-sector or diplomatic-facing environment"
    primary_sector_nexus: "direct — government / law-enforcement / diplomatic targeting"
    sector: "public-sector"
    cves: []
    techniques: [T1027, T1573.001, T1005, T1560.001, T1003.001, T1090.002]
    affected_products: []
    entity_keys: []
