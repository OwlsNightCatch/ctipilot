  - title: "Mandiant: exposed Google Cloud Run/Functions LFI→RCE chains to full-project takeover via metadata-server service-account token theft"
    sources:
      - { url: "https://cloud.google.com/blog/topics/threat-intelligence/exposed-cloud-functions-harden/", publisher: "Google Cloud / Mandiant", date: "2026-07-15", role: primary }
    discovery_trace: >
      first seen at: mandiant-gtig RSS feed, URL https://feeds.feedburner.com/threatintelligence/pvexyqv7v0v
      → primary (no further pivot needed): Google Cloud / Mandiant, URL
      https://cloud.google.com/blog/topics/threat-intelligence/exposed-cloud-functions-harden/
    summary: |
      Mandiant (published 15 July 2026) walks through concrete attack scenarios in which a
      publicly-exposed Cloud Run/Cloud Functions service with an LFI or RCE flaw lets an attacker
      reach the GCP instance-metadata server and extract the service account's bearer token; if the
      function runs under the default compute service account with Editor-equivalent permissions,
      this is described as "equivalent to a full GCP project takeover" — the attacker pivots from
      the serverless function to arbitrary adjacent workloads and secrets. Hardening guidance is
      concrete: isolate public-facing serverless services into their own project, force custom
      least-privilege service accounts (never the default compute SA), front the function with a
      Layer-7 Application Load Balancer plus Cloud Armor WAF rules (named rule IDs
      lfi-v33-stable / rce-v33-stable), and instrument Security Command Center's Cloud Run
      threat-detection module.
      Why it's borderline: this is hardening/technique guidance rather than a named campaign or
      malware family — it does map a concrete attack chain (T1190 Exploit Public-Facing Application
      → T1552.005 Cloud Instance Metadata API → T1078.004 Cloud Accounts) that is directly relevant
      to any public-sector or CI operator running GCP serverless workloads, which is an increasingly
      common migration target for EU government cloud programmes. No specific victim or ITW
      exploitation is claimed — it reads as proactive Mandiant Consulting guidance, not an incident
      writeup.
    region_nexus: "global; directly applicable to any Swiss/EU public-sector or CI cloud-migration programme using GCP serverless"
    primary_sector_nexus: "indirect — cloud-platform hardening guidance, not government-specific"
    sector: "public-sector, finance, telco (any GCP serverless tenant)"
    cves: []
    techniques: [T1190, T1552.005, T1078.004]
    affected_products: ["Google Cloud Run", "Google Cloud Functions"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "Leveraging these compromised secrets or service accounts allows threat actors to pivot to adjacent systems and workloads, potentially resulting in a total environment takeover if proper hardening strategies are not in place."
        attribution: "Mandiant (Google Cloud)"
        source_url: "https://cloud.google.com/blog/topics/threat-intelligence/exposed-cloud-functions-harden/"
