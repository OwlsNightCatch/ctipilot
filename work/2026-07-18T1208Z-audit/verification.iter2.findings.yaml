- code: F4
  category: hallucinated-fact
  section: trending-vulnerabilities
  item: "Moodle local_o365 plugin: unverified JWT signature on the Teams SSO endpoint (CVE-2026-54733)"
  url_or_quote: "entry sources[]: {url: 'https://github.com/microsoft/o365-moodle/security/advisories/GHSA-hqjh-93qv-47v5', date: '2026-07-16'}; entry event_date: '2026-07-16'; entry body: 'disclosed through Microsoft's own repository advisory on 2026-07-16'. Primary source itself (fetched twice this iteration, via jina and WebFetch, identical result both times): '[weilai-irl](https://github.com/weilai-irl) published GHSA-hqjh-93qv-47v5 Jul 6, 2026'."
  summary: "The entry's primary source (the Microsoft o365-moodle GitHub Security Advisory) was actually published 2026-07-06, ten days before the date the entry attributes to it (2026-07-16) in sources[].date, event_date, and body prose. The corroborating BSI CERT-Bund advisory IS correctly dated 2026-07-16 (confirmed via jina fetch of wid.cert-bund.de: 'Produkte' section shows '16.07.2026'; German evidence[] quote verbatim-confirmed) -- the entry appears to have conflated the BSI advisory's publish date with the GHSA's actual publish date and applied the wrong one to the primary source. The identical wrong date recurs in docs/audits/2026-07-18-weekly-quality-audit.md coverage-findings item 3 ('GHSA published 07-16T14:52Z, BSI advisory ... 07-16/17 -- both inside the 07-17 and 07-18 fires' windows'), so the audit report's own root-cause narrative for this 'miss' also rests on the wrong date: if the GHSA was actually public since 07-06, the vulnerability was already 5+ days old before the audit's own window (07-11T14:35Z start) began, which changes the miss's actual severity/timeline, not just a cosmetic citation error. This is exactly the citation-date-drift class the audit's own v3.26 fix targets for the weekly synthesis step -- here it appears, unaddressed, in an audit-recovered daily entry and in the audit report's own prose. Remediation: correct sources[].date and event_date on the Moodle entry to 2026-07-06 (or otherwise reconcile the two advisory dates explicitly in body text), and correct the audit report's coverage-findings item 3 to state the GHSA's actual 07-06 publish date, adjusting the root-cause narrative accordingly (entry immutability note: if policy treats this as a 'minor documentation-level' date correction under the existing 07-11 precedent rather than requiring a fresh update_of entry, that judgment call belongs to the main agent, but the underlying fact must be corrected somewhere reader-visible)."
