- entry: entries/2026-07-13/russia-ip-camera-hijacking-nato-military-supply-routes.md
  verdict: imprecision
  defect: "evidence[] quote #1 ('Dutch intelligence services disclosed Friday that Russian actors had compromised \"a small number of cameras\" ... remote viewing access ...') is attributed to the cited NL Times URL but does not appear verbatim in that article (full jina fetch, 15.7KB, lacks 'small number of cameras', 'remote viewing access', and 'disclosed Friday'); reads like syndicated wire copy from another outlet."
  ground_truth: "The cited NL Times article supports the underlying facts (cameras compromised, reachable because they 'still use default passwords or outdated firmware', AIVD/MIVD disclosure) but not the quoted sentence. Article is dated Saturday 11 July 2026; the 'disclosed Friday' framing implies 10 July, a minor one-day wobble vs the entry's event_date 2026-07-11."
  ground_truth_url: https://nltimes.nl/2026/07/11/dutch-spy-agencies-russia-hacked-cameras-spy-military-routes
