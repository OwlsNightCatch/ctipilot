- entry: entries/2026-07-12/weekly-w28-third-party-cloud-account-exposure.md
  verdict: factual-error
  defect: "The claim that Nayax's cloud-account incident was 'claimed by \"The Syndicate\"' is cited solely to Nayax's own SEC Form 6-K, which does not mention 'The Syndicate' anywhere; that attribution originates from DataBreaches.net (2026-07-08), a source this weekly entry never cites. The Nayax SEC-filing citation date is also off by one day (cited 07-09, actual filing date 07-08), and the Cybernews/Nextcloud citation is off by two days (cited 07-10, actual 07-08). Every other incident's core facts (Accenture 35GB/888, Deutsche Bank/Unsafe, KDDI 12M/zero-day, Odido/Dutch-police voice evidence, Nextcloud 367K/Elasticsearch) are verbatim-verified accurate."
  ground_truth: "Nayax SEC 6-K: 'An unusual activity was detected in relation to one of Nayax's subsidiaries, in one of the company's cloud accounts, which was immediately blocked and contained' — no mention of an attacker name. The 'Syndicate' claim and its 1B-record figure originate from DataBreaches.net, 2026-07-08 (cited in the in-store operational entry, not in this weekly)."
  ground_truth_url: "https://www.sec.gov/Archives/edgar/data/1901279/000117891326003440/zk2635660.htm ; https://databreaches.net/2026/07/08/nayax-investigating-breach-the-syndicate-claims-it-acquired-1-billion-card-records-and-other-important-data/"

