- entry: entries/2026-07-12/weekly-w28-exploited-edge-enterprise-software.md
  verdict: factual-error
  defect: "The claim 'Langflow's cross-tenant IDOR (CVE-2026-55255) ... now KEV-listed' is cited solely to the Sysdig post, but that post — published 2026-06-26, not 2026-07-08 as cited — explicitly states the IDOR is NOT in KEV ('This vulnerability is not in CISA KEV'); only the paired RCE CVE-2026-33017 was in KEV at that time (since March 2026). The KEV-listing of CVE-2026-55255 itself only happened 2026-07-07/08 per a different in-store source (BleepingComputer) that this weekly does not cite. Two further citation dates are also off by 1-2 days (BleepingComputer ColdFusion cited 07-08, actual 07-06; Huntress CitrixBleed cited 07-10, actual 07-09)."
  ground_truth: "Sysdig (2026-06-26): 'CVE-2026-55255 (the IDOR): ... This vulnerability is not in CISA KEV ... CVE-2026-33017 (the RCE): CISA KEV (added March 25, 2026)'. BleepingComputer (2026-07-08): 'On Tuesday, CISA added the CVE-2026-55255 authorization bypass to its Known Exploited Vulnerabilities Catalog (KEV)'."
  ground_truth_url: "https://www.sysdig.com/blog/understanding-langflow-cve-2026-55255-and-why-higher-cvss-vulnerabilities-arent-always-the-most-exploited ; https://www.bleepingcomputer.com/news/security/cisa-orders-feds-to-prioritize-patching-langflow-auth-bypass-flaw/"

