- entry: entries/2026-07-12/weekly-w28-government-public-admin-targeting.md
  verdict: factual-error
  defect: "The claim 'a crew breached ... LVM ... through a service left unpatched for roughly two years' is cited to CERT.LV's own bulletin, but that bulletin (fetched in full) contains no such statement — it only gives generic guidance about timely patching and frames the actor as an EU/NATO cross-border threat (which IS accurate). The specific 'two years unpatched' detail is sourced in-store to The Record (2026-07-09, quoting LVM's IT director), which this weekly entry does not cite at all. Separately, the Kaspersky Securelist citation is off by 8 days (cited 07-11, actual 07-03) and the SentinelLabs citation is off by 1 day (cited 07-10, actual 07-09)."
  ground_truth: "CERT.LV bulletin's only patch-related text: 'CERT.LV atgādina, ka visbiežāk kiberuzbrukumi notiek, izmantojot ievainojamības publiskā tīklā pieejamās informācijas sistēmās vai ar pikšķerēšanas uzbrukumu starpniecību' (generic reminder, no duration given). The 'two years' figure appears only in the in-store operational entry's citation to The Record: 'The attackers exploited a vulnerability in a system that had not been updated for two years, but he did not identify the affected software.'"
  ground_truth_url: "https://cert.lv/lv/2026/06/as-latvijas-valsts-mezi-kiberdrosibas-incidents-aktuala-informacija ; https://therecord.media/latvia-state-owned-foresty-company-lvm-ransomware"

