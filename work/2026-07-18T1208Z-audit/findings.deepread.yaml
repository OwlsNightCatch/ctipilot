    summary: |
      WP2Shell is a two-CVE, unauthenticated pre-auth-to-RCE chain in WordPress
      core (not a plugin) disclosed and patched same-day on 2026-07-17.
      CVE-2026-60137 (CWE-89, SQL Injection) is an unsanitised author__not_in
      parameter in WP_Query, present since 6.8.0 — on its own it requires a
      plugin/theme to pass untrusted input to the parameter (i.e. it is not
      directly reachable pre-auth in a bare core install). CVE-2026-63030
      (CWE-436, Interpretation Conflict) is the piece that changes that: a
      route-confusion bug in the REST API batch endpoint (/wp-json/batch/v1,
      also reachable via ?rest_route=/batch/v1) present from WordPress 6.9.0,
      lets an anonymous request reach the author__not_in injection path with no
      authentication and no plugins required. VulnCheck's independent write-up
      (not the discoverer's) describes the observed attack chain as: batch-route
      confusion bypasses auth → SQL injection dumps the database → attacker
      extracts and offline-cracks an admin password hash → attacker logs in as
      admin → uploads a webshell or otherwise abuses admin-level functionality.
      The discoverer (Searchlight Cyber / Assetnote, researcher Adam Kues)
      explicitly withheld exploit mechanics in its own write-up ("we are not
      releasing technical details at this time") and instead published a
      detection-only checker at wp2shell.com; the detailed mechanics above come
      from VulnCheck's own research, not the discoverer. Affected: WordPress
      6.8.0–6.8.5 (SQLi only, not remotely reachable pre-auth without a
      vulnerable plugin/theme), 6.9.0–6.9.4 and 7.0.0–7.0.1 (full unauthenticated
      RCE chain). Fixed in 6.8.6, 6.9.5, 7.0.2 (and backported to 7.1 beta2),
      released 2026-07-17 with WordPress.org noting the release is being pushed
      via forced automatic updates for vulnerable sites. CVSS is contested
      between two NVD-listed assigners: WPScan (the CNA) scores CVE-2026-63030
      at 9.8 CRITICAL (AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H) and CVE-2026-60137
      at 5.9 MEDIUM (AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:N/A:N); NVD's own ADP
      (CISA-ADP) instead scores CVE-2026-63030 at 7.5 HIGH
      (AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N — no integrity impact) and
      CVE-2026-60137 at 9.1 CRITICAL (AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N) — the
      two assigners disagree by 2.3-3.2 points on each CVE and even disagree on
      which of the two CVEs is the more severe one; ENISA EUVD carries the
      WPScan/CNA scores (9.8 / 5.9). Neither WordPress.org's own advisory text
      nor GHSA state a numeric CVSS at all — GHSA labels CVE-2026-63030
      "Critical" and CVE-2026-60137 "Moderate" without a score. Exploitation
      status is genuinely contested between sources as of the audit's
      2026-07-18T04:09Z cutoff: Rapid7 (as of 2026-07-17T21:45Z) states it is
      "not aware of publicly confirmed in-the-wild exploitation"; VulnCheck (same
      day) relays a claim that "Patchstack is reporting exploitation of
      CVE-2026-63030 as of shortly before 7 PM ET on Friday, July 17" but adds
      the caveat "it's unclear what exactly is being observed in the wild"; this
      sub-agent fetched Patchstack's own public database entry directly and
      found only Patchstack's standard predictive risk template ("This
      vulnerability is highly dangerous and expected to become exploited" —
      future tense, used broadly across Patchstack's database, not a
      dated/timestamped detection claim) — no first-hand "detected in the wild"
      language was found on the page as fetched. The Hacker News, in a
      2026-07-18-dated update (exact time not recoverable), states plainly
      "none has been reported as of July 18" and that the CVE pair is "not on
      CISA's KEV catalog, which takes confirmed exploitation." NCSC-NL's own
      advisory (published 2026-07-18T11:01:56Z — AFTER the audit's cutoff) does
      not claim active exploitation either; it states an expectation of
      short-term exploitation. Net assessment: as of the 04:09Z cutoff, the
      most defensible position is "no independently confirmed in-the-wild
      exploitation; a public checker/PoC-adjacent tool exists (wp2shell.com,
      detection-only); at least one vendor (Patchstack, via a secondhand
      VulnCheck citation) suggested activity within hours of disclosure but
      that claim is unconfirmed and not corroborated by Patchstack's own
      published page text as fetched" — this contradiction should be held, not
      resolved, in any resulting entry.
