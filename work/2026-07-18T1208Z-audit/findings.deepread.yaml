      DATA-QUALITY NOTE ON TASK INPUTS: the task-supplied ENISA EUVD id
      EUVD-2026-45236 does NOT correspond to this WordPress item — it resolves
      to an unrelated IBM Langflow OSS pre-auth RCE (CVE-2026-9198,
      /api/v1/auto_login + /api/v1/validate/code chain). The correct EUVD id
      for CVE-2026-60137 is EUVD-2026-45279 (confirmed by direct fetch,
      matching WPScan-assigned CVSS 5.9 and identical description/reference
      set to the NVD record). Recommend correcting this in any published
      output; do not cite EUVD-2026-45236 against this item.
      BEHAVIORAL / TELEMETRY NOTES (only what sources state — no invented
      specifics beyond this): legitimate use of the WordPress REST API batch
      endpoint (/wp-json/batch/v1, alias ?rest_route=/batch/v1) is a normal,
      low-volume, typically-authenticated (nonce-bearing) request pattern used
      by the WordPress block editor and some plugins to bundle multiple REST
      calls; none of the fetched sources published a specific benign-vs-malicious
      discriminator (e.g. request body shape, parameter names beyond
      author__not_in, or volumetric signature) beyond naming the endpoint path
      and the injected parameter — Searchlight Cyber explicitly withheld this
      detail. Defenders should treat "anonymous/unauthenticated requests to
      /wp-json/batch/v1 or ?rest_route=/batch/v1 containing author__not_in (or
      other WP_Query parameters) in the batched sub-request bodies" as the
      hunt pattern implied by the CVE descriptions, pending fuller technical
      writeups once patch adoption is further along (Searchlight's own
      statement: technical details deliberately withheld "at this time").
      Interim mitigation per Searchlight Cyber: install a plugin blocking
      anonymous REST API access entirely, or block /wp-json/batch/v1 and
      ?rest_route=/batch/v1 at a WAF, noting both may break legitimate site
      functionality and are emergency-only measures pending the version
      update. WordPress.org's release post additionally notes forced
      automatic background updates are being pushed to vulnerable sites
      (WordPress core's built-in auto-update mechanism for security releases).
      ATT&CK mapping rationale: T1190 (Exploit Public-Facing Application) for
      the unauthenticated REST-API entry vector; T1505.003 (Web Shell) for the
      documented post-exploitation step (VulnCheck: "upload a webshell");
      T1110.002 (Password Cracking) for the documented offline hash-cracking
      step after SQLi-dumped credentials; T1078 (Valid Accounts) for the
      subsequent admin-level authenticated access using the cracked
      credentials. All four ids verified active (non-revoked, non-deprecated)
      against the pinned attack/enterprise-attack.json.

