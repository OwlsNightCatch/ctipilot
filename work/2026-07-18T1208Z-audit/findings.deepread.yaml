    summary: |
      CVE-2026-54733 (CWE-347, Improper Verification of Cryptographic
      Signature) is an authentication-bypass vulnerability in local_o365, the
      Microsoft-maintained Office 365 / Entra ID integration plugin for
      Moodle (repo microsoft/o365-moodle). The Teams single-sign-on endpoint
      sso_login.php base64-decodes an incoming JWT payload and authenticates
      the requester as the Moodle user matching the token's `upn` claim
      WITHOUT verifying the JWT's cryptographic signature. Because the
      signature is never checked, an unauthenticated attacker can construct
      an arbitrary JWT with any `upn` value and obtain a valid Moodle session
      for that (O365-authenticated) user — including, per the advisory text,
      administrator accounts, since the endpoint performs no privilege
      distinction. This is a classic "alg confusion / unverified signature"
      class flaw (CWE-347), distinct from a signing-key leak: the attacker
      needs no cryptographic material at all, only a syntactically valid JWT
      structure. Affected: versions prior to 4.5.6 (the 4.5.x branch), prior
      to 5.0.5 (5.0.x branch, introduced at 5.0.0), and prior to 5.1.1 (5.1.x
      branch, introduced at 5.1.0) — i.e. essentially every currently
      supported branch line was vulnerable. Fixed in 4.5.6, 5.0.5, and 5.1.1,
      released via three GitHub tags (v20260423_m405, v20260423_m500,
      v20260423_m501) with three corresponding fix commits. NVD assigns a
      CVSS v4.0 score of 9.3 CRITICAL
      (AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N), attributed by
      NVD's extraction to "GitHub, Inc." (i.e. the GHSA CNA scored it, NVD did
      not independently assign a v3.1 score as of this fetch). BSI's CSAF
      record (WID-SEC-2026-2400) carries an aggregate severity of "hoch"
      (German: "high") but — notably — does NOT carry a numeric CVSS score in
      its vulnerabilities[] block at all (only a CVE id, product_status, and
      release_date); its narrative "Angriff" (attack) section is
      generic/templated boilerplate that describes "Microsoft Office 365"
      broadly ("The Microsoft Office Suite includes numerous office
      applications such as word processing, spreadsheet, database and other
      applications") rather than anything specific to the Moodle plugin or
      JWT mechanism — this reads as BSI's standard auto-generated
      product-description template attached by product-name match rather than
      a bespoke technical writeup, and should not be read as an independent
      technical characterization. This item disclosed through Microsoft's own
      GitHub security-advisory process for the o365-moodle repository — it did
      NOT go through Moodle.org's own MSA-numbered security-announcement
      bulletin process (a targeted search of moodle.org/security-adjacent
      coverage found no matching MSA bulletin), consistent with local_o365
      being a Microsoft-maintained third-party integration rather than Moodle
      core or a Moodle-vetted plugin-directory entry. No source fetched in
      this run reports observed or confirmed in-the-wild exploitation of
      CVE-2026-54733 — treat exploitation status as "none reported" per all
      four fetched sources.
