        attribution: "BleepingComputer, citing CISA"
        source_url: "https://www.bleepingcomputer.com/news/security/cisa-warns-feds-to-patch-exploited-fortinet-fortisandbox-flaws-by-sunday/"
      - quote: "We are observing exploitation of multiple Fortinet FortiSandbox vulnerabilities during the past 24 hours, including: CVE-2026-39813, CVE-2026-39808, CVE-2026-25089."
        attribution: "Defused (threat intelligence firm), via BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/cisa-warns-feds-to-patch-exploited-fortinet-fortisandbox-flaws-by-sunday/"
