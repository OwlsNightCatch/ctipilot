  - title: "Fortinet FortiSandbox unauthenticated OS command injection (CVE-2026-25089, CVE-2026-39808) confirmed exploited, added to CISA KEV"
    date: "2026-07-16"
    status: possible-gap
    sources:
      - { url: "https://www.cisa.gov/news-events/alerts/2026/07/16/cisa-adds-three-known-exploited-vulnerabilities-catalog", publisher: "CISA", date: "2026-07-16", role: "primary" }
