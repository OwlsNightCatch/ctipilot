    extended_notes: |
      cve_table entries below. A third related CVE, CVE-2026-39813 (path traversal in the FortiSandbox JRPC API, CVSS 9.8, affecting the same version ranges), is being exploited alongside the two KEV-listed CVEs per Defused's telemetry but has not itself been added to KEV as of this audit — worth a follow-up check in the next daily run.

  - title: "WordPress Core \"WP2Shell\" — unauthenticated REST API batch-route confusion chained with WP_Query SQL injection to remote code execution (CVE-2026-63030, CVE-2026-60137)"
    date: "2026-07-17"
    status: possible-gap
    sources:
      - { url: "https://slcyber.io/research-center/wp2shell-pre-authentication-rce-in-wordpress-core", publisher: "Searchlight Cyber (discoverer)", date: "2026-07-17", role: "primary" }
