        source_url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0250"
    extended_notes: |
      A public detection-only PoC exists (Senanfurkan/wordpress-cve-2026-63030 on GitHub) — non-destructive route-confusion + time-based blind SQLi checks, explicitly NOT a working RCE exploit. Do not conflate with a public working exploit; the discoverer withheld full exploitation detail. Some secondary aggregator coverage (not corroborated by the primary) claimed a persistent-object-cache dependency as a prerequisite; this audit could not confirm that detail against Searchlight Cyber's own write-up, which states no preconditions — flag as unconfirmed if the main agent composes this.

  - title: "Microsoft Office 365 Integration plugin for Moodle (local_o365) — unverified JWT signature on Teams SSO endpoint enables full site takeover (CVE-2026-54733)"
    date: "2026-07-16"
    status: possible-gap
    sources:
      - { url: "https://github.com/microsoft/o365-moodle/security/advisories/GHSA-hqjh-93qv-47v5", publisher: "Microsoft/o365-moodle GitHub Security Advisory (CVE-2026-54733)", date: "2026-07-06", role: "primary" }
      - { url: "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-2400", publisher: "BSI CERT-Bund (WID-SEC-2026-2400)", date: "2026-07-16", role: "primary" }
    discovery_trace: "first seen at: bsi-rss feed (python3 tools/fetch_source.py feed https://wid.cert-bund.de/content/public/securityAdvisory/rss 30) → \"[NEU] [hoch] Microsoft Office 365 (Moodle Plugin)\" WID-SEC-2026-2400, published 2026-07-17T10:50Z, not in prior_coverage.json → drilled via bridge (python3 tools/fetch_source.py bsi-csaf WID-SEC-2026-2400) → CVE-2026-54733 → primary: GitHub security advisory GHSA-hqjh-93qv-47v5 (microsoft/o365-moodle repo)"
    summary: |
      BSI/CERT-Bund published advisory WID-SEC-2026-2400 on 2026-07-16/17 (severity "hoch"/high) for CVE-2026-54733, a critical authentication-bypass flaw in local_o365, the official Microsoft Office 365 Integration plugin for Moodle — the learning-management system heavily used across European education and public-sector training institutions. The flaw sits in sso_login.php, the plugin's Teams SSO endpoint: the code decodes an incoming JWT's payload and authenticates the user based solely on the "upn" (user principal name) claim, without ever verifying the JWT's cryptographic signature. Per the GitHub advisory, "the signature component was extracted but never verified. Authentication proceeded solely on the upn claim value in the unvalidated payload" — meaning an unauthenticated remote attacker who knows or can enumerate any O365-authenticated user's email address (UPN) can forge a JWT carrying an arbitrary upn claim and be authenticated as that user, including a site administrator, "effectively [allowing] full site takeover." Affected versions are local_o365 < 4.5.6, 5.0.0-5.0.5, and 5.1.0-5.1.1; fixed in 4.5.6, 5.0.5 and 5.1.1 respectively (GitHub advisory dated 2026-07-06; BSI's own advisory surfaced it fresh in-window on 2026-07-16/17). No in-the-wild exploitation is reported by either source, but the prerequisite (knowing/enumerating a UPN) is trivial against most institutional email-naming conventions. Directly relevant to the "wider Swiss/European public sector (education, research)" scope of this constituency's coverage given Moodle's dominant position in EU higher-education and vocational-training IT.
    region_nexus: "Europe-wide (Moodle is the dominant LMS across EU/CH universities, vocational schools and public-sector training programmes)"
    primary_sector_nexus: "indirect via education/research (part of the wider public-sector remit)"
    sector: "public-sector (education, research)"
