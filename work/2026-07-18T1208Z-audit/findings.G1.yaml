      - { url: "https://github.com/Senanfurkan/wordpress-cve-2026-63030", publisher: "GitHub (public detection PoC repo)", date: "2026-07-18", role: "corroborating" }
    discovery_trace: "first seen at: ENISA EUVD (enisa-euvd recent criticals bridge) → EUVD-2026-45280/45236, CVE-2026-63030/60137, datePublished 2026-07-17, not in prior_coverage.json → primary: Searchlight Cyber's own disclosure write-up (slcyber.io) and WordPress.org's 7.0.2 release announcement / GitHub security advisory GHSA-ff9f-jf42-662q → corroboration: NCSC-NL advisory NCSC-2026-0250 (2026-07-18) assessing near-term exploitation is expected → corroboration: public GitHub detection-only PoC repo (Senanfurkan/wordpress-cve-2026-63030) confirming scanner-grade exploitation code is already public"
    summary: |
      WordPress shipped 7.0.2 on 2026-07-17 (with backports 6.9.5, 6.8.6, 7.1 beta2) fixing a pre-authentication RCE chain researcher Adam Kues of Searchlight Cyber/Assetnote calls "WP2Shell": a route-confusion weakness (CWE-436) in the unauthenticated REST API batch endpoint (/wp-json/batch/v1, or ?rest_route=/batch/v1) that runs several sub-requests in one call — a parsing quirk desynchronizes two internal arrays so one sub-request executes under another's handler — chained with an SQL injection (CVE-2026-60137, CWE-89) in the author__not_in parameter of WP_Query, the class that builds nearly every WordPress database query. The chain (tracked as CVE-2026-63030 for the RCE component) requires no authentication, no plugins, and no special configuration: Searchlight Cyber states "the attack has no preconditions and can be exploited by an anonymous user in a stock install of WordPress with no plugins." CVE-2026-63030 affects WordPress 6.9.0-6.9.4 and 7.0.0-7.0.1; the underlying SQL-injection component (CVE-2026-60137) reaches back to 6.8.x. Searchlight Cyber withheld full technical exploit details and instead published a public vulnerability-checker tool (wp2shell.com); a separate, independently-published GitHub repository already offers a detection-only PoC (time-based blind SQLi + structural route-confusion probing, explicitly not a working RCE exploit) confirming scanning activity is underway. NCSC-NL's advisory (2026-07-18) explicitly assesses that "since vulnerabilities in content management systems structurally interest malicious actors, the NCSC expects the vulnerabilities will be exploited in the short term" and recommends WAF-blocking the batch endpoint as an interim mitigation if patching is not immediately possible. This is directly relevant to the constituency given WordPress's ubiquity across Swiss/European municipal, cantonal and public-sector web presences — comparable in scale/actionability to the Joomla extension file-upload RCE wave already tracked in this store, but affecting WordPress Core itself rather than a third-party extension.
    region_nexus: "global; WordPress Core affects an enormous base of Swiss/European municipal, cantonal, public-sector and SME web presences"
    primary_sector_nexus: "direct — public-sector web infrastructure (municipal/cantonal sites commonly run WordPress)"
    sector: "public-sector (all sectors running public-facing WordPress sites)"
    cves: ["CVE-2026-63030", "CVE-2026-60137"]
