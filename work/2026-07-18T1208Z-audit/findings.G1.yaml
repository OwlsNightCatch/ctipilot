      - { url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0245", publisher: "NCSC-NL (NCSC-2026-0245)", date: "2026-07-17", role: "corroborating" }
    discovery_trace: "first seen at: cisa-kev bridge (python3 tools/fetch_source.py cisa-kev) → both CVEs dateAdded 2026-07-16, not in prior_coverage.json → primary: Fortinet PSIRT FG-IR-26-141 (CVE-2026-25089) and FG-IR-26-100 (CVE-2026-39808) → corroboration: CISA alert page (bridge url fetch, jina fallback) and BleepingComputer → cross-checked: ENISA EUVD (enisa-euvd recent exploited) confirms both, exploitedSince 2026-07-16 → cross-checked: NCSC-NL advisory NCSC-2026-0245 (2026-07-17) also flags CVE fixed in Fortinet FortiSandbox"
    summary: |
      CISA added CVE-2026-25089 and CVE-2026-39808 to its Known Exploited Vulnerabilities catalog on 2026-07-16, both unauthenticated OS command-injection flaws (CWE-78, CVSS 3.1 9.1) in Fortinet FortiSandbox, FortiSandbox Cloud, and FortiSandbox PaaS reachable via specially crafted HTTP requests with no authentication and no user interaction. CVE-2026-39808 lives in a FortiSandbox API endpoint (fixed in Fortinet's April 2026 advisory FG-IR-26-100, affecting FortiSandbox 4.4.0-4.4.8, fixed 4.4.9+); CVE-2026-25089 is a second-order OS command injection via JSON input on the "start vnc" feature in the WEB UI (fixed in Fortinet's June 2026 advisory FG-IR-26-141, affecting FortiSandbox 5.0.0-5.0.5 / 4.4.0-4.4.8 / 4.4.2-all / Cloud 5.0.4-5.0.5 / PaaS 5.0.4-5.0.5, fixed 5.0.6+/4.4.9+). Threat-intel firm Defused reported observing exploitation attempts against both flaws (plus a related path-traversal flaw CVE-2026-39813) in the 24 hours before CISA's alert. FortiSandbox is a high-value target because integrated Fortinet products (FortiGate, FortiMail, FortiWeb, FortiProxy) consume its threat verdicts to drive automated blocking decisions, so a compromised sandbox appliance can poison downstream enforcement. Federal agencies were given until 2026-07-19 to patch under BOD 26-04. Fortinet already appears heavily in this store's coverage window (FortiGate/Static Tundra router-hijacking on 2026-07-13) — this is a second, distinct Fortinet product line under active exploitation the same week.
    region_nexus: "global; Fortinet FortiSandbox is deployed across Swiss/European public-sector and CI security-operations stacks as a malware-detonation appliance feeding FortiGate/FortiMail/FortiWeb enforcement"
    primary_sector_nexus: "indirect — security-infrastructure product, cross-sector"
    sector: "public-sector, energy, water, transport, healthcare, finance, telco (any FortiGate/FortiSandbox-integrated estate)"
    cves: ["CVE-2026-25089", "CVE-2026-39808"]
    techniques: ["T1190"]
    affected_products: ["Fortinet FortiSandbox", "FortiSandbox Cloud", "FortiSandbox PaaS"]
