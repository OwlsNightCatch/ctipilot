    discovery_trace: "first seen at: ncsc-ch-security-hub bridge (ncsc-csh recent 10) → post 12577 at https://security-hub.ncsc.admin.ch/#/posts/12577 flagged 'Actively Exploited' → pivoted to BleepingComputer primary at https://www.bleepingcomputer.com/news/microsoft/microsoft-warns-of-exchange-zero-day-flaw-exploited-in-attacks/ → MSRC API msrc cve CVE-2026-42897 confirmed exploited=Yes → BSI CSAF bsi-csaf WID-SEC-2026-1536 → NCSC-NL CSAF ncsc-nl csaf NCSC-2026-0159 → CISA KEV bridge confirmed dateAdded=2026-05-15"
    summary: |
      CVE-2026-42897 (CVSS 3.1: 8.1 HIGH, CWE-79, MSRC severity: Critical) is a stored cross-site scripting
      vulnerability in Microsoft Exchange Server's Outlook Web Access (OWA) email rendering engine. The attack
      vector requires an adversary to send a specially crafted email; when the target opens the message in OWA
      (browser), unsanitised attacker-controlled input is injected into the DOM, executing arbitrary JavaScript
      in the recipient's browser session. The JavaScript can steal session cookies, forge OWA requests, perform
      OAuth-token harvesting, pivot to internal intranet targets reachable from the browser, or redirect the
      user — all without any file execution on the endpoint itself, bypassing many EDR detection paths. Microsoft
      disclosed and confirmed active exploitation on 2026-05-14; CISA added CVE-2026-42897 to the Known
      Exploited Vulnerabilities catalogue on 2026-05-15 with a federal-agency remediation deadline. No
      traditional patch is available; Microsoft instead issued an automatic mitigation (ID M2.1.x) via the
      Exchange Emergency Mitigation Service (EEMS), which is enabled by default on Exchange 2016, 2019, and
      Subscription Edition. Administrators must verify EEMS is running (`Get-ExchangeDiagnosticInfo`) and that
      mitigation M2.1.x appears in the applied-mitigations list. Known side-effects of the mitigation include
      broken OWA Calendar Print and inline-image display failures. Exchange Online is not affected. NCSC-CH,
      BSI, and NCSC-NL all flagged this within hours of the Microsoft disclosure. Pwn2Own researchers
      subsequently published additional technical detail that widens the exploitation surface, per CyberKendra.
      Affected versions: Exchange Server 2016 CU23, Exchange Server 2019 CU14 and CU15, Exchange Server SE
      (RTM and CU1). Detection: WAF/proxy logs for crafted HTML in email payloads; OWA access-log anomalies for
      unusual JavaScript execution or cross-origin requests; browser Content Security Policy violation reports
      if CSP is enforced on OWA; EEMS status checks via Exchange Management Shell. MITRE: T1566.001
      (Spearphishing Attachment / crafted email), T1059.007 (JavaScript), T1185 (Browser Session Hijacking).
    ch_eu_nexus: "global; on-prem Exchange widely deployed across CH/EU cantonal, federal, municipal, healthcare, and university environments. NCSC-CH, BSI, NCSC-NL all published coordinated advisories within hours."
    public_sector_nexus: "direct — on-prem Exchange is the dominant email platform across EU central government, cantonal administrations, healthcare sector and universities"
    sector: "government, healthcare, education, finance"
