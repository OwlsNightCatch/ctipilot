    extended_notes: |
      The MSRC CVSS temporal score is 7.5 (E:F / RL:O / RC:C), meaning Microsoft assesses the exploit as
      functional and the remediation as official (EEMS). EPSS: 12.34% per ENISA EUVD (EUVD-2026-30343),
      updated 2026-05-16. The FAQ in the MSRC advisory references the Exchange blog post
      https://techcommunity.microsoft.com/blog/exchange/addressing-exchange-server-may-2026-vulnerability-cve-2026-42897/4518498
      (returned 502 at time of fetch). Swiss public-sector defenders should confirm EEMS service status
      immediately; the NCSC-CH advisory references EOMT as a manual fallback.

  - title: "DHTMLX Gantt/Scheduler PDF Export Module: unauthenticated RCE (CVE-2026-41553, CVSS 10.0) and path traversal (CVE-2026-41552, CVE-2026-7182) — CERT-PL coordinated disclosure, fix available"
    sources:
      - url: "https://cert.pl/en/posts/2026/05/CVE-2026-7182/"
        publisher: "CERT Polska"
        date: "2026-05-15"
        role: "primary"
      - url: "https://euvd.enisa.europa.eu/enisa/eu_vulnerability_database/EUVD-2026-30537"
        publisher: "ENISA EUVD"
        date: "2026-05-15"
        role: "corroborating"
    discovery_trace: "first seen at: enisa-euvd bridge (enisa-euvd recent lastvulnerabilities) → EUVD-2026-30537 at score 10.0 flagged, assigner CERT-PL → pivoted to primary: CERT Polska at https://cert.pl/en/posts/2026/05/CVE-2026-7182/ → ENISA EUVD entries for EUVD-2026-30538, EUVD-2026-30539 corroborated cluster"
    summary: |
      CERT Polska (CERT-PL) disclosed three vulnerabilities in DHTMLX software products on 2026-05-15 after
      coordinating their disclosure. DHTMLX Gantt and Scheduler are JavaScript-based Gantt chart and
      scheduling UI libraries widely embedded in enterprise project-management, ERP, and e-Government portal
      applications across Europe. The critical finding is CVE-2026-41553 (CVSS 4.0: 10.0, ENISA EUVD score
      10.0, EPSS 0.39) — unauthenticated RCE in the DHTMLX PDF Export Module (self-hosted Node.js service)
      via the unsanitised `data` parameter: an unauthenticated attacker injects malicious JavaScript into the
      `data` parameter of the PDF export endpoint, which is processed by Node.js and executed server-side,
      achieving arbitrary command execution on the host. This is a T1190 (Exploit Public-Facing Application)
      combined with T1059.001-equivalent (server-side JS execution). Prerequisite: the self-hosted PDF Export
      Module must be network-reachable; versions before 0.7.6 are affected. A companion path-traversal
      CVE-2026-41552 (CVSS 4.0: 9.2) allows unauthenticated local file inclusion in the Gantt/Scheduler PDF
      export via the `src` HTML attribute. A third vulnerability CVE-2026-7182 (CVSS 4.0: 9.2) is a
      path-traversal in DHTMLX Diagram's export module (Diagram version before 1.1.1). All three require no
      authentication. Fixes: PDF Export Module 0.7.6 closes CVE-2026-41552 and CVE-2026-41553; Diagram 1.1.1
      closes CVE-2026-7182. Defence: if the self-hosted export module cannot be patched immediately, restrict
      network access to the Node.js PDF export service to only internal trusted origins; apply egress filtering
      from the Node.js process. Detection: Node.js process anomalies launching child processes, outbound
      connections from the export service process, web access logs for crafted `data` parameter payloads.
    ch_eu_nexus: "indirect — DHTMLX Gantt/Scheduler is embedded in many EU e-Government, municipal, and healthcare portals that expose project-management or scheduling features. The EU's public-sector portal ecosystem heavily uses self-hosted JS libraries."
    public_sector_nexus: "indirect — EU public-sector digital-services portals widely use embedded Gantt/Scheduler components"
    sector: "government, healthcare, finance, education"
    cves: [CVE-2026-41553, CVE-2026-41552, CVE-2026-7182]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "CVE-2026-41553: PDF Export Module used in DHTMLX's products Gantt and Scheduler is vulnerable to Remote Code Execution due to lack of `data` parameter sanitization. An unauthenticated attacker can inject the malicious JavaScript code to the parameter whose value is processed by Node.js and subsequently executed. This can lead to server compromise."
        attribution: "CERT Polska"
        source_url: "https://cert.pl/en/posts/2026/05/CVE-2026-7182/"
      - quote: "baseScore: 10.0, CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H, assigner: CERT-PL"
        attribution: "ENISA EUVD (EUVD-2026-30537)"
        source_url: "https://euvd.enisa.europa.eu/enisa/eu_vulnerability_database/EUVD-2026-30537"
    extended_notes: |
      DHTMLX is a Ukrainian company (Dinamika Web); their Gantt and Scheduler libraries are sold commercially
      and OEM-embedded. No known exploitation as of disclosure date — ENISA EUVD EPSS 0.39 for CVE-2026-41553.
      But the CVSS 10.0 unauthenticated RCE in a widely-embedded server-side component warrants immediate
      enumeration of exposed export service instances.

  - title: "SzafirHost CVE-2026-44088 — JAR Central Directory zip-polyglot bypass enables unauthenticated RCE in Poland's official qualified e-signature infrastructure"
    sources:
      - url: "https://cert.pl/en/posts/2026/05/CVE-2026-44088/"
        publisher: "CERT Polska"
        date: "2026-05-15"
        role: "primary"
      - url: "https://euvd.enisa.europa.eu/enisa/eu_vulnerability_database/EUVD-2026-30512"
        publisher: "ENISA EUVD"
        date: "2026-05-15"
        role: "corroborating"
    discovery_trace: "first seen at: enisa-euvd bridge (enisa-euvd recent lastvulnerabilities) → EUVD-2026-30512 at score 8.6, assigner CERT-PL, references cert.pl/posts/2026/05/CVE-2026-44088 → pivoted to primary: CERT Polska at https://cert.pl/en/posts/2026/05/CVE-2026-44088/"
    summary: |
      CVE-2026-44088 (CVSS 4.0: 8.6, ENISA EUVD EUVD-2026-30512, CNA: CERT-PL) is a security-critical flaw
      in SzafirHost — the browser-integration component of the Szafir qualified electronic signature (QES)
      ecosystem operated by KIR (Krajowa Izba Rozliczeniowa), Poland's national interbank clearing house and
      a qualified trust service provider under eIDAS. SzafirHost is deployed as a browser helper that
      downloads and loads signed JAR files to integrate smart-card signing into web browsers (Chrome, Firefox,
      Opera). The vulnerability exploits a class-loading split-brain: SzafirHost verifies the JAR's code
      signing certificate using `JarInputStream` which reads metadata from the start of the archive, but
      loads the actual classes using `JarFile`/`URLClassLoader` which reads from the ZIP Central Directory
      at the end of the file. An attacker who controls the download path (MitM, DNS interception, or
      compromised delivery server) can serve a zip polyglot — a genuine, validly-signed JAR prepended or
      combined with a malicious ZIP whose Central Directory overrides class paths — causing signature
      verification to pass on the legitimate content while the malicious class is executed. This is a
      T1553.002 (Subvert Trust Controls: Code Signing) combined with T1574 (Hijack Execution Flow) pattern.
      Fixed in SzafirHost 1.2.1. This issue has direct EU public-sector implications because Szafir is used
      to sign legally binding documents in Polish e-Government portals (e.g. ePUAP), court filings,
      procurement processes, and interoperability with eIDAS cross-border QES recognition. A compromised
      SzafirHost could silently sign fraudulent documents in the context of an authenticated user's session.
      EPSS 0.34 at disclosure; no observed exploitation reported. The CVSS 4.0 vector reflects UI:A (a user
      must trigger signing action) — prerequisite is MitM on the SzafirHost JAR download path or server-side
      compromise.
    ch_eu_nexus: "direct — SzafirHost is a component of Poland's national eIDAS-recognised qualified trust service infrastructure; Szafir QES is used in Polish public administration, courts, procurement, and healthcare. The zip-polyglot JAR bypass affects the integrity of qualified electronic signatures used in cross-border EU eIDAS workflows."
    public_sector_nexus: "direct — Polish e-Government portals, courts, procurement platforms, healthcare"
    sector: "government, legal, healthcare, finance"
    cves: [CVE-2026-44088]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "SzafirHost verifies the signature of the downloaded JAR file using class JarInputStream (reading from the beginning of the file), but loads classes using class JarFile/URLClassLoader (reading the Central Directory from the end). It can lead to remote code execution by allowing an attacker to combine a genuine, signed JAR file with a malicious ZIP file, causing the verification to pass but the malicious class to be loaded."
        attribution: "CERT Polska"
        source_url: "https://cert.pl/en/posts/2026/05/CVE-2026-44088/"
      - quote: "baseScore: 8.6 / CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:A/VC:H/VI:H/VA:H/SC:L/SI:L/SA:L, assigner: CERT-PL, EPSS: 0.34"
        attribution: "ENISA EUVD (EUVD-2026-30512)"
        source_url: "https://euvd.enisa.europa.eu/enisa/eu_vulnerability_database/EUVD-2026-30512"
    extended_notes: |
      CERT-PL previously disclosed related SzafirHost vulnerabilities in April 2026 (CVE-2026-26927,
      CVE-2026-26928 — DLL/native-library signature verification bypass, fixed in 1.1.0). CVE-2026-44088 is
      a distinct, newly-found variant targeting the JAR-level class loading. Defenders in EU member states
      with cross-border eIDAS workflows should confirm SzafirHost 1.2.1 is deployed; Polish government IT
      administrators should push the update via managed deployment channels.

