    extended_notes: |
      The simultaneous compromise of Microsoft Exchange at the contest level while CVE-2026-42897 is actively exploited in the wild creates a compounding defender burden: IR teams cannot rely on any single mitigation (Exchange EEMS or manual mitigation) being sufficient because the in-competition chain may use a completely different attack surface. Exchange admins should consider disabling OWA for internet-facing deployments until a permanent patch is available.

      For AI-agent platforms: the prevalence of SSRF across LiteLLM, LM Studio, and Cursor suggests the attack pattern is client-side request forgery via agent instruction injection → pivot to internal endpoints. Detection: monitor outbound HTTP/HTTPS from inference containers; alert on requests to RFC-1918 ranges from agent worker processes.

  - title: "FunnelKit Funnel Builder for WooCommerce — unauthenticated checkout-endpoint injection allows Magecart-style skimmer on 40,000+ stores, active exploitation confirmed (no CVE assigned)"
    sources:
      - { url: "https://sansec.io/research/funnelkit-woocommerce-vulnerability-exploited", publisher: "Sansec", date: "2026-05-14", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/funnel-builder-wordpress-plugin-bug-exploited-to-steal-credit-cards/", publisher: "BleepingComputer", date: "2026-05-15", role: "corroborating" }
      - { url: "https://thehackernews.com/2026/05/funnel-builder-flaw-under-active.html", publisher: "The Hacker News", date: "2026-05-16", role: "corroborating" }
    discovery_trace: "first seen at: hackernews feed URL https://feeds.feedburner.com/TheHackersNews, item link https://thehackernews.com/2026/05/funnel-builder-flaw-under-active.html → pivot to primary: Sansec research URL https://sansec.io/research/funnelkit-woocommerce-vulnerability-exploited → corroborated BleepingComputer https://www.bleepingcomputer.com/news/security/funnel-builder-wordpress-plugin-bug-exploited-to-steal-credit-cards/"
    summary: |
      Sansec confirmed active exploitation of an unauthenticated code-injection flaw in FunnelKit — Funnel Builder for WooCommerce Checkout, a WordPress plugin used by 40,000+ online stores. The vulnerability has no assigned CVE identifier.

      **Vulnerable component:** The plugin exposes a publicly-accessible POST endpoint for checkout session management that fails to validate caller permissions. An unauthenticated attacker can reach the internal method responsible for writing the plugin's global settings and inject arbitrary content into the "External Scripts" field (Settings > Checkout > External Scripts). Any JavaScript placed in this field executes on every checkout page site-wide.

      **Attack technique:** T1505.003 (Web Shell / Malicious Plugin) in the Magecart e-skimming class. Attackers disguise the malicious payload as a Google Tag Manager (GTM) initialiser. The fake GTM loads `analytics-reports[.]com/wss/jquery-lib.js`, which establishes a WebSocket connection to `wss://protect-wss[.]com/ws` and retrieves a storefront-specific skimmer that harvests credit card numbers, CVVs, billing addresses and personal information in real time during checkout.

      **Detection:** Review Settings > Checkout > External Scripts for unrecognised entries. Alert on outbound WebSocket connections (`wss://`) from WordPress PHP processes — these are abnormal for standard web-server operation. Also monitor for `analytics-reports[.]com` or `protect-wss[.]com` in DNS queries from web servers (behavioural indicator, not IOC).

      **Affected versions:** All Funnel Builder versions before 3.15.0.3. Patched in 3.15.0.3 (released before Sansec disclosure). **Remediation:** Update to 3.15.0.3+; run a server-side malware scanner (e.g. eComscan) to detect residual injections.

      **Affected scope:** 40,000+ WooCommerce stores per WordPress.org download statistics. Any Swiss or EU public or semi-public online store (municipality shop, university e-commerce) running FunnelKit < 3.15.0.3 is exposed.
    ch_eu_nexus: "Indirect — WooCommerce is dominant for European public-sector and SME online commerce; Swiss cantonal and municipal online shops are in scope"
