  - title: "Kimsuky (Ruby Sleet / APT43) expands PebbleDash toolkit with Rust-based HelloDoor and TryCloudflare C2 — new MemLoad reflective loader, httpTroy backdoor; targets South Korean government/defence with spillover to Germany"
    sources:
      - { url: "https://securelist.com/kimsuky-appleseed-pebbledash-campaigns/119785/", publisher: "Kaspersky Securelist", date: "2026-05-14", role: "primary" }
    discovery_trace: "first seen at: WebSearch ('Kimsuky PebbleDash AppleseedSecurelist Kaspersky research May 2026 publication date') → primary: Kaspersky Securelist URL https://securelist.com/kimsuky-appleseed-pebbledash-campaigns/119785/ (fetched directly via WebFetch)"
    summary: |
      Kaspersky's Global Research and Analysis Team published on 14 May 2026 an in-depth disclosure of Kimsuky's evolved PebbleDash-derived toolkit, documenting six malware families in active campaigns. The article was described as published "2 days ago" by search engines as of May 17, placing it at the edge of the 72h developing window.

      **New malware families documented:**
      - **HelloDoor**: First Rust-based PebbleDash variant. Uses TryCloudflare quick tunnels for C2 resolution, eliminating fixed C2 infrastructure and making network-based blocking impractical. DLL sideloaded via regsvr32 or rundll32 from %temp% or C:\ProgramData.
      - **httpMalice**: Latest PebbleDash backdoor variant with dual communication modes — HTTP HTTPS and Dropbox API. RC4 encryption for orchestrator-tier communications.
      - **MemLoad**: Multi-stage reflective loader that downloads and executes httpTroy entirely in memory without touching disk.
      - **httpTroy**: Primary long-term access backdoor; receives tasks over HTTPS, delivers encrypted plugin payloads.
      - **AppleSeed / HappyDoor**: Information stealers targeting government entities, with HappyDoor adding RSA encryption and evolved evasion.

      **MITRE ATT&CK:** T1566.001 (spear-phishing with malicious attachments — JSE, SCR, PIF droppers with Base64 payload); T1218.010 / T1218.011 (regsvr32 / rundll32 abuse for DLL sideloading); T1053.005 (scheduled tasks named "ChromeCheck" or "EdgeCheck" for persistence); T1071.001 (HTTP/HTTPS C2); T1020 (automated exfiltration via C2 and Dropbox); legitimate tool abuse: VSCode Remote Tunneling (T1572), DWAgent RMM (T1219).

      **Detection opportunities:** Monitor scheduled tasks named "ChromeCheck" or "EdgeCheck" from non-Microsoft sources; alert on regsvr32 / rundll32 loading DLLs from %temp% or C:\ProgramData; detect DWAgent service installation with "CacheDB" service name; flag VSCode tunnel authentication to GitHub with tunnel name "bizeugene"; monitor for RC4 key patterns in network captures from dev workstations.

      **Targets:** South Korea (government, defence, military, medical sectors); expanding to Brazil (defence) and **Germany** (defence contractor). No Swiss targeting reported, but the Germany pivot warrants monitoring for expansion into broader EU government targets.
    ch_eu_nexus: "Developing — active Kimsuky targeting of German defence sector represents the closest geographic proximity to Swiss targets in recent reporting"
    public_sector_nexus: "medium — government and defence sector primary targets; Germany hit"
