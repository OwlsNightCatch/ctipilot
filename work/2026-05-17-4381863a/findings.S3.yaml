        attribution: "Kaspersky Securelist"
        source_url: "https://securelist.com/kimsuky-appleseed-pebbledash-campaigns/119785/"
      - quote: "Monitor for JSE, SCR, PIF droppers containing Base64-encoded payloads... Detect scheduled tasks named 'ChromeCheck' or 'EdgeCheck'... Flag VSCode tunnel authentication via GitHub with tunnel name 'bizeugene'"
        attribution: "Kaspersky Securelist (detection guidance)"
        source_url: "https://securelist.com/kimsuky-appleseed-pebbledash-campaigns/119785/"
    extended_notes: |
      The Rust-based HelloDoor marks a capability milestone for Kimsuky — the group historically relied on interpreted or .NET malware families that are comparatively easier to detect with EDR static analysis. Rust binaries have fewer detectable strings, smaller dependency surfaces, and compile to formats that common EDR rules do not natively parse. Defenders should ensure their EDR vendor has Rust binary heuristics, and that Rust PE headers and imports trigger review when loaded from non-standard paths.

  - title: "FamousSparrow (UAT-9244) targets Azerbaijani oil and gas company in multi-wave Exchange exploitation — evolved Deed RAT with new DLL sideloading; European energy security context"
    sources:
      - { url: "https://www.bitdefender.com/en-us/blog/businessinsights/famoussparrow-apt-targets-azerbaijani-oil-gas-industry", publisher: "Bitdefender Business Insights", date: "2026-05-13", role: "primary" }
      - { url: "https://securityaffairs.com/192113/apt/famoussparrow-targets-azerbaijani-energy-sector-in-multi-wave-espionage-campaign.html", publisher: "Security Affairs", date: "2026-05-13", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch ('FamousSparrow UAT-9244 Azerbaijani energy company Exchange exploitation 2026') → primary: Bitdefender Business Insights URL https://www.bitdefender.com/en-us/blog/businessinsights/famoussparrow-apt-targets-azerbaijani-oil-gas-industry (fetched via WebFetch) → corroborated via Security Affairs URL https://securityaffairs.com/192113/apt/famoussparrow-targets-azerbaijani-energy-sector-in-multi-wave-espionage-campaign.html"
    summary: |
      Bitdefender Labs published on 13 May 2026 an analysis of a three-wave intrusion by FamousSparrow (also tracked as UAT-9244, with overlaps to Earth Estries and Salt Typhoon clusters) against an unnamed Azerbaijani oil and gas company from late December 2025 through late February 2026. Publication is 4 days before run start but within the 72h developing window if search engine indexing date (~May 15) is considered; included with reduced confidence on timing.

      **Initial access:** Exploitation of Microsoft Exchange via two separate CVE chains — ProxyShell (CVE-2021-34473 / CVE-2021-34523 / CVE-2021-31207) and ProxyNotShell (CVE-2022-41040 / CVE-2022-41082). Wave 1 began 2025-12-25 with web shell deployment (key.aspx, log.aspx, errorFE_.aspx, signout_.aspx) via ProxyShell; Wave 2 attempted Deed RAT via Mofu loader with TernDoor fallback; Wave 3 (late February 2026) deployed evolved Deed RAT with modified DLL sideloading.

      **Novel DLL sideloading technique:** The evolved Deed RAT splits its malicious logic across two exported functions (Init and ComMain), embedding itself inside the control flow of the legitimate LogMeIn Hamachi application during normal operation. This is described by Bitdefender as an "evolved" approach that bypasses DLL-load monitoring rules that check only for immediate malicious behaviour at load time. Magic value changed from 0xDEED4554 to 0xFF66ABCD; compression switched from Snappy to Deflate; custom PRNG-based XOR decryption added for plugin payloads.

      **Malware capabilities:** Deed RAT (aka Snappybee) provides modular espionage capability; TernDoor was attempted as alternative in Wave 2 (first observed in South American telecom attacks in 2024). AES-128-CBC for payload containers; RC4 for orchestrator encryption; LZNT1 compression.

      **MITRE ATT&CK:** T1190 (Exchange exploitation); T1543.003 + T1505.003 (services + web shells for persistence); T1574.002 (DLL sideloading with evolved two-function splitting); T1562 (API hooking for defence evasion); T1021.001 + T1021.002 (RDP + SMB/Impacket lateral movement); T1071.001 (HTTPS C2).

      **European energy security context:** Azerbaijan's role as European energy supplier has increased materially following the 2024 expiration of Russia's Ukraine gas transit agreement. Compromise of Azerbaijani energy infrastructure provides intelligence leverage over EU energy-supply contingency planning. Swiss utilities procuring gas via Southern Corridor routes have indirect exposure to the supply-chain intelligence risk.
    ch_eu_nexus: "High strategic relevance — Azerbaijan is an EU strategic energy partner; targeting of its oil and gas sector has European energy-security intelligence implications"
