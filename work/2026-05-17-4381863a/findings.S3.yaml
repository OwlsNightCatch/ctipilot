  - title: "Pwn2Own Berlin 2026 (3 days, May 14–16): 47 unique zero-days, $1.3M+ awarded — DEVCORE chains 3 bugs for Exchange SYSTEM RCE, Compass Security exploits OpenAI Codex, VMware ESXi falls for $200K"
    sources:
      - { url: "https://www.thezdi.com/blog/2026/5/13/pwn2own-berlin-2026-day-one-results", publisher: "Zero Day Initiative (Trend Micro)", date: "2026-05-13", role: "primary" }
      - { url: "https://www.zerodayinitiative.com/blog/2026/5/15/pwn2own-berlin-2026-day-two-results", publisher: "Zero Day Initiative", date: "2026-05-15", role: "primary" }
      - { url: "https://www.thezdi.com/blog/2026/5/16/pwn2own-berlin-2026-day-three-results-and-master-of-pwn", publisher: "Zero Day Initiative", date: "2026-05-16", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/pwn2own-day-two-hackers-demo-microsoft-exchange-windows-11-red-had-enterprise-linux-zero-days/", publisher: "BleepingComputer", date: "2026-05-15", role: "corroborating" }
    discovery_trace: "first seen at: hackernews feed, URL https://thehackernews.com/2026/05/funnel-builder-flaw-under-active.html BleepingComputer sidebar ref → pivot to ZDI Day One blog https://www.thezdi.com/blog/2026/5/13/pwn2own-berlin-2026-day-one-results → ZDI Day Two https://www.zerodayinitiative.com/blog/2026/5/15/pwn2own-berlin-2026-day-two-results → ZDI Day Three https://www.thezdi.com/blog/2026/5/16/pwn2own-berlin-2026-day-three-results-and-master-of-pwn (all primary sources)"
    summary: |
      Pwn2Own Berlin 2026 (OffensiveCon, May 14–16) awarded $1,298,250 for 47 unique zero-day vulnerabilities across enterprise software, AI-agent platforms, hypervisors, and operating systems. Three findings are operationally significant for defenders.

      **Microsoft Exchange three-bug RCE chain (embargoed):** On Day 2, DEVCORE's Orange Tsai chained three undisclosed vulnerabilities to achieve unauthenticated remote code execution at SYSTEM privilege level on Microsoft Exchange, earning $200,000. This attack chain is separate and distinct from the actively-exploited CVE-2026-42897 (stored XSS in OWA). Exchange on-premises defenders must treat DEVCORE's embargoed chain as a credible unpatched threat class until Microsoft's 90-day disclosure window expires. The compound risk — one actively exploited XSS (CVE-2026-42897, no permanent patch) plus a fresh SYSTEM RCE chain not yet assigned CVEs — puts on-premises Exchange at extremely high risk. Technique class: T1190 (Exploit Public-Facing Application) → T1068 (Exploitation for Privilege Escalation).

      **VMware ESXi hypervisor escape for $200K (Day 3):** STARLabs SG's Nguyen Hoang Thach demonstrated a memory corruption vulnerability to achieve full hypervisor escape on VMware ESXi, earning $200,000 and 20 Master of Pwn points. No CVE disclosed; 90-day embargo. Technique class: T1611 (Escape to Host). Defenders running on-premises ESXi clusters should assume hypervisor-level post-compromise until VMware issues a patch advisory.

      **AI-agent platforms all fell:** Day 1 and Day 2 saw successful exploitation of OpenAI Codex (CWE-150 improper neutralisation of special elements — Compass Security, CH; external control abuse — Ikotas Labs), LM Studio (SSRF + code injection chain, STARLabs SG), LiteLLM (SSRF + code injection, k3vg3n), Cursor (code injection, Viettel; separate exploit, Compass Security CH), and NVIDIA Container Toolkit (use-after-free). Technique classes: T1059.006, T1203, T1059.001. The pervasiveness of SSRF and code injection across AI inference stacks suggests these platforms do not yet have mature input-validation practices; SOCs running local inference or coding agents should constrain outbound network from these services (T1071 egress controls).

      **Compass Security (Swiss) participation:** Compass Security's five-member team successfully exploited OpenAI Codex on Day 1 ($40,000, CWE-150 bug) and attempted Claude Code on Day 3 (collision — vulnerability already known). Their Cursor exploit on Day 2 ($15,000) was also successful.

      **Master of Pwn final:** DEVCORE (Taiwan) 50.5 points, $505,000. STARLabs SG (Singapore) 25 points. Pwn2Own rules require vendors to patch within 90 days of competition — ZDI will publish full technical details when embargo expires.
    ch_eu_nexus: "Direct — Compass Security (Swiss firm) participated and won prizes. Exchange and ESXi targets are ubiquitous in European public-sector environments."
