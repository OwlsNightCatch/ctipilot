        attribution: "Bitdefender Business Insights"
        source_url: "https://www.bitdefender.com/en-us/blog/businessinsights/famoussparrow-apt-targets-azerbaijani-oil-gas-industry"
      - quote: "CVE-2021-34473, CVE-2021-34523, CVE-2021-31207 (ProxyShell chain); CVE-2022-41040, CVE-2022-41082 (ProxyNotShell chain)"
        attribution: "Bitdefender Business Insights"
        source_url: "https://www.bitdefender.com/en-us/blog/businessinsights/famoussparrow-apt-targets-azerbaijani-oil-gas-industry"
    extended_notes: |
      Organisations still running on-premises Exchange that have not applied ProxyShell/ProxyNotShell patches (CVE-2021-34473 etc.) remain exposed to the initial access vector. Given the compound Exchange threat (active CVE-2026-42897 XSS + Pwn2Own Day 2 DEVCORE chain + FamousSparrow's ProxyShell/NotShell exploitation), Exchange on-premises defenders should treat the platform as severely threatened and prioritise migration to Exchange Online or enforce layered mitigations (ECP/EWS block at WAF, restrict Exchange management endpoints, enable EEMS).

      FamousSparrow's LogMeIn Hamachi sideloading technique specifically abuses a legitimate enterprise remote-access tool's DLL load order. Defenders should review allowed remote-access software inventory and monitor DLL loads from Hamachi.exe, particularly for exports named Init and ComMain from non-Hamachi-vendor DLLs.

