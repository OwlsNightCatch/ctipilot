    surface: "summary"
    kind: frontmatter
    text: "Cisco disclosed CVE-2026-76461 (CVSS 9.8) on 2026-09-14: an unauthenticated attacker who sends a single crafted email containing SQL statements to a Cisco Secure Email Gateway can execute arbitrary OS commands as root. Cisco confirms active exploitation and says the flaw was found during the resolution of a TAC support case; there is no workaround. CISA added it to its Known Exploited Vulnerabilities catalog the same day. Cisco simultaneously shipped a hardening release fixing five further internally-found vulnerabilities in the same product; Cisco's hardening advisory says two vulnerabilities from its internal review are known to be exploited, this one and the arbitrary file write CVE-2026-76519. On 2026-10-31 Cisco re-released the 15.5.5-014 fix in light of new information related to exploit code available online, so a 15.5 appliance patched earlier needs a check of its Retro Remediation Engine version."
  - claim_id: 14516df9e2
    entry: 2026-09-15/cve-2026-76461-cisco-secure-email-gateway-sqli-root-rce
    surface: "immediate_action"
    kind: frontmatter
    text: "Patch every Cisco Secure Email Gateway now: unauthenticated root RCE via a single email, already exploited: A remote, unauthenticated attacker gains root on the appliance by sending it one crafted email; there is no workaround and no mitigation short of upgrading. Cisco found this in a TAC support case, and CISA lists it as exploited. Upgrade every physical and virtual Secure Email Gateway appliance today and hunt mail_logs for the exploitation pattern before assuming a device is clean."
