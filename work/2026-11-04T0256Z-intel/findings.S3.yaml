    DELTA over the existing DeadTag entry (which already has the Report URI and iVerify version ranges, DeadTag redirects and Lockdown Mode advice): Zimperium's 608-domain and 21-collector footprint, the hidden-iframe and in-app-browser-to-Safari tactics, the compromised-npm-package route (art-template, per SafeDep, May 2026) as an enterprise-relevant vector that bypasses domain reputation, and the native-module capabilities. Its iOS ranges (Coruna chain 15.x to 17.1.x, DarkSword 18.4 to 18.7.2) differ slightly from the entry's (13 to 17.2.1; 18.4 to 18.7); state both with owners rather than merging.
    EXPOSURE: iPhones on the affected builds opening any page that loads the kit, including legitimate sites that load a compromised or expired third-party script; website owners can check their own pages for third-party script dependencies and CSP coverage.
    DETECTION: for site owners, web-server and CSP-report telemetry for unexpected third-party script origins and iframes; for mobile fleets, MDM or MTD inventory of OS builds and web-threat telemetry. A zero-click mercenary-spyware wave (BSI item) is a different mechanism; do not merge.
