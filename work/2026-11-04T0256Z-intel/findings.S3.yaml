  discovery_trace: >-
    first seen at: mandiant-gtig, URL https://feeds.feedburner.com/threatintelligence/pvexyqv7v0v (feed item dated 2026-11-02T14:00Z) -> primary:
    GTIG/Mandiant https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models/ (fetched with extract,
    full body read) -> secondary in window: THN https://thehackernews.com/2026/11/google-warns-llmjacking-attacks-are.html (fetched; rewrite of
    the GTIG post, not independent) -> CVE check: NVD API record for CVE-2026-40217 via https://services.nvd.nist.gov/rest/json/cves/2.0?cveId=CVE-2026-40217
    (fetched, not cited)
  summary: >-
    Mandiant says it responded to multiple 2026 incidents in which actors hijacked enterprise access to LLMs across several clouds and providers,
    affecting financial services, retail, technology and transportation organisations in North America, South America and Asia Pacific, with fraudulent
    consumption above 100,000 USD in a single day and cumulative charges reaching 1 million USD at some victims before access was revoked. GTIG
    says the dominant initial access vector is exposed or stolen cloud identity tokens (IAM credentials, service-account keys, GitHub personal
    access tokens, session tokens), with examples of a session-hijack page that tricks users into pasting a raw JSON token payload, federation
    tokens used to mint fresh access keys around MFA, and LLM API keys harvested from public repositories and validated with single-token requests
    to stay under volume alerts. Actors then escalated by attaching admin policies, creating IAM or service accounts and injecting SSH keys into
    instance metadata, enabled LLM services that were off at the time of compromise, ran a burn-and-rotate service-account pattern against rate
    limits, deployed agent backdoors and LiteLLM gateways, and sold access through relays GTIG calls LLM Mixers. GTIG expects actors to increasingly
    prioritise LLMjacking over cryptojacking. One GTIG statement cannot be reconciled with public records: GTIG ties CVE-2026-40217 to a user-ID
    rebind in LiteLLM's /key/regenerate endpoint that lifts virtual keys to proxy-admin, whereas the NVD description of CVE-2026-40217 is remote
    code execution via bytecode rewriting at /guardrails/test_custom_code in LiteLLM through 2026-04-08 (CVSS 8.8), so the identifier-to-flaw
    mapping is unresolved.
  region_nexus: >-
    victims named only by region (North America, South America, Asia Pacific); no European public-sector victim named
  primary_sector_nexus: >-
    indirect (public-sector cloud and LLM service adoption; the exposed controls are identity tokens and key hygiene that Swiss administrations
    also run)
