    type: tool
    name: CyberStrikeAI
    aliases: []
    summary: >-
      Open-source Go penetration-testing framework combining an LLM orchestrator, MCP tool calls and a built-in C2 server with agents; Kaspersky
      (2026-11-02) documents its use for post-exploitation in education-sector intrusions in Africa and Latin America; JPCERT/CC also lists it
      among AI platforms used in Japan.
  relation_suggestions: []
  verification: SINGLE-SOURCE-OTHER
  confidence: HIGH
  admiralty_suggestion: B2
  novelty: new
  borderline: true
  borderline_reason: >-
    Timing only: Securelist published 2026-11-02T08:00Z, about 19 h outside the 26 h window and inside the 72 h developing window; no earlier
    fire covered it and no in-window secondary was found. Content is strong and directly relevant (education sector, AD and SQL Server estates,
    detection-rich); recommend composing it together with the Bitdefender 3AM item.
  evidence:
  - quote: >-
      Confirmed victims of the campaign included organizations in the education sector in several countries across Africa and Latin America.
    attribution: Kaspersky (Securelist)
    source_url: https://securelist.com/tr/cyberstrikeai-attacks/121715/
  - quote: >-
      The first malicious commands on the victims’ systems in the campaign under investigation originated from the sqlservr.exe process
    attribution: Kaspersky (Securelist)
    source_url: https://securelist.com/tr/cyberstrikeai-attacks/121715/
  - quote: The implant is a classic C2 agent with no AI functionality
    attribution: Kaspersky (Securelist)
    source_url: https://securelist.com/tr/cyberstrikeai-attacks/121715/
  - quote: >-
      According to our data, this is one of the first public descriptions of a compromise involving an LLM in the wild.
    attribution: Kaspersky (Securelist)
    source_url: https://securelist.com/tr/cyberstrikeai-attacks/121715/
  extended_notes: |-
    EXPOSURE: Windows estates where SQL Server (version 16.0.1000 in the example) is reachable by the attacker and runs with rights to execute OS commands, with domain accounts reachable from the database host; Kaspersky does not state how the SQL Server was reached.
    DETECTION (telemetry class first): process-creation lineage with sqlservr.exe as the parent of cmd or PowerShell, certutil decoding of Base64 file fragments and PowerShell reading a reporting-services configuration file for connection strings; SYSTEM scheduled tasks named like system updates and HKCU Run values with the same name; comsvcs.dll MiniDump addressed by PID; WMI and SMB-share script distribution; LDAP queries for service principal names and for accounts without Kerberos pre-authentication; AzCopy-directory and LAPS discovery from servers. Framework artefacts Kaspersky lists for hunting and scanning: a self-signed TLS certificate generated at each start with the framework name in issuer and subject, a fixed implant authentication header per C2 server, and Go build information that embeds a generator temp path and version-control metadata; values are in the report and are not reproduced here.
    KASPERSKY'S DEFENDER READING: the LLM agent sits outside the victim network and leaves no local trace (no calls to AI platforms, no local-LLM API requests, no anomalous resource consumption), the actions on hosts are indistinguishable from a human penetration tester, and 'classic, well-tuned correlation and behavioral analysis rules are sufficient'; the novelty is speed and a lower skill barrier, not new technique. Log sources Kaspersky says the correlation needs: process launches (Windows 4688, auditd execve) and PowerShell script-block events (4104), logons and Kerberos ticket events (4624, 4768, 4769), object access (4662, 4663, 4656) and share access (5145). Rule logic it names: schtasks creation with the remote-host argument, SYSTEM scheduled-task creation, comsvcs.dll process dump, remote execution over WMI or WinRM, many TGS requests (Kerberoasting), DCSync, WMIExec lateral movement, shell started by a web application or the SQL service, and LDAP domain-record scanning on the network side.
    BEHAVIOURAL NOTE: the human phase is slow (a day, then a two-week pause) while the agent phase is fast (persistence in 2 minutes, domain reconnaissance in hours, lateral movement and exfiltration in an hour), so a quiet interval after an SQL Server compromise is not evidence of safety.
    HARDENING: Kaspersky gives product-specific detection rather than a hardening list; the mechanics point to removing the database service's ability to run OS commands, restricting WMI and SMB admin shares to management hosts, and protecting LSASS, but those are not stated by the source.
    TRIAGE: penetration-testing frameworks (this one is open source) are also used by authorised red teams; discriminators are the absence of an engagement, execution from the database service and SYSTEM tasks with system-update names.
- title: >-
