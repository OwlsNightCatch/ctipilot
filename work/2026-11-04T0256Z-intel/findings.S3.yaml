    source_url: https://thehackernews.com/2026/11/cpguard-update-channel-hijacked-to.html
  extended_notes: |-
    EXPOSURE: Linux servers running cPGuard that updated on 2 November. The vendor-documented check is a search of the update log under the product's installation directory for 'Successfully updated' entries and a version between 5.88.12 and 5.88.19 inclusive (the advisory gives the exact command); an entry shows the affected update was installed, not that the script ran or data left. A missing or incomplete log proves nothing.
    POST-PATCH COMPROMISE CHECK (the step that matters): updating to 5.88.25 or later removes the known artefacts but not the copied credentials; treat any server that may have run the script as compromised for credential purposes: reset root and all password-enabled local accounts from a trusted environment, rotate database passwords, object-storage keys and cloud tokens, replace root SSH private keys and remove the old public keys on every system that trusted them, and review authorized_keys for the vendor's support-access key and for unknown keys.
    DETECTION (telemetry class first): the product updater running a downloaded shell script and hidden files or directories appearing under /var/tmp; archive creation containing shadow, MySQL configuration, shell history and SSH files; an upload from the server to the vendor licensing host outside its normal licence-check pattern; authentication logs for root logins or SSH key use from new sources after 2 November. File names of the script and staging paths are in the vendor advisory; they are not reproduced here.
    TRIAGE: cPGuard legitimately updates frequently and talks to its licensing server; the discriminators are the affected version window, a one-off script run during the update and hidden staging under /var/tmp.
    HARDENING: the vendor gives remediation only (update, verify version, rotate credentials and keys, optional support-access-key removal); no further hardening guidance is published. Vendor-side root cause (how the CDN credentials were obtained) is still open and OPSSHIELD says its findings are preliminary.
- title: >-
    CyberStrikeAI: Kaspersky documents education-sector intrusions in Africa and Latin America where an LLM orchestrator on the C2 server drove
    post-exploitation from persistence to domain compromise and database export
  sources:
  - url: https://securelist.com/tr/cyberstrikeai-attacks/121715/
    publisher: Kaspersky GReAT (Securelist)
    date: '2026-11-02'
    role: primary
  discovery_trace: >-
    first seen at: kaspersky-securelist, URL https://securelist.com/feed/ (feed item dated 2026-11-02T08:00Z) -> primary: Securelist https://securelist.com/tr/cyberstrikeai-attacks/121715/
    (fetched with extract, full body read; the feed serves the /tr/ path for the English article)
  summary: >-
    Kaspersky's CTI team reports a campaign against education-sector organisations in several African and Latin American countries in which the
    open-source Go framework CyberStrikeAI, an LLM orchestrator inside the C2 server that plans actions, picks tools through MCP and generates
    commands for a classic implant, took the intrusion from reconnaissance to full domain compromise; Kaspersky calls it one of the first public
    descriptions of an LLM-driven compromise in the wild. In the example incident a human operator gained access through a compromised SQL Server
    (first commands came from the sqlservr.exe process), spent about a day on host information, tooling and network reconnaissance, then paused
    two weeks; the second phase deployed the agent, which established persistence and local reconnaissance within 2 minutes, performed domain
    reconnaissance over about 5 hours, and after a pause of several days ran lateral movement over SMB and WMI, mass credential dumping and database
    export in no more than an hour. Observed behaviour includes Base64-encoded PowerShell, SYSTEM scheduled tasks created with schtasks or the
    Schedule.Service COM object, persistence through a scheduled task or HKCU Run value named SystemUpdate, LSASS dumping with comsvcs.dll MiniDump
    by PID, DCSync and Golden Ticket with a renamed Mimikatz, Impacket WMIExec, Kerberoasting and AS-REP roasting LDAP queries, LAPS and Azure
    checks, and LLM-generated SQL and LDAP queries; the implant itself has no AI logic and a human-in-the-loop approval option exists. Kaspersky
    links the samples only within two separate build-metadata groups and makes no actor attribution; some scripts carry Chinese comments.
  region_nexus: education-sector victims in Africa and Latin America; no European or Swiss victim named
  primary_sector_nexus: >-
    indirect (education sector, SQL Server and Active Directory estates of the kind found in Swiss schools; sibling of the Bitdefender 3AM UK
    school case)
  sector: education
  cves: []
  techniques:
  - T1190
  - T1059.001
  - T1053.005
  - T1547.001
  - T1003.001
  - T1003.006
