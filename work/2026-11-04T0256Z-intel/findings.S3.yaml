    role: lead-only
  discovery_trace: >-
    first seen at: sentinellabs, URL https://www.sentinelone.com/labs/feed/ (feed fetched, item dated 2026-11-03T14:57Z) -> primary: SentinelLABS
    article https://www.sentinelone.com/labs/defrost-and-disrupt-an-assessment-of-europe-s-refrigeration-attacks/ (fetched via extract, jina fallback)
    -> corroboration: The Record https://therecord.media/cyberattack-grocery-freezers-europe and heise https://www.heise.de/news/Cyberangriffe-auf-Kuehlschraenke-Erste-deutsche-Faelle-in-Bayern-und-NRW-11508922.html
    (both fetched); blood-service lead from malware.news feed -> databreaches.net https://databreaches.net/2026/11/03/french-blood-storage-units-targeted-in-cyberattack/
    (fetched)
  summary: >-
    SentinelLABS (assessment, 2026-11-03) builds a chronology that separates incidents from claims and assessments and concludes that responsibility
    for the European refrigeration incidents has not been publicly established and that nothing shows they form a single campaign; Russian-aligned
    disruptive groups (CARR, NoName057(16), Z-Pentest) are called a credible hypothesis from 2024 and 2025 precedent only, and a Z-Pentest repost
    claiming a refrigeration intrusion at a Spanish supermarket survives only in a third-party archive and confirms neither access nor damage.
    It says the Iran-linked suspicion for the US military-commissary freezer failures is provisional and concerns the US cases only, and that
    further incidents are likely wherever the same access conditions persist. On method, SentinelLABS says reporting and official statements suggest
    attackers changed temperature and defrost settings through the systems' own management interfaces, notes ANSSI's director told the French
    Senate on 21 October that exposed administration and weak passwords, not the published Danfoss flaws, were behind the French cases, and says
    it is not known whether the same path applies to 2 to 3 November. New facts on the 2 to 3 November wave: heise confirms an Edeka store in
    Reisbach (Bavaria) had its cooling set to 50 degrees C overnight and that North Rhine-Westphalia cases followed, with BSI having issued a
    warning; SentinelLABS lists further reports from Germany, Italy and Portugal and temperature anomalies at a few smaller Kesko stores in Finland;
    SentinelLABS also relays that Portugal's Mosqueteiros group said seven Intermarché incidents appeared to target an external refrigeration-management
    provider and that a German operator described an attack involving its remote-maintenance company, which it calls an important investigative
    lead that does not establish one compromised provider. The Record adds that Belgian installer Sabcobel says affected units need physical modifications,
    not only a software update, that an Estonian contractor said an older Danfoss system was accessed, and that the Belgian CCB does not know
    whether AI was used.
  region_nexus: >-
    Europe-wide (France, Belgium, Luxembourg, Netherlands, Sweden, Ireland, Estonia, Germany, Finland and, per SentinelLABS, Italy and Portugal);
    NCSC-CH and Coop Switzerland already cited in the existing entry
  primary_sector_nexus: >-
    indirect (retail cold chain, but the same internet-exposed supervisory controllers and maintenance-provider access exist in hospitals, laboratories,
