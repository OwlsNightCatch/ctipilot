      units needed physical modifications and not just a software update to address the vulnerabilities.
    attribution: The Record
    source_url: https://therecord.media/cyberattack-grocery-freezers-europe
  - quote: >-
      In einem Supermarkt im niederbayerischen Reisbach sind die Kühlanlagen in der Nacht zu Montag auf 50 Grad Celsius hochgeheizt worden.
    translation: >-
      In a supermarket in Reisbach, Lower Bavaria, the cooling systems were heated to 50 degrees Celsius overnight into Monday.
    attribution: heise online
    source_url: >-
      https://www.heise.de/news/Cyberangriffe-auf-Kuehlschraenke-Erste-deutsche-Faelle-in-Bayern-und-NRW-11508922.html
  extended_notes: |-
    DELTA FOR THE EXISTING ENTRY (append as an update; the entry already carries the 2 Nov wave, ANSSI's exposure finding and Forescout/Censys context): (a) SentinelLABS' attribution frame (hypothesis only, no group claims the European wave; Z-Pentest claim is about Spain and unverified); (b) German cases and the BSI warning; (c) Italy, Portugal and Finland (Kesko) per SentinelLABS; (d) maintenance-provider access as the investigative lead, from operator and group statements, explicitly not an established common path; (e) Sabcobel: affected units need physical modifications, not only software updates (The Record), which changes the remediation expectation for end-of-life Danfoss/Copeland units; (f) Estonian contractor: older Danfoss system accessed.
    DEFENDER LESSON (SentinelLABS mitigation section, from CERT-FR and the Dec 2025 joint advisory): preserve logs and configuration before restarting or resetting equipment; remove supervisory units and anything on a public IP from internet exposure; reach them only through a VPN or protected network (source-IP filtering of contractors only as a stopgap); review defrost ranges and setpoints; keep controller configuration backups and practise manual operation; assume compromise for exposed units with weak or default credentials.
    UNVERIFIED LEAD (do not carry as fact): Le Canard enchaine reportedly says cold-storage units of the French blood service (EFS), maintained by a contractor called Coolworld, were programmed toward 110 degrees C overnight into 2 November and that an on-duty technician spotted the rise; the chain is Le Canard enchaine -> OMM -> DataBreaches.net, no EFS or authority statement was found, and the paywalled original was not fetched. If confirmed it extends the attack class to blood and health cold storage, which matters for Swiss hospitals and blood services.
    Swiss link: Coop Switzerland said attempts failed (already in the entry); this run found no new Swiss statement.
