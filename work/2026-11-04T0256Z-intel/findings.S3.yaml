  extended_notes: |-
    EXPOSURE: Android-based IoT on organisational networks (set-top boxes, projectors, digital signage, telehealth and karaoke devices) from white-label OEMs; Synthient publishes a model-level device list in its public research repository and GTIG says the preload cannot be removed by the user (it reinstalls from the OEM partition), so cleanup needs vendor action, platform protection or replacement. Check the asset inventory for consumer-grade Android TV boxes and signage players; no firmware-version check is published.
