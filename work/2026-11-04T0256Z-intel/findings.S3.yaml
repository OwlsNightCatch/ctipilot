  discovery_trace: >-
    first seen at: nau-ch, URL https://www.nau.ch/news/digital/apple-warnt-deutsche-politiker-vor-moglicher-spionage-67196745 (fetched via the
    digital-section listing https://www.nau.ch/news/digital) -> pivot: heise security feed item https://www.heise.de/news/Auch-deutsche-Bundespolitik-Apple-bestaetigt-Spyware-Warnung-11508629.html
    (fetched) -> primary: BSI page https://www.bsi.bund.de/DE/Themen/Unternehmen-und-Organisationen/Informationen-und-Empfehlungen/Empfehlungen-nach-Angriffszielen/Buero/Apple_Mercenary-Spyware/apple_mercenary-spyware_node.html
    (fetched); Security Affairs https://securityaffairs.com/202297/... (fetched) as English corroboration
  summary: >-
    BSI states that since 29 October 2026 several members of the German Bundestag and other public figures received Apple's vendor threat notification
    saying Apple detected an attack with so-called mercenary spyware, and that BSI does not know whether the notifications mean actual compromises
    or only attempted attacks; it tells recipients to assume the device may be compromised and wrote to Bundestag members on 30 October. heise
    reports Apple confirmed to Mac & i that the notification wave happened on 29 October and reached users in 99 countries, not only Germany;
    Apple has now sent such notifications in 150 countries, the previous wave was in August, Apple never says which spyware or vector was involved,
    and which iOS versions were attacked remains unclear; the German digital minister Wildberger confirmed on ARD that members of the Bundestag
    and the federal government were among those warned (per nau.ch and Security Affairs). BSI assesses, as a general property of mercenary spyware,
    that infection is likely zero-click, for example through a prepared message that need not be opened, and that a compromised device exposes
    messages including encrypted messengers, calls, contacts, calendar, location, camera and microphone. BSI's procedure: update the operating
    system at once unless forensic analysis is intended, enable Lockdown Mode (which makes new attacks harder but does not remove an existing
    infection), consider replacing the device and changing the phone number if risk is high, set a new passcode, change Apple Account and e-mail
    passwords, check two-factor settings and replace the trusted number, set up authenticator apps afresh rather than transferring them, enable
    the Signal registration lock and WhatsApp two-step verification with new PINs and remove unknown linked devices, and report the notification
    to the BSI service centre. Apple does not name the countries, so whether Swiss recipients are among the 99 cannot be confirmed or excluded
    from public sources; no Swiss authority statement was found in this run.
  region_nexus: >-
    Germany (Bundestag and federal government members, BSI); wave reached 99 unnamed countries; Swiss recipients neither confirmed nor excluded.
    Direct transferability to federal, cantonal and communal officials who use iPhones.
  primary_sector_nexus: direct (government and legislature; senior officials are the typical recipients of Apple threat notifications)
  sector: government
