  verification: SINGLE-SOURCE-OTHER
  confidence: MEDIUM
  admiralty_suggestion: B2
  novelty: new
  evidence:
  - quote: >-
      A 3AM ransomware affiliate breached a school in the UK in what we consider a hybrid operation: some parts show a human operator at the keyboard,
      while others behave like an AI agent working throughout the intrusion.
    attribution: Bitdefender Business Insights
    source_url: https://businessinsights.bitdefender.com/3am-ransomware-hybrid-ai-attack
  - quote: We attribute the intrusion to a 3AM (ThreeAM) ransomware affiliate, and the attribution is confirmed.
    attribution: Bitdefender Business Insights
    source_url: https://businessinsights.bitdefender.com/3am-ransomware-hybrid-ai-attack
  - quote: >-
      Within a roughly three-hour window the attacker joined three separate domains with two-way trusts and pushed the backdoor account’s access
      across the estate.
    attribution: Bitdefender Business Insights
    source_url: https://businessinsights.bitdefender.com/3am-ransomware-hybrid-ai-attack
  - quote: Alert on the creation of any new domain trust and on netdom trust execution.
    attribution: Bitdefender Business Insights
    source_url: https://businessinsights.bitdefender.com/3am-ransomware-hybrid-ai-attack
  - quote: First, initial access is unknown and we do not see how the attacker gained access.
    attribution: Bitdefender Business Insights
    source_url: https://businessinsights.bitdefender.com/3am-ransomware-hybrid-ai-attack
  extended_notes: |-
    EXPOSURE: Windows AD estates with several domains and a shared backup platform (Veeam in this case) where one backup account or backup server holds credentials that reach more than one domain; hosts without an endpoint agent (the attacker's working host here was unmanaged); end-of-support Windows 10 workstations and a 2012 R2 domain controller were present in the victim.
    DETECTION (telemetry class first): (1) directory-service change auditing on domain controllers: any new trust creation (Windows Security trust-creation events, e.g. 4706) and netdom trust execution in process-creation logs; creation of domain-admin accounts outside change control; (2) process-creation and command-line logs: reg save of SECURITY, SYSTEM or SAM hives by anything other than a known backup or admin job; PowerShell reading the Veeam configuration database; scheduled tasks created as SYSTEM on backup servers; a Windows monitoring-tool name attached to a credential-dumping binary; (3) registry telemetry: registry values used as a staging area and as a transport for remote command output (Bitdefender calls the registry-as-transport channel 'a strong indicator to hunt for'); (4) sequence analytics: the same command re-run unchanged within about a minute, then a one-call tweak, then a switch of tool (PowerShell to wmic), numbered script revisions and literal probe or confirmation markers on hosts that should never see them (the report names strings such as psexec-ok and da_proof); (5) EDR tamper events for removal scripts aimed at the endpoint agent.
    TRIAGE: new domain trusts and reg save of hives also occur in planned domain migrations and backup or admin jobs; the discriminators Bitdefender gives are rarity on a healthy network, execution by an account or parent process that is not the known backup or admin tooling, absence of a change record, and administrative accounts that exist in several domains at once.
    HARDENING: keep domain-admin accounts of separate domains separate and never hold privileged credentials for several domains in one place; put trusts and domain-admin creation behind change control with alerting; scope backup accounts per domain, isolate backup servers and keep immutable copies no domain account can delete; limit WMI, remote registry, scheduled-task creation and ADMIN$ to known management hosts; block interpreters (portable Python, PowerShell) on machines that never use them; put an agent on every host.
    POST-INCIDENT CHECK: look for second and third backdoor admin accounts created by different routes and for trusts created in domains other than the one first reached.
    ANALYTIC NOTE: the AI-agent reading is Bitdefender's interpretation of cadence and command quality, not an observation of a model; Bitdefender's own table rates 'a language model generated the commands' as strongly supported, 'an agentic loop chose each next action' as 'behaves like one' and 'no human involved' as unsupported. Compose it as an assessment with an owner. Pair with the Kaspersky CyberStrikeAI item (same week, education sector, server-side LLM orchestrator) if both are composed.
- title: >-
    Apple threat notifications of 29 October reach Bundestag and German government members and users in 99 countries: BSI tells recipients to
    assume compromise and publishes a hardening and reporting procedure
  sources:
  - url: >-
      https://www.bsi.bund.de/DE/Themen/Unternehmen-und-Organisationen/Informationen-und-Empfehlungen/Empfehlungen-nach-Angriffszielen/Buero/Apple_Mercenary-Spyware/apple_mercenary-spyware_node.html
