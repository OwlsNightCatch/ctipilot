    type: report
    name: 'CERT-EU: Beyond the model, backdoors in AI agent harnesses (2026-10-30)'
    aliases: []
    summary: >-
      CERT-EU lab experiment showing a trigger-gated credential-collection backdoor in legitimate Pi and Claude Code extensions that runs without
      any model tool call and is invisible to agent-level permission controls.
  relation_suggestions: []
  verification: SINGLE-SOURCE-NATIONAL-CERT
  confidence: HIGH
  admiralty_suggestion: A2
  novelty: new
  evidence:
  - quote: >-
      the CERT-EU AI team modified local copies of two legitimate third-party packages used by AI agents in an isolated lab, embedding a trigger-activated
      credential-collection mechanism.
    attribution: CERT-EU
    source_url: https://cert.europa.eu/blog/beyond-the-model-backdoors-in-ai-agent-harnesses
  - quote: >-
      controls that restrict the model’s actions do not necessarily restrict third-party code executing alongside it with the user’s permissions.
    attribution: CERT-EU
    source_url: https://cert.europa.eu/blog/beyond-the-model-backdoors-in-ai-agent-harnesses
  - quote: >-
      The priority should be therefore to limit the privileges and resources available to the entire agent environment, not just to the model
      itself.
    attribution: CERT-EU
    source_url: https://cert.europa.eu/blog/beyond-the-model-backdoors-in-ai-agent-harnesses
  extended_notes: |-
    EXPOSURE: developer and analyst workstations and CI jobs where an AI agent harness loads third-party plugins, extensions, skills or hooks installed from public registries or marketplaces, running with the user's permissions; the inventory question is which extensions load in which harness and who can update them.
    DETECTION (telemetry class first): endpoint file-access and process-ancestry telemetry for the agent's process tree reading credential stores, environment dumps and SSH or cloud configuration outside what the task needs; outbound connections from the agent or extension process to hosts outside an allow-list; extension install and update events and package-hash drift against a pinned inventory; unexpected source-code changes by the agent process. CERT-EU's point is that model tool-call logs do not show this: monitor execution beyond tool calls.
    TRIAGE: legitimate extensions do read files and call the network; the discriminator is activation on a content trigger with no corresponding tool call and no user-visible action.
    HARDENING: dedicated VM, container or restricted account for agents; short-lived narrowly scoped credentials supplied only when needed; egress allow-list; pin versions and review diffs before updating extensions.
    Relates to existing store coverage of the malicious Claude Code extension in the Cursor marketplace (2026-10-31) and LiteLLM 1.107.0 (2026-10-22); this is a controlled lab demonstration, not an incident, so do not frame it as observed exploitation. Provenance: CERT-EU is on the single-source carve-out list for its own publication.
