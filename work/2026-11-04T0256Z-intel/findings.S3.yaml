- title: >-
    3AM ransomware affiliate in a UK school estate: Bitdefender documents backup-credential theft, rogue domain admins and new inter-domain trusts,
    and reads the retry behaviour as a hybrid human and AI-agent operation
  sources:
  - url: https://businessinsights.bitdefender.com/3am-ransomware-hybrid-ai-attack
    publisher: Bitdefender Business Insights (Marius Baciu)
    date: '2026-11-03'
    role: primary
  discovery_trace: >-
    first seen at: malware.news feed (https://malware.news/latest.rss), item https://malware.news/t/3am-hits-european-schools-a-hybrid-ai-ransomware-attack-part-human-part-agentic-loop/126974
    (fetched) -> primary: Bitdefender Business Insights, URL https://businessinsights.bitdefender.com/3am-ransomware-hybrid-ai-attack (fetched
    with extract, full body read)
  summary: >-
    Bitdefender MDR reports an intrusion by a 3AM (ThreeAM) ransomware affiliate against a UK school estate of 47 systems (about 21 servers, 8
    domain controllers, 10 Windows 10 workstations, one Windows Server 2012 R2 domain controller) that began as several unconnected Active Directory
    domains; Bitdefender states initial access is unknown and its attribution to 3AM rests on the encryptor build and command-line pattern. The
    recorded intrusion runs 10 to 19 September 2026: a modified public Veeam credential script reads and DPAPI-decrypts backup-software credentials
    on three backup servers via Impacket-style remote execution; a browser Login Data file is copied from a terminal server; SECURITY and SYSTEM
    hives are saved on the 2012 R2 domain controller and Mimikatz renamed to a monitoring-tool name is run; two backdoor domain-admin accounts
    are created by separate routes (one from the school-management system's backup job, one over WinRM). On 18 September the attacker joins three
    separate domains with two-way trusts within about three hours and pushes the backdoor account's access across the estate; finance-share files
    are staged into registry values and POSTed to an HTTP endpoint on an unmanaged internal host; EDR-removal scripts aimed at Sophos and Bitdefender
    are blocked by anti-tampering; a script loader fans out to about 40 machines before the Rust ThreeAM encryptor runs for 26 minutes on 19 September
    and deletes system-state backups with wbadmin. Bitdefender calls it the first case of this kind it has investigated and assesses, explicitly
    as interpretation rather than finding, that the commands behave like a language-model agent loop with a human choosing tasks: retries arrive
    every 40 to 101 seconds whatever the size of the change, a Veeam REST call uses a port and login method that do not match the vendor documentation,
    and scripts carry numbered revisions, self-labelled output and probe or confirmation files. It states that a person pasting between a shell
    and a chat window cannot be excluded, that the staging host was unmanaged so the model itself could not be examined, that nothing in the toolkit
    is novel, and that this is one case, not a trend.
  region_nexus: >-
    UK school estate (several AD domains reached through trusts); no Swiss victim named. Same architecture as cantonal and communal school IT
    with separate domains and a shared backup platform.
  primary_sector_nexus: >-
    direct (public-sector education IT; a multi-school estate is the closest analogue to Swiss communal and cantonal school networks)
  sector: education
