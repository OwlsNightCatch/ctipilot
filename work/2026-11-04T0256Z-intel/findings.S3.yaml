    first seen at: thn, URL https://feeds.feedburner.com/TheHackersNews (feed item dated 2026-11-03T16:30Z) -> pivot: THN article https://thehackernews.com/2026/11/russia-aligned-gorbag-hackers-exploit.html
    (fetched) -> primary: ESET WeLiveSecurity https://www.welivesecurity.com/en/eset-research/gorbag-orcs-border-harvesting-intelligence-ukraine/
    (fetched with extract; first 30 lines and key points read, plus THN's relay of ESET's statements)
  summary: >-
    ESET Research, presenting at Virus Bulletin on 14 October and publishing on 3 November, names Gorbag, a Russia-aligned cluster active since
    at least February 2025 that has focused exclusively on Ukrainian targets, with a preference for law-enforcement and justice entities, local
    administrations near the front line and the defence sector. ESET says it uses spear-phishing with attachments under official-looking lures
    (administrative fines, taxes), a macro-enabled Excel file that decodes the BeautyStealer data stealer, and earlier a PowerShell reverse shell
    it names Prime ReverseShell; BeautyStealer gathers browser credentials, OpenVPN and other VPN configurations and files such as Office documents,
    archives, e-mail, KeePass databases and RDP configurations in one pass, sends them to a Telegram chat or a FastAPI C2, and then tries to remove
    itself. In early 2026 the chain was updated to abuse WinRAR CVE-2025-8088, and ESET told The Hacker News that Gorbag has used only the BeautyStealer
    variant of GIFTEDCROOK since the end of December 2025. ESET reports tooling overlap with the cluster CERT-UA tracks as UAC-0226 and Trend
    Micro as SHADOW-EARTH-066, assesses that Gorbag may be an initial access broker whose later stages are not observed, and notes a Prime ReverseShell
    variant with a comment addressed to LLM tools that its own tests found ineffective.
  region_nexus: 'Ukraine only (ESET: all identified targets are in Ukraine); no EU or Swiss target reported'
  primary_sector_nexus: >-
    indirect (law-enforcement, justice and local-administration targets are the same organisation types as Swiss police and communal administrations,
