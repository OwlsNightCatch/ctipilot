      Mandiant responded to multiple incidents in 2026 in which threat actors hijacked enterprise access to Large Language Models (LLMs)
    attribution: Google Threat Intelligence Group and Mandiant
    source_url: https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models/
  - quote: the dominant initial access vector has been exposed or stolen cloud identity tokens
    attribution: Google Threat Intelligence Group and Mandiant
    source_url: https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models/
  - quote: In multiple incidents that Mandiant investigated, LLM services were not enabled at the time of compromise.
    attribution: Google Threat Intelligence Group and Mandiant
    source_url: https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models/
  - quote: with cumulative charges at some organizations reaching $1 million USD before access was revoked
    attribution: Google Threat Intelligence Group and Mandiant
    source_url: https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models/
  extended_notes: |-
    EXPOSURE: any tenant where cloud identities, service-account keys, personal access tokens or LLM API keys can reach a managed LLM service, or where an LLM gateway (LiteLLM and similar) or an Ollama endpoint is internet-reachable; services that are not enabled today can be enabled by an attacker holding the key.
    DETECTION (cloud control-plane audit first): alert on enablement of LLM services in projects or subscriptions that never used them (GCP ServiceUsage EnableService for the agent-platform API, Azure Cognitive Services deployment creation, AWS Bedrock model-access and use-case calls); on edits to model-invocation logging (Bedrock Put or Delete ModelInvocationLoggingConfiguration, Azure diagnosticSettings write or delete) by principals outside infrastructure-as-code; on bursts of throttling or validation errors that indicate key spraying; on low-volume validation pings (max_tokens=1) in gateway and API logs; on new IAM or service accounts, admin-policy attachments and SSH keys added to instance or project metadata; on a service account created and deleted in short cycles. GCP data-access logs for the inference API are off by default and must be enabled to see invocations.
    HARDENING (GTIG list): phishing-resistant MFA on cloud and developer identity providers, short-lived keys from a central secrets platform, secret scanning of repositories, least privilege including an explicit deny of LLM services where not required, per-model and per-environment key scopes, quotas and spending caps with budget alerts, egress allow-lists for cloud workloads, and patching of LLM gateways.
    TRIAGE: legitimate model evaluation also spikes usage; the discriminators are an LLM service enabled for the first time by a non-owner principal, invocation from unfamiliar user agents or SDKs, logging changes, and charges with no corresponding project owner.
    CVE NOTE: do not carry CVE-2026-40217 as the /key/regenerate flaw; state both descriptions and attribute the mapping to GTIG. The LiteLLM 1.107.0 supply-chain compromise (2026-10-22) is a separate, already-covered event.
    TIMING: GTIG published 2026-11-02T14:00Z (about 37 h before the run start); The Hacker News's in-window rewrite is dated 2026-11-03, and no earlier fire covered it.
- title: >-
    cPGuard update channel hijacked on 2 November: a malicious script in versions 5.88.12 to 5.88.19 installed a backdoor and collected /etc/shadow,
    root database configuration, shell history and SSH files from Linux hosting servers
  sources:
  - url: https://opsshield.com/notice/cpguard-update-channel-compromise.html
    publisher: OPSSHIELD (cPGuard vendor advisory)
    date: '2026-11-03'
    role: primary
  - url: https://thehackernews.com/2026/11/cpguard-update-channel-hijacked-to.html
    publisher: The Hacker News
    date: '2026-11-03'
    role: corroborating
  discovery_trace: >-
    first seen at: thn, URL https://feeds.feedburner.com/TheHackersNews (feed item dated 2026-11-03T20:46+05:30, fetched via feed) -> pivot: THN
    article https://thehackernews.com/2026/11/cpguard-update-channel-hijacked-to.html (fetched) -> primary: OPSSHIELD advisory https://opsshield.com/notice/cpguard-update-channel-compromise.html
    (fetched with extract)
  summary: >-
    OPSSHIELD, the vendor of the cPGuard security tool for Linux servers, says an unidentified attacker used compromised credentials to reach
    its update distribution infrastructure on 2 November 2026 (THN: 02:06 UTC) and pushed a malicious script through the update channel in cPGuard
    versions 5.88.12 to 5.88.19; the vendor detected the attack within 12 hours and stopped distribution. The script installed a backdoor shell
    and collected /etc/shadow and /etc/passwd, root's MariaDB or MySQL configuration, root's shell history and root's SSH authorization and known-hosts
    files, uploading them to OPSSHIELD's own licensing server under a compromised account; OPSSHIELD confirms the attacker retrieved data and
    preliminarily estimates 32 server files, a lower bound, and does not know how many servers ran the script because update checks run at intervals.
    Version 5.88.25 or later removes the backdoor and staged files, but credentials copied before cleanup may still work, so OPSSHIELD tells operators
    to reset root and all local passwords from a trusted recovery environment, rotate database passwords, S3 keys, cloud tokens and secrets in
    root's shell history, and replace root SSH keys; it does not routinely recommend a rebuild, calls that provisional, and ships a further update
    removing its support-access keys as a precaution. OPSSHIELD notes that the absence of the script's files after cleanup does not show the script
    never ran, and that logs missing or incomplete do not show a server was unaffected; how the attacker obtained the credentials is under investigation.
  region_nexus: >-
    global; relevant only to Swiss organisations or hosting providers that run cPGuard on Linux servers; no Swiss victim named
