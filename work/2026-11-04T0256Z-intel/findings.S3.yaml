- title: >-
    CERT-EU lab experiment: a trigger-gated backdoor in a legitimate AI-agent plugin collects host data and credentials with no model tool call,
    and agent-level permission controls do not see it
  sources:
  - url: https://cert.europa.eu/blog/beyond-the-model-backdoors-in-ai-agent-harnesses
    publisher: CERT-EU
    date: '2026-10-30'
    role: primary
  - url: https://www.technadu.com/ai-agent-plugin-backdoor-steals-credentials-without-a-model-tool-call/645734/
    publisher: TechNadu
    date: '2026-11-02'
    role: corroborating
  lookback: true
  discovery_trace: >-
    first seen at: technadu, URL https://www.technadu.com/feed/ (feed item dated 2026-11-02T16:07Z, within the record's 168 h lookback) -> pivot:
    TechNadu article https://www.technadu.com/ai-agent-plugin-backdoor-steals-credentials-without-a-model-tool-call/645734/ (fetched via extract,
    reader fallback) -> primary: CERT-EU blog https://cert.europa.eu/blog/beyond-the-model-backdoors-in-ai-agent-harnesses (fetched with extract,
    full body read)
  summary: >-
    CERT-EU's AI team modified local copies of two legitimate third-party extensions for the Pi 1.3.0 and Claude Code 2.1.304 agent harnesses
    (one with about 1.6 million downloads a month) in an isolated lab, adding dormant code to event handlers the harness already runs (a before_agent_start
    handler in Pi, a rule engine invoked by the UserPromptSubmit hook in Claude Code) that fires only when an ordinary phrase, 'lgtm, ship it',
    appears in the input. When triggered, the collector received host and virtual-machine details, user accounts, network configuration, environment
    variables and credential-related files, while the agents carried on their conversation with no visible tool call or warning. CERT-EU reports
    that restrictions on the agent's file-reading tools did not apply to files read directly by the plugin's handler and that controls inspecting
    model-generated tool calls did not intercept the operation because it never came from a tool call; the trigger could equally arrive in a pasted
    log, an e-mail or a file the agent reads. No public package was modified and nothing was observed in the wild in this experiment; CERT-EU
    cites the compromise of the official Claude Code extension on Open VSX as a real-world example of the same extension-as-supply-chain class.
    Recommendations: run agents in dedicated VMs, containers or restricted accounts, keep long-lived keys out of environment variables and readable
    files, allow-list outbound traffic, inventory and pin extensions and review updates, and monitor execution beyond model tool calls.
  region_nexus: >-
    EU institutions' CERT; applies to any government developer or analyst workstation running AI coding agents with third-party extensions
  primary_sector_nexus: >-
    direct (public-sector software teams and security analysts adopting AI coding agents; CERT-EU serves EU institutions)
  sector: public-sector
  cves: []
  techniques:
  - T1195.002
