- title: >-
    Cl0p, second edition (Team Cymru): ten campaigns in six years, eight with zero-days, five started in Q4; recommends WAF default-deny on file-transfer
    platforms, 12 to 24 months of log retention and retro-hunting on every new Cl0p indicator release
  sources:
  - url: https://www.team-cymru.com/post/cl0p-ransomware-mft-attack-pattern-threat-intelligence
    publisher: Team Cymru Threat Research (Eli Woodward)
    date: '2026-11-02'
    role: primary
  lookback: true
  discovery_trace: >-
    first seen at: team-cymru, URL https://www.team-cymru.com/blog (listing fetched with extract; raw HTML cards carry data-bp date 'November
    2, 2026') -> primary: https://www.team-cymru.com/post/cl0p-ransomware-mft-attack-pattern-threat-intelligence (fetched with extract, full body
    read)
  summary: >-
    Team Cymru's threat-research team (netflow and passive-DNS vantage) analyses Cl0p's ten known campaigns over six years (Accellion FTA, Serv-U,
    GoAnywhere, PaperCut, MOVEit, SysAid, Cleo, Oracle E-Business Suite, Gladinet Centrestack, PTC Windchill and FlexPLM) and says the group deployed
    zero-day exploits in eight of the ten, always against internet-facing applications that process or hold valuable files. It reports Q4 clustering
    (five of ten campaigns started October to December, often on holiday weekends), pre-attack scanning of eventual targets that Kroll found extended
    about two years before MOVEit exploitation, infrastructure diversified per campaign but with some addresses reused for over three years, and
    a notification gap of weeks to months because data is stolen without encryption (Windchill patched 17 June 2026, extortion e-mails from July,
    full victim names on the leak site from 12 August). Its defensive claims are the team's own recommendations: a WAF default-deny allow-list
    for the roughly 15 legitimate paths of a file-transfer application, log retention of at least 12 months (24 preferred), purging stale stored
    data, retro-hunting after every file-transfer disclosure and every new Cl0p indicator release, and separating key material and storage from
    the internet-facing web component because encryption at rest does not help once the web application is compromised. The page is dated 2 November
    2026 but says it was first published on the Team Cymru blog on 12 August 2026 and updated in October 2026.
  region_nexus: global; no Swiss victim named; Q4 timing applies to the current period
  primary_sector_nexus: >-
    indirect (public administrations run managed file transfer, ERP and engineering platforms of the targeted class; Q4 and holiday-weekend risk
    window)
  sector: cross-sector
  cves:
  - CVE-2026-12569
  techniques:
  - T1190
  - T1505.003
  - T1005
  - T1041
  - T1657
  affected_products:
  - PTC Windchill PDMLink
  - PTC FlexPLM
  - Managed file transfer platforms (class)
  entity_keys:
  - actor:clop
  - campaign:clop-windchill-flexplm-extortion-2026
  new_entities: []
  relation_suggestions: []
  verification: SINGLE-SOURCE-OTHER
  confidence: MEDIUM
  admiralty_suggestion: B2
  novelty: new
  borderline: true
  borderline_reason: >-
    Planning-grade analysis, not a new finding: second edition of a report first published 2026-08-12 and updated in October, page dated 2026-11-02
    (inside the team-cymru record's 168 h lookback). Actionable for managed-file-transfer operators and timed to the Q4 window it describes, but
    most findings are Team Cymru's own recommendations and infrastructure statistics, with no exploitation delta.
  evidence:
  - quote: deploying zero-day exploits in eight of ten campaigns
    attribution: Team Cymru
    source_url: https://www.team-cymru.com/post/cl0p-ransomware-mft-attack-pattern-threat-intelligence
  - quote: Five of ten confirmed campaigns were initiated during October through December
    attribution: Team Cymru
    source_url: https://www.team-cymru.com/post/cl0p-ransomware-mft-attack-pattern-threat-intelligence
  - quote: An absence of alerts after a critical disclosure is not evidence of safety.
    attribution: Team Cymru
    source_url: https://www.team-cymru.com/post/cl0p-ransomware-mft-attack-pattern-threat-intelligence
  extended_notes: |-
    The page's own sourcing note says it is based on research presented at FIRSTCON Denver 2026 and a Team Cymru webinar, with thanks to Ransom-ISAC, Huntress, Curated Intelligence, Kroll and Mandiant for the underlying published research. Registry already holds actor:clop and the Windchill campaign; CVE-2026-12569 (unauthenticated deserialization in Windchill PDMLink and FlexPLM) exists in the store's CVE index and NVD.
    DETECTION concept the report offers: treat each blocked request to a non-allow-listed path on a file-transfer application as a high-fidelity reconnaissance signal; baseline per-device URI patterns and outbound transfer volume; score scanning by accumulating signals (new URI, source ASN with Cl0p history, repeated source). Triage caveat from the report: allow-listing does not help where the exploited path is itself allowed (the Windchill login servlet), so restrict the pre-auth information-disclosure endpoint to known partners.
    If composed, keep to the two or three actionable levers (WAF default-deny, log retention of 12 to 24 months, retro-hunt on indicator releases) and the Q4 timing; leave infrastructure statistics out.
- title: >-
    Prompt adware: Check Point Research finds a Codex jailbreak bundle that edits the agent's global instruction files to inject advertising for
    a paid LLM gateway, seen alongside Cobalt Strike on an attacker's open web server
  sources:
  - url: >-
      https://research.checkpoint.com/2026/free-the-model-sell-the-gateway-prompt-adware-hidden-in-jailbreak-bundles/
    publisher: Check Point Research
    date: '2026-11-03'
    role: primary
  discovery_trace: >-
    first seen at: checkpoint-research, URL https://research.checkpoint.com/feed/ (feed item dated 2026-11-03T13:57Z) -> primary: https://research.checkpoint.com/2026/free-the-model-sell-the-gateway-prompt-adware-hidden-in-jailbreak-bundles/
    (fetched with extract, full body read)
  summary: >-
    Check Point Research analysed the Haiou jailbreak bundle for OpenAI Codex, found on a misconfigured web server of an actor operating Cobalt
    Strike alongside the Ladon scanner and the VulnClaw penetration-testing agent, and defines 'prompt adware' as a package that persistently
    alters an agent's trusted instructions (global prompts, skills, configuration files) to influence later output for commercial ends. The bundle's
    launchers verify an Ed25519-signed, AES-256-GCM-encrypted payload, install prompt modules and six offensive-security skills, apply refusal-suppression
    and context-reframing jailbreak techniques, and write into the global identity prompt an instruction that replies to greetings and activation
    words with an advertisement for an OpenAI-compatible relay service; an uninstaller reverts the changes. Check Point says there is no evidence
    the advertised gateway is malicious or that the bundle's author is linked to cybercrime, but cites a study that found some LLM gateways snoop
    on data, steal secrets or inject tool calls, and notes the actor's use of the bundle shows jailbreaks entering real cybercrime toolkits; it
    also reports that Claude Code with Sonnet 5 flagged the injected instruction as a prompt-injection attempt in testing.
  region_nexus: Chinese-language ecosystem (GitHub, Bilibili, QQ group); no EU or Swiss link
  primary_sector_nexus: indirect (AI coding-agent configuration as an integrity surface)
  sector: cross-sector
  cves: []
  techniques:
  - T1565.001
  affected_products:
  - OpenAI Codex
  - Claude Code
  entity_keys: []
  new_entities: []
  relation_suggestions: []
  verification: SINGLE-SOURCE-OTHER
  confidence: MEDIUM
  admiralty_suggestion: B2
  novelty: new
  borderline: true
  borderline_reason: >-
    Novel class label (persistent agent-instruction tampering) from a reputable lab, but the sample is a dual-use jailbreak with advertising,
    no malicious payload or exploitation, and no constituency link; the ATT&CK mapping is loose. Suggest dropping unless the main agent wants
    an AI-agent-trust-boundary roll-up with the CERT-EU item.
  evidence:
  - quote: While no evidence exists that links the author to cybercrime, the product can be classified as dual-use.
    attribution: Check Point Research
    source_url: >-
      https://research.checkpoint.com/2026/free-the-model-sell-the-gateway-prompt-adware-hidden-in-jailbreak-bundles/
  extended_notes: >-
    Monitored surface if composed: global agent instruction and configuration files in user home directories (file-integrity monitoring on the
    agent's global prompt, skill and config files), installation of third-party 'enhancement' bundles by one-line launchers, and agent output
    that contains unsolicited URLs. Treat the sample as dual-use adware, not malware.
