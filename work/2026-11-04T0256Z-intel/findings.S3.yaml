- title: >-
    Coruna and DarkSword, update: Zimperium counts 608 delivering domains, shows version-gated chains behind hidden iframes on lure and compromised
    legitimate sites, adds an npm-package delivery route, and details native modules that read kernel memory and change AMFI state
  sources:
  - url: https://zimperium.com/blog/inside-coruna-and-darksword-chains-from-web-lures-to-ios-exploitation
    publisher: Zimperium zLabs (Santiago Rodriguez)
    date: '2026-10-29'
    role: primary
  lookback: true
  discovery_trace: >-
    first seen at: zimperium-zlabs, URL https://zimperium.com/blog (listing fetched; the dated feed https://zimperium.com/blog/rss.xml was found
    in the page and fetched, item dated 2026-10-29T13:00Z, inside the record's 168 h lookback) -> primary: https://zimperium.com/blog/inside-coruna-and-darksword-chains-from-web-lures-to-ios-exploitation
    (fetched with extract, full body read)
  summary: >-
    Zimperium zLabs reports that through October 2026 it identified 608 domains delivering Coruna-family code, with recovered configurations across
    93 of them mapping to 21 tracking collectors, and that the recovered infrastructure deploys two chains selected by the visitor's iOS version:
    the legacy Coruna chain for iOS 15.x, 16.x (excluding 16.7.x) and 17.0 to 17.1.x, and a DarkSword-derived chain for iOS 18.4 to 18.6 and 18.7.0
    to 18.7.2 with version-specific workers. Delivery is through hidden iframes that keep a legitimate-looking page visible while the loader runs,
    through pages that tell TikTok in-app browser users to open the link in Safari, and through compromised legitimate sites; Zimperium cites
    SafeDep's May 2026 report of compromised art-template npm versions whose browser bundle loaded Coruna, and says that a backdoored front-end
    dependency delivers the loader from first-party infrastructure so domain blocklists and URL categorisers do not help. The recovered native
    modules contain kernel memory read and write routines, code that changes Apple Mobile File Integrity state, process-memory reads through task
    ports, application-state monitoring, encrypted C2 with certificate validation disabled, and routines that delete crash logs and Safari website-data
    records. Zimperium recommends Lockdown Mode for high-risk profiles including public-sector personnel, current iOS builds, auditing third-party
    script dependencies and a strict Content Security Policy.
  region_nexus: >-
    global; no Swiss figure; relevant to any administration whose websites load third-party scripts or whose staff use iPhones on affected iOS
    builds
  primary_sector_nexus: >-
    indirect (public-sector websites that load third-party JavaScript are a delivery path; high-risk staff are Lockdown Mode candidates)
