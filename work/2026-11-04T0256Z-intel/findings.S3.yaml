      The BSI does not know whether these notifications mean actual compromises or merely indicate attempted attacks.
    attribution: BSI
    source_url: >-
      https://www.bsi.bund.de/DE/Themen/Unternehmen-und-Organisationen/Informationen-und-Empfehlungen/Empfehlungen-nach-Angriffszielen/Buero/Apple_Mercenary-Spyware/apple_mercenary-spyware_node.html
  - quote: Der Blockierungsmodus erschwert neue Angriffe, eine bestehende Infektion beseitigt er nicht.
    translation: Lockdown Mode makes new attacks harder; it does not remove an existing infection.
    attribution: BSI
    source_url: >-
      https://www.bsi.bund.de/DE/Themen/Unternehmen-und-Organisationen/Informationen-und-Empfehlungen/Empfehlungen-nach-Angriffszielen/Buero/Apple_Mercenary-Spyware/apple_mercenary-spyware_node.html
  - quote: Der Konzern bestätigte gegenüber heise Mac & i, dass es diese am 29. Oktober gegeben hat.
    translation: The company confirmed to heise Mac & i that these took place on 29 October.
    attribution: heise online
    source_url: https://www.heise.de/news/Auch-deutsche-Bundespolitik-Apple-bestaetigt-Spyware-Warnung-11508629.html
  - quote: bekamen Nutzer in 99 Ländern weltweit die Information
    translation: users in 99 countries worldwide received the information
    attribution: heise online
    source_url: https://www.heise.de/news/Auch-deutsche-Bundespolitik-Apple-bestaetigt-Spyware-Warnung-11508629.html
  extended_notes: |-
    EXPOSURE: any organisation whose senior officials, parliamentarians, advisers or press staff use iPhones or iPads; Apple notifications appear on the lock screen and in Settings, arrive by e-mail to the Apple Account address and show at the top of account.apple.com after sign-in, and per BSI a genuine one never asks to click links, open files, install apps or profiles, or give passwords or codes. The recipient, not the organisation, receives the notice, so the organisation only learns of it if staff report it.
    DETECTION / RESPONSE: there is no central telemetry for the notification itself; the control is a reporting path (staff report any Apple threat notification to the security team, which BSI mirrors with its service-centre address), MDM inventory of OS builds and Lockdown Mode state for high-risk users, and a decision before updating: BSI says update at once unless a forensic analysis is intended, so the device should be preserved first if the organisation wants analysis. Apple states no vector, so there is no version-specific patch to chase; keep devices on the current iOS.
    TRIAGE: a phishing message imitating an Apple warning is the benign-lookalike risk; BSI's discriminator is the channel (lock screen, Settings, account.apple.com) and the absence of any request to click or install.
    HARDENING (BSI): Lockdown Mode for people who may be targeted, new passcode, account password rotation, registration lock on Signal and two-step verification on WhatsApp with new PINs, review of linked devices, fresh authenticator setup.
    Cross-domain note: this is S2-shaped (neighbouring authority publication); returned from S3 because it surfaced through the nau.ch and heise sweeps. The Zimperium Coruna/DarkSword update item (iPhone exploit kits, web-delivered) is a separate mechanism from the zero-click mercenary spyware BSI describes; do not merge.
- title: >-
    Refrigeration attacks, update: SentinelLABS separates incidents, claims and assessments (responsibility not established; Russian-aligned groups
    a hypothesis only), German cases confirmed, third-party maintenance access named as the lead, and Belgian installer says affected units need
    physical modification
  sources:
  - url: https://www.sentinelone.com/labs/defrost-and-disrupt-an-assessment-of-europe-s-refrigeration-attacks/
    publisher: SentinelLABS (Tom Hegel)
