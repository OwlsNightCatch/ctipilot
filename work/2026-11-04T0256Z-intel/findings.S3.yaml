    in the eset feed https://www.welivesecurity.com/en/rss/feed/)
  summary: >-
    ESET's periodic APT Activity Report covers April to September 2026 and says China-aligned groups kept collecting intelligence mainly from
    governments (FamousSparrow in South America, a cluster against Taiwan's semiconductor sector, actors in Southeast Asia and Oceania apparently
    supporting Chinese law-enforcement efforts against organised crime), that Iran-aligned MuddyWater and OilRig subgroup FilthyFeline resumed
    activity mostly against Israel, and that North Korea-aligned actors kept to technology, cryptocurrency and developers, with Lazarus returning
    to the drone sector via recruitment lures and DeceptiveDevelopment moving from fake job-interview lures to broader software supply-chain compromises
    that harvest developer credentials and inject code into public and private repositories. On Russia, ESET says Russia-aligned activity kept
    targeting governments, defence and military entities in Europe with far more targets in Ukraine; Gamaredon activity fell but its toolset was
    updated, PhantomCaptcha tried to deploy Android spyware, and an extensive campaign in Ukraine exploited MDaemon mail servers with two backdoor
    families. ESET's headline finding is the first destructive attack by a Belarus-aligned actor that it has documented in the European theatre,
    FrostyNeighbor against a Ukrainian transport-sector manufacturer, and it assesses that Belarus-aligned groups are becoming operationally closer
    to Russia-aligned ones and act as cyber proxies or force multipliers for Russia. On AI, ESET reports APT groups using LLMs to accelerate malware
    development and decoy sites and, in one case, UAC-0099 placing a decoy nuclear-weapon request in a script comment to trigger LLM guardrails
    of analysis tools, but states it has not noticed AI substantially reshaping the APT landscape and still sees hands-on-keyboard operations.
    Every figure and cluster in the report is ESET telemetry; ESET publishes only a subset of what its customers receive.
