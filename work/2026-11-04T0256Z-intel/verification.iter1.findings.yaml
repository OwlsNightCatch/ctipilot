  summary: "Bitdefender describes, and the entry omits: finance-share files staged into registry values under HKLM\\SOFTWARE and sent by HTTP POST to a page on the attacker's unmanaged host ('The registry-as-transport channel is an unusual choice and a strong indicator to hunt for'); a Defender exclusion for the temp directory; credential-dumping prerequisites ('Alert on credential-reading access to backup-software databases and on reg save of the SECURITY, SYSTEM, or SAM hives by any process other than a known backup or administration job ... both sat at the front of this intrusion'); hunt for probe and confirmation artifacts on production hosts. These are the highest-value detections in the source and Detection carries none of them."
