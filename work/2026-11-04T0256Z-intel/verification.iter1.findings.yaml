- code: F8
  category: needs-more-research
  section: cve-2026-116606-barracuda-esg-auth-bypass-root-rce
  item: "per-vulnerability discoverer records not used"
  url_or_quote: "Detection: Barracuda publishes no indicators. The mechanism implies that ... (inference)"
  summary: "Mandiant's per-vulnerability disclosures (https://github.com/mandiant/Vulnerability-Disclosures/blob/master/2026/MNDT-2026-0042.md and MNDT-2026-0041.md; reported by Barracuda 2026-10-22 and 2026-10-15) state the mechanism the entry only infers: CVE-2026-116606 lets an unauthenticated remote attacker invoke the gateway's configuration-import function and restore a crafted backup archive (CVSS 4.0 PR:N), CVE-2026-111560 is shell-metacharacter injection in the timezone configuration field run as root (PR:H), plus affected ranges for the other five products (ESG <= 9.4.0.27, Load Balancer ADC <= 6.4.0, WAF <= 11.0.1, WSG <= 16.1.100.100, BMA <= 5.5.4.0, WCC <= 2.2.1). That resolves the 'pre-authentication vs administrative access' tension NCSC flags, lets Detection name the configuration import/restore request and timezone-field changes instead of 'a root-owned child process', and gives the Exposure line version bounds for the non-ESG products. The run record says the CNA record text was not carried because the EUVD page was unavailable; it reads fine via https://cveawg.mitre.org/api/cve/CVE-2026-111560 and the GitHub raw files."
- code: F8
  category: needs-more-research
  section: cpguard-update-channel-hijacked-backdoor-root-secrets
  item: "newer OPSSHIELD disclosure drops Exposure/Detection depth"
  url_or_quote: "Version 5.88.25 or later removes the known backdoor and the staged files ... (Defender takeaway / actions[0])"
  summary: "https://opsshield.com/notice/security-incident-disclosure-servermanage.html (published 2026-11-03): fake update live for about 70 minutes ('If your server had cPGuard installed and online between 02:08 and 03:20 UTC on 2 November, assume its root-level secrets are known'), a clean update v5.88.26 and a follow-up update that removes a scheduled task the script left (cron persistence), 'confirm ... /etc/cron.d/i93677 ... are gone', cloud keys in root's .s3cfg collected on some servers, a rebuild from a clean backup for servers the attacker logged in to by hand, and about 7,900 billing-portal accounts exposed (reset the portal password). The entry's Exposure (version range only), Detection (no cron/scheduled-task check) and the 5.88.25 target miss these. Keep the no-IOC rule: describe the persistence class, not the paths."
