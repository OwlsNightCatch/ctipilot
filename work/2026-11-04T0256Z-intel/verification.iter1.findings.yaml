- code: F4
  category: hallucinated-fact
  section: cve-2026-76461-cisco-secure-email-gateway-sqli-root-rce
  item: "hardening-release bundle: exploitation status"
  url_or_quote: "Cisco states none of the five is known to be exploited or publicly disclosed elsewhere. / fixing five further internally-found vulnerabilities in the same product, none reported exploited"
  summary: "Cisco hardening advisory (https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-hardening-esa-dfCrfXkm, rev 1.1 of 2026-10-14): 'These vulnerabilities were found during internal testing. Two of them are known to be actively exploited.' and table footnote 1 (CWE-23 class, CVE-2026-76440) 'One vulnerability that belongs to this vulnerability class is known to be actively exploited', footnote 2 (CWE-707 class, CVE-2026-76443) likewise, linking cisco-sa-esa-afw-zqYJkjxp and the SQL-injection advisory. The second exploited flaw is already in the store as entries/2026-10-15/cve-2026-76519-cisco-secure-email-gateway-file-write-root.md but is not in references[] here. Reword the summary and body to Cisco's actual statement, and reference that entry."
- code: F4
  category: hallucinated-fact
  section: cve-2026-76461-cisco-secure-email-gateway-sqli-root-rce
  item: "actions[0] and body: fixed releases identical across both advisories"
  url_or_quote: "to AsyncOS 15.5.5-014 as re-released on 2026-10-31 (...), 16.0.4-302, or 16.5.0-780 ... the same upgrade also closes the five hardening-release CVEs ... / since both advisories share identical fixed releases for Secure Email Gateway"
  summary: "Hardening advisory fixed table (SEG): '15.5 and earlier 15.5.5-014  16.0 Migrate to a fixed release.  16.5 16.5.0-780'. The SQL-injection advisory gives 16.0 -> 16.0.4-302. So upgrading a 16.0 appliance to 16.0.4-302 fixes CVE-2026-76461 but, per Cisco, does not close the hardening CVEs (Cisco says migrate off 16.0). The cves[] 'fixed' fields for the five say 'migrate off 16.0' correctly; the action and the body sentence contradict them."
- code: F5
