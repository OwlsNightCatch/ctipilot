  discovery_trace: 'first seen at: bleepingcomputer, URL https://www.bleepingcomputer.com/feed/ (item https://www.bleepingcomputer.com/news/security/hackers-hijack-cpguard-autoupdate-to-deploy-backdoor-steal-data/,
    extract) -> primary: OpsShield vendor notice, URL http://opsshield.com/notice/cpguard-update-channel-compromise.html
    (WebFetch; extract returned nothing on this host). The vendor notice was read through the WebFetch summariser:
