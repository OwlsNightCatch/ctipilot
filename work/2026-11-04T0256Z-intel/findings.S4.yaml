    extract, which quotes the vendor.'
  summary: 'OpsShield, the developer of the cPGuard web-server security suite (used by hosting providers and server
    administrators alongside cPanel, DirectAdmin and Plesk), says an unidentified attacker used compromised credentials
    on 2026-11-02 at 02:06 UTC to reach its update-distribution CDN and pushed a malicious script through the cPGuard
    update channel; the credentials'' origin is unknown. Affected builds are cPGuard 5.88.12 through 5.88.19; the
    vendor says it detected the compromise and stopped distribution within about 12 hours, and that servers whose
    update check ran on a longer interval may not have received the script. Facts per the vendor (read via summariser):
    the script collected the local account and password-hash files, the root database client configuration, root
    shell history and root SSH authorized-keys and known-hosts files, uploaded them to OpsShield''s own licensing
    server through a compromised account (from which the attacker later retrieved them), staged an archive and installed
    a backdoor shell; updating to 5.88.25 or later removes the backdoor and staged files but not the exposure of
    what was collected. Scope figures differ and should be shown as the vendor''s: the notice gives a preliminary
    32 retrieved files each tied to one customer server and says scope verification continues, while a spokesperson
    told BleepingComputer that 2,946 servers were affected and copied and that the billing-system database was copied
    as well; BleepingComputer''s own reading is ''32 files from each customer''. Remediation stated by the vendor:
    update every cPGuard server to 5.88.25 or later, treat any server whose install history shows a version in the
    affected range as potentially compromised even after upgrading, reset root and local passwords from a trusted
    environment, rotate database passwords, cloud and object-storage keys and secrets found in root shell history,
    replace SSH private keys and remove the old public keys from systems that trust them; a separate 2026-11-03
    release removes OpsShield support-access keys. No actor is named.'
  region_nexus: global; hosting providers and self-managed Linux web servers; no Swiss victim named in the sources
  primary_sector_nexus: 'indirect: communal and cantonal websites and shared PHP hosting often run on cPanel/DirectAdmin/Plesk
