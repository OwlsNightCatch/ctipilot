  summary: 'Binance''s own report of 2026-11-03 describes the 2026-10-29 theft of about USD 6.34 billion as a multi-stage
    campaign, ''not a single isolated breach or a simple phishing incident''. Facts the company states: in September
    2026 a software engineer was approached on a legitimate job platform by someone posing as a project director,
    led through a live-video ''HR'' interview and a second ''CEO'' interview in a chat application, and told to
    download an ''assignment'' repository onto his work computer; the repository''s setup code replaced a legitimate
    development-tool component (the pyenv executable in the macOS Homebrew installation) with a malicious one, repointed
    the symlink and spawned a zsh shell for command-and-control, and the company says the 0-day malware was not
    detected by its endpoint protection and the attacker removed traces. On 2026-10-20 the attacker used that engineer''s
    computer and an internal AI tool to gain control over two further wallet-team engineers and found a container-deployment
    token on one of their computers; on 2026-10-29, between 17:15 and 19:56 (time zone not stated), it logged on
    to the second engineer''s computer with the stolen credentials, deployed a container and triggered a script
    that reached the wallet signing service. From there transfers left Binance hot wallets within minutes, and the
    attacker then used Ethereum''s EIP-7702 delegation mechanism (50 signing transactions that manipulated the account
    nonce) so assets kept moving after withdrawals were suspended; because the hot wallet used multi-party computation
    there was no single key to revoke the delegations, so a specialised procedure was needed. Binance also reports
    an earlier (June 2026) incident in which a wallet DevOps engineer installed a tampered Homebrew install while
    searching for an AI coding tool; the device was replaced and credentials rotated, but the engineer''s team was
    by then exposed to the actor, and the company says it blocked 57 suspected North Korea-linked cases in 2026.
    About USD 2.85 billion has been frozen or intercepted and 98 percent of impacted token assets were replenished
    by 2026-10-31. Attribution: the FBI (2026-10-31) says North Korea was responsible and calls the activity ''TraderTraitor''
    (registered here as Jade Sleet); Binance cites the FBI and itself makes no independent attribution claim. Binance
    says some technical details stay confidential and an independent review is under way, so the report is a first
    account.'
  region_nexus: global; no Swiss nexus (crypto exchange); the lure and tooling target developers anywhere
  primary_sector_nexus: none direct; the intrusion path (fake recruiter, poisoned repository on a corporate laptop,
    internal AI assistant as lateral-movement springboard, container deployment token) transfers to any organisation
