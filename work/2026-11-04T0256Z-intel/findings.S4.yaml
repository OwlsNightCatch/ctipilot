  discovery_trace: 'first seen at: bleepingcomputer, URL https://www.bleepingcomputer.com/feed/ (item https://www.bleepingcomputer.com/news/security/uk-school-estate-hit-by-3am-ransomware-in-suspected-ai-assisted-attack/,
