    The PKZH notice itself (pkzh.ch news page) did not expose a fetchable item.'
  summary: 'On 2026-11-03 the Pensionskasse Stadt Zürich (PKZH, over 42,000 insured) said its foundation board suspended
    the introduction of PK Softech''s administration system planned for early 2027 and will keep its existing system
    in 2027; the board will decide whether, when and under what conditions to introduce a new system only after
    the attack has been fully worked through (finews, Inside IT, Moneycab). watson''s analysis of the same day adds,
    from named statements: PK Softech told watson it cannot exclude that non-pseudonymised data was temporarily
    present in project work and does not know whether such data left; Publica says the Confederation ran no IT-security
    review after the 2017 award (''the responsibility lies with Publica'') and that neither the Federal Council
    nor the Finance Department supervises it; Publica asked PK Softech in September 2025, more than two years after
    the Xplain leak, to delete its 2019 migration data, and PK Softech confirmed deletion in January 2026; the Federal
    Prosecutor''s Office confirms a ''notorious extortion gang'' is behind the attack and has added the case to
    its criminal proceeding against the Akira group open since April 2024. watson''s own reading, not a finding:
    a month after the attack Akira''s leak site does not list PK Softech, which watson says usually means negotiation
    or payment or that the haul is largely unusable; neither is confirmed, and the supplier and authorities speak
    only of a ''partial'' outflow. Lesson for public bodies: test or migration data handed to an implementation
    supplier outlives the project unless deletion is verified, and supplier contracts need an audit and deletion
    check.'
