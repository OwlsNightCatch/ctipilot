    (extract, full body). S3 may also return the Bitdefender post as research; this is the incident read of the
    same document.'
  summary: 'Bitdefender MDR investigated a 3AM (ThreeAM) ransomware affiliate''s intrusion into a mid-sized public-sector
    target, a school estate in the UK, between 2026-09-10 and 2026-09-19 and calls it the first case of this kind
    it has documented in Europe; it presents the hybrid reading as a working model, not an established fact. Observed
    behaviour: living-off-the-land work through PowerShell, WMI, reg, netsh and rundll32 plus a handful of public
    tools (an Impacket-style remote-execution tool, Mimikatz, a published Veeam script) and a Rust-based commodity
    encryptor; extraction and decryption of credentials stored on three Veeam backup servers, a copy of a browser
    credential database, LSASS dumping, enumeration of domain trusts and SYSVOL logon scripts for the names and
    subnets of other schools, two backdoor domain-administrator accounts, new two-way trusts joining three previously
    separate Active Directory domains, an attempt to remove EDR agents, deletion of system-state backups and encryption
    of about 37 machines. Why Bitdefender thinks a model was in the loop: commands that call the Veeam web interface
    on a port and with a login method that do not match the vendor documentation, self-labelled output, numbered
    script revisions, and retries arriving every 40 to 101 seconds regardless of how large the change was (a full
    rewrite as fast as a one-call change), against several minutes between task changes; every attacker action originated
    from an unmanaged internal host with no Bitdefender agent, so the automation itself was never seen and ''a person
    pasting between a shell and a chat window cannot be excluded''. Initial access could not be established. Bitdefender''s
    own framing: nothing in the toolkit is novel, this is one case and not a trend, and it expects such hybrids
    to become more common in 2027; Bitdefender notes that creating a domain trust is a rare change that is cheap
    to alert on.'
  region_nexus: UK (neighbouring Europe); no Swiss victim; school estates run by public bodies share the multi-domain
    AD, shared backup server and unmanaged-host pattern with cantonal and communal school IT
  primary_sector_nexus: 'direct sector analogue: public-sector education estate'
  sector: public-sector (education)
  pd11_limb: '(b) materially evolved TTP (first documented European ransomware intrusion with a model-like command
    loop; the defender-visible artefacts are ordinary: new domain trust, new domain admins, Veeam credential access)'
