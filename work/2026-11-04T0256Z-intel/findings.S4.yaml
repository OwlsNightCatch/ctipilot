    has been active only since August and claims about 80 attacks; Ransomware.live's profile (a tracker, Admiralty
    C) lists 60 victims in 22 countries since 2026-08-10, with Government and Defense among the top sectors and
    Italy and Germany among the countries, and DeXpose (a tracker blog) reports an August claim against Vietnam's
