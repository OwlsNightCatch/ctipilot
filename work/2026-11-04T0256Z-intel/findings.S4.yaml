  extended_notes: 'Exposure/Detection/Defender angle for the composer. Exposure: any organisation whose developers,
    DevOps or admins can be approached through job platforms and who run third-party ''assignment'' code on managed
    laptops; any internal AI assistant or agent that can act with one employee''s access on behalf of another. Detection
    (telemetry classes): endpoint file-event telemetry for an interpreter or version-manager binary being deleted,
    renamed and re-linked inside a package-manager directory followed by a shell spawned from it (Binance''s own
    sequence: create, modify, delete the legitimate binary, rename, delete the old symlink, new symlink, spawn zsh);
    process lineage from repository setup scripts to shells; token-use logs for a container-deployment token used
    from a host that is not its owner''s; access logs of internal AI tools for one user''s session acting on other
    users'' endpoints. Binance''s stated hardening: tighter device controls, wallet-service risk controls, rebuilt
    systems, rotated credentials and tokens, AI-based behavioural anomaly detection. Public-sector transfer: the
    same lure (''Contagious Interview'' / ''Operation Dream Job'' family, registered as campaign:operation-dream-job;
    the BleepingComputer article draws that comparison, Binance does not name the campaign) targets staff with developer
    or DevOps access. The FBI alert lists laundering addresses; they are deliberately not carried. Not an IOC item.'
