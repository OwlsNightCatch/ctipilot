  item: "cve-2026-116606-barracuda-esg-auth-bypass-root-rce, sourcing_note"
  url_or_quote: "Mandiant's per-vulnerability disclosure pages, which carry no publication date in the text read and are dated here with the advisory"
  summary: "The pages do carry a date: https://github.com/mandiant/Vulnerability-Disclosures/blob/master/2026/MNDT-2026-0042.md has '## Disclosure Timeline * 2026-10-22: Reported by Barracuda * 2026-11-02: CVE published and Mandiant advisory released' (MNDT-2026-0041: reported 2026-10-15, published 2026-11-02). The trafilatura extract drops the list, the rendered blob and raw .md keep it. Say the 2026-11-02 date comes from the disclosure timeline."
- code: F4
  category: hallucinated-fact
  section: updated-entry
  item: "cve-2026-76461-cisco-secure-email-gateway-sqli-root-rce, cves[CVE-2026-76443].affected (new this run) and body paragraph 4"
  url_or_quote: "(Cisco says one vulnerability in this injection class, the SQL injection CVE-2026-76461, is known to be actively exploited, and states that this grouped CVE is a separate finding) / explicitly distinct from the exploited CVE-2026-76461 despite sharing the same top-level weakness class"
  summary: "Hardening advisory (https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-hardening-esa-dfCrfXkm, rev 1.1) says only 'Two of them are known to be actively exploited. For more information, see [SQL Injection] and [Arbitrary File Write]' and footnote 2 (on the CWE-707 row) 'One vulnerability that belongs to this vulnerability class is known to be actively exploited. For more information, see [SQL Injection]'. It never says CVE-2026-76443 is a separate finding from CVE-2026-76461; 'states' and 'explicitly distinct' are the entry's inference (the body clause is older text, low confidence on that half). Reword as the entry's reading or drop."
- code: F3
  category: claim-not-supported
  section: updated-entry
  item: "cve-2026-76461-cisco-secure-email-gateway-sqli-root-rce, section 2026-11-04T03:26:59Z"
  url_or_quote: "(low confidence) Cisco's advisory of 2026-09-14 had said none of the hardening vulnerabilities was known to be exploited; its revision of 2026-10-14 says two are"
  summary: "The cited page (cisco-sa-hardening-esa-dfCrfXkm) carries only the revision table ('1.1 Added link to a related advisory. Summary and Details Final 2026-OCT-14; 1.0 Initial public release. - Final 2026-SEP-14') and no text of revision 1.0, so 'had said none' is not on the page it terminates with. Keep what the page shows (rev 1.1 says two are known to be exploited) or drop the earlier-state clause."
- code: F4
  category: hallucinated-fact
  section: updated-entry
  item: "cve-2026-104935-ivanti-connect-secure-zero-day-chain-kev, cves[CVE-2026-104935].fixed and sourcing_note (the record names sourcing_note)"
  url_or_quote: "while CERT-FR lists 25.1.3.x before 25.1.3.1 as affected / CERT-FR lists only the 25.1.1.x and 25.1.3.x lines below their fixed builds, counting 25.1.3.0 as affected where Ivanti's description and Rapid7 place it outside the affected range"
  summary: "Both cited CERT-FR pages now read 'Connect Secure (ICS) version 25.1.2.x antérieures à 25.1.3.1' (https://www.cert.cyber.gouv.fr/avis/CERTFR-2026-AVI-1442/ and https://www.cert.ssi.gouv.fr/alerte/CERTFR-2026-ALE-013/, updated 2 Nov) plus 'Ivanti précise que les versions 25.1.3.x ne sont pas affectées par ... CVE-2026-111357 et CVE-2026-118527'. The entry's own new section and cves[CVE-2026-118527].affected already say '25.1.2.x before 25.1.3.1', so the entry contradicts itself and the CERT-FR/Rapid7 discrepancy it describes no longer exists. Rewrite both statements to the current CERT-FR text."
- code: F4
  category: hallucinated-fact
  section: registry
  item: "entities/registry.yaml: incident:opsshield-cpguard-update-channel-compromise-2026-11 and incident:uk-school-estate-3am-hybrid-ai-intrusion-2026-09 summaries (reader-facing on entity pages)"
  url_or_quote: "an attacker with compromised credentials pushed a malicious script through OPSSHIELD's update distribution infrastructure to cPGuard 5.88.12 to 5.88.19 ... fixed in 5.88.25 / ... new two-way trusts joining three domains, EDR removal and encryption"
  summary: "The cPGuard summary still carries the superseded advisory account; the vendor's disclosure (https://opsshield.com/notice/security-incident-disclosure-servermanage.html) says the attacker 'signed up as a customer, used that account to break into our billing and licensing server, took the keys we use to publish updates', about 2,950 servers, 02:08 to 03:20 UTC, clean update 5.88.26, and the entry was rewritten accordingly. The 3AM summary says 'EDR removal' where Bitdefender says 'anti-tampering controls blocked the removal' (the entry was corrected, the registry was not). Update both records."
- code: F4
  category: hallucinated-fact
  section: run-record
  item: "runs/2026-11-04/2026-11-04T0256Z-intel.md, verification and coverage notes"
  url_or_quote: "the CVE-record mechanism text (EUVD-2026-115149 returned an application-unavailable page) is deliberately not carried / cPGuard's vendor estimate (32 retrieved files) and the spokesperson's 2,946 servers are both shown as the vendor's / the analysis is 1,158 words and was not grown"
  summary: "Stale after remediation. The rewritten Barracuda entry does carry the CVE-record mechanism (Mandiant MNDT-2026-0042 and -0041 as sources, and 'invoke a configuration-import function and restore a crafted, compatible backup archive' in the body). The rewritten cPGuard entry shows the disclosure's ~2,950 servers and ~7,900 accounts; 32 files and 2,946 appear only in the sourcing note as superseded. The Publica analysis is now 1,148 words by check_run._main_words (1,158 at git HEAD); the record's 1,158 is the pre-edit count. Update the notes to the shipped state."
- code: F3
  category: claim-not-supported
  section: new-entry
  item: "cpguard-update-channel-hijacked-backdoor-root-secrets, Defender takeaway"
  url_or_quote: "(low confidence) reset root and all local passwords from a trusted environment ... ([OPSSHIELD, 2026-11-03](https://opsshield.com/notice/security-incident-disclosure-servermanage.html))"
  summary: "The disclosure says 'Change the root password and every local user password on the server.' The qualifier 'from a trusted recovery environment' is in the earlier advisory (https://opsshield.com/notice/cpguard-update-channel-compromise.html: 'Reset passwords for root and all other password-enabled local Linux accounts from a trusted recovery environment'), not in the page the clause is cited to. Add the advisory as a co-citation."
- code: F3
  category: claim-not-supported
  section: new-entry
  item: "threeam-uk-school-veeam-rogue-domain-admins-new-ad-trusts, Defender takeaway"
  url_or_quote: "(low confidence) bring unmanaged internal hosts under an endpoint agent or cut their access to domain controllers and backup servers ([Bitdefender, 2026-11-03](https://businessinsights.bitdefender.com/3am-ransomware-hybrid-ai-attack))"
  summary: "Bitdefender recommends 'Put an endpoint agent on every machine. The staging host here was unmanaged' and 'Restrict remote execution and administrative shares ... Limit them to known management hosts.' It does not recommend cutting unmanaged hosts' access to domain controllers or backup servers; that half is the entry's own advice under Bitdefender's citation. Attribute it as the entry's reading or limit the clause to what Bitdefender says."
- code: F8
  category: needs-more-research
  section: new-entry
  item: "cve-2026-116606-barracuda-esg-auth-bypass-root-rce, cves[CVE-2026-111560].affected/fixed, Exposure, actions[0], Defender takeaway"
  url_or_quote: "the other products' patches are listed in Barracuda's advisory / update every Email Security Gateway to firmware 9.4.0.030 or later"
  summary: "Iteration 1 asked for the version bounds; the run record says the page text read did not carry them, but the cited Mandiant record does (raw https://raw.githubusercontent.com/mandiant/Vulnerability-Disclosures/master/2026/MNDT-2026-0041.md: 'The affected products and versions are: ESG <= 9.4.0.27, Load Balancer ADC <= 6.4.0, WAF <= 11.0.1, WSG <= 16.1.100.100, BMA <= 5.5.4.0, WCC <= 2.2.1'; the trafilatura extract drops that list). The Trust Center table also gives the patch ids for the five non-ESG products (BNADC-16586 for ADC and WAF, BNMA-32468, BNWF-60060, BNYF-24789) which the entry defers to 'Barracuda's advisory', and the action and takeaway tell the reader to update only the Email Security Gateways, so an owner of a WAF, ADC, Message Archiver, WAF Control Center or Web Security Gateway gets a restriction but no patch instruction. Carry the ranges and patch ids and extend the action. (9.4.0.030 exists: the Campus ESG release notes list Version 9.4.0.030.)"
- code: F9
  category: surface-contradiction
  section: new-entry
  item: "cpguard-update-channel-hijacked-backdoor-root-secrets, Exposure"
  url_or_quote: "(low confidence) any Linux server on which cPGuard was installed and online between 02:08 and 03:20 UTC on 2026-11-02; the vendor's earlier advisory gives the update history ... versions 5.88.12 through 5.88.19"
  summary: "The earlier advisory frames the exposure as versions 5.88.12 to 5.88.19 with example install_log lines running from 02:46 to 12:46 on 02-11-2026 ('detected the attack within 12 hours'), while the disclosure, which says the advisory 'records our earlier findings', limits the fake update to about 70 minutes (02:08 to 03:20 UTC) and does not repeat a version range. The entry pairs both without saying whether the version-based install-log check is still the right test or only a conservative superset."
- code: F11
  category: editorial-advisory
  section: new-entry
  item: "cpguard-update-channel-hijacked-backdoor-root-secrets, summary"
  url_or_quote: "(low confidence) used crafted requests to the portal's callback pages to run commands on the billing and licensing server"
  summary: "States the access step as established; the vendor's own text says 'Our logs do not record the exact request that gave them access' (its timeline lists the crafted requests at 22:50 and command execution at 22:58). The body carries the caveat, the summary drops it."
