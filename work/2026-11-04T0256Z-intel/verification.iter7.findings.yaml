  item: "2026-09-15/cve-2026-76461-cisco-secure-email-gateway-sqli-root-rce"
  url_or_quote: "Cisco simultaneously shipped a hardening release fixing five further internally-found vulnerabilities in the same product"
  summary: "(low confidence) Cisco's hardening advisory (https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-hardening-esa-dfCrfXkm) says 'multiple internally discovered vulnerabilities' and 'assigned a single Common Vulnerabilities and Exposures identifier (CVE ID) to each CWE grouping'; five CVE IDs are listed, each grouping an unstated number of flaws. The summary and the third body paragraph count the five IDs as 'five further ... vulnerabilities' although the body itself says the IDs group by CWE class rather than by flaw. Say 'five further CVE IDs' or 'fixes grouped under five CVE IDs'. Pre-existing wording, not touched by this run's record."
