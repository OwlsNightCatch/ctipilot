  item: "2026-09-15/cve-2026-76461-cisco-secure-email-gateway-sqli-root-rce"
  url_or_quote: "id: CVE-2026-20353 ... type: dos (cvss 9.8)"
  summary: "(low confidence) cves[CVE-2026-20353].type is 'dos', but Cisco's table describes CWE-664 as 'covers uncontrolled resource consumption, algorithmic complexity, recursion/iteration, deserialization, and improper resource initialization' at a 9.8 ceiling; the entry's own affected text says the grouping is not resolved to one member. A single 'dos' type picks one member the page does not single out. Leave the type unset or word it as the grouping."
