  item: "threeam-uk-school-veeam-rogue-domain-admins-new-ad-trusts"
  url_or_quote: "affected_products: [\"Veeam Backup & Replication\"]; Exposure: 'a Windows estate that runs Veeam Backup & Replication'"
  summary: "(low confidence) Bitdefender (https://businessinsights.bitdefender.com/3am-ransomware-hybrid-ai-attack) writes 'Veeam', 'the backup software's databases' and links the vendor's 'vbr_rest' REST documentation; the page never writes 'Backup & Replication'. The product edition is the entry's inference from the VeeamBackup database and REST API. Name it as 'Veeam' with the VBR REST reading attributed, or keep and accept."
