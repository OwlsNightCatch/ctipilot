  item: "2026-09-15/cve-2026-76461-cisco-secure-email-gateway-sqli-root-rce"
  url_or_quote: "Cisco states it has already proactively contacted affected Cloud customers and upgraded all Cloud instances."
  summary: "(low confidence) actions[2]: the advisory (cisco-sa-esa-inj-2bLVGmhX) says 'Cisco has directly contacted customers who own Cisco Secure Email Cloud devices where indicators of possible compromise were identified' and 'Cisco has already upgraded all Cisco Secure Email Cloud devices to Release 16.5.0-780'; 'proactively' is the entry's word. Drop the adverb."
