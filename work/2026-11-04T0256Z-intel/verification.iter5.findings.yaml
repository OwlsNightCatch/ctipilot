- code: F3
  category: claim-not-supported
  section: updated-entry
  item: "danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack: main analysis ('The first German cases followed: heise reports cold rooms of an Edeka market in Reisbach heated to 50 degrees'), Update 2026-11-04T03:30:36Z section and the record summary"
  url_or_quote: "heise reports that the cold rooms of an Edeka market in Reisbach, Lower Bavaria, were heated to 50 degrees overnight into Monday"
  summary: "(low confidence) heise (https://www.heise.de/news/Cyberangriffe-auf-Kuehlschraenke-Erste-deutsche-Faelle-in-Bayern-und-NRW-11508922.html) says 'In einem Supermarkt im niederbayerischen Reisbach sind die Kühlanlagen in der Nacht zu Montag auf 50 Grad Celsius hochgeheizt worden', i.e. refrigeration or cooling systems, not cold rooms (Kühlräume); the entry's own heise evidence quote renders it 'the cooling systems were heated to 50 degrees Celsius'. Use 'cooling systems' (or 'refrigeration systems') in the body, the section and the record summary; 'cold rooms' is right only for Le Canard enchaîné's 'chambres froides'."
- code: F4
  category: hallucinated-fact
  section: new-entry
  item: "cpguard-update-channel-hijacked-backdoor-root-secrets: sourcing_note"
  url_or_quote: "The later disclosure supersedes the earlier advisory's preliminary scope (32 retrieved files, a figure a spokesperson contradicted with 2,946 servers)"
  summary: "(low confidence) The advisory (https://opsshield.com/notice/cpguard-update-channel-compromise.html) itself calls the 32 files 'a preliminary estimate of confirmed data retrieval, not the total number of potentially affected servers', and the spokesperson's line in BleepingComputer ('We detected 2946 servers were affected') gives an affected-server count without addressing the 32 figure, so no source has the spokesperson contradict it. 'BleepingComputer restates the first one' is also ambiguous: BleepingComputer restates the earlier advisory (versions 5.88.12 to 5.88.19, detection within 12 hours) and adds the spokesperson's figure, while the first-listed document is the later disclosure. Suggested wording: the advisory gave 32 retrieved files as a preliminary figure, and a spokesperson told BleepingComputer 2,946 servers were affected; the later disclosure gives about 2,950."
- code: F11
  category: editorial-advisory
  section: new-entry
  item: "threeam-uk-school-veeam-rogue-domain-admins-new-ad-trusts: Detection line"
  url_or_quote: "file contents staged into registry values and sent out by HTTP POST to an internal host, which Bitdefender calls an unusual channel and a strong indicator to hunt for"
  summary: "(low confidence) Bitdefender's sentence is 'The registry-as-transport channel is an unusual choice and a strong indicator to hunt for' and refers to the registry transport (results and files staged into registry values), not to the HTTP POST of the zip to the unmanaged host. Attach it to the registry staging alone. The iteration-4 remediation on the trust clause is correct: 'a new trust between domains is a rare change and cheap to alert on' is now attached to the trust only. The Detection and Exposure lines still carry Bitdefender attributions with no inline citation. May be left."
