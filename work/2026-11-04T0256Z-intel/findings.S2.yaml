    techniques: []
    technique_note: "The covered entry carries the mapping for the exposed-controller and remote-maintenance path; this delta adds only the operator's statement that a remote-maintenance company was the target."
    affected_products: ["Danfoss AK-SM", "Danfoss AK-SC"]
    entity_keys: ["incident:danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack-2026-10"]
    new_entities: []
