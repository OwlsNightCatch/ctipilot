  - title: "Swiss GitLab exposure: Shadowserver data relayed by Inside IT puts 48 internet-reachable Swiss GitLab instances on CVE-2026-110264, 8 of them also on the exploited CVE-2026-97229"
    novelty: "update-of:2026-10-13/cve-2026-97229-gitlab-ci-regex-compiler-unauthenticated-rce"
    sources:
      - { url: "https://www.inside-it.ch/schweizer-server-von-kritischen-gitlab-luecken-betroffen-20261103", publisher: "Inside IT", date: "2026-11-03", role: "primary" }
    discovery_trace: "first seen at: inside-it-ch, URL https://www.inside-it.ch/rss.xml (item https://www.inside-it.ch/schweizer-server-von-kritischen-gitlab-luecken-betroffen-20261103). The originating Shadowserver data was not reachable (WebSearch for the Shadowserver figures found nothing); dead end logged."
    summary: |
      Home-region exposure delta on the covered GitLab entries (CVE-2026-97229, exploited and CISA-KEV-listed; CVE-2026-110264, patched 2026-10-21, no confirmed exploitation per Inside IT). Inside IT (2026-11-03), citing Shadowserver Foundation data as of 2026-11-01, reports that 48 internet-reachable GitLab instances in Switzerland are affected by at least one critical flaw: all 48 by CVE-2026-110264 and 8 of them additionally by CVE-2026-97229, both CVSS 10. Worldwide Shadowserver counts 10,925 of about 39,000 internet-reachable instances vulnerable to at least one of the two, nearly one in three. Inside IT notes the patches for CVE-2026-97229 have been available since 12 October and that GitLab versions of the past twelve years are affected by CVE-2026-110264. The Swiss figure is a count of reachable instances, not of public-sector operators; cantonal and communal self-hosted GitLab is the relevant subset and no source breaks it out. Single secondary relay of a measurement; the entry's own mechanics (fixed builds, Ruby patch level, KEV listing) stand.
    region_nexus: "Switzerland (internet-reachable instances)"
    primary_sector_nexus: "indirect (self-managed GitLab at cantonal, communal and supplier level; share unknown)"
    sector: "cross-sector"
    cves: ["CVE-2026-97229", "CVE-2026-110264"]
