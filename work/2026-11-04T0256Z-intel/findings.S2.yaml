  - title: "Federal Council adopts a transitional authorisation model so Swiss providers can hand electronic evidence directly to EU criminal-justice authorities (2026-10-28); ICTjournal interview on what it leaves open"
    novelty: new
    borderline: true
    borderline_reason: "Obligation change falls on digital-service providers, not on the constituency's defenders; the Federal Council decision is dated 2026-10-28, outside the window (ICTjournal's 2026-11-03 interview is the in-window piece). Relevant only through the sovereignty/own-keys discussion for public bodies' hosted data (cf. privatim Merkblatt v3.02)."
    lookback: true
    sources:
      - { url: "https://www.admin.ch/fr/newnsb/7qN7C6rXIknA", publisher: "Swiss Federal Council / DFJP (admin.ch)", date: "2026-10-28", role: "primary" }
      - { url: "https://www.ictjournal.ch/interviews/2026-11-03/preuves-electroniques-la-souverainete-des-donnees-suisses-a-lepreuve-de-lue", publisher: "ICTjournal", date: "2026-11-03", role: "corroborating" }
    discovery_trace: "first seen at: ictjournal-ch, URL https://www.ictjournal.ch/rss.xml (item https://www.ictjournal.ch/interviews/2026-11-03/preuves-electroniques-la-souverainete-des-donnees-suisses-a-lepreuve-de-lue) → primary: admin.ch release linked from the interview, URL https://www.admin.ch/fr/newnsb/7qN7C6rXIknA"
    summary: |
      The Federal Council adopted on 2026-10-28 a model authorisation decision under which Swiss digital-service providers can obtain a special authorisation from the Federal Department of Justice and Police (DFJP) to hand over electronic evidence (e-mails, chat histories, IP addresses) directly to competent EU criminal-prosecution authorities, including data stored in Switzerland, until a dedicated Swiss legal basis exists; the authorisation is valid for at most two years and renewable. The aim is to keep providers such as Swisscom, Sunrise or Proton from having to breach either the EU e-evidence legislation or Article 271 of the Swiss Criminal Code. In ICTjournal's interview, lawyer Alexandre Jotterand says the authorisation lifts only the Art. 271 risk, not telecommunications secrecy (Art. 321ter), official secrecy (Art. 320) or professional secrecy (Art. 321), which providers must still check per order in very short deadlines; he reads the move as making the distinction between US and Swiss or European providers largely moot for foreign-access risk and as leaving the dependence on a few large providers in place. For Swiss public bodies this is context for hosting decisions, not a new obligation.
    region_nexus: "Switzerland (federal policy); EU e-evidence"
    primary_sector_nexus: "indirect (hosted public-body data at Swiss providers)"
    sector: "public-sector; telecommunications"
    cves: []
    techniques: []
    affected_products: []
    entity_keys: []
    new_entities: []
    verification: MULTI-SOURCE
    confidence: HIGH
    classification_hint: "A1 for the decision; B2 for the legal commentary"
    evidence:
      - quote: "Cette autorisation spéciale est valable deux ans au maximum"
        attribution: "Swiss Federal Council / DFJP"
        source_url: "https://www.admin.ch/fr/newnsb/7qN7C6rXIknA"

