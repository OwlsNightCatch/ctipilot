  - title: "SiK-N motion 26.4717: the National Council's security-policy committee asks the Federal Council to write digital-dependency risk into procurement criteria for critical digital infrastructure under ISG Art. 5"
    novelty: new
    borderline: true
    borderline_reason: "Fails the strict PD-11(c) bar (a committee motion submitted 2026-11-03, not an adopted obligation), but it is the first parliamentary vehicle tying ISG Art. 5 critical infrastructure, AI services and public procurement to documented dependency risk, the same theme as the privatim cloud Merkblatt already in the store. Source is the Curia Vista OData record (the parlament.ch page is client-rendered and empty to extract)."
    sources:
      - { url: "https://ws.parlament.ch/OData.svc/Business(ID=20264717,Language='DE')", publisher: "Swiss Parliament (Curia Vista web service)", date: "2026-11-03", role: "primary" }
    discovery_trace: "first seen at: parlament-ch-curia-vista-odata, URL https://ws.parlament.ch/odata.svc/Business?$top=15&$format=json&$orderby=Modified desc&$filter=Modified gt datetime'2026-10-28T00:00:00' → primary: entity record https://ws.parlament.ch/OData.svc/Business(ID=20264717,Language='DE')"
    summary: |
      Curia Vista lists motion 26.4717, "Digitale Abhängigkeiten. Kontinuität kritischer Staatsaufgaben sichern", submitted on 2026-11-03 by the Security Policy Committee of the National Council (status: Eingereicht; first council: National Council). The text instructs the Federal Council to implement the operational measures needed so that public procurement of contracts affecting critical digital infrastructure within the meaning of Article 5 of the Information Security Act (ISG), or the security and continuity of central state tasks, including the AI services and models used for them, systematically includes the risks of technological, operational and legal dependencies in the award criteria. The committee's reasoning asks for solutions that keep critical tasks running when access to the provider is interrupted, the provider takes a unilateral decision, foreign legal pressure is applied or contract terms change materially; for reversibility (return of data in a processable format) and continuity to be proved; for an independent evaluation under Swiss law; for dependencies to be documented as a strategic weakness, mitigated, re-evaluated periodically and approved by the Federal Council; and for the Federal Council to specify, for the most critical systems, how the national-security exceptions of the WTO procurement agreement can be invoked. Nothing is binding yet: a motion needs adoption by both councils and Federal Council implementation. A second committee motion, 26.4716 (submitted 2026-11-02), asks for a national reporting office for drone sightings near military and critical infrastructure; it is physical-security policy and is not returned separately.
