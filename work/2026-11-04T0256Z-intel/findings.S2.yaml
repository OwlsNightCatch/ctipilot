    summary: |
      Google Threat Intelligence Group (2026-11-02) says Google and partners, among them Japan's National Police Agency, Lumen, HUMAN Security, Plume, Synthient and TrendAI, dismantled the XCPE backdoor that enrolled more than 1.3 million set-top boxes into a botnet, and GTIG assesses with high confidence that Videostrong Technology Co., an Android OEM/ODM, built, deployed and operated it for profit; this is an attribution by GTIG, which holds the telemetry, and heise relays it. The first-stage component is preloaded in the firmware partition, runs at system privilege and reinstalls itself from the OEM partition after a reboot if a user removes it; it talks to a two-stage command channel (an HTTP configuration request, then a persistent MQTT subscription) and offloads affiliate modules that turn devices into residential-proxy exit nodes, ad-fraud engines or loaders of further backdoors. Google took legal action against the control domains and servers and against C2 domains of more than a dozen module families (GTIG estimates at least 10 million additional compromised devices lose their C2), banned Videostrong and any successors from building certified Android devices, and changed its firmware-integrity review after the malware loaded code only after a device's first boot. For defenders, the behaviour class is residential-proxy and MQTT beaconing from set-top boxes and signage players; the hardening lever is procurement of certified, supply-chain-vetted devices and network isolation of unmanaged Android TV boxes.
