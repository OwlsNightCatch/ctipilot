  - title: "Google dismantles the XCPE botnet of 1.3 million Android set-top boxes and attributes it to the OEM Videostrong; firmware backdoor survives reboot"
    novelty: new
    borderline: true
    borderline_reason: "Law-enforcement-adjacent infrastructure disruption (Google legal action with Japan's National Police Agency) under the policy watch's sanctions/takedown bullet, but no Swiss or public-sector nexus is stated; S3 will likely surface the GTIG write-up as research. Relevance to Swiss public bodies is procurement of low-cost Android TV boxes (signage, schools, municipal buildings) only by inference."
    sources:
