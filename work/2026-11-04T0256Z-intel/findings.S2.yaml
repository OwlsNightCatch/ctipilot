        attribution: "RTS"
        source_url: "https://www.rts.ch/info/regions/vaud/2026/article/piratage-des-ecoles-vaudoises-un-eleve-de-16-ans-interpelle-29404446.html"
      - quote: "Le jeune homme a été auditionné et son matériel informatique a été saisi."
        attribution: "RTS"
        source_url: "https://www.rts.ch/info/regions/vaud/2026/article/piratage-des-ecoles-vaudoises-un-eleve-de-16-ans-interpelle-29404446.html"
      - quote: "Die Polizei nahm den Jugendlichen am 31. Oktober fest."
        attribution: "Inside IT"
        source_url: "https://www.inside-it.ch/16-jaehriger-hackte-wohl-waadtlaender-schulen-20261103"
      - quote: "Der unbefugte Zugriff erfolgte zwischen dem 23. und 26. Oktober."
        attribution: "Inside IT"
        source_url: "https://www.inside-it.ch/16-jaehriger-hackte-wohl-waadtlaender-schulen-20261103"
    extended_notes: |
      Lesson that transfers to defenders of cantonal and communal education and administration platforms: an insider-adjacent (pupil) actor reached a support/ticketing platform that held directory data and free-text support requests; the cantonal risk statement is targeted phishing posing as school IT support. No hunting detail is published.

  - title: "BSI: Apple mercenary-spyware threat notifications since 2026-10-29 reached Bundestag members and government members; Apple confirms the round reached users in 99 countries"
    novelty: new
    sources:
      - { url: "https://www.bsi.bund.de/DE/Themen/Unternehmen-und-Organisationen/Informationen-und-Empfehlungen/Empfehlungen-nach-Angriffszielen/Buero/Apple_Mercenary-Spyware/apple_mercenary-spyware.html?nn=1211784", publisher: "BSI (Germany)", date: "2026-11-02", role: "primary" }
      - { url: "https://www.heise.de/news/Auch-deutsche-Bundespolitik-Apple-bestaetigt-Spyware-Warnung-11508629.html", publisher: "heise online (Mac & i)", date: "2026-11-03", role: "corroborating" }
      - { url: "https://www.tagesschau.de/inland/innenpolitik/wildberger-hackerangriff-bundestagsabgeordnete-100.html", publisher: "Tagesschau (ARD)", date: "2026-11-01", role: "corroborating" }
      - { url: "https://www.heise.de/news/BSI-Warnung-vor-Spaehsoftware-auf-Politiker-Handys-11507404.html", publisher: "heise online (dpa)", date: "2026-11-01", role: "corroborating" }
    discovery_trace: "first seen at: heise-sec, URL https://www.heise.de/security/feed.xml (item https://www.heise.de/news/Auch-deutsche-Bundespolitik-Apple-bestaetigt-Spyware-Warnung-11508629.html, 2026-11-03T10:59Z) → pivot: heise 2026-11-01 report https://www.heise.de/news/BSI-Warnung-vor-Spaehsoftware-auf-Politiker-Handys-11507404.html → pivot: Tagesschau https://www.tagesschau.de/inland/innenpolitik/wildberger-hackerangriff-bundestagsabgeordnete-100.html → primary: BSI information page (extract), URL as listed. WebSearch (DE/FR) for a Swiss angle found no Swiss authority statement."
    summary: |
      Germany's BSI says that several members of the Bundestag and other public figures have, since 2026-10-29, received an Apple threat notification stating that Apple detected an attack with so-called mercenary spyware: commercially developed advanced spyware historically used on behalf of state actors against individually selected targets. BSI does not know whether the notifications mean actual compromises or only attempts, assesses that such spyware typically infects devices without user interaction ("zero-click", for example through a prepared message that need not be opened), and tells recipients to assume the device may be compromised. BSI wrote to Bundestag members on 2026-10-30 and asks recipients to report to its service centre. Digital Minister Wildberger confirmed to ARD that government members' devices are among those notified (Tagesschau, 2026-11-01). Apple confirmed to heise Mac & i that the round occurred on 2026-10-29 and that users in 99 countries, not only Germany, received it; Apple never discloses what triggered a notification or names the spyware or attacker, and which iOS versions were attacked remains unclear. BSI's recipient guidance: update the OS at once unless forensic analysis is intended, consider Lockdown Mode (which makes new attacks harder but does not remove an existing infection), consider replacing the device and changing the phone number for high assessed risk, set a new device passcode, change the Apple account, e-mail and other account passwords, check that two-factor authentication is on, replace the trusted phone number, re-set up authenticator apps instead of transferring them, enable Signal registration lock and WhatsApp two-step verification with new PINs, and remove unknown linked devices. A genuine notification appears on the lock screen and in settings, arrives by e-mail and shows at the top of account.apple.com after sign-in; Apple never asks to click links, open files, install apps or profiles, or give passwords or codes. No Swiss authority statement, and no statement that Swiss officials were notified, was found.
    region_nexus: "Germany (neighbour; federal government and parliament); global round in 99 countries per Apple via heise; no Swiss-specific statement found"
    primary_sector_nexus: "indirect (government officials as targets; applies to federal/cantonal officials with iPhones)"
    sector: "public-sector"
    cves: []
    techniques: ["T1203", "T1123", "T1125"]
    technique_note: "T1203 reflects BSI's stated assessment of zero-click delivery via a crafted message (an assessment, not an observed chain); T1123/T1125 reflect BSI's list of microphone and camera access after compromise. The iOS vulnerability, spyware family and operator are unknown."
    affected_products: ["Apple iPhone (iOS)"]
    entity_keys: []
    new_entities:
      - { key: "incident:apple-threat-notifications-mercenary-spyware-2026-10", type: incident, name: "Apple mercenary-spyware threat-notification round of 2026-10-29", aliases: ["Apple Threat Notifications Oktober 2026", "Bundestag iPhone spyware warning"], summary: "Apple's 2026-10-29 round of threat notifications about mercenary spyware, which reached German Bundestag and government members (BSI, 2026-11-02) and users in 99 countries (Apple to heise, 2026-11-03); attacker, spyware family and trigger undisclosed." }
    relation_suggestions: []
    verification: SINGLE-SOURCE-NATIONAL-CERT
    sourcing_note: "BSI is a carve-out national CERT acting for its own jurisdiction; Tagesschau and two heise reports independently corroborate the notification facts and the Apple confirmation. Nothing corroborates the zero-click assessment beyond BSI's own wording."
    confidence: HIGH
    classification_hint: "A2 (BSI primary; notification fact corroborated, assessment of delivery unconfirmed)"
    evidence:
      - quote: "Dem BSI ist nicht bekannt, ob diese Benachrichtigungen tatsächliche Kompromittierungen bedeuten oder lediglich auf Angriffsversuche hinweisen."
        attribution: "BSI"
        source_url: "https://www.bsi.bund.de/DE/Themen/Unternehmen-und-Organisationen/Informationen-und-Empfehlungen/Empfehlungen-nach-Angriffszielen/Buero/Apple_Mercenary-Spyware/apple_mercenary-spyware.html?nn=1211784"
      - quote: "Der Blockierungsmodus erschwert neue Angriffe, eine bestehende Infektion beseitigt er nicht."
        attribution: "BSI"
        source_url: "https://www.bsi.bund.de/DE/Themen/Unternehmen-und-Organisationen/Informationen-und-Empfehlungen/Empfehlungen-nach-Angriffszielen/Buero/Apple_Mercenary-Spyware/apple_mercenary-spyware.html?nn=1211784"
      - quote: "Der Konzern bestätigte gegenüber heise Mac & i, dass es diese am 29. Oktober gegeben hat."
        attribution: "heise online"
        source_url: "https://www.heise.de/news/Auch-deutsche-Bundespolitik-Apple-bestaetigt-Spyware-Warnung-11508629.html"
      - quote: "Allerdings waren nicht nur Personen in Deutschland betroffen."
        attribution: "heise online"
        source_url: "https://www.heise.de/news/Auch-deutsche-Bundespolitik-Apple-bestaetigt-Spyware-Warnung-11508629.html"
    extended_notes: |
      Detection/triage angle for a Swiss SOC: there is no network or endpoint telemetry for this class; the only signal is Apple's own notification (lock screen, Settings, e-mail, account.apple.com). The defender decision is process: who in the organisation (ministers, federal and cantonal officials, parliamentarians' staff, diplomatic and security-policy staff) can report a notification to the SOC, how fast a device is replaced, and whether Lockdown Mode is a baseline for those people. Benign lookalike: a phishing message imitating an Apple threat notification; BSI's check is to open account.apple.com directly, not a link.

  - title: "Refrigeration-controller attack wave reaches Germany: Edeka Reisbach (Lower Bavaria) and CAP supermarkets in NRW report overheated cold rooms on 2026-11-02, BSI warns"
    novelty: "update-of:2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack"
    sources:
      - { url: "https://www.heise.de/news/Cyberangriffe-auf-Kuehlschraenke-Erste-deutsche-Faelle-in-Bayern-und-NRW-11508922.html", publisher: "heise online", date: "2026-11-03", role: "primary" }
      - { url: "https://www1.wdr.de/nrw/cyberangriffe-supermarkt-kuehltruhen-nrw-100.html", publisher: "WDR", date: "2026-11-03", role: "corroborating" }
      - { url: "https://www.ictjournal.ch/news/2026-11-03/cyberattaques-les-systemes-frigorifiques-des-supermarches-compromis-coop-aussi-vise", publisher: "ICTjournal", date: "2026-11-03", role: "corroborating" }
    discovery_trace: "first seen at: heise-sec, URL https://www.heise.de/security/feed.xml (item 2026-11-03T09:44Z) → pivot: WDR regional report https://www1.wdr.de/nrw/cyberangriffe-supermarkt-kuehltruhen-nrw-100.html; Swiss relay at ICTjournal https://www.ictjournal.ch/news/2026-11-03/cyberattaques-les-systemes-frigorifiques-des-supermarches-compromis-coop-aussi-vise. The BSI warning itself was not fetched (heise paraphrases it); a WebSearch snippet pointed to BSI-CS 154 but that page was not fetched and is not cited."
    summary: |
      Delta on the covered refrigeration entry, which already lists Belgium, Luxembourg, the Netherlands, Sweden, Ireland, Estonia and Finland and Coop Switzerland's statement that attempts failed. heise (2026-11-03) reports the first German cases: the cold rooms of an Edeka market in Reisbach (Lower Bavaria) were heated to 50 degrees Celsius overnight to Monday 2026-11-02 and the operator wrote on Facebook that food had to be thrown away; Polizeipraesidium Niederbayern investigates and has not confirmed a cyberattack as the cause. WDR adds CAP supermarkets (operated by Arbeiterwohlfahrt) in Wuppertal and Wetter-Volmarstein (NRW), where an external access over the weekend left cold and freezer units too warm; a regional manager says the actual attack hit the company that maintains the cooling plants remotely, which is the operator's statement, not an authority finding. heise says it is not confirmed that the same method as in France stands behind the new cases, notes that BSI has issued a warning that refers to earlier sabotage in Poland and puts disconnecting the plants from the internet first, with VPN, multi-factor access, block lists and protocol filtering as further levers, and that the Reisbach operator has taken the affected plants offline and will not reconnect them for now. For Swiss defenders (communal and cantonal facilities with refrigeration or building plant managed by contractors) the delta supports the existing remote-maintenance-path point: two of the German cases name the maintenance company or external access as the route. The Swiss line stays as in the entry: Coop confirms attempts that did not succeed.
    region_nexus: "Germany (neighbour) added to a multi-country wave; Switzerland: Coop attempts failed (already in the entry)"
    primary_sector_nexus: "indirect (food-retail OT; remote maintenance of building and refrigeration plant)"
    sector: "retail; building automation"
