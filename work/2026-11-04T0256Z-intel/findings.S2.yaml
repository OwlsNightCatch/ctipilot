  - title: "Canton Vaud school platform breach: police say a 16-year-old pupil was arrested on 2026-10-31 and is suspected of the 23-26 October intrusion and data theft"
    novelty: "update-of:2026-11-01/vaud-school-it-support-platform-data-theft-teachers-pupils"
    sources:
      - { url: "https://www.rts.ch/info/regions/vaud/2026/article/piratage-des-ecoles-vaudoises-un-eleve-de-16-ans-interpelle-29404446.html", publisher: "RTS", date: "2026-11-03", role: "primary" }
      - { url: "https://www.inside-it.ch/16-jaehriger-hackte-wohl-waadtlaender-schulen-20261103", publisher: "Inside IT (Keystone-SDA)", date: "2026-11-03", role: "corroborating" }
    discovery_trace: "first seen at: inside-it-ch, URL https://www.inside-it.ch/rss.xml (feed item https://www.inside-it.ch/16-jaehriger-hackte-wohl-waadtlaender-schulen-20261103) → pivot: rts-info-regions RSS, URL https://www.rts.ch/info/regions/?format=rss/news → primary-grade: RTS article quoting the Vaud cantonal police communique, URL https://www.rts.ch/info/regions/vaud/2026/article/piratage-des-ecoles-vaudoises-un-eleve-de-16-ans-interpelle-29404446.html. The police communique itself was not located (WebSearch FR/DE x4 found nothing; vd.ch press list carries only the 2026-10-31 cantonal release)."
    summary: |
      Delta on the covered Vaud entry. RTS (2026-11-03), citing the Vaud cantonal police communique of the same day, reports that a minor aged 16 was arrested on Saturday 2026-10-31 and is suspected of having entered the post-compulsory-education IT-support platform and taken data from it between 23 and 26 October 2026. He was questioned, his IT equipment was seized, and he was released at the end of the hearing; a criminal complaint has been filed and the juvenile court (Tribunal des mineurs) runs the procedure. Per RTS the investigation is to establish how the intrusion happened and whether data were downloaded and passed to third parties. Inside IT (Keystone-SDA) adds that the pupil attends one of the affected schools, that the school sanction process is separate from the criminal case, that the cantonal education authority found the attack on 26 October and cut the platform from the internet, and that the Vaud police's cyber unit is analysing the seized devices. This replaces the entry's statement that the police had not confirmed a pupil suspect: the police now name a 16-year-old suspect, while whether data left the suspect's hands is unresolved. The platform holds names, school e-mail addresses and support-request text, no passwords, grades or pupil files; compulsory schools run a separate system. No source gives the platform product or the access method.
    region_nexus: "Switzerland, canton Vaud (cantonal post-compulsory education: Gymnases and vocational schools)"
    primary_sector_nexus: "direct (cantonal administration / public education)"
    sector: "public-sector"
    cves: []
    techniques: []
    technique_note: "Access method not stated by any source; the covered entry carries whatever mapping its sources support. Do not add one on this delta."
    affected_products: []
    entity_keys: ["incident:vaud-dgep-it-support-platform-data-theft-2026-10"]
    new_entities: []
    verification: MULTI-SOURCE
    confidence: HIGH
    classification_hint: "B2 (RTS public broadcaster relaying the police communique, corroborated by Keystone-SDA via Inside IT)"
    evidence:
