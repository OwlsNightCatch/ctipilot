  - title: "Pensionskasse Stadt Zürich (PKZH) suspends its planned 2027 migration to PK Softech's administration software and says the supplier incident involves its test data"
    novelty: "update-of:2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow"
    borderline: true
    borderline_reason: "Consequence-only delta on an entry with 13 prior records that already carries PKZH's data-theft statement; single secondary source (PKZH's own release not located). Worth a record only if the main agent wants the supplier-governance consequence and the 42,600 / 21,700 population figures on the entry."
    sources:
      - { url: "https://www.inside-it.ch/pensionskasse-zuerich-sistiert-softwaremigration-20261103", publisher: "Inside IT", date: "2026-11-03", role: "primary" }
    discovery_trace: "first seen at: inside-it-ch, URL https://www.inside-it.ch/rss.xml (item https://www.inside-it.ch/pensionskasse-zuerich-sistiert-softwaremigration-20261103). PKZH's communication not located: pkzh.ch home page carries no notice; WebSearch x3 found only the October reports."
    summary: |
      Inside IT (2026-11-03), relaying PKZH's communication, reports that the foundation board decided to suspend the introduction of PK Softech's new administration solution, planned for early 2027, because of the cyberattack on the supplier. In preparation for the migration PKZH had already delivered test data to the supplier, and part of that data of City of Zurich insured persons was taken in the attack; in the worst case it comprises names, birth dates, addresses, AHV numbers, pension data, marital status and IBAN numbers. PKZH is working through the attack and the possible data loss; only once results exist will the board decide whether, when and on what terms a new system is introduced. The Federal Prosecutor's Office is investigating and PKZH is in contact with the data protection authority. PKZH keeps operating its existing administration system next year and says nothing changes for its 42,600 insured persons and just over 21,700 pensioners. Supply-chain lesson, as stated: the exposed data were migration test data given to a supplier before go-live.
    region_nexus: "Switzerland (City of Zurich pension fund; federal and cantonal pension-fund supplier)"
    primary_sector_nexus: "direct (public-law pension funds of federal, cantonal and communal staff)"
    sector: "public-sector"
