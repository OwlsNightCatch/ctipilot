  - claim_id: ccbfc3f6a8
    entry: 2026-11-04/cpguard-update-channel-hijacked-backdoor-root-secrets
    surface: "summary"
    kind: frontmatter
    text: "OPSSHIELD's disclosure of 2026-11-03 says an attacker registered as a customer on its billing portal and ran commands on the billing and licensing server, through crafted requests to the portal's callback pages (the vendor's logs do not record the exact request that gave access), took the keys used to publish updates and shipped a fake cPGuard update for about 70 minutes on 2026-11-02 (02:08 to 03:20 UTC). The update ran as root on about 2,950 customer servers, copied password hashes, root SSH keys, the MySQL root password and root shell history (cloud storage keys on a few) and left a hidden root shell and a scheduled task; about 7,900 billing-portal accounts were exposed as well. The clean update 5.88.26 removes the shell and a follow-up update removes the task, but copied credentials stay usable until rotated."
  - claim_id: 2fb6cfde10
    entry: 2026-11-04/cpguard-update-channel-hijacked-backdoor-root-secrets
    surface: "body"
    kind: cited
    text: "**Exposure:** any Linux server on which cPGuard was installed and online between 02:08 and 03:20 UTC on 2026-11-02; the vendor's earlier advisory framed the exposure as an install of versions 5.88.12 through 5.88.19 shown by \"Successfully updated\" entries in the product's install log, which proves installation and not that the script ran ("
    urls: ["https://opsshield.com/notice/cpguard-update-channel-compromise.html"]
  - claim_id: d546b5fdbf
    entry: 2026-11-04/cpguard-update-channel-hijacked-backdoor-root-secrets
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** treat any server that ran the fake update as compromised for credential purposes even after the update: reset root and all local passwords, from a trusted environment as the earlier advisory says ("
    urls: ["https://opsshield.com/notice/cpguard-update-channel-compromise.html"]
  - claim_id: ed9c861a79
