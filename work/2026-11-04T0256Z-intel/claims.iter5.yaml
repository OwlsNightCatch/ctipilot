  - claim_id: 49cb89624b
    entry: 2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack
    surface: "summary"
    kind: frontmatter
    text: "Coopérative U, Intermarché and E. Leclerc confirmed to AFP a cyberattack on their refrigeration systems overnight on 11 to 12 October 2026, a remotely forced defrost at hundreds of French stores. On 2026-11-02 BleepingComputer counts more than 115 stores in Belgium, Luxembourg, the Netherlands, Sweden, Ireland and Estonia with refrigeration failures, and heise and WDR report the first German cases on 2 to 3 November; Belgian contractor Sabcobel says its sites were hit through the same vulnerability as in France, CyberInsider says the manufacturer and access method of the new wave remain unknown, and SentinelLABS says responsibility has not been publicly established. CERT-FR reports numerous compromises of Danfoss AK-SM and AK-SC controllers and of Copeland xweb and Dixell xweb, NCSC Switzerland rates the activity actively exploited, ANSSI says elementary flaws were exploited, controllers directly on the internet and weak passwords, and Coop Switzerland says attempts against it failed. Le Canard enchaîné reports that cold rooms of a French blood-service contractor were programmed to 110 degrees overnight on 1 to 2 November, with no source naming the equipment or tying it to these controllers; Reuters and Nextgov report that the Pentagon treats freezer failures at US military commissaries as a suspected hack."
  - claim_id: 77cd5c82bc
    entry: 2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack
    surface: "actions[0]"
    kind: frontmatter
    text: "Find every Danfoss AK-SM and AK-SC, Copeland xweb and Dixell xweb refrigeration controller, and any other refrigeration controller with a remote management interface because not every second-wave site's vendor is confirmed, in facilities you own or that a contractor manages for you and take its management interface off the internet now, restoring access only through a secure VPN or protected network (filtering to the contractor's source addresses is an emergency stop-gap, and CERT-FR asks you to check your insurance conditions before cutting the contractor's data uplink); an end-of-life unit that gets no fixes needs replacing, because a factory reset leaves it vulnerable and probably compromised again."
  - claim_id: c633e1dacb
    entry: 2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack
    surface: "actions[1]"
    kind: frontmatter
    text: "On every such controller that was reachable from the internet, check the whole configuration, defrost ranges included, against the intended one; for a Danfoss unit that may have been taken over, restart it or otherwise factory-reset it, restore access only through a secure VPN or protected network and reconfigure it for service, then update its firmware, set the security level to Strict and replace the default and any weak passwords, and on every Copeland or Dixell XWEB unit confirm the factory Admin password was changed and give each contractor a named account with an expiry date."
