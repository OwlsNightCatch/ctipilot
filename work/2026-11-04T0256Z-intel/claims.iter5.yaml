    text: "Barracuda ESG: auth bypass plus command injection reach root via the admin interface; no attacks reported"
  - claim_id: f8d76d4581
    entry: 2026-11-04/cve-2026-116606-barracuda-esg-auth-bypass-root-rce
    surface: "summary"
    kind: frontmatter
    text: "Barracuda's advisory of 2026-11-02 covers CVE-2026-116606, a pre-authentication authorization bypass in the Email Security Gateway (CVSS 9.3) that lets an unauthenticated remote attacker restore a crafted backup archive through the configuration-import function, and CVE-2026-111560, a command injection in the timezone field (8.6) that also affects the Load Balancer ADC, Message Archiver, WAF Control Center, Web Application Firewall and Web Security Gateway; chained, they give root, and Barracuda says exploitation needs access to the administrative interface. Patches are out; NCSC Switzerland rates exploitation unknown and no source reports attacks. Barracuda's Campus article names firmware 9.4.0.029 while the CVE record lists builds before 9.4.0.030 as affected."
  - claim_id: 36aab5458e
    entry: 2026-11-04/cve-2026-116606-barracuda-esg-auth-bypass-root-rce
    surface: "actions[0]"
    kind: frontmatter
    text: "Restrict the administrative interface of every Barracuda Email Security Gateway, Load Balancer ADC, Message Archiver, WAF Control Center, Web Application Firewall and Web Security Gateway to trusted internal networks now, update every Email Security Gateway to firmware 9.4.0.030 or later, which satisfies both Barracuda Campus (9.4.0.029 or later) and the CVE record (builds before 9.4.0.030 are affected), and apply Barracuda's patch to each of the other products (BNADC-16586 for the Load Balancer ADC and the Web Application Firewall, BNMA-32468, BNWF-60060, BNYF-24789), confirming that automatic patching is on."
  - claim_id: e4075167f0
