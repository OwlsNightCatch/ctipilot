- code: F11
  category: editorial-advisory
  section: new-entry
  item: "cve-2026-116606-barracuda-esg-auth-bypass-root-rce, Exposure"
  url_or_quote: "\"The appliance reports its firmware version, which should read 9.4.0.029 or later after the update ([Barracuda Campus, 2026-11-02](...))\""
  summary: "The Exposure check repeats Campus's 9.4.0.029 threshold while the action and takeaway tell the reader to reach 9.4.0.030 (the Mandiant record lists 9.4.0.029 as affected). A reader who stops at the Exposure line would accept 9.4.0.029. Say 9.4.0.030 or later there, with Campus's 9.4.0.029 as the vendor's own figure."
