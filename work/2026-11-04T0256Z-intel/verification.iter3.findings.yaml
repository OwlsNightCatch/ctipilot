- code: F4
  category: hallucinated-fact
  section: new-entry+registry
  item: "cpguard-update-channel-hijacked-backdoor-root-secrets, summary; entities/registry.yaml incident:opsshield-cpguard-update-channel-compromise-2026-11 summary"
  url_or_quote: "summary: \"The clean update 5.88.26 removes the shell and a follow-up update removes the task, but copied credentials stay usable until rotated.\" / registry: \"clean update 5.88.26, and credentials copied before cleanup stay usable until rotated (OPSSHIELD, 2026-11-03)\""
  summary: "(low confidence) The vendor hedges: https://opsshield.com/notice/cpguard-update-channel-compromise.html says 'A successful update removes the known files, but credentials copied before cleanup may still be usable.' The entry body keeps 'may still be usable' but the frontmatter summary and the reader-facing registry summary drop the hedge ('stay usable until rotated'), and the registry cites the 2026-11-03 disclosure, which does not carry that sentence. Restore 'may still be usable' (or state it as the entry's own reading) and attribute it to the advisory."
- code: F9
  category: surface-contradiction
  section: updated-entry
  item: "cve-2026-76461-cisco-secure-email-gateway-sqli-root-rce, body paragraphs 2 and 3 and summary"
  url_or_quote: "\"Cisco states the vulnerability 'was found during the resolution of a Cisco TAC support case' (meaning it surfaced from a real customer's compromise investigation, not internal fuzzing)\" vs \"Cisco's advisory, revised on 2026-10-14, says two vulnerabilities found in the review are known to be actively exploited: this SQL injection and the separately advised arbitrary file write\""
  summary: "(low confidence) The SQL-injection advisory (cisco-sa-esa-inj-2bLVGmhX) says 'This vulnerability was found during the resolution of a Cisco TAC support case.' The hardening advisory (cisco-sa-hardening-esa-dfCrfXkm, rev 1.1) says 'These vulnerabilities were found during internal testing. Two of them are known to be actively exploited. For more information, see [SQL Injection] and [Arbitrary File Write]', which places the same SQL injection among the internally found set. The entry now carries both statements about CVE-2026-76461 (and the summary 'from its internal review ... this one') without a Contradiction line. Add one sentence naming the discrepancy in Cisco's own wording."
- code: F9
  category: surface-contradiction
  section: updated-entry
  item: "cve-2026-104935-ivanti-connect-secure-zero-day-chain-kev, 2026-10-16 and 2026-10-21 sections vs the 2026-11-04 improvement section"
  url_or_quote: "2026-10-21 section: \"CERT-FR still lists 25.1.3.x builds before 25.1.3.1 as affected ([CERT-FR, 2026-10-14](https://www.cert.ssi.gouv.fr/alerte/CERTFR-2026-ALE-013/))\"; 2026-10-16 section: \"does not list a 25.1.2.x line\""
  summary: "(low confidence) The same CERT-FR alert page (updated 2 Nov) now lists 'Connect Secure (ICS) version 25.1.2.x antérieures à 25.1.3.1' and says 'Ivanti précise que les versions 25.1.3.x ne sont pas affectées par ... CVE-2026-111357 et CVE-2026-118527'; the 2026-11-04 section states that text, but the earlier present-tense statements on the same page stay unqualified, so the entry reads as both listing and not listing a 25.1.2.x line, and as counting 25.1.3.x as affected and not affected. Qualify the earlier statements as the alert's text of that date (or add a clause to the newest section saying the current text replaces them). The 2026-10-31 section's closing 'CVE-2026-118527 has no public CVE record, affected range or fixed build yet' is likewise superseded by the 2026-11-03 CVE record."
