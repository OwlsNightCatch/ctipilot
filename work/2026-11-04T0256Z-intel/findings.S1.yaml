  note: 'Flowise CVE-2026-119978 (authenticated), Linksys router CVE-2026-120283 (consumer, VulDB), Gitea, Apache Wicket, Traefik, Absolute Secure Access (authenticated), GLPI (priv-esc/XSS), Redmine (XSS/DoS),
    Xen XSA-523, Tenable Identity Exposure tns-2026-34 (RCE class, vendor-published 2026-10-30, not assessed as exploited), PostgreSQL psqlODBC overflow, phpMyFAQ: no unauthenticated high-impact or exploited
    signal.'
