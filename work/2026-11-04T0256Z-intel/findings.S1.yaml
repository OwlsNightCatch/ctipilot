    prior_coverage.json and the entry store: no CWP2Shell coverage; the July entry on CVE-2026-57517 is a different flaw.'
  summary: 'On 2026-11-03 VulnCheck disclosed ten vulnerabilities in Control Web Panel (CWP, formerly CentOS Web Panel), all with identifiers from its own numbering authority: CVE-2026-73695, -73696, -73697,
    -77876, -77877, -77878, -77879, -77880, -77881 and CVE-2026-104080. The entry stage is the user panel on port 2083: its dispatcher builds an include path from the module parameter without stripping
    traversal sequences, and the unauthenticated flow sets a login redirect without stopping execution, so the included module runs before authentication; two user-panel modules then give file write and
    command injection as the hosting user (VulnCheck stage score CVSS 9.8, while the CNA record for CVE-2026-73695 itself scores 8.7 under CVSS 4.0). From that foothold the root-owned user API on loopback
    port 2302 gives two independent paths to root, a missing token check on several routes with command injection in them and an SQL injection in the API''s authentication gate, which VulnCheck scores 8.8
    each and 10.0 for the full chain. The chain needs one valid hosting-account name, which the panel''s own redirect behaviour discloses. VulnCheck says all ten are fixed as of CWP 1.29 (2026-10-31): 1.12
    closed the pre-authentication entry, 1.16 the user-panel modules and two API sinks, and the root API only in the 1.27 and 1.29 releases; the EUVD record for CVE-2026-73695 says before 1.16. CWP''s own
    changelog lists 1.29 and 1.30 on 2026-10-31 and 1.30.1 on 2026-11-03 with user-panel internal-API hardening, without naming CVEs. VulnCheck publishes request-level detail and counts about 19,800 CWP
    observations on the user-panel port in its own scan data (roughly 210,000 and 23,000 hosts in two public search engines, which it calls an order of magnitude, honeypots included), and notes that CVE-2025-48703,
    an earlier CWP user-panel command injection, reached CISA KEV and was mass-exploited within days of a public exploit. No source reports exploitation of these ten flaws; the post itself is the public
    technical disclosure.'
