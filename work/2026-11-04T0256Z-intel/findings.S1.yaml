  note: VulnCheck 'Exploitation Targeting Node-RED' (2026-11-02) is already cited by 2026-08-13/cve-2026-58115-simatic-iot2050-node-red-unauth-root; JFrog Beta9 sandbox escapes and Prefab UI RCE (2026-11-01)
