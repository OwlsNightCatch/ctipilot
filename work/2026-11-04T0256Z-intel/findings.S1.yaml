dispositions:
- ref: CISA KEV additions in window
  disposition: covered
  note: One addition (CVE-2026-119977, 2026-11-03), returned as item 2; no ransomware-flag rows; all other KEV rows of the last 14 days are in the store.
- ref: ENISA EUVD exploited list
  disposition: covered
  note: Four records in total; only EUVD-2026-114575 (WordPress, exploitedSince 2026-11-03) is new; the Ivanti pair (exploitedSince 2026-10-30) and GitLab CVE-2026-97229 are covered.
- ref: Scheduled multi-product releases in window
  disposition: none
  note: No Patch Tuesday, SAP, Adobe, Oracle, Fortinet or Siemens cycle in window (next regular cycle 2026-11-10); Oracle CPU of 2026-10-21 is covered.
- ref: Android Security Bulletin November 2026 (published 2026-11-02, patch level 2026-11-05)
  disposition: drop (borderline for Android fleets)
  note: 'No exploitation statement in the bulletin. Rows rated Critical: Framework RCE CVE-2026-58868 (no user interaction), RCE CVE-2026-58876 and CVE-2026-58936, EoP CVE-2026-55275, CVE-2026-55283, CVE-2026-58984,
    DoS CVE-2026-58814, CVE-2026-58882, plus kernel Bluetooth and pKVM EoP CVE-2026-53256, CVE-2026-59044, CVE-2026-59045. Source https://source.android.com/docs/security/bulletin/2026/2026-11-01; CERT-FR
    CERTFR-2026-AVI-1443. Worth a one-line mention only if the main agent wants mobile-fleet coverage for police and emergency services.'
- ref: Chrome 157 stable (2026-11-03)
  disposition: drop
  note: 213 security fixes, seven rated Critical (CVE-2026-121156, -121229, -121246, -121035, -121247, -121203, -121126), no exploited-in-the-wild statement in the release post https://chromereleases.googleblog.com/2026/11/stable-channel-update-for-desktop.html;
    BSI WID-SEC-2026-4244 rates it hoch. Routine.
- ref: 'Microsoft: first-party revisions and BSI WID-SEC-2026-4286'
  disposition: drop
  note: SUG API sweep (latestRevisionDate since 2026-10-30) shows eight first-party CVEs revised 2026-11-02 for acknowledgement changes only (CVE-2026-69798, -83639, -70052, -83828, -83911, -105726, -102227,
    -68884); the Azure, Entra and Exchange Online rows in WID-SEC-2026-4286 (CVE-2026-105014 9.1, -110063 10.0, -83938 10.0, -69843 10.0, -97785 10.0, -96185 7.5, -108456 7.7) are service-side fixes of
    2026-10-22 and 2026-09-17, none exploited or publicly disclosed per MSRC. No Edge exploitation change.
- ref: CISA ICS advisory ICSA-26-307-01 Subnet Solutions PowerSYSTEM Center
  disposition: drop
  note: CVE-2026-63017 and CVE-2026-63774 at CVSS 9.0 but authenticated; CISA states they are not exploitable remotely and no public exploitation is known.
- ref: Dell DSA-2026-416 PowerProtect Data Domain (35 CVEs)
  disposition: drop (stale; borderline for backup estates)
  note: 'Four unauthenticated network CVSS 9.8 rows in DD OS (CVE-2026-103780 stack overflow to command execution, CVE-2026-86384 hard-coded key, CVE-2026-86397 improper authentication to privileged account
    creation, CVE-2026-86400 improper authentication to root commands) plus three Management Center rows at 9.6 and 9.1; fixed in DD OS 8.9.0.0, 7.13.1.90, 8.3.1.50, 8.6.1.30. Dell''s advisory is revision
    3.0 of 2026-10-19 (initial release 2026-10-01); NCSC-NL relayed it on 2026-10-30 and CCCS on 2026-11-02 (AV26-1110). No exploitation. Sources: https://www.dell.com/support/kbdoc/en-us/000515178/dsa-2026-416-security-update-for-dell-powerprotect-data-domain-multiple-vulnerabilities
    and https://advisories.ncsc.nl/advisory?id=NCSC-2026-0460. Not in the store.'
- ref: Juniper JSA112183 Session Smart Router and Conductor
  disposition: drop (outside window)
  note: CVE-2026-103406 (Conductor AutomatedProvisioner, unauthenticated remote root command execution, CVSS 9.8) and CVE-2026-103409 (Router, unauthenticated administrative access through an insecure endpoint,
    only before onboarding to Mist or Conductor, CVSS 9.8); fixed in 7.0.5, 7.1.7, 7.2.3; no workaround; CVE records dated 2026-10-28, NCSC-NL NCSC-2026-0462 of 2026-10-30; the Juniper bulletin page is
    an unreadable SPA. No exploitation. Not in the store.
- ref: Canonical LXD and MicroCloud CVE-2026-112816
  disposition: drop (outside window)
  note: Critical authentication bypass of the HTTPS API (an intermediate certificate in the chain lets an attacker authenticate as any trusted client whose public certificate they hold); fixed LXD 6.10.1,
    5.21.9, 5.0.11, 4.0.15 and MicroCloud 3.4.1, 2.1.5 on 2026-10-29; Canonical post 2026-10-28, NCSC-NL relay 2026-11-02. No exploitation.
- ref: HPE Networking VIA client HPESBNW05173
  disposition: drop
  note: Nine CVEs, maximum 8.8 (CVE-2026-95722 local privilege escalation), client-side, fixed 4.7.9.
- ref: Arista Security Advisory 0203 (CVE-2026-98432 kernel) and 0204
  disposition: note for the kernel entry
  note: '0203 (2026-11-02, revision 1.1 2026-11-03): only Arista NDR up to 5.4.11 is affected, because exploitation needs MPTCP enabled; EOS, CloudVision, VeloCloud and Wi-Fi AP lines are listed not affected,
    NetVisor under triage; not aware of exploitation. Optional improvement record on 2026-10-31/cve-2026-98432-linux-kernel-tcp-uaf-mptcp-remote-root. 0204 is an advance notice of bulk advisories on 2026-11-10
    for EOS, Wi-Fi AP and DCA appliance software.'
- ref: PHP2Shell wave (NCSC-NL tracker, vendor notices)
  disposition: covered
  note: 'Tracker rows since 2026-11-02 13:00 +0100: phpMyFAQ RC image fixed, Broadcom CASMA vulnerable (covered by the Broadcom entry), Virtualmin and WooCommerce runtime-dependent, Cisco ISE Portal Builder
    cloud fix; no new vendor estate. PHP flaws are in KEV since 2026-10-26.'
- ref: NCSC-CH CSH post 13128 (Progress WS_FTP Server, 2026-11-02)
