- source_id: connectwise-trust-center
  reason: 'https://www.connectwise.com/company/trust/advisories and /security-bulletins: direct HTTP 403, trafilatura no readable body, jina relayed the upstream block, WebFetch 403. https://status.connectwise.com/
    reads with extract (newest security incident 2026-10-16, already covered by the 2026-10-18 entry). No ConnectWise item surfaced in the CCCS feed through 2026-11-03.'
- source_id: bsi-de
  reason: 'recipe change: `bsi-rss` returned only 2026-11-03 10:24Z onward on this run (250 items, flooded by about 60 kernel and Go UPDATE rows), so it did not reach the window start. Working recipe: `url
    --direct https://wid.cert-bund.de/.well-known/csaf/white/changes.csv` (date-granular, lists ids by last change), then `bsi-csaf WID-SEC-2026-<n>` per id for the titles of ids above 4243; ran 49 ids
    in parallel without error.'
- source_id: vulncheck
  reason: '`extract https://www.vulncheck.com/blog` returns the page boilerplate with a 2022 date and no post list; WebFetch of the listing returns the twelve newest posts with dates and hrefs, and `extract
    <post URL>` reads a post in full (verified on the CWP2Shell post). The 2026-11-03 note ''extract now reads the VulnCheck blog directly'' holds for posts, not the listing.'
- source_id: cisco-psirt
  reason: 'not in this slice but the decisive in-window revision (ESA cisco-sa-esa-inj, revision 1.2 of 2026-11-03) was found only because the PSIRT feed was swept as an extra: the feed ''published'' stamp
    moves with revisions and the advisory page carries the revision table; the entry that cites it had updates: []. Recommend keeping cisco-psirt in the S1 rotation after every Cisco bundle and on revisions.'
- source_id: cert-eu
  reason: 'quiet, not a failure: `cert-eu recent 30` newest item 2026-018 of 2026-10-23.'
- source_id: chrome-releases
  reason: the direct posts/default feed answers 302 (cross-host); `feed https://feeds.feedburner.com/GoogleChromeReleases 14` reads and `extract` reads each post after rewriting http:// to https:// (matches
    the record's note).
