  summary: 'HPE Networking released bulletin HPESBNW05172 on 2026-11-03 for the Fabric Composer (AFC) data-centre fabric controller: 46 CVEs, all found by HPE''s internal research, fixed in AFC 7.4.1 (for
    7.4.0 and below) and 7.3.5 (for 7.3.4 and below); end-of-maintenance branches are presumed affected and not patched. Thirteen carry network attack vector with no privileges required. The top three are
    CVE-2026-95731 (CVSS 9.8, hardcoded password in the command-line interface giving an unauthenticated remote attacker administrative access), CVE-2026-95732 (9.6, authentication bypass in the underlying
    operating system, adjacent attacker, arbitrary code execution) and CVE-2026-95733 (9.6, hardcoded credentials, adjacent arbitrary code execution). HPE says it is not aware of public discussion or exploit
    code and ''strongly urges'' patching; the vendor workaround is to restrict the CLI and web management interfaces to a dedicated layer-2 segment or VLAN and control them with layer-3 firewall policy.
    A second bulletin the same day, HPESBNW05173 for the Virtual Intranet Access client (nine CVEs, highest 8.8, fixed in 4.7.9), is a local-privilege and client-side set and is not carried here. The store
    already holds an earlier Fabric Composer and ArubaOS-CX bundle (2026-09-04), so this is a new bulletin on the same controller.'
