  summary: Zyxel published two advisories on 2026-11-03. The first covers CVE-2026-107441, an out-of-bounds write in the CGI program of the GS1900 series switch firmware that lets an unauthenticated LAN-based
    attacker execute OS commands through a crafted HTTP request; the CVE record scores it CVSS 3.1 8.8 (AV:A/AC:L/PR:N) and Binarly reported it. Ten models are listed, GS1900-8, -8HP, -10HP, -16, -24, -24E,
    -24EP, -24HPv2, -48 and -48HPv2, each at or below its own '2.90(AAxx.2)C0' build with a '2.90(AAxx.3)C0' build as the fix. The second covers CVE-2026-76955, a buffer overflow in the zdp_wtp binary of
    certain access points (NWA/WAX/WBE/IAP families), FWA7 units and the USG LITE 60AX that lets a LAN-based attacker escalate privileges (CVSS 8.8 per the CVE record); fixes exist per model, a hotfix 'upon
    request' covers WAC500H, and the USG LITE 60AX updates from the cloud. Neither advisory reports exploitation. The store's September entry on GS1900 CVE-2026-7273 records a pre-auth stack overflow in
    the same CGI login handler class that reached CISA KEV after GreyNoise observed a Red Heron-linked actor taking configuration data and hashed root credentials from 996 switches; the new flaw is a distinct
    CVE and is rated adjacent rather than network.
