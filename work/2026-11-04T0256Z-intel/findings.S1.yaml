- title: 'CVE-2026-76461 Cisco Secure Email Gateway: Cisco re-released the 15.5.5-014 fix on 2026-10-31 ''in light of new information related to exploit code that is available online'' and revised the advisory
    on 2026-11-03'
  sources:
  - url: https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-esa-inj-2bLVGmhX
    publisher: Cisco PSIRT (cisco-sa-esa-inj-2bLVGmhX, revision 1.2)
    date: '2026-11-03'
    role: primary
  discovery_trace: 'first seen at: cisco-psirt feed (extra sweep; not in S1 slice), URL https://sec.cloudapps.cisco.com/security/center/psirtrss20/CiscoSecurityAdvisory.xml listed ''Cisco Secure Email Gateway
    SQL Injection Vulnerability'' dated 2026-11-03 17:05 -> primary: Cisco PSIRT advisory page, URL https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-esa-inj-2bLVGmhX
    (fetched with extract; revision table and Fixed Releases read in full). Independent corroboration searched (WebSearch x2) and not found: no outlet or CERT reports the 2026-10-31 re-release or the exploit-code
    statement yet.'
  summary: Cisco's advisory for CVE-2026-76461 (unauthenticated SQL injection in Secure Email Gateway email parsing reaching root command execution, exploited since September 2026 and in CISA KEV since
    2026-09-14) gained revision 1.2 on 2026-11-03, 'Updated information related to Release 15.5.5-014 in the Fixed Releases table'. The Fixed Releases footnote states that, in light of new information related
    to exploit code that is available online, Cisco released an updated version of the fix contained in Release 15.5.5-014 on 2026-10-31. Cisco does not say what the first build missed. Administrators on
    the 15.5 branch who applied 15.5.5-014 before 2026-10-31 are told to run the CLI command retroscannerstatus and confirm that the Cisco Retro Remediation Engine reports version 4.0.2 or later. Release
    16.5.0-780 is stated to address the flaw regardless of the Retro Remediation Engine version, and the 16.0 branch fix remains 16.0.4-302. Cisco still lists no workaround and repeats its guidance to restore
    compromised physical and virtual appliances from a known-good build and to restore every member of a cluster when one is compromised, because the cluster SSH keys can be read from a compromised member.
    The claim that exploit code is available online is Cisco's alone; no public proof of concept or independent report was found in this run.
