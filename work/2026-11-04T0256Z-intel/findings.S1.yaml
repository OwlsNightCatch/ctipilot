    source_url: https://www.vulncheck.com/blog/control-web-panel-pre-auth-module-dispatch-rce
  - quote: Control Web Panel (CWP) before webpanel_version 1.16 contains a path traversal vulnerability in services/users/index.php that allows attackers to include arbitrary local PHP files by supplying
      an unsanitized module name parameter concatenated directly into an include path.
    attribution: ENISA EUVD (VulnCheck as CNA)
    source_url: https://euvd.enisa.europa.eu/vulnerability/EUVD-2026-115227
  extended_notes: 'Confidence MEDIUM because the technical claims are VulnCheck''s alone (discoverer and CNA); the vendor changelog independently shows user-panel API hardening in 1.27 (SQL injection in
    token validation fixed), 1.29 (database restore and backup start now require a session) and 1.30.1 but names no CVE, and the EUVD record is derived from the CNA record. Exposure: the user panel port
    2083 (and the admin panel) reachable from the internet; the CWP version is shown in the admin panel and in the vendor changelog numbering (webpanel_version). Builds before 1.12 are reachable unauthenticated
    from one account name; builds before 1.29 allow any hosting account to reach root. Detection concepts from the write-up: web-server access logs on the user-panel port for requests to an account''s panel
    root carrying a module parameter with traversal sequences, unauthenticated POSTs to the PHP-ini editor or protected-directory modules that return a redirect while the action runs, new PHP files in world-writable
    temporary paths, and requests to the loopback user API originating from hosting-user processes; post-patch, check for unexpected PHP files and new accounts, because a hosting-user foothold reads the
    account list and every vhost map. Hardening: upgrade to 1.30.1 (vendor changelog) or at least 1.29 and keep the panel ports off the open internet where the hosting model allows; the vendor changelog
    for 1.29 also reports that its ModSecurity OWASP rule package never blocked and that servers already using it must switch blocking on. No exploitation reported at publication; VulnCheck''s own history
    of the earlier CVE-2025-48703 (KEV 2025-11-04, mass exploitation within days of public exploit code) is the reason to treat the public write-up as imminent-exploitation profile.'
