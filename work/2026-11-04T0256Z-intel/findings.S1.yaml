    source_url: https://trust.barracuda.com/security/pre-authentication-authorization-bypass-command-injection
  - quote: The vendor advisory lists the authentication requirement as "administrative access," although it describes CVE-2026-116606 as a pre-authentication bypass.
    attribution: NCSC Switzerland / GovCERT.ch
    source_url: https://security-hub.ncsc.admin.ch/#/posts/13144
  - quote: All versions of the Email Security Gateway (ESG).
    attribution: Barracuda Campus
    source_url: https://documentation.campus.barracuda.com/wiki/spaces/BSFv51/pages/963739728
  extended_notes: 'Exposure: the Email Security Gateway reports its firmware under Advanced > Firmware Update; the appliance must be on 9.4.0.029 or later per Barracuda (9.4.0.030 per the CVE record), appliances
    below 9.1 need a two-step update, and Barracuda tells customers who turned automatic patching off to switch it back on. The risk Barracuda and NCSC-CH name is an internet-reachable administrative interface.
    Detection (inference from the CVE-record mechanism, not a vendor statement): administrative-interface access logs for unauthenticated requests to the configuration import or restore function, unexpected
    configuration restores, and changes to the timezone setting followed by root-owned child processes; Barracuda publishes no indicators. Hardening named by the vendor: restrict the administrative interface
    to trusted internal networks, apply network access controls, re-enable automatic patching. Classification suggestion: reliability A (vendor advisory plus national authorities), credibility 2 (no exploitation
    or independent technical analysis yet). Barracuda''s patch table and the Campus page disagree on the gateway''s fixed build (9.4.0.029 vs 9.4.0.030); flag in the entry rather than choosing one. The
    CNA is Mandiant, which hints at an incident-response origin, but no source says how the flaws were found.'
