  note: Relays Progress's bulletin (CVE-2026-84295 CVSS 10.0 and five further critical rows, fixed 2024.0.7 and 2025.0.4); exploitation status 'UNKNOWN'; the store entry 2026-10-31/progress-ws-ftp-server-cve-2026-84295-unauth-cvss-10
    says no exploitation found; the post is optional corroboration only.
