  summary: 'CISA added CVE-2026-119977, the WordPress core time-of-check time-of-use race that lets an unauthenticated attacker reach the staged installer and execute code on the server during a full-package
    core update, to its Known Exploited Vulnerabilities catalogue on 2026-11-03 with a due date of 2026-11-06 and the forensic-triage flag set. CISA''s alert states the listing is based on evidence of active
    exploitation but publishes no victim count, actor or technique detail, and the catalogue marks ransomware use as unknown. ENISA''s EUVD record EUVD-2026-114575 (EPSS 0.6 as published there) shows exploitedSince
    2026-11-03, and the Canadian Cyber Centre relayed the KEV addition the same day. This replaces the earlier position in the covered entry, which rested on Wordfence''s report of more than 18,500 probing
    requests in the first 21 hours and Patchstack''s view that the race is impractical to win; no source describes a successful compromise, and CISA''s reading of the evidence is not public. Affected: WordPress
    4.7.0 to 7.1.3; fixed in 7.1.4 and the backport of each branch down to 4.7.39 (7.0.8, 6.9.11, 6.8.12 and so on). The exposure condition is a web-reachable wp-content/upgrade/ directory during a full-package
    core update, automatic updates included.'
