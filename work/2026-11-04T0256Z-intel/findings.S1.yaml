    URL https://security-hub.ncsc.admin.ch/#/posts/13144 -> primary: Barracuda Trust Center, URL https://trust.barracuda.com/security/pre-authentication-authorization-bypass-command-injection -> pivot:
    Barracuda Campus ESG article https://documentation.campus.barracuda.com/wiki/spaces/BSFv51/pages/963739728 (fixed firmware), BleepingComputer https://www.bleepingcomputer.com/news/security/barracuda-warns-of-critical-flaws-allowing-root-access-to-devices/
    (patch IDs per product), CCCS AV26-1112, BSI WID-SEC-2026-4295 (bsi-csaf), EUVD search for the CVE ids (CNA records by Mandiant); confirmed absent from prior_coverage.json'
  summary: 'Barracuda published an advisory on 2026-11-02 for two flaws that, chained, give root on its security appliances: CVE-2026-116606, a pre-authentication authorization bypass in the Email Security
    Gateway (CVSS 9.3), and CVE-2026-111560, an OS command injection (CVSS 8.6) that affects the Email Security Gateway, Load Balancer ADC, Message Archiver, WAF Control Center, Web Application Firewall
    and Web Security Gateway. The CVE records, issued with Mandiant as numbering authority, describe the first as an unauthenticated remote call to the gateway''s configuration-import function that restores
    a crafted backup archive and so changes the appliance''s global configuration, and the second as shell metacharacters in the timezone configuration field that an authenticated administrator can use
    to run commands as root. Barracuda says exploitation needs access to the administrative interface and tells customers to restrict that interface to trusted internal networks; NCSC-CH rates the current
    exploitation status unknown, and no source reports attacks. The advisory''s own table lists ''administrative access'' as the authentication requirement for both flaws while calling the first one a pre-authentication
    bypass, a contradiction NCSC-CH flags. Fixed firmware: Email Security Gateway 9.4.0.029 or later per Barracuda Campus, while the CVE record says versions earlier than 9.4.0.030 are affected; the two
    do not agree and the vendor has not reconciled them in the sources read. Patch identifiers are BNSF-40425 (9.4.017 and later) and BNSF-40430 (earlier) for the gateway, BNADC-16586 for ADC and WAF, BNMA-32468,
    BNWF-60060 and BNYF-24789 for Message Archiver, WAF Control Center and Web Security Gateway; many appliances receive patches automatically. Barracuda''s gateway was the target of the UNC4841 espionage
    campaign in 2022 and 2023, in which, per BleepingComputer''s recap of Mandiant''s findings, almost a third of the hacked appliances belonged to government agencies; nothing in the 2026 sources links
    these flaws to that actor.'
  region_nexus: 'Switzerland: NCSC-CH published a hub advisory on 2026-11-03; Barracuda appliances are common mail and web perimeter devices in cantonal and communal networks'
