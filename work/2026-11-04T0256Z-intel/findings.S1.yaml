  - quote: Updated information related to Release 15.5.5-014 in the Fixed Releases table.
    attribution: Cisco PSIRT
    source_url: https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-esa-inj-2bLVGmhX
  extended_notes: 'Delta against the entry: the entry (priority critical, KEV, immediate_action) tells readers to upgrade to 15.5.5-014, 16.0.4-302 or 16.5.0-780 and carries no changelog record. What changed:
    the 15.5 target is now conditional on the Retro Remediation Engine version (verify with retroscannerstatus, version 4.0.2 or later); 16.5.0-780 is the unconditional target and Cisco already recommends
    migrating to it. Exposure check for defenders: the version is shown in the appliance CLI; the exploitation indicator Cisco documents is in mail_logs (COPY ... TO PROGRAM statements), and Cisco warns
    that evidence may be removed because exploitation yields root, so cross-check firewall and network logs outside the device. Candidate actions[] line (do-now, derived from this finding): on every Secure
    Email Gateway on 15.5.x that was patched before 2026-10-31, run retroscannerstatus, confirm Retro Remediation Engine 4.0.2 or later, otherwise apply the updated 15.5.5-014 build or move to 16.5.0-780.
    Suggested Admiralty: reliability A (vendor PSIRT for its own product), credibility 2 (exploit-code claim uncorroborated). NCSC-NL''s advisory NCSC-2026-0368 is still at version 1.0.0; no relay of the
    revision by another authority was found in this run.'
