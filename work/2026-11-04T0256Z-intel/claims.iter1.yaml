    text: "OPSSHIELD says that on 2026-11-02 an unidentified attacker used compromised credentials to reach its update distribution infrastructure and distributed a malicious script through the cPGuard update channel in versions 5.88.12 to 5.88.19; the vendor detected the attack within 12 hours and stopped distribution, and because update checks run at intervals some servers may not have run the script ("
    urls: ["https://opsshield.com/notice/cpguard-update-channel-compromise.html"]
