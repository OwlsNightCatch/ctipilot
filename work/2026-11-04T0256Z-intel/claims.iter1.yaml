  - claim_id: 3969281d76
    entry: 2026-09-15/cve-2026-76461-cisco-secure-email-gateway-sqli-root-rce
    surface: "body"
    kind: cited
    text: "Notably, Cisco attributes discovery of this bundle to \"internal security testing using existing testing processes as well as frontier AI models\" ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-hardening-esa-dfCrfXkm"]
  - claim_id: 7846bfc2ee
    entry: 2026-09-15/cve-2026-76461-cisco-secure-email-gateway-sqli-root-rce
    surface: "body"
    kind: uncited
    text: "CVE-2026-76461 (CVSS 9.8) affects every Cisco Secure Email Gateway, physical and virtual, regardless of configuration; Cisco confirms Secure Email and Web Manager and Secure Web Appliance are not affected by this specific flaw."
  - claim_id: 5efedc6fbf
    entry: 2026-09-15/cve-2026-76461-cisco-secure-email-gateway-sqli-root-rce
    surface: "body"
    kind: uncited
    text: "There is no workaround; the only remediation is upgrading to AsyncOS 15.5.5-014 (re-released on 2026-10-31), 16.0.4-302, or 16.5.0-780, the release Cisco \"strongly recommends\" migrating to."
  - claim_id: eb3c2589bc
    entry: 2026-09-15/cve-2026-76461-cisco-secure-email-gateway-sqli-root-rce
    surface: "body"
    kind: uncited
    text: "Two details in Cisco's own wording raise this above a routine emergency patch."
  - claim_id: a6cef06859
    entry: 2026-09-15/cve-2026-76461-cisco-secure-email-gateway-sqli-root-rce
    surface: "body"
    kind: uncited
    text: "The same day, Cisco shipped a companion \"Security Hardening Release\" advisory for the identical product line, bundling five further internally-discovered vulnerabilities that Cisco groups by CWE class rather than by individual flaw: a path-traversal grouping (CVE-2026-76440, CVSS 9.8), an improper-access-control grouping (CVE-2026-76441, CVSS 9.8), an uncontrolled-resource-consumption grouping (CVE-2026-20353, CVSS 9.8), a second injection-class grouping (CVE-2026-76443, CVSS 9.8, explicitly distinct from the exploited CVE-2026-76461 despite sharing the same top-level weakness class) and an input-validation grouping (CVE-2026-76442, CVSS 7.5)."
  - claim_id: 1d0aae0890
    entry: 2026-09-15/cve-2026-76461-cisco-secure-email-gateway-sqli-root-rce
    surface: "body"
    kind: uncited
    text: "Cisco's own table states that \"the CVSS score that is assigned to each CVE ID represents the maximum potential severity of the single most impactful underlying vulnerability within that specific CWE category,\" so the four identical 9.8 scores reflect an assigned ceiling per grouping rather than four independently-confirmed critical bugs."
  - claim_id: 945b2c6488
    entry: 2026-09-15/cve-2026-76461-cisco-secure-email-gateway-sqli-root-rce
    surface: "body"
    kind: uncited
    text: "Unlike the exploited flaw, this bundle also affects Secure Email and Web Manager, and Cisco states none of the five is known to be exploited or publicly disclosed elsewhere."
  - claim_id: 000adab53e
    entry: 2026-09-15/cve-2026-76461-cisco-secure-email-gateway-sqli-root-rce
    surface: "body"
    kind: uncited
    text: "Administrators who upgrade against the exploited CVE close all six CVEs with the same action, since both advisories share identical fixed releases for Secure Email Gateway."
  - claim_id: e6244d25f5
    entry: 2026-09-15/cve-2026-76461-cisco-secure-email-gateway-sqli-root-rce
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** treat every internet-facing Cisco Secure Email Gateway as potentially already compromised until patched and checked; Cisco's own detection guidance and the KEV listing both signal this is being actively used against real environments right now, not a theoretical risk."
  - claim_id: e8bdbc733e
    entry: 2026-09-15/cve-2026-76461-cisco-secure-email-gateway-sqli-root-rce
    surface: "body"
    kind: derived
    text: "**Triage:** Cisco's own discriminator is the mail_logs pattern `COPY.*TO PROGRAM`; any hit is evidence of attempted or successful SQL-injection exploitation and warrants full incident response, not just a patch, since a successful hit implies root-level compromise and possible log tampering."
