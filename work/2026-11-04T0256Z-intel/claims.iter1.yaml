    entry: 2026-11-04/threeam-uk-school-veeam-rogue-domain-admins-new-ad-trusts
    surface: "headline"
    kind: frontmatter
    text: "Bitdefender: a 3AM affiliate joined a school estate's AD domains with new trusts after stealing Veeam credentials"
  - claim_id: ac7a06f761
    entry: 2026-11-04/threeam-uk-school-veeam-rogue-domain-admins-new-ad-trusts
    surface: "summary"
    kind: frontmatter
    text: "Bitdefender MDR describes a September 2026 intrusion by a 3AM ransomware affiliate into a UK school estate that began as several unconnected Active Directory domains: a modified public Veeam script decrypted credentials stored on three backup servers, the attacker created two backdoor domain-administrator accounts, joined three domains with new two-way trusts within about three hours, removed EDR agents and encrypted machines. Initial access is unknown, every attacker action came from an unmanaged internal host, and Bitdefender reads the 40 to 101 second retry cadence as a model-driven loop, flagged as its own interpretation; it says a new trust between domains is a rare change that is cheap to alert on."
  - claim_id: e9c2eb75d7
    entry: 2026-11-04/threeam-uk-school-veeam-rogue-domain-admins-new-ad-trusts
    surface: "body"
    kind: cited
    text: "Bitdefender MDR attributes the intrusion to a 3AM (ThreeAM) ransomware affiliate on the encryptor build and its command-line pattern; the target was a school estate in the UK whose domains began as separate Active Directory environments, and initial access is unknown ("
    urls: ["https://businessinsights.bitdefender.com/3am-ransomware-hybrid-ai-attack"]
  - claim_id: f895daf0f6
    entry: 2026-11-04/threeam-uk-school-veeam-rogue-domain-admins-new-ad-trusts
    surface: "body"
    kind: cited
    text: "In September 2026 the attacker first took credentials from the backup software: a modified copy of a public script read the credentials stored in Veeam's databases on three backup servers and decrypted them with the Windows Data Protection API ("
    urls: ["https://businessinsights.bitdefender.com/3am-ransomware-hybrid-ai-attack"]
  - claim_id: 709366d762
    entry: 2026-11-04/threeam-uk-school-veeam-rogue-domain-admins-new-ad-trusts
    surface: "body"
    kind: cited
    text: "It then worked with built-in tools (PowerShell, WMI, reg, netsh, rundll32) and a few public ones (an Impacket-like remote-execution tool, Mimikatz), enumerated domain trusts from a domain controller, searched SYSVOL logon scripts for the names and subnets of other schools, created two backdoor domain-administrator accounts, joined three separate domains with two-way trusts within about three hours, removed EDR agents and encrypted machines with a Rust-based encryptor ("
    urls: ["https://businessinsights.bitdefender.com/3am-ransomware-hybrid-ai-attack"]
  - claim_id: 93902335da
    entry: 2026-11-04/threeam-uk-school-veeam-rogue-domain-admins-new-ad-trusts
    surface: "body"
    kind: cited
    text: "Every attacker action came from an unmanaged internal host with no agent, so the automation itself was never seen, and Bitdefender says it could not document anything about a language model ("
    urls: ["https://businessinsights.bitdefender.com/3am-ransomware-hybrid-ai-attack"]
  - claim_id: dc23e034c0
    entry: 2026-11-04/threeam-uk-school-veeam-rogue-domain-admins-new-ad-trusts
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** alert on any new domain trust and on additions to the domain-administrator groups, restrict who can read the backup software's credential store and from where, and bring unmanaged internal hosts under an endpoint agent or cut their access to domain controllers and backup servers ("
    urls: ["https://businessinsights.bitdefender.com/3am-ransomware-hybrid-ai-attack"]
  - claim_id: f53909634d
    entry: 2026-11-04/threeam-uk-school-veeam-rogue-domain-admins-new-ad-trusts
    surface: "body"
    kind: uncited
    text: "Bitdefender's reading, which it calls interpretation and not a finding, is that a model drove part of the work: commands call the Veeam web interface on a port and with a login method that do not match the vendor documentation, output is self-labelled, scripts carry numbered revisions, and retries arrive 40 to 101 seconds apart whatever the size of the change, while a new task takes minutes."
  - claim_id: c5f884cd24
    entry: 2026-11-04/threeam-uk-school-veeam-rogue-domain-admins-new-ad-trusts
    surface: "body"
    kind: uncited
    text: "Bitdefender calls this one case, not a trend, and expects such hybrids to become more common in 2027."
  - claim_id: 3ef1bab244
    entry: 2026-11-04/threeam-uk-school-veeam-rogue-domain-admins-new-ad-trusts
    surface: "body"
    kind: derived
    text: "**Exposure:** a Windows estate that runs Veeam Backup & Replication and has several Active Directory domains or a flat network that an unmanaged internal host can reach; the unmanaged host is the gap, because it ran no agent and sat outside Bitdefender's visibility."
  - claim_id: 9de2ed8492
    entry: 2026-11-04/threeam-uk-school-veeam-rogue-domain-admins-new-ad-trusts
    surface: "body"
    kind: derived
    text: "**Detection:** in directory-service change events, new trust relationships between domains and new domain-administrator group members, which Bitdefender calls a rare change that is cheap to alert on; in backup-server logs, Veeam web-interface calls and credential-store reads from hosts that are not backup administrators'; in endpoint telemetry, LSASS access and the same command re-issued with small edits at a steady cadence; in authentication logs, unmanaged hosts authenticating to domain controllers."
