    surface: "summary"
    kind: frontmatter
    text: "Barracuda's advisory of 2026-11-02 covers CVE-2026-116606, a pre-authentication authorization bypass in the Email Security Gateway (CVSS 9.3), and CVE-2026-111560, a command injection (8.6) that also affects the Load Balancer ADC, Message Archiver, WAF Control Center, Web Application Firewall and Web Security Gateway; chained, they give root, and Barracuda says exploitation needs access to the administrative interface. Patches are out and many appliances receive them automatically; NCSC Switzerland rates exploitation unknown and no source reports attacks. Barracuda's own pages disagree on the fixed gateway build (9.4.0.029 or 9.4.0.030)."
