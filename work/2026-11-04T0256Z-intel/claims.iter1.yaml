    entry: 2026-10-30/wordpress-core-7-1-4-unauthenticated-upgrade-window-rce-race
    surface: "summary"
    kind: frontmatter
    text: "WordPress 7.1.4 of 2026-10-28 fixes a weakness in the core upgrade process that lets an unauthenticated attacker reach the staged installer and run code on the server during a full-package core update, in versions 4.7 to 7.1.3, with backports for every branch down to 4.7. CISA added CVE-2026-119977 to its Known Exploited Vulnerabilities catalog on 2026-11-03; Wordfence reports more than 18,500 probing requests in the first 21 hours, while Patchstack calls the race hard to win and says it needs a web-reachable staging directory."
