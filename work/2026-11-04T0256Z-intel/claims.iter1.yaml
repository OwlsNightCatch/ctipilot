    text: "{\"id\": \"CVE-2026-76442\", \"cvss\": \"7.5\", \"status\": [\"patch-available\"], \"affected\": \"Cisco Secure Email Gateway and Secure Email and Web Manager, all configurations, from the September 2026 internal hardening review (not reported exploited)\", \"fixed\": \"Gateway: 15.5.5-014 / migrate off 16.0 / 16.5.0-780. Web Manager: 15.5.5-006 / migrate off 16.0 / 16.5.0-429\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
  - claim_id: 55edca3627
    entry: 2026-09-15/cve-2026-76461-cisco-secure-email-gateway-sqli-root-rce
    surface: "body"
    kind: cited
    text: "Cisco's own advisory names the mechanism plainly: insufficient validation in the email-parsing logic of AsyncOS lets an unauthenticated remote attacker send a single crafted email containing SQL statements through the device, and \"a successful exploit could allow the attacker to execute arbitrary SQL statements, leading to command execution with root privileges on the underlying operating system\" ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-esa-inj-2bLVGmhX"]
  - claim_id: 24da082762
    entry: 2026-09-15/cve-2026-76461-cisco-secure-email-gateway-sqli-root-rce
    surface: "body"
    kind: cited
    text: "First, Cisco states the vulnerability \"was found during the resolution of a Cisco TAC support case\" (meaning it surfaced from a real customer's compromise investigation, not internal fuzzing), and that it has already directly contacted Secure Email Cloud customers on whose devices indicators of compromise were found, having upgraded all Cloud instances itself ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-esa-inj-2bLVGmhX"]
  - claim_id: fd614f05db
    entry: 2026-09-15/cve-2026-76461-cisco-secure-email-gateway-sqli-root-rce
    surface: "body"
    kind: cited
    text: "Second, CISA added the CVE to its Known Exploited Vulnerabilities catalog the same day, and flagging it for Forensic Triage Requirements ("
    urls: ["https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"]
  - claim_id: 6899b0769b
    entry: 2026-09-15/cve-2026-76461-cisco-secure-email-gateway-sqli-root-rce
    surface: "body"
    kind: cited
    text: "); NCSC-NL's own advisory relays the same exploitation claim: \"Cisco reports that successful exploitation of this vulnerability has been observed\" (translated from Dutch) ("
