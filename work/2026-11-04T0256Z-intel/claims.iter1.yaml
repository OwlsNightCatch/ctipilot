    entry: 2026-11-04/cpguard-update-channel-hijacked-backdoor-root-secrets
    surface: "headline"
    kind: frontmatter
    text: "cPGuard update channel hijacked on 2 Nov: backdoor and root secrets taken; update to 5.88.25, then rotate credentials"
  - claim_id: 2fa54c4c36
    entry: 2026-11-04/cpguard-update-channel-hijacked-backdoor-root-secrets
    surface: "summary"
    kind: frontmatter
    text: "OPSSHIELD, the vendor of the cPGuard security suite for Linux web servers, says an unidentified attacker used compromised credentials to reach its update distribution infrastructure on 2026-11-02 and pushed a malicious script through the update channel in versions 5.88.12 to 5.88.19; the script installed a backdoor shell and collected password hashes, root database configuration, root shell history and root SSH files, uploading them to the vendor's licensing server for the attacker to retrieve. Version 5.88.25 removes the backdoor but not the exposure of what was copied, so any server whose update history shows an affected version needs its credentials rotated. The vendor's own estimate is 32 retrieved files, a preliminary lower bound, while a spokesperson told BleepingComputer that 2,946 servers were affected."
  - claim_id: b0a9016ad7
    entry: 2026-11-04/cpguard-update-channel-hijacked-backdoor-root-secrets
    surface: "actions[0]"
    kind: frontmatter
    text: "On every Linux server that runs cPGuard, run cpgcli update --start and confirm 5.88.25 or later with cpgcli --version, then check /opt/cpguard/logs/install_log for 'Successfully updated' entries from 5.88.12 through 5.88.19 and, for any hit, reset root and local passwords from a trusted environment and rotate the database passwords, cloud keys and SSH keys that root's shell history and /root/.ssh hold."
  - claim_id: 67efad9d93
