    kind: cited
    text: "**Detection:** in endpoint file-event telemetry, a version-manager or interpreter binary deleted, renamed and re-linked inside a package-manager directory followed by a shell spawned from it, which is the sequence Binance describes for pyenv in the Homebrew installation ("
