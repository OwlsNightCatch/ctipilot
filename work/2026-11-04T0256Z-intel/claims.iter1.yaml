    text: "**Defender takeaway:** update every cPGuard server to 5.88.25 or later and treat any server that installed an affected version as compromised for credential purposes even after the update: reset root and all other password-enabled local accounts from a trusted environment, rotate database passwords, S3 keys, cloud tokens and secrets recorded in root's shell history, and replace the SSH private keys under `/root/.ssh` and remove the old public keys from every system that trusts them; the vendor does not recommend a full rebuild as a routine response and calls that assessment provisional ("
    urls: ["https://opsshield.com/notice/cpguard-update-channel-compromise.html"]
  - claim_id: fed3fc7a92
    entry: 2026-11-04/cpguard-update-channel-hijacked-backdoor-root-secrets
    surface: "body"
    kind: derived
    text: "**Detection:** in the install log, the affected version entries of 2026-11-02; in process-creation and file telemetry, the updater running a downloaded shell script and a hidden staging directory with an archive appearing in the world-writable temporary directory; in egress and licensing-server logs, uploads from the host outside its normal licence checks; in authentication logs, root logins or SSH key use from new sources after 2026-11-02."
