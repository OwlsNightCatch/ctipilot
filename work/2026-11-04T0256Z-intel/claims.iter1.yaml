claims:
  - claim_id: 80947e56e6
    entry: 2026-09-15/cve-2026-76461-cisco-secure-email-gateway-sqli-root-rce
    surface: "summary"
    kind: frontmatter
    text: "Cisco disclosed CVE-2026-76461 (CVSS 9.8) on 2026-09-14: an unauthenticated attacker who sends a single crafted email containing SQL statements to a Cisco Secure Email Gateway can execute arbitrary OS commands as root. Cisco confirms active exploitation and found the flaw while investigating a customer's compromise; there is no workaround. CISA added it to its Known Exploited Vulnerabilities catalog the same day. Cisco simultaneously shipped a hardening release fixing five further internally-found vulnerabilities in the same product, none reported exploited. On 2026-10-31 Cisco re-released the 15.5.5-014 fix in light of new information related to exploit code available online, so a 15.5 appliance patched earlier needs a check of its Retro Remediation Engine version."
  - claim_id: e3bcdd9474
    entry: 2026-09-15/cve-2026-76461-cisco-secure-email-gateway-sqli-root-rce
    surface: "immediate_action"
    kind: frontmatter
    text: "Patch every Cisco Secure Email Gateway now: unauthenticated root RCE via a single email, already exploited: A remote, unauthenticated attacker gains root on the appliance by sending it one crafted email; there is no workaround and no mitigation short of upgrading. Cisco itself found this investigating a live customer compromise, and CISA lists it as exploited. Upgrade every physical and virtual Secure Email Gateway appliance today and hunt mail_logs for the exploitation pattern before assuming a device is clean."
  - claim_id: 967b34995b
    entry: 2026-09-15/cve-2026-76461-cisco-secure-email-gateway-sqli-root-rce
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade every Cisco Secure Email Gateway appliance (physical and virtual) to AsyncOS 15.5.5-014 as re-released on 2026-10-31 (on an appliance that took the earlier build, confirm with retroscannerstatus that Retro Remediation Engine runs 4.0.2 or later), 16.0.4-302, or 16.5.0-780 (Cisco's recommended target) now; the same upgrade also closes the five hardening-release CVEs (CVE-2026-76440, CVE-2026-76441, CVE-2026-20353, CVE-2026-76443, CVE-2026-76442) Cisco shipped the same day."
  - claim_id: 296f50a482
    entry: 2026-09-15/cve-2026-76461-cisco-secure-email-gateway-sqli-root-rce
    surface: "actions[1]"
    kind: frontmatter
    text: "Grep every appliance's mail_logs (and, if clustered, every cluster member's logs) for the pattern \"COPY.*TO PROGRAM\" and cross-check firewall/network logs external to the appliance for unexpected outbound connections; a successful exploit grants root, so an attacker may have removed local log evidence of their own access."
  - claim_id: d652d6da8c
    entry: 2026-09-15/cve-2026-76461-cisco-secure-email-gateway-sqli-root-rce
    surface: "actions[2]"
    kind: frontmatter
    text: "Secure Email Cloud customers should confirm directly with Cisco whether their instance is among those where indicators of compromise were identified; Cisco states it has already proactively contacted affected Cloud customers and upgraded all Cloud instances."
