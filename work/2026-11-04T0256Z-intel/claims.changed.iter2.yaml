  - claim_id: c82ed61e11
    entry: 2026-11-04/cpguard-update-channel-hijacked-backdoor-root-secrets
    surface: "summary"
    kind: frontmatter
    text: "OPSSHIELD's disclosure of 2026-11-03 says an attacker registered as a customer on its billing portal, used crafted requests to the portal's callback pages to run commands on the billing and licensing server, took the keys used to publish updates and shipped a fake cPGuard update for about 70 minutes on 2026-11-02 (02:08 to 03:20 UTC). The update ran as root on about 2,950 customer servers, copied password hashes, root SSH keys, the MySQL root password and root shell history (cloud storage keys on a few) and left a hidden root shell and a scheduled task; about 7,900 billing-portal accounts were exposed as well. The clean update 5.88.26 removes the shell and a follow-up update removes the task, but copied credentials stay usable until rotated."
  - claim_id: a5e4acb7cc
    entry: 2026-11-04/cpguard-update-channel-hijacked-backdoor-root-secrets
    surface: "actions[0]"
    kind: frontmatter
    text: "On every Linux server that ran cPGuard on 2026-11-02, update to the latest version (the disclosure names 5.88.26 as the clean update), confirm that the hidden root shell and the scheduled task the fake update left are gone, then reset root and local passwords from a trusted environment and rotate the root SSH keys, the MySQL root password, any cloud storage keys and every secret in root's shell history; rebuild from a clean backup taken before 1 November any server the vendor tells you the attacker logged in to by hand."
