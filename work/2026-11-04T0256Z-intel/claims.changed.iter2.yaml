  - claim_id: 4e81694eb5
    entry: 2026-11-04/threeam-uk-school-veeam-rogue-domain-admins-new-ad-trusts
    surface: "body"
    kind: derived
    text: "**Detection:** in directory-service change events, new trust relationships between domains and new domain-administrator group members, which Bitdefender calls a rare change that is cheap to alert on; in backup-server logs, Veeam web-interface calls and credential-store reads from hosts that are not backup administrators'; in endpoint telemetry, saves of the SECURITY, SYSTEM or SAM registry hives by any process that is not a known backup or administration job, LSASS access, a Windows Defender exclusion for the temporary directory, and the same command re-issued with small edits at a steady cadence; across hosts, file contents staged into registry values and sent out by HTTP POST to an internal host, which Bitdefender calls an unusual channel and a strong indicator to hunt for, and probe or confirmation artifacts such as a scheduled task named for the probe left on production hosts; in authentication logs, unmanaged hosts authenticating to domain controllers."
