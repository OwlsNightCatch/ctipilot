claims:
  - claim_id: b72b4646a1
    entry: 2026-09-15/cve-2026-76461-cisco-secure-email-gateway-sqli-root-rce
    surface: "summary"
    kind: frontmatter
    text: "Cisco disclosed CVE-2026-76461 (CVSS 9.8) on 2026-09-14: an unauthenticated attacker who sends a single crafted email containing SQL statements to a Cisco Secure Email Gateway can execute arbitrary OS commands as root. Cisco confirms active exploitation and found the flaw while investigating a customer's compromise; there is no workaround. CISA added it to its Known Exploited Vulnerabilities catalog the same day. Cisco simultaneously shipped a hardening release fixing five further internally-found vulnerabilities in the same product; Cisco's hardening advisory says two vulnerabilities from its internal review are known to be exploited, this one and the arbitrary file write CVE-2026-76519. On 2026-10-31 Cisco re-released the 15.5.5-014 fix in light of new information related to exploit code available online, so a 15.5 appliance patched earlier needs a check of its Retro Remediation Engine version."
  - claim_id: f209b1bbf2
    entry: 2026-09-15/cve-2026-76461-cisco-secure-email-gateway-sqli-root-rce
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade every Cisco Secure Email Gateway appliance (physical and virtual) to AsyncOS 15.5.5-014 as re-released on 2026-10-31 (on an appliance that took the earlier build, confirm with retroscannerstatus that Retro Remediation Engine runs 4.0.2 or later), 16.0.4-302, or 16.5.0-780 (Cisco's recommended target) now; 16.0.4-302 closes CVE-2026-76461 only, because the hardening advisory names no fixed 16.0 release, so move a 16.0 appliance to 16.5.0-780 to close the five hardening-release CVEs (CVE-2026-76440, CVE-2026-76441, CVE-2026-20353, CVE-2026-76443, CVE-2026-76442) as well."
