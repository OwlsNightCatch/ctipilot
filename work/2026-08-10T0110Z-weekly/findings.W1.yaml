      calif.io published root-cause analysis and working exploit code on 2026-08-06 for three distinct memory-safety bugs in FreeBSD's CAM Target Layer (CTL) High Availability (HA) mode — the ctl(4) driver's peer-synchronisation feature for iSCSI/FC storage-target clustering. When HA is enabled (kern.cam.ctl.ha_peer configured), the kernel opens a TCP listener on port 999 by default with no authentication of any kind, and treats any peer that connects as a fully trusted controller. FreeBSD-One is an arbitrary kernel read/write via raw kernel-pointer dereference in the DATA channel; FreeBSD-Two abuses a write-only pointer field (original_sc) in the DATAMOVE handler; FreeBSD-Three is a heap overflow in DATAMOVE scatter-gather list copying (a fixed 64-byte buffer with an unchecked entry count). All three reach unauthenticated remote root code execution via a spawned shell, and reliability is aided by GENERIC kernel builds shipping predictable symbol addresses without KASLR. FreeBSD's response, recorded in commit 3c8f8432, was not a code fix but an expanded manpage warning: the vendor's stated position is that the HA interconnect is architecturally a trusted back-channel between storage controllers, that the protocol embeds raw kernel pointers in CTL_MSG_DATAMOVE messages by design, and that closing the hole would require a protocol redesign rather than a bounds check. No CVE identifiers were assigned by either FreeBSD or the researchers. This means every FreeBSD storage-target deployment running CTL HA today carries a permanent, vendor-acknowledged, unauthenticated-root-RCE-capable attack surface with no forthcoming patch — the only available control is the one FreeBSD itself recommends: never expose TCP/999 (or whatever port ha_peer is configured to) to any network that is not fully trusted, and disable CTL HA entirely where the clustering feature is not in active use.
