  - title: "XSS2Shell (CVE-2026-64638): a parser disagreement between WordPress's two HTML sanitisers turns a pre-auth login-page XSS into full remote code execution via captured Application Passwords and plugin upload"
    sources:
      - { url: "https://pwn.ai/blog/xss2shell", publisher: "PWN.AI (Nigusu Kasahun) — discovering researcher", date: "2026-08-06", role: "primary" }
      - { url: "https://socradar.io/blog/xss2shell-cve-2026-64638-wordpress/", publisher: "SOCRadar", date: "2026-08-07", role: "corroborating" }
      - { url: "https://wordpress.org/news/2026/08/wordpress-7-0-3-release/", publisher: "WordPress.org", date: "2026-08-06", role: "primary" }
    discovery_trace: "first seen at: socradar source-slice record, WebFetch https://socradar.io/blog/ → pivot: SOCRadar, URL https://socradar.io/blog/xss2shell-cve-2026-64638-wordpress/ → primary: PWN.AI (discoverer), URL https://pwn.ai/blog/xss2shell → corroborating: WordPress.org release notice, URL https://wordpress.org/news/2026/08/wordpress-7-0-3-release/"
    summary: |
      Researcher Nigusu Kasahun (PWN.AI) disclosed CVE-2026-64638 on 2026-08-06, a pre-authentication cross-site-scripting-to-remote-code-execution chain in WordPress Core, patched the same day in WordPress 7.0.3 (backported to every maintained branch back to 4.7; GHSA-52p2-r8wf-jcrf). Root cause is a parser differential between two WordPress sanitisation routines applied to the login-page username field: wp_strip_all_tags() wraps PHP's strip_tags(), which requires a `<` to be immediately followed by a letter to recognise a tag — inserting a single space (`< area`) makes it invisible to that function — while the later wp_kses_post() HTML-sanitisation pass uses a proper tokenizer that correctly parses `< area` as a valid `<area>` element and renders it into the DOM. The five-step exploitation chain that follows needs no vulnerability beyond this: (1) the injected `<area id=ajaxurl>` element clobbers the login page's global `ajaxurl` variable via DOM clobbering, and injected `<div id=color-picker>`/`<button class=wp-generate-pw>` elements trigger user-profile.js's password-reset-generator auto-click handler; (2) the resulting `$.post(ajaxurl,...)` call resolves to the injected element's href, reaching WordPress's public, unauthenticated REST route with `_jsonp=alert` — because jQuery's `$.post()` was called without a `dataType`, a `Content-Type: application/javascript` response makes jQuery call `globalEval()` on the body; (3) the JSONP callback regex (`^[a-zA-Z0-9_.]+$`) still permits property-chain callbacks such as `window.opener.approve.click`, letting the injected script click the "approve" button on an administrator's own already-open `authorize-application.php` tab (Same Origin Method Execution); (4) that click drives `auth-app.js` inside the admin's authenticated session to mint a new Application Password and redirect it to an attacker-controlled callback URL; (5) the attacker uses the captured Application Password against the REST API to upload a malicious ZIP through `/wp-admin/update.php?action=upload-plugin` — WordPress validates the nonce and the administrator capability correctly, but extracted plugin files under wp-content/plugins/ are directly web-accessible PHP and execute without the plugin ever being activated. The published proof-of-concept is a single self-submitting HTML form; the only interaction required is an administrator opening an attacker-controlled link while logged in with Application Passwords enabled (WordPress's default state) and unfiltered_html available to admins (also default).
    region_nexus: "global; affects every WordPress Core installation on any maintained branch below the 2026-08-06 patches"
    primary_sector_nexus: "direct — WordPress is a widely deployed public-sector and SME CMS across the constituency"
    sector: "web-cms"
    cves: ["CVE-2026-64638"]
    techniques: ["T1189", "T1204.001", "T1528", "T1505.003"]
    affected_products: ["WordPress"]
    entity_keys: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "If there is whitespace between `<` and the tag name, PHP does not recognize it as a tag."
        attribution: "PWN.AI (Nigusu Kasahun)"
        source_url: "https://pwn.ai/blog/xss2shell"
      - quote: "WordPress validates the nonce (correct), checks the capability (administrator, correct), and extracts the ZIP into `wp-content/plugins/`. The plugin does not need to be activated."
        attribution: "PWN.AI (Nigusu Kasahun)"
        source_url: "https://pwn.ai/blog/xss2shell"
      - quote: "Pre-auth reflected cross-site scripting (XSS) on the login screen with potential to lead to PHP code execution"
        attribution: "WordPress.org"
        source_url: "https://wordpress.org/news/2026/08/wordpress-7-0-3-release/"

  - title: "0patch names the root cause of one of the four CVEs the Unit 42 autonomous-AI intrusion campaign exploited: a pre-auth double-free in Windows' ikeext.dll reachable over UDP 500/4500"
    sources:
