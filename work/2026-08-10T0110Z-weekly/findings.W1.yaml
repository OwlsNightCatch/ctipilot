    discovery_trace: "first seen at: 0patch-blog source-slice record, RSS https://blog.0patch.com/feeds/posts/default → primary: 0patch, URL https://0patch.com/blog/micropatches-released-for-windows-ike-service-extensions → cross-referenced against prior_coverage.json entry 2026-08-02/unit42-autonomous-campaign-confirmed-impact-was-understated, which lists CVE-2026-33824 (\"callbacks from three IKE VPN endpoints\") as one of four exploited CVEs in Unit 42's tracked autonomous-AI campaign (actor:knaithe-knyuan)"
    summary: |
      0patch published micropatches and full root-cause analysis on 2026-08-05 for CVE-2026-33824, a vulnerability Microsoft patched in April 2026 (with no exploitation reported at the time) but which the operational pipeline's 2026-08-02 correction entry records as one of four CVEs actually exploited by the actor:knaithe-knyuan autonomous-AI intrusion campaign Unit 42 tracked ("callbacks from three IKE VPN endpoints"). The flaw is a pre-authentication double-free in ikeext.dll — the module behind the "IKE and AuthIP IPsec Keying Modules" service, running as Local System inside svchost.exe — specifically in the function IkeReinjectReassembledPacket on the IKEv2 fragment-reassembly path: the same pointer to a to-be-freed blob is referenced from two locations, so an unauthenticated attacker who can reach UDP 500/4500 on a host acting as an IKEv2 responder can free the same heap block twice, corrupting memory in a privileged, network-facing service with no authentication step at all. Affected: Windows 10 (1803–22H2) and Windows 11 (21H2–22H2) prior to the April 2026 cumulative update; 0patch's micropatches extend the fix to systems that cannot apply Microsoft's update. This closes an evidentiary gap in the tracked autonomous-AI campaign story: defenders who saw only "CVE-2026-33824" in the exploited-CVE list now have the concrete telemetry hook — any unauthenticated inbound IKEv2 fragment-reassembly traffic on UDP 500/4500 to a host functioning as an IKEv2 responder is the exploitation surface, and a firewall or IPsec policy that limits which hosts accept unsolicited IKEv2 responder traffic removes the exposure regardless of patch status.
