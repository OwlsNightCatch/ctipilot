    summary: |
      Status re-check on incident:minnesota-water-utilities-coordinated-cyberattack-2026-07, tracking the campaign the daily pipeline had at 12 states as of 2026-08-06. Two in-window deltas beyond that count. First, a technical one: Forescout's exposure-scan research (dated 2026-08-03, reported 2026-08-06) counted 4,407 internet-facing Rockwell Automation PLCs worldwide via EtherNet/IP on port 44818 (2,844 in the US), found 22 of them sitting specifically in the cities already hit by the OT campaign, and — critically — found 19 of those 22 city-level controllers still running firmware vulnerable to the 2017 CVE-2017-16740, meaning the attackers achieved operational disruption through credential/IP-address changes on already-reachable, unauthenticated EtherNet/IP endpoints rather than through exploiting a software flaw; over 70% of the US-exposed population sits on Verizon, AT&T or T-Mobile mobile-carrier networks rather than fixed enterprise links. Second, an attribution/authority one: CISA's own briefing (per Nextgov, 2026-08-06, at Black Hat) confirmed the exposed devices had "either no password set or default password set," and CISA's spokesperson stated "we're not doing anything with attribution right now" — so as of the end of this week, no US authority has moved off suspected-Iran-nexus (the assessment remains sourced to unnamed investigators, not an official attribution), and no European regulator, ENISA, or NCSC-CH statement on the campaign was found despite the CISA/FBI PLC advisory (AA26-097A) explicitly naming Siemens and Schneider Electric hardware alongside Rockwell/Allen-Bradley, and despite the Forescout scan's carrier concentration data pointing at Greece, Spain, Italy and Austria for the Siemens S7-1200 exposure documented earlier this month.
