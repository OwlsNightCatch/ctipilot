  - title: "Connor 'Judische'/'Waifu' Moucka (UNC5537) pleads guilty to the 2024 Snowflake extortion campaign — 165+ victim organisations, 100M+ AT&T customer records, no-MFA cloud SaaS credentials as the entire access vector"
    sources:
      - { url: "https://krebsonsecurity.com/2026/08/canadian-man-pleads-guilty-in-snowflake-extortions/", publisher: "Krebs on Security", date: "2026-08-06", role: "primary" }
      - { url: "https://www.helpnetsecurity.com/2026/08/06/snowflake-canadian-hacker-pleaded-guilty/", publisher: "Help Net Security", date: "2026-08-06", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"Snowflake hacker Connor Moucka guilty plea sentencing August 2026\") → pivot: Krebs on Security, URL https://krebsonsecurity.com/2026/08/canadian-man-pleads-guilty-in-snowflake-extortions/ → corroboration: WebSearch (\"UNC5537 Mandiant Snowflake Moucka Judische\") confirming Mandiant's UNC5537 designation for the same cluster"
    summary: |
      Connor Riley Moucka, 26, of Kitchener, Ontario — known in cybercrime circles as "Judische" and "Waifu," and tracked by Mandiant as UNC5537 — pleaded guilty on 2026-08-05 in the U.S. District Court for the Western District of Washington to computer fraud, wire fraud, aggravated identity theft, and conspiracy over the 2024 Snowflake customer-instance extortion campaign. Per the DOJ's own filing (relayed by Krebs), Moucka and co-conspirators used credentials harvested by infostealer malware to access at least 165 Snowflake customer organizations that had not enforced multi-factor authentication — the entire initial-access vector was T1078.004 Valid Accounts: Cloud Accounts, with no software exploit involved — and exfiltrated billions of records including call/text metadata, banking data, DEA registration numbers, driver's licence and passport numbers, and SSNs, then extorted victims (Ticketmaster/Live Nation, Lending Tree, Advance Auto Parts, Neiman Marcus among the named targets) under threat of publication, netting over $2.5 million in ransom payments. Moucka separately admitted to stealing call/text metadata for more than 100 million AT&T customers. One admitted co-conspirator, U.S. Army soldier Cameron "Kiberphant0m" Wagenius, pleaded guilty in July 2025 to a related AT&T/Verizon extortion and is set for sentencing 2026-09-03; Wagenius is on record posting what he claimed were AT&T call logs for then-President-elect Trump and then-Vice-President Harris, plus NSA schematics, immediately after Moucka's October 2024 arrest. Moucka is scheduled for sentencing 2026-10-27 and faces up to 32 years (a mandatory 2-year consecutive term on the identity-theft count plus up to 30 years on the remaining counts). Snowflake's own remediation — mandatory MFA and stricter password policy — came after the campaign, not before it, which is the transferable lesson: any SaaS platform whose customer-tenant auth defaults allow MFA to be optional inherits this exact access path regardless of the vendor's own security posture.
    region_nexus: "global; named victims are US-headquartered, but the access technique (credential-stuffing into MFA-optional SaaS tenants) is directly transferable to any organisation using a cloud data platform without enforced MFA"
