  - title: "Trail of Bits catalogues four AWS Nitro Enclaves-to-KMS trust-boundary pitfalls that survive even correct cryptography — CMK substitution, TLS-less enclave-to-HSM paths, IAM overpermissioning, and mutable key policies"
    sources:
      - { url: "https://blog.trailofbits.com/2026/08/05/a-few-notes-on-aws-nitro-enclaves-kms-integration/", publisher: "Trail of Bits", date: "2026-08-05", role: "primary" }
    discovery_trace: "first seen at: trail-of-bits source-slice record, WebFetch https://blog.trailofbits.com/ → primary: Trail of Bits, URL https://blog.trailofbits.com/2026/08/05/a-few-notes-on-aws-nitro-enclaves-kms-integration/"
    summary: |
      Trail of Bits published architecture-security research on 2026-08-05 covering four configuration-level attack classes against AWS Nitro Enclaves deployments that integrate with KMS for key management — pitfalls that persist even when the underlying enclave attestation and encryption are implemented correctly, because they sit in the trust boundary between the enclave and the KMS control plane rather than in the cryptography itself. (1) Data-swap/CMK-substitution: because encrypted data keys are stored outside the enclave and Encrypt/ReEncrypt operations lack attestation support, a host that controls stored ciphertext or CMK selection can force the enclave to decrypt attacker-chosen plaintext or use an unprotected key — mitigated only by hardcoding the full CMK ARN inside enclave code and validating the encryption context on every KMS response. (2) No true end-to-end TLS: KMS terminates TLS outside its own HSM boundary, so "impossible to have an end-to-end TLS channel between enclave and HSM" is Trail of Bits' own characterisation of a limit AWS's architecture imposes, not a bug an integrator can fix — the recommended compensating control is enclave-initiated TLS with a pinned CA plus KMS VPC endpoints and an `aws:SourceVpc` policy condition. (3) IAM overpermissioning: several observed policies grant KMS decrypt access to any IAM role with any access to the key rather than scoping to specific roles, defeating PCR-based attestation restrictions entirely. (4) Mutable key policies: without an explicit deny on `kms:PutKeyPolicy`, a compromised IAM principal (or AWS-support-facing social engineering) can dynamically weaken a key policy that was correctly restrictive at deploy time. Trail of Bits also flags `aws-nitro-enclaves-sdk-c` as carrying known vulnerabilities and recommends the Rust `aws-nitro-enclaves-nsm-api` plus Boto3's `KMS.Client` as the safer SDK combination. For any organisation running confidential-computing workloads on AWS Nitro Enclaves with KMS — a pattern increasingly used for secrets/key material isolation in financial and government cloud deployments — this is a checklist against which to audit an existing deployment, not a vulnerability requiring urgent patching.
