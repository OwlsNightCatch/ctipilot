  - title: "DOJ: Snowflake mass-extortion operator Connor Moucka pleads guilty — 165+ victim organisations, billions of records, no vulnerability involved, only stolen credentials and absent MFA"
    sources:
      - { url: "https://www.justice.gov/opa/pr/canadian-man-pleads-guilty-hacking-us-cloud-storage-provider-and-extorting-its-customers", publisher: "US Department of Justice, Office of Public Affairs", date: "2026-08-06", role: "primary" }
      - { url: "https://www.heise.de/news/Cyberkrimineller-bekennt-sich-der-Millionen-Erpressung-von-Cloud-Kunden-schuldig-11402603.html", publisher: "heise online", date: "2026-08-07", role: "corroborating" }
      - { url: "https://www.heise.de/en/news/Cybercriminal-pleads-guilty-to-extorting-millions-from-cloud-customers-11402608.html", publisher: "heise online (English)", date: "2026-08-07", role: "corroborating" }
    discovery_trace: "first seen at: heise-sec RSS feed (https://www.heise.de/security/rss/news-atom.xml), item \"Cyberkrimineller bekennt sich der Millionen-Erpressung von Cloud-Kunden schuldig\" (2026-08-07) → pivot: heise English translation, URL https://www.heise.de/en/news/Cybercriminal-pleads-guilty-to-extorting-millions-from-cloud-customers-11402608.html → primary: US DOJ Office of Public Affairs, URL https://www.justice.gov/opa/pr/canadian-man-pleads-guilty-hacking-us-cloud-storage-provider-and-extorting-its-customers"
    summary: |
      Connor Riley Moucka, 26, of Kitchener, Ontario — online handles "Judische" and "Waifu" — pleaded
      guilty on 2026-08-06 in the Western District of Washington to computer fraud, wire fraud,
      aggravated identity theft and a related conspiracy count, closing the criminal case on one of the
      largest SaaS-credential mass-extortion campaigns on record. Between February and October 2024,
      Moucka and co-conspirators used stolen login credentials — obtained via infostealer malware, not
      any vulnerability in the cloud provider itself — to compromise the cloud-hosted environments of at
      least 165 customers of a named US SaaS/cloud-storage provider (Snowflake, per DOJ court documents
      and subsequent reporting; the DOJ release itself does not name the provider). No MFA was enforced
      on the compromised tenant accounts, which is the single control gap the entire campaign turned on.
      The group stole billions of records — call/SMS metadata, banking and financial data, payroll
      records, DEA registration numbers, driver's licence and passport numbers, and Social Security
      numbers — then extorted victims by threatening to publish the data, re-extorting some victims
      multiple times, and advertising stolen datasets on BreachForums, Exploit.in, XSS.is and Telegram.
      The conspiracy netted over $2.5 million in ransom payments (Moucka personally received at least
      $495,000); DOJ states victims' own damage estimate is $9.5 million, excluding harm to the
      individuals whose data was stolen. Moucka faces 2 to 30 years; sentencing is set for 2026-10-27.
      For any organisation running SaaS/cloud data-warehouse tenancy (Snowflake or equivalent), the
      transferable lesson DOJ's account underlines is unchanged from the original 2024 disclosures but
      now carries a closed criminal record behind it: credential-stuffing/infostealer-sourced credential
      reuse against a tenant with no MFA and no IP allow-listing is sufficient on its own — no CVE, no
      exploit — to reach a full customer-data compromise at cloud-provider scale.
    region_nexus: "global; predominantly US-based victim organisations, but the credential/MFA lesson is directly transferable to any Swiss/EU public-sector or CI tenant of a cloud data-warehouse/SaaS platform"
    primary_sector_nexus: "indirect"
    sector: "finance, telco, cross-sector"
