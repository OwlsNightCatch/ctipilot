  - title: "SQLite forum thread confirms MITRE never contacted the maintainer over the LLM-fabricated-CVE wave despite CNA rules, hardening the case for major open-source projects to self-CNA"
    sources:
      - { url: "https://sqlite.org/forum/forumpost/34bdf3b9bd759d4d", publisher: "SQLite User Forum (Richard Hipp, SQLite creator)", date: "2026-08-04", role: "primary" }
    discovery_trace: "first seen at: NCSC-NL advisory NCSC-2026-0268 (bridge: python3 tools/fetch_source.py ncsc-nl csaf NCSC-2026-0268), revision 1.0.1 dated 2026-08-03, referencing sqlite.org forum post → primary: SQLite User Forum thread \"Fake CVEs against SQLite\", URL https://sqlite.org/forum/forumpost/34bdf3b9bd759d4d"
    summary: |
      This is a delta on the already-covered LLM-fabricated-CVE wave (entry
      2026-08-04/bsi-ncsc-nl-withdraw-sqlite-advisories-llm-fabricated-cves; registry
      trend:llm-fabricated-cve-advisory-wave-2026-07). The prior entry covered the retraction itself
      (BSI and NCSC-NL withdrawing SQLite advisories on 2026-08-03) and downstream propagation
      (GHSA still serving a withdrawn record). Fresh in-window material from the same forum thread,
      in comments dated 2026-08-04, adds a governance-process finding the prior entry did not carry:
      asked directly whether MITRE, as required by CVE Numbering Authority (CNA) rules, contacted the
      SQLite project before assigning or before removing the fabricated CVEs, SQLite creator Richard
      Hipp answered "No. MITRE did not make any attempt to contact the SQLite devs," and states the
      fake CVEs were taken down only "as a result of all the pushback from multiple sources" — not at
      SQLite's own request, since "they ignore what we say." Forum participants tie this directly to
      why curl (2024), Rust (2025) and the Linux kernel (2026) each became their own CNAs: doing so puts
      CVE assignment for a project entirely under the maintainer's remit instead of MITRE's unvetted
      intake, which (per Hipp's original 2026-07-29 post) "takes a CVE from anybody at any time, without
      any kind of validation." For defenders and vulnerability-management teams, the actionable delta is
      a triage heuristic: a CVE against a project that runs its own CNA carries the maintainer's implicit
      review; a CVE against a project that does not is, on this evidence, unvetted by the coordinator by
      design, and a newly-assigned, unfamiliar-looking CVE against a widely embedded dependency (SQLite
      is vendored everywhere) warrants a sanity check against the upstream project directly before it
      drives a patch cycle or a compliance ticket.
    region_nexus: "global; ecosystem/process finding relevant to any vulnerability-management or dependency-scanning pipeline"
    primary_sector_nexus: "indirect"
    sector: "cross-sector"
    cves: []
    techniques: []
    affected_products: []
    entity_keys:
      - trend:llm-fabricated-cve-advisory-wave-2026-07
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: "update-of:2026-08-04/bsi-ncsc-nl-withdraw-sqlite-advisories-llm-fabricated-cves"
    evidence:
      - quote: "No. MITRE did not make any attempt to contact the SQLite devs. Note, however, that as a result of all the pushback from multiple sources (not from SQLite - they ignore what we say), the fake CVEs have been taken down now."
        attribution: "Richard Hipp, SQLite creator, SQLite User Forum"
        source_url: "https://sqlite.org/forum/forumpost/34bdf3b9bd759d4d"
      - quote: "MITRE apparently takes a CVE from anybody at any time, without any kind of validation. But boy do they require validation to get one taken down!"
        attribution: "Richard Hipp, SQLite creator, SQLite User Forum"
        source_url: "https://sqlite.org/forum/forumpost/34bdf3b9bd759d4d"
    extended_notes: |
      Single-source on the specific MITRE-non-contact claim (Hipp's own account of a private
      interaction, not independently corroborated by MITRE or a third party within this window) —
      rated SINGLE-SOURCE-OTHER / MEDIUM confidence accordingly, distinct from the already
      MULTI-SOURCE-verified retraction fact carried by the prior entry. Borderline call: this is a
      narrow governance-process addendum rather than a freestanding story: flagging for the main
      agent's judgment on whether it clears the bar as a standalone update-of entry or is better
      folded into extended context on the existing trend entity.
    classification: { reliability: "B", credibility: "2" }
    borderline: true
    borderline_reason: "Narrow single-source delta (MITRE-contact claim) on an already-covered trend; substantive for a technical audience (CNA triage heuristic) but thin as a standalone item — main agent should judge whether to publish separately or fold into the existing trend's context."

