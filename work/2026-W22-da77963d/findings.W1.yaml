  # ── CAMPAIGN 10 ── GlassWorm post-takedown ──

  - title: "GlassWorm developer-targeting botnet — post-takedown: no confirmed resurfacing in window; CSO Online warns of structural risk; reemergence scanning recommended [UPDATE]"
    covered_item_key: "item:crowdstrike-google-and-shadowserver-simultaneously-sever-all"
    novelty: update-to-prior:2026-05-28
    sources:
      - url: "https://www.csoonline.com/article/4178215/glassworm-falls-but-the-repo-problem-is-far-from-solved.html"
        publisher: "CSO Online"
        date: "2026-05-28"
        role: "primary (post-takedown risk analysis)"
      - url: "https://www.crowdstrike.com/en-us/blog/inside-crowdstrike-takedown-of-a-developer-targeting-botnet/"
        publisher: "CrowdStrike"
        date: "2026-05-27"
        role: "primary (takedown technical details)"
    discovery_trace: "first seen at: WebSearch ('GlassWorm botnet post-takedown resurface rebound May 2026') → CSO Online post-takedown analysis → CrowdStrike takedown blog"
