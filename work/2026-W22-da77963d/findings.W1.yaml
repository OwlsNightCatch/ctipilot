  - title: "Chaotic Eclipse / Nightmare Eclipse — MiniPlasma PoC confirmed SYSTEM on fully-patched Windows 11; sixth zero-day in six weeks; June 10 Patch Tuesday is first fix opportunity [UPDATE]"
    covered_item_key: "item:nightmare-eclipse-chaotic-eclipse-microsoft-s-digital-crimes"
    novelty: update-to-prior:2026-05-30
