    summary: |
      Material update since 2026-05-30 daily: MiniPlasma is the sixth zero-day released by researcher Chaotic Eclipse (GitHub: Nightmare-Eclipse) in six weeks. MiniPlasma is a LPE targeting CVE-2020-17103 in the Windows Cloud Filter driver (`cldflt.sys`); the researcher claims the 2020 patch was incomplete or partially reverted. ThreatLocker independently confirmed MiniPlasma achieves SYSTEM-level privilege escalation on fully-patched Windows 11 running the May 2026 cumulative update. The researcher continues to taunt Microsoft's Digital Crimes Unit, which issued a formal statement calling uncoordinated zero-day releases "never justifiable." BlueHammer, RedSun, and UnDefend (the first three in the series) have reportedly been observed in real-world attacks post-disclosure per multiple aggregator sources. The next Patch Tuesday is 2026-06-10 — that is the earliest plausible official fix date. Detection: unprivileged process elevating to SYSTEM via `cldflt.sys` (Cloud Sync engine driver); EDR alert on unexpected kernel-mode callbacks from `FilterSendMessage`/`NtFsControlFile`; Sysmon EID 1 with parent process creating a child at SYSTEM integrity from a non-privileged parent; Windows Security EID 4673 (privileged service requested) anomalies. Hardening: disabling OneDrive / Windows cloud file sync removes the `cldflt.sys` load path on endpoints where it is not operationally required; monitor for unusual `CfReleaseFilterConnContext` / `CfConnectSyncRoot` API sequences.
