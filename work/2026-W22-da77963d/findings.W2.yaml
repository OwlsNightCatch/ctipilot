        date: "2026-05-28"
        role: "primary"
      - url: "https://www.enisa.europa.eu/sites/default/files/2026-05/ENISA%20NIS360%202026.pdf"
        publisher: "ENISA — NIS360 2026 full report PDF"
        date: "2026-05-28"
        role: "primary-document"
    discovery_trace: "first seen at: WebSearch ('ENISA NIS360 2026 annual report published May 2026') → primary: https://www.enisa.europa.eu/enisa-nis360-2026 and news release https://www.enisa.europa.eu/news/nis360-the-bigger-picture-on-maturity-and-criticality-of-nis-critical-sectors (both fetched 2026-05-31)"
    summary: |
      ENISA published its third annual NIS360 sectoral cybersecurity maturity assessment on 28 May 2026. The report evaluates all 18 sectors of high criticality under NIS2 Annex I across four axes: legislation effectiveness, organisational preparedness, institutional authority capacity, and sectoral ecosystem maturity.

      Risk zone sectors (maturity below average, criticality exceeding maturity): health, railway (newly entered), maritime, ICT management services, space, public administrations, drinking water (newly entered), and wastewater (newly entered). Gas exited the risk zone after targeted investment. The risk-zone concept signals that these sectors' societal/economic importance substantially exceeds their cyber-readiness, calling for mandatory support from national authorities and additional investment by operators.

      High-maturity band (above average): banking, electricity, telecommunications (unchanged), trust services (newly elevated), aviation (newly elevated), financial market infrastructures (newly elevated).

      Railway criticality increased in this edition due to its military-logistics role and heightened threat exposure; the combined entry of railway, water, and wastewater into the risk zone is the most significant shift from the 2025 edition.

      Defender/operator takeaway for CH/EU: NIS2-obligated entities in health, public administration, water, and ICT-managed-services sectors should treat this report as ENISA's baseline expectation for their current maturity level. National competent authorities in EU states are expected to use the NIS360 maturity indicators when prioritising supervisory attention and audit targets under NIS2 Article 32/33. Swiss public-sector entities are not directly subject to NIS2 but the Swiss NCSC has historically tracked ENISA's assessments when updating sector-specific guidance.
