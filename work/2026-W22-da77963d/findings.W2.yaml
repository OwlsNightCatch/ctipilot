  - title: "UPDATE: EU 20th Russia sanctions MSS prohibition in force from 25 May; Switzerland adopted listings only — substantive measures including MSS ban deferred to summer"
    sources:
      - url: "https://sanctionsnews.bakermckenzie.com/swiss-government-partially-implements-the-20th-eu-sanctions-package/"
        publisher: "Baker McKenzie Global Sanctions Blog"
        date: "2026-05-22"
        role: "primary"
      - url: "https://www.gtlaw.com/en/insights/2026/5/eus-20th-russia-sanctions-package-key-changes-and-compliance-implications"
        publisher: "Greenberg Traurig LLP"
        date: "2026-05"
        role: "corroborating"
    discovery_trace: "first seen at: WebSearch ('EU 20th Russia sanctions MSS managed security services EC guidance SECO Switzerland 2026 May June compliance') → pivot: Baker McKenzie sanctions blog https://sanctionsnews.bakermckenzie.com/swiss-government-partially-implements-the-20th-eu-sanctions-package/ → corroborating: Greenberg Traurig https://www.gtlaw.com/en/insights/2026/5/eus-20th-russia-sanctions-package-key-changes-and-compliance-implications"
    summary: |
      The EU's 20th Russia sanctions package (Council Regulation, adopted 23 April 2026) introduced — effective 25 May 2026 — a prohibition on providing managed security services (MSS) to the Russian government and to Russian-established entities. The MSS prohibition covers: cybersecurity risk management services, incident handling, penetration testing, security audits, and related consulting or expert advice. It extends to Russian subsidiaries of EU-incorporated companies unless a national competent authority licence is obtained. No European Commission interpretive guidance on the MSS scope had been published as of the end of May 2026 per both sources; guidance was described as "awaited."

      Switzerland's Federal Council adopted most but NOT all of the 20th package on 22 May 2026. What Switzerland adopted: 115 new individual/entity designations (Annex 8), 60 companies under export controls (Annex 2), 46 shadow-fleet vessels (Annex 33), port transaction bans (Murmansk, Tuapse, one Indonesian port), 20 Russian bank restrictions, RUBx cryptocurrency ban. What Switzerland explicitly deferred: "substantive measures in the financial, energy and trade sectors" — expected "not before the summer break." Baker McKenzie's analysis indicates this deferral is likely to include the MSS prohibition, though neither source explicitly confirms which Article the MSS ban falls under.

      Compliance gap for CH-based MSS providers: the EU MSS prohibition is live for EU-incorporated entities and their Russian subsidiaries from 25 May. Swiss firms providing MSS to Russian government/entities are NOT yet subject to a Swiss-law prohibition as of today (31 May 2026) but should plan on compliance before the summer package adoption. SOC teams at cross-border MSS providers with EU parent structures must audit their Russian client portfolios immediately. No FINMA or SECO guidance was identified for the window.
