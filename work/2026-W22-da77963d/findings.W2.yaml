  - title: "ENISA NIS360 2026 — third-edition NIS2 maturity baseline: health, public administrations, water, ICT-managed-services named 'risk zone'; railway newly enters risk zone"
    sources:
      - url: "https://www.enisa.europa.eu/news/nis360-the-bigger-picture-on-maturity-and-criticality-of-nis-critical-sectors"
        publisher: "ENISA"
