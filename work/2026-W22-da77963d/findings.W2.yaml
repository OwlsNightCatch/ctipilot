        date: "2026-05-27"
        role: "corroborating"
      - url: "https://www.bmi.bund.de/SharedDocs/gesetzgebungsverfahren/DE/CI1/cyberabwehr.html"
        publisher: "BMI (Federal Ministry of the Interior) — legislation tracking"
        date: "2026-05-27"
        role: "corroborating"
    discovery_trace: "first seen at: WebSearch ('Germany Cybersicherheitsstärkungsgesetz Kabinett 2026 BMI BSI Bundesregierung primary source') → pivot: bundesregierung.de kabinett results page https://www.bundesregierung.de/breg-de/aktuelles/bundeskabinett-ergebnisse-2432542 → primary: https://www.bundesregierung.de/breg-de/aktuelles/staerkung-cybersicherheit-2432588"
    summary: |
      The German Federal Cabinet approved the Cybersicherheitsstärkungsgesetz (Cyber Security Strengthening Act) on 27 May 2026, presented by Federal Interior Minister Alexander Dobrindt (BMI). The law is a draft bill still requiring Bundestag passage — it is not yet in force. It grants three federal agencies new active cyber-defence powers: (1) BSI (Bundesamt für Sicherheit in der Informationstechnik) gains authority to detect specific preparatory attack activities and implement preventive countermeasures against large-scale attacks with high damage potential; (2) BKA (Bundeskriminalamt) and (3) Bundespolizei (Federal Police) gain authority to conduct active technical operations against attacker infrastructure — redirecting data traffic, modifying attacker software and data, and disabling C2 infrastructure. The stated rationale is that "preventive measures in one's own IT systems alone do not provide sufficient protection" against sophisticated state and non-state actors. The BMI legislative tracking page confirms this is the Referentenentwurf (departmental draft) from February 2026 now approved at cabinet level. Bundestag deliberation and vote are the next step; no timeline given in the primary sources.

      For CH/EU cross-border IR: the law, once enacted, authorises German authorities to interfere with attacker infrastructure that may be located in other jurisdictions. This raises questions about notification channels (MEP/ENISA cross-border incident coordination) and incident-response protocols when German BKA/BSI actions affect infrastructure shared with, or transiting through, Swiss or EU-partner networks. SOC managers coordinating with German counterparts on joint incidents should note the change in legal posture once the law passes.

      Defender takeaway: no immediate action required while the bill is in Bundestag deliberation. Track the legislative timeline via bundestag.de. When enacted, update mutual-assistance protocol documents with German CERTs (BSI-CERT, n-map Germany) to account for potential active-interference actions in shared infrastructure.
    ch_eu_nexus: "Germany; cross-border implications for CH/EU incident response when law passes"
