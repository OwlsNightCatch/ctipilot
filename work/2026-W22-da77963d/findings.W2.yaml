  - title: "California AG v. Chrome Holding (formerly 23andMe) — primary: GIPA and CCPA lawsuit over 2023 7M genetic-data breach; bulk-enumeration coding error plus absent credential-stuffing defences"
    sources:
      - url: "https://oag.ca.gov/news/press-releases/attorney-general-bonta-sues-chrome-holding-co-formerly-known-23andme-over-2023"
        publisher: "California Attorney General (oag.ca.gov)"
        date: "2026-05-28"
        role: "primary"
    discovery_trace: "first seen at: spawn-message instruction; confirmed via WebSearch ('California AG 23andMe Chrome Holding lawsuit 2026 May 31 press release oag.ca.gov primary') → primary: https://oag.ca.gov/news/press-releases/attorney-general-bonta-sues-chrome-holding-co-formerly-known-23andme-over-2023"
    summary: |
      California AG Rob Bonta filed suit on 28 May 2026 against Chrome Holding Co. (formerly 23andMe, now in Chapter 11 bankruptcy) over the October 2023 breach affecting 6,944,406 individuals globally, including 855,541 Californians. The genetic data stolen included health predispositions, ancestry, ethnicity, and biological-relative information — among the most sensitive categories under both GDPR and US state law.

      The technical failures alleged: (1) A bulk-enumeration coding error in the DNA Relatives feature allowed a threat actor who credential-stuffed ~14,000 accounts to scrape relationship and ancestry data for nearly 7 million users due to the feature's opt-in aggregation design; (2) 23andMe had no credential-stuffing detection or MFA enforcement despite credential-stuffing being a known attack vector against consumer genomics platforms; (3) The attacker maintained access undetected for five months; (4) 23andMe failed to investigate "numerous warnings" that systems were compromised.

      Laws cited: California's Genetic Information Privacy Act (GIPA), Reasonable Data Security Law, False Advertising Law, Unfair Competition Law, and California Consumer Privacy Act (CCPA). The GIPA claim is significant because it treats genetic data as a protected category with heightened duties — a precedent relevant to European bioinformatics and genomic-medicine platforms governed by GDPR Article 9 (special categories).

      EU/CH pattern note: this lawsuit, combined with the CNIL IQVIA action (same window), illustrates a cross-Atlantic enforcement convergence on health/genomic data security: absent MFA, absent log monitoring, and absent credential-stuffing defences all constitute failures below the Article 32 / "reasonable security" floor. European genomic-medicine platforms and biobank operators should treat this as a reference case when assessing their own controls.
