  - title: "CNIL primary: Délibération SAN-2026-008 — IQVIA fined €5M for health data warehouse security failures (no MFA on EMR, no log monitoring, 6-month injonction under €10K/day penalty)"
    sources:
      - url: "https://www.cnil.fr/en/health-data-fine-5-million-euros-against-iqvia"
        publisher: "CNIL (Commission Nationale de l'Informatique et des Libertés)"
        date: "2026-05-30"
        role: "primary"
      - url: "https://www.legifrance.gouv.fr/cnil/id/CNILTEXT000054136834"
        publisher: "Légifrance — Délibération SAN-2026-008 du 26 mai 2026"
        date: "2026-05-26"
        role: "primary-decision-text"
    discovery_trace: "first seen at: spawn-message instruction; confirmed via WebSearch ('CNIL décision IQVIA 5 millions euros délibération texte intégral 2026 mai') → primary: CNIL press release https://www.cnil.fr/en/health-data-fine-5-million-euros-against-iqvia → decision text: https://www.legifrance.gouv.fr/cnil/id/CNILTEXT000054136834"
    summary: |
      CNIL's restricted formation issued Délibération SAN-2026-008 on 26 May 2026, fining IQVIA Operations France €5 million for violations across its two CNIL-authorised health data warehouses — LRX (fed by ~14,000 French pharmacies, authorised 2018) and EMR (fed by thousands of doctors, authorised 2021). The decision confirms three security failures relevant to defenders across the EU health sector: (1) No MFA on the EMR warehouse for privileged access to health data; (2) No measure to regularly analyse connection logs and detect abnormal activities in either warehouse — absent log monitoring cited explicitly as a GDPR Article 32 failure; (3) Transparency failures: none of the four pharmacies audited informed patients of data transmission to IQVIA, and CNIL found IQVIA bears controller-responsibility for downstream notice compliance even when delegated to pharmacies.

      Remediation ordered: injonction within 6 months to correct the information and right-to-object failures, backed by a €10,000/day coercive penalty per day of delay. The deliberation number is SAN-2026-008 and the full text is published on Légifrance (CNILTEXT000054136834).

      Pattern relevance for DACH/EU public sector: health data warehouses operated by regional health authorities, hospital networks, and statutory health-insurance bodies face the same three controls as mandatory baseline — MFA on all privileged access paths to pseudonymised/health data, SIEM-level log monitoring with anomaly detection, and documented compliance-responsibility chains for data processors transmitting patient data.
