  - title: "UPDATE: Germany Cybersicherheitsstärkungsgesetz — primary government sources confirm cabinet approval 2026-05-27; Bundestag passage still ahead"
    sources:
      - url: "https://www.bundesregierung.de/breg-de/aktuelles/staerkung-cybersicherheit-2432588"
        publisher: "Bundesregierung (German Federal Government)"
