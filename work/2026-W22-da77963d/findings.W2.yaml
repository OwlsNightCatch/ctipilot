  - title: "EU Cyber Resilience Act — 11 June 2026 milestone: member states must designate notifying authorities for conformity assessment bodies; 11 September 2026 reporting obligations begin"
    sources:
      - url: "https://digital-strategy.ec.europa.eu/en/factpages/cyber-resilience-act-implementation"
        publisher: "European Commission — Digital Strategy CRA Implementation"
        date: "2026-05"
        role: "primary"
    discovery_trace: "first seen at: WebSearch ('EU Cyber Resilience Act CRA implementation 2026 May delegated acts ENISA notification guidance') → primary: https://digital-strategy.ec.europa.eu/en/factpages/cyber-resilience-act-implementation"
    summary: |
      The EU Cyber Resilience Act (CRA, entered into force 10 December 2024) has two imminent milestones for defenders and public-sector procurement teams.

      11 June 2026 (11 days away): Chapter IV of the CRA enters application. Member states must by this date designate national notifying authorities responsible for assessing, designating, and notifying conformity assessment bodies (CABs) for products with digital elements in the "important" and "critical" classes. Before a CAB can certify products, its member state's notifying authority must register it in NANDO. This deadline matters to public-sector IT procurement: until sufficient CABs are notified (expected by 11 December 2026), third-party conformity assessment for Class I/II products will be limited, and many manufacturers are expected to self-declare in the interim.

      11 September 2026: CRA Article 14 reporting obligations enter application. Manufacturers must report actively exploited vulnerabilities and severe incidents via ENISA's Single Reporting Platform (SRP), which must be operational by this date. Early warning within 24 hours of awareness; notification within 72 hours; follow-up report within 14 days (vulnerabilities) or one month (severe incidents). Note: these are manufacturer obligations, not operator obligations — but public-sector operators that are also manufacturers (in-house developed tools, custom firmware) must comply.

      Also in scope: a delegated act on CSIRT authority to withhold vulnerability notifications from the SRP (Regulation EU 2026/881) was adopted in early 2026 with publication pending; this affects the information-sharing chain between CSIRT-EU, national CSIRTs, and ENISA when a notified vulnerability requires coordinated disclosure before public dissemination.

      SOC/procurement takeaway: verify that suppliers of products in the "important" and "critical" CRA classes have identified their notified body or are on the self-declaration path. Update supplier questionnaires to include CRA compliance status. For in-house developed software products, check whether your organisation qualifies as a CRA "manufacturer."
