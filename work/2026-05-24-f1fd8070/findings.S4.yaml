      - { url: "https://www.uk-koeln.de/uniklinik-koeln/aktuelles/detailansicht/cyberkriminelle-entwenden-patientendaten-bei-externem-abrechnungs-dienstleister/", publisher: "University Hospital Cologne (victim statement, DE)", date: "2026-05-21", role: "victim-statement" }
      - { url: "https://borncity.com/blog/2026/05/22/gesundheitsdienstleister-unimed-im-april-2026-durch-cyberangriff-getroffen/", publisher: "Borns IT- und Windows-Blog (DE)", date: "2026-05-22", role: "corroborating" }
    discovery_trace: |
      first seen at: WebSearch ("cyberangriff datendiebstahl behörde krankenhaus Mai 2026 Schweiz Deutschland bestätigt") →
      pivot: heise.de article URL in results, URL https://www.heise.de/en/news/Patient-data-affected-Cyberattack-on-billing-service-provider-for-clinics-11305015.html →
      pivot: The Record article URL in separate WebSearch ("Unimed healthcare billing ransomware attacker identity 2026 Germany university hospitals"), URL https://therecord.media/hackers-steal-patient-billing-data-german-hospitals →
      primary: victim statements at Freiburg University Hospital (https://www.uniklinik-freiburg.de/presse/pressemitteilungen/detailansicht/6807-cyberangriff-auf-externen-dienstleister-betrifft-auch-daten-von-patientinnen-des-universitaetsklinikums-freiburg.html) and Cologne University Hospital (https://www.uk-koeln.de/uniklinik-koeln/aktuelles/detailansicht/cyberkriminelle-entwenden-patientendaten-bei-externem-abrechnungs-dienstleister/)
    summary: |
      Unimed, a Saarland-based billing-service provider that processes private-insurance and self-payer invoices for an estimated 95% of German university hospitals and 51% of large clinics (600+ beds), was breached in mid-April 2026. Attackers exfiltrated patient data before a full encryption of Unimed's infrastructure could be deployed and was averted. At the time of disclosure (May 22, 2026), at least six German university hospitals confirmed patient data was stolen: Freiburg (~54,000 patient master records, ~900 billing records including diagnoses and treatment detail, limited IBAN/bank data), Cologne (~30,000 affected; names, addresses, treating-physician records), Heidelberg (~11,000; ~2,700 likely also include billing data with diagnoses), Tübingen, Ulm, and Mannheim (numbers not yet specified). German Police (Hannover Police Directorate, per heise) attributed the attack to the Kairos ransomware group — the same group that claimed the ARWINI Lower Saxony statutory-prescription audit body breach (covered 2026-05-19); The Record article published May 22 states no threat actor has publicly claimed responsibility. Data categories in scope include GDPR Article 9 special-category health data (diagnoses, treatment methods, billing codes) and financial data (IBANs, account numbers). Affected patients at Saarland University Hospital were notified May 18, 2026 that they too were in scope. Unimed's server footprint is central to the German medical billing ecosystem; multiple additional hospital notifications may follow. Authorities notified April 16, 2026 by Hannover Police after investigation began.
    ch_eu_nexus: "Direct: six German public university hospitals with GDPR Art. 9 data; attacker (Kairos) previously confirmed against Swiss-adjacent ARWINI target"
    public_sector_nexus: "direct — all six victim hospitals are German state-funded university (Uniklinik) institutions"
    sector: "healthcare, public-sector"
    cves: []
    actors_campaigns_malware: ["Kairos (ransomware group, German police attribution via heise)"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Several university hospitals, including those in Cologne, Freiburg, Heidelberg, Tübingen, Ulm and Mannheim, disclosed Thursday that patient information had been stolen after attackers breached the service provider in mid-April."
        attribution: "The Record (Recorded Future News)"
        source_url: "https://therecord.media/hackers-steal-patient-billing-data-german-hospitals"
      - quote: "Unimed processes billing services for privately insured and self-paying patients on behalf of numerous German hospitals."
        attribution: "The Record (Recorded Future News)"
        source_url: "https://therecord.media/hackers-steal-patient-billing-data-german-hospitals"
      - quote: "master data of around 54,000 patients were stolen, including names, addresses, and dates of birth ... billing records for around 900 patients [including] diagnoses and treatment methods [and] bank account numbers"
        attribution: "University Hospital Freiburg (victim statement)"
        source_url: "https://www.uniklinik-freiburg.de/presse/pressemitteilungen/detailansicht/6807-cyberangriff-auf-externen-dienstleister-betrifft-auch-daten-von-patientinnen-des-universitaetsklinikums-freiburg.html"
    extended_notes: |
      Defender vantage: The attack pattern — exfiltration of data from a shared medical billing processor before (failed) encryption — closely mirrors the ARWINI pattern reported 2026-05-19 (same Kairos attribution per German regional press). The Swiss GDPR-equivalent nVDSG Article 24 and DSGVO Art. 33/34 notification requirements apply to any Swiss hospitals using similar shared-service billing models. Hospitals with outsourced billing should audit what billing-service providers hold GDPR Art. 9 data on their behalf and confirm that these processors have a DSFA in place and adequate Art. 32 technical measures. Detection note: the heise article confirms encryption was attempted but foiled — suggesting EDR/endpoint controls may have blocked ransomware execution while data exfiltration via the same initial access was not caught. Hunt for:  large outbound data transfers from billing/ERP systems over SMB or HTTPS with no corresponding inbound job trigger; authentication events on Unimed service accounts outside business hours; VSS deletion attempts that were blocked but preceded data staging.

  - title: "The Oncology Institute (TOI) SEC 8-K Item 1.05 — patient data confirmed accessed via unnamed vendor; Kroll engaged for credit monitoring (filed 2026-05-22)"
    sources:
      - { url: "https://www.sec.gov/Archives/edgar/data/0001799191/000107997326000721/toi_8k.htm", publisher: "SEC EDGAR (The Oncology Institute, Inc. 8-K)", date: "2026-05-22", role: "primary" }
      - { url: "https://www.minichart.com.sg/2026/05/23/the-oncology-institute-reports-cybersecurity-incident-affecting-software-vendor-form-8-k-filing-may-2026/", publisher: "Minichart (8-K content summary)", date: "2026-05-23", role: "corroborating" }
    discovery_trace: |
      first seen at: bridge:sec-edgar 8k tool, query window 2026-05-20 to 2026-05-24, Item 1.05 →
      primary: SEC EDGAR filing at https://www.sec.gov/Archives/edgar/data/0001799191/000107997326000721/toi_8k.htm (returned HTTP 403 on direct fetch and WebFetch) →
      corroborated by WebSearch "Oncology Institute SEC 8-K cybersecurity incident vendor patient data 2026" finding https://www.minichart.com.sg/2026/05/23/the-oncology-institute-reports-cybersecurity-incident-affecting-software-vendor-form-8-k-filing-may-2026/ and Globe and Mail press release aggregator
    summary: |
      The Oncology Institute, Inc. (NASDAQ: TOI), a US community oncology service provider, filed a material cybersecurity disclosure under SEC Item 1.05 on May 22, 2026. The filing is an escalation of a prior voluntary disclosure (Item 7.01, November 6, 2025) in which TOI reported a breach at an unnamed third-party software vendor. On May 20, 2026, Kroll — acting as third-party administrator for the Vendor — notified TOI that the Vendor had detected unauthorized access to information systems of the Company, including systems containing patient data. The November 2025 disclosure had stated no patient personal information was confirmed compromised; the May 2026 Item 1.05 filing confirms the situation has materially changed. Patient data categories potentially in scope include protected health information, patient names, treatment records, and other HIPAA-covered data categories inherent to oncology practice. TOI states it has not yet identified material impact on operations or quality of care. The company intends to offer credit monitoring and identity-theft protection services to affected patients through Kroll. Investigation is ongoing; no attribution or ransomware claim identified.
    ch_eu_nexus: "indirect — US-centric case; SEC Item 1.05 breach-disclosure process may be referenced by CH/EU GDPR Art. 33/34 compliance practitioners as a benchmark for materiality assessment timelines and third-party notification obligations"
    public_sector_nexus: "indirect"
    sector: "healthcare"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "On May 20, 2026, Kroll, who is the third-party administrator for the Vendor, notified the Company that the Vendor had detected unauthorized access by a third party to certain information systems of the Company, including systems affecting data of patients."
        attribution: "Minichart (quoting SEC 8-K)"
        source_url: "https://www.minichart.com.sg/2026/05/23/the-oncology-institute-reports-cybersecurity-incident-affecting-software-vendor-form-8-k-filing-may-2026/"
      - quote: "TOI will work with the Vendor to offer credit monitoring and protection to all impacted patients."
        attribution: "Minichart (quoting SEC 8-K)"
        source_url: "https://www.minichart.com.sg/2026/05/23/the-oncology-institute-reports-cybersecurity-incident-affecting-software-vendor-form-8-k-filing-may-2026/"
    extended_notes: |
      Defender relevance: The filing exemplifies the SEC cyber-disclosure materiality threshold being met when a third-party vendor's initial "investigation ongoing, no confirmed personal information compromised" evolves into confirmed patient-data access. GDPR-equivalent Art. 33 72-hour notification obligation would similarly be triggered at the point TOI received Kroll's May 20 notification (the original November 2025 Item 7.01 disclosure predates confirmed patient-data access). Third-party / supply-chain incident responders should note this two-stage disclosure pattern as a template for escalation: initial incident at vendor (November 2025) → eventual confirmation of downstream customer data access 6 months later → material disclosure.

