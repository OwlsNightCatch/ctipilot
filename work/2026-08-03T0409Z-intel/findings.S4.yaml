      Filing timestamp is ~54-60h before this run (outside the strict 24h floor, inside the 72h developing allowance); no update since first publication as of this run. Genuinely new — no prior-coverage or registry match for "Amgen". Thin on technical specifics by design (Amgen has not named the cloud vendor, vector, or actor) — flagged here for regulatory/pattern-recognition value (SEC EDGAR 8-K Item 1.05 ground truth) rather than for a detection/hardening lever, which the filing does not support.
