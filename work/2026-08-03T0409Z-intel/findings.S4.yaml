  - title: "Amgen discloses SEC Item 1.05 material cybersecurity incident — patient PHI and proprietary data exfiltrated from third-party cloud environments"
    sources:
      - { url: "https://www.sec.gov/Archives/edgar/data/318154/000031815426000119/amgn-20260729.htm", publisher: "Amgen Inc. / SEC EDGAR (Form 8-K, Item 1.05)", date: "2026-07-31", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/amgen-says-cloud-data-breach-exposed-patient-health-proprietary-info/", publisher: "BleepingComputer", date: "2026-07-31", role: "corroborating" }
    discovery_trace: "first seen at: sec-disclosures-edgar, `python3 tools/fetch_source.py sec-edgar 8k 2026-07-27 2026-08-03 1.05` → primary: Amgen's own Form 8-K, URL https://www.sec.gov/Archives/edgar/data/318154/000031815426000119/amgn-20260729.htm → corroborating: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/amgen-says-cloud-data-breach-exposed-patient-health-proprietary-info/"
    summary: |
      Amgen Inc. filed a Form 8-K under Item 1.05 (Material Cybersecurity Incidents) on 2026-07-31, its own first-party disclosure that in July 2026 it identified "unauthorized activity involving data stored in cloud environments hosted by third-party cloud service providers." Amgen states data — including proprietary data and patient protected health information (PHI) — has been exfiltrated from these environments, and it determined the incident material on 2026-07-29 "in connection with our evaluation of the volume of the files that appear to have been impacted." No vendor name, initial-access vector, CVE, or threat-actor attribution is disclosed in the filing; the investigation is described as ongoing and Amgen states it does not currently believe the incident is reasonably likely to have a material financial impact. This is a first-party regulatory ground-truth disclosure (not a leak-site claim) from one of the world's largest biopharmaceutical companies, and fits the recurring 2026 pattern of healthcare/life-sciences data reaching attackers through a third-party SaaS/cloud environment rather than the primary company's own network (compare CareCloud, Brinks Home/Salesforce, CCI Nice — all in the current 14-day window) — a pattern directly transferable to Swiss/European healthcare, pharma and public-sector organisations that rely on outsourced cloud platforms for clinical, HR or citizen data.
    region_nexus: "global (US-headquartered, Thousand Oaks, CA); Amgen operates clinical trials, manufacturing and commercial functions across the EU/EEA (incl. Ireland, Netherlands) so EU-resident patient/employee data exposure cannot be excluded from the filing text alone"
    primary_sector_nexus: "indirect — healthcare/life-sciences (profiled additional sector); no direct Swiss/EU government or CI nexus stated"
    sector: "healthcare, pharma"
