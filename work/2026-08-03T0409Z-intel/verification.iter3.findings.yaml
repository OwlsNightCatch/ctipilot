  item: "2026-08-03/bouncy-castle-java-1-85-32-cves-tls-pkix-validation — CVE-2026-58062 paragraphs"
  url_or_quote: "In CVE-2026-58062 the JCA revocation checker accepts a stapled OCSP response that was never bound to the certificate being checked, so a validly-signed \"good\" response covering some other certificate is treated as proof the end-entity is unrevoked instead of being rejected in favour of a CRL fallback."
  summary: "No inline citation, and the page that carries these mechanics — https://github.com/bcgit/bc-java/wiki/CVE%E2%80%902026%E2%80%9058062 — is absent from sources[] (which lists only the release notes and the -59638, -8763, -59650 pages). The release notes carry only the one-liner ('CVE-2026-58062 - Stapled OCSP response accepted without binding to the checked certificate.'), not the CRL-fallback or ProvOcspRevocationChecker detail. The errata paragraph ('the page filed under the CVE-2026-58062 slug initially displayed the write-up for CVE-2026-58063 ... The maintainer has since corrected it') is likewise an uncited assertion about two uncited pages. Fix: add the CVE-2026-58062 wiki URL as a primary source record and cite it at both places. The page fetched cleanly through tools/fetch_source.py url this iteration, so there is no transport obstacle. NOTE FOR THE MAIN AGENT: the past-tense errata framing is CORRECT as written and should not be touched — the 58062 page now shows the OCSP write-up and is marked '2 revisions', while the 58063 page shows the BCFKS keystore write-up at '1 revision'."
