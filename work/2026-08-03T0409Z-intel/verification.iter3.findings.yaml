  item: "2026-08-03/gladinet-centrestack-hardcoded-key-token-forgery — sourcing_note"
  url_or_quote: "the advisory pages carry the mechanics but not the scores, which is why severity appears in metadata rather than as a cited claim in the body"
  summary: "Contradicted by all six cited pages. Every VulnCheck advisory fetched this iteration renders a severity word, a numeric CVSS and the v4 vector inline — e.g. https://www.vulncheck.com/advisories/centrestack-hardcoded-key-token-forgery-rce reads 'severity critical date 7/30/2026 ... CVSS 9.3 CVSS V4 Vector CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:N/SC:N/SI:N/SA:N'; the other five likewise (8.8, 8.7, 8.7, 8.7, 6.9). This looks like the Bouncy Castle sourcing note copied across — there the same statement is true (verified: zero occurrences of any CVSS score on the release notes or the per-flaw wiki pages). Fix: delete or invert the clause. The rest of the note holds — VulnCheck is confirmed as the assigning CNA for all six, and the CVE records reference only centrestack.com (a product homepage) besides the VulnCheck advisories, so 'no vendor advisory page ... reachable' is accurate."
