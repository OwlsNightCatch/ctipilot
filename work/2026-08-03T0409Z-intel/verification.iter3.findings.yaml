  item: "2026-08-03/bouncy-castle-java-1-85-32-cves-tls-pkix-validation — cves[] affected/fixed for CVE-2026-12852, -59643, -59644, -59652"
  url_or_quote: "affected: \"Bouncy Castle for Java < 1.85 (BC-LTS < 2.73.12)\" / fixed: \"1.85 (BC-LTS 2.73.12)\""
  summary: "All 32 cves[] records carry the identical BC-LTS parenthetical, but four of them contradict the owning authority. The maintainer's per-flaw pages, fetched this iteration, read: CVE-2026-12852 'Issue affecting: BC before 1.85 (from 1.73). Fixed versions: BC 1.85.'; CVE-2026-59644 identical; CVE-2026-59652 'Issue affecting: BC before 1.85. Fixed versions: BC 1.85.'; CVE-2026-59643 'Issue affecting: BC before 1.85 (from 1.81), BC-FJA before bcpg-fips 2.0.13 (from 2.0.12). Fixed versions: BC 1.85, BC-FJA bcpg-fips 2.0.13.' The CNA records agree — cveawg.mitre.org/api/cve/<id> lists only BC-JAVA (plus BC-FJA for -59643) in affected[], with defaultStatus 'unaffected' and no BC-LTS-JAVA block; the other 28 all carry BC-LTS-JAVA 2.73.0<2.73.12. Fix: drop the '(BC-LTS ...)' parenthetical from affected/fixed on those four records only. (All 32 ids and all 32 CVSS scores were re-verified against the CNA records this iteration and match exactly.)"
