  item: "runs/2026-08-03/2026-08-03T0409Z-intel — Published bullet, Bouncy Castle"
  url_or_quote: "Four independent certificate-validation bypasses in a library that is almost always a transitive dependency is exactly the shape a defender cannot act on without being told."
  summary: "Wrong by one. Only three of the four CVSS 9.3 flaws attack certificate validation (CVE-2026-58062 OCSP binding, CVE-2026-59638 JSSE CN-fallback, CVE-2026-8763 name constraints). The fourth, CVE-2026-59650, involves no certificate: the maintainer's own page (https://github.com/bcgit/bc-java/wiki/CVE%E2%80%902026%E2%80%9059650, fetched this iteration) says DHAgreement 'raises the raw peer-supplied message to the power of the local static private key x without any range or subgroup-membership check' and that CRT combination 'recovers the full static private key'. This is the exact framing error iteration 1 recorded as F4 and fixed in the entry; the published run-record notes still carry it. Fix: 'Three independent certificate-validation bypasses plus a static Diffie-Hellman key-recovery flaw', matching the entry and this record's own findings[] entry."
