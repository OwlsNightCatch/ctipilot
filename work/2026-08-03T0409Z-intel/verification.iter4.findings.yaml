  section: operational
  item: "CVE-2026-18556 / CVE-2026-18577 — N-able N-central: unauthenticated admin access to the RMM console, exploited in the wild, and the day-one fix was itself bypassable"
  url_or_quote: "N-able first addressed the issue in 2026.2 and, on 1 August, told customers still on older builds to move to 2026.3 as an immediate protective measure — its initial advisory tied the exploitation to CVE-2026-18556, while the hotfix that followed pointed at CVE-2026-18577 ([Huntress, 2026-08-03])"
  summary: "The trailing Huntress citation supports only the CVE-attribution clause (confirmed verbatim on the live page); Huntress never mentions '2026.2' and never recommends upgrading to plain 2026.3. Those facts are true and stated by N-able's own blog (cited earlier in the same paragraph for a different sentence: 'We had addressed this issue in later builds and were recommending that customers on older versions upgrade to version 2026.3 as an immediate protective measure' / 'which was fixed in 2026.2') but the citation attached to this sentence is the wrong co-cited source."
- code: F4
  category: hallucinated-fact
  section: operational
  item: "CVE-2026-18556 / CVE-2026-18577 — N-able N-central: unauthenticated admin access to the RMM console, exploited in the wild, and the day-one fix was itself bypassable"
  url_or_quote: "in service-installation telemetry the durable artifact is an unexpected `Cloudflared` service"
  summary: "Live-searched both cited sources (N-able blog, Huntress post) for the string 'Cloudflared'; absent from both. N-able says only 'the attackers registered a new service for a CloudFlare tunnel'; Huntress says only 'deploy Cloudflare-based tunnels for persistence'. Neither names the service 'Cloudflared'. The invented specific name appears three times: body detection paragraph, the Triage discriminator, and action item 2 — all load-bearing hunt/triage guidance."
