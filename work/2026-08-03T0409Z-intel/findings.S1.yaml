        attribution: "bc-java wiki (CVE-2026-58063)"
        source_url: "https://github.com/bcgit/bc-java/wiki/CVE%E2%80%902026%E2%80%9058063"
    extended_notes: |
      Detection/hunt (no BC-specific network signature exists — this is a library-level trust-boundary
      class): treat as an SBOM/SCA problem first — inventory org.bouncycastle groupId artifacts (bcprov,
      bcpkix, bctls, bcpg, bcmail, bc-fips family) below 1.85 / 2.73.12 / per-module FIPS fixed versions
      across build manifests, container images and Android APKs. Where BC underlies a TLS client that
      terminates on adversary-influenced networks (VPN concentrators, partner integrations, on-path-
      capable segments), watch for anomalous certificate-chain acceptance where CRL fallback should have
      fired (OCSP responder logs showing a response whose subject/serial does not match the requested
      cert), and for JSSE peers accepting mismatched-CN certificates lacking a dNSName SAN. Hardening
      levers usable before a full upgrade: explicitly set the JSSE_HOSTNAME_CHECK_CN_FALLBACK override to
      false (CVE-2026-59638 mitigation named in the advisory); set org.bouncycastle.pkcs1.strict_digestinfo
      to enforce the fixed RSA PKCS#1 comparison bound (CVE-2026-12860); the DH/name-constraint/OCSP flaws
      have no config-toggle workaround and require the version upgrade. This is a single disclosure event
      (one vendor release, one advisory page) covering 31 CVE ids — reported as one item per PD-11 rather
      than 31 near-duplicate entries; cves[] carries the full list for dedup purposes.
    borderline: false

  - title: "N-able N-central RMM: unauthenticated admin-console auth bypass under active exploitation — the emergency Aug 1 patch was itself bypassable within 24 hours (CVE-2026-18556 / CVE-2026-18577)"
    sources:
      - { url: "https://www.huntress.com/blog/n-able-vulnerability-exploitation", publisher: "Huntress", date: "2026-08-03", role: "primary" }
      - { url: "https://www.n-able.com/blog/n-central-security-update-august-2-2026", publisher: "N-able (vendor PSIRT blog)", date: "2026-08-02", role: "primary" }
      - { url: "https://status.n-able.com/2026/08/02/n-central-2026-3-hotfix-1-mitigation-for-cve-2026-18577/", publisher: "N-able status page (hotfix notice)", date: "2026-08-02", role: "primary" }
      - { url: "https://nvd.nist.gov/vuln/detail/CVE-2026-18577", publisher: "NVD", date: "2026-08-02", role: "corroborating" }
      - { url: "https://nvd.nist.gov/vuln/detail/CVE-2026-18556", publisher: "NVD", date: "2026-08-01", role: "corroborating" }
    discovery_trace: >
      first seen at: WebSearch ("CVE exploited zero-day August 2 2026")
      → pivot: Huntress, URL https://www.huntress.com/blog/n-able-vulnerability-exploitation (published 2026-08-03)
      → primary: N-able vendor advisory, URL https://www.n-able.com/blog/n-central-security-update-august-2-2026
      → primary: N-able status-page hotfix notice, URL https://status.n-able.com/2026/08/02/n-central-2026-3-hotfix-1-mitigation-for-cve-2026-18577/
      → corroborating: NVD records for both CVE ids
      NOTE: two search results ("CSO Online" and a second BleepingComputer headline) that superficially
      matched this story were checked and found to describe an UNRELATED, year-old N-central incident
      (CVE-2025-8875/CVE-2025-8876, published August 2025) — dropped as recycled/mis-dated news per PD-10
      and not cited here.
    summary: |
      N-able disclosed and patched a critical authentication-bypass chain in N-central, its on-premises
      and hosted RMM platform for MSPs, across two emergency releases inside 48 hours. CVE-2026-18556
      (published 2026-08-01, CVSS 4.0 8.2 HIGH, CWE-288 Authentication Bypass Using an Alternate Path or
      Channel) is an unauthenticated bypass of the N-central web console's identity check, affecting all
      versions through 2026.3. N-able's first fix was itself incomplete: CVE-2026-18577 (published
      2026-08-02) is described by its own CNA record as "an incomplete patch for CVE-2026-18556 [that]
      allows for authentication bypass and account takeover in N-central Versions through 2026.3.1" — i.e.
      organizations that patched on day one against CVE-2026-18556 remained exploitable for roughly another
      24 hours until build 2026.3.1.7 (2026-08-02) closed the gap. N-able confirms active in-the-wild
      exploitation against both cloud-hosted and self-hosted N-central instances ("a limited number of
      customers have been identified to be impacted") and the CVE-2026-18577 CVSS 4.0 vector itself carries
      an Exploitation Maturity rating of E:A (Attacked). Huntress independently corroborates active
      exploitation from its own IR telemetry: attackers who reach unauthenticated admin access on a
      vulnerable N-central server pivot through the platform's built-in Take Control remote-access feature
      to reach every downstream endpoint that server manages, and register a Cloudflare Tunnel (a
      "Cloudflared" Windows service) for command-and-control persistence back into the compromised
      environment. Both vendor and Huntress point to the same post-exploitation footprint: an unexpected
      "Cloudflared" service registration and an svchost.exe binary dropped under a user's Documents folder
      (a location the legitimate Windows service host process never runs from — any svchost.exe outside
      System32/SysWOW64 is inherently suspicious). N-able's own detection guidance also names outbound
      connections from N-central hosts to attacker-controlled external IPs. No threat actor or ransomware
      affiliate has been named by either source as of this run.
    region_nexus: "global — N-central is deployed heavily by managed service providers (MSPs) that serve SMB, cantonal/communal administration and mid-market critical-infrastructure customers across Switzerland and the EU; a compromised N-central server is a direct pivot point into every managed downstream network"
    primary_sector_nexus: "indirect"
    sector: "public-sector, energy, water, transport, healthcare, finance, telco"
    cves: [CVE-2026-18556, CVE-2026-18577]
