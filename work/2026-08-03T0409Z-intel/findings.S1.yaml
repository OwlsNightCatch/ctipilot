      - quote: "A malicious peer can repeatedly send small-order elements (0, 1, p−1, or elements of small subgroups of (Z/pZ)*), and each exchange leaks x mod r for some small prime r; combining these via CRT recovers the full static private key (Lim–Lee 1997)."
        attribution: "bc-java wiki (CVE-2026-59650)"
        source_url: "https://github.com/bcgit/bc-java/wiki/CVE%E2%80%902026%E2%80%9059650"
