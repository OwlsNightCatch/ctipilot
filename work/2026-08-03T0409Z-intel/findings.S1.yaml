    discovery_trace: >
      first seen at: enisa-euvd, URL https://euvd.enisa.europa.eu/ (bridge: enisa-euvd recent criticals)
      → four CVSS 9.3 Bouncy Castle entries with today's datePublished
      → pivot: bc-java GitHub wiki per-CVE pages, URL https://github.com/bcgit/bc-java/wiki/CVE%E2%80%902026%E2%80%9058062 (and siblings)
      → discovered EUVD's CVE-id-to-description binding for CVE-2026-58062 conflicts with the wiki page under that exact slug
      → cross-checked: NVD, URL https://nvd.nist.gov/vuln/detail/CVE-2026-58062 confirms EUVD's binding (OCSP), meaning the wiki page for that slug currently duplicates CVE-2026-58063's content (a vendor documentation bug, not a numbering shift)
      → primary: bc-java official release notes (raw.githubusercontent.com), URL https://raw.githubusercontent.com/bcgit/bc-java/main/docs/releasenotes.html — the authoritative "2.2.4 Security Fixes" list for release 1.85/1.85.1, confirming all 31 CVE-id-to-one-line-description bindings
      → pivot: fix commit for CVE-2026-58062, URL https://github.com/bcgit/bc-java/commit/add5f822660f3b2c29fd824e2f4095469c42a1c7.patch — root-cause diff naming the vulnerable class (ProvOcspRevocationChecker)
    summary: |
      Bouncy Castle for Java 1.85 (GA'd 2026-07-12) and the matching BC-LTS 2.73.12 / BC-FJA (FIPS)
      point releases carry fixes for 31 CVEs whose CVE-numbering-authority (bcorg) descriptions and
      technical write-ups were only published this week (most on 2026-08-02/03) — three weeks after
      the fixed binaries already shipped. Four flaws score CVSS 4.0 9.3 CRITICAL and each independently
      defeats a distinct TLS/PKIX certificate-chain-validation guarantee: (1) CVE-2026-58062 — the JCA
      PKIXRevocationChecker's OCSP-stapling path (org.bouncycastle.jce.provider.ProvOcspRevocationChecker)
      accepted a stapled, validly-signed OCSP "good" response whose SingleResponse CertID did not match
      the end-entity certificate under test (e.g. a response covering the issuing CA's own cert), silently
      treating it as proof the end-entity was not revoked instead of rejecting it and falling back to CRL;
      (2) CVE-2026-59638 — HostnameUtil gates the legacy "match Subject CN when no dNSName SAN exists"
      hostname-verification fallback on Properties.isOverrideSet(JSSE_HOSTNAME_CHECK_CN_FALLBACK, true),
      whose two-argument overload returns the caller-supplied default of true when the property is unset,
      so the fallback ships ENABLED in every deployment that does not explicitly disable it — combined
      with RFC 5280 name-constraint scoping (constraints bind only SAN entries of the constrained type),
      a leaf certificate with no dNSName SAN passes a dNSName-constrained chain and then matches on an
      attacker-chosen CN; (3) CVE-2026-59650 — the MTI/A0 two-pass Diffie-Hellman agreement
      (DHAgreement.calculateAgreement) exponentiates the raw, wire-supplied peer value with no range or
      subgroup-membership check (unlike DHBasicAgreement, whose single input IS validated), letting a
      malicious peer send repeated small-order elements (0, 1, p-1, or small-subgroup elements) to leak
      the static private key mod small primes and recover it in full via CRT (the classical Lim-Lee 1997
      small-subgroup-confinement attack); (4) CVE-2026-8763 — PKIXNameConstraintValidator strips trailing
      dots before comparing dNSName constraints but compares rfc822Name and URI hosts with a bare
      equalsIgnoreCase, so a SAN rfc822Name of "ceo@bank.com." (trailing dot) silently evades an
      excludedSubtrees constraint of "bank.com", letting an attacker who controls a name-constrained
      intermediate CA issue certificates for hosts the constraint was meant to exclude. A further ~14 CVEs
      in the same release are High-severity (CVSS 8.7) integrity/authenticity bypasses across CMS, S/MIME,
      OpenPGP and AEAD code paths — e.g. CVE-2026-12860 (RSA PKCS#1 signature verification silently skips
      the last two hash bytes on the legacy NULL-omitted DigestInfo path, shaving 2^16 off the
      second-preimage work factor, reachable by default from BC-lightweight TLS, PKIX/CMS and OpenPGP RSA
      verification unless org.bouncycastle.pkcs1.strict_digestinfo is set), CVE-2026-59639 (CMS
      verifySignatures returns true for a SignedData with zero signers), CVE-2026-59641 (S/MIME path
      validation trusts a signer-asserted signingTime instead of validating against the signer's actual
      chain state) and CVE-2026-12803/CVE-2026-58061 (AEAD/CCM nonce-binding and plaintext-before-tag-check
      issues that turn authenticated decryption into a forgery or decryption oracle). The remainder are
      resource-exhaustion/DoS bugs (unbounded KDF cost in BCFKS/PKCS#12/PKCS#8 keystore loading, quadratic-
      time X.500 DN stringification, unbounded HSS post-quantum public-key allocation, unchecked 24-bit
      DTLS reassembly length). No CVE in the batch is listed as actively exploited by any tracked source
      as of this run, and CISA KEV shows no BC-related addition. Because BC 1.85 shipped 2026-07-12, any
      organization that upgraded on GA already closed all 31 issues before today's CVE detail became
      public; organizations still on BC before 1.85 / BC-LTS before 2.73.12 / BC-FJA before the
      per-module fixed builds are now publicly known to carry at least four CVSS-9.3 TLS-validation
      bypasses with full root-cause detail and fix commits in hand for anyone building an exploit.
      Defender note: cross-checking the vendor's own wiki against NVD/EUVD surfaced that the wiki page
      filed under the CVE-2026-58062 URL slug currently duplicates CVE-2026-58063's (unrelated, lower-
      severity) BCFKS-keystore write-up rather than the OCSP issue NVD/EUVD/the official release notes
      attribute to that ID — a live documentation-binding error on the vendor's advisory index, not a
      CVE mix-up on the CNA's part. Treat the release notes and NVD/EUVD as authoritative for ID-to-flaw
      binding in this batch and do not trust the wiki-page slug alone.
