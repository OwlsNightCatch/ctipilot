        attribution: "N-able"
        source_url: "https://www.n-able.com/blog/n-central-security-update-august-2-2026"
      - quote: "A limited number of customers have been identified to be impacted"
        attribution: "N-able"
        source_url: "https://www.n-able.com/blog/n-central-security-update-august-2-2026"
      - quote: "an incomplete patch for CVE-2026-18556 allows for authentication bypass and account takeover in N-central Versions through 2026.3.1"
        attribution: "NVD (CVE-2026-18577 official description, CNA: N-able)"
        source_url: "https://nvd.nist.gov/vuln/detail/CVE-2026-18577"
      - quote: "Exploitation is active in the wild; a compromised N-central server can be used to run scripts, push tools, and open remote sessions across every downstream endpoint it manages."
        attribution: "Huntress"
        source_url: "https://www.huntress.com/blog/n-able-vulnerability-exploitation"
      - quote: "The vulnerability affects all currently supported versions of N-central, including builds that were initially believed to be safe."
        attribution: "Huntress"
        source_url: "https://www.huntress.com/blog/n-able-vulnerability-exploitation"
    extended_notes: |
      Detection/hunt (telemetry class first): authentication-log class — review N-central console
      sign-in/session logs for administrative actions with no corresponding legitimate credential use;
      endpoint remote-access-tool class — audit Take Control session logs and breadcrumbs at
      C:\ProgramData\GetSupportService_N-Central\Logs\ on managed endpoints for sessions not tied to a
      known support ticket or technician; process-creation class — svchost.exe (or any process named to
      impersonate a core Windows service binary) launching from a user profile/Documents path is a hard
      discriminator, since the legitimate binary only ever runs from System32/SysWOW64; service-
      installation class — an unexpected "Cloudflared" Windows service registration on either the
      N-central server or a managed endpoint; network/egress class — outbound connections from the
      N-central management host to Cloudflare Tunnel infrastructure or other unexpected external
      destinations. Hardening: upgrade on-premises N-central to build 2026.3.1.7 (or later) immediately —
      hosted/cloud instances were upgraded automatically by N-able; enforce MFA on the N-central console;
      audit all local/admin accounts created on N-central in the exploitation window; restrict network
      reachability to the N-central management interface (it should not need to be internet-exposed for
      normal MSP operation). Given RMM software is a one-to-many pivot into every downstream managed
      endpoint (the same blast-radius class as the 2021 Kaseya VSA and 2023 GoAnywhere incidents),
      confirmed active exploitation plus a same-week double-patch cycle (first fix bypassed within ~24h)
      justifies a critical priority rating despite the "only" HIGH (not CRITICAL) CVSS base score on both
      individual CVE ids.
