  - claim_id: 502b97acbe
    entry: 2026-10-16/cl-unk-1211-ai-assisted-intrusions-government-linux-hosts
    surface: "summary"
    kind: frontmatter
    text: "Unit 42 reports CL-UNK-1211, a cluster of unknown nation-state or criminal affiliation that between October 2025 and April 2026 targeted government entities and state-affiliated infrastructure, focusing on Linux servers to run reconnaissance and keep persistent access for intelligence collection. Its scripts carry AI-style reasoning comments, which Unit 42 reads as LLM-generated code or an AI agent's work; the intrusions used PHP web shells with auto_prepend_file persistence on Plesk hosts, a replaced .bashrc that traps sudo passwords, SUID root shells, searches of mail directories and log cleanup. Unit 42 names no victim or country, does not say how the web shells were first placed, and is the only source."
