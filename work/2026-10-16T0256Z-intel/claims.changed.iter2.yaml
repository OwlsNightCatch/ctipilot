claims:
  - claim_id: 77859076ef
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "summary"
    kind: frontmatter
    text: "Atlassian's advisory of 2026-10-05 fixes CVE-2026-21589, an unauthenticated arbitrary file access flaw in every version of Bitbucket, Confluence, Jira Service Management, Jira Software, Bamboo and Crowd Data Center, plus Crucible and Fisheye (CVSS 4.0 9.3), and tells customers to patch immediately or take internet-facing instances off the internet. watchTowr Labs published the root cause, the request shape and a runnable checker on 2026-10-06, and exploitation attempts followed the same day: Previdian's sensors had recorded 607 attempts from 65 addresses in 20 countries by 2026-10-16, SANS ISC recorded similar attempts on its own honeypots, and a Nuclei template exists; neither honeypot operator reports a compromise. CISA added the flaw to its Known Exploited Vulnerabilities catalog on 2026-10-15 on evidence of active exploitation, without saying what the evidence is. Where Jira is integrated with Crowd, the file read exposes a plaintext Crowd application password that gives access to Crowd as an administrator of that application."
  - claim_id: e4efc52292
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "section 2026-10-16T04:11:30Z"
    kind: cited
    text: "Previdian's page, updated 2026-10-16, now counts 607 attempts from 65 unique addresses in 20 countries across five sensors between 2026-10-06 and 2026-10-15, up from at least 129 attempts from at least 22 addresses on 2026-10-08, and lists the flaw as in the CISA catalog ("
    urls: ["https://previdian.com/CVE-2026-21589"]
  - claim_id: a7153d7ce2
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "section 2026-10-16T04:11:30Z"
    kind: uncited
    text: "The alert does not say what the evidence is, who is exploiting the flaw or whether any attempt succeeded, so no public source reports a compromise."
  - claim_id: 9bafc1cab9
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "record 2026-10-16T04:11:30Z"
    kind: record-summary
    text: "CISA added CVE-2026-21589 to its Known Exploited Vulnerabilities catalog on 2026-10-15 on evidence of active exploitation, which moves the flaw from honeypot-observed attempts to government-confirmed exploitation; CISA names neither the evidence, the actor nor any victim, and no public source reports a compromise; Previdian's honeypot count has grown to 607 attempts from 65 addresses in 20 countries."
