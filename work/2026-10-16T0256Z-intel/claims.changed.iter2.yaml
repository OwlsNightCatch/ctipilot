    entry: 2026-10-16/cve-2026-102764-beyondtrust-remote-support-zero-day
    surface: "body"
    kind: cited
    text: "**Detection:** the actor deletes on-appliance logs, so use other copies: forwarded syslog for user changes that raise a Jump Item or Team role to Administrator and for account or API-account changes without a change ticket; authentication logs for administrative /login success from residential-broadband or commercial-VPN address space; reverse-proxy or WAF logs for unknown .php paths and WebSocket upgrades from non-support addresses; file transfers by accounts whose roles changed ("
    urls: ["https://cloud.google.com/blog/topics/threat-intelligence/armory-castle-exploits-beyondtrust/"]
