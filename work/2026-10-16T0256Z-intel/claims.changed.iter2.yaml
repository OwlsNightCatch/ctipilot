    surface: "body"
    kind: cited
    text: "**Triage:** a known administrator changing Jump Item roles or signing in from a new network under a change ticket is routine; BeyondTrust's signals are privileged sessions from residential or VPN addresses tied to no administrator or ticket and unrecognized script files in web directories ("
