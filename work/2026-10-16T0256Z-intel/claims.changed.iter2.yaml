  - claim_id: 1b824e95f8
    entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
    surface: "section 2026-10-16T04:09:30Z"
    kind: cited
    text: "Bitdefender MDR reports three intrusions through the chain, the first two beginning around 7 to 8 October and a third identified on 14 October; in the first two, attackers validated access with JSP webshells, staged PowerShell and command files in C:\\Users\\Public, tried to persist, and in one searched for stored credentials and elevated an account to SYSTEM; in the second, obfuscated PowerShell also installed and configured OpenSSH, which gives a way back that does not depend on the vulnerable web service, so patching alone does not end the incident, and follow-on scripts were staged on a subdomain of a public static-site hosting service; it attributes the activity to no named actor, and notes that the file names, tools and binaries differed from one incident to the next, so the dependable signal is how the server behaves after the exploit fires ("
    urls: ["https://www.bitdefender.com/en-us/blog/businessinsights/technical-advisory-ahsaycbs-exploitation-chain-cve-2026-105133-cve-2026-105134"]
  - claim_id: 18f6e38abb
    entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
    surface: "record 2026-10-16T04:09:30Z"
    kind: record-summary
    text: "Ahsay says its previous patches v9.15.2.59 and v10.3.4.0 did not fully fix the flaws and names the hotfixes v10.3.4.45 and v9.15.2.70, available only to partners; Huntress verified the v10 hotfix, CISA added both flaws to its Known Exploited Vulnerabilities catalog on 2026-10-14, and Bitdefender MDR describes three intrusions through the chain. The entry moves from no fixed release to hotfix available and from notable to high."
  - claim_id: c7501317f7
    entry: 2026-10-11/idc-frontier-idcf-cloud-ransomware-495-customers-backups
    surface: "summary"
    kind: frontmatter
    text: "IDC Frontier, a SoftBank Group subsidiary, says a ransomware attack from about 3:40 a.m. on 2026-10-07 stopped four zones of its IDCF Cloud East Japan Region 1, affecting 495 companies and local governments whose virtual servers stopped and cannot be restarted. Its fifth report (2026-10-14) says, after its third report had expected data to be recoverable only from customers' own backups, that its backup data is confirmed safe and can be retrieved for the 194 affected customers that used its snapshot function, and that it found no trace of customer data being queried or taken and therefore judges no data left; the intrusion route is not public. Municipal and prefectural websites were among those that went down."
