      3) The Swiss police platform cybercrimepolice.ch (NEDIK, 2026-10-13) warns that criminals could use leaked personal and financial data from "a software service provider of a pension fund" (IT infrastructure hit by a ransomware attack at the end of September 2026, with a data outflow) to phone insured persons posing as financial advisers or brokers and steer them into fraudulent investments of their pension capital; it tells pension funds to be aware that fraudsters can pose as insured persons, to verify identity through additional measures and to tell insured persons that knowing personal data or the pension balance is no proof that a caller is trustworthy. CAUTION: the page does not name the supplier, so "ransomware" cannot be assigned to PK Softech (which says "malware") rather than to the FAR's separate IT partner; do not rewrite the PK Softech entry's vector wording from this page. It is, though, the first Swiss police statement in this cluster and describes the fraud pattern the incident enables (vishing with data-bearing pretext, T1598.004 / T1566.004 voice-phishing class).
      NOT KNOWN: access vector and actor for either supplier; any ransom demand or leak-site listing (none found); which data of which fund left.
