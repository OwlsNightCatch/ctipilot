    summary: |
      DELTA against the covered entry (which records the Huntress exploitation report of 2026-10-08, a contested patch position and 'restrict the interface until a patch is available').
      FACTS. Ahsay's announcement says its previous patches v9.15.2.59 and v10.3.4.0 "did not fully address" CVE-2026-105133 (improper authentication in the checkSysPwd function of the API component, CWE-287) and CVE-2026-105134 (OS command injection in the Replication Receiver endpoint /rps/api/json/UpdateReceivers.do, CWE-77/78), and tells partners to apply the AhsayCBS v10.3.4.45 hotfix on v10 or the v9.15.2.70 hotfix on v7, v8 and v9, then reboot; the hotfixes sit behind a partner-portal login and the announcement lists no workaround.
      Huntress's update of 2026-10-12 says Ahsay released the hotfix that day and that Huntress "independently verified" the 10.3.4.45 hotfix mitigates the initial entry point, which was still open on earlier v10 builds. CISA added both CVEs to KEV on 2026-10-14 with a federal due date of 2026-10-17 and knownRansomwareCampaignUse 'Unknown' (KEV catalog data). Bitdefender's MDR advisory of 2026-10-15 reports three AhsayCBS intrusions starting about 2026-10-07/08, a third identified on 10-14: JSP webshells planted to validate access, PowerShell staged from a static-site-hosting subdomain, command files staged in C:\Users\Public, persistence attempts, credential reconnaissance, an account elevated to SYSTEM and, in one case, OpenSSH installed through obfuscated PowerShell; MDR blocked parts of two incidents early and saw no encryption, exfiltration or ransomware deployment.
      ASSESSMENT (Bitdefender, not a finding): the exploit chain was constant while tools and file names differed, shared infrastructure in the first two incidents, and several actors may be using the chain; Bitdefender "do[es] not attribute this activity to any named actor". Bitdefender notes the NVD entries still list 10.3.4 as unaffected and that the vendor's later advisory supersedes that.
      Exposure test (Bitdefender, citing Ahsay KB5009): the installed build is shown in the AhsayCBS web console under System Settings > License > Update License (Product Version); fixed means v10.3.4.45 or later (v10) or v9.15.2.70 or later (v7-v9); a server on 10.3.4.0 or 9.15.2.59 is still vulnerable. Post-patch compromise check: a patched server may already be compromised — look for JSP files in the application directory, service-process child processes and PowerShell staging (the entry's existing Detection lines apply).
