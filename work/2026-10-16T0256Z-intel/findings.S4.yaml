    discovery_trace: "first seen at: state/coverage_backlog.md hold row for Beyond Gravity (2026-10-06, a carried-over lead, not a fresh slice hit); the lost first pass fetched the SRF, swissinfo, 20 Minuten, watson and Inside IT pages (url-liveness ledger 2026-10-16T03:11-03:13Z) and this resumed pass re-extracted every one of them -> WebSearch (\"Beyond Gravity cyberattack China SRF Geschaeftspruefungskommission Datenabfluss\") -> pivot: swissinfo, URL https://www.swissinfo.ch/eng/foreign-affairs/china-suspected-in-cyberattack-on-swiss-space-company/92221479 -> pivot: Inside IT, URL https://www.inside-it.ch/china-steckt-moeglicherweise-hinter-cyberattacke-auf-beyond-gravity-20261015 -> primary (original reporting): SRF, URL https://www.srf.ch/news/schweiz/beyond-gravity-china-im-verdacht-nach-cyberattacke-auf-schweizer-weltraumkonzern. The company's own 2026-10-02 release was searched for (WebSearch x2, beyondgravity.com/en/news extract) and not found; its content reaches us only through the Keystone-SDA / AWP relays (bluewin, swissinfo, Inside IT) and through the company's written answers quoted by SRF and Netzwoche."
    summary: |
      FACTS. Beyond Gravity, the Confederation-owned space supplier spun out of RUAG in 2022 (supplies the European Ariane programme and NASA), said on 2026-10-02 that
      it first saw signs of malicious activity in its IT environment on 2026-08-12, is investigating with the Federal Office for Cybersecurity (BACS) and Mandiant,
      has filed a criminal complaint and tightened security, and that a presumably highly professional actor is behind it; a spokesperson said it waited just under
      two months because premature disclosure would have endangered the forensic work (Keystone-SDA / AWP relays). On 2026-10-15 SRF reported that the chair of the Council of
      States' Control Committee, Maya Graf, confirmed that both parliamentary Control Committees "have taken note of the data outflow" and hold a report on the incident; what data
      left is not public. Beyond Gravity's written answer (Netzwoche) is that the origin of the attacker "is still not confirmed and remains the subject of ongoing inquiries"; the Federal Department of Defence (VBS), which investigates with BACS, does not confirm either. The Office of the Attorney General of Switzerland has not yet acted (Inside IT / swissinfo, relaying SRF); the criminal complaint is with the Bern cantonal prosecutor.
      CLAIM (single original source). SRF, citing "several involved persons", reports that Beyond Gravity and the Confederation assume China is the attacker. Neither SRF nor the follow-on outlets (Inside IT, swissinfo, 20 Minuten, watson, Netzwoche, all rewriting SRF) cite any technical evidence, and no authority or Mandiant has attributed the intrusion. Treat as an attributed suspicion, not an attribution; the independent-source count for the China claim is one.
      CONTEXT (swissinfo, not a claim about this case). RUAG, the parent, was breached in a long-running espionage operation disclosed in 2016 (suspected Russian origin; the Office of the Attorney General suspended the proceedings in 2018 for lack of an identified perpetrator); the break-up of that group left Beyond Gravity as the remaining space business. The Federal Council had planned to sell Beyond Gravity before Parliament barred the sale for security reasons.
      NOT KNOWN: initial access vector, intrusion technique, dwell-time breakdown, what data was taken, whether other federal bodies or customers are touched. No source states any ATT&CK technique; the only behavior the sources support is a targeted intrusion with data theft that went undisclosed for about seven weeks after first detection.
