  - title: "Arcadia SpeeCAN RAIDEN: intrusion at the supplier of municipal emergency-alert mail, call-out and NET119 emergency-call services exposes contact data of up to 3.1 million addresses and prompts spoofed-sender phishing; 111 Japanese public bodies reported to the ministry"
    novelty: new
    window_note: "First disclosure 2026-10-13 (about 60 h before this fire; inside the 72 h developing window, outside the 26 h window). In-window developments: vendor reports 7-9 (2026-10-15: service restored, all customers told to change passwords, authority reports listed), municipal restorations and further phishing reports on 2026-10-15, piyolog list updated 2026-10-16 AM. Missed by the three earlier fires because piyolog is a rotational record."
