    summary: |
      DELTA against the covered entry (last updated 2026-10-15). No development newer than 2026-10-14 was found.
      1) A second pension-sector supplier is in play. Inside IT (2026-10-14) names the Stiftung FAR (construction-sector early-retirement foundation) as checking whether its data fell into wrong hands; bluewin
      (relaying CH Media, 2026-10-13) says the FAR's IT partner "is a different provider than the one used by Publica", that personal data "appears to have fallen into the hands of criminals" and that the
      foundation has sent warning letters to about 20,000 retirees; tio.ch (relaying the Aargauer Zeitung) adds that a retired FAR beneficiary in central Switzerland received calls two days in a row from a
