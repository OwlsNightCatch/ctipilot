    discovery_trace: "first seen at: piyolog, URL https://piyolog.hatenadiary.jp/entry/2026/10/14/014350 (entry found by the lost first pass of this slice; listing https://piyolog.hatenadiary.jp/ re-read this pass) -> pivot: WebSearch (\"アルカディア SpeeCAN RAIDEN 不正アクセス 緊急速報 ランサムウェア 2026\"), which surfaced the vendor and NHK pages -> primary: Arcadia official blog, URL https://raiden.site.ktaiwork.jp/archives/4597 and corporate notice URL https://www.arcadia.co.jp/info/4076 -> municipal primaries via piyolog's source list: Yokosuka, Shizuoka, Shimonoseki Fire Bureau (URLs above) -> Nikkei (ministry count). Dead ends: Toyooka City PDF reads as a font-fragment extraction only (not cited); no ransomware claim or leak-site listing found (WebSearch, no ransomware.live hit); English-language coverage not found in one search."
    summary: |
      FACTS (victim and municipal primaries). Arcadia Inc. (Minoh, Osaka) operates SpeeCAN RAIDEN, a disaster-information mail / telephone / FAX distribution service, plus NET119 (an emergency-call system through which people with hearing or speech impairments pre-register to place 119 calls from a smartphone,
      per Shimonoseki Fire Bureau), 119RAIDEN and the Raiden School service; per Nikkei and Piyolog it served 875 municipalities at the end of September. Arcadia says it saw suspicious behaviour suggesting unauthorized access on 2026-10-11 at 16:30 (JST), applied a stop-gap that closed the entry route at about 03:00 on 10-12, and
      on 10-13 (11:00) took the two services that were the entry route (SpeeCAN RAIDEN for customers on raiden3.ktaiwork.jp, and Raiden School on s2.ktaiwork.jp) offline, identified and blocked the attacking source IP address and says it checked its other servers for planted malicious programs. Possibly leaked data across the six SpeeCAN RAIDEN domains: contact names, e-mail addresses,
      telephone and FAX numbers, responsible persons, contract information and the text of stored delivery history; Arcadia's estimated maximum is about 3,136,000 e-mail addresses, 105,000 telephone numbers and 15,000 FAX numbers (an estimate, not confirmed exfiltration), and no payment-card data is handled. On 10-14 (15:00) it extended the finding to NET119 (up to about 13,000 users:
      name, date of birth, sex, address, phone, e-mail, FAX and data entered when registering for other services; no video-report leak) and 119RAIDEN (up to about 97,000 e-mail addresses, 17,000 phone numbers, 400 FAX numbers), and widened its malware check to all services. Both stopped services were restored at about 15:00 on 10-15; Arcadia says the entry route is closed, no malicious program remains, "vulnerabilities are also being addressed as needed", the scope is still under investigation, and
      asks every customer to change its login password before use. It reported to the Personal Information Protection Commission and consulted the police, the Kinki Bureau of the Ministry of Internal Affairs and others. Per Nikkei, the Ministry of Internal Affairs and Communications had reports from 111 bodies (6 prefectures, 104 municipalities, 1 association) by 17:00 on 10-14. Impact seen in municipal notices: disaster mail stopped; staff call-out mail and dam-discharge telephone notices unavailable (Okayama); fire-corps call-out mail not delivered (Saga, per TV report cited by Piyolog); NET119 registrants' data (Shimonoseki, 50 registrants; Toyooka lists pre-existing conditions and family doctor among handled items, per Piyolog).
      CLAIM / UNCONFIRMED LINK. Yokosuka (10-13) and Shizuoka (10-14) report phishing e-mails already received by registrants — Shizuoka's example is a fake credit-card-company usage-check mail ("Important: please confirm your usage") whose sender address contains "@raiden.ktaiwork.jp", a genuine sending domain of the city's alert mail; the city calls it a spoofed mail abusing that address and says it "may be related" to the incident. More than 20 Shizuoka city staff reportedly received such mail (FNN via Piyolog); Matsumoto, Sasebo and Konan also report suspicious mail with the relation to the incident unclear.
      NOT KNOWN. Initial access vector and technique (Arcadia says only "an external unauthorized intrusion route" and that vulnerabilities are being fixed), the actor, any ransom demand or leak-site claim (none found), whether data was actually exfiltrated, how the spoofed mail reached recipients (platform abuse vs forged header).
      Transferable lesson for Swiss communes, cantonal police / fire-rescue and civil-protection bodies (assessment): a multi-tenant alerting vendor concentrates staff rosters, duty-call lists, resident phone numbers and, for NET119-type services, health-related registrations; the supplier's incident reached 111 customers simultaneously and took call-out channels out for about two days, and the follow-on risk is credible phishing in the name of the alerting platform's own domain.
