  - title: "IDC Frontier IDCF Cloud (report 5, 2026-10-14): backups of 194 of the 495 affected customers now retrievable, provider judges no data left its systems, 48 customers' portal registration data was queried"
    novelty: "update-of:2026-10-11/idc-frontier-idcf-cloud-ransomware-495-customers-backups"
    sources:
      - { url: "https://www.idcf.jp/news/topics/20261014001", publisher: "IDC Frontier (fifth report, Japanese)", date: "2026-10-14", role: "primary" }
      - { url: "https://www.watch.impress.co.jp/docs/news/2148186.html", publisher: "Impress Watch", date: "2026-10-14", role: "corroborating" }
      - { url: "https://www.idcf.jp/news/topics/20261009001/", publisher: "IDC Frontier (fourth report, Japanese)", date: "2026-10-09", role: "context" }
    discovery_trace: "first seen at: state/prior_coverage entry 2026-10-11/idc-frontier-idcf-cloud-ransomware-495-customers-backups (the covered finding); the lost first pass fetched the report-5 page and Impress Watch (url-liveness ledger 2026-10-16T03:13Z) -> this pass re-extracted primary: IDC Frontier, URL https://www.idcf.jp/news/topics/20261014001 -> corroborating: Impress Watch, URL https://www.watch.impress.co.jp/docs/news/2148186.html -> checked the topics listing (https://www.idcf.jp/news/topics/) for any later report: none newer than report 5."
    summary: |
      DELTA against the covered entry, which has no update yet and says customer data in the four affected zones "can be recovered only from customers' own backups" (third report, 2026-10-08) — that statement is now superseded.
      IDC Frontier's fifth report (2026-10-14, Japanese; Impress Watch confirms the service disruption was still continuing at 20:00 that day) says: (1) with an external security firm it has confirmed the safety of the backup data, and of the 495 affected companies and
      local governments the 194 that used IDCF Cloud's snapshot function can have their backup data retrieved, with individual contact under way on whether and how it can be restored; (2) its investigation of the intrusion route, logs (access, authentication, operation),
      attacker-placed files and processes and traces of data being taken out found no evidence that data in the customers' virtual servers (tesla, henry, pascal and joule zones of East Japan Region 1) was queried or exfiltrated, so the provider "judges that there was no outflow of data to the outside" and has seen no secondary damage; (3) it confirmed that the
      registration information of 48 customers was improperly queried in the IDCF Cloud Portal (company name, portal login ID, the portal password as a hard-to-reverse random hash, notification-contact business e-mail addresses, and the monthly usage fee total; two customers' addresses may contain a person's name), again with no trace that this data was carried out.
      The remaining zones (radian, newton, East Japan Regions 2 and 3, West Japan Region 1) were not disrupted and remain under safety investigation. The report does not give the intrusion route or name an actor; the second report (2026-10-07) had called the incident ransomware (per Impress Watch).
      Reading for defenders (assessment, not the provider's words): the report shows the portal/management plane, not only the tenant virtual servers, was reached (the 48-customer query), and that provider-held snapshots survived where customer-side backups were assumed the only recovery path.
