  item: "2026-10-14/adobe-october-2026-coldfusion-aem-commerce-unauth-critical (sourcing_note, rewritten by this run's 2026-10-16T04:13:30Z record)"
  url_or_quote: "Adobe's ColdFusion summary calls the update priority 2 while its solution table rates both fixes priority 1."
  summary: "False as of today: https://www.adobe.com/trust/security/products/coldfusion/apsb26-144 (Last updated on Oct 14, 2026; raw HTML, WebFetch and the gate-saved quote-bodies/890ba237d74f7f92.html.txt agree) gives Priority 2 in the header block, 'Adobe has released a priority 2 security update for Adobe ColdFusion' in the Summary, and the Solution table rows 'Adobe ColdFusion 2025 | 2025.0.14 | All | 2' and 'Adobe ColdFusion 2023 | 2023.0.26 | All | 2'. No priority 1 appears; the discrepancy the note reports does not exist (Adobe evidently corrected the table on 2026-10-14). Drop the clause from the sourcing_note (an in-place correction through the changelog)."
