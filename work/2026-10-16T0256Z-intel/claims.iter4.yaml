    surface: "body"
    kind: cited
    text: "**Triage:** AhsayCBS legitimately spawns its own startup and maintenance commands, so a child process alone is weak; the discriminators Huntress gives are a child of the service that downloads files into a Temp folder, and an Edge-named binary run as SYSTEM from a Temp folder under a service that mimics the Edge updater ("
    urls: ["https://www.huntress.com/blog/ahsaycbs-flaws-exploit"]
  - claim_id: 31f543c78f
    entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** apply the hotfix v10.3.4.45 or v9.15.2.70 to every AhsayCBS server, including those on the earlier patches, and reboot it ("
    urls: ["https://www.ahsay.com/en/company/announcements/patch-cve-105133-105134-update"]
  - claim_id: c87e6d5312
    entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
    surface: "body"
    kind: cited
    text: "); ask your backup suppliers whether they run it, because the hotfixes sit behind a partner login, and until it is applied keep the management interface on trusted addresses or a VPN, since the exploit targets the externally reachable web application ("
    urls: ["https://www.huntress.com/blog/ahsaycbs-flaws-exploit"]
  - claim_id: fd90b829e5
    entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
    surface: "body"
    kind: cited
    text: "); where an indicator of compromise turns up, re-image the host from a trusted backup, since Huntress says attackers hid secondary backdoors for extended persistence ("
    urls: ["https://www.huntress.com/blog/ahsaycbs-flaws-exploit"]
  - claim_id: fa2cf5af87
    entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
    surface: "body"
    kind: derived
    text: "**Detection:** process-creation telemetry with parent lineage: children of the AhsayCBS service process outside its normal startup and maintenance commands, because commands from an uploaded JSP webshell appear as direct children of the service, and curl or certutil from that lineage writing into a Temp folder; service inventory: a service named like the Edge update service running an Edge-named binary from a Temp folder as SYSTEM; PowerShell script-block logs: a script that checks for Task Manager and stops or starts a service to match; command lines that name WinRing0 next to a URL; and new .jsp files in the application directory."
