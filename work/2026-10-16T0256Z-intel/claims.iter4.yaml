    text: "Ahsay now says its previous patches v9.15.2.59 and v10.3.4.0 \"did not fully address\" the two flaws, and tells partners to apply the AhsayCBS v10.3.4.45 hotfix on v10 and the v9.15.2.70 hotfix on v7, v8 and v9, both from the partner portal (a valid partner login is required), then to reboot the server ("
    urls: ["https://www.ahsay.com/en/company/announcements/patch-cve-105133-105134-update"]
