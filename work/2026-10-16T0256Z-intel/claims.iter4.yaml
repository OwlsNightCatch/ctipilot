    surface: "body"
    kind: cited
    text: "They replaced a .bashrc with a copy that, in one instance, aliases sudo to a fake password prompt that logs the input, searched configuration and history files for cleartext credentials, escalated with LinPEAS and the public PwnKit exploit (CVE-2021-4034), left root-SUID shells under hidden names and injected an SSH key into authorized_keys ("
    urls: ["https://unit42.paloaltonetworks.com/ai-campaign-targets-linux-infrastructure/"]
  - claim_id: 2dced19976
    entry: 2026-10-16/cl-unk-1211-ai-assisted-intrusions-government-linux-hosts
    surface: "body"
    kind: cited
    text: "They moved laterally with sshpass and hard-coded credentials and through an MSSQL double hop using xp_cmdshell, and kept access with SysGoRAT, a Go trojan that takes commands over WebSocket, plus revsocks, pysoxy and GSocket's gs-netcat run from /dev/shm under a fake kernel-thread process name ("
    urls: ["https://unit42.paloaltonetworks.com/ai-campaign-targets-linux-infrastructure/"]
  - claim_id: 2d5aebc570
    entry: 2026-10-16/cl-unk-1211-ai-assisted-intrusions-government-linux-hosts
    surface: "body"
    kind: cited
    text: "On government mail servers they enumerated /var/qmail/mailnames/, counted mails in Maildir folders to pick targets and searched mail headers for social-media messages; they tried to exfiltrate database dumps over netcat and to public file-hosting platforms, to delete authentication, history, mail and system logs and to kill endpoint security processes, timestomped scripts with touch -t, and planted a red-team marker string and a pentest-style password to pass as an authorised exercise ("
    urls: ["https://unit42.paloaltonetworks.com/ai-campaign-targets-linux-infrastructure/"]
  - claim_id: b6690a4819
    entry: 2026-10-16/cl-unk-1211-ai-assisted-intrusions-government-linux-hosts
    surface: "body"
    kind: cited
    text: "**Exposure:** Linux web and mail hosting estates of government or state-affiliated bodies, in particular Plesk-managed PHP stacks and their /var/qmail/mailnames/ mail directories, which the attackers enumerated and searched; the report does not say how the attackers got in ("
    urls: ["https://unit42.paloaltonetworks.com/ai-campaign-targets-linux-infrastructure/"]
  - claim_id: 4115802d59
    entry: 2026-10-16/cl-unk-1211-ai-assisted-intrusions-government-linux-hosts
    surface: "body"
    kind: derived
    text: "**Detection:** as derived from the behaviour: file-integrity monitoring on PHP configuration directories for any auto_prepend_file that points outside the application tree; shells or interpreters spawned by php-fpm or web server workers; writes to shell startup files, authorized_keys and any new sudo alias; PHP or web-server access to the mail store; new systemd units, five-minute cron entries and hidden-name SUID-root binaries; outbound WebSocket, GSocket or file-hosting connections from servers; touch -t changes, bursts of deleted history and mail logs, and pkill sequences that name EDR agents."
  - claim_id: 4605e29058
    entry: 2026-10-16/cl-unk-1211-ai-assisted-intrusions-government-linux-hosts
    surface: "body"
    kind: derived
    text: "**Triage:** Plesk or PHP hardening can legitimately set auto_prepend_file and administrators do define sudo aliases; the report supports these discriminators: a prepended file with a vendor-like name outside the application tree, an alias that prompts for and logs the password, a log file named after another product, and red-team marker strings that no change record explains."
  - claim_id: 47dc15c1d7
    entry: 2026-10-16/cl-unk-1211-ai-assisted-intrusions-government-linux-hosts
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** audit every PHP configuration for auto_prepend_file, privileged accounts' startup files for a sudo alias and authorized_keys for unknown keys, and the file system for root-SUID binaries under hidden names; ship authentication, mail and web logs off-host so local log cleanup cannot erase them; patch PwnKit and keep Linux EDR self-protection alerting."
  - claim_id: cdd9bdada3
    entry: 2026-10-16/peerstitch-fortigate-implant-cve-2025-61624-fortimanager
    surface: "headline"
    kind: frontmatter
    text: "Unit 42: a memory-resident FortiGate implant rides an exploited FortiOS flaw that has no fix on 7.2, 7.0 and 6.4"
  - claim_id: 56e82c984d
    entry: 2026-10-16/peerstitch-fortigate-implant-cve-2025-61624-fortimanager
    surface: "summary"
    kind: frontmatter
    text: "Unit 42 describes a September 2024 intrusion at a telecommunications organization, tracked as CL-STA-0954 (UNC5820), that began with the FortiManager flaw CVE-2024-47575, exfiltrated the configurations and cryptographic material of more than 500 managed FortiGate firewalls, and later used the FortiOS CLI auto-script path traversal CVE-2025-61624 to install PEERSTITCH, an ARM64 implant that patches the logging and IPsec daemons in memory and leaves no persistent binary on disk. Fortinet's advisory FG-IR-26-122 of 2026-04-14 lists CVE-2025-61624 as known exploited and gives no fix for FortiOS 7.2, 7.0 and 6.4, only a move to a fixed release, so those branches stay exposed to an attacker who already holds a privileged administrator account."
  - claim_id: 35d1ca8629
    entry: 2026-10-16/peerstitch-fortigate-implant-cve-2025-61624-fortimanager
    surface: "cves[CVE-2025-61624]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2025-61624\", \"cvss\": \"6.0\", \"status\": [\"exploited\", \"patch-available\", \"no-patch\"], \"affected\": \"FortiOS 7.6.0 to 7.6.4, 7.4.0 to 7.4.9 and all versions of 7.2, 7.0 and 6.4; FortiProxy 7.6.0 to 7.6.4, 7.4.0 to 7.4.11 and all of 7.2 and 7.0; FortiPAM 1.7.0 and all of 1.0 to 1.6; FortiSwitchManager 7.2.0 to 7.2.7 and 7.0.0 to 7.0.6\", \"fixed\": \"FortiOS 7.6.5 and 7.4.10; FortiProxy 7.6.5 and 7.4.12; FortiPAM 1.7.1; FortiSwitchManager 7.2.8 and 7.0.7; no fix on FortiOS 7.2, 7.0 and 6.4, FortiProxy 7.2 and 7.0 or FortiPAM 1.0 to 1.6, where Fortinet says to migrate to a fixed release; virtual patch FG-VD-59270.0day in FMWP database update 25.120\", \"auth\": \"admin-required\", \"vector\": \"zero-click\"}"
  - claim_id: 2e87f6f9ce
    entry: 2026-10-16/peerstitch-fortigate-implant-cve-2025-61624-fortimanager
    surface: "body"
    kind: cited
    text: "Unit 42 investigated a September 2024 intrusion at a telecommunications organization, tracked as cluster CL-STA-0954, that began with CVE-2024-47575 against a centralized FortiManager appliance: the attackers registered a rogue virtual FortiGate, then exfiltrated an archive with the running configurations, cryptographic material and database files of more than 500 managed FortiGate firewalls ("
    urls: ["https://unit42.paloaltonetworks.com/fortimanager-cve-2024-47575-peerstitch-malware/"]
  - claim_id: 4ba95cc912
    entry: 2026-10-16/peerstitch-fortigate-implant-cve-2025-61624-fortimanager
    surface: "body"
    kind: cited
    text: "Unit 42 recovered the configurations' reversible-ciphertext credentials by brute force; the attackers later logged in over SSL VPN with legitimate credentials and pushed packet-capture settings to downstream firewalls ("
    urls: ["https://unit42.paloaltonetworks.com/fortimanager-cve-2024-47575-peerstitch-malware/"]
  - claim_id: 602aa3f873
    entry: 2026-10-16/peerstitch-fortigate-implant-cve-2025-61624-fortimanager
    surface: "body"
    kind: cited
    text: "For root they used CVE-2025-61624, a path traversal in the FortiOS CLI system.auto-script engine that lets an authenticated administrative account read and write arbitrary files as root ("
    urls: ["https://unit42.paloaltonetworks.com/fortimanager-cve-2024-47575-peerstitch-malware/"]
  - claim_id: 7afb9e396f
    entry: 2026-10-16/peerstitch-fortigate-implant-cve-2025-61624-fortimanager
    surface: "body"
    kind: cited
    text: "That installed PEERSTITCH, an ARM64 injector that attaches with ptrace to the logging daemon miglogd and the IPsec daemon iked, allocates a 16 KB read-write-execute region, NOP-patches three fixed offsets and links the daemons through /proc memory so that tagged VPN sessions skip default FortiOS validation; it leaves no persistent binary on disk, opens no listening port and makes no outbound connection of its own ("
    urls: ["https://unit42.paloaltonetworks.com/fortimanager-cve-2024-47575-peerstitch-malware/"]
  - claim_id: 19015a5001
    entry: 2026-10-16/peerstitch-fortigate-implant-cve-2025-61624-fortimanager
    surface: "body"
    kind: cited
    text: "Command and control ran through the firewall's own Apache mod_md ACME module, whose DNS-01 challenge handler executes Node.js with parameters from an attacker-run ACME server and so opens a reverse shell ("
    urls: ["https://unit42.paloaltonetworks.com/fortimanager-cve-2024-47575-peerstitch-malware/"]
  - claim_id: 26df9ef0d7
    entry: 2026-10-16/peerstitch-fortigate-implant-cve-2025-61624-fortimanager
    surface: "body"
    kind: cited
    text: "Fortinet's advisory FG-IR-26-122 of 2026-04-14 covers the CLI path traversal in FortiOS, FortiPAM, FortiProxy and FortiSwitchManager, lists it as known exploited, and for FortiOS gives fixes only in 7.6.5 and 7.4.10, telling users of 7.2, 7.0 and 6.4 to migrate to a fixed release ("
    urls: ["https://fortiguard.fortinet.com/psirt/FG-IR-26-122"]
  - claim_id: 55ce61a3eb
    entry: 2026-10-16/peerstitch-fortigate-implant-cve-2025-61624-fortimanager
    surface: "body"
    kind: cited
    text: "**Exposure:** FortiOS on 7.2, 7.0 or 6.4, which have no fixed build, or on 7.6.0 to 7.6.4 and 7.4.0 to 7.4.9, with administrators who can reach the CLI ("
    urls: ["https://fortiguard.fortinet.com/psirt/FG-IR-26-122"]
  - claim_id: 44f24c63b9
    entry: 2026-10-16/peerstitch-fortigate-implant-cve-2025-61624-fortimanager
    surface: "body"
    kind: cited
    text: "); and a FortiManager below 7.6.1, 7.4.5, 7.2.8, 7.0.13, 6.4.15 or 6.2.13 that is reachable on TCP 541 from untrusted networks, where the intrusion began ("
    urls: ["https://fortiguard.fortinet.com/psirt/FG-IR-24-423", "https://unit42.paloaltonetworks.com/fortimanager-cve-2024-47575-peerstitch-malware/"]
  - claim_id: 36a16e1de6
    entry: 2026-10-16/peerstitch-fortigate-implant-cve-2025-61624-fortimanager
    surface: "body"
    kind: cited
    text: "**Detection:** management-plane audit records of the FortiManager (device registrations, archive creation, TCP 541 sessions from outside the management network); FortiGate administrator and VPN logs for SSL VPN logins with valid credentials from new external addresses and for administrator accounts that match nobody in the estate, such as an unexpected FortiGateCloud account; gaps in forwarded syslog, because the actors stop the logging daemons before running scripts; and unexplained packet-capture settings ("
    urls: ["https://unit42.paloaltonetworks.com/fortimanager-cve-2024-47575-peerstitch-malware/"]
  - claim_id: 394ecb5e5e
    entry: 2026-10-16/peerstitch-fortigate-implant-cve-2025-61624-fortimanager
    surface: "body"
    kind: cited
    text: "Unit 42's hunting guidance adds the memory maps of miglogd and iked (anonymous 16,384-byte rwxp regions), text-segment integrity at three fixed offsets, cross-process open and write on /proc/<pid>/mem, signal-11 crashes of miglogd, iked or syslogd in the crash log, and configuration revisions holding auto-script objects with ../ in the name ("
    urls: ["https://unit42.paloaltonetworks.com/fortimanager-cve-2024-47575-peerstitch-malware/"]
  - claim_id: 1cc9308efc
    entry: 2026-10-16/peerstitch-fortigate-implant-cve-2025-61624-fortimanager
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** plan the move off FortiOS 7.2, 7.0 and 6.4, where Fortinet offers no fix for an exploited root escalation, and limit who can reach the administrative CLI meanwhile; after any suspected FortiManager compromise treat every managed device's credentials and certificates as compromised and rotate them, because the stolen trust material stays valid until it is rotated ("
    urls: ["https://unit42.paloaltonetworks.com/fortimanager-cve-2024-47575-peerstitch-malware/"]
  - claim_id: a28511389d
    entry: 2026-10-16/peerstitch-fortigate-implant-cve-2025-61624-fortimanager
    surface: "body"
    kind: derived
    text: "**Triage:** legitimate FortiManager work also creates and deletes auto-scripts and adds devices; the report's signals are ../ in an auto-script name, a device registered from outside the management network, and accounts that match no administrator or tenant the organization created."
