    kind: cited
    text: "**Exposure:** AhsayCBS servers, a Windows service run from cbssvcX64.exe or cbssvcX86.exe, whose management web interface is reachable from untrusted networks and that run a v7 to v10 build below the hotfixes v10.3.4.45 or v9.15.2.70, which includes v10.3.4.0 and v9.15.2.59 ("
