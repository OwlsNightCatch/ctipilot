    entry: 2026-10-16/drupal-sa-core-2026-014-cve-2026-108097-field-ui-rce
    surface: "summary"
    kind: frontmatter
    text: "Drupal's advisory SA-CORE-2026-014 of 2026-10-14 fixes CVE-2026-108097, a remote code execution flaw in the core Field UI module rated Critical (19 of 25): core alone is not directly exploitable, but several exploit paths exist through contributed modules and at least one known path needs no login. Fixed releases are 11.4.10, 11.3.19 and 10.6.19; 11.2.x and below, 10.5.x and below and Drupal 8 and 9 get no fix, and until a site is updated the advisory's mitigation is to uninstall the Field UI module. The advisory records no public exploit at publication, and The Hacker News relays the Security Team's pre-announcement warning that exploits might be developed within hours or days."
  - claim_id: 9f056c272d
    entry: 2026-10-16/drupal-sa-core-2026-014-cve-2026-108097-field-ui-rce
    surface: "actions[0]"
    kind: frontmatter
    text: "Update every Drupal core site to 11.4.10, 11.3.19 or 10.6.19 now, internet-facing sites first, and until a site is updated uninstall its Field UI module (field_ui); update the Entity List module to 3.0.10 wherever it is installed, because updating core does not update it, and plan the migration of any site still on 11.2.x or below, 10.5.x or below, Drupal 8 or Drupal 9, which receive no fix."
