    surface: "summary"
    kind: frontmatter
    text: "BeyondTrust's advisory BT26-05 of 2026-10-15 fixes CVE-2026-102764, an improper origin validation in an internal messaging component of Remote Support that lets a remote attacker perform file operations on the appliance without authenticating; all versions up to 26.2.3 are affected. Google's Threat Intelligence Group found ARMORY CASTLE, a suspected PRC-nexus espionage actor formerly tracked as UNC5221, exploiting it as a zero-day in late August 2026, leaving a web shell, a root-SUID shell and a sudoers entry that survive reboot and configuration reset, so a patched appliance that was exposed still needs a compromise check, and a rebuild where its status is confirmed or unknown."
  - claim_id: d840e31042
    entry: 2026-10-16/cve-2026-102764-beyondtrust-remote-support-zero-day
    surface: "immediate_action"
    kind: frontmatter
    text: "Patch BeyondTrust Remote Support now, review every appliance exposed since late August and rebuild any with confirmed or unknown compromise status: BeyondTrust and Google's Threat Intelligence Group confirm that an unauthenticated flaw in Remote Support (all versions up to 26.2.3) was exploited as a zero-day from late August 2026, GTIG attributing it to a suspected China-nexus espionage actor, and GTIG warns organizations to prepare for widespread exploitation now that the flaw is public. Apply the BT26-05-RS patch to every self-hosted appliance (builds older than 24.3.1 must be upgraded first). The actor's persistence survives reboot and configuration reset and it deletes on-appliance logs, so snapshot and collect off-box logs from any appliance that was internet-reachable on an affected build, then redeploy from a clean patched image any whose compromise status is confirmed or unknown and rotate everything it held."
  - claim_id: 728cafa9a2
    entry: 2026-10-16/cve-2026-102764-beyondtrust-remote-support-zero-day
    surface: "actions[0]"
    kind: frontmatter
    text: "Apply the BT26-05-RS patch to every self-hosted BeyondTrust Remote Support appliance now and confirm in the /appliance interface that it is installed (a build older than 24.3.1 must be upgraded first, which closes the hole but does not undo earlier exposure); apply it to self-hosted Privileged Remote Access appliances too, which BeyondTrust patched as a precaution."
  - claim_id: a8bcae3088
    entry: 2026-10-16/cve-2026-102764-beyondtrust-remote-support-zero-day
    surface: "actions[1]"
