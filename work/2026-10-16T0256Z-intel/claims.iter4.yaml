    text: "Palo Alto Networks' advisory of 2026-10-14 fixes CVE-2026-0322, a code injection in the PAN-OS management interface that lets an authenticated attacker with network access run code as root on PA-Series and VM-Series firewalls and on Panorama; the advisory is tagged as attacked and reports very limited exploitation, and CISA listed the flaw in KEV the same day. There is no workaround and the risk is highest where the management interface is reachable from the internet; 11.2.16, the fixed build for units on 11.2.14 and 11.2.15, was published on 2026-10-15, so every train now has a fixed build."
