claims:
  - claim_id: 000893a51b
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "headline"
    kind: frontmatter
    text: "CISA lists the Atlassian file-read flaw as exploited; attempts began the day of the public write-up and a scanning template exists"
  - claim_id: 77859076ef
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "summary"
    kind: frontmatter
    text: "Atlassian's advisory of 2026-10-05 fixes CVE-2026-21589, an unauthenticated arbitrary file access flaw in every version of Bitbucket, Confluence, Jira Service Management, Jira Software, Bamboo and Crowd Data Center, plus Crucible and Fisheye (CVSS 4.0 9.3), and tells customers to patch immediately or take internet-facing instances off the internet. watchTowr Labs published the root cause, the request shape and a runnable checker on 2026-10-06, and exploitation attempts followed the same day: Previdian's sensors had recorded 607 attempts from 65 addresses in 20 countries by 2026-10-16, SANS ISC recorded similar attempts on its own honeypots, and a Nuclei template exists; neither honeypot operator reports a compromise. CISA added the flaw to its Known Exploited Vulnerabilities catalog on 2026-10-15 on evidence of active exploitation, without saying what the evidence is. Where Jira is integrated with Crowd, the file read exposes a plaintext Crowd application password that gives access to Crowd as an administrator of that application."
  - claim_id: 76955df979
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "cves[CVE-2026-21589]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-21589\", \"cvss\": \"9.3\", \"status\": [\"exploited\", \"cisa-kev\", \"patch-available\", \"poc-public\"], \"affected\": \"All versions of Bitbucket, Confluence, Jira Service Management, Jira Software, Bamboo and Crowd Data Center, Crucible and Fisheye below the fixed versions; end-of-life versions may also be affected\", \"fixed\": \"Bitbucket Data Center 9.4.26, 10.2.8, 10.5.1; Confluence Data Center 9.2.26, 10.2.19; Jira Service Management Data Center 5.12.40, 10.3.26, 11.3.12; Jira Software Data Center 9.12.40, 10.3.26, 11.3.12; Bamboo Data Center 10.2.24, 12.1.12; Crowd Data Center 6.3.7, 7.0.3, 7.1.7, 7.2.4; Crucible 4.9.15; Fisheye 4.9.15\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
  - claim_id: 10cf982f4b
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "body"
    kind: cited
    text: "Atlassian's advisory of 2026-10-05 says every version of Bitbucket, Confluence, Jira Service Management, Jira Software, Bamboo and Crowd Data Center, and of Crucible and Fisheye, is affected by CVE-2026-21589, an arbitrary file access flaw that lets an unauthenticated attacker access specific files within the web application root directory ("
    urls: ["https://confluence.atlassian.com/security/cve-2026-21589-arbitrary-file-access-vulnerability-impacts-multiple-products-1870495748.html"]
  - claim_id: 6fdb4cd0d8
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "body"
    kind: cited
    text: "The attacker needs the target file's exact name and path and cannot enumerate or list directory contents, and Atlassian adds that in some configurations sensitive files are present that increase the risk ("
    urls: ["https://confluence.atlassian.com/security/cve-2026-21589-arbitrary-file-access-vulnerability-impacts-multiple-products-1870495748.html"]
  - claim_id: 060f41cb6c
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
