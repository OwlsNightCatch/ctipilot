  - claim_id: 624b386e65
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "record 2026-10-16T04:11:30Z"
    kind: record-summary
    text: "CISA added CVE-2026-21589 to its Known Exploited Vulnerabilities catalog on 2026-10-15 on evidence of active exploitation, which moves the flaw from honeypot-observed attempts to government-confirmed exploitation; CISA names neither the evidence, the actor nor any victim, and neither CISA nor the honeypot operators report a compromise; Previdian's honeypot count has grown to 607 attempts from 65 addresses in 20 countries, and NCSC Switzerland has listed the flaw as actively exploited since 2026-10-12."
  - claim_id: 4f462a769b
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "summary"
    kind: frontmatter
    text: "The Confederation, in a release headlined \"data outflow confirmed\", said on 2026-10-08 that a software supplier of Publica detected a cyberattack at the end of September, and the supplier PK Softech AG (Reinach BL) says unknown attackers used malware to reach part of its IT infrastructure and that it must be assumed data left its systems; the Federal Prosecutor's Office is investigating. Publica insures, among others, staff of the federal administration and the ETH domain, about 70,000 active members and 41,600 pensioners at the end of 2025, and its own page lists name, date of birth, AHV number, address, contact details, salary and pension data, civil status, partner details and IBAN as data that could be affected, while the AWP agency relays the supplier's position that the volume is rather small and the data may be business data. On 2026-10-09 the Bernische Pensionskasse, which insures canton of Bern staff and cantonal university personnel, said its supplier is the same company, and the Bernische Lehrerversicherungskasse and Pensionskasse Post reported the supplier incident too; none of the funds has yet confirmed which member data left, and the access vector and the actor are not public. Cantonal police now warn that criminals could use leaked salary and pension data for investment-fraud calls, and the Zurich cantonal fund BVK, a customer since 2011, says it runs the software in its own data centre and is not directly affected."
  - claim_id: b9c388cb48
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "actions[0]"
    kind: frontmatter
    text: "Tell the helpdesk, HR and payroll teams of every body whose staff are insured with Publica (including the federal administration and the ETH domain) that AHV number, date of birth, address, salary and IBAN may now be known to criminals and must not count as proof of identity, and route requests that quote them, a request to change a payout account included, to a call-back on a known number; for staff insured with the Bernische Pensionskasse or the Bernische Lehrerversicherungskasse apply the same rule until those funds report the scope, because the Bernische Pensionskasse says it has no indication of theft but cannot exclude it and the Bernische Lehrerversicherungskasse is still checking whether and to what extent its data is affected; also tell insured staff that cantonal police warn of investment-fraud calls from people who know their salary and pension details, which prove nothing about the caller."
  - claim_id: 3aeb339533
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "actions[1]"
    kind: frontmatter
    text: "If your organisation's pension administration, HR or payroll runs on PK Softech software, is being migrated to it or tested on it, or your staff are insured with Pensionskasse Post, ask the supplier or the fund in writing whether your data, test data included, was in the affected environment and what it holds."
