  - claim_id: d98d5f6786
    entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
    surface: "section 2026-10-16T04:09:30Z"
    kind: cited
    text: "Bitdefender MDR reports three intrusions through the chain, the first two beginning around 7 to 8 October and a third identified on 14 October; in the first, attackers validated access through JSP webshells, staged PowerShell payloads, tried to stage payloads as command files in C:\\Users\\Public and tried to establish persistence; in the second they deployed JSP files, tried the same command-file staging, searched for stored credentials, elevated an account to SYSTEM and used obfuscated PowerShell to install and configure OpenSSH, which gives a way back that does not depend on the vulnerable web service, so patching alone does not end the incident; across its incidents the follow-on PowerShell scripts were staged on a subdomain of a public static-site hosting service; it attributes the activity to no named actor, and notes that the file names, tools and binaries differed from one incident to the next, so the dependable signal is how the server behaves after the exploit fires ("
    urls: ["https://www.bitdefender.com/en-us/blog/businessinsights/technical-advisory-ahsaycbs-exploitation-chain-cve-2026-105133-cve-2026-105134"]
  - claim_id: 02d43c0b29
    entry: 2026-10-11/idc-frontier-idcf-cloud-ransomware-495-customers-backups
