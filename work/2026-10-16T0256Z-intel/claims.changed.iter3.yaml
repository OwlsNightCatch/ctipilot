  - claim_id: bf2ae93dfb
    entry: 2026-10-14/cve-2026-104935-ivanti-connect-secure-zero-day-chain-kev
    surface: "summary"
    kind: frontmatter
    text: "Ivanti disclosed CVE-2026-104935 on 2026-10-13, an authentication bypass in Connect Secure that lets a remote unauthenticated attacker run commands, and says it is aware of limited exploitation; CISA listed it in KEV the same day. Volexity found a cluster it calls UTA0576 chaining it with a root escalation that Ivanti has not yet fixed, patching library code in memory only so Ivanti's Integrity Checker Tool sees no file change, and going after the appliance's Active Directory service account, LAPS passwords and BitLocker recovery keys. Fixed builds are 25.1.1.2, 25.1.3.1 and 22.8R2.5 (Rapid7 also lists 25.1.3.0, which CERT-FR counts as affected); a patched appliance that was exposed still needs a compromise check, and CERT-FR says it knows of lateral movement using the LDAP and Active Directory secrets stored on the appliance and tells owners to isolate and preserve it before any reset."
  - claim_id: c4d0999f61
    entry: 2026-10-14/cve-2026-104935-ivanti-connect-secure-zero-day-chain-kev
    surface: "immediate_action"
    kind: frontmatter
    text: "Patch Ivanti Connect Secure now, then check the appliance and its AD account for compromise: Ivanti and CISA confirm exploitation of CVE-2026-104935, and Volexity saw the chain used against a fully patched 22.8R2.4 appliance from 2026-10-03. Upgrade every Connect Secure appliance on 25.1.1.1 or earlier, 25.1.2.2 or earlier, or 22.8R2.4 or earlier to 25.1.1.2, 25.1.3.1 or 22.8R2.5, internet-facing ones first. Ivanti's Integrity Checker Tool cannot see this chain and the root-escalation step has no fix yet, so an appliance that was reachable on an affected build needs a compromise check and rotation of the Active Directory service account, LAPS passwords and other secrets it could reach."
  - claim_id: 373046dcaf
    entry: 2026-10-14/cve-2026-104935-ivanti-connect-secure-zero-day-chain-kev
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade every Ivanti Connect Secure appliance on 25.1.1.1 or earlier, 25.1.2.2 or earlier, or 22.8R2.4 or earlier to 25.1.1.2, 25.1.3.1 or 22.8R2.5 now, internet-facing appliances first; 22.7.x and below are not affected."
  - claim_id: b5766d6067
    entry: 2026-10-14/cve-2026-104935-ivanti-connect-secure-zero-day-chain-kev
    surface: "actions[1]"
    kind: frontmatter
    text: "Run a compromise check on every appliance that was reachable on an affected build, starting with proxy, load balancer or WAF logs back to at least 2026-10-03 for welcome.cgi requests that carry an X-DSCGI-PATH header; where compromise cannot be excluded, first cut the appliance off from the internet and the internal network and snapshot its file system and memory without powering it down, then follow Ivanti's recovery steps and reset the domain service account, LAPS and local passwords, certificates, API keys, the Kerberos tickets of its service accounts and the licence-server authentication the appliance held, because CERT-FR knows of lateral movement using the LDAP and Active Directory secrets."
