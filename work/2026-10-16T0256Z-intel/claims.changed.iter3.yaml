  - claim_id: 53fdbb1840
    entry: 2026-10-11/idc-frontier-idcf-cloud-ransomware-495-customers-backups
    surface: "summary"
    kind: frontmatter
    text: "IDC Frontier, a SoftBank Group subsidiary, says a ransomware attack from about 3:40 a.m. on 2026-10-07 stopped four zones of its IDCF Cloud East Japan Region 1, affecting 495 companies and local governments whose virtual servers stopped and cannot be restarted. Its fifth report (2026-10-14) says, after its third report had expected data to be recoverable only from customers' own backups, that its backup data is confirmed safe and can be retrieved for the 194 affected customers that used its snapshot function, and that it found no trace of data stored in customers' virtual servers being queried or taken and judges that none left, while confirming improper queries of the portal registration data of 48 customers with no trace of removal; the intrusion route is not public. Municipal and prefectural websites were among those that went down."
  - claim_id: a318368046
    entry: 2026-10-11/idc-frontier-idcf-cloud-ransomware-495-customers-backups
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** check where the recovery copies of hosted websites, mail, forms and line-of-business systems live: IDC Frontier first expected restoration only from copies customers hold themselves ("
    urls: ["https://www.idcf.jp/news/topics/20261008001"]
  - claim_id: 6819363d65
    entry: 2026-10-11/idc-frontier-idcf-cloud-ransomware-495-customers-backups
