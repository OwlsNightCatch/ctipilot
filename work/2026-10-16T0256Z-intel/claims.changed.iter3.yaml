  - claim_id: 9592b26ecb
    entry: 2026-10-16/cve-2026-102764-beyondtrust-remote-support-zero-day
    surface: "immediate_action"
    kind: frontmatter
    text: "Patch BeyondTrust Remote Support now, then rebuild and rotate for any appliance that was exposed since late August: BeyondTrust and Google's Threat Intelligence Group confirm that an unauthenticated flaw in Remote Support (all versions up to 26.2.3) was exploited as a zero-day from late August 2026, GTIG attributing it to a suspected China-nexus espionage actor, and GTIG warns organizations to prepare for widespread exploitation now that the flaw is public. Apply the BT26-05-RS patch to every self-hosted appliance (builds older than 24.3.1 must be upgraded first). The actor's persistence survives reboot and configuration reset and it deletes on-appliance logs, so snapshot and collect off-box logs from any appliance that was internet-reachable on an affected build, then redeploy from a clean patched image any whose compromise status is confirmed or unknown and rotate everything it held."
  - claim_id: a8bcae3088
    entry: 2026-10-16/cve-2026-102764-beyondtrust-remote-support-zero-day
    surface: "actions[1]"
    kind: frontmatter
    text: "For every appliance that was internet-reachable on a build up to 26.2.3 at any time since late August 2026: before any change, snapshot a virtual appliance with memory and export its disk, and collect the off-box syslog, reverse-proxy or WAF and perimeter firewall logs because the actor deletes on-appliance logs; then redeploy from a clean, fully patched image every appliance whose compromise status is confirmed or unknown, and rotate the credentials it held in dependency order, including the Remote Support Vault and any credential typed into a support session."
