    discovery_trace: "first seen at: swisscybersecurity-net, WebFetch listing https://www.swisscybersecurity.net/ (item 'Update: Polizei warnt vor betrügerischen Anrufen nach Angriff auf Pensionskassen', 2026-10-15 12:00) -> pivot: article https://www.swisscybersecurity.net/news/2026-10-08/bundespensionskasse-publica-meldet-datenabfluss -> primary: police platform page https://cybercrimepolice.ch/de/faelle/betrugerische-investitionsanrufe-nach-datenabfluss-bei-pensionskassendienstleister; second lead via inside-it-ch RSS https://www.inside-it.ch/rss.xml (teaser 'Cyberangriff auf Pensionskassen-Lieferant zieht Kreise', 2026-10-14) -> article page https://www.inside-it.ch/cyberangriff-auf-pensionskassen-lieferant-zieht-kreise-20261014 (read cleanly via extract on this pass, trafilatura-direct, no Vercel checkpoint) -> NZZ https://www.nzz.ch/zuerich/nach-einem-cyberangriff-auf-einen-softwarezulieferer-sagt-die-pensionskasse-der-stadt-zuerich-es-ist-moeglich-dass-auch-daten-von-uns-betroffen-sind-ld.10032710 (read via extract) -> bluewin/tio.ch (CH Media / Aargauer Zeitung relays; bzbasel original is 403 on every transport)."
    summary: |
      Delta against entry 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow (last changelog record 2026-10-15T03:48Z, which covered PKZH and Publica's darkweb statement). None of the following is in the entry.
      1) Police warning. The cantonal-police platform cybercrimepolice.ch (RSS pubDate 2026-10-13 12:30 +0200, i.e. about 62 h before this fire, inside the 72 h developing window; SwissCybersecurity.net, which reported it on 2026-10-15, attributes it to the cantonal police of Zurich and Bern; the platform's operator is the Zurich cantonal police per the sources.json note) warns that criminals could use leaked personal and financial data to phone pension-fund members, pose as financial advisers or investment brokers and steer them into fraudulent investments of their pension assets; the page lists name, address and phone number plus possible salary and pension-asset data, and gives guidance to members and to pension funds (verify callers through official channels, a caller knowing personal data is no proof of trustworthiness, funds should expect impersonation of insureds with stolen data). The page states as fact that a software supplier of a pension fund was hit by a ransomware attack at the end of September 2026 with a data outflow; PK Softech itself says 'Schadsoftware' and has not answered whether a ransom was demanded, and Publica declined to say, so 'ransomware' is the police's characterisation, not the supplier's. SwissCybersecurity.net reads the conditional wording as no registered case of actual misuse yet.
      2) The Zurich cantonal fund. NZZ (2026-10-13): the BVK (cantonal pension fund of the Zurich administration, ~146,000 insured per NZZ; ~103,400 insured plus ~43,100 pensioners per Inside IT) has used PK Softech software since a 2011 award; its spokesperson says the application runs in the BVK's own data centre independent of the supplier, so the BVK is 'not directly affected' on today's knowledge and the supplier holds only working material (documentation, bug-fix reports, development concepts). Same NZZ piece: PK Softech says it is still unclear which and how many data are affected, it can neither confirm nor exclude that further customers are affected, and it left the ransom question unanswered; PKZH confirms to NZZ that migration tests used real insured-person test data.
      3) Ticino. Inside IT (2026-10-14) reports that the Istituto di previdenza del Cantone Ticino is listed on the Simap procurement platform as a PK Softech customer (2018 award, about CHF 1.3 million) and has so far made no statement on whether data is at risk; Inside IT also lists Stiftung FAR (construction-sector early-retirement foundation, not public sector) among the funds checking.
      4) Wider campaign context (not public sector, flagged because the pension sector is the pattern): blue News relaying CH Media says the IT partner of Stiftung FAR was also attacked, 'a different provider than the one used by Publica', that FAR has written to about 20,000 retirees, and that a retiree was phoned twice by a Swiss-German-speaking caller with a French number, with 'no link established' between the calls and the data theft. Inside IT's wording (FAR on the list of potential victims of the PK Softech incident) differs from blue News's (different provider); the sources conflict and neither is the fund's own notice, which was not located.
      Still open in every source read: access vector, actor, ransom demand, which data left and for which fund.
