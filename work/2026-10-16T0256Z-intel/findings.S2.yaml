    discovery_trace: "first seen at: inside-it-ch, RSS https://www.inside-it.ch/rss.xml (teaser 'China steckt moeglicherweise hinter Cyberattacke auf Beyond Gravity', 2026-10-15T09:53Z; article page https://www.inside-it.ch/china-steckt-moeglicherweise-hinter-cyberattacke-auf-beyond-gravity-20261015 not fetched this pass) -> pivot: swisscybersecurity-net listing https://www.swisscybersecurity.net/ (item 'Update: China koennte hinter dem Cyberangriff auf Beyond Gravity stehen', 2026-10-15) -> pivot: netzwoche update https://www.netzwoche.ch/news/2026-10-06/beyond-gravity-wird-opfer-eines-cyberangriffs -> primary: SRF https://www.srf.ch/news/schweiz/beyond-gravity-china-im-verdacht-nach-cyberattacke-auf-schweizer-weltraumkonzern (also pivoted via swissinfo/watson/20min relays; S4's lost pass had independently found the SRF lead). Company-own media release on beyondgravity.com not located (WebSearch and https://www.beyondgravity.com/en/news both returned no cyber-incident release)."
    summary: |
      Backlog row (coverage_backlog.md, held 2026-10-06, expires 2026-10-20) condition: BACS, Beyond Gravity or reporting names a vector, an actor or the data affected. Reporting now names an actor and acknowledges a data outflow, so the actor/data prong of the condition is met in its loosest form; no vector, tooling or behaviour is public.
      Facts (company, via swissinfo/Netzwoche): Beyond Gravity, the Confederation-owned space supplier spun off from RUAG in 2022, announced on Friday 2026-10-02 a targeted cyberattack, first indications of malicious activity in its IT environment on 2026-08-12, investigated with BACS and Mandiant, criminal complaint filed, a presumed 'highly professional actor'; it kept the announcement back for weeks, saying a premature statement would have endangered the forensic work.
      New in-window (SRF, 2026-10-15): SRF reports that Beyond Gravity and the Confederation assume China as the attacker, 'as several persons involved tell SRF'. Neither the company nor the Federal Department of Defence (VBS), which investigates together with BACS, confirms the suspicion; Beyond Gravity's written reply, quoted by Netzwoche, is that the origin of the attacker 'is still not confirmed and remains the subject of ongoing clarification'. SRF adds that data was apparently stolen: Maya Graf, president of the Council of States oversight committee (GPK-S), says on the record that the oversight committees of both chambers 'have taken note of the data outflow' and hold a report on the incident; which data left is unclear. Swissinfo adds that the criminal complaint is against persons unknown at the Bern public prosecutor's office and that the Office of the Attorney General, which prosecutes espionage, has not yet acted.
      Assessment ownership: the China attribution is SRF's reporting of anonymous internal assumptions, not a finding by BACS, the company or Mandiant; every other outlet (swissinfo, watson, 20min, Netzwoche) relays SRF and is not independent corroboration. Context cited by swissinfo (SRF): RUAG was hit by an espionage campaign disclosed in 2016 for which experts suspected Russia and the Attorney General suspended proceedings in 2018 for lack of identified perpetrators.
