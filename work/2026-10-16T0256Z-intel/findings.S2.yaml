      Defender vantage: nothing technical is public (no vector, tooling, dwell-time behaviour or indicator), so no detection or hardening claim is supportable; the value is the nexus (Confederation-owned defence/space supply chain, state-actor suspicion, parliamentary oversight informed, VBS+BACS+Mandiant investigating, ~7 weeks between first detection and announcement). The story also cross-links in the press to the Publica/PK Softech incident only as a sidebar; no connection is stated by any source. The 2016 RUAG espionage case (Russia suspected, proceedings suspended 2018) is context, per swissinfo.
      Admiralty suggestion: reliability B (SRF original reporting), credibility 3 for the China attribution (anonymous sources, officially unconfirmed), credibility 2 that data left (named on-record oversight-committee chair, but via SRF only).
