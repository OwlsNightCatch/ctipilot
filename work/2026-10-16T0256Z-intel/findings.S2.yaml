    discovery_trace: "first seen at: swisscybersecurity-net, WebFetch listing https://www.swisscybersecurity.net/ (item 'Über 4300 Fortigate-Firewalls in der Schweiz stehen offen im Internet', 2026-10-12 11:48; inside the record's 121 h lookback) -> primary reached: https://www.swisscybersecurity.net/news/2026-10-12/ueber-4300-fortigate-firewalls-in-der-schweiz-stehen-offen-im-internet via extract. Risikomonitor's own report was not found (WebSearch returned nothing); the page also cites the FBI/US Secret Service FortiBleed warning already in the store."
    summary: |
      Delta against entry 2026-06-18/fortibleed-73-932-internet-facing-fortigate-devices-exposed (FBI/US Secret Service advisory of 2026-10-06 already covered there). New and Swiss-specific: Risikomonitor, an Austrian cybersecurity company, counted 82,236 openly reachable FortiGate management or VPN interfaces in 42 European countries, 4,313 of them in Switzerland (rank 7; Italy 13,283, France 11,554, Spain 7,929). Of 1,455 Swiss devices examined more closely, about 60 percent are small-model series of the kind used in medical practices, law firms, trades and branch offices, and 44 are hardware the vendor no longer supplies security updates for; by network, Swisscom accounts for 689, Sunrise 92 and WWZ 39. The article states that the study does not show whether or how many of the Swiss devices are already compromised. Risikomonitor recommends removing administration access from the public internet, restricting remote access, strong two-factor authentication, firmware updates and replacing unsupported devices.
      Single trade-press source relaying a vendor scan; methodology not seen; a count of reachable interfaces, not of compromises.
