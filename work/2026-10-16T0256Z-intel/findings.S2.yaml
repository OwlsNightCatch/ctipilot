    extended_notes: |
      Triage-relevant: the police guidance doubles as a detection concept for affected bodies: inbound calls and tickets to helpdesk, HR/payroll and pension-fund member services that cite an AHV number, salary or pension balance as proof of identity, and phone-based social engineering aimed at members themselves (an anticipated follow-on, T1566.004-style voice phishing, which the police describe only in the conditional; no source reports a confirmed case tied to this leak). A benign lookalike is ordinary legitimate caller knowledge of a member's own data, so the discriminator is an unsolicited call proposing to move or invest pension assets.
      Registry: incident:pk-softech-publica-cyberattack-2026-09 already exists; no new entity. Admiralty suggestion: police and funds' own statements A, credibility 2 (consistent across sources; the 'ransomware' label is single-source and conflicts with the supplier's own wording).
