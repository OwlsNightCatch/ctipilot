    discovery_trace: "first seen at: mandiant-gtig, feed https://feeds.feedburner.com/threatintelligence/pvexyqv7v0v (item dated Thu, 15 Oct 2026 14:00 +0000) → primary: GTIG article, URL https://cloud.google.com/blog/topics/threat-intelligence/armory-castle-exploits-beyondtrust/ (extract) → pivot: BeyondTrust advisory, URL https://www.beyondtrust.com/trust-center/security-advisories/bt26-05 (WebFetch got HTTP 403; extract served via the reader fallback) → pivot: BeyondTrust blog, URL https://www.beyondtrust.com/blog/entry/bt26-05; KEV status checked on the cisa-kev bridge (not listed as of dateReleased 2026-10-15T17:00Z); EPSS API returned no record."
    summary: |
      BeyondTrust disclosed CVE-2026-102764 on 2026-10-15 (advisory BT26-05, CVSS 4.0 9.3, CWE-290 improper origin validation in an internal messaging component of Remote Support). It lets a remote unauthenticated attacker perform file operations on the appliance, which GTIG shows leads to a web shell and host-level control; all Remote Support versions up to 26.2.3 are affected and the fix is the BT26-05-RS patch for 24.3.1 to 26.2.3 (older builds must first move to a supported release). BeyondTrust says SaaS tenants were patched on 2026-10-09, withholds technical details of the flaw, and says Privileged Remote Access shares the affected code although its own testing found no way to exploit it there, so it shipped the patch for PRA as a precaution. During an incident response engagement Mandiant found that ARMORY CASTLE, a suspected PRC-nexus espionage actor GTIG formerly tracked as UNC5221, exploited the flaw as a zero-day in late August 2026; BeyondTrust's own timeline puts exploitation of one SaaS instance and one self-hosted appliance on 2026-08-29. GTIG's post-exploitation account: a PHP web shell (SAWFLY) in the appliance web root, a copy of the system shell given the root SUID bit, reads of the appliance's native secrets vault with its own CLI, persistence through a boot-time script that appends a passwordless-sudo line to the sudoers template so it survives reboot and configuration reset, mass deletion of appliance logs, elevation of an administrator's Jump Item and Team permissions from No Access to Administrator, use of the built-in file-transfer service to pull inventories from user desktops, and a custom SOCKS5-over-WebSocket tunneler (BARECLAW) exposed through a haproxy rule. GTIG and BeyondTrust attribute with differing confidence (GTIG attributes; BeyondTrust assesses moderate to high confidence, and says CrowdStrike tracks the cluster as WARP PANDA), and both expect the actor to move to opportunistic mass exploitation after disclosure, as GTIG saw after the 2024 Ivanti Connect Secure disclosures. As of this check the flaw is not in CISA KEV and has no EPSS score.
    region_nexus: "global; self-hosted remote-support and privileged-access appliances are common in Swiss public-sector and supplier IT, and NCSC-CH flagged this product family in July 2026 (store entry 2026-07-08 beyondtrust-rs-pra-preauth-bypass)"
    primary_sector_nexus: "direct (BeyondTrust names government among ARMORY CASTLE's documented targets; the appliance stores or brokers credentials for the whole estate)"
