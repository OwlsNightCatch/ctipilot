  - title: "PwnEscape (CVE-2026-99999): a Linux kernel IPv4 checksum-completion flaw lets a guest read host memory and, in the researchers' lab, escape a KVM or Firecracker guest; upstream fix and stable releases are out, no exploitation reported, researchers expect public exploits within weeks"
    sources:
      - { url: "https://pwn.ai/blog/pwnescape", publisher: "pwn.ai (PwnEscape write-up)", date: "2026-10-16", role: "primary" }
      - { url: "https://vercel.com/blog/findings-from-the-1-million-dollar-vercel-sandbox-challenge", publisher: "Vercel (Findings from the $1M Vercel Sandbox challenge)", date: "2026-10-14", role: "primary" }
      - { url: "https://thehackernews.com/2026/10/critical-pwnescape-linux-kernel.html", publisher: "The Hacker News", date: "2026-10-16", role: "corroborating" }
    discovery_trace: "first seen at: gap sweep of the Hacker News feed https://feeds.feedburner.com/TheHackersNews (item 'Critical PwnEscape Linux Kernel Vulnerability Lets Guest VMs Read Host Memory', 2026-10-16 01:54Z; THN is not in my slice) → article URL https://thehackernews.com/2026/10/critical-pwnescape-linux-kernel.html (extract) → primary: pwn.ai write-up, URL https://pwn.ai/blog/pwnescape (extract) → primary: Vercel challenge report, URL https://vercel.com/blog/findings-from-the-1-million-dollar-vercel-sandbox-challenge (extract) → CVE record read from the CVE Services API https://cveawg.mitre.org/api/cve/CVE-2026-99999 (Linux CNA, published 2026-10-15T12:19Z; NVD API shows vulnStatus Received) → KEV checked on the cisa-kev bridge (not listed as of dateReleased 2026-10-15T17:00Z); FIRST EPSS API returned no record."
    summary: |
      pwn.ai reports a Linux kernel networking flaw, CVE-2026-99999 (PwnEscape), that it found within three days of Vercel opening a USD 1 million Sandbox challenge on 2026-08-18 and reported privately; Vercel calls it the programme's most important report and its only Critical finding. The root cause is in the host's IPv4 stack, not in the hypervisor: a guest-supplied virtio-net frame carries partial-checksum metadata (checksum start and offset) that the kernel later uses to authorise a deferred write into the packet, and in ip_do_fragment() the pending checksum completes (skb_checksum_help) before the IPv4 header pointer is read again, so a crafted checksum start makes the write land inside the already-validated IPv4 header and flips the header-length field (first byte 0x45 to 0x4f). Fragmentation then believes the header is 60 bytes and copies 32 bytes beyond the packet's logical linear data into the IPv4 options of the outgoing packet, so about 32 bytes of host memory leave with each packet, repeatedly. Per the researchers and Vercel the same primitive crashed a host with two packets (taking down every sandbox on it; pwn.ai confirmed the availability failure on researcher-owned Linux 6.12 and 7.x hosts) and, on the researchers' own KVM and Firecracker machines configured like Vercel's, reached host-root command execution (four cold-boot runs in pwn.ai's KVM fixture); the memory leak was demonstrated against Vercel production sandboxes, and the authors state this is a lab result, not a claim of root execution in any vendor's production environment. The CVE record (Linux kernel CNA, published 2026-10-15) rates it CVSS 3.1 9.3 Critical with an attack vector of local: the attacker must already run code in a guest that can transmit through a virtio-net interface whose frames reach the host IPv4 stack. The fix is the upstream commit 6785011f8b16 (Red Hat's Michael S. Tsirkin; applied to net.git on 2026-10-08 and merged to mainline on 2026-10-14), a guard that rejects a checksum start pointing into the IPv4 header at five completion sites (ip_output.c, the bridge netfilter conntrack path, nfnetlink_queue, the xt_CHECKSUM target and xfrm_output); its author calls it defence in depth and says fuller input validation is still to come. First fixed stable releases per the CVE record, as quoted by The Hacker News: 5.10.272, 5.15.223, 6.1.190, 6.6.159, 6.12.113, 6.18.57 and 7.2.11; the record lists kernels from 2.6.27 as affected, and distributions often backport without a version bump. As of this check the flaw is not in CISA KEV, no real-world use is reported (The Hacker News, Vercel), and EPSS has no record. pwn.ai assesses that exploits for weaker configurations will arrive in weeks and for default hypervisor configurations in under a month, and a second post on the path from primitive to host control is announced.
    region_nexus: "global; relevant wherever Linux/KVM hosts run workloads of different trust levels, which includes private-cloud and virtualisation platforms operated by Swiss federal, cantonal and communal IT providers"
    primary_sector_nexus: "indirect (local vector; matters where tenants or less-trusted workloads share KVM or Firecracker hosts, for example shared government hosting or CI and sandbox hosts)"
    sector: "public-sector"
    cves: [CVE-2026-99999]
    techniques: [T1611, T1068, T1499.004]
    affected_products: ["Linux kernel", "KVM", "Firecracker"]
