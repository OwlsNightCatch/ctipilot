    summary: |
      Talos and Recorded Future Insikt jointly report UAT-6275 (Insikt: TAG-193; overlaps with Seqrite's Silent Lynx and sits in the broader YoroTrooper family), assessed by Talos with medium confidence to have a Kazakhstan nexus, targeting government bodies in Central Asia and the wider CIS (nine countries named) with interest in diplomacy, water resources and energy. From June 2025 to August 2026 Talos saw four infection chains: macro-enabled documents, PS2EXE-packaged PowerShell downloaders with scheduled tasks, shortcut files fetching GitHub-hosted PowerShell, and from April 2026 a crafted RAR archive exploiting WinRAR CVE-2025-8088 to drop the PickleShell reverse shell into the Windows Startup folder so it runs at the next sign-in. Lightweight reverse shells (Chvost, Laplas, PickleShell) provide interactive access. Three exposed staging directories and a GitHub repository history gave visibility into builds and infrastructure, and recovered Linux tooling and a public FortiWeb CVE-2025-25257 proof of concept suggest preparation to move against Linux hosts and internet-facing appliances. No Swiss or Western European targets are named.
