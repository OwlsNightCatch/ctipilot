        source_url: "https://unit42.paloaltonetworks.com/ai-campaign-targets-linux-infrastructure/"
    extended_notes: |
      Single vendor source and fresh (published 2026-10-15 22:00Z); no independent corroboration found yet; classification hint B2. Unit 42 does not state initial access beyond 'web shell deployment and credential harvesting', victim count, or region, so the exposure statement is class-based only: Linux web and mail hosts (Plesk-managed PHP stacks, qmail Maildir mail stores) belonging to government or state-affiliated bodies. The recovered React2Shell (CVE-2025-55182) scanner is listed as a tool; Unit 42 does not say it was the entry vector. CVE-2025-55182 and CVE-2021-4034 are both in CISA KEV (checked on the bridge).
      Detection concepts (telemetry class first): file-integrity monitoring and config audit on PHP INI files under /etc/php/ and /opt/plesk/php/ for any auto_prepend_file (or equivalent) pointing at a PHP file outside the application tree; process-creation lineage showing shells spawned by the php-fpm parent or web-server worker; write events on users' and root's shell rc files and any new alias for sudo; file-access audit on the mail store directory tree by web-server or PHP processes (mailbox enumeration, bulk archive creation); new systemd units, five-minute cron entries and hidden-name SUID-root binaries; outbound WebSocket connections from server processes to non-business addresses; touch -t timestamp changes and burst deletion of authentication, shell-history, mail and PHP-session logs; pgrep/pkill sequences naming EDR agent processes (EDR self-protection alerts are the tell). Unit 42's own endpoint rule name for the history tampering is 'Uncommon attempt to clear shell history'.
      Benign lookalikes: legitimate Plesk or PHP hardening can set auto_prepend_file (for example for a WAF loader), and administrators do define sudo aliases; the discriminators Unit 42 supports are a prepended file with a plausible vendor-looking name located outside the application tree, an alias that prompts for and logs the password, a log file named after another product, and the red-team marker strings planted in scripts (RedTeamOps2025, a pentest-style password for an attacker-created account), which should not be taken as proof of an authorised test without a change record.
      Hardening: restrict who can write PHP configuration and rc files; centralise and ship authentication, mail and web logs off-host so local deletion does not erase them; patch React Server Components and the Linux local privilege escalations used (PwnKit); keep EDR self-protection on Linux servers enabled and alert on tampering. IOCs (hashes, IPs, domains) are in the article and intentionally not carried.

  - title: "PEERSTITCH: Unit 42 documents a memory-resident FortiGate implant, installed through the FortiOS CLI auto-script path traversal CVE-2025-61624 after a FortiManager compromise exposed more than 500 managed firewalls"
    sources:
      - { url: "https://unit42.paloaltonetworks.com/fortimanager-cve-2024-47575-peerstitch-malware/", publisher: "Palo Alto Networks Unit 42", date: "2026-10-14", role: "primary" }
