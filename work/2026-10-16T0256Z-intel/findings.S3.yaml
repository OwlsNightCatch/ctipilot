    borderline_reason: "Commodity malvertising-to-RAT chain with no stated public-sector or Swiss nexus, and Mandiant's CLOUDHAZE tracking is only claimed by Expel; the transferable value is the detection lesson (a blocked C2 lookup still marks an infected, possibly unmanaged host) and the user-profile scheduled-task artefacts. Fresh (Expel 2026-10-16T00:17Z). The second source is an AI-agent-authored blog (reliability unrated)."
    evidence:
      - quote: "QuartzLine is a working PDF viewer with a backdoor hidden inside."
        attribution: "Expel"
        source_url: "https://expel.com/blog/quartzline-a-working-pdf-viewer-with-a-backdoor-inside/"
      - quote: "In at least four cases, the download passed through a redirector domain, and in two we confirmed it started with a Google Ads click."
        attribution: "Expel"
        source_url: "https://expel.com/blog/quartzline-a-working-pdf-viewer-with-a-backdoor-inside/"
      - quote: "If your DNS filter or proxy blocked these domains, the device that tried to connect is still infected."
        attribution: "Expel"
        source_url: "https://expel.com/blog/quartzline-a-working-pdf-viewer-with-a-backdoor-inside/"
      - quote: "Since then, CLOUDHAZE detections have fired dozens of times across customers in multiple industries, and several are confirmed incidents."
        attribution: "Expel"
        source_url: "https://expel.com/blog/quartzline-a-working-pdf-viewer-with-a-backdoor-inside/"
      - quote: "Public sandboxes scored it as low risk or clean. Those verdicts are wrong."
        attribution: "rogueauthority.org"
        source_url: "https://rogueauthority.org/quartzline-signed-pdf-viewer-zenith-backdoor"
    extended_notes: |
      Exposure: any Windows workstation where a user can run an installer into their profile directory and browse ad-supported pages; unmanaged devices and hosts without EDR are where Expel says the network block was the only signal. Classification hint B2 (Expel first-hand, Rogue Authority independent but AI-authored and unrated). Public analysis found no tasking in decryptable traffic, so the post-install behaviour (Chrome history upload, RAT, IronBark) rests on Expel's customer observations.
      Detection concept (telemetry class first): (1) process-creation and file-write events on endpoints for a new program under the user's local application-data directory that registers a scheduled task named like <Product>UpdateCheck or <Product>ServiceCheck with an --update-check or --check argument (a unique host ID may follow, so match task name and path, not the full command line); (2) DNS and web-proxy logs: a blocked or uncategorised lookup from a host that has no EDR, to be mapped to a device and investigated rather than closed as blocked; HTTPS POSTs to paths under /quarry/ with no User-Agent header (the teardown's observation, which is unusual for desktop software); (3) object-storage egress: uploads of a browser-history archive from a user workstation to a cloud bucket; (4) PowerShell scripts named like replaceInPlace or deployApp launched from a user-profile application directory; (5) a document-viewer process spawning cmd.exe /C or killing the browser and relaunching it with a --user-data-dir argument.
      Triage lookalike: PDF viewers and other productivity utilities are common grayware that installs per-user and registers update tasks, and many organisations tolerate them; the discriminators Expel and the teardown give are the code-signing mismatch (signer, file-details company and window title all differ), a redirector domain or ad-click download chain, an update check that talks to rotating domains with no User-Agent, and the later appearance of script-driven file drops and a second scheduled task.
      Hardening (Expel): remove the apps from the three user-profile directories and the three scheduled tasks or reimage; reset credentials and sign out active sessions for anyone who used an affected device. Defender levers the sources support: application control or per-user-install restrictions so unsigned-by-policy utilities cannot run from the profile directory, ad and redirector filtering at the gateway (also Citizen Lab's AdFection advice), and EDR coverage of unmanaged endpoints. IOCs (domains, hashes, certificate serial, bucket names) are in both posts and intentionally not carried.

