    discovery_trace: "first seen at: gap sweep of the Expel feed https://expel.com/blog/rss.xml (item dated 2026-10-16 00:17Z; Expel is not in my slice) → primary: Expel article, URL https://expel.com/blog/quartzline-a-working-pdf-viewer-with-a-backdoor-inside/ (extract) → pivot: independent teardown cited by Expel, URL https://rogueauthority.org/quartzline-signed-pdf-viewer-zenith-backdoor (extract); WebSearch for the Mandiant name 'CLOUDHAZE' and a GTIG feed check found no public Mandiant/GTIG document, so the Mandiant tracking name rests on Expel's statement"
    summary: |
      Expel describes QuartzLine, malware that presents as a functioning Windows PDF viewer (shipped as paperline.exe, QuartzLine_1.x.exe and, in a later build, fielddesk.exe) and hides a backdoor that runs commands and installs more malware; Expel says Mandiant tracks it as CLOUDHAZE (no public Mandiant document found). The binary carried an extended-validation code-signing certificate issued to an unrelated Guangzhou telecom-technology company, since revoked, while the file details name a third company and the window title a fourth. Delivery, from Expel's customer cases: in at least four cases the download went through a redirector domain and in two Expel confirmed it began with a Google Ads click, with users who were searching for things like a consent form or a wallpaper, landing on a third-party site and clicking an ad there; the installer came from an AWS S3 bucket link. Observed sequence in one customer environment: install into the user profile (%LOCALAPPDATA%\QuartzLine) with a scheduled task named QuartzlineUpdateCheck and check-ins to a rotating set of domains; a week later an executable that uploads an archive of the user's Chrome history to an S3 bucket; a self-deleting carrier; a PowerShell script that swaps in a new build; then a second PowerShell script that drops a second-stage RAT (caira.exe) with a second scheduled task (CairaServiceCheck); in another environment the RAT fetched a third payload, IronBark, the same day. Expel says the attacker pushed the second stage to infected hosts across multiple customers at once on the evening of 2026-10-09 and that its CLOUDHAZE detections have fired dozens of times across customers in multiple industries, several confirmed as incidents. A separate public teardown (rogueauthority.org, 2026-10-09, authored by an AI model working as an agent in a REMnux sandbox with an independent reviewer agent, per its own disclosure) analysed the same installer hash: a Rust program with a Slint GUI and a hidden module named 'zenith' that assigns a machine ID file, checks in over HTTPS to Cloudflare-fronted domains under /quarry/ paths, can run any command through cmd /C and can manipulate Chromium browser profiles, with a custom obfuscation layer (gzip, chained XOR, bit rotation, seeded shuffle) inside the TLS traffic; every server reply it could decrypt said there was nothing to do, public sandboxes scored the sample as low risk or clean, and the implant sends no User-Agent header. Expel's advice: a blocked connection to the command-and-control domains still means an infected device, because the scheduled tasks keep retrying, so map blocked DNS or proxy hits to hosts (starting with unmanaged devices and those without EDR), remove the apps and tasks or reimage, and treat browser-stored passwords, cookies and session tokens on the device as exposed. No victim sector or country is named.
    region_nexus: "not stated; customers across multiple industries"
    primary_sector_nexus: "indirect (malvertising-delivered trojanised utilities reach any staff workstation where users can install software into their profile, including government desktops and unmanaged devices)"
    sector: "cross-sector"
    cves: []
    techniques: [T1583.008, T1204.002, T1553.002, T1588.003, T1036, T1053.005, T1059.003, T1071.001, T1027, T1105, T1217, T1567.002]
    affected_products: ["Google Chrome", "Windows"]
    entity_keys: []
