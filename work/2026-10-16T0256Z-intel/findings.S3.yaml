      - quote: "7.2 all versions"
        attribution: "Fortinet PSIRT"
        source_url: "https://fortiguard.fortinet.com/psirt/FG-IR-26-122"
    extended_notes: |
      CVE-2025-61624 (Fortinet FG-IR-26-122, 'Path Traversal in CLI', CWE-22; requires a privileged administrator): per the PSIRT table FortiOS 7.6.0 through 7.6.4 (fixed 7.6.5), 7.4.0 through 7.4.9 (fixed 7.4.10) are affected, while FortiOS 7.2, 7.0 and 6.4 are 'all versions' with 'Migrate to a fixed release' (no fix on those branches); FortiProxy 7.6.0-7.6.4 (7.6.5) and 7.4.0-7.4.11 (7.4.12), FortiPAM 1.7.0 (1.7.1) and branches 1.0-1.6 unfixed, FortiSwitchManager 7.2.0-7.2.7 (7.2.8) and 7.0.0-7.0.6 (7.0.7); Fortinet lists a virtual patch (IPS signature FG-VD-59270.0day in FMWP database update 25.120). The PSIRT page I read shows a 2026-04-14 date and does not state exploitation; the exploitation evidence is Unit 42's 2024 case and the '.0day' virtual-patch name suggests exploitation before a fix, which I have not confirmed from Fortinet. CVE-2025-61624 is not in CISA KEV. CVE-2024-47575 (FG-IR-24-423: FortiManager 7.6.0, 7.4.0-7.4.4, 7.2.0-7.2.7, 7.0.0-7.0.12, 6.4.0-6.4.14, 6.2.0-6.2.12 and some FortiAnalyzer models in FortiManager mode affected; fixed 7.6.1, 7.4.5, 7.2.8, 7.0.13, 6.4.15, 6.2.13) is old, exploited and in KEV since 2024-10-23. Unit 42 also references CVE-2024-26008 and CVE-2024-26009 (FGFM connection reset and weak authentication) as possible steps; it could not confirm which path the attackers used to impersonate the FortiManager.
      Exposure check: is a FortiManager reachable on TCP 541 (FGFM) from untrusted networks, are unknown devices allowed to register (Fortinet's workaround is to block unknown-device registration), is FortiOS on an unfixed branch with administrators who can reach the CLI, does an MSP manage the estate centrally.
      Post-patch compromise check (Unit 42): the management platform's stolen trust material, credentials and certificates stay valid until rotated, so rotate every managed device's administrator, SSL VPN and certificate material and the FGFM trust after any suspected FortiManager compromise; review FortiOS configuration revisions for system.auto-script objects whose names contain path traversal strings; FortiGate administrators or devices that do not exist in the estate (a rogue virtual FortiGate registered on the FortiManager, an unexpected 'FortiGateCloud' administrator on an estate with no FortiManager Cloud tenant) and unexplained sniffer configurations; Unit 42 hunting table for the implant: anonymous 16,384-byte rwxp regions in the memory maps of miglogd and iked, 0xAA0003E0 NOP patches at three static offsets in those daemons, cross-process open/write on /proc/<pid>/mem between them, signal-11 crashes of miglogd, iked or syslogd in 'diagnose debug crashlog read'.
      Detection concepts (telemetry class first): management-plane audit logs (FortiManager device registration and config-archive creation events, FGFM sessions from non-management addresses); FortiGate admin and VPN logs (SSL VPN logins with recovered administrator credentials from new external addresses, auto-script create/delete, admin account create/delete in short succession); gaps in forwarded syslog (miglogd/syslogd killed before a script runs, intermittent drops on the tunnel management interface); packet-capture settings pushed to downstream devices. Triage lookalike: legitimate FortiManager workflows also create and delete auto-scripts and add devices, so the discriminators are a '../' sequence in an auto-script name, a script that writes outside its directory, a device registered from an address outside the management network, and Node.js or SSH commands appearing inside ACME challenge settings.
      Hardening: restrict FGFM and the FortiManager management plane to dedicated management networks, block unknown-device registration, move FortiOS to a fixed branch (7.4.10 or 7.6.5 or later; 7.0, 7.2 and 6.4 have no fix), use strong unique administrator passwords knowing reversible config ciphertext is brute-forceable, and treat the management platform as the highest-value target. Note that the intrusion dates from September 2024 and was published only now; the article names no victim country. IOCs and a YARA rule are in the article and intentionally not carried. Related store context: FortiBleed entry 2026-06-18 (credential-compromise campaign against FortiGate).

