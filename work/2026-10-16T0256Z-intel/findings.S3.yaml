      Exposure check (what a defender can read from the sources): the vulnerable code is in the host kernel, so what matters is the kernel running on KVM, Firecracker or other virtio-net hypervisor hosts and any host that forwards untrusted frames into the IPv4 stack (the CVE record names the tun_get_user to ip_do_fragment path from a guest's TAP device; pwn.ai says it found other ways to reach the vulnerable paths and that TUN and AF_PACKET scenarios without a VM were discussed in review). The attacker must already execute code inside a guest or a comparable local context; this is not an internet-receive bug. Compare the host kernel version against the first fixed releases above, and check the distribution advisory because backports keep the version number (Red Hat, Ubuntu, SUSE, Debian status not yet checked in this run).
      Hardening and compensating levers named by the sources: update host kernels; Vercel's own practice is to keep host kernels current, disable nested virtualisation and run each microVM under Firecracker's jailer with restricted permissions; treat all guest-supplied metadata as tenant input. No mitigation short of the kernel fix is documented.
      Detection concept (telemetry class: host network and kernel logs; low confidence, mechanism-derived): the leak makes guest-emitted IPv4 packets carry unexpected IP options (header length of 60 bytes on packets whose guest-side header was 20 bytes), so egress packet capture or flow logs on the host or at the first hop that show fragmented guest traffic with nonzero IPv4 options from sources that never set options are the tell; the crash variant leaves WARN_ONCE or panic traces from skb_checksum_help in the host kernel log. Do not treat absence of these as safety: the CVE record's own scenario text states these as the routes the researchers observed.
      Benign lookalike: legitimate traffic from some stacks and tunnels also carries IP options or fragments, so the discriminator is a guest (or VM-bound interface) emitting options it never configured, together with guest-side offload settings that supply a checksum start inside the IPv4 header; this is derived from pwn.ai's mechanism description, not a vendor detection.
      Open points for an update-of: pwn.ai Part 2 (the path from primitive to host control and hypervisor-specific adaptation); distribution advisories; any public proof of concept; possible KEV listing; the fuller input-side validation patch the kernel author says is still pending. IOCs: none in the sources; none carried.

  - title: "QuartzLine (Mandiant: CLOUDHAZE): Expel finds a working, EV-signed PDF viewer with a backdoor spread through Google Ads, followed within days by a Chrome-data collector, a second-stage RAT and a third payload across multiple customers"
    sources:
      - { url: "https://expel.com/blog/quartzline-a-working-pdf-viewer-with-a-backdoor-inside/", publisher: "Expel", date: "2026-10-16", role: "primary" }
