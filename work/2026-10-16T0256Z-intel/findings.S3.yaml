    extended_notes: |
      CROSS-DOMAIN: this is a CVE-bearing exploited zero-day; S1 may surface the same CVE from KEV/EUVD/vendor sources, so the main agent should merge on CVE-2026-102764 (one entry). Suggested weight: high or critical for any organisation with a self-hosted Remote Support appliance reachable from the internet, because exploitation predates disclosure by about seven weeks and mass exploitation is explicitly expected; classification hint B1 (GTIG B, BeyondTrust A, two independent first-hand sources).
      Exposure check (all vendor-documented): the /appliance interface lists whether the BT26-05 patch is applied or subscribed to automatic updates; self-hosted builds older than 24.3.1 must be upgraded first (upgrading closes the hole but does not remediate prior exposure); only representative console, customer portal and Jump Client traffic should be reachable from the internet, and /login and /appliance should be restricted by IP or segment.
      Post-patch compromise check (the step readers miss): patch first, then treat any appliance that was internet-reachable on a vulnerable build during the exposure window (from late August) as potentially compromised. GTIG: preserve before acting (snapshot virtual appliances with memory, export disk, request forensic preservation from BeyondTrust for B Series hardware and SaaS); collect off-box syslog, reverse-proxy or WAF and perimeter firewall logs because the actor deletes on-appliance logs; rebuild from a clean fully patched image rather than clean in place; rotate credentials only after patch or rebuild, in dependency order (appliance admin, /login administrators, API client secrets, SAML signing keys and security-provider bind accounts, Remote Support Vault and Password Safe or PRA credentials at the target system, integration credentials, anything typed into a support session in the window), and redeploy Jump Clients, Jumpoints and the representative console to invalidate tokens.
      Detection (telemetry class first): (1) appliance syslog forwarded off-box: user_changed events that raise a Jump Item or Team role from No Access to Administrator, user_added / api_account / security_provider events with no change ticket, changes to outbound-event or syslog destinations, an interruption in log forwarding that starts and ends inside a single session; (2) authentication logs: /login administrative success from residential-broadband or commercial-VPN address space or outside business hours; (3) reverse-proxy / WAF logs with full URI: request paths outside the known Remote Support path set (unknown .php paths, WebSocket upgrades from addresses that are not support staff or endpoints); (4) session reports: file-transfer events and sessions started by accounts whose role changed; (5) where host access exists: web service account spawning shells, new scripts in a boot-time script directory, an added NOPASSWD line in the sudoers template, a root-SUID copy of the system shell, a new haproxy ACL routing one path to a local port. GTIG publishes YARA for SAWFLY and BARECLAW (not reproduced here).
      Triage lookalike: a legitimate BeyondTrust administrator also changes Jump Item roles and logs in from varied networks; the discriminators GTIG/BeyondTrust give are a role change with no change ticket or named owner, a login from consumer or VPN address space that cannot be tied to a known administrator, and the sequence (login, role raised to Administrator, then file transfer from an endpoint) inside one session.
      Hardening (vendor/GTIG): SAML SSO with phishing-resistant MFA for /login users and one vaulted break-glass local account; default Jump Item role set to No Access in every group policy; default-deny egress from the appliance except BeyondTrust update/licensing endpoints and the organisation's own syslog and directory servers; forward syslog to a SIEM over TLS with multi-month retention; put a reverse proxy or WAF with URI logging in front.
      Notable lesson (BeyondTrust blog): its third-party detection platform's automated triage closed the sensors' real-time privilege-escalation alerts as false positives; BeyondTrust advises that automated triage must not be able to close high-severity signals on its own. Timeline note: BeyondTrust's blog says the patch was released to SaaS and self-hosted customers on 2026-10-08, while its advisory and GTIG say SaaS tenants were patched as of 2026-10-09; the self-hosted patch is available on /appliance now.
      Alias note: the registry carries UNC5221 and WARP PANDA under actor:verdantbamboo; GTIG now names the cluster ARMORY CASTLE (formerly UNC5221), so 'ARMORY CASTLE' should be added as an alias, not registered as a new actor. IOCs (hashes, hosts) exist in GTIG's post and a GTI collection and are intentionally not carried.

  - title: "AdFection: Citizen Lab and Confiant document targeted online ads that deliver Candiru spyware with no click, via the Israeli ad-tech firm Discover-Tech, with ads also served onto government, NATO, EU and Nordic networks"
    sources:
      - { url: "https://citizenlab.ca/research/how-discover-tech-turned-targeted-ads-into-a-pipeline-for-spyware/", publisher: "The Citizen Lab", date: "2026-10-15", role: "primary" }
      - { url: "https://blog.confiant.com/p/adint-weaponized-ad-tech-for-zero-click-spyware-and-mass-identity-vacuuming", publisher: "Confiant Threat Intelligence", date: "2026-10-15", role: "primary" }
      - { url: "https://therecord.media/spyware-citizen-lab-advertising", publisher: "The Record (Recorded Future News)", date: "2026-10-15", role: "corroborating" }
    discovery_trace: "first seen at: therecord, feed https://therecord.media/feed (item 'Zero-click spyware infecting devices through online ads, researchers say', Thu, 15 Oct 2026 19:00 GMT; the citizen-lab RSS https://citizenlab.ca/feed/ had not yet listed it, newest item there 2026-10-08) → article URL https://therecord.media/spyware-citizen-lab-advertising → primary: Citizen Lab, URL https://citizenlab.ca/research/how-discover-tech-turned-targeted-ads-into-a-pipeline-for-spyware/ (extract) → independent co-timed investigation: Confiant, URL https://blog.confiant.com/p/adint-weaponized-ad-tech-for-zero-click-spyware-and-mass-identity-vacuuming (extract)"
    summary: |
      Citizen Lab reports the first public technical confirmation of zero-click mercenary spyware delivered through targeted online advertising, which it calls AdFection: in 2024 and 2025 at least 45 devices at Al Jazeera were targeted, and it links the attack with high confidence to Candiru (rebranded Integrity Labs) spyware delivered through ads bought by Discover-Tech, an Israeli firm that presents itself as an ad company. Mechanism: a Discover-Tech ad contains a script tag that calls the firm's ad-decision server with the user's advertising or cookie identifier; the server returns JavaScript only to devices it deems eligible and a zero-byte reply otherwise, which keeps malicious code out of what ad vendors can inspect; for a target the code loads an iframe, the device then contacts a Candiru validator server and finally a Candiru command-and-control server, the sequence Al Jazeera's network logs showed, and the recovered Windows implant persists through COM hijacking. Confiant, working independently from ad-delivery telemetry from April to September 2026, reports a cloaked ad payload that fingerprints the device, opens a cryptographically protected command channel (with possible switches to WebSocket or WebRTC transport), accepts pushed code, and hands micro-targeted impressions to Candiru-attributed infrastructure, with nine countries seeing the Candiru hand-off and Belgium the most targeted (56 percent of those hits); Confiant has not captured a full exploit chain. Citizen Lab's analysis of four billion Discover-Tech bid records shows ads on almost 200,000 sites and apps in four months and impressions on networks of ministries of defence, armed forces, national cyber agencies, NATO, the UN, the European Parliament, the European Commission and the Council secretariat, Nordic and Czech and Italian government bodies and others; an impression is not proof of targeting or infection, and no Swiss network is named by either report, though both say their visibility is partial. A second actor, DARK CARTOGRAPHER, used the same infrastructure for mass deanonymisation by abusing mobile-carrier issues to tie advertising IDs to phone numbers; a separate report is pending. Google, IAB Europe, Beeswax, Vungle (Liftoff) and Eskimi disconnected Discover-Tech after disclosure.
    region_nexus: "global with a strong Europe pattern: Belgium is Confiant's most-targeted country for the Candiru hand-off, ads reached EU institutions, NATO, Nordic, Czech and Italian government networks, and Discover-Tech used GDPR consent frameworks to target EU users; no Swiss network named"
    primary_sector_nexus: "indirect to direct (government, defence and intergovernmental devices browsing ad-supported sites and apps are the exposed class; the control Citizen Lab recommends is a government-network policy)"
    sector: "public-sector"
    cves: []
    techniques: [T1189, T1583.008, T1592, T1546.015, T1027, T1071.001]
    affected_products: []
    entity_keys: []
    new_entities:
      - { key: "actor:discover-tech", type: actor, name: "Discover-Tech", aliases: ["Controlium", "MyDSP"], summary: "Israeli ad-tech firm that Citizen Lab says operates the Controlium platform and acts as a bridge between ad vendors and mercenary spyware vendors, delivering Candiru spyware through targeted ads (Citizen Lab, Confiant, 2026-10-15)." }
      - { key: "actor:candiru", type: actor, name: "Candiru", aliases: ["Integrity Labs"], summary: "Israeli mercenary spyware vendor, rebranded Integrity Labs; Citizen Lab links with high confidence the spyware delivered to Al Jazeera devices through Discover-Tech ads to a newer version of its 2021 attack chain (Citizen Lab, 2026-10-15)." }
      - { key: "actor:dark-cartographer", type: actor, name: "DARK CARTOGRAPHER", aliases: [], summary: "Name Citizen Lab gives to an actor using Discover-Tech ads and other vendors since at least 2019 to deanonymise users at scale by exploiting mobile-carrier issues to tie advertising IDs to phone numbers; a technical report is pending (Citizen Lab, 2026-10-15)." }
      - { key: "campaign:adfection-discover-tech-candiru-2026", type: campaign, name: "AdFection", aliases: [], summary: "Zero-click spyware delivery through targeted online ads via Discover-Tech's Controlium platform, documented by Citizen Lab and Confiant on 2026-10-15." }
    relation_suggestions:
      - { subject: "actor:discover-tech", object: "actor:candiru", basis: "Citizen Lab: Discover-Tech's ads infect and profile devices on behalf of Candiru, based on traffic sequences, server fingerprints and a recovered implant (Citizen Lab, 2026-10-15)" }
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Devices at international news network Al Jazeera were infected with mercenary spyware from Candiru"
        attribution: "The Citizen Lab"
        source_url: "https://citizenlab.ca/research/how-discover-tech-turned-targeted-ads-into-a-pipeline-for-spyware/"
      - quote: "A Discover-Tech ad impression does not in and of itself confirm targeting or infection with spyware."
        attribution: "The Citizen Lab"
        source_url: "https://citizenlab.ca/research/how-discover-tech-turned-targeted-ads-into-a-pipeline-for-spyware/"
      - quote: "there is currently no consistently safe way to expose your users and networks to targeted ads"
        attribution: "The Citizen Lab"
        source_url: "https://citizenlab.ca/research/how-discover-tech-turned-targeted-ads-into-a-pipeline-for-spyware/"
      - quote: "Where possible, block online advertising at the gateway to your organization, and on work-issued and edge devices."
        attribution: "The Citizen Lab"
        source_url: "https://citizenlab.ca/research/how-discover-tech-turned-targeted-ads-into-a-pipeline-for-spyware/"
      - quote: "Belgium was the first target we observed on April 12, and stayed by far the most targeted country (56% of global hits during the period)."
        attribution: "Confiant"
        source_url: "https://blog.confiant.com/p/adint-weaponized-ad-tech-for-zero-click-spyware-and-mass-identity-vacuuming"
      - quote: "Even though we have not captured a full exploit chain in the wild"
        attribution: "Confiant"
        source_url: "https://blog.confiant.com/p/adint-weaponized-ad-tech-for-zero-click-spyware-and-mass-identity-vacuuming"
    extended_notes: |
      Why it matters here: this is a delivery path that bypasses mail and web-filter controls entirely and needs no user action; the exposed class is any device that renders third-party ads (mobile apps and browsers) on government, defence, diplomatic or intergovernmental staff. No in-the-wild infection of a Swiss body is reported and neither report names a Swiss network; Citizen Lab's impression data covers only Discover-Tech's MyDSP platform (not Beeswax or Eskimi) and a limited period, so absence from the lists is not evidence of absence. Classification hint B1 (two independent lab investigations co-timed, plus press relay).
      Hardening levers (Citizen Lab): block advertising and tracking at the organisation's gateway and on work-issued and edge devices; disable or reset advertising IDs on managed mobile devices through MDM; use browsers with built-in anti-tracking and Global Privacy Control; monitor traffic linked to ad impressions for malicious requests. Citizen Lab says blocking advertising identifiers defeats Discover-Tech's current method but suspects the attack surface is wider. It also recommends government policy of mandatory ad-blocking on government devices (cites NSA 2018 and CISA 2020 malvertising guidance).
      Detection concept (telemetry class: web-proxy, DNS and egress logs per device): the Al Jazeera signature was ad-network impression traffic, then a connection to a Candiru validator host (a bare Apache banner, fingerprinted by Citizen Lab on Censys), then contact with a Candiru command-and-control host; on the ad side the tell is a script tag calling a 'getAd'-style endpoint with the advertising or cookie ID and device parameters in the query string, answered by a zero-byte or short JavaScript body, followed by a fresh iframe from a CDN hostname. Confiant notes the SDK may move from HTTP polling to WebSocket or WebRTC, which hides the channel from HTTP monitoring, and that Candiru delivery hosts were rotated every few days. Endpoint artefact from the Windows implant: COM-hijack persistence (T1546.015). IOCs (domains, hashes, a Censys fingerprint) are in both reports and intentionally not carried.
      Benign lookalike: ordinary ad-tech tags also call identifier-bearing endpoints and sync user IDs; the discriminators reported are the eligibility gating (empty reply for most users, code only for chosen devices), the immediate hand-off to uncategorised hosts, and the validator-then-C2 sequence. Targeting skew from Confiant: Android in Palestine, Lebanon, Belgium and Portugal; iOS in the Netherlands, Sweden, Norway and Montenegro; Candiru hand-off countries Belgium, UAE, Montenegro, Bahrain, Thailand, Saudi Arabia, Mexico, Spain and Malaysia.
      Detail differences to carry correctly: The Record says 'at least 45 journalists' where Citizen Lab (primary) says at least 45 devices; The Record also relays from Confiant that ads rendered on networks including the US Department of Defense, Estonia's RIA, the IAEA and the ICC, which I could not find in Confiant's extracted text (the named-network list may be an image) - attribute it to The Record's reading if used. Citizen Lab's DARK CARTOGRAPHER report is announced as forthcoming; a later update-of is likely.

  - title: "CL-UNK-1211: Unit 42 documents an AI-assisted intrusion set against government Linux web and mail servers, with PHP auto_prepend_file persistence on Plesk hosts, sudo-alias password capture and a custom Go RAT"
    sources:
      - { url: "https://unit42.paloaltonetworks.com/ai-campaign-targets-linux-infrastructure/", publisher: "Palo Alto Networks Unit 42", date: "2026-10-15", role: "primary" }
    discovery_trace: "first seen at: gap sweep of the Unit 42 feed https://unit42.paloaltonetworks.com/feed/ (item dated Thu, 15 Oct 2026 22:00 +0000; Unit 42 is not in my slice) → primary: Unit 42 article, URL https://unit42.paloaltonetworks.com/ai-campaign-targets-linux-infrastructure/ (extract); WebSearch ('CL-UNK-1211 Unit 42 AI-generated Linux government espionage SysGoRAT') found no independent coverage yet"
    summary: |
      Unit 42 reports a campaign it tracks as CL-UNK-1211 (UNK: nation-state or cybercrime affiliation not yet determined) that targeted government entities and state-affiliated infrastructure between October 2025 and April 2026, focusing on Linux servers to run reconnaissance and keep persistent access for intelligence collection; it names no victim country or initial access vector, and lists a custom Go scanner for React Server Components CVE-2025-55182 among the recovered tools. Scripts carried conversational, step-by-step AI-style reasoning comments, Base64-heavy commands and seamless switches between PHP, JavaScript, Bash and Python, which Unit 42 reads as code either generated by an LLM or deployed by an automated AI agent (an inference, not a confirmed finding). Persistence and access: a mix of custom and GitHub-sourced PHP web shells run under the php-fpm parent process, with the auto_prepend_file value rewritten in every PHP configuration under /etc/php/ and /opt/plesk/php/ so a planted file runs before any other PHP script, in one case a file named to look like a Plesk driver. Credential theft: the .bashrc replaced so a sudo alias shows a fake password prompt and logs the input to a file named like SolarWinds activity, a line added to a PHP login page to log administrator credentials, and searches of configuration and shell-history files for cleartext email, SMTP and database passwords; privilege escalation with LinPEAS and the public PwnKit exploit (CVE-2021-4034), then root-SUID shell binaries (a custom shell and a renamed bash) and a renamed Python interpreter used to run commands as root, all under hidden names. Collection: the actors counted mail in /var/qmail/mailnames/ Maildir folders, ran a PHP script to find social-media-related mail, and tried a script to zip whole mailboxes to take over external social media accounts tied to government addresses (that script failed on a syntax error), and they dumped databases. Tooling: SysGoRAT, a Go RAT for Linux and Windows with a WebSocket command channel, seven command types and systemd, cron, Run-key and scheduled-task persistence under names mimicking OneDrive and system services, plus reverse shells over named pipes, bash TCP redirects and Python. Evasion: attempts to kill the Cortex XDR agent with pgrep and pkill, deletion of authentication, shell-history, mail, OS, web-server and PHP-session logs, timestomping with touch -t, and planted red-team markers to pass as an authorised test. Unit 42 says its endpoint product detected and stopped the process-termination attempts.
    region_nexus: "not stated; victims are described only as government entities and state-affiliated infrastructure"
    primary_sector_nexus: "direct (government web and mail hosting on Linux; transferable to cantonal and communal hosting, Plesk-managed mail and web estates)"
