      - { key: "malware:caira", type: malware, name: "Caira", aliases: ["caira.exe"], summary: "Second-stage RAT dropped onto QuartzLine-infected hosts by PowerShell scripts, persisting through a CairaServiceCheck scheduled task (Expel, 2026-10-16)." }
      - { key: "malware:ironbark", type: malware, name: "IronBark", aliases: [], summary: "Third-stage payload pulled by the Caira RAT in one Expel customer environment, with an IronbarkUpdateCheck scheduled task and a %LOCALAPPDATA%\\IronBark install directory (Expel, 2026-10-16)." }
    relation_suggestions:
      - { subject: "malware:quartzline", object: "malware:caira", basis: "Expel: the attacker dropped the second-stage RAT caira.exe onto QuartzLine-infected hosts (Expel, 2026-10-16)" }
      - { subject: "malware:caira", object: "malware:ironbark", basis: "Expel: in another environment the RAT pulled down a third payload, IronBark (Expel, 2026-10-16)" }
