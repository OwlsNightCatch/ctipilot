    discovery_trace: "first seen at: gap sweep of the Unit 42 feed https://unit42.paloaltonetworks.com/feed/ (item dated Wed, 14 Oct 2026 22:00 +0000; Unit 42 is not in my slice) → primary: Unit 42 article, URL https://unit42.paloaltonetworks.com/fortimanager-cve-2024-47575-peerstitch-malware/ (extract) → pivot: Fortinet PSIRT FG-IR-26-122, URL https://fortiguard.fortinet.com/psirt/FG-IR-26-122 (CVE-2025-61624 and version table) → pivot: Fortinet PSIRT FG-IR-24-423, URL https://fortiguard.fortinet.com/psirt/FG-IR-24-423; KEV state checked on the cisa-kev bridge (CVE-2024-47575 listed 2024-10-23, CVE-2025-61624 not listed)"
    summary: |
      Unit 42 investigated a September 2024 intrusion at a telecommunications managed service provider (cluster CL-STA-0954, aka UNC5820) that began with CVE-2024-47575, the unauthenticated FortiManager FGFM (TCP 541) flaw, through which the attackers registered a rogue virtual FortiGate and exfiltrated an archive holding the running configurations, cryptographic material and database files for more than 500 managed FortiGate firewalls, the provider's own and its clients'. After a long dwell the actors used the FortiManager to push packet-capture (sniffer) configurations to downstream firewalls, targeting cleartext HTTP, TFTP, RADIUS and LDAP and a block of high TCP ports, and opened SSL VPN sessions with legitimate credentials (Unit 42 confirmed that the administrator and SSL VPN passwords stored as reversible ciphertext in the stolen configurations can be recovered by brute force). They escalated from FortiOS administrator to root with CVE-2025-61624, a path traversal in the FortiOS CLI system.auto-script engine (the object name is not sanitised, so a script body can be written anywhere), and dropped PEERSTITCH, a one-shot ARM64 injector that attaches with ptrace to the logging daemon miglogd and the IKE/IPsec daemon iked, allocates a 16 KB read-write-execute region, NOP-patches three static offsets and sets up a covert in-memory channel between the two daemons that lets tagged VPN sessions skip default FortiOS validation. PEERSTITCH leaves no binary on disk, opens no listening port and makes no outbound connection of its own. Command and control used the firewall's Apache mod_md ACME module pointed at an attacker ACME server so each renewal challenge runs a Node.js command, and the actors impersonated the management platform over FGFM to pull configurations from other firewalls, then killed miglogd and syslogd, cleared crash logs and removed the auto-script objects. Unit 42's summary lesson: the platform's trust material for every managed device 'leaves with the attacker and remains valid until it is rotated', so patching the platform does not end the exposure.
    region_nexus: "not stated (telecommunications MSP); Fortinet FortiGate and FortiManager are widely deployed in Swiss public-sector perimeters and managed-service arrangements"
    primary_sector_nexus: "direct (central firewall management plane and MSP-managed edge estates; the same class applies to cantonal and communal IT providers that manage firewalls for several bodies)"
