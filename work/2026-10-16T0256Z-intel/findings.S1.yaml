- title: 'Juniper October 2026 Junos bundle: unauthenticated J-Web takeover and httpd RCE among 23 CVEs scored 9.0 or higher, none reported exploited'
  novelty: new
  borderline: true
  borderline_reason: 'No exploitation (Juniper SIRT: not aware of any malicious exploitation), no public PoC and no workaround besides patching or removing the J-Web precondition; published 2026-10-14 16:00Z,
    so the primary is just outside the 26 h window and only the CERT-FR/BSI relays of 2026-10-15 are in-window. But four unauthenticated management-plane flaws (J-Web auth bypass x3, httpd stack overflow)
    on Junos SRX/EX/MX/PTX with no vendor workaround, in a bundle of ~150 CVEs, make it a plausible patch-priority item for a public-sector network team; the main agent decides between a short entry and
    a drop.'
