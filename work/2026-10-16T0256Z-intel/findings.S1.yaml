    CVE-2026-96889 plus three GitHub advisory ids)'
  summary: |
    Vercel's out-of-band Next.js security update of 2026-10-14 (the two fixes were postponed from the September release because of upstream dependency delays) ships in Next.js 16.4.1 (Active LTS) and 15.5.28 (Maintenance LTS). Two flaws are rated Critical, each CVSS 9.5 per The Hacker News's reading of Vercel's table, and allow unauthenticated remote code execution: (1) GHSA-673q-mjm6-r5xr (no CVE as of 2026-10-15), a flaw in React Server Components reached when an App Router app with Cache Components enabled has a `use cache` function that returns more than one typed array; affected Next.js 16.0.0 through 16.4.0, fixed 16.4.1; React's related advisory GHSA-xqc2-xf4c-x3h3 covers react-server-dom-webpack, -parcel and -turbopack 19.0.0 through 19.3.0 ("extremely rare cases where responses transport multiple typed arrays and an attacker-controlled value"); Vercel says there is no known workaround and to upgrade even if the app has no such function. (2) CVE-2026-96889 / GHSA-2464-fhr4-w9xw, a memory bug in librsvg, reached through the sharp package in the Image Optimization API (and next/og on the Node.js runtime), giving code execution when Next.js runs on glibc-based Linux and attacker-supplied SVG is processed; affected 10.0.0 through 15.5.27 and 16.0.0 through 16.4.0, fixed in 16.4.1 or 15.5.28 with sharp 0.35.5 or later; by default Next.js does not optimise SVG files, serving them through the optimizer needs the dangerouslyAllowSVG setting; interim mitigation is sharp 0.35.5 or later, or sharp.block({ operation: ["VipsForeignLoadSvg"] }). A third, High, issue is a denial of service through crafted requests to App Router apps with at least one Server Action (GHSA-p3m5-59mp-jv5r; Next.js 13.0.0 through 15.5.27 and 16.0.0 through 16.4.0; fixed 15.5.28 and 16.4.1; Pages Router apps are not affected). The Hacker News notes that on version 15 an upgrade may leave the older vulnerable sharp 0.34.x in place (check `npm ls sharp`), that Netlify says its platform does not run the image-optimizer code path, and that this is the third image-processing code-execution flaw in Next.js since August. No exploitation or public exploit is reported by any source; the advisory pages for the use-cache and Server Actions flaws had no CVE and were absent from the npm advisory feed on 2026-10-15, so dependency scanners may not flag them.
  region_nexus: global; Next.js underlies many public-sector web portals and citizen-facing apps (no Swiss-specific source)
