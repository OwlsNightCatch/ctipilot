  summary: |
    Microsoft fixed CVE-2026-62878, a stack-based buffer overflow in the Windows DNS Server that an unauthenticated attacker can reach over the network (CVSS 3.1 9.8, Critical, "Exploitation Less Likely", exploited: No), in the August 2026 updates (MSRC record, release 2026-08-11). Researchers Nicolas Alejandro Malizia and Joaquin Grassi then published a proof of concept on GitHub (repository dated 2026-09-24) whose status line reads "Remote DoS reproduced — RCE research ongoing": a single NUL byte (0x00) at the start of a DNS label breaks an assumption in dns.exe's name tree (Dns_DowncaseNameLabel keeps the label by explicit length while the inline hash walk in NTree_FindOrCreateChildNodeEx stops at the NUL), so names pile into one hash bucket; once a chain passes 64 children NTree_CreateHashAtNode copies it into a fixed 500-slot stack array with no bounds check, and about 500 nodes in the overwrite reaches the stack cookie, where /GS stops it and the server crashes. The trigger is a plain recursive query to an attacker-controlled domain (the authors used a fake forwarder); they say an NXDOMAIN response is also cached, so the same mechanism might work against any public domain with no attacker infrastructure, which they mark as untested. They state that remote code execution has not been achieved. On 2026-10-13 0patch released micropatches for Windows Server 2008 R2, 2012 and 2012 R2 (fully updated, with or without ESU); 0patch says Microsoft's fix limits query recursion nesting depth to 62 and its patch is logically identical. For servers on supported Windows versions the August cumulative update closes it.
