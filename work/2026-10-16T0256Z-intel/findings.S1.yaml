    returned ''Loading'')'
  summary: |
    Juniper's October 2026 quarterly security bulletin run of 2026-10-14 covers about 150 CVEs across Junos OS and Junos OS Evolved (SRX, MX, PTX, EX and others; JSA112168 and following, in Juniper's own CVE records and relayed by CERT-FR as CERTFR-2026-AVI-1322). Read from Juniper's CNA records, 23 of them score 9.0 or higher on CVSS 4.0 or 3.1, every one carrying the statement "Juniper SIRT is not aware of any malicious exploitation of this vulnerability." The ones that matter most for a network team are the unauthenticated management-plane flaws, all with "no known workarounds": CVE-2026-101954 (J-Web management interface and its NETCONF session handling: an unauthenticated network attacker obtains root-level device configuration access and takes over the device when web management is enabled; Junos OS and Evolved), CVE-2026-101956 (J-Web: unauthenticated remote attacker runs arbitrary Junos commands as root; Junos OS 25.2 and later branches only), CVE-2026-101986 (J-Web: crafted HTTP request bypasses authentication and executes CGI content with elevated privileges; Junos OS and Evolved, all supported branches), and CVE-2026-101983 (httpd stack-based buffer overflow giving remote code execution when a J-Web virtual domain with mTLS is configured). All four carry CVSS 3.1 9.8 and CVSS 4.0 9.3 and need the configuration stanza `system services web-management` (CVE-2026-101983: `system services web-management https virtual-domain mtls`), i.e. J-Web enabled and reachable. Other unauthenticated or peer-reachable 9.0+ items need a specific feature: CVE-2026-102182 (MX: certificate-based IKE packets give root code execution, kmd), CVE-2026-33792 (SRX: srxpfe overflow when a GRE tunnel is configured), CVE-2026-101950 (SRX: malformed IPv4 packets crash the forwarding process when Secure Vector Routing is enabled), CVE-2026-102175 (sdxd service-deployment daemon: heap overflow for an attacker who controls or intercepts the deployment server connection), CVE-2026-33796 / CVE-2026-102178 / CVE-2026-101982 / CVE-2026-101990 / CVE-2026-33789 (rpd stack overflows reachable from a configured BGP peer: BMP route monitoring, BGP flowspec, EVPN-VPWS), CVE-2026-101967 (Evolved PTX: attacker-controlled DHCP response gives root during zero-touch provisioning), CVE-2026-102031 (Evolved: low-privileged TACACS+ user gets root command execution when authorization refresh is enabled), and several SRX Security Intelligence / UTM items (CVE-2026-101997, -102062, -102037, -101955) at 9.2 on CVSS 4.0 and 8.1 on CVSS 3.1, plus CVE-2026-102084 (SRX ADVPN overflow, needs the shared secret or a compromised peer). Fixed releases for the J-Web flaws: Junos OS 23.2R2-S7.7, 23.4R2-S8.13, 24.2R2-S5.5, 24.4R2-S5, 25.2R2-S2, 25.4R1-S3, 25.4R2, 26.2R1-S2, 26.2R2, 26.4R1 and later (Evolved: matching -EVO builds); for the 23.2, 23.4 and 24.2 trains the vendor says specific respins were rebuilt, so previously downloaded images of those releases are not the fixed ones. No source reports exploitation, a public proof of concept, or attribution.
  region_nexus: global; Junos SRX/MX/EX are common in public-sector and service-provider networks (no Swiss-specific source)
