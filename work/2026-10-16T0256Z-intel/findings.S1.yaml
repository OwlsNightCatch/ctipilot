  category: vendor-psirt
  why: 'First-party, scored (risk 0-25) advisories for the CMS behind many public-sector sites, with pre-announcements (PSA) that warn of imminent exploit development; SA-CORE-2026-014 was the 2026-10-14
    critical Field UI RCE. Recipe observed: `extract https://www.drupal.org/sa-core-2026-014` read cleanly on the first request, then drupal.org answered `extract` with a client challenge for sibling pages
    and the PSA, while WebFetch read SA-CORE-2026-015/-016 and SA-CONTRIB-2026-218 in full. Feed/listing not verified in this run (the URL given is a fetched advisory, not a listing).'
