- title: 'Next.js out-of-band update of 2026-10-14: two critical unauthenticated RCE flaws (use cache typed arrays in Next 16; SVG handling in sharp/librsvg on glibc Linux, CVE-2026-96889), fixed in 16.4.1
    and 15.5.28'
  novelty: new
  borderline: true
  borderline_reason: Vercel rates both flaws Critical (CVSS 9.5) and unauthenticated, but the preconditions are narrow (App Router with Cache Components and a use cache function returning several typed
    arrays, or attacker-supplied SVG passed to sharp, which Next.js does not do by default), nothing reports exploitation or a public exploit, and two of the three advisories have no CVE so npm audit does
    not warn. Included because a web framework on internet-facing government portals with an unauthenticated RCE and no workaround for the use-cache flaw is worth a short entry; the main agent decides.
  sources:
