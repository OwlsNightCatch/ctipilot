    only. Not covered this run; WebSearch found no October post.'
- source_id: juniper support portal (supportportal.juniper.net, no sources.json record)
  reason: 'Every bulletin and the short JSA URLs are a Salesforce Lightning shell on url, extract, jina and WebFetch (''Loading'', ''CSS Error''). Working recipe for Juniper facts: take the CVE ids from
    the CERT-FR avis (cert-fr avis-recent / extract CERTFR-2026-AVI-1322) and read Juniper''s CNA records with `python3 tools/fetch_source.py url https://cveawg.mitre.org/api/cve/<CVE>` (title, configuration
    precondition, workaround, fixed releases, CVSS, ''Juniper SIRT is not aware...'' statement, JSA id); 154 records read in under 10 s with xargs -P 8.'
- source_id: ivanti hub (hub.ivanti.com advisory pages)
  reason: 'JS shell on every transport (Salesforce community); Ivanti''s own advisory for CVE-2026-104935 could not be read, so affected-branch naming rests on CERT-FR, CCCS and Volexity (the sources disagree:
    25.1.2.2 vs 25.2.2). Blog https://www.ivanti.com/blog/october-2026-security-update reads with extract.'
- source_id: cisa-advisories
  reason: 'Recipe note: WebFetch of the listing with f[0]=advisory_type:93 returned title, date and href for 10 items and the per-alert page read fine; `extract` on cisa.gov alert pages is served by the
    reader fallback (credit spent) although WebFetch reads them free; prefer WebFetch first for cisa.gov alerts.'
- source_id: ccb-belgium
  reason: 'Recipe confirmed working (2026-10-16): `url https://ccb.belgium.be/advisories` lists /advisories/<slug> hrefs, the dates sit in the markup after each href, `extract <advisory URL>` reads each
    warning (affected software, CVE/CVSS, source, risk). The CCB page''s ''Last update'' line can lag the vendor advisory by days (Splunk SVD of 2026-10-07 appeared as 13/10).'
- source_id: fortinet-psirt
  reason: 'Recipe confirmed working: `feed https://filestore.fortinet.com/fortiguard/rss/ir.xml 30` now reads direct (dated items, titles, links); per-advisory severity, attack type, Known Exploited flag
    and CVSSv3 are only in the raw HTML (`url --direct` and tag stripping); `extract` gives prose and version tables.'
