  extended_notes: |
    The CVSS 9.5 figures and the version table are The Hacker News's rendering of Vercel's GitHub advisories (the GitHub advisory pages were not fetched); Vercel's own blog post gives severity words only. Exposure check: next version in package.json/lockfile (and `npm ls sharp`), whether Cache Components / `use cache` is enabled (Next 16 App Router), whether dangerouslyAllowSVG is set or next/og runs on the Node.js runtime, and glibc-based Linux hosts (not musl/Alpine per Vercel's wording, not stated that way - only glibc is named as affected). Detection class (inference): application-server process-creation telemetry (node process spawning a shell or interpreter), crashes of the sharp/libvips native module in node logs, and unexpected outbound connections from the Next.js server; no artifact is published. Hosting platforms (Vercel, Netlify) may mitigate some paths; self-hosted deployments are the exposed ones.
