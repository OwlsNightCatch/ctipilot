  summary: |
    Microsoft added an update dated 2026-10-15 to its Exchange Team announcement of the October 2026 Exchange security updates: it has received reports that installing the October 2026 Windows Server cumulative updates (KB5126646 for Windows Server 2025, KB5126655 for 2022, KB5126651 for 2019, KB5126868 for 2016) can make Exchange Server OWA fail with 'MapiExceptionMdbOffline: Unable to make connection to the server. (hr=0x80004005, ec=1142)' (event ID 1006 in the Application log) and the email queues grow; it says installing the October 2026 Exchange updates is not required for the issue to occur and that it is investigating with its Windows partners. Two independent German Exchange admin sources report the same pattern from reader reports: Borns IT- und Windows-Blog says Exchange SE servers (incl. DAG members) stop serving 24 to 36 hours after the update installs, and Frankys Web (which first blamed the Exchange SU KB5128895 and rewrote its article on 2026-10-15 to put the cause on the Windows Server cumulative update) says databases still show as mounted and healthy in the Exchange admin center while users cannot connect and no mail is delivered; both say a restart cleared it at least temporarily (reader and author reports, not a Microsoft statement) and Frankys Web advises not installing the Windows update on Exchange servers for now while still installing the Exchange SU for the flaws it closes. As of the fetch, Microsoft's KB5126646 release notes do not list this as a known issue (only a WSUS item), and Microsoft has given no fix or workaround. Relevance for the entry: the entry tells defenders to install the October Exchange update on every Exchange server; the new fact is that the same Patch Tuesday's Windows Server updates, not the Exchange SU according to Microsoft, are the reported cause of a delayed Exchange outage, which changes the patch-sequencing decision (security fixes: CVE-2026-70571 unauthenticated email-borne RCE and CVE-2026-70279, both Exploitation More Likely, versus a reported outage on the Windows side). Observable symptom class for triage: Exchange mailbox-database connectivity errors (MapiExceptionMdbOffline) with event ID 1006 in the Application log roughly 22 to 36 hours after a Windows Server cumulative update, with the Exchange admin center showing databases mounted; this is a patch-regression, not an attack, and an attacker-driven outage would not be tied to a Windows Update install time.
