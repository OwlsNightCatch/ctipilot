    AnyPwn is a heap-based buffer overflow (CWE-130) in AnyDesk for Linux's session protocol: the handler for mode-5 stream packets trusts a remote payload length, adds the 16-byte object header in 32-bit arithmetic so that a declared length of 0xFFFFFFF0 wraps to a tiny allocation, and then copies attacker-supplied bytes past its end. The researchers (Rick de Jager, V12 security team) published a working exploit on GitHub on 2026-10-08 that executes an arbitrary command as root over a direct TCP connection to port 7070 before any desktop-control approval, because the AnyDesk Linux service normally runs as root; its README says the offsets target AnyDesk Linux 8.0.2 only (service mode, TCP/7070, x86_64), the heap layout is probabilistic and a failed attempt crashes the service instead of executing the command, and other builds need different offsets. The researchers also say the same session-protocol path is reachable over AnyDesk relay connections, validated only with a minimal Frida trigger and not as a full chain; AnyDesk said in June that the issue is limited to direct connections on Linux and that Windows and macOS are not affected (as relayed by The Hacker News). AnyDesk fixed it in 8.0.3 on 2026-06-23; its changelog entry reads only "Fixed a bug that could lead to a crash" and the vendor issued no advisory; the researchers announced the flaw on 2026-06-22 and say the vendor appears to have deleted the 8.0.2 build from its download page after their PoC video. The CVE (CVE-2026-109390, CVSS 3.1 9.8) was registered only on 2026-10-12, listing AnyDesk 8.0.0 up to but excluding 8.0.3 as affected; CISA's ADP record marks exploitation as proof-of-concept, automatable, total technical impact. The Centre for Cybersecurity Belgium issued a Patch Immediately warning on 2026-10-13 and says a proof of concept is public. Later releases are 8.0.4 (2026-06-30) and 8.1.0 (2026-09-23). No source reports exploitation in the wild. Exposure and discriminators: affected hosts are Linux machines running the AnyDesk service at 8.0.0 to 8.0.2 with a reachable direct-connection listener on TCP 7070; because the fix shipped in June under a crash-fix label, advisory- and CVE-keyed patch triage would not have prioritised 8.0.3, so installed versions must be inventoried rather than inferred from advisories. Defender telemetry (inference from the mechanism and the README, not stated as detection guidance by any source): AnyDesk service crashes or restarts on Linux hosts (a failed probabilistic attempt crashes the service), inbound connections to TCP 7070 from sources that are not known AnyDesk peers in firewall or flow logs, and shell or interpreter child processes of the root AnyDesk service process in process-creation telemetry; legitimate AnyDesk sessions also connect to port 7070 on direct-connection LANs, but they produce session request and accept records in AnyDesk's own logs and never spawn a shell from the service.
