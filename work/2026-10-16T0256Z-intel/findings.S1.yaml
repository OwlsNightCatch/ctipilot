    and the BSI RSS (''[NEU] [hoch] Vercel Next.js: Mehrere Schwachstellen'', WID-SEC-2026-3973, 2026-10-15 13:15Z) → primary: Next.js blog, URL https://nextjs.org/blog/nextjs-security-update-october-14-2026
