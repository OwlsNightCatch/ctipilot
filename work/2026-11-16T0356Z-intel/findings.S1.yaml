  - title: "Cyrus SASL SRP plugin authentication bypass (CVE-2026-129483): an unauthenticated client logs in as any existing user; upstream removed the plugin from master on 2026-11-12 and no release has followed 2.1.28 (2022)"
    sources:
      - { url: "https://www.vulncheck.com/advisories/cyrus-sasl-through-2.1.28-srp-authentication-bypass-via-plugins-srp-c", publisher: "VulnCheck (CNA)", date: "2026-11-15", role: "primary" }
      - { url: "https://github.com/cyrusimap/cyrus-sasl/issues/896", publisher: "Cyrus SASL issue tracker (reporter afldl)", date: "2026-07-31", role: "primary" }
      - { url: "https://github.com/cyrusimap/cyrus-sasl/commit/fb3724f43dc50247ff2bf02135457d6d77031654", publisher: "Cyrus SASL maintainers (commit 'Remove the SRP plugin')", date: "2026-11-12", role: "primary" }
      - { url: "https://github.com/advisories/GHSA-h9fw-9v74-m2cr", publisher: "GitHub Advisory Database", date: "2026-11-15", role: "corroborating" }
      - { url: "https://seclists.org/oss-sec/2026/q4/122", publisher: "oss-security (Alan Coopersmith, Oracle Solaris)", date: "2026-10-09", role: "corroborating" }
      - { url: "https://raw.githubusercontent.com/cyrusimap/cyrus-sasl/cyrus-sasl-2.1.28/configure.ac", publisher: "Cyrus SASL 2.1.28 source (configure.ac)", date: "2022-02-22", role: "corroborating" }
    discovery_trace: "first seen at: GitHub Advisory Database API via `url --direct https://api.github.com/advisories?severity=critical&per_page=30&sort=published&direction=desc` (record github-advisory, GHSA-h9fw-9v74-m2cr published 2026-11-15T15:30Z) → pivot: https://github.com/advisories/GHSA-h9fw-9v74-m2cr (references) → https://www.vulncheck.com/advisories/cyrus-sasl-through-2.1.28-srp-authentication-bypass-via-plugins-srp-c → primary: reporter's issue https://github.com/cyrusimap/cyrus-sasl/issues/896 and upstream commit https://github.com/cyrusimap/cyrus-sasl/commit/fb3724f43dc50247ff2bf02135457d6d77031654 → context: https://seclists.org/oss-sec/2026/q4/122 and 2.1.28 configure.ac for the build default"
    summary: |
      CVE-2026-129483 (CVSS 3.1 9.1 per the GitHub record, CVSS 4.0 9.3 per VulnCheck, the CNA; published 2026-11-15) is an authentication bypass in the SRP mechanism of the Cyrus SASL library, versions through 2.1.28. srp_server_mech_step2 in plugins/srp.c rejects only a client public value A that is zero or negative, so an unauthenticated network client that sends A equal to N (a multiple of the modulus) forces a zero shared secret, can compute a valid proof from public values, authenticates as any existing user without the password, and learns the session keys. The reporter (afldl) opened the issue with a working end-to-end reproducer against the real libsasl2 on 2026-07-31, so the technique has been public for about three and a half months. Exposure is narrow: in the 2.1.28 source the SRP plugin is built only with `--enable-srp` (default no), and the reproducer builds with that flag, so only builds that enable the plugin and services that offer SRP are reachable; the sources do not say which distributions or products ship it. The maintainers did not patch the check: on 2026-11-12 they removed the SRP plugin from master (commit "Remove the SRP plugin"), and master has since received a burst of other changes (plugins OTP, SECURID, PASSDSS also removed on 2026-11-13). The newest tagged release remains 2.1.28 of 2022-02-22, so no fixed release exists; on 2026-10-09 an oss-security post already described the project as having no response from maintainers and no new version since 2022 and listed further unfixed public reports (a DIGEST-MD5 client heap overflow, a SCRAM GS2 header over-read), of which only one had a CVE then (Red Hat's CVE-2026-107161, which oss-security says seems to match the DIGEST-MD5 report). No exploitation in the wild is stated by any source.
    region_nexus: "global; library used in mail, directory and IMAP/SMTP/LDAP authentication stacks (the DIGEST-MD5 report names IMAP/SMTP/LDAP servers); no Swiss-specific nexus found"
    primary_sector_nexus: "indirect (identity library; only builds with the non-default SRP plugin)"
    sector: "technology"
    cves: [CVE-2026-129483]
    techniques: [T1190, T1078]
    affected_products: ["Cyrus SASL"]
    entity_keys: []
    new_entities:
      - { key: "product:cyrus-sasl", type: product, name: "Cyrus SASL", aliases: ["cyrus-sasl", "libsasl2"], summary: "Cyrus SASL, the open-source SASL authentication library (libsasl2 and its mechanism plugins) used by IMAP, SMTP and LDAP software; newest tagged release 2.1.28 of 2022-02-22, project maintainers resumed work on master in November 2026 (GitHub commit history, 2026-11-12 to 2026-11-14)." }
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "Unauthenticated network clients can send A equal to N to force a zero shared secret, authenticating as any existing user without the password and learning session keys."
        attribution: "VulnCheck (CNA)"
        source_url: "https://www.vulncheck.com/advisories/cyrus-sasl-through-2.1.28-srp-authentication-bypass-via-plugins-srp-c"
      - quote: "Remove the SRP plugin"
        attribution: "Cyrus SASL maintainers"
        source_url: "https://github.com/cyrusimap/cyrus-sasl/commit/fb3724f43dc50247ff2bf02135457d6d77031654"
      - quote: "enable SRP authentication [[no]]"
        attribution: "Cyrus SASL 2.1.28 configure.ac"
        source_url: "https://raw.githubusercontent.com/cyrusimap/cyrus-sasl/cyrus-sasl-2.1.28/configure.ac"
      - quote: "no new version since 2022"
        attribution: "oss-security (Alan Coopersmith)"
        source_url: "https://seclists.org/oss-sec/2026/q4/122"
    extended_notes: |
      Defender angle (only what the sources support): (1) exposure check = does any libsasl2 in the estate include the SRP plugin (the plugin exists only in builds configured with --enable-srp) and does any service advertise SRP in its SASL mechanism list; if neither, the finding does not apply. (2) Detection concept: authentication logs of the service that terminates SASL showing a successful SRP exchange for an account that did not present its password, especially from an unexpected source. (3) Hardening: do not enable or advertise SRP; vendors' packages built from master after 2026-11-12 no longer contain the plugin, and there is no tagged fix. Wider context for a short entry: the library is effectively unmaintained until this month, with a DIGEST-MD5 client heap overflow (CVE-2026-107161, attacker-controlled server to client) also unfixed in any release; the commit titles since 2026-10-01 list no DIGEST-MD5 fix (read from the commit list, titles only).
    borderline: true
    borderline_reason: "pre-authentication identity bypass with public reproducer and no fixed release, but the plugin is a non-default build option and no source names a product that ships it; recommend a two-to-three-sentence entry or a drop"

  - title: "Apache Shiro DefaultLdapRealm accepts any password once a user is cached (CVE-2026-129349, CVSS 4.0 9.1): non-default authenticationCachingEnabled=true required; fixed in 3.0.1"
    sources:
      - { url: "https://lists.apache.org/thread.html/1whn52ht402lhc782c3s843c9hho8b4y", publisher: "Apache Shiro project announcement (user@shiro.apache.org)", date: "2026-11-15", role: "primary" }
      - { url: "https://github.com/advisories/GHSA-3j37-vw7v-fxxw", publisher: "GitHub Advisory Database", date: "2026-11-15", role: "corroborating" }
    discovery_trace: "first seen at: GitHub Advisory Database API via `url --direct https://api.github.com/advisories?severity=critical&per_page=30&sort=published&direction=desc` (GHSA-3j37-vw7v-fxxw, published 2026-11-15T12:31Z) → pivot: https://github.com/advisories/GHSA-3j37-vw7v-fxxw (references) → primary: Apache announcement https://lists.apache.org/thread.html/1whn52ht402lhc782c3s843c9hho8b4y (the openwall copy is http-only and could not be fetched)"
    summary: |
      The Apache Shiro project announced CVE-2026-129349 (CVSS 4.0 9.1, attack-requirements-present) by 2026-11-15 (the GitHub record, published that day, links an oss-security post whose URL path is dated 2026-11-14; the Apache thread page itself shows no date): when authentication caching is enabled on DefaultLdapRealm (or JndiLdapRealm), a user who has logged in successfully once can be impersonated by anyone who knows the username, because the cached authentication skips the LDAP bind and the AllowAllCredentialsMatcher that DefaultLdapRealm installs by default accepts any credentials. All Shiro versions through 3.0.0 are affected, only with authenticationCachingEnabled set to true, which is not the default; Shiro 3.0.1 stops installing AllowAllCredentialsMatcher by default, and the project's alternative is to leave caching off or configure a SimpleCredentialsMatcher. The finder is Joshua Rogers; the GitHub record lists an EPSS probability of about 0.5 percent and no exploitation or public exploit is stated by either source. The narrow trigger (non-default setting plus a valid username) keeps exposure to Java applications that embed Shiro with LDAP caching switched on.
    region_nexus: "global; embedded Java authentication framework, relevant to custom government Java applications with LDAP login"
    primary_sector_nexus: "indirect"
    sector: "technology"
    cves: [CVE-2026-129349]
    techniques: [T1190, T1078]
    affected_products: ["Apache Shiro"]
    entity_keys: ["product:apache-shiro"]
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "This issue affects all Apache Shiro versions through 3.0.0, only when using DefaultLdapRealm (or JndiLdapRealm) with authenticationCachingEnabled set to true, which is not the default."
        attribution: "GitHub Advisory Database (Apache Shiro text)"
        source_url: "https://github.com/advisories/GHSA-3j37-vw7v-fxxw"
      - quote: "Upgrade to version 3.0.1 or later, which fixes the issue by no longer installing AllowAllCredentialsMatcher by default."
        attribution: "GitHub Advisory Database (Apache Shiro text)"
        source_url: "https://github.com/advisories/GHSA-3j37-vw7v-fxxw"
    extended_notes: |
      Exposure check a defender can run: search application configuration for DefaultLdapRealm or JndiLdapRealm together with authenticationCachingEnabled=true (shiro.ini or Spring/Java configuration). Detection concept: authentication logs of the application showing repeated successful logins for one account with differing or wrong passwords, and no matching LDAP bind in the directory's own log for those logins. Recommend drop: non-default, needs a known username, no exploitation, project-level library.
    borderline: true
    borderline_reason: "critical-rated identity bypass, but a non-default setting is required, there is no exploitation or public exploit, and the constituency footprint is unknown; recommend drop"

  - title: "PostgreSQL 18.7, 17.12, 16.16, 15.20, 14.25 (52 CVEs): a researcher's write-up of 2026-11-09 shows a working crash exploit for CVE-2026-6460 (type confusion to code execution as the postgres OS account); full protection also needs C extensions rebuilt; PostgreSQL 14 is end-of-life"
    sources:
      - { url: "https://www.postgresql.org/support/security/CVE-2026-6460/", publisher: "PostgreSQL Global Development Group", date: "2026-11-12", role: "primary" }
      - { url: "https://www.postgresql.org/about/news/postgresql-187-1712-1616-1520-1425-and-19-rc-2-released-3442/", publisher: "PostgreSQL Global Development Group (release announcement)", date: "2026-11-12", role: "primary" }
      - { url: "https://mehmetince.net/part-3-6-how-i-ended-up-turning-a-22-year-old-postgresql-type-confusion-primitive-into-rce-cve-2026-6460/", publisher: "Mehmet Ince (finder)", date: "2026-11-09", role: "primary" }
      - { url: "https://www.postgresql.org/support/security/CVE-2026-116322/", publisher: "PostgreSQL Global Development Group", date: "2026-11-12", role: "corroborating" }
      - { url: "https://thehackernews.com/2026/11/postgresql-patches-52-flaws-including.html", publisher: "The Hacker News", date: "2026-11-13", role: "corroborating" }
    discovery_trace: "first seen at: BSI WID feed (bsi-rss, WID-SEC-2026-4571 [NEU][hoch] PostgreSQL, 2026-11-13), URL https://wid.cert-bund.de/content/public/securityAdvisory/rss and The Hacker News feed https://feeds.feedburner.com/TheHackersNews → drill: https://thehackernews.com/2026/11/postgresql-patches-52-flaws-including.html → primary: https://www.postgresql.org/support/security/CVE-2026-6460/ and the release announcement https://www.postgresql.org/about/news/postgresql-187-1712-1616-1520-1425-and-19-rc-2-released-3442/ → finder's write-up https://mehmetince.net/part-3-6-how-i-ended-up-turning-a-22-year-old-postgresql-type-confusion-primitive-into-rce-cve-2026-6460/. Already borderline-dropped by run 2026-11-14T0255Z on 'no exploitation or public PoC'; the write-up changes the PoC part of that ground."
    summary: |
      The PostgreSQL project's 2026-11-12 minor releases (18.7, 17.12, 16.16, 15.20, 14.25) close 52 vulnerabilities and are the final release of PostgreSQL 14, which is now end-of-life. The headline flaw CVE-2026-6460 (CVSS 3.1 8.8, AV:N/PR:L) is a type confusion in the core server that lets a role able to create objects execute code as the operating-system user running the database, primarily through ALTER ... SET DATA TYPE; the project's advisory also names other DDL routes. The finder, Mehmet Ince, published a long technical write-up (dated 2026-11-09, three days before the fix) that, per The Hacker News, includes the SQL that crashes an unpatched PostgreSQL 18.6 server and a second step that leaks memory addresses, but not the SQL for the final command-execution step; Ince wrote that he could trigger the crash as a lowest-privileged login role, while the project and Red Hat describe the attacker as someone who can create objects. He privately gave managed-PostgreSQL providers (AWS, Microsoft, Google, Supabase, Databricks, Ubicloud) working proofs of concept in August. Neither the project nor CISA's record states exploitation in the wild. 32 of the 52 flaws score 8.8 and most need a login (run 2026-11-14T0255Z counted 43 of 52 as needing a low-privileged SQL role); the only server flaw needing neither login nor user action is CVE-2026-116322 (CVSS 5.3), which lets an unauthenticated client trigger a restart of PostgreSQL 18 servers (versions before 18.7 only). Post-update steps the project and package maintainers name: rebuild or update every C-language extension together with the server, because extensions built against older releases still load but may not be protected; reindex where the notes say so (B-tree on bpchar, others); take a new full backup after updating when incremental backups are used; restart a server that runs outside its package's service unit (for example under Patroni). The Hacker News adds that client tools are also affected (a crafted archive can run code through pg_restore, and a compromised source server can run code through psql via a pg_dump tar restore script); the project's CVE list in the release announcement names CVE-2026-116314 and CVE-2026-116330 at 8.8 with user interaction.
    region_nexus: "global; PostgreSQL is a common back end for public-sector applications and managed database services"
    primary_sector_nexus: "indirect (authenticated database flaw; PostgreSQL 14 end-of-life is the sector-relevant fact)"
    sector: "technology"
    cves: [CVE-2026-6460, CVE-2026-116322, CVE-2026-116314, CVE-2026-116330]
    techniques: [T1068, T1190]
    affected_products: ["PostgreSQL"]
    entity_keys: []
    new_entities:
      - { key: "product:postgresql", type: product, name: "PostgreSQL", aliases: ["Postgres"], summary: "PostgreSQL, the open-source relational database; 2026-11-12 minor releases 18.7, 17.12, 16.16, 15.20 and 14.25 fixed 52 security issues and ended support for PostgreSQL 14 (PostgreSQL project, 2026-11-12)." }
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Type confusion in PostgreSQL allows an object creator to execute arbitrary code as the operating system user running the database"
        attribution: "PostgreSQL Global Development Group"
        source_url: "https://www.postgresql.org/support/security/CVE-2026-6460/"
      - quote: "This is the final release of PostgreSQL 14"
        attribution: "PostgreSQL Global Development Group"
        source_url: "https://www.postgresql.org/about/news/postgresql-187-1712-1616-1520-1425-and-19-rc-2-released-3442/"
      - quote: "Full protection from this flaw also requires rebuilding any C-language extensions installed on the server."
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/11/postgresql-patches-52-flaws-including.html"
      - quote: "CISA's assessment in the CVE record also lists exploitation as none."
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/11/postgresql-patches-52-flaws-including.html"
    extended_notes: |
      Defender angle: exposure = any PostgreSQL below 18.7, 17.12, 16.16, 15.20 or 14.25 where untrusted or low-privilege roles can create or alter objects (multi-tenant databases, application roles with DDL rights, managed services whose status the write-up does not give); PostgreSQL 14 has no further fixes, so a 14.x estate must migrate. Detection concept: DDL audit records (ALTER ... SET DATA TYPE, ALTER TABLE ... ADD COLUMN followed by rollback) from application or low-privilege roles, postgres backend crashes (server log signal 11, restart), child processes of the postgres OS account that the database does not normally start. Hardening: patch server and extensions in one change, revoke CREATE on public schemas and object-creation rights from application roles. Prior-run drop ground ('no exploitation or public PoC', 43 of 52 need a low-privileged SQL role) stands except for the public write-up and partial exploit; the main agent decides whether a short entry is warranted.
    borderline: true
    borderline_reason: "authenticated flaws inside a scheduled release, no exploitation; but the finder's public write-up with a crash exploit, a rebuild-your-extensions requirement and the PostgreSQL 14 end-of-life make a short entry defensible; run 2026-11-14T0255Z dropped it on 'no public PoC', which the write-up now contradicts"

