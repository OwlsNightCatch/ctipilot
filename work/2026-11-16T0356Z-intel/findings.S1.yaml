candidate_sources:
  - id: cis-msisac-advisories
    publisher: "Center for Internet Security (MS-ISAC) Cybersecurity Advisories"
    url: "https://www.cisecurity.org/advisory"
    rss_url: "https://www.cisecurity.org/feed/advisories"
    category: vulns
    why: "Public-sector (state and local government) multi-vendor advisory stream; the feed reads direct in-container (15 dated items, 2026-10-27 to 2026-11-11, e.g. 'Critical Patches Issued for Microsoft Products, November 10, 2026', Fortinet, SAP, Chrome, SonicWall rows) and gives a dated cross-vendor release calendar that doubles as a scheduled-release check for the S1 duty; reliability B, aggregator of vendor advisories."

coverage_gaps:
  - source_id: belden-psirt
    reason: "https://www.belden.com/security answers HTTP 403 on `url --direct` and WebFetch today; the reader pool is exhausted (HTTP 402 on every key but one), so no transport read it. Candidate stays in rotation; 403 never demotes. Not logged as a fetch failure of a working recipe (the record has none)."
  - source_id: connectwise-trust-center
    reason: "https://www.connectwise.com/company/trust/advisories answers 403 on direct, extract, WebFetch and the reader. Working route: `python3 tools/fetch_source.py url --direct 'https://api.github.com/repos/ConnectWise-Advisories/Disclosures/commits?per_page=15'` read cleanly (newest advisory CVE-2026-127063 of 2026-11-12, commit 8b1962d; a README logo commit on 2026-11-13); the advisory text is read from the commit's patch via https://api.github.com/repos/ConnectWise-Advisories/Disclosures/commits/<sha>, because github.com blob and tree paths for the advisory returned 404 for the path I guessed. status.connectwise.com shows only an x360Cloud performance incident tied to the Microsoft 365 outage."
  - source_id: msrc-update-guide
    reason: "Recipe note: `msrc release 2026-Nov 500` rows carry no exploited/publiclyDisclosed values (the SUG OData record has no such keys; Threats need the CVRF), and total=2248 includes Mariner rows; the revised-CVE sweep that works is `url --direct 'https://api.msrc.microsoft.com/sug/v2.0/en-US/vulnerability?%24filter=isMariner%20eq%20false&%24orderby=latestRevisionDate%20desc&%24top=120'` with the `revisions` array giving each revision's text."
  - source_id: github-advisory
    reason: "Recipe note (works in-container, no key): `python3 tools/fetch_source.py url --direct 'https://api.github.com/advisories?severity=critical&per_page=30&sort=published&direction=desc'` lists critical advisories by publish time (ghsa_id, cve_id, published_at); `.../advisories/<GHSA>` returns description, references, CVSS v3/v4 and EPSS. It surfaced the two identity-library criticals above and is the only in-window sweep that saw anything on a weekend; most rows are VulnCheck CNA bulk records of niche products."
  - source_id: nvd
    reason: "services.nvd.nist.gov CVE API answered HTTP 503 once (not retried beyond that); not a slice record."
  - source_id: tooling
    reason: "`fetch_source.py feed <url>` on a URL that is not a feed (guessed Chrome releases, VMware, Citrix, SonicWall, Veeam and GitHub changelog feed paths) fell back to the metered reader and burned credit on dead keys: probe unknown feed paths with `url --direct` first. Do not guess feed paths."
  - source_id: uptime.n-able.com
    reason: "N-able's security notice for N-central is a script-built status application (empty shell through extract); the N-central 4EverAble2Shell status therefore reaches the store through press only. A reader that executes JavaScript would be needed; the reader pool is exhausted."

