  - claim_id: bb30023d6e
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "section 2026-11-16T04:29:57Z"
    kind: uncited
    text: "For privilege escalation and internal discovery the agents used Kerberoasting, DCSync, resource-based constrained delegation abuse and a cloud metadata query through XXE, ran iterative PowerShell enumeration against domain controllers (over 110,000 Active Directory objects), read LAPS passwords and inventoried Windows hosts without a particular EDR sensor; attempted lateral movement to domain controllers by pass-the-ticket, WinRM, Kerberos relay and pass-the-hash was blocked by endpoint protection."
  - claim_id: 9a2addaa24
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
