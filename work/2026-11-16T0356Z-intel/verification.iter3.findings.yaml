  item: "2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse (Exposure and Defender takeaway lines)"
  url_or_quote: "**Defender takeaway:** Expel's reading is that the framework adds speed, not a new vulnerability, so the levers are the identity controls it runs into: least privilege on multi-tenant application permissions and consent grants, alerting on credential additions ..."
  summary: "(low confidence) The newest section carries FBI recommendations that are not identity controls ('inventory every internet-facing application including the peripheral ones', 'restrict Kudu/SCM endpoints, cloud administration, hypervisor and backup interfaces', 'disable basic publishing authentication'; FLASH 'Reduce External Attack Surface' leads its Immediate Actions), and the 2026-11-07 section already carries Storm-3358's exploitation of anonymous file upload and SSRF. The Exposure line ('any tenant that relies on password sign-in or grants OAuth consent to applications, and any Okta org with self-service registration enabled') and the takeaway ('the levers are the identity controls it runs into') still read identity-only, so a reader of the labelled lines alone misses the attack-surface lever. The takeaway is attributed to Expel and not disproved, so advisory; optional rewrite of both lines to today's state."
