claims:
  - {claim_id: 973c81f2bc, verdict: F14, source_url: "https://www.ic3.gov/CSA/2026/261113.pdf", passage: "FLASH: \"across multiple sectors, including financial services, government, technology, defense, semiconductor, energy, healthcare, manufacturing, telecommunications, and legal industries\" (no count; list introduced by 'including')"}
  - {claim_id: bd2eb87cca, verdict: F14, source_url: "https://www.ic3.gov/CSA/2026/261113.pdf", passage: "Summary's 'against ten sectors including government' counts the FBI's non-exhaustive 'including' list; FBI states no number. Other clauses verified on MS 10/21, MS 11/06, GTIG, CERT-EU, Check Point, BleepingComputer, Expel, CrowdStrike, Recorded Future."}
  - {claim_id: f7c25c3f95, verdict: ok, source_url: "https://www.ic3.gov/CSA/2026/261113.pdf", passage: "Since at least August 2026, a variety of malicious cyber actors have used ARTEX ... some intrusions progressing from initial targeting to privileged access in under three hours."}
  - {claim_id: 74ddb38116, verdict: ok, source_url: "https://www.ic3.gov/CSA/2026/261113.pdf", passage: "made the repository unavailable on October 8, 2026; forks, archived copies, and a commercial version (ARTEX PRO); As of early November 2026, researchers identified over 1,600 publicly exposed ARTEX console instances"}
  - {claim_id: 3d13ebb6d9, verdict: ok, source_url: "https://www.ic3.gov/CSA/2026/261113.pdf", passage: "ARTEX excels at identifying and exploiting peripheral systems receiving less security attention than flagship applications, including partner and supplier portals, mobile backends, employee applications, sales-support systems, legacy services, third-party integrations"}
  - {claim_id: 26d050bc1f, verdict: ok, source_url: "https://www.ic3.gov/CSA/2026/261113.pdf", passage: "Interrogated backend SQL databases; Mass blob reads; Deployed custom boot scripts via EC2 instances; Sent command output to rotating webhook.site endpoints; Created new 100GB volumes; Used residential proxy services; Tor; Chisel and SoftEther"}
  - {claim_id: e0d30807e0, verdict: ok, source_url: "https://www.ic3.gov/CSA/2026/261113.pdf", passage: "Outbound API calls ... (investigate unexpected calls alongside other suspicious activity); High-frequency automated requests with sequential enumeration against login/search endpoints; *.aspx or *.jsp files in unexpected web application paths; Azure ARM deployment validation dry-runs across multiple resource types; test blob write/delete ... sub-second"}
  - {claim_id: f4c86ccc62, verdict: ok, source_url: "https://www.ic3.gov/CSA/2026/261113.pdf", passage: "Review every Microsoft 365 tenant where affected ConnectWise applications are currently or were previously installed or authorized ... search by application ID; Review activity starting from at least October 1, 2026; Keep affected ConnectWise application connections disabled until ConnectWise provides formal restoration instructions; do not delete enterprise applications as first response"}
  - {claim_id: a3da8004db, verdict: ok, source_url: "https://www.ic3.gov/CSA/2026/261113.pdf", passage: "13 NOVEMBER 2026 FLASH Number FLASH-2026-1113-001 ... TLP:CLEAR"}
  - {claim_id: f48518ae5f, verdict: ok, source_url: "https://www.ic3.gov/CSA/2026/261113.pdf", passage: "The following table maps observed ARTEX activity to MITRE ATT&CK phases"}
  - {claim_id: 2038eb9be9, verdict: ok, source_url: "https://www.ic3.gov/CSA/2026/261113.pdf", passage: "Initial Access: Exploited unsigned SAML assertions; XXE; anonymous file upload; cross-account cloud trust relationships from an external partner tenant; Compromised third-party vendor credentials to pivot via trusted B2B federation; SSRF; Hardcoded administrator passwords in SPA JavaScript bundles; Used stolen VPN configurations and leaked credentials"}
  - {claim_id: c96534d289, verdict: ok, source_url: "https://www.ic3.gov/CSA/2026/261113.pdf", passage: "Deployed JSP and PHP web shells (including via MySQL log poisoning); Abused Kudu administrative APIs to execute arbitrary commands; Added credentials to existing OAuth applications"}
  - {claim_id: 30677ba922, verdict: ok, source_url: "https://www.ic3.gov/CSA/2026/261113.pdf", passage: "Ran iterative PowerShell enumeration scripts against Domain Controllers; Enumerated over 110,000 Active Directory objects; Read LAPS passwords; Kerberoasting; DCSync; resource-based constrained delegation; Queried cloud metadata service via XXE; Attempted lateral movement ... (blocked by endpoint protection)"}
  - {claim_id: da1ed92a29, verdict: F14, source_url: "https://www.ic3.gov/CSA/2026/261113.pdf", passage: "Record summary repeats 'against ten sectors including government'; the FLASH gives no count, only a list introduced by 'including'. Remaining clauses (1,600 consoles, observed steps, telemetry) match the section and the FLASH."}
