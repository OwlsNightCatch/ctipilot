claims:
  - {claim_id: c6cd79b9ec, verdict: ok, source_url: "https://www.ic3.gov/CSA/2026/261113.pdf", passage: "Since at least August 2026, a variety of malicious cyber actors have used ARTEX ... sectors, including financial services, government, technology, defense ... (Storm-3358: Microsoft 2026-11-06 'the financially motivated threat actor Storm-3358')"}
  - {claim_id: 24d0708587, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/artex-and-friends-enter-agentic-offensive-frameworks", passage: "Since late August 2026 ... ARTEX, PentAGI, CAIRN ... within Mandiant incident response engagements; ... original repository was taken down by its creator in October 2026 ... community forks"}
  - {claim_id: f7c25c3f95, verdict: ok, source_url: "https://www.ic3.gov/CSA/2026/261113.pdf", passage: "including financial services, government, technology, defense, semiconductor, energy, healthcare, manufacturing, telecommunications, and legal industries ... initial targeting to privileged access in under three hours"}
  - {claim_id: 74ddb38116, verdict: ok, source_url: "https://www.ic3.gov/CSA/2026/261113.pdf", passage: "made the repository unavailable on October 8, 2026 ... community forks, localized variations, archived copies, and a commercial version (ARTEX PRO) ... As of early November 2026, researchers identified over 1,600 publicly exposed ARTEX console instances"}
  - {claim_id: 3d13ebb6d9, verdict: ok, source_url: "https://www.ic3.gov/CSA/2026/261113.pdf", passage: "ARTEX excels at identifying and exploiting peripheral systems receiving less security attention ..., including partner and supplier portals, mobile backends, employee applications, sales-support systems, legacy services, third-party integrations"}
  - {claim_id: 26d050bc1f, verdict: ok, source_url: "https://www.ic3.gov/CSA/2026/261113.pdf", passage: "Mass blob reads; Deployed custom boot scripts via EC2 instances to harvest data; Sent command output to rotating webhook.site endpoints; Created new 100GB volumes for exfiltration preparation; residential proxy services; Tor; Chisel and SoftEther"}
  - {claim_id: e0d30807e0, verdict: ok, source_url: "https://www.ic3.gov/CSA/2026/261113.pdf", passage: "Outbound API calls ... (investigate unexpected calls alongside other suspicious activity); sequential enumeration against login/search endpoints; *.aspx or *.jsp files in unexpected web application paths; ARM deployment validation dry-runs; test blob write/delete ... sub-second timing; Tested compromised IAM user permissions using DryRun flags (observed-activity row, not the indicator list)"}
  - {claim_id: 1c76ae2b77, verdict: ok, source_url: "https://www.ic3.gov/CSA/2026/261113.pdf", passage: "Review every Microsoft 365 tenant where affected ConnectWise applications are currently or were previously installed or authorized ...; search by application ID ...; Review activity starting from at least October 1, 2026; do not delete enterprise applications as first response"}
  - {claim_id: a3da8004db, verdict: ok, source_url: "https://www.ic3.gov/CSA/2026/261113.pdf", passage: "TLP:CLEAR ... 13 NOVEMBER 2026 ... FLASH-2026-1113-001 ... Threat Overview of ARTEX Autonomous Penetration Testing Framework"}
  - {claim_id: f48518ae5f, verdict: ok, source_url: "https://www.ic3.gov/CSA/2026/261113.pdf", passage: "The following table maps observed ARTEX activity to MITRE ATT&CK phases"}
  - {claim_id: 2038eb9be9, verdict: ok, source_url: "https://www.ic3.gov/CSA/2026/261113.pdf", passage: "Exploited unsigned SAML assertions; Exploited XXE flaws; Exploited anonymous file upload; Abused cross-account cloud trust relationships from an external partner tenant; Compromised third-party vendor credentials to pivot via trusted B2B federation; Exploited SSRF; Hardcoded administrator passwords in SPA JavaScript bundles; Used stolen VPN configurations and leaked credentials"}
  - {claim_id: c96534d289, verdict: ok, source_url: "https://www.ic3.gov/CSA/2026/261113.pdf", passage: "Deployed JSP and PHP web shells (including via MySQL log poisoning); Abused Kudu administrative APIs to execute arbitrary commands; Added credentials to existing OAuth applications"}
  - {claim_id: bb30023d6e, verdict: ok, source_url: "https://www.ic3.gov/CSA/2026/261113.pdf", passage: "Kerberoasting; DCSync to steal domain krbtgt key; Abused resource-based constrained delegation; Queried cloud metadata service via XXE; Enumerated over 110,000 Active Directory objects; Read LAPS passwords; machines without CrowdStrike Falcon; Attempted lateral movement ... (blocked by endpoint protection)"}
  - {claim_id: 9a2addaa24, verdict: ok, source_url: "https://www.ic3.gov/CSA/2026/261113.pdf", passage: "Inventory all internet-facing applications, including peripheral systems ...; Restrict cloud administration, network device management, application publishing interfaces (Kudu/SCM endpoints), hypervisors, backup platforms ... to trusted networks ...; Disable basic publishing authentication where not required"}
  - {claim_id: bbe4ade941, verdict: ok, source_url: "https://www.ic3.gov/CSA/2026/261113.pdf", passage: "Since at least August 2026, a variety of malicious cyber actors ... government ...; over 1,600 publicly exposed ARTEX console instances; observed-TTP table (cloud trust, vendor credentials, Kudu, Kerberoasting/DCSync/LAPS, exfiltration prep); Information Requested and Recommendations sections"}
