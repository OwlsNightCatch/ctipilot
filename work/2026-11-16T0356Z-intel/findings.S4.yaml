  - title: "FBI FLASH-2026-1113-001 on ARTEX: multiple actors have used the open-source agentic pentest framework since at least August 2026 against ten sectors including government and defense; the FLASH adds an ATT&CK-mapped activity table, 1,600+ exposed consoles and tenant-review guidance for ConnectWise-linked Microsoft 365 apps"
    sources:
      - { url: "https://www.ic3.gov/CSA/2026/261113.pdf", publisher: "FBI IC3 (FLASH-2026-1113-001, TLP:CLEAR)", date: "2026-11-13", role: "primary" }
