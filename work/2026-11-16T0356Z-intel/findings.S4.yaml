  - title: "Phishing lures built on the 12 to 14 November Microsoft 365 outage: fake service-health notices citing Exchange Online incident EX1550543 claim held messages will be deleted within 24 hours unless restored through a link (Microsoft Threat Intelligence warning, no credential theft or malware confirmed)"
    sources:
