    relation_suggestions:
      - { subject: "report:fbi-flash-artex-2026-1113", object: "tool:artex", basis: "the FBI FLASH is a threat overview of the ARTEX framework (FBI, 2026-11-13)" }
    verification: SINGLE-SOURCE-NATIONAL-CERT
    confidence: HIGH
    admiralty_hint: "A1 (FBI is the authority for its own advisory; the facts are consistent with the Microsoft, GTIG, CrowdStrike, Censys and CERT-EU reports the FLASH cites)"
    evidence:
      - quote: |-
          In a FLASH advisory released Friday, the agency said multiple threat actors have weaponized the open-source framework since at least August 2026 to target organizations across the financial, government, technology, defense, healthcare, and other sectors.
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/fbi-warns-artex-ai-hacking-tool-is-powering-global-cyberattacks/"
      - quote: |-
          ARTEX significantly reduces the time required to chain attack techniques, with some intrusions progressing from initial targeting to privileged access in under three hours
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/fbi-warns-artex-ai-hacking-tool-is-powering-global-cyberattacks/"
      - quote: |-
          As of early November, researchers had identified more than 1,600 publicly exposed ARTEX consoles, with the actual number of deployments believed to be significantly higher.
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/fbi-warns-artex-ai-hacking-tool-is-powering-global-cyberattacks/"
    extended_notes: |
      Delta vs the existing ARTEX entries (Storm-0940 / ConnectWise, Storm-3358, WorkOS, AWS, CyberStrikeAI): a US authority now states multi-actor use across government and defense; the FLASH is the one place that lists the observed TTPs in ATT&CK form. Detection concepts the FLASH itself names (telemetry-class first): egress/proxy logs for server or non-developer hosts calling LLM API endpoints (api.anthropic.com, api.deepseek.com, open.bigmodel.cn, api.x.ai; the FBI says to read these only alongside other suspicious activity, since developer use is legitimate), web-server logs for high-frequency sequential enumeration against login and search endpoints and for iterative, incrementally changing failed attempts, cloud control-plane audit for Azure ARM deployment validation dry-runs across resource types, IAM DryRun flags and sub-second test blob write/delete, Entra audit for service-principal credential additions, and web-app paths holding unexpected .aspx/.jsp files. The FBI warns that listed infrastructure indicators may already be reassigned. IOCs deliberately omitted. Related FBI notes cited inside the FLASH: Akamai (2026-10-23), Microsoft (2026-10-21), GTIG (2026-10-30), Censys (2026-11-05), CrowdStrike (2026-10-07), Zscaler (2026-10-14), CERT-EU (2026-11-05), Check Point Research (2026-11-05).
    # priority_hint: update (not a new entry); A-class authority, multi-sector incl. government

