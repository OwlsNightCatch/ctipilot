    discovery_trace: "first seen at: heise-sec feed (python3 tools/fetch_source.py feed https://www.heise.de/security/feed.xml 25), item 'Phishing-Kampagne nutzt Microsoft-Cloud-Ausfall' (2026-11-15T13:59Z) → primary-for-this-report: https://www.heise.de/news/Phishing-Kampagne-nutzt-Microsoft-Cloud-Ausfall-11525471.html, which cites Microsoft Threat Intelligence's post on Bluesky (a social post, not cited as a source); WebSearch (\"Microsoft warns phishing campaign impersonating Microsoft 365 outage notification EX1550543 messages held restore\") found no second report"
    novelty: new
    summary: |
      Microsoft Threat Intelligence warned, as relayed by heise online on 2026-11-15, of a phishing campaign that imitates Microsoft 365 status messages and refers to the Exchange Online incident EX1550543 from the outage that ran from Thursday 12 November into Saturday. Messages detected on Friday claim that mail was held during the outage and will be deleted within 24 hours unless the recipient restores it by clicking a link; subjects follow the pattern "Outage - [six-character code]", sender display names combine an organisation-specific prefix with "Outage Notification" or "Service Health", mail comes from three sender domains with recipient-specific SendGrid click-tracking links redirecting to a credential-harvesting-style page, and similar messages hit organisations in several sectors in the United States. Microsoft has so far confirmed neither credential theft nor malware delivery; Defender blocks the campaign's domains and Defender for Office 365 quarantines such mail, and Microsoft advises checking Safe Links policies and verifying outage notices only in the Microsoft 365 admin center. The outage itself was caused, per Microsoft via heise, by a fault in a network-capacity upgrade and Microsoft ruled out a cyberattack or AI activity.
