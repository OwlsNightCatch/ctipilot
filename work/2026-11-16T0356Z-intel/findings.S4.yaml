    discovery_trace: "first seen at: bleepingcomputer feed (python3 tools/fetch_source.py feed https://www.bleepingcomputer.com/feed/ 25) → URL https://www.bleepingcomputer.com/news/security/fbi-warns-artex-ai-hacking-tool-is-powering-global-cyberattacks/ (also DataBreaches.net feed item, same story) → pivot to the FLASH PDF linked in that article → primary: https://www.ic3.gov/CSA/2026/261113.pdf (read with tools/fetch_source.py pdf, 13 pages, text decoded)"
    novelty: "update-of:2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse"
    summary: |
      The FBI released FLASH-2026-1113-001 (TLP:CLEAR) on 2026-11-13, the first US-government document on ARTEX in the store. It states that a variety of malicious cyber actors have used the Go-written, LLM-driven agentic pentest framework since at least August 2026 against organisations in financial services, government, technology, defense, semiconductor, energy, healthcare, manufacturing, telecommunications and legal, with some intrusions reaching privileged access in under three hours. ARTEX has no model of its own and calls external LLM APIs; the FBI says attacker-controlled instances mostly use Chinese models (the DeepSeek Flash family dominates). The original developer pulled the GitHub repository on 2026-10-08, but forks, localised copies and a commercial ARTEX PRO persist, and the FBI cites Censys for more than 1,600 publicly exposed ARTEX consoles in early November. Beyond the vendor reports the entries already carry, the FLASH adds an ATT&CK-mapped table of observed activity (unsigned-SAML-assertion, XXE, SSRF, anonymous-upload, hard-coded-admin-password and missing-authentication initial access; Kudu/SCM API abuse and web shells for persistence; Kerberoasting, DCSync, resource-based constrained delegation, LAPS reads and an inventory of Windows hosts without a given EDR sensor internally; tunnelling through Chisel and SoftEther and residential proxies for command and control) and a reporting checklist that doubles as a hunt list. The FBI's emphasis is the overlooked periphery (partner and supplier portals, mobile backends, employee apps, legacy services, third-party integrations) and supply-chain pivots from weaker vendors into upstream networks. FBI recommendations: inventory every internet-facing application including peripheral ones; restrict cloud administration, Kudu/SCM, hypervisor and backup-platform interfaces to trusted administrative paths; disable basic publishing authentication; review Entra service-principal sign-ins and audit records (credential additions, new owners, consent grants, role assignments) from at least 2026-10-01, searching by application ID rather than display name for every tenant where a ConnectWise application was ever authorised; keep affected ConnectWise application connections disabled until ConnectWise gives formal restoration instructions, and do not delete the enterprise application before evidence is preserved.
    region_nexus: "global; the FLASH lists government and defense among targeted sectors and stresses third-party and partner-portal exposure, which is the supplier-chain shape of the Swiss public-sector constituency; no Swiss victim is named"
    primary_sector_nexus: "indirect: government is a named target sector; peripheral citizen/partner portals and MSP/SaaS app identities are the stated weak points"
    sector: "public-sector"
    cves: []
    techniques: [T1190, T1078, T1078.004, T1195, T1199, T1606.002, T1505.003, T1098.001, T1552.005, T1558.003, T1114.002, T1530, T1090.003, T1572]
    affected_products: ["ARTEX", "Microsoft Entra ID", "Microsoft 365", "ConnectWise Cloud Backup"]
    entity_keys: ["tool:artex", "actor:storm-0940", "actor:storm-3358"]
    new_entities:
