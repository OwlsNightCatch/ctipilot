claims:
  - {claim_id: c6cd79b9ec, verdict: ok, source_url: "https://www.ic3.gov/CSA/2026/261113.pdf", passage: "a variety of malicious cyber actors have used ARTEX to conduct campaigns targeting organizations globally across multiple sectors, including financial services, government, technology"}
  - {claim_id: 24d0708587, verdict: ok, source_url: "https://www.ic3.gov/CSA/2026/261113.pdf", passage: "FLASH clause matches; other clauses checked on MS 2026-10-21 (As early as September 2026 ... hundreds of organizations), MS 2026-11-06, GTIG, CERT-EU (highly likely involved the use of ARTEX), Check Point (10 instances ... expose the full ARTEX database), BleepingComputer, Expel"}
  - {claim_id: f7c25c3f95, verdict: ok, source_url: "https://www.ic3.gov/CSA/2026/261113.pdf", passage: "including financial services, government, technology, defense, semiconductor, energy, healthcare, manufacturing, telecommunications, and legal industries ... some intrusions progressing from initial targeting to privileged access in under three hours"}
  - {claim_id: 74ddb38116, verdict: ok, source_url: "https://www.ic3.gov/CSA/2026/261113.pdf", passage: "made the repository unavailable on October 8, 2026 ... community forks, localized variations, archived copies, and a commercial version (ARTEX PRO) ... over 1,600 publicly exposed ARTEX console instances"}
  - {claim_id: 3d13ebb6d9, verdict: ok, source_url: "https://www.ic3.gov/CSA/2026/261113.pdf", passage: "ARTEX excels at identifying and exploiting peripheral systems receiving less security attention than flagship applications, including partner and supplier portals, mobile backends, employee applications"}
  - {claim_id: 26d050bc1f, verdict: ok, source_url: "https://www.ic3.gov/CSA/2026/261113.pdf", passage: "Mass blob reads; Deployed custom boot scripts via EC2 instances; Sent command output to rotating webhook.site endpoints; Created new 100GB volumes; residential proxy services; Tor; Chisel and SoftEther"}
  - {claim_id: e0d30807e0, verdict: ok, source_url: "https://www.ic3.gov/CSA/2026/261113.pdf", passage: "investigate unexpected calls alongside other suspicious activity; High-frequency automated requests with sequential enumeration against login/search endpoints; *.aspx or *.jsp files in unexpected web application paths; Azure ARM deployment validation dry-runs"}
  - {claim_id: 1c76ae2b77, verdict: ok, source_url: "https://www.ic3.gov/CSA/2026/261113.pdf", passage: "search by application ID rather than display name; Review activity starting from at least October 1, 2026, for ConnectWise-related activity; do not delete enterprise applications as first response (preserve configuration and evidence before irreversible changes)"}
  - {claim_id: a3da8004db, verdict: ok, source_url: "https://www.ic3.gov/CSA/2026/261113.pdf", passage: "TLP:CLEAR ... 13 NOVEMBER 2026 ... FLASH-2026-1113-001"}
  - {claim_id: f48518ae5f, verdict: ok, source_url: "https://www.ic3.gov/CSA/2026/261113.pdf", passage: "The following table maps observed ARTEX activity to MITRE ATT&CK phases"}
  - {claim_id: 2038eb9be9, verdict: ok, source_url: "https://www.ic3.gov/CSA/2026/261113.pdf", passage: "Exploited unsigned SAML assertions; XXE; SSRF; anonymous file upload; Hardcoded administrator passwords in SPA JavaScript bundles; Used stolen VPN configurations and leaked credentials; cross-account cloud trust; third-party vendor credentials ... trusted B2B federation"}
  - {claim_id: c96534d289, verdict: ok, source_url: "https://www.ic3.gov/CSA/2026/261113.pdf", passage: "Deployed JSP and PHP web shells (including via MySQL log poisoning); Abused Kudu administrative APIs to execute arbitrary commands; Added credentials to existing OAuth applications"}
  - {claim_id: bb30023d6e, verdict: ok, source_url: "https://www.ic3.gov/CSA/2026/261113.pdf", passage: "Kerberoasting; DCSync; resource-based constrained delegation; Queried cloud metadata service via XXE (Privilege Escalation row); Ran iterative PowerShell enumeration ... over 110,000 Active Directory objects; Read LAPS passwords; Pass-the-Hash (blocked by endpoint protection)"}
  - {claim_id: 9a2addaa24, verdict: ok, source_url: "https://www.ic3.gov/CSA/2026/261113.pdf", passage: "Inventory all internet-facing applications, including peripheral systems; Restrict cloud administration ... application publishing interfaces (Kudu/SCM endpoints), hypervisors, backup platforms ... to trusted networks ... or dedicated administrative paths; Disable basic publishing authentication where not required"}
  - {claim_id: bbe4ade941, verdict: ok, source_url: "https://www.ic3.gov/CSA/2026/261113.pdf", passage: "record summary states what the section states (variety of actors, since at least August, government, 1,600 consoles, observed steps, telemetry, hardening); omits the ConnectWise review ask (advisory only)"}
