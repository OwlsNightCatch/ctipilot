  - claim_id: 2038eb9be9
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "section 2026-11-16T04:29:57Z"
    kind: uncited
    text: "Initial access came through unsigned SAML assertions, XXE, SSRF, anonymous file upload, hard-coded administrator passwords in single-page-application JavaScript bundles, stolen VPN configurations and leaked credentials, cross-account cloud trust abused from an external partner tenant, and compromised third-party vendor credentials used across trusted B2B federation."
  - claim_id: c96534d289
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "section 2026-11-16T04:29:57Z"
    kind: uncited
    text: "Persistence used JSP and PHP web shells (one route was MySQL log poisoning), Kudu administrative APIs to run commands, and credentials added to existing OAuth applications."
  - claim_id: bb30023d6e
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "section 2026-11-16T04:29:57Z"
    kind: uncited
    text: "For privilege escalation and internal discovery the agents used Kerberoasting, DCSync, resource-based constrained delegation abuse and a cloud metadata query through XXE, ran iterative PowerShell enumeration against domain controllers (over 110,000 Active Directory objects), read LAPS passwords and inventoried Windows hosts without a particular EDR sensor; attempted lateral movement to domain controllers by pass-the-ticket, WinRM, Kerberos relay and pass-the-hash was blocked by endpoint protection."
  - claim_id: 9a2addaa24
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "section 2026-11-16T04:29:57Z"
    kind: uncited
    text: "Its recommendations: inventory every internet-facing application including the peripheral ones named above, restrict Kudu/SCM endpoints, cloud administration, hypervisor and backup interfaces to trusted networks or dedicated administrative paths, and disable basic publishing authentication where it is not required."
