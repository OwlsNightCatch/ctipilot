    kind: cited
    text: "The original repository was withdrawn on 2026-10-08, but forks, archived copies and a commercial version keep the framework available, and researchers identified more than 1,600 publicly exposed ARTEX consoles in early November ("
    urls: ["https://www.ic3.gov/CSA/2026/261113.pdf"]
  - claim_id: 3d13ebb6d9
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "section 2026-11-16T04:29:57Z"
    kind: cited
    text: "The FBI says ARTEX excels at finding and exploiting peripheral systems that get less security attention: partner and supplier portals, mobile backends, employee applications, legacy services and third-party integrations ("
    urls: ["https://www.ic3.gov/CSA/2026/261113.pdf"]
  - claim_id: 26d050bc1f
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "section 2026-11-16T04:29:57Z"
    kind: cited
    text: "Theft preparation used database queries, mass blob reads, custom boot scripts via EC2 instances and new 100 GB volumes, with command output sent to rotating webhook endpoints, and command and control ran through residential proxies, Tor, Chisel and SoftEther ("
    urls: ["https://www.ic3.gov/CSA/2026/261113.pdf"]
  - claim_id: e0d30807e0
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "section 2026-11-16T04:29:57Z"
    kind: cited
    text: "Telemetry the FBI lists: unexpected outbound calls to LLM API endpoints (to be read alongside other suspicious activity), high-frequency sequential enumeration against login and search endpoints, Azure Resource Manager deployment-validation dry runs across many resource types, IAM permission tests with DryRun flags and sub-second test blob writes and deletes, credential additions to applications and service principals in the Entra audit log, and .aspx or .jsp files in unexpected web-application paths ("
    urls: ["https://www.ic3.gov/CSA/2026/261113.pdf"]
