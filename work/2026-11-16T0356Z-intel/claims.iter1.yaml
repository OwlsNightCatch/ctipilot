    surface: "section 2026-11-16T04:29:57Z"
    kind: cited
    text: "Theft preparation used database queries, mass blob reads, custom boot scripts via EC2 instances and new 100 GB volumes, with command output sent to rotating webhook endpoints, and command and control ran through residential proxies, Tor, Chisel and SoftEther ("
