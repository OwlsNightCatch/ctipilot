    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "section 2026-11-16T04:29:57Z"
    kind: uncited
    text: "Initial access came through unsigned SAML assertions, XXE, SSRF, anonymous file upload, hard-coded administrator passwords in single-page-application JavaScript bundles, stolen VPN configurations and leaked credentials, cross-account cloud trust abused from an external partner tenant, and compromised third-party vendor credentials used across trusted B2B federation."
  - claim_id: c96534d289
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "section 2026-11-16T04:29:57Z"
    kind: uncited
    text: "Persistence used JSP and PHP web shells (one route was MySQL log poisoning), Kudu administrative APIs to run commands, and credentials added to existing OAuth applications."
  - claim_id: 30677ba922
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "section 2026-11-16T04:29:57Z"
    kind: uncited
    text: "Inside networks the agents ran iterative PowerShell enumeration against domain controllers (over 110,000 Active Directory objects), Kerberoasting, DCSync, resource-based constrained delegation abuse and LAPS password reads, queried the cloud metadata service through XXE, and inventoried Windows hosts without a particular EDR sensor; attempted lateral movement to domain controllers by pass-the-ticket, WinRM, Kerberos relay and pass-the-hash was blocked by endpoint protection."
