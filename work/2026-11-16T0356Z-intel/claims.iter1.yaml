    kind: cited
    text: "Telemetry the FBI lists: unexpected outbound calls to LLM API endpoints (to be read alongside other suspicious activity), high-frequency sequential enumeration against login and search endpoints, Azure Resource Manager deployment-validation dry runs across many resource types, IAM permission tests with DryRun flags and sub-second test blob writes and deletes, credential additions to applications and service principals in the Entra audit log, and .aspx or .jsp files in unexpected web-application paths ("
