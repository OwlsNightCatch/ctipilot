    sources:
      - { url: "https://www.heise.de/news/Pager-Panne-in-Sachsen-Notrufmeldungen-offenbar-frei-zugaenglich-im-Netz-11523154.html", publisher: "heise online", date: "2026-11-12", role: "primary" }
      - { url: "https://www.spiegel.de/netzwelt/sachsen-massive-datenpanne-bei-notrufdiensten-a-c5fc673d-e0fa-422b-bed3-a3d323b9db1b", publisher: "DER SPIEGEL (originating report, paywalled; teaser read)", date: "2026-11-11", role: "primary" }
      - { url: "https://www.beobachter.ch/burger-verwaltung/sensible-notrufdaten-im-netz-174268", publisher: "Beobachter (Swiss precedent, 2018)", date: "2018-08-28", role: "background" }
    discovery_trace: "first seen at: heise-sec feed, URL https://www.heise.de/security/feed.xml (item 'Pager-Panne in Sachsen: Notrufmeldungen offenbar frei zugänglich im Netz', 2026-11-12T15:19Z, outside window_hours) → pivot: heise article, URL https://www.heise.de/news/Pager-Panne-in-Sachsen-Notrufmeldungen-offenbar-frei-zugaenglich-im-Netz-11523154.html → originating report: Spiegel, URL https://www.spiegel.de/netzwelt/sachsen-massive-datenpanne-bei-notrufdiensten-a-c5fc673d-e0fa-422b-bed3-a3d323b9db1b (extract returned title, date 2026-11-11 and teaser only) → Swiss background via WebSearch (\"Pager Notrufmeldungen Sachsen Datenleck Rettungsdienst POCSAG Innenministerium Schweiz Feuerwehr unverschlüsselt\") → Beobachter 2018, URL https://www.beobachter.ch/burger-verwaltung/sensible-notrufdaten-im-netz-174268 (read through the reader fallback)"
    summary: |
      Per Der Spiegel (11 November), relayed and extended by heise (12 November), unauthorised parties could for years read in a social network the emergency alerts sent to the mobile pagers of fire brigades, rescue services and civil protection in Saxony, hundreds of messages a day, mainly around Leipzig and in the Zwickau, Vogtland and Erzgebirge districts; the teaser says they contained diagnoses, patient names and addresses. An informant told the Saxon interior ministry and the LKA at the end of October, got no reply and went to the media (Spiegel via heise). Saxony's LKA cybercrime contact point (ZAC) told heise it learned of the incident on 31 October and opened investigations at once, with the number of affected persons and amount of data unknown. The rescue association Südwestsachsen now sends alert details without patient names and house numbers (heise).
      Technical background stated by heise: the pagers use the POCSAG radio protocol, which has no encryption of its own; per Spiegel the Saxon networks use the IDEA cipher of 1990, considered outdated for its 64-bit block size, and the informant says the keys are available in online forums (informant's claim). Swiss precedent: Beobachter reported in August 2018 that Swiss ambulance and fire services communicated unencrypted by pager nationwide and that a public website listed current pager messages; whether and how far Swiss operators have since moved to end-to-end encryption was not verified in this pass.
    region_nexus: "Germany (Saxony); transferable to Swiss emergency services that use POCSAG pagers (2018 Swiss precedent; current Swiss status unverified)"
