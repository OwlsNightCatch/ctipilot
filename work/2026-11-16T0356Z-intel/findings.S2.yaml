    extended_notes: |
      Mapping caveat: T1040 is the closest active id for passive interception of broadcast alert traffic; the sources describe over-the-air readability and online publication, not a network-sniffing tool. Exposure line material: any emergency-services organisation whose dispatch centre pushes patient-identifying text to POCSAG pagers, and whose encryption (if any) is a legacy block cipher or only covers the path to the transmitter. Detection is mostly not a telemetry problem; the control is minimising what is sent (the one measure a source states is the Südwestsachsen rescue association now omitting patient names and house numbers) and verifying with the alerting vendor what the cipher is and how keys are managed (ours; the Saxon cipher claim comes from Spiegel via heise). Worth a question to Swiss dispatch-centre operators; no Swiss authority statement on the Saxon case was found.
