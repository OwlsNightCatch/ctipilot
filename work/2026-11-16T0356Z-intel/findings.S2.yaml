    extended_notes: |
      Raw material for the labelled lines. Exposure: any Microsoft 365 tenant; the lure needs no vulnerability. Detection: mail-flow telemetry for the subject pattern and sender-display-name pattern above and for SendGrid click-tracking redirects; click telemetry (Microsoft names Defender XDR UrlClickEvents) for users who followed such links; after a click, identity-provider sign-in logs for the clicking user (new device or location, new MFA registration) because Microsoft has not confirmed what the landing page collects. Triage: the discriminator Microsoft gives is the channel, genuine service status is read in the Microsoft 365 admin center and does not ask recipients to click to restore held mail within 24 hours; administrators who subscribe to Service Health mail will see genuine notices that carry incident ids like the one cited, so the id alone proves nothing (ours). The lure is short-lived and tied to the outage window; no IOCs are carried here by design (the sender and landing domains are in Microsoft's thread).
