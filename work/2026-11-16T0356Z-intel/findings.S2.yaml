    discovery_trace: "first seen at: heise-sec feed, URL https://www.heise.de/security/feed.xml (item 'Phishing-Kampagne nutzt Microsoft-Cloud-Ausfall', 2026-11-15T13:59Z) → pivot: heise article, URL https://www.heise.de/news/Phishing-Kampagne-nutzt-Microsoft-Cloud-Ausfall-11525471.html (links Microsoft's Bluesky post) → primary: Microsoft Threat Intelligence thread read through the public Bluesky API (https://public.api.bsky.app/xrpc/app.bsky.feed.getPostThread?uri=at://threatintel.microsoft.com/app.bsky.feed.post/3n2auwt37bm2z&depth=10, HTTP 200, 7-post thread dated 2026-11-14) and the human page https://bsky.app/profile/threatintel.microsoft.com/post/3n2auwt37bm2z (HTTP 200, text in og:description) → outage cause: heise https://www.heise.de/news/Microsoft-Ausfall-Woran-es-lag-und-wer-besonders-litt-11525257.html → Swiss impact: Inside IT feed (https://www.inside-it.ch/rss.xml) item, article read with `url --direct`, URL https://www.inside-it.ch/microsoft-panne-schraenkt-schweizer-geschaeftsalltag-ein-20261113. WebSearch for a Microsoft blog or MSRC write-up found none."
    summary: |
      Microsoft Threat Intelligence posted on 14 November that it observed an active phishing campaign exploiting the Microsoft 365 service disruption of 12 November. The messages impersonate Microsoft 365 service-health notifications and cite the real Exchange Online incident EX1550543; some claim that messages were held during the outage and will be deleted within 24 hours unless the recipient clicks to restore them. Microsoft describes the subject pattern as "Outage - [six-character code]" with sender display names built from an organisation-specific prefix plus "Outage Notification" or "Service Health", three sender domains and recipient-specific SendGrid click-tracking links that redirect to a single landing host. Microsoft says the activity is consistent with credential phishing but credential collection and malware delivery are not confirmed, and that similar messages targeted organisations across several US sectors; Defender blocks the domains and Defender for Office 365 quarantines the mail. Microsoft's advice is to verify Safe Links policies, investigate user clicks and confirm service disruptions only in the Microsoft 365 admin center; its named hunting tables are EmailEvents, EmailUrlInfo and UrlClickEvents.
      Context: the outage ran from the evening of 12 November into Saturday 14 November; Microsoft's first explanation (via heise/dpa) is a fault introduced by a network capacity upgrade and says it was not a cyberattack or AI activity. Swiss organisations were affected: the Swiss federal administration (about 44,000 staff) reported only minor performance problems with individual applications and unimpaired staff e-mail (Keystone-SDA via Inside IT), while companies and ETH Zurich reported mail, Teams and SharePoint disruption. Observed targeting in Microsoft's post is US; the Swiss relevance is the shared tenant technology and a lure tied to an event Swiss staff experienced.
    region_nexus: "global; observed targeting US sectors; Swiss and German organisations on Microsoft 365 were hit by the same outage"
    primary_sector_nexus: "indirect: Swiss federal and cantonal administrations that run Microsoft 365 receive the same lure class; the federal administration reported only minor impact from the outage itself"
