      Cross-domain lead for S1 (vulnerability triage), returned because it sits inside the ACN rotational lookback and is absent from the store. The React project's advisory GHSA-xqc2-xf4c-x3h3 (CVE-2026-126187, CVSS v4.0 9.5, AV:N/AC:L/AT:P/PR:N/UI:N) says crafted payloads aimed at frameworks that support React Server Components can lead to remote code execution, and then narrows it: "This only affects extremely rare cases where responses transport multiple typed arrays and an attacker-controlled value." Affected are react-server-dom-webpack, react-server-dom-parcel and react-server-dom-turbopack 19.0.0 to 19.0.8, 19.1.0 to 19.1.9, 19.2.0 to 19.2.8 and 19.3.0; fixes are backported to 19.0.9, 19.1.10, 19.2.9 and 19.3.1. Apps whose React code does not use a server, or that use no framework, bundler or bundler plugin supporting Server Components, are not affected. ACN's alert of 11 November classes it as unauthenticated remote code execution and marks neither a public PoC nor exploitation. Discrepancy to resolve: the GitHub page shows the advisory as published 14 October 2026 while ACN's alert is dated 11 November and the CVE id is of the November range.
