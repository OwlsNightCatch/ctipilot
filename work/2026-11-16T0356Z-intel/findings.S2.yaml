    extended_notes: |
      Raw material for the labelled lines (all from the two authority texts unless marked ours):
      Exposure: staff who search the web for legal or contract documents and download files from search hits (Gootloader delivery per Europol/BKA); endpoints whose browsers hold saved passwords and session secrets (StealC extracts "passwords, stored access data and digital identities" per Europol); operators of WordPress sites, the platform of the compromised hosting sites (Europol remediated 681 infected websites).
      Detection (telemetry class first; concept, not rule code): authentication and identity-provider sign-in logs for accounts that appear in the notification channels Europol names (HaveIBeenPwned domain notifications, Shadowserver, NL-NCSC), looking for sign-ins from new devices or locations after a stealer-log disclosure (ours); web-proxy / DNS logs for downloads of document-lookalike files reached from search-engine referrals followed by new process creation from the browser download path (ours, mechanism generic); WordPress admin and file-change logs on own sites. Post-takedown check: a stealer-log hit means browser-stored credentials and session secrets were readable on that endpoint; reimage or clean the endpoint, reset the passwords stored there and revoke sessions (ours).
      Defender takeaway: act on takedown-driven victim notifications as credential-exposure triggers and keep loader and stealer detections in place, because BKA documents StealC's operators rebuilding within about four months of the June round. BKA background in the same release: Operation Endgame has since 2024 neutralised 17 malware variants, issued 47 arrest warrants and secured or frozen over EUR 270 million.
