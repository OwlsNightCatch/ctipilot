    discovery_trace: "first seen at: vd-grand-conseil (candidate record), URL https://www.vd.ch/gc/seances-du-grand-conseil/detail-seance/seance-gc/1033714 (session of 3 November, where the interpellation was deposited) → sessions list https://www.vd.ch/gc/seances-du-grand-conseil via `url --direct` (hrefs: 1033715 = 10 Nov, 1033716 = 17 Nov) → session page URL https://www.vd.ch/gc/seances-du-grand-conseil/detail-seance/seance-gc/1033715 (point 6, 'Décision = Transmise au CE') → primary: agenda point page with the deposited text, URL https://www.vd.ch/gc/seances-du-grand-conseil/point-seance/point/c8d4c90b-d8f0-4fc7-9190-c5d65d6a2a3e/meeting/1033715"
    summary: |
      Delta for the existing Vaud school IT-support entry. Interpellation 26_INT_155 by Didier Lohri (deposited 3 November, text dated 1 November, developed in plenary on 10 November and transmitted to the Council of State, which now has to answer) turns the breach into a governance question. The text states (as the member's own account) that the State services detected unauthorised access to the IT-support platform of the post-compulsory education directorate (DGEP) on Monday 26 October, that names, first names and school e-mail addresses of about 41,500 pupils and teachers and the content of support requests were copied, and that the official communiqué came five days later, on Saturday 31 October. It asks whether the platform was run by the DGEP autonomously with its own firewall or fell inside the perimeter of the central digital directorate (DGNSI); why the State maintains three identity sources (cantonal authentication, edu-vd for the compulsory-school directorate, eduvaud for six post-compulsory schools); whether the DGEP and DGEO environments meet the same requirements as the DGNSI (multi-factor authentication, connection monitoring, regular audits); how much IT was bought without DGNSI validation in 2023 to 2025; how many cloud services run outside the validated catalogue; and whether the Council of State will put all purchases, infrastructure and directories of both directorates under DGNSI authority.
      These are questions and the member's claims, not findings; the government's answer is pending. The transferable point for cantonal and communal IT is the pattern the questions name: a departmental support platform and a parallel identity directory outside the central IT perimeter, with security standards (MFA, monitoring, audit) not demonstrably applied.
