    discovery_trace: "first seen at: europol-newsroom feed, URL https://www.europol.europa.eu/rss.xml (title '6.4 million victim datasets secured in international operation against malware networks', undated in the feed) → date taken from `url --direct` of the item (datePublished 2026-11-12T13:00:01+00:00) and body from window.SERVER_DATA node.body, URL https://www.europol.europa.eu/media-press/newsroom/news/64-million-victim-datasets-secured-in-international-operation-against-malware-networks → independent second primary linked from heise: BKA/ZIT press release, URL https://www.presseportal.de/blaulicht/pm/7/6389442 → heise-sec feed (https://www.heise.de/security/feed.xml) and inside-it-ch feed (https://www.inside-it.ch/rss.xml) carried the news item on 2026-11-13, heise article URL https://www.heise.de/news/Operation-Endgame-Weltweiter-Schlag-gegen-Cybercrime-11524460.html"
    summary: |
      Europol and the Frankfurt public prosecutor's cybercrime unit (ZIT) with the BKA report a further Operation Endgame round, carried out 9 to 11 November 2026 (BKA) and announced 12 November, against three commodity toolkits: Gootloader (dropper/loader delivered as fake legal documents through compromised, often WordPress, websites; BKA names SEO poisoning as the spreading method and says it has been active since 2020 with Germany among the most affected countries), CastleRAT (remote access trojan known since 2025) and StealC (stealer with dropper function). Europol counts 235 servers and 257 domains actioned together with private partners: Gootloader 14 servers and 218 domains plus 681 infected websites remediated, CastleRAT 120 servers and 39 domains, StealC 102 servers described as continuing the June 2026 efforts. BKA counts about 6.4 million credentials from over 40,000 victims secured in the criminal infrastructure and more than 40 of the servers in Germany. Both authorities say these tools fed ransomware and data theft.
      BKA adds a fact the Europol text lacks: StealC's operators adapted and brought infrastructure back after the June 2026 action, and follow-up investigation mapped the new infrastructure, part of which ran at the bulletproof host Virtualine/Omegatech that Frankfurt police and the Dutch NHTCU shut down at the end of October 2026. Europol says the seized victim data is passed to HaveIBeenPwned, DIVD, CheckjeHack, NoMoreLeaks, Sekoia, the Shadowserver Foundation and NL-NCSC so victims can be told (Europol ties this to CastleRAT victims); BSI helps notify victims in Germany. Europol's advice for WordPress operators is to rotate credentials, enable multi-factor authentication and patch. Europol lists Bulgaria, Canada, Denmark, Germany, Moldova, the Netherlands, Poland, the UK and the US as participants; Switzerland is not named and no Swiss authority statement was found.
      Assessment (ours, not a source claim): the round is a credential-exposure event for any organisation whose staff hold stealer-logged browser secrets, and BKA's own account of StealC returning within about four months means a takedown is no reason to relax stealer or loader detections.
    region_nexus: "Europe-wide law-enforcement action; Switzerland not a listed participant; BKA says Germany is among the countries most affected by Gootloader (relevant to German-speaking Swiss organisations by language and search behaviour, our reading)"
    primary_sector_nexus: "indirect: commodity initial-access and credential-theft chain that both authorities say fed ransomware and data theft; no Swiss public-sector victim named"
