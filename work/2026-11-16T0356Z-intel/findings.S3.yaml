    extended_notes: |
      Detection anchors from the primary: process-creation events with parent lineage (cmd.exe under sqlservr.exe or w3wp.exe); a SolarWinds-installed erl.exe launched with -noshell, a random -sname, -setcookie and an -eval rpc:call(...,os,cmd,...) argument carrying decimal character codes (Symantec shows the command line; the legitimate Orion broker runs erl.exe under its own service, so the interactive-style -eval argument and a non-service parent are the discriminators); certutil decode followed by csc.exe compilation under ProgramData; PowerShell script-block logging showing banner-labelled sections and first-person reasoning comments; saves of the SAM, SYSTEM and SECURITY hives. Hardening levers: keep xp_cmdshell disabled, restrict Orion's RabbitMQ and Erlang distribution ports between web servers, protect the .erlang.cookie file, and treat Zabbix pre-shared keys as secrets. Symantec's protection section is vendor product marketing; its IOC tables are omitted here.

