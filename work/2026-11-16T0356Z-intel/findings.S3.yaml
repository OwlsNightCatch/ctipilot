    summary: |
      Europol announced on 2026-11-12 the latest round of Operation ENDGAME, in which law enforcement and private partners actioned 235 servers and 257 domains behind three toolkits: Gootloader (14 servers and 218 domains taken down and 681 infected websites remediated; it served fake legal documents from compromised, often WordPress, sites and led to ransomware), CastleRAT (120 servers and 39 domains seized, with victim data shared for alerts; Europol links it to encrypted data sets, crippled IT systems and forced ransom payments) and StealC (102 servers, continuing the June 2026 action; it takes passwords, stored access data and digital identities and can drop further malware). Over 6 million victim credentials were identified on the seized infrastructure (headline figure 6.4 million victim datasets); Europol says the suspects sold them for later attacks including ransomware, and that victim data will be made available through HaveIBeenPwned, DIVD, CheckjeHack, NoMoreLeaks, Sekoia, The Shadowserver Foundation and NL-NCSC to alert victims of CastleRAT credential theft. Participating authorities listed are Bulgaria, Canada, Denmark, Germany (BKA), Moldova, the Netherlands, Poland, the UK (NCA) and several US agencies; no Swiss authority is named. Europol's advice is aimed at WordPress users: change credentials, enable multi-factor authentication and patch.
