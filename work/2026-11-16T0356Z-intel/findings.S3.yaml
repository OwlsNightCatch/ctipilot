    discovery_trace: "first seen at: helpnetsecurity, extract of the front page https://www.helpnetsecurity.com/ (raw HTML, article hrefs parsed by regex) → https://www.helpnetsecurity.com/2026/11/11/eu-enisa-cybersecurity-report/ → primary: ENISA condensed report PDF linked from that article, read with the pdf subcommand, URL https://www.enisa.europa.eu/sites/default/files/2026-11/ENISA_Art18_2026_Condensed.pdf; WebSearch ('ENISA 2026 report state of cybersecurity in the Union Article 18 NIS2 EU Cybersecurity Index') returned an eunews piece dated 2026-11-10 that I did not fetch"
    summary: |
      ENISA's 2026 Report on the State of Cybersecurity in the Union, prepared with the NIS Cooperation Group and the European Commission under Article 18 of NIS2 and published in early November 2026 (Help Net Security covered it on 2026-11-11; the ENISA PDF carries no day-level date in its text), keeps the level of cyber threat to the EU at 'substantial', unchanged from 2024, and says intrusion activity stayed significant and diverse through 2025 and 2026, with financially motivated and hacktivist activity prominent and AI acting as a force multiplier that shortens vulnerability discovery and weaponisation to days, hours or minutes. According to Help Net Security's reading, the revised EU Cybersecurity Index averages 71.53 out of 100 (framework changed, so not comparable with 2024), information-sharing is the weakest dimension (26.30 for essential and important entities), and a separate ENISA survey found that 45% of surveyed IT service management providers took more than three months to patch critical systems and 43% ran no cybersecurity assessment in a year; supply-chain risk management is the NIS2 requirement 37% of surveyed organisations call hardest. The report also records that since 2026-09-11 manufacturers of products with digital elements must report actively exploited vulnerabilities and severe incidents through the Cyber Resilience Act Single Reporting Platform, with notified vulnerabilities published in the EU Vulnerability Database once a fix or mitigation exists (the CRA applies in full from 2027-12-11), and that the NIS Cooperation Group adopted an EU ICT Supply Chain Security Toolbox in early 2026. Switzerland is not an EU member state and NIS2 does not apply to it directly; the relevance is as a benchmark and as a source of supplier-patch-latency evidence.
