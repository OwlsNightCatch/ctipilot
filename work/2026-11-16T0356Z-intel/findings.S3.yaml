  - title: "ANNUAL REPORT — Proofpoint, Europe's Threat Landscape in 2026: phishing detections up 4.5x, South Asian, Russian and Chinese state-aligned actors widening European targeting, precision cloud attacks impacting 64% of targeted organisations, TA2730 investor lures that include Switzerland"
