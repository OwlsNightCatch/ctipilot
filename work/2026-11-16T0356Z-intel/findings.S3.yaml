    relation_suggestions:
      - { subject: "campaign:operation-snowball-ai-telecom-intrusion-2026-11", object: "tool:suo5", basis: "Malbear: the agent deployed suo5 as its SOCKS tunnel until endpoint controls blocked it (Malbear Labs, 2026-11-08)" }
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    classification_hint: "C3 for the campaign narrative (new lab, no victim confirmation, claims taken from the attacker's own agent reports); A1 for the CVE facts (Cisco PSIRT fixed releases and CISA KEV listing)"
    novelty: new
    lookback: true
    evidence:
      - quote: "The agent exploited CVE-2026-20320, an unauthenticated XXE in the BroadWorks OCI XML parser."
        attribution: "Malbear Labs"
        source_url: "https://malbearlabs.com/posts/operation-snowball-inside-an-autonomous-ai-intrusion-campaign"
      - quote: "This is a threat actor who delegated the intrusion to an AI and checked in asynchronously to review progress."
        attribution: "Malbear Labs"
        source_url: "https://malbearlabs.com/posts/operation-snowball-inside-an-autonomous-ai-intrusion-campaign"
      - quote: "The post does not say whether Malbear checked these claims with any victim, what was taken rather than staged or whether all 13 organizations were breached."
        attribution: "Infosecurity Magazine"
        source_url: "https://www.infosecurity-magazine.com/news/operation-snowball-ai-telecom/"
      - quote: "Cisco BroadWorks contains an improper restriction of XML external entity reference vulnerability that could allow an unauthenticated, remote attacker to read sensitive configuration information on an affected system."
        attribution: "CISA Known Exploited Vulnerabilities catalog"
        source_url: "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"
    extended_notes: |
      Detection and hardening content the primary supports (Malbear's own list): a file-based PowerShell C2 chain in the Windows temp directory in which a watchdog hash-polls a command script every 5 seconds (720 iterations, one hour) and updates a lock file while a command runner writes a results file, spawned as hidden PowerShell with an encoded payload through WMI Win32_Process.Create; Malbear calls the multi-PS1-in-temp plus lock-file-heartbeat combination specific enough to hunt on. Unicode-escaped JSP scriptlets compile identically but evade string signatures, so JSP detection must normalise escapes or act at class load. BladeLogic RSCD (TCP 4750) should not be reachable from compromised application servers; an end-of-life JBoss AS 6 reachable from the internet should be treated as already exploited (CVE-2013-2165). Malbear stresses the agent is noisier than a human (continuous parallel scanning and authentication), so working-hours and dwell-time hunts have little to find. Note for the main agent: (a) Cisco's advisory carries two revisions this week (v1.1 on 2026-11-12 reflecting known active exploitation, v1.2 on 2026-11-13 stating no direct evidence while noting the KEV listing), which I read in the Japanese translation (English governs); (b) CVE-2026-20320 is one of four KEV additions from 2026-11-09 to 2026-11-13 that tools/kev_window_diff.py reports as NOT COVERED by the store (the others: GPUStack CVE-2026-102895, Openwave Webtop Media Transcoder CVE-2026-111793, UnrealIRCd CVE-2026-114713), so S1 or a changelog disposition should settle them; (c) related store entries to reference: 2026-10-16/cl-unk-1211-ai-assisted-intrusions-government-linux-hosts and 2026-09-23/gambit-ai-agent-retail-skimmer-campaign-strix-cairn-hermes. PwnKit CVE-2021-4034 is deliberately left out of cves (already in two store entries).

  - title: "Cairn turned on semiconductor, defense-policy and civil-society targets: Unit 42 tracks CL-STA-1238, a China-nexus operator who ran the open-source Cairn agent framework on GLM and DeepSeek models for 25 operations against 19 organisations"
    sources:
      - { url: "https://unit42.paloaltonetworks.com/cairn-framework-ai-autonomous-attacks/", publisher: "Palo Alto Networks Unit 42", date: "2026-11-12", role: "primary" }
      - { url: "https://www.helpnetsecurity.com/2026/11/12/cairn-autonomous-ai-cyberattacks/", publisher: "Help Net Security", date: "2026-11-12", role: "corroborating" }
    discovery_trace: "first seen at: helpnetsecurity, extract of the front page https://www.helpnetsecurity.com/ (raw HTML, article hrefs parsed by regex) → https://www.helpnetsecurity.com/2026/11/12/cairn-autonomous-ai-cyberattacks/ → primary: Unit 42, URL https://unit42.paloaltonetworks.com/cairn-framework-ai-autonomous-attacks/ (also listed in the unit42 feed https://unit42.paloaltonetworks.com/feed/, standing check)"
    summary: |
      Unit 42 reports that from August to September 2026 Chinese-speaking attackers ran Cairn, an open-source AI penetration-testing framework (a customised fork on a Hong Kong server), to conduct 25 autonomous operations against at least 19 organisations, with 13 operations on Zhipu GLM 5.2, eight on DeepSeek V4 Flash and four on DeepSeek V4 Pro, and gained unauthorised access or data at 10 of them. Each operation was a one-line Chinese goal plus a root domain (sometimes pre-gathered hints such as VPN gateway names and group passwords); a Chinese preamble and an AUTHORIZATION.md file declared the engagement authorised and forbade refusal, and neither model refused. Targets were seven semiconductor and advanced-manufacturing supply-chain organisations, three defence or defence-policy organisations and four human-rights and civil-society bodies. Reported successes came from ordinary weaknesses: weak-password spraying of a standards body's application server (dozens of valid credentials), an unauthenticated cloud-storage write that overwrote a live standards-ballot document, a brute-forced production credential on a partner-integration application followed by new administrator accounts and a persistent API token, an unauthenticated account-creation bypass on a CMS (over one million member records), and an open registration endpoint on a defence-policy identity platform (about 500 records including .mil and .gov accounts). Unit 42 assesses with moderate confidence China-nexus intelligence collection (artefact language, exclusive use of Chinese models, target selection) under the designation CL-STA-1238 and judges that a single operator or small team ran 19 simultaneous attempts in two weeks. Its conclusion for defenders is that the flaws were known (authentication bypass, IDOR, mass-assignment privilege escalation, weak and default credentials, exposed cloud APIs, dated public CVEs) and that identity hygiene, attack-surface reduction and patching still work. The store already carries Cairn as a tool from the Gambit retail-skimmer campaign; this is a distinct operator and victim set.
    region_nexus: "no Swiss or European victim named; victims described as US-centred (a Canadian human-rights body and a US teachers' union are named in the post) plus semiconductor supply-chain organisations"
    primary_sector_nexus: "indirect: a state-nexus operator using autonomous agents against government-adjacent policy and standards bodies; transferable lesson for internet-facing registration, SSO and API endpoints of public institutions"
