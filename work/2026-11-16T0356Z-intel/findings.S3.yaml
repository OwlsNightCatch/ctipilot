  - title: "ANNUAL REPORT — ENISA, 2026 Report on the State of Cybersecurity in the Union (biennial, NIS2 Article 18): EU threat level stays 'substantial', 45% of surveyed IT service providers took over three months to patch critical systems, Cyber Resilience Act exploited-vulnerability reporting live since 2026-09-11"
