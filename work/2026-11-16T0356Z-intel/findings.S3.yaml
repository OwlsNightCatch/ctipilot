  - title: "Symantec: dozens of AI-assisted intrusions since May, detailed through a September 2026 retailer case where blocked hand-typed commands gave way to model-written PowerShell, a SolarWinds Orion RabbitMQ Erlang cookie used to run commands on a second server, and a process-tree-breaking tool"
    sources:
      - { url: "https://www.security.com/threat-intelligence/ai-assisted-attack-us-retailer", publisher: "Symantec and Carbon Black Threat Hunter Team", date: "2026-11-12", role: "primary" }
      - { url: "https://www.darkreading.com/cyberattacks-data-breaches/inside-ai-attack-us-retailer", publisher: "Dark Reading", date: "2026-11-12", role: "corroborating" }
    discovery_trace: "first seen at: darkreading feed https://www.darkreading.com/rss.xml (item https://www.darkreading.com/cyberattacks-data-breaches/inside-ai-attack-us-retailer; the extract call was served by the metered reader) → primary: Symantec Threat Hunter Team, URL https://www.security.com/threat-intelligence/ai-assisted-attack-us-retailer (linked from the Dark Reading article)"
    summary: |
      Symantec's Threat Hunter Team says the September 2026 intrusion into a US retailer is one of dozens of AI-assisted attacks it has investigated since May, with most in September. Initial access is unknown; the earliest activity (2026-09-18) ran as cmd.exe directly under sqlservr.exe on three SQL Server hosts, most likely through xp_cmdshell, and later activity ran under w3wp.exe on a web server where hand-typed commands (three typing errors in 110 actions, the same blocked loader re-run five times in about 20 minutes) had every staged payload terminated by security software. The next day roughly 50 long, error-free PowerShell scripts with labelled output banners and reasoning-style comments arrived over about two hours; Symantec assesses AI assistance with high confidence but, from gaps never below seven seconds, an operator relaying output to an AI tool rather than an autonomous agent. In that phase the attackers collected connection strings and client settings (FileZilla, WinSCP, PuTTY, saved RDP files, IIS configuration), located the SolarWinds Orion install, queried its SQL Server for the monitored-node table, read the Zabbix agent pre-shared key, then read the Orion-bundled RabbitMQ node's .erlang.cookie and used Orion's own erl.exe with that cookie to run operating-system commands on a second web server about 10 minutes after first querying Orion. Earlier tooling in the same intrusion included an EfsPotato privilege-escalation tool compiled on the host with csc.exe from certutil-decoded text, registry-hive dumps (SAM, SYSTEM, SECURITY), DLL-sideloading sets (a pairing Symantec notes is documented for ShadowPad loaders but also used by other actors) and a process-tree-breaking utility ("BreakChain") that relaunches payloads so they no longer descend from w3wp.exe. Symantec found overlaps in loaders and staging infrastructure with an August 2026 intrusion and a July 2026 securities-firm intrusion (neither showing AI use) and says the retail case may be linked to the operator in Gambit Security's 2026-09-22 retailer report, although that report does not mention these loaders. The post also summarises five other AI-assisted cases (a Vietnamese university, an East African ICT provider serving banks and telecoms, a south Asian hydroelectric company, a south Asian web host and linked south Asian cases) and concludes that AI supplied no new techniques, only speed and persistence: blocked tools were rebuilt within seconds to about 10 minutes.
