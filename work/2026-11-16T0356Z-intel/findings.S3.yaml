      Defender hooks: the victim-data channels (Shadowserver and HaveIBeenPwned in particular) are only useful if the organisation's domains and IP ranges are already subscribed; that is a check, not a new control. Gootloader reaches users through compromised WordPress sites that serve fake legal documents, so WordPress estates (communal and cantonal sites included) are both a possible victim and a possible host. Credentials taken by StealC and CastleRAT include saved logins and session material, so a hit in a notification feed calls for password reset plus session and token revocation, not only a reset. Fetch note: the Europol page is a single-page app whose `extract` result is raw HTML; the press-release body is in the window.SERVER_DATA JSON, the og:description meta carries the headline numbers, and the newsroom listing JSON gives the publication epoch (2026-11-12T13:00:01Z).

