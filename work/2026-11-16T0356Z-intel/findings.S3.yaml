      - { url: "https://www.infosecurity-magazine.com/news/phishing-rises-faster-europe/", publisher: "Infosecurity Magazine", date: "2026-11-13", role: "corroborating" }
    discovery_trace: "first seen at: infosec-magazine feed https://www.infosecurity-magazine.com/rss/news/ (item https://www.infosecurity-magazine.com/news/phishing-rises-faster-europe/, read with extract) → primary: Proofpoint UK blog, URL https://www.proofpoint.com/uk/blog/threat-insight/europes-threat-landscape-2026-espionage-expands-ai-and-phishing-risks-grow"
    summary: |
      Proofpoint published its Europe-focused threat landscape review on its UK blog (page dated 2026-11-11; Infosecurity Magazine places the release on 2026-11-12 at Proofpoint Protect London), built on its own telemetry for July 2025 to September 2026. Proofpoint reports phishing detections up 4.5x across Europe year over year against 1.5x worldwide (3.2x per million inbound messages) and 8.3 clicks per 100 delivered threat messages in Europe against 2.0 globally; callback phishing (TOAD) against European healthcare is up 257% and malware detections 84%. On state-aligned activity it says South Asian actors (TA395 named, using likely LLM-created CAPTCHA intermediate pages) have widened from regional targets into East Asia and Western Europe; Russian actors favour techniques that need less victim interaction, namely TA488 half-click exploits against Outlook, Zimbra and other webmail (Proofpoint assesses LLM-assisted exploit research) and UNK_AcademicFlare device-code and app-specific-password phishing that it says kept targeting European government, education and think tanks in 2026; Chinese state-aligned actors use browser and webmail exploitation and adversary-in-the-middle kits (custom tooling and Evilginx) and have widened their scope to AI-policy targets. In cloud, Proofpoint says 99% of observed European organisations were targeted and that precision attacks (phishing and session hijacking against specific accounts) impacted 64% of targeted organisations against 33% for brute force, with 72% showing post-access activity such as authentication-control changes, file access and mailbox abuse. It also counts more than 188,000 AI-enabled applications connected through OAuth and a 4.6x rise in the share of European sensors hit by attacks on open-source AI building blocks such as Langflow and LiteLLM. The one Swiss-specific datum is the cybercriminal actor TA2730, which Proofpoint says targets retail investors and brokerage customers in the UK, Switzerland, Germany, Italy, Belgium, Denmark and the Netherlands with localised W-8BEN tax-form lures impersonating Swissquote, Binance and Interactive Brokers and a real-time phishing kit whose live operator uses stolen passwords and MFA codes before they expire. These are vendor-telemetry statistics (detections, not incidents); Proofpoint gives no per-country breakdown and no Swiss public-sector figures.
    region_nexus: "Europe-wide; Switzerland named as a TA2730 target country (Swiss-brand lure: Swissquote); European government named among UNK_AcademicFlare and Chinese state-aligned targets"
    primary_sector_nexus: "direct: European government, education and think tanks are named targets of UNK_AcademicFlare device-code phishing and of Chinese and Russian state-aligned webmail and browser exploitation; Swiss retail-investor accounts in the TA2730 lure set"
