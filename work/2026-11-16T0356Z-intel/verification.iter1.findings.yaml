- code: F9
  category: surface-contradiction
  section: update-2026-11-16T04:29:57Z
  item: "2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse"
  url_or_quote: "says to keep those connections disabled until ConnectWise gives restoration instructions"
  summary: "The FBI advice is relayed accurately but is stale against ConnectWise's own status page (https://status.connectwise.com/pages/incident/619cf82551fec9053d612f09/6ad263692dc48705ab3da2cb, entry of October 28, 2026 5:09PM UTC): 'We are beginning phased restoration ... through a new, security-hardened application ... Partners must re-authorize each Microsoft 365 tenant using the new application ... Please visit the ConnectWise Trust Center for detailed instructions'. The store's ConnectWise entry already says 'the earlier advice to keep the old connections disabled until restoration instructions exist is replaced'. The section silently picks the FBI wording and a reader is told instructions do not yet exist. Fix: add a Contradiction/clarification clause (instructions exist since 2026-10-28, restoration is via a newly consented application, the old identities stay disabled) or drop the clause and point to the ConnectWise entry."
- code: F8
  category: needs-more-research
  section: update-2026-11-16T04:29:57Z
  item: "2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse"
  url_or_quote: "Persistence used JSP and PHP web shells (one route was MySQL log poisoning), Kudu administrative APIs to run commands"
  summary: "The section reports Kudu abuse, peripheral-surface exploitation and AD credential theft but drops the FLASH's own hardening levers that its primary supports: 'Restrict cloud administration ... application publishing interfaces (Kudu/SCM endpoints) ... to trusted networks'; 'Disable basic publishing authentication where not required; restrict SCM access to approved management networks'; 'Inventory all internet-facing applications, including peripheral systems: partner and supplier portals, mobile backends...'. The entry's Exposure/Defender takeaway lines remain identity-only (consent, credential additions, Okta registration), so the newest section carries no decision for the Kudu/peripheral-app exposure it introduces. Add a one-to-two sentence takeaway line to the section (Exposure: Azure App Service/SCM and forgotten partner portals; lever: restrict SCM, disable basic publishing auth, inventory peripheral apps)."
- code: F14
  category: quantifier-without-source
  section: headline / summary / record-summary
  item: "2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse"
  url_or_quote: "FBI: several actors run ARTEX against ten sectors, government among them"
  summary: "(low confidence) 'ten sectors' is a count of the FBI's list, not a number the FLASH states: 'across multiple sectors, including financial services, government, technology, defense, semiconductor, energy, healthcare, manufacturing, telecommunications, and legal industries.' The 'including' list is non-exhaustive, and Microsoft's 2026-10-21 post (cited on the same entry) names more (automotive, chemicals, media, military, software, think tanks). Appears in headline, summary and the record summary ('against ten sectors including government'). Fix: 'across sectors including government' or 'FBI lists ten sectors'."
- code: F11
  category: editorial-advisory
  section: techniques
  item: "2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse"
  url_or_quote: "Inside networks the agents ran iterative PowerShell enumeration scripts against domain controllers"
  summary: "Advisory: the section describes PowerShell-driven enumeration and the FLASH maps it to T1059.001 (Command and Scripting Interpreter: PowerShell), but techniques[] does not carry T1059.001. Also minor grouping imprecision: 'queried the cloud metadata service through XXE' sits in the 'Inside networks' sentence while the FLASH lists it under Privilege Escalation (cloud credential theft via an exposed application, not an in-network step)."
