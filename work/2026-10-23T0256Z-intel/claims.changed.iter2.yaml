claims:
  - claim_id: 876fb5446f
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "summary"
    kind: frontmatter
    text: "PK Softech AG, the software supplier of Publica and other Swiss pension funds, says unknown attackers used malware to reach part of its IT and that data must be assumed to have left; the Confederation headlined its 2026-10-08 release \"data outflow confirmed\", and the Federal Prosecutor's Office is investigating. Tamedia reports that PK Softech had confirmed in writing in January 2026 that it deleted Publica's 2019 migration data, which apparently stayed on its servers, and that Akira holds about 100 GB and demands ransom; Inside IT relays this and adds that the Federal Prosecutor's Office confirmed Akira took data, and Netzwoche relays that the authorities assume data on practically all current and former federal and federally affiliated staff left. Publica says personal data of insured persons has presumably left; the Pensionskasse Stadt Zürich says its insured persons' test data was stolen, the Pensionskasse Post says personal data left, the Bernische Pensionskasse says it must be assumed so, the Ticino fund IPCT says all its insured could potentially be involved, and other funds are still checking. No first-hand statement by the Confederation or Publica on the actor, the demand or the scope is available to cite."
  - claim_id: 49637d1430
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-23T03:40:13Z"
    kind: cited
    text: "Tamedia's Tages-Anzeiger reported on 2026-10-21 that PK Softech AG had confirmed in writing to Publica that it deleted the data, and that this apparently did not happen: its summary says the company reported in January that it had deleted the information on former Federal Councillors and agents, \"but this was false\" (translated from German;"
    urls: ["https://www.tagesanzeiger.ch/akira-hacker-erpressen-loesegeld-mit-publica-daten-654128340841"]
  - claim_id: 72c2dd6dd4
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-23T03:40:13Z"
    kind: cited
    text: "Inside IT, working from the Tamedia research, dates the written confirmation to January 2026 and says PK Softech confirmed it held no personal data in plaintext and had deleted the data of the 2019 migration, that Publica confirmed the sequence (after the Xplain case it asked the supplier to delete all legacy data, including that of the 2019 migration, and received written confirmation), that Publica is clarifying why personal data presumably lay on the servers regardless, and that PK Softech did not answer and does not comment on individual customer relationships ("
    urls: ["https://www.inside-it.ch/publica-wollte-pensionskassendaten-loeschen-lassen-20261022"]
  - claim_id: 23f7fc011b
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-23T03:40:13Z"
    kind: cited
    text: "This is the first reported statement by an authority on the actor, but it reaches the reader second-hand through the paywalled Tamedia article: no statement from the Federal Prosecutor's Office itself is available to cite, and Publica's own page, in its entry of 2026-10-20, still says it is clarifying whether data of Publica left and whose ("
    urls: ["https://www.publica.ch/de/cyberangriff-auf-softwarelieferanten"]
  - claim_id: 2dd8bdd0d7
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-23T03:40:13Z"
    kind: cited
    text: "TicinoNews adds, from its own information, that a folder labelled IPCT with the data of a few hundred insured persons was on the supplier's server, while IPCT, which has about 27,000 affiliated persons, says it has no certainty yet that data of its insured is involved ("
    urls: ["https://www.ticinonews.ch/ticino/hackeraggio-casse-pensioni-centinaia-di-ticinesi-a-rischio-445085"]
  - claim_id: 61089ac57a
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "record 2026-10-23T03:40:13Z"
    kind: record-summary
    text: "The supplier's written pledge to delete Publica's 2019 migration data was apparently not kept, Inside IT relays that the Federal Prosecutor's Office confirmed Akira exfiltrated data, though that is second-hand and no federal or Publica statement is available to cite, and the Ticino cantonal fund IPCT says all its insured could potentially be involved but has no evidence yet that data was taken."
  - claim_id: f6c73d271b
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "body"
    kind: cited
    text: "Products that embed PHP are affected through it: Palo Alto Networks lists every PAN-OS and Panorama release as affected, with PAN-OS hotfixes scheduled for 2026-10-26 to 2026-10-30 and no date for Panorama ("
    urls: ["https://security.paloaltonetworks.com/CVE-2026-109618"]
  - claim_id: fd6e958991
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "body"
    kind: cited
    text: "), and VulnCheck reproduced the flaws, says hundreds of proof-of-concept repositories have appeared, only a very small number legitimate, and says that as of 7 PM ET on 2026-10-22 it had identified at least one proof of concept that bypasses ASLR on x86-64 for a single PHP version, 8.4.26, with default heap configurations and does not work outside that setup; it reports that it holds a weaponized exploit for CVE-2026-109618, available to its customers, that chains a memory leak into code execution, was successful on x86-64 with ASLR enabled and display_errors off, the recommended production configuration, and as of 7 PM ET on 2026-10-22 supports PHP 8.4.10 to 8.4.26 without modification ("
    urls: ["https://www.vulncheck.com/blog/php2shell-vulnerabilities"]
  - claim_id: bc3f880b59
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "body"
    kind: cited
    text: "**Detection:** AWS, as relayed by Inside IT, advises an operator who cannot exclude a compromise to start the investigation at least from 2026-10-17, the date of its earliest honeypot exploit attempt ("
    urls: ["https://www.inside-it.ch/php-angriffe-schweiz-blieb-bis-anhin-verschont-20261022"]
  - claim_id: 1fc27b4acf
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "body"
    kind: cited
    text: "); the telemetry is, in web access logs, multipart POST requests to PHP endpoints from unfamiliar sources, including requests that exercise session upload progress, which VulnCheck's canaries saw used for the unsuccessful web-shell attempt ("
    urls: ["https://www.vulncheck.com/blog/php2shell-vulnerabilities"]
  - claim_id: 11f2d3ff6c
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "record 2026-10-23T03:45:21Z"
    kind: record-summary
    text: "BACS says it knows of no attack in Switzerland but that PHP applications of the federal administration were affected and that it has no complete overview of the update status; the host Cyon took more than 100,000 sites offline for hours, a UK minister reports 32 government services unavailable with no confirmed compromise, and AWS reports a first exploit attempt on 2026-10-17. Sansec and Red Hat judge exploitation harder than VulnCheck's exploit suggests, and Palo Alto now schedules PAN-OS hotfixes for 2026-10-26 to 2026-10-30."
  - claim_id: 1d03b20913
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "body"
    kind: cited
    text: "Chrome blocked the intermediates on 2026-10-17, Firefox through OneCRL the same day, Microsoft platforms on 2026-10-20 and Apple devices on 2026-10-22, and eMudhra revoked all eight ("
    urls: ["https://emudhra.we-have-a-problem.com/", "https://www.bleepingcomputer.com/news/security/mozilla-google-apple-block-compromised-emudhra-ca-certificates/"]
  - claim_id: 05e80a2382
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "body"
    kind: cited
    text: "**Exposure:** any software that keeps its own CA bundle or does not check revocation keeps trusting the intermediates until updated; the tracker lists fixed versions for Java, Python certifi, rustls-webpki, the curl CA bundle and several distributions' ca-certificates packages, and shows Node.js, Bun and FreeBSD as fixed and the Composer ca-bundle, Erlang certifi, Bottlerocket and Godot as still pending ("
    urls: ["https://emudhra.we-have-a-problem.com/"]
  - claim_id: 3ba3605167
    entry: 2026-10-22/pan-os-panorama-php2shell-mgmt-interface-no-fixed-release
    surface: "headline"
    kind: frontmatter
    text: "Palo Alto: PHP2Shell hits PAN-OS, Panorama and WF-500; PAN-OS hotfixes due 26 to 30 October, Panorama undated"
  - claim_id: 81ad637e36
    entry: 2026-10-22/pan-os-panorama-php2shell-mgmt-interface-no-fixed-release
    surface: "summary"
    kind: frontmatter
    text: "Palo Alto Networks' advisory of 2026-10-21, revised on 2026-10-23, lists every release of PAN-OS 12.2, 12.1, 11.2, 11.1 and 10.2, of Panorama and of the WildFire appliances WF-500 and WF-500-B as affected by the two PHP runtime flaws, CVE-2026-109618 and CVE-2026-109619; no fixed build is released, hotfixes for each PAN-OS train carry estimated dates from 2026-10-26 to 2026-10-30, and Panorama and WF-500 remain undated. Cortex XCORE (SaaS) and WildFire Cloud were already remediated. The PAN-OS exposure is the management web interface (the HTTPS web UI and the XML API service); Palo Alto scores the PAN-OS impact as availability only, CVSS-B 8.7 where management is reachable from the internet and 7.1 behind a jump box, against 9.2 for the PHP flaws themselves, and knows of no malicious exploitation against its products. GlobalProtect and the captive portal are not affected."
