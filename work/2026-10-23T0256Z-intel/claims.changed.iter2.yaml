    entry: 2026-10-23/fortinet-fortisandbox-fortisiem-pre-auth-critical-fixes
    surface: "summary"
    kind: frontmatter
    text: "Fortinet's PSIRT published two critical unauthenticated advisories on 2026-10-13: an authentication bypass in the FortiSandbox GUI (CVE-2026-107656, CVSS 3.1 9.6; fixed in 5.0.7 and 4.4.10) and a path traversal in the FortiSIEM phQueryMaster service that allows code execution (CVE-2026-106173, 9.4; FortiSIEM 7.5.0 only, fixed in 7.5.1, workaround: restrict tcp port 27918). Fortinet lists neither as known to be exploited. The FortiSandbox ranges include 5.0.6 and 4.4.9, the builds that fixed the three FortiSandbox flaws reported exploited in June, so a unit patched for those is still affected."
  - claim_id: d71008be93
