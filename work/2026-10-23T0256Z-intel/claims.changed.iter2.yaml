    entry: 2026-10-23/blackx-uefi-bootkit-baton-drop-revocation-default-off
    surface: "body"
    kind: cited
    text: "Kaspersky GReAT reports that in early 2026 it found BlackX, a UEFI bootkit similar to BlackLotus, used against diplomatic agencies in Tajikistan, Uzbekistan and Turkmenistan after the attackers held administrator privileges: an installer takes an RC4-encrypted package and its key as command-line arguments and drops files to the system and UEFI partitions that exploit Baton Drop (CVE-2022-21894) to enrol attacker-controlled Machine Owner Keys, so arbitrary EFI files load despite Secure Boot ("
    urls: ["https://securelist.com/uefi-bootkit-blackx/121539/"]
  - claim_id: cb74cfd2c7
    entry: 2026-10-23/blackx-uefi-bootkit-baton-drop-revocation-default-off
    surface: "body"
    kind: cited
    text: "Kaspersky ties the exploitation to Baton Drop alone; CVE-2023-24932, the flaw Microsoft's revocation guidance is titled for, appears in its post only as the one a UEFI component in ESET's FishMonger report might exploit ("
    urls: ["https://securelist.com/uefi-bootkit-blackx/121539/"]
  - claim_id: fbd1fba999
    entry: 2026-10-23/blackx-uefi-bootkit-baton-drop-revocation-default-off
    surface: "body"
    kind: cited
    text: "The bootkit injects a kernel driver, signed with a certificate its issuer has since revoked, that disables process, thread and registry callbacks and ETW providers of security products; the user-mode payloads were a RAT that uses Google Drive, OneDrive or Yandex.Disk for command and control and a sideloaded loader ("
    urls: ["https://securelist.com/uefi-bootkit-blackx/121539/"]
  - claim_id: 445e5ee89b
    entry: 2026-10-23/blackx-uefi-bootkit-baton-drop-revocation-default-off
    surface: "body"
    kind: cited
    text: "); Microsoft's own article says the mitigations in the updates of 2024-07-09 and later are not enabled by default and the Enforcement Phase date is still to be announced ("
    urls: ["https://support.microsoft.com/en-us/servicing/os/windows/2023/03/how-to-manage-the-windows-boot-manager-revocations-for-secure-boot-changes-associated-with-cve-2023"]
  - claim_id: a53b27c4b7
    entry: 2026-10-23/blackx-uefi-bootkit-baton-drop-revocation-default-off
    surface: "body"
    kind: cited
    text: "), and Kaspersky says that phase has not been implemented and the certificate's expiry on 2026-10-19 does not stop the vulnerable binaries loading unless it is on the forbidden list ("
    urls: ["https://securelist.com/uefi-bootkit-blackx/121539/"]
  - claim_id: 1028b9e885
    entry: 2026-10-23/blackx-uefi-bootkit-baton-drop-revocation-default-off
    surface: "body"
    kind: cited
    text: "Kaspersky attributes the campaign to APT41 with medium confidence, resting on the identifier \"xdd\" shared with a kernel implant in ESET's June 2026 FishMonger report, DLL sideloading and OLLVM ("
    urls: ["https://securelist.com/uefi-bootkit-blackx/121539/"]
  - claim_id: e3ffbf9780
    entry: 2026-10-23/blackx-uefi-bootkit-baton-drop-revocation-default-off
    surface: "body"
    kind: cited
    text: "**Exposure:** any Windows device that boots with Secure Boot, has the updates of 2024-07-09 or later and has not had the revocation steps applied; Microsoft's check is that the forbidden-list (DBX) variable contains Microsoft Windows Production PCA 2011, which a PowerShell test returns as True once the revocation is in ("
    urls: ["https://support.microsoft.com/en-us/servicing/os/windows/2023/03/how-to-manage-the-windows-boot-manager-revocations-for-secure-boot-changes-associated-with-cve-2023"]
  - claim_id: ea33d9341b
    entry: 2026-10-23/blackx-uefi-bootkit-baton-drop-revocation-default-off
    surface: "body"
    kind: cited
    text: "Because the driver disables security-product callbacks and ETW providers, quiet host telemetry after a reboot on a machine that ran the installer is not evidence that nothing ran, although Kaspersky found that the driver's tampering routines, written for Kaspersky and Avast products, failed to interfere with Kaspersky products ("
    urls: ["https://securelist.com/uefi-bootkit-blackx/121539/"]
  - claim_id: ef5471737e
    entry: 2026-10-23/blackx-uefi-bootkit-baton-drop-revocation-default-off
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** a patched Windows fleet is not protected against this class until the revocation is applied, so decide which devices get Microsoft's procedure and in what order; Microsoft warns that the revocation cannot be reverted while Secure Boot is in use, that BitLocker recovery keys should be backed up first, and that recovery and install media must be updated ("
    urls: ["https://support.microsoft.com/en-us/servicing/os/windows/2023/03/how-to-manage-the-windows-boot-manager-revocations-for-secure-boot-changes-associated-with-cve-2023"]
  - claim_id: 40a3e610f9
    entry: 2026-10-23/blackx-uefi-bootkit-baton-drop-revocation-default-off
    surface: "body"
    kind: uncited
    text: "The targeted machines were fully patched."
