    entry: 2026-10-23/fortinet-hardening-release-fortios-fortimanager-fortimail
    surface: "summary"
    kind: frontmatter
    text: "Fortinet announced on 2026-10-21 a coordinated release of critical and high-severity fixes for FortiOS, FortiManager and FortiAnalyzer (scheduled for 2026-10-22, after recent FortiMail and FortiAuthenticator releases), found through its AI-assisted testing, and urges every customer to upgrade at once, internet-facing devices first. The CVE advisories follow only on 2026-11-10, so there are no identifiers to triage by; NCSC.ch lists the exploitation status as unknown, and the FortiMail builds are the ones that already fix CVE-2026-104286, which Fortinet reports as exploited."
