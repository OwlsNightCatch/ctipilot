- code: F3
  category: claim-not-supported
  section: updates
  item: "2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow, ## Update — 2026-10-22T03:47:53Z, closing sentence"
  url_or_quote: "This is one chain of reporting from unnamed sources, and the article quotes no confirmation of the actor, the ransom demand or the scope from the Confederation, Publica or PK Softech ([Netzwoche, 2026-10-21](https://www.netzwoche.ch/news/2026-10-08/bundespensionskasse-publica-meldet-datenabfluss))"
  summary: "(low confidence) The second half is right (Netzwoche relays the Tages-Anzeiger and quotes no Confederation, Publica or PK Softech confirmation), but the clause 'from unnamed sources' is not on the cited Netzwoche page: it attributes each statement to the named paper ('laut Tages-Anzeiger', 'dem Bericht zufolge', 'Der Bundesrat und die Sicherheitsbehörden gehen inzwischen davon aus') and says nothing about unnamed sources. Inside IT 2026-10-20 ('Nach Einschätzung involvierter Bundesstellen', 'Einer internen Einschätzung zufolge, auf die sich der Bericht stützt') would support the characterisation. Add that citation or drop 'from unnamed sources'."
