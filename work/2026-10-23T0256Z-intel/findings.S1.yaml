  summary: 'ISC''s advisories of 2026-10-21 fix three BIND 9 flaws. CVE-2026-94300 (CVSS 3.1 8.1, AV:N/AC:H/PR:N): an attacker who can capture a previously signed GSS-TSIG UDP message can replay it while the negotiated TSIG key is still valid and, by also sending crafted queries to a zone the attacker controls, corrupt memory in named, causing an abort and potentially remote code execution. The affected ranges are BIND 9.11.0 to 9.18.50, 9.20.0 to 9.20.29 and 9.21.0 to 9.21.26 plus the Supported Preview Edition equivalents; the advisories list fixed builds only for 9.20.30, 9.21.27 and 9.20.30-S1 (no 9.18 fix is listed), offer no workaround and say ISC knows of no active exploits. CVE-2026-96888 (7.5): a resolver configured with a redirect zone and qname-minimization strict can abort on an assertion. CVE-2026-97313 (7.5): a recursive server with at least two RPZ zones, one recursive-only yes and one no, aborts when an RD=1 query is followed by an RD=0 query. ISC found CVE-2026-94300 in internal
    testing and credits Dave Aitel of OpenAI with an independent report.'
