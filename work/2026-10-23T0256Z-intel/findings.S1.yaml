candidate_sources:
- id: arista-security-advisories
  publisher: Arista Networks Security Advisories (incl. VeloCloud Orchestrator)
  url: https://www.arista.com/en/support/advisories-notices/security-advisory
  category: vendor-psirt
  why: First-party PSIRT for the VeloCloud Orchestrator line, which has now had three vendor-confirmed exploited flaws in 2026 (CVE-2026-16812, CVE-2026-93952, CVE-2026-114625); pages read cleanly through extract and each advisory has a CSAF at arista.com/assets/data/SecurityAdvisories/CSAF/arista_networks_security_advisory_<n>_CSAF.json.
- id: isc-bind-security-matrix
  publisher: ISC Knowledgebase, BIND 9 security vulnerability matrix and advisories
  url: https://kb.isc.org/docs/aa-00913
  category: vendor-psirt
  why: Primary for BIND advisories (DNS infrastructure of administrations); kb.isc.org/v1/docs/<cve-id> reads through extract with severity, exploitability, versions and the 'Active exploits' field; CERT-FR, BSI and CCCS relay it a day later.
coverage_gaps:
- source_id: connectwise-trust-center
  reason: 403 on every transport incl. WebFetch and the jina reader, for the listing and individual bulletin pages; ConnectWise coverage depends on WebSearch and the CCCS feed. Keep it in TRANSPORT_BLOCKED_UNREACHABLE.
- source_id: cisa-advisories
  reason: 'recipe: all.xml feed returns HTTP 403 on the bridge and the jina reader returns no items; WebFetch of /news-events/cybersecurity-advisories returns the 10 newest items with titles, dates and hrefs, and `cisa csaf-recent` plus the raw GitHub CSAF URLs read the ICS advisories in full.'
- source_id: hpe-networking-psirt (candidate, outside slice)
  reason: 'recipe: support.hpe.com docDisplay is a JS shell (extract returns the SPA, WebFetch returns empty, the jina reader reads it); the CSAF at https://csaf.arubanetworking.hpe.com/2026/hpe_networking_-_hpesbnw05162.json reads over `url --direct` and carries every CVE with CVSS vector and fixed versions. The 2026-10-22 bulletin HPESBNW05162 appeared in ENISA EUVD first (38 rows, ''No description provided'').'
- source_id: chromereleases.googleblog.com (not a source record)
  reason: feed URLs (feeds/posts/default, atom.xml) answer 302 and the bridge feed fails; `url --direct https://chromereleases.googleblog.com/` returns the HTML listing and `extract` reads each post.
- source_id: watchtowr
