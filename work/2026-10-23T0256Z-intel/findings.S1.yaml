  summary: Arista's Security Advisory 0199 (initial release 2026-10-22) covers CVE-2026-114625 in on-premises VeloCloud Orchestrator (CVSS 3.1 9.9, CVSS 4.0 9.4, CWE-89 SQL injection). On an affected system any authenticated user can gain operator privileges and masquerade as a local superuser operator, reaching functionality meant for internal use only; the minimum role Arista names is Enterprise Read Only, the lowest built-in tenant role, the VCO web interface is exposed by default, and no configuration prevents the exposure. Arista states the issue was detected by Arista and is known to be actively exploited, and names no actor, victim count or start date. Affected releases are VCO 5.2.x before 5.2.3.18, 6.1.x before 6.1.3.10 and 6.4.x before 6.4.2.12 (end-of-support releases were not assessed); hosted and dedicated VCO were already patched, and VeloCloud Gateway and Edge are not affected. Arista's interim guidance is to restrict the VCO web interface to trusted administrative networks,
    watch for unexpected outbound traffic from the VCO host, block unneeded outbound ports and hunt for backdoor daemons and web shells. It is the third exploited VCO flaw this year after CVE-2026-16812 (July) and CVE-2026-93952 (September), and CISA's KEV catalogue (version 2026.10.21) did not list it when fetched.
