  summary: BSI's CERT-Bund records CVE-2026-89035 for MikroTik RouterOS <= 7.24.5 as a remotely exploitable security-bypass flaw with no patch (it carries the unpatched marker). The CVE record (NVD, relayed by the GitHub advisory database, unreviewed, rated Critical) says the WebFig interface generates session tokens in makeSessionKey() in libucrypto.so with fixed salts that do not bind channel or session context, and the user service validates tokens against the login store without checking channel context, so replaying a captured token across a new ECDH session bypasses authentication and gives persistent administrative access until the token store is cleared. The record says it extends CVE-2025-61481, which described the underlying cleartext WebFig exposure without a fix. No MikroTik advisory, researcher write-up or exploitation report was found, so this rests on the CVE record and BSI's classification.
