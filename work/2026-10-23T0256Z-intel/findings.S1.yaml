  summary: 'HPE Networking''s bulletin HPESBNW05162 (initial release 2026-10-22 16:00 UTC per its CSAF) fixes 72 CVEs in the wireless operating systems AOS-8 and AOS-10 for Mobility Conductors, Controllers, Gateways and access points (AOS-AP and AOS-8 Instant). 34 score 9.0 or higher (CVSS 3.1): eight are 10.0 (unauthenticated authentication bypass or command injection, buffer-overflow and SQL-injection paths to code execution, in AOS-10 and AOS-8), ten more are unauthenticated and network-reachable at 9.8, including AOS-8 PAPI buffer overflows on UDP port 8211, an AOS-8 SSH daemon authentication bypass and command injection in the AOS-10 PAPI protocol, and 16 more sit at 9.3 to 9.6, 15 of them adjacent-network (AV:A) flaws, mostly unauthenticated or authentication bypasses, and one a network-reachable unauthenticated buffer overflow at 9.4. HPE says the flaws were found largely by its internal security research, that it is not aware of any public discussion or exploit code, and that some
    critical rows require certain preconditions outside the attacker''s control, which it does not itemise. Fixed builds are AOS-10.8.1.2, 10.7.2.7 and 10.4.1.14 and AOS-8.13.3.1 and 8.10.0.24; the affected ranges are AOS-10 10.3.0.0 to 10.4.1.13, 10.6.0.0 to 10.7.2.6 and 10.8.0.0 to 10.8.1.1, and AOS-8 8.12.0.0 to 8.13.3.0 and 8.10.0.0 to 8.10.0.23. HPE''s only workaround is to restrict the CLI and web management interfaces to a dedicated layer 2 segment or VLAN and to control them with firewall policy at layer 3 and above.'
