  extended_notes: 'Exposure: any on-prem VCO on 5.2.x < 5.2.3.18, 6.1.x < 6.1.3.10 or 6.4.x < 6.4.2.12; reachability of the VCO web interface plus any tenant login (lowest role suffices) is the whole prerequisite, so customer-tenant accounts count. Detection (Arista): VCO web access logs for unusual URL-like path components, encoded characters, references to local or internal services and high request rates; unexpected outbound traffic from the VCO host; backdoor daemons and web shells; recent administrator activity. Post-patch: Arista says to preserve web, application, system and database logs and file-system timestamps before remediation where feasible; patching does not remove a foothold. Triage (follows from the stated mechanism): a session authenticated as Enterprise Read Only that performs operator-level or internal-only calls is the discriminator, legitimate operators act from their own accounts. Arista''s advisory lists attacker source addresses (not reproduced here, IOC). Related
    store entries: 2026-09-23/cve-2026-93952-arista-velocloud-orchestrator-exploited, 2026-07-28/cve-2026-16812-arista-velocloud-orchestrator-exploited.'
