  summary: 'Splunk''s scheduled October bulletin of 2026-10-21 ships Splunk Enterprise 10.4.4, 10.2.8, 10.0.11 and 9.4.16 and Splunk SOAR 8.7.0. The Security Hardening advisories group internally found flaws by weakness class under one CVE each: Enterprise CVE-2026-76299 (improper access control) and CVE-2026-76302 (improper neutralization) are both 9.9, and SOAR CVE-2026-76531 is 9.9 and CVE-2026-76407 9.3; Splunk publishes no vectors, prerequisites or per-flaw detail for these groups, so whether they need a login is not stated. The itemised Enterprise advisory tops out at 8.8: CVE-2026-76298 lets a user who lacks the admin and power roles derive the PostgreSQL sidecar superuser password from the search head cluster identifier that appears in search job logs and run operating-system commands as the Splunk account on search head cluster members (affects 10.4 and 10.2 before 10.4.4 and 10.2.8; workaround: disable the postgres sidecar in server.conf unless Edge Processor, OpAmp or SPL2 pipelines
    are used), CVE-2026-76291 lets a role with schedule_search bypass SPL safeguards, and two unauthenticated denial-of-service flaws score 7.5 (CVE-2026-76288 in Splunk Web header parsing, CVE-2026-76290 in the Edge Processor package download). Splunk''s separate PHP2Shell notice (SVD-2026-1013, 2026-10-22) lists no Splunk product as affected, with OnCall, AppDynamics SaaS and Smartlook still under investigation. The advisories carry no exploitation statement.'
