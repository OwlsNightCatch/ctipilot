  summary: 'YOOtheme released YOOtheme Pro 5.0.53 on 2026-10-21 after a customer pre-announcement the day before; its changelog lists CVE-2026-102785, "Fix unauthenticated remote code execution via image handler", for every Pro 5 build from 5.0.0 to 5.0.52 (Pro 4 and earlier are not affected). The CNA record (Joomla, CVSS 4.0 10.0) describes the mechanism: the public image-transformation handler incompletely binds the normalised image operations and the output destination to the request signature, so an unauthenticated attacker can reuse a signature disclosed in a legitimate public image URL, inject additional image operations, traverse out of the cache directory and write a PNG/PHP polyglot to an executable public media directory. mySites.guru, which diffed the 5.0.52 and 5.0.53 packages, confirms the handler now limits operations to a fixed list and checks the cache file name against the signed URL. No source fetched reports exploitation (the CNA vector carries the exploit-maturity metric
    E:A without further explanation). The changelog entry has no platform label while neighbouring entries are labelled Joomla or WordPress, so it appears to cover both builds; the CNA record and mySites.guru describe the Joomla extension.'
