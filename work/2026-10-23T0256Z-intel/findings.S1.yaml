  extended_notes: 'Exposure: HPE says any hardware, mobility solution (conductor, controller, gateway), access point or VM compatible with an affected version is vulnerable, and its hardware list is illustrative only; the management plane (CLI, web UI) and PAPI (UDP 8211, the AP management protocol) are the named surfaces, and adjacent-network rows imply layer 2 or radio proximity. Detection: HPE supplies none; concept: management-plane access and accounting logs for logins from outside the management VLAN, and flow telemetry for PAPI UDP 8211 or controller management ports reachable from user or guest segments. HPE states no exploitation, so no post-compromise check is defined. Bulletin counts (from the CSAF, all CVSS 3.1): 72 CVEs; 8 at 10.0; 10 at 9.8; 11 at 9.6; 1 at 9.4; 4 at 9.3. The store already carries 2026-08-06/hpe-aruba-sd-wan-orchestrator-rest-api-auth-bypass (different product). The HPE support page is a JS shell; the CSAF at csaf.arubanetworking.hpe.com reads over plain url
