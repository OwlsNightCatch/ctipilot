  summary: "(low confidence) 'the supplier, PK Softech AG of Reinach (BL), says unknown persons used malware...' is cited to the PK Softech notice, which does not name Reinach or Basel-Landschaft (it says only 'Ende September 2026 wurde die PK Softech AG Opfer eines Cyberangriffs'). 'Reinach BL' is in watson.ch ('PK Softech AG in Reinach BL') and the NZZ, not on the cited page. Cite watson.ch for the location or drop it."
- code: F14
  category: quantifier-without-source
  section: incident
  item: "2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow, ## Update 2026-10-23 paragraph 2 (claim 23f7fc011b)"
  url_or_quote: "This is the first reported statement by an authority on the actor, but it reaches the reader second-hand through the paywalled Tamedia article"
  summary: "'first' is supported by no cited source (the clause terminates on Publica's page, which says only 'Abklaerungen dauern noch an') and the entry's own '## Update 2026-10-21' already reports 'the involved federal bodies assume Akira is responsible' (Inside IT 2026-10-20: 'gehen die involvierten Bundesstellen davon aus, dass die Ransomware-Bande Akira fuer den Angriff verantwortlich ist'). Say 'a reported confirmation by the Federal Prosecutor's Office' or drop 'first'."
- code: F3
  category: claim-not-supported
  section: vulnerability
  item: "2026-10-22/pan-os-panorama-php2shell-mgmt-interface-no-fixed-release, body paragraph 2 and Detection (claims 9b083a871e, 59279b1b66)"
  url_or_quote: "protects only management traffic routed through a dataplane interface, sent to a replaced inbound-management certificate, decrypted so the firewall can inspect it, and covered by threat prevention ... where the signatures are active and the four conditions hold"
  summary: "(low confidence) The advisory lists three conditions for the Threat IDs ('Route incoming traffic for the MGT port through a DP port', 'Replace the Certificate for Inbound Traffic Management', 'Enable threat prevention on the inbound traffic to management services'); neither it nor the Unit 42 brief contains 'decrypt' or 'inspect'. The fourth condition and 'four conditions' are the entry's inference, cited as Palo Alto's statement. State three conditions or label the decryption point as an inference."
- code: F3
  category: claim-not-supported
  section: vulnerability
  item: "2026-10-23/fortinet-fortisandbox-fortisiem-pre-auth-critical-fixes, Defender takeaway and actions[0] (claims 327482c0e0, d71008be93)"
  url_or_quote: "until then keep the FortiSandbox GUI on an administrator network and allow tcp 27918 only from the deployment's own nodes"
  summary: "(low confidence) Cited to FG-IR-26-185 and FG-IR-26-180. FG-IR-26-185 lists no workaround at all, and FG-IR-26-180 says only 'Restricting access on tcp port 27918 prevents the issue.' Neither page says to keep the FortiSandbox GUI on an administrator network or that the port is for 'the deployment's own nodes'. Attribute only the Fortinet workaround to Fortinet and mark the rest as the entry's own recommendation."
- code: F4
