  section: run-record
  item: "runs/2026-10-23/2026-10-23T0256Z-intel.md frontmatter and notes"
  url_or_quote: "entries_dropped_by_verification: 0"
  summary: "(low confidence) The notes say the YOOtheme entry was 'written, then cut at verification iteration 1' and the delta file says the file was removed, yet the counter is 0. Also 'completed: 2026-10-23T03:49:54Z' precedes the discovered_at (04:25:40Z) of the FortiSandbox/FortiSIEM entry added in remediation. Align the counter (1) and the completion stamp with what shipped."
- code: F9
  category: surface-contradiction
  section: incident
  item: "2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow, main analysis paragraph 1 vs ## Update 2026-10-23"
  url_or_quote: "neither the Confederation nor Publica has confirmed the perpetrator or the demand"
  summary: "(low confidence) The main analysis states this in the present tense with no date, while the newest section reports (second-hand) that 'the Federal Prosecutor's Office confirmed that data was extracted by the Akira ransomware group'. The summary was reworded and dated; this sentence was not. Date it ('as of 2026-10-20') or add the relayed Prosecutor's Office statement."
- code: F9
  category: surface-contradiction
  section: vulnerability
  item: "2026-10-23/cve-2026-114625-arista-velocloud-orchestrator-sqli-exploited, cves[].type and body"
  url_or_quote: "https://www.arista.com/assets/data/SecurityAdvisories/CSAF/arista_networks_security_advisory_199_CSAF.json"
  summary: "(low confidence) The advisory page says CWE-89 SQL injection leading to operator privileges ('access to functionality that is intended for internal use only'), while the CSAF cited by the entry carries 'CVE Description : VeloCloud Orchestrator Remote Code Execution (VCO RCE)'. The entry cites the CSAF only for the score and interim measures and classes the flaw as sqli without noting the vendor's own RCE label. Add a Contradiction line."
- code: F8
  category: needs-more-research
  section: incident
  item: "2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates, cves[CVE-2026-91403].fixed and Update section"
  url_or_quote: "fixed: \"the Java updates of Oracle's Security Alert and the OpenJDK advisory of 2026-10-21; ...\""
  summary: "(low confidence) The cited tracker lists the fixed Java builds ('Java | 27.0.1.0.2, 25.0.5.0.2, 21.0.13.0.2, 17.0.21.0.2, 11.0.33.0.2, 8u511') while Oracle's alert lists 27.0.1, 25.0.5, 21.0.13, 17.0.21, 11.0.33 and 8u511 as the affected versions. Without the build identifiers a responder cannot tell a fixed 21.0.13.0.2 from an affected 21.0.13, and the tracker's 8u511 as fixed against Oracle's 8u511 as affected is unreconciled. Add the fixed builds and a clarifying line."
