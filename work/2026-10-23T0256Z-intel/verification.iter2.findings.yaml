  section: threat
  item: "2026-10-23/blackx-uefi-bootkit-baton-drop-revocation-default-off, cves[CVE-2023-24932].status (claim e47b726190)"
  url_or_quote: "status: [exploited, patch-available]"
  summary: "(low confidence) Frontmatter marks CVE-2023-24932 exploited, but the body (correctly) says 'Kaspersky ties the exploitation to Baton Drop alone; CVE-2023-24932 ... appears in its post only as the one a UEFI component in ESET's FishMonger report might exploit'. Securelist: 'the possible use of an unspecified UEFI bootkit component, which might exploit CVE-2023-24932'. Microsoft's KB ties CVE-2023-24932 to BlackLotus, not to BlackX. Drop 'exploited' for that record or state the Microsoft/BlackLotus basis in the body."
