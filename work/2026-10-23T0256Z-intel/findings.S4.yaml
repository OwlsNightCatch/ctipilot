  extended_notes: 'Delta against the entry''s current text: (1) the entry says neither the Confederation
    nor Publica has confirmed the actor or the demand; Inside IT now reports a Federal Prosecutor''s Office
    confirmation via Tamedia, while Publica''s own page (Stand 20.10.2026) still says clarification of
    whether Publica data left, and from whom, continues, so the confirmation is reported but not first-hand.
    (2) New root-cause element: a written deletion assurance from the supplier (2026-01) that did not
    match reality, after Publica had asked for deletion as a consequence of the 2023 Xplain case; Osaka
    University''s NEC case (separate item in this return) shows the same pattern of retained data and
    an undisclosed sub-contractor. (3) The Ticino cantonal fund IPCT is a new customer-side statement
    (the entry says the Ticino fund ''has made no statement''). Defender angle for the entry: a supplier''s
    deletion confirmation is a claim, not evidence; bodies that handed production, test or migration data
    to PK Softech (the City of Zurich fund says its test data was stolen) should ask in writing what the
    supplier still holds, with an inventory, and whether sub-contractors had access. The Tamedia article
    is paywalled; only the lede, the three summary bullets and the headline were read.'
