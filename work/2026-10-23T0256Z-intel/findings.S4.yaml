  summary: Railway, a developer platform with about 4.8 million users per BleepingComputer, disclosed
    on 2026-10-21 that it detected anomalous activity involving the systems that store customer environment
    variables and that an unauthorized third party may have accessed encrypted variables and, for some,
    obtained the decrypted contents; such variables hold API keys and database and registry credentials.
    Railway says its first analysis points to a subset of users but tells all users to roll every environment
    variable and private registry credential and to review the logs of those services; it paused deployments,
    restored builds in stages, rotated its bucket credentials and invalidated its API tokens (per The
    Hacker News quoting Railway). Railway says it believes the incident is part of a series of attacks
    recently targeting platform companies with the aim of compromising AI inference providers, and that
    it told those upstream providers to revoke keys; it has named no access vector, no actor and no count
    of affected users. The researcher Taylor Monahan, quoted by The Hacker News, reports that cryptocurrency
    wallets whose private keys were stored on Railway were drained, the first transaction at 7:36 p.m.
    (time zone not stated) at least two hours before the disclosure, which Railway has not confirmed.
    TechCrunch notes that the open-source AI coding tool OpenCode said on Saturday 2026-10-17 that attackers
    had broken in overnight and affected 1.4% of its Console users, whose stored API keys were abused,
    which OpenCode called a distillation attack; no source ties the two beyond Railway's own 'series'
    remark. Railway's status page says a preliminary incident report is due around midday US Eastern time
    on 2026-10-23, after this window.
