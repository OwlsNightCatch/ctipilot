  extended_notes: 'Exposure: anyone who deploys on Railway, including suppliers of Swiss public bodies
    that host web applications, bots or AI gateways there; the secrets at risk are API keys (AI providers,
    cloud, payment), database URLs and private-registry credentials. Railway says all users should rotate.
