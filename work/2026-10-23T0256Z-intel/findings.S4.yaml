  extended_notes: 'Exposure: any police, school or emergency-service body that outsources anonymous tip
    or report intake to a US SaaS where reporters can type free text; check what the contract says about
    retention of closed cases, redaction at ingestion, MFA on every customer-side operator account, tenant
    isolation and breach-reporting duty. No Swiss customer of P3 appears in any source read. Detection:
    the only access detail is a stolen customer-account login, so the hooks are the vendor portal''s authentication
    and audit logs (logins from new networks or countries, session creation without MFA, bulk export or
    API use by operator accounts) that the customer can ask the vendor to share. Takeaway: Navigate360''s
    assurances (2026-03-25 ''safe and fully operational''; April ''Toronto data not taken'') were contradicted
    by later disclosure, so a vendor statement of scope is a claim to be tested; plan a non-anonymous
    fallback channel and a public statement before the next vendor incident. SAN''s March figures (8.3
    million records, federal customers) come from the hacker-supplied cache and Navigate360 never confirmed
    them; the WebFetch summary of the SAN page was used only for that scope claim. Recency: CBC''s main
    story is dated 2026-10-21 (before the 26 h window) but the Toronto pause, the Ontario police suspensions
    and The Record''s report fall inside it.'
