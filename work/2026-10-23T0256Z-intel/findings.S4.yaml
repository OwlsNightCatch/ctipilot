  summary: 'Tamedia''s Tages-Anzeiger reports on 2026-10-21 (paywalled) that PK Softech AG had confirmed
    in writing to Publica in January 2026 that it had deleted the data from the 2019 migration and held
    no plaintext personal data, and its subtitle says the supplier had reported in January that it deleted
    the information on former Federal Councillors and agents, ''but this was false'', with the lede adding
    that the deletion apparently did not happen. Inside IT (2026-10-22, citing Tamedia) adds that Publica
    confirmed the sequence: after the Xplain case it had asked PK Softech to delete all legacy data including
    the 2019 migration data and received the written confirmation; Publica is now clarifying why personal
    data presumably still lay on the servers, and PK Softech did not answer, saying it does not comment
    on individual customer relationships. Inside IT, relaying Tamedia, says the Federal Prosecutor''s
    Office confirmed that data was exfiltrated by the Akira ransomware group, which still threatens to
    publish or sell it, and 20 Minuten writes that according to findings so far Akira stole the data and
    threatens to publish or sell it; the prosecutors'' statement is second-hand (not read first-hand)
    and sits against Publica''s own page, which on 2026-10-20 still says it is clarifying whether Publica
    data left and from whom. Separately, the Ticino cantonal fund IPCT (teachers, administrative staff,
    state councillors, police and judges; about 17,000 active and 10,000 pensioners) said on 2026-10-20
    through Corriere del Ticino, relayed by tio.ch, that potentially all its insured could be involved
    but that there is no evidence yet that their data was taken, and that it has filed a complaint with
    the Federal Prosecutor''s Office; Frontaliere Ticino (2026-10-21) adds that a folder labelled IPCT
    with data of a few hundred insured was found on the supplier''s server and that a letter to the insured
    is planned. Publica''s page of 2026-10-22 also says that publica.ch itself was offline on the afternoon
    of 2026-10-21 as a precaution against the PHP flaws, unrelated to the supplier attack. The IPCT sources
    are older than the 26 h window and were not in the store.'
