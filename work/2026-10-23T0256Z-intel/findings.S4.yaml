  summary: P3 Global Intel, the tip-management platform of Navigate360 that Crime Stoppers programmes,
    police agencies, schools and US federal bodies use, was breached in March 2026; the hacktivist collective
    Internet Yiff Machine claimed the theft, said it wanted to disprove P3's 'anonymous' and 'secure'
    marketing, and passed a copy to Distributed Denial of Secrets. Navigate360 told Toronto Crime Stoppers
    on 2026-03-25 that someone accessed P3 using a customer account's stolen login (Toronto Crime Stoppers'
    timeline), the only access detail public; the March reporting by Straight Arrow News described about
    8.3 million records from 1987 to 2025 with mostly US customers, a scope Navigate360 has not confirmed.
    On 2026-10-21 CBC reported, from its own analysis of the data, that more than 1.5 million tips sent
    to Canadian Crime Stoppers programmes over 25 years were taken, that more than 850,000 of them contain
    personal information of tipsters, people named in tips, staff or police, that in over 4,300 reports
    tipsters gave their full name, and that tips staff had flagged as self-identified still sat unredacted
    in a database that kept decades of closed tips. Toronto Crime Stoppers says Navigate360 first said
    no Canadian data was affected, then not Toronto's, and only in July supplied tip IDs and in autumn
    a list of 14,973 names without saying whether they belong to tipsters or suspects, and has never supplied
    the tip texts; it paused its programme on 2026-10-21, and by 2026-10-22 at least six Ontario police
    units had suspended their use of the Crime Stoppers programme. The RCMP says it was told in May that
    Canadian data was affected but held no personal information of persons who reported; someone purporting
    to represent the claimed actor told CBC in September that no copy had reached the public and that
    the platform is still vulnerable, which is unverified.
