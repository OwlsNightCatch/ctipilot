    surface: "body"
    kind: cited
    text: "Inside IT, citing Tamedia, adds that the Federal Prosecutor's Office confirmed that data was extracted by the Akira ransomware group, which 20 Minuten words as according to findings so far; the statement is second-hand and Publica's own page of 2026-10-20 still says it is clarifying whether and whose Publica data left ("
    urls: ["https://www.inside-it.ch/publica-wollte-pensionskassendaten-loeschen-lassen-20261022", "https://www.20min.ch/story/daten-gau-trotz-loeschbestaetigung-bundesdaten-landeten-bei-hackern-103653740", "https://www.publica.ch/de/cyberangriff-auf-softwarelieferanten"]
