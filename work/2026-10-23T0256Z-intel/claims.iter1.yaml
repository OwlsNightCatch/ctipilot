    entry: 2026-10-22/cve-2026-76466-cisco-expressway-cluster-unauth-root-rce
    surface: "summary"
    kind: frontmatter
    text: "Cisco's disclosure of 2026-10-21 fixes CVE-2026-76466 (CVSS 3.1 9.8), which lets an unauthenticated attacker who holds persistent cookies run operating-system commands as root on Expressway-C and Expressway-E that are configured in a cluster; X15.5.3 and earlier get X15.5.20, X14 and earlier must migrate, and there is no workaround. Cisco's PHP2Shell advisory also lists Expressway as affected by CVE-2026-109618 and CVE-2026-109619, with fixed release 15.5.21 and no date, so X15.5.20 is not the last upgrade. Hardening releases ship the same day for the Unified CM family and Unity Connection (up to 9.8, fixed in 15SU5), and for Snort 3 in Secure Firewall Threat Defense and related products (9.0); Cisco knows of no malicious use of any of them."
  - claim_id: f2a616dd56
    entry: 2026-10-22/cve-2026-76466-cisco-expressway-cluster-unauth-root-rce
    surface: "actions[0]"
    kind: frontmatter
    text: "On every Cisco Expressway-C and Expressway-E, upgrade to X15.5.20, clustered units first because only they carry the unauthenticated root flaw, plan the migration of any unit still on X14 or earlier, which has no fix and no workaround, and expect a further upgrade to 15.5.21 for the PHP2Shell flaws once Cisco dates it."
