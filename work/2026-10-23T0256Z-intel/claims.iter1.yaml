    surface: "body"
    kind: cited
    text: "A standalone Expressway is outside the vulnerable-product statement for CVE-2026-76466 ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-vcs-static-cred-hr7EWZ8t"]
  - claim_id: 402b9de321
