    entry: 2026-10-23/blackx-uefi-bootkit-baton-drop-revocation-default-off
    surface: "headline"
    kind: frontmatter
    text: "Kaspersky: a UEFI bootkit ran on fully patched Windows because Microsoft's Secure Boot revocation is off by default"
  - claim_id: b896772fb3
    entry: 2026-10-23/blackx-uefi-bootkit-baton-drop-revocation-default-off
    surface: "summary"
    kind: frontmatter
    text: "Kaspersky GReAT reports BlackX, a UEFI bootkit similar to BlackLotus that exploits Baton Drop (CVE-2022-21894) to enrol attacker keys and load a kernel driver that blinds security products, installed after attackers held administrator rights on networks of diplomatic agencies in Tajikistan, Uzbekistan and Turkmenistan; Kaspersky attributes it to APT41 with medium confidence. The targeted machines were fully patched, because Microsoft's fix revokes the old boot-manager certificate only when an administrator sets a registry flag and runs a scheduled task."
  - claim_id: a64a287bb7
    entry: 2026-10-23/blackx-uefi-bootkit-baton-drop-revocation-default-off
    surface: "cves[CVE-2022-21894]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2022-21894\", \"cvss\": null, \"status\": [\"exploited\", \"patch-available\"], \"affected\": \"Windows devices that boot with Secure Boot and have not had the Windows Production PCA 2011 revocation applied; Microsoft's mitigations are in the updates of 2024-07-09 and later and are not enabled by default\", \"fixed\": \"mitigation only when the revocation steps in Microsoft's KB5025885 are applied\", \"auth\": \"admin-required\", \"vector\": \"local\"}"
  - claim_id: e47b726190
    entry: 2026-10-23/blackx-uefi-bootkit-baton-drop-revocation-default-off
    surface: "cves[CVE-2023-24932]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2023-24932\", \"cvss\": null, \"status\": [\"exploited\", \"patch-available\"], \"affected\": \"Windows devices that boot with Secure Boot and have not had the Windows Production PCA 2011 revocation applied; Microsoft's mitigations are in the updates of 2024-07-09 and later and are not enabled by default\", \"fixed\": \"mitigation only when the revocation steps in Microsoft's KB5025885 are applied\", \"auth\": \"admin-required\", \"vector\": \"local\"}"
  - claim_id: 4be5deac46
    entry: 2026-10-23/blackx-uefi-bootkit-baton-drop-revocation-default-off
    surface: "body"
    kind: cited
    text: "Kaspersky GReAT reports that in early 2026 it found BlackX, a UEFI bootkit similar to BlackLotus, used against diplomatic agencies in Tajikistan, Uzbekistan and Turkmenistan and deployed after the attackers held administrator privileges on the networks: an installer takes an RC4-encrypted package and its key as command-line arguments and drops files to the system and UEFI partitions that exploit Baton Drop (CVE-2022-21894) to enrol attacker-controlled Machine Owner Keys, so arbitrary EFI files load despite Secure Boot ("
    urls: ["https://securelist.com/uefi-bootkit-blackx/121539/"]
  - claim_id: ea8be33842
    entry: 2026-10-23/blackx-uefi-bootkit-baton-drop-revocation-default-off
    surface: "body"
    kind: cited
    text: "The bootkit injects a kernel driver, signed with a certificate its issuer has since revoked, that disables process, thread and registry callbacks and ETW providers of security products; the user-mode payloads were a RAT that uses Google Drive, OneDrive or Yandex.Disk for command and control and a DLL-sideloaded loader ("
    urls: ["https://securelist.com/uefi-bootkit-blackx/121539/"]
  - claim_id: e30502a037
    entry: 2026-10-23/blackx-uefi-bootkit-baton-drop-revocation-default-off
    surface: "body"
    kind: cited
    text: "Microsoft's fix revokes the Windows Production PCA 2011 certificate only when an administrator sets a Secure Boot registry flag and runs the Secure-Boot-Update scheduled task ("
    urls: ["https://securelist.com/uefi-bootkit-blackx/121539/"]
  - claim_id: 86ed485d2b
    entry: 2026-10-23/blackx-uefi-bootkit-baton-drop-revocation-default-off
    surface: "body"
    kind: cited
    text: "); Microsoft's own article says the mitigations are in the updates of 2024-07-09 and later but are not enabled by default and that the date of the Enforcement Phase will be announced later ("
    urls: ["https://support.microsoft.com/en-us/servicing/os/windows/2023/03/how-to-manage-the-windows-boot-manager-revocations-for-secure-boot-changes-associated-with-cve-2023"]
  - claim_id: cf7e0da048
    entry: 2026-10-23/blackx-uefi-bootkit-baton-drop-revocation-default-off
    surface: "body"
    kind: cited
    text: "), and Kaspersky says that phase has not been implemented and that the certificate's expiry on 2026-10-19 does not stop the vulnerable binaries from loading unless the certificate is on the forbidden list ("
    urls: ["https://securelist.com/uefi-bootkit-blackx/121539/"]
  - claim_id: ec506ab05b
    entry: 2026-10-23/blackx-uefi-bootkit-baton-drop-revocation-default-off
    surface: "body"
    kind: cited
    text: "Kaspersky attributes the campaign to APT41 with medium confidence, resting on the identifier \"xdd\" shared with a kernel implant in ESET's June 2026 FishMonger report, on DLL sideloading with an encrypted file and on OLLVM ("
    urls: ["https://securelist.com/uefi-bootkit-blackx/121539/"]
  - claim_id: 6827213c76
    entry: 2026-10-23/blackx-uefi-bootkit-baton-drop-revocation-default-off
    surface: "body"
    kind: cited
    text: "**Exposure:** any Windows device that boots with Secure Boot, has the updates of 2024-07-09 or later and has not had the revocation steps applied; Microsoft's check is that the forbidden-list (DBX) variable contains Microsoft Windows Production PCA 2011, which a PowerShell test returns as True once the revocation is in, with event 1037 recording the update and the Servicing registry value UEFICA2023Status reading Updated for the earlier certificate step ("
    urls: ["https://support.microsoft.com/en-us/servicing/os/windows/2023/03/how-to-manage-the-windows-boot-manager-revocations-for-secure-boot-changes-associated-with-cve-2023"]
  - claim_id: 9c9b4b679d
    entry: 2026-10-23/blackx-uefi-bootkit-baton-drop-revocation-default-off
    surface: "body"
    kind: cited
    text: "**Detection:** the installer needs administrator rights, so the hunt starts with the administrator-level intrusion that precedes it; the behaviors Kaspersky describes are process creation of an executable from a program-data subfolder that takes an encrypted data file and a key as arguments, file writes to the EFI system partition by processes that are not servicing, kernel driver loads signed by an unfamiliar or revoked certificate, a signed executable renamed to look like an updater that loads a sideloaded DLL, and non-browser processes talking to consumer cloud storage ("
    urls: ["https://securelist.com/uefi-bootkit-blackx/121539/"]
  - claim_id: 3c83c13d2e
    entry: 2026-10-23/blackx-uefi-bootkit-baton-drop-revocation-default-off
    surface: "body"
    kind: cited
    text: "Because the driver disables security-product callbacks and ETW providers, quiet host telemetry after a reboot on a machine that ran the installer is not evidence that nothing ran ("
    urls: ["https://securelist.com/uefi-bootkit-blackx/121539/"]
  - claim_id: 1c0a688d36
    entry: 2026-10-23/blackx-uefi-bootkit-baton-drop-revocation-default-off
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** a patched Windows fleet is not protected against this class until the revocation is applied, so decide which devices get Microsoft's procedure and in what order; Microsoft warns that the revocation cannot be reverted while Secure Boot is in use, that BitLocker recovery keys should be backed up first, that recovery and install media must be updated, and that older external boot media may stop booting ("
    urls: ["https://support.microsoft.com/en-us/servicing/os/windows/2023/03/how-to-manage-the-windows-boot-manager-revocations-for-secure-boot-changes-associated-with-cve-2023"]
  - claim_id: 42aac908e5
    entry: 2026-10-23/blackx-uefi-bootkit-baton-drop-revocation-default-off
    surface: "body"
    kind: uncited
    text: "The point for defenders is that the targeted machines were fully patched."
