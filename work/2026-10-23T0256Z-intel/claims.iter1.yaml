    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "body"
    kind: cited
    text: "Netzwoche, relaying the same paper, adds that the Federal Council and the security authorities now assume data on practically all current and former federal and federally affiliated staff left, federal judges and former Federal Council members among them, which no authority has confirmed ("
    urls: ["https://www.netzwoche.ch/news/2026-10-08/bundespensionskasse-publica-meldet-datenabfluss"]
