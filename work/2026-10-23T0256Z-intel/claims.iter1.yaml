    entry: 2026-10-22/cve-2026-76466-cisco-expressway-cluster-unauth-root-rce
    surface: "body"
    kind: cited
    text: "**Exposure:** Expressway-C and Expressway-E in a cluster on X15.5.3 or earlier, or on X14 or earlier; the affected component is the database service, and Cisco does not say on which network it listens, so an Expressway-E in a cluster is the case to check first ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-vcs-static-cred-hr7EWZ8t"]
