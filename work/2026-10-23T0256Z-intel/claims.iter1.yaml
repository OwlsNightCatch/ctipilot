    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "body"
    kind: cited
    text: "Tamedia's Tages-Anzeiger reports that the Akira ransomware group holds about 100 GB of compressed pension data on well over 100,000 current and former federal employees, including staff of the security authorities, and demands ransom, which Inside IT relays without the volume; neither the Confederation nor Publica has confirmed the perpetrator or the demand, and Publica says it still has no indication that data was published on the darkweb ("
    urls: ["https://www.tagesanzeiger.ch/akira-gruppe-alt-bundesraete-von-hacker-angriff-betroffen-181002064025", "https://www.inside-it.ch/datenleck-bei-publica-gefaehrdet-auch-sicherheitsbehoerden-20261020", "https://www.publica.ch/de/cyberangriff-auf-softwarelieferanten"]
