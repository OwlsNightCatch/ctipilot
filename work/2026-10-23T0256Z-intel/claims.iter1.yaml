    entry: 2026-10-23/m365-token-spray-replay-rogue-entra-devices-mfa-wipe
    surface: "headline"
    kind: frontmatter
    text: "Huntress: stolen post-MFA M365 tokens replayed within minutes; a password reset leaves planted devices and MFA methods"
  - claim_id: 70fc3dcadd
    entry: 2026-10-23/m365-token-spray-replay-rogue-entra-devices-mfa-wipe
    surface: "summary"
    kind: frontmatter
    text: "Huntress reports that between 2026-07-14 and 2026-09-22 it detected 497 Microsoft 365 sign-in events in 79 organizations that replayed tokens stolen through adversary-in-the-middle relays, device-code phishing and social engineering, within minutes of capture and from one rented hosting range. The operators then registered rogue Entra devices, wiped and replaced MFA methods in 19 organizations and hid mail with inbox rules; a password reset alone removes none of it."
  - claim_id: 3f7b3433fc
    entry: 2026-10-23/m365-token-spray-replay-rogue-entra-devices-mfa-wipe
    surface: "actions[0]"
    kind: frontmatter
    text: "In every Entra tenant, list the devices registered since 2026-07-14 whose names are DESKTOP- followed by eight uppercase hexadecimal characters, the authenticators that were deleted and re-registered within minutes, and the inbox rules whose names are one to three characters or punctuation only or that move mail to RSS Feeds, RSS Subscriptions or Conversation History, and remove what nobody created; then revoke the sessions of any affected user, because a password reset leaves the devices, MFA methods and a roughly 90-minute access token in place."
  - claim_id: de5af14f47
    entry: 2026-10-23/m365-token-spray-replay-rogue-entra-devices-mfa-wipe
    surface: "body"
    kind: cited
    text: "Between 2026-07-14 and 2026-09-22 Huntress detected 497 Microsoft 365 sign-in events across 79 victim organizations that replayed stolen sign-in tokens instead of guessing passwords ("
    urls: ["https://www.huntress.com/blog/token-replay-spray"]
  - claim_id: 8705a79482
    entry: 2026-10-23/m365-token-spray-replay-rogue-entra-devices-mfa-wipe
    surface: "body"
    kind: cited
    text: "The tokens came from adversary-in-the-middle relays behind fake sign-in pages, from device-code phishing and from social engineering during a genuine sign-in; a relay passes the real login page and MFA prompt through and keeps the token Microsoft issues afterwards, so its holder does not face MFA again ("
    urls: ["https://www.huntress.com/blog/token-replay-spray"]
  - claim_id: 3fbb221f52
    entry: 2026-10-23/m365-token-spray-replay-rogue-entra-devices-mfa-wipe
    surface: "body"
    kind: cited
    text: "Replay followed within minutes, 12 on 2026-07-21 and four on 2026-09-22, from one of six addresses in a single rented range used in turn, so blocking one address stops at most one phase ("
    urls: ["https://www.huntress.com/blog/token-replay-spray"]
  - claim_id: e37b1979e1
    entry: 2026-10-23/m365-token-spray-replay-rogue-entra-devices-mfa-wipe
    surface: "body"
    kind: cited
    text: "A scripted replayer with the user agent `node` requests tokens with the Microsoft Office and Microsoft Authentication Broker client applications against Microsoft Graph, Exchange Online, SharePoint Online and the Device Registration Service and joins 48 rogue Entra devices named DESKTOP- plus exactly eight uppercase hexadecimal characters, where the Windows default is seven alphanumeric characters; a browser-session replayer uses current Chrome or Edge through the OfficeHome client ("
    urls: ["https://www.huntress.com/blog/token-replay-spray"]
  - claim_id: a510c3f5a8
    entry: 2026-10-23/m365-token-spray-replay-rogue-entra-devices-mfa-wipe
    surface: "body"
    kind: cited
    text: "What outlives a password reset is the persistence: in 19 organizations the victim's MFA methods were wiped and a new authenticator registered within three hours, the rogue devices stay in the directory until deleted, and hidden inbox rules with names of one to three characters or punctuation only, created from VPN or other rented addresses, moved mail to RSS Feeds, RSS Subscriptions or Conversation History or deleted it, one keyed on payroll and bank terms ("
    urls: ["https://www.huntress.com/blog/token-replay-spray"]
  - claim_id: 84346a307e
    entry: 2026-10-23/m365-token-spray-replay-rogue-entra-devices-mfa-wipe
    surface: "body"
    kind: cited
    text: "Conditional Access blocks reported as AADSTS53003 fire only after authentication has succeeded, so they signal a valid credential, and ranking tenants by failed attempts points responders at the wrong ones ("
    urls: ["https://www.huntress.com/blog/token-replay-spray"]
  - claim_id: fea2de52a3
