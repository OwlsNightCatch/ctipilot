    text: "The CVE record, as ENISA's database carries it (CVSS 4.0 10.0), describes the mechanism: the publicly reachable image-transformation handler does not fully bind the normalised image operations and the output destination to the request signature, so an unauthenticated attacker can reuse a signature disclosed in any legitimate public image URL, inject additional image operations, traverse out of the cache directory and write an attacker-controlled PNG/PHP polyglot into an executable public media directory ("
