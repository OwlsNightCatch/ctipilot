  - claim_id: 1bbb6bc0c2
    entry: 2026-10-22/cve-2026-76466-cisco-expressway-cluster-unauth-root-rce
    surface: "body"
    kind: cited
    text: "Cisco's advisory of 2026-10-21 fixes CVE-2026-76466 (CVSS 3.1 9.8, network, no privileges, no user interaction) in the database service of Expressway-C and Expressway-E, virtual and appliance: an unauthenticated remote attacker with network access can run operating-system commands as root ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-vcs-static-cred-hr7EWZ8t"]
  - claim_id: 4790eb9b2e
    entry: 2026-10-22/cve-2026-76466-cisco-expressway-cluster-unauth-root-rce
    surface: "body"
    kind: cited
    text: "The cause is the use of persistent cookies together with insufficient validation of client certificates for clustering, even when TLS Verify Mode is enabled; an attacker who possesses the cookies connects to the database service and invokes remote procedure call commands, and Cisco does not say how an attacker obtains the cookies ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-vcs-static-cred-hr7EWZ8t"]
  - claim_id: 837d172e08
    entry: 2026-10-22/cve-2026-76466-cisco-expressway-cluster-unauth-root-rce
    surface: "body"
    kind: cited
    text: "Only devices configured in a cluster are affected; X15.5.3 and earlier are fixed in X15.5.20, X14 and earlier must migrate to a fixed release, there is no workaround, and Cisco's PSIRT is not aware of any public announcement or malicious use ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-vcs-static-cred-hr7EWZ8t"]
  - claim_id: 3fd8dab71b
    entry: 2026-10-22/cve-2026-76466-cisco-expressway-cluster-unauth-root-rce
    surface: "body"
    kind: cited
    text: "The X15.5.20 release also carries Expressway's own hardening fixes, whose worst class scores 8.6 ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-exwy-hardening-FhcqBVcs"]
  - claim_id: 3e801668a6
    entry: 2026-10-22/cve-2026-76466-cisco-expressway-cluster-unauth-root-rce
    surface: "body"
    kind: cited
    text: "Cisco's separate advisory on the PHP2Shell flaws lists Expressway Series and Expressway Select Series as affected as well, with fixed release 15.5.21 and no date, so X15.5.20 alone does not complete the Expressway upgrade ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-php-october26-Jj384Daq"]
  - claim_id: 17f34482fa
    entry: 2026-10-22/cve-2026-76466-cisco-expressway-cluster-unauth-root-rce
    surface: "body"
    kind: cited
    text: "For Emergency Responder, Prime Collaboration Deployment, Unified CM, Unified CM IM&P, Unified CM SME and Unity Connection, regardless of device configuration, the worst classes score 9.8 (CVE-2026-76473, improper control of a resource through its lifetime, and CVE-2026-76474, improper authentication); release 15 is fixed in 15SU5 and release 14 must migrate ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-voice-hardening-twgbH9e3"]
  - claim_id: f1dc7a9204
    entry: 2026-10-22/cve-2026-76466-cisco-expressway-cluster-unauth-root-rce
    surface: "body"
    kind: cited
    text: "For Snort 3 in Secure Firewall Threat Defense, Cyber Vision, Unified Threat Defense (UTD) on IOS XE and other Snort-based products, the worst classes score 9.0 with high attack complexity (CVE-2026-20043, an out-of-bounds write, and CVE-2026-20236, an incorrect calculation); FTD is fixed in 7.0.10, 7.2.12, 7.4.8, 7.6.6, 7.7.13, 10.0.2 and 10.1.0, Snort in 3.12.4.0, Cyber Vision in 5.6.0 and UTD on IOS XE in 17.12.8, 17.15.6, 17.18.5, 26.1.2 and 26.2.1, while Meraki MX devices that are online and connected to the Dashboard and Cisco's cloud firewall services were updated automatically on 2026-10-21 ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-hardening-snort3-ybgmhTQe"]
