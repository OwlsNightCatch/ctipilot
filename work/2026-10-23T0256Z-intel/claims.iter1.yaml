  - claim_id: 93eb43cd6d
    entry: 2026-10-22/cve-2026-76466-cisco-expressway-cluster-unauth-root-rce
    surface: "body"
    kind: cited
    text: "**Detection:** connections to the database service from hosts that are not cluster peers, and new root-owned processes started by that service; Cisco publishes no flaw-specific indicator and states no exploitation, so no post-compromise check is defined ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-vcs-static-cred-hr7EWZ8t"]
  - claim_id: 25df72ac75
    entry: 2026-10-22/cve-2026-76466-cisco-expressway-cluster-unauth-root-rce
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** upgrade Expressways to X15.5.20, clustered ones first, plan for 15.5.21 as the release that addresses PHP2Shell once Cisco dates it, and schedule the move of X14 and earlier, Unified CM family and Unity Connection to 15SU5 (release 14 migrates), and FTD to the fixed build of its train; Cisco reports no exploitation of any of them and lists no workaround for the Expressway flaw ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-vcs-static-cred-hr7EWZ8t", "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-voice-hardening-twgbH9e3", "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-hardening-snort3-ybgmhTQe"]
