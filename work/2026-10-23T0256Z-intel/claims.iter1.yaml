    text: "On 2026-10-17 a researcher reported that the private keys of eight eMudhra intermediate CA certificates had been generated with too little randomness, so anyone could recover them and forge trusted HTTPS certificates for any site. Firefox, Chrome, Apple and Microsoft platforms now block the intermediates and eMudhra revoked them, but software that keeps its own trust store or does not check revocation stays exposed until updated; Go fixed it in 1.27.3 and 1.26.10 as CVE-2026-111943, Oracle and OpenJDK shipped a Java distrust update on 2026-10-21 as CVE-2026-91403 (CVSS 3.1 9.1), and Chrome removes the emSign ECC Root CA - G3 root on 2026-10-27. No exploitation is reported."
  - claim_id: efd5a3feff
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "actions[0]"
    kind: frontmatter
    text: "Update the trust store or toolchain of every non-browser TLS client that keeps its own CA bundle or does not check revocation (every standalone Java runtime through Oracle's alert for CVE-2026-91403 or the OpenJDK update, or until then replace its blocked.certs file, blacklisted.certs on Java 8, with the vendor's version or enable revocation checking, while distribution OpenJDK packages need only the updated operating-system certificates; Go 1.27.3 or 1.26.10, Python certifi 2026.10.19, rustls-webpki 0.103.16, webpki-roots 1.0.10, the curl CA bundle of 2026-10-20, the distribution ca-certificates package, container base images) and rebuild images that embed an older bundle, then confirm with curl against the tracker's test host that the client now rejects the certificate; replace before 2026-10-27 every TLS certificate your organisation holds that chains to emSign ECC Root CA - G3."
