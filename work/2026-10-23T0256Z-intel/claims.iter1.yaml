    entry: 2026-10-23/hpesbnw05162-hpe-aruba-aos-8-aos-10-72-cves-19-unauth
    surface: "body"
    kind: cited
    text: "HPE Networking's bulletin HPESBNW05162 (initial release 2026-10-22) fixes 72 CVEs in the wireless operating systems AOS-8 and AOS-10 for Mobility Conductors, Controllers, Gateways managed by HPE Networking Central, AOS-10 access points (AOS-AP) and AOS-8 Instant access points (AOS-IAP) ("
    urls: ["https://support.hpe.com/hpesc/public/docDisplay?docId=hpesbnw05162en_us&docLocale=en_US"]
  - claim_id: 97cb0f205e
    entry: 2026-10-23/hpesbnw05162-hpe-aruba-aos-8-aos-10-72-cves-19-unauth
    surface: "body"
    kind: cited
    text: "By the CSAF's CVSS 3.1 scores, 34 of the 72 rate 9.0 or higher (eight at 10.0, ten at 9.8, eleven at 9.6, one at 9.4 and four at 9.3); the 19 rated 10.0, 9.8 or 9.4 need network access and no privileges, and the other 15 are reachable from the adjacent network ("
    urls: ["https://csaf.arubanetworking.hpe.com/2026/hpe_networking_-_hpesbnw05162.json"]
  - claim_id: fd2e8ad9d4
    entry: 2026-10-23/hpesbnw05162-hpe-aruba-aos-8-aos-10-72-cves-19-unauth
    surface: "body"
    kind: cited
    text: "The named mechanisms include authentication bypasses and command injection in the AOS-10 interface and in the PAPI protocol, a buffer overflow and a command injection in the AOS-8 PAPI protocol that arrive as crafted packets on its UDP port, an authentication bypass in the AOS-8 SSH daemon, and SQL injection in the web-based management interface ("
    urls: ["https://csaf.arubanetworking.hpe.com/2026/hpe_networking_-_hpesbnw05162.json"]
  - claim_id: e6aa9ff8d9
    entry: 2026-10-23/hpesbnw05162-hpe-aruba-aos-8-aos-10-72-cves-19-unauth
    surface: "body"
    kind: cited
    text: "HPE says the flaws were generally found by its internal security research, that it is not aware of public discussion or exploit code as of the release, and that customers are strongly urged to patch; for some of the critical rows exploitation also needs preconditions outside the attacker's control, which the bulletin does not itemise ("
    urls: ["https://support.hpe.com/hpesc/public/docDisplay?docId=hpesbnw05162en_us&docLocale=en_US", "https://csaf.arubanetworking.hpe.com/2026/hpe_networking_-_hpesbnw05162.json"]
  - claim_id: 9ee84f2a71
    entry: 2026-10-23/hpesbnw05162-hpe-aruba-aos-8-aos-10-72-cves-19-unauth
    surface: "body"
    kind: cited
    text: "Affected are AOS-10 10.8.x up to 10.8.1.1, 10.7.x up to 10.7.2.6 and 10.4.x up to 10.4.1.13, and AOS-8 8.13.x up to 8.13.3.0 and 8.10.x up to 8.10.0.23; fixed builds are AOS-10.8.1.2, 10.7.2.7 and 10.4.1.14 and AOS-8.13.3.1 and 8.10.0.24 ("
    urls: ["https://support.hpe.com/hpesc/public/docDisplay?docId=hpesbnw05162en_us&docLocale=en_US", "https://csaf.arubanetworking.hpe.com/2026/hpe_networking_-_hpesbnw05162.json"]
  - claim_id: c51c980674
    entry: 2026-10-23/hpesbnw05162-hpe-aruba-aos-8-aos-10-72-cves-19-unauth
    surface: "body"
    kind: cited
    text: "HPE's workaround is to restrict the CLI and web-based management interfaces to a dedicated layer 2 segment or VLAN, controlled by firewall policies at layer 3 and above with accounting controls ("
    urls: ["https://support.hpe.com/hpesc/public/docDisplay?docId=hpesbnw05162en_us&docLocale=en_US"]
  - claim_id: 261be57b90
    entry: 2026-10-23/hpesbnw05162-hpe-aruba-aos-8-aos-10-72-cves-19-unauth
    surface: "body"
    kind: cited
    text: "**Exposure:** any HPE Networking mobility conductor, controller, gateway, access point or virtual machine that runs a listed version; HPE says every compatible hardware model is affected and that its own hardware list is illustrative only, so the check is the software version, not the model ("
    urls: ["https://support.hpe.com/hpesc/public/docDisplay?docId=hpesbnw05162en_us&docLocale=en_US"]
  - claim_id: f352ffd2ad
    entry: 2026-10-23/hpesbnw05162-hpe-aruba-aos-8-aos-10-72-cves-19-unauth
    surface: "body"
    kind: cited
    text: "The named surfaces are the CLI and web management interfaces and the PAPI access-point management protocol on UDP port 8211 ("
    urls: ["https://support.hpe.com/hpesc/public/docDisplay?docId=hpesbnw05162en_us&docLocale=en_US", "https://csaf.arubanetworking.hpe.com/2026/hpe_networking_-_hpesbnw05162.json"]
  - claim_id: c5b8f02d51
    entry: 2026-10-23/hpesbnw05162-hpe-aruba-aos-8-aos-10-72-cves-19-unauth
    surface: "body"
    kind: cited
    text: "HPE publishes no detection guidance and states no exploitation, so no post-compromise check is defined ("
    urls: ["https://support.hpe.com/hpesc/public/docDisplay?docId=hpesbnw05162en_us&docLocale=en_US"]
  - claim_id: dc7446ae49
    entry: 2026-10-23/hpesbnw05162-hpe-aruba-aos-8-aos-10-72-cves-19-unauth
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** upgrade controllers, gateways and access points to the fixed build of their train, management and PAPI-exposed units first, and apply the management-segment restriction at once where the upgrade has to wait; HPE reports no exploitation, so the order follows exposure of the management and access-point protocol paths rather than a known campaign ("
    urls: ["https://support.hpe.com/hpesc/public/docDisplay?docId=hpesbnw05162en_us&docLocale=en_US"]
  - claim_id: e3e7d8b753
    entry: 2026-10-23/hpesbnw05162-hpe-aruba-aos-8-aos-10-72-cves-19-unauth
    surface: "body"
    kind: derived
    text: "**Detection:** management-plane access and accounting logs for logins and sessions from outside the management segment, and network flow data for PAPI traffic on UDP 8211 or controller management ports from segments that carry users or guests."
  - claim_id: d62e604a65
    entry: 2026-10-23/cve-2026-102785-yootheme-pro-5-unauth-image-handler-rce
    surface: "headline"
    kind: frontmatter
    text: "YOOtheme Pro 5 up to 5.0.52 has an unauthenticated RCE in its image handler; 5.0.53 fixes it, no exploitation reported"
  - claim_id: 7e4836ee47
    entry: 2026-10-23/cve-2026-102785-yootheme-pro-5-unauth-image-handler-rce
    surface: "summary"
    kind: frontmatter
    text: "YOOtheme's release 5.0.53 of 2026-10-21, pre-announced the day before, fixes CVE-2026-102785 (CVSS 4.0 10.0) in every YOOtheme Pro 5 build from 5.0.0 to 5.0.52: a visitor with no account can reuse a signature from any public image URL to make the image handler write a PHP-bearing image file into an executable media directory. YOOtheme Pro 4 and earlier are not affected, and no source reports exploitation."
  - claim_id: ee38603168
    entry: 2026-10-23/cve-2026-102785-yootheme-pro-5-unauth-image-handler-rce
