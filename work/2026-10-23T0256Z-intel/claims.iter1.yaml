  - claim_id: 6ebcb00ddd
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "summary"
    kind: frontmatter
    text: "The PHP project released 8.5.12, 8.4.27, 8.3.36 and 8.2.35 on 2026-10-21 to fix CVE-2026-109618 and CVE-2026-109619 (CVSS 4.0 9.2), two flaws in the runtime itself that allow unauthenticated remote code execution as the web worker account, most directly on Apache mod_php; PHP 8.1 and older get no upstream release. Cloudflare, watchTowr and VulnCheck report attack traffic and at least one unsuccessful web-shell attempt, public proofs of concept circulate, VulnCheck holds a working exploit that succeeds on x86-64 with ASLR enabled, Sansec and Red Hat judge reliable exploitation harder, and no source reports a confirmed compromise. BACS knows of no attack in Switzerland but says PHP applications of the federal administration were affected and that it has no complete overview of the update status; Swiss cantons, universities, the host Cyon with more than 100,000 sites, the Lodur fire-brigade platform and Publica took sites offline as a precaution."
  - claim_id: ecd645e617
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "actions[0]"
    kind: frontmatter
    text: "Update the PHP runtime, not the CMS or its plugins, on every internet-facing server and container image to 8.5.12, 8.4.27, 8.3.36 or 8.2.35 or to your distribution's patched package, restart PHP-FPM, Apache and every long-running worker, rebuild images, and confirm the running version, because a distribution backport can keep the old version string; isolate any application that cannot be updated from public networks until it is."
  - claim_id: 568993dff6
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "actions[1]"
    kind: frontmatter
    text: "On every internet-facing PHP host that was reachable while unpatched, preserve the web and PHP logs and examine the period from 2026-10-17 for worker crashes and fatal errors, multipart POST requests from unfamiliar sources, changed or new files in the web root and processes started by the PHP worker account, because the update does not remove an attacker who is already in."
  - claim_id: 8e69156052
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "body"
    kind: cited
    text: "The PHP project released PHP 8.5.12, 8.4.27, 8.3.36 and 8.2.35 on 2026-10-21 to fix two critical vulnerabilities that can allow unauthenticated remote code execution, CVE-2026-109618 and CVE-2026-109619, both CVSS 4.0 9.2, and urges all PHP users to update immediately ("
    urls: ["https://www.php.net/archive/2026.php#2026-10-21-5", "https://www.php.net/archive/2026.php#2026-10-20-1"]
  - claim_id: 4e8cfc4fcd
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "body"
    kind: cited
    text: "Sources date the release between 13:30 UTC (CERT-EU) and 14:00 UTC (Sansec), with ENISA giving 13:40 UTC, against the 14:00 UTC the project had announced the day before ("
    urls: ["https://cert.europa.eu/publications/security-advisories/2026-018/", "https://www.enisa.europa.eu/news/joint-statement-on-critical-php-vulnerabilities", "https://sansec.io/research/php2shell", "https://www.php.net/archive/2026.php#2026-10-20-1"]
  - claim_id: 66ae9cbe01
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "body"
    kind: cited
    text: "CVE-2026-109618 is memory corruption when PHP handles an out-of-memory error: it aborts the request with longjmp() while internal request data is only partly initialised, and request cleanup then treats the invalid data as valid ("
    urls: ["https://github.com/php/php-src/security/advisories/GHSA-w8hw-w9fx-j79w"]
  - claim_id: 35f3424034
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "body"
    kind: cited
    text: "CVE-2026-109619 is stale global state: request-owned state survives a fatal error after its memory is freed, and a later request on the same worker uses it ("
    urls: ["https://github.com/php/php-src/security/advisories/GHSA-6wmf-4rv5-p3rp"]
  - claim_id: ead4c57df5
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "body"
    kind: cited
