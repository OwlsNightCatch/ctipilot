    techniques: [T1566.004, T1078.004, T1098.005, T1087.004, T1069.003, T1526, T1114.002, T1213.002, T1213, T1070.008]
    affected_products: ["Microsoft Entra ID", "Microsoft 365", "SharePoint Online", "ServiceNow", "Salesforce"]
