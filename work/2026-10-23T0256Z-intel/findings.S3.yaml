        attribution: "Red Hat"
        source_url: "https://access.redhat.com/security/cve/cve-2026-99999"
      - quote: "Mitigation for this issue is either not available"
        attribution: "Red Hat"
        source_url: "https://access.redhat.com/security/cve/cve-2026-99999"
      - quote: "we expect exploits in weaker configurations to arrive in weeks, and exploits working in default hypervisor configurations to arrive in under a month"
        attribution: "PWNAI Research"
        source_url: "https://pwn.ai/blog/pwnescape"
      - quote: "PwnEscape impacts KVM running on x86 CPU architectures, which is the most common setup used by most shared cloud environments."
        attribution: "Risky Bulletin"
        source_url: "https://news.risky.biz/risky-bulletin-pwnescape-vulnerability-lets-you-escape-kvm/"
    extended_notes: |
      Exposure: Linux hosts that run guests or sandboxes they do not fully trust over virtio-net with a TAP path (KVM/QEMU, Firecracker-class microVMs,
      CI runners, malware-analysis and AI-sandbox hosts). Read the running kernel with uname -r and compare with the fixed releases per branch; distribution
      kernels backport, so use the distributor's advisory (Red Hat: no fix shipped yet, no mitigation).
      Fix reference: mainline commit "ipv4: validate checksum_start before completing checksum" (6785011f8b16), merged 2026-10-14; the researcher calls it a
      defence-in-depth guard, and the CNA text says a more complete validation at input is forthcoming, so expect follow-up patches.
      Detection (telemetry class first): host kernel logs for WARN or panic traces in skb_checksum_help / ip_do_fragment paths and unexplained host
      crashes on hypervisor hosts (the CNA says malformed offsets can trip those paths); no network signature is published. Guest-side, the attack
      needs the guest to send crafted checksum metadata, so a tenant VM with offload settings or a custom virtio driver it has no reason to touch is
      the behavioural lead; the sources state no specific telemetry for this, so treat it as a hunting idea, not a documented detection.
      Hardening: patch hypervisor host kernels first (multi-tenant before single-tenant), restrict who can run arbitrary guest code, and treat the
      guest-to-host boundary as breakable until the host kernel is updated.
      Suggested priority: notable to high for operators of multi-tenant or untrusted-guest Linux hosts; otherwise routine kernel patching.
      Note on dates: the pwn.ai page metadata reads 2026-10-23 while Risky Bulletin linked it on 2026-10-19, so the post date used above is the earlier one.
