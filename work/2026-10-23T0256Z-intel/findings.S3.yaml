  - title: "BlackX: Kaspersky finds a BlackLotus-style UEFI bootkit on fully patched Windows machines of Central Asian diplomatic bodies, because the Baton Drop fix never revokes the old boot-manager certificate unless an administrator triggers it"
    sources:
      - { url: "https://securelist.com/uefi-bootkit-blackx/121539/", publisher: "Kaspersky GReAT (Securelist)", date: "2026-10-22", role: "primary" }
      - { url: "https://support.microsoft.com/en-us/servicing/os/windows/2023/03/how-to-manage-the-windows-boot-manager-revocations-for-secure-boot-changes-associated-with-cve-2023", publisher: "Microsoft Support (KB5025885)", date: "2026-09-30", role: "corroborating" }
      - { url: "https://www.welivesecurity.com/en/eset-research/fishmongers-arsenal-upgraded-sprysocks-windows/", publisher: "ESET Research", date: "2026-06-16", role: "corroborating" }
    discovery_trace: "first seen at: kaspersky-securelist, URL https://securelist.com/feed/ (feed, 2026-10-22T06:00Z item, listing title 'How APT41 revived the BlackLotus bootkit...') -> primary: extract of https://securelist.com/uefi-bootkit-blackx/121539/ (page title 'New BlackX UEFI bootkit exploiting Baton Drop') -> pivot: the Microsoft KB5025885 page Securelist links, URL https://support.microsoft.com/en-us/servicing/os/windows/2023/03/how-to-manage-the-windows-boot-manager-revocations-for-secure-boot-changes-associated-with-cve-2023 -> pivot: ESET FishMonger post Securelist cites for the attribution evidence, URL https://www.welivesecurity.com/en/eset-research/fishmongers-arsenal-upgraded-sprysocks-windows/"
    summary: |
      Kaspersky GReAT reports that in early 2026 it found BlackX, a UEFI bootkit that exploits the Baton Drop flaw (CVE-2022-21894) the way
      BlackLotus did, installed after the attackers already held administrator rights on networks of diplomatic agencies in Tajikistan,
      Uzbekistan and Turkmenistan. An installer plus an RC4-encrypted package (the key passed on the command line, nothing malicious inside the
      installer itself) drops files to the system and EFI partitions to enrol attacker-controlled Machine Owner Keys, which lets arbitrary EFI
      binaries load despite Secure Boot. The bootkit loads a kernel driver, signed with a certificate its issuer has since revoked, that disables
      process, thread and registry callbacks and ETW providers tied to security products (some routines run only if Kaspersky or Avast products
      are present, and Kaspersky says they failed against its own) and hands back a calc.exe handle when something opens the bootkit's files. Two
      user-mode payloads were seen: a RAT that loads .NET modules and talks through Google Drive, OneDrive or Yandex.Disk, and an OLLVM-obfuscated
      loader started by DLL sideloading from a renamed signed executable, which decrypts shellcode and a Rust implant. The point that matters
      for defenders: Kaspersky states the targeted machines were fully patched. Microsoft's fix for Baton Drop revokes the "Windows Production
      PCA 2011" certificate only when an administrator sets a Secure Boot registry flag and runs the Secure-Boot-Update scheduled task, and
      Microsoft's own KB5025885 says the mitigations "are not enabled by default" and that the automatic Enforcement Phase will not begin before
      January 2026 with at least six months of notice (page last revised 2026-09-30); Kaspersky says that phase has not shipped and that the PCA 2011
      certificate expired on 2026-10-19, which by itself blocks nothing unless it is on the forbidden list. Attribution is Kaspersky's: APT41 with
      medium confidence, resting on the same "xdd" developer identifier that ESET found in a FishMonger kernel implant (ESET's June 2026 post also
      raised a possible UEFI bootkit component), on sideloading plus encrypted-file loading, and on OLLVM; Kaspersky writes that the community
      assumes FishMonger is related to APT41; ESET describes FishMonger as believed operated by the contractor I-SOON and as falling under the Winnti Group umbrella, so the APT41 label overlaps rather than contradicts. Kaspersky also infers
      the operators either reverse-engineered BlackLotus or bought its source, because the source was never published.
    region_nexus: "Central Asia (Tajikistan, Uzbekistan, Turkmenistan) for the observed victims; the exposure is every Windows fleet that relies on Secure Boot"
    primary_sector_nexus: "direct for foreign-affairs and diplomatic bodies; indirect for any administration with Windows endpoints"
    sector: "public-sector"
    cves: [CVE-2022-21894, CVE-2023-24932]
    techniques: [T1542.003, T1553.006, T1687, T1014, T1685, T1574.001, T1102.002, T1027]
    affected_products: ["Microsoft Windows (Secure Boot, Windows Boot Manager)"]
    entity_keys: ["actor:webworm-fishmonger-aquatic-panda-eset-echocreep-graphworm-eu", "campaign:fishmonger-isoon-sprysocks-windows-kernel-rootkit"]
    new_entities:
      - { key: "malware:blackx-uefi-bootkit", type: malware, name: "BlackX", aliases: ["BlackX UEFI bootkit"],
          summary: "UEFI bootkit similar to BlackLotus that exploits Baton Drop (CVE-2022-21894) to enrol attacker Machine Owner Keys and load a kernel driver; found by Kaspersky GReAT in early 2026 against Central Asian diplomatic bodies and attributed by Kaspersky to APT41 with medium confidence (Securelist, 2026-10-22)." }
      - { key: "malware:blacklotus", type: malware, name: "BlackLotus", aliases: ["BlackLotus UEFI bootkit"],
          summary: "UEFI bootkit sold on forums from 2022 that bypasses Secure Boot through Baton Drop (CVE-2022-21894); confirmed in the wild by ESET in March 2023 (as recounted by Kaspersky, 2026-10-22)." }
      - { key: "actor:apt41", type: actor, name: "APT41", aliases: [],
          summary: "Chinese-speaking espionage actor; Kaspersky GReAT attributes the BlackX UEFI bootkit campaign to APT41 with medium confidence (Securelist, 2026-10-22)." }
    relation_suggestions:
      - { subject: "malware:blackx-uefi-bootkit", object: "campaign:fishmonger-isoon-sprysocks-windows-kernel-rootkit",
          basis: "Kaspersky assesses BlackX is the UEFI bootkit ESET's June 2026 FishMonger post alluded to, because the kernel-implant PDB identifier 'xdd' recurs in BlackX payloads (Securelist, 2026-10-22; ESET, 2026-06-16)" }
      - { subject: "actor:apt41", object: "actor:webworm-fishmonger-aquatic-panda-eset-echocreep-graphworm-eu",
          basis: "Kaspersky writes that the community assumes FishMonger to be related to APT41 and attributes BlackX to APT41 with medium confidence (Securelist, 2026-10-22); ESET describes FishMonger as believed operated by I-SOON and under the Winnti Group umbrella (ESET, 2026-06-16) - an overlap claim, not an identity" }
      - { subject: "malware:blackx-uefi-bootkit", object: "malware:blacklotus",
          basis: "Kaspersky: BlackX is 'similar to BlackLotus', exploiting the same Baton Drop flaw with a similar chain but different exploit code (Securelist, 2026-10-22)" }
