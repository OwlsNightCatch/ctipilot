    discovery_trace: "first seen at: majors sweep, URL https://www.welivesecurity.com/en/eset-research/ (extract of the ESET Research listing, newest card 2026-10-22; the main ESET RSS feed https://www.welivesecurity.com/en/rss/feed/ did not yet list it) -> primary (no pivot needed): extract of the MythicRatatoskr post"
    summary: |
      ESET reports that UAC-0099, a Russia-aligned group active since 2022, gained initial access to a Ukrainian grain logistics company on
      2025-07-16 with a spearphishing attachment that ran a scheduled task and a PowerShell payload, then the MATCHBOIL downloader and the MATCHWOK
      backdoor, and that on 2025-07-17 a previously undocumented Go backdoor, MythicRatatoskr, arrived. The backdoor reaches its command server
      inside the Yggdrasil decentralized mesh network (an encrypted IPv6 overlay in 200::/7): it is built on yggstack, so it needs no tunnel
      interface or privileges, joins the public mesh through three randomly chosen peers from an embedded list and then speaks HTTPS on port 443 to a
      server that has an address only inside the mesh; some samples wait ten minutes before connecting. ESET adds that this can keep outbound connections
      invisible to network security tools, but that blocking the public peer addresses is a viable mitigation. It ran as a Windows service named
      like a browser updater, was copied to other machines over an OpenSSH SFTP server, and a SOCKS5 server followed; data was not staged before
      exfiltration. On 2025-09-17 the SDelete utility was deployed through Active Directory Group Policy, which ESET recognises as standard Sandworm tradecraft, and ESET
      assesses with high confidence that UAC-0099 handed access to Sandworm, without being able to say which group operated the backdoor. ESET places the pair
      beside the earlier Gamaredon-Turla collaboration as a pattern of Russia-aligned actors passing access along. The intrusion is from 2025 and the victim Ukrainian.
    region_nexus: "Ukraine (victim); Russia-aligned actors whose cooperation pattern and C2 technique transfer to European administrations"
    primary_sector_nexus: "indirect: the observed victim is a logistics company; UAC-0099 itself targets Ukrainian government bodies, finance and media"
