      vulnerability. Detection (telemetry class first): egress and DNS logs for connections to the public Yggdrasil peer list or any host exchanging
      Yggdrasil mesh traffic (a user-space mesh stack looks like ordinary outbound TCP, so the peer list is the handle, per ESET); process and
      service-creation events for a new Windows service with an updater-style name (ieupdate-style) running a Go binary from a system or user folder; a scheduled task
      that runs a PowerShell payload from a temp folder after a document is opened; SFTP/OpenSSH server
      activity on workstations; and, for the destructive stage, Group Policy objects that deploy SDelete or similar wipers and mass file-overwrite activity
