    evidence:
      - quote: "impersonated help desk personnel"
        attribution: "Sophos X-Ops"
        source_url: "https://www.sophos.com/en-us/blog/graph-reconnaissance-and-servicenow-user-enumeration-in-a-modern-identity-intrusion"
      - quote: "Entra ID registration of a new Windows device"
        attribution: "Sophos X-Ops"
        source_url: "https://www.sophos.com/en-us/blog/graph-reconnaissance-and-servicenow-user-enumeration-in-a-modern-identity-intrusion"
      - quote: "Approximately 100,000 unique SharePoint files downloaded"
        attribution: "Sophos X-Ops"
        source_url: "https://www.sophos.com/en-us/blog/graph-reconnaissance-and-servicenow-user-enumeration-in-a-modern-identity-intrusion"
      - quote: "Effective containment requires revoking active sessions and refresh tokens across the identity provider"
        attribution: "Sophos X-Ops"
        source_url: "https://www.sophos.com/en-us/blog/graph-reconnaissance-and-servicenow-user-enumeration-in-a-modern-identity-intrusion"
      - quote: "These operations primarily leverage sophisticated voice phishing (vishing) and victim-branded credential harvesting sites"
        attribution: "Mandiant / Google Threat Intelligence Group"
        source_url: "https://cloud.google.com/blog/topics/threat-intelligence/expansion-shinyhunters-saas-data-theft"
    extended_notes: |
      Exposure: tenants whose SSPR still accepts SMS or voice verification (including directory-sourced phone numbers), where device
      registration needs no second check, and where ServiceNow or Salesforce accept Entra SAML sign-in from a PRT-backed session.
      Detection (telemetry class first): Entra audit and sign-in logs for an SSPR completion from a new address followed within minutes by a
      device registration and a PRT-backed sign-in; Defender GraphApiAuditEvents for directory, role and service-principal enumeration from one
      user session; Purview/unified audit for SearchQueryInitiatedSharePoint terms such as password, cred, aws, vpn, ssh and the
      organization's own MFA vendor, MailItemsAccessed volume plus deletion of security-awareness mail; ServiceNow logs for bulk export of
      sys_user or cmdb_ci_computer; federated SAML sign-ins to SaaS with MFA satisfied by an existing token claim from a session that never used
      that app before. Containment is not "reset the password": revoke sessions and refresh tokens at the IdP and in each federated SaaS.
      Hardening named by Sophos: phishing-resistant factors (FIDO2, passkeys, Windows Hello for Business, certificate-based) as the
      recovery method, exclude administrators from SMS recovery, require explicit registration instead of directory phone numbers, alert on
      new device registration shortly after a reset or MFA change, require MFA on device registration itself.
      Triage: Sophos treats a device registration inside a short window of a password reset or MFA change as the discriminating signal;
      individually, SSPR use and Graph calls are routine.
      Suggested priority: notable. Related registry entity: actor:storm-2949 (Microsoft's SSPR-abuse actor, 2026-05) is the same abuse class
      but no source ties the two.
