    summary: |
      Report URI, working with iVerify (which covers the client side), says an operator it names DeadTag buys expired domains that once served
      analytics or advertising tags still embedded in other companies' pages, so every site still carrying the old tag loads attacker code without any
      change on the site. The post counts 660+ such domains on thousands of confirmed sites and a "cautiously estimated" 135 million visits a month. The
      served script is about 2 KB, returns nothing to bots, scanners and data-centre addresses (and stops answering visitors who return too often), and
      lets the operator's server decide per visitor where to redirect; most destinations are scams (fake "use a VPN" pop-ups, prize pages, betting and
      casino sign-ups). One buyer is a crew that ends on a fake prediction-market page serving Coruna to iOS 13 to 17.2.1 and a modified "P7" build
      of DarkSword (iVerify's variant, first described on 2026-10-08) to iOS 18.4 to 18.7; both attack the browser, need no tap, and steal keychain
      secrets and crypto-wallet data, reporting to the same server. The crew also plants DarkSword loaders on hundreds of PrestaShop shops in a folder
      named like analytics code. Report URI's attribution reading: DeadTag unknown, the exploit crew at least Chinese-speaking and financially motivated,
      with the caveat that the crew may want to look Chinese. Caveats: Report URI sells script-monitoring and its threat-intelligence feed; no
      government or Swiss site is named; earlier fires of this pipeline dropped the P7 DarkSword chain because the exploited iOS flaws are fixed
      in current iOS and the observed victims were Chinese-language crypto users; what is new here is the scale and delivery path, not the kit.
