    confidence: MEDIUM
    suggested_classification: { reliability: B, credibility: 2 }
    novelty: new
    references_suggested: ["2026-06-17/fishmonger-i-soon-ports-its-sprysocks-backdoor-to-windows-wi", "2026-07-14/eset-forgotten-uefi-shims-secure-boot-bypass"]
    references_note: "CVE-2023-24932 is already carried by the 2026-06-17 FishMonger entry in the store-wide CVE index, so check_run will require that entry in references[]"
    evidence:
      - quote: "the targeted machines were fully patched"
        attribution: "Kaspersky GReAT"
        source_url: "https://securelist.com/uefi-bootkit-blackx/121539/"
      - quote: "However, this revocation does not happen automatically upon patch installation"
        attribution: "Kaspersky GReAT"
        source_url: "https://securelist.com/uefi-bootkit-blackx/121539/"
      - quote: "we have attributed this attack to the APT41 threat actor with medium confidence"
        attribution: "Kaspersky GReAT"
        source_url: "https://securelist.com/uefi-bootkit-blackx/121539/"
      - quote: "these mitigations are not enabled by default"
        attribution: "Microsoft Support"
        source_url: "https://support.microsoft.com/en-us/servicing/os/windows/2023/03/how-to-manage-the-windows-boot-manager-revocations-for-secure-boot-changes-associated-with-cve-2023"
      - quote: "The Enforcement Phase will not begin before January 2026"
        attribution: "Microsoft Support"
        source_url: "https://support.microsoft.com/en-us/servicing/os/windows/2023/03/how-to-manage-the-windows-boot-manager-revocations-for-secure-boot-changes-associated-with-cve-2023"
      - quote: "there are limited indications that some SprySOCKS attack scenarios may involve a UEFI bootkit component"
        attribution: "ESET Research"
        source_url: "https://www.welivesecurity.com/en/eset-research/fishmongers-arsenal-upgraded-sprysocks-windows/"
    extended_notes: |
      Exposure: every Windows machine that boots with Secure Boot and has the July 2024 or later cumulative updates but has not had the
      revocation steps applied. Microsoft's documented check: the PowerShell test that the forbidden-list (DBX) variable matches 'Microsoft
      Windows Production PCA 2011' returns True once the revocation is in (event 1037 records the DBX update; 1036 the 2023 certificate added
      to the DB; 1799 the 2023-signed boot manager; 1042 the version-number update), and the Servicing registry value UEFICA2023Status
      should read Updated. Microsoft's step 3 sets AvailableUpdates=0x80 and runs the Secure-Boot-Update task; step 4 uses 0x200 for the firmware
      version number. Devices marked "High Confidence" in the monthly updates may already have step 1 (the 2023 certificates) done, which is
      not the revocation.
      Post-patch compromise check: a patched, unrevoked machine can still carry the bootkit; Kaspersky says the installer needs admin rights, so
      the hunt is for the admin-level intrusion that precedes it. Telemetry hooks the source supports: process creation of an executable
      from a program-data subfolder that takes an encrypted data file and a key as arguments; file writes to the EFI system partition by
      non-servicing processes; kernel-driver load events for drivers signed by unfamiliar or revoked certificates; security-product telemetry that
      goes silent (ETW providers, callbacks) after a reboot; a signed-looking executable renamed to a vendor updater loading a sideloaded DLL; and
      non-browser processes talking to consumer cloud storage APIs. Once the bootkit runs, host telemetry is unreliable by design, so firmware
      or boot-measurement attestation (TPM/PCR values, Secure Boot variables) is the trustworthy source.
      Hardening caveats from Microsoft's KB: the revocation cannot be reverted while Secure Boot stays in use; BitLocker recovery keys should be
      backed up first; older external boot media, PXE and recovery media signed with PCA 2011 stop booting; multi-boot systems must carry
      post-2024-07 updates in every OS; a Secure Boot reset to defaults can leave the machine unbootable.
      Suggested priority: high for Windows fleet owners (the mitigation gap is a default-off control); the observed targeting is diplomatic.
      No IOCs carried (file names, certificate subject, C2 hosts sit in the source).
