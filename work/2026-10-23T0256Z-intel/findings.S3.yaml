      - { url: "https://www.welivesecurity.com/en/eset-research/ebury-alive-unseen-400k-linux-servers-compromised-cryptotheft-financial-gain/", publisher: "ESET Research", date: "2024-05-14", role: "background" }
    discovery_trace: "first seen at: risky-biz-news, URL https://news.risky.biz/rss/ (feed, 2026-10-21 item 'Hacker hijacks 10% of Tor exit nodes') -> primary: kaba.cx post, URL https://kaba.cx/posts/20261020_Tor/ -> pivot: Tor Project notice, URL https://lists.torproject.org/mailman3/hyperkitty/list/tor-relays@lists.torproject.org/thread/WOHPLKCSHYXFTBRZXDENDKJZMBMPLMG5/ -> pivot: victim post-mortem, URL https://lists.torproject.org/mailman3/hyperkitty/list/tor-relays@lists.torproject.org/thread/QHRD6YOX6RZRDR7NCHNDO7GLCEA6VFM6/ -> corroboration: https://thehackernews.com/2026/10/attackers-hijacked-over-300-tor-exit.html -> background: ESET 2024 Ebury research"
    lookback: true
    summary: |
      An independent researcher (kaba) found that on 2026-10-02 roughly 10% of Tor's exit relays (333 in his scan of about 3,000) redirected SSH
