  - title: "CVE-2026-99999 (PwnEscape): a Linux kernel IPv4 checksum-offload flaw lets an untrusted KVM guest corrupt host kernel memory and escape; fixed in stable kernels from 2026-10-15, researcher expects working exploits within weeks"
    sources:
      - { url: "https://pwn.ai/blog/pwnescape", publisher: "PWNAI Research (Paulos Yibelo)", date: "2026-10-19", role: "primary" }
      - { url: "https://access.redhat.com/security/cve/cve-2026-99999", publisher: "Red Hat", date: "2026-10-15", role: "corroborating" }
      - { url: "https://news.risky.biz/risky-bulletin-pwnescape-vulnerability-lets-you-escape-kvm/", publisher: "Risky Bulletin (Catalin Cimpanu)", date: "2026-10-19", role: "corroborating" }
    discovery_trace: "first seen at: risky-biz-news, URL https://news.risky.biz/rss/ (feed, 2026-10-19 item 'PwnEscape vulnerability lets you escape KVM') -> primary: pwn.ai write-up, URL https://pwn.ai/blog/pwnescape -> pivot: CVE.org record read through https://cveawg.mitre.org/api/cve/CVE-2026-99999 (Linux CNA, published 2026-10-15; affected and fixed versions) -> pivot: Red Hat CVE page, URL https://access.redhat.com/security/cve/cve-2026-99999"
    lookback: true
    summary: |
      Researchers at PWNAI report a Linux kernel flaw, CVE-2026-99999 ("PwnEscape"), in the IPv4 stack: a guest-controlled checksum_start value in a
      CHECKSUM_PARTIAL packet is trusted after the kernel has validated the packet, so skb_checksum_help() writes at an attacker-chosen offset
      inside the IPv4 header and ip_do_fragment() later trusts the altered header length. The reachable path is a guest (for example a microVM)
      that transmits crafted virtio-net frames the VMM forwards to a host TAP interface; it is a guest-to-host or local path, not an internet
      receive path. The researcher demonstrated repeatable 32-byte host-memory disclosure, selected 64-byte host-kernel writes and a lab chain that
      ran a host-root helper on its own KVM fixture, and says other hypervisors are affected too; a Vercel sandbox contest report led to
      the finding. The Linux CNA record lists everything from 2.6.27 as affected, fixed in 5.10.272, 5.15.223, 6.1.190, 6.6.159, 6.12.113,
      6.18.57, 7.2.11 and mainline 7.3, scores it CVSS 3.1 9.3 (AV:L/PR:N/S:C), and notes crafted packets can also crash the host. Red Hat scores it
      8.8, marks every tracked product stream affected, says fixes are still being pursued, and states that mitigation is not available. The
      researcher says he expects exploits "in weaker configurations to arrive in weeks" and in default hypervisor configurations "in under a month" (a forecast,
      not an observation). Exploitation in the wild is not reported by any source I read: Red Hat's page says it tracks the flaw "as a KEV active-exploit case", but the
      CISA catalogue fetched on 2026-10-23 carries no entry for it, so that statement is unresolved.
    region_nexus: "global; shared-hosting, cloud, sandbox and CI/CD operators and any organization running KVM guests it does not fully trust"
    primary_sector_nexus: "indirect: administrations hosting multi-tenant or untrusted workloads on Linux KVM (OpenStack, libvirt, Proxmox-class stacks); this is not stated by a source, it follows from the affected component"
    sector: "technology"
    cves: [CVE-2026-99999]
    techniques: [T1611, T1068]
    affected_products: ["Linux kernel", "KVM on x86"]
    entity_keys: ["product:linux-kernel", "product:linux-kernel-kvm-x86"]
