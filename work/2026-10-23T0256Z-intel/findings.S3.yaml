  # ------------------------------------------------------------------ 9
  - title: "Hunt Intelligence: a Russian-speaking operator swept Ukraine for X-Road-based state data-exchange hosts and ran a Log4Shell chain against Graylog logging servers beside them, until an open working directory exposed the whole toolkit"
    sources:
      - { url: "https://hunt.io/blog/ukraine-state-data-exchange-graylog-log4shell", publisher: "Hunt Intelligence", date: "2026-10-21", role: "primary" }
      - { url: "https://news.risky.biz/risky-bulletin-hacker-hijacks-10-of-tor-exit-nodes/", publisher: "Risky Bulletin (Catalin Cimpanu)", date: "2026-10-21", role: "corroborating" }
    discovery_trace: "first seen at: risky-biz-news, URL https://news.risky.biz/rss/ (feed, 2026-10-21 item 'Hacker hijacks 10% of Tor exit nodes', section 'Ukraine data platform breach') -> primary: Hunt Intelligence write-up, URL https://hunt.io/blog/ukraine-state-data-exchange-graylog-log4shell"
    lookback: true
    summary: |
      Hunt Intelligence describes an operator who, between May and September 2026 and from one rented server, searched Ukrainian address space for hosts whose
      web page title reads "UXP Verifier", the message-log interface of a Cybernetica UXP security server (UXP is built on X-Road, whose security-server ports 5500,
      5577 and 4000 the operator also probed; the management port must not be internet-reachable, per the documentation Hunt cites). The operator obtained code
      execution on at least two Graylog logging servers at two Ukrainian organizations with a Log4Shell JNDI string placed in the username field of a POST to the
      Graylog sessions API, delivered through a two-stage CommonsBeanutils2 gadget chain; the exploit trees were mostly unmodified public proofs of concept. On one
      host the Elasticsearch cluster held 6,833,058 documents of the state data-exchange platform and the operator ran aggregate queries on a transaction schema it already
      knew; Hunt says it observed no exfiltration from that cluster, which is absence of evidence rather than proof. Risky Bulletin's summary says the actor "stole 6.8
      million documents", which the primary does not support; treat that as a contradiction in favour of Hunt. Hunt found it all because the operator served its working directory over
      HTTP for 17 hours (shell history, scan output, payload builder). Side findings: attempts against a hotel-management platform and a national e-government integration
      service, a failed original exploit for a RouterOS SCEP heap overflow (CVE-2021-41987) and a CVE-2018-14847 loop against nearby routers. Hunt shared the victim data with the national
      CERTs of the affected countries. No Swiss use of UXP or X-Road is stated anywhere in the sources.
    region_nexus: "Ukraine (victims); the technique and exposure pattern apply to any state data-exchange or interoperability platform and to internet-reachable log servers"
    primary_sector_nexus: "direct for public-sector interoperability platforms (state data exchange); no Swiss victim or deployment stated"
    sector: "public-sector"
    cves: []
    techniques: [T1190, T1595.001, T1059.004, T1572, T1213]
    affected_products: ["Graylog", "Cybernetica UXP", "X-Road", "Apache Log4j", "MikroTik RouterOS"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    suggested_classification: { reliability: B, credibility: 2 }
    novelty: new
    borderline: true
    borderline_reason: "Ukrainian victims, a 2021 vulnerability class and no confirmed data theft; returned for the concrete hunting hooks against Graylog and the targeting of a state data-exchange ecosystem, which is the nearest analogue to Swiss federal and cantonal interoperability platforms. Single vendor (Hunt), who also holds the artefacts."
    evidence:
      - quote: "Between May and September 2026, one operator worked from a single rented server to find a specific piece of software across Ukrainian address space."
        attribution: "Hunt Intelligence"
        source_url: "https://hunt.io/blog/ukraine-state-data-exchange-graylog-log4shell"
      - quote: "No exfiltration observed from the data-exchange logging cluster"
        attribution: "Hunt Intelligence"
        source_url: "https://hunt.io/blog/ukraine-state-data-exchange-graylog-log4shell"
      - quote: "POST requests to /api/system/sessions carrying a ${jndi: substring in the username field, paired with the X-Requested-By: cli header."
        attribution: "Hunt Intelligence"
        source_url: "https://hunt.io/blog/ukraine-state-data-exchange-graylog-log4shell"
      - quote: "A Russian-speaking threat actor has gained access to an Elasticsearch server and stole 6.8 million documents from Ukraine's state data-exchange platform."
        attribution: "Risky Bulletin"
        source_url: "https://news.risky.biz/risky-bulletin-hacker-hijacks-10-of-tor-exit-nodes/"
    extended_notes: |
      Exposure: Graylog (or any log-management stack) reachable from the internet and not patched against Log4Shell; X-Road/UXP security servers with message-exchange (5500),
      OCSP (5577) or management (4000) ports reachable from outside their partner network; a log cluster that holds full transaction records (client and service member
      codes, user IDs) is a high-value store in its own right.
      Detection (telemetry class first): web or reverse-proxy access logs on the log server for POST /api/system/sessions whose username field contains a ${jndi: string,
      paired with the X-Requested-By: cli header (the header is what Graylog's CSRF check requires, so it marks an attempt against this application); host process-creation
      events for a child process spawned from the Java service; outbound LDAP/JNDI callbacks from the log server; the ysoserial StubTranslet template name in captured payloads.
      Hunt advises hunting from the stager's access log, not the JNDI listener log. Hunt notes the operator-side port combination 8888 with 1389 and 8890 has no common
      legitimate use (addresses and paths are for retrohunting only).
      Hardening: update Graylog and Log4j, take log-management consoles off the internet, keep X-Road management and message ports to partner networks, and review who can
      query the transaction indices.
      Triage: a single request with a jndi string is routine internet noise; the discriminating signals are the cli header on the sessions endpoint plus a Java child process or a
      stager fetch seconds later.
      Suggested priority: low to notable. No IOCs carried (operator servers, ports, files and victim sectors sit in the source).
