  - title: "Vishing plus self-service password reset abuse yields a Primary Refresh Token session: Sophos incident response traces Graph reconnaissance, about 100,000 SharePoint downloads and a ServiceNow user-table export from one compromised account"
    sources:
      - { url: "https://www.sophos.com/en-us/blog/graph-reconnaissance-and-servicenow-user-enumeration-in-a-modern-identity-intrusion", publisher: "Sophos X-Ops", date: "2026-10-19", role: "primary" }
      - { url: "https://cloud.google.com/blog/topics/threat-intelligence/expansion-shinyhunters-saas-data-theft", publisher: "Mandiant / Google Threat Intelligence Group", date: "2026-01-31", role: "corroborating" }
    discovery_trace: "first seen at: sophos-xops, URL https://www.sophos.com/en-us/blog/feed?id=blt6f15f4f7deaf4242 (feed, 2026-10-19 item) -> primary (no pivot needed): extract of the Sophos post -> background pivot: the Mandiant post Sophos links, URL https://cloud.google.com/blog/topics/threat-intelligence/expansion-shinyhunters-saas-data-theft"
    summary: |
      Sophos X-Ops incident response describes a case in which an attacker phoned several employees posing as help desk staff; one user
      gave out the SMS verification code that completed a self-service password reset (SSPR), after an anomalous SSPR attempt from another
      address the day before. Within minutes the actor registered a new Windows device in Entra ID, used a Primary Refresh Token and
      authenticated Microsoft Edge with that device context; later federated sign-ins to ServiceNow show SAML 2.0 with the PRT and MFA
      recorded as "previously satisfied". Post-compromise activity from that single account, per Sophos's reading of Defender GraphApiAuditEvents,
      Purview and ServiceNow logs: Microsoft Graph reconnaissance (licence details, organization, tenant relationships, transitive directory
      role assignments, owned service principals, domains, sites, user counts), over 100 unique mail items and about 100,000 unique
      SharePoint files accessed, SharePoint search queries for credentials, PII and the name of the organization's identity-verification vendor,
      a ServiceNow sys_user export of about 2,500 records plus a view of the CMDB computer table, and a Salesforce sign-in that
      Salesforce's own anomaly containment froze. The actor deleted the organization's vishing-awareness mail from the victim's mailbox,
      created no inbox rules, forwarding or applications, and Sophos notes that passive reading of Teams messages leaves no audit event.
      Sophos does not attribute the activity; it points to Mandiant's reporting on ShinyHunters-linked vishing and SSO-to-SaaS fan-out as the
      same operational pattern, which is a similarity statement, not an attribution. Single incident, single vendor, no victim named.
    region_nexus: "global; victim unnamed, not a Sophos customer before the incident"
    primary_sector_nexus: "indirect: Microsoft 365 plus federated SaaS (ServiceNow, Salesforce) is a common public-sector stack; no public-sector victim named"
    sector: "technology"
