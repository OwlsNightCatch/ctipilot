  - title: "M365 token spray and replay: Huntress tracks a 10-week campaign that replays stolen post-MFA tokens from rented hosting, registers rogue Entra devices, wipes and re-registers MFA methods and hides mail with one-character inbox rules"
    sources:
      - { url: "https://www.huntress.com/blog/token-replay-spray", publisher: "Huntress", date: "2026-10-22", role: "primary" }
    discovery_trace: "first seen at: huntress, URL https://www.huntress.com/blog/rss.xml (feed, 2026-10-22T13:00Z item) -> primary (no pivot needed): extract of https://www.huntress.com/blog/token-replay-spray"
    summary: |
      Huntress reports that between 2026-07-14 and 2026-09-22 it detected 497 Microsoft 365 sign-in events across 79 victim organizations
      that replayed tokens stolen from users instead of guessing passwords; the figures come from Huntress's own telemetry. The tokens came from adversary-in-the-middle relays behind fake sign-in pages, from device-code
      phishing and from social engineering during a genuine login; the replay followed within minutes (12 minutes on 2026-07-21, 4 on
      2026-09-22) from a rotating set of six addresses in one rented hosting range, so a block on one address stopped at most one phase.
      Two toolsets appear: a scripted replayer (user agent "node", OAuth2:Token requests made with the Microsoft Office and Microsoft
      Authentication Broker client apps against Graph, Exchange Online, SharePoint Online and the Device Registration Service) that joins
      rogue Entra devices named DESKTOP- plus eight uppercase hex characters (48 of them; the Windows default is DESKTOP- plus seven
      alphanumerics), and a browser-session replayer using current Chrome/Edge via the OfficeHome client. Persistence is the part that
      outlives a password reset: in 19 organizations the victim's existing MFA methods were wiped and a new authenticator registered within
      three hours, and hidden inbox rules (one-to-three-character or punctuation-only names, moving mail to RSS Feeds or Conversation
      History, one keyed on payroll and bank terms, four created through the Outlook REST API) were created from VPN or other rented
      addresses, never from the replay range. Huntress notes that Conditional Access blocks (AADSTS53003) fire only after authentication
      succeeded, so they signal a valid credential, and that one address produced 1,052 blocked sign-ins in four tenants but 232 successes in
      28 others, so ranking tenants by failed attempts points responders at the wrong ones. Huntress states Microsoft Entra ID Protection
      independently flagged several of the addresses; that is Huntress's statement and was not checked against a Microsoft source.
    region_nexus: "global; Huntress customer base, no Swiss or public-sector victim named"
    primary_sector_nexus: "indirect: any Microsoft 365 / Entra ID tenant, public administration included; no public-sector victim named"
    sector: "technology"
    cves: []
    techniques: [T1557, T1566.002, T1528, T1550.001, T1078.004, T1098.005, T1556.006, T1564.008, T1090.003]
    affected_products: ["Microsoft Entra ID", "Microsoft 365", "Exchange Online", "SharePoint Online"]
    entity_keys: ["product:microsoft-entra-id", "product:microsoft-365"]
    new_entities:
      - { key: "campaign:m365-token-spray-replay-huntress-2026", type: campaign, name: "M365 token spray and replay campaign (Huntress)", aliases: [],
          summary: "Huntress-tracked July-September 2026 campaign replaying stolen post-MFA Microsoft 365 tokens against 79 organizations, with rogue Entra device registration, MFA-method replacement and hidden inbox rules (Huntress, 2026-10-22)." }
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    suggested_classification: { reliability: B, credibility: 2 }
    novelty: new
    evidence:
      - quote: "Between July 14, 2026 and September 22, 2026, Huntress detected 497 Microsoft 365 sign-in events across 79 victim organizations related to a token replay campaign"
        attribution: "Huntress"
        source_url: "https://www.huntress.com/blog/token-replay-spray"
      - quote: "In 19 organizations, the victim's existing MFA methods were wiped and a new method registered within three hours of the first sign-in from a campaign address."
        attribution: "Huntress"
        source_url: "https://www.huntress.com/blog/token-replay-spray"
      - quote: "the threat actor registered at least 48 fake computers in victim organizations' Microsoft directories"
        attribution: "Huntress"
        source_url: "https://www.huntress.com/blog/token-replay-spray"
      - quote: "A password reset alone does not remove attacker-registered devices or MFA methods."
        attribution: "Huntress"
        source_url: "https://www.huntress.com/blog/token-replay-spray"
    extended_notes: |
      Exposure: any tenant where users can reach Microsoft 365 from unmanaged networks and where Conditional Access does not require MFA or a
      compliant device for all users, all cloud apps and all client app types, and where the device-code flow is left open.
      Detection (telemetry class first): Entra sign-in logs (non-interactive and interactive) for OAuth2:Token and Cmsi:Cmsi requests from
      hosting or VPN ranges using the Office or Authentication Broker client with a "node" or bare "Mozilla/5.0" user agent, especially
      against mailboxes or the Device Registration Service; Entra audit log for device registrations from hosting addresses and device
      names of the DESKTOP-plus-eight-hex shape (Huntress: rare but not unique, confirm before deleting); security-info audit events where
      an MFA method is deleted and another added within minutes; Exchange audit for inbox rules created via the REST API with one-to-three
      character or punctuation-only names or targets such as RSS Feeds and Conversation History.
      Post-patch compromise check does not apply (no vulnerability); the remediation sequence Huntress gives is revoke sessions (the access
      token lives about 90 minutes after a reset), then audit devices, MFA methods, inbox rules and newly consented enterprise applications.
      Triage: a "node" user agent and Office client ID can be legitimate automation, so Huntress focuses on sign-ins that touch user
      mailboxes or the Device Registration Service from hosting infrastructure.
      Hardening named by the source: Conditional Access requiring MFA or block for All users / All cloud apps / All client app types
      unconditionally, restricting device-code flow with authentication-flow policies, and disabling user consent to new applications.
      Suggested priority: notable (generic cloud-identity tradecraft, no named Swiss exposure). No IOCs carried: the replay addresses,
      relay hosts and client-app GUIDs sit in the source.
