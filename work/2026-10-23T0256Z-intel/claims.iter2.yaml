  - claim_id: 8920fe69a6
    entry: 2026-10-23/m365-token-spray-replay-rogue-entra-devices-mfa-wipe
    surface: "body"
    kind: cited
    text: "**Triage:** a `node` user agent with an Office client identifier can be legitimate automation, so Huntress focuses on sign-ins that touch user mailboxes or the Device Registration Service from hosting infrastructure, and it says the device-name pattern is rare but not unique to this campaign, so a device should be confirmed before it is deleted ("
    urls: ["https://www.huntress.com/blog/token-replay-spray"]
  - claim_id: 4f1f25a4b5
    entry: 2026-10-23/m365-token-spray-replay-rogue-entra-devices-mfa-wipe
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** revoke sessions as well as resetting the password, because the access token lives about 90 minutes after a reset, then audit devices, MFA methods, inbox rules and newly consented enterprise applications; as controls, require MFA or block for all users, all cloud apps and all client app types unconditionally, restrict the device-code flow with authentication-flow policies, and disable user consent to new applications ("
    urls: ["https://www.huntress.com/blog/token-replay-spray"]
  - claim_id: 3bba3bf3db
    entry: 2026-10-23/blackx-uefi-bootkit-baton-drop-revocation-default-off
    surface: "headline"
    kind: frontmatter
    text: "Kaspersky: a UEFI bootkit ran on fully patched Windows because Microsoft's Secure Boot revocation is off by default"
  - claim_id: b896772fb3
    entry: 2026-10-23/blackx-uefi-bootkit-baton-drop-revocation-default-off
    surface: "summary"
    kind: frontmatter
    text: "Kaspersky GReAT reports BlackX, a UEFI bootkit similar to BlackLotus that exploits Baton Drop (CVE-2022-21894) to enrol attacker keys and load a kernel driver that blinds security products, installed after attackers held administrator rights on networks of diplomatic agencies in Tajikistan, Uzbekistan and Turkmenistan; Kaspersky attributes it to APT41 with medium confidence. The targeted machines were fully patched, because Microsoft's fix revokes the old boot-manager certificate only when an administrator sets a registry flag and runs a scheduled task."
