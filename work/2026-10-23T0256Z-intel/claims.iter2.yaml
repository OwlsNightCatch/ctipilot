    text: "**Defender takeaway:** move management access behind a jump box or trusted internal addresses now, and remove management profiles from dataplane interfaces that face untrusted networks; Palo Alto lists no workaround beyond that restriction and the Threat Prevention coverage; its revision of 2026-10-23 schedules the first PAN-OS hotfixes for 2026-10-26 (10.2.18-h13, 11.1.16-h4 and 11.2.10-h16) and the rest by 2026-10-30, so install the hotfix of each train when it is released, while Panorama and the WF-500 appliances stay on the restriction until Palo Alto dates them ("
    urls: ["https://security.paloaltonetworks.com/CVE-2026-109618"]
  - claim_id: 59279b1b66
    entry: 2026-10-22/pan-os-panorama-php2shell-mgmt-interface-no-fixed-release
    surface: "body"
    kind: derived
    text: "**Detection:** in management-plane access and system logs, any request from an address outside the administrator range, though Palo Alto does not say which logs record request bodies; in threat logs, hits on the Threat IDs above where the signatures are active and the four conditions hold."
  - claim_id: 22abe19ad0
    entry: 2026-10-22/pan-os-panorama-php2shell-mgmt-interface-no-fixed-release
    surface: "section 2026-10-23T03:42:16Z"
    kind: cited
    text: "Palo Alto Networks revised its advisory on 2026-10-23: the WildFire appliances WF-500 and WF-500-B are now listed as affected in all versions, and the footnotes say Cortex XCORE (SaaS) was remediated on 2026-10-21 and WildFire Cloud on 2026-10-22 ("
    urls: ["https://security.paloaltonetworks.com/CVE-2026-109618"]
  - claim_id: ae918052bb
    entry: 2026-10-22/pan-os-panorama-php2shell-mgmt-interface-no-fixed-release
    surface: "section 2026-10-23T03:42:16Z"
    kind: cited
    text: "The advisory now also gives estimated availability dates for hotfix builds of every supported PAN-OS train, from 2026-10-26 (for example 10.2.18-h13, 11.1.16-h4 and 11.2.10-h16) to 2026-10-30, while Panorama and the WildFire appliances remain with no date ("
    urls: ["https://security.paloaltonetworks.com/CVE-2026-109618"]
  - claim_id: c5d60a0b4c
    entry: 2026-10-22/pan-os-panorama-php2shell-mgmt-interface-no-fixed-release
    surface: "section 2026-10-23T03:42:16Z"
    kind: cited
    text: "Palo Alto still states that it is not aware of malicious exploitation against its products, and the Threat Prevention coverage and the jump-box restriction are unchanged ("
    urls: ["https://security.paloaltonetworks.com/CVE-2026-109618"]
  - claim_id: 7fccfd731c
    entry: 2026-10-22/pan-os-panorama-php2shell-mgmt-interface-no-fixed-release
    surface: "section 2026-10-23T03:42:16Z"
    kind: uncited
    text: "The advisory names the management web interface only for PAN-OS and does not say which interface of the WildFire appliances is reachable."
  - claim_id: 7f43bc5a76
    entry: 2026-10-22/pan-os-panorama-php2shell-mgmt-interface-no-fixed-release
    surface: "record 2026-10-23T03:42:16Z"
    kind: record-summary
    text: "Palo Alto Networks' revised advisory now also lists the WildFire appliances WF-500 and WF-500-B as affected by the PHP flaws in all versions, schedules hotfix builds of every PAN-OS train between 2026-10-26 and 2026-10-30, and leaves Panorama and WF-500 undated; Cortex XCORE (SaaS) and WildFire Cloud are already remediated."
  - claim_id: 3d0f2e0702
    entry: 2026-10-23/cve-2026-114625-arista-velocloud-orchestrator-sqli-exploited
    surface: "headline"
    kind: frontmatter
    text: "Arista confirms exploitation of a VeloCloud Orchestrator flaw: any tenant login, even read-only, reaches operator rights"
  - claim_id: 7b359d2e66
    entry: 2026-10-23/cve-2026-114625-arista-velocloud-orchestrator-sqli-exploited
    surface: "summary"
    kind: frontmatter
    text: "Arista's Security Advisory 0199 of 2026-10-22 fixes CVE-2026-114625 (CVSS 3.1 9.9) in on-premises VeloCloud Orchestrator: any authenticated user, down to the lowest built-in tenant role, can gain operator privileges and reach functions meant for internal use only, and Arista says the flaw is known to be actively exploited. Fixed releases are 5.2.3.18, 6.1.3.10 and 6.4.2.12; hosted and dedicated Orchestrators were already patched, and Arista names no actor, victim count or start date."
  - claim_id: cceca42731
    entry: 2026-10-23/cve-2026-114625-arista-velocloud-orchestrator-sqli-exploited
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade every on-premises VeloCloud Orchestrator to 5.2.3.18, 6.1.3.10 or 6.4.2.12 (or later in its train) now and, until then, restrict its web interface to trusted administrative networks; before upgrading, preserve the web access, application, system and database logs and the file-system timestamps, then check the host for backdoor daemons, web shells and unexpected outbound traffic."
  - claim_id: 682cb9a8d5
    entry: 2026-10-23/cve-2026-114625-arista-velocloud-orchestrator-sqli-exploited
    surface: "cves[CVE-2026-114625]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-114625\", \"cvss\": \"9.9 (CVSS 3.1) / 9.4 (CVSS 4.0)\", \"status\": [\"exploited\", \"patch-available\"], \"affected\": \"on-prem VeloCloud Orchestrator 5.2.x before 5.2.3.18, 6.1.x before 6.1.3.10 and 6.4.x before 6.4.2.12 (end-of-support releases not assessed)\", \"fixed\": \"5.2.3.18, 6.1.3.10 and 6.4.2.12 (and later in each train)\", \"auth\": \"post-auth\", \"vector\": \"zero-click\"}"
  - claim_id: 2bebe6f6be
    entry: 2026-10-23/cve-2026-114625-arista-velocloud-orchestrator-sqli-exploited
    surface: "body"
    kind: cited
    text: "Arista's Security Advisory 0199 of 2026-10-22 covers CVE-2026-114625 (CVSS 3.1 9.9, CVSS 4.0 9.4, CWE-89 SQL injection) in the on-premises VeloCloud Orchestrator (VCO): on an affected system any authenticated user can gain operator privileges and masquerade as a local \"superuser operator\", which includes access to functionality intended for internal use only and not for remote access ("
    urls: ["https://www.arista.com/en/support/advisories-notices/security-advisory/24838-security-advisory-0199"]
  - claim_id: 536766b286
    entry: 2026-10-23/cve-2026-114625-arista-velocloud-orchestrator-sqli-exploited
    surface: "body"
    kind: cited
    text: "Arista states that it detected the issue and that it is known to be actively exploited, and the advisory names no actor, victim count or start date ("
    urls: ["https://www.arista.com/en/support/advisories-notices/security-advisory/24838-security-advisory-0199"]
  - claim_id: 0fef6dc835
    entry: 2026-10-23/cve-2026-114625-arista-velocloud-orchestrator-sqli-exploited
    surface: "body"
    kind: cited
    text: "The prerequisite is network access to the VCO web interface and a valid session on the VCO portal; the lowest role that suffices is Enterprise Read Only, the lowest built-in tenant role, the interface is exposed by default and no configuration prevents the exposure ("
    urls: ["https://www.arista.com/en/support/advisories-notices/security-advisory/24838-security-advisory-0199"]
  - claim_id: aefb7c6519
    entry: 2026-10-23/cve-2026-114625-arista-velocloud-orchestrator-sqli-exploited
    surface: "body"
    kind: cited
    text: "Affected are VCO 5.2.x before 5.2.3.18, 6.1.x before 6.1.3.10 and 6.4.x before 6.4.2.12, and end-of-support releases were not assessed; hosted and dedicated VCO were affected and are already patched, while VeloCloud Gateway and VeloCloud Edge are not affected ("
    urls: ["https://www.arista.com/en/support/advisories-notices/security-advisory/24838-security-advisory-0199"]
  - claim_id: 3fd45dbb1b
    entry: 2026-10-23/cve-2026-114625-arista-velocloud-orchestrator-sqli-exploited
    surface: "body"
    kind: cited
    text: "Arista's recommended resolution is the upgrade, and for an unsupported release train it points customers to its support centre to discuss upgrade options ("
    urls: ["https://www.arista.com/en/support/advisories-notices/security-advisory/24838-security-advisory-0199"]
  - claim_id: a0e6d89117
    entry: 2026-10-23/cve-2026-114625-arista-velocloud-orchestrator-sqli-exploited
    surface: "body"
    kind: cited
    text: "); its CSAF file records the CVSS 3.1 score and the same interim measures ("
    urls: ["https://www.arista.com/assets/data/SecurityAdvisories/CSAF/arista_networks_security_advisory_199_CSAF.json"]
  - claim_id: bbaac6d08d
    entry: 2026-10-23/cve-2026-114625-arista-velocloud-orchestrator-sqli-exploited
    surface: "body"
    kind: cited
    text: "**Exposure:** an on-premises VCO on one of the three trains above, reachable at its web interface by anyone who holds a portal login of any role, a customer-tenant account included; Arista's list is by train, so compare each Orchestrator against the three fixed releases ("
    urls: ["https://www.arista.com/en/support/advisories-notices/security-advisory/24838-security-advisory-0199"]
  - claim_id: bae3d9fe69
    entry: 2026-10-23/cve-2026-114625-arista-velocloud-orchestrator-sqli-exploited
    surface: "body"
    kind: cited
    text: "**Detection:** web access logs of the VCO for requests with unusual URL-like path components, encoded characters, references to local or internal services and high request rates; outbound connections from the VCO host that the Orchestrator does not normally make; backdoor daemons and web shells on the host; and recent administrator activity for changes nobody made ("
    urls: ["https://www.arista.com/en/support/advisories-notices/security-advisory/24838-security-advisory-0199"]
  - claim_id: 46cdabcbaf
    entry: 2026-10-23/cve-2026-114625-arista-velocloud-orchestrator-sqli-exploited
    surface: "body"
    kind: cited
    text: "Arista asks operators to preserve the web, application, system and database logs and the file-system timestamps before remediation where feasible, and its advisory does not say that the upgrade removes a foothold that is already there ("
    urls: ["https://www.arista.com/en/support/advisories-notices/security-advisory/24838-security-advisory-0199"]
  - claim_id: b22fef68aa
    entry: 2026-10-23/cve-2026-114625-arista-velocloud-orchestrator-sqli-exploited
    surface: "body"
    kind: cited
    text: "**Triage:** a session authenticated as a low-privilege tenant account, Enterprise Read Only above all, that reaches operator-only or internal-only functions is the signal, because legitimate operators act from their own accounts; Arista lists attacker source addresses in its advisory ("
    urls: ["https://www.arista.com/en/support/advisories-notices/security-advisory/24838-security-advisory-0199"]
  - claim_id: c42056aaa8
    entry: 2026-10-23/cve-2026-114625-arista-velocloud-orchestrator-sqli-exploited
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** upgrade the Orchestrator to a fixed release of its train now, restrict the web interface to administrative networks in the meantime, and on any Orchestrator that was reachable and unpatched keep the logs first and then check the host for backdoor daemons and web shells."
  - claim_id: 5ac7b8c279
    entry: 2026-10-23/hpesbnw05162-hpe-aruba-aos-8-aos-10-72-cves-19-unauth
    surface: "headline"
    kind: frontmatter
    text: "HPE's Aruba wireless bulletin fixes 19 unauthenticated network flaws at CVSS 9.0+; no exploitation or public code known"
  - claim_id: 7384d74480
    entry: 2026-10-23/hpesbnw05162-hpe-aruba-aos-8-aos-10-72-cves-19-unauth
    surface: "summary"
    kind: frontmatter
    text: "HPE Networking's bulletin HPESBNW05162 of 2026-10-22 fixes 72 CVEs in AOS-8 and AOS-10 for Mobility Conductors, Controllers, Gateways and access points, 34 of them at CVSS 3.1 9.0 or higher and 19 of those reachable over the network without authentication (eight at 10.0). HPE found the flaws through internal research, knows of no public discussion or exploit code, and strongly urges patching; its only workaround is to confine the CLI and web management interfaces to a dedicated segment behind firewall policy."
  - claim_id: 2d47c6bbb4
    entry: 2026-10-23/hpesbnw05162-hpe-aruba-aos-8-aos-10-72-cves-19-unauth
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade every HPE Networking (Aruba) Mobility Conductor, Controller, Gateway and access point on AOS-10 or AOS-8 to the fixed build of its train (10.8.1.2, 10.7.2.7, 10.4.1.14, 8.13.3.1 or 8.10.0.24), and until then confine the CLI and web management interfaces to a dedicated layer 2 segment or VLAN behind firewall policy, as HPE advises."
