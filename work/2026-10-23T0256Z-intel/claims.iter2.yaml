  - claim_id: 6b2e6f847a
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "headline"
    kind: frontmatter
    text: "Eight eMudhra CA keys were guessable; browsers are protected, Go, Java, Python, Rust and curl stacks need updates"
  - claim_id: 762cd1ee57
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "summary"
    kind: frontmatter
    text: "On 2026-10-17 a researcher reported that the private keys of eight eMudhra intermediate CA certificates had been generated with too little randomness, so anyone could recover them and forge trusted HTTPS certificates for any site. Firefox, Chrome, Apple and Microsoft platforms now block the intermediates and eMudhra revoked them, but software that keeps its own trust store or does not check revocation stays exposed until updated; Go fixed it in 1.27.3 and 1.26.10 as CVE-2026-111943, Oracle and OpenJDK shipped a Java distrust update on 2026-10-21 as CVE-2026-91403 (CVSS 3.1 9.1), and Chrome removes the emSign ECC Root CA - G3 root on 2026-10-27. No exploitation is reported."
  - claim_id: efd5a3feff
