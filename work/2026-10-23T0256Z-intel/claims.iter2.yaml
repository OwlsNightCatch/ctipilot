    kind: frontmatter
    text: "NetScaler Product Security says the two PHP flaws CVE-2026-109618 and CVE-2026-109619 affect the NetScaler Management Portal, reached through the NSIP GUI, any SNIP that permits management access and the cluster IP GUI, on all supported software versions; NetScaler Console and SVM are not affected. Citrix plans fixes for all supported versions on 2026-10-27 and tells customers to restrict management access to trusted networks now; its post does not say whether NetScaler has been attacked."
