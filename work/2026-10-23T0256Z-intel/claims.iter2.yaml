claims:
  - claim_id: 026a3e8f43
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "headline"
    kind: frontmatter
    text: "PK Softech kept Publica data it had promised in writing to delete; Tamedia says Akira holds about 100 GB"
  - claim_id: 876fb5446f
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "summary"
    kind: frontmatter
    text: "PK Softech AG, the software supplier of Publica and other Swiss pension funds, says unknown attackers used malware to reach part of its IT and that data must be assumed to have left; the Confederation headlined its 2026-10-08 release \"data outflow confirmed\", and the Federal Prosecutor's Office is investigating. Tamedia reports that PK Softech had confirmed in writing in January 2026 that it deleted Publica's 2019 migration data, which apparently stayed on its servers, and that Akira holds about 100 GB and demands ransom; Inside IT relays this and adds that the Federal Prosecutor's Office confirmed Akira took data, and Netzwoche relays that the authorities assume data on practically all current and former federal and federally affiliated staff left. Publica says personal data of insured persons has presumably left; the Pensionskasse Stadt Zürich says its insured persons' test data was stolen, the Pensionskasse Post says personal data left, the Bernische Pensionskasse says it must be assumed so, the Ticino fund IPCT says all its insured could potentially be involved, and other funds are still checking. No first-hand statement by the Confederation or Publica on the actor, the demand or the scope is available to cite."
  - claim_id: dd992791cc
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "actions[0]"
    kind: frontmatter
    text: "Tell the helpdesk, HR and payroll teams of every body whose staff are insured with Publica (including the federal administration and the ETH domain) or with the Pensionskasse Stadt Zürich, which says data of its insured persons and pensioners was stolen, that AHV number, date of birth, address, salary and IBAN may now be known to criminals and must not count as proof of identity, and route requests that quote them, a request to change a payout account included, to a call-back on a known number; for staff insured with Pensionskasse Post, the Bernische Pensionskasse (which now says it must be assumed personal data left), the Ticino cantonal fund IPCT (which says all its insured could potentially be involved), a fund administered or advised by Libera AG or the Bernische Lehrerversicherungskasse apply the same rule until those funds report the scope; also tell insured staff that cantonal police warn of investment-fraud calls from people who know their salary and pension details, which prove nothing about the caller."
  - claim_id: 3aeb339533
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "actions[1]"
    kind: frontmatter
    text: "If your organisation's pension administration, HR or payroll runs on PK Softech software, is being migrated to it or tested on it, or your staff are insured with Pensionskasse Post, ask the supplier or the fund in writing whether your data, test data included, was in the affected environment and what it holds."
  - claim_id: a0e3760c1a
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "body"
    kind: cited
    text: "The Confederation, in a release headlined \"data outflow confirmed\" (translated from German), says an external software supplier of the federal pension fund Publica detected a cyberattack at the end of September, informed its other customers, and that the Federal Prosecutor's Office has opened an investigation; no other federal office has a business relationship with the supplier ("
    urls: ["https://www.admin.ch/de/newnsb/FjG4XOIms04s"]
