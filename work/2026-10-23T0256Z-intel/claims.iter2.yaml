    entry: 2026-10-23/blackx-uefi-bootkit-baton-drop-revocation-default-off
    surface: "body"
    kind: cited
    text: "Kaspersky attributes the campaign to APT41 with medium confidence, resting on the identifier \"xdd\" shared with a kernel implant in ESET's June 2026 FishMonger report, DLL sideloading and OLLVM ("
    urls: ["https://securelist.com/uefi-bootkit-blackx/121539/"]
  - claim_id: e3ffbf9780
