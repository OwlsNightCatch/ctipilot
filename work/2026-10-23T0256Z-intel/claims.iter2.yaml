  - claim_id: b6d73ed16e
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "body"
    kind: cited
    text: "Tamedia's Tages-Anzeiger reports that the Akira ransomware group holds about 100 GB of compressed pension data on well over 100,000 current and former federal employees, including staff of the security authorities, and demands ransom, which Inside IT relays without the volume; neither the Confederation nor Publica has confirmed the perpetrator or the demand, and Publica says it still has no indication that data was published on the darkweb ("
    urls: ["https://www.tagesanzeiger.ch/akira-gruppe-alt-bundesraete-von-hacker-angriff-betroffen-181002064025", "https://www.inside-it.ch/datenleck-bei-publica-gefaehrdet-auch-sicherheitsbehoerden-20261020", "https://www.publica.ch/de/cyberangriff-auf-softwarelieferanten"]
  - claim_id: 1e9fd4d5b4
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "body"
    kind: cited
    text: "Netzwoche, relaying the same paper, adds that the Federal Council and the security authorities now assume data on practically all current and former federal and federally affiliated staff left, federal judges and former Federal Council members among them, which no authority has confirmed ("
    urls: ["https://www.netzwoche.ch/news/2026-10-08/bundespensionskasse-publica-meldet-datenabfluss"]
  - claim_id: a84df93538
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "body"
    kind: cited
    text: "PK Softech had confirmed in writing to Publica in January 2026 that it deleted the data of the 2019 migration and held no personal data in plaintext, and the Tages-Anzeiger reports that this apparently did not happen, because the data was still on its servers when the attackers got in ("
    urls: ["https://www.tagesanzeiger.ch/akira-hacker-erpressen-loesegeld-mit-publica-daten-654128340841", "https://www.inside-it.ch/publica-wollte-pensionskassendaten-loeschen-lassen-20261022"]
  - claim_id: f1f786cf97
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "body"
    kind: cited
    text: "Publica confirmed the sequence to the paper: after the Xplain case it asked PK Softech to delete all legacy data, including that of the 2019 migration, and received written confirmation, and it is now clarifying why personal data presumably lay on the servers, while PK Softech did not answer and says it does not comment on individual customer relationships ("
    urls: ["https://www.inside-it.ch/publica-wollte-pensionskassendaten-loeschen-lassen-20261022"]
  - claim_id: fa3efc3bb1
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "body"
    kind: cited
    text: "Inside IT, citing Tamedia, adds that the Federal Prosecutor's Office confirmed that data was extracted by the Akira ransomware group, which 20 Minuten words as according to findings so far; the statement is second-hand and Publica's own page of 2026-10-20 still says it is clarifying whether and whose Publica data left ("
    urls: ["https://www.inside-it.ch/publica-wollte-pensionskassendaten-loeschen-lassen-20261022", "https://www.20min.ch/story/daten-gau-trotz-loeschbestaetigung-bundesdaten-landeten-bei-hackern-103653740", "https://www.publica.ch/de/cyberangriff-auf-softwarelieferanten"]
  - claim_id: f5e9b21096
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "body"
    kind: cited
    text: "The Ticino cantonal pension fund IPCT says through Corriere del Ticino, relayed by Ticinonline, that potentially all of its insured could be involved, that there is no evidence yet that their data was taken, and that it has filed a complaint with the Federal Prosecutor's Office ("
    urls: ["https://www.tio.ch/ticino/cronaca/1958050/informazioni-ticino-dati-ipct-attacco"]
  - claim_id: ea3d7f4f12
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "body"
    kind: cited
    text: "**Detection:** Publica warns that misuse of the data cannot be ruled out and asks members to watch for unusual e-mails, calls or messages ("
