    urls: ["https://community.citrix.com/techzone-blogs/110_security-updates/protecting-netscaler-management-access-from-php-cve-2026-109618-cve-2026-109619-r1640/"]
  - claim_id: 30225fc9f6
    entry: 2026-10-23/netscaler-php2shell-management-gui-fixes-2026-10-27
    surface: "body"
    kind: cited
    text: "**Exposure:** every NetScaler ADC and Gateway on a supported version whose NSIP, a management-enabled SNIP or the cluster IP answers on its GUI or API from a network that is not a trusted administrative one; a SNIP or VIP can also carry application traffic, so Citrix tells customers to scope ACLs to management protocols and ports ("
    urls: ["https://community.citrix.com/techzone-blogs/110_security-updates/protecting-netscaler-management-access-from-php-cve-2026-109618-cve-2026-109619-r1640/"]
  - claim_id: 68161c6c49
    entry: 2026-10-23/netscaler-php2shell-management-gui-fixes-2026-10-27
    surface: "body"
    kind: cited
    text: "**Detection:** connections to the management GUI and API from addresses that are not the administrative hosts, which is also the test of whether the ACLs hold; Citrix's post publishes no detection guidance and does not say whether NetScaler has been attacked ("
    urls: ["https://community.citrix.com/techzone-blogs/110_security-updates/protecting-netscaler-management-access-from-php-cve-2026-109618-cve-2026-109619-r1640/"]
  - claim_id: 697289085e
    entry: 2026-10-23/netscaler-php2shell-management-gui-fixes-2026-10-27
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** apply the management ACLs now and keep a recovery path such as console access in case a rule blocks administration, then install the fixed builds on 2026-10-27; the PHP project's own fixed releases do not help an appliance owner until Citrix ships its package, and no fix is listed in Citrix's post as of 2026-10-22 ("
    urls: ["https://community.citrix.com/techzone-blogs/110_security-updates/protecting-netscaler-management-access-from-php-cve-2026-109618-cve-2026-109619-r1640/"]
