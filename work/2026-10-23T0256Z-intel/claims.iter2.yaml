    entry: 2026-10-23/m365-token-spray-replay-rogue-entra-devices-mfa-wipe
    surface: "headline"
    kind: frontmatter
    text: "Huntress: stolen post-MFA M365 tokens replayed within minutes; a password reset leaves planted devices and MFA methods"
  - claim_id: 70fc3dcadd
    entry: 2026-10-23/m365-token-spray-replay-rogue-entra-devices-mfa-wipe
    surface: "summary"
    kind: frontmatter
    text: "Huntress reports that between 2026-07-14 and 2026-09-22 it detected 497 Microsoft 365 sign-in events in 79 organizations that replayed tokens stolen through adversary-in-the-middle relays, device-code phishing and social engineering, within minutes of capture and from one rented hosting range. The operators then registered rogue Entra devices, wiped and replaced MFA methods in 19 organizations and hid mail with inbox rules; a password reset alone removes none of it."
  - claim_id: 3f7b3433fc
    entry: 2026-10-23/m365-token-spray-replay-rogue-entra-devices-mfa-wipe
    surface: "actions[0]"
    kind: frontmatter
    text: "In every Entra tenant, list the devices registered since 2026-07-14 whose names are DESKTOP- followed by eight uppercase hexadecimal characters, the authenticators that were deleted and re-registered within minutes, and the inbox rules whose names are one to three characters or punctuation only or that move mail to RSS Feeds, RSS Subscriptions or Conversation History, and remove what nobody created; then revoke the sessions of any affected user, because a password reset leaves the devices, MFA methods and a roughly 90-minute access token in place."
  - claim_id: de5af14f47
    entry: 2026-10-23/m365-token-spray-replay-rogue-entra-devices-mfa-wipe
    surface: "body"
    kind: cited
    text: "Between 2026-07-14 and 2026-09-22 Huntress detected 497 Microsoft 365 sign-in events across 79 victim organizations that replayed stolen sign-in tokens instead of guessing passwords ("
