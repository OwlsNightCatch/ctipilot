    entry: 2026-10-23/netscaler-php2shell-management-gui-fixes-2026-10-27
    surface: "body"
    kind: cited
    text: "NetScaler Product Security says NetScaler is affected by the two PHP memory-safety flaws CVE-2026-109618 and CVE-2026-109619 because the NetScaler Management Portal uses PHP, that Citrix is working to upgrade the PHP package, and that all supported software versions are affected ("
    urls: ["https://community.citrix.com/techzone-blogs/110_security-updates/protecting-netscaler-management-access-from-php-cve-2026-109618-cve-2026-109619-r1640/"]
  - claim_id: 43eb2a4c0f
    entry: 2026-10-23/netscaler-php2shell-management-gui-fixes-2026-10-27
    surface: "body"
    kind: cited
    text: "Citrix describes both as critical flaws in PHP that could let an unauthenticated attacker execute code in the context of the affected PHP process, each rated 9.2 under CVSS 4.0: CVE-2026-109618 is memory corruption when PHP handles an out-of-memory condition during request processing, and CVE-2026-109619 is stale request state that persists after memory is released and is reused by a later request ("
    urls: ["https://community.citrix.com/techzone-blogs/110_security-updates/protecting-netscaler-management-access-from-php-cve-2026-109618-cve-2026-109619-r1640/"]
  - claim_id: 6ce25be121
    entry: 2026-10-23/netscaler-php2shell-management-gui-fixes-2026-10-27
    surface: "body"
    kind: cited
    text: "The affected surfaces are the NSIP GUI, any SNIP configured to permit management access and the cluster IP GUI in a cluster; NetScaler Console (service and on premises) and NetScaler SVM are not affected ("
    urls: ["https://community.citrix.com/techzone-blogs/110_security-updates/protecting-netscaler-management-access-from-php-cve-2026-109618-cve-2026-109619-r1640/"]
  - claim_id: a4af1f7f54
    entry: 2026-10-23/netscaler-php2shell-management-gui-fixes-2026-10-27
    surface: "body"
    kind: cited
    text: "Citrix plans to release fixes for all supported versions on 2026-10-27 and, until then, tells customers to restrict GUI and API access on those addresses to trusted administrative hosts or narrowly scoped management networks, to keep management interfaces off the internet behind jump hosts or tight ACLs, and to review every address that permits GUI or API management and verify that it is not broadly reachable ("
    urls: ["https://community.citrix.com/techzone-blogs/110_security-updates/protecting-netscaler-management-access-from-php-cve-2026-109618-cve-2026-109619-r1640/"]
