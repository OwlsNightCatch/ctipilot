  - claim_id: f16892e3e1
    entry: 2026-10-23/mythicratatoskr-yggdrasil-mesh-c2-uac-0099-sandworm-wiper
    surface: "headline"
    kind: frontmatter
    text: "ESET: a backdoor reaches its C2 through the Yggdrasil mesh; Sandworm wiped the victim two months after UAC-0099 got in"
  - claim_id: 65b4a45bd6
    entry: 2026-10-23/mythicratatoskr-yggdrasil-mesh-c2-uac-0099-sandworm-wiper
    surface: "summary"
    kind: frontmatter
    text: "ESET reports that UAC-0099 gained access to a Ukrainian grain logistics company on 2025-07-16 with a spearphishing attachment and a day later deployed MythicRatatoskr, a Go backdoor whose command server sits inside the Yggdrasil mesh network, reached through public peers; on 2025-09-17 the SDelete utility was deployed through Group Policy, which ESET assesses with high confidence as Sandworm after UAC-0099 handed off the access. ESET names blocking the public peer addresses as a viable mitigation."
  - claim_id: 3a96db0a64
    entry: 2026-10-23/mythicratatoskr-yggdrasil-mesh-c2-uac-0099-sandworm-wiper
    surface: "body"
    kind: cited
    text: "ESET reports that on 2025-07-16 UAC-0099 gained access to a Ukrainian grain logistics company through a spearphishing attachment: a scheduled task ran a PowerShell payload, the MATCHBOIL downloader deployed the MATCHWOK backdoor, and the next day a previously undocumented Go backdoor, MythicRatatoskr, arrived, which ESET ties to that chain with high confidence because of the timing ("
    urls: ["https://www.welivesecurity.com/en/eset-research/mythicratatoskr-yggdrasil-enabled-backdoor-deployed-uac0099-sandworm-collaboration/"]
  - claim_id: 5e43adc999
    entry: 2026-10-23/mythicratatoskr-yggdrasil-mesh-c2-uac-0099-sandworm-wiper
    surface: "body"
    kind: cited
    text: "Further copies reached other machines through an OpenSSH SFTP server, and a SOCKS5 server appeared on some of them ("
    urls: ["https://www.welivesecurity.com/en/eset-research/mythicratatoskr-yggdrasil-enabled-backdoor-deployed-uac0099-sandworm-collaboration/"]
  - claim_id: 018c5dbdca
    entry: 2026-10-23/mythicratatoskr-yggdrasil-mesh-c2-uac-0099-sandworm-wiper
    surface: "body"
    kind: cited
    text: "About two months later, on 2025-09-17, the SDelete utility was deployed through Active Directory Group Policy, which ESET calls standard Sandworm tradecraft and assesses with high confidence as Sandworm after UAC-0099 handed off the access; ESET could not say which group operated MythicRatatoskr, and it sets the pair beside the earlier Gamaredon and Turla collaboration ("
    urls: ["https://www.welivesecurity.com/en/eset-research/mythicratatoskr-yggdrasil-enabled-backdoor-deployed-uac0099-sandworm-collaboration/"]
  - claim_id: c8d811588a
    entry: 2026-10-23/mythicratatoskr-yggdrasil-mesh-c2-uac-0099-sandworm-wiper
    surface: "body"
    kind: cited
    text: "The backdoor is built on the user-space yggstack, so it needs no tunnel interface or privileges to join the Yggdrasil mesh, an encrypted IPv6 overlay in the 200::/7 range: it picks three peers at random from an embedded list of public peers and then speaks JSON over HTTPS on port 443 to a command server that has an address only inside the mesh, and some samples wait ten minutes before connecting ("
    urls: ["https://www.welivesecurity.com/en/eset-research/mythicratatoskr-yggdrasil-enabled-backdoor-deployed-uac0099-sandworm-collaboration/"]
  - claim_id: b602230d03
    entry: 2026-10-23/mythicratatoskr-yggdrasil-mesh-c2-uac-0099-sandworm-wiper
    surface: "body"
    kind: cited
    text: "It runs as a Windows service with an updater-style name, and it exfiltrates files and screenshots over the mesh without staging them ("
    urls: ["https://www.welivesecurity.com/en/eset-research/mythicratatoskr-yggdrasil-enabled-backdoor-deployed-uac0099-sandworm-collaboration/"]
  - claim_id: d6f00ebffe
    entry: 2026-10-23/mythicratatoskr-yggdrasil-mesh-c2-uac-0099-sandworm-wiper
    surface: "body"
    kind: cited
    text: "ESET notes that hosting the command server in the mesh may prevent network security tools from detecting the outbound connections to it and that blocking the public peer addresses is a viable mitigation ("
    urls: ["https://www.welivesecurity.com/en/eset-research/mythicratatoskr-yggdrasil-enabled-backdoor-deployed-uac0099-sandworm-collaboration/"]
  - claim_id: b36a53e58a
    entry: 2026-10-23/mythicratatoskr-yggdrasil-mesh-c2-uac-0099-sandworm-wiper
    surface: "body"
    kind: cited
    text: "**Exposure:** Windows estates whose users can open email attachments from outside and whose egress to arbitrary internet peers is not filtered; there is no product vulnerability, and ESET has not seen the backdoor anywhere else ("
    urls: ["https://www.welivesecurity.com/en/eset-research/mythicratatoskr-yggdrasil-enabled-backdoor-deployed-uac0099-sandworm-collaboration/"]
  - claim_id: 86896638c8
    entry: 2026-10-23/mythicratatoskr-yggdrasil-mesh-c2-uac-0099-sandworm-wiper
    surface: "body"
    kind: cited
    text: "**Detection:** in egress and DNS logs, connections to the public Yggdrasil peer addresses, since the mesh traffic looks like ordinary outbound connections and the peer list is the handle; in service-creation and process telemetry, a new Windows service with an updater-style name that runs a Go binary from a system or user folder, a scheduled task that runs a PowerShell payload from a temporary folder after an attachment is opened, and an OpenSSH SFTP server appearing on a workstation; and for the destructive stage, Group Policy objects that deploy SDelete or a similar wiper and mass file overwriting after a long quiet period ("
    urls: ["https://www.welivesecurity.com/en/eset-research/mythicratatoskr-yggdrasil-enabled-backdoor-deployed-uac0099-sandworm-collaboration/"]
  - claim_id: 2ca592559f
    entry: 2026-10-23/mythicratatoskr-yggdrasil-mesh-c2-uac-0099-sandworm-wiper
    surface: "body"
    kind: cited
    text: "**Triage:** ESET notes that legitimate users adopt Yggdrasil for resilient connectivity, research and hobby networking, so a single mesh connection needs a business-owner check, while a mesh peer connection together with a service named like an updater is the stronger combination ("
    urls: ["https://www.welivesecurity.com/en/eset-research/mythicratatoskr-yggdrasil-enabled-backdoor-deployed-uac0099-sandworm-collaboration/"]
  - claim_id: e47dc3b6a9
    entry: 2026-10-23/mythicratatoskr-yggdrasil-mesh-c2-uac-0099-sandworm-wiper
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** where the mesh has no business use, block egress to the public Yggdrasil peers and alert on Group Policy changes that deploy wiper-class tools; the observed victim is Ukrainian and ESET describes UAC-0099 as targeting Ukrainian governmental, financial and media organizations, so the lesson transfers as tradecraft, in particular that initial-access activity by one group preceded a destructive stage by another two months later ("
    urls: ["https://www.welivesecurity.com/en/eset-research/mythicratatoskr-yggdrasil-enabled-backdoor-deployed-uac0099-sandworm-collaboration/"]
