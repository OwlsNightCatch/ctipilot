  - claim_id: 9e64875394
    entry: 2026-10-23/fortinet-fortisandbox-fortisiem-pre-auth-critical-fixes
    surface: "summary"
    kind: frontmatter
    text: "Fortinet's PSIRT published two critical unauthenticated advisories on 2026-10-13: an authentication bypass in the FortiSandbox GUI (CVE-2026-107656, CVSS 3.1 9.6; fixed in 5.0.7 and 4.4.10) and a path traversal in the FortiSIEM phQueryMaster service that allows code execution (CVE-2026-106173, 9.4; FortiSIEM 7.5.0 only, fixed in 7.5.1, workaround: restrict tcp port 27918). Fortinet lists neither as known to be exploited. The FortiSandbox ranges include 5.0.6 and 4.4.9, the builds that fixed CVE-2026-25089, one of three FortiSandbox flaws reported exploited in June, so a unit patched for that one is still affected."
  - claim_id: b693f34499
    entry: 2026-10-23/fortinet-fortisandbox-fortisiem-pre-auth-critical-fixes
    surface: "actions[0]"
    kind: frontmatter
    text: "Check every FortiSandbox that was upgraded to 5.0.6 or 4.4.9 after the exploited-flaw advisories of this year: those builds are still affected by CVE-2026-107656 and need 5.0.7 or 4.4.10; on FortiSIEM 7.5.0 install 7.5.1, or until then restrict access to tcp 27918 as Fortinet's workaround says."
