claims:
  - claim_id: 11aabf3805
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "headline"
    kind: frontmatter
    text: "PK Softech apparently kept Publica data it had promised in writing to delete; Tamedia says Akira holds about 100 GB"
  - claim_id: dd3114dc3e
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "summary"
    kind: frontmatter
    text: "PK Softech AG, the software supplier of Publica and other Swiss pension funds, says unknown attackers used malware to reach part of its IT and that data must be assumed to have left; the Confederation headlined its 2026-10-08 release \"data outflow confirmed\", and the Federal Prosecutor's Office is investigating. Tamedia reports that PK Softech had confirmed in writing in January 2026 that it deleted Publica's 2019 migration data, which apparently stayed on its servers, and that Akira holds about 100 GB and demands ransom; Inside IT relays this and adds that the Federal Prosecutor's Office confirmed Akira took data, and Netzwoche relays that the authorities assume data on practically all current and former federal and federally affiliated staff left. Publica says personal data of insured persons has presumably left; the Pensionskasse Stadt Zürich says its insured persons' test data was stolen, the Pensionskasse Post says personal data left, the Bernische Pensionskasse says it must be assumed so, the Ticino fund IPCT says all its insured could potentially be involved, and other funds are still checking. As of 2026-10-22 neither the Confederation nor Publica has itself named the actor or the demand."
  - claim_id: 2a4afe0e1c
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "body"
    kind: cited
    text: "); the supplier, PK Softech AG, says unknown persons used malware to reach part of its IT infrastructure and that it must be assumed data left its systems, with type and scope still under investigation ("
    urls: ["https://pksoftech.ch/de/newsreader/Cyberangriff-auf-die-PKSoftechAG"]
  - claim_id: 8ad0391ab4
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "body"
    kind: cited
    text: "Tamedia's Tages-Anzeiger reports that the Akira ransomware group holds about 100 GB of compressed pension data on well over 100,000 current and former federal employees, including staff of the security authorities, and demands ransom, which Inside IT relays without the volume; as of 2026-10-20 neither the Confederation nor Publica had confirmed the perpetrator or the demand, and Publica said it still had no indication that data was published on the darkweb ("
    urls: ["https://www.tagesanzeiger.ch/akira-gruppe-alt-bundesraete-von-hacker-angriff-betroffen-181002064025", "https://www.inside-it.ch/datenleck-bei-publica-gefaehrdet-auch-sicherheitsbehoerden-20261020", "https://www.publica.ch/de/cyberangriff-auf-softwarelieferanten"]
  - claim_id: 542c76a06d
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "body"
    kind: cited
    text: "Netzwoche, relaying the same paper, adds that the Federal Council and the security authorities now assume data on practically all current and former federal and federally affiliated staff left, federal judges and former Federal Council members among them, which, as of 2026-10-21, no authority had confirmed ("
    urls: ["https://www.netzwoche.ch/news/2026-10-08/bundespensionskasse-publica-meldet-datenabfluss"]
  - claim_id: a5900b9a57
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-23T03:40:13Z"
    kind: cited
    text: "This is a reported confirmation of the actor by an authority, but it reaches the reader second-hand through the paywalled Tamedia article: the Federal Prosecutor's Office is not quoted directly, and Publica's own page, in its entry of 2026-10-20, still says it is clarifying whether data of Publica left and whose ("
    urls: ["https://www.publica.ch/de/cyberangriff-auf-softwarelieferanten"]
  - claim_id: 5266f48158
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "record 2026-10-23T03:40:13Z"
    kind: record-summary
    text: "The supplier's written pledge to delete Publica's 2019 migration data was apparently not kept, Inside IT relays that the Federal Prosecutor's Office confirmed Akira exfiltrated data, though that is second-hand and neither the Confederation nor Publica has itself named the actor, and the Ticino cantonal fund IPCT says all its insured could potentially be involved but has no evidence yet that data was taken."
