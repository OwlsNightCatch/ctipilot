  discovery_trace: 'first seen at: inside-it-ch, URL https://www.inside-it.ch/rss.xml (item https://www.inside-it.ch/efk-sieht-verbesserungsbedarf-bei-m365-beim-bund-20261022; paywalled lead only) -> pivot: SwissCybersecurity.net listing via WebFetch of https://www.swisscybersecurity.net/ then the article https://www.swisscybersecurity.net/news/2026-10-22/bund-muss-bei-der-datensicherung-von-microsoft-365-nachbessern (WebFetch summary; its listed EFK link) -> primary: EFK audit page, URL https://www.efk.admin.ch/prufung/sicherheit-und-nutzbarkeit-von-microsoft-365/ (extract) -> primary: report PDF, URL https://www.efk.admin.ch/wp-content/uploads/publikationen/berichte/wirtschaft_und_verwaltung/informatikprojekte/25121/25121be-bk-dti-microsoft-365.pdf (pdf subcommand, text extractable, 63k characters read in the relevant sections)'
  summary: 'The EFK audited whether the Federal Chancellery''s digital-transformation unit (BK-DTI) keeps data and information secure in the federal Microsoft 365 tenant, which BIT built and runs for 54,000 workplaces (migration October 2024 to December 2025, 57 services released in the standard service). Verdict: BIT built the platform according to the Chancellery''s architecture guidelines and Microsoft practice and took security measures that fit the currently restrictive use (unclassified information only), but central developments are outstanding. Four recommendations, all priority 1 and all accepted: (1) BK-DTI with BIT to expand compliance management and define which monitoring and reporting functions and standards to use and evaluate; (2) BIT to extend automation of the tenant configuration (today M365DSC covers mainly Entra ID and base configuration, Conditional Access policies are monitored continuously and the report is reviewed weekly by BIT security architects, which only partly meets the guideline''s must-criterion); (3) BK-DTI with BIT to define how often deviations from the security standards are evaluated and how to respond; (4) BIT to build a local M365 backup environment quickly and test restores regularly. Further findings in the report body: the CIS benchmark was considered only initially and tenant hardening is still to be defined; the EFK did not check whether the roughly 30 other M365 tenants that federal units run outside BIT''s standard service conform to the guidelines; the Customer Lockbox is set up and documented but has not yet been used in a real case; customer-managed-key encryption of the service is not yet implemented and planned in phases. On backup, the multi-tier solution''s administration console turned out to be hosted in the US, against the guideline''s data-residency rule, so it is being replaced by a European-hosted one; in the meantime the standard M365 Backup service is used, so recovery depends on Microsoft as cloud provider and, as the EFK puts it, if the connection to M365 were lost no backup would be available. BIT says in its statement that the local backup environment is now in production and that restore tests every six months are defined.'
