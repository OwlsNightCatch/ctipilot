  summary: 'Swiss-specific facts newer than the existing entry''s last record. BACS told Keystone-SDA and SRF on 2026-10-22 that, to its knowledge, no attack in Switzerland attributable to these two flaws is known, while stressing that unrecognised or unreported incidents cannot be excluded and that it has no reliable figures on affected websites, shops and internal applications; Inside IT adds BACS'' statement that PHP applications in the federal administration were affected and that there is no complete overview of the update status. Operators'' precautionary shutdowns were large and mostly short: the Basel hosting provider Cyon took all of its 100,000+ customer websites offline for some hours and says everything has run again since the morning of 2026-10-22; the canton of Neuchâtel disabled all PHP-based sites including ne.ch and many commune sites (RTS reports the cantonal site restored and the city of Neuchâtel''s site still out of service); Bexio and most authority, university and hospital sites were back by Thursday noon, while the University of Geneva (external access cut, internal access kept) and the EPFL (VPN access for its members) were still not fully reachable, and Basel-Stadt still had pages down at midday without finding any data outflow. Exposure and detection: Risikomonitor''s live view counts 576,549 checked Swiss web servers, 540,169 of them already patched and 20,231 (3.5 %) still affected, the rest hiding their PHP version. AWS (as relayed by Inside IT) says only the upgrade closes both flaws, configuration changes are not enough, and anyone who cannot exclude a compromise should start the investigation window no later than 2026-10-17, the date of its earliest honeypot exploit attempt; Cloudflare''s CEO says the first attacks came about six hours before the release. The Swiss firm InfoGuard advises securing evidence before patching and restarting when compromise is suspected. NZZ and Inside IT also report the disputed leak chain: a Hacker News post on the planned fix on the Monday evening (NZZ), first CVE ids circulating in forums on Tuesday around 17:00 Swiss time (PHP Foundation blog, as relayed by Inside IT), a researcher''s proof-of-concept video, and Chainguard publishing the fix before the embargo, which its CEO disputes was a leak.'
