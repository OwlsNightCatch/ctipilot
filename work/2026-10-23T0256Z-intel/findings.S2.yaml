  summary: 'Three developments not yet in the existing entry (its last record is 2026-10-22T03:47Z; the Tamedia and Ticinonline pieces predate it but are absent from it, and Inside IT''s relay of 2026-10-22 13:39Z is the in-window source). (1) Deletion pledge: Tamedia''s Tages-Anzeiger reported on 2026-10-21 (paywalled; Inside IT relayed it on 2026-10-22 and 20 Minuten the same day) that PK Softech AG had confirmed to Publica in writing in January 2026 that it held no plaintext personal data and had deleted the data it received in the 2019 migration, and that the sensitive data was apparently still on its servers when the attackers got in. Publica confirmed the sequence to Tamedia: after the Xplain case it asked PK Softech to delete all legacy data including the 2019 migration data and received written confirmation; it is now clarifying why personal data presumably still lay on the supplier''s servers. PK Softech did not answer and says it does not comment on individual customer relationships. (2) Actor: Inside IT, citing Tamedia, says the Federal Prosecutor''s Office confirmed that the data were exfiltrated by the Akira ransomware group, which keeps threatening to publish or sell them; 20 Minuten words it as ''according to findings so far, the data were stolen by Akira'' and adds that data on investigators working against Akira may be in the set. This is the first reported authority statement on the actor; the existing entry says neither the Confederation nor Publica confirmed it, and no primary Prosecutor''s Office statement was reachable, so the claim stays attributed to the newspapers. Publica itself told RTS on 2026-10-21 that it cannot confirm the scale of the leak as presented in the media, and its own page (latest incident entry 2026-10-20) still says it has no indication of publication on the darkweb. (3) A further public-sector customer: Ticinonline, relaying Corriere del Ticino (2026-10-20), says the Ticino cantonal pension fund IPCT is a PK Softech customer, that about 27,000 insured could in principle be concerned, that its director says there is no evidence yet that their data was taken, that the supplier confirmed on 2026-10-14 that personal data left without saying which funds, and that IPCT has filed a complaint with the federal public prosecutor and is preparing a notice to insured about phone and e-mail fraud. The existing entry still records the Ticino fund as silent.'
