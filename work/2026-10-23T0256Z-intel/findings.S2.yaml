  extended_notes: 'Triage: an outage of a Swiss cantonal, university or hosting-provider site on 2026-10-21 or 2026-10-22 is more likely the precautionary shutdown the operators describe than an attack, and BACS reports no Swiss attack so far; but BACS says unrecognised incidents cannot be excluded, and the AWS honeypot date (2026-10-17) widens the retrospective window past the release day. Not in the existing entry: Cyon, Bexio, the Neuchâtel confirmation, BACS'' admission of no federal patch overview, the AWS earliest-attempt date and the Risikomonitor exposure count. The Risikomonitor figure is a third-party count and carried only as such. Open item: the AWS primary (threat-intelligence post) was not found; the claim rests on Inside IT''s relay.'
