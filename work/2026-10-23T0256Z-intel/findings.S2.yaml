  discovery_trace: 'first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/13091 (bridge `ncsc-csh recent 25`, then `ncsc-csh post 13091`) -> primary: Oracle alert, URL https://www.oracle.com/security-alerts/alert-cve-2026-91403.html -> primary: OpenJDK advisory, URL https://openjdk.org/groups/vulnerability/advisories/2026-10-21 -> Oracle guidance, URL https://ops.java/emudhra -> eMudhra tracker (patched-version table), URL https://emudhra.we-have-a-problem.com/'
  summary: 'The existing eMudhra entry (2026-10-21) covers browsers, Go, Python, Rust and curl stacks but not Java. On 2026-10-21 Oracle issued Security Alert CVE-2026-91403 and the OpenJDK project an advisory for the same event: the JVM''s built-in trust store carries the eight compromised eMudhra intermediate CAs, so a standalone Java runtime will accept certificates forged with the leaked keys unless it is updated or told to block them. Oracle scores it CVSS 3.1 9.1 (network, no privileges, no user interaction, high confidentiality and integrity impact), component JSSE, remotely exploitable without authentication by using the component''s APIs, for example through a web service that supplies data to them, and notes that sandboxed Java Web Start and applet clients that run untrusted code are also exposed. Affected: Oracle Java SE 8u511, 8u511-perf, 11.0.33, 17.0.21, 21.0.13, 25.0.5 and 27.0.1, GraalVM for JDK 17.0.21 and 21.0.13, GraalVM Enterprise Edition 21.3.20; OpenJDK lists 27.0.1, 25.0.5, 21.0.13, 17.0.21, 11.0.32.1, 8u504 and earlier; the eMudhra tracker lists the patched builds as 27.0.1.0.2, 25.0.5.0.2, 21.0.13.0.2, 17.0.21.0.2, 11.0.33.0.2 and 8u511. If the runtime cannot be updated, both vendors give two alternatives: replace the JDK''s blocked.certs file (renamed blacklisted.certs on Java 8) with the vendor''s version, or enable revocation checking (-Dcom.sun.net.ssl.checkRevocation=true and -Dcom.sun.security.enableCRLDP=true for TLS clients; jarsigner -verify -revcheck -strict for signed JARs on JDK 17 and later). OpenJDK packages supplied by Linux distributions generally use the operating system''s certificate store, so updating the OS certificates suffices there (named: Arch, Debian, Devuan, Fedora, Gentoo, Oracle Linux, RHEL, Ubuntu), while FreeBSD and Homebrew packages need a direct update. NCSC.ch published its advisory on 2026-10-22 and lists exploitation status as unknown.'
  region_nexus: global; Java is widely used in Swiss public-sector line-of-business applications, so Swiss relevance follows from the NCSC.ch advisory, not from a Swiss-specific source
