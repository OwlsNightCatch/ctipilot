    attribution: Swiss Federal Audit Office (EFK)
    source_url: https://www.efk.admin.ch/prufung/sicherheit-und-nutzbarkeit-von-microsoft-365/
  - quote: BK-DTI has not yet defined at what interval compliance with the relevant security standards is to be checked, and how to respond to deviations.
    original: BK-DTI hat noch nicht definiert in welchem Rhythmus die Einhaltung von relevanten Sicherheitsstandards erhoben werden soll, und wie darauf zu reagieren ist.
    attribution: Swiss Federal Audit Office (EFK)
