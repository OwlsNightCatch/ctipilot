  extended_notes: 'Defender angle (what a tenant operator can test against this): whether tenant configuration is exported and drift-checked as code (M365DSC is the tool named), whether Conditional Access policy changes are alerted on and reviewed on a fixed cycle, whether a CIS-benchmark baseline is actually applied and not only ''considered'', whether a backup exists that does not depend on the same Microsoft tenant and has been restore-tested, and how many tenants the organisation really runs. The report text (version including statements, 2026-07-28) was read through the pdf subcommand; the page and the PDF are one primary. The existing store has a related EFK entry (2026-06-22/swiss-federal-audit-office-federal-cyber-governance-split-le). The sources do not link this audit to the PK Softech incident or any attack.'
