  - quote: If you use a standalone OpenJDK Java runtime, we recommend that you update it as soon as possible, since it likely contains the compromised certificates.
    attribution: OpenJDK Vulnerability Group
    source_url: https://openjdk.org/groups/vulnerability/advisories/2026-10-21
  - quote: Unauthenticated JSSE compromise enabling unauthorized access to and modification of critical data
    attribution: NCSC.ch Cyber Security Hub
    source_url: https://security-hub.ncsc.admin.ch/#/posts/13091
  extended_notes: 'Detection and exposure: the sources do not claim exploitation. The exposure question is which Java runtimes in the estate are standalone (own cacerts and blocked.certs) and which use the operating system''s store, and whether any Java TLS client or signed-JAR verifier runs with revocation checking off, which is the default per the advisory''s wording. Post-patch: the update does not evict anything; it removes trust. Dennis Jackson''s tracker (2026-10-22) states browsers blocked the certificates from 2026-10-17 (Firefox, Chrome), 2026-10-20 (Microsoft) and 2026-10-22 (Apple), and says there is no knowledge whether attackers exploited the flawed key generation. Overlap note: S1 may also return this NCSC.ch advisory as a vulnerability item; this item is deliberately framed as an update on the covered eMudhra entry.'
