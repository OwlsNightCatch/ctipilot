  extended_notes: 'Supply-chain governance lesson, stated by the sources and mechanical from them: a written deletion attestation from a software supplier was relied on after the Xplain case and did not prevent legacy migration data from being on the supplier''s servers at the time of the intrusion (2019 migration data, per Tamedia/Inside IT/20 Minuten). Defender takeaway for public bodies that gave a supplier production or migration data: a contractual audit right and an actual inventory check of what the supplier holds, test and migration copies included, matter more than a signed statement; the earlier SRF piece (2026-10-10, already cited in the entry) quotes a security expert on the same point. Contradiction to carry: the existing entry''s sentence that neither the Confederation nor Publica confirms the actor is superseded if the Prosecutor''s Office statement is accurate; it stays attributed to Tamedia because the original is paywalled and no Prosecutor''s Office text was found. Independence: Inside IT and 20 Minuten both rest on one Tamedia investigation (Thomas Knellwolf, Fabienne Sennhauser); the Ticino item rests on one Corriere del Ticino report relayed by Ticinonline. The Publica status page''s 2026-10-22 entry is the PHP-related website outage and is unrelated (already covered in the PHP entry).'
