- title: 'Federal Swiss Government Cloud tender opens: up to CHF 7 billion over 14 years, three tiers (international public cloud, Swiss-only data processing, private cloud in federal data centres), first services from late 2027, open to cantons and communes'
  sources:
  - url: https://www.netzwoche.ch/news/2026-10-20/bund-schreibt-cloud-auftraege-fuer-bis-zu-7-milliarden-franken-aus
    publisher: Netzwoche
    date: '2026-10-20'
    role: primary
  - url: https://www.20min.ch/story/fuer-bis-zu-7-milliarden-bund-holt-sensible-cloud-daten-zurueck-in-schweizer-bunker-103652507
    publisher: 20 Minuten
    date: '2026-10-20'
    role: corroborating
  discovery_trace: 'first seen at: 20 Minuten link inside https://www.20min.ch/story/daten-gau-trotz-loeschbestaetigung-bundesdaten-landeten-bei-hackern-103653740 (PK Softech follow-up) -> https://www.20min.ch/story/fuer-bis-zu-7-milliarden-bund-holt-sensible-cloud-daten-zurueck-in-schweizer-bunker-103652507 -> WebSearch ("Swiss Government Cloud Ausschreibung Bundesamt für Informatik BIT simap Behördencloud sieben Milliarden") -> Netzwoche, URL https://www.netzwoche.ch/news/2026-10-20/bund-schreibt-cloud-auftraege-fuer-bis-zu-7-milliarden-franken-aus. The federal press release and the simap tender notice were not readable (simap is a JavaScript application served only through the metered reader); both articles state they relay the Confederation''s announcement.'
  summary: 'On 2026-10-20 the Federal Office of Information Technology and Telecommunications (BIT) opened the procurement for the Swiss Government Cloud: three lots with five awards and a ceiling of CHF 7 billion over 14 years (CHF 2 billion for each of two public-cloud tiers and CHF 3 billion for the private cloud), paid only for services actually used. Tier one is international cloud services, tier two requires data storage and processing exclusively in Switzerland and favours open-source solutions, tier three is a private cloud in federal data centres for the most protection-worthy applications such as finance and tax data. Each provider may win only one award, to reduce dependency on single providers and legal orders; the tender prescribes no specific vendor, and US or Chinese firms may bid but must meet data-protection and sovereignty criteria in tiers two and three (20 Minuten). Cantons and communes may use the cloud but need not. A 60-day pre-qualification phase starts the process, awards are planned for late summer 2027 and first services for late autumn 2027, with the build-out to run to 2032. The previous federal public-cloud tender went entirely to Amazon, Microsoft, IBM, Oracle and Alibaba. The EFK found at the end of 2025 that the economic benefit of the Swiss Government Cloud for the Confederation as a whole was not yet proven (Netzwoche).'
