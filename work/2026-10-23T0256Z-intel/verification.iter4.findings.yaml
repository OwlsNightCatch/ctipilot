- code: F3
  category: claim-not-supported
  section: vulnerabilities
  item: "2026-10-23/hpesbnw05162-hpe-aruba-aos-8-aos-10-72-cves-19-unauth (claims 5ac7b8c279 headline, c5b8f02d51 Detection paragraph, dc7446ae49 Defender takeaway)"
  url_or_quote: "https://support.hpe.com/hpesc/public/docDisplay?docId=hpesbnw05162en_us&docLocale=en_US"
  summary: "(low confidence) The entry says 'no exploitation or public code known' (headline), 'HPE publishes no detection guidance and states no exploitation' and 'HPE reports no exploitation'. The bulletin's 'Exploitation and Public Discussion' section says only 'HPE Networking is not aware of any public discussion or exploit code that targets the listed vulnerabilities as of the release date of this advisory.' It makes no statement about in-the-wild exploitation; the CSAF carries no threat or exploit flag either. Reword to 'HPE knows of no public discussion or exploit code' (the summary already does) and drop 'states/reports no exploitation'."
- code: F4
  category: hallucinated-fact
  section: incident
  item: "2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow, '## Update — 2026-10-22T03:47:53Z' last sentence (not in the claim ledger; uncited)"
  url_or_quote: "as of 2026-10-21 neither the Confederation, Publica nor PK Softech had confirmed the actor, the ransom demand or the scope."
  summary: "(low confidence) The sentence is uncited and the entry's own newest section contradicts it. Inside IT 2026-10-22 (https://www.inside-it.ch/publica-wollte-pensionskassendaten-loeschen-lassen-20261022): 'Die Bundesanwaltschaft habe bestätigt, \"dass Daten von der Ransomware-Gruppe Akira abgezogen wurden\", so Tamedia', linking Tamedia's 2026-10-21 article (14:03). The Federal Prosecutor's Office is a Confederation body and the confirmation predates the end of 2026-10-21, while the 2026-10-23 section calls it 'a reported confirmation of the actor by an authority' (second-hand). Qualify the earlier sentence ('had publicly confirmed' / 'had itself published') or cite and align it with the newest section."
- code: F5
  category: missing-citation
  section: incident
  item: "2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates, body paragraph 3, first sentence (claim 00107a180e), repeated in the record summary"
  url_or_quote: "Java runtimes keep their own trust store."
  summary: "(low confidence) A general claim with no inline citation, and overbroad against the page cited right after it: OpenJDK's advisory says 'If you use an OpenJDK Java runtime provided by your operating system, then it most likely uses the operating system’s certificates' (Arch, Debian, Devuan, Fedora, Gentoo, Oracle Linux, RHEL, Ubuntu), and only 'a standalone OpenJDK Java runtime ... likely contains the compromised certificates'. Say 'Standalone Java runtimes ship their own trust store' and cite the OpenJDK advisory, or drop the sentence."
