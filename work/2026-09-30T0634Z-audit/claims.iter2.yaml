  - claim_id: 85d5db47d6
    entry: 2026-06-25/ncsc-ch-active-microsoft-365-voicemail-phishing-wave-in-swit
    surface: "record 2026-09-30T06:43:01Z"
    kind: record-summary
    text: "The Swiss national cyber security centre moved its website to bacs.admin.ch, and the cited page now answers 404 at its old ncsc.admin.ch address, so the citations point at the same page on the new site. The analysis mapped mailbox forwarding rules and account manipulation, which NCSC does not describe, stated that genuine voicemails are never ZIP files and that stolen data is frequently resold, and said Swiss public-sector staff were direct recipients. NCSC says the attackers read business communications to prepare CEO fraud and BEC, that genuine voicemails are usually audio files, and that harvested data may be resold, and names no sector; the text now follows the page. The mapping is the ZIP attachment, the phishing link, browser-credential theft and remote email collection, the spliced evidence quotation is two verbatim quotations, and an Admiralty rating of A2 is added."
