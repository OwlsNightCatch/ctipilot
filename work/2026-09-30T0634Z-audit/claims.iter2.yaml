claims:
  - claim_id: 8bbef7262a
    entry: 2026-06-03/ncsc-switzerland-warns-of-cyber-operations-around-the-g7-via
    surface: "body"
    kind: cited
    text: "On 2026-06-01 Switzerland's National Cyber Security Centre published a pre-event advisory warning that the G7 summit in Évian (France, 15–17 June) is a high-value target and that it \"expects disruptive maneuvers in cyberspace again\" ("
    urls: ["https://www.bacs.admin.ch/en/26-cyberresilienz-g7-en"]
  - claim_id: a3304fb33e
    entry: 2026-06-03/ncsc-switzerland-warns-of-cyber-operations-around-the-g7-via
    surface: "body"
    kind: cited
    text: "An independently published threat map for the event frames the expected activity against the template of the 2024 Bürgenstock summit, when the pro-Russia hacktivist collective NoName057(16) ran DDoS waves against Swiss federal sites and conference-linked organisations on each summit day; the same map additionally flags state intelligence collection against hotel and telecom infrastructure, rogue-base-station cellular interception, and social engineering of hotel help desks as plausible vectors ("
    urls: ["https://zendata.security/2026/05/03/g7-evian-2026-the-cyber-risk-map-and-recommendations/"]
  - claim_id: 82d56f924d
    entry: 2026-06-03/ncsc-switzerland-warns-of-cyber-operations-around-the-g7-via
    surface: "body"
    kind: uncited
    text: "Although the summit sits on French soil, most delegations transit Geneva Airport and lodge on the Swiss side (Geneva, Vaud, Valais), putting Swiss federal and cantonal administrations, conference-linked suppliers, and Swiss telecom operators in the blast radius."
  - claim_id: da09701d87
    entry: 2026-06-03/ncsc-switzerland-warns-of-cyber-operations-around-the-g7-via
    surface: "body"
    kind: uncited
    text: "The NCSC advisory itself recommends generic protective measures and DDoS preparedness for organisations linked to the event."
  - claim_id: ad9382cba3
    entry: 2026-06-03/ncsc-switzerland-warns-of-cyber-operations-around-the-g7-via
    surface: "body"
    kind: uncited
    text: "**Why it matters to us:** Organisations operating in the Geneva–Vaud corridor and Swiss federal/cantonal SOCs should pre-stage DDoS mitigation playbooks now, review MFA on customer-facing identity providers, rotate administrative credentials before the event window, and brief travelling staff on mobile-device physical security; hunt for anomalous authentication spikes from the summit region and unexpected reattachment events in MDM/MDM-adjacent telemetry around 15–17 June."
  - claim_id: 7045a9028e
    entry: 2026-06-03/ncsc-switzerland-warns-of-cyber-operations-around-the-g7-via
    surface: "section 2026-09-30T06:43:01Z"
    kind: cited
    text: "ZENDATA's risk map for the summit names social engineering of hotel help desks among the plausible vectors, not social engineering of event staff, and the analysis now says so ("
    urls: ["https://zendata.security/2026/05/03/g7-evian-2026-the-cyber-risk-map-and-recommendations/"]
  - claim_id: 45496e814e
    entry: 2026-06-03/ncsc-switzerland-warns-of-cyber-operations-around-the-g7-via
    surface: "section 2026-09-30T06:43:01Z"
    kind: cited
    text: "NCSC Switzerland's advisory is cited at its new address on bacs.admin.ch ("
    urls: ["https://www.bacs.admin.ch/en/26-cyberresilienz-g7-en"]
  - claim_id: 24e628e42b
    entry: 2026-06-03/ncsc-switzerland-warns-of-cyber-operations-around-the-g7-via
    surface: "record 2026-09-30T06:43:01Z"
    kind: record-summary
    text: "The Swiss national cyber security centre moved its website to bacs.admin.ch, and the cited page now answers 404 at its old ncsc.admin.ch address, so the citations point at the same page on the new site. Re-reading ZENDATA's risk map, the analysis named social engineering against event staff where the map names social engineering of hotel help desks, and it now says so. The ATT&CK mapping the analysis describes (hacktivist DDoS waves) and an Admiralty rating of A3, since the advisory is an expectation rather than observed activity, are added."
  - claim_id: 62633e1d5d
    entry: 2026-06-04/ncsc-switzerland-booking-com-breach-feeds-two-pronged-whatsa
    surface: "headline"
    kind: frontmatter
    text: "NCSC Switzerland: WhatsApp hotel-booking phishing in two variants, one fed by the April Booking.com data leak, targets Swiss travellers"
  - claim_id: 8633531020
    entry: 2026-06-04/ncsc-switzerland-booking-com-breach-feeds-two-pronged-whatsa
    surface: "summary"
    kind: frontmatter
    text: "NCSC Switzerland warns of two hotel-booking phishing variants: a WhatsApp refund scam that uses booking data from the April 2026 Booking.com data leak and leads through TWINT and bank phishing pages to card theft, and a long-known takeover of hotel booking-system accounts that contacts guests through the platform's own messaging (NCSC-CH, 2026-06-02)."
  - claim_id: 3f3d66daf9
    entry: 2026-06-04/ncsc-switzerland-booking-com-breach-feeds-two-pronged-whatsa
    surface: "body"
    kind: cited
    text: "NCSC Switzerland's Week 22 report notes an uptick in fraudulent WhatsApp messages about hotel bookings, in two variants ("
    urls: ["https://www.bacs.admin.ch/en/26w22-en"]
  - claim_id: 4fadf7568f
    entry: 2026-06-04/ncsc-switzerland-booking-com-breach-feeds-two-pronged-whatsa
    surface: "body"
    kind: uncited
    text: "Variant 1 draws on real booking data (dates of stay, hotel names, guest names) from the April 2026 Booking.com data leak and sends a fake refund lure on WhatsApp that redirects to pages spoofing TWINT and Swiss bank portals to harvest card data."
  - claim_id: 6d69fd0a40
    entry: 2026-06-04/ncsc-switzerland-booking-com-breach-feeds-two-pronged-whatsa
    surface: "body"
    kind: uncited
    text: "Variant 2, which NCSC calls long-known, uses hotel booking-system credentials stolen by phishing or malware to message guests through the platform's official messaging, or by email or WhatsApp, demanding urgent card verification or an advance payment."
  - claim_id: e43ce9d65a
    entry: 2026-06-04/ncsc-switzerland-booking-com-breach-feeds-two-pronged-whatsa
    surface: "body"
    kind: uncited
    text: "In analyst judgement the second is the harder one to spot, since the message carries the trust of the real platform and defeats the usual \"is this sender legitimate?\" check."
  - claim_id: bb80dcd6b3
    entry: 2026-06-04/ncsc-switzerland-booking-com-breach-feeds-two-pronged-whatsa
    surface: "body"
    kind: uncited
    text: "NCSC frames the targets as Swiss hotel-booking customers generally; for a federal SOC, staff who book travel through these platforms fall in the same exposed population (analyst inference)."
  - claim_id: 2484f02bc8
    entry: 2026-06-04/ncsc-switzerland-booking-com-breach-feeds-two-pronged-whatsa
    surface: "body"
    kind: uncited
    text: "**Why it matters to us:** the account-takeover variant breaks user-awareness controls because the lure originates from a trusted booking system, not a spoofed sender — detection has to move to anomalous outbound messaging from booking-platform accounts and to card-data entry on TWINT/bank look-alike domains."
  - claim_id: 96e8cc6eca
    entry: 2026-06-04/ncsc-switzerland-booking-com-breach-feeds-two-pronged-whatsa
    surface: "section 2026-09-30T06:43:01Z"
    kind: cited
    text: "It calls the second, the takeover of hotel booking-system accounts, long-known, and it does not rank the two ("
    urls: ["https://www.bacs.admin.ch/en/26w22-en"]
  - claim_id: 21b913e5df
    entry: 2026-06-04/ncsc-switzerland-booking-com-breach-feeds-two-pronged-whatsa
    surface: "section 2026-09-30T06:43:01Z"
    kind: uncited
    text: "NCSC Switzerland ties only the first variant, the WhatsApp refund scam, to the April 2026 Booking.com data leak."
  - claim_id: 27eaddb991
    entry: 2026-06-04/ncsc-switzerland-booking-com-breach-feeds-two-pronged-whatsa
    surface: "section 2026-09-30T06:43:01Z"
    kind: uncited
    text: "The title, summary and analysis now say so, and the view that the second is the harder one to spot is marked as analyst judgement."
  - claim_id: e00dce2b75
    entry: 2026-06-04/ncsc-switzerland-booking-com-breach-feeds-two-pronged-whatsa
    surface: "record 2026-09-30T06:43:01Z"
    kind: record-summary
    text: "The Swiss national cyber security centre moved its website to bacs.admin.ch, and the cited page now answers 404 at its old ncsc.admin.ch address, so the citations point at the same page on the new site. The title, headline, summary and analysis tied both scam variants to the April 2026 Booking.com data leak and ranked the second as the more dangerous. NCSC ties only the refund variant to the leak and calls the account-takeover variant long-known, and it does not rank them, so the text now follows the page and the ranking is marked as analyst judgement. The WhatsApp lure is mapped as spearphishing via a service rather than a link, and an Admiralty rating of A2 is added."
  - claim_id: b99b004aed
    entry: 2026-06-10/ncsc-ch-week-23-coordinated-surge-in-job-seeker-targeting-fa
    surface: "headline"
    kind: frontmatter
    text: "NCSC-CH Week 23: three job-seeker scams, a fake interview login, reshipping identity theft and LinkedIn-to-GitHub infostealer delivery"
  - claim_id: 0354749225
    entry: 2026-06-10/ncsc-ch-week-23-coordinated-surge-in-job-seeker-targeting-fa
    surface: "summary"
    kind: frontmatter
    text: "NCSC Switzerland's Week 23 review (9 June) describes three reported cases aimed at job seekers: an interview slot confirmed through a Google Calendar entry that opens a counterfeit Google login and harvests the credentials, a fake \"Swiss social welfare\" packing job that collects identity documents for reshipping and purchase fraud, and a fake LinkedIn recruiter whose technical interview has the candidate run a small programming task from a private GitHub repository, which installs an infostealer."
  - claim_id: 280b8db577
    entry: 2026-06-10/ncsc-ch-week-23-coordinated-surge-in-job-seeker-targeting-fa
    surface: "body"
    kind: cited
    text: "NCSC Switzerland's Week 23 review (9 June) walks through three reported cases aimed at job seekers ("
    urls: ["https://www.bacs.admin.ch/en/26w23-en"]
  - claim_id: bbfbf1e131
    entry: 2026-06-10/ncsc-ch-week-23-coordinated-surge-in-job-seeker-targeting-fa
    surface: "body"
    kind: uncited
    text: "In the first, a job seeker was offered a phone-interview slot to confirm through a Google Calendar entry, and the confirmation opened a counterfeit Google login that sent the entered credentials to the scammers."
  - claim_id: f468427908
    entry: 2026-06-10/ncsc-ch-week-23-coordinated-surge-in-job-seeker-targeting-fa
    surface: "body"
    kind: uncited
    text: "In the second, an ad for a \"Swiss social welfare\" work-from-home packing job moved to WhatsApp and asked for photos of the passport, identity card, driving licence and home address."
  - claim_id: e0298f1d5c
    entry: 2026-06-10/ncsc-ch-week-23-coordinated-surge-in-job-seeker-targeting-fa
    surface: "body"
    kind: uncited
    text: "Such documents are used to order high-value goods in the victim's name, and the job itself is parcel reshipping that hides criminal proceeds."
  - claim_id: f18e6cd0f9
    entry: 2026-06-10/ncsc-ch-week-23-coordinated-surge-in-job-seeker-targeting-fa
    surface: "body"
    kind: uncited
    text: "In the third, a recruiter on LinkedIn, in one case writing from a compromised but genuine-looking profile, offered a technical position and, as part of a technical interview, asked the candidate to download a private GitHub repository and complete a small programming task in it."
  - claim_id: 70b5b58184
    entry: 2026-06-10/ncsc-ch-week-23-coordinated-surge-in-job-seeker-targeting-fa
    surface: "body"
    kind: uncited
    text: "Running the commands installed an infostealer that reads crypto wallets, stored login credentials and browser cookies."
  - claim_id: 924d6b57fa
    entry: 2026-06-10/ncsc-ch-week-23-coordinated-surge-in-job-seeker-targeting-fa
    surface: "body"
    kind: uncited
    text: "NCSC notes that attackers systematically exploit applicants' willingness to react quickly and engage with unfamiliar procedures."
  - claim_id: a0cfe75445
    entry: 2026-06-10/ncsc-ch-week-23-coordinated-surge-in-job-seeker-targeting-fa
    surface: "body"
    kind: uncited
    text: "**Why it matters to us:** the LinkedIn-to-GitHub chain is a credible vector into corporate endpoints through employees in job-search mode and HR or talent teams handling external candidate code."
  - claim_id: 46f7b8fc78
    entry: 2026-06-10/ncsc-ch-week-23-coordinated-surge-in-job-seeker-targeting-fa
    surface: "body"
    kind: uncited
    text: "Detection concept, by inference from the mechanism: a repository clone or GitHub download followed within minutes by script execution from the freshly cloned path (process-creation telemetry, for example Sysmon event 1 with `git` or an interpreter as the parent)."
  - claim_id: 60dffe9b88
    entry: 2026-06-10/ncsc-ch-week-23-coordinated-surge-in-job-seeker-targeting-fa
    surface: "section 2026-09-30T06:43:01Z"
    kind: cited
    text: "NCSC Switzerland's Week 23 review presents three reported cases, not a coordinated campaign ("
    urls: ["https://www.bacs.admin.ch/en/26w23-en"]
  - claim_id: c1fe7a274b
    entry: 2026-06-10/ncsc-ch-week-23-coordinated-surge-in-job-seeker-targeting-fa
    surface: "section 2026-09-30T06:43:01Z"
    kind: uncited
    text: "The fake interview was a phone-interview slot confirmed through a Google Calendar entry, which opened a counterfeit Google login."
  - claim_id: 2250d3f1b2
    entry: 2026-06-10/ncsc-ch-week-23-coordinated-surge-in-job-seeker-targeting-fa
    surface: "section 2026-09-30T06:43:01Z"
    kind: uncited
    text: "The recruiter case was a technical interview in which the candidate downloaded a private GitHub repository and ran a small programming task, and running its commands installed the infostealer."
  - claim_id: 6cf0b96653
    entry: 2026-06-10/ncsc-ch-week-23-coordinated-surge-in-job-seeker-targeting-fa
    surface: "section 2026-09-30T06:43:01Z"
    kind: uncited
    text: "The analysis had described interview-confirmation emails from Swiss employers and an onboarding or technical-assessment repository, which the page does not say, and it now follows the page."
  - claim_id: f5d4fe0172
    entry: 2026-06-10/ncsc-ch-week-23-coordinated-surge-in-job-seeker-targeting-fa
    surface: "record 2026-09-30T06:43:01Z"
    kind: record-summary
    text: "The Swiss national cyber security centre moved its website to bacs.admin.ch, and the cited page now answers 404 at its old ncsc.admin.ch address, so the citations point at the same page on the new site. The title, summary and analysis described a coordinated surge and details the page does not carry (interview-confirmation emails from plausible Swiss employers, an onboarding or technical-assessment repository, PowerShell). NCSC presents three reported cases: a Google Calendar confirmation that opens a fake Google login, a fake packing job that collects identity documents, and a fake recruiter's technical interview with a small programming task from a private GitHub repository. The text follows the page, the mapping drops PowerShell and valid-account use for user execution of a malicious file and browser-cookie theft, and an Admiralty rating of A2 is added."
  - claim_id: 6c059e9663
    entry: 2026-06-25/ncsc-ch-active-microsoft-365-voicemail-phishing-wave-in-swit
    surface: "body"
    kind: cited
    text: "Switzerland's National Cyber Security Centre reported a higher-than-usual volume of a dual-path Microsoft 365 / OneDrive-for-Business phishing campaign in its Week 25 review ("
    urls: ["https://www.bacs.admin.ch/en/26w25-en"]
  - claim_id: 4137436847
    entry: 2026-06-25/ncsc-ch-active-microsoft-365-voicemail-phishing-wave-in-swit
    surface: "body"
    kind: uncited
    text: "In the malware-delivery variant the email carries a ZIP \"audio\" attachment that, when run, installs an infostealer harvesting browser credentials, session cookies and wallet data; in the credential-harvest variant a fake Microsoft login page with a simulated audio player (\"Play voicemail as guest\") captures the M365 username and password."
  - claim_id: d9e973938e
    entry: 2026-06-25/ncsc-ch-active-microsoft-365-voicemail-phishing-wave-in-swit
    surface: "body"
    kind: uncited
    text: "The link in the notification, or an HTML file attached to it, leads to that page."
  - claim_id: abdffd848e
    entry: 2026-06-25/ncsc-ch-active-microsoft-365-voicemail-phishing-wave-in-swit
    surface: "body"
    kind: uncited
    text: "NCSC-CH notes that a compromised mailbox is then often used to send phishing to all of the victim's contacts (\"chain phishing\"), that the attackers read business communications to prepare CEO fraud and business email compromise from a real employee's address, and that data an infostealer harvests may also be resold and in some cases resurfaces weeks or months later."
  - claim_id: 8fd8556f30
    entry: 2026-06-25/ncsc-ch-active-microsoft-365-voicemail-phishing-wave-in-swit
    surface: "body"
    kind: uncited
    text: "**Why it matters to us:** The discriminator is mechanical: genuine voicemail notifications are usually audio files such as `.wav` or `.mp3`, not ZIP archives."
  - claim_id: 46b7a91383
    entry: 2026-06-25/ncsc-ch-active-microsoft-365-voicemail-phishing-wave-in-swit
    surface: "body"
    kind: uncited
    text: "Phishing-resistant MFA (FIDO2 / certificate-based Conditional Access) defeats the credential-theft path even when the lure succeeds; by inference from the mailbox monitoring NCSC-CH describes, hunt M365 audit logs for mailbox access from a new country or ASN shortly after a sign-in, and for inbox or forwarding rules created in that session."
  - claim_id: e50f2c9e6a
    entry: 2026-06-25/ncsc-ch-active-microsoft-365-voicemail-phishing-wave-in-swit
    surface: "section 2026-09-30T06:43:01Z"
    kind: cited
    text: "NCSC Switzerland's Week 25 review describes what attackers do with a compromised mailbox: they send phishing to the victim's contacts (\"chain phishing\") and read business communications to prepare CEO fraud and business email compromise ("
    urls: ["https://www.bacs.admin.ch/en/26w25-en"]
  - claim_id: 74bd706ff4
    entry: 2026-06-25/ncsc-ch-active-microsoft-365-voicemail-phishing-wave-in-swit
    surface: "section 2026-09-30T06:43:01Z"
    kind: uncited
