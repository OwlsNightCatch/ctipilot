  summary: "The claim that webfetch-only is granted only when the container is actually walled out (\"a refused UA, a blocked bridge, an empty reader pool or a challenge page\", and \"a dead or repurposed page on one of the ~80 unwalled webfetch records still surfaces\") is false for pages that carry a shell marker: _SHELL_MARKERS include \"404 not found\", \"page not found\", \"this domain is for sale\", \"domain parked\", \"buy this domain\", \"redirecting...\". Simulated _content_assess on a webfetch record: '404 Not Found...' -> shell ['404 not found']; 'This domain is for sale...' -> shell [...]. Such a record gets webfetch-only and action none (needs-demote reset), silencing exactly the dead/parked case iteration 2 #8 asked to keep. Fix: build walled from challenge-type markers only (just a moment, checking your browser, attention required, cf-chl, captcha, verify you are human, please wait while, access denied, request blocked, are you a robot, ddos protection, enable javascript) or require a blocked class, and add a test; or soften the three claims."
