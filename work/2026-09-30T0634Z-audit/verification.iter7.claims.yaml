claims:
  - {claim_id: 1b4aa1f392, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26-cyberresilienz-g7-en", passage: "The NCSC anticipates that there will be disruptive cyberoperations during the G7, particularly distributed denial-of-service (DDoS) attacks targeting Swiss organisations."}
  - {claim_id: 653df76d76, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26-cyberresilienz-g7-en", passage: "Large-scale events and international conferences are often used as an opportunity to stage a cyberattack. ... expects disruptive maneuvers in cyberspace again in the context of the the G7 summit"}
  - {claim_id: e922502ece, verdict: ok, source_url: "https://zendata.security/2026/05/03/g7-evian-2026-the-cyber-risk-map-and-recommendations/", passage: "most of the delegations, journalists and corporate observers will land at GVA, sleep on the Swiss side, and cross the lake daily."}
  - {claim_id: a3304fb33e, verdict: ok, source_url: "https://zendata.security/2026/05/03/g7-evian-2026-the-cyber-risk-map-and-recommendations/", passage: "During Bürgenstock 2024, NoName057(16) ran DDoS waves on each summit day against Swiss federal sites and conference-linked organisations. (also Risk 2 telecom/hotels, Risk 4 rogue 2G base station, Ris"}
  - {claim_id: 928f304501, verdict: ok, source_url: "https://zendata.security/2026/05/03/g7-evian-2026-the-cyber-risk-map-and-recommendations/", passage: "labelled analyst judgement; basis: For Lake Geneva organisations, the question is not whether you are a primary target, but whether you sit in the supply chain of one."}
  - {claim_id: da09701d87, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26-cyberresilienz-g7-en", passage: "the core protective measures remain the same as in normal circumstances; page links download 'NCSC DDoS Attack Guidance for Exposed Events' (bacs-leitfaden-ddos-angriffen_en.pdf)"}
  - {claim_id: 81fdac5b55, verdict: ok, source_url: "https://zendata.security/2026/05/03/g7-evian-2026-the-cyber-risk-map-and-recommendations/", passage: "MFA review on all customer-facing identity providers, credential rotation for administrative accounts (Risk 7); Risk 6: turn the phone off; recommendation framed as analyst guidance"}
  - {claim_id: d9de9e5b00, verdict: ok, source_url: "https://zendata.security/2026/05/03/g7-evian-2026-the-cyber-risk-map-and-recommendations/", passage: "analyst hunt recommendation, not a page claim (no source states authentication spikes); consistent with Risk 7 help-desk / identity-provider concern"}
  - {claim_id: 7045a9028e, verdict: ok, source_url: "https://zendata.security/2026/05/03/g7-evian-2026-the-cyber-risk-map-and-recommendations/", passage: "the criminal groups that specialise in social engineering hotel help-desks have proven extremely effective and remain active."}
  - {claim_id: 25e65dfe4d, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26-cyberresilienz-g7-en", passage: "page title 'Cyber resilience during major events and international conferences', dateline 2026-06-01; old ncsc.admin.ch path answers HTTP 404"}
  - {claim_id: e1a62eb44b, verdict: ok, source_url: "https://zendata.security/2026/05/03/g7-evian-2026-the-cyber-risk-map-and-recommendations/", passage: "will land at GVA, sleep on the Swiss side, and cross the lake daily"}
  - {claim_id: 92dc78e952, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26-cyberresilienz-g7-en", passage: "Large-scale events and international conferences are often used as an opportunity to stage a cyberattack. (page never calls the summit a high-value target)"}
  - {claim_id: d316fb63f9, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26-cyberresilienz-g7-en", passage: "page: 'DDoS attacks targeting Swiss organisations'; neither page names Swiss administrations, suppliers or telecom operators as Evian targets"}
  - {claim_id: 9b43e957e8, verdict: ok, source_url: "https://zendata.security/2026/05/03/g7-evian-2026-the-cyber-risk-map-and-recommendations/", passage: "record summary states what the Correction section states (hotel help-desks not event staff; Geneva claim cited; NCSC quote; analyst judgement; bacs.admin.ch address)"}
  - {claim_id: ed04adf550, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w22-en", passage: "Week 22: Targeted phishing campaign impersonating booking platforms and hotels; 'a data leak in the Booking.com environment in April 2026' tied to Variant 1 only"}
  - {claim_id: 8633531020, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w22-en", passage: "This link points to a deceptively genuine-looking phishing website imitating TWINT, and then leads to second phishing page belonging to a bank ... In the second, albeit long-known, variant"}
  - {claim_id: 3f3d66daf9, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w22-en", passage: "The NCSC has noted an uptick in reports of fraudulent WhatsApp messages relating to hotel bookings ... The NCSC is aware of two different, personalised variants of this scam."}
