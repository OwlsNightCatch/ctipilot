  - {claim_id: 6d69fd0a40, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w22-en", passage: "In the second, albeit long-known, variant ... phishing techniques or malware to obtain login details ... contacted via the platform's official messaging system or additionally via email or WhatsApp"}
  - {claim_id: e43ce9d65a, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w22-en", passage: "labelled 'In analyst judgement'; page: 'the messages appear highly credible due to the correct details and seemingly authentic senders'; page does not rank the variants"}
  - {claim_id: 836aec9b61, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w22-en", passage: "page speaks of 'victims' throughout and names no sector"}
  - {claim_id: f4abb3d13d, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w22-en", passage: "labelled '(analyst inference)'; page recommendations address all recipients of such messages"}
  - {claim_id: 150d6c53bd, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w22-en", passage: "analyst 'Why it matters' guidance built on Variant 2: 'official messaging system'; page names TWINT and a bank as the phishing pages"}
  - {claim_id: 96e8cc6eca, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w22-en", passage: "In the second, albeit long-known, variant of this scam ... (no ranking of the two variants on the page)"}
  - {claim_id: 21b913e5df, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w22-en", passage: "The reason why the perpetrators have such precise information about past hotel stays is a data leak in the Booking.com environment in April 2026 (stated under Variant 1 only)"}
  - {claim_id: 27eaddb991, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w22-en", passage: "section states what title, summary and body now say; body labels the harder-to-spot view 'In analyst judgement'"}
  - {claim_id: 68a2e767e3, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w22-en", passage: "TWINT and a bank named; page refers to 'victims' without country or sector narrowing"}
  - {claim_id: 73cd722b3d, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w22-en", passage: "old https://www.ncsc.admin.ch/ncsc/en/home/aktuell/im-fokus/2026/wochenrueckblick_22.html answers upstream HTTP 404; new page dateline 2026-06-02"}
  - {claim_id: e30f9b6e5e, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w22-en", passage: "record summary matches the Correction section (only refund variant tied to leak; ranking marked analyst judgement; notable; bacs.admin.ch address); fields match git diff"}
  - {claim_id: b99b004aed, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w23-en", passage: "Using three reported cases, the NCSC demonstrates how these scams work ... Fake interview login / A package delivery job as a trap / Fake recruiters on LinkedIn"}
  - {claim_id: 0354749225, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w23-en", passage: "offered a time slot for a phone interview ... confirm via a Google Calendar entry ... login credentials ... sent directly to the scammers; 'Swiss social welfare'; private GitHub repository ... infoste"}
  - {claim_id: 280b8db577, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w23-en", passage: "Using three reported cases, the NCSC demonstrates how these scams work and how to protect yourself effectively. (dateline 2026-06-09)"}
  - {claim_id: bbfbf1e131, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w23-en", passage: "they were offered a time slot for a phone interview, which they were asked to confirm via a Google Calendar entry. When they clicked to confirm, a login window appeared ... sent directly to the scamme"}
  - {claim_id: f468427908, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w23-en", passage: "a supposed \"Swiss social welfare\" programme ... further communication shifted to WhatsApp ... photos of their passport, identity card, driving licence and home address."}
  - {claim_id: e0298f1d5c, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w23-en", passage: "the identity documents obtained during the application process are used to order high-value goods ... a method used to conceal criminal proceeds."}
  - {claim_id: f18e6cd0f9, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w23-en", passage: "the request even originated from a previously compromised LinkedIn profile ... asked to download a private GitHub repository and complete a small programming task within it."}
  - {claim_id: 70b5b58184, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w23-en", passage: "after the commands were executed, an \"infostealer\" installed itself ... designed to secretly read crypto wallets, stored login credentials and browser cookies"}
  - {claim_id: 924d6b57fa, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w23-en", passage: "the associated willingness to react quickly and engage with unfamiliar procedures, lowers vigilance. Attackers exploit this systematically"}
