  - {claim_id: c50e41b577, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w25-en", passage: "aiming either to lure victims to phishing sites or to trick them into installing malware ... malware, such as an infostealer"}
  - {claim_id: 3d146f0973, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w25-en", passage: "Last week, the NCSC received a higher than usual number of reports about a scam involving fake voicemail messages sent via email."}
