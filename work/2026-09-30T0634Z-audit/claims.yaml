claims:
  - claim_id: 1b4aa1f392
    entry: 2026-06-03/ncsc-switzerland-warns-of-cyber-operations-around-the-g7-via
    surface: "summary"
    kind: frontmatter
    text: "NCSC Switzerland issues a pre-event cyber advisory ahead of the G7 Évian summit (15–17 June): the NCSC explicitly anticipates hacktivist DDoS against Swiss organisations (NCSC Switzerland, 2026-06-01). An independent threat map additionally flags state intelligence collection against hotel/telecom infrastructure and mobile-device targeting, echoing the NoName057(16) DDoS waves seen during Bürgenstock 2024 (ZENDATA, 2026-05-03). Most delegations transit Swiss infrastructure (Geneva–Vaud corridor)."
  - claim_id: 653df76d76
    entry: 2026-06-03/ncsc-switzerland-warns-of-cyber-operations-around-the-g7-via
    surface: "body"
    kind: cited
    text: "On 2026-06-01 Switzerland's National Cyber Security Centre published a pre-event advisory warning that large events and international conferences are \"often used as an opportunity to stage a cyberattack\" and that it \"expects disruptive maneuvers in cyberspace again\" around the G7 summit in Évian (France, 15–17 June) ("
    urls: ["https://www.bacs.admin.ch/en/26-cyberresilienz-g7-en"]
  - claim_id: e922502ece
    entry: 2026-06-03/ncsc-switzerland-warns-of-cyber-operations-around-the-g7-via
    surface: "body"
    kind: cited
    text: "Although the summit sits on French soil, most delegations land at Geneva airport and stay on the Swiss side ("
    urls: ["https://zendata.security/2026/05/03/g7-evian-2026-the-cyber-risk-map-and-recommendations/"]
  - claim_id: a3304fb33e
    entry: 2026-06-03/ncsc-switzerland-warns-of-cyber-operations-around-the-g7-via
    surface: "body"
    kind: cited
    text: "An independently published threat map for the event frames the expected activity against the template of the 2024 Bürgenstock summit, when the pro-Russia hacktivist collective NoName057(16) ran DDoS waves against Swiss federal sites and conference-linked organisations on each summit day; the same map additionally flags state intelligence collection against hotel and telecom infrastructure, rogue-base-station cellular interception, and social engineering of hotel help desks as plausible vectors ("
    urls: ["https://zendata.security/2026/05/03/g7-evian-2026-the-cyber-risk-map-and-recommendations/"]
  - claim_id: 928f304501
    entry: 2026-06-03/ncsc-switzerland-warns-of-cyber-operations-around-the-g7-via
    surface: "body"
    kind: uncited
    text: "In analyst judgement that puts Swiss federal and cantonal administrations, conference-linked suppliers and Swiss telecom operators in the blast radius."
  - claim_id: da09701d87
    entry: 2026-06-03/ncsc-switzerland-warns-of-cyber-operations-around-the-g7-via
    surface: "body"
    kind: uncited
    text: "The NCSC advisory itself recommends generic protective measures and DDoS preparedness for organisations linked to the event."
  - claim_id: 81fdac5b55
    entry: 2026-06-03/ncsc-switzerland-warns-of-cyber-operations-around-the-g7-via
    surface: "body"
    kind: uncited
    text: "**Why it matters to us:** Organisations operating in the Geneva–Vaud corridor and Swiss federal/cantonal SOCs should pre-stage DDoS mitigation playbooks now, review MFA on customer-facing identity providers, rotate administrative credentials before the event window, and brief travelling staff on mobile-device physical security."
  - claim_id: d9de9e5b00
    entry: 2026-06-03/ncsc-switzerland-warns-of-cyber-operations-around-the-g7-via
    surface: "body"
    kind: uncited
    text: "Around 15–17 June, hunt for anomalous authentication spikes from the summit region."
