    surface: "section 2026-09-30T06:43:01Z"
    kind: uncited
    text: "The citation now points at the page's new address on bacs.admin.ch, after the old ncsc.admin.ch page went dead."
  - claim_id: 6232a98a69
    entry: 2026-06-10/ncsc-ch-week-23-coordinated-surge-in-job-seeker-targeting-fa
    surface: "record 2026-09-30T06:43:01Z"
    kind: record-summary
    text: "NCSC presents three reported cases rather than a coordinated campaign, and none of the Swiss-employer emails, onboarding repository or PowerShell the analysis described, so the title, summary and analysis now follow the page. The citation follows the page to its new address on bacs.admin.ch."
  - claim_id: c50e41b577
    entry: 2026-06-25/ncsc-ch-active-microsoft-365-voicemail-phishing-wave-in-swit
    surface: "headline"
    kind: frontmatter
    text: "NCSC-CH: Microsoft 365 \"voicemail\" phishing wave delivers malware such as infostealers and harvests M365 credentials"
  - claim_id: 3d146f0973
    entry: 2026-06-25/ncsc-ch-active-microsoft-365-voicemail-phishing-wave-in-swit
    surface: "summary"
    kind: frontmatter
    text: "NCSC-CH received a higher than usual number of reports of a Microsoft 365 \"voicemail\" phishing wave: its Week 25 review documents a ZIP attachment that installs malware such as an infostealer and a fake login page that steals M365 credentials, with downstream BEC and chain-phishing once a mailbox is taken. The ZIP-as-audio lure is the key detection discriminator (NCSC-CH, 2026-06-23)."
  - claim_id: 204aee18d5
    entry: 2026-06-25/ncsc-ch-active-microsoft-365-voicemail-phishing-wave-in-swit
    surface: "body"
    kind: cited
    text: "Switzerland's National Cyber Security Centre received a higher-than-usual number of reports about a dual-path Microsoft 365 / OneDrive-for-Business phishing campaign, its Week 25 review says ("
    urls: ["https://www.bacs.admin.ch/en/26w25-en"]
  - claim_id: c4c1a9d5a0
    entry: 2026-06-25/ncsc-ch-active-microsoft-365-voicemail-phishing-wave-in-swit
    surface: "body"
    kind: uncited
    text: "In the malware-delivery variant the email carries a ZIP \"audio\" attachment, and running its contents installs malware, such as an infostealer, that can harvest login details, cookies or wallet information."
  - claim_id: 3b7b887ff6
    entry: 2026-06-25/ncsc-ch-active-microsoft-365-voicemail-phishing-wave-in-swit
    surface: "body"
    kind: uncited
    text: "In the credential-harvest variant a fake Microsoft login page with a simulated audio player (\"Play voicemail as guest\") captures the M365 username and password."
  - claim_id: d9e973938e
    entry: 2026-06-25/ncsc-ch-active-microsoft-365-voicemail-phishing-wave-in-swit
    surface: "body"
    kind: uncited
    text: "The link in the notification, or an HTML file attached to it, leads to that page."
  - claim_id: abdffd848e
    entry: 2026-06-25/ncsc-ch-active-microsoft-365-voicemail-phishing-wave-in-swit
    surface: "body"
    kind: uncited
    text: "NCSC-CH notes that a compromised mailbox is then often used to send phishing to all of the victim's contacts (\"chain phishing\"), that the attackers read business communications to prepare CEO fraud and business email compromise from a real employee's address, and that data an infostealer harvests may also be resold and in some cases resurfaces weeks or months later."
  - claim_id: 8fd8556f30
    entry: 2026-06-25/ncsc-ch-active-microsoft-365-voicemail-phishing-wave-in-swit
    surface: "body"
    kind: uncited
    text: "**Why it matters to us:** The discriminator is mechanical: genuine voicemail notifications are usually audio files such as `.wav` or `.mp3`, not ZIP archives."
  - claim_id: f689d57cd7
    entry: 2026-06-25/ncsc-ch-active-microsoft-365-voicemail-phishing-wave-in-swit
    surface: "body"
    kind: uncited
    text: "In analyst judgement, phishing-resistant MFA (FIDO2 / certificate-based Conditional Access) blocks the fake-login path even when the lure succeeds, though not a session cookie an infostealer has already taken."
  - claim_id: ee18743117
    entry: 2026-06-25/ncsc-ch-active-microsoft-365-voicemail-phishing-wave-in-swit
    surface: "body"
    kind: uncited
    text: "By inference from the mailbox monitoring NCSC-CH describes, hunt M365 audit logs for mailbox access from a new country or ASN shortly after a sign-in, and for inbox or forwarding rules created in that session."
  - claim_id: e50f2c9e6a
    entry: 2026-06-25/ncsc-ch-active-microsoft-365-voicemail-phishing-wave-in-swit
    surface: "section 2026-09-30T06:43:01Z"
    kind: cited
    text: "NCSC Switzerland's Week 25 review describes what attackers do with a compromised mailbox: they send phishing to the victim's contacts (\"chain phishing\") and read business communications to prepare CEO fraud and business email compromise ("
    urls: ["https://www.bacs.admin.ch/en/26w25-en"]
  - claim_id: 74bd706ff4
    entry: 2026-06-25/ncsc-ch-active-microsoft-365-voicemail-phishing-wave-in-swit
    surface: "section 2026-09-30T06:43:01Z"
    kind: uncited
    text: "It does not describe forwarding rules or account manipulation, which the analysis had mapped."
  - claim_id: 8797c5e86f
    entry: 2026-06-25/ncsc-ch-active-microsoft-365-voicemail-phishing-wave-in-swit
    surface: "section 2026-09-30T06:43:01Z"
    kind: uncited
    text: "It also says genuine voicemails are usually sent as audio files rather than ZIP archives, and that data an infostealer harvests may be resold, where the analysis had said never and frequently."
  - claim_id: 3e3b8a2904
    entry: 2026-06-25/ncsc-ch-active-microsoft-365-voicemail-phishing-wave-in-swit
    surface: "section 2026-09-30T06:43:01Z"
    kind: uncited
    text: "The analysis now follows the page, and the hunt for inbox and forwarding rules is marked as an inference from the mailbox monitoring NCSC describes."
  - claim_id: 2233528d3b
    entry: 2026-06-25/ncsc-ch-active-microsoft-365-voicemail-phishing-wave-in-swit
    surface: "section 2026-09-30T06:43:01Z"
    kind: uncited
    text: "NCSC gives the infostealer only as an example of the malware the ZIP installs, and it names no sector and no Swiss public-sector recipients, so the title and analysis now say so and the entry's priority is notable rather than high."
  - claim_id: 4a26efa7ff
    entry: 2026-06-25/ncsc-ch-active-microsoft-365-voicemail-phishing-wave-in-swit
    surface: "section 2026-09-30T06:43:01Z"
    kind: uncited
    text: "The citation now points at the page's new address on bacs.admin.ch, after the old ncsc.admin.ch page went dead."
  - claim_id: 948b4064ae
    entry: 2026-06-25/ncsc-ch-active-microsoft-365-voicemail-phishing-wave-in-swit
    surface: "record 2026-09-30T06:43:01Z"
    kind: record-summary
    text: "NCSC does not describe forwarding rules or account manipulation, says genuine voicemails are usually rather than never audio files and harvested data may rather than frequently be resold, names no sector and gives the infostealer only as an example of the malware, so the title and analysis now follow the page and the entry moves from high to notable priority. The citation follows the page to its new address on bacs.admin.ch."
