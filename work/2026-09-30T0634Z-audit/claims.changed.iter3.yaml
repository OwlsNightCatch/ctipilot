  - claim_id: bf8da613ae
    entry: 2026-06-03/ncsc-switzerland-warns-of-cyber-operations-around-the-g7-via
    surface: "record 2026-09-30T06:43:01Z"
    kind: record-summary
    text: "The Swiss national cyber security centre moved its website to bacs.admin.ch, and the cited page now answers 404 at its old ncsc.admin.ch address, so the citations point at the same page on the new site. Re-reading ZENDATA's risk map, the analysis named social engineering against event staff where the map names social engineering of hotel help desks, and it now says so. The ATT&CK mapping the analysis describes (hacktivist DDoS waves) and an Admiralty rating of A3, since the advisory is an expectation rather than observed activity, are added. The claim that most delegations land at Geneva and stay on the Swiss side now cites ZENDATA, whose map it comes from, the entry links the registry's report record, and an em dash in the summary is replaced."
  - claim_id: 150d6c53bd
