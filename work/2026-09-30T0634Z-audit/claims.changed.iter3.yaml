  - claim_id: c27d3004a4
    entry: 2026-06-04/ncsc-switzerland-booking-com-breach-feeds-two-pronged-whatsa
    surface: "record 2026-09-30T06:43:01Z"
    kind: record-summary
    text: "The Swiss national cyber security centre moved its website to bacs.admin.ch, and the cited page now answers 404 at its old ncsc.admin.ch address, so the citations point at the same page on the new site. The title, headline, summary and analysis tied both scam variants to the April 2026 Booking.com data leak and ranked the second as the more dangerous. NCSC ties only the refund variant to the leak and calls the account-takeover variant long-known, and it does not rank them, so the text now follows the page and the ranking is marked as analyst judgement. The WhatsApp lure is mapped as spearphishing via a service rather than a link, and an Admiralty rating of A2 is added. Its priority moves from high to notable and its sector tags are cleared, since NCSC describes a consumer card-phishing scam and names no sector."
  - claim_id: 26b085934c
    entry: 2026-06-10/ncsc-ch-week-23-coordinated-surge-in-job-seeker-targeting-fa
    surface: "record 2026-09-30T06:43:01Z"
    kind: record-summary
    text: "The Swiss national cyber security centre moved its website to bacs.admin.ch, and the cited page now answers 404 at its old ncsc.admin.ch address, so the citations point at the same page on the new site. The title, summary and analysis described a coordinated surge and details the page does not carry (interview-confirmation emails from plausible Swiss employers, an onboarding or technical-assessment repository, PowerShell). NCSC presents three reported cases: a Google Calendar confirmation that opens a fake Google login, a fake packing job that collects identity documents, and a fake recruiter's technical interview with a small programming task from a private GitHub repository. The text follows the page, the mapping drops PowerShell and valid-account use for user execution of a malicious file and browser-cookie theft, and an Admiralty rating of A2 is added. Its sector tag is cleared, since the page names no sector."
  - claim_id: c34c5b2206
    entry: 2026-06-25/ncsc-ch-active-microsoft-365-voicemail-phishing-wave-in-swit
    surface: "summary"
    kind: frontmatter
    text: "NCSC-CH flags an active Microsoft 365 \"voicemail\" phishing wave in Switzerland: Week 25 review documents dual-path ZIP-borne infostealer / fake-login credential theft against M365 tenants, with downstream BEC and chain-phishing once a mailbox is taken; the ZIP-as-audio lure is the key detection discriminator (NCSC-CH, 2026-06-23)."
  - claim_id: 769aca52f6
    entry: 2026-06-25/ncsc-ch-active-microsoft-365-voicemail-phishing-wave-in-swit
    surface: "body"
    kind: uncited
    text: "In the malware-delivery variant the email carries a ZIP \"audio\" attachment that, when run, installs an infostealer that harvests login details, cookies and wallet data; in the credential-harvest variant a fake Microsoft login page with a simulated audio player (\"Play voicemail as guest\") captures the M365 username and password."
  - claim_id: 9a7f9a7bf3
    entry: 2026-06-25/ncsc-ch-active-microsoft-365-voicemail-phishing-wave-in-swit
    surface: "record 2026-09-30T06:43:01Z"
    kind: record-summary
    text: "The Swiss national cyber security centre moved its website to bacs.admin.ch, and the cited page now answers 404 at its old ncsc.admin.ch address, so the citations point at the same page on the new site. The analysis mapped mailbox forwarding rules and account manipulation, which NCSC does not describe, stated that genuine voicemails are never ZIP files and that stolen data is frequently resold, and said Swiss public-sector staff were direct recipients. NCSC says the attackers read business communications to prepare CEO fraud and BEC, that genuine voicemails are usually audio files, and that harvested data may be resold, and names no sector; the text now follows the page. The mapping is the ZIP attachment, the phishing link, browser-credential theft and remote email collection, the spliced evidence quotation is two verbatim quotations, and an Admiralty rating of A2 is added. The infostealer's haul is given as the page gives it (login details, cookies and wallet information), mapped to credential-store and session-cookie theft, the sector tags are cleared, and the entry links the registry's campaign record."
