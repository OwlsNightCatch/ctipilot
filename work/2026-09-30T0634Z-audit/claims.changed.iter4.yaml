  - claim_id: 97c2377e2a
    entry: 2026-06-25/ncsc-ch-active-microsoft-365-voicemail-phishing-wave-in-swit
    surface: "summary"
    kind: frontmatter
    text: "NCSC-CH flags an active Microsoft 365 \"voicemail\" phishing wave in Switzerland: Week 25 review documents dual-path ZIP-borne infostealer / fake-login credential theft against M365 tenants, with downstream BEC and chain-phishing once a mailbox is taken. The ZIP-as-audio lure is the key detection discriminator (NCSC-CH, 2026-06-23)."
  - claim_id: 204aee18d5
    entry: 2026-06-25/ncsc-ch-active-microsoft-365-voicemail-phishing-wave-in-swit
    surface: "body"
    kind: cited
    text: "Switzerland's National Cyber Security Centre received a higher-than-usual number of reports about a dual-path Microsoft 365 / OneDrive-for-Business phishing campaign, its Week 25 review says ("
    urls: ["https://www.bacs.admin.ch/en/26w25-en"]
  - claim_id: b1e5d82dce
    entry: 2026-06-25/ncsc-ch-active-microsoft-365-voicemail-phishing-wave-in-swit
    surface: "body"
    kind: uncited
    text: "In the malware-delivery variant the email carries a ZIP \"audio\" attachment that, when run, installs an infostealer that harvests login details, cookies and wallet data."
  - claim_id: 3b7b887ff6
    entry: 2026-06-25/ncsc-ch-active-microsoft-365-voicemail-phishing-wave-in-swit
    surface: "body"
    kind: uncited
    text: "In the credential-harvest variant a fake Microsoft login page with a simulated audio player (\"Play voicemail as guest\") captures the M365 username and password."
  - claim_id: 28760138d3
    entry: 2026-06-25/ncsc-ch-active-microsoft-365-voicemail-phishing-wave-in-swit
    surface: "body"
    kind: uncited
    text: "Phishing-resistant MFA (FIDO2 / certificate-based Conditional Access) defeats the credential-theft path even when the lure succeeds."
  - claim_id: ee18743117
    entry: 2026-06-25/ncsc-ch-active-microsoft-365-voicemail-phishing-wave-in-swit
    surface: "body"
    kind: uncited
    text: "By inference from the mailbox monitoring NCSC-CH describes, hunt M365 audit logs for mailbox access from a new country or ASN shortly after a sign-in, and for inbox or forwarding rules created in that session."
  - claim_id: 6e8de09f75
    entry: 2026-06-25/ncsc-ch-active-microsoft-365-voicemail-phishing-wave-in-swit
    surface: "section 2026-09-30T06:43:01Z"
