claims:
  - {claim_id: 8bbef7262a, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26-cyberresilienz-g7-en", passage: "The National Cyber Security Centre (NCSC) therefore expects disruptive maneuvers in cyberspace again in the context of the the G7 summit ... 15 to 17 June 2026 in Évian; page date 2026-06-01"}
  - {claim_id: 06b852777f, verdict: F3, source_url: "https://zendata.security/2026/05/03/g7-evian-2026-the-cyber-risk-map-and-recommendations/", passage: "Bürgenstock 2024 NoName057(16) DDoS on each summit day is verbatim; but the map names 'criminal groups that specialise in social engineering hotel help-desks', not 'event staff' (low confidence)"}
  - {claim_id: 82d56f924d, verdict: ok, source_url: "https://zendata.security/2026/05/03/g7-evian-2026-the-cyber-risk-map-and-recommendations/", passage: "most of the delegations, journalists and corporate observers will land at GVA, sleep on the Swiss side, and cross the lake daily (Geneva, Lausanne, Vaud, Valais)"}
  - {claim_id: da09701d87, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26-cyberresilienz-g7-en", passage: "The NCSC anticipates that there will be disruptive cyberoperations during the G7, particularly ... DDoS attacks; page links bacs-leitfaden-ddos-angriffen_en.pdf and the measures PDF"}
  - {claim_id: ad9382cba3, verdict: ok, source_url: "https://zendata.security/2026/05/03/g7-evian-2026-the-cyber-risk-map-and-recommendations/", passage: "rotate administrative credentials before 1 June; analyst advice, no factual claim beyond the sources"}
  - {claim_id: 3fc8caadce, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26-cyberresilienz-g7-en", passage: "old ncsc.admin.ch path answers 301 to www.bacs.admin.ch/ncsc/... which is 404; new page carries the advisory text"}
  - {claim_id: ca90d1be0f, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w22-en", passage: "a data leak in the Booking.com environment in April 2026 ... correct dates of stay, the name of the hotel and the exact names of the guests"}
  - {claim_id: 54519ff0f3, verdict: F4, source_url: "https://www.bacs.admin.ch/en/26w22-en", passage: "victims receive an unsolicited WhatsApp message ... link points to ... phishing website imitating TWINT; T1566.002 is pinned as 'spearphishing emails', a WhatsApp message is T1566.003 (low confidence)"}
  - {claim_id: c0bd18a1ad, verdict: F14, source_url: "https://www.bacs.admin.ch/en/26w22-en", passage: "In the second, albeit long-known, variant ... ; the page places 'The danger' on Variant 1's credibility and never ranks Variant 2 as more dangerous"}
  - {claim_id: bb80dcd6b3, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w22-en", passage: "labelled analyst inference; page addresses recipients of hotel-booking messages"}
  - {claim_id: 2484f02bc8, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w22-en", passage: "Customers are then often contacted via the platform's official messaging system or additionally via email or WhatsApp"}
  - {claim_id: 6d05968fba, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w22-en", passage: "same page on the new host, page date 2026-06-02"}
  - {claim_id: 1bf3e8a2d6, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w23-en", passage: "Using three reported cases, the NCSC demonstrates how these scams work; page date 2026-06-09"}
  - {claim_id: 80f4b8b084, verdict: F4, source_url: "https://www.bacs.admin.ch/en/26w23-en", passage: "a jobseeker came across what appeared to be a job advertisement ... offered a time slot for a phone interview ... confirm via a Google Calendar entry; no 'emails' and no 'Swiss employers'; credentials 'sent directly to the scammers', no account use (T1078)"}
  - {claim_id: 9509f52b75, verdict: F4, source_url: "https://www.bacs.admin.ch/en/26w23-en", passage: "asked to submit a form with photos of their passport, identity card, driving licence and home address; the word 'onboarding' does not appear on the page"}
  - {claim_id: f85cc17912, verdict: F4, source_url: "https://www.bacs.admin.ch/en/26w23-en", passage: "download a private GitHub repository and complete a small programming task ... after the commands were executed, an 'infostealer' installed itself; no 'technical assessment', no 'onboarding', no PowerShell"}
  - {claim_id: d95ff78afd, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w23-en", passage: "The hope of landing a new job ... lowers vigilance. Attackers exploit this systematically"}
  - {claim_id: 5f58a6e91f, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w23-en", passage: "analyst inference from the LinkedIn/GitHub case"}
  - {claim_id: 04ffe44182, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w23-en", passage: "analyst detection concept from the GitHub-repo case; no factual claim about the source"}
  - {claim_id: 4d11100dc9, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w23-en", passage: "NCSC-CH is a national CERT, bacs.admin.ch is in NATIONAL_CERT_HOSTS (composition-rationale sentence is an F11 advisory)"}
  - {claim_id: 01f7648a8d, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w23-en", passage: "same page on the new host, page date 2026-06-09"}
  - {claim_id: 6c059e9663, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w25-en", passage: "Last week, the NCSC received a higher than usual number of reports about a scam involving fake voicemail messages"}
  - {claim_id: 4137436847, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w25-en", passage: "The email has a compressed file attached ... audio_Y6CEKNH8OE.zip ... blue button labelled \"Play voicemail as guest\""}
  - {claim_id: 0489ae366c, verdict: F4, source_url: "https://www.bacs.admin.ch/en/26w25-en", passage: "By reading these messages, they can piece together information ... (no forwarding rule, no account manipulation stated); 'may also be resold' / 'In some cases ... weeks or months later'"}
  - {claim_id: e858c6ee29, verdict: F5, source_url: "https://www.bacs.admin.ch/en/26w25-en", passage: "the page names no sector or public-sector recipients (no 'public sector', 'administration' or 'federal' on the page)"}
  - {claim_id: 756a9537e2, verdict: F14, source_url: "https://www.bacs.admin.ch/en/26w25-en", passage: "Genuine voice messages or voicemails from telephone systems are usually sent as audio files, such as .wav or .mp3, rather than as ZIP archives."}
  - {claim_id: 29179ca48e, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w25-en", passage: "analyst hardening advice; page recommends never entering Microsoft login details via an emailed link"}
  - {claim_id: 261e5b8f49, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w25-en", passage: "evidence quotes 1-3 are verbatim (punctuation-insensitive): 'ZIP file called \"audio_Y6CEKNH8OE.zip\"', 'Stolen Microsoft 365 login details give attackers access to emails, OneDrive, SharePoint and Teams', 'The compromised mailbox is then often used to send phishing emails to all of the victim’s contacts (\"chain phishing\")'"}
