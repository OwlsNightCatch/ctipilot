claims:
  - {claim_id: 8bbef7262a, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26-cyberresilienz-g7-en", passage: "NCSC: \"expects disruptive maneuvers in cyberspace again in the context of the the G7 summit ... 15 to 17 June 2026 in Évian\"; page date 2026-06-01"}
  - {claim_id: a3304fb33e, verdict: ok, source_url: "https://zendata.security/2026/05/03/g7-evian-2026-the-cyber-risk-map-and-recommendations/", passage: "\"During Bürgenstock 2024, NoName057(16) ran DDoS waves on each summit day against Swiss federal sites and conference-linked organisations\"; risks 2, 4, 5 cover hotels/telecom, base stations, help-desk"}
  - {claim_id: 82d56f924d, verdict: F5, source_url: "https://zendata.security/2026/05/03/g7-evian-2026-the-cyber-risk-map-and-recommendations/", passage: "ZENDATA: \"most of the delegations ... will land at GVA, sleep on the Swiss side\"; the body sentence carries no citation and the NCSC page does not say it (low confidence)"}
  - {claim_id: da09701d87, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26-cyberresilienz-g7-en", passage: "Raw page lists downloads \"NCSC DDoS Attack Guidance for Exposed Events\" and the major-events measures PDF; text: \"DDoS attacks expected\""}
  - {claim_id: ad9382cba3, verdict: ok, source_url: "https://zendata.security/2026/05/03/g7-evian-2026-the-cyber-risk-map-and-recommendations/", passage: "\"rotate administrative credentials before 1 June\"; \"MFA review on all customer-facing identity providers\"; analyst advice, no factual claim beyond sources"}
  - {claim_id: 7045a9028e, verdict: ok, source_url: "https://zendata.security/2026/05/03/g7-evian-2026-the-cyber-risk-map-and-recommendations/", passage: "\"the criminal groups that specialise in social engineering hotel help-desks have proven extremely effective\"; \"event staff\" not named"}
  - {claim_id: 45496e814e, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26-cyberresilienz-g7-en", passage: "page title \"Cyber resilience during major events and international conferences\", date 2026-06-01; old ncsc.admin.ch path 301 then 404"}
  - {claim_id: 24e628e42b, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26-cyberresilienz-g7-en", passage: "old ncsc.admin.ch G7 URL: HTTP 404 (301 to bacs.admin.ch/ncsc/... path); new page carries the advisory; T1498 active in pin v19.2"}
  - {claim_id: 62633e1d5d, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w22-en", passage: "Week 22 page: two variants; only Variant 1 tied to \"a data leak in the Booking.com environment in April 2026\""}
  - {claim_id: 8633531020, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w22-en", passage: "Variant 2 \"albeit long-known ... contacted via the platform’s official messaging system\"; Variant 1 TWINT then bank page for card details"}
  - {claim_id: 3f3d66daf9, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w22-en", passage: "\"an uptick in reports of fraudulent WhatsApp messages relating to hotel bookings\"; \"two different, personalised variants\"; page date 2026-06-02"}
  - {claim_id: 4fadf7568f, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w22-en", passage: "\"correct dates of stay, the name of the hotel and the exact names of the guests\"; link to TWINT imitation then bank phishing page"}
  - {claim_id: 6d69fd0a40, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w22-en", passage: "\"phishing techniques or malware to obtain login details ... official messaging system or additionally via email or WhatsApp ... advance payment\""}
  - {claim_id: e43ce9d65a, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w22-en", passage: "Marked \"analyst judgement\"; NCSC does not rank the variants (\"The danger lies in the high credibility\" is under Variant 1)"}
  - {claim_id: bb80dcd6b3, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w22-en", passage: "Labelled analyst inference; the page addresses booking-message recipients (TWINT, Swiss banks, Suisse ePolice)"}
  - {claim_id: 2484f02bc8, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w22-en", passage: "Analyst detection advice built on Variant 2 \"official messaging system\"; no factual claim beyond the page"}
  - {claim_id: 96e8cc6eca, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w22-en", passage: "\"In the second, albeit long-known, variant\"; page never ranks the variants"}
  - {claim_id: 21b913e5df, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w22-en", passage: "Leak sentence sits under Variant 1 only; Variant 2 uses credentials obtained by phishing or malware"}
  - {claim_id: 27eaddb991, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w22-en", passage: "Narrative of the entry change; title, summary and body carry the corrected wording"}
  - {claim_id: e00dce2b75, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w22-en", passage: "Old ncsc.admin.ch wochenrueckblick path 404; new page same content, date 2026-06-02; techniques T1566.003, T1078.004 active"}
  - {claim_id: b99b004aed, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w23-en", passage: "Page: \"Using three reported cases, the NCSC demonstrates how these scams work\""}
  - {claim_id: 0354749225, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w23-en", passage: "Case 1 Google Calendar confirmation then fake login; case 2 \"Swiss social welfare\" packing job; case 3 private GitHub repository, infostealer"}
  - {claim_id: 280b8db577, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w23-en", passage: "\"Over the past few weeks, the NCSC has received several reports from job seekers ... three reported cases\"; date 2026-06-09"}
  - {claim_id: bbfbf1e131, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w23-en", passage: "\"a time slot for a phone interview, which they were asked to confirm via a Google Calendar entry ... login credentials ... sent directly to the scammers\""}
  - {claim_id: f468427908, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w23-en", passage: "\"Swiss social welfare\" programme ... communication shifted to WhatsApp ... photos of their passport, identity card, driving licence and home address"}
  - {claim_id: e0298f1d5c, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w23-en", passage: "\"identity documents ... used to order high-value goods ... in the victim’s name\"; \"freight forwarder ... conceal criminal proceeds\""}
  - {claim_id: f18e6cd0f9, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w23-en", passage: "\"contacted on LinkedIn by a supposed recruiter ... previously compromised LinkedIn profile ... download a private GitHub repository and complete a small programming task\""}
  - {claim_id: 70b5b58184, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w23-en", passage: "\"an infostealer installed itself ... read crypto wallets, stored login credentials and browser cookies\""}
  - {claim_id: 924d6b57fa, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w23-en", passage: "\"willingness to react quickly and engage with unfamiliar procedures ... Attackers exploit this systematically\""}
  - {claim_id: a0cfe75445, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w23-en", passage: "Analyst inference from the LinkedIn/GitHub case, framed as such; no factual claim about the source"}
  - {claim_id: 46f7b8fc78, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w23-en", passage: "Labelled \"by inference from the mechanism\"; page says only \"after the commands were executed\""}
  - {claim_id: 60dffe9b88, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w23-en", passage: "\"Using three reported cases\"; nothing links the cases to one actor"}
  - {claim_id: c1fe7a274b, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w23-en", passage: "Case 1 as above"}
  - {claim_id: 2250d3f1b2, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w23-en", passage: "\"download a private GitHub repository and complete a small programming task within it ... after the commands were executed, an infostealer installed itself\""}
  - {claim_id: 6cf0b96653, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w23-en", passage: "Page has no interview-confirmation emails, no Swiss employers and no onboarding repository; the case-2 emails are a different case"}
  - {claim_id: f5d4fe0172, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w23-en", passage: "Old wochenrueckblick_23 path 404; new page date 2026-06-09; techniques T1566.002, T1566.003, T1204.002, T1555, T1539 active and page-supported"}
  - {claim_id: 6c059e9663, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w25-en", passage: "\"higher than usual number of reports about a scam involving fake voicemail messages\"; \"Microsoft 365 or OneDrive for Business\""}
  - {claim_id: 4137436847, verdict: F4, source_url: "https://www.bacs.admin.ch/en/26w25-en", passage: "Page: \"any login details, cookies or wallet information harvested by the malware\"; it names no browser and no session cookies, so \"browser credentials\" and T1555.003 exceed it (low confidence)"}
  - {claim_id: d9e973938e, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w25-en", passage: "\"The link contained in the supposed voicemail notification, or the HTML file attached to the email, leads to a professionally forged Microsoft login page\""}
  - {claim_id: abdffd848e, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w25-en", passage: "\"often used to send phishing emails to all of the victim’s contacts\"; \"monitor business communications ... CEO fraud or BEC\"; \"may also be resold ... weeks or months later\""}
  - {claim_id: 8fd8556f30, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w25-en", passage: "\"Genuine voice messages or voicemails ... are usually sent as audio files, such as .wav or .mp3, rather than as ZIP archives\""}
  - {claim_id: 46b7a91383, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w25-en", passage: "Control advice; hunt marked \"by inference from the mailbox monitoring NCSC-CH describes\"; no factual claim beyond the page"}
  - {claim_id: e50f2c9e6a, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w25-en", passage: "chain phishing and \"By reading these messages, they can piece together information ... CEO fraud\"; no forwarding rules on the page"}
  - {claim_id: 74bd706ff4, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w25-en", passage: "0 hits for forward/rule/persist/account manipulation on the page"}
  - {claim_id: 8797c5e86f, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w25-en", passage: "\"usually sent as audio files\"; \"may also be resold on the dark web\""}
  - {claim_id: 3e3b8a2904, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w25-en", passage: "Narrative of the change; body now reads \"by inference ... hunt ... inbox or forwarding rules\""}
  - {claim_id: 85d5db47d6, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w25-en", passage: "Old wochenrueckblick_25 path 404; new page date 2026-06-23; four evidence quotes verbatim on the page; techniques active"}
