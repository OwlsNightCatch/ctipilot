claims:
  - {claim_id: e613167093, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26-cyberresilienz-g7-en", passage: "NCSC: \"particularly distributed denial-of-service (DDoS) attacks targeting Swiss organisations\"; ZENDATA lists state collection via hotels/telecom (risk 2), spyware vs delegates (6); em dash gone"}
  - {claim_id: 8bbef7262a, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26-cyberresilienz-g7-en", passage: "\"expects disruptive maneuvers in cyberspace again in the context of the the G7 summit ... 15 to 17 June 2026 in Évian\"; page date 2026-06-01 (\"high-value target\" is paraphrase)"}
  - {claim_id: e922502ece, verdict: ok, source_url: "https://zendata.security/2026/05/03/g7-evian-2026-the-cyber-risk-map-and-recommendations/", passage: "\"most of the delegations, journalists and corporate observers will land at GVA, sleep on the Swiss side, and cross the lake daily\""}
  - {claim_id: a3304fb33e, verdict: ok, source_url: "https://zendata.security/2026/05/03/g7-evian-2026-the-cyber-risk-map-and-recommendations/", passage: "\"During Bürgenstock 2024, NoName057(16) ran DDoS waves on each summit day against Swiss federal sites\"; risk 4 rogue 2G base station; risk 5 \"social engineering hotel help-desks\""}
  - {claim_id: da09701d87, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26-cyberresilienz-g7-en", passage: "\"core protective measures remain the same as in normal circumstances\"; section \"DDoS attacks expected\"; recommendations by the NCSC"}
  - {claim_id: ad9382cba3, verdict: ok, source_url: "https://zendata.security/2026/05/03/g7-evian-2026-the-cyber-risk-map-and-recommendations/", passage: "analyst advice; ZENDATA: \"rotate administrative credentials before 1 June\", \"MFA review on all customer-facing identity providers\"; no factual claim beyond sources"}
  - {claim_id: 7045a9028e, verdict: ok, source_url: "https://zendata.security/2026/05/03/g7-evian-2026-the-cyber-risk-map-and-recommendations/", passage: "\"the criminal groups that specialise in social engineering hotel help-desks have proven extremely effective and remain active\"; event staff not named"}
  - {claim_id: 45496e814e, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26-cyberresilienz-g7-en", passage: "page date 2026-06-01, title \"Cyber resilience during major events and international conferences\"; old ncsc.admin.ch URL: 301 to bacs.admin.ch/ncsc/... then 404"}
  - {claim_id: bf8da613ae, verdict: ok, source_url: "https://zendata.security/2026/05/03/g7-evian-2026-the-cyber-risk-map-and-recommendations/", passage: "help-desk vector confirmed; T1498 active in pinned v19.2; delegations sentence now cites ZENDATA; registry report:g7-evian-2026 linked; em dash removed (diff)"}
  - {claim_id: 62633e1d5d, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w22-en", passage: "only Variant 1 tied to \"a data leak in the Booking.com environment in April 2026\"; Variant 2 \"albeit long-known\"; page names victims, not Swiss travellers (low-confidence residue, see F3)"}
  - {claim_id: 8633531020, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w22-en", passage: "Variant 1: TWINT phishing site \"then leads to second phishing page belonging to a bank\"; Variant 2 \"contacted via the platform’s official messaging system\""}
  - {claim_id: 3f3d66daf9, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w22-en", passage: "\"an uptick in reports of fraudulent WhatsApp messages relating to hotel bookings\"; \"two different, personalised variants\"; page date 2026-06-02"}
  - {claim_id: 4fadf7568f, verdict: F3, source_url: "https://www.bacs.admin.ch/en/26w22-en", passage: "page: \"second phishing page belonging to a bank\"; the page never says Swiss bank portals (low confidence); booking data and April 2026 leak otherwise supported"}
  - {claim_id: 6d69fd0a40, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w22-en", passage: "\"criminals using phishing techniques or malware to obtain login details for a hotel booking systems\"; \"official messaging system or additionally via email or WhatsApp\"; card verification or advance pa"}
  - {claim_id: e43ce9d65a, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w22-en", passage: "labelled analyst judgement, not attributed to NCSC; page does not rank the variants"}
  - {claim_id: bb80dcd6b3, verdict: F3, source_url: "https://www.bacs.admin.ch/en/26w22-en", passage: "page says \"victims\"/\"recipients\" and never frames targets as Swiss hotel-booking customers; \"Suisse ePolice\" is the only Swiss mention (low confidence); rest labelled analyst inference"}
  - {claim_id: 150d6c53bd, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w22-en", passage: "analysis of variant 2 (\"platform’s official messaging system\"); no factual claim beyond the page"}
  - {claim_id: 96e8cc6eca, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w22-en", passage: "\"the second, albeit long-known, variant\"; the page has no ranking of the variants"}
  - {claim_id: 21b913e5df, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w22-en", passage: "only Variant 1 sentence carries the leak: \"The reason why the perpetrators have such precise information ... is a data leak in the Booking.com environment in April 2026\""}
  - {claim_id: 27eaddb991, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w22-en", passage: "describes the entry's own edit; body carries the analyst-judgement label as stated"}
  - {claim_id: 1b574c725d, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w22-en", passage: "\"to obtain credit card details from their victims\"; no sector named; frontmatter priority: notable, sectors: [] (diff)"}
  - {claim_id: c27d3004a4, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w22-en", passage: "fields [sources, techniques, classification, title, headline, summary, priority, sectors, body] match the diff; T1566.003/T1078.004 active; A2 defensible (content in F11 advisory)"}
  - {claim_id: b99b004aed, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w23-en", passage: "\"Using three reported cases, the NCSC demonstrates how these scams work\"; fake interview login, packing job, LinkedIn recruiter/GitHub infostealer"}
  - {claim_id: 0354749225, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w23-en", passage: "Google Calendar entry, fake Google login sent \"directly to the scammers\"; \"Swiss social welfare\" programme; private GitHub repository; infostealer"}
  - {claim_id: 280b8db577, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w23-en", passage: "\"Using three reported cases, the NCSC demonstrates how these scams work\"; page date 2026-06-09"}
  - {claim_id: bbfbf1e131, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w23-en", passage: "\"offered a time slot for a phone interview, which they were asked to confirm via a Google Calendar entry ... login credentials ... were sent directly to the scammers\""}
  - {claim_id: f468427908, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w23-en", passage: "\"Swiss social welfare\" programme ... work-from-home job; \"further communication shifted to WhatsApp\"; photos of passport, identity card, driving licence and home address"}
  - {claim_id: e0298f1d5c, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w23-en", passage: "\"identity documents ... are used to order high-value goods\"; \"freight forwarder ... a method used to conceal criminal proceeds\""}
  - {claim_id: f18e6cd0f9, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w23-en", passage: "LinkedIn recruiter; \"previously compromised LinkedIn profile\"; \"download a private GitHub repository and complete a small programming task within it\""}
  - {claim_id: 70b5b58184, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w23-en", passage: "\"after the commands were executed, an infostealer installed itself ... read crypto wallets, stored login credentials and browser cookies\""}
  - {claim_id: 924d6b57fa, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w23-en", passage: "\"willingness to react quickly and engage with unfamiliar procedures ... Attackers exploit this systematically\""}
  - {claim_id: a0cfe75445, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w23-en", passage: "analysis; the LinkedIn-to-GitHub chain is the page's third case"}
  - {claim_id: 46f7b8fc78, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w23-en", passage: "hedged \"by inference from the mechanism\"; page gives no telemetry; no factual claim"}
  - {claim_id: 60dffe9b88, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w23-en", passage: "\"Using three reported cases\"; the page neither claims nor denies coordination"}
  - {claim_id: c1fe7a274b, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w23-en", passage: "\"a time slot for a phone interview ... confirm via a Google Calendar entry ... a login window appeared\""}
  - {claim_id: 2250d3f1b2, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w23-en", passage: "\"download a private GitHub repository and complete a small programming task ... after the commands were executed, an infostealer installed itself\""}
  - {claim_id: 6cf0b96653, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w23-en", passage: "page has no \"onboarding\", \"technical assessment\" or interview-confirmation email; describes prior entry text"}
  - {claim_id: 26b085934c, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w23-en", passage: "fields match the diff; T1566.002/.003, T1204.002, T1555, T1539 active in v19.2 and supported"}
  - {claim_id: c34c5b2206, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w25-en", passage: "\"scam involving fake voicemail messages sent via email\"; ZIP \"audio\" file vs 'usually sent as audio files ... rather than as ZIP archives'; chain phishing and BEC on the page"}
  - {claim_id: 6c059e9663, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w25-en", passage: "\"higher than usual number of reports about a scam involving fake voicemail messages\"; \"Microsoft 365 or OneDrive for Business\"; page date 2026-06-23"}
  - {claim_id: 769aca52f6, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w25-en", passage: "\"install malware, such as an infostealer\"; \"any login details, cookies or wallet information harvested by the malware\"; \"Play voicemail as guest\""}
  - {claim_id: d9e973938e, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w25-en", passage: "\"The link contained in the supposed voicemail notification, or the HTML file attached to the email, leads to a professionally forged Microsoft login page\""}
  - {claim_id: abdffd848e, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w25-en", passage: "\"often used to send phishing emails to all of the victim’s contacts\"; CEO fraud/BEC; \"may also be resold on the dark web ... resurfaces weeks or months later\""}
  - {claim_id: 8fd8556f30, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w25-en", passage: "\"Genuine voice messages or voicemails from telephone systems are usually sent as audio files, such as .wav or .mp3, rather than as ZIP archives\""}
  - {claim_id: 46b7a91383, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w25-en", passage: "hedged \"by inference\"; NCSC: \"the attackers monitor business communications\"; MFA advice is analyst opinion"}
  - {claim_id: e50f2c9e6a, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w25-en", passage: "chain phishing to all contacts; \"they can piece together information about ongoing projects, payment arrangements\" for CEO fraud/BEC"}
  - {claim_id: 74bd706ff4, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w25-en", passage: "page has no forwarding rule or account-manipulation text (grep 0 hits)"}
  - {claim_id: 8797c5e86f, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w25-en", passage: "\"usually sent as audio files\" and \"may also be resold\" vs former \"never\" and \"frequently\""}
  - {claim_id: 3e3b8a2904, verdict: ok, source_url: "https://www.bacs.admin.ch/en/26w25-en", passage: "body hunt sentence is labelled \"by inference from the mailbox monitoring NCSC-CH describes\""}
  - {claim_id: 9a7f9a7bf3, verdict: F3, source_url: "https://www.bacs.admin.ch/en/26w25-en", passage: "page: \"any login details, cookies or wallet information harvested by the malware\"; no \"browser\" (low confidence); fields match diff; evidence quotes verbatim"}
