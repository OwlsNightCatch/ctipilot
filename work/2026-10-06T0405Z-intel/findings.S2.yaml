    both news items are secondary readings of it. Not independently replicated.'
  confidence: MEDIUM
  classification:
    reliability: B
    credibility: '2'
  suggested_priority: routine
  novelty: new
  borderline: true
  borderline_reason: A measurement study with no incident or exploitation behind it; value is a communal
    hardening baseline (enforce DMARC) for the constituency's communal layer. Main agent to weigh against
    the PD-11 gate; the news framing ('gut geschützt') understates the DMARC gap.
  evidence:
  - quote: Despite high nominal adoption of SPF, we identify substantial deployment gaps
    original: null
    attribution: Bischof et al. (HSLU / Uni Fribourg), abstract
    source_url: https://papers.mxmap-project.org/secassure2026.pdf
  - quote: Almost all communes (99 percent) have set up SPF, but only 80 percent so strictly that it really
      achieves anything.
    original: Fast alle Gemeinden (99 Prozent) haben SPF eingerichtet, aber nur 80 Prozent so streng,
      dass es wirklich etwas bringt.
    attribution: watson.ch
    source_url: https://www.watson.ch/wissen/schweiz/555771480-so-gut-oder-schlecht-schuetzt-sich-deine-gemeinde-gegen-phishing-mails
  - quote: Only 13 percent have set it so strictly that phishing mails with a forged sender are actually
      sorted out.
    original: Nur 13 Prozent haben es so scharf eingestellt, dass Phishing-Mails mit gefälschtem Absender
      tatsächlich aussortiert werden.
    attribution: watson.ch
    source_url: https://www.watson.ch/wissen/schweiz/555771480-so-gut-oder-schlecht-schuetzt-sich-deine-gemeinde-gegen-phishing-mails
  - quote: DMARC is, according to the analysis, far less widespread. It is present on only 56% of the
      domains.
    original: Das strengere DMARC-Sicherheitsprotokoll (Domain-based Message Authentication, Reporting
      and Conformance) ist gemäss Analyse weit weniger verbreitet. Es sei nur auf 56% der Domains vorhanden.
    attribution: Inside IT
    source_url: https://www.inside-it.ch/schweizer-gemeinden-gut-geschuetzt-vor-e-mail-betrug-20261005
  exposure_hint: 'Who is affected and how to tell: any Swiss commune or cantonal body whose mail domain
    lacks an enforcing DMARC policy (p=quarantine or p=reject) or a strict SPF all-qualifier; check with
    a DNS TXT lookup of _dmarc.<domain> and the SPF record; domains fronted by a security gateway are
    the hard-to-see cases.'
  detection_hint: 'Telemetry class: mail-flow authentication results (SPF/DKIM/DMARC alignment) and DMARC
    aggregate reports for the commune''s own domain, to see who sends in its name; inbound, flag mail
    from commune domains that fails alignment. Hardening lever: move DMARC from monitoring to enforcement
    after reviewing aggregate reports; in Microsoft 365 DMARC enforcement is tenant DNS configuration,
    not a default.'
  takeaway_hint: 'Defender decision that changes: communal IT owners should schedule DMARC enforcement
    (and strict SPF) rather than treat 99 percent SPF coverage as protection.'
  extended_notes: 'Source-conflict note: Inside IT writes that 87% of Microsoft communes have no strict
    DMARC reject policy; the paper''s Table 4 gives 13.4% enforcing for all Swiss communes (so about 87%
    overall lack it) and 17.1% vs 7.9% pooled DACH for domestic vs US-cloud providers. Use the paper''s
    figures. The authors also released interactive maps and code (stated in the paper; not fetched). The
    study frames results around digital sovereignty (privatim''s Nov 2025 position on international clouds
    is cited), not only security.'
- title: 'CSIRT Italia: ransomware, cryptomining, LDAP and credential-hash theft and mailbox lockouts
    on Zimbra servers compromised through CVE-2026-73570 and older flaws, with no intrusion found on regularly
    updated instances'
  sources:
  - url: https://www.acn.gov.it/portale/w/zimbra-zcs-rilevato-sfruttamento-di-vulnerabilita-in-versioni-non-aggiornate
    publisher: ACN / CSIRT Italia (bulletin BL01/261005/CSIRT-ITA)
    date: '2026-10-05'
    role: primary
  discovery_trace: 'first seen at: csirt-acn-it feed, URL https://www.acn.gov.it/portale/feedrss/-/journal/rss/20119/723192
    (item ''Zimbra ZCS: rilevato sfruttamento di vulnerabilità in versioni non aggiornate'', Mon 2026-10-05
    12:21 GMT) → primary (no pivot needed): https://www.acn.gov.it/portale/w/zimbra-zcs-rilevato-sfruttamento-di-vulnerabilita-in-versioni-non-aggiornate
    (bridge url, full body read). Context: NCSC-CH security-hub advisory 13022 (2026-10-01) already in
    the covered entry.'
  summary: 'Italy''s national CSIRT reports, from incidents handled in the national context, multiple
    compromises of internet-exposed Zimbra Collaboration Suite servers, mostly through the SNMP command
    injection CVE-2026-73570 and, to a lesser extent, older flaws (CVE-2024-45519, CVE-2022-41352, CVE-2022-27925,
    CVE-2022-37042, CVE-2023-38750) on unpatched or end-of-life instances; one legacy host''s vector was
    undetermined. Observed outcomes: ransomware of the ELock family in two CVE-2026-73570 cases (a build
    8.7.11 and one with an unstated version; both had the optional zimbra-snmp package) plus a CVE-2024-45519
    ransomware case on 8.8.15; cryptominers in three cases (one on 10.1.19, i.e. before the 10.1.20 fix,
    persisted through a cron entry of the zimbra user); JSP web shells including Behinder v3 on a 10.1.4
    host that led to theft of the LDAP database, the mailbox list and the credential hashes; a second
    web-shell case that took mail down for 48 hours for over 6,000 mailboxes with no data theft documented
    (the two share five C2 addresses and JSP constructs, but ACN cannot attribute them to one actor);
    a fileless Perl payload with an IRC C2 attempt; a server turned into an SSH brute-force source; and
    a legacy host where every mailbox password was reset. ACN says persistence ran in the zimbra application
    user''s context without root, that almost all affected systems lacked applicable patches or were on
    unsupported branches, often with zimbra-snmp installed, and that it found no evidence of successful
    intrusions on regularly updated instances. ACN''s mitigations: update; if that is not immediately
    possible disable or uninstall zimbra-snmp; inspect the zimbra user''s crontab and authorized_keys,
    the Zimbra temp directory for SNMP-exploit script remnants, the Jetty public web directory for JSP
    or stray text files, and /tmp and /var/tmp; rotate all mailbox and admin credentials and session tokens
    where a web shell is found; do not expose admin port 7071 or unneeded SOAP interfaces; filter egress
    (IRC, non-standard ports); least privilege for LDAP service accounts; isolate or retire legacy servers.'
  region_nexus: italy (ACN national context); global product, Zimbra widely deployed in European public
    administration; NCSC-CH published a Zimbra advisory on 2026-10-01
  primary_sector_nexus: 'indirect: ACN does not name victim sectors; affected population is any exposed
    Zimbra mail server'
  sector: public-sector, education, telco
  cves:
  - CVE-2026-73570
  - CVE-2024-45519
  - CVE-2022-41352
  - CVE-2022-27925
  - CVE-2022-37042
  - CVE-2023-38750
  techniques:
  - T1190
  - T1059.004
  - T1505.003
  - T1053.003
  - T1098.004
  - T1496.001
  - T1486
  - T1531
  - T1110
  - T1005
  - T1070.004
  techniques_note: 'existing entry already maps T1190, T1505.003 and others; new here: T1486 (ELock ransomware),
    T1496.001 (cryptomining), T1531 (forced mailbox password resets), T1110 (server used for SSH brute
    forcing), T1098.004 (authorized_keys persistence), T1005 (LDAP database and hash theft), T1070.004
    (self-deleting config-reading scripts).'
  affected_products:
  - Zimbra Collaboration Suite
  entity_keys: []
  new_entities:
  - key: malware:elock
    type: malware
    name: ELock
    aliases:
    - ELock ransomware
    - elockch
    summary: Ransomware family that CSIRT Italia says it found deployed after exploitation of Zimbra Collaboration
      Suite servers (CVE-2026-73570 and older flaws) in two cases (ACN bulletin BL01/261005/CSIRT-ITA,
      2026-10-05); ACN describes it as known for targeting enterprise environments and ZCS installations.
  - key: malware:kinsing
    type: malware
    name: Kinsing
    aliases: []
    summary: Malware dropper family ACN found on a Zimbra relay server compromised through CVE-2022-41352,
      alongside an XMRig miner (ACN bulletin BL01/261005/CSIRT-ITA, 2026-10-05).
  relation_suggestions: []
  verification: SINGLE-SOURCE-NATIONAL-CERT
  sourcing_note: National CSIRT acting as primary disclosing party for incidents it handled; carve-out
    applies. The vendor and Microsoft analysis of the same flaw are already cited by the existing entry.
  confidence: HIGH
  classification:
    reliability: A
    credibility: '2'
  novelty: update-of:2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
  delta_vs_entry: 'The entry (updated 2026-10-02) carries Microsoft''s intrusion analysis and NCSC-CH''s
    advisory. New: a national CSIRT''s observed outcome set (ransomware, cryptomining, LDAP and hash theft,
    mailbox lockouts, mass password reset, abuse as scanning source), the older CVEs hitting unsupported
    Zimbra lines, the statement that regularly updated instances were not breached, and the artefact classes
    to check on the host.'
  evidence:
  - quote: This CSIRT has detected, in the national context, multiple compromises of Zimbra Collaboration
      Suite systems exposed on the public network
    original: Questo CSIRT ha rilevato, nel contesto nazionale, molteplici compromissioni di sistemi Zimbra
      Collaboration Suite esposti su rete pubblica
    attribution: ACN / CSIRT Italia
    source_url: https://www.acn.gov.it/portale/w/zimbra-zcs-rilevato-sfruttamento-di-vulnerabilita-in-versioni-non-aggiornate
  - quote: No evidence has emerged of successful intrusions against regularly updated instances.
    original: Non sono emerse evidenze di intrusioni riuscite a carico di istanze regolarmente aggiornate.
    attribution: ACN / CSIRT Italia
    source_url: https://www.acn.gov.it/portale/w/zimbra-zcs-rilevato-sfruttamento-di-vulnerabilita-in-versioni-non-aggiornate
  - quote: In two separate events, the exploitation of CVE-2026-73570 culminated in the release of ransomware
      against the target servers.
    original: In due distinti eventi, lo sfruttamento della CVE-2026-73570 è culminato nel rilascio di
      ransomware a danno dei server bersaglio.
    attribution: ACN / CSIRT Italia
    source_url: https://www.acn.gov.it/portale/w/zimbra-zcs-rilevato-sfruttamento-di-vulnerabilita-in-versioni-non-aggiornate
  - quote: the complete interruption of the e-mail services for a period of 48 hours to the detriment
      of over 6000 user mailboxes
    original: l'interruzione completa dei servizi di posta elettronica per un arco temporale di 48 ore
      a danno di oltre 6000 caselle utente
    attribution: ACN / CSIRT Italia
    source_url: https://www.acn.gov.it/portale/w/zimbra-zcs-rilevato-sfruttamento-di-vulnerabilita-in-versioni-non-aggiornate
  exposure_hint: 'Per ACN, affected: Zimbra before 10.1.20 with the optional zimbra-snmp package installed
    and SNMP notifications enabled (CVE-2026-73570), plus unsupported or unpatched older lines (ACN lists
    10.1.x before 10.1.1, 10.x before 10.0.9, 9.x before Patch 41 and 8.8.15 before Patch 41). The check
    is a package check first, a version check second.'
  detection_hint: 'Telemetry classes: host process-creation and cron records for the zimbra service account
    (new crontab entries, shells or interpreters spawned from the mail or SNMP notification path), file-integrity
    on the Jetty public web directory (JSP or stray text files), changes to the zimbra user''s authorized_keys,
    outbound egress from the mail server (IRC, odd high ports, SSH scanning), mass mailbox password changes
    in the directory. Post-patch: patching does not remove web shells, cron entries or stolen LDAP data,
    so rotate credentials where any of these is found.'
  takeaway_hint: 'Defender decision that changes: patching is necessary but ACN''s cases show the compromise-assessment
    step (cron, authorized_keys, JSP, egress) on any exposed Zimbra host, and retiring unsupported Zimbra
    lines rather than leaving them reachable.'
