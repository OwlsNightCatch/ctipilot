  summary: On Friday 2026-10-02 Beyond Gravity, a space-technology supplier owned by the Swiss Confederation
    that emerged from the RUAG defence group in 2022, announced that it is the victim of a targeted cyberattack.
    The company says it received the first indications of malicious activity in its IT environment on
    2026-08-12 and presumes a 'highly professional actor' behind it; who that actor is was unknown at
    the time of the announcement. The investigation runs jointly with the Federal Office for Cybersecurity
    (BACS) and Mandiant; the company has filed a criminal complaint and expanded its security measures,
    and a spokesperson told the AWP agency that specialists are hunting for attacker activity and forensically
    analysing affected devices. The spokesperson explained the near two-month gap between first indications
    and disclosure with the ongoing investigation ('thoroughness before speed'; early disclosure would
    have endangered the forensic work). The statement as relayed names no attack vector, no affected systems
    or data categories, no malware and no vulnerability, so nothing in the public record supports an ATT&CK
    mapping or a hunt. The FDP party publicly suspects a state actor because of the 'enormous professionalism'
    of the attack; that is a political assessment by a party which, according to 20 Minuten, used the
    incident to rally support for the new armaments fund, not an investigative finding.
