    (also https://www.cpr.dk/cpr-nyt/nyhedsarkiv/2026/okt/omfattende-uautoriseret-adgang-til-borgeres-cpr-oplysninger)'
  summary: 'Denmark''s CPR administration noticed ''irregular behaviour'' in the register on the evening
    of Friday 2026-10-02 and established over the weekend that unauthorised parties had obtained names,
    addresses and CPR numbers of about 8.8 million registered persons (living, emigrated, deceased; the
    register holds about 11 million). The ministry says the access worked by misusing a Danish private
    company''s lawful right to look up information in CPR, within the data scope private companies may
    access; the minister told Ritzau it was a smaller company, that the access lasted about ten days in
    September, and that the security measures around that company''s access ''have not been good enough''.
    Persons with name-and-address protection are not in the affected set. CPR has cut off the company''s
    access, notified the Danish Data Protection Authority, and the police (NSK) are investigating; the
    ministry says it cannot yet say who is behind it. Not yet public: which company, whether its credentials
    or interface were taken over or the company itself is implicated (the minister declined to comment
    on possible criminal intent), how many queries ran and how much was actually extracted. Aarhus University''s
    Jens Myrup Pedersen (DR) calls it the largest breach ever of the register and notes the absence of
    alarms or blocks on unusually many lookups; that is his assessment, not an official finding. The ministry
    warns that the data enables convincing phishing and impersonation.'
  region_nexus: denmark / europe; transferable to Swiss public registers that expose lookup access to
    authorised third parties (no Swiss exposure is stated by any source)
  primary_sector_nexus: 'direct for public-sector registry operators: a national population register breached
