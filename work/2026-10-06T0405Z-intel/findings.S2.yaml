    attribution: Danish Ministry of Research, Education and Digitalisation
    source_url: https://ufm.dk/aktuelt/pressemeddelelser/2026/oktober/omfattende-uautoriseret-adgang-til-borgeres-cpr-oplysninger/
  - quote: At present it is not possible to say anything about who is behind it.
    original: Det er på nuværende tidspunkt ikke muligt at sige noget om, hvem der står bag.
    attribution: Danish Ministry of Research, Education and Digitalisation
    source_url: https://ufm.dk/aktuelt/pressemeddelelser/2026/oktober/omfattende-uautoriseret-adgang-til-borgeres-cpr-oplysninger/
  - quote: Unauthorised parties gained, over about ten days in September, access to CPR information on
      8.8 million people by misusing a smaller Danish company's access to the Central Personal Register
      (CPR).
    original: Uvedkommende fik gennem omkring ti dage i september adgang til CPR-oplysninger om 8,8 millioner
      personer ved at misbruge en mindre dansk virksomheds adgang til Det Centrale Personregister (CPR).
    attribution: Faglig Senior, reporting the minister's account to Ritzau
    source_url: https://fagligsenior.dk/2026/10/05/cpr-laek-i-ti-dage-minister-erkender-svigt-i-sikkerheden/
  - quote: It is clear to me that the security measures around this company's access to CPR have not been
      good enough
    original: Det er tydeligt for mig, at sikkerhedsforanstaltningerne omkring denne virksomheds adgang
      til CPR ikke har været gode nok
    attribution: Christina Egelund (Danish digitalisation minister), quoted by Faglig Senior/Ritzau
    source_url: https://fagligsenior.dk/2026/10/05/cpr-laek-i-ti-dage-minister-erkender-svigt-i-sikkerheden/
  exposure_hint: 'Exposure pattern, not a Swiss finding: any public register or portal that grants lookup
    interfaces to authorised private parties (resolution of names, addresses, ID numbers). The pattern''s
    weak point is the third party''s access path and the absence of per-party volume ceilings and alarms;
    the public record states neither how the access was taken over nor whether alarms existed beyond a
    CPR employee noticing irregular behaviour.'
  detection_hint: 'Telemetry class: access/audit logs of the register''s lookup interface, aggregated
    per authorised party (queries per day, distinct subjects, breadth of the personal-data scope returned)
    against that party''s declared purpose; alert or block on departure from baseline. Here the irregularity
    ran for most of September before a CPR employee noticed on 2 October, per the ministry and minister.'
  takeaway_hint: 'Defender decision that changes: for registry operators and those who feed them, per-party
    volume caps and anomaly alerting on delegated lookup access, and treating each authorised third party
    as an attack path. For recipients of the data: assume leaked identifiers feed convincing phishing
    (the ministry''s own warning).'
  extended_notes: 'Danish law context stated by the ministry: CPR Act s.38 lets companies with a legitimate
    interest obtain data about a larger delimited group they have individually identified in advance (by
    ID number, birth date and name, or name and address); a bulk pull of 8.8 million records through that
    channel is therefore anomalous by design. Check for updates: company identity and method are the open
    questions (TV2 lists them).'
- title: 'Swiss municipal mail domains: SPF is near-universal but only 13 percent enforce DMARC, and 53
    percent of municipalities run mail on US clouds (HSLU / Uni Fribourg measurement of 2,109 communes)'
  sources:
  - url: https://papers.mxmap-project.org/secassure2026.pdf
    publisher: Bischof, Huser, Ochsner, Petrlic, Portmann (HSLU, Uni Fribourg, THI, TH Nürnberg); accepted
      manuscript, ESORICS 2026 workshops (Springer)
    date: '2026-10-05'
    role: primary
    note: paper date not stated in the text; Swiss municipality dataset as of April 2026; press coverage
      dated 2026-10-05
  - url: https://www.watson.ch/wissen/schweiz/555771480-so-gut-oder-schlecht-schuetzt-sich-deine-gemeinde-gegen-phishing-mails
    publisher: watson.ch
    date: '2026-10-05'
    role: corroborating
    note: links the paper; correct reading of the DMARC figure
  - url: https://www.inside-it.ch/schweizer-gemeinden-gut-geschuetzt-vor-e-mail-betrug-20261005
    publisher: Inside IT
    date: '2026-10-05'
    role: corroborating
    note: 'headline says ''well protected''; its ''87 percent of Microsoft municipalities'' attribution
      does not match the paper (assessment: garbled)'
  discovery_trace: 'first seen at: inside-it-ch, URL https://www.inside-it.ch/rss.xml (item ''Schweizer
    Gemeinden gut geschützt vor E-Mail-Betrug'', 2026-10-05) → drill: https://www.inside-it.ch/schweizer-gemeinden-gut-geschuetzt-vor-e-mail-betrug-20261005
    (bridge url) → pivot: WebSearch ("HSLU Gemeinden Mailserver SPF DMARC Studie Technische Hochschule
    Nürnberg Universität Freiburg Gemeindeverwaltungen") → watson https://www.watson.ch/wissen/schweiz/555771480-so-gut-oder-schlecht-schuetzt-sich-deine-gemeinde-gegen-phishing-mails
    (links the paper) → primary: https://papers.mxmap-project.org/secassure2026.pdf (tools/fetch_source.py
    pdf, 21 pages decoded)'
  summary: 'A peer-reviewed measurement study (accepted manuscript for the ESORICS 2026 workshops) scanned
    the mail domains of 2,109 Swiss municipalities as of April 2026, part of 15,306 DACH municipalities,
    using passive DNS provider fingerprinting plus active scans of SPF, DMARC and DANE (DKIM excluded).
    For Switzerland, SPF is present on 99.2 percent of domains and well configured (strict -all, nothing
    overly permissive) on 79.9 percent, but a DMARC record exists on only 55.5 percent and an enforcing
    DMARC policy (the paper says reject) on only 13.4 percent; DANE is on 7.3 percent. Nine cantons have
    no enforcing DMARC at all; Zug is highest at 55 percent; in Geneva 44 of 45 communes share the ACG
    Genève platform, which has deployed well-configured DMARC for none of its members. Microsoft 365 hosts
    52 percent of the 2,110 communes, domestic providers 42 percent, and US clouds (Microsoft, AWS 22,
    Google 4) 53 percent; seven cantons (AI, AR, BS, GL, NE, NW, ZG) are entirely domestic, ten of 26
    exceed 50 percent US cloud, and 93 communes (4.4 percent) could not be attributed, 89 of them because
    a security gateway hides the backend. Across DACH, US-cloud tenants lead on strict SPF (set at onboarding)
    while domestic providers reach about twice the enforcing-DMARC rate (17.1 vs 7.9 percent pooled) and
    almost all DANE. Practical reading: a spoofed municipal sender (fines, tax or invoice lures) is trivially
    possible for most Swiss communes because DMARC is not enforced, and the authors'' own caveats are
    that this is a point-in-time snapshot that sees only public DNS signals.'
  region_nexus: 'switzerland: all cantons and communes; communal level'
  primary_sector_nexus: 'direct: communal administrations are the sector layer measured'
  sector: public-sector
  cves: []
  techniques:
  - T1566
  techniques_note: the finding is the missing control against sender-domain spoofing in phishing that
    impersonates a commune; no attack is observed in the study.
  affected_products:
  - Microsoft 365 (Exchange Online)
  - SPF
  - DMARC
  - DANE
  entity_keys: []
  new_entities: []
  relation_suggestions: []
  verification: SINGLE-SOURCE-OTHER
