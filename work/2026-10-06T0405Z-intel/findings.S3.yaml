- title: 'Cling / ClingSTUN IoT botnet: C2 commands hidden in the STUN transaction ID, spoofed to look like replies from Google''s STUN server'
  kind_hint: threat
  event_date: '2026-10-05'
  sources:
  - url: https://www.fortinet.com/blog/threat-research/clingstun-linux-backdoor-abuses-public-stun-infrastructure
    publisher: FortiGuard Labs
    date: '2026-10-05'
    role: primary
  - url: https://www.nozominetworks.com/blog/a-stunning-disguise-cling-malware-masquerades-as-google-
    publisher: Nozomi Networks Labs
    date: '2026-10-01'
    role: primary
  - url: https://thehackernews.com/2026/10/realtek-jungle-sdk-exploit-attempts.html
    publisher: The Hacker News
    date: '2026-10-05'
    role: corroborating
  discovery_trace: 'first seen at: fortinet-fortiguard-blog, URL https://www.fortinet.com/blog/threat-research (python3 tools/fetch_source.py url; card list shows ''Vincent Li | October 05, 2026'' as the
    metadata line that FOLLOWS the ClingSTUN card) -> primary: https://www.fortinet.com/blog/threat-research/clingstun-linux-backdoor-abuses-public-stun-infrastructure -> hackernews feed item https://thehackernews.com/2026/10/realtek-jungle-sdk-exploit-attempts.html
    (2026-10-05) naming Nozomi -> pivot: nozominetworks.com/blog listing -> primary: https://www.nozominetworks.com/blog/a-stunning-disguise-cling-malware-masquerades-as-google- (2026-10-01).'
  summary: 'Two labs independently describe the same Linux IoT botnet (Nozomi calls it Cling, FortiGuard ClingSTUN). Initial access is opportunistic exploitation of old command-injection and RCE flaws in
    routers, DVRs and IoT devices: Nozomi saw a spike in attempts against CVE-2021-35394 (Realtek Jungle SDK UDPServer; The Hacker News dates the spike from about 2026-09-05), and FortiGuard lists some
    thirty CVEs across D-Link, TP-Link, Tenda, EnGenius, Linksys, AVTECH, Lantronix and, notably, Ivanti Connect Secure/Policy Secure (CVE-2024-21887 with CVE-2023-46805) as entry points across three download-source
    periods. On the host it persists by appending itself (copied to /root/.cling and /usr/local/bin/.cling) to /etc/inittab, /etc/init.d/rcS and /etc/rc.d/rc.boot, and per Nozomi can also replace the wget
    binary so the bot re-runs whenever wget is called; FortiGuard adds killing the hardware watchdog via ioctl, killing competing processes executing from /tmp or /var/tmp, clearing its command line, and
    bind-mounting a /tmp directory over its /proc/<pid> populated with metadata copied from PID 1 when running as root. C2 is the notable part: the bot sends STUN Binding Requests with an all-zero transaction
    ID roughly every 5 seconds to a hard-coded list of 13 public STUN endpoints (FortiGuard saw 24 in an earlier build), then sends a non-STUN registration datagram carrying its mapped ports and an infection-method
    tag to the same endpoints, then listens on the mapped ports for UDP packets whose 12-byte STUN transaction ID encodes the operator command (scan/spread, TCP tunnel, proxy, UDP flood). Nozomi reports
    the command packets appear to originate from an address that stun.l.google.com resolves to and assesses, from a consistent IP TTL difference against genuine replies, that the operator spoofs the source
    from a network lacking source-address validation; Nozomi also identified one listed STUN server that returned an all-zero transaction ID instead of echoing the request and showed it relayed commands
    to ports advertised only to it. FortiGuard stresses that the public STUN servers contacted are legitimate and should not be classed as attacker infrastructure, and says how the operator obtains the
    mapping and delivers control traffic through NAT remains unverified in its analysis. Impact is conscription of unmanaged edge and IoT devices as proxy and DoS nodes, not a targeted public-sector campaign.'
  region_nexus: global opportunistic IoT botnet; no Swiss or European-government targeting stated by either source
  primary_sector_nexus: indirect (unmanaged routers, DVRs/CCTV, building and branch-office devices at communal and cantonal sites; Ivanti Connect Secure listed among entry points)
