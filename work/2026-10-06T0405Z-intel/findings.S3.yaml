  summary: Zscaler ThreatLabz released its annual ransomware report on 2026-09-30, covering April 2025 to March 2026 from Zscaler telemetry plus ThreatLabz analysis. Zscaler says combined exfiltration by
    the top 10 groups by leak volume rose 275.8% year over year to 896.2 TB, so containment and egress control now matter as much as encryption prevention. ThreatLabz counted 7,366 leak-site victims (down
    3%), with Qilin, Akira and INC Ransom accounting for 34% of disclosed victims; 9 of the top 15 groups were new to the rankings and 52 groups were newly active. On access, Zscaler says intrusions increasingly
