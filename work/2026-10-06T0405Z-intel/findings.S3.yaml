    attribution: LevelBlue SpiderLabs
    source_url: https://www.levelblue.com/blogs/spiderlabs-blog/citrix-netscaler-cve-2026-88771-observed-exploitation-artifacts-and-hunt-indicators
  - quote: Because the payload deletes both the configuration archive and itself during execution, the absence of those files does not necessarily indicate that execution was unsuccessful.
    attribution: LevelBlue SpiderLabs
    source_url: https://www.levelblue.com/blogs/spiderlabs-blog/citrix-netscaler-cve-2026-88771-observed-exploitation-artifacts-and-hunt-indicators
  - quote: The activity observed during this hunt shows that CVE-2026-88771 exploitation was not limited to basic vulnerability testing.
    attribution: LevelBlue SpiderLabs
    source_url: https://www.levelblue.com/blogs/spiderlabs-blog/citrix-netscaler-cve-2026-88771-observed-exploitation-artifacts-and-hunt-indicators
  borderline: true
  borderline_reason: Source published 2026-09-30, outside the 72 h developing window (cut 2026-10-03T04:05Z) and outside every slice lookback; the S3 domain does not own NetScaler. Returned because the
    existing critical NetScaler entry lacks the post-patch compromise check these artefacts supply (local superuser, config theft, customsnmpd tampering) and nothing in the store cites LevelBlue. Main agent
    may append as an update to the existing entry or drop.
  extended_notes: 'Post-patch compromise check for NetScaler admins (behavioural, no IOCs): list local users and roles for accounts you did not create, diff ns.conf against the last known-good, look for
    new or hidden files in /var/netscaler/logon/ and /var/netscaler/logon/LogonPoint/, compare /bin/sh permissions (setuid/setgid bits should not be set), review /etc/httpd.conf for PHP enablement or Alias/SetHandler
    lines, and check customsnmpd integrity. Because /flash/nsconfig may have been read, plan rotation of credentials and secrets stored in the configuration (LDAP bind accounts, SAML/IdP keys, certificates)
    on any appliance that was exposed and unpatched during the exploitation window. Authentication-log hunt: shell metacharacters or ${IFS} in username fields alongside pitboss/NSPPE strings (already in
    the store entry from watchTowr/Unit 42).'
