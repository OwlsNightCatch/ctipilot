    (URL taken from the search result pattern, resolved and content-matched; it names the PDF) -> primary: PDF read with python3 tools/fetch_source.py pdf https://www.enisa.europa.eu/sites/default/files/2026-09/ENISA%20Threat%20Landscape%202026_Final.pdf
    (chapter 2.1 Public administration, executive summary, hacktivist and cybercrime chapters sampled). Prompted by checking whether other annual reports were missing from the store; a grep of entries/
    for ''ENISA Threat Landscape'' returned nothing (only report:enisa-nis360-2026 exists in the registry).'
  summary: 'ENISA published its annual Threat Landscape on 2026-09-22 (incident data for calendar 2025). ENISA states public administration remained the most targeted EU sector at 31.8% of recorded events
    (business services 8.5%, transport 8%, manufacturing 6.9%, finance/banking 5.6%), with events primarily hitting central (35.1%) and local (33.8%) entities and regional entities at 10.1%; ENISA''s NIS360
    places EU public administration in the cyber risk zone where criticality exceeds observed cybersecurity maturity. ENISA says ideology-driven DDoS accounts for 81.8% of the recorded incidents against
    the sector, with NoName057(16), Dark Storm Team and Mr. Hamza the most active hacktivist groups against EU public administration and Keymous+ and Server Killers adding to the tempo; portals were hit
    around law-enforcement takedowns and arrests, elections, high-visibility events and geopolitical flashpoints, and ENISA describes the reported impact as largely limited to claimed or temporary disruption
    of public-facing websites. Financially motivated incidents are 8% of the sector''s total; ransomware claims are 36% of those, primarily affecting municipalities, and the most deployed strains were Qilin,
    then SafePay and Stormous; ENISA cites a ransomware attack on a Swedish IT supplier that disrupted HR-reporting systems at roughly 200 municipalities and regional authorities. Data breaches make up
    38.4% of the sector''s incidents (examples cited: a French Pajemploi/URSSAF data theft, unauthorised access to a Slovenian public-administration system, and a breach through an external appointment-service
    provider affecting several municipalities). State-nexus intrusion sets keep a sustained focus on diplomatic and governmental entities; ENISA names APT29, APT28, Turla and GoldenJackal against EU public
    administration. Across sectors ENISA also notes increased use of ClickFix and SMS phishing in fraud and credential compromise. Scope caveat: ENISA analysed 8,257 incidents for 1 January to 31 December
    2025, mainly from open sources plus anonymised information from EU Member States and Cyber Partnership Programme members, and says open-source reporting does not give a complete picture; Switzerland
    is not a Member State, so the percentages are an EU benchmark rather than a Swiss measurement.'
  region_nexus: EU-wide benchmark; Switzerland not in scope but the named actors (NoName057(16), Qilin, SafePay) are the same families already tracked against Swiss public bodies in the store (e.g. SafePay
    and the Manno commune entry)
  primary_sector_nexus: 'direct (public administration: central, regional and local entities are the report''s top-ranked target)'
