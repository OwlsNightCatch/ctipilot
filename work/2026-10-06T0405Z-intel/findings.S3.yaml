  summary: 'Microsoft released its 2026 Digital Defense Report on 2026-10-01 (telemetry window July 2025 to June 2026). Microsoft says government agencies and services were the sector most impacted by cyber
    threats, 27% of observed activity versus 17% in 2025, and the most frequently targeted sector for nation-state activity. Entry vectors: Microsoft says user execution, valid accounts, social engineering
    and phishing make up the majority of initial-access attempts, with AiTM phishing kits, OAuth application abuse, API exploitation and password spray now standard in both criminal and nation-state playbooks;
    Microsoft''s On the Issues post states phishing accounted for 23% of observed intrusions in 2026, up from 7% in 2025, and Help Net Security''s reading of the report adds that exploitation of public-facing
    applications rose from 15% to 24% of the intrusions Microsoft''s incident responders investigated. After a valid-account intrusion, Microsoft reports follow-on credential theft in 52.2% of cases and
    describes a recurring Incident Response chain: compromise of a human identity, discovery of non-human credentials (service principals, API keys), privilege escalation with existing access, then exfiltration
    or C2 deployment; 63% of intrusions involved data theft. Exposed cloud workloads were attacked on average 5.3 hours after exposure, and Microsoft (per Help Net Security) puts median discovery-to-weaponization
    of vulnerabilities well below 24 hours. Microsoft names open-source supply-chain compromise, attacks against edge devices and AI as a force multiplier as the three most significant emerging threats,
    and prioritises phishing-resistant MFA/passkeys, rapid invalidation or rotation of tokens and session credentials, centralised high-fidelity logging on edge devices, and continuous exposure management
    over periodic patching. For governments the report cites Microsoft''s Advancing Regional Cybersecurity engagements, which found three recurring structural gaps (unclear agency roles, fragmented escalation
    pathways, no whole-of-government crisis mechanism) and recommends a ''report once'' incident-reporting mechanism, links between organisational SOCs and sector-level coordination, and cross-sector tabletop
    exercises. These are Microsoft-telemetry statistics, not independently verified; the full report body was not read, only the executive summary, the landing page and two companion posts.'
  region_nexus: global Microsoft telemetry; government is the top-impacted sector, so directly on the Swiss federal/cantonal/communal constituency; no Switzerland-specific figure read
