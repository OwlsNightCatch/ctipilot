    reads this as targeting of staff with workflow and data proximity rather than IT privilege. Known payments fell 15.8% to $327.8M while the average payment rose 5.3% to $431,995. Country shares named
    in the press release are US 50.7%, Canada 4.8%, Germany 4.3%, UK 4.1%; Switzerland and the government sector are not named in the public materials read, and the full report is gated, so no public-sector
    figure is available here.
