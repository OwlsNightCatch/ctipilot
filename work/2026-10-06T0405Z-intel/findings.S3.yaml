    source_url: https://www.fortinet.com/blog/threat-research/clingstun-linux-backdoor-abuses-public-stun-infrastructure
  - quote: 'CVE-2024-21887: (54588) Ivanti.Connect.Secure.Policy.Secure.Authentication.Bypass'
    attribution: FortiGuard Labs
    source_url: https://www.fortinet.com/blog/threat-research/clingstun-linux-backdoor-abuses-public-stun-infrastructure
  - quote: The C2 commands for Cling are hidden in the STUN transaction ID field, which is normally meant to be a random value.
    attribution: Nozomi Networks Labs
    source_url: https://www.nozominetworks.com/blog/a-stunning-disguise-cling-malware-masquerades-as-google-
  - quote: the most likely explanation is that the botnet’s operator is using an ASN, which does not perform Source Address Validation
    attribution: Nozomi Networks Labs
    source_url: https://www.nozominetworks.com/blog/a-stunning-disguise-cling-malware-masquerades-as-google-
  borderline: true
  borderline_reason: Opportunistic IoT botnet with no stated public-sector targeting; kept for the transferable network-detection concept (outbound STUN from non-VoIP embedded devices, all-zero transaction
    IDs, non-STUN registration datagrams to STUN ports, inbound UDP 'from' a public STUN address outside a request/response pair with off-baseline TTL) and for the Ivanti Connect Secure entry-point mention.
    Main agent to weigh against the strict relevance gate (PD-11).
  extended_notes: 'Detection concept (telemetry class first): network flow/NDR and firewall logs for UDP to ports 3478 and 19302 from devices that have no VoIP/WebRTC role, repeated every few seconds across
    many public STUN hosts; STUN binding requests whose transaction ID is all zeros (RFC 8489 requires randomness); datagrams to STUN ports that do not parse as STUN; inbound UDP from a STUN server''s address
    to a mapped port without a matching outbound request, with an IP TTL that differs from the genuine server''s replies. Host-side (where a device exposes a shell or firmware diff): additions to /etc/inittab,
    /etc/init.d/rcS, /etc/rc.d/rc.boot, hidden .cling binaries, wget replaced by a wrapper with sibling files wget.r/wget.p, empty command lines for running processes. Benign lookalike: Teams, Zoom, Webex,
    WebRTC and SIP clients legitimately send STUN binding requests to public STUN servers; the discriminator is device class (embedded router/DVR rather than a workstation), cadence (about 5 s) and the
    zero transaction ID. Hardening: inventory and replace unsupported routers/DVRs, remove management exposure, and apply BCP38/URPF-style source validation upstream where you operate the network. Fortinet''s
    CVE list includes the Ivanti Connect Secure pair CVE-2024-21887 and CVE-2023-46805, so an unpatched Ivanti appliance is a potential botnet recruit as well as an intrusion path.'
- title: 'NetScaler CVE-2026-88771 hunt artefacts from LevelBlue THOR: sec_monitor superuser, ns.conf and /flash/nsconfig staging, customsnmpd reverse shell'
  kind_hint: update
  event_date: '2026-09-30'
  sources:
  - url: https://www.levelblue.com/blogs/spiderlabs-blog/citrix-netscaler-cve-2026-88771-observed-exploitation-artifacts-and-hunt-indicators
    publisher: LevelBlue SpiderLabs (THOR)
    date: '2026-09-30'
    role: primary
  - url: https://thehackernews.com/2026/10/citrix-netscaler-post-exploitation.html
    publisher: The Hacker News
    date: '2026-10-01'
    role: corroborating
  discovery_trace: 'first seen at: hackernews (WebSearch ("NetScaler post-exploitation payload creates superuser web shell mapped CSS-like URLs CVE-2026-88771") after the THN ''Top Stories'' block listed
    it) -> https://thehackernews.com/2026/10/citrix-netscaler-post-exploitation.html -> primary: https://www.levelblue.com/blogs/spiderlabs-blog/citrix-netscaler-cve-2026-88771-observed-exploitation-artifacts-and-hunt-indicators.
    Existing entry compared: entries/2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev.md (covers Unit 42 chain, watchTowr trigger, GTIG; no match for sec_monitor, nsconfig, local_journal,
    customsnmpd or LevelBlue).'
  summary: 'LevelBlue''s Threat Hunt Operations and Research team reports exploitation of CVE-2026-88771 seen across customer environments, with attacker-controlled authentication data carrying the pitboss/NSPPE
    crash-message strings plus shell commands (sometimes ${IFS} instead of spaces, or command substitution). Beyond whoami testing, observed commands fetched second-stage payloads with curl or wget, copied
    /flash/nsconfig/ns.conf into a file under /var/netscaler/logon/, or archived /flash/nsconfig into a file under /var/netscaler/logon/LogonPoint/. A Perl second stage run via curl-into-perl creates a
    local account named sec_monitor with the superuser role by editing ns.conf, archives /flash/nsconfig to a temporary tgz and attempts to upload it, deletes the archive and itself, sets /bin/sh to mode
    6555, drops a PHP web shell as a hidden file in /var/netscaler/logon/LogonPoint/ and edits /etc/httpd.conf to enable PHP and map it to URLs resembling NetScaler CSS resources. A Python second stage
    overwrites /var/python/bin/customsnmpd with a reverse shell and kills the running process, so a modified customsnmpd is a persistence indicator. LevelBlue stresses that because the payload removes its
    archive and itself, the absence of those files does not show the payload failed. The delta against the existing entry is the configuration-theft and local-account behaviour: a NetScaler that was exploited
    may have had its ns.conf (with stored secrets) read and a persistent local superuser added, which a patch does not undo.'
  region_nexus: global; NetScaler is widely deployed in Swiss public administration (see existing entry)
  primary_sector_nexus: direct (internet-facing remote-access/ADC appliances at public bodies)
  sector: cross-sector
  cves:
