  extended_notes: 'Why it matters for the constituency: Microsoft ranks government first among sectors by observed threat activity from a very large identity, endpoint and email telemetry base, which supports
    prioritising identity controls (phishing-resistant MFA, token and session invalidation, non-human identity inventory), edge-device exposure and logging, and continuous exposure management. It lines
    up with in-store entries on edge zero-days (NetScaler, FortiMail, Cisco SD-WAN, Check Point management) and on service-principal abuse (Storm-3168/JADEPUFFER, Storm-3068). The ''report once'' recommendation
    parallels the Swiss Cybersecurity Act reporting-duty design already in the store (policy:switzerland-cybersecurity-act-csg-2026). Caveat: the public-facing-application exploitation share (15% to 24%)
    and the ''weaponization well below 24 hours'' median were read through Help Net Security only; Microsoft''s own pages read here state the phishing 7% to 23% shift, the 27% government share and the 52.2%
    credential-theft figure. The full report PDF should be checked before the composer cites the Help Net-only figures as Microsoft numbers.'
