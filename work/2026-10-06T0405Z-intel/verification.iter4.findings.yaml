- code: F4
  category: hallucinated-fact
  section: entries/2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited (claim fc6b5f2912)
  item: "CVE-2026-73570 Zimbra SNMP command injection: Detection line, network-side sentence"
  url_or_quote: "\"On the network side, an outbound connection initiated by the zimbra account immediately after inbound SMTP is the same event viewed from the other end.\" | https://www.microsoft.com/en-us/security/blog/2026/09/30/unauthenticated-command-injection-on-internet-facing-mail-servers-tracking-cve-2026-73570/"
  summary: "(low confidence) No cited source ties execution or an outbound connection to a moment 'immediately after inbound SMTP'. Microsoft describes the mechanism as \"When a service-state change triggers health monitoring, swatchdog incorporates the attacker-controlled value into a snmptrap shell invocation\", so the command runs when swatchdog's monitoring path fires, not at SMTP receipt. A correlation rule built on SMTP-then-outbound adjacency could miss it. Drop 'immediately after inbound SMTP' (for example: an outbound connection initiated by the zimbra account from the notification-path shell lineage)."
