  item: "2026-10-06 update section, ACN case list"
  url_or_quote: "ACN: \"In un singolo evento, lo sfruttamento della vulnerabilità è stato utilizzato per ottenere l'esecuzione arbitraria di comandi non autenticati e recuperare un payload da un'infrastruttura di staging esterna ... esecuzione direttamente in memoria di uno script Perl ... interazione con un presunto server di comando e controllo operante su protocollo IRC\" | https://www.acn.gov.it/portale/w/zimbra-zcs-rilevato-sfruttamento-di-vulnerabilita-in-versioni-non-aggiornate"
  summary: "(low confidence) The section lists the ransomware, cryptominer, web-shell and SSH brute-force cases but omits ACN's CVE-2026-73570 case of fileless in-memory Perl execution with an attempted IRC command-and-control channel, so the 'IRC' egress item in the mitigation and Detection text has no stated basis. One clause would make the case list complete and give the egress control its reason."
