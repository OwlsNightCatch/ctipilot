- code: F11
  category: editorial-advisory
  section: "2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited (Detection)"
  item: "CVE-2026-73570 Zimbra: Detection paragraph, ACN host-check clause"
  url_or_quote: "CSIRT Italia adds host checks for a server already compromised: ... droppers, miners and ransomware payloads in /tmp and /var/tmp, and outbound connections including IRC and TCP 8801"
  summary: "(low confidence, advisory) ACN's mitigation list (https://www.acn.gov.it/portale/w/zimbra-zcs-rilevato-sfruttamento-di-vulnerabilita-in-versioni-non-aggiornate) has no outbound-connection check; IRC and TCP 8801 appear only as egress-filtering hardening ('bloccando le connessioni dirette verso porte tipicamente usate da botnet o C2 (inclusi i canali IRC e porte non standard come la TCP 8801)') and as C2 channels in its incident narratives. The entry's own 2026-10-06 section states it correctly ('to filter egress from the Zimbra servers, including IRC and TCP 8801'). Optional: word the Detection clause as ACN's egress filtering or as a hunt derived from its incident cases. May be left."
