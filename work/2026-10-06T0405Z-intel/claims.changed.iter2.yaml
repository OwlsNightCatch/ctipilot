claims:
  - claim_id: b93a217d07
    entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
    surface: "headline"
    kind: frontmatter
    text: "CISA marks the exploited GlobalProtect VPN bypass as used in ransomware; Arctic Wolf traced Qilin intrusions to it"
  - claim_id: 308c6a0d80
    entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
    surface: "summary"
    kind: frontmatter
    text: "CVE-2026-0257 is a pre-auth VPN authentication bypass in PAN-OS GlobalProtect (CISA KEV, confirmed in-the-wild exploitation per Palo Alto PSIRT): an attacker forges valid auth-override cookies by re-using the GlobalProtect certificate shared with the HTTPS service, with no credentials. CISA's KEV catalog (version 2026.10.04) marks it as used in known ransomware campaigns, and Arctic Wolf's report of 2026-07-20 describes June 2026 intrusions in which Qilin ransomware deployment began with this bypass. Patch or disable auth-override cookies, and treat a gateway that was exposed and unpatched as a compromise-assessment target."
  - claim_id: 4f8f34e447
    entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
    surface: "body"
    kind: cited
    text: "Authentication override cookies in PAN-OS GlobalProtect let a portal or gateway issue a cookie that a user presents in place of re-authenticating, and the feature is not enabled by default ("
    urls: ["https://www.rapid7.com/blog/post/etr-rapid7-observed-exploitation-of-pan-os-globalprotect-authentication-bypass-vulnerability-cve-2026-0257/"]
  - claim_id: fed74faf9f
    entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
    surface: "body"
    kind: cited
    text: "Palo Alto Networks says the flaw affects firewalls with a GlobalProtect portal or gateway where authentication override cookies are enabled and a specific certificate configuration exists, classes it as CWE-565 (reliance on cookies without validation and integrity checking), and scores it CVSS 4.0 7.8 with exploit maturity Attacked ("
    urls: ["https://security.paloaltonetworks.com/CVE-2026-0257"]
  - claim_id: 5b54bdc1c7
    entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
    surface: "body"
    kind: cited
    text: "Rapid7's analysis is that when the certificate used for the cookies is reused for another feature such as the HTTPS service of the portal or gateway, a remote unauthenticated attacker can discover that certificate's public key, forge an arbitrary cookie that the server decrypts and trusts, and bypass authentication; Rapid7 Labs published a proof-of-concept script that tests for it ("
    urls: ["https://www.rapid7.com/blog/post/etr-rapid7-observed-exploitation-of-pan-os-globalprotect-authentication-bypass-vulnerability-cve-2026-0257/"]
  - claim_id: 6a1582636a
    entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
    surface: "body"
    kind: cited
    text: "Palo Alto Networks says it is aware of limited exploit attempts on unpatched devices without mitigations applied ("
    urls: ["https://security.paloaltonetworks.com/CVE-2026-0257"]
  - claim_id: fa4de079fd
    entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
    surface: "body"
    kind: cited
    text: "); Rapid7 MDR dates the earliest observed exploitation to 17 May 2026 and saw two waves, on 18 May from Vultr-hosted infrastructure and on 21 May from Dromatics Systems, which it believes are likely the same threat actor because of a consistent MAC address ("
    urls: ["https://www.rapid7.com/blog/post/etr-rapid7-observed-exploitation-of-pan-os-globalprotect-authentication-bypass-vulnerability-cve-2026-0257/"]
  - claim_id: 7d0087dda0
    entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
    surface: "body"
    kind: cited
    text: "CISA's KEV catalog lists the CVE with a date added of 29 May 2026 ("
    urls: ["https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"]
  - claim_id: 7351d0f7b3
    entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
    surface: "body"
    kind: cited
    text: "Affected are PAN-OS 12.1, 11.2, 11.1 and 10.2 releases below the fixed builds in Palo Alto's table and Prisma Access 11.2 and 10.2; Panorama and Cloud NGFW are not affected ("
    urls: ["https://security.paloaltonetworks.com/CVE-2026-0257"]
  - claim_id: 853570abb6
    entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
    surface: "body"
    kind: cited
    text: "The solution table names the first fixed build for each minor release, for example 12.1.4-h6 or 12.1.7 and later for 12.1.2 through 12.1.4, 11.2.12 or later for 11.2.11, 11.1.15 or later for 11.1.14, and 10.2.18-h6 or later on the 10.2 train, while Prisma Access 11.2 needs 11.2.7-h13 or later and 10.2 needs 10.2.10-h36 or later ("
    urls: ["https://security.paloaltonetworks.com/CVE-2026-0257"]
  - claim_id: ddc227159d
    entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
    surface: "body"
    kind: cited
    text: "After the upgrade users must re-authenticate once, because the firewall regenerates the cookie with a more secure method ("
    urls: ["https://security.paloaltonetworks.com/CVE-2026-0257"]
  - claim_id: cfd4be8be1
    entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
    surface: "body"
    kind: cited
    text: "Palo Alto's mitigations are a dedicated certificate used only for authentication override cookies, or disabling Authentication Override ("
    urls: ["https://security.paloaltonetworks.com/CVE-2026-0257"]
  - claim_id: 6e92f2a8c2
    entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
    surface: "body"
    kind: cited
    text: "**Exposure:** firewalls with a GlobalProtect portal or gateway where the option to generate or accept a cookie for authentication override is checked and the cookie certificate is reused for another feature such as the HTTPS service; Palo Alto's advisory gives the management-interface path under Network > GlobalProtect to check whether cookies are enabled ("
    urls: ["https://security.paloaltonetworks.com/CVE-2026-0257", "https://www.rapid7.com/blog/post/etr-rapid7-observed-exploitation-of-pan-os-globalprotect-authentication-bypass-vulnerability-cve-2026-0257/"]
  - claim_id: a6478bf266
    entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
    surface: "body"
    kind: cited
    text: "Rapid7 saw cookie authentication to the local admin account from hosting-provider address space with a generic non-human client name, followed by VPN IP assignment and POST requests to the HIP report and getconfig endpoints once a tunnel was established ("
    urls: ["https://www.rapid7.com/blog/post/etr-rapid7-observed-exploitation-of-pan-os-globalprotect-authentication-bypass-vulnerability-cve-2026-0257/"]
  - claim_id: b478606bd6
    entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
    surface: "body"
    kind: cited
    text: "Behind a gateway that was exposed, the post-exploitation artifacts Arctic Wolf describes for Qilin intrusions are the compromise check ("
    urls: ["https://arcticwolf.com/resources/blog/exploitation-of-cve-2026-0257-leads-to-qilin-ransomware/"]
  - claim_id: 7499532f45
    entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** upgrade to the fixed build for each minor release, or use a dedicated cookie certificate or disable Authentication Override until then, and expect users to re-authenticate once; treat any gateway that was exposed with the cookie feature on and unpatched since 17 May as a ransomware compromise-assessment target rather than a finished patch, because CISA marks the flaw as used in ransomware campaigns and Arctic Wolf traced Qilin deployments to it ("
    urls: ["https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json", "https://arcticwolf.com/resources/blog/exploitation-of-cve-2026-0257-leads-to-qilin-ransomware/"]
  - claim_id: f6be28dcb2
    entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
    surface: "body"
    kind: derived
    text: "**Detection:** GlobalProtect gateway authentication logs."
  - claim_id: b2719753c5
    entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
    surface: "section 2026-10-06T05:01:00Z"
    kind: cited
    text: "Arctic Wolf Labs' report of 2026-07-20 says it investigated multiple distinct intrusions in June 2026 that ended in Qilin ransomware deployment, all originating from exploitation of CVE-2026-0257 against Palo Alto Networks firewalls, and that the post-exploitation tradecraft ranged from rapid encryption-only operations to double extortion, possibly suggesting several affiliates of the Qilin ransomware-as-a-service operation ("
    urls: ["https://arcticwolf.com/resources/blog/exploitation-of-cve-2026-0257-leads-to-qilin-ransomware/"]
  - claim_id: 6e106ca4ad
    entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
    surface: "record 2026-10-06T05:01:00Z"
    kind: record-summary
    text: "CISA's KEV catalog (version 2026.10.04) now marks CVE-2026-0257 as used in known ransomware campaigns, and Arctic Wolf's report of 2026-07-20 describes June 2026 intrusions in which Qilin ransomware deployment began with the bypass, so an exposed, unpatched gateway needs a compromise assessment of the network behind it as well as the patch. The entry now gives the fixed builds from Palo Alto's solution table and its priority moves from critical to high, since the decision is now a compromise assessment rather than an emergency patch."
  - claim_id: 040f2bfde0
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: cited
    text: "The identifier arrived 24 days later, on 13 August, and the ENISA record describes the mechanism in full: because untrusted input is not properly sanitised during SNMP notification processing, \"an unauthenticated attacker can send specially crafted SMTP requests that may result in execution of arbitrary operating system commands as the Zimbra user\" ("
    urls: ["https://euvd.enisa.europa.eu/vulnerability/CVE-2026-73570"]
  - claim_id: f22b71fa8a
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: cited
    text: "**Exposure:** Zimbra Collaboration before 10.1.20 with the optional zimbra-snmp package installed and SNMP notifications enabled, which makes it a package check rather than a version check; CSIRT Italia also found compromises through older flaws on unsupported or unpatched lines ("
    urls: ["https://www.acn.gov.it/portale/w/zimbra-zcs-rilevato-sfruttamento-di-vulnerabilita-in-versioni-non-aggiornate"]
  - claim_id: 778e7d5959
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: cited
    text: "CSIRT Italia adds host checks for a server already compromised: the zimbra user's crontab and /opt/zimbra/.ssh/authorized_keys, SNMP exploit scripts under /opt/zimbra/data/tmp, JSP files or stray text files in the Jetty public directory, droppers, miners and ransomware payloads in /tmp and /var/tmp, and outbound connections including IRC and TCP 8801 ("
    urls: ["https://www.acn.gov.it/portale/w/zimbra-zcs-rilevato-sfruttamento-di-vulnerabilita-in-versioni-non-aggiornate"]
  - claim_id: c00414b5e0
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: uncited
    text: "What makes this worth an out-of-band look rather than a place in the next patch window is the sequence rather than the score: the code was fixed in July with no identifier attached, so an estate that drives its patching from CVE feeds, scanner signatures or an SBOM pipeline had nothing to match against for 24 days, and the flaw only became visible to those processes five days before it was recorded as exploited."
  - claim_id: 766d6f143e
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: derived
    text: "**Detection:** The behaviour to look for follows from the mechanism."
