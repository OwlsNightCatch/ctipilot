  - claim_id: dbe3733d08
    entry: 2026-10-06/denmark-cpr-population-register-third-party-access-breach
    surface: "summary"
    kind: frontmatter
    text: "Denmark's CPR administration says unauthorised parties used a private Danish company's lawful right to search the Central Person Register to obtain names, addresses and CPR numbers of about 8.8 million of its roughly 11 million records (living, deceased and emigrated persons); the ministry says the access does not cover the names and addresses of people with name-and-address protection. The minister told Ritzau the access lasted about ten days in September through a smaller company whose security around that access had not been good enough, in her words; the actor, the company and the method are not public."
  - claim_id: 542e8e9cb9
    entry: 2026-10-06/denmark-cpr-population-register-third-party-access-breach
    surface: "body"
    kind: cited
    text: "The register holds about 11 million records, covering living, deceased and emigrated persons, and the ministry says the unauthorised access does not cover the names and addresses of people registered with name-and-address protection; CPR stopped the company's access, reported the incident to the Danish data protection authority, and the police are investigating, with no statement yet on who is behind it ("
    urls: ["https://ufm.dk/aktuelt/pressemeddelelser/2026/oktober/omfattende-uautoriseret-adgang-til-borgeres-cpr-oplysninger/"]
  - claim_id: d96a815328
    entry: 2026-10-06/denmark-cpr-population-register-third-party-access-breach
    surface: "body"
    kind: cited
    text: "**Exposure:** any person in the register (the ministry says the access does not cover the names and addresses of people with name-and-address protection); the ministry warns recipients never to hand out passwords or other confidential information in calls or emails, even when the caller knows their name, address and CPR number ("
    urls: ["https://ufm.dk/aktuelt/pressemeddelelser/2026/oktober/omfattende-uautoriseret-adgang-til-borgeres-cpr-oplysninger/"]
