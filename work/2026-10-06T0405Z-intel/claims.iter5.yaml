  - claim_id: 937644cd05
    entry: 2026-10-06/denmark-cpr-population-register-third-party-access-breach
    surface: "headline"
    kind: frontmatter
    text: "A Danish company's legitimate register access, abused, exposed 8.8 million people's names, addresses and CPR numbers"
  - claim_id: dbe3733d08
    entry: 2026-10-06/denmark-cpr-population-register-third-party-access-breach
    surface: "summary"
    kind: frontmatter
    text: "Denmark's CPR administration says unauthorised parties used a private Danish company's lawful right to search the Central Person Register to obtain names, addresses and CPR numbers of about 8.8 million of its roughly 11 million records (living, deceased and emigrated persons); the ministry says the access does not cover the names and addresses of people with name-and-address protection. The minister told Ritzau the access lasted about ten days in September through a smaller company whose security around that access had not been good enough, in her words; the actor, the company and the method are not public."
  - claim_id: 84dc6ab1de
    entry: 2026-10-06/denmark-cpr-population-register-third-party-access-breach
    surface: "body"
    kind: cited
    text: "Denmark's CPR administration noticed irregular behaviour in the register on the evening of Friday 2026-10-02, learned over the weekend that unauthorised parties had obtained names, addresses and CPR numbers of about 8.8 million registered persons, and says the access worked by misusing a Danish private company's lawful right to search the register, within the scope of data that private companies may access (translated from Danish) ("
    urls: ["https://ufm.dk/aktuelt/pressemeddelelser/2026/oktober/omfattende-uautoriseret-adgang-til-borgeres-cpr-oplysninger/"]
  - claim_id: 542e8e9cb9
    entry: 2026-10-06/denmark-cpr-population-register-third-party-access-breach
    surface: "body"
    kind: cited
    text: "The register holds about 11 million records, covering living, deceased and emigrated persons, and the ministry says the unauthorised access does not cover the names and addresses of people registered with name-and-address protection; CPR stopped the company's access, reported the incident to the Danish data protection authority, and the police are investigating, with no statement yet on who is behind it ("
    urls: ["https://ufm.dk/aktuelt/pressemeddelelser/2026/oktober/omfattende-uautoriseret-adgang-til-borgeres-cpr-oplysninger/"]
  - claim_id: 5c3e9414e3
    entry: 2026-10-06/denmark-cpr-population-register-third-party-access-breach
    surface: "body"
    kind: cited
    text: "Under section 38 of the CPR Act a private company with a legitimate interest may receive information on a larger delimited group of persons that it has identified individually in advance, by CPR number, date of birth and name, or by name and address ("
    urls: ["https://ufm.dk/aktuelt/pressemeddelelser/2026/oktober/omfattende-uautoriseret-adgang-til-borgeres-cpr-oplysninger/"]
  - claim_id: 9c3b7ef9c4
    entry: 2026-10-06/denmark-cpr-population-register-third-party-access-breach
    surface: "body"
    kind: cited
    text: "The digitalisation minister told Ritzau the access lasted about ten days in September and ran through a smaller Danish company, that an employee of the CPR administration spotted the unusual activity on 2 October, and that red lights should have lit when it went on for so long; she declined to say whether the investigation sees criminal intent at the company ("
