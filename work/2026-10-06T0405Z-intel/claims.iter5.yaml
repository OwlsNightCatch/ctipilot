  - claim_id: 7906d30627
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "summary"
    kind: frontmatter
    text: "DIVD, the Dutch vulnerability-disclosure CSIRT, says attackers entered its network on 2026-09-21 through two Zammad flaws it calls previously unknown: CVE-2026-102489, a session hijack leading to code execution as the zammad user in versions 6.3.0 to 6.5.4, and CVE-2026-102490, a local escalation from that user to root in all versions. NCSC-NL states both have been exploited since 21 September and CISA listed both in KEV on 2026-10-02; Zammad says the code-execution flaw is exploitable only on 6.5 and older, which receive no security fixes, and that 7.2.0 hardens the code. Zammad's advisory of 2026-10-05 says it now has DIVD's technical details, assesses the root flaw as a local escalation that needs prior access to the server, ties it to a confirmed vulnerability in packager.io and is working on a solution, so no fix exists yet."
  - claim_id: 5d7305f8c5
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "actions[0]"
    kind: frontmatter
    text: "Find every self-hosted Zammad instance, copy its application and network logs before changing anything, upgrade to Zammad 7.2.0, the current stable release (6.5 and older receive no security fixes), or take it offline if it cannot be upgraded, and run DIVD's log-check script against the logs for the code-execution flaw."
  - claim_id: 37f62f7fdb
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "actions[1]"
    kind: frontmatter
    text: "Until Zammad ships a fix for CVE-2026-102490, restrict access to the Zammad server to trusted administrators, as Zammad advises (the flaw needs prior access to the host), keep Zammad off the internet or behind an authenticating reverse proxy or VPN and segment the ticket host from other internal services."
