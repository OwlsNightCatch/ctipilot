claims:
  - claim_id: b93a217d07
    entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
    surface: "headline"
    kind: frontmatter
    text: "CISA marks the exploited GlobalProtect VPN bypass as used in ransomware; Arctic Wolf traced Qilin intrusions to it"
  - claim_id: ef7b16d8fa
    entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
    surface: "summary"
    kind: frontmatter
    text: "CVE-2026-0257 is a pre-auth VPN authentication bypass in PAN-OS GlobalProtect (CISA KEV; Palo Alto reports limited exploit attempts, and Rapid7 and Unit 42 report successful exploitation): an attacker forges valid auth-override cookies by re-using the GlobalProtect certificate shared with the HTTPS service, with no credentials. CISA's KEV catalog (version 2026.10.04) marks it as used in known ransomware campaigns, and Arctic Wolf's report of 2026-07-20 describes June 2026 intrusions in which Qilin ransomware deployment began with this bypass. Patch or disable auth-override cookies, and treat a gateway that was exposed and unpatched as a compromise-assessment target."
  - claim_id: d9c3c1794e
    entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
    surface: "actions[0]"
    kind: frontmatter
    text: "Patch every PAN-OS GlobalProtect portal and gateway to the fixed release in Palo Alto's advisory for its train, or disable authentication override cookies or give them a certificate that no other service uses, then force one re-authentication so override cookies regenerate."
  - claim_id: 0039a51ee5
    entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
    surface: "actions[1]"
    kind: frontmatter
    text: "On every GlobalProtect gateway that was internet-reachable and unpatched at any time since 2026-05-17, treat the network behind it as a ransomware compromise-assessment target: review VPN sessions that authenticated by cookie from unexpected sources, then check Windows hosts for the artifacts Arctic Wolf describes (a ransomware payload staged under C:\\\\PerfLogs, a PsExec service, an LSASS dump written through comsvcs.dll to an .odt file, an ntdsutil media copy of the Active Directory database, and cleared event logs)."
  - claim_id: 4f8f34e447
    entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
    surface: "body"
    kind: cited
    text: "Authentication override cookies in PAN-OS GlobalProtect let a portal or gateway issue a cookie that a user presents in place of re-authenticating, and the feature is not enabled by default ("
    urls: ["https://www.rapid7.com/blog/post/etr-rapid7-observed-exploitation-of-pan-os-globalprotect-authentication-bypass-vulnerability-cve-2026-0257/"]
  - claim_id: fed74faf9f
    entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
    surface: "body"
    kind: cited
    text: "Palo Alto Networks says the flaw affects firewalls with a GlobalProtect portal or gateway where authentication override cookies are enabled and a specific certificate configuration exists, classes it as CWE-565 (reliance on cookies without validation and integrity checking), and scores it CVSS 4.0 7.8 with exploit maturity Attacked ("
    urls: ["https://security.paloaltonetworks.com/CVE-2026-0257"]
  - claim_id: 5b54bdc1c7
    entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
    surface: "body"
    kind: cited
    text: "Rapid7's analysis is that when the certificate used for the cookies is reused for another feature such as the HTTPS service of the portal or gateway, a remote unauthenticated attacker can discover that certificate's public key, forge an arbitrary cookie that the server decrypts and trusts, and bypass authentication; Rapid7 Labs published a proof-of-concept script that tests for it ("
    urls: ["https://www.rapid7.com/blog/post/etr-rapid7-observed-exploitation-of-pan-os-globalprotect-authentication-bypass-vulnerability-cve-2026-0257/"]
  - claim_id: 6a1582636a
    entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
    surface: "body"
    kind: cited
    text: "Palo Alto Networks says it is aware of limited exploit attempts on unpatched devices without mitigations applied ("
    urls: ["https://security.paloaltonetworks.com/CVE-2026-0257"]
  - claim_id: fa4de079fd
    entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
    surface: "body"
    kind: cited
    text: "); Rapid7 MDR dates the earliest observed exploitation to 17 May 2026 and saw two waves, on 18 May from Vultr-hosted infrastructure and on 21 May from Dromatics Systems, which it believes are likely the same threat actor because of a consistent MAC address ("
    urls: ["https://www.rapid7.com/blog/post/etr-rapid7-observed-exploitation-of-pan-os-globalprotect-authentication-bypass-vulnerability-cve-2026-0257/"]
  - claim_id: 7d0087dda0
    entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
    surface: "body"
    kind: cited
    text: "CISA's KEV catalog lists the CVE with a date added of 29 May 2026 ("
    urls: ["https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"]
  - claim_id: 7351d0f7b3
    entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
    surface: "body"
    kind: cited
    text: "Affected are PAN-OS 12.1, 11.2, 11.1 and 10.2 releases below the fixed builds in Palo Alto's table and Prisma Access 11.2 and 10.2; Panorama and Cloud NGFW are not affected ("
    urls: ["https://security.paloaltonetworks.com/CVE-2026-0257"]
  - claim_id: 853570abb6
    entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
    surface: "body"
    kind: cited
    text: "The solution table names the first fixed build for each minor release, for example 12.1.4-h6 or 12.1.7 and later for 12.1.2 through 12.1.4, 11.2.12 or later for 11.2.11, 11.1.15 or later for 11.1.14, and 10.2.18-h6 or later on the 10.2 train, while Prisma Access 11.2 needs 11.2.7-h13 or later and 10.2 needs 10.2.10-h36 or later ("
    urls: ["https://security.paloaltonetworks.com/CVE-2026-0257"]
  - claim_id: ddc227159d
    entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
    surface: "body"
    kind: cited
    text: "After the upgrade users must re-authenticate once, because the firewall regenerates the cookie with a more secure method ("
    urls: ["https://security.paloaltonetworks.com/CVE-2026-0257"]
  - claim_id: cfd4be8be1
    entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
    surface: "body"
    kind: cited
    text: "Palo Alto's mitigations are a dedicated certificate used only for authentication override cookies, or disabling Authentication Override ("
    urls: ["https://security.paloaltonetworks.com/CVE-2026-0257"]
  - claim_id: 6e92f2a8c2
    entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
    surface: "body"
    kind: cited
    text: "**Exposure:** firewalls with a GlobalProtect portal or gateway where the option to generate or accept a cookie for authentication override is checked and the cookie certificate is reused for another feature such as the HTTPS service; Palo Alto's advisory gives the management-interface path under Network > GlobalProtect to check whether cookies are enabled ("
    urls: ["https://security.paloaltonetworks.com/CVE-2026-0257", "https://www.rapid7.com/blog/post/etr-rapid7-observed-exploitation-of-pan-os-globalprotect-authentication-bypass-vulnerability-cve-2026-0257/"]
  - claim_id: a6478bf266
    entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
    surface: "body"
    kind: cited
    text: "Rapid7 saw cookie authentication to the local admin account from hosting-provider address space with a generic non-human client name, followed by VPN IP assignment and POST requests to the HIP report and getconfig endpoints once a tunnel was established ("
    urls: ["https://www.rapid7.com/blog/post/etr-rapid7-observed-exploitation-of-pan-os-globalprotect-authentication-bypass-vulnerability-cve-2026-0257/"]
  - claim_id: b478606bd6
    entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
    surface: "body"
    kind: cited
    text: "Behind a gateway that was exposed, the post-exploitation artifacts Arctic Wolf describes for Qilin intrusions are the compromise check ("
    urls: ["https://arcticwolf.com/resources/blog/exploitation-of-cve-2026-0257-leads-to-qilin-ransomware/"]
  - claim_id: 7499532f45
    entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** upgrade to the fixed build for each minor release, or use a dedicated cookie certificate or disable Authentication Override until then, and expect users to re-authenticate once; treat any gateway that was exposed with the cookie feature on and unpatched since 17 May as a ransomware compromise-assessment target rather than a finished patch, because CISA marks the flaw as used in ransomware campaigns and Arctic Wolf traced Qilin deployments to it ("
    urls: ["https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json", "https://arcticwolf.com/resources/blog/exploitation-of-cve-2026-0257-leads-to-qilin-ransomware/"]
  - claim_id: f6be28dcb2
    entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
    surface: "body"
    kind: derived
    text: "**Detection:** GlobalProtect gateway authentication logs."
  - claim_id: f819dde4c9
    entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
    surface: "section 2026-10-06T05:01:00Z"
    kind: cited
    text: "CISA's Known Exploited Vulnerabilities catalog (version 2026.10.04) now marks CVE-2026-0257 as used in known ransomware campaigns; the record names no group and its date of addition remains 2026-05-29 ("
    urls: ["https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"]
  - claim_id: b2719753c5
    entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
    surface: "section 2026-10-06T05:01:00Z"
    kind: cited
    text: "Arctic Wolf Labs' report of 2026-07-20 says it investigated multiple distinct intrusions in June 2026 that ended in Qilin ransomware deployment, all originating from exploitation of CVE-2026-0257 against Palo Alto Networks firewalls, and that the post-exploitation tradecraft ranged from rapid encryption-only operations to double extortion, possibly suggesting several affiliates of the Qilin ransomware-as-a-service operation ("
    urls: ["https://arcticwolf.com/resources/blog/exploitation-of-cve-2026-0257-leads-to-qilin-ransomware/"]
  - claim_id: cc8a0b25dd
    entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
    surface: "section 2026-10-06T05:01:00Z"
    kind: cited
    text: "The chain Arctic Wolf describes starts with a GlobalProtect VPN session obtained through the cookie bypass, in some cases from systems that identified themselves as kali, and continues with registry Run-key persistence that points at a ransomware payload staged under C:\\PerfLogs, remote-access tools (AnyDesk, Ngrok, LogMeIn and, in one case, a scheduled task consistent with MeshAgent), LSASS credential theft through rundll32 and comsvcs.dll into a file with an .odt extension, a full copy of the Active Directory database with ntdsutil, lateral movement with PsExec over administrative shares and RDP, a PowerShell routine that clears every Windows event log with records, and Microsoft Defender real-time protection disabled in some cases ("
    urls: ["https://arcticwolf.com/resources/blog/exploitation-of-cve-2026-0257-leads-to-qilin-ransomware/"]
  - claim_id: 0f591300e1
    entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
    surface: "section 2026-10-06T05:01:00Z"
    kind: cited
    text: "In the double-extortion cases data went to the MEGA cloud storage service with Rclone before encryption, and the attackers targeted the Veeam backup infrastructure before deploying the ransomware; some intrusions involved no data theft before encryption ("
    urls: ["https://arcticwolf.com/resources/blog/exploitation-of-cve-2026-0257-leads-to-qilin-ransomware/"]
  - claim_id: 0d8b57bf2a
    entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
    surface: "section 2026-10-06T05:01:00Z"
    kind: uncited
    text: "A gateway that was reachable and unpatched therefore needs a compromise assessment of the Windows estate behind it, not only the patch and a forced re-authentication."
  - claim_id: 86afb69916
    entry: 2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen
    surface: "record 2026-10-06T05:01:00Z"
    kind: record-summary
    text: "CISA's KEV catalog (version 2026.10.04) now marks CVE-2026-0257 as used in known ransomware campaigns, and Arctic Wolf's report of 2026-07-20 describes June 2026 intrusions in which Qilin ransomware deployment began with the bypass, so an exposed, unpatched gateway needs a compromise assessment of the network behind it as well as the patch."
  - claim_id: aff6c4d43d
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "summary"
    kind: frontmatter
    text: "Zimbra shipped ZCS 10.1.20 on 2026-07-20 with a fix for a command injection in the SNMP monitoring component, and the identifier CVE-2026-73570 followed on 2026-08-13. Microsoft Threat Intelligence now reports confirmed intrusions in more than one region and industry, with probing of the injection point from 2026-07-28, before disclosure, and CISA lists the flaw in KEV (added 2026-08-21). The flaw needs no authentication and applies only where the optional zimbra-snmp package is installed and SNMP notifications are enabled; Microsoft's cases combined web shells, root escalation, theft of Zimbra's authentication keys and cluster-wide movement, so an upgrade does not evict an attacker already inside. CSIRT Italia reports that exploitation of this flaw has also led to ELock-family ransomware, cryptomining and theft of the LDAP database and credential hashes on exposed servers, and found no intrusion on regularly updated instances."
  - claim_id: 4d61692ecf
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade every Zimbra Collaboration host to 10.1.21 (10.1.20 is the minimum for CVE-2026-73570); where the upgrade cannot happen at once, remove the zimbra-snmp package or disable SNMP notifications and restrict SNMP and SMTP to trusted hosts."
  - claim_id: 466fc19dbd
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "actions[1]"
    kind: frontmatter
    text: "On every host that ran a build before 10.1.20 with SNMP notifications enabled at any time since 2026-07-28, upgrading is not enough: rotate all domain zimbraPreAuthKey values and run the compromise check on every mailbox node, covering the zimbra user's crontab and /opt/zimbra/.ssh/authorized_keys, JSP or stray text files under /opt/zimbra/jetty_base/webapps/zimbra/public, droppers in /tmp and /var/tmp, and outbound connections from the mail server; where web shells or an LDAP dump turn up, rotate every mailbox and administrative credential."
  - claim_id: 7ca222c395
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: cited
    text: "Zimbra's own security-advisory table records the fix for CVE-2026-73570 as \"Fixed a command injection vulnerability in the SNMP monitoring component when SNMP notifications are enabled\", shipped in release 10.1.20 ("
    urls: ["https://wiki.zimbra.com/wiki/Zimbra_Security_Advisories"]
  - claim_id: e702a41324
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: cited
    text: "That release went out on 20 July 2026 ("
    urls: ["https://wiki.zimbra.com/wiki/Zimbra_Releases/10.1.20"]
  - claim_id: ca27ddabd4
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: cited
    text: ") carrying nine fixes, and at the time none of them had been flagged as actively exploited; the vendor's stated position was that \"in line with industry best practices, information disclosure is limited for security vulnerability fixes\" ("
    urls: ["https://thehackernews.com/2026/07/zimbra-patches-critical-snmp-command.html"]
  - claim_id: 040f2bfde0
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: cited
    text: "The identifier arrived 24 days later, on 13 August, and the ENISA record describes the mechanism in full: because untrusted input is not properly sanitised during SNMP notification processing, \"an unauthenticated attacker can send specially crafted SMTP requests that may result in execution of arbitrary operating system commands as the Zimbra user\" ("
    urls: ["https://euvd.enisa.europa.eu/vulnerability/CVE-2026-73570"]
  - claim_id: 93b1c5f561
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: cited
    text: "ENISA scores it 8.9 with high attack complexity ("
    urls: ["https://euvd.enisa.europa.eu/vulnerability/CVE-2026-73570"]
  - claim_id: b84229e053
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: cited
    text: "On 19 August CERT-FR issued its own advisory for the Zimbra bulletin and stated plainly that ENISA records CVE-2026-73570 as actively exploited ("
    urls: ["https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-1041/"]
  - claim_id: d60184191c
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: cited
    text: "ENISA's record lists it in the EU KEV catalog from 18 August ("
    urls: ["https://euvd.enisa.europa.eu/vulnerability/CVE-2026-73570"]
  - claim_id: f22b71fa8a
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: cited
    text: "**Exposure:** Zimbra Collaboration before 10.1.20 with the optional zimbra-snmp package installed and SNMP notifications enabled, which makes it a package check rather than a version check; CSIRT Italia also found compromises through older flaws on unsupported or unpatched lines ("
    urls: ["https://www.acn.gov.it/portale/w/zimbra-zcs-rilevato-sfruttamento-di-vulnerabilita-in-versioni-non-aggiornate"]
  - claim_id: b83ff37e58
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: cited
    text: "In process-execution telemetry with parent lineage, a shell created by Perl running a generated swatchdog script is the baseline Microsoft's hunting logic starts from, and the signal is the injection signature inside that invocation: a legitimate snmptrap invocation immediately followed by shell metacharacters and a wget or curl call, wrapped in a trailing comment character that swallows the remaining legitimate arguments ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/09/30/unauthenticated-command-injection-on-internet-facing-mail-servers-tracking-cve-2026-73570/"]
  - claim_id: 778e7d5959
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: cited
    text: "CSIRT Italia adds host checks for a server already compromised: the zimbra user's crontab and /opt/zimbra/.ssh/authorized_keys, SNMP exploit scripts under /opt/zimbra/data/tmp, JSP files or stray text files in the Jetty public directory, droppers, miners and ransomware payloads in /tmp and /var/tmp, and outbound connections including IRC and TCP 8801 ("
    urls: ["https://www.acn.gov.it/portale/w/zimbra-zcs-rilevato-sfruttamento-di-vulnerabilita-in-versioni-non-aggiornate"]
  - claim_id: 845e39b559
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: cited
    text: "**Triage:** the notification path itself legitimately runs a shell that invokes snmptrap, so a shell child of the swatchdog Perl script is not suspicious on its own; the discriminator is what the command line carries beyond the snmptrap invocation, namely shell metacharacters followed by a wget, curl or other non-snmptrap command ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/09/30/unauthenticated-command-injection-on-internet-facing-mail-servers-tracking-cve-2026-73570/"]
  - claim_id: c00414b5e0
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: uncited
    text: "What makes this worth an out-of-band look rather than a place in the next patch window is the sequence rather than the score: the code was fixed in July with no identifier attached, so an estate that drives its patching from CVE feeds, scanner signatures or an SBOM pipeline had nothing to match against for 24 days, and the flaw only became visible to those processes five days before it was recorded as exploited."
  - claim_id: e9e97c6e4d
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: uncited
    text: "Anyone who upgraded to 10.1.20 in July for unrelated reasons is already covered and does not know it; anyone who deferred is now unpatched against a flaw with a published exploitation status."
  - claim_id: 766d6f143e
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: derived
    text: "**Detection:** The behaviour to look for follows from the mechanism."
  - claim_id: 08ff6d6ce2
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: derived
    text: "Command injection at the point where a notification is formatted means the observable is a command run from the notification path that carries more than the notification itself."
  - claim_id: caf22733ec
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: derived
    text: "On the network side, the wget or curl call in the injection signature shows up as an outbound connection from the mail server made by the zimbra account."
  - claim_id: 2320efa08f
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** the check that scopes this is a package check, not a version check: a Zimbra estate without the optional zimbra-snmp package installed and SNMP notifications enabled is not exposed to this flaw regardless of build."
  - claim_id: 1c70b2d887
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: derived
    text: "For everyone else, 10.1.20 or later is the remediation and removing the package or disabling notifications is the control that works without a maintenance window."
  - claim_id: 006d3dae16
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: derived
    text: "Because exploitation preceded the identifier, an upgrade does not show that a host is clean: the compromise check is the second half of the remediation, covering the web shells, sudo configuration, systemd units and Zimbra secrets Microsoft describes."
  - claim_id: 7d2e9b9b21
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: derived
    text: "A vendor fix that ships ahead of its identifier is also invisible to every CVE-keyed process an organisation runs, so \"we patch what the scanner shows\" leaves a gap exactly as long as the gap between the release and the CVE."
  - claim_id: fd11a8366d
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "section 2026-10-06T05:00:00Z"
    kind: cited
    text: "CSIRT Italia reports, in bulletin BL01/261005/CSIRT-ITA, multiple compromises of internet-exposed Zimbra servers handled in the Italian national context, mostly through CVE-2026-73570 and to a lesser extent through older flaws on unpatched or end-of-life instances ("
    urls: ["https://www.acn.gov.it/portale/w/zimbra-zcs-rilevato-sfruttamento-di-vulnerabilita-in-versioni-non-aggiornate"]
  - claim_id: b14bcbb329
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "section 2026-10-06T05:00:00Z"
    kind: cited
    text: "In two CVE-2026-73570 cases exploitation ended in ransomware: on an 8.7.11 instance the attacker opened an interactive reverse shell and irreversibly encrypted many files on one node, and in a second case of unspecified version an ELock-family ransomware executable was dropped; both servers had the optional zimbra-snmp package, and the evidence does not tie the two cases to one actor or payload ("
    urls: ["https://www.acn.gov.it/portale/w/zimbra-zcs-rilevato-sfruttamento-di-vulnerabilita-in-versioni-non-aggiornate"]
  - claim_id: abcae7f6af
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "section 2026-10-06T05:00:00Z"
    kind: cited
    text: "Three further cases installed cryptominers, one on 10.1.19 with a crontab entry for the zimbra user that ran a payload from a temporary directory ("
    urls: ["https://www.acn.gov.it/portale/w/zimbra-zcs-rilevato-sfruttamento-di-vulnerabilita-in-versioni-non-aggiornate"]
  - claim_id: eb5b1a6833
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "section 2026-10-06T05:00:00Z"
    kind: cited
    text: "In one case the exploit fetched a payload from external staging infrastructure and ran a Perl script directly in memory without writing files, with an attempted connection to a presumed IRC command-and-control server and no post-compromise activity found ("
    urls: ["https://www.acn.gov.it/portale/w/zimbra-zcs-rilevato-sfruttamento-di-vulnerabilita-in-versioni-non-aggiornate"]
  - claim_id: 47f51f72e4
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "section 2026-10-06T05:00:00Z"
    kind: cited
    text: "In two cases web shells were planted in the directories the web service exposes: on a 10.1.4 instance the attackers left JSP web shells, including ones managed with Behinder, and exfiltrated the LDAP database, the mailbox list and the credential hashes, and on another instance several JSP web shells took mail down for 48 hours for more than 6,000 mailboxes with no data theft documented ("
    urls: ["https://www.acn.gov.it/portale/w/zimbra-zcs-rilevato-sfruttamento-di-vulnerabilita-in-versioni-non-aggiornate"]
  - claim_id: 2914a15532
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "section 2026-10-06T05:00:00Z"
    kind: cited
    text: "The two cases share five command-and-control addresses and similar JSP constructs, but ACN says the evidence does not let it attribute both to the same actor ("
    urls: ["https://www.acn.gov.it/portale/w/zimbra-zcs-rilevato-sfruttamento-di-vulnerabilita-in-versioni-non-aggiornate"]
  - claim_id: afdb20f32f
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "section 2026-10-06T05:00:00Z"
    kind: cited
    text: "ACN also describes a CentOS server turned into an SSH brute-force source after a write test in the Jetty public directory, with CVE-2026-73570 as the presumed but unconfirmed entry, and an end-of-life server whose mailbox passwords were all reset by the attacker through an undetermined vector ("
    urls: ["https://www.acn.gov.it/portale/w/zimbra-zcs-rilevato-sfruttamento-di-vulnerabilita-in-versioni-non-aggiornate"]
  - claim_id: 9fa1404dbd
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "section 2026-10-06T05:00:00Z"
    kind: cited
    text: "Older flaws (CVE-2024-45519, CVE-2022-41352, CVE-2022-27925, CVE-2022-37042 and CVE-2023-38750) account for the remaining cases on unpatched or unsupported lines, including a further ransomware case on an 8.8.15 instance ("
    urls: ["https://www.acn.gov.it/portale/w/zimbra-zcs-rilevato-sfruttamento-di-vulnerabilita-in-versioni-non-aggiornate"]
  - claim_id: 1b80f7f9c2
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "section 2026-10-06T05:00:00Z"
    kind: cited
    text: "ACN says nearly all affected systems lacked applicable patches or ran unsupported branches, that in several cases the attackers persisted without root by staying in the zimbra application user's context, and that it found no evidence of successful intrusions on regularly updated instances ("
    urls: ["https://www.acn.gov.it/portale/w/zimbra-zcs-rilevato-sfruttamento-di-vulnerabilita-in-versioni-non-aggiornate"]
  - claim_id: 9e18021abb
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "section 2026-10-06T05:00:00Z"
    kind: cited
    text: "Its mitigations are to update, to disable or remove the zimbra-snmp package where patching has to wait, to inspect the zimbra user's crontab and /opt/zimbra/.ssh/authorized_keys, to look for SNMP exploit scripts under /opt/zimbra/data/tmp and for JSP files or stray text files in the Jetty public directory, to check /tmp and /var/tmp for droppers, miners and ransomware payloads, to rotate all mailbox and administrative credentials where web shells or anomalies are found, to keep the administrative port TCP 7071 and unneeded SOAP interfaces off the public internet, and to filter egress from the Zimbra servers, including IRC and TCP 8801 ("
    urls: ["https://www.acn.gov.it/portale/w/zimbra-zcs-rilevato-sfruttamento-di-vulnerabilita-in-versioni-non-aggiornate"]
  - claim_id: 444ab763c4
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "record 2026-10-06T05:00:00Z"
    kind: record-summary
    text: "CSIRT Italia's bulletin of 2026-10-05 reports compromises of exposed Zimbra servers through CVE-2026-73570 that ended in ELock-family ransomware, cryptomining, web shells with theft of the LDAP database and credential hashes, and a 48-hour mail outage for more than 6,000 mailboxes, and found no intrusion on regularly updated instances. Its host checks (the zimbra user's crontab and authorized_keys, JSP files in the Jetty public directory, droppers in temporary directories, egress) are added to the compromise check."
