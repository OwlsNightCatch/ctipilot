    text: "Atlassian: unauthenticated file access in every Data Center version of eight products; patch or take them offline"
  - claim_id: b17610ed35
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "summary"
    kind: frontmatter
    text: "Atlassian's advisory of 2026-10-05 fixes CVE-2026-21589, an arbitrary file access flaw in the web application root of every version of Bitbucket, Confluence, Jira Service Management, Jira Software, Bamboo and Crowd Data Center, plus Crucible and Fisheye (CVSS 4.0 9.3). The attacker must know a file's exact name and path and cannot list directories; Atlassian found no evidence of exploitation and tells customers to patch immediately or take internet-facing instances off the internet, with a web application firewall or Tomcat rewrite rule as the interim control."
  - claim_id: 2f9a69b5d3
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade every Bitbucket, Confluence, Jira Service Management, Jira Software, Bamboo and Crowd Data Center installation to a fixed version of its line (Bitbucket 9.4.26, 10.2.8 or 10.5.1; Confluence 9.2.26 or 10.2.19; Jira Service Management 5.12.40, 10.3.26 or 11.3.12; Jira Software 9.12.40, 10.3.26 or 11.3.12; Bamboo 10.2.24 or 12.1.12; Crowd 6.3.7, 7.0.3, 7.1.7 or 7.2.4) and Crucible and Fisheye to 4.9.15, internet-reachable instances first; until each is upgraded, take it off the internet or put Atlassian's web application firewall or Tomcat rewrite rule in front of it."
  - claim_id: abc3c50373
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "actions[1]"
    kind: frontmatter
    text: "On every Data Center instance that was internet-reachable, URL-decode the access logs for the whole exposure period (up to two decoding passes) and search for '..' directly next to '/', '\\\\' or '::', as Atlassian describes; Atlassian cannot say whether any instance was affected."
