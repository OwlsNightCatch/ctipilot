        attribution: "Apache Struts Security Bulletin S2-075"
        source_url: "https://cwiki.apache.org/confluence/display/WW/S2-075"
      - quote: "Struts 7 is not affected in its default configuration, where the OGNL allowlist is enabled."
        attribution: "Apache Struts Security Bulletin S2-075"
        source_url: "https://cwiki.apache.org/confluence/display/WW/S2-075"
    borderline: true
    borderline_reason: "Apache rates it Moderate and the vulnerable mapper is deprecated and non-default; no PoC or exploitation. Drop-leaning unless the composer wants a one-line watch item for legacy Struts apps."
