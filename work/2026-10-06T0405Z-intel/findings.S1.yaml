    summary: |
      Atlassian disclosed on 2026-10-05 (Monday) CVE-2026-21589, an unauthenticated arbitrary file access flaw in the web
      application root of ALL versions of eight self-managed products: Bitbucket, Confluence, Jira Service Management, Jira
      Software, Bamboo and Crowd Data Center, plus Crucible and Fisheye. Atlassian rates it Critical, CVSS 4.0 9.3
      (AV:N/AC:L/AT:N/PR:N/UI:N, high confidentiality impact, subsequent-system impact high). Atlassian says the attacker must
      know the exact name and path of the target file, that directory contents cannot be listed, and that in some
      configurations sensitive files are present. The Atlassian tracker classes it "Path Traversal (Arbitrary Read/Write)".
      Atlassian Cloud is already patched and Atlassian's investigation found no evidence of exploitation; for Data Center
      it tells customers to patch immediately or, failing that, remove internet exposure and apply one of three stop-gaps:
      a WAF/proxy rule that blocks any URL with '..' next to '/', '\' or '::' (including URL-encoded forms), a Tomcat
      RewriteValve rewrite.config (Confluence, Jira, JSM, Bamboo, Crowd) or a urlrewrite.xml rule (Bitbucket).
      Fixed builds per Atlassian's advisory page: Bitbucket DC 9.4.26 / 10.2.8 / 10.5.1; Confluence DC 9.2.26 / 10.2.19;
      Jira Service Management DC 5.12.40 / 10.3.26 / 11.3.12; Jira Software DC 9.12.40 / 10.3.26 / 11.3.12; Bamboo DC
      10.2.24 / 12.1.12; Crowd DC 6.3.7 / 7.0.3 / 7.1.7 / 7.2.4; Crucible 4.9.15; Fisheye 4.9.15. Atlassian's Crowd tracker
      page (CWD-6610) lists 7.1.6 and the GitHub/EUVD records list 7.1.1 for the 7.1 line; the advisory page says 7.1.7 and
      is the one to follow. Versions outside the support window may also be affected. No public proof of concept, scanning
      report or KEV listing was found as of 2026-10-06 04:40Z (EPSS not yet scored); one independent outlet (The Register)
      reports Atlassian emailed customers "Action required". Assessment (analyst, not a source claim): a pre-authentication
      path-handling flaw in widely deployed Java web applications, with a vendor-published URL-pattern signature, is the
      profile that is typically reverse-engineered from the patch diff quickly; the exact-file-name precondition limits
      impact to known web-root files.
    region_nexus: "global; no region-specific reporting. Relevant wherever self-managed Atlassian Data Center is deployed; Swiss public-sector relevance is the analyst's inference (intranet collaboration and software-delivery estates commonly run Jira, Confluence and Bitbucket), not stated by any source"
