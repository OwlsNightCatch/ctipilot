        attribution: "The Register"
        source_url: "https://www.theregister.com/security/2026/10/06/atlassian-warns-of-critical-file-access-flaw-in-its-datacenter-products/5301284"
    extended_notes: |
      Exposure (vendor-stated): every Data Center version of the eight products is affected (EoL versions may be too); Atlassian Cloud is not.
      Read the running version from each product's admin/About page and compare to the fixed table. "Instances accessible to the public
      internet, including those with user authentication" are the ones Atlassian says to isolate first.
      Detection concept (telemetry class: reverse-proxy / WAF / Tomcat access logs in front of the Atlassian application): requests whose
      path contains '..' immediately adjacent to '/', '\' or '::' in plain, single- or double-URL-encoded form (the exact pattern in
      Atlassian's WAF regex), especially with HTTP 200 and an unexpected content type or size; the vendor publishes no compromise
      indicators and no list of exposed files. Post-patch compromise check (analyst inference, flagged as such): if an instance was
      reachable while unpatched, treat configuration or secret-bearing files inside the web-application root as possibly read and
      rotate the credentials they hold; Atlassian says only that "in some configurations, there may be sensitive files present".
      Hardening levers named by Atlassian: patch to the fixed builds; remove internet exposure; WAF/proxy regex rule; Tomcat RewriteValve
      plus rewrite.config (needs a node restart; per-product WEB-INF directory paths are in the advisory); Bitbucket uses a urlrewrite.xml rule.
      Suggested priority for the composer: high (pre-authentication, eight products, vendor 'Action required' email; no exploitation known).
      The advisory page is not dated in its extracted text; 2026-10-05 is taken from EUVD ingest (2026-10-05 21:30), Atlassian's tracker
      'Resolved' stamp and The Register's 'on Monday' wording; GitHub's advisory is stamped 2026-10-06T00:32Z.
