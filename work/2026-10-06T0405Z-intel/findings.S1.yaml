    reason: "RECIPE UPDATE: the listing now returns through `python3 tools/fetch_source.py extract https://ssd-disclosure.com/advisories/` (served by the jina reader fallback, undated list; each article page carries 'Published Time'); newest advisory is DCOM PsmServiceExtHost LPE, 2026-09-10 (Microsoft CVE-2026-69459, patched September), so 0 in-horizon items. Direct GET still answers the captcha shell; the record's 'blocked' status could move to bridge/jina if the operator accepts the reader credit."
  - source_id: searchlight-cyber
    reason: "RECIPE UPDATE: `extract https://slcyber.io/research-center/` returns raw HTML whose hrefs list /research/<slug> article links (six listed); dates are only on the article pages ('Month D, 2026' near the title). Newest read is 2026-07-20 (goja RCE, WordPress RCE with GPT-5.6), so 0 in-horizon items."
  - source_id: fortinet-psirt
    reason: "RECIPE UPDATE: the advisory HTML's 'Download CSAF' href (filestore.fortinet.com/fortiguard/psirt/csaf_<slug>_fg-ir-26-NNN.json, readable with `url --direct`) gives current_release_date and structured remediations; the page's Timeline block names revisions ('2026-10-05: Solution update'), which the RSS pubDate does not."
  - source_id: msrc-update-guide
    reason: "RECIPE UPDATE: `msrc recent N` plus `msrc cve <CVE>` give no KB/fixed-build list; `python3 tools/fetch_source.py msrc cvrf <release-id>` (here 2026-Oct, 14 KB, the out-of-band release holding only CVE-2026-96940) returns the Remediations with KB numbers and FixedBuild values."
  - source_id: github-advisory
    reason: "RECIPE UPDATE: `python3 tools/fetch_source.py url \"https://api.github.com/advisories?per_page=100&severity=critical&type=reviewed&sort=published&direction=desc\"` returns the newest critical reviewed advisories as JSON in one call (used for the in-window sweep); the per-repo security-advisories endpoint works for kiteworks and langflow."
  - source_id: chrome-releases
    reason: "RECIPE UPDATE: `extract https://chromereleases.googleblog.com/search/label/Stable%20updates` returns the Security Fixes sections with build numbers; the front page lists only titles."
  - source_id: mikrotik-routeros-changelog
    reason: "RECIPE UPDATE (candidate record): plain-text changelogs are readable with `url --direct https://upgrade.mikrotik.com/routeros/<version>/CHANGELOG` and `url --direct https://upgrade.mikrotik.com/routeros/NEWESTa7.<stable|long-term|testing|development>` gives the newest build per channel; the mikrotik.com/download/changelogs page is a JS shell ('Loading')."
  - source_id: "community.citrix.com (Citrix techzone blog, cited by the CVE-2026-88779 entry)"
    reason: "WebFetch HTTP 403 and `extract` 'all transports failed' for https://community.citrix.com/techzone-blogs/110_security-updates/understanding-and-addressing-cve-2026-88779-in-citrix-netscaler-adc-and-citrix-netscaler-gateway/; covered anyway through the CTX697174 bulletin on support.citrix.com (reads with `extract`)."
  - source_id: "techcommunity.microsoft.com (Exchange team blog 'Released: September 2026 V2 Exchange Server Security Updates')"
    reason: "JS-rendered; `extract` and WebFetch return only the title; covered by the MSRC CVRF."
  - source_id: "reader credit use"
    reason: "jina reader fallback fired for: ssd-disclosure listing and article (2 calls), a wrong-slug Register URL (1), an NVD REST query (1, empty because the CVE is not yet in NVD) and an HPE bulletin (1); no key exhaustion seen."
  - source_id: advisories-ncsc-nl
    reason: "Quiet-day observation, not a failure: the feed holds one in-window advisory (NCSC-2026-0400 Dell CSM); NCSC-2026-0399 (Citrix, 2026-10-04) is covered."
