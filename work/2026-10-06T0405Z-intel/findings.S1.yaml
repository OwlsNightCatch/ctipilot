  # ------------------------------------------------------------------ ITEM 9 (BORDERLINE)
  - title: "Apache Struts S2-075 (CVE-2026-104711): OGNL injection to RCE in the deprecated legacy RESTful action mapper, non-default; fixed in 6.12.0 and 7.4.0 (three further S2 bulletins are DoS or data-mixing)"
    sources:
      - { url: "https://cwiki.apache.org/confluence/display/WW/S2-075", publisher: "Apache Struts Security Bulletin S2-075", date: "2026-10-02", role: "primary" }
      - { url: "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-3723", publisher: "BSI WID (WID-SEC-2026-3723, Apache Struts: mehrere Schwachstellen)", date: "2026-10-05", role: "corroborating" }
    discovery_trace: "first seen at: bsi-de, `python3 tools/fetch_source.py bsi-rss` (WID-SEC-2026-3723 '[NEU] [hoch] Apache Struts: Mehrere Schwachstellen', 2026-10-05) → `bsi-csaf WID-SEC-2026-3723` (references S2-075 to S2-078) → primary: https://cwiki.apache.org/confluence/display/WW/S2-075 (and S2-076/077/078 read via `extract`)"
    summary: |
      Apache published four Struts bulletins around 2026-10-02 (S2-075 created 2026-10-02). S2-075 / CVE-2026-104711: "OGNL injection in the legacy
      RESTful action mapper can lead to remote code execution"; Apache's maximum security rating is Moderate. Preconditions: the application uses
      the legacy RESTful action mapper (not the default mapper, not 'restful2', not the REST plugin) and, on Struts 7, only when the OGNL
      allowlist is disabled ("Struts 7 is not affected in its default configuration, where the OGNL allowlist is enabled"). Affected: 2.0.0 to
      2.3.37 (EOL), 2.5.0 to 2.5.33 (EOL), 6.0.0 to 6.11.0, 7.0.0 to 7.3.0; fixed in 6.12.0 and 7.4.0; workaround: switch to the default,
      restful2 or REST-plugin mapper. The other three are unauthenticated denial of service by response amplification for BigDecimal
      parameters rendered through the tag library (S2-076, CVE-2026-104712), unbounded REST-plugin request-body read (S2-077, CVE-2026-104713,
      Important) and a shared message formatter that can show one user's date value to another (S2-078, CVE-2026-104714). No public proof of
      concept or exploitation was found; Struts RCEs have historically been weaponised quickly once an OGNL path is public, which is the
      analyst's reason for flagging it, not a source claim.
    region_nexus: "global"
    primary_sector_nexus: "indirect (legacy Java web applications in public-sector estates)"
    sector: "technology"
    cves: [CVE-2026-104711, CVE-2026-104712, CVE-2026-104713, CVE-2026-104714]
    techniques: [T1190]
    affected_products: ["Apache Struts"]
    entity_keys: []
