    summary: |
      Update to the existing CVE-2026-0257 entries (neither mentions ransomware). CISA's KEV record for CVE-2026-0257 (dateAdded
      2026-05-29) now carries knownRansomwareCampaignUse "Known"; the record names no group and its notes cite only Palo Alto's advisory
      and the NVD page, and the date the flag changed is not shown. The supporting incident-response reporting is Arctic Wolf Labs'
      2026-07-20 report: it "investigated multiple distinct intrusions during June 2026 that resulted in Qilin ransomware deployment,
      all originating from exploitation of CVE-2026-0257 against Palo Alto Networks firewall appliances", and assesses that post-exploitation
      tradecraft "varied across intrusions, from rapid encryption-only operations to full double-extortion, possibly suggesting multiple
      affiliates" of the Qilin RaaS. Observed chain (Arctic Wolf): the authentication-override cookie forgery gives an authenticated
      GlobalProtect VPN session, some from hosts self-identifying as 'kali'; persistence through registry Run values (an asterisk plus six
      random lowercase letters pointing at the staged ransomware binary) and, in one case, a MeshAgent scheduled task; remote-access tools
      (AnyDesk, Ngrok, LogMeIn) in several intrusions; LSASS dumping with rundll32/comsvcs.dll MiniDump executed through a randomly named
      service; NTDS extraction; PsExec execution over administrative shares from a PerfLogs staging directory; password-protected ransomware
      payloads; log clearing; and, in the slower intrusions, exfiltration to cloud storage before encryption. Arctic Wolf found overlapping
      exploitation source infrastructure across intrusions and says this suggests a shared toolkit or coordinated infrastructure. Palo Alto's
      own page still says only that it "has become aware of limited exploit attempts on unpatched PAN-OS devices without mitigations applied"
      (last timeline line 2026-06-03). EPSS 0.964 (percentile 99.9). No other IR firm's independent Qilin attribution was found; Security
      Affairs and trade outlets repeat Arctic Wolf.
