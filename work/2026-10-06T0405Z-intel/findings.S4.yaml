  evidence:
  - quote: By misusing a Danish company's lawful access to search for information in the CPR system, unauthorised parties have obtained names, addresses, CPR numbers etc. of approx. 8.8 million persons registered in the CPR system. (translated)
    original: Ved at misbruge en dansk virksomheds lovlige adgang til at søge oplysninger i CPR-systemet, har uvedkommende skaffet sig adgang til navne, adresser, CPR-numre mv. på ca. 8,8 millioner registrerede borgere i CPR-systemet.
    attribution: CPR-administrationen
    source_url: https://www.cpr.dk/cpr-nyt/nyhedsarkiv/2026/okt/omfattende-uautoriseret-adgang-til-borgeres-cpr-oplysninger
  - quote: On the evening of Friday 2 October 2026 the CPR administration became aware that there had been irregular behaviour in the CPR system during September. (translated)
    original: CPR-administrationen blev om aftenen fredag d. 2. oktober 2026 opmærksom på, at der i løbet af september har været en uregelmæssig adfærd i CPR-systemet.
    attribution: Ministry of Research, Education and Digitalisation
    source_url: https://ufm.dk/aktuelt/pressemeddelelser/2026/oktober/omfattende-uautoriseret-adgang-til-borgeres-cpr-oplysninger/
  - quote: A separate announcement by the Danish Data Protection Agency says that the attack involved some form of brute-forcing to enumerate valid CPR numbers, and then extract the related data from each entry.
    attribution: BleepingComputer
    source_url: https://www.bleepingcomputer.com/news/security/denmark-population-registry-data-breach-affects-88-million-people/
  - quote: The case has been reported to Datatilsynet, the Danish Data Protection Agency, which received notification on Sunday and said it could not yet comment on the specifics.
    attribution: IT Security Guru
    source_url: https://www.itsecurityguru.org/2026/10/05/denmarks-cpr-breach-exposes-8-8-million-people-as-experts-warn-over-trusted-third-party-access/
  extended_notes: |-
    Exposure: the weak point is a lawful third-party query channel into a national register, not exposed software. Affected: about 8.8 million persons (about 80 percent of the register), excluding those with name-and-address protection (CPR administration). For any registry or portal operator: which partner or private-sector credentials can query at volume, and what bounds their result set.
    Detection (assessment, not source-stated): per-partner-credential query volume and breadth telemetry compared with the contractually pre-identified subject set; enumerative or sequential identifier lookups in API/application logs. The activity ran from September and was noticed on 2 October, a gap of up to four weeks. No post-patch check applies; the company's access was blocked.
    Defender takeaway (assessment): bind each partner or business account on a citizen register to a registered subject list and cap result-set and rate per client; alert on coverage ratio rather than request rate alone.
    Open questions: whether the company itself was compromised or knowingly misused its access; whether enumeration was involved (BleepingComputer claim); whether other private-sector accessors were also abused.
