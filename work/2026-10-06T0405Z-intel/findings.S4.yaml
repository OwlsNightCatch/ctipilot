  summary: Fakturownia, a Polish cloud invoicing service, states that an unauthorised person accessed its systems from about 2026-09-27 03:20 to 2026-09-28 17:45 and copied a large part of its database to their own servers; the incident touches every account, and the stolen data includes company and user data, bank details, hashed or encrypted passwords, API tokens and integration keys stored in account settings, counterparty data added before 2024-10-16 and invoice content issued before 2021-03-22, with all data for 2022-2026 taken from about 2,250 accounts. Fakturownia rebuilt its servers, rotated API tokens and reported to the Polish data-protection authority, CERT Polska and police on 2026-09-29. VosFactures, the French platform run by Factuali SAS that is approved for the state e-invoicing mandate, told customers that its provider Fakturownia holds some of its data and that an unauthorised person exploited a vulnerability in a mechanism that generates PDF files from invoice templates, which gave access to configuration files on the provider's servers including application keys and credentials, then arbitrary command execution on several application servers and access to a mirror copy of the production database; all VosFactures API codes were invalidated on 2026-10-01. The French state agency AIFE put a banner on Chorus Pro on 2026-10-01 announcing a provisional suspension of exchanges with the platform and later restored them, saying the platform's operational situation and security measures no longer justified the suspension. Zaufana Trzecia Strona reports that the actor calling itself Fingerprint, which it also names for the MyDr and Medyc breaches, contacted it claiming 6 TB of invoices (unverified) and said it used a time-based oracle to extract the Ruby master key, forged a cookie and gained remote code execution; that account differs from the vendor-stated PDF-generation route and is an unverified attacker claim.
