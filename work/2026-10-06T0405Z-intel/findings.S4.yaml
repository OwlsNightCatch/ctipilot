    original: 공격 방식이 신속해서 그런 추정을 하는 거지 에이전트를 직접 본 건 아니니까 확정할 순 없다
    attribution: Piyolog (quoting Korean press)
    source_url: https://piyolog.hatenadiary.jp/entry/2026/10/06/103019
  - quote: The attack was a lookup-and-collect method, not theft through database injection. (translated; Financial Security Institute chief, 2026-10-04)
    original: 攻撃の形態は情報を窃取する方式ではなく照会して集める方式で同じであり、DBへのインジェクションによる窃取ではなかった
    attribution: Piyolog (quoting Korean press)
    source_url: https://piyolog.hatenadiary.jp/entry/2026/10/06/103019
  extended_notes: |-
    Exposure: externally reachable secondary endpoints used by staff, loan recruiters, contractors and partners rather than customers: lookup services built without identity verification, mobile staff apps without access control, sales-support systems, homepages with known flaws, and a Redis weakness at one savings bank (Piyolog's summary of the authorities' three attack types). Some of these systems sat outside the regulator's inspection regime, which focuses on customer-transaction systems. The authorities' advice to tell exposure: inventory every internet-reachable domain, API and remote-access service including test and unused ones; with a test account, change document or user identifiers in requests and confirm other users' data is refused (KISA 2026-10-03).
    Detection: web and API access logs for repeated access to many routes and services, probes for config and backup files, consecutive lookups that change an identifier, and lookups through another path after an access denial; per-account and per-token caps on call count, period and returned records; run short-window and long-horizon accumulation analysis because small repeated lookups add up (all KISA 2026-10-03). Post-incident check: retro-hunt shared attacker addresses against a year of logs; Toss Bank and Hyundai Capital found earlier attempts or attacks only after the Financial Security Institute shared indicators (Piyolog, citing Korean press).
    Defender takeaway: authorisation must be checked server-side per request on every lookup endpoint a partner or staff user can reach, with per-account volume limits, and low-importance internal-facing apps need the same inspection as customer systems. The AI-automation attribution is an authority inference and should not drive the response.
