  summary: 'Between about 2026-09-27 and 2026-09-30 attackers pulled personal data from auxiliary, non-customer-facing systems at several Korean financial institutions: Shinhan Bank disclosed on 2026-10-01 that about 25,000 customers'' loan-application data (names, phone numbers, annual income, borrowing limits, some resident registration numbers) was exposed through a loan-agent application-status service that an unauthorised party accessed by bypassing authentication; KB Kookmin Bank (119 customers, an employee mobile system), Hana Bank (89 customers, a sales-support system), Yegaram Savings Bank (about 40,000 customers; the bank reports a Redis vulnerability) and Hyundai Capital (146 housing-loan agents) followed, and BNK Busan Bank also reported an incident. Authorities describe the common method as query-and-collect rather than database injection: per Korean press compiled by Piyolog, the attacker found valid customer numbers by random input and then queried six services in bulk, rotating source addresses across countries as individual addresses were blocked. The FSC''s 2026-10-02 emergency meeting and the 2026-10-04 sector-wide meeting (with the ICT ministry, privacy regulator, police and KISA) ordered inspection of every externally reachable system, checks for lookup paths that need no authentication, and sharing of attacker IPs; the FSC chair said an AI-assisted attack cannot be ruled out, and police moved to a formal investigation on 2026-10-06. Per Korean press compiled by Piyolog, the Financial Security Institute reports traces of ARTEX AI, a Chinese-language open-source AI penetration-testing framework, on the attacker infrastructure, but its chief says AI use is inferred from the speed of the attack because no agent was observed directly; BleepingComputer notes the authorities have not confirmed ARTEX in the Shinhan breach and that the string links no particular actor. No actor is attributed. BleepingComputer''s figure of 119,000 Kookmin customers conflicts with the bank''s own figure of 119 customers reported by The Korea Times and Bloomberg; the bank''s figure is used here.'
  region_nexus: 'South Korea; no Swiss nexus. Included on the transferable-technique limb: enumeration of valid identifiers against staff-, partner- and contractor-facing lookup endpoints, with authority-published detection signals (KISA 2026-10-03).'
