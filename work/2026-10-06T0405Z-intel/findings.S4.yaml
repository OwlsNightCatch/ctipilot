  summary: The Danish CPR administration states that in September 2026 unauthorised parties abused one private Danish company's lawful search access to the Central Person Register and obtained names, addresses, CPR numbers and further data on about 8.8 million of the register's roughly 11 million records (living, emigrated and deceased persons); people registered with name-and-address protection are excluded. Under section 38 of the CPR Act a private company with a legitimate interest may obtain data on a defined group of persons it has identified individually in advance; a pull covering about 80 percent of the register is therefore far outside any plausible pre-identified customer set (analyst inference from the statute text and the 8.8 million figure, not a statement of the authorities). The CPR administration noticed irregular behaviour in the system during September only on the evening of 2026-10-02, established the scope over the weekend, blocked the company's access, notified Datatilsynet and handed the case to police; the minister ordered a security review of the CPR system. The company is not named, no actor is identified, and the statements do not say whether the company was compromised (credential theft) or its access was knowingly misused. BleepingComputer reports, citing a Datatilsynet announcement it does not link, that the attack involved some form of brute-forcing to enumerate valid CPR numbers; IT Security Guru reports that Datatilsynet only received the notification on Sunday and could not yet comment on specifics, so the enumeration detail is unconfirmed by any primary fetched here. Authorities warn the exposed identity data enables social engineering and ID fraud and remind citizens never to disclose passwords after a call or mail from someone who knows their name, address and CPR number.
  region_nexus: Denmark / Europe; no Swiss data reported affected. Transferable to Swiss registers and portals that give private firms or partners query access; Swiss press (inside-it.ch, Keystone-SDA) carried it on 2026-10-05.
