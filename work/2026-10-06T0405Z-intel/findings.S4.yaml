  summary: 'The Hauts-de-France regional council told AFP on Saturday 2026-10-03 that two of its providers, Atexo (regional aid platform) and Docaposte (the Carte Génération #HDF card platform for high-school students and apprentices), were victims of a cyberattack that allowed unauthorised access to personal data they process for the region; it says the incident is resolved, its internal information system was not touched, it informed ANSSI and filed a complaint. On Monday 2026-10-05 the region''s president told the regional council that up to 515,000 of the 745,000 persons registered on Atexo''s platform had data leaked (names, first names, email addresses, third-party type, entitlements; it is not yet known whether bank details were consulted or extracted) and that about 30,000 beneficiaries and partners of the Docaposte-hosted platform were affected, mostly apprenticeship contracts and bank details. The region says the providers have identified the flaws and the attacker''s method and begun remediation, but no vector is public. FrenchBreaches reports that on 2026-10-03 a forum user using the handle ChimeraZ posted two claims (about 782,000 rows covering about 708,000 persons, including account, support and transaction files, and 48 GB of 90,011 mostly PDF documents from a partner service); these figures are the claimant''s, unconfirmed, and the region has not attributed the attack to anyone. The same handle appears in the store''s French fire-and-rescue data-leak campaign entry.'
