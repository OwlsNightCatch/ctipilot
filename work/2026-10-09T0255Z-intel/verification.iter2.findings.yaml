- code: F3
  category: claim-not-supported
  section: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
  item: "summary, body paragraph 1 and Exposure line (claims acf00cd13f, 5c390d1638, 9a57d7fd26)"
  url_or_quote: "Publica insures about 70,000 active members and 41,600 pensioners of the federal administration and the ETH domain; the data subjects are the staff of the federal administration and the ETH domain that Publica insures, and its pensioners"
  summary: "The cited watson.ch page (and Netzwoche) says 'Sie versichert unter anderem Mitarbeitende der Bundesverwaltung und des ETH-Bereichs. Ende 2025 zählte sie rund 70'000 aktive Versicherte und 41'600 Rentenbeziehende', i.e. Publica insures the federal administration and the ETH domain AMONG OTHERS and the two figures are its end-2025 totals. The entry closes the list to the two groups (and action 1 repeats it), which wrongly scopes out other affiliated employers. Add 'among others' and the end-2025 as-of date."
- code: F3
  category: claim-not-supported
  section: 2026-10-09/aa26-281a-integrity-tech-microscan-exchange-mail-theft
  item: "(low confidence) Apache S2-032 citation date (claim 6a4a1275e0; sources[] date)"
  url_or_quote: "[Apache Struts, 2020-03-02](https://cwiki.apache.org/confluence/display/WW/S2-032); sources[].date: 2020-03-02"
  summary: "The live page's only visible dateline reads 'modified on Feb 13, 2021' (Confluence last-modified marker) and the bulletin concerns CVE-2016-3081; 2020-03-02 appears nowhere on the page. The citation date matches neither the page's dateline nor the advisory's age. Use the page's own visible date or state the bulletin as undated."
- code: F3
  category: claim-not-supported
  section: 2026-10-09/aa26-281a-integrity-tech-microscan-exchange-mail-theft
  item: "(low confidence) MicroScan description (claim 838b08a01f)"
  url_or_quote: "MicroScan, more than 1,300 Python scripts in use since at least 2017"
  summary: "AA26-281A: 'a malicious application known as MicroScan. This Python-based web application contains over 1,300 penetration testing scripts'. The advisory says the application is Python-based, not that the scripts are Python. Reword to 'a Python-based web application holding more than 1,300 scripts'."
- code: F14
  category: quantifier-without-source
  section: 2026-10-09/aa26-281a-integrity-tech-microscan-exchange-mail-theft
  item: "(low confidence) victims sentence (claim 5f605e0dca)"
  url_or_quote: "Victims include U.S. government services, other critical sectors and organisations in Southeast Asia, Africa and North America; none is Swiss"
  summary: "The cited advisory lists victim sectors and the regions 'Southeast Asia, Africa, and North America' but does not say that no victim is Swiss, and the DOJ release lists Polish airports among MicroScan scanning targets. The absolute 'none is Swiss' is the pipeline's own inference; say 'the advisory names no Swiss victim'."
- code: F9
  category: surface-contradiction
  section: 2026-10-09/aa26-281a-integrity-tech-microscan-exchange-mail-theft
  item: "(low confidence) cves[CVE-2023-22894].auth (claim 0571505d17)"
  url_or_quote: "auth: admin-required (cves[CVE-2023-22894])"
  summary: "CISA KEV says the flaw 'could allow attackers with access to the admin panel to discover sensitive user details via the query filter', but the Strapi disclosure the entry now cites for the fix gives 'CVSS v3.1 Vector: AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H' for CVE-2023-22894 (privileges required: none). The entry silently picks the KEV reading; add a Contradiction line or align auth with the per-CVE vendor source."
