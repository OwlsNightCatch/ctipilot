    surface: "body"
    kind: derived
    text: "**Detection:** application job definitions, execution and step history, exceptions and exit descriptions are the record that outlasted the attacker's deleted files, so retain them beside web, database and endpoint logs and hunt for unusual job volume or sequencing together with unexpected script-engine use and output returned through error messages; Nashorn errors were almost absent from the baseline history and tracked the malicious jobs."
