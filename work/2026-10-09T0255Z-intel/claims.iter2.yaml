    surface: "body"
    kind: cited
    text: "**Defender takeaway:** require authentication on every exposed job-management endpoint, keep database credentials out of application configuration files and give the service account only the rights it needs, and scope an incident of this kind from the application's job records rather than from what survives on disk; a leftover local administrator account is part of the check, since one of the two created here was left in place ("
