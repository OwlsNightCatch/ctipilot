  - claim_id: 8c825ffdc9
    entry: 2026-10-09/reliaquest-llm-agents-spring-batch-tomcat-nashorn-system
    surface: "summary"
    kind: frontmatter
    text: "ReliaQuest assesses with high confidence that LLM-driven agents carried out substantial parts of an intrusion it investigated, using only known techniques: an internet-facing Apache Tomcat application accepted Spring Batch job definitions without a login, jobs ran JavaScript through the Nashorn engine inside the application process, plaintext SQL Server sysadmin credentials from the application's configuration led to xp_cmdshell, and two public privilege-escalation tools reached SYSTEM. ReliaQuest names no victim, sector or region, nor the vendor of the exposed application, and could not determine how many agents ran, which model drove them or how much a person approved."
  - claim_id: b46e34b12e
    entry: 2026-10-09/reliaquest-llm-agents-spring-batch-tomcat-nashorn-system
    surface: "body"
    kind: cited
    text: "ReliaQuest says the attacker needed no zero-day and no new malware: an internet-facing Apache Tomcat application used Spring Batch, in which a task definition names the code to run, and accepted and ran task descriptions without a login ("
    urls: ["https://reliaquest.com/blog/threat-spotlight-how-ai-agents-turned-one-exposed-endpoint-into-a-server-takeover/"]
  - claim_id: db98c833d1
    entry: 2026-10-09/reliaquest-llm-agents-spring-batch-tomcat-nashorn-system
    surface: "body"
    kind: cited
    text: "The decisive step was submitting tasks that invoked Nashorn, the JavaScript engine in the application's Java environment, so the code ran inside the application with its account privileges and created no child process until a shell was spawned later; results came back through deliberately triggered error messages, in fixed 1,800-byte chunks reassembled over hundreds of requests ("
    urls: ["https://reliaquest.com/blog/threat-spotlight-how-ai-agents-turned-one-exposed-endpoint-into-a-server-takeover/"]
  - claim_id: f7bb04a6b5
    entry: 2026-10-09/reliaquest-llm-agents-spring-batch-tomcat-nashorn-system
    surface: "body"
    kind: cited
    text: "The application's configuration files held plaintext credentials with SQL Server sysadmin rights; the attacker enabled xp_cmdshell, found SeImpersonatePrivilege, uploaded PrintSpoofer and GodPotato in base64 fragments through the same channel and reached SYSTEM when the first tool failed on file permissions and the second worked ("
    urls: ["https://reliaquest.com/blog/threat-spotlight-how-ai-agents-turned-one-exposed-endpoint-into-a-server-takeover/"]
