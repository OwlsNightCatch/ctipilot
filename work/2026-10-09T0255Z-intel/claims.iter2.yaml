claims:
  - claim_id: c4d7805109
    entry: 2026-09-21/tradertraitor-terraform-lockfile-nostr-dead-drop
    surface: "summary"
    kind: frontmatter
    text: "SentinelLabs found the FLATROOF and ROOFDECK macOS backdoors, first documented in April 2026's USD 292 million LayerZero/KelpDAO cryptocurrency theft, on an unrelated victim: a small India-based IT-services provider with no cryptocurrency ties. The campaign's fake job-interview GitHub repositories carry weaponized Terraform provider lockfiles that redirect `terraform init` to attacker-controlled provider registries, though SentinelLabs cannot prove how this victim's backdoors were delivered. Zscaler ThreatLabz independently reports a July 2026 trojanized Terraform provider binary that runs malicious code as soon as Terraform loads it and delivers the same two families on macOS, Linux and Windows, which it suspects is TraderTraitor. The second-stage backdoor resolves its command-and-control address by reading an operator profile's public \"website\" field from the Nostr decentralized relay network."
  - claim_id: 8f88e6cbc3
    entry: 2026-09-21/tradertraitor-terraform-lockfile-nostr-dead-drop
    surface: "body"
    kind: cited
    text: "SentinelLabs hunted its telemetry for the FLATROOF (also known as macOS.Gaslight) and ROOFDECK macOS backdoors first disclosed in April 2026's USD 292 million LayerZero/KelpDAO cryptocurrency theft, and found an unrelated victim carrying the same implants: a small India-based IT-services provider with no cryptocurrency exposure, compromised through a single Apple Silicon MacBook belonging to a DevOps engineer ("
    urls: ["https://www.sentinelone.com/labs/dont-call-us-well-call-your-apis-tradertraitor-backdoors-resurface-on-victim-with-no-crypto-ties/"]
  - claim_id: dacadf42c0
    entry: 2026-09-21/tradertraitor-terraform-lockfile-nostr-dead-drop
    surface: "body"
    kind: cited
    text: "SentinelLabs cannot prove how this victim's backdoors were delivered: both were on disk by March 18, and the victim cloned a lure repository only on April 13 ("
    urls: ["https://www.sentinelone.com/labs/dont-call-us-well-call-your-apis-tradertraitor-backdoors-resurface-on-victim-with-no-crypto-ties/"]
  - claim_id: 0883e0f26d
    entry: 2026-09-21/tradertraitor-terraform-lockfile-nostr-dead-drop
    surface: "body"
    kind: cited
    text: "A third stage later replaced both original implants and beaconed intermittently to a separate C2 until 2026-06-01, the last beacon in SentinelLabs' collected telemetry ("
    urls: ["https://www.sentinelone.com/labs/dont-call-us-well-call-your-apis-tradertraitor-backdoors-resurface-on-victim-with-no-crypto-ties/"]
  - claim_id: 2a5db7e6de
    entry: 2026-09-21/tradertraitor-terraform-lockfile-nostr-dead-drop
    surface: "body"
    kind: cited
    text: "A provider binary can also be trojanized itself, so restrict untrusted Terraform providers and verify provider checksums ("
    urls: ["https://www.zscaler.com/blogs/security-research/suspected-tradertraitor-group-uses-trojanized-terraform-provider-deliver"]
  - claim_id: f9f296726b
    entry: 2026-09-21/tradertraitor-terraform-lockfile-nostr-dead-drop
    surface: "body"
    kind: uncited
    text: "The lure follows DPRK's established \"Contagious Interview\" pattern: fake job-interview GitHub repositories themed as infrastructure-engineering coding challenges each carry a weaponized `.terraform.lock.hcl` pointing to a typosquatted, attacker-controlled Terraform provider registry impersonating HashiCorp's own naming."
  - claim_id: fdbd61e343
    entry: 2026-09-21/tradertraitor-terraform-lockfile-nostr-dead-drop
    surface: "body"
    kind: uncited
    text: "Because Terraform treats the lockfile's declared provider source as authoritative, running `terraform init` against the poisoned lockfile causes Terraform itself to download and execute the attacker's provider module in place of the genuine HashiCorp one."
  - claim_id: e38f86b643
    entry: 2026-09-21/tradertraitor-terraform-lockfile-nostr-dead-drop
    surface: "body"
    kind: uncited
    text: "On the victim host, both backdoors sat dormant on disk from March 18 to March 29, 2026, then launched the moment the developer opened a specific Cursor IDE workspace: the Cursor process itself spawned both implants directly, which began beaconing to their command-and-control servers within two seconds, before FLATROOF stripped the macOS quarantine attribute from ROOFDECK and set its executable bit moments later, a Gatekeeper bypass."
  - claim_id: 560fa6b051
    entry: 2026-09-21/tradertraitor-terraform-lockfile-nostr-dead-drop
    surface: "body"
    kind: uncited
    text: "FLATROOF is a Rust ARM64 backdoor supporting shell, kill, upload and stop commands, paired with a Python data-harvesting module that pulls Chrome/Brave/Firefox/Safari data, Terminal history, installed-application lists, `ps aux` output, `system_profiler` output and a raw copy of `login.keychain-db`, exfiltrated via a hardcoded Telegram bot."
  - claim_id: 13663f0625
    entry: 2026-09-21/tradertraitor-terraform-lockfile-nostr-dead-drop
    surface: "body"
    kind: uncited
    text: "ROOFDECK is the more capable second-stage implant: on first run it queries a public Nostr relay-status API plus a hardcoded relay list, searches Nostr relays for an operator profile matching a configured public key, and reads that profile's \"website\" field as its live command-and-control URL, a decentralized dead-drop resolver that survives takedown of any single C2 domain."
  - claim_id: 43cedd7bee
    entry: 2026-09-21/tradertraitor-terraform-lockfile-nostr-dead-drop
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** any organization whose engineering staff use Terraform or other HashiCorp tooling and could plausibly be approached through fake technical-recruiting outreach should treat an unfamiliar or newly-cloned repository's lockfile as untrusted input: check the source registry a lockfile's providers resolve to before running `terraform init`, since a lockfile can silently redirect a trusted command to attacker infrastructure."
  - claim_id: 8ef1a2bc09
    entry: 2026-09-21/tradertraitor-terraform-lockfile-nostr-dead-drop
    surface: "body"
    kind: derived
    text: "Any macOS fleet should alert on `xattr -rd com.apple.quarantine` combined with a `chmod +x` on the same file in immediate succession, and on outbound connections to Nostr relay infrastructure from a host with no legitimate reason to run a Nostr client."
  - claim_id: 71e80b1691
    entry: 2026-09-21/tradertraitor-terraform-lockfile-nostr-dead-drop
    surface: "body"
    kind: derived
    text: "**Triage:** developers legitimately run `terraform init` against new or unfamiliar repositories constantly, so the command itself is not the signal: the discriminator is the lockfile's declared provider source pointing to a domain that is not `registry.terraform.io` or a known private registry the organization operates."
  - claim_id: 8e0c7b826e
    entry: 2026-09-21/tradertraitor-terraform-lockfile-nostr-dead-drop
    surface: "section 2026-10-09T03:54:00Z"
    kind: cited
    text: "Zscaler ThreatLabz reports a July 2026 campaign that it suspects is TraderTraitor, citing substantial overlap in tactics and targeting but no code, infrastructure or cryptographic links sufficient for attribution with high confidence, in which a Go-built Terraform provider that poses as an AWS provider executes malicious code the moment Terraform loads the plugin: it writes a run-once marker in the temporary directory, downloads a Bash loader from a lookalike of a HashiCorp domain, starts it through a detached `sh -c` child and keeps behaving like a normal provider ("
    urls: ["https://www.zscaler.com/blogs/security-research/suspected-tradertraitor-group-uses-trojanized-terraform-provider-deliver"]
  - claim_id: 3b993a569f
    entry: 2026-09-21/tradertraitor-terraform-lockfile-nostr-dead-drop
    surface: "section 2026-10-09T03:54:00Z"
    kind: cited
    text: "The loader runs on macOS, Linux and Windows with a Unix-like shell, picks a payload by operating system and CPU architecture and recovers an encrypted executable appended after a marker in a file named like a web font; on macOS it removes the quarantine attribute and applies an ad-hoc signature ("
    urls: ["https://www.zscaler.com/blogs/security-research/suspected-tradertraitor-group-uses-trojanized-terraform-provider-deliver"]
  - claim_id: 03ba8cd2fb
    entry: 2026-09-21/tradertraitor-terraform-lockfile-nostr-dead-drop
    surface: "section 2026-10-09T03:54:00Z"
    kind: cited
    text: "The delivered FLATROOF is a Rust backdoor with Telegram Bot API, GitHub-polling and HTTP-webhook command channels, persistence as a service on Linux, a `zlogout` entry on macOS and a registry entry on Windows, and Python stealers for browser data, cookies, keychain or Credential Manager entries, shell history and wallet-extension data; it drops ROOFDECK, which finds its server through a local configuration, an RSA-signed Pastebin dead drop and then Nostr profile metadata ("
    urls: ["https://www.zscaler.com/blogs/security-research/suspected-tradertraitor-group-uses-trojanized-terraform-provider-deliver"]
  - claim_id: 8dbb72f1aa
    entry: 2026-09-21/tradertraitor-terraform-lockfile-nostr-dead-drop
    surface: "section 2026-10-09T03:54:00Z"
    kind: cited
    text: "Zscaler does not know how the provider reached the victim, and notes that SentinelLabs independently reported related activity with weaponized Terraform projects ("
    urls: ["https://www.zscaler.com/blogs/security-research/suspected-tradertraitor-group-uses-trojanized-terraform-provider-deliver"]
  - claim_id: 17b34242a0
    entry: 2026-09-21/tradertraitor-terraform-lockfile-nostr-dead-drop
    surface: "section 2026-10-09T03:54:00Z"
    kind: cited
    text: "The telemetry that follows from the provider path is the Terraform provider plugin process making an HTTPS download from a host that is not the Terraform registry, writing a script to the temporary directory and starting it through `sh -c`; Zscaler advises restricting untrusted Terraform providers, verifying provider checksums and monitoring unexpected process activity ("
    urls: ["https://www.zscaler.com/blogs/security-research/suspected-tradertraitor-group-uses-trojanized-terraform-provider-deliver"]
  - claim_id: 7138b3e0d7
    entry: 2026-09-21/tradertraitor-terraform-lockfile-nostr-dead-drop
    surface: "record 2026-10-09T03:54:00Z"
    kind: record-summary
    text: "Zscaler ThreatLabz (2026-10-08) independently reports a July 2026 trojanized Terraform provider binary that executes at plugin load and delivers FLATROOF and ROOFDECK on macOS, Linux and Windows, with Telegram, GitHub and webhook command channels and a signed Pastebin dead drop alongside the Nostr fallback; the Terraform delivery path now has a second form, and the malware family a second publisher."
  - claim_id: 69291a0a21
    entry: 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev
    surface: "summary"
    kind: frontmatter
    text: "Citrix's CTX697096 bulletin (2026-09-27) fixes eight NetScaler ADC/Gateway flaws, two of which, CVE-2026-88771 (unauthenticated command execution, every default deployment) and CVE-2026-88772 (memory overflow to RCE/DoS, reachable wherever DTLS is enabled, the VPN-vServer default), were already being exploited in the wild before any fix existed. CISA added both to KEV the same day; Citrix lists no workaround. Google's Mandiant and GTIG report a campaign running since at least early September that leaves web-server-configuration persistence on compromised appliances, so an appliance patched after the bulletin still needs a compromise check. Unit 42 telemetry adds version fingerprinting from 2026-08-21, web shells dropped as .deb packages from 2026-09-04 and a log-poisoning chain with concrete log artifacts to hunt. A separate Citrix bulletin of 2026-10-03 adds CVE-2026-88779, a SAML-triggered flaw these builds do not fix: SAML-configured appliances must move to 14.1-73.41 or 13.1-64.28, and a bulletin of 2026-10-08 adds CVE-2026-107406 for the same SAML configurations, so identity-provider appliances need 14.1-73.46 or 13.1-64.29."
  - claim_id: b23655d6a1
    entry: 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev
    surface: "immediate_action"
    kind: frontmatter
    text: "Patch every internet-facing NetScaler ADC/Gateway now and check for pre-patch compromise: Citrix confirms CVE-2026-88771 and CVE-2026-88772 are being exploited against unmitigated NetScaler ADC and NetScaler Gateway appliances right now, and Google's Mandiant reports exploitation since at least early September. CVE-2026-88771 requires no configuration at all: every default deployment is reachable by an unauthenticated attacker; CVE-2026-88772 is reachable wherever DTLS is enabled, which Citrix states is the default on any VPN virtual server. Citrix lists no workaround, and Mandiant's interim network controls (disable DTLS where it is not needed, block inbound UDP/443 upstream) cover CVE-2026-88772 only. Capture forensic evidence (logs, an instance snapshot where the appliance is virtual, a support bundle, a core dump) from each exposed appliance before patching, since the upgrade itself can destroy evidence of prior compromise, then upgrade to 14.1-73.37+ or 13.1-64.23+ (run `show ns variable` first on 13.1; if it returns any variables, install 13.1-64.24 instead to avoid a known reboot loop), going straight to 14.1-73.41+ or 13.1-64.28+ where the appliance is configured as a SAML service provider or identity provider (CVE-2026-88779), and to 14.1-73.46+ or 13.1-64.29+ where it is an identity provider (CVE-2026-107406), and run a compromise assessment on every appliance that was internet-facing."
