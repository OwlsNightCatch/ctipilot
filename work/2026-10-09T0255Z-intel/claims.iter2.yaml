    text: "Talos: malware tells the analysing LLM to skip it; the text is plain and therefore detectable"
  - claim_id: 9e0fef8e63
    entry: 2026-10-09/talos-ai-analysis-evasion-instructions-aimed-at-llm-triage
    surface: "summary"
    kind: frontmatter
    text: "Cisco Talos documents 84 samples from four malware families, collected from January 2025 to July 2026, that embed plain natural-language text meant to steer the LLM stage of automated triage: a verbatim \"no need to analyze this file\" comment reused by at least four actors, templated variants, instructions repeated across seven chat-template formats, and intimidation or fabricated-authority text. ESET separately found UAC-0099 using a decoy request in a script comment to trip an LLM scanner's refusal; Talos' own test of five local models put the best techniques at steering the outcome in the attacker's favour in about 35% of runs, and its advice is to treat text inside a sample as evidence, never as instruction."
  - claim_id: 0bb0602b16
    entry: 2026-10-09/talos-ai-analysis-evasion-instructions-aimed-at-llm-triage
    surface: "body"
    kind: cited
    text: "Talos calls the class \"AI-analysis evasion\": malware that embeds natural-language instructions to influence automated analysis, aimed at the layer above packers and anti-debug checks, the pipeline that extracts text from a sample and submits it to a language model for triage, classification or reverse-engineering help ("
    urls: ["https://blog.talosintelligence.com/ignore-all-instructions-and-read-this-blog-the-state-of-ai-analysis-evasion-in-malware/"]
  - claim_id: db80fd95fa
    entry: 2026-10-09/talos-ai-analysis-evasion-instructions-aimed-at-llm-triage
    surface: "body"
    kind: cited
    text: "It traces four families and 84 samples collected from January 2025 to July 2026: a PowerShell reverse shell (FRUITSHELL) carrying a two-line comment that says there is no need to analyze the file, a comment later reused verbatim in nine further scripts from at least four actors, among them a script set that adds an AMSI bypass and runtime compilation ("
    urls: ["https://blog.talosintelligence.com/ignore-all-instructions-and-read-this-blog-the-state-of-ai-analysis-evasion-in-malware/"]
  - claim_id: f9f38fcc80
    entry: 2026-10-09/talos-ai-analysis-evasion-instructions-aimed-at-llm-triage
    surface: "body"
    kind: cited
    text: "PLOTSAFE generates the sentence from a template and keeps it alive in Go builds with a dummy function that references the strings; HOLLOWCLAD repeats one refusal instruction across seven LLM chat-template formats so one copy may match the scanner's own template, and adds fake honeypot and licence warnings; MANTLEMAZE claims invented government contracts and certifications ("
    urls: ["https://blog.talosintelligence.com/ignore-all-instructions-and-read-this-blog-the-state-of-ai-analysis-evasion-in-malware/"]
  - claim_id: 9f768ec7d1
    entry: 2026-10-09/talos-ai-analysis-evasion-instructions-aimed-at-llm-triage
    surface: "body"
    kind: cited
    text: "ESET found the technique in the hands of a named group: the Russia-aligned UAC-0099 put a decoy request for guidance on building a nuclear weapon into the comment of a VBScript, aiming to trip the safety guardrails of an LLM-powered code scanner so it stops before the malicious code that downloads the MATCHBOIL loader ("
    urls: ["https://www.welivesecurity.com/en/business-security/guardbreaker-derailing-ai-assisted-malware-analysis-code-comment/"]
  - claim_id: dcf159b15d
    entry: 2026-10-09/talos-ai-analysis-evasion-instructions-aimed-at-llm-triage
    surface: "body"
    kind: cited
    text: "Talos tested the strings against five local models, 135 matched pairs per string: its headline figure is that the best techniques steered the outcome in the attacker's favour in about 35% of runs, a net rate (pairs shifted toward benign minus pairs shifted toward malicious, over all pairs), while the cheapest technique, a direct instruction to ignore the sample, worked almost universally and the more complex ones had little effect or backfired by making models more suspicious; Talos calls the overall impact a mixed bag ("
    urls: ["https://blog.talosintelligence.com/ignore-all-instructions-and-read-this-blog-the-state-of-ai-analysis-evasion-in-malware/"]
  - claim_id: 4e4c260fd8
