  item: "2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow (headline, summary)"
  url_or_quote: "Federal pension fund Publica's software supplier was breached; data outflow assumed, scope and actor not public"
  summary: "(low confidence) The Confederation release the entry lists as its first primary is headlined 'Cyberangriff auf Softwarelieferant von Publica: Datenabfluss bestätigt' and says 'Publica informierte die versicherten Personen über den Datenabfluss'; PK Softech says 'muss davon ausgegangen werden'; Publica's spokesperson (watson, Netzwoche) says whether and which data left is 'noch unklar'. The entry relays the supplier's and Publica's hedges but never mentions that the federal release itself says confirmed. Every statement is attributed and none overstates a source, so advisory only; one clause would close it."
