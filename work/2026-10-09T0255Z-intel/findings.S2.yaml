- title: 'Fox-IT (NCC Group) releases its eight-year Cobalt Strike Beacon Corpus: Team Servers live a median 14 days, beacon staging is increasingly
    switched off, and DNS beacons decline far less than HTTP(S)'
  sources:
  - url: https://www.nccgroup.com/research/mining-data-from-cobalt-strike-beacons-part-2-releasing-the-full-corpus
    publisher: NCC Group (Fox-IT)
    date: '2026-10-06'
    role: primary
  discovery_trace: 'first seen at: ncc-research, URL https://www.nccgroup.com/research-blog/ (raw listing via `url`; link /research/mining-data-from-cobalt-strike-beacons-part-2-releasing-the-full-corpus/)
    -> primary: NCC Group post, URL https://www.nccgroup.com/research/mining-data-from-cobalt-strike-beacons-part-2-releasing-the-full-corpus
    (read via extract; frontmatter date 2026-10-06; in the record''s 96 h lookback, not in the 25 h window)'
  summary: 'FACTS (NCC Group / Fox-IT''s own data). Fox-IT published the full Cobalt Strike Beacon Corpus on Hugging Face as two Parquet files:
    beacons.parquet (parsed configurations and sighting metadata) and payloads.parquet (raw beacon payloads, wrapped in CaRT so they are inert
    until unpacked), collected from internet-facing Team Servers between 2018 and 2026 by fingerprinting likely servers and requesting a beacon
    with a checksum8-valid URI (HTTP/HTTPS) or by TXT lookups to the Team Server''s DNS listener; parsing uses the dissect.cobaltstrike library,
    which Fox-IT hardened so config scanning no longer depends on field order after operators reshuffled configuration layouts. Findings Fox-IT
    states: the median Team Server was reachable for 14 days (35 percent seen on a single day, 14 percent still serving after three months, 2
    percent after a year); the share of fingerprinted servers that hand out a beacon fell from about 40 percent in 2023 to 20 to 25 percent in
    2026, most likely because operators disable staging (the host_stage option in the Malleable C2 profile), so public beacon collection sees
    a shrinking part of the landscape; DNS beacons declined far less steeply than HTTP(S) ones (roughly 80 to 140 a month since 2024) possibly
    because they get less attention in public research and OPSEC advice; version 4.9 has led since 2024; 128 beacons (0.23 percent) do not parse
    and are custom-modified or not Cobalt Strike at all (some are Meterpreter). Fox-IT cautions that the corpus includes legitimate red-team servers
    and that stale IPs and domains must not be treated as indicators. Defender reading (INFERENCE, not Fox-IT''s wording): short server lifetimes
    mean network indicators age out in days, so detection should rest on beacon behaviour and configuration features rather than addresses, and
    DNS beacon traffic deserves the same hunting attention as HTTP(S). This is a research dataset, not a campaign report: no victim, actor or
    sector is named.'
  region_nexus: global; no Swiss nexus
  primary_sector_nexus: 'indirect: detection engineering and threat hunting for any SOC'
