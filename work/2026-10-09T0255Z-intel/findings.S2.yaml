      failures, cutting off Internet access for your users
    attribution: ICANN
    source_url: https://www.icann.org/en/blogs/details/preparing-for-the-root-zone-ksk-rollover-what-you-need-to-know-27-07-2026-en
  - quote: System administrators must manually verify their configurations rather than assume automatic updates worked.
    attribution: ICANN
    source_url: https://www.icann.org/en/blogs/details/preparing-for-the-root-zone-ksk-rollover-what-you-need-to-know-27-07-2026-en
  - quote: The key to look for is Key Tag 38696.
    attribution: ICANN
    source_url: https://www.icann.org/en/blogs/details/preparing-for-the-root-zone-ksk-rollover-what-you-need-to-know-27-07-2026-en
  - quote: Operators running validating recursive resolvers, particularly those with manually configured trust anchors or older software, are
      encouraged to review their systems and verify readiness for the rollover.
    attribution: ICANN
    source_url: https://www.icann.org/resources/press-material/release-2026-05-20-en
  extended_notes: 'Detection is an inventory-and-config check, not a telemetry hunt: list every validating recursive resolver (including embedded
    ones in appliances, containers and DoH-capable software), read its root trust anchor for key tag 38696, and after 11 October watch resolver
    SERVFAIL rates and DNS-dependent service alarms; ICANN''s published fallback is to disable validation temporarily or add a negative trust
    anchor for the root.'
