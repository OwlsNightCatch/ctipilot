  summary: 'FACTS (attributed). Sweden: IMY decided on 22 September 2026 to fine the IT systems supplier Miljödata SEK 1.8 million (about EUR
    160,000) under Article 32(1) GDPR for negligence in the August 2025 breach that affected 2.2 million people according to the company; the
    data included personal identity numbers, contact details and sensitive data on sick leave, rehabilitation and school incidents, and the customers
    hit included a majority of Sweden''s municipalities, several regions and government agencies. IMY''s stated findings are that the company
    did not perform sufficient checks when installing new software and had no automated real-time monitoring of its systems to detect intrusions
    and suspicious activity; IMY has also opened reviews of two municipalities and one region over the same attack. Greece: the Hellenic DPA decided
    on 28 July 2026 on the March 2025 breach of E.E.T.A.A. (the agency running programmes for the Ministry of Social Cohesion and Family Affairs).
    The EDPB summary says the attack succeeded in connection with E.E.T.A.A.''s continued use of outdated information systems and inadequate security
    despite awareness of the risks, found infringements of the security-of-processing rules and deficiencies in the Article 28 controller-processor
    arrangement, fined the Ministry (the controller) EUR 200,000 and E.E.T.A.A. (the processor) EUR 150,000 and ordered both to conclude a data
    processing agreement and implement the planned security measures; the Ministry was found to have met its breach-notification duties yet was
    still fined. The EDPB pages republish national decisions as the authorities published them. Why it is returned: both cases are the supplier-to-public-administration
    breach pattern that PK Softech/Publica, Xplain and Concevis show in Switzerland, and they state what regulators treat as the failing controls
    (software-installation checks, real-time intrusion monitoring, current systems, a written processor agreement) and that the public controller
    is fined alongside its supplier. GDPR does not bind Swiss federal, cantonal or communal bodies directly (the revised DSG and ISG apply); the
    transfer is by analogy, which is why this is borderline.'
  region_nexus: EU (Sweden, Greece); Swiss public bodies are subject to the revised DSG, not GDPR, so applicability is by analogy
