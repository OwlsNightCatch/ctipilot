  summary: 'FACTS (attributed). The Confederation''s release of 2026-10-08, issued for the Swiss Federal Pension Fund Publica, states that an
    external software supplier of Publica detected a cyberattack at the end of September, immediately filed a criminal complaint and informed
    the relevant federal offices, Publica and further customers; the Federal Prosecutor''s Office has opened an investigation; no other federal
    office has a business relationship with the company; the company and federal offices are still working out which Publica data are affected,
    and Publica has informed its insured persons. The supplier''s own notice of the same day names the company: PK Softech AG of Reinach (BL),
    a developer of pension-fund administration software. PK Softech says unknown persons used malware to gain access to part of its IT infrastructure,
    that it took the affected environment off the network, engaged external specialists, informed the authorities and filed a criminal complaint,
    that ''it must be assumed'' data left its systems (type and scope under investigation), that it informed its customers, and that it has been
    fully available to customers again since 2 October 2026. WHAT IS AND IS NOT KNOWN. The federal release is headlined ''data outflow confirmed'',
    but both Watson and Netzwoche report that whether and which Publica data is actually in the stolen set is still unclear. Publica''s spokesperson
    told AWP that confidential personal data may be affected (pay figures, retirement assets, pension amounts, contact details); Watson, which
    holds the member letter, lists the data that ''could have been stolen'' as name, date of birth, AHV number, address, business and private
    telephone numbers and e-mail addresses, pension data (salary, insured earnings, retirement assets) and spouse or partner details. Publica
    states that members'' retirement assets are safe, pensions are paid as usual and operations are unaffected, and asks members to be especially
    attentive to unusual e-mails, calls or messages because misuse of leaked data cannot be ruled out; active members were told by newsletter
    on 8 October, pensioners are being written to, and a contact point for suspicious activity exists. SCALE. Publica insures staff of the federal
    administration and the ETH domain: about 70,000 active insured and 41,600 pensioners at the end of 2025 (Watson, Netzwoche, Inside IT citing
    the 2025 annual report). Inside IT reports PK Softech has supplied Publica''s insured-persons and pensioners administration system since 2017
    (CHF 12.6 million award, up to 16 years including options). NOT PUBLIC: the intrusion vector, the actor, whether a ransom was demanded or
    a leak-site claim exists (Publica declined to say, citing the investigation), and the other customers affected. Watson''s own inference that
    the known facts point to a ransomware gang is explicitly unconfirmed; no source names a group. No leak-site listing for PK Softech was found
    by this agent (ransomware.live recent-cyberattack feed lists the incident from the press only).'
  region_nexus: 'Switzerland: federal level (Confederation-owned pension fund; staff of the federal administration and ETH domain are the data
