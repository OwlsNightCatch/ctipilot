  extended_notes: 'Exposure (source-stated): insured persons and pensioners of Publica (federal administration, ETH domain, affiliated organisations);
    other PK Softech customers were informed by the supplier but are not named and the supplier''s customer list is not public. Detection / defender
    angle (INFERENCE from the stated misuse risk, not source-stated detail): the realistic follow-on is targeted phishing, vishing or helpdesk
    social engineering that quotes accurate personal data (AHV number, birth date, salary, private contact details) of federal and ETH-domain
    staff; the telemetry classes are mail-gateway and telephony records for lures referencing pension or salary matters, and identity-verification
    steps at HR, payroll and IT helpdesks. Publica''s own advice is only to be attentive to unusual e-mails, calls or messages. A do-now candidate
    for `actions[]` (composer to hold to the do-now bar): tell federal and ETH-domain helpdesk, HR and payroll teams that AHV number, date of
    birth and salary figures may now be known to criminals and must not serve as proof of identity. Contrast with the held Beyond Gravity backlog
    row: here the Confederation itself confirms data outflow touching a named affected population and a named federal investigation, so the ''no
    behaviour public'' floor argument does not apply; the open gaps (vector, actor, scope) belong in the entry''s unknowns. Prior art in the store:
    Xplain (2023) and Concevis (2023) are the same supplier-to-administration pattern in Switzerland; the Miljödata item below is the regulator''s
    view of the same pattern.'
- title: 'DNSSEC root KSK rollover on 11 October 2026: from that date the root zone is signed only with KSK-2024 (key tag 38696), and validating
    resolvers that lack the key fail all DNSSEC-validated lookups'
  sources:
  - url: https://www.icann.org/en/blogs/details/preparing-for-the-root-zone-ksk-rollover-what-you-need-to-know-27-07-2026-en
    publisher: ICANN
    date: '2026-07-27'
    role: primary
  - url: https://www.icann.org/resources/press-material/release-2026-05-20-en
    publisher: ICANN
    date: '2026-05-20'
    role: primary
  - url: https://blog.verisign.com/security/2024-2026-root-zone-ksk-rollover-updates-observations/
    publisher: Verisign (with ICANN)
    date: '2026-07-28'
    role: corroborating
  - url: https://www.it-connect.fr/dnssec-roulement-ksk-racine-dns-verifier-resolveur/
    publisher: IT-Connect
    date: '2026-10-07'
    role: corroborating
  discovery_trace: 'first seen at: it-connect, URL https://www.it-connect.fr/feed/ (feed item ''DNSSEC : la clé principale du DNS change le 11
    octobre'', 2026-10-07T15:29Z) -> pivot: IT-Connect article via extract https://www.it-connect.fr/dnssec-roulement-ksk-racine-dns-verifier-resolveur/
    (links the ICANN blog and press release) -> primary: ICANN blog, URL https://www.icann.org/en/blogs/details/preparing-for-the-root-zone-ksk-rollover-what-you-need-to-know-27-07-2026-en;
    primary: ICANN press release, URL https://www.icann.org/resources/press-material/release-2026-05-20-en -> corroborating: Verisign blog, URL
    https://blog.verisign.com/security/2024-2026-root-zone-ksk-rollover-updates-observations/ (found through WebSearch ''DNSSEC root KSK-2024
    rollover 11 October 2026 resolver trust anchor Key Tag 38696'')'
  summary: 'FACTS (ICANN). On 11 October 2026 the DNS root zone begins to be signed only with the new root Key Signing Key KSK-2024 (key tag 38696);
    the old KSK-2017 (key tag 20326 per IT-Connect) is retired in January 2027 according to ICANN''s press release. The new key has been published
    in the root zone since 11 January 2025 and RFC 5011 automatic trust-anchor updates should have delivered it to most resolvers: ICANN reports
    that more than 95 percent of reporting resolvers recognise KSK-2024, a figure that covers only resolvers that report. Who is affected: operators
    of their own DNSSEC-validating recursive resolvers, above all those with manually configured trust anchors or old software; users of an ISP
    or public resolver depend on that operator. ICANN''s statement of the consequence: a validating resolver without KSK-2024 will fail all validated
    resolution (''total DNS resolution failures''), and it tells administrators not to assume automatic updates worked but to check the trust-anchor
    file (bind.keys for BIND, root.key for Unbound and PowerDNS Recursor, root.keys for Knot Resolver) for key tag 38696 and, if absent, to verify
    that automatic updates are enabled and the resolver can write its key storage. IT-Connect''s reading adds platform specifics that are its
    own, not ICANN''s: BIND with dnssec-validation auto uses the built-in root key and tracks it by RFC 5011 (rndc managed-keys status shows the
    tag), a hard-coded static-key in a trust-anchors block never updates, and Windows Server DNS validates public names only if a root trust anchor
    was added manually (Get-DnsServerTrustAnchor -Name . should list key tag 38696); containerised services and DoH clients may use a resolver
    configured at build or deploy time that is independent of the host''s settings. IT-Connect also relays an ICANN back-out: temporarily disabling
    validation or configuring a negative trust anchor for the root (RFC 7646), then installing KSK-2024 as soon as possible. No Swiss authority
    (BACS, SWITCH) publication on the rollover was found. This is an operational-resilience deadline, not a threat report: it is returned because
    a federal, cantonal or communal network running its own validating resolver with a manual root trust anchor would lose name resolution for
    users and mail on a Sunday, two days from this run.'
  region_nexus: global DNS root change; applies to any Swiss public-sector network operating its own validating recursive resolver; no Swiss-specific
    statement found
