  evidence:
  - quote: The median Team Server was reachable for 14 days.
    attribution: NCC Group (Fox-IT)
    source_url: https://www.nccgroup.com/research/mining-data-from-cobalt-strike-beacons-part-2-releasing-the-full-corpus
  - quote: DNS beacons have declined much less steeply than HTTP(S) ones, perhaps because they get far less attention in public research and OPSEC
      advice
    attribution: NCC Group (Fox-IT)
    source_url: https://www.nccgroup.com/research/mining-data-from-cobalt-strike-beacons-part-2-releasing-the-full-corpus
  - quote: Don't treat an IP or watermark as malicious on the corpus alone.
    attribution: NCC Group (Fox-IT)
    source_url: https://www.nccgroup.com/research/mining-data-from-cobalt-strike-beacons-part-2-releasing-the-full-corpus
  extended_notes: 'Same fire, same record: NCC Group''s technical advisories of 2026-10-08 on Microsoft Windows uaspstor.sys (CVE-2026-68839,
    kernel pool out-of-bounds write via REPORT LUNS) and the MIDI Service module (CVE-2026-62688), both local privilege escalation rated Medium
    and already fixed by Microsoft, were read and not returned (no exploitation reported, S1 owns CVE triage).'
