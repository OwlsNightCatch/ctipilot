- title: >-
    Attackers compromise the operators of the .gh, .sl and .as ccTLDs, rewrite authoritative DNS and obtain valid HTTPS certificates for Google and other brands (Chrome
    blocks them via CRLSets)
  sources:
  - url: https://blog.google/security/chromes-response-to-recent-cctld-registry-hijacks/
    publisher: Google Chrome Secure Web & Networking Team
    date: '2026-10-06'
    role: primary
  - url: https://www.bleepingcomputer.com/news/security/hackers-hijack-google-domains-after-breaching-cctld-registries/
    publisher: BleepingComputer
