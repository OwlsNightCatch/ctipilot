    by CAs or ACME accounts the organisation does not use; for clients, certificate chains from a CA or issuance event not in the CT-expected set. Hardening: CAA
    records restricting issuance to specific CAs with account and validation-method binding (RFC 8657 per Google), restored immediately after any DNS-control incident
