  discovery_trace: >-
    first seen at: malware-news (slice record), feed https://malware.news/latest.rss 100 -> topic https://malware.news/t/attackers-hijack-country-code-domains-to-impersonate-google-and-other-services/126268
    (Malwarebytes relay) -> primary: Google https://blog.google/security/chromes-response-to-recent-cctld-registry-hijacks/ (also in the Google security RSS https://blog.google/security/rss/).
    Corroboration: WebSearch ('domain registry compromise .sl .gh .as hijack Certificate Transparency ...') -> BleepingComputer, Help Net Security (both rewrite Google;
    no independent registry or CA statement found).
  summary: >-
    Google's Chrome team says that in the week before 2026-10-06 it learned of a series of hijacks of the third-party operators of the .gh (Ghana), .sl (Sierra Leone)
    and .as (American Samoa) country-code namespaces, putting every domain under those suffixes at risk. Attackers modified authoritative DNS records and obtained
    unauthorized HTTPS certificates covering several Google domains and domains of other organisations; Google has no reason to believe the issuing certificate authorities
    did anything wrong (domain-control validation was satisfied through the hijacked DNS). Chrome blocked the Google certificates through CRLSets and worked with
    the CAs to have them revoked for other clients; Certificate Transparency data then revealed further affected organisations, 'several leading global brands and
    widely used online services', whose certificates Chrome also blocked. Google states it cannot guarantee it found every affected domain and that Chrome's interventions
    do not reliably protect non-Chrome users. Google does not say how the registry operators were compromised, who is responsible, when it began, or whether any certificate
    was used against users; BleepingComputer adds that the announcement named neither the attackers nor the number of certificates. Google's advice to domain owners:
    monitor Certificate Transparency for the entire domain portfolio including parked and regional ccTLD properties, and publish restrictive CAA records bound to
    specific ACME accounts and validation methods, which does not stop issuance during an active hijack but prevents reuse of cached validation after control is restored.
  region_nexus: >-
    global; no .ch involvement stated; Swiss relevance is the hardening lever for any government-owned domain portfolio (including fallback or regional ccTLD registrations)
