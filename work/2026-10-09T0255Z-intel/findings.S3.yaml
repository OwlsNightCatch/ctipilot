    Primary-lab research with usable behaviour detail (real-time AitM relay, QR-poster vector), but the targeting is Taiwan research bodies and the kit impersonates
    Google, not Microsoft 365; Swiss-public-sector relevance is by technique class only. Single source (Talos).
  evidence:
  - quote: >-
      The campaign deployed an advanced adversary-in-the-middle (AitM) phishing framework that impersonated Google authentication pages and utilized a hybrid HTTP
      and WebSocket architecture to synchronize authentication workflows in real time, enabling the interception of credentials and multi-factor authentication (MFA)
      challenges.
    attribution: Cisco Talos
    source_url: https://blog.talosintelligence.com/uat-11985/
  - quote: >-
      While Talos cannot conclusively determine whether the emails were fully generated by a large language model (LLM), the campaign demonstrates strong evidence
      of AI-assisted content production and personalization.
    attribution: Cisco Talos
    source_url: https://blog.talosintelligence.com/uat-11985/
  - quote: the embedded QR codes were maliciously altered
    attribution: Cisco Talos
    source_url: https://blog.talosintelligence.com/uat-11985/
  extended_notes: >-
    Detection/hunt concepts the source supports: mail whose visible link text (e.g. a Google Forms address) differs from the underlying href; event-themed invitations
    from senders the named institution cannot confirm; posters or PDFs with QR codes that resolve to a third-party host; web-proxy/DNS telemetry for a sign-in page
    served from a non-Google host that holds both an HTTP POST channel and a long-lived WebSocket to the same backend; identity-provider logs showing a sign-in from
    a new host/ASN moments after a successful challenge (session replay after relay). Talos does not state which MFA methods are relayable beyond 'MFA challenges',
    nor that passkeys stop the relay (the kit probes whether a passkey flow is enabled and adapts the prompt), so no hardening claim is made. Talos publishes ClamAV
    and Snort detections and an IOC repository (omitted here).
- title: >-
    Zscaler ThreatLabz independently finds a trojanized Terraform provider delivering FLATROOF and ROOFDECK on macOS, Linux and Windows (update to the SentinelLabs
    TraderTraitor Terraform entry)
  sources:
  - url: >-
      https://www.zscaler.com/blogs/security-research/suspected-tradertraitor-group-uses-trojanized-terraform-provider-deliver
    publisher: Zscaler ThreatLabz
    date: '2026-10-08'
    role: primary
  discovery_trace: >-
    first seen at: malware-news (slice record), feed https://malware.news/latest.rss 100 -> topic https://malware.news/t/suspected-tradertraitor-group-uses-trojanized-terraform-provider-to-deliver-cross-platform-malware/126274
    -> primary: https://www.zscaler.com/blogs/security-research/suspected-tradertraitor-group-uses-trojanized-terraform-provider-deliver (also on Zscaler RSS https://www.zscaler.com/blogs/feeds/security-research).
    Dedup: matches existing entry 2026-09-21/tradertraitor-terraform-lockfile-nostr-dead-drop (SentinelLabs, single-source).
  summary: >-
    ThreatLabz (Seongsu Park) reports a July 2026 campaign, linked by it with moderate rather than high confidence to TraderTraitor (Jade Sleet, UNC4899), in which
    a Go-built Terraform provider masquerading as an AWS provider runs malicious code the moment Terraform loads the plugin: a run-once marker in the temp directory,
    a download of a Bash loader from a HashiCorp-lookalike domain, execution through a detached 'sh -c' child while the provider keeps behaving normally. The loader
    (macOS, Linux and Windows-with-Unix-shell) picks a payload by OS and CPU architecture, fetches it from a dynamic-DNS host, a GitHub repository or a Vercel site,
    and the payload is an AES-256-CBC-encrypted executable appended after a marker inside a decoy web-font file. On macOS it strips the quarantine attribute and applies
    an ad-hoc signature. The delivered FLATROOF is a Rust backdoor with Telegram Bot API, GitHub-polling and HTTP-webhook C2 and platform-specific persistence (service
    on Linux, zlogout on macOS, Run key on Windows), plus embedded Python stealers for browser databases, cookies, keychain and Credential Manager, shell history
    and wallet-extension data; the Windows variant hollows a Chromium process to recover browser master keys. FLATROOF then drops ROOFDECK, which finds its C2 through
    a local config, an RSA-signed Pastebin dead drop and Nostr profile metadata. ThreatLabz says how the provider reached the victim is unknown, that SentinelLabs
    independently reported related TraderTraitor activity with weaponized Terraform projects while it was writing, and that it has not found code, infrastructure
    or cryptographic overlaps sufficient for high-confidence attribution; the overlap it does cite is with the KelpDAO incident's FLATROOF and ROOFDECK.
  region_nexus: >-
    global; targeting inferred as cryptocurrency/Web3 developers and cloud engineers who run Terraform; no Swiss nexus stated
