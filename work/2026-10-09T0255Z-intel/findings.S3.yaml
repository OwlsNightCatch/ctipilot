      An unauthenticated remote attacker can specify a path traversal sequence as a layer digest, causing a malicious binary to be written outside the model store.
    attribution: CERT Polska
    source_url: https://cert.pl/en/posts/2026/10/CVE-2026-103663/
  - quote: This issue was fixed in version 0.35.0.
    attribution: CERT Polska
    source_url: https://cert.pl/en/posts/2026/10/CVE-2026-103663/
  extended_notes: >-
    Exposure: Ollama servers whose API port is reachable by untrusted clients and whose process can write to /usr/lib/ollama (default for most Docker images per CERT
    Polska); read the running version from the server. Hardening levers implied by the mechanism: do not expose the API without authentication, run the container
    with a read-only /usr/lib/ollama, upgrade to the fixed build. Post-compromise check (inferred from the mechanism, not stated by the source): unexpected files
