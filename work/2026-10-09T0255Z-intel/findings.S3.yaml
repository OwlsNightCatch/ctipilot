- title: >-
    ReliaQuest: LLM-driven agents carry out most of an intrusion through one unauthenticated Spring Batch job-submission feature on Apache Tomcat, from JavaScript
    (Nashorn) in the app process to SYSTEM in under 24 hours
  sources:
  - url: https://reliaquest.com/blog/threat-spotlight-how-ai-agents-turned-one-exposed-endpoint-into-a-server-takeover/
    publisher: ReliaQuest Threat Research
    date: '2026-10-07'
    role: primary
  discovery_trace: >-
    first seen at: reliaquest (slice record), sitemap https://reliaquest.com/sitemap.xml (newest /blog/ lastmod 2026-10-07) → primary (no pivot needed): https://reliaquest.com/blog/threat-spotlight-how-ai-agents-turned-one-exposed-endpoint-into-a-server-takeover/
    fetched with extract. Corroboration attempts: WebSearch (2 queries, incl. extended) found no independent coverage of this incident.
  summary: >-
    ReliaQuest Threat Research assesses with high confidence that LLM-driven agents carried out substantial portions of an intrusion it investigated, and calls it
    the first such incident it has seen. The evidence is a live, unauthenticated Cairn agent-orchestration dashboard on the host that sent the opening requests, plus
    command timing (roughly half the gaps five seconds or less), job names minted seconds before use and advancing in fixed 1,800-byte read offsets, machine-parsable
    pipe-delimited output, payload comments narrating reasoning, and each failed payload being repaired by the next one. ReliaQuest could not determine how many agents
    ran, which model drove them, or how much a human approved. Mechanics (all known techniques, no zero-day): an internet-facing Apache Tomcat application accepted
    Spring Batch job definitions without a login; the attacker submitted jobs that invoked the Nashorn JavaScript engine inside the application process (no child
    process, so process-based detection had nothing to key on until a shell was spawned), returned results through deliberately triggered error messages, read plaintext
    SQL Server sysadmin credentials from application configuration, enabled xp_cmdshell, found SeImpersonatePrivilege, and used base64-fragmented uploads of PrintSpoofer
    and GodPotato (the staging host held rebuilt-from-source copies renamed as diagnostic utilities) to reach SYSTEM. It then saved the SAM, SYSTEM and SECURITY hives,
    created two local administrator accounts and deleted only one. Submission and collection ran from different addresses, so blocking the submitting address alone
    would not have stopped retrieval. ReliaQuest does not name the application, vendor, victim, sector or region, and states the open-source/commercial tool assembly
    is not a fingerprint for any group.
  region_nexus: >-
    global; victim and region not named. Swiss relevance is the exposure class (unauthenticated job-submission/management endpoints on Java application servers) rather
    than any named target
