- title: >-
    DNS root KSK rollover on 11 October 2026: every DNSSEC-validating resolver must already trust KSK-2024 (key tag 38696) or it will return SERVFAIL for all names
  sources:
  - url: https://www.icann.org/resources/pages/ksk-rollover-en
    publisher: ICANN
    date: 2026-10-09 (page current at fetch; carries the 11 October 2026 reminder for resolver operators)
    role: primary
  - url: >-
      https://www.icann.org/en/blogs/details/preparing-for-the-root-zone-ksk-rollover-what-you-need-to-know-27-07-2026-en
    publisher: ICANN
    date: '2026-07-27'
    role: primary
  - url: https://www.icann.org/resources/press-material/release-2026-08-11-en
    publisher: ICANN
    date: '2026-08-11'
    role: corroborating
  - url: https://www.akamai.com/blog/security/october-2026-root-ksk-rollover-dns-ready
    publisher: Akamai
    date: '2026-10-08'
    role: corroborating
  discovery_trace: >-
    first seen at: Akamai blog feed https://feeds.feedburner.com/akamai/blog (majors sweep; item 'The October 2026 Root KSK Rollover: Is Your DNS Really Ready?')
    -> Akamai post https://www.akamai.com/blog/security/october-2026-root-ksk-rollover-dns-ready (fetched with url; extract returned a truncated body) -> primary:
    ICANN https://www.icann.org/resources/pages/ksk-rollover-en, ICANN blog and press release (all fetched with extract). WebSearch (German/English, NCSC/BSI/SWITCH)
    found no home-region authority notice; ICANN, Verisign, APNIC and regional registries only.
  summary: >-
    ICANN's Root Zone KSK Rollover page carries a standing reminder for operators of DNSSEC-validating resolvers: the new root KSK (KSK-2024, key tag 38696) becomes
    the active signing key on 11 October 2026, two days from this run; verify the key is in the trust-anchor configuration and do not assume automatic trust-anchor
    updates succeeded. ICANN's 27 July blog states that from that date the root zone will use only KSK-2024 and that a validating resolver without it configured will
    suffer total DNS resolution failure for its users; KSK-2024 was first published in the root zone on 11 January 2025, RFC 5011 resolvers need a 30-day observation
    period, and ICANN reports more than 95 percent of reporting resolvers have adopted it. ICANN names the files to check (bind.keys for ISC BIND, root.key for Unbound
    and PowerDNS Recursor, root.keys for Knot Resolver) and, if tag 38696 is missing, to confirm automatic updates are enabled and the resolver can write to its key
    directory. Akamai's 2026-10-08 operator guidance adds the failure modes that defeat RFC 5011 in practice (offline or restored systems, read-only key stores, golden
    images with an outdated anchor, uninventoried embedded resolvers, assuming forwarding removes the requirement), three checks (trust-anchor files, the running
    resolver's loaded state, and RFC 8509 sentinel tests from each network that depends on the resolver, with the caveat that an indeterminate result is not a pass),
    and notes the old key KSK-2017 (tag 20326) stops signing on 11 October and is scheduled for revocation in Q1 2027. This is an availability event, not an attack:
    its value to the audience is a hard, near-term verification task for every validating resolver, appliance and cloud resolver the constituency operates.
  region_nexus: >-
    global; applies to every Swiss federal, cantonal and communal DNSSEC-validating recursive resolver or appliance with embedded validation
  primary_sector_nexus: direct (infrastructure operated by the constituency)
  sector: public-sector
  cves: []
  techniques: []
  affected_products:
  - ISC BIND
  - Unbound
  - PowerDNS Recursor
  - Knot Resolver
  entity_keys: []
  new_entities: []
  relation_suggestions: []
  verification: SINGLE-SOURCE-OTHER
  confidence: HIGH
  novelty: new
  borderline: true
  borderline_reason: >-
    Not threat activity and not a Swiss-authority notice: an operational availability deadline from the root-zone operator (ICANN is the authority for its own rollover;
    Akamai restates it). Included because the verification task is concrete, time-boxed (11 October 2026) and affects every validating resolver the constituency runs;
    the main agent decides whether this belongs in the threat brief or only in a policy/advisory kind.
  evidence:
  - quote: Do not assume automatic trust-anchor updates succeeded.
    attribution: ICANN
    source_url: https://www.icann.org/resources/pages/ksk-rollover-en
  - quote: >-
      if your DNSSEC-validating resolver does not have KSK-2024 configured by this date, your network will experience total DNS resolution failures, cutting off Internet
      access for your users.
    attribution: ICANN
    source_url: >-
      https://www.icann.org/en/blogs/details/preparing-for-the-root-zone-ksk-rollover-what-you-need-to-know-27-07-2026-en
  - quote: The sentinel mechanism only works on resolvers that implement RFC 8509.
    attribution: Akamai
    source_url: https://www.akamai.com/blog/security/october-2026-root-ksk-rollover-dns-ready
  extended_notes: >-
    Exposure: DNSSEC-validating recursive resolvers (including forwarders that validate, firewall/DNS appliances, embedded resolvers in network gear, container or
    cloud resolvers built from old images). Non-validating clients behind a validating upstream are affected only through that upstream. How to check (ICANN, Akamai):
    is key tag 38696 present in the trust-anchor file and loaded by the running daemon; run RFC 8509 sentinel tests from the networks and applications that depend
    on each resolver (indeterminate = unsupported, not a pass). If missing: confirm automatic updates are enabled and the resolver can write to its key store, otherwise
    follow the vendor's trust-anchor update guidance before 11 October. Caveats: Akamai is a vendor with a DNS-posture product and its post is commentary; the facts
    rest on ICANN/IANA. Akamai states KSK-2017 revocation for Q1 2027; the search summary reported 11 January 2027 but no fetched ICANN page confirms that date, so
    it is not asserted here. Suggested disposition: a policy/advisory-kind entry or a one-paragraph awareness item; no actors, no IOCs, no ATT&CK mapping.
- title: >-
    CVE-2026-103663, Ollama: unauthenticated path traversal in /api/pull writes a binary outside the model store and becomes root code execution on restart when /usr/lib/ollama
    is writable (default in most Docker images)
  sources:
  - url: https://cert.pl/en/posts/2026/10/CVE-2026-103663/
    publisher: CERT Polska
    date: '2026-10-08'
    role: primary
  discovery_trace: >-
    first seen at: malware-news (slice record), feed https://malware.news/latest.rss 100 -> topic https://malware.news/t/vulnerability-in-ollama-software/126256 ->
    primary: CERT Polska https://cert.pl/en/posts/2026/10/CVE-2026-103663/. WebSearch for the CVE id returned only unrelated Ollama CVEs (CVE-2026-7020, CVE-2024-37032);
    no vendor advisory or NVD record was fetched.
  summary: >-
    CERT Polska, which coordinated disclosure, publishes CVE-2026-103663: Ollama is vulnerable to relative path traversal (CWE-23) in the /api/pull endpoint because
    the digestToPath function does not sufficiently validate layer digests. An unauthenticated remote attacker can supply a path-traversal sequence as a layer digest
    so that a malicious binary is written outside the model store. If the server process can write to /usr/lib/ollama, which is the default in most Ollama Docker
    images, the file is loaded and executed on the next server restart, giving remote code execution as root. CERT Polska lists vulnerable versions as 0.34.2 to 0.35.0
    and states the issue was fixed in 0.35.0; the two statements overlap on 0.35.0, so the exact first fixed build should be confirmed against the vendor release.
    Credit: Bartlomiej Dmitruk (striga.ai). No exploitation status, CVSS score, PoC or KEV listing is given by the source.
