  - key: malware:mantlemaze
    type: malware
    name: MANTLEMAZE
    aliases: []
    summary: >-
      Cluster of VMProtect-packed loaders tracked by Talos CAIRN that claim to be Google, Microsoft and Valve IP backed by fabricated contract and certification numbers
