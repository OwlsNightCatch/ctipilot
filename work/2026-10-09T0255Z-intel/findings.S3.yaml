    .terraform.lock.hcl files in lure repositories (SentinelLabs' lockfile finding stands for the lure repos; neither source proves how a given victim was reached);
    (3) Windows and Linux variants (the SentinelLabs entry describes macOS), Telegram/GitHub/webhook C2 redundancy, a signed Pastebin dead drop plus Nostr fallback,
    and Python stealers for Chrome/Edge/Brave, Firefox, keychain, Credential Manager, shell history and wallet extensions. Detection concepts (behavioural, from the
    source): the terraform provider plugin process spawning a shell that writes an executable to the temp directory and downloads over HTTPS from a domain that is
    not the Terraform registry; a run-once lock file in the temp directory; a payload download whose filename mimics a web font but is large and decrypts on the host;
    macOS quarantine-attribute removal plus ad-hoc re-signing followed by execution from a config/library path; Windows process hollowing of Chromium browsers; outbound
    Telegram Bot API, GitHub API polling or Nostr relay traffic from developer or CI hosts with no business need. Hardening named by ThreatLabz: restrict untrusted
    providers and verify provider checksums; the SentinelLabs-documented lockfile registry-redirect check remains the complementary control. Suggested changelog scope:
    add the delivery-variant paragraph, the cross-platform capability set, the C2/dead-drop detail, the attribution hedge, and raise verification from single-source
    to multi-source for the FLATROOF/ROOFDECK family.
- title: >-
    ChainDrop/Shai-Hulud npm worm reaches the tensorlake AI-agent SDK (0.5.144): preinstall loader, Ethereum-contract C2 and a token-revocation dead-man switch, plus
    Unit 42's three-phase map of on-chain C2 resolution (update to the ChainDrop entry)
