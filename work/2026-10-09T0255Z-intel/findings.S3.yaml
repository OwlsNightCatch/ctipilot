  summary: >-
    Socket detected tensorlake@0.5.144, the npm SDK for Tensorlake's AI-agent sandbox platform (about 12K weekly downloads), published 2026-10-08 at 01:12 UTC and
    flagged 11 minutes later. A preinstall hook (node lib/setup.mjs) launches an obfuscated Bun-run payload that harvests npm, GitHub, AWS (IMDS, ECS, Secrets Manager,
    SSM), HashiCorp Vault, Kubernetes, SSH, .env and wallet secrets and AI-tool configuration (Claude, Cursor, Kiro, Windsurf, Zed), self-propagates by republishing
    packages tied to the victim's publishing identity with Sigstore provenance, and resolves its endpoint from an Ethereum contract over about 30 public RPC endpoints
    with a GitHub fallback. A persistent 'hostage token' monitor polls the GitHub API with the stolen token and runs an attacker handler if the token is revoked;
    Socket warns that revoking the token before removing the monitor triggers a wipe of the user's home directory. Socket ties the structure to the August ChainDrop/Shai-Hulud
    compromises of keyv and cacheable (loader and payload filenames match); Sonatype does not name the family. Sonatype adds from code review that the GitHub fallback
    can create a public repository and commit collected data (a repo-scoped token can be included in the commit), that the malware can commit .claude and .vscode
    files to accessible repositories, and that the loader exits under common CI markers, so broad CI infection is not established; it has not confirmed data publication,
    repository modification or downstream spread. Unit 42 (2026-10-07) places ChainDrop and the DPRK-linked PolinRider campaign in a three-phase taxonomy of blockchain
    C2 resolution (fixed contract state, transaction calldata, zero-value recipient-address decoding) and advises that any outbound blockchain interaction is a high-confidence
    anomaly for organisations without Web3 operations.
