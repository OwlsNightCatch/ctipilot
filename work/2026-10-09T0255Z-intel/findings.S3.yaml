    2026-10-07 16:45 UTC) and CrowdStrike feed https://www.crowdstrike.com/en-us/blog/feed/ -> primary: https://www.crowdstrike.com/en-us/blog/unknown-threat-actor-uses-artex-to-target-south-korean-finance/
    (page metadata date 2026-10-08, feed date 2026-10-07). Industry reporting cited by CrowdStrike (Kyunghyang Shinmun) not fetched.
  summary: >-
    CrowdStrike Intelligence analysed attacker-controlled open directories tied to a campaign against South Korean financial organisations that exfiltrated data between
    late September and early October 2026. The directories held Claude Code session histories, ARTEX configuration files and Claude memory files, showing a two-server
    set-up: one host running an ARTEX instance (a recently released open-source agentic penetration-testing tool developed in China) and a Hong Kong-based host as
    primary infrastructure. ARTEX used DeepSeek as the main LLM back-end, supplemented by GLM and Grok models in separate Claude Code sessions, reached through a
    likely API reseller, and the operator also asked the model where Korean breach data is sold. CrowdStrike assesses with moderate confidence, from the Chinese-developed
    tool and Chinese-language prompts, that the actor is a Chinese speaker and financially motivated, attributes it to no named adversary, and cannot definitively
    tie personal details found in a session to the actor. The initial access reported by industry press (a loan-progress inquiry service used by brokers at one bank,
    an employee mobile work-support system at another) is relayed from press reporting, not CrowdStrike's own observation; the number of victims is unconfirmed.
