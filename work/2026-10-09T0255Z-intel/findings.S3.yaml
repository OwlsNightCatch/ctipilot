  verification: MULTI-SOURCE
  confidence: HIGH
  novelty: new
  evidence:
  - quote: >-
      A3 targets a newer layer that sits above it: the pipeline that extracts text from a sample and submits it to a language model for triage, classification, or
      reverse-engineering assistance.
    attribution: Cisco Talos
    source_url: >-
      https://blog.talosintelligence.com/ignore-all-instructions-and-read-this-blog-the-state-of-ai-analysis-evasion-in-malware/
  - quote: the best techniques steered the outcome in the attacker’s favor in about 35% of test runs
    attribution: Cisco Talos
    source_url: >-
      https://blog.talosintelligence.com/ignore-all-instructions-and-read-this-blog-the-state-of-ai-analysis-evasion-in-malware/
  - quote: Text inside a sample must be treated as evidence, never instruction.
    attribution: Cisco Talos
    source_url: >-
      https://blog.talosintelligence.com/ignore-all-instructions-and-read-this-blog-the-state-of-ai-analysis-evasion-in-malware/
  - quote: >-
      By inserting a decoy request for guidance on building a nuclear weapon into the script’s comment, the bad actor aimed to trip the safety guardrails of an LLM-powered
      code scanner and cause it to stop inspecting the rest of the file – before ever reaching the malicious code.
    attribution: ESET
    source_url: >-
      https://www.welivesecurity.com/en/business-security/guardbreaker-derailing-ai-assisted-malware-analysis-code-comment/
  extended_notes: >-
    Why it matters to this audience: any SOC, sandbox or reverse-engineering workflow that feeds extracted strings or decompiled code to an LLM (including automated
    triage agents) is the target surface. Detection/hunt concepts the sources support: imperative language addressed to an analysis system inside scripts or binaries
    (instructions to refuse, ignore, or not analyze; copyright, honeypot or government-contract claims) is a standalone suspicious signal because legitimate software
    has no reason to carry it (Talos); an empty or refused LLM verdict on a sample must trigger further checks rather than count as benign (ESET). Hardening: keep
    sample text out of system/instruction roles when prompting, cross-validate with more than one model plus conventional static/dynamic analysis, and never let a
    single LLM verdict clear a file (ESET, Talos). Talos' conclusion is calibrated: 'interesting but not alarming', conventional detection is unaffected. Caveats:
    Talos' effectiveness numbers come from its own five-local-model test; GTIG is cited by Talos for FRUITSHELL being active in the wild (not fetched here). Hashes
    in the Talos post deliberately omitted. Relation to existing coverage: tool:cairn-talos and the CLOSEDQUORUM disclosure (2026-09-22) are already in the registry;
    this is a new technique-class finding.
- title: >-
    Cisco Talos UAT-11985: AI-assisted event-invitation lures, QR codes altered on stolen posters and a real-time Google adversary-in-the-middle kit that mirrors
    the MFA challenge over a WebSocket
  sources:
  - url: https://blog.talosintelligence.com/uat-11985/
    publisher: Cisco Talos
    date: '2026-10-08'
    role: primary
  discovery_trace: >-
    first seen at: malware-news (slice record), feed https://malware.news/latest.rss 100 -> topic https://malware.news/t/uat-11985-ai-assisted-event-lures-delivering-real-time-google-aitm-phishing/126250
    -> primary: https://blog.talosintelligence.com/uat-11985/ (also on Talos RSS https://blog.talosintelligence.com/rss/)
  summary: >-
    Talos attributes a mid-2026 spear-phishing campaign against people affiliated with Taiwan research organisations to a cluster it tracks as UAT-11985 (assessed
    as an APT). Senders impersonated real institutions (Taiwan European Union Centre, NCCU Institute of International Relations, Taiwan Research Institute); the organisations
    told a recipient they could not confirm the senders. The three emails share one three-part template, which Talos says suggests (while it cannot prove) AI-assisted
    generation: policy-jargon opening, interchangeable flattery, then real event logistics copied from public pages. Links show a legitimate-looking Google Forms
    address while the href points to actor infrastructure; some mails also carried event posters scraped from legitimate sites with maliciously altered QR codes,
    extending the lure to anyone who scans a printed poster. The landing page is a pixel-faithful Google form that forces a redirect to a spoofed Google sign-in running
    an obfuscated (string-array rotation) JavaScript client. The kit is operator-driven: HTTP POST carries browser fingerprint, identifier, password and challenge
    answers to the actor's server, which relays them to the real Google service, and a persistent WebSocket tells the page which screen to render next (password,
    passkey prompt or the matching MFA challenge), so the victim's UI mirrors Google's live state and the actor harvests authenticated session material. Talos assesses
    with moderate confidence that the kit's UI was written by a Simplified Chinese speaker and later localised to Traditional Chinese and English; it states the WebSocket
    approach differs from a separate Chinese-speaking-actor kit it reported earlier.
  region_nexus: >-
    Taiwan research and policy organisations; no Swiss nexus stated. Transferable: AitM kit mirroring MFA state in real time, QR-poster lure, AI-templated policy-event
    invitations
  primary_sector_nexus: indirect
  sector: research/policy
