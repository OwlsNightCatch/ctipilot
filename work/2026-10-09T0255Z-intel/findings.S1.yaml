  summary: 'Under its risk-based disclosure model (first and third Wednesday of the month) Cisco published 35 vulnerabilities on 2026-10-07. Each advisory read states that Cisco PSIRT is not aware of public announcements or malicious use of the flaw; the store has no coverage of the release. Nexus 3000 and 9000 (standalone NX-OS), unauthenticated remote code execution as root or reload, all CVSS 9.8, each behind a feature that is not on by default: CVE-2026-76471 NX-API (crafted HTTP request; NX-API is disabled by default; on UCS 6300 Fabric Interconnects exploitation needs low-privileged credentials through the UCS Manager XML API and Cisco rates it High; Live Protect shield and fixed releases exist, advisory revised 2026-10-08 to update the fixed table); CVE-2026-76465 MPLS OAM (crafted MPLS echo-request to a device IP; feature disabled by default; Silicon One ASIC models cannot enable it; `no feature mpls oam` is a mitigation; Live Protect shield); CVE-2026-76485, -76486 and -76501 NGOAM (crafted packets to an IP interface; -76485 needs only NGOAM enabled, -76486 additionally SRv6 or NV Overlay with an EVPN VNI and a learned VTEP peer, -76501 NGOAM plus SRv6; `no feature ngoam` mitigates all three). A separate NX-OS hardening release groups internally found flaws by CWE regardless of configuration, highest CVE-2026-76455 (access control) and CVE-2026-76459 (out-of-bounds write) at 9.8; first fixed: Nexus 3000/9000 standalone 10.3(10), 10.4(8), 10.5(6), 10.6(4); Nexus 7000 8.4(14); ACI mode 16.0(9h), 16.1(6g), 16.2(3g); MDS 9.4(5a); UCS 4.3(6j) and 6.0(2e). Cisco License On-Prem (formerly Smart Software Manager On-Prem), affected regardless of configuration: CVE-2026-20328 unauthenticated reset of any account password including administrators (9.1, no workaround) and CVE-2026-76454 unauthenticated Smart Licensing Utility API file write or DoS (9.1); hardening CVEs CVE-2026-76480 (CWE-306, 9.8), CVE-2026-76482 (signature verification, 10.0), CVE-2026-76483 (credential protection, 9.1) and CVE-2026-76484 (code injection, 8.8); fixed in 10-202609 (the first advisory also lists 10-202608), 9-202601 and earlier must migrate. Also: APIC hardening CVEs CVE-2026-76498 to -76500 (9.8; the APIC hardening advisory itself was not read, the rating comes from the EUVD and SecurityWeek) and an authenticated administrator command injection CVE-2026-20321 (6.5; fixed 6.0(9h), 6.1(6g), 6.2(3g)); Meraki hardening CVE-2026-76463 to -76472 (highest 9.6, adjacent-network vector) with staged fixes (MX 18.107.14, 19.2.9 for Z3, 26.1.7, 26.2.3; MR 30.7.3, 31.1.8.1, 32.2.5 late October, 33.1.3; MS 18.1.9 mid-October; Campus Gateway 32.2.5 late October and 33.1.4 mid-November); Finesse CVE-2026-20362, an unauthenticated SSRF (7.2) that SecurityWeek says is publicly disclosed, with fixed releases only in January to February 2027 and no workaround; NX-OS Python sandbox escape (4.4, authenticated).'
