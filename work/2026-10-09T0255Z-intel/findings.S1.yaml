  summary: 'NCSC-CH''s hub post 13035 (TLP:Clear, published 2026-10-07, never edited) reports multiple critical vulnerabilities in ILIAS: remote code execution through test, CmiXapi or question imports, and unauthorised download of file objects. Per the post, the RCE flaws generally need an authenticated user, the file disclosure needs the public area feature enabled, the exploitation status is UNKNOWN, and vendor patches are available. BSI CERT-Bund''s WID-SEC-2026-3783 (rated hoch, release 2026-10-07 00:00 CEST) says a remote attacker can execute arbitrary code, bypass security mechanisms and manipulate or disclose data, and lists the open-source ILIAS branches below 9.24, 10.12 and 11.5 as affected, with those three versions as the fixed releases; the ILIAS GitHub release 11.5 of 2026-10-06 states it contains security fixes and points to the ILIAS security blog. No CVE ids are published in either advisory. ILIAS is an open-source learning-management system; the store already covers two earlier ILIAS findings (2026-05-28 and 2026-06-23).'
