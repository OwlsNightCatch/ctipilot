  summary: 'HPE Networking published two advisories on 2026-10-06, both rated Critical and both stating the flaws were found by internal research and that HPE is not aware of public discussion or exploit code. ClearPass Policy Manager (HPESBNW05158; CPPM 6.14.0 and below and 6.11.15 and below; fixed in 6.14.1 and 6.11.16): unauthenticated deserialization of untrusted data leading to remote code execution in the web interface (CVE-2026-76750, 9.8), an unauthenticated format-string flaw (CVE-2026-76753, 9.8), unauthenticated SQL injection leading to code execution (CVE-2026-76754, 9.8), authentication bypasses reaching administrative access (CVE-2026-76752 and CVE-2026-79796, 9.8), unauthenticated missing integrity verification leading to code execution in the OnGuard agent and client software (CVE-2026-76751 and CVE-2026-79801, 9.8, endpoint side), an authenticated SQL injection at 9.9 (CVE-2026-79798), and further authenticated and local flaws. AOS-Switch (HPESBNW05156; AOS-S 16.11.0031 and below; CERT-FR lists AOS-S 16.11.0032 as the fixed build): authentication bypass in the web management interface (CVE-2026-76742, 9.8), a management-interface authentication bypass that needs preconditions outside the attacker''s control (CVE-2026-76743, 9.8), unauthenticated buffer overflows leading to remote code execution (CVE-2026-76744, 9.8), and unauthenticated adjacent-network memory corruption and overflow flaws (CVE-2026-76745 at 9.6, CVE-2026-76746 at 9.3). HPE''s workaround for both: restrict the CLI and web management interfaces to a dedicated layer-2 segment or VLAN and control them with layer-3 firewall policy.'
