  discovery_trace: 'first seen at: enisa-euvd bridge, URL https://euvdservices.enisa.europa.eu/api/search?fromDate=2026-10-07&toDate=2026-10-09&fromScore=9&toScore=10&page=0&size=100 (EUVD-2026-95315, NetScaler, 9.5, published 2026-10-08 21:18 UTC, not in the store) -> pivot: CVE Program record, URL https://cveawg.mitre.org/api/cve/CVE-2026-107406 (CNA NetScaler; references CTX697191) -> primary: Citrix bulletin CTX697191 read through the jina reader, URL https://support.citrix.com/support-home/kbsearch/article?articleNumber=CTX697191 (the page is a JS shell for every other transport) -> Citrix techzone blog index https://community.citrix.com/techzone-blogs/110_security-updates/ (text of the blog post read there; its permalink returned 403)'
  summary: 'Citrix published bulletin CTX697191 on 2026-10-08 (bulletin metadata: Created Date 10-08-2026 20:28, Last Modified Date 10-08-2026 22:03, time zone not stated; the CVE record went public at 21:18 UTC) for CVE-2026-107406, a memory overflow (CWE-119) in customer-managed NetScaler ADC and NetScaler Gateway that the bulletin says leads to remote code execution or denial of service, CVSS v4.0 9.5 (AV:N/AC:H/AT:N/PR:N/UI:N). The precondition is a SAML configuration: the appliance must be a SAML service provider (config entry `add authentication samlAction`) or a SAML identity provider (`add authentication samlIdPProfile`). Affected builds: for SP or IdP appliances, everything before 14.1-73.37, 14.1-FIPS 73.37, 13.1-64.23 and 13.1-FIPS/NDcPP 13.1-37.279; and, for IdP-configured appliances only, 14.1-73.37 through 14.1-73.41, 13.1-64.23 through 13.1-64.28 and the matching FIPS/NDcPP builds through 13.1-37.282 and 14.1-FIPS 73.41 - these are the builds Citrix shipped on 2026-10-03 for the exploited denial-of-service flaw CVE-2026-88779, so an IdP appliance that followed that guidance is exposed again. Fixed: 14.1-73.46 and later, 13.1-64.29 and later, 14.1-FIPS 73.46 FIPS and later, 13.1-FIPS/NDcPP 13.1.37.283 and later. Secure Private Access Hybrid deployments that use NetScaler instances are also affected; Citrix-managed cloud services and Adaptive Authentication are upgraded by Citrix. Credit: Michael Tucker, Chew Keong Tan and Alex Bernier of the JPMorgan Chase XOR Team, and Maxim Suhanov. Exploitation: the bulletin is silent; Citrix''s blog post of the same evening (read on the techzone index page) says that as of publication Citrix is not aware of any unmitigated exploits of this vulnerability. No exploit code, technical write-up or scanning report was found in this run; no independent outlet or national CERT had covered it at about 03:30 UTC on 2026-10-09. Context from the store: NetScaler''s SAML code path has produced repeated flaws - the pre-auth SAML memory overread CVE-2026-8451 (entry of 2026-07-01) and the SAML-triggered CVE-2026-88779 (exploited, KEV 2026-10-04), whose entry names the .41/.28 builds as the fix - and the same appliances took the unrelated exploited zero-days CVE-2026-88771 and CVE-2026-88772 (KEV 2026-09-27).'
  region_nexus: global; internet-facing remote-access and SSO gateway class that Swiss and EU authorities (NCSC-CH hub post 13005, CERT-EU 2026-014, NCSC-UK) already warned on for the sibling NetScaler flaws
