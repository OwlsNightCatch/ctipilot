coverage_gaps:
- source_id: ncsc-ch-security-hub / ILIAS
  reason: The ILIAS security-blog URL named by NCSC-CH post 13035 is session-bound (404 on extract and jina) and the permanent docu.ilias.de/go/blog/15821/951 form answers a captcha page, so the vendor text was not read; fixed versions (9.24, 10.12, 11.5) came from BSI WID-SEC-2026-3783 and the GitHub release 11.5. WebSearch found no ILIAS October advisory.
- source_id: citrix-netscaler-security-bulletins (candidate)
  reason: 'Recipe update: the CTX bulletin pages are a JS shell for extract; `python3 tools/fetch_source.py jina ''https://support.citrix.com/support-home/kbsearch/article?articleNumber=CTX697191''` returned the full bulletin (verified 2026-10-09 03:12 UTC), so the article number alone suffices when the slug is unknown. The community blog permalink is 403 on extract and jina; the blog index page https://community.citrix.com/techzone-blogs/110_security-updates/ via `extract` and the feed https://community.citrix.com/rss/3-citrix-tech-zone-blogs.xml/ (dated, direct transport) carry the post text and title.'
- source_id: cisa-advisories
  reason: The AA26-281A PDF on www.cisa.gov returned 403 to `pdf`; the FBI IC3 mirror https://www.ic3.gov/CSA/2026/261008.pdf read in full (58 pages, 92,694 characters, per-font ToUnicode decode; spacing around hyphens is irregular, so literal quote checks need whitespace normalisation).
- source_id: enisa-euvd
  reason: 'Recipe that worked: `url --direct ''https://euvdservices.enisa.europa.eu/api/search?fromDate=D-1&toDate=D%2B1&fromScore=9&toScore=10&page=0&size=100''` (one page, two when total > 100) listed vendor CNA records within hours of publication; it surfaced NetScaler CVE-2026-107406 about five hours after Citrix published it and before any news outlet or CERT. `recent criticals` returned only four rows and `recent exploited` four. Suggest recording this as the first-pass sweep in the record''s notes.'
- source_id: bsi-de
  reason: bsi-rss returned 250 items reaching back only to 2026-10-07 11:58 UTC because a bulk [UPDATE] refresh of about 150 older advisories on 2026-10-08 12:44 UTC filled the cap; the [NEU] filter still covered the window. Nothing lost for a 25 h window, but a 48 h window would be truncated.
- source_id: watchguard-psirt
  reason: psirt.watchguard.com/CVE-2026-86106 answered 403 AccessDenied on extract and jina; the other four per-CVE pages read cleanly with extract.
- source_id: work/<run-id>/url-liveness.tsv
  reason: 'Operational note: the ledger is appended by several sub-agents at once; this agent removed one wrongly appended line (a failed fetch) by rewriting the file, which can race with other appenders. Prefer a follow-up correction row or leaving it to the main agent.'
