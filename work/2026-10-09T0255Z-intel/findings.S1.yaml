  summary: 'IBM Security Verify Identity Access and Security Verify Access (bulletin of 2026-10-07; Verify Access 10.0 to 10.0.9.2 and Verify Identity Access 11.0 to 11.0.3, appliance and container): CVE-2026-78401 and CVE-2026-78406, remote unauthenticated code execution through deserialization of untrusted data (9.8), CVE-2026-16823 and CVE-2026-19491, authentication bypass (9.1), CVE-2026-16916 (9.1, authenticated, privileged), plus authenticated 8.8 command and argument injection; fixes 11.0.3.1 and 10.0.9.3 (appliance), no workaround. IBM DataPower Gateway (bulletin of 2026-09-28, CVE records published 2026-10-08; 10.5.0.0 to 10.5.0.22, 10.6.0.0 to 10.6.0.10, 10.6.1 to 10.6.6, 11.0.0.0 to 11.0.0.2): CVE-2026-14269 heap overflow and CVE-2026-16340 and CVE-2026-15762 out-of-bounds writes, remote code execution by an unauthenticated remote attacker (9.8), and CVE-2026-14502, administrative access because empty passwords are not rejected during LDAP authentication (9.8); fixed in 11.0.0.3, 10.6.0.11 and 10.5.0.23. IBM Guardium Data Protection (a database activity-monitoring product): the 2026-10-08 Sniffer bulletin (12.0, 12.1, 12.2) adds CVE-2026-75875 path traversal leading to code execution (9.8) and CVE-2026-80381 SQL injection (9.8), with 8.1-rated overflows in the MongoDB SCRAM and TDS PRELOGIN parsers reachable through monitored traffic; the 2026-10-08 edge bulletin adds CVE-2026-84272, missing authentication in the edge controller that lets an unauthenticated remote attacker run arbitrary container images and take control of managed edge clusters (9.8; 12.2.2 edge component and 12.1 appliance); CVE-2026-84249, missing authentication for critical management operations (9.8; 12.2 and 12.2.2; 2026-09-17), and CVE-2026-84275 (9.8, the held backlog row) came earlier. IBM lists no workaround for these and no exploitation statement. Italy''s ACN alert AL04/260928/CSIRT-ITA reports exploitation of the authenticated CVE-2026-85542 in the same product (backlog row, 2