  summary: 'On 2026-10-08 the FBI, CISA, NSA, NCSC UK, ASD''s ACSC, the Canadian Cyber Centre, Japan''s NPA and NCO, NCSC-NZ and Spain''s CNI published AA26-281A (58 pages) on activity enabled by Integrity Technology Group, a China-based company the advisory says has links to the Chinese government. The advisory says the enabled actors'' TTPs are consistent with the activity publicly known as Flax Typhoon, Ethereal Panda and Red Juliett, and that vendor tracking names may not map one to one. Technique detail the advisory gives: open-source scanning (BBScan, dirsearch, Fscan, ksubdomain, masscan, Nmap, OneForAll, ShuiZe, WPScan) focused on ports 21, 22, 53, 80, 443 and 1080 and enumeration of PHP and ASP pages; MicroScan, a Python web application of more than 1,300 scripts in use since at least 2017 against OpenSSL, Oracle WebLogic, Rejetto HFS, WordPress, Juniper ScreenOS, Jenkins and Apache Struts; initial access since at least mid-January 2021 mainly through command-line exploit utilities written in Python and Go, plus a cross-site-scripting payload that overlays username and password fields and then offers a password-protected ZIP carrying an executable that masquerades as a Windows diagnostics process; EBurst password guessing and spraying against Exchange and Microsoft 365 endpoints (ECP, EWS, OAB, OWA, RPC, API, MAPI, PowerShell, Autodiscover, ActiveSync); SoftEther VPN installers renamed to look like Windows system binaries for persistence; DCSync for directory credentials; a PHP bot and a Linux utility that pull mailbox content through Exchange Web Services and Microsoft 365 using app client_id, tenant_id and secret configuration; automated exfiltration. Targets named: U.S. government services, critical manufacturing, healthcare and IT, plus law enforcement, education and religious organisations, and organisations in Southeast Asia, Africa and North America; mail was stolen from Southeast Asian government, law-enforcement, healthcare and religious bodies. The Hacker News reports, quoting the advisory, that the actors also run a web application giving third parties access to stolen email content. Switzerland and NCSC-CH are not among the authoring agencies and no Swiss victim is named. Appendix B lists eight CVEs as ''successfully exploited''; the advisory states they were recovered from MicroScan''s penetration-testing scripts and does not tie each to a victim or date (that link is not stated). They are CVE-2014-6278 (GNU Bash through 4.3), CVE-2015-3306 (ProFTPD 1.3.5), CVE-2015-5477 (ISC BIND 9.x before 9.9.7-P2 and 9.10.x before 9.10.2-P3), CVE-2016-3081 (Apache Struts 2.3.19 to 2.3.28 with Dynamic Method Invocation), CVE-2019-11510 (Pulse Connect Secure), CVE-2021-22205 (GitLab from 11.9), CVE-2021-3199 (ONLYOFFICE DocumentServer 5.1.5 to 5.6.2) and CVE-2023-22894 (Strapi up to 4.5.5). Five of them - ProFTPD, BIND, Struts, ONLYOFFICE and Strapi - were added to CISA KEV on 2026-10-08 (due 2026-10-11); the other three were already listed (Bash since 2025-10-02, Pulse Connect Secure and GitLab since 2021-11-03). In parallel the Justice Department announced court-authorised seizures of seven domains used to operate MicroScan and a spear-phishing and malware-delivery platform called FishHub; it says Integrity Tech has contracts with the PRC government and that this is the second public technical disruption after the September 2024 takedown of its Mirai-variant botnet of more than 200,000 devices. FIRST EPSS on 2026-10-08: ProFTPD 0.9675, Struts 0.9335, BIND 0.9128, ONLYOFFICE 0.0822, Strapi 0.0166.'
