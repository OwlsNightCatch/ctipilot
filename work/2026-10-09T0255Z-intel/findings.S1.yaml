    attribution: CISA KEV catalogue
    source_url: https://www.cisa.gov/known-exploited-vulnerabilities-catalog
  extended_notes: 'KEV disposition: this item is the ''what changed'' for all five NOT COVERED KEV rows of 2026-10-08. If the composer ships it with the five CVEs in cves[] (status exploited, cisa-kev), those rows are covered; if it is dropped, each row falls to a borderline-drop (see kev_disposition). Triage-ready behaviour the advisory supports: web, FTP and application logs showing Struts `method:`-prefixed parameters, ProFTPD SITE CPFR/CPTO sequences, ONLYOFFICE image-upload parameters containing `/..`, Strapi admin-API user queries filtered on credential columns (EUVD description of CVE-2023-22894); bursts of failed logons spread across Exchange endpoints (ECP, EWS, OWA, ActiveSync, Autodiscover) from few sources, then mailbox reads through EWS or Graph by a new app credential; directory-replication requests from a non-domain-controller (DCSync); SoftEther VPN client software installed under system-binary lookalike names. Benign lookalikes: vulnerability scanners and pentest tooling run by the organisation''s own red team produce the same scanning and web-log patterns; legitimate mail-migration and backup tools read mailboxes through EWS with registered app credentials - the discriminators are source, app registration owner and volume. Mitigations the advisory lists include MFA on webmail and VPNs, disabling unused services and ports, input sanitisation against XSS, and attack-surface monitoring. No IOCs carried here by design; the advisory ships a STIX bundle. Caveats: the advisory uses one label (''the threat actors'') for the company and the hackers it enables and does not say which actor performed which intrusion; the CVE appendix is a tool-script inventory; the ''third-party access portal'' claim is The Hacker News quoting the advisory. EUVD marks the four KEV-listed old CVEs it indexes as exploited since 2026-10-08 (derived from the KEV listing, not independent evidence).'
