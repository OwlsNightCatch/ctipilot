claims:
  - claim_id: c4d7805109
    entry: 2026-09-21/tradertraitor-terraform-lockfile-nostr-dead-drop
    surface: "summary"
    kind: frontmatter
    text: "SentinelLabs found the FLATROOF and ROOFDECK macOS backdoors, first documented in April 2026's USD 292 million LayerZero/KelpDAO cryptocurrency theft, on an unrelated victim: a small India-based IT-services provider with no cryptocurrency ties. The campaign's fake job-interview GitHub repositories carry weaponized Terraform provider lockfiles that redirect `terraform init` to attacker-controlled provider registries, though SentinelLabs cannot prove how this victim's backdoors were delivered. Zscaler ThreatLabz independently reports a July 2026 trojanized Terraform provider binary that runs malicious code as soon as Terraform loads it and delivers the same two families on macOS, Linux and Windows, which it suspects is TraderTraitor. The second-stage backdoor resolves its command-and-control address by reading an operator profile's public \"website\" field from the Nostr decentralized relay network."
  - claim_id: 2a5db7e6de
    entry: 2026-09-21/tradertraitor-terraform-lockfile-nostr-dead-drop
    surface: "body"
    kind: cited
    text: "A provider binary can also be trojanized itself, so restrict untrusted Terraform providers and verify provider checksums ("
    urls: ["https://www.zscaler.com/blogs/security-research/suspected-tradertraitor-group-uses-trojanized-terraform-provider-deliver"]
  - claim_id: 43cedd7bee
    entry: 2026-09-21/tradertraitor-terraform-lockfile-nostr-dead-drop
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** any organization whose engineering staff use Terraform or other HashiCorp tooling and could plausibly be approached through fake technical-recruiting outreach should treat an unfamiliar or newly-cloned repository's lockfile as untrusted input: check the source registry a lockfile's providers resolve to before running `terraform init`, since a lockfile can silently redirect a trusted command to attacker infrastructure."
  - claim_id: 71e80b1691
    entry: 2026-09-21/tradertraitor-terraform-lockfile-nostr-dead-drop
    surface: "body"
    kind: derived
    text: "**Triage:** developers legitimately run `terraform init` against new or unfamiliar repositories constantly, so the command itself is not the signal: the discriminator is the lockfile's declared provider source pointing to a domain that is not `registry.terraform.io` or a known private registry the organization operates."
