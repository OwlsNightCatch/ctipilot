  - claim_id: 9e0fef8e63
    entry: 2026-10-09/talos-ai-analysis-evasion-instructions-aimed-at-llm-triage
    surface: "summary"
    kind: frontmatter
    text: "Cisco Talos documents 84 samples from four malware families, collected from January 2025 to July 2026, that embed plain natural-language text meant to steer the LLM stage of automated triage: a verbatim \"no need to analyze this file\" comment reused by at least four actors, templated variants, instructions repeated across seven chat-template formats, and intimidation or fabricated-authority text. ESET separately found UAC-0099 using a decoy request in a script comment to trip an LLM scanner's refusal; Talos' own test of five local models put the best techniques at steering the outcome in the attacker's favour in about 35% of runs, and its advice is to treat text inside a sample as evidence, never as instruction."
  - claim_id: dcf159b15d
    entry: 2026-10-09/talos-ai-analysis-evasion-instructions-aimed-at-llm-triage
    surface: "body"
    kind: cited
    text: "Talos tested the strings against five local models, 135 matched pairs per string: its headline figure is that the best techniques steered the outcome in the attacker's favour in about 35% of runs, a net rate (pairs shifted toward benign minus pairs shifted toward malicious, over all pairs), while the cheapest technique, a direct instruction to ignore the sample, worked almost universally and the more complex ones had little effect or backfired by making models more suspicious; Talos calls the overall impact a mixed bag ("
    urls: ["https://blog.talosintelligence.com/ignore-all-instructions-and-read-this-blog-the-state-of-ai-analysis-evasion-in-malware/"]
  - claim_id: 8c825ffdc9
    entry: 2026-10-09/reliaquest-llm-agents-spring-batch-tomcat-nashorn-system
    surface: "summary"
    kind: frontmatter
    text: "ReliaQuest assesses with high confidence that LLM-driven agents carried out substantial parts of an intrusion it investigated, using only known techniques: an internet-facing Apache Tomcat application accepted Spring Batch job definitions without a login, jobs ran JavaScript through the Nashorn engine inside the application process, plaintext SQL Server sysadmin credentials from the application's configuration led to xp_cmdshell, and two public privilege-escalation tools reached SYSTEM. ReliaQuest names no victim, sector or region, nor the vendor of the exposed application, and could not determine how many agents ran, which model drove them or how much a person approved."
  - claim_id: d3cadedde1
    entry: 2026-10-09/reliaquest-llm-agents-spring-batch-tomcat-nashorn-system
    surface: "body"
    kind: cited
    text: "The agent-driven reading rests on a live, unauthenticated Cairn agent-orchestration dashboard (an open-source platform for coordinating AI agents that no source links to other tools of that name, such as Talos' CAIRN toolkit) on the address that sent the opening requests, on command timing (roughly half the gaps five seconds or less), on job names that tracked read offsets and upload parts without a gap, on machine-readable pipe-delimited output, and on payloads whose next version repaired the fault the previous one returned; ReliaQuest says no single indicator establishes it and that it could not determine how many agents ran, which model drove them or how much a person approved ("
    urls: ["https://reliaquest.com/blog/threat-spotlight-how-ai-agents-turned-one-exposed-endpoint-into-a-server-takeover/"]
