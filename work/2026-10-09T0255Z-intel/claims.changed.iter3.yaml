    kind: frontmatter
    text: "The Confederation, Publica and the supplier PK Softech AG (Reinach BL) confirmed on 2026-10-08 that unknown attackers used malware to reach part of the supplier's IT infrastructure at the end of September and that data left its systems; the Federal Prosecutor's Office is investigating. Publica insures, among others, staff of the federal administration and the ETH domain, about 70,000 active members and 41,600 pensioners at the end of 2025, and says name, date of birth, AHV number, address, contact details, salary and pension data and partner details could have been taken; which data is in the stolen set, how the attackers got in and who they are is not public."
