  - title: "ASOS: the attackers' vector is now stated, an employee account obtained by impersonating a trusted contact, used on third-party platforms, then a rogue push notification"
    borderline: true
    borderline_reason: >
      The 2026-10-08 fire borderline-dropped ASOS for "no platform or vector named"; ASOS has since named the vector (social
      engineering of an employee, credentials reused on third-party platforms). Still a UK retailer with no public-sector nexus;
      the transferable parts are the help-desk-style impersonation of a trusted contact and the abuse of a company's own
      customer-messaging channel for extortion (PD-11 b, extortion mechanics). Lean drop unless the main agent wants the
      customer-messaging-channel angle for administrations that operate citizen apps.
    sources:
      - { url: "https://therecord.media/asos-says-hackers-tricked-employee-access-push-notification", publisher: "The Record", date: "2026-10-08", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/asos-links-data-breach-to-social-engineering-attack-credential-theft/", publisher: "BleepingComputer", date: "2026-10-08", role: "corroborating" }
    discovery_trace: >
      first seen at: bleepingcomputer, URL https://www.bleepingcomputer.com/feed/ (feed, item dated 2026-10-08T07:42:46-04:00) ->
      article https://www.bleepingcomputer.com/news/security/asos-links-data-breach-to-social-engineering-attack-credential-theft/ ->
      pivot: The Record (feed https://therecord.media/feed, item dated
      2026-10-08T16:57Z) https://therecord.media/asos-says-hackers-tricked-employee-access-push-notification. ASOS's own customer
      notification is quoted by both outlets; it was not fetched directly.
    summary: |
      ASOS told customers on 2026-10-08, as relayed by BleepingComputer and The Record, that an unauthorised party gained access to an
      employee account by impersonating a trusted contact to obtain login credentials, and used those credentials to reach
      information on certain third-party platforms the company uses; names, contact details and some non-personal account data
      were accessed, no payment card data or passwords, and ASOS did not say how many customers are affected or whether data was
      copied out. The rogue in-app push notification of 2026-10-06 pointed to a Telegram channel of a group calling itself Xuanye
      Group, which claimed a Snowflake compromise and, to the BBC, an attack on the Simon AI service integrated with Snowflake;
      Snowflake denies being breached and Simon AI has not commented (The Record). The group published no samples; the platform
      through which the push was sent is not named by ASOS.
    region_nexus: "none direct (UK retailer)"
    primary_sector_nexus: "none"
    sector: "retail"
