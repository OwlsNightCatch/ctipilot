      - { url: "https://www.cash.ch/news/top-news/angriff-auf-publica-lieferanten-lohndaten-konnten-betroffen-sein-975020", publisher: "AWP via cash.ch", date: "2026-10-08", role: "corroborating" }
    discovery_trace: >
      first seen at: Netzwoche RSS, URL https://www.netzwoche.ch/rss.xml (fetched in this run's Swiss-feed sweep; item dated
      2026-10-08T09:16:39) -> Netzwoche article https://www.netzwoche.ch/news/2026-10-08/bundespensionskasse-publica-meldet-datenabfluss
      -> pivot: WebSearch ("Publica Datenabfluss PK Softech Pensionskasse Bund Hackerangriff Versicherte informiert") ->
      watson https://www.watson.ch/schweiz/digital/228405160-pensionskasse-des-bundes-cyberangriff-auf-publica-softwarefirma
      (its Quellen list the federal release and the supplier statement) -> primary: admin.ch release
      https://www.admin.ch/de/newnsb/FjG4XOIms04s; supplier statement https://pksoftech.ch/de/newsreader/Cyberangriff-auf-die-PKSoftechAG;
      Publica notice https://www.publica.ch/de/ueber-uns/aktuell/cyberangriff-auf-softwarelieferant-von-publica-datenabfluss-bestaetigt.
      Cross-check: Ransomware.live /v2/countrycyberattacks/CH lists PK Softech AG as a press-confirmed incident added 2026-10-08.
    summary: |
      On 2026-10-08 the Swiss federal administration and the federal pension fund Publica disclosed that an external software
      supplier of Publica was hit by a cyberattack at the end of September 2026 and that data left the supplier. Publica
      confirmed to the AWP agency that the supplier is PK Softech AG (Reinach BL), maker of the PK/S pension-administration
      software that Publica has used since 2017 (Inside IT: a CHF 12.6 million award). PK Softech's own statement says unknown
      persons used malware to reach part of its IT infrastructure, that it disconnected the affected environment, brought in
      external specialists, informed the authorities and filed a criminal complaint, that data must be assumed to have left its
      systems, and that it has been fully available to customers again since 2 October 2026; it told AWP the outflow came from its
      own infrastructure and not from customers' systems. The Federal Prosecutor's Office has opened an investigation, and the
      administration says no federal office other than Publica does business with the firm. Publica's letter to its active insured
      (seen by watson and SRF) lists name, date of birth, AHV number, address, business and private phone and email, pension data
      (salary, insured earnings, pension assets) and marital or partner status as data that may have been taken; Publica says
      pension assets are safe, pensions are still paid and operations are unaffected, and warns of identity misuse. The scope is
      open: Publica insures federal staff and the ETH domain (annual report: about 70,000 active insured and 41,600 pensioners; SRF
      puts it at about 66,000 and 40,000), and it is not known how many are affected. No actor is named; watson writes that the
      public information points to a ransomware group but that this is not officially confirmed, and Publica declined to say
      whether a ransom demand or a publication threat exists. Ransomware.live's recent-victims feed (2026-10-05 to 2026-10-08) carried
      no leak-site listing for PK Softech. watson also reports that PK Softech serves other pension funds and had listed
      Migros-Pensionskasse, Pensionskasse Post and the Bernische Pensionskasse as references on its website; whether their data is
      affected is under investigation, and the home pages of the latter two (fetched) carried no notice. SRF draws the parallel to
      Xplain (2023) and the supplier-security rules the Federal Council adopted afterwards. Sources differ in nuance: SRF writes that
      the attackers "apparently" reached Publica data through the supplier, PK Softech that the outflow was from its own
      infrastructure; both fit a supplier holding copies of customer data.
    region_nexus: "switzerland; federal (Confederation staff and the ETH domain); the same supplier serves other pension funds, one of them cantonal (Bernische Pensionskasse, named as a former website reference)"
    primary_sector_nexus: "direct: public-sector personnel data (federal administration and ETH domain) held at a software supplier"
    sector: "public-sector"
    pd11_ground: "(c) confirmed home-region, federal public-sector incident with victim and federal disclosure and an operational lesson; also supplier-chain blast radius (other pension funds). Above the incident floor on the nexus and the named data classes, though vector and actor are not public."
