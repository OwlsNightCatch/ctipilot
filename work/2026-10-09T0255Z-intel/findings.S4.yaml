      supplier's infrastructure; T1199 maps the exposure path (a trusted supplier holding the customer's staff data). No
      initial-access, persistence or exfiltration technique is stated by any source; the main agent should not add one.
    affected_products: []
    affected_products_note: "No product flaw is reported: the supplier's own infrastructure was compromised, not the PK/S product. PK/S is named only as the software Publica runs."
    entity_keys: []
