        attribution: "watson.ch (SDA/AWP)"
        source_url: "https://www.watson.ch/schweiz/gesellschaft-politik/909357949-hackerangriff-auf-publica-lieferanten-lohndaten-koennten-betroffen-sein"
      - quote: "Die öffentlich bekannten Informationen lassen auf einen Angriff durch eine Ransomware-Bande schliessen. Diese Annahme wurde bislang nicht offiziell bestätigt."
        attribution: "watson.ch"
        source_url: "https://www.watson.ch/schweiz/digital/228405160-pensionskasse-des-bundes-cyberangriff-auf-publica-softwarefirma"
    extended_notes: |
      Exposure (as sources state it): Publica and the ETH domain's insured, current and retired federal staff; any other customer of
      PK Softech's PK/S software (customer list not public; watson names three former website references, none has published a
      notice that could be found). Open questions a reader should track: how many insured are affected, whether other pension funds'
      data was in the affected environment, whether an extortion demand or leak-site listing follows, the intrusion vector.
      What the exposure enables (analyst inference from the listed data classes, not stated by any source): name + date of birth +
      AHV number + address + phone + email is the knowledge-based proof many helpdesk, account-recovery and benefit/insurance
      processes accept, and with salary and marital status it makes pension- or payroll-themed pretexting credible. The telemetry
      classes where it would show: inbound mail and voice calls to federal and ETH-domain staff citing pension fund, AHV number,
      salary or partner; helpdesk and identity-verification events that pass on name, birth date and AHV number alone; HR and payroll
      requests to change bank details or contact data. Publica set up a contact point for suspicious activity and will inform again.
      Supplier lens: the case repeats the Xplain pattern (data of federal bodies reached through a software supplier); SRF notes the
      Federal Council adopted supplier-security requirements after the Xplain administrative investigation, which now apply, and the supplier-held-copy point (data copies sitting
      outside the customer) is the lesson for any administration that exports personnel or beneficiary data to a vendor.
      Cross-reference candidates for the composer: the open Beyond Gravity backlog row (a second federal-nexus supplier incident,
      still no vector or actor).
