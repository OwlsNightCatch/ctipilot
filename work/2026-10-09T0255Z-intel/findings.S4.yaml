      primary: IDCF notice https://www.idcf.jp/news/topics/20261007002 (Japanese, translated inline).
    summary: |
      IDC Frontier, a SoftBank subsidiary, says in its second report of 2026-10-07 that a third-party ransomware attack that began
      about 03:40 local time on 2026-10-07 disrupted East Japan Region 1 of its IDCF Cloud (infrastructure-as-a-service), that it
      cut the region off the network and stopped the systems, that the affected customers number 495 companies and local
      governments (jichitai), that it is still identifying and closing the intrusion route, and that it has switched off the
      externally reachable customer management consoles of all other regions while it verifies their safety. BleepingComputer adds,
      from customer screenshots of the intruder's message, a claim that it took seven minutes to breach the region and that 225
      databases (3.6 PB), 239 hypervisors, 16,000 VM disks and 554,153 snapshots were encrypted or wiped; that is the intruder's
      claim, not IDCF's. It also reports a Nissui logistics subsidiary outage tied to a third-party data centre, with the link to IDCF
      unestablished. No attacker group, vector or data-theft statement is public.
    region_nexus: "none direct (Japan); transferable only as a hosting-provider blast-radius example for administrations that run workloads at a shared IaaS provider"
    primary_sector_nexus: "indirect: local-government tenants of a shared cloud provider"
