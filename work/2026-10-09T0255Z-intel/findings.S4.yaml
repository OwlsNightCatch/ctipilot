    technique_note: "Valid-account use with credentials obtained by social engineering is stated by ASOS; the impersonation channel (voice, chat, mail) is not."
    affected_products: []
    entity_keys: []
    new_entities:
      - { key: "actor:xuanye-group", type: actor, name: "Xuanye Group", aliases: [], summary: "Newly named extortion persona that sent a rogue push notification from ASOS's app on 2026-10-06 and claims the theft of ASOS customer data via Snowflake and the Simon AI service; Snowflake denies a breach and researchers had not known the name before (The Record, 2026-10-08)." }
