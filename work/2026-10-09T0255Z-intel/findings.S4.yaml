  - title: "IDC Frontier (IDCF Cloud, Japan): ransomware at East Japan Region 1 hits 495 companies and local governments; management consoles of all other regions shut down"
    borderline: true
    borderline_reason: >
      The 2026-10-08 fire borderline-dropped IDCF as "no vector or actor, generic takeaway". Facts new since then: the provider's
      second report (2026-10-07) names 495 customer companies and local governments and the shutdown of customer management
      consoles in the other regions as a precaution; BleepingComputer (2026-10-08) relays the intruder's console message (a claim).
      Still no vector, no named group, no Swiss or EU exposure; lean drop again, keep only if the main agent wants a
      provider-blast-radius example (hypervisor-layer wipe incl. snapshots, local-government tenants).
    sources:
      - { url: "https://www.idcf.jp/news/topics/20261007002", publisher: "IDC Frontier (IDCF), second report", date: "2026-10-07", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/ransomware-attack-disrupts-japans-idcf-cloud-used-by-govt-clients/", publisher: "BleepingComputer", date: "2026-10-08", role: "corroborating" }
    discovery_trace: >
      first seen at: bleepingcomputer, URL https://www.bleepingcomputer.com/feed/ (feed, item dated 2026-10-08T16:09:45-04:00) ->
