          summary: "PK Softech AG of Reinach BL, the pension-fund software supplier of Publica, suffered a malware-based intrusion at the end of September 2026; the supplier and the federal administration confirmed on 2026-10-08 that data left the supplier's systems, the Federal Prosecutor's Office investigates, and Publica says salary, AHV number and contact data of insured persons may be affected (admin.ch, PK Softech, SRF, watson, 2026-10-08)." }
