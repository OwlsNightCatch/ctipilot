items:
  - title: "ShinyHunters MSG breach anatomy: vishing-to-Microsoft Entra access kills 26M customer records including biometric surveillance data"
    sources:
      - { url: "https://www.404media.co/how-hackers-broke-into-madison-square-garden/", publisher: "404 Media (Joseph Cox)", date: "2026-06-24", role: "primary" }
      - { url: "https://thenextweb.com/news/shinyhunters-madison-square-garden-45gb-data-leak-facial-recognition", publisher: "The Next Web", date: "2026-06-16", role: "corroborating" }
      - { url: "https://www.bankinfosecurity.com/breach-roundup-shinyhunters-leaks-26m-msg-records-a-32019", publisher: "BankInfoSecurity/ISMG", date: "2026-06-16", role: "corroborating" }
      - { url: "https://abnormal.ai/blog/shinyhunters-sso-social-engineering-mfa-identity-compromise", publisher: "Abnormal Security", date: "2026-06-24", role: "technical-depth" }
    discovery_trace: "first seen at: databreaches-net RSS feed (item dated 2026-06-24), URL https://databreaches.net/2026/06/24/how-hackers-broke-into-madison-square-garden/ → primary: 404 Media, URL https://www.404media.co/how-hackers-broke-into-madison-square-garden/ → corroborating: TNW URL https://thenextweb.com/news/shinyhunters-madison-square-garden-45gb-data-leak-facial-recognition → technical depth: Abnormal Security URL https://abnormal.ai/blog/shinyhunters-sso-social-engineering-mfa-identity-compromise"
    summary: |
      ShinyHunters (UNC6240) breached Madison Square Garden Entertainment on June 5, 2026 via a vishing attack on a low-level employee, gaining access to Microsoft Entra — MSG's identity and network access platform. The attacker's social-engineering chain follows a five-step template documented by Abnormal Security: (1) employee recon and phishing-page preparation mimicking Microsoft Entra or Okta; (2) live voice call impersonating internal IT, manufacturing urgency around MFA reset; (3) real-time credential and MFA-code harvesting via a target-branded phishing page served during the call; (4) attacker-controlled MFA device enrollment; (5) SSO pivot into connected SaaS environments. MSG missed a June 15 ransom deadline; 45 GB of data including 26M customer/corporate records was published June 16. The dump contains facial-recognition biometric tracking logs, internal threat assessments, and celebrity risk-classification dossiers — including a "Facial Recognition Activists.docx" containing detailed profiles on three named privacy advocates who publicly opposed MSG's FR programme. This is MSG's second major breach in under a year; the first (Cl0p/Oracle E-Business Suite, August–December 2025) exposed 131,070 employees' SSNs. MITRE ATT&CK mapping: T1566.004 Spearphishing Voice (vishing), T1078.004 Cloud Accounts (Entra compromise), T1556.006 MFA Manipulation, T1567 Exfiltration to Web Service.
    ch_eu_nexus: "ShinyHunters active against European targets; attack technique (vishing + SSO identity platform compromise) directly applicable to EU public-sector Microsoft Entra/Okta deployments"
    public_sector_nexus: "indirect — technique class; MSG is a private-sector victim but vishing-to-Entra is the same kill chain seen against public-sector targets"
    sector: "entertainment, sports; technique applicable across all sectors using SSO identity platforms"
    cves: []
    actors_campaigns_malware: ["ShinyHunters", "UNC6240"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "The hackers that stole a large cache of data from Madison Square Garden called a low level employee and tricked them into letting the hackers into MSG's systems, according to the hackers and 404 Media's review of the stolen data."
        attribution: "404 Media"
        source_url: "https://www.404media.co/how-hackers-broke-into-madison-square-garden/"
      - quote: "it was a low-level employee who fell prey to the group's attack, granting them access to Microsoft Entra, which MSG uses to manage identity and network access"
        attribution: "The Next Web"
        source_url: "https://thenextweb.com/news/shinyhunters-madison-square-garden-45gb-data-leak-facial-recognition"
      - quote: "Attackers contact employees directly by phone, often impersonating internal IT or security personnel. They create urgency around account verification, MFA configuration, or login troubleshooting in order to convince targets to follow instructions that appear to be part of legitimate security processes."
        attribution: "Abnormal Security"
        source_url: "https://abnormal.ai/blog/shinyhunters-sso-social-engineering-mfa-identity-compromise"
    extended_notes: |
      Detection hooks: Entra/AAD audit logs for new MFA device registration events (event category: Authentication methods) combined with anomalous sign-in location or user-agent; identity-protection risk events for impossible travel post-MFA enrollment; unusual SaaS app token issuances from recently-enrolled MFA device. Hardening: phishing-resistant MFA (FIDO2/passkeys) that cannot be captured in real-time; number-matching in Authenticator; conditional access policies requiring compliant device for MFA enrollment. The vishing vector is human-layer: security-awareness training specifically on IT-impersonation calls requesting credential verification is the primary control. MSG's surveillance data (biometrics, dossiers) was a high-value target beyond typical customer PII — organizations holding biometric or sensitive behavioural data should segregate it from SSO-accessible systems.

  - title: "Tata Electronics confirms breach; World Leaks (ex-Hunters International) publishes 630 GB of Apple and Tesla supply-chain documents"
    sources:
      - { url: "https://securityaffairs.com/194237/data-breach/tata-electronics-confirms-data-breach-after-630gb-leak-claim-targets-apple-and-tesla.html", publisher: "SecurityAffairs (Pierluigi Paganini)", date: "2026-06-23", role: "primary" }
      - { url: "https://techcrunch.com/2026/06/22/tata-electronics-a-major-tech-supplier-to-apple-and-tesla-confirms-data-breach/", publisher: "TechCrunch", date: "2026-06-22", role: "corroborating" }
      - { url: "https://www.bleepingcomputer.com/news/security/tata-electronics-confirms-cyberattack-as-hackers-leak-data/", publisher: "BleepingComputer", date: "2026-06-23", role: "corroborating" }
    discovery_trace: "first seen at: databreaches-net RSS feed (item dated 2026-06-24), URL https://databreaches.net/2026/06/24/tata-electronics-confirms-cyberattack-as-hackers-leak-data/ → primary: SecurityAffairs URL https://securityaffairs.com/194237/data-breach/tata-electronics-confirms-data-breach-after-630gb-leak-claim-targets-apple-and-tesla.html → corroborating: TechCrunch URL https://techcrunch.com/2026/06/22/tata-electronics-a-major-tech-supplier-to-apple-and-tesla-confirms-data-breach/"
    summary: |
      Tata Electronics, a key Apple iPhone assembler (roughly one-third of India's Apple iPhone production) and Tesla component supplier, confirmed on June 22 that it identified a cybersecurity incident "a few weeks ago" affecting some systems. World Leaks — the extortion-focused group that emerged in 2025 after Hunters International rebranded following law-enforcement pressure and abandoned encryption in favour of pure data theft — has published more than 630 GB of data across 204,300 files on its dark-web leak site. TechCrunch reviewed a sample and found what appear to be Apple supplier quality-inspection specifications and Tesla manufacturing documents. The source of the 630 GB leak is the dark-web forum posting; Tata Electronics said operations were unaffected. Reuters reported that Tata notified some iPhone assembly workers about the breach and that a ransom demand was made. The company has not disclosed the attack vector, the initial access point, or the scope of affected systems. Apple is investigating.
    ch_eu_nexus: "Supply-chain intelligence exposure; EU automotive and electronics manufacturers sourcing from Tata may have contract details in the leaked corpus. World Leaks (ex-Hunters International) is an active extortion actor targeting EU organizations."
    public_sector_nexus: "indirect — supply-chain exposure"
    sector: "manufacturing, technology, supply-chain"
    cves: []
    actors_campaigns_malware: ["World Leaks", "Hunters International"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "A few weeks ago, Tata Electronics identified a cybersecurity incident on some of our systems. Our response protocols were deployed immediately, and the incident has had no impact on our operations across businesses, which remain unaffected."
        attribution: "Tata Electronics spokesperson, quoted by BleepingComputer"
        source_url: "https://securityaffairs.com/194237/data-breach/tata-electronics-confirms-data-breach-after-630gb-leak-claim-targets-apple-and-tesla.html"
      - quote: "WorldLeaks is an extortion-focused cybercrime group that steals company data to pressure victims into paying, threatening public leaks if they refuse. The group emerged in 2025 after rebranding from Hunters International, a ransomware gang active since 2023."
        attribution: "SecurityAffairs"
        source_url: "https://securityaffairs.com/194237/data-breach/tata-electronics-confirms-data-breach-after-630gb-leak-claim-targets-apple-and-tesla.html"
    extended_notes: |
      Attack vector not publicly disclosed. Hunters International / World Leaks historically gained initial access via phishing, exploitation of public-facing apps (credential theft), and in some cases purchased access from initial-access brokers. The pattern change from ransomware to pure extortion (data theft only) means defenders cannot rely on detection of file encryption activity as a signal — hunt for large-volume outbound transfers, staging directories, and credential-harvesting tooling. EU/CH defenders with supply-chain relationships to Tata should review what proprietary design or contract data may have been shared.

  - title: "Ukrposhta app disrupted after overnight cyberattack; IT Army of Russia claims prior-week server breach and user-data exfiltration"
    sources:
      - { url: "https://therecord.media/ukraine-state-postal-operator-reports-disruption", publisher: "The Record (Recorded Future News)", date: "2026-06-25", role: "primary" }
      - { url: "https://english.nv.ua/business/cyberattack-disrupts-ukrposhta-app-and-digital-services-50619276.html", publisher: "New Voice of Ukraine", date: "2026-06-25", role: "corroborating" }
    discovery_trace: "first seen at: databreaches-net RSS feed (item dated 2026-06-25), URL https://databreaches.net/2026/06/25/ukraines-national-postal-service-ukrposhta-hacked-overnight/ (403 on bridge — covered via The Record) → primary: The Record, URL https://therecord.media/ukraine-state-postal-operator-reports-disruption → corroborating: New Voice of Ukraine URL https://english.nv.ua/business/cyberattack-disrupts-ukrposhta-app-and-digital-services-50619276.html"
    summary: |
      Ukraine's national postal operator Ukrposhta (approximately 32,000 employees, 6,000+ post offices) confirmed on June 25 that an overnight "hostile attack" on its IT systems caused temporary disruptions to its mobile application and digital services. The operator said its specialists were restoring functionality and did not disclose whether data was compromised or who was responsible. Earlier in the week (pre-June 25), a pro-Russian hacktivist group calling itself the "IT Army of Russia" — active since March 2025 and distinct from Ukraine's civilian IT Army — claimed it had breached Ukrposhta's infrastructure several weeks prior, gained access to a server, and exfiltrated a user database along with internal data. The Record notes it could not independently verify the group's claims. The timing of the public disruption (June 25) coinciding with the hacktivist claim publication is consistent with a coordinated pressure-disclosure pattern, but Ukrposhta provided no confirmation of data exfiltration. The incident is part of a sustained campaign against Ukrainian critical infrastructure by Russian-aligned hacktivist groups.
    ch_eu_nexus: "EU critical-infrastructure (postal/logistics); Russia-aligned hacktivist disruption of civilian infrastructure is a pattern of concern for EU public postal operators and logistics providers"
    public_sector_nexus: "direct — Ukrposhta is a state-owned national operator"
    sector: "postal, logistics, public-sector"
    cves: []
    actors_campaigns_malware: ["IT Army of Russia"]
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "Due to an overnight hostile cyberattack on IT systems, the Ukrposhta mobile application is temporarily experiencing disruptions"
        attribution: "Ukrposhta statement via The Record"
        source_url: "https://therecord.media/ukraine-state-postal-operator-reports-disruption"
      - quote: "a pro-Russian hacktivist group calling itself the IT Army of Russia claimed responsibility for the attack. The group alleged it had breached Ukrposhta's infrastructure several weeks earlier, gained access to one of the company's servers and exfiltrated a database containing user information, along with other internal data. Recorded Future News could not independently verify the group's claims."
        attribution: "The Record"
        source_url: "https://therecord.media/ukraine-state-postal-operator-reports-disruption"
    extended_notes: |
      Confidence is MEDIUM not HIGH because: (1) data exfiltration claim is unverified — only hacktivist self-reporting; (2) Ukrposhta confirmed disruption but not data compromise. The IT Army of Russia (pro-Russian, not to be confused with the Ukrainian civilian IT Army) has been documented using a mix of DDoS and opportunistic exploitation rather than sophisticated intrusion tooling. Pattern for EU postal operators: review network segmentation between customer-facing digital services and back-end databases; ensure customer data is not co-resident with internet-facing service infrastructure.

