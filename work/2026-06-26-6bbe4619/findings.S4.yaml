  - title: "DraftKings credential-stuffing: third co-conspirator 'Snoopy' (Nathan Austad) sentenced 18 months; full 2022 scheme documented"
    sources:
      - { url: "https://www.securityweek.com/third-draftkings-hacker-sentenced-to-18-months-in-prison/", publisher: "SecurityWeek", date: "2026-06-25", role: "primary" }
      - { url: "https://www.helpnetsecurity.com/2026/06/25/hacker-sentenced-draftkings-credential-stuffing-attac/", publisher: "Help Net Security", date: "2026-06-25", role: "corroborating" }
    discovery_trace: "first seen at: databreaches-net RSS feed (item dated 2026-06-25), URL https://databreaches.net/2026/06/25/third-defendant-sentenced-to-prison-for-hacking-draftkings/ → primary: SecurityWeek URL https://www.securityweek.com/third-draftkings-hacker-sentenced-to-18-months-in-prison/ → corroborating: HelpNetSecurity URL https://www.helpnetsecurity.com/2026/06/25/hacker-sentenced-draftkings-credential-stuffing-attac/"
    summary: |
      Nathan Austad ("Snoopy"), of Farmington, Minnesota, was sentenced on June 25, 2026 to 18 months in federal prison for his role in a November 2022 credential-stuffing attack against DraftKings (the fantasy sports and betting platform, described without naming in DOJ filings). Austad pleaded guilty in December 2025 to conspiracy to commit computer intrusion. The scheme used username/password pairs purchased from prior unrelated breaches to gain unauthorized access to approximately 60,000 DraftKings accounts; roughly 1,600 were fully exploited with ~$600,000 stolen by adding attacker-controlled payment methods and draining balances. Austad operated his own "Snoopy" account-selling shop, receiving approximately $465,000 in cryptocurrency proceeds. He was also ordered to pay $463,684 in forfeiture and $1,327,061 in restitution. Austad is the third defendant sentenced: Joseph Garrison received 18 months (January 2024); Kamerin Stokes ("TheMFNPlug") received 30 months (April 2026). Technique class: T1110.004 Credential Stuffing. The DOJ formally confirmed the credential stuffing mechanism using stolen credentials from prior third-party breaches as the sole intrusion vector — no zero-days, no malware beyond the stuffing automation.
    ch_eu_nexus: "global applicability; credential-stuffing against consumer accounts is a persistent threat for EU financial, gaming, and retail platforms subject to PSD2 and GDPR notification requirements"
    public_sector_nexus: "indirect"
    sector: "gaming, financial services"
