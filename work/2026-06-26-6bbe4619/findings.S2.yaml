    novelty: new
    evidence:
      - quote: "NCSC-NL rates this advisory: probability medium, damage high. Affected: GitLab versions 8.3 through 19.1.0. Fixed in: 18.11.6, 19.0.3, 19.1.1."
        attribution: "NCSC-NL"
        source_url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0211"
      - quote: "GitLab patch release 19.1.1, 19.0.3, and 18.11.6 addresses critical security issues including improper authorisation, cross-site scripting, code injection, and server-side request forgery"
        attribution: "GitLab"
        source_url: "https://docs.gitlab.com/releases/patches/patch-release-gitlab-19-1-1-released/"
    extended_notes: |
      MITRE ATT&CK mappings: SSRF via mirror sync → T1590.002 (Gather Victim Network Info via SSRF); code injection in CI/CD → T1195.002 (Supply Chain Compromise — Compromise Software Supply Chain) + T1059; improper authorisation on package API → T1078 (Valid Accounts — project-level token abuse); DAST secrets in logs → T1552.001 (Credentials in Files). Priority: self-managed GitLab instances in public-sector DevOps environments should patch within 48 hours given the SSRF and code-injection findings.

