    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "Black Lotus Labs uncovered BambooToken, an emerging malware family using the Message Queueing and Telemetry Transport (MQTT) to quietly control infected Windows and Linux systems."
        attribution: "Lumen Black Lotus Labs"
        source_url: "https://www.lumen.com/blog/en-us/the-banana-stand-brokering-and-managing-infections-across-asia-using-mqtt"
      - quote: "The Windows agent was sideloaded by the Tendyron \u201cOnKey\u201d program, which validates system access by retrieving cryptographic material stored on a USB drive. This product line is popular in Chinese banking and government networks."
        attribution: "Lumen Black Lotus Labs"
        source_url: "https://www.lumen.com/blog/en-us/the-banana-stand-brokering-and-managing-infections-across-asia-using-mqtt"
      - quote: "A report today from Lumen's research arm, Black Lotus Labs, notes that BambooToken infected systems by side-loading via a digitally signed Tendyron OnKey USB-token software or by impersonating the Kingsoft Office productivity suite."
        attribution: "BleepingComputer, Bill Toulas"
        source_url: "https://www.bleepingcomputer.com/news/security/bambootoken-malware-controls-windows-and-linux-systems-via-mqtt/"
    extended_notes: |
      Confidence is MEDIUM rather than HIGH because Lumen itself qualifies several key claims: it cannot confirm
      whether the "dead code" surveillance modules (keylogger, clipboard, webcam, audio) were ever operational,
      cannot attribute the cluster to a named actor, and cannot confirm Tendyron's/Kingsoft's certificates were
      abused vs. the binaries being merely sideloading-vulnerable. IOCs were shared by Lumen with defenders but are
      deliberately excluded here per no-IOC policy. Not previously covered in the store (checked prior_coverage.json
      and entities/registry.yaml for Tendyron/OnKey/BambooToken/Black Lotus Labs MQTT — no match).
