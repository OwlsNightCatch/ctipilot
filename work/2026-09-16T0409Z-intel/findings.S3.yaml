  - title: "BambooToken — previously undocumented MQTT-based Windows/Linux malware framework sideloaded via a signed Chinese hardware-token utility, active since Feb 2023"
    sources:
      - { url: "https://www.lumen.com/blog/en-us/the-banana-stand-brokering-and-managing-infections-across-asia-using-mqtt", publisher: "Lumen Black Lotus Labs", date: "2026-09-15", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/bambootoken-malware-controls-windows-and-linux-systems-via-mqtt/", publisher: "BleepingComputer", date: "2026-09-15", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"security research report \\\"September 16, 2026\\\" vulnerability OR malware OR APT\") → pivot: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/bambootoken-malware-controls-windows-and-linux-systems-via-mqtt/ → primary: Lumen Black Lotus Labs, URL https://www.lumen.com/blog/en-us/the-banana-stand-brokering-and-managing-infections-across-asia-using-mqtt"
    summary: |
      Lumen's Black Lotus Labs disclosed (2026-09-15) BambooToken, a previously undocumented, unattributed malware
      framework using MQTT (a pub/sub IoT messaging protocol) for command-and-control against Windows and Linux
      hosts — a technique the researchers say has appeared in only three prior campaigns ever (IOCONTROL, PlugX/
      Korplug, WailingCrab). Active since at least February 2023 (v1, HTTP-based C2) through a July 2026 Linux
      variant (v2.1), the Windows toolset is sideloaded (T1574.002) via Tendyron's "OnKeySrv" — a digitally-signed
      USB hardware-token utility widely deployed in Chinese banking/government networks for cryptographic identity
      verification — with the malicious payload "OnKeyToken_KEB.dll" side-loaded into the legitimate signed process;
      one variant instead masquerades as "Zhuhai Kingsoft Office Software Co., Ltd." (T1036.005). Lumen states neither
      Tendyron's nor Kingsoft's code-signing certificates were compromised — the actor abuses a sideloading-vulnerable
      but otherwise benign signed binary. The v2.x MQTT client (using the open-source Mosquitto library) subscribes
      to a global broadcast topic plus per-host GUID-scoped topics (Plugin/removePlugin/unPlugin) and publishes an
      online/offline heartbeat with a host GUID; because the infected host only talks to a broker rather than the
      C2 directly, and communication is async pub/sub, this is materially more evasive to network-based detection
      than direct C2 callbacks. Implemented handlers include SHELL (spawns a command shell, T1059), FILEEX
      (upload/download/delete files) and ONLINE (WMI-based host enumeration: T1082, T1047 — OS, BIOS, CPU, memory,
      MAC, product key). A recovered plugin performs security-software discovery via WMI every 5 seconds and beacons
      results out over plain HTTP (T1518.001). Static "dead code" strings (COM_clipboard, KEY_RECOURD) suggest
      unexecuted or in-development keylogging/clipboard/webcam/audio capture modules that Lumen could not confirm
      were ever operational. Compromised infrastructure across roughly a dozen enterprise victims spans Asia and
      South America — hotels, biomedical firms, law firms, a financial organization and a Lithuanian crypto site —
      plus a compromised GitLab instance in Hong Kong, raising a software-supply-chain concern. Lumen assesses
      targeting patterns are consistent with China-aligned operations but could not attribute the cluster to any
      known named group.
    region_nexus: "primarily Asia and South America (confirmed victims); no direct Swiss/European nexus reported, but the MQTT-broker C2 evasion technique and hardware-token sideloading vector are directly transferable hunting/detection concerns for any organization running Windows or Linux estates"
    primary_sector_nexus: "indirect — confirmed victim verticals are hospitality, biomedical, legal, financial and a GitLab-hosted software developer, not public-sector; relevance to this constituency is the novel MQTT C2 technique class and the signed-binary-sideloading vector, both broadly applicable detection/hunt concerns"
    sector: "cross-sector"
    cves: []
    techniques: [T1574.002, T1036.005, T1071, T1059, T1082, T1047, T1518.001, T1105]
    affected_products: []
    entity_keys: []
    new_entities:
