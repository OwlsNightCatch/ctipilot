  - title: "CHOSEN BRICK — Iran MOIS Telegram-C2 Windows spyware targeting dissidents, activists and journalists; joint NCSC/FBI/AIVD advisory with full ATT&CK-mapped attack chain"
    sources:
      - { url: "https://www.ncsc.gov.uk/news/iranian-cyber-targeting-of-dissidents-activists-and-journalists", publisher: "UK National Cyber Security Centre (NCSC)", date: "2026-09-15", role: "primary" }
      - { url: "https://www.ncsc.gov.uk/news/uk-allies-expose-spyware-iranian-state-actors-target-dissidents-activists-journalists", publisher: "UK National Cyber Security Centre (NCSC)", date: "2026-09-15", role: "primary" }
      - { url: "https://therecord.media/iran-cyber-spies-use-fake-mri-scans-as-lure", publisher: "The Record (Recorded Future News)", date: "2026-09-15", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"threat research malware analysis published September 15 2026 new technique\") → pivot: NCSC news release, URL https://www.ncsc.gov.uk/news/uk-allies-expose-spyware-iranian-state-actors-target-dissidents-activists-journalists → primary: NCSC full technical advisory, URL https://www.ncsc.gov.uk/news/iranian-cyber-targeting-of-dissidents-activists-and-journalists → corroborating: The Record, URL https://therecord.media/iran-cyber-spies-use-fake-mri-scans-as-lure"
    summary: |
      NCSC (UK), the FBI and the Netherlands' AIVD jointly published a technical advisory on 2026-09-15 for CHOSEN BRICK,
      a Windows-only malware family Iranian state cyber actors (tradecraft consistent with MOIS) have used since at
      least 2025 against dissidents, activists and journalists worldwide, including UK/US/Netherlands nationals. The
      attack chain begins with extensive social-engineering rapport-building over WhatsApp/Telegram (T1589, T1566.003)
      — the actor impersonating a known contact or platform "technical support" — before delivering a lure file
      disguised as a legitimate app (Pictory, RunwayML, Norton Antivirus, Telegram, Adobe Flash Player, KeePass) or as
      MRI scan results (T1204.002). If the corporate device resists, the actor pivots the target to their personal
      device to bypass workplace controls. CHOSEN BRICK persists via the HKCU\Software\Microsoft\Windows\CurrentVersion\Run
      registry key (T1547.001), registers a mutex for execution guardrails (T1480.002, commonly "ytyjyujyu" or
      "noi672pp434awkc12f"), and adds Microsoft Defender exclusions (T1685/T1562.001-class). Each victim device is
      assigned its own unique Telegram Bot ID for C2 (T1102.002) — an explicit anti-cross-contamination OPSEC measure
      — with data exfiltrated through the Telegram bot and cloud object stores (VultrObjects, StorjShare; T1567.002),
      and the newest variants layer HTTPS/SOCKS5 proxies over the Telegram C2 to obscure it further (T1090.002).
      Capabilities include process/system enumeration (T1057, T1082), screen capture (T1113), microphone activation
      for audio capture (T1123), theft of Telegram/WhatsApp browser data (T1005) and email content (T1114.001),
      additional-malware download using the same persistence mechanism, file deletion, and full disk-wipe (T1485).
      Stolen data from prior victims has surfaced on pro-Iranian leak sites, and NCSC notes Iranian intelligence
      services have in parallel plotted kidnap/assassination operations against some individuals perceived as
      regime threats — framing this as a transnational-repression tool, not conventional espionage tradecraft.
      Additional-malware drop paths use a non-standard location with an intentional space in the path
      ("C:\Windows \SysWOW64") as a detection-evasion marker. This supersedes/extends an earlier FBI flash warning
      from March 2026 that first described the campaign.
    region_nexus: "global — UK, US and Netherlands nationals confirmed victims; transnational-repression targeting model transferable to any jurisdiction hosting Iranian dissidents, activists or journalists, including Switzerland"
    primary_sector_nexus: "indirect — targets individuals (dissidents/activists/journalists), not government institutions directly, but the social-engineering/attack-chain pattern and personal-device-pivot technique are directly relevant to any public-sector organization with at-risk staff (diplomatic, asylum, human-rights or media-adjacent portfolios)"
