  - title: "CenterPoint Energy confirms a customer-data breach after a threat actor claims mass exfiltration via an unprotected public API lacking rate-limiting and WAF controls"
    sources:
      - { url: "https://www.bleepingcomputer.com/news/security/centerpoint-energy-confirms-customer-data-stolen-in-cyberattack/", publisher: "BleepingComputer", date: "2026-09-15", role: primary }
      - { url: "https://www.sec.gov/Archives/edgar/data/1130310/000110465926107560/tm2625326d1_8k.htm", publisher: "CenterPoint Energy (SEC Form 8-K)", date: "2026-09-15", role: "primary (victim regulatory filing)" }
    discovery_trace: "first seen at: bleepingcomputer (rotation source), URL https://www.bleepingcomputer.com/news/security/ → primary: BleepingComputer's own article, URL https://www.bleepingcomputer.com/news/security/centerpoint-energy-confirms-customer-data-stolen-in-cyberattack/ → primary: CenterPoint Energy's own SEC 8-K filing, URL https://www.sec.gov/Archives/edgar/data/1130310/000110465926107560/tm2625326d1_8k.htm"
    summary: |
      CenterPoint Energy, a Houston-based public utility serving roughly 7 million metered electric and gas
      customers across Indiana, Minnesota, Ohio and Texas, confirmed via SEC 8-K filing (2026-09-15) that an
      unauthorized third party obtained customer personal information through "one of the Company's
      external-facing systems." The company does not name the threat actor, the number of affected customers,
      or the data types compromised. A threat actor using the alias "4d722e4d656f77" separately told
      BleepingComputer they exfiltrated 7.49 million customer records — names, phone numbers, service/billing
      addresses, account numbers, billing amounts and partial SSNs — by iterating through millions of sequential
      IDs on CenterPoint's public API, which the actor says lacked rate-limiting, WAF protection or other
      automated-access controls, after the company allegedly ignored their initial extortion contact. Multiple
      US class-action suits have been filed; CenterPoint states electric/gas service delivery was unaffected.
    region_nexus: "US (Texas/Indiana/Minnesota/Ohio); no Swiss or EU nexus stated by any party"
    primary_sector_nexus: "out-of-nexus"
    sector: "energy"
    cves: []
    techniques: [T1190]
    affected_products: []
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "they exfiltrated the data by iterating through millions of IDs on CenterPoint's public API, which lacked rate limiting, web application firewall (WAF) protection, and other security measures against automated access."
        attribution: "threat actor claim, via BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/centerpoint-energy-confirms-customer-data-stolen-in-cyberattack/"
      - quote: "the Company has determined that an unauthorized third party obtained personal information relating to a portion of the Company's customers through one of the Company's external-facing systems"
        attribution: "CenterPoint Energy, SEC Form 8-K"
        source_url: "https://www.sec.gov/Archives/edgar/data/1130310/000110465926107560/tm2625326d1_8k.htm"
    extended_notes: |
      Held borderline: this is a large US critical-infrastructure (energy-utility) breach with a concrete,
      instructive access pattern (unauthenticated/under-throttled sequential ID enumeration against a public API
      — a BOLA/IDOR-adjacent weakness class, not a novel technique but a common and often-overlooked one for
      any organization exposing customer-account-lookup APIs, including Swiss public-sector e-government
      portals). No Swiss/EU nexus and the technique class, while real, is not new or evolved. Main agent should
      weigh PD-11(a)/(b) against the out-of-nexus filter; I lean toward inclusion for the transferable API-hygiene
      lesson but flag it as a judgment call rather than a clear-cut clear.
    borderline: true
    borderline_reason: "US utility breach, no Swiss/EU nexus; included for a transferable but not novel API-abuse TTP (unrated-limited public API ID enumeration) relevant to any org exposing customer-lookup APIs — main agent's call on PD-11 out-of-nexus criteria."

