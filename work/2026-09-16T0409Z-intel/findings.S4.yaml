  - title: "Revolut's fake-government-request KYC breach escalates to extortion: 10,000 BTC ransom demand and Telegram-posted data samples of high-net-worth customers"
    sources:
      - { url: "https://databreaches.net/2026/09/15/hackers-demand-10000-bitcoin-from-revolut-following-data-breach/", publisher: "DataBreaches.net (relaying Computing.co.uk / Dev Kundaliya)", date: "2026-09-15", role: primary }
      - { url: "https://techcrunch.com/2026/09/12/revolut-confirms-customer-data-breach-through-fake-government-requests/", publisher: "TechCrunch", date: "2026-09-12", role: "background (original disclosure, already the entry's cited primary)" }
    discovery_trace: "first seen at: infosecurity-magazine (rotation source), URL https://www.infosecurity-magazine.com/rss/news/ → databreaches.net RSS, URL https://databreaches.net/feed/ → primary (relay of Computing.co.uk, unreachable on every transport this run: direct 403, trafilatura no-body, jina relayed an upstream block) → background: TechCrunch's original 2026-09-12 disclosure article (already the existing entry's cited primary source)"
    summary: |
      The store already carries this incident as entries/2026-09-13/revolut-fake-government-request-kyc-breach.md
      (Revolut's KYC-document/selfie/transaction-history disclosure via a fraudulent information request sent
      from inside a genuine government agency's own email domain). A materially new development, reported
      2026-09-15 and not yet reflected in that entry: parties claiming responsibility for the incident have
      posted samples of the allegedly stolen data across multiple Telegram groups — material reported to include
      details belonging to "prominent individuals, including business leaders, sports professionals and
      performing artists" — and are now threatening to publish further data "every day" unless Revolut pays a
      ransom of 10,000 Bitcoin (reported as worth over $782 million at time of writing). This is the first
      extortion/ransom dimension on a story the existing entry describes only as a disclosed process-abuse
      breach with no stated attacker demand. The primary carrying this claim (Computing.co.uk) could not be
      fetched directly on any transport this run (403 / no-body / reader-blocked); this finding is therefore
      sourced to DataBreaches.net's relay of that reporting, which is itself a corroboration-only aggregator —
      flagged accordingly for the main agent's sourcing-note treatment.
    region_nexus: "global (UK-headquartered fintech, 80M+ customers across 30+ countries); no confirmed Swiss-specific victim data, but the underlying technique (impersonated/spoofed government-domain data request) is directly transferable to any authority issuing or receiving legal data requests, including Swiss public-sector bodies"
