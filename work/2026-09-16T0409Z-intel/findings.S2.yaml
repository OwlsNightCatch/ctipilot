  - title: "AFPA (French national adult vocational-training agency): a criminal claims ~971,000 records for sale — uncorroborated, no agency statement"
    sources:
      - { url: "https://www.cyberattaque.org/afpa-pres-dun-million-de-dossiers-revendiques-apres-une-cyberattaque/", publisher: "Cyberattaque.org", date: "2026-09-15", role: "primary" }
    discovery_trace: "first seen at: cyberattaque-org, URL https://www.cyberattaque.org/feed/ → primary: same outlet's own review of the leak samples, URL https://www.cyberattaque.org/afpa-pres-dun-million-de-dossiers-revendiques-apres-une-cyberattaque/ (no independent corroboration found)"
    summary: |
      A criminal using the handle xMetah claims to be selling a 971,420-record file taken from AFPA (Agence nationale pour la formation professionnelle des adultes), a French public operator under the Ministry of Labour that trains jobseekers and career-changers nationwide. Cyberattaque.org, which reviewed the seller's samples directly, reports fields including full name, date of birth, postal address, phone number, an internal identifier and a "partner" field (value "LHEA" in observed rows) suggesting the data may originate from a partner feed or intermediary application rather than AFPA's own core system — the outlet explicitly cautions the origin is unconfirmed and that 971,420 rows does not mean 971,420 unique individuals. No mechanism, access vector or extraction date is stated by the seller; AFPA has issued no statement. The outlet notes AFPA suffered a separate, smaller claimed compromise (101 accounts plus an admin access) about a month earlier.
    region_nexus: "France (national public vocational-training agency); part of the broader France public-sector breach pattern already tracked (trend:france-public-sector-breach-wave-2026)"
    primary_sector_nexus: "indirect — French national public-sector nexus (analogous supplier/agency concentration-risk pattern relevant to any Swiss cantonal/federal agency using similar partner-linked case-management data flows), not itself Swiss"
    sector: "public-sector"
    cves: []
    techniques: []
    affected_products: []
    entity_keys: ["trend:france-public-sector-breach-wave-2026"]
    new_entities: []
