    extended_notes: |
      Fails the breach-gate's fake-news guard as it stands (single C-reliability tracker relaying a bare criminal-forum claim, no victim confirmation, no Admiralty A/B journalism pickup found on a targeted check). Same shape as the store's existing open backlog rows (Kimberly-Clark/ShinyHunters, Ixa Systems/TheGentlemen, UICC/Krybit, Medela/ShinyHunters, Reichenau/SafePay) — recommend adding as a new coverage_backlog.md row rather than publishing, re-check for an AFPA statement or mainstream French press (Le Monde, France Info, Acteurs Publics) on a later fire.
