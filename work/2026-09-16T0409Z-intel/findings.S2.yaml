items:
  - title: "CHOSEN BRICK: NCSC-UK, FBI and Dutch AIVD jointly detail an Iranian state spyware family that uses per-victim Telegram bots for C2 and screen-capture-driven doxxing of dissidents"
    sources:
      - { url: "https://www.ncsc.gov.uk/news/iranian-cyber-targeting-of-dissidents-activists-and-journalists", publisher: "NCSC-UK (with FBI and AIVD)", date: "2026-09-15", role: "primary" }
      - { url: "https://www.ncsc.gov.uk/news/uk-allies-expose-spyware-iranian-state-actors-target-dissidents-activists-journalists", publisher: "NCSC-UK", date: "2026-09-15", role: "primary" }
    discovery_trace: "first seen at: ncsc-uk, URL https://www.ncsc.gov.uk/api/1/services/v1/all-rss-feed.xml → primary: NCSC-UK technical advisory (co-authored with FBI and AIVD), URL https://www.ncsc.gov.uk/news/iranian-cyber-targeting-of-dissidents-activists-and-journalists (no further pivot needed — NCSC-UK is the disclosing/owning authority for its own advisory, national-CERT carve-out)"
    summary: |
      NCSC-UK, the FBI and the Netherlands' AIVD jointly published a technical advisory (2026-09-15) on CHOSEN BRICK, a Windows-only malware family Iranian state cyber actors have used since at least 2025 against dissidents, activists and journalists in the UK, US and Netherlands, some of whom have since had personal data posted to pro-Iranian leak sites to further harass them. Initial access is social engineering over WhatsApp/Telegram (T1566.003) by an actor posing as a known contact or platform support, using extensive prior research on the target (T1589); the lure is a file disguised as a legitimate app (Pictory, RunwayML, Norton, Telegram, Adobe Flash, KeePass) or an "MRI scan result", opened by the victim (T1204.002). Operators first target the victim's work device and, if delivery fails or detection risk looks high, pivot to asking the victim to open the file on a personal device to sidestep corporate controls. CHOSEN BRICK persists via the HKCU\Software\Microsoft\Windows\CurrentVersion\Run registry key (T1547.001), registers a mutex ("ytyjyujyu" or "noi672pp434awkc12f") to prevent double-infection (T1480.002), and adds Windows Defender exclusions (T1685). C2 runs over a per-victim, unique Telegram Bot ID (T1102.002) — an explicit operational-security choice to prevent cross-victim contamination — with recent variants proxying that traffic through HTTPS/SOCKS5 (T1090.002) via iproyal[.]com/lightningproxies[.]net. Capabilities include process/system enumeration (T1057/T1082), screen capture (T1113) — the primary data-theft feature used to map a victim's contacts, location and pattern of life — microphone capture (T1123), Telegram/WhatsApp browser-data theft (T1005), email theft (T1114.001), file deletion and full disk wipe (T1485), with exfiltration via the Telegram bot (T1041) or cloud object stores (VultrObjects, StorjShare) (T1567.002). No lateral-movement capability has been observed, though the malware can fetch and persist additional payloads using the same registry mechanism.
    region_nexus: "UK/US/Netherlands (advisory jurisdictions); Iran-nexus state activity against dissidents/activists/journalists globally — Switzerland (notably Geneva, host to UN missions, international organizations and an active Iranian diplomatic/diaspora presence, including a 2026 Iranian-mission asylum case) is a plausible target environment for the same transnational-repression tradecraft even though no Swiss victim is named in this advisory"
    primary_sector_nexus: "indirect — relevant to police/security services and any public-sector unit tasked with protecting at-risk individuals (dissidents, journalists, human-rights defenders) from foreign-state digital surveillance and transnational repression, a mandate within Swiss federal police/NDB's remit; not an infrastructure-targeting campaign against government IT itself"
