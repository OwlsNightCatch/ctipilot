  - title: "Delinea Secret Server: three new high/critical PAM vulnerabilities — SAML-response impersonation, a padding-oracle key-decrypt primitive, and stored XSS — no confirmed exploitation yet"
    sources:
      - { url: "https://delinea.com/security-advisories", publisher: "Delinea (vendor PSIRT advisory page)", date: "2026-09-15", role: "primary" }
      - { url: "https://euvd.enisa.europa.eu/", publisher: "ENISA EU Vulnerability Database (EUVD)", date: "2026-09-15", role: "corroborating" }
    discovery_trace: "first seen at: enisa-euvd (bridge: enisa-euvd recent criticals), URL https://euvd.enisa.europa.eu/ → primary: Delinea vendor security-advisories page, URL https://delinea.com/security-advisories"
    summary: |
      Delinea published three new CVEs for Secret Server on-prem (a privileged-access-management / secrets-vault product) on 2026-09-15, all CVSS v4 9.1-9.5. CVE-2026-15640 (CVSS 9.5, CWE-290 authentication bypass by spoofing): under certain conditions a valid SAML IdP response can be replayed to impersonate another Secret Server user, affecting on-prem 10.5.0 through 12.1.3, fixed in 12.2.7. CVE-2026-15639 (CVSS 9.3, CWE-79 stored/reflected input neutralization failure): a crafted link run by a legitimate user executes attacker-supplied JavaScript in the Secret Server context, affecting 10.2.19 through 11.9.48, fixed in 12.0.20. CVE-2026-15638 (CVSS 9.1, CWE-327 broken cryptographic algorithm): an unauthenticated user with access to Secret Server can abuse a padding oracle to decrypt or encrypt data using one of the server's own cryptographic keys (the key itself is not exposed), affecting 10.5.1 through 12.1.3, fixed in 12.2.7. Delinea's advisory carries no exploitation-status statement and ENISA EUVD lists no EPSS/exploited flag for any of the three; there is no public PoC reported.
    region_nexus: "global — no Switzerland-specific targeting reported"
    primary_sector_nexus: "indirect"
    sector: "cross-sector"
    cves: ["CVE-2026-15638", "CVE-2026-15639", "CVE-2026-15640"]
    techniques: [T1190]
    affected_products: ["Delinea Secret Server (on-prem)"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "Under certain conditions a valid SAML IdP response may be used to impersonate another Secret Server user."
        attribution: "Delinea security advisories page"
        source_url: "https://delinea.com/security-advisories"
      - quote: "An unauthenticated user with access to Secret Server could leverage a padding oracle to decrypt or encrypt data using one of the server's cryptographic keys. The key itself is not exposed."
        attribution: "Delinea security advisories page"
        source_url: "https://delinea.com/security-advisories"
    extended_notes: |
      Borderline call: no confirmed active exploitation, no public PoC, and two of the three (CVE-2026-15638, CVE-2026-15640) require CVSS4 attack-complexity "High"/attack-requirements "Present" (AC:H/AT:P), i.e. specific preconditions rather than a trivial pre-auth path. Included despite that because Secret Server is a privileged-access-management / credential-vault product — a high-value target class for ransomware affiliates and post-compromise credential harvesting — and CVE-2026-15640's SAML-response-impersonation primitive is a meaningful identity-bypass class for any org using SAML-federated Secret Server access. Recommend the main agent weigh inclusion given no exploitation evidence; flagging as borderline rather than dropping outright since PAM-tool auth bypasses have a track record of rapid weaponisation once technical detail circulates.
    watchlist: []
    borderline: true
    borderline_reason: "No confirmed active exploitation and no public PoC as of this run; included on PAM/credential-vault criticality and the SAML-impersonation primitive's identity-bypass class, but two of the three CVEs need specific preconditions (AC:H/AT:P) rather than trivial pre-auth reach."

