  - title: "CHOSEN BRICK — Iranian state cyber actors run a Telegram-C2 Windows implant against dissidents, activists and journalists worldwide; joint NCSC-UK/FBI/AIVD advisory with full MITRE ATT&CK mapping"
    sources:
      - { url: "https://www.ncsc.gov.uk/news/iranian-cyber-targeting-of-dissidents-activists-and-journalists", publisher: "NCSC UK (GCHQ)", date: "2026-09-15", role: "primary" }
      - { url: "https://www.ncsc.gov.uk/news/uk-allies-expose-spyware-iranian-state-actors-target-dissidents-activists-journalists", publisher: "NCSC UK (GCHQ) — press release", date: "2026-09-15", role: "primary" }
    discovery_trace: "first seen at: ncsc-uk, URL https://www.ncsc.gov.uk/api/1/services/v1/all-rss-feed.xml → primary: NCSC UK joint technical advisory, URL https://www.ncsc.gov.uk/news/iranian-cyber-targeting-of-dissidents-activists-and-journalists (co-authored with US FBI and Netherlands AIVD; FBI companion report linked at https://www.ic3.gov/CSA/2026/260915.pdf, not separately fetched)"
    summary: |
      NCSC UK, the US FBI and the Netherlands' AIVD published a joint technical advisory on 2026-09-15 on CHOSEN BRICK, a Windows-only malware family Iranian state cyber actors have used since at least 2025 against dissidents, activists and journalists in the UK, US and Netherlands, in support of what NCSC assesses as state-backed transnational repression (victim details have subsequently appeared on pro-Iranian leak sites). Delivery is social-engineering-led: actors build rapport over WhatsApp/Telegram posing as trusted contacts or platform support (T1566.003), then hand over a lure file disguised as a legitimate app (Pictory, RunwayML, Norton Antivirus, Telegram, Adobe Flash Player, KeePass) or fake medical results (T1204.002); if delivery to a corporate device fails or risks detection, actors pivot the target to a personal device to dodge corporate controls. The dropped payload persists via the HKCU\Software\Microsoft\Windows\CurrentVersion\Run registry key (T1547.001), adds Microsoft Defender exclusions to evade detection (T1685), and calls out to a victim-unique Telegram Bot ID for C2 (T1102.002), recently observed proxied through HTTPS/SOCKS5 (T1090.002) to obscure the Telegram traffic. Tasking supports process/system enumeration (T1057, T1082), screen capture (T1113) — the most commonly observed data-theft feature — microphone capture (T1123), theft of Telegram/WhatsApp browser data and email content (T1005, T1114.001), additional-payload download and destructive wiping (T1485), with exfiltration over the Telegram bot (T1041) or to cloud object stores (VultrObjects, StorjShare) via T1567.002. No lateral-movement automation has been observed, though the malware's payload-download capability makes it technically possible.
    region_nexus: "UK, US, Netherlands confirmed victims; global targeting of Iran-perceived dissidents, activists and journalists — relevant to Swiss authorities given Switzerland's role hosting international organisations, diplomatic missions and diaspora communities that may include individuals at risk of Iranian transnational repression"
    primary_sector_nexus: "indirect"
    sector: "public-sector"
    cves: []
    techniques: [T1589, T1566.003, T1204.002, T1547.001, T1685, T1102.002, T1090.002, T1057, T1082, T1113, T1123, T1005, T1114.001, T1485, T1041, T1567.002]
    affected_products: ["Microsoft Windows"]
    entity_keys: []
    new_entities:
      - key: "malware:chosen-brick"
        type: malware
        name: "CHOSEN BRICK"
        aliases: []
        summary: "Windows-only malware family used by Iranian state cyber actors since at least 2025 against dissidents, activists and journalists; persists via HKCU Run key, uses Telegram bots (one per victim) for C2, and supports screen/audio capture, email/message theft and destructive wiping (joint NCSC UK/FBI/AIVD advisory, 2026-09-15)."
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "CHOSEN BRICK is a malware family that has been used to target individuals around the world including in the UK, US and the Netherlands from at least 2025."
        attribution: "NCSC UK"
        source_url: "https://www.ncsc.gov.uk/news/iranian-cyber-targeting-of-dissidents-activists-and-journalists"
      - quote: "Iran almost certainly uses cyber activity to support the repression of individuals who are seen as a threat to the regime, such as dissidents, activists and journalists."
        attribution: "NCSC UK"
        source_url: "https://www.ncsc.gov.uk/news/iranian-cyber-targeting-of-dissidents-activists-and-journalists"
      - quote: "In all observed instances, the malware has been exclusively targeted at the Windows operating system."
        attribution: "NCSC UK"
        source_url: "https://www.ncsc.gov.uk/news/iranian-cyber-targeting-of-dissidents-activists-and-journalists"
    extended_notes: |
      Triage-relevant benign-lookalike note the source itself supports: CHOSEN BRICK's C2 rides on legitimate api.telegram.org / backblazeb2.com / vultrobjects.com / storjshare.io / iproyal.com / lightningproxies.net traffic — the discriminator NCSC gives is these domains appearing in DNS/proxy logs "where not expected as part of normal business" for the account/host in question, since none of them are inherently malicious services. No CVE is involved (social-engineering delivery, not an exploited vulnerability) — this is a threat/campaign item, not a vulnerability item. The FBI's companion technical report (referenced by NCSC but hosted at ic3.gov) was not independently fetched this run; flagging as a possible follow-up pivot for deeper technical detail.
