  extended_notes: |-
    Backlog row: state/coverage_backlog.md 2026-09-27 (Adobe September 2026 cycle). The row treated the cycle as one routine vendor release; the tables show Campaign Classic is a continuing pattern, not an isolated release: five Priority-1 builds in six weeks, 17 unauthenticated CVSS 10.0 CVEs in the tables, and a 2026-09-22 revision that multiplied one visible CVE into eighteen.
    Table transcription: every figure above was read cell by cell from the bulletin's own raw table rows (id, CWE, impact, severity, score, vector, CVE in one row), then cross-checked against Adobe's CNA records. Vector arithmetic (CVSS 3.1) agrees with the printed score for all rows except CVE-2026-82003 (printed 9.9, vector 8.5). Impact-column differences between the table and Adobe's CNA text: CVE-2026-75703 (table: Application denial-of-service; CNA text: arbitrary code execution); CVE-2026-83660, CVE-2026-82013 and CVE-2026-82443 (table: security feature bypass, arbitrary code execution and arbitrary file system read; CNA text: privilege escalation for all three).
    Unauthenticated list for cve_table: CVE-2026-82004, -73369, -84412, -89275, -75723, -75699, -75703, -75721 (10.0); CVE-2026-83660 (9.9); CVE-2026-75728 (9.1).
    Detection concept (analyst inference): the flaw classes are OS command injection, code injection, authorization bypass and SSRF on an internet-reachable web tier, so look at web/application access logs for requests to Campaign endpoints from outside expected sources, process-creation events where the Campaign server or its web-server parent spawns shells or interpreters, and outbound requests from the Campaign host to internal services or cloud metadata (SSRF). Adobe states no post-patch compromise check; because eight unauthenticated code-execution paths were open at build 9401 and earlier, an on-premise instance that sat unpatched should be assessed as possibly compromised.
    Hybrid check (vendor-stated): confirm the on-premise tier, not the Adobe-hosted marketing tier, is at build 9402; Adobe warns that hosted instances can still display 9401.
    Suggested priority: high (consistent with the three earlier Campaign entries, all high). Suggested entry shape: new entry for APSB26-142 that references the three earlier entries and also covers the uncovered APSB26-134 (build 9401) in one timeline, so the entry is the single build 9398-9402 picture; CVE overlap check: none of the 18 ids nor CVE-2026-76193/76195/76197 appears in the store.
    Unscoped leads seen while reading the Adobe index (not researched in depth, not in the store): 2026-09-08 patch day ColdFusion APSB26-119 (Priority 1, ColdFusion 2025 <=2025.0.12 and 2023 <=2023.0.23, fixed 2025.0.13 / 2023.0.24; top row CVE-2026-48273 CWE-95 9.9 PR:L; no PR:N row at or above 9.0) and Experience Manager APSB26-98 (Priority 2; CVE-2026-19232 CWE-863 9.9 PR:L; a table of 100+ rows mostly 5.4 stored XSS). Neither has an unauthenticated CVSS >= 9.0 row.
