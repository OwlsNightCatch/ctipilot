  discovery_trace: 'first seen at: state/coverage_backlog.md row surfaced 2026-09-27 (2026-09-27T1308Z-audit) -> advisories-ncsc-nl: ncsc-nl csaf NCSC-2026-0392 (human page https://advisories.ncsc.nl/advisory?id=NCSC-2026-0392) -> pivot: CSAF reference https://www.ibm.com/support/pages/node/7286666 -> primary: IBM Langflow bulletin https://www.ibm.com/support/pages/security-bulletin-langflow-vulnerable-arbitrary-code-execution-due-multiple-incomplete-code-security-controls-and-missing-execution-guards -> pivot: IBM CNA records for the three CVEs (cveawg.mitre.org API; carry CWE, vector, CISA ADP SSVC) -> pivot: upstream https://github.com/langflow-ai/langflow/releases/tag/v1.11.6 and PR #14876, GitHub advisory list (api.github.com/repos/langflow-ai/langflow/security-advisories: no advisory carries these ids) -> vendor docs https://docs.langflow.org/api-keys-and-authentication'
  summary: |-
    IBM's Langflow bulletin (2026-09-08) lists eleven CVEs for Langflow OSS 1.0.0-1.11.5 and a single remediation: upgrade to Langflow OSS 1.11.6, with workarounds "None". Three are CVSS 9.8 with vector CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H (no privileges, no user interaction); the other eight are CVSS 8.8 and need an authenticated user (PR:L). IBM is the CNA and no GitHub security advisory carries any of the three ids (checked against the repository's published advisory list today), so IBM's per-CVE wording is the only description.

    IBM's own per-CVE text is the only explicit mapping. CVE-2026-85025 (CWE-863 incorrect authorization): an unauthenticated attacker can execute arbitrary code and access or modify chat sessions "through publicly shared MCP project endpoints", because public-flow security restrictions and session isolation are not enforced. CVE-2026-81204 (CWE-94 code injection): a remote attacker can execute arbitrary code via code injection "during graph construction". CVE-2026-79724 (CWE-78 OS command injection): a remote attacker can execute arbitrary OS commands via improper neutralization of special elements in an OS command. Only CVE-2026-85025 names an exposed surface. The bulletin's summary paragraph lists the underlying mechanisms (the deprecated flow-vertices build endpoint, MCP stdio validator and environment-blocklist gaps, the custom-component admin-only policy not enforced on stored-flow build paths, public MCP project transports without the public-flow guard) without tying each to a CVE id, so CVE-2026-79724 and CVE-2026-81204 cannot be mapped to a specific mechanism from IBM's text and must not be mapped by order of appearance.

    Fix line. IBM names 1.11.6 (upstream release 2026-09-01, "fix: backport security and correctness fixes to 1.11.6", PR #14876, which lists among others the caller-aware component policy on the vertex build seam, validation of runtime file tweaks, annotation resolution without execution and component-code-scan gaps). Upstream 1.12.0 shipped the same day with the same security PRs, and the project has kept hardening the same surfaces (1.12.3 on 2026-09-22; 1.12.4 on 2026-09-29, including "validate public flows after group expansion"). Langflow's own advisory GHSA-33p4-w7j3-33mw (2026-09-28) says an eval() sink on Tool-Mode inputs was present in every release up to and including 1.11.6 and was fixed in 1.12.0, so 1.11.6 is IBM's floor for these CVEs, not the end of the hardening line. No source ties any specific upstream PR to CVE-2026-79724, CVE-2026-81204 or CVE-2026-85025.

    Exposure. Langflow's documentation gives LANGFLOW_HOST a default of localhost, states that the application default for LANGFLOW_AUTO_LOGIN is True while the official Docker images set false, and that most API endpoints require a Langflow API key by default. IBM does not say whether CVE-2026-79724 or CVE-2026-81204 depend on any non-default feature; CVE-2026-85025 needs a publicly shared MCP project or public flow containing MCP Tools. Assessment (analyst): any instance reachable from an untrusted network should be treated as exposed to all three, since the vendor vector is PR:N.

    Exploitation status as of 2026-10-02: none reported. None of the three is in the CISA KEV catalog (fresh fetch, catalog version 2026.10.01). CISA's ADP SSVC records (2026-09-11/12) list Exploitation: none, Automatable: yes, Technical Impact: total for all three; FIRST EPSS is 0.61%-0.86% (2026-10-01). Searches found no public PoC or exploitation report. Context (analyst): Langflow carries six KEV entries (CVE-2025-3248, CVE-2026-33017, CVE-2025-34291, CVE-2026-55255, CVE-2026-0770, CVE-2026-9198), CVE-2026-33017 being an unauthenticated public-flow build code injection, the same exposure class CVE-2026-85025 sits in.
  region_nexus: global; AI-workflow platform reachable from the internet in many self-hosted deployments (analyst context). No Swiss-specific reporting found.
