  extended_notes: |-
    Backlog row: state/coverage_backlog.md 2026-09-27 (Adobe September 2026 cycle). The row's "AEM Forms JEE (up to 9.8)" is the bulletin's printed score; the vector gives 10.0. The row's "Adobe Connect (up to 9.9)" is the authenticated SQL injection CVE-2026-75682; the unauthenticated rows top out at 9.3 and need user interaction.
    APSB number for AEM Forms JEE: APSB26-151 (published 2026-09-22; NCSC-NL NCSC-2026-0390).
    Score discrepancies (bulletin table vs vector arithmetic vs Adobe CNA record): CVE-2026-75745 printed 9.8, vector and CNA 10.0; CVE-2026-82000 printed 9.1, vector and CNA 9.6; all Connect rows agree.
    Detection concept (analyst inference): for AEM Forms JEE an unauthenticated incorrect-authorization path to code execution is visible first in web/application-server access logs (unauthenticated requests reaching privileged Forms endpoints, 2xx responses without a prior login) and in process-creation events where the Java application-server process spawns shells or interpreters; SSRF rows show as outbound requests from the AEM host to internal services. For Connect the XSS rows need a victim browser session, so look for crafted links delivered by mail or chat and unusual script-injection patterns in form fields; the SQL-injection row shows in database or application error logs. Adobe states no post-patch compromise check.
    Triage: normal AEM Forms and Connect usage produces authenticated 2xx traffic and legitimate scripts; the discriminators are unauthenticated requests to privileged paths, process spawns by the Java server process and, for Connect, attacker-supplied script content in fields or URLs.
    Suggested priority: notable (AEM Forms JEE internet-exposed instances: high; Connect: below the bar on its own).
