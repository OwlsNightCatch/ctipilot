  discovery_trace: 'first seen at: state/coverage_backlog.md row surfaced 2026-09-27 (2026-09-27T1308Z-audit) -> advisories-ncsc-nl: ncsc-nl recent 60 (https://advisories.ncsc.nl/rss/advisories) then ncsc-nl csaf NCSC-2026-0392 (human page https://advisories.ncsc.nl/advisory?id=NCSC-2026-0392) -> pivot: CSAF reference https://www.ibm.com/support/pages/node/7284543 -> primary: IBM MQ bulletin https://www.ibm.com/support/pages/security-bulletin-ibm-mq-vulnerable-unauthenticated-remote-code-execution-cve-2026-10747 (raw body read with fetch_source url, because extract dropped the 9.1.0.38 and CD-upgrade remediation rows) -> pivot: IBM''s CNA record for CVE-2026-10747 (cveawg.mitre.org API; references IBM node 7284690) -> primary: IBM MQ Appliance bulletin https://www.ibm.com/support/pages/security-bulletin-ibm-mq-appliance-affected-heap-buffer-overflow-vulnerability-protocol-message-processing-cve-2026-10747'
  summary: |-
    IBM published two bulletins for CVE-2026-10747: one for IBM MQ (2026-09-14, installable component Server) and one for IBM MQ Appliance (2026-09-10). IBM describes a heap-based buffer overflow (CWE-122) in protocol message processing "before authentication" that could let "an unauthenticated remote attacker with network access to the listener port" execute arbitrary code; the CVE text also names denial of service. IBM is the CVSS source and scores it 10.0, vector CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H (scope changed). IBM tracks the fix as APAR DT472411 and lists "Workarounds and Mitigations: None".

    Affected and first-fixed builds as IBM states them. IBM MQ: 9.1 LTS 9.1.0.0-9.1.0.37 -> 9.1.0.38; 9.2 LTS 9.2.0.0-9.2.0.43 -> 9.2.0.44; 9.3 LTS 9.3.0.0-9.3.0.41 -> 9.3.0.42; 9.4 LTS 9.4.0.0-9.4.0.25 -> 9.4.0.26; Continuous Delivery 9.3.0.0-9.3.5.1 and 9.4.0.0-9.4.5.1 -> no CD-line fix, IBM says upgrade to 10.0.0.5; 10.0.0.0 is listed as affected but the software bulletin carries no remediation row for the 10.0 LTS stream (the Appliance bulletin names 10.0.0.5). IBM MQ Appliance (separate bulletin and table): 9.4 LTS 9.4.0.0-9.4.0.25 -> fix pack 9.4.0.26; 9.4 CD 9.4.1.0-9.4.5.2 -> 9.4.5.3 (M2002) or 10.0.0.5 (M2003); 10 LTS 10.0.0.0-10.0.0.1 -> 10.0.0.5.

    Exploitation status as of 2026-10-02: none reported. The CVE is not in the CISA KEV catalog (fresh fetch, catalog version 2026.10.01). CISA's ADP SSVC record (2026-09-19) lists Exploitation: none, Automatable: yes, Technical Impact: total. FIRST EPSS is 0.57% (2026-10-01). Searches in English found no public PoC, scanning or exploitation report. NCSC-NL relayed the bulletin on 2026-09-23 inside a bundle with eleven Langflow CVEs, rating likelihood medium and damage high.

    What the sources do not say: whether a listener is enabled by default, which port, and whether TLS or channel authentication changes reachability; the "before authentication" wording is IBM's. Exposure therefore depends on which queue managers run a TCP listener and from which networks it is reachable. Assessment (analyst): an internal-only listener lowers exposure but not for an attacker already inside the network, and the combination of CVSS 10.0, pre-authentication, scope change and no workaround makes patching the only control.
  region_nexus: 'global; IBM MQ is enterprise messaging middleware commonly run behind administration back-ends (analyst context, not source-stated). No Swiss-specific reporting found: the NCSC.ch security hub has no advisory on it as of 2026-10-02.'
