  extended_notes: |-
    Backlog row: state/coverage_backlog.md 2026-09-27 (IBM MQ + Langflow). Re-checked today (2026-10-02): still no exploitation, no KEV, no PoC.
    The other eight CVEs in the same IBM bulletin (CVSS 8.8, PR:L, all fixed in 1.11.6): CVE-2026-81941 (MCP Tools stdio component bypasses the code-execution restriction settings, CWE-284), CVE-2026-81211 (custom-component policy not enforced on stored-flow create/build, CWE-862), CVE-2026-81940 (flow display names, CWE-94), CVE-2026-78569 (incomplete scanner denylist, CWE-78), CVE-2026-78575 (MCP stdio command-line argument validation, CWE-78), CVE-2026-76059 (scanner alias-tracking bypass, CWE-693), CVE-2026-79742 (environment-variable blocklist, CWE-94), CVE-2026-78571 (unguarded eval(), CWE-94). Do not carry the three unauthenticated CVEs and the eight authenticated ones as one mechanism.
    Mapping caution: at least one aggregator summary attaches the MCP-stdio command-line wording (which is IBM's text for CVE-2026-78575) to CVE-2026-79724, and a blog post swaps the two IBM node numbers (7284543 is MQ, 7286666 is Langflow). Use IBM's per-CVE text only. A blog-reported ZoomEye count of fingerprinted Langflow hosts (18,550 on 2026-09-23, dev.to) counts product fingerprints, not vulnerable hosts, and is not used here.
    Vendor-stated consequence of Langflow code execution (IBM text for CVE-2026-81941, same bulletin): sensitive data exposure including credentials from the process environment, file-system modification and lateral movement to services reachable from the server. Post-patch check (analyst, follows from that): treat provider/API keys and database credentials reachable by the Langflow process on a previously exposed instance as exposed and rotate them; IBM states no compromise check of its own.
    Detection concept (analyst inference): web/application access logs for unauthenticated requests to flow-build, public-flow and MCP project endpoints; process-creation events where the Langflow server process (Python/uvicorn) is the parent of shells, interpreters or download tools; outbound connections from the Langflow host to unfamiliar destinations. Triage: legitimate Langflow flows run Python components and MCP stdio servers (npx/uvx/python child processes), so a child process of the server is not by itself malicious; the discriminators are an unauthenticated source, command content (shells, curl/wget, credential reads) and timing against flow-build requests.
    Upstream fix state today: v1.12.4 (2026-09-29) is the latest release; IBM's bulletin has not been revised (Modified 08 September 2026).
    Suggested priority: high (three PR:N RCEs in a product with six KEV-listed flaws and a history of exploitation within days of disclosure), dropping to notable only where no instance is reachable from untrusted networks. Suggested classification A2 (vendor/CNA primary plus NCSC-NL relay, no independent confirmation of exploitation either way).
