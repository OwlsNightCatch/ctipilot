  discovery_trace: 'first seen at: state/coverage_backlog.md row surfaced 2026-09-27 (2026-09-27T1308Z-audit) -> advisories-ncsc-nl: ncsc-nl recent 60, then ncsc-nl csaf NCSC-2026-0393 (human page https://advisories.ncsc.nl/advisory?id=NCSC-2026-0393; reference https://helpx.adobe.com/security/products/campaign/apsb26-142.html) -> primary: Adobe bulletin https://www.adobe.com/trust/security/products/campaign/apsb26-142.html (raw body fetched with fetch_source url and its div-based tables parsed cell by cell, because extract drops the tables; helpx.adobe.com alias fetched too and identical) -> pivot: Adobe CNA records for each CVE (cveawg.mitre.org API) for the score cross-check -> pivot: adobe-psirt index https://www.adobe.com/chimera-api/collection (newest bulletin is 2026-09-22) and https://helpx.adobe.com/security/products/campaign.html (bulletin list) -> APSB26-134 https://helpx.adobe.com/security/products/campaign/apsb26-134.html'
  summary: |-
    Adobe's APSB26-142 (Priority 1) covers Adobe Campaign Classic v7 7.4.4 build 9401 and earlier on Windows and Linux; the fix is ACC v7 7.4.4 build 9402. The bulletin was published 2026-09-08 with one CVE (CVE-2026-82004, CWE-78 OS command injection, CVSS 10.0) and revised 2026-09-22 to add seventeen more, for eighteen, all rated Critical. Adobe states: "Adobe is not aware of any exploits in the wild for any of the issues addressed in this update."

    Ten of the eighteen need no privileges. Eight are CVSS 10.0 with vector CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H: CVE-2026-82004 (CWE-78), CVE-2026-73369, CVE-2026-84412, CVE-2026-89275, CVE-2026-75699 and CVE-2026-75721 (all CWE-94 code injection), CVE-2026-75723 (CWE-863 incorrect authorization), and CVE-2026-75703 (CWE-94; Adobe's table gives the impact as "Application denial-of-service" whereas Adobe's own CVE record text says arbitrary code execution, and NCSC-NL repeated the table's reading). The other two unauthenticated ones are CVE-2026-83660 (CWE-918 SSRF, 9.9, AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:L/A:L, table impact "Security feature bypass") and CVE-2026-75728 (CWE-863, 9.1, scope unchanged, C:H/I:H/A:N, arbitrary code execution). The remaining eight need low privileges (CVE-2026-89276 9.9, -82008 9.9, -82003, -82010 9.9, -82013 9.9, -82443 9.6, -82011 9.1) or high privileges (CVE-2026-82009, 9.1). Bulletin score error: CVE-2026-82003 is printed as 9.9 but its vector (AC:H, PR:L) computes to 8.5, which is what Adobe's CVE record carries.

    Scope. Adobe: the bulletin "applies to fully on-premise deployments of Adobe Campaign Classic and the on-premise components of hybrid deployments"; Adobe-hosted instances "have already been remediated and require no customer action", and because the hosted fixes shipped without incrementing the customer-visible build number, some hosted instances still report build 9401, so a version-based scanner can false-positive on them. The hybrid trap from the earlier Campaign entries still applies: the hosted half is fixed, the on-premise half is not.

    Exploitation status as of 2026-10-02: none reported. the bulletin, last updated 2026-09-22, still carries that statement today; none of the eighteen is in the CISA KEV catalog (fresh fetch, catalog version 2026.10.01); CISA's ADP SSVC records (2026-09-11 to 2026-09-26) mark Exploitation: none for all eighteen, with Automatable: yes for nine (CVE-2026-73369, -84412, -89275, -75723, -75699, -75703, -75721, -75728 and -83660; CVE-2026-82004 is rated Automatable: no); EPSS is highest for CVE-2026-82004 at 3.25% (88th percentile) and 0.3%-1.2% for the other seventeen (2026-10-01). No public PoC or exploitation report found.

    New relative to the store. The store covers APSB26-114 (build 9398), APSB26-120 (9399) and APSB26-123 (9400). APSB26-134 (build 9401, published 2026-08-25, Priority 1, fixes CVE-2026-76197 and CVE-2026-76195, both CWE-78, and CVE-2026-76193, CWE-918, all CVSS 10.0 with the same unauthenticated vector; NCSC-NL relayed it as NCSC-2026-0331 on 2026-08-27) is not covered by any entry, so the build 9400 to 9401 step is a gap. APSB26-142 itself is new: the 2026-09-22 revision is where it grew from one CVE to eighteen, and build 9402 already contained all of those fixes when it shipped on 2026-09-08, so estates that moved to 9402 for the single visible CVE are covered, while estates that stopped at 9401 now face eighteen. Across the five Priority-1 bulletins (2026-07-29 to 2026-09-08), the bulletin tables list 17 CVEs with the unauthenticated CVSS 10.0 vector (1, 3, 2, 3 and 8 per bulletin).
  region_nexus: 'global; on-premise marketing-automation platform; public-sector communication and citizen-mailing services are plausible users (analyst context, not source-stated). No Swiss-specific reporting found: the NCSC.ch security hub covered the August Adobe cycle (post of 2026-08-12) but has nothing on the September cycle as of 2026-10-02.'
