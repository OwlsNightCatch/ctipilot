candidate_sources:
- id: ibm-support-security-bulletins
  publisher: IBM Support security bulletins
  url: https://www.ibm.com/support/pages/security-bulletin-ibm-mq-vulnerable-unauthenticated-remote-code-execution-cve-2026-10747
  category: vulns / vendor-psirt
  why: CNA-level primary for IBM products incl. Langflow OSS (IBM acquired it); structured per-CVE vectors, affected/fixed tables per branch; `fetch_source.py url` reads them whole. Discovery today only came via NCSC-NL relay; no IBM PSIRT listing record exists in sources.json (ibm-xforce is the research blog).
coverage_gaps:
- source_id: adobe-psirt
  reason: 'Recipe confirmed, no change needed: Adobe bulletin pages now live at https://www.adobe.com/trust/security/products/<product>/<apsb-id>.html (helpx.adobe.com alias returns an identical body). `extract` drops the div-based tables (empty Affected versions / Vulnerability Details sections); `python3 tools/fetch_source.py url <bulletin>.html` returns the raw body, and each table is `div.table > div (row) > div (cell)`. A 20-line lxml parser over that structure gave one row per CVE (category/CWE, impact, severity, score, vector, CVE id) with no positional pairing; the index https://www.adobe.com/chimera-api/collection?... lists every bulletin with CVE ids.'
- source_id: ibm-psirt (no record in sources.json)
  reason: 'IBM support-page bulletins (www.ibm.com/support/pages/security-bulletin-...) read through `extract` DROPPED rows of the IBM MQ bulletin''s Remediation/Fixes section (the 9.1 LTS fix 9.1.0.38 and the ''upgrade to 10.0.0.5'' line for the CD streams were missing from the extract output); `fetch_source.py url` returns the full raw body with all rows. IBM bulletins are dated, structured, and are the CNA-level authority for IBM and Langflow OSS CVEs; consider a candidate record. Per-bulletin human URLs: slug form (security-bulletin-...) fetched directly; node/<id> form also resolves.'
- source_id: advisories-ncsc-nl
  reason: 'Human advisory pages (https://advisories.ncsc.nl/advisory?id=NCSC-2026-NNNN) fell through `extract` to the jina reader (extract stderr: served via jina) and spend reader credit; `ncsc-nl csaf NCSC-2026-NNNN` returns the same content for free as CSAF with the vendor references and per-CVE vectors, and is the cheaper first rung. Note the CSAF/NCSC text can disagree with the vendor table (CVE-2026-75745: NCSC prose says 9.8, its own CVE entry says 10.0).'
- source_id: github-advisory
  reason: 'Working recipe confirmed today for repo-scoped advisories and releases: `python3 tools/fetch_source.py url "https://api.github.com/repos/<org>/<repo>/security-advisories?per_page=100"` and `.../releases?per_page=30` return JSON (published GHSAs with affected/patched ranges and full descriptions; release notes) and `extract` reads github.com release, pull-request and GHSA HTML pages directly. The 2026-07-05 note in sources.json says github.com and api.github.com are blocked by the agent egress proxy; that did not hold in this container on 2026-10-02.'
- source_id: cve-record / cisa-adp (no record)
  reason: '`python3 tools/fetch_source.py url https://cveawg.mitre.org/api/cve/<CVE-ID>` returns the CNA JSON (vendor-asserted vector, CWE, affected ranges, references) plus the CISA ADP Vulnrichment SSVC block (Exploitation / Automatable / Technical Impact) for free; used here as a cross-check and an exploitation-status data point, never as a cited page. FIRST EPSS batch API (`url https://api.first.org/data/v1/epss?cve=A,B,C`) also works.'
- source_id: ncsc-ch (BACS security hub)
  reason: 'Checked via `ncsc-csh recent 40` on 2026-10-02: no advisory on IBM MQ, Langflow, Adobe Campaign Classic, AEM Forms or Adobe Connect for the September cycle (the August Adobe post 12841 is the latest Adobe item).'
- source_id: store (coverage)
  reason: 'APSB26-134 (Adobe Campaign Classic build 9401, 2026-08-25; CVE-2026-76193/76195/76197, all CVSS 10.0, PR:N) was never covered by an entry, a run record or the backlog, although NCSC-NL relayed it as NCSC-2026-0331; recommend covering it inside the APSB26-142 entry timeline. Also unscoped and unseen by the store: Adobe 2026-09-08 ColdFusion APSB26-119 and AEM APSB26-98 (no unauthenticated >= 9.0 rows).'
