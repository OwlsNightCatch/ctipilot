  summary: |-
    Two Adobe Priority-2 bulletins of 2026-09-22 (not revised since). APSB26-151, Adobe Experience Manager Forms on JEE: affected AEM 6.5 LTS Forms Service Pack 2 and earlier, and AEM 6.5 Forms 6.5.25 and earlier (Windows, Linux); fixed in AEM 6.5 LTS Forms Service Pack 3 and AEM 6.5 Forms 6.5.25 with the AEMForms-6.5.0-0134 Hotfix. Adobe's bulletin adds: "Please contact Adobe customer care for assistance with AEM versions 6.4, 6.3 and 6.2." Six CVEs, all labelled Critical by Adobe. Only one clears the unauthenticated, network, CVSS >= 9.0 bar: CVE-2026-75745, CWE-863 incorrect authorization, impact arbitrary code execution, vector CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H. The bulletin prints 9.8 and NCSC-NL repeats 9.8 in its text, but that vector computes to 10.0, which is the score Adobe's CVE record and NCSC-NL's CSAF data carry. The others need privileges or interaction: CVE-2026-82000 (CWE-918 SSRF, PR:L; printed 9.1, vector and CVE record 9.6), CVE-2026-81995 (CWE-20, PR:H, 9.1), CVE-2026-81999 (SSRF, PR:H, 8.7), CVE-2026-75744 (stored XSS, PR:H, UI:R, 8.1) and CVE-2026-75743 (CSRF, PR:N, UI:R, 7.1). The bulletin's acknowledgments credit CVE-2026-71359, which is not in the table (Adobe-side inconsistency; its meaning is unknown).

    APSB26-150, Adobe Connect: affected Adobe Connect 12.11 and earlier (Windows and macOS) and the Adobe Connect Android Mobile App 4.4 and earlier; fixed in Adobe Connect 12.12 and Android app 4.5. Nine CVEs; Adobe labels seven Critical. No row combines no-privileges and no-interaction at 9.0 or above. The highest is CVE-2026-75682 (CWE-89 SQL injection, PR:L, 9.9, arbitrary code execution). Five rows are unauthenticated but need user interaction (PR:N, UI:R) at 9.3: stored XSS CVE-2026-75684, CVE-2026-75689 and CVE-2026-75697 (impact "Privilege escalation"), CVE-2026-75686 (CWE-20 improper input validation, arbitrary code execution) and reflected XSS CVE-2026-75698 (arbitrary code execution). CVE-2026-34689 (CWE-22 path traversal, PR:N, UI:N, 8.6, arbitrary file system read) is the only no-interaction unauthenticated row and sits below 9.0, although Adobe labels it Critical. The bulletin does not say which CVEs affect the Android app.

    Exploitation status as of 2026-10-02: Adobe states "Adobe is not aware of any exploits in the wild for any of the issues addressed in this update" in both bulletins; none of the fifteen CVEs is in the CISA KEV catalog (fresh fetch, catalog version 2026.10.01); CISA's ADP SSVC records (2026-09-22 to 2026-09-26) mark Exploitation: none for all, with Automatable: yes for CVE-2026-75745 only among the rows at or above 9.0 for these two products (and yes for CVE-2026-34689 at 8.6 and CVE-2026-83964 at 6.2); EPSS is 0.2%-1.5% for these fifteen rows (CVE-2026-75745 1.17%, 2026-10-01). No public PoC or exploitation report found. Context: the KEV catalog lists CVE-2025-54253 against Adobe Experience Manager Forms (JEE, arbitrary code execution; added 2025-10-15), so this product line has exploitation precedent.
  region_nexus: global; AEM Forms on JEE is a document/forms-workflow platform used in government form estates and Adobe Connect is a web-conferencing/e-learning platform (analyst context, not source-stated). No Swiss-specific reporting found for the September cycle.
