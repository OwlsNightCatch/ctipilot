    attribution: NCSC-NL
    source_url: https://advisories.ncsc.nl/advisory?id=NCSC-2026-0392
  extended_notes: |-
    Backlog row: state/coverage_backlog.md 2026-09-27 (IBM MQ + Langflow). Held on 2026-09-27/29/30 as unexploited and usually internal; today's re-check (2026-10-02) still finds no exploitation, no KEV listing, no PoC. The new facts that were not in the row: IBM's own per-branch fix table (including that the CD lines have no CD fix and must move to 10.0.0.5, and that the software bulletin leaves the 10.0 LTS stream without a remediation row), the separate MQ Appliance bulletin dated four days earlier, the CISA ADP SSVC record ("Automatable: yes"), and the absence of any workaround.
    Naming trap: NCSC-NL's title says "IBM Langflow OSS en IBM MQ Appliance" and its CSAF product tree lists only IBM MQ Appliance, while the IBM CNA record for CVE-2026-10747 lists only IBM MQ Appliance; the IBM MQ (software) bulletin is the one at node 7284543. Both bulletins describe the same CVE and the same APAR.
    Detection concept (analyst inference, not source-stated): the vulnerable path is reached before authentication, so the observable surface is the network listener itself and the queue-manager side effects of a malformed pre-auth message: inbound TCP connections to MQ listener ports from networks that are not channel partners, queue-manager or channel-process crashes and restarts, and MQ first-failure-data-capture/error-log entries coinciding with such connections; after a successful code-execution primitive the usual host telemetry applies (child processes of the MQ process, new outbound connections from the MQ host). IBM states no post-patch compromise check.
    Triage: legitimate MQ clients and partner queue managers connect to the same listener constantly, so a connection to the port alone is not a signal; the discriminators are an unfamiliar source address, malformed or truncated handshakes and a crash/restart cluster. (Mechanical inference from the pre-auth description.)
    Suggested priority: high (not critical: no exploitation, listeners are usually internal). Suggested single entry covering MQ software and Appliance; it may be bundled with the Langflow item as "IBM September bulletins" only if the composer wants one entry, but the exposure and fix paths are unrelated.
    CVE record cross-checks: IBM CNA record (cve.org API) published 2026-09-18, updated 2026-09-21; CVSS and CWE agree with the bulletins.
