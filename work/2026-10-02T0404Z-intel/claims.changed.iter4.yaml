    surface: "record 2026-10-02T04:58:16Z"
    kind: record-summary
    text: "Kiteworks published GitHub advisories on 2026-09-30 naming CVE-2026-54154, a maximum-severity unauthenticated code-execution chain to root in all Email Protection Gateway versions before 9.4.1, three CVSS 9.8 account takeovers fixed in 9.5.0 (CVE-2026-85065, CVE-2026-85066, CVE-2026-102115), and further account takeover, security-bypass and command-execution flaws in Email Protection Gateway, Core and Secure Data Forms fixed in 9.5.1. None is stated as exploited and no source ties them to the flaw found during the shutdown. Priority moves from notable to high because the chain is unauthenticated and reaches root. The earlier text now gives the nine-hour shutdown window from Kiteworks' own page next to the six hours in press coverage, and the sourcing rests on the vendor alone."
