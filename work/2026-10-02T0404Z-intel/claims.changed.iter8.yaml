    text: "The cases name no Swiss target and no confirmed intrusion; the traffic a public statistics or archive portal should watch for includes requests for version-control directories and backup copies, staging hostnames reachable without authentication, and API keys that appear in public URLs."
  - claim_id: ee69e2093b
    entry: 2026-10-02/belnet-supplier-zero-day-mail-copied-65-days
    surface: "summary"
    kind: frontmatter
    text: "Belnet, the Belgian research and education network that also serves the Belgian government, says an attacker used a zero-day in technology from an external supplier to copy all incoming mail to Belnet-owned domains between 2026-07-22 and 2026-09-25, plus every download link its FileSender and FedSender transfer services generated and sent directly. The supplier, the product and the actor are not named."
