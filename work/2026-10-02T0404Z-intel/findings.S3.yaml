    confidence: MEDIUM
    novelty: new
    borderline: true
    borderline_reason: "Published 2026-09-23 (elttam) and covered by Risky Bulletin 2026-09-25, outside the window and every slice lookback; no CVE yet, so it never enters CVE/KEV discovery paths (the blind spot this outage-backfill targets). Pre-auth RCE in a root daemon that holds device-admin credentials for a whole fleet is high-impact for network-management estates, but exploitation is unreported and the PoC is weaponization-limited (ASLR off). Main agent decides; S1 may prefer to own it."
    admiralty_suggestion: "B2 (finder's detailed write-up with vendor fix visible in the release notes; no second independent lab)"
    evidence:
      - quote: "Shrubbery fixed it in F4.0.4.32, published on 21 September, and the Facebook fork is archived, so it will not be fixed at all."
        attribution: "elttam"
        source_url: "https://www.elttam.com/blog/att-cking-tacacs-to-pwn-your-network-via-a-pre-auth-rce"
      - quote: "This post details a remote, pre-authentication format string vulnerability (CVE-pending) on an error path in that twenty-five year old ancestor code, which yields code execution as the daemon user, root by default."
        attribution: "elttam"
        source_url: "https://www.elttam.com/blog/att-cking-tacacs-to-pwn-your-network-via-a-pre-auth-rce"
    extended_notes: |
      Exposure check: which TACACS+ server answers on TCP/49 (tac_plus from Shrubbery or the Facebook fork, or an appliance built on that code) and whether TCP/49 is reachable from anywhere but NAS management addresses. Post-patch compromise check: daemon-user child processes and unexpected outbound connections from the AAA server; because the server sees administrative credentials for the fleet in near real time, a compromise implies fleet-wide credential rotation. Detection class: TCP/49 connections from non-NAS sources, malformed AUTHEN/START or CONTINUE packets, tac_plus log lines carrying format specifiers or memory-dump-like content. Risky Bulletin (2026-09-25, fetched in full) relays elttam's findings (two packets plus offline key cracking, edge-device variant less reliable, patch for the Shrubbery tree, no CVE yet, Facebook fork archived) and is not independent of elttam.
