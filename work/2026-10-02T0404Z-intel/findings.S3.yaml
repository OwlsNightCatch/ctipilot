      Detection (telemetry class first): (1) identity/cloud audit: Entra app registrations or service principals using client-credentials to read a single mailbox or OneDrive, and Graph calls from hosts that never ran Outlook/OneDrive clients (EDR network events: unsigned or unusual processes connecting to graph.microsoft.com / login.microsoftonline.com); (2) process creation: mshta.exe or wscript.exe spawning a .NET host or writing a three-file bundle, a signed Windows ADK binary (GatherOsState.exe) loading a same-folder DLL, sdiagnhost.exe -Embedding spawning PowerShell and writing HKCU Run values; (3) mail flow: DMARC-failing messages from domains with p=none that still reach inboxes, Migadu-relayed mail with mismatched envelope/From, protocol-relative links to Cloudflare Pages in HTML mail. Hardening: enforce DMARC reject on own domains and treat DMARC fail from p=none senders as quarantine at the receiving gateway, restrict Entra app consent and monitor mailbox-scoped application permissions, block mshta.exe where unused (ASR/WDAC). Triage lookalikes: Graph traffic is normal for Office clients and sync tools; the discriminator is the initiating process path and signature. Talos IOCs (hashes, domains, Cloudflare/CloudFront staging names) were deliberately not carried. Not relevant to any Swiss target by name; included for TTP transfer and because the Antino family is already tracked in the store via Jewelbug.
