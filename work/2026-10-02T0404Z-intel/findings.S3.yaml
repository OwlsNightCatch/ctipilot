    techniques: [T1566.002, T1204.002, T1219, T1543.003, T1547.001, T1059.001, T1105, T1555.003, T1036.005]
    affected_products: ["MSP360 Remote Monitoring and Management", "ConnectWise ScreenConnect", "Faronics Deploy"]
    entity_keys: ["product:connectwise-screenconnect"]
    new_entities: []
