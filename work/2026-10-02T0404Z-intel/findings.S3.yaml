  - title: "Unit 42 NetScaler threat brief (updated 30 Sep and 1 Oct) adds first-hand pre-disclosure telemetry: fingerprinting from 21 August, a DTLS-path web-shell wave from 4 September and a three-stage log-poisoning command-injection chain on 21 September"
