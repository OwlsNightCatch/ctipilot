    summary: |
      On 30 September 2026 law enforcement took control of KillSec's leak site (securing at least 110 TB of stolen data) as part of Operation KillSwitch, an investigation led by the Hamburg State Criminal Police Office and Public Prosecutor's Office into roughly 1,000 suspected attacks worldwide, about 500 of them identified as successful so far; Germany reports at least 70 cases. Three suspects were provisionally arrested and eight properties searched in Greece, Romania, Spain and the UK; five central servers (management infrastructure and victim-data storage) were brought under police control and KillSec domains redirect to a seizure notice. Europol names an administrator and main operator aged 16, a developer who turned 18 in August 2026, a negotiator and an affiliate, and says inquiries into other members continue. Authorities from Belgium, Finland, Germany, Greece, the Netherlands, Romania, Spain, Switzerland (fedpol and the Office of the Attorney General), the UK and the US took part with Europol and Eurojust, supported by Bitdefender and Group-IB. Swiss nexus: per the SDA report of the fedpol and Federal Prosecutor's Office announcement, the Office of the Attorney General has run proceedings against unknown persons since July 2025 over KillSec ransomware attacks on several Swiss companies between October 2023 and June 2025, and Swiss investigations continue. Tradecraft stated by the authorities: access by exploiting software vulnerabilities and poorly secured access points, particularly cloud storage; data copied to actor-controlled infrastructure; double extortion with a dark-web leak site where unpaid victims' files could be downloaded for free; and, per Europol, investigators uncovered how the group used AI to build and run its ransomware infrastructure and to identify potential victims. Risky Bulletin adds (its own sourcing) that the RaaS was cheap ($250 entry, 88% affiliate share), had a leak site still listing victims on 27 September, and has been linked to at least one zero-day, CVE-2025-31161 in CrushFTP; those details are not in the authorities' releases.
