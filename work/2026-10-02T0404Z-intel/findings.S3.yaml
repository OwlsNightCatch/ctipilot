      Exposure check: LiteLLM proxy with JWT/SSO authentication configured; version at or below 1.100.1 as of OX's post. Mitigation lever in the write-up's own terms: enforce the email-domain allowlist (user_allowed_email_domain) and require identity providers that only mint tokens with verified emails; the vendor has issued no fix. Detection class: authentication logs showing a first-seen token subject authenticating as an existing admin, and an sso_user_id change on an admin row. Fetch the LiteLLM advisory/GitHub issue before publishing; none was reached this run.
