    discovery_trace: "first seen at: msft-ti, WebFetch+extract https://www.microsoft.com/en-us/security/blog/topic/threat-intelligence/ (listing, newest item dated 2026-09-30) → primary: MSTIC post, URL https://www.microsoft.com/en-us/security/blog/2026/09/30/unauthenticated-command-injection-on-internet-facing-mail-servers-tracking-cve-2026-73570/ → pivot: WebSearch (\"CVE-2026-73570 Zimbra exploited in the wild SNMP command injection\") → CSA Labs note https://labs.cloudsecurityalliance.org/research/csa-research-note-zimbra-cve-2026-73570-snmp-nation-state-20/ → pivot: bridge cisa-kev (catalog JSON, dateReleased 2026-10-01T19:54Z) confirms CVE-2026-73570 dateAdded 2026-08-21"
    summary: |
      The store's 2026-08-20 entry on CVE-2026-73570 records ENISA's exploited flag and states that no vendor or lab reports observed intrusions. Three things have changed since. (1) CISA's KEV catalog lists the flaw (dateAdded 2026-08-21, dueDate 2026-08-24, forensicTriage "Yes", CWE-78); the store never recorded the KEV listing. (2) Cloud Security Alliance's 2026-08-26 note relays Shadowserver and CERT Polska counts of compromised internet-facing instances rising from roughly 155 (20 Aug) to at least 274 (22 Aug), with no named actor; that is a secondary relay and the Shadowserver figures were not fetched. (3) Microsoft Threat Intelligence published first-hand incident analysis on 2026-09-30, the material delta: across multiple confirmed compromises in more than one region and industry, Microsoft observed two out-of-band scanning tools probing the vulnerable injection point between 28 July and 7 August, after the 20 July fix (Zimbra 10.1.20) and before the 13 August public disclosure, using the same swatchdog-to-snmptrap shell path later exploited. Observed post-exploitation: the crafted SMTP request reaches Zimbra's swatchdog, which builds a snmptrap shell invocation, giving command execution as the zimbra service account; JSP web shells written into Jetty/mailboxd webroots by temporarily opening directory write permission and decoding a staged payload, with copies pushed to peer mailbox nodes; reverse shells (a named pipe joining /bin/sh to openssl s_client), cron, systemd and memfd_create persistence; a privilege-escalation chain through Zimbra's sudo-authorised helpers (a symlinked log file used to take ownership of the sudo PAM configuration, a pam_exec hook, then a NOPASSWD sudoers entry for the zimbra account); a systemd unit named like a Zimbra logging component with timestomped file times; and theft of Zimbra's own secrets (zmlocalconfig credentials, then authenticated LDAP queries for the pre-auth key, auth-token key and two-factor secret attributes), followed by SSH/rsync movement across the cluster using Zimbra's own SSH identity. One intrusion archived the mail-store backups and attempted cloud-blob exfiltration with AzCopy; Microsoft says the transfer is not confirmed complete. Microsoft names no actor ("exploitation was not limited to a single sector or geographic area"), reports at least one remote-access agent (SOCKS5-capable) and a Zimbra-specific credential/mailbox dumper, and a cryptominer alongside hands-on-keyboard activity; Microsoft describes 'one campaign' and a 'separate' malware family in 'another affected environment' but makes no statement about how many operators are involved. Microsoft's remediation: upgrade to 10.1.20 or later, remove the optional zimbra-snmp package or disable SNMP notifications and restrict SNMP/SMTP to trusted hosts, rotate all domain zimbraPreAuthKey values, review systemd units and sudoers/PAM for unexpected changes, and hunt for redundant JSP shells on every mailbox node.
    region_nexus: "global; self-hosted Zimbra is common in CH/EU public-sector and education estates (Microsoft: affected organizations span more than one region and industry)"
    primary_sector_nexus: "direct (internet-facing on-prem mail servers in public administration)"
