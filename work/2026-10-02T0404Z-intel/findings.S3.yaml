  - title: "Microsoft publishes first-hand analysis of CVE-2026-73570 Zimbra exploitation: pre-disclosure probing from 28 July, JSP web shells, a PAM/sudo privilege-escalation chain, Zimbra secret theft and cluster-wide lateral movement"
    sources:
      - { url: "https://www.microsoft.com/en-us/security/blog/2026/09/30/unauthenticated-command-injection-on-internet-facing-mail-servers-tracking-cve-2026-73570/", publisher: "Microsoft Threat Intelligence", date: "2026-09-30", role: "primary" }
