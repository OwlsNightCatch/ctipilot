    borderline_reason: "Published 2026-09-29 (inside the 54 h lookback of msft-ti, outside the 50 h window); the chain is a well-understood RMM-abuse pattern with several comparable store entries, so value is the concrete telemetry hooks (agent-to-PowerShell-to-msiexec lineage, UDP 48678 firewall rule, ScreenConnect RunFile staging path) and the publisher-block controls. Suggest a short threat entry or drop."
    admiralty_suggestion: "B2 (Microsoft first-hand telemetry, single source)"
    evidence:
      - quote: "Microsoft did not observe exploitation of ScreenConnect software itself"
        attribution: "Microsoft Defender Experts"
        source_url: "https://www.microsoft.com/en-us/security/blog/2026/09/29/phishing-abuses-rmm-tools-persistent-access/"
