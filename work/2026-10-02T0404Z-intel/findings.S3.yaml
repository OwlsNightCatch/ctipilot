  - title: "Microsoft: phishing-delivered, legitimately signed MSP360 RMM installer is used to silently install ConnectWise ScreenConnect as a second remote-access channel (July 2026 campaigns, unattributed)"
    sources:
      - { url: "https://www.microsoft.com/en-us/security/blog/2026/09/29/phishing-abuses-rmm-tools-persistent-access/", publisher: "Microsoft Defender Experts / Microsoft Threat Intelligence", date: "2026-09-29", role: "primary" }
    discovery_trace: "first seen at: msft-ti, WebFetch https://www.microsoft.com/en-us/security/blog/topic/threat-intelligence/ (listing, item dated 2026-09-29) → primary (no pivot needed): extract https://www.microsoft.com/en-us/security/blog/2026/09/29/phishing-abuses-rmm-tools-persistent-access/"
    summary: |
      In July 2026 Microsoft Defender Experts observed phishing campaigns across multiple industries delivering a legitimate, digitally signed MSP360 Remote Monitoring and Management installer (v2.5.0.67) under deceptive file names (meeting invitations, Zoom/Google Meet and Adobe Acrobat installers, RSVP e-cards, job offers, signature requests, DHL and a Social Security statement lure), reached through landing pages impersonating document-sharing portals and hosted on attacker domains, compromised sites and legitimate services (Amazon S3, Cloudflare R2, Dropbox, GitLab, Supabase). After a successful UAC elevation the installer registers two services (RMM.Agent.exe and RMM.Agent.Launcher.exe), writes tray autoruns, logs 'Begin installation' and 'End installation' events through eventcreate.exe and adds an inbound Windows Firewall allow rule for the agent on UDP 48678; when elevation is denied the install stops. The MSP360 agent then launches PowerShell with an execution-policy change, downloads a ConnectWise ScreenConnect MSI and installs it silently with msiexec /qn, creating a second, redundant remote channel; the operator then uses ScreenConnect's RunFile to stage and run tools in a ScreenConnect\Temp directory under the user's Documents (including the OneDrive-synced path): cursor and UI hiders, password and browser-credential viewers, and files named like Windows security or Phone Link components. Microsoft saw similar activity in July using FaronicsDeployAgent.exe as the first RMM, did not observe exploitation of ScreenConnect itself (legitimately obtained software is abused), and has not attributed the activity to a named actor. Microsoft's controls: govern approved RMM tools and enforce MFA on them, use Application Control or AppLocker publisher rules and Defender for Endpoint certificate blocking to stop unapproved RMM publishers, hunt for unapproved RMM installations and reset the installing accounts' passwords, enable cloud-delivered protection and the ASR rule blocking process creation from PsExec and WMI.
    region_nexus: "global; no regional or Swiss-specific data (lures include a US Social Security theme and DHL)"
    primary_sector_nexus: "indirect (generic RMM abuse; public-sector endpoints that allow user-run installers or have approved-RMM sprawl are exposed)"
    sector: "cross-sector"
