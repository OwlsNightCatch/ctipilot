  - title: "OX Security discloses CVE-2026-93355: LiteLLM JWT authentication falls back to an unverified email claim, letting any holder of a validly signed token become another user, including proxy_admin; unpatched after ~120 days"
    sources:
      - { url: "https://www.ox.security/blog/litellm-an-ordinary-login-token-can-become-someone-elses-admin-account/", publisher: "OX Security", date: "2026-09-29", role: "primary" }
    discovery_trace: "first seen at: ox-security, raw listing https://www.ox.security/blog/ (post dated 2026-09-29) → primary (no pivot needed): extract https://www.ox.security/blog/litellm-an-ordinary-login-token-can-become-someone-elses-admin-account/; identifier checked against the CVE.org record via https://cveawg.mitre.org/api/cve/CVE-2026-93355 (VulnCheck CNA, published 2026-09-28; cited for verification only, not as a source)"
    summary: |
      OX Research reports that LiteLLM, the open-source AI gateway that fronts OpenAI, Anthropic and other LLM APIs and holds the organisation's upstream API keys, spend data and virtual keys, resolves JWT-bearing requests first by user_id or sso_user_id and, on a miss (the normal case for an identity's first request), falls back to matching the token's email claim without checking email_verified. If the email matches an existing account, the request runs with that account's role (including proxy_admin) and a fire-and-forget background write permanently overwrites the victim's sso_user_id with the attacker's token subject, converting one forged claim into standing access. Prerequisites: a validly signed JWT from an identity provider the proxy trusts, carrying the victim's email as an unverified claim (OX notes several common IdP and self-service signup flows issue such tokens), network access to the proxy, no victim interaction. The only adjacent control, an email-domain allowlist, is off by default. OX scores it CVSS 3.1 8.8 (CWE-290), confirms the behaviour in LiteLLM through 1.100.1 (published 2026-09-10), and states it reported the flaw on 18 May 2026, followed up on 27 July with no vendor reply and published on 14 September after about 120 days with no fix. The CVE.org record (VulnCheck CNA, published 2026-09-28) lists it as 'Weak JWT Authentication via Email-Based User Lookup' with CWE-1390. No exploitation in the wild is reported.
    region_nexus: "global; relevant to any public-sector body that has stood up a LiteLLM AI gateway with SSO"
