    extended_notes: |
      Triage: an approved RMM generates the same service and PowerShell activity; the discriminators are the installer's lure-style file name executed from Downloads, the absence of a change ticket or enrolment in the organisation's RMM tenant, an RMM publisher not on the approved list, and a second RMM product installed by the first RMM's agent within minutes. Hardening lever named by Microsoft: block unapproved RMM publishers with application control. Microsoft's hashes, URLs and file lists were not carried.
