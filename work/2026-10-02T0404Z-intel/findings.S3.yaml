  - title: "elttam: pre-authentication format-string RCE in the tac_plus TACACS+ daemon (root by default), fixed in Shrubbery F4.0.4.32 on 21 September; the Facebook fork is archived and will not be fixed"
    sources:
      - { url: "https://www.elttam.com/blog/att-cking-tacacs-to-pwn-your-network-via-a-pre-auth-rce", publisher: "elttam", date: "2026-09-23", role: "primary" }
      - { url: "https://news.risky.biz/risky-bulletin-major-vulnerability-found-in-ancient-tacacs-networking-protocol/", publisher: "Risky Bulletin", date: "2026-09-25", role: "corroborating" }
    discovery_trace: "first seen at: risky-biz-news, feed https://news.risky.biz/rss/ (item 'Major vulnerability found in ancient TACACS+ networking protocol', 2026-09-25, outside the 145 h lookback) → pivot: WebSearch (\"TACACS+ protocol major vulnerability disclosed September 2026 researchers\") → primary: elttam post https://www.elttam.com/blog/att-cking-tacacs-to-pwn-your-network-via-a-pre-auth-rce (dated 2026-09-23)"
    summary: |
      elttam disclosed a remote, pre-authentication format-string vulnerability (CWE-134, CVE pending) in an error path (send_authen_error(); elttam also points implementers at get_authen_continue()) of tac_plus, the C daemon descended from Cisco's early TACACS+ Developer's Kit, yielding code execution as the daemon user (root by default). Reaching the sink needs only TCP/49 connectivity and two packets, but the packet body is obfuscated with the shared secret, so the chain pairs the bug with a pre-shared-key oracle: the server's own replies hand any peer that can reach TCP/49 enough keyed material for an offline attack on a wordlist-grade secret that resolves in seconds. elttam also describes an unproven route from outside the management network: a legitimate TACACS+ client that truncates an over-long username will obfuscate an attacker's payload with the key, so a device login form may deliver it correctly keyed without the secret; elttam tested the server-side behaviour in a lab but not on vendor equipment. Affected: Cisco's original kit, every Shrubbery release up to and including F4.0.4.31 (February 2026) and the Facebook fork; Shrubbery's F4.0.4.32 (21 September 2026) is the fix and is recorded in CHANGES only as 'Remote pre-authentication format string vulnerability (CWE-134)' with no CVE or credit; the Facebook fork is archived so no fix will come, and appliance vendors who embedded the code may not know their lineage. elttam's proof of concept targeted the Facebook fork on i386 with ASLR and NX disabled; because tac_plus forks per connection without exec, a failed attempt costs only the child while the randomisation slide persists. No exploitation of this bug is reported; elttam's background cites the 2023 command injection CVEs and CISA advisory AA25-239A on Chinese state-sponsored actors capturing and redirecting TACACS+ traffic. Remediation: upgrade to F4.0.4.32 or patch the two-line format-string call sites, restrict TCP/49 to NAS management addresses, and use a shared secret a wordlist will not find; servers answering a truncated AUTHEN/START with 'Invalid AUTHEN/START packet (too short)' descend from this code.
    region_nexus: "global; TACACS+ for network-device administration is common in CH public-sector and telco networks"
    primary_sector_nexus: "indirect-direct (management-plane AAA servers in government networks)"
    sector: "cross-sector"
