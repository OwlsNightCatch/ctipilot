    summary: |
      The store's Citrix NetScaler entry (CVE-2026-88771/-88772) cites GTIG/Mandiant, eSentire, watchTowr, CERT-EU and others but not Unit 42's telemetry, which adds the following. Unit 42 separates pre-disclosure activity (before the 27 September Citrix bulletin) from post-disclosure noise and says activity after 27 September may not match the original actors' indicators or TTPs. Pre-disclosure: (a) version fingerprinting requests from 21 August (an admin-UI stylesheet path and a Gateway language resource), repeated against 100+ systems on 21-22 August, which pushes the earliest observed reconnaissance roughly two weeks before the 'early September' start reported by GTIG and the 5 September exploitation date given by eSentire; (b) between 4 and 24 September a DTLS-exploitation wave in which the actor repeatedly requested files under the appliance's /vpn/scripts/linux/ client-package directory, which doubled as the web-shell hosting path (a PHP web shell with RC4-encrypted command channel offering command execution, file read/write and a SUID helper for privilege escalation), with the actor rotating VPS and Cloudflare WARP addresses; separately a continuous stream of requests to the Gateway /logon/LogonPoint/Authentication/GetUserName page from 10 to 27 September, which Unit 42 calls anomalous and worth investigating; (c) on 21 September a three-stage command-injection chain against a US-based target's NetScaler: a Base64 dropper placed in the HTTP User-Agent (logged to the VPN access log), a login request whose failure text lands in ns.log after the NSPPE marker, and the ns_monuploadd_err.pl log-monitor script then executing that text, which fetches and decodes the staged payload into sh or php. The payload sets the SUID/SGID bits on /bin/sh, creates a hidden PHP receiver under the Gateway LogonPoint custom directory, edits httpd.conf so a hidden file executes as PHP and a versioned-CSS-looking alias maps to it, enables the PHP engine and reloads Apache with SIGHUP (no restart entry); the shell reads its command from a cookie named like NetScaler's NSC_* namespace. Unit 42 reports 50,277 exposed instances potentially vulnerable as of 27 September (Cortex Xpanse; exposed, not confirmed vulnerable; compare Censys 42,735 in the store entry) and a Threat Prevention signature for CVE-2026-88771. Hunting concept offered: search NetScaler syslog for 'pitboss' PPE-died / missed-heartbeat lines carrying trailing command text after the NSPPE marker (log poisoning indicator; not proof of exploitation on patched devices). Unit 42 names no actor and says its general hunting guidance (administrative sessions, outbound connections, logging gaps) is not tied to observed TTPs; it repeats that patching does not remove established persistence.
    region_nexus: "global; Unit 42 victim example is US-based; NetScaler Gateway is internet-facing VPN/ADC infrastructure widely used by CH public-sector bodies"
