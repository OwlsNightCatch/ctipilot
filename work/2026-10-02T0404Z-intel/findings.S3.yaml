    summary: |
      ANNUAL REPORT — Microsoft Digital Defense Report 2026, released 2026-10-01, covers July 2025 to June 2026 from Microsoft telemetry (a vendor data set, not a census: Trending Topics notes the country ranking also reflects Microsoft's customer base). Public-sector findings: Microsoft says government agencies and services were the sector most impacted by cyber threats in 2026 (27% of observed activity, up from 17% in 2025) and the most frequently targeted sector for nation-state activity. Intrusion mechanics: phishing accounted for 23% of observed intrusions (7% in 2025); 52.2% of intrusions involving valid accounts resulted in further credential theft; DART engagement data show a statistically significant year-on-year increase in dwell time across multiple sectors; Microsoft states discovery-to-weaponization of a vulnerability can be well below 24 hours and projects a record 72,000 CVEs in 2026. Microsoft's top three emerging threats are open-source supply-chain compromise, attacks against edge devices, and AI as a force multiplier, and it urges a shift from patch counts to exposure-reduction metrics, with phishing-resistant MFA/passkeys, tiered administration and privileged-access enforcement as the identity controls. Ransomware (Microsoft Defender detections against enterprises): Akira most active at 22% (+150%), Qilin 14% (+111%); by leak-site data Qilin leads with 16.4% of victims (+386%); the report's industry table lists government agencies and services at 57 events in the 2025 period and 133 in 2026, and its country table lists Switzerland at 29 and 59 (+103%) against Germany 59 to 222 (+276%) (read from the PDF text extraction; Trending Topics independently says ransomware cases 'more than doubled' in Switzerland). Switzerland also appears in the report's Russia nation-state notification data as one of the ten most-targeted countries (2%, tied with Poland and Sweden); Russia's top targeted sector in that data is government (25%), and Microsoft reports Russian actors using internet-facing edge devices for access, including a December 2025 destructive attack on Poland's energy sector. Trending Topics reads Switzerland at rank 39 and Germany at rank 10 of attacked countries (1.7% share); that ranking was not read from the PDF.
