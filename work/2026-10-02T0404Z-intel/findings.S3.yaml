    summary: |
      DomainTools Investigations (2026-10-01) analyses material that a darknet actor using the handle SVA2027 began selling in May 2026, allegedly taken from Spetsvuzavtomatika, a Rostov-on-Don research institute the US sanctioned in 2021 for activities tied to the SVR. DomainTools assesses with high confidence that the seller held authentic material (file names match, consistent contract numbers, project codes and personnel, Cyrillic and English machine names) but says the original breach and how it happened cannot be assessed, no public evidence ties SVA2027 to the intrusion, and the institute acknowledged an attack while denying its internal network was compromised. Its strongest assessment is that the institute is a developer rather than a front-line intrusion group, serving military-unit customers, and that the documents do not prove every tool was deployed or used together. Named projects: Felix-23 and HAD (Internet-facing discovery, enrichment from search engines, Shodan and VirusTotal, persistent target records, credential and brute-force testing, RCE and SQL-injection checks, DDoS measurement, VPS and proxy-chain management, with integrations of the open-source Nettacker and BoNeSi); Putnik (remote Layer 2 access inside a target network via TAP-mode OpenVPN and SoftEther, with documented scenarios for ARP/DHCP/DNS spoofing, LLMNR and NBT-NS poisoning, mDNS abuse, NTLM capture with Responder, printer interception, authentication coercion and a Zerologon-to-Domain-Admin path covering NTDS extraction and pass-the-hash; previously associated with the name Beryllium); Initiative-24 (using trusted public-cloud storage, email, VM and serverless services to control agents and move data out, including hidden Exchange folders not visible in Outlook or webmail, explicitly motivated by security products reporting incidents to the cloud); Botany (modular Android collection framework, moderate confidence); Blik and Glare (camouflaged Android storage utilities); and Chain-24 (research on anonymous procurement of hosting, mail, virtual SIMs and leaked databases, assessed as requirements rather than confirmed transactions). A 2,406-entry IP list in the dump is assessed as a mixed working dataset, not institute-owned infrastructure.
    region_nexus: "global; Russian state cyber-development ecosystem relevant to European government targets of SVR-linked operations (the leak itself names no victims)"
