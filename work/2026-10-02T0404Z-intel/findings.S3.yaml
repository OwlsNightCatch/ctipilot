      Exposure check (Microsoft): internet-facing Zimbra with the optional zimbra-snmp package installed and SNMP notifications enabled; fixed in 10.1.20 (released 2026-07-20). Post-patch compromise check matters most because exploitation predates disclosure by at least 16 days (earliest Microsoft-observed probing 28 July): look for the swatchdog-spawned shell lineage, JSP files in /jetty*/webapps and /work/zimbra/jsp, sudoers.d and PAM changes, unexpected systemd units, and zmlocalconfig/ldapsearch use by the zimbra account. Triage: Microsoft states a named-malware detection is not required for severe outcomes ("Do not rely solely on named-malware detections"); a reverse shell from a mail server is a priority incident even with no quarantined payload. Benign lookalike for the zmprov/zmlocalconfig/ldapsearch sequence is routine Zimbra administration under the zimbra account; the discriminators are the parent process (Java/jspawnhelper or the swatchdog perl lineage), the time of day and the follow-on archive creation. Microsoft's IOC tables, hunting queries and Defender detection names were deliberately NOT carried (no IOCs). CSA's Shadowserver counts are a secondary relay; fetch Shadowserver before quoting.
