  - title: "Talos: China-nexus UAT-11587 runs a year-long espionage campaign against government and policy bodies in eight Asian countries with Antino, a Rust backdoor whose only C2 is Microsoft 365 (Outlook and OneDrive via Microsoft Graph)"
    sources:
      - { url: "https://blog.talosintelligence.com/china-nexus-uat-11587-targets-government-and-policy-organizations-across-asia-with-antino-backdoor/", publisher: "Cisco Talos", date: "2026-09-30", role: "primary" }
    discovery_trace: "first seen at: talos, feed https://blog.talosintelligence.com/rss/ (item published 2026-09-30T10:00Z) and listing extract https://blog.talosintelligence.com/ → primary (no pivot needed): extract of the Talos post; pivot: WebSearch (\"Symantec Jewelbug crypto fraud espionage Antino backdoor Microsoft Graph\") to the existing Jewelbug coverage (Symantec 2026-08-13) which Talos cites as overlapping"
    summary: |
      Cisco Talos tracks UAT-11587 (first activity September 2025; at least 10 confirmed and 5 probable affected institutional environments by July 2026, about 350 compromised endpoints across eight countries: Taiwan, India, the Philippines, Cambodia, Pakistan, Thailand, Myanmar and Syria). Targeting covers defense and national security, executive government and central administration, foreign affairs, justice/law-enforcement/border and interior security, legislatures, government IT and shared e-government services, think tanks and civil society. Talos assesses with high confidence that the cluster is China-nexus (decoy metadata with zh-CN language tag, Simplified Chinese author value and +08:00 timestamps; Cargo registry paths pointing to a mainland Rust mirror; lure and target selection) and with moderate confidence that it conducts intelligence gathering. Evidence class is infrastructure, tooling and victimology, assessed by the telemetry-holding lab; Talos notes a low-confidence delivery-layer overlap with UNC6384 and overlaps with the Antino activity Symantec attributes to Jewelbug, but could not verify a link to Jewelbug's financially motivated activity and keeps UAT-11587 as a separate cluster. Delivery: spear-phishing that abuses envelope-sender versus visible-From misalignment (SPF passes for the attacker's Migadu-hosted envelope domain, DMARC alignment fails, the impersonated domain's p=none policy lets the message through), plus an HTML clone of Gmail's attachment widget linking to a Cloudflare Pages URL with a per-recipient identifier in a protocol-relative link. Five-stage chain: HTA or WSF stager run by mshta/Windows Script Host with a tracking beacon → JScript downloader/decryptor (RC4, custom Base64) pulling encrypted resources from Cloudflare R2 or CloudFront → scripted .NET BinaryFormatter deserialization (ActivitySurrogateSelector and AxHost State gadget chain, first attempting to disable the .NET check that blocks it) loading a .NET downloader inside mshta.exe → downloader writes a decoy plus a three-file bundle with randomised extensions → a Microsoft-signed Windows ADK binary (GatherOsState.exe) sideloads Antino as slc.dll. Antino (Rust, 32/64-bit) authenticates to Microsoft Graph with the OAuth 2.0 client-credentials flow of an actor-registered Entra app, polls an actor Outlook folder every 10 seconds for command emails (command_req_/command_res_ subject prefixes carrying JSON) and uses OneDrive paths for one-minute heartbeats, tool staging and exfiltration, so network telemetry shows only graph.microsoft.com and login.microsoftonline.com. Commands: cmd, powershell, system_info, execute_program, list_files, upload/download_file, load_shellcode (optional sleep mask via Sleep/VirtualAlloc hooks and a vectored exception handler) and add_to_run. Persistence and execution proxying abuse the Windows Scripted Diagnostics workflow (sdiageng.dll loading the PCW troubleshooting package, sdiagnhost.exe -Embedding running an attacker-written PowerShell script that sets an HKCU Run value); the config sits in a custom .cfg PE section (XOR key 0xAB 0xCD).
    region_nexus: "APAC-focused; no European or Swiss victim named. Transferable to CH public sector: sender-spoof handling for p=none domains, Microsoft Graph C2 from non-Microsoft processes, mshta/HTA execution"
