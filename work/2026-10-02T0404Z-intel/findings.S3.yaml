  - title: "Microsoft: NeedyMantis, a modular post-compromise malware family used by China-aligned operators (incl. Storm-3069 of the DAEMON Tools supply-chain compromise) against telecoms, universities, intergovernmental organizations and government contractors"
    sources:
      - { url: "https://www.microsoft.com/en-us/security/blog/2026/09/28/needymantis-unpacking-a-post-compromise-malware-family-used-in-targeted-operations/", publisher: "Microsoft Threat Intelligence", date: "2026-09-28", role: "primary" }
    discovery_trace: "first seen at: msft-ti, extract of https://www.microsoft.com/en-us/security/blog/topic/threat-intelligence/ (item dated 2026-09-28; outside the 54 h lookback) → primary (no pivot needed): extract https://www.microsoft.com/en-us/security/blog/2026/09/28/needymantis-unpacking-a-post-compromise-malware-family-used-in-targeted-operations/"
    summary: |
      Microsoft Threat Intelligence describes NeedyMantis, a modular post-compromise malware family seen since at least October 2025 in a limited number of targeted operations against telecommunications organizations, universities, medical nonprofits, intergovernmental organizations and government contractors. Microsoft found it by pivoting from Kaspersky's DAEMON Tools investigation; at least one operator is Storm-3069, Microsoft's designation for the DAEMON Tools supply-chain activity, which Microsoft assesses originates from China without attributing it to a Chinese nation-state actor, and additional activity suggests more than one operator, all aligning with China-linked targeting and selective deployment. It is deployed after access is already established (not seen distributed through a supply chain; in one case an operator used Impacket from a network share to copy the legitimate application, malicious DLL and archive to a target). Architecture: a first-stage loader masquerading as a required DLL (e.g. the update component of Poedit, libcurl or Vim DLLs, and fake Office, Broadcom, Intel or NVIDIA component names) is DLL-sideloaded by legitimate software, extracts a PowerShell second-stage loader from a custom XOR-encoded, compressed archive whose layout changes per sample, then loads shellcode modules with a WebSocket-based C2 component, with anti-debugging and obfuscated stack strings. Microsoft's controls: egress monitoring for the C2 domain, cloud-delivered protection and block-at-first-sight, EDR in block mode, network protection and automatic attack disruption, with Defender detections for DLL sideloading and Impacket activity.
    region_nexus: "global; intergovernmental-organization and government-contractor victimology is relevant to Geneva-based and federal-supplier environments, but no European victim is named"
