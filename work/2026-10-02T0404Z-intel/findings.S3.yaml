    summary: |
      Belnet, the Belgian national research and education network that serves government, university and research institutions, identified a security and privacy incident on 24 September 2026, caused by exploitation of a zero-day vulnerability in technology provided by an external supplier; the vulnerability was remediated on 25 September at 08:10. Belnet's investigation, run with the Centre for Cybersecurity Belgium, found the attackers copied and exfiltrated to external infrastructure all emails processed through the affected infrastructure between 22 July and the morning of 25 September 2026 (incoming mail to Belnet-owned domains such as its guest-roaming and BNIX addresses, including sender details, body and attachments), plus every download link generated by its FileSender and FedSender file-transfer services in that period, which could have let the attackers fetch the transferred files; password-protected or authenticated transfers are described as unreadable unless the password was written in the upload comment. Guest-roaming accounts generated through the service are also listed as affected. On 29 September Belnet removed still-active download links and disabled transfers created in the period. Belnet says no information is yet available on the identity or affiliation of the actor and does not name the supplier or product; Risky Bulletin (30 September) reports the same facts and adds that the attacker stole mail sent to Belnet and to one of its customers. For Swiss defenders the lesson is the shared-service and supplier pattern: a national academic/government network operator's mail path and transfer service were silently read for over two months through an unnamed supplier zero-day, and links shared via file-transfer services during the window should be treated as potentially exposed.
