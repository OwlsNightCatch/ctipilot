  - title: "GTIG: AI-assisted discovery skews to RCE (50% vs 26%), exploitation is shifting to rapid n-day weaponization, and BeyondTrust CVE-2026-1731 drew six exploiting clusters within seven days of disclosure"
    sources:
      - { url: "https://cloud.google.com/blog/topics/threat-intelligence/vulnerability-discovery-and-exploitation-trends-in-the-ai-era/", publisher: "Google Threat Intelligence Group", date: "2026-09-30", role: "primary" }
    discovery_trace: "first seen at: mandiant-gtig, feed https://feeds.feedburner.com/threatintelligence/pvexyqv7v0v (item published 2026-09-30T14:00Z) → primary (no pivot needed): extract https://cloud.google.com/blog/topics/threat-intelligence/vulnerability-discovery-and-exploitation-trends-in-the-ai-era/"
    summary: |
      GTIG's analysis of January 2025 to August 2026 vulnerability data (GTIG's own risk ratings, not CVSS) reports: disclosures doubled from 5,045 in January 2026 to 10,477 in July and 10,740 in August, inflated by automated CNA assignment (about 5,000 Linux-kernel CVEs with no observed in-the-wild zero-day); GTIG recorded 141 distinct vulnerabilities exploited between January and August 2026, above the 127 for all of 2025, yet only 0.23% of 2026 disclosures were exploited; zero-days averaged 11 per month (22 in August) and made up 62% of exploited vulnerabilities, while GTIG's own reading is that growth is mainly rapid weaponization of n-days (exploited High-Risk vulnerabilities rose from 28 in 2025 to 75), which GTIG speculates is helped by LLM-assisted patch-diffing. By attack surface, edge and security appliances were 14% of exploited vulnerabilities and enterprise directory and collaboration hubs 11%; over 65% of exploited edge flaws were rated High or Critical, with attackers favouring unauthenticated public management interfaces. Among likely AI-discovered vulnerabilities (a heuristic GTIG says undercounts), 50% lead to RCE versus 26% across the CVE ecosystem; as an example GTIG cites BeyondTrust Privileged Remote Access / Remote Support CVE-2026-1731, an unauthenticated OS command injection found autonomously by a third-party research agent, where GTIG saw one threat cluster exploit it within four days of disclosure and five more within seven, dropping SNOWLIGHT, SPARKRAT and cryptominers after privilege escalation and data exfiltration. For AI infrastructure GTIG tracked 2,076 AI-related CVEs since January 2025 (over 1,500 in 2026), with orchestration frameworks 50% of them and inference gateways 212; confirmed exploitation of newly disclosed flaws in LiteLLM (CVE-2026-42271), Langflow (CVE-2026-5027 and CVE-2025-3248) but no AI-infrastructure zero-day. GTIG's advice: move from unprioritized mass patching to threat-intelligence-driven triage, targeted edge defense and automated remediation, and run AI-enhanced code review before release.
    region_nexus: "global; no Swiss-specific data"
    primary_sector_nexus: "indirect (prioritisation context for patch programmes; edge-appliance emphasis matches public-sector estates)"
    sector: "cross-sector"
    cves: [CVE-2026-1731, CVE-2026-42271, CVE-2026-5027, CVE-2025-3248]
    techniques: [T1190, T1588.006]
    affected_products: ["BeyondTrust Privileged Remote Access", "BeyondTrust Remote Support", "BerriAI LiteLLM", "Langflow"]
    entity_keys: ["product:berriai-litellm"]
    new_entities:
