    discovery_trace: "first seen at: heise-sec, URL https://www.heise.de/news/Ransomwaregruppe-Killsec-ausgehoben-Teenager-als-Hauptverdaechtiger-11473281.html (feed item 2026-10-01T16:00Z) and europol-newsroom, URL https://www.europol.europa.eu/rss.xml → pivot: Europol press release, URL https://www.europol.europa.eu/media-press/newsroom/news/teenager-suspected-of-leading-killsec-ransomware-group-law-enforcement-seizes-servers-and-leak-site (participant list names Switzerland: fedpol, OAG) → WebSearch (\"Operation Killswitch KillSec fedpol Bundesanwaltschaft Schweiz Ransomware\") → pivot: Moneycab URL https://www.moneycab.com/it/behoerden-zerschlagen-hacker-infrastruktur-firmen-als-opfer/ (cites joint fedpol/OAG statement) → fedpol press-release listing URL https://www.fedpol.admin.ch/en/press-releases → primary: fedpol statement URL https://www.fedpol.admin.ch/en/newnsb/cBOoSTI5a7sc"
    summary: |
      On 30 September 2026 a Europol/Eurojust-coordinated action, led by the Hamburg State Criminal Police Office and Hamburg Public Prosecutor's Office as "Operation KillSwitch", took control of the KillSec ("KillSecurity") ransomware group's leak site and five central servers, secured at least 110 terabytes of stolen data, made three provisional arrests and ran eight searches in Greece, Romania, Spain and the United Kingdom. Europol says investigators identified a 16-year-old as the suspected administrator and main operator, a developer who turned 18 in August 2026, and persons in negotiator and affiliate roles, and ties the group to around 1,000 suspected attacks worldwide, about 500 identified so far as successful. Switzerland took part through fedpol and the Office of the Attorney General (OAG): the OAG has run criminal proceedings against persons unknown since 31 July 2025 over KillSec ransomware attacks on several Swiss companies between October 2023 and June 2025, and fedpol, working with cantonal police forces and the NCSC, mapped the group's modus operandi before the action. Both authorities describe double extortion (data copied and exfiltrated, servers encrypted, publication threatened if no ransom is paid). Europol states KillSec exploited software vulnerabilities and poorly secured access points, particularly to cloud storage, and says investigators found it used AI to build and maintain its ransomware infrastructure and identify potential victims; heise reports the group's leak site now shows a law-enforcement notice. Not disclosed: the vulnerabilities used, victim names, and whether any Swiss public-sector body was among the Swiss victims; the OAG says it can give no further information, and Europol says the seized evidence may identify further victims.
    region_nexus: "Switzerland: OAG/fedpol participated and Swiss companies are among KillSec's victims (Oct 2023 to Jun 2025); German-led, EU-wide operation (ten countries)"
