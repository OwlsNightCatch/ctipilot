    summary: |
      Stadt Wien's own press release of 30 September 2026 says an attacker had web access to parts of an internal documentation platform of the city administration (Magistrat) between 3 and 11 September 2026 and copied internal content, in particular test data, training materials and project documentation: about 26,000 documents and pages, roughly nine gigabytes, including personal data (in places special categories under GDPR) plus business and infrastructure information. The intrusion surfaced externally: Austria's national CERT (CERT.at) noticed an offer in an online forum to buy a vulnerability in a technical system of the city and alerted the city on 9 September; the city's WienCERT and MA 01 Wien Digital analysed it and, with the Directorate for State Protection and Intelligence (DSN), identified and closed the flaw. The city filed a voluntary incident report under the Austrian NIS Act on 10 September and the statutory report to the data protection authority on 15 September, and says 2,885 citizens, 2,083 employees and 856 contractors will be notified within a week (heise prints 865 contractors; the city's text says 856). CIO Klemens Himpele states the attacker never had control of IT systems or user accounts and that no indication of publication exists; both are the city's assertions. The platform product, the flaw and any CVE are not named, and the actor is not identified; the public disclosure came 19 days after the access ended.
