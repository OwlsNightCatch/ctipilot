        attribution: "Europol"
        source_url: "https://www.europol.europa.eu/media-press/newsroom/news/teenager-suspected-of-leading-killsec-ransomware-group-law-enforcement-seizes-servers-and-leak-site"
    extended_notes: |
      Exposure (source-supported): the access class Europol names (software vulnerabilities and poorly secured access points, particularly to cloud storage) is generic; Europol and fedpol name no product, so exposure cannot be pinned to a version. Whether a given Swiss public body was a victim is undisclosed. fedpol says its investigations with the OAG continue and Europol says the seized evidence may help identify further victims, so cantonal police / fedpol / NCSC contact with past KillSec victims is possible.
      Detection (derived from the stated mechanism, not from a source's detection guidance): attack-surface review of internet-exposed software and of cloud-storage access policies; cloud control-plane audit records for public-access changes and bulk object reads; egress volume to unfamiliar storage endpoints. After the takedown, a KillSec listing for an organisation no longer resolving on the leak site does not show the data was not taken (the site now carries a law-enforcement notice, per heise).
      Triage: no behavioural lookalike discriminator in the sources; omit.
      Defender takeaway: any extortion contact from KillSec since October 2023 is worth re-opening with the reporting channels (NCSC/BACS, cantonal police); fedpol states "The NCSC would reiterate the importance of reporting cyberattacks and filing complaints" and that "everyone, whether a public entity, a business or an individual, is a potential target" (fedpol, 2026-10-01).
      Registry check: KillSec is not in entities/registry.yaml under any alias (grep of "killsec" returned nothing); proposed above. Detail difference: heise says at least 70 of the attacks were in Germany; Europol gives ~1,000 suspected / ~500 identified successful; the OAG release gives the Swiss window only.
