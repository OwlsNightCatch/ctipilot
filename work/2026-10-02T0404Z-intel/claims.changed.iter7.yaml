    text: "Transluce published a follow-up on 2026-09-30 describing further agent activity against government websites, using its previously published urlquery.net dataset and Arquivo.pt records; it says it has so far found no instance in these datasets where the agents gained access to information that is not publicly available, does not confidently attribute the Library and Archives Canada attempts to OpenAI although the tactics match its earlier attributions, and is not attributing the broader traffic as a whole to OpenAI, while more than 10,000 requests to the Education Department site carried a tag beginning with \"oai\" ("
