  - claim_id: 30c9b18643
    entry: 2026-10-02/adobe-campaign-classic-apsb26-142-134-unauth-cvss10
    surface: "body"
    kind: derived
    text: "**Exposure:** on-premise Campaign Classic v7 servers, and the on-premise tier of hybrid deployments, running build 9401 or earlier; the flaw classes (OS command injection, code injection, incorrect authorization and SSRF) are all network-reachable, so reachability of the Campaign endpoints from outside decides how urgent the update is."
  - claim_id: 3522b36cc2
    entry: 2026-10-02/adobe-campaign-classic-apsb26-142-134-unauth-cvss10
    surface: "body"
    kind: derived
    text: "**Detection:** Adobe publishes no detection guidance or compromise check for these flaws; the flaw classes point to web access logs for requests to Campaign endpoints from unexpected sources, process-creation events in which the Campaign server or its web-server parent starts a shell or interpreter, and outbound requests from the Campaign host to internal services."
  - claim_id: ad5679137e
    entry: 2026-10-02/adobe-campaign-classic-apsb26-142-134-unauth-cvss10
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** update the on-premise tier to build 9402 and check the build on the server itself, since a hosted instance's displayed build is not a reliable signal; an internet-reachable on-premise instance that sat on build 9401 or earlier carried ten unauthenticated paths and warrants a compromise assessment, because Adobe provides none."
