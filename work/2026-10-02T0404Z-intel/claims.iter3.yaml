    text: "On 2026-09-30 a German-led, Europol- and Eurojust-coordinated operation took control of the KillSec ransomware group's leak site and five servers, secured at least 110 TB of stolen data, made three provisional arrests and named a 16-year-old as suspected main operator. fedpol and the Office of the Attorney General took part: the OAG has run proceedings since 2025-07-31 over KillSec attacks on several Swiss companies between October 2023 and June 2025."
