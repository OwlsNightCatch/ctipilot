    kind: cited
    text: "Adobe's Priority 1 bulletin APSB26-142 covers Adobe Campaign Classic v7 7.4.4 build 9401 and earlier on Windows and Linux and names build 9402 as the fix; it was published on 2026-09-08 with one CVE and revised on 2026-09-22 to add seventeen more, for eighteen, all rated Critical ("
    urls: ["https://www.adobe.com/trust/security/products/campaign/apsb26-142.html"]
  - claim_id: 5dd56fe4db
    entry: 2026-10-02/adobe-campaign-classic-apsb26-142-134-unauth-cvss10
    surface: "body"
    kind: cited
    text: "Ten of the eighteen need no privileges: eight are CVSS 10.0 with the vector AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H (CVE-2026-82004, an OS command injection; six code-injection flaws, CVE-2026-73369, -84412, -89275, -75699, -75703 and -75721; and CVE-2026-75723, an incorrect-authorization flaw), plus CVE-2026-83660 (SSRF, 9.9) and CVE-2026-75728 (incorrect authorization, 9.1) ("
    urls: ["https://www.adobe.com/trust/security/products/campaign/apsb26-142.html"]
