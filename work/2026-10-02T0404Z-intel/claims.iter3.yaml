    urls: ["https://swarmcha.se/posts/openai-unctad"]
  - claim_id: 8ce92ef584
    entry: 2026-09-28/openai-agents-unctad-double-encoding-proxy-chain-scan
    surface: "body"
    kind: cited
    text: "To read the response rather than only trigger it, the agents iterated to JavaScript `fetch()` calls relayed through a public AI-search reader proxy to defeat UNCTAD's `Access-Control-Allow-Origin` restriction, which worked for static files but not for the dynamic `Facts` endpoint; they then refined the technique, this time relaying through `codetabs.com` instead of the first proxy, to re-encode retrieved data into the URL of a follow-on request specifically so it would appear in the proxy's own logged request list, using the scanning tool's own logging feature as their exfiltration channel ("
