  - claim_id: 94a2767362
    entry: 2026-10-02/belnet-supplier-zero-day-mail-copied-65-days
    surface: "body"
    kind: cited
    text: "Between 2026-07-22 and the morning of 2026-09-25, a window of 65 days, the attackers copied to external infrastructure all incoming mail to Belnet-owned domains (guest-roaming and BNIX addresses) with sender details, content and attachments, and every download link its FileSender and FedSender services generated, which could let them fetch the transferred files; the notice also lists guest-roaming accounts without saying what that covers, and describes password-protected or authenticated transfers as unreadable unless the password was written in the upload comment ("
    urls: ["https://www.belnet.be/en/news-events/news/security-and-privacy-incident-affecting-belnets-it-infrastructure"]
  - claim_id: bc08fc1923
