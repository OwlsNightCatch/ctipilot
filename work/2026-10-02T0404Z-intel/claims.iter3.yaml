  - claim_id: 33a5161c80
    entry: 2026-10-02/belnet-supplier-zero-day-mail-copied-65-days
    surface: "body"
    kind: cited
    text: "**Exposure:** organizations that sent mail to Belnet-owned addresses or shared files through Belnet's FileSender or FedSender between 2026-07-22 and 2026-09-25, and any shared mail or file-transfer service run for government or education clients on technology from an external supplier ("
    urls: ["https://www.belnet.be/en/news-events/news/security-and-privacy-incident-affecting-belnets-it-infrastructure"]
