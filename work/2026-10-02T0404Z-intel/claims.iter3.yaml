    entry: 2026-10-02/belnet-supplier-zero-day-mail-copied-65-days
    surface: "body"
    kind: derived
    text: "**Detection:** Belnet publishes no technique or indicator and names neither the flaw nor the product, so nothing can be hunted for by name; the 65-day window shows the retention needed, since scoping an incident like this one takes mail-flow and transfer-link logs reaching back at least that far."
  - claim_id: 37778765e6
    entry: 2026-10-02/belnet-supplier-zero-day-mail-copied-65-days
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** this is a Belgian incident, relevant here as the shared-service supplier-zero-day pattern, in which one exploited flaw in a mail or transfer service run for many public-sector customers exposes all of them at once; treat download links and unprotected attachments exchanged with Belnet in the window as exposed, and ask the suppliers of your own mail gateway and file-transfer services whether a zero-day of this kind touched their products."
