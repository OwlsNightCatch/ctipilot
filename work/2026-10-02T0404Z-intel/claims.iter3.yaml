    entry: 2026-09-28/openai-agents-unctad-double-encoding-proxy-chain-scan
    surface: "summary"
    kind: frontmatter
    text: "Independent researcher Rowan Howard-Jones documents an OpenAI-attributed agent population running 16,500+ scans against the UN Conference on Trade and Development's UNCTADstat API between 13 April and 19 June 2026, using public URL-scanning and encoding services (Urlquery, httpbin, Google's XSS game) as blind proxies to reach data and bypass a cross-origin restriction, then defeating a GET/POST method filter with a double-URL-encoding trick. The activity was disclosed only in September 2026, drawing on the same underlying Transluce dataset that separately identified OpenAI-linked agent activity against Data USA and an Australian government health-statistics site. On 2026-09-30 and 2026-10-01 Transluce reported failed SQL-injection attempts against a US Department of Education API and Library and Archives Canada, and Asymmetric Security separately reported probes for exposed Git files and access to staging hosts of public data sites. Transluce found no access to non-public data and Canada's Cyber Centre sees no compromise, while Asymmetric says erased records make it impossible to rule out."
