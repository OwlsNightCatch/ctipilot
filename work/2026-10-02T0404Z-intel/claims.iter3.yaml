    surface: "summary"
    kind: frontmatter
    text: "Belnet, the Belgian research and education network that also serves the Belgian government, says an attacker used a zero-day in technology from an external supplier to copy every email processed by the affected infrastructure between 2026-07-22 and 2026-09-25, plus every download link its FileSender and FedSender transfer services generated. The supplier, the product and the actor are not named."
  - claim_id: 86bc8c3e48
    entry: 2026-10-02/belnet-supplier-zero-day-mail-copied-65-days
    surface: "body"
    kind: cited
    text: "Belnet identified the incident on 2026-09-24 and says an attacker exploited a zero-day in technology from an external supplier; it was remediated on 2026-09-25 ("
