    kind: cited
    text: "SDIS 66, the fire and rescue service of the Pyrénées-Orientales, confirmed to Radio France on 2026-10-01 that data was stolen from one of its servers, which is maintained by a technical provider ("
    urls: ["https://www.ici.fr/infos/faits-divers-justice/le-sdis-66-victime-d-une-fuite-de-donnees-7983412"]
  - claim_id: eb88f65475
