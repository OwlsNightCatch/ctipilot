# claims: 292
# by_kind: {"cited": 148, "derived": 38, "frontmatter": 71, "record-summary": 5, "uncited": 30}
claims:
  - claim_id: a0d8f358a9
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "headline"
    kind: frontmatter
    text: "Fixed on 20 July, identified on 13 August, probed from 28 July: a CVE-keyed patch process never saw this one coming"
  - claim_id: 9fc5587fee
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "summary"
    kind: frontmatter
    text: "Zimbra shipped ZCS 10.1.20 on 2026-07-20 with a fix for a command injection in the SNMP monitoring component, and the identifier CVE-2026-73570 followed on 2026-08-13. Microsoft Threat Intelligence now reports confirmed intrusions in more than one region and industry, with probing of the injection point from 2026-07-28, before disclosure, and CISA lists the flaw in KEV (added 2026-08-21). The flaw needs no authentication and applies only where the optional zimbra-snmp package is installed and SNMP notifications are enabled; Microsoft's cases combined web shells, root escalation, theft of Zimbra's authentication keys and cluster-wide movement, so an upgrade does not evict an attacker already inside."
  - claim_id: 4d61692ecf
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade every Zimbra Collaboration host to 10.1.21 (10.1.20 is the minimum for CVE-2026-73570); where the upgrade cannot happen at once, remove the zimbra-snmp package or disable SNMP notifications and restrict SNMP and SMTP to trusted hosts."
  - claim_id: db6eec93b8
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "actions[1]"
    kind: frontmatter
    text: "On every host that ran a build before 10.1.20 with SNMP notifications enabled at any time since 2026-07-28, upgrading is not enough: rotate all domain zimbraPreAuthKey values and run the compromise check described in the body on every mailbox node."
  - claim_id: a1ea8eb86b
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "cves[CVE-2026-73570]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-73570\", \"cvss\": \"8.9\", \"status\": [\"exploited\", \"cisa-kev\", \"patch-available\"], \"affected\": \"Zimbra Collaboration before 10.1.20, where the optional zimbra-snmp package is installed and SNMP notifications are enabled\", \"fixed\": \"10.1.20\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
  - claim_id: 7ca222c395
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: cited
    text: "Zimbra's own security-advisory table records the fix for CVE-2026-73570 as \"Fixed a command injection vulnerability in the SNMP monitoring component when SNMP notifications are enabled\", shipped in release 10.1.20 ("
    urls: ["https://wiki.zimbra.com/wiki/Zimbra_Security_Advisories"]
  - claim_id: e702a41324
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: cited
    text: "That release went out on 20 July 2026 ("
    urls: ["https://wiki.zimbra.com/wiki/Zimbra_Releases/10.1.20"]
  - claim_id: ca27ddabd4
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: cited
    text: ") carrying nine fixes, and at the time none of them had been flagged as actively exploited; the vendor's stated position was that \"in line with industry best practices, information disclosure is limited for security vulnerability fixes\" ("
    urls: ["https://thehackernews.com/2026/07/zimbra-patches-critical-snmp-command.html"]
  - claim_id: 55e9e65034
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: cited
    text: "The identifier arrived nearly four weeks later, on 13 August, and the ENISA record describes the mechanism in full: because untrusted input is not properly sanitised during SNMP notification processing, \"an unauthenticated attacker can send specially crafted SMTP requests that may result in execution of arbitrary operating system commands as the Zimbra user\" ("
    urls: ["https://euvd.enisa.europa.eu/vulnerability/CVE-2026-73570"]
  - claim_id: 93b1c5f561
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: cited
    text: "ENISA scores it 8.9 with high attack complexity ("
    urls: ["https://euvd.enisa.europa.eu/vulnerability/CVE-2026-73570"]
  - claim_id: b84229e053
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: cited
    text: "On 19 August CERT-FR issued its own advisory for the Zimbra bulletin and stated plainly that ENISA records CVE-2026-73570 as actively exploited ("
    urls: ["https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-1041/"]
  - claim_id: d60184191c
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: cited
    text: "ENISA's record lists it in the EU KEV catalog from 18 August ("
    urls: ["https://euvd.enisa.europa.eu/vulnerability/CVE-2026-73570"]
  - claim_id: 2de42a52a9
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: cited
    text: "In process-execution telemetry with parent lineage, that lineage is the signal: SNMP notification handling legitimately produces notification traffic, not shells, and Microsoft's hunting logic looks for a shell created by Perl running a generated swatchdog script, with an injection signature that is a legitimate snmptrap invocation immediately followed by shell metacharacters and a wget or curl call, wrapped in a trailing comment character that swallows the remaining legitimate arguments ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/09/30/unauthenticated-command-injection-on-internet-facing-mail-servers-tracking-cve-2026-73570/"]
  - claim_id: 94466b080a
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: uncited
    text: "What makes this worth an out-of-band look rather than a place in the next patch window is the sequence rather than the score: the code was fixed in July with no identifier attached, so an estate that drives its patching from CVE feeds, scanner signatures or an SBOM pipeline had nothing to match against for four weeks, and the flaw only became visible to those processes five days before it was recorded as exploited."
  - claim_id: e9e97c6e4d
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: uncited
    text: "Anyone who upgraded to 10.1.20 in July for unrelated reasons is already covered and does not know it; anyone who deferred is now unpatched against a flaw with a published exploitation status."
  - claim_id: 4eab8b7d65
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: uncited
    text: "The behaviour to look for follows from the mechanism."
  - claim_id: e0554c0840
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: uncited
    text: "Command injection at the point where a notification is formatted means the observable is a mail-server process tree spawning something it has no business spawning: an interpreter or utility process whose parent is the Zimbra mail or notification component, running under the zimbra service account rather than under a scheduled administrative task."
  - claim_id: fc6b5f2912
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: uncited
    text: "On the network side, an outbound connection initiated by the zimbra account immediately after inbound SMTP is the same event viewed from the other end."
  - claim_id: 07a0695030
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: uncited
    text: "**Triage:** Zimbra hosts do legitimately run monitoring integrations under the same account, so process identity alone will not separate them; the discriminators are the parent process being the notification path rather than a cron or monitoring agent, and the absence of a matching operator change record for a host that has no history of spawning interpreters at all."
  - claim_id: 2320efa08f
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** the check that scopes this is a package check, not a version check: a Zimbra estate without the optional zimbra-snmp package installed and SNMP notifications enabled is not exposed to this flaw regardless of build."
  - claim_id: 1c70b2d887
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: derived
    text: "For everyone else, 10.1.20 or later is the remediation and removing the package or disabling notifications is the control that works without a maintenance window."
  - claim_id: 006d3dae16
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: derived
    text: "Because exploitation preceded the identifier, an upgrade does not show that a host is clean: the compromise check is the second half of the remediation, covering the web shells, sudo configuration, systemd units and Zimbra secrets Microsoft describes."
  - claim_id: 7d2e9b9b21
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: derived
    text: "A vendor fix that ships ahead of its identifier is also invisible to every CVE-keyed process an organisation runs, so \"we patch what the scanner shows\" leaves a gap exactly as long as the gap between the release and the CVE."
  - claim_id: 824c450bf7
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "section 2026-10-02T04:54:58Z"
    kind: cited
    text: "Microsoft Threat Intelligence published first-hand analysis on 2026-09-30 of CVE-2026-73570 exploitation in more than one region and industry, naming no actor ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/09/30/unauthenticated-command-injection-on-internet-facing-mail-servers-tracking-cve-2026-73570/"]
  - claim_id: 50b54fae59
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "section 2026-10-02T04:54:58Z"
    kind: cited
    text: "It saw two out-of-band scanning tools probing the injection point between 2026-07-28 and 2026-08-07, after the fix and before the 2026-08-13 disclosure ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/09/30/unauthenticated-command-injection-on-internet-facing-mail-servers-tracking-cve-2026-73570/"]
  - claim_id: 04ac1b3909
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "section 2026-10-02T04:54:58Z"
    kind: cited
    text: "CISA's KEV catalog lists the CVE, added 2026-08-21 ("
    urls: ["https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"]
  - claim_id: 5638972ee4
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "section 2026-10-02T04:54:58Z"
    kind: cited
    text: "After command execution as the zimbra account, Microsoft observed, across its cases and not necessarily on every host, JSP web shells written to publicly served directories after temporarily opening write permission, with copies on peer mailbox nodes, and reverse shells built from a named pipe and `openssl s_client`; a privilege escalation that used a symlinked log file to take ownership of the sudo PAM configuration, added a `pam_exec` hook and created a NOPASSWD sudoers entry for the zimbra account; a systemd unit named like a Zimbra logging component with timestamps matched to existing services; theft of Zimbra's service credentials with `zmlocalconfig -s`, followed by authenticated LDAP queries for the pre-authentication key, the auth-token key and the two-factor secret attribute; and SSH and rsync movement across the cluster with Zimbra's own SSH identity ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/09/30/unauthenticated-command-injection-on-internet-facing-mail-servers-tracking-cve-2026-73570/"]
  - claim_id: baec9bbacb
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "section 2026-10-02T04:54:58Z"
    kind: cited
    text: "Microsoft's remediation is to upgrade to 10.1.20 or later, remove the zimbra-snmp package or disable SNMP notifications and restrict SNMP and SMTP to trusted hosts, rotate all domain `zimbraPreAuthKey` values, review systemd units, and hunt for JSP files on every mailbox node ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/09/30/unauthenticated-command-injection-on-internet-facing-mail-servers-tracking-cve-2026-73570/"]
  - claim_id: 86740d1c11
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "section 2026-10-02T04:54:58Z"
    kind: cited
    text: "Zimbra's 10.1.21 release of 2026-09-24 also fixes unauthenticated prediction of password-recovery codes that could reset a user's password, WebDAV acceptance of pre-MFA tokens, and OnlyOffice-integration flaws including file write to remote code execution ("
    urls: ["https://wiki.zimbra.com/wiki/Zimbra_Releases/10.1.21"]
  - claim_id: ef3340a4b0
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "section 2026-10-02T04:54:58Z"
    kind: cited
    text: "); the table lists no CVE or score for the recovery-code and WebDAV fixes ("
    urls: ["https://wiki.zimbra.com/wiki/Zimbra_Security_Advisories"]
  - claim_id: 88161f6cca
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "section 2026-10-02T04:54:58Z"
    kind: cited
    text: "), and NCSC Switzerland published an advisory for the release on 2026-10-01 with exploitation status unknown ("
    urls: ["https://security-hub.ncsc.admin.ch/#/posts/13022"]
  - claim_id: 42c044ead2
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "record 2026-10-02T04:54:58Z"
    kind: record-summary
    text: "Microsoft Threat Intelligence published first-hand analysis of confirmed intrusions: probing of the injection point from 2026-07-28, before the 2026-08-13 disclosure, then web shells, root escalation, theft of Zimbra's authentication keys and cluster-wide movement, with the injection signature to hunt for. The 10.1.21 release, which also fixes unauthenticated password-recovery code prediction, and NCSC-CH's advisory of 2026-10-01 are added. CISA's KEV listing of 2026-08-21, not recorded before, is added; the 10.1.20 release date is corrected to 2026-07-20, the EPSS score is refreshed to 0.117 (FIRST, 2026-10-01), ENISA's 18 August date is its EU KEV listing, and the actions now ask for a compromise check as well as the upgrade."
  - claim_id: 2fbffebb77
    entry: 2026-08-31/france-sdis-fire-rescue-data-leak-campaign
    surface: "headline"
    kind: frontmatter
    text: "SDIS 66 confirms theft of patient rescue forms; crews are back to paper and radio"
  - claim_id: 3cddf4012e
    entry: 2026-08-31/france-sdis-fire-rescue-data-leak-campaign
    surface: "summary"
    kind: frontmatter
    text: "Over the last weekend of August 2026 a criminal actor published fresh data-leak claims against seven more French Services départementaux d'incendie et de secours (SDIS: Somme, Essonne, Bas-Rhin, Bouches-du-Rhône, Gard, Vosges and Moselle), extending a campaign first documented in July 2026 against five other SDIS. Contacted directly, SDIS du Gard's board president confirmed the intrusion and theft of personal data on personnel, with identity-document copies and bank details said to be among it; the other six units named in this wave remain unconfirmed criminal claims. SDIS 66 (Pyrénées-Orientales) then confirmed on 2026-10-01 that data was stolen from a server maintained by a technical provider, which holds patient rescue forms that can contain medical data and copies of identity documents, and that crews now fill in the forms by hand and transmit by radio; a forum claim of nearly 120,000 records is unverified."
  - claim_id: aa41234a27
    entry: 2026-08-31/france-sdis-fire-rescue-data-leak-campaign
    surface: "body"
    kind: cited
    text: "Over the last weekend of August 2026 a criminal actor published fresh data-leak claims against seven more French Services départementaux d'incendie et de secours (Somme, Essonne, Bas-Rhin, Bouches-du-Rhône, Gard, Vosges and Moselle), extending a campaign ZATAZ first documented in late July 2026 against five other SDIS (Aisne, Alpes-de-Haute-Provence, Landes, Marne, Alpes-Maritimes), where postings were attributed to three separate criminal-forum handles: ChimeraZ, Cybernox and AplaGroup ("
    urls: ["https://www.zataz.com/un-pirate-cible-a-nouveau-les-sdis-francais/"]
  - claim_id: eceb5dd198
    entry: 2026-08-31/france-sdis-fire-rescue-data-leak-campaign
    surface: "body"
    kind: cited
    text: "This is not merely a criminal claim: contacted directly on 30 August, the president of SDIS du Gard's governing board confirmed the cyberattack and theft of personal data on personnel, with copies of identity documents and bank details said to be among it, and the full scope and intrusion method still under investigation ("
    urls: ["https://www.objectifgard.com/faits-divers/gard-cyberattaque-chez-les-pompiers-des-donnees-personnelles-sensibles-derobees-168493.php"]
  - claim_id: 740de71340
    entry: 2026-08-31/france-sdis-fire-rescue-data-leak-campaign
    surface: "body"
    kind: cited
    text: "The one case with a stated mechanism is from the July wave: SDIS de l'Aisne, where a claimed administrator-level access credential was posted in cleartext by the actor; ZATAZ notes its current validity cannot be established from the post alone, since access can be disabled or changed after disclosure, but the posting itself is a more critical indicator than a plain directory extraction ("
    urls: ["https://www.zataz.com/des-donnees-de-pompiers-francais-exposees-en-serie/"]
  - claim_id: 3035935920
    entry: 2026-08-31/france-sdis-fire-rescue-data-leak-campaign
    surface: "body"
    kind: cited
    text: "The July wave's cumulative claims, spanning the Landes, Marne (2,167 people), Alpes-Maritimes (2,325 people), Alpes-de-Haute-Provence and Aisne SDIS, plus separate claims against SDIS d'Indre-et-Loire (2,637 public-service agents plus 54 individuals linked to private structures) and the Pompiers.fr / Fédération nationale des sapeurs-pompiers de France membership platform ("
    urls: ["https://www.zataz.com/des-donnees-de-pompiers-francais-exposees-en-serie/"]
  - claim_id: fc07e17d0e
    entry: 2026-08-31/france-sdis-fire-rescue-data-leak-campaign
    surface: "body"
    kind: cited
    text: "), totalled at least 166,376 exposed individuals, with a potential total exceeding 932,376 depending on the volumes claimed; ZATAZ is explicit that this estimate is a straight sum of announced record counts and does not mean each line was technically verified or maps to a distinct person ("
    urls: ["https://www.zataz.com/un-pirate-cible-a-nouveau-les-sdis-francais/"]
  - claim_id: b42b14d31e
    entry: 2026-08-31/france-sdis-fire-rescue-data-leak-campaign
    surface: "body"
    kind: uncited
    text: "Of the August wave, Objectif Gard names only ChimeraZ, tying the same handle to five of the seven units (Gard, Bouches-du-Rhône, Moselle, Bas-Rhin and Vosges); no source names an actor for the Somme or Essonne claims, or ties Cybernox or AplaGroup to this wave."
  - claim_id: 76ed21a76f
    entry: 2026-08-31/france-sdis-fire-rescue-data-leak-campaign
    surface: "body"
    kind: uncited
    text: "No common intrusion vector has been established across the incidents in this campaign."
  - claim_id: 199e6089b6
    entry: 2026-08-31/france-sdis-fire-rescue-data-leak-campaign
    surface: "body"
    kind: uncited
    text: "Each publication in the campaign otherwise appears to be a distinct claim rather than evidence of one coordinated technical compromise."
  - claim_id: d9d3ee8851
    entry: 2026-08-31/france-sdis-fire-rescue-data-leak-campaign
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** the pattern that matters is not any single leak's volume but the aggregation risk."
  - claim_id: ecf04acdd6
    entry: 2026-08-31/france-sdis-fire-rescue-data-leak-campaign
    surface: "body"
    kind: derived
    text: "Personnel identity, rank, assignment, hierarchical role, contact details and, in the Aisne case, an exposed administrative credential, accumulated across repeated incidents against the same category of organisation, builds a reconnaissance dataset usable for targeted phishing, impersonation or infrastructure mapping against emergency-services personnel specifically."
  - claim_id: a62fa1bdba
    entry: 2026-08-31/france-sdis-fire-rescue-data-leak-campaign
    surface: "body"
    kind: derived
    text: "That is the same organisational category as Swiss cantonal and communal fire and rescue services; treat personnel-directory applications and any administrative credentials at emergency-services organisations as high-value reconnaissance and access targets even where any single leak's data looks individually low-sensitivity, and assume that recurring incidents against peer organisations are building a profiling dataset regardless of whether your own organisation has been named yet."
  - claim_id: ccb9bd3432
