  - claim_id: ed1031a265
    entry: 2026-10-02/uat-11587-antino-microsoft-graph-c2-asian-governments
    surface: "headline"
    kind: frontmatter
    text: "Talos: Antino's traffic ends only at Microsoft's Graph and login endpoints, so network telemetry shows only Microsoft"
  - claim_id: 267cc5fde1
    entry: 2026-10-02/uat-11587-antino-microsoft-graph-c2-asian-governments
    surface: "summary"
    kind: frontmatter
    text: "Cisco Talos describes UAT-11587, a cluster it assesses with high confidence as China-nexus, active since September 2025 against government, justice, e-government and policy organizations in eight Asian countries, with about 350 compromised endpoints. Its Antino backdoor takes commands from an Outlook folder and uses OneDrive for heartbeats and file transfer through an Entra application, and the lures pass SPF but fail DMARC against a p=none domain."
  - claim_id: 3184ec5169
    entry: 2026-10-02/uat-11587-antino-microsoft-graph-c2-asian-governments
    surface: "body"
    kind: cited
    text: "Cisco Talos tracks UAT-11587, first seen in September 2025, with at least 10 confirmed and five probable affected institutional environments and about 350 compromised endpoints across eight countries (Taiwan, India, the Philippines, Cambodia, Pakistan, Thailand, Myanmar and Syria); the targets include defense and national security, central administration, justice and law enforcement, government IT and shared e-government services, legislatures and policy research bodies ("
    urls: ["https://blog.talosintelligence.com/china-nexus-uat-11587-targets-government-and-policy-organizations-across-asia-with-antino-backdoor/"]
  - claim_id: 1a38f82e6c
    entry: 2026-10-02/uat-11587-antino-microsoft-graph-c2-asian-governments
    surface: "body"
    kind: cited
    text: "Talos assesses China-nexus with high confidence and intelligence gathering with moderate confidence, and notes overlaps with the Antino activity Symantec attributes to Jewelbug without being able to verify a link to Jewelbug's financially motivated activity ("
    urls: ["https://blog.talosintelligence.com/china-nexus-uat-11587-targets-government-and-policy-organizations-across-asia-with-antino-backdoor/"]
  - claim_id: cab03a3a7d
    entry: 2026-10-02/uat-11587-antino-microsoft-graph-c2-asian-governments
    surface: "body"
    kind: cited
    text: "Delivery is spear-phishing in which the envelope sender is an attacker-controlled domain relayed through Migadu while the visible From header shows the impersonated organization, so SPF passes for the envelope domain, DMARC alignment fails, and a p=none policy on the impersonated domain lets the message reach the inbox; the mail body also reproduces Gmail's attachment widget as images linking to a Cloudflare Pages address with a per-recipient identifier ("
    urls: ["https://blog.talosintelligence.com/china-nexus-uat-11587-targets-government-and-policy-organizations-across-asia-with-antino-backdoor/"]
  - claim_id: e7323d3937
    entry: 2026-10-02/uat-11587-antino-microsoft-graph-c2-asian-governments
    surface: "body"
    kind: cited
    text: "The five-stage chain starts with an HTA stager run by `mshta.exe`, then a JScript downloader and decryptor that pulls encrypted resources from Cloudflare R2 or CloudFront, then .NET deserialization gadgets that load a downloader assembly inside `mshta.exe`, which writes a decoy and a three-file bundle and launches the Microsoft-signed Windows ADK binary `GatherOsState.exe`; that binary sideloads an unexpected DLL, which is Antino ("
    urls: ["https://blog.talosintelligence.com/china-nexus-uat-11587-targets-government-and-policy-organizations-across-asia-with-antino-backdoor/"]
  - claim_id: 24806b7a47
    entry: 2026-10-02/uat-11587-antino-microsoft-graph-c2-asian-governments
    surface: "body"
    kind: cited
    text: "Antino is a Rust backdoor that authenticates to Microsoft Graph with the OAuth 2.0 client-credentials flow of an Entra application, polls an Outlook folder every 10 seconds for command emails, sends a OneDrive heartbeat every minute and uses OneDrive folders for tool staging and exfiltration, so outbound traffic ends only at `graph.microsoft.com` and `login.microsoftonline.com` ("
    urls: ["https://blog.talosintelligence.com/china-nexus-uat-11587-targets-government-and-policy-organizations-across-asia-with-antino-backdoor/"]
  - claim_id: 441a15ac48
    entry: 2026-10-02/uat-11587-antino-microsoft-graph-c2-asian-governments
    surface: "body"
    kind: cited
    text: "Its commands run `cmd.exe` and PowerShell, list, upload and download files, load shellcode in memory and add a registry Run value; execution and persistence abuse the Windows Scripted Diagnostics workflow, in which `sdiagnhost.exe` runs an attacker-written PowerShell script that writes the HKCU Run value ("
    urls: ["https://blog.talosintelligence.com/china-nexus-uat-11587-targets-government-and-policy-organizations-across-asia-with-antino-backdoor/"]
  - claim_id: 439106e205
    entry: 2026-10-02/uat-11587-antino-microsoft-graph-c2-asian-governments
    surface: "body"
    kind: cited
    text: "**Detection:** in process-creation telemetry, `mshta.exe` or `wscript.exe` loading the .NET runtime and assemblies into the script host itself or writing a three-file bundle to a staging directory, `GatherOsState.exe` loading an unexpected DLL from its own folder, and `sdiagnhost.exe -Embedding` running PowerShell that sets an HKCU Run value; in network telemetry (the Entra application, mailbox and OneDrive belong to the threat actor, so the victim tenant's audit logs will not show them), connections to `graph.microsoft.com` from processes that are not Microsoft 365 clients; in mail flow, DMARC-failing mail from p=none senders that was delivered, and protocol-relative links to `pages.dev` addresses ("
    urls: ["https://blog.talosintelligence.com/china-nexus-uat-11587-targets-government-and-policy-organizations-across-asia-with-antino-backdoor/"]
  - claim_id: 17114cee64
    entry: 2026-10-02/uat-11587-antino-microsoft-graph-c2-asian-governments
    surface: "body"
    kind: derived
    text: "**Exposure:** mail recipients whose organization's domain publishes DMARC p=none (the policy that let the reviewed message through), and endpoints where `mshta.exe` and Windows Script Host can run; Talos names no European victim."
  - claim_id: c6f06c535c
    entry: 2026-10-02/uat-11587-antino-microsoft-graph-c2-asian-governments
    surface: "body"
    kind: derived
    text: "**Triage:** Microsoft Graph traffic and signed Windows ADK binaries are both normal; the signal is the combination of `GatherOsState.exe` running from a temporary staging directory beside an unexpected DLL and that process then holding Graph connections."
  - claim_id: 50b700e478
    entry: 2026-10-02/uat-11587-antino-microsoft-graph-c2-asian-governments
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** network controls cannot separate this command channel from ordinary Microsoft 365 traffic, so hunt on the initiating process, and check whether your own domains publish DMARC p=none, the setting the spoofed lures relied on."
  - claim_id: d7d884f5c4
