    kind: cited
    text: "On 2026-09-30 a forum user claimed nearly 120,000 records and 100,000 documents, figures ICI says cannot be verified, and ICI notes the incident comes a month after the SDIS du Gard attack ("
    urls: ["https://www.ici.fr/infos/faits-divers-justice/le-sdis-66-victime-d-une-fuite-de-donnees-7983412"]
  - claim_id: 71512498a9
    entry: 2026-08-31/france-sdis-fire-rescue-data-leak-campaign
    surface: "section 2026-10-02T05:01:06Z"
    kind: uncited
    text: "The reporting names no intrusion vector and no actor, and no source links the SDIS 66 theft to the SDIS du Gard attack or to the forum claims against other units."
