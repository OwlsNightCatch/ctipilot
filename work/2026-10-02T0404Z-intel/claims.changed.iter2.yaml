    text: "Over the last weekend of August 2026 a criminal actor published fresh data-leak claims against seven more French Services départementaux d'incendie et de secours (SDIS: Somme, Essonne, Bas-Rhin, Bouches-du-Rhône, Gard, Vosges and Moselle), extending a campaign first documented in July 2026 against five other SDIS. Contacted directly, SDIS du Gard's board president confirmed the intrusion and theft of personnel identity-document copies and bank details; the other six units named in this wave remain unconfirmed criminal claims. SDIS 66 (Pyrénées-Orientales) then confirmed on 2026-10-01 that data was stolen from a server maintained by a technical provider, including patient rescue forms holding medical data and copies of identity documents, and that crews now fill in the forms by hand and transmit by radio; a forum claim of nearly 120,000 records is unverified."
