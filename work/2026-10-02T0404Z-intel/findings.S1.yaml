    summary: |
      Zimbra's 10.1.21 patch release (2026-09-24) fixes, among others: a flaw in the self-service password-recovery mechanism
      that lets an unauthenticated attacker predict recovery codes and reset a user's password (account takeover; credited to
      two external reporters); WebDAV authentication that accepted pre-MFA tokens, now rejected until MFA completes (MFA
      bypass); an OnlyOffice-integration issue allowing unauthorised file writes and remote code execution under specific
      conditions and a second one allowing an authenticated user's server-side JavaScript injection to run commands; and six
      stored-XSS issues in the Classic and Modern web clients (crafted sender names, attachment Content-Location headers,
      share invitations, calendar counter-proposals). Zimbra's advisory table lists only CVE-2026-66911 and CVE-2026-66912
      (both XSS, CVSS 'TBD'); the account-takeover, MFA-bypass and RCE rows read 'TBD' for CVE and CVSS at fetch time, and
      no PoC or exploitation is reported by Zimbra, NCSC-CH (status 'UNKNOWN') or heise. heise notes Zimbra is often attacked
      by state-linked actors because it runs in government and research bodies, and the store already carries an exploited Zimbra
      SNMP command-injection entry (2026-08-20).
    region_nexus: "NCSC Switzerland published a hub advisory on 2026-10-01; Zimbra is run by government and research bodies in DACH per heise. No Swiss victim."
    primary_sector_nexus: "direct if the constituency self-hosts Zimbra Collaboration (cantonal/communal or university mail); exposure turns on the webmail, WebDAV and password-recovery endpoints being internet-facing"
    sector: "public-sector"
    cves: [CVE-2026-66911, CVE-2026-66912]
    techniques: [T1190]
    affected_products: ["Zimbra Collaboration"]
    entity_keys: []
    new_entities:
      - { key: "product:zimbra-collaboration", type: product, name: "Zimbra Collaboration", aliases: ["Zimbra", "ZCS", "Zimbra Collaboration Suite"], summary: "Groupware/webmail suite widely run by government and research bodies; repeatedly exploited (SNMP command injection in 2026-08, zero-click XSS CVE-2025-66376 by LAUNDRY BEAR); 10.1.21 of 2026-09-24 fixes unauthenticated password-recovery code prediction (Zimbra release notes)." }
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    borderline: true
    borderline_reason: "pre-auth account takeover in a mail platform common to public bodies, NCSC-CH advisory published; but no CVE or CVSS for the headline flaw, no PoC, no exploitation, and the vendor note is one sentence. Publish only as a short awareness item if the main agent judges NCSC-CH's attention enough."
    evidence:
      - quote: "Fixed a security vulnerability in the self-service password recovery mechanism that could allow an unauthenticated attacker to predict recovery codes and reset a user's password."
        attribution: "Zimbra"
        source_url: "https://wiki.zimbra.com/wiki/Zimbra_Releases/10.1.21"
      - quote: "Pre-MFA tokens are now rejected with an HTTP status, requiring users to fully complete Multi-Factor Authentication before accessing WebDAV resources."
        attribution: "Zimbra"
        source_url: "https://wiki.zimbra.com/wiki/Zimbra_Releases/10.1.21"
      - quote: "Nicht angemeldete Angreifer können Wiederherstellungscodes vorhersagen und damit Nutzerpasswörter zurücksetzen – damit ist die Übernahme des Kontos möglich."
        attribution: "heise online"
        source_url: "https://www.heise.de/news/Groupware-Zimbra-Update-schliesst-zahlreiche-Sicherheitsluecken-11468996.html"
    extended_notes: |
      Detection concept: webmail/auth logs for bursts of password-recovery code submissions per account or per source, resets
      without a preceding recovery request, and WebDAV access with sessions that never completed MFA. Hardening: upgrade to
      10.1.21; until then restrict the self-service password-recovery and WebDAV endpoints to trusted networks. If the main
      agent publishes, reference 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited as a sibling entry.

