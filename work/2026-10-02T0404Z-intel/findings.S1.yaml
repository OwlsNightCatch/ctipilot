    discovery_trace: "first seen at: cisa-kev, bridge `fetch_source.py cisa-kev` (catalogVersion 2026.10.01), CVE-2026-76504 dateAdded 2026-09-30 and the entry's notes field naming the Cisco advisory -> also seen at cisco-psirt feed https://sec.cloudapps.cisco.com/security/center/psirtrss20/CiscoSecurityAdvisory.xml (2026-09-30 13:00) and ncsc-ch-security-hub (bridge ncsc-csh recent, post 13021) -> primary: Cisco PSIRT, URL https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-sdwan-webauth-xr8beuuU -> root cause: VulnCheck, URL https://www.vulncheck.com/blog/revenge-of-the-sd-wan-cve-2026-76504 -> corroboration: Rapid7, Horizon3, NCSC-NL NCSC-2026-0395, BSI WID-SEC-2026-3681, BleepingComputer."
    summary: |
      Cisco published cisco-sa-sdwan-webauth-xr8beuuU on 2026-09-30 for CVE-2026-76504, an unauthenticated API
      authentication bypass in Cisco Catalyst SD-WAN Manager (formerly vManage) that yields admin-level API access
      (CVSS 3.1 9.8, CWE-177). Cisco states its PSIRT became aware of active exploitation in September 2026; CISA added the
      CVE to KEV the same day (due 2026-10-03). The flaw applies to every configuration: the authentication rule that
      protects one API endpoint is evaded by URI-encoding a character of the path (the advisory's example encodes the
      'j' of the j_security_check login path as %6a; Cisco stresses any single encoded character works). There is no
      workaround; Cisco lists first-fixed releases per train: 20.9 -> 20.9.10.1, 20.12 -> 20.12.8.2, 20.15 -> 20.15.6.1,
      20.18 -> 20.18.4.1, 26.1 -> 26.1.2.1, 26.2 -> 26.2.1; anything earlier than 20.9 must migrate to a fixed train. The
      Cisco-managed cloud service (release 20.15.605) is already fixed, no customer action. On-premises operators are told
      to cut internet access to the system and allow only known trusted hosts.
      VulnCheck (exploit-development team, own reproduction) explains the mechanism: the WildFly/Undertow container decodes
      the request path when matching its login security constraint, but Cisco's JAAS login module
      (AppServerLoginModule.login) tests the raw, undecoded request URI for the string j_security_check before deciding
      to call the real password check. An encoded path therefore skips the password verification and falls into a branch
      written for continuing an already-trusted session, whose only gate is a substring match against four internal
      viptela-reserved-* service-account names; supplying one of them as the username returns a fresh session cookie with
      a 200 and no credential check. Only two of the four accounts carry roles that pass admin-endpoint RBAC (VulnCheck
      demonstrates cloudops and expects uc to work; dca and cloud were refused on admin-only endpoints). Cisco's own hunt guidance keys on exactly these
      names. VulnCheck counts roughly 1,500 internet-exposed vManage instances (its Target Intelligence), attributes the
      exploitation to no named actor and says no legitimate public exploit existed as of 2026-10-01 (it reviewed and
      rejected one fake public 'PoC' repository). Rapid7 recommends emergency patching outside normal cycles; BleepingComputer
      and VulnCheck count this as the fifth actively exploited Catalyst SD-WAN zero-day of 2026.
      NCSC Switzerland posted its own advisory (hub post 13021, 2026-09-30, status Actively Exploited), NCSC-NL (kans
      medium, schade high; urges checking for the Cisco IOCs BEFORE installing the update) and BSI (kritisch) followed.
    region_nexus: "Global management-plane flaw; NCSC Switzerland published a hub advisory for it on 2026-09-30, so Swiss operators of Catalyst SD-WAN are directly in scope. No Swiss victim or deployment is named by any source."
    primary_sector_nexus: "indirect — SD-WAN controller is common in multi-site public-sector WANs; exposure depends on whether the Manager's HTTPS API is internet-reachable (VulnCheck: ~1,500 exposed worldwide)"
