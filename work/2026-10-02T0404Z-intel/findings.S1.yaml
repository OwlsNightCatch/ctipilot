    discovery_trace: "first seen at: cisa-kev, bridge `fetch_source.py cisa-kev` (catalogVersion 2026.10.01), CVE-2026-104286 dateAdded 2026-10-01, notes field naming FG-IR-26-175 -> also fortinet-psirt feed https://filestore.fortinet.com/fortiguard/rss/ir.xml (newest item, 2026-10-01, CVSSv3 9.8) and enisa-euvd recent exploited (EUVD-2026-91042, exploitedSince 2026-10-01) -> primary: Fortinet PSIRT, URL https://www.fortiguard.com/psirt/FG-IR-26-175 (via `extract`) -> CISA alert URL https://www.cisa.gov/news-events/alerts/2026/10/01/cisa-adds-one-known-exploited-vulnerability-catalog -> BleepingComputer, securityonline (aggregator, affected-version table disagrees with vendor, see notes)."
    summary: |
      Fortinet published FG-IR-26-175 on 2026-10-01: a path traversal (CWE-22) combined with improper neutralisation of
      a NULL byte (CWE-158) in FortiMail lets an unauthenticated attacker write arbitrary files on the appliance through
      crafted HTTP or HTTPS requests (CVSSv3 9.8 per Fortinet's feed). The advisory states the flaw 'has been reported to be
      exploited in the wild'; CISA added CVE-2026-104286 to KEV the same day (due 2026-10-04) and ENISA's EUVD lists it as
      exploited since 2026-10-01. Fortinet's Product Security team found it internally; the vendor names no actor and gives
      no victim count.
      Affected (vendor table): FortiMail 8.0.0-8.0.1, 7.6.0-7.6.6, 7.4.0-7.4.8, 7.2.0-7.2.9. No branch has a fixed build yet:
      Fortinet lists 'upcoming' 8.0.2, 7.6.7 and 7.4.9, and says 7.2 should move to 7.4 or above. Workaround (vendor):
      disable IBE (identity-based encryption) support in the FortiMail encryption configuration, or take the management
      interface off the internet and restrict it to trusted private networks. Third-party reporting ties the vulnerable path
      to the IBE web component; BleepingComputer states the flaw affects the management interface. A securityonline
      aggregation lists different affected builds (7.6.0-7.6.5, 7.4.0-7.4.6) and a 7.0 branch that the vendor table does not
      list; treat 7.0 as unconfirmed rather than unaffected and use the vendor's ranges.
      Fortinet's compromise section describes what exploitation left behind, at behaviour level: a shared library added
      under the appliance's data partition and registered through an ld.so.preload entry, a modified system binary,
      additional service binaries, a modified web-server configuration and a modified admin-migration archive; a cron-launched
      shell command referencing the migration (migadmin) path; an admin CLI session adding a mail 'archive account' whose destination is a
      remote host with stored remote credentials (a mail-exfiltration path); and IBE decrypter exceptions for invalid Base64
      input plus internal-user failed-login events in the logs. (File hashes and the attacker addresses are in the
      advisory and are deliberately not carried here.)
