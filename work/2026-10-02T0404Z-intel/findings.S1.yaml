    extended_notes: |
      Suggested handling: priority high-to-critical (exploited, pre-auth, management plane, fix available). Suggested
      Admiralty A1 (first-party vendor, corroborated by CISA/NCSC-CH/NCSC-NL/BSI and two independent reproductions).
      EPSS (FIRST, 2026-10-01) 0.01096. CISA KEV dueDate 2026-10-03, forensicTriage Yes.
      Exposure check (vendor-documented): version of Catalyst SD-WAN Manager against the fixed-release table; whether the
      Manager's web/API listener is reachable from the internet or from untrusted segments.
      Detection (telemetry class: web/app access logs on the Manager): Cisco's two log sources are the service-proxy
      access log (serviceproxy-access.log) and vmanage-server.log; hunt for POSTs whose login path contains any
      percent-encoded character of j_security_check, and for server-log lines for that path tied to usernames beginning
      viptela-reserved-. Cisco warns these entries can also occur in normal operation; judge against baseline.
      Post-patch compromise check: Cisco says patching does not evict an earlier intruder; open a Sev-3 TAC case with the
      CVE id in the title and attach an admin-tech file. NCSC-NL advises checking for the IOCs before installing the update.
      Hardening: remove internet reachability of the Manager; restrict to known trusted hosts behind a filtering device
      (Cisco Catalyst SD-WAN Hardening Guide).
      Related store entries (distinct CVEs, same product line; candidates for references[]):
      2026-05-15/cve-2026-20182-cisco-catalyst-sd-wan-controller-manager-pre..., 2026-06-06/cve-2026-20245-cisco-catalyst-sd-wan-manager-actively-exploi..., 2026-06-26/cisco-catalyst-sd-wan-manager-cve-2026-20245.
      Fake-PoC note: VulnCheck rejected one public repository claiming a PoC for this CVE; a search hit also lists a
