        source_url: "https://www.cisa.gov/news-events/alerts/2026/10/01/cisa-adds-one-known-exploited-vulnerability-catalog"
    extended_notes: |
      Suggested handling: priority high-to-critical for any FortiMail owner (exploited zero-day, NO patch on three of four
      branches, mitigation only). Independence caveat: the exploitation claim is Fortinet's first-hand statement; CISA (KEV,
      'evidence of active exploitation') and ENISA EUVD act on it, so two authorities concur but no second telemetry
      holder has published its own observations. Marked MULTI-SOURCE on vendor + CISA + EUVD; suggested Admiralty A2
      (first-party vendor, exploitation not independently observed by a second telemetry holder).
      EPSS not yet published by FIRST (EUVD shows 0.0 at publication). The sole third-party technical analysis found is
      aggregator-level; no watchTowr/Rapid7 root-cause at fetch time. A search hit lists a public 'PoC' repository for this
      CVE; no source vets it and VulnCheck reports a fake PoC for the Cisco CVE above, so treat it as untrusted.
      Detection (telemetry classes): appliance admin/CLI audit events (new archive account with a remote destination, config
      changes from a CLI session that logs out from an unnamed address), cron/system-event log entries launching a script from
      the migration directory, IBE decrypter exceptions for invalid Base64 in the application log, and file-integrity
      comparison of the data partition against a known-good image (added shared library, ld.so.preload, altered system
      binary and httpd configuration). Vendor IOC section lists the exact artifacts.
      Post-patch/post-workaround compromise check: because file write precedes persistence in the vendor's description,
      appliances that were internet-exposed before the workaround should be treated as possibly compromised; the vendor
      published artifact lists for that purpose. Mailbox-level impact (what the archive account captured) is a question
      for the mail owners.
