    summary: |
      DIVD (the Dutch Institute for Vulnerability Disclosure) was breached from 2026-09-21; on 2026-09-30 it disclosed that
      the attackers entered through two Zammad zero-days that 'together allowed session hijacking, remote code execution and
      privilege escalation from the Zammad user to root, in seconds'. DIVD's finding rests on its own forensics with Merlon
      Security; it assesses the attack as agentic-AI-driven (the attacker's scripts carried self-justifying comments) and says
      it sees no link to any known threat actor; the attackers then reached other services and exfiltrated volunteer contact
      data before network segmentation stopped them.
      CVE-2026-102489: pre-authentication session hijack leading to code execution as the zammad user; DIVD and NCSC-NL list
      Zammad 6.3.0 through 6.5.4 as exploitable; versions 7.0.0 through 7.1.3 contain the defect but DIVD says it is not
      exploitable there 'due to environment conditions'. CVSS v4 8.7 on its own, 9.4 when chained (DIVD CVE record, E:A).
      CVE-2026-102490: local privilege escalation from the zammad service user to root; DIVD lists all versions from 1.5.0
      including the latest alpha as affected; no fix exists (NCSC-NL, 2026-09-30: 'nog niet opgelost'); CVSS v4 8.5, 9.4
      chained. Both are reported as actively exploited since at least 2026-09-21 by NCSC-NL; neither is in CISA KEV at fetch
      time, ENISA EUVD lists both as exploited since 2026-09-30. Zammad has released an update for CVE-2026-102489 (NCSC-NL);
      DIVD advises moving to Zammad 7 or taking the instance offline. NCSC-NL asks operators to copy application and network
      logs BEFORE updating because the unfixed second flaw may later need those logs to prove a compromise.
      Fixed-build detail is inconsistent across sources and no Zammad-published advisory could be located: the DIVD CVE
      record gives affected '>= 6.3.0 to < 6.5.4' (so 6.5.4 reads as fixed) while the DIVD case page and NCSC-NL say 6.3.0
      through 6.5.4; the CVE record scopes the root flaw to '< 7.1.0-alpha' while DIVD and NCSC-NL say all versions including
      the alpha. One aggregator (securityonline) reads the CVE record as 'fixed in 6.5.4, 7.0.0 / 7.1.0-alpha', which
      contradicts NCSC-NL on the root flaw. Zammad's GitHub security-advisory listing, as read, did not show the two CVEs.
      DIVD runs a log-check script for the RCE (published with its case) and is scanning for and notifying exposed instances.
      Footprint (vendor claim relayed by BleepingComputer): Zammad's website claims over 2,000 customers and 55,000 users, self-hosted or hosted.
    region_nexus: "Zammad GmbH is Berlin-based and the product is widely used as a DACH helpdesk; the store's registry summary for the earlier Zammad 7.1 security release describes it as widely used as a DACH public-sector helpdesk (a store-internal statement, not a source fetched this run). DIVD and NCSC-NL are Dutch; no Swiss victim or Swiss-authority notice was found."
