- code: F10
  category: missed-angle
  section: trending-vulnerabilities
  item: "CVE-2026-86950 Apple CoreGraphics (existing entry 2026-09-30/cve-2026-86950-apple-coregraphics-zero-day-kev, priority high, KEV-listed)"
  url_or_quote: "https://thehackernews.com/2026/10/apple-coregraphics-poc-emerges-as.html"
  summary: "In-window development not carried: Calif published a public proof of concept for the exploited, KEV-listed CVE-2026-86950 on 2026-09-30 (THN 2026-10-01 'Apple CoreGraphics PoC Emerges as WhatsApp PDF Checks Hint at Possible Delivery Path'; research at https://calif.io/research/the-great-glyph-grift, PoC repo github.com/califio/publications). The store entry still says 'No source states how the file is delivered' and carries no poc-public status; findings.S1 recorded 'no delta' after checking only Apple's own pages. Suggested search: 'CVE-2026-86950 Calif great glyph grift proof of concept'. Ship as an update record on the existing entry (poc-public status, malicious PDF with crafted TrueType font, the WhatsApp delivery hint is speculative and was retracted from the first publication per THN)."
- code: F4
  category: hallucinated-fact
  section: trending-threats
  item: "OpenAI agents UNCTAD (2026-09-28/openai-agents-unctad-double-encoding-proxy-chain-scan), ## Update 2026-10-02T05:03:36Z closing sentence (claim 4eb9f4d0e2)"
  url_or_quote: "The cases name no Swiss target and no confirmed intrusion"
  summary: "(low confidence) Asymmetric Security (https://www.asymmetricsecurity.com/newsroom/rogue-agents-investigation/) opens with 'We found successful access to staging environments' and reports AIHW's pre-production system returned data ('some of these requests returned data. As far as we know, this data was all publicly available'); the entry itself says 'access to the pre-production staging system'. 'No confirmed intrusion' is looser than any source; the sources support 'no confirmed access to non-public data' (Transluce: 'no instances ... access to any information that is not publicly available'; Cyber Centre: 'no indication that government systems have been compromised'). Reword to that."
- code: F14
  category: quantifier-without-source
  section: trending-vulnerabilities
  item: "CVE-2026-73570 Zimbra (2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited), body paragraph 2 (claim 94466b080a)"
  url_or_quote: "had nothing to match against for four weeks"
  summary: "(low confidence) Zimbra's own page (https://wiki.zimbra.com/wiki/Zimbra_Releases/10.1.20) dates the release 2026-07-20 and ENISA (https://euvd.enisa.europa.eu/vulnerability/CVE-2026-73570) publishes the CVE 2026-08-13: 24 days (about 3.4 weeks). No cited source says four weeks; the cited sentence before it says 'nearly four weeks', the analysis drops the hedge. Write '24 days' or 'almost four weeks'."
- code: F14
  category: quantifier-without-source
  section: active-threats
  item: "Belnet supplier zero-day (2026-10-02/belnet-supplier-zero-day-mail-copied-65-days), title"
  url_or_quote: "copy all incoming mail to Belnet-owned domains and FileSender download links for 65 days"
  summary: "(low confidence) Residual of the iteration-7 F14: Belnet (https://www.belnet.be/en/news-events/news/security-and-privacy-incident-affecting-belnets-it-infrastructure) says 'All download links generated and sent directly by our FileSender and FedSender services during this period'. The summary and body now carry 'and sent directly'; the title (named in the iteration-7 finding) still says 'FileSender download links', unqualified and without FedSender. Align the title (for example '... and the transfer links its FileSender and FedSender services sent directly')."
- code: F11
  category: editorial-advisory
  section: trending-threats
  item: "Kiteworks (2026-09-26/kiteworks-precautionary-shutdown-imminent-zero-day-warning), sourcing_note"
  url_or_quote: "Credibility reflects that the advisory's issuance is well documented, not that an attack is confirmed."
  summary: "(low confidence) Pre-existing text, not touched by this run: 'Credibility' refers to the Admiralty credibility digit, workflow-internal language in a reader-facing field (check 12), and the note runs to three long sentences where two of provenance suffice. Trim to the provenance: sourced to Kiteworks' own notice and statements, BSI relays Kiteworks' press release."
- code: F11
  category: editorial-advisory
  section: trending-threats
  item: "OpenAI agents UNCTAD, body paragraph 2 (claim 8ce92ef584)"
  url_or_quote: "so it would appear in the proxy's own logged request list, using the scanning tool's own logging feature as their exfiltration channel"
  summary: "(low confidence) 'the proxy' is ambiguous: the sentence has just named codetabs.com and 'the first proxy' as the relays, while swarmcha.se (https://swarmcha.se/posts/openai-unctad) says the data was recorded in Urlquery's report of all fetched URLs. A detection engineer can read it as codetabs' log. Say 'in the scanner's list of fetched URLs'."
- code: F11
  category: editorial-advisory
  section: trending-vulnerabilities
  item: "Citrix NetScaler (2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev), sources[] Censys record and the two 2026-09-30 section citations labelled 'Censys, 2026-09-29'"
  url_or_quote: "https://censys.com/advisory/cve-2026-88771-cve-2026-88772/"
  summary: "(low confidence) The canonical Censys page is titled 'Sept 28 Advisory' and carries datePublished 2026-09-30T16:54:05+00:00 (article:modified_time 2026-09-30T16:54:06+00:00, read this iteration); the entry labels it 2026-09-29, a one-day drift that is neither the title date nor the publication date. Use 2026-09-30."
