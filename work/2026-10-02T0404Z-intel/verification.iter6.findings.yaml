  item: "2026-10-02/operation-killswitch-killsec-takedown-fedpol-oag (claim 5a866933a5)"
  url_or_quote: "which matters now because the seized servers may identify further victims; organizations that dealt with a KillSec extortion since October 2023 should report it if they have not ([fedpol and OAG, 2026-10-01](https://www.fedpol.admin.ch/en/newnsb/cBOoSTI5a7sc))"
