  item: "2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev"
  url_or_quote: "NCSC Switzerland's Cyber Security Hub, NCSC UK and CERT-FR (CERTFR-2026-AVI-1235) each published same-day advisories on 2026-09-28 independently confirming active exploitation."
  summary: "(low confidence) None of the three observes exploitation itself; each relays the vendor. NCSC UK (https://www.ncsc.gov.uk/news/exploitation-of-vulnerabilities-affecting-citrix-netscaler-adc-and-citrix-netscaler-gateway): 'Citrix has published a security bulletin ... CVE-2026-88771 and CVE-2026-88772, have been confirmed as being actively exploited'; CERT-FR (https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-1235/): 'Citrix indique que les vulnérabilités CVE-2026-88771 et CVE-2026-88772 sont activement exploitées'; NCSC-CH post 13005 lists 'Current exploitation status: Actively Exploited' with the Citrix bulletin as its primary reference. Drop 'independently'. The sentence also carries no inline link to any of the three pages."
