  item: "2026-10-02/belnet-supplier-zero-day-mail-copied-65-days (claim bd69890a1e)"
  url_or_quote: "every download link its FileSender and FedSender services generated"
  summary: "(low confidence) Belnet (https://www.belnet.be/en/news-events/news/security-and-privacy-incident-affecting-belnets-it-infrastructure): 'All download links generated and sent directly by our FileSender and FedSender services during this period'; the entry drops 'and sent directly', which narrows the set. The same paragraph lists '(guest-roaming and BNIX addresses)' as the Belnet-owned domains where the notice writes '(guestroam, BNIX …)' with an ellipsis, i.e. examples. The title ('copy all inbound mail') and headline ('had inbound mail copied') also omit the notice's scope ('All incoming emails sent to domains owned by Belnet email addresses'), the qualifier the summary was given after iteration 5. Align title, headline and body with the notice."
