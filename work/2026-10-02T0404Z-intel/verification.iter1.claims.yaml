  - {claim_id: 8370abb395, verdict: ok, source_url: "https://www.fortiguard.com/psirt/FG-IR-26-175", passage: "Path Traversal [CWE-22] and Improper Neutralization of NULL Byte [CWE-158] ... unauthenticated attacker to write arbitrary files ... via crafted HTTP or HTTPS requests; 2026-10-01 Initial publication"}
