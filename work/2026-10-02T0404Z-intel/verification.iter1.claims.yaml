  - {claim_id: c807be81a1, verdict: ok, source_url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-sdwan-webauth-xr8beuuU", passage: "audit serviceproxy-access.log and vmanage-server.log; viptela-reserved-; request admin-tech; Severity 3"}
