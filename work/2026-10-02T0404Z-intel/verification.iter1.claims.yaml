  - {claim_id: abb5fe3d8c, verdict: ok, source_url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-sdwan-webauth-xr8beuuU", passage: "restrict access ... Cisco Catalyst SD-WAN Hardening Guide; TAC case / admin-tech"}
