  - {claim_id: 89c29bf10e, verdict: ok, source_url: "https://www.fortiguard.com/psirt/FG-IR-26-175", passage: "This has been reported to be exploited in the wild; 8.0.2/7.6.7/7.4.9 upcoming; KEV dateAdded 2026-10-01"}
  - {claim_id: d638534e01, verdict: ok, source_url: "https://www.fortiguard.com/psirt/FG-IR-26-175", passage: "Disable the IBE feature support using the following CLI command; Alternatively: Disable access to the FortiMail management interface from the internet"}
