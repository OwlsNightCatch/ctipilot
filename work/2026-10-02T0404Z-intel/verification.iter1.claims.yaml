  - {claim_id: 8d5a994074, verdict: F3, source_url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-sdwan-webauth-xr8beuuU", passage: "(low confidence) Cisco page carries no 'out-of-band' wording (VulnCheck: 'out-of-band security advisory'); rest ok: API session-based authentication management; unauthenticated remote; admin privileges"}
