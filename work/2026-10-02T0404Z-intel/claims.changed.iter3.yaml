  - claim_id: 8a82034c69
    entry: 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev
    surface: "immediate_action"
    kind: frontmatter
    text: "Patch every internet-facing NetScaler ADC/Gateway now and check for pre-patch compromise: Citrix confirms CVE-2026-88771 and CVE-2026-88772 are being exploited against unmitigated NetScaler ADC and NetScaler Gateway appliances right now, and Google's Mandiant reports exploitation since at least early September. CVE-2026-88771 requires no configuration at all: every default deployment is reachable by an unauthenticated attacker; CVE-2026-88772 is reachable wherever DTLS is enabled, which Citrix states is the default on any VPN virtual server. Citrix lists no workaround, and Mandiant's interim network controls (disable DTLS where it is not needed, block inbound UDP/443 upstream) cover CVE-2026-88772 only. Capture forensic evidence (logs, an instance snapshot where the appliance is virtual, a support bundle, a core dump) from each exposed appliance before patching, since the upgrade itself can destroy evidence of prior compromise, then upgrade to 14.1-73.37+ or 13.1-64.23+ (run `show ns variable` first on 13.1; if it returns any variables, install 13.1-64.24 instead to avoid a known reboot loop) and run a compromise assessment on every appliance that was internet-facing."
  - claim_id: dcb3f00d17
    entry: 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade every internet-facing NetScaler ADC/Gateway to 14.1-73.37+ (14.1-FIPS 14.1-73.37 FIPS+) or 13.1-64.23+ (13.1-FIPS/NDcPP 13.1-37.279+) now; on a 13.1-branch appliance run `show ns variable` first; if it returns any variables, install 13.1-64.24 instead to avoid a known reboot loop. Capture logs, an instance snapshot where the appliance is virtual, a support bundle and a core dump from each exposed appliance BEFORE patching, since the upgrade can remove forensic evidence of prior exploitation."
