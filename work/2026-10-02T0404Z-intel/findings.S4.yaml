  discovery_trace: 'first seen at: frenchbreaches, URL https://frenchbreaches.com (WebFetch, entries DINUM / ANSSI lab / TRACFIN / QualiCharge dated 2026-09-30, all citing ANSSI''s REACTIV report) -> pivot: WebSearch (''ANSSI point de situation REACTIV septembre 2026 Metabase DINUM ProConnect Nuage-Public'') -> primary: ANSSI PDF https://www.cert.ssi.gouv.fr/uploads/CERTFR-2026-CTI-006.pdf (read with fetch_source pdf) and CTI page https://www.cert.ssi.gouv.fr/cti/CERTFR-2026-CTI-006/ -> corroboration: Next https://next.ink/259353/securite-le-premier-point-de-situation-reactiv-de-lanssi-illustre-lampleur-du-probleme/ and IT-Connect https://www.it-connect.fr/anssi-dinum-fuite-donnees-metabase/'
  summary: 'ANSSI published on 2026-09-30 the first situation report of REACTIV, the operation the French Prime Minister ordered on 2026-09-01 to give the agency reinforced powers (impose urgent measures on ministries within tight deadlines, centralise technical crisis communication) against data breaches at state services. The report states 99 data breaches were reported to ANSSI since 2026-08-01, 67 confirmed and 32 of those still being handled by ANSSI, and cautions the figures are provisional. It names six recurring causes: mass exploitation of the Metabase SQL-injection flaw CVE-2026-72898 since early August (nine ministry instances compromised; fix available since 2026-08-06; ANSSI asked all ministries to inventory instances and verify updates); infostealer-harvested credentials from personal devices used for work, or from earlier breaches, giving access to exposed services without a second factor; IDOR flaws, sometimes combined with other weaknesses, enabling mass document exfiltration; missing or weak MFA (an e-mail second factor counts as weak); supply-chain compromise by rebound through a provider that held ministry data; and ordinary development and configuration defects (missing authorisation checks, SQL injection, exposed files). Per-incident entries include: the Metabase compromises of two DINUM instances (ProConnect, Nuage-Public), 118 accounts at ANSSI''s own innovation lab, QualiCharge (102,000 charging sessions) and France VAE (all user data, 2026-08-08), with Zero Logement Vacant (claimed 48 million owners) and Docurba as suspected Metabase entry points; an Education nationale intrusion across more than ten academies including GAIA (4.35 million teachers potentially exposed) and a SIECLE claim; a compromised Tchap account used to read public and private rooms including some of DGFiP and the land registry; SNU (275,000 users via IDOR); Bloctel (service closed 2026-08-11); TRACFIN-related portal support provider (136 declarants and 213 support requests, provider dropped); DGDDI (three mail accounts and an exchange server); DGFiP (about 353,000 individuals, 252,000 professionals and a land-registry server, about 434,000 users, via a surveyor''s compromised account) and the Bureau Numérique mutualised mailbox (more than 300 accounts, mailbox and file content exfiltrated, MFA now forced). These are Admiralty-A statements by the national authority about its own state services; individual ''revendication'' items inside the report are labelled as claims by ANSSI.'
  region_nexus: France (neighbouring state). The vectors (internet-exposed BI tool, infostealer credentials without MFA, IDOR on citizen/professional portals, provider rebound) apply one-to-one to cantonal and communal portals in Switzerland.
  primary_sector_nexus: 'direct (peer): state administrations at national level; the report is the best public statistical picture of how a European public sector is being breached in 2026.'
