  new_entities:
  - key: incident:openinfra-europe-nordix-artifactory-2026-09
    type: incident
    name: OpenInfra Europe Nordix Artifactory compromise (August-September 2026)
    aliases:
    - artifactory.nordix.org compromise
    summary: OpenInfra Europe's self-hosted Artifactory was compromised on 2026-08-31 via CVE-2026-82329, discovered 2026-09-15; artifacts from 2026-08-28 to 2026-09-15 potentially compromised (Help Net Security, 2026-09-30).
  verification: SINGLE-SOURCE-OTHER
  sourcing_note: Only Help Net Security (reading the victim's own homepage notice) was reachable as a citable page; the notice itself sits on the OpenInfra Europe homepage, which cannot be cited.
  confidence: MEDIUM
  novelty: update-of:2026-09-01/jfrog-artifactory-cve-2026-82329-default-config-admin-bypass
  borderline: true
  borderline_reason: single citable source; victim is an open-source infrastructure foundation hub, not a Swiss public body; value is the 15-day undetected window and the supply-chain exposure framing for a KEV-listed flaw already covered
  priority_suggestion: routine update
  classification_suggestion:
    reliability: C
    credibility: '3'
  evidence:
