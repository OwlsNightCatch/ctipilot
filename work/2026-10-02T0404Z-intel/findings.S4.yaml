    attribution: ANSSI / CERT-FR
    source_url: https://www.cert.ssi.gouv.fr/uploads/CERTFR-2026-CTI-006.pdf
  - quote: Le correctif est disponible depuis le 6 août 2026
    attribution: ANSSI / CERT-FR
    source_url: https://www.cert.ssi.gouv.fr/uploads/CERTFR-2026-CTI-006.pdf
  - quote: 'Absence de double authentification (MFA) ou authentification faible : facteur clé de nombreux incidents'
    attribution: ANSSI / CERT-FR
    source_url: https://www.cert.ssi.gouv.fr/uploads/CERTFR-2026-CTI-006.pdf
  - quote: On y apprend que 99 violations de données lui ont été signalées depuis le 1er août 2026, dont 67 sont confirmées.
    attribution: IT-Connect
    source_url: https://www.it-connect.fr/anssi-dinum-fuite-donnees-metabase/
  extended_notes: 'Exposure: any Metabase instance (self-hosted) not upgraded since 2026-08-06; any portal where staff or supplier accounts authenticate with password only or with an e-mail second factor; any citizen/professional portal with object identifiers that are not authorisation-checked. Detection: Metabase has a vendor-documented two-request pattern (see the existing Metabase entry); credential-stuffing or first-time logins from infostealer-exposed accounts on externally reachable portals; enumeration of sequential object identifiers (IDOR) in web access logs; anomalous mailbox or shared-file-space exports from accounts that were reset after infostealer exposure; provider-side access from supplier accounts. Post-patch check: ANSSI''s own remediation list for Metabase victims is secrets reset, attacker-created accounts removed, accounts unused for three months disabled, passwords of all accounts rotated (DINUM and ANSSI-lab entries). Swiss reader value: the report quantifies which controls (MFA with a strong factor, no unsegmented exposure of sensitive apps from the inter-ministry network - that last point is in the separate DGFiP incident report already covered) would have broken most chains.'
