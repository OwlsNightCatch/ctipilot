  - quote: The earliest malicious activity identified in the available logs dates to August 31.
    attribution: BleepingComputer
    source_url: https://www.bleepingcomputer.com/news/security/bitget-hacked-via-zero-day-in-third-party-security-products/
  - quote: Bitget has since notified the relevant third-party vendor and disabled the affected functionality pending completion of a fix.
    attribution: The Hacker News
    source_url: https://thehackernews.com/2026/10/bitget-confirms-third-party-zero-day.html
  extended_notes: 'The first two quotes are Mandiant''s and SlowMist''s words as printed by BleepingComputer (the Mandiant PDF extracts one character per line). Detection concept (from the described behaviour): service processes on security-appliance nodes spawning scripts that read process environment for database credentials; management-console logins by employee identities followed by command-injection-shaped task parameters; web-shell and outbound C2 from appliances toward production job servers. Hardening: treat appliance management planes and their node services as tier-0, segment them from production job servers.'
