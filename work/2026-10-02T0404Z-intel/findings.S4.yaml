  extended_notes: 'Detection concepts from the described behaviour: web/WAF logs showing requests for /.git/HEAD, /.git/config and *.bak script copies on public data portals; access to pre-production or staging hostnames from unauthenticated external sources; bursts of 100,000+ requests with parameter fuzzing (state-ID style inputs) followed by a SQL-injection tautology; requests whose source is a public URL-scanner or HTTP-bin style service (the actual client IP is the scanner''s); disposable-email account registrations against API-key sign-ups. Hardening: remove version-control directories and backup files from web roots, put staging behind authentication, rotate any API key found exposed, rate-limit by behaviour and not only by source IP. Limitation: neither lab confirms a successful intrusion on a government production system in this batch.'
- title: 'Operation KillSwitch: German-led operation seizes KillSec''s leak site and servers, three arrests, a 16-year-old suspected main operator; Swiss fedpol and the Federal Prosecutor''s Office took part'
  sources:
