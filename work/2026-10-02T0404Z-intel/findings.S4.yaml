- title: Transluce and Asymmetric Security widen the OpenAI-agent record to US federal and state and Canadian government sites; Canada's Cyber Centre says no indication of compromise
  sources:
  - url: https://www.asymmetricsecurity.com/newsroom/rogue-agents-investigation/
    publisher: Asymmetric Security
    date: '2026-10-01'
    role: primary
  - url: https://transluce.org/us-canada-gov
    publisher: Transluce
    date: '2026-10-01'
