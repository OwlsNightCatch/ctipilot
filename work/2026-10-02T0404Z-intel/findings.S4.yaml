- title: Kiteworks patches 126 vulnerabilities including CVE-2026-54154, a CVSS-10 unauthenticated chain to root on the Email Protection Gateway (fixed in EPG 9.4.1); no source links it to the flaw found during the shutdown
  sources:
  - url: https://github.com/kiteworks/security-advisories/security/advisories/GHSA-5xhq-9wq3-rvj6
    publisher: Kiteworks
    date: '2026-09-30'
    role: primary
  - url: https://www.bleepingcomputer.com/news/security/kiteworks-patches-max-severity-email-protection-gateway-code-injection-vulnerability/
    publisher: BleepingComputer
    date: '2026-10-01'
    role: corroborating
  - url: https://thehackernews.com/2026/09/kiteworks-fixes-critical-flaw-found.html
    publisher: The Hacker News
    date: '2026-09-29'
    role: context
  discovery_trace: 'first seen at: bleepingcomputer, URL https://www.bleepingcomputer.com/news/security/ (listing, 2026-10-01 ''Kiteworks patches max severity code injection vulnerability'') -> drill: https://www.bleepingcomputer.com/news/security/kiteworks-patches-max-severity-email-protection-gateway-code-injection-vulnerability/ -> primary: Kiteworks advisory https://github.com/kiteworks/security-advisories/security/advisories/GHSA-5xhq-9wq3-rvj6 (CVE id and CVSS vector read from the page HTML)'
  summary: 'Kiteworks published a security advisory on 2026-09-30 for its Email Protection Gateway (EPG), a component of the Kiteworks Private Content Network: all EPG versions before 9.4.1 let a remote attacker execute arbitrary code with root privileges; the fix is EPG 9.4.1 or later. The advisory carries CVE-2026-54154, CVSS 3.1 vector AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H (maximum severity) and weaknesses CWE-22 (path traversal), CWE-94 (code injection) and CWE-306 (missing authentication); Kiteworks credits three researchers reporting through its YesWeHack bug-bounty programme. BleepingComputer, reading the advisory set, reports Kiteworks shipped fixes for 126 vulnerabilities in the same cycle, including 11 further critical authentication-bypass, admin-takeover, XSS and access-control flaws in the Core and EPG components, and quotes Kiteworks that publicly reachable endpoints with chained input-handling flaws allowed unauthenticated code execution and escalation to root of the appliance; Shadowserver tracks nearly 400 internet-exposed Kiteworks instances (patch state unknown). No source says CVE-2026-54154 has been exploited. The store''s entry covers Kiteworks'' precautionary shutdown of 2026-09-26/27 and its statement that work during the shutdown found a ''previously unknown critical vulnerability'' in a capability enabled for under 1% of customers; BleepingComputer states Kiteworks still has not detailed that flaw or assigned it a CVE, so whether EPG CVE-2026-54154 (a bug-bounty finding) is the same flaw is unestablished.'
  region_nexus: global product with government-agency customers per BleepingComputer; the original shutdown notice fell in the Central European time zone.
  primary_sector_nexus: direct-by-product where Kiteworks EPG is deployed as a mail gateway; relevant to administrations using Kiteworks for secure mail and managed file transfer.
  sector: public-sector
  cves:
  - CVE-2026-54154
  techniques:
  - T1190
  - T1068
  affected_products:
  - Kiteworks Email Protection Gateway
  entity_keys:
  - product:kiteworks
  new_entities: []
  verification: MULTI-SOURCE
  confidence: HIGH
  novelty: update-of:2026-09-26/kiteworks-precautionary-shutdown-imminent-zero-day-warning
  priority_suggestion: notable as an update (named component and fixed version for a maximum-severity pre-auth chain in a product the entry already covers; S1 may return the CVE as well)
  classification_suggestion:
    reliability: A
    credibility: '1'
  evidence:
  - quote: All Kiteworks Email Protection Gateway versions prior to 9.4.1.
    attribution: Kiteworks
    source_url: https://github.com/kiteworks/security-advisories/security/advisories/GHSA-5xhq-9wq3-rvj6
  - quote: A remote attacker may be able to execute arbitrary code with root privileges.
    attribution: Kiteworks
    source_url: https://github.com/kiteworks/security-advisories/security/advisories/GHSA-5xhq-9wq3-rvj6
  - quote: The flaw affects all Kiteworks Email Protection Gateway releases before 9.4.1 and is now patched in versions 9.4.1 or later.
    attribution: BleepingComputer
    source_url: https://www.bleepingcomputer.com/news/security/kiteworks-patches-max-severity-email-protection-gateway-code-injection-vulnerability/
  - quote: Kiteworks has yet to share additional details on the fixed vulnerability and has not yet assigned a CVE ID for easy tracking.
    attribution: BleepingComputer
    source_url: https://www.bleepingcomputer.com/news/security/kiteworks-patches-max-severity-email-protection-gateway-code-injection-vulnerability/
  extended_notes: 'Exposure: EPG appliances exposed to the internet on any release before 9.4.1; read the version in the appliance admin interface. Hardening: upgrade to EPG 9.4.1+ and apply the same-cycle Core fixes; the advisory states no workaround. Post-patch compromise check: the sources give no exploitation evidence and no indicators, so none is stated; a pre-auth root chain on an internet-facing mail gateway warrants a review of appliance process-creation and outbound traffic since the vulnerable build was reachable. Cross-reference: Accellion FTA (Kiteworks'' predecessor) was a mass-exploitation target in 2020-2021 (history, not sourced here).'
- title: 'Bitget: Mandiant and SlowMist reports show two unnamed third-party security appliances compromised via zero-days, a web shell and C2 on one, lateral movement to the wallet job server, and activity dating back to 31 August'
  sources:
  - url: https://www.bitget.com/academy/bitget-security-incident-what-happened-timeline-impact-response
    publisher: Bitget
    date: '2026-09-30'
    role: primary
  - url: https://www.bleepingcomputer.com/news/security/bitget-hacked-via-zero-day-in-third-party-security-products/
    publisher: BleepingComputer
    date: '2026-09-30'
    role: corroborating
  - url: https://thehackernews.com/2026/10/bitget-confirms-third-party-zero-day.html
    publisher: The Hacker News
    date: '2026-10-01'
    role: corroborating
  - url: https://img.bgstatic.com/multiLang/events/MFR26-1029_Status_Update_Bitget_0930.pdf
    publisher: Mandiant
    date: '2026-09-30'
    role: primary
  discovery_trace: 'first seen at: bleepingcomputer, URL https://www.bleepingcomputer.com/news/security/ (listing, 2026-09-30) -> drill: https://www.bleepingcomputer.com/news/security/bitget-hacked-via-zero-day-in-third-party-security-products/ -> primary: Bitget incident page https://www.bitget.com/academy/bitget-security-incident-what-happened-timeline-impact-response and the Mandiant status PDF https://img.bgstatic.com/multiLang/events/MFR26-1029_Status_Update_Bitget_0930.pdf (read with fetch_source pdf; the PDF extraction is one character per line so quotes are taken from BleepingComputer/THN quoting it) -> corroboration: The Hacker News https://thehackernews.com/2026/10/bitget-confirms-third-party-zero-day.html'
  summary: 'The store''s Bitget entry says the attacker exploited a vulnerability in a third-party security product; independent forensics published on 2026-09-30 now say more. Mandiant''s status report states that on 2026-09-24 a threat actor gained unauthorised privileged access to two third-party security appliances (A and B), deployed a web shell on appliance B, established command-and-control, and used that persistent access to move laterally to Bitget''s production wallet job server and deploy malicious packages. SlowMist, per The Hacker News and BleepingComputer, dates the earliest malicious activity to 2026-08-31, when a service on a Product A node hit by a zero-day was made to run a hidden script that read the environment variable holding the database password and connected to the database, with similar activity on two other nodes on 09-23 and 09-25; on 09-25 the attacker used an internal employee''s identity on Product B''s management platform, made three consecutive command-injection attempts into task parameters to write files, and submitted code through the platform''s web-execution endpoint; a bespoke withdrawal tool tuned to the wallet system''s withdrawal logic then ran from 01:49 on 2026-09-25 (SlowMist''s timestamps). Neither the vendors nor the products are named; Bitget says it notified the vendor and disabled the affected functionality pending a fix. Attribution remains Bitget''s: its CEO cites IP behaviour and on-chain analysis for North Korea, with Elliptic and TRM Labs reporting laundering-wallet overlaps; the Mandiant and SlowMist passages quoted do not attribute. Window between first compromise and theft is about 25 days on SlowMist''s dating.'
  region_nexus: global crypto exchange; outside the constituency, kept as an update because the store already carries the entry and the delta is the initial-access class.
  primary_sector_nexus: 'indirect: the transferable lesson is zero-day exploitation of security appliances and their management planes as the entry into a high-value segment, followed by credential-from-environment-variable theft and employee-identity abuse on a management console.'
  sector: finance
