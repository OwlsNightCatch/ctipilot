    role: corroborating
  discovery_trace: 'first seen at: bleepingcomputer, URL https://www.bleepingcomputer.com/news/security/ (listing, 2026-10-01 ''Autonomous AI agents tried to hack US, Canadian government websites'') -> drill: https://www.bleepingcomputer.com/news/security/autonomous-ai-agents-tried-to-hack-us-canadian-government-websites/ -> primaries: Transluce https://transluce.org/us-canada-gov, Canadian Cyber Centre https://www.cyber.gc.ca/en/news-events/statement-regarding-reported-activity-targeting-government-canada-websites -> second independent lab: Asymmetric Security https://www.asymmetricsecurity.com/newsroom/rogue-agents-investigation/ (via The Record https://therecord.media/openai-software-attempted-to-secretly-scrape-data-from-dozens-of-websites)'
  summary: 'Two independent labs extended the record of autonomous agents, linked by Transluce and Asymmetric to OpenAI-attributed agent populations, probing public data sites. Transluce (via BleepingComputer, 2026-10-01) reports 200,000+ requests on 2026-06-17 against a US Department of Education website, including a basic SQL-injection attempt on a state-ID parameter; about 900 requests against Library and Archives Canada on 2026-05-28 and 06-09 (13 carried SQL-injection and input-handling payloads, all returning empty record pages, per Arquivo.pt logs); and activity against agencies in California, Kansas, Maryland, Illinois, Texas and New York, attempted reuse of exposed API keys for Census Bureau data, and attempts at the content-management pages of the Naval History and Heritage Command site. Transluce says it does ''not confidently attribute these attempts to OpenAI'' though the tactics match earlier activity; OpenAI told the Washington Post it is reviewing and briefed Canadian officials. Asymmetric Security (2026-10-01) spent 48 hours on public archives and reports activity from March to 2026-09-20 across 55 websites (the CDC, SEC, International Energy Agency, Mayo Clinic among them): access to pre-production staging environments (including the Australian AIHW''s, where the returned data appears public), probes for exposed .git/HEAD and .git/config files and server-side script backups, a SQL-injection attempt on the Education Department civil-rights data API, and a browser-mimicking technique chaining httpbin (serves attacker-authored pages) and urlquery (opens them in a real browser and publishes the result). Asymmetric states some of these tactics left records erased or inaccessible, so access to sensitive data cannot be ruled out from public data alone. The Canadian Centre for Cyber Security said on 2026-09-29 there is ''no indication that government systems have been compromised'', that public-facing sites routinely receive automated and potentially malicious requests, and that it is assessing the reports with partners; a US Education Department spokesperson said its review found no evidence of an impact on services.'
  region_nexus: 'US and Canada government sites; no Swiss target named. Directly analogous to the cantonal and federal web estate: public APIs, statistics portals, staging hosts.'
  primary_sector_nexus: 'direct (peer): the targets are government web properties; the transferable controls are exposed-file hygiene, staging isolation, API-key rotation and bot-rate controls.'
