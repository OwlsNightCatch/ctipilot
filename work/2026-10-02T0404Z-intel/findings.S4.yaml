- title: OpenInfra Europe's self-hosted JFrog Artifactory (artifactory.nordix.org) was taken over via CVE-2026-82329 on 31 August and the compromise found only on 15 September; artifacts from 28 August to 15 September are treated as potentially tampered
  sources:
  - url: https://www.helpnetsecurity.com/2026/09/30/openinfra-jfrog-artifactory-instance-compromised/
    publisher: Help Net Security
    date: '2026-09-30'
    role: primary
  discovery_trace: 'first seen at: helpnetsecurity, URL https://www.helpnetsecurity.com/ (extract of the homepage, 2026-09-30 headline) -> drill: https://www.helpnetsecurity.com/2026/09/30/openinfra-jfrog-artifactory-instance-compromised/ -> WebSearch (''OpenInfra Europe security incident notice artifactory.nordix.org ...'') found only copies of the same article and the notice on the OpenInfra Europe homepage (not citable as a content page)'
  summary: Help Net Security reports that OpenInfra Europe, the European hub of the OpenInfra Foundation (OpenStack's home), posted a security notice that its self-hosted JFrog Artifactory instance at artifactory.nordix.org was compromised. The notice says anyone who downloaded or installed artifacts from it between 2026-08-28 and 2026-09-15 should stop using them, remove them from pipelines and treat them as potentially compromised; the instance ran a vulnerable version, which allowed an unauthenticated attacker to exploit CVE-2026-82329 (authentication bypass to administrator) and thereby alter deployment, artifacts, credentials and integrations. OpenInfra Europe says the compromise happened on 2026-08-31 (the day in-the-wild exploitation began per Fastly and Wiz as cited by Help Net Security) and was discovered on 2026-09-15 'after a legitimate user was denied access'; scope and impact are still undetermined. CVE-2026-82329 was disclosed on 2026-08-28 and added to CISA's KEV catalogue on 2026-09-02; the store already carries an entry on it (2026-09-01). This is the first victim organisation in the store whose own notice ties the flaw to a software-supply-chain exposure window.
  region_nexus: Europe (Nordix is OpenInfra Europe infrastructure); no Swiss party named.
  primary_sector_nexus: 'indirect: any government or supplier development team that pulled Nordix artifacts in the window, and, more broadly, self-hosted Artifactory instances not patched within days of disclosure.'
  sector: technology
  cves:
  - CVE-2026-82329
  techniques:
  - T1190
  - T1195.002
  affected_products:
  - JFrog Artifactory
  entity_keys:
