  discovery_trace: 'first seen at: frenchbreaches, URL https://frenchbreaches.com (WebFetch; SDIS 66 entry dated 2026-09-30) -> WebSearch (''SDIS 66 Pyrénées-Orientales fuite de données cyberattaque pompiers communiqué'') -> victim confirmation: ICI/Radio France https://www.ici.fr/infos/faits-divers-justice/le-sdis-66-victime-d-une-fuite-de-donnees-7983412 -> claim detail: https://fuitesinfos.fr/article/2026-09-30-sdis-66 and https://www.cyberattaque.org/sdis-66-118-892-interventions-et-pres-de-100-000-documents-medicaux-revendiques-par-un-hacker/'
  summary: 'SDIS 66, the departmental fire and rescue service of the Pyrénées-Orientales, confirmed to Radio France (ICI) on 2026-10-01 that data was stolen from one of its servers, which is maintained by a technical provider. The data includes ''fiches secours'', the forms crews fill in at a patient''s home or an accident scene: medical data, intervention reports, contact details and copies of identity documents and Vitale health-insurance cards; SDIS 66 says the nature and extent are still being identified. A crisis cell was opened, the document-transmission system was blocked to stop further leakage, and as a direct operational consequence the forms are now written by hand and transmitted by radio. A forum user named ''Syrv4x'' posted on 2026-09-30 an offer of 118,892 intervention records (328 MB) and 99,108 documents and images (10.5 GB); Fuites Infos reports the sample covers an intervention dated 2026-09-27, three days before the posting, which would imply the data was current at theft; SDIS 66 has not confirmed those volumes. ICI notes the incident comes a month after the SDIS du Gard theft already tracked in the store''s SDIS campaign entry; no source links ''Syrv4x'' to the actors named there. Swiss nexus: fire, rescue and ambulance services are in the constituency; the earlier SDIS du Gard confirmation in the store concerned personnel identity documents and bank details, whereas this one involves patient-care records and an operational fallback to paper and radio.'
  region_nexus: France (neighbouring state); transferable to Swiss fire-and-rescue and EMS organisations that hold patient-care records on systems run by external providers.
