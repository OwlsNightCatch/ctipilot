  summary: 'The Record reports (2026-10-01) that Fakturownia, an online invoicing platform used by more than 600,000 businesses, said an unidentified attacker exploited a vulnerability and gained unauthorised access to its servers; potentially exposed data includes account data, password hashes, bank account information, authentication and integration tokens and customers'' and partners'' data, and possibly invoices issued before 2023. Fakturownia integrates with Poland''s National e-Invoicing System (KSeF); the Finance Ministry said on 2026-09-30 its review found no breach of KSeF''s security and no leak of data held by it, and Fakturownia says its KSeF certificates remain secure. Zaufana Trzecia Strona reported on 2026-09-29, from the actor itself, that ''Fingerprint'' (the actor behind the MyDr and Medyc breaches already in the store) claims a 6 TB theft of Fakturownia invoices, and on 2026-10-01 that a different pseudonym, ''HORUS'', claims data of 2.4 million patients, 712,000 medical staff and 1.2 million prescriptions from FELG, maker of a dental practice application the vendor says is used by more than 16,000 dentists; FELG confirmed an incident and its notice says the perpetrator calls himself a member of ''Fingerprint'', which the outlet says is untrue. Assessment owner: the outlet, not the victims, makes the actor attributions; The Record names no actor.'
  region_nexus: Poland; EU single-market SaaS supply chain; no DACH party named.
  primary_sector_nexus: 'indirect: SaaS providers integrated with national e-government systems (here KSeF) as a path for token and certificate exposure; same class as Swiss e-invoicing and health-records SaaS integrations.'
