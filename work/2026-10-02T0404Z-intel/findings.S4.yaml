  summary: 'FTAPI Software GmbH (Munich), a secure data-exchange vendor whose own figures are 2,000+ business customers and more than one million users ''from administration, health, and industry'', confirmed to heise that an IT security incident was detected on 2026-09-14: unauthorised individuals reached ''a single, locally operated internal server'' and deployed ransomware. FTAPI says it isolated the affected systems, brought in external forensics, informed customers and partners, met supervisory reporting duties (including data protection) and filed a criminal complaint; it states the FTAPI platform, customer systems and the data customers exchange through it were not affected, that investigation of customer systems is complete with no indication of compromise, and that further forensics continue. The Gentlemen ransomware group listed FTAPI on its leak site (first sighted by Borns IT blog on 2026-09-28); the listing carries only generic company information and a countdown that heise read as about five days at 2026-09-29, i.e. due around 2026-10-03/04, and Cybernews (2026-09-30) notes the group has not shown what data it claims. FTAPI has not said how the server was reached. Swiss nexus: Kanton Luzern''s own data-protection notice lists ''FTAPI SecuTransfer'' as the secure file-transfer service its administration offers, so at least one cantonal administration is a customer; CERT.at''s daily report of 2026-09-29 also flagged the incident. Facts: FTAPI''s confirmation, the internal-server ransomware event, the listing exists. Claims: The Gentlemen''s implied data theft. Unknown: whether the compromised server held customer contact metadata, support tickets or notification data about exchanges (none stated either way).'
  region_nexus: Germany (Munich) vendor; DACH administration customers incl. Kanton Luzern per its own notice; leak-site deadline about 2026-10-03/04 so fresh developments are likely inside the next 48 h.
