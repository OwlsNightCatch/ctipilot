  extended_notes: 'Timing: heise (2026-09-29) is just outside the 50 h window; the Cybernews piece (2026-09-30T13:38Z) is inside it, and the leak-site countdown ends about 2026-10-03/04, so this is returned as live. The previous intel run did not carry it. Exposure: organisations that exchange files through FTAPI should ask FTAPI in writing what the compromised server held (customer contact data, support tickets, logs) rather than rely on the platform-unaffected statement alone; the vendor''s statement concerns the platform and the exchanged data, not vendor-held metadata. Detection: nothing customer-side is stated; the practical hook is phishing/impersonation awareness for staff whose addresses were used with FTAPI notifications (FTAPI-branded download-link mails are a ready-made lure if metadata leaks), and vendor-notification handling. No exploitation vector, no CVE and no TTP beyond ransomware deployment are given by any source.'
- title: 'ANSSI''s first REACTIV situation report: 99 data breaches reported against French state services since 1 August (67 confirmed); recurring causes are Metabase CVE-2026-72898, infostealer credentials without MFA, IDOR flaws and supplier compromise'
  sources:
  - url: https://www.cert.ssi.gouv.fr/uploads/CERTFR-2026-CTI-006.pdf
