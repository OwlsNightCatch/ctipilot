    attribution: Help Net Security
    source_url: https://www.helpnetsecurity.com/2026/09/30/openinfra-jfrog-artifactory-instance-compromised/
  - quote: but that the breach was discovered on September 15
    attribution: Help Net Security
    source_url: https://www.helpnetsecurity.com/2026/09/30/openinfra-jfrog-artifactory-instance-compromised/
