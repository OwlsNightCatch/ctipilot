  discovery_trace: 'first seen at: hackernews feed, URL https://feeds.feedburner.com/TheHackersNews (2026-09-29 ''Dutch Police Arrest 24-Year-Old Amsterdam Man in ShinyHunters Investigation'') plus bleepingcomputer listing https://www.bleepingcomputer.com/news/security/ -> drill: https://www.bleepingcomputer.com/news/security/fbi-tells-shinyhunters-members-to-turn-themselves-in-after-recent-arrest/ -> primary: Politie https://www.politie.nl/nieuws/2026/september/29/11-verdachte-aangehouden-in-onderzoek-naar-hackersgroep-shinyhunters.html -> corroboration: CyberInsider https://cyberinsider.com/shinyhunters-leader-arrested-as-group-denies-plans-to-leak-fbi-data/ and DataBreaches.net https://databreaches.net/2026/09/29/shocker-suspected-shinyhunters-member-charged-with-attempted-incitement-to-commit-two-murders/'
  summary: 'The store''s ShinyHunters/FBI entry already notes a Dutch arrest tied to the investigation; the Dutch police announcement of 2026-09-29 and the FBI''s same-day statement add the following. Politie says a 24-year-old Amsterdam man was arrested on 2026-09-15, suspected of a role within ShinyHunters and of participation in a criminal organisation; material on his laptop also led to a separate suspicion of attempted incitement to commit two murders abroad, which police say is distinct from the ShinyHunters investigation; data carriers were seized and further arrests are not excluded; investigation by the National Police''s High Tech Crime Team under the National Public Prosecutor''s Office. BleepingComputer reports the Rotterdam court ordered at least 90 more days of pre-trial detention. The FBI''s Cyber Division, in a video statement, called him ''one of the alleged leaders'' of ShinyHunters, said the group and alleged co-conspirators breached more than 140 organisations since last year and collected at least $70 million in extortion payments, and urged remaining members to contact the FBI first; Dutch police do not call the suspect a leader (DataBreaches.net notes the difference). CyberInsider reports the FBI entry has been removed from ShinyHunters'' extortion site and that a group spokesperson now says the group never intended to publish the data. Assessment owner: the leader characterisation is the FBI''s; the Dutch charge sheet as reported does not allege it.'
  region_nexus: Netherlands/US law-enforcement action against a group whose Salesforce/SSO/PeopleSoft campaigns reach European public bodies; no Swiss victim named.
  primary_sector_nexus: 'indirect: actor-tracking update for a group that has targeted HR/recruitment and law-enforcement infrastructure (see the entry''s PeopleSoft guidance).'
