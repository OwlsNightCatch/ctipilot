  summary: The Swiss public-service broadcaster SRG SSR said on 2026-09-28 it detected a cyberattack in which unauthorised parties accessed data of SRF employees. Contact and organisation data from 2020 of about 340 current and former SRF staff, mostly from the present 'Information' unit, left the network; SRG names, functions and business and partly private contact details, and states it has no indication that passwords, financial or bank data, journalistic sources, research data or communications content are affected. SRG deactivated the affected accesses, added security measures, informed the authorities and filed a criminal complaint, informed the people concerned directly, and says no further unauthorised access has occurred and it has no indication the data was published or misused; the vector, actor and the data's age (a 2020 snapshot) are not explained. The incident is small; its relevance is as a Swiss public-service institution disclosure with a stale-data-snapshot pattern.
