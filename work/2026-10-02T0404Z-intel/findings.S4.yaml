  discovery_trace: 'first seen at: bleepingcomputer, URL https://www.bleepingcomputer.com/news/security/ (listing, 2026-10-01) -> drill: https://www.bleepingcomputer.com/news/security/divd-says-zammad-zero-days-enabled-ai-driven-network-breach/ -> pivot: Help Net Security https://www.helpnetsecurity.com/2026/10/01/divd-agentic-ai-attack-breach/ (surfaced the DIVD and NCSC-NL links) -> primary: DIVD CSIRT https://csirt.divd.nl/cases/DIVD-2026-00014/ and https://csirt.divd.nl/cases/DIVD-2026-00015/ -> national CERT: NCSC-NL https://www.ncsc.nl/alerts/actief-misbruik-van-zeroday-kwetsbaarheden-in-zammad-update-nu'
  summary: 'The Dutch Institute for Vulnerability Disclosure (DIVD), a volunteer CSIRT that scans for and notifies owners of vulnerable systems, disclosed on 2026-09-24 that it had been breached on 2026-09-21 in what it assesses is an agentic-AI-driven attack. On 2026-09-30 DIVD stated the entry was a chain of two previously unknown Zammad (open-source helpdesk/ticketing) vulnerabilities, found with Merlon Security researchers and now numbered CVE-2026-102489 and CVE-2026-102490. Per DIVD''s case file, CVE-2026-102489 is a session-hijack flaw leading to remote code execution as the zammad user in versions 6.3.0 to 6.5.4 (present but, per DIVD, not exploitable in 7.0.0 to 7.1.3 ''due to environment conditions''); CVE-2026-102490 lets the local zammad user escalate to root in all versions from 1.5.0 to the 7.1.0 alpha. DIVD says the chain ran ''in seconds'', after which the attacker reached other services and exfiltrated data; network segmentation and IR actions stopped deeper movement, but DIVD assumes breach and on 2026-10-01 confirmed volunteer data (DIVD email addresses, possibly contact details) left the network, which makes impersonation of DIVD volunteers easier. NCSC-NL''s alert of 2026-09-30 states both flaws have been actively exploited since 2026-09-21 and rates likelihood and damage as high. Sources diverge on patch state: NCSC-NL says CVE-2026-102489 has a vendor update and CVE-2026-102490 is ''not yet fixed''; DIVD''s case file lists patch status ''Available'' with the recommendation to upgrade to Zammad 7 or take the instance offline; Help Net Security writes both flaws are ''currently without a fix''. DIVD reports the agent decided each next step itself, left over-explaining comments in its scripts that eased reverse engineering, and ''polluted its own MITM attack with password spraying''; DIVD says it sees no link to any known threat actor and that the vulnerable system was not Citrix NetScaler. Not stated by any source: which data beyond volunteer contact data was read, who operated the agent, or how many other Zammad instances were compromised.'
  region_nexus: Incident in the Netherlands (NCSC-NL alert). Zammad GmbH is Berlin-based and the store's earlier entry on Zammad 7.1 (BSI WID-SEC-2026-1981) characterises it as a widely used DACH public-sector helpdesk; BleepingComputer cites Zammad's own figure of 2,000+ customers and 55,000 users.
  primary_sector_nexus: 'direct-by-product: service-desk/ticketing platforms are a standard component of cantonal, communal and federal IT service desks; exposure depends on internet-reachable self-hosted Zammad instances running 6.3.0-6.5.4 (RCE) or any version (root LPE).'
