  extended_notes: 'Exposure: self-hosted Zammad reachable from the internet; read the running version from the admin UI or package manager and compare to DIVD''s ranges (RCE 6.3.0-6.5.4; root LPE all versions). The LPE needs a prior foothold as the local zammad user, so it matters mainly as the second stage of the RCE or of any other foothold on the Zammad host. Detection (follows mechanically from the stated chain): process-creation events whose parent is the Zammad application service (shell or interpreter children of the zammad user), privilege change from the zammad user to uid 0, web/application access logs for the session-hijack path, outbound and east-west connections from the Zammad host to other internal services within seconds of the first foothold, and authentication logs showing password spraying against internal services from that host. DIVD distributes a log-check script for CVE-2026-102489 indicators (not reproduced here). Post-patch compromise check: NCSC-NL advises copying application and network logs BEFORE installing the update so the second flaw''s abuse can still be investigated later; DIVD advises upgrading to Zammad 7 or taking the instance offline and ''assume breach'' language applies to anything that was internet-exposed on a vulnerable version since 2026-09-21; secrets stored on or reachable from the Zammad host (mail, LDAP, API tokens) should be treated as exposed if compromise cannot be excluded. Contradiction to surface: patch status of CVE-2026-102490 differs across NCSC-NL (''not yet fixed''), DIVD case file (''Available'') and Help Net Security (''without a fix''); check Zammad''s own advisory before telling a reader the root flaw is closed. Behavioural lookalike: none stated; DIVD notes the agent ''justifies its own actions'' in script comments, which is unusual attacker telemetry and a possible discriminator in script content.'
