- code: F4
  category: hallucinated-fact
  section: trending-vulnerabilities
  item: "CVE-2026-88771 / CVE-2026-88772, Citrix NetScaler ADC and Gateway (2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev), body Triage line, claim d793a58403"
  url_or_quote: "an unauthenticated request whose logged text carries command-like content is enough to reach the vulnerable code path"
  summary: "(low confidence) watchTowr Labs (https://labs.watchtowr.com/oh-look-the-foot-gun-went-off-again-citrix-netscaler-preauth-command-injection-cve-2026-88771/): the injected text must be shaped as a Pitboss crash message ('pitboss PPE unexpectedly died NSPPE;<shell syntax>'); the script greps only 'pitboss.*PPE.*missed too many heartbeats|pitboss.*PPE.*unexpectedly died' lines; CERT-EU (https://cert.europa.eu/blog/taking-execute-logging-a-bit-too-literally-cve-2026-88771): '| tail -1 ... only the last matching line counts'; Unit 42 shows the same 'pitboss PPE missed too many heartbeatsNSPPE;' prefix. Generic command-like text is not enough. Say the logged text imitates a Pitboss crash message followed by shell syntax."
- code: F3
  category: claim-not-supported
  section: trending-threats
  item: "OpenAI-attributed agents ... UNCTAD (2026-09-28/openai-agents-unctad-double-encoding-proxy-chain-scan), summary, claim 0b95bcd983"
  url_or_quote: "On 2026-09-30 and 2026-10-01 Transluce reported failed SQL-injection attempts against a US Department of Education API and Library and Archives Canada, and Asymmetric Security separately reported probes for exposed Git files"
  summary: "(low confidence) Transluce's post (https://transluce.org/us-canada-gov) is dated 2026-09-30; 2026-10-01 is Asymmetric Security's date (https://www.asymmetricsecurity.com/newsroom/rogue-agents-investigation/). The sentence attaches both dates to Transluce. Name each date with its publisher."
- code: F14
  category: quantifier-without-source
  section: active-threats
  item: "Belnet supplier zero-day (2026-10-02/belnet-supplier-zero-day-mail-copied-65-days), summary (claim 11cd998d5d) and title"
  url_or_quote: "plus every download link its FileSender and FedSender transfer services generated"
  summary: "(low confidence) Belnet (https://www.belnet.be/en/news-events/news/security-and-privacy-incident-affecting-belnets-it-infrastructure): 'All download links generated and sent directly by our FileSender and FedSender services during this period'. The body keeps 'and sent directly'; the summary (and the title's 'FileSender download links') drop the qualifier that narrows the set."
- code: F14
  category: quantifier-without-source
  section: active-threats
  item: "Kiteworks precautionary shutdown (2026-09-26/kiteworks-precautionary-shutdown-imminent-zero-day-warning), summary (claim ce3dd4cc75) and body paragraph 1 (claim 2733ea8d47)"
  url_or_quote: "No CVE had been assigned for the threat behind the warning"
  summary: "(low confidence) The cited The Record page (https://therecord.media/kiteworks-urges-customers-to-stop-using-systems-incident) says only 'There is no known CVE, patch, or additional technical details available' (watchTowr's Knott) and that Kiteworks did not answer whether the bug had a CVE yet. 'No CVE had been assigned' is stronger than 'no known CVE'. BleepingComputer (2026-10-01) says Kiteworks 'has not yet assigned a CVE ID' for the vulnerability it fixed during the shutdown; use that wording and citation, or write 'no CVE was publicly known'."
- code: F2
  category: generic-url
  section: trending-vulnerabilities
  item: "Citrix NetScaler entry, sources[] / evidence source_url / 2026-09-30 section: Censys advisory"
  url_or_quote: "https://censys.com/advisory/cve-2026-10747-2/"
  summary: "(low confidence) The cited slug names CVE-2026-10747 (a different CVE, the IBM MQ row held in the backlog); the URL answers HTTP 301 to the canonical page https://censys.com/advisory/cve-2026-88771-cve-2026-88772/ (title 'Sept 28 Advisory: Citrix NetScaler ADC and NetScaler Gateway Zero-Day Remote Code Execution [CVE-2026-88771, CVE-2026-88772]', rel=canonical read this iteration). Replace with the canonical URL. Same pattern, lower weight: the SDIS entry's Objectif Gard URL (objectifgard.com) answers 301 to www.objectifsud.fr (publisher's new domain)."
- code: F11
  category: editorial-advisory
  section: trending-vulnerabilities
  item: "Citrix NetScaler entry, updates[] record 2026-10-02T04:56:31Z summary"
  url_or_quote: "Earlier text is corrected: the KEV remediation deadline is dropped, the evidence to capture before patching is an instance snapshot where the appliance is virtual (not a configuration snapshot), cited to watchTowr and Unit 42, and NCSC-CH's 2026-09-28 advisory replaces a statement that it had not yet published one."
  summary: "(low confidence) git diff HEAD shows body changes the record summary does not state: the Triage line rewritten around unauthenticated log poisoning, the 2026-09-29 section reworded from 'independently confirming' to 'relaying Citrix's confirmation' with inline links, the BleepingComputer/NCSC-NL disclosure clause reworded, and CERT.at linked inline. Iteration 1 asked that record summaries state every changed element; add the Triage and 2026-09-29 corrections (or accept)."
- code: F11
  category: editorial-advisory
  section: trending-threats
  item: "UNCTAD entry, ## Update 2026-10-02T05:03:36Z, closing sentence of paragraph 2 (claim 21f1612be9)"
  url_or_quote: "The record adds no Swiss target and no confirmed intrusion; its use is as a description of the traffic a public statistics or archive portal should expect and how to spot it"
  summary: "(low confidence) Composition-rationale language ('The record adds ...; its use is as ...') in reader-facing text, the pattern check 12 excludes. State the hunt-relevant content directly (requests for version-control directories and backup copies, staging hostnames reachable without authentication, API keys in public URLs) or drop the 'use' framing."
- code: F11
  category: editorial-advisory
  section: active-threats
  item: "Operation KillSwitch entry, body paragraph 1 (claim 57baab9914)"
  url_or_quote: "about 1,000 suspected attacks worldwide, at least 70 of them in Germany, of which about 500 are so far identified as successful"
  summary: "(low confidence) Polizei Hamburg: 'rund 1.000 mutmaßliche Angriffe weltweit ... Rund 500 der mutmaßlichen Angriffe konnten bislang als erfolgreich identifiziert werden'. The 500 is of the ~1,000, but 'of which' follows 'at least 70 of them in Germany' and reads as 500 of 70. Reword: 'about 500 of the roughly 1,000 are so far identified as successful'."
