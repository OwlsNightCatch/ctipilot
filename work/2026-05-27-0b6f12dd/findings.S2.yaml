items:
  - title: "UPDATE: CERT-FR CERTFR-2026-ACT-023 confirms French victims in TeamPCP / Mini Shai-Hulud supply chain campaign — ANSSI formally documents French public-sector impact"
    sources:
      - url: "https://www.cert.ssi.gouv.fr/actualite/CERTFR-2026-ACT-023/"
        publisher: "ANSSI / CERT-FR"
        date: "2026-05-26"
        role: "primary"
    discovery_trace: "cert-fr actu-recent bridge listing → CERTFR-2026-ACT-023 published 2026-05-26 → fetched directly via bridge url subcommand → confirmed French victims in TeamPCP/Mini Shai-Hulud → primary (no pivot needed)"
    summary: |
      ANSSI/CERT-FR published bulletin CERTFR-2026-ACT-023 on 2026-05-26, its weekly review of week 21 (May 18–24, 2026). The bulletin is the first French national CERT publication to formally confirm French victims in the TeamPCP / Mini Shai-Hulud software supply-chain campaign. CERT-FR characterises the campaign as active since September 2025, motivated by financial gain and notoriety, and states that compromised packages include mbt, @cap-js/*, @tanstack/*, @squawk/*, @mistralai/mistralai, mistralai (PyPI), guardrails-ai, lightning, and 300+ @antv packages. The worm component exfiltrates secrets — GitHub tokens, SSH keys, cloud credentials, database credentials — and implements persistence via a daemon with self-destruct mechanism. Source code was leaked publicly on 2026-05-13 to Breached.st. CERT-FR links to Semgrep, Unit 42, Grafana, and Microsoft analysis as primary technical references. For defenders: any Node.js, Python, or JavaScript CI/CD pipeline that pulled affected packages between September 2025 and May 2026 should be treated as compromised; secret rotation on GitHub tokens, SSH host keys, and cloud service credentials is the immediate action; corroborate via Datadog Agent SANDCLOCK, SIEM searches for outbound connections to the known exfiltration staging infrastructure from npm/node parent processes, and Git credential-helper invocation anomalies (T1195.002 Supply Chain Compromise; T1552.004 Private Keys; T1567.002 Exfiltration to Code Repository).
    ch_eu_nexus: "France confirmed as victim jurisdiction for TeamPCP supply-chain campaign; indirect risk to CH/EU organisations using the same open-source dependency ecosystem"
    public_sector_nexus: "direct — French victims explicitly confirmed by ANSSI; campaign affects any organisation using affected npm/PyPI packages in CI/CD"
    sector: "software development, public administration, financial services"
    cves: [CVE-2026-45321]
    actors_campaigns_malware: ["TeamPCP", "mini-shai-hulud"]
    verification: SINGLE-SOURCE-NATIONAL-CERT
    confidence: HIGH
    novelty: "update-to-prior:2026-05-26"
    evidence:
      - quote: "Des victimes françaises ont été identifiées dans le cadre de la campagne TeamPCP / Mini Shai-Hulud"
        attribution: "ANSSI / CERT-FR"
        source_url: "https://www.cert.ssi.gouv.fr/actualite/CERTFR-2026-ACT-023/"
      - quote: "Le ver Mini Shai-Hulud exfiltre les secrets — jetons GitHub, clés SSH, identifiants cloud, identifiants de base de données — et met en œuvre une persistance via un démon avec mécanisme d'autodestruction"
        attribution: "ANSSI / CERT-FR"
        source_url: "https://www.cert.ssi.gouv.fr/actualite/CERTFR-2026-ACT-023/"
    extended_notes: |
      The CERTFR-2026-ACT-023 bulletin also highlights the following items relevant to EU/CH defenders (all underlying vulnerabilities were covered in prior briefs, but CERT-FR's explicit listing re-prioritises for French government/public-sector readers):
      - CVE-2026-9082 (Drupal PostgreSQL SQLi, CVSS 9.8, ITW) — vendor advisory updated to confirm active exploitation
      - CVE-2026-42945 (NGINX Rift heap overflow, CVSS 9.2) — ITW exploitation now confirmed by CERT-FR
      - CVE-2026-41091 / CVE-2026-45498 (MS Defender EoP/DoS pair, ITW) — included in bulletin
      - CVE-2024-12802 (SonicWall GEN6 SSL-VPN MFA bypass) — CERT-FR notes configuration changes required beyond patching
      These items are already in covered_items.json; this note is for context only.

  - title: "Microsoft SharePoint Server authenticated RCE via untrusted deserialization (CVE-2026-45659) — omitted from May 2026 Patch Tuesday, published out-of-band 2026-05-26"
    sources:
      - url: "https://security-hub.ncsc.admin.ch/#/posts/12594"
        publisher: "NCSC Switzerland (Security Hub post 12594)"
        date: "2026-05-26"
        role: "primary"
      - url: "https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-45659"
        publisher: "Microsoft MSRC"
        date: "2026-05-26"
        role: "corroborating"
      - url: "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-1652"
        publisher: "BSI / CERT-Bund (WID-SEC-2026-1652)"
        date: "2026-05-26"
        role: "corroborating"
    discovery_trace: "ncsc-csh recent bridge → post 12594 published 2026-05-26 → MSRC bridge msrc cve CVE-2026-45659 for technical detail → BSI CSAF via bridge bsi-csaf WID-SEC-2026-1652 for corroboration"
    summary: |
      Microsoft published CVE-2026-45659 on 2026-05-26 as an out-of-band informational update: the flaw was fixed in the May 2026 Patch Tuesday cumulative updates but was inadvertently omitted from the May 2026 Security Updates release notes. Organisations that applied the May 2026 update are already protected and no further action is required. CVE-2026-45659 (CWE-502 Deserialization of Untrusted Data) affects SharePoint Server 2016 / SharePoint Enterprise Server 2016 / SharePoint Server 2019 / SharePoint SE, CVSS 3.1 = 8.8 (AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H). Exploitation requires an authenticated attacker with at minimum Site Member (low-privilege, PR:L) permissions who can send a crafted network request to the SharePoint server; no admin privileges needed. Microsoft rates exploitation as "Less Likely" and the vulnerability is not publicly disclosed nor actively exploited. The MSRC revision note (v1.1, 2026-05-26) explicitly states this is an informational change only. NCSC-CH published the advisory the same day highlighting it for Swiss public-sector SharePoint operators who may have applied the May PT without being aware the CVE was omitted from the original advisory set. For defenders: verify that May 2026 cumulative updates (KB identifiers per affected SharePoint version) are applied; if not, treat this as a medium-urgency authenticated RCE requiring prompt patching ahead of opportunistic exploitation campaigns targeting SharePoint's extensive public-sector adoption in Switzerland and Europe. Detection for exploitation attempts: IIS/SharePoint ULS logs for ViewState or BinaryFormatter deserialization exceptions originating from SharePoint worker processes; anomalous POST bodies to `/_layouts/` endpoints from Site Member-level authenticated sessions (T1190 Exploit Public-Facing Application; CWE-502).
    ch_eu_nexus: "NCSC-CH published advisory for Swiss public-sector operators; BSI advisory WID-SEC-2026-1652 published same day for German federal and state government users; SharePoint is pervasive in CH/EU public administration"
    public_sector_nexus: "direct — SharePoint Server on-premises is widely deployed in CH and EU government environments"
    sector: "public administration, legal, financial services"
    cves: [CVE-2026-45659]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Successful exploitation allows an authenticated attacker with 'Site Member' permissions to execute arbitrary code remotely via network access."
        attribution: "NCSC Switzerland (Security Hub post 12594)"
        source_url: "https://security-hub.ncsc.admin.ch/#/posts/12594"
      - quote: "Information published. This CVE was addressed by updates that were released in May 2026, but the CVE was inadvertently omitted from the May 2026 Security Updates. This is an informational change only. Customers who have already installed the May 2026 updates do not need to take any further action."
        attribution: "Microsoft MSRC"
        source_url: "https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-45659"
    extended_notes: |
      Vulnerability class: CWE-502 (Deserialization of Untrusted Data) in Microsoft Office SharePoint. Attack vector: network, low complexity, low-privilege (Site Member account sufficient). The fact that this was omitted from May PT documentation may cause some organisations' patch-management processes to flag SharePoint as "no applicable security bulletins" for May 2026, potentially leaving them unaware that a CVE exists. SOC managers should validate that their vulnerability management tooling has picked up CVE-2026-45659 and correctly maps it to the May PT cumulative update — avoid treating this as requiring a separate out-of-band patch. Affected: SharePoint Server 2016, SharePoint Enterprise Server 2016, SharePoint Server 2019, SharePoint Server SE (all versions without the May 2026 CU applied). Patched: May 2026 Patch Tuesday cumulative update (already released 2026-05-13).

