items:
  - title: "CVE-2026-45659 — Microsoft SharePoint Server 2016/2019/SE: authenticated Site Member can trigger untrusted-data deserialization for RCE (CVSS 8.8, patch available)"
    sources:
      - url: "https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-45659"
        publisher: "Microsoft MSRC"
        date: "2026-05-21"
        role: "primary"
      - url: "https://security-hub.ncsc.admin.ch/#/posts/12594"
        publisher: "NCSC.ch Security Hub"
        date: "2026-05-26"
        role: "corroborating"
      - url: "https://thehackernews.com/2026/05/microsoft-patches-sharepoint-rce-flaw.html"
        publisher: "The Hacker News"
        date: "2026-05-26"
        role: "corroborating"
      - url: "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-1652"
        publisher: "BSI CERT-Bund"
        date: "2026-05-26"
        role: "corroborating"
    discovery_trace: "first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/12594 (advisory 12594, published 2026-05-26) → primary: Microsoft MSRC, URL https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-45659 → corroborating: BSI WID-SEC-2026-1652 (updated 2026-05-26)"
    summary: |
      CVE-2026-45659 (CWE-502 Deserialization of Untrusted Data, CVSS 3.1 = 8.8, vector AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H) affects Microsoft SharePoint Server 2016, SharePoint Enterprise Server 2016, and SharePoint Server 2019. Any user with at minimum "Site Member" permissions (PR:L — the lowest level of authenticated membership) can send a crafted network request that triggers deserialization of attacker-controlled data in the SharePoint Server process, resulting in arbitrary code execution on the server. Microsoft's FAQ confirms low-privilege authenticated access is sufficient; no admin rights required. The BSI CERT-Bund issued WID-SEC-2026-1652 on 2026-05-21, updated 2026-05-26. NCSC.ch published advisory 12594 on 2026-05-26. Exploitation status is "Less Likely" per MSRC as of 2026-05-26 — no confirmed ITW exploitation yet, but the low authentication bar (any org-member account) makes this high-priority for internet-facing SharePoint farms and SharePoint Online tenant-connected on-prem deployments. Patch shipped in Microsoft's May 2026 Patch Tuesday (2026-05-21). Defenders: apply May 2026 CU for SP Server 2016 and 2019; monitor IIS logs for anomalous authenticated POST requests to SharePoint `/_api/` and `/_layouts/` endpoints; alert on `w3wp.exe` spawning child processes such as `cmd.exe`, `powershell.exe`, or `conhost.exe` (Sysmon EID 1 with parent-image filter on `w3wp.exe`). T1505.003 Web Shell post-exploitation commonly follows deserialization RCE.
    ch_eu_nexus: "global; SharePoint Server on-prem widely deployed across Swiss and EU public-sector organisations as intranet/document management platform"
    public_sector_nexus: "direct — SharePoint Server is the dominant document-management and intranet platform in Swiss federal and cantonal government"
    sector: "government, finance, healthcare, education"
    cves: [CVE-2026-45659]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Deserialization of untrusted data in Microsoft Office SharePoint allows an authorized attacker to execute code over a network."
        attribution: "Microsoft MSRC"
        source_url: "https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-45659"
      - quote: "any authenticated attacker, who has a minimum of Site Member permissions (PR:L), could execute code remotely on the SharePoint Server"
        attribution: "Microsoft MSRC FAQ"
        source_url: "https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-45659"
      - quote: "Vendor patches available"
        attribution: "NCSC.ch Security Hub advisory 12594"
        source_url: "https://security-hub.ncsc.admin.ch/#/posts/12594"

  - title: "CVE-2026-9312 — GitHub Enterprise Server (all versions < 3.22): pre-auth SSRF via upload-endpoint path traversal grants access to internal services and credentials (CVSS 4.0 = 9.2)"
    sources:
      - url: "https://euvd.enisa.europa.eu/enisa/eu_vulnerability_database/EUVD-2026-32027"
        publisher: "ENISA EUVD"
        date: "2026-05-27"
        role: "primary"
      - url: "https://docs.github.com/en/enterprise-server@3.21/admin/release-notes#3.21.1"
        publisher: "GitHub Enterprise Server Release Notes"
        date: "2026-05-27"
        role: "corroborating"
    discovery_trace: "first seen at: enisa-euvd recent criticals, EUVD-2026-32027 (published 2026-05-27, CVSS 9.2) → primary: ENISA EUVD advisory EUVD-2026-32027 → corroborating: GitHub Enterprise Server release notes 3.21.1"
    summary: |
      CVE-2026-9312 / GHSA-fwfp-h68w-2hcr (CVSS 4.0 = 9.2, vector AV:N/AC:H/AT:P/PR:N/UI:N) is a server-side request forgery (SSRF) in GitHub Enterprise Server affecting all versions prior to 3.22. An unauthenticated remote attacker can inject path-traversal content into request parameters of an upload endpoint. The insufficient input validation allows the attacker to bypass the intended upload request flow and redirect internal API calls to arbitrary internal services, potentially accessing internal service responses and exposing sensitive credentials including GitHub App tokens, service-account keys, and internal API secrets. The vulnerability was reported via the GitHub Bug Bounty program. Fixes ship in versions 3.16.20, 3.17.17, 3.18.11, 3.19.8, 3.20.4, and 3.21.1. EPSS is 0.0 at time of writing (no exploitation observed yet). The ENISA EUVD entry was published 2026-05-27 with "no assigner EPSS exploitation" but CVSS 4.0 = 9.2 qualifies for priority patching. This affects on-prem GHES installations common in Swiss financial sector and EU large-enterprise software development environments. Detection: HTTP server access logs showing anomalous upload-endpoint requests with path-traversal sequences (`../`, `%2e%2e%2f`) in request parameters; WAF rules blocking path traversal in upload endpoints. T1190 Exploit Public-Facing Application. T1552.007 Container API (internal service credential exposure).
    ch_eu_nexus: "on-prem GitHub Enterprise Server installations in Swiss financial sector, EU tech/financial companies, and public-sector software development teams"
    public_sector_nexus: "indirect"
    sector: "technology, finance, government"
    cves: [CVE-2026-9312]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "An unauthenticated attacker to send crafted requests to internal services by exploiting insufficient input validation in an upload endpoint. By injecting path traversal content into request parameters, an attacker could bypass the intended request flow and redirect internal API calls, potentially accessing internal services and exposing sensitive credentials."
        attribution: "ENISA EUVD EUVD-2026-32027"
        source_url: "https://euvd.enisa.europa.eu/enisa/eu_vulnerability_database/EUVD-2026-32027"

  - title: "CVE-2026-44895 — GitLab MCP Server (yoda-digital, < 0.6.0): no-auth SSE RPC endpoint bound to 0.0.0.0 with wildcard CORS exposes operator's GitLab PAT (CVSS 4.0 = 9.2)"
    sources:
      - url: "https://github.com/yoda-digital/mcp-gitlab-server/security/advisories/GHSA-8jr5-6gvj-rfpf"
        publisher: "GitHub Security Advisory"
        date: "2026-05-26"
        role: "primary"
      - url: "https://euvd.enisa.europa.eu/enisa/eu_vulnerability_database/EUVD-2026-32003"
        publisher: "ENISA EUVD"
        date: "2026-05-26"
        role: "corroborating"
    discovery_trace: "first seen at: enisa-euvd recent criticals (EUVD-2026-32003, published 2026-05-26, CVSS 9.2) → primary: GitHub Security Advisory GHSA-8jr5-6gvj-rfpf"
    summary: |
      CVE-2026-44895 / GHSA-8jr5-6gvj-rfpf (CVSS 4.0 = 9.2, AV:N/AC:L/AT:P/PR:N/UI:N) affects the `mcp-gitlab-server` npm package (GitLab MCP Server by yoda-digital) before version 0.6.0. The HTTP transport in `src/transport.ts` stands up a Server-Sent Events (SSE) RPC endpoint backed by the operator's `GITLAB_PERSONAL_ACCESS_TOKEN` with zero inbound authentication checks. The bind defaults to `0.0.0.0` (all interfaces), and every response carries `Access-Control-Allow-Origin: *`, exposing the mutation-capable endpoint to any cross-origin browser context. A network-adjacent or internet-based attacker who can reach the endpoint can issue arbitrary GitLab API calls authenticated as the operator's PAT — creating, cloning, or deleting repositories; reading private code; modifying CI pipelines; or triggering webhook-based supply-chain actions. Exploitation requires the MCP server to be running and reachable on an accessible port; AI-agent developer workflows and VS Code + Copilot MCP integrations represent a growing exposure surface. Fixed in version 0.6.0. Detection: network egress monitoring for SSE keep-alive connections from developer workstations to unexpected GitLab API endpoints; EDR telemetry showing `node.js` processes spawning with outbound connections to `gitlab.com` or self-hosted GitLab instances without user interaction. T1552.008 Chat Messages (AI MCP context). T1119 Automated Collection via PAT reuse.
    ch_eu_nexus: "affects developer tooling; relevant to Swiss and EU software teams using GitLab + MCP-based AI code assistants"
    public_sector_nexus: "indirect — MCP integrations increasingly adopted in public-sector DevOps"
    sector: "technology, software development, financial"
    cves: [CVE-2026-44895]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "the HTTP transport in src/transport.ts ships with no authentication layer at all and a wildcard Access-Control-Allow-Origin: * on every response... the bind defaults to 0.0.0.0 and exposes the auth-less surface on every interface"
        attribution: "GitHub Security Advisory GHSA-8jr5-6gvj-rfpf"
        source_url: "https://github.com/yoda-digital/mcp-gitlab-server/security/advisories/GHSA-8jr5-6gvj-rfpf"

  - title: "CVE-2026-9642 — Delta Electronics DIAView SCADA: incomplete fix for prior unauthenticated remote database access (CVE-2025-62582); mitigation bypass disclosed by Tenable (CVSS 9.8)"
    sources:
      - url: "https://www.tenable.com/security/research/tra-2026-44"
        publisher: "Tenable Research"
        date: "2026-05-26"
        role: "primary"
      - url: "https://euvd.enisa.europa.eu/enisa/eu_vulnerability_database/EUVD-2026-31970"
        publisher: "ENISA EUVD"
        date: "2026-05-26"
        role: "corroborating"
    discovery_trace: "first seen at: enisa-euvd recent criticals (EUVD-2026-31970, published 2026-05-26, CVSS 9.8) → primary: Tenable Research TRA-2026-44, URL https://www.tenable.com/security/research/tra-2026-44"
    summary: |
      CVE-2026-9642 / GHSA-4v2g-76qr-8gvj (CVSS 3.1 = 9.8, AV:N/AC:L/PR:N/UI:N) documents a mitigation bypass of the previously disclosed CVE-2025-62582 (unauthenticated remote database access) in Delta Electronics DIAView, an HMI/SCADA application widely deployed in OT environments. Tenable researcher Ben Smith disclosed TRA-2026-44 on 2026-05-26: an unauthenticated remote attacker can still access configured databases in a DIAView project despite the vendor's prior mitigation for CVE-2025-62582. Delta Electronics is a major Taiwanese industrial automation vendor with installations across EU manufacturing and energy sectors. The vulnerability affects DIAView projects that were believed to be patched against the prior CVE. No EPSS data (new disclosure). Detection: network monitoring for anomalous connections to DIAView database listener ports from non-engineering workstations; ICS/OT network segmentation checking for east-west traffic to SCADA historian databases. T1190 Exploit Public-Facing Application. Hardening: apply latest DIAView patch from Delta Electronics; enforce strict network segmentation between OT historian layer and IT networks; verify that patch for CVE-2025-62582 was correctly applied by testing the mitigation bypass vector.
    ch_eu_nexus: "Delta Electronics DIAView deployed in EU manufacturing and energy sector OT environments; Switzerland has significant Delta automation customer base in precision manufacturing"
    public_sector_nexus: "indirect — affects critical infrastructure OT environments"
    sector: "energy, manufacturing, OT/ICS"
    cves: [CVE-2026-9642, CVE-2025-62582]
