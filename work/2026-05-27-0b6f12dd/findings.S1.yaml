  - title: "MuddyWater / Seedworm (Iran-aligned, MOIS-linked): DLL side-loading campaign targeting nine organisations in nine countries using signed Fortemedia (fmapp.exe) and SentinelOne (sentinelmemoryscanner.exe) binaries, Q1 2026 — Symantec Threat Hunter Team and VMware Carbon Black"
    sources:
      - url: "https://www.security.com/threat-intelligence/iran-seedworm-electronics"
        publisher: "Symantec Threat Hunter Team (Broadcom)"
        date: "2026-05-22"
        role: "primary"
      - url: "https://www.bleepingcomputer.com/news/security/iranian-hackers-targeted-major-south-korean-electronics-maker/"
        publisher: "BleepingComputer"
        date: "2026-05-22"
        role: "corroborating"
      - url: "https://thehackernews.com/2026/05/muddywater-uses-dll-side-loading-in.html"
        publisher: "The Hacker News"
        date: "2026-05-26"
        role: "corroborating"
    discovery_trace: "first seen at: hackernews feed (https://feeds.feedburner.com/TheHackersNews, item published 2026-05-26) → primary: Symantec Threat Hunter Team research blog, URL https://www.security.com/threat-intelligence/iran-seedworm-electronics → corroborating: BleepingComputer 2026-05-22"
    summary: |
      Symantec's Threat Hunter Team and VMware Carbon Black published concurrent analysis on 2026-05-22 of a Q1 2026 espionage campaign by MuddyWater (also tracked as Seedworm, Static Kitten, TA450, APT34 adjacent; attributed to Iran's Ministry of Intelligence — MOIS) targeting nine organisations across nine countries on four continents. Victim sectors include industrial and electronics manufacturing, education and public-sector bodies, financial services, and professional services. A major South Korean electronics manufacturer was breached; attackers spent approximately one week inside its network in February 2026. Other known victims include an international airport in the Middle East, Southeast Asian industrial manufacturers, and a Latin American financial-services provider. The campaign's defining TTP is DLL side-loading (T1574.002) via two legitimately signed vendor binaries: (1) Fortemedia `fmapp.exe` side-loads malicious `fmapp.dll` containing ChromeElevator, a post-exploitation tool that harvests credentials from Chrome-based browser stores; (2) SentinelOne `sentinelmemoryscanner.exe` side-loads `sentinelagentcore.dll`. A `node.exe`-based implant chain drops PowerShell scripts performing reconnaissance, screenshot capture, SAM hive theft (T1003.002), privilege escalation (T1068), and SOCKS5 reverse-proxy tunnelling (T1572). The campaign shows a marked step-up in Seedworm's operational security compared to activity observed 2–3 years prior. Detection: hunt for `fmapp.exe` or `sentinelmemoryscanner.exe` processes loading DLLs not in the vendor's signed manifest (Sysmon EID 7 with `ImageLoaded` filter for `fmapp.dll` or `sentinelagentcore.dll` from outside expected installation paths); alert on `node.exe` spawning PowerShell with base64-encoded command strings (Sysmon EID 1, parent `node.exe`, child `powershell.exe`); hunt Sysmon EID 10 for `lsass.exe` handle access from `node.exe` or `fmapp.exe` process trees; SOCKS5 tunnel detection via abnormal outbound TCP to non-standard ports from `node.exe`. T1574.002 DLL Side-Loading; T1003.002 OS Credential Dumping — Security Account Manager; T1572 Protocol Tunneling.
    ch_eu_nexus: "EU public-sector and industrial manufacturing targeted; Iranian espionage clusters routinely prioritise European government and defence-adjacent industrial targets"
    public_sector_nexus: "direct — education and public-sector bodies explicitly named as victim category"
    sector: "government, education, manufacturing, finance"
    cves: []
    actors_campaigns_malware: ["MuddyWater", "Seedworm", "Static Kitten", "TA450", "ChromeElevator"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "The activity targeted industrial and electronics manufacturing, education and public-sector bodies, financial services, and professional services"
        attribution: "Symantec Threat Hunter Team"
        source_url: "https://www.security.com/threat-intelligence/iran-seedworm-electronics"
      - quote: "The attackers relied heavily on DLL side-loading using legitimately signed Fortemedia (fmapp.exe) and SentinelOne (sentinelmemoryscanner.exe) binaries to execute malicious DLLs while masquerading as benign software"
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/iranian-hackers-targeted-major-south-korean-electronics-maker/"

  - title: "UPDATE: CVE-2026-42897 — Microsoft Exchange Server 2016/2019/SE: OWA stored XSS actively exploited, permanent patch still pending — Exchange Emergency Mitigation Service auto-applied but known mitigation gaps for IE/Edge-IE mode and OWA calendar printing"
    sources:
      - url: "https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-42897"
        publisher: "Microsoft MSRC"
        date: "2026-05-18"
        role: "primary"
      - url: "https://techcommunity.microsoft.com/blog/exchange/addressing-exchange-server-may-2026-vulnerability-cve-2026-42897/4518498"
        publisher: "Microsoft Exchange Team Blog"
        date: "2026-05-20"
        role: "corroborating"
      - url: "https://www.securityweek.com/microsoft-warns-of-exchange-server-zero-day-exploited-in-the-wild/"
        publisher: "SecurityWeek"
        date: "2026-05-15"
        role: "corroborating"
    discovery_trace: "first seen at: msrc release 2026-May (MSRC CVRF API, exploited=Yes) → primary: MSRC advisory CVE-2026-42897 (initial 2026-05-14, latest revision 2026-05-18) → corroborating: Exchange Team Blog 2026-05-20"
    summary: |
      CVE-2026-42897 (CWE-79 Stored XSS, CVSS 3.1 = 8.1, AV:N/AC:L/PR:N/UI:R) affects Exchange Server 2016, 2019, and Subscription Edition. An unauthenticated remote attacker can send a crafted email that, when opened in Outlook Web Access, executes arbitrary JavaScript in the victim's browser context (T1189 Drive-by Compromise / T1059.007 JavaScript). Exchange Online is NOT affected. Microsoft disclosed the vulnerability 2026-05-14 and confirmed active exploitation (Exploitation Detected). A permanent patch does not yet exist — Microsoft issued only a temporary automatic mitigation via the Exchange Emergency Mitigation Service (EEMS), which applies Content Security Policy headers. The EEMS mitigation is enabled by default on Exchange Server 2016 CU24+ and later. CISA added CVE-2026-42897 to the KEV catalog on 2026-05-15. Known mitigation gaps: (1) Internet Explorer and Microsoft Edge running in IE compatibility mode do not support CSP — users of OWA via these clients remain vulnerable even with the EEMS mitigation applied; (2) OWA Print Calendar functionality breaks after mitigation is applied; (3) inline images may not display correctly. Detection: Exchange Server HTTPERR and IIS access logs showing abnormal POST requests from unauthenticated clients to `OWA/` paths; review Exchange Server event logs for EEMS service activity (Application Event ID 1 or 2 from MSExchange Mitigation Service); hunt for JavaScript process execution chains originating from browser processes after OWA access. NOTE: This item has not appeared in prior briefs despite being on the CISA KEV since 2026-05-15; surfaced here as a coverage gap with material status: permanent patch still absent as of 2026-05-27.
    ch_eu_nexus: "Exchange Server on-prem widely deployed in EU financial and government sectors; NCSC.ch has not yet issued a specific advisory on this CVE"
    public_sector_nexus: "direct — on-prem Exchange used by Swiss federal agencies and cantonal governments"
    sector: "government, finance, healthcare"
    cves: [CVE-2026-42897]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: update-to-prior:2026-05-15

