items:
  - title: "Charter Communications confirms ShinyHunters breach of Salesforce tenant — 42 M records claimed, victim statement denies sensitive PI or CPNI exfiltration"
    sources:
      - url: "https://cyberinsider.com/charter-communications-confirms-data-breach-as-hackers-threaten-leak-of-42-million-records/"
        publisher: "CyberInsider"
        date: "2026-05-23"
        role: "primary"
      - url: "https://www.bleepingcomputer.com/news/security/charter-confirms-data-breach-after-shinyhunters-extortion-threat/"
        publisher: "BleepingComputer"
        date: "2026-05-26"
        role: "primary"
      - url: "https://cyberinsider.com/shinyhunters-claims-hundreds-of-victims-in-new-salesforce-aura-campaign/"
        publisher: "CyberInsider"
        date: "2026-03-09"
        role: "corroborating (attack-method background)"
    discovery_trace: "first seen at: bleepingcomputer RSS feed, 2026-05-26 → primary: CyberInsider (May 23 original confirmation) + BleepingComputer (May 26 update) → Salesforce Aura campaign background: CyberInsider March 9 article"
    summary: |
      Charter Communications (Spectrum brand) confirmed on 2026-05-23 that it suffered a breach after ShinyHunters listed it on its extortion site threatening to release data unless a ransom was paid by 2026-05-27. ShinyHunters claims initial access on April 1, 2026 via a voice-phishing (vishing) attack that compromised an employee's Microsoft Entra account; attackers then used that foothold to export millions of consumer and business customer records from Charter's Salesforce CRM instance. Charter's official statement acknowledges the incident and states law enforcement was notified, but asserts that "no sensitive personal information (PI) or customer proprietary network information (CPNI) data was exfiltrated by the threat actor." ShinyHunters claims over 42 million records were stolen containing names, email addresses, physical addresses, phone numbers, plan details, support ticket data, and some CPNI-class fields — a claim Charter disputes in scope and sensitivity. The breach is part of ShinyHunters' broader Salesforce Aura campaign (announced March 2026) targeting the /s/sfsites/aura Experience Cloud endpoint to extract CRM data at scale from organisations with overly permissive guest-user profiles; the Charter intrusion appears to layer vishing-based Entra initial access on top of the Salesforce data-extraction technique. Extortion deadline was 2026-05-27 (this brief's date); Charter has not disclosed any ransom payment.

      Defender notes: The Salesforce Aura attack surface — /s/sfsites/aura on Experience Cloud sites — requires guest-user profile audits: restrict field-level object permissions for all Guest Profile objects, disable unnecessary Apex REST and AuraComponent endpoints, enable "Secure Guest User Record Access" in setup, and review which CRM objects are queryable without authentication. The vishing initial-access vector (Entra account compromise) calls for MFA-resistant authentication (FIDO2/passkeys) for privileged SaaS admin accounts and Conditional-Access policies that enforce compliant-device + trusted-location for CRM admin operations. Detection: monitor Salesforce Event Monitoring for bulk-query patterns from Guest user sessions; Entra sign-in logs for new device registrations on admin accounts from unfamiliar ASNs; audit Salesforce Connected App OAuth grants for tokens issued to unrecognised clients.
    ch_eu_nexus: "global; Charter is US-based but the Salesforce Aura campaign is active against EU/Swiss enterprises using Salesforce Experience Cloud"
    public_sector_nexus: "indirect — pattern relevant to EU/CH public bodies using Salesforce CRM"
    sector: "telco, consumer services"
    cves: []
    actors_campaigns_malware: ["ShinyHunters"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "update-to-prior:2026-05-25"
    evidence:
      - quote: "Charter Communications has confirmed it suffered a data breach after the ShinyHunters extortion group threatened to leak stolen data unless a ransom is paid."
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/charter-confirms-data-breach-after-shinyhunters-extortion-threat/"
      - quote: "No sensitive personal information (PI) or customer proprietary network information (CPNI) data was exfiltrated by the threat actor."
        attribution: "Charter Communications (via CyberInsider)"
        source_url: "https://cyberinsider.com/charter-communications-confirms-data-breach-as-hackers-threaten-leak-of-42-million-records/"
      - quote: "ShinyHunters weaponized AuraInspector — an open-source auditing tool that Mandiant itself released in January 2026 to help administrators find misconfigurations — to automate the scanning process at scale."
        attribution: "CyberInsider (campaign background)"
        source_url: "https://cyberinsider.com/shinyhunters-claims-hundreds-of-victims-in-new-salesforce-aura-campaign/"
    extended_notes: |
      Prior coverage: ShinyHunters Charter listing (unconfirmed) was covered 2026-05-25. This item represents the material new delta: Charter's own confirmation statement as of 2026-05-26. Deadline pressure (May 27) now elapsed.
      ShinyHunters attack methodology: vishing → Entra account compromise → Salesforce OAuth token → bulk CRM export, or direct /s/sfsites/aura guest-user query (unauthenticated). The two vectors are not mutually exclusive; Charter may have been hit by both.
      MITRE ATT&CK: T1566.004 (Voice Phishing / Vishing), T1078.004 (Valid Accounts: Cloud Accounts), T1530 (Data from Cloud Storage Object), T1537 (Transfer Data to Cloud Account).

  - title: "7-Eleven confirms ShinyHunters breach exposed 185,000 franchise applicants — names, SSNs, driver's licences; update on prior 600k claim"
    sources:
      - url: "https://www.bleepingcomputer.com/news/security/7-eleven-data-breach-exposes-personal-information-of-185-000-people/"
        publisher: "BleepingComputer"
        date: "2026-05-26"
        role: "primary"
      - url: "https://cyberinsider.com/7-eleven-data-breach-exposes-personal-information-of-185000-applicants/"
        publisher: "CyberInsider"
        date: "2026-05-26"
        role: "corroborating"
      - url: "https://securityaffairs.com/192336/data-breach/shinyhunters-hack-7-eleven-franchisee-data-and-salesforce-records-exposed.html"
        publisher: "SecurityAffairs"
        date: "2026-05-18"
        role: "corroborating (prior disclosure record)"
    discovery_trace: "first seen at: BleepingComputer RSS feed (7-eleven title, 2026-05-26) → primary: BleepingComputer May 26 article → corroborating: CyberInsider May 26 + SecurityAffairs May 18 original disclosure"
    summary: |
      7-Eleven has confirmed a data breach affecting over 183,000–185,000 franchise applicants following ShinyHunters' claimed April 2026 intrusion into the company's Salesforce-connected recruiting systems. The confirmed breach — disclosed by 7-Eleven through notification letters and reflected in the Have I Been Pwned breach notification service — involves personally identifiable information submitted during franchise application processes, including full names, Social Security numbers, driver's licence numbers, and government-issued identification. 7-Eleven stated that an unauthorised third party gained access to certain systems used to store franchisee documents on or around April 8, 2026, and that retail operations, customer data, and payment systems were not affected. Affected individuals receive complimentary credit monitoring and identity protection services. This is a material update from the prior brief's coverage of the ShinyHunters 600,000-record claim (2026-05-24): the confirmed breach count (185,000) relates specifically to franchise applicant PII with high-value identity fields (SSNs), while the earlier 600k figure covered broader Salesforce CRM records including corporate data.

      Defender notes: The compromise of a Salesforce-connected recruiting/HR platform follows the same Aura misconfiguration pattern documented in the ShinyHunters campaign brief — privileged credential access or guest-profile misconfiguration in a third-party SaaS integration. Security teams using Salesforce for recruiting or franchise management should audit the object-level permissions on recruiting-specific record types, ensure SSNs and government ID fields are restricted to named users only (not guest profiles), and review which users have export/report-run permission on identity-heavy objects. HIBP notification integration is a useful downstream detective control for confirmed credential exposure.
    ch_eu_nexus: "global; attack methodology directly applicable to Salesforce Experience Cloud tenants operated by EU/CH firms"
    public_sector_nexus: "indirect"
    sector: "retail, consumer services"
