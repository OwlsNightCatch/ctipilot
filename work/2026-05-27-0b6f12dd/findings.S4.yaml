      MITRE ATT&CK: T1078.004 (Valid Accounts: Cloud Accounts), T1530 (Data from Cloud Storage Object), T1213.003 (Data from Information Repositories: Cloud Object).

  - title: "Lithuania Centre of Registers: 600,000 state-registry records stolen by suspected foreign intelligence actor via abused institutional credentials"
    sources:
      - url: "https://therecord.media/lithuania-investigates-theft-of-state-records"
        publisher: "The Record (Recorded Future News)"
        date: "2026-05-26"
        role: "primary"
      - url: "https://www.securityweek.com/lithuania-suspects-foreign-involvement-in-data-leak-of-over-600000-national-register-entries/"
        publisher: "SecurityWeek"
        date: "2026-05-26"
        role: "corroborating"
      - url: "https://www.euronews.com/2026/05/25/lithuania-warns-mass-data-leak-was-work-of-foreign-country"
        publisher: "Euronews"
        date: "2026-05-25"
        role: "corroborating"
    discovery_trace: "first seen at: The Record RSS feed (2026-05-26, therecord.media/feed) → primary: The Record full article May 26 → corroborating: SecurityWeek May 26 + Euronews May 25"
    summary: |
      Lithuania's Prosecutor General's Office disclosed on 2026-05-22/26 that attackers gained unauthorised access to more than 600,000 records from the Centre of Registers — the state agency managing property and legal entity data — between early April and the disclosure date. The attack method was credential abuse: attackers obtained and misused login credentials issued to institutions authorised to query the Real Estate Register and Register of Legal Entities databases, originating the connections from systems of foreign-administered infrastructure. Exfiltrated data includes names, dates of birth, national ID numbers, property addresses, cadastral numbers, and registry identifiers; contact details, bank accounts, and payment data were not in the stolen set. Opposition politician Laurynas Kasciunas (former Defence Committee chairman) publicly alleged the hallmarks of a Russian intelligence operation, though Lithuanian prosecutors have not officially named a specific country. The head of the State Enterprise Centre of Registers resigned within days of the disclosure. Financial damage estimates stand at more than €111,000 for the institution's response costs, not including downstream impact of identity data exposure. Immediate mitigations applied: blocking suspected institutional accounts, credential resets, access restriction with forced re-authentication.

      Significance for EU defenders: This is a nation-state-pattern attack against property and corporate-entity registers — data with high dossier value for intelligence targeting (locating addresses of intelligence officers, diplomats, military personnel). The same register architecture exists across all EU member states; comparable attacks on cadastral and land-registry APIs were previously seen against Slovakia and Ukraine (cross-refs in The Record article). Credential-based API access to government register systems requires strong controls: per-institution API keys with narrow query-rate limits, MFA on all institutional service accounts, anomaly detection on query volume and IP-range changes (institutional accounts should originate from known ASNs), and audit logs retained for at least 12 months. Detection hunt target: bulk-query patterns against register APIs from institutional accounts outside normal business hours or from ASNs inconsistent with the institution's prior access pattern.
    ch_eu_nexus: "EU Baltic state public-sector victim; direct relevance to Swiss and EU land-registry and corporate-registry operators; Russia-suspected hybrid-warfare context"
    public_sector_nexus: "direct — government agency victim; property and legal entity registers"
    sector: "government, public administration"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Attackers gained unauthorized access to more than 600,000 records managed by the Centre of Registers, the state agency responsible for handling property and legal entity records."
        attribution: "The Record (Recorded Future News)"
        source_url: "https://therecord.media/lithuania-investigates-theft-of-state-records"
      - quote: "The breach involved the misuse of login credentials assigned to institutions authorized to access the databases, and likely originated from an unnamed foreign country."
        attribution: "SecurityWeek"
        source_url: "https://www.securityweek.com/lithuania-suspects-foreign-involvement-in-data-leak-of-over-600000-national-register-entities/"
      - quote: "Lithuanian Defence Minister Robertas Kaunas characterized incidents as 'the new reality of what the Baltic states face'."
        attribution: "Euronews"
        source_url: "https://www.euronews.com/2026/05/25/lithuania-warns-mass-data-leak-was-work-of-foreign-country"
    extended_notes: |
      Related prior incidents in same class: Slovakia's land register cyberattack (The Record cross-ref), Ukraine's state registers attack (restored after intrusion, cited by The Record). Pattern: nation-state actors systematically targeting European cadastral/property/corporate register systems to build targeting dossiers on personnel of interest (intelligence, military, diplomatic community).
      MITRE ATT&CK: T1078.001 (Valid Accounts: Default Accounts — institutional credential abuse), T1530 (Data from Cloud Storage Object), T1078 (Valid Accounts).
      Lithuania's Centre of Registers chief Adrijus Jusas resigned on or around 2026-05-26, indicating acknowledgment of systemic security governance failure at board/executive level.

  - title: "The Oncology Institute (NASDAQ: TOI) files SEC 8-K Item 1.05 — third-party vendor breach exposes patient data; probable TriZetto/Cognizant connection"
    sources:
      - url: "https://www.securityweek.com/oncology-institute-discloses-third-party-data-breach/"
        publisher: "SecurityWeek"
        date: "2026-05-25"
        role: "primary"
      - url: "https://www.sec.gov/Archives/edgar/data/1799191/000107997326000721/toi_8k.htm"
        publisher: "SEC EDGAR (The Oncology Institute 8-K)"
        date: "2026-05-22"
        role: "primary (official filing)"
    discovery_trace: "first seen at: SEC EDGAR bridge subcommand `sec-edgar 8k 2026-05-20 2026-05-27 1.05` → filing_url index returned → corroborated via SecurityWeek May 25 article"
    summary: |
      The Oncology Institute, Inc. (NASDAQ: TOI) filed a Form 8-K under Item 1.05 (Material Cybersecurity Incident) on 2026-05-22, disclosing that on 2026-05-20 Kroll (acting as administrator for a third-party software vendor) notified the company of unauthorised access to certain information systems that included patient data. The vendor is not named in the 8-K; SecurityWeek identifies TriZetto Provider Solutions (a Cognizant-owned healthcare technology firm) as the probable vendor based on timeline correlation with a broader TriZetto breach reported in March 2026 that affected approximately 3.4 million individuals across multiple healthcare providers. The Oncology Institute previously disclosed an initial vendor incident under a separate 8-K in November 2025. Operations continued uninterrupted per the company's technology security and continuity plan. Data categories were not itemised in the filing; credit monitoring is being offered to impacted patients. The incident's dual-disclosure structure (HIPAA plus SEC Item 1.05) creates simultaneous obligations to HHS and SEC, reflecting the intersection of HIPAA Breach Notification and SEC cyber-disclosure rules for public healthcare companies.

      Defender notes for EU/CH healthcare organisations using third-party RCM/eligibility vendors: TriZetto/similar RCM platforms aggregate high-sensitivity patient PII (names, SSNs, insurance eligibility data, treatment codes) across dozens of provider systems. Vendor risk controls should include: dedicated data-processing agreements restricting onward sub-processor access, regular penetration tests of vendor API integrations, contractual right to audit vendor security controls, and MFA enforcement on all vendor administrative portals. SEC Item 1.05 obligations now create US disclosure precedent that influences EU/CH analogues (NIS2 Article 23 significant incident reporting, GDPR 72-hour DPA notification).
    ch_eu_nexus: "US healthcare sector; relevant as cross-sector reference for third-party RCM vendor risk in EU/CH healthcare"
    public_sector_nexus: "indirect"
    sector: "healthcare, oncology"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "The Oncology Institute disclosed a cybersecurity incident affecting a third-party software vendor that compromised patient information. Evidence suggests TriZetto Provider Solutions (Cognizant-owned) as the likely vendor, affecting multiple healthcare providers and approximately 3.4 million individuals."
        attribution: "SecurityWeek"
        source_url: "https://www.securityweek.com/oncology-institute-discloses-third-party-data-breach/"
      - quote: "On May 20, 2026, Kroll, who is the third-party administrator for the Vendor, notified the Company that the Vendor had detected unauthorized access by a third party to certain information systems of the Company, including systems affecting data of patients."
        attribution: "SEC EDGAR / The Oncology Institute 8-K (via StockTitan)"
        source_url: "https://www.sec.gov/Archives/edgar/data/1799191/000107997326000721/toi_8k.htm"
    extended_notes: |
      Note on TriZetto identification: SecurityWeek makes this attribution based on timeline correlation (TriZetto breach began November 2024, impacted ~3.4M patients per a separate disclosure); the 8-K does not name the vendor. Report with MEDIUM confidence pending vendor confirmation.
      The dual filing structure (Item 1.05 + prior Item 8.01) reflects the practice documented in the Debevoise tracker: initial uncertainty filing under 8.01, later materialisation determination triggering 1.05.

