  - title: "Five-year database-ransom census: 46% of 65,907 exposed databases carry ransom markers; MongoDB/MySQL hit near-universally; 62% of attacker wallets received nothing [SINGLE-SOURCE]"
    sources:
      - url: "https://ransomnews.com/database-ransom-economics-2026/"
        publisher: "Ransomnews Research Team"
        date: "2026-05-26"
        role: "primary"
      - url: "https://securityaffairs.com/192711/cyber-crime/the-hidden-ransomware-economy-running-on-exposed-databases.html"
        publisher: "Security Affairs"
        date: "2026-05-26"
        role: "corroborating"
    discovery_trace: "first seen at: securityaffairs feed https://securityaffairs.com/feed, URL https://securityaffairs.com/192711/cyber-crime/the-hidden-ransomware-economy-running-on-exposed-databases.html → primary: Ransomnews Research, URL https://ransomnews.com/database-ransom-economics-2026/"
    summary: |
      The Ransomnews Research Team published on 2026-05-26 a five-year longitudinal census (May 2021 – May 13, 2026) of 65,907 exposed databases on the public internet across MongoDB, MySQL, Elasticsearch, Kibana, and HTTP admin panels. Key findings: 30,515 (46.3%) already carried ransom or wipe markers; 215+ billion records collectively compromised. Of 514 attacker bitcoin wallets traced on-chain, 318 (62%) received zero BTC payments; total confirmed revenue across all wallets was only 9.78 BTC (~$753K), with the top 10 wallets capturing 43% of that sum. Compromise rates are near-universal for directly exposed database services: MongoDB 99.8% (3,525/3,532), MySQL 99.96% (2,930/2,931), Elasticsearch ~98%. Attack methodology is highly automated: one wallet appeared in exactly 1,283 identical ransom notes (demand: 0.01 BTC each) across 49 countries over a 31-month run — "That's not a negotiation operation. It's a script." Geographic distribution of compromised hosts: China (11,874), United States (4,194), Germany, France, India, Singapore, South Korea. The dominant ransom note families are read_me_to_recover (17,908 systems) and btc_ransom_note (14,714 systems). Attackers delete data rather than encrypt it; payment does not restore access. The study represents operationally significant awareness for Swiss and EU public-sector entities operating self-managed database infrastructure, particularly in cantonal administration and SME cloud deployments.
    ch_eu_nexus: "direct — Germany and France in top-5 compromised countries; EU self-hosted database exposure is significant"
    public_sector_nexus: "indirect — self-managed database infrastructure in public-sector IT common attack surface"
    sector: "all sectors with internet-exposed database services"
    cves: []
    actors_campaigns_malware: ["read_me_to_recover", "btc_ransom_note"]
    verification: SINGLE-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "Mass database extortion is industrial, automated, mostly unpaid, and still doing enormous damage. Of 514 distinct attacker wallets identified, 318 (62%) received zero bitcoin payments."
        attribution: "Ransomnews Research Team"
        source_url: "https://ransomnews.com/database-ransom-economics-2026/"
      - quote: "MongoDB: 3,525/3,532 (99.8%) hit; MySQL: 2,930/2,931 (99.96%) hit. Geographic distribution: China (11,874), United States (4,194), Germany, France, India, Singapore, South Korea, Russia, Hong Kong, Canada"
        attribution: "Ransomnews Research Team (via Security Affairs)"
        source_url: "https://securityaffairs.com/192711/cyber-crime/the-hidden-ransomware-economy-running-on-exposed-databases.html"
    extended_notes: |
      SINGLE-SOURCE caveat: the Ransomnews Research Team appears to be a small independent research organisation; their methodology and data have not been independently reproduced by a second organisation. Security Affairs covered the study but did not independently verify the data. Classified as MEDIUM confidence accordingly. Defender takeaway: any MongoDB, MySQL, Elasticsearch, or similar database service with a public IP is essentially certain to be ransomed if not auth-gated at the network layer. Hardening: never expose database ports (27017/TCP MongoDB, 3306/TCP MySQL, 9200/TCP Elasticsearch) to the internet; enforce VPN or private network access; enable authentication on all database services (MongoDB auth is disabled by default in many configurations); audit Shodan/Censys exposure. Detection: monitor for unexpected ransom-note files (read_me_to_recover, WARNING.txt, HACKED) appearing in database data directories.

