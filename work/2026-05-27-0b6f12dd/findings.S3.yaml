    summary: |
      CVE-2026-45659 (CWE-502 Deserialization of Untrusted Data, CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H = 8.8, MSRC severity Important) is a remote code execution vulnerability in Microsoft Office SharePoint Server affecting SharePoint Server Subscription Edition, SharePoint Server 2019, and SharePoint Enterprise Server 2016. Any authenticated attacker holding minimum Site Member permissions (PR:L) can send a crafted network request that causes the server to deserialise untrusted data, resulting in code execution. No administrator or elevated privileges required; AC:L meaning no specialised prior knowledge needed. Not currently exploited in the wild; MSRC rating "Exploitation Less Likely." Patch released as part of May 2026 Patch Tuesday (KB5002863 for Subscription Edition, KB5002870 for SharePoint 2019, KB5002868 for SharePoint 2016/Enterprise 2016). No workaround available; patch is the only remediation. The MSRC advisory was revised on 2026-05-26 (latestRevisionDate), with the THN and Dark Reading coverage appearing the same day.
