    discovery_trace: "first seen at: hackernews(rss) feed https://feeds.feedburner.com/TheHackersNews, URL https://thehackernews.com/2026/05/iranian-hackers-deploy-minifast-and.html → pivot: Check Point Research feed https://research.checkpoint.com/feed → primary: Check Point Research article, URL https://research.checkpoint.com/2026/fast-and-furious-nimbus-manticore-operations-during-the-iranian-conflict/"
    summary: |
      Check Point Research published on 2026-05-22 a detailed analysis of three Nimbus Manticore (UNC1549 / Screening Serpens, IRGC-affiliated) campaign waves from February–April 2026, following Operation Epic Fury (US-Israeli military action, February 28, 2026). Wave 1 (February): phishing with OnlyOffice-hosted ZIP archives containing trojanized installers impersonating aviation/software job opportunities. Wave 2 (February–March, Operation Epic Fury): trojanized Zoom installers and fake airline career portals; introduced AppDomain Hijacking (T1574.008) — legitimate .NET applications' XML .config files redirected AppDomainManager to malicious DLLs; Zoom-task hijacking: malware monitored for legitimate Zoom scheduled task creation (format ZoomUpdateTaskUser-<SID>) and hijacked it for persistence (T1053.005) instead of creating suspicious new tasks. Wave 3 (April): SEO poisoning (T1598.003) via fake SQL Developer download domain ranked on Bing/DuckDuckGo through link-based reputation manipulation. MiniFast (aka MiniUpdate): 64-bit Windows PE DLL, single export CheckForUpdates, JSON-format HTTP C2 with API-style endpoints (/rg POST for handshake, /agent/init POST registration, /agent/poll?token= GET, /agent/result POST, /upload/ PUT exfil, /files/ GET download), 14 command opcodes including 0x0B DLL injection, 0xB0 UAC elevation, 0xB1 persistence via WindowsSecurityUpdate scheduled task, 0xF0 poll-interval adjustment. Chrome UA: Mozilla/5.0 (Windows NT 10.0; Win64; x64)...Chrome/146.0.0.0. String obfuscation: ROT13 + string reversal. Loader chain: InitInstall.dll/uevmonitor.dll (fake progress + real installer) → Updater.dll (validates parent=svchost.exe, process=update.exe) → MiniFast (UpdateChecker.dll). Abused code-signing certificates from "Gray Matter Software S.R.L." and "Kirubel Kerie Negeya" (both SSL.com-issued). Targets: aviation, defense, telecoms, software development; US, Europe, Middle East.
    ch_eu_nexus: "direct — Europe explicitly named as target geography; aviation, defense, telecoms in scope for Swiss and EU operators"
