        attribution: "Check Point Research"
        source_url: "https://research.checkpoint.com/2026/fast-and-furious-nimbus-manticore-operations-during-the-iranian-conflict/"
    extended_notes: |
      This is an UPDATE to the May 23 coverage of UNC1549/Screening Serpens by Unit 42 (AppDomainManager hijacking, 6 new RATs). Check Point Research adds material delta: MiniFast's detailed C2 protocol (API opcode table), the Zoom task-hijacking persistence technique, the three-wave campaign structure keyed to Operation Epic Fury timing, and SEO poisoning as a new delivery vector not covered in the Unit 42 analysis. MITRE ATT&CK: T1574.008 Hijacking Execution Flow (AppDomain), T1053.005 Scheduled Task, T1566.002 Phishing, T1598.003 Phishing for Information via Search Engines. Detection: monitor .config files in .NET application directories for non-default AppDomainManager values; alert on ZoomUpdateTaskUser-* scheduled task modifications by non-Zoom processes; hunt for UpdateChecker.dll in AppData\Local\Packages\ or similar; watch for HTTP POST to /rg and /agent/init endpoints with Chrome/146 UA from non-browser processes. Hardening: block execution from user-writable AppData paths via AppLocker; mark ZoomUpdateTaskUser-* task ownership as protected; enable ASR rule to block Office from creating child processes.

