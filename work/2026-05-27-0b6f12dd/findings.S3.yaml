  - title: "Elastic Security Labs: Tycoon 2FA AiTM detection engineering — two-tier operator architecture, post-March-2026-takedown variant adoption of OAuth device-code flows"
    sources:
      - url: "https://www.elastic.co/security-labs/tycoon-2fa-aitm-detection-engineering"
        publisher: "Elastic Security Labs"
        date: "2026-05-26"
        role: "primary"
      - url: "https://www.esentire.com/blog/tycoon-2fa-operators-adopt-oauth-device-code-phishing"
        publisher: "eSentire"
        date: "2026-04"
        role: "corroborating"
    discovery_trace: "first seen at: elastic-seclabs RSS feed https://elastic.co/security-labs/feed → primary: Elastic Security Labs article, URL https://www.elastic.co/security-labs/tycoon-2fa-aitm-detection-engineering"
    summary: |
      Elastic Security Labs published on 2026-05-26 a detection engineering deep-dive on Tycoon 2FA, currently the most prolific AiTM phishing-as-a-service kit. After a March 2026 coordinated takedown (led by Microsoft and Europol, 300+ domains seized), operators adapted within weeks and by late April 2026 combined Tycoon tradecraft with OAuth Device Code phishing flows (documented by eSentire). The kit currently operates in two structural variants: a WebSocket AiTM reverse-proxy variant (the "classic" Tycoon 2FA flow that intercepts the post-MFA session cookie in real time) and a device-code-grant abuse variant (Microsoft-only) that leverages the Microsoft Authentication Broker client ID 29d9ed98-a469-4536-ade2-f981bc1d605e to obtain and replay Primary Refresh Tokens. The operator architecture splits across two distinct tiers: Tier 1 (Kit Relay) using cloud-VPS egress IPs with Node.js / Axios / undici user agents for token acquisition, and Tier 2 (Operator Console) using residential-shaped ISP egress with a fixed browser UA for post-compromise Graph API enumeration. The cross-tier durable signal is two distinct ASNs authenticating as the same principal within minutes sharing the same c_sid. Post-compromise Graph API enumeration targets transitiveRoleAssignments, tenantRelationships/getResourceTenants (cross-tenant lateral-movement prep), contact harvesting, and subscribedSkus within 30-60 seconds (20-30+ calls across 4+ recon categories). Elastic published six detection rules for Entra ID and four for Google Workspace, including an ES|QL "Microsoft Graph Multi-Category Reconnaissance Burst" rule. Critical detection gap: Entra ID Identity Protection may not flag kit infrastructure due to rotating IPs, and the risk engine has been observed marking victims as "aiConfirmedSafe" after flagging anomalousToken. Elastic Workflows response automation can disable the account, delete device principals, revoke sessions, and open a Kibana case in under 10 seconds — inside the 10-20 minute kit-to-operator handoff window.
    ch_eu_nexus: "global; EU public-sector organisations using M365/Entra ID or Google Workspace are primary targets given Tycoon 2FA reached 500,000 organisations monthly at peak"
    public_sector_nexus: "direct — EU government and education tenants use Entra ID; kit operators targeting high-value accounts"
    sector: "all sectors with M365 or Google Workspace"
    cves: []
    actors_campaigns_malware: ["Tycoon 2FA", "Storm-1747"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Despite a coordinated takedown in March 2026 led by Microsoft and Europol, with support from Cloudflare, SpyCloud, eSentire, and other partners that seized over 300 domains, operators adapted within weeks. By late April 2026, eSentire documented campaigns combining Tycoon tradecraft with OAuth Device Code phishing flows"
        attribution: "Elastic Security Labs"
        source_url: "https://www.elastic.co/security-labs/tycoon-2fa-aitm-detection-engineering"
      - quote: "Two distinct ASNs (one cloud-VPS, one residential-shaped) authenticating as the same user principal within minutes. Single-ASN rules catch one tier; the cross-tier pivot is the high-confidence indicator."
        attribution: "Elastic Security Labs"
        source_url: "https://www.elastic.co/security-labs/tycoon-2fa-aitm-detection-engineering"
      - quote: "Identity Protection may not flag kit infrastructure due to rotating IPs; Risk engine flagged anomalousToken but later marked users as aiConfirmedSafe, creating false negatives"
        attribution: "Elastic Security Labs"
        source_url: "https://www.elastic.co/security-labs/tycoon-2fa-aitm-detection-engineering"
    extended_notes: |
      Detection specifics for Entra ID: monitor Sign-in logs for 'node', 'axios', 'undici', 'node-fetch' UAs paired with Microsoft Authentication Broker (client ID 29d9ed98-a469-4536-ade2-f981bc1d605e); device-registration events using non-standard UAs (not 'Dsreg', 'DeviceRegistrationClient', 'Dalvik'); token-type progression incomingTokenType:none -> refreshToken -> primaryRefreshToken. For Google Workspace: Admin SDK login_success events within ~1 second across multiple relay IPs; OAuth token.authorize for Chrome client 77185425430.apps.googleusercontent.com followed by DEVICE_REGISTER_UNREGISTER_EVENT within 0.6-1.2s; scope https://www.google.com/accounts/OAuthLogin. Hardening: enable Microsoft Token Protection (Conditional Access); require compliant/managed devices for sensitive resource access; configure Authentication Methods policies to block OAuth Device Code flow for users who do not need it.

  - title: "MuddyWater (Seedworm/MOIS) DLL side-loading campaign against industrial, public-sector and education targets across 9 countries in Q1 2026"
    sources:
      - url: "https://www.security.com/threat-intelligence/iran-seedworm-electronics"
        publisher: "Symantec / Broadcom Threat Hunter Team"
        date: "2026-05-12"
        role: "primary"
      - url: "https://thehackernews.com/2026/05/muddywater-uses-dll-side-loading-in.html"
        publisher: "The Hacker News"
        date: "2026-05-26"
        role: "corroborating"
