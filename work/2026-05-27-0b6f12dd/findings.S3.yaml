        role: "corroborating"
    discovery_trace: "first seen at: hackernews(rss) feed https://feeds.feedburner.com/TheHackersNews, URL https://thehackernews.com/2026/05/muddywater-uses-dll-side-loading-in.html → primary: Symantec / Broadcom blog, URL https://www.security.com/threat-intelligence/iran-seedworm-electronics (published 2026-05-12)"
    summary: |
      Broadcom's Symantec Threat Hunter Team reported on 2026-05-12 a Q1 2026 MuddyWater (Seedworm, also tracked as MOIS-affiliated UNC5866, Cotton Sandstorm, Cobalt Obelisk) espionage campaign targeting at least nine organisations across nine countries and four continents, including a major South Korean electronics manufacturer, a Middle Eastern airport, Southeast Asian manufacturers, and a Latin American financial provider. Sectors: industrial and electronics manufacturing, education, public sector, financial services, professional services. The campaign weaponised two DLL side-loading pairs using legitimately signed vendor binaries: (1) fmapp.exe (Fortemedia audio driver utility) → malicious fmapp.dll; (2) sentinelmemoryscanner.exe (SentinelOne endpoint component) → malicious sentinelagentcore.dll. Both malicious DLLs loaded ChromElevator (open-source T1539 tool from github.com/xaitax/Chrome-App-Bound-Encryption-Decryption) to steal passwords, cookies, and payment card data from Chromium-based browsers by bypassing Chrome App-Bound Encryption. A Node.js-based implant orchestrated PowerShell payloads for reconnaissance, screenshot capture (T1113), SAM hive theft (T1003), access token manipulation (T1134), account discovery (T1087), and SOCKS5 reverse-proxy tunnelling (T1090) via proxychains with Axel. Data staging used the public file-transfer service sendit.sh for exfiltration. A bespoke C++ tool named FileFiend handled file collection. Campaign reflects "improved operational hygiene" per Symantec — implant-driven, low noise, week-long dwell time at the South Korean victim in February 2026.
    ch_eu_nexus: "global; public-sector and education targets directly in scope; EU Council sanctions against three MOIS-linked entities issued March 2026 contextualise threat level for European defenders"
    public_sector_nexus: "direct — public-sector bodies explicitly named as target sector"
    sector: "industrial manufacturing, education, public sector, financial services"
    cves: []
    actors_campaigns_malware: ["MuddyWater", "Seedworm", "UNC5866", "Cotton Sandstorm", "Cobalt Obelisk", "ChromElevator", "FileFiend"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Seedworm used legitimate fmapp.exe (Fortemedia audio-driver utility) to sideload malicious fmapp.dll containing ChromElevator, described as capable of stealing passwords, cookies, and payment card data from Chromium-based browsers"
        attribution: "Symantec / Broadcom Threat Hunter Team"
        source_url: "https://www.security.com/threat-intelligence/iran-seedworm-electronics"
      - quote: "The activity targeted industrial and electronics manufacturing, education and public-sector bodies, financial services, and professional services, per the Threat Hunter Team from Symantec and Carbon Black"
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/05/muddywater-uses-dll-side-loading-in.html"
    extended_notes: |
      MITRE ATT&CK: T1574.002 DLL Side-Loading, T1113 Screen Capture, T1003 OS Credential Dumping, T1134 Access Token Manipulation, T1090 Proxy, T1087 Account Discovery, T1539 Steal Web Session Cookie. Detection: monitor for fmapp.exe, sentinelmemoryscanner.exe loaded from unexpected directories spawning child processes or loading unsigned DLLs (Sysmon EID 7 ImageLoad with unsigned/untrusted signers); alert on Node.js runtime (node.exe) spawning PowerShell; watch for sendit.sh or similar public file-transfer domains in proxy/DNS logs as staging destination. Hardening: block LOLBin-assisted side-loading via AppLocker/WDAC rules constraining which parent processes can load DLLs; deploy Chrome App-Bound Encryption auditing to detect bypass attempts. Note: Symantec primary published 2026-05-12 (15 days before window); THN restatement published in-window 2026-05-26; no fresh exploitation evidence in window.

