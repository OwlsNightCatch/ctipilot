        attribution: "Arctic Wolf"
        source_url: "https://arcticwolf.com/resources/blog/forticlient-ems-exploited-via-cve-2026-35616-to-deliver-ekz-infostealer-disguised-as-a-fortinet-patch/"
      - quote: "The vulnerability allows unauthenticated network access to privileged API endpoints by spoofing the X-SSL-CLIENT-VERIFY header"
        attribution: "Arctic Wolf"
        source_url: "https://arcticwolf.com/resources/blog/forticlient-ems-exploited-via-cve-2026-35616-to-deliver-ekz-infostealer-disguised-as-a-fortinet-patch/"
    extended_notes: |
      MITRE ATT&CK: T1190 (Exploit Public-Facing Application), T1071.001 (Web Protocols C2), T1555.003 (Credentials from Web Browsers), T1078 (Valid Accounts via stolen credentials). The credential-theft chain from a network device management platform to browser credential stores represents a significant lateral movement enabler. Defenders should also check whether EMS push notifications to FortiClient endpoints have been abused to establish persistence on Windows hosts (T1543.003 Windows Service, T1547.001 Registry Run Keys).

  - title: "GitLab 19.0.1 / 18.11.4 / 18.10.7 patch cluster — Duo AI identity impersonation + unauthenticated project enumeration"
