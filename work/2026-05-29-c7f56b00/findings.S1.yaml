  - title: "JINX-0164 cryptocurrency-sector intrusions — LinkedIn lures, macOS malware, CI/CD hijacking"
    sources:
      - url: "https://www.wiz.io/blog/threat-actors-target-crypto-orgs"
        publisher: "Wiz Research"
        date: "2026-05-27"
        role: "primary"
      - url: "https://thehackernews.com/2026/05/jinx-0164-targets-cryptocurrency-firms.html"
        publisher: "The Hacker News"
        date: "2026-05-28"
        role: "corroborating"
    discovery_trace: "first seen at: wiz-blog feed → pivot: Wiz Research blog post (primary), URL https://www.wiz.io/blog/threat-actors-target-crypto-orgs → corroborating: THN article 2026-05-28"
    summary: |
      Wiz Research tracks a cluster designated JINX-0164 conducting targeted intrusions against cryptocurrency organisations since at least early 2026. The initial access vector is LinkedIn-based social engineering: fake recruiter profiles contact developers and security engineers with plausible job offers, then direct targets to complete a coding challenge that involves cloning a malicious repository or running a provided binary. On macOS systems, the payload presents as a legitimate developer tool (coreaudiod, ChromeUpdater) and installs a LaunchDaemon for persistence (T1543.004). The malware targets CI/CD environments specifically: it reads GitHub Actions secrets, Kubernetes service-account tokens, and cloud-provider credentials from ~/.aws, ~/.config/gcloud, and similar standard paths. Secondary payload AUDIOFIX performs credential theft from browser credential stores (Chrome, Brave, Firefox), password managers (1Password, Bitwarden desktop clients), iCloud Keychain, and SSH key stores, then exfiltrates via encrypted HTTPS channels. Wiz notes TTP overlap with known North Korea-attributed clusters (fake IT worker + developer lure pattern, targeting of crypto organisations) but stops short of definitive attribution. The EU-nexus is emerging: Wiz identifies two European cryptocurrency exchanges as among targeted organisations. Detection: LinkedIn-recruited developer sessions that immediately clone repos and execute binaries; unusual LaunchDaemon plist creation by developer processes (macOS Unified Logs, process-creation telemetry); egress of ~/.aws or ~/.kube/config outside normal CI/CD pipeline execution; GitHub Actions workflow runs triggered outside expected schedule or by unexpected actors.
    ch_eu_nexus: "EU-relevant; two European cryptocurrency exchanges identified as targets; Swiss crypto sector (Crypto Valley) exposure"
    public_sector_nexus: "indirect — Swiss crypto regulation infrastructure and national digital-currency R&D programmes"
    sector: "finance, crypto"
    cves: []
    actors_campaigns_malware: ["JINX-0164", "AUDIOFIX"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "JINX-0164 targets cryptocurrency companies through LinkedIn recruitment lures, deploying macOS-specific malware with CI/CD credential theft capabilities"
        attribution: "Wiz Research"
        source_url: "https://www.wiz.io/blog/threat-actors-target-crypto-orgs"
      - quote: "The campaign shows TTP overlap with North Korean threat actors targeting cryptocurrency organizations, including the fake developer recruitment pattern"
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/05/jinx-0164-targets-cryptocurrency-firms.html"
    extended_notes: |
      MITRE ATT&CK: T1566.003 (Spearphishing via Service — LinkedIn), T1204.002 (User Execution — malicious binary), T1543.004 (Launch Daemon persistence), T1555 (Credentials from Password Stores), T1552.001 (Unsecured Credentials — files), T1071.001 (Web Protocols C2). The CI/CD hijacking component is particularly high-impact: once a threat actor controls GitHub Actions secrets and cloud credentials, they can pivot from one compromised developer's machine to production infrastructure without needing further exploits.

  - title: "The Gentlemen ransomware (Storm-2697) technical dissection — self-propagating Go encryptor, GPO spread"
    sources:
      - url: "https://www.microsoft.com/en-us/security/blog/2026/05/28/the-gentlemen-ransomware-dissecting-a-self-propagating-go-encryptor/"
        publisher: "Microsoft Security Blog"
        date: "2026-05-28"
        role: "primary"
    discovery_trace: "first seen at: msft-secblog feed → primary: Microsoft Security Blog 2026-05-28, URL https://www.microsoft.com/en-us/security/blog/2026/05/28/the-gentlemen-ransomware-dissecting-a-self-propagating-go-encryptor/ — UPDATE to W21 weekly coverage"
    summary: |
      Microsoft published a full technical dissection of The Gentlemen ransomware (operator cluster Storm-2697) on 2026-05-28, providing significant new technical depth beyond the victim-list reporting in the W21 weekly brief. Key findings: the encryptor is written in Go (cross-platform packaging), compiled for Windows as a single-binary executable. Self-propagation mechanism: the binary creates a hidden SMB share named `share` under `C:\Temp`, then uses a configurable `--spread` argument to attempt authenticated (Pass-the-Hash / current session) and unauthenticated (null-session) SMB connections to adjacent hosts discovered via ARP and NetBIOS. GPO propagation: on domain-joined systems with Domain Admin credentials (obtained via LSASS dump or AS-REP roasting), the binary creates a Group Policy Object that deploys itself to all OUs. Encryption: per-file ephemeral key generation (asymmetric key-exchange for the session key, symmetric encryption per file), which eliminates bulk-decryption shortcuts. Ransom note delivery is via an HTML file written to the Desktop. Storm-2697 has claimed 320+ victims in 2026 Q1-Q2, primarily in manufacturing, logistics, and healthcare in Western Europe and North America. Detection: Sysmon EID 5 (process terminated — encryptor self-deletes after execution), EID 17/18 (named-pipe connections for SMB lateral movement enumeration), Windows Event 5140 (network share accessed — the hidden `share` share), GPO creation events in Active Directory (Event ID 5136 + GPMC audit), LSASS access by non-LSA processes (EID 10 Sysmon or EDR telemetry). Hardening: enforce SMB signing (GPO Network security: Microsoft network client/server: Digitally sign communications always), restrict GPO creation rights to dedicated accounts, enable Credential Guard to protect LSASS.
    ch_eu_nexus: "EU-relevant; Western European manufacturing and healthcare sector victims documented by Microsoft"
    public_sector_nexus: "indirect — healthcare and logistics sector victims; potential Swiss critical-infrastructure exposure"
    sector: "healthcare, manufacturing, logistics"
    cves: []
    actors_campaigns_malware: ["The Gentlemen", "Storm-2697"]
    verification: "SINGLE-SOURCE"
    confidence: HIGH
    novelty: "update-to-prior:2026-05-23"
    evidence:
      - quote: "The Gentlemen ransomware uses a self-propagating Go-based encryptor that creates a hidden SMB share and leverages GPO deployment to spread across domain-joined networks"
        attribution: "Microsoft Security Blog"
        source_url: "https://www.microsoft.com/en-us/security/blog/2026/05/28/the-gentlemen-ransomware-dissecting-a-self-propagating-go-encryptor/"
      - quote: "Storm-2697 has claimed over 320 victims in 2026, primarily in Western European manufacturing, logistics, and healthcare"
        attribution: "Microsoft Security Blog"
        source_url: "https://www.microsoft.com/en-us/security/blog/2026/05/28/the-gentlemen-ransomware-dissecting-a-self-propagating-go-encryptor/"
    extended_notes: |
      MITRE ATT&CK: T1486 (Data Encrypted for Impact), T1570 (Lateral Tool Transfer via SMB), T1021.002 (Remote Services: SMB/Windows Admin Shares), T1484.001 (Domain Policy Modification: Group Policy), T1003.001 (OS Credential Dumping: LSASS Memory), T1558.004 (Steal or Forge Kerberos Tickets: AS-REP Roasting). The GPO spread vector is the highest-severity technique class here — once a ransomware operator achieves Domain Admin, GPO-delivered encryption is effectively unstoppable without pre-positioned detection. Swiss SOC teams should validate that GPMC audit events (5136) and GPO-linked OU changes are monitored and alerted.

  - title: "BTMOB Android RAT targets Spanish and Portuguese banking via HTML injection and accessibility service abuse"
    sources:
      - url: "https://www.welivesecurity.com/en/malware/btmob-stealthy-rat-burrowing-deep-android-devices/"
        publisher: "ESET WeLiveSecurity"
        date: "2026-05-26"
        role: "primary"
    discovery_trace: "first seen at: WebSearch (BTMOB RAT ESET 2026) → primary: ESET WeLiveSecurity article 2026-05-26, URL https://www.welivesecurity.com/en/malware/btmob-stealthy-rat-burrowing-deep-android-devices/"
    summary: |
      ESET published analysis of BTMOB, an Android-based Remote Access Trojan distributed as Malware-as-a-Service (MaaS) targeting banking customers in Spain and Portugal, published 2026-05-26. Distribution is via phishing sites and side-loaded APKs impersonating banking and logistics apps. Once installed, BTMOB requests Accessibility Service permissions and uses them to perform HTML injection into the legitimate banking app's WebView, overlaying fake login pages to harvest credentials and OTPs (T1417.002 — Input Capture: GUI Input Capture). The RAT also implements full keylogging, screen recording on demand, and call interception. Persistence is achieved via a boot broadcast receiver (BOOT_COMPLETED intent). C2 communication uses WebSocket over port 443 with a custom binary framing protocol designed to evade mobile network-layer inspection. ESET notes that BTMOB's MaaS infrastructure provides geo-filtering, allowing operators to activate the overlay only when the target's GPS location matches configured bank codes — limiting noise that would trigger detection. Spanish and Portuguese banks confirmed as targets by overlay configuration files recovered from samples. EU-nexus: Spain and Portugal are EU member states; Italian and French banking overlays present in recovered configs suggest expansion targeting in progress. Detection on mobile MDM platforms: monitor for apps requesting Accessibility Service permissions that are not pre-approved; flag APKs side-loaded from third-party stores; SIEM correlation of unusual mobile device login times alongside OTP usage failures may indicate ATO (account takeover) attempts.
    ch_eu_nexus: "EU-relevant; Spanish and Portuguese banking targets; Italian and French overlays suggest westward expansion; potential threat to Swiss banking customers via cross-border fraud"
    public_sector_nexus: "indirect — bank fraud affecting EU citizens"
    sector: "finance, banking"
    cves: []
    actors_campaigns_malware: ["BTMOB"]
    verification: "SINGLE-SOURCE"
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "BTMOB is a sophisticated Android RAT distributed as a MaaS targeting banking customers in Spain and Portugal through HTML injection and Accessibility Service abuse"
        attribution: "ESET WeLiveSecurity"
        source_url: "https://www.welivesecurity.com/en/malware/btmob-stealthy-rat-burrowing-deep-android-devices/"
    extended_notes: |
      MITRE ATT&CK (Mobile): T1417.002 (Input Capture: GUI Input Capture), T1418 (Software Discovery), T1421 (System Network Configuration Discovery), T1516 (Input Injection). The MaaS geo-filtering capability is a significant evasion enhancement over earlier Android banking trojans like SOVA or Anatsa. BTMOB's MaaS model means detection-engineering focus should be on the shared infrastructure (C2 WebSocket patterns) rather than specific sample characteristics.

