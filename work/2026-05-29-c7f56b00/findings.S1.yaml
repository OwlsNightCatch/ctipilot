        source_url: "https://github.com/rancher/rancher/security/advisories/GHSA-vx8h-4prv-g744"
      - quote: "BSI bewertet diese Schwachstellen als hoch kritisch und empfiehlt sofortige Aktualisierung auf Rancher 2.8.14 oder 2.9.8"
        attribution: "BSI CERT-Bund"
        source_url: "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-1716"
    extended_notes: |
      MITRE ATT&CK: T1068 (Exploitation for Privilege Escalation), T1059.004 (Command and Scripting Interpreter: Unix Shell). The combination of privilege-escalation + command-injection in a Kubernetes management plane is a high-impact attack chain: an attacker who compromises a Cluster Provisioner account (often a CI/CD service account with broad permissions) could escalate to cluster-admin and then pivot to any workload in the managed clusters. Swiss public-sector security teams operating Rancher-managed Kubernetes should treat this as a priority-1 patch this week.

