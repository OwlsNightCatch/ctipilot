    summary: |
      GitLab released patch versions 19.0.1, 18.11.4, and 18.10.7 on 2026-05-27, addressing six CVEs. The two highest-severity issues are: CVE-2026-4868 (CVSS 8.2 High) — an authentication-bypass in the GitLab Duo AI code-review integration that allows a malicious repository contributor to impersonate another user's identity when invoking AI-assisted code actions; and CVE-2026-6713 (CVSS 5.3 Medium) — an information-disclosure flaw permitting unauthenticated enumeration of private project existence through crafted API requests. Additional patched CVEs: CVE-2026-1402 (CVSS 6.5, Wiki DoS via malformed markup), CVE-2026-5296 (CVSS 4.3, Duo API key bypass), CVE-2026-2601 (CVSS 4.3, deployment API data access), CVE-2026-8716 (incorrect name resolution). Affected versions span GitLab CE/EE from 12.7 / 17.1 / 18.2 / 18.7 / 18.8 / 11.5 before 18.10.7, 18.11 before 18.11.4, and 19.0 before 19.0.1. No public exploitation evidence reported at time of disclosure. Detection: GitLab application-layer audit logs for Duo-triggered actions attributed to users who did not initiate the session; unauthenticated API calls to `/api/v4/projects/<id>` endpoints returning existence-confirming response codes on private projects. Patch immediately; NCSC-NL rates this High.
