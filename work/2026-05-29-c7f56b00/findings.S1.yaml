  - title: "Gogs authenticated RCE zero-day — argument injection via branch name (no CVE, no patch)"
    sources:
      - url: "https://www.rapid7.com/blog/post/ve-authenticated-rce-via-argument-injection-gogs-unfixed/"
        publisher: "Rapid7 Research"
        date: "2026-05-28"
        role: "primary"
    discovery_trace: "first seen at: rapid7-research feed → primary: Rapid7 Research blog post, URL https://www.rapid7.com/blog/post/ve-authenticated-rce-via-argument-injection-gogs-unfixed/"
    summary: |
      Rapid7 disclosed a 0-day authenticated RCE in Gogs, the open-source Git service written in Go.
      The vulnerability (no CVE assigned, reported to maintainer 2026-03-17, vendor has not responded or patched as of 2026-05-28) allows an authenticated user to inject arbitrary arguments into a git rebase --exec command via a crafted branch name. The attack vector is CWE-88 (argument injection); an attacker with Create Repository permission creates a branch whose name embeds git flag strings (e.g. `--exec`), which Gogs passes unsanitised to the underlying Git subprocess. On Linux/macOS hosts running Gogs, this permits OS command execution in the context of the Gogs service account. Exploitation requires only an authenticated session with default-enabled open registration, so effectively unauthenticated on public-facing instances. CVSS v4.0 base score is 9.4 (Critical). All versions through 0.14.2 and 0.15.0+dev are confirmed vulnerable. No patch exists; Rapid7's coordinated disclosure timeline notes the maintainer did not respond within 90 days. Detection: watch for unusual git subprocess spawns from the Gogs service process (Sysmon EID 1, parent process = gogs binary, child = git with --exec argument). Hardening: restrict or disable public self-registration; place Gogs behind an authenticated reverse proxy; consider migrating to a maintained alternative (Gitea, Forgejo).
    ch_eu_nexus: "global; Gogs is used in EU public-sector self-hosted code infrastructure"
    public_sector_nexus: "indirect — self-hosted Git services common in government and research institutions"
    sector: "software-development, public-sector"
    cves: []
    actors_campaigns_malware: []
    verification: "SINGLE-SOURCE"
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "An authenticated Gogs user can achieve remote code execution on the underlying server by exploiting an argument injection vulnerability"
        attribution: "Rapid7 Research"
        source_url: "https://www.rapid7.com/blog/post/ve-authenticated-rce-via-argument-injection-gogs-unfixed/"
      - quote: "The vendor has not responded to Rapid7's disclosure as of the publication of this post"
        attribution: "Rapid7 Research"
        source_url: "https://www.rapid7.com/blog/post/ve-authenticated-rce-via-argument-injection-gogs-unfixed/"
    extended_notes: |
      MITRE ATT&CK: T1190 (Exploit Public-Facing Application), T1059 (Command and Scripting Interpreter).
      The attack primitive — user-controlled branch name injected into shell command — is the same class as CVE-2014-6271 (Shellshock). Because Gogs is no longer under active development by its original author, the community fork Gitea is the recommended migration path. Swiss public-sector environments running self-hosted Gogs instances (e.g. for internal code or research data pipelines) should treat this as priority due to the default-open-registration configuration.

  - title: "CVE-2026-35616 FortiClient EMS active exploitation — EKZ Infostealer delivered as fake Fortinet patch"
    sources:
      - url: "https://arcticwolf.com/resources/blog/forticlient-ems-exploited-via-cve-2026-35616-to-deliver-ekz-infostealer-disguised-as-a-fortinet-patch/"
        publisher: "Arctic Wolf"
