    summary: |
      CVE-2026-9170 is a critical unauthenticated RCE in IBM HTTP Server (IHS) and IBM WebSphere Application Server (WAS) caused by improper input validation in the HTTP request parsing layer (CWE-94, code injection). CVSS v3.1 base score is 9.8 (AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H). A remote, unauthenticated attacker can send a specially crafted HTTP request to the default web listener to trigger arbitrary code execution in the IHS/WAS service context. Affected products include IBM HTTP Server 9.0 and 8.5 branches and IBM WebSphere Application Server Traditional 9.0 and 8.5 before specific fix packs. IBM rated this Critical and released Fix Pack updates; details in the IBM Security Bulletin node/7274065. No public PoC or active exploitation reported at time of NCSC.ch advisory (2026-05-28). EPSS score is 0.049% (low probability, not yet weaponised). Detection: IHS/WAS access logs for malformed HTTP request headers (anomalous Content-Type or Transfer-Encoding combinations); Java process spawns from WAS parent (Sysmon EID 1 on Windows, auditd on Linux). Patch to recommended fix packs immediately — IHS/WAS are legacy-but-prevalent in Swiss banking, insurance, and public-sector middleware.
