        date: "2026-04-06"
        role: "corroborating"
      - url: "https://nvd.nist.gov/vuln/detail/CVE-2026-35616"
        publisher: "NVD"
        date: "2026-04-10"
        role: "corroborating"
    discovery_trace: "first seen at: ncsc-ch-security-hub bridge (post 12601) → pivot: Arctic Wolf blog post (primary) → corroborating: Fortinet PSIRT FG-IR-26-099, NVD CVE-2026-35616"
    summary: |
      CVE-2026-35616 is an improper access-control vulnerability in Fortinet FortiClient EMS 7.4.5 and 7.4.6 (CWE-284, CVSS 9.1 Critical). The attack vector is pre-authentication: the FortiClient EMS management API trusts the HTTP header X-SSL-CLIENT-VERIFY, which is intended to be set only by a load balancer or reverse proxy but is not validated by the server itself. An unauthenticated attacker on the network can spoof this header to bypass client-certificate verification, access privileged API endpoints, and push malicious configurations or updates to connected FortiClient endpoints. Arctic Wolf documented active exploitation in the wild as of 2026-05-27: threat actors are using this vector to deliver the EKZ Infostealer, a credential-harvesting payload masquerading as a legitimate Fortinet software update. EKZ targets browser credential stores (Chrome, Firefox saved passwords and session cookies) and exfiltrates them to actor infrastructure. CISA added CVE-2026-35616 to the KEV catalog on 2026-04-06. EPSS score is 43.2% (97.6th percentile). Patch to FortiClient EMS 7.4.7 or later. Detection: monitor FortiClient EMS server logs for API calls without valid client-certificate negotiation; flag mass configuration-push events not initiated from the management console; watch for EMS-pushed installers that are unsigned or have anomalous parent-process chains (Sysmon EID 1, parent = FortiClient service, child = unsigned binary with --silent install flag).
    ch_eu_nexus: "EU-relevant; FortiClient EMS is widely deployed in Swiss federal and cantonal network security infrastructure"
    public_sector_nexus: "direct — FortiNet product commonly deployed in government environments"
    sector: "public-sector, telco, finance, energy"
