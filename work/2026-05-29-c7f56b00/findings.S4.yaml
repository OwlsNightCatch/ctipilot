        publisher: "Risky Business News"
        date: "2026-05-29"
        role: "corroborating — aggregator with outbound links to official sources"
    discovery_trace: >
      first seen at: Risky Business News RSS feed https://news.risky.biz/feed/ (item published 2026-05-29T02:37:22Z)
      → pivot: Risky Bulletin article full text fetched: https://news.risky.biz/risky-bulletin-dutch-police-take-down-giant-botnet-of-17-million-devices/
      → outbound links extracted: Dutch Police primary https://www.politie.nl/nieuws/2026/mei/28/06-politie-en-ncsc-halen-groot-botnetwerk-offline.html
        and NCSC.nl primary https://www.ncsc.nl/nieuws/gezamenlijke-actie-politie-en-ncsc-legt-groot-botnetwerk-plat
      → corroborating: NL Times English report https://nltimes.nl/2026/05/28/ncsc-dutch-police-disrupt-global-botnet-controlled-via-netherlands-based-servers
    summary: |
      On May 28, 2026, the Dutch National Police Cybercrime Team (The Hague unit) and the NCSC jointly dismantled
      the infrastructure of the Asocks residential proxy service — a 17-million-device botnet spanning computers,
      routers, tablets, smartphones, and IoT devices globally. Investigators identified and seized 200 control servers
      physically located at a Netherlands-based hosting provider; the operation was triggered by a security researcher's
      tip to NCSC, which passed intelligence to police. The Asocks network covertly enrolled victim devices using
      malware (connected to the PROXYLIB Go-based library identified by Human Security in 2024 in the context of
      Android apps converting devices to proxy nodes without user consent) and rented out their bandwidth to paying
      criminal customers for spam campaigns, phishing, credential-stuffing, and DDoS attacks.

      This is a direct service-disruption incident for defenders: criminal actors using Asocks for source-IP anonymisation
      in authentication attacks or phishing will now face degraded infrastructure. Residential proxies like Asocks are
      widely used to bypass geo-restriction-based and IP-reputation controls; their disruption temporarily raises the
      cost for attacks that rely on appearing to originate from legitimate consumer IP space.

      Defender angle: enterprises that blocked Asocks proxy exit-node IP ranges (previously shared in Human Security
      threat intelligence) as a control measure should now monitor for shifts to alternative residential proxy services
      (SocksEscort, IPIDEA, RapperBot, FirstVPN are mentioned in Risky Bulletin as comparable infrastructure).
      Detection: unusual authentication attempts from residential IP ranges (CGNAT, consumer ISP RDNS), especially
      against public-facing login portals and VPN concentrators.
    ch_eu_nexus: >
      Direct EU/CH nexus: Dutch government-operated takedown; Dutch NCSC primary responder. Asocks was used
      by criminal actors across Europe including for attacks on EU/EEA targets. The Netherlands-based hosting
      infrastructure used for C2 makes this a European law-enforcement success with direct relevance to
      Swiss and EU defenders who will see a reduction in Asocks-sourced attack traffic.
    public_sector_nexus: >
      indirect — residential proxy services are used to target public-sector internet-facing applications for
      credential-stuffing and access bypass; takedown reduces that attack capacity.
    sector: "cross-sector — criminal infrastructure used against any internet-facing service"
    cves: []
    actors_campaigns_malware: ["Asocks", "PROXYLIB"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "new"
    evidence:
      - quote: "The Cybercrime Team of the Police Unit The Hague, together with the National Cyber Security Centre (NCSC), successfully dismantled a large Asocks botnet made up of at least 17 million compromised consumer devices around the world."
        attribution: "NL Times (citing Dutch Police and NCSC official statements)"
        source_url: "https://nltimes.nl/2026/05/28/ncsc-dutch-police-disrupt-global-botnet-controlled-via-netherlands-based-servers"
      - quote: "Investigators identified 200 servers used to run the infrastructure, all of which were physically based in the Netherlands. The Asocks network operated as a 'residential proxy service,' in which cybercriminals covertly infected poorly protected consumer devices with malware."
        attribution: "NL Times"
        source_url: "https://nltimes.nl/2026/05/28/ncsc-dutch-police-disrupt-global-botnet-controlled-via-netherlands-based-servers"
    extended_notes: |
      Human Security published prior research identifying PROXYLIB — a Go-based malicious library — as the mechanism
      embedded in Android apps to silently convert devices to proxy nodes (the "Satori threat intelligence alert"
      referenced in the Risky Bulletin). SocksEscort had a partial takedown in 2024; Asocks appears to have been
      a successor or parallel commercial offering serving the same criminal market.

