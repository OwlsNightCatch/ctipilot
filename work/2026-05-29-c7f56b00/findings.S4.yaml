      - quote: "ShinyHunters wrote on its data leak site: 'The company failed to reach an agreement with us despite our incredible patience.'"
        attribution: "The Register"
        source_url: "https://www.theregister.com/cyber-crime/2026/05/28/carnival-shinyhunters-cruised-off-with-6m-customer-records/5247808"
      - quote: "On April 14, 2026, our IT security team identified unauthorized activity involving an employee's account, when an unauthorized actor used social engineering to deceive an employee to gain access to a limited portion of the company's IT system."
        attribution: "Carnival Corporation (PR Newswire official notice)"
        source_url: "https://www.prnewswire.com/news-releases/carnival-corporation-notice-of-data-breach-302783524.html"
    extended_notes: |
      This is Carnival's third publicly reported security event — prior incidents in 2019 (FTC settlement) and 2020/2021
      (ransomware affecting multiple brands). Three class-action lawsuits were filed in the US District Court for the
      Southern District of Florida in the weeks before notification letters were sent. ShinyHunters is the same actor
      implicated in the in-window Charter/Spectrum and 7-Eleven Salesforce campaign (prior coverage 2026-05-25 and
      2026-05-27 dailies). The Carnival breach is a separate incident; the common denominator is ShinyHunters' "pay-or-leak"
      extortion model applied across multiple large consumer-brand targets simultaneously.

  - title: "UK Visa Portal (ukvisaportal.com) exposes 100,000+ passport scans and selfies via misconfigured Amazon S3 — immigration identity documents publicly accessible"
    sources:
      - url: "https://techcrunch.com/2026/05/27/uk-visa-portal-spilled-thousands-of-applicants-passports-and-selfies-online-and-hasnt-fixed-the-leak/"
        publisher: "TechCrunch"
        date: "2026-05-27"
        role: "primary — investigative disclosure"
      - url: "https://www.techradar.com/pro/security/uk-visa-portal-website-leaks-thousands-of-user-passport-data-and-photos-online"
        publisher: "TechRadar"
        date: "2026-05-27"
        role: "corroborating"
    discovery_trace: >
      first seen at: Risky Bulletin feed https://news.risky.biz/risky-bulletin-dutch-police-take-down-giant-botnet-of-17-million-devices/ (published 2026-05-29, UK Visa Portal item inside)
      → outbound link: TechCrunch article https://techcrunch.com/2026/05/26/uk-visa-portal-spilled-thousands-of-applicants-passports-and-selfies-online-and-hasnt-fixed-the-leak/
      → primary: TechCrunch article URL confirmed as 2026-05-27 version (article date in slug showed /2026/05/26/ but published date confirmed May 27)
      → corroborating: WebSearch confirming TechRadar coverage https://www.techradar.com/pro/security/uk-visa-portal-website-leaks-thousands-of-user-passport-data-and-photos-online
    summary: |
      A third-party website operating as "UK Visa Portal" (ukvisaportal.com) — unaffiliated with the UK government —
      exposed approximately 100,000 documents uploaded by immigration applicants via a misconfigured Amazon S3 bucket.
      The bucket was not listed publicly, but individual files were accessible to anyone with a direct URL, and the
      backend bug exposed a directory listing, enabling enumeration of all filenames. Exposed material included primary
      passport pages (full name, passport number, nationality, date of birth, place of birth, issue/expiry dates),
      accompanying address documents, and selfie photographs containing EXIF GPS metadata that could pinpoint users'
      home addresses. The operator — identified as UAE-registered Active Leadgen LLC — directed affected users to its
      site by impersonating official UK government ETA and visa-portal services; multiple users reported paying fees
      believing it to be the genuine GOV.UK service.

      TechCrunch notified the company before publication; the response was legal threats from BakerHostetler and PR
      contact from FTI Consulting, not remediation. The bucket was secured overnight (approximately May 27/28) after
      the story published. No ICO breach notification was immediately visible in-window. Misrepresentation of official
      government affiliation amplifies victim harm: affected individuals may believe their data sits in secure government
      systems, not an unregulated third-party storage bucket.

      Defender/regulator angle: This exposure illustrates the recurring S3 public-read misconfiguration pattern in
      companies handling identity documents. Detection: monitor for anomalous GetObject requests across large sequential
      key ranges on buckets holding government ID data. Regulatory exposure spans UK ICO (data-processor obligations),
      UAE (DIFC/ADGM data regulation) and potentially GDPR for EU residents who used the service.
    ch_eu_nexus: >
      EU-nexus: likely affects EU nationals applying for UK visas — EU passport data exposed. UK ICO notification
      obligations triggered under UK GDPR Art. 33 (72-hour window). No confirmed ICO notification observed in-window.
      Swiss angle: Swiss nationals applying for UK Electronic Travel Authorisation (ETA) via this portal similarly at risk.
    public_sector_nexus: >
      indirect — impersonates the official UK Government ETA/visa portal (GOV.UK); erodes trust in government digital
      services; passport data is government-issued identity credential.
    sector: "immigration services, government-adjacent digital services"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "new"
    evidence:
      - quote: "The data spill stemmed from a public Amazon-hosted storage server (also known as a bucket), which UK Visa Portal uses for hosting user-uploaded passports and selfies, with the files accessible and viewable to anyone who knew the web address of each file."
        attribution: "TechCrunch"
        source_url: "https://techcrunch.com/2026/05/27/uk-visa-portal-spilled-thousands-of-applicants-passports-and-selfies-online-and-hasnt-fixed-the-leak/"
      - quote: "The website is not affiliated with the U.K. government, and some have complained that they mistakenly paid a fee to this company instead of using the official GOV.UK website."
        attribution: "TechRadar"
        source_url: "https://www.techradar.com/pro/security/uk-visa-portal-website-leaks-thousands-of-user-passport-data-and-photos-online"
    extended_notes: |
      The operator "Active Leadgen LLC" appears in UAE commercial registries. UK Visa Portal markets itself
      under multiple brand names including "UK Visit" and "ETA-Pass". The pattern of impersonating government
      services to harvest personal data and fees, then mishandling the collected data, is a growing subcategory
      of identity-document exposure in the EU/UK immigration space. ICO and NCSC-UK should be tracking this operator.

  - title: "Dutch Police and NCSC dismantle Asocks residential proxy botnet — 17 million compromised devices, 200 servers seized, NL-based C2 infrastructure offline"
    sources:
      - url: "https://www.politie.nl/nieuws/2026/mei/28/06-politie-en-ncsc-halen-groot-botnetwerk-offline.html"
