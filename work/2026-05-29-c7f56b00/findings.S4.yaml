      → pivot: The Record article https://therecord.media/cruise-giant-carnival-confirms-data-breach-affecting-6-million
      → primary: Carnival PR Newswire victim notice https://www.prnewswire.com/news-releases/carnival-corporation-notice-of-data-breach-302783524.html
      → corroborating: The Register https://www.theregister.com/cyber-crime/2026/05/28/carnival-shinyhunters-cruised-off-with-6m-customer-records/5247808
      → corroborating: Maine AG regulatory filing https://www.maine.gov/agviewer/content/ag/985235c7-cb95-4be2-8792-a1252b4f8318/d6729ef2-7bb3-42d3-abdd-99a1dd8f2415.html
    summary: |
      On April 14, 2026, an attacker used social engineering to compromise a Carnival Corporation employee account
      and gain access to a limited portion of its IT environment. By April 22, investigators confirmed the attacker
      had exfiltrated personal data. ShinyHunters claimed responsibility on April 18 — publishing data publicly
      when Carnival declined to pay the ransom. Carnival filed a substitute notice with state attorneys-general
      on May 27, 2026, confirming 5,995,277 individuals were affected across its brands (Princess Cruises,
      Holland America Line, Cunard, Costa Cruises). Exposed fields: full name, address, email, phone, date of birth,
      and state-issued ID numbers (driver's licence and passport numbers). The company characterised the access as
      limited to "a portion of its IT system" and engaged third-party forensic investigators; no operational disruption
      was reported. Carnival is offering U.S. residents two years of credit monitoring via TransUnion.

      Defender-relevant: ShinyHunters' access entry was a single compromised employee account via social engineering —
      no CVE exploitation. The "pay-or-leak" extortion model operated fully through ShinyHunters' dark-web portal.
      Carnival declined engagement; data was eventually published. Detection focus for travel/hospitality defenders:
      anomalous bulk data access from a single account/session (user-behaviour analytics), lateral scope from
      compromised employee credentials, and timing of large-volume copy operations to external endpoints.
    ch_eu_nexus: >
      Global — European passengers on Carnival brands (Costa Cruises is Italian-headquartered; Cunard has UK operations)
      are affected. EU/Swiss GDPR-regulated personal data including passport numbers exfiltrated; no EU DPA enforcement
      notice yet observed (breach is US-disclosed; EU notification obligations for these subsidiary brands to follow).
    public_sector_nexus: "indirect — affects individual members of public; no government entity breached"
    sector: "hospitality, travel, leisure"
    cves: []
    actors_campaigns_malware: ["ShinyHunters"]
