      - { url: "https://security-hub.ncsc.admin.ch/#/posts/12601", publisher: "NCSC.ch Security Hub", date: "2026-05-28", role: "corroborating" }
    discovery_trace: >
      first seen at: ncsc-ch-security-hub (ncsc-csh recent 10) → post 12601 (2026-05-28) →
      IBM advisory URL https://www.ibm.com/support/pages/node/7274065 (primary); NCSC.ch post
      is the corroborating CH-nexus signal
    summary: |
      IBM disclosed nine vulnerabilities in IBM HTTP Server (used by WebSphere Application Server)
      on 2026-05-26, the most severe of which — CVE-2026-9170 (CVSS 9.8 Critical) — involves
      improper input validation leading to unauthenticated remote code execution and denial of
      service. NCSC.ch flagged this as post 12601 on 2026-05-28.

      CVE-2026-9170 (CVSS 9.8): Improper input validation in IBM HTTP Server (WebSphere Application
      Server). Allows unauthenticated attackers to trigger RCE or DoS. No exploit PoC confirmed public.

      Additional high-severity CVEs in this batch:
      - CVE-2026-8855 (CVSS 8.1): RCE in TLS mutual-authentication configurations
      - CVE-2026-8834 (CVSS 8.0): Heap-based buffer overflow in the Administration Server
      - CVE-2026-8856 (CVSS 7.7): DoS via uncontrolled resource consumption
      - CVE-2026-8850 (CVSS 7.5): DoS via NULL pointer dereference in mod_ibm_upload (module must be enabled)
      - CVE-2026-8854 (CVSS 7.5): DoS via expired pointer dereference in mod_mem_cache (module must be enabled)
      - CVE-2026-8835 (CVSS 7.3): Sensitive information exposure via untrusted pointer dereference

      IBM recommends applying interim fix APAR PH71265 or a fix pack. Optional modules
      (mod_ibm_upload, mod_mem_cache) should be disabled if not needed to reduce attack surface.
      IBM HTTP Server / WebSphere Application Server is deployed across European financial
      institutions, government portals, and legacy middleware stacks.

      Detection: IHS/WebSphere access logs for unexpected large/malformed HTTP requests;
      process-monitoring for unexpected child processes from httpd; IHS error logs for
      module-level crashes. Hardening: Apply APAR PH71265; disable unused optional modules.
