  - title: "GitLab 19.0.1 / 18.11.4 / 18.10.7 patch: CVE-2026-4868 AI-workflow identity spoofing (CVSS 8.2) plus five further access-control and authorization flaws"
    sources:
      - { url: "https://docs.gitlab.com/releases/patches/patch-release-gitlab-19-0-1-released/", publisher: "GitLab", date: "2026-05-27", role: "primary" }
      - { url: "https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-0658/", publisher: "CERT-FR / ANSSI", date: "2026-05-28", role: "corroborating" }
      - { url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0168", publisher: "NCSC-NL", date: "2026-05-28", role: "corroborating" }
    discovery_trace: >
      first seen at: ncsc-nl recent 10 → NCSC-2026-0168 (2026-05-28) → ncsc-nl csaf NCSC-2026-0168
      → GitLab release URL https://about.gitlab.com/releases/2026/05/27/patch-release-gitlab-19-0-1-released/
      (redirected to docs.gitlab.com) → fetched docs.gitlab.com release notes → corroborated by
      cert-fr avis-recent listing CERTFR-2026-AVI-0658 (2026-05-28)
    summary: |
      GitLab shipped a coordinated patch release (19.0.1, 18.11.4, 18.10.7) on 2026-05-27
      fixing six access-control and authorization vulnerabilities:

      CVE-2026-4868 (CVSS 8.2, High — CWE-639): Improper user identity resolution allows an
      authenticated user to impersonate another user when triggering Duo AI workflows. The attacker
      causes specific Duo AI workflow runners to execute under another user's identity. Prerequisites:
      GitLab EE with Duo AI features enabled; valid GitLab account. Affected: all EE versions
      before 18.10.7, 18.11.4, 19.0.1. Technique: T1078 (Valid Accounts).

      CVE-2026-6713 (CVSS 5.3): Unauthenticated enumeration of private projects via incorrect
      authorization check in GitLab CE/EE 18.2–19.0.0. No authentication required — information
      disclosure for internal project names.

      CVE-2026-2601 (CVSS 4.3, CWE-862): Developer-permissioned users in GitLab EE can access
      sensitive deployment data (pipeline environment variables, deployment keys) due to missing
      authorization checks on deployment data APIs.

      CVE-2026-5296 (CVSS 4.3, CWE-862): Developer-role users can bypass group-level flow
      restrictions when foundational flows are enabled (GitLab EE 18.7–19.0.0).

      CVE-2026-8716 (CVSS 4.3, CWE-706): Authenticated users can access CI data from unintended
      reference types (12.7–19.0.0) via incorrect reference resolution.

      CVE-2026-1402 (CVSS 6.5, CWE-770): Authenticated users can trigger DoS via insufficient
      validation (17.1–19.0.0).

      Detection: GitLab audit events for cross-user Duo AI workflow triggers; review API access
      logs for unauthenticated project enumeration attempts (HTTP 200 on /api/v4/projects/ without
      credentials); monitor CI pipeline access logs for cross-reference data leakage.
      Hardening: Upgrade to 19.0.1, 18.11.4, or 18.10.7; review Duo AI feature access controls;
      audit group-level flow restriction settings.
    ch_eu_nexus: "global; GitLab is the dominant self-hosted DevSecOps platform in CH/EU public-sector software development"
    public_sector_nexus: "high — GitLab self-managed is widely used for EU government software delivery pipelines"
    sector: "government, education, technology"
    cves: [CVE-2026-4868, CVE-2026-6713, CVE-2026-2601, CVE-2026-5296, CVE-2026-8716, CVE-2026-1402]
