  - title: "Samba 4.22.10 / 4.23.8 / 4.24.3: two unauthenticated RCE flaws in SAMR server and printing subsystem (CVE-2026-4408, CVE-2026-4480)"
    sources:
      - { url: "https://www.samba.org/samba/security/CVE-2026-4408.html", publisher: "Samba Project", date: "2026-05-27", role: "primary" }
      - { url: "https://www.samba.org/samba/security/CVE-2026-4480.html", publisher: "Samba Project", date: "2026-05-27", role: "primary" }
      - { url: "https://www.openwall.com/lists/oss-security/2026/05/27/6", publisher: "oss-security", date: "2026-05-27", role: "corroborating" }
      - { url: "https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-0651/", publisher: "CERT-FR / ANSSI", date: "2026-05-27", role: "corroborating" }
    discovery_trace: >
      first seen at: bsi-de (WID-SEC-2026-1xxx batch, 2026-05-28 BSI RSS), pivoted to cert-fr avis-recent
      listing which surfaced CERTFR-2026-AVI-0651 (2026-05-27) → fetched
      https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-0651/ → outbound links led to
      https://www.samba.org/samba/security/CVE-2026-4408.html and CVE-2026-4480.html (primaries);
      corroborated via https://www.openwall.com/lists/oss-security/2026/05/27/6
    summary: |
      Samba shipped coordinated security releases (4.22.10, 4.23.8, 4.24.3) on 2026-05-27
      addressing six vulnerabilities, with two rated CVSS 10.0 Critical:

      CVE-2026-4408: The SamValidatePasswordChange and SamValidatePasswordReset RPC handlers
      in the Samba DCE/RPC SAMR server pass the client-controlled username to the "check
      password script" smb.conf option via the %u substitution character without escaping
      shell metacharacters. An unauthenticated remote attacker can inject arbitrary shell
      commands via a crafted username. Prerequisites: (a) a "check password script" containing
      %u must be configured in smb.conf; (b) samba-dcerpcd must be running as a system service,
      which requires "rpc start on demand helpers = no" (non-default). Active Directory DCs are
      unaffected. Reporters: Ron Ben Yizhak (SafeBreach) and John Walker (ZeroPath).

      CVE-2026-4480: Samba's print command processing passes the client-controlled job
      description string to the "print command" smb.conf setting via the %J substitution
      character without sanitising shell metacharacters. An unauthenticated remote attacker
      with print access (guest printing is on by default) can achieve RCE on the print server.
      Prerequisites: (a) "print command" must include %J; (b) the server must NOT use CUPS or
      iprint printing backend — raw/classic printing only. Technique: T1059 (Command Injection
      via shell metacharacters) → T1190 (Exploit Public-Facing Application). No exploit PoC
      confirmed public as of 2026-05-29.

      Detection: Samba audit logs showing unexpected subprocess spawns from smbd/samba-dcerpcd;
      auditd EXECVE records for child processes of smbd with attacker-controlled command strings.
      Hardening: (1) Remove %u from check password scripts or wrap in single quotes; (2) Wrap %J
      in single quotes or remove from print command; (3) Set "rpc start on demand helpers = yes"
      (the default) to disable the vulnerable on-demand SAMR path; (4) Upgrade to 4.22.10, 4.23.8,
      or 4.24.3. EU public-sector relevance: Samba is the dominant Windows-interop file-server stack
      in Linux-based Swiss and EU government environments, often used for SYSVOL replication,
      Active Directory member servers, and legacy print servers.
    ch_eu_nexus: "global; heavy Samba deployment in Swiss/EU public-sector Linux file servers and member servers"
    public_sector_nexus: "high — Samba is standard infrastructure in EU government IT"
    sector: "government, education, healthcare, all"
    cves: [CVE-2026-4408, CVE-2026-4480]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "the client-controlled username is passed to the 'check password script' without escaping shell meta-characters"
        attribution: "Samba Project"
        source_url: "https://www.samba.org/samba/security/CVE-2026-4408.html"
      - quote: "Unauthenticated Remote Code Execution in Samba printing subsystem"
        attribution: "oss-security (Samba team)"
        source_url: "https://www.openwall.com/lists/oss-security/2026/05/27/6"
    extended_notes: |
      The six-CVE batch also includes CVE-2026-3238 (High — unauthenticated DoS via NULL pointer
      in AD DC WINS server), CVE-2026-1933 (Medium — reparse-point access-control bypass allowing
      write to "read only = yes" shares), CVE-2026-2340 (Medium — WORM bypass via rename), and
      CVE-2026-3012 (Medium — auto-enrolment GPO fetching CA cert over HTTP without verification).
      Patch CERTFR-2026-AVI-0651 is the ANSSI/CERT-FR advisory for this batch.

  - title: "Rancher (SUSE): critical command injection via cluster-import endpoint (CVE-2026-44939, CVSS 9.6) plus two further privilege-escalation flaws"
    sources:
      - { url: "https://github.com/rancher/rancher/security/advisories/GHSA-mhc6-2gfq-xx62", publisher: "SUSE Rancher (GitHub Security Advisory)", date: "2026-05-27", role: "primary" }
      - { url: "https://github.com/rancher/rancher/security/advisories/GHSA-vx8h-4prv-g744", publisher: "SUSE Rancher (GitHub Security Advisory)", date: "2026-05-27", role: "primary" }
      - { url: "https://github.com/rancher/rancher/security/advisories/GHSA-4j6x-2764-m8gh", publisher: "SUSE Rancher (GitHub Security Advisory)", date: "2026-05-27", role: "primary" }
      - { url: "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-1716", publisher: "BSI CERT-Bund", date: "2026-05-28", role: "corroborating" }
    discovery_trace: >
      first seen at: bsi-de (WID-SEC-2026-1716 surfaced in BSI RSS 2026-05-28) → fetched BSI
      CSAF JSON WID-SEC-2026-1716 → three GitHub advisory URLs in References section →
      fetched GHSA-vx8h-4prv-g744, GHSA-4j6x-2764-m8gh, GHSA-mhc6-2gfq-xx62 (primaries)
    summary: |
      SUSE Rancher (Kubernetes cluster management platform) shipped security fixes on 2026-05-27
      addressing three vulnerabilities. The most critical is CVE-2026-44939 (CVSS 9.6):

      CVE-2026-44939: The cluster import endpoint `/v3/import/{token}_{clusterId}.yaml` fails
      to sanitise the `authImage` query parameter. An attacker who obtains a valid cluster
      registration token (which may be exposed in documentation or insecure channels) can inject
      URL-encoded newlines (%0A) into `authImage`, breaking out of the YAML `image:` field and
      injecting arbitrary YAML keys into the cluster-import manifest. When an administrator runs
      `kubectl apply` against the malicious manifest, attacker-controlled commands execute on
      control-plane nodes via a deployed DaemonSet with elevated privileges. Technique:
      T1059 (Command Injection via YAML/newline injection) → T1068 (Exploitation for Privilege
      Escalation). Affected: 2.10.0–2.10.11, 2.11.0–2.11.13, 2.12.0–2.12.9, 2.13.0–2.13.5,
      2.14.0–2.14.1. Patched: 2.10.12, 2.11.14, 2.12.10, 2.13.6, 2.14.2.

      CVE-2026-41052 (CVSS 8.4): Project Owners can modify Pod Security Admission (PSA) labels
      on namespaces because the `project-owner` role carries wildcard permissions including the
      `updatepsa` verb. A Cluster Member can create a project, flip namespace PSA to "privileged"
      mode, and deploy containers with host-level access (container escape → host). Technique:
      T1611 (Escape to Host) / T1068. Affected: 2.12.0–2.12.9, 2.13.0–2.13.5, 2.14.0–2.14.1.

      CVE-2026-41053 (CVSS 8.8): The GitHub App authentication provider incorrectly grants
      `group principals` for every team in a GitHub organisation to any authenticated user who
      belongs to at least one team — not just the teams the user actually belongs to. This allows
      privilege escalation via Rancher RBAC role mappings. Technique: T1078.004 (Cloud Accounts
      abuse). Affected: 2.13.0–2.13.5, 2.14.0–2.14.1.

      Detection: Rancher audit logs for unusual kubectl apply against import manifests; cluster
      Kubernetes event logs for unexpected DaemonSet creation; Kubernetes RBAC audit logs for
      privilege escalation via PSA label modification (check `kubectl get events` for PSA-related
      actions). Hardening: Upgrade to patched versions immediately; review all cluster-member
      and project-owner role assignments; if using GitHub App auth, audit team-to-role mappings.
    ch_eu_nexus: "global; Rancher is widely used in CH/EU public-sector on-premise Kubernetes estates"
    public_sector_nexus: "high — Rancher/SUSE is the dominant on-premise Kubernetes management platform in European government cloud"
    sector: "government, technology, cloud infrastructure"
    cves: [CVE-2026-44939, CVE-2026-41052, CVE-2026-41053]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "the `authImage` query parameter. Attackers can inject URL-encoded newlines to 'break out of the `image:` field to inject arbitrary YAML keys'"
        attribution: "SUSE Rancher (GHSA-mhc6-2gfq-xx62)"
        source_url: "https://github.com/rancher/rancher/security/advisories/GHSA-mhc6-2gfq-xx62"
      - quote: "wildcard permissions on the `project-owner` role that included the `updatepsa` verb"
        attribution: "SUSE Rancher (GHSA-vx8h-4prv-g744)"
        source_url: "https://github.com/rancher/rancher/security/advisories/GHSA-vx8h-4prv-g744"

  - title: "Portainer CE: two CVSS 9.4 critical authorization bypasses allow non-admin Docker users to achieve full host RCE — CCB Belgium warns 'Patch Immediately'"
    sources:
      - { url: "https://github.com/portainer/portainer/security/advisories/GHSA-rrmm-9v76-h3p4", publisher: "Portainer (GitHub Security Advisory)", date: "2026-05-10", role: "primary" }
      - { url: "https://github.com/portainer/portainer/security/advisories/GHSA-5fxq-qcf3-244w", publisher: "Portainer (GitHub Security Advisory)", date: "2026-05-28", role: "primary" }
      - { url: "https://ccb.belgium.be/advisories/warning-two-critical-vulnerabilities-portainer-allow-full-host-takeover-patch", publisher: "Centre for Cybersecurity Belgium (CCB)", date: "2026-05-28", role: "corroborating" }
    discovery_trace: >
      first seen at: enisa-euvd recent criticals → EUVD-2026-33064 and EUVD-2026-33063 (both
      published 2026-05-28) → GitHub advisories GHSA-rrmm-9v76-h3p4 and GHSA-5fxq-qcf3-244w
      (primaries); corroborated by WebSearch finding CCB Belgium advisory
      https://ccb.belgium.be/advisories/warning-two-critical-vulnerabilities-portainer-allow-full-host-takeover-patch
    summary: |
      Portainer Community Edition shipped patched versions (2.33.8, 2.39.2, 2.41.0) fixing two
      critical authorization bypass flaws:

      CVE-2026-44848 (CVSS:4.0 9.4): The Docker plugin management endpoints (`/plugins/*`)
      are not registered in Portainer's proxy authorization handler map. All requests to these
      endpoints bypass authorization checks and are forwarded directly to the Docker daemon.
      An authenticated non-admin user with endpoint access can POST to `/plugins/pull` to install
      any plugin from any registry, then POST to `/plugins/{name}/enable` to activate it. Docker
      runs enabled plugins as root on the host with full declared capabilities and mounts — OS-level
      code execution. Technique: T1611 (Escape to Host) / T1078 (Valid Accounts). Affected:
      2.33.0–2.33.7, 2.39.0–2.39.1, 2.40.x. Patched: 2.33.8, 2.39.2, 2.41.0.

      CVE-2026-44849 (CVSS:4.0 9.4): Portainer's seven EndpointSecuritySettings restrictions
      (privileged mode, host PID namespace, device mapping, capabilities, sysctls, security-opt,
      bind mounts) are enforced on the standard container creation path but NOT on the Docker
      Swarm service API. POST /services/create validates only the Mounts[] field (1 of 7 checks);
      POST /services/{id}/update performs no security checks at all. Non-admin users can submit
      arbitrary CapabilityAdd, Sysctls, and Privileges values. A volume-driver bypass additionally
      allows bind-mount equivalents (Type: "volume" with VolumeOptions.DriverConfig.Options{type:
      none, o: bind}) to pass restriction checks. Technique: T1611.

      Temporary mitigations: Revoke Swarm endpoint access for non-admin users via Portainer RBAC;
      disable Docker plugin management for non-admin users. Detection: Docker daemon logs for
      plugin install/enable operations from non-admin service accounts; Docker event stream
      (`docker events --filter type=plugin`) for unexpected plugin lifecycle events.
    ch_eu_nexus: "global; Portainer is widely used for on-premise container management in EU government and public-sector private cloud"
    public_sector_nexus: "indirect — Portainer is common in self-hosted EU public-sector container platforms"
    sector: "government, technology, healthcare"
    cves: [CVE-2026-44848, CVE-2026-44849]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Docker plugin management endpoints (/plugins/*) were not registered with a handler, so standard users with endpoint access could call privileged plugin operations — including installing and enabling plugins — directly against the underlying Docker daemon"
        attribution: "Portainer (GHSA-rrmm-9v76-h3p4)"
        source_url: "https://github.com/portainer/portainer/security/advisories/GHSA-rrmm-9v76-h3p4"
      - quote: "Warning: Two Critical Vulnerabilities in Portainer Allow Full Host Takeover, Patch Immediately!"
