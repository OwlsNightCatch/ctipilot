      framework in European higher education (universities, research institutions) and is deployed
      in Swiss federal and cantonal institutions. OIDC identity-provider misconfigurations can
      allow token forgery, authorization bypass, or session takeover depending on the specific
      flaw — defenders should treat this as high urgency until full details are released.

      Patched version: 7.3.7.1 (CAS 7.3.x series). Hardening: Upgrade to 7.3.7.1 immediately
      if running CAS as an OIDC provider. Until details are public, monitor OIDC token issuance
