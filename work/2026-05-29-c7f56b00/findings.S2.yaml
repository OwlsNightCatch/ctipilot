      - { url: "https://cybersecuritynews.com/veeam-backup-replication-tool-vulnerability/", publisher: "CybersecurityNews", date: "2026-05-27", role: "corroborating" }
      - { url: "https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-0652/", publisher: "CERT-FR / ANSSI", date: "2026-05-27", role: "corroborating" }
    discovery_trace: >
      first seen at: cert-fr avis-recent listing → CERTFR-2026-AVI-0652 "Multiples vulnérabilités
      dans Veeam Backup & Replication" (2026-05-27) → WebSearch found Veeam KB4852 → fetched
      https://www.veeam.com/kb4852 (primary); corroborated by CybersecurityNews article
    summary: |
      Veeam shipped KB4852 / Backup & Replication 13.0.2.29 on 2026-05-27 patching two
      vulnerabilities in the backup platform, which is ubiquitous in EU enterprise and
      government backup environments:

      CVE-2026-32996 (CVSS 7.3, High): Local privilege escalation in the Veeam Agent for
      Microsoft Windows component. An attacker with limited system access (no specifics on
      required privilege level disclosed) can elevate permissions — enabling arbitrary command
      execution, security-control disablement, or lateral movement. Reporter: Alibaba via
      HackerOne. Affected: all version 13 builds before 13.0.2.29.

      CVE-2026-32997 (CVSS 8.6, High): Arbitrary file write in the Veeam Software Appliance
      (Linux-based). Requires an authenticated user with the Backup Administrator role. Can be
      used to place attacker-controlled content at arbitrary filesystem paths on the appliance.
      Depending on target path, potential paths to RCE or persistence (e.g. cron jobs, authorized_keys,
      library hijacking). Reporter: Parsa via HackerOne. Affected: same version range.

      No active exploitation reported. Veeam notes patch-reverse-engineering risk increases
      exploitation probability post-disclosure. Hardening: Upgrade to 13.0.2.29; enforce
      least-privilege access to Backup Administrator role; isolate Veeam appliance on a
      dedicated management VLAN. Detection: Windows security logs for privilege escalation
      events (EID 4672, 4673) originating from Veeam Agent service; Linux auditd for unexpected
      file writes in sensitive directories on the Veeam appliance.
