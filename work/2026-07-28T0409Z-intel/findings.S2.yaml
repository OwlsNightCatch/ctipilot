items:
  - title: "vBulletin unauthenticated pre-auth RCE via the {vb:math} template tag (CVE-2026-61511) — public exploit code released, patch has existed since 1 July"
    sources:
      - { url: "https://ssd-disclosure.com/vbulletin-runtime-template-runmaths-preauth-rce/", publisher: "SSD Secure Disclosure", date: "2026-07-27", role: "primary" }
      - { url: "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-2528", publisher: "BSI CERT-Bund (WID-SEC-2026-2528)", date: "2026-07-27", role: "primary" }
      - { url: "https://thehackernews.com/2026/07/public-exploit-released-for-patched.html", publisher: "The Hacker News", date: "2026-07-27", role: "corroborating" }
    discovery_trace: >
      first seen at: bsi-de, URL https://wid.cert-bund.de/content/public/securityAdvisory/rss
      (BSI CERT-Bund WID-SEC RSS feed, item "[NEU] [kritisch] vBulletin: Schwachstelle
      ermöglicht Codeausführung", WID-SEC-2026-2528) →
      pivot: BSI CSAF detail, URL https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-2528
      (References section names the SSD advisory and the two vBulletin forum patch posts) →
      primary: SSD Secure Disclosure, URL https://ssd-disclosure.com/vbulletin-runtime-template-runmaths-preauth-rce/
      → corroborating pivot: WebSearch ("CVE-2026-61511 vBulletin runMaths preauth RCE") →
      The Hacker News, URL https://thehackernews.com/2026/07/public-exploit-released-for-patched.html
      (names discoverer "EgiX"/Egidio Romano, confirms PoC-typo detail and no-KEV-listing status as of publication).
    summary: |
      An unauthenticated remote code execution flaw in vBulletin's server-side template
      engine reaches PHP's eval() with no authentication and no user interaction. The
      vulnerable code sits in /includes/vb5/template/runtime.php, inside the
      vB5_Template_Runtime::runMaths() method that backs the {vb:math} inline-math
      template tag: the method applies a regular expression meant to restrict input to
      digits, parentheses, arithmetic/binary operators and XOR before passing the result
      to eval(), but the filter is loose enough that a crafted operand chain can
      reconstruct arbitrary PHP function calls. The flaw is reachable pre-auth through the
      public ajax/render/pagenav route, which copies the visitor-supplied
      pagenav[pagenumber] value into a {vb:math} tag before evaluation — no login, no
      administrative access, no other user interaction required (T1190, Exploit
      Public-Facing Application). CVE-2026-61511 affects vBulletin 6.2.1 and earlier and
      6.1.6 and earlier; the vendor shipped 6.2.2 on 1 July 2026 and back-ported patches
      for 6.2.1, 6.2.0 and 6.1.6 in late June — nearly four weeks before SSD Secure
      Disclosure's public write-up and a working proof-of-concept went out on 27 July
      2026 (credited to independent researcher "EgiX"/Egidio Romano). The Hacker News
      reports the released PoC contains a one-character typo that stops it from running
      unmodified, though the fix is trivial. As of the sources fetched in this run, no
      party has confirmed in-the-wild exploitation and CVE-2026-61511 is not yet listed
      in CISA's KEV catalog; BSI CERT-Bund nonetheless rates the advisory "kritisch"
      (critical) given the pre-auth RCE class and now-public exploit code. This is a
      vBulletin-template-engine RCE class with prior form: BSI's own record cross-links
      CVE-2025-48827/CVE-2025-48828, a May 2025 vBulletin template-engine RCE chain from
      the same researcher lineage.
