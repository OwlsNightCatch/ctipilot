        attribution: "BSI CERT-Bund (WID-SEC-2026-2528)"
        source_url: "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-2528"
      - quote: "Summary A vulnerability in vBulletin has been identified, the vulnerability allows an unauthenticated user to cause the vBulletin to execute arbitrary code (PHP) on the remote server."
        attribution: "SSD Secure Disclosure"
        source_url: "https://ssd-disclosure.com/vbulletin-runtime-template-runmaths-preauth-rce/"
      - quote: "As of July 27, 2026, no source had confirmed in-the-wild attacks, and CVE-2026-61511 was not listed in CISA's Known Exploited Vulnerabilities catalog."
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/07/public-exploit-released-for-patched.html"
    extended_notes: |
      Detection concept (telemetry class first): web-application access logs on any
      internet-facing vBulletin instance — watch for anomalous parameter values on
      ajax/render/pagenav (specifically the pagenav[pagenumber] parameter) containing
      arithmetic/XOR-operator sequences well outside a legitimate page-number range, and
      for PHP error-log entries referencing runtime.php / runMaths shortly before
      unexpected outbound connections or webshell writes from the PHP-FPM/Apache
      worker process. Hardening: upgrade to 6.2.2 (or apply the 6.2.1/6.2.0/6.1.6
      back-ported patches) — there is no config-only mitigation since the flaw is in
      the template engine itself; taking the forum offline or placing it behind
      authentication is the only interim compensating control for instances that
      cannot patch immediately. Borderline call: flagging because the home-region
      national CERT (BSI) rated it critical and public PoC just dropped, but no
      Swiss/EU victim or sector-specific targeting has been reported — main agent
      should weigh against any S1 coverage of the same CVE to avoid duplication.
    borderline: true
    borderline_reason: "global generic-software vulnerability with no confirmed Swiss/EU incident or sector-specific targeting; included because BSI (home-region essential source) flagged it critical with fresh public PoC and it may fall in S1's territory too — main agent to dedup against S1's findings."

