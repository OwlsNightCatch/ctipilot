  - title: "MedusaHVNC: a MaaS hVNC RAT rides the victim's real, logged-in browser session on an invisible second Windows desktop"
    sources:
      - { url: "https://www.blackfog.com/medusahvnc-a-hidden-desktop/", publisher: "BlackFog", date: "2026-07-27", role: "primary" }
      - { url: "https://www.securityweek.com/medusahvnc-malware-uses-hidden-windows-desktops-to-evade-detection/", publisher: "SecurityWeek", date: "2026-07-27", role: "corroborating" }
      - { url: "https://cybersecuritynews.com/medusahvnc-control-your-pc-silently/", publisher: "Cyber Security News", date: "2026-07-27", role: "corroborating" }
    discovery_trace: "first seen at: securityweek, URL https://www.securityweek.com/medusahvnc-malware-uses-hidden-windows-desktops-to-evade-detection/ → pivot: cybersecuritynews.com, URL https://cybersecuritynews.com/medusahvnc-control-your-pc-silently/ → primary: BlackFog, URL https://www.blackfog.com/medusahvnc-a-hidden-desktop/"
    summary: |
      BlackFog (Darren Williams, 2026-07-27) analysed MedusaHVNC, a Windows remote-access trojan sold
      as malware-as-a-service via a dedicated storefront and Telegram channel, that gives a buyer a
      live, interactive view of the victim's actual browser session — real cookies, saved logins and
      device fingerprint intact — with no visible sign of intrusion. The five-stage infection chain
      starts with wscript.exe executing an obfuscated JScript launcher (a ~7.5-second delay before
      staging), which drops components into a %TEMP% subfolder including an AutoIt interpreter, an
      encrypted native payload and a Startup-folder batch file for persistence; AutoIt decrypts a
      first-stage 64-bit payload with a single-byte XOR key (0xAE) and injects it into charmap.exe
      (Windows Character Map) — a living-off-the-land injection target chosen to blend with trusted
      system processes. Two further layers — 16-byte repeating XOR followed by ChaCha20 (32-byte key,
      12-byte nonce) — unpack the final payload, which talks to a hardcoded C2 (51.89.204.28:4444)
      over raw TCP via native Winsock calls. Once live, the payload uses only legitimate Windows APIs
      to run the hidden desktop end-to-end: BitBlt/EnumWindows/PrintWindow for screen/window capture,
      SendInput/SetWindowsHookExW for synthetic input, and OpenClipboard/GetClipboardData/
      SetClipboardData for clipboard theft/injection — a fully separate Windows desktop session (its
      own explorer.exe) operating Chrome, Edge or Firefox invisibly to the logged-in user. Because the
      hijacked browser runs on the real infected host under the real profile, resulting traffic and
      session cookies look device- and location-consistent to fraud-detection systems that key on
      those signals — the operational payoff of hVNC-class malware in banking fraud, now packaged for
      turnkey criminal purchase. The MaaS panel also advertises "Mem Exec" (in-memory .NET/native
      payload execution with AMSI/ETW bypass) and "Browser Recovery" (stored credential/cookie/history
      extraction across Chrome, Edge, Brave, Firefox and Telegram).
      Detection: alert on unexpected child processes or unusual behavior under charmap.exe; flag
      AutoIt interpreter execution outside known legitimate use; watch Startup-folder writes from
      wscript.exe-spawned process chains; monitor for creation of a second, non-interactive desktop
      session/explorer.exe on a host; outbound raw-TCP connections to unusual high ports from
      processes not normally network-facing is the most durable signal since it survives however the
      session was hidden.
      Hardening: block outbound connections to known-bad C2 infrastructure; restrict wscript.exe/AutoIt
      execution via application control where not business-required; strengthen fraud-detection logic
      with device-attestation/session-binding controls rather than relying solely on cookie/profile
      continuity.
