  - title: "CVE-2026-61511 — vBulletin: unauthenticated eval() code-injection in the {vb:math} template tag, reachable pre-auth via the pagenav AJAX route"
    sources:
      - { url: "https://ssd-disclosure.com/vbulletin-runtime-template-runmaths-preauth-rce/", publisher: "SSD Secure Disclosure", date: "2026-07-27", role: "primary" }
      - { url: "https://thehackernews.com/2026/07/public-exploit-released-for-patched.html", publisher: "The Hacker News", date: "2026-07-27", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"vBulletin pre-auth code execution exploit PHP eval public disclosure July 2026\") → pivot: The Hacker News, URL https://thehackernews.com/2026/07/public-exploit-released-for-patched.html → primary: SSD Secure Disclosure, URL https://ssd-disclosure.com/vbulletin-runtime-template-runmaths-preauth-rce/"
    summary: |
      SSD Secure Disclosure published (2026-07-27T07:54:05Z) a technical advisory for CVE-2026-61511,
      an unauthenticated remote code execution vulnerability in vBulletin 6.2.1 and prior / 6.1.6 and
      prior, credited to an independent researcher working with SSD. The vulnerable sink is
      vB5_Template_Runtime::runMaths() in /includes/vb5/template/runtime.php, which processes the
      {vb:math} template expression tag: the input string passes through a regex filter
      (preg_replace('#([^+\-*=/\(\)\d\^<>&|\.]*)#','', $str)) permitting digits, parentheses, and
      math/binary operators — including the XOR operator — before being handed directly to PHP's
      eval() ($status = @eval("\$str = $str;");). Because the allowed character set is broad enough to
      support "phpfuck"-style operator-only code obfuscation, an attacker can construct a $str value
      that evaluates to arbitrary PHP execution rather than a simple arithmetic result. While
      {vb:math} can be triggered by an authenticated admin editing a template/style, SSD demonstrates
      it is also reachable pre-authentication via the ajax/render/[template] route: the stock
      "pagenav" template embeds {vb:math {vb:var pagenav.currentpage} - 1} to compute prior/next page
      numbers, so an unauthenticated request supplying a crafted pagenav['pagenumber'] value reaches
      runMaths() with no login, admin session, or user interaction required. vBulletin shipped fixes
      for 6.2.1/6.2.0/6.1.6 in late June 2026 and finalized 6.2.2 on 1 July 2026 — the public technical
      write-up and PoC landed nearly four weeks after patches were available, so any internet-facing
      vBulletin forum not yet on 6.2.2 (or the corresponding 6.1.6/6.2.0/6.2.1 patch tier) should be
      treated as exposed to a now-public unauthenticated RCE chain. No in-the-wild exploitation is
      claimed at time of disclosure.
      Detection: monitor web-server access logs for requests to /ajax/render/pagenav (or any other
      {vb:math}-using template) carrying an anomalous, operator-heavy pagenumber parameter (XOR ^,
      comparison <>&| characters) rather than a plain integer.
      Hardening: upgrade to vBulletin 6.2.2 (or the corresponding 6.2.1/6.2.0/6.1.6 patch) immediately;
      where upgrade is delayed, filter non-numeric characters from pagenumber-class parameters at a
      reverse proxy/WAF as a stopgap.
