items:
  - title: "Internet-wide scanners probe Spring Boot's /actuator/heapdump endpoint with default admin:admin Basic-Auth credentials"
    sources:
      - { url: "https://isc.sans.edu/diary/33188", publisher: "SANS Internet Storm Center", date: "2026-07-27", role: "primary" }
    discovery_trace: "first seen at: sans-isc, URL https://isc.sans.edu/diaryarchive.html → primary: SANS ISC diary, URL https://isc.sans.edu/diary/33188 (no pivot needed)"
    summary: |
      SANS Internet Storm Center (Johannes Ullrich, 2026-07-27) reports scanning traffic hitting a
      non-default Spring Boot Actuator base path, "/admin-api/actuator/heapdump", via HTTP Basic
      Authentication using the credential pair admin:admin (base64 YWRtaW46YWRtaW4=). The Spring Boot
      Actuator heapdump endpoint, when exposed, returns a full JVM heap dump (heapdump.hprof) — the
      Java analog of a core dump — which frequently contains connection strings, API keys, database
      passwords and other secrets resident in application memory at request time. The management
      base path is application-configurable via management.endpoints.web.base-path (default
      /actuator; here relocated to /admin-api/actuator, suggesting a shared application template or
      convention across the scanned population). No CVE or auth-bypass is involved — the scanner
      assumes Basic Auth is configured and simply tries the single most common default credential
      pair, a straightforward reconnaissance-to-initial-access pattern against a known, recurring
      Spring Boot Actuator misconfiguration class (T1595.002 Active Scanning tied to T1078.001 Valid
      Accounts: Default Accounts once the default credential succeeds).
      Detection: alert on GET requests to any path ending "/actuator/heapdump" (default or
      relocated base path) carrying HTTP Basic-Auth headers, particularly repeated 401→200 status
      flips indicating credential guessing, and on heapdump.hprof-sized response bodies leaving the
      network.
      Hardening: never include heapdump in management.endpoints.web.exposure.include on an
      internet-facing profile; scope Spring Security authorization rules to the actuator base path
      (relocating the path alone is not a control); rotate any secret that may have transited a
      reachable heapdump.
    region_nexus: "global"
    primary_sector_nexus: "indirect"
    sector: "public-sector, all sectors running Spring Boot backends"
    cves: []
    techniques: [T1595.002, T1078.001]
    affected_products: ["Spring Boot (Spring Boot Actuator)"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "The heapdump often includes secrets used by the application to connect to backend systems."
        attribution: "SANS Internet Storm Center (Johannes Ullrich)"
        source_url: "https://isc.sans.edu/diary/33188"
      - quote: "The attacker obviously assumes that authentication is configured and just relies on a weak password."
        attribution: "SANS Internet Storm Center (Johannes Ullrich)"
        source_url: "https://isc.sans.edu/diary/33188"
    extended_notes: |
      Single named source (SANS ISC handler telemetry, DShield sensor network) but a well-established,
      reliable community reporting channel with a long track record; no independent second source
      found describing this specific scan pattern in-window, hence SINGLE-SOURCE-OTHER rather than a
      national-CERT carve-out. The technique class (actuator endpoint default-credential scanning) is
      recurring and consistent with prior ISC/DShield reporting patterns, supporting MEDIUM confidence.

  - title: "Dysphoria IoT botnet drops pure-DDoS operation for blockchain-resolved C2 and a self-built relay mesh after the JackSkid takedown"
    sources:
      - { url: "https://www.bleepingcomputer.com/news/security/new-dysphoria-ddos-botnet-spreads-to-200k-devices-worldwide/", publisher: "BleepingComputer", date: "2026-07-27", role: "primary" }
      - { url: "https://thehackernews.com/2026/07/dysphoria-iot-botnet-adds-blockchain-c2.html", publisher: "The Hacker News", date: "2026-07-27", role: "corroborating" }
      - { url: "https://blog.xlab.qianxin.com/dysphoria/", publisher: "QiAnXin XLab", date: "2026-07-25", role: "primary" }
    discovery_trace: "first seen at: bleepingcomputer, URL https://www.bleepingcomputer.com/news/security/new-dysphoria-ddos-botnet-spreads-to-200k-devices-worldwide/ → pivot: thehackernews, URL https://thehackernews.com/2026/07/dysphoria-iot-botnet-adds-blockchain-c2.html → primary: QiAnXin XLab technical report, URL https://blog.xlab.qianxin.com/dysphoria/"
    summary: |
      QiAnXin XLab (2026-07-25; fresh mainstream pickup via BleepingComputer and The Hacker News,
      2026-07-27) is tracking Dysphoria, a >200,000-device IoT botnet lineage descended from the
      jackskid and fbot malware families, whose tradecraft has shifted markedly since a March 2026
      law-enforcement disruption of JackSkid infrastructure. Devices are compromised via brute-forced
      weak Telnet/SSH credentials and known router/camera/embedded-Linux RCEs, including CVE-2025-9528
      and the older CVE-2017-17215. Post-compromise, bots resolve C2 not through conventional DNS but
      through Ethereum ENS and Solana SNS blockchain name records (e.g. burrberry[.]eth,
      24carnforth2merseyside[.]sol), with the actual C2 IPv4 address hidden inside a fake
      IPv6-formatted string recovered via a custom byte-transformation/permutation routine — a
      resolution layer that survives conventional domain/DNS takedown because the resolvers are
      decentralized name services rather than centrally-registered DNS records. Bots communicate via
      a fixed 78-byte login/heartbeat packet and receive structured DDoS-attack commands (duration,
      type, target, flags); operators advertise up to 4 Tbps DDoS capacity as a commercial booter
      service. Since late June 2026, XLab has also tracked a variant that drops DDoS capability
      entirely and instead abuses UPnP to open roughly 155 port-forwarding rules on the local
      gateway, turning the infected device into a pure relay/proxy node in a mesh built from the
      botnet's own victims — a "relayification" XLab assesses as a resilience response to the
      JackSkid takedown.
      Detection: flag outbound DNS-over-blockchain-style lookups (*.eth / *.sol resolution traffic)
      originating from IoT/embedded-class devices — unusual for that device class; monitor for
      anomalous UPnP port-mapping requests creating large numbers of forwarding rules from a single
      LAN host; watch for fixed-length (78-byte) periodic outbound TCP beacons from IoT devices.
      Hardening: disable Telnet/SSH management interfaces on internet-facing IoT devices and change
      default credentials; disable UPnP on gateways where not operationally required; patch known IoT
      RCEs including CVE-2025-9528 and CVE-2017-17215.
    region_nexus: "global (telemetry shows both domestic-China and international spread)"
