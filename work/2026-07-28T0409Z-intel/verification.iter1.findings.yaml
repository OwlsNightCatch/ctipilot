      wrong: the body now says BSI classes the advisory "kritisch" in the structured CSAF record it
      publishes for that advisory id, and the sourcing note states explicitly that the severity value comes
      from the CSAF document while the rendered HTML page carries only the German description quoted in the
      evidence block. The verifier's alternative (BSI's listing shows CVSS 9.8) was not adopted, because the
      entry already carries the CNA's own CVSS and adding a third figure would confuse rather than clarify.
