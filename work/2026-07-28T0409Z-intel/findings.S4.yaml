    extended_notes: |
      Not independently verified beyond the actor's own leak-site posting and the fact that EY already confirmed a related, narrower third-party ITSM breach in April/July. Treat the Jira/GitHub/Azure claim and the RingCentral/Brinks Home listings as claims-with-attribution, not established fact, pending EY/RingCentral confirmation or a forensic account from a named IR firm. Defender takeaway: this is another instance of the 2026 pattern (documented separately by Microsoft on 2026-07-14 re: ShinyHunters/UNC6240 Salesforce OAuth abuse) where third-party/support-platform credential theft is escalated into claims of lateral reach into core engineering (source control) and cloud-management planes — organizations that use shared/federated credentials between ITSM support platforms and Jira/GitHub/Azure tenancies should treat any confirmed ITSM-platform compromise as a trigger to force-rotate all credentials reachable from that platform, not just to notify affected ticket submitters.
