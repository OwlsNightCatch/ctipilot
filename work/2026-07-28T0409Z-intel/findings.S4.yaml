    discovery_trace: "first seen at: ransomware.live recentvictims API (bridge fetch of https://api.ransomware.live/v2/recentvictims, discovered timestamps 2026-07-27T12:58-12:59Z) → pivot: WebSearch (\"ShinyHunters EY OR RingCentral extortion 2026\") → primary: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/ernst-and-young-data-breach-claimed-by-shinyhunters-extortion-gang/ → corroborating: CybersecurityNews, URL https://cybersecuritynews.com/ey-data-breach-claim-shinyhunters/ → corroborating: ransomware.live per-victim pages fetched directly to confirm live (EY and RingCentral IDs above)"
    summary: |
      ShinyHunters updated its dark-web leak-site listing for Ernst & Young on 2026-07-27, publicly claiming responsibility for the ITSM-platform breach EY first disclosed via California/Vermont AG filings on 2026-07-15 (unauthorized access 28 March-12 April 2026 to a third-party IT service-management/support-ticket platform used by EY's tax practice). The new claim extends the scope well beyond support-ticket attachments: ShinyHunters alleges the stolen third-party credentials gave access to EY's Jira, GitHub and Azure environments, and set a final contact deadline of 31 July 2026 before threatening to leak data "along with several ongoing (digital) problems." EY has not confirmed ShinyHunters' involvement or the Jira/GitHub/Azure claim; BleepingComputer states it cannot independently verify the actor's assertions. The same leak-site update simultaneously listed RingCentral, Inc. (a global cloud-communications/UCaaS vendor with 600,000+ business customers) and Brinks Home as new victims in the same wave, both with a near-identical templated "final warning" ultimatum (RingCentral's deadline 30 July 2026); neither company has issued a public confirmation, and the claims rest solely on the leak-site posting. ShinyHunters (registry alias UNC6240) has a documented 2026 track record of hitting SaaS/ITSM-adjacent supply chains at scale (Salesloft Drift/Salesforce OAuth-token campaign, Oracle PeopleSoft, and a confirmed June 2026 breach of the Council of Europe's HR/payroll systems), so the actor's claimed reach into a Big Four firm's engineering/source-control (GitHub) and cloud (Azure) environments is a credible escalation path worth tracking even before independent confirmation, given EY's extensive tax/audit/advisory footprint across Swiss cantonal and EU public-sector clients.
    region_nexus: "EY is a Big Four professional-services firm with substantial Swiss cantonal/federal and EU public-sector advisory and audit engagements; RingCentral is a globally deployed UCaaS vendor also used by European public- and private-sector customers"
