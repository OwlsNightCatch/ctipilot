    confidence: HIGH
    novelty: new
    evidence:
      - quote: "This issue was discovered externally and is known to be actively exploited."
        attribution: "Arista Networks, Security Advisory 0144"
        source_url: "https://www.arista.com/en/support/advisories-notices/security-advisory/24364-security-advisory-0144"
      - quote: "VCO is exposed by default. There is no configuration that can prevent the exposure. A successful attack requires network access to the VCO web interface. VCO tenant or operator credentials are not required for this exposure."
        attribution: "Arista Networks, Security Advisory 0144"
        source_url: "https://www.arista.com/en/support/advisories-notices/security-advisory/24364-security-advisory-0144"
      - quote: "CISA has ordered U.S. federal civilian executive branch agencies to mitigate the vulnerability by Thursday, July 30, 2026."
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/arista-patches-velocloud-orchestrator-zero-day-exploited-in-attacks/"
    extended_notes: |
      Arista's advisory also lists specific attacker-source IPs and IOC-hunt guidance in its own IOC section — per
      this pipeline's no-IOC policy those are deliberately omitted here; defenders should pull them directly from
      the vendor advisory. Detection concept (telemetry-class first): VCO web-access logs / reverse-proxy logs for
      requests to internal-only API routes reached from external source IPs, unusual URL-encoded path components,
      or high request rates against the VCO management interface; VCO backend/application logs for unexpected
      command execution, file creation, or configuration changes not tied to an administrator session; outbound
      network connections initiated from the VCO host itself (a management appliance should not originate
      arbitrary outbound sessions). Hardening: restrict VCO web-interface reachability to trusted administrative
      networks (the vendor's own interim mitigation, since no application-level control disables the exposed
      functionality), and treat any historically internet-exposed on-prem VCO as a compromise-assessment candidate
      per Arista's post-remediation guidance (credential rotation, review of managed Edge device state).

  - title: "CVE-2025-68686 — Fortinet FortiOS: SSL-VPN symlink-persistence patch bypass added to CISA KEV"
    sources:
      - { url: "https://fortiguard.fortinet.com/psirt/FG-IR-25-934", publisher: "Fortinet PSIRT (FG-IR-25-934)", date: "2026-07-27", role: "primary" }
      - { url: "https://www.cisa.gov/news-events/alerts/2026/07/27/cisa-adds-two-known-exploited-vulnerabilities-catalog", publisher: "CISA (KEV addition alert)", date: "2026-07-27", role: "primary" }
    discovery_trace: "first seen at: cisa-kev, URL https://www.cisa.gov/known-exploited-vulnerabilities-catalog (via `python3 tools/fetch_source.py cisa-kev`, catalogVersion 2026.07.27, dateAdded 2026-07-27) → primary: Fortinet PSIRT advisory FG-IR-25-934, URL https://fortiguard.fortinet.com/psirt/FG-IR-25-934 → corroboration: CISA alert page, URL https://www.cisa.gov/news-events/alerts/2026/07/27/cisa-adds-two-known-exploited-vulnerabilities-catalog"
    summary: |
      CISA added CVE-2025-68686 to its KEV catalog on 2026-07-27, confirming active exploitation of a FortiOS
      SSL-VPN flaw that lets an unauthenticated remote attacker bypass the fix Fortinet shipped for the
      long-running "symlink persistence" technique (the technique, first documented by Fortinet/CERT-FR/CISA in
      April 2025, let attackers who had root-filesystem access via an earlier CVE — CVE-2022-42475,
      CVE-2023-27997 or CVE-2024-21762 — create a symbolic link inside an SSL-VPN language-file folder connecting
      the user filesystem to the root filesystem, preserving read access to the device even after the initial
      vulnerability was patched and the intrusion "resolved"). CVE-2025-68686 (CWE-200, CVSS 3.1 5.3,
      AV:N/AC:H/PR:N/UI:N/C:H) is Fortinet's own description of a bypass of the mitigation it built for that
      symlink mechanism: a remote unauthenticated attacker can defeat the earlier patch via crafted HTTP requests,
      but ONLY as a follow-on to an attacker who has already compromised the device at the filesystem level through
      a separate vulnerability — this is a persistence/defense-evasion primitive, not an independent initial-access
      vector. Fortinet's advisory (originally published 2026-02-10, updated 2026-03-12) lists as affected FortiOS
      7.6.0–7.6.1 (fix: 7.6.2+), 7.4.0–7.4.6 (fix: 7.4.7+), and all versions of 7.2, 7.0 and 6.4 (fix: migrate to a
      supported release); Fortinet notes products that never had SSL-VPN enabled are not impacted, and ships a
      virtual-patch signature ("FG-VD-60389.0day") via FMWP database update 26.033. The KEV listing — three-plus
      months after initial disclosure — signals CISA now has evidence this bypass, not just the original symlink
      technique, is being actively used against devices in the field.
    region_nexus: "global; Fortinet FortiGate SSL-VPN is one of the most widely deployed remote-access edge platforms across Swiss/European government and critical-infrastructure networks, and has been a standing target class since the 2022–2024 FortiOS exploitation wave"
    primary_sector_nexus: "direct"
    sector: "public-sector, energy, water, transport, healthcare, finance, telco"
    cves: ["CVE-2025-68686"]
    techniques: ["T1211", "T1005"]
    affected_products: ["Fortinet FortiOS"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "An Exposure of Sensitive Information to an Unauthorized Actor vulnerability [CWE-200] in FortiOS SSL-VPN may allow a remote unauthenticated attacker to bypass the patch developed for the symbolic link persistency mechanism observed in some post-exploit cases, via crafted HTTP requests. An attacker would need first to have compromised the product via another vulnerability, at filesystem level."
        attribution: "Fortinet PSIRT, FG-IR-25-934"
        source_url: "https://fortiguard.fortinet.com/psirt/FG-IR-25-934"
      - quote: "This vulnerability can only be abused as a consequence of a threat actor exploiting a known vulnerability to implement read-only access to vulnerable FortiGate devices, at file system level. Products that never had SSL-VPN enabled, are not impacted by this issue. Virtual Patch named \"FG-VD-60389.0day.\" is available in FMWP db update 26.033"
        attribution: "Fortinet PSIRT, FG-IR-25-934"
        source_url: "https://fortiguard.fortinet.com/psirt/FG-IR-25-934"
    extended_notes: |
      Background (for context, not a fresh source): Fortinet, CERT-FR and CISA first documented the underlying
      symlink-persistence technique in April 2025 (attacks dating to early 2023) as a way threat actors retained
      read-only root-filesystem access to FortiGate devices via the SSL-VPN web panel even after the exploited
      vulnerability was patched; the current CVE is a bypass of Fortinet's fix for THAT technique, not a new
      initial-access flaw. Detection concept: any FortiGate estate that was ever exposed to CVE-2022-42475,
      CVE-2023-27997 or CVE-2024-21762 should be checked for unexpected symbolic links in the SSL-VPN language-file
      directories, unusual entries in the user filesystem pointing outside its normal root, and file-integrity
      drift on the device's language-pack files — regardless of when the device was last patched, since this CVE
      specifically defeats the earlier remediation. Hardening: apply the FortiOS versions above, and where SSL-VPN
      is not required, disable it entirely (the advisory's own scoping note that non-SSL-VPN deployments are
      unaffected implies this is the most robust mitigation for the exposed component).

  - title: "CVE-2026-61511 — vBulletin (all supported 5.x/6.x branches): unauthenticated PHP eval-injection RCE via the {vb:math} template tag, public exploit code released"
    sources:
      - { url: "https://ssd-disclosure.com/vbulletin-runtime-template-runmaths-preauth-rce/", publisher: "SSD Secure Disclosure", date: "2026-07-27", role: "primary" }
      - { url: "https://karmainsecurity.com/KIS-2026-13", publisher: "Karma(In)Security (Egidio Romano / EgiX)", date: "2026-07-27", role: "primary" }
      - { url: "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-2528", publisher: "BSI CERT-Bund (WID-SEC-2026-2528)", date: "2026-07-27", role: "corroborating" }
      - { url: "https://thehackernews.com/2026/07/public-exploit-released-for-patched.html", publisher: "The Hacker News", date: "2026-07-27", role: "corroborating" }
    discovery_trace: "first seen at: bsi-de (BSI CERT-Bund WID RSS), URL https://wid.cert-bund.de/content/public/securityAdvisory/rss (via `python3 tools/fetch_source.py feed`) → drill: BSI CSAF WID-SEC-2026-2528, URL https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-2528 (via `python3 tools/fetch_source.py bsi-csaf WID-SEC-2026-2528`) → primary: SSD Secure Disclosure advisory, URL https://ssd-disclosure.com/vbulletin-runtime-template-runmaths-preauth-rce/ → primary: Karma(In)Security researcher write-up, URL https://karmainsecurity.com/KIS-2026-13 → corroboration: The Hacker News, URL https://thehackernews.com/2026/07/public-exploit-released-for-patched.html"
    summary: |
      SSD Secure Disclosure and independent researcher Egidio Romano ("EgiX") published (2026-07-27) full technical
      details and working exploit code for CVE-2026-61511, an unauthenticated remote code execution vulnerability
      in vBulletin's server-side template engine. The vulnerable code is `vB5_Template_Runtime::runMaths()` in
      `/includes/vb5/template/runtime.php`: it applies an allowlist regex (`#([^+\-*=/\(\)\d\^<>&|\.]*)#`) intended
      to restrict input to digits, parentheses and math/binary operators, then passes the filtered string straight
      into PHP's `eval()`. The regex permits enough characters — digits, parentheses, arithmetic and binary/XOR
      operators — to reconstruct arbitrary PHP function names and string literals character-by-character using a
      "phpfuck"-style technique with no letters at all, defeating the filter's intent. Exploitation requires no
      authentication: the stock `pagenav` template copies the visitor-supplied `pagenav[pagenumber]` HTTP parameter
      into a `{vb:math}` tag, which flows into `runMaths()` via the public `ajax/render/pagenav` route — so any
      unauthenticated request to that route can trigger PHP code execution as the web-server user. The published
      PoC (credited "vBulletin 0-day RCE exploit by EgiX") opens an interactive command shell over this primitive.
      Affected: vBulletin 5.x through 5.7.5 and 6.x through 6.2.1 (per the researcher and BSI); vBulletin shipped
      Patch Level 1 hotfixes for the 6.1.6/6.2.0/6.2.1 branches in late June 2026 and rolled the fix forward into
      6.2.2 on 2026-07-01 — meaning the public exploit landed roughly four weeks after patches were already
      available. vBulletin Cloud-hosted sites were already patched before the disclosure. As of 2026-07-27 no
      source has confirmed in-the-wild exploitation and CVE-2026-61511 is not (yet) CISA KEV-listed — this is
      included on the imminent-exploitation profile (pre-auth RCE, public working exploit, internet-facing forum
      software with a large unpatched population) rather than confirmed active abuse.
    region_nexus: "global; vBulletin runs self-hosted community/association/public-facing forums, including some operated by Swiss/European public-sector-adjacent bodies and municipalities"
    primary_sector_nexus: "indirect"
    sector: "public-sector"
    cves: ["CVE-2026-61511"]
    techniques: ["T1190"]
    affected_products: ["vBulletin (self-hosted, 5.x and 6.x branches)"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    borderline: true
    borderline_reason: "no confirmed in-the-wild exploitation yet and vBulletin is less central to Swiss/EU critical-infrastructure/government cores than to community/association forums, but included given the unauthenticated pre-auth RCE + public working exploit + large historically-unpatched self-hosted install base"
    evidence:
      - quote: "The $str parameter is not sufficiently sanitized before being used in an eval() call. The used regex will allow for digits, parentheses, math and binary operators (the XOR, particularly)."
        attribution: "SSD Secure Disclosure"
        source_url: "https://ssd-disclosure.com/vbulletin-runtime-template-runmaths-preauth-rce/"
      - quote: "The filter blocks letters but permits digits, parentheses, concatenation, arithmetic operators, and binary operators such as XOR, enough to reconstruct PHP strings and callable function names without any letters, using a restricted-character technique."
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/07/public-exploit-released-for-patched.html"
      - quote: "SSD did not report active exploitation. As of July 27, 2026, no source had confirmed in-the-wild attacks, and CVE-2026-61511 was not listed in CISA's Known Exploited Vulnerabilities catalog."
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/07/public-exploit-released-for-patched.html"
    extended_notes: |
      Detection concept: web-access logs for anomalous, encoded, or arithmetic-only-looking values in the
      `pagenav[pagenumber]` parameter on requests to `ajax/render/pagenav` (legitimate pagination values are short
      integers; a phpfuck-style payload is a long string of parentheses, digits and operators) — this is a
      distinctive, low-benign-collision signature. Process-creation telemetry on the web-server host for
      unexpected child processes spawned from the PHP-FPM/Apache/php-cgi worker handling vBulletin requests is the
      platform anchor. Hardening: upgrade to 6.2.2 (or the branch-specific Patch Level 1 release) immediately;
      vBulletin Cloud customers are already remediated. This is unrelated to the May 2025 vBulletin RCE chain
      (CVE-2025-48827/CVE-2025-48828, also researched by the same discloser, abusing the Reflection API and the
      ajax/api/ad/replaceAdTemplate endpoint) — a WebSearch hit for "vBulletin exploited in the wild" surfaced that
      unrelated 2025 story, which was verified and excluded as out-of-window/off-topic during this run.

