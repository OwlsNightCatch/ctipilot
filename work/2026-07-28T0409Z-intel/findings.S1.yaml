items:
  - title: "CVE-2026-16812 — Arista VeloCloud Orchestrator (VCO) on-prem: unauthenticated OS command injection (CVSS 10.0), actively exploited and KEV-listed"
    sources:
      - { url: "https://www.arista.com/en/support/advisories-notices/security-advisory/24364-security-advisory-0144", publisher: "Arista Networks (Security Advisory 0144)", date: "2026-07-27", role: "primary" }
      - { url: "https://www.cisa.gov/news-events/alerts/2026/07/27/cisa-adds-two-known-exploited-vulnerabilities-catalog", publisher: "CISA (KEV addition alert)", date: "2026-07-27", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/arista-patches-velocloud-orchestrator-zero-day-exploited-in-attacks/", publisher: "BleepingComputer", date: "2026-07-27", role: "corroborating" }
    discovery_trace: "first seen at: cisa-kev, URL https://www.cisa.gov/known-exploited-vulnerabilities-catalog (via `python3 tools/fetch_source.py cisa-kev`, catalogVersion 2026.07.27) → primary: Arista PSIRT Security Advisory 0144, URL https://www.arista.com/en/support/advisories-notices/security-advisory/24364-security-advisory-0144 → corroboration: CISA alert page, URL https://www.cisa.gov/news-events/alerts/2026/07/27/cisa-adds-two-known-exploited-vulnerabilities-catalog (fetched via `python3 tools/fetch_source.py cisa page <url>`) → corroboration: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/arista-patches-velocloud-orchestrator-zero-day-exploited-in-attacks/ (found via WebSearch \"Arista VeloCloud Orchestrator CVE-2026-16812 exploited\")"
    summary: |
      Arista disclosed and CISA KEV-listed (both 2026-07-27) an unauthenticated OS command injection vulnerability
      in VeloCloud Orchestrator (VCO) on-prem, the centralized controller that configures, monitors and manages
      VeloCloud SD-WAN Edge devices and Gateways. Per Arista's advisory the flaw sits in "privileged internal
      functionality" that "was intended to be for internal use only and is not intended to be remotely accessible" —
      but the VCO web interface is internet/network-reachable by default with no configuration option to disable
      the exposure, and exploitation requires no tenant or operator credentials at all. Arista states the issue
      "was discovered externally and is known to be actively exploited" — this is vendor-confirmed in-the-wild
      exploitation, not a KEV-catalog-only assessment. CVSS 3.1/4.0 base score is 10.0 (AV:N/AC:L/PR:N/UI:N,
      full C/I/A impact). Affected: on-prem VCO 5.2.x before 5.2.3.14, 6.1.x before 6.1.3.4, 6.4.x before 6.4.2.4,
      and 7.0.x before 7.0.0.1; VCO Hosted and Dedicated (Arista/Broadcom-managed) were already patched before the
      advisory published and are not affected, nor are VeloCloud Gateway/Edge or any Arista EOS-based product line.
      Because VCO is the management plane for an SD-WAN fleet, compromise can cascade to managed Edge devices —
      Arista's post-remediation guidance explicitly calls for credential rotation and validation of managed device
      state, not just an orchestrator patch. CISA added the CVE to KEV the same day with a federal remediation
      deadline of 2026-07-30 (three days), reflecting the urgency of default, unauthenticated, confirmed-exploited
      exposure on internet-facing SD-WAN management infrastructure.
    region_nexus: "global; VeloCloud SD-WAN is deployed by European/Swiss telcos, MSPs and enterprises managing branch-office WAN connectivity, including public-sector and CI-adjacent networks"
    primary_sector_nexus: "direct"
    sector: "telco, public-sector, energy, finance"
    cves: ["CVE-2026-16812"]
    techniques: ["T1190"]
    affected_products: ["Arista VeloCloud Orchestrator (VCO) On-Prem"]
