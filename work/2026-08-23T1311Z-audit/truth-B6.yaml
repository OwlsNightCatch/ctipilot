- entry: entries/2026-08-19/cve-2026-18963-keycloak-reset-credentials-account-takeover.md
  verdict: factual-error
  defect: >
    The entry states, in the summary, body (a dedicated paragraph titled "Second, and absent
    from the headline advisory view, one affected product has no fix at all") and an action item,
    that Red Hat's structured product-state data records the Red Hat JBoss Enterprise Application
    Platform Expansion Pack as "Affected" with no erratum available for CVE-2026-18963. Both
    Red Hat's own structured security-data API (hydra) and the published CVE record (CNA:
    redhat) instead record this exact product/package pair (keycloak-services in the JBoss EAP
    Expansion Pack) as "Not affected" / defaultStatus "unaffected" — the same status as Red Hat
    Single Sign-On 7, which the entry correctly records as Not affected. This is not a case of
    the record changing after publication in a way the entry couldn't have known: the flaw
    description and score fields (all confirmed to match the entry) come from the same
    structured Red Hat security-data source as the disputed package_state field, and there is
    no revision-history evidence of the package_state ever differing. A reader acting on this
    entry would wrongly conclude the JBoss EAP Expansion Pack carries an unpatched,
    unauthenticated account-takeover exposure and would apply an unnecessary compensating
    control (or search fruitlessly for a nonexistent patch) for a product line Red Hat says was
    never affected.
  ground_truth: >
    Red Hat hydra security-data API (https://access.redhat.com/hydra/rest/securitydata/cve/CVE-2026-18963.json),
    "package_state": [{"product_name": "Red Hat JBoss Enterprise Application Platform Expansion
    Pack", "fix_state": "Not affected", "package_name": "keycloak-services", ...}, {"product_name":
    "Red Hat Single Sign-On 7", "fix_state": "Not affected", ...}]. Confirmed independently via
    the published CVE record (cveawg.mitre.org, assigner redhat): the "Red Hat JBoss Enterprise
    Application Platform Expansion Pack" / keycloak-services entry in `affected[]` carries
    "defaultStatus": "unaffected" (identical treatment to Red Hat Single Sign-On 7, also
    "unaffected"). Neither authoritative Red Hat source at any point records this product as
    Affected.
  ground_truth_url: "https://access.redhat.com/hydra/rest/securitydata/cve/CVE-2026-18963.json ; https://access.redhat.com/security/cve/CVE-2026-18963"

