- entry: entries/2026-08-18/zurich-trial-lockergoga-megacortex-nefilim-swiss-victims.md
  verdict: imprecision
  defect: >
    cash.ch names the defendant's third self-developed tool "RMS" ("übernahm der Mann bei der
    Entwicklung eines weiteren Werkzeugs namens «RMS» eine führende Rolle als Projektleiter"),
    not Nefilim. The entry's body correctly avoids naming the third tool when citing cash.ch
    ("a further tool"), and the title's "Nefilim" attribution is separately supported by
    Netzwoche's quote of the official prosecutorial press release listing "Lockergoga",
    "Megacortex" and "Nefilim" as the charged malware. No claim in the entry is technically
    false, but the entry never surfaces that cash.ch's account of what the defendant personally
    coded (LockerGoga, MegaCortex, "RMS") does not include Nefilim by name, leaving an
    unreconciled naming gap between two of its three sources on the same third-tool detail.
  ground_truth: >
    cash.ch (raw fetch): "...später wirkte er an der Entstehung der Schadsoftware «Megacortex»
    mit... Ausserdem übernahm der Mann bei der Entwicklung eines weiteren Werkzeugs namens «RMS»
    eine führende Rolle als Projektleiter." Netzwoche (raw fetch): "...Cyberangriffe mit den
    Schadprogrammen \"Lockergoga\", \"Megacortex\" und \"Nefilim\", ... wie es in einer Mitteilung
    heisst."
  ground_truth_url: "https://www.cash.ch/news/top-news/hacker-steht-nach-attacke-auf-stadler-rail-und-andere-firmen-vor-gericht-961362 ; https://www.netzwoche.ch/news/2026-08-17/update-mutmasslicher-cyberkrimineller-steht-in-zuerich-vor-gericht"

