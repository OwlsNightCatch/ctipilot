- entry: entries/2026-08-10/wp2root-php-uaf-copy-fail-kev-kernel-lpe-to-native-root.md
  verdict: factual-error
  defect: >
    evidence[] quote "The su file on disk is never modified, so file-integrity monitoring that watches
    file contents or writes to the binary sees nothing." is attributed to publisher "Xint Code" (the
    copy.fail / Copy Fail discloser), and the body cites it inline as "[Xint Code, 2026-04-29]
    (https://copy.fail/)" alongside the 732-byte-script quote, framed as "The same page records"
    (implying both quotes are on copy.fail). The quote does not appear anywhere on https://copy.fail/
    (verified: no match for "never modified", "sees nothing", "su file", "file integrity", or
    "integrity monitoring" in the fetched page text). It is in fact a verbatim sentence from Calif's
    own wp2root write-up (https://blog.calif.io/p/the-wordpress-chain-massacre), the entry's primary
    source, misattributed here to the corroborating discloser instead.
  ground_truth: >
    blog.calif.io/p/the-wordpress-chain-massacre contains the sentence verbatim ("...Copy Fail
    overwrites this cached copy, with a tiny stub of the helper's own making, so the kernel now runs
    that stub in place of the real binary. The su file on disk is never modified, so file-integrity
    monitoring that watches file contents or writes to the binary sees nothing. Because /usr/bin/su is
    setuid-root..."). copy.fail/ (Xint Code's own disclosure page) does not contain this sentence; it
    does correctly carry the separately-cited "732-byte Python script" quote.
  ground_truth_url: https://blog.calif.io/p/the-wordpress-chain-massacre

