- entry: entries/2026-08-10/coding-agent-ci-harness-trust-boundary-shared-checkout.md
  verdict: factual-error
  defect: >
    cves[] record for CVE-2026-12537 (Google Gemini CLI) lists cvss: null and vector: user-interaction.
    The CNA's own CVSS v4.0 score for this CVE is 10.0 CRITICAL with vector
    CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/... (also echoed identically as the OSV/GHSA CVSS_V3.1 vector
    AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H) -- User Interaction is explicitly NONE, not passive/required,
    so per this store's own cve_vectors taxonomy ("zero-click: attacker-initiated with no victim
    interaction") the correct vector value is zero-click, not user-interaction, and cvss should be "10.0"
    rather than null. The omission/mischaracterization affects a maximum-severity RCE and could mislead
    triage or filtering that relies on these fields.
  ground_truth: >
    NVD record for CVE-2026-12537 lists a Secondary CVSS v4.0 metric from the assigning CNA:
    vectorString "CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/.../U:Clear",
    baseScore 10.0, baseSeverity CRITICAL, userInteraction NONE, attackRequirements NONE,
    privilegesRequired NONE. The OSV record for the same advisory (GHSA-wpqr-6v78-jr5g) independently
    carries the identical CVSS_V3.1 vector with UI:N and a 10.0-equivalent (AV:N/AC:L/PR:N/UI:N/S:C/
    C:H/I:H/A:H).
  ground_truth_url: https://services.nvd.nist.gov/rest/json/cves/2.0?cveId=CVE-2026-12537

