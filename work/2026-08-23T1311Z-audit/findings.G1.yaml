  - title: "SPIP CMS — unauthenticated pre-authentication RCE actively exploited, security-screen bypass, fixed same-day in 4.4.21 (CVE-2026-77647)"
    sources:
      - { url: "https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-1063/", publisher: "CERT-FR (ANSSI)", date: "2026-08-21", role: "primary" }
