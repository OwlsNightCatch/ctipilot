    summary: |
      Claroty Team82 disclosed three vulnerabilities in the Danfoss AK-SM 800A refrigeration
      system-manager platform, published 2026-08-09T17:59:00Z, after finding "thousands of publicly
      accessible management interfaces" via internet-wide scan data. CVE-2025-41450 (CWE-287 Improper
