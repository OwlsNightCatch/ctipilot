  - title: "Claroty Team82: Copeland XWEB Pro commercial-refrigeration supervisory controllers — 23 vulnerabilities (21 high-severity) chain to unauthenticated root RCE, demonstrated by silently spoiling food while displaying a normal temperature"
    sources:
      - { url: "https://claroty.com/team82/research/chilling-discoveries-unpacking-vulnerabilities-in-copeland-xweb-pro-controllers", publisher: "Claroty Team82", date: "2026-08-09", role: "primary" }
    discovery_trace: "first seen at: claroty-team82, URL https://claroty.com/team82/research → primary (no pivot needed): https://claroty.com/team82/research/chilling-discoveries-unpacking-vulnerabilities-in-copeland-xweb-pro-controllers"
    summary: |
      Claroty Team82 disclosed 23 vulnerabilities (21 high-severity) in the Copeland XWEB Pro
      supervisory-controller platform (XWEB 300D/500D/500B PRO, versions <=1.12.1), published
      2026-08-09T18:00:00Z. Three chained primitives reach unauthenticated root RCE: (1) an
      authentication-bypass logic flaw (CVE-2026-25085, CVSSv3 8.6) — the Lua get_authentication
      function returns an unpopulated-but-"truthy" table `{user=nil, role=nil, recovery=nil}` when an
      unrecognized auth_mode is supplied in the HTTP Authorization: Basic header, and the router only
      checks that something was returned, not its contents; (2) a predictable "daily backdoor"
      (CVE-2026-21718, CVSSv3 10.0) — admin SSH/web credentials are derived via KDF from a hardcoded
      firmware seed plus the device's publicly-obtainable MAC address and the current date, letting an
      attacker reconstruct valid admin credentials offline with no interaction; and (3) 19 separate OS
      command-injection flaws across API/CGI endpoints (contact-list import, network config, firmware
      update) where user input is concatenated unsanitized into Lua system-execution calls run with
      elevated privileges, yielding root. Claroty built a live physical demonstration: from an
      internet-exposed XWEB controller, an attacker reverse-engineers the connected field controller's
      undocumented Modbus register map and can display an arbitrary temperature while silently
      disabling cooling — "spoiled food" or, per Claroty, "compromised temperature-sensitive medical
      supplies" for cold-chain pharma. Copeland shipped firmware 1.13 fixing all 23 issues; no
      exploitation-in-the-wild is claimed, this is coordinated vulnerability research.
    region_nexus: "global; internet-exposed commercial refrigeration deployments (retail, cold storage, pharma cold-chain) worldwide"
