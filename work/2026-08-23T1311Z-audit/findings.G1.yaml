      - { url: "https://www.thehackerwire.com/spip-unauthenticated-rce-cve-2026-77647/", publisher: "TheHackerWire (AI-generated aggregator)", date: "2026-08-20", role: "corroborating-reduced-confidence" }
    discovery_trace: "first seen at: anssi-fr, URL https://www.cert.ssi.gouv.fr/avis/feed/ (avis-recent listing, item CERTFR-2026-AVI-1063) → primary: SPIP vendor blog, URL https://blog.spip.net/Mise-a-jour-critique-de-securite-sortie-de-SPIP-4-4-21.html → cross-check: WebSearch (\"CVE-2026-77647 SPIP\") → TheHackerWire, URL https://www.thehackerwire.com/spip-unauthenticated-rce-cve-2026-77647/"
    summary: |
      CERT-FR published CERTFR-2026-AVI-1063 on 2026-08-21 relaying SPIP's own 2026-08-20 security
      bulletin for SPIP 4.4.21: a "universal (unconditional) pre-authentication RCE" affecting SPIP
      4.4.20, which the vendor states "is not mitigated by the security screen" — SPIP's built-in
      WAF-like protection layer that normally blocks exactly this class of attack. The vendor states
      plainly that "exploitation attempts have already been observed in the wild." A third-party
      write-up (uncorroborated by CERT-FR/vendor, treated as reduced-confidence) attributes the root
      cause to CVE-2026-77647 (CVSS 9.8): SPIP's incorrect identification of `<?php` blocks in certain
      contexts combined with PHP's var_export() mishandling input containing a literal `<` character,
      letting attacker-controlled input escape its data context and be interpreted as executable PHP.
      No authentication or user interaction is required. CERT-FR's own advisory states the affected
      range as versions before 4.4.21; fix is 4.4.21 (PHP 7.4–8.5 compatible). SPIP is the entity
      registry's own "dominant French public-administration CMS with wide EU/CH Francophone government
      deployment" (trend:spip-2026-rce-wave) — this is a third disclosure in that continuing 2026 wave,
      following the pre-4.4.14 RCE cluster and the 4.4.15 security-policy bypass.
    region_nexus: "France primary; direct nexus to Francophone Swiss cantonal/communal and EU public-administration sites running SPIP"
