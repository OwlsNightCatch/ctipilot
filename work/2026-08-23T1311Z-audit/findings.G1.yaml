  - title: "'Certighost' — Active Directory Certificate Services elevation of privilege lets an attacker impersonate a domain controller via PKINIT and forged Client-DC identity lookup (CVE-2026-54121); public PoC, 0patch back-ports the fix to unsupported Windows Server"
    sources:
      - { url: "https://0patch.com/blog/micropatches-released-for-certighost-active-directory-certificate-services-elevat", publisher: "0patch (ACROS Security)", date: "2026-08-18", role: "primary" }
    discovery_trace: "first seen at: 0patch-blog, URL https://blog.0patch.com/feeds/posts/default → primary (no pivot needed): https://0patch.com/blog/micropatches-released-for-certighost-active-directory-certificate-services-elevat → corroborating: MSRC API, URL https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-54121"
    summary: |
      CVE-2026-54121 (CWE-285 Improper Authorization, MSRC base score 8.8, patched in Microsoft's
      July 2026 updates, released 2026-07-14) lets an authenticated attacker who can manipulate
      attributes of a machine account they control request that Active Directory Certificate Services
      look up the requester's identity via a different ("Client") domain controller than the default.
      Insufficient validation lets the attacker point that lookup at a malicious domain controller
      that returns fabricated identity data, letting the attacker obtain a certificate valid for
      authentication (via PKINIT) as an arbitrary machine account — including, per Microsoft's own
      FAQ, "the ability to authenticate as the Domain Controller and gain the ability to perform
      privileged Active Directory operations" if a DC account is targeted. Researchers Muhammad Ali and
      Aniq Fakhrul published the technical analysis and a proof-of-concept (public on GitHub); Microsoft
      itself marks the CVE "publiclyDisclosed: No" in its own record despite the researcher's public
      writeup, and "exploited: No" as of this run. 0patch (ACROS Security) built and released free
      micropatches for Windows Server 2008 R2, 2012 and 2012 R2 — versions no longer receiving official
      Microsoft security updates — closing the gap for organizations still running end-of-life domain
      controllers or CA servers on those builds.
    region_nexus: "global; any Active Directory environment running AD CS, including EOL Windows Server domain controllers"
    primary_sector_nexus: "direct"
    sector: "public-sector"
    cves: ["CVE-2026-54121"]
    techniques: [T1649]
    affected_products: ["Active Directory Certificate Services", "Windows Server 2008 R2", "Windows Server 2012", "Windows Server 2012 R2"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "Insufficient validation of such request allowed the attacker to refer the CS to a malicious domain controller that provided fake information about the requestor."
        attribution: "0patch (ACROS Security), 2026-08-18"
        source_url: "https://0patch.com/blog/micropatches-released-for-certighost-active-directory-certificate-services-elevat"
      - quote: "An authenticated attacker could manipulate attributes associated with a machine account and obtain a certificate from Active Directory Certificate Services that allows authentication as that machine via PKINIT. If a Domain Controller account can be targeted, the attacker could authenticate as the Domain Controller and gain the ability to perform privileged Active Directory operations."
        attribution: "Microsoft Security Response Center, CVE-2026-54121 FAQ"
        source_url: "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-54121"
      - quote: "Muhammad Ali and Aniq Fakhrul for sharing their analysis and POC, which allowed us to create patches for Windows versions no longer receiving official updates."
        attribution: "0patch (ACROS Security), 2026-08-18"
        source_url: "https://0patch.com/blog/micropatches-released-for-certighost-active-directory-certificate-services-elevat"
    extended_notes: |
      Single-source in the strict sense (0patch is the only narrative write-up found; MSRC's own API
      record corroborates the CVE facts but is not itself a narrative source, and the researchers'
      own GitHub gist/repo were only seen as links, not fetched as independent write-ups this run).
      The underlying Microsoft patch (2026-07-14) is outside the 14-day window; what is in-window and
      new is the 0patch legacy-system micropatch release plus the public PoC becoming known via this
      write-up. Same technique family (AD CS / PKINIT abuse) as CVE-2026-25177 "KerberLoss" and
      CVE-2026-27912 "ResetNightmare", already covered by this pipeline's 2026-08-09 weekly entry —
      Certighost is a third, distinct AD identity-confusion primitive disclosed in the same
      August 2026 wave and may be worth framing alongside them if the main agent is tracking that
      pattern.

  - title: "'GreenPlasma' — Windows Collaborative Translation Framework local privilege escalation via named-object symlink redirection reaches SYSTEM through consent.exe (CVE-2026-45586); Microsoft rates exploitation 'More Likely', PoC published then deleted"
    sources:
      - { url: "https://0patch.com/blog/micropatches-released-for-greenplasma-windows-collaborative-translation-framework", publisher: "0patch (ACROS Security)", date: "2026-08-10", role: "primary" }
    discovery_trace: "first seen at: 0patch-blog, URL https://blog.0patch.com/feeds/posts/default → primary (no pivot needed): https://0patch.com/blog/micropatches-released-for-greenplasma-windows-collaborative-translation-framework → corroborating: MSRC API, URL https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-45586"
    summary: |
      CVE-2026-45586 (CWE-59 Improper Link Resolution Before File Access, MSRC base score 7.8,
      "Exploitation More Likely" per Microsoft, patched in the June 2026 Windows updates) is a local
      privilege-escalation flaw in Windows Collaborative Translation Framework (CTF). Several
      Text Services Framework processes that always run as Local System — including consent.exe, the
      UAC elevation-prompt dialog — open a named memory section with a fixed, predictable name. A
      malicious local process can redirect that name to a different section via a Windows-object
      symbolic link, gaining full read/write access to the section's contents and using that access
      for arbitrary code execution as Local System. Microsoft's fix loads the section without honoring
      symbolic links. Security researcher Nightmare-Eclipse found the flaw and published a
      proof-of-concept, since deleted; 0patch reproduced it from the PoC and released free micropatches
      for legacy Windows systems. Same researcher already tracked by this pipeline's registry for two
      other 2026 Windows LPE disclosures (RogueDefender TOCTOU / trend:nightmare-eclipse-rogueplanet-
      defender-toctou-lpe-2026-06, and LegacyHive / trend:nightmare-eclipse-legacyhive-profile-registry-
      hijack-2026-07, covered as CVE-2026-62832) — this is a third, distinct disclosure from the same
      researcher in the same run of Windows local-elevation research.
    region_nexus: "global; any Windows endpoint with local/unprivileged code execution as a starting foothold"
    primary_sector_nexus: "indirect"
    sector: "public-sector"
    cves: ["CVE-2026-45586"]
    techniques: [T1068]
    affected_products: ["Windows Collaborative Translation Framework", "Microsoft Windows"]
    entity_keys: []
    new_entities:
      - { key: "trend:nightmare-eclipse-greenplasma-ctf-symlink-lpe-2026-06", type: trend, name: "GreenPlasma",
          aliases: [],
          summary: "Nightmare-Eclipse's named-object symbolic-link redirection technique against Windows Collaborative Translation Framework processes (including consent.exe) running as Local System, patched by Microsoft in June 2026 updates as CVE-2026-45586 and reported on by 0patch on 2026-08-10. Third distinct disclosure by the same researcher tracked in this registry alongside trend:nightmare-eclipse-rogueplanet-defender-toctou-lpe-2026-06 and trend:nightmare-eclipse-legacyhive-profile-registry-hijack-2026-07 (0patch, 2026-08-10)." }
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "Several Text Services Framework processes that always run as Local System (e.g., consent.exe, the dialog that asks the user for approval or credentials upon elevation) employ a named memory section with a fixed name, which a malicious local process can redirect to some other section using symbolic links for Windows objects."
        attribution: "0patch (ACROS Security), 2026-08-10"
        source_url: "https://0patch.com/blog/micropatches-released-for-greenplasma-windows-collaborative-translation-framework"
      - quote: "Microsoft fixed this issue by loading the section without honoring symbolic links."
