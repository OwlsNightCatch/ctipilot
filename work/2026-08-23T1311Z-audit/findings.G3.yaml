  - title: "SANDCLOCK forensics: TeamPCP's backdoored Trivy GitHub Action harvested 415,000+ CI/CD secret files from 898 organisations before poisoning LiteLLM's own PyPI package — including Microsoft, IBM, NVIDIA and US GovCloud tenants"
    sources:
