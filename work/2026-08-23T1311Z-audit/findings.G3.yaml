  - title: "Wiz's autonomous AI red-teaming agent found and exploited a GitHub Actions command-injection flaw in Snowflake's public connector repo, exfiltrating live Jira credentials from the CI runner via out-of-band callback"
    sources:
      - { url: "https://www.wiz.io/blog/red-agent-snowflake-copilot-cicd-bug", publisher: "Wiz Research", date: "2026-08-17", role: "primary" }
    discovery_trace: "first seen at: wiz-blog, URL https://www.wiz.io/blog (listing) → drilled item 5 → primary: Wiz Research, URL https://www.wiz.io/blog/red-agent-snowflake-copilot-cicd-bug (no further pivot needed)"
    summary: |
      Wiz's autonomous AI red-teaming tool, Red Agent, independently discovered a GitHub Actions workflow-injection vulnerability in Snowflake's public snowflake-connector-net repository. A GitHub Copilot-assisted pull request (PR #1218, merged 2026-06-18) had replaced a safe env:-variable + jq --arg parsing pattern in the jira_issue.yml workflow with direct template expansion of an untrusted field: `TITLE=$(echo '${{ github.event.issue.title }}' | sed ...)`. A single unescaped quote in a GitHub issue title breaks out of the shell string, and the workflow's actor check (validating github.event.pull_request.user.login against a bot name) is silently ineffective on issue-triggered events, where that field is always null — letting any GitHub user trigger the injection by simply opening an issue with a crafted title. The CI/CD trust boundary abused was the GitHub Actions runner itself, which held live JIRA_API_TOKEN, JIRA_USER_EMAIL and JIRA_BASE_URL secrets; Red Agent's payload exfiltrated the base64-encoded credentials via an out-of-band curl callback. Notably, when Red Agent's first payload attempt (using a `#` comment character) caused a bash syntax error, the agent autonomously diagnosed the failure and revised its payload to properly close the shell string — an agentic error-recovery behaviour Wiz documents as evidence the discovery process itself required no human intervention after initial task framing. Wiz reported the flaw via HackerOne (#3819931) on 2026-06-23; Snowflake patched the same day (commit 1dc7766, PR #1402, restoring the safe pattern) and rotated the exposed token the following day, confirming no unauthorized third-party access occurred during the roughly five-day exposure window. GitHub Advanced Security had scanned the final PR revision and did not flag the injection. Public disclosure followed on 2026-08-17.
    region_nexus: "global CI/CD exposure class; directly actionable for any organisation running GitHub Actions workflows that interpolate untrusted event fields (issue/PR titles, labels, comments) into shell commands — a pattern common across public-sector and enterprise open-source-adjacent repositories"
