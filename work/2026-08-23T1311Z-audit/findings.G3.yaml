  - title: "CNCMachineRMS: an undocumented remote-access trojan delivered through a four-stage BabaDeda loader chain that smuggles shellcode via a benign Windows date-formatting API"
    sources:
      - { url: "https://www.levelblue.com/blogs/spiderlabs-blog/cncmachinerms-the-undocumented-rat-at-the-end-of-a-babadeda-chain", publisher: "LevelBlue SpiderLabs", date: "2026-08-10", role: "primary" }
