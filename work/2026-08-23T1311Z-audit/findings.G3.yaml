  - title: "Claroty Team82: authentication bypass and post-auth RCE in Danfoss AK-SM 800A refrigeration controllers via an undocumented 'code-of-the-day' mechanism"
    sources:
      - { url: "https://claroty.com/team82/research/freeze-the-controller-defrost-the-food-uncovering-vulnerabilities-in-danfoss-refrigeration-controllers", publisher: "Claroty Team82", date: "2026-08-09", role: "primary" }
