    discovery_trace: "first seen at: resecurity, URL https://www.resecurity.com/blog (listing) → drilled item 2 → primary: Resecurity, URL https://www.resecurity.com/blog/article/the-litellm-supply-chain-attack-teampcp-sandclock-cicd-credential-harvesting-campaign-via-a-backdoored-trivy-github-action (no further pivot needed)"
    summary: |
      Resecurity published forensic detail on the root-cause upstream compromise behind the "LiteLLM supply-chain attack" this pipeline already covered on 2026-08-15 (via a SOCRadar re-analysis, entity actor:teampcp already registered). TeamPCP backdoored the widely trusted aquasecurity/trivy-action GitHub Action on 2026-03-19; when downstream CI/CD pipelines auto-installed the poisoned Action, its embedded SANDCLOCK stealer escalated to root on the GitHub Actions runner and swept SSH keys, cloud credentials, Kubernetes tokens, .env files and in-memory secrets (reading directly from /proc/<pid>/mem), writing timestamped dump files to the runner's local disk. Resecurity's dataset — corroborated by the backdoored Action appearing directly in victim manifests and by GitHub Actions-specific credential markers (system.github.token present in roughly 98% of captured files) — puts the harvest at 415,427 secret files across 898 GitHub organisation owners and 2,038 repositories in two waves (19-20 March: 240,842 files; 23-24 March, after a 22 March lull: 167,708 files), named victims including Microsoft, Azure, IBM, NVIDIA, PayPal, Deloitte, S&P Global and a US GovCloud tenant. The attacker then weaponized stolen PyPI publishing tokens harvested from the LiteLLM maintainers' own CI runners to publish poisoned litellm==1.82.7/1.82.8 packages on 2026-03-24 — the second-order compromise that produced the widely reported "2,500-organisation LiteLLM breach," which this pipeline's 2026-08-15 entry already established was 95% attributable to the Trivy compromise rather than the LiteLLM package itself. TeamPCP's SANDCLOCK stealer is separately already tracked in the registry as having also backdoored the Checkmarx Jenkins AST plugin in May 2026 — this Trivy compromise, dated March 2026, is an earlier and larger use of the same tool against a different CI/CD supply-chain vector.
