  - title: "Kudelski Security: North Korean IT-worker infrastructure overlaps with a Bismarck-linked gambling-platform operation and the FakeCalls Android banking trojan, reconstructed via GEOINT on named training institutions"
    sources:
      - { url: "https://kudelskisecurity.com/research/inside-north-koreas-cybercrime-ecosystem-fake-it-workers-gambling-networks-and-malware", publisher: "Kudelski Security", date: "2026-08-12", role: "primary" }
