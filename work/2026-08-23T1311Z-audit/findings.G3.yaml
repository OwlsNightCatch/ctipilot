  - title: "SilkParasite: a China-nexus espionage cluster fields seven custom RAT families (five newly documented) against Central Asian governments, using Google Drive's own API as a covert command channel"
    sources:
      - { url: "https://www.bitdefender.com/en-us/blog/businessinsights/silkparasite-tracking-china-nexus-apt-across-central-asia", publisher: "Bitdefender Labs", date: "2026-08-19", role: "primary" }
      - { url: "https://industrialcyber.co/ransomware/bitdefender-traces-silkparasite-cyberespionage-campaign-across-central-asia-to-seven-rat-families-china-nexus-tooling/", publisher: "Industrial Cyber", date: "2026-08-20", role: "corroborating (relay of the same primary)" }
    discovery_trace: "first seen at: industrialcyber-co, URL https://industrialcyber.co/feed/ (RSS feed) → item 'Bitdefender traces SilkParasite...' → primary: Bitdefender Labs, URL https://www.bitdefender.com/en-us/blog/businessinsights/silkparasite-tracking-china-nexus-apt-across-central-asia"
    summary: |
      Bitdefender Labs (Marius Andrei Baciu, Gheorghe Adrian Schipor, Victor Vrabie) published a year-long investigation into SilkParasite, a China-nexus (medium confidence) espionage cluster targeting government ministries in Uzbekistan, Turkmenistan, Kyrgyzstan, Tajikistan and Kazakhstan (one sample also recovered in Georgia), assessed to be exploiting Russia's declining regional influence as China expands economic engagement. The arsenal spans seven custom RAT families across four languages (.NET, C++, Go, JavaScript) — five entirely new: DriveSilkRAT, CookiETagRAT, NomadRAT, GoginRAT and NodeEdgeRAT — alongside two previously documented families, SpiceRAT (Cisco Talos's SneakyChef cluster) and BloodAlchemy (ShadowPad/Deed RAT lineage, also used by FamousSparrow). The standout technique is DriveSilkRAT's use of a Google Drive shared folder as its command-and-control channel: infected hosts poll the folder for tasking, execute in-memory .NET plugins, and upload results back to the same location, blending malicious traffic into routine cloud-sync activity a network monitor or email gateway is unlikely to flag ("Living off Trusted Services"). Other families favour HTTP Cookie/ETag-header-hidden commands with per-victim ChaCha20 encryption (CookiETagRAT) or impersonate a legitimate Kyrgyz hosting-provider domain (NodeEdgeRAT). Initial access is spear-phishing with malicious Office documents in password-protected RAR archives (the password supplied in the email body defeats sandbox scanning); one macro checks for Kaspersky's avp.exe process before executing, and signed-application DLL side-loading (via Calibre, ABBYY FineReader, Quick Heal, Windows Defender's own MpDefenderCoreService, and Mp3tag binaries) drops the first-stage payload. Bitdefender assesses, at medium confidence, that development was AI-assisted rather than AI-generated: GoginRAT ships leftover Go test functions and a hardcoded sequential AES key ("0123456789abcdef") in release binaries, NodeEdgeRAT contains a literal placeholder string ("change_this_key"), and NomadRAT/GoginRAT share near-identical architecture across two different languages — all consistent with a capable human team using AI to accelerate reusable-pattern development rather than volume-generate code. Attribution to China rests on the SpiceRAT/SneakyChef link, China Unicom backbone infrastructure, UTC+8 operator timestamps, and DLL side-loading as the primary delivery mechanism.
    region_nexus: "Central Asia and South Caucasus targeting; the C2-via-trusted-cloud-service technique (Google Drive API abuse) and the password-protected-archive sandbox-evasion pattern are directly transferable hunt/detection concepts for any government-sector email-security and egress-monitoring programme, including the constituency's own"
