    summary: |
      LevelBlue SpiderLabs documented CNCMachineRMS, a previously undocumented ~1.14 MB x64 remote-access trojan delivered via a multi-stage BabaDeda loader chain. Initial access is a ClickFix-style lure that has the victim execute a legitimately signed IBM SPSS IDE executable (WinWrapIDE.exe), whose built-in COM scripting engine is abused to load a malicious DLL. Four decoy DLLs load through ordinary Windows import resolution before the final stage smuggles shellcode into execution via EnumTimeFormatsEx — an otherwise benign Windows date-formatting enumeration API repurposed as a code-execution vector, a technique unlikely to be flagged by API-call monitoring tuned to conventional injection primitives. The resulting implant resolves its API calls by hash at runtime, builds every string on the stack rather than storing them in the binary, and runs a custom scripting language over a custom binary C2 protocol, giving the operator an interactive shell, file manager, screenshot capability, and a local-account-creation backdoor (Windows Event IDs 4720/4732) with seven separate persistence mechanisms and twenty typed commands for staged payload delivery. SpiderLabs assesses that any host found running this implant should be treated as a hands-on-keyboard incident, not a commodity infection.
    region_nexus: "global; BabaDeda-chain ClickFix lures have been a recurring initial-access vector across the sectors this pipeline tracks"
