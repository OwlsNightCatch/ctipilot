watch_item_verdicts:
  - item: "Bloctel / Afpa (France) leak-site claims"
    bloctel_status: "RESOLVED — DGCCRF (first-party French consumer-protection authority) confirmed the leak in an official press release on 2026-08-12: fraudulent access to a partner professional's account exposed ~3M phone numbers, 600,000 from the Bloctel opt-out list; only phone numbers exposed, Bloctel's own database not compromised. Filed as a new item above."
    afpa_status: "STILL UNCORROBORATED as of 2026-08-23. The only material remains the 2026-08-07 criminal-forum claim by an actor tracked as 'Cybernox' (101 AFPABox user accounts plus alleged admin-interface credentials), relayed by cyberattaque.org, frenchbreaches.com and ZATAZ. No statement from Afpa (France's national adult vocational-training agency) or any regulator has appeared confirming, denying, or scoping the claim. Resolution condition (first-party Afpa statement or A/B-grade journalism confirming scope) not met — do not publish."
  - item: "Berlin state network (Landesnetz) compromise"
    status: "STILL UNPUBLISHABLE — resolution condition not met as of 2026-08-23. Two Berlin Senate administrations (Stadtentwicklung/Bauen/Wohnen; Mobilität/Verkehr/Umwelt/Klimaschutz) were isolated from the Landesnetz on 2026-08-14/15 after forensic work found what the Senatskanzlei calls an 'Inkriminierung des Landesnetzes' (network compromise) — that is the only technical term any named authority (Senatskanzlei, BSI, LKA, Staatsanwaltschaft Berlin) has used on the record through 2026-08-19/21. No named authority has stated an initial-access vector, a vulnerable product, or a CVE. The only vector-shaped claim found — that the entry point was unmigrated IT still run by the Stadtentwicklung administration outside the central ITDZ service, per blogspan.net dated 2026-08-18 — is explicitly sourced to anonymous 'Behördenkreise' (government circles), not an on-the-record statement; Tagesspiegel's technical piece (2026-08-18) likewise attributes the only vector-adjacent detail ('informierte Kreise') to unnamed sources; a boerse-express.com piece states a Bauverwaltung-IT vulnerability was exploited with no attribution at all. Do not publish until a named authority states a surface, product, or CVE."
  - item: "Zurich District Court LockerGoga / MegaCortex / Nefilim trial"
    status: "CONFIRMED — verdict date unchanged at 2026-09-10, no early verdict delivered. therecord.media (2026-08-17/18 coverage) and inside-it.ch (2026-08-18) both report prosecutors requested a 12-year sentence and CHF 1.8M forfeiture at the 2026-08-17 hearing, with judgment due 2026-09-10. No new item filed — this is a status check on the already-published 2026-08-18/zurich-trial-lockergoga-megacortex-nefilim-swiss-victims entry; nothing has changed."

