      - { url: "https://lecafedugeek.fr/piratage-de-bloctel-la-dgccrf-confirme-une-fuite-massive-de-numeros-de-telephone/", publisher: "Le Café du Geek", date: "2026-08-14", role: "corroborating" }
      - { url: "https://next.ink/251482/baroud-dhonneur-pour-bloctel-avec-la-fuite-de-600-000-numeros-opposes-au-demarchage/", publisher: "Next (Sébastien Gavois)", date: "2026-08-12", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"Bloctel DGCCRF fuite données confirmée août 2026\") — this is a resolution check on an open watch item carried from the 2026-08-09 audit, not a fresh discovery → primary: DGCCRF press release, URL https://presse.economie.gouv.fr/la-dgccrf-met-en-garde-les-consommateurs-a-la-suite-dune-fuite-de-donnees-sur-bloctel/ → corroboration: Le Café du Geek, URL https://lecafedugeek.fr/piratage-de-bloctel-la-dgccrf-confirme-une-fuite-massive-de-numeros-de-telephone/ and Next, URL https://next.ink/251482/baroud-dhonneur-pour-bloctel-avec-la-fuite-de-600-000-numeros-opposes-au-demarchage/"
    summary: |
      The DGCCRF (France's consumer-protection and fraud-repression directorate, which operated Bloctel, the national telemarketing
      opt-out registry, via processor Consoprotec) confirmed on 2026-08-12 that an attacker obtained fraudulent access to a partner
      professional's account and downloaded commercial-prospecting files containing roughly 3 million phone numbers in plaintext, of
      which 600,000 belonged to individuals registered on Bloctel's do-not-call list. This is not a breach of Bloctel's own database or
      infrastructure: the entry point was a third-party partner account with legitimate read access to prospecting lists that happened to
      cross-reference the opt-out registry, and the numbers were stored unencrypted in those partner-side files. DGCCRF states no other
      personal data (name, address) was exposed, the compromised account was blocked immediately, all professional accounts underwent
      verification, and CNIL was notified. The disclosure landed five days before Bloctel's statutory shutdown on 2026-08-11 under Article
      13 of the law of 30 June 2025. For defenders, the mechanism is the recurring one for any registry or lookup service exposed via
      third-party/partner API or file-sharing access: the trust boundary an attacker needs to defeat is not the platform's own edge, it is
      the weakest downstream account with legitimate query/export rights over sensitive index data — a pattern equally applicable to
      Swiss or EU do-not-call, beneficial-ownership, or civil registries operated through delegated partner access.
