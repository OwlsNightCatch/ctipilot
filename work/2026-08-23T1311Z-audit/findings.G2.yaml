items:
  - title: "DGCCRF confirms the Bloctel telemarketing opt-out registry data leak this pipeline's prior audit had flagged as an uncorroborated criminal-forum claim — 3 million phone numbers, 600,000 from the do-not-call list, taken via a compromised partner account"
    sources:
