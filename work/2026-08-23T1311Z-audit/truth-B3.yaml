- entry: entries/2026-08-11/cve-2026-65400-screensharingd-remote-root-two-preauth-bugs.md
  verdict: imprecision
  defect: >-
    The cves[] record carries cvss "7.1" but neither cited source states any CVSS at all — the fetched
    Calif and Huntress pages contain no occurrence of "CVSS", "7.1" or "9.8". The 7.1 is carried over
    from the 2026-08-08 original, whose sourcing_note attributed it to NCSC-NL; this update dropped that
    attribution while raising the framing to "pre-auth remote root confirmed", so the frontmatter score
    now sits unsourced and materially below the other published rating. All four evidence[] quotes are
    verbatim (the Calif "runs as root" quote differs only by whitespace inserted where <code> tags were
    stripped, and the Huntress pre-auth-hardening quote matches character for character).
  ground_truth: >-
    Apple publishes no severity score. NCSC-NL advisory NCSC-2026-0280 lists "CVE-2026-65400 - CVSS (v3)
    7.1". NVD's CISA-ADP record for the same CVE gives CVSS 3.1 9.8 CRITICAL,
    CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H, CWE-287, with Apple Inc. as CNA. CISA added
    CVE-2026-65400 to KEV on 2026-08-18 (after this entry). Fixed builds macOS 26.6.1 / 15.7.9 / 14.8.9
    confirmed by both Calif and Huntress.
  ground_truth_url: https://advisories.ncsc.nl/2026/ncsc-2026-0280.html

