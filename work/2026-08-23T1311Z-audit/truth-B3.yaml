    The sources[] record for the MSRC CVE-2026-55040 page carries date "2026-08-11" and the body cites it
    as "[MSRC, 2026-08-11]". Microsoft's record for that CVE was released 2026-07-14 and has never been
    revised — a four-week citation-date drift, and one the entry's own cves[] field contradicts
    ('fixed: "July 2026 Patch Tuesday updates (MSRC release date 2026-07-14)"'). No claim rests on the
    wrong date; the scores, CWEs, severities and all three evidence[] quotes are verbatim-correct.
  ground_truth: >-
    MSRC CVE-2026-55040: releaseDate and latestRevisionDate both 2026-07-14T07:00:00-07:00, releaseNumber
    "2026-Jul", baseScore 9.1, CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N, CWE-1390, severity Critical,
    exploited No, publiclyDisclosed No, "Exploitation More Likely". MSRC CVE-2026-63520: releaseDate
    2026-08-11, baseScore 8.1, CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H, CWE-20, severity Important.
    Rapid7 verbatim: "this vulnerability is the second in a pair of exploits which, when chained
    together, comprise a critical unauthenticated remote code execution vulnerability in a vulnerable
    SharePoint server. Patches are available for SharePoint Server Subscription Edition, 2019, and 2016.
    Alongside today's coordinated disclosure of CVE-2026-63520, Rapid7 has now published a detailed
    technical analysis and proof-of-concept for CVE-2026-55040, the first vulnerability in the chain."
    Stephen Fewer credited as discoverer.
