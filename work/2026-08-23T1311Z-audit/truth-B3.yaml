- entry: entries/2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce.md
  verdict: factual-error
  defect: >-
    The entry states that Onapsis says "the fix removes the vulnerable servlet component in both cases
    rather than hardening it" for CVE-2026-44772 and CVE-2026-44758, and the cves[] record for
    CVE-2026-44772 repeats it as 'fixed: "Per SAP Security Note 3765948; the patch removes the vulnerable
    servlet component"'. Onapsis says that only of Note 3758900 (CVE-2026-44758). For Note 3765948
    (CVE-2026-44772) it says the opposite kind of remedy and names a REQUIRED post-patch configuration
    step the entry omits entirely — so an SAP Basis team following this entry would apply the note,
    record it as remediated, and never configure the allow-list the servlet now depends on.
  ground_truth: >-
    Onapsis on Note #3765948 (CVSS 9.9): "patches a vulnerable servlet that allows a low-privileged
    attacker to submit specially crafted input ... After implementing the patch, customers need to
    maintain the new system property 'Secure Transformer' with a list of allowed hosts for hosting XSL
    files. Only XSL files from these hosts can be consumed by the vulnerable servlet." Onapsis on Note
    #3758900 (CVSS 9.1): "In opposite to SAP Security Note #3765948, an attacker will need higher
    privileges which explains the slightly lower CVSS score. The patch removes the vulnerable servlet
    component." Everything else in the entry verified: SAP's own patch-day page gives 28 new notes + 1
    GitHub advisory (GHSA-hc5j-q32w-c25v) + 2 updates; Onapsis gives "thirty-three new and updated ...
    including five HotNews Notes and nine High Priority Notes" and "Eleven of the twenty-nine new
    Security Notes were published in contribution with the Onapsis Research Labs"; both evidence[] quotes
    are verbatim; the CVE-2026-34265 kernel list (KRNL64NUC 7.22/7.22EXT, KRNL64UC 7.22 ... 9.19, KERNEL
    7.22 ... 9.19) matches SAP's table exactly; CVSS 10.0/9.9/9.1/9.8/8.8/8.1 and note numbers all match.
  ground_truth_url: https://onapsis.com/blog/sap-security-patch-day-august-2026/

