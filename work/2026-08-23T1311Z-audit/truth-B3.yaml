- entry: entries/2026-08-12/lazarus-operation-dream-job-cve-2026-68820-afd-fudmodule.md
  verdict: factual-error
  defect: >-
    The second cves[] record inverts the authentication requirement of CVE-2025-49113: it is written
    'auth: pre-auth' with 'vector: zero-click'. The flaw is post-authentication. This contradicts the
    entry's own primary source, its own body text ("reaching the Roundcube instances by combining leaked
    credentials with the already-public CVE-2025-49113") and the per-CVE authority. A reader triaging
    from the machine-readable field would treat an internet-facing Roundcube instance as
    unauthenticated-RCE-exposed rather than credential-gated. Everything else in the entry verified,
    including the "sole exploitation-detected flaw in August Patch Tuesday" quantifier.
  ground_truth: >-
    Check Point: "Exploitation of this vulnerability requires authentication with valid Roundcube
    credentials. During our investigation, we identified several credential leaks that are available in
    the Darkweb ... We assess that the threat actor likely leveraged these credentials to authenticate to
    the affected Roundcube instances before exploiting CVE-2025-49113." NVD: "Roundcube Webmail before
    1.5.10 and 1.6.x before 1.6.11 allows remote code execution by authenticated users", NIST CVSS 3.1
    8.8 AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H, CWE-502. Separately confirmed correct: MSRC gives
    CVE-2026-68820 baseScore 7.0, CVSS:3.1/AV:L/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:H, exploited=Yes,
    publiclyDisclosed=No; a query of all 766 MSRC 2026-Aug CVEs returns CVE-2026-68820 as the only
    exploited=Yes record, so the "sole exploitation-detected" claim holds. Check Point verbatim confirms
    "its latest wave focuses on the defense sector in Europe and India", "successful targeting observed
    in Western Europe, including France and Germany", the France-headquartered organisation reused for
    spear-phishing "against targets worldwide", the 94-of-95 ETW GUID overlap, Smart App Control
    tampering, the services.exe -> SYSTEM msiexec.exe two-hop, Troy's 17 operator commands, three
    Enveil-impersonating sites with Enveil neither targeted nor compromised, and the
    28 Jul / 31 Jul / 5 Aug / 11 Aug disclosure timeline.
  ground_truth_url: https://research.checkpoint.com/2026/shattering-the-dream-when-a-job-offer-becomes-a-zero-day-attack/

