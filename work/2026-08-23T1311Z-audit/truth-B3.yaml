- entry: entries/2026-08-13/clop-leak-site-names-44-victims-swiss-dutch-listings.md
  verdict: factual-error
  defect: >-
    Two load-bearing claims fail against the same tracker's stable per-group endpoint. (1) The count: the
    title, headline, summary and body all say 44 named Cl0p listings first recorded on 2026-08-12; the
    tracker records 42. (2) France: the summary and body say the batch's country codes include France
    ("alongside others in Finland, the United Kingdom, Italy, Slovakia, Hungary and France"); no record
    in the batch carries FR, while ES (Spain) — which the entry does not mention — is present. Since the
    entry states it characterises victims "only by the tracker's own country and activity fields", the FR
    claim fails against its own declared method. A third, structural weakness: the cited primary
    (api.ransomware.live/v2/recentvictims) is a rolling last-100-across-all-groups feed which today
    returns zero Cl0p records, so an immutable entry's primary source can never again support it.
  ground_truth: >-
    https://api.ransomware.live/v2/groupvictims/clop returns exactly 42 Cl0p victims with a `discovered`
    timestamp on 2026-08-12 (15:26:06Z to 15:49:44Z, 33-40 s apart — the entry's crawl-cadence
    observation is correct), and 0 on 2026-08-11 and 2026-08-13. Country distribution: US 18, IN 4, IT 3,
    GB 2, and one each of ES, SK, AU, HU, KZ, PE, CN, MX, FI, CH, TW, IR, CA, NL, plus one blank. No FR.
    Correct in the entry: the Dutch listing is filed under Healthcare (PHILIPS.COM) and the Swiss one
    under Retail & E-Commerce (MAMMUT.COM). Foresiet's evidence[] quote is verbatim ("the available
    leak-site information alone cannot establish the initial-access vector used against each listed
    organization"), as are the 42-masked-listing batch, the three "Windchil" spellings, the "no forensic
    access" caveat, the JSP web shells under the Windchill login directory and PTC's deserialization root
    cause. CVE-2026-12569 is in KEV since 2026-06-25 with knownRansomwareCampaignUse "Known"; note the
    frontmatter's cvss 9.8 is NVD's CVSS 3.1 value, while PTC as CNA scores it CVSS 4.0 9.3.
  ground_truth_url: https://api.ransomware.live/v2/groupvictims/clop

- entry: entries/2026-08-13/cve-2026-45659-sharepoint-kev-ransomware-use-flagged.md
  verdict: imprecision
  defect: >-
    classification.credibility is 1, which requires two independent assessors. Both cited sources trace
    to one assessor, CISA: the KEV catalogue is CISA's determination, and BleepingComputer reports that
    determination rather than assessing ransomware use itself — as the entry's own sourcing_note
    concedes ("BleepingComputer independently reports the change as having been made on 11 August, which
    is what establishes it as a change"). The same run applies the stricter reading elsewhere: the
    Siemens entry of 2026-08-13 sets credibility 2 and explains that CERT-FR and NCSC-NL "are
    corroborating publishers of the vendor's assessment rather than independent assessors ... which is
    why credibility is 2 rather than 1". Every factual claim in the entry is correct.
  ground_truth: >-
    CISA KEV (catalogVersion 2026.08.21) CVE-2026-45659: dateAdded 2026-07-01, dueDate 2026-07-04,
    knownRansomwareCampaignUse "Known", shortDescription "Microsoft SharePoint Server contains a
    deserialization of untrusted data vulnerability which allows an authorized attacker to execute code
    over a network." — matching the entry's evidence[] quote verbatim. BleepingComputer (2026-08-12,
    Sergiu Gatlan): "a high-severity Microsoft SharePoint remote code execution vulnerability
    (CVE-2026-45659), flagged as actively exploited since early July, is now also being exploited by
    ransomware gangs" and "Since November 2021, the cybersecurity agency has flagged 14 actively
    exploited Microsoft SharePoint vulnerabilities, with eight of them also exploited in ransomware
    attacks."
  ground_truth_url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json

