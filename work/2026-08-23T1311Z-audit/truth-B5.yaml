- entry: entries/2026-08-16/weekly-w33-disclosure-to-exploitation-interval-collapsed.md
  verdict: imprecision
  defect: >-
    The GeoServer paragraph says the SQL injection "had no vendor, no CVE and no
    patch behind it at all". GeoServer is an OSGeo project with an active release
    process, and it shipped fixed releases on 14 August 2026 — two days before
    this entry was published. The claims are time-scoped to the 12–14 August
    window and are true of that moment, but "no vendor" is inaccurate and the
    no-patch framing was stale at publication. Every other figure verifies
    exactly (all seven evidence quotes verbatim; SAP, SharePoint, macOS, vCenter
    and GeoServer timelines all confirmed).
  ground_truth: >-
    GeoServer 3.0.1, 2.28.5 and 2.27.6 were announced on 14 August 2026 fixing
    the unauthenticated jsonArrayContains SQL injection (GHSA-mqjf-5f49-2fjh,
    later CVE-2026-76904, CVSS 9.8). Calif's "We start on the 26.6.1 diff, and
    have a working exploit about four hours later", NCSC-NL's "In al deze
    gevallen was root toegang verkregen ... Monero crypto miner geplaatst",
    Defused's two SAP quotes and the Rapid7-PoC SharePoint quote, watchTowr's
    "hundreds of attempts" quote and QUIRSO's disclosure-correlation quote are
    all verbatim on their cited pages.
  ground_truth_url: https://geoserver.org/announcements/vulnerability/2026/08/14/geoserver-3-0-1-released.html

