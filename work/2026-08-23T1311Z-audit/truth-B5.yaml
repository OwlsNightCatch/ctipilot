- entry: entries/2026-08-16/weekly-w33-vuln-status-rollup.md
  verdict: factual-error
  defect: >-
    Two defects. (1) The GeoServer jsonArrayContains injection is presented under
    the heading "Exploited with no identifier, and unpatched", described as
    having "no vendor patch available", and counted inside "eight flaws with no
    fix in existence" — but GeoServer had shipped fixed releases two days before
    publication, so the count is seven and the status is wrong. (2) The summary
    files CVE-2026-71362 (Adobe Commerce) under "Newly confirmed exploited or
    newly KEV-listed"; it is neither. Adobe states it is not aware of any
    exploits in the wild, the flaw is not in the KEV catalogue, and the body's
    own careful wording ("the exploitation signal is a forensics vendor's")
    contradicts the summary.
  ground_truth: >-
    GeoServer 3.0.1 / 2.28.5 / 2.27.6 were released 14 August 2026 for this flaw
    (GHSA-mqjf-5f49-2fjh, CVE-2026-76904). APSB26-92 states "Adobe is not aware
    of any exploits in the wild for any of the issues addressed in these updates"
    and scores CVE-2026-71362 at 9.1 (AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N);
    the KEV catalogue (version 2026.08.21) does not contain it. Everything else
    verifies: CISA added exactly three CVEs on 2026-08-11 (CVE-2026-20349,
    CVE-2026-68820, CVE-2026-72898); Cisco's advisory states "In August 2026, the
    Cisco Product Security Incident Response Team (PSIRT) became aware of active
    exploitation of this vulnerability", with no workaround and per-train hot
    fixes; Metabase CVE-2026-72898 is CVSS 10.0; CVE-2026-45659 carries KEV
    ransomware use "Known" and was added 2026-07-01; Siemens SSA-834709 scores
    CVE-2026-58115 at 10.0; CISA's ICS advisory scores CVE-2026-19188 at 10.0;
    Sansec states "Sansec Shield already blocks exploitation attempts."
  ground_truth_url: https://geoserver.org/announcements/vulnerability/2026/08/14/geoserver-3-0-1-released.html

