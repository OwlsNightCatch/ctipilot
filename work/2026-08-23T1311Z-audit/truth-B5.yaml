- entry: entries/2026-08-16/weekly-w33-looking-ahead.md
  verdict: factual-error
  defect: >-
    The GeoServer bullet asserts as a live, forward-looking item that the
    unauthenticated SQL injection "has no CVE and no vendor patch" and that
    "Until OSGeo ships a fix, taking query endpoints off the public internet is
    the whole remediation". OSGeo had already shipped the fix two days before
    this entry was published. A reader working this watch list would have
    deferred an available upgrade on an actively exploited pre-auth SQL injection
    sitting under public-sector geoportals.
  ground_truth: >-
    GeoServer announced 3.0.1, 2.28.5 and 2.27.6 on 14 August 2026, each fixing
    the unauthenticated jsonArrayContains SQL injection against PostGIS layers
    (GeoTools advisory GHSA-mqjf-5f49-2fjh; CVE-2026-76904 assigned, CVSS 9.8).
    NCSC-CH's own hub post 12844 was edited on 2026-08-17 with the reason
    "Updated with fixed versions" and now lists all three releases. The other six
    bullets verify — ETSI's procedure-window quote, watchTowr via SecurityWeek,
    UODO/Gazeta Prawna on the notification duty, ~12,000 facilities via Notes
    from Poland, NCSC-NL's registration duty, and BleepingComputer's 43-victim
    Cl0p count — as do the ShieldBreak (tested on Server 2025 / Win 11 25H2, no
    patch, no vendor comment) and FreeBSD CTL HA (three pre-auth bugs behind
    TCP/999, documentation-only response, enabled on TrueNAS Enterprise HA)
    items.
  ground_truth_url: https://geoserver.org/announcements/vulnerability/2026/08/14/geoserver-3-0-1-released.html

