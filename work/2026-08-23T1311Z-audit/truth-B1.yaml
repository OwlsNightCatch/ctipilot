- entry: entries/2026-08-09/weekly-w32-cve-record-unreliable-in-both-directions.md
  verdict: factual-error
  defect: >-
    The entry lists Traefik among flaws that "shipped with no CVE assigned" and states that
    "Traefik's three tenant-isolation advisories, one of which lets a Kubernetes namespace
    silently take over another's routes, state that no CVE identifiers were assigned", citing
    GHSA-fgjj-px3w-67xx. That advisory carries CVE-2026-71327, which was reserved 2026-08-05 and
    published 2026-08-06 — three days before this entry was composed on 2026-08-09. The Metabase
    and WALLIX and Check Point "no CVE" claims in the same paragraph are correct (Metabase's
    CVE-2026-72898 was only reserved/published 2026-08-10, after publication; Check Point's page
    states Cloudflare assigned no CVEs; WALLIX carries only WSA identifiers), so the false-negative
    thesis survives — but the Traefik example does not.
  ground_truth: >-
    GHSA-fgjj-px3w-67xx ("Gateway API route identity collision allows cross-namespace backend
    hijacking") carries CVE-2026-71327, CWE-694, assigner GitHub_M, dateReserved
    2026-08-05T18:14:42Z, datePublished 2026-08-06T16:38:11Z; affected v3.0.0–v3.6.24 and
    v3.7.0–v3.7.9, patched v3.6.25 / v3.7.10.
  ground_truth_url: https://cveawg.mitre.org/api/cve/CVE-2026-71327

