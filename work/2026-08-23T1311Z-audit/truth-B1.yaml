- entry: entries/2026-08-09/weekly-w32-passkeys-attacked-from-three-directions.md
  verdict: factual-error
  defect: >-
    The entry states in both summary and body that "At Black Hat USA 2026, Dirk-jan Mollema showed
    that malware in an already-signed-in Windows session..." No cited source places this work at
    Black Hat USA 2026, and the venue attribution appears to be invented from the coincidence of
    the blog's 2026-08-05 publication date with Black Hat week. The source is a standalone blog
    post; the only conference it names is DEF CON 32 (2024), as prior background. The Hacker News
    corroborating source likewise makes no Black Hat reference. Everything else in the entry checks
    out exactly, including both Mollema evidence quotes (verbatim, contiguous), the three Unit 42
    passkey attacks and the non-rotatable security-domain secret, the UNC6671 BlackFile-plus-four-
    brands vishing chain, and THN's "no CVE / left as-is / requests for comment pending" framing.
  ground_truth: >-
    dirkjanm.io "Borrowing Windows Hello keys for authentication and persistence" —
    article:published_time 2026-08-05T12:00:57+00:00, dateModified 2026-08-20. The string
    "Black Hat" does not occur on the page; the research background section cites "a talk with
    Ceri Coburn at DEF CON 32". The Hacker News coverage of 2026-08-07 also contains no Black Hat
    reference.
  ground_truth_url: https://dirkjanm.io/borrowing-windows-hello-keys/

