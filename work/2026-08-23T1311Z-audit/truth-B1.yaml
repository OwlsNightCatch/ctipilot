- entry: entries/2026-08-09/weekly-w32-vuln-status-rollup.md
  verdict: imprecision
  defect: >-
    The headline says "five new KEV listings" and the status table records CVE-2026-18577 as
    "exploited" with no KEV marker, while the other five carry "exploited · KEV". CVE-2026-18577
    was in fact added to the KEV catalogue on 2026-08-03, inside ISO week 2026-W32 (03–09 August),
    so six of the week's CVEs were newly catalogued, not five. The under-count does not change any
    reader action — the entry already treats CVE-2026-18577 as exploited and requiring Hotfix 2 —
    which is why this is an imprecision rather than an error. All five other KEV dates in the entry
    are exact (18556, 34486, 9198 on 2026-08-04; 63077 on 2026-08-05; 8037 on 2026-08-07), as are
    the Cisco FMC advisory state (CVE-2026-20079, CVSS 10.0, advisory version 2.4 last updated
    2026-08-05) and the three verbatim quotes.
  ground_truth: >-
    CISA KEV catalogVersion 2026.08.21: CVE-2026-18577, N-able N-central, dateAdded 2026-08-03,
    "N-able N-central Authentication Bypass Using an Alternate Path or Channel Vulnerability …
    the result of an incomplete patch for CVE-2026-18556".
  ground_truth_url: https://www.cisa.gov/known-exploited-vulnerabilities-catalog

