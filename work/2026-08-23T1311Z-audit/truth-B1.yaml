- entry: entries/2026-08-09/weekly-w32-kerberos-identity-confusion-poc-public.md
  verdict: imprecision
  defect: >-
    The entry twice frames the disclosure as "At Black Hat USA 2026, Semperis published the full
    technical detail and a proof-of-concept". Neither cited source supports the venue: the
    Semperis blog contains no occurrence of "Black Hat" (it names DEF CON 32 only, and only as
    background), and the other source is the NVD API. The claim is true — Semperis did present
    "Identity Crisis" at Black Hat USA 2026 — so this is thin attribution, not a false fact.
    Every other checked element is exact: CVE-2026-25177 CVSS 3.1 base 8.8 published 2026-03-10,
    CVE-2026-27912 CVSS 3.1 base 8.0 published 2026-04-14, both NVD descriptions quoted correctly,
    and all three Semperis quotations (including "The TGS-REQ is where the PAC_REQUESTOR_SID
    validation occurs") are verbatim.
  ground_truth: >-
    The Semperis post carries no Black Hat reference; the Black Hat USA 2026 briefing
    "Identity Crisis: Novel Vulnerabilities Leading to Kerberos Downgrade, DoS, and Full Domain
    Takeover" by Shai Laron is documented in Semperis's own Black Hat press release, which the
    entry does not cite.
  ground_truth_url: https://www.semperis.com/press-release/semperis-takes-center-stage-at-black-hat-usa/

