- entry: entries/2026-08-15/fortiweb-radius-wildcard-bypass-fortimanager-fgfm.md
  verdict: clean
  defect: >
    Sampling limitation, not a confirmed defect: FortiGuard PSIRT advisory pages
    (FG-IR-26-158/-160/-157/-156) are behind a Cloudflare-style anti-bot challenge
    that blocked both WebFetch and the fetch_source.py bridge; all jina reader keys
    are exhausted (HTTP 402), so the primary CSAF records could not be read directly.
    Cross-checked against three independent secondary sources instead (RedLegg,
    CyCognito, SecurityWeek) which corroborate CVSS 8.8 for CVE-2026-26035 and the
    8.0/7.6/7.4/7.2 branch versions; one secondary (CyCognito) independently confirms
    a 7.0 branch exists (consistent with the entry's claim), while another (RedLegg)
    omits it entirely (consistent with the entry's claim that the human-rendered
    table differs from the CSAF machine record). No contradiction was found strong
    enough to call this a factual error.
  ground_truth: null
  ground_truth_url: null
