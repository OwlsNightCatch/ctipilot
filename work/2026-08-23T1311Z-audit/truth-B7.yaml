- entry: entries/2026-08-23/martigny-combe-valais-communal-mailbox-compromise.md
  verdict: imprecision
  defect: >
    Substance is sound, but classification credibility: 1 ("confirmed") overstates the
    corroboration the entry actually has. Only one party looked at this incident — the
    commune's external IT-security contractor, whose finding reaches the reader through
    the commune. Le Nouvelliste is that assessment's publisher (with its own interview and
    its own ~300-email count, which the entry correctly labels as the newspaper's), and
    ICTjournal states outright that it is reporting the commune's communique. That is one
    assessor with three publishers, which the Admiralty scale rates 2, not 1. The entry's
    own sourcing note already discloses the single-origin chain, so no repair is warranted.
    Separately noted, not as a defect: the Le Nouvelliste article body is paywalled and
    could not be re-read this pass (the jina rung is unavailable — all reader keys returned
    HTTP 402), so the French evidence quote could not be re-confirmed character-for-character;
    the page's visible headline, standfirst and photo caption independently carry every
    fact the quote supports ("300 courriels contenant des donnees sensibles ont ete voles",
    "un message frauduleux a ete massivement envoye a des contacts de la commune le 18 aout",
    "L'attaque remonte au 10 aout").
  ground_truth: >
    Commune communique (20 August 2026) confirms verbatim "L'incident a ete detecte le 18
    aout 2026", the immediate mailbox block, external specialists, notification of the OFCS
    and the Valais cantonal data-protection and transparency commissioner, and a criminal
    complaint "en cours" — and names no vector and no email count, exactly as the entry says.
    It names ANSAM/Alexis Clement as data-protection delegate; the entry correctly declines
    to connect that firm to the forensic work. No second investigating party appears in any
    of the three sources.
  ground_truth_url: https://martigny-combe.ch/uploads/default/id-1515-Communique-presse-incident-secu--20-08-26-.pdf

