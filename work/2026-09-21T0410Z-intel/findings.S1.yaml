      2026-09-18T03:12Z. Both 3-7 days stale. No fresher development found (no CVE
      assignment, no Valve advisory as of this run).
    - "ZcopyReaper" CVE-2026-43502 (Linux kernel RDS zero-copy send-path LPE) -
      originating disclosure is a 2026-09-08 oss-security mailing-list post from
      NebuSec (Yuan Tan), bundled with 20 other Linux kernel LPEs from the same
      automated exploit-generation pipeline. 13 days stale.
    - "Click2Shell" WordPress theme-preview-to-RCE chain - pwn.ai's own write-up
      dated 2026-09-18; WordPress 7.1.1 (the fix) shipped 2026-09-17. 3-4 days stale.
    - "BragJack" browser-extension AI-agent hijack (CVE-2026-0628 Chrome/Gemini,
      CVE-2026-55945 Edge) - Forever Security's (Gal Weizman) own write-up and
      BleepingComputer's article both dated 2026-09-19. 2 days stale.
