    extended_notes: |
      RESOLUTION OF THE TWO BACKLOG ROWS (per the spawn's priority task): the 2026-09-16-surfaced row (two
      competing uncorroborated criminal claims, xMetah ~971K and Cybernox ~1.73M) and the 2026-09-20-surfaced
      row (AFPA's "confirmed" 1.7M-person incident) are THE SAME underlying event, not two separate incidents.
      AFPA's own confirmation (via AFP/franceinfo, quoted by Clubic) explicitly references "deux hackers" who
      claimed data "mercredi et jeudi" (Wednesday/Thursday) — matching xMetah's 2026-09-15 and Cybernox's
      2026-09-16 claims exactly. This should be composed as ONE new entry, not two, and both backlog rows
      should be struck against it.
      Sourcing re-gate (per the spawn's explicit instruction): Clubic.com is a mainstream French consumer-tech
      outlet (comparable to a French PCMag/Engadget) that here relays an AFP wire story quoting AFPA's own
      deputy director's words directly to the press — this is Admiralty B journalism carrying the victim's own
      statement, not a bare aggregator repeating a criminal's claim. Cyberattaque.org and FrenchBreaches are
      C-reliability niche trackers, but here they are ALSO directly quoting/paraphrasing AFPA's own confirmation
      (not merely relaying the criminals' claims) — both explicitly attribute the "potential extraction" finding
      and the third-party-tool explanation to AFPA's own investigation. This satisfies MULTI-SOURCE without
      needing the single-source-victim carve-out. AFPA's own official site (afpa.fr) carries no dedicated press
      notice reachable from its /actualites listing; franceinfo's own article page (the ultimate primary AFP
      quote source) 403'd on every transport (direct, trafilatura, jina) and could not be independently
      fetched — Clubic's direct quotation is the best available anchor for AFPA's exact words.
      Registry note for the main agent: `actor:cybernox`'s current registry summary characterises it purely as
      a hacktivist (French/EU political-dossier leaks in protest of "Chat Control"). This AFPA episode (selling
      971K-1.7M personal records on a criminal forum) is financially-motivated data theft, a materially
      different modus operandi under the same handle — worth a registry-summary update noting the handle now
      spans both hacktivist leaks and for-profit data extortion, distinct from the DGFiP/Bloctel correlation
      which cyberattaque.org itself held as merely "plausible but unconfirmed" (already reflected in the
      2026-08-15 DGFiP entry's changelog).

  - title: "[NOT PUBLISHABLE — PD-6 BLOCKED, recommend new coverage-backlog row] Qilin ransomware group lists Touring Club Suisse (TCS), Switzerland's largest mobility club (1.6M members), on its leak site — bare claim only, no victim statement, no Admiralty A/B journalism"
    sources:
      - { url: "https://ransomware.live/id/VG91cmluZyBDbHViIFN1aXNzZUBxaWxpbg==", publisher: "ransomware.live (Qilin leak-site listing)", date: "2026-09-20", role: primary }
    discovery_trace: "first seen at: WebSearch (\"ransomware victim listed leak site September 20 2026 government\") → ransomware.live listing, URL https://ransomware.live/id/VG91cmluZyBDbHViIFN1aXNzZUBxaWxpbg== → pivot search (WebSearch \"Touring Club Suisse Qilin ransomware cyberattack\" and German-language \"TCS Touring Club Suisse Cyberangriff Hacker\") found no victim statement and no Admiralty A/B journalism pickup; only leak-site trackers (ransomware.live, RedPacketSecurity) repeat the claim."
    summary: |
      Ransomware.live recorded on 2026-09-20 that the Qilin ransomware group (`actor:qilin`, already tracked in
      this store) added Touring Club Suisse — Switzerland's largest mobility/roadside-assistance membership
      organization, with roughly 1.6 million members — to its Tor leak site, with an estimated attack date of
      2026-09-20. No data samples, file trees, or ransom figure accompany the listing. TCS's own channels carry
      no incident notice found in this search, and no German-, French- or English-language press pickup beyond
      leak-site aggregators (RedPacketSecurity) was found despite a targeted multilingual search. This is a bare
      leak-site claim that does NOT clear PD-6's fake-news guard as it stands — it is being surfaced here as a
      candidate for a NEW coverage-backlog row (not as a publishable finding) because of the unusually strong,
      fresh (surfaced within this run's 24h window) Swiss home-region nexus: TCS is a widely-used quasi-critical
      mobility/emergency-roadside-assistance service serving a substantial fraction of the Swiss population, and
      Qilin is a currently active RaaS operation already linked in this store to prior Swiss-adjacent activity
      (the CVE-2026-59310 vCenter Syslog entry's single-assessor ransomware finding; the Retelit Italian
      telco/public-administration-supplier entry).
