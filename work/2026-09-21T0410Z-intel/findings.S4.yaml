items:
  - title: "AFPA (French national adult-training agency) confirms a potential data extraction affecting up to 1.7 million people via a third-party accommodation-management tool — resolves the two competing criminal claims into one confirmed incident"
    sources:
      - { url: "https://www.clubic.com/actualite-630454-cyberattaque-de-lafpa-jusqua-17-million-de-dossiers-potentiellement-compromis-apres-une-faille-dun-prestataire.html", publisher: "Clubic (relaying AFP/franceinfo, quoting AFPA deputy director Pierre Prady directly)", date: "2026-09-20", role: primary }
      - { url: "https://www.cyberattaque.org/afpa-pres-dun-million-de-dossiers-revendiques-apres-une-cyberattaque/", publisher: "Cyberattaque.org", date: "2026-09-15 (updated through 2026-09-19/20)", role: primary }
      - { url: "https://frenchbreaches.com/alertes/afpa-mu4jbja3w3es4t7j0a8", publisher: "FrenchBreaches", date: "2026-09-16 (updated 2026-09-19)", role: corroborating }
    discovery_trace: "first seen at: state/coverage_backlog.md priority-task row (surfaced 2026-09-20 by 2026-09-20T1308Z-audit, and the related 2026-09-16 row for the two competing criminal claims) → WebSearch (\"AFPA cyberattaque 1,7 million communiqué officiel\") → Clubic.com, URL https://www.clubic.com/actualite-630454-... (relays AFP/franceinfo quoting AFPA's deputy director Pierre Prady) → corroborating pivot: Cyberattaque.org, URL https://www.cyberattaque.org/afpa-pres-dun-million-de-dossiers-revendiques-apres-une-cyberattaque/ → corroborating pivot: FrenchBreaches, URL https://frenchbreaches.com/alertes/afpa-mu4jbja3w3es4t7j0a8. franceinfo's own article (https://www.franceinfo.fr/internet/securite-sur-internet/cyberattaques/l-agence-nationale-pour-la-formation-des-adultes-afpa-cible-d-un-piratage-informatique_8200595.html) was located but returned 403 on every transport (direct, trafilatura, jina) and could not be fetched directly — its content is preserved via Clubic's direct quotation."
    summary: |
      AFPA (Agence nationale pour la formation des adultes, France's national public adult vocational-training
      agency under the Ministry of Labour) has confirmed, through its deputy director Pierre Prady speaking to
      AFP (relayed by franceinfo and Clubic on 2026-09-19/20), that it identified a "potential data extraction"
      after two criminal claims surfaced within 24 hours of each other on a cybercrime forum. This RESOLVES an
      open ambiguity: the handle xMetah first offered 971,420 records for sale (2026-09-15), then Cybernox
      (`actor:cybernox`, already tracked in this store for a financially-adjacent AFPA-account exposure a month
      earlier and for a hedged, unconfirmed correlation to a DGFiP-adjacent Bloctel leak) claimed 1,732,811 lines
      via an alleged IDOR (Insecure Direct Object Reference) flaw (2026-09-16). AFPA's own investigation traced
      the "potential extraction" to a flaw in the third-party-hosted tool it uses to manage worker accommodation/
      lodging ("outil de gestion des hébergements") — an application hosted by an external vendor and outside
      AFPA's own information system, so AFPA states there was "a priori" no impact on its internal services or
      systems. AFPA states the data in the affected application is limited to identity, address and possibly
      phone number, with no bank data or French national ID (Sécurité sociale) numbers identified so far;
      independent sample review by Cyberattaque.org and FrenchBreaches additionally found full dates of birth,
      internal identifiers, a "partner" field (observed value "LHEA", suggesting a partner-feed origin), email
      addresses and nationality, spanning records created or modified from 2006 through 2026. AFPA has NOT
      confirmed the IDOR mechanism Cybernox claims, has not confirmed whether the xMetah and Cybernox datasets
      overlap or derive from the same extraction (the two counts must not be summed), and — per Clubic's own
      note — has not stated whether it has notified the CNIL, despite GDPR's 72-hour breach-notification
      requirement. This is the third AFPA-linked security alert in roughly a month: in early August 2026,
      Cybernox separately exposed 101 AFPA accounts with a published admin-level access, and no source
      establishes a link between that earlier exposure and this extraction.
    region_nexus: "France (neighbouring EU jurisdiction); the vendor-trust/third-party-hosted-tool failure mode is directly analogous to Swiss cantonal/communal reliance on externally hosted administrative SaaS tools"
    primary_sector_nexus: "direct — national public-sector vocational-training/employment agency, the closest French analogue to a Swiss federal/cantonal administrative agency"
    sector: "public-sector"
