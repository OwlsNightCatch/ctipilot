    affected_products[] names only Microsoft Exchange Server, but the entry also carries CVE-2019-0708
    (BlueKeep), a Windows RDP vulnerability unrelated to Exchange ("Windows RDP (Windows 7, Server
    2008/2008 R2 and earlier RDP-enabled builds)" per the entry's own cves[].affected field). Adding the
    RDP-bearing Windows product line to affected_products[] would improve triage-matching completeness.
    Advisory only.
