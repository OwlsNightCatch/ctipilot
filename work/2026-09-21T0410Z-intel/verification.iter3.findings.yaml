  item: "nighteagle-apt-q-95-ghostcontainer-devtunnels-rdp2tcp-dcsync"
  url_or_quote: "cves: [{id: CVE-2019-0708, ...}] / affected_products: [\"Microsoft Exchange Server\"]"
