  summary: >
    The entry carries a CVE for GLPI (CVE-2025-24799, "an unauthenticated SQL injection in GLPI's
    inventory endpoint") but affected_products[] is empty. Populating it with "GLPI" would improve
    automated SOC-triage matching per the store's own triage-readiness rule; leaving it empty is not a
    contradiction of any source, just a missed metadata-completeness opportunity. Advisory only.
