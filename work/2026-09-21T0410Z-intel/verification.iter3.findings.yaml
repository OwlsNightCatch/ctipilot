- code: F3
  category: claim-not-supported
  section: new-entries
  item: "conference-phishing-rogue-root-ca-mitm-persistence"
  url_or_quote: "\"Windows victims who pasted the ClickFix command launched an encoded PowerShell command that fetched a loader — itself signed with a certificate stolen from Discord Inc., whose signature does not validate — which pulled down three further payloads: NetSupport Manager ... a TLS-intercepting local proxy ... and a Ledger-wallet implant\""
  summary: >
    The source's own section headings assign the Discord certificate and the three named payloads
    (NetSupport Manager / TLS-proxy / Ledger implant) to the SECOND document (the DropBox DocSend link),
    not to the first document's ClickFix/PowerShell chain the entry attaches them to. Huntress: "You have
    one new message: A second document link and a second stolen cert" ... "The installer in the Windows
    chain was signed with a certificate stolen from Discord Inc.; the signature did not validate." The
    three recovered payloads are explicitly obtained by reconstructing that SAME dead DocSend endpoint
    ("Reconstructing communications from a dead endpoint" -> "the recovered stage-three payloads:
    Manager.zip - NetSupport Manager ...; Localcertificate.zip - a TLS-intercepting local proxy;
    asusdriverld.zip - a Ledger wallet implant") and "The final stage" section describes "the loader"
    (continuing that same DocSend narrative) downloading them. By contrast, the source's account of the
    FIRST document's ClickFix path (https://www.huntress.com/blog/google-doc-sidebar-malware-mac-windows)
    states only: "Windows users who fell for the ClickFix lure in the Google Doc sidebar ended up
    launching an encoded PowerShell command that fetched a loader, which in turn pulled down three
    encrypted payloads. All three were offline by the time we went looking, but all three were already on
    VirusTotal" — no certificate is named for that loader anywhere in the source. The entry's own
    paragraph describing the second document ("told Windows victims to install a DocSend-branded desktop
    installer — reusing the same playbook against the same target") now carries NO certificate at all,
    the opposite of what the source states. This is iteration-2's own remediation (delta #7) relocating
    the Discord cert's ORDINAL correctly (2nd, not 3rd) while leaving it attached to the wrong document's
    chain — a residual the delta explicitly asked to be re-checked.
- code: F3
  category: claim-not-supported
  section: new-entries
  item: "afpa-third-party-accommodation-tool-data-extraction"
  url_or_quote: "\"claimed 1,732,811 records via an alleged insecure direct object reference (IDOR) flaw ([Cyberattaque.org, 2026-09-19](https://www.cyberattaque.org/afpa-pres-dun-million-de-dossiers-revendiques-apres-une-cyberattaque/))\""
  summary: >
    The inline citation date (2026-09-19) does not match this run's own frontmatter for the identical URL
    (sources[1].date = "2026-09-15", role corroborating) nor the page's own publication date. Fetched this
    iteration via both `extract` and `jina`: "Published Time: 2026-09-15T21:41:46+00:00" — confirming
    iteration 2's revert of the frontmatter date to 2026-09-15 was correct, but the body's inline citation
    next to this same URL was never updated to match and still reads 2026-09-19 (a residual from iteration
    1's now-reverted dateModified attempt). A 4-day drift between an inline citation date and its own
    source's frontmatter/publication date is well beyond the one-day timezone-artifact tolerance in check
    2(e), and it is a straightforward self-contradiction against the entry's own sources[] block.
- code: F3
  category: claim-not-supported
  section: new-entries
  item: "ref9334-kremlin-chromium-secure-preferences-hmac-forge"
  url_or_quote: "\"Ethereum transaction timing consistent with São Paulo business hours\""
  summary: >
    (low confidence) Elastic's own reasoning is about late-evening activity, not conventional business
    hours: "In UTC-3, only around ten fall within late-night hours, without extending particularly far
    into the early morning. Assuming the operators are more likely to work late than wake before dawn,
    this distribution aligns most closely with São Paulo time." The source never uses "business hours" and
    its argument explicitly rests on late-night activity, the opposite framing from what the entry's body
    and sourcing_note both assert ("São Paulo-hours Ethereum transaction timing", "São Paulo business
    hours"). A minor mischaracterization of the source's own stated reasoning.
