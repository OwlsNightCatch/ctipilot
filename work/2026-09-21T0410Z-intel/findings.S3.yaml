  # ===== PRIORITY BACKLOG ITEM 3/6 =====
  - title: "TraderTraitor (Jade Sleet) compromises a non-crypto IT-services victim via a weaponized Terraform provider lockfile and controls FLATROOF/ROOFDECK backdoors through a Nostr-relay dead-drop resolver"
    sources:
      - { url: "https://www.sentinelone.com/labs/dont-call-us-well-call-your-apis-tradertraitor-backdoors-resurface-on-victim-with-no-crypto-ties/", publisher: "SentinelOne / SentinelLabs", date: "2026-09-18", role: "primary" }
    discovery_trace: "originally surfaced by the 2026-09-20T1308Z-audit's G3 coverage-backlog re-sweep (first seen at: sentinellabs, URL https://www.sentinelone.com/labs/ (listing) → primary: SentinelOne SentinelLabs, URL https://www.sentinelone.com/labs/dont-call-us-well-call-your-apis-tradertraitor-backdoors-resurface-on-victim-with-no-crypto-ties/) → re-verified today (2026-09-21) by this run: WebFetch of the primary URL re-confirmed live content matching the audit's quotes verbatim (non-crypto-victim statement, Terraform-lockfile mechanism, Nostr-relay C2 resolution, and the \"TraderTraitor (aka UNC4899, PUKCHONG, Jade Sleet)\" alias line), publication date 2026-09-18 unchanged. This run's own fresh sweep of https://www.sentinelone.com/labs/ independently confirmed it is the only SentinelLabs post in-window (nothing newer)."
    summary: |
      SentinelLabs hunted its telemetry for the FLATROOF (aka macOS.Gaslight) and ROOFDECK macOS backdoors first disclosed in April 2026's USD 292M LayerZero/KelpDAO theft, and found an unrelated victim: a small India-based IT-services provider with no cryptocurrency ties, compromised through a single Apple Silicon MacBook belonging to a DevOps engineer. The lure follows DPRK's "Contagious Interview" pattern: fake job-interview GitHub repositories themed as infrastructure-engineering coding challenges (identified names: Northwind-IAC, novacart-interview, terraform-candidate-repo) each carry a weaponized `.terraform.lock.hcl` pointing to an attacker-controlled custom Terraform provider registry (`registry.hashicorp-aws[.]com`, `registry.hashicorp-aws[.]io`, `registry.hashicorp-terraform[.]io`); running `terraform init` against the poisoned lockfile causes Terraform to trust and execute the attacker's provider module as though it were the real HashiCorp registry. On the victim host, both backdoors sat dormant on disk from March 18 to March 29, 2026, then launched the moment the developer opened a specific Cursor IDE workspace — Cursor's integrated terminal spawned the implants directly (`nohup .../SystemUpdate --type=renderer` and `nohup .../iSync --type=renderer`), which then stripped the macOS quarantine attribute and set the executable bit on each other (Gatekeeper bypass) before beaconing. FLATROOF is a Rust ARM64 backdoor supporting shell/kill/upload/stop commands and a Python data-harvesting module that pulls Chrome/Brave/Firefox/Safari data, Terminal history, installed-app lists, `ps aux` output, `system_profiler` output and a raw copy of `login.keychain-db`, exfiltrated via a hardcoded Telegram bot. ROOFDECK is the more capable second-stage implant: on first run it queries the public `api.nostr[.]watch/v1/online` endpoint plus a hardcoded relay list, searches Nostr relays for an operator profile matching a configured public key, and reads that profile's "website" field as its live C2 URL — a decentralized dead-drop resolver that survives takedown of any single C2 domain. A third stage (`loginwindow`) later replaced both original implants and kept beaconing to a separate C2 for over a month before going silent.
    region_nexus: "Global DPRK financially-motivated campaign (TraderTraitor/Jade Sleet, aka UNC4899/PUKCHONG); the developer-targeting Contagious Interview lure and the weaponized-IaC-lockfile supply-chain vector are directly relevant to any organization whose engineering staff use Terraform/HashiCorp tooling and could be approached via fake recruiting outreach."
    primary_sector_nexus: "indirect"
    sector: "public-sector"
    cves: []
    techniques: [T1566.002, T1195.002, T1204.002, T1553.001, T1027, T1102.001, T1102.002, T1555.001, T1005, T1119, T1497]
    affected_products: ["Terraform", "macOS"]
    entity_keys: ["actor:jade-sleet"]
