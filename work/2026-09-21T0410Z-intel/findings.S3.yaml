  # ===== FRESH SWEEP: NEW ITEM FOUND VIA malware-news candidate source =====
  - title: "Independent researcher demonstrates a SAP audit-log blind spot: SM49/SM69 external OS command execution is invisible to the Security Audit Log on the interactive and RFC paths, and only OS-level auditd sees the full command line on every path"
    sources:
      - { url: "https://malware.news/t/the-sound-of-silence-sap-sm49-sm69-and-the-os-commands-your-siem-never-hears/125738", publisher: "Malware.news (full-text syndication of Detect FYI / Medium, author Rohan Taluja)", date: "2026-09-20", role: "primary" }
    discovery_trace: "first seen at: malware-news, URL https://malware.news (listing) → pivot: WebSearch (\"Sound of Silence SAP SM49 SM69 OS Commands SIEM\") identified the original as \"The Sound of Silence: SAP SM49/SM69 and the OS Commands Your SIEM Never Hears | by Rohan Taluja | Sep, 2026 | Detect FYI\" at https://detect.fyi/the-sound-of-silence-sap-sm49-sm69-and-the-os-commands-your-siem-never-hears-e408848cb6e2 → attempted fetch of that URL failed on every transport (WebFetch HTTP 403; tools/fetch_source.py extract: direct-403, trafilatura-no-body, jina-upstream-block) → recovered the full syndicated article text (identical body, explicit \"originally published in Detect FYI on Medium\" attribution) via tools/fetch_source.py extract on the malware.news mirror URL above, which carries the complete original text including all detection/remediation sections (confirmed via a cross-check against mallory.ai's independent summary of the same detect.fyi URL, which quotes matching passages)."
    summary: |
      An independent security researcher (Rohan Taluja, publishing on Detect FYI / Medium, syndicated in full via malware.news 2026-09-20) demonstrates on a self-owned SAP NetWeaver AS ABAP 7.52 SP04 lab (kernel 753, openSUSE Leap 15.3, auditd 2.8.5) that SAP's Security Audit Log (SAL) carries no event type or field for OS-level "external command" execution launched via transactions SM49/SM69 or over RFC — a structural schema gap, not a misconfiguration. External commands run through the sapxpg helper as the <sid>adm OS-owner account; 72 of 75 Linux-applicable SAP-delivered command definitions allow additional runtime parameters, so the actually-executed binary can differ entirely from the SM69-defined one (demonstrated: a `find`-with-`-exec` command definition used at runtime to execute `/usr/bin/id` instead). On the interactive (SM49) path, the SAL records only a generic "Transaction SM49 started" with no command, binary, or parameter data — even with every audit class enabled. On the RFC path, the SAL at best records the AUK "RFC call" event naming only the invoked function module (SXPG_COMMAND_EXECUTE), never the command or its arguments. Only the background-job path (SM36) records the full command and output — but in the job log (TBTC*/job-log files), not the Security Audit Log. OS-level auditd is the only source that sees the full argument vector on every path, via the sapxpg parent-process chain (SAP work process → sapxpg → target binary), but the author flags three practical failure modes: the `-a task,never` audit rule (shipped active or fully absent on some SUSE/SLES builds) silently suppresses execve auditing for new tasks; runtime `auditctl` changes don't survive reboot unless persisted under `/etc/audit/rules.d/`; and a bare execve rule is noisy without filtering on `ParentImage` ending in `sapxpg` (matching both the SAP work-process and SAP Host Agent binaries, the latter running as root). Because the SAL always knows the SAP user but never the command, and auditd always knows the command but only the OS account (<sid>adm) — never the initiating SAP user — the author recommends time-correlating the SAL's SAP-user timestamp (or, for the background path, the self-sufficient job log) with the auditd execve record to reconstruct the full "this SAP user ran this OS command as <sid>adm" sentence. Recommended detections: a high-severity alert on any sapxpg-child command line carrying injection gadgets (-exec, an interpreter, shell metacharacters), and a medium-severity hunting/baselining rule matching any sapxpg child regardless of content.
    region_nexus: "Vendor-neutral SAP detection-engineering research; SAP ERP is widely deployed across Swiss federal, cantonal and communal administration finance/HR back-ends, making the audit-log blind spot and the auditd-based hunt/detection guidance directly applicable to any organization running on-prem SAP with external OS commands enabled."
    primary_sector_nexus: "indirect"
    sector: "public-sector"
    cves: []
    techniques: [T1059]
    affected_products: ["SAP NetWeaver AS ABAP"]
    entity_keys: []
