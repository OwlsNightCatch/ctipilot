        attribution: "SentinelOne SentinelLabs"
        source_url: "https://www.sentinelone.com/labs/dont-call-us-well-call-your-apis-tradertraitor-backdoors-resurface-on-victim-with-no-crypto-ties/"
      - quote: "When the victim runs terraform init with the weaponized lockfile in place, Terraform treats the custom provider as the source of truth, resulting in Terraform downloading and executing the malicious provider modules."
        attribution: "SentinelOne SentinelLabs"
        source_url: "https://www.sentinelone.com/labs/dont-call-us-well-call-your-apis-tradertraitor-backdoors-resurface-on-victim-with-no-crypto-ties/"
      - quote: "Upon first execution, it pulls live Nostr relays from api.nostr[.]watch/v1/online and combines them with a hardcoded relay list... then searches the relays for an operator's profile on the Nostr network... When found, it reads the website field of the profile and uses that as its C2 URL."
        attribution: "SentinelOne SentinelLabs"
        source_url: "https://www.sentinelone.com/labs/dont-call-us-well-call-your-apis-tradertraitor-backdoors-resurface-on-victim-with-no-crypto-ties/"
    extended_notes: |
      REGISTRY ALIAS FIX (not a new entity): entities/registry.yaml's actor:jade-sleet record currently has aliases: [] (confirmed via grep this run, line ~6062-6067) — this SentinelLabs report explicitly states "TraderTraitor (aka UNC4899, PUKCHONG, Jade Sleet)". Recommend the main agent extend actor:jade-sleet's aliases list with "TraderTraitor", "UNC4899", "PUKCHONG" so future TraderTraitor-labeled reporting maps to the same registry key instead of fragmenting into a duplicate. Not present in prior_coverage.json (distinct new victim/technique from the April 2026 LayerZero incident, which is out of this run's window).
