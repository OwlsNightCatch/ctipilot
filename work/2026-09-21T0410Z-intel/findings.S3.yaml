  # ===== PRIORITY BACKLOG ITEM 4/6 =====
  - title: "Huntress: distinguishing malicious Volume Shadow Copy abuse (NTDS.dit theft, ransomware anti-recovery) from routine RMM/backup VSS activity requires event-correlation, not single-event alerting"
    sources:
      - { url: "https://www.huntress.com/blog/vss-abuse-explained", publisher: "Huntress Labs", date: "2026-09-14", role: "primary" }
    discovery_trace: "originally surfaced by the 2026-09-20T1308Z-audit's G3 coverage-backlog re-sweep (first seen at: huntress, URL https://www.huntress.com/blog/rss.xml (listing) → primary: Huntress Labs, URL https://www.huntress.com/blog/vss-abuse-explained) → re-verified today (2026-09-21) by this run: WebFetch of the primary URL re-confirmed live content matching the audit's quotes verbatim (three abuse-class breakdown and the PsExec-to-vssadmin worked incident), publication date 2026-09-14 unchanged."
    summary: |
      Huntress lays out three distinct classes of Volume Shadow Copy Service (VSS) abuse it detects and the correlation logic needed to separate each from benign RMM/backup-agent VSS housekeeping, which performs the identical raw create/delete API calls constantly. Class one (MITRE T1490, Inhibit System Recovery) is the familiar pre-ransomware shadow-copy deletion, most commonly via vssadmin but also achievable through other services/binaries, so detections must not anchor solely on the vssadmin.exe process image. Class two, credential access, is less commonly discussed: rather than running LSASS/NTDS-dumping tools live on a monitored host, an attacker creates a shadow copy specifically to pull the NTDS.dit Active Directory database out of the static snapshot, which is materially quieter than direct extraction. Class three is shadow-copy size/configuration manipulation as ancillary tradecraft. Huntress's detection logic fires on the raw VSS event plus surrounding context rather than the event alone: for deletions, it inspects how the deletion occurred (accounting for non-vssadmin deletion paths); for creations, it looks for pairing with lateral-movement indicators and credential-harvesting commands before or after the VSS event, correlated across a time window rather than judged as isolated actions. A worked incident is included: PsExec spawned a SYSTEM-level shell on a domain controller, the operator enumerated active RDP sessions, ran `vssadmin create shadow` (the NTDS.dit-theft pattern), attempted to delete the shadow copies to cover tracks (blocked by endpoint AV), and DNS-enumerated at least one additional host in the same window — a sequence Huntress states no single step would have justified escalating alone.
    region_nexus: "Vendor-neutral detection-engineering technique; directly applicable to any organization's own SOC correlation rules regardless of platform."
    primary_sector_nexus: "indirect"
    sector: "public-sector"
    cves: []
    techniques: [T1490, T1003.003, T1569.002, T1018]
    affected_products: []
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Rather than running credential-dumping tools directly against a live, monitored system, an attacker can spin up a shadow copy and quietly pull the NTDS.dit file (the Active Directory database) out of it."
        attribution: "Huntress Labs"
        source_url: "https://www.huntress.com/blog/vss-abuse-explained"
      - quote: "PsExec was used to spawn SYSTEM-level command shell processes on a domain controller. From there, the attacker enumerated active Remote Desktop sessions, then ran vssadmin create shadow... A few minutes later, the attacker tried to cover their tracks by deleting the shadow copies they'd just created; that attempt was blocked and flagged by endpoint antivirus."
        attribution: "Huntress Labs"
        source_url: "https://www.huntress.com/blog/vss-abuse-explained"
    extended_notes: |
      No specific actor/malware named — general detection-engineering technique piece, not an incident disclosure. Confirmed not present in prior_coverage.json (this run). Included because it materially improves a Tier 2/3 hunter's ability to write low-false-positive VSS-abuse detections, which the surrounding threat landscape (ransomware pre-encryption VSS deletion; NTDS.dit-via-shadow-copy credential theft, seen in the store's MikroTik/PaperCut AI-agent mass-exploitation entries) makes directly actionable.
    coverage: GAP

  # ===== PRIORITY BACKLOG ITEM 5/6 =====
  - title: "A conference-targeted phishing chain installs a self-signed root CA plus a hosts-file/firewall MITM proxy that survives reboot, alongside three abused stolen code-signing certificates and a Google-Apps-Script zero-click reconnaissance funnel"
    sources:
      - { url: "https://www.huntress.com/blog/google-doc-sidebar-malware-mac-windows", publisher: "Huntress Labs", date: "2026-09-15", role: "primary" }
    discovery_trace: "originally surfaced by the 2026-09-20T1308Z-audit's G3 coverage-backlog re-sweep (first seen at: huntress, URL https://www.huntress.com/blog/rss.xml (listing) → primary: Huntress Labs, URL https://www.huntress.com/blog/google-doc-sidebar-malware-mac-windows) → re-verified today (2026-09-21) by this run: WebFetch of the primary URL re-confirmed live content matching the audit's quotes verbatim (zero-click Apps Script reconnaissance, stolen-certificate abuse, rogue-CA/hosts-file/firewall persistence), publication date 2026-09-15 unchanged."
    summary: |
      A Huntress researcher was targeted post-DEFCON by an X account impersonating a CoinDesk marketing executive, sent a legitimate Google Doc carrying a custom Google Apps Script sidebar. The sidebar runs client-side with no OAuth consent prompt and, merely by the document being opened while signed in, silently reports the viewer's public IP, geolocation, browser, and whether a MetaMask/Phantom/Tron/Solana wallet extension is present, beaconing every action via the Telegram Bot API — a reconnaissance/qualification step that requires no download or click at all. A fake "decryption failure" overlay then offers OS-specific ClickFix remediation instructions. macOS victims who paste the clipboard command get a piped zsh chain leading to an AMOS-family stealer (harvesting browser, crypto-wallet, Telegram, Apple Notes, cookie, and login-keychain data) with Gatekeeper-bypass instructions; Windows victims are directed to an application signed with a stolen/fraudulently-issued Norwegian company certificate, deployed via abuse of Microsoft's ClickOnce feature, leading through an encoded PowerShell loader to three payloads: NetSupport Manager (a legitimate RMM tool reconfigured to redirect data to attacker infrastructure, persisted via a keyboard filter driver, Windows service, Winlogon and Run-key entries, and a self-reinstalling scheduled task); a TLS-intercepting local proxy; and a Ledger-wallet implant. A second document link, sent later in the same conversation, used a third stolen certificate (from Discord Inc., signature invalid) to distribute a DocSend-themed installer. The most novel component: a payload disguised as a Lenovo driver package, signed with a genuine stolen Lenovo certificate, hollows `MsBuild.exe` and generates its own self-signed certificate authority presenting as "Google Trust Services CN=WR3" plus a fabricated `www.virustotal.com` leaf certificate, installs the CA into the system root store, adds a hosts-file entry and a local-proxy firewall rule, and thereby locally answers HTTPS connections with fabricated "clean" results and no certificate warnings — for any domain the operator chooses (crypto wallets, AV update checks). Because the CA is regenerated per host, blocking a single certificate thumbprint is ineffective, and while the interception process itself dies at reboot, the installed CA, hosts entry and firewall rule all persist.
    region_nexus: "Individually-targeted social-engineering campaign against security researchers/DevOps-adjacent individuals post-conference; the rogue-CA/hosts-file/firewall-rule persistent-MITM technique and the three-stolen-certificate abuse pattern are transferable hunting targets for any Windows estate (check for unexpected root-store CAs claiming to be major CAs, unexplained hosts-file entries, and orphaned local-proxy firewall rules)."
    primary_sector_nexus: "indirect"
    sector: "public-sector"
    cves: []
    techniques: [T1566.002, T1204.002, T1027.010, T1553.002, T1553.004, T1219, T1102.002, T1090, T1071.001, T1518]
    affected_products: ["Google Docs / Apps Script", "Microsoft Windows", "macOS", "NetSupport Manager"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "VIEW is the one worth sitting with. Opening the document while signed in, clicking nothing, and downloading nothing, was enough to report the viewer's IP address, location, browser, and whether they were running a crypto wallet extension."
        attribution: "Huntress Labs"
        source_url: "https://www.huntress.com/blog/google-doc-sidebar-malware-mac-windows"
      - quote: "It hollowed MsBuild.exe and imported only kernel32, ultimately establishing what Jon called \"purpose-built and working public key infrastructure on your machine.\""
        attribution: "Huntress Labs"
        source_url: "https://www.huntress.com/blog/google-doc-sidebar-malware-mac-windows"
      - quote: "Because the CA was regenerated per host, blocking a single certificate thumbprint does nothing."
        attribution: "Huntress Labs"
        source_url: "https://www.huntress.com/blog/google-doc-sidebar-malware-mac-windows"
    extended_notes: |
      No named actor/campaign — Huntress declines attribution beyond "Russian comments... supporting, but not proving, a Russian-speaking operator." No CVE (abuse of legitimate features, not a vulnerability). Confirmed not present in prior_coverage.json (this run).
    coverage: GAP

  # ===== PRIORITY BACKLOG ITEM 6/6 =====
  - title: "REF9334/KREMLIN forges Chromium's own Secure Preferences integrity HMACs to silently install a malicious banking-session-stealing extension outside the Web Store, resolving its C2 through Ethereum smart contracts"
