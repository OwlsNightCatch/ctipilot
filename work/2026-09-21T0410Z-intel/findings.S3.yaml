  # ===== PRIORITY BACKLOG ITEM 1/6 =====
  - title: "Cisco Talos exposes The Gentlemen ransomware's open-directory AD attack toolchain and finds AI-generated wiper code in Qilin's own staging directory"
    sources:
      - { url: "https://blog.talosintelligence.com/ransomware-incidents-in-japan-in-the-first-half-of-2026/", publisher: "Cisco Talos", date: "2026-09-17", role: "primary" }
    discovery_trace: "originally surfaced by the 2026-09-20T1308Z-audit's G3 coverage-backlog re-sweep (first seen at: talos, URL https://blog.talosintelligence.com/ (listing) → primary: Cisco Talos, URL https://blog.talosintelligence.com/ransomware-incidents-in-japan-in-the-first-half-of-2026/) → re-verified today (2026-09-21) by this run: WebFetch of the primary URL re-confirmed live content matching the audit's quotes verbatim, publication date 2026-09-17 unchanged."
    summary: |
      Cisco Talos's H1 2026 Japan ransomware review (published 2026-09-17) carries two distinct technical findings beyond its regional-statistics framing. First, Talos identified an open-directory infrastructure used by a threat actor associated with The Gentlemen RaaS and reconstructed a six-phase attack flow from the operator's own bash_history: Chisel/Ligolo-ng/SSH tunnels to turn the attacker server into a pivot platform; nmap/masscan recon; RustHound (a Rust BloodHound-collector) plus NetExec/Responder/Impacket against Active Directory; exploitation of CVE-2025-2479 (SQL injection) and a cPanel/WHM auth-bypass PoC for initial footholds; CVE-2020-1472 (Zerologon) and MS17-010 exploitation attempts for AD compromise; RDP/SMB/LDAP/WinRM authentication sweeps via NetExec/Impacket for lateral movement; and a credential-theft/exfil stage that mounts VHDX backup files via CIFS, copies ntds.dit/SAM/SYSTEM out of the mounted backup rather than the live DC, runs Impacket's secretsdump.py offline, then zstd-compresses and rclone-uploads the data to Wasabi cloud storage in concurrent 256MiB chunks. C2 runs on the open-source AdaptixC2 framework. Russian-language script comments and a Russian keyboard layout in the operator's own command history (Cyrillic-keymap mistypes of whoami/ls/ip a/clear/exit) support, with Talos's own hedge, a Russian-speaking operator. Second, in a separate Qilin-affected environment, Talos found Python post-exploitation scripts (deadman.py — a GPO-deployed, time-triggered wiper; veeam_kill.py — a Veeam backup-destruction script; deploy_locker.py — a mass-deployment ransomware launcher) that Talos assesses with medium-to-high confidence were AI-generated, based on step-numbered comments ("# Stage wipe payload to SYSVOL", "# Stage startup script", "# Create GPO via PowerShell on DC"), consistent per-step logging patterns, and specification-style docstrings — plus a bash_history reference to a local "llm_chatbot" tool.
    region_nexus: "Japan-focused dataset, but the tooling and technique chain (RustHound/BloodHound, Responder, Ligolo-ng, Impacket secretsdump against VHDX-mounted backups, AdaptixC2) and the AI-generated-wiper forensic method are directly transferable to any AD environment, including Swiss public-sector networks running similar backup/AD topology."
    primary_sector_nexus: "indirect"
    sector: "public-sector"
    cves: ["CVE-2025-2479", "CVE-2020-1472"]
    techniques: [T1590, T1595, T1210, T1557.001, T1572, T1021.002, T1021.001, T1003.003, T1003.006, T1567.002, T1587.001, T1489]
