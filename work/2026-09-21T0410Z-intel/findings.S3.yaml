    evidence:
      - quote: "The only trace is a generic \"Transaction SM49 started.\" There is no event for the command, the binary, the parameters, the -exec payload, or the npladm context. A SIEM ingesting this log sees \"a user opened SM49\" and nothing more."
        attribution: "Rohan Taluja (Detect FYI, syndicated via malware.news)"
        source_url: "https://malware.news/t/the-sound-of-silence-sap-sm49-sm69-and-the-os-commands-your-siem-never-hears/125738"
      - quote: "OS-level auditd records the full command on every path, because everything funnels through sapxpg."
