    discovery_trace: "first seen at: heise-sec, URL https://www.heise.de/security/feed.xml (RSS item published 2026-09-20T13:05Z) → pivot: heise online article, URL https://www.heise.de/news/Cyberangriff-auf-LMU-Muenchen-Daten-von-Studierenden-abgeflossen-11459343.html → primary: LMU München's own Art. 34 GDPR breach notice, URL https://www.lmu.de/de/newsroom/newsuebersicht/news/information-ueber-einen-datenschutzvorfall-f446c16e.html → corroboration: Bayerischer Rundfunk, URL https://www.br.de/nachrichten/bayern/hackerangriff-auf-muenchner-uni-daten-von-studenten-abgegriffen,VVkFrNl → further update: LMU FAQ page updated 2026-09-20 21:30, URL https://www.lmu.de/de/newsroom/newsuebersicht/news/fragen-zum-datenschutzvorfall-b4a040bd.html"
    summary: |
      Ludwig-Maximilians-Universität (LMU) München — a Bavarian state university with roughly
      53,000 enrolled students, i.e. a DACH-region public-sector education institution — disclosed
      on 2026-09-19 under GDPR Art. 34 that an unauthorized attacker accessed and, LMU states it
      must now assume, retrieved the full enrollment master-data records ("Stammdaten zu
      Immatrikulationen") stored on one IT system. LMU's own notice and FAQ list the exposed data
      categories: identifying data (name, date/place of birth, gender), contact data (term and home
      address, phone, LMU and personal email), bank data (IBAN, account holder name), and
      potentially health-insurance numbers, BAföG (student-grant) numbers, prior educational
      qualifications, and — in individual cases — special-category data under GDPR Art. 9 tied to
      leave-of-absence reasons. Examination results and course-content data were explicitly not
      affected. LMU says data integrity was preserved (no manipulation) and that LMU user
      credentials/passwords were not compromised. The intrusion was identified on 2026-09-16;
      LMU immediately took the affected enrollment server offline, stood up a crisis staff under
      the university president, engaged external IT-forensics, digital-law and crisis-communications
      specialists, and is working with the Bavarian state criminal police office (LKA) on forensic
      attribution that is still ongoing as of the FAQ's 2026-09-20 21:30 update. No named
      technique or initial-access vector has been confirmed by LMU; heise online's own reporting
      speculates (spear-)phishing as a plausible vector given the full-PII dataset obtained, but
      explicitly notes LMU does not state this. No evidence of publication or resale has surfaced
      so far; specialists are monitoring darknet marketplaces. A German state (SPD) politician
      publicly criticized LMU's notification timeline — the intrusion was found 2026-09-16 but
      affected individuals were only informed from Saturday 2026-09-19 afternoon, which he
      argues does not meet GDPR's "without undue delay" notification standard. Student
      enrollment (interrupted by the shutdown, deadlines extended) resumes the week of
      2026-09-21; the incident does not affect course registration validity.
