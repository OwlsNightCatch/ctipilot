    extended_notes: |
      No confirmed initial-access vector or named actor/cluster; heise online's phishing
      hypothesis is explicitly the outlet's own inference, not an LMU statement, so it is not
      carried as fact. ATT&CK mapping is limited to T1213 (Data from Information Repositories)
      because that is the only mechanic the sources actually state (unauthorized access to and
      retrieval of a stored enrollment-data repository); no technique for the initial-access step
      is asserted here to avoid overclaiming beyond the sources. Distinct entity from the
      already-tracked "incident:munich-lhm-services-120k-student-records-darknet-insider"
      (a 2025-26 Munich city IT-services/LHM-Services insider case) — different organization
      (state university vs. city-owned IT services), different mechanism (external intrusion vs.
      suspected insider), not a duplicate.
