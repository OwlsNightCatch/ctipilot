claims:
  - {claim_id: 0831f8521f, verdict: ok, source_url: "https://previdian.com/CVE-2026-123158", passage: "Previdian sensors have observed 20 exploitation attempts, 13 unique attacker IPs, and 9 countries ... First observed Nov 06, 2026; last observed Nov 08, 2026. | Not in CISA KEV (cisa-kev 2026.11.06: no row)"}
  - {claim_id: d1609edcc7, verdict: ok, source_url: "https://www.openssh.org/txt/release-10.6p2", passage: "This release contains a critical security workaround that affects Linux systems that use the musl libc and PAM disabled."}
  - {claim_id: b797396646, verdict: ok, source_url: "https://security-hub.ncsc.admin.ch/#/posts/13155", passage: "Successful exploitation allows remote, unauthenticated attackers to bypass SSH password authentication over the network ... Current exploitation status: UNKNOWN"}
  - {claim_id: e0841f8538, verdict: ok, source_url: "https://www.ox.security/blog/openssh-authentication-bypass-cve-2026-123158/", passage: "musl ... crypt() ... refuses inputs longer than 256 bytes ... returns the string *; Linux also uses * in /etc/shadow ... OpenSSH could perform a password-hashing operation using settings obtained from another account (live page 403; read in the saved full-content RSS copy)"}
  - {claim_id: 7c0ad37eb0, verdict: ok, source_url: "https://www.ox.security/blog/openssh-authentication-bypass-cve-2026-123158/", passage: "musl ... does not use PAM ... Password logins are on ... account with no password set (shown as *): key-only users, LDAP users, root on Alpine ... at least one other account ... real password; CVSS v3.1 8.1 (saved RSS copy)"}
  - {claim_id: 9f9039b1ab, verdict: ok, source_url: "https://www.ox.security/blog/openssh-authentication-bypass-cve-2026-123158/", passage: "On Alpine's official AWS and Azure images, that passwordless account is the default alpine user, and it can run doas ... without a password ... effectively obtain root privileges (saved RSS copy)"}
  - {claim_id: 389859f7d0, verdict: ok, source_url: "https://alpinelinux.org/posts/2026-11-05-openssh-password-authentication-bypass/", passage: "They are safe on first boot. They become exploitable as soon as any $6$ hash exists ... Cloud images configured through cloud-init, which writes PasswordAuthentication no."}
  - {claim_id: c2f6b1d81d, verdict: ok, source_url: "https://www.heise.de/en/news/OpenSSH-and-Alpine-Linux-warn-of-severe-but-niche-bug-11513360.html", passage: "The OpenSSH developers believe the problem does not originate in OpenSSH itself."}
  - {claim_id: 6149ca9519, verdict: ok, source_url: "https://security-hub.ncsc.admin.ch/#/posts/13155", passage: "The root cause appears to lie outside OpenSSH ... so other software using similar authentication paths may also be affected."}
  - {claim_id: 3fae13d508, verdict: ok, source_url: "https://www.ox.security/blog/openssh-authentication-bypass-cve-2026-123158/", passage: "Alpine pushed the fix to every branch back to 3.16, including releases that are no longer supported (saved RSS copy; Alpine's own post also lists 3.16 9.0_p1-r6)"}
  - {claim_id: 9343ac1307, verdict: ok, source_url: "https://www.heise.de/en/news/OpenSSH-and-Alpine-Linux-warn-of-severe-but-niche-bug-11513360.html", passage: "other distributions and many OpenSSH download servers are still offering the previous version, 10.6p1."}
  - {claim_id: dd7816a7a9, verdict: ok, source_url: "https://security-hub.ncsc.admin.ch/#/posts/13155", passage: "Alpine Linux, KISS Linux, Sabotage Linux, OpenWrt, Morpheus Linux, Other musl-based ... PasswordAuthentication enabled"}
  - {claim_id: 111794787e, verdict: ok, source_url: "https://www.ox.security/blog/openssh-authentication-bypass-cve-2026-123158/", passage: "There's an account with no password set (shown as *): key-only users, LDAP users, root on Alpine. (saved RSS copy)"}
  - {claim_id: dba341d66b, verdict: ok, source_url: "https://www.ox.security/blog/openssh-authentication-bypass-cve-2026-123158/", passage: "Containers that do not run an OpenSSH server. (saved RSS copy)"}
  - {claim_id: 3c12b86ed7, verdict: ok, source_url: "https://www.ox.security/blog/openssh-authentication-bypass-cve-2026-123158/", passage: "Search /var/log/messages for Accepted password for on an account that has no password (alpine, root, key-only users). If you find one, treat the machine as compromised. (saved RSS copy)"}
  - {claim_id: 11e6b01161, verdict: ok, source_url: "https://www.ox.security/blog/openssh-authentication-bypass-cve-2026-123158/", passage: "Updating the package alone doesn't replace the SSH server that's already running ... Rebuild your images ... from a fixed base and redeploy. (saved RSS copy)"}
  - {claim_id: 48344d9acd, verdict: ok, source_url: "https://security-hub.ncsc.admin.ch/#/posts/13155", passage: "Temporary: Set PasswordAuthentication no in sshd_config and restart sshd immediately"}
  - {claim_id: d48fc6ac46, verdict: ok, source_url: null, passage: "derived from the cited mechanism (an accepted password for a * account); states no source publishes a further indicator; none found"}
  - {claim_id: ce495186ab, verdict: ok, source_url: "https://www.ox.security/blog/openssh-authentication-bypass-cve-2026-123158/", passage: "derived: a * field cannot match any password except through the bug (Alpine: 'an account with no password set')"}
  - {claim_id: 986ccd3850, verdict: ok, source_url: null, passage: "entry's own advice, framed as such; follows from Previdian/ISC attempt reports"}
  - {claim_id: f5b62ed15e, verdict: ok, source_url: "https://isc.sans.edu/diary/33498", passage: "first actual exploit attempt ... November 5th ... all \"A\" password; table 11-05 232, 11-06 713, 11-07 246, 11-08 51; scanners: COLT, Datacamp, SERVER-MANIA, Uzbektelekom, Korea Telecom ..."}
  - {claim_id: a3c55deab6, verdict: F3, source_url: "https://isc.sans.edu/diary/33498", passage: "I expect quite a few of these login attempts were successful for our honeypots (placed directly after the 11-05 initial-scanner table); 'Our honeypots collect only the first 255 characters'"}
  - {claim_id: fa7f5c580d, verdict: ok, source_url: "https://previdian.com/CVE-2026-123158", passage: "20 Attempts observed, 13 Unique attacker IPs, 9 Attacker countries; Last observed 08 Nov 2026; datePublished 2026-11-05T15:46:26Z"}
  - {claim_id: b9454abb9b, verdict: ok, source_url: "https://thehackernews.com/2026/11/hackers-exploited-openssh-sshole-flaw.html", passage: "success reported only on 'a honeypot running Alpine Linux and OpenSSH'; ISC reports honeypot logins; no production-host report found in THN, HNS, ISC, Previdian"}
  - {claim_id: 128730ee3f, verdict: F3, source_url: "https://isc.sans.edu/diary/33498", passage: "Published 2026-11-08, Last Updated 2026-11-08 15:44:33 UTC; table counts 'long passwords'; page states no decline and no 'sshole exploitation' split of the counts"}
  - {claim_id: 19868f64b2, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models", passage: "Abuse of access keys allowed the threat actor to modify and enable LLM API services (e.g. Bedrock, Gemini API, etc.) ... LLM Mixers ... resell"}
  - {claim_id: e8e40d0172, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models", passage: "fraudulent charges ... exceeding $100,000 USD in a single day; IAM credentials, Service Account keys, GitHub PATs; Wiz: billing accounts; Datadog: validate stolen AWS credentials ... bedrock"}
  - {claim_id: 95eaae069a, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models", passage: "Mandiant responded to multiple incidents in 2026 ... hijacked enterprise access to Large Language Models ... exceeding $100,000 USD in a single day"}
  - {claim_id: 8a54ccaa9c, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models", passage: "a threat actor opportunistically harvested exposed corporate LLM API keys from public GitHub repositories ... max_tokens=1 ... undetected by ... EDR and SIEM volume anomaly alerts; Figure 2 Ollama; UNC6993 ... raw JSON payload"}
  - {claim_id: f478da5cc2, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models", passage: "LLM Mixers function as illicit routing gateways that proxy, aggregate, and resell ... UNC6993 used open-source tools such as new-api ... and gcli2api"}
  - {claim_id: 60a297f02d, verdict: ok, source_url: "https://securitylabs.datadoghq.com/articles/beyond-valid-credentials-how-exposed-aws-keys-are-tested-for-amazon-bedrock-access/", passage: "tools and platforms that validate stolen AWS credentials ... In the last 30 days, we've observed 12 organizations display similar malicious behavior."}
  - {claim_id: 495311ca29, verdict: F14, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models", passage: "In multiple incidents that Mandiant investigated, LLM services were not enabled at the time of compromise. (no statement that the accounts had never used model services)"}
  - {claim_id: b2d6792a7f, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models", passage: "In Azure, model invocations occur on the data plane and require Diagnostic Logs to be enabled ... inference operations are contained within Data Access logs, which are disabled by default"}
  - {claim_id: 8e138905db, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models", passage: "bedrock.amazonaws.com ... Converse ... ListFoundationModels ... PutUseCaseForModelAccess ... CreateFoundationModelAgreement; Microsoft.CognitiveServices/accounts/deployments/write; ServiceUsage.EnableService; Predict, GenerateContent"}
  - {claim_id: 186e10b69f, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models", passage: "anomalous, low-volume requests (such as max_tokens=1 ...); Analyze User-Agent strings ... (e.g., claude-cli, aws-sdk-rust, and aws-sdk-go-v2)"}
  - {claim_id: 0633fdfa82, verdict: ok, source_url: "https://securitylabs.datadoghq.com/articles/beyond-valid-credentials-how-exposed-aws-keys-are-tested-for-amazon-bedrock-access/", passage: "we have seen failed ListFoundationModels API calls in multiple regions without subsequent ListInferenceProfiles or Converse API calls"}
  - {claim_id: 8e7d6c2f27, verdict: F3, source_url: "https://threats.wiz.io/all-incidents/threat-actors-targeting-gcp-billing-accounts-for-llm-usage", passage: "Attackers add external @gmail.com accounts to the victim's billing infrastructure, assign roles/billing.admin, and link foreign GCP projects ... (the page gives no detection guidance)"}
  - {claim_id: 789042a199, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models", passage: "established persistence by creating unauthorized IAM and service accounts and injecting SSH keys into compute instances ... attaching administrative policies to service roles"}
  - {claim_id: 8b67d91c92, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models", passage: "Any calls to disable logging by non-IaC (Infrastructure as Code) principals should be treated as high severity."}
  - {claim_id: 9f7dbc0aab, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models", passage: "Deny all permissions that are not explicitly required, including access to Cloud LLM services; granular API quotas; spending caps; ensuring rapid patching ... (e.g., LiteLLM)"}
  - {claim_id: 76eb811ce1, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models", passage: "the dominant initial access vector has been exposed or stolen cloud identity tokens-including IAM credentials, Service Account keys, GitHub Personal Access Tokens (PATs), and active session tokens"}
  - {claim_id: b90b540f03, verdict: F5, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models", passage: "supported by GTIG: 'attaching administrative policies to service roles'; 'burn and rotate' ... 'creating and deleting short-lived service accounts'; but the sentence carries no inline citation"}
  - {claim_id: 89f67558f5, verdict: F5, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models", passage: "supported by GTIG: 'LLM services were not enabled at the time of compromise' ... 'created additional API keys'; but the sentence carries no inline citation"}
  - {claim_id: e9339f723f, verdict: F5, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models", passage: "supported by GTIG: 'a follow-on cluster executed ... exploitation against the victim's LiteLLM gateway ... /key/regenerate ... PROXY_ADMIN'; but the sentence carries no inline citation"}
  - {claim_id: 12c7651f2e, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models", passage: "Defenders should prioritize detection of modifications to LLM accounts and services and treat any unauthorized enablement as a critical security event."}
  - {claim_id: c670f648c2, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models", passage: "entry's own advice; GTIG: Azure invocations 'require Diagnostic Logs to be enabled'; GCP Data Access logs 'disabled by default'"}
