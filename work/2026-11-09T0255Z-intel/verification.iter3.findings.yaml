- code: F3
  category: claim-not-supported
  section: llmjacking-stolen-cloud-keys-enable-model-services-resale (summary)
  item: "2026-11-09/llmjacking-stolen-cloud-keys-enable-model-services-resale"
  url_or_quote: "actors used exposed or stolen cloud identities, service-account keys and GitHub tokens to enable managed model services such as Amazon Bedrock and the Gemini API in victim accounts"
  summary: "(low confidence) GTIG names GitHub PATs as part of the dominant initial access vector (one actor used a stolen PAT to reach private code repositories plus a web-app flaw in a container); the enabling of model services is credited to 'Abuse of access keys'. The summary chains GitHub tokens to the enabling of model services. Fix: 'used ... GitHub tokens for initial access and then enabled managed model services'."
- code: F3
  category: claim-not-supported
  section: llmjacking-stolen-cloud-keys-enable-model-services-resale (Detection)
  item: "2026-11-09/llmjacking-stolen-cloud-keys-enable-model-services-resale"
  url_or_quote: "Datadog saw similar probing at 12 customers in 30 days: failed ListFoundationModels calls across several regions"
  summary: "(low confidence) Datadog says 'In the last 30 days, we've observed 12 organizations display similar malicious behavior. In the majority of instances, we have seen failed ListFoundationModels API calls in multiple regions without subsequent ListInferenceProfiles or Converse API calls', and one case differs (successful ListFoundationModels/ListInferenceProfiles then Converse AccessDenied). The clause drops 'in the majority of instances' and says customers where the page says organizations."
- code: F4
  category: hallucinated-fact
  section: cve-2026-123158 (Detection, superseded by the newest section)
  item: "2026-11-06/cve-2026-123158-openssh-musl-no-pam-password-bypass-sshole"
  url_or_quote: "The mechanism implies the same event in any sshd authentication log; no source publishes an indicator beyond that."
  summary: "(low confidence) The cited ISC page, added by this run, publishes scanner source addresses and the behavior 'attempts that used an all \"A\" password', and Previdian lists 'Indicators of compromise added (13)' behind its Pro tier, so 'no source publishes an indicator' is no longer literally true. Fix: 'no source publishes a log indicator beyond that; the scanner addresses ISC and Previdian list are omitted here'."
- code: F4
  category: hallucinated-fact
  section: cve-2026-123158 (sourcing_note)
  item: "2026-11-06/cve-2026-123158-openssh-musl-no-pam-password-bypass-sshole"
  url_or_quote: "OX Security's analysis is the source of the mechanism, the condition that an account's password field is `*`, the CVSS score and the Alpine fixed-package table; NCSC Switzerland's advisory and the project's release notes do not carry them."
  summary: "(low confidence) Alpine's own advisory, a listed source, carries the mechanism ('musl's crypt() returns the string * as an error indicator when the key is over 256 bytes long'), the '*' account condition and the fixed-package table (edge 10.6_p2-r0 ... 3.16 9.0_p1-r6); only the CVSS 8.1 is carried by OX, Previdian and THN but not by the vendor sources. The note misattributes three of the four items and the body cites OX (reliability C) where the vendor advisory carries the same facts. Fix: name Alpine's advisory for the mechanism, condition and table; keep OX for the CVSS score and the doas chain on the cloud images."
- code: F11
  category: editorial-advisory
  section: llmjacking-stolen-cloud-keys-enable-model-services-resale (techniques)
  item: "2026-11-09/llmjacking-stolen-cloud-keys-enable-model-services-resale"
  url_or_quote: "exploited token-creation privileges to generate temporary credentials for high-privilege service accounts, resulting in the exfiltration of infrastructure credentials, internal database passwords, and third-party API keys from cloud secret managers"
  summary: "Advisory: GTIG describes abuse of token-creation privileges to mint temporary credentials for high-privilege service accounts, which maps to T1548.005 (Temporary Elevated Cloud Access, active in the pin); it is not in techniques[]. A metadata-only addition, no body words needed."
- code: F11
  category: editorial-advisory
  section: cve-2026-123158 (Improvement section)
  item: "2026-11-06/cve-2026-123158-openssh-musl-no-pam-password-bypass-sshole"
  url_or_quote: "writing of the first scanners, its author expects that quite a few of those login attempts succeeded on its honeypots"
  summary: "Advisory: the clause 'writing of the first scanners' is garbled; ISC's author wrote it after the first-scanner table ('I expect quite a few of these login attempts were successful for our honeypots'). Suggest 'after listing the first scanners, its author expects ...'."
