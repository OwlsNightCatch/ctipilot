    entry: 2026-11-09/llmjacking-stolen-cloud-keys-enable-model-services-resale
    surface: "body"
    kind: cited
    text: "In multiple incidents the model services were not enabled at compromise, and the stolen keys were used to enable them and to create further API keys ("
    urls: ["https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models"]
