  - claim_id: e8e40d0172
    entry: 2026-11-09/llmjacking-stolen-cloud-keys-enable-model-services-resale
    surface: "summary"
    kind: frontmatter
    text: "GTIG and Mandiant report 2026 incident-response cases in which actors used exposed or stolen cloud identities, service-account keys and GitHub tokens to enable managed model services such as Amazon Bedrock and the Gemini API in victim accounts, run up charges above USD 100,000 in a single day and resell the quota through proxy gateways. Wiz describes a Google Cloud billing-account variant and Datadog the validation of stolen AWS keys for Bedrock; GTIG lists the audit-log events to watch in AWS, Azure and Google Cloud."
  - claim_id: 95eaae069a
    entry: 2026-11-09/llmjacking-stolen-cloud-keys-enable-model-services-resale
    surface: "body"
    kind: cited
    text: "Mandiant responded to multiple 2026 incidents in which actors hijacked enterprise access to large language models (\"LLMJacking\") with charges above USD 100,000 in a single day ("
    urls: ["https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models"]
  - claim_id: 694adb0135
    entry: 2026-11-09/llmjacking-stolen-cloud-keys-enable-model-services-resale
    surface: "body"
    kind: cited
    text: "One actor harvested LLM API keys from public GitHub repositories and validated them with single-token requests that stayed under EDR and SIEM volume alerts; another scripted calls against exposed Ollama endpoints to register its own models; cluster UNC6993 had users paste a raw JSON payload holding an active access token into a fake application-portal page, which bypasses password and MFA ("
    urls: ["https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models"]
  - claim_id: b0aed62d19
    entry: 2026-11-09/llmjacking-stolen-cloud-keys-enable-model-services-resale
    surface: "body"
    kind: cited
    text: "After the foothold the actors enumerated cloud services and repositories for credentials, took secrets from cloud secret managers, created unauthorized IAM and service accounts, attached administrative policies to service roles and injected SSH keys into compute instances or instance metadata; one rotated short-lived service accounts to get around rate limits ("
    urls: ["https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models"]
