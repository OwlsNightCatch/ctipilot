  - title: "LLMjacking: GTIG and Mandiant describe cloud-identity intrusions that switch on Bedrock, Gemini or Azure model services and resell the quota through proxy gateways, with per-cloud audit-log hunting guidance; Wiz and Datadog report the same GCP billing-hijack and AWS key-validation tradecraft"
    kind_hint: research
    sources:
      - { url: "https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models", publisher: "Google Threat Intelligence Group and Mandiant", date: "2026-11-02", role: "primary" }
      - { url: "https://threats.wiz.io/all-incidents/threat-actors-targeting-gcp-billing-accounts-for-llm-usage", publisher: "Wiz (Cloud Threat Landscape)", date: "2026-10-20", role: "corroborating" }
      - { url: "https://securitylabs.datadoghq.com/articles/beyond-valid-credentials-how-exposed-aws-keys-are-tested-for-amazon-bedrock-access/", publisher: "Datadog Security Labs", date: "2026-10-06", role: "corroborating" }
    discovery_trace: "first seen at: infosec-magazine feed https://www.infosecurity-magazine.com/rss/news/ (title only: 'LLMJacking is Costing Some Businesses Up to $1m, Warns Google', 2026-11-03) and darkreading feed https://www.darkreading.com/rss.xml (title only: 'LLMjacking Emerges as Thriving Cybercriminal Enterprise', 2026-11-03) -> pivot: mandiant-gtig feed https://feeds.feedburner.com/threatintelligence/pvexyqv7v0v -> primary: GTIG/Mandiant blog https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models/ -> corroboration: Wiz https://threats.wiz.io/all-incidents/threat-actors-targeting-gcp-billing-accounts-for-llm-usage and Datadog https://securitylabs.datadoghq.com/articles/beyond-valid-credentials-how-exposed-aws-keys-are-tested-for-amazon-bedrock-access/ (found via the datadog-security-labs slice feed)"
    summary: |
      GTIG and Mandiant report that in 2026 incident-response cases threat actors hijacked enterprise access to
      large language models ("LLMjacking") in organizations in North America, South America and Asia Pacific
      (financial services, retail, technology, transportation), with fraudulent charges above USD 100,000 a day
      and cumulative bills up to USD 1 million before access was revoked. GTIG says the dominant initial access
      has been exposed or stolen cloud identity tokens (IAM credentials, service-account keys, GitHub personal
      access tokens, live session tokens), plus publicly exposed model endpoints (an Ollama endpoint tested by
      script) and LLM API keys harvested from public GitHub repositories and validated with single-token
      requests (max_tokens=1) that stay under EDR and volume-anomaly alerts. After the foothold, actors
      enumerate cloud services and repositories, query warehouse metadata for credentials, create IAM and
      service accounts (one disguised as a billing-optimisation utility), attach administrative policies to
      service roles, inject SSH keys into compute instance metadata, and in one case a follow-on cluster
      elevated LiteLLM virtual keys to proxy-admin. Monetisation uses "LLM Mixers", gateways that pool and
      resell stolen quota; GTIG names UNC6993 (service-account-key and session-token hijack page, new-api and
      gcli2api gateways) and a Jet Night token router that passed nearly USD 1 million to one victim. In several
      cases the LLM services were not enabled at compromise time and the stolen keys enabled them. Wiz
      independently reports GCP billing accounts hijacked through search-ad phishing: the actor removes the
      iam.allowedPolicyMemberDomains guardrail, adds external billing admins, links foreign projects to the
      victim billing profile, demotes legitimate admins and runs Gemini API calls from its own project so prompt
      content is invisible to the victim; Datadog reports credential-harvesting platforms (KMON_NOC since
      2026-08-31) that test stolen AWS keys with STS GetCallerIdentity and then for Bedrock access.
      GTIG's hunting list is the actionable core: Bedrock Converse/InvokeModel*, ListFoundationModels,
      PutUseCaseForModelAccess/CreateFoundationModelAgreement and Get/Put/DeleteModelInvocationLoggingConfiguration
      in CloudTrail; Microsoft.CognitiveServices deployments/write plus diagnostic-setting changes in Azure; and,
      for GCP, aiplatform Predict/GenerateContent calls that appear only if Data Access audit logs are enabled
      (disabled by default), ServiceUsage.EnableService and sink reads.
    region_nexus: "global; GTIG cases in North America, South America and Asia Pacific; no Swiss case stated; applies to any public-sector cloud tenant where Bedrock, Azure AI services or Vertex/Gemini can be enabled by a stolen identity"
    primary_sector_nexus: "indirect (cloud tenants of public bodies adopting LLM services; GTIG's victims were financial services, retail, technology and transportation)"
