    discovery_trace: "first seen at: stepsecurity-blog feed https://www.stepsecurity.io/blog/rss.xml ('CVE-2026-109518: apt Flaw Lets Attackers Swap Packages After Verification and Run Code as Root', 2026-11-05) -> pivot: StepSecurity article https://www.stepsecurity.io/blog/cve-2026-109518-apt-package-swap-root (References: Debian advisory, USN-8996-1) -> primary: Ubuntu USN https://ubuntu.com/security/notices/USN-8996-1 and Debian tracker https://security-tracker.debian.org/tracker/CVE-2026-109518 (the lists.debian.org DSA page is behind a proof-of-work interstitial). The identifier and CVSS were read from the CNA (Canonical) CVE record via the MITRE CVE services API, not cited."
    summary: |
      CVE-2026-109518 (reporter Max Justicz) is a time-of-check to time-of-use flaw in apt's HTTP download retry
      handling: an attacker who controls the HTTP traffic between an apt client and its archive (a compromised
      network, a malicious or compromised mirror, or a proxy or package cache in the path) answers two package requests
      with redirects to the same URL, forces retries with temporary HTTP errors and, because apt mishandles the hard
      links it uses for the merged download, overwrites the file after the signature and hash check, so apt installs an
      unverified package that runs maintainer scripts as root. It needs a non-zero Acquire::Retries (default 3 since
      Debian 12 and Ubuntu 22.04; older releases are unaffected by default unless scripts raise it) and an
      install or upgrade to trigger it; snap and FTP sources are not affected. Fixes: Debian bookworm apt 2.6.2
      (DLA-4880-1), trixie 3.0.4 (DSA-6607-1), forky 3.3.6, sid 3.3.7; Ubuntu 26.10 3.3.3ubuntu0.1, 26.04 LTS
      3.2.1ubuntu0.1, 24.04 LTS 2.8.4ubuntu0.1, 22.04 LTS 2.4.15ubuntu0.1, and ESM builds 2.0.12+esm1 (20.04),
      1.6.19+esm1, 1.2.36+esm1, 1.0.1ubuntu2.24+esm4. The CNA scores it CVSS 4.0 7.7 (network, low complexity,
      attack requirements present, passive user interaction) and the CISA ADP SSVC entry of 2026-11-04 records
      exploitation none, not automatable, total technical impact; no exploitation is reported. StepSecurity's
      emphasis is CI/CD: self-hosted runners on flat networks, caches and proxies, Docker builds and developer machines
      that run apt-get install; patching only the proxy host does not patch its clients, and runner images and
      container base images must be rebuilt, not just patched in place.
    region_nexus: "global; Debian and Ubuntu servers, build hosts and workstations of any organisation, including Swiss public-sector Linux estates that install through an internal mirror, proxy or cache"
    primary_sector_nexus: "indirect (Linux estates behind package proxies)"
    sector: "cross-sector"
    cves: [CVE-2026-109518]
    techniques: [T1557, T1195.002]
    affected_products: ["apt (Debian)", "apt (Ubuntu)"]
    entity_keys: ["product:ubuntu"]
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    lookback: true
    borderline: true
    borderline_reason: "Not exploited (CISA ADP SSVC: exploitation none) and needs an on-path position or a malicious mirror, but it is root code execution in the package manager of Debian and Ubuntu with default settings and fixes exist; S1 did not return it. Priority notable at most."
    suggested_classification: "A1 (Canonical CNA record and distribution advisories for their own packages, Debian and Ubuntu independent trackers agree)"
    cve_row: { cve: "CVE-2026-109518", product: "apt (Debian, Ubuntu)", cvss: "CVSS 4.0 7.7 (CNA Canonical)", epss: null, kev: false, exploited: "none reported (CISA ADP SSVC 2026-11-04: exploitation none)", affected: "Debian bookworm apt < 2.6.2, trixie < 3.0.4, forky/sid < 3.3.6; Ubuntu apt < 2.4.15ubuntu0.1 (22.04), < 2.8.4ubuntu0.1 (24.04), < 3.2.1ubuntu0.1 (26.04), < 3.3.3ubuntu0.1 (26.10) with Acquire::Retries non-zero", fixed: "bookworm 2.6.2; trixie 3.0.4; forky 3.3.6; sid 3.3.7; Ubuntu 26.10 3.3.3ubuntu0.1, 26.04 3.2.1ubuntu0.1, 24.04 2.8.4ubuntu0.1, 22.04 2.4.15ubuntu0.1, 20.04 2.0.12+esm1", type: "TOCTOU via hard-link reuse on redirect-and-retry (CWE-62, CWE-367)", vector: "network, on-path (malicious mirror or proxy)", auth: "none", source: "https://ubuntu.com/security/notices/USN-8996-1" }
    evidence:
      - quote: "an on-path attacker who can manipulate the HTTP traffic (including a malicious mirror or proxy) between an APT client and an archive server triggered by a package install can trick the client into installing an attacker-controlled unverified package and achieve remote code execution with root privileges"
        attribution: "Debian Security Tracker"
        source_url: "https://security-tracker.debian.org/tracker/CVE-2026-109518"
      - quote: "the value 3 is the default starting with Debian 12 (bookworm) and Ubuntu 22.04 LTS (Jammy Jellyfish), so older releases are unaffected in a default configuration"
        attribution: "Debian Security Tracker"
        source_url: "https://security-tracker.debian.org/tracker/CVE-2026-109518"
      - quote: "This is a time-of-check to time-of-use bug."
        attribution: "StepSecurity"
        source_url: "https://www.stepsecurity.io/blog/cve-2026-109518-apt-package-swap-root"
      - quote: "Update apt in your runner images, rebuild them, and roll out new pods or VMs."
        attribution: "StepSecurity"
        source_url: "https://www.stepsecurity.io/blog/cve-2026-109518-apt-package-swap-root"
    exposure_note: "Check: apt version and retry setting with apt list --installed '?source-package(^apt$)' and apt-config dump | grep Acquire::Retries (StepSecurity); anything that installs over plain HTTP or through a shared mirror, proxy or cache; CI runner images, Dockerfiles and base images that pin an old apt."
    detection_note: "Telemetry class: package-manager and network telemetry. HTTP (port 80) package fetches from build and server hosts, redirect-and-retry bursts (repeated 3xx and 5xx answers) before an install, and dpkg-installed packages whose files differ from the archive (debsums/hash comparison against the mirror). A swapped package leaves no failed signature check in apt logs, so post-patch compromise checks mean comparing installed package hashes on hosts that installed through an untrusted path during the exposure window. Mitigation until patched: Acquire::Retries 0 and HTTPS mirrors."
    triage_note: "Benign lookalike: flaky mirrors legitimately produce redirects, temporary errors and retries during installs. Discriminator: redirects that point two different package requests at one URL, followed by a retry and a different file hash than the archive's."
