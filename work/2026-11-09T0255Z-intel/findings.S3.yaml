  - title: "APT flaw CVE-2026-109518: an on-path attacker or malicious mirror or proxy can swap a package after apt has verified it and run code as root; Debian and Ubuntu fixed 2026-11-04"
    kind_hint: vulnerability
    sources:
      - { url: "https://ubuntu.com/security/notices/USN-8996-1", publisher: "Ubuntu Security Notices (USN-8996-1)", date: "2026-11-04", role: "primary" }
      - { url: "https://security-tracker.debian.org/tracker/CVE-2026-109518", publisher: "Debian Security Tracker (DSA-6607-1, DLA-4880-1)", date: "2026-11-04", role: "primary" }
      - { url: "https://security-tracker.debian.org/tracker/DSA-6607-1", publisher: "Debian Security Tracker (DSA-6607-1)", date: "2026-11-04", role: "corroborating" }
