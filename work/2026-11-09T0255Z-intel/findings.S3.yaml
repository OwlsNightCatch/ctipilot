    exposure_note: "Exposed where a cloud identity (IAM user or role, service-account key, federated or session token) can enable or call Bedrock, Azure AI services or Vertex/Gemini endpoints, and where a self-hosted gateway (LiteLLM) or model endpoint (Ollama) is reachable. Check: whether model services are enabled at all per account/project, and whether model invocation logging (Bedrock), Azure data-plane diagnostic logs and GCP Data Access logs are on."
    detection_note: "Telemetry class: cloud control-plane audit logs. Hunt: Bedrock/aiplatform/CognitiveServices enablement and deployment creation by identities that never used them; model-invocation spikes and ThrottlingException/ValidationException bursts; single-token (max_tokens=1) probes at the gateway; new IAM or service accounts, administrative policy attachments and SSH keys added to instance or project metadata; changes to logging configuration by non-IaC principals (treat as high severity per GTIG); on GCP, org-policy removal (iam.allowedPolicyMemberDomains), new external billing admins and foreign projects linked to the billing account. Rotating or revoking the key does not undo created accounts, SSH keys or enabled services: review those after revocation."
    triage_note: "Benign lookalike: sanctioned AI development teams legitimately enable model services and call InvokeModel/Predict. Discriminators GTIG's guidance implies: caller identity and user agent (automation SDKs such as aws-sdk-go-v2 or rust from unfamiliar addresses), whether the service was enabled by the actor in the same session, multi-region reconnaissance before enablement, quota-increase requests, and logging being switched off."
