  - title: "Third-party service principals in Entra ID: SpecterOps lays out why one vendor credential reached 100+ tenants in the ConnectWise Cloud Backup incident and gives a six-step audit-and-limit checklist"
    kind_hint: research
    sources:
      - { url: "https://specterops.io/blog/2026/11/06/app-registrations-vs-service-principals/", publisher: "SpecterOps (Lee Robinson)", date: "2026-11-06", role: "primary" }
    discovery_trace: "first seen at: specterops feed https://specterops.io/feed/ (2026-11-06T17:00Z; sources.json last_successful_fetch 2026-11-05 predates the post) -> primary (no pivot needed): https://specterops.io/blog/2026/11/06/app-registrations-vs-service-principals/"
    summary: |
      SpecterOps explains the model behind the ConnectWise Cloud Backup (SkyKick) incident already in the store: an app
      registration lives in one home tenant and holds the credentials, while the service principal (Enterprise
      applications) in every consenting tenant holds the permissions, so a credential stolen from the vendor's
      app registration authenticates as the service principal in every customer tenant by swapping the directory ID.
      SpecterOps notes that the ConnectWise app requested application permissions covering all mailboxes through
      Exchange Web Services and full control of SharePoint site collections, plus Application.ReadWrite.All and
      AppRoleAssignment.ReadWrite.All, which turn a data path into a possible tenant takeover, and that it does not
      know how the actor obtained the credential. Attacker paths it lists: steal an existing secret or certificate
      (code, config, CI/CD, federated identity credentials such as GitHub Actions workflows), add a credential to
      the app registration (owners, Application Administrator, Cloud Application Administrator, any principal with
      Application.ReadWrite.All), add one directly to the service principal through the addPassword endpoint (not
      shown in the Entra admin center; app-instance property lock now defaults on for new app registrations), or
      escalate from a principal already controlled. Defender steps: list service principals whose
      appOwnerOrganizationId is neither your tenant nor Microsoft (the default Enterprise applications view hides some),
      group them by owning tenant and review granted application permissions, disable (reversibly) what is unused;
      audit app registrations and service-principal passwordCredentials/keyCredentials through Graph and who may add
      credentials; limit user consent to low-risk permissions from verified publishers and enable the admin consent
      workflow; ingest service-principal sign-in logs (a separate log, needs Entra P1/P2) and watch for a new source IP,
      new credentials (two audit activity names: "Update application - Certificates and secrets management" and
      "Add service principal credentials") and new consent grants, and enable MicrosoftGraphActivityLogs; consider
      Conditional Access for workload identities, which needs the separate Workload ID Premium licence, supports only
      IP, risk and authentication-context conditions, covers only single-tenant principals in your own tenant and
      therefore does not stop a vendor compromise.
