  - title: "Typos and expired domains in US government SPF, MX, NS and DMARC records: SH Consulting's scan of 25,964 government domains finds 43 that trust domains outside their control, some already abused"
    kind_hint: research
    sources:
      - { url: "https://www.sh.consulting/blog/government-dangling-dns-records", publisher: "SH Consulting (Alex Shakhov)", date: "2026-11-05", role: "primary" }
      - { url: "https://www.darkreading.com/cybersecurity-operations/us-government-email-systems-abuse-typos", publisher: "Dark Reading", date: "2026-11-05", role: "corroborating" }
    discovery_trace: "first seen at: darkreading feed https://www.darkreading.com/rss.xml ('US Government Email Systems Open to Abuse Thanks to Typos', 2026-11-05T21:35Z) -> pivot: Dark Reading article https://www.darkreading.com/cybersecurity-operations/us-government-email-systems-abuse-typos -> primary: SH Consulting study https://www.sh.consulting/blog/government-dangling-dns-records"
    summary: |
      SH Consulting scanned 25,964 government-related domains (16,984 .gov, 8,980 on other TLDs) twice, in June and
      October 2026, and found 43 whose SPF, MX, NS or DMARC records point at expired, mistyped or repurposed
      domains outside the owner's control; some are already being abused. SPF: a Michigan county's record includes a
      one-letter typo of Amazon SES's include domain; the typo domain's include chain resolved to eight records
      authorizing at least 32,066 IPv4 addresses, all of which evaluated SPF = pass and DMARC = pass, and the include
      content has rotated every few days since at least March 2026 (snowshoe sending); SH Consulting says most of
      the addresses are on blocklists and ties the operator to the group Abusix documented taking over dangling
      CNAMEs. A Kentucky city's include is a domain re-registered in April 2026 after SubdoMailing publicity, 75 IPs.
      NS: several municipalities still delegate former or typo nameserver domains; one Idaho city's retired domain
      now serves a casino page from attacker-controlled nameservers that also send and receive mail as the old
      domain (Infoblox counts about 1,100 domains on those nameservers since July 2025); an Illinois domain lists a
      one-letter typo of a GoDaddy nameserver that was re-registered on 2026-08-27 and now resolves to AWS.
      MX: about 27% of the scanned domains run self-hosted mail, hand-typed MX hostnames hide behind backup MX
      records, so nothing visibly breaks; no confirmed interception. DMARC: eight unregistered reporting endpoints
      covered 11 government institutions; the report data (sender IPs, volumes, authentication results, platforms,
      and for Microsoft the recipient domains) maps the organisation's mail infrastructure for targeted phishing.
      SH Consulting registered 17 of the dependencies defensively and reported to CISA and MS-ISAC. Remedies it
      names: stop hand-typing DNS records, keep a map of where each record came from, register own misspellings, and
      run a quarterly script that flags invalid domains or destinations. The data are US-only; the mechanism is
      jurisdiction-independent.
    region_nexus: "United States (study scope); the failure class is jurisdiction-independent, so Swiss cantonal and communal domains with legacy, renamed or merged-entity domains in SPF includes, NS delegations, MX hosts and DMARC rua/ruf targets are exposed the same way (analyst inference; no Swiss domain was examined)"
    primary_sector_nexus: "direct (government domains)"
    sector: "public-sector"
    cves: []
    techniques: [T1583.001, T1584.001, T1684.002, T1566, T1114]
    affected_products: []
    entity_keys: []
    new_entities: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    lookback: true
    suggested_classification: "C2 (small consultancy, first-party DNS scan with checkable DNS facts; Dark Reading interviewed the same researcher and is not independent)"
    sourcing_note: "SH Consulting is the only collector of the data; Dark Reading re-reports it from an interview with the same researcher. The DNS records are publicly checkable and the study names no Swiss entity. Attribution of the Livingston County operator to the Abusix-documented group is SH Consulting's statement, not independently verified."
    evidence:
      - quote: "When we scanned 25,964 government-related domains, we found 43 whose DNS records still reference expired, mistyped, and repurposed domains, leaving them at risk of abuse, and some of them are already being abused."
        attribution: "SH Consulting"
        source_url: "https://www.sh.consulting/blog/government-dangling-dns-records"
      - quote: "Together, they authorized at least 32,066 unique IPv4 addresses, giving any of those IP addresses permission to send mail on behalf of Livingston County’s milivcounty.gov email addresses."
        attribution: "SH Consulting"
        source_url: "https://www.sh.consulting/blog/government-dangling-dns-records"
      - quote: "We analyzed 25,964 government domains and found that around 27% point to their own self-hosted mail servers to process inbound mail."
        attribution: "SH Consulting"
        source_url: "https://www.sh.consulting/blog/government-dangling-dns-records"
      - quote: "Those domains were set to receive reports for 11 government institutions."
        attribution: "SH Consulting"
        source_url: "https://www.sh.consulting/blog/government-dangling-dns-records"
      - quote: "47% of the unregistered domains we found in SPF and DMARC records were typos, either of the organization's own domain or of a provider's."
        attribution: "Alex Shakhov, quoted by Dark Reading"
        source_url: "https://www.darkreading.com/cybersecurity-operations/us-government-email-systems-abuse-typos"
    exposure_note: "Any organisation that publishes SPF includes, MX hosts, NS delegations or DMARC rua/ruf addresses on a domain it owns, including parked and retired domains; the exposure is invisible from inside (mail keeps flowing via the correct records). Check: resolve every domain named in every SPF include chain, MX, NS, CNAME and DMARC reporting address for each owned domain and flag any that is unregistered, registered recently, for sale or parked."
    detection_note: "Telemetry class: DNS zone data plus mail-authentication reports. Enumerate and resolve all referenced domains on a schedule and alert on NXDOMAIN, changed registrant or registration date, or nameserver changes of a dependency; in DMARC aggregate reports look for sending IPs that pass SPF but belong to none of your providers, and for SPF include trees whose size or content changes every few days. There is no post-patch step: after correcting a record, review mail sent as your domain in the abuse window and the DMARC reports that went to the unregistered endpoint."
    triage_note: "Benign lookalike: legitimate providers rotate the IP content behind a correctly spelled SPF include (Microsoft 365, Amazon SES, Google). Discriminator: the include domain is a misspelling of a provider's domain, is not owned by that provider, or the dependency's registration date is recent."
    extended_notes: |
      The URL-quoted typo domains and attacker nameserver names in the primary are not carried (no IOCs). SH Consulting
      says more than 12,000 US government domains publish no spoofing protection at all; that is its claim from the same scan.
