    discovery_trace: "first seen at: infosec-magazine feed https://www.infosecurity-magazine.com/rss/news/ ('Residential Proxy Traffic Traced to White House Network', 2026-11-05T16:00Z) -> pivot: Infosecurity article https://www.infosecurity-magazine.com/news/white-house-residential-proxy-exits/ -> primary: Layer3 Intel https://layer3intel.com/blog/residential-proxies-white-house-network ; thematic pivot (not a stated link between the two): Microsoft Security Blog index https://www.microsoft.com/en-us/security/blog/topic/threat-intelligence/ -> https://www.microsoft.com/en-us/security/blog/2026/11/03/fake-download-campaign-uses-trojanized-installers-deliver-monetization-payloads/"
    summary: |
      Layer3 Intel reports that between 2026-10-05 and 2026-11-03 its residential-proxy enumeration pipeline exited
      through AS2650, the network registered to the US Executive Office of the President, 236 times via six
      addresses on 26 of 30 days across 28 public proxy services, with about half the exits between 17:00 and
      midnight Eastern time. Layer3 reads the pattern as a person, not guest Wi-Fi, whose device carries a proxy SDK,
      says its data shows the exits but not the device, reports no compromise of White House systems and notes that a
      poorly secured proxy SDK could give an outsider reach into internal systems (it cites Synthient's Kimwolf
      research). Synthient's attribution to a bundled streaming app comes only from posts on X and is not carried.
      Separately, Microsoft documents a fake-download campaign (cracked software, game and plug-in lures) whose
      trojanized Inno Setup-style installers run from %TEMP%\is-*.tmp, call back with a d=inno and r=offer_execution
      pattern and install monetization payloads unattended; the proxy branch, WorldProxyPool, creates three
      SYSTEM scheduled tasks (agent at startup, a hidden PowerShell watchdog every five minutes, an hourly updater) under
      Program Files. Microsoft's preventive and hunting steps are software-source control, cloud-delivered protection,
      tamper protection, reputation-based protection and ASR rules, plus review of new SYSTEM scheduled tasks and
      software inventory for proxy and distributed-compute applications. Microsoft and Layer3 do not link their
      findings; the shared point is that a proxy agent on a workstation makes the organisation's egress address a
      resold exit node.
