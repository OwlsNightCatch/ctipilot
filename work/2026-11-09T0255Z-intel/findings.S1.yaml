items:
  - title: "SANS ISC: sshole (CVE-2026-123158) exploit attempts reach its Cowrie honeypots from 2026-11-05, peak 2026-11-06, falling by 2026-11-08"
    sources:
      - { url: "https://isc.sans.edu/diary/33498", publisher: "SANS Internet Storm Center (Johannes Ullrich)", date: "2026-11-08", role: "primary" }
    discovery_trace: "first seen at: sans-isc via feed, URL https://isc.sans.edu/rssfeed_full.xml (item 'Scans for Sshole Vulnerability (CVE-2026-123158)', 2026-11-08T15:44Z) -> primary (no pivot needed): https://isc.sans.edu/diary/33498"
    summary: |
      SANS ISC reports from its Cowrie SSH honeypots that attempts using over-long passwords rose after the sshole disclosure: the daily count of passwords that reach the honeypots' 255-character capture limit was 5 on 2026-11-03, 58 on 11-04, 232 on 11-05, 713 on 11-06, 246 on 11-07 and 51 on 11-08 (the last day partial). The 23 on 11-01 predate the flaw and, per ISC, are buggy brute-force scripts typing shell commands into the password field. ISC dates the first genuine sshole attempts to 2026-11-05, using an all-A password, from a spread of scanning sources on commercial ISP and hosting networks. Because ISC captures only the first 255 characters, it sees the leading part of the 257 to 1,024 byte passwords the flaw needs and cannot show success; ISC writes that it expects quite a few attempts succeeded on its honeypots and will follow up. The delta for the covered entry: a second, independent telemetry holder (alongside the Previdian sensor counts and The Hacker News honeypot report the entry already carries) confirms scanning and exploit attempts, with the wave already decaying by 2026-11-08; still no report of a compromised production host and CISA does not list CVE-2026-123158.
    region_nexus: "global; Alpine Linux and OpenWrt on musl without PAM (Swiss estates: embedded routers, containers, jump hosts)"
    primary_sector_nexus: "indirect"
    sector: "public-sector"
    cves: [CVE-2026-123158]
    techniques: [T1190, T1021.004]
    affected_products: ["OpenSSH", "Alpine Linux", "OpenWrt"]
    entity_keys: ["product:openssh", "product:alpine-linux", "product:openwrt"]
    new_entities: []
    verification: SINGLE-SOURCE
    confidence: MEDIUM
    novelty: "update-of:2026-11-06/cve-2026-123158-openssh-musl-no-pam-password-bypass-sshole"
    suggested_record: { type: update, fields: [summary, sources, evidence] }
    suggested_priority: "unchanged (notable)"
    classification_suggestion: { reliability: B, credibility: 2 }
    evidence:
      - quote: "With the emergence of the \"sshole\" vulnerability last week, we are now seeing an increase in attempts to exploit the vulnerability."
        attribution: "SANS Internet Storm Center (Johannes Ullrich)"
        source_url: "https://isc.sans.edu/diary/33498"
      - quote: "The first actual exploit attempt for sshole arrived on November 5th, with attempts that used an all \"A\" password."
        attribution: "SANS Internet Storm Center (Johannes Ullrich)"
        source_url: "https://isc.sans.edu/diary/33498"
      - quote: "Our honeypots collect only the first 255 characters of SSH passwords."
        attribution: "SANS Internet Storm Center (Johannes Ullrich)"
        source_url: "https://isc.sans.edu/diary/33498"
      - quote: "I expect quite a few of these login attempts were successful for our honeypots, and I will follow up with more details as I extract them."
        attribution: "SANS Internet Storm Center (Johannes Ullrich)"
        source_url: "https://isc.sans.edu/diary/33498"
    extended_notes: |
      Detection angle that follows from the mechanism the entry already describes: on musl/no-PAM sshd hosts, authentication log lines for a successful password login to an account whose password field is * (service or locked accounts) are the discriminating event; ISC's own sensor idea is a counter of password-auth attempts at or above the capture length. Benign lookalike per ISC: brute-force scripts that paste post-login shell commands into the password field (their Nov 1 spike), which are not exploit attempts. ISC's own wording limits the reading: attempts, not confirmed successes.

  - title: "OpenAM before 16.1.4: unauthenticated session-token theft via the notification WebSocket (CVE-2026-123551), SAML service provider accepts unsigned assertions (CVE-2026-123550), self-registration creates administrators (CVE-2026-123549)"
    sources:
      - { url: "https://github.com/OpenIdentityPlatform/OpenAM/security/advisories/GHSA-5c3q-hp86-xjr8", publisher: "OpenIdentityPlatform OpenAM project (GitHub security advisory)", date: "2026-10-22", role: "primary" }
      - { url: "https://github.com/OpenIdentityPlatform/OpenAM/security/advisories/GHSA-3j2f-qhrc-rjfj", publisher: "OpenIdentityPlatform OpenAM project (GitHub security advisory)", date: "2026-10-22", role: "primary" }
      - { url: "https://github.com/OpenIdentityPlatform/OpenAM/security/advisories/GHSA-jv8f-m88g-h6mm", publisher: "OpenIdentityPlatform OpenAM project (GitHub security advisory)", date: "2026-10-22", role: "primary" }
      - { url: "https://github.com/OpenIdentityPlatform/OpenAM/releases/tag/16.1.4", publisher: "OpenIdentityPlatform OpenAM project (release 16.1.4)", date: "2026-10-22", role: "primary" }
      - { url: "https://www.vulncheck.com/advisories/openam-before-16.1.4-saml-authentication-bypass-via-unsigned-assertions", publisher: "VulnCheck (CNA advisory for CVE-2026-123550)", date: "2026-11-07", role: "corroborating" }
      - { url: "https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-119436", publisher: "ENISA EU Vulnerability Database (EUVD-2026-119436, CVE-2026-123551)", date: "2026-11-08", role: "corroborating" }
    discovery_trace: "first seen at: enisa-euvd, URL https://euvdservices.enisa.europa.eu/api/search?fromScore=9&toScore=10&fromDate=2026-11-06&toDate=2026-11-09&size=100 (critical-score sweep: EUVD-2026-119434/-119435/-119436, published 2026-11-08T01:37Z, assigner VulnCheck) -> pivot: EUVD record references -> primary: https://github.com/OpenIdentityPlatform/OpenAM/security/advisories/GHSA-5c3q-hp86-xjr8 (+ GHSA-3j2f-qhrc-rjfj, GHSA-jv8f-m88g-h6mm) -> https://github.com/OpenIdentityPlatform/OpenAM/releases/tag/16.1.4 -> https://www.vulncheck.com/advisories/openam-before-16.1.4-saml-authentication-bypass-via-unsigned-assertions"
    summary: |
      The OpenIdentityPlatform OpenAM community edition (an open-source access-management server for web SSO, SAML 2.0 and OAuth 2.0) fixed a large security batch in 16.1.4 on 2026-10-22, and VulnCheck, as CNA, assigned CVE identifiers to the three critical advisories on 2026-11-07/08 (ENISA EUVD lists them 2026-11-08). The store carries no OpenAM coverage. (1) CVE-2026-123551, GHSA-5c3q-hp86-xjr8 (CVSS 4.0 10.0): OpenAM 14.0.0 to 16.1.3 with default settings publishes full session identifiers (the iPlanetDirectoryPro bearer value) on the agent notification WebSocket, and the agent-only check on that socket can be bypassed without credentials through an unvalidated internal request forward on legacy Liberty ID-FF endpoints; an unauthenticated attacker who can reach the OpenAM port holds a connection open and passively collects the session token of every user whose session is created, changed or ended, administrators included, with no failed logins or lockouts to see. (2) CVE-2026-123550, GHSA-3j2f-qhrc-rjfj (CVSS 4.0 9.3, GitHub 9.8): a hosted SAML 2.0 service provider accepts unsigned assertions on the ECP (PAOS) and HTTP-Artifact bindings; it needs the ECP assertion consumer service in the metadata (generated default), WantAssertionsSigned off (generated default) and an encryption key configured on the service provider (the one administrator choice), and then an unauthenticated attacker obtains a session as any user the provider maps the assertion to, administrators included; the same fix adds one-time-use enforcement on every binding. (3) CVE-2026-123549, GHSA-jv8f-m88g-h6mm (CVSS 4.0 9.3, GitHub 9.8): self-registration does not enforce the allowed-attribute list, so an anonymous user can register into administrative groups and gain full control; only realms with self-registration enabled are affected (off by default). Release 16.1.4 also fixes built-in accounts with publicly known passwords (demo user, anonymous, WS-Security agents) allowing unauthenticated login, open redirects, an unauthenticated deserialisation denial of service and further SAML 1.x and OAuth 2.0 device-flow flaws. Affected: all releases up to and including 16.1.3 (for the WebSocket flaw from 14.0.0, earlier releases have no notification WebSocket); the only fixed build the advisories name is 16.1.4. The project withholds technical detail and proof-of-concept code on purpose, and no source reports exploitation. Upgrade notes matter for SAML estates: after 16.1.4 a service provider refuses unsigned assertions (assertionNotSigned), including OpenAM-to-OpenAM and Fedlet federation over HTTP-Artifact with default metadata, so set WantAssertionsSigned in the service-provider metadata (the identity provider's copy included) before upgrading; Liberty ID-FF providers get a Relay State URL list and customised web.xml files must take over the new dispatcher elements.
    region_nexus: "global; Swiss public-sector SSO / federation estates that run the OpenIdentityPlatform OpenAM fork (usage not established from sources)"
    primary_sector_nexus: "direct if deployed: cantonal and municipal identity providers, web access management in front of e-government portals"
    sector: "public-sector"
    cves: [CVE-2026-123551, CVE-2026-123550, CVE-2026-123549]
    techniques: [T1190, T1550.004, T1606.002]
    affected_products: ["OpenAM (OpenIdentityPlatform community edition)"]
    entity_keys: []
    new_entities:
      - { key: "product:openam", type: product, name: "OpenAM (OpenIdentityPlatform)", aliases: ["OpenIdentityPlatform OpenAM", "OpenAM community edition"], summary: "Open-source access-management server (web SSO, SAML 2.0, OAuth 2.0) maintained by the OpenIdentityPlatform project; release 16.1.4 of 2026-10-22 fixed three critical unauthenticated identity flaws (OpenAM project advisories)." }
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    borderline: true
    borderline_reason: "Disclosure and fix date from 2026-10-22 (18 days before the window); only the CVE identifiers (VulnCheck 2026-11-07, EUVD 2026-11-08) are in-window; no exploitation reported; store has never covered OpenAM and a Swiss public-sector footprint is not established. Against that: three critical unauthenticated flaws in an SSO / SAML server, default-reachable session-token theft, and no earlier coverage; recommend a short notable entry if the main agent accepts the CVE-assignment date as the in-window development."
    suggested_priority: "notable"
    classification_suggestion: { reliability: A, credibility: 2 }
    evidence:
      - quote: "An unauthenticated attacker who can reach the OpenAM port and hold a connection to the notification WebSocket can passively collect the live session token of every user whose session is created, changed or ended while the connection is open"
        attribution: "OpenIdentityPlatform OpenAM project (GitHub security advisory)"
        source_url: "https://github.com/OpenIdentityPlatform/OpenAM/security/advisories/GHSA-5c3q-hp86-xjr8"
      - quote: "Technical details and proof-of-concept code are deliberately withheld for now, to give operators time to upgrade to OpenAM 16.1.4."
        attribution: "OpenIdentityPlatform OpenAM project (GitHub security advisory)"
        source_url: "https://github.com/OpenIdentityPlatform/OpenAM/security/advisories/GHSA-5c3q-hp86-xjr8"
      - quote: "its metadata advertises the ECP (PAOS) assertion consumer service, which the generated hosted service provider metadata does by default;"
        attribution: "OpenIdentityPlatform OpenAM project (GitHub security advisory)"
        source_url: "https://github.com/OpenIdentityPlatform/OpenAM/security/advisories/GHSA-3j2f-qhrc-rjfj"
      - quote: "Only realms where self-registration is enabled are affected. Self-registration is off by default in both the legacy and the current self-service settings."
        attribution: "OpenIdentityPlatform OpenAM project (GitHub security advisory)"
        source_url: "https://github.com/OpenIdentityPlatform/OpenAM/security/advisories/GHSA-jv8f-m88g-h6mm"
      - quote: "OpenAM before 16.1.4 contains an authentication bypass vulnerability in its SAML v2.0 service provider that accepts unsigned assertions on the ECP (PAOS) and HTTP-Artifact bindings when WantAssertionsSigned is false."
        attribution: "VulnCheck"
        source_url: "https://www.vulncheck.com/advisories/openam-before-16.1.4-saml-authentication-bypass-via-unsigned-assertions"
    extended_notes: |
      Exposure: running version from the OpenAM console / server version string; the WebSocket flaw needs only network reach to the OpenAM port on a default install (agent notifications are on by default), the SAML flaw needs a hosted SAML 2.0 service provider with an encryption key, the self-registration flaw needs self-registration enabled in a realm. Interim mitigations from the project advisory: restrict /openam/notifications and /openam/ws/* at the reverse proxy to the policy-agent hosts, set the advanced server property org.forgerock.openam.notifications.agents.enabled to false where agents do not need it, block the legacy Liberty ID-FF endpoints (/openam/preLogin, /openam/postLogin) unless ID-FF is in use. Post-patch compromise check (project guidance): treat current administrator and user sessions as potentially exposed and rotate them, watch for WebSocket connections to the notifications path from hosts that are not policy agents, subscriptions to the session topic, and changes to the scripting-engine configuration; for SAML, review sessions created through the ECP or HTTP-Artifact bindings since deployment. Detection telemetry classes: reverse-proxy / web access logs for the notification and ID-FF paths, OpenAM audit and session logs (session creation by a federated user that was never authenticated at the IdP), identity-provider-side assertion logs for the SAML paths. Benign lookalike: policy agents legitimately subscribe to the notification socket; the discriminator is the source host. Not in CISA KEV; no exploitation reported by any source.

  - title: "Contact Form 7 6.2 to 6.2.3: unauthenticated arbitrary file upload, fixed in 6.2.4 (CVE-2026-114432); code execution needs Apache that lists directories and maps .phar to PHP"
    sources:
      - { url: "https://contactform7.com/2026/10/29/contact-form-7-624/", publisher: "Contact Form 7 (release announcement 6.2.4)", date: "2026-10-29", role: "primary" }
      - { url: "https://wpscan.com/vulnerability/6b0a5d1f-84fb-425f-8d37-ddde5703937c/", publisher: "WPScan (CNA record for CVE-2026-114432)", date: "2026-11-05", role: "corroborating" }
      - { url: "https://patchstack.com/database/wordpress/plugin/contact-form-7/vulnerability/contact-form-7-6-2-3-unauthenticated-arbitrary-file-upload", publisher: "Patchstack (vulnerability database)", date: "2026-10-31", role: "corroborating" }
      - { url: "https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-119468", publisher: "ENISA EU Vulnerability Database (EUVD-2026-119468)", date: "2026-11-08", role: "corroborating" }
      - { url: "https://contactform7.com/2026/10/06/contact-form-7-620/", publisher: "Contact Form 7 (release announcement 6.2)", date: "2026-10-06", role: "context" }
    discovery_trace: "first seen at: enisa-euvd, URL https://euvdservices.enisa.europa.eu/api/search?fromScore=9&toScore=10&fromDate=2026-11-06&toDate=2026-11-09&size=100 (and `enisa-euvd recent criticals`; EUVD-2026-119468, CVE-2026-114432, published 2026-11-08T06:00Z, CVSS 3.1 9.8) -> pivot: WPScan record https://wpscan.com/vulnerability/6b0a5d1f-84fb-425f-8d37-ddde5703937c/ -> pivot: Patchstack https://patchstack.com/database/wordpress/plugin/contact-form-7/vulnerability/contact-form-7-6-2-3-unauthenticated-arbitrary-file-upload -> primary: https://contactform7.com/2026/10/29/contact-form-7-624/"
    summary: |
      Contact Form 7 6.2.4 of 2026-10-29 fixes an unauthenticated arbitrary file upload that affects only the 6.2 line, versions 6.2 to 6.2.3 (6.2 shipped 2026-10-06 and requires WordPress 7.1 or later and PHP 8.3 or later, so sites still on the 6.1 series are not affected). The vendor says attackers combine several flaws to upload files that validation should block and to keep files that should be deleted after submission, and that in theory every form with a file-upload field on an HTTP server configured to list directory contents publicly can be a target; the finders are Shinya Murakami and Jakub Herman, reported through WPScan. Patchstack's analysis: 6.2 dropped the file-type check from wpcf7_unship_uploaded_file(), so files land in a wpcf7_uploads subfolder named with a random ten-digit number before validation and rejected ones are never deleted, and the remaining blocklist misses phar, pht, phps and .htaccess; the trigger is an unauthenticated POST to the plugin's feedback REST route, and Patchstack rates attack complexity high because the random folder name is not disclosed. WPScan's record (published 2026-11-05) adds the code-execution condition: on a stock Debian or Ubuntu Apache configuration, which lists directory contents and maps .phar to the PHP handler, the stored file can be located and executed; on nginx and on Apache with .htaccess overrides enabled the result is an arbitrary file written to the uploads directory that can still be served as active content such as HTML or SVG from the site's own origin. The CVE identifier CVE-2026-114432 (WPScan as CNA, CVSS 3.1 9.8) reached ENISA EUVD on 2026-11-08, which is the in-window development; Patchstack scores the flaw medium priority (it lists "expected to become exploited"), the severities disagree because the CVSS vector ignores the web-server precondition. No source reports exploitation, a public proof of concept or a CISA KEV listing. The 6.2.4 hardening also changes behaviour: wpcf7_antiscript_file_name() now uses a safelist of extensions (audio, video, image, pdf and txt by default; extendable through the wpcf7_file_extension_safelist filter), so forms that accept other types such as zip need the filter after updating; 6.2.4.1 (a later point release) is an unrelated regression fix, current release is 6.2.4.1.
    region_nexus: "global; WordPress sites of cantonal and municipal bodies (contact and application forms with attachments)"
    primary_sector_nexus: "indirect: communal and cantonal WordPress sites, outsourced web agencies"
    sector: "public-sector"
    cves: [CVE-2026-114432]
    techniques: [T1190, T1505.003]
    affected_products: ["Contact Form 7 (WordPress plugin)", "WordPress"]
    entity_keys: ["product:wordpress"]
    new_entities:
      - { key: "product:contact-form-7", type: product, name: "Contact Form 7", aliases: ["Contact Form 7 WordPress plugin", "CF7"], summary: "WordPress contact-form plugin by Takayuki Miyoshi (Rock Lobster Inc.) with more than 10 million active installations per its wordpress.org listing; version 6.2.4 of 2026-10-29 fixes an unauthenticated arbitrary file upload in 6.2 to 6.2.3 (vendor announcement)." }
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    borderline: true
    borderline_reason: "The fix and vendor announcement are 2026-10-29; Patchstack published 2026-10-31 and WPScan 2026-11-05, so only the CVE record in EUVD (2026-11-08) is in-window; no exploitation reported, Patchstack rates it medium and the code-execution path needs a specific Apache configuration and the 6.2 line (WordPress 7.1+, PHP 8.3+). Against that: Contact Form 7 is on more than 10 million sites and file-upload fields on public forms are common on communal sites; recommend routine awareness entry or drop, main agent's call."
    suggested_priority: "routine"
    classification_suggestion: { reliability: A, credibility: 2 }
    evidence:
      - quote: "The issue is an unauthenticated arbitrary file upload."
        attribution: "Contact Form 7 (release announcement 6.2.4)"
        source_url: "https://contactform7.com/2026/10/29/contact-form-7-624/"
      - quote: "Theoretically, all forms that have file uploading fields and are hosted on an HTTP server configured to list directory contents publicly can be a target."
        attribution: "Contact Form 7 (release announcement 6.2.4)"
        source_url: "https://contactform7.com/2026/10/29/contact-form-7-624/"
      - quote: "the leftover blocklist misses phar/pht/phps/.htaccess. Unauth POST to the CF7 feedback REST route."
        attribution: "Patchstack"
        source_url: "https://patchstack.com/database/wordpress/plugin/contact-form-7/vulnerability/contact-form-7-6-2-3-unauthenticated-arbitrary-file-upload"
      - quote: "allowing unauthenticated users to upload arbitrary files to the site."
        attribution: "WPScan"
        source_url: "https://wpscan.com/vulnerability/6b0a5d1f-84fb-425f-8d37-ddde5703937c/"
      - quote: "This vulnerability is moderately dangerous and expected to become exploited."
        attribution: "Patchstack"
        source_url: "https://patchstack.com/database/wordpress/plugin/contact-form-7/vulnerability/contact-form-7-6-2-3-unauthenticated-arbitrary-file-upload"
    extended_notes: |
      Exposure: plugin version in the WordPress plugins list (6.2 to 6.2.3 is affected; 6.1.x and 6.2.4 or later are not) and at least one form with a file-upload field; web-server side, directory listing enabled plus a .phar-to-PHP handler mapping (stock Debian/Ubuntu Apache per WPScan) makes the upload executable. Detection telemetry classes: web server access logs (unauthenticated POSTs to the plugin's REST feedback route carrying a file part, followed by GET requests into the uploads/wpcf7_uploads tree), file-system integrity or EDR file-creation events for files with phar, pht, phps or .htaccess names under the WordPress uploads directory, and PHP worker processes spawning shells from the web user. Benign lookalike: legitimate form submissions with attachments also create files in wpcf7_uploads; the discriminator is the extension and the follow-up direct request to that file. Hardening beyond the update: disable directory listing for the uploads tree, deny script execution (PHP handler) under wp-content/uploads, and delete leftover files in wpcf7_uploads that are not images or documents. 6.2.4 safelist may reject attachment types users rely on.

  - title: "QNAP confirms Plex2Shell compromises of NAS devices: Plex Media Server 1.43.2 and earlier, four chained CVEs listed by CISA KEV since 2026-10-20; updating to 1.43.3.10861 does not remove implants"
    sources:
      - { url: "https://www.qnap.com/en/security-news/2026/qnap-security-notice-plex-media-server-vulnerabilities-plex2shell-update-to-1-43-3-10861-or-later-immediately", publisher: "QNAP Systems (security notice)", date: "2026-11-06", role: "primary" }
      - { url: "https://forums.plex.tv/t/important-security-update-for-plex-media-server-v1-43-2-and-earlier/942319/3", publisher: "Plex (security announcement, CVE details and active exploitation)", date: "2026-10-19", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/qnap-says-hackers-breaching-nas-devices-in-plex2shell-attacks/", publisher: "BleepingComputer", date: "2026-11-06", role: "corroborating" }
    discovery_trace: "first seen at: BleepingComputer feed, URL https://www.bleepingcomputer.com/feed/ ('QNAP says hackers breaching NAS devices in Plex2Shell attacks', 2026-11-06T17:04Z; news lead, inside the 72 h developing-story window) -> primary: QNAP security notice https://www.qnap.com/en/security-news/2026/qnap-security-notice-plex-media-server-vulnerabilities-plex2shell-update-to-1-43-3-10861-or-later-immediately -> primary: Plex forum announcement https://forums.plex.tv/t/important-security-update-for-plex-media-server-v1-43-2-and-earlier/942319/3; KEV membership read from the cisa-kev bridge catalogue 2026.11.06 (dateAdded 2026-10-20 for all four CVEs)"
    summary: |
      Plex2Shell is a chain of four Plex Media Server flaws, CVE-2026-96652 (unauthenticated server-side request forgery in the player timeline endpoint), CVE-2026-96654 (access to internal agent functions over the loopback interface), CVE-2026-96655 (disclosure of the server owner's admin token) and CVE-2026-96656 (arbitrary file write to the Codecs directory through transcoder preferences) that together give an unauthenticated remote attacker code execution with the privileges of the Plex Media Server process; versions 1.43.2 and earlier are affected and 1.43.3.10861 or later is fixed. Plex says the chain is actively and widely exploited, with a public proof of concept since 2026-10-16, and CISA added all four CVEs to the KEV catalogue on 2026-10-20 (the store has no earlier coverage). On 2026-11-06 QNAP stated it has received reports from users whose NAS Plex appears compromised through Plex2Shell, that QTS and QuTS hero themselves are not affected, and that compromised servers have been used for cryptocurrency mining and proxy software per Plex; its notice says that where Plex was reachable from the internet (Remote Access, a forwarded port 32400 or automatic UPnP/router port opening) updating alone will not remove what an attacker installed, and prescribes a clean reinstall of QTS or QuTS hero, an indicator check and a reset of Plex and NAS credentials, with Plex on 1.43.3 available through the App Center. Plex's own check list names unfamiliar shared-library files in the Plex Codecs folder, unexpected outbound connections and sustained high CPU with nothing playing. The relevance to the constituency is indirect: Plex is consumer media software, but staff-managed QNAP NAS devices with Plex remote access can sit on administration networks or hold shared data.
    region_nexus: "global; QNAP NAS in small administrations and staff-run media shares"
    primary_sector_nexus: "indirect"
    sector: "public-sector"
    cves: [CVE-2026-96652, CVE-2026-96654, CVE-2026-96655, CVE-2026-96656]
    techniques: [T1190, T1496, T1090]
    affected_products: ["Plex Media Server", "QNAP QTS", "QNAP QuTS hero"]
    entity_keys: ["product:qnap-qts", "product:qnap-quts-hero"]
    new_entities:
      - { key: "tool:plex2shell", type: tool, name: "Plex2Shell", aliases: [], summary: "Name for the chain of four Plex Media Server vulnerabilities (CVE-2026-96652, -96654, -96655, -96656) giving unauthenticated remote code execution in versions 1.43.2 and earlier, exploited since a public proof of concept of 2026-10-16 (Plex, QNAP)." }
      - { key: "product:plex-media-server", type: product, name: "Plex Media Server", aliases: ["Plex"], summary: "Media-server software that also ships as a QNAP App Center application; Plex2Shell affects 1.43.2 and earlier, fixed in 1.43.3.10861 (Plex, QNAP)." }
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    borderline: true
    borderline_reason: "Developing story of 2026-11-06 (62 h old, outside the 26 h window, inside the 72 h developing window) on a KEV-listed chain the store has never covered; exploitation is confirmed by the vendor and QNAP, but Plex is consumer software and the constituency overlap is thin; drop if the main agent holds the bar at constituency-relevant estates."
    suggested_priority: "routine"
    classification_suggestion: { reliability: A, credibility: 1 }
    evidence:
      - quote: "These vulnerabilities are being actively and widely exploited. A public proof of concept was released on October 16."
        attribution: "Plex"
        source_url: "https://forums.plex.tv/t/important-security-update-for-plex-media-server-v1-43-2-and-earlier/942319/3"
      - quote: "Plex has confirmed that these vulnerabilities are being actively and widely exploited."
        attribution: "QNAP Systems"
        source_url: "https://www.qnap.com/en/security-news/2026/qnap-security-notice-plex-media-server-vulnerabilities-plex2shell-update-to-1-43-3-10861-or-later-immediately"
      - quote: "updating alone will not remove anything an attacker may have installed"
        attribution: "QNAP Systems"
        source_url: "https://www.qnap.com/en/security-news/2026/qnap-security-notice-plex-media-server-vulnerabilities-plex2shell-update-to-1-43-3-10861-or-later-immediately"
      - quote: "CISA added all four flaws to its Known Exploited Vulnerabilities catalog on October 20, 2026"
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/qnap-says-hackers-breaching-nas-devices-in-plex2shell-attacks/"
    extended_notes: |
      Exposure: version shown in Plex Web under Settings > General (1.43.3.10861 or later is fixed) or in QNAP App Center > My Apps; the exposed surface is Plex's port 32400 reachable from the internet, including through UPnP or router auto-configuration. Detection telemetry classes: file-creation events for shared libraries in the Plex Codecs directory by the Plex process, outbound connections and sustained CPU from the NAS or media-server host while idle, QNAP Plex logs (QNAP asks to preserve the Plex Logs folder before removal). Post-patch compromise check: this is the step that matters; QNAP says to treat the NAS as potentially compromised if Plex was internet-reachable on 1.43.2 or earlier, clean-reinstall the OS, then reset Plex and NAS credentials. Hardening: disable Plex Remote Access and do not forward 32400; use a VPN for remote access.

  - title: "UgCS server before 6.2: empty login on the HCI port (TCP 3334) returns an authenticated session on single-user installs, allowing drone commands and route uploads (CVE-2026-59104)"
    sources:
      - { url: "https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-118522", publisher: "ENISA EU Vulnerability Database (EUVD-2026-118522; ENISA is the CVE assigner)", date: "2026-11-06", role: "primary" }
      - { url: "https://offseq.com/en/research/ugcs-cve-2026-59104/", publisher: "OffSeq (finder; coordinated by CERT.LV)", date: "2026-11-06", role: "corroborating" }
    discovery_trace: "first seen at: enisa-euvd, URL https://euvdservices.enisa.europa.eu/api/search?fromScore=9&toScore=10&fromDate=2026-11-06&toDate=2026-11-09&size=100 (EUVD-2026-118522, published 2026-11-06T21:41Z, CVSS 4.0 9.3) -> primary: https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-118522 -> pivot: finder write-up https://offseq.com/en/research/ugcs-cve-2026-59104/ (OffSeq page metadata date reads 2026-06-30, the publication date of the write-up is not stated on the page)"
    summary: |
      ENISA, as CVE assigner, published CVE-2026-59104 on 2026-11-06 (CVSS 4.0 9.3; OffSeq also lists CVSS 3.1 9.8) for UgCS, SPH Engineering's drone ground-control software. The UgCS server's HCI (host-computer integration) login handler on TCP port 3334 treats a login request with empty user name and password as use the only user whenever the user database holds exactly one account, which is the default single-operator installation, and returns a fully authenticated session. By default the service listens on all interfaces without TLS, so any attacker with network access to port 3334 gets an authenticated session with no credential and can issue privileged commands, including commanding connected drones and uploading flight routes. Affected: UgCS for Windows, macOS and Linux before 6.2; fixed in UgCS 6.2 (OffSeq, finder; vulnerability coordinated by CERT.LV). No source reports exploitation, a CISA KEV listing or a public exploit; the sources name no vendor advisory page beyond the vendor homepage. Relevant to any police, fire-service or civil-protection drone programme that runs UgCS with the HCI interface reachable from a shared network.
    region_nexus: "global; emergency-service and civil-protection UAV operations (use by Swiss services not established from sources)"
    primary_sector_nexus: "indirect: drone-based emergency services"
    sector: "public-sector"
    cves: [CVE-2026-59104]
    techniques: [T1190]
    affected_products: ["UgCS (SPH Engineering)"]
    entity_keys: []
    new_entities:
      - { key: "product:ugcs", type: product, name: "UgCS (SPH Engineering)", aliases: ["UgCS server"], summary: "Drone ground-control and mission-planning software from SPH Engineering with a server exposing an HCI protocol on TCP port 3334; versions before 6.2 allow an empty-credential login on single-user installs (ENISA EUVD, OffSeq)." }
    verification: SINGLE-SOURCE-NATIONAL-CERT
    confidence: MEDIUM
    novelty: new
    borderline: true
    borderline_reason: "CVE published 2026-11-06 (53 h old, outside the 26 h window, inside the 72 h developing window); no exploitation, no vendor advisory page found, constituency use of UgCS is not established; the ENISA record is the CVE assigner's own text and OffSeq is the finder, so the facts are consistent but effectively one chain. Include only if the main agent weighs drone C2 for emergency services as constituency-relevant."
    suggested_priority: "routine"
    classification_suggestion: { reliability: B, credibility: 2 }
    evidence:
      - quote: "any attacker who can reach TCP port 3334 gets a fully authenticated session with no credential at all"
        attribution: "OffSeq"
        source_url: "https://offseq.com/en/research/ugcs-cve-2026-59104/"
      - quote: "SPH Engineering fixed it in UgCS 6.2."
        attribution: "OffSeq"
        source_url: "https://offseq.com/en/research/ugcs-cve-2026-59104/"
      - quote: "an unauthenticated remote attacker with network access to port 3334 can obtain an authenticated session without knowing any credential"
        attribution: "ENISA EU Vulnerability Database"
        source_url: "https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-118522"
    extended_notes: |
      Exposure: UgCS server version before 6.2 and TCP 3334 reachable from any network segment other than the operator workstation (listens on 0.0.0.0, no TLS by default). Detection telemetry classes: network flow or firewall logs for connections to TCP 3334 from hosts that are not the ground-control client, UgCS server logs for HCI logins with empty credentials and for route uploads or drone commands without a matching operator session. Hardening: update to 6.2, bind or firewall port 3334 to the operator host only, add a second user account (the empty-credential shortcut applies only while exactly one user exists, per the finder).

