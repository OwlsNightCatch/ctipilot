claims:
  - {claim_id: 0831f8521f, verdict: ok, source_url: "https://previdian.com/CVE-2026-123158", passage: "Previdian: 'sensors have observed 20 exploitation attempts, 13 unique attacker IPs, and 9 countries ... First observed Nov 06, 2026; last observed Nov 08'; 'Not in CISA KEV'; NCSC 2026-11-05, exploita"}
  - {claim_id: d1609edcc7, verdict: ok, source_url: "https://www.openssh.org/txt/release-10.6p2", passage: "This release contains a critical security workaround that affects Linux systems that use the musl libc and PAM disabled."}
  - {claim_id: b797396646, verdict: ok, source_url: "https://security-hub.ncsc.admin.ch/#/posts/13155", passage: "Successful exploitation allows remote, unauthenticated attackers to bypass SSH password authentication ... Current exploitation status: UNKNOWN"}
  - {claim_id: e0841f8538, verdict: ok, source_url: "https://www.ox.security/blog/openssh-authentication-bypass-cve-2026-123158/ (read via https://www.ox.security/feed/)", passage: "On musl libc, the crypt() ... refuses inputs longer than 256 bytes ... musl returns the string *; 2016 OpenSSH ... hashing operation using settings obtained from another account"}
  - {claim_id: 7c0ad37eb0, verdict: ok, source_url: "https://www.ox.security/blog/openssh-authentication-bypass-cve-2026-123158/ (read via https://www.ox.security/feed/)", passage: "There's an account with no password set (shown as *): key-only users, LDAP users, root on Alpine ... Accounts whose password field contains ! ... Dropbear and OpenBSD ... CVSS v3.1 8.1 High"}
  - {claim_id: 9f9039b1ab, verdict: ok, source_url: "https://www.ox.security/blog/openssh-authentication-bypass-cve-2026-123158/ (read via https://www.ox.security/feed/)", passage: "On Alpine's official AWS and Azure images, that passwordless account is the default alpine user, and it can run doas ... without a password ... effectively obtain root privileges"}
  - {claim_id: 389859f7d0, verdict: ok, source_url: "https://alpinelinux.org/posts/2026-11-05-openssh-password-authentication-bypass/", passage: "tiny-cloud images ... safe on first boot. They become exploitable as soon as any $6$ hash exists; cloud-init, which writes PasswordAuthentication no [not affected]"}
  - {claim_id: c2f6b1d81d, verdict: ok, source_url: "https://www.heise.de/en/news/OpenSSH-and-Alpine-Linux-warn-of-severe-but-niche-bug-11513360.html", passage: "The OpenSSH developers believe the problem does not originate in OpenSSH itself."}
  - {claim_id: 6149ca9519, verdict: ok, source_url: "https://security-hub.ncsc.admin.ch/#/posts/13155", passage: "The root cause appears to lie outside OpenSSH, likely at the libc level, so other software using similar authentication paths may also be affected."}
  - {claim_id: 3fae13d508, verdict: ok, source_url: "https://www.ox.security/blog/openssh-authentication-bypass-cve-2026-123158/ (read via https://www.ox.security/feed/)", passage: "Alpine pushed the fix to every branch back to 3.16, including releases that are no longer supported"}
  - {claim_id: 9343ac1307, verdict: ok, source_url: "https://www.heise.de/en/news/OpenSSH-and-Alpine-Linux-warn-of-severe-but-niche-bug-11513360.html", passage: "other distributions and many OpenSSH download servers are still offering the previous version, 10.6p1 (release day 2026-11-05)"}
  - {claim_id: dd7816a7a9, verdict: ok, source_url: "https://security-hub.ncsc.admin.ch/#/posts/13155", passage: "Alpine Linux / KISS Linux / Sabotage Linux / OpenWrt / Morpheus Linux / Other musl-based ... ; Prerequisites: PasswordAuthentication enabled"}
  - {claim_id: 111794787e, verdict: ok, source_url: "https://www.ox.security/blog/openssh-authentication-bypass-cve-2026-123158/ (read via https://www.ox.security/feed/)", passage: "There's an account with no password set (shown as *): key-only users, LDAP users, root on Alpine."}
  - {claim_id: dba341d66b, verdict: ok, source_url: "https://www.ox.security/blog/openssh-authentication-bypass-cve-2026-123158/ (read via https://www.ox.security/feed/)", passage: "The vulnerability does not affect: ... Containers that do not run an OpenSSH server."}
  - {claim_id: 3c12b86ed7, verdict: ok, source_url: "https://www.ox.security/blog/openssh-authentication-bypass-cve-2026-123158/ (read via https://www.ox.security/feed/)", passage: "Search /var/log/messages for Accepted password for on an account that has no password (alpine, root, key-only users). If you find one, treat the machine as compromised."}
  - {claim_id: 11e6b01161, verdict: ok, source_url: "https://www.ox.security/blog/openssh-authentication-bypass-cve-2026-123158/ (read via https://www.ox.security/feed/)", passage: "Update OpenSSH and restart it ... Updating the package alone doesn't replace the SSH server that's already running ... Rebuild them from a fixed base and redeploy."}
  - {claim_id: 48344d9acd, verdict: ok, source_url: "https://security-hub.ncsc.admin.ch/#/posts/13155", passage: "Temporary: Set PasswordAuthentication no in sshd_config and restart sshd immediately"}
  - {claim_id: db2e8c93f8, verdict: ok, source_url: "https://alpinelinux.org/posts/2026-11-05-openssh-password-authentication-bypass/ ; https://isc.sans.edu/diary/33498", passage: "Alpine/OX give only the Accepted-password log search plus doas/users/keys review; ISC lists all-A password and scanner IPs from Cowrie, not an sshd auth-log indicator; derived clause holds"}
  - {claim_id: ce495186ab, verdict: ok, source_url: "https://alpinelinux.org/posts/2026-11-05-openssh-password-authentication-bypass/", passage: "The attacker needs the name of an account whose password field is * (an account with no password set) ... Look for 'Accepted password for' an account that has no password; derived, consistent"}
  - {claim_id: 986ccd3850, verdict: ok, source_url: "https://alpinelinux.org/posts/2026-11-05-openssh-password-authentication-bypass/", passage: "Look in /var/log/messages for sshd lines reading Accepted password for an account that has no password; derived advice consistent with Alpine/OX/Previdian"}
  - {claim_id: aadd683c9d, verdict: ok, source_url: "https://isc.sans.edu/diary/33498", passage: "The first actual exploit attempt for sshole arrived on November 5th, with attempts that used an all \"A\" password; table 11-05 232, 11-06 713, 11-07 246, 11-08 51; ASNs COLT, Datacamp, Korea Telecom .."}
  - {claim_id: 15df11c8cc, verdict: ok, source_url: "https://isc.sans.edu/diary/33498", passage: "Our honeypots collect only the first 255 characters ... I expect quite a few of these login attempts were successful for our honeypots, and I will follow up with more details"}
  - {claim_id: fa7f5c580d, verdict: ok, source_url: "https://previdian.com/CVE-2026-123158", passage: "20 Attempts observed, 13 Unique attacker IPs, 9 Attacker countries; First observed 06 Nov 2026 - Last observed 08 Nov 2026; Updated 09 Nov 2026 (ISC from 11-05 per ISC page)"}
  - {claim_id: b9454abb9b, verdict: ok, source_url: "https://previdian.com/CVE-2026-123158", passage: "Previdian sensor observations ... do not show that the target was vulnerable or that the attempt succeeded; no fetched source reports a compromised production host (THN/ISC honeypots only)"}
  - {claim_id: 7eabbd17c2, verdict: ok, source_url: "https://isc.sans.edu/diary/33498 ; https://previdian.com/CVE-2026-123158", passage: "ISC counts peak 713 on 2026-11-06; Previdian 20 attempts, 13 unique IPs; first ISC exploit attempt 11-05; matches the section"}
  - {claim_id: 19868f64b2, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models", passage: "Abuse of access keys allowed the threat actor to modify and enable LLM API services (e.g. Bedrock, Gemini API, etc.) ... LLM Mixers ... resell unauthorized LLM access"}
  - {claim_id: 9d4b226640, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models", passage: "dominant initial access vector ... exposed or stolen cloud identity tokens; Abuse of access keys allowed ... enable LLM API services (Bedrock, Gemini API); exceeding $100,000 USD in a single day; LLM "}
  - {claim_id: 95eaae069a, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models", passage: "Mandiant responded to multiple incidents in 2026 ... hijacked enterprise access to LLMs ... fraudulent charges ... exceeding $100,000 USD in a single day"}
  - {claim_id: 694adb0135, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models", passage: "automated credential validation sweeps using minimal single-token requests (max_tokens=1) ... undetected by EDR and SIEM volume anomaly alerts; Figure 2 Ollama endpoints; UNC6993 ... pasting their raw"}
  - {claim_id: b0aed62d19, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models", passage: "enumerated cloud services, code repositories, and data stores for sensitive credentials ... secret managers ... creating unauthorized IAM and service accounts ... SSH keys ... 'burn and rotate' short-"}
  - {claim_id: 20720636cb, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models", passage: "LLM services were not enabled at the time of compromise. Abuse of access keys allowed the threat actor to modify and enable LLM API services; created additional API keys to scale"}
  - {claim_id: 9e8f28f38c, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models", passage: "follow-on cluster executed ... against the victim's LiteLLM gateway ... user ID rebind vulnerability in the /key/regenerate endpoint ... elevate standard Virtual Keys into full PROXY_ADMIN"}
  - {claim_id: f478da5cc2, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models", passage: "LLM Mixers ... proxy, aggregate, and resell unauthorized LLM access; UNC6993 used open-source tools such as new-api ... and gcli2api"}
  - {claim_id: 8b6925e46a, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models", passage: "Cloud LLM services (Bedrock, Microsoft.CognitiveServices, Gemini Enterprise Agent Platform); publicly exposed LLM endpoints; LLM services were not enabled at the time of compromise ... threat actor .."}
  - {claim_id: b2d6792a7f, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models", passage: "In Azure, model invocations occur on the data plane and require Diagnostic Logs ... Gemini Enterprise Agent Platform inference operations are contained within Data Access logs, which are disabled by d"}
  - {claim_id: c799b4326d, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models", passage: "bedrock.amazonaws.com: Converse, InvokeModel, ListFoundationModels, PutUseCaseForModelAccess; Microsoft.CognitiveServices/accounts/deployments/write; ServiceUsage.EnableService; PredictionService.Pred"}
  - {claim_id: 186e10b69f, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models", passage: "anomalous, low-volume requests (such as max_tokens=1 ...); Analyze User-Agent strings ... (e.g., claude-cli, aws-sdk-rust, and aws-sdk-go-v2)"}
  - {claim_id: 9b501fa632, verdict: ok, source_url: "https://securitylabs.datadoghq.com/articles/beyond-valid-credentials-how-exposed-aws-keys-are-tested-for-amazon-bedrock-access/", passage: "In the last 30 days, we've observed 12 organizations display similar malicious behavior. In the majority of instances, we have seen failed ListFoundationModels API calls in multiple regions"}
  - {claim_id: 4de9daeaac, verdict: ok, source_url: "https://threats.wiz.io/all-incidents/threat-actors-targeting-gcp-billing-accounts-for-llm-usage", passage: "search-ad phishing ... add external @gmail.com accounts to the victim's billing infrastructure, assign roles/billing.admin, and link foreign GCP projects to the victim's billing profile"}
  - {claim_id: 789042a199, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models", passage: "Other threat actors established persistence by creating unauthorized IAM and service accounts and injecting SSH keys into compute instances; attaching administrative policies to service roles"}
  - {claim_id: 8b67d91c92, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models", passage: "Any calls to disable logging by non-IaC (Infrastructure as Code) principals should be treated as high severity."}
  - {claim_id: 9f7dbc0aab, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models", passage: "Deny all permissions ... including access to Cloud LLM services; granular API quotas ... spending caps; Gateway Patch Management (e.g., LiteLLM); treat any unauthorized enablement as a critical securi"}
  - {claim_id: 76eb811ce1, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models", passage: "the dominant initial access vector has been exposed or stolen cloud identity tokens\u2014including IAM credentials, Service Account keys, GitHub Personal Access Tokens (PATs), and active session tokens"}
  - {claim_id: 12c7651f2e, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models", passage: "Defenders should prioritize detection of modifications to LLM accounts and services and treat any unauthorized enablement as a critical security event."}
  - {claim_id: c670f648c2, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models", passage: "model invocations ... require Diagnostic Logs to be enabled; Gemini inference ... Data Access logs, which are disabled by default; derived advice consistent"}
