claims:
  - {claim_id: f30750c539, verdict: F3, source_url: "https://isc.sans.edu/diary/33498", passage: "Counts 5/58/232/713/246/51 and first genuine attempt 11-05 match; but the only source breakdown (hosting/telecom ASNs) is the 18-row 'initial scanners' table, whose counts sum to the 232 of 2026-11-05 only"}
  - {claim_id: 0b3617beff, verdict: F3, source_url: "https://isc.sans.edu/diary/33498", passage: "Our honeypots collect only the first 255 characters of SSH passwords. ... I expect quite a few of these login attempts were successful for our honeypots"}
  - {claim_id: 42bfd469f8, verdict: ok, source_url: "https://isc.sans.edu/diary/33498", passage: "The initial passwords we saw on November 1st do not appear to be related to the exploit. Ever so often, buggy brute force scripts enter commands intended for the post-login shell in the password field."}
  - {claim_id: 4238bd4f03, verdict: ok, source_url: "https://isc.sans.edu/diary/33498", passage: "The first actual exploit attempt for sshole arrived on November 5th; honeypot-only data, no production host reported (Previdian page: first observed 06 Nov 2026)"}
  - {claim_id: 36ff252358, verdict: ok, source_url: "https://isc.sans.edu/diary/33498", passage: "2026-11-05 232, 2026-11-06 713, 2026-11-08 51; first actual exploit attempt November 5th"}
  - {claim_id: 19868f64b2, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models", passage: "Abuse of access keys allowed the threat actor to modify and enable LLM API services (e.g. Bedrock, Gemini API, etc.)"}
  - {claim_id: e8e40d0172, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models", passage: "fraudulent charges ... exceeding $100,000 USD in a single day; LLM Mixers ... proxy, aggregate, and resell unauthorized LLM access; Wiz and Datadog variants confirmed on their pages"}
  - {claim_id: dd2b49eda6, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models", passage: "Mandiant responded to multiple incidents in 2026 ... North America, South America, and Asia Pacific ... exceeding $100,000 USD in a single day"}
  - {claim_id: 2421a60a13, verdict: F14, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models", passage: "a threat actor opportunistically harvested exposed corporate LLM API keys from public GitHub repositories. ... the group conducted automated credential validation sweeps using ... max_tokens=1 (singular actor; entry says 'Other actors')"}
  - {claim_id: f478da5cc2, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models", passage: "UNC6993 used open-source tools such as new-api ... and gcli2api ... likely to aggregate stolen keys"}
  - {claim_id: 3bb0bcb85c, verdict: ok, source_url: "https://threats.wiz.io/all-incidents/threat-actors-targeting-gcp-billing-accounts-for-llm-usage", passage: "target dormant GCP projects, enable the Gemini API ... remove organization-level guardrails like iam.allowedPolicyMemberDomains ... link foreign GCP projects to the victim's billing profile"}
  - {claim_id: 007054f4ac, verdict: ok, source_url: "https://securitylabs.datadoghq.com/articles/beyond-valid-credentials-how-exposed-aws-keys-are-tested-for-amazon-bedrock-access/", passage: "AWS access key pairs are first validated by using the AWS STS GetCallerIdentity API ... Valid credentials then undergo a separate check for Bedrock access"}
  - {claim_id: 27d3e740e6, verdict: F3, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models", passage: "they focus on either identifying publicly exposed LLM endpoints or obtaining valid LLM API keys; LiteLLM gateway was attacked after 'pre-validated Virtual Keys' were acquired (no internet-reachability statement for LiteLLM)"}
  - {claim_id: b2d6792a7f, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models", passage: "Gemini Enterprise Agent Platform inference operations are contained within Data Access logs, which are disabled by default; In Azure, model invocations occur on the data plane and require Diagnostic Logs to be enabled"}
  - {claim_id: 8e9e135785, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models", passage: "bedrock.amazonaws.com ... Converse, InvokeModel ... PutUseCaseForModelAccess and CreateFoundationModelAgreement; Microsoft.CognitiveServices/accounts/deployments/write; ServiceUsage.EnableService; Predict, GenerateContent"}
  - {claim_id: 2ee0a94f9e, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models", passage: "Analyze User-Agent strings to identify automated tools and SDKs (e.g., claude-cli, aws-sdk-rust, and aws-sdk-go-v2); anomalous, low-volume requests (such as max_tokens=1"}
  - {claim_id: fd31f1a029, verdict: ok, source_url: "https://threats.wiz.io/all-incidents/threat-actors-targeting-gcp-billing-accounts-for-llm-usage", passage: "remove organization-level guardrails like iam.allowedPolicyMemberDomains; assign roles/billing.admin; link foreign GCP projects to the victim's billing profile (detection is the entry's derivation of Wiz's described behavior)"}
  - {claim_id: ac48856b95, verdict: F3, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models", passage: "Other threat actors established persistence by creating unauthorized IAM and service accounts and injecting SSH keys into compute instances (page does not say key revocation leaves these in place)"}
  - {claim_id: 3c0508152e, verdict: F3, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models", passage: "Any calls to disable logging by non-IaC (Infrastructure as Code) principals should be treated as high severity."}
  - {claim_id: 1b139d6907, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models", passage: "Deny all permissions that are not explicitly required, including access to Cloud LLM services; Implement granular API quotas ... Utilize spending caps; treat any unauthorized enablement as a critical security event"}
  - {claim_id: 444dbc13cd, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models", passage: "the dominant initial access vector has been exposed or stolen cloud identity tokens—including IAM credentials, Service Account keys, GitHub Personal Access Tokens (PATs), and active session tokens"}
  - {claim_id: c2de08393a, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models", passage: "attaching administrative policies to service roles ... injected environment-wide SSH keys into compute instance metadata"}
  - {claim_id: 89f67558f5, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models", passage: "In multiple incidents that Mandiant investigated, LLM services were not enabled at the time of compromise. Abuse of access keys allowed the threat actor to modify and enable LLM API services"}
  - {claim_id: 12c7651f2e, verdict: ok, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models", passage: "Defenders should prioritize detection of modifications to LLM accounts and services and treat any unauthorized enablement as a critical security event."}
  - {claim_id: 729d1e20d6, verdict: F4, source_url: "https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models", passage: "GTIG states default-off only for GCP Data Access logs and that Azure invocations need Diagnostic Logs; nothing on AWS defaults or that abuse 'stays invisible' (control-plane enablement events stay visible)"}
