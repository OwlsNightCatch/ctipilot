  item: "2026-11-09/llmjacking-stolen-cloud-keys-enable-model-services-resale"
  url_or_quote: "affected_products: [... \"LiteLLM\", \"Ollama\"]; entities: [\"actor:unc6993\", \"product:litellm\"]"
  summary: "GTIG describes observable behaviors the body drops while affected_products and entities carry LiteLLM and Ollama: (a) the follow-on cluster's exploitation of the victim's LiteLLM gateway ('user ID rebind vulnerability in the /key/regenerate endpoint' lifting standard Virtual Keys to PROXY_ADMIN) and the advice to patch gateways; (b) Ollama endpoints probed with /api/create (Figure 2); (c) 'burn and rotate' creation and deletion of short-lived service accounts, GPU instance provisioning across regions and quota-increase requests, a containerized agent backdoor. The body never says a LiteLLM flaw was exploited or that Ollama appears at all, so LiteLLM and Ollama operators cannot see why they are tagged. The id can stay out; the behavior and patch advice are source-supported. Add one or two sentences, plus (b) and (c) as hunt hooks if the word budget allows."
