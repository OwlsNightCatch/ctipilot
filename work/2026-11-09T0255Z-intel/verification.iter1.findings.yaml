  section: body
  item: "2026-11-09/llmjacking-stolen-cloud-keys-enable-model-services-resale (Defender takeaway)"
  url_or_quote: "Switch on the model-call logs the cloud keeps off by default, or abuse stays invisible."
  summary: "(low confidence) GTIG states default-off only for Google Cloud Data Access logs ('disabled by default due to volume and ingestion costs') and that Azure invocations 'require Diagnostic Logs to be enabled'; it says nothing on AWS defaults. 'Abuse stays invisible' is also contradicted by the entry's own Detection line (control-plane enablement events, which GTIG calls critical, remain visible without model-call logs). Fix: scope to Google Cloud Data Access and Azure Diagnostic Logs and say inference calls, not abuse, go unseen."
