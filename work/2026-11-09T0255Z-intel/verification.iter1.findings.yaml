  item: "2026-11-06/cve-2026-123158-openssh-musl-no-pam-password-bypass-sshole (Improvement section)"
  url_or_quote: "The honeypots keep only the first 255 characters of a password, so the counts show attempts, not success, although the author expects that several of the logins succeeded on its honeypots"
  summary: "(low confidence) ISC states the 255-character limit ('Our honeypots collect only the first 255 characters of SSH passwords') and 'I expect quite a few of these login attempts were successful for our honeypots'; it does not draw the conclusion that the counts 'show attempts, not success'. The 'so' is the entry's inference placed under the ISC citation. Fix: separate what ISC says (truncation limits its data; it expects honeypot logins succeeded) from the entry's caveat that honeypot data does not show compromise of a production host. The clause also leaves the 5 (11-03) and 58 (11-04) counts, which predate disclosure and ISC's 'first actual exploit attempt' of 11-05, unexplained while explaining only the 23 of 11-01."
