items:
  - title: "ChimeraZ offers for sale a claimed 96 GB / 259-million-line customer database of SGS France's vehicle-inspection networks (Securitest, Auto Securite, Verif'Autos); SGS has not confirmed"
    sources:
      - { url: "https://www.zataz.com/sgs-un-pirate-revendique-259-millions-de-lignes-volees/", publisher: "ZATAZ (Damien Bancal)", date: "2026-11-09", role: "primary" }
      - { url: "https://frenchbreaches.com/alertes/sgs-group-s-curitest-auto-s-curit-et-v-rif-autos-mw6vd1rbumwau7gc4g", publisher: "FrenchBreaches (Sebastien Forte)", date: "2026-11-08", role: "corroborating" }
    discovery_trace: "first seen at: frenchbreaches, URL https://frenchbreaches.com/feed.xml (item 'SGS Group - Securitest, Auto Securite et Verif'Autos', 2026-11-08 11:40 CET) -> extract https://frenchbreaches.com/alertes/sgs-group-s-curitest-auto-s-curit-et-v-rif-autos-mw6vd1rbumwau7gc4g -> cross-seen at zataz feed https://www.zataz.com/feed/ (2026-11-09 00:30 UTC) -> extract https://www.zataz.com/sgs-un-pirate-revendique-259-millions-de-lignes-volees/ ; no SGS statement or regulator notice found (WebSearch 'SGS Auto Securite Securitest Verif'Autos fuite de donnees Chimeraz controle technique 22 millions' returned only SGS trade press)"
    summary: |
      Facts: a forum seller using the handle ChimeraZ (registry actor:chimeraz) posted on 2026-11-07 an offer of data presented as the French
      activity of the Swiss-headquartered inspection group SGS: ZATAZ and FrenchBreaches both describe about 96 GB and 259 million lines
      (90.8 million vehicle records, 74.7 million inspection records, 29.2 million service records, 3,988 referenced centres, 40.9 million
      distinct licence plates of which about 13 million are claimed to be linked to personal data, 22,688,152 persons by the seller's own
      count). The offer names the Securitest, Auto Securite and Verif'Autos networks. FrenchBreaches says it alerted SGS several days ago and
      rates the claim 'credible, not confirmed'; no SGS statement, CNIL notice or press confirmation was found. Claims and caveats: ZATAZ
      states that the seller's presentation does not show which systems were compromised or whether all three brands are really concerned,
      and that rows are not people; the date fields in the samples (2016 to 2025) date neither an intrusion nor an extraction. The two relays
      are not independent (both read the same forum post), so there is one origin. Pattern note (not an attribution): the same handle's
      earlier Swiss-commune claims of 2026-10-31 proved to be public open-data calendar content (Inside IT, 2026-11-06), while the handle's
      French fire-and-rescue (SDIS) leaks were partly confirmed by the services; this handle's claims therefore vary widely in authenticity.
      No access vector, no exfiltration route and no technique is stated by any source. Nexus: Swiss-headquartered group but French customer
      data; no Swiss public-sector or Swiss-customer data is claimed.
    region_nexus: "Swiss-headquartered group (SGS SA, Geneva) but the claimed data is French vehicle-inspection customer data; no Swiss customer or public-sector data claimed; claim only"
