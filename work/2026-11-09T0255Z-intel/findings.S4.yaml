        source_url: "https://frenchbreaches.com/alertes/sgs-group-s-curitest-auto-s-curit-et-v-rif-autos-mw6vd1rbumwau7gc4g"
      - quote: "l'authenticité des données revendiquées, leur origine exacte et le nombre réel de personnes concernées restent à confirmer"
        attribution: "FrenchBreaches"
        source_url: "https://frenchbreaches.com/alertes/sgs-group-s-curitest-auto-s-curit-et-v-rif-autos-mw6vd1rbumwau7gc4g"
    extended_notes: |
      Recommendation: do not publish on today's sourcing (PD-6: forum claim relayed by two C-grade outlets from one post, no victim statement,
      no Admiralty A/B journalism). Add a backlog hold row instead: hold condition = an SGS statement, a CNIL or French-press confirmation of
      an intrusion, or a high-reliability outlet's authentication of the sample; suggested expiry 2026-11-23, struck if unmet. It would clear
      PD-11(c) only through the same-actor read (ChimeraZ already in the registry for French SDIS leaks and the Swiss commune claims) and
      only if confirmed. If it later ships, the transferable lesson is the seller's claimed volume versus real exposure, not the victim name.
