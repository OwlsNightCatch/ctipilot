- title: 'Vaud Grand Conseil interpellation on the school IT-support breach: the platform may sit outside the cantonal digital directorate''s security perimeter'
  sources:
  - url: https://www.vd.ch/gc/seances-du-grand-conseil/point-seance/point/69ed668a-b0f2-4247-a5b2-396c79515751/meeting/1033714
    publisher: Etat de Vaud, Grand Conseil (interpellation 26_INT_155 by Didier Lohri, session of 2026-11-03)
    date: '2026-11-03'
    role: primary
  - url: https://www.vd.ch/actualites/actualite/news/26754-la-plateforme-de-support-informatique-des-gymnases-et-des-ecoles-professionnelles-du-canton-victime-dun-vol-de-donnees
    publisher: Etat de Vaud (cantonal communique of the breach)
    date: '2026-10-31'
    role: corroborating
  discovery_trace: 'first seen at: WebSearch ("Vaud gymnases plateforme support informatique élève 16 ans cyberattaque enquête") -> pivot: vd.ch Grand Conseil agenda point surfaced by that search, URL https://www.vd.ch/gc/seances-du-grand-conseil/point-seance/point/69ed668a-b0f2-4247-a5b2-396c79515751/meeting/1033714
    (fetched with extract; interpellation text dated Bassins, 2026-11-01, tabled at the 2026-11-03 session) -> corroborating: cantonal communique of 2026-10-31, URL https://www.vd.ch/actualites/actualite/news/26754-la-plateforme-de-support-informatique-des-gymnases-et-des-ecoles-professionnelles-du-canton-victime-dun-vol-de-donnees'
  summary: 'Vaud MP Didier Lohri filed interpellation 26_INT_155, dated 2026-11-01 and tabled at the Grand Conseil session of 2026-11-03, on the breach of the IT-support platform of the canton''s post-compulsory
    schools (DGEP). The text restates the canton''s facts: unauthorised access detected on 2026-10-26, names, school e-mail addresses and support-request content of about 41,500 pupils and teachers copied,
    and a communique that came five days later, on Saturday 2026-10-31. Its own point is governance: it asks the Conseil d''Etat whether the platform was run by the DGEP autonomously behind its own firewall
    or fell within the perimeter of the cantonal digital directorate DGNSI, why the State keeps three identity sources (cantonal authentication, edu-vd for the DGEO, eduvaud for the DGEP, the last open
    on the cantonal IAM portal to teachers of six institutions only, an observation the MP dates 2026-11-01), whether DGEP and DGEO environments meet the same MFA, connection-monitoring and audit requirements
    as DGNSI''s, how much IT was bought without DGNSI validation between 2023 and 2025 and how many software or cloud services run outside the DGNSI-validated catalogue, and whether all acquisitions, infrastructure
    and directories should be put under DGNSI authority. These are the MP''s questions and observations, not findings of the canton; no Conseil d''Etat answer is published yet and no source gives the intrusion
    vector or the platform product (the existing entry already says so).'
  region_nexus: Switzerland, canton Vaud (cantonal education administration)
  primary_sector_nexus: 'direct: cantonal public administration, schools'
  sector: public-sector
  cves: []
  techniques: []
  affected_products: []
  entity_keys:
  - incident:vaud-dgep-it-support-platform-data-theft-2026-10
  new_entities: []
  verification: SINGLE-SOURCE-OTHER
  confidence: MEDIUM
  novelty: update-of:2026-11-01/vaud-school-it-support-platform-data-theft-teachers-pupils
  borderline: true
  borderline_reason: Parliamentary question text only (the MP's assertions, no government answer yet), filed 2026-11-01 and tabled 2026-11-03, so outside the 26 h window and outside the 121 h lookback of
    the Vaud record (cut-off 2026-11-04T02:00Z) by about a day; it adds a governance lesson (support, identity and procurement outside the central security perimeter) and one fact the entry lacks (communique
    five days after detection) but no new technical or exposure fact. Return only if the main agent wants the governance angle on the existing entry; otherwise drop.
  evidence:
  - quote: Le communiqué officiel n'a été publié que cinq jours plus tard, le samedi 31 octobre.
    gloss: The official communique was published only five days later, on Saturday 31 October.
    attribution: Etat de Vaud, Grand Conseil (Lohri interpellation)
    source_url: https://www.vd.ch/gc/seances-du-grand-conseil/point-seance/point/69ed668a-b0f2-4247-a5b2-396c79515751/meeting/1033714
  - quote: cette affaire pose la question de la coexistence d'environnements informatiques, d'annuaires d'identité et de budgets en marge du périmètre de la Direction générale du numérique et des systèmes
      d'information (DGNSI)
    gloss: this affair raises the question of the coexistence of IT environments, identity directories and budgets at the margin of the DGNSI perimeter.
    attribution: Etat de Vaud, Grand Conseil (Lohri interpellation)
    source_url: https://www.vd.ch/gc/seances-du-grand-conseil/point-seance/point/69ed668a-b0f2-4247-a5b2-396c79515751/meeting/1033714
  - quote: la plateforme de support visée était-elle exploitée par la DGEP de manière autonome avec pare-feu ou relevait-elle du périmètre de la DGNSI ?
    gloss: was the targeted support platform run by the DGEP autonomously with a firewall, or did it fall under the DGNSI perimeter?
    attribution: Etat de Vaud, Grand Conseil (Lohri interpellation)
    source_url: https://www.vd.ch/gc/seances-du-grand-conseil/point-seance/point/69ed668a-b0f2-4247-a5b2-396c79515751/meeting/1033714
  - quote: Le 26 octobre 2026, la Direction générale de l’enseignement postobligatoire a détecté un accès non autorisé à la plateforme
    gloss: On 26 October 2026 the DGEP detected unauthorised access to the platform.
    attribution: Etat de Vaud (cantonal communique)
    source_url: https://www.vd.ch/actualites/actualite/news/26754-la-plateforme-de-support-informatique-des-gymnases-et-des-ecoles-professionnelles-du-canton-victime-dun-vol-de-donnees
  extended_notes: 'Defender angle if the main agent keeps it: cantonal and communal bodies that let a department or school run its own support/ticketing platform and identity directory should inventory
    every such platform and identity source outside the central IT-security perimeter and check it against the same MFA, monitoring and audit baseline; the Vaud case shows a ticketing platform holding names,
    school addresses and free-text support requests becoming a phishing-targeting data set. Suggested rating: reliability A (cantonal parliament''s own publication of the filed text), credibility 3 for
    the MP''s assertions (untested), 1 for the restated breach facts (match the cantonal communique).'
- title: CERT.LV widens the refrigeration-controller warning to heating boilers, water pumps, solar controls and building systems, public sector included
  sources:
  - url: https://cert.lv/lv/2026/11/kiberuzbrukumi-attalinati-vadamam-iekartam-aktuala-informacija-un-drosibas-ieteikumi
    publisher: CERT.LV (Latvian national CERT)
    date: '2026-11-06'
    role: primary
  discovery_trace: 'first seen at: cert-lv, URL https://cert.lv/lv/feed/rss/zinas (feed, item dated Fri 06 Nov 2026 11:11 +0200; slice lookback 97 h) -> primary (no pivot needed): CERT.LV advisory, URL
    https://cert.lv/lv/2026/11/kiberuzbrukumi-attalinati-vadamam-iekartam-aktuala-informacija-un-drosibas-ieteikumi (fetched with extract; Latvian read inline)'
  summary: 'CERT.LV published on 2026-11-06 an advisory on cyberattacks against remotely managed equipment, with its media answers of 2026-11-04. Its facts: since October attackers have remotely changed
    temperature or defrost settings on shop and warehouse refrigeration controls, with incidents reported in at least eight European countries by 2 November, Estonia and Finland among them; in Latvia there
    were attack attempts, no shop chain was hit but one warehouse was, and the attack was stopped with minimal loss; CERT.LV found about 50 refrigeration controls in the Latvian private sector exposed to
    the internet and has contacted their owners. CERT.LV states that no single vulnerability is used: attackers either find control panels reachable from the internet that are unpatched or run default or
    weak passwords, or enter through the company network where the equipment is not segmented from it, and it concludes that a vendor security update alone does not remove the risk, while restricting internet
    access, changing passwords and segmenting networks does. The delta against the existing entry is scope: CERT.LV warns the same method can hit heating boilers, water pumps and solar-energy control panels,
    and its table of exposed areas lists school, hospital and social-care kitchens, district heating, water and sewage pumping stations, solar and inverter controls including those on municipal building
    roofs, and building services (ventilation, heating, cooling, server-room climate control, access control, lifts), which CERT.LV says are often 10 to 15 years old. For maintenance contractors with remote
    access it asks operators to establish who reaches the equipment and how, to write secure remote access, password change, updates and immediate incident reporting into contracts and tenders, and to have
    alarms on temperature or parameter deviations that are separate from the controllers: it says round-the-clock monitoring let Estonia respond within 10 minutes with no loss, while a 2025 Norwegian case,
    in which dam valves were opened remotely, was noticed after four hours.'
  region_nexus: 'Latvia (primary); Switzerland: the same exposure class applies to communal heating, water and solar installations and school and hospital kitchens; the Swiss refrigeration cases (Köniz
    butcher, Volg stores) are already in the existing entry'
  primary_sector_nexus: 'direct: the advisory addresses public and private bodies and names municipal-building solar controls and school, hospital and care-home kitchens'
  sector: public-sector
