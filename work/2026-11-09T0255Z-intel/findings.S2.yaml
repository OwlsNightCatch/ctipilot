  verification: SINGLE-SOURCE-NATIONAL-CERT
  confidence: MEDIUM
  novelty: update-of:2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack
  lookback: true
  borderline: true
  borderline_reason: Authoritative (Admiralty A) but the new content is a scope-widening warning and a Latvian case count; the control list repeats CERT-FR, CISA and ENISA guidance the entry already carries.
    It matters only for the sentence that the exposure class covers other remotely managed building and utility equipment (ENISA's own joint statement says 'refrigeration systems and similar devices'),
    which is useful to communes and cantons that run heating, water and solar controls. Published 2026-11-06, so first coverage comes through the 97 h lookback of the cert-lv record.
  evidence:
  - quote: CERT.LV apstiprina, ka arī Latvijā novēroti uzbrukumu mēģinājumi saldēšanas iekārtām. Veikalu ķēdes pagaidām nav skartas, bet cietusi kāda noliktava.
    gloss: CERT.LV confirms that attack attempts on refrigeration equipment have also been observed in Latvia. Shop chains have not been affected so far, but a warehouse has been.
    attribution: CERT.LV
    source_url: https://cert.lv/lv/2026/11/kiberuzbrukumi-attalinati-vadamam-iekartam-aktuala-informacija-un-drosibas-ieteikumi
  - quote: CERT.LV brīdina, ka tādā pašā veidā var uzbrukt arī apkures katliem, ūdens sūkņiem un saules enerģijas vadības paneļiem.
    gloss: CERT.LV warns that heating boilers, water pumps and solar-energy control panels can be attacked in the same way.
    attribution: CERT.LV
    source_url: https://cert.lv/lv/2026/11/kiberuzbrukumi-attalinati-vadamam-iekartam-aktuala-informacija-un-drosibas-ieteikumi
  - quote: 'Secinājums: ražotāja drošības atjauninājums vien risku nenovērš. Galvenais ir ierobežot piekļuvi internetam, nomainīt paroles un nodalīt tīklus.'
    gloss: 'Conclusion: a manufacturer''s security update alone does not remove the risk. The main thing is to restrict internet access, change passwords and segment networks.'
    attribution: CERT.LV
    source_url: https://cert.lv/lv/2026/11/kiberuzbrukumi-attalinati-vadamam-iekartam-aktuala-informacija-un-drosibas-ieteikumi
  - quote: Igaunijā diennakts uzraudzība ļāva reaģēt 10 minūšu laikā, un zaudējumu nebija. Norvēģijā bez šādas uzraudzības incidentu pamanīja tikai pēc četrām stundām.
    gloss: In Estonia round-the-clock monitoring allowed a response within 10 minutes and there was no loss. In Norway, without such monitoring, the incident was noticed only after four hours.
    attribution: CERT.LV
    source_url: https://cert.lv/lv/2026/11/kiberuzbrukumi-attalinati-vadamam-iekartam-aktuala-informacija-un-drosibas-ieteikumi
  - quote: Saules paneļu un invertoru vadība (arī uz pašvaldību ēku jumtiem)
    gloss: Control of solar panels and inverters (also on municipal building roofs).
    attribution: CERT.LV
    source_url: https://cert.lv/lv/2026/11/kiberuzbrukumi-attalinati-vadamam-iekartam-aktuala-informacija-un-drosibas-ieteikumi
  extended_notes: 'Detection/hardening hooks CERT.LV states: inventory of every remotely managed device (location, maintainer, access path); confirm that control panels and ICS protocols are not internet-reachable
    and use the local panel where remote access is not needed; VPN or another closed encrypted channel with strong, unique passwords and 2FA; segment industrial control from the office network; isolate
    end-of-life equipment behind its own router or firewall; review temperature, defrost and other critical settings and keep a known-good configuration backup; automatic alarms for parameter deviations
    at night and on weekends, separate from the controllers; practised manual operation; a continuity-plan scenario for attacks on remotely managed equipment. After an incident: disconnect or switch to
    manual control, preserve logs, do not reset before documenting, and reconfigure and protect the device after a factory reset or it can be taken over again. Suggested rating: reliability A, credibility
    2 (single national-CERT source; the Latvian counts are CERT.LV''s own, the generalisation to other equipment is a warning, not an observed Latvian or Swiss incident).'
