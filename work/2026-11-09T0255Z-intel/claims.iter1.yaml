  - claim_id: e8e40d0172
    entry: 2026-11-09/llmjacking-stolen-cloud-keys-enable-model-services-resale
    surface: "summary"
    kind: frontmatter
    text: "GTIG and Mandiant report 2026 incident-response cases in which actors used exposed or stolen cloud identities, service-account keys and GitHub tokens to enable managed model services such as Amazon Bedrock and the Gemini API in victim accounts, run up charges above USD 100,000 in a single day and resell the quota through proxy gateways. Wiz describes a Google Cloud billing-account variant and Datadog the validation of stolen AWS keys for Bedrock; GTIG lists the audit-log events to watch in AWS, Azure and Google Cloud."
