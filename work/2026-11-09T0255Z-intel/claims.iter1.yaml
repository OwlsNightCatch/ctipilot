    surface: "body"
    kind: cited
    text: "Mandiant responded to multiple 2026 incidents in which actors hijacked enterprise access to large language models (\"LLMJacking\") in North America, South America and Asia Pacific, with charges above USD 100,000 in a single day in individual incidents ("
    urls: ["https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models"]
