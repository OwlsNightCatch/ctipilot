items:
  - title: "Aflac discloses Japan-subsidiary breach exposing personal and bank data of 4.38 million policyholders/agents"
    sources:
      - { url: "https://www.securityweek.com/aflac-japan-data-breach-impacts-4-38-million/", publisher: "SecurityWeek", date: "2026-06-30", role: "primary" }
      - { url: "https://securityaffairs.com/194488/data-breach/hackers-steal-data-of-4-38-million-aflac-japan-customers.html", publisher: "SecurityAffairs", date: "2026-06-30", role: "corroborating" }
      - { url: "https://www.bleepingcomputer.com/news/security/insurance-giant-aflac-discloses-data-breach-after-subsidiary-hack/", publisher: "BleepingComputer", date: "2026-06-30", role: "corroborating" }
      - { url: "https://www.sec.gov/Archives/edgar/data/4977/000162828026046124/0001628280-26-046124-index.htm", publisher: "SEC EDGAR (Aflac 8-K, afl-20260630.htm)", date: "2026-06-30", role: "primary-regulatory-filing" }
    discovery_trace: "first seen at: bleepingcomputer, URL https://www.bleepingcomputer.com/news/security/ (listing) → pivot: BleepingComputer article, URL https://www.bleepingcomputer.com/news/security/insurance-giant-aflac-discloses-data-breach-after-subsidiary-hack/ → pivot: SecurityWeek, URL https://www.securityweek.com/aflac-japan-data-breach-impacts-4-38-million/ → corroborating: SecurityAffairs, URL https://securityaffairs.com/194488/data-breach/hackers-steal-data-of-4-38-million-aflac-japan-customers.html → primary regulatory filing: SEC EDGAR 8-K index, URL https://www.sec.gov/Archives/edgar/data/4977/000162828026046124/0001628280-26-046124-index.htm (filed 2026-06-30, form 8-K, filing afl-20260630.htm)"
    summary: |
      Aflac Incorporated disclosed (SEC 8-K filed 2026-06-30) that attackers gained unauthorized access to
      Aflac Life Insurance Japan's policyholder web portal over a roughly ten-day window, 2026-06-15 to
      2026-06-25, exfiltrating personal information belonging to approximately 4.38 million customers and
      agents — names, addresses, phone numbers, dates of birth, gender, security/authentication details, and
      insurance-account information. A subset of roughly 230,000 individuals also had premium-transfer bank
      account information exposed; no credit-card data was accessed. Aflac states the intrusion was contained
      to Japan-subsidiary systems (US operations unaffected), the affected systems were suspended on
      discovery, external cybersecurity responders were engaged, and Japan's Financial Services Agency was
      notified. No attack vector (initial access technique) has been disclosed in the sources reviewed. This
      is Aflac's second disclosed breach in roughly a year — BleepingComputer's prior coverage links the 2025
      Aflac US breach to the Scattered Spider-adjacent insurance-sector intrusion wave (Erie Insurance, MGM
      Resorts, Philadelphia Insurance) — but no attribution to a specific actor has been made for this Japan
      incident in the sources fetched.
    ch_eu_nexus: "indirect — global insurer with EU/Swiss policyholder exposure not confirmed; illustrates portal-layer exposure pattern relevant to any public-sector benefits/insurance portal"
    public_sector_nexus: "indirect"
    sector: "insurance, financial services"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
