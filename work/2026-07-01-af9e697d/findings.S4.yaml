        source_url: "https://www.sec.gov/Archives/edgar/data/4977/000162828026046124/0001628280-26-046124-index.htm"
      - quote: "Attackers accessed systems for ten days before detection, stealing personal information from millions of policyholders."
        attribution: "SecurityAffairs"
        source_url: "https://securityaffairs.com/194488/data-breach/hackers-steal-data-of-4-38-million-aflac-japan-customers.html"
    extended_notes: |
      Defender vantage: web-facing customer/policyholder portals remain a soft target for sustained,
      multi-day exfiltration before detection — the ten-day dwell time before containment is the operationally
      relevant fact for hunt teams monitoring portal session/API abuse. No IOC or CVE was disclosed by any
      source at time of writing; treat as an access-pattern anomaly-hunting cue (sustained anomalous
      authenticated-session data pulls from a customer portal) rather than a patchable vulnerability.

  - title: "Blackfield ransomware demands $2M from Nidec's Taiwanese subsidiary after June 22 server compromise"
    sources:
      - { url: "https://www.bleepingcomputer.com/news/security/blackfield-ransomware-asks-nidec-corporation-for-2-million-ransom/", publisher: "BleepingComputer", date: "2026-06-30", role: "primary" }
      - { url: "https://www.nidec.com/files/user/www-nidec-com/corporate/news/2026/0624-01/260624-01en.pdf", publisher: "Nidec Corporation (official investor-relations disclosure)", date: "2026-06-24", role: "primary-victim-statement" }
    discovery_trace: "first seen at: bleepingcomputer, URL https://www.bleepingcomputer.com/news/security/ (listing) → pivot: BleepingComputer article, URL https://www.bleepingcomputer.com/news/security/blackfield-ransomware-asks-nidec-corporation-for-2-million-ransom/ → primary: Nidec Corporation official IR disclosure PDF, URL https://www.nidec.com/files/user/www-nidec-com/corporate/news/2026/0624-01/260624-01en.pdf"
    summary: |
      Nidec Corporation's own investor-relations disclosure (dated 2026-06-24, Tokyo Stock Exchange code
      6594) confirms that its Taiwanese subsidiary Nidec Chaun Choung Technology Corporation was compromised
      by a ransomware attack on Monday 2026-06-22, with "ransomware-originated damage" confirmed on part of
      the subsidiary's server. Nidec states it took emergency measures including shutting down the affected
      server and network, reported the matter to external specialized agencies and relevant administrative
      organs, and states the subsidiary "built and operates an independent network unique to its group" such
      that the issue will not affect Nidec Corporation or other Nidec Group companies. As of the 06-24
      statement, Nidec says "no personal or confidential information has been confirmed to have leaked to the
      outside," with investigation ongoing. BleepingComputer's follow-on reporting (2026-06-30) identifies the
      threat actor as the Blackfield ransomware gang, which is demanding $2 million to delete allegedly stolen
      data, gave a 15+ day negotiation deadline before threatening to publish/sell the data, and is separately
      offering the stolen archive for immediate download at $400,000 (or a one-day leak-delay for $5,000).
      This is Nidec's second publicly disclosed ransomware incident in under two years (a prior 2024 incident
      hit its Vietnam-based Nidec Precision division, attributed at the time to 8Base/Everest activity per
      BleepingComputer's historical reporting).
    ch_eu_nexus: "indirect — global manufacturing supply chain (Nidec supplies motors/components used across automotive and electronics OEMs with EU exposure)"
    public_sector_nexus: "none"
    sector: "manufacturing, technology hardware"
    cves: []
    actors_campaigns_malware: ["Blackfield ransomware"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "On Monday, June 22, 2026, ransomware-originated damage was confirmed in part of Nidec Chaun Choung Technology's server. Thereafter, to prevent the spread of the damage, emergency measures, including shutting down the affected server and network, were taken."
        attribution: "Nidec Corporation official disclosure"
        source_url: "https://www.nidec.com/files/user/www-nidec-com/corporate/news/2026/0624-01/260624-01en.pdf"
      - quote: "While, at this moment, no personal or confidential information has been confirmed to have leaked to the outside, investigations are ongoing in collaboration with external specialized agencies."
        attribution: "Nidec Corporation official disclosure"
        source_url: "https://www.nidec.com/files/user/www-nidec-com/corporate/news/2026/0624-01/260624-01en.pdf"
    extended_notes: |
      Note the gap between the victim's own statement (06-24, no confirmed leak) and the extortion actor's
      claim (06-30, $2M demand implying data theft) — standard pattern where the ransomware group's claim of
      exfiltration outruns the victim's confirmed forensic findings. Frame per verification guidance as
      "Blackfield claims data theft; Nidec has not confirmed a leak as of its most recent statement."

  - title: "UPDATE: Nissan becomes the largest named victim yet in the ShinyHunters/UNC6240 Oracle PeopleSoft campaign — employee PII across four countries"
    sources:
      - { url: "https://www.securityweek.com/nissan-employee-data-breached-in-oracle-peoplesoft-hack/", publisher: "SecurityWeek", date: "2026-06-30", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/nissan-discloses-employee-data-breach-linked-to-oracle-zero-day-attacks/", publisher: "BleepingComputer", date: "2026-06-29", role: "corroborating" }
    discovery_trace: "first seen at: bleepingcomputer, URL https://www.bleepingcomputer.com/news/security/ (listing) → pivot: BleepingComputer article, URL https://www.bleepingcomputer.com/news/security/nissan-discloses-employee-data-breach-linked-to-oracle-zero-day-attacks/ → corroborating: SecurityWeek, URL https://www.securityweek.com/nissan-employee-data-breached-in-oracle-peoplesoft-hack/ → background primary (previously cited in this campaign, not re-fetched this run): Google Mandiant/GTIG blog on the UNC6240 PeopleSoft campaign, URL https://cloud.google.com/blog/topics/threat-intelligence/shinyhunters-targets-education-sector-oracle-exploit"
    summary: |
      > **UPDATE (originally covered 2026-06-28 as the NAIC breach in this same PeopleSoft campaign):**
      Nissan disclosed that current and former employees' data was exposed after attackers exploited
      CVE-2026-35273 (a critical Oracle PeopleSoft PeopleTools SSRF, exploited as a zero-day between
      2026-05-27 and 2026-06-09, predating Oracle's advisory) as part of the wider ShinyHunters/UNC6240
      campaign that BleepingComputer reports has hit "over 300 PeopleSoft instances across roughly 100
      organizations." Nissan says the exposure spans current and former employees in the US, Canada, Mexico
      and Brazil, potentially including Social Security numbers, banking/direct-deposit information, and tax
      records. As a mitigation, Nissan is restricting access to pay-slip viewing and direct-deposit changes to
      company-network or VPN-authenticated sessions only, and is offering credit/dark-web monitoring. This
      is a materially different victim profile from the previously covered NAIC breach (employee/HR/payroll
      data vs. NAIC's public regulatory data), underscoring the campaign's spread across both
      regulatory-body and corporate-HR PeopleSoft deployments.
    ch_eu_nexus: "none disclosed for this victim; the underlying CVE-2026-35273 PeopleSoft exploitation affects any internet-reachable PeopleSoft instance globally including EU deployments"
    public_sector_nexus: "indirect — same CVE/actor cluster previously hit a US public-sector-adjacent regulatory body (NAIC)"
    sector: "automotive, manufacturing"
    cves: ["CVE-2026-35273"]
    actors_campaigns_malware: ["ShinyHunters", "UNC6240"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "update-to-prior:2026-06-28"
    evidence:
      - quote: "over 300 PeopleSoft instances across approximately 100 organizations"
        attribution: "BleepingComputer, citing ShinyHunters' own claim"
        source_url: "https://www.bleepingcomputer.com/news/security/nissan-discloses-employee-data-breach-linked-to-oracle-zero-day-attacks/"
    extended_notes: |
      Defender takeaway: the actor's self-reported 300-instance/100-organization scale claim is unverified
      (attribute the claim, not confirmed fact). Detection/hardening focus should remain on internet-exposed
      PeopleSoft PeopleTools instances and CVE-2026-35273 patch status, which was already the operative
      guidance from the 2026-06-28 NAIC item — no new technical detail beyond victim-count expansion.

