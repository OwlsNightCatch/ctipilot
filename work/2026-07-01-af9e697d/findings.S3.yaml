items:
  - title: "watchTowr Labs: CitrixBleed-adjacent pre-auth memory overread in NetScaler's SAML SP endpoint (CVE-2026-8451)"
    sources:
      - { url: "https://labs.watchtowr.com/citrixbleed-to-infinity-and-beyond-citrix-netscaler-pre-auth-memory-overread-cve-2026-8451/", publisher: "watchTowr Labs", date: "2026-06-30", role: "primary" }
      - { url: "https://cyberscoop.com/citrix-netscaler-flaw-cve-2026-8451-citrixbleed/", publisher: "CyberScoop", date: "2026-06-30", role: "corroborating" }
    discovery_trace: "first seen at: watchtowr (bridge feed), URL https://labs.watchtowr.com/rss/ → primary: watchTowr Labs, URL https://labs.watchtowr.com/citrixbleed-to-infinity-and-beyond-citrix-netscaler-pre-auth-memory-overread-cve-2026-8451/ → corroborating: CyberScoop, URL https://cyberscoop.com/citrix-netscaler-flaw-cve-2026-8451-citrixbleed/ (surfaces official Citrix bulletin CTX696604)"
    summary: |
      watchTowr Labs disclosed CVE-2026-8451 (CVSS 8.8), a pre-authentication memory-overread
      vulnerability in Citrix NetScaler ADC/Gateway's XML attribute parser behind the /saml/login
      endpoint, exploitable when NetScaler is configured as a SAML identity provider. The parser
      fails to validate termination of newline-terminated, unquoted XML attribute values in a
      crafted SAML authentication request, causing it to read past the intended buffer boundary;
      the leaked adjacent-memory content is disclosed back to the client inside an HTTP response
      cookie. A minimal malformed payload can also trigger denial-of-service. The bug shares its
      root cause with the March-2026 CVE-2026-3055 (also an out-of-bounds SAML-parser read,
      confirmed actively exploited) and with the original CitrixBleed / CitrixBleed 2 lineage
      (CVE-2023-4966, CVE-2025-5777) — the same class of memory-safety defect in NetScaler's
      authentication code paths recurring for the fourth time. Citrix's bulletin (CTX696604,
      2026-06-29) batches CVE-2026-8451 alongside five other NetScaler CVEs (CVE-2026-8452,
      CVE-2026-8655, CVE-2026-10816, CVE-2026-10817, CVE-2026-13474), two credited to a JPMorgan
      Chase team. NetScaler has accumulated 20+ CISA KEV entries in three years, per CyberScoop.
      Affected: NetScaler ADC/Gateway 14.1 before 14.1-72.61 and 13.1 before 13.1-63.18; patches
      released 2026-06-29. No confirmed in-the-wild exploitation of CVE-2026-8451 reported yet
      as of publication, unlike its CVE-2026-3055 sibling.
    ch_eu_nexus: "global; NetScaler is widely deployed as VPN/SSO edge gateway across Swiss and EU public-sector and enterprise networks"
    public_sector_nexus: "indirect — NetScaler ADC/Gateway is a common SSO/VPN edge appliance in government and critical-infrastructure environments"
    sector: "cross-sector, edge/network infrastructure"
    cves: [CVE-2026-8451, CVE-2026-3055, CVE-2025-5777, CVE-2023-4966]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "CVE-2026-8451 is a pre-authentication memory overread vulnerability in Citrix NetScaler's SAML identity provider implementation. The vulnerable component is the XML attribute parser within the /saml/login endpoint"
        attribution: "watchTowr Labs"
        source_url: "https://labs.watchtowr.com/citrixbleed-to-infinity-and-beyond-citrix-netscaler-pre-auth-memory-overread-cve-2026-8451/"
      - quote: "This flaw shares root causes with CVE-2026-3055 (actively exploited in March 2026) involving out-of-bounds memory reads"
        attribution: "CyberScoop"
        source_url: "https://cyberscoop.com/citrix-netscaler-flaw-cve-2026-8451-citrixbleed/"
    extended_notes: |
      Detection angle: hunt for SAML AuthnRequest/Response traffic to /saml/login with malformed
      or newline-terminated unquoted XML attribute values in NetScaler WAF/access logs; monitor
      for anomalously large or malformed Set-Cookie headers in SAML SP responses. Hardening:
      apply 14.1-72.61 / 13.1-63.18; if SAML IdP functionality is not required, disable it;
      restrict management/SAML endpoint exposure to trusted networks. T1190 Exploit
      Public-Facing Application is the applicable ATT&CK technique class; the memory-disclosure
      primitive itself maps to session/token-theft follow-on risk given the CitrixBleed lineage
      (session-cookie/token hijack post-leak).

  - title: "Kaspersky GReAT: ToddyCat's Umbrij tool automates Gmail OAuth-token theft via Chromium remote-debugging abuse"
    sources:
      - { url: "https://securelist.com/toddycat-apt-umbrij-tool-and-oauth/120251/", publisher: "Kaspersky Securelist / GReAT", date: "2026-06-30", role: "primary" }
    discovery_trace: "first seen at: kaspersky-securelist (bridge feed), URL https://securelist.com/feed/ → primary (no pivot needed), URL https://securelist.com/toddycat-apt-umbrij-tool-and-oauth/120251/"
    summary: |
      Kaspersky GReAT published Part 2 of its ToddyCat APT research, detailing Umbrij, a .NET
      tool that automates theft of Gmail/Google Workspace OAuth tokens using a technique GReAT
      calls Shadow Token via Remote Debug (STRD). Umbrij copies the victim's existing Chromium
      browser profile (cached credentials, session cookies), relaunches it headless with the
      DevTools remote-debugging port enabled, and drives it via Puppeteer Sharp to silently
      replay a legitimate OAuth authorization-code flow against Google APIs — extracting the
      authorization code without any user interaction, then exchanging it server-side for
      access/refresh tokens. Umbrij loads via DLL sideloading through vulnerable legitimate
      binaries (Bitdefender ConnectAgent, Visual Studio Test tools, Google Desktop Search) and
      is packed with ConfuserEx. Prerequisites: attacker code execution on the endpoint plus an
      already-authenticated Gmail/Workspace browser session; no separate credential-phishing
      step needed once on-host. The tradecraft evades detection because it operates entirely
      inside standard browser-automation frameworks rather than touching credential stores
      directly. This extends ToddyCat's documented pattern (TomBerBil, prior DLL-proxying via
      ESET software, traffic-tunneling tools) of pivoting from mailbox access to OAuth-scoped
      cloud API access.
    ch_eu_nexus: "global espionage actor; technique is platform-generic (any OAuth-issuing SaaS with a Chromium-based client) and directly relevant to EU public-sector Google Workspace tenants"
    public_sector_nexus: "indirect — targets government/enterprise email/OAuth infrastructure broadly; ToddyCat has a history of targeting government and defense-industrial entities"
    sector: "cross-sector; government/defense historically targeted by ToddyCat"
    cves: []
    actors_campaigns_malware: ["ToddyCat", "Umbrij", "TomBerBil", "ZiChatBot"]
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "Umbrij copies victim browser profiles (containing cached credentials and session cookies), launches browsers in headless mode with debugging enabled, connects via Puppeteer Sharp to simulate legitimate OAuth flows for Google Workspace applications, and extracts authorization codes"
        attribution: "Kaspersky Securelist / GReAT"
        source_url: "https://securelist.com/toddycat-apt-umbrij-tool-and-oauth/120251/"
    extended_notes: |
      [SINGLE-SOURCE] — Kaspersky is the sole publisher of this specific tool disclosure at
      research-time; treat as single-source-other per verification policy (not a national-CERT
      carve-out). Detection: monitor for Chromium/Chrome/Edge processes launched with
      --remote-debugging-port from non-standard parent processes (esp. Bitdefender
      ConnectAgent.exe, VSTest.console.exe, GoogleDesktop.exe paths); alert on outbound
      CDP/DevTools protocol connections (typically localhost but can be exposed); Google
      Workspace admin console anomalous OAuth token issuance / new app authorizations outside
      expected client IDs. Hardening: enforce Chrome Enterprise policy
      DeveloperToolsAvailability=Disabled where remote debugging isn't required for legitimate
      testing; review OAuth app connections at myaccount.google.com/connections; treat DLL
      sideloading via signed third-party binaries (T1574.002 DLL Side-Loading) as a detection
      priority alongside T1550.001 Use of Application Access Token / T1528 Steal Application
      Access Token for the OAuth-code-theft stage.

  - title: "Unit 42: \"Phantom Squatting\" — attackers preemptively register AI-hallucinated brand domains to poison LLM-driven supply chains"
    sources:
      - { url: "https://unit42.paloaltonetworks.com/phantom-squatting-hallucinated-web-domains/", publisher: "Palo Alto Networks Unit 42", date: "2026-07-01", role: "primary" }
    discovery_trace: "first seen at: unit42 (bridge feed), URL https://unit42.paloaltonetworks.com/feed/ → primary (no pivot needed), URL https://unit42.paloaltonetworks.com/phantom-squatting-hallucinated-web-domains/"
    summary: |
      Unit 42 documented \"phantom squatting\": a supply-chain attack class where adversaries
      systematically probe production LLMs to map which fictitious brand/vendor domains the
      model hallucinates when asked for URLs, then preemptively register those specific
      nonexistent domains before defenders or the brand owner can react. When later users, or
      autonomous AI agents performing tool-use/browsing, query the same (or a similarly-trained)
      LLM for a URL, they receive an authoritative-sounding recommendation pointing at
      attacker-controlled infrastructure — sidestepping traditional phishing-link delivery
      entirely. The core evasion primitive is a "zero-reputation bypass": because the domain is
      newly registered specifically to match a predicted hallucination, it has no prior
      threat-intel history, blocklist entry, or reputation score at the moment of first
      weaponized use, defeating reputation-based URL/DNS filtering. Unit 42's own probing across
      913 brands and 685,339 prompts produced 2.1 million candidate URLs, of which 13,229 were
      confirmed malicious and ~250,000 hallucinated domains remain unregistered (a "land grab"
      window). Two real-world cases are cited: a "Montana Empire" phishing kit impersonating a
      postal service went live 23 days after Unit 42 first detected the LLM hallucinating that
      domain, and a malicious Android APK distribution site used a 51-day lead time. The lifecycle
      is framed as four phases: Discover (adversarial LLM probing) → Act (domain registration) →
      Lure (LLM-driven delivery to victims/agents) → Bypass (zero-reputation evasion of URL/DNS
      filtering).
    ch_eu_nexus: "global; directly relevant to any organisation whose users or AI agents rely on LLM-suggested URLs, including public-sector AI-copilot rollouts"
    public_sector_nexus: "indirect — risk model applies to any AI-agent or chatbot deployment that can surface unverified URLs to end users, a growing category in public-sector digital-service pilots"
    sector: "cross-sector; software supply chain, AI/agentic tooling"
    cves: []
    actors_campaigns_malware: ["Montana Empire (phishing kit)"]
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "adversaries systematically probe LLMs to map hallucination patterns, then preemptively register these nonexistent domains before defenders react"
        attribution: "Palo Alto Networks Unit 42"
        source_url: "https://unit42.paloaltonetworks.com/phantom-squatting-hallucinated-web-domains/"
      - quote: "newly registered phantom domains lack threat intelligence history, blocklist entries, or reputation scores at the moment of weaponization"
        attribution: "Palo Alto Networks Unit 42"
        source_url: "https://unit42.paloaltonetworks.com/phantom-squatting-hallucinated-web-domains/"
    extended_notes: |
      [SINGLE-SOURCE] — vendor research, no independent corroboration found in-window; treat as
      SINGLE-SOURCE-OTHER. Related but distinct from the well-known "slopsquatting" package-name
      hallucination class (npm/PyPI) — this is domain-level, not package-name-level, and targets
      both human users and autonomous AI-agent browsing/tool-use. Detection: security teams
      running or fronting LLM-based assistants/agents should log and diff every URL an LLM
      surfaces against a verified allowlist/canonical-domain registry before it reaches a user
      or an agent's browsing tool; DNS/URL-filtering vendors relying purely on reputation age
      should treat "brand-adjacent, recently-registered, high-similarity domain" as a standalone
      signal independent of reputation score. Hardening: register defensively around
      high-hallucination-rate brand variants identified via internal LLM red-teaming; disable or
      constrain autonomous agent web-browsing/tool-use to vetted domain lists where feasible.
      Maps loosely to T1583.001 Acquire Infrastructure: Domains (attacker-side) and T1204 User
      Execution / emerging AI-agent-specific trust-abuse techniques not yet ATT&CK-coded.

