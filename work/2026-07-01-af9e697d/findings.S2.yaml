        attribution: "Defused (via BleepingComputer)"
        source_url: "https://www.bleepingcomputer.com/news/security/new-oracle-e-business-suite-flaw-now-exploited-in-attacks/"
      - quote: "This vulnerability has no known previous exploitation and no public POC code exists."
        attribution: "Security Affairs"
        source_url: "https://securityaffairs.com/194463/security/attackers-actively-exploit-the-oracle-e-business-suite-flaw-cve-2026-46817.html"
      - quote: "Oracle continues to periodically receive reports of attempts to maliciously exploit vulnerabilities for which Oracle has already released security patches."
        attribution: "Oracle (via BleepingComputer)"
        source_url: "https://www.bleepingcomputer.com/news/security/new-oracle-e-business-suite-flaw-now-exploited-in-attacks/"
    extended_notes: |
      Confidence set to MEDIUM rather than HIGH because exploitation is so far confirmed only against
      honeypots (Defused), not against production victims, and neither source names a threat cluster.
      Detection/hunt: web-server / WAF access logs for POST requests to `/OA_HTML/ibytransmit` with
      XML bodies invoking non-standard internal function calls; anomalous outbound reads of OS files
      (e.g. `/etc/passwd`) via the File Transmission component; unusual user-agent strings on EBS-facing
      endpoints. Hardening: apply Oracle's May 2026 CPU (cspumay2026) immediately if not already done;
      restrict EBS/Oracle Payments web interfaces to internal networks — do not expose `/OA_HTML/` paths
      to the public internet; treat any unpatched internet-facing instance as a potential compromise and
      review for the specific ibytransmit POST pattern. MITRE ATT&CK: T1190 Exploit Public-Facing
      Application, T1005 Data from Local System (arbitrary file read via the abused Java function).

