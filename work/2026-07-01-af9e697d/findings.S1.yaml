items:
  - title: "CVE-2026-8451 — \"CitrixBleed To Infinity And Beyond\": pre-auth memory overread in NetScaler's SAML AuthnRequest XML parser"
    sources:
      - { url: "https://labs.watchtowr.com/citrixbleed-to-infinity-and-beyond-citrix-netscaler-pre-auth-memory-overread-cve-2026-8451/", publisher: "watchTowr Labs", date: "2026-06-30", role: "primary" }
      - { url: "https://cyberscoop.com/citrix-netscaler-flaw-cve-2026-8451-citrixbleed/", publisher: "CyberScoop", date: "2026-06-30", role: "corroborating" }
      - { url: "https://nvd.nist.gov/vuln/detail/CVE-2026-8451", publisher: "NVD", date: "2026-06-30", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"Citrix NetScaler CVE-2026-8451 CVE-2026-10817 security bulletin June 2026\") → pivot: watchTowr Labs primary write-up, URL https://labs.watchtowr.com/citrixbleed-to-infinity-and-beyond-citrix-netscaler-pre-auth-memory-overread-cve-2026-8451/ → corroborating: CyberScoop, URL https://cyberscoop.com/citrix-netscaler-flaw-cve-2026-8451-citrixbleed/ → verified: NVD, URL https://nvd.nist.gov/vuln/detail/CVE-2026-8451"
    summary: |
      Citrix disclosed CVE-2026-8451 (CVSS 8.8) on 2026-06-30 as part of a six-CVE NetScaler ADC/Gateway
      bulletin. watchTowr Labs (researcher Aliz Hammond), who reported the bug in March 2026, published the
      technical root-cause the same day. The flaw lives in NetScaler's hand-rolled XML attribute-value parser
      used to process base64-encoded SAML AuthnRequest documents submitted to the /saml/login endpoint on
      appliances configured as a SAML Identity Provider. The parser's terminator logic treats quoted attribute
      values and unquoted attribute values differently: quoted values stop at the matching quote, but unquoted
      values are only terminated by NUL, '>' or the matching quote — whitespace/newline is NOT treated as a
      terminator for unquoted values. By submitting an AssertionConsumerServiceURL or ID attribute with no
      closing quote and a trailing newline, and by leaving the outer <samlp:AuthnRequest> start tag itself
      unterminated (no closing '>'), an attacker can make the parser walk past the intended attribute boundary,
      past the end of the well-formed XML, and keep consuming bytes until it hits a stray '>' character
      elsewhere in the request buffer — as demonstrated, even bytes belonging to unrelated elements placed
      outside the nominal AuthnRequest scope. The over-read bytes are embedded verbatim into the NSC_TASS
      cookie returned in the 302 response, giving an unauthenticated remote attacker a primitive to leak
      adjacent process/heap memory content one authentication attempt at a time — the same "CitrixBleed" leak
      pattern as CVE-2025-5777 and the March-2026 CVE-2026-3055 (both from the same appliance family and the
      same root parser). No public PoC or confirmed in-the-wild exploitation had been reported at publication
      time; Citrix credits Michael Tucker (JPMorgan Chase XOR team), Aliz Hammond (watchTowr) and Maxim Suhanov
      with discovery/reporting. The bulletin (Citrix KB CTX696604) bundles five additional CVEs
      (CVE-2026-8452, CVE-2026-8655, CVE-2026-10816, CVE-2026-10817, CVE-2026-13474) spanning DoS-via-memory-
      management issues in Gateway/DNS-proxy/AAA-vserver configurations and an unauthenticated arbitrary-file-read
      in the Management Interface.
    ch_eu_nexus: "global; NetScaler ADC/Gateway is widely deployed as VPN/remote-access edge infrastructure across Swiss and EU public-sector and enterprise networks — same product family implicated in prior CitrixBleed incidents"
    public_sector_nexus: "indirect — NetScaler Gateway is a common remote-access/VPN front door for government and critical-infrastructure networks"
    sector: "cross-sector; any organisation running NetScaler ADC/Gateway configured as SAML IdP"
