    extended_notes: |
      Affected/patched versions per watchTowr's reproduction of the Citrix advisory text: NetScaler ADC and
      NetScaler Gateway 14.1 before 14.1-72.61; 13.1 before 13.1-63.18; ADC FIPS before 14.1-72.61 FIPS; ADC
      FIPS and NDcPP before 13.1-37.272. Detection/hunt angle for defenders: this is the fourth
      "CitrixBleed"-class memory-overread bug in this same appliance family within roughly a year
      (CVE-2025-5777 → CVE-2025-12101 → CVE-2026-3055 → CVE-2026-8451) — all four share the pattern of
      malformed/oversized attribute or field values in an authentication-adjacent parser leaking adjacent
      memory into a response artefact (cookie or page content) returned to an unauthenticated client. Hunt
      for anomalous /saml/login POST bodies with malformed or missing XML attribute quoting/termination, and
      for oversized or malformed NSC_TASS cookie values in ingress logs/WAF captures on NetScaler appliances
      configured as SAML IdP. MITRE ATT&CK: T1190 (Exploit Public-Facing Application) for the initial
      unauthenticated access vector; the leaked memory could yield session tokens or credentials enabling
      T1078 (Valid Accounts) follow-on. Hardening: disable SAML IdP configuration where not required; if SAML
      IdP is required, patch to 14.1-72.61 / 13.1-63.18 (or FIPS equivalents) immediately; rotate any
      credentials/certificates that may have transited memory near the SAML processing path (matching prior
      CitrixBleed remediation guidance of session termination + credential rotation post-patch, per Citrix's
      historical CVE-2025-5777 bulletin pattern of `kill icaconnection -all` / `kill pcoipConnection -all`
      post-patch session invalidation — not independently confirmed for this specific bulletin, since the
      Citrix KB CTX696604 page is an Angular SPA that returned no server-rendered content to the bridge
      fetcher in this run).
