    discovery_trace: "first seen at: databreaches-net, URL https://databreaches.net/feed/ (fetched via feed subcommand) -> item 'Personal Info Possibly Compromised at Japan's Digital Agency', URL https://databreaches.net/2026/09/11/personal-info-possibly-compromised-at-japans-digital-agency/ -> pivot: Nippon.com/Jiji Press, URL https://www.nippon.com/en/news/yjj2026091100453/ -> pivot: WebSearch (\"デジタル庁 不正アクセス 個人情報 流出\") -> pivot: Piyolog aggregation post, URL https://piyolog.hatenadiary.jp/entry/2026/09/11/220855 (links the official notice) -> primary: Digital Agency official incident notice, URL https://www.digital.go.jp/news/2026-0911-01 -> further corroboration: Rocket Boys Security Measures Lab, URL https://rocket-boys.co.jp/security-measures-lab/digital-agency-privacy-data-incident/, and Innovatopia analysis, URL https://innovatopia.jp/cyber-security/cyber-security-news/117770/"
    summary: |
      Japan's Digital Agency disclosed on 2026-09-11 that Government Solution Service (GSS) -
      the shared PC/network/authentication environment it provisions to government ministries,
      independent administrative agencies and their contractors (roughly 154,000-280,000 planned
      users across 18-23 organisations) - suffered an intrusion that may have exposed personal
      data on approximately 246,000 individuals: 236,000 names, 231,000 email addresses, 94,000
      phone numbers and 1,000 addresses (duplicates across fields). The agency states no
      National ID (My Number), bank-account or pension data was involved, and no general
      citizens' data - only GSS-using-agency staff, associated public servants, and contracted
      businesses/individuals. Root cause: a third party exploited a vulnerability in an
      externally-facing VPN appliance used for maintenance access, gaining a foothold from
      around late May 2026. The intrusion was detected only on 2026-06-25, not from the VPN
      compromise itself but from anomalous mass file-access activity originating from a
      maintenance/operations account; the agency confirmed on 2026-07-09 that the VPN flaw was
      the entry vector, disabled the account and cut the compromised device's external
      connectivity that same day, then patched the VPN. Two months of investigation with an
      external forensics firm preceded the public announcement. Minister Motohisa Matsumoto
      stated at the 2026-09-11 press conference that the exploited vulnerability was already
      known to the agency before the intrusion, rated only "Medium" severity under CVSS, and
      was being remediated on a severity-based schedule when it was exploited before the fix was
      applied - the agency states it will move from severity-score-based to genuine-risk-based
      vulnerability prioritisation as a result. Piyolog (a well-regarded Japanese
      incident-tracking blog) assesses, without confirmation from any official source, that the
      circumstantial details (CVSS v4 4.7/Medium, exploitation beginning mid-May, an
      externally-reachable VPN authentication-bypass mechanism) are consistent with Palo Alto
      Networks' CVE-2026-0257 GlobalProtect authentication-bypass flaw, added to CISA's KEV
      catalog on 2026-05-29 - the agency itself has named neither the VPN vendor/product nor any
      CVE. No secondary misuse of the exposed data has been confirmed as of the disclosure date.
