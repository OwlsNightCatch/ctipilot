    evidence:
      - quote: "The agency said it detected suspicious access from the account of a system maintenance administrator on June 25. It then began investigating the incident and found on July 9 that an external third party had repeated unauthorized access since around late May."
        attribution: "Jiji Press (via Nippon.com)"
        source_url: "https://www.nippon.com/en/news/yjj2026091100453/"
      - quote: "\"We take it seriously that the incident occurred despite our operations under multi-layered security measures and a 24-hour-a-day, 365-day-a-year surveillance system,\" Chief Cabinet Secretary Minoru Kihara said at a press conference"
        attribution: "Chief Cabinet Secretary Minoru Kihara, quoted by Jiji Press"
        source_url: "https://www.nippon.com/en/news/yjj2026091100453/"
      - quote: "悪用された脆弱性の共通脆弱性評価システム(CVSS)における評価は重要度「中(Medium)」程度で、修正プログラムやパッチの適用前に悪用された (English gloss: the exploited vulnerability's CVSS severity rating was around 'Medium', and it was exploited before a fix/patch was applied)"
        attribution: "Digital Agency Q&A, relayed by Piyolog"
        source_url: "https://piyolog.hatenadiary.jp/entry/2026/09/11/220855"
    extended_notes: |
      Defender-relevant framing distinct from a routine breach notice: the detection trigger was
      NOT the VPN compromise itself but downstream anomalous behaviour - large-volume file access
      by a privileged maintenance/operations account, which is exactly the telemetry class (service-
      /maintenance-account file-access-volume baselining) worth hunting on regardless of whether
      the initial VPN exploit is caught. Innovatopia's analysis (2026-09-12) adds a second
      transferable lesson: the agency states it was already remediating the flaw ahead of its
      CVSS-based schedule and still lost the race to the exploit, prompting a stated shift toward
      risk-based (asset criticality + exposure + KEV/EPSS-informed) patch prioritisation over bare
      CVSS severity - directly parallel to the logic behind CISA's BOD 26-04 (issued 2026-06-10)
      and Japan's own National Cyber Coordination Office guideline revision (2026-06-12, days
      before this intrusion was detected). No workaround/mitigation specifics are published since
      the VPN vendor/product/CVE remains undisclosed by the agency.
