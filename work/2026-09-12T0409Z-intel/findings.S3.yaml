      ("Anthropic Claude Chinese AI company secretly relaying requests exposed") → pivot: WebSearch
      ("Anthropic blog Moonshot DeepSeek routing Claude fraudulent accounts") → primary: Anthropic's
      own report, URL https://www.anthropic.com/news/detecting-and-preventing-distillation-attacks
      (fetched directly via extract, trafilatura-direct) → corroborating: CNBC, URL
      https://www.cnbc.com/2026/09/11/chinese-ai-labs-moonshot-deepseek-alibaba-anthropic.html
      (press pickup of the same Anthropic report; not independent technical verification).
    summary: |
      Anthropic published a threat-intelligence report (2026-09-10/11) identifying what it calls
      industrial-scale "distillation attacks" by three AI labs — DeepSeek, Moonshot AI (maker of
      the Kimi models) and MiniMax — generating over 16 million exchanges with Claude through
      roughly 24,000 fraudulent accounts, in violation of Anthropic's terms of service and its
      regional access restrictions (Anthropic does not sell Claude access in China). The technique
      class, not the AI-competition framing, is the transferable lesson for defenders operating any
      account-gated API or portal: labs accessed Claude through commercial proxy resellers running
      what Anthropic calls "hydra cluster" architectures — sprawling fraudulent-account networks
      distributing traffic across Anthropic's own API and third-party cloud platforms so that no
      single account ban stops the operation; one such proxy network alone managed more than 20,000
      simultaneous fraudulent accounts, deliberately mixing illicit distillation traffic with
      unrelated legitimate customer requests specifically to defeat per-account and per-pattern
      detection. Anthropic attributed each campaign to a specific lab with high confidence via IP
      correlation, request metadata (in one case tracing accounts to specific named researchers at
      the lab through metadata matching public staff profiles), infrastructure indicators, and
      corroboration from unnamed industry partners observing the same actors elsewhere. Detection
      signals Anthropic describes building: behavioral fingerprinting/classifiers for coordinated
      activity across large numbers of accounts, chain-of-thought-elicitation detection (prompts
      that ask a model to reconstruct its own reasoning step-by-step, used to manufacture reasoning
      training data at scale), and volume/pattern anomaly detection (massive repetitive-prompt
      volume concentrated on a narrow capability area is the discriminator from normal usage, not
      any single prompt's content). MiniMax's campaign (13M+ exchanges) was caught while still
      active — pivoting roughly half its traffic within 24 hours of Anthropic releasing a new model,
      which Anthropic used for lifecycle visibility into a live distillation operation.
      Framing note: Anthropic is a competitively interested party in an active US-China AI/export-
      control policy dispute, and the report's framing (national-security risk, export-control
      rationale) reflects that; the underlying technical claims (account counts, hydra-cluster
      mechanics, detection methodology) are Anthropic's own telemetry-based assertions, not
      independently verified by a third party, and DeepSeek/Moonshot/MiniMax have not been reported
      to have responded. Included here for the transferable fraudulent-account-network detection
      technique class, not as a validated attribution.
