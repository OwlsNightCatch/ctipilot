    summary: |
      Hunt.io published a technical analysis (relayed at length by Security Affairs, 2026-09-11)
      linking the 17 July 2026 cyberattack on the Borough Council of King's Lynn and West Norfolk
      (UK local government) — with moderate confidence — to a wider mass-exploitation campaign
      against SonicWall SMA1000 appliances abusing CVE-2026-15409, the pre-auth SSRF this store
      already tracks (entry 2026-07-14, updated 2026-07-18 and 2026-08-04 for UTA0533's targeted
      pre-disclosure intrusion and INC ransomware's weaponization). This is a materially distinct,
      wider and more opportunistic wave: Hunt.io's AttackCapture system crawled an operator's open
      directory (left unauthenticated on port 80) on 17 July, the same day the council disclosed,
      recovering the complete toolchain. The chain: an unauthenticated crafted request to /wsproxy
      tunnels the WebSocket proxy into the appliance's own local port 1050, where a CouchDB-related
      Erlang service listens; a hardcoded Erlang-distribution cookie embedded in the appliance
      firmware completes authentication to the Erlang node, from which arbitrary OS commands run
      as the couchdb account. From there, a script reads
      /usr/local/extranet/etc/policy_file.xml and decrypts stored LDAP bind passwords using a
      fixed 32-byte AES key hardcoded in the firmware's ASAPPasswordUtil class — meaning the same
      key decrypts every vulnerable device's stored credentials. The operator then downloaded a
      standalone Linux build of Impacket's secretsdump directly onto the compromised SonicWall
      appliance itself and ran it against internal Windows systems, extracting SAM/LSA secrets and,
      where LDAP privileges were insufficient, using machine-account NTLM hashes recovered from LSA
      secrets to perform pass-the-hash DCSync replication. Campaign scope recovered from the open
      directory: 250 target appliances, 168 with LDAP configs exposed (534 AD accounts across 160
      domains, 255 internal LDAP servers), 9 environments losing SAM/LSA secrets, and 5 losing their
      entire AD database via full DCSync against 7 domain controllers — with confirmed credential
      theft in France, India, Italy and the US and a broader target list spanning the UK, Canada,
      Germany, Sweden, Poland, Hungary, South Korea and Hong Kong. Targeted sectors included local
      government and law enforcement, healthcare, financial services, universities, manufacturing
      and managed IT providers — opportunistic (driven by exposed vulnerable firmware, not sector
      choice), consistent with a Shodan-derived target list of nearly 200,000 SonicWall-labelled
      addresses recovered from the directory. Scripts carried extensive Chinese-language comments,
      which Hunt.io states is insufficient on its own for attribution; no link to UTA0533 (the actor
      this store's existing entry already tracks for the pre-disclosure zero-day intrusion) or to
      INC Ransom (already tracked as a post-disclosure weaponizer of the same CVE) is asserted in
      this reporting — treat this as a separate, broader post-PoC mass-scanning wave rather than the
      same operator.
      The defender-relevant delta beyond what the existing entry already carries: running
      Impacket's secretsdump *from the appliance itself* against internal Windows hosts is a
      technique this entry's prior kill-chain description (tcpdump-based LDAP wire-sniffing) did
      not cover, and it is specifically chosen because organizations typically have far less
      process/file/network visibility into a VPN/firewall appliance's own operating system than
      into EDR-monitored Windows and Linux hosts — the malicious secretsdump traffic looks, from the
      internal network's perspective, like the appliance doing exactly what it is supposed to do
      (connecting inbound-authenticated users to internal resources).
