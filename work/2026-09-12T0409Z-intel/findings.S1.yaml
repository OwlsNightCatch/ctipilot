  - title: "CVE-2026-84869 — ConnectWise ScreenConnect: file-transfer authorization flaw let a live remote-support session push and execute files on the Host with no confirmation — Huntress traced worm-like exploitation back to August 20, over two weeks before any CVE or patch existed"
    sources:
      - { url: "https://github.com/ConnectWise-Advisories/Disclosures/tree/main/CVE-2026-84869", publisher: "ConnectWise (vendor advisory, GitHub Advisories repo)", date: "2026-09-08", role: "primary" }
      - { url: "https://www.huntress.com/blog/rogue-screenconnect-installations", publisher: "Huntress", date: "2026-09-03 (updated 2026-09-08)", role: "primary" }
      - { url: "https://www.securityweek.com/modified-screenconnect-clients-used-in-worm-like-campaign/", publisher: "SecurityWeek", date: "2026-09-07", role: "corroborating" }
    discovery_trace: "first seen at: MANDATORY KEV disposition duty (spawn message) naming CVE-2026-84869, dateAdded 2026-09-11 → cisa-kev bridge, URL https://www.cisa.gov/known-exploited-vulnerabilities-catalog → pivot: WebSearch (\"CVE-2026-84869 ConnectWise ScreenConnect security bulletin\") → pivot: Huntress, URL https://www.huntress.com/blog/rogue-screenconnect-installations (original incident research, published 2026-09-03 before the CVE existed) → pivot: SecurityWeek, URL https://www.securityweek.com/modified-screenconnect-clients-used-in-worm-like-campaign/ → primary: ConnectWise vendor disclosure, URL https://github.com/ConnectWise-Advisories/Disclosures/tree/main/CVE-2026-84869 → corroboration: ENISA EUVD (EUVD-2026-74053, exploitedSince 2026-09-11) via `enisa-euvd recent exploited` bridge call"
    summary: |
      CVE-2026-84869 (CVSS 3.1 9.9, CWE-862 Missing Authorization + CWE-269 Improper Privilege Management) is a client-side file-transfer flaw in ConnectWise ScreenConnect's Support and Access session handling: file-transfer actions inside an already-active remote session could be processed without the authorization or Host-confirmation step the product is meant to require, letting files be transferred to and executed on the Host system, including through elevated execution paths. ScreenConnect servers are not affected; only clients prior to 26.6.5. ConnectWise disclosed on 2026-09-03 (advisory, no CVE yet), recommended stripping the "TransferFiles" role permission from open sessions as an interim mitigation, then shipped the fix in ScreenConnect 26.6.5 on 2026-09-08.
      Huntress had already been tracking the underlying exploitation for two and a half weeks before any advisory existed. Starting 20 August 2026, Huntress's SOC found rogue ScreenConnect clients deployed via social engineering (a fake tech-support Quick Assist session in one case, phishing-driven MSI execution in another) that immediately spawned four chained VBScript stagers via wscript.exe. The stagers profile the host (existing ScreenConnect install, EDR/AV product inventory by service name — Huntress itself, Cisco AMP, CrowdStrike, SentinelOne, Sophos, Malwarebytes — and available RAM to rule out sandboxes), then pull an AES-encrypted payload bundle from Dropbox keyed to that profile. Depending on the profile, the final PowerShell stage installs a hidden ScreenConnect backdoor client, builds a UAC-bypass helper via a hijacked ms-settings: protocol handler routed through ComputerDefaults.exe, sets AmsiUtils.amsiInitFailed=true to blind AMSI, adds all of C:\Users as a Defender exclusion, and — in the broadest variant — drops a wstunnel tunneling tool renamed Themes.exe, an XMRig cryptominer renamed SearchIndex.exe, and the vulnerable WinRing0 driver as a BYOVD component. The installed backdoor client then monitors ScreenConnect's own EndPointStatusMessage.Connections collection for newly established Host sessions and pushes the same four VBScript stagers to each one as a file-transfer message flagged to auto-run — turning every infected ScreenConnect connection into a worm-propagation vector for the next one, which is exactly the abuse path CVE-2026-84869 patches. CISA added the CVE to its KEV catalog on 2026-09-11 with an unusually short three-day remediation deadline (2026-09-14). No named threat-actor cluster is attributed by any source; Huntress frames it as a continuation of RMM-tool abuse already established as a top attack vector, layered with a novel worm mechanism.
      Relevance for defenders whose environment includes MSP-managed or self-hosted ScreenConnect (a widely deployed RMM tool, including by IT service providers to public-sector customers): the worm mechanism means a single compromised technician session can silently reach every other host that technician's ScreenConnect client is actively connected to, independent of the original social-engineering vector.
    region_nexus: "global; RMM tooling widely used by MSPs serving public-sector customers, including in Switzerland"
    primary_sector_nexus: "indirect — via IT-service-provider/MSP supply chain"
