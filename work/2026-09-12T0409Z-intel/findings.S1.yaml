  - title: "CVE-2026-42016 / CVE-2026-42018 — JFrog Artifactory: two previously-patched, separately-disclosed token-validation flaws (July/August) are now confirmed chained in the wild to mint admin-scoped tokens from an anonymous identity — a distinct exploitation chain from the already-tracked default-config bypass (CVE-2026-82329), but the same vendor, same research report, and same attacker objective"
    sources:
      - { url: "https://docs.jfrog.com/releases/docs/jfrog-security-advisories", publisher: "JFrog (vendor security advisories page)", date: "2026-09-03 (page last updated; per-CVE rows list 2026-07-27 / 2026-08-12/13 publish dates)", role: "primary" }
      - { url: "https://www.wiz.io/blog/artifactory-under-attack-in-the-wild-exploitation-of-cve-2026-42016-cve-2026-4201", publisher: "Wiz Research", date: "2026-09-10 (corrected 2026-09-11)", role: "primary" }
      - { url: "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-2808", publisher: "BSI / CERT-Bund (WID-SEC-2026-2808)", date: "2026-09-11", role: "corroborating" }
    discovery_trace: "first seen at: MANDATORY KEV disposition duty (spawn message) naming CVE-2026-42016 and CVE-2026-42018, dateAdded 2026-09-11 → cisa-kev bridge, URL https://www.cisa.gov/known-exploited-vulnerabilities-catalog → primary: JFrog Security Advisories page, URL https://docs.jfrog.com/releases/docs/jfrog-security-advisories (fetched via extract; per-CVE affected-version rows for both CVEs) → pivot: WebSearch (\"CVE-2026-42016 CVE-2026-42018 JFrog Artifactory exploited KEV\") → primary: Wiz Research blog, URL https://www.wiz.io/blog/artifactory-under-attack-in-the-wild-exploitation-of-cve-2026-42016-cve-2026-4201 → corroboration: BSI WID-SEC-2026-2808, URL https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-2808 (fetched via `bsi-csaf` bridge) and ENISA EUVD entries EUVD-2026-49566/EUVD-2026-57388 (exploitedSince 2026-09-11), via `enisa-euvd recent exploited` bridge call"
    summary: |
      CVE-2026-42016 (CVSS 3.1 8.1, CWE-863 Incorrect Authorization) is a token scope-validation flaw: JFrog Artifactory (Self-Hosted) validates a token's signature and issuer but not its intended scope, so a low-privileged token can be exchanged for one carrying elevated authority. Affected: Artifactory before 7.133.11; disclosed by JFrog on 2026-07-27. CVE-2026-42018 (CVSS 3.1 7.5, CWE-287 Improper Authentication) causes Artifactory to return an internal anonymous-user token to an unauthenticated caller even when anonymous access is disabled. Affected: before 7.111.20, and per-branch ranges up to 7.146.0→7.146.8; disclosed by JFrog on 2026-08-12/13. Both are distinct disclosures — different CVE ids, different root causes, different affected-version ranges, and different original publish dates — from the already-tracked CVE-2026-82329 (a default-configuration authentication bypass via a "phantom join key," disclosed 2026-08-28, patched in 7.111.21/7.117.28/7.125.20/7.133.29/7.146.38/7.161.20, covered in this store's 2026-09-01 entry).
      Wiz Research's 2026-09-10 report (corrected 2026-09-11) documents in-the-wild exploitation of all three CVEs, and states plainly it found no prior public reporting of exploitation for the CVE-2026-42018/CVE-2026-42016 pair specifically. Between 15 August and 8 September 2026, Wiz observed multiple actors chain the two: an unauthenticated POST to /access/api/v1/aws/token/ (with a trailing slash) returns HTTP 200 with a JWT scoped to Artifactory's internal anonymous identity (CVE-2026-42018); that token is then exchanged via POST /access/api/v1/tokens for an admin-scoped token (CVE-2026-42016) — turning an unauthenticated request into full administrative access in two API calls, in some cases in under five minutes from first contact to a created admin account. Neither flaw alone grants administrative control; the chain does. Wiz's telemetry shows patching has lagged materially behind CVE-2026-82329's faster remediation: six weeks after CVE-2026-42016's July 27 disclosure, 59% of organizations running Artifactory remained vulnerable to it, and CVE-2026-42018 fell only from 69% to 62% vulnerable over four weeks — versus CVE-2026-82329 dropping from 67% to 49% within two weeks, which Wiz attributes to its higher (critical) severity label driving faster attention.
      Post-exploitation observed across the chained-token cases (CVE-2026-42018+CVE-2026-42016) includes creation of persistent administrator accounts (PUT /api/security/users/<username> or /access/api/ui/users/<username>), deployment of malicious Groovy plugins through Artifactory's native plugin framework for arbitrary code execution, ad-hoc command execution via the plugin execute endpoint, and delivery of a custom Rust-based backdoor with C2 capabilities dropped to a world-writable path. Separately, exploitation specific to CVE-2026-82329 (POST /access/api/v1/registry/join returning an admin-scoped token directly) includes configuration exfiltration, long-lived credential minting, cluster join-key theft from /access/api/v1/system/security/join_key, and attackers attaching their own SSH keys to created accounts.
