    extended_notes: |
      Disposition (per KEV duty instructions): this is a NEW, standalone entry — no existing ScreenConnect/ConnectWise entry in the store. CVSS 9.9 but note the prerequisite: PR:L in the CVE record's own vector (CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H) — exploitation requires an attacker who already has an active remote-support/access session (achieved here via social engineering: fake tech-support Quick Assist calls, phishing-driven MSI downloads), not a raw unauthenticated internet-facing path. Given (a) CVSS 9.9, (b) confirmed worm-like ITW exploitation running for 2.5+ weeks before any patch or CVE existed, (c) EDR-killing/cryptomining/BYOVD payloads observed, and (d) CISA's unusually short 3-day KEV remediation window, I assess this clears the "high" bar at minimum; the main agent may find the pre-patch exploitation + worm mechanism warrants "critical" (comparable to the store's PaperCut/StyleSmuggler precedent of exploitation preceding patch availability). IOC-bearing details (C2 IPs/domains, file hashes) from Huntress's report are deliberately omitted per the no-IOCs rule; only behavioral/detection-relevant facts are carried above.

  - title: "CVE-2026-85706 — GitLab CE/EE: unauthenticated path traversal in the repository commits API reads arbitrary server files (CVSS 10.0); watchTowr's honeypots caught exploitation attempts one day after the patch"
    sources:
      - { url: "https://docs.gitlab.com/releases/patches/patch-release-gitlab-19-3-2-released/", publisher: "GitLab (vendor security release notes)", date: "2026-09-10", role: "primary" }
      - { url: "https://watchtowr.com/resources/rapid-reaction-gitlab-critical-path-traversal-vulnerability-cve-2026-85706/", publisher: "watchTowr", date: "2026-09-11", role: "primary" }
      - { url: "https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-1160/", publisher: "CERT-FR (ANSSI)", date: "2026-09-11", role: "corroborating" }
    discovery_trace: "first seen at: MANDATORY KEV disposition duty (spawn message) naming CVE-2026-85706, dateAdded 2026-09-11 → cisa-kev bridge, URL https://www.cisa.gov/known-exploited-vulnerabilities-catalog → primary: GitLab vendor release notes, URL https://docs.gitlab.com/releases/patches/patch-release-gitlab-19-3-2-released/ (fetched via extract) → pivot: WebSearch (\"CVE-2026-85706 GitLab path traversal exploited KEV\") → primary: watchTowr Rapid Reaction, URL https://watchtowr.com/resources/rapid-reaction-gitlab-critical-path-traversal-vulnerability-cve-2026-85706/ → corroboration: CERT-FR advisory CERTFR-2026-AVI-1160, URL https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-1160/ (fetched via `cert-fr avis-recent` bridge) and NCSC Switzerland Security Hub post id 12935, URL https://security-hub.ncsc.admin.ch/#/posts/12935 (fetched via `ncsc-csh recent` bridge)"
    summary: |
      GitLab released Community Edition and Enterprise Edition versions 19.3.2, 19.2.6 and 19.1.8 on 2026-09-10, fixing CVE-2026-85706 (CVSS 3.1 10.0): a path-traversal vulnerability in the repository commits API caused by improper path confinement combined with missing authentication enforcement, letting an unauthenticated user read arbitrary files from the GitLab server. Affected: all CE/EE versions from 18.7 before 19.1.8, 19.2 before 19.2.6, and 19.3 before 19.3.2. GitLab.com is already patched; GitLab Dedicated customers need no action; self-managed installations must upgrade. The flaw was reported through GitLab's HackerOne bug-bounty program (researcher handle s3ntago).
      watchTowr reproduced the vulnerability and validated exposure across client environments the same day GitLab published patches, and by 2026-09-11 its Attacker Eye global honeypot network was already recording behavioral probes against the flaw — meaning attackers had independently reverse-engineered a working exploit within roughly 24 hours of disclosure. CISA added the CVE to its KEV catalog on 2026-09-11 with a three-day remediation deadline (2026-09-14). NCSC Switzerland's own advisory (published 2026-09-11, 13:54 CEST — before CISA's KEV addition later that day) recorded exploitation status as "unknown" at time of writing, illustrating how fast the status moved from unconfirmed to KEV-listed within the same day. Depending on file permissions and deployment layout, the exposed files can include configuration data, secrets, tokens, SSH keys and database credentials — i.e. a foothold into the CI/CD and source-control plane that GitLab manages, which is a materially higher-value target than the file-read primitive alone suggests. The same release also fixed a second maximum-severity flaw, CVE-2026-87719 (CVSS 9.9), an insecure GraphQL-subscription deserialization issue exposing Advanced Search configurations and credentials to an authenticated user with Duo Chat access — not KEV-listed and not confirmed exploited, but worth patching in the same maintenance window since it ships in the identical release.
    region_nexus: "global; GitLab widely deployed for source-control/CI-CD across public and private sector, including self-managed instances in EU/Swiss government contexts"
