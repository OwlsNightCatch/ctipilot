        attribution: "JFrog (vendor advisory)"
        source_url: "https://docs.jfrog.com/releases/docs/jfrog-security-advisories"
    extended_notes: |
      EXPLICIT DISPOSITION per the KEV duty instructions: I checked JFrog's own advisory page. CVE-2026-42016 (published 27 Jul 2026), CVE-2026-42018 (published 12 Aug 2026), and CVE-2026-82329 (published 28 Aug 2026, the entry already in the store) are three SEPARATE JFrog advisory entries with three different CVE ids, three different root causes (token-scope validation / anonymous-token exposure / default-config join-key bypass), and three different affected-version ranges. They are NOT the same flaw re-numbered and NOT the same advisory — so per the instruction's own conditional ("if same root cause / same advisory" -> update), this does not meet the bar for an update-of record. I am returning it as a NEW entry. However, because Wiz Research's single report covers all three CVEs as one connected "Artifactory under attack" narrative, and because the two entries concern the same vendor product family, I recommend the composer set `references: ["2026-09-01/jfrog-artifactory-cve-2026-82329-default-config-admin-bypass"]` (included above) so readers are pointed between the two, and consider whether the existing 82329 entry's changelog should also get a short cross-reference note pointing forward to this new entry. If the composer judges that keeping one unified "JFrog Artifactory under active attack" entry serves readers better than two separate entries, an `update` changelog record adding these two CVEs to the existing entry's frontmatter (with a body section covering the token-chain mechanism) is the defensible alternative — I flag both options because the store's dedup discipline leaves this a judgment call once CVE ids and root causes are confirmed genuinely distinct, which they are.

