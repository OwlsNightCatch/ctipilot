    discovery_trace: "first seen at: WebSearch (\"ENISA cyber resilience act reporting platform live September 11 2026\") → primary: ENISA, URL https://www.enisa.europa.eu/news/the-cra-single-reporting-platform-is-launched → primary: European Commission, URL https://digital-strategy.ec.europa.eu/en/policies/cra-reporting → corroborating: heise online, URL https://www.heise.de/news/Gilt-ab-heute-CRA-setzt-24-Stunden-Frist-fuer-Sicherheitsmeldungen-11450208.html (surfaced via inside-it.ch/heise-sec sweep of the standing CRA policy watch)"
    summary: |
      ENISA and the European Commission both confirm, in pages dated 2026-09-11, that the CRA Single Reporting Platform (SRP) is operational as of that date — resolving the open point this store's existing entry recorded a day earlier ("neither the Commission's own page nor ENISA's SRP page states the platform is confirmed live"). ENISA: "The EU Agency for Cybersecurity (ENISA) has deployed the initial operating capability of the Single Reporting Platform (SRP)." Manufacturers of products with digital elements and (from 11 December 2027) open-source software stewards submit once through the SRP; the receiving CSIRT disseminates to every other Member-State CSIRT where the product is available and simultaneously to ENISA. heise online's same-day reporting adds a defender-relevant operational detail Bitkom (the German digital-industry association) surfaced in a representative 1,003-company survey: only 29% of German firms know what the CRA means for their own organization, a further 38% have heard of it but cannot assess the impact, and Bitkom specifically criticizes that manufacturers could not register on the SRP or test their reporting process before today, because "the platform only went online with the start of the reporting obligation" ("Die Plattform ging erst mit Beginn der Meldepflicht online"). For any Swiss public-sector body that also manufactures or distributes networked products into the EU market (or procures from EU manufacturers now subject to this clock), the practical takeaway is that the 24h/72h/14-day-or-1-month reporting chain is now a live, working obligation rather than a target date — and first submissions may hit friction precisely because pre-launch registration/testing was not possible.
    region_nexus: "EU-wide regulatory obligation; directly relevant to any Swiss manufacturer or distributor placing networked products with digital elements on the EU market, and to Swiss public-sector bodies procuring from EU-regulated manufacturers"
