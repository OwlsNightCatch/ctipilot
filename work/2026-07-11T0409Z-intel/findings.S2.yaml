research_notes: |
  Extensive sweep of all essential-tier home-region/EU sources this run
  (NCSC-CH Cyber Security Hub + Im Fokus + Aktuelle Vorfälle, ANSSI/CERT-FR avis feed,
  BSI CERT-Bund WID RSS, CERT Polska RSS, CERT-EU advisories, CISA advisories/ICS feed,
  ENISA EUVD, NCSC-NL advisories RSS, NCSC-UK reports-advisories, CERT.at) plus targeted
  DE/FR WebSearch sweeps for Swiss-specific incidents (cantonal/communal, healthcare,
  finance/telco) and Swiss vendor blogs (Kudelski Security, InfoGuard, OneConsult,
  Synacktiv). No item cleared BOTH the 24h recency gate and the prior_coverage.json
  dedup check. Notable items found but dropped, with reasons:
    - NCSC-CH CSH posts "[Advisory] Zimbra Classic Web Client" (id 12757, created
      2026-07-10T12:45Z) and "[Advisory] Gitea auth bypass CVE-2026-20896" (id 12755,
      created 2026-07-10T08:55Z) — both already published as entries dated 2026-07-10
      (zimbra-classic-web-client-code-exec-ncsc-ch;
      gitea-cve-2026-20896-ncsc-ch-actively-exploited-update). Confirmed via
      prior_coverage.json — DUPLICATE, not re-surfaced.
    - CERT-FR CERTFR-2026-AVI-0860 (Siemens SICAM 8 / SSA-229470, four CVEs incl.
      firmware-signature-validation bypass CVE-2026-54799 and admin-privilege-escalation
      CVE-2026-54801, CVSSv4 8.6) republishes/echoes Siemens's 2026-07-09 advisory in
      French on 2026-07-10 — already published as entry
      "2026-07-10/siemens-sicam-8-ssa-229470-firmware-signing-bypass". DUPLICATE.
    - CERT-FR CERTFR-2026-AVI-0856 (Progress MOVEit Transfer, CVE-2026-11903/10699/10698,
      priv-esc + confidentiality + reflected XSS, no confirmed exploitation) — checked,
      NOT a duplicate, but no exploitation status and only moderate CVSS-class impact;
      judged a routine vendor-patch item without a distinct home-region/sector nexus
      beyond MOVEit's general public-sector file-transfer footprint (same product class
      as the 2023 mass-exploitation, but this disclosure carries no ITW signal) — left
      for S1's general vulnerability lane rather than forced into S2.
    - RTS (Swiss public broadcaster) "Cyberespace : des hackers iraniens menacent la
      Suisse" — Homeland Justice (Iran-linked, FBI attribution) threatening Swiss banks/
      financial networks, SRC (Swiss Federal Intelligence Service) confirming Iranian
      state cyber actors already target the Confederation and "probably" intensifying
      surveillance of Iranian opposition members resident in Switzerland. Verified
      publication timestamp via jina reader: 2026-06-23T19:14:20+02:00 — i.e. ~18 days
      before this run, NOT in-window despite surfacing high in today's WebSearch results
      (classic recycled-news trap per the recency-discipline guidance). DROPPED on
      recency grounds; worth a future daily/weekly re-check if the SRC or NCSC-CH
      publishes fresh material on this threat.
    - Swiss Post Cybersecurity inaugural Threat Landscape Report — resurfaced via two
      Swiss trade-press rewrites dated 2026-07-09 (Netzwoche/IT-Markt/SwissCybersecurity.net:
      "Cyberangriffe lassen sich nicht mehr vollständig verhindern" and "Was die
      Schweizer IT-Bedrohungslandschaft im Juni geprägt hat") — both confirmed via
      WebFetch to rehash the report already published as entry
      "2026-06-29/swiss-post-cybersecurity-inaugural-swiss-threat-landscape-re" and the
      NCSC-CH M365-voicemail-phishing wave already covered under
      "incident:ncsc-ch-booking-hotel-phishing-2026". DUPLICATE / no new technical
      substance.
    - PDAG (Psychiatrische Dienste Aargau, Swiss cantonal psychiatric health service)
      email-account compromise / phishing-relay incident — surfaced via WebSearch but
      the underlying disclosure date (2026-07-01) and the run's own prior coverage
      confirm this was already published as entry "2026-07-09/pdag-aargau-email-
      account-compromise-spam-relay". DUPLICATE.
    - NCSC-NL NCSC-2026-0222 (GitLab EE/CE, seven authz/XSS/access-control bugs across
      versions 9.1–19.1.2, published 2026-07-10T05:48Z, in-window) — checked in full;
