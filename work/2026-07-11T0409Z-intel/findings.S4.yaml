    extended_notes: |
      Triage / benign-lookalike discriminator (inferred mechanically from the stated mechanism, not
      sourced verbatim): a legitimate clinical record view correlates with an active care-team/ward
      assignment or a documented referral relationship for that patient during the current episode of
      care; an unlawful/curiosity view is a record access with no matching care-team/referral linkage —
      e.g. a staff member outside the treating team or department viewing a high-profile/newsworthy
      patient's record, or viewing occurring outside the patient's active care episode or the staff
      member's rostered shift. Detection concept (telemetry class first): EPR/EHR audit-log analytics
      that join record-access events against the care-team/rostering system of record to flag views with
      no matching clinical relationship, plus anomaly detection on per-staff access volume/scope and
      "break-glass" emergency-override accesses that lack a post-hoc documented justification within a
      defined SLA. Hardening: RBAC scoped to ward/care-team assignment rather than facility-wide read
      access, mandatory business-justification prompts when a search widens beyond the assigned
      care-team scope, MFA on EPR access, and *proactive* periodic audit sampling rather than only
      reactive investigation after a high-profile incident or media enquiry (the Nottingham and
      Cambridgeshire cases were both discovered reactively). NHS England's technical annexes
      (digital.nhs.uk guidance-for-ig-professionals) 403'd this run (covered_anyway: true via the primary
      press release + long-read + secondary reporting) — a follow-up run could retry that specific annex
      for the concrete IG-professional control list.
      Dropped leads (fake-news / recency scrutiny, logged for the record, not returned as items):
      (1) Deadlock ransomware leak site posted a bulk wave of ~60 victim-claim entries within a
      ~25-minute window on 2026-07-10 (12:52–13:15 UTC), including a Swiss SME ("Dyhrberg AG",
      Balsthal, fish import/export — Manufacturing) and a Czech municipality ("Zidlochovice city",
      Public Sector). WebSearch found zero independent journalism or victim confirmation for the Swiss
      SME claim; the Zidlochovice search results all traced to a *different*, already-resolved March
      2026 ransomware incident at that same town hall (Czech press attributed to a North Korea-linked
      strain at the time) — no evidence of a *new* July 2026 incident there, so the Deadlock listing
      looks like either a stale re-post or a fabricated/inflated claim. Both fail the leak-site
      verification bar (victim disclosure or Admiralty A/B journalism required) and were dropped.
      (2) "CISA Details Incident Response to Exposed AWS GovCloud Keys" (Infosecurity Magazine,
      2026-07-10) is a rehash of CISA's own "Lessons from CISA's Cyber Incident" post, which is dated
      2026-06-23 on cisa.gov — nearly three weeks before this window; dropped as recycled news per the
      recency guardrail (classic "check the original event date" trap).
      (3) "ShinyHunters Claims Council of Europe Hack" surfaced via WebSearch but is dated 2026-06-15 —
      stale, dropped.
      (4) River Financial Corporation (US, Alabama community bank) filed an 8-K/A on 2026-07-10 updating
      an already-disclosed Item 1.05 material cybersecurity incident (unauthorized network access, data
      exfiltration, two subsequent class-action suits) — no technical detail beyond boilerplate, no
      named actor/vector, no Swiss/EU nexus, small regional US bank; dropped as out-of-nexus and too
      thin to be actionable.

