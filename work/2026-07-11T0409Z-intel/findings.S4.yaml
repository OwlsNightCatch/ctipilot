      - quote: "Patients must be able to trust that their personal information is kept confidential by the NHS – any instance of staff looking at records without a valid reason is wholly unacceptable, a disgraceful breach of patients' trust and against the law."
        attribution: "Sir Jim Mackey, NHS England Chief Executive (NHS England press release)"
        source_url: "https://www.england.nhs.uk/2026/07/snooping-staff-face-sack-prison-inappropriate-access-patient-data/"
      - quote: "Anyone considering accessing records for personal reasons or out of curiosity should be in no doubt they could be putting their career at risk, and may face disciplinary action, dismissal, referral to the regulator or even time in prison."
        attribution: "NHS England press release"
