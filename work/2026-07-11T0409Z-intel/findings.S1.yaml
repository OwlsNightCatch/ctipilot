    evidence:
      - quote: "This adds a new exploit module for FlowiseAI Flowise (CVE-2026-41264). The CSV Agent feature evaluates LLM-generated Python code without proper sandboxing, allowing a prompt injection to achieve arbitrary code execution as the user running the server."
        attribution: "Rapid7 (Metasploit weekly wrap-up)"
        source_url: "https://www.rapid7.com/blog/post/pt-weekly-metasploit-update-exploits-for-flowiseai-csv-agent-and-macos-package-kit"
      - quote: "The issue results from the lack of proper sandboxing when evaluating an LLM generated python script. An attacker can leverage this vulnerability to execute code in the context of the user running the server."
        attribution: "FlowiseAI GitHub Security Advisory (GHSA-3hjv-c53m-58jj)"
        source_url: "https://github.com/FlowiseAI/Flowise/security/advisories/GHSA-3hjv-c53m-58jj"
      - quote: "An unauthenticated attacker with the ability to send prompts to a chatflow using the CSV Agent node may convince an LLM to respond with malicious python script."
        attribution: "FlowiseAI GitHub Security Advisory (GHSA-3hjv-c53m-58jj)"
        source_url: "https://github.com/FlowiseAI/Flowise/security/advisories/GHSA-3hjv-c53m-58jj"
    extended_notes: |
      Detection concept: process-creation telemetry showing the Flowise/Node.js server process spawning
      a Python interpreter (or a Python process invoking os/subprocess-equivalent calls) outside of
      expected orchestration paths is the anchor; on the Flowise host, unexpected child processes off
      the node/flowise parent with command lines invoking system()/os.system-equivalent calls are the
      discriminator. Benign lookalike: legitimate CSV Agent usage does invoke Python-in-process for
      pandas dataframe operations, so the distinguishing signal is imports beyond pandas/numpy data
      manipulation (e.g. os, subprocess aliased as a data-science module name) or outbound network/file
      activity from the interpreter that doesn't match a CSV-processing workload. Hardening: upgrade to
      Flowise/flowise-components >= 3.1.0; restrict chatflows:create API-key issuance; do not expose
      Flowise CSV Agent-enabled chatflows to unauthenticated end users; network-isolate self-hosted
      Flowise instances from the internet where agent-authoring is not a public-facing requirement.
    borderline: true
    borderline_reason: "the underlying CVE was disclosed in April 2026 (not new); the in-window development is the public Metasploit weapon­ization, which the S1 mission explicitly tracks (public PoC/exploit research) but which some editors may judge as insufficiently novel for a standalone entry — surfaced for the main agent's call."

