    extended_notes: |
      Defender takeaway: any Swiss/EU public-sector or CI operator with Dutch group entities,
      Dutch-hosted infrastructure, or Dutch suppliers/counterparties should re-anchor internal
      NIS2-readiness milestones on 15 August 2026 rather than 1 July, and confirm whether contractual
      NIS2-compliance-by-date clauses referencing "1 July 2026" with Dutch counterparties need
      re-negotiation. The written-preparation timeline (second committee report response tabled
      29 June, floor debate 6-7 July, vote 7 July) is the fourth slip in the Dutch NIS2 timetable
      documented across the last several weeklies (originally targeted Q3 2025).
