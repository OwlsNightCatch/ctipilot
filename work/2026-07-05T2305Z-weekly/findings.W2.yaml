items:
  - title: "Netherlands NIS2 transposition slips past 1 July target — Eerste Kamer vote now set for 7 July, entry into force pushed to 15 August 2026"
    sources:
      - { url: "https://www.eerstekamer.nl/wetsvoorstel/36764_cyberbeveiligingswet", publisher: "Eerste Kamer der Staten-Generaal (Dutch Senate) — official bill-tracking page", date: "2026-06-29", role: primary }
      - { url: "https://ibestuur.nl/digitale-weerbaarheid/digitale-veiligheid/eerste-kamer-stemt-7-juli-over-cyberbeveiligingswet", publisher: "iBestuur", date: "2026-07-01", role: corroborating }
    discovery_trace: "first seen at: WebSearch (\"Netherlands Cyberbeveiligingswet Eerste Kamer Senate vote July 2026\") → pivot: iBestuur, URL https://ibestuur.nl/digitale-weerbaarheid/digitale-veiligheid/eerste-kamer-stemt-7-juli-over-cyberbeveiligingswet → primary: Eerste Kamer official bill page, URL https://www.eerstekamer.nl/wetsvoorstel/36764_cyberbeveiligingswet"
    summary: |
      The Dutch NIS2 transposition (Cyberbeveiligingswet / Cbw, plus the companion Wet weerbaarheid
      kritieke entiteiten) has missed the 1 July 2026 entry-into-force target that our 2026-06-29
      coverage reported as the government's goal. The Eerste Kamer (Senate) tabled its government
      response to the second committee report ("nota naar aanleiding van het tweede verslag") on
      29 June 2026 — the last written-preparation step before plenary debate — and the Senate's own
      bill-tracking page now states the floor vote will take place on 7 July 2026, with debate on
      6-7 July. iBestuur (1 July 2026) reports the government's revised target for entry into force
      is now 15 August 2026, roughly six weeks later than previously communicated. The substantive
      scope is unchanged from our prior coverage: NCSC-NL as designated supervisor, a three-step
      24h/72h/one-month incident-notification protocol, essential-entity fines up to EUR 10M or 2%
      of global turnover, and personal board liability for oversight of security measures — the law
      expands the population of in-scope Dutch entities from roughly 1,000 to roughly 8,000.
    region_nexus: "Netherlands (EU member state); direct nexus for any Swiss/EU entity with Dutch group entities, subsidiaries, or Dutch counterparties/suppliers in scope of NIS2"
    primary_sector_nexus: "direct — public-sector and critical-infrastructure entities with Dutch operations fall under the expanded essential/important-entity population"
    sector: "public-sector, energy, water, transport, healthcare, finance, telco"
