- code: F5
  category: missing-citation
  section: weekly-incidents-recap
  item: "weekly-w27-law-enforcement-momentum — StegoAd (119 Edge extensions) and $10M bounty claims"
  url_or_quote: "\"Microsoft disrupted StegoAd — 119 Edge extensions...\" and \"The US added a $10M bounty on the Russia-nexus Signal/WhatsApp phishing crews and folded Signal Backup-Recovery-Key theft into the advisory.\""
  summary: "Both claims (specific figures 119 and $10M) carry no inline citation and are absent from the entry's references, which list only NetNut (2026-07-04) and Mustang Panda (2026-06-30). Both are TRUE and each has an in-window operational entry that should be referenced: 2026-06-30/microsoft-disrupts-stegoad-119-edge-extensions-hid-payloads and 2026-06-30/us-posts-10m-bounty-on-the-russia-nexus-signal-whatsapp-crew (bounty confirmed: State Dept $10M for UNC5792/UNC4221). Fix: add both operational entries to references (W-PD-8 requires strategic entries to re-frame operational coverage via references) and/or add inline links."
- code: F3
  category: claim-not-supported
  section: weekly-incidents-recap
  item: "weekly-w27-extortion-without-encryption — Kairos county case"
  url_or_quote: "headline+summary+body: \"no encryptor deployed\" / \"an intrusion in which no encryptor was ever deployed\""
  summary: "Ransom-ISAC (https://ransom-isac.org/blog/kairos-ransomware-data-extortion-case-study/, fetched this iteration) states only that \"no encryptor sample, locker binary, or independently verified ransomware payload has been obtained in this case\" and that the actor's \"'ransomware group' status remains unverified\" — an evidentiary absence, not a confirmed absence of deployment. The entry converts this into the flat absolute \"no encryptor was ever deployed\" (including the headline). Soften to \"no encryptor was recovered/observed\" (or \"no encryptor obtained\") to match the source. The broader encryption-less-extortion pattern is well-corroborated; only this absolute needs precision."
- code: F11
  category: editorial-advisory
  section: weekly-incidents-recap
  item: "weekly-w27-law-enforcement-momentum — formatting glitch"
  url_or_quote: "\"...recurring, disruptable delivery surface. **$10M bounty** on Russia-nexus crews. The US added a $10M bounty...\""
  summary: "A bolded sub-head fragment (\"**$10M bounty** on Russia-nexus crews.\") is stranded mid-paragraph after the StegoAd sentence, reading as a rendering glitch. Promote to its own paragraph/subhead so the three disruption actions parse cleanly."
- code: F11
  category: editorial-advisory
  section: weekly-incidents-recap
  item: "weekly-w27-extortion-without-encryption — Kairos citation date / incident age"
  url_or_quote: "body cite \"[Ransom-ISAC, 2026-07-05]\"; frontmatter event_date: 2026-07-05"
  summary: "The Ransom-ISAC case-study page is dated 2026-07-03 (not 2026-07-05); event_date should track the source pub date. Also the underlying incident (demand 2025-05-19, $1M payment 2025-06-13 per the case study) is from mid-2025 — a retrospective case study published in-window. Consider a one-clause note that the incident itself is a 2025 case, so readers don't infer a this-week intrusion."
- code: F11
  category: editorial-advisory
  section: weekly-policy
  item: "weekly-w27-netherlands-nis2-slip — debate dates"
  url_or_quote: "\"...floor vote will take place on 7 July 2026 (debate 6–7 July) ([Eerste Kamer, bill 36764])\""
  summary: "The cited Eerste Kamer official bill page confirms the 7 July 2026 vote (\"De stemming in de Eerste Kamer vindt plaats op 7 juli 2026.\" — verbatim) but per fetch does not state the \"debate 6–7 July\" dates attributed to it. Minor: either source the debate dates (iBestuur) or drop the parenthetical. Vote date and 15-Aug entry-into-force (iBestuur) are correctly sourced."
