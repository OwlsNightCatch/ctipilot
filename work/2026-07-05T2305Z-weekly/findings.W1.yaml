    extended_notes: |
      Confidence marked MEDIUM rather than HIGH because the Nextcloud zero-day claim is single-sourced to SOCRadar pending vendor disclosure/CVE assignment — flag for a follow-up daily item once Nextcloud publishes an advisory. Detection angle for the sniffer itself: FortiOS `diagnose sniffer packet` invocations outside of scheduled maintenance/support windows are the highest-value hunt signal (the technique the 2026-06-23 daily's FortigateSniffer disclosure already surfaced); this update's added value is the ransomware-attribution linkage and the revised device-compromise statistics (11,250 scanned / 409 admin-access / 354 full-domain / 12 ransomware deployments), which sharpen the scale assessment for risk prioritisation.

