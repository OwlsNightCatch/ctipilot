items:
  - title: "NetNut (Popa) residential-proxy botnet dismantled — FBI seizes domains, Google cuts ~2M hijacked smart-TV/streaming-box devices from 316 threat clusters"
    sources:
      - { url: "https://cloud.google.com/blog/topics/threat-intelligence/google-continued-disruption-residential-proxy-networks", publisher: "Google Cloud (GTIG)", date: "2026-07-02", role: "primary" }
      - { url: "https://krebsonsecurity.com/2026/07/fbi-seizes-netnut-proxy-platform-popa-botnet/", publisher: "Krebs on Security", date: "2026-07-02", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/netnut-proxy-network-disrupted-2-million-infected-devices-cut-off/", publisher: "BleepingComputer", date: "2026-07-03", role: "corroborating" }
      - { url: "https://thehackernews.com/2026/07/google-disrupts-netnut-residential.html", publisher: "The Hacker News", date: "2026-07-03", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"NetNut Popa residential proxy botnet takedown Google FBI Lumen Shadowserver July 2026\") → primary: Krebs on Security, URL https://krebsonsecurity.com/2026/07/fbi-seizes-netnut-proxy-platform-popa-botnet/ → primary: Google Cloud (GTIG), URL https://cloud.google.com/blog/topics/threat-intelligence/google-continued-disruption-residential-proxy-networks"
    summary: |
      This is the in-window follow-through on the campaign our 2026-06-21 daily first flagged (Krebs/Qurium tying the "Popa" Android-TV botnet to NetNut, a residential-proxy service run by NASDAQ-listed Alarum Technologies). On 2026-07-02, the FBI — working with Google, Lumen and Shadowserver — seized hundreds of domains tied to NetNut/Popa, and Google's Threat Intelligence Group (GTIG) published a technical disruption report. GTIG counted at least 2 million compromised devices (predominantly Android-based smart TVs, streaming boxes, and apps such as the SmartTube client carrying malicious SDKs) functioning as always-on residential-proxy exit nodes. In a single week in June 2026, GTIG observed 316 distinct threat clusters — a mix of cybercriminal and suspected espionage groups — routing traffic through suspected NetNut exit nodes to mask origin IPs during password-spray campaigns, credential stuffing, ad fraud, and access to their own attacker-controlled infrastructure as well as victim environments. Google's coordinated response disabled all Google accounts NetNut used for malware C2, updated Google Play Protect to flag/block apps bundling the compromised SDKs, and shared SDK/infrastructure intelligence with law enforcement and industry partners (Synthient, Spur, Nokia Deepfield). Google assesses with high confidence that several popular "residential proxy" brands are in fact whitelabeling the NetNut botnet, and warns operators degraded by this action are likely to buy capacity from competitor residential-proxy networks (as happened after the earlier IPIDEA takedown) — meaning defenders should not expect proxy-based-anonymization abuse volumes to drop structurally, only shift providers.
    region_nexus: "global; the 316 threat-cluster figure and the proxy-based-evasion technique are directly relevant to any CH/EU SOC doing IP-reputation-based detection, since residential-proxy exit nodes defeat geo/ASN-based blocking used against credential-stuffing and password-spray activity."
    primary_sector_nexus: "indirect — relevant as a detection-evasion enabler across all sectors (any org relying on IP/ASN reputation for anti-abuse or brute-force detection)."
    sector: "telco, public-sector, finance"
    cves: []
    entity_keys: ["campaign:popa-vo1d-residential-proxy-botnet"]
    new_entities: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "update-of:2026-06-21/krebs-and-qurium-tie-the-popa-android-tv-residential-proxy-b"
