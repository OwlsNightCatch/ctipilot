        attribution: "Krebs on Security, citing Google"
        source_url: "https://krebsonsecurity.com/2026/07/fbi-seizes-netnut-proxy-platform-popa-botnet/"
    extended_notes: |
      Defender vantage: the enabling technique (T1090.002/T1090.003-class residential-proxy relay abuse for credential attacks) is the actionable takeaway, not the takedown itself — hunt for authentication attempts from residential/consumer-ISP ASN ranges hitting the same account in rapid succession from geographically implausible sequences, and treat any IP-reputation allowlisting of "residential" traffic as a gap. This is a genuine in-window delta on a campaign explicitly named in the weekly's standing watch list (Popa/Vo1d/NetNut) — first raised 2026-06-21, this is the takedown outcome.

  - title: "FortiBleed FortiGate credential-harvesting campaign attributed to INC Ransom and Lynx ransomware operations, with a Nextcloud zero-day claim"
    sources:
      - { url: "https://socradar.io/blog/fortibleed-inc-lynx-ransomware-link/", publisher: "SOCRadar (STRU)", date: "2026-07-01", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/fortibleed-credential-theft-campaign-linked-to-lynx-ransomware/", publisher: "BleepingComputer", date: "2026-07-01", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"FortiBleed FortiGate credential compromise update July 2026\") → pivot: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/fortibleed-credential-theft-campaign-linked-to-lynx-ransomware/ → primary: SOCRadar (STRU), URL https://socradar.io/blog/fortibleed-inc-lynx-ransomware-link/"
    summary: |
      This is the in-window delta on FortiBleed, the FortiGate credential-exposure campaign the prior weekly (2026-06-22 and 2026-06-29) tracked from initial disclosure (86,644+ then 73,932+ credentials) through a first tool-chain disclosure (the Golang "FortigateSniffer" abusing FortiOS's native `diagnose sniffer packet` command) and an AD-domain-takeover escalation at a NATO-aligned defence contractor. On 2026-07-01, SOCRadar's Threat Research Unit (STRU) published attribution evidence tying FortiBleed's infrastructure directly to two active ransomware-as-a-service operations: an operator with access to FortiBleed infrastructure was found logged into the negotiation panels of both INC Ransom and Lynx (which SOCRadar assesses, per other security researchers, to be an INC rebrand rather than a distinct group), and victim data from FortiBleed overlaps with victims already tracked by INC Ransom's leak site — the first direct evidence tying the mass FortiGate credential theft to a specific ransomware deployment pipeline. STRU also revised the campaign's scale upward: scanning activity against ~11,250 FortiGate portals across 150+ countries, admin-level access confirmed on 409 targets, full domain compromise on 354, and at least 12 confirmed ransomware deployments to date. The operation is structured as an Initial Access Broker business with roughly 20 people and a tiered internal structure (per an operational-security lapse that exposed internal documentation), and — most significant for defenders running unpatched or internet-exposed collaboration platforms — STRU states the group is in possession of at least one undisclosed zero-day vulnerability in Nextcloud, with SOCRadar coordinating responsible disclosure with the vendor. Given Nextcloud's prevalence in Swiss/German public-sector and SME deployments (data-sovereignty-driven adoption), this zero-day claim should be tracked pending vendor disclosure.
    region_nexus: "FortiBleed's prior escalation already named a NATO-aligned defence contractor and DACH-relevant CISA/BSI hardening guidance (covered 2026-06-22/06-29); this update adds a Nextcloud zero-day exposure relevant to CH/EU public-sector Nextcloud deployments."
    primary_sector_nexus: "direct — any organisation (public-sector, energy, healthcare, finance) with a FortiGate device exposed May-June 2026 should treat stored/derived credentials as compromised regardless of current patch level, per Fortinet's own confirmation that this is credential reuse/brute force rather than a new CVE."
    sector: "public-sector, energy, healthcare, finance, telco"
