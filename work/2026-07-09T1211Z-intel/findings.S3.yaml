        attribution: "Nozomi Networks Labs"
        source_url: "https://www.nozominetworks.com/blog/spring-botnet-floods-golang-malware-targets-exposed-iot-systems"
      - quote: "It checks whether passwordless sudo is available by running sudo -n true and evaluating the return value. If successful, it relaunches itself with increased privileges, copies to /usr/local/bin/cpufreqd, and creates a fake systemd service named \"CPU Frequency Daemon\""
        attribution: "Nozomi Networks Labs"
        source_url: "https://www.nozominetworks.com/blog/spring-botnet-floods-golang-malware-targets-exposed-iot-systems"
      - quote: "Organisations should expect a steady stream of simple but effective botnets targeting exposed Linux and IoT systems, particularly where weak credentials, internet-facing services, and limited outbound visibility persist."
        attribution: "Nozomi Networks Labs"
