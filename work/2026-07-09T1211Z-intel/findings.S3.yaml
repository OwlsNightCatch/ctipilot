items:
  - title: "RedHook Android RAT abuses ADB Wireless Debugging to self-grant shell-level (uid 2000) privileges without an exploit"
    sources:
      - { url: "https://www.group-ib.com/blog/redhook-android-rat-upgraded/", publisher: "Group-IB", date: "2026-07-09", role: "primary" }
    discovery_trace: "first seen at: group-ib-blog (not in curated slice; discovered via source-list expansion), URL https://www.group-ib.com/blog/ → primary: Group-IB, URL https://www.group-ib.com/blog/redhook-android-rat-upgraded/ (no pivot needed beyond confirming the article body via jina reader after a transient 502)"
    summary: |
      Group-IB documents a significantly upgraded variant of RedHook, an Android RAT first
      documented by Cyble in July 2025 and previously focused on Vietnamese banking users.
      The new capability of note is self-service privilege abuse via ADB (Android Debug Bridge)
      Wireless Debugging: after tricking the victim into granting Accessibility Service permission
      (via a fake "required setup" walkthrough on a phished government/financial site), the malware
      uses Accessibility-driven UI automation to silently enable Developer Options and Wireless
      Debugging, then embeds its own ADB client to connect to the device's own ADB daemon over the
      loopback interface (127.0.0.1) — no PC or USB cable needed. It launches a Shizuku-derived
      privileged server binary ("libmx.so") that runs under shell uid 2000, from which it can grant
      itself arbitrary runtime permissions, execute shell commands as uid 2000, and set
      WRITE_SECURE_SETTINGS to modify Settings.Secure/Settings.Global directly. Group-IB states
      explicitly "there is no exploit here" — this is abuse of a legitimate developer feature, not
      a vulnerability. Persistence combines a 1x1-pixel foreground activity, silent MediaSession
      audio, a foreground-service WakeLock, mutual cross-process rebinding (bindService with
      BIND_AUTO_CREATE) between two services that resurrect each other, oom_score_adj tuning to
      -1000, memory-page pinning via mlock(), and a BOOT_COMPLETED receiver that silently
      re-establishes Wireless ADB and the privileged helper on every reboot. C2 is via WebSocket
      (screen streaming) with a parallel RTMP stream once shell privileges are obtained, bypassing
      the MediaProjection consent dialog entirely. The command set has grown to 53 distinct
      server-issued commands. Distribution has expanded from Vietnam to Indonesia, via spoofed
      government/financial sites with APK payloads hosted on GitHub repos and AWS S3 buckets to
      improve delivery reliability. OEM-specific (Google, Huawei, Meizu, Oppo, Samsung, Vivo,
      Xiaomi) UI-automation routines for enabling Wireless ADB are present in the code but not yet
      invoked, suggesting future broadening of device coverage.
    region_nexus: "Vietnam and Indonesia (confirmed targeting); the technique — Accessibility-driven self-enablement of ADB Wireless Debugging to obtain shell-uid privileges with no exploit — is directly transferable to any Android fleet, including Swiss/EU mobile-banking and BYOD/MDM-managed public-sector deployments"
    primary_sector_nexus: "indirect"
    sector: "finance, mobile/BYOD (cross-sector)"
    cves: []
    entity_keys: []
    new_entities:
      - { key: "tool:redhook-android-rat", type: tool, name: "RedHook", aliases: [],
          summary: "Android RAT first documented by Cyble (July 2025) targeting Vietnamese banking users; Group-IB's July 2026 update documents self-service privilege escalation via ADB Wireless Debugging abuse, expanded to Indonesia (Group-IB, 2026-07-09)." }
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "This, however, is the first time we have seen it used by a malware to abuse privileges on a victim's device."
        attribution: "Group-IB"
        source_url: "https://www.group-ib.com/blog/redhook-android-rat-upgraded/"
      - quote: "By leveraging ADB, the malware gains shell-level privileges (uid 2000) and uses them to silently install and uninstall applications, modify secure settings, and grant sensitive permissions without user interaction or confirmation dialogs."
        attribution: "Group-IB"
        source_url: "https://www.group-ib.com/blog/redhook-android-rat-upgraded/"
      - quote: "There is no exploit here, \"merely\" turning a debugging interface into a path to shell-level privileges."
        attribution: "Group-IB"
        source_url: "https://www.group-ib.com/blog/redhook-android-rat-upgraded/"
    extended_notes: |
      Detection/hunt angle for defenders (MITRE ATT&CK for Mobile): the described behaviours map to
      T1453 Abuse Accessibility Features (Persistence/Privilege Escalation) for the UI-automation
      chain, T1541 Foreground Persistence for the 1x1-pixel-activity/silent-audio/WakeLock trio,
      T1512 Video Capture and T1417 Input Capture (.001 Keylogging/.002 GUI Input Capture) for
      screen-streaming and keylogging, and — closest available mapping, no exact sub-technique
      exists yet for ADB-wireless-debugging self-enablement specifically — T1626 Abuse Elevation
      Control Mechanism for the shell-uid privilege grab. EMM/MDM-relevant hunt signal: any
      non-system app programmatically flipping Settings.Global "adb_wifi_enabled" / enabling
      Developer Options without an interactive ADB pairing flow initiated by IT, or an app process
      binding a loopback ADB connection to 127.0.0.1, is anomalous on a managed fleet and should
      alert. Hardening: enterprise MDM policies should disable Developer Options / USB and Wireless
      debugging on managed devices by default (Android Enterprise DevicePolicyManager
      setDebuggingFeaturesAllowed / equivalent restriction), and flag apps requesting
      BIND_ACCESSIBILITY_SERVICE outside an approved allowlist.

  - title: "Nozomi Networks Labs: two new Golang IoT/Linux DDoS botnet families (Apex2, c2c/\"meow\") show faster, more modular botnet development cycles"
    sources:
      - { url: "https://www.nozominetworks.com/blog/spring-botnet-floods-golang-malware-targets-exposed-iot-systems", publisher: "Nozomi Networks Labs", date: "2026-07-06", role: "primary" }
      - { url: "https://industrialcyber.co/ransomware/nozomi-identifies-apex2-and-c2c-golang-malware-driving-faster-iot-botnet-attacks-raising-risks-for-ot-environments/", publisher: "Industrial Cyber", date: "2026-07-09", role: "corroborating (re-report, surfaced the story into today's window)" }
      - { url: "https://www.ilcorrieredellasicurezza.it/analisi-sulle-botnet-di-primavera-il-malware-golang-prende-di-mira-i-sistemi-iot-esposti/", publisher: "Il Corriere della Sicurezza (IT)", date: "2026-07-09", role: "corroborating (re-report)" }
    discovery_trace: "first seen at: industrialcyber-co (rotation-priority slice source; direct-fetch and jina both 403/challenge-blocked, but its own RSS feed https://industrialcyber.co/feed/ was reachable), URL https://industrialcyber.co/ransomware/nozomi-identifies-apex2-and-c2c-golang-malware-driving-faster-iot-botnet-attacks-raising-risks-for-ot-environments/ → pivot: WebSearch (\"Apex2 nozomi networks blog botnet Golang malware analysis\") → pivot: Il Corriere della Sicurezza IT translation, URL https://www.ilcorrieredellasicurezza.it/analisi-sulle-botnet-di-primavera-il-malware-golang-prende-di-mira-i-sistemi-iot-esposti/ (carried the direct link to the primary) → primary: Nozomi Networks Labs, URL https://www.nozominetworks.com/blog/spring-botnet-floods-golang-malware-targets-exposed-iot-systems"
    summary: |
      Nozomi Networks Labs' AI-assisted honeypot triage flagged two Golang-based DDoS botnet
      samples this spring that stand out from the routine volume of Mirai-derived variants Nozomi
      already tracks: Apex2 and c2c (also seen distributed under the filename "meow"). Apex2 is a
      direct structural evolution of the earlier "Apex" botnet: infection begins with Telnet
      connections and credential brute-forcing against honeypots, followed by download-and-execute
      of the Golang payload, which registers with its C2 over a plaintext protocol (hostname
      OS/architecture) and supports Linux (arm, arm64, mipsle, ppc64) and Windows (386, amd64)
      builds. It exposes named flood-attack commands including "cf" (an HTTP(S) flood specifically
      tuned to bypass Cloudflare protection via randomized User-Agent lists and long keep-alive
      timeouts), "udp"/"pps", "discord"/"game" (game-server/Discord-targeted UDP floods), and three
      TLS-flood variants ("tls", "tlsplus", "tlsplusbypass"). c2c/"meow" is architecturally simpler:
      a Golang flooder with no built-in self-propagation module — a separate SSH scanner
      component handles credential brute-forcing and delivery — that authenticates to a hardcoded
      C2 with the string "ChangeMe123!" over plaintext JSON-over-TCP, checks for passwordless sudo
      (running "sudo -n true") to self-escalate, then persists by copying itself to
      /usr/local/bin/cpufreqd and registering a fake systemd unit at
      /etc/systemd/system/cpufreqd.service masquerading as a "CPU Frequency Daemon". It supports ten
      flood-module types (icmp, dnsudp, udp, http, directhttp, fasthttp, betterhttp, tcp,
      tcphandshake, dnstcp) with configurable duration and port randomization. Nozomi's stated
      point for defenders: neither family is sophisticated — both rely on commodity Golang tooling,
      weak/default credentials, and exposed Telnet/SSH management interfaces rather than novel
      exploitation — and that lack of sophistication does not reduce the risk at scale.
    region_nexus: "global; both families were caught via internet-facing honeypots with no regional targeting stated. Directly relevant to Swiss/European OT-adjacent and IoT/embedded-Linux estates that expose Telnet or SSH management interfaces to the internet — a persistent finding across ICS/OT exposure surveys for the energy, water, and transport sectors in this constituency's remit"
    primary_sector_nexus: "direct"
    sector: "energy, water, transport, telco (OT-adjacent/embedded-Linux and IoT exposure), public-sector (any exposed Linux estate)"
    cves: []
    entity_keys: []
    new_entities:
