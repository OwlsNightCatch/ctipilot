    extended_notes: |
      Recency note: Nozomi's own post is dated 2026-07-06 (~3 days before this run) — inside the
      spawn message's developing_window_hours:72 allowance, and it only entered the run's visible
      window via a rotation-priority curated source (Industrial Cyber) re-reporting it today
      (2026-07-09). No prior-coverage or registry match found for Apex2/Apex, c2c, or "meow" as
      malware names — treated as new signal, not an update.
      ATT&CK mapping: T1110 Brute Force (.001/.003) for Telnet/SSH credential attacks; T1105
      Ingress Tool Transfer for the wget/curl-style download-and-execute stage; T1498 Network
      Denial of Service (.001 Direct Network Flood) for the flood command sets; T1095 Non-Application
      Layer Protocol for the plaintext-TCP/JSON C2 channel; T1548.003 Abuse Elevation Control
      Mechanism: Sudo and Sudo Caching for the passwordless-sudo self-escalation in c2c; T1543.002
      Create or Modify System Process: Systemd Service plus T1036.005 Masquerading: Match Legitimate
      Name or Location for the fake "cpufreqd"/"CPU Frequency Daemon" persistence mechanism.
      Detection hooks: outbound plaintext TCP to non-standard ports carrying JSON, systemd units
      created outside normal package-manager/config-management workflows (auditd exec/systemd
      unit-file-write monitoring), and repeated Telnet/SSH auth failures followed immediately by a
      successful login and an outbound wget/curl within seconds. Hardening: the mitigations Nozomi
      states are unremarkable but concrete — remove Telnet/SSH exposure to the internet on IoT and
      embedded-Linux devices, eliminate default/weak credentials, and segment IoT/OT-adjacent Linux
      systems from business-critical networks with restricted outbound connectivity.
