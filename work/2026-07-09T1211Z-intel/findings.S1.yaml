items:
  - title: "CVE-2026-56291 — Balbooa Forms for Joomla: third unauthenticated file-upload RCE zero-day in the same extension class inside two weeks"
    sources:
      - { url: "https://mysites.guru/blog/balbooa-forms-unauthenticated-file-upload-flaw/", publisher: "mySites.guru", date: "2026-07-08", role: primary }
      - { url: "https://nvd.nist.gov/vuln/detail/CVE-2026-56291", publisher: "NVD/MITRE", date: "2026-07-09", role: corroborating }
      - { url: "https://www.balbooa.com/joomla-forms", publisher: "Balbooa (vendor)", date: "2026-07-09", role: corroborating }
    discovery_trace: >
      first seen at: ncsc-ch-security-hub bridge dashboard sweep (checking for continuation of the 7 July Joomla
      page-builder KEV wave) → cross-checked against ENISA EUVD "criticals" feed, URL
      https://euvd.enisa.europa.eu/ (via `tools/fetch_source.py enisa-euvd recent criticals`), which listed
      EUVD-2026-42573 / CVE-2026-56291 published 2026-07-09T09:53Z → primary: mySites.guru disclosure post, URL
      https://mysites.guru/blog/balbooa-forms-unauthenticated-file-upload-flaw/ → verified: NVD record, URL
      https://nvd.nist.gov/vuln/detail/CVE-2026-56291 (published 2026-07-09, CVSS 4.0 10.0, CWE-434) → prior-wave
      context confirmed against this store's own 2026-07-08 entry
      entries/2026-07-08/joomla-page-builder-cve-2026-48908-56290-kev-zerodays.md (CVE-2026-48908 / CVE-2026-56290,
      the first two extensions in the same class, both KEV-listed 7 July).
    summary: |
      A third unrelated Joomla third-party extension has been disclosed with the identical unauthenticated
      arbitrary-file-upload-to-RCE flaw class inside two weeks. Balbooa Forms (component `com_baforms`), a
      drag-and-drop form builder for Joomla used for contact/registration/survey forms, exposes its frontend
      attachment-upload handler (`index.php?option=com_baforms&task=form.uploadAttachmentFile`) to any anonymous
      visitor with no authentication, no CSRF token, and no allow-list check on the uploaded file's extension —
      Joomla's built-in filename sanitiser strips dangerous characters but does not block a `.php` extension, so
      an attacker-supplied `shell.php` is written as-is into the component's public upload folder
      (`images/baforms/uploads/` by default) and can then be requested directly to execute (CWE-434). No account
      of any kind is required at any point in the chain. Affected: Balbooa Forms up to and including 2.4.0;
      fixed in 2.4.1, released 9 July 2026. This was a genuine zero-day — mySites.guru was brought the flaw via a
      Hetzner hosting-abuse report and a customer's raw access log showing an already-successful exploit attempt
      before any patch existed, and the researchers state the same attacks are continuing against unpatched
      sites. No public PoC has been released; Joomla's own CNA CVSS 4.0 vector marks the threat-metric group
      `E:A` (Attacked) and `U:Red` (highest urgency). This is the third occurrence of exactly this vulnerability
      class in the Joomla third-party-extension ecosystem within roughly two weeks — following JoomShaper SP
      Page Builder (CVE-2026-48908) and Joomlack Page Builder CK (CVE-2026-56290), both added to CISA KEV on 7
      July and both covered by this pipeline on 2026-07-08 — and all three were surfaced by the same research
      outfit (mySites.guru). The pattern is now a defender action item in its own right: inventory every
      anonymous-facing upload endpoint across a Joomla estate's third-party components, not just the three named
      so far.
    region_nexus: "global; Joomla with third-party page-builder/form extensions is common on Swiss/EU municipal, SME and public-sector sites"
    primary_sector_nexus: "direct — public-sector and municipal websites are a documented Joomla-extension demographic"
    sector: "public-sector, technology"
    cves: [CVE-2026-56291]
    entity_keys: []
    new_entities:
      - key: "trend:joomla-extension-file-upload-rce-wave"
        type: trend
        name: "Joomla third-party-extension unauthenticated file-upload RCE wave"
        aliases: []
        summary: >
          Three unrelated Joomla third-party extensions — JoomShaper SP Page Builder (CVE-2026-48908),
          Joomlack Page Builder CK (CVE-2026-56290), and Balbooa Forms (CVE-2026-56291) — disclosed within
          roughly two weeks (late June–9 July 2026) with the identical unauthenticated arbitrary-file-upload-
          to-RCE flaw class (CWE-434); all three surfaced by researcher mySites.guru, the first two already
          CISA KEV-listed and exploited as zero-days, the third exploited pre-patch and discovered via a
          hosting-abuse report.
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "This was a zero-day: it was already being exploited in the wild when we found it, before any patch existed, and those attacks are still going on now against sites that have not updated."
        attribution: "mySites.guru"
        source_url: "https://mysites.guru/blog/balbooa-forms-unauthenticated-file-upload-flaw/"
      - quote: "The flaw was an unauthenticated file upload with no file-type allow-list."
        attribution: "mySites.guru"
        source_url: "https://mysites.guru/blog/balbooa-forms-unauthenticated-file-upload-flaw/"
      - quote: "That log showed a POST request to the Balbooa Forms upload handler that had no business succeeding the way it did."
        attribution: "mySites.guru"
        source_url: "https://mysites.guru/blog/balbooa-forms-unauthenticated-file-upload-flaw/"
    extended_notes: |
      MITRE ATT&CK: T1190 (Exploit Public-Facing Application) for the initial upload/execution; T1505.003 (Web
      Shell) once the uploaded .php file is used for persistence. No PR (privilege required), no UI (user
      interaction) per the CVSS 4.0 vector (AV:N/AC:L/AT:N/PR:N/UI:N).

      Detection: web-server / WAF access logs for POST requests to
      `index.php?option=com_baforms&task=form.uploadAttachmentFile` (or the equivalent upload-task endpoint for
      any other third-party Joomla component) that return HTTP 200, followed by a GET to a newly created file
      with an executable extension (.php/.phtml/.php5) under `images/baforms/uploads/` or any other
      component-specific upload directory — the same detection shape used for the two prior KEV entries in this
      wave. File-integrity monitoring on `images/*/uploads/` directories for unexpected .php files is a
      cross-extension hunt, not specific to Balbooa.

      Hardening: update Balbooa Forms to ≥2.4.1 immediately and treat every 2.4.0-or-earlier install as
      possibly-compromised (check for stray files and unexpected Joomla admin accounts — this is the same
      persistence pattern documented for CVE-2026-48908/56290). Structurally, deny PHP execution inside
      upload-only directories (images/, media/ subpaths) at the web-server level (nginx `location` block /
      Apache `.htaccess` with `php_admin_flag engine off`) regardless of vendor patch status — this closes the
      entire recurring bug class rather than one component at a time. Any organisation running Joomla should
      inventory every third-party extension offering anonymous-facing file upload (forms, galleries, page
      builders) and verify extension-based (not just MIME-sniffed) allow-list validation.
