items:
  - title: "Deutsche Bank confirms third-party incident at a German marketing/incentive-platform vendor after \"Unsafe\" ransomware group posts alleged employee database extracts"
    sources:
      - { url: "https://www.computing.co.uk/news/2026/security/deutsche-bank-probes-supplier-cyber-incident-after-ransomware-gang-claims-breach", publisher: "Computing (UK)", date: "2026-07-09", role: "primary" }
      - { url: "https://cybernews.com/security/deutsche-bank-ransomware-data-breach/", publisher: "Cybernews", date: "2026-07-07", role: "primary" }
      - { url: "https://www.cybersecurity-insiders.com/unsafe-ransomware-allegedly-targets-deutsche-bank/", publisher: "Cybersecurity Insiders", date: "2026-07-08", role: "corroborating" }
    discovery_trace: "first seen at: bleepingcomputer listing (webfetch https://www.bleepingcomputer.com/news/security/) surfaced adjacent ransomware coverage → WebSearch (\"Deutsche Bank 'unsafe' ransomware claim July 2026\") → pivot: Cybernews, URL https://cybernews.com/security/deutsche-bank-ransomware-data-breach/ (2026-07-07, updated 2026-07-08 with DB statement) → primary/freshest: Computing (UK), URL https://www.computing.co.uk/news/2026/security/deutsche-bank-probes-supplier-cyber-incident-after-ransomware-gang-claims-breach (2026-07-09T08:43Z) → corroborating: Cybersecurity Insiders, URL https://www.cybersecurity-insiders.com/unsafe-ransomware-allegedly-targets-deutsche-bank/ (2026-07-08)"
    summary: |
      The ransomware/extortion group "Unsafe" listed Deutsche Bank on its dark-web leak site and published screenshots of alleged database exports, terminal commands, and employee records (email addresses, password hashes, physical addresses) as proof of a claimed breach of the bank's "internal systems." Deutsche Bank's own statement (via spokesperson, confirmed to multiple outlets on 2026-07-08/09) says the incident is at an external, third-party service provider in Germany that operates a marketing and incentive platform for the bank's sales partners — the bank states there is "no indication" its own internal systems or networks are affected and no evidence of unauthorized access to Deutsche Bank's network. The published sample data reportedly covers employee-level records only; researchers could not determine from the samples whether customer data was included. This is the transferable lesson for any org running outsourced sales/marketing/incentive SaaS platforms that hold employee PII: vendor-side ransomware compromise can surface as an apparent breach of the client brand even when the client's own network is untouched, and exposed employee directories (email + password hashes + physical addresses) are a ready-made spear-phishing/credential-stuffing target list regardless of which party was actually compromised.
    region_nexus: "Germany / EU — Deutsche Bank is a systemically important EU financial institution; Unsafe's other reported 2026 targets include Switzerland and France"
    primary_sector_nexus: "direct"
    sector: "finance, public-sector (transferable: any org using outsourced HR/marketing SaaS)"
    cves: []
    entity_keys: []
    new_entities:
      - { key: "actor:unsafe-ransomware", type: actor, name: "Unsafe", aliases: [],
          summary: "Ransomware-as-a-service / double-extortion operator first observed December 2022, dormant through 2024-2025, resurfaced in 2026 with reported activity against organizations in Germany, Switzerland, France and the US; claimed a Deutsche Bank-linked third-party breach in July 2026 (Cybernews / Computing UK, 2026-07-07/09)." }
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "A spokesperson for Deutsche Bank said the incident did not involve the bank's own network but instead affected a third-party company in Germany that runs a marketing and incentive platform for Deutsche Bank's sales partners."
        attribution: "Computing (UK)"
        source_url: "https://www.computing.co.uk/news/2026/security/deutsche-bank-probes-supplier-cyber-incident-after-ransomware-gang-claims-breach"
      - quote: "\"We have been informed of a cybersecurity incident at an external service provider,\" the spokesperson said, adding that there was \"no indication that Deutsche Bank's internal systems or networks were or are affected\" and no evidence of unauthorised access to the bank's network."
        attribution: "Computing (UK)"
        source_url: "https://www.computing.co.uk/news/2026/security/deutsche-bank-probes-supplier-cyber-incident-after-ransomware-gang-claims-breach"
      - quote: "\"Based on the available samples, it's not possible to determine whether customer data is included in the alleged breach,\" our researchers explained."
        attribution: "Cybernews"
        source_url: "https://cybernews.com/security/deutsche-bank-ransomware-data-breach/"
    extended_notes: |
      Attribution/TTP caveat: SocRadar-sourced characterisations of "Unsafe" circulating in secondary coverage (zero-day exploitation, GrandCrab/Emotet tooling) are unverified generic group profiling, not confirmed TTPs for this specific intrusion — the actual initial-access vector into the German third-party vendor has not been disclosed by any party. Deutsche Bank was previously affected by the 2023 Cl0p/MOVEit mass-exploitation campaign and a separate 2023 LockBit-linked data-for-sale claim, underscoring a recurring third-party/vendor exposure pattern for this institution specifically.
    borderline: false

  - title: "KDDI's July update on its Japanese ISP email-platform breach names the root cause: a zero-day in unnamed third-party software the vendor itself had not yet recognized"
    sources:
      - { url: "https://www.bleepingcomputer.com/news/security/japanese-telecom-giant-kddi-says-data-breach-affects-12-million-people/", publisher: "BleepingComputer", date: "2026-07-08", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/data-breach-exposes-up-to-142-million-email-logins-at-six-isps/", publisher: "BleepingComputer", date: "2026-06-28", role: "corroborating (background)" }
    discovery_trace: "first seen at: bleepingcomputer listing, URL https://www.bleepingcomputer.com/news/security/ (webfetch, 2026-07-09) → primary: BleepingComputer article, URL https://www.bleepingcomputer.com/news/security/japanese-telecom-giant-kddi-says-data-breach-affects-12-million-people/ (jina-read for full body; cites KDDI's own 6 July newsroom notice) → background pivot: BleepingComputer's original 2026-06-28 article, URL https://www.bleepingcomputer.com/news/security/data-breach-exposes-up-to-142-million-email-logins-at-six-isps/"
    summary: |
      UPDATE (originally covered 2026-06-29 as "KDDI third-party email-platform breach exposes up to 14.22M credentials across six Japanese ISPs"). KDDI's 6 July update, reported by BleepingComputer on 8 July, discloses the confirmed root cause and exact scale: the shared email platform serving STNet, JCOM, Chubu Telecommunications, NIFTY and BIGLOBE was compromised on 16 May 2026 via a zero-day vulnerability in an (still unnamed) third-party software component — a flaw that "was not recognized by the software vendor" as of KDDI's 17 June discovery date, and which the vendor is now reporting to public authorities. KDDI confirms exact final counts of 12,233,087 exposed email addresses and 7,616,173 exposed passwords (down from the earlier "up to 14.22 million" estimate), deployed EDR post-incident, and completed a forensic audit on 23 June confirming the flaw was patched and no other issues remain. KDDI notified Japan's Personal Information Protection Commission and the Ministry of Internal Affairs and Communications. The transferable lesson: a multi-tenant email platform serving several ISPs was compromised via a genuine zero-day the vendor itself had not identified — a scenario no patch-management process alone would have caught, underscoring the value of behavioural/EDR detection on infrastructure hosting third-party software components and of rapid regulator notification once exploitation is confirmed.
    region_nexus: "Japan — no direct Swiss/EU nexus, included for the transferable telco-sector zero-day/vendor-disclosure-timeline lesson"
    primary_sector_nexus: "indirect"
    sector: "telco"
    cves: []
    entity_keys: ["incident:kddi-isp-email-platform-breach-2026"]
    new_entities: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: "update-of:2026-06-29/kddi-third-party-email-platform-breach-exposes-up-to-14-22-m"
    evidence:
      - quote: "\"As a result of our investigation, as of June 17, 2026, the date of our confirmation, this vulnerability was not recognized by the software vendor,\" KDDI said."
        attribution: "KDDI (via BleepingComputer)"
        source_url: "https://www.bleepingcomputer.com/news/security/japanese-telecom-giant-kddi-says-data-breach-affects-12-million-people/"
      - quote: "The telecom giant is now working to secure affected email accounts after attackers gained access to the email addresses of 12,233,087 people and the passwords of 7,616,173 others."
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/japanese-telecom-giant-kddi-says-data-breach-affects-12-million-people/"
    extended_notes: |
      Only a single named journalism source carries the 6-July update's specifics at this level of detail (BleepingComputer, itself citing KDDI's own newsroom PDF at https://newsroom.kddi.com/news/assets/2026/kddi_nr_s-73_4619/kddi_nr_s-73_4619_pdf_01.pdf, which is in Japanese and was not independently translated in this run) — marked SINGLE-SOURCE-OTHER since the underlying primary is a first-party corporate disclosure the sub-agent could not directly render, not a national-CERT carve-out. Neither BleepingComputer article names the exploited third-party software product; KDDI has stated only "third-party software," ambiguity intentional in the source, not omitted by this agent.
