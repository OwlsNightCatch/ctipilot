    borderline_reason: "no direct Swiss/EU nexus (Japan-based telco); included as an update on an already-tracked entity for the zero-day/vendor-disclosure-timeline lesson and because it is an update-of an existing entry, not a fresh out-of-nexus item"

  - title: "INTERPOL-coordinated Operation First Light 2026: 5,811 arrests and USD 293M intercepted across 97 countries in a four-month global social-engineering-fraud crackdown, with Europol and multiple EU/EEA states participating"
    sources:
      - { url: "https://www.interpol.int/News-and-Events/News/2026/Over-5-800-arrests-USD-293-million-intercepted-in-global-fraud-bust", publisher: "INTERPOL", date: "2026-07-09", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/police-arrests-5-800-suspects-in-global-anti-fraud-crackdown/", publisher: "BleepingComputer", date: "2026-07-09", role: "corroborating" }
    discovery_trace: "first seen at: bleepingcomputer listing, URL https://www.bleepingcomputer.com/news/security/ (webfetch, 2026-07-09) → primary: INTERPOL press release, URL https://www.interpol.int/News-and-Events/News/2026/Over-5-800-arrests-USD-293-million-intercepted-in-global-fraud-bust"
    summary: |
      INTERPOL's Operation First Light 2026 (15 January-30 April 2026), coordinated with China's Ministry of Public Security and regional bodies ASEANAPOL, GCCPOL and Europol, targeted social-engineering fraud (BEC, sextortion, romance scams, investment scams, illegal online gambling) and its money-laundering infrastructure across 97 countries. Results: 5,811 arrests, a further 15,606 suspects identified, USD 293 million in intercepted/frozen illicit assets, 142,000+ identified victims, 31,014 bank accounts blocked, and 152,808 cases analysed via INTERPOL's I-GRIP rapid-payment-intervention mechanism. Participating European/EEA states named in INTERPOL's own release include Austria, Bulgaria, Czechia, Denmark, France, Greece, Hungary, Ireland, Latvia, Lithuania, Liechtenstein, Norway, Poland, Portugal, Romania, Slovakia, Spain, Sweden and the UK. This is included for its genuinely global scale and direct Europol/EEA participation — it is a useful annual benchmark of the fraud-and-money-laundering scale defenders' own BEC/vishing/romance-scam victim reports feed into, and a reminder that rapid law-enforcement account-freeze mechanisms (I-GRIP) exist as a post-fraud remediation path worth referencing in incident-response playbooks for wire-fraud/BEC cases.
    region_nexus: "global (97 countries); direct Europol coordination and confirmed participation by Austria, Bulgaria, Czechia, Denmark, France, Greece, Hungary, Ireland, Latvia, Lithuania, Liechtenstein, Norway, Poland, Portugal, Romania, Slovakia, Spain, Sweden, UK"
    primary_sector_nexus: "indirect"
    sector: "finance, public-sector (law enforcement / financial-crime)"
