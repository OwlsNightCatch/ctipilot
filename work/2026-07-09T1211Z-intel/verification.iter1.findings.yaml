  item: "PDAG email-account compromise (2026-07-09/pdag-aargau-email-account-compromise-spam-relay)"
  url_or_quote: "Corroborating source URL: https://www.inside-it.ch/rss.xml"
  summary: "The corroborating source is a raw RSS feed index, not a specific article — it will not persist as a stable citation (the PDAG item rolls off the feed). A specific inside-it.ch article exists and matches (dated 2026-07-08, confirms the all-employee password reset): https://www.inside-it.ch/cyberangriff-auf-psychiatrische-dienste-aargau-20260708 . Replace the RSS URL with that article URL (both hosts anti-bot-403 to WebFetch/jina but the article is a real, specific page surfaced via web search), or downgrade to single-source with the flag. sourcing_note already discloses the transport failure."
