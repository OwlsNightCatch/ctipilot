- code: F13
  category: analytical-link-as-fact
  section: active-threats
  item: "Groupe 3R confirms Akira attribution and darknet publication (2026-07-09/groupe-3r-akira-forensic-confirmation-darknet-publication)"
  url_or_quote: "Action item: \"Akira has now hit the same Swiss operator twice inside twelve months with different tradecraft each time\""
  summary: "Attributes BOTH attacks on Groupe 3R to Akira. The update_of source (2026-05-10 entry, drawn from the operator's own statement) says the prior April 2025 incident 'involved different attackers and methodology' — i.e. NOT Akira. Neither July source (swisscybersecurity.net 2026-07-07, ictjournal.ch 2026-07-06, both fetched this iteration) attributes a second attack to Akira. Correct framing: the operator has been hit twice in twelve months, by different actors. Reword to 'the same operator has now been hit twice inside twelve months (by different actors/tradecraft)'."
- code: F3
  category: claim-not-supported
  section: trending-vulnerabilities
  item: "CVE-2026-56291 Balbooa Forms unauth file-upload RCE (2026-07-09/cve-2026-56291-balbooa-forms-joomla-unauth-file-upload-rce)"
  url_or_quote: "Body: \"the changelog lists these under a plain 'Fixed' heading with no security wording, so update-triage keyed on the word 'security' would leave the door open.\""
  summary: "Contradicted by the cited Balbooa changelog (fetched via bridge/jina this iteration). The 2.4.1 entry bullet reads verbatim: 'For the Upload File field, a new MIME Types option has been added to improve upload security' — the word 'security' IS present, so a triage keyed on that word would NOT miss it. The defensible point (no security-labelled heading, no CVE reference in the changelog) survives; reword to that. The literal 'no security wording' claim is false against the source."
