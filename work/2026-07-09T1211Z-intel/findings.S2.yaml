  - title: "OneConsult: hardware attestation in confidential-computing SaaS proves code provenance, not code safety — a live blind spot found in a production deployment"
    sources:
      - { url: "https://oneconsult.com/en/blog/cybersecurity/false-trust-the-invisible-security-risks-in-confidential-computing/", publisher: "OneConsult", date: "2026-07-09", role: primary }
    discovery_trace: "first seen at: oneconsult-ch, URL https://www.oneconsult.com/en/blog/ (listing, item dated 09/07/2026) → primary (no pivot needed), URL https://oneconsult.com/en/blog/cybersecurity/false-trust-the-invisible-security-risks-in-confidential-computing/"
    summary: |
      OneConsult (Swiss security-testing firm) argues that confidential-computing SaaS platforms create a specific trust illusion: TEE/TPM-based cryptographic attestation proves that the vendor's exact approved code is executing inside the enclave, but proves nothing about whether that code is itself safe or backdoor-free — an authenticated malicious build passes attestation exactly as cleanly as a benign one. The piece grounds the argument in a concrete case study: the author found an opaque dependency with an unpublished/unverifiable source hash sitting undetected in a production confidential-computing environment for six months, because the organisation had treated the initial attestation-backed deployment as a one-time trust decision rather than something requiring per-release re-verification. The author's proposed mitigation is procedural rather than a new control: mandatory security review on every release (not just initial deployment), reproducible builds, and transparent deployment lifecycles, framed as "human-in-the-loop" verification that closes the loop attestation alone cannot close.
    region_nexus: "global; author/publisher is a Swiss security-testing firm (OneConsult) — no CH/EU-specific victim or targeting claim"
    primary_sector_nexus: "indirect"
    sector: "public-sector, finance"
    cves: []
    entity_keys: []
    new_entities: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "Attestation only proved that the enclave executed the vendor's exact code – it did not prove that the code was actually secure"
        attribution: "OneConsult"
        source_url: "https://oneconsult.com/en/blog/cybersecurity/false-trust-the-invisible-security-risks-in-confidential-computing/"
      - quote: "The only way to fully leverage the security benefits of this approach is to conduct a security review for EVERY release"
        attribution: "OneConsult"
        source_url: "https://oneconsult.com/en/blog/cybersecurity/false-trust-the-invisible-security-risks-in-confidential-computing/"
      - quote: "If regular audits aren't conducted, there's no difference in terms of actual trust compared to standard SaaS"
        attribution: "OneConsult"
        source_url: "https://oneconsult.com/en/blog/cybersecurity/false-trust-the-invisible-security-risks-in-confidential-computing/"
    extended_notes: |
      No specific vendor/product was named (author kept the case study anonymised) and no CVE was assigned — this is a conceptual/methodology finding, not a disclosed vulnerability in a named product. Relevant to any public-sector or financial-sector body evaluating confidential-computing SaaS (e.g. for sovereign-cloud or sensitive-data-processing procurement) under the assumption that attestation alone satisfies a security-assurance requirement. Weakly maps to the supply-chain trust-verification gap class (T1195-adjacent) but the source does not claim an actual supply-chain compromise occurred — only that the architecture cannot distinguish one from a clean build without continuous, per-release auditing.
    priority_hint: notable
