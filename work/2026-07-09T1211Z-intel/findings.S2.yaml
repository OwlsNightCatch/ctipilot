items:
  - title: "Groupe 3R (Réseau Radiologique Romand) confirms Akira ransomware attribution and darknet publication of stolen administrative data"
    sources:
      - { url: "https://www.swisscybersecurity.net/news/2026-05-07/cyberangriff-legt-westschweizer-radiologie-netzwerk-erneut-lahm", publisher: "SwissCybersecurity.net (article updated, headline now \"Update: Westschweizer Radiologienetzwerk bestätigt Datendiebstahl nach Cyberangriff\")", date: "2026-07-07", role: primary }
      - { url: "https://www.ictjournal.ch/news/2026-07-06/donnees-volees-systemes-retablis-le-groupe-3r-fait-le-point-apres-la-cyberattaque", publisher: "ICTjournal.ch", date: "2026-07-06", role: corroborating }
    discovery_trace: "first seen at: WebSearch (\"Westschweizer Radiologienetzwerk Datendiebstahl Cyberangriff\") → pivot: SwissCybersecurity.net listing, URL https://www.swisscybersecurity.net/news → primary: SwissCybersecurity.net article, URL https://www.swisscybersecurity.net/news/2026-05-07/cyberangriff-legt-westschweizer-radiologie-netzwerk-erneut-lahm → corroboration: ICTjournal.ch, URL https://www.ictjournal.ch/news/2026-07-06/donnees-volees-systemes-retablis-le-groupe-3r-fait-le-point-apres-la-cyberattaque. Original incident (2026-04-30 attack, Akira leak-site claim 2026-05-08) already tracked as entry 2026-05-10/groupe-3r-r-seau-radiologique-romand-akira-ransomware-claims and entity incident:groupe-3r-akira-2026 — this item is the victim's forensic-confirmation update, not a re-report of the original claim."
    summary: |
      Groupe 3R (Réseau Radiologique Romand), a network of 20 medical-imaging centres across seven Romandie cantons, has now confirmed via its own forensic investigation — not merely the attacker's leak-site claim — that the 2026-04-30 ransomware attack was carried out by Akira, and that stolen corporate/administrative documents have since been published on the darknet. This closes the attribution gap left open when Akira first listed the victim on its leak site on 2026-05-08 claiming ~48 GB including employee ID documents and patient data. Groupe 3R states medical data was encrypted (denying availability) but that no publication of medical data has been observed to date, while explicitly acknowledging that whether medical data was also exfiltrated "may never be clarified with absolute certainty" — a candid admission of incomplete forensic visibility that is itself a transferable lesson. The operator refused to pay the ransom, filed a criminal complaint with cantonal police on the attack date (forwarded to the Federal Public Prosecutor on 2026-05-12), and notified the Federal Office for Cybersecurity (BACS). As of this update, all 20 centres are running on rebuilt, ISO-27001-partner infrastructure (RIS, PACS, telephony, teleradiology restored) but the referring-physician portal remains in security testing before redeployment — over two months post-incident. This is the second Akira-unrelated-to-first-incident cyberattack against the same Swiss healthcare operator inside twelve months (the April 2025 incident involved different attackers/methods per the operator).
    region_nexus: "Switzerland (Romandie: Geneva/Vaud/Valais/Fribourg/Neuchâtel/Berne) — home-region critical healthcare infrastructure"
    primary_sector_nexus: "direct"
    sector: "healthcare"
    cves: []
