      No technical root-cause detail (initial-access vector into the mailboxes, whether MFA was enforced, whether OAuth consent-grant or credential phishing was used) was disclosed by PDAG or reported by either outlet — flagged as an explicit gap rather than inferred. Loosely maps to T1586.002 (Compromise Accounts: Email Accounts) for the takeover and T1566 (Phishing) for both the initial-access vector into PDAG and the outbound abuse. Defender takeaway: a mass password reset plus account lockout is the right immediate containment, but the detection gap this incident highlights for any org with an @<domain>.ch presence in health/public administration is outbound-mail-volume anomaly detection per mailbox (a compromised legitimate mailbox sending bulk external mail is a stronger and earlier signal than waiting for external abuse reports) and DMARC/DKIM alignment monitoring to catch when a legitimate domain starts being used as the relay rather than being spoofed.
