      - quote: "Ob die Daten ebenfalls exfiltriert wurden, lasse sich unter Umständen jedoch nie mit letzter Sicherheit klären"
        attribution: "Groupe 3R, via SwissCybersecurity.net"
        source_url: "https://www.swisscybersecurity.net/news/2026-05-07/cyberangriff-legt-westschweizer-radiologie-netzwerk-erneut-lahm"
      - quote: "Eine solche Transformation lässt sich jedoch nicht kurzfristig umsetzen. Sie erfordert die sichere Migration sehr grosser Mengen medizinischer Daten"
        attribution: "Groupe 3R, via SwissCybersecurity.net"
        source_url: "https://www.swisscybersecurity.net/news/2026-05-07/cyberangriff-legt-westschweizer-radiologie-netzwerk-erneut-lahm"
    extended_notes: |
      MITRE ATT&CK: T1486 (Data Encrypted for Impact — medical data encryption disrupting availability), T1567 (Exfiltration Over Web Service — darknet publication of stolen admin data), consistent with Akira's documented playbook (T1190 Exploit Public-Facing Application / T1133 External Remote Services for edge-device initial access, per the original 2026-05-10 entry). Defender takeaway for Swiss/EU healthcare operators: (1) Akira continues targeting the same Swiss operator a second time within a year using different tradecraft each time — a single successful defence does not retire the threat model, budget for recurring hardening reviews; (2) the operator's own admission that exfiltration scope "may never be clarified with absolute certainty" underscores why egress-monitoring and object-level access logging on PACS/RIS/backup infrastructure matter more than post-hoc forensic reconstruction — by the time you need to answer "was data taken", the answer may be structurally unknowable without pre-existing telemetry; (3) full infrastructure rebuild (20 sites, ISO-27001 partners) took over two months and the physician-referral portal was still in security testing at the two-month mark, illustrating realistic healthcare-sector MTTR for a full RIS/PACS rebuild after ransomware, useful for business-continuity planning benchmarks.
    priority_hint: notable

  - title: "Psychiatrische Dienste Aargau (PDAG): phishing-driven email-account takeover used to relay spam/phishing, no patient-data compromise confirmed"
    sources:
      - { url: "https://www.swisscybersecurity.net/news/2026-07-09/psychiatrische-dienste-aargau-werden-opfer-eines-phishing-angriffs", publisher: "SwissCybersecurity.net", date: "2026-07-09", role: primary }
      - { url: "https://www.inside-it.ch/rss.xml", publisher: "Inside IT Switzerland (RSS listing)", date: "2026-07-08", role: corroborating }
    discovery_trace: "first seen at: inside-it-ch, URL https://www.inside-it.ch/rss.xml (listing item \"Cyberangriff auf Psychiatrische Dienste Aargau\", 2026-07-08T11:28:30Z; full article body 403'd both direct WebFetch and the jina-reader fallback) → pivot via WebSearch (\"Psychiatrische Dienste Aargau Cyberangriff E-Mail-Konten\") → primary: SwissCybersecurity.net, URL https://www.swisscybersecurity.net/news/2026-07-09/psychiatrische-dienste-aargau-werden-opfer-eines-phishing-angriffs"
    summary: |
      Psychiatrische Dienste Aargau AG (PDAG), a Swiss cantonal psychiatric-care provider, disclosed that unauthorised parties gained access to individual @pdag.ch email accounts and abused them to send spam/phishing messages to external recipients. PDAG locked the affected accounts immediately on discovery, reset passwords for all employees as an additional precaution, notified competent cantonal and national authorities, and engaged internal/external IT-security experts plus its external ICT service provider to analyse the incident and harden defences. According to PDAG's current assessment, the incident is limited to account misuse for outbound spam/phishing — there is no indication that patient data was accessed or exfiltrated. The organisation is warning recipients about suspicious emails ending in "pdag.ch" and advising against opening attachments or clicking links in messages purporting to come from its domain.
    region_nexus: "Switzerland (Canton Aargau) — home-region public/health-sector body"
