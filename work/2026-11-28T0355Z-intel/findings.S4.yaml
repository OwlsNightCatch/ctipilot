  - title: "pCloud (Swiss vendor): pCloud Pass password manager hit by a cyberattack, user e-mail addresses exposed and login attempts made; vault access not ruled out"
    sources:
      - { url: "https://www.bleepingcomputer.com/news/security/pcloud-confirms-password-manager-hack-after-suspicious-login-alerts/", publisher: "BleepingComputer", date: "2026-11-27", role: "primary" }
      - { url: "https://www.pcloud.com/company.html", publisher: "pCloud International AG (company page)", date: "2026-11-28", role: "context" }
    discovery_trace: "first seen at: bleepingcomputer listing https://www.bleepingcomputer.com/news/security/ → primary reachable: BleepingComputer https://www.bleepingcomputer.com/news/security/pcloud-confirms-password-manager-hack-after-suspicious-login-alerts/ (quotes pCloud's statement posted on Reddit; the Reddit thread is walled on extract and WebFetch, so the statement is read only through BleepingComputer) → WebSearch ('pCloud Pass hacked users notified new device password manager breach', extended) returned only rewrites of the BleepingComputer article, no independent report → Swiss domicile from https://www.pcloud.com/company.html"
    summary: |
      Facts (pCloud statement as quoted by BleepingComputer): "A cyberattack targeting pCloud Pass occurred, which was promptly contained by the pCloud team"; "a small number of pCloud Pass user email addresses were exposed and login attempts were made", with an automatic notification sent to each such address. pCloud says the attack was limited to the password manager, cloud storage was not affected, and stored passwords and notes stay encrypted client-side under the master password. pCloud did not say whether any encrypted vaults were accessed or stolen, did not give a root cause, and did not say it was AI-driven although its statement discusses AI speeding up vulnerability discovery.
      Reports (user observations relayed by BleepingComputer, Reddit threads not fetched): customers worldwide received "new device connected" notifications naming an unfamiliar device, including customers with two-factor authentication enabled, customers who never used the password manager and an address tied to a storage account requested deleted almost a year earlier; users trace the originating address to pCloud's own hosting range, and some who checked their account found no unfamiliar device listed. BleepingComputer reports the "Open settings" link in the notification pointed at a hostname that looks like a quality-assurance environment rather than the production site, which it confirmed from a copy of the e-mail.
      BleepingComputer's inference (its own assessment): if encrypted vaults were taken they could be attacked offline without rate limits or second factors, as in the 2022 LastPass case; BleepingComputer calls it the latest in a series of password-manager attacks this month (mSecure earlier in November, 1Password on 2026-11-25; 1Password is already in the store).
      Nexus: pCloud International AG describes itself as "a Swiss-based cloud solution". Whether Swiss public-sector staff use pCloud Pass is not stated by any source.
