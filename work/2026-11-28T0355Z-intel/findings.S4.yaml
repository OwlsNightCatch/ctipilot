      Detection and hunt concepts the sources support (telemetry class first): GitHub organisation audit log and token-use records for SAP-owned or SAP-delivered repositories a customer consumes (new personal access tokens, token use from new ASNs, force pushes, workflow edits); SAP-delivered open-source packages and build tooling pulled by customer CI (verify provenance against SAP communications once SAP states which artifacts are in scope). Post-incident check: SAP has rotated signing keys, so a customer that verifies SAP signatures should expect a key-change notice and treat an unannounced key change as a signal to verify through SAP's own channel.
