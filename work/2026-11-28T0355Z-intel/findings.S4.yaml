    discovery_trace: "first seen at: databreaches-net feed https://databreaches.net/feed/ (Reuters repost) and bleepingcomputer listing https://www.bleepingcomputer.com/news/security/ → pivot: BleepingComputer https://www.bleepingcomputer.com/news/security/us-air-force-cloud-platform-reportedly-hacked-in-latest-federal-breach/ → pivot: Reuters original https://www.reuters.com/world/hackers-breach-us-air-force-flagship-cloud-one-computing-platform-2026-11-27/ (CAPTCHA wall on every transport, not read; its content reaches us only through CyberInsider and heise) → pivot: CyberInsider https://cyberinsider.com/us-air-force-cloud-one-cyberattack/ and heise https://www.heise.de/news/Hacker-brechen-angeblich-in-Cloud-Plattform-der-US-Air-Force-ein-11541212.html → context for the wider US federal run: SecurityWeek FinCEN https://www.securityweek.com/us-treasurys-fincen-disconnects-systems-following-cyber-incident/, Nextgov https://www.nextgov.com/cybersecurity/2026/11/cia-odni-unclassified-intelligence-system-hacked/417438/, SecurityWeek (AP) https://www.securityweek.com/an-unclassified-cia-system-was-breached-in-a-cyberattack-ap-source-says/"
    summary: |
      Claims (Reuters, three anonymous sources, relayed by CyberInsider, heise and BleepingComputer; the Air Force confirmed nothing): attackers breached Cloud One, the Air Force's multi-cloud enterprise platform (AWS, Azure, Google Cloud, Oracle Cloud) that hosts Department of Defense applications for personnel and pay, logistics, maintenance, the radar-fed air-defence application CBC2 and the munitions-tracking system TICMS. The intrusion was found during an upgrade within roughly the past month. One source says the attackers exploited a software flaw to reach the control plane, the layer administrators use to manage cloud resources; Reuters could not identify the flaw or what the attackers did there. Another source says some users lost administrator privileges (the sources do not say whether the attacker or the response removed them). Back-office application migrations were put on hold and the update freeze stopped staff applying software fixes, at a time when a new batch of severe flaws had been disclosed. US Cyber Command was reportedly called in. Actor, scope and data theft are unknown; the Air Force declined to discuss the status of individual systems.
      Context, sourced separately: the same fortnight saw reported intrusions at the FBI's NCIC database (BleepingComputer, unattributed), an unclassified CIA open-source-intelligence system also affecting ODNI and NGA (NYT, relayed by Nextgov, AP, BleepingComputer; Nextgov says ARTEX "is believed to have been used" and, per two sources, ARTEX also assisted a low-impact intrusion into the Defense Department's Cyber Defense Command), and a FinCEN intrusion that FinCEN itself confirmed ("unauthorized access to a limited subset of its systems", some systems taken offline, filing relief granted on 2026-11-24). The US administration says the outages are not a coordinated attack (AP); BleepingComputer states it is unclear whether the incidents are connected, and that it is unknown whether ARTEX or other AI tooling was used against the Air Force, FBI or FinCEN. No link between Cloud One and ARTEX is reported anywhere.
      Transferable lesson (what the sources themselves support): compromise of a cloud control plane at a shared government platform freezes the patch path for every tenant, so remediation of the tenants' own exposures stalls while the incident is open. Defenders of government cloud tenancies and shared platforms can weigh this against their own change-freeze procedures.
