    summary: |
      Facts (FIFA statement to AP, dpa and others): FIFA "can confirm that it has been the victim of a criminal cyberattack resulting in unauthorised access to a limited set of personal and business information" and is working with law enforcement. FIFA has not said when the attack happened, whose data or how many people are affected, or what the business information is. FIFA is headquartered in Zurich and about 700 employees work there (The Record); Inside World Football notes that as a Zurich-based organisation it falls under the Swiss data-protection act's breach-reporting duty to the federal commissioner.
      Claims and reports from anonymous sources: a group calling itself the Handsome Boy Hacking Club (HBHC) claimed on 2026-11-20 to have taken more than 12 GB, said the files came from FIFA's Microsoft environment and internal governance systems (identity and immigration documents, executive information, financial, legal and governance records), says it tried to extort FIFA, and is reported to have published the material on a cybercrime forum; FIFA has not confirmed any HBHC claim (Infosecurity Magazine, The Record). HBHC is a new group: its first leak-site victim was listed on 2026-11-19, with US victims alongside FIFA and no verified technical profile (Infosecurity Magazine, Security Affairs; Ransomware.live flags it as an emerging group whose claims need independent verification). Sources told Reuters, The Athletic and the BBC (relayed by Al Jazeera, Inside World Football and ITPro) that the intruders gained access "by impersonating staff rather than a systems or technical failure"; ITPro calls it a suspected social-engineering attack and Reuters' source puts the affected material below 0.1 percent of FIFA's data. FIFA itself has not described the vector; the sources are anonymous.
      Assessments: Mishcon de Reya's Joe Hancock reads it as financially motivated or notoriety-driven crime and notes a countdown timer on HBHC's leak site that may indicate an unpaid ransom demand; NCC Group's Tim Rawlins says high-profile attacks increasingly come down to cyber basics and long-standing social-engineering techniques. These are commentators' assessments, not findings.
      The earlier fire (2026-11-27T0355Z) borderline-dropped FIFA as a private Swiss organisation with no access vector and anonymous sourcing for the impersonation claim; the new material in this window is HBHC background (first activity mid-November, four leak-site victims across US and Swiss organisations, claimed Microsoft-environment origin) and the BBC relay, not a new technical fact.
