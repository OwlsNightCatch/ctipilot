    discovery_trace: "first seen at: cyberinsider (feed https://cyberinsider.com/feed/, item https://cyberinsider.com/sap-github-security-incident/) and bleepingcomputer listing https://www.bleepingcomputer.com/news/security/ → pivot: BleepingComputer article https://www.bleepingcomputer.com/news/security/sap-confirms-security-incident-after-suspicious-github-activity/ → pivot: DER SPIEGEL https://www.spiegel.de/netzwelt/sap-wird-opfer-von-hackerangriff-a-6648b5ce-5d74-48dc-86ea-9469705bb91d (first report, paywalled, only the standfirst reads) → pivot: Handelsblatt https://www.handelsblatt.com/technik/ki/sap-it-sicherheitsvorfall-kunden-fordern-lueckenlose-aufklaerung/100273138.html and heise https://www.heise.de/news/IT-Vorfall-bei-SAP-Entwicklungssysteme-betroffen-11539973.html (secondary reporting that carries the response measures) → context: EFK https://www.efk.admin.ch/en/audit/dispatch-on-the-superb-and-erp-systems-v-ar-programmes-for-the-attention-of-both-finance-committees/ (Swiss federal SAP use). SAP's own wording reaches us only as a statement quoted by BleepingComputer, CyberInsider, heise (dpa) and Handelsblatt; no SAP-hosted page was found."
    summary: |
      Facts (SAP statement, quoted by several outlets): SAP says it "identified suspicious activity" and "promptly implemented the necessary measures to protect its customers", and that based on its investigation to date it has "found no evidence of unauthorized access to customer business data". SAP gave no vector, no actor, no detection date and no list of affected environments, and has not said whether source code was copied or altered or whether any release delivered to customers is affected.
      Reported by media from internal sources (claims, not SAP statements): DER SPIEGEL, citing an internal memo it saw (code name "Project Granite") and an insider, reports that the attackers breached SAP's GitHub environment, stole authentication tokens of SAP employees and used them to copy and modify source code; dpa separately reviewed part of the memo, which asked employees to check whether they must change credentials. Handelsblatt, citing company circles, says SAP detected the incident the week before, that the attack targeted software development, and that numerous teams are affected by the immediate measures. Handelsblatt (as relayed by heise and CyberInsider) reports SAP restricted access to GitHub, stopped automated development workflows and replaced signing keys. SPIEGEL's insiders say the attackers may have used AI tools; SAP's statement does not address this, so it is an unconfirmed assessment of the sources, not a finding.
      Why it matters here: the confirmed behaviour class is theft of employee GitHub tokens followed by access to, and possibly modification of, vendor source, with signing-key rotation as the vendor's containment step. The same pattern (employee GitHub account to backend or source) is already in the store for 1Password. SAP landscapes run in the Swiss federal administration (EFK: "The SAP landscape currently used in the Federal Administration will no longer be supported by the manufacturer from the end of 2025", the SUPERB / ERPSYS V/ar migration programmes), so a signing-key replacement or an advisory on SAP-delivered components is the thing SAP customers should expect to have to act on; none has been published as of this fetch.
      Unknown (absences): affected repositories, whether any customer-delivered artifact was touched, whether a customer action is required, and the actor.
