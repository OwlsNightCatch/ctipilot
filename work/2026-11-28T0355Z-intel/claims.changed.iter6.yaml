    entry: 2026-11-28/kudelski-offensive-ai-identity-lifecycle-insurer
    surface: "summary"
    kind: frontmatter
    text: "Kudelski Security's incident responders describe a one-night intrusion at an unnamed European insurer in which about three million identification requests in under nine hours identified about 30 customers, more than a dozen accounts were created in customers' names without their passwords and more than 100 documents were extracted, with no malware and no compromise of the portal's servers. Kudelski assesses with high confidence that an offensive AI framework was used, names none and publishes no indicators, and traces the chain to business-logic weaknesses: the API of a retired web interface that stayed accessible, CAPTCHA and rate limits that were not enforced or were inactive after a migration, registration paths that did not consistently enforce prior identity checks, unverified contact data that inherited verified status, incomplete token validation and an identity-provider flaw in authenticator enrollment."
