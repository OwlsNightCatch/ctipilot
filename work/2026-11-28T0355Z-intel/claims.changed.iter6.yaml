    surface: "body"
    kind: cited
    text: "Among the weaknesses it lists, mostly business logic rather than software bugs: the API of a retired web interface remained accessible, identity information could be tested at scale, CAPTCHA was not enforced by the underlying API, rate limits were inactive after an infrastructure migration, alternative registration processes that did not consistently enforce prior identity checks, unverified contact information inherited a verified status, token validation was incomplete, authorization-related information was exposed to the client, and an identity-provider vulnerability weakened authenticator enrollment ("
