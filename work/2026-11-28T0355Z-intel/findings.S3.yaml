  - title: "Hunt.io: three exposed attacker directories show a crew staging 'a Swiss tax office' domain-controller database through ntdsutil install-from-media, a malicious JDBC service provider that loads an Apollo payload, and an exploit kit for Citrix, FortiGate, Exchange, PHP and FreePBX edges"
    sources:
      - { url: "https://hunt.io/blog/open-directory-us-hospital-manufacturer-law-firms", publisher: "Hunt.io", date: "2026-11-25", role: "primary" }
    discovery_trace: "first seen at: hunt-io, URL https://hunt.io/blog (WebFetch listing, post shown as 'Nov 25, 2026'; the extract metadata date 2026-11-24 is the crawl date per the record's 2026-10-04 note) -> primary (no pivot needed): https://hunt.io/blog/open-directory-us-hospital-manufacturer-law-firms (extract, full body read). Corroboration attempted and not found: WebSearch ('Hunt.io open directory Swiss tax office ntdsutil IFM Apollo Poseidon JDBC TlsChannelFix hospital law firms') and WebSearch ('Steueramt Cyberangriff Schweiz Kanton Domain Controller Daten abgegriffen November 2026') returned no Swiss or second-source reporting."
    summary: |
      Hunt.io recovered the contents of three exposed open directories (two on one rented server, one on a separate host whose link to the first two Hunt.io deliberately leaves open) and assesses from the operators' own files that they belong to a financially motivated, Chinese-speaking, Southeast-Asia-based crew running a Russian-authored exploit and command-and-control kit; it declines to name a group and says nothing points to a state sponsor. The files include a domain-controller workflow against "a Swiss tax office": a log of ntdsutil install-from-media creation and a script that copies the Active Directory database and the SYSTEM and SECURITY registry hives from a controller share to a staging area, XOR-decodes the bytes and then requests removal of the install-from-media set. Hunt.io states complete off-host transfer is not independently confirmed, that an NTLM-relay run against an internal LDAP service belongs to the same environment, and that the Swiss material begins after code execution was already available, so how the crew first got in is not shown. Elsewhere the files hold a US hospital system's staff credential material, a US manufacturer's Azure storage container listed with a live SAS token (names listed, not downloaded) and a Bangladeshi university's exported Kerberos keys; law firms and federal agencies appear only as reconnaissance targets, which Hunt.io separates from confirmed breaches. The kit includes a class registered as a java.sql.Driver service provider and posing as Microsoft's SQL Server JDBC driver, whose boot routine runs when an application loads the JAR and either polls an HTTPS endpoint for commands passed to cmd.exe or decodes a packed file into an Apollo-derived Windows executable written under the Windows temp directory and started from Java; a Poseidon-derived Linux implant behind a Mythic-labelled server; a commercial employee-monitoring product's agent used as a command channel over authenticated SOCKS relays; and chunked exfiltration inside GET request paths. The staged exploits target remote-access and web edges (Citrix NetScaler CVE-2025-5777 and CVE-2019-19781, FreePBX CVE-2025-57819, PHP2Shell CVE-2026-109618 and CVE-2026-109619, an Exchange MRSProxy proof of concept for CVE-2026-62911, a FortiOS LDAP empty-password bypass probe for CVE-2026-22153) plus Active Directory coercion and relay tooling; Hunt.io says their presence establishes availability, not successful operation. Hunt.io notified CISA before publishing; no Swiss authority statement or second source corroborates the Swiss victim, who is unnamed.
    region_nexus: "Switzerland (an unnamed Swiss tax office's domain-controller data staged, per Hunt.io, uncorroborated); also US, Bangladesh. Crew assessed by Hunt.io as Southeast-Asia-based."
    primary_sector_nexus: "direct if the tax office is a cantonal, communal or federal body (not identified); remaining victims US healthcare, manufacturing, legal"
    sector: "public-sector"
    cves: [CVE-2025-5777, CVE-2019-19781, CVE-2025-57819, CVE-2026-109618, CVE-2026-109619, CVE-2026-62911, CVE-2026-22153]
