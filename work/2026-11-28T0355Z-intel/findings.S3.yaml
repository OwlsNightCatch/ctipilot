  - title: "Akamai: Kyverno before 1.19.2 lets a namespace-scoped policy author read other namespaces and cluster-scoped objects through a URL-parser mismatch in the apiCall path check (GHSA-pcx2-xcq4-65vf, no CVE)"
    sources:
      - { url: "https://www.akamai.com/blog/security-research/2026/nov/url-parser-differential-broke-kyvernos-namespace-isolation", publisher: "Akamai Security Intelligence Group", date: "2026-11-24", role: "primary" }
      - { url: "https://github.com/kyverno/kyverno/security/advisories/GHSA-pcx2-xcq4-65vf", publisher: "Kyverno project (GitHub security advisory)", date: "2026-10-21", role: "primary" }
    discovery_trace: "first seen at: akamai-sirt, URL https://feeds.feedburner.com/akamai/blog (feed, item dated 2026-11-24T16:00Z) -> primary: https://www.akamai.com/blog/security-research/2026/nov/url-parser-differential-broke-kyvernos-namespace-isolation (extract, full body read) -> pivot: https://github.com/kyverno/kyverno/security/advisories/GHSA-pcx2-xcq4-65vf (WebFetch: affected 'all versions', patched 1.19.2, published 2026-10-21 by the project, reporter at Akamai)."
    summary: |
      Akamai researchers and the Kyverno project's GitHub advisory describe a namespace-isolation bypass in Kyverno, the CNCF Kubernetes policy engine: a user allowed to create namespaced Kyverno Policies (a normal privilege in multi-tenant clusters) can put a foreign namespace into the query string of an apiCall urlPath, because validation cleans the path with file-path logic and extracts the namespace with a regular expression while the Kubernetes client later parses the same string as a URL and sends the request to a cluster-scoped or other-namespace endpoint with Kyverno's own high privileges. A policy written to always fail then returns the fetched data in the admission-denial message, so the attacker reads, for example, ConfigMaps in kube-system. The advisory lists all versions as affected and 1.19.2 as the fix and states it undermines the fix for the earlier CVE-2026-22039; Akamai calls it CVSS 10.0 and says its telemetry found 4% of enterprise networks running vulnerable Kyverno (the advisory page shows no vector). The advisory was published 2026-10-21 with no CVE and no workaround; Akamai's write-up followed on 2026-11-24. Neither source reports exploitation. This is a confused-deputy escalation from a tenant to cluster-wide read access, relevant only where several teams or suppliers share a cluster and tenants may author Kyverno policies.
    region_nexus: "global; relevant to Swiss federal, cantonal and supplier Kubernetes platforms that use Kyverno with tenant-authored policies"
    primary_sector_nexus: "indirect (shared-cluster platform teams; no sector-specific targeting)"
    sector: "technology"
    cves: []
    techniques: [T1068, T1552.007]
    affected_products: ["Kyverno"]
    entity_keys: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    lookback: true
    evidence:
      - quote: "The vulnerability allows a restricted tenant scoped to a single namespace to craft malicious API requests that access cluster-scoped resources or other namespaces, bypassing policy validation."
        attribution: "Akamai Security Intelligence Group"
        source_url: "https://www.akamai.com/blog/security-research/2026/nov/url-parser-differential-broke-kyvernos-namespace-isolation"
      - quote: "The flaw was patched in version 1.19.2."
        attribution: "Akamai Security Intelligence Group"
        source_url: "https://www.akamai.com/blog/security-research/2026/nov/url-parser-differential-broke-kyvernos-namespace-isolation"
      - quote: "According to Akamai’s telemetry, 4% of enterprise networks were running vulnerable instances of Kyverno."
        attribution: "Akamai Security Intelligence Group"
        source_url: "https://www.akamai.com/blog/security-research/2026/nov/url-parser-differential-broke-kyvernos-namespace-isolation"
    extended_notes: |
      Exposure check (vendor-documented): read the deployed Kyverno version (Helm chart or image tag, below 1.19.2 is affected) and check whether tenants can create namespaced Kyverno Policy objects. Hunt idea derived from the mechanism, not from a source's detection list: in Kubernetes API-server audit logs, requests made by Kyverno's service account to cluster-scoped list endpoints or to other namespaces' resources shortly after a tenant creates or triggers a policy, and namespaced policies whose apiCall urlPath contains a question mark; admission-denial messages that contain interpolated API response data are the leak channel Akamai points to. Hardening: upgrade to 1.19.2 or later, limit who may author namespaced policies that use apiCall, and avoid returning raw API data in policy messages. Prerequisite is an authenticated tenant with policy-authoring rights, which limits exposure to multi-tenant platforms; patch has been available since 2026-10-21.
    borderline: true
    borderline_reason: "authenticated multi-tenant prerequisite, no exploitation reported, no CVE, patch available since October; relevance depends on Kyverno-based shared clusters in the constituency"
