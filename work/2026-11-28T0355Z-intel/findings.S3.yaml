    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    lookback: true
    evidence:
      - quote: "A Swiss tax office (internal domain TABT, 192.168.151.x) is covered by the IFM (install-from-media) workflow."
        attribution: "Hunt.io"
        source_url: "https://hunt.io/blog/open-directory-us-hospital-manufacturer-law-firms"
      - quote: "a script copies the domain database and registry hives from a controller share to staging, XOR-decoding bytes with 0xA5, then requests IFM removal."
        attribution: "Hunt.io"
        source_url: "https://hunt.io/blog/open-directory-us-hospital-manufacturer-law-firms"
      - quote: "Complete off-host transfer is not independently confirmed."
        attribution: "Hunt.io"
        source_url: "https://hunt.io/blog/open-directory-us-hospital-manufacturer-law-firms"
      - quote: "We read this as a Chinese-speaking, Southeast Asia-based cybercrime operation running a Russian-authored toolkit."
        attribution: "Hunt.io"
        source_url: "https://hunt.io/blog/open-directory-us-hospital-manufacturer-law-firms"
    extended_notes: |
      Why it matters for the constituency: it is the only in-window public statement that an intrusion crew holds domain-controller material from a Swiss public body. The victim is identified only as "a Swiss tax office" with an internal domain label and private addressing in the report (the label is a victim-side identifier, kept out of this return's summary; the composer decides whether to carry it); no Swiss authority or other outlet corroborates, and a federal, cantonal or communal tax authority cannot be told apart from the text. Treat the Swiss victim claim as Hunt.io's reading of recovered files, not a confirmed breach: the report itself says complete transfer is unconfirmed and gives no initial-access route for that environment.

      Behavioural reading for detection (telemetry classes first; platform artifacts as anchors): (1) on a domain controller, process-creation events for ntdsutil.exe that create install-from-media output outside a domain-controller build or disaster-recovery window, followed within minutes by SMB reads of the resulting database and SYSTEM/SECURITY hive copies by a non-DC host and then deletion of the media folder; file-creation and file-audit events on the DC for an NTDS database copy; (2) NTLM-relay and coercion activity against domain controllers (LDAP signing and channel-binding enforcement are the hardening levers Hunt.io names, with SMB signing); (3) Java application servers: a JAR whose META-INF/services/java.sql.Driver names a class in the com.microsoft.sqlserver.jdbc namespace but does not match a vendor build, java.exe or javaw.exe writing an executable under the Windows temp directory and then creating a child process, and Java processes launching cmd.exe /c from a polling loop; (4) egress: HTTPS polling from application servers to bare servers on TCP 8443, and GET requests whose paths carry long base64 chunks (a proxy that logs request paths keeps both the host label and the data). Benign lookalike for the first item: legitimate install-from-media creation during domain-controller promotion or restore tests, performed by a named administrator from a known host under a change record; the discriminator in this crew's workflow is the staging to a share, the read by another host, and the removal request that follows.

      Hunt.io's hardening list (verbatim intent): inventory and lock down the remote-access edge (NetScaler, FortiGate SSL VPN, Exchange/OWA, VPN portals, SSO); enforce MFA and alert on NetScaler 4009 bursts and spray patterns; scope and rotate Azure SAS tokens and alert on bulk blob enumeration; enforce SMB signing and LDAP channel binding; review Java servers for unexpected JDBC providers.

      Caveats worth keeping: the kit's CVE list is availability, not success; CVE-2026-62911 is an authentication bypass that Microsoft and ZDI class as elevation of privilege (the store already carries it, 2026-08-29), not a standalone pre-auth RCE, whatever label the PoC file carries. The attribution is Hunt.io's assessment from language and timezone indicators ("language and timezone in code tell you who wrote and ran the code, not a nationality"), not a validated attribution. Admiralty suggestion: source B, credibility 3 for the Swiss claim (first-hand recovered files, single source, transfer unconfirmed), 2 for the crew's toolkit facts.
