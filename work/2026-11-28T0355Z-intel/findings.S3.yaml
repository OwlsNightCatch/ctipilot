  - title: "Huntback: an exposed PentAGI console shows an operator rehearsing the NetScaler CVE-2026-88771 exploit on a self-built lab and cataloguing 487 PaperCut servers, at least 138 with school or student-printing names"
    sources:
      - { url: "https://huntback.io/blog/pentagi-netscaler-lab-cve-2026-88771", publisher: "Huntback", date: "2026-11-27", role: "primary" }
    discovery_trace: "first seen at: huntback (non-slice sweep), URL https://huntback.io/blog (extract listing, newest card dated '27 Nov 2026') -> primary (no pivot needed): https://huntback.io/blog/pentagi-netscaler-lab-cve-2026-88771 (extract, full body read). Related store coverage: PaperCut entry 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce; NetScaler entry 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev; Puppet entry 2026-11-18/cve-2026-115731-puppet-enterprise-report-deserialization-rce (same operator infrastructure, updated 2026-11-27)."
    summary: |
      Huntback reports that a PentAGI (public multi-agent penetration-testing framework) console on one server was left exposed because the operator's own NetScaler lab published a throwaway Python web server from /tmp through a load balancer on a public port; from 21 November anyone could list the working directory. The files show a model stack in which every agent role is routed through a LiteLLM gateway to open-weight models labelled "uncensored", with Russian-language configuration comments, and a NetScaler 14.1-72.61 virtual appliance the operator built under QEMU/KVM on the same server and configured by typing console commands through the QEMU monitor and reading screenshots back. Huntback says the lab served as a test bench for CVE-2026-88771: scripts restart appliance services and then look for marker files named for the CVE, an older and a newer copy of the same appliance component sit side by side (the kind of pair used to see what a vendor update changed), and an out-of-band callback collector runs behind a Cloudflare quick tunnel. The second workload is a PaperCut MF census: candidate address lists on ports 9191 to 9196, fingerprinting that records edition, build number and page title, 487 confirmed servers across two runs, and at least 138 of the 377 confirmed in the first run carrying a school, college or student-printing name; Huntback ties the PaperCut flaw to CISA's KEV catalogue and a short list of Puppet Servers to the operator whose CVE-2026-115731 chain it published on 2026-11-19. Huntback links this console's address pool to the earlier one through a shared callback egress and an SMB test connection. Huntback's own checklist: apply the NetScaler fix, then look for unexpected files in /tmp and /var/tmp, emptied log files, changes to /etc/hosts or trusted certificate bundles, and API file reads from addresses other than management hosts; keep PaperCut ports 9191 and 9192 off the internet and review configuration-editor changes to external user lookup and database settings.
    region_nexus: "global; PaperCut census is school-heavy, which matters for cantonal and communal schools and administrations that run PaperCut for student and staff printing"
