  - title: "Kudelski Security: an offensive-AI-driven intrusion at a European insurer abused onboarding, identity migration and a retired API in one night, with no malware"
    sources:
      - { url: "https://kudelskisecurity.com/research/the-rise-of-offensive-ai-frameworks-when-business-logic-becomes-the-attack-surface", publisher: "Kudelski Security", date: "2026-11-27", role: "primary" }
    discovery_trace: "first seen at: standing sweep of non-slice research listings (kudelski-security record), URL https://kudelskisecurity.com/research-blog (extract listing, post dated November 27, 2026) -> primary (no pivot needed): https://kudelskisecurity.com/research/the-rise-of-offensive-ai-frameworks-when-business-logic-becomes-the-attack-surface (extract, full body read). The post compares the case with SOCRadar's BabidiGhost report, already in the store (2026-11-24/babidighost-jailbroken-ai-agent-belgium-france-switzerland). The identity-provider advisory it cites (GHSA-qqv8-37gw-ww2q) could not be resolved: github.com/advisories returned 404 and WebSearch found nothing."
    summary: |
      Kudelski Security's incident-response team, working from perimeter, application and identity-provider logs plus endpoint hunting, describes a one-night intrusion at an unnamed European insurer: about three million identification requests in under nine hours, about 30 legitimate customer identities identified, more than a dozen customer accounts created in those customers' names without their passwords, identity-verification and authentication workflows compromised, and more than one hundred documents with sensitive customer data extracted. Kudelski found no malware and no compromise of the servers hosting the customer portal; it says the attacker chained deficiencies in application lifecycle management, identity verification, customer onboarding and authentication, and that an identity-provider vulnerability (GHSA-qqv8-37gw-ww2q) was one component of a longer chain. Its stated lessons are that user-controlled information inherited verified status, that identity migration between a legacy platform and a modern provider did not preserve account activation states, that retiring a front end left its supporting APIs reachable, and that rate limiting, CAPTCHA and server-side validation may be configured without being effective. What held, per Kudelski: the network perimeter, server-side authorization (each forged account could read only its own customer's data), administrative protections and conventional injection defences. Kudelski assesses with high confidence that an offensive AI framework was used, from correlated indicators, infrastructure, attack patterns, machine-speed execution, application-specific reconnaissance and automated handling of complex identity workflows; it does not name the framework, discloses no indicators, and could not establish how much human supervision there was. It says the attack produced several detectable signals before data collection began (abnormal request volumes, extensive authentication failures, suspicious reconnaissance) and still ran through the night. It frames BabidiGhost (many organisations, shallow) and this case (one organisation, deep) as the horizontal and vertical halves of the same capability.
    region_nexus: "Europe (insurer unnamed); Kudelski Security is Swiss-headquartered; transferable to Swiss citizen and e-government portals that run identity onboarding, migration and recovery workflows"
    primary_sector_nexus: "indirect (the victim is a private insurer; the abused mechanism is identity-lifecycle business logic that public-sector portals share)"
    sector: "finance"
    cves: []
    techniques: [T1190, T1136, T1078, T1213]
    affected_products: []
    entity_keys: ["actor:babidighost"]
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "Kudelski Security assesses with high confidence that an offensive AI framework was leveraged during this intrusion."
        attribution: "Kudelski Security"
        source_url: "https://kudelskisecurity.com/research/the-rise-of-offensive-ai-frameworks-when-business-logic-becomes-the-attack-surface"
      - quote: "No malware was identified, and no compromise of the servers hosting the individual customer portal was observed."
        attribution: "Kudelski Security"
        source_url: "https://kudelskisecurity.com/research/the-rise-of-offensive-ai-frameworks-when-business-logic-becomes-the-attack-surface"
      - quote: "The identity of the specific framework and its associated indicators are not disclosed in this publication."
        attribution: "Kudelski Security"
        source_url: "https://kudelskisecurity.com/research/the-rise-of-offensive-ai-frameworks-when-business-logic-becomes-the-attack-surface"
      - quote: "The absence of malware should never be interpreted as evidence that no compromise occurred."
        attribution: "Kudelski Security"
        source_url: "https://kudelskisecurity.com/research/the-rise-of-offensive-ai-frameworks-when-business-logic-becomes-the-attack-surface"
    extended_notes: |
      Telemetry and triage reading (from the post's own list, no invention): the evidence that mattered was application, API-gateway, WAF, identity-provider, onboarding, account-recovery and document-management logs, not endpoint telemetry. Sequence to look for: a burst of identification or lookup requests against onboarding endpoints (millions in hours), then account creation for people who already hold customer records and who never reset a password, then bulk document retrieval by those new accounts. A single new account that satisfies the registration rules is legitimate-looking; the discriminator is the sequence, the volume and the identity-verification state the account was created with. Hardening named by Kudelski: never let user-supplied attributes inherit verified status; validate tokens for signature, issuer, audience and expiry; keep activation state across identity migration; decommission APIs when retiring a front end; test that rate limiting, CAPTCHA and server-side validation still work after each change; after an identity-provider compromise, remove unauthorized authenticators, sessions and tokens and verify against provider records.

      Overlap and fold guidance: the store's BabidiGhost entry (2026-11-24) already carries the SOCRadar account (an insurer's Metabase-based theft, municipal archives, MFA and allow-lists held) and the ARTEX/CyberStrikeAI entries carry agent mechanics. This is a distinct incident with first-hand logs from a Swiss-based IR team, but its novelty is the business-logic and identity-lifecycle angle, not the agent mechanics; the composer may prefer a short entry linked to the BabidiGhost entry through references[], or an update on that entry.
    borderline: true
    borderline_reason: "single vendor IR account, framework and indicators undisclosed, AI-use is an assessment; value is the identity-lifecycle lesson for e-government portals and a Swiss-based lab's first-hand telemetry, but heavy AI-agent coverage is already in the store"
