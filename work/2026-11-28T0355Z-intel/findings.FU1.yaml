chain_steps:
- step: 1
  request: GET auth_profile.php?tab=general&header=false from a client with no cookie (lab base path /cacti)
  app_behaviour: Returns HTTP 200 'User Profile (Edit)' for the anonymous visitor, sets the session cookie 'Cacti' and a CSRF token (csrfMagicToken) in the page; works only because a guest user is enabled and designated (README, RavenAI; Cacti docs).
  web_access_log: 'source-stated: nothing exotic; README: the whole chain has ''no authentication event''. Inference: a GET of auth_profile.php with no prior session and no login POST, from a client that never loaded the login page.'
  app_log: none stated
  database: none stated
  processes: none stated
  claim_ids:
  - F1
  - F1b
  - F1c
- step: 2
  request: POST auth_profile.php?tab=general&action=update_data&header=false with form fields __csrf_magic, name=preview_graphs_per_page and value=<non-integer text>
  app_behaviour: Stores the value in the settings_user table via a prepared statement with no integer validation; the HTTP response is normal.
  web_access_log: 'source-stated: a guest-session profile update. Inference (general logging behaviour, not in sources): the SQL-bearing value travels in the POST body, which default web access logs do not record, so the access-log line shows only POST ...action=update_data.'
  app_log: none stated
  database: 'source-stated: the guest user''s preview_graphs_per_page setting holds non-numeric text (Previdian: ''Investigate unexpected changes to user settings'').'
  processes: none
  claim_ids:
  - F2
  - F2b
  - F1c
- step: 3
  request: GET graph_view.php?action=preview&page=1&clear=1 (same session)
  app_behaviour: Reads the stored value as the default of the 'graphs' filter, concatenates it into the LIMIT clause passed to get_allowed_graphs() (graph_view.php:657, lib/auth.php:1574-1578); PDO runs the stacked statement; the page renders normally.
  web_access_log: 'source-stated: a graph preview request; the URL carries no payload (README: ''no exploit payload in a URL that looks like a shell'').'
  app_log: 'source-stated (README, RavenAI, watchTowr): a PHP warning about a non-numeric value in a graph display setting; the request still succeeds. Exact warning text is not quoted by any source.'
  database: 'source-stated: a poller_item row''s arg1 (and, in the PoC, host_id and action) is overwritten; RavenAI: row identifiers are lab values.'
  processes: none
  claim_ids:
  - F3
  - F3b
  - F5
  - F5b
  - F5c
- step: 4
  request: GET graph_realtime.php?action=init&local_graph_id=<id>&ds_step=10&size=90 (same session)
  app_behaviour: Calls poller_realtime.php, which calls cmd_realtime.php; exec_poll() passes poller_item.arg1 to popen(), which runs it through the shell inside the same HTTP request; response is a JSON object with a graph image. Graph id and poller item must be valid.
  web_access_log: 'source-stated: a realtime graph initialisation from the same session seconds after the preview request; no payload in the URL.'
  app_log: none stated
  database: 'the altered poller_item row remains as the evidence (watchTowr: unexpected commands in poller settings); whether it persists or is regenerated is not stated.'
  processes: 'Inference from README plus pre-fix code context in the vendor commit: web-server PHP worker -> php -q poller_realtime.php --graph --interval --poller_id (shell_exec) -> shell via popen() running the stored command. Source-stated artifact: files written by the poller/web account (the lab marker file was served back from the Cacti webroot; the demo stages a PHP shell).'
  claim_ids:
  - F4
  - F4b
  - F4c
  - F5d
