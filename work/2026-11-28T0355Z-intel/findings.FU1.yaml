  4_exploitation:
    status: SETTLED for Previdian (counts differ between two Previdian pages); no other party found
    answer: 'Previdian (honeypot vendor, tracker VULN-2026-0010, Admiralty C in sources.json): blog (published 2026-11-26; update 27 Nov): 22 SQL-injection attempts from a single source IP on 27 Nov against its real Cacti application honeypots, time-based payloads ''designed to test whether the newly disclosed vulnerability was exploitable'', successful command execution NOT confirmed, first attempts about 14 h after it added the issue to its Watch (26 Nov). Tracker page (footer ''Updated 28 Nov 2026'', fetched ~04:35 UTC 28 Nov): 216 attempts, 21 unique attacker IPs, 9 countries, 1 sensor, first observed 27 Nov, last 28 Nov, ''They do not show that the target was vulnerable or that the attempt succeeded''; payloads, paths, User-Agents and IPs are behind an Enterprise tier, so what was requested cannot be read. The tracker still also carries the earlier ''22 attempts from 1 IP'' sentence. The tracker''s ''Confirmed'' confidence refers to observed attempts, not to successful compromise. Other
      parties: watchTowr and BleepingComputer say no exploitation reported as of 27 Nov; Brandefense''s ''14 dark chat posts'' is a keyword count, not exploitation; CISA KEV (2026.11.27) has no entry (only CVE-2022-46169 for Cacti); four web searches found no GreyNoise, Shadowserver, SANS or other report. Not seen by anyone: a successful compromise, a post-exploitation observation, or an actor attribution (watchTowr: ''No attribution has been made public'').'
