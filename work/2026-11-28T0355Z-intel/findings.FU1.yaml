points:
  1_guest_account:
    status: SETTLED (requirement) / SETTLED from vendor docs (default)
    answer: 'The chain needs the guest account enabled. The researcher''s lab had it enabled; watchTowr, BleepingComputer, The Hacker News and Previdian all state it is a prerequisite. Cacti''s own User Management documentation (Cacti/documentation develop branch, footer ''Copyright (c) 2004-2026 The Cacti Group'') says guest/anonymous access is disabled by default, that the ''guest'' user is not enabled by default since 0.8.7, that a pre-created guest user exists, and that anonymous access works only when the Guest user is enabled AND set as the guest user in Authentication Settings (two settings). The researcher''s wording ''the default guest surface'' does not claim guest is enabled by default. Not settled by any source: the actual guest state of upgraded legacy installs, and whether the per-user ''modify defaults'' switch the docs call ''important for the guest account'' blocks the profile write (no source ties it to this chain; do not present it as a mitigation).'
