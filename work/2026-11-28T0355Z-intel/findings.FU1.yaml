  3_fix:
    status: 'SETTLED: no fixed release and no advisory; BUT unreleased hardening commits were merged on 2026-11-28 (new delta since the sweep)'
    answer: 'As of 2026-11-28 about 04:40 UTC: https://github.com/Cacti/cacti/releases lists v1.2.31 (published 2026-06-15T23:35:24Z) as the newest release, the tags API''s newest tag is release/1.2.31, and the security advisories listing has nothing published after 2026-07-27 and no entry for this flaw (67 published advisories by API). No fix listed on those pages as of 2026-11-28. HOWEVER the project merged source changes that cover every stage of the chain: PR #9015 on develop at 2026-11-28T01:24:05Z and PR #9014 on 1.2.x at 2026-11-28T01:28:13Z (merge commit 49fd19b5, 8 files). Per the PR text they (a) reject Guest account mutations with HTTP 403 in the profile handlers including update_data, (b) schema-validate user settings and validate preview_graphs_per_page, and clamp the graphs/page values before the SQL LIMIT clause in graph_view.php (1.2.x only; develop already had it), (c) enforce is_graph_allowed() before the realtime poller shell_exec and block Guest writes in graph_realtime.php.
      The PRs, commit messages and the maintainer review do not mention the disclosure, a researcher, a CVE or an advisory; the match to 4HTTP2ROOT is by scope only (setting name, guest writes, realtime access). The maintainer review (TheWitness, 01:28:03Z) says ''Seems hackish, but letting it go.'' The 1.2.x branch version file reads 1.2.32, which has no release. All secondary sources (watchTowr, BleepingComputer, THN, Previdian, BSI) predate these commits and say ''no fixed version''; none mentions them. So: no release and no advisory, but a public source-level fix exists on 1.2.x and develop; nobody has stated that it closes this issue.'
