  2_versions:
    status: PARTLY SETTLED (tested/affected = 1.2.31 only; everything else unknown)
    answer: 'Every source names only Cacti Core 1.2.31 as tested/affected (researcher lab, watchTowr table, BSI CSAF known_affected with CPE for 1.2.31 only, Previdian ''Confirmed Affected Version'', The Hacker News). Earlier 1.2.x: BleepingComputer ''unclear whether earlier versions are also vulnerable''; RavenAI ''does not establish whether other versions, guest configurations, or database settings are exploitable''; Previdian ''full affected version range has not yet been established''. No secondary source mentions the 1.3 branch. Repository evidence only: the develop branch (version file 1.3.0.-1) already carried bounded page-size/column validators from commit ae54a2a55 (2026-08-17, after the 1.2.31 release of 2026-06-15), and the develop companion PR says it leaves lib/html_graph.php untouched for that reason. That is a contributor statement about develop code, not a Cacti statement that 1.3 is unaffected, and develop has no release.'
