  6_mitigations:
    status: SETTLED (who says what); the vendor has given none
    answer: 'watchTowr, BleepingComputer, The Hacker News and Previdian all give: disable the guest account; restrict the web interface to trusted networks. watchTowr/BC/THN add: review poller entries for unexpected command values; watchTowr/BC add: watch application logs for non-numeric display-setting warnings. Previdian adds: remove the designated Guest User in Authentication Settings and disable the guest account under Console > Configuration > Users, verify an unauthenticated session no longer reaches protected functions, run Cacti web and poller processes without root, and rotate stored device credentials if compromise is suspected; it calls guest-disable ''an interim mitigation, not a fix''. RavenAI gives code-level fixes (integer validation on write and read, bound LIMIT values, restrict guest profile writes, authorize and monitor poller_item.arg1). Brandefense restates watchTowr as an ordering (entry condition, reachability, evidence). Cacti (the vendor) gives no interim mitigation
      or advisory; its only public action is the unreleased source change in point 3.'
