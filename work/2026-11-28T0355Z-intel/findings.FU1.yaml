contradictions:
- 'NAME: 4HTTP2ROOT (watchTowr, RavenAI, Previdian, BSI-cited sources, the README title ''Four Requests to Root'') vs 4HTTP2SHELL (current README body; the repo commit 7b0bb86d of 2026-11-27T02:29:28Z ''Rename 4HTTP2ROOT to 4HTTP2SHELL in README''; BleepingComputer ''previously 4HTTP2ROOT''; THN lists both). Same issue; key both names.'
- 'EXPLOITATION: watchTowr and BleepingComputer, ''no exploitation in the wild reported'' as of 27 Nov, vs Previdian honeypot attempts from 27 Nov. Scopes differ (reports of in-the-wild victims vs attempts at one vendor''s honeypots) and watchTowr''s FAQ is a live page (''updated as details emerge''); not a hard conflict, but an entry must not say ''no exploitation'' without the Previdian observation or ''exploited'' without ''attempts at honeypots, success unconfirmed''.'
- 'PREVIDIAN NUMBERS: blog 22 attempts / one source IP (27 Nov) vs the same vendor''s tracker 216 attempts / 21 IPs / 9 countries / 1 sensor (updated 28 Nov), while the tracker page body still repeats the 22/1-IP sentence. The S2 draft (findings.S2.yaml item 3) carries only the stale 22/one-IP figure.'
- 'PREVIDIAN CVSS: blog ''Official CVSS score unavailable'' vs tracker ''CVSS 9.8 Critical'' (labelled AI-generated, ''cvss_estimated: false'' in the sample API). A vendor-computed estimate, not an official score; BSI says only ''kritisch''; no CVSS from Cacti, watchTowr, NVD or CISA.'
- 'PATCH STATUS: five sources dated 26-27 Nov say no fix, and the Cacti releases/advisories pages show none, vs the unreleased fix commits merged to 1.2.x and develop on 2026-11-28 (01:24-01:28Z) that none of those sources could have seen. Both statements hold: no release/advisory, but a public source fix exists. Previdian''s tracker also says ''Patch immediately'' while stating no patch has been identified.'
- 'GUEST DEFAULT: the researcher''s ''default guest surface'' (README) vs Cacti documentation ''By default, Guest or Anonymous access is disabled in Cacti.'' The README does not say guest is on by default; it says ''The guest account was enabled'' in the lab.'
- 'BSI vs LABS: BSI''s summary says a ''remote, anonymous attacker'' without the guest-account precondition that watchTowr, BC, THN, Previdian and the researcher state.'
- 'PREVIDIAN TIMING: blog header ''Last Updated: 26 November 2026'' while its Updates list a 27 November entry; tracker ''Previdian Sensors First 2026-11-27 11:59 UTC'' vs timeline ''Observed by Previdian sensors 08:48 UTC'' (undated) vs blog ''approximately 14 hours'' after the 26 Nov 18:43 UTC watchlist entry (about 08:43 UTC 27 Nov). Treat the first-observation time as ''on 27 Nov''.'
- 'PUBLICATION TIME: GitHub tree-page metadata date 2026-11-25 and BSI''s 2026-11-26T23:00Z release vs the README date ''Nov. 26, 2026''; the commit history shows uploads at 2026-11-26T01:34:40Z and 17:19:42Z (the first upload is the earliest public trace; which upload held the PoC script is not established because the script and transcript were deliberately not read). Previdian''s timeline lists ''Public PoC available'' at 19:44 UTC, which lags the 17:19Z upload.'
- 'SWEEP DRAFTS vs BODIES: S1 item 1 is consistent with the bodies except that it predates the fix-commit finding (it read the Cacti releases/advisories pages by WebFetch and found no release, which remains true). S2 item 3 states the Previdian figure as 22 attempts from one IP (stale vs the tracker), calls the item ''Previdian sees probing'' (correct), and proposes a different entity key (trend:4http2root-cacti-guest-sqli-rce) from S1''s (tool:4http2root + product:cacti); registry has no Cacti or 4HTTP2 record.'
caveats_for_composer:
- 'The fix-commit scope match is the reader''s inference from the PR text (vendor-side wording names preview_graphs_per_page-class settings, Guest writes, realtime graph access); do not write ''Cacti fixed 4HTTP2ROOT''. Safe wording: ''Cacti merged unreleased hardening commits on 2026-11-28 that touch the code paths the write-up uses; the project has published no release, advisory or statement linking them to the disclosure''.'
- Previdian is a commercial honeypot vendor (sources.json reliability C); its tracker is live-updated and labelled AI-generated, so counts will keep moving; cite the fetch time (2026-11-28 ~04:35 UTC).
- 'RavenAI, Brandefense and (largely) BleepingComputer/THN restate the researcher and watchTowr; the independent first-hand observations are: the researcher''s lab test, Previdian''s lab verification of the PoC, Previdian''s honeypot counts, BSI''s classification (itself a restatement of watchTowr/Previdian per its references) and the Cacti repository facts.'
- 'Technique mapping supported by the sources: T1190 (public-facing web application, unauthenticated), T1059 (command execution through popen/shell; T1059.004 Unix Shell is the mechanical mapping on Linux but no source names a sub-technique), T1505.003 only for the demo''s staged PHP shell (RavenAI), not the core chain; T1078.001 (Default Accounts) is arguable for the guest session but no source frames it so.'
not_readable:
- 'docs.cacti.net/User-Management.md (the page THN links): HTTP 403 ''I''m a teapot'' via the reader fallback; the same documentation source was read from github.com/Cacti/documentation (blob page via extract, raw via url).'
- 'ek0ms savi0r''s Instagram post (BleepingComputer''s source for ''not reported to Cacti before release''): not fetched (social, login-walled); the statement rests on BleepingComputer''s relay alone.'
- 'Researcher''s PoC shell script, demo transcript, final-db-state dump and mp4 video in the same GitHub directory: deliberately not read or kept (exploit artifacts not needed for an awareness entry; the README and four secondary write-ups carry the full request sequence). The two I had already downloaded were deleted from bodies/FU1.'
- 'Previdian Enterprise-tier detail (request targets, User-Agents, payloads, IPs, WAF rules): paywalled; only counts are visible.'
- 'BSI portal page (wid.cert-bund.de/portal/...): Angular shell with no text; the CSAF JSON and the RSS item carry the content.'
- github.com/Cacti/cacti/security/advisories HTML (extract) returned only the first page of 10 items; the complete 67-record list came from the GitHub API. Draft/private advisories are invisible by design.
- 'Not checked: cacti.net news pages and forums.cacti.net (no routine fetch path; GitHub is the project''s release channel). Cacti''s published release notes are only the GitHub release text.'
- Jina reader pool is exhausted (HTTP 402 on every key); two API reads and the two version-file reads fell through it and still returned content; everything else used direct transports (extract/url/bsi-csaf/cisa-kev). WebFetch was not needed.
