  answers:
    incident_facts_exactly_as_stated: 'No date, country, insurer name or identity-provider product is given: only "a European insurance company" and "in a single night". Numbers from the executive summary and the "attack in numbers" table are in the claim rows tier=facts: approximately 2.9 million identification requests (executive summary: "approximately three million requests in less than nine hours"), peak 717 requests per second, main identification campaign about 8.5 hours, approximately 30 valid customer identities identified, more than 143,000 one-time-code attempts, approximately 210 injection payloads, 881 GraphQL reconnaissance requests from 881 source IP addresses, more than a dozen fraudulently created accounts, more than 100 customer documents downloaded, passkey registration code consumption approximately 200 milliseconds. Accounts were created "in the names of legitimate customers without possessing their original passwords". Log basis: perimeter, application and identity-provider
      logs plus endpoint threat hunting and threat intelligence correlation.'
    chain_steps:
      what_the_post_gives: The post does NOT give an ordered chain. It gives nine "business assumption | security weakness identified" pairs (claim rows tier=chain), the sentence "The compromise did not result from a single weakness", the numbers table and the detection list.
      pairs_in_post_order:
      - retired web interface -> underlying API remained accessible
      - static customer information as identity assurance -> identity information could be tested at scale
      - CAPTCHA -> protection not enforced by the underlying API
      - rate limiting -> rate limits inactive following an infrastructure migration
      - onboarding preserves earlier verification -> alternative registration processes did not consistently enforce prior identity checks
      - identity migration preserves trusted account information -> unverified contact information inherited a verified status
      - authentication tokens -> token validation incomplete
      - browser-side restrictions -> authorization-related information exposed to the client
      - MFA guarantees account integrity -> an identity-provider vulnerability weakened authenticator enrollment
      inferred_order_NOT_STATED_BY_SOURCE: Reconnaissance (GraphQL requests from many addresses; source-map access appears only in the detection list) -> mass identification against a retired or unprotected API (CAPTCHA and rate limits ineffective) -> one-time-code attempts -> account creation through registration paths that did not re-run identity checks and contact data that migrated as verified -> machine-speed passkey registration and authenticator enrollment weakened by the identity-provider flaw -> bulk document download by the new accounts. This ordering is the analyst reading of the table and the detection list, not Kudelski text; if carried, label it as such or omit it.
    what_held: Network perimeter; server-side authorization (each created account could retrieve only its own customer identity data); administrative protections; conventional injection attempts (claim rows tier=held). No malware and no compromise of the servers hosting the customer portal.
    detection_signals_present: 'Kudelski: multiple detectable signals well before data collection (abnormal application request volumes, extensive authentication failures, suspicious reconnaissance activity), and "the attack progressed throughout the night"; application and identity telemetry gave "significantly more relevant evidence of the attack than traditional endpoint indicators". Its ten recommended detection opportunities and seven telemetry sources are in the claim rows tier=detection.'
    lessons_and_hardening_list: Nine section-9 hardening items verbatim in claim rows tier=hardening, plus the eight business-assumption lessons in tier=chain; the post carries no ATT&CK ids and no indicators.
    ai_attribution_wording: 'High-confidence assessment (Kudelski Security) that an offensive AI framework was leveraged, based on convergence of correlated indicators, infrastructure characteristics, previously documented attack patterns, machine-speed execution, application-specific reconnaissance, automated handling of complex identity workflows, exploration of multiple security boundaries and chaining of weaknesses; explicitly not based on speed or volume alone; framework not named, indicators not disclosed, degree of human supervision not established; comparative table: BabidiGhost AI involvement "Documented through recovered AI interaction records" versus this case "Assessed with high confidence through IoC and behavioral correlation"; direct threat-actor association "Not established" in both cases. The AI attribution is an inference whose evidence is withheld; attribute it to Kudelski.'
    babidighost_comparison_sentence: 'Verbatim block in claim row tier=babidighost: "However, the targeting and exploitation approaches differ. BabidiGhost demonstrated the ability of an AI agent to conduct offensive operations across multiple organizations. Our investigation demonstrates the intensive exploration of a single organization''s interconnected application and identity ecosystem." The post then defines horizontal scalability (BabidiGhost, many organisations) and vertical scalability (this case, one organisation). The post cites SOCRadar Research "BabidiGhost: An AI-Augmented Cybercrime Operation", November 2026 (https://socradar.io/blog/babidighost-ai-augmented-cybercrime/, the same URL the store BabidiGhost entry cites).'
    ghsa_resolution:
      what_the_post_says: 'Only: "An additional identity-provider vulnerability, identified as GHSA-qqv8-37gw-ww2q, contributed to the compromise. However, this technical vulnerability was only one component of a broader chain of weaknesses." and, in the table, "An identity-provider vulnerability weakened authenticator enrollment". The post does not name the product or vendor.'
      resolution: 'The GHSA id resolves to a ZITADEL advisory: "Missing second-factor check on authenticator enrollment in Login V2 (MFA bypass)", repository zitadel/zitadel, published 2026-11-18T20:48:24Z, severity High (CVSS 3.1 base 8.1, vector AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N), no known CVE, CWE-287, affected package/software ZITADEL, affected versions >= 4.0.0, <= 4.20.4, patched version 4.20.5, Login V1 not affected, no configuration workaround (Force MFA and disallowing passkeys do not mitigate). Prerequisite: attacker already holds the first factor (password, or sign-in at a linked external identity provider). Impact: add an attacker-controlled authenticator (passkey or another second factor) without verifying the account''s enrolled second factor; the attacker passkey survives a password change and yields an ID token whose amr claim contains mfa. Credit includes InfoGuard Labs. A sibling advisory GHSA-45f2-5q3r-xgg6 (Critical, published 2026-07-29, affected 4.0.0 to 4.16.1 and
        3.0.0 to 3.4.13, fixed 4.16.2 / 3.4.14) covers enrollment from a session with no verified factor.'
      how_found: 'github.com/advisories/GHSA-qqv8-37gw-ww2q returned 404 on extract, on WebFetch and in a raw fetch; api.osv.dev returned not found; the GitHub REST path is blocked in this sandbox (proxy); WebSearch for the id returned nothing. The id was then probed against repository-scoped advisory URLs of candidate identity providers via the bridge: keycloak/keycloak and goauthentik/authentik returned 404, zitadel/zitadel returned the advisory carrying exactly this id (ory/kratos and authelia/authelia were refused by the proxy on a curl probe and not retried). The page url and title carry the exact id, so the identification of the advisory is certain; that Kudelski''s customer ran ZITADEL is an inference from the id match plus the matching description (not stated by Kudelski).'
      caveat: The advisory prerequisite (attacker holds a verified first factor) is not explained by the post; how the first factor was satisfied in the incident is not stated. The post gives no incident date, so whether exploitation preceded the 2026-11-18 advisory publication is unknown.
      evidence_for_entry: Quote the ZITADEL facts only from the advisory page (claims under item B-GHSA), attributed to the ZITADEL project; keep the Kudelski-to-ZITADEL link labelled as an identifier match.
  contradictions:
  - The markdown extract of the Kudelski post (findings.S3 source) silently drops all eight embedded tables, including the numbers table (2.9 million, 717 per second, 8.5 hours, 143,000 one-time-code attempts, 881 GraphQL requests, 200 ms passkey timing), the nine assumption-versus-weakness pairs and the ten detection opportunities. Any evidence quote taken from a table verifies only against the raw HTML (saved as B_kudelski_tables.txt and B_kudelski_fulltext.txt), not against the extract.
  - The extract metadata title for the Kudelski URL shows a neighbouring post ("Sandboxing AI Coding Agents ..."); the H1 and URL are the offensive-AI post (already noted by S3).
  - Executive summary says "approximately three million requests in less than nine hours"; the table says approximately 2.9 million identification requests over approximately 8.5 hours; section 6 says "approximately three million identification requests within a single night". Consistent rounding; use the table values with the "approximately" qualifiers.
  - findings.S3 says the post lessons include "user-controlled information inherited verified status"; the post states this as an incident weakness only inside the table ("Unverified contact information inherited a verified status") and as a prescription in section 9. Supported, but the prose-only extract would not show the incident-specific statement.
  - findings.S3 says the GHSA "could not be resolved"; it resolves (repository-scoped URL, see ghsa_resolution).
  - The post says the IdP flaw "contributed to the compromise" yet the advisory requires an attacker who already holds the first factor; the post does not reconcile the two.
  - BabidiGhost figures that appear in the post (9 days, 1,801 operator instructions, 5,779 model requests, more than 50 organisations and datasets, 14 analysed, 2 confirmed breaches, 3 partial compromises, approximately 10 GB) are Kudelski relaying SOCRadar; the store BabidiGhost entry is the place for them.
  not_readable:
  - The post carries no images, charts or iframes in the article body (verified in raw HTML); everything is text plus eight HTML tables, all read.
  - 'The incident date, insurer identity, country, framework identity, indicators and number of customer identities taken over are not in the post (searched: no hit for a date of the incident, no product name; the word ZITADEL does not appear in the post).'
  - SOCRadar report (cited reference) was not re-fetched in this follow-up; the store BabidiGhost entry already carries it.
  classification_suggestion: Source B (the discovering IR team, first-hand logs); credibility 2 for the incident facts (single source, victim unnamed), 3 for the offensive-AI attribution (assessment with withheld indicators).
