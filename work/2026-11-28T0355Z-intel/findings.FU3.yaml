  answers:
    swiss_tax_office_statements:
      summary: Hunt.io says very little about the Swiss victim; everything it says is in the claim rows tagged tier=swiss (key-findings bullet, one short section, one table row, one sentence in the initial-access section, two ATT&CK rows). There is no Swiss-specific figure or screenshot (the raw page has no image or figure element between the Swiss heading and the next heading).
      what_the_files_show_per_hunt_io:
      - a log that reports ntdsutil install-from-media creation for the environment
      - a script that copies the domain database and registry hives from a controller share to staging, XOR-decoding the bytes, then requests removal of the install-from-media set
      - 'recorded byte counts for the staging step: a database, a SYSTEM hive and a SECURITY hive (values in the claim row)'
      - printer files and an NTLM-relay run against an internal LDAP service that Hunt.io says belong to the same environment
      - 'Hunt.io status label for the entity in its victim table: "Domain DB and hives staged" (the Bangladeshi university is labelled "Breached")'
      what_hunt_io_says_is_not_confirmed:
      - 'complete off-host transfer: "not independently confirmed"'
      - 'initial access: "the Swiss output begins after execution is available. Neither explains how access was first obtained."'
      who_or_level_of_government: 'NOT STATED. The text says only "a Swiss tax office". No canton, commune, federal body, organisation name, sector label beyond tax office, or authority is named (grep for canton, communal, federal tax, ESTV, NCSC, BACS, GovCERT, Steuer and major Swiss city names returns zero hits in the page). Hunt.io gives an internal AD domain label and a private /24 only (both redacted here, not-for-entry). Hunt.io does not say how it concluded the victim is Swiss or a tax office. Analyst note (mine, not Hunt.io): Swiss tax authorities exist at federal, cantonal and communal level, so the text cannot place the victim in a government tier.'
      notification: Hunt.io says it notified CISA and shared an advance copy before publishing, "for coordination with the affected victims". No Swiss body (NCSC/BACS, GovCERT, a canton, the victim) is mentioned anywhere; no statement that the Swiss victim was or was not notified.
      dates: 'No date is attached to the Swiss material. Report-wide dates concern other artefacts: a launcher event on 14 October (15:58:57 CEST), an operator rules file approved 2026-10-25, open-directory warnings on 6 October, 25 October and 5 November 2026 for one host and 4 November for another, a Mythic-titled page observed 27 October 2026, further staging services observed 5 to 10 November, a Poseidon build kill date in October 2027. Publication date is 2026-11-25 (page time element and blog listing).'
      analyst_observation_not_from_source: The recorded database size is exactly 2^25 bytes (33,554,432) and the SECURITY hive size exactly 2^16 (65,536). Hunt.io draws no conclusion from this; treat as arithmetic only, not a finding, and do not carry it into an entry.
    ntdsutil_ifm_workflow_as_described:
      steps_stated:
      - 1. A log reports ntdsutil install-from-media creation (domain database plus hives are the install-from-media payload).
      - 2. A script copies the domain database and registry hives from a controller share to a staging location.
      - 3. The script XOR-decodes the bytes (single-byte key) on the way.
      - 4. The script then requests removal of the install-from-media set.
      not_stated: 'Hunt.io gives no command line, no executing account, no host role beyond "controller share", no timestamps, no SMB/protocol detail, no statement of where staging is or whether the data left the network, and no link between the XOR-decoded staging and any of the HTTP exfiltration code. Its own ATT&CK mapping places the IFM output under OS Credential Dumping: NTDS (T1003.003) and the share staging under Data from Network Shared Drive (T1039) (claim rows).'
    jdbc_service_provider_loader: 'A generator writes a class that implements java.sql.Driver and a META-INF/services/java.sql.Driver descriptor naming it in the Microsoft JDBC namespace; static initializer and constructor both invoke a boot routine; connect() returns null, acceptsURL() and jdbcCompliant() return false (a facade); a once-only AtomicBoolean guard. Two variants share the provider identity: an HTTPS beacon variant (30 s initial delay, polls an HTTPS endpoint on TCP 8443 every 25 to 35 s, passes nonempty responses to cmd.exe /c, posts output back, bodies XOR 0x5A + base64, TLS certificate and hostname validation disabled JVM-wide by the class) and a launcher variant (reads a packed file, XOR-decodes it, writes an executable under the Java temp directory, starts it with ProcessBuilder; a saved log records this on 14 October at 15:58:57 CEST with a 2,109,952-byte executable under the Windows TEMP directory). Hunt.io: loading the JAR starts the routine "in a compatible application
      environment"; no scheduled task is needed for repeat execution; the recorded launcher event is not evidence that the HTTPS variant completed a polling cycle. Server side: GET handler consumes a shared command file, no application-level client credential. Evidence rows: tier=jdbc.'
    apollo_poseidon_mythic: 'Apollo: the decoded launcher payload is a managed .NET executable (obfuscated entry point, 101 type definitions, 854 methods, 17 embedded assemblies) whose component names match upstream Apollo; Hunt.io says high confidence of Apollo derivation, runtime C2 configuration unresolved, not executed in review. Poseidon: a 64-bit Linux ELF whose Go build info names the upstream Poseidon agent module (Go 1.25.1), carries an HTTP profile (443, 3600 s interval, 20 jitter, post URI "data", kill date 2027-10-21; callback host omitted here); Hunt.io: "strong artifact-level evidence of a Poseidon-derived build", not shown to have run on a victim, values describe a build not observed traffic. Mythic: the Poseidon config domain is also mapped by a hosts-file generator to a destination whose port 7443 served a page titled Mythic (observed several times including 27 October 2026), with certificate reuse across 443 and 7443; the operator rules file routes victim traffic via proxychains
      to a Mythic SOCKS listener on TCP 7002; Hunt.io: the capture "does not show an authenticated Mythic session". Evidence rows: tier=apollo, tier=poseidon.'
    employee_monitoring_agent_c2: 'Collection B holds custom clients for a commercial employee-monitoring product (Net Monitor for Employees Professional), connecting to agents on TCP 4495, in collection B through an authenticated SOCKS5 relay; length-prefixed frames, SHA-256 of a passphrase as AES key, AES-CBC challenge; client A authenticates with AES but sends commands in plaintext, client B supports both modes. Hunt.io: "a bought product with custom clients wrapped around it, not a framework the crew wrote", agent port alone not an indicator, no product vulnerability established. Hunt.io hedges the C2 role: its ATT&CK row says "with command evidence" but the body says framing logic is "not evidence that a frame was authenticated, decrypted, or followed by command execution", and sessions are incomplete. Five packet captures (51,049 records); monitoring store counts (501 web-log, 842 application-log, 20 user-log, 414 keylog rows). Evidence rows: tier=c2.'
    exfiltration_in_url_path: 'The "recon transfer stage" base64-encodes local output, makes it URL-safe and splits it into chunks sent inside GET request paths to the operator server HTTP listener; Hunt.io notes a proxy or web server that keeps request paths may preserve both host label and data. The server access log has 540 request records from 195 distinct client addresses; the loop has no retry or integrity check, so completeness cannot be established. Hunt.io does NOT connect this channel to the Swiss data, to the IFM staging, or to any named victim, and its ATT&CK row says "full delivery not confirmed". Evidence rows: tier=exfil.'
    exploit_list_and_hunt_io_wording: 'Hunt.io lists exploit CVEs "actually present in the files": Citrix NetScaler CVE-2025-5777 (table label CitrixBleed 2) and CVE-2019-19781; FreePBX CVE-2025-57819; php2shell CVE-2026-109618 and CVE-2026-109619; Active Directory and relay CVE-2021-42278, CVE-2021-36942 (PetitPotam), CVE-2017-8563, CVE-2020-1472 (Zerologon); a FortiOS LDAP empty-password bypass probe CVE-2026-22153 plus a FortiGate credential login check; further scripts for an Exchange MRSProxy pre-auth RCE CVE-2026-62911, TightVNC CVE-2024-42049 and an LFI driver CVE-2026-87902. Hunt.io removed CVE-2025-6543, CVE-2023-27997 and CVE-2021-1675 from an earlier draft because they are not in the files. Wording on presence: "Their presence establishes availability, not successful operation against any named target." Also: "The referenced complete exploit is outside the preserved tree" and "no successful database disclosure, command execution, or validated CVE assignment follows from that source
      alone"; "The files show substantially more post-access activity than original entry." Hunt.io links none of these exploits to the Swiss environment. Evidence rows: tier=exploits.'
    attribution_wording: 'Assessment from indicators in the files, not a validated attribution: no named group, nothing pointing to a state sponsor; a "financially motivated, Chinese-speaking crew operating in the UTC+7 band, using a toolkit that is not its own"; Chinese comments and resource names dominate the operators own scripts, Russian sits inside the shared exploit and password-cracking utilities; a host-health script sets UTC+7 and buckets Thailand and Vietnam office hours; core business reads as gambling and spam with enterprise intrusion as opportunistic expansion; final reading "a Chinese-speaking, Southeast Asia-based cybercrime operation running a Russian-authored toolkit"; caution that language and timezone "tell you who wrote and ran the code, not a nationality or a flag". The independent technical validation it cites deliberately assigned no nationality or location. Evidence rows: tier=attribution.'
    detection_and_hardening_sections: Seven bullets returned verbatim in the claim rows tier=detection (remote-access edge inventory and management-interface exposure; MFA and NetScaler 4009 burst alerting; Azure SAS scoping and bulk-blob alerting; NTLM relay and coercion watch with SMB signing and LDAP channel binding; review of Java servers for unexpected JDBC providers; hunt for a created local admin account, temp-directory launcher pattern and callback connections; block network indicators after confirming ownership). The ATT&CK table (Hunt.io) and the IOC appendix are not reproduced (indicators).
    other_victim_classes_context_only:
    - 'a large US hospital system (staff credential material, a recorded VPN session; Hunt.io: not a proven domain login or patient-data loss)'
    - a US manufacturer (Azure container listed with a live SAS token, names listed not downloaded; hash candidates generated)
    - 'a Bangladeshi university (large Kerberos-key export, hands-on lateral movement; Hunt.io: not a one-click DC dump)'
    - about 54 US and international paediatric institutions (a 153-record credential list judged reused from a third-party breach compilation)
    - about 563 US law firms enumerated at the remote-access edge, one singled out and attacked without success
    - 'US federal agencies and other US organisations as probe targets only (Hunt.io: "targeting, not access")'
    - REDCap research servers and university medical subdomains as probe targets
    - 'the crews own AI coding tooling and an index of victim-host AI credential files (Hunt.io: no AI action tied to an exploitation step)'
  contradictions:
  - 'Hunt.io intro: "Organizations with confirmed compromise or data access are generalized to sector", yet the Swiss victim appears with an internal AD domain label and private subnet; the label is a victim-side identifier (kept out of this file; not-for-entry).'
  - 'Tension inside Hunt.io: the narrative says "two foreign domains dumped" while the Swiss section says "Complete off-host transfer is not independently confirmed" and the Bangladeshi section says "not a one-click DC dump". The Swiss status label in the table is "Domain DB and hives staged", not "Breached". Use the hedged wording.'
  - Hunt.io victim table row for the US manufacturer carries a university name from the Bangladeshi case inside its first cell (an editing artefact); do not carry any name from that row.
  - 'findings.S3 evidence quote 1 (the Swiss identification sentence) contains an internal AD domain label and a private subnet: not-for-entry. The redacted version is in the claim table. The other three S3 Hunt.io evidence quotes and all four S3 Kudelski quotes were checked and are verbatim in the saved bodies.'
  - findings.S3 techniques list contains T1110.004 (credential stuffing). In Hunt.io that technique belongs to the failed attack on a US law firm, not to the Swiss environment; Hunt.io maps the Swiss IFM step to T1003.003 and the share staging to T1039 (and uses T1110.002 for hash-candidate generation).
  - findings.S3 cves list omits CVE-2024-42049, CVE-2026-87902 and the four Active Directory CVEs Hunt.io lists (CVE-2021-42278, CVE-2021-36942, CVE-2017-8563, CVE-2020-1472).
  - findings.S3 summary says the employee-monitoring agent was "used as a command channel"; Hunt.io states this only through the ATT&CK row ("with command evidence") and hedges it in the body (frames not shown to be authenticated or followed by command execution). The chunked URL-path exfiltration is the recon-transfer stage and is not tied to the Swiss data.
  - findings.S3 summary says law firms appear "only as reconnaissance targets"; Hunt.io says one firm moved into hands-on attack (credential stuffing, an exploit script, SQL injection, service probing) with every captured result a failure.
  - 'Publication date: extract metadata says 2026-11-24 (crawl); the page itself says Nov 25, 2026 (time element 2026-11-25T00:00:00Z) and the blog listing agrees; use 2026-11-25.'
  - The saved extract carries the whole article twice (the page ships duplicate desktop and mobile copies); not a contradiction, but counts such as grep hits double.
  not_readable:
  - Hunt.io figure images (code and console screenshots, host-profile screenshots) were not viewed; all captions that are in the page text were read. Captions of Figures 20, 21, 22, 24 and 26 (host-profile and certificate-pivot screenshots, none Swiss) are missing from the markdown extract but present in the tag-stripped raw page; the Swiss section has no figure.
  - The Hunt.io IOC appendix (hashes, addresses, domains, certificate fingerprints) was read but is deliberately not returned.
  - 'No second source on the Swiss victim: no Swiss authority or press statement was found by this follow-up (S3 searched in German; this follow-up did not repeat that search).'
