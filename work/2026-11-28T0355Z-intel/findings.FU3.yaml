  - claim: Startup guard semantics
    source_url: https://hunt.io/blog/open-directory-us-hospital-manufacturer-law-firms
    body_file: bodies/FU3/A_hunt.md
    verbatim_passage: An AtomicBoolean guard limits startup to the first successful compare-and-set in that loaded class, set before initialization completes, so an exception can leave startup incomplete without a retry. The guard is not a machine-wide lock and does not coordinate separate JVMs or classloader copies.
