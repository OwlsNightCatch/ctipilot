  claims:
  - claim: Advisory title
    source_url: https://github.com/zitadel/zitadel/security/advisories/GHSA-qqv8-37gw-ww2q
    body_file: bodies/FU3/G_rawtext.txt
    verbatim_passage: Missing second-factor check on authenticator enrollment in Login V2 (MFA bypass) · Advisory · zitadel/zitadel · GitHub
    verified_grepF: true
    grepF_count: 1
    tier: ghsa
  - claim: Summary of the flaw
    source_url: https://github.com/zitadel/zitadel/security/advisories/GHSA-qqv8-37gw-ww2q
    body_file: bodies/FU3/G_rawtext.txt
    verbatim_passage: ZITADEL’s hosted Login V2 UI allowed an attacker who knows a user’s first factor — typically the password — to add a new authenticator to that user’s account without completing the second factor the user had already enrolled. A newly registered passkey satisfies multi-factor authentication on its own, so the attacker could then sign in with it and was never asked for the victim’s TOTP, OTP-SMS, OTP-Email or U2F factor.
    verified_grepF: true
    grepF_count: 1
    tier: ghsa
  - claim: Root cause
    source_url: https://github.com/zitadel/zitadel/security/advisories/GHSA-qqv8-37gw-ww2q
    body_file: bodies/FU3/G_rawtext.txt
    verbatim_passage: Login V2 accepted authenticator enrollment as soon as the session had a verified first factor, without checking whether the second factor already enrolled on the account had been verified in that session.
    verified_grepF: true
    grepF_count: 1
    tier: ghsa
  - claim: Direct URL access to the setup pages; Force MFA and disallowing passkeys do not prevent it
    source_url: https://github.com/zitadel/zitadel/security/advisories/GHSA-qqv8-37gw-ww2q
    body_file: bodies/FU3/G_rawtext.txt
    verbatim_passage: The setup pages could be opened directly by their URL (for example /ui/v2/login/passkey/set) while the login was waiting for the second factor. Neither Force MFA nor disallowing passkeys in the login policy prevented this.
    verified_grepF: true
    grepF_count: 1
    tier: ghsa
  - claim: 'Prerequisite: attacker must already hold the first factor; Login V1 not affected'
    source_url: https://github.com/zitadel/zitadel/security/advisories/GHSA-qqv8-37gw-ww2q
    body_file: bodies/FU3/G_rawtext.txt
    verbatim_passage: 'The attacker must already hold the user’s first factor; the issue does not reveal or bypass the password itself. Users without an enrolled second factor are not additionally exposed, as their first factor alone already grants access. Login V1 is not affected: it only allows enrolling a second factor on its MFA setup step, which is never offered to a user who already has one.'
    verified_grepF: true
    grepF_count: 1
    tier: ghsa
  - claim: 'Persistence property: attacker passkey survives a password change'
    source_url: https://github.com/zitadel/zitadel/security/advisories/GHSA-qqv8-37gw-ww2q
    body_file: bodies/FU3/G_rawtext.txt
    verbatim_passage: Keep access after the password has been changed, for example through an attacker-controlled passkey, which needs neither the password nor the victim’s second factor.
    verified_grepF: true
    grepF_count: 1
    tier: ghsa
  - claim: amr claim
    source_url: https://github.com/zitadel/zitadel/security/advisories/GHSA-qqv8-37gw-ww2q
