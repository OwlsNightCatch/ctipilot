claims:
  - {claim_id: 407ac140ca, verdict: ok, source_url: "https://watchtowr.com/intelligence/4http2root-cacti-zero-day-faq/", passage: "Cacti has not published a fixed version ... disable the guest account ... Not yet available"}
  - {claim_id: 96cb041f72, verdict: ok, source_url: "https://github.com/Cacti/cacti/pull/9014", passage: "reject Guest account mutations across profile and realtime endpoints ... Enforce is_graph_allowed() before realtime poller execution; Merged Nov 28, 2026"}
  - {claim_id: 5e895d5742, verdict: ok, source_url: "https://github.com/ekomsSavior/Sad-Girls-0day-Club/tree/main/4http2shell", passage: "ek0ms savi0r ... Nov. 26, 2026 ... path from a fresh, unauthenticated HTTP session to command execution ... in four requests"}
  - {claim_id: bb04dc2737, verdict: ok, source_url: "https://www.bleepingcomputer.com/news/security/unpatched-cacti-zero-day-with-public-poc-gives-remote-code-execution/", passage: "said that the vulnerability was not reported to Cacti before being released"}
  - {claim_id: ee28f3ae81, verdict: ok, source_url: "https://ravenai.sh/blog/four-requests-to-shell-cacti", passage: "often a low privileged web user rather than root (watchTowr); stacked UPDATE against poller_item; popen() via graph_realtime.php"}
  - {claim_id: 17392e7445, verdict: ok, source_url: "https://github.com/Cacti/documentation/blob/develop/User-Management.md", passage: "By default, Guest or Anonymous access is disabled in Cacti ... The Guest user must be enabled and be set as the guest user for anonymous access to work."}
  - {claim_id: 40aec16052, verdict: ok, source_url: "https://www.bleepingcomputer.com/news/security/unpatched-cacti-zero-day-with-public-poc-gives-remote-code-execution/", passage: "tested the exploit against Cacti Core 1.2.31, but it is unclear whether earlier versions are also vulnerable"}
  - {claim_id: 9a835ee942, verdict: ok, source_url: "https://watchtowr.com/intelligence/4http2root-cacti-zero-day-faq/", passage: "It stores credentials such as SNMP strings and device logins ... central point of trust"}
  - {claim_id: 03416230f3, verdict: ok, source_url: "https://blog.previdian.com/cacti-zero-day-what-we-know-so-far/", passage: "As of November 27, 2026, no exploitation in the wild has been reported (watchTowr); Previdian: Successful remote command execution has not been confirmed; tracker: do not show that the target was vulnerable or that the attempt succeeded"}
  - {claim_id: 387b4601e4, verdict: F3, source_url: "https://wid.cert-bund.de/.well-known/csaf/white/2026/wid-sec-w-2026-4845.json", passage: "CSAF carries aggregate_severity 'kritisch' and one known_affected product but no remediation or 'unpatched' marker; '[UNGEPATCHT]' appears only in BSI's RSS item title"}
  - {claim_id: d5b6a78606, verdict: ok, source_url: "https://github.com/Cacti/cacti/pull/9014", passage: "harden user settings validation, Guest writes, and realtime graph access; Merged; releases page newest v1.2.31"}
  - {claim_id: 25478d01c4, verdict: ok, source_url: "https://ravenai.sh/blog/four-requests-to-shell-cacti", passage: "a guest profile update, a graph preview, and a realtime graph initialization ... nonnumeric PHP warning, a change to poller_item.arg1, and any newly written shell"}
  - {claim_id: 3e5c95c6d9, verdict: ok, source_url: "https://ravenai.sh/blog/four-requests-to-shell-cacti", passage: "The first request is ordinary guest behavior ... The observable trail is correspondingly mundane ... stronger investigation pivots than the HTTP status codes"}
  - {claim_id: 2bc8ad6a2d, verdict: ok, source_url: "https://watchtowr.com/intelligence/4http2root-cacti-zero-day-faq/", passage: "Disable the guest account ... to remove the chain's entry point"}
  - {claim_id: 557370a360, verdict: ok, source_url: "https://watchtowr.com/intelligence/4http2root-cacti-zero-day-faq/", passage: "The guest account must be enabled ... tested the chain against Cacti Core version 1.2.31"}
  - {claim_id: a47f30dd6f, verdict: ok, source_url: "https://watchtowr.com/intelligence/4http2root-cacti-zero-day-faq/", passage: "Cacti ... stores credentials such as SNMP strings and device logins"}
  - {claim_id: f74aa1646b, verdict: ok, source_url: "https://freeradius.org/security/", passage: "### Use-after-free in TTLS - Severity: Critical ... The TTLS module is enabled in the default configuration."}
  - {claim_id: d24077fd0a, verdict: F4, source_url: "https://freeradius.org/security/", passage: "Ada Logics validated the issue, wrote a proof of concept and the report (two High EAP-FAST issues); summary says 'the project states no proof of concept or exploitation'"}
  - {claim_id: bdbb035ac6, verdict: ok, source_url: "https://freeradius.org/security/", passage: "We have released 3.0.29 and 3.2.11 to fix various overflows and memory leaks. We recommend that everyone using earlier versions ... upgrade"}
  - {claim_id: 797d9dd7e4, verdict: ok, source_url: "https://freeradius.org/security/", passage: "counted on page: 1 Critical, 8 High, 5 Medium, 7 Low = 21 issues, commits per branch"}
  - {claim_id: 792dde9273, verdict: ok, source_url: "https://freeradius.org/security/", passage: "An unauthenticated user could start an EAP-TTLS session, then send invalid 'inner-tunnel' data ... With heap shaping ... Code execution may be possible."}
  - {claim_id: a2f88e92ce, verdict: F4, source_url: "https://freeradius.org/security/", passage: "Credit: ... Ada Logics validated the issue, wrote a proof of concept and the report (Incorrect use of randomness in EAP-FAST; Possible stack overflow in EAP-FAST)"}
  - {claim_id: 461c0753e4, verdict: ok, source_url: "https://freeradius.org/security/", passage: "TEAP Medium issues return Access-Accept: Basic-Password skipped; Crypto-Binding check missing in production builds; unexpected Crypto-Binding TLV; commits on v3.2.x only; TEAP is not enabled in the default configuration"}
  - {claim_id: 652935e62b, verdict: ok, source_url: "https://www.cert.cyber.gouv.fr/avis/CERTFR-2026-AVI-1632/", passage: "Certaines d'entre elles permettent ... exécution de code arbitraire à distance, un déni de service à distance et une atteinte à la confidentialité des données; première version 27 novembre 2026"}
  - {claim_id: 2a2494ac4c, verdict: ok, source_url: "https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-124536", passage: "EAP-FAST session ticket stack overflow, Nov 12 2026, CVSS:3.1 7.5 A:H; EUVD-2026-124535 EAP-SIM identity stack overflow, same date and score"}
  - {claim_id: c7ae539233, verdict: ok, source_url: "https://freeradius.org/security/", passage: "EAP-TLS, TTLS, and PEAP are enabled in the default configuration; DHCP/EAP-FAST/EAP-SIM/TEAP not enabled in default (note: Critical flaw is TTLS-specific, entry line groups TLS/TTLS/PEAP)"}
  - {claim_id: ec98aa709b, verdict: ok, source_url: "https://freeradius.org/security/", passage: "We recommend keeping your RADIUS server on a management VLAN, and not exposed to the Internet."}
  - {claim_id: 16a391ca3d, verdict: ok, source_url: "https://github.com/FreeRADIUS/freeradius-server/releases/tag/release_3_0_29", passage: "once again this is planned to be the last release of FreeRADIUS 3.0. Everyone should migrate to 3.2.11 or later."}
  - {claim_id: 5d7328d581, verdict: F5, source_url: "https://freeradius.org/security/", passage: "DHCP/EAP-FAST/EAP-SIM/TEAP sections each say not enabled in the default configuration; DHCP High: Unauthenticated out-of-bounds write in the DHCP option encoder (sentence itself carries no inline link)"}
  - {claim_id: 62f7c1d914, verdict: ok, source_url: "https://freeradius.org/security/", passage: "derived detection from described crash/Access-Accept mechanisms; page publishes no indicator"}
  - {claim_id: 112dafba3a, verdict: ok, source_url: "https://freeradius.org/security/", passage: "derived advice; heap-corruption mechanism per project text"}
  - {claim_id: 60631dcf6b, verdict: ok, source_url: "https://freeradius.org/security/", passage: "The TTLS module is enabled in the default configuration; no exploitation statement for the TTLS issue"}
  - {claim_id: 6a56f27aaf, verdict: ok, source_url: "https://help.realvnc.com/hc/en-us/articles/40824627217949-Security-Advisory-UDP-based-connection-vulnerability", passage: "execute code as root on certain platforms ... Severity Critical, CVSS 9.8 ... Fixed in RealVNC Server 7.19.1"}
  - {claim_id: 182e5a9a4d, verdict: ok, source_url: "https://help.realvnc.com/hc/en-us/articles/40824627217949-Security-Advisory-UDP-based-connection-vulnerability", passage: "Published 20 November 2026; TCP-only direct connections are not exposed; not aware of any active exploitation; ENISA datePublished Nov 27, 2026"}
  - {claim_id: b0183724a2, verdict: ok, source_url: "https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-137042", passage: "baseScore 9.8 CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H; affected/fixed lists match advisory table"}
  - {claim_id: 097076ff05, verdict: ok, source_url: "https://help.realvnc.com/hc/en-us/articles/40824627217949-Security-Advisory-UDP-based-connection-vulnerability", passage: "It could potentially be exploited to execute code remotely or cause the software to crash, pre-authentication. ... remotely execute code as root on certain platforms"}
  - {claim_id: 13dc8b5428, verdict: ok, source_url: "https://help.realvnc.com/hc/en-us/articles/40824627217949-Security-Advisory-UDP-based-connection-vulnerability", passage: "This affects all customers using our cloud-hosted connectivity and manually configured direct connections (including offline licensed/on-premises deployments). TCP-only direct connections are not exposed."}
  - {claim_id: 424d092fe5, verdict: F3, source_url: "https://www.heise.de/news/RealVNC-Sicherheitsleck-ermoeglicht-Schadcode-Schmuggel-ohne-Anmeldung-11540429.html", passage: "heise (dated 2026-11-27) links CVE-2026-137738 but says nothing on when the CVE record or ENISA entry appeared; ENISA datePublished Nov 27, 2026 5:52 AM and cveawg datePublished 2026-11-27T05:52:17Z carry that"}
  - {claim_id: e8559209ca, verdict: ok, source_url: "https://help.realvnc.com/hc/en-us/articles/40824627217949-Security-Advisory-UDP-based-connection-vulnerability", passage: "Affected/Fixed in tables: Server 6.4.0 to 7.19.0 ... Server 7.19.1; iOS Server 2.8.2; Android Server 2.8.4"}
  - {claim_id: 72dee59c6e, verdict: ok, source_url: "https://help.realvnc.com/hc/en-us/articles/40824627217949-Security-Advisory-UDP-based-connection-vulnerability", passage: "Update to the latest versions ... Advise end users to delete any copies of older versions that they previously downloaded."}
  - {claim_id: 0af72c0848, verdict: ok, source_url: "https://www.heise.de/news/RealVNC-Sicherheitsleck-ermoeglicht-Schadcode-Schmuggel-ohne-Anmeldung-11540429.html", passage: "Aktive Angriffe sind laut Hersteller bislang nicht bekannt."}
  - {claim_id: 89ce2ee572, verdict: ok, source_url: "https://help.realvnc.com/hc/en-us/articles/40824627217949-Security-Advisory-UDP-based-connection-vulnerability", passage: "TCP-only direct connections are not exposed."}
  - {claim_id: 1532eb44dc, verdict: ok, source_url: "https://help.realvnc.com/hc/en-us/articles/40824627217949-Security-Advisory-UDP-based-connection-vulnerability", passage: "advisory text has no UDP port and no statement of which platforms run as root ('certain platforms')"}
  - {claim_id: 72125023de, verdict: ok, source_url: "https://help.realvnc.com/hc/en-us/articles/40824627217949-Security-Advisory-UDP-based-connection-vulnerability", passage: "derived detection from pre-auth memory-safety mechanism; advisory publishes no indicator"}
