  - {claim_id: cd267c4d36, verdict: ok, source_url: "https://hunt.io/blog/open-directory-us-hospital-manufacturer-law-firms", passage: "a Swiss tax office's domain database and hives staged off an internal share ... Complete off-host transfer is not independently confirmed."}
  - {claim_id: 988898fcb5, verdict: ok, source_url: "https://hunt.io/blog/open-directory-us-hospital-manufacturer-law-firms", passage: "A Swiss tax office ... covered by the IFM (install-from-media) workflow. A log reports ntdsutil install-from-media creation; a script copies the domain database and registry hives ... requests IFM removal."}
  - {claim_id: 9b47a8e32b, verdict: ok, source_url: "https://hunt.io/blog/open-directory-us-hospital-manufacturer-law-firms", passage: "XOR-decoding bytes with 0xA5, then requests IFM removal; page dated Nov 25, 2026 (time element)"}
  - {claim_id: 6beac87742, verdict: ok, source_url: "https://hunt.io/blog/open-directory-us-hospital-manufacturer-law-firms", passage: "This environment is also where ... an NTLM-relay run (ntlmrelayx against ldap://...) belong. ... the Swiss output begins after execution is available. Neither explains how access was first obtained."}
  - {claim_id: fdea27d8ac, verdict: F5, source_url: "https://hunt.io/blog/open-directory-us-hospital-manufacturer-law-firms", passage: "Disclosure: We notified CISA and shared an advance copy before publishing ... (page names no canton/commune/federal body; 'no Swiss authority has commented' is not on the page, rests on the run's own searches)"}
  - {claim_id: c1fdd4da85, verdict: ok, source_url: "https://hunt.io/blog/open-directory-us-hospital-manufacturer-law-firms", passage: "class implements java.sql.Driver ... It does not require a separate scheduled task ... polls an HTTPS endpoint on TCP 8443 ... passes a nonempty response to cmd.exe /c ... writes an executable under the Java temporary directory"}
  - {claim_id: 4062c37add, verdict: ok, source_url: "https://hunt.io/blog/open-directory-us-hospital-manufacturer-law-firms", passage: "strong artifact-level evidence of a Poseidon-derived build. It does not establish that the file ran on an external victim; recon output base64-encoded ... chunks sent inside GET request paths"}
  - {claim_id: 1edb9fcf75, verdict: ok, source_url: "https://hunt.io/blog/open-directory-us-hospital-manufacturer-law-firms", passage: "Citrix NetScaler: CVE-2025-5777, CVE-2019-19781; FreePBX: CVE-2025-57819; php2shell: CVE-2026-109618, CVE-2026-109619 ... Their presence establishes availability, not successful operation against any named target."}
  - {claim_id: 1f1a0bdf69, verdict: ok, source_url: "https://hunt.io/blog/open-directory-us-hospital-manufacturer-law-firms", passage: "We read this as a Chinese-speaking, Southeast Asia-based cybercrime operation running a Russian-authored toolkit. ... We are not tying this to a named group, and nothing here points to a state sponsor"}
  - {claim_id: 820d539561, verdict: F3, source_url: "https://hunt.io/blog/open-directory-us-hospital-manufacturer-law-firms", passage: "Simpson Thacher & Bartlett | US | Attacked, no success | Credential-stuffing, Citrix CVE-2019-19781, SQLi, SMTP relay test ... (entry says law firms are 'reconnaissance targets only'); page does not say the Swiss office is the only public body"}
  - {claim_id: d07a059f07, verdict: ok, source_url: "https://hunt.io/blog/open-directory-us-hospital-manufacturer-law-firms", passage: "derived detection from described IFM workflow, NTLM relay, TlsChannelFix provider, ProcessBuilder temp exe, 8443 polling, chunked base64 in GET paths"}
  - {claim_id: d9964d1338, verdict: ok, source_url: "https://hunt.io/blog/open-directory-us-hospital-manufacturer-law-firms", passage: "Watch for NTLM relay and coercion activity (PetitPotam, Responder, mitm6). Enforce SMB signing and LDAP channel binding."}
  - {claim_id: 32fca8601a, verdict: ok, source_url: "https://www.bleepingcomputer.com/news/security/sap-confirms-security-incident-after-suspicious-github-activity/", passage: "cyberattack it tracks under the code name 'Project Granite' ... steal authentication tokens ... we have found no evidence of unauthorized access to customer business data"}
  - {claim_id: fdc7e0c2dc, verdict: F4, source_url: "https://www.securityweek.com/sap-confirms-cyberattack-source-code-reportedly-compromised/", passage: "No listed source says SAP told Reuters (Reuters page is a CAPTCHA wall, not in sources[]); SecurityWeek says 'SAP told SecurityWeek'. Also attributes the containment steps directly to 'Handelsblatt's company circles' although the readable Handelsblatt text lacks them (heise relay only)"}
  - {claim_id: 9b91fe8fe0, verdict: ok, source_url: "https://www.tagesschau.de/wirtschaft/unternehmen/sap-hacker-angriff-100.html", passage: "Welcher Art die Aktivitäten waren, wann sie entdeckt wurden und welche Bereiche betroffen sind, ließ SAP offen."}
  - {claim_id: 450c706df7, verdict: ok, source_url: "https://www.tagesschau.de/wirtschaft/unternehmen/sap-hacker-angriff-100.html", passage: "innerhalb unserer Plattform für Entwicklerproduktivität und Softwarebereitstellung GitHub ... aufgefordert, zu überprüfen ... Zugangsdaten ändern müssen"}
  - {claim_id: 62db3e64bf, verdict: ok, source_url: "https://www.handelsblatt.com/technik/ki/sap-it-sicherheitsvorfall-kunden-fordern-lueckenlose-aufklaerung/100273138.html", passage: "stellte der Dax-Konzern den Vorfall in der vergangenen Woche fest. Attackiert wurde die Softwareentwicklung."}
  - {claim_id: 91b7f5d4a2, verdict: ok, source_url: "https://www.heise.de/news/IT-Vorfall-bei-SAP-Entwicklungssysteme-betroffen-11539973.html", passage: "Handelsblatt berichtet unter Berufung auf Konzernkreise, SAP habe den Zugriff auf GitHub eingeschränkt, automatisierte Abläufe ... gestoppt und Signaturschlüssel ausgetauscht; BC: 'Insider sources say that the attacker managed to steal authentication tokens'"}
  - {claim_id: 66c9fb99c2, verdict: ok, source_url: "https://www.securityweek.com/sap-confirms-cyberattack-source-code-reportedly-compromised/", passage: "None of the reports indicate that tampered code was incorporated into software delivered to SAP customers.; WiWo: Ob Kunden aktiv werden müssen, ließ SAP bisher offen."}
  - {claim_id: 8014ef906a, verdict: ok, source_url: "https://www.efk.admin.ch/en/audit/dti-key-project-superb-finance-project/", passage: "The SAP R/3 currently used in the Federal Administration will be supported only until the end of 2027, and it is therefore being replaced with SAP S/4HANA; Inside IT raw HTML: bestehende S/4Hana-Landschaft der kantonalen Verwaltung"}
  - {claim_id: ccd8f5c355, verdict: ok, source_url: "https://www.securityweek.com/sap-confirms-cyberattack-source-code-reportedly-compromised/", passage: "None of the reports indicate that tampered code was incorporated into software delivered to SAP customers."}
  - {claim_id: a9a969359a, verdict: ok, source_url: "https://www.bleepingcomputer.com/news/security/sap-confirms-security-incident-after-suspicious-github-activity/", passage: "SAP did not specify ... whether customers downloading code from its GitHub repositories ... should take any action. ... a spokesperson declined to share any further information."}
  - {claim_id: 0bfdf71415, verdict: ok, source_url: "https://1password.com/blog/update-on-nov-2026-security-incident", passage: "November 25, 2026 ... an attacker gained access to an employee's corporate GitHub account"}
  - {claim_id: 3c3a1591b0, verdict: ok, source_url: "https://www.bleepingcomputer.com/news/security/sap-confirms-security-incident-after-suspicious-github-activity/", passage: "derived detection from reported token theft against GitHub; no indicator published"}
  - {claim_id: d53c3d29b3, verdict: ok, source_url: "https://kudelskisecurity.com/research/the-rise-of-offensive-ai-frameworks-when-business-logic-becomes-the-attack-surface", passage: "Kudelski Security assesses with high confidence that an offensive AI framework was leveraged during this intrusion. ... No malware was identified"}
  - {claim_id: 0b0bf854e2, verdict: F4, source_url: "https://kudelskisecurity.com/research/the-rise-of-offensive-ai-frameworks-when-business-logic-becomes-the-attack-surface", passage: "'account activation states' appears only in a recommendation: 'Identity migrations must preserve existing account activation states and security guarantees.'; the weakness table row is 'Identity migration preserves trusted account information -> Unverified contact information inherited a verified status'"}
  - {claim_id: 12ce129da7, verdict: ok, source_url: "https://kudelskisecurity.com/research/the-rise-of-offensive-ai-frameworks-when-business-logic-becomes-the-attack-surface", passage: "Generated approximately three million requests in less than nine hours. Identified approximately 30 legitimate customer identities. Fraudulently created more than a dozen customer accounts ... Extracted more than one hundred documents"}
  - {claim_id: c998f846a4, verdict: ok, source_url: "https://kudelskisecurity.com/research/the-rise-of-offensive-ai-frameworks-when-business-logic-becomes-the-attack-surface", passage: "The compromised accounts could retrieve only information associated with their respective customer identities."}
  - {claim_id: 646f8bab34, verdict: F3, source_url: "https://kudelskisecurity.com/research/the-rise-of-offensive-ai-frameworks-when-business-logic-becomes-the-attack-surface", passage: "The degree of human supervision throughout the operation could not be established. (basis list on page starts with 'Correlated indicators of compromise. Infrastructure characteristics. Previously documented attack patterns.', which the entry omits)"}
  - {claim_id: 21d9a81614, verdict: F4, source_url: "https://kudelskisecurity.com/research/the-rise-of-offensive-ai-frameworks-when-business-logic-becomes-the-attack-surface", passage: "Weakness table lists: retired web interface/API accessible; identity info testable at scale; CAPTCHA not enforced by API; rate limits inactive; alternative registration; unverified contact info inherited verified status; token validation incomplete; authorization info exposed to client; IdP flaw weakened authenticator enrollment. No row says migration lost activation state (only a Section 9 recommendation)"}
  - {claim_id: 4ddcfb8bde, verdict: ok, source_url: "https://github.com/zitadel/zitadel/security/advisories/GHSA-qqv8-37gw-ww2q", passage: "Missing second-factor check on authenticator enrollment in Login V2 (MFA bypass) ... Affected >= 4.0.0, <= 4.20.4 Patched versions 4.20.5"}
  - {claim_id: 8fb5368f71, verdict: ok, source_url: "https://kudelskisecurity.com/research/the-rise-of-offensive-ai-frameworks-when-business-logic-becomes-the-attack-surface", passage: "BabidiGhost demonstrated the ability of an AI agent to conduct offensive operations across multiple organizations. Our investigation demonstrates the intensive exploration of a single organization's interconnected application and identity ecosystem."}
  - {claim_id: 839257a8c5, verdict: ok, source_url: "https://kudelskisecurity.com/research/the-rise-of-offensive-ai-frameworks-when-business-logic-becomes-the-attack-surface", passage: "The observed attack had generated multiple detectable signals well before the data collection phase. These included abnormal application request volumes, extensive authentication failures and suspicious reconnaissance activity. Yet the attack progressed throughout the night."}
  - {claim_id: e5c1121151, verdict: ok, source_url: "https://kudelskisecurity.com/research/the-rise-of-offensive-ai-frameworks-when-business-logic-becomes-the-attack-surface", passage: "A newly created account may satisfy the application's registration requirements ... the sequence of events leading to these outcomes may reveal malicious activity."}
  - {claim_id: 5483a13fdc, verdict: ok, source_url: "https://kudelskisecurity.com/research/the-rise-of-offensive-ai-frameworks-when-business-logic-becomes-the-attack-surface", passage: "post names no public-sector victim; onboarding, migration and account recovery workflows"}
  - {claim_id: 8723451ba9, verdict: ok, source_url: "https://kudelskisecurity.com/research/the-rise-of-offensive-ai-frameworks-when-business-logic-becomes-the-attack-surface", passage: "Abnormal identification request volumes; Newly created accounts accessing sensitive information; Unusual bulk document downloads; Abnormal sequences across onboarding and recovery workflows"}
  - {claim_id: b369c1ad5a, verdict: ok, source_url: "https://kudelskisecurity.com/research/the-rise-of-offensive-ai-frameworks-when-business-logic-becomes-the-attack-surface", passage: "User-controlled information must never automatically inherit verified status; ensure retiring a front-end includes decommissioning its supporting APIs; test rate limiting, CAPTCHA ... following application or infrastructure changes; ZITADEL fixed 4.20.5"}
  - {claim_id: 38c0028984, verdict: ok, source_url: "https://www.srf.ch/news/schweiz/fuenf-bestaetigte-faelle-erstmals-cyberangriffe-mit-ki-agenten-in-der-schweiz", passage: "drei Betreiberinnen kritischer Infrastrukturen ... Wir haben aktuell fünf bestätigte Fälle von Angriffen mit KI-Agenten ... spätestens aber 24 Stunden nach deren Erscheinen"}
