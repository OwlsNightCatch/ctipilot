  - key: trend:4http2root-cacti-guest-sqli-rce
    type: trend
    name: 4HTTP2ROOT
    aliases:
    - Cacti 4HTTP2ROOT
    - VULN-2026-0010
    summary: Name of the unauthenticated stored SQL-injection-to-command-execution chain in Cacti 1.2.31 (guest account enabled) published with a PoC on 2026-11-26; unpatched on 2026-11-27, exploitation attempts reported by Previdian (watchTowr, Previdian, BSI WID-SEC-2026-4845).
  verification: MULTI-SOURCE
  confidence: HIGH
  novelty: new
  evidence:
  - quote: As of November 27, 2026, no exploitation in the wild has been reported.
    attribution: watchTowr
    source_url: https://watchtowr.com/intelligence/4http2root-cacti-zero-day-faq/
  - quote: On 27 November 2026, Previdian observed 22 SQL injection attempts originating from a single source IP against our real Cacti application honeypots.
    attribution: Previdian Research
    source_url: https://blog.previdian.com/cacti-zero-day-what-we-know-so-far/
  - quote: Successful remote command execution has not been confirmed.
    attribution: Previdian Research
    source_url: https://blog.previdian.com/cacti-zero-day-what-we-know-so-far/
  - quote: A public exploit demonstrates command execution against Cacti 1.2.31 (latest) in just four HTTP requests, without requiring valid credentials, when guest access is enabled.
    attribution: Previdian Research
    source_url: https://blog.previdian.com/cacti-zero-day-what-we-know-so-far/
  - quote: Cacti has not published a fixed version for this vulnerability
    attribution: watchTowr
    source_url: https://watchtowr.com/intelligence/4http2root-cacti-zero-day-faq/
  extended_notes: 'Cross-domain lead: the vulnerability desk (S1) and research desk (S3, watchTowr) may carry the same item; fold on the CVE-less name 4HTTP2ROOT. Hardening and detection from the two labs: disable the guest account (Console > Configuration > Users, Authentication Settings), restrict the Cacti web interface to management networks or authenticated VPN, run the web and poller processes as a non-root account; log signal: Cacti log warnings about a non-numeric value in a graph display setting even though the request succeeds (watchTowr), unexpected command values in poller configuration entries, new files created by the poller process, web access logs with time-based SQL-injection patterns in guest-session requests (Previdian honeypot payloads); if compromise is suspected, rotate the SNMP communities and device credentials Cacti stores. Triage: guest access on a Cacti instance is a legitimate feature for read-only dashboards, so the discriminator is a guest session that writes
    a display setting followed by a poller-setting change or a command value in the poller table. BSI''s CSAF carries no CVE and no CVSS score for this entry. Dropped neighbours from the same BSI sweep, for the vulnerability desk: Exim 4.100 and 4.100.1 heap out-of-bounds write in SMTP reception, expansion as root, fixed in 4.100.2 (EXIM-Security-2026-11-19.1, CVE-2026-137702, no mitigation, no exploitation reported); Camunda 7 CVE-2026-109432 expression execution through OR sub-queries, fixed in 7.24.15 and 7.23.18 (Camunda notice 176, 2026-11-26), research write-up public, no exploitation reported.'
- title: 'Basel-Stadt data protection commissioner blocks cloud outsourcing of the cantonal VPN and web proxy (project Infra21+): binding order against a US provider that would break TLS'
  sources:
  - url: https://www.bs.ch/news/2026-weisung-zur-auslagerung-der-kantonalen-vpn-und-web-proxy-loesungen-die-cloud
    publisher: Kanton Basel-Stadt, Datenschutzbeauftragte (DSB)
    date: '2026-11-18'
    role: primary
  - url: https://www.inside-it.ch/basler-datenschutzbeauftragte-verhindert-datenauslagerung-20261125
    publisher: Inside IT
    date: '2026-11-25'
    role: corroborating
  - url: https://www.netzwoche.ch/news/2026-11-26/basler-datenschutzbeauftragte-untersagt-vpn-auslagerung-an-us-amerikanischen
    publisher: Netzwoche
    date: '2026-11-26'
    role: corroborating
  discovery_trace: 'first seen at: inside-it-ch, URL https://www.inside-it.ch/rss.xml (item ''Basler Datenschutzbeauftragte verhindert Datenauslagerung'', 2026-11-25, outside the 26 h window) and Netzwoche feed https://www.netzwoche.ch/rss.xml (2026-11-26) -> primary: Kanton Basel-Stadt news page found by listing https://www.bs.ch/news (url --direct) -> https://www.bs.ch/news/2026-weisung-zur-auslagerung-der-kantonalen-vpn-und-web-proxy-loesungen-die-cloud'
  summary: 'On 2026-11-18 the data protection commissioner of the canton of Basel-Stadt (DSB, Danielle Kaufmann) issued a binding instruction (Weisung) stopping the cantonal administration from moving its remote-access/VPN and web-proxy functions from local operation into a US provider''s cloud solution. The DSB says the plan provides that the provider breaks the encryption, so that most cantonal traffic, including special-category personal data such as health data, tax data under secrecy duties, passwords and procedural files, would become readable to the provider, and calls this an disproportionate risk to fundamental rights and critical state infrastructure given available alternatives. The DSB states it was not consulted before contracting as required, learned of the plan from concerned employees, issued a negative recommendation that the administration did not follow, saw no urgency (the local solution can be extended) and notes that, as far as known, other cantons keep local VPN and
    proxy solutions. Inside IT ties the order to project Infra21+, which replaces VPN remote access and the secure web gateway with a zero-trust network access solution, awarded in April 2025 for CHF 11.3 million to the Swiss integrator BNC (now Axians BNC), which apparently plans to host the proxy and VPN with an American technology partner; the DSB does not publish the provider''s name. Netzwoche relays a guess by lawyer Martin Steiger and by the blog DNIP (anonymous administration sources) that the service is Palo Alto Networks'' Prisma Access: a claim, not confirmed by the DSB. Netzwoche adds that the instruction can be challenged. Defender relevance: a cantonal authority has made TLS inspection by a foreign cloud service a data-protection blocker for a security-architecture project, which bears on any cantonal or communal SSE, ZTNA or secure-web-gateway procurement.'
  region_nexus: switzerland (canton of Basel-Stadt); cited as precedent for other cantons
  primary_sector_nexus: direct (cantonal administration security architecture)
