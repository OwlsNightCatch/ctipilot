- title: 'Cacti 1.2.31 zero-day ''4HTTP2ROOT'': guest session to SQL injection to command execution, public PoC, no patch; Previdian sees probing, BSI flags it unpatched and critical'
  sources:
  - url: https://wid.cert-bund.de/.well-known/csaf/white/2026/wid-sec-w-2026-4845.json
    publisher: BSI (CERT-Bund WID-SEC-2026-4845, CSAF)
    date: '2026-11-26'
    role: primary
  - url: https://watchtowr.com/intelligence/4http2root-cacti-zero-day-faq/
    publisher: watchTowr
    date: '2026-11-26'
    role: corroborating
  - url: https://blog.previdian.com/cacti-zero-day-what-we-know-so-far/
    publisher: Previdian Research
    date: '2026-11-27'
    role: corroborating
  discovery_trace: 'first seen at: bsi-de, bsi-rss bridge (feed https://wid.cert-bund.de/content/public/securityAdvisory/rss) item ''[NEU] [UNGEPATCHT] [kritisch] Cacti: Schwachstelle ermöglicht Codeausführung'' WID-SEC-2026-4845 -> primary: bsi-csaf WID-SEC-2026-4845 (CSAF https://wid.cert-bund.de/.well-known/csaf/white/2026/wid-sec-w-2026-4845.json, references list) -> pivot: watchTowr FAQ https://watchtowr.com/intelligence/4http2root-cacti-zero-day-faq/ -> pivot: Previdian https://blog.previdian.com/cacti-zero-day-what-we-know-so-far/ (the researcher''s GitHub PoC repo is referenced there but was not fetched)'
  summary: 'BSI''s WID-SEC-2026-4845 (first released 2026-11-26 23:00 UTC) classifies a Cacti flaw as critical and unpatched: a remote anonymous attacker can exploit an SQL injection to run arbitrary code with the privileges of the application process; the only product listed is Cacti 1.2.31. A researcher using the handle ek0ms savi0r published the chain on GitHub on 2026-11-26: four unauthenticated HTTP requests. Per watchTowr, the attacker starts as an anonymous guest, writes an unvalidated value into a per-user display setting, the value is later inserted into a database query that the server treats as several statements, one of which changes a poller setting to a shell command that a separate guest-reachable page then executes. The guest account must be enabled (Previdian, citing Cacti''s documentation: disabled by default). The privilege gained is that of the web/poller account, often a low-privileged web user; the researcher showed root in a lab where Cacti ran as root. Cacti Core
    1.2.31 is the latest stable release and is affected, no fixed version exists as of 2026-11-27 and no CVE is assigned (Previdian). Exploitation status differs by source: Previdian reports 22 time-based SQL-injection attempts from one source IP against its Cacti honeypots on 2026-11-27, with successful command execution unconfirmed; watchTowr states that as of 2026-11-27 no exploitation in the wild has been reported. Why it matters to administrations: Cacti is a network-monitoring server that, per watchTowr, stores SNMP strings and device logins for routers, switches and servers, so command execution there is a foothold reaching the whole monitored network.'
  region_nexus: global; no Swiss-specific reporting (the exposure is a network-monitoring product class that public administrations commonly run internally)
  primary_sector_nexus: indirect (infrastructure monitoring server holding network device credentials)
  sector: public-sector
  cves: []
  techniques:
  - T1190
  - T1059
  affected_products:
  - Cacti
  entity_keys: []
