  evidence:
  - quote: Wir haben aktuell fünf bestätigte Fälle von Angriffen mit KI-Agenten.
    attribution: SRF (quoting BACS director Florian Schütz)
    source_url: https://www.srf.ch/news/schweiz/fuenf-bestaetigte-faelle-erstmals-cyberangriffe-mit-ki-agenten-in-der-schweiz
  - quote: In vier von fünf Fällen seien Systeme erfolgreich gehackt worden.
    attribution: SRF
    source_url: https://www.srf.ch/news/schweiz/fuenf-bestaetigte-faelle-erstmals-cyberangriffe-mit-ki-agenten-in-der-schweiz
  - quote: Betroffen von den neuen Cyberangriffen sind drei Betreiberinnen kritischer Infrastrukturen.
    attribution: SRF
    source_url: https://www.srf.ch/news/schweiz/fuenf-bestaetigte-faelle-erstmals-cyberangriffe-mit-ki-agenten-in-der-schweiz
  - quote: Trois de ces attaques ont ainsi visé des infrastructures critiques; dans deux cas, les attaques ont réussi.
    attribution: RTS (with ATS)
    source_url: https://www.rts.ch/info/suisse/2026/article/cybersecurite-5-cyberattaques-menees-par-l-ia-en-suisse-29428554.html
  - quote: In allen dem BACS bekannten Cyberangriffen führte der Einsatz von KI-Agenten zu einer erfolgreichen Kompromittierung der IT-Systeme des Opfers.
    attribution: BACS (NCSC.ch), 2026-11-24
    source_url: https://www.bacs.admin.ch/de/26-ki-agenten-1-de
  extended_notes: 'Recency: the SRF and RTS pieces are dated 2026-11-26 (roughly 38 to 44 h before this run), outside the 26 h window but inside the 72 h developing window; it is a delta on an entry whose updated_at is still null, not a repeat. Other SRF details the entry could carry: ''Die Angriffe seien alle in den letzten Tagen gemeldet worden''; ''Kritische Updates empfiehlt das Bundesamt so rasch wie möglich, spätestens aber 24 Stunden nach deren Erscheinen, zu installieren''; Schütz: ''Wenn es keine Schwachstelle gibt, kann auch ein KI-Agent nicht in ein System eindringen''. RTS says the BACS release was ''publié jeudi'', which conflicts with the BACS page date (2026-11-24) and with ICTjournal''s coverage of 2026-11-25; treat the RTS weekday as a reporting slip. Heise (2026-11-26) and Inside IT (2026-11-27) additionally report a German BSI warning on agentic offensive frameworks (ARTEX named); no BSI primary page could be reached (press listing is JS-rendered), so it is a lead only.
    Detection concept tied to the BACS text: internet-facing authentication logs showing many parallel logins across default or guessable accounts followed by exploitation of unpatched internet-facing services within hours of a patch release.'
