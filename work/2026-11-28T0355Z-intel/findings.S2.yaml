- title: 'BACS director on SRF: five confirmed AI-agent attacks in Switzerland, three on critical-infrastructure operators, four of five compromised, victims not named'
  sources:
  - url: https://www.srf.ch/news/schweiz/fuenf-bestaetigte-faelle-erstmals-cyberangriffe-mit-ki-agenten-in-der-schweiz
    publisher: SRF (Heute Morgen interview with the BACS director)
    date: '2026-11-26'
    role: primary
  - url: https://www.rts.ch/info/suisse/2026/article/cybersecurite-5-cyberattaques-menees-par-l-ia-en-suisse-29428554.html
    publisher: RTS (with ATS; relays the SRF interview and the BACS release)
    date: '2026-11-26'
    role: corroborating
  - url: https://www.bacs.admin.ch/de/26-ki-agenten-1-de
    publisher: BACS (NCSC.ch), original statement already in the store
    date: '2026-11-24'
    role: corroborating
  discovery_trace: 'first seen at: Swiss general-news RSS sweep, SRF feed https://www.srf.ch/news/bnf/rss/1890 (item ''Fünf bestätigte Fälle - Erstmals Cyberangriffe mit KI-Agenten in der Schweiz'') -> primary: SRF article https://www.srf.ch/news/schweiz/fuenf-bestaetigte-faelle-erstmals-cyberangriffe-mit-ki-agenten-in-der-schweiz -> corroborating: RTS feed https://www.rts.ch/info/suisse/?format=rss/news item https://www.rts.ch/info/suisse/2026/article/cybersecurite-5-cyberattaques-menees-par-l-ia-en-suisse-29428554.html -> re-read BACS statement https://www.bacs.admin.ch/de/26-ki-agenten-1-de (unchanged, dated 2026-11-24, no case count)'
  summary: 'Delta on the BACS AI-agent statement of 2026-11-24, which named no case count, sector or success rate. On 2026-11-26 BACS director Florian Schütz told SRF: ''Wir haben aktuell fünf bestätigte Fälle von Angriffen mit KI-Agenten'', all reported in recent days. Three victims are operators of critical infrastructure (SRF''s examples: electricity and water suppliers, telecom providers) and SMEs that reported voluntarily were also hacked with the help of AI agents. SRF quotes him that in four of five cases systems were successfully compromised, whereas RTS (ATS wire, relaying the interview and the BACS release) reads three critical-infrastructure attacks of which two succeeded; the BACS page of 2026-11-24 says that in all known cases the agent led to a compromise, so the three readings differ on the success count and the store entry''s ''every known case ending in a compromise'' should be softened to the director''s own figure. No larger outages so far, the actors are unknown, and
    BACS will not name the victims (''Die Betroffenen haben das Recht, selbst zu kommunizieren''). Schütz repeats the 24-hour ceiling for critical updates on internet-reachable systems; RTS adds that BACS counts the freely available agents as nearly doubled since October 2026 and recommends sharply fewer internet-exposed systems, strict access limits and consistent MFA. Raphael Reischuk (co-founder of the Nationales Testinstitut für Cybersicherheit) expects a larger wave and asks the Bund to examine jointly funded SME support; that is his assessment, not BACS''s.'
  region_nexus: switzerland (BACS, Swiss critical-infrastructure operators and SMEs); no Swiss administration named as victim
  primary_sector_nexus: 'indirect: critical-infrastructure operators (energy, water, telecom class) and SMEs; public administrations are not named'
  sector: critical-infrastructure
