  discovery_trace: 'first seen at: inside-it-ch, URL https://www.inside-it.ch/rss.xml item https://www.inside-it.ch/sap-bestaetigt-angriffe-auf-entwicklerkonten-20261127 -> pivot: heise-sec feed https://www.heise.de/security/feed.xml item https://www.heise.de/news/IT-Vorfall-bei-SAP-Entwicklungssysteme-betroffen-11539973.html -> pivot: Handelsblatt https://www.handelsblatt.com/technik/ki/sap-it-sicherheitsvorfall-haben-verdaechtige-aktivitaeten-identifiziert/100273138.html -> pivot: tagesschau feed https://www.tagesschau.de/xml/rss2/ item https://www.tagesschau.de/wirtschaft/unternehmen/sap-hacker-angriff-100.html (dpa with SAP statement) -> original: Spiegel https://www.spiegel.de/netzwelt/sap-wird-opfer-von-hackerangriff-a-6648b5ce-5d74-48dc-86ea-9469705bb91d (paywall); no SAP-published statement page found'
  summary: 'Facts (SAP''s own words via dpa): SAP says it identified suspicious activity, took ''unverzüglich die notwendigen Maßnahmen ergriffen, um seine Kunden zu schützen'', and, on the current state of its investigation, has found no indication of unauthorised access to customers'' business data. An internal letter that dpa partly saw places the activity ''innerhalb unserer Plattform für Entwicklerproduktivität und Softwarebereitstellung GitHub'' and asks staff to check whether they must change credentials. SAP gave no vector, discovery date, scope or actor. Claims from unnamed sources: Spiegel''s insider says the attackers stole GitHub authentication tokens of SAP employees, which could let them read and alter source code, and that agentic AI may have been used (a claim SAP did not confirm); Handelsblatt, citing company circles, says SAP noticed the incident last week, runs it internally as ''Project Granite'' and that numerous teams are affected; heise, relaying Handelsblatt, reports
    SAP restricted GitHub access, halted automated development workflows and replaced signing keys. What is unknown: which repositories were touched, whether any released SAP package, patch or build artefact could have been altered, and whether the replaced signing keys change how SAP-signed artefacts must be verified. Swiss nexus: SAP is a core platform in Swiss public administrations (Inside IT, 2026-11-27, describes the canton of Zurich''s finance administration running on a cantonal S/4HANA landscape), but no Swiss-specific impact is reported; this is supplier-side supply-chain exposure, not a reported compromise of any Swiss customer. The same week 1Password disclosed a breach through an employee''s GitHub account (already in the store).'
  region_nexus: Germany-based software supplier; Swiss federal and cantonal SAP estates (canton of Zurich S/4HANA named by Inside IT); no Swiss impact reported
