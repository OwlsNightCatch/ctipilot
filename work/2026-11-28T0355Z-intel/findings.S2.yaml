  extended_notes: 'Overlap: S4 (incidents) will likely return the same incident from its own sources; the main agent should fold them. Analyst-derived detection concept (no source states it): for organisations that consume SAP-signed artefacts or SAP open-source packages, watch SAP Security Notes and Support Portal communications for signing-key or certificate changes and re-verify downloads against the new keys; for any GitHub organisation, the token-theft class shows up as audit-log events for new personal-access-token or OAuth grants, clone bursts from unfamiliar addresses and workflow-file changes. Spiegel''s page is paywalled, so its claims reach this item only through Handelsblatt, Heise, Inside IT and tagesschau; the teaser reads ''Womöglich haben die Täter sich von KI-Systemen helfen lassen''. Reuters is the wire cited by ICTjournal''s weekly round-up (https://www.ictjournal.ch/news/2026-11-27/en-bref-dochsner-sport-a-la-cia-en-passant-par-sap-et-la-fifa-les-pirates-frappent) but
