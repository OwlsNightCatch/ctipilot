  q6_AI_assisted_claim:
    status: 'settled: unconfirmed, single origin (SPIEGEL company sources), SAP silent'
    answer: 'Origin: SPIEGEL''s readable standfirst says ''Womöglich haben die Täter sich von KI-Systemen helfen lassen'' (possibly; ''AI systems'', not ''agentic''). The ''agentic AI'' wording appears in the dts, heise and t-online relays (''unternehmensinterne Quellen''); BleepingComputer says ''possibly with help from AI tools''; Inside IT states it more strongly (''Dies sei wohl mithilfe von agentischer KI möglich gewesen''). SAP''s statement does not address it (CyberInsider, ITdaily), SecurityWeek says it is not confirmed, and dpa''s original wire text contains nothing on AI. The BSI press release of 26 Nov on agentic offensive frameworks (Artex, CAIRN, PentAGI) is generic and never mentions SAP; BleepingComputer, CyberInsider and Aviatrix juxtapose it and WiWo mentions it, none with a sourced link; Inside IT juxtaposes a BACS statement on AI agents in Swiss attacks instead. Aviatrix presents AI-tool use and C2 as fact, which no source supports.'
