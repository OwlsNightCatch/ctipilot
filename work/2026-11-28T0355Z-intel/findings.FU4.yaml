  q5_customer_impact_and_action:
    status: 'settled as an absence: no source says customer-delivered artifacts or customer-verified keys are affected or that customers must act'
    answer: 'SecurityWeek: ''None of the reports indicate that tampered code was incorporated into software delivered to SAP customers.'' CyberInsider and The Record: SAP has not said whether source code was copied or altered or whether releases reached customers. WiWo: SAP left open whether customers must act. BleepingComputer: SAP declined to say whether customers using its GitHub code or updates should act. SOCRadar (secondary): no SAP customer guidance published. One conflicting framing: Inside IT writes, after quoting SAP via SPIEGEL, that SAP therefore did not consider it necessary to contact customers proactively; the sentence opens with ''Deshalb'' and may be Inside IT''s inference, SPIEGEL''s text is unreadable, and no other outlet says it. Signing keys: no source says which keys were replaced (release signing, package provenance, commit signing), whether customers verify them, or whether a key-change notice exists; The Record''s gloss that they verify ''that its software was genuine''
      is the outlet''s own explanation; WiWo calls the re-keying reading an inference and ''kein Beleg''.'
