- 'Aviatrix (aviatrix.ai): asserts AI-tool use, covert C2 and pipeline movement as fact; unsupported by any source, do not cite.'
- 'Finexus API page and thenews.com.pk: aggregator rewrites with unsupported additions (e.g. ''comprehensive audit of its source code repositories'', ''On Friday, Reuters reported ...''); do not cite.'
- 'boerse-express ''SAP Aktie: Hacker-Angriff erschüttert Vertrauen'' is dated 2025-09-06 and concerns a different matter (S/4HANA exploitation 2025); not this incident.'
- 'windowsforum.com, particle.news, Dealroom, DrWeb, it-boltwise: relays; only used to locate the Golem and slug provenance leads.'
