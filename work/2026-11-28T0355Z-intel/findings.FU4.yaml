  q7_links_to_other_incidents:
    status: 'settled: links are drawn only as same-week or same-year context; no source states a technical, actor or infrastructure connection'
    answer: '1Password (disclosed Wed 25 Nov 2026; investigation began 19 Nov; compromised employee GitHub account, source code copied, malicious code pushed to backend services): ITdaily draws the parallel (''also happened in recent weeks at 1Password''), SOCRadar lists it as a same-week disclosure, SecurityWeek lists it as ''Related'', ICTjournal''s weekly round-up covers both side by side (Netzwoche covered 1Password only, in a separate item); the 1Password post does not mention SAP and nobody claims a link. April 2026 SAP npm ''Mini Shai-Hulud'' compromise: The Record and The Factum say it is unclear whether the two are connected; PlayCISO, Dr. Web and WiWo say no source links them; SOCRadar notes SAP''s November statement does not mention the April campaign. SecurityWeek: Gentlemen ransomware listed SAP''s Latin American operations in late October, ''the two incidents do not appear to be connected''. heise (de + en) only supplies general GitHub-abuse context (mid-November token campaign,
      Aikido ''wfx-loot'', 4,837 accounts) and a list of recent high-profile victims, not a link; WiWo says there is no indication GitHub itself was breached.'
