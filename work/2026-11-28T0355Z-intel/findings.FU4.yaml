contradictions:
- id: X1
  topic: Did SAP confirm a hack/attack?
  side_a: 'SPIEGEL via dts and heise, Inside IT: SAP ''confirmed the cyberattack'' / ''the incident'' when asked (dts: ''bestätigte den Cyberangriff auf Anfrage des Spiegel''; Inside IT: ''bestätigte SAP den Vorfall''; heise: ''den das Unternehmen demnach auch bestätigte'').'
  side_b: dpa wire text ('Der Konzern bestätigte dies zunächst nicht' / tagesschau 'Der Konzern bestätigte dies nicht'), tagesschau headline ('SAP widerspricht'), WiWo ('Von einem Hackerangriff spricht der Konzern nicht'), SOCRadar, heise on its dpa contact ('Gegenüber der dpa bestätigte SAP das zunächst jedoch nicht').
  resolution: 'Reconcilable: SAP confirmed suspicious activity / an ''incident'' in every readable statement but never used the word attack or hack; SPIEGEL''s own text is unreadable so the dts wording is an agency rendering. The entry should say SAP confirmed ''suspicious activity'' and did not confirm an attack or any attacker method.'
  claim_ids:
  - C1.09
  - C1.20
  - C1.21
  - C1.22
  - C1.23
  - C1.16
- id: X2
  topic: Where the three containment measures come from
  side_a: 'heise (08:02 CET), CyberInsider, SecurityWeek, The Record, Dealroom cite Handelsblatt (old slug ''haben-verdaechtige-aktivitaeten-identifiziert''; Dealroom a third slug) for: GitHub access restricted, automated workflows stopped, signing keys replaced.'
  side_b: The Handelsblatt page now readable (article id 100273138, title 'Kunden fordern lückenlose Aufklärung', published 00:21 CET, modified 15:46 CET Fri) has only three paragraphs, flagged free and unpaywalled, and contains no sentence on GitHub access, workflows or signing keys (grep 'Signatur' = 0 in the raw page); it says only 'mehrere Sofortmaßnahmen zum Schutz der Entwicklungsinfrastruktur'.
  resolution: Unresolved. Most likely the sentence sat in an earlier version of the Handelsblatt article (the page was retitled and edited), and WiWo (Handelsblatt Media Group, 17:29 CET) still attributes it to the current URL; but WiWo is the same publisher, not independent, and no archived earlier version could be read. Carry the measures as 'reported by Handelsblatt, as relayed by heise and others; not in the Handelsblatt text readable at publication of this entry, not confirmed by SAP'.
  claim_ids:
  - C4.01
  - C4.02
  - C4.03
  - C4.04
  - C4.05
  - C4.06
  - C4.11
  - C4.12
  - C4.13
  - C4.14
  - C4.15
- id: X3
  topic: Customer systems vs customer business data
  side_a: 'BleepingComputer lead: SAP ''said its evidence so far does not show downstream compromise of customer systems or data''.'
  side_b: The SAP statement BleepingComputer quotes (and every other outlet) covers only 'unauthorized access to customer business data'.
  resolution: BleepingComputer's lead is a paraphrase wider than SAP's words; use SAP's wording only.
  claim_ids:
  - C1.18
  - C1.02
  - C1.17
- id: X4
  topic: Customer contact
  side_a: 'Inside IT: SAP ''nicht für nötig gehalten, Kundinnen und Kunden proaktiv zu kontaktieren'' (attributed to SPIEGEL, may be Inside IT''s inference).'
  side_b: 'BleepingComputer: SAP did not specify whether customers should act and declined to say more; WiWo: left open.'
  resolution: Not settled by any readable primary; SPIEGEL's text unreadable. Do not state either that customers were told nothing is needed or that they were told to act.
  claim_ids:
  - C5.06
  - C1.04
  - C5.04
  - C5.05
- id: X5
  topic: AI wording strength
  side_a: 'Inside IT: ''Dies sei wohl mithilfe von agentischer KI möglich gewesen'' (probably); Aviatrix: AI-assisted tools used as fact.'
  side_b: 'SPIEGEL standfirst: ''Womöglich ... KI-Systemen''; dts/heise: ''womöglich agentische KI'' from company-internal sources; SecurityWeek: not confirmed; SAP: silent.'
  resolution: Carry as an unconfirmed possibility from SPIEGEL's company sources.
  claim_ids:
  - C2.17
  - C6.01
  - C6.02
  - C6.04
- id: X6
  topic: EFK end-of-support statement
  side_a: 'S4 evidence quote (EFK dispatch page, displayed 28.02.2020): federal SAP landscape unsupported from end 2025.'
  side_b: 'EFK pages of 2022-2023 in the same series: SAP R/3 maintained until end 2027, replaced with S/4HANA.'
  resolution: The 2020 sentence is superseded; use it only as dated background or prefer the 2021-2023 sentences. None is a 2026 statement of the federal estate.
  claim_ids:
  - CN.01
  - CN.03
  - CN.05
  - CN.07
- id: X7
  topic: 'Minor: BleepingComputer ''earlier today'' and The Record ''confirmed Friday'''
  side_a: BleepingComputer (published Fri 27 Nov 04:56 EST) says SPIEGEL reported 'earlier today'; The Record says SAP 'confirmed Friday'.
  side_b: SPIEGEL published Thu 26 Nov 20:14 CET; SAP's first statement (to dpa) was Thu evening.
  resolution: Use SPIEGEL 26 Nov evening and SAP's first statement Thu 26 Nov evening; the Friday statements are follow-ups to other outlets.
  claim_ids:
  - C3.01
  - C3.08
  - C1.10
corrections_to_sweep_findings:
- 'S4 item 1 / EFK: the quoted EFK sentence comes from a page displayed as 28.02.2020 (sfao-19445) and is superseded by EFK pages dated 2021-2023 (R/3 supported until end 2027; S/4HANA programmes SUPERB and ERPSYSVAR in progress). Describe it as a 2020 statement or use CN.03/CN.05/CN.07; no 2026 source describes the current federal SAP estate.'
- 'S4 and S2: the three containment measures are attributed to Handelsblatt, but the Handelsblatt text readable now does not contain them (page retitled and edited 15:46 CET 27 Nov). All verbatim measure quotes in the sweeps are real (grep-verified against heise and CyberInsider) but are second-hand to an unreadable Handelsblatt version; WiWo is the same publisher group.'
- 'S4 and S2: ''SPIEGEL''s insiders say the attackers may have used AI tools/agentic AI'': SPIEGEL''s readable standfirst says ''KI-Systemen'' (AI systems); ''agentic'' is the wording of dts/heise/t-online relays attributed to company-internal sources. Inside IT''s ''wohl mithilfe von agentischer KI'' overstates.'
- 'S2: ''confirmed by SAP to dpa and Reuters on 2026-11-26/27'' holds (dpa Thu 26 Nov evening, 22:06 CET ticker; Reuters Fri 27 Nov per ICTjournal) but SAP also gave the wording to BleepingComputer, SecurityWeek and Recorded Future News on Fri 27 Nov. SAP confirmed ''suspicious activity'', not an attack (dpa: ''bestätigte dies nicht'').'
- 'S2: ''Handelsblatt ... runs it internally as Project Granite'': SPIEGEL''s headline carries the code name first; Handelsblatt repeats it from company circles. ''Active security incident'' is SPIEGEL''s caption (dts: wording of the internal notice).'
- 'S2: Inside IT''s Zürich passage is ''bestehende S/4Hana-Landschaft der kantonalen Verwaltung'' (cantonal administration, not only the finance administration) in a paywalled Plus article about a procurement award that never mentions the incident; S2''s ''cantonal S/4HANA landscape'' reading is right but it is nexus evidence only.'
- 'S4: ''dpa separately reviewed part of the memo'' is CyberInsider''s reading; dpa says only ''ein Schreiben''. No source says SPIEGEL''s memo and dpa''s letter are one document.'
- 'S4/S2 quotes: every evidence quote in findings.S4.yaml item 1 and findings.S2.yaml item 2 was grep -F verified against the FU4 saved bodies (12 of 12 present).'
not_readable:
- source: DER SPIEGEL article
  url: https://www.spiegel.de/netzwelt/sap-wird-opfer-von-hackerangriff-a-6648b5ce-5d74-48dc-86ea-9469705bb91d
  detail: 'Paywall (counter wall; raw JSON isAccessibleForFree=false). Readable: headline ''»Project Granite«: SAP wird Opfer von Hackerangriff'', standfirst, photo caption ''»Aktiver Sicherheitsvorfall«'', published 2026-11-26T20:14:00+01:00, never modified. Its AI-generated summary box loads via JavaScript and was not retrieved. Every SPIEGEL claim (insider, memo, tokens, source code, AI) reaches us through BleepingComputer, dts, heise, t-online, Handelsblatt, Inside IT.'
- source: Reuters (SAP flags security incident ...)
  url: https://www.reuters.com/technology/sap-flags-security-incident-says-no-evidence-unauthorized-access-customer-data-2026-11-27/
  detail: URL taken from ICTjournal's outbound links, not from a search guess. CAPTCHA wall on extract/jina; WebFetch refused the host. Content reaches us only via ICTjournal's French paragraph (C1.15).
- source: 'Golem.de (Zugriff über Github: Cyberangriff auf SAP gefährdet Softwareprojekte)'
  url: https://www.golem.de/news/zugriff-ueber-github-cyberangriff-auf-sap-gefaehrdet-softwareprojekte-2611-215722.html
  detail: Consent/subscription wall on extract, raw and WebFetch; no article text in the HTML. The claim that Golem, citing Handelsblatt, says access to the affected GitHub projects was secured again is known only from windowsforum.com and is unverified.
- source: Earlier version of the Handelsblatt article
  url: https://www.handelsblatt.com/technik/ki/sap-it-sicherheitsvorfall-haben-verdaechtige-aktivitaeten-identifiziert/100273138.html
  detail: Both slugs resolve to the same current page. An archive lookup (Wayback) was attempted once and was denied by the sandbox permission classifier; it was not retried or worked around. The pre-15:46 CET text is therefore unread.
- source: SAP Support security notes / My Trust Center
  url: https://me.sap.com/app/securitynotes
  detail: 'Customer-login areas (linked from SAP''s Trust Center page); not readable. Public SAP pages checked: Trust Center DE and EN incident-management pages, newsroom home page, Nov 2026 patch-day page: no statement on the incident.'
- source: Inside IT Zürich article (paywalled Plus)
  url: https://www.inside-it.ch/zuercher-finanzverwaltung-vergibt-auftrag-fuer-sap-migration-20261127
  detail: extract shows only the lead; the S/4Hana passage was read from the content blocks embedded in the page payload (raw fetch). Quotable but arguably behind the paywall.
- source: NZZ, SRF, Netzwoche (SAP incident piece)
  url: n/a
  detail: No SAP-incident article found via feeds (Netzwoche 20 items, SRF 40 items, NZZ technology 50 items and recent 16 items, Inside IT 20 items) or WebSearch; absence is not proof none exists. watson.ch feed unreadable.
