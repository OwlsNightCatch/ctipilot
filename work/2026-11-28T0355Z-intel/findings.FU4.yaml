  q2_attribution_split:
    status: settled for what is readable; SPIEGEL body not readable
    answer: 'SPIEGEL (insider + internal memo; paywalled, only headline, standfirst, caption and timestamps readable, so everything else is via relays): code name ''Project Granite'' (headline), ''Aktiver Sicherheitsvorfall'' (photo caption; dts: wording from an internal notice to staff), attackers possibly helped by AI systems (standfirst), stolen SAP-employee authentication tokens used to copy and manipulate source code on GitHub (insider; relayed by BleepingComputer, dts, Handelsblatt, Inside IT), staff asked to keep the project confidential (BleepingComputer''s relay). Handelsblatt (company circles, its own reporting): SAP detected the incident ''last week'', software development was attacked, ''Project Granite'' with several immediate measures to protect the development infrastructure, numerous teams affected; Handelsblatt attributes the token claim to SPIEGEL, not to its own sources. The three specific measures (GitHub access restricted, automated workflows stopped, signing keys replaced)
      are attributed to Handelsblatt by others (heise, CyberInsider, SecurityWeek, The Record, WiWo, Dealroom) but are NOT in the Handelsblatt text readable now (see contradictions). dpa (own material): SAP''s statement on request, plus an internal letter dpa ''could partly see'' dated ''a few days ago'', which places the suspicious activity ''innerhalb unserer Plattform für Entwicklerproduktivität und Softwarebereitstellung GitHub'' and asks staff to check measures and credentials. dpa''s original wire text (sueddeutsche.de, tagesschau.de, ariva) says nothing about tokens, source code or AI; t-online''s longer text adds ''Dies bestätigte auch die Nachrichtenagentur dpa unter Berufung auf eigene Quellen'' (ambiguous, not in the dpa original). No source says SPIEGEL''s memo and dpa''s letter are the same document (CyberInsider assumes it).'
