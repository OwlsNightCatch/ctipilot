settled:
  q1_what_SAP_itself_says:
    status: settled (SAP-authored wording exists only as statements quoted by outlets; no SAP-hosted page or customer communication found)
    answer: 'SAP''s wording, as quoted to BleepingComputer (Fri 27 Nov): ''SAP has identified suspicious activity and promptly implemented the necessary measures to protect its customers and preserve the security of its services.'' / ''Based on our investigation to date, we have found no evidence of unauthorized access to customer business data.'' / ''Our customers trust us to protect their data, and that remains our highest priority. In a highly dynamic threat environment, we will continue to strengthen our security to provide the secure and resilient environment our customers depend on.'' The same two substantive sentences go to Recorded Future News and SecurityWeek (Fri), to Reuters (Fri, via ICTjournal, French rendering) and, in German, to dpa on Thursday evening 26 Nov (dpa-AFX ticker 22:06 CET): ''unverzüglich die notwendigen Maßnahmen ergriffen, um seine Kunden zu schützen und die Sicherheit seiner Dienste zu gewährleisten'' and ''Nach dem aktuellen Stand unserer Untersuchung haben
      wir keine Hinweise auf einen unbefugten Zugriff auf Geschäftsdaten von Kunden gefunden'' (dpa adds in its own words that security measures are developed continuously). The English and German texts look like one underlying statement (analyst inference). SAP gave no vector, actor, detection date, affected environments or repositories, did not confirm token theft, source-code copying or modification, or AI use, and its customer-data sentence says nothing about source code or software integrity. SAP never used the words attack or hack in any statement we can read; BleepingComputer says a spokesperson declined to say whether customers pulling code or updates from SAP''s GitHub repositories should act. No SAP-hosted statement: SAP''s Trust Center incident-management pages (DE and EN) carry only a public statement on CVE-2026-109618/109619; the SAP newsroom home page and the 10 Nov 2026 patch-day page carry nothing on this incident; SAP Support security notes require a customer login and
      could not be read.'
