assessment_for_composer:
  facts_sap_stated:
  - SAP identified suspicious activity and took measures to protect customers and its services (BleepingComputer, dpa, The Record, SecurityWeek, Reuters via ICTjournal).
  - On the investigation to date SAP found no evidence/indication of unauthorized access to customer business data (same outlets).
  claims_by_maker:
  - 'SPIEGEL (insider, memo; relayed): GitHub environment breached, employee authentication tokens stolen, source code copied and modified; attackers possibly helped by AI; code name Project Granite; ''active security incident''.'
  - 'Handelsblatt (company circles): detected the week before, software development attacked, Project Granite, several immediate measures, numerous teams affected. Via others and not in the readable Handelsblatt text: GitHub access restricted, automated workflows stopped, signing keys replaced.'
  - 'dpa (partly seen internal letter): activity found within SAP''s GitHub developer-productivity and software-delivery platform; staff to check measures and credentials.'
  unknown_absences:
  - Vector, actor, discovery date, repositories, whether public or private, whether source code was copied or altered, whether any release or package reached customers, which signing keys, whether customers must act, whether any authority was notified, whether contained.
  independence: 'Independent first-hand strands are three: SAP''s own statement, SPIEGEL''s insider/memo, Handelsblatt''s company circles (plus dpa''s partly seen letter). BleepingComputer, CyberInsider, SecurityWeek, The Record, ITdaily, SOCRadar, Dealroom, Inside IT, dts and heise are relays; WiWo is a Handelsblatt Media Group sister title. Suggested Admiralty: source reliability B (no single A primary readable), information credibility 2 for the SAP-confirmed core, 3 for token theft/source-code modification/AI/measures.'
