    answer: 'Swiss reporting found: Inside IT (2026-11-27 11:20Z, ''SAP bestätigt Angriffe auf Entwicklerkonten'', a relay of SPIEGEL via the Inside IT desk, adds the BACS reference to AI agents in Swiss attacks) and the ICTjournal weekly round-up (2026-11-27 16:06, SAP paragraph relays Reuters; no Swiss customer mentioned). Netzwoche (feed of 20 items), SRF (feed of 40 items back to Fri 14:27 CET) and the BACS ''Aktuelle Vorfälle'' / ''Im Fokus'' / ''Medienmitteilungen'' pages (as saved by S2 earlier today) carry no SAP-incident item; the NZZ technology feed (50 items back to Dec 2025) and recent feed (16 items) carry none either. No federal or cantonal reaction, no DSAG statement, no Swiss SAP-customer statement found. EFK sentence S4 cites is on a page whose displayed date is 28.02.2020 (sfao-19445; WordPress metadata 2024-01-17 published / 2024-03-20 modified): ''The SAP landscape currently used in the Federal Administration will no longer be supported by the manufacturer from the end
