    status: 'partly settled: disclosure dates exact; discovery and memo dates only relative'
    answer: 'Disclosure: SPIEGEL published Thu 2026-11-26 20:14 CET (page metadata, never modified). SAP''s first statement went to dpa that evening (dpa-AFX ticker 26.11.2026 22:06 CET; Handelsblatt: ''am Donnerstagabend''; dpa wire copy on sueddeutsche.de 22:02Z). Handelsblatt published 2026-11-27 00:21 CET and was modified 15:46 CET the same day. Further SAP statements to BleepingComputer (published 04:56 EST = 09:56Z), SecurityWeek, Recorded Future News and Reuters were given Fri 2026-11-27. Discovery: no exact date anywhere. Handelsblatt (company circles) says ''in der vergangenen Woche'' (relative to a Friday 27 Nov article: the week of 16-22 Nov on a calendar reading, loosely ''the last seven days''); dpa says the letter went out ''vor einigen Tagen''; t-online (SPIEGEL-sourced) says the incident caused considerable agitation ''in den vergangenen Tagen''. SAP declined to give the detection date. Memo date: not stated by any readable source.'
