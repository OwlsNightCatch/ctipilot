  q4_containment_steps:
    status: settled as to who reports what; none is confirmed by SAP
    answer: 'Restricted GitHub access, stopped (paused) automated development workflows, replaced signing keys: attributed to Handelsblatt ''citing group circles'' by heise (de + en), CyberInsider, SecurityWeek (''reportedly''), The Record (''reportedly''), WiWo (''SAP hat beides nicht bestätigt''), Dealroom; ITdaily states them as plain fact without attribution; SOCRadar says SAP has not commented on the steps. Staff told to check measures and whether to change credentials: the internal letter seen by dpa (relayed by heise). ''Mehrere Sofortmaßnahmen zum Schutz der Entwicklungsinfrastruktur'', ''zahlreiche Teams betroffen'': Handelsblatt (the only containment wording readable in the Handelsblatt text itself). Not verifiable: Golem reportedly adds that access to affected GitHub projects was secured again (only via the windowsforum aggregator; Golem is behind a consent wall); PlayCISO notes English write-ups claim an internal code-scan tool and mandatory signed commits, absent from all German
      reports.'
