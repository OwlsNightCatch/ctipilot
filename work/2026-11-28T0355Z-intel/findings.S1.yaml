    publisher: "FreeRADIUS project (security notifications)"
    url: "https://freeradius.org/security/"
    category: vendor-psirt
    why: "first-party disclosure page for the RADIUS server behind many 802.1X, Wi-Fi and VPN authentications; the 2026-11-25 batch carries a default-enabled Critical use-after-free and TEAP Access-Accept bypasses; extract reads the page with newest block first"
  - id: otrs-security-advisories
    publisher: "OTRS / EasyVista-OTRS security advisories (OSA)"
    url: "https://otrs.com/release-notes/otrs-security-advisory-2026-19/"
    category: vendor-psirt
    why: "first-party advisories for a ticketing system common in administrations (and the base of Znuny); OSA-2026-19 is an unauthenticated SQL injection; pin the OSA listing path when one is found (only the advisory page was fetched)"
  - id: apache-tomcat-security
    publisher: "Apache Tomcat security pages (per branch)"
    url: "https://tomcat.apache.org/security-11.html"
    category: vendor-psirt
    why: "authoritative per-CVE record with severity and affected versions for Tomcat 11.x (security-10.html and security-9.html are the sibling branches); Tomcat sits under many Java application estates; extract reads it"
  - id: realvnc-security-advisories
    publisher: "RealVNC Help Center security advisories"
    url: "https://help.realvnc.com/hc/en-us/articles/40824627217949-Security-Advisory-UDP-based-connection-vulnerability"
    category: vendor-psirt
    why: "first-party advisory RVNC-2026-001 for remote-access software; only readable through the jina reader (extract fell through to it), so keep as jina-method"

