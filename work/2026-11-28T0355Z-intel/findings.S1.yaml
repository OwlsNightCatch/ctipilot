        attribution: "OTRS"
        source_url: "https://otrs.com/release-notes/otrs-security-advisory-2026-19/"
    extended_notes: |
      Exposure: OTRS version and whether the Survey package is installed and the external (customer or public) frontend is internet-reachable. Detection concept: web-server access logs for requests to the survey external frontend (public survey request URL) whose key parameter contains SQL metacharacters or time-delay patterns, and slow responses from those requests; database-account queries with unusual UNION or SLEEP constructs. Znuny (an OTRS fork) lists no matching advisory (ZSA list newest 2026-10-14). Not in prior coverage.

  # ---------------------------------------------------------------------------
  # 13. BORDERLINE NEW: Apache Tomcat release (critical cluster flaw unfixed)
  # ---------------------------------------------------------------------------
  - title: "Apache Tomcat 11.0.29, 10.1.62 and 9.0.124 fix four Important flaws but leave CVE-2026-133325 (Critical, TLS-PSK clusters on TLS 1.3 accept an unauthenticated node) for 11.0.30, 10.1.63 and 9.0.125; switch such clusters to TLS 1.2"
    borderline: true
    borderline_reason: "Critical rating applies only to clustered Tomcat using TLS-PSK on TLS 1.3 (11.0.28 to 11.0.29 per the project) and no fix exists yet; the Important flaws are DoS, an access-flow bypass in RewriteValve and cache-header removal; Tomcat is ubiquitous in Java application estates; vendor dates 2026-11-13 to 2026-11-19, in-window source is heise 2026-11-27"
    sources:
      - { url: "https://tomcat.apache.org/security-11.html", publisher: "Apache Tomcat project (security page, Tomcat 11.x)", date: "2026-11-19", role: "primary" }
      - { url: "https://www.heise.de/news/Diverse-Schwachstellen-in-Apache-Tomcat-11540730.html", publisher: "heise online", date: "2026-11-27", role: "corroborating" }
    discovery_trace: "first seen at: heise-sec feed (python3 tools/fetch_source.py feed https://www.heise.de/security/feed.xml 20), URL https://www.heise.de/news/Diverse-Schwachstellen-in-Apache-Tomcat-11540730.html → primary: https://tomcat.apache.org/security-11.html (extract; Tomcat 10.1 and 9.0 pages not fetched)"
    summary: |
      The Tomcat project's security page for 11.x lists, under 11.0.29 (dated 2026-11-13, issues made public 2026-11-19), four Important flaws (a memory leak with the OWB WebSocket module and an HTTP/2 initial-connection resource leak, both denial of service; RewriteValve [F]/[G]/[R] rules that do not stop processing after a redirect or error response, CVE-2026-118028; ExpiresFilter removing a Cache-Control: private header set by the authentication layer, CVE-2026-121649), plus Moderate and Low items; the EncryptInterceptor weaknesses (CVE-2026-95517) are not fixed but the component is deprecated in favour of TLS-PSK. The one Critical, CVE-2026-133325, is a key exchange without entity authentication: an unauthenticated node can join a cluster secured with TLS 1.3 and TLS-PSK; the page lists it under the not-yet-released 11.0.30 and affected versions 11.0.28 to 11.0.29, and recommends TLS 1.2 until then. heise (2026-11-27) reports the same for the 10.1 and 9.0 branches (fixes in 10.1.63 and 9.0.125, not yet released; 11.0.29, 10.1.62, 9.0.124 are the current fixed releases for the rest). No exploitation is stated.
    region_nexus: "global; no Switzerland-specific reporting"
    primary_sector_nexus: "indirect"
    sector: "technology"
    cves: [CVE-2026-133325, CVE-2026-118028, CVE-2026-121649, CVE-2026-116600, CVE-2026-116830]
    techniques: [T1190]
    affected_products: ["Apache Tomcat"]
    entity_keys: []
    verification: MULTI-SOURCE
    confidence: HIGH
    suggested_classification: { reliability: A, credibility: 2, note: "project first-party page plus heise; exploitation and PoC not stated" }
    suggested_priority: routine
    novelty: new
    evidence:
      - quote: "A key exchange without entity authentication vulnerability in allowed an unauthenticated node to join a cluster when the cluster was secured with TLS 1.3 and TLS-PSK."
        attribution: "Apache Tomcat project"
        source_url: "https://tomcat.apache.org/security-11.html"
      - quote: "Until Tomcat 11.0.30 is available, users are recommended to switch to TLS 1.2."
        attribution: "Apache Tomcat project"
        source_url: "https://tomcat.apache.org/security-11.html"
    extended_notes: |
      Exposure: only Tomcat clusters that use TLS-PSK with TLS 1.3, at 11.0.28 to 11.0.29 on the 11.x line per the project; other deployments are outside the Critical. Not in prior coverage; Apache httpd and nginx are covered separately.

