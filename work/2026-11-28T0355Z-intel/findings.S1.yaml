self_evolution:
  - "kev_window_diff.py reports COVERED when the CVE id merely appears in an entry; a status-field cross-check this run (entries/*/ cves[].status vs the KEV catalogue for 2026-11-20 onward) found six covered CVEs whose entry never recorded cisa-kev (GeoServer CVE-2026-120705 and CVE-2026-129243, Drupal CVE-2026-136716, Xen Orchestra CVE-2026-133469, Idunno AntiCsrf CVE-2026-131914, MONAI Label CVE-2026-133968). Suggest a COVERED-NO-KEV-STATUS verdict that fires when the covering entry's status list for that CVE lacks cisa-kev."
  - "CISA KEV now carries a forensicTriage field (Yes/No) tied to BOD 26-04 'Forensics Triage Requirements' (BOD 26-04 replaces the BOD 22-01 wording in alert text); Drupal CVE-2026-136716, Xen Orchestra CVE-2026-133469, Idunno AntiCsrf and MONAI Label are Yes, the two GeoServer CVEs No. Worth a line in the actionability contract for KEV-listed entries (post-patch compromise check is mandatory for Yes rows)."
  - "FIRST EPSS API path is https://api.first.org/data/v1/epss?cve=A,B,C (v1, not 1.1); reads with `url --direct`; brand-new CVE ids may be missing (GeoServer pair returned no row)."
  - "MSRC SUG OData: $orderby=latestRevisionDate desc returns only isMariner (Azure Linux third-party) noise at the top; the filter `latestRevisionDate ge 2026-11-26T00:00:00Z and isMariner eq false` is accepted and is the right revised-CVE sweep (0 rows this run). `exploited eq 'Yes'` works with a releaseNumber filter."
  - "Red Hat Product Security CVE feed has a working structured recipe: `url --direct 'https://access.redhat.com/hydra/rest/securitydata/cve.json?after=YYYY-MM-DD&per_page=100'` returns severity, public_date and bugzilla description (27 rows since 2026-11-26)."
  - "Adobe chimera collection API returns modifiedDate, cardDate and the bulletin id/priority in contentArea (title, description 'Priority N Security update'); per-bulletin pages read raw with `url --direct` and parse as text; the newest cards this run were APSB26-104/-194/-126 (2026-11-24) and APSB26-208 (2026-11-19)."
  - "Cisco PSIRT advisory pages read with `extract` including the revision-history table and the affected-products table (rows run together; use a raw `url --direct` read if row boundaries matter). `feed ...CiscoSecurityAdvisory.xml 30` lists Interim revisions with dates and is the way to catch revisions like the Expressway 1.1 and nginx 1.6 updates."
  - "Jina reader pool: several keys answered HTTP 402 (exhausted) this run but the fetch rotated to a working key for extract/cisa page; informational, not a fetch failure."
  - "heise security feed (https://www.heise.de/security/feed.xml, direct) carried the in-window RealVNC and Tomcat items that the EUVD/KEV sweeps did not surface as news; useful as a same-day German-language corroborator for vendor advisories."

