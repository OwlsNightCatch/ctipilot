      - quote: "Cacti has not published a fixed version for this vulnerability"
        attribution: "watchTowr"
        source_url: "https://watchtowr.com/intelligence/4http2root-cacti-zero-day-faq/"
      - quote: "As of November 27, 2026, no exploitation in the wild has been reported."
        attribution: "watchTowr"
        source_url: "https://watchtowr.com/intelligence/4http2root-cacti-zero-day-faq/"
      - quote: "The attack requires the Cacti guest account to be enabled but does not require attackers to possess valid credentials."
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/unpatched-cacti-zero-day-with-public-poc-gives-remote-code-execution/"
      - quote: "I found a path from a fresh, unauthenticated HTTP session to command execution as the Cacti server user in four requests."
        attribution: "ek0ms savi0r (Church of Malware)"
        source_url: "https://github.com/ekomsSavior/Sad-Girls-0day-Club/tree/main/4http2shell"
    extended_notes: |
      Exposure check: Cacti Core version in the console footer or cacti.net release file (only 1.2.31 is named as tested), and whether the guest user is enabled (User Management, guest). Hunt/detection telemetry: web-server access logs for a guest-session sequence auth_profile.php update_data, then graph_view.php action=preview, then graph_realtime.php action=init from one client in seconds; application log warnings about a non-numeric value in a graph display setting (watchTowr: the request still succeeds); the database row poller_item.arg1 holding anything other than a normal poller command; new files or shells written by the poller process; unusual child processes of the Cacti web or poller user (sh, curl, wget) with a PHP or poller parent. Triage: the log warning alone also appears with a mistyped or legitimate non-numeric profile value, so the poller_item change and the realtime-graph request that follows are the discriminators.
      Post-fix note: the project has no release after 1.2.31 as of the 2026-11-28 WebFetch of its releases page. Both the vendor GitHub listing pages were read by WebFetch only (summary), so treat "no fix" as watchTowr's statement plus that read.
