      - { key: "tool:4http2root", type: tool, name: "4HTTP2ROOT", aliases: ["4HTTP2SHELL"], summary: "Public proof-of-concept chain by ek0ms savi0r (Church of Malware, 2026-11-26) from a Cacti guest session to command execution via stored SQL injection and the realtime poller; no CVE assigned (THN)." }
    relation_suggestions:
