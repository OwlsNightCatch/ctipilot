      - { url: "https://advisories.ncsc.nl/2026/ncsc-2026-0515.html", publisher: "NCSC-NL (NCSC-2026-0515)", date: "2026-11-25", role: "corroborating" }
    discovery_trace: "first seen at: ncsc-nl bridge (python3 tools/fetch_source.py ncsc-nl recent 15; NCSC-2026-0515) → NCSC-NL page https://advisories.ncsc.nl/2026/ncsc-2026-0515.html (extract) → primary: vendor advisory https://otrs.com/release-notes/otrs-security-advisory-2026-19/ (extract)"
    summary: |
      OTRS advisory OSA-2026-19 of 2026-11-23 rates CVSS 3.1 8.6 (vector AV:N/AC:L/PR:N/UI:N/S:C/C:H) an unauthenticated SQL injection in Kernel::System::Survey::Request::RequestGet(), which builds a SQL query from an attacker-controlled survey key without parameterised statements. Exploitation needs no authentication, no valid survey key and no existing survey request, but the external frontend must be reachable; an attacker can read ticket information and run boolean-based or time-based blind injection to extract data readable by the OTRS database account. Affected: OTRS 2024.3.1 through 2026.8.1 with the Survey package (the vendor table says the default status is unaffected); fixed in OTRS 2026.8.2. NCSC-NL relayed it on 2026-11-25. No exploitation is stated.
    region_nexus: "global; NCSC-NL (Netherlands) advisory; no Switzerland-specific reporting"
    primary_sector_nexus: "indirect (helpdesk and ticketing system class)"
    sector: "technology"
