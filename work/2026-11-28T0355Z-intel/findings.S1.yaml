  # 1. NEW: Cacti 4HTTP2ROOT
  # ---------------------------------------------------------------------------
  - title: "Cacti Core 1.2.31 unauthenticated RCE zero-day '4HTTP2ROOT' (also 4HTTP2SHELL): a guest session writes SQL into a profile setting that reaches the realtime poller, public PoC, no CVE and no fixed release"
    sources:
      - { url: "https://github.com/ekomsSavior/Sad-Girls-0day-Club/tree/main/4http2shell", publisher: "ek0ms savi0r / Church of Malware (GitHub write-up and PoC)", date: "2026-11-26", role: "primary" }
      - { url: "https://watchtowr.com/intelligence/4http2root-cacti-zero-day-faq/", publisher: "watchTowr", date: "2026-11-26", role: "corroborating" }
      - { url: "https://ravenai.sh/blog/four-requests-to-shell-cacti", publisher: "RavenAI", date: "2026-11-26", role: "corroborating" }
      - { url: "https://www.bleepingcomputer.com/news/security/unpatched-cacti-zero-day-with-public-poc-gives-remote-code-execution/", publisher: "BleepingComputer", date: "2026-11-27", role: "corroborating" }
      - { url: "https://thehackernews.com/2026/11/unpatched-cacti-zero-day-enables-rce-in.html", publisher: "The Hacker News", date: "2026-11-27", role: "corroborating" }
    discovery_trace: "first seen at: BleepingComputer feed (bridge feed https://www.bleepingcomputer.com/feed/) → drill https://www.bleepingcomputer.com/news/security/unpatched-cacti-zero-day-with-public-poc-gives-remote-code-execution/ → pivot: watchTowr FAQ https://watchtowr.com/intelligence/4http2root-cacti-zero-day-faq/ → pivot: RavenAI https://ravenai.sh/blog/four-requests-to-shell-cacti → pivot: THN https://thehackernews.com/2026/11/unpatched-cacti-zero-day-enables-rce-in.html → primary: researcher write-up (WebFetch) https://github.com/ekomsSavior/Sad-Girls-0day-Club/tree/main/4http2shell; fix check: WebFetch of github.com/Cacti/cacti/releases and /security/advisories on 2026-11-28 showed v1.2.31 (15 Jun) as Latest and no advisory for this flaw (listing pages, not cited)"
    summary: |
      A researcher using the handle ek0ms savi0r (Church of Malware) published a write-up and proof of concept on 2026-11-26 for unauthenticated command execution on Cacti Core 1.2.31, the latest release, in four HTTP requests. BleepingComputer relays the researcher's statement that the flaw was not reported to Cacti before release; there is no CVE (THN) and no fixed version (watchTowr), and watchTowr and BleepingComputer report no exploitation as of 2026-11-27.
      The chain, as RavenAI and THN describe it: a guest session is obtained from auth_profile.php (request 1); a POST to auth_profile.php?action=update_data stores a SQL fragment in the preview_graphs_per_page setting, which is not forced to be an integer (request 2); graph_view.php?action=preview reads that stored value as the default page size and concatenates it into a LIMIT clause passed to get_allowed_graphs(), and the PDO path accepts a stacked statement, so an UPDATE rewrites a poller_item row's command argument (request 3); graph_realtime.php?action=init then reaches cmd_realtime.php, exec_poll() and popen(), which runs the altered command (request 4). The researcher's demo stages a PHP shell this way.
      Preconditions stated by the sources: the Cacti guest account must be enabled (THN: it is disabled by default since 0.8.7; the researcher had it enabled in the lab); only 1.2.31 was tested and other versions are unverified; the command runs as the web-server or poller account, which watchTowr says is often a low-privileged web user rather than root. Cacti stores SNMP communities and device logins, so watchTowr and THN treat the server as a pivot into the monitored network.
      Interim mitigation per watchTowr and BleepingComputer: disable the guest account, restrict the web interface to trusted networks, review poller_item command values and watch the application log for warnings about non-numeric graph display values.
    region_nexus: "global; no Switzerland-specific reporting. The technology class (a network-monitoring server holding device credentials) is common in administrations' network operations, but exposure depends on the guest account being enabled."
    primary_sector_nexus: "indirect (technology-class exposure; no sector targeting reported)"
    sector: "technology"
