    verification: MULTI-SOURCE
    confidence: MEDIUM
    suggested_classification: { reliability: B, credibility: 2, note: "technical claim rests on one researcher's lab test of 1.2.31 restated by watchTowr, RavenAI, BleepingComputer and THN; no vendor confirmation yet" }
    suggested_priority: notable
