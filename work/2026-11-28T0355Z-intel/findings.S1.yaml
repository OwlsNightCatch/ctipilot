  # 2. NEW: FreeRADIUS 3.0.29 / 3.2.11
  # ---------------------------------------------------------------------------
  - title: "FreeRADIUS 3.0.29 and 3.2.11 fix a Critical unauthenticated use-after-free in the default-enabled EAP-TTLS module, eight High flaws in EAP-FAST, EAP-SIM, EAP-MSCHAPv2, TEAP and DHCP code, and TEAP bugs that return Access-Accept to an unauthenticated peer; no CVE ids yet"
    sources:
      - { url: "https://freeradius.org/security/", publisher: "FreeRADIUS project (security notifications, 2026.11.25)", date: "2026-11-25", role: "primary" }
      - { url: "https://www.cert.cyber.gouv.fr/avis/CERTFR-2026-AVI-1632/", publisher: "CERT-FR (CERTFR-2026-AVI-1632)", date: "2026-11-27", role: "corroborating" }
    discovery_trace: "first seen at: cert-fr bridge (python3 tools/fetch_source.py cert-fr avis-recent 25), URL https://www.cert.cyber.gouv.fr/avis/CERTFR-2026-AVI-1632/ (FreeRADIUS, 2026-11-27) → primary: vendor security page https://freeradius.org/security/ (fetched with extract; the 2026.11.25 block read in full); EUVD search (api/search?text=FreeRADIUS, 2026-11-20..28) returned 0 records; WebSearch found no independent coverage"
    summary: |
      FreeRADIUS released 3.0.29 and 3.2.11 on 2026-11-25 "to fix various overflows and memory leaks" and says everyone on earlier versions should upgrade; the project's page lists 21 issues (1 Critical, 8 High, 5 Medium, 7 Low) grouped by module, each fixed by a commit on both branches where both are affected. CERT-FR's advisory of 2026-11-27 restates that some allow remote code execution, remote denial of service and loss of data confidentiality. No CVE ids are assigned yet (CERT-FR lists none; ENISA EUVD returned no FreeRADIUS record on 2026-11-28).
      The Critical one is a use-after-free in the TTLS module, which the project says is enabled in the default configuration: an unauthenticated user can start an EAP-TTLS session and send invalid inner-tunnel data, and with heap shaping an attacker can write a heap pointer to a chosen address, so code execution may be possible. EAP-TLS, TTLS and PEAP are the default-enabled TLS-based methods. The eight High issues are in code that is off by default: an unauthenticated out-of-bounds write in the DHCP option encoder, three EAP-FAST flaws (weak randomness exposing the PAC, a stack overflow, TLV bounds checks), EAP-MSCHAPv2 response length checks, EAP-SIM identity length, and two TEAP flaws (TLV bounds, an infinite loop). Three Medium TEAP flaws let an unauthenticated peer obtain Access-Accept: missing Basic-Password checks, a Crypto-Binding check missing in production builds, and an unexpected Crypto-Binding TLV that short-circuits authentication; TEAP is not enabled by default. The project credits Anthropic, using agents with Ada Logics, for two of the EAP-FAST findings (the weak randomness and the stack overflow) and Ozgun Kultekin, who also reported the RealVNC flaw, for the TTLS one.
      Not stated by the sources: any proof of concept, exploitation, or which network position reaches the listener. Mechanically, an EAP-TTLS session is opened by a supplicant through a network access server, so the attacker needs a path that lets 802.1X (or a RADIUS proxy chain) traffic reach the server.
    region_nexus: "global; no Switzerland-specific reporting. RADIUS servers commonly authenticate Wi-Fi, wired 802.1X and VPN access in administrations (context, not from the sources)."
    primary_sector_nexus: "indirect (authentication infrastructure; no sector targeting reported)"
    sector: "technology"
    cves: []
    techniques: [T1190]
    affected_products: ["FreeRADIUS"]
    entity_keys: []
    new_entities:
      - { key: "product:freeradius", type: product, name: "FreeRADIUS", aliases: ["FreeRADIUS Server"], summary: "Open-source RADIUS authentication server; versions before 3.0.29 and 3.2.11 carry the 2026-11-25 batch of overflow and authentication flaws (FreeRADIUS project, 2026-11-25)." }
    verification: SINGLE-SOURCE-OTHER
    confidence: HIGH
    suggested_classification: { reliability: A, credibility: 2, note: "vendor/project first-party disclosure restated by CERT-FR (not an independent observation); no exploitation or PoC stated" }
    suggested_priority: notable
    novelty: new
    evidence:
      - quote: "We have released 3.0.29 and 3.2.11 to fix various overflows and memory leaks. We recommend that everyone using earlier versions of FreeRADIUS upgrade to one of these new releases."
        attribution: "FreeRADIUS project"
        source_url: "https://freeradius.org/security/"
      - quote: "The TTLS module is enabled in the default configuration."
        attribution: "FreeRADIUS project"
        source_url: "https://freeradius.org/security/"
      - quote: "An unauthenticated user could start an EAP-TTLS session, then send invalid “inner-tunnel” data. This could cause a “use after free” issue in the TTLS module."
        attribution: "FreeRADIUS project"
        source_url: "https://freeradius.org/security/"
      - quote: "With heap shaping, an attacker can cause a write of a heap pointer to a chosen address. Code execution may be possible."
        attribution: "FreeRADIUS project"
        source_url: "https://freeradius.org/security/"
      - quote: "An unauthenticated user could start a TEAP session, and send unexpected Crypto-Binding TLV, causing the server to return an Access-Accept."
        attribution: "FreeRADIUS project"
        source_url: "https://freeradius.org/security/"
    extended_notes: |
      Exposure: FreeRADIUS before 3.0.29 or 3.2.11 (radiusd -v); the default-enabled paths are EAP-TLS, TTLS and PEAP, so a stock install is in scope for the TTLS use-after-free; TEAP, EAP-FAST, EAP-SIM and DHCP are off by default, so check whether the eap module or a dhcp listener enables them. Detection concept: radiusd crashes or restarts coinciding with EAP-TTLS handshakes (process-crash and service-restart events, core dumps), and on TEAP-enabled servers Access-Accept responses for TEAP sessions with no successful inner-method authentication in the authentication detail log (an inference from the stated mechanism, not a source-supplied rule). Post-patch compromise check: heap-corruption exploitation may leave only a crash; review radiusd restarts and RADIUS accounting gaps in the days before the upgrade. Hardening: upgrade both branches; disable unused EAP methods; limit which NAS and proxy addresses may reach the listener.
    borderline: false

