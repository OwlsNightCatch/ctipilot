  discovery_trace: 'S1 findings.S1.yaml item 2 (cert-fr bridge avis-recent -> CERTFR-2026-AVI-1632 -> freeradius.org/security) -> this follow-up re-fetched all with extract -> NEW: EUVD search https://euvdservices.enisa.europa.eu/api/search?text=freeradius&size=100&page=0 (unrestricted by date) -> EUVD-2026-124536 / -124535 -> CVE records (cveawg) -> Red Hat CVE pages -> GHSA/Debian tracker -> GitHub release notes 3.0.29 / 3.2.11'
  headline_findings:
  - 'CORRECTION to S1: CVE ids DO exist for two of the 21 issues. Red Hat (as CNA) published CVE-2026-127030 (EAP-FAST session-ticket stack overflow) and CVE-2026-127029 (EAP-SIM identity-length stack overflow) on 2026-11-12, thirteen days before the project page. S1 searched EUVD for 2026-11-20..28 only. Neither the project page nor CERT-FR cites them (CERT-FR JSON cves list is empty). The match to the project page is by commit hash and credited reporter (an inference from the records, not stated by either party); see mapping below.'
  - 'The project page lists 21 issues: 1 Critical, 8 High, 5 Medium, 7 Low (counted from the page, not stated as a total by the project).'
  - The only Critical and the only issue where the project says code execution may be possible is the TTLS use-after-free; TTLS is enabled in the default configuration; fixed on both branches (3.2.x commit 1010ef8a7d, 3.0.x commit ac339bc4e7). No CVE id was found for it in EUVD (searches on freeradius, TTLS, TEAP, radius for November returned no matching record).
  - Of the eight High issues, seven sit in modules the project says are not enabled by default (DHCP 1, EAP-FAST 3, EAP-SIM 1, TEAP 2) and one (EAP-MSCHAPv2) sits in a module for which the page states no default. The default-enabled modules (EAP-MD5, the TLS block for EAP-TLS/TTLS/PEAP, TTLS) carry two Low issues (EAP-MD5 local-administrator over-read, TLS session-ticket lifetime) and the one Critical TTLS issue.
  - 'Three TEAP issues (all Medium, TEAP off by default, fixed on v3.2.x only: no 3.0.x commit listed) can make the server return Access-Accept to an unauthenticated TEAP peer.'
  - No exploitation in the wild, no public PoC statement for the 2026.11.25 batch. Ada Logics created a proof of concept for its report to the project on the two EAP-FAST issues (private). Not in CISA KEV (catalogVersion 2026.11.27).
