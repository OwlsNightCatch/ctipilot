    heading_block_verbatim: '### Use-after-free in TTLS


      - Severity: Critical

      - Commit: [`1010ef8a7d`](https://github.com/FreeRADIUS/freeradius-server/commit/1010ef8a7d) on v3.2.x

      - Commit: [`ac339bc4e7`](https://github.com/FreeRADIUS/freeradius-server/commit/ac339bc4e7) on v3.0.x

      - Credit: Issue found by Ozgun Kultekin'
    description_verbatim: 'An unauthenticated user could start an EAP-TTLS session, then send invalid “inner-tunnel” data. This could cause a “use after free” issue in the TTLS module.


      With heap shaping, an attacker can cause a write of a heap pointer to a chosen address. Code execution may be possible.'
