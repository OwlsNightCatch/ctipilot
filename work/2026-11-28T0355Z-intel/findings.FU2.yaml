    verbatim_passage: '### Unexpected Crypto-Binding TLV could short-circuit authentication in TEAP


      - Severity: Medium

      - Commit: [`282adf624a`](https://github.com/FreeRADIUS/freeradius-server/commit/282adf624a) on v3.2.x

      - Credit: Issue reported by Loïc Haas'
  - item: A
    claim: 'TEAP Access-Accept #3 wording'
    source_url: https://freeradius.org/security/
    verbatim_passage: An unauthenticated user could start a TEAP session, and send unexpected Crypto-Binding TLV, causing the server to return an Access-Accept.
  - item: A
    claim: 'TEAP High: bounds checking on TLVs (heap over-read, crash)'
    source_url: https://freeradius.org/security/
    verbatim_passage: An unauthenticated user could start a TEAP session, and send malformed TLVs. This could cause a heap over-read, and a crash.
  - item: A
    claim: 'TEAP High: infinite loop from malformed TLVs'
    source_url: https://freeradius.org/security/
    verbatim_passage: Malformed TEAP TLVs could cause the server to create a circular linked list, resulting in an infinite loop. The server could then become unresponsive.
  - item: A
    claim: 'TEAP Medium: malformed outer TLVs crash (assertion in debug builds, read overflow in production)'
    source_url: https://freeradius.org/security/
    verbatim_passage: An unauthenticated user could start a TEAP session, then send malformed outer TLVs, which would reach an assertion in debug builds, causing the server to crash. Production builds without assertions would perform a read overflow, and crash in a different way.
  - item: A
    claim: EAP-FAST is not enabled by default
    source_url: https://freeradius.org/security/
    verbatim_passage: EAP-FAST is not enabled in the default configuration.
  - item: A
    claim: 'EAP-FAST High: weak randomness could let an attacker decrypt the PAC'
    source_url: https://freeradius.org/security/
    verbatim_passage: Insufficient randomness in EAP-FAST could let an attacker decrypt the PAC.
  - item: A
    claim: 'EAP-FAST High: stack overflow in the handshake'
    source_url: https://freeradius.org/security/
    verbatim_passage: This commit fixes a high-severity security issue related to possible stack overflow in the EAP-FAST handshake process.
  - item: A
    claim: 'EAP-FAST High: invalid TLVs from an unauthenticated user cause an over-read and crash'
    source_url: https://freeradius.org/security/
    verbatim_passage: An unauthenticated user could start an EAP-FAST session, and send invalid TLVs or values. This could cause an over-read, and a crash.
  - item: A
    claim: DHCP is not enabled by default; High out-of-bounds write in the option encoder, exploitable by unauthenticated users
    source_url: https://freeradius.org/security/
    verbatim_passage: '### Unauthenticated out-of-bounds write in the DHCP option encoder


      - Severity: High

      - Commit: [`48145a599b`](https://github.com/FreeRADIUS/freeradius-server/commit/48145a599b) on v3.2.x

      - Commit: [`42bd54cacb`](https://github.com/FreeRADIUS/freeradius-server/commit/42bd54cacb) on v3.0.x

      - Author: Alan T. DeKok [aland@freeradius.org](mailto:aland@freeradius.org)

      - Credit: Issue found by A. Ramos'
  - item: A
    claim: DHCP issue wording
    source_url: https://freeradius.org/security/
    verbatim_passage: 'The internal “encode dhcp option” function did not perform sufficient bounds checks when encoding DHCP options. An invalid option could cause the server to crash.


      This issue is exploitable by unauthenticated users.'
  - item: A
    claim: 'EAP-MSCHAPv2 High: insufficient length checks, over-read, potential crash; four commits on v3.2.x and one on v3.0.x'
    source_url: https://freeradius.org/security/
    verbatim_passage: '### Insufficient length checks in EAP-MSCHAPv2 responses


      - Severity: High

      - Commit: [`97e60237b9`](https://github.com/FreeRADIUS/freeradius-server/commit/97e60237b9) on v3.2.x

      - Commit: [`4beea8114e`](https://github.com/FreeRADIUS/freeradius-server/commit/4beea8114e) on v3.2.x

      - Commit: [`965fe93450`](https://github.com/FreeRADIUS/freeradius-server/commit/965fe93450) on v3.2.x

      - Commit: [`7f95b43bbe`](https://github.com/FreeRADIUS/freeradius-server/commit/7f95b43bbe) on v3.2.x

      - Commit: [`02b79b63c9`](https://github.com/FreeRADIUS/freeradius-server/commit/02b79b63c9) on v3.0.x

      - Credit: Alan T. DeKok [aland@freeradius.org](mailto:aland@freeradius.org)'
  - item: A
    claim: EAP-MSCHAPv2 wording
    source_url: https://freeradius.org/security/
    verbatim_passage: The EAP-MSCHAPv2 module performed insufficient bounds checks on response attributes and password change attributes. The result is an over-read, potentially causing a crash.
  - item: A
    claim: 'EAP-SIM High: long identity overflows a buffer and crashes the server; EAP-SIM not enabled by default'
    source_url: https://freeradius.org/security/
    verbatim_passage: 'The server performed insufficient validation of EAP-SIM identity lengths. In some cases, a long identity could overflow a buffer, causing the server to crash.


      EAP-SIM is not enabled in the default configuration.'
  - item: A
    claim: 'TLS Low: session tickets can be renewed forever in the default configuration'
    source_url: https://freeradius.org/security/
    verbatim_passage: In the default configuration, authenticated users could renew their session tickets (EAP-TLS, TTLS, PEAP, and FAST) forever. There was no policy to double-check the users account in an database.
  - item: A
    claim: 'Credit: Anthropic (agents) with Ada Logics for the EAP-FAST randomness and stack-overflow issues; Ada Logics produced a proof of concept for the report to the project (not a public PoC)'
