      published: '2026-11-12'
      cvss31: 7.5 AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H
      cwe: CWE-787
      red_hat_rating: Important
      subject: 'EAP-FAST: stack buffer overflow via unchecked session-ticket length; crash/DoS; unauthenticated remote'
      upstream_commits_cited:
      - 064567a08f
      - a5d09dad52
      credits: 'Red Hat: s4cr00t (Alipay Security Team); upstream: Ada Logics, TristanInSec@gmail.com'
    - cve: CVE-2026-127029
      euvd: EUVD-2026-124535
      ghsa: GHSA-gfm6-4qp3-m8ch
      assigner: Red Hat
      published: '2026-11-12'
      cvss31: 7.5 AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H
      cwe: CWE-787
      red_hat_rating: Important
      subject: 'EAP-SIM: stack buffer overflow via unbounded client-supplied identity length; crash/DoS; unauthenticated remote'
      upstream_commits_cited:
      - 064567a08f
      - e415f818dc
      credits: 'Red Hat: s4cr00t (Alipay Security Team); upstream: Glen Saunders'
    mapping_inference: 'Mine, from the cited records: CVE-2026-127030 cites 064567a08f and a5d09dad52, which the project page lists as the fixes for "Possible stack overflow in EAP-FAST" (v3.2.x) and "Insufficient bounds checking on TLVs and values for EAP-FAST" (v3.0.x), and its upstream credits (Ada Logics, TristanInSec) match the project credits for those two issues. CVE-2026-127029 cites e415f818dc, the project page v3.0.x fix for "Insufficient validation of EAP-SIM Identity Length", credited to Glen Saunders on both pages. The EAP-SIM record also cites 064567a08f, which the project page lists under the EAP-FAST stack overflow (anomaly in the CNA references; unexplained).'
    no_cve_found_for: 'The Critical TTLS use-after-free, the three TEAP Access-Accept issues, DHCP, EAP-MSCHAPv2, EAP-FAST PAC randomness (may fall under one of the EAP-FAST CVEs: unknown), and all others. EUVD text searches for freeradius (51 records total, only these two from 2026), radius, TTLS and TEAP (November window) returned no further FreeRADIUS record.'
    epss: 'FIRST 2026-11-27: CVE-2026-127030 0.00832 (percentile 0.54879); CVE-2026-127029 0.00998 (percentile 0.61697). The EUVD JSON epss field shows 0.83 and 1.0 for the same two records (consistent with percent units, an inference).'
    kev: Neither CVE is in the CISA KEV catalogue (catalogVersion 2026.11.27).
  exploitation_and_poc:
    in_the_wild: Not stated anywhere for the 2026.11.25 batch (project page, CERT-FR, Red Hat, EUVD, release notes).
    public_poc: 'None stated. The project page says only: for the EAP-FAST randomness and stack-overflow issues, Ada Logics "created a Proof-of-Concept" for its report to the project (private); for the Low abinary issue "There is no route to any public exploit." The earlier 2026.06.01 block says "Everyone can run those tools to either get more information, or else see if it’s possible to create an exploit."'
    lead_not_verified: A WebSearch result snippet attributed to thehackerwire.com claimed a KEV listing and a 9.0-10.0 score for CVE-2026-127030; the page was not fetched, and the CISA KEV catalogue JSON (2026.11.27) contains neither CVE, and the CVE record, Red Hat and EUVD all give 7.5. Treat as unsupported.
