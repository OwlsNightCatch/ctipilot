  exposure_conditions:
    vendor_exposed: This affects all customers using our cloud-hosted connectivity and manually configured direct connections (including offline licensed/on-premises deployments).
    vendor_not_exposed: TCP-only direct connections are not exposed.
    udp_port_or_protocol_named: No. Neither the advisory, the CVE record, the EUVD record nor heise names a UDP port, a protocol name beyond "UDP-based connections", a listener, or a configuration switch to disable UDP. (Checked by grep for port/5900/firewall/workaround in the advisory body, heise and the CVE record.)
    root_wording: 'Vendor: "This could allow an attacker to remotely execute code as root on certain platforms or perform a denial of service attack." Platforms are not named by any source.'
    viewer_direction_unknown: The Viewers and the Connect app are listed as affected, but no source states whether exploitation of a Viewer needs a malicious server or peer; unstated.
  remedy_wording:
    general: Update to the latest versions available of each application.
    on_demand_assist: 1. Download the latest version from https://www.realvnc.help/en/ ; 2. Advise end users to delete any copies of older versions that they previously downloaded.
    viewer_server_connect: Download the latest version from https://www.realvnc.com/en/connect/download/ and install the updated versions on your devices.
    classic_viewer: Go to https://manage.realvnc.com, then Downloads (v7.x only for eligible Premium and Enterprise subscription holders).
    mobile: Mobile applications should update automatically (store update links given per app).
    workaround: None stated by any source.
  cvss_and_epss:
    vendor: Critical, CVSS 9.8 (no vector, no version stated)
    cve_record: CVSS 3.1, 9.8 CRITICAL, CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H; CWE-787 Out-of-bounds Write; CNA = MITRE; record text says "In RealVNC Server before 7.19.1" but lists all products
    euvd: same vector and 9.8; epss 0.0 in the EUVD JSON (dataProcessed 2026-11-28); GHSA alias GHSA-v49f-q363-3644
    first_epss: 0.00671 (percentile 0.47083), date 2026-11-27
    difference: 'Score and severity agree across vendor, CVE record, EUVD and GitHub; only the CVE record and EUVD carry the vector. EPSS differs between the EUVD JSON (0.0) and FIRST (0.00671): EUVD value appears not yet populated.'
  exploitation_statement: 'Vendor: "At the time of publication, we are not aware of this vulnerability being actively exploited." (2026-11-20). heise repeats it as "laut Hersteller". No PoC, technical write-up or scanning report found (Wakefield research page lists only an OpenSSH item; the CVE record points to it as the third-party advisory). Not in CISA KEV.'
  heise_adds:
  - German-language report dated 2026-11-27 (author Dirk Knop) that restates the advisory; no independent technical analysis.
  - Assertion that RealVNC is "weltweit bei tausenden Organisationen eingesetzt" (no source, no number).
  - Groups affected builds as desktop (Linux, macOS, Windows) and mobile (Android, iOS, iPadOS).
  - 'Download locations: RealVNC download page; Classic Viewer on a different site (manage.realvnc.com) for Premium or Enterprise subscribers only; On-Demand Assist from the help site, older downloaded copies should be deleted; mobile apps from the stores, which "should" update automatically.'
  - Fixes available "seit Freitag vergangener Woche" (Friday of last week = 2026-11-20, consistent with the advisory).
  - Links the NVD per-CVE page (not citable) and a prior TeamViewer article from October for context.
  - 'Does not add: CVSS vector, port, mitigation, detection, reporter, exploitation evidence.'
  release_notes_context: 'Server 7.19.1 release notes (Release Date "November 2026") carry one SECURITY line: "We’ve fixed a security vulnerability in the app and strongly recommend updating all RealVNC applications (RealVNC Server, RealVNC Viewer, RealVNC Classic Viewer, and the RealVNC Connect app) to the latest versions as soon as possible." The release notes link the advisory.'
