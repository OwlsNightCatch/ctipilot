    source_url: https://freeradius.org/security/
    verbatim_passage: We recommend keeping your RADIUS server on a management VLAN, and not exposed to the Internet. We recommend disabling all features which you are not using.
  - item: A
    claim: 'The 2026.06.01 announcement: a pre-authentication UDP crash in NAS-Filter-Rule (context, earlier release 3.0.28/3.2.9)'
    source_url: https://freeradius.org/security/
    verbatim_passage: A well-formed, but long NAS-Filter-Rule attribute could cause the server to crash. This crash is before the packet is authenticated via the shared secret, so it can be exploited by anyone who can send UDP packets to the server.
  - item: A
