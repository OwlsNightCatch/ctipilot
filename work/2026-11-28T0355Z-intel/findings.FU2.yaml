    credit_verbatim: Issue found by A. Ramos
    module_default_statement: DHCP is not enabled in the default configuration.
    heading_block_verbatim: '### Unauthenticated out-of-bounds write in the DHCP option encoder


      - Severity: High

      - Commit: [`48145a599b`](https://github.com/FreeRADIUS/freeradius-server/commit/48145a599b) on v3.2.x

      - Commit: [`42bd54cacb`](https://github.com/FreeRADIUS/freeradius-server/commit/42bd54cacb) on v3.0.x

      - Author: Alan T. DeKok [aland@freeradius.org](mailto:aland@freeradius.org)

      - Credit: Issue found by A. Ramos'
    description_verbatim: 'The internal “encode dhcp option” function did not perform sufficient bounds checks when encoding DHCP options. An invalid option could cause the server to crash.


      This issue is exploitable by unauthenticated users.'
