  - item: A
    claim: CVE-2026-127029 description (DoS only; EUVD JSON escapes the apostrophe so the Red Hat copy is quoted)
    source_url: https://access.redhat.com/security/cve/CVE-2026-127029
    verbatim_passage: A flaw was found in freeradius's Extensible Authentication Protocol Method for Subscriber Identity Module (EAP-SIM) module. When handling authentication requests, the server copies a client-supplied identity into an internal structure without properly checking its length against a fixed-size buffer. An unauthenticated remote attacker can exploit this issue by sending specially crafted EAP-SIM messages, triggering a stack buffer overflow that crashes the service and results in a Denial of Service (DoS).
