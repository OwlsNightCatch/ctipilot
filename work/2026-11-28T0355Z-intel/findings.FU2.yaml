    credit: 'Yuvraj Pradhan (abinary); Chase Bevan-Thomas (Long-Extended attribute); Arran Cudbard-Bell (external-database expansion); GitHub issues #5943 and #5973 (leaks); Alan T. DeKok (EAP-MD5, EAP-MSCHAPv2, TEAP infinite loop); Mark Hawking (TOTP)'
  eap_methods_default_3x: 'Project wording: "EAP-TLS, TTLS, and PEAP are enabled in the default configuration." and "EAP-MD5 is enabled in the default configuration." and "The TTLS module is enabled in the default configuration." Not enabled by default per the page: DHCP, EAP-FAST, EAP-SIM, TEAP, TOTP. The page states no default for EAP-MSCHAPv2. Release notes of 3.0.29 and 3.2.11 say "PEAP/SoH" functionality was removed (likely only the SoH part; the security page, same release, still calls PEAP default-enabled): unresolved wording ambiguity.'
  version_read: 'The project page does not say how to read the version. A distribution man page for radiusd(8) lists the option: "-v Print server version information and exit." (Arch Linux man page). Binary and package names differ per distribution (Debian tracker lists the source package freeradius; Debian/Ubuntu man pages appear under freeradius(8) in search results that were not fetched). Debian tracker status as fetched 2026-11-28: bookworm 3.2.1+dfsg-4+deb12u1, trixie 3.2.7+dfsg-1+deb13u2 and sid 3.2.10+dfsg-2 vulnerable (to the two Red Hat CVEs), unstable unfixed.'
  project_hardening_context: 'The 2026.06.01 block on the same page (not the Nov block): "We recommend keeping your RADIUS server on a management VLAN, and not exposed to the Internet. We recommend disabling all features which you are not using." and a pre-authentication UDP crash via a long NAS-Filter-Rule attribute fixed in 3.0.28/3.2.9. The Nov block gives no workaround other than the module-disabled statement and upgrading; server-core issues "can be addressed only by upgrading".'
