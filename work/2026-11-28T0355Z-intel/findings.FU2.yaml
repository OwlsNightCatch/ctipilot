    description_verbatim: 'This commit fixes a high-severity security issue related to possible stack overflow in the EAP-FAST handshake process.


      This issue was found by Anthropic using agents to study the security of open source projects, with help from Ada Logics. Claude was used to find the issue. The team from Ada Logics manuaally validated the issue, created a Proof-of-Concept, created the report, and and notified the FreeRADIUS maintainers via email at the provided security@freeradius.org address.


      The FreeRADIUS team validated the issue, then created and validated the fix in coordination with Anthropic and Ada Logics.


      The Ada Logics team includes Arthur Chan, David Korcyznski, and Adam Korcyznski.'
