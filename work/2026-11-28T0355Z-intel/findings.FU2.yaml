  fixed_versions:
    3.0.x branch: '3.0.29 (project: "3.0.29 and 3.2.11"; 3.0.29 is stated to be planned as the last 3.0 release)'
    3.2.x branch: '3.2.11 (release notes: "All previous versions of 3.2 are deprecated, and should not be used.")'
    branch_applicability: Per the project page, TEAP issues (6) and the TOTP issue list only a v3.2.x commit, i.e. affect 3.2.x only; the other 14 list a v3.0.x commit as well (EAP-MSCHAPv2 lists four commits on v3.2.x and one on v3.0.x).
    affected_per_CERT-FR: FreeRADIUS versions 3.2.x antérieures à 3.2.11; FreeRADIUS versions antérieures à 3.0.29
    date_note: Project page is dated 2026.11.25; the GitHub release pages are dated 26 Nov (3.0.29 page metadata 2026-11-26).
  code_execution_wording: 'Only for the TTLS use-after-free: "With heap shaping, an attacker can cause a write of a heap pointer to a chosen address. Code execution may be possible." For no other issue does the project text claim code execution; the other memory issues are described as crash, over-read or overflow "causing the server to crash". CERT-FR summary: "Certaines d''entre elles permettent à un attaquant de provoquer une exécution de code arbitraire à distance, un déni de service à distance et une atteinte à la confidentialité des données." (does not say which).'
  teap_access_accept_wording: 'Three Medium TEAP issues, each beginning "An unauthenticated user could start a TEAP session": (1) sends unexpected data so the server skips the Basic-Password checks, "causing the server to return an Access-Accept"; (2) sends an invalid Crypto-Binding TLV that debug builds reject, "This check was missing in production builds, which causes the server to return an Access-Accept"; (3) sends an unexpected Crypto-Binding TLV, "causing the server to return an Access-Accept". Fixed commits are listed on v3.2.x only. TEAP is not enabled in the default configuration.'
  cve_status:
    project_page: 'No CVE id appears anywhere in the 2026.11.25 block (asserted programmatically: the string CVE is absent from the block). The 2026.06.01 block on the same page says the project is bypassing the normal CVE process.'
    cert_fr: cves list empty in the CERT-FR JSON.
    euvd_cve_program:
    - cve: CVE-2026-127030
      euvd: EUVD-2026-124536
