  evidence:
  - quote: We have released 3.0.29 and 3.2.11 to fix various overflows and memory leaks. We recommend that everyone using earlier versions of FreeRADIUS upgrade to one of these new releases.
    attribution: FreeRADIUS project
    source_url: https://freeradius.org/security/
  - quote: The TTLS module is enabled in the default configuration.
    attribution: FreeRADIUS project
    source_url: https://freeradius.org/security/
  - quote: An unauthenticated user could start an EAP-TTLS session, then send invalid “inner-tunnel” data. This could cause a “use after free” issue in the TTLS module.
    attribution: FreeRADIUS project
    source_url: https://freeradius.org/security/
  - quote: With heap shaping, an attacker can cause a write of a heap pointer to a chosen address. Code execution may be possible.
    attribution: FreeRADIUS project
    source_url: https://freeradius.org/security/
  - quote: EAP-TLS, TTLS, and PEAP are enabled in the default configuration.
    attribution: FreeRADIUS project
    source_url: https://freeradius.org/security/
  - quote: TEAP is not enabled in the default configuration.
    attribution: FreeRADIUS project
    source_url: https://freeradius.org/security/
  - quote: An unauthenticated user could start a TEAP session, and send unexpected Crypto-Binding TLV, causing the server to return an Access-Accept.
    attribution: FreeRADIUS project
    source_url: https://freeradius.org/security/
  - quote: This check was missing in production builds, which causes the server to return an Access-Accept.
    attribution: FreeRADIUS project
    source_url: https://freeradius.org/security/
  - quote: An unauthenticated user could start a TEAP session, and send unexpected data which would make server skip the checks for Basic-Password authentication, causing the server to return an Access-Accept.
    attribution: FreeRADIUS project
    source_url: https://freeradius.org/security/
  - quote: If that module or component is not enabled on your system, you are not vulnerable.
    attribution: FreeRADIUS project
    source_url: https://freeradius.org/security/
  - quote: This issue is exploitable by unauthenticated users.
    attribution: FreeRADIUS project
    source_url: https://freeradius.org/security/
  - quote: Certaines d'entre elles permettent à un attaquant de provoquer une exécution de code arbitraire à distance, un déni de service à distance et une atteinte à la confidentialité des données.
    attribution: CERT-FR
    source_url: https://www.cert.cyber.gouv.fr/avis/CERTFR-2026-AVI-1632/
  - quote: '"title":"Freeradius: stack buffer overflow via unchecked eap-fast sessionticket length"'
    attribution: CVE Program (Red Hat CNA)
    source_url: https://cveawg.mitre.org/api/cve/CVE-2026-127030
  - quote: In typical Red Hat Enterprise Linux deployments, EAP-FAST is an optional authentication method that is not enabled by default.
    attribution: Red Hat
    source_url: https://access.redhat.com/security/cve/CVE-2026-127030
  - quote: Everyone should migrate to 3.2.11 or later.
    attribution: FreeRADIUS project (GitHub release 3.0.29)
    source_url: https://github.com/FreeRADIUS/freeradius-server/releases/tag/release_3_0_29
  contradictions:
  - 'S1 said no CVE ids exist and EUVD had no FreeRADIUS record. Wrong: two Red Hat-assigned CVEs (CVE-2026-127030, CVE-2026-127029) published 2026-11-12 map by commit and credit to three of the 21 issues (EAP-FAST stack overflow, EAP-FAST TLV bounds, EAP-SIM identity length). S1 had date-limited its EUVD search.'
  - 'Severity: the project rates the EAP-FAST stack overflow and the EAP-SIM issue High; Red Hat/CVE records rate the corresponding CVEs Important, CVSS 7.5 with availability impact only (crash/DoS). The project text for those two issues does not claim code execution either.'
  - CERT-FR lists remote code execution among the risks; on the project page only the TTLS use-after-free carries "Code execution may be possible". CERT-FR does not say which issue.
  - 'CERT-FR risk list includes "Atteinte à la confidentialité des données" (data-confidentiality loss): the project page supports this only indirectly (EAP-FAST "could let an attacker decrypt the PAC"; over-reads); CERT-FR does not map it.'
  - CERT-FR affected-versions line "FreeRADIUS versions antérieures à 3.0.29" is unqualified; the project says TEAP and TOTP issues affect only the 3.2.x branch.
  - The CVE-2026-127029 (EAP-SIM) record cites commit 064567a08f, which the project page lists as the EAP-FAST stack-overflow fix on v3.2.x; the project lists 8e8a991c04 (v3.2.x) and e415f818dc (v3.0.x) for EAP-SIM.
  - 'Release date: project page 2026.11.25 versus GitHub release pages 26 Nov.'
  - The release notes say "PEAP / SoH functionality has been removed" while the project security page (same release) lists PEAP among default-enabled methods; wording ambiguity, probably the SoH extension only.
  not_readable:
  - 'GitHub releases listing (https://github.com/FreeRADIUS/freeradius-server/releases) was read only through WebFetch (summary): used only for the 26 Nov dates; its text is not in a saved body. The individual release pages were read with extract (3.2.11 page metadata date is bogus, 2011-02-03).'
  - Individual commit pages and the FreeRADIUS GitHub security advisories list were not read; fix commits are not needed for an entry and no per-issue code detail beyond the project text was used.
  - Red Hat Bugzilla 2572340 / 2572339 (cited by the CVE records) not fetched.
  - 'Whether the EAP-FAST PAC-randomness issue falls under CVE-2026-127030: no source says.'
  - 'TTLS and TEAP CVE ids: none found; absence in EUVD is not proof none exists (the CVE API has no keyword search; cve.org search not tried).'
  - No source states how the version is read from the project itself; no source names a RADIUS port for the Nov batch (only Red Hat names 1812 and 1813).
