      - Credit: Found by Anthropic using agents, with help from Ada Logics. Claude found the issue. Ada Logics validated the issue, wrote a proof of concept and the report, and notified security@freeradius.org. The Ada Logics team includes Arthur Chan, David Korcyznski, and Adam Korcyznski.'
    description_verbatim: 'Insufficient randomness in EAP-FAST could let an attacker decrypt the PAC.


      This issue was found by Anthropic using agents to study the security of open source projects, with help from Ada Logics. Claude was used to find the issue. The team from Ada Logics manually validated the issue, created a Proof-of-Concept, created the report, and notified the FreeRADIUS maintainers via email at the provided security@freeradius.org address.


      The FreeRADIUS team validated the issue, then created and validated the fix in coordination with Anthropic and Ada Logics.


      The Ada Logics team includes Arthur Chan, David Korcyznski, and Adam Korcyznski.'
