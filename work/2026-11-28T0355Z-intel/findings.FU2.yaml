  - item: B
    claim: 'heise: weltweit bei tausenden Organisationen eingesetzt (heise assertion, no source or number given)'
    source_url: https://www.heise.de/news/RealVNC-Sicherheitsleck-ermoeglicht-Schadcode-Schmuggel-ohne-Anmeldung-11540429.html
    verbatim_passage: Die weltweit bei tausenden Organisationen eingesetzte Fernwartungssoftware RealVNC weist eine schwerwiegende Schwachstelle auf.
  - item: B
    claim: 'heise: pre-auth code execution or crash; no active attacks known per vendor'
    source_url: https://www.heise.de/news/RealVNC-Sicherheitsleck-ermoeglicht-Schadcode-Schmuggel-ohne-Anmeldung-11540429.html
    verbatim_passage: Angreifer können ohne vorherige Authentifizierung Schadcode über das Netz einschleusen und ausführen oder die Software zum Absturz bringen. Aktive Angriffe sind laut Hersteller bislang nicht bekannt.
  - item: B
    claim: 'heise: memory-safety flaw in UDP connections, root on some platforms, DoS alternative'
    source_url: https://www.heise.de/news/RealVNC-Sicherheitsleck-ermoeglicht-Schadcode-Schmuggel-ohne-Anmeldung-11540429.html
    verbatim_passage: Demnach handelt es sich um eine Schwachstelle in der Speichersicherheit, die UDP-basierte Verbindungen betrifft. Angreifer können dabei ohne Anmeldung beliebigen Code einschleusen und auf einigen Plattformen sogar mit Root-Rechten ausführen. Alternativ lässt sich die Lücke für Denial-of-Service-Attacken missbrauchen.
  - item: B
    claim: 'heise: exposure conditions and TCP-only statement with CVE id, CVSS 9.8'
    source_url: https://www.heise.de/news/RealVNC-Sicherheitsleck-ermoeglicht-Schadcode-Schmuggel-ohne-Anmeldung-11540429.html
    verbatim_passage: Betroffen sind sowohl Verbindungen über die Cloud-Vermittlung von RealVNC als auch manuell konfigurierte Direktverbindungen, einschließlich Offline- und On-Premises-Installationen. Reine TCP-Verbindungen hingegen sind nicht anfällig ([CVE-2026-137738](https://nvd.nist.gov/vuln/detail/cve-2026-137738), CVSS **9.8**, Risiko „**kritisch**“).
  - item: B
    claim: 'heise: fixes available since "Friday of last week" (Friday 2026-11-20 given heise date 2026-11-27)'
    source_url: https://www.heise.de/news/RealVNC-Sicherheitsleck-ermoeglicht-Schadcode-Schmuggel-ohne-Anmeldung-11540429.html
    verbatim_passage: Diese stehen seit Freitag vergangener Woche zum Herunterladen auf der [Download-Seite von RealVNC](https://www.realvnc.com/en/connect/download/) bereit.
  - item: B
