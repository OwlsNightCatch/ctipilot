    credit_verbatim: Found by Anthropic using agents, with help from Ada Logics. Claude found the issue. Ada Logics validated the issue, wrote a proof of concept and the report, and notified security@freeradius.org. The Ada Logics team includes Arthur Chan, David Korcyznski, and Adam Korcyznski.
    module_default_statement: EAP-FAST is not enabled in the default configuration.
    heading_block_verbatim: '### Incorrect use of randomness in EAP-FAST could expose the PAC


