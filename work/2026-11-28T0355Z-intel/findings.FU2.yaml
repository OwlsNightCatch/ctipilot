  contradictions:
  - 'No substantive contradiction between sources. Differences in presentation: vendor gives no CVSS vector (CVE record and EUVD do); the CVE record describes the flaw as "In RealVNC Server before 7.19.1" yet lists nine products; the CVE record names products differently ("RealVNC iOS Viewer", "RealVNC Android Server") from the vendor ("RealVNC Viewer iOS"); the vendor Affected row says "iOS" while the Fixed row says "iOS/iPadOS".'
  - 'EPSS: EUVD JSON 0.0 versus FIRST 0.00671 (EUVD not yet populated).'
  - 'Dates: advisory 2026-11-20 (not updated); CVE record, EUVD, GHSA 2026-11-27 (seven days later); heise 2026-11-27 says the fixes have been available "since Friday of last week".'
  - 'heise says "Cloud-Vermittlung" (cloud brokering); the vendor says "cloud-hosted connectivity": a paraphrase, same meaning as far as the sources show.'
  not_readable:
  - The RealVNC advisory page was readable only through the jina reader (extract fell back to it); no direct transport returned the advisory body. The saved body is the full page including navigation; the advisory text is lines 459-550.
  - 'No technical write-up by the reporter: wakefield.co/research is a JS page read through the jina reader and lists only an OpenSSH article.'
  - No source names the UDP port, the platforms affected as root, any workaround, any detection, or the Viewer-side attack direction.
  - NVD per-CVE page not used (not citable).
