  - module: TLS
    title: TLS-Based EAP methods did not sufficiently enforce lifetimes
    severity: Low
    fixed_on_branches:
    - v3.0.x
    - v3.2.x
    fix_commits:
    - commit: 5e6970bd80
      branch: v3.2.x
    - commit: b763fd9b77
      branch: v3.0.x
    credit_verbatim: Issue reported by Mathy Vanhoef
    module_default_statement: EAP-TLS, TTLS, and PEAP are enabled in the default configuration. All of those methods are affected by the following issues. If TEAP and FAST are enabled, they are also affected.
    heading_block_verbatim: '### TLS-Based EAP methods did not sufficiently enforce lifetimes


      - Severity: Low

      - Commit: [`5e6970bd80`](https://github.com/FreeRADIUS/freeradius-server/commit/5e6970bd80) on v3.2.x

      - Commit: [`b763fd9b77`](https://github.com/FreeRADIUS/freeradius-server/commit/b763fd9b77) on v3.0.x

      - Credit: Issue reported by Mathy Vanhoef'
    description_verbatim: 'In the default configuration, authenticated users could renew their session tickets (EAP-TLS, TTLS, PEAP, and FAST) forever. There was no policy to double-check the users account in an database.


      The `session-lifetime` configuration is now enforced across not just

      the current session, but also across all resumed sessions.  After the

      `session-lifetime` has expired, users must perform a full

      re-authentication.


      The default configuration has also been updated to document the need for re-validation of user accounts. As the server supports a large number of databases, it is not possible to update the default configuration with a policy that works for all databases.'
  - module: TOTP
    title: Crash in TOTP module
    severity: Low
    fixed_on_branches:
    - v3.2.x
    fix_commits:
    - commit: 3e3f26119a
      branch: v3.2.x
    credit_verbatim: Issue found by Mark Hawking
    module_default_statement: The TOTP module is not enabled in the default configuration.
    heading_block_verbatim: '### Crash in TOTP module


      - Severity: Low

      - Commit: [`3e3f26119a`](https://github.com/FreeRADIUS/freeradius-server/commit/3e3f26119a) on v3.2.x

      - Credit: Issue found by Mark Hawking'
    description_verbatim: 'The `totp` module cached pointers to stack memory in order to do

      deduplication of tokens.  Later access to those items could cause a

      crash.


      This issue is not exploitable other than by the normal process of using the module.'
  - module: TTLS
    title: Use-after-free in TTLS
    severity: Critical
    fixed_on_branches:
    - v3.0.x
    - v3.2.x
    fix_commits:
