  discovery_trace: S1 findings.S1.yaml item 3 (enisa-euvd bridge EUVD-2026-137042 -> RealVNC advisory -> heise + CVE record) -> this follow-up re-fetched the advisory with extract (jina fallback), heise with extract, CVE record via url, EUVD record via url --direct, FIRST EPSS, GHSA page, Server 7.19.1 release notes, and the CVE record reference https://wakefield.co/research
  headline_findings:
  - Vendor advisory published 20 November 2026 and not updated since; the CVE record and EUVD entry appeared 2026-11-27 05:52Z (CVE reserved and published in the same second by MITRE); heise 2026-11-27. The in-window items are the CVE/EUVD records and heise, not the advisory.
  - 'CVSS: vendor gives only "Critical, CVSS 9.8" (no vector). CVE record and EUVD give CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H, 9.8, CWE-787 Out-of-bounds Write. No difference in score.'
  - 'Exposure per the vendor: cloud-hosted connectivity and manually configured direct connections, including offline-licensed/on-premises deployments; TCP-only direct connections are not exposed. No source names the UDP port or protocol, the platforms that run as root, a workaround or a detection.'
  - 'Remedy: update only. On-Demand Assist is downloaded from the RealVNC help site and older downloaded copies must be deleted (vendor: "Advise end users to delete any copies of older versions that they previously downloaded."). Mobile apps "should update automatically".'
  - No exploitation known (vendor, at publication, 2026-11-20); not in CISA KEV (catalogVersion 2026.11.27). EPSS 0.00671 (percentile 0.47083) per FIRST on 2026-11-27; the EUVD record shows epss 0.0 (not usable).
  - 'Reporter: Ozgun Kultekin, Wakefield. The same name is credited for the FreeRADIUS TTLS Critical on the project page (name match only). Wakefield research page lists no RealVNC write-up.'
