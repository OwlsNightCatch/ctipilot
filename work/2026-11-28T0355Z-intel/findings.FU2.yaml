    heading_block_verbatim: '### Printable output of “abinary” could overflow


      - Severity: Low

      - Commit: [`65f78b1571`](https://github.com/FreeRADIUS/freeradius-server/commit/65f78b1571) on v3.2.x

      - Commit: [`7c88a32f79`](https://github.com/FreeRADIUS/freeradius-server/commit/7c88a32f79) on v3.0.x

      - Credit: Issue found by Yuvraj Pradhan'
    description_verbatim: 'The `print_abinary()` function could overflow its output buffer.

      The filters come from a network access server (NAS) or a home server.

      There is no route to any public exploit.'
  - module: Server Core
    title: A malformed Long-Extended attribute could cause a crash when encoding
    severity: Medium
    fixed_on_branches:
    - v3.0.x
    - v3.2.x
    fix_commits:
    - commit: a37b2c0fb9
      branch: v3.2.x
    - commit: ad9e2f0a57
      branch: v3.0.x
    credit_verbatim: Issue reported by Chase Bevan-Thomas
    module_default_statement: The following issues were found in the server core. These issues can be addressed only by upgrading to a version which is not vulnerable.
    heading_block_verbatim: '### A malformed Long-Extended attribute could cause a crash when encoding


      - Severity: Medium

      - Commit: [`a37b2c0fb9`](https://github.com/FreeRADIUS/freeradius-server/commit/a37b2c0fb9) on v3.2.x

      - Commit: [`ad9e2f0a57`](https://github.com/FreeRADIUS/freeradius-server/commit/ad9e2f0a57) on v3.0.x

      - Credit: Issue reported by Chase Bevan-Thomas'
    description_verbatim: 'When a long extended attribute is the last attribute in a packet, and the packet was already near maximum size, then in some cases the server could crash.


      Since the crash is during packet encoding, this issue is only exploitable by either the local administrator, or by trusted clients or home servers.'
  - module: Server Core
    title: Misconfigured external databases could lead to expansion of unexpected text
    severity: Low
    fixed_on_branches:
    - v3.0.x
    - v3.2.x
    fix_commits:
    - commit: d353b31ea7
      branch: v3.2.x
    - commit: 12330df6b8
      branch: v3.0.x
    credit_verbatim: Arran Cudbard-Bell [a.cudbardb@freeradius.org](mailto:a.cudbardb@freeradius.org)
    module_default_statement: The following issues were found in the server core. These issues can be addressed only by upgrading to a version which is not vulnerable.
    heading_block_verbatim: '### Misconfigured external databases could lead to expansion of unexpected text


      - Severity: Low

      - Commit: [`d353b31ea7`](https://github.com/FreeRADIUS/freeradius-server/commit/d353b31ea7) on v3.2.x

      - Commit: [`12330df6b8`](https://github.com/FreeRADIUS/freeradius-server/commit/12330df6b8) on v3.0.x

      - Credit: Arran Cudbard-Bell [a.cudbardb@freeradius.org](mailto:a.cudbardb@freeradius.org)'
    description_verbatim: 'An external database (e.g. sql, ldap, rest, …) could return values taken from a User-Name without sanitizing it. The server could then treat that data as “safe”, in situations where it was not safe.


      The server now rejects the ‘%{‘ expansion opener in User-Name, before the name is sent to any database.'
