  - claim_id: 82c22b7992
    entry: 2026-11-18/drupal-core-critical-release-2026-11-18-psa-2026-11-16
    surface: "body"
    kind: cited
    text: "Affected are core before 10.6.23, from 11.0.0 before 11.3.23 and from 11.4.0 before 11.4.14, with 11.4.14, 11.3.23 and 10.6.23 as the fixed releases, so a site on 11.4.13, 11.3.22 or 10.6.22, the fixed releases of the first advisory, is still open to the second; update.php must be run because an update hook repairs sites already in that state ("
    urls: ["https://www.drupal.org/sa-core-2026-019"]
  - claim_id: 93b6761a2f
    entry: 2026-11-18/drupal-core-critical-release-2026-11-18-psa-2026-11-16
    surface: "body"
    kind: cited
    text: "Drupal says a site that has secured the installer is not vulnerable and strongly recommends securing it everywhere, that Drupal 8 and 9, 10.5.x and below and 11.2.x and below are end of life with no fix, and that Drupal Steward covers both advisories ("
    urls: ["https://www.drupal.org/sa-core-2026-019"]
