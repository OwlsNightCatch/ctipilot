    entry: 2026-11-28/realvnc-cve-2026-137738-preauth-udp-memory-flaw
    surface: "summary"
    kind: frontmatter
    text: "RealVNC's advisory RVNC-2026-001 of 2026-11-20 fixes CVE-2026-137738 (CVSS 3.1 9.8), a memory-safety flaw in UDP-based connections that can be exploited before authentication to run code remotely, as root on certain platforms, or to crash the software; it affects cloud-hosted connectivity and manually configured direct connections, and TCP-only direct connections are not exposed. Fixed builds are Server 7.19.1, Viewer 8.6.2, Connect App 8.6.2, Classic Viewer 7.18.3 and On-Demand Assist 3.5.0 with matching mobile releases; RealVNC knows of no exploitation, and ENISA's entry followed on 2026-11-27."
