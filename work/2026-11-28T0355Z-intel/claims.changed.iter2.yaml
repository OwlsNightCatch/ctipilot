    text: "FreeRADIUS released 3.0.29 and 3.2.11 on 2026-11-25; the project's page lists 21 fixed issues, one rated Critical: an unauthenticated use-after-free in the EAP-TTLS module, which is enabled in the default configuration and where code execution may be possible. Eight issues rated High sit mostly in modules the project says are off by default, and three Medium TEAP issues let an unauthenticated peer obtain an Access-Accept on 3.2.x; the project states no exploitation and no proof of concept for the Critical flaw. CERT-FR restated the release on 2026-11-27, and 3.0.29 is planned as the last 3.0 release."
