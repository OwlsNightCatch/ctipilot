  - claim_id: b365f4863b
    entry: 2026-11-28/kudelski-offensive-ai-identity-lifecycle-insurer
    surface: "summary"
    kind: frontmatter
    text: "Kudelski Security's incident responders describe a one-night intrusion at an unnamed European insurer in which about three million identification requests in under nine hours identified about 30 customers, more than a dozen accounts were created in customers' names without their passwords and more than 100 documents were extracted, with no malware and no compromise of the portal's servers. Kudelski assesses with high confidence that an offensive AI framework was used, names none and publishes no indicators, and traces the chain to business-logic weaknesses: the API of a retired web interface that stayed accessible, CAPTCHA and rate limits that were not enforced or were inactive after a migration, registration paths that skipped prior identity checks, unverified contact data that inherited verified status, incomplete token validation and an identity-provider flaw in authenticator enrollment."
  - claim_id: 93ea6ef994
    entry: 2026-11-28/kudelski-offensive-ai-identity-lifecycle-insurer
    surface: "body"
    kind: cited
    text: "It assesses with high confidence that an offensive AI framework was used, from correlated indicators of compromise, infrastructure characteristics, previously documented attack patterns, machine-speed execution, application-specific reconnaissance and automated handling of complex identity workflows, names no framework and could not establish how much human supervision there was ("
    urls: ["https://kudelskisecurity.com/research/the-rise-of-offensive-ai-frameworks-when-business-logic-becomes-the-attack-surface"]
  - claim_id: 734624a1be
    entry: 2026-11-28/kudelski-offensive-ai-identity-lifecycle-insurer
    surface: "body"
    kind: cited
    text: "The weaknesses it lists are business logic, not a single bug: the API of a retired web interface remained accessible, CAPTCHA was not enforced by the underlying API, rate limits were inactive after an infrastructure migration, alternative registration processes did not consistently enforce prior identity checks, unverified contact information inherited a verified status, token validation was incomplete, and an identity-provider vulnerability weakened authenticator enrollment ("
    urls: ["https://kudelskisecurity.com/research/the-rise-of-offensive-ai-frameworks-when-business-logic-becomes-the-attack-surface"]
  - claim_id: feb850d191
    entry: 2026-11-28/kudelski-offensive-ai-identity-lifecycle-insurer
    surface: "body"
    kind: cited
    text: "Its recommended detections are distributed requests against one business function across rotating infrastructure, excessive one-time-code generation or validation failures, authentication transitions at machine speed, authenticator enrollment without completed MFA, activity against retired APIs, and abnormal sequences across onboarding and recovery workflows ("
    urls: ["https://kudelskisecurity.com/research/the-rise-of-offensive-ai-frameworks-when-business-logic-becomes-the-attack-surface"]
  - claim_id: 028a40f707
    entry: 2026-11-28/kudelski-offensive-ai-identity-lifecycle-insurer
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** for any portal with identity lifecycle workflows, Kudelski's hardening list is the checklist: user-supplied contact attributes must not inherit verified status, identity migrations must preserve existing account activation states, retiring a front end includes decommissioning its supporting APIs, and rate limiting, CAPTCHA and server-side validation must be tested again after each change ("
    urls: ["https://kudelskisecurity.com/research/the-rise-of-offensive-ai-frameworks-when-business-logic-becomes-the-attack-surface"]
  - claim_id: 17f762e230
    entry: 2026-11-28/sap-github-environment-intrusion-project-granite
    surface: "summary"
    kind: frontmatter
    text: "SAP told dpa and BleepingComputer on 2026-11-26 and 2026-11-27 that it identified suspicious activity, took measures to protect customers and has found no evidence of unauthorized access to customer business data; a letter that dpa saw in part places the activity in SAP's GitHub developer platform. DER SPIEGEL's insider reports, without SAP's confirmation, stolen employee authentication tokens and copied and possibly modified source code, and heise, relaying Handelsblatt's company circles, reports restricted GitHub access, paused development workflows and replaced signing keys. SAP has not said how the attackers got in, who they are, or whether any software delivered to customers or any signing key customers verify is affected."
