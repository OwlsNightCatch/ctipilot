    entry: 2026-11-28/cacti-1-2-31-4http2root-guest-session-rce-zero-day
    surface: "body"
    kind: cited
    text: "**Detection:** in web access logs, one client requesting the guest profile page, a profile update, a graph preview and a realtime graph within seconds; in the application log, a PHP warning about a non-numeric value in a graph display setting; in the Cacti database, a poller entry whose command is anything other than a normal poller command; on the host, files written by the web or poller account and shells or download tools started under it ("
    urls: ["https://ravenai.sh/blog/four-requests-to-shell-cacti", "https://watchtowr.com/intelligence/4http2root-cacti-zero-day-faq/"]
  - claim_id: 5ab306bc48
    entry: 2026-11-28/cacti-1-2-31-4http2root-guest-session-rce-zero-day
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** where the guest account is on, disable it and restrict the web interface to trusted internal networks now and review poller entries for unexpected commands; where it is off, the sources say the chain has no entry point, but watch for the first release with the hardening commits ("
    urls: ["https://watchtowr.com/intelligence/4http2root-cacti-zero-day-faq/"]
