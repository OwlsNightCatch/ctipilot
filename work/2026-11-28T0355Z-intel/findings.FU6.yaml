  entry_sentences_superseded:
  - field: title
    entry_wording: every known case ending in a compromise
    status: needs-qualifier
    why: The 2026-11-24 BACS page does say this, but the BACS director put the figure at four of five confirmed cases on 2026-11-26 (SRF) and RTS reads two successes among three critical-infrastructure attacks; the title states the earlier all-cases
