    why: Still true of the BACS page; the case count and the three critical-infrastructure victims now come from the director on SRF.
  - field: sourcing_note
    entry_wording: BACS is the disclosing national authority for its own jurisdiction and the only source; no second outlet had reported it when this was written. The page gives no case count, sectors, victims, framework or entry point for the
      Swiss cases
    status: superseded
    why: 'SRF (original interview report, 2026-11-26) and RTS (ATS wire relaying SRF and the BACS release) now report it. Neither is independent corroboration of the facts: both carry BACS statements (the director in an interview; the BACS release),
      so verification stays single-source-national-authority, now with two statements from that one authority.'
  - field: Defender takeaway (parenthesis)
    entry_wording: (the German text gives no start point; the official English page says after release)
    status: supplemented
    why: 'SRF''s German paraphrase carries the start point: "spätestens aber 24 Stunden nach deren Erscheinen" (at the latest 24 hours after release).'
  - field: Exposure
    entry_wording: BACS addresses its recommendations to companies in Switzerland and does not name administrations or sectors.
    status: still-true
    why: 'Neither SRF nor RTS names a public administration or a victim sector; BACS recommends measures to "Unternehmen in der Schweiz" (SRF: "Das BACS ruft Unternehmen in der Schweiz dazu auf").'
  success_count_readings:
    bacs_page_2026_11_24: every case known to BACS ended in a successful compromise; no case count
    srf_2026_11_26: 'four of five cases: systems successfully hacked (indirect speech, attribution to the director inferred)'
    rts_2026_11_26: three attacks on critical infrastructure; in two cases the attacks succeeded (scope of "dans deux cas" unstated)
    reconciliation_notes:
    - 'Not necessarily contradictory: if the two successes are among the three critical-infrastructure attacks and both non-critical-infrastructure attacks also succeeded, RTS and SRF agree on four of five. No source states that; it is arithmetic
      on an ambiguous sentence.'
    - 'Not necessarily contradictory in time: the BACS page of 2026-11-24 says "all known" without a count, and the director''s figure is two days later; a fifth, unsuccessful case could have been reported in between. No source says how many
      cases BACS knew on 2026-11-24. This is an inference by the research agent, not a sourced statement.'
    - RTS credits the five-case figure to SRF Heute Morgen, so RTS is derived from SRF for that figure; the SRF text is the closer reading of the interview, but it too is a journalist's indirect speech for the success count.
    - 'Weighting for the entry: attribute each reading to its maker; do not state a single success ratio as BACS fact. The only direct quotes available are "five confirmed cases" (SRF) and the BACS page sentence.'
  recommendations_beyond_24h_advice:
    bacs_page_2026_11_24_six_recommendations:
    - limit exposed systems (geo-blocking or allow-list)
    - 'patch management: critical updates for internet-reachable systems within 24 hours'
    - MFA or passkeys on every internet-reachable internal resource, webmail and VPN named
    - least privilege
    - detect deviations in behaviour and data volume of identities, applications, workloads, infrastructure
    - regular penetration tests
    already_in_entry: exposed-system limiting, 24-hour patching, MFA or passkeys, behaviour-deviation detection
    not_in_entry: least privilege; regular penetration tests (both on the BACS page)
    srf_additions: connect as few systems as possible to the internet; companies should use AI more in defence (Schütz and Reischuk); BACS says it is obliged to assist when critical infrastructure is concerned
    rts_additions: significant reduction of internet-accessible systems, strict access restrictions, flawless MFA; no 24-hour figure given by RTS
  contradictions:
  - 'Success count: BACS page (all known cases, 2026-11-24) versus SRF (four of five, 2026-11-26) versus RTS (two, scope unstated). See success_count_readings.'
  - 'Date of the BACS release: RTS says the communique was "publié jeudi" (2026-11-26 was a Thursday); the BACS page, its listing label ("24. Nov.") and the entry carry 2026-11-24 (Tuesday). No BACS release dated 2026-11-26 appears in the three
    BACS listings or the admin.ch news listing fetched in this run. Treated as an RTS weekday slip; unresolved.'
  - 'Correction to the S2 sweep summary (findings.S2.yaml item 1): (a) "SRF''s examples: electricity and water suppliers, telecom providers" describes the category "Betreiberinnen kritischer Infrastrukturen" ("Dazu gehören beispielsweise ..."),
    not the victims'' sectors, and RTS does the same with different examples; no source names a victim sector. (b) "Schütz repeats the 24-hour ceiling": SRF''s sentence has "das Bundesamt" as its subject and is not a Schütz quotation. (c) "Heute
    Morgen interview": the SRF text does not name the programme; RTS does. (d) The S2 suggestion to soften "every known case" to the director''s own figure over-attributes: the four-of-five sentence is SRF indirect speech with no named speaker.'
  - The entry states the BACS page says nothing on case count and calls BACS the only source; both statements are overtaken by SRF/RTS (see entry_sentences_superseded).
  not_readable_or_not_found:
  - 'The audio of the SRF Heute Morgen interview itself: only the written SRF article was read; the exact spoken wording of the success figure is unverified. The SRF article text does not name the programme.'
  - No BACS release or admin.ch news item dated 2026-11-26 found (three BACS listings fetched earlier in the run by S2 plus the admin.ch news listing; none lists one). Two WebSearch queries (German, French) for other outlets with the five-case
    figure returned nothing relevant (the search index does not carry the SRF or RTS pieces).
  - The ATS wire original was not located; the RTS page is the only form of the wire read.
  - No source for the five cases names a framework, an entry point, a victim sector, a public administration, a dwell time or a victim.
  also_noted_in_sources_not_requested:
  - 'SRF: Germany''s BSI newly rates the situation "angespannt bis kritisch", citing among other things rapid AI development (SRF, German original: "stuft sie neu als «angespannt bis kritisch» ein"); S2 holds this as a lead (no BSI primary reached).'
- id: B
  entry_id: 2026-11-20/mitel-openscape-4000-misa-2026-0013-unauth-cvss-10
  suggested_record_type: 'update (new reader-facing facts: the three CVE ids and the id-to-flaw mapping exist; the title and summary say "CVE ids pending")'
  suggested_rating_note: Mapping and ids are confirmed by the CVE Program record (MITRE CNA), mirrored by ENISA EUVD (same record, not an independent observation) and listed by BSI WID-SEC-2026-4685 revision 2; Mitel's page still lacks them.
    Rating A1 for the ids is defensible; the affected-range question for R2.12 and R2.13 stays open at vendor level.
  summary: 'The CVE Program (MITRE as CNA, via its CVE request form) published CVE-2026-137724, CVE-2026-137721 and CVE-2026-137723 on 2026-11-27. Each description ends with Mitel''s internal id, so the mapping is stated by the records and not
    inferred by position: CVE-2026-137724 is MTLVULN-1785 (improper authentication, CVSS 3.1 10.0, AV:N), CVE-2026-137721 is MTLVULN-1786 (command injection, 10.0, AV:N) and CVE-2026-137723 is MTLVULN-1793 (command injection, 9.6, AV:A). Pairing
    the ids to the flaws in ascending numeric order would be wrong (it would put CVE-2026-137723 on MTLVULN-1786 and CVE-2026-137724 on MTLVULN-1793). ENISA EUVD carries the same records as EUVD-2026-137039, -137044 and -137037; BSI WID-SEC-2026-4685
    revision 2 ("CVE ergänzt") lists the three ids. Mitel''s advisory page is still revision 1.0 of 2026-11-18 and still says a CVE id is requested but not assigned; fixed releases and the Security Mode workaround are unchanged. CISA ADP records
    SSVC on CVE-2026-137721: Exploitation none, Automatable yes, Technical Impact total (2026-11-27T16:01Z); none of the three is in KEV; no exploitation is stated anywhere.'
