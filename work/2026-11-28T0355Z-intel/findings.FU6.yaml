  suggested_record_type: update (reader-facing delta; case count, success ratio and victim classes are new; the headline and title wording "all successful" / "every known case" is overtaken)
  suggested_rating_note: 'Admiralty A2 stays: SRF and RTS carry BACS statements (an interview and the BACS release), so they are the same authority speaking again, not independent corroboration; credibility is not raised because the three readings
    of the success count differ.'
  summary: On 2026-11-26 the BACS director told SRF there are five confirmed AI-agent attack cases in Switzerland, all reported in the last few days. SRF reports, in indirect speech, that systems were successfully hacked in four of the five;
    three victims are critical-infrastructure operators and SMEs that reported voluntarily were also hacked. BACS will not name victims, there were no larger outages and the actor is unknown. RTS (ATS wire) repeats five cases and reads "three
    attacks on critical infrastructure, two succeeded" with the scope of the success count left open. The BACS page of 2026-11-24 is unchanged (read 2026-11-28) and still says every known case ended in compromise. Neither SRF nor RTS names ARTEX,
    CyberStrikeAI or any other framework for the five cases, and neither names a victim sector or a public administration.
