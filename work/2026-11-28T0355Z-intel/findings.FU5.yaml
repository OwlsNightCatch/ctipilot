    NCSC-NL, CERT.at, Ubuntu and GitLab show no revision since the entry's last read.
  summary: 'Cisco cisco-sa-nginx-nov-2026-e8jska2s: version 1.6 (2026-11-27 20:04 GMT, status Interim, ''Updated affected products.''). Revision history: 1.0 2026-11-20, 1.1 2026-11-21, 1.2 2026-11-23 (SIR
    Critical to High), 1.3 2026-11-24, 1.4 2026-11-26, 1.5 2026-11-26 (Catalyst Center status and fixed release, Finesse fixed release), 1.6 2026-11-27. The advisory''s table now lists Catalyst Center with
    bugs CSCwx92298 and CSCwx92322 and first fixed releases 3.3.3 and 3.4.1 (both TBD); ISE only on release 3.5 (3.5 Patch 5, Dec 2026); Nexus 3000/9000 standalone NX-OS mode 10.3.11 (Dec 2026), 10.4.9
    (Jan 2027), 10.5.7 (Dec 2026), 10.6.5 (Feb 2027), 10.7.1 (Dec 2026); IOS XE Not affected; IOS XR Under investigation; UCS Director Affected, release TBD; plus affected rows the entry''s body never names
    (Crosswork Hierarchical Controller 11.0.4 and 12.0.1 Nov 2026, Secure Endpoint Private Cloud PC 4.2.10 Dec 2026, Optical Network Controller, UCS Fabric Interconnect, Business Process Automation, CWAY
    Cloud, Intersight 1.30.7 and 1.31.f, Webex Engage Administrator Console, CX GC AIOps, IQ, CX SmartLog, Unified Contact Center Enterprise Cloud Connect, Unified Intelligence Center). The page''s table
    no longer contains ''NextFusion Platform'', which the entry''s 2026-11-22 section lists. Cisco''s CSAF lists only ISE and the Intersight Virtual Appliance as known_affected. Cisco still says it is aware
    of proof-of-concept code and not aware of malicious use. Fortinet FG-IR-26-279: timeline last updated 2026-11-26; 29 names under investigation, 49 confirmed not impacted (FortiManager, FortiAnalyzer,
    FortiADC, FortiWeb, FortiSIEM, FortiMail, FortiOS, FortiProxy, FortiNAC, FortiPAM among them); ''Fortinet has remediated this issue in FortiVoice Cloud and FortiEdge Cloud and hence the customers need
    not perform any action.'' (the page does not use the words ''server-side'').'
