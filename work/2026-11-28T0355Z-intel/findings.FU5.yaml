    telemetry cannot be established. The other three chain CVEs and CVE-2026-120704 are not in the catalog. watchTowr''s FAQ (fetched 2026-11-28) now says ''as reported by watchTowr and CISA'', and its
    table marks CVE-2026-129245, CVE-2026-129243 and CVE-2026-120705 ''Yes'' and CVE-2026-129244, CVE-2026-129242 and CVE-2026-120704 ''Not reported''. The Hacker News (11-25) is unchanged in substance:
