  contradictions:
  - watchTowr's FAQ prose says CISA 'added CVE-2026-129243' only; CISA's alert and KEV catalog list both CVE-2026-129243 and CVE-2026-120705.
  - watchTowr's FAQ table marks CVE-2026-129244 'Not reported'; Ganchev's quote in The Hacker News names CVE-2026-129244 among the CVEs exploited ('leveraging CVE-2026-120705 and CVE-2026-129244').
  - NCSC.ch 13242 labels CVE-2026-120705 only and does not list CVE-2026-129243; CISA and watchTowr (table) and THN (lead) name CVE-2026-129243. NCSC.ch has not revised after the KEV listing.
  - The Hacker News says the advisories were published on 2026-11-24 (and carries an editor's note emphasising that); the project's post and GHSA pages date 2026-11-23 and CryptoCat's timeline says 2026-11-23.
  - 'GHSA-rv5g-g2r9-58rj says stored queries created through the prefixed-service bypass ''are the entry point for'' GHSA-39mw-5chv-jh47, while GHSA-39mw-5chv-jh47 says ''No authentication, custom stored
    query or CreateStoredQuery access is required'' for the GetFeatureById injection: the XML injection is reachable on its own (CISA''s CVE-2026-120705 description describes it that way), the bypass is
    needed for the reporter''s stored-query path. Not an entry error, but it matters for the exposure wording of CVE-2026-120705.'
  gaps_in_what_is_known:
