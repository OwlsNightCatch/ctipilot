    superseded_by: '''reported probes'' understates: two of the five flaws are KEV-listed. (The title and headline are the composer''s call; the fact is the KEV listing.)'
  - location: frontmatter summary (last sentence)
    current_wording: watchTowr reports exploitation attempts in the form of error-based probes that create and invoke stored queries, and NCSC Switzerland rates the chain actively exploited; watchTowr is
      the only observer and the sources name different flaws as exploited.
    superseded_by: '''watchTowr is the only observer'' and ''the sources name different flaws as exploited'' are both overtaken: CISA names exactly CVE-2026-120705 and CVE-2026-129243; watchTowr''s FAQ
      table now marks three CVEs Yes and three Not reported. CISA does not disclose its evidence, so a statement that CISA is an independent second observer is not supported either; ''no victim, actor or
      scale is named'' still holds.'
  - location: 'updates[0].summary (changelog record, append-only: do not edit, correct in the new record)'
    current_wording: sources name different CVEs as exploited. The record also adds CVE-2026-120704, the SQLite JDBC extension-loading step
    superseded_by: Same overtaken claim; the record itself is immutable, so the new record's summary/section must carry the correction.
  - location: frontmatter sourcing_note
    current_wording: Exploitation is reported by watchTowr alone, relayed by The Hacker News and NCSC Switzerland; those sources name different CVEs as exploited, watchTowr's own table marks only CVE-2026-129245,
      and no second observer exists; the exploited status is set on every chain CVE that any of them names.
    superseded_by: 'Every clause is now outdated: ''watchTowr alone'' (CISA KEV listing exists), ''watchTowr''s own table marks only CVE-2026-129245'' (table now marks 129245, 129243 and 120705 Yes), ''no
      second observer exists'' (CISA states evidence of active exploitation without naming it), and ''the exploited status is set on every chain CVE that any of them names'' (rule yields 129244 and 129242
      only via watchTowr''s prose/Ganchev quote, contradicted by watchTowr''s table ''Not reported''). Unchanged and still true: ''CVE.org records for some ids were not yet published on 2026-11-25'' is
      dated and could not be re-checked (see not_readable).'
  - location: body, paragraph 2 (last sentence)
    current_wording: watchTowr reports exploitation attempts, which NCSC Switzerland rated actively exploited on 2026-11-25
    superseded_by: Add that CISA listed CVE-2026-120705 and CVE-2026-129243 in KEV on 2026-11-27 with a federal due date of 2026-11-30.
  - location: actions[0]
    current_wording: because a public proof of concept chains the steps from an anonymous request to code execution and watchTowr reports exploitation attempts.
    superseded_by: '''watchTowr reports exploitation attempts'' should carry the KEV listing (two CVEs) as the stronger statement.'
  - location: body, Defender takeaway
    current_wording: since a public full-chain proof of concept exists, exploitation attempts are reported and the fixes are weeks old
    superseded_by: '''exploitation attempts are reported'' is now ''CISA lists two of the chain flaws as exploited (KEV, due 2026-11-30)''.'
  - location: body, '## Update — 2026-11-26T05:06:00Z' paragraph 1, sentence 2 (earlier-update text is modifiable per the lifecycle rule)
    current_wording: 'The sources disagree on which flaws: The Hacker News names CVE-2026-120705 and CVE-2026-129243 in its lead and CVE-2026-120705 and CVE-2026-129244 in its quote of watchTowr, watchTowr''s
      prose names all five chain CVEs, and its own table marks only CVE-2026-129245 as exploited.'
    superseded_by: watchTowr's table now marks CVE-2026-129245, CVE-2026-129243 and CVE-2026-120705 'Yes'; THN's naming is unchanged.
  - location: body, '## Update — 2026-11-26T05:06:00Z' paragraph 1, sentence 4
    current_wording: watchTowr is the only observer and no victim, actor or scale is named; the project's own pages make no exploitation statement.
    superseded_by: 'First clause (''watchTowr is the only observer'') overtaken as above; ''no victim, actor or scale is named'' and ''the project''s own pages make no exploitation statement'' remain true
