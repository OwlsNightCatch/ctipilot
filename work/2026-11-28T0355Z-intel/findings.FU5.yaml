  summary: 'CISA added CVE-2026-120705 (''OSGeo GeoServer XML Injection Vulnerability'') and CVE-2026-129243 (''OSGeo GeoServer Incorrect Authorization Vulnerability'') to the KEV catalog on 2026-11-27
