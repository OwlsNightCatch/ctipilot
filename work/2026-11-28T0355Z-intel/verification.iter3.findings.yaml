  item: "2026-11-28/kudelski-offensive-ai-identity-lifecycle-insurer (claim 67b0084e53)"
  url_or_quote: "Among the weaknesses it lists, all business logic and not a single bug: ... and an identity-provider vulnerability weakened authenticator enrollment"
  summary: "Introduced by the iteration-2 remediation. The sentence contradicts itself and the page: its own list ends with an identity-provider vulnerability (the entry's next sentence identifies it as ZITADEL advisory GHSA-qqv8-37gw-ww2q, a software flaw), and the Kudelski page says 'An additional identity-provider vulnerability, identified as GHSA-qqv8-37gw-ww2q, contributed to the compromise. However, this technical vulnerability was only one component of a broader chain of weaknesses.' The page never says 'not a single bug'. Fix: 'Among the weaknesses it lists, mostly business logic rather than software bugs:' or drop the characterisation."
