  item: "2026-11-28/kudelski-offensive-ai-identity-lifecycle-insurer (claim 9c5b732fa8, Detection)"
  url_or_quote: "The sequence to alert on is a burst of identification requests against onboarding endpoints, then accounts created in the names of existing customers without their original passwords, then sensitive information accessed by those accounts."
  summary: "(low confidence) The order (requests, accounts created without original passwords, sensitive information accessed) now follows the page, but 'against onboarding endpoints' is not in it: the page says 'Generated approximately three million requests', 'Identification requests | Approximately 2.9 million' and never says which endpoints or workflow received them, and the entry's own sourcing_note says the post gives no ordered attack chain. Say 'against the identification function' or drop the clause."
