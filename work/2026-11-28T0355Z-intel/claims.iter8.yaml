  - claim_id: ca447f8342
    entry: 2026-11-18/drupal-core-critical-release-2026-11-18-psa-2026-11-16
    surface: "body"
    kind: cited
    text: "StepSecurity reproduced the re-entry on 11.4.12 and not on 11.4.13 and says the stock .htaccess rule blocking direct PHP requests is unchanged, so code execution survives for an attacker who can write a PHP file into a code directory; no source tests the newest builds ("
    urls: ["https://www.stepsecurity.io/blog/fail2install-cve-2026-132165"]
  - claim_id: 86b78d4ed0
    entry: 2026-11-18/drupal-core-critical-release-2026-11-18-psa-2026-11-16
    surface: "body"
    kind: cited
    text: "**Exposure:** any Drupal site on core before 11.4.14, 11.3.23 or 10.6.23 whose /core/install.php can be requested from outside, and every site on an end-of-life line, which has no fix; patched Drupal publishes only its major version, so check the installer path and the drupal/core version the site was built from ("
    urls: ["https://www.stepsecurity.io/blog/fail2install-cve-2026-132165"]
  - claim_id: 137beeab2f
    entry: 2026-11-18/drupal-core-critical-release-2026-11-18-psa-2026-11-16
    surface: "body"
    kind: cited
    text: "NCSC-NL says the condition arises when the installer is not correctly secured or removed after the initial installation (translated from Dutch) ("
    urls: ["https://advisories.ncsc.nl/2026/ncsc-2026-0507.html"]
  - claim_id: 396c329b20
    entry: 2026-11-18/drupal-core-critical-release-2026-11-18-psa-2026-11-16
    surface: "body"
    kind: cited
    text: "**Detection:** web access logs for requests to the installer on a site that is already installed and, as StepSecurity describes, a burst of database connection-refusal errors together with a burst of HTTP 500 responses and requests to install.php; on a site that ran an affected build, changes to settings.php, a later install time or a changed user 1 ("
    urls: ["https://www.stepsecurity.io/blog/fail2install-cve-2026-132165"]
