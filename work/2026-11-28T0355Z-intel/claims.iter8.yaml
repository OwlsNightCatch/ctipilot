    entry: 2026-11-28/cacti-1-2-31-4http2root-guest-session-rce-zero-day
    surface: "headline"
    kind: frontmatter
    text: "Cacti 1.2.31 zero-day 4HTTP2ROOT: guest-session RCE, public PoC, no release; disable the guest user, restrict the UI"
  - claim_id: 96cb041f72
    entry: 2026-11-28/cacti-1-2-31-4http2root-guest-session-rce-zero-day
    surface: "summary"
    kind: frontmatter
    text: "A researcher published a proof of concept on 2026-11-26 that takes Cacti Core 1.2.31 from an anonymous guest session to command execution as the web or poller account in four requests; no CVE id and no release exist, and the chain needs the guest account enabled, which Cacti's documentation says is off by default. Previdian's honeypots recorded SQL-injection attempts from 2026-11-27 with no confirmed success, and Cacti merged unreleased hardening commits on 2026-11-28 that cover each stage without referring to the disclosure. Cacti stores SNMP strings and device logins, so a compromised server is a pivot into the monitored network."
  - claim_id: d054384699
    entry: 2026-11-28/cacti-1-2-31-4http2root-guest-session-rce-zero-day
    surface: "body"
    kind: cited
    text: "A researcher using the handle ek0ms savi0r published a write-up and proof of concept on 2026-11-26 for unauthenticated command execution on Cacti Core 1.2.31 in four HTTP requests that start from an anonymous guest session, a chain its repository now calls 4HTTP2SHELL and watchTowr 4HTTP2ROOT ("
    urls: ["https://github.com/ekomsSavior/Sad-Girls-0day-Club/tree/main/4http2shell"]
  - claim_id: bb04dc2737
    entry: 2026-11-28/cacti-1-2-31-4http2root-guest-session-rce-zero-day
    surface: "body"
    kind: cited
    text: "BleepingComputer relays the researcher's statement that the flaw was not reported to Cacti before release, and no fixed version exists: watchTowr says Cacti has not published one, and the project's releases page lists 1.2.31 as its newest release on 2026-11-28 ("
    urls: ["https://www.bleepingcomputer.com/news/security/unpatched-cacti-zero-day-with-public-poc-gives-remote-code-execution/", "https://watchtowr.com/intelligence/4http2root-cacti-zero-day-faq/", "https://github.com/Cacti/cacti/releases"]
  - claim_id: ee28f3ae81
    entry: 2026-11-28/cacti-1-2-31-4http2root-guest-session-rce-zero-day
    surface: "body"
    kind: cited
    text: "As RavenAI and The Hacker News describe the chain, the guest profile page stores a non-numeric graph page size; a graph-preview request concatenates it into a query that accepts a second statement, which rewrites a poller entry's command; and a realtime-graph request runs that command inside the web request as the web server and poller account, often a low-privileged web user according to watchTowr ("
    urls: ["https://ravenai.sh/blog/four-requests-to-shell-cacti", "https://thehackernews.com/2026/11/unpatched-cacti-zero-day-enables-rce-in.html", "https://watchtowr.com/intelligence/4http2root-cacti-zero-day-faq/"]
  - claim_id: 17392e7445
    entry: 2026-11-28/cacti-1-2-31-4http2root-guest-session-rce-zero-day
    surface: "body"
    kind: cited
    text: "The guest account must be enabled for the chain to work, and Cacti's documentation says guest or anonymous access is disabled by default and works only when the Guest user is enabled and set as the guest user ("
    urls: ["https://watchtowr.com/intelligence/4http2root-cacti-zero-day-faq/", "https://github.com/Cacti/documentation/blob/develop/User-Management.md"]
  - claim_id: 40aec16052
    entry: 2026-11-28/cacti-1-2-31-4http2root-guest-session-rce-zero-day
    surface: "body"
    kind: cited
    text: "Only 1.2.31 was tested, and it is unclear whether earlier versions are affected ("
    urls: ["https://www.bleepingcomputer.com/news/security/unpatched-cacti-zero-day-with-public-poc-gives-remote-code-execution/"]
  - claim_id: 9a835ee942
    entry: 2026-11-28/cacti-1-2-31-4http2root-guest-session-rce-zero-day
    surface: "body"
    kind: cited
    text: "Cacti stores SNMP strings and device logins, so a compromised server is a foothold into the monitored network ("
    urls: ["https://watchtowr.com/intelligence/4http2root-cacti-zero-day-faq/"]
