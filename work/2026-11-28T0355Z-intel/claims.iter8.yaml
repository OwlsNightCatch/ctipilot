    entry: 2026-11-28/hunt-io-open-directories-swiss-tax-office-ntds-ifm
    surface: "summary"
    kind: frontmatter
    text: "Hunt.io recovered three exposed attacker directories and reports a domain-controller workflow against \"a Swiss tax office\": a log of ntdsutil install-from-media creation and a script that copies the Active Directory database and registry hives from a controller share to staging, decodes them and requests removal of the media. Complete off-host transfer is not confirmed, the victim is unnamed and the report does not show how access was gained. The kit also holds a Java loader registered as a Microsoft SQL Server JDBC driver, Apollo- and Poseidon-derived implants, a commercial employee-monitoring product used as a command channel and staged exploits for edge services that Hunt.io says show availability, not success; it assesses a financially motivated, Chinese-speaking, Southeast Asia-based crew and names no group."
