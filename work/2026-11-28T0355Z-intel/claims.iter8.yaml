  - claim_id: d5b6a78606
    entry: 2026-11-28/cacti-1-2-31-4http2root-guest-session-rce-zero-day
    surface: "body"
    kind: cited
    text: "On 2026-11-28 the project merged unreleased 1.2.x hardening commits that reject guest profile writes, validate the page size and require graph access before a realtime command, without referring to the disclosure and with no release or advisory yet ("
    urls: ["https://github.com/Cacti/cacti/pull/9014"]
  - claim_id: 60225dc0ce
    entry: 2026-11-28/cacti-1-2-31-4http2root-guest-session-rce-zero-day
    surface: "body"
    kind: cited
    text: "**Detection:** in web access logs, one client requesting the guest profile page, a profile update, a graph preview and a realtime graph in sequence; in the application log, a PHP warning about a non-numeric value in a graph display setting; in the Cacti database, a poller entry whose command is anything other than a normal poller command; on the host, new files written by the poller or web account, a shell or marker file among them ("
    urls: ["https://ravenai.sh/blog/four-requests-to-shell-cacti", "https://watchtowr.com/intelligence/4http2root-cacti-zero-day-faq/"]
  - claim_id: 3e5c95c6d9
    entry: 2026-11-28/cacti-1-2-31-4http2root-guest-session-rce-zero-day
    surface: "body"
    kind: cited
    text: "**Triage:** each request alone is ordinary guest behavior, so the stronger pivots are the non-numeric display-setting warning and a changed poller entry followed by a realtime-graph request ("
    urls: ["https://ravenai.sh/blog/four-requests-to-shell-cacti"]
  - claim_id: 5ab306bc48
    entry: 2026-11-28/cacti-1-2-31-4http2root-guest-session-rce-zero-day
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** where the guest account is on, disable it and restrict the web interface to trusted internal networks now and review poller entries for unexpected commands; where it is off, the sources say the chain has no entry point, but watch for the first release with the hardening commits ("
    urls: ["https://watchtowr.com/intelligence/4http2root-cacti-zero-day-faq/"]
