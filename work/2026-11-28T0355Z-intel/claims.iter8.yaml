    entry: 2026-11-28/kudelski-offensive-ai-identity-lifecycle-insurer
    surface: "headline"
    kind: frontmatter
    text: "Kudelski: assessed AI-driven insurer intrusion via onboarding and identity logic, no malware; alert on request bursts"
  - claim_id: 54864949fc
    entry: 2026-11-28/kudelski-offensive-ai-identity-lifecycle-insurer
    surface: "summary"
    kind: frontmatter
    text: "Kudelski Security's incident responders describe a one-night intrusion at an unnamed European insurer in which about three million identification requests in under nine hours identified about 30 customers, more than a dozen accounts were created in customers' names without their passwords and more than 100 documents were extracted, with no malware and no compromise of the portal's servers. Kudelski assesses with high confidence that an offensive AI framework was used, names none and publishes no indicators, and traces the chain to business-logic weaknesses: the API of a retired web interface that stayed accessible, CAPTCHA and rate limits that were not enforced or were inactive after a migration, registration paths that did not consistently enforce prior identity checks, unverified contact data that inherited verified status, incomplete token validation and an identity-provider flaw in authenticator enrollment."
  - claim_id: 12ce129da7
    entry: 2026-11-28/kudelski-offensive-ai-identity-lifecycle-insurer
    surface: "body"
    kind: cited
    text: "Kudelski Security's incident-response team describes a one-night intrusion at an unnamed European insurer in which about three million identification requests arrived in under nine hours, about 30 legitimate customer identities were identified, more than a dozen customer accounts were created in those customers' names without their passwords, and more than 100 documents with sensitive customer data were extracted ("
    urls: ["https://kudelskisecurity.com/research/the-rise-of-offensive-ai-frameworks-when-business-logic-becomes-the-attack-surface"]
  - claim_id: c998f846a4
    entry: 2026-11-28/kudelski-offensive-ai-identity-lifecycle-insurer
    surface: "body"
    kind: cited
    text: "Kudelski found no malware and no compromise of the servers hosting the customer portal, and each forged account could read only its own customer's data ("
    urls: ["https://kudelskisecurity.com/research/the-rise-of-offensive-ai-frameworks-when-business-logic-becomes-the-attack-surface"]
  - claim_id: 93ea6ef994
    entry: 2026-11-28/kudelski-offensive-ai-identity-lifecycle-insurer
    surface: "body"
    kind: cited
    text: "It assesses with high confidence that an offensive AI framework was used, from correlated indicators of compromise, infrastructure characteristics, previously documented attack patterns, machine-speed execution, application-specific reconnaissance and automated handling of complex identity workflows, names no framework and could not establish how much human supervision there was ("
    urls: ["https://kudelskisecurity.com/research/the-rise-of-offensive-ai-frameworks-when-business-logic-becomes-the-attack-surface"]
  - claim_id: 490d23593a
    entry: 2026-11-28/kudelski-offensive-ai-identity-lifecycle-insurer
    surface: "body"
    kind: cited
    text: "Among the weaknesses it lists, mostly business logic rather than software bugs: the API of a retired web interface remained accessible, identity information could be tested at scale, CAPTCHA was not enforced by the underlying API, rate limits were inactive after an infrastructure migration, alternative registration processes that did not consistently enforce prior identity checks, unverified contact information inherited a verified status, token validation was incomplete, authorization-related information was exposed to the client, and an identity-provider vulnerability weakened authenticator enrollment ("
    urls: ["https://kudelskisecurity.com/research/the-rise-of-offensive-ai-frameworks-when-business-logic-becomes-the-attack-surface"]
  - claim_id: 4ddcfb8bde
    entry: 2026-11-28/kudelski-offensive-ai-identity-lifecycle-insurer
    surface: "body"
    kind: cited
    text: "The identity-provider flaw is cited as GHSA-qqv8-37gw-ww2q, which is ZITADEL's advisory for a missing second-factor check on authenticator enrollment in its Login V2 interface, affecting 4.0.0 through 4.20.4 and fixed in 4.20.5; the post does not say the insurer ran ZITADEL ("
    urls: ["https://github.com/zitadel/zitadel/security/advisories/GHSA-qqv8-37gw-ww2q"]
  - claim_id: 8fb5368f71
    entry: 2026-11-28/kudelski-offensive-ai-identity-lifecycle-insurer
    surface: "body"
    kind: cited
    text: "Kudelski compares the case with BabidiGhost: that operation tried an AI agent against many organizations, this one explored a single organization's interconnected application and identity ecosystem in depth ("
    urls: ["https://kudelskisecurity.com/research/the-rise-of-offensive-ai-frameworks-when-business-logic-becomes-the-attack-surface"]
  - claim_id: 839257a8c5
    entry: 2026-11-28/kudelski-offensive-ai-identity-lifecycle-insurer
