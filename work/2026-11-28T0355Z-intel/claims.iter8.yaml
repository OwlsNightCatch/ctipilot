    kind: cited
    text: "**Triage:** a newly created account may satisfy the portal's registration requirements, so a single account can look legitimate; Kudelski says abnormal request volumes, extensive authentication failures and reconnaissance activity were detectable well before data collection ("
    urls: ["https://kudelskisecurity.com/research/the-rise-of-offensive-ai-frameworks-when-business-logic-becomes-the-attack-surface"]
  - claim_id: 028a40f707
