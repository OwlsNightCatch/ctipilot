  - claim_id: 7a0fa92221
    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "summary"
    kind: frontmatter
    text: "F5 and the nginx project fixed five memory-corruption flaws in the nginx data plane on 2026-11-18, two in HTTP/2 and one each in HTTP/3, the resolver and the mail proxy, which CERT-EU says can lead to unauthenticated code execution with the privileges of the worker process; NCSC-NL scores all five CVSS 4.0 9.2, NCSC.ch and Wiz the two HTTP/2 flaws and Rapid7 CVE-2026-123007. The memory-corruption fixes are in nginx 1.31.9 and 1.30.7 and NGINX Plus 37.3.0.1 and 37.0.8.1, nginx 1.31.10, 1.30.8 and NGINX Plus 37.3.1.1 and 37.0.9.1 add a fix for one CPU-exhaustion flaw, and NGINX Plus R33 to R36 have no update. Rapid7 published a proof of concept for CVE-2026-123007, CERT-EU reports no exploitation, and NCSC.ch, CERT-EU, CERT.at and NCSC-NL issued warnings; Unit 42 reached pre-authentication code execution through CVE-2026-123633 as the worker user in a lab, on a non-default configuration and with a separate memory leak that F5 has not given a CVE. Palo Alto Networks lists PAN-OS and Panorama with HTTP/2 enabled as affected, Veeam lists its 13.1 Software and Infrastructure Appliances (fixed through Veeam Updater), Cisco lists Catalyst Center, Identity Services Engine 3.5, Nexus 3000 and 9000 in standalone NX-OS mode, UCS Director and about 20 other products with fixes dated November 2026 to March 2027 or still to be determined, Siemens and Synology list products with fixes pending or none, and Fortinet confirms FortiOS, FortiProxy, FortiMail, FortiManager, FortiAnalyzer, FortiADC, FortiWeb and FortiSIEM not impacted while 29 product names, FortiAuthenticator among them, remain under investigation."
  - claim_id: baf49be92f
    entry: 2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    surface: "actions[0]"
    kind: frontmatter
    text: "Update every internet-facing nginx to 1.31.10 or 1.30.8 (NGINX Plus to 37.3.1.1 or 37.0.9.1) and restart the process, because a reload does not replace the running executable, 1.31.9 and 1.30.7 leave the ssl_early_data CPU-exhaustion flaw open and five unauthenticated flaws reach code execution as the worker with Rapid7's proof of concept for one of them public."
