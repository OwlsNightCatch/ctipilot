    kind: cited
    text: "**Detection:** application and identity telemetry carried the evidence, not endpoint telemetry: Kudelski says abnormal application request volumes, extensive authentication failures and suspicious reconnaissance appeared well before data collection began and the attack still ran through the night ("
    urls: ["https://kudelskisecurity.com/research/the-rise-of-offensive-ai-frameworks-when-business-logic-becomes-the-attack-surface"]
  - claim_id: 8ee4f818ca
    entry: 2026-11-28/kudelski-offensive-ai-identity-lifecycle-insurer
    surface: "body"
    kind: cited
    text: "Its recommended detections include distributed requests against one business function across rotating infrastructure, excessive one-time-code failures, authenticator enrollment without completed MFA, activity against retired APIs, source-map access by automated clients and abnormal onboarding and recovery sequences ("
    urls: ["https://kudelskisecurity.com/research/the-rise-of-offensive-ai-frameworks-when-business-logic-becomes-the-attack-surface"]
  - claim_id: fbee06e64f
