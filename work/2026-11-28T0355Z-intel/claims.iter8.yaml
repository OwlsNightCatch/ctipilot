    text: "The GeoServer project published a batch of security advisories on 2026-11-23, most for flaws fixed in 3.0.2, 2.28.6 and 2.27.7, and five of them chain an anonymous WFS request to code execution: a path disclosure, a service-security bypass with a prefixed service name, an XML injection, a predictable remember-me key that forges an administrator session (critical, CVSS 4.0 9.2) and a JDBC deserialization. The reporter, who says it works on a default installation, published a full-chain proof of concept the same day; the project announced the fixed releases on 2026-10-19. CISA added CVE-2026-120705 and CVE-2026-129243 to its Known Exploited Vulnerabilities catalog on 2026-11-27 on evidence of active exploitation it does not describe, watchTowr reports exploitation attempts in the form of error-based probes that create and invoke stored queries, and NCSC Switzerland rates the chain actively exploited."
