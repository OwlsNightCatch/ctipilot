    extended_notes: |
      Detection concept (telemetry class first): web-application access/WAF logs for unauthenticated requests to the Windchill login servlet and the FlexPLM WSDL endpoint, especially deserialization-error patterns immediately followed by new-file-creation events under the application's web directories (hex-named .jsp artifacts — a file-integrity-monitoring or EDR file-creation telemetry hook); anomalous java/tomcat child-process spawning from the Windchill/FlexPLM application server; mail-flow/DLP telemetry for a burst of outbound messages from a single internal account to a large recipient set referencing a security incident (the mass-extortion-email pattern is itself detectable and distinct from routine internal broadcast mail). Benign-lookalike note: legitimate PTC support/maintenance traffic to these endpoints is authenticated and originates from known administrative sources — unauthenticated hits are the discriminator. Hardening: patch to the fixed build (11.0 M030 or later per reporting; verify exact version against PTC's advisory), take internet-exposed instances off the public network until patched, and treat any instance that was internet-exposed and unpatched since early June 2026 as potentially already compromised (rotate service-account credentials, hunt for webshells) rather than relying on the patch alone to close prior compromise.
