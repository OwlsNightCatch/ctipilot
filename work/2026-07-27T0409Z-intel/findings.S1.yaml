items:
  - title: "CVE-2026-16723 — FastJson 1.2.68–1.2.83 unauthenticated RCE in Spring Boot fat-JARs, actively exploited, no patch available for the 1.x line"
    sources:
      - { url: "https://github.com/alibaba/fastjson2/wiki/Security-Advisory%3A-Remote-Code-Execution-in-fastjson-1.2.68%E2%80%931.2.83", publisher: "Alibaba fastjson2 project (vendor security advisory)", date: "2026-07-21", role: "primary" }
