    extended_notes: |
      Detection concept: telemetry class = process-creation events with parent lineage on the JVM host (the JVM child-spawning a shell/downloader is the terminal indicator; this flaw itself normally manifests as anomalous outbound connections from the Java process as fastjson's type-resolution path attempts to load an attacker-supplied class/resource) plus reverse-proxy/WAF access logs showing JSON request bodies containing `@type` or `@JSONType` fields directed at any endpoint that calls JSON.parse/JSON.parseObject. Benign lookalike: legitimate use of fastjson's polymorphic (de)serialization also carries `@type` fields when AutoType is deliberately and safely enabled with an allowlist (`AutoTypeBeforeHandler`) — the discriminator is whether SafeMode is enabled and whether the resolved type resolves to an allow-listed application DTO versus an unexpected/attacker-controlled class or nested JAR resource path. Hardening lever: enable SafeMode globally, or migrate to fastjson2, which removes the `getResourceAsStream` class-resolution behavior and does not treat `@JSONType` as a trust signal. Staleness note: the vendor advisory itself is dated 2026-07-21 and exploitation confirmation dates to 2026-07-24; no primary source found strictly inside the 24h primary window. Flagged borderline for that reason — see borderline_reason.
