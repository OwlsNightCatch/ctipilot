    discovery_trace: "first seen at: WebSearch (\"CVE exploited critical vulnerability disclosed \\\"July 25, 2026\\\"\") → pivot: WebSearch (\"Fastjson CVE-2026-16723 ThreatBook Imperva exploited Spring Boot\") → pivot: Imperva blog, URL https://www.imperva.com/blog/imperva-customers-protected-against-cve-2026-16723-critical-fastjson-1-x-zero-day-rce/ → primary: Alibaba fastjson2 GitHub wiki security advisory, URL https://github.com/alibaba/fastjson2/wiki/Security-Advisory%3A-Remote-Code-Execution-in-fastjson-1.2.68%E2%80%931.2.83 → follow-up technical explainer: Latest Hacking News, URL https://latesthackingnews.com/2026/07/26/fastjson-rce-vulnerability-how-to-check/"
    summary: |
      A remote code execution vulnerability in Alibaba's fastjson 1.2.68–1.2.83 (the final 1.x release line) is exploitable under the library's stock default configuration when the target application is deployed as a Spring Boot executable fat-JAR (`java -jar xxx.jar`) — the most common Spring Boot deployment model. No AutoType enablement and no classpath gadget chain are required: the entry points `JSON.parse`, `JSON.parseObject(String)` and `JSON.parseObject(String, Class)` are all reachable, and specifying a target DTO class is not a mitigation because attackers can nest a malicious `@type`/`@JSONType` payload inside any Object- or Map-typed field of that DTO. The vendor's own advisory (Alibaba fastjson2 project, GitHub wiki, 2026-07-21) states the flaw was verified end-to-end across Spring Boot 2.x/3.x/4.x and JDK 8/11/17/21. FastJson 1.x is no longer actively maintained and no patched 1.x release exists — remediation is enabling SafeMode (`-Dfastjson.parser.safeMode=true` or `ParserConfig.getGlobalInstance().setSafeMode(true)`), switching to a `noneautotype` build, or migrating to the architecturally distinct fastjson2 (which removes the vulnerable class-resolution path entirely and is unaffected). ThreatBook and Imperva independently confirmed active in-the-wild exploitation by 2026-07-24–25 using Ruby- and Go-based scanning tooling; discovery is credited to Kirill Firsov (FearsOff Cybersecurity). As of 2026-07-26 no vendor fix for fastjson 1.x has shipped and the CVE is not yet CISA KEV-listed. None of the CH/EU authorities checked this run (NCSC-CH, NCSC-NL, BSI, CERT-FR/ANSSI, CERT-EU, CERT-PL) carry an advisory on this CVE, so Swiss/European operators running legacy Java/Spring Boot estates on fastjson 1.x should not assume their national CERT will flag it.
    region_nexus: "global; no CH/EU-specific victimology reported, but fastjson 1.x is widely embedded in legacy enterprise Java/Spring Boot deployments across public-sector and financial estates"
