    extended_notes: |
      Transferable defender lesson: individually low-sensitivity old breach records (an address here, a still-valid phone number there) retain compounding re-identification/targeting value for years after disclosure once an adversary has motive to correlate them — a risk calculus relevant to any organisation's breach-notification and data-retention posture, and a concrete executive/personnel-protection concern for Swiss/EU public officials involved in comparable digital-policy and surveillance-law debates (Switzerland runs its own recurring surveillance-law and digital-ID controversies that could draw the same playbook). No system intrusion is claimed or needed for this technique class — pure OSINT/leak-correlation — so monitoring for it sits in breach-intelligence and executive-protection processes rather than network telemetry.
