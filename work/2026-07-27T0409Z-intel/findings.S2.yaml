        attribution: "FrenchBreaches.com"
        source_url: "https://frenchbreaches.com/alertes/minist-re-de-l-int-rieur-agents-du-gouvernement-ms1uhb3491p6i7ha12a"
    extended_notes: |
      Deliberately low-confidence, single-hacker-claim item carried only because of scale (100k+ law-enforcement personnel) and the shared-campaign link to the corroborated Cybernox item above; both named sources are C/D-tier trade press relaying the SAME underlying hacker post rather than independent confirmation, and neither the ministry nor a high-reliability outlet has confirmed a breach. Treat as a watch item pending victim/government confirmation, not a confirmed incident. If genuine, a professional-email/personnel-directory exposure at this scale is a bulk spearphishing-targeting-list risk against a law-enforcement constituency — a transferable concern for any public-sector body whose staff directory sits behind a third-party/vendor-run HR or forms platform (the suspected GendForm2 angle, itself unconfirmed).
    borderline: true
