items:
  - title: "Hacktivist 'Cybernox' dox 24 French officials over the EU 'Chat Control' CSAM-scanning file, aggregating years-old breach data into targeting dossiers"
    sources:
      - { url: "https://www.cyberattaque.org/chat-control-des-responsables-francais-cibles-par-une-fuite-de-donnees-sensibles/", publisher: "Cyberattaque.org", date: "2026-07-26", role: "primary" }
      - { url: "https://www.zataz.com/chat-control-un-pirate-cible-24-responsables-politiques-francais/", publisher: "ZATAZ.COM (Damien Bancal)", date: "2026-07-26", role: "corroborating" }
    discovery_trace: "first seen at: cyberattaque-org (rotational RSS source), URL https://www.cyberattaque.org/feed/ → article URL https://www.cyberattaque.org/chat-control-des-responsables-francais-cibles-par-une-fuite-de-donnees-sensibles/ → corroboration/technical detail: ZATAZ.COM, URL https://www.zataz.com/chat-control-un-pirate-cible-24-responsables-politiques-francais/"
    summary: |
      A self-described hacktivist using the handle "Cybernox" published on 2026-07-25/26 personal dossiers on 24 French political figures (national and European-level, including sitting MEPs) whom the actor identifies as having voted for the "Chat Control 1.0" file — the EU's temporary derogation from ePrivacy rules permitting voluntary detection of CSAM in private communications, revived at end of June 2026 after MEPs had initially refused its extension in March. Per ZATAZ's Damien Bancal, the published fiches do not originate from a fresh intrusion against Parliament or any single system: the actor states the records were assembled by aggregating and re-correlating data from multiple PRIOR, unrelated breaches touching private companies and public bodies. The technique is doxing-by-aggregation — a stale address from one old leak, a still-active phone number from another, and a compromised administrative document from a third are stitched into one exploitable profile per target. Exposed fields include photographs, home addresses, phone numbers, personal emails, dates of birth, French national ID numbers (NIR), and for some targets banking details. Named targets per ZATAZ include Nadine Morano, Raphaël Glucksmann, Bernard Guetta, Nathalie Loiseau, Pascal Canfin and François-Xavier Bellamy. No party has confirmed a fresh compromise; the operational risk the sources flag is downstream — targeted spearphishing, identity theft, bank fraud, and coordinated harassment/physical-security campaigns against the named individuals, amplified by the political framing.
    region_nexus: "France / EU institutions (national and European Parliament officials)"
