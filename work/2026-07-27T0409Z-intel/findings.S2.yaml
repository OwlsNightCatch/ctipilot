  - title: "Hacktivist collective 'CuteSec' claims a 111,528-record leak of French Interior Ministry / Gendarmerie personnel data, tying it to the same 'Chat Control' protest wave — unconfirmed by the ministry"
    sources:
      - { url: "https://www.cyberattaque.org/ministere-de-linterieur-111-528-agents-revendiques-dans-une-fuite-massive-de-donnees/", publisher: "Cyberattaque.org", date: "2026-07-26", role: "primary" }
      - { url: "https://frenchbreaches.com/alertes/minist-re-de-l-int-rieur-agents-du-gouvernement-ms1uhb3491p6i7ha12a", publisher: "FrenchBreaches.com (breach-tracking aggregator)", date: "2026-07-26", role: "corroborating" }
    discovery_trace: "first seen at: cyberattaque-org (rotational RSS source), URL https://www.cyberattaque.org/feed/ → article URL https://www.cyberattaque.org/ministere-de-linterieur-111-528-agents-revendiques-dans-une-fuite-massive-de-donnees/ → corroboration: FrenchBreaches.com, URL https://frenchbreaches.com/alertes/minist-re-de-l-int-rieur-agents-du-gouvernement-ms1uhb3491p6i7ha12a"
    summary: |
      On 2026-07-26 a hacker using the handle "misère", claiming to act for a collective calling itself "CuteSec", posted a claim of having obtained and republished a database of 111,528 French Interior Ministry personnel records — described as internal identifiers, full names, and professional (with some personal) email addresses tied to domains associated with the Gendarmerie nationale and the "Agence du numérique des forces de sécurité intérieure". FrenchBreaches.com's own tracking adds an unconfirmed provenance lead — that the data "would come from [selon nos informations] the GendForm2 service" — a Gendarmerie-linked form/records platform — while explicitly flagging that the dataset's origin is unverified, that de-duplication of records to distinct individuals has not been established, and that no direct compromise of government infrastructure has been confirmed. The actor explicitly frames the release as a protest tied to the EU "Chat Control" file, the same motive cited in the same-day Cybernox doxing operation against 24 French officials (see companion item). As of this writing the French Ministry of the Interior has issued no public confirmation or denial.
    region_nexus: "France (Ministère de l'Intérieur / Gendarmerie nationale)"
