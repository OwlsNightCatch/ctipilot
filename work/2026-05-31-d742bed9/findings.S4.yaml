  - title: "California AG sues Chrome Holding (formerly 23andMe) over 2023 credential-stuffing breach of 7M genetic-data records"
    sources:
      - url: "https://oag.ca.gov/news/press-releases/attorney-general-bonta-sues-chrome-holding-co-formerly-known-23andme-over-2023"
        publisher: "California Office of the Attorney General"
        date: "2026-05-29"
        role: "primary"
      - url: "https://www.bleepingcomputer.com/news/security/california-ag-sues-23andme-over-2023-breach-exposing-health-data/"
        publisher: "BleepingComputer"
        date: "2026-05-29"
        role: "corroborating"
      - url: "https://www.theregister.com/legal/2026/05/29/rob-bonta-sues-23andmes-new-owners-over-2023-breach/5248565"
        publisher: "The Register"
        date: "2026-05-29"
        role: "corroborating"
    discovery_trace: "first seen at: bleepingcomputer RSS feed, URL https://www.bleepingcomputer.com/news/security/california-ag-sues-23andme-over-2023-breach-exposing-health-data/ → primary: California AG press release, URL https://oag.ca.gov/news/press-releases/attorney-general-bonta-sues-chrome-holding-co-formerly-known-23andme-over-2023 → corroborating: The Register, URL https://www.theregister.com/legal/2026/05/29/rob-bonta-sues-23andmes-new-owners-over-2023-breach/5248565"
    summary: |
      California Attorney General Rob Bonta filed suit on 29 May 2026 against Chrome Holding Co.
      (formerly 23andMe, now in Chapter 11 bankruptcy) over the October 2023 genetic-data breach
      affecting approximately 6.9 million users worldwide including 855,541 Californians. The
      complaint, filed in San Francisco Superior Court, alleges that threat actor "Golem" compromised
      ~14,000 accounts via credential stuffing — reusing credentials from prior breaches including the
      2017 MyHeritage compromise — and then leveraged 23andMe's DNA Relatives feature (a kinship-
      matching function with a coding error allowing bulk enumeration) to access data belonging to
      the remaining ~6.9 million. Exposed data classes include raw DNA sequences, ancestry and
      ethnicity data, genetic health predispositions, biological relative connections and family
      histories. Bonta additionally alleges that 23andMe (a) ignored a suspicious login spike in
      July 2023 and Reddit discussion of the breach in August 2023, (b) made publicly-false statements
      claiming no system compromise occurred, (c) negotiated and paid ransom in exchange for deletion
      of breach data and disclosure of exploited vulnerabilities, and (d) failed to enforce MFA or
      reset compromised credentials despite the prior MyHeritage credential exposure being a publicly
      known vector. Legal counts: California Genetic Information Privacy Act, Reasonable Data Security
      Law, False Advertising Law, Unfair Competition Law, CCPA. Remedies: statutory penalties of
      $1,000–$7,500 per violation plus injunctive relief; prior $30M class-action settlement (2024,
      later finalised at $50M) does not preclude this state-enforcement action. Defender lesson:
      genetic and health SaaS operators should enforce MFA and bulk-export rate-limiting on social
      connectivity features; credential-stuffing protection (velocity checks on repeated login failures,
      breach-credential blocking via HIBP API) is a legal requirement under CA law. Affected feature:
      the DNA Relatives kinship-match function's API endpoint, which enumerated matched records without
      per-request access checks.
    ch_eu_nexus: "US-primary but relevant to EU/CH: GDPR-regulated genetic data processors face the same class of obligation; the EDPB explicitly lists genetic data as a special category requiring heightened security under Art. 9 GDPR. European DPAs routinely cite US AG enforcement for benchmarking fines."
    public_sector_nexus: "indirect — private company, but the genetic data exposure pattern (bulk enumeration via social-graph feature coding error + absence of MFA) maps directly onto how EU public-sector health registries expose data."
    sector: "healthcare, genetics, biotech"
    cves: []
    actors_campaigns_malware: ["Golem (threat actor, unattributed criminal)"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "The breach exposed information for approximately 6.9 million customers, including 855,541 Californians"
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/california-ag-sues-23andme-over-2023-breach-exposing-health-data/"
      - quote: "23andMe failed to implement reasonable safeguards against credential-stuffing attacks and missed multiple opportunities to detect the intrusion, overlooked a coding error in the DNA Relatives feature that enabled widespread access, and made misleading statements before and after the incident"
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/california-ag-sues-23andme-over-2023-breach-exposing-health-data/"
      - quote: "Bonta's office claims 23andMe negotiated and paid ransom to the threat actor in exchange for removal of breach information posted online and details about multiple 23andMe security vulnerabilities"
        attribution: "The Register"
        source_url: "https://www.theregister.com/legal/2026/05/29/rob-bonta-sues-23andmes-new-owners-over-2023-breach/5248565"
    extended_notes: |
      The CCPA/GIPA claims are significant because Chrome Holding Co. is now a bankrupt shell; the
      AG appears to be pursuing injunctive relief to constrain how the buyer of 23andMe's assets
      (TTAM Research Institute, led by Anne Wojcicki) handles the genetic records. The suit's reference
      to ransom payment is unusual in an AG enforcement complaint and may surface in discovery in a
      way that has precedent-setting implications for ransomware-payment disclosure obligations.
      The UK ICO already fined 23andMe £23M in June 2025 over the same breach; the California
      action adds a second jurisdiction's enforcement.

  - title: "UPDATE: ShinyHunters Salesforce-credential campaign — Charter Communications HIBP-confirmed 4.9M unique records; attack vector Entra vishing → Salesforce"
    sources:
      - url: "https://www.bleepingcomputer.com/news/security/charter-communications-data-breach-affects-49-million-accounts/"
        publisher: "BleepingComputer"
        date: "2026-05-29"
        role: "primary"
      - url: "https://haveibeenpwned.com/Breach/Charter"
        publisher: "Have I Been Pwned"
        date: "2026-05-29"
        role: "primary"
      - url: "https://www.securityweek.com/charter-communications-data-breach-could-impact-nearly-5-million/"
        publisher: "SecurityWeek"
        date: "2026-05-29"
        role: "corroborating"
    discovery_trace: "first seen at: bleepingcomputer RSS feed, URL https://www.bleepingcomputer.com/news/security/charter-communications-data-breach-affects-49-million-accounts/ → primary: HIBP breach page, URL https://haveibeenpwned.com/Breach/Charter → corroborating: SecurityWeek, URL https://www.securityweek.com/charter-communications-data-breach-could-impact-nearly-5-million/"
    summary: |
      > **UPDATE (originally covered 2026-05-25 / 2026-05-27 via ShinyHunters Salesforce campaign):**
      Have I Been Pwned (HIBP) has de-duplicated and published the Charter Communications dataset,
      confirming 4,913,820 unique email addresses from the ShinyHunters leak. The confirmed data
      classes are: names, email addresses, physical addresses, phone numbers, phone type, and plan
      information; an embedded ~85,000-record internal employee subset additionally exposes job
      titles. The attack methodology is now more precisely documented: on approximately 1 April 2026
      ShinyHunters used voice phishing (vishing) to trick a Charter employee into surrendering
      credentials to a Microsoft Entra (Azure AD) account; from there the group pivoted to Charter's
      Salesforce CRM environment where the customer records were stored. The gap between ShinyHunters'
      claimed 42M records (all rows including duplicates) and the HIBP-verified 4.9M unique identities
      is explained by duplicate/test/empty-email rows in the raw database dump. Charter maintains no
      CPNI or financial data was included. The attack is part of the broader Salesforce Aura/Community
      credential-relay campaign spanning Charter, 7-Eleven, Carnival (5.99M confirmed), and further
      victims not yet disclosed. Defender priority: audit Entra security defaults — ensure SSPR
      (Self-Service Password Reset) and MFA for all cloud-identity accounts; map all CRM integrations
      (Salesforce Connected Apps) that consume federated Entra tokens; implement Conditional Access
      policies requiring MFA for Salesforce OAuth flows.
    ch_eu_nexus: "Indirect — pattern applies to any EU/CH org using Microsoft Entra as IdP for Salesforce via OAuth. The vishing-to-Entra-to-CRM chain is a documented Scattered Spider / ShinyHunters attack template being replicated across sectors."
    public_sector_nexus: "indirect — direct victim is US telecom; technique maps to Swiss/EU public-sector CRM or Entra-brokered SaaS deployments."
    sector: "telco"
