  - title: "CERT Polska: QuickCMS (OpenSolution) CVE-2026-33384 (session fixation) + CVE-2026-33386 (MITM-XSS via plugin fetch over HTTP) — patched in v6.8 (2026-05-15), disclosure 2026-05-29"
    sources:
      - { url: "https://cert.pl/en/posts/2026/05/CVE-2026-33384/", publisher: "CERT Polska", date: "2026-05-29", role: "primary" }
    discovery_trace: "first seen at: enisa-euvd bridge subcommand (recent lastvulnerabilities), items EUVD-2026-33338 and EUVD-2026-33339 both published 29 May 2026, assigner CERT-PL → reference https://cert.pl/posts/2026/05/CVE-2026-33384/ → fetched primary via bridge url https://cert.pl/en/posts/2026/05/CVE-2026-33384/"
    summary: |
      On 29 May 2026 CERT Polska disclosed two vulnerabilities in QuickCMS, the PHP-based content management system developed by Polish vendor OpenSolution, version 6.8 and earlier. CVE-2026-33384 (CVSS 4.0 score 4.8 / CVSS vector AV:L/AC:L/AT:N/PR:N/UI:P/VC:L/VI:L/VA:N) is a session fixation flaw: the application allows the session identifier to be set before authentication, and the session ID is not rotated after successful login, enabling an attacker to pre-seed a session token in the victim's browser (via a crafted URL or link), wait for the victim to authenticate, and then use the pre-seeded token to impersonate the authenticated session without knowing the victim's password (CWE-384 Session Fixation). CVE-2026-33386 (CVSS 4.0 score 2.3 / AV:A/AC:L/AT:P/PR:N/UI:N) is an MITM-exploitable XSS: QuickCMS fetches its plugin list from a fixed HTTP (non-TLS) endpoint at opensolution.org; an attacker in a position to intercept the connection can inject arbitrary HTML/JavaScript that is rendered unescaped in the admin panel. Both issues were patched in QuickCMS 6.8 released 15 May 2026; CERT Polska coordinated disclosure.
      QuickCMS is deployed in Polish public-sector websites, municipal portals, small-business and NGO sites across Poland and Central/Eastern Europe. The session fixation vector is particularly relevant for government portals that share a session cookie domain across multiple services — a pre-seeded session from one endpoint may be valid on another. Defender takeaways: force session regeneration (`session_regenerate_id(true)`) post-authentication in custom deployments; configure HTTPS-only cookie flags (`Secure`, `HttpOnly`, `SameSite=Strict`); migrate plugin update mechanisms to HTTPS; upgrade to QuickCMS 6.8 or later.
    ch_eu_nexus: "Poland / Central-Eastern Europe; Polish public-sector web infrastructure"
    public_sector_nexus: "direct — deployed in Polish municipal and government portals"
    sector: "government, public administration"
    cves: [CVE-2026-33384, CVE-2026-33386]
    actors_campaigns_malware: []
    verification: SINGLE-SOURCE-NATIONAL-CERT
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "QuickCMS allows a user's session identifier to be set before authentication. The value of this session ID stays the same after authentication. This behaviour enables an attacker to fix a session ID for a victim and later hijack the authenticated session."
        attribution: "CERT Polska (ENISA EUVD EUVD-2026-33338)"
        source_url: "https://cert.pl/en/posts/2026/05/CVE-2026-33384/"
      - quote: "QuickCMS is vulnerable to Cross-Site Scripting (XSS) through its insecure HTTP-based plugin-fetching mechanism. A malicious attacker can perform a Man-in-the-Middle (MITM) attack by impersonating the opensolution.org server and serving arbitrary HTML or JavaScript at the plugin list endpoint."
        attribution: "CERT Polska (ENISA EUVD EUVD-2026-33339)"
        source_url: "https://cert.pl/en/posts/2026/05/CVE-2026-33384/"

  - title: "GCHQ Director speech (27 May): Russia conducting daily hybrid attacks on UK and European critical infrastructure — energy, subsea cables, supply chains, democratic processes"
    sources:
      - { url: "https://www.euronews.com/my-europe/2026/05/27/uk-cyberspy-chief-calls-ai-unstoppable-force-and-warns-about-threats-from-russia", publisher: "Euronews", date: "2026-05-27", role: "primary" }
      - { url: "https://therecord.media/russia-conducting-attacks-on-uk-gchq-briefing", publisher: "The Record (Recorded Future News)", date: "2026-05-28", role: "corroborating" }
      - { url: "https://www.cnn.com/2026/05/27/europe/gchq-russia-relentlessly-targeting-uk-intl", publisher: "CNN", date: "2026-05-27", role: "corroborating" }
    discovery_trace: "first seen at: therecord.media feed (item 'Russia conducting daily attacks on UK from seabed to cyberspace, spy chief warns', pub Thu 28 May 2026), URL https://therecord.media/russia-conducting-attacks-on-uk-gchq-briefing → fetched article body → WebSearch for additional sources → Euronews primary https://www.euronews.com/my-europe/2026/05/27/uk-cyberspy-chief-calls-ai-unstoppable-force-and-warns-about-threats-from-russia fetched → CNN corroborating https://www.cnn.com/2026/05/27/europe/gchq-russia-relentlessly-targeting-uk-intl fetched"
    summary: |
      On 27 May 2026, GCHQ Director Anne Keast-Butler delivered the inaugural GCHQ Annual Lecture at Bletchley Park, warning that Russia is "relentlessly targeting critical infrastructure, democratic processes, supply chains and public trust" across the UK and Europe, and is scaling up "daily hybrid activity against the UK and Europe, stretching from the seabed to cyberspace." She named energy infrastructure (power plants, dams) and subsea cables and energy pipelines in British waters as a "sharp focus" for GCHQ defensive operations, with specific reference to "exposing Russia's intent, motive and underwater capabilities." Keast-Butler framed the current period as "a space between peace and war," and cited recent confirmed attacks in Sweden, Poland, Denmark, and Norway targeting critical infrastructure. She identified China as a second key threat (cyberspace, economic espionage) and described AI as an "unstoppable force" with dual-use implications for both defence and offensive operations.
      Operational relevance for CH/EU defenders: The speech represents official UK government attribution of an ongoing Russia-state hybrid campaign targeting European energy and communications infrastructure. It reinforces the threat picture from the ESET APT report (covered 2026-05-30) and from the Amazon/Sandworm disclosures documenting sustained GRU targeting of Western energy sector via misconfigured edge devices. Swiss critical infrastructure operators (energy, water, transport, telecoms) should review their exposure of management interfaces on internet-facing routers, VPN concentrators, and network appliances; ensure subsea and terrestrial cable-landing and amplifier-station systems are segmented from general IT networks; and validate that all edge devices are fully patched for known VPN/remote-access CVEs (including CVE-2026-0257, CVE-2026-6973, and the Exim/Samba set from prior advisories). The public attribution naming Sweden, Poland, Denmark, and Norway as recent victims elevates the plausibility of similar attacks against Swiss and other EU member-state infrastructure.
      Note: GCHQ did not publish a formal advisory or technical report with the speech; the speech itself is the primary open-source intelligence item. Source date is 27 May 2026 — within the 72h developing_window but outside the 36h primary window. Included as geopolitical threat context for the developing_window.
