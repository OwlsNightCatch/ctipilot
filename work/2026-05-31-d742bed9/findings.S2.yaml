  - title: "UPDATE: CVE-2026-0257 — PAN-OS GlobalProtect authentication-bypass exploitation confirmed by NCSC-NL (May 30) and Palo Alto advisory update (May 29)"
    sources:
      - { url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0172", publisher: "NCSC-NL", date: "2026-05-30", role: "primary" }
      - { url: "https://www.rapid7.com/blog/post/etr-rapid7-observed-exploitation-of-pan-os-globalprotect-authentication-bypass-vulnerability-cve-2026-0257/", publisher: "Rapid7", date: "2026-05-29", role: "corroborating" }
      - { url: "https://security.paloaltonetworks.com/CVE-2026-0257", publisher: "Palo Alto Networks PSIRT", date: "2026-05-13 (updated 2026-05-29)", role: "corroborating" }
    discovery_trace: "first seen at: ncsc-nl bridge subcommand (NCSC-2026-0172), URL https://advisories.ncsc.nl/advisory?id=NCSC-2026-0172 → CSAF detail fetched via ncsc-nl csaf NCSC-2026-0172 → references: Rapid7 exploitation report https://www.rapid7.com/blog/post/etr-rapid7-observed-exploitation-of-pan-os-globalprotect-authentication-bypass-vulnerability-cve-2026-0257/ + Palo Alto PSIRT https://security.paloaltonetworks.com/CVE-2026-0257"
    summary: |
      UPDATE (originally covered 2026-05-30): On 30 May 2026 NCSC-NL issued advisory NCSC-2026-0172 confirming active exploitation of CVE-2026-0257, the authentication bypass in PAN-OS GlobalProtect portal and gateway components. The flaw arises from CWE-565 (Reliance on Cookies without Validation and Integrity Checking): when the HTTPS certificate for the portal or gateway is reused for the authentication override cookie encryption, an unauthenticated attacker can derive the public key from the certificate, forge and encrypt arbitrary authentication override cookies, and have them accepted server-side — bypassing authentication and establishing an unauthorised VPN connection. NCSC-NL rates probability High / damage High and explicitly warns that with a public PoC now available, scale of abuse is expected to increase in the near term. Palo Alto updated its advisory on 29 May confirming limited exploitation of unpatched appliances. Rapid7 first observed exploitation from 17 May 2026, with two distinct waves from Vultr-hosted and Dromatics Systems infrastructure, via analysis of Cloud Authentication Service (CAS) disablement and forged authentication-override cookies in PAN-OS tech-support files.
      Prerequisite: GlobalProtect portal or gateway must have authentication override cookies enabled ("Generate cookie for authentication override" or "Accept cookie for authentication override") AND the certificate used for cookie encryption must be shared with the HTTPS service (the default/common misconfiguration). Attack surface: GlobalProtect portal and gateway endpoints on internet-facing PAN-OS appliances; Panorama and Cloud NGFW are not affected. Patched versions: per Palo Alto advisory; no patch-date specified in the NCSC-NL CSAF. Mitigation: disable authentication override cookies or generate a dedicated certificate used exclusively for the override feature; apply available vendor updates.
      Detection: Log 4776 or equivalent session-creation events from GlobalProtect with no corresponding MFA event; monitor for VPN session establishment from unexpected source IPs with Authentication Override Cookie method; look for CAS (Cloud Authentication Service) disabled state in PAN-OS audit logs; Sysmon/endpoint telemetry showing VPN client spawning processes or lateral movement from a new VPN-sourced subnet where the connecting certificate fingerprint does not match corporate CA chains.
    ch_eu_nexus: "global; PAN-OS GlobalProtect is widely deployed in Swiss public administration, financial sector, and EU government networks as a perimeter VPN"
    public_sector_nexus: "direct — VPN edge devices are primary perimeter for government remote access"
    sector: "government, finance, energy, all sectors using PAN-OS GlobalProtect"
    cves: [CVE-2026-0257]
    actors_campaigns_malware: []
