      - quote: "CWE-565: Reliance on Cookies without Validation and Integrity Checking"
        attribution: "NCSC-NL CSAF"
        source_url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0172"
    extended_notes: |
      ENISA EUVD EUVD-2026-30104 updated 30 May 2026 now shows exploitedSince=2026-05-29 and EPSS=41.51 (very high probability). This is one of the most exploited edge-device vulnerabilities currently in the wild. Public sector SOC managers should treat this as a Patch Tuesday priority item and verify no internet-facing PAN-OS appliances have authentication override cookies enabled with a shared certificate.

  - title: "Mautic open-source marketing automation: 7 CVEs in 7.1.2 / 6.0.9 security releases — SQL injection, SSRF, stored XSS, path traversal (BSI WID-SEC-2026-1724, May 29)"
    sources:
      - { url: "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-1724", publisher: "BSI CERT-Bund", date: "2026-05-29", role: "primary" }
      - { url: "https://github.com/mautic/mautic/security/advisories/GHSA-fcmw-wx57-9p75", publisher: "Mautic Project (GitHub Advisory)", date: "2026-05-28", role: "corroborating" }
      - { url: "https://mautic.org/releases/", publisher: "Mautic.org", date: "2026-05-29", role: "corroborating" }
    discovery_trace: "first seen at: bsi-rss feed (item title '[NEU] [hoch] Mautic: Mehrere Schwachstellen', pub Fri 29 May 2026), URL https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-1724 → fetched BSI CSAF WID-SEC-2026-1724 via bridge bsi-csaf subcommand → references: GitHub security advisories GHSA-fcmw-wx57-9p75, GHSA-5hvg-w58j-545m etc published 2026-05-28/29 → mautic.org releases page confirming 7.1.2/6.0.9"
    summary: |
      On 28–29 May 2026, the Mautic project published releases 7.1.2 and 6.0.9 addressing seven vulnerabilities in this widely-used open-source marketing automation platform. BSI CERT-Bund issued advisory WID-SEC-2026-1724 on 29 May with severity "hoch" (HIGH) covering all seven CVEs. Exploitation status is unknown (no in-the-wild evidence). The full set: CVE-2026-4776 (SQL injection in API Contact Filtering — authenticated required); CVE-2026-9557 (SSRF in the Mautic Focus component — allows authenticated user to read internal resources and local files); CVE-2026-9558, CVE-2026-9559, CVE-2026-9808, CVE-2026-9809, CVE-2026-9811 (stored XSS, file inclusion/path traversal, JavaScript code injection via browser of other users, manipulation of files outside intended directories — all authenticated). Affected operating systems: Linux and Unix. The SSRF vector (CVE-2026-9557) allows an authenticated Mautic user with access to the Focus campaign builder to make the server issue HTTP requests to internal network resources — a significant risk in environments where Mautic runs with access to an internal network segment or AWS/Azure metadata endpoints.
      Mautic is deployed by European public-sector communications teams, NGOs, political parties, universities, and healthcare providers for email campaign management. An attacker with a Mautic user account (e.g. via stolen credentials, compromised newsletter editor account) can pivot to internal network reconnaissance via SSRF (T1090.002), execute stored XSS attacks against administrative users (T1059.007), or extract credentials from internal services accessible to the Mautic server. Patched versions: 7.1.2 and 6.0.9 (released 2026-05-28/29). Earlier branches affected but no separate patch; Mautic 5.x / 4.x end-of-life branches not evaluated. Hardening: restrict Mautic server network access via egress filtering (block metadata endpoints and internal subnets); review Mautic user accounts and apply least-privilege; apply content-security-policy headers on the admin interface; upgrade to patched versions immediately.
    ch_eu_nexus: "Europe-wide; Mautic is widely used across European organisations including universities, cantonal administrations, and public-interest bodies for GDPR-compliant email campaign management"
