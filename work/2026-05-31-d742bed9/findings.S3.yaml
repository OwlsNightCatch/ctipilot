  - title: "Gitea CVE-2026-27771 — four-year-old container registry access-control flaw exposes private images across 30,000 deployments to unauthenticated pull"
    sources:
      - url: "https://orca.security/resources/blog/gitea-container-registry-vulnerability/"
        publisher: "Orca Security"
        date: "2026-05-27"
        role: "primary"
      - url: "https://thehackernews.com/2026/05/gitea-vulnerability-exposes-private.html"
        publisher: "The Hacker News"
        date: "2026-05-27"
        role: "corroborating"
    discovery_trace: "first seen at: WebSearch ('Gitea CVE-2026-27771 unauthenticated container image pull vulnerability May 2026') → primary: Orca Security article, URL https://orca.security/resources/blog/gitea-container-registry-vulnerability/ → corroborating: THN URL https://thehackernews.com/2026/05/gitea-vulnerability-exposes-private.html"
    summary: |
      Orca Security disclosed CVE-2026-27771 on approximately May 27, a four-year-old access-control flaw in Gitea's built-in container registry. The vulnerability stems from an authentication model gap: when a repository is marked private, the container registry endpoint (`/v2/<owner>/<repo>/manifests/` and blob endpoints) still served OCI image manifests and layer blobs to unauthenticated HTTP requests — the "private" designation applied to the Git repository UI did not propagate to the registry's ACL layer. An unauthenticated remote attacker can pull complete container images, Dockerfiles, and any secrets baked into layers (environment variables, API keys, certificates, private code) without an account. The flaw was discovered by NoScope's autonomous penetration testing agent in April 2026. Orca estimates more than 30,000 Gitea deployments across 30+ countries are affected, spanning healthcare providers, aerospace manufacturers, retail infrastructure, and ISPs. The vulnerability was present in all Gitea versions prior to 1.26.2; patch is available in 1.26.2. Temporary workaround (if patching is delayed): set `[service].REQUIRE_SIGNIN_VIEW=true` in Gitea configuration to enforce authentication on all views including the registry. CVSS score 8.2.
    ch_eu_nexus: "Gitea is the preferred self-hosted Git alternative in CH/EU public-sector and academic institutions preferring on-premises or sovereign-cloud SCM. Swiss government repositories, cantonal IT providers, and university research environments using Gitea are in scope."
    public_sector_nexus: "direct — public-sector organisations using self-hosted Gitea for DevOps pipelines are exposed"
    sector: "cross-sector, public-sector, government, healthcare, education"
    cves: [CVE-2026-27771]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Gitea flaw CVE-2026-27771 exposed private container images across 30,000 deployments, risking unauthorized access worldwide"
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/05/gitea-vulnerability-exposes-private.html"
    extended_notes: |
      Note: Source publication date May 27 (outside 36h primary window, within 5 days). Included for direct CH/EU public-sector relevance (Gitea is the predominant open-source SCM in the region). Organisations should: (1) audit Gitea version and upgrade to >=1.26.2, (2) audit historical container registry push logs for unexpected pulls from external IPs, (3) rotate any credentials/keys present in container image layers if exploitation cannot be ruled out. The NoScope autonomous agent discovery angle is relevant context: this represents AI-assisted vulnerability discovery now also on the defensive side.

