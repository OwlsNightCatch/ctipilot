  - title: "Elastic Security Labs: Tycoon 2FA AiTM kit — device-code-grant abuse creates device PRT that survives session revocation; detection engineering across Entra ID and Google Workspace"
    sources:
      - url: "https://www.elastic.co/security-labs/tycoon-2fa-aitm-detection-engineering"
        publisher: "Elastic Security Labs"
        date: "2026-05-26"
        role: "primary"
      - url: "https://www.esentire.com/blog/tycoon-2fa-operators-adopt-oauth-device-code-phishing"
        publisher: "eSentire"
        date: "2026-05-28"
        role: "corroborating"
    discovery_trace: "first seen at: elastic-seclabs RSS feed https://www.elastic.co/security-labs/rss/feed.xml (item published 2026-05-26) → primary: Elastic article URL https://www.elastic.co/security-labs/tycoon-2fa-aitm-detection-engineering → corroborating eSentire via WebSearch"
    summary: |
      Elastic Security Labs published a detailed Tycoon 2FA AiTM detection-engineering primer on May 26 mapping the kit's full attack chain across Microsoft 365 (Entra ID) and Google Workspace, with a significant new finding: the Microsoft variant now abuses the Authentication Broker device-code grant flow to register a new device in Entra and establish a PrimaryRefreshToken (PRT) that survives standard "revoke sign-in sessions + reset password" incident response. The PRT chain: kit obtains device code from `oauth2/devicecode` endpoint → victim authenticates at `microsoft.com/devicelogin` → kit resource-swaps the MAB refresh token for a `urn:ms-drs:enterpriseregistration.windows.net` access token → POSTs synthetic PKCS#10 CSR to `EnrollmentServer/device` to register a device → uses device certificate-signed JWT to brokered tokens for Teams/Outlook/OneDrive/Intune. When a defender fires `revokeSignInSessions`, the device-PRT on the registered device remains valid. IR playbook must enumerate and delete registered devices *before* revoking sessions. Detection engineering details: (1) Kit relay uses `node`, `axios`, `undici`, `node-fetch` user-agents — detectable in Entra sign-in logs against OfficeHome/Graph/Exchange apps. (2) Cross-tier detection: two distinct ASNs (cloud-VPS + residential-proxy) authenticating as the same user principal within minutes is the high-confidence cross-tier indicator. (3) Entra ID Protection's `aiConfirmedSafe` label observed marking kit egress as safe during tier-2 relay — excluding events with this label causes false negatives. (4) Google Workspace variant: IP-based impossibility-travel detection (`st_distance()` geospatial ES|QL) and first-seen-ASN new-term detection are the recommended approaches; `is_suspicious` field is consistently `false` for kit relay IPs. (5) Kit anti-analysis: IP allowlist checks via api.ipapi.is with reversed cloud-provider strings; `navigator.webdriver` detection redirecting to `about:blank`. Tycoon 2FA accounted for ~62% of phishing attempts blocked by Microsoft before March 2026 takedown; eSentire documented rapid recovery combining prior tradecraft with OAuth device-code flows within weeks.
    ch_eu_nexus: "Direct — Tycoon 2FA targets Microsoft 365 and Google Workspace, deployed universally across Swiss and European public-sector organisations. The device-PRT persistence mechanism means standard IR procedures are insufficient."
    public_sector_nexus: "direct — any organisation relying on M365 or Google Workspace for email/collaboration is in scope"
    sector: "cross-sector, public-sector, government, financial"
    cves: []
    actors_campaigns_malware: ["Tycoon 2FA", "Storm-1747"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "When a defender fires revokeSignInSessions (which invalidates all user-level tokens and refresh tokens), the device PRT remains valid because the device is a separate principal in Entra ID"
        attribution: "Elastic Security Labs"
        source_url: "https://www.elastic.co/security-labs/tycoon-2fa-aitm-detection-engineering"
      - quote: "The session cookie is the value the operator monetizes. Once captured, MFA is moot because the operator replays minted tokens post-MFA."
        attribution: "Elastic Security Labs"
