  - title: "Talos: heap overflow attack surface in DICOM imaging infrastructure — Orthanc PACS server targeted during network file ingestion"
    sources:
      - url: "https://blog.talosintelligence.com/dicom-pydicom-gdcm-and-orthanc-a-technical-tour-of-what-really-happens-in-the-heap/"
        publisher: "Cisco Talos"
        date: "2026-05-28"
        role: "primary"
    discovery_trace: "first seen at: Talos RSS feed https://blog.talosintelligence.com/rss/ (item published 2026-05-28) → primary: Cisco Talos article URL https://blog.talosintelligence.com/dicom-pydicom-gdcm-and-orthanc-a-technical-tour-of-what-really-happens-in-the-heap/"
    summary: |
      Cisco Talos published a vulnerability deep-dive white paper on May 28 demonstrating heap overflow vulnerability creation through exploitation of the DICOM file format against Orthanc, a widely-deployed open-source PACS (Picture Archiving and Communication System) server used in hospital radiology and medical imaging departments. The research constructs an out-of-bounds write condition triggered during the image upload pathway — the attack surface of highest concern because hospital PACS systems routinely auto-ingest DICOM files received over the network, meaning a malformed file from any connected modality (CT scanner, MRI, X-ray) or from a compromised upstream source can directly trigger vulnerable decoders. The research covers multiple DICOM parser implementations: the Python library Pydicom, GDCM (Grassroots DICOM), and the Orthanc server's own parser. The white paper demonstrates that structural complexity in the DICOM format's variable-length value representation (VR) tags, combined with lax bounds checking in heap allocators, yields reliable out-of-bounds write primitives. No CVE identifiers are disclosed in the public blog post; the full technical details are in the linked PDF. The research establishes that DICOM-speaking infrastructure is a viable network-reachable attack surface for pre-authenticated exploitation, with implications for Swiss and European hospital PACS environments that face mandatory DICOM connectivity to vendor equipment.
    ch_eu_nexus: "Direct — Swiss hospitals (including cantonal and university hospitals) universally deploy PACS/DICOM infrastructure; EU NIS2 critical-entity threshold encompasses healthcare. Orthanc is open-source and widely used in CH/EU academic medical centres."
    public_sector_nexus: "direct — public hospital sector"
    sector: "healthcare, OT/medical-devices"
    cves: []
    actors_campaigns_malware: []
    verification: SINGLE-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "Hospitals rely on DICOM-based PACS systems, and those systems often automatically ingest files received over the network. That means malformed data could directly trigger vulnerable decoders — the holy grail of attack surfaces for those studying robustness"
        attribution: "Cisco Talos"
        source_url: "https://blog.talosintelligence.com/dicom-pydicom-gdcm-and-orthanc-a-technical-tour-of-what-really-happens-in-the-heap/"
    extended_notes: |
      MITRE ATT&CK T1190 (Exploit Public-Facing Application) is the technique class if a PACS endpoint is internet-exposed or reachable from a compromised network segment. The more probable path is T1059/T1203 via a malformed study received from a compromised imaging modality or referring institution over DICOM networking (C-STORE SCU). Defender posture: review network segmentation between PACS servers and clinical workstations; confirm Orthanc instances are running a supported version and have network-level ACLs restricting DICOM C-STORE access to known modality AE titles. Full PDF technical details: https://blog.talosintelligence.com/content/files/2026/05/DICOM2026-2.pdf

  - title: "Signal backup-stealing campaign: attackers impersonate Signal Support to extract cloud-backup recovery keys from encrypted-messaging users"
    sources:
      - url: "https://techcrunch.com/2026/05/28/hackers-are-trying-to-steal-signal-users-backups-in-new-wave-of-phishing-attacks/"
        publisher: "TechCrunch"
        date: "2026-05-28"
        role: "primary"
      - url: "https://www.malwarebytes.com/blog/news/2026/05/signal-users-targeted-in-backup-stealing-phishing-attacks"
        publisher: "Malwarebytes"
        date: "2026-05-29"
        role: "corroborating"
    discovery_trace: "first seen at: malwarebytes RSS feed https://www.malwarebytes.com/blog/feed/ (item published 2026-05-29) → primary: TechCrunch, URL https://techcrunch.com/2026/05/28/hackers-are-trying-to-steal-signal-users-backups-in-new-wave-of-phishing-attacks/"
    summary: |
      A new phishing campaign first reported May 28 targets Signal users by impersonating Signal's support team. Attackers send messages warning the victim that their cloud-backed chats are "at risk of permanent loss due to a sync issue" and instruct them to retrieve their Signal cloud-backup recovery key from the app and paste it into the conversation. Signal cloud backups are end-to-end encrypted with this recovery key — without it, an attacker who separately hijacks the victim's phone number (through SIM-swap or SS7 abuse) can only intercept future messages; the historical archive of conversations, photos and documents stored in the Signal cloud backup remains locked behind the key. The campaign's anti-CCP activism targeting (confirmed by multiple sources) suggests China-nexus state actors, but Malwarebytes and TechCrunch both note the technique could be used by any threat actor targeting secure-messaging users. Signal itself states it will "never reach out first" and will "never ask for a registration code, PIN, or recovery key." The attack is pure social engineering (T1566 Phishing / T1598 Spearphishing) with no technical exploit component; the lure exploits users' fear of data loss in an app they specifically chose for security. The target population includes activists, journalists, government officials and civil-society organizations — populations well-represented in EU/CH public-sector environments using Signal for sensitive communications.
    ch_eu_nexus: "Signal is widely used by Swiss and European government officials, journalists and civil-society organisations for sensitive communications. The attack targets the backup infrastructure rather than the transport encryption, exposing historical conversation archives."
    public_sector_nexus: "indirect — targeting individuals using Signal for sensitive government or civil-society communications"
    sector: "government, civil society, media, public-sector"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "A new hacking campaign is trying to trick Signal users to give up their secret recovery key, which can be used to access online backups containing past messages"
        attribution: "TechCrunch"
        source_url: "https://techcrunch.com/2026/05/28/hackers-are-trying-to-steal-signal-users-backups-in-new-wave-of-phishing-attacks/"
      - quote: "Signal says it 'will never reach out' to users first, and will never ask for their registration code, PIN, or recovery key"
        attribution: "Malwarebytes"
        source_url: "https://www.malwarebytes.com/blog/news/2026/05/signal-users-targeted-in-backup-stealing-phishing-attacks"
