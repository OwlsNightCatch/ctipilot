  - title: "UPDATE: CVE-2026-0257 PAN-OS GlobalProtect — Rapid7 confirms active exploitation, certificate-reuse cookie-forgery PoC published, CISA KEV added"
    sources:
      - url: "https://www.rapid7.com/blog/post/etr-rapid7-observed-exploitation-of-pan-os-globalprotect-authentication-bypass-vulnerability-cve-2026-0257/"
