    extended_notes: |
      Defender detection pivot: GlobalProtect web-server access logs will show the spoofed hostname "GP-CLIENT" and MAC address "aa:bb:cc:dd:ee:ff" in cookie-authenticated sessions from unknown source IPs. Mitigation options: (1) disable authentication override cookies entirely, or (2) generate a dedicated new certificate used exclusively for authentication override — this prevents public-key extraction via TLS handshake from non-cookie endpoints. Patched versions per Palo Alto PSIRT advisory at https://security.paloaltonetworks.com/CVE-2026-0257.

