        date: "2026-05-30"
        role: "corroborating"
      - url: "https://security.paloaltonetworks.com/CVE-2026-0257"
        publisher: "Palo Alto Networks PSIRT"
        date: "2026-05-13"
        role: "vendor-advisory"
    discovery_trace: "first seen at: thehackernews (hackernews RSS feed item published 2026-05-30), URL https://thehackernews.com/2026/05/pan-os-globalprotect-authentication.html → pivot: Rapid7 ETR, URL https://www.rapid7.com/blog/post/etr-rapid7-observed-exploitation-of-pan-os-globalprotect-authentication-bypass-vulnerability-cve-2026-0257/ → confirmed CISA KEV via bridge:cisa-kev"
    summary: |
      Rapid7 MDR published an exploitation tracking report on 2026-05-29 confirming active in-the-wild exploitation of CVE-2026-0257, a pre-authentication bypass in PAN-OS GlobalProtect gateway and portal (CVSS 7.8). The root cause is that GlobalProtect's authentication override cookie feature encrypts cookies with the TLS certificate's public key; when the same certificate is reused across the portal/gateway and another feature, an unauthenticated remote attacker can retrieve the public key from the TLS handshake and forge a signed authentication override cookie for any username (including admin). Rapid7 MDR observed successful exploitation across multiple customers, with the earliest activity dating to May 17 (two waves: May 17 and May 21). The kit injects the forged cookie with a spoofed MAC address (aa:bb:cc:dd:ee:ff) and the fake hostname "GP-CLIENT" in web-server access logs, which is the primary log-based detection signal. No lateral movement from gateway devices was observed in Rapid7's cases. CISA added CVE-2026-0257 to the KEV catalog on May 29 with a June 1 federal remediation deadline. Palo Alto Networks updated its advisory on May 29 confirming "limited exploit attempts on unpatched PAN-OS devices without mitigations applied." CVE-2026-0257 was originally covered in the 2026-05-30 brief; this delta provides the first independent third-party exploitation confirmation with technical forensic detail.
    ch_eu_nexus: "PAN-OS GlobalProtect is deployed broadly across Swiss and European government, higher-education and critical-infrastructure perimeters"
    public_sector_nexus: "direct — GlobalProtect VPN is standard perimeter for public-sector remote access"
    sector: "cross-sector, public-sector, critical infrastructure"
    cves: [CVE-2026-0257]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "update-to-prior:2026-05-30"
    evidence:
      - quote: "Rapid7 MDR identified successful exploitation across numerous customers, however they did not observe any indication of successful lateral movement from the devices"
        attribution: "Rapid7"
        source_url: "https://www.rapid7.com/blog/post/etr-rapid7-observed-exploitation-of-pan-os-globalprotect-authentication-bypass-vulnerability-cve-2026-0257/"
