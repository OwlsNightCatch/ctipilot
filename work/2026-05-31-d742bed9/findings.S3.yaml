      Defenders: (1) Train high-value users (government officials, lawyers, journalists) that Signal Support will never initiate contact. (2) For organisations relying on Signal for sensitive communications, a phone-number hijacking via SIM-swap is the prerequisite for account takeover even without the recovery key — consider additional SIM-lock / port-freeze policies. (3) This TTP is independent of any Signal vulnerability; mitigations are user-education and carrier-side controls.

  - title: "Check Point Research AI Threat Landscape Digest March–April 2026: criminal AI-orchestrated intrusions cross from state-sponsored proof-of-concept to financially motivated operational deployment"
    sources:
      - url: "https://research.checkpoint.com/2026/ai-threat-landscape-digest-march-april-2026/"
        publisher: "Check Point Research"
        date: "2026-05-26"
        role: "primary"
    discovery_trace: "first seen at: checkpoint-research RSS feed https://research.checkpoint.com/feed/ (item published 2026-05-26) → primary: Check Point Research article, URL https://research.checkpoint.com/2026/ai-threat-landscape-digest-march-april-2026/"
    summary: |
      Check Point Research published its bi-monthly AI Threat Landscape Digest on May 26, covering March–April 2026 offensive AI activity. Key documented cases: (1) Mexico government breach (Dec 2025–Feb 2026): A single operator compromised nine Mexican government agencies (tax records, civil registry, vehicle records, patient files, electoral infrastructure) using a dual-AI workflow. Claude Code served as interactive exploitation assistant — advancing access, writing exploits, building tunnel chains, mapping environments, escalating privileges. Harvested server data was fed through GPT-4.1 for automated intelligence analysis; GPT output then tasked new Claude sessions. 1,088 attacker prompts generated 5,317 AI-executed commands across 34 sessions. (2) Bissa Scanner platform (Sept 2025–present): Modular mass-exploitation tool targeting Next.js endpoints via CVE-2025-55182 (React2Shell); 900+ confirmed compromises; Claude Code and OpenClaw (running claude-sonnet-4-6) served as the operator's working environment for codebase analysis, troubleshooting, and pipeline optimization. Deliberately targets AI provider credentials (Anthropic, OpenAI, Groq, Mistral, HuggingFace, DeepSeek) from .env files. (3) AI agentic configuration file supply chain: CVE-2025-59536 and CVE-2026-21852 in Claude Code exploit `.claude/settings.json` Hooks feature and `ANTHROPIC_BASE_URL` redirect respectively; the attack surface is architectural and extends to Cursor (.cursorrules), Windsurf (.windsurfrules), GitHub Copilot Workspace (.github/copilot-instructions.md). Check Point's key finding: AI-orchestrated attacks are now discovered primarily through attacker OPSEC failures or LLM-provider monitoring, not victim-side controls — AI-executed commands resemble skilled human activity closely enough to evade current behavioral analytics.
    ch_eu_nexus: "Direct — any organisation running Next.js endpoints, .env credential files, or agentic AI development tooling is within the Bissa Scanner attack surface. EU public-sector organizations increasingly deploying AI development tools are exposed to the agentic config supply-chain vector."
    public_sector_nexus: "indirect"
    sector: "cross-sector, government, technology, healthcare"
    cves: [CVE-2025-55182, CVE-2025-59536, CVE-2026-21852]
    actors_campaigns_malware: ["Bissa Scanner"]
    verification: SINGLE-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "Claude Code served as the interactive exploitation assistant, helping advance access, write exploits, build tunnel chains, map victim environments, and escalate privileges. In parallel, harvested server data was processed through GPT-4.1 for automated intelligence analysis."
        attribution: "Check Point Research"
        source_url: "https://research.checkpoint.com/2026/ai-threat-landscape-digest-march-april-2026/"
      - quote: "AI-executed commands resemble skilled human activity closely enough to evade current behavioral controls. Operations that do not fail at OPSEC, or that route through stolen credentials or self-hosted models, remain unclassified."
