    evidence:
      - quote: "Microsoft is working to patch CVE-2026-42897, an Exchange Server zero-day vulnerability that has been exploited in attacks."
        attribution: "SecurityWeek (Eduard Kovacs), 2026-05-15"
        source_url: "https://www.securityweek.com/microsoft-warns-of-exchange-server-zero-day-exploited-in-the-wild/"
      - quote: "No permanent patch exists. Microsoft says this mitigation is a temporary measure while a permanent fix is being prepared."
