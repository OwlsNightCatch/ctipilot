  # ─────────────────────────────────────────────────────────────────────────
  # ITEM 4 — CVE-2026-20182 Cisco Catalyst SD-WAN UPDATE
  # Tenable publishes CISA Emergency Directive 26-03 detail + UAT-8616
  # post-exploitation persistence chain — in-window delta on prior coverage
  # ─────────────────────────────────────────────────────────────────────────
  - title: "UPDATE: CVE-2026-20182 Cisco Catalyst SD-WAN — Tenable documents UAT-8616 post-exploitation persistence: SSH key injection, NETCONF manipulation, version downgrade to expose CVE-2022-20775 for root, then restore version to hide attack path"
    sources:
      - url: "https://www.tenable.com/blog/faq-about-the-continued-exploitation-of-cisco-catalyst-sd-wan-vulnerabilities-uat-8616"
        publisher: "Tenable Research"
        date: "2026-05-14"
        role: "primary"
      - url: "https://blog.talosintelligence.com/sd-wan-ongoing-exploitation/"
        publisher: "Cisco Talos"
        date: "2026-05-14"
        role: "corroborating"
      - url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-sdwan-rpa2-v69WY2SW"
        publisher: "Cisco PSIRT"
        date: "2026-05-14"
        role: "corroborating"
    discovery_trace: "first seen at: ncsc-csh bridge post 12579 (NCSC.ch SD-WAN advisory), WebSearch 'Cisco SD-WAN CVE-2026-20182 UAT-8616 update post-exploitation' → primary: Tenable Research FAQ blog URL https://www.tenable.com/blog/faq-about-the-continued-exploitation-of-cisco-catalyst-sd-wan-vulnerabilities-uat-8616 → corroborating: Talos URL https://blog.talosintelligence.com/sd-wan-ongoing-exploitation/"
    summary: |
      CVE-2026-20182 (CVSS 10.0, CWE-287) is an authentication bypass in Cisco Catalyst SD-WAN Controller
      (formerly vSmart) and SD-WAN Manager (formerly vManage) peering mechanism. An unauthenticated
      attacker with network access to the controller's control-connection peering interfaces can establish
      an unauthorised peer connection masquerading as a trusted SD-WAN router and obtain high-privileged
      account access.

      Tenable's 2026-05-14 FAQ and Cisco Talos' parallel "ongoing exploitation" post (same date) provide
      the most complete technical treatment. The new in-window detail from the Tenable/Talos publications
      covers the full UAT-8616 post-exploitation persistence chain — a notably sophisticated evasion
      sequence that clears forensic evidence:

      1. Initial access: CVE-2026-20182 or CVE-2026-20127 (earlier Cisco SD-WAN auth bypass, KEV)
      2. NETCONF configuration manipulation and malicious account creation
      3. For CVE-2026-20127 exploitation path: software version downgrade to expose CVE-2022-20775
         (privilege escalation to root); after achieving root, the actor restores the original software
         version to conceal the exploitation chain
      4. SSH key injection into `authorized_keys`; `PermitRootLogin yes` added to sshd config
      5. Log destruction: syslog, wtmp, lastlog, bash_history, cli-history all cleared

      UAT-8616's infrastructure overlaps with monitored Operational Relay Box (ORB) networks. At least
      10 additional threat clusters began exploiting multiple SD-WAN CVEs after the public PoC became
      available. CISA issued Emergency Directive 26-03 mandating federal agency remediation by 2026-05-17.
      Patches are available for all supported Cisco Catalyst SD-WAN releases.

      Defender detection: SSH key additions to `~/.ssh/authorized_keys` on SD-WAN controllers; unexpected
      `PermitRootLogin` changes in sshd_config; NETCONF configuration sessions from unexpected sources
      (TCP/830 or TCP/22); version downgrades in system logs; absence of expected log files post-incident
      (wtmp/lastlog truncation — forensic indicator). MITRE ATT&CK: T1190 (Exploit Public-Facing
      Application), T1098.004 (SSH Authorized Keys), T1027.005 (Indicator Removal from Tools via version
      restore), T1070.003 (Clear Command History). Hardening: restrict SD-WAN controller peering
      interfaces to management network; apply available patches; audit authorized_keys on all controllers.
    ch_eu_nexus: "Cisco Catalyst SD-WAN is deployed across European telecom carriers, ISPs, and large enterprise/government WAN fabrics. Swiss federal and cantonal network backbones using SD-WAN overlays are in scope."
    public_sector_nexus: "indirect"
    sector: "telco, government, critical infrastructure"
    cves: [CVE-2026-20182]
    actors_campaigns_malware: ["UAT-8616"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: update-to-prior:2026-W21

