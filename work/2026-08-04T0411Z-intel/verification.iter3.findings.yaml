  item: "INC Ransom named as dominant actor exploiting SonicWall SMA 1000 (CVE-2026-15409 / CVE-2026-15410), Swiss victims among the new listings"
  url_or_quote: "https://thehackernews.com/2026/08/inc-ransomware-emerges-as-dominant.html (2026-08-03, in-window) reporting https://www.resecurity.com/blog/article/from-wsproxy-to-root-inc-ransomware-and-sonicwall-sma-exploit-chain (2026-08-01)"
  summary: "In-window reporting on a KEV pair this store already covers (entries 2026-07-14 and 2026-07-18; both CVEs in state/cves_seen.json since 2026-07-14), so PD-7's update/background carve-out applies. Adds actor attribution (Rapid7: 'INC Ransomware has emerged as the dominant threat actor actively weaponizing this vulnerability chain'), Swiss government and private-sector victims among listings 2026-07-17..2026-08-01, and a post-patch hunt/credential-rotation action distinct from the patch already published. resecurity is in S1's and S3's sources_attempted, yet the item appears nowhere in triage.json or the run record's borderline/out-of-window/coverage-gap lines. Remediate by publishing an update_of 2026-07-18/sonicwall-sma1000-uta0533-exploitation-kill-chain, or at minimum by recording it as an explicit lead the way cJSON and the ACN report were. Query: Resecurity INC Ransomware SonicWall SMA 1000 CVE-2026-15409 persistence hunting"
