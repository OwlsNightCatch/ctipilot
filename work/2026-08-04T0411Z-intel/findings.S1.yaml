      - quote: "A vulnerability in the web interface of Cisco Secure Firewall Management Center (FMC) Software could allow an unauthenticated, remote attacker to bypass authentication and execute script files on an affected device to obtain root access to the underlying operating system."
        attribution: "Cisco PSIRT"
        source_url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-onprem-fmc-authbypass-5JPp45V2"
      - quote: "The Cisco PSIRT is not aware of any public announcements or malicious use of the vulnerability that is described in this advisory."
        attribution: "Cisco PSIRT"
        source_url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-onprem-fmc-authbypass-5JPp45V2"
      - quote: "Cisco has assigned this security advisory a Security Impact Rating (SIR) of High rather than Medium as the score indicates. The reason is that this vulnerability can be used with other Cisco Secure FMC Software vulnerabilities to elevate privileges."
        attribution: "Cisco PSIRT"
        source_url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-fmc-static-cred-BET3Cjh"
      - quote: "The `csm_processes` session ID could be upgraded into a UI session via hardcoded credentials with the report user, which then uses the `csm_processes` session UI permissions to allow authentication."
        attribution: "VulnCheck"
        source_url: "https://www.vulncheck.com/blog/cisco-fmc-auth-bypass-cve-2026-20079"
    extended_notes: |
      DEDUP CAUTION for the main agent: CVE-2026-20079 was originally disclosed by Cisco on 2026-03-04 — this
      predates the 14-day prior_coverage.json window handed to this sub-agent, so I cannot confirm from the
      supplied dedup context whether this pipeline already published an entry for it back in March/April 2026.
      Please cross-check state/cves_seen.json (store-wide index) before treating this as `novelty: new`; if a
      March/April entry exists, this item is better framed as `update-of:<that entry>` with the single material
      delta being: Cisco shipped the first-ever permanent fix on 2026-08-03 (hotfix files named per FMC release
      train), and Cisco's SAME-DAY update to the CVE-2026-20316 advisory newly documents the explicit chaining
      relationship between the two bugs. CVE-2026-20316 itself IS already in prior_coverage.json
      (2026-07-30/cisco-secure-fmc-cve-2026-20316-static-credential-exploited) — I deliberately did not add
      CVE-2026-20316 to this item's own `cves[]` to avoid a CVE-level duplicate; the chaining relationship is
      carried in prose/evidence only. Detection hook (shared by both advisories): on the FMC appliance in
      `expert` mode, run `zgrep "package_info.*license" /var/log/messages*` — a line referencing
      `/var/tmp/license.tmp` indicates the exploitation chain reached the package-install step. Because
      exploitation of CVE-2026-20079 is realistically only feasible in the window right after boot before any
      admin authenticates (per VulnCheck), correlate any unauthenticated FMC web-UI session activity against
      device boot/uptime logs. Hardening: apply the named hot fixes (no workaround exists otherwise); keep the
      FMC management interface off the public internet (Cisco notes this reduces the attack surface); SCC
      Firewall Management customers should confirm they received the automatic server-side fix.

