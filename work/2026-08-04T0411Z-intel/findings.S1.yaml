items:
  - title: "Cisco ships permanent hotfix for critical Secure FMC authentication-bypass flaw (CVE-2026-20079, CVSS 10.0) — advisory confirms it chains with the actively exploited static-credential bug"
    sources:
      - { url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-onprem-fmc-authbypass-5JPp45V2", publisher: "Cisco PSIRT", date: "2026-08-03", role: primary }
      - { url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-fmc-static-cred-BET3Cjh", publisher: "Cisco PSIRT", date: "2026-08-03", role: corroborating }
      - { url: "https://www.vulncheck.com/blog/cisco-fmc-auth-bypass-cve-2026-20079", publisher: "VulnCheck", date: "2026-03-26", role: corroborating }
      - { url: "https://www.cisa.gov/known-exploited-vulnerabilities-catalog", publisher: "CISA KEV Catalog", date: "2026-08-03", role: corroborating }
    discovery_trace: >
      first seen at: cisco-psirt (RSS), URL https://sec.cloudapps.cisco.com/security/center/psirtrss20/CiscoSecurityAdvisory.xml
      (item "Cisco Secure Firewall Management Center Software Authentication Bypass Vulnerability", published 2026-08-03 17:27:46 UTC)
      → primary: Cisco Security Advisory, URL https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-onprem-fmc-authbypass-5JPp45V2
      → pivot: sibling/chaining Cisco Security Advisory (same-day update), URL https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-fmc-static-cred-BET3Cjh
      → pivot: WebSearch ("CVE-2026-20079 Cisco Secure Firewall Management Center authentication bypass") → root-cause writeup, URL https://www.vulncheck.com/blog/cisco-fmc-auth-bypass-cve-2026-20079
      → pivot: CISA KEV catalog cross-check (bridge: cisa-kev), URL https://www.cisa.gov/known-exploited-vulnerabilities-catalog (CVE-2026-20079 absent; sibling CVE-2026-20131 present since 2026-03-19)
    summary: |
      CVE-2026-20079 is a CVSS 3.1 10.0 (AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H) authentication-bypass vulnerability
      in the web interface of Cisco Secure Firewall Management Center (FMC) Software and Cisco Security Cloud
      Control (SCC) Firewall Management. Cisco first published this advisory on 2026-03-04 with no patch and no
      workaround — only a forensic indicator-of-compromise check. On 2026-08-03 the advisory (now version 2.3,
      marked "Final") shipped the FIRST permanent hot fixes for every affected FMC release train (7.0, 7.2, 7.4,
      7.6, 7.7, 10.0), closing a roughly five-month window during which the only defensive option was detection,
      not prevention. Independent root-cause analysis (VulnCheck, published while the flaw was still unpatched)
      traces the bug to a static `csm_processes` machine-user session that Cisco's own startup process creates
      in the `sfsnort.sessions` database at boot; if no administrator authenticates after boot, an unauthenticated
      remote attacker who can reach the web UI can upgrade that session using a hardcoded `report:snortrules`
      credential, obtain a CSRF token (`sf_action_id`), then chain the `sajaxintf.cgi` file-write endpoint with
      `pjb.cgi`'s `upgradeReadinessCall` function so the FMC processes an attacker-supplied Makeself script as a
      licensed upgrade package — executed as root via `SF::System::Wrappers::RunCmd`. Cisco PSIRT states it is
      "not aware of any public announcements or malicious use" of CVE-2026-20079 specifically (it is NOT on the
      CISA KEV catalog), but the same-day advisory update for the previously-covered static low-privilege
      credential flaw on the same product (CVE-2026-20316, KEV-listed and confirmed exploited) explicitly raises
      that bug's Security Impact Rating from Medium to High "because this vulnerability can be used with other
      Cisco Secure FMC Software vulnerabilities to elevate privileges" — i.e. Cisco itself documents that the two
      flaws are designed to chain into full compromise. A third sibling, CVE-2026-20131 (FMC/SCC deserialization
      RCE), has been on CISA KEV since 2026-03-19 with "Known" ransomware-campaign use. Cloud-delivered FMC
      (cdFMC), Firewall Device Manager (FDM), and Secure Firewall ASA/FTD Software are confirmed NOT affected by
      CVE-2026-20079; the SaaS-delivered SCC Firewall Management variant was already patched server-side by
      Cisco with no customer action required.
    region_nexus: "global; Cisco Secure FMC is a widely deployed firewall-fleet management plane, including in Swiss/European government and critical-infrastructure networks"
    primary_sector_nexus: "indirect"
    sector: "public-sector, energy, water, transport, healthcare, finance, telco"
