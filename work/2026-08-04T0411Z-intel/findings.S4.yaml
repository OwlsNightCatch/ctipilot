    discovery_trace: "first seen at: databreaches-net (source-list core, RSS), URL https://databreaches.net/feed/ → item https://databreaches.net/2026/08/03/cyberattack-hits-liechtenstein-with-31000-records-stolen/ → pivot: WebSearch (\"Liechtenstein Cyberangriff Regierung 31'000 Personen Daten gestohlen Krisenstab\") → pivot: WebSearch (\"Liechtenstein Regierung Medienmitteilung Cyberangriff Register wirtschaftlich Berechtigte Amt für Justiz\") → primary: government press release 2026-08-03, URL https://www.presseportal.ch/de/pm/100000148/100941500 → primary: government press release 2026-08-02, URL https://www.presseportal.ch/de/pm/100000148/100941487 → corroboration: The Record, URL https://therecord.media/hackers-steal-records-liechtenstein-companies-foundations → corroboration: SRF, URL https://www.srf.ch/news/international/31-000-geklaute-datensaetze-taeterschaft-von-cyberangriff-in-liechtenstein-weiterhin-unklar"
    summary: |
      The Government of the Principality of Liechtenstein has disclosed a breach of the Verzeichnis
      wirtschaftlich berechtigter Personen (VwbP) — the national beneficial-ownership register operated by the
      Amt für Justiz (Office of Justice) — in which an unknown actor obtained unauthorised digital access
      overnight into 2026-07-30 and copied records for approximately 31,000 Rechtsträger (companies,
      foundations and trust entities). The register was created under the VwbPG, in force since 2021, to
      implement the EU 5th Anti-Money-Laundering Directive, and holds the identities of the natural persons
      behind each registered legal entity. Detection was manual and internal: irregularities were noticed at the
      Amt für Justiz during 30 July, the Amt für Informatik was called in, secured the data and took the affected
      system offline; the government was informed on 31 July that the attack was potentially successful and
      received first confirmed preliminary findings on the afternoon of 1 August — a roughly three-day gap
      between intrusion and confirmed scope. Forensics so far characterise it as a targeted attack against the
      VwbP specifically, with no attacks on other systems detected; the government nonetheless progressively
      took further e-government systems offline as a precaution — the eMWST (e-VAT) portal and the "Lides"
      electronic reporting and data-exchange platform on 31 July, then the Zentrales Kontenregister (central
      account register) and the central tax system Intax on 3 August — and states there is no indication of
      unlawful access to those. Data in the register was not altered or deleted; the register is unavailable to
      external users via the LLV.li portal. The government has classified the event as a personal-data breach
      under GDPR Art. 33 (Liechtenstein is an EEA state) and is preparing Art. 34 notification of affected
      individuals via a central contact point. A crisis unit convened on the evening of 1 August and formally
      confirmed on 2 August is led by Head of Government Brigitte Haas and Justice Minister Emanuel
      Schädler; law-enforcement authorities are now engaged alongside the Amt für Informatik and external
      partners, and a media conference was announced for 2026-08-04 14:00 CEST. NO INITIAL-ACCESS
      VECTOR HAS BEEN DISCLOSED — the government states only "widerrechtlich auf digitalem Weg
      Zugriff", and as of the 3 August update the perpetrators are unidentified, with no ransom demand and no
      observed offering of the data on criminal markets. The behaviour that IS source-supported is bulk copying
      of records out of an authoritative government data repository whose external-user interface is published
      on the national e-government portal (T1213 for the collection; T1190 is the access class implied by an
      externally-reachable registry service, not a mapping the government has stated — treat it as provisional
      until the vector is published). Defender relevance for Swiss and European readers is threefold: (1) the
      data class is a targeting dataset, not a credential dump — beneficial-owner identities, dates of birth and
      nationalities tied to Liechtenstein companies, foundations and trusts, i.e. exactly the input needed for
      high-quality spear-phishing, CEO-fraud and coercion against wealthy individuals and the Swiss and
      European fiduciaries, trustees and banks that administer those structures; expect an uplift in
      pretexted contact referencing genuine entity details, and hunt in mail-flow and identity telemetry for
      inbound lures that cite correct register facts. (2) The cascading precautionary shutdown of the VAT
      portal, the reporting platform, the central account register and the core tax system is the operational
      cost of not being able to prove blast radius quickly — the hunt-and-hardening lever is per-registry
      segmentation plus retained, exportable access logs on each e-government data service so that "was this
      one too?" is answerable from telemetry instead of by pulling the plug. (3) Bulk read-out of a registry by
      an external identity is a volumetric anomaly against a known baseline: registry and portal application
      logs should carry per-principal record-retrieval counts, and a single external session enumerating tens of
      thousands of entities is detectable without any indicator of compromise.
    region_nexus: "Liechtenstein (immediate Swiss neighbour, Swiss customs and currency union, EEA/GDPR jurisdiction); direct spillover to Switzerland and the EU through the Swiss/European fiduciaries, trustees, banks and beneficial owners recorded in the register"
