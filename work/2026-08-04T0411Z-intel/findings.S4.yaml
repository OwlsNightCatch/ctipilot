    discovery_trace: "first seen at: ransomware-live (source-list core), URL https://api.ransomware.live/v2/recentvictims → filtered to EU/CH victims in window → drill: https://www.ransomware.live/id/QWxjb24gSW5jLkBzaGlueWh1bnRlcnM= and https://www.ransomware.live/id/UXVlc3RlbCBTQVNAc2hpbnlodW50ZXJz → pivot: WebSearch (\"Alcon ShinyHunters Salesforce data breach 25 million records\") and WebSearch (\"Alcon confirms cyber incident Salesforce data August 2026 statement\") → NO victim statement and NO Admiralty A/B journalism located; only leak-site mirrors and low-reliability aggregators"
    summary: |
      Between 2026-08-01 and 2026-08-02 the ShinyHunters extortion brand added three organisations to its
      leak site with near-identical wording and a shared deadline, two of which are in the constituency's
      region: Alcon Inc. (Swiss-domiciled eye-care and ophthalmic-device multinational, claim of "Over 25
      million Salesforce records containing some PII"), Questel SAS (French intellectual-property services
      group, claim of "Over 21 million Salesforce records containing some PII and 147GB+ of internal
      corporate data"), plus Lumenis Ltd. (Israel, 1.1 million records / 176GB+). All three carry the same
      "final warning to reach out by 4 August 2026 before we leak" text and a threat of "several annoying
      (digital) problems", i.e. the multi-pressure model this group has used before. THIS IS A CRIMINAL
      CLAIM AND NOTHING MORE at the time of writing: neither Alcon nor Questel has issued any statement,
      and no Admiralty A/B-reliability journalism on either listing could be located this run — the only
      coverage is leak-site mirrors and low-reliability aggregator posts, which do not clear the verification bar
      for reporting a breach as fact. It is surfaced because the campaign context is already established and
      confirmed: the same actor's Salesforce-tenant data-theft pattern is the subject of a Health-ISAC advisory
      and a victim-confirmed breach at Brinks Home (covered 2026-07-31), so the claim shape is consistent
      with genuine activity rather than novel invention, and the deadline stated by the criminals is the day of
      this run. Two Salesforce-record claims of 21–25 million rows each point at tenant-level rather than
      per-object access. The defensive read for Swiss and European teams running Salesforce is unchanged
      from the confirmed cases and does not depend on whether these two listings are real: treat the
      SSO/identity path into the SaaS tenant as tier-zero, and hunt Salesforce event-monitoring and identity
      logs for high-volume Bulk API / Data Loader / report-export activity by a single integration or user
      principal, connected-app authorisations granted outside change control, and session-origin changes for
      privileged tenant identities. Recommended handling for the composer: if this ships at all, it ships framed
      as an attributed claim with the absence of confirmation stated explicitly, and re-checked after the stated
      deadline passes.
