  - title: "Italian DPA fines TIM EUR 9.516 million over unlawfully acquired telemarketing consents, uncontrolled sales-channel supply chain and CLI-spoofed lead generation"
    sources:
      - { url: "https://www.gpdp.it/home/docweb/-/docweb-display/docweb/10277228", publisher: "Garante per la protezione dei dati personali (Italy)", date: "2026-08-03", role: "primary" }
      - { url: "https://cyberinsider.com/italy-fines-telecom-giant-tim-11-million-for-privacy-violations/", publisher: "CyberInsider", date: "2026-08-03", role: "corroborating" }
    discovery_trace: "first seen at: cyberinsider (source-list core, RSS), URL https://cyberinsider.com/feed/ → drill https://cyberinsider.com/italy-fines-telecom-giant-tim-11-million-for-privacy-violations/ → primary: Garante press release, URL https://www.gpdp.it/home/docweb/-/docweb-display/docweb/10277228"
    summary: |
      Italy's data-protection authority has fined TIM (Telecom Italia) EUR 9,516,000 for privacy and
      telemarketing violations centred on abusive call centres operating on the company's behalf. The
      Garante's press release describes a documented scheme rather than a generic consent failure: roughly
      7,000 complaints in 2025 about promotional calls placed for TIM from numbering not registered with
      the ROC (Registro degli operatori di comunicazione) or outright altered by CLI spoofing, frequently to
      subscribers enrolled in the Registro pubblico delle opposizioni (do-not-call register); recipients were then
      sent an SMS containing a hyperlink to a web form hosted by a genuine TIM sales-network partner, so that
      the call recipient's own submission laundered the illegitimately obtained contact into an apparently
      self-generated "Lead" that could be legitimately re-contacted. The Authority's findings name unlawfully
      acquired consents, inadequate controls over the sales-channel supply chain and obstruction of
      data-subject rights. This is an enforcement action, not an intrusion, and it carries no detection content
      for endpoint or identity telemetry — which is why it is flagged borderline. Its transferable value is in
      two places: it is a GDPR liability precedent for a controller in a profiled sector (telecommunications)
      held responsible for downstream processors it did not adequately vet, which is directly comparable to
      the third-party and sales/marketing-channel exposure carried by public-sector and utility operators in
      the constituency; and the CLI-spoofing-plus-partner-web-form chain is a reusable social-engineering
      laundering pattern that fraud and abuse teams should recognise, because the artefact that reaches the
      organisation's own logs is a legitimate inbound form submission from a real partner domain, with the
      spoofed call that produced it invisible to the enterprise entirely.
    region_nexus: "Italy / EU — national DPA enforcement against a major European telecommunications operator"
