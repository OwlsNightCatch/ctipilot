        attribution: "VenariX"
        source_url: "https://venarix.com/blog/exfilsquad-targets-misconfigured-microsoft-power-pages-portals"
    extended_notes: |
      The prior entry's editorial line was that ExfilSquad's 15-victim list was probably mostly fabricated
      (SOCRadar's assessment). VenariX's sample review partially revises that: 11 of 15 sample sets are
      structurally consistent Dataverse exports, one (City of Houston / Houston 311) was reproduced live from
      an anonymously readable portal, and one listed company (Frontier Airlines) had already confirmed
      unauthorised access to a data storage account on 2026-07-09 without attributing it. So the correct current
      read is neither "mostly fabricated" nor "all real" but: a single low-effort access path applied at scale,
      with at least some claims corroborated by structure and one by reproduction. That matters for triage
      calibration — the base-rate scepticism from the earlier entry stays valid for the individual claim, but the
      METHOD is now evidenced and should be swept for locally regardless of whether any given listing is
      genuine. Note also the reliability asymmetry: PNLD's statement carries no publication date on the page
      (retrieved 2026-08-04 04:18, timestamp printed by the site itself), so recency is anchored on the
      2026-08-03 reporting and on the statement's own "continuing to investigate" framing. VenariX is not
      currently in sources/sources.json — see candidate_sources.
  - title: "ShinyHunters Salesforce extortion wave names Swiss- and French-domiciled organisations with a 2026-08-04 leak deadline — criminal claim, no victim confirmation"
    sources:
