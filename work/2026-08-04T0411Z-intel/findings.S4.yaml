    extended_notes: |
      Timeline as stated by the government, useful for anyone benchmarking their own registry-incident clock:
      intrusion night 29/30 July → internal irregularities noticed at the Amt für Justiz during 30 July → Amt
      für Informatik engaged, data secured, system taken offline same day → government informed of a
      potentially successful attack 31 July → first confirmed preliminary findings delivered to government
      afternoon of 1 August → crisis unit convened evening 1 August, formally confirmed 2 August → public
      disclosure 2 August 18:34 CEST → forensic characterisation as a targeted attack published 3 August
      18:18 CEST → media conference announced for 4 August 14:00 CEST. A focus page was announced on
      www.regierung.li; enquiries route to vwbpfragen@llv.li. SRF adds the political context that the register
      exists because of Liechtenstein's post-2017 dismantling of banking secrecy and EU AML alignment,
      which is why the stolen dataset is attractive well beyond ordinary PII resale. Two open questions worth
      re-checking after the 4 August press conference: the initial-access vector, and whether the precautionary
      offline systems (Kontenregister, Intax, eMWST, Lides) shared an authentication or hosting dependency
      with the VwbP — the answer determines whether this is a single-application compromise or a platform
      exposure. There is no NCSC-CH or GovCERT.ch publication on this incident as of this run; Liechtenstein
      handles it through its own Amt für Informatik.
  - title: "PNLD confirms UK police and criminal-justice contact data published on the dark web; researchers assess the ExfilSquad access path as anonymously readable Microsoft Power Pages / Dataverse portals rather than any exploit"
    sources:
      - { url: "https://www.pnld.co.uk/~/article/?id=7ebf3c0e-598e-f111-8077-7ced8d3aa78f", publisher: "Police National Legal Database (PNLD, West Yorkshire Police)", date: "2026-08-04", role: "primary" }
      - { url: "https://thehackernews.com/2026/08/pnld-breach-exposes-uk-police-and.html", publisher: "The Hacker News", date: "2026-08-03", role: "corroborating" }
      - { url: "https://venarix.com/blog/exfilsquad-targets-misconfigured-microsoft-power-pages-portals", publisher: "VenariX", date: "2026-07-29", role: "primary" }
      - { url: "https://securityaffairs.com/196525/data-breach/pnld-confirms-data-breach-affecting-uk-police-and-justice-staff.html", publisher: "Security Affairs", date: "2026-08-03", role: "corroborating" }
    discovery_trace: "first seen at: databreaches-net (source-list core, RSS), URL https://databreaches.net/feed/ → item https://databreaches.net/2026/08/03/uk-details-of-100000-police-staff-leaked-on-the-dark-web-after-hack/ → pivot: WebSearch (\"100,000 police officers staff names contact details leaked dark web MoD Home Office National Crime Agency\") → pivot: The Hacker News, URL https://thehackernews.com/2026/08/pnld-breach-exposes-uk-police-and.html → primary: PNLD's own breach statement, URL https://www.pnld.co.uk/~/article/?id=7ebf3c0e-598e-f111-8077-7ced8d3aa78f → primary: VenariX attack-path research, URL https://venarix.com/blog/exfilsquad-targets-misconfigured-microsoft-power-pages-portals → corroboration: Security Affairs, URL https://securityaffairs.com/196525/data-breach/pnld-confirms-data-breach-affecting-uk-police-and-justice-staff.html"
    summary: |
      Material delta on the 2026-07-31 entry, which recorded the Police National Legal Database as "affected"
      with 135,000 records on third-party reporting while the Home Office declined to comment. Three things
      have now changed. First, the victim has published its own statement: PNLD (operated by West Yorkshire
      Police) confirms that names, organisations and work email addresses of police officers, staff, other
      criminal-justice professionals, government partners and customers "has been compromised and published
      on the dark web", that there is no evidence passwords or other security credentials were compromised,
      that all affected organisations were contacted, that the National Crime Agency and specialist
      cyber-security firms are engaged, and that the Information Commissioner's Office has been notified — the
      incident was identified on Sunday 2026-07-26. The same statement adds a second affected service not in
      the prior entry: Ask the Police (askthe.police.uk), the public-facing enquiry site hosted on PNLD, from
      which names and email addresses of citizens who previously submitted questions were also published.
      PNLD stresses it is not a crime-recording system and holds no confidential victim, witness or offender
      material. Second, the exposure is now quantified across departments: approximately 108,429 police
      registrations spanning all 43 Home Office forces, plus 2,615 Crown Prosecution Service, 617 Home
      Office, 588 National Crime Agency and 402 Ministry of Defence staff. Third — and this is the
      transferable part — VenariX's review of samples from 11 of the 15 organisations ExfilSquad listed finds
      no ransomware, no malware, no lateral movement and no software-vulnerability exploitation; the samples
      are structurally Microsoft Dataverse exports (carrying @odata.etag,
      @OData.Community.Display.V1.FormattedValue and @Microsoft.Dynamics.CRM.lookuplogicalname
      artefacts across contacts, accounts, incidents, emails, annotations, leads, systemusers and businessunits
      entities), and the assessed path is a public Microsoft Power Pages portal whose Anonymous Users web
      role holds broad Dataverse table permissions, read out through the Power Pages Web API route
      /_api/<EntitySetName> or a legacy /_odata feed. VenariX independently verified one instance of this
      condition — the City of Houston's public Power Apps portal serving Houston 311 returned incident
      records without authentication, matching data ExfilSquad published — while explicitly noting the
      evidence does not confirm every listed organisation was reached the same way. Behaviourally this is
      T1190 against an externally-published low-code portal followed by T1213 bulk collection from the
      Dataverse tables behind it; there is no exploit and no credential in the chain, which is precisely why it
      generates no EDR signal, no failed-authentication burst and nothing for a patch cycle to fix. For
      European public-sector defenders the exposure is shared and immediate: Power Pages/Dynamics portals
      are a common build pattern for municipal service-request forms, licence applications, grant portals and
      help desks across the constituency, and the misconfiguration is a permissions decision, not a CVE.
      Hunt and hardening are concrete: from an unauthenticated session, request /_api/<EntitySetName> and
      /_odata against every externally-reachable Power Pages site and treat any 200 carrying record bodies as
      a live exposure; audit table permissions bound to the Anonymous Users web role and remove
      table-level read grants on contacts/incidents/annotations/systemusers; disable the portal Web API and
      legacy OData feeds where the site does not need them; and hunt web/app access logs for
      high-volume anonymous /_api/ or /_odata retrieval sequences with paging parameters, which is the
      only telemetry this technique produces.
    region_nexus: "United Kingdom (national policing, MoD, Home Office, NCA, CPS); the underlying misconfiguration class is shared by Power Pages / Dynamics portals across Swiss and European public administration"
