    summary: |
      Rapid7 has upgraded its assessment of who is exploiting the SonicWall SMA
      1000 chain (CVE-2026-15409 pre-auth /wsproxy SSRF, CVSS 10.0, chained to
      CVE-2026-15410 for root): its director of vulnerability intelligence
      Douglas McKee states that INC Ransom "has emerged as the dominant threat
      actor actively weaponizing this vulnerability chain", and that the
      technical correlation with Volexity's UTA0533 cluster "indicates that a
      single threat actor or coordinated group is responsible for discovering
      and exploiting this zero-day vulnerability". That statement was given to
      The Hacker News and appears nowhere on Rapid7's own blog; Rapid7 first
      attributed the activity to INC on 2026-07-17, so the actor link itself is
      not new — the "dominant" characterisation and the scale are. Volexity has
      NOT publicly linked the cluster to INC, so Resecurity's "Volexity and
      Rapid7 have since linked" phrasing overstates the attribution chain.
      Resecurity, which has run DFIR for several victims, reports INC
      accelerating through late July and publishing a wave of new leak-site
      victims — private-sector and government organisations from Australia, the
      US, UAE, Colombia and Switzerland — between 2026-07-17 and 2026-08-01.
      Those listings are criminal claims only: no organisation is named, no
      victim or authority has confirmed one, and Resecurity does not tie any
      individual listing to the SonicWall chain. Two defender-relevant
      mechanics stand out beyond the already-documented kill chain. First, a
      resident actor can undo remediation: Rapid7 observed the actor "rolling
      the newly applied patch back to a vulnerable state to maintain access",
      so patch verification must be re-checked after the fact and a patched
      appliance is not evidence of eviction. Second, at the extortion stage
      victims are receiving unsolicited email and telephone outreach from
      parties claiming to offer ransomware assistance, using a domain
      registered shortly after the intrusion through a registrar accepting
      cryptocurrency — a recovery-scam / pressure layer bolted onto the
      extortion, which changes who in the victim organisation needs briefing.
