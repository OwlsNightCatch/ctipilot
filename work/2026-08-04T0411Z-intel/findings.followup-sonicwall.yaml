novelty_warning: >
  Do NOT compose this as "INC Ransom emerges / is newly named as the actor" —
  that framing would be factually wrong on novelty. Rapid7's INC attribution
  dates to 2026-07-17 (Dark Reading, same day). The genuine in-window delta is
  narrower: (a) Resecurity's 2026-08-01 escalation report with a first-hand IR
  vantage; (b) a fresh named Rapid7 statement upgrading INC to the *dominant*
  actor on the chain; (c) an accelerating leak-site victim wave with a country
  list that includes Switzerland — UNCONFIRMED and not linked per-victim to the
  chain; (d) a genuinely new extortion-stage social-engineering behaviour
  (fake incident-response outreach by email and phone); (e) a post-patch
  mechanic the store never captured (resident actor rolls the patch back).
  Recommend publishing only if framed as an escalation/consolidation delta with
  the Swiss element explicitly marked as an unverified criminal claim.

