  q2_cve_set:
    verdict: >
      EXACTLY the two CVEs this store already covers. No third CVE, no
      different ids, no additional ids anywhere in the in-window reporting.
      One additional weakness is described but is explicitly NOT
      CVE-assigned. Pairings below transcribed from the records that own
      them (CISA KEV entries + SonicWall's own product notice), not
      positionally.
    cve_records:
      - cve: CVE-2026-15409
        owning_record_name: "SonicWall SMA1000 Appliances Server-Side Request Forgery Vulnerability"
        owning_record: "CISA KEV catalog entry (retrieved via tools/fetch_source.py cisa-kev), dateAdded 2026-07-14"
        owning_record_quote: "SonicWall SMA1000 Appliances contain a server-side request forgery vulnerability that could allow a remote unauthenticated attacker to potentially cause the appliance to make requests to unintended location."
        cvss: "10.0"
        resecurity_characterisation: "A pre-authentication /wsproxy bypass allowing an unauthenticated external attacker to open a WebSocket tunnel to services intended to be accessible only from localhost."
        matches_store: true
      - cve: CVE-2026-15410
        owning_record_name: "SonicWall SMA1000 Appliances Code Injection Vulnerability"
        owning_record: "CISA KEV catalog entry (retrieved via tools/fetch_source.py cisa-kev), dateAdded 2026-07-14"
        owning_record_quote: "SonicWall SMA1000 Appliances contain a code injection vulnerability which in specific conditions could potentially enable a remote authenticated attacker as administrator to execute arbitrary OS commands."
        cvss: "7.2"
        resecurity_characterisation: "A path-traversal flaw in the remove_hotfix workflow of ctrl-service, abused to escalate from a low-privilege service account to root."
        matches_store: true
        characterisation_note: >
          Two coexisting framings of the SAME id, both already present in the
          store: CISA/SonicWall describe it as code injection reachable by an
          authenticated administrator via the AMC (the store's 2026-07-14
          entry), while Volexity/Resecurity describe the concrete mechanism as
          a path traversal in the ctrl-service remove_hotfix workflow (the
          store's 2026-07-18 entry). Dark Reading (2026-07-17) reproduces the
          AMC framing. This is a characterisation difference, NOT an id
          mismatch and NOT a contradiction.
    non_cve_weakness:
      description: "ctrl-service Basic-auth password derived from the appliance hardware UUID in /sys/class/dmi/id/product_uuid, world-readable on PHYSICAL SMA 1000 appliances (virtual appliances not affected in the same way)."
      cve_assigned: false
      quote: "Volexity noted this bypass was not used in the observed UTA0533 incident, but it remains a noteworthy exposure for physical hardware deployments."
      already_in_store: "Yes — the 2026-07-18 entry states 'the control service's authentication password is derivable from a device UUID'. The physical-vs-virtual distinction is a small enrichment."
    patch_levels_confirmed:
      affected: "SMA 1000 (6210, 7210, 8200v & CMS – all hypervisors) 12.4.3-03245, 12.4.3-03387, 12.4.3-03434; 12.5.0-02283, 12.5.0-02624, 12.5.0-02800"
      fixed: "12.4.3-03453 and higher versions; 12.5.0-02835 and higher versions"
      source: "https://www.sonicwall.com/support/notices/product-notice-sma-1000-series-affected-by-multiple-vulnerabilities/kA1VN000001nv6D0AQ"
      matches_store: true

