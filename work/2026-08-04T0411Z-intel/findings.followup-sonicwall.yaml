        result: "not a contradiction — the store already carries both framings across its two entries; Resecurity aligns with the Volexity framing, Dark Reading with the SonicWall/CISA framing."
      - claim: "Earliest compromise 2026-06-22"
        result: "consistent — Resecurity repeats 2026-06-22 and dates the ROOTRUN drop to that day."
      - claim: "Lateral-movement success"
        result: >
          The 2026-07-18 entry deliberately surfaced the Volexity/Rapid7
          divergence and concluded a foothold is 'a demonstrated launch point
          for internal movement, but not evidence that deep lateral movement
          always succeeds'. That framing is now overtaken but not falsified:
          Rapid7's Deroche states most cases were contained yet 'we now have an
          active case in which ransomware deployment was achieved'. This is an
          escalation of the same picture, not a contradiction.
      - claim: "Actor attribution"
        result: >
          The 2026-07-14 entry's sourcing note said 'no actor attribution has
          been published' — true on 2026-07-14. The 2026-07-18 entry attributes
          to UTA0533 only. Both remain accurate as of their publication dates.
    coverage_omission:
      severity: "material — affects how this follow-up must be framed"
      finding: >
        Rapid7 attributed the exploitation to INC ransomware on 2026-07-17 and
        Dark Reading published that attribution the same day
        (2026-07-17T20:01Z) — hours BEFORE the store's 2026-07-18 run. The
        2026-07-18 entry therefore missed a same-window actor attribution and a
        significant post-patch mechanic (patch rollback by a resident actor).
        Consequence for this follow-up: the in-window novelty is NOT "INC Ransom
        is newly named"; the attribution is ~17 days old.

