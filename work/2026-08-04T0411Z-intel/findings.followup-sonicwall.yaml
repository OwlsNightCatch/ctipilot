  q5_mechanics_and_post_patch_actions:
    what_survives_the_patch:
      - "Persistence artefacts: setuid ELF backdoor (Volexity name ROOTRUN, dropped as /usr/bin/xzfind), a Python injector (KNUCKLEBALL, /usr/lib/python3.11/site-packages/deploy_new.py), modified init script (/etc/init.d/workplace) and rewritten NGINX Unit config (/var/lib/unit/conf.json)."
      - quote: "Setuid binaries, Python injectors, modified init scripts, and NGINX Unit configuration changes can survive reboots and may persist after a superficial firmware upgrade if not remediated. A patched appliance that still contains ROOTRUN or KNUCKLEBALL remains compromised."
        publisher: "Resecurity"
      - "Harvested secrets: credentials, active session databases and TOTP/MFA seed configurations extracted from the appliance (Rapid7). These remain valid after patching."
      - finding: "NEW and operationally significant (Rapid7 IR, via Dark Reading 2026-07-17 — OUT of window, flag as background if used): the actor has been observed ROLLING A NEWLY APPLIED PATCH BACK to a vulnerable state to retain access, i.e. patch application is itself reversible by a resident attacker."
        quote: "We observed the threat actor maintaining persistence and rolling the newly applied patch back to a vulnerable state to maintain access. A comprehensive forensic review of the firewall is required to ensure complete eviction."
        publisher: "Brett Deroche, Rapid7 (to Dark Reading)"
    post_exploitation_chain_mechanics:
      - "Pre-auth: crafted /wsproxy request with spoofed client identifiers opens a WebSocket tunnel to loopback-only services; reaches bundled CouchDB and the Erlang ctrl-service with no network segmentation in the way."
      - "Staging: attacker reads sensitive appliance files and writes an exploit payload to disk as the unprivileged couchdb service account (observed as /tmp/hypdate.b64, owned by couchdb — evidence of write+execute through that service context)."
      - "Root: sysCtrl.execRemoveHotfix invoked via POST /rollbackConfirm.action with a traversal-laden `hotfix` parameter; ctrl-service calls /usr/local/bin/remove_hotfix from working directory /var/lib/aventail/avp/rollback/, the unsanitised path escapes it, and the attacker's staged script runs as root — typically followed by an immediate reboot."
      - "Implants: KNUCKLEBALL injects JAR agents into the legitimate SonicWall JVM via the Java Attach API, targeting workplace.startup.CommandStartup — Suo5 (HTTP proxy tunnel) and ORANGETAIL (Behinder-like Java web shell, encrypted C2 over HTTPS). In-memory injection rather than standalone binaries, deliberately reducing forensic footprint."
      - "Credential access: tcpdump captures unencrypted LDAP (TCP/389) to harvest directory credentials; Rapid7 adds extraction of active session databases and TOTP MFA seeds."
      - finding: "Extortion-stage pressure tactic (NEW, Resecurity first-hand): victims contacted by email and phone by parties claiming to offer ransomware assistance, using a domain registered shortly after the intrusion through a Chinese registrar accepting cryptocurrency. Caller used a pseudonym and claimed to be calling 'from a group of hackers'. NOTE: the specific domain, email address and phone number are IOCs — MUST NOT be reproduced in an entry."
        quote: "many of the new victims received emails, as well as phone calls from unknown organizations claiming to assist with ransomware issues"
        publisher: "Resecurity"
    hunt_steps_behavioural:
      network_telemetry:
        - "Appliance web/access logs (extraweb_access.log): /wsproxy requests answered with a WebSocket 101 upgrade where the tunnel target is a loopback address (0.0.0.0, 127.0.0.1, ::ffff:127.0.0.1, localhost) and a backend service port — a legitimate Work Place session never asks the appliance to tunnel to its own loopback services."
        - "Repeated /wsproxy requests from external source addresses; anomalous User-Agent strings and URI parameter values correlated against authentication logs."
        - "access_servers.log: WebSocket connection messages to internal backend ports."
        - "Unexpected HTTPS requests to /workplace/error.jsp or /workplace/dialogs/errorDialog.jsp (web-shell routing surface); internal proxying traffic patterns consistent with Suo5 tunnelling."
      host_telemetry:
        - "Any unexpected setuid ELF binary — enumerate with `find / -perm -4000 -type f` and diff against a known-good appliance image."
        - "Unexpected Python module in the site-packages tree acting as a loader, and embedded/staged JAR archives in /tmp or /var/tmp."
        - "Modifications to /etc/init.d/workplace and to /var/lib/unit/conf.json — specifically NGINX Unit route entries proxying to a loopback backend port. Hunting a fixed URL is the wrong shape; the artefact is an unexpected route in the appliance's own reverse-proxy config."
        - "New JSP files under /workplace/ directories."
        - "Unexpected tcpdump / packet-capture processes on the appliance, especially on TCP/389."
        - "Unexpected child processes spawned by CouchDB, ctrl-service or NGINX Unit workers."
      log_telemetry:
        - "ctrl-service.log: hotfix-removal / remove_hotfix entries whose rollback name contains directory-traversal sequences. SonicWall's own product notice independently names this: 'ctrl-service.log – any entries with \"hotfix removal\" which include a path traversal name'."
        - "Post-remediation: re-verify installed firmware version after patching and monitor for unexplained version regression — a resident actor has been observed rolling the patch back."
      exposure_window: "Hunt scope is any internet-facing SMA 1000 that was unpatched between 2026-06-22 and the date the hotfix was applied."
    credential_rotation_exact_list:
      quote: "Rotate credentials. Reset all credentials processed or stored by the appliance: SMA administrator passwords. Directory-service bind credentials (LDAP, RADIUS, Active Directory). User passwords for accounts that authenticated during the exposure window. Certificates and API keys configured on the appliance. TOTP/MFA tokens and seeds."
      publisher: "Resecurity"
      items:
        - "SMA administrator passwords"
        - "Directory-service bind credentials (LDAP, RADIUS, Active Directory)"
        - "User passwords for every account that authenticated during the exposure window"
        - "Certificates and API keys configured on the appliance"
        - "TOTP/MFA tokens and seeds"
    rebuild_guidance:
      quote: "If compromise is confirmed, the safest remediation is to factory-reset the appliance, reimage with patched firmware, and restore configuration from a known-good backup taken before the vulnerable firmware branches (12.4.3-03245 and 12.5.0-02283). Do not restore from backups that may include implanted persistence."
      publisher: "Resecurity"
      vendor_corroboration: "SonicWall's product notice independently states: 'Configuration backups should only be used if the backup pre-dates the installation of the December hotfix versions (12.4.3-03245 & 12.5.0-02283).'"
    hardening_levers:
      - "Remove direct internet exposure — front the appliance with a reverse proxy / zero-trust gateway; restrict inbound to trusted source ranges where the deployment allows."
      - "Ensure management interfaces and internal appliance services are unreachable from untrusted networks."
      - "Move LDAP and RADIUS to encrypted transports so appliance-level packet capture yields no cleartext directory credentials — this directly defeats the observed tcpdump credential-harvesting step."
      - "File-integrity monitoring on /usr/bin, /usr/lib/python3.11/site-packages, /etc/init.d, /var/lib/unit and /workplace."
      - "Forward appliance logs off-box to a SIEM (a root-level attacker can edit local logs)."

