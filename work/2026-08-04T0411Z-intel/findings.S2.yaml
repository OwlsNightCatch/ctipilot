    cves: [CVE-2026-51302, CVE-2026-51303, CVE-2026-51300, CVE-2026-51297, CVE-2026-51296, CVE-2026-51304, CVE-2026-51294]
    cves_note: >
      IMPORTANT for the composer: every CVE id listed above is a FABRICATED identifier — the
      entry's purpose is to mark them as non-vulnerabilities so a reader or triage agent
      encountering them in a scanner report finds the retraction. Do not present them as real
