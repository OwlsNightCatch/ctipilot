coverage_gaps:
  - source_id: cert-pl
    reason: >
      RECIPE GAP, not a fetch failure. The tracked URL https://cert.pl/en/news/ fetched cleanly
      (HTTP 200) but its newest item was 2026-06-12, and it does NOT list CERT-PL's
      coordinated-disclosure CVE advisories at all — the 2026-07-27 cJSON advisory
      CVE-2026-16554 was only found by pivoting from an OSS-Security post. CERT-PL advisories live
      at https://cert.pl/en/posts/<YYYY>/<MM>/<CVE-ID>/ and the per-advisory page carries a
      "Publication date" table row (rendered as a table cell, so an HTML-tag strip collapses it —
      read the raw body around the "Publication date" label). An essential-tier A-reliability
      source has effectively been dark for advisory discovery. Recommend adding the /en/posts/
      path (and probing for a feed at https://cert.pl/en/rss/ or similar) to the record's recipe
      note.
  - source_id: cert-at
    reason: >
      RECIPE GAP. https://www.cert.at/en/ , https://www.cert.at/de/aktuelles/news/ and
      https://www.cert.at/en/news/ all returned no drillable dated rows via the bridge (and
      /de/warnungen/aktuelles/ 404s to WebFetch). The bare homepage https://www.cert.at/ DOES carry
      dated headlines and is the working discovery surface — this run it showed 24.07.2026,
      20.07.2026 and 18.06.2026, i.e. nothing in-window. Recommend recording "scrape the bare
      homepage for dated headlines, then drill /de/blog/<YYYY>/<M>/<slug>" in the record's recipe.
  - source_id: edpb
    reason: >
      RECIPE NOTE NOW STALE — worth correcting. The 2026-07-14 note says the bridge fetch returns
      only navigation chrome with no article listing. This run
      `python3 tools/fetch_source.py url https://www.edpb.europa.eu/news/news_en` returned the
      dated news listing correctly (newest item 30 July 2026, then 23/17/14/08/01 July). No
      in-window item. Recommend replacing the stale note.
  - source_id: cisa-directives
    reason: >
      RECIPE CONFIRMED, no in-window content. The 2026-07-25 note flags the absence of a
      `cisa-directives` subcommand; `python3 tools/fetch_source.py cisa page
      https://www.cisa.gov/news-events/directives` works and returns the full ED/BOD listing with
      drillable per-directive URLs. Newest substantive directive is BOD 26-04 "Prioritizing
      Security Updates Based on Risk" (supersedes and revokes BOD 19-02 and BOD 22-01), issued
      2026-06-10 per corroborating coverage — well outside the window, so dropped on recency.
      Recommend recording the working `cisa page` recipe on the record.
  - source_id: cisa-advisories
    reason: >
      NOT A FAILURE — the documented feed recipe (`cisa feed
      https://www.cisa.gov/cybersecurity-advisories/all.xml`) returned 30 items cleanly. Note for
      future runs: the parsed items carry NO published date (the `published` field comes back
      empty), so in-window filtering requires reading the date path in each alert URL
      (/news-events/alerts/YYYY/MM/DD/...) or the ICS advisory day-of-year id (icsa-26-NNN-XX).
      Nothing in-window here beyond the 03.08 KEV addition, which is S1's.
  - source_id: prodaft
    reason: >
      FETCHED OK, NO DATED CONTENT. `python3 tools/fetch_source.py jina
      https://www.prodaft.com/reports` returned HTTP 200 with a hydrated listing, but every entry
      is an undated legacy report (Wazawaka, Nomadic Octopus/Paperbug, RIG EK, FIN7, UNC1151,
      TA505/TeslaGun, PYSA, Wizard Spider, Conti). The reader resolves the SPA as the 2026-07-30
