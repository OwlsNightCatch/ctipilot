    novelty: new
    classification: { reliability: A, credibility: 1 }
    evidence:
      - quote: "CVE is door een LLM gehallucineerd"
        attribution: "NCSC-NL"
        source_url: "https://advisories.ncsc.nl/2026/ncsc-2026-0268-1.txt"
      - quote: "Dieses Advisory wurde zurückgezogen."
        attribution: "BSI CERT-Bund"
        source_url: "https://wid.cert-bund.de/.well-known/csaf/white/2026/wid-sec-w-2026-2604.json"
      - quote: "A broader audit of 55 advisories published by the same GitHub account revealed that 54 were completely fabricated, while one contained a real bug wrapped in unverified CVE metadata."
        attribution: "JFrog Security Research"
        source_url: "https://research.jfrog.com/post/sqlite-critical-cves-or-llm-slops/"
    extended_notes: |
      Further verbatim quotes the composer may promote into evidence[] (each verified against the
      URL given, fetched this run):
      - SQLite maintainer Richard Hipp, https://sqlite.org/forum/forumpost/34bdf3b9bd759d4d :
        "If you see new CVEs against SQLite, you can probably assume they are fake." and
        "SuSE tells me that they ran many of these CVEs through Claude, who concluded" (line-wrapped
        in the forum render — the continuation is "that the CVEs were \"fabricated\".").
      - JFrog, https://research.jfrog.com/post/sqlite-critical-cves-or-llm-slops/ :
        "Because no step in today's system actually requires a proof-of-concept or bug reproduction,
        a plausible-sounding fake advisory can slide right through the pipeline and end up in GHSA,
        downstream databases, and enterprise scanners."
      - JFrog, same URL, on the AI-triage angle: "An AI agent that encounters a fabricated CVE may
        attempt to locate the vulnerable function, generate a patch, or recommend changes based on
        code that does not even exist."
      - The Register, https://www.theregister.com/security/2026/08/03/ai-slop-pollutes-the-cve-pipeline-with-fake-vulns/5282462
        quoting Alan Coopersmith (Oracle Solaris engineer) from OSS-Security: "MITRE and most other
        CNAs which assign CVEs for code they don't produce themselves operate on the honor system,
        and trust CVE requesters to have verified the information they provide" — and quoting JFrog's
        Afek Berger: "Generative AI has lowered the effort required to produce a plausible-looking
        advisory to close to zero, while the effort required to verify one, review the source code,
        build the affected version, reproduce the PoC, is unchanged."

      Defender levers (all supported by the cited sources, no invention):
      - Treat maintainer corroboration as a gate, not a nicety. SQLite publishes its real CVEs at
        sqlite.org/cves.html; absence there was one of JFrog's four red flags. The same applies to
        any project with an official security page.
      - Require a commit hash or pull request in a CVE's reference fields before a high-CVSS record
        opens a change ticket. Its absence was JFrog's second red flag.
      - Treat placeholder or single-pinned-version CPE data ("Vendor/Product: n/a", "Pinned CPE: 3.41.0"
        on a library with dozens of releases) as a metadata-contradiction signal.
      - Verify that named functions and cited line numbers actually resolve in the claimed version
        before accepting a memory-safety claim. Two of the six SQLite entries named functions added
        after the claimed vulnerable release; one cited line numbers past end-of-file.
      - Feed-level hygiene: this run verified that GHSA still carried a fabricated record after BSI
        and NCSC-NL retracted, so pipelines that ingest GHSA (dependency scanners, SBOM tooling)
        need a mechanism to reconcile against national-CERT withdrawals and CVE-record rejections
        rather than assuming one-way propagation.
      - Where AI agents are used for vulnerability triage or auto-remediation, JFrog's stated failure
        mode is that the agent will hunt for, and try to patch, code that does not exist.

      Analytic pairing the composer may find useful: the Italian national cybersecurity agency (ACN)
      reports 37,032 new CVEs in H1 2026, up 54% year on year, and attributes the increase in part to
      frontier AI models compressing the time needed for code analysis, vulnerability research and
      PoC generation (see the borderline ACN item below). The same technology is therefore both
      raising genuine CVE volume and, per this finding, injecting fabricated records into the same
      pipeline — which is exactly why a CVE's existence and score can no longer stand alone as
      triage evidence.

      Cross-domain note: nothing in prior_coverage_keys.json touches SQLite, GHSA, LLM-fabricated
      CVEs or the CVE-2026-512xx range. Novelty confirmed new, not an update-of.

  - title: "PaperCut NG/MF 26.0.3 fixes missing brute-force protection and a login timing oracle (CVE-2026-8793, CVE-2026-8794) — CERT-FR advisory of 03 August"
    sources:
      - { url: "https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-0959/", publisher: "CERT-FR / ANSSI", date: "2026-08-03", role: "primary" }
      - { url: "https://www.papercut.com/kb/Main/papercut-ng-mf-security-bulletin-3-aug-2026/", publisher: "PaperCut", date: "2026-08-03", role: "primary" }
    discovery_trace: >
      first seen at: anssi-fr, URL https://www.cert.ssi.gouv.fr/avis/feed/ (via
      `cert-fr avis-recent 25`) -> drilled the avis, URL
      https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-0959/ -> primary: vendor bulletin named in
      the avis Documentation section, URL
      https://www.papercut.com/kb/Main/papercut-ng-mf-security-bulletin-3-aug-2026/
    summary: |
      PaperCut published a security bulletin on 2026-08-03 fixing two authentication weaknesses in
      PaperCut NG/MF, and CERT-FR issued CERTFR-2026-AVI-0959 the same day. CVE-2026-8793
      (CWE-307, CVSS 4.0 6.9 MEDIUM) is missing brute-force protection: the login component does not
      restrict excessive authentication attempts, so an unauthenticated remote attacker can run
      brute-force or credential-stuffing attacks without triggering account lockout or rate limiting
      in some configurations. CVE-2026-8794 (CWE-208, CVSS 4.0 6.9 MEDIUM) is a username-enumeration
      timing oracle in the same authentication component: the application performs a password hash
      comparison only for accounts that exist, so response-time measurement discloses account
      existence with high probability. Both are fixed only in PaperCut NG/MF 26.0.3 and later —
      PaperCut states explicitly that the changes are code-level and cannot be configured around on
      earlier releases. All versions prior to 26.0.3 are affected. Neither CVE requires authentication;
      neither yields code execution, and no exploitation is reported.
      Relevance rests on deployment rather than severity: PaperCut NG/MF is print-management software
      with heavy penetration in public administration, education and healthcare, frequently reachable
      from user networks and in some estates from the internet, and typically integrated with the
      directory that holds staff accounts. Chained, the two flaws give an unauthenticated attacker a
      way to enumerate valid staff usernames and then spray or stuff credentials against them without
      lockout — a credential-validation oracle in front of an identity-integrated application.
      Detection sits in web/application access logs and the authentication log: an unusual ratio of
      failed to successful logins from a single source against the PaperCut login endpoint, and
      high-volume login attempts whose response-time distribution splits into two clusters (the
      enumeration signature). Benign lookalikes are a misconfigured client or scheduled job
      re-presenting stale credentials, distinguishable by a small, fixed set of repeated usernames
      versus a broad sweep of distinct ones. Hardening: upgrade to 26.0.3, and place any
      internet-reachable PaperCut login behind a reverse proxy or WAF that enforces rate limiting
      independently of the application.
    region_nexus: "France (CERT-FR advisory); vendor-global. PaperCut NG/MF is widely deployed across Swiss and European public administration, education and healthcare print estates."
    primary_sector_nexus: "direct — print management is a standard public-administration and education service"
    sector: "public-sector, healthcare"
    cves: [CVE-2026-8793, CVE-2026-8794]
    techniques: [T1110.004, T1589.002]
    techniques_note: >
      T1110.004 Brute Force: Credential Stuffing for CVE-2026-8793 (no lockout or rate limiting on
      the login component); T1589.002 Gather Victim Identity Information: Email Addresses is the
      closest active mapping for the username-enumeration oracle in CVE-2026-8794 — if the composer
      prefers not to stretch that mapping, T1110.004 alone is defensible and the enumeration
      behaviour can be carried in prose only.
    affected_products: ["PaperCut NG", "PaperCut MF"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
