    borderline_reason: "both CVEs are 6.9 MEDIUM with no RCE and no observed exploitation; included because PaperCut NG/MF has heavy public-sector/education/healthcare deployment and the two flaws chain into an unauthenticated credential-validation oracle — the composer should decide whether that clears PD-11"
    extended_notes: |
      The other two in-window CERT-FR avis of 03.08 are CERTFR-2026-AVI-0960 (Microsoft Edge) and
      CERTFR-2026-AVI-0961 (Microsoft Office) — routine vendor-cycle items, S1 territory, not
