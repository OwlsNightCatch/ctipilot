    summary: |
      On 2026-08-03 two European national CERTs withdrew published SQLite advisories because
      the underlying CVEs do not describe real bugs. NCSC-NL revised NCSC-2026-0268 to version
      1.01 with the withdrawal reason stated plainly — the "vulnerability" was very likely
      hallucinated by an LLM — and BSI CERT-Bund retitled WID-SEC-2026-2604 (first published
      2026-07-30) and WID-SEC-2026-2581 (first published 2026-07-29) to "MELDUNG ZURUECKGEZOGEN",
      scrubbing their CVE references. Both BSI advisories had been built from GitHub Advisory
      Database (GHSA) records, which is how the fabricated data reached them.
      The originating research is JFrog Security's audit (2026-07-30): a newly created GitHub
      repository, programmervuln/cveadvisory-, published a batch of advisories that NVD flagged
      as critical and CISA's Authorized Data Publisher enrichment agreed with. JFrog cloned
      sqlite/sqlite at the claimed tags (version-3.41.0, 3.51.2, 3.51.3), built them in isolated
      Docker containers, and ran every advisory's PoC SQL verbatim under AddressSanitizer. None
      reproduced. CVE-2026-51302 (9.8, initially scored 10.0 by Red Hat before downgrade to 7.6)
      claimed a use-after-free reached via exprComputeOperands() — a function that did not exist
      in SQLite 3.41 (added mid-2025); the alleged freeing function, sqlite3ReleaseTempReg(),
      only recycles register indices into an array and performs no heap deallocation, making the
      claimed class of bug structurally impossible. CVE-2026-51303 (9.8) cited a fix in 3.51.3
      although a 3.51.2-to-3.51.3 diff shows no change to src/expr.c at all. CVE-2026-51296 (7.5)
      cited lines 3555 and 3575 of src/json.c in a file that is 2706 lines long. CVE-2026-51297
      (8.8) referenced jsonBlobEdit(), absent from the claimed version. CVE-2026-51300 (9.1) and
      CVE-2026-51304 (7.5) cited unrelated line numbers and a function signature with the wrong
      arity. JFrog's wider audit of 55 advisories from the same account found 54 fabricated and
      one real bug wrapped in unverified metadata; the remaining 49 targeted libraw and the
      ESP32-audioI2S Arduino audio library. SQLite's maintainer Richard Hipp reported the same
      wave on 2026-07-29, said a random sample of "many dozen" such CVEs revealed none that were
      valid, and noted SUSE reached the same "fabricated" conclusion.
      The defender-relevant point is the propagation chain and its uneven retraction. Fabricated
      advisory in a GitHub repo -> MITRE CVE assignment (the public submission form performs no
      identity verification and no step in the pipeline requires PoC reproduction) -> NVD record
      plus CISA ADP enrichment -> GHSA -> BSI WID / NCSC-NL / Red Hat -> enterprise scanners and
      SBOM/dependency tooling. NVD's manual review backstop has been degraded since February 2024;
      The Register cites a Department of Commerce Inspector General report of May 2026 putting the
      NVD backlog above 27,000 records at end-2025. Retraction is propagating unevenly: NCSC-NL,
      BSI, Red Hat and NVD have withdrawn, flagged or rescored, and per an OSS-Security post by
      Oracle's Alan Coopersmith (2026-07-31) MITRE rejected the whole repository's CVEs — but at
      fetch time on 2026-08-04 GHSA-4r76-5xh9-qj36 (CVE-2026-51294, another fabricated SQLite
      use-after-free claim) was still live in the GitHub Advisory Database as "Unreviewed",
      referencing the same programmervuln repo. Organisations whose triage, ticketing or
      dependency-scanning pipelines ingest GHSA are therefore still being served the fabricated
      records after the national CERTs have retracted them.
      Practical triage implication: a CVSS 9.8+ record on a widely embedded library, with no
      maintainer corroboration, no commit or pull-request reference, placeholder or pinned-single-version
      CPE data, and code references that do not resolve in the claimed version, is now a recognised
      false-positive pattern rather than an emergency. JFrog's four stated red flags are: missing
      vendor corroboration on the maintainer's own security page, absent commit history in the
      reference fields, metadata contradictions (empty CPE product definitions or version ranges
      conflicting with the narrative), and non-existent code references (functions absent from the
      claimed version, or line numbers past end-of-file).
    region_nexus: "Germany and Netherlands (both national CERTs withdrew advisories); Europe-wide, since BSI WID and NCSC-NL advisory streams are widely consumed by Swiss and EU public-sector vulnerability-management teams; global upstream (MITRE/NVD/CISA ADP/GHSA)"
    primary_sector_nexus: "direct — public-sector vulnerability-management and patch-prioritisation processes consume exactly these advisory feeds"
