      week 31 and surfaced no item not already covered: Cisco Secure FMC CVE-2026-20316 (covered
      2026-07-30), Ruby on Rails CVE-2026-66066 (covered 2026-07-31 and 2026-08-02), Arista
      VeloCloud CVE-2026-16812 (covered 2026-07-28). It did carry two Atlassian Jira entries CERT-FR
      rates 9.8 — CVE-2022-37601 (RCE) and CVE-2026-42581 (security-policy bypass), CERTFR-2026-AVI-0934
      of 27.07 — which prior coverage does not contain, but both are outside the window (CVE
      publication 21.07, avis 27.07) with no in-window development, so they are dropped on recency
      rather than relevance. Flagging them here in case S1 wants the lead.

  - title: "cJSON is effectively unmaintained: CERT-PL discloses an unpatched heap overflow (CVE-2026-16554) after the vendor could not be reached, alongside 33 further unfixed issues in a library vendored into ESP-IDF and embedded firmware"
    sources:
      - { url: "https://cert.pl/en/posts/2026/07/CVE-2026-16554/", publisher: "CERT Polska / NASK", date: "2026-07-27", role: "primary" }
      - { url: "https://www.openwall.com/lists/oss-security/2026/07/30/22", publisher: "OSS-Security mailing list (Alan Coopersmith, Oracle), quoting joshua.hu", date: "2026-07-30", role: "primary" }
    discovery_trace: >
      first seen at: WebSearch ("MITRE rejects fake CVEs oss-security Coopersmith libraw
      ESP32-audioI2S SQLite August 2026") -> pivot: OSS-Security day index, URL
      https://www.openwall.com/lists/oss-security/2026/07/30/ -> pivot: the "33 Vulnerabilities in
      cJSON" post, URL https://www.openwall.com/lists/oss-security/2026/07/30/22 (which quotes the
      original write-up at joshua.hu/cjson-json-parser-cve-vulnerabilities — NOT fetched by me, so
      not cited as a source) -> primary authority: the CERT-PL advisory that post links, URL
      https://cert.pl/en/posts/2026/07/CVE-2026-16554/
    summary: |
      Two independent disclosures in late July 2026 converge on the same conclusion: cJSON, one of
      the most widely vendored JSON parsers in C, has no responsive maintainer and is shipping
      known-unfixed memory-safety bugs.
      CERT Polska coordinated and published CVE-2026-16554 on 2026-07-27: an integer overflow in
      print_string_ptr() in cJSON.c on 32-bit platforms. The escape_characters counter is a 32-bit
      size_t and wraps when a string carries roughly 858,993,460 or more control characters, so the
      output buffer is allocated from an underestimated length; when cJSON_PrintBuffered() is used
      with a pre-allocated buffer, the subsequent write loop overflows the heap allocation. An
      attacker who can supply crafted JSON to a 32-bit application using cJSON can cause a heap
      buffer overflow, potentially leading to remote code execution, information disclosure or
      denial of service (CWE-190). CERT-PL states it could confirm the flaw only in version 1.7.19
      because vendor contact attempts were unsuccessful, and notes other versions may also be
      affected — so there is no patched version to point at. Credit to Michal Majchrowicz and
      Marcin Wyczechowski of AFINE.
      Separately, on 2026-07-30 a researcher write-up (relayed to OSS-Security by Oracle's Alan
      Coopersmith) claimed 33 security issues in cJSON found with a mix of AI-assisted and manual
      fuzzing and review, stating they affect every version up to and including v1.7.19 and are all
      still present in current code, that development has been broadly stagnant for four years, and
      that memory-safety reports sit open and unanswered on GitHub — in some cases with an unmerged
      patch in the same thread. The first thirteen are described as memory-safety issues plus a
      denial of service, the remainder as logic bugs that silently lose data or act on the wrong
      object member. Each claim ships a complete self-contained PoC built with
      -fsanitize=address,undefined at -O0; the author notes some crash only with ASan and UBSan
      enabled together on an unoptimised build, because it is the instrumentation that fattens
      stack frames enough to run off the end — meaning a partial sanitizer set or an -O2 build makes
      the library look healthier than it is. CVE-2026-67215, CVE-2026-67216 and CVE-2026-67217 cite
      that write-up as their reference. The author's own recommendation is to evaluate moving off
      cJSON where it parses attacker-controlled JSON, and explicitly warns against merging the
      unlanded GitHub patches, some of which he assesses introduce fresh bugs.
      The exposure that matters for this constituency is where cJSON lives: it is vendored into
      ESP-IDF and, per the write-up, "a lot of embedded firmware" plus server-side C. That places
      it in the device layer of OT and building-automation estates in energy, water, transport and
      facility management, where firmware update cycles are long or absent and where an unpatched
      heap overflow reachable from attacker-controlled JSON is a durable foothold primitive. There
      is no vendor fix to deploy, so the levers are inventory and containment: identify products in
      the estate whose SBOM or firmware bill of materials lists cJSON, determine whether they parse
      externally supplied JSON and whether the platform is 32-bit (the precondition for
      CVE-2026-16554), and where they do, constrain who can reach the parsing interface rather than
      waiting for a patch. Detection is weak by nature — a heap overflow in embedded firmware
      typically surfaces as unexplained device restarts or watchdog resets rather than a security
      event — so device-availability telemetry and crash-loop patterns on JSON-speaking endpoints
      are the realistic signal, with benign lookalikes being power events and firmware-update
      reboots, distinguishable by correlation with inbound request volume to the JSON interface.
    region_nexus: "Poland (CERT-PL is the coordinating authority); library-global, with direct European critical-infrastructure exposure through embedded firmware and ESP-IDF-based devices"
    primary_sector_nexus: "indirect for public administration; direct for the profile's additional sectors (energy, water, transport) through OT and building-automation device firmware"
    sector: "energy, water, transport, cross-sector"
    cves: [CVE-2026-16554, CVE-2026-67215, CVE-2026-67216, CVE-2026-67217]
    techniques: [T1190, T1499.004]
    techniques_note: >
      T1190 Exploit Public-Facing Application for the attacker-supplied-JSON reachability of the
      heap overflow where the parsing interface is network-exposed; T1499.004 Endpoint Denial of
      Service: Application or System Exploitation for the denial-of-service outcome CERT-PL states.
      RCE is stated as potential by CERT-PL, not demonstrated, so do not map a code-execution
      technique beyond T1190.
    affected_products: ["cJSON", "ESP-IDF"]
    entity_keys: []
