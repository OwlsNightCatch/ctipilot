  - title: "ACN Italy H1 2026 operational summary: NIS2 notifications drive a 47% rise in reported cyber events, and the agency attributes a 54% CVE surge partly to frontier AI models"
    sources:
      - { url: "https://www.acn.gov.it/portale/w/operational-summary-1-semestre-2026", publisher: "Agenzia per la Cybersicurezza Nazionale (ACN) / CSIRT Italia", date: "2026-07-24", role: "primary" }
    discovery_trace: >
      first seen at: WebSearch ("CSIRT Italia avviso 3 agosto 2026 pubblica amministrazione attacco
      informatico") -> primary: the ACN publication page, URL
      https://www.acn.gov.it/portale/w/operational-summary-1-semestre-2026 (no pivot needed — ACN is
      the authority and the page carries the full summary text plus the PDF
      Operational_Summary_H1_26_CLEAR.pdf, published 24/07/2026)
    summary: |
      Italy's national cybersecurity agency published its H1 2026 operational summary on 2026-07-24.
      CSIRT Italia handled 2,171 cyber events against 1,474 in H1 2025 (+47%), and states plainly
      that the rise reflects over 1,000 NIS notifications now arriving under NIS2 rather than a real
      increase in threat or impact — 1,072 events were classified as confirmed-impact incidents while
      1,099 had no confirmed impact, broadly flat against the 1,164 of H1 2025. Recurring threats
      were DDoS, data exposure, phishing, mailbox compromise, abuse of valid credentials and
      exploitation of known vulnerabilities; year on year, credential-compromise, data-exposure and
      vulnerability-exploitation threats rose while DDoS, ransomware and misconfiguration fell.
      Sector distribution — again read through the NIS2 reporting-obligation effect — puts
      manufacturing, technology and healthcare at the top, with central and local public
      administration less affected than in H1 2025. Ransomware fell 12% to 181 incidents against
      Italian entities, most in manufacturing, retail and technology; ACN names the principal
      enabling factors as previously compromised valid credentials, inadequately configured or
      protected remote-access and VPN services, and exploitation of known vulnerabilities and exposed
      services. 407 DDoS campaigns were recorded (-32% year on year), peaking in February around the
      Milano-Cortina Winter Olympics where pro-Russian groups mainly hit accommodation providers in
      the competition areas, central and local public administration and transport operators — with
      limited effect (in February only 6% of events produced even temporary website unavailability) —
      and resuming in May after reporting on Italy's political support for Ukraine, with 117 DDoS that
      month and measurable impact in around 20 cases; June campaigns hit central and local public
      administrations, transport, telecommunications, financial services, port authorities and energy
      operators. On the vulnerability side, 37,032 new CVEs were published in H1 2026 against 24,098
      in H1 2025 (+54%), of which 5,722 carried at least one public PoC and 69 were observed under
      active exploitation; ACN attributes the increase substantially to the growing use of frontier
      AI models compressing the time needed for code analysis, vulnerability research and PoC
      generation. ACN's monitoring identified 24,303 at-risk assets and services and 1,560
      potentially compromised assets, issuing 7,634 pre-emptive alert notifications under Article 2(1)
      of Law 90/2024. Named vulnerability clusters it monitored include Fortinet, Citrix, Cisco,
      Microsoft SharePoint and Exchange, PostgreSQL, SolarWinds, Apache, n8n, Ubiquiti, Exim, Palo
      Alto, SAP NetWeaver and Roundcube. Most frequent entry points were malicious email campaigns,
      previously compromised valid credentials, phishing and social engineering, with some intrusions
      following supply-chain dynamics through supplier security posture.
      Why it matters here: this is the closest publicly available analogue to what a Swiss or EU
      public-sector SOC will see, from an authority with statutory visibility, and its two headline
      findings are directly transferable — NIS2 reporting inflates event counts without inflating
      threat (so year-on-year comparisons across the NIS2 boundary are not like-for-like), and the
      genuine CVE volume is rising sharply for AI-related reasons at the same time as the CVE stream
      is being polluted by AI-fabricated records (item 1 above).
    region_nexus: "Italy (EU member state, national authority); findings transferable to Swiss and EU public-sector and critical-infrastructure defenders, and the NIS2 reporting effect is EU-wide"
    primary_sector_nexus: "direct — the report's sector breakdown and DDoS targeting explicitly cover central and local public administration"
    sector: "public-sector, healthcare, transport, telco, finance, energy"
    cves: []
    techniques: [T1078, T1133, T1190, T1566, T1498]
    techniques_note: >
      Mapped from ACN's own stated threat and entry-point taxonomy: T1078 Valid Accounts (abuse of
      previously compromised valid credentials, named as the leading ransomware enabler and a top
      entry point); T1133 External Remote Services (inadequately configured or protected
      remote-access/VPN services); T1190 Exploit Public-Facing Application (exploitation of known
      vulnerabilities and exposed services); T1566 Phishing (malicious email campaigns and phishing
      as the most frequent entry point); T1498 Network Denial of Service (the 407 hacktivist DDoS
      campaigns).
    affected_products: []
    entity_keys: []
    new_entities:
      - key: "report:acn-csirt-italia-operational-summary-h1-2026"
        type: report
        name: "ACN / CSIRT Italia Operational Summary H1 2026"
        aliases: ["Operational Summary 1° semestre 2026", "ACN Operational Summary H1 2026"]
        summary: >
          Half-year operational report from Italy's Agenzia per la Cybersicurezza Nazionale
          (published 2026-07-24) covering 2,171 cyber events handled by CSIRT Italia in H1 2026
          (+47% year on year, driven by NIS2 notifications), 181 ransomware incidents (-12%), 407
          hacktivist DDoS campaigns (-32%) and 37,032 newly published CVEs (+54%), which ACN
          attributes partly to frontier AI models accelerating vulnerability research and PoC
          generation.
    relation_suggestions: []
    verification: SINGLE-SOURCE-NATIONAL-CERT
    confidence: HIGH
    novelty: new
    classification: { reliability: A, credibility: 2 }
    classification_note: >
      Single-source under the national-CERT carve-out: ACN/CSIRT Italia is the primary disclosing
      authority for its own jurisdiction's incident statistics. Credibility 2 because the figures
      are the authority's own uncorroborated telemetry, and ACN itself cautions that the headline
      +47% reflects NIS2 reporting rather than a real threat increase.
    evidence:
      - quote: "Nel primo semestre 2026 sono stati registrati 181 ransomware a danno di soggetti italiani rispetto ai 206 rilevati nel corrispondente periodo del 2025."
        attribution: "ACN / CSIRT Italia"
        source_url: "https://www.acn.gov.it/portale/w/operational-summary-1-semestre-2026"
      - quote: "risulta meno interessata la Pubblica amministrazione centrale e locale."
        attribution: "ACN / CSIRT Italia"
        source_url: "https://www.acn.gov.it/portale/w/operational-summary-1-semestre-2026"
      - quote: "I punti d’ingresso più frequenti delle attività malevole censite nel primo semestre 2026 sono stati le campagne malevole via e-mail , l’impiego di credenziali valide precedentemente compromesse , il phishing e il social engineering in generale."
        attribution: "ACN / CSIRT Italia"
        source_url: "https://www.acn.gov.it/portale/w/operational-summary-1-semestre-2026"
    borderline: true
    borderline_reason: "published 2026-07-24, eleven days outside the 26 h window with no in-window development — returned rather than dropped because it is an unprocessed periodic national-authority report (absent from the 14-day prior-coverage index and from the 2026-08-02 weekly), it is squarely in the profile's region and sector, and its CVE-volume finding pairs analytically with item 1; if the composer applies recency strictly it should be handed to the next weekly W1 periodic-report sweep instead"
    extended_notes: |
      The report PDF the page links is Operational_Summary_H1_26_CLEAR.pdf, published 24/07/2026,
      reachable from the same ACN publication page. The third evidence quote above contains spacing
      artefacts (" , ") that are present in the page's own rendered text as fetched; if the verifier
      flags it, substitute the shorter clean fragment "il phishing e il social engineering in generale".
      Italy has NO tracked source record in sources.json — see the candidate-source proposal below.

