      can be made from it. Recommend noting that per-report dates require drilling
      /report/<slug> individually.
  - source_id: ncsc-ch-security-hub
    reason: >
      FETCHED OK, QUIET WINDOW. `ncsc-csh recent 12` returned cleanly; the newest post is 12821
      (2026-07-31 12:06Z, IBM WebSphere) and the listing is ordered by last activity, so there is
