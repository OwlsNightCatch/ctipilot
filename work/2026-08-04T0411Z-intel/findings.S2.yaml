        type: trend
        name: "LLM-fabricated CVE advisory wave (programmervuln/cveadvisory-)"
        aliases: ["LLM slop CVEs", "AI slop CVEs", "fake SQLite CVEs", "slop CVEs"]
        summary: >
          Batch of 55 fabricated vulnerability advisories published via a single new GitHub
          repository (programmervuln/cveadvisory-) in late July 2026 against SQLite, libraw and
          ESP32-audioI2S. JFrog Security Research (2026-07-30) reproduced-tested six SQLite
          entries under AddressSanitizer and found none valid, and assessed 54 of 55 as
          completely fabricated with one real bug wrapped in unverified metadata; SQLite
