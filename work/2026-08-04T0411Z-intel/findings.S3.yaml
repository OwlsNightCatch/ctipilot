    evidence:
      - quote: "Unlike a legitimate user flow that requires user interaction and device unlock, this attack shows how malware can obtain the required signature silently, without user consent, biometrics, device unlock or elevated privileges."
        attribution: "Unit 42 (Palo Alto Networks)"
        source_url: "https://unit42.paloaltonetworks.com/passwordless-authentication-security-risks/"
      - quote: "The cloud authenticator does not validate the attestation of newly registered UV keys to verify whether they originate from secure hardware."
        attribution: "Unit 42 (Palo Alto Networks)"
        source_url: "https://unit42.paloaltonetworks.com/passwordless-authentication-security-risks/"
      - quote: "In Google's current implementation, there is no way to rotate or revoke the SDS, meaning all current and future synced passkeys remain protected by the same master key."
        attribution: "Unit 42 (Palo Alto Networks)"
        source_url: "https://unit42.paloaltonetworks.com/passwordless-authentication-security-risks/"
      - quote: "Chrome creates or receives 32-byte security-domain secrets in client-process data structures. That confirms the secret enters Chrome memory, though reliable extraction, account takeover, and persistence across future secret epochs remain sourced to Unit 42 or unresolved."
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/08/google-password-manager-attacks-could.html"
    extended_notes: |
      Detection concept (telemetry class first): process-creation/module-load telemetry showing an unprivileged, non-browser process invoking Windows CNG APIs (NCryptOpenStorageProvider/NCryptImportKey/NCryptSignHash) shortly after reading files under %LocalAppData%\Google\Chrome\User Data\<Profile>\{passkey_enclave_state, Sync Data\LevelDB} — a benign lookalike is Chrome's own browser process performing the same CNG calls during a legitimate, user-present WebAuthn ceremony, so the discriminator is process identity (non-chrome.exe process signing with the device identity key) and absence of any preceding UI/biometric prompt. A second detection class: memory-access/EDR-visible process-memory-read events targeting chrome.exe shortly after a forced device de-enrollment (deletion of passkey_enclave_state) — legitimate re-enrollment is rare and user-initiated, so an automated, silent re-enrollment immediately followed by cross-process memory reads of chrome.exe is the discriminating sequence. Hardening: relying parties must independently enforce and require the UV flag (this closes Pass-ta-key entirely, per the article "This is the one that turns on a check the relying party controls, so a site can fail it regardless of how the cloud service behaves") — treat every relying-party WebAuthn integration in the CH/EU public-sector estate as needing an explicit UV-flag-required policy check rather than trusting Google's cloud authenticator to enforce it. No cryptographic primitive is broken in any of the three variants — all three are implementation/trust-boundary gaps (client trust, onboarding/recovery flow validation, key-material handling), so the mitigation is architectural rather than a patch to install.
  - title: "ANNUAL REPORT — CrowdStrike 2026 Threat Hunting Report: 88% of PoC-based exploitation now lands inside 48 hours, and AI infrastructure/toolchains are named as both attacker capability and attacker target"
    sources:
      - { url: "https://www.crowdstrike.com/en-us/blog/crowdstrike-2026-threat-hunting-report/", publisher: "CrowdStrike Counter Adversary Operations", date: "2026-08-03", role: "primary" }
      - { url: "https://siliconangle.com/2026/08/03/crowdstrike-finds-ai-systems-direct-attack-exploit-windows-shrink/", publisher: "SiliconANGLE", date: "2026-08-03", role: "corroborating" }
    discovery_trace: "first seen at: crowdstrike (core_high_value source-list slice), URL https://www.crowdstrike.com/blog/category/counter-adversary-operations/ → primary: CrowdStrike Counter Adversary Operations, URL https://www.crowdstrike.com/en-us/blog/crowdstrike-2026-threat-hunting-report/ → corroborating: SiliconANGLE, URL https://siliconangle.com/2026/08/03/crowdstrike-finds-ai-systems-direct-attack-exploit-windows-shrink/"
    summary: |
      CrowdStrike Counter Adversary Operations published its annual Threat Hunting Report (2026-08-03), drawing on OverWatch managed-hunting telemetry across 290+ tracked adversaries for the period roughly January-June 2026. Headline finding: 88% of observed exploitation of vulnerabilities carrying a public PoC occurred within 48 hours of the PoC's release; China-nexus VAULT PANDA and GENESIS PANDA moved to deliberate exploitation within 24 hours of disclosure on critical web-application flaws (including a named React2Shell exploitation wave — 800+ hunting leads across 80+ victims in four days), and Belarus-nexus UMBRAL BISON was observed exploiting a Linux local-privilege-escalation flaw (CVE-2026-31431) within roughly 20 hours of disclosure, 94% of that early activity matching public PoC testing patterns. On identity/trust abuse: voice-phishing (vishing) intrusions doubled H1 2026 vs H2 2025, device-code phishing increased roughly 15x over six months, and the eCrime actors CORDIAL SPIDER and SNARKY SPIDER are reported moving from initial account takeover to SaaS data theft in under five minutes. On AI as both target and toolchain risk: one LLMjacking campaign generated ~200,000 API requests against a hijacked corporate LLM service in two minutes; AI-model-access techniques accounted for 16% of observed MITRE ATLAS-mapped technique usage; and AI-agent-triggered detection leads now surface at 2.5x the rate of human-triggered leads, which the report frames as a defender-side triage-complexity problem, not solely an attacker capability gain. On software supply chain, 87% of identified software-registry threats in H1 2026 involved npm packages, and DPRK-nexus STARDUST CHOLLIMA (the same actor Microsoft tracks as Sapphire Sleet / BlueNoroff) is named as having injected malicious postinstall payloads into 131+ packages of the Mastra AI framework in June 2026, while a separate financially motivated actor, ALTERED SPIDER, is reported compromising 300+ dependencies in a single day.
    region_nexus: "global telemetry-derived report; the exploitation-velocity, vishing/device-code-phishing, and npm-supply-chain findings are all directly actionable for CH/EU public-sector and critical-infrastructure patch-prioritisation and identity-hardening programmes"
