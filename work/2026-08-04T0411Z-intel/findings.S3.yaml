items:
  - title: "Unit 42's 'Pass-ta-key': malware on an unprivileged Windows session can silently forge Chrome/Google Password Manager passkey assertions and, via a second variant, extract every synced passkey's private key in plaintext"
    sources:
      - { url: "https://unit42.paloaltonetworks.com/passwordless-authentication-security-risks/", publisher: "Palo Alto Networks Unit 42", date: "2026-08-03", role: "primary" }
      - { url: "https://thehackernews.com/2026/08/google-password-manager-attacks-could.html", publisher: "The Hacker News", date: "2026-08-03", role: "corroborating" }
    discovery_trace: "first seen at: unit42 (core_high_value source-list slice), URL https://unit42.paloaltonetworks.com/ (listing surfaced the title but not the URL) → pivot: WebSearch (\"Unit 42 \\\"Pass the Passkey\\\" passwordless authentication attack surface\") → primary: Unit 42, URL https://unit42.paloaltonetworks.com/passwordless-authentication-security-risks/ → corroborating: The Hacker News, URL https://thehackernews.com/2026/08/google-password-manager-attacks-could.html"
    summary: |
      Unit 42 researcher Arie Olshtein published (2026-08-03) three attack variants — Pass-ta-key, Silver Pass-ta-key, and Golden Pass-ta-key — against Chrome's cloud-synced passkey (FIDO2/WebAuthn) implementation on Windows systems with a TPM, all requiring only unprivileged malware already resident on the endpoint (no elevation, no user interaction, no biometric/PIN unlock). Pass-ta-key extracts the TPM-wrapped device identity key (wrapped_identity_private_key, stored on disk in passkey_enclave_state and exportable as an NCRYPT_OPAQUE_KEY_BLOB) and drives it directly through Windows CNG APIs (NCryptOpenStorageProvider / NCryptImportKey / NCryptSignHash) to sign a forged WebAuthn assertion with the User Verified (UV) flag unset — defeating any relying party that omits UV-flag validation. Silver Pass-ta-key forces Chrome device re-enrollment (by deleting passkey_enclave_state) and abuses the device/add_uv_key onboarding command to register an attacker-controlled UV key, because Google's cloud authenticator does not validate hardware attestation on newly registered UV keys — this produces a durable, UV=1-forging capability that survives even when the relying party correctly checks the UV flag. Golden Pass-ta-key goes further: during the same forced re-enrollment, Chrome's 32-byte Security Domain Secret (SDS) — the master key protecting every synced passkey — transits client memory in plaintext during Trusted Vault recovery; malware that dumps Chrome's process memory at that moment extracts the SDS and can then decrypt every WebauthnCredentialSpecifics record in Chrome's sync LevelDB, yielding every synced passkey's private key in the clear, reusable offline and outside the victim's environment. A reconnaissance stage (enumerating the same sync database) requires no elevated privileges either. Google has only partially mitigated: it removed SDS values from chrome://device-log/FIDO logging (Issue #464305542), but per the article the core gaps — no attestation check on UV-key registration, SDS transiting client memory in plaintext, and no mechanism to rotate/revoke the SDS — remain unresolved as of publication, and eBay (one tested relying party) fixed its own UV-flag validation while GitHub was also tested. No CVE has been assigned to any of the three variants.
    region_nexus: "global — applies to any Windows endpoint running Chrome with TPM-backed Google Password Manager passkey sync; directly relevant wherever CH/EU public-sector or enterprise identity programmes are migrating staff or citizen-facing logins to passwordless/passkey authentication"
