  - title: "Germany NIS2UmsG June 30 compliance milestone: first internal audit checkpoint for ~29,500 obligated entities"
    sources:
      - url: "https://www.advisori.de/en/blog/nis2-enforcement-2026-bsi-audit-fines"
        publisher: "ADVISORI (legal/advisory commentary)"
        date: "2026-06-28"
        role: "primary"
      - url: "https://nisd2.eu/nis2-compliance-checklist-for-germany/"
        publisher: "nisd2.eu"
        date: "2026-06-25"
        role: "corroborating"
    discovery_trace: "first seen at: WebSearch ('Germany NIS2 June 2026 compliance deadline BSI audit') → pivot: advisori.de blog (June 28) → corroborating: nisd2.eu checklist (June 25)"
    summary: |
      Germany's NIS2 transposition law (NIS2UmsG / BSI-Gesetz neu) entered into force December 6, 2025, placing approximately 29,500 German entities (essential and important) under binding security obligations across 16 critical sectors. The June 30, 2026 date is widely cited in German legal and compliance commentary as the first internal compliance checkpoint: entities are expected to have completed gap analysis, documented risk frameworks, and at minimum partially implemented the ten mandatory security measures (risk analysis, incident response, business continuity, supply chain security, cryptography, MFA, access control, vulnerability management, network security, and training). BSI began proactive compliance enquiries in Q1 2026. Registration with BSI (deadline March 6, 2026) was widely missed — approximately 18,500 of 29,500 obligated entities reportedly failed to register by the deadline, creating a secondary enforcement queue. Director-level personal liability for non-compliance is a distinguishing feature of NIS2UmsG; executives cannot delegate accountability to IT departments. Maximum fines: essential entities €10M or 2% global annual turnover; important entities €7M or 1.4%. Formal BSI external audit requirements for essential entities are mandated by December 2028; the June 30 milestone represents an industry-standard internal governance checkpoint, not a formal BSI-imposed external audit deadline. Swiss organisations with German subsidiaries or operating in cross-border EU critical infrastructure should assess NIS2UmsG applicability to their German entities.
    ch_eu_nexus: "Germany (EU member); NIS2UmsG is the German transposition of EU NIS2 Directive; affects EU-wide supply chains and cross-border critical infrastructure operators"
    public_sector_nexus: "indirect — essential and important entities include public administration in Germany; affects Swiss organisations with German operations"
    sector: "energy, transport, financial, health, water, digital infrastructure, public administration, space"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "NIS2UmsG in force since 6 December 2025; June 30, 2026 is the first internal compliance milestone; BSI conducting active outreach to non-registered entities; director liability applies from day one"
        attribution: "ADVISORI"
        source_url: "https://www.advisori.de/en/blog/nis2-enforcement-2026-bsi-audit-fines"
      - quote: "~29,500 German entities obligated; 10 mandatory measures; registration deadline March 6, 2026 widely missed"
        attribution: "nisd2.eu"
        source_url: "https://nisd2.eu/nis2-compliance-checklist-for-germany/"
    extended_notes: |
      Confidence MEDIUM because (1) the June 30 internal checkpoint date is legal/advisory commentary rather than a formal BSI-published deadline — the primary BSI obligation dates are registration (March 2026) and formal audit certification (December 2028); (2) ADVISORI is a consulting firm rather than a primary legal authority. Main agent should frame this as "widely cited first internal compliance milestone" rather than a hard regulatory deadline. Relevance: timely (June 30 is today); affects EU supply chains including Swiss exporters.

