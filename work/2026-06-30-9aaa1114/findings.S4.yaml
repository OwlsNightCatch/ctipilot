  - title: "UPDATE: US State Department posts $10M Rewards for Justice bounty on UNC5792 (FSB) and UNC4221 (GRU) — new Signal Backup Recovery Key theft tactic added to advisory"
    sources:
      - url: "https://rewardsforjustice.net/rewards/unc5792/"
        publisher: "US State Department — Rewards for Justice"
        date: "2026-06-29"
        role: "primary"
      - url: "https://www.bleepingcomputer.com/news/security/us-offers-10-million-for-hackers-targeting-whatsapp-signal-users/"
        publisher: "BleepingComputer"
        date: "2026-06-29"
        role: "corroborating"
      - url: "https://www.securityweek.com/us-offers-10-million-bounty-for-russian-state-hackers-as-messaging-app-attacks-evolve/"
        publisher: "SecurityWeek"
        date: "2026-06-29"
        role: "corroborating"
    discovery_trace: "first seen at: therecord RSS feed, URL https://therecord.media/feed/ (item 'US posts $10 million reward over Russian cyber campaign targeting Signal, WhatsApp', published 2026-06-29) → primary: rewardsforjustice.net/rewards/unc5792/ (bridge fetch 200) → corroborating: BleepingComputer + SecurityWeek articles (bridge fetch 200 each)"
    summary: |
      UPDATE on the Signal/WhatsApp phishing campaign by Russia-nexus groups UNC5792 and UNC4221 (previously covered 2026-06-27 as the FBI/CISA joint advisory). The fresh in-window development is the escalation: the US Department of State's Rewards for Justice program on 2026-06-29 posted a $10 million reward for identifying or locating members of these groups. UNC5792 is assessed as associated with Russia's FSB Border Guards; UNC4221 is associated with Russian military intelligence (GRU). The Rewards for Justice announcement coincides with an update to the FBI/CISA advisory adding a newly observed tactic: the operators now specifically target Signal Backup Recovery Keys. A compromised recovery key is persistent — even if the victim rotates their phone number or reinstates their account, the attacker retains the ability to restore the full message backup, including prior history and group message content. This means the Signal-targeting campaign's operational persistence extends well beyond the initial social-engineering interaction. The updated advisory characterises both groups as targeting current and former US and international government officials, military personnel, political figures, journalists, and Ukraine-based officials, with ongoing activity across Europe and the US.
    ch_eu_nexus: "High — campaign targets European government officials and Ukraine-adjacent diplomatic networks; Swiss federal government and cantonal officials using Signal should treat this as an active threat"
    public_sector_nexus: "direct — explicitly targets government officials, military personnel, political figures"
    sector: "government, defense, media"
    cves: []
    actors_campaigns_malware: ["UNC5792", "UNC4221"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: update-to-prior:2026-06-27
    evidence:
      - quote: "US Department of State is offering up to $10 million for information that helps identify or locate members of the UNC5792 and UNC4221 hacker groups, which are linked to Russia's intelligence and military services"
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/us-offers-10-million-for-hackers-targeting-whatsapp-signal-users/"
      - quote: "The FBI and CISA updated their March 2026 advisory last week with new tactics used observed in attacks attributed to the two threat groups, which include stealing Signal Backup Recovery Keys"
        attribution: "SecurityWeek"
        source_url: "https://www.securityweek.com/us-offers-10-million-bounty-for-russian-state-hackers-as-messaging-app-attacks-evolve/"
    extended_notes: |
      The $10M bounty escalation is notable in that the US government is publicly naming the operator clusters by Mandiant/GTIG tracking designations (UNC5792, UNC4221). This level of public attribution precision (separate UNC cluster identifiers for FSB Border Guards vs GRU) suggests high-confidence intelligence underpinning. The NCSC-CH Signal phishing warning (covered 2026-06-25) is the direct Swiss analogue — Swiss federal agencies should review if they have implemented guidance from that advisory before this escalation.

