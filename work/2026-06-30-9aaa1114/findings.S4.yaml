items:
  - title: "Fox Rothschild law firm confirms Silent Ransom Group (Luna Moth) breach — social-engineering access, data leak, class-action filed"
    sources:
      - url: "https://databreaches.net/2026/06/29/exclusive-top-100-law-firm-fox-rothschild-suffers-data-breach-and-leak-by-silent-ransom-group/"
        publisher: "DataBreaches.net"
        date: "2026-06-29"
        role: "primary"
      - url: "https://news.bloomberglaw.com/privacy-and-data-security/fox-rothschild-sued-after-alleged-silentransomgroup-cyberattack"
        publisher: "Bloomberg Law"
        date: "2026-06-29"
        role: "corroborating"
    discovery_trace: "first seen at: databreaches-net RSS feed, URL https://www.databreaches.net/feed/ (item published 2026-06-29) → pivot: DataBreaches.net article (403 on bridge, covered via WebSearch) → corroborating: Bloomberg Law article https://news.bloomberglaw.com/privacy-and-data-security/fox-rothschild-sued-after-alleged-silentransomgroup-cyberattack"
    summary: |
      Fox Rothschild LLP, a top-100 US law firm (950 attorneys across 27 offices), confirmed on or around 2026-06-29 that a Social Ransom Group (SRG, also tracked as Luna Moth) breach occurred on 2026-05-21. SRG operators used a "sophisticated social engineering" attack — one attorney fell victim — to gain network access and exfiltrate data without deploying file-encrypting malware. SRG is a low-noise extortion actor that relies on phishing, vishing, and Living-off-the-Land (LotL) administrative tooling: it does not encrypt, it exfiltrates and threatens public leak. When Fox Rothschild missed the 2026-05-28 payment deadline, SRG publicly released the stolen data. The actor claimed to have obtained ~100,000 Social Security numbers (disputed by the firm as containing duplicates); DataBreaches.net confirmed folders containing litigation class-member records with names, addresses, phone numbers, SSNs, and case-specific information. The FBI has publicly linked SRG to a sustained law-firm targeting campaign: SRG now lists 48 law firms on its leak site, up from 38 in April 2026, with the group claiming most of its law-firm targets pay ransom. A class-action suit (Case 2:26-cv-03931, EDPA) was filed by plaintiff Jasmine Trotter. Technique class: T1566 Phishing → initial access; T1078 Valid Accounts; T1041 Exfiltration Over C2 Channel; extortion-without-encryption (no standard ransomware TTP mapping — this is pure data-theft extortion). Defender priority: SRG exploits human authentication paths rather than software vulnerabilities — the detection surface is identity and access management, not patching. Hunt for: anomalous large-volume data staging activity in SharePoint/OneDrive or file-server DLP alerts; LotL tools (e.g. RClone, WinRAR, WinSCP) spawned from browser or email-client parent processes; login events from unusual geolocations on recently vished accounts; MFA bypass attempts (device-code flows or session-hijack artifacts).
    ch_eu_nexus: "US victim; law-firm attack pattern applicable to European legal sector — SRG has targeted UK and EU firms in prior campaigns"
    public_sector_nexus: "indirect — law firms hold government-related litigation class data"
    sector: "legal, professional-services"
    cves: []
    actors_campaigns_malware: ["SilentRansomGroup", "Luna Moth"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Fox Rothschild partner Mark McCreary said one attorney at the firm had fallen victim to a 'sophisticated social engineering event' on May 21"
        attribution: "DataBreaches.net (sourced from Fox Rothschild statement)"
        source_url: "https://databreaches.net/2026/06/29/exclusive-top-100-law-firm-fox-rothschild-suffers-data-breach-and-leak-by-silent-ransom-group/"
      - quote: "Fox Rothschild LLP was sued Tuesday by a plaintiff who said the law firm failed to sufficiently protect her data from cybercriminals who may have taken her Social Security number"
        attribution: "Bloomberg Law"
        source_url: "https://news.bloomberglaw.com/privacy-and-data-security/fox-rothschild-sued-after-alleged-silentransomgroup-cyberattack"
    extended_notes: |
      SRG / Luna Moth has been active since ~2022 targeting professional services. The group does not maintain persistent access beyond the initial exfiltration window — the dwell time is short (days), making pre-leak detection the only opportunity. The law.com article (2026-06-09) noted Fox Rothschild alongside Weil Gotshal as part of a broader wave of law-firm SRG attacks in late May 2026. FBI has attributed the cluster formally. Initial access is social engineering only — no public CVEs or software exploitation reported.

  - title: "AssuranceAmerica MGA employee-phishing breach notifies 1.1M+ policyholders across seven US states — SSNs, auto insurance and claims data exposed"
    sources:
      - url: "https://www.insurancebusinessmag.com/us/news/cyber/assuranceamerica-mga-breach-exposes-policyholder-data-in-employeetargeted-attack-580627.aspx"
        publisher: "Insurance Business Magazine"
        date: "2026-06-29"
        role: "primary"
      - url: "https://databreaches.net/2026/06/28/assuranceamerica-breach-may-have-affected-more-than-1-1-million-people-in-seven-states/"
        publisher: "DataBreaches.net"
        date: "2026-06-28"
        role: "corroborating"
    discovery_trace: "first seen at: databreaches-net RSS feed, URL https://www.databreaches.net/feed/ (item published 2026-06-28) → pivot: Insurance Business Magazine article (bridge fetch 200) → confirmed via WebSearch multiple state-regulator-cited sources"
    summary: |
      AssuranceAmerica Managing General Agency, LLC (Atlanta, GA) — an auto-insurance MGA serving agents across multiple states — notified over 1.1 million individuals of a phishing breach. Attack vector: a targeted phishing email hit a single employee on 2026-03-16; suspicious activity confirmed 2026-03-17 and the compromise was contained the same day. A forensic review of the accessed files was completed only on 2026-06-15 (~90-day gap between containment and notification). Exposed data categories: names, contact details, automobile insurance policy and account data, driver/vehicle information, claims records, driver's licence numbers, tax identification numbers, and in a subset of cases Social Security numbers. State notification filings show: 611,046 SC residents; 500,987 TX residents; 8,950 WA; 3,569 MA; 272 VT; plus California and Nebraska (totals not published at time of reporting). An Edelson Lechtzin LLP class-action investigation was announced 2026-06-28. Technique class: T1566.001 Spearphishing Attachment or Link → single employee account compromise → data staging and exfiltration (attacker methodology not fully disclosed in public filings). The 90-day forensic-review gap before notification is operationally relevant for insurers and MGAs assessing their breach-response SLAs under state data-breach notification laws (which typically require notification within 30–90 days of discovery).
    ch_eu_nexus: "US-domiciled insurer; no direct CH/EU nexus but pattern is relevant to EU insurance sector and NIS2 incident notification timelines"
    public_sector_nexus: "indirect — insurance MGA serving private policyholders"
