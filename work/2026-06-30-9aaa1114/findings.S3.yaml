        date: "2026-06-29"
        role: "corroborating"
    discovery_trace: "first seen at: dfirreport, feed https://thedfirreport.com/feed/ → primary: The DFIR Report, URL https://thedfirreport.com/2026/06/29/from-bing-search-to-ransomware-bumblebee-and-adaptixc2-deliver-akira-3/"
    summary: |
      This full DFIR Report (first reported to customers July 2025, now public) covers an SEO poisoning campaign directing Bing searches for 'ManageEngine OpManager' to trojanized MSI installers. The Bumblebee loader uses DLL side-loading via msimg32.dll sideloaded through consent.exe to establish initial C2. Within five hours, AdaptixC2 (an open-source post-exploitation framework, github.com/Adaptix-Framework/AdaptixC2) shellcode was injected into a renamed Windows Address Book utility (AdgNsy.exe), providing persistent C2 with Cobalt Strike-like capabilities. The threat actor created domain accounts with Enterprise Admin privileges via RSAT, moved laterally via RDP, and ran discovery with SoftPerfect Network Scanner, Zenmap, and RVTools. Credential harvesting included NTDS.dit extraction via VSS shadow copy and Veeam database credential dumping. Data exfiltration (approx. 77GB) ran over 44 hours via FileZilla/SFTP to a Ukrainian server; a RustDesk legitimate-tool remote access tunnel was also established. Akira ransomware deployed via WMI across root and child domains, deleting shadow copies via vssadmin. Swisscom B2B CSIRT confirmed an independent parallel intrusion tied to the same campaign. Detection: Sysmon EID 1 for consent.exe spawning msimg32.dll side-loads; Sysmon EID 11 for AdgNsy.exe creation; EID 4104 PowerShell with Impacket/lsassy modules; EDR alert on NTDS.dit access (EID 4663); WMI lateral movement (EID 4648 + net logon type 3).
    ch_eu_nexus: "Direct Switzerland relevance — Swisscom B2B CSIRT observed a second intrusion from the same campaign infrastructure"
    public_sector_nexus: "indirect — campaign targets enterprise broadly but Swisscom serves Swiss public-sector clients"
    sector: "enterprise, IT services"
