        role: "primary"
      - url: "https://www.zerodayinitiative.com/advisories/ZDI-26-342/"
        publisher: "Trend Micro Zero Day Initiative"
        date: "2026-06-09"
        role: "corroborating"
    discovery_trace: "first seen at: watchtowr RSS feed https://labs.watchtowr.com/rss/ → primary: watchTowr Labs article https://labs.watchtowr.com/enterprise-tech-in-shell-out-progress-kemp-loadmaster-uninitialized-heap-to-pre-auth-rce-cve-2026-8037/ → ZDI advisory https://www.zerodayinitiative.com/advisories/ZDI-26-342/"
    summary: |
      CVE-2026-8037 (CVSS 9.8 Critical, ZDI) is a pre-authentication remote code execution vulnerability in Progress Kemp LoadMaster, a load balancer deployed at enterprise network edges. The flaw is in the escape_quotes() function within the access executable: it allocates buffers via uninitialized malloc() without null-termination of escaped strings, allowing sprayed JSON payloads to the /accessv2 API endpoint to overwrite heap metadata in adjacent freed chunks via four single-quotes expanding to 16 bytes. The subsequent __sprintf_chk() call then reads out-of-bounds into attacker-controlled data, achieving code execution as root without authentication. Affected versions: GA 7.2.63.1 and older; LTSF 7.2.54.17 and older. Patch: version 7.2.63.2 (switches to calloc() with proper null termination). Progress confirmed no known active exploitation as of June bulletin. A second CVE in the same bulletin — CVE-2026-33691 (high severity) — involves OWASP CRS whitespace padding bypassing file upload extension checks. Detection: WAF or network perimeter anomaly detection for JSON POST to /accessv2 with unusual character sequences; appliance upgrade verification in patch management. Hardening: restrict management interface to dedicated admin VLAN; patch to 7.2.63.2 immediately.
    ch_eu_nexus: "LoadMaster is widely deployed in European enterprise and public-sector edge environments. Progress serves EU customers including managed security providers."
    public_sector_nexus: "indirect — load balancers sit at network edges of public-sector IT environments"
    sector: "enterprise, telco, public-sector"
