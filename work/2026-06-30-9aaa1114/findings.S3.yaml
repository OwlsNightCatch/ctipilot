        date: "2026-06-29"
        role: "corroborating"
      - url: "https://github.com/advisories/GHSA-r8mh-x5qv-7gg2"
        publisher: "GitHub Advisory Database"
        date: "2026-06-29"
        role: "corroborating"
    discovery_trace: "first seen at: hackernews feed https://feeds.feedburner.com/TheHackersNews → THN article https://thehackernews.com/2026/06/public-poc-released-for-critical.html → primary: VulnCheck advisory URL https://www.vulncheck.com/advisories/libssh2-out-of-bounds-write-via-unchecked-packet-length-in-transport-c → pivot: GitHub Advisory Database https://github.com/advisories/GHSA-r8mh-x5qv-7gg2"
    summary: |
      CVE-2026-55200 (CVSS 4.0 score 9.2, CWE-680 Integer Overflow to Buffer Overflow) is a critical pre-authentication memory corruption flaw in libssh2 affecting all releases through version 1.11.1. The vulnerable function ssh2_transport_read() in transport.c fails to enforce an upper bound on the attacker-controlled packet_length field during SSH transport handshake. An integer overflow with a 0xffffffff value causes malloc to allocate a tiny buffer while the subsequent write attempts to fill the full oversized packet, causing heap buffer overflow — triggering before authentication on any SSH client connect. This means a malicious or compromised SSH server can trigger RCE in connecting clients (git, curl, PHP, CI/CD systems). The patch commit (97acf3dfda80c91c3a8c9f2372546301d4a1a7a8) was merged to mainline June 12, 2026 but no official libssh2 release has been tagged yet. A public PoC scaffold appeared June 29. Exploitation requires the connecting client to have libssh2 linked and to initiate a connection to an attacker-controlled or compromised SSH server — realistic in supply chain/CI/CD scenarios. Detection: monitor git/curl/PHP processes initiating connections to unexpected SSH endpoints; patch/pin libssh2 in CI/CD pipeline images; build alerts for libssh2 version checks in SBOM tooling.
    ch_eu_nexus: "libssh2 is embedded in git, curl, and PHP — ubiquitous in Swiss federal IT development pipelines and Linux server fleets."
    public_sector_nexus: "indirect — developer toolchain and CI/CD pipeline risk in public-sector environments"
