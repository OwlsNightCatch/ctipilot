  - title: "Hijacked npm and Go packages use VS Code 'folderOpen' task autorun + blockchain dead-drop to deploy Python infostealer targeting developer credentials"
    sources:
      - url: "https://research.jfrog.com/post/hijacked-npm-vscode-tasks-blockchain/"
        publisher: "JFrog Security Research"
        date: "2026-06-24"
        role: "primary"
      - url: "https://thehackernews.com/2026/06/hijacked-npm-and-go-packages-use-vs.html"
        publisher: "The Hacker News"
        date: "2026-06-29"
        role: "corroborating"
    discovery_trace: "first seen at: hackernews feed https://feeds.feedburner.com/TheHackersNews → THN article https://thehackernews.com/2026/06/hijacked-npm-and-go-packages-use-vs.html → primary: JFrog primary research URL https://research.jfrog.com/post/hijacked-npm-vscode-tasks-blockchain/"
    summary: |
      JFrog Security Research disclosed two compromised npm packages — html-to-gutenberg (v4.2.11) and fetch-page-assets (v1.2.9), uploaded May 25, 2026 — plus 16 malicious Go packages hosting an identical attack chain. The attack exploits VS Code's folder-open task mechanism: a hidden 'eslint-check' task is configured with runOn: 'folderOpen', causing automatic code execution when any developer opens the project as a trusted workspace in VS Code or Cursor IDE, entirely bypassing npm v12's lifecycle-script security hardening. The payload is disguised as a fake font file (fa-solid-400.woff2) containing JavaScript. Stage 1 retrieves AES-encrypted payloads from blockchain transaction data using TronGrid and Aptos APIs as dead-drops (extracting data after a '?.' marker from BSC JSON-RPC queries), making C2 infrastructure blockchain-resilient. Stage 2 deploys a Socket.io backdoor for interactive command execution. Stage 3 is a Python infostealer targeting browser credential stores (Chromium, Firefox, Opera/Brave/Arc), password managers (1Password, LastPass, NordPass, Bitwarden), crypto wallets (MetaMask, Phantom, TronLink, Exodus, Atomic), developer tooling credentials (VS Code, GitHub Desktop), OS keystores, cloud provider configs (AWS, Azure, GCP), and messaging apps (Discord, Telegram). Cross-platform (Windows, Linux, macOS). MITRE: T1195.001 (Compromise Software Dependencies), T1059.006 (Python), T1020 (Automated Exfiltration). Detection: flag VS Code workspace task files (.vscode/tasks.json) with runOn:folderOpen in CI/CD repository scanning; SBOM tooling alert on newly published patch versions of npm packages; EDR alert on node.exe → python.exe chain for credential-store file access.
    ch_eu_nexus: "Developer-toolchain supply chain attack targeting CI/CD environments used across Swiss and EU software organizations. Blockchain-based C2 evades standard URL-blocking controls."
