  - title: "Microsoft StegoAd: 119 Edge extensions hide payloads in PNG/WebP/WOFF2 files via steganography, 2.6M installs, DarkSpectre China-nexus"
    sources:
      - url: "https://microsoftedge.github.io/edgevr/posts/Inside-StegoAd-How-We-Disrupted-a-Massive-Malicious-Extension-Campaign/"
