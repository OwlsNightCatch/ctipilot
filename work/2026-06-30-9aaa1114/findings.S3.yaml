    evidence:
      - quote: "The campaign employed steganography to hide executable payloads within PNG, WebP, and WOFF2 font files that appeared completely legitimate to users and scanners. Malicious code remained dormant for 3–5 days post-installation, detecting DevTools activity and validating requests server-side to evade sandbox analysis."
        attribution: "Microsoft Edge Security"
