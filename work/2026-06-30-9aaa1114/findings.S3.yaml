  - title: "The Gentlemen RaaS: Go-based self-propagating ransomware (Storm-2697) with BYOVD EDR kill, ESXi locker variant, top-10 RaaS by H1 2026 victim count"
    sources:
      - url: "https://securelist.com/the-gentlemen-raas/120447/"
        publisher: "Kaspersky Securelist"
        date: "2026-06-29"
        role: "primary"
      - url: "https://www.microsoft.com/en-us/security/blog/2026/05/28/the-gentlemen-ransomware-dissecting-a-self-propagating-go-encryptor/"
        publisher: "Microsoft Threat Intelligence"
        date: "2026-05-28"
        role: "corroborating"
    discovery_trace: "first seen at: kaspersky-securelist, feed https://securelist.com/feed → article https://securelist.com/the-gentlemen-raas/120447/ → corroborating: Microsoft TI blog (from msft-secblog feed)"
    summary: |
      Kaspersky researchers published a comprehensive analysis of The Gentlemen RaaS (tracked by Microsoft as Storm-2697), which ranks top-10 by victim announcements in H1 2026. The group deploys a custom Go-based backdoor using Yamux-based TCP multiplexing for C2, plus a C-based ESXi locker variant still in development. The mature Go ransomware uses Curve25519 (key exchange) and XChaCha20 (encryption) per file with ephemeral keys. Initial compromise typically occurs through exploitation of internet-facing services and weak credentials on VPN/firewall appliances. Reconnaissance uses SharpADWS (AD enumeration via Active Directory Web Services API — stealthy, uses port 9389 SOAP over HTTPS rather than LDAP 389), NetScan, and network packet capture. Lateral movement via GPO deployment and PsExec. BYOVD technique: vulnerable signed drivers are dropped to disable EDR/AV products (kavrmvr.exe — a legitimate Kaspersky uninstaller is abused as a carrier). Active targeting in manufacturing, IT services, healthcare, finance, construction, and logistics; concentrated geographic activity in Brazil, China, Indonesia, Taiwan, and Thailand. Microsoft's prior May 2026 report details the self-propagation module. Detection: SharpADWS activity on SOAP/HTTPS port 9389 to domain controllers; GPO changes from non-standard admin accounts; known BYOVD driver hash blocklist (Windows HVCI); Yamux TCP session patterns to non-standard ports; Go binary heuristics in EDR.
    ch_eu_nexus: "Global RaaS — manufacturing and IT services sectors affected, both present in Switzerland and EU."
