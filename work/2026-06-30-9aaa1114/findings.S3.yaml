  - title: "Turla STOCKSTAY: new .NET backdoor targets Ukrainian government/defence — phishing via malicious RDP files, Kazuar code overlap, Render-hosted WSS C2"
    sources:
      - url: "https://cloud.google.com/blog/topics/threat-intelligence/stockstay-turla-intelligence-gathering"
        publisher: "Google Threat Intelligence (GTIG / Mandiant)"
        date: "2026-06-25"
        role: "primary"
      - url: "https://therecord.media/russia-turla-espionage-ukraine-stockstay-malware"
        publisher: "The Record (Recorded Future News)"
        date: "2026-06-26"
        role: "corroborating"
    discovery_trace: "first seen at: WebSearch ('Turla StockStay Ukraine June 2026') → primary: Google Threat Intelligence blog URL https://cloud.google.com/blog/topics/threat-intelligence/stockstay-turla-intelligence-gathering → corroborating: The Record URL https://therecord.media/russia-turla-espionage-ukraine-stockstay-malware"
    summary: |
      Google Threat Intelligence Group (GTIG) documented STOCKSTAY, a multi-component .NET backdoor attributed to Turla (UAC-0194 / Secret Blizzard / FSB Center 16), continuously developed since at least December 2022. The implant has three components communicating via Windows WM_COPYDATA IPC: STOCKSTAY.STOCKBROKER (proxy-aware WebSocket tunneler), STOCKSTAY.STOCKMARKET (C2 orchestrator with AES-encrypted config), and STOCKSTAY.STOCKTRADER (backdoor supporting file/registry/process/recon operations). The malware shares significant code with Turla's KAZUAR toolkit, including K1MORPHER string obfuscation (Squirrel3 pseudo-random algorithm) and multi-component architecture. C2 communicates over secure WebSocket (wss://) to attacker-controlled servers hosted on the Render platform or compromised infrastructure — blending with legitimate cloud traffic. Initial access occurs via phishing emails with malicious RDP configuration files (.rdp attachments) establishing connections to attacker-controlled RDP infrastructure (T1021.001). Persistence via Windows registry run keys (T1547.001). Confirmed targets include Ukrainian government and military organizations; early samples found in Italy, Netherlands, Poland, and Germany indicate European reconnaissance. The threat actor uses environmental keying (hostname/domain-based decryption) for targeted deployments, complicating sandbox analysis. MITRE ATT&CK: T1574.014 (AppDomainManager Injection, noted for loader path), T1021.001 (Remote Desktop Protocol), T1573 (Encrypted Channel), T1547.001 (Boot/Logon Autostart). Detection: monitor for unexpected .rdp file execution, RDP connections to non-corporate IPs, WebSocket wss:// beaconing to Render.com or similar cloud PaaS from workstations, IPC anomalies via WM_COPYDATA from unsigned processes.
    ch_eu_nexus: "Samples found in Italy, Netherlands, Poland, and Germany — European government targeting confirmed. Relevant to Swiss federal government threat model."
    public_sector_nexus: "direct — government and defence organizations are primary confirmed targets"
    sector: "government, defence"
