  - title: "CVE-2026-8037 — Progress Kemp LoadMaster pre-auth RCE via uninitialized malloc in /accessv2 API endpoint, CVSS 9.8, patch available"
    sources:
      - url: "https://labs.watchtowr.com/enterprise-tech-in-shell-out-progress-kemp-loadmaster-uninitialized-heap-to-pre-auth-rce-cve-2026-8037/"
