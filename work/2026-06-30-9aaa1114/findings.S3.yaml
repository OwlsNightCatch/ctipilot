    discovery_trace: "first seen at: hackernews feed https://feeds.feedburner.com/TheHackersNews → THN article https://thehackernews.com/2026/06/microsoft-removes-119-edge-extensions.html → primary: Microsoft Edge Security blog URL https://microsoftedge.github.io/edgevr/posts/Inside-StegoAd-How-We-Disrupted-a-Massive-Malicious-Extension-Campaign/"
    summary: |
      Microsoft's Edge security team documented and disrupted StegoAd, a campaign involving 119 malicious extensions across 90+ developer accounts with combined 2.6 million installs. The extensions masked as ad blockers, VPNs, translators, and video downloaders. The core technique hides executable payloads after the IEND marker in PNG icon files (later evolved to WebP images and WOFF2 font files) — content that passes standard scanner analysis. Extensions remain dormant for 3-5 days post-installation, detect DevTools activity, and perform server-side validation to evade sandbox analysis. Payloads delivered: credential theft targeting Google and WordPress accounts, cookie collection, affiliate commission hijacking (Amazon/eBay/AliExpress), ad fraud, and a remote-code-execution backdoor. C2 infrastructure: 10+ domains with automatic failover, Cloudflare Workers proxying, and Google Analytics properties used as covert telemetry channels. Campaign active since at least 2021. Microsoft identified overlaps with Chinese-linked DarkSpectre operation previously connected to ShadyPanda and GhostPoster browser extension campaigns. Detection: hunt for extensions with multi-day activation delays; inspect extension resources for data after IEND in PNGs or at unusual WOFF2 offsets; monitor Chrome/Edge extension storage for dynamic script loading; track outbound requests from browser processes to Cloudflare Workers domains that don't match installed extension manifest origins.
    ch_eu_nexus: "Global campaign; affects Swiss users on Edge. DarkSpectre China-nexus relevant to EU cyber threat context."
    public_sector_nexus: "indirect — credential theft targets any Google/WordPress-authenticated user including government staff"
