  - title: "Malicious Perplexity AI Chrome extension intercepts address-bar keystrokes via chrome.settings suggest_url override, routed through attacker server"
    sources:
      - url: "https://www.microsoft.com/en-us/security/blog/2026/06/29/chromium-extension-uses-airelated-branding-redirect-browser-search/"
        publisher: "Microsoft Security Blog"
        date: "2026-06-29"
        role: "primary"
      - url: "https://thehackernews.com/2026/06/malicious-perplexity-chrome-extension.html"
        publisher: "The Hacker News"
        date: "2026-06-30"
        role: "corroborating"
    discovery_trace: "first seen at: hackernews feed https://feeds.feedburner.com/TheHackersNews → THN article https://thehackernews.com/2026/06/malicious-perplexity-chrome-extension.html → primary: Microsoft Security Blog URL https://www.microsoft.com/en-us/security/blog/2026/06/29/chromium-extension-uses-airelated-branding-redirect-browser-search/"
    summary: |
      Microsoft Defender researchers identified a malicious Chrome extension 'Search for perplexity ai' (ID: flkebkiofojicogddingbdmcmkpbplcd) that abused Chrome's settings override API (chrome.settings.search.defaultSearch and the suggest_url parameter) to intercept every character typed into the browser address bar in real time. The extension used declarativeNetRequest rules to implement a two-hop redirect chain: first hop exfiltrates query + live autocomplete keystrokes to attacker infrastructure at perplexity-ai[.]online (operator infra: oda[.]digital), second hop delivers legitimate search results. Server-side Node.js logged full HTTP headers, user-agent, and source IP. Google removed the extension from the Chrome Web Store following Microsoft's responsible disclosure. The extension is part of a broader AI-brand-impersonation trend Microsoft is tracking (see also prior StegoAd/DarkSpectre reporting). Detection: Chromium policy monitoring for unexpected changes to DefaultSearchProviderSuggestURL; enterprise extension allowlist enforcement (Group Policy / Intune); EDR alert on unexpected browser extension installation for users with access to sensitive systems.
    ch_eu_nexus: "Affects any Chrome/Chromium user including Swiss public-sector staff. AI-brand impersonation technique scalable to other popular AI tools used in European organizations."
