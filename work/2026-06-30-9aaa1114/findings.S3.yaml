  - title: "CVE-2026-55200 — libssh2 pre-auth heap write via unchecked packet_length in ssh2_transport_read(), CVSS 9.2, public PoC, no fixed release tagged yet"
    sources:
      - url: "https://www.vulncheck.com/advisories/libssh2-out-of-bounds-write-via-unchecked-packet-length-in-transport-c"
        publisher: "VulnCheck"
