  - title: "CVE-2026-43503 DirtyClone — Linux kernel local privilege escalation to root via SKBFL_SHARED_FRAG flag drop in __pskb_copy_fclone(), public PoC on Debian/Fedora"
    sources:
      - url: "https://thehackernews.com/2026/06/new-dirtyclone-linux-kernel-flaw-lets.html"
        publisher: "The Hacker News"
        date: "2026-06-29"
        role: "primary"
      - url: "https://research.jfrog.com/post/dissecting-and-exploiting-linux-lpe-variant-dirtyclone-cve-2026-43503/"
        publisher: "JFrog Security Research"
        date: "2026-06-25"
        role: "primary"
    discovery_trace: "first seen at: hackernews feed https://feeds.feedburner.com/TheHackersNews → THN article https://thehackernews.com/2026/06/new-dirtyclone-linux-kernel-flaw-lets.html, which references JFrog primary URL https://research.jfrog.com/post/dissecting-and-exploiting-linux-lpe-variant-dirtyclone-cve-2026-43503/"
    summary: |
      CVE-2026-43503 (CVSS 8.8, DirtyFrag family variant 4) is a local privilege escalation to root in the Linux kernel's network packet cloning path. The __pskb_copy_fclone() function drops the SKBFL_SHARED_FRAG safety flag that marks memory as file-backed during packet cloning. An attacker with CAP_NET_ADMIN (obtainable via unprivileged user namespaces on Debian/Fedora by default without host privileges) loads a privileged binary (e.g. /usr/bin/su) and wires its memory pages into a cloned packet; routing through an attacker-controlled IPsec tunnel triggers in-place decryption that overwrites login checks in the kernel-mapped file pages, granting root without touching disk. The exploit leaves no file-system trace. Affected distributions: Debian (vulnerable by default — unprivileged namespaces enabled), Fedora (same), Ubuntu 24.04+ (partially mitigated via AppArmor namespace restrictions, still listed affected). JFrog confirmed a working exploit. Patch in mainline since May 21 (Linux v7.1-rc5, commit 48f6a5356a33); distribution backports rolling out. Mitigations: kernel.unprivileged_userns_clone=0 on Debian/Ubuntu; blacklist esp4, esp6, rxrpc kernel modules to remove IPsec in-place decryption primitives. Detection: audit namespace creation events (CAP_NET_ADMIN grants in user namespaces); EDR process-lineage alerts for su/sudo spawned from non-privileged parent without TTY.
    ch_eu_nexus: "Debian and Ubuntu are widely used in Swiss federal IT server fleets. Local privilege escalation without disk trace is relevant to insider threat and post-exploitation scenarios."
    public_sector_nexus: "indirect — Linux server infrastructure in government and public-sector environments"
    sector: "cross-sector, government, enterprise"
    cves: [CVE-2026-43503]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "The vulnerability exploits missing safety flags during network packet cloning in the `__pskb_copy_fclone()` function. When the kernel copies packets internally, two helper functions fail to preserve the `SKBFL_SHARED_FRAG` flag that marks memory as file-backed."
        attribution: "The Hacker News (citing JFrog Security Research)"
        source_url: "https://thehackernews.com/2026/06/new-dirtyclone-linux-kernel-flaw-lets.html"
      - quote: "JFrog Security confirmed a working exploit on Debian, Ubuntu, and Fedora."
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/06/new-dirtyclone-linux-kernel-flaw-lets.html"

