    discovery_trace: "first seen at: risky-biz-news, feed https://news.risky.biz/rss/ → pivot: Europol press release URL https://www.europol.europa.eu/media-press/newsroom/news/global-cyber-strike-disrupts-socgholish-amadey-and-stealc-malware-networks → pivot: Microsoft Security Blog primary URL https://www.microsoft.com/en-us/security/blog/2026/06/24/stealc-and-amadey-breaking-down-infostealers-and-the-cybercrime-services-that-deliver-them/ → WebSearch corroboration"
    summary: |
      Operation Endgame's second phase (conducted June 15-19, 2026, announced June 24) disrupted three major MaaS operations: Amadey (botnet loader active since 2018), StealC (C++ infostealer), and SocGholish (fake-browser-update initial access network linked to Evil Corp affiliates). Seven law enforcement agencies (Europol, Canada, Denmark, Germany, Netherlands, UK, US) coordinated with private partners including Microsoft, ESET, IBM X-Force, Proofpoint, Bitdefender, and Shadowserver. Results: 326 servers seized, 142 domains taken down, EUR 41 million in criminal crypto assets frozen, 27 million stolen credentials recovered. StealC harvests credentials, cookies, and session tokens from Chromium/Firefox browsers (using process injection to defeat App-Bound Encryption), email clients (Outlook, Foxmail), crypto wallets, WinSCP, and Steam. Amadey establishes persistence via scheduled tasks, communicates via RC4-encrypted HTTP POST, and drops StealC as secondary payload. Microsoft's DCU used AI-assisted analysis (Copilot) to identify hardcoded C2 servers; over 200 C2 domains were disrupted. The Amadey-to-StealC pipeline fed into ransomware groups (including Storm-2697/The Gentlemen) and state-sponsored actors (Secret Blizzard previously used StealC). Detection: scheduled task creation from unusual parent processes (Sysmon EID 4698); RC4-encrypted HTTP POST to non-standard ports; browser process injection artefacts; network telemetry for C2 beacon patterns.
    ch_eu_nexus: "Europol-coordinated operation; European law enforcement agencies central. StealC/Amadey credentials fed criminal markets servicing EU-based ransomware campaigns."
