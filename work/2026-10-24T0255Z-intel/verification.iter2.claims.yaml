- {claim_id: d91da44868, verdict: ok, source_url: "https://www.wordfence.com/blog/2026/10/psa-upcoming-critical-php-security-release/", passage: "go to Tools > Site Health, open the Info tab, and expand the Server section. The PHP version ... is listed there."}
- {claim_id: bc3f880b59, verdict: ok, source_url: "https://www.inside-it.ch/php-angriffe-schweiz-blieb-bis-anhin-verschont-20261022", passage: "Wer eine Kompromittierung nicht ausschliessen kann, sollte laut AWS die Untersuchung mindestens ab dem 17. Oktober ansetzen."}
