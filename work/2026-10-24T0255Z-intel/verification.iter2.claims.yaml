claims:
- {claim_id: 5893f0685c, verdict: ok, source_url: "https://nodejs.org/en/blog/vulnerability/october-2026-security-releases", passage: "Headline restates the advisory and Imperva; consistent with body"}
- {claim_id: c559576f02, verdict: ok, source_url: "https://www.imperva.com/blog/node2shell-from-brotli-data-to-remote-code-execution/", passage: "Our standalone proof of concept ran code carried in a Brotli response or request body inside applications using the official Node.js 24.22.0 Linux arm64 image."}
- {claim_id: 164f373b11, verdict: ok, source_url: "https://nodejs.org/en/blog/release/v24.22.1/", passage: "Fixes 22.23.4/24.22.1/26.12.1; PyPI Brotli>=1.2.1 brotlicffi>=1.2.1.0 per OSM; container-bundled Node per Imperva"}
- {claim_id: 100c14e1a0, verdict: ok, source_url: "https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-108169", passage: "baseScore 9.2, baseScoreVersion 4.0, AV:N/PR:N/UI:N; Google Brotli 1.0.3 through 1.2.0; fix 1.0.10 or 1.1.1 or 1.2.1"}
- {claim_id: 13c835c243, verdict: ok, source_url: "https://nodejs.org/en/blog/vulnerability/october-2026-security-releases", passage: "An invalid block switch was reported as a temporary need for more input instead of a permanent format error ... appending input bytes to an eight-byte internal buffer."}
- {claim_id: fad64aa6af, verdict: ok, source_url: "https://nodejs.org/en/blog/vulnerability/october-2026-security-releases", passage: "An attacker who can supply Brotli data that an application decompresses with node:zlib can corrupt process memory, which can lead to a crash, disclosure of process memory, or remote code execution."}
- {claim_id: c8aa9e7957, verdict: ok, source_url: "https://nodejs.org/en/blog/vulnerability/october-2026-security-releases", passage: "Node.js Brotli decoder out-of-bounds write permits remote code execution (CVE-2026-111497) - (high)"}
- {claim_id: 2c2c969c10, verdict: ok, source_url: "https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-108169", passage: "assigner Google; baseScore 9.2; CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N"}
- {claim_id: 106e27d459, verdict: ok, source_url: "https://www.imperva.com/blog/node2shell-from-brotli-data-to-remote-code-execution/", passage: "Express 5.0.0-5.3.0 and body-parser 2.0.0-2.3.0 ... raw() and json(); execution took multiple attempts; 24.22.1 rejected"}
- {claim_id: 4879248df2, verdict: ok, source_url: "https://www.imperva.com/blog/node2shell-from-brotli-data-to-remote-code-execution/", passage: "A bare Node.js HTTP server does not decode incoming Brotli bodies simply by receiving them."}
- {claim_id: 1ed5ea8211, verdict: ok, source_url: "https://nodejs.org/en/blog/release/v22.23.4/", passage: "(CVE-2026-111497) deps: brotli: cherry-pick 0ed4268a4401abcb44720963 (Evgenii Kliuchnikov) - High (also v24.22.1, v26.12.1)"}
- {claim_id: 382e8b6097, verdict: ok, source_url: "https://nodejs.org/en/blog/vulnerability/october-2026-security-releases", passage: "End-of-Life versions are always affected when a security release occurs."}
- {claim_id: eba4a55247, verdict: ok, source_url: "https://github.com/google/brotli/releases/tag/v1.2.1", passage: "SECURITY CVE-2026-111497: out-of-bounds write permits remote code execution; released 21 Oct 19:27"}
- {claim_id: 40a947d98c, verdict: ok, source_url: "https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-108169", passage: "Google Brotli versions 1.0.3 through 1.2.0 ... update to 1.0.10 or 1.1.1 or 1.2.1"}
- {claim_id: b6d5bed3fa, verdict: ok, source_url: "https://opensourcemalware.com/blog/node2shell-affects-python", passage: "Brotli up to 1.2.0, 1.2.1 published 22 October; brotlicffi up to 1.2.0.2, 1.2.1.0 published 23 October; neither mentions the vulnerability in release notes"}
- {claim_id: 158e2ccee3, verdict: ok, source_url: "https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-108169", passage: "PYSEC-2026-4323/4322 datePublished Oct 23 2026, references include opensourcemalware.com/blog/node2shell-affects-python"}
- {claim_id: 4e2f285bac, verdict: ok, source_url: "https://www.imperva.com/blog/node2shell-from-brotli-data-to-remote-code-execution/", passage: "a package inventory can miss an older runtime bundled in a container"}
- {claim_id: 6e4133d643, verdict: ok, source_url: "https://www.imperva.com/blog/node2shell-from-brotli-data-to-remote-code-execution/", passage: "Unexpected process exits during decompression and decoder errors may help prioritize investigation. Neither is a reliable stand-alone sign of exploitation"}
- {claim_id: 03302df1a4, verdict: ok, source_url: "https://www.imperva.com/blog/node2shell-from-brotli-data-to-remote-code-execution/", passage: "Where practical, temporarily limit untrusted Brotli traffic on affected paths while updates roll out. Test changes against the application's normal traffic."}
- {claim_id: 0f9133b799, verdict: ok, source_url: "https://www.imperva.com/blog/node2shell-from-brotli-data-to-remote-code-execution/", passage: "No exploitation statement in Node.js advisory, Imperva (a PoC demo), OSM, ENISA (no exploited flag)"}
- {claim_id: 7c15dbd6df, verdict: ok, source_url: "https://opensourcemalware.com/blog/node2shell-affects-python", passage: "Who is exposed on the Python side ... any Python service that fetches from servers it does not control; Imperva for fetch()/Express/body-parser"}
- {claim_id: e9dae0804e, verdict: ok, source_url: "https://www.imperva.com/blog/node2shell-from-brotli-data-to-remote-code-execution/", passage: "Derived detection guidance; Imperva: unexpected process exits during decompression and decoder errors may help prioritize investigation"}
- {claim_id: ddbff9b567, verdict: ok, source_url: "https://unit42.paloaltonetworks.com/cve-2026-109618-cve-2026-109619/", passage: "In one case, the attackers targeted a government entity in Europe and within two hours of the initial exploitation... (no flaw named); VulnCheck 8.4.10-8.4.26, 8.5.10-8.5.11 mod_php"}
- {claim_id: ecd645e617, verdict: ok, source_url: "https://www.bacs.admin.ch/de/warnung-php-de", passage: "Starten Sie nach dem Update die betroffenen PHP-Dienste ... neu. Container muessen ... neu gebaut; Linux backports keep PHP version unchanged"}
- {claim_id: 3dcdf4e309, verdict: ok, source_url: "https://www.php.net/archive/2026.php#2026-10-23-1", passage: "We suggest you set session.upload_progress.enabled=0 until the next regular bugfix release ... Session upload progress must also still be enabled."}
- {claim_id: 8e69156052, verdict: ok, source_url: "https://www.php.net/archive/2026.php#2026-10-21-5", passage: "PHP 8.5.12, 8.4.27, 8.3.36 and 8.2.35 fix two critical vulnerabilities ... All PHP users are strongly encouraged to update immediately."}
- {claim_id: 4e8cfc4fcd, verdict: ok, source_url: "https://cert.europa.eu/publications/security-advisories/2026-018/", passage: "released the fixes today, 21 October 2026 at 13:30 UTC; ENISA 13:40 UTC; Sansec 14:00; PHP 10-20 notice scheduled 14:00 UTC"}
- {claim_id: 66ae9cbe01, verdict: ok, source_url: "https://github.com/php/php-src/security/advisories/GHSA-w8hw-w9fx-j79w", passage: "PHP uses longjmp() for OOM errors ... request memory in an invalid state. The request shutdown procedure may then read or branch on it."}
- {claim_id: 35f3424034, verdict: ok, source_url: "https://github.com/php/php-src/security/advisories/GHSA-6wmf-4rv5-p3rp", passage: "request-owned internal state can survive after its backing memory has been freed. A later request handled by the same worker may use that stale state (php.net advisory)"}
- {claim_id: ead4c57df5, verdict: ok, source_url: "https://www.php.net/archive/2026.php#2026-10-21-5", passage: "We consider the risk highest for mod_php, with a demonstrated exploit where an unauthenticated request can trigger the attack before any application code runs."}
- {claim_id: 302ee087a5, verdict: ok, source_url: "https://github.com/php/php-src/security/advisories/GHSA-6wmf-4rv5-p3rp", passage: "Session upload progress is enabled by default, and no application call to session_start() is required; Session lifecycle RCE was validated against mod_php and FPM"}
- {claim_id: 7840f1377b, verdict: ok, source_url: "https://github.com/php/php-src/security/advisories/GHSA-6wmf-4rv5-p3rp", passage: "The confirmed impact is unauthenticated heap use-after-free, memory disclosure and remote code execution with the web worker's privileges."}
- {claim_id: 9d0b645a06, verdict: ok, source_url: "https://sansec.io/research/php2shell", passage: "CVE-2026-109618 also discloses server memory on its own ... passwords, session tokens, API keys and TLS private keys from other requests"}
- {claim_id: 36d2e337ea, verdict: ok, source_url: "https://sansec.io/research/php2shell", passage: "Calif reported that an attacker without a login can run code on Magento 2.4.9, WordPress 7.1.2, Drupal 11.4.3, Joomla 6.1.4, MediaWiki ... Laravel 13.11"}
- {claim_id: 42633244b6, verdict: ok, source_url: "https://www.php.net/archive/2026.php#2026-10-21-5", passage: "PHP 8.1 and older no longer receive updates ... minimal source-backports for PHP 7.4, PHP 8.0, and PHP 8.1; distributions and LTS vendors received the patches in advance"}
- {claim_id: 4f936712bd, verdict: ok, source_url: "https://blog.cloudflare.com/php-vulnerabilities-waf-protection/", passage: "The vulnerabilities affect all web servers running PHP 5.4 or later"}
- {claim_id: 786a34f4ab, verdict: ok, source_url: "https://www.wordfence.com/blog/2026/10/psa-upcoming-critical-php-security-release/", passage: "Updating WordPress, your plugins, or your themes does not change the version of PHP your server runs."}
- {claim_id: 861b350def, verdict: ok, source_url: "https://security.paloaltonetworks.com/CVE-2026-109618", passage: "WildFire Appliance WF-500 and WF-500-B | None | All; Note: applicable to PAN-OS software on PA-Series and VM-Series firewalls and on Panorama; ETAs 10/26-10/30"}
- {claim_id: 6993357403, verdict: ok, source_url: "https://www.enisa.europa.eu/news/joint-statement-on-critical-php-vulnerabilities", passage: "We recommend checking the NCSC-NL GitHub repository for information on third-party software that includes PHP"}
