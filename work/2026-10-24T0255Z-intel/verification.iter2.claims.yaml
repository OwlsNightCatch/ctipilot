- {claim_id: e70797944d, verdict: ok, source_url: "https://watchtowr.com/intelligence/php-cve-2026-109618-faq/", passage: "Exploitation has been observed in the wild since October 21, 2026, through watchTowr's Attacker Eye global honeypot network."}
- {claim_id: 9cab696807, verdict: ok, source_url: "https://www.vulncheck.com/blog/php2shell-vulnerabilities", passage: "Timeline 08:37 probe; at least one attempted exploit ... tried to (unsuccessfully) drop a webshell via a server-side session file"}
- {claim_id: 0800c1ea3c, verdict: ok, source_url: "https://www.security.nl/posting/958424/Misbruik+van+PHP2Shell-lek+gemeld%2C+DigiD+en+andere+sites+weer+online", passage: "Hadrian spreekt van grootschalig misbruik. Patchstack meldt actieve aanvalspogingen ... Of de aa[nvallen succesvol zijn...]"}
- {claim_id: 3281daf35b, verdict: ok, source_url: "https://cert.europa.eu/publications/security-advisories/2026-018/", passage: "Technical details are now being discussed publicly, and initial proofs of concept (PoCs) have begun to circulate."}
- {claim_id: 9d4a3926f7, verdict: ok, source_url: "https://thephp.foundation/blog/2026/10/21/todays-php-security-release-and-how-were-strengthening-php-security/", passage: "did not identify any functional exploits at the time of release/public disclosure."}
- {claim_id: eca08e6891, verdict: ok, source_url: "https://www.vulncheck.com/blog/php2shell-vulnerabilities", passage: "Hundreds of proof-of-concept repos...; 7 PM ET Oct 22 ASLR bypass PoC 8.4.26; 5:30 PM ET Oct 23: 8.4.10-8.4.26, 8.5.10 and 8.5.11 AMD64/ARM64 display_errors=off mod_php; WordPress Docker"}
- {claim_id: 06773e0ef5, verdict: ok, source_url: "https://unit42.paloaltonetworks.com/cve-2026-109618-cve-2026-109619/", passage: "attackers using agentic AI attack platforms for post-exploitation ... NTLM-relay tunnel into Active Directory and attempted Domain Admin privilege escalation; no flaw named"}
- {claim_id: 594ab485e6, verdict: ok, source_url: "https://www.crowdstrike.com/en-us/blog/obstacles-to-weaponizing-php2shell-likely-constrain-exploitation/", passage: "has not observed successful exploitation of these vulnerabilities in the wild or within our honeypot environments."}
- {claim_id: a71270d065, verdict: ok, source_url: "https://www.wordfence.com/blog/2026/10/attacks-on-php2shell-continue-but-no-known-compromises-as-a-result-yet/", passage: "we have not observed any confirmed compromises resulting from these vulnerabilities"}
- {claim_id: 781c843d92, verdict: ok, source_url: "https://www.sophos.com/en-us/blog/proof-of-concept-exploit-released-for-php-vulnerabilities-109618-109619", passage: "we are correcting that assessment as Sophos customer telemetry shows scanning and a small number of failed exploitation attempts; likely Mirai botnet variant ... not delivered"}
- {claim_id: 4b7d868ed8, verdict: ok, source_url: "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json", passage: "catalogVersion 2026.10.23; no CVE-2026-109618/109619/115560 entries (grep count 0)"}
- {claim_id: 57703dc293, verdict: ok, source_url: "https://www.php.net/archive/2026.php#2026-10-23-1", passage: "set session.serialize_handler to php_binary or php_serialize ... switch it to php at runtime with ini_set() before session_start() ... regular release cycle ... full advisory with the next release"}
- {claim_id: 79547eb6a6, verdict: ok, source_url: "https://thehackernews.com/2026/10/urgent-php-warns-of-another-unpatched.html", passage: "PHP has not stated which versions are affected ... or a severity score. No exploitation of CVE-2026-115560 has been reported"}
- {claim_id: e9ef6009db, verdict: ok, source_url: "https://sansec.io/research/php2shell", passage: "Nobody has shown such a request for PHP2Shell; a researcher who tested the public PoCs found that they do not work against a default PHP installation; less likely than we first expected"}
- {claim_id: e487aa83ca, verdict: ok, source_url: "https://www.crowdstrike.com/en-us/blog/obstacles-to-weaponizing-php2shell-likely-constrain-exploitation/", passage: "unlikely to create a single universal exploit ... feasible ... against specific deployment profiles, such as a fixed Docker image ... calibrate exploit offsets and heap grooming in advance"}
- {claim_id: 5527e4b057, verdict: ok, source_url: "https://isc.sans.edu/diary/33452", passage: "building a universal, reliable, one click exploit is quite difficult"}
