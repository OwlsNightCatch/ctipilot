    entry: 2026-10-22/pan-os-panorama-php2shell-mgmt-interface-no-fixed-release
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** move management access behind a jump box or trusted internal addresses now, and remove management profiles from dataplane interfaces that face untrusted networks; Palo Alto lists no workaround beyond that restriction and the Threat Prevention coverage; its revision of 2026-10-23 schedules the first PAN-OS hotfixes for 2026-10-26 (10.2.18-h13, 11.1.16-h4 and 11.2.10-h16) and the rest by 2026-10-30, so install the hotfix of each train when it is released, while Panorama appears in the advisory only through the note that the issue applies to PAN-OS software on it, with no separate build or date, so apply the same management-access restriction to it ("
    urls: ["https://security.paloaltonetworks.com/CVE-2026-109618"]
