  # 1. PK Softech / Publica thread: IPCT (Ticino cantonal pension institute) scopes its exposure
  # ---------------------------------------------------------------------------
  - title: "PK Softech: the Ticino cantonal pension institute IPCT puts its exposure at about 1,800 persons, whose files sat on the attacked supplier server for two ongoing recalculation projects"
    sources:
      - { url: "https://www.ipct.ch/Attacco-informatico-criminale-presso-un-fornitore-di-software-dell-IPCT-Lettera-inviata-a-tutti-gli-assicurati-IPCT-b03fe500?i=1", publisher: "IPCT (Istituto di previdenza del Cantone Ticino), letter to all insured persons dated 2026-10-23", date: "2026-10-23", role: "primary" }
      - { url: "https://www.rsi.ch/info/ticino-grigioni-e-insubria/Attacco-hacker-esposti-i-dati-di-quasi-1%E2%80%99800-assicurati-dell%E2%80%99IPCT--4188533.html", publisher: "RSI (Radiotelevisione svizzera)", date: "2026-10-23", role: "corroborating" }
      - { url: "https://www.tio.ch/ticino/attualita/1958742/dati-stati-cantone-istituto-ticino-attacco-pensioni-casse-previdenza", publisher: "Ticinonline", date: "2026-10-23", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"attacco informatico Ticino comune cantone dati 2026 ottobre\") surfacing https://www.tio.ch/temi/attacco-informatico (listing, fetched with extract) -> pivot: Ticinonline article https://www.tio.ch/ticino/attualita/1958742/dati-stati-cantone-istituto-ticino-attacco-pensioni-casse-previdenza -> WebSearch (\"IPCT Istituto di previdenza del Cantone Ticino comunicato attacco informatico fornitore 1'800 persone lettera assicurati\") -> pivot: RSI https://www.rsi.ch/info/ticino-grigioni-e-insubria/Attacco-hacker-esposti-i-dati-di-quasi-1%E2%80%99800-assicurati-dell%E2%80%99IPCT--4188533.html (links the letter) -> primary: IPCT letter PDF, fetched with the pdf subcommand, URL https://www.ipct.ch/Attacco-informatico-criminale-presso-un-fornitore-di-software-dell-IPCT-Lettera-inviata-a-tutti-gli-assicurati-IPCT-b03fe500?i=1"
    summary: |
      Facts (IPCT's own letter, Bellinzona, 2026-10-23, to its roughly 17,000 active insured and 10,000 pensioners): PK Softech told
      IPCT in the late afternoon of 2026-10-14 that the authorities had established that personal data were exfiltrated from its servers
      without saying which pension funds they belonged to; IPCT's checks since then found, among the documents on the attacked
      supplier server, personal data of about 1,800 persons, held there for two ongoing projects (spot checks and recalculations).
      About 1,700 are persons who left IPCT through resignation or death in 2024-2025: surname, first name, postal address, date of
      birth, AHV number and IPCT insured number, the exit-benefit amount, the receiving pension fund and its bank account (IBAN),
      plus the personal IBAN for about 50 who were paid out directly; no e-mail address or telephone number. About 80 are insured
      persons on a disability pension whose passive pension data was being updated: name, date of birth, AHV number, insured
      number, passive insured salary, passive retirement assets, degree and start of invalidity; no contact data. IPCT says it has
      no certain evidence that these data were actually taken but that it appears plausible, that savings capital and pensions are
      untouched, that the Cantonal Administration's IT centre hosting IPCT's infrastructure was not breached, that it filed a
      criminal complaint against unknown persons and was recognised as private plaintiff, and that the Federal Prosecutor's Office
      and fedpol are investigating. The letter names PK Softech's other customers as Publica, large cantonal funds (Bern and
      Zurich cited) and company funds (Migros, Post), "hundreds of thousands" of insured persons in total. This refines the
      earlier, wider reading (laRegione/Ticinonline, 2026-10-20) that potentially all 27,000 insured could be involved: that
      remains a precaution (every insured person receives the letter), but the group found on the server is about 1,800.
      Observation (not a source claim): IPCT's data sat at the supplier because of project work, like the 2019 migration data
      at Publica and the test data at the City of Zurich fund already reported on this entry; three public funds now show live
      pension data held at the supplier outside the productive system.
