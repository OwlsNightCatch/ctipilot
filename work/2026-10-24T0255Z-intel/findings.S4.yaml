  # 2. LiteLLM: root cause published (update + correction of the earlier initial-access statement)
  # ---------------------------------------------------------------------------
  - title: "LiteLLM root cause: a master key committed to a public repository in May and never revoked gave the attacker owner-level GitHub access 11 days before the malicious 1.107.0 release"
    sources:
      - { url: "https://docs.litellm.ai/blog/security-incident-oct-21-2026-attack-chain", publisher: "LiteLLM maintainers (attack-chain post, canonical)", date: "2026-10-23", role: "primary" }
      - { url: "https://socket.dev/blog/litellm-attack-timeline", publisher: "Socket (Threat Research, Karlo Zanki)", date: "2026-10-23", role: "corroborating" }
      - { url: "https://docs.litellm.ai/blog/security-incident-oct-21-2026", publisher: "LiteLLM maintainers (incident post, updated 2026-10-23 21:50 UTC)", date: "2026-10-23", role: "primary" }
    discovery_trace: "first seen at: litellm incident post https://docs.litellm.ai/blog/security-incident-oct-21-2026 (re-fetched as an open-thread check; extract) -> primary: attack-chain post https://docs.litellm.ai/blog/security-incident-oct-21-2026-attack-chain -> corroborating: Socket https://socket.dev/blog/litellm-attack-timeline (extract returned a stub, full text read with WebFetch)"
    summary: |
      Facts (LiteLLM's canonical post of 2026-10-23, which says earlier status updates contained assumptions later proven
      inaccurate or incomplete): on 2026-05-27 a configuration file with the master key of an experimental internal service, the
      LiteLLM Agent Platform, was committed to the public LiteLLM-Labs/lite-harness repository; the commit was force-pushed over
      but the key was never revoked. On 2026-10-10 the attacker used it to call the platform API, whose agent listing returned the
      GitHub CLI OAuth token of a GitHub organization owner (not a service account, not scoped down; CLI tokens are post-2FA and
      skip the super-user re-authentication for sensitive actions). With it the attacker pushed throwaway branches into
      BerriAI/litellm and BerriAI/litellm-auto whose workflows posted the repositories' CI secrets to a public webhook-capture
      endpoint, yielding the GitHub CLI tokens of two maintainers, and deleted those workflow runs. On 2026-10-21 the owner token
      disabled branch protection on the private release-orchestration repository to point the build at a look-alike organisation's
      fork; a release rule relaxed earlier that week let any two engineers trigger and approve a release, and the post's table shows
      the owner token dispatching the staging build and a second maintainer's stolen token approving the production gate; a third
      maintainer's token deleted the run records and the owner token force-pushed the history clean. The wheels went live 11:39 UTC; PyPI quarantined them by 13:23. This corrects the earlier statement on
      this entry that the tokens were probably read from the logs of an internet-exposed internal LiteLLM deployment, with a
      recently patched vulnerability suspected: LiteLLM now says the first token came from a different service. Socket,
      independently, found the 2026-10-10 secret-exfiltration workflow run in BerriAI/litellm eleven days before the release
      attack (six organisation secrets incl. a GitHub token, GitHub App key and AI-provider keys), says it has not itself
      established initial access and does not claim the link to the release approval; LiteLLM says its audit records tie that
      token to the approval. Assessment-free: no actor is named by either source. Dwell time from first misuse to release: 11 days.
    region_nexus: "global; any Swiss public-sector or supplier team that pulled litellm 1.107.0 or the affected image tags"
    primary_sector_nexus: "indirect"
    sector: "technology"
    cves: []
    techniques: [T1552.001, T1078.004, T1528, T1195.002, T1070]
    affected_products: ["LiteLLM"]
    entity_keys: ["product:litellm", "product:berriai-litellm"]
    new_entities:
      - { key: "incident:litellm-release-pipeline-compromise-2026-10", type: incident, name: "LiteLLM 1.107.0 release pipeline compromise (October 2026)", aliases: ["LiteLLM v1.107.0 compromise"], summary: "Malicious litellm 1.107.0 published to PyPI and container registries on 2026-10-21 through a hijacked release pipeline; LiteLLM's 2026-10-23 root-cause post traces it to a master key committed to a public repository on 2026-05-27 and never revoked, used from 2026-10-10 (LiteLLM, 2026-10-23)." }
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "update-of:2026-10-22/litellm-1-107-0-pypi-docker-credential-stealer-lookalike"
    suggested_classification: { reliability: A, credibility: 1 }
    suggested_changelog_type: "update (new root-cause facts) that also corrects the body's initial-access paragraph; fields likely: title, headline, summary, techniques, sources, evidence, actions, body"
    evidence:
      - quote: "However, key revocation did not occur for the master key."
        attribution: "LiteLLM maintainers"
        source_url: "https://docs.litellm.ai/blog/security-incident-oct-21-2026-attack-chain"
      - quote: "On October 10th, the threat actor used this key to gain access to our LiteLLM Agent Platform and extracted this GitHub CLI OAuth token."
        attribution: "LiteLLM maintainers"
        source_url: "https://docs.litellm.ai/blog/security-incident-oct-21-2026-attack-chain"
      - quote: "Our first post suspected the tokens were taken from the logs of an internal LiteLLM deployment."
        attribution: "LiteLLM maintainers"
        source_url: "https://docs.litellm.ai/blog/security-incident-oct-21-2026-attack-chain"
      - quote: "eleven days before the release-pipeline attack that published malicious"
        attribution: "Socket"
        source_url: "https://socket.dev/blog/litellm-attack-timeline"
    extended_notes: |
      Detection hooks (telemetry class first): GitHub organization audit log for protected-branch policy overrides and
      force-push-block overrides by an owner token, workflow runs on short-lived ci-tmp-style branches that make outbound POSTs
      to a public webhook-capture host, and deleted workflow runs; CI egress logs for that host class; release-approval events
      where the approver is an ordinary engineer rather than the hardware-bound release account. Hardening lever named by the
      maintainers: a leaked key must be revoked, not just force-pushed out of history; agent platforms should hold scoped
      service-account tokens, never an organisation owner's CLI token; the hardware-bound release approver restriction was
      relaxed the same week and would not have stopped an owner token anyway. No IOCs carried (source lists IPs, branch names,
      commit ids: deliberately omitted).

