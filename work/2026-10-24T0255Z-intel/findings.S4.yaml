    extended_notes: |
      Exposure: public pension institutions and employers using PK Softech's pension software; IPCT's own checks are "partial" and
      "continuously evolving", so other funds' counts can still move (the letter says IPCT may never get certainty).
      Defender takeaway candidates (only what the letter supports): the exposure came from copies of live data held at the
      supplier for projects, not from the productive system, so the do-now check for any public body with this supplier or a
      similar one is an inventory of which personal data sit at the supplier outside production (migration, test, recalculation
      files) and written deletion evidence; the fraud lever is that exit-benefit and IBAN data enable payment-diversion calls.
      PK Softech page itself shows no newer statement than 2026-10-08 (fetched); Publica's page (Stand 2026-10-22) only adds
      that its website outage of 2026-10-21 was PHP-related and unrelated to the incident.

