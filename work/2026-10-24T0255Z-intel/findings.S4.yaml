  # 3. Railway: new incident (preliminary report)
  # ---------------------------------------------------------------------------
  - title: "Railway: attackers escalated privileges in the build infrastructure, reached CI credentials and decrypted environment variables of up to 1.85% of workspaces (about 100,000) while hunting AI-provider API keys"
    sources:
      - { url: "https://blog.railway.com/p/preliminary-report-october-security-incident", publisher: "Railway (preliminary report)", date: "2026-10-22", role: "primary" }
      - { url: "https://blog.railway.com/p/security-disclosure-wednesday-october-21st", publisher: "Railway (security disclosure)", date: "2026-10-21", role: "primary" }
      - { url: "https://status.railway.com/incident/QH8L8B3E", publisher: "Railway Status (incident, update of 2026-10-23 18:57 UTC)", date: "2026-10-23", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/railway-warns-devs-to-rotate-secrets-after-potential-breach/", publisher: "BleepingComputer", date: "2026-10-22", role: "corroborating" }
    discovery_trace: "first seen at: bleepingcomputer, URL https://www.bleepingcomputer.com/news/security/railway-warns-devs-to-rotate-secrets-after-potential-breach/ (feed https://www.bleepingcomputer.com/feed/ 15) -> primary: Railway disclosure https://blog.railway.com/p/security-disclosure-wednesday-october-21st -> status page https://status.railway.com/incident/QH8L8B3E (links the preliminary report) -> primary: https://blog.railway.com/p/preliminary-report-october-security-incident"
    summary: |
      Facts (Railway, the victim, first-hand): Railway says an attacker ran a sustained, targeted campaign against it from
      2026-10-20 13:58 UTC until Railway confirmed at 2026-10-22 03:32 UTC that access was gone. It began as an attempted privilege
      escalation in the build infrastructure (noticed through a latency alarm); Railway halted builds, then saw the attacker pull
      secrets in encrypted form, and at 05:27-07:25 UTC on 2026-10-21 reach credentials for the CI environment where it decrypted
      artifacts holding further API access, after which a database query showed an unauthorized read of encrypted environment
      variables, a subset of which were decrypted; payload logs showed the specific API key names the attacker searched for.
      Railway asked vendors at 09:25 UTC on 2026-10-21 to revoke keys (it named GitHub, GitLab, Anthropic, OpenAI, OpenRouter,
      Stripe and Google among the recipients) and gave some vendors every key it stored. At most 1.85% of workspaces (about 100,000)
      had some variables potentially compromised; Railway says user accounts were not accessed, does not rule out source-code
      access, and says it had completed notifications to higher-risk workspaces by 2026-10-23 18:57 UTC while recommending that
      every customer who signed up before 2026-10-21 rotate keys stored on Railway. Running services stayed online; builds and
      deployments were paused; redeploying pre-incident code can fail and GitHub integrations may need reconnecting.
      Claims and inferences, all Railway's own and unconfirmed by anyone else: the intent was to obtain AI-provider API keys for
      distillation attacks, the incident is "part of a series of attacks recently targeting platform companies with the aim of
      compromising AI inference providers", and the actor had access to "abliterated models and substantial compute". Railway has
      not published the exploit, the attacker or the scale of exploits. Context in this store: the LiteLLM 1.107.0 compromise
      (attacker focus on upstream inference API tokens per LiteLLM) and, per BleepingComputer on 2026-10-19, the OpenCode Console
      breach of 2026-10-17 are the same class of target; no source ties the three to one actor.
