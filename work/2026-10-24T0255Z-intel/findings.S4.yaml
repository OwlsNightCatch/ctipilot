  # 4. eMudhra: exits the global SSL/TLS certificate business (update)
  # ---------------------------------------------------------------------------
  - title: "eMudhra withdraws from the global SSL/TLS certificate business after its eight recoverable CA keys, keeping the G1 RSA roots and revocation services running until the transition ends"
    sources:
      - { url: "https://www.bseindia.com/xml-data/corpfiling/AttachLive/82503e00-335c-49dc-b022-f4633a08b642.pdf", publisher: "eMudhra Limited (press release filed with BSE/NSE, 2026-10-22)", date: "2026-10-22", role: "primary" }
      - { url: "https://next.ink/263432/apres-ses-cles-passoires-emudhra-met-la-cle-sous-la-porte-des-certificats/", publisher: "Next (next.ink)", date: "2026-10-23", role: "corroborating" }
    discovery_trace: "first seen at: next-ink feed https://next.ink/feed (30 items), URL https://next.ink/263432/apres-ses-cles-passoires-emudhra-met-la-cle-sous-la-porte-des-certificats/ -> primary: eMudhra press release filed with BSE, URL https://www.bseindia.com/xml-data/corpfiling/AttachLive/82503e00-335c-49dc-b022-f4633a08b642.pdf (fetched with the pdf subcommand)"
    summary: |
      Facts (eMudhra's own press release, filed with the Indian exchanges on 2026-10-22): the board decided to voluntarily
      withdraw from the global SSL/TLS certificate business. The company repeats that it revoked the affected CAs within 14 hours
      of discovery, that no end-entity certificates were issued from them, that its infrastructure was not compromised, and says
      TLS is about 1% of its global revenue; it names cost and complexity, free competitors and the "social media amplification"
      of the incident as reasons. Transition: the G1 RSA roots keep serving customers until the transition is complete,
      eMudhra will contact affected customers and replace any certificate free of charge through partners, revocation and
      status services keep running until every issued certificate has expired or been replaced, and a full root-cause report to
      the browser root programs is still owed. Its signing, DSC, enterprise PKI and identity products are stated as unaffected.
      Delta to the entry: the CA is leaving the market, so the open item for anyone holding an eMudhra TLS certificate is a
      replacement and an eventual root removal, not just the distrust update already described; the root-cause report is not yet
      public.
