    summary: |
      Facts (TeamUpdraft's own notice): its 2026-10-21 update says the attacker used a compromised key to access teamupdraft.com,
      that there is no evidence the attacker still has access, and that the speed of the exploits after the breach together with
      the initially faulty backdoor plugins suggests the attackers used AI to accelerate the attack (the vendor's inference, no
      evidence given). Its 2026-10-22 update asks users to check the sites listed in their UpdraftCentral account for any site they
      did not knowingly connect since 2026-10-19 and says it is seeing a pattern of unexpected Editor roles, and its 2026-10-21 note
      stresses that premium UpdraftPlus users should check for unusual activity even if they never used UpdraftCentral. Nethemba
      adds that on the morning of 2026-10-21 the attacker again sent UpdraftCentral commands to two of its sites after 1.26.13 had
      shipped (blocked there only because the keys had been deleted), so stolen keys that a site has not deleted keep working. None
      of this changes the entry's remediation; the new facts are the vendor's stated entry vector and the continued attacker
      activity after the vendor's fix.
