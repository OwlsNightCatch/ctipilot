  - title: "ARTEX in the wild: Wiz sees an ARTEX-using actor overlapping Storm-0940 hit identity providers (Okta, Entra, Cognito) and software vendors, and publishes the log signatures that mark an agentic attacker"
    sources:
      - { url: "https://www.wiz.io/blog/artex-in-the-wild-storm-0940-expands-targeting-of-it-and-software-vendors", publisher: "Wiz Research", date: "2026-10-22", role: "primary" }
    discovery_trace: "first seen at: pivot sweep of the Wiz blog listing, URL https://www.wiz.io/blog (extract; the listing's featured card) -> primary (no pivot needed): https://www.wiz.io/blog/artex-in-the-wild-storm-0940-expands-targeting-of-it-and-software-vendors; the covered entry already cites Microsoft, Expel, CrowdStrike and Recorded Future"
    summary: |
      Wiz Research (2026-10-22) says that throughout October 2026 it tracked an actor using ARTEX-associated tooling, overlapping with Storm-0940, against multiple IT and software vendors, focusing on identity providers (Okta, Entra, Cognito) and Microsoft 365 integrations, and that the same infrastructure and patterns also targeted the sector as a whole and expanded into other software sectors. Wiz describes a consistent sequence: downloading JavaScript bundles, exposed source maps, runtime configuration and Swagger or OpenAPI documents to find internal API routes, then calling those routes by name minutes later; repeated sign-in and account-recovery requests (password-reset token generation, forgot-password, Cognito InitiateAuth, ForgotPassword, ResendConfirmationCode and SignUp calls); manipulated Microsoft OAuth callbacks with fabricated codes and malformed state; unsigned (alg none) JWT probes against more than 60 SSO route variants in two minutes; self-registration with disposable mailboxes followed by attempts to read another tenant's data; and password-spray bursts against Entra and Okta that targeted hundreds of users, mainly software engineers, with a unique user agent per burst, a median one-second gap between attempts, bursts of 20 to 60 minutes and more than 15 user-agent strings overall, rotating IP addresses within minutes of a block. Wiz says most attempts failed and that none of the techniques is novel, but that the chaining and adaptation show an autonomous agent. The covered entry carries the Microsoft and Expel observations; Wiz adds an independent telemetry holder for the Storm-0940 overlap and these per-burst log signatures.
    region_nexus: "global; software vendors and identity-provider tenants; no Swiss victim named"
    primary_sector_nexus: "indirect (SaaS and identity tenants used by public-sector organizations and their software suppliers)"
    sector: "technology"
    cves: []
    techniques: [T1190, T1110.003, T1595.002]
    affected_products: ["Okta", "Microsoft Entra ID", "Amazon Cognito"]
    entity_keys: ["tool:artex", "actor:storm-0940"]
    new_entities: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: "update-of:2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse"
    borderline: true
    borderline_reason: "published 2026-10-22 (outside the 26 h window, inside the 72 h developing window); an independent telemetry holder and detection signatures for an entry already covered, no change in priority and no new defender action beyond the covered Detection line"
    classification_hint: "B2 (Wiz first-hand telemetry; the Storm-0940 link is Wiz's own overlap assessment, 'overlapping with')"
    evidence:
      - quote: "Throughout October 2026, we identified an actor using tooling associated with ARTEX, an autonomous AI penetration-testing agent, to target multiple IT and software vendors."
        attribution: "Wiz Research"
        source_url: "https://www.wiz.io/blog/artex-in-the-wild-storm-0940-expands-targeting-of-it-and-software-vendors"
      - quote: "The median gap between authentication attempts was strictly one second."
        attribution: "Wiz Research"
        source_url: "https://www.wiz.io/blog/artex-in-the-wild-storm-0940-expands-targeting-of-it-and-software-vendors"
      - quote: "The agent bombarded more than 60 variations of SSO routes with this payload in just two minutes."
        attribution: "Wiz Research"
        source_url: "https://www.wiz.io/blog/artex-in-the-wild-storm-0940-expands-targeting-of-it-and-software-vendors"
    extended_notes: |
      Telemetry classes: web and application access logs (source-map and OpenAPI downloads followed minutes later by calls to internal route names that appear only in those files; unsigned-JWT SSO probes; fabricated OAuth callback parameters), identity-provider sign-in logs (Entra, Okta, Cognito: per-burst user-agent changes, one-second cadence, engineer-account focus), account-recovery and sign-up endpoints. Triage discriminator per Wiz: chained automatic steps, instant adaptation to rate limits and blocks, and illogical tests against heavily scrutinised Microsoft OAuth flows separate it from a human operator; ordinary credential-stuffing botnets lack the route-name-after-source-map sequence. Hardening named by implication: do not ship source maps and API documents to production, rate-limit and monitor recovery and sign-up flows, and shorten the exposure-to-remediation gap.
