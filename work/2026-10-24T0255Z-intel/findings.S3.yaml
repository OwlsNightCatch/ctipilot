    summary: |
      The LiteLLM maintainers published their root-cause post on 2026-10-23 (about 21:00 UTC) and call it the canonical account, saying that some assumptions in their earlier status updates proved inaccurate or incomplete; the covered entry still carries the earlier hypothesis that the engineers' GitHub tokens were read from the logs of an internet-exposed internal LiteLLM deployment, and the maintainers now say the request logs show the first token came from a different service. Per the maintainers, a configuration file committed on 2026-05-27 to the public LiteLLM-Labs/lite-harness repository contained the master key of a LiteLLM Agent Platform deployment, an experimental self-hosted cloud-agent service; the commit was force-pushed over, but the key was never revoked. On 2026-10-10 the attacker used that key against the Agent Platform API, whose managed-agents listing returned the GitHub CLI OAuth token of a GitHub organization owner (not a service account, not scoped down; such CLI tokens are post-2FA and not subject to GitHub's re-authentication for sensitive organization actions), giving owner-level access to every repository. With it the attacker pushed commits to short-lived throwaway branches named ci-tmp-<hex> in BerriAI/litellm and BerriAI/litellm-auto whose push-triggered workflows posted CI secrets to a public webhook-capture service, among them a second maintainer's token (GH_TOKEN) and a third maintainer's token (RELEASE_PLEASE_TOKEN), and deleted the workflow runs about three minutes later. Socket independently reconstructed the same activity from Actions performance metrics and environment deployment records: a one-job workflow on 2026-10-10 and a six-job workflow on 2026-10-12 that reached environment-scoped secrets (databases, Redis, cloud and AI-provider keys), a compromise window of at least eleven days; Socket says it has not established how the attacker first obtained access and does not claim the 2026-10-10 theft produced the access used on 2026-10-21. On 2026-10-21 the attacker changed the release workflow in the private project-releaser repository to build from the lookalike Berri-AI/litellm repository: the push was rejected with the second maintainer's token by branch protection, then forced with the owner's token by overriding protection; the production gate was approved with the second maintainer's token (the maintainers had relaxed approval earlier that week so any two engineers could trigger and approve a release), the run records were deleted with the third maintainer's token, and the change was reverted and main force-pushed back, removing it from visible history while the organization audit log recorded each override. Microsoft's separate analysis of the wheels (cook.pth, cook.py and sitecustomize.py placed in the Python library directory, so merely starting Python can run the collector) says it has not independently determined how the attacker first reached the upstream environment, and repeats that removing the package is not sufficient recovery.
