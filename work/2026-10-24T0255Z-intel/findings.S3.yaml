      Check Point Research (2026-10-23) describes Aokigahara, a newly observed Windows infostealer that an earlier version may have known as Kamidere or Stygian, and Symantec (2026-10-15), which calls it Aoki, independently reports the same family and says the AI-assistant targeting is a recent addition that older samples lacked. Beyond the usual browser, cryptocurrency-wallet, messenger, gaming, password-manager, VPN, FTP and email theft, its aisessions handler collects credential, session and configuration files of Claude Code and Desktop, Codex, ChatGPT Desktop, Cursor, Windsurf, Kiro, GitHub Copilot, Gemini CLI, Amazon Q and JetBrains AI Assistant, and an ide handler collects Git credential files, SSH private keys and AWS, Azure and Google Cloud credential and configuration files; Check Point says the monetization route is not confirmed, and that valid tokens could expose conversations and source, allow use of paid services or resale, and offer data-extortion leverage. Check Point describes an encrypted configuration blob (AES-256-CBC, key derived from a seed) holding the server address, build identifier, a module bitmask that selects which collection handlers run, optional language and analysis-environment checks, certificate pinning and up to three fallback servers; with the language check on, the malware stops when the keyboard layout or Windows UI language is one of eleven former-Soviet-region languages (Russian, Ukrainian, Belarusian, Tajik, Armenian, Azerbaijani, Georgian, Kazakh, Kyrgyz, Turkmen, Uzbek). Exfiltration is a three-step HTTP exchange (a handshake that sends an X25519 public key, one chunk upload per module as AES-GCM-encrypted ZIP archives with the module label in a header, and a completion marker) using a Windows CryptoAPI-style user agent, and the malware also drops a clipper component under C:\Microsoft\Vault. Symantec adds that it has no backdoor command list and that no threat group or link to an existing family is known. Neither report states how the stealer is delivered.
