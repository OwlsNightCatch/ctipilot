    summary: |
      SOCRadar's Threat Research Unit reports (2026-10-20) that in late September 2026 it found seven exposed adversary servers, the first an open directory holding the operators' AI session databases, a knowledge base and the source of Phantom, an "Autonomous Red Team Kill Chain Framework"; it says intrusions ran through OpenCode with OpenRouter-hosted commercial models (8,257 messages across 133 sessions), with a human approving each step, and that when models refused the operators rewrote requests as "Authorized Red Team Assessment Request" templates. Per operator records that SOCRadar says are not independently verified, initial access came from edge and remote-access systems: FortiClient EMS (CVE-2026-35616; 2,236 targets, 108 created administrator accounts, with backdoor admins planted and payloads pushed through modified VPN on-connect scripts), SimpleHelp (CVE-2024-57727; scans of 4,922 servers yielding 427 admin passwords, with stolen MSP technician credentials opening every client those technicians managed) and cPanel (CVE-2026-41940; 49+ claimed small-hosting-provider breaches used to reach hosted mail), with other gateways evaluated. Inside victim networks the recurring lifecycle was domain enumeration, escalation, credential theft, prioritised collection of finance, HR, legal and executive files over reverse-SOCKS tunnels, security-product impairment with a driver-abuse killer, and data extortion preferred over encryption with scripted vishing and 24 to 72 hour deadlines. The servers held 46 INC encryptor builds for six victims packed for an intended 2026-10-01 deployment, and a 2026-09-30 screenshot shows live encryption on a victim workstation. SOCRadar ties the infrastructure to INC (three INC leak-site victims, Aidon, Trulite and City of Princeton, TX, match internal case files) and to The Gentlemen (a branded extortion package), assesses with low confidence a formal alliance and with moderate-to-high confidence a shared operational environment, and