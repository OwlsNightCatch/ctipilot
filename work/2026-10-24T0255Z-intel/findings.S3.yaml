    extended_notes: |
      Delta for the composer on the covered PHP entry (priority stays critical; fixed releases 8.5.12, 8.4.27, 8.3.36, 8.2.35 unchanged): (1) the entry's sourcing statement that no source reports a confirmed compromise now needs Unit 42's claim set against it, attributed and flagged as a single-vendor observation whose initial-exploitation vector the brief does not state; (2) three new exploitability assessments agree that a universal one-request exploit does not exist and that reliable exploitation needs per-deployment calibration (CrowdStrike, SANS ISC, SOCRadar), matching Sansec and Red Hat already carried; (3) the new CVE-2026-115560 informational advisory means session.upload_progress.enabled=0 should stay in place after patching until the next regular release (it is a php.ini or pool setting, not changeable with ini_set()), and the project defers the full advisory to that release; CVE-2026-115560 is not yet published with a score or affected-version list (mySites.guru, relaying php.net, says so; do not infer one).
      Detection concepts the sources add: PHP-FPM or Apache error logs showing bursts of "Allowed memory size exhausted" (Hunt.io: a trace of an attempt, not of compromise); multipart POSTs carrying a PHP_SESSION_UPLOAD_PROGRESS field with an oversized body or deeply nested field names (Wordfence, Hunt.io, SOCRadar, OffSeq); Wordfence's sample also shows serialized-object gadget-chain attempts (Laravel, Monolog, Symfony, Guzzle, ThinkPHP and others) on the same surface, which are a different, older class of PHP exploitation. For the agentic post-exploitation pattern Unit 42 describes: process-creation telemetry on the web host where a shell started by the PHP worker or web server account runs batched enumeration commands whose output sections are delimited by marker lines such as ==SHELLUSER== and ==PASSWD==, followed by relay or tunnel setup toward Active Directory; Unit 42 publishes managed-hunting XQL that anchors on shells and commands under PHP-FPM, php-cgi, Apache, w3wp and web service accounts (vendor-specific; the concept is parent-lineage from the web worker).
      Context: Unit 42's two-hour interval is the only reported timing; the same brief says at least one European government took its website offline as a precaution. Palo Alto also lists a Cortex Xpanse count of over 22.6 million exposed potentially vulnerable instances, a vendor-telemetry figure the composer should attribute and not repeat as a fact about Switzerland.
  - title: "Zimbra CVE-2026-73570: Elastic reproduces the chain and finds that several public proofs of concept never trigger it, so a failed test does not prove a server patched; it publishes a process-lineage detection for the Swatchdog notification path"
    sources:
      - { url: "https://www.elastic.co/security-labs/threat-command/command-injection-zimbra-cve-2026-73570", publisher: "Elastic Security Labs", date: "2026-10-23", role: "primary" }
    discovery_trace: "first seen at: elastic-seclabs, URL https://www.elastic.co/security-labs/rss/feed.xml (2026-10-23 item) -> primary (no pivot needed): extract of https://www.elastic.co/security-labs/threat-command/command-injection-zimbra-cve-2026-73570"
    summary: |
      Elastic Security Labs (2026-10-23) reproduced the unauthenticated command injection CVE-2026-73570 while building a detection and describes the chain stage by stage: an SMTP client sends a recipient address with an unclosed angle bracket, Postfix logs it to /var/log/zimbra.log as an illegal-address warning, Zimbra's bundled Swatchdog daemon matches a log line of the form "Service status change: <host> <service> changed from stopped to running", and the notification routine dosnmp, generated from /opt/zimbra/conf/swatchrc.in, interpolates the service field into a Perl backtick string that /bin/sh executes, giving code execution as the zimbra user, which can read every mailbox and send as any local identity; the trigger needs SNMP notifications enabled. Elastic's practical finding is that several public proofs of concept it tested write a payload that Swatchdog never matches, so a failed test looks like a patched server; its own proof of concept proves execution with an out-of-band callback that changes nothing on disk. Elastic says upgrading to Zimbra 10.1.20 or later is the only complete fix. Its detection is a Linux process sequence on one host within 30 seconds: a shell whose parent is a Perl process running the Swatchdog script and whose command line carries snmptrap and the service-name and service-status MIB strings, followed by any child of that shell other than snmptrap, which it calls a very strong indicator of successful exploitation and also recommends for retroactive hunting of pre-patch attempts. If exploitation is found, Elastic lists hunting for standard remote-code-execution indicators, phishing emails originating from the server, compromise of local databases and signing keys and LDAP exports, and less direct surfaces beyond the mail store.
    region_nexus: "global; Zimbra is widely deployed in European public-sector and education mail estates (the covered entry carries CSIRT Italia and CERT-FR reporting)"
    primary_sector_nexus: "direct (public-sector mail servers running Zimbra Collaboration with the optional SNMP package)"
    sector: "public-sector"
    cves: [CVE-2026-73570]
    techniques: [T1190, T1059.004]
    affected_products: ["Zimbra Collaboration"]
    entity_keys: ["product:zimbra-collaboration"]
    new_entities: []
    verification: SINGLE-SOURCE-OTHER
    confidence: HIGH
    novelty: "update-of:2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited"
    classification_hint: "B2 (Elastic reproduced the chain itself; mechanism consistent with the vendor-fixed behavior and the covered entry's Microsoft, CERT-FR and CSIRT Italia reporting, but this post is a single source for the PoC-reliability and detection claims)"
    evidence:
      - quote: "several of the public proofs of concept (PoCs) we tested write a payload that Swatchdog never matches, so a failed test looks like a patched server"
        attribution: "Elastic Security Labs"
        source_url: "https://www.elastic.co/security-labs/threat-command/command-injection-zimbra-cve-2026-73570"
      - quote: "Upgrade to Zimbra 10.1.20 or later."
        attribution: "Elastic Security Labs"
        source_url: "https://www.elastic.co/security-labs/threat-command/command-injection-zimbra-cve-2026-73570"
      - quote: "this is a very strong indicator of successful exploitation"
        attribution: "Elastic Security Labs"
        source_url: "https://www.elastic.co/security-labs/threat-command/command-injection-zimbra-cve-2026-73570"
    extended_notes: |
      Delta for the composer (improvement or update on the covered entry; the entry already carries a mechanism-level Detection line and the fixed version 10.1.20): add (a) Elastic's reproduction with the trigger precisely described (malformed RCPT TO with an unclosed address logged by Postfix, matched by Swatchdog, executed through Perl backticks); (b) the caution that a negative result from a public PoC is not evidence of a patched or unaffected server, so exposure validation should use the package and version (zimbra-snmp installed, SNMP notifications enabled, version below 10.1.20) rather than a PoC run; (c) the concrete sequence detection and its Triage property: on a healthy Zimbra host the only process the notification shell should start is snmptrap, so any other child of that shell is the discriminator; (d) post-compromise scope Elastic names. Elastic's rule is vendor-specific (Elastic Defend and its SIEM rule); only the telemetry concept (process creation with parent command-line lineage on the mail server) is portable. Elastic inspected swatchrc.in on a 10.1.16 beta build for Ubuntu 24 and tested a remote host against the PoC.
