    extended_notes: |
      Delta for the composer (correction plus update on the covered entry): (1) the root cause and the initial-access statement in the entry's body and evidence quote ("obtained the GitHub CLI OAuth tokens from its logs") are superseded by the maintainers' own post, which says the first token came from the Agent Platform API after a master key committed in May was never revoked; (2) the attacker's access began 2026-10-10, not 2026-10-21; (3) three credentials were used for different steps (owner token for protection overrides and the force-push cover-up, second maintainer's token for the production approval, third maintainer's token for deleting run records); (4) the release approval had been relaxed that week.
      Defender-relevant mechanics from the sources (telemetry class first): SCM organization audit log (creation and deletion of throwaway ci-tmp-<hex> branches within minutes, pushes of a single new workflow file under a subject like "ci: bump cache config", branch-protection overrides, force pushes, deletion of workflow runs, and the per-action token hash that ties an action to a stolen token); CI platform run metrics and environment deployment records, which outlive a deleted workflow file (an Active deployment from a branch that no longer exists); workflows with an on-push trigger that read secrets and make one outbound POST to a public webhook-capture service; secrets scope (organization-level secrets reachable by any push, environment-bound jobs unlocking environment secrets). Post-incident check named by the sources: treat every token and secret reachable from the organization as exposed, since the maintainers say they rotated all tokens for every internal system and vendor platform.
      Transferable hardening named or implied by the sources: revoke exposed keys when a commit leaks them (revocation was identified as required and never done); do not hold org-owner GitHub CLI tokens in agent or automation platforms (a CLI token is post-2FA and bypasses the sensitive-action re-authentication); keep release approval separation. The post does not say whether anything was published to registries between 2026-10-10 and 2026-10-21.
