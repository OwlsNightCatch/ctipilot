    -> precedent: WebSearch ("PEP''s Caisse des Dépôts plateforme employeurs publics accès illégitime ingénierie sociale CNRACL Ircantec réouverture") -> Next.ink
    https://next.ink/brief-article/caisse-des-depots-ircantec-piratee-des-donnees-de-70-000-personnes-derobees/. The 2026-10-23 intel run dropped the Ircantec forum-sale
    claim alone under PD-6 and asked for a re-check; the operator''s own statements are now on record.'
  summary: 'France''s Caisse des Dépôts closed PEP''s on 2026-10-13, the platform through which about 63,000 public employers (state services, local authorities,
    hospitals) manage pension and career data for their staff in schemes such as CNRACL and Ircantec (Cyberattaque.org). On 2026-10-19 Ircantec stated that the platform
    had been closed because of an illegitimate access to the PEP''s accounts of some employers made possible by social engineering; PEP''s reopened that Monday morning
    while sign-in through Net-entreprises and new registrations stayed shut. The operator gives no number of employers, no data actually accessed, no confirmation
    of exfiltration and no mechanism. CNRACL documents the platform''s second factor: a one-time code by SMS or voice call at first sign-in and again after 7 days
    on the same workstation, plus a code for administrator actions such as creating a user account, changing a user''s contact details or granting access rights.
    Cyberattaque.org writes that the social engineering would have got around this second factor (conditional; the operator does not say how, and no source confirms
    it). On 2026-10-22 or 2026-10-23 a seller offered a database attributed to Ircantec and claimed to cover more than 450,000 people; Cyberattaque.org''s analysis
    of a 1,000-record sample found names, birth dates, contact data and postal addresses but no social-security number, IBAN or password, and could not independently
    confirm the volume. The Caisse des Dépôts said on 2026-10-23 that its analyses ''do not demonstrate any correlation'' between the data published on the dark web
    and affiliates'' data while its investigation continues, and no source links the offer to the compromised PEP''s accounts. Precedent from the same operator: in
    February 2025 attackers made fraudulent use of the login credentials of several public employers to reach data of about 70,000 Ircantec affiliates (Next.ink,
    relaying Franceinfo and AFP).'
  region_nexus: 'France (neighbouring country). Transferable to Swiss public employers and pension-fund portals: same sector class as the PK Softech/Publica supply-chain
    incident already in the store, and the same trust boundary (employer-side accounts that reach staff pension data).'
