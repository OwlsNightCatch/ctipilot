    note: 'A for the operator''s own notices; 2 for the account compromise (operator-stated, mechanism undisclosed). The 450,000-record offer is an uncorroborated
      seller claim that the operator says shows no correlation with affiliates'' data: treat as credibility 4 and never state it as a breach.'
  confidence: MEDIUM
  novelty: new
  borderline: true
  borderline_reason: 'Non-Swiss and the mechanism is undisclosed (social engineering only, so the only evidence-bound mapping is use of valid accounts), and the 450,000-record
    offer is a seller claim the victim contests. It clears the bar only as a transferable lesson for Swiss public employers and pension-fund portals: the second compromise
    of the same employer-account trust boundary in 20 months, with an SMS or voice one-time code in place, at the sector class of PK Softech/Publica. The previous
    fire asked for a re-check once the operator spoke; it has, and its statements are in the YAML.'
  evidence:
  - quote: La plateforme PEP's a été fermée en raison d’un accès illégitime aux comptes PEP’s de quelques employeurs rendu possible par ingénierie sociale.
    attribution: Ircantec
