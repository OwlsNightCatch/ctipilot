  - quote: À ce stade, nos analyses ne démontrent aucune corrélation entre les données publiées sur le Darkweb et celles des affiliés.
    attribution: Caisse des Dépôts
    source_url: https://politiques-sociales.caissedesdepots.fr/actualites/informations-sur-une-pretendue-fuite-de-donnees-ircantec
  - quote: mise en place d’un code à usage unique pour les connexions classiques et via Net-entreprises (SMS ou vocal pour les téléphones fixes)
    attribution: CNRACL
    source_url: https://www.cnracl.retraites.fr/employeur/ma-plateforme-peps/la-securisation-de-lacces-peps
  - quote: Il n’existe cependant actuellement aucune preuve permettant d’affirmer que les 450 000 fiches revendiquées proviennent des comptes PEP’s compromis.
    attribution: Cyberattaque.org
    source_url: https://www.cyberattaque.org/cyberattaque-ircantec-une-nouvelle-fuite/
  extended_notes: 'Exposure (facts only): PEP''s serves about 63,000 public employers; the account types at issue are employer and administrator accounts, whose rights
    reach contributions, individual declarations, careers and individual pension accounts (CNRACL, Ircantec, RAFP, FSPOEIE). Which employers and which data were reached
    is not published. Documented controls (CNRACL): one-time code by SMS or voice call on first sign-in and every 7 days per workstation; extra code for administrator
    actions (creating a user, changing a user''s contact details, granting rights) and for all users changing their own contact details or password. After the reopening:
    sign-in through Net-entreprises, new registrations and the forgotten-identifier function stay disabled, and the Ircantec contribution and individual declaration
    services stayed unavailable (Cyberattaque.org). Detection concept (the sources do not name one; this follows mechanically from the documented sensitive actions):
    portal audit records for employer-administrator accounts, namely user creation, contact-detail changes, rights grants and sign-ins from a new workstation, correlated
    with help-desk or telephone contacts that asked for a one-time code or a recovery; the discriminator for legitimate activity is the documented administrator hand-over,
    which the platform''s own guidance says must create the successor''s account before the old administrator leaves. Why it matters for Swiss readers: the store''s
    PK Softech/Publica entry covers a pension-fund software supplier, and the BACS authentication-classes entry (2026-10-20/bacs-authentication-security-classes-technology-assessment)
    discusses resistance to real-time phishing; this case is a public-sector employer portal where a one-time code by SMS or voice was in place and social engineering
    still produced illegitimate access, per the operator, without a stated mechanism. Suggest `references` to both entries; no CVE and no actor is involved. Open
    questions for a later fire: number of employers, data accessed, mechanism, and whether the Caisse des Dépôts or the CNIL publishes a breach notice; the 450,000-record
    offer''s origin (the Caisse says no correlation found yet).'
