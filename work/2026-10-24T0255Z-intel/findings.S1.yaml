  discovery_trace: 'first seen at: thehackernews feed, URL https://feeds.feedburner.com/TheHackersNews (item ''Two CVSS 9.0 Linux KSMBD RCE Flaws Disclosed on Public Mailing Lists Before Kernel Fixes'', 2026-10-22T22:31Z) -> article https://thehackernews.com/2026/10/two-cvss-90-linux-ksmbd-rce-flaws.html -> pivot: Phoronix, URL https://www.phoronix.com/news/LKML-New-Trend-Vulnerabilities (the best reachable report of the mailing-list posts). Dead end: the lore.kernel.org posts themselves (https://lore.kernel.org/lkml/BYAPR01MB383076AC412E19C48CFBEAE980662@BYAPR01MB3830.prod.exchangelabs.com/) return an Anubis proof-of-work challenge on every transport tried, and the ZDI ''upcoming advisories'' page lists no ksmbd item.'
  summary: 'Trend Micro''s Zero Day Initiative sent a batch of Linux kernel vulnerability reports to the public kernel mailing list instead of the private security list on 2026-10-22 (Phoronix calls it seemingly accidental; The Hacker News notes the kernel''s security documentation, updated in May 2026, treats bugs found by AI tools as already public). Two concern ksmbd, the kernel''s built-in SMB server, and are rated CVSS 9.0 by ZDI: ZDI-CAN-33774, a race in how ksmbd assigns its protocol handler (a burst of short SMB1 packets followed by an SMB2 packet in one TCP write makes workers parse SMB1 data with the SMB2 handler and read past the end of the buffer), triggerable before any network authentication on any server running ksmbd on TCP 445, with a write-past-the-buffer path once a share is accessible; and ZDI-CAN-33549, an integer underflow in the SMB Direct path that needs an RDMA-capable interface (hardware or the rxe software driver), a writable ksmbd share and a client negotiating SMB Direct. As of 2026-10-22 neither has a named fix in the mainline kernel or in linux-next according to The Hacker News, while Phoronix says a fix for ZDI-CAN-33549 is queued in a branch aimed at the next development cycle; no CVE exists because the kernel project assigns them after a stable-tree fix. The reports were not accompanied by patches, and the finder is credited as Trend Micro''s AI scanner (TrendAI). No exploitation is reported. Exposure is limited to hosts that load the ksmbd module (Red Hat Enterprise Linux does not include it by default); `systemctl status ksmbd` or `lsmod | grep ksmbd` shows whether it is active.

    '
