- title: 'CVE-2026-111497 (Node2Shell), Google Brotli decoder bundled in Node.js: an out-of-bounds write reachable through fetch(), Express 5 and body-parser 2 request bodies gives remote code execution; fixed in Node.js 22.23.4, 24.22.1 and 26.12.1 and Brotli 1.2.1, and the PyPI Brotli and brotlicffi packages are affected too'
