    attribution: NCSC-NL (NCSC-2026-0453, CSAF record)
    source_url: https://advisories.ncsc.nl/csaf/v2/2026/ncsc-2026-0453.json
  - quote: 'Users need to update any Brotli libraries or binaries between 1.0.3 through 1.2.0 to the latest available version: 1.0.10 or 1.1.1 or 1.2.1.'
    attribution: ENISA EUVD (EUVD-2026-108169, API record)
    source_url: https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-108169
  extended_notes: 'Not covered anywhere in the store (grep of entries and runs for Node2Shell and Brotli is empty apart from an unrelated eMudhra tracker line); the Node.js release itself is dated 2026-10-21 (outside a 26 h window), but the NCSC-NL advisory (2026-10-23), the OpenSourceMalware PyPI finding (2026-10-23) and the EUVD update (2026-10-23) are in window and widen the affected set materially, so treat it as new. Suggested priority: notable to high (pre-auth RCE with a public, independently validated demonstration in a ubiquitous runtime, but conditional: a request-body path needs Express 5 or body-parser 2 with Brotli decoding, the fetch() path needs a server-side fetch of attacker-influenced URLs, reliability was ''multiple attempts'' on one architecture, no exploitation reported). EPSS (FIRST, 2026-10-23): 0.0048. Discrepancies to keep visible: Node.js rates it High while the Google CNA scores CVSS 4.0 9.2; the Node.js post credits OpenAI Codex Security for the report while Imperva''s post credits Matteo Collina; OpenSourceMalware says Imperva disclosed it on 2026-10-21, whereas Imperva says Node.js disclosed it that day. Node.js'' list covers 22.x, 24.x and 26.x; OpenSourceMalware says the decoder is also bundled in 20.x builds, which are not in the fixed list. Exposure check: the running Node.js version inside every image and host (a package inventory misses a Node binary bundled in a container), Express 5 and body-parser 2 services that accept Content-Encoding br request bodies, and server-side fetch() of third-party or user-supplied URLs; for Python, `pip show Brotli brotlicffi` against 1.2.1 and 1.2.1.0. Hunt: web access logs for requests with Content-Encoding br to endpoints that parse bodies, from unfamiliar sources, followed by Node worker crashes or restarts in the process supervisor logs. Do-now action candidate: update Node.js to a fixed release in every image and host, and upgrade the Brotli and brotlicffi packages, since scanners will not find the Python ones. Techniques: T1190 (request-body path); the fetch() path is the same decoder reached by consuming an attacker-controlled response.

    '
