  summary: 'Palo Alto Networks'' Unit 42 updated its PHP2Shell threat brief on 2026-10-23 (12:30 PT) to say it observed attackers using agentic AI attack platforms for post-exploitation; in one case, against a government entity in Europe, they reached password hashes and multi-factor authentication secrets within two hours of initial exploitation, set up an NTLM-relay tunnel into Active Directory and attempted Domain Admin escalation. This is the first vendor report of a confirmed intrusion; it rests on Unit 42''s own telemetry alone (no victim, initial vector detail or independent confirmation), and it contradicts the picture from Sophos (which on 2026-10-22 corrected an earlier success claim), Hunt.io, SOCRadar and SecurityWeek that no compromise was confirmed. Unit 42 also cites Cortex Xpanse telemetry of more than 22.6 million exposed instances. Separately, PHP published an informational advisory on 2026-10-23 for a third RCE vector, CVE-2026-115560, that needs an application to set session.serialize_handler to php_binary or php_serialize, switch it to php with ini_set() before session_start(), and leave session upload progress enabled; PHP issues no emergency release, will publish the full advisory with the next regular bugfix release, and advises session.upload_progress.enabled=0 (CERT-EU relays it in v1.2 of advisory 2026-018; The Hacker News reports no exploitation). Exploit-side evidence in the window: Sophos analysed a blocked attempt that tried to install Potassium, a likely Mirai-derived botnet, VulnCheck widened its exploit to PHP 8.4.10 to 8.4.26 and 8.5.10 to 8.5.11 on AMD64 and ARM64 with default settings and display_errors off under mod_php, and WordPress on default Docker installs, SOCRadar and Hunt.io found attacker servers with exploit tooling that had not produced a shell, and the SANS Internet Storm Center judges a reliable one-click exploit difficult. Vendor statuses moved: Cisco''s advisory (revised 2026-10-23) lists Expressway Series and Expressway Select (fix 15.5.21, undated), Ultra-Reliable Wireless Backhaul (27.1.1, February 2027) and Duo Access Gateway (administrator-authenticated, CVSS 6.6) as affected; Fortinet lists FortiDDoS, FortiClient Cloud Services, FortiSOAR and FortiSOAR PaaS as under investigation and its other listed products as not impacted; Splunk lists no known affected product.

    '
