self_evolution_notes:
- 'Runtime/library advisories (PHP, Node.js/Brotli, Ruby regexp, Python Pillow) were the week''s gap pattern: the pipeline found each through CERT relays or news two days late. Three candidate sources are proposed; a general rule for S1 could be to read the project security feeds of the top server runtimes (PHP, Node.js, Python, Ruby, Go, Java) every fire.'
- 'A sweep of the Horizon3 feed surfaced three omissions in existing entries (FortiSIEM PoC, Oracle EBS TCF row, Splunk Patroni): horizon3-ai is an active source; its rapid-response pages state affected and fixed versions and exploitation status in a fixed shape that reads cleanly with `extract`.'
- 'Quote-literal checking: `extract` output keeps markdown (bold markers, table pipes); evidence quotes copied from it carry those characters. Quotes were verified against saved bodies under work/<run-id>/bodies/s1-*.'
