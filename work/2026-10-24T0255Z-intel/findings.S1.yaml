  summary: 'Ruby''s maintainers published an advisory on 2026-10-23 (03:11 UTC) and released Ruby 4.0.9, 3.4.12 and 3.3.13 with fixes for three bugs in the Onigmo regular-expression engine that sit behind four critical GitLab flaws: CVE-2026-89078 (double free when parsing a pattern fails after an alternation), CVE-2026-93577 and CVE-2026-97229 (integer overflow in the size of a compiled pattern) and CVE-2026-110264 (overflow of internal IDs in a pattern with many repeats). Ruby''s table gives the first release of each series that carries each fix: the integer-overflow fix is in 4.0.8, 3.4.12 and 3.3.13 and the ID-overflow fix for CVE-2026-110264 first appears in 4.0.9, so 4.0.8 is not enough; Ruby 3.3 gets the fixes as an exception to its security-only phase, and Ruby 3.2 and older are end of life with none. GitLab fixed its own servers by shipping a patched Ruby in its releases (19.4.1, 19.4.2 and 19.5.1). The wider significance: any Ruby application that compiles a regular expression from an attacker-controlled string (Regexp.new, Regexp.union, Regexp.compile, or interpolation into a regexp literal) can reach these bugs, Regexp.timeout does not protect and pattern-length limits do not reliably protect, and Ruby requested no CVE identifiers of its own ''at least for now'', so a scanner that matches GitLab''s CVE records, which name only GitLab, will not flag a vulnerable Ruby in another application. The Hacker News adds that none of the four GitLab CVEs was in CISA''s Known Exploited Vulnerabilities catalogue as of 2026-10-23; no source reports exploitation, and the existing CVE-2026-97229 entry records a public proof of concept (Rapid7).

    '
