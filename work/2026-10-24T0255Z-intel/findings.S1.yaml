  summary: 'Oracle''s October 2026 Critical Patch Update (2026-10-20) lists CVE-2026-101767 in Oracle Application Object Library (Core component) with the HTTP protocol, no authentication required, CVSS 3.1 9.8 and E-Business Suite versions 12.2.3 to 12.2.15, credited to three Horizon3.ai researchers. Horizon3''s write-up describes it as an unauthenticated SQL injection in the Thin Client Framework servlet at /OA_HTML/AppsTCFServer (oracle.apps.fnd.tcf.SocketServer), reachable through the default EBS URL firewall configuration, that executes SQL as the APPS database user and chains to operating-system commands as the EBS application account; affected data may include financial, payroll, HR and procurement records. Until patched, Horizon3 advises removing /OA_HTML/AppsTCFServer from the EBS URL firewall allowlist and restricting the web tier to trusted networks. No exploitation is reported and Horizon3 offers a NodeZero check rather than a public proof of concept. The existing 2026-10-21 Oracle entry names the Workflow Notification Mailer row (CVE-2026-101809) but not this one.

