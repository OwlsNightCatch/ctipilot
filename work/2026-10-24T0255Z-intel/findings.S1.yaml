  summary: 'Node.js'' security release of 2026-10-21 fixes CVE-2026-111497, an out-of-bounds write in the Brotli decoder bundled with Node.js (rated High by Node.js; CVSS 4.0 9.2 by the Google CNA): an invalid block switch is reported as ''needs more input'' instead of a permanent format error (CWE-252 leading to CWE-787 in c/dec/decode.c), so the streaming decoder keeps appending input to an eight-byte internal buffer. An attacker who can supply Brotli data that an application decompresses with node:zlib can corrupt process memory, which can lead to a crash, disclosure of process memory or remote code execution; Node.js 22.x, 24.x and 26.x are affected before 22.23.4, 24.22.1 and 26.12.1. Imperva''s Red Team (2026-10-22), which nicknamed it Node2Shell, ran code carried in a Brotli stream against the official Node.js 24.22.0 Linux arm64 image through built-in fetch() consuming an attacker-controlled response and through Express 5.0.0 to 5.3.0 and body-parser 2.0.0 to 2.3.0 request-body parsers (raw() and json()); it needed several attempts, the fixed 24.22.1 rejected the same inputs, and a bare Node.js HTTP server does not decode incoming Brotli bodies, so the request path needs those parsers configured. OpenSourceMalware showed on 2026-10-23 that the flaw sits in upstream Google Brotli 1.0.3 to 1.2.0 (fixed in 1.0.10, 1.1.1 and 1.2.1) and therefore also in the PyPI packages Brotli up to 1.2.0 (fixed 1.2.1, published 2026-10-22) and brotlicffi up to 1.2.0.2 (fixed 1.2.1.0, published 2026-10-23), both patched without a release note and not yet listed in any advisory database, so dependency scanners will not flag them. NCSC-NL relayed the issue on 2026-10-23 (likelihood medium, damage high). No source reports exploitation in the wild; Imperva has shipped WAF rules and says unexpected process exits during decompression and decoder errors may help prioritise investigation but are not a reliable sign of exploitation by themselves.

    '
