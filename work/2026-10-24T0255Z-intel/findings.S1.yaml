  extended_notes: 'Update shape for the existing PHP2Shell entry; suggested field movements: summary, headline (the ''no source reports a confirmed compromise'' statement is now contested by one vendor, not settled), cves[] (add CVE-2026-115560 with status no-patch/mitigation-only, no CVSS yet, affected versions not stated by PHP), techniques (T1557.001 for the NTLM-relay step and T1003 for the hash access, both as Unit 42 describes them), evidence, sources, sourcing_note, body (new update section). Keep priority critical. Source weighing for the main agent: the intrusion claim is Unit 42 alone (a telemetry-holding vendor, Admiralty B-grade lab; Palo Alto also sells the products it says protect against it) and omits the victim, the exploited path and the date; Sophos'' correction of 2026-10-22 shows how early PHP2Shell success claims have been walked back. The exposure figure (22.6 million instances) is a Palo Alto Xpanse count of potentially vulnerable instances; Qualys, relayed by SecurityWeek, counts about 110 million instances on end-of-life PHP 5.4 to 8.1 and about 44 million on supported branches not yet updated. Defender angle: the post-exploitation chain described (hash access, MFA-secret access, NTLM relay into AD) is hunted on the web server side as shell or interpreter children of the PHP worker or Apache/IIS worker, and on the identity side as NTLM authentication from web-tier hosts to domain controllers and relayed authentications from unusual sources; Unit 42 publishes XQL hunting queries (process lineage under PHP workers) in the brief. Cisco''s Expressway row matters for operators who just applied X15.5.20 for CVE-2026-76466: PHP2Shell needs a further release (15.5.21, no date), with a workaround in Cisco''s bug CSCwx37062.

    '
