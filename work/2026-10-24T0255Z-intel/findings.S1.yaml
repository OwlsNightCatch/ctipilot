  summary: 'Pillow, the most widely used Python imaging library, shipped 13.0.0 on 2026-10-16 as a large security release with fixes at four severity levels, two of them in the maintainers'' critical tier; The Hacker News reported the batch on 2026-10-23. The headline flaw, CVE-2026-112900 (GitHub CNA score 9.2, maintainers moderate), is argument injection in the EPS plugin: Pillow passes the file name to Ghostscript without sanitising it, so a name that starts with ''-'' or ''@'' is parsed as a Ghostscript option or argument file, which the reporter chained to command execution under Pillow''s default settings with -dSAFER; the trigger is the filename, not the PostScript content, so upload endpoints that keep or build a stored name from user input are the realistic target, and only hosts with the gs program installed are reachable (Pillow 2.6.0 up to 12.3.0 per The Hacker News). The critical tier also covers a stale native image storage reuse after mode transitions (CVE-2026-96639) and JPEG decoder overflows, one in FlashPix (FPX) handling that The Hacker News says ran an attacker''s command from a single Image.open() on a crafted file when the optional olefile package is installed, and the batch includes CVE-2026-112393 (a TIFF overflow when saving a compressed TIFF to memory, present since 2013, made code execution only together with a second address leak) and CVE-2026-112403 (a JPEG thumbnail overflow that crashes). CISA''s analysts mark no known exploitation for the EPS flaw and a public proof of concept for the TIFF one in the CVE records, according to The Hacker News; no flaw is known to be under attack. The fix is Pillow 13.0.0, which drops Python 3.10.

    '
