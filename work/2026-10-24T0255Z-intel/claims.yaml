    entry: 2026-10-22/cve-2026-110264-gitlab-org-mode-renderer-unauth-rce
    surface: "body"
    kind: cited
    text: "**Exposure:** self-managed GitLab CE and EE on the versions above; the vulnerable path is reached when GitLab renders a .org file, so an instance with public projects, or one where untrusted users can create them, is the exposed shape, and until patching GitLab advises reducing public visibility ("
