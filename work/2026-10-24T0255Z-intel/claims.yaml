    kind: cited
    text: "); on hosts, startup hooks and sitecustomize modules in a Python library directory that your tooling did not install, a detached Python process holding a lock file, and an encrypted archive posted to a path labelled as a health check ("
    urls: ["https://socket.dev/blog/litellm-compromise"]
  - claim_id: 4f9bcde01f
    entry: 2026-10-22/litellm-1-107-0-pypi-docker-credential-stealer-lookalike
    surface: "body"
    kind: cited
    text: "In the GitHub organization audit log, short-lived throwaway branches that add a single workflow file, workflow runs deleted minutes after they ran, and branch-protection and force-push-block overrides made with an owner's token; the log records a hash of the token behind each action, which tied the stolen maintainer token to the release approval ("
