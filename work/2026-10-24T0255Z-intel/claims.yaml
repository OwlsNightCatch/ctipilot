    surface: "body"
    kind: cited
    text: "In repository content, scan each suspect checkout for .org files with an oversized TODO-keyword line, and in the Rails request log look for editor preview requests whose file_path ends in .org while the URL names another file type, which forces the Org renderer ("
    urls: ["https://gitlab.com/gitlab-security-oss/tldr/-/raw/main/Detections/platforms/GitLab/Vulnerability%20Detections/org_mode_render_error_burst.md"]
  - claim_id: d36f819c80
    entry: 2026-10-22/cve-2026-110264-gitlab-org-mode-renderer-unauth-rce
    surface: "body"
    kind: cited
    text: "A successful exploit is quiet and does not reliably crash, so the absence of a hit never clears an instance ("
