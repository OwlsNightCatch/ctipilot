  - claim_id: 98ce50ca35
    entry: 2026-10-22/cve-2026-110264-gitlab-org-mode-renderer-unauth-rce
    surface: "section 2026-10-24T03:42:57Z"
    kind: cited
    text: "The Ruby project published an advisory on 2026-10-23 and released Ruby 4.0.9, 3.4.12 and 3.3.13 with fixes for the bugs in its Onigmo regular-expression engine behind four GitLab flaws: CVE-2026-89078 (a double free when parsing a pattern fails after an alternation), CVE-2026-93577 and CVE-2026-97229 (an integer overflow in the size of a compiled pattern) and CVE-2026-110264 (an overflow of internal IDs in a pattern with many repeats) ("
