    kind: cited
    text: "PK Softech had confirmed in writing to Publica in January 2026 that it deleted the data of the 2019 migration and held no personal data in plaintext, and the Tages-Anzeiger reports that this apparently did not happen, because the data was still on its servers when the attackers got in ("
    urls: ["https://www.tagesanzeiger.ch/akira-hacker-erpressen-loesegeld-mit-publica-daten-654128340841", "https://www.inside-it.ch/publica-wollte-pensionskassendaten-loeschen-lassen-20261022"]
