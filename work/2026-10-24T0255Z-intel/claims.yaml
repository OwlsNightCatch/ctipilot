    entry: 2026-10-22/litellm-1-107-0-pypi-docker-credential-stealer-lookalike
    surface: "body"
    kind: cited
    text: "**Detection:** in the cloud audit logs of every account the host could reach, a caller-identity check followed by a Bedrock model listing and IAM enumeration, made with an instance-role credential harvested from CI runners or Kubernetes nodes from an address outside your estate, which Wiz saw from 16:20 UTC on 2026-10-21 ("
