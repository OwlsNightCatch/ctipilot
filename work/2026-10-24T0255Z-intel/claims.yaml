    text: "Horizon3.ai published a deep dive and a proof of concept for the FortiSIEM flaw on 2026-10-20: the phQueryMaster gRPC service listens on tcp 27918 on every interface and does not request a client certificate, so any remote client can reach its SendQueryResult method, whose query-id metadata is joined into a file path without validation, and a NUL byte in it discards the suffix the service appends, which turns the write into an overwrite of a chosen file ("
    urls: ["https://horizon3.ai/attack-research/cve-2026-106173-deep-dive-fortisiem-grpc-path-traversal-file-write-rce/"]
  - claim_id: df13020505
