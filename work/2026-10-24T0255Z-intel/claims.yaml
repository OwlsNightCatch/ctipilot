  - claim_id: 310099361e
    entry: 2026-10-22/litellm-1-107-0-pypi-docker-credential-stealer-lookalike
    surface: "summary"
    kind: frontmatter
    text: "On 2026-10-21 LiteLLM 1.107.0, the open-source LLM gateway, shipped with malicious Python startup files in all seven PyPI wheels (live 11:39 to 13:23 UTC) and in the official GHCR and Docker Hub images behind the v1.107.0, latest, main-latest and main-stable tags (11:46 to 14:20 UTC); they run a credential stealer at every Python start and start a background loader that could execute code fetched from an attacker-chosen host, though Socket saw its pointer empty at 13:01 UTC. The maintainers' root-cause post of 2026-10-23 says a master key committed to a public repository on 2026-05-27 and never revoked gave the attacker, from 2026-10-10, a GitHub organization owner's CLI token, with which it stole two maintainers' tokens and, on 2026-10-21, overrode branch protection to build the release from a look-alike repository; Socket independently found secret-stealing workflows running on 2026-10-10. Wiz saw stolen AWS instance-role credentials tested about 4.5 hours after exfiltration; PyPI and the registries removed the release the same day and the maintainers say to pin 1.106.2 or an explicit earlier version."
  - claim_id: 2282cfac13
    entry: 2026-10-22/litellm-1-107-0-pypi-docker-credential-stealer-lookalike
    surface: "body"
    kind: cited
    text: "Socket reports that LiteLLM 1.107.0, an open-source LLM gateway, carries malicious Python startup files in all seven wheels, and that Upwind found the same payload in the published images ("
    urls: ["https://socket.dev/blog/litellm-compromise"]
  - claim_id: ef83825d05
    entry: 2026-10-22/litellm-1-107-0-pypi-docker-credential-stealer-lookalike
    surface: "body"
    kind: cited
    text: "A startup hook and a second startup module in the Python library directory run at every Python start without the application importing LiteLLM: the first collects cloud, Kubernetes, CI, registry and database credentials, SSH, GPG and TLS private keys, browser stores, AI-tool credential files, environment variables and, where configured, the credentials saved in a LiteLLM proxy database; the second forks a detached loader that polls a file in a GitHub repository for a domain and would execute Python downloaded from it with no signature or hash check, though at 13:01 UTC the pointer returned an empty body, which stops the loader before its download stage ("
    urls: ["https://socket.dev/blog/litellm-compromise"]
  - claim_id: e2121ef0cc
    entry: 2026-10-22/litellm-1-107-0-pypi-docker-credential-stealer-lookalike
    surface: "body"
    kind: cited
    text: "The payload is not in the git tag: a packaging setting in an untagged commit pulls it into the wheel, and the container build provenance records a source repository named Berri-AI/litellm, one hyphen away from BerriAI/litellm ("
    urls: ["https://socket.dev/blog/litellm-compromise"]
  - claim_id: 65d12ca638
    entry: 2026-10-22/litellm-1-107-0-pypi-docker-credential-stealer-lookalike
    surface: "body"
    kind: cited
    text: "The maintainers' root-cause post of 2026-10-23, which they call the canonical account and which corrects assumptions in their earlier status updates, traces the chain to a configuration file committed on 2026-05-27 to a public repository with the master key of an experimental internal agent service; the commit was force-pushed over but the key was never revoked ("
    urls: ["https://docs.litellm.ai/blog/security-incident-oct-21-2026-attack-chain"]
  - claim_id: a927faaa7e
    entry: 2026-10-22/litellm-1-107-0-pypi-docker-credential-stealer-lookalike
    surface: "body"
    kind: cited
    text: "On 2026-10-10 the attacker used that key against the service's API, which returned the GitHub CLI OAuth token of an organization owner, not a service account and not scoped down, and from then on the attacker held owner-level access to every repository; such CLI tokens are post-2FA and exempt from GitHub's re-authentication for sensitive actions ("
    urls: ["https://docs.litellm.ai/blog/security-incident-oct-21-2026-attack-chain"]
  - claim_id: 08b85193b4
    entry: 2026-10-22/litellm-1-107-0-pypi-docker-credential-stealer-lookalike
    surface: "body"
    kind: cited
    text: "With it the attacker pushed throwaway branches whose workflows posted CI secrets to an external capture endpoint, yielding the CLI tokens of two maintainers, and deleted the workflow runs minutes later ("
    urls: ["https://docs.litellm.ai/blog/security-incident-oct-21-2026-attack-chain"]
  - claim_id: ca45c76310
    entry: 2026-10-22/litellm-1-107-0-pypi-docker-credential-stealer-lookalike
    surface: "body"
    kind: cited
    text: "Socket found secret-exfiltration workflows running in the repository on 2026-10-10 from its Actions performance metrics, eleven days before the release attack, says it has not established how the attacker first obtained access and does not claim that the 2026-10-10 theft produced the access used on 2026-10-21, while LiteLLM says its audit logs tie the token stolen on 2026-10-10 to the approval of the release ("
    urls: ["https://socket.dev/blog/litellm-attack-timeline"]
  - claim_id: 425357fd78
    entry: 2026-10-22/litellm-1-107-0-pypi-docker-credential-stealer-lookalike
    surface: "body"
    kind: cited
    text: "On 2026-10-21 a push to the private release-orchestration repository with a maintainer's token was rejected by branch protection, and the owner's token then overrode it so that the build could be pointed at the look-alike repository; the owner's token dispatched the staging build, a second maintainer's token approved the production gate, a third maintainer's token deleted the run records, and the owner's token force-pushed the history clean, after the maintainers had relaxed the release rule earlier that week so that any two engineers could trigger and approve a release ("
    urls: ["https://docs.litellm.ai/blog/security-incident-oct-21-2026-attack-chain"]
