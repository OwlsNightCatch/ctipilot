claims:
  - claim_id: 7ca222c395
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: cited
    text: "Zimbra's own security-advisory table records the fix for CVE-2026-73570 as \"Fixed a command injection vulnerability in the SNMP monitoring component when SNMP notifications are enabled\", shipped in release 10.1.20 ("
    urls: ["https://wiki.zimbra.com/wiki/Zimbra_Security_Advisories"]
  - claim_id: e702a41324
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: cited
    text: "That release went out on 20 July 2026 ("
    urls: ["https://wiki.zimbra.com/wiki/Zimbra_Releases/10.1.20"]
  - claim_id: ca27ddabd4
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: cited
    text: ") carrying nine fixes, and at the time none of them had been flagged as actively exploited; the vendor's stated position was that \"in line with industry best practices, information disclosure is limited for security vulnerability fixes\" ("
    urls: ["https://thehackernews.com/2026/07/zimbra-patches-critical-snmp-command.html"]
  - claim_id: 040f2bfde0
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: cited
    text: "The identifier arrived 24 days later, on 13 August, and the ENISA record describes the mechanism in full: because untrusted input is not properly sanitised during SNMP notification processing, \"an unauthenticated attacker can send specially crafted SMTP requests that may result in execution of arbitrary operating system commands as the Zimbra user\" ("
    urls: ["https://euvd.enisa.europa.eu/vulnerability/CVE-2026-73570"]
  - claim_id: 93b1c5f561
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: cited
    text: "ENISA scores it 8.9 with high attack complexity ("
    urls: ["https://euvd.enisa.europa.eu/vulnerability/CVE-2026-73570"]
  - claim_id: b84229e053
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: cited
    text: "On 19 August CERT-FR issued its own advisory for the Zimbra bulletin and stated plainly that ENISA records CVE-2026-73570 as actively exploited ("
    urls: ["https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-1041/"]
  - claim_id: d60184191c
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: cited
    text: "ENISA's record lists it in the EU KEV catalog from 18 August ("
    urls: ["https://euvd.enisa.europa.eu/vulnerability/CVE-2026-73570"]
  - claim_id: f22b71fa8a
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: cited
    text: "**Exposure:** Zimbra Collaboration before 10.1.20 with the optional zimbra-snmp package installed and SNMP notifications enabled, which makes it a package check rather than a version check; CSIRT Italia also found compromises through older flaws on unsupported or unpatched lines ("
    urls: ["https://www.acn.gov.it/portale/w/zimbra-zcs-rilevato-sfruttamento-di-vulnerabilita-in-versioni-non-aggiornate"]
  - claim_id: b83ff37e58
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: cited
    text: "In process-execution telemetry with parent lineage, a shell created by Perl running a generated swatchdog script is the baseline Microsoft's hunting logic starts from, and the signal is the injection signature inside that invocation: a legitimate snmptrap invocation immediately followed by shell metacharacters and a wget or curl call, wrapped in a trailing comment character that swallows the remaining legitimate arguments ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/09/30/unauthenticated-command-injection-on-internet-facing-mail-servers-tracking-cve-2026-73570/"]
  - claim_id: ad707e6f06
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: cited
    text: "Elastic describes the same lineage as a two-step sequence on one host within 30 seconds: a shell whose parent is a Perl process running the generated Swatchdog script and whose command line carries snmptrap and the service-name and service-status MIB strings, then any child of that shell other than snmptrap, which Elastic calls a very strong indicator of successful exploitation and also uses to hunt retroactively for pre-patch attempts ("
    urls: ["https://www.elastic.co/security-labs/threat-command/command-injection-zimbra-cve-2026-73570"]
  - claim_id: bd66fbdce5
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: cited
    text: "CSIRT Italia adds host checks for a server already compromised: the zimbra user's crontab and /opt/zimbra/.ssh/authorized_keys, SNMP exploit scripts under /opt/zimbra/data/tmp, JSP files or stray text files in the Jetty public directory, droppers, miners and ransomware payloads in /tmp and /var/tmp ("
    urls: ["https://www.acn.gov.it/portale/w/zimbra-zcs-rilevato-sfruttamento-di-vulnerabilita-in-versioni-non-aggiornate"]
  - claim_id: 845e39b559
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: cited
    text: "**Triage:** the notification path itself legitimately runs a shell that invokes snmptrap, so a shell child of the swatchdog Perl script is not suspicious on its own; the discriminator is what the command line carries beyond the snmptrap invocation, namely shell metacharacters followed by a wget, curl or other non-snmptrap command ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/09/30/unauthenticated-command-injection-on-internet-facing-mail-servers-tracking-cve-2026-73570/"]
  - claim_id: eb3710d026
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: cited
    text: "A failed test with a public proof of concept is not evidence that a host is patched: Elastic found that several of them write a payload Swatchdog never matches, so decide on the package, the SNMP notification setting and the version, not on a proof-of-concept run ("
    urls: ["https://www.elastic.co/security-labs/threat-command/command-injection-zimbra-cve-2026-73570"]
  - claim_id: c00414b5e0
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: uncited
    text: "What makes this worth an out-of-band look rather than a place in the next patch window is the sequence rather than the score: the code was fixed in July with no identifier attached, so an estate that drives its patching from CVE feeds, scanner signatures or an SBOM pipeline had nothing to match against for 24 days, and the flaw only became visible to those processes five days before it was recorded as exploited."
  - claim_id: e9e97c6e4d
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: uncited
    text: "Anyone who upgraded to 10.1.20 in July for unrelated reasons is already covered and does not know it; anyone who deferred is now unpatched against a flaw with a published exploitation status."
  - claim_id: 766d6f143e
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: derived
    text: "**Detection:** The behaviour to look for follows from the mechanism."
  - claim_id: 08ff6d6ce2
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: derived
    text: "Command injection at the point where a notification is formatted means the observable is a command run from the notification path that carries more than the notification itself."
  - claim_id: caf22733ec
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: derived
    text: "On the network side, the wget or curl call in the injection signature shows up as an outbound connection from the mail server made by the zimbra account."
  - claim_id: 2320efa08f
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** the check that scopes this is a package check, not a version check: a Zimbra estate without the optional zimbra-snmp package installed and SNMP notifications enabled is not exposed to this flaw regardless of build."
  - claim_id: 1c70b2d887
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: derived
    text: "For everyone else, 10.1.20 or later is the remediation and removing the package or disabling notifications is the control that works without a maintenance window."
  - claim_id: 006d3dae16
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: derived
    text: "Because exploitation preceded the identifier, an upgrade does not show that a host is clean: the compromise check is the second half of the remediation, covering the web shells, sudo configuration, systemd units and Zimbra secrets Microsoft describes."
  - claim_id: 7d2e9b9b21
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "body"
    kind: derived
    text: "A vendor fix that ships ahead of its identifier is also invisible to every CVE-keyed process an organisation runs, so \"we patch what the scanner shows\" leaves a gap exactly as long as the gap between the release and the CVE."
  - claim_id: 9b3ff11a8d
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "section 2026-10-24T03:44:32Z"
    kind: cited
    text: "Elastic Security Labs reproduced the exploit chain in its lab and describes it stage by stage: an SMTP client sends a recipient address with an unclosed angle bracket, Postfix logs it to /var/log/zimbra.log as an illegal-address warning, Zimbra's bundled Swatchdog daemon matches a log line of the form \"Service status change: <host> <service> changed from stopped to running\", and the notification routine places the service field into a Perl backtick string that /bin/sh runs, giving code execution as the zimbra user, who can read every mailbox and send as any local identity ("
    urls: ["https://www.elastic.co/security-labs/threat-command/command-injection-zimbra-cve-2026-73570"]
  - claim_id: 931a653196
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "section 2026-10-24T03:44:32Z"
    kind: cited
    text: "Its practical finding is that several public proofs of concept write a payload that Swatchdog never matches, so a failed test looks like a patched server; Elastic's own proof of concept proves execution with an out-of-band callback that changes nothing on disk, and it says upgrading to 10.1.20 or later is the only complete fix ("
    urls: ["https://www.elastic.co/security-labs/threat-command/command-injection-zimbra-cve-2026-73570"]
  - claim_id: ee70f03795
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "section 2026-10-24T03:44:32Z"
    kind: cited
    text: "Its detection is a process sequence on one host within 30 seconds, a shell started by the Perl Swatchdog script with snmptrap in its command line followed by any child of that shell other than snmptrap; on a healthy host the notification shell starts only snmptrap, so any other child is the discriminator ("
    urls: ["https://www.elastic.co/security-labs/threat-command/command-injection-zimbra-cve-2026-73570"]
  - claim_id: 055e3c71b4
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "section 2026-10-24T03:44:32Z"
    kind: cited
    text: "Where exploitation is found, Elastic lists standard indicators of remote code execution, phishing mail originating from the server, compromise of local databases, signing keys and LDAP exports, and less direct surfaces beyond the mail store ("
    urls: ["https://www.elastic.co/security-labs/threat-command/command-injection-zimbra-cve-2026-73570"]
  - claim_id: 2a18f230f6
    entry: 2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited
    surface: "record 2026-10-24T03:44:32Z"
    kind: record-summary
    text: "Elastic Security Labs reproduced the chain and found that several public proofs of concept never trigger it, so a failed test does not show a host is patched; its process-lineage detection for the Swatchdog notification path is added to the detection guidance."
  - claim_id: daa96c4094
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "summary"
    kind: frontmatter
    text: "PK Softech AG, the software supplier of Publica and other Swiss pension funds, says unknown attackers used malware to reach part of its IT and that data must be assumed to have left; the Confederation headlined its 2026-10-08 release \"data outflow confirmed\", and the Federal Prosecutor's Office is investigating. Tamedia reports that PK Softech had confirmed in writing in January 2026 that it deleted Publica's 2019 migration data, which apparently stayed on its servers, and that Akira holds about 100 GB and demands ransom; Inside IT relays this and adds that the Federal Prosecutor's Office confirmed Akira took data, and Netzwoche relays that the authorities assume data on practically all current and former federal and federally affiliated staff left. Publica says personal data of insured persons has presumably left; the Pensionskasse Stadt Zürich says its insured persons' test data was stolen, the Pensionskasse Post says personal data left, the Bernische Pensionskasse says it must be assumed so, the Ticino fund IPCT says data of about 1,800 of its insured persons sat on the attacked server and writes to all its insured because it cannot exclude more, and other funds are still checking. As of 2026-10-22 neither the Confederation nor Publica has itself named the actor or the demand."
  - claim_id: a620d1543a
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "actions[0]"
    kind: frontmatter
    text: "Tell the helpdesk, HR and payroll teams of every body whose staff are insured with Publica (including the federal administration and the ETH domain) or with the Pensionskasse Stadt Zürich, which says data of its insured persons and pensioners was stolen, that AHV number, date of birth, address, salary and IBAN may now be known to criminals and must not count as proof of identity, and route requests that quote them, a request to change a payout account included, to a call-back on a known number; for staff insured with Pensionskasse Post, the Bernische Pensionskasse (which now says it must be assumed personal data left), the Ticino cantonal fund IPCT (which found data of about 1,800 of its insured persons on the attacked server and writes to all its insured because it cannot exclude more), a fund administered or advised by Libera AG or the Bernische Lehrerversicherungskasse apply the same rule until those funds report the scope; also tell insured staff that cantonal police warn of investment-fraud calls from people who know their salary and pension details, which prove nothing about the caller."
  - claim_id: c16511653c
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "actions[1]"
    kind: frontmatter
    text: "If your organisation's pension administration, HR or payroll runs on PK Softech software, is being migrated to it or tested on it, or your staff are insured with Pensionskasse Post, ask the supplier or the fund in writing whether your data, test data included, was in the affected environment, project, test and migration copies included, and what it holds outside the productive system."
