    text: "**Defender takeaway:** move FortiSandbox to 5.0.7 or 4.4.10 (PaaS 4.4 migrates) and FortiSIEM 7.5.0 to 7.5.1, treating the FortiSIEM upgrade or the port restriction as out of cycle now that a proof of concept is public; a FortiSandbox at 5.0.6 or 4.4.9 still needs this upgrade ("
