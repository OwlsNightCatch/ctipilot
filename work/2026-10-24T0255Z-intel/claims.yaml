    surface: "body"
    kind: cited
    text: "For other Ruby applications that compile attacker-controlled patterns, Ruby recommends upgrading to 4.0.9, 3.4.12 or 3.3.13 or later, or avoiding compiling such patterns, and says neither Regexp.timeout nor a pattern-length limit reliably protects; Ruby has not requested CVE identifiers of its own for now and tells operators to track the issues under GitLab's identifiers ("
