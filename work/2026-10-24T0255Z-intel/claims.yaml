  - claim_id: ddbff9b567
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "summary"
    kind: frontmatter
    text: "The PHP project released 8.5.12, 8.4.27, 8.3.36 and 8.2.35 on 2026-10-21 to fix CVE-2026-109618 and CVE-2026-109619 (CVSS 4.0 9.2), two flaws in the runtime itself that allow unauthenticated remote code execution as the web worker account, most directly on Apache mod_php; PHP 8.1 and older get no upstream release. Attack traffic is reported and public proofs of concept circulate: Palo Alto Networks' Unit 42 reports a confirmed intrusion of a European government entity with agentic post-exploitation, from its own telemetry and without naming the victim or the flaw that gave the foothold, while CrowdStrike, Sophos and Wordfence report no successful exploitation, and VulnCheck holds a working exploit for PHP 8.4.10 to 8.4.26 and 8.5.10 to 8.5.11 on mod_php. PHP also published an informational advisory for a third code-execution path, CVE-2026-115560, that the October releases do not fix: keep session.upload_progress.enabled=0 until the next regular release. BACS knows of no attack in Switzerland but says PHP applications of the federal administration were affected and that it has no complete overview of the update status; Swiss cantons, universities, the host Cyon with more than 100,000 sites, the Lodur fire-brigade platform and Publica took sites offline as a precaution."
  - claim_id: ecd645e617
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "actions[0]"
    kind: frontmatter
    text: "Update the PHP runtime, not the CMS or its plugins, on every internet-facing server and container image to 8.5.12, 8.4.27, 8.3.36 or 8.2.35 or to your distribution's patched package, restart PHP-FPM, Apache and every long-running worker, rebuild images, and confirm the running version, because a distribution backport can keep the old version string; isolate any application that cannot be updated from public networks until it is."
  - claim_id: 3dcdf4e309
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "actions[1]"
    kind: frontmatter
    text: "After updating, set session.upload_progress.enabled=0 on every PHP host and keep it there until PHP's next regular bugfix release: CVE-2026-115560, which the October releases do not fix, needs session upload progress to be enabled."
  - claim_id: 8e69156052
