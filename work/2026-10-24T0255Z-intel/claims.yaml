  - claim_id: 5893f0685c
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "headline"
    kind: frontmatter
    text: "Node2Shell: crafted Brotli data runs code in Node.js; update the runtime and the PyPI Brotli packages"
  - claim_id: c559576f02
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "summary"
    kind: frontmatter
    text: "Node.js released 22.23.4, 24.22.1 and 26.12.1 on 2026-10-21 to fix CVE-2026-111497, an out-of-bounds write in its bundled Brotli decoder that can lead to remote code execution, and Imperva ran code through it against the official Node.js 24.22.0 image via fetch() and Express 5 or body-parser 2 request bodies. The flaw is in the upstream Brotli library, so the PyPI packages Brotli (fixed in 1.2.1) and brotlicffi (fixed in 1.2.1.0) carry it too; no source reports exploitation."
  - claim_id: 164f373b11
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "actions[0]"
    kind: frontmatter
    text: "Update every Node.js 22.x, 24.x and 26.x runtime to 22.23.4, 24.22.1 or 26.12.1, including the Node binary inside container images, which a package inventory misses, and upgrade the PyPI Brotli package to 1.2.1 and brotlicffi to 1.2.1.0 wherever either is installed; move any application on an end-of-life Node.js line to a supported release."
  - claim_id: 100c14e1a0
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "cves[CVE-2026-111497]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-111497\", \"cvss\": \"9.2 (CVSS 4.0)\", \"status\": [\"patch-available\"], \"affected\": \"Node.js 22.x, 24.x and 26.x before 22.23.4, 24.22.1 and 26.12.1; Google Brotli 1.0.3 to 1.2.0; PyPI Brotli up to 1.2.0; PyPI brotlicffi up to 1.2.0.2\", \"fixed\": \"Node.js 22.23.4, 24.22.1, 26.12.1; Google Brotli 1.0.10, 1.1.1, 1.2.1; PyPI Brotli 1.2.1; PyPI brotlicffi 1.2.1.0\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
  - claim_id: 13c835c243
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "body"
    kind: cited
    text: "Node.js shipped security releases on 2026-10-21 for CVE-2026-111497, an out-of-bounds write in the Brotli decoder it bundles: an invalid block switch was reported as a need for more input instead of a format error, so the streaming decoder kept appending input to an eight-byte internal buffer ("
    urls: ["https://nodejs.org/en/blog/vulnerability/october-2026-security-releases"]
  - claim_id: fad64aa6af
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "body"
    kind: cited
    text: "An attacker who can supply Brotli data that an application decompresses with the node:zlib module can corrupt process memory, which can lead to a crash, disclosure of process memory or remote code execution ("
    urls: ["https://nodejs.org/en/blog/vulnerability/october-2026-security-releases"]
  - claim_id: c8aa9e7957
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "body"
    kind: cited
    text: "Node.js rates it high ("
    urls: ["https://nodejs.org/en/blog/vulnerability/october-2026-security-releases"]
  - claim_id: 2c2c969c10
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "body"
    kind: cited
    text: "), and the Google CNA record scores it CVSS 4.0 9.2 with no authentication and no user interaction ("
    urls: ["https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-108169"]
  - claim_id: 106e27d459
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "body"
    kind: cited
    text: "Imperva ran code carried in Brotli data against the official Node.js 24.22.0 Linux arm64 image, both through the built-in fetch() consuming a compressed response and through Express 5.0.0 to 5.3.0 and body-parser 2.0.0 to 2.3.0 request-body parsers (raw() and json()); execution took several attempts, and the fixed 24.22.1 rejected the same input ("
    urls: ["https://www.imperva.com/blog/node2shell-from-brotli-data-to-remote-code-execution/"]
  - claim_id: 4879248df2
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "body"
    kind: cited
    text: "A bare Node.js HTTP server does not decode an incoming Brotli body on receipt, so the request path needs those parsers ("
    urls: ["https://www.imperva.com/blog/node2shell-from-brotli-data-to-remote-code-execution/"]
  - claim_id: 1ed5ea8211
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "body"
    kind: cited
    text: "Fixes are in Node.js 22.23.4, 24.22.1 and 26.12.1, whose release notes list CVE-2026-111497 as a high-severity Brotli fix ("
    urls: ["https://nodejs.org/en/blog/release/v22.23.4/", "https://nodejs.org/en/blog/release/v24.22.1/", "https://nodejs.org/en/blog/release/v26.12.1/"]
  - claim_id: 382e8b6097
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "body"
    kind: cited
    text: "); end-of-life lines are always affected when a security release occurs ("
    urls: ["https://nodejs.org/en/blog/vulnerability/october-2026-security-releases"]
  - claim_id: eba4a55247
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "body"
    kind: cited
    text: "The decoder is Google's, so the flaw reaches beyond Node.js: Google released Brotli 1.2.1 on 2026-10-21 and lists CVE-2026-111497 in its release as an out-of-bounds write that permits remote code execution ("
    urls: ["https://github.com/google/brotli/releases/tag/v1.2.1"]
  - claim_id: 40a947d98c
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "body"
    kind: cited
    text: "), and the CVE record covers Brotli 1.0.3 to 1.2.0, fixed in 1.0.10, 1.1.1 and 1.2.1 ("
