    kind: derived
    text: "**Exposure:** a service on Node.js 22.x, 24.x or 26.x below the fixed releases that decodes Brotli from an untrusted party, either request bodies inflated by Express 5 or body-parser 2 or compressed responses that fetch() consumes from a server an attacker influences, and Python code that decompresses untrusted data with the PyPI Brotli or brotlicffi packages."
