    entry: 2026-10-22/pan-os-panorama-php2shell-mgmt-interface-no-fixed-release
    surface: "summary"
    kind: frontmatter
    text: "Palo Alto Networks' advisory of 2026-10-21, revised on 2026-10-24, lists every release of PAN-OS 12.2, 12.1, 11.2, 11.1 and 10.2 as affected by the two PHP runtime flaws, CVE-2026-109618 and CVE-2026-109619, and notes that the issue applies to PAN-OS software on PA-Series and VM-Series firewalls and on Panorama; no fixed build is released, hotfixes for each PAN-OS train carry estimated dates from 2026-10-26 to 2026-10-30, and the table no longer distinguishes Panorama, which the note and the mitigation text cover together with PAN-OS. The WildFire appliances WF-500 and WF-500-B, which an earlier revision of 2026-10-23 listed as affected, are now listed as unaffected after a correction its timeline dates 2026-10-23. Cortex XCORE (SaaS) and WildFire Cloud were already remediated. The PAN-OS exposure is the management web interface (the HTTPS web UI and the XML API service); Palo Alto scores the PAN-OS impact as availability only, CVSS-B 8.7 where management is reachable from the internet and 7.1 behind a jump box, against 9.2 for the PHP flaws themselves, and knows of no malicious exploitation against its products. GlobalProtect and the captive portal are not affected."
