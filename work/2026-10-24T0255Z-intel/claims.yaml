  - claim_id: ff3170fa0d
    entry: 2026-10-22/cve-2026-110264-gitlab-org-mode-renderer-unauth-rce
    surface: "summary"
    kind: frontmatter
    text: "GitLab's critical patch release of 2026-10-21 fixes CVE-2026-110264 (CVSS 3.1 10.0), an integer overflow in regular-expression handling that lets an unauthenticated user run code on a self-managed GitLab server as the git user; GitLab's own detection write-ups place it in the rendering of .org files, which needs only a public project that can hold the payload. Every version from 7.0 before 18.11.13, 19.0.10, 19.1.9, 19.2.9, 19.3.6, 19.4.3 and 19.5.1 is affected, so instances on the 19.4.2, 19.3.5 and 19.2.8 builds that closed the earlier regular-expression flaws still need this release. The bug sits in Ruby's own regular-expression engine, which Ruby fixed on 2026-10-23 in 4.0.9, 3.4.12 and 3.3.13, so any Ruby application that compiles attacker-controlled patterns is exposed to it. GitLab does not report exploitation."
  - claim_id: 4a3ba969fd
    entry: 2026-10-22/cve-2026-110264-gitlab-org-mode-renderer-unauth-rce
    surface: "cves[CVE-2026-110264]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-110264\", \"cvss\": \"10.0 (CVSS 3.1)\", \"status\": [\"patch-available\"], \"affected\": \"all versions from 7.0 before 18.11.13, 19.0 before 19.0.10, 19.1 before 19.1.9, 19.2 before 19.2.9, 19.3 before 19.3.6, 19.4 before 19.4.3, and 19.5 before 19.5.1\", \"fixed\": \"19.5.1, 19.4.3, 19.3.6, 19.2.9, 19.1.9, 19.0.10, 18.11.13; the underlying Ruby fix is in Ruby 4.0.9, 3.4.12 and 3.3.13 (Ruby 4.0.8 lacks it)\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
  - claim_id: 4e8083216e
    entry: 2026-10-22/cve-2026-110264-gitlab-org-mode-renderer-unauth-rce
