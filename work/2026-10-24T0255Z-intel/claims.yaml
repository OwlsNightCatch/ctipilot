    surface: "section 2026-10-24T03:42:57Z"
    kind: cited
    text: "Ruby's table gives the first release of each series that carries each fix: the fix for CVE-2026-110264 first appears in 4.0.9, so 4.0.8 is not enough, and 3.4.12 and 3.3.13 carry all of them; GitLab fixed its own servers by patching the Ruby it ships ("
    urls: ["https://www.ruby-lang.org/en/news/2026/10/23/regexp-fixes-for-gitlab-cves/"]
  - claim_id: 8b5f1865e7
    entry: 2026-10-22/cve-2026-110264-gitlab-org-mode-renderer-unauth-rce
    surface: "section 2026-10-24T03:42:57Z"
    kind: cited
    text: "The advisory widens the exposure beyond GitLab to any Ruby application that compiles a regular expression from a string an attacker controls, says Regexp.timeout does not protect against these bugs and that limiting pattern length does not reliably protect, and says Ruby has not requested CVE identifiers of its own and that operators should track the issues under GitLab's identifiers ("
    urls: ["https://www.ruby-lang.org/en/news/2026/10/23/regexp-fixes-for-gitlab-cves/"]
  - claim_id: cca79639da
    entry: 2026-10-22/cve-2026-110264-gitlab-org-mode-renderer-unauth-rce
