    surface: "section 2026-10-24T03:40:10Z"
    kind: cited
    text: "The attacker used the key on 2026-10-10 to obtain an organization owner's GitHub CLI token, so access began eleven days before the release, and the same day throwaway branches in two repositories ran workflows that posted CI secrets to an external capture endpoint and were deleted minutes later, yielding the tokens of two further maintainers ("
    urls: ["https://docs.litellm.ai/blog/security-incident-oct-21-2026-attack-chain"]
