  - claim_id: b2141965f9
    entry: 2026-10-21/teamupdraft-updraftcentral-stolen-keys-backdoor-plugins
    surface: "summary"
    kind: frontmatter
    text: "TeamUpdraft, the vendor of the UpdraftPlus backup plugin, says unauthorised access to teamupdraft.com on 17 and 18 October probably exposed its customer database, including UpdraftCentral connection keys, and Patchstack and Nethemba report an attacker using those keys to install backdoor plugins on connected WordPress sites, which Patchstack's telemetry dates from 2026-10-18 15:32 (it gives no time zone), and that create hidden administrators. It is not a flaw in UpdraftPlus: the plugin obeys commands signed with a valid key, a key exists on many sites that never used the service because connecting a teamupdraft.com account ticks the option by default, and the vendor's fix and the discoverer's reading of it disagree on which keys the update removes. TeamUpdraft says the attacker used a compromised key to enter its own site, and Nethemba saw the stolen keys used again on 2026-10-21, after 1.26.13 shipped."
  - claim_id: da45506bc1
    entry: 2026-10-21/teamupdraft-updraftcentral-stolen-keys-backdoor-plugins
    surface: "body"
    kind: cited
    text: "Patchstack reports that an attacker holding valid UpdraftCentral dashboard keys has been installing backdoor plugins on connected WordPress sites since 2026-10-18 at 15:32 (the page gives no time zone), and that this is not a vulnerability in UpdraftPlus: the UpdraftCentral client ships inside every copy of the plugin and executes any command signed with the dashboard's private key once the site holds a key ("
    urls: ["https://patchstack.com/articles/updraftcentral-key-compromise-wordpress-backdoors/", "https://www.bleepingcomputer.com/news/security/stolen-updraftcentral-keys-used-to-backdoor-wordpress-sites/"]
  - claim_id: 6c4e523880
    entry: 2026-10-22/pan-os-panorama-php2shell-mgmt-interface-no-fixed-release
    surface: "summary"
    kind: frontmatter
    text: "Palo Alto Networks' advisory of 2026-10-21, revised on 2026-10-24, lists every release of PAN-OS 12.2, 12.1, 11.2, 11.1 and 10.2 as affected by the two PHP runtime flaws, CVE-2026-109618 and CVE-2026-109619, and notes that the issue applies to PAN-OS software on PA-Series and VM-Series firewalls and on Panorama; no fixed build is released, hotfixes for each PAN-OS train carry estimated dates from 2026-10-26 to 2026-10-30, and the table no longer distinguishes Panorama, which the note and the mitigation text cover together with PAN-OS. The WildFire appliances WF-500 and WF-500-B, which an earlier revision of 2026-10-23 listed as affected, are now listed as unaffected after a correction its timeline dates 2026-10-23. Cortex XCORE (SaaS) and WildFire Cloud were already remediated. The PAN-OS exposure is the management web interface (the HTTPS web UI and the XML API service); Palo Alto scores the PAN-OS impact as availability only, CVSS-B 8.7 where management is reachable from the internet and 7.1 behind a jump box, against 9.2 for the PHP flaws themselves, and knows of no malicious exploitation against its products. GlobalProtect and the captive portal are not affected."
