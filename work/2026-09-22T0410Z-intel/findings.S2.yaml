  - title: "VBS closes administrative investigation into Swiss intelligence service's Cyber division and its past cooperation with Kaspersky — no evidence of mass data deletion, but Kaspersky-cooperation suspicions remain unresolved and a federal criminal probe continues"
    sources:
      - { url: "https://www.srf.ch/news/schweiz/spionage-affaere-im-ndb-vbs-legt-abschlussbericht-zur-cyberaffaere-im-ndb-vor", publisher: "SRF", date: "2026-09-21", role: "primary" }
      - { url: "https://www.watson.ch/schweiz/gesellschaft-politik/737167151-nachrichtendienst-durch-untersuchung-entlastet", publisher: "watson.ch", date: "2026-09-21", role: "corroborating" }
    discovery_trace: "first seen at: inside-it-ch, URL https://www.inside-it.ch/kein-beweis-fuer-datenabfluss-beim-nachrichtendienst-20260921 (RSS listing entry, article body 429-rate-limited on fetch) → primary: SRF, URL https://www.srf.ch/news/schweiz/spionage-affaere-im-ndb-vbs-legt-abschlussbericht-zur-cyberaffaere-im-ndb-vor → corroborating: watson.ch, URL https://www.watson.ch/schweiz/gesellschaft-politik/737167151-nachrichtendienst-durch-untersuchung-entlastet"
    summary: |
      The Swiss Federal Department of Defence, Civil Protection and Sport (VBS) published, on 2026-09-21, the final report of the administrative investigation Federal Councillor Martin Pfister ordered in summer 2025 into the Nachrichtendienst des Bundes (NDB, Swiss Federal Intelligence Service) Cyber division's past cooperation with the Russian cybersecurity vendor Kaspersky, covering roughly 2015-2020. The allegations under scrutiny were that the Cyber division shared classified/sensitive information (reporting describes this as arising from the division's technical cooperation and data exchange with Kaspersky, a foreign AV/threat-intel vendor) in a way that could have reached Russian intelligence services (including the GRU), and that large-scale deletion of related data followed. The administrative investigation found no evidence of large-scale ("im grossen Stil") data deletion and no fundamentally new findings beyond the already-known allegations, but VBS states explicitly that "certain uncertainties remain regarding the suspected misconduct in the former Cyber division's cooperation with Kaspersky." Separately and independently, the Office of the Attorney General (Bundesanwaltschaft) has been running a criminal investigation for about a year into whether classified information was systematically shared with Kaspersky and could have reached Russian intelligence — that investigation continues and is unaffected by the administrative report's conclusions. NDB's director and communications lead confirmed prior remediation recommendations have been implemented and that the service's broader reorganisation is due to complete by end-2026. For Swiss public-sector defenders the transferable point is third-party/vendor-trust governance: the exposure here originates from a federal agency's own historical technical cooperation and data-sharing arrangement with a foreign-headquartered security vendor, not from an external intrusion — the same class of vendor-trust question raised generically by Western governments' Kaspersky-product bans, but landing here as a direct governance finding on a Swiss federal intelligence body itself.
