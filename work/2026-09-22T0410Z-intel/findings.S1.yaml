    extended_notes: |
      German-language evidence quote translates as: "The terse description of the flaws on Synology's advisory
      page is likely to quickly draw ransomware authors and other criminals, since exploitation is, according
      to Synology, very easy." heise separately notes several readers pointed out the 2026-09-18 advisory
      targets older DSM baselines — DSM 7.4.1-90080 has been current since July 2026 — so an estate already on
      the latest supported build may already be unaffected; confirm the running build against the advisory's
      "Affected Products" table rather than assuming currency from a recent-looking version string. No public
      PoC or scanning activity reported yet for either critical CVE as of source dates (2026-09-18); given the
      SCGI/login-logic surface is likely reachable pre-auth on any DSM instance with the standard web/DSM
      management port open, recommend treating this as urgent-patch (not wait-for-next-maintenance-window),
      consistent with heise's own framing.

