    extended_notes: |
      Attack-vector nuance for the composer: CVSS vector is AV:A (adjacent network), i.e. the CGI endpoint is
      reachable only from a host already on the same L2/LAN segment as the switch's management interface —
      NOT directly internet-exposed by default. This still clears the bar because (a) confirmed ITW
      exploitation at scale (996 devices/48 countries) and a fresh CISA KEV listing with a 3-day due date make
      this squarely PD-11(b) regardless of the network position, and (b) many GS1900 deployments put the web
      management UI on a flat/trusted VLAN reachable from any already-compromised host, or misconfigure NAT/
      port-forwarding onto WAN for remote admin — exactly the scenario 564/996 factory-default-credential
      victims suggest. Detection concept: outbound TFTP GET requests (UDP/69, or non-standard ports as
      observed here — src used tftp -l on a numeric high port 6969 in the observed chain) originating FROM a
      network-switch management IP is anomalous and a strong hunt signal; likewise a switch's on-device shell
      invoking `/bin/sh` against a freshly TFTP-retrieved file. Hardening: patch to the per-model "…(x).2C0"
      build; segment switch management interfaces onto a dedicated out-of-band management VLAN with ACLs
      denying general-LAN access to the CGI/web-admin port; rotate any credential that may have shipped as
      factory-default, and treat any GS1900 that was reachable and unpatched between 2026-06-16 (disclosure)
      and patch application as a candidate for compromise assessment (config/credential exfiltration leaves
      no persistent artifact on the switch itself per GreyNoise's write-up — the exposure is retroactive
      credential/config compromise, not an implant). Background-only source (Acronis, published 2026-09-13,
      outside this run's 26h window) is cited solely to substantiate the "Red Heron" actor-overlap claim
      GreyNoise itself makes — it is not itself proposed as an in-window finding.

  - title: "CVE-2026-13684 / CVE-2026-13639 — Synology DSM: two unauthenticated CVSS 9.8 flaws (SCGI output-encoding bug, insufficient login-logic entropy) allow remote arbitrary file read/write and DoS with no credentials"
    sources:
      - { url: "https://www.synology.com/en-global/security/advisory/Synology_SA_26_13", publisher: "Synology PSIRT", date: "2026-09-18", role: "primary" }
      - { url: "https://services.nvd.nist.gov/rest/json/cves/2.0?cveId=CVE-2026-13684", publisher: "NVD", date: "2026-09-18", role: "corroborating" }
      - { url: "https://www.heise.de/news/Jetzt-aktualisieren-Angreifer-konnten-beliebige-Daten-von-Synology-NAS-auslesen-11458757.html", publisher: "heise online", date: "2026-09-18", role: "corroborating" }
    discovery_trace: "first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/12960 (NCSC Switzerland CSH advisory post, created 2026-09-21T11:24:44Z) → cross-confirmed same-day by anssi-fr, URL https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-1209/ → primary: Synology PSIRT advisory, URL https://www.synology.com/en-global/security/advisory/Synology_SA_26_13 → primary: NVD CVE record, URL https://services.nvd.nist.gov/rest/json/cves/2.0?cveId=CVE-2026-13684 → corroborating: heise online, URL https://www.heise.de/news/Jetzt-aktualisieren-Angreifer-konnten-beliebige-Daten-von-Synology-NAS-auslesen-11458757.html"
    summary: |
      Synology disclosed eight CVEs in DiskStation Manager (DSM) on 2026-09-18 (Synology-SA-26:13), two of
      them unauthenticated and CVSS3.1 9.8 (AV:N/AC:L/PR:N/UI:N, full C/I/A impact): CVE-2026-13684 (CWE-116,
      improper encoding/escaping of output in the SCGI component) and CVE-2026-13639 (CWE-331, insufficient
      entropy in the login logic) each let a remote, unauthenticated attacker read or write arbitrary files
      on the NAS and conduct denial-of-service. Two further flaws need only a low-privileged authenticated
      session — CVE-2026-13673 (CVSS 8.8, CWE-732 incorrect permission assignment in the LDAP API) and
      CVE-2026-6205 (CVSS 8.1, CWE-73 external control of file name/path in the Upload API), both also
      yielding arbitrary file read/write plus DoS. All four are fixed in DSM 7.4-90075, 7.3.2-86009-4,
      7.2.2-72806-9 and 7.2.1-69057-12; Synology lists no mitigation for the unauthenticated pair. NVD's SSVC
      assessment records exploitation status as "none" as of 2026-09-18, and NCSC Switzerland's advisory
      (published into its Cyber Security Hub on 2026-09-21, three days after Synology's original release)
      likewise records current exploitation status as unknown/unconfirmed — this is a newly-disclosed, not-yet
      -exploited pair of pre-auth critical flaws, surfaced to this pipeline via the national-CERT relay. heise
      online's coverage (also 2026-09-18) explicitly flags the risk profile: the vendor's own advisory
      language implies trivial exploitability, which the outlet expects to draw ransomware operators quickly.
      Synology NAS devices are commonly placed with remote/WAN-facing access enabled for off-site backup and
      file-sync use cases, making the unauthenticated pair's true internet-exposure a function of each
      deployment's own QuickConnect/port-forwarding configuration rather than a DSM default.
    region_nexus: "global; DSM is a widely deployed SMB/branch-office/home-office NAS platform plausible across Swiss cantonal and communal IT estates and their suppliers"
    primary_sector_nexus: "indirect — general-purpose network-attached storage infrastructure, not sector-specific"
