items:
  - title: "UPDATE: Windows Netlogon RCE (CVE-2026-41089, CVSS 9.8) confirmed actively exploited by CCB Belgium — CERT-EU advisory 2026-007 issued 10 June"
    sources:
      - url: "https://cert.europa.eu/publications/security-advisories/2026-007/"
        publisher: "CERT-EU"
        date: "2026-06-10"
        role: "primary"
      - url: "https://www.bleepingcomputer.com/news/microsoft/critical-windows-netlogon-remote-code-execution-flaw-now-exploited-in-attacks/"
        publisher: "BleepingComputer"
        date: "2026-06-10"
        role: "corroborating"
      - url: "https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-41089"
        publisher: "Microsoft MSRC"
        date: "2026-05-12"
        role: "vendor-advisory"
    discovery_trace: "first seen at: ncsc-csh (bridge:cert-eu recent), CERT-EU feed item 2026-007 → CERT-EU advisory URL https://cert.europa.eu/publications/security-advisories/2026-007/ fetched → CCB Belgium active-exploitation attribution sourced, BleepingComputer corroborating"
    summary: |
      CERT-EU issued advisory 2026-007 on 10 June 2026 confirming that CVE-2026-41089 — a stack-based buffer overflow (CWE-121) in Windows Netlogon — is being actively exploited in the wild per Belgium's Centre for Cybersecurity (CCB). The flaw was disclosed by Microsoft on 12 May 2026 (CVSS 3.1 9.8, AV:N/AC:L/PR:N/UI:N). An unauthenticated remote attacker can send crafted Netlogon RPC packets to obtain SYSTEM-level code execution on any unpatched domain controller. The vulnerable channel is the Netlogon RPC stack, historically targeted by ZeroLogon-class attacks. Affected versions span all supported Windows Server releases: 2012 R2, 2016 (before 10.0.14393.9140), 2019 (before 10.0.17763.8755), 2022 (before 10.0.20348.5074), 2022 23H2, and 2025 (before 10.0.26100.32772). Detection: monitor Event ID 4742 and Netlogon service channel establishment anomalies; EDR parent-process chains for lsass.exe spawning unexpected children; Windows Defender ATP "Suspicious Netlogon traffic" alert class. Hardening: immediate application of May 2026 CU is the only fix; isolate DCs from untrusted network segments as interim measure.
    ch_eu_nexus: "Direct EU/CH public-sector impact — every unpatched domain controller is at risk; CCB is the Belgian federal CERT, confirming in-the-wild exploitation in the EU"
    public_sector_nexus: "direct"
    sector: "all sectors, critical for public-sector AD-dependent environments"
    cves: [CVE-2026-41089]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "update-to-prior:2026-W23"
    evidence:
      - quote: "According to The Centre for Cybersecurity Belgium (CCB), this vulnerability is currently exploited by threat actors. It is strongly recommended updating affected Windows servers as soon as possible."
        attribution: "CERT-EU advisory 2026-007"
        source_url: "https://cert.europa.eu/publications/security-advisories/2026-007/"
      - quote: "CVE-2026-41089 in #Windows #Netlogon is now actively #exploited in the wild and could lead to #RCE. CVSS(3.1): 9.8. Patch as quickly as possible."
        attribution: "CCB Belgium (via BleepingComputer)"
        source_url: "https://www.bleepingcomputer.com/news/microsoft/critical-windows-netlogon-remote-code-execution-flaw-now-exploited-in-attacks/"

  - title: "Nightmare Eclipse 'RoguePlanet' zero-day: race condition in Microsoft Defender enables SYSTEM shell — unpatched, PoC published 9 June"
    sources:
      - url: "https://deadeclipse666.blogspot.com/"
        publisher: "Nightmare Eclipse (deadeclipse666)"
        date: "2026-06-09"
        role: "primary"
      - url: "https://security-hub.ncsc.admin.ch/#/posts/12622"
        publisher: "NCSC-CH GovCERT"
        date: "2026-06-10"
        role: "corroborating"
    discovery_trace: "first seen at: ncsc-csh (bridge:ncsc-csh recent), post 12622 → NCSC-CH advisory mentioning RoguePlanet hosted at https://git.churchofmalware.org/Nightmare_Eclipse/RoguePlanet → deadeclipse666.blogspot.com fetched → confirmed new zero-day disclosure"
    summary: |
      Security researcher Nightmare Eclipse published 'RoguePlanet' on 9 June 2026 — a proof-of-concept exploit targeting Microsoft Defender via a race condition that allows a local attacker to execute arbitrary code or spawn a command shell with SYSTEM-level privileges. No CVE has been assigned yet; Microsoft has not issued a patch. The researcher also disclosed 'GreatXML' on 10 June — a separate BitLocker bypass triggered on systems with a Windows Defender Offline Scan history, discovered in approximately 4 hours. NCSC-CH's GovCERT aggregated both disclosures on 10 June alongside other Nightmare Eclipse zero-days from June 2026 (YellowKey/CVE-2026-45585 and GreenPlasma/CVE-2026-50507 were patched in June Patch Tuesday; RoguePlanet remains unpatched). The PoC is hosted at git.churchofmalware.org and github.com/MSNightmare/RoguePlanet. Technique class: T1068 Exploitation for Privilege Escalation; attack surface is the Microsoft Defender service process (MsMpEng.exe), which runs as SYSTEM. Detection: Defender-specific process creation anomalies (MsMpEng.exe spawning cmd.exe/PowerShell); Security Event ID 4688 with unusual parent-process chain from Defender; Sysmon EID 1 filtering on image=MsMpEng.exe launching shells.
    ch_eu_nexus: "Global; Microsoft Defender is default-on across Swiss federal and EU public-sector Windows environments"
    public_sector_nexus: "direct"
    sector: "all"
    cves: []
    actors_campaigns_malware: ["RoguePlanet (Nightmare Eclipse)", "GreatXML (Nightmare Eclipse)"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "dubbed RoguePlanet. A privilege escalation affecting Microsoft Defender. Successful exploitation allows a local attacker to execute arbitrary code or spawn a command shell with SYSTEM-level privileges. The exploit leverages a race condition within Microsoft Defender"
        attribution: "NCSC-CH GovCERT post 12622"
        source_url: "https://security-hub.ncsc.admin.ch/#/posts/12622"
      - quote: "RoguePlanet (June 9, 2026) - Type: Race condition affecting Windows Defender - Impact: Remote code execution, local privilege escalation, BitLocker bypass - Status: Proof-of-concept released on GitHub - No CVE assigned"
        attribution: "Nightmare Eclipse blog (deadeclipse666)"
        source_url: "https://deadeclipse666.blogspot.com/"

  - title: "ServiceNow unauthenticated REST API exposure actively exploited in the wild — customer instance tables queried before June 5 patch"
    sources:
      - url: "https://thehackernews.com/2026/06/servicenow-flaw-exploited-to-gain.html"
        publisher: "The Hacker News"
        date: "2026-06-10"
        role: "primary"
      - url: "https://www.bleepingcomputer.com/news/security/servicenow-discloses-security-incident-exposing-customer-data/"
        publisher: "BleepingComputer"
        date: "2026-06-09"
        role: "corroborating"
      - url: "https://security-hub.ncsc.admin.ch/#/posts/12621"
        publisher: "NCSC-CH GovCERT"
        date: "2026-06-10"
        role: "corroborating"
    discovery_trace: "first seen at: ncsc-csh (bridge:ncsc-csh recent), post 12621 → https://security-hub.ncsc.admin.ch/#/posts/12621 body extracted → BleepingComputer and THN cited as supporting sources → both fetched and confirmed ITW exploitation"
    summary: |
      ServiceNow disclosed on 9 June 2026 that a misconfigured REST API endpoint (`/api/now/related_list_edit/create`) was set to `requires_authentication=false`, allowing unauthenticated attackers to query customer instance tables. The flaw primarily affects customers on the Australia platform release or those on older releases who made specific configuration changes. Malicious activity was observed from 2 June 2026; the researcher who discovered it submitted it to the bug bounty program on 3–4 June after ServiceNow was allegedly aware internally since 7 April. A security update was applied server-side to hosted instances on 5 June, changing the endpoint to require authentication. No CVE has been assigned. The exploiting requests required network access to the endpoint only; no authentication token was needed. ServiceNow instances at enterprise scale typically store IT support tickets, employee records, security incident reports, API tokens, and asset inventories. Technique class: T1190 Exploit Public-Facing Application; T1213 Data from Information Repositories. Detection: review ServiceNow audit logs for requests to `/api/now/related_list_edit` originating from unexpected IPs; enable table-access logging. Hardening: confirm all custom REST endpoints in your SN instance have `requires_authentication=true`; rotate credentials and API tokens stored in support workflows if you were on the Australia release or had the described configuration.
    ch_eu_nexus: "Global SaaS platform; ServiceNow is widely deployed across Swiss federal administration and EU public-sector IT"
    public_sector_nexus: "direct"
    sector: "public-sector, technology, finance"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "A REST endpoint (reportedly `/api/now/related_list_edit/create`) was configured with `requires_authentication=false`, allowing unauthenticated requests to access instance data and query customer tables. Current exploitation status: Actively Exploited"
        attribution: "NCSC-CH GovCERT post 12621"
        source_url: "https://security-hub.ncsc.admin.ch/#/posts/12621"
      - quote: "Attackers successfully queried customer instance tables. Malicious activity began June 2, 2026"
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/06/servicenow-flaw-exploited-to-gain.html"

  - title: "CVE-2026-5027 — Langflow path-traversal write-to-arbitrary-location actively exploited, ~7,000 exposed instances, no patch"
    sources:
      - url: "https://thehackernews.com/2026/06/unpatched-langflow-flaw-cve-2026-5027.html"
        publisher: "The Hacker News"
        date: "2026-06-10"
        role: "primary"
      - url: "https://www.tenable.com/security/research/tra-2026-26"
        publisher: "Tenable"
        date: "2026-03-27"
        role: "vendor-research"
      - url: "https://nvd.nist.gov/vuln/detail/CVE-2026-5027"
        publisher: "NVD/NIST"
        date: "2026-03-27"
        role: "cve-reference"
    discovery_trace: "first seen at: feed (TheHackersNews RSS), link https://thehackernews.com/2026/06/unpatched-langflow-flaw-cve-2026-5027.html fetched → Tenable advisory TRA-2026-26 and NVD cross-checked"
    summary: |
      CVE-2026-5027 (CVSS 8.8, CWE-22) is an unpatched path-traversal vulnerability in Langflow's `POST /api/v2/files` endpoint, disclosed by Tenable on 27 March 2026 after three failed disclosure attempts in January–February. The endpoint fails to sanitize the `filename` parameter in multipart form data, allowing attackers to write files to arbitrary filesystem locations via `../` sequences. Critically, Langflow enables unauthenticated auto-login by default, meaning a single unauthenticated HTTP request can obtain a valid session token and then chain into the file-write. Combined this gives pre-authentication arbitrary write, enabling RCE via webshell placement or cron-job injection. VulnCheck researchers confirmed active exploitation with test-file writes observed on victim systems. Censys shows approximately 7,000 Langflow instances publicly exposed, predominantly North America. No patch has been released. Langflow is widely deployed as an AI application orchestration layer in enterprise GenAI stacks. Technique: T1190; T1059 for follow-on shell; prerequisite is reachable web port. Detection: web server access logs for `POST /api/v2/files` with `../` in filename parameter; filesystem integrity monitoring on `langflow` data directory parents; Sysmon EID 11 (FileCreate) outside expected directories. Hardening: take Langflow off the internet or add WAF rule blocking path traversal in multipart; disable auto-login (`LANGFLOW_AUTO_LOGIN=false`); monitor Langflow logs for unexpected file creations.
    ch_eu_nexus: "Global; Langflow is commonly deployed in cloud and on-prem enterprise AI pipelines; MuddyWater has targeted Langflow CVEs in prior campaigns"
    public_sector_nexus: "indirect"
    sector: "technology, government, finance"
    cves: [CVE-2026-5027]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Because Langflow enables unauthenticated auto-login by default, no credentials are required to reach the vulnerable endpoint, and a single unauthenticated request is sufficient to obtain a valid session token before proceeding with exploitation."
        attribution: "The Hacker News (citing VulnCheck)"
        source_url: "https://thehackernews.com/2026/06/unpatched-langflow-flaw-cve-2026-5027.html"
      - quote: "Active exploitation in the wild was subsequently reported by VulnCheck researchers. Censys data reveals approximately 7,000 publicly exposed Langflow instances."
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/06/unpatched-langflow-flaw-cve-2026-5027.html"

  - title: "CVE-2026-25089 — FortiSandbox unauthenticated OS command injection in VNC handler (CVSS 9.8), patched 9 June"
    sources:
      - url: "https://fortiguard.fortinet.com/psirt/FG-IR-26-141"
        publisher: "Fortinet FortiGuard PSIRT"
        date: "2026-06-09"
        role: "primary"
      - url: "https://nvd.nist.gov/vuln/detail/CVE-2026-25089"
        publisher: "NVD"
        date: "2026-06-09"
        role: "cve-reference"
      - url: "https://thehackernews.com/2026/06/ivanti-fortinet-and-sap-release-patches.html"
        publisher: "The Hacker News"
        date: "2026-06-10"
        role: "corroborating"
    discovery_trace: "first seen at: feed (TheHackersNews RSS), link https://thehackernews.com/2026/06/ivanti-fortinet-and-sap-release-patches.html fetched → FG-IR-26-141 identified → https://fortiguard.fortinet.com/psirt/FG-IR-26-141 fetched → NVD cross-checked"
    summary: |
      Fortinet patched CVE-2026-25089 (CWE-78, OS Command Injection) on 9 June 2026 in FortiSandbox. The vulnerability resides in the VNC feature's HTTP request handler — specially crafted HTTP requests allow an unauthenticated remote attacker to execute arbitrary OS commands on the appliance. CVSS 3.1 score 9.8 (AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H), per Fortinet. Affected: FortiSandbox 4.2.x (all), 4.4.0–4.4.8, 5.0.0–5.0.5; FortiSandbox Cloud 5.0.4–5.0.5; FortiSandbox PaaS 5.0.4–5.0.5. Fixed: FortiSandbox 4.4.9, 5.0.6; Cloud/PaaS 5.0.6. No exploitation in the wild reported at time of disclosure; given the unauthenticated vector and pre-auth RCE class, rapid weaponization is expected. FortiSandbox is deployed for malware analysis and detonation across enterprise and public-sector SOC environments. Technique: T1190. Detection: HTTP access logs for crafted requests to the VNC handler endpoint; FortiGate/SIEM alert on inbound requests to FortiSandbox management. Hardening: upgrade to 4.4.9 / 5.0.6; restrict management-plane access to trusted ranges.
    ch_eu_nexus: "Fortinet is dominant in Swiss and EU public-sector network security; FortiSandbox is in active SOC deployments"
    public_sector_nexus: "direct"
    sector: "public-sector, technology, finance"
    cves: [CVE-2026-25089]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "An OS command injection flaw allows unauthenticated attackers to 'execute unauthorized commands via specifically crafted HTTP requests' in multiple FortiSandbox versions."
        attribution: "NVD/NIST (citing Fortinet FG-IR-26-141)"
        source_url: "https://nvd.nist.gov/vuln/detail/CVE-2026-25089"
      - quote: "The security flaw patched by Fortinet relates to a command injection vulnerability in FortiSandbox, FortiSandbox Cloud, and FortiSandbox PaaS WEB UI. It's tracked as CVE-2026-25089 (CVSS score: 9.1)."
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/06/ivanti-fortinet-and-sap-release-patches.html"

  - title: "Volt Typhoon / JDY botnet expands to 1,500+ SOHO/IoT devices for rapid post-disclosure reconnaissance (Black Lotus Labs)"
    sources:
      - url: "https://www.lumen.com/blog/en-us/expanded-jdy-iot-and-soho-botnet-enables-rapid-vulnerability-exploitation"
        publisher: "Lumen Black Lotus Labs"
        date: "2026-06-10"
        role: "primary"
      - url: "https://thehackernews.com/2026/06/china-linked-jdy-botnet-expands-to-1500.html"
        publisher: "The Hacker News"
        date: "2026-06-10"
        role: "corroborating"
    discovery_trace: "first seen at: feed (TheHackersNews RSS), link https://thehackernews.com/2026/06/china-linked-jdy-botnet-expands-to-1500.html fetched → Lumen Black Lotus Labs primary report URL identified → https://www.lumen.com/blog/en-us/expanded-jdy-iot-and-soho-botnet-enables-rapid-vulnerability-exploitation fetched and summarised"
    summary: |
      Lumen Black Lotus Labs published a detailed analysis on 10 June 2026 of the JDY botnet — a China-nexus (Volt Typhoon-linked) reconnaissance infrastructure comprising over 1,500 compromised SOHO and IoT devices, more than double its January 2024 size. JDY operates as a "centrally controlled, high-performance scanner" performing TCP/UDP/SSL/ICMP service fingerprinting, TLS certificate extraction, and protocol-specific banner matching, feeding intelligence to wider Volt Typhoon attack infrastructure. The botnet is architecturally distinct from KV-botnet (its predecessor) and now spans Cisco, Araknis, Draytek, Hikvision, Linksys, Ubiquiti, and Mimosa Networks devices on MIPS/MIPS64/MIPSEL architectures. A key operational finding: "scanning of Fortinet devices increased hours after disclosure" of CVE-2026-35616, demonstrating sub-24-hour post-disclosure scanning integration. C2 obfuscation uses hidden Tor nodes; reporting uses AES-encrypted compressed JSON with banner and certificate fields. Primary targeting is US military and associated entities but distributed European nodes indicate broader collection scope. Technique: T1595 Active Scanning; T1040 Network Sniffing (TLS capture). Detection: SOHO device outbound traffic patterns consistent with mass-scanning at unusual hours; TLS certificate capture from outbound connections; Netflow anomalies from edge devices doing SYN scanning. Hardening: update firmware on SOHO/IoT devices; segment edge devices from core infrastructure; monitor for unexplained high-rate outbound SYN packets.
    ch_eu_nexus: "European JDY nodes documented; Volt Typhoon targets European critical infrastructure adjacent to US-aligned organisations"
    public_sector_nexus: "indirect"
    sector: "government, defense, telco, critical infrastructure"
    cves: [CVE-2026-35616]
    actors_campaigns_malware: ["Volt Typhoon", "JDY botnet"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "The JDY botnet comprises over 1,500 SOHO and IoT devices and operates as a centrally controlled, high-performance scanner used to discover, fingerprint, and continuously map exposed services at scale"
        attribution: "Lumen Black Lotus Labs"
        source_url: "https://www.lumen.com/blog/en-us/expanded-jdy-iot-and-soho-botnet-enables-rapid-vulnerability-exploitation"
      - quote: "Scanning of Fortinet devices increased hours after disclosure of CVE-2026-35616, demonstrating rapid weaponization post-disclosure."
        attribution: "Lumen Black Lotus Labs"
        source_url: "https://www.lumen.com/blog/en-us/expanded-jdy-iot-and-soho-botnet-enables-rapid-vulnerability-exploitation"

