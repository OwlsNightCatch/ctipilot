    summary: |
      The Swiss Federal Cyber Security Office (BACS/NCSC-CH) published on 1 June 2026 a pre-event threat
      bulletin and updated its major-events cyber-resilience guidance ahead of the G7 summit in Évian-les-Bains
      (15–17 June 2026), organised by France near Geneva. BACS anticipates disruption attempts in cyberspace
      directed at the summit itself, participating organisations, and Swiss critical infrastructure in the
      Lake Geneva/Geneva corridor. The primary anticipated threat vectors are Distributed Denial-of-Service
      (DDoS) attacks by hacktivists and politically-motivated actors seeking media visibility, alongside
      targeted intrusion attempts against participating organisations and their digital supply chains.
      BACS is coordinating with French organisers, Swiss critical infrastructure operators, the Federal
      Office of Police (fedpol), the State Secretariat for Security Policy (SEPOS), the Swiss Armed Forces,
      the Federal Intelligence Service (FIS), and the Federal Office for Customs and Border Security (FOCBS).
      Published defensive guidance (PDF, 29 May 2026) covers DDoS mitigation, supply-chain vetting of
      digital services used during the event, privileged-account hygiene, and segregation of event networks.
      Comparable BACS advisories ahead of WEF 2026 (January) and UEFA EURO events have historically preceded
      confirmed DDoS campaigns against Swiss public-sector websites.
