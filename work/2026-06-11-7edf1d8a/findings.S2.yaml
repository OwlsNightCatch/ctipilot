  - title: "ServiceNow zero-auth API data breach actively exploited before patch — government, healthcare and enterprise instances hit"
    sources:
      - url: "https://www.bleepingcomputer.com/news/security/servicenow-discloses-security-incident-exposing-customer-data/"
        publisher: "BleepingComputer"
        date: "2026-06-09"
        role: "primary"
      - url: "https://thehackernews.com/2026/06/servicenow-flaw-exploited-to-gain.html"
        publisher: "The Hacker News"
        date: "2026-06-09"
        role: "corroborating"
      - url: "https://security-hub.ncsc.admin.ch/#/posts/12621"
        publisher: "NCSC-CH GovCERT Security Hub"
        date: "2026-06-10"
        role: "corroborating"
    discovery_trace: "first seen at: ncsc-ch-security-hub, bridge subcommand ncsc-csh recent 15 → post 12621 published 2026-06-10 → primary: BleepingComputer article 2026-06-09 → corroborating: THN 2026-06-09 and NCSC-CH post 12621"
    summary: |
      ServiceNow disclosed on 9 June 2026 that attackers exploited a zero-authentication flaw in the REST endpoint
      `/api/now/related_list_edit/create`, which was configured with `requires_authentication=false` on instances
      running the "Australia" platform release or on older releases that had applied certain configuration changes.
      Exploitation occurred between 2 and 3 June, approximately two weeks before any public disclosure and six weeks
      after a bug-bounty researcher submitted a confidential report on 22 April 2026. ServiceNow pushed a silent
      server-side patch to hosted instances on 5 June. The endpoint accepted unauthenticated HTTP GET/POST queries
      that returned arbitrary table data — effectively a full, unauthenticated GQL-style table dump. Instances
      commonly store IT service-desk tickets containing credentials, API tokens embedded in ticket descriptions,
      employee PII, asset inventory, security-incident records, and CMDB data. The vulnerability is particularly
      severe for public-sector deployments because EU and Swiss government bodies widely use ServiceNow for ITSM and
      HR workflows. NCSC-CH (post 12621, 10 June) flagged it as "Actively Exploited" and recommended reviewing
      `/api/now/related_list_edit` access logs, rotating all credentials and tokens surfaced in support workflows,
      and verifying that API logging is enabled. No CVE has been assigned yet; the vendor's gated advisory is
      KB3067321 (customer login required).
    ch_eu_nexus: "global; high EU/Swiss public-sector relevance — ServiceNow is a reference ITSM platform across Swiss Confederation, EU institutions, and cantonal administrations"
    public_sector_nexus: "direct"
    sector: "public-sector, government, healthcare, enterprise"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "ServiceNow is warning about a security incident after attackers exploited an unauthenticated access flaw through a vulnerable API endpoint, allowing them to query data from customer instances."
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/servicenow-discloses-security-incident-exposing-customer-data/"
      - quote: "A REST endpoint (reportedly /api/now/related_list_edit/create) was configured with requires_authentication=false, allowing unauthenticated requests to access instance data and query customer tables."
        attribution: "NCSC-CH GovCERT Security Hub (post 12621)"
        source_url: "https://security-hub.ncsc.admin.ch/#/posts/12621"
    extended_notes: |
      Defender takeaway: Query ServiceNow access logs for requests to `/api/now/related_list_edit` (or the
      `related_list_edit` table endpoint in general) originating from unexpected source IPs or from the Guest
      user account. Rotate all secrets stored in or referenced by ServiceNow ticket workflows — API keys, service
      account passwords, AWS/Azure credentials embedded in work notes. The gated nature of the vendor advisory
      (KB3067321 requires customer login) means many organisations received no proactive notification and may
      not know they were queried. ServiceNow's hosted SaaS patched automatically; on-premises instances need
      manual intervention.

  - title: "RoguePlanet — Nightmare Eclipse drops new Microsoft Defender TOCTOU race-condition LPE zero-day hours after Patch Tuesday, no CVE assigned"
    sources:
      - url: "https://www.bleepingcomputer.com/news/microsoft/microsoft-defender-rogueplanet-zero-day-grants-system-privileges/"
        publisher: "BleepingComputer"
        date: "2026-06-09"
        role: "primary"
      - url: "https://www.securityweek.com/new-windows-zero-day-exploit-rogueplanet-released/"
        publisher: "SecurityWeek"
        date: "2026-06-10"
        role: "corroborating"
      - url: "https://security-hub.ncsc.admin.ch/#/posts/12622"
        publisher: "NCSC-CH GovCERT Security Hub"
        date: "2026-06-10"
        role: "corroborating"
      - url: "https://www.helpnetsecurity.com/2026/06/10/microsoft-patch-tuesday-rogueplanet/"
        publisher: "Help Net Security"
        date: "2026-06-10"
        role: "corroborating"
    discovery_trace: "first seen at: ncsc-ch-security-hub, bridge subcommand ncsc-csh recent 15 → post 12622 published 2026-06-10 → primary: BleepingComputer 2026-06-09 → corroborating: SecurityWeek 2026-06-10, HelpNetSecurity 2026-06-10"
    summary: |
      On 9 June 2026 — hours after Microsoft shipped patches for two previously-disclosed Nightmare Eclipse
      exploits ("YellowKey" CVE-2026-45585 and "GreenPlasma" CVE-2026-50507) in June Patch Tuesday —
      the pseudonymous researcher "Nightmare Eclipse" (also tracked as "Chaotic Eclipse" / "Dead Eclipse")
      dropped a new working PoC dubbed "RoguePlanet" targeting a Time-of-Check/Time-of-Use (TOCTOU) race
      condition in the Microsoft Defender scan engine. The exploit redirects a file operation performed by
      the Defender service to execute attacker-controlled code at SYSTEM privilege level. Multiple independent
      researchers confirmed the PoC achieves local privilege escalation on fully-patched Windows 10 and 11
      with June 2026 cumulative updates installed. No CVE has been issued and Microsoft has not yet published
      a security advisory. The researcher was previously banned from GitHub and now hosts PoC code at
      `git.churchofmalware.org/Nightmare_Eclipse/RoguePlanet`. NCSC-CH GovCERT tracks this as an ongoing
      campaign of escalating disclosures (BlueHammer, RedSun, UnDefend in April; YellowKey, GreenPlasma in May;
      RoguePlanet in June). The researcher noted that in initial testing the flaw was confirmed as a remote
      code execution, but a May Defender update may have downgraded it to local only.
    ch_eu_nexus: "global; directly affects every Windows endpoint in Swiss/EU public-sector environments running Microsoft Defender (the default AV on all Windows workstations and servers)"
    public_sector_nexus: "direct"
    sector: "all sectors — Windows endpoint universal"
    cves: ["CVE-2026-45585", "CVE-2026-50507"]
    actors_campaigns_malware: ["Nightmare Eclipse"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "A security researcher has released a new Microsoft Defender zero-day exploit named 'RoguePlanet' just hours after Microsoft fixed two previously disclosed flaws during June 2026 Patch Tuesday."
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/microsoft/microsoft-defender-rogueplanet-zero-day-grants-system-privileges/"
      - quote: "RoguePlanet... abuses a race condition in Windows Defender to spawn a command shell running with SYSTEM-level privileges. Various researchers have confirmed that the PoC exploit works to achieve local privilege escalation."
        attribution: "Help Net Security"
        source_url: "https://www.helpnetsecurity.com/2026/06/10/microsoft-patch-tuesday-rogueplanet/"
    extended_notes: |
      Technique class: T1068 Exploitation for Privilege Escalation. TOCTOU race condition — attacker times a
      file-system operation to coincide with Defender's scheduled scan pass, substituting a malicious payload
      between check and use. Prerequisites: local code execution (standard user account sufficient);
      Microsoft Defender running (default on all Windows 10/11 and Server 2016+).
      Detection: Sysmon EID 1 — suspicious child process (`cmd.exe`, `powershell.exe`) spawning with
      parent image `MsMpEng.exe` (Defender scan engine). EDR behavioral rule: process with integrity level
      SYSTEM created from `MsMpEng.exe` parent. Windows Event Log 4688: process creation where
      `ParentProcessName` = `%ProgramFiles%\Windows Defender\MsMpEng.exe`.
      Hardening: Defender ASR rule `Block process creations originating from PSExec and WMI commands`
      (rule ID `d1e49aac-8f56-4280-b9ba-993a6d77406c`) may reduce blast radius. Monitor for Defender
      service file-write operations to temp directories.
      This is the seventh consecutive Nightmare Eclipse disclosure; the pattern suggests the researcher
      has a stable inventory of Defender vulnerabilities.

  - title: "ShinyHunters breaches Oracle PeopleSoft servers at 100+ organizations — universities and public-sector HR/student data stolen, Nottingham University confirmed"
    sources:
      - url: "https://www.bleepingcomputer.com/news/security/oracle-peoplesoft-servers-hacked-in-shinyhunters-data-theft-attacks/"
        publisher: "BleepingComputer"
        date: "2026-06-10"
        role: "primary"
      - url: "https://techcrunch.com/2026/06/10/cybercriminals-claim-breach-of-oracle-peoplesoft-servers-at-100-plus-organizations/"
        publisher: "TechCrunch"
        date: "2026-06-10"
        role: "corroborating"
    discovery_trace: "first seen at: WebSearch 'Oracle PeopleSoft ShinyHunters data theft breach June 2026' → primary: BleepingComputer 2026-06-10 → corroborating: TechCrunch 2026-06-10"
    summary: |
      The ShinyHunters extortion gang claimed on 10 June 2026 to have breached Oracle PeopleSoft servers
      at more than 100 organisations across approximately 300 instances, with the education sector bearing
      the majority of confirmed victims. The University of Nottingham publicly confirmed a cybersecurity
      incident; ShinyHunters stated Nottingham's data had been published on their leak site. The campaign
      targets both cloud-hosted and on-premises PeopleSoft deployments. ShinyHunters describes exploiting
      a "gadget chain" of combined old and zero-day vulnerabilities; their tooling attempts SSH connections
      using common PeopleSoft/Oracle default service accounts (`psoft`, `oracle`, `linuxadm`) with
      password and key-based fallback. Exfiltrated data types — per messages sent to victims — include
      student records, applicant data, financial aid, immigration status, health records, and administrative
      data. Network infrastructure used by the attackers includes a TLS certificate with CN `azurenetfiles.net`,
      a domain previously linked to ShinyHunters operations. The original stated goal was to breach an FBI
      PeopleSoft instance; the member stated that attempt failed. No Oracle CVE advisory has been published;
      Oracle's Critical Patch Update schedule would not cover an emergency out-of-band situation unless Oracle
      issues a Security Alert. The EU nexus is significant: PeopleSoft Campus Solutions and HCM are widely
      deployed across European universities and public administrations for student records and HR.
    ch_eu_nexus: "global; strong EU/CH nexus — PeopleSoft is a reference ERP/HR/campus-management platform at Swiss and European universities and public administrations"
    public_sector_nexus: "direct"
    sector: "education, public-sector, healthcare"
    cves: []
    actors_campaigns_malware: ["ShinyHunters"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Oracle PeopleSoft servers are being targeted in ongoing data theft attacks by the ShinyHunters extortion gang, which claims to have stolen data from over 100 organizations."
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/oracle-peoplesoft-servers-hacked-in-shinyhunters-data-theft-attacks/"
      - quote: "The ShinyHunters hacking gang claims to have compromised the Oracle PeopleSoft servers of more than 100 organizations, including many universities."
        attribution: "TechCrunch"
        source_url: "https://techcrunch.com/2026/06/10/cybercriminals-claim-breach-of-oracle-peoplesoft-servers-at-100-plus-organizations/"
    extended_notes: |
      Technique class: T1190 Exploit Public-Facing Application; T1078.004 Valid Accounts (default service
      accounts); T1021.004 SSH lateral movement. Detection: monitor SSH authentication attempts from
      external IPs using PeopleSoft service account names; PeopleSoft application-server logs for unusual
      query volumes or out-of-hours bulk data retrieval; network egress anomalies (bulk data transfers to
      non-standard destinations). Hardening: rename or disable default PeopleSoft/Oracle OS service accounts;
      enforce SSH key-only authentication with hardware-bound keys; restrict PeopleSoft administrative
      interfaces to jump-host access only; enable PeopleTools security audit logging.

