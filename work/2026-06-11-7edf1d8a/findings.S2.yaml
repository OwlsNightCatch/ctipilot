  - title: "UPDATE: CVE-2026-41089 Windows Netlogon stack buffer overflow — CERT-EU issues fresh advisory; exploitation confirmed by Belgium CCB, all domain controllers from Server 2012 affected"
    sources:
      - url: "https://cert.europa.eu/publications/security-advisories/2026-007/"
        publisher: "CERT-EU"
        date: "2026-06-10"
        role: "primary"
      - url: "https://www.bleepingcomputer.com/news/microsoft/critical-windows-netlogon-remote-code-execution-flaw-now-exploited-in-attacks/"
        publisher: "BleepingComputer"
        date: "2026-06-01"
        role: "corroborating"
    discovery_trace: "first seen at: cert-eu bridge subcommand cert-eu recent 10 → advisory 2026-007 published 2026-06-10 → primary: CERT-EU advisory page → corroborating: BleepingComputer 2026-06-01 (exploitation confirmation)"
    summary: |
      CERT-EU published advisory 2026-007 on 10 June 2026 covering CVE-2026-41089, a CVSS 9.8 stack-based
      buffer overflow in the Windows Netlogon service affecting Windows Server 2012 through 2025 in their
      domain controller role. Microsoft patched the vulnerability in May 2026 Patch Tuesday (credited to
      Microsoft's Windows Attack Research & Protection team). The Centre for Cybersecurity Belgium (CCB)
      confirmed on 1 June 2026 — 20 days after patch release — that threat actors were actively exploiting
      unpatched domain controllers in the wild. CERT-EU's advisory (v1.0, 10 June) is their first formal
      advisory on the vulnerability and reflects the active exploitation status. The attack surface is a
      specially crafted Netlogon network packet sent unauthenticated to TCP port 445; successful exploitation
      achieves SYSTEM-level code execution within the LSASS context of the targeted domain controller,
      functionally equivalent to a full Active Directory forest compromise. Affected versions: Windows Server
      2012/2012 R2; Server 2016 (prior to 10.0.14393.9140); Server 2019 (prior to 10.0.17763.8755);
      Server 2022 (prior to 10.0.20348.5074); Server 2022 23H2 (prior to 10.0.25398.2330); Server 2025
      (prior to 10.0.26100.32772).
    ch_eu_nexus: "global; strong EU public-sector nexus — every Windows domain controller in EU/CH government environments is an affected asset"
    public_sector_nexus: "direct"
    sector: "public-sector, government, all sectors (universal Windows AD)"
    cves: ["CVE-2026-41089"]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "update-to-prior:2026-W23"
    evidence:
      - quote: "According to The Centre for Cybersecurity Belgium (CCB), this vulnerability is currently exploited by threat actors. It is strongly recommended updating affected Windows servers as soon as possible."
        attribution: "CERT-EU advisory 2026-007"
        source_url: "https://cert.europa.eu/publications/security-advisories/2026-007/"
    extended_notes: |
      Previously covered in the 2026-W23 weekly brief (summary key: CVE-2026-41089). CERT-EU's new
      advisory (10 June) is a material delta: it cites CCB's exploitation confirmation and provides the
      per-version patched-build table for all affected Windows Server releases.
      Detection: Network-based — monitor for crafted Netlogon/SAMR authentication requests to DC TCP/445
      from unexpected source IPs or at unusual hours; SIEM correlation rule on Windows Security Event
      4625 (failed logon) followed by SYSTEM-level process creation (4688, high privilege) within seconds.
      Sysmon EID 3 (network connection) to port 445 from non-DC server processes.
      Hardening: Apply May 2026 CU immediately to all DCs; consider isolating legacy Server 2012 DCs that
      are past ESU behind a management VLAN with firewall rules blocking direct Netlogon access from
      untrusted subnets.

