items:
  - title: "JDY botnet doubles to 1,500 compromised SOHO/IoT devices, enables China-nexus APT rapid exploitation of newly disclosed CVEs within hours"
    sources:
      - url: "https://www.lumen.com/blog/en-us/expanded-jdy-iot-and-soho-botnet-enables-rapid-vulnerability-exploitation"
        publisher: "Lumen / Black Lotus Labs"
        date: "2026-06-10"
        role: "primary"
      - url: "https://www.bleepingcomputer.com/news/security/china-linked-jdy-botnet-expands-targeting-of-us-military-networks/"
        publisher: "BleepingComputer"
        date: "2026-06-10"
        role: "corroborating"
    discovery_trace: "first seen at: hackernews RSS feed, item 2026-06-10 → primary: Lumen Black Lotus Labs, URL https://www.lumen.com/blog/en-us/expanded-jdy-iot-and-soho-botnet-enables-rapid-vulnerability-exploitation (fetched direct)"
    summary: |
      Lumen's Black Lotus Labs reports the JDY botnet — the surviving reconnaissance cluster from the KV-botnet ecosystem, previously linked to Volt Typhoon — has more than doubled from approximately 650 bots in January 2024 to over 1,500 compromised SOHO and IoT devices. The expanded botnet now spans vendors including Cisco, Araknis, Mimosa Networks, Ubiquiti, Draytek, Hikvision, and Linksys, broadening beyond its original Cisco RV320/RV325-only composition. JDY operators route C2 through hidden Tor services and use Platypus (open-source reverse-shell manager) to manage victim devices, distributing scanning and reconnaissance across US-hosted residential IP ranges to defeat geofencing and IP-reputation-based controls. The botnet performs multiprotocol service discovery, banner-grabbing, TLS certificate collection, and protocol fingerprinting at scale. Most notably, Black Lotus Labs observed a measurable spike in JDY scans targeting Fortinet equipment within hours of the public disclosure of CVE-2026-35616, confirming operators instrumentalise reconnaissance output to front-run patch cycles. Targeting shows a persistent focus on US military and associated-entity networks. The botnet is assessed with high confidence to support multiple China-nexus APT actors, continuing the lineage of the disrupted KV cluster. Defenders should treat JDY scanning noise as a precursor to targeted exploitation rather than generic internet background noise, and prioritise sub-24-hour patch deployment cycles for internet-facing network appliances following CVE disclosures. MITRE ATT&CK T1595.002 (Active Scanning: Vulnerability Scanning), T1590 (Gather Victim Network Information), T1584.005 (Compromise Infrastructure: Botnet).
    ch_eu_nexus: "global; European SOHO/IoT devices form part of the botnet's physical footprint; targeting patterns relevant to European government and critical-infrastructure networks"
    public_sector_nexus: "direct — botnet explicitly targets military and associated entities; EU/CH government edge appliances at risk of active post-recon exploitation"
    sector: "government, military, defense, critical-infrastructure, telco"
    cves: [CVE-2026-35616]
    actors_campaigns_malware: ["Volt Typhoon", "JDY botnet", "KV-botnet"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Black Lotus Labs has identified a resurgence and expansion of the JDY botnet, a covert network linked to Chinese nation-state-backed actors, including Volt Typhoon."
        attribution: "Lumen / Black Lotus Labs"
        source_url: "https://www.lumen.com/blog/en-us/expanded-jdy-iot-and-soho-botnet-enables-rapid-vulnerability-exploitation"
      - quote: "most notably, there was a selective increase in scans of Fortinet equipment immediately after the disclosure of a new vulnerability, indicating the ability and intent to find and exploit vulnerable devices before patches are widely applied"
        attribution: "Lumen / Black Lotus Labs"
        source_url: "https://www.lumen.com/blog/en-us/expanded-jdy-iot-and-soho-botnet-enables-rapid-vulnerability-exploitation"
    extended_notes: |
      The JDY cluster was first disclosed in December 2023 as part of the KV-botnet investigation. After the KV cluster (covert data-transfer network) was disrupted by US government takedown in early 2024, JDY continued as a persistent reconnaissance capability. The Platypus payload server on port 13339 is a concrete detection anchor — EDR/SIEM rule looking for outbound connections to port 13339 from SOHO/IoT devices would be a useful hunt artefact. NCSC-UK April 2026 guidance on defending against China-nexus covert networks (PDF referenced in primary) is cited as the defensive baseline.

  - title: "CVE-2026-5027 — Langflow unpatched path traversal (POST /api/v2/files) exploited in the wild, unauthenticated due to auto-login default; patch in v1.10.0"
    sources:
      - url: "https://www.bleepingcomputer.com/news/security/path-traversal-flaw-in-ai-dev-platform-langflow-exploited-in-attacks/"
        publisher: "BleepingComputer"
        date: "2026-06-10"
        role: "primary"
      - url: "https://nvd.nist.gov/vuln/detail/CVE-2026-5027"
        publisher: "NVD / NIST"
        date: "2026-06-10"
        role: "corroborating"
    discovery_trace: "first seen at: hackernews RSS (hackernews source-id), item 2026-06-10 → pivot: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/path-traversal-flaw-in-ai-dev-platform-langflow-exploited-in-attacks/ → NVD CVE verification"
    summary: |
      Attackers are actively exploiting CVE-2026-5027, a high-severity path traversal vulnerability in Langflow (CVSS v3.1 8.8, CWE-22), the widely adopted open-source low-code AI-application platform used to build LLM pipelines, RAG systems, and MCP-based agentic workflows. The vulnerable endpoint is `POST /api/v2/files`, which does not sanitise the `filename` parameter in multipart form data, allowing `../` traversal sequences to write files to arbitrary filesystem locations. Critically, Langflow's `LANGFLOW_AUTO_LOGIN` setting is enabled by default, meaning a single unauthenticated HTTP request can obtain a valid session token; there is effectively no authentication prerequisite to reach the file-write primitive. Tenable discovered and disclosed the flaw on March 27, 2026, after two months without vendor response (initial report January 2026). VulnCheck honeypots detected active exploitation — attackers are staging test files on victim systems, a precursor pattern to dropping webshells or executing code via `.pth` injection (analogous to the Hades PyPI campaign pattern). Langflow v1.9.0 / langflow-base 0.8.3 shipped a patch, and v1.10.0 was released June 10, 2026. With ~7,000 Langflow instances publicly exposed on Censys, any enterprise running Langflow as an AITM/RAG API gateway or internal AI-development platform should apply the patch urgently. Detection: web server logs for `POST /api/v2/files` with `filename` parameters containing `../` or `%2e%2e%2f`; filesystem monitoring for unexpected writes outside the Langflow data directory. MITRE T1190 (Exploit Public-Facing Application), T1505.003 (Web Shell).
    ch_eu_nexus: "global; Langflow is widely deployed as a developer/AI-pipeline platform in enterprise environments including EU public-sector AI initiatives"
    public_sector_nexus: "indirect — Langflow deployed in AI-enabled workflows at government agencies and research institutions"
    sector: "technology, AI/LLM development, public-sector"
    cves: [CVE-2026-5027]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "The 'POST /api/v2/files' endpoint does not sanitize the 'filename' parameter from the multipart form data, allowing an attacker to write files to arbitrary locations on the filesystem using path traversal sequences ('../')"
        attribution: "Tenable, quoted in BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/path-traversal-flaw-in-ai-dev-platform-langflow-exploited-in-attacks/"
      - quote: "Because Langflow enables unauthenticated auto-login by default, no credentials are required to reach the vulnerable endpoint, and a single unauthenticated request is sufficient to obtain a valid session token before proceeding with exploitation"
        attribution: "VulnCheck researcher Caitlin Condon, quoted in BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/path-traversal-flaw-in-ai-dev-platform-langflow-exploited-in-attacks/"
    extended_notes: |
      Prior Langflow CVEs exploited this year include CVE-2026-0770, CVE-2026-21445, CVE-2026-33017 (added to CISA KEV earlier in 2026), and legacy CVE-2025-3248. Iranian threat group MuddyWater is linked to continued exploitation of CVE-2025-3248 per VulnCheck. Pattern: Langflow is becoming a recurring exploitation surface for AI-platform attackers. EU environments deploying Langflow as an AI orchestration layer should evaluate exposure immediately.

  - title: "ServiceNow API endpoint exploitation — unauthenticated access to customer instance tables via misconfigured /api/now/related_list_edit/create; no CVE yet, patch applied June 5"
    sources:
      - url: "https://www.bleepingcomputer.com/news/security/servicenow-discloses-security-incident-exposing-customer-data/"
        publisher: "BleepingComputer"
        date: "2026-06-10"
        role: "primary"
      - url: "https://www.techtimes.com/articles/318166/20260610/servicenow-data-breach-gated-advisory-left-customers-unaware-exploited-zero-auth-api.htm"
        publisher: "TechTimes"
        date: "2026-06-10"
        role: "corroborating"
    discovery_trace: "first seen at: hackernews RSS, item 2026-06-10 → primary: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/servicenow-discloses-security-incident-exposing-customer-data/ (fetched via bridge, returned 200 at metadata level)"
    summary: |
      ServiceNow disclosed a security incident in which attackers exploited an unauthenticated access flaw in a misconfigured API endpoint (`/api/now/related_list_edit/create`), which was configured with `requires_authentication=false`, to query arbitrary customer instance tables. Anomalous exploitation activity occurred between June 2–3, 2026; ServiceNow applied a patch on June 5. The advisory (KB3067321) was placed behind the customer support portal, meaning many tenants had no proactive notification. The issue primarily affects customers on the "Australia" platform release and customers on older releases who made certain configuration changes. ServiceNow received a confidential bug-bounty report on April 22, 2026, describing a similar issue, but delayed patching until exploitation was detected. ServiceNow's current assessment attributes the observed activity to security researchers or bug-bounty hunters rather than malicious actors, though the IP pattern (51.159.98.241, roughly 5 API requests per tenant) is consistent with structured probing. No CVE has been assigned. Sensitive data routinely stored in ServiceNow instances includes IT support tickets, employee records, internal documentation, asset inventories, security incident reports, and workflow configs. Defenders should review `access_log_transaction` tables for `GET/POST /api/now/related_list_edit` requests originating from the identified IP; rotate any credentials or tokens visible in support workflows; enable API authentication enforcement; and verify instance is on or past the Australia release. MITRE T1190, T1078 (Valid Accounts — token access).
    ch_eu_nexus: "global; ServiceNow is widely deployed across Swiss federal and cantonal administration and EU public-sector IT service management"
    public_sector_nexus: "direct — ServiceNow ITSM/CMDB data is highly sensitive in public-sector environments"
    sector: "public-sector, healthcare, finance, technology"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "ServiceNow has published an advisory stating it believes the observed activity was likely tied to security researchers or customer-led research associated with bug bounty submissions rather than malicious threat actors"
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/servicenow-discloses-security-incident-exposing-customer-data/"
      - quote: "ServiceNow Data Breach: Gated Advisory Left Customers Unaware of Exploited Zero-Auth API"
        attribution: "TechTimes"
        source_url: "https://www.techtimes.com/articles/318166/20260610/servicenow-data-breach-gated-advisory-left-customers-unaware-exploited-zero-auth-api.htm"
    extended_notes: |
      The gated-advisory pattern is an operational concern: enterprise security teams using ServiceNow may not have received proactive notification unless they actively monitor the support portal. The ~6-week lag between bug-bounty submission (April 22) and patch deployment (June 5) is notable. Organisations should subscribe to ServiceNow's security bulletin mailing list and enable ServiceNow's "High Security Plugin" to enforce authentication on all API endpoints by default.

  - title: "Microsoft Defender 'RoguePlanet' zero-day — race condition in real-time scanning achieves SYSTEM LPE on fully-patched Windows 10/11 (no CVE, no patch)"
    sources:
      - url: "https://www.bleepingcomputer.com/news/microsoft/microsoft-defender-rogueplanet-zero-day-grants-system-privileges/"
        publisher: "BleepingComputer"
        date: "2026-06-09"
        role: "primary"
      - url: "https://www.securityweek.com/new-windows-zero-day-exploit-rogueplanet-released/"
        publisher: "SecurityWeek"
        date: "2026-06-10"
        role: "corroborating"
    discovery_trace: "first seen at: hackernews RSS feed item 2026-06-10 → primary: BleepingComputer, URL https://www.bleepingcomputer.com/news/microsoft/microsoft-defender-rogueplanet-zero-day-grants-system-privileges/ (fetched direct, 200)"
    summary: |
      An anonymous researcher using the handle Chaotic Eclipse (aka Nightmare-Eclipse) published a proof-of-concept exploit named RoguePlanet targeting a race condition in Microsoft Defender's real-time scanning functionality — the same researcher who previously released the BlueHammer, RedSun, GreenPlasma, and YellowKey Windows zero-days in a public dispute with Microsoft over its vulnerability disclosure and bug-bounty programme. RoguePlanet achieves local privilege escalation (LPE) to SYSTEM on fully-patched Windows 10 and Windows 11 systems as of the June 2026 Patch Tuesday baseline, by exploiting a TOCTOU race on file I/O within Defender's scan pipeline. The original attack scenario involved opening a maliciously crafted VHD on a remote network share, causing Defender to overwrite its own executables — Microsoft hardened Defender's I/O functions between the first report and today, demoting the primitive from RCE-on-file-open to LPE. No CVE has been assigned and no patch is available. The exploit is described as "hit or miss" with 100% success rate on some hardware configurations and lower success on others, consistent with a race-condition reliability profile. No in-the-wild exploitation has been reported. Defenders should monitor for Defender process tree anomalies (`MsMpEng.exe` spawning unexpected child processes), unexpected SYSTEM-context command prompts not associated with service restarts, and consider Defender EDR telemetry on its own process integrity. MITRE T1068 (Exploitation for Privilege Escalation), T1562.001 (Impair Defenses: Disable or Modify Tools).
    ch_eu_nexus: "global; affects all Windows 10/11 endpoints including Swiss/EU public-sector fleets"
    public_sector_nexus: "direct — any endpoint in a Swiss/EU public-sector environment running Windows 10/11 is potentially affected"
    sector: "cross-sector (all Windows endpoints)"
    cves: []
    actors_campaigns_malware: ["Chaotic Eclipse", "Nightmare-Eclipse"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "A security researcher has released a new Microsoft Defender zero-day exploit named 'RoguePlanet' just hours after Microsoft fixed two previously disclosed flaws during June 2026 Patch Tuesday"
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/microsoft/microsoft-defender-rogueplanet-zero-day-grants-system-privileges/"
      - quote: "A RoguePlanet PoC exploit targets a Microsoft Defender zero-day race condition and can produce a SYSTEM-level shell when successful"
        attribution: "BleepingComputer (meta description)"
        source_url: "https://www.bleepingcomputer.com/news/microsoft/microsoft-defender-rogueplanet-zero-day-grants-system-privileges/"
    extended_notes: |
      This is part of a pattern of iterative zero-day drops by Nightmare-Eclipse timed to coincide with Patch Tuesdays. Microsoft patching two prior Nightmare-Eclipse flaws on the same day and this researcher immediately releasing a new one suggests an ongoing adversarial disclosure dynamic that will continue to produce Windows LPE primitives. Defenders using Windows Defender as their primary EPP/EDR should treat this as an ongoing risk posture item and monitor for advisories. No organisational workaround beyond monitoring is available at this time.

  - title: "ANNUAL REPORT — CrowdStrike 2026 Technology Threat Landscape Report: China-nexus adversaries drive 58% of state-sponsored intrusions against technology sector, targeting AI/ML IP; FAMOUS CHOLLIMA IT worker fraud at 47% of state-sponsored hands-on-keyboard activity"
