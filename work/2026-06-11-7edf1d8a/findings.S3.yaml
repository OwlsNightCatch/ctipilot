    summary: |
      CrowdStrike published its 2026 Technology Threat Landscape Report (June 9, 2026), drawing on telemetry across customer environments and adversary intelligence. Key findings relevant to Swiss/EU public-sector IT: (1) China-nexus adversaries drove 58% of all state-sponsored targeted intrusions against the technology sector in 2025–2026, focused specifically on AI capabilities, training data, ML infrastructure, and semiconductor IP that adversaries cannot build fast enough domestically. Named groups include MURKY PANDA, MUSTANG PANDA, OVERCAST PANDA, SUNRISE PANDA, and WARP PANDA. (2) DPRK-nexus FAMOUS CHOLLIMA accounted for 47% of all state-sponsored interactive hands-on-keyboard operations against the technology sector through IT-worker infiltration schemes, using AI-enhanced personas and US front companies to embed fraudulent employees inside technology firms across North America, Europe, and Asia. (3) STARDUST CHOLLIMA compromised the Axios npm package (100M+ weekly downloads), poisoning open-source supply chains in a pattern consistent with the IronWorm/Miasma lineage tracked this week. (4) eCrime actors weaponised AI-generated scripts for credential dumping and forensic-evidence erasure at machine speed; a macOS infostealer named Skrawl spread via fake OpenClaw extensions and counterfeit AI tool download sites. The technology sector is now the world's most targeted industry. Defenders should treat AI/ML development pipelines and model weights as high-value espionage targets warranting the same protection as source code and credentials.
    ch_eu_nexus: "directly relevant to CH/EU; Switzerland's technology sector (banking technology, life sciences IT, and AI research) is an explicit target profile matching the named China-nexus groups"
