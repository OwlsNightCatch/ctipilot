items:
  - title: "ShinyHunters claims Oracle PeopleSoft breach at 100+ organisations — University of Nottingham confirmed victim, student/applicant/financial data exfiltrated"
    sources:
      - url: "https://www.bleepingcomputer.com/news/security/oracle-peoplesoft-servers-hacked-in-shinyhunters-data-theft-attacks/"
        publisher: "BleepingComputer"
        date: "2026-06-10"
        role: "primary"
      - url: "https://techcrunch.com/2026/06/10/cybercriminals-claim-breach-of-oracle-peoplesoft-servers-at-100-plus-organizations/"
        publisher: "TechCrunch"
        date: "2026-06-10"
        role: "corroborating"
      - url: "https://www.nottingham.ac.uk/currentstudents/news/student-and-alumni-data-has-been-compromised-in-a-data-security-incident"
        publisher: "University of Nottingham"
        date: "2026-06-10"
        role: "victim-statement"
      - url: "https://www.ic3.gov/PSA/2026/PSA260515"
        publisher: "FBI IC3"
        date: "2026-05-15"
        role: "corroborating"
    discovery_trace: "first seen at: BleepingComputer RSS feed item (June 10 2026) → URL https://www.bleepingcomputer.com/news/security/oracle-peoplesoft-servers-hacked-in-shinyhunters-data-theft-attacks/ → victim statement pivot: University of Nottingham, URL https://www.nottingham.ac.uk/currentstudents/news/student-and-alumni-data-has-been-compromised-in-a-data-security-incident → FBI IC3 PSA corroboration https://www.ic3.gov/PSA/2026/PSA260515"
    summary: |
      ShinyHunters (confirmed by the threat actor to BleepingComputer) claimed on June 10, 2026 to have compromised Oracle PeopleSoft servers across 300 instances at more than 100 organisations, predominantly in the higher-education sector. The University of Nottingham confirmed the breach the same day via a victim statement, acknowledging its Oracle Campus Solutions (PeopleSoft-adjacent) student record system was accessed and that current students and alumni are affected; a dedicated support line (0115 74 86500) was opened and Action Fraud, the ICO, and other regulators were notified. ShinyHunters described the intrusion vector as a "gadget chain" combining legacy vulnerabilities with claimed zero-days; exploitation is configuration-dependent and not universal across all instances. Post-access lateral movement uses SSH against common PeopleSoft administrative accounts ('psoft', 'oracle', 'linuxadm') via a shell script that also drops ransom notes into PeopleSoft web and application server directories. Exfiltrated data categories stated by the attacker include student identifiers, applicant records, financial aid records, immigration data, health records, home addresses, phone numbers, email addresses, dates of birth, and administrative exports. Oracle did not respond to requests for comment; no CVE identifiers have been published for the specific vulnerabilities exploited. The FBI IC3 issued a PSA on May 15, 2026 (PSA260515) warning of ShinyHunters targeting cloud-based learning management and enterprise platforms via credential-based intrusion and misconfigured access controls.
    ch_eu_nexus: "Direct EU nexus: University of Nottingham is a UK/EU GDPR-relevant institution; broader campaign targets 100+ organisations globally including higher-education institutions in Europe. PeopleSoft is widely deployed across Swiss and European universities for student administration (e.g., ETH Zürich uses SAP rather than PeopleSoft, but many UK and EU universities rely on it). UK ICO notified by Nottingham."
    public_sector_nexus: "direct — confirmed victim is a major public research university; sector primarily education/public-sector"
    sector: "education, public-sector"
    cves: []
    actors_campaigns_malware: ["ShinyHunters"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Student and alumni data has been compromised in a data security incident"
        attribution: "University of Nottingham"
        source_url: "https://www.nottingham.ac.uk/currentstudents/news/student-and-alumni-data-has-been-compromised-in-a-data-security-incident"
      - quote: "ShinyHunters tells BleepingComputer they are using a 'gadget chain' of old and zero-day vulnerabilities to conduct the attacks...claiming to have stolen data from 300 instances across more than 100 organizations, with a significant number of victims in the education sector"
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/oracle-peoplesoft-servers-hacked-in-shinyhunters-data-theft-attacks/"
      - quote: "Student, applicant, financial aid, immigration, health, and administrative data has been exfiltrated"
        attribution: "ShinyHunters (via BleepingComputer)"
        source_url: "https://www.bleepingcomputer.com/news/security/oracle-peoplesoft-servers-hacked-in-shinyhunters-data-theft-attacks/"
    extended_notes: |
      Defenders running Oracle PeopleSoft (on-prem or Oracle Cloud) should: (1) audit authentication on all externally-reachable PeopleSoft web/app server endpoints, especially OAuth, SAML and REST API endpoints; (2) rotate all 'psoft', 'oracle', 'linuxadm' SSH credentials and disable password auth where key-based auth is available; (3) review /etc/hosts and SSH authorised_keys for new entries; (4) search application server directories for README-IF-YOU-SEE-THIS-YOUVE-BEEN-HACKED.TXT or similar ransom-note artefacts as lateral-movement indicators; (5) review Oracle CPU patches and apply any open advisories for PeopleSoft. Oracle has not disclosed which specific CVEs are being exploited in the current campaign. Prior FBI IC3 PSA260515 (May 2026) provides additional context.

  - title: "ServiceNow zero-auth API endpoint exploited against subset of customers — unauthenticated REST query of instance tables, June 2-5 exploitation window, patch applied June 5 but advisory initially gated"
    sources:
      - url: "https://www.bleepingcomputer.com/news/security/servicenow-discloses-security-incident-exposing-customer-data/"
        publisher: "BleepingComputer"
        date: "2026-06-09"
        role: "primary"
      - url: "https://techcrunch.com/2026/06/10/servicenow-tells-customers-a-bug-left-some-of-their-data-exposed-to-the-internet/"
        publisher: "TechCrunch"
        date: "2026-06-10"
        role: "corroborating"
      - url: "https://www.securityweek.com/servicenow-patches-vulnerability-exploited-against-some-customers/"
        publisher: "SecurityWeek"
        date: "2026-06-10"
        role: "corroborating"
      - url: "https://thehackernews.com/2026/06/servicenow-flaw-exploited-to-gain.html"
        publisher: "The Hacker News"
        date: "2026-06-10"
        role: "corroborating"
    discovery_trace: "first seen at: BleepingComputer RSS feed item (June 9-10 2026) → URL https://www.bleepingcomputer.com/news/security/servicenow-discloses-security-incident-exposing-customer-data/ → TechCrunch corroboration https://techcrunch.com/2026/06/10/servicenow-tells-customers-a-bug-left-some-of-their-data-exposed-to-the-internet/ → SecurityWeek corroboration https://www.securityweek.com/servicenow-patches-vulnerability-exploited-against-some-customers/ → THN https://thehackernews.com/2026/06/servicenow-flaw-exploited-to-gain.html"
    summary: |
      On June 9-10, 2026, ServiceNow disclosed that a Scripted REST Resource endpoint (/api/now/related_list_edit/create) had been shipped with requires_authentication set to false, creating an unauthenticated API query path into hosted customer instance tables. Exploitation activity commenced June 2-3, 2026, approximately five requests per tenant observed from IP 51.159.98.241; ServiceNow applied a patch on June 5 reconfiguring the endpoint to require authentication, but did not publish the customer advisory (KB3067321) until June 9 and initially restricted it to logged-in support-portal users. ServiceNow's updated position is that observed activity is "likely tied to security researchers or customer-led research associated with bug bounty submissions rather than malicious threat actors," citing a similar bug-bounty submission received April 22, 2026. The company states it opened individual support cases with affected customers and that "evidence of successful queries of instance tables" was observed for a subset of customers. Instances running the "Australia" platform release or any release with specific configuration changes were affected. No CVE has been assigned as of disclosure. ServiceNow manages IT, HR, and security workflows for the majority of the Fortune 500; exposed instance data can include IT support tickets, credentials, API tokens, employee records, asset inventories, and security incident reports.
    ch_eu_nexus: "Global platform widely used across Swiss federal administration, cantonal IT, EU public-sector IT departments, healthcare, and financial sector. Any European organisation on the 'Australia' ServiceNow release or with the affected endpoint configuration should audit."
    public_sector_nexus: "indirect — platform used extensively across public sector"
    sector: "cross-sector, IT services, finance, public-sector"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "A Scripted REST Resource that shipped with requires_authentication set to false, meaning the endpoint accepted requests without any valid session, token, or credential check. A foreign IP – 51.159.98.241 was hitting a Scripted REST endpoint at /api/now/related_list_edit/create"
        attribution: "BleepingComputer / multiple independent sources"
        source_url: "https://www.bleepingcomputer.com/news/security/servicenow-discloses-security-incident-exposing-customer-data/"
      - quote: "evidence of the observed activity came from those security researchers and customer research teams, not bad actors"
        attribution: "ServiceNow spokesperson Courtney Johnson (via TechCrunch)"
        source_url: "https://techcrunch.com/2026/06/10/servicenow-tells-customers-a-bug-left-some-of-their-data-exposed-to-the-internet/"
      - quote: "ServiceNow patches auth bypass four days before disclosure"
        attribution: "SecurityWeek"
        source_url: "https://www.securityweek.com/servicenow-patches-vulnerability-exploited-against-some-customers/"
    extended_notes: |
      Defenders with ServiceNow instances should: (1) confirm via the ServiceNow support portal whether a case was opened on their tenant; (2) search transaction logs for requests to /api/now/related_list_edit/create from IP 51.159.98.241 in the June 2-5 window; (3) audit all Scripted REST Resources for requires_authentication: false via sys_ws_operation.list with filter acl.requires_authentication=false; (4) immediately rotate all credentials stored in IT support tickets, integration configurations, and connection broker tables if any anomalous queries are confirmed. The advisory's customer-portal-only gate was criticised by multiple outlets — defenders who did not catch the June 9 notification may only now be learning of the issue.

  - title: "EVERTEC SEC 8-K: third-party support platform breach exposes payment card and transaction data for Puerto Rico banking clients (Banco Popular de Puerto Rico)"
    sources:
      - url: "https://www.stocktitan.net/sec-filings/EVTC/8-k-evertec-inc-reports-material-event-d597e939444d.html"
        publisher: "StockTitan (SEC filing proxy)"
        date: "2026-06-09"
        role: "primary"
      - url: "https://www.stocktitan.net/sec-filings/BPOP/8-k-popular-inc-reports-material-event-58970421f0e7.html"
        publisher: "StockTitan (Popular Inc 8-K proxy)"
        date: "2026-06-09"
        role: "corroborating"
    discovery_trace: "first seen at: WebSearch ('SEC EDGAR 8-K cybersecurity material incident June 9 10 2026') → EVERTEC 8-K filing reference → StockTitan proxy URL https://www.stocktitan.net/sec-filings/EVTC/8-k-evertec-inc-reports-material-event-d597e939444d.html → Popular Inc 8-K corroboration https://www.stocktitan.net/sec-filings/BPOP/8-k-popular-inc-reports-material-event-58970421f0e7.html"
    summary: |
      On June 9, 2026, EVERTEC, Inc. (NYSE: EVTC), a major payment-transaction processing and IT services provider for financial institutions in Latin America and the Caribbean, filed a Form 8-K under Item 8.01 disclosing that on May 13, 2026 it became aware of unauthorised access to customer data via a third-party support platform. The attacker obtained transaction records, payment card numbers (debit cards per Banco Popular de Puerto Rico's concurrent disclosure), and in some cases customer names and contact information. The incident primarily impacted EVERTEC's financial institution clients in Puerto Rico and their customers. Banco Popular de Puerto Rico (subsidiary of Popular, Inc., NASDAQ: BPOP) filed a concurrent 8-K on June 9 confirming exposure of certain BPPR customer debit card numbers and other information, and stating it activated enhanced fraud monitoring. EVERTEC engaged external cybersecurity experts and federal law enforcement, asserts the attacker no longer has access to the platform, and notes no operational disruption. The specific third-party support platform is not named. The incident was discovered May 13, 2026, making the June 9 disclosure approximately 27 days post-discovery; under SEC Rule 13a-11 / 15d-11, the four-business-day clock runs from materialisation determination, not discovery — EVERTEC filed under Item 8.01 (voluntary disclosure) rather than Item 1.05 (material cyber incident), suggesting it has not yet determined materiality.
    ch_eu_nexus: "No direct Swiss/EU nexus. Disclosure is relevant as a third-party vendor risk pattern: a payment processor's support-desk tooling was the access point, exposing downstream bank customers — a supply-chain vector now replicated in multiple 2026 incidents."
    public_sector_nexus: "none"
    sector: "finance, fintech, banking"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "EVERTEC became aware of potential unauthorized access to customer data on May 13, which it believes to have occurred through a third-party support platform...transaction records, payment card numbers of some customers and, in some instances, customer names and contact information were exposed"
        attribution: "EVERTEC 8-K (via StockTitan)"
        source_url: "https://www.stocktitan.net/sec-filings/EVTC/8-k-evertec-inc-reports-material-event-d597e939444d.html"
      - quote: "Popular was notified by Evertec that the cybersecurity incident affected certain data of its clients, including that of Banco Popular de Puerto Rico...affected data includes personal information of certain BPPR customers, including debit card numbers"
        attribution: "Popular Inc 8-K (via StockTitan)"
        source_url: "https://www.stocktitan.net/sec-filings/BPOP/8-k-popular-inc-reports-material-event-58970421f0e7.html"
    extended_notes: |
      Notable for SEC reporting community: EVERTEC used Item 8.01 (voluntary) rather than Item 1.05 (mandatory material-cyber-incident form), suggesting either the materiality determination is still pending or EVERTEC concluded the incident does not meet the materiality threshold despite exposed payment card data. Banco Popular filed concurrently, reflecting the contractual indemnity obligation. For defenders: this is a third-party support platform breach pattern — identify all SaaS helpdesk / support-tool vendors (Zendesk, ServiceNow, Salesforce Service Cloud, Freshdesk, etc.) that have read/query access to your customer transaction or payment data, and audit their access scope and authentication controls.

  - title: "EDPB adopts common EU-wide data breach notification template (GDPR Art. 33) — open for public consultation until 5 August 2026"
    sources:
      - url: "https://www.edpb.europa.eu/news/news/2026/edpb-meets-eu-commissioner-mcgrath-and-adopts-common-data-breach-notification_en"
        publisher: "European Data Protection Board"
        date: "2026-06-10"
        role: "primary"
      - url: "https://www.edpb.europa.eu/our-work-tools/our-documents/other/template-personal-data-breach-notification_en"
        publisher: "European Data Protection Board"
        date: "2026-06-10"
        role: "primary"
      - url: "https://www.cnil.fr/en/edpb-meets-eu-commissioner-mcgrath-and-adopts-common-data-breach-notification-template"
        publisher: "CNIL"
        date: "2026-06-10"
        role: "corroborating"
    discovery_trace: "first seen at: WebFetch of https://www.cnil.fr/en/news (CNIL news listing, June 10 2026 item) → primary: EDPB advisory, URL https://www.edpb.europa.eu/news/news/2026/edpb-meets-eu-commissioner-mcgrath-and-adopts-common-data-breach-notification_en → template document URL https://www.edpb.europa.eu/our-work-tools/our-documents/other/template-personal-data-breach-notification_en"
    summary: |
      On June 10, 2026, the European Data Protection Board (EDPB) adopted a common harmonised template for personal data breach notifications under GDPR Article 33 (controller-to-DPA notification). The template provides structured predefined fields aligned with Art. 33 content requirements — categories of data and data subjects affected, approximate number of individuals, likely consequences, measures taken — and is designed to reduce notification burden particularly for smaller organisations lacking dedicated DPOs. Adoption follows a February 2026 public consultation report (EDPB report 2026-02). The template enters a public consultation period running until 5 August 2026, after which the EDPB will decide the implementation timeline requiring all EU/EEA national DPAs to adopt it. The EDPB's June 10 plenary also discussed with Commissioner McGrath (Democracy, Justice, Rule of Law): concerns about the Digital Omnibus package potentially weakening personal data definitions, child protection guidelines, political-advertisement regulation, and adequate DPA resourcing. Separately, the ICO (UK) announced temporary governance changes the same day, with Deputy Commissioner Paul Arnold assuming the Information Commissioner's responsibilities after an independent workplace investigation found "a case to answer" against John Edwards.
    ch_eu_nexus: "Direct EU/CH nexus: affects all EU/EEA organisations subject to GDPR Art. 33 breach-notification obligations; Swiss organisations subject to nDSG with Art. 24 breach notification obligations will monitor adoption closely. Harmonised template reduces compliance friction for cross-border incidents."
    public_sector_nexus: "direct — affects all EU public-sector data controllers required to notify DPAs of breaches"
    sector: "cross-sector, regulatory"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "The EDPB has adopted a common template for data breach notifications...to help organisations and DPAs to structure, harmonise, and unify their data breach notification processes"
        attribution: "European Data Protection Board"
        source_url: "https://www.edpb.europa.eu/news/news/2026/edpb-meets-eu-commissioner-mcgrath-and-adopts-common-data-breach-notification_en"
      - quote: "The template will be subject to public consultation until 5 August 2026"
        attribution: "European Data Protection Board"
        source_url: "https://www.edpb.europa.eu/our-work-tools/our-documents/other/template-personal-data-breach-notification_en"
    extended_notes: |
      The template replaces the current patchwork of 27+ national DPA notification forms. Organisations should monitor for the post-consultation final version, expected Q4 2026, and update their breach-response runbooks to the harmonised schema. The ICO governance situation (John Edwards suspended pending HR investigation outcome, Paul Arnold as acting Commissioner) is a separate item — it does not affect ICO enforcement authority, which continues under the Scheme of Delegation.

