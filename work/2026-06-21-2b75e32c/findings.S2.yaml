items:
  - title: "CVE-2026-12569 — PTC Windchill PDMLink / FlexPLM deserialization RCE actively exploited; BSI conducted middle-of-the-night calls to German administrators"
    sources:
      - url: "https://security-hub.ncsc.admin.ch/#/posts/12713"
        publisher: "NCSC-CH Security Hub"
        date: "2026-06-19"
