items:
  - title: "Sapphire Sleet (BlueNoroff) compromises 142 Mastra npm packages via dormant maintainer account — cross-platform RAT with SYSTEM-level persistence"
    sources:
      - url: "https://www.microsoft.com/en-us/security/blog/2026/06/17/postinstall-payload-inside-mastra-npm-supply-chain-compromise/"
        publisher: "Microsoft Threat Intelligence"
        date: "2026-06-17"
        role: "primary"
      - url: "https://snyk.io/blog/a-forgotten-contributor-account-compromised-the-entire-mastra-npm-package-scope/"
        publisher: "Snyk Security"
        date: "2026-06-17"
        role: "corroborating"
      - url: "https://www.bleepingcomputer.com/news/security/microsoft-links-mastra-ai-supply-chain-attack-to-north-korean-hackers/"
        publisher: "BleepingComputer"
        date: "2026-06-20"
        role: "corroborating"
    discovery_trace: "first seen at: hackernews feed (https://feeds.feedburner.com/TheHackersNews via bridge) → BleepingComputer article 2026-06-20 → primary: Microsoft Security Blog 2026-06-17; Snyk corroborating same date"
    summary: |
      North Korean state-sponsored cluster Sapphire Sleet (also tracked as BlueNoroff, UNC1069, STARDUST CHOLLIMA, CageyChameleon) hijacked the dormant npm maintainer account `ehindero` — which had legitimate publish rights across the entire `@mastra` scope since 2024–2025 alpha releases but had gone inactive — and on June 17, 2026 bulk-republished 142 packages with a typosquatted malicious dependency `easy-day-js@1.11.22` (mimicking `dayjs` with 57M+ weekly downloads). The postinstall hook in `easy-day-js` runs an obfuscated `setup.cjs` dropper that disables TLS certificate verification (`NODE_TLS_REJECT_UNAUTHORIZED=0`), contacts C2 at `23.254.164.92:8000`, fetches a 41 KB cross-platform Node.js tasking client and executes it as a detached hidden process. The second-stage implant enumerates 166 cryptocurrency wallet browser-extension IDs (MetaMask, Phantom, Coinbase Wallet, OKX, Keplr, Binance Wallet, TronLink), steals Chrome/Edge/Brave profiles and browser histories, collects host inventory, and establishes OS-specific persistence: NVM-themed registry `Run` keys (Windows), `LaunchAgent com.nvm.protocal.plist` (macOS), `systemd nvmconf.service` (Linux). A third-stage PowerShell backdoor achieves reflective .NET assembly injection into `cmd.exe` with a `scdev` svchost service running under SYSTEM. Clean versions: `mastra@1.13.0` / `@mastra/core@1.42.0` and lower. Malicious: `mastra@1.13.1`, `@mastra/core@1.42.1`, `easy-day-js@1.11.22`. Microsoft Defender XDR signatures `Trojan:JS/NpmStealz.Z!MTB`, `.ZA!MTB`, `Trojan:JS/NpmSteal.DB!MTB`, `Trojan:PowerShell/PsExec.DE!MTB`. Detection: Sysmon or EDR events for `node.exe` spawning with `--no-warnings` flag loading `setup.cjs` or `easy-day-js`; anomalous ASEP registry writes from npm process trees; `scdev` service creation under svchost; outbound to `23.254.164.92`/`23.254.164.123` on 8000/443. Hardening: always run `npm install --ignore-scripts`; pin lock-file and verify hashes; rotate credentials from systems that installed `mastra@1.13.1` or `@mastra/core@1.42.1`. This is Sapphire Sleet's second npm scope-takeover in 2026 (after the April Axios npm compromise).
    ch_eu_nexus: "npm ecosystem is global; AI/developer tooling is heavily used in Swiss and European public-sector DevOps pipelines and finance-sector engineering teams"
    public_sector_nexus: "indirect — affects any government or public-sector organisation that uses Mastra-based AI workflow tooling in CI/CD"
    sector: "technology, finance, developer-tooling"
    cves: []
    actors_campaigns_malware: ["Sapphire Sleet", "BlueNoroff", "UNC1069", "STARDUST CHOLLIMA", "CageyChameleon", "NpmStealz"]
