        attribution: "Snyk Security"
        source_url: "https://snyk.io/blog/a-forgotten-contributor-account-compromised-the-entire-mastra-npm-package-scope/"
      - quote: "The scdev service runs as a shared svchost.exe process under the SYSTEM context with automatic startup, providing Sapphire Sleet with boot-persistent, elevated access independent of user logon."
        attribution: "Microsoft Threat Intelligence"
        source_url: "https://www.microsoft.com/en-us/security/blog/2026/06/17/postinstall-payload-inside-mastra-npm-supply-chain-compromise/"
    extended_notes: |
      MITRE ATT&CK mappings: T1195.002 (Supply Chain Compromise — dependency injection), T1036.004 (Masquerading — typosquat), T1547.001 (Registry Run Keys), T1547.014 (Systemd/LaunchAgent), T1562.008 (Disable Defense — TLS bypass), T1005 (Data from Local System), T1041 (Exfiltration over C2). The attack root cause — dormant maintainer accounts with permanent publish rights — applies equally to any npm package with a contributor who left the project years ago. Defenders should audit their own private registry ACLs and enforce time-bound or MFA-required publish tokens.

  - title: "Prinz Eugen: new Go-based ransomware with ChaCha20-Poly1305 encryption, no ransom note, initial access via stolen RDP credentials"
    sources:
      - url: "https://www.threatdown.com/blog/prinz-eugen-ransomware-a-deep-dive-into-a-new-go-based-encryptor/"
        publisher: "Malwarebytes ThreatDown"
        date: "2026-06-20"
        role: "primary"
      - url: "https://www.bleepingcomputer.com/news/security/new-prinz-eugen-ransomware-prioritizes-recent-files-for-encryption/"
        publisher: "BleepingComputer"
        date: "2026-06-20"
        role: "corroborating"
    discovery_trace: "first seen at: BleepingComputer listing scrape (bridge url bleepingcomputer.com/news/security/) → article 2026-06-20 → primary: Threatdown blog 2026-06-20 → corroborating: BleepingComputer same date"
    summary: |
      Malwarebytes ThreatDown published on June 20, 2026, a technical deep-dive into Prinz Eugen, a new, non-RaaS ransomware operation active since at least early 2026. The Go binary (package name `scorched-earth-ausfc`) prioritises recently modified files for encryption — maximising business-critical impact — using ChaCha20-Poly1305 AEAD with a three-stage KDF (Argon2id → SHA-256 → HKDF-SHA256) and per-file random IVs; files carry a `CHV1` magic header and the `.prinzeugen` extension. Initial access is via stolen RDP credentials. Post-access the operator manually executes `servertool.exe` (downloaded via Chrome, staged in the Music folder), creates a backdoor admin account (`net user admin germania /add`), and abuses the RemotePC RMM tool for lateral movement and PowerShell stager delivery — consistent with hands-on-keyboard LOTL tradecraft. The binary zeroes its hardcoded key and forces GC before self-deletion to prevent key recovery. At least five confirmed victims across finance (Standard Bank Group, ~1.2 TB / 154M SQL rows exfiltrated; Vantage Finance), US automotive services (700Credit, 8.4M records with SSNs), France (Transitions Pro Centre Val de Loire), and a North American driving-school software provider. The operator alias ROOTBOY/GERMANIA is linked to pre-existing data-broker activity from July 2025. C2: `212.80.7.74` (AS215439 Play2go International, Frankfurt). No public patch lever exists — this is a behavioural/hardening problem. Detection: process creation of `servertool.exe` with directory-path arguments; `net user admin germania /add` command line; RemotePC PowerShell launch chains; `.prinzeugen` extension fan-out on shared drives. Hardening: restrict RDP to VPN/jump-host, enforce MFA on all remote-access sessions, audit/revoke dormant RMM tool licenses, disable RemotePC unless explicitly required.
    ch_eu_nexus: "French victim confirmed (Transitions Pro Centre Val de Loire); C2 hosted in Germany (AS215439 Frankfurt); no Swiss victim confirmed but pattern targets finance and data-rich organisations prevalent across DACH"
    public_sector_nexus: "indirect — LOTL and RDP-credential initial access pattern broadly applicable across CH/EU public-sector environments"
    sector: "finance, education, automotive"
