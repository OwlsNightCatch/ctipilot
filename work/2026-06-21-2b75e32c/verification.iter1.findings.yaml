  summary: >-
    Absolute historical quantifier ('first resignation ... since ... 1984') is supported by neither cited
    source. The ICO statement (fetched via bridge) confirms the resignation, immediate effect, 19 June 2026
    date, and 'case to answer', but says nothing about it being a first-since-1984. The Record article confirms
