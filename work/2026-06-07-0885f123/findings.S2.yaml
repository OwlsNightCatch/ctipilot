        date: "2026-05-19"
        role: "corroborating-press"
    discovery_trace: |
      first seen at: bsi-rss feed, WID-SEC-2026-1804 "BigBlueButton: Mehrere Schwachstellen" (high severity, new, published 2026-06-04)
      → BSI CSAF: https://wid.cert-bund.de/.well-known/csaf/white/2026/wid-sec-w-2026-1804.json confirmed GHSA references
      → Vendor GHSAs: GHSA-38fw-2gq7-ccgr (session hijack) and GHSA-gfv2-46v4-jvw5 (SQL injection), both published 2026-06-04
      → Heise press (2026-05-19): CVE-2026-46351, CVE-2026-46353 confirmed (note: earlier reporting on same CVEs, BSI advisory is fresh)
      → WebSearch confirmed: CVE-2026-46351 (CVSS 8.1, session-token guessing), CVE-2026-46353 (CVSS 8.1, checksum-bypass access control)
    summary: |
      BSI published WID-SEC-2026-1804 on 2026-06-04, the same day BigBlueButton posted two GitHub Security Advisories (GHSA-38fw-2gq7-ccgr covering unauthenticated session hijack via the exposed `/bigbluebutton/api/handleJoinExistingUser` endpoint, and GHSA-gfv2-46v4-jvw5). BigBlueButton (BBB) is an open-source web conferencing platform dominant in EU and DACH educational institutions — deployed across universities, schools and public-sector training environments with mandatory remote-teaching mandates in Germany, Austria and Switzerland. Three vulnerabilities cover the current advisory cycle:
      - CVE-2026-46351 (CVSS 8.1): Insufficiently random user session tokens allow an attacker to predict and hijack active user sessions without authentication. API endpoint: `/bigbluebutton/api/handleJoinExistingUser` exposed without authentication guard. Prerequisite: network access to the BBB server API port.
      - CVE-2026-46353 (CVSS 8.1): Insufficient access control allows arbitrary users to send valid API requests to checksum-bypassed endpoints. Prerequisite: network access, knowledge of the API path.
      - CVE-2026-46404 (CVSS 6.8): SSRF vulnerability. Authenticated users who have gained API access can probe internal network services via the BBB server.
      Patches: BBB 3.0.21 (end of January 2026 release) addresses CVE-2026-46351 and CVE-2026-46353. The BSI advisory confirms the GHSA disclosures as the public coordination. Self-hosted EU educational BBB deployments that have not upgraded since January 2026 are currently exposed to session hijacking with no credential requirement.
      Detection: BBB server logs for unexpected calls to `/bigbluebutton/api/handleJoinExistingUser` from IPs not matching known participant sessions; API access log anomalies for requests missing valid checksums that succeed (indicating checksum bypass). BBB's built-in API request logging can be enabled with `logLevel=DEBUG` in `bigbluebutton.yml`.
    ch_eu_nexus: "Direct — BigBlueButton is the dominant open-source video conferencing platform across German, Austrian and Swiss education systems. DACH universities and cantonal school authorities mandate BBB for remote teaching. EU-wide deployment across public-sector training environments."
