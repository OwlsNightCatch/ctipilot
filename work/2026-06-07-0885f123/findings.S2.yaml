  - title: "HTTP/2 Bomb (CVE-2026-49975): unauthenticated memory-exhaustion DoS against nginx, Apache httpd, IIS, Envoy and Cloudflare Pingora — PoC public, no patch yet for IIS/Envoy/Pingora"
