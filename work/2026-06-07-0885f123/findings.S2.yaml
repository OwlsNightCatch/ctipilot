  - title: "BigBlueButton CVE-2026-46351 / CVE-2026-46353: unauthenticated session hijack via predictable tokens and checksum-bypass API access in EU/DACH education platform — BSI advisory 2026-06-04"
    sources:
      - url: "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-1804"
        publisher: "BSI (Bundesamt für Sicherheit in der Informationstechnik)"
        date: "2026-06-04"
