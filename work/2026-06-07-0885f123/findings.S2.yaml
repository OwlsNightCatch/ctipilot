    discovery_trace: |
      first seen at: ncsc-ch-security-hub bridge (ncsc-csh recent 20), URL https://security-hub.ncsc.admin.ch/#/posts/12610
      → primary researcher disclosure: Calif blog https://blog.calif.io/p/codex-discovered-a-hidden-http2-bomb
      → vendor advisory: Envoy GHSA https://github.com/envoyproxy/envoy/security/advisories/GHSA-22m2-hvr2-xqc8
      → corroborating: SecurityWeek https://www.securityweek.com/http-2-bomb-exploit-knocks-web-servers-offline-in-seconds/ (published 2026-06-03)
      → WebSearch confirmed THN, CybersecurityNews, Linuxiac, Imperva all cover same CVE
    summary: |
      Security firm Calif (using OpenAI Codex) disclosed CVE-2026-49975, the "HTTP/2 Bomb," on 2026-06-03: a client-side attack that chains HPACK compression amplification with an HTTP/2 Slowloris-style flow-control window hold to exhaust server memory within seconds. A single client on a 100 Mbps connection can hold 32 GB of server RAM within 20 seconds. Affected in default configurations: nginx (patched in 1.29.8 — max_headers directive capped at 1,000), Apache httpd (patched in mod_http2 v2.0.41 — cookie fragments now count toward request field limits), Envoy (patched per GHSA-22m2-hvr2-xqc8), Cloudflare Pingora (no patch), and Microsoft IIS (no patch). Responsible disclosure was made to Apache on 2026-05-27 with a same-day fix. NCSC-CH Security Hub issued advisory post 12610 on 2026-06-04; PoC is public at https://github.com/califio/publications/tree/main/MADBugs/http2-bomb. Exploitation requires only HTTP/2 to be enabled (the default for modern deployments) and network access to the web server port; no authentication, no credentials. Prerequisites: HTTP/2 enabled in target configuration, network access to port 80/443. Affected versions: nginx < 1.29.8; Apache httpd < mod_http2 2.0.41; Envoy < GHSA-22m2-hvr2-xqc8 fixed version; IIS and Pingora — no patch as of disclosure. MITRE ATT&CK: T1499.002 Service Exhaustion Flood.
      Defender takeaway: patch nginx and Apache immediately; for IIS and Pingora deployments, apply WAF rules that limit the number of HPACK header entries per stream and enforce HTTP/2 flow-control window size limits. Web server access logs will show rapid connection state accumulation from a single IP; network-layer monitoring should alert on sustained high-memory conditions on web servers without corresponding CPU spikes.
    ch_eu_nexus: "Global CVE; EU/CH nexus via NCSC-CH Security Hub advisory. HTTP/2 is the default for virtually every Swiss and EU public-sector web portal — cantonal and federal portals, e-government services, health data platforms, EU institutions. IIS-based deployments (common in public sector) remain unpatched."
