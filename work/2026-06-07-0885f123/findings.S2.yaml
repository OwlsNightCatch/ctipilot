  - title: "Keycloak 26.6.3 patches 16 CVEs including privilege escalation via token exchange (CVE-2026-9704) and SSRF via OIDC endpoint (CVE-2026-4874) — critical EU public-sector identity infrastructure"
    sources:
      - url: "https://www.keycloak.org/2026/06/keycloak-2663-released"
        publisher: "Keycloak Project"
        date: "2026-06-04"
        role: "primary"
      - url: "https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-0669/"
        publisher: "CERT-FR (ANSSI)"
        date: "2026-06-01"
        role: "corroborating"
      - url: "https://github.com/keycloak/keycloak/security/advisories/GHSA-75p6-52g3-rqc8"
        publisher: "Keycloak GitHub GHSA"
        date: "2026-06-04"
        role: "vulnerability-advisory"
    discovery_trace: |
      first seen at: cert-fr avis-recent feed, CERTFR-2026-AVI-0669 "Vulnérabilité dans Keycloak" published 2026-06-01
      → pivot to primary: Keycloak release blog https://www.keycloak.org/2026/06/keycloak-2663-released (published 2026-06-04)
      → GitHub GHSA for CVE-2026-9704: https://github.com/keycloak/keycloak/security/advisories/GHSA-75p6-52g3-rqc8
      → WebSearch confirmed DailyCVE, Red Hat advisories
    summary: |
      Keycloak 26.6.3, released 2026-06-04, patches 16 security CVEs in the open-source identity and access management platform that underpins SSO, SAML and OIDC federation across the vast majority of EU public-sector deployments and EU institution infrastructure. The most operationally significant fixes are:
      - CVE-2026-9704 (GHSA-75p6-52g3-rqc8) — Privilege escalation via silent subject_token removal in token exchange (OIDC). An attacker with a low-privilege token can silently omit the subject_token parameter in an OAuth 2.0 token exchange, causing Keycloak to use the requesting client's own identity instead, thereby escalating privileges to the impersonated service account level. Prerequisite: token exchange feature enabled.
      - CVE-2026-4874 — SSRF via OIDC token endpoint manipulation. An attacker can coerce the Keycloak OIDC token endpoint to issue server-side HTTP requests to attacker-controlled targets, potentially reaching internal services. Prerequisite: access to the OIDC token endpoint (network-accessible).
      - CVE-2026-8830 — Missing server-side WebAuthn credential registration validation. A malicious authenticator can supply unvalidated attestation data, potentially bypassing phishing-resistant MFA enforcement. Prerequisite: WebAuthn registration endpoint reachable.
      - CVE-2026-9802 — Server restart resets startupTime, allowing reuse of rotated refresh tokens when revokeRefreshToken=true. Provides a post-server-restart window for replay attacks.
      - CVE-2026-9792 — ROPC grant bypass in client policy enforcement.
      - CVE-2026-37977 — CORS Access-Control-Allow-Origin reflected from unverified JWT azp claim on UMA endpoint. Prerequisite: Authorization Services / UMA enabled.
      The previous release 26.6.2 (2026-05-27) already addressed SAML DoS (CVE-2026-7307). All installations should upgrade to 26.6.3 immediately. CERT-FR issued CERTFR-2026-AVI-0669 covering confidentiality breach and security-policy bypass risks.
      Detection: monitor Keycloak server logs for unexpected token exchange requests where subject_token is absent; WebAuthn registration audit logs for attestation format anomalies; OIDC endpoint access logs for unusual outbound connection attempts from the Keycloak process.
    ch_eu_nexus: "Direct — Keycloak is deployed across Swiss federal identity infrastructure (eIDAS, e-government portals), EU institution SSO, and is the reference IAM for Red Hat-based public-sector deployments in DACH. CERT-FR advisory confirms French ANSSI classification."
