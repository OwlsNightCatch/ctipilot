        attribution: "Huntress"
        source_url: "https://www.huntress.com/blog/macos-screen-sharing-rce-patched"
    extended_notes: |
      Huntress's detection guidance (2026-08-07) is the operationally useful addition the prior
      entry lacked. Telemetry class: Apple's Endpoint Security screen-sharing-attach notification
      (ES_EVENT_TYPE_NOTIFY_SCREENSHARING_ATTACH) — a legitimate authenticated session reports
      authentication_type "RSA-SRP" (encrypted), while a session exploiting this bug reports the
      weaker unencrypted "SRP" value, often paired with session_username "root" (disabled by
      default) or a null username if the attacker enumerates a different local account to dodge
      that specific discriminator. At the process layer, the exploited file-copy helper is
      SSFileCopySender (path:
      /System/Library/CoreServices/RemoteManagement/screensharingd.bundle/Contents/Support/SSFileCopySender.bundle/Contents/MacOS/SSFileCopySender,
      and its SSFileCopyReceiver counterpart) — hunt for it launched with UID/GID 0:80, not a
      legitimate combination during interactive Screen Sharing use. System Integrity Protection is
      not a full mitigant: Huntress states it blocks only the cron-based persistence path reachable
      through this bug, not LaunchDaemon or shell-startup-file persistence — a correction to the
      2026-08-08 entry's more hopeful reading of fG!'s "it doesn't bypass SIP" remark, which was
      about a different (file-download-only) primitive, not persistence generally. CVE-2026-43760
      (Bynario, post-auth, already credited in Apple's 2026-07-27 advisory) and the still-uncredited
      pre-07-27 bug are discussed by Calif only as context for how thoroughly screensharingd was
      probed this cycle; neither changes the operational picture for CVE-2026-65400 itself. No
      malicious in-the-wild exploitation is reported by any source — the four-hour patch-diff
      turnaround is a research demonstration, not an observed attack, but it does establish that a
      reliable weapon exists for any unpatched, internet-reachable host.
