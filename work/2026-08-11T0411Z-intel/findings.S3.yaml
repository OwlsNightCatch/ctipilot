items:
  - title: "screensharingd's second pre-auth root bug: patch-diffed to a working exploit in four hours, and a silently-fixed sibling that never got a CVE"
    sources:
      - { url: "https://blog.calif.io/p/no-country-for-old-passwords", publisher: "Calif", date: "2026-08-10", role: primary }
      - { url: "https://www.huntress.com/blog/macos-screen-sharing-rce-patched", publisher: "Huntress", date: "2026-08-07", role: corroborating }
      - { url: "https://support.apple.com/en-us/148170", publisher: "Apple", date: "2026-08-06", role: corroborating }
      - { url: "https://reverse.put.as/2026/07/29/its-a-pre-auth-stupid/", publisher: "fG! (reverse.put.as)", date: "2026-07-29", role: corroborating }
    discovery_trace: >
      first seen at: calif-codex source-slice record, feed URL https://blog.calif.io/feed →
      primary: Calif blog post, URL https://blog.calif.io/p/no-country-for-old-passwords →
      pivot: WebSearch ("Huntress \"Screen Sharing\" macOS pre-auth remote code execution blog") →
      corroborating: Huntress technical analysis, URL https://www.huntress.com/blog/macos-screen-sharing-rce-patched →
      background (already used in prior entry 2026-08-08/cve-2026-65400-macos-screen-sharing-auth-state-bypass):
      Apple advisory, URL https://support.apple.com/en-us/148170, and fG!'s post, URL https://reverse.put.as/2026/07/29/its-a-pre-auth-stupid/
    summary: |
      Researcher Calif reverse-engineered Apple's 2026-08-06 emergency macOS 26.6.1 patch for
      CVE-2026-65400 and had a working pre-authentication remote-root exploit against
      screensharingd — the root-privileged daemon behind macOS Screen Sharing's Secure Remote
      Password (SRP) authentication — within about four hours. Huntress's independent analysis of
      the same patch (2026-08-07) pins the root cause precisely: the SRP frame-length validator
      returns a stale success status left over from a prior read when handed an oversized frame,
      so the authentication state machine treats an unauthenticated connection as authenticated
      and the session proceeds in cleartext with arbitrary file read/write as root through the
      daemon's file-copy helpers; disabling individual accounts or VNC password auth does not
      block it. Calif's post adds a second, more serious dimension: screensharingd actually shipped
      two independent pre-auth bugs. The first, found by researcher @osxreverser, needs no username
      or password at all (a single wrong early-return in a length check hands back the success code
      from a prior read) and was silently killed by Apple on 2026-07-27 in the same release that
      patched three lesser bugs — including CVE-2026-43760, a post-auth flaw Bynario found through
      GPT-5.5-assisted fuzzing — without a CVE, an advisory line, or a credit for the pre-auth
      remote-root fix. Both bugs are pure logic errors (no memory corruption, no race, no crash) and
      Calif reports both worked reliably on the first attempt once rebuilt from the binary diff.
      osxreverser's own internet scan found roughly 40,000 Macs with Screen Sharing reachable from
      the internet, concentrated in the US, with university and corporate hosts specifically flagged.
    region_nexus: "global — Screen Sharing ships on every managed and unmanaged Mac; osxreverser's scan specifically flags exposed university and corporate hosts"
