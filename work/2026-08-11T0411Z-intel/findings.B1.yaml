q1_ceva_attacker_behavior:
  purpose: >
    Establish, with verbatim quotes, exactly what is and is NOT stated about
    attacker behaviour in the CEVA Logistics incident, for honest ATT&CK
    mapping (S4 currently maps only T1199 Trusted Relationship).

  finding_1_ceva_own_statement:
    answer: >
      CEVA/CMA CGM has issued NO public press release or newsroom post about
      this incident. Its only interaction with press is a short statement
      given directly to TechCrunch (quoted in full below) plus a named
      spokesperson (Ryan Fisher) who declined to answer further questions.
      CEVA's own newsroom "Breaking News" archive (cevalogistics.com) contains
      exactly one cyberattack-related post, and it is NOT about this incident —
      it is dated 9/28/2020 and describes the historical CMA CGM Group
      ransomware attack ("excluding CEVA Logistics"). CEVA's general
      press-release listing page (cevalogistics.com/en/news-and-media/newsroom/press-release)
      carries no item about the 2026 incident either.
    verbatim_quotes:
      - quote: "The CMA CGM Group (excluding CEVA Logistics) is currently dealing with a cyber-attack impacting peripheral servers. All CEVA Logistics sites and systems are operating normally."
        attribution: "CEVA Logistics newsroom, 'CMA CGM IT Updates' post dated 9/28/2020 (unrelated historical incident, NOT the 2026 event)"
        source_url: "https://www.cevalogistics.com/en/news-and-media/newsroom/breaking-news/cma-cgm-it-updates"
      - quote: "Ceva confirmed in a statement to TechCrunch that it was experiencing a cyberattack. \"On Aug. 1, CEVA Logistics confirmed to affected customers that a cyber intrusion was impacting part of its European contract logistics operations. As soon as the incident was identified, CEVA's cybersecurity teams immediately activated its security protocols and launched a thorough investigation, which is still ongoing,\" per the statement provided to TechCrunch. \"The operational impact is limited to eight warehouses. No other CEVA systems globally were affected, and all other operations continue without incident.\""
        attribution: "TechCrunch, quoting CEVA's statement to the outlet"
        source_url: "https://techcrunch.com/2026/08/10/a-data-breach-at-shipping-giant-ceva-logistics-is-rippling-across-banks-retailers-steam-gamers-and-beyond/"
      - quote: "Ceva spokesperson Ryan Fisher would not answer TechCrunch's questions about the incident, such as if the company knows how much personal data was taken, or if Ceva has received any communication from the hackers, such as a ransom demand."
        attribution: "TechCrunch"
        source_url: "https://techcrunch.com/2026/08/10/a-data-breach-at-shipping-giant-ceva-logistics-is-rippling-across-banks-retailers-steam-gamers-and-beyond/"
      - quote: "Ceva's website was not properly loading at the time of publication on Monday."
        attribution: "TechCrunch"
        source_url: "https://techcrunch.com/2026/08/10/a-data-breach-at-shipping-giant-ceva-logistics-is-rippling-across-banks-retailers-steam-gamers-and-beyond/"
      - quote: "heeft CEVA Logistics zelf nog geen enkele publieke reactie gegeven op deze recente incidenten" (\"CEVA Logistics itself has still not given any public reaction to these recent incidents\")
        attribution: "ICTMagazine.nl (Colin Baak), original article 2026-08-07, updated 2026-08-10"
        source_url: "https://www.ictmagazine.nl/nieuws/datalek-bij-ceva-logistics-groeit-uit-tot-ketencrisis/"
    triage_relevant_nuance: >
      CEVA declining to confirm or deny "any communication from the hackers,
      such as a ransom demand" leaves open (unconfirmed either way) whether
      this is an extortion/ransomware-adjacent incident versus pure data
      theft/access. No source resolves this. Do not infer ransomware.

  finding_2_vector_malware_actor_exfiltration:
    answer: >
      NO source found in this run — CEVA's own statement, TechCrunch, bol.com,
      Valve/Steam, ING, De Bijenkorf, Ajax, Ace & Tate, ictmagazine.nl,
      warehousetotaal.nl, security.nl, or the Dutch DPA's spokesperson —
      states an initial-access vector, a CVE/exploited product, a malware
      family, or a named threat actor/ransomware brand for the 29 Jul-1 Aug
      2026 order-processing intrusion. This is a genuine, confirmed gap in
      public reporting, not an omission on S4's part. Recommendation for
      ATT&CK mapping: do NOT map an initial-access technique beyond the
      third-party/supply-chain framing already captured (T1199 Trusted
      Relationship is defensible as the *systemic* vector — CEVA as a shared
      processor — but no technical initial-access technique, e.g. T1190/T1566,
      is source-supported for how CEVA itself was compromised).
    on_exfiltration_language: >
      No source states a definitive exfiltration mechanism (no mention of
      staged archives, cloud upload, protocol used, etc.). Every source uses
      hedged "access"/"taken"/"stolen" language without technical specificity:
      bol.com and CEVA use "access" ("onbevoegden mogelijk toegang hebben
      gehad" / "unauthorized parties gained access"); TechCrunch and Dutch
      press use "stolen"/"taken" as a plain-English gloss, not as a technical
      claim; Valve's notice is the most assertive but still hedged ("likely
      accessed... likely took").
    verbatim_quotes:
      - quote: "Unauthorized parties gained access to two systems used to process orders at one of its distribution centers."
        attribution: "bol.com security-incident notice"
        source_url: "https://partnerplatform.bol.com/en/nadp/security-incident-logistics-partner-of-bol"
      - quote: "CEVA receives specific delivery-related information from Steam to be able to ship physical hardware to customers in Europe, and told us these are the details the attacker likely took."
        attribution: "Valve, quoted via BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/valve-notifies-steam-hardware-customers-of-a-data-breach/"
      - quote: "De rode draad in al deze meldingen: eigen systemen en financiële gegevens bleven buiten schot, maar de persoonsgegevens die zij deelden met logistiek partner CEVA Logistics zijn mogelijk ingezien of buitgemaakt." (\"The common thread in all these notifications: [victims'] own systems and financial data stayed unaffected, but the personal data they shared with logistics partner CEVA Logistics may have been viewed or taken.\")
        attribution: "ICTMagazine.nl"
        source_url: "https://www.ictmagazine.nl/nieuws/datalek-bij-ceva-logistics-groeit-uit-tot-ketencrisis/"

  finding_3_downstream_victim_statement_specificity:
    bol_com: >
      Most specific of the downstream statements — names the exact data
      categories (name, address, email, phone, order number, EAN, track&trace)
      and the exact system type affected ("twee systemen die worden gebruikt
      voor de verwerking van bestellingen vanuit één van de distributiecentra
      van bol" — two systems used to process orders from one of bol's
      distribution centers), and gives its own notification timeline (CEVA
      told bol on 1 August; bol reported to the AP on 3 August). No vector.
      verbatim: "Het incident heeft betrekking op twee systemen die worden gebruikt voor de verwerking van bestellingen vanuit één van de distributiecentra van bol. Omdat onbevoegden mogelijk toegang hebben gehad tot persoonsgegevens van klanten, behandelen wij dit als een datalek." (source: security.nl, https://www.security.nl/posting/948208/, quoting bol's own advisory)
    valve_steam: >
      Own notice (relayed via BleepingComputer/Reddit, not a standalone press
      release) is the most detailed on WHICH data categories and WHEN Valve
      learned of it (7 August, six days after CEVA's 1 August customer
      notice), and gives the retention-window detail (CEVA holds shipping data
      up to 90 days post-order). No vector, no actor, no malware. Explicitly
      states no Steam credentials/passwords/Steam Guard/payment data were
      exposed because CEVA never had access to them.
    ing: >
      NOTABLY LESS specific and does not itself name CEVA. Reporting on ING's
      own notice states ING referred only to an unnamed "logistics partner"
      tied to its ING Rentepuntenwinkel (rewards-store) physical-goods
      fulfilment; press coverage inferred the CEVA link from context, ING's
      own text did not confirm it. This is a meaningful downgrade versus
      bol.com/Valve in terms of self-disclosed specificity.
    de_bijenkorf: >
      Least specific of all: uses only generic "beveiligingsincident"
      (security incident) language and does not name CEVA in its own
      customer-facing notice at all (name surfaces only via other outlets'
      reporting and CEVA's own confirmation to other retailers).
      verbatim: "De Bijenkorf spreekt in algemene termen over een 'beveiligingsincident' zonder namen te noemen." (BNNVARA/Kassa, quoting/paraphrasing De Bijenkorf's own advisory page https://www.debijenkorf.nl/over-de-bijenkorf/beveiligingsincident)
    ajax_ace_and_tate: >
      Not independently fetched this run (time-boxed); secondary reporting
      describes both in the same generic "security incident at a logistics
      partner" register as ING/De Bijenkorf, with no added technical
      specificity found in any source consulted.
    conclusion: >
      None of the six downstream statements add a vector, actor, or malware
      detail beyond what CEVA itself has said. bol.com and Valve are the two
      MORE specific victim statements (data categories, dates, retention
      window); ING and De Bijenkorf are LESS specific than CEVA's own
      TechCrunch statement and do not even confirm the CEVA link in their own
      words.

  finding_4_dutch_dpa_own_publication:
    answer: >
      No own Autoriteit Persoonsgegevens (AP) press release, advisory, or news
      item about this specific incident was found. The only AP-sourced
      information anywhere in reporting is spokesperson Mark Schenkel's
      comment to TechCrunch (already captured by S4) confirming ten
      organisations filed breach reports tied to this incident. The AP's
      public breach register (datalekken.autoriteitpersoonsgegevens.nl) and
      its generic "how to report a data breach" page are not case-specific and
      were not treated as primary statements on this incident.

  new_delta_dark_web_data_provenance_dispute:
    significance: >
      Genuinely new information not in S4's item, surfaced via Dutch-language
      sourcing, and directly relevant to how any "data exfiltrated/for sale"
      claim should (or should not) be attached to this incident. RTL Nieuws
      (relayed by BNNVARA/Kassa and by security.nl's forum-comment excerpt)
      reported on 2026-08-06 that a dataset of Bol/De Bijenkorf customer data
      attributed to a CEVA breach was being offered for sale on the dark web,
      and dated the underlying "digital break-in" to "begin mei" (early May)
      2026 — a full ~2.5 months before the officially disclosed 29 Jul-1 Aug
      window. However, CEVA itself (per ICTMagazine.nl's fuller, later
      reporting) DISPUTES that this dark-web-offered dataset is connected to
      the current incident at all, attributing it instead to old data from a
      separate 2025 breach. This independently corroborates S4's own
      extended_notes caveat about a distinct, older "coinbasecartel"
      ransomware.live leak-site listing for "Ceva Logistics" tied to a
      September 2025 incident. Recommend the composed entry explicitly state
      this as an unresolved discrepancy/dispute rather than adopting either
      claim, and NOT treat the "begin mei" date as displacing the officially
      confirmed 29 Jul-1 Aug window.
    verbatim_quotes:
      - quote: "De digitale inbraak bij CEVA waar deze gegevens zijn buitgemaakt, vond begin mei plaats. De cybercriminelen stellen zelf dat ze een database met allerlei klantgegevens hebben bemachtigd." (\"The digital break-in at CEVA where this data was obtained took place in early May. The cybercriminals themselves claim to have obtained a database with various customer data.\")
        attribution: "BNNVARA/Kassa, citing RTL Nieuws' own reporting"
        source_url: "https://www.bnnvara.nl/kassa/artikelen/gestolen-gegevens-van-klanten-bol-en-bijenkorf-te-koop-op-dark-web"
      - quote: "Buitgemaakte data van het bedrijf wordt al op het darkweb aangeboden, maar volgens het bedrijf is dat oude data van een eerdere hack. [...] Volgens het bedrijf is dat echter oude data van een eerdere hack uit 2025." (\"Data taken from the company is already being offered on the dark web, but according to the company that is old data from an earlier hack. [...] According to the company, however, this is old data from an earlier hack in 2025.\")
        attribution: "ICTMagazine.nl (Colin Baak)"
        source_url: "https://www.ictmagazine.nl/nieuws/datalek-bij-ceva-logistics-groeit-uit-tot-ketencrisis/"
      - quote: "Ondertussen heeft CEVA de getroffen systemen geïsoleerd en offline gehaald, is er een extern onderzoek gestart en zijn toezichthouders geïnformeerd." (\"Meanwhile, CEVA has isolated and taken offline the affected systems, an external investigation has been started, and regulators have been informed.\")
        attribution: "ICTMagazine.nl, 2026-08-10 update"
        source_url: "https://www.ictmagazine.nl/nieuws/datalek-bij-ceva-logistics-groeit-uit-tot-ketencrisis/"
    caveat: >
      "Isolated and took offline the affected systems" is a remediation
      detail not present in S4's evidence set and worth folding in (contained
      = access to compromised order-processing systems was cut) — but note it
      comes from ICTMagazine's own synthesis, not a directly quoted CEVA
      statement, so treat as B-reliability journalism, not an A-grade CEVA
      primary.
    new_entities_note: "no new entity proposed — this is a fact-pattern delta on the existing incident:ceva-logistics-third-party-breach-2026-08 entity S4 already proposed."

q2_leak_site_claims:
  elixi_international_sa:
    claim: "Space Bears ransomware group listed Elixi International SA (Chiasso, Switzerland, pharmaceutical distributor) on its leak site, 2026-08-10."
    checks_performed:
      - "Elixi International's own website (elixi-int.com) — no banner, news item, or incident notice found."
      - "WebSearch in Italian for tio.ch, cdt.ch, laregione.ch coverage — no results found; laRegione.ch's cyberattack coverage index returned only unrelated prior Swiss incidents (Stadler Rail, IWB, Steelco Belimed, Swisscom, Comparis, Habib Bank Zurich)."
      - "NCSC-CH Security Hub (security-hub.ncsc.admin.ch) — checked the 15 most recent published posts (2026-07-24 through 2026-08-07); no mention of Elixi or Space Bears."
      - "General WebSearch for the claim beyond the original leak-site posting — only threat-intel/dark-web-monitoring aggregator posts found (DeXpose.io), which repeat the leak-site listing verbatim rather than provide independent corroboration or victim confirmation."
    result: "DROPPED — confirmed clean negative. No victim statement, no Ticino/Swiss press coverage, no NCSC-CH mention found. Only source is the leak-site claim itself and an aggregator restating it (not admissible per the fake-news gate)."

  universite_libre_de_bruxelles:
    claim: "Qilin ransomware group claimed Université Libre de Bruxelles (Belgium), listed 2026-08-09."
    checks_performed:
      - "ULB's own homepage (ulb.be) — no banner or news item about a cyberattack; current news items are about tuition-fee regulation, summer prep courses, and an unrelated podcast."
      - "ULB's own IT-status page (radar-it.ulb.be) — checked all entries; only two messages present (2026-07-16 and 2026-07-30, both about the status page itself), nothing dated in or near the claim window."
      - "WebSearch for RTBF/Le Soir/Bruzz/De Standaard coverage — the only ULB-cyberattack RTBF article found is from 2020 (a historical, unrelated incident: 'L'ULB relance ses serveurs après avoir été ciblée par une cyberattaque'), not 2026. No August 2026 Belgian press coverage found."
      - "An X/Twitter post cited in search results claiming to be ULB's own reaction carries a status-ID numerically inconsistent with a 2026 timestamp (looks like a much older tweet resurfaced by search) and is excluded per the no-Telegram/X-only-sourcing rule regardless."
      - "CCB Belgium (ccb.belgium.be) — general Qilin threat-intelligence report page found, but it is a generic actor profile, not a statement confirming this specific victim."
    result: "DROPPED — confirmed clean negative. No ULB statement, no Belgian press coverage found (only a misdated/stale search hit and threat-intel aggregators — DeXpose.io, Mallory.ai — repeating the leak-site claim with unverifiable precision-looking victim-count figures that are not sourced to any confirmation)."

q3_research_backstop:
  time_spent: "~12 minutes, within the one-third budget guideline"
  result: "No qualifying new item found — confirms S1/S3 coverage was not missing anything material in the specified categories."
  candidates_checked_and_rejected:
    - candidate: "SOCFortress Medium post on internet-facing ICS/water-utility vulnerabilities (CVE-2021-22681, Rockwell MicroLogix 1400)"
      reason_rejected: "General awareness/governance piece, not substantive original technical research; no exploitation detail, protocol specifics, or PoC; references a historical (2021) CVE and July 2026 water-utility incidents already in the public record via CISA advisories. No outbound citations provided by the author."
    - candidate: "CISA ICS Advisories listing page"
      reason_rejected: "Landing/filter page only; could not enumerate dated entries without further drilling, and the Iranian-PLC-targeting advisory update it would surface is dated 22 July 2026 — outside the 26h window and already broadly reported for weeks."
    - candidate: "ESET H1 2026 threat report, Certighost AD exploit coverage, Semperis KerberLoss/ResetNightmare research"
      reason_rejected: "ESET's H1 2026 report and the Certighost/Semperis items are all dated late July 2026 or earlier (Semperis is also on the explicitly-already-covered publisher list); no fresh August 10-11 development found for any of them."
    - candidate: "watchTowr Labs / Volexity / Recorded Future Insikt Group blogs"
      reason_rejected: "No specific August 10-11 2026 post surfaced by search; general search only returned each vendor's evergreen blog-index page, which per source-link discipline cannot be cited as a dated item without a specific post to drill into."

