    reason: "Ajax and Ace & Tate's own CEVA-breach customer notices were not independently fetched this run (time-boxed against the Q1 priority); their content is inferred only from secondary Dutch-press summaries (ICTMagazine.nl, security.nl) which describe them as similarly generic to ING/De Bijenkorf. A follow-up pass could fetch ajax.nl/fans/informatie-beveiligingsincident-bij-een-logistieke-partner and aceandtate.com directly if further granularity is needed."
  - source_id: n/a
    reason: "The RTL Nieuws original article (rtl.nl) that is the ultimate primary source for the 'begin mei' breach-date and dark-web-sale claim could not be fetched directly — the page sits behind an RTL/DPG Media privacy/consent gate that returned only cookie-wall JavaScript via both direct fetch and the bridge tool (one retry each). The claim was corroborated instead via two independent secondary citations (BNNVARA/Kassa's jina-rendered full article text, and a verbatim forum excerpt of the same RTL Nieuws sentence reproduced on security.nl) that both quote RTL Nieuws' wording closely enough to be treated as reliable relay of the original claim, but neither is RTL Nieuws' own page."
