    extended_notes: |
      Transferable lesson for the constituency: a single compromised third-party fulfilment/warehousing vendor triggered independent GDPR Art. 33/34 notification duties at ten unrelated data controllers simultaneously, several days apart (CEVA notified customers ~Aug 1; Valve only learned Aug 7). Public-sector and CI operators that outsource hardware provisioning, mail/parcel logistics, or back-office order processing to shared third-party warehousing providers face the same fourth-party blast-radius and lagged-notification problem. No exploited CVE or ransomware brand has been disclosed as of 2026-08-10; worth a follow-up pass once CEVA or the Dutch DPA publish root-cause detail. Note the CEVA-breach story is unrelated to a separate, older "coinbasecartel" ransomware.live leak-site listing for "Ceva Logistics" tied to a September 2025 incident — the two should not be conflated.
