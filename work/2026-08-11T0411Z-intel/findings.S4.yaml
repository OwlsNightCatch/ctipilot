    summary: |
      CEVA Logistics — the France-headquartered, $18.3bn-revenue contract-logistics arm of CMA CGM — disclosed on 1 August 2026 that unauthorized parties gained access to two order-processing systems at one of its European distribution centers (the "Veerweg" fulfilment site named in bol's own advisory) between 29 July and 1 August 2026. The operational blast radius is stated as eight European warehouses; CEVA says no other CEVA systems globally were affected. Because CEVA processes fulfilment and shipping data on behalf of many unrelated retail and B2B customers, the single compromise cascaded into independent GDPR breach-notification duties for at least ten downstream organisations across at least four sectors: e-commerce (bol.com, De Bijenkorf), banking (ING), professional sport (AFC Ajax), eyewear retail (Ace & Tate), and gaming hardware (Valve/Steam, whose European Steam Deck/Machine/Controller buyers had shipping records held by CEVA for up to 90 days post-purchase). Exposed data is consistently described as name, address, phone number, email, and order/tracking metadata (EAN codes for bol); no payment credentials, account passwords, or MFA/Steam Guard secrets were stored on the compromised CEVA systems and none of the affected companies' own core IT estates were breached. Valve says it only learned of the exposure on 7 August, six days after CEVA's own customer notification — illustrating the notification-lag a shared-fulfilment-vendor incident imposes on every downstream data controller. The Dutch data protection authority (Autoriteit Persoonsgegevens) confirmed to TechCrunch it has received breach reports from ten separate organisations tied to this one CEVA incident; bol.com states it proactively suspended data exchange with CEVA pending assurance the intrusion is contained. No ransomware group or extortion brand has publicly claimed responsibility as of this writing, and neither the initial-access vector into CEVA's order-processing systems nor any exploited vulnerability has been disclosed by CEVA, which "has not commented publicly about the digital break-in" beyond the customer notifications relayed by its clients.
    region_nexus: "Netherlands, France, Belgium — direct EU nexus; downstream exposure also reaches Steam hardware buyers across the wider EU/EEA"
