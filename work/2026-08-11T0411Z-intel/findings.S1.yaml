    reason: "Listing page (https://ssd-disclosure.com/) returns a Cloudflare-style robot-challenge interstitial via both direct fetch (HTTP 202) and jina-reader fallback this run, despite the 2026-08-10 note that per-article pages fetch cleanly direct. WebSearch (site:ssd-disclosure.com 2026) surfaced only articles already covered or from before the window (newest on-point: a July 2026 vBulletin write-up already in prior_coverage). No in-window SSD-disclosure item found. Rotation priority remains unresolved for next run — recommend re-testing whether the listing challenge is time-of-day/rate-limit dependent."
  - source_id: chrome-releases
    reason: "Confirmed the flagged defect persists: python3 tools/fetch_source.py feed https://chromereleases.googleblog.com/feeds/posts/default returns method=jina, count=0 (empty) this run too. Direct GET of https://chromereleases.googleblog.com/ returns the Blogger HTML shell (post list not present in the fetched body — likely lazy-loaded/paginated). Recommend trying the Blogger legacy feed path https://chromereleases.googleblog.com/feeds/posts/default?alt=rss or a dated archive path (e.g. /2026/08/) in a follow-up run; not demoted per standing guidance."
  - source_id: siemens-productcert-csaf
    reason: "Confirmed persistent 403 on the CSAF directory (https://cert-portal.siemens.com/productcert/csaf/) via both direct and jina-reader transport this run, consistent with the 2026-08-02 note. No working alternative recipe found; not logged as a hard fetch_failures entry since this matches already-documented, non-actionable host behaviour rather than new information."
  - source_id: mysites-guru
    reason: "jina reader returned the Joomla/WordPress extension-vulnerability post listing (10 items) but without per-item publication dates in the extracted summary, so in-window status could not be confirmed for any item; none of the listed items (Fabrik, Gridbox, JCE, SP Page Builder, EasyStore, Regular Labs, PageBuilder CK, Events Booking) matched a CVE or product already flagged as trending this window, and none could be confirmed to fall inside the 26h window — excluded on recency-uncertainty grounds rather than included speculatively."
