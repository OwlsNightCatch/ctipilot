  - title: "Belgian eID browser extension (Connective/Nitro Software) let any website replay auth tokens, decrypt eID PINs, and drive-by-RCE via arbitrary DLL load — 146 days to fully patch"
    sources:
      - { url: "https://amibeingpwned.com/blog/8-in-10-banks-in-belgium", publisher: "James Arnott / Bay Area Labs (amibeingpwned.com)", date: "2026-08-07", role: "primary" }
      - { url: "https://www.securityweek.com/critical-flaws-discovered-in-belgian-eid-software-used-by-2-million-people/", publisher: "SecurityWeek", date: "2026-08-10", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"Belgium ten largest banks 60 government agencies vulnerability software August 2026\") → pivot: SecurityWeek, URL https://www.securityweek.com/critical-flaws-discovered-in-belgian-eid-software-used-by-2-million-people/ → primary: amibeingpwned.com researcher write-up, URL https://amibeingpwned.com/blog/8-in-10-banks-in-belgium"
    summary: |
      James Arnott (Bay Area Labs) disclosed, at DEF CON and in a technical write-up published 2026-08-07, three chained vulnerabilities in Connective, the browser-native-messaging signing extension built by Nitro Software Belgium — a Qualified Trust Service Provider on the eIDAS Trusted List used by 8 of Belgium's 10 largest banks and 60+ government agencies (CSAM.be, Doccle.be) to authenticate against the Belgian eID card and itsme digital identity, and to execute legally binding electronic signatures; SecurityWeek's 2026-08-10 report put the affected user base at roughly 2 million. First, the extension forwards native-messaging requests to its local host without the request's origin, so any web page can replay a previously issued activationToken and gain full access to the eID/Maestro card interface without any card interaction (CWE-863/CWE-347). Second, a pinToken returned to the calling web page bundles ciphertext and its own decryption key in one 48-byte base64 blob: bytes 0,2,4...30 form an AES-128 key, bytes 32+ are ciphertext, and a hardcoded IV (a6 a6 a6...) decrypts it to the plaintext PIN plus a TTL — letting any page that triggers a VERIFY_PIN dialog (with attacker-controlled dialog text for social engineering) recover the PIN and forge signing approvals (CWE-327/CWE-200). Third, the GET_READERS command accepts a library parameter with an unsanitized relative path (e.g. ..\..\..\..\Downloads\lib.dll), so a page that gets the user to download a polyglot file disguised with a .dlly extension (bypassing Chrome's .dll download warning) can have the native host load and execute an attacker-supplied DLL at user privilege — a drive-by RCE requiring only a site visit, no card present (CWE-426/CWE-94). Reported roughly January 2026, Nitro shipped a partial fix 2026-05-08 (remote origin validation only — RCE and pinToken paths still exploitable), researchers flagged the incomplete patch 2026-05-19, and a complete fix (library command disabled, pinToken cached server-side as a UUID) landed 2026-06-01 with origin checks fully enforced by 2026-07-22 — 146 days end to end. No CVE has been assigned.
    region_nexus: "Belgium (EU member state) — national eID/itsme digital-identity infrastructure and 8 of the country's 10 largest banks plus 60+ government agencies"
    primary_sector_nexus: "direct"
    sector: "public-sector, finance"
    cves: []
    techniques: [T1189, T1203, T1606, T1552]
    affected_products: ["Connective Signing Extension (Nitro Software Belgium)"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Any web page can just replay these tokens and get full access to the Connective system on the user's machine."
        attribution: "James Arnott, Bay Area Labs (amibeingpwned.com)"
        source_url: "https://amibeingpwned.com/blog/8-in-10-banks-in-belgium"
      - quote: "Any web page can trigger a drive-by RCE by getting the native binary to load and run an attacker-supplied library."
        attribution: "James Arnott, Bay Area Labs (amibeingpwned.com)"
        source_url: "https://amibeingpwned.com/blog/8-in-10-banks-in-belgium"
      - quote: "Having the PIN plus the ability to send commands to the card is the same thing as having the card in your hand."
        attribution: "James Arnott, Bay Area Labs (amibeingpwned.com)"
        source_url: "https://amibeingpwned.com/blog/8-in-10-banks-in-belgium"
      - quote: "Nitro fully remediated the issues 146 days after the initial report and awarded a $200 bug bounty."
        attribution: "James Arnott, Bay Area Labs (amibeingpwned.com), as reported by SecurityWeek"
        source_url: "https://www.securityweek.com/critical-flaws-discovered-in-belgian-eid-software-used-by-2-million-people/"
    extended_notes: |
      No CVE and no vendor advisory URL was located for Connective/Nitro Software as of this run — the researcher's write-up and the vendor's own (undated, unlinked) trust-center page are the only vendor-side references found; check for a forthcoming Nitro Software or eIDAS-body advisory in a follow-up run. Detection angle for any org that has deployed or interacts with Connective/eID signing extensions from Belgian counterparties: native-messaging traffic from a browser extension to its host process should never originate from arbitrary web-page JavaScript without an origin check — this is a reusable red flag for any "eID/qualified-signature browser extension" architecture, not just this vendor, since the same missing-origin-check pattern recurs across smart-card/eID browser bridges generally. The 146-day full remediation timeline (with an incomplete interim patch that left two of three bugs live for another month) is itself a supply-chain-risk data point for any government/finance procurement process evaluating eIDAS Qualified Trust Service Providers.
    watchlist: []

  - title: "UPDATE — macOS Screen Sharing pre-auth remote root: independent researchers reproduce working exploits for CVE-2026-65400 and its uncredited sibling bug in four hours; ~40,000 hosts exposed"
    sources:
      - { url: "https://blog.calif.io/p/no-country-for-old-passwords", publisher: "Calif (calif.io)", date: "2026-08-10", role: "primary" }
      - { url: "https://www.huntress.com/blog/macos-screen-sharing-rce-patched", publisher: "Huntress", date: "2026-08-07", role: "corroborating" }
      - { url: "https://support.apple.com/en-us/148170", publisher: "Apple (vendor advisory, macOS 26.6.1/15.7.9/14.8.9)", date: "2026-08-06", role: "corroborating" }
    discovery_trace: "first seen at: calif-codex, URL https://blog.calif.io/feed (item 'No Country for Old Passwords') → primary: calif.io, URL https://blog.calif.io/p/no-country-for-old-passwords → corroboration: Huntress, URL https://www.huntress.com/blog/macos-screen-sharing-rce-patched → corroboration: Apple vendor advisory, URL https://support.apple.com/en-us/148170"
    novelty: "update-of:2026-08-08/cve-2026-65400-macos-screen-sharing-auth-state-bypass"
    summary: |
      The prior entry on CVE-2026-65400 covered only Apple's advisory text ("an attacker on the network may be able to authenticate to Screen Sharing without valid credentials," no exploitation reported). This is a material delta: independent research (calif.io, corroborated by Huntress) confirms the flaw is a pre-authentication remote-root primitive with working exploits reproduced within hours of patch release, publishes the root-cause mechanism for both the CVE'd bug and an uncredited sibling, and adds internet-exposure telemetry the original advisory did not carry. Root cause: screensharingd implements Secure Remote Password (SRP) authentication for the Remote Framebuffer (RFB) protocol; the frame-length validator on an oversized frame bails out early and returns a stale success value from a prior read, which the caller's state machine interprets as "auth step passed," letting the connection proceed as authenticated without SRP ever completing — sessions then run in cleartext with no cryptographic protection. Because screensharingd runs as root, this is a genuine pre-auth remote-root primitive, not merely an auth bypass into a low-privileged account: an attacker on the network can read/write arbitrary files as root and establish persistence via LaunchDaemon or shell-startup-file modification. A second, functionally distinct bug in the same source file (a single incorrect early return, discovered independently by researcher fG!/osxreverser, never reported to Apple, and apparently patched silently on 2026-07-27 in macOS 26.6 without ever receiving a CVE or being acknowledged in that advisory as pre-auth) requires only a valid account NAME — not a secret, since macOS displays usernames on its login window. Both bugs are pure logic flaws (no heap grooming, no ASLR defeat, no race): calif.io diffed the 26.6→26.6.1 and 26.5.2→26.6 binaries and had working exploits for each within roughly four hours. A prior researcher scan cited by calif.io found approximately 40,000 Macs with Screen Sharing reachable from the internet — concentrated in the US but including university networks and companies — and Huntress separately found "tens of thousands" of potentially vulnerable bare-metal Apple-device hosting instances via Censys, noting hosting providers still provisioning n-1 macOS images as base templates. NVD lists CVE-2026-65400 at CVSS 7.1; Apple's own advisory publishes no score. A related, less severe post-auth bug requiring the legacy VNC password (CVE-2026-43760, reported via an automated GPT-5.5-assisted workflow by Bynario) was fixed in the same 26.6 release on 2026-07-27.
    region_nexus: "global — any internet-exposed macOS host with Screen Sharing enabled, unpatched (pre-26.6.1/15.7.9/14.8.9)"
    primary_sector_nexus: "indirect"
    sector: "public-sector, education, finance, telco"
    cves: [CVE-2026-65400, CVE-2026-43760]
    techniques: [T1190, T1556, T1543]
    affected_products: ["Apple macOS (Screen Sharing / screensharingd)"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    evidence:
      - quote: "If Screen Sharing is enabled, any network attacker can exploit the bug to log in as any account, without knowing the password."
        attribution: "Calif (@calif_io)"
        source_url: "https://blog.calif.io/p/no-country-for-old-passwords"
      - quote: "screensharingd, the program answering those connections, runs as root ... an attacker did not stop at your account. They could breach every other account on the machine and install whatever they wanted."
        attribution: "Calif (calif.io)"
        source_url: "https://blog.calif.io/p/no-country-for-old-passwords"
      - quote: "The daemon's frame-length validator erroneously returns a stale success status, so the connection is treated as authenticated."
        attribution: "Huntress"
        source_url: "https://www.huntress.com/blog/macos-screen-sharing-rce-patched"
      - quote: "Session username root is a suspicious indicator, as this user on macOS is disabled by default, and few administrators would enable that user."
        attribution: "Huntress"
        source_url: "https://www.huntress.com/blog/macos-screen-sharing-rce-patched"
    extended_notes: |
      Triage discriminator directly from the sources: a successful Screen Sharing (RFB/VNC, TCP 5900 or Bonjour-discovered) authentication event logged for the "root" account is not a benign admin action — root is a disabled account on macOS by default, so any Screen Sharing session logon as root is a strong indicator of this exploit class rather than legitimate administration. Hardening lever is unambiguous and immediate: update to 26.6.1/15.7.9/14.8.9, or where Screen Sharing is not actively needed, disable it outright; where it must stay on, place it behind a VPN/firewall rule rather than exposing TCP 5900 or the Screen Sharing Bonjour service directly to the internet. Fleet operators (including any organization provisioning Mac minis/Studio for remote-admin use, a common pattern for lights-out infrastructure) should inventory Screen Sharing exposure now, since Huntress notes hosting providers were still shipping vulnerable n-1 images as of this report.
