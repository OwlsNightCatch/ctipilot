items:
  - title: "#StopRansomware: Gunra ransomware-as-a-service exploits FortiOS auth-bypass chain, backdoors MFA, and ships a Linux encryptor with a recoverable-key flaw"
    sources:
      - { url: "https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-222a", publisher: "CISA/FBI/DC3/NSA/USSS/KNPA (joint #StopRansomware advisory AA26-222A)", date: "2026-08-10", role: "primary" }
      - { url: "https://therecord.media/ransomware-south-korea-fbi-gunra", publisher: "The Record (Recorded Future News)", date: "2026-08-10", role: "corroborating" }
      - { url: "https://intel.breakglass.tech/post/gunra-ransomware-s-linux-variant-has-a-fatal-flaw-time-seeded-rand-makes-encrypted-files-recoverable-without-paying", publisher: "breakglass.tech (independent research)", date: "2026-03-12", role: "corroborating (background technical detail on the Linux PRNG weakness cited by the fresh advisory)" }
    discovery_trace: "first seen at: cisa-advisories, URL https://www.cisa.gov/cybersecurity-advisories/all.xml (feed item '#StopRansomware: Gunra Ransomware') → primary: CISA AA26-222A, URL https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-222a → corroboration: The Record, URL https://therecord.media/ransomware-south-korea-fbi-gunra → background technical pivot: breakglass.tech, URL https://intel.breakglass.tech/post/gunra-ransomware-s-linux-variant-has-a-fatal-flaw-time-seeded-rand-makes-encrypted-files-recoverable-without-paying"
    summary: |
      FBI, CISA, DC3, NSA, USSS and South Korea's KNPA published a joint #StopRansomware advisory on Gunra, a double-extortion RaaS built on leaked Conti source code that emerged April 2025 and formalized an affiliate program (dark-web management panel, configurable builder, cross-platform lockers) in January 2026, also branding as "Golden Community." Victims span Americas, Europe, Middle East, Africa and APAC across healthcare, financial services, critical manufacturing, transportation, government services and facilities, and utilities. Initial access is primarily exploitation of known FortiOS/FortiProxy authentication-bypass vulnerabilities CVE-2024-55591 and CVE-2025-24472 (CWE-288) on internet-facing firewall/VPN appliances, creating a persistent super-user account named forticloud-sync with a hard-coded password via scheduled-task abuse; KNPA separately observed credential-exposure and SSH access-control weaknesses on VPN gateways used for initial access. Documented lateral movement uses Impacket's psexec.py/smbclient.py over SMB and stolen VDI sessions over RDP; credential access includes secretsdump.py against domain controllers for NTDS hash extraction enabling pass-the-hash/pass-the-ticket, SSL-VPN traffic sniffing to capture VDI login sessions, session-cookie hijacking, and — most notably — modification of a victim's VDI authentication-portal files so a Gunra-chosen one-time-password value always validates, creating a persistent MFA-bypass backdoor. Actors disable volume shadow copies via WMIC and have deleted backup/DR-site archives before encryption. The Windows encryptor uses ChaCha20+RSA-4096, renames files to .ENCRT, and writes ransom notes named R3ADM3.txt with 5-7 day Tor/qTox negotiation windows and demands starting in the tens of millions of USD. Defensively significant: the Linux ELF variant (.GNRA extension) seeds its ChaCha20 keystream with musl-libc rand() initialized by time(), collapsing the keyspace to roughly 256 candidate seeds per second of encryption — independent research (cited by the advisory) shows this lets responders brute-force the seed against a file with known plaintext and reconstruct keys from filesystem timestamps without paying, a weakness absent from the Windows build (which uses CryptGenRandom).
    region_nexus: "global — advisory explicitly lists Europe among victim regions and names government services/facilities and utilities among targeted sectors, directly relevant to Swiss/EU public-sector and CI defenders"
    primary_sector_nexus: "direct"
    sector: "public-sector, healthcare, finance, energy, transport"
    cves: [CVE-2024-55591, CVE-2025-24472]
    techniques: [T1190, T1078.001, T1078.002, T1133, T1098, T1021.001, T1021.002, T1003.003, T1550.002, T1550.003, T1540, T1556.006, T1555, T1070.003, T1685, T1622, T1083, T1049, T1560, T1530, T1005, T1114, T1105, T1572, T1567, T1048, T1486, T1490, T1047]
    affected_products: ["Fortinet FortiOS", "Fortinet FortiProxy"]
    entity_keys: []
    new_entities:
      - { key: "actor:gunra", type: actor, name: "Gunra", aliases: ["Golden Community"],
          summary: "Double-extortion ransomware-as-a-service built on leaked Conti source code; emerged April 2025, formalized a dark-web RaaS affiliate program January 2026; joint FBI/CISA/NSA/USSS/KNPA advisory AA26-222A (2026-08-10) documents FortiOS exploitation for initial access, an MFA-bypass backdoor technique, and a cryptographically weak Linux encryptor." }
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Gunra ransomware appears to be based on, or significantly influenced by, the Conti ransomware source code leaked in 2022."
        attribution: "CISA/FBI joint advisory AA26-222A"
        source_url: "https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-222a"
      - quote: "Gunra actors modified authentication processing files on the corporate VDI authentication portal server to allow successful authentication when a specific, Gunra-designated one time password (OTP) value was entered, thereby enabling the continuous bypass of multi-factor authentication (MFA)"
        attribution: "CISA/FBI joint advisory AA26-222A"
        source_url: "https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-222a"
      - quote: "As of March 2026, researchers identified a weakness in the Gunra ransomware's Linux Executable and Linkable Format (ELF) variants (appended with .GNRA); the encryption keys use a weak pseudorandom number generator (PRNG) seeded with the predictable system srand(time(NULL))."
        attribution: "CISA/FBI joint advisory AA26-222A"
        source_url: "https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-222a"
      - quote: "The Linux variant uses rand() from musl-libc, seeded by time(). [This produces] roughly 256 possible seeds per second of encryption."
        attribution: "breakglass.tech"
        source_url: "https://intel.breakglass.tech/post/gunra-ransomware-s-linux-variant-has-a-fatal-flaw-time-seeded-rand-makes-encrypted-files-recoverable-without-paying"
    extended_notes: |
      Detection framing for defenders: the advisory itself supplies a strong benign-lookalike discriminator set — Gunra's late-night/early-morning (22:00-06:00) reconnaissance timing, use of common dual-use tooling (AnyDesk, MobaXterm, Google Remote Desktop, 7-Zip/WinRAR/RClone, Sliver) that requires baseline-vs-anomaly correlation rather than presence-alone alerting, and the specific account-manipulation pattern of an "unused" account having its mandatory-password-change flag cleared. The MFA-backdoor technique (modifying VDI auth-portal files to accept one fixed OTP) is a durable, config-integrity-monitoring detection target: file-integrity monitoring on VDI/SSO authentication-service binaries and config, plus alerting on any successful auth event where the presented OTP repeats across sessions/users, would catch this independent of the initial-access vector.
