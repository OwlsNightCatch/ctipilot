  - title: "Compromised maintainer GitHub credentials pushed RCE-via-postinstall into two React hook packages in May; disclosed three months later, never reached npm"
    sources:
      - { url: "https://github.com/dai-shi/use-reducer-async/security/advisories/GHSA-2786-p4vj-vx8x", publisher: "GitHub Security Advisory (dai-shi/use-reducer-async)", date: "2026-08-10", role: "primary" }
      - { url: "https://github.com/dai-shi/use-context-selector/security/advisories/GHSA-7h6v-mwq6-jhm8", publisher: "GitHub Security Advisory (dai-shi/use-context-selector)", date: "2026-08-10", role: "primary" }
    discovery_trace: "first seen at: enisa-euvd, discovery sweep of recent/criticals listing → EUVD-2026-55688 / EUVD-2026-55661 → primary: GitHub Security Advisory GHSA-2786-p4vj-vx8x, URL https://github.com/dai-shi/use-reducer-async/security/advisories/GHSA-2786-p4vj-vx8x, and GHSA-7h6v-mwq6-jhm8, URL https://github.com/dai-shi/use-context-selector/security/advisories/GHSA-7h6v-mwq6-jhm8"
    summary: |
      GitHub Security Advisories published 2026-08-10 (CVE-2026-48159 and CVE-2026-48158) disclose that between 2026-05-18 and 2026-05-19, the default branches of two React-hook utility packages maintained by the same developer (dai-shi, also known for Zustand/Jotai/Valtio, though this run found no evidence those other repositories were touched) contained malicious commits adding src/install.js, wired into the package.json postinstall hook. On npm install against an affected checkout, the script fetched a JavaScript payload from an attacker-controlled HTTPS endpoint (configurable via an environment variable), disabled TLS certificate verification, and eval'd the response with require available in scope — full RCE as the invoking user, with execution deliberately skipped on CI and cloud/serverless environments to target developer workstations specifically. Root cause per the advisory: the maintainer's own development machine was compromised, giving the attacker the maintainer's GitHub push credentials directly — no npm token or registry compromise was involved, and the malicious package versions were never published to npm. The commits were force-pushed away roughly 23 hours after introduction (detected ~8 hours in), so the practical blast radius is limited to anyone who ran npm install against a direct clone, fork, or SHA-pinned reference to the affected commit range during that window; both advisories note local clones, forks, and direct-SHA URLs may still retain the malicious commits today. The advisories were published three months after the incident closed, with no prior public disclosure found in this run.
    region_nexus: "global (open-source npm/GitHub ecosystem)"
    primary_sector_nexus: "indirect"
    sector: "public-sector, finance, telco"
    cves: [CVE-2026-48159, CVE-2026-48158]
    techniques: [T1195.002, T1552.001]
    affected_products: ["use-reducer-async (npm/GitHub)", "use-context-selector (npm/GitHub)"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "The commits were removed by force-push, but local clones, forks, and direct-SHA URLs may still contain them, and npm install against an affected checkout will still execute the code today. The package was not published to npm."
        attribution: "GitHub Security Advisory GHSA-2786-p4vj-vx8x (dai-shi/use-reducer-async)"
        source_url: "https://github.com/dai-shi/use-reducer-async/security/advisories/GHSA-2786-p4vj-vx8x"
      - quote: "A maintainer's development machine was compromised, giving the attacker access to that maintainer's GitHub credentials. The machine has been reinstalled and all GitHub and npm credentials rotated."
        attribution: "GitHub Security Advisory GHSA-2786-p4vj-vx8x (dai-shi/use-reducer-async)"
        source_url: "https://github.com/dai-shi/use-reducer-async/security/advisories/GHSA-2786-p4vj-vx8x"
    extended_notes: |
      Included as a technique-class example (compromised-maintainer-workstation-to-postinstall-RCE via GitHub push access, distinct from the more commonly reported compromised-npm-token pattern) rather than for current live risk — the incident closed in May 2026 and the affected packages were never on the npm registry, so the practical exposure window is long past for anyone not sitting on a stale direct-SHA dependency reference. No independent third-party research or news coverage of this specific incident was found in this run; flagging borderline given the age and narrow blast radius versus the genuine three-months-later fresh disclosure date.
    watchlist: []
    borderline: true
    borderline_reason: "underlying compromise is 3 months old and fully contained (never published to npm, narrow ~23h exposure window); only the GHSA disclosure itself is fresh (2026-08-10) and single-sourced to the maintainer's own two advisories"

