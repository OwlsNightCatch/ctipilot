items:
  - title: "Liechtenstein takes its Commercial Register offline as a precaution, widening the post-VwbP-breach system review to a fifth government service"
    sources:
      - { url: "https://www.presseportal.ch/de/pm/100000148/100941551", publisher: "Regierung des Fürstentums Liechtenstein", date: "2026-08-10", role: primary }
      - { url: "https://www.lie-zeit.li/2026/08/handelsregister-voruebergehend-vom-netz-genommen/", publisher: "lie:zeit online", date: "2026-08-10", role: corroborating }
    discovery_trace: >
      first seen at: WebSearch ("Liechtenstein VwbP Register Cyberangriff Update August 2026") →
      pivot: vaterland.li teaser, URL https://www.vaterland.li/liechtenstein/wirtschaft/nach-cyberangriff-handelsregister-voruebergehend-vom-netz-genommen-art-750493 (paywalled beyond teaser) →
      pivot: WebSearch ("Liechtenstein Regierung Handelsregister vom Netz genommen Medienmitteilung") →
      primary: Regierung des Fürstentums Liechtenstein official wire release, URL https://www.presseportal.ch/de/pm/100000148/100941551 →
      corroborating (same-text wire syndication): lie:zeit online, URL https://www.lie-zeit.li/2026/08/handelsregister-voruebergehend-vom-netz-genommen/
    summary: >
      The Government of Liechtenstein disclosed on 2026-08-10 that it had also taken the Handelsregister
      (Commercial Register) offline over the preceding weekend as a precaution connected to the ongoing
      IT security review following the criminal cyberattack on the Verzeichnis wirtschaftlich berechtigter
      Personen (VwbP, the beneficial-ownership register) first disclosed on 2026-08-02 and already tracked
      in this store. The government states there are no indications of an attack on the Handelsregister
      itself — the take-down extends the same precautionary review programme that had already pulled four
      other e-government systems (the eMWST VAT portal, the Lides reporting platform, the central account
      register and the Intax tax system) off the network on 2026-08-05. The review phase is expected to
      last a few days per system; any vulnerabilities found will be remediated before a system is
      reconnected, and reconnection across the affected systems will be staggered over the coming days to
      weeks. During the outage, Commercial Register extracts are only obtainable in person at the Amt für
      Justiz counter or via a published email address, and the government states this keeps its
      anti-money-laundering and international compliance obligations fully met throughout. No new forensic
      detail on the original VwbP intrusion itself (actor, confirmed entry vector, or exfiltration scope)
      accompanied this update.
    region_nexus: "Liechtenstein; downstream operational impact on Swiss and EU fiduciaries, trustees and banks that rely on Handelsregister extracts for KYC/AML verification"
