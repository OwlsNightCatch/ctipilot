    extended_notes: >
      This is a scope/operational-impact delta on the tracked VwbP incident, not a new technical finding:
      it adds a fifth precautionarily-isolated system but discloses no new detail on the original intrusion
      vector, actor, or exfiltration scope. The transferable point for the constituency is operational:
      Liechtenstein's finance-hub registries are tightly coupled into Swiss and EU compliance workflows
      (AML/KYC checks, beneficial-ownership verification for cross-border trust and fiduciary structures),
      so a multi-system, multi-week precautionary outage at a small-jurisdiction registry operator produces
      a real, if narrow, availability dependency for downstream Swiss/EU financial-sector and legal-entity
      due-diligence processes — worth noting for any compliance team whose KYC pipeline calls the
      Liechtenstein Handelsregister programmatically.
