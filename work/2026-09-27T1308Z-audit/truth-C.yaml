- entry: entries/2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally.md
  verdict: imprecision
  defect: >
    The 2026-09-27 update section states the Shipup compromise had "unauthorized access confirmed
    between 31 July and 17 August 2026, the same window this entry's earlier coverage already
    established for the campaign generally" — but this entry's own 2026-08-12 update said only
    "the exploitation window has been open since at least 3 August," a three-day discrepancy the
    new section does not reconcile, and its own cited source explicitly attributes the 31 July-17
    August window to "previous dossiers" (other Shipup-linked retailers) and states plainly that
    Carrefour's own notice does not specify this period for its own customers. Separately, the
    update's changelog record lists `evidence` in `fields:` but `git show` of the commit that added
    this update shows no line inside the `evidence:` array was added, removed or changed (the only
    other frontmatter changes are to `sources`, `sourcing_note` and `actions`, all correctly listed)
    — the record overstates what changed.
  ground_truth: >
    Cyberattaque.org (2026-09-26): "Dans les précédents dossiers liés à Shipup documentés par
    Cyberattaque.org, des accès non autorisés avaient été possibles entre le 31 juillet et le 17
    août 2026. Carrefour ne précise toutefois pas cette période dans le message actuellement
    adressé à ses clients." (In the earlier Shipup-related files Cyberattaque.org documented,
    unauthorized access had been possible between 31 July and 17 August 2026. Carrefour does not,
    however, specify this period in the message currently sent to its clients.) French Breaches
    (2026-09-27) states the same caveat: "Carrefour n'a toutefois pas précisé si cette période
    correspond exactement à celle durant laquelle les données de ses propres clients ont pu être
    accessibles." This entry's own 2026-08-12 update reads: "the exploitation window has been open
    since at least 3 August" — not 31 July.
  ground_truth_url: "https://www.cyberattaque.org/carrefour-des-donnees-clients-exposees-apres-la-cyberattaque-de-son-prestataire/"

