- entry: entries/2026-09-06/mikrotik-routeros-mikrotrick-ssh-auth-bypass-privesc-chain.md
  verdict: factual-error
  defect: >
    The frontmatter cves[] record for CVE-2026-67278 states affected "7.0.0 before 7.23.4; 7.24
    before 7.24.2" and fixed "7.23.4 (LTS) / 7.24.2 (stable) / 7.25beta3" — this is stale against
    the entry's own cited per-CVE authority, CERT Polska's mikrotik-routeros-cve page, which
    currently documents that the original 7.23.4/7.24.2 fix for this specific CVE was incomplete
    and that a defender following the entry's guidance for this CVE remains exposed: the true fixed
    versions are 7.23.6 and 7.24.3, and the vulnerable-version ranges are now "From 7.24 below
    7.24.3" and "From 7.0.0 below 7.23.6." (The other five CVEs in this entry's frontmatter still
    correctly show 7.23.4/7.24.2/6.49.21 as their real fixed versions — only CVE-2026-67278 is
    affected by the incomplete-fix disclosure.) I could not establish exactly when CERT Polska
    added the incomplete-fix note relative to this entry's last correction (2026-09-23), so it is
    possible the disclosure post-dates that correction; either way the published entry is
    currently wrong on this one CVE's remediation. (low confidence on timing only — the version
    mismatch itself is directly confirmed against the current primary source)
  ground_truth: >
    cert.pl (fetched 2026-09-27): "The vulnerability CVE-2026-67278: ... This issue affects only
    7.x branch was fixed in versions: 7.23.6 (Long-term) and 7.24.3 (Stable)... Releases 7.23.4 and
    7.24.2 included an incomplete fix. We thank Robert Żegleń for reporting this." Per-CVE table
    for CVE-2026-67278 lists "Vulnerable versions: From 7.24 below 7.24.3 / From 7.0.0 below
    7.23.6" — not the 7.24.2/7.23.4 boundaries the entry's frontmatter still carries.
  ground_truth_url: "https://cert.pl/en/posts/2026/09/mikrotik-routeros-cve"

