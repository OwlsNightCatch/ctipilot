- entry: entries/2026-09-23/cve-2026-94127-f5-big-ip-apm-oauth-heap-overflow-rce.md
  verdict: imprecision
  defect: >
    (low confidence) The entry scopes exposure as "a virtual server configured
    with both an APM access policy and an OAuth profile" throughout frontmatter
    and body. NCSC-NL's advisory NCSC-2026-0386 was revised (v1.0.1, 2026-09-23
    13:41 CEST, a few hours after this entry published) to add: "BIG-IP
    APM-systemen zijn alleen kwetsbaar wanneer een access policy is
    geconfigureerd en het systeem dienstdoet als OAuth Authorisation Server"
    -- i.e. the OAuth profile must specifically be functioning as an OAuth
    Authorization Server, not any OAuth profile type (APM OAuth profiles can
    also be Resource Server or Client mode). None of the entry's four cited
    sources (CERT-EU, SecurityOnline, Field Effect, NCSC-NL's original text)
    carried this refinement at publication time, so this is not a fault in
    the sourcing done, but the scoping condition as currently stated is
    broader than the vendor's clarified precondition and could lead a
    defender to over-scope (or, less likely, under-scope) their audit.
  ground_truth: >
    NCSC-2026-0386 revision 1.0.1 (23-09-2026 13:41, Europe/Amsterdam):
    "F5 Networks heeft aangegeven dat systemen alleen kwetsbaar zijn wanneer
    deze als OAuth Authorisation Server zijn geconfigureerd. Dit is aan deze
    securityadvisory toegevoegd. De inschaling van deze advisory blijft
    ongewijzigd HIGH/HIGH." CVE-2026-94127 is listed with CVSS (v4) 9.3,
    confirming the entry's CVSS4.0 figure.
  ground_truth_url: "https://advisories.ncsc.nl/2026/ncsc-2026-0386.html"

