- entry: entries/2026-09-25/cve-2026-5430-wso2-jwt-algorithm-confusion-admin-bypass.md
  verdict: imprecision
  defect: >
    (low confidence) Unflagged contradiction between two of the entry's own
    cited sources on the patch date. The entry states throughout (correctly,
    per WSO2's own advisory) that WSO2 published the fix on 2026-05-03.
    SecurityWeek, also cited by this entry, states "a vulnerability tracked
    as CVE-2026-5430, which WSO2 patched in April, is being exploited in
    malicious attacks" -- a month earlier than the vendor's own advisory
    date. The entry does not surface this discrepancy (per check 9,
    surface-contradiction), though its own dating is correct and traces to
    the primary vendor source.
  ground_truth: >
    WSO2 advisory WSO2-2026-5328/CVE-2026-5430 states "Published: 2026-05-03"
    verbatim.
  ground_truth_url: "https://security.docs.wso2.com/en/latest/security-announcements/security-advisories/2026/WSO2-2026-5328/"

