items:
  - title: "Huntress: threat actor compiles a Monero cryptominer directly on the endpoint after chaining a Samsung MagicINFO write-primitive to AnyDesk install and Defender disable"
    publisher: "Huntress"
    publication_date: "2026-09-24"
    why_it_clears_the_gate: "Novel technique (on-host compilation of a cryptominer via SilentXMRMiner + MinGW64/donut/tcc toolchain rather than downloading a compiled binary) plus a full, concrete detection chain: three-attempt AnyDesk download via certutil then Invoke-WebRequest (both remediated by Defender), grandparent-process tomcat9.exe revealing MagicINFO CVE-2025-4632 as initial access, SystemSettingsAdminFlows.exe used to disable Defender, and a highly distinctive final command line (explorer.exe masquerading as the miner process, XMRig-style flags to C3Pool)."
    actors: []
    malware: ["SilentXMRMiner (open-source project)"]
    techniques_described: ["T1190 Exploit Public-Facing Application (Samsung MagicINFO CVE-2025-4632 arbitrary file write)", "T1219 Remote Access Software (AnyDesk)", "T1562.001 Disable or Modify Tools (Defender disabled via SystemSettingsAdminFlows.exe)", "T1136.001 Create Account (oldadministrator, reusing AnyDesk password)", "T1027 Obfuscated Files or Information (on-host compilation of a custom-configured miner via C compilers/donut/tcc rather than dropping a pre-built binary)", "T1496 Resource Hijacking (Monero mining to C3Pool via a process masquerading as explorer.exe)"]
    primary_source_url: "https://www.huntress.com/blog/threat-actor-compiles-cryptominer"
    discovery_trace: "first seen at: huntress (rss), URL https://www.huntress.com/blog/rss.xml -> primary: Huntress, URL https://www.huntress.com/blog/threat-actor-compiles-cryptominer (no pivot needed)"
    likely_covered: null
    one_paragraph_substance: "A Huntress-monitored endpoint was exploited via a previously-documented Samsung MagicINFO arbitrary-file-write flaw (CVE-2025-4632), which the actor used (running as the Tomcat service account underlying MagicINFO) to drop and finally succeed at installing AnyDesk after two earlier attempts were caught by Defender. The actor created a local account, disabled Defender via the built-in SystemSettingsAdminFlows.exe utility, then ran a GUI-labelled 'Silent XMR Miner Builder.exe' (based on the open-source SilentXMRMiner project) that, rather than dropping a precompiled miner, invoked .NET Framework's csc.exe/cvtres.exe plus donut, tcc and MinGW64 gcc/cc1 to compile a custom Monero miner on the endpoint itself -- generating a large volume of unusual, unsigned-parent-process compiler activity that was highly visible to EDR even though the final payload evaded a static signature. The compiled miner then ran disguised as explorer.exe and connected to the C3Pool public mining pool."

  - title: "Huntress: a signed Windows AppX host (WWAHost.exe) turns Microsoft's own OAuth login dialog into a token-theft primitive that fully survives MFA, no phishing page required"
    publisher: "Huntress"
    publication_date: "2026-09-23"
    why_it_clears_the_gate: "Genuinely novel LOLBin-class technique: sideloading a minimal AppX package that declares WindowsRuntimeAccess=\"all\" gives attacker JavaScript hosted inside the signed WWAHost.exe process full WinRT API access, including the legacy WebAuthenticationBroker OAuth handler -- so a real, unmodified login.microsoftonline.com dialog (using Office's own first-party client ID) is rendered with no address bar and no lookalike domain, and the resulting access+refresh token pair is captured by the attacker's own JavaScript via the oob redirect URI. The write-up gives an exact prerequisite (Developer Mode OR the enterprise AllowAllTrustedApps sideloading policy -- registration otherwise fails closed with error 0x80073CFF, named for both gating conditions), the exact registration command (Add-AppxPackage -Register, no admin needed once Developer Mode/the policy is set, no UAC, no SmartScreen, no signature check), and a concrete GPO-based hardening lever that closes both prerequisite paths at once."
    actors: []
    malware: []
    techniques_described: ["T1550.001 Use Alternate Authentication Material: Application Access Token", "T1528 Steal Application Access Token", "T1218 System Binary Proxy Execution (signed Microsoft binary WWAHost.exe hosting attacker JavaScript)", "T1078.004 Valid Accounts: Cloud Accounts (via stolen OAuth refresh token surviving MFA)"]
    primary_source_url: "https://www.huntress.com/blog/stealing-oauth-tokens-through-microsofts-front-door"
    discovery_trace: "first seen at: huntress (rss), URL https://www.huntress.com/blog/rss.xml -> primary: Huntress, URL https://www.huntress.com/blog/stealing-oauth-tokens-through-microsofts-front-door (no pivot needed)"
    likely_covered: null
    one_paragraph_substance: "A Huntress researcher discovered that Windows Web App Host (WWAHost.exe), a Microsoft-signed binary that renders web content for AppX packages, will grant attacker-supplied remote JavaScript full Windows Runtime API access -- including WebAuthenticationBroker, the OAuth sign-in handler -- if the package manifest's ContentUriRules declares WindowsRuntimeAccess=\"all\". Any standard user can sideload such a package via Add-AppxPackage -Register provided Developer Mode is enabled (or an enterprise sideloading policy is set), with no UAC prompt, no SmartScreen check, and no code-signing requirement once that one prerequisite toggle is set. The researcher's PoC calls WebAuthenticationBroker.authenticateAsync() using Microsoft Office's own first-party client ID and the urn:ietf:wg:oauth:2.0:oob redirect URI, which sends the resulting authorization code directly to the attacker's JavaScript instead of a browser; the user sees and completes a completely genuine login.microsoftonline.com dialog, including MFA, rendered inside the trusted signed process with no address bar or other indicator of compromise. The captured access and refresh tokens carry Office's scope set and, absent revocation, allow silent regeneration of access tokens from any location for the token's lifetime -- fully surviving the MFA the user just completed. Hardening: disable Developer Mode fleet-wide via GPO and scope any enterprise sideloading policy exception away from AllowAllTrustedApps."

  - title: "Huntress: phishing-delivered ScreenConnect/ITarian installs stack multiple redundant rogue RMM clients for persistence, including a defense-evasion binary run through the first RMM session"
    publisher: "Huntress"
    publication_date: "2026-09-23"
    why_it_clears_the_gate: "Concrete incident-level detail beyond the well-known 'RMM abuse' generality: named lure chain (TransferXL secure-document email to ZIP to PDF to rogue ITarian installer, both RMMs set to persist as SYSTEM), a second cluster using an Adobe InDesign-hosted lure page impersonating a document share that funnels to attacker C2 dropping ScreenConnect plus a named defense-evasion binary (HideUL_x64.exe) run inside the first RMM session before staging a second rogue ScreenConnect install -- giving defenders a concrete artifact/behavior chain (stacked RMM installs from an initial phishing RMM session) rather than generic advice."
    actors: []
    malware: []
    techniques_described: ["T1566.001/T1566.002 Phishing (document-share and ScreenConnect-branded lures)", "T1219 Remote Access Software (ITarian, ScreenConnect installed with SYSTEM persistence)", "T1036 Masquerading (lure impersonating a legitimate document-share/Adobe InDesign page)", "T1562 Impair Defenses (HideUL_x64.exe run via the first RMM session to conceal follow-on activity)"]
    primary_source_url: "https://www.huntress.com/blog/rogue-rmm-abuse-phishing-persistent-access"
    discovery_trace: "first seen at: huntress (rss), URL https://www.huntress.com/blog/rss.xml -> primary: Huntress, URL https://www.huntress.com/blog/rogue-rmm-abuse-phishing-persistent-access (no pivot needed)"
    likely_covered: null
    one_paragraph_substance: "Huntress SOC investigated three phishing-driven RMM-abuse incidents in one cluster of activity: a TransferXL-branded secure-document lure led an employee to a ZIP-nested PDF that installed a rogue ITarian RMM client with SYSTEM persistence, followed within the same session by a second rogue ScreenConnect install; two further incidents used ScreenConnect-branded document-share lures redirecting through an Adobe InDesign-hosted impersonation page to attacker C2 that installed a first ScreenConnect client, which the attacker then used to run the defense-evasion tool HideUL_x64.exe before staging a second, redundant rogue ScreenConnect install. In every case the pattern is the same: legitimate, signed RMM software installed and used for hands-on-keyboard access, with a second (sometimes third) RMM instance added specifically as a persistence backup in case the first is discovered and removed -- meaning full remediation requires locating every stacked RMM client, not just the first one found."
    borderline: true
    borderline_reason: "Solid incident detail but the underlying technique class (rogue RMM stacking via phishing) is already broadly known/reported industry-wide; value here is mainly the specific artifact chain (TransferXL/ITarian, HideUL_x64.exe) rather than a new technique class."

  - title: "Huntress: DarkMe/Water Hydra APT trojan drops the zero-day delivery it is famous for and reaches victims via a plain .pif-disguised-as-image phishing link, staging through an exemsi MSI wrapper and a rundll32 /sta COM-hijack loader"
    publisher: "Huntress"
    publication_date: "2026-09-22"
    why_it_clears_the_gate: "Detailed multi-stage technical breakdown of an APT-linked (EvilNum/Water Hydra, per NSFOCUS/Trend Micro/SonicWall prior attribution) malware family abandoning its trademark zero-day delivery (CVE-2023-38831 WinRAR, CVE-2024-21412 Defender SmartScreen bypass) for commodity social-engineering delivery -- illustrating a transferable defender lesson (sophisticated actors downgrading initial access when it still works) plus concrete, huntable artifacts: .pif files served from an image URL, an exemsi-wrapped MSI packaged under a decoy vendor name, a WSF staging script performing template-based registry-import COM registration, and execution via the little-known rundll32.exe /sta {CLSID} invocation path (IShellRunDll::Run) that sidesteps detections keyed on the standard rundll32 <dll>,<export> syntax."
    actors: ["Water Hydra / EvilNum (per NSFOCUS/Trend Micro/SonicWall prior attribution, cited by Huntress)"]
    malware: ["DarkMe RAT"]
    techniques_described: ["T1566.002 Phishing: Spearphishing Link (URL serving a .pif disguised as a .png)", "T1204.002 User Execution: Malicious File", "T1027.007 Obfuscated Files: Dynamic API Resolution / masquerading (renamed .pif executes as a program despite .pif's legacy DOS association; forged file-description metadata claiming to be a security product)", "T1218.007 System Binary Proxy Execution: Msiexec (fetches remote .msi with /quiet /norestart)", "T1218.011 System Binary Proxy Execution: Rundll32 (rundll32.exe /sta {CLSID} invoking IShellRunDll::Run rather than the standard <dll>,<export> syntax)", "T1112 Modify Registry (COM object registration via a generated .reg import to point a CLSID's InprocServer32 at the dropped Coconout.dll)"]
    primary_source_url: "https://www.huntress.com/blog/darkme-rat-abandons-exploits"
    discovery_trace: "first seen at: huntress (rss), URL https://www.huntress.com/blog/rss.xml -> primary: Huntress, URL https://www.huntress.com/blog/darkme-rat-abandons-exploits (no pivot needed)"
    likely_covered: null
    one_paragraph_substance: "Huntress found two identical DarkMe RAT infections that abandoned the zero-day exploitation (WinRAR CVE-2023-38831, then Defender SmartScreen bypass CVE-2024-21412) that made the malware family notable in 2023-2024 in favor of plain social-engineering delivery: a phishing email linked to a URL that appeared to serve image.png but actually delivered image.pif, a DOS-era executable format Windows still runs directly regardless of extension or icon. The .pif invokes msiexec to fetch a remote MSI (built with the exemsi MSI Wrapper under the decoy name 'PrinterFind Softwares') that expands a Cabinet archive and runs a WSF staging script; the script copies a hollowing target (a signed-looking binary named clspack.exe) into %AppData%\\Microsoft\\, writes a Registry-import template that registers a COM object pointing at the dropped Coconout.dll, and hands off execution via rundll32.exe /sta {CLSID} -- a single-threaded-apartment COM invocation path (IShellRunDll::Run) distinct from and less commonly monitored than the standard rundll32 <dll>,<export> syntax, and a good, narrow detection/hunt signature on its own."

  - title: "Huntress: INC ransomware timeline reconstruction shows a 17-day dormancy gap between initial-access-broker handoff and ransomware-affiliate deployment, plus dual extortion notes and a BYOVD EDR-killer staged via Impacket atexec.py"
    publisher: "Huntress"
    publication_date: "2026-09-21"
    why_it_clears_the_gate: "Post-incident forensic reconstruction (limited endpoint telemetry) that still yields concrete, transferable hunt signatures: randomly-named scheduled tasks pointing to a PowerShell implant, a renamed/relocated legitimate vulnerability-scanning tool (Vicarius vRx renamed to HealthUpdater.exe under 7-Zip's install path) used as a persistence vehicle, a BYOVD driver (hwau.exe loading service HwAudio/HWAuidoOs2Ec.sys) staged in C:\\Users\\Public, and Impacket's atexec.py used to fan out the EDR-killer driver and ransomware launch across multiple hosts via temporary scheduled tasks. The dual-ransom-note behavior (a standard note plus a second, more detailed 'press release'-style note naming exfiltrated file categories, dropped 53 minutes later) is a distinct, documented INC affiliate escalation-pressure pattern."
    actors: []
    malware: ["INC ransomware"]
    techniques_described: ["T1053.005 Scheduled Task/Job (randomly-named tasks for persistence and remote execution fan-out)", "T1021.001 Remote Desktop Protocol (lateral movement via compromised account)", "T1219 Remote Access Software (AnyDesk)", "T1036.005 Masquerading: Match Legitimate Name or Location (Vicarius vRx renamed HealthUpdater.exe, staged under 7-Zip's path)", "T1068/BYOVD Exploitation for Privilege Escalation / Bring Your Own Vulnerable Driver (hwau.exe loading kernel driver HwAudio to disable security tooling)", "T1569.002 System Services: Service Execution combined with Impacket atexec.py for remote command execution across multiple hosts", "T1486 Data Encrypted for Impact combined with dual-note extortion pressure escalation"]
