- entry: entries/2026-09-19/cisa-kev-linux-kernel-ktls-af-alg-ebtables-snat.md
  verdict: factual-error
  defect: >
    The correction under review holds: The Hacker News (fetched fresh) confirms verbatim "Red Hat has
    updated the advisories for all the flaws as of September 19, 2026, at 2 a.m. UTC to acknowledge
    active exploitation... 'This CVE is high risk and there are known public exploits leveraging this
    vulnerability,' Red Hat said. 'Address this vulnerability with high priority.'" — exactly what the
    correction's `## Correction` section now states, correctly cited to The Hacker News rather than to
    Red Hat's own page (which does not carry that sentence verbatim). BUT a fresh whole-entry check
    found an untouched, pre-existing factual error the correction did not address: the frontmatter
    `cves[0].cvss` for CVE-2025-39682 reads "9.8 (kernel CNA, AV:N) / 7.1 (NVD re-score, AV:L)". Red
    Hat's own CVE page shows Red Hat's own re-score is Base Score 7 (not 7.1) with vector
    CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:L/I:L/A:H — i.e. it is RED HAT, not NVD, that rescored the
    flaw, and even Red Hat's rescored vector is AV:N (network), not AV:L (local). NVD's own score,
    per the same page, is 9.8 with AV:N — identical to the "kernel CNA" (cve.org) score of 9.8, also
    AV:N. No column in Red Hat's CVSS breakdown table shows AV:L for this CVE. The frontmatter
    therefore misattributes the rescoring party, misstates the rescored value, and asserts a local
    attack vector no authoritative source gives this CVE — directly contradicting the entry's own body
    text, which correctly describes the flaw as "reachable only on hosts that terminate TLS... using
    CONFIG_TLS receive offload" (i.e. network-reachable, consistent with AV:N, not AV:L).
  ground_truth: >
    Red Hat CVSS v3 Score Breakdown for CVE-2025-39682: Red Hat Base Score 7, vector
    CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:L/I:L/A:H; NVD Base Score 9.8, vector
    CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H; cve.org Base Score 9.8, same vector as NVD. All
    three assessors rate Attack Vector "Network." (CVE-2025-39964 and CVE-2026-53266's frontmatter
    CVSS annotations were separately checked and are accurate against the same Red Hat page.)
  ground_truth_url: "https://access.redhat.com/security/cve/cve-2025-39682 ; https://thehackernews.com/2026/09/cisa-flags-three-linux-kernel.html"
  fix_held: true
