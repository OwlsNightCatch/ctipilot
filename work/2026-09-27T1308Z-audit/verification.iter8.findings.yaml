  item: "2026-09-10/bluemoon-exploit-kit-four-state-actors-chrome-windows-chain — Update, 2026-09-27T13:28:04Z"
  url_or_quote: "The typosquat pages load most of their content from the legitimate site they copy, and add the exploit components in a hidden, zero-sized iframe, so the page a victim sees is the real organization's content."
