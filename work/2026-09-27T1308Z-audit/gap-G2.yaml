items:
  - title: "Dyfed-Powys Police (Wales) confirms cyberattack; investigating whether own staff data was accessed, no attacker named"
    event_date: "2026-09-25"
    why_it_clears_the_gate: >
      Direct sector nexus to the constituency (a UK territorial police force — same
      class of organization as Swiss national/cantonal police). Victim-confirmed via
      the force's own public statement; transferable lesson for any police IT estate
      about non-emergency-system compromise, staff-data exposure risk and downstream
      phishing risk to officers.
    corroboration_state: "victim-confirmed (force's own public statement, reported by The Register and Cybernews); no attacker/method named; no group has claimed responsibility as of 2026-09-25"
    primary_source_url: "https://www.theregister.com/cyber-crime/2026/09/25/dyfed-powys-police-cops-to-cyberattack-staff-data-potentially-nicked/5299112"
    corroborating_source_url: "https://cybernews.com/security/police-staff-data-feared-stolen-welsh-cyber-raid/"
    discovery_trace: "first seen at: WebSearch (\"Dyfed-Powys Police data breach cyber incident 2026\") → primary: The Register, URL https://www.theregister.com/cyber-crime/2026/09/25/dyfed-powys-police-cops-to-cyberattack-staff-data-potentially-nicked/5299112 → corroborating: Cybernews, URL https://cybernews.com/security/police-staff-data-feared-stolen-welsh-cyber-raid/ (force's own statement page at https://www.dyfed-powys.police.uk/news/dyfed-powys/news/2026/september-2026/statement/ was attempted directly but 403'd on every transport — direct GET, trafilatura, and jina reader all blocked)"
    likely_covered: null
    one_paragraph_substance: >
      Dyfed-Powys Police, which serves 500,000+ people across rural Wales, detected a
      cyberattack on 2026-09-14 and publicly confirmed it on 2026-09-25 (an 11-day gap).
      Non-emergency systems were disrupted — email and online public-contact channels
      were unavailable and have since been restored — while 999/101 emergency telephony
      remained unaffected throughout. The force states it has found no evidence that
      members-of-the-public data was accessed, but is still investigating whether staff
      (officer/employee) data was exposed. The regional cybercrime unit Tarian is
      running the investigation with outside specialist support; the ICO has been
      notified. No intrusion vector, ransomware family, or extortion-group claim has
      been named publicly, distinguishing this from the unrelated July 2026 ExfilSquad
      breach of the UK Police National Legal Database that both outlets cite only as
      background context.
    borderline: false

  - title: "DIVD (Dutch Institute for Vulnerability Disclosure) discloses it was breached by what it assesses as an agentic-AI-powered attack"
    event_date: "2026-09-24"
    why_it_clears_the_gate: >
      Materially evolved/novel TTP transferable to any defender: a security-community
      organization's own self-disclosure, in near-real-time, that its compromise
      pattern is consistent with autonomous AI-agent tradecraft rather than known
      human-operator playbooks — directly relevant to how Tier 2/3 responders should
      reason about emerging agentic-AI intrusion signatures. DIVD's transparency-first
      posture (naming itself, publishing before root cause is known) is itself a
      notable incident-response model.
    corroboration_state: "victim-confirmed (DIVD's own CSIRT blog post); DataBreaches.Net corroborates by relaying DIVD's own statement — single primary source, DIVD as the affected/disclosing party"
    primary_source_url: "https://csirt.divd.nl/2026/09/24/when-not-if/"
    corroborating_source_url: "https://databreaches.net/2026/09/25/divd-dutch-institute-for-vulnerability-disclosure-investigating-agentic-ai-powered-attack/"
    discovery_trace: "first seen at: WebSearch (\"DIVD breach hacked own systems 2026\") → primary: DIVD CSIRT, URL https://csirt.divd.nl/2026/09/24/when-not-if/ (fetched via trafilatura-direct)"
    likely_covered: null
    one_paragraph_substance: >
      DIVD (Dutch Institute for Vulnerability Disclosure), a nearly-seven-year-old
      volunteer vulnerability-disclosure nonprofit, disclosed on 2026-09-24 that it
      detected suspicious activity in its own infrastructure and, after investigation,
      concluded it had been breached. DIVD states the modus operandi is unlike anything
      it has seen before and "indicates that this is an agentic AI powered attack" —
      no further technical detail (initial access, tooling, or attacker identity) has
      been published; DIVD explicitly says it "can't rule anything out yet" and is
      treating the incident as a worst-case assume-breach scenario pending forensics.
      It has isolated its infrastructure, engaged a third-party IR firm, and notified
      the Dutch data-protection authority (Autoriteit Persoonsgegevens), the Dutch
      NCSC, and police. DIVD's next public update was scheduled for 2026-09-28 —
      one day after this run's window closes — so the technical substance (what
      "agentic AI powered" specifically means in observed telemetry) is not yet public.
    borderline: true
    borderline_reason: "DIVD is a vulnerability-disclosure nonprofit, not a government body or Swiss/EU public-sector supplier; relevance rests on transferable-TTP grounds (an as-yet-technically-thin claim of agentic-AI attack tradecraft) rather than constituency nexus. Technical detail is minimal pending DIVD's 2026-09-28 update."

  - title: "Maileva (Docaposte / La Poste Group subsidiary) shuts down its bulk-mail platform after unauthorized access attempts aimed at sending fraudulent mail"
    event_date: "2026-09-23"
    why_it_clears_the_gate: >
      Maileva is a brand of Docaposte, the digital-services arm of La Poste Group
      (French state-owned postal/public-service group that also runs identity and
      administrative digital-trust services for French public administrations) —
      direct EU public-sector-adjacent supplier nexus, and a transferable lesson
      about account-takeover-driven abuse of a bulk-communications platform to send
      fraudulent mail at scale.
    corroboration_state: "victim-confirmed (Maileva's own customer notification, quoted verbatim by FrenchBreaches); corroborated by a French legal-practice analysis (kohenavocats.fr) advising affected client organizations, and by cyberattaque.org's independent tracker"
    primary_source_url: "https://frenchbreaches.com/alertes/maileva-mufora09gh9so92vdk"
    corroborating_source_url: "https://kohenavocats.fr/2026/09/27/maileva-interruption-envois-entreprises-decisions-2026/"
    discovery_trace: "first seen at: WebSearch (\"Maileva Docaposte panne cyberattaque\") → primary: FrenchBreaches (quoting Maileva's own customer notice verbatim), URL https://frenchbreaches.com/alertes/maileva-mufora09gh9so92vdk → corroborating: Kohen Avocats legal analysis, URL https://kohenavocats.fr/2026/09/27/maileva-interruption-envois-entreprises-decisions-2026/ ; also seen at cyberattaque.org, URL https://www.cyberattaque.org/maileva-filiale-de-la-poste-victime-dune-cyberattaque/ ; note: a same-titled Anadolu Agency (aa.com.tr) article surfaced in search but is dated 2026-01-02 and describes an unrelated December/January DDoS attack on La Poste/La Banque Postale by NoName057(16) — checked and discarded as stale/unrelated, not the Maileva incident"
    likely_covered: null
    one_paragraph_substance: >
      Maileva, the French La Poste Group's platform for enterprises to send
      dematerialized mail and manage document distribution, detected unauthorized
      access attempts to customer accounts beginning around 2026-09-23 07:00, aimed
      at using the platform to send fraudulent/illegitimate mail. Maileva blocked the
      affected accounts, then preventively shut the whole service down; it filed a
      criminal complaint and, per its own customer notice, has so far found no
      exfiltration of personal data and no fraudulent mail actually dispatched via the
      web client or API for the customers it notified — though it has not yet stated
      how many accounts were targeted, the access method, or a restoration timeline.
      The service remained down as of 2026-09-27, four days into the outage, per the
      most recent legal-advisory tracking the impact on Maileva's enterprise customers.
    borderline: false

  - title: "Boston Scientific's CrowdStrike-led forensic investigation names the initial-access vector for its August cybersecurity incident: an external-facing network device"
    event_date: "2026-09-22"
    why_it_clears_the_gate: >
      Resolves an open watch item: Boston Scientific is a global medical-device
      manufacturer supplying hospitals (including Swiss/EU public hospitals) — the
      first named attacker-behaviour detail (compromise of an external-facing network
      device as the initial foothold, followed by lateral movement into a limited
      portion of the on-prem IT environment) is new, actionable substance that was
      previously entirely withheld.
    corroboration_state: "victim-confirmed (Boston Scientific's own incident-update page, publishing CrowdStrike's investigation-summary report)"
    primary_source_url: "https://news.bostonscientific.com/update-on-recent-cybersecurity-incident"
    corroborating_source_url: "https://news.bostonscientific.com/download/Crowdstrike+Investigation+Summary+%289.22.2026%29.pdf"
    discovery_trace: "first seen at: WebSearch (\"Boston Scientific data breach incident page attacker\") → primary: Boston Scientific incident-update page, URL https://news.bostonscientific.com/update-on-recent-cybersecurity-incident (fetched via trafilatura-direct, dated 2026-09-22)"
    likely_covered: null
    one_paragraph_substance: >
      Boston Scientific published a 2026-09-22 update carrying CrowdStrike's final
      investigation summary for the cybersecurity incident it identified on
      2026-08-25 (order-processing/shipping disruption previously reported with no
      named attacker behaviour). CrowdStrike's independent investigation determined
      the threat actor first gained access via "an external-facing network device"
      and then reached "a limited portion" of Boston Scientific's on-premises IT
      environment. CrowdStrike found no evidence of ongoing threat-actor activity
      after containment, no compromise of Microsoft 365/other cloud apps, and — most
      materially for a medical-device manufacturer — no evidence of access to
      manufacturing-maintenance, product/software-development, device-maintenance,
      HR/benefits systems, or SCADA environments, and no evidence any customer or
      patient data was accessed, staged, or exfiltrated. No attacker identity,
      ransomware family, or exploited CVE is named.
    borderline: false

