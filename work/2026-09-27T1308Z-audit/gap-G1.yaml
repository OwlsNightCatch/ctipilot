items:
  - title: "Oracle's September 2026 CSPU entry covers only 6 of dozens of unauthenticated CVSS 9.1-9.8 flaws in the SAME release — E-Business Suite, Analytics, Enterprise Manager and Communications are undocumented"
    event_date: "2026-09-15"
    why_it_clears_the_gate: "tradecraft-depth + constituency-nexus — this is a completeness gap on an EXISTING entry, not a new disclosure. The store's 2026-09-20/oracle-september-2026-cspu-five-unauthenticated-cvss-10 entry scopes itself to '153 patches for Fusion Middleware' and names only 6 CVSS-10.0 Fusion Middleware CVEs, but Oracle's own CSPU page (fetched in full this run) documents the SAME 2026-09-15 release containing: Oracle E-Business Suite (159 patches, 19 unauth-remote, incl. CVE-2026-83327/CVE-2026-83452/CVE-2026-83462 all CVSS 9.8 unauthenticated network RCE on 12.2.3-12.2.15 — EBS is the product family Cl0p mass-exploited via CVE-2025-61882 in the 2025 campaign, a precedent this store already tracks); Oracle Analytics (50 patches, 8 unauth-remote, incl. CVE-2026-83283 CVSS 9.8 unauthenticated BI EE Platform Security); Oracle Enterprise Manager (7 patches, 5 unauth-remote, incl. CVE-2026-41635 CVSS 9.8 Apache Mina and CVE-2026-83355 CVSS 9.8 Metrics); Oracle Communications (31 patches, 23 unauth-remote, incl. CVE-2026-44024 CVSS 9.8 Fluentd and CVE-2026-17544 CVSS 9.8 PHP, both in Unified Assurance). None of these CVEs appear in the existing entry's cves[] list or body. No exploitation reported for any of them as of this run."
    cves: [CVE-2026-83327, CVE-2026-83452, CVE-2026-83462, CVE-2026-83283, CVE-2026-41635, CVE-2026-83355, CVE-2026-44024, CVE-2026-17544]
    affected_products: ["Oracle E-Business Suite", "Oracle Business Intelligence Enterprise Edition", "Oracle Enterprise Manager Base Platform", "Oracle Enterprise Manager for Fusion Middleware", "Oracle Communications Unified Assurance"]
    primary_source_url: "https://www.oracle.com/security-alerts/cspusep2026.html"
    corroborating_source_url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0376"
    discovery_trace: "started from advisories-ncsc-nl RSS feed (https://advisories.ncsc.nl/rss/advisories) sweep of Sept 16-24 items -> noticed NCSC-2026-0376 (Oracle E-Business Suite), NCSC-2026-0379 (Oracle Analytics), NCSC-2026-0377 (Oracle Enterprise Manager), NCSC-2026-0375 (Oracle Communications), all published 2026-09-16, all part of the same CSPU Oracle published 2026-09-15 -> cross-checked against the store's existing 2026-09-20 Oracle CSPU entry (which only names Fusion Middleware CVEs) -> fetched https://www.oracle.com/security-alerts/cspusep2026.html in full via extract to confirm the additional product families and exact CVE/CVSS/version data"
    likely_covered: "2026-09-20/oracle-september-2026-cspu-five-unauthenticated-cvss-10 (PARTIALLY — same release, but this entry's cves[]/body do not mention any of the CVEs above; recommend a broadening changelog record rather than a new entry, since CVEs trace to the identically-dated, identically-sourced Oracle CSPU the existing entry already covers in part)"
    one_paragraph_substance: >
      Oracle's single September 2026 Critical Security Patch Update (published 2026-09-15, 673 patches total)
      is only 6-CVE deep in the store despite carrying at least 8 further unauthenticated, network-exploitable
      CVSS 9.1-9.8 flaws across four more product families it also patched the same day. Oracle E-Business
      Suite alone picked up 3 unauthenticated CVSS 9.8 RCEs (Applications Framework/Personalization over SOAP,
      Document Management and Collaboration over HTTP, and the Mobile Application Server's MWA Terminal Server
      over raw TCP), all on the still-widely-deployed 12.2.3-12.2.15 line — the same product family Cl0p used
      for a mass zero-day campaign in 2025. Oracle Analytics, Enterprise Manager and Communications each carry
      further CVSS 9.1-9.8 unauthenticated network flaws in components (BI Platform Security, the Enterprise
      Manager Agent's embedded Apache Mina, and Communications Unified Assurance's Fluentd/PHP stack) that a
      reader of the existing entry would have no reason to think needed checking, because the entry's own
      framing implies the disclosure was Fusion-Middleware-only.

  - title: "IBM's September 2026 Security Bulletins for IBM MQ (CVSS 10.0 pre-auth heap overflow, CVE-2026-10747) and Langflow OSS (three CVSS 9.8 unauthenticated RCEs) went unremarked in the store despite NCSC-NL relaying both on 2026-09-23"
    event_date: "2026-09-23"
    why_it_clears_the_gate: "out-of-band-urgency + constituency-nexus — CVE-2026-10747 is a CVSS 10.0 pre-authentication heap-based buffer overflow in IBM MQ's protocol message processing (before authentication, network-reachable), affecting IBM MQ 9.1.0.0-9.1.0.37, 9.2.0.0-9.2.0.43, 9.3.0.0-9.3.0.41/9.3.5.1, 9.4.0.0-9.4.0.25/9.4.5.1 and 10.0.0.0 (fixed in 9.2.0.44/9.3.0.42/9.4.0.26 respectively). IBM MQ is enterprise message-queueing middleware widely deployed for financial, healthcare and government transaction integration. The same NCSC-NL advisory bundles three unauthenticated CVSS 9.8 RCEs in Langflow OSS (CVE-2026-79724 OS command injection; CVE-2026-81204 code injection during graph construction; CVE-2026-85025 auth bypass via publicly shared MCP project endpoints), all fixed in Langflow OSS 1.11.6 — Langflow is the SAME product this store has already tracked for TWO PRIOR rounds of mass exploitation (CVE-2026-0768, CVE-2026-0770), making a fresh batch of unauthenticated RCEs in it directly relevant to the constituency's existing exposure."
    cves: [CVE-2026-10747, CVE-2026-79724, CVE-2026-81204, CVE-2026-85025]
    affected_products: ["IBM MQ", "IBM MQ Appliance", "Langflow OSS"]
    primary_source_url: "https://www.ibm.com/support/pages/security-bulletin-ibm-mq-vulnerable-unauthenticated-remote-code-execution-cve-2026-10747"
    corroborating_source_url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0392"
    discovery_trace: "advisories-ncsc-nl RSS feed (https://advisories.ncsc.nl/rss/advisories) -> NCSC-2026-0392 'Kwetsbaarheden verholpen in IBM Langflow OSS en IBM MQ Appliance' published 2026-09-23 -> pulled the advisory's own CSAF record (python3 tools/fetch_source.py ncsc-nl csaf NCSC-2026-0392) for the exact IBM reference URLs -> fetched both IBM Security Bulletins directly (node/7284543 for MQ, node/7286666 for Langflow) for full CVE/CVSS/version detail; WebSearch cross-check found no independent exploitation reporting for either CVE set as of this run"
    likely_covered: null
    one_paragraph_substance: >
      IBM shipped two September 2026 Security Bulletins that NCSC-NL bundled into a single advisory on 2026-09-23:
      a CVSS 10.0 heap-based buffer overflow in IBM MQ's protocol message processing that a remote, unauthenticated
      attacker with network access to the listener port can trigger before any authentication step, and a set
      of Langflow OSS flaws including three unauthenticated CVSS 9.8 remote-code-execution paths — an OS command
      injection, a code-injection-during-graph-construction bug, and an authorization flaw in publicly shared
      MCP project endpoints that lets an unauthenticated attacker execute code and tamper with chat sessions.
      IBM's own bulletins (dated 2026-09-14 and 2026-09-08 respectively, both several days before NCSC-NL relayed
      them in-window) report no known exploitation for any of these CVEs, but Langflow's history in this store
      is one of rapid mass-scanning follow-on to disclosure, and IBM MQ's installed base in financial and
      government transaction-processing environments makes a pre-auth CVSS 10.0 heap overflow in it a
      patch-now item independent of confirmed exploitation.

  - title: "Adobe's September 2026 patch cycle: Campaign Classic ships 18 critical CVEs (8 unauthenticated CVSS 10.0), alongside Adobe Connect (9 CVEs, up to CVSS 9.9) and AEM Forms JEE (6 CVEs, CVSS up to 9.8) — none reported exploited, none in the store"
    event_date: "2026-09-22"
    why_it_clears_the_gate: "out-of-band-urgency — eight distinct CVEs in a single on-premises enterprise marketing-automation product (Adobe Campaign Classic ACC v7 up to 7.4.4 build 9401) score a flat CVSS 3.1 10.0 (AV:N/AC:L/PR:N/UI:N) via OS command injection, code injection and incorrect authorization, all fixed only in build 9402 for fully on-premise and hybrid deployments (Adobe-hosted instances were already remediated). Adobe states no exploitation is known for any of the three bulletins. This is a legitimate, undocumented mass-CVE disclosure in software plausibly run by public-sector marketing/communications teams (Campaign Classic) and document-workflow/forms platforms (AEM Forms JEE, Connect webinar/meeting software) that the constituency's Adobe-patching process would otherwise have to catch on its own."
    cves: [CVE-2026-82004, CVE-2026-73369, CVE-2026-84412, CVE-2026-89275, CVE-2026-75723, CVE-2026-75699, CVE-2026-75703, CVE-2026-75721, CVE-2026-75745]
    affected_products: ["Adobe Campaign Classic", "Adobe Experience Manager Forms JEE", "Adobe Connect", "Adobe Connect Android Mobile App"]
    primary_source_url: "https://helpx.adobe.com/security/products/campaign/apsb26-142.html"
    corroborating_source_url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0393"
    discovery_trace: "advisories-ncsc-nl RSS feed -> NCSC-2026-0393 (Campaign Classic), NCSC-2026-0391 (Connect), NCSC-2026-0390 (AEM Forms JEE), all published 2026-09-23/24 -> fetched Adobe's own APSB26-142 bulletin in full via extract for the Campaign Classic CVE table; fetched APSB26-150 (Connect, 2026-09-22) and the AEM Forms product index (2026-09-22 entry) directly; WebSearch corroborated APSB26-142's Sept-24 publication and confirmed 'Adobe is not aware of any exploits in the wild' language on all three"
    likely_covered: null
    one_paragraph_substance: >
      Adobe's Campaign Classic bulletin APSB26-142 (initially dated September 8, revised and republished with
      17 additional CVEs on September 22-24 2026) fixes eight separate CVSS 10.0 flaws reachable without
      authentication or user interaction — seven code/OS-command-injection bugs yielding arbitrary code
      execution and one yielding application denial-of-service — plus nine further critical-rated flaws
      (SSRF, SQL injection, improper input validation) scoring 9.1-9.9, all in ACC v7 builds up to 7.4.4
      build 9401 on Windows and Linux; the fix is build 9402, and Adobe-hosted instances needed no customer
      action. The same week Adobe shipped APSB26-150 for Adobe Connect (9 CVEs across SQLi, XSS, path
      traversal and certificate-validation flaws, up to CVSS 9.9, fixed in Connect 12.12 / Android app 4.5)
      and a further AEM Forms JEE bulletin (6 CVEs up to CVSS 9.8 in code/SSRF/XSS/CSRF classes). None of
      the three bulletins report known exploitation.

  - title: "hMailServer CVE-2026-100741 — unauthenticated JScript eval-injection RCE disclosed today (2026-09-27), but non-default config, no exploitation, single-source"
    event_date: "2026-09-27"
    why_it_clears_the_gate: "borderline / tradecraft-depth only — flagging as borderline rather than a clean gap. A remote unauthenticated attacker who logs in with a crafted password (backslash + apostrophe) against an existing account can inject JScript into hMailServer's event-script dispatcher (CWE-95), reaching WScript.Shell command execution as the service account — CVSS 9.8. But exploitation REQUIRES three non-default settings simultaneously (event scripting on, script language set to JScript rather than the VBScript default, and an OnClientValidatePassword/OnExternalAccountDownload/OnDeliveryFailed handler actually defined), EPSS is 0.0, no exploitation is reported, and the only sources are the GitHub Security Advisory / GitLab commit (single-source, no independent journalism or CERT relay found)."
    cves: [CVE-2026-100741]
    affected_products: ["hMailServer"]
    primary_source_url: "https://github.com/advisories/GHSA-v6j4-p35g-mq6p"
    corroborating_source_url: "https://gitlab.com/Progressiverobot/hmailserver/-/releases/v6.3.4"
    discovery_trace: "enisa-euvd bridge (python3 tools/fetch_source.py enisa-euvd recent criticals) -> EUVD-2026-87904 / CVE-2026-100741, datePublished 2026-09-27 -> pivoted to the GitHub Security Advisory GHSA-v6j4-p35g-mq6p for the full technical description -> WebSearch found only aggregator/vuln-database mirrors, no independent corroboration or CERT relay"
    likely_covered: null
    borderline: true
    borderline_reason: "unauthenticated pre-auth RCE at CVSS 9.8 in a mail server, but non-default configuration required for every reachable path, EPSS 0.0, no known exploitation, and single-source (GitHub/GitLab only) — the org's Roundcube-class webmail exposure is already tracked, but hMailServer's footprint in Swiss public-sector deployments is unconfirmed and likely small (legacy Windows-only product)."

  - title: "Rapid7 + Zimbra teaser names 50+ new Zimbra Collaboration Suite vulnerabilities enabling credential-less mailbox/calendar manipulation for BEC — no CVE, no patch, first of a promised series"
    event_date: "2026-09-23"
    why_it_clears_the_gate: "borderline / constituency-nexus — Zimbra has three consecutive years of CISA KEV entries this same post itself cites (CVE-2024-45519, CVE-2025-27915, CVE-2026-73570, the last already CISA-KEV as of 2026-08-21), and Zimbra Collaboration Suite is a mail-and-calendar platform plausibly run by public-sector bodies as a lower-cost alternative to commercial email. This post previews 'over 50 vulnerabilities' allowing unauthenticated sender impersonation, inbox-visibility control and calendar/document tampering (a technique the authors call 'calendar warfare' / 'manufactured enterprise reality'), explicitly as the FIRST of a promised technical series — but names no CVE, no affected version, no vendor advisory and no fix. Not actionable yet; flagging as a heads-up so a follow-up technical post is not missed."
    cves: []
    affected_products: ["Zimbra Collaboration Suite"]
    primary_source_url: "https://www.rapid7.com/blog/post/ve-business-email-compromise-rewriting-reality-zimbra-cve/"
    corroborating_source_url: null
    discovery_trace: "rapid7-research RSS feed (https://www.rapid7.com/rss.xml) sweep -> 'When Business Email Compromise Starts Rewriting Reality' published 2026-09-23, fetched in full via extract"
    likely_covered: null
    borderline: true
    borderline_reason: "no CVE, no affected version, no vendor advisory yet — teaser post announcing a forthcoming technical series; genuinely not actionable today but Zimbra's KEV history makes the forthcoming disclosure worth a follow-up watch item."

