  - title: "Jamf Threat Labs: \"PamStealer\" macOS infostealer impersonates the Maccy clipboard manager and validates stolen passwords via the PAM API before exfiltrating them"
    sources:
      - { url: "https://www.jamf.com/blog/pamstealer-macos-infostealer-applescript-rust/", publisher: "Jamf Threat Labs", date: "2026-07-02", role: "primary" }
      - { url: "https://thehackernews.com/2026/07/pamstealer-uses-fake-maccy-sites-and.html", publisher: "The Hacker News", date: "2026-07-03", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"new malware analysis blog post \\\"July 3, 2026\\\" OR \\\"July 4, 2026\\\"\") → pivot: The Hacker News, URL https://thehackernews.com/2026/07/pamstealer-uses-fake-maccy-sites-and.html → primary: Jamf Threat Labs, URL https://www.jamf.com/blog/pamstealer-macos-infostealer-applescml-rust/"
    summary: |
      Jamf Threat Labs documented PamStealer, a two-stage macOS infostealer distributed from the typosquat
      maccyapp[.]com impersonating the legitimate Maccy clipboard-manager app (maccy.app). Stage one is a
      compiled AppleScript (.scpt) delivered on a disk image that uses JavaScript for Automation (JXA) rather
      than shell commands (curl/zsh) to download and stage the payload via native NSURLSession APIs, first
      performing host fingerprinting (CPU architecture, locale, keyboard layout, timezone) and excluding
      Russian/Belarusian/Kazakh locales. Stage two is an arm64 Rust-based Mach-O binary masquerading as
      Finder.app under ~/Library/Application Support/com.apple.finder.core/. The distinguishing behavior that
      names the family: PamStealer validates the victim's typed login password through the macOS Pluggable
      Authentication Modules API (pam_start, pam_authenticate, pam_end) before harvesting it, re-prompting the
      victim if validation fails so only a confirmed-correct password is exfiltrated. It runtime-loads
      Security.framework to pull browser-stored credentials and Keychain data, reads clipboard contents via
      pbpaste, and establishes persistence through both the modern ServiceManagement API and legacy shared-file-
      list APIs. Exfiltration is over HTTPS to avenger-sync[.]live/api/sync with ChaCha20-Poly1305-encrypted
      payloads; the malware also social-engineers the user into granting Full Disk Access and queries Ethereum
      JSON-RPC endpoints from server-supplied configuration.
    region_nexus: "global; typosquat/malvertising delivery applies equally to EU/CH macOS endpoints"
    primary_sector_nexus: "indirect"
    sector: "cross-sector"
    cves: []
    entity_keys: []
    new_entities:
      - { key: "tool:pamstealer", type: tool, name: "PamStealer",
          aliases: [],
          summary: "Two-stage macOS infostealer impersonating the Maccy clipboard manager; validates harvested login passwords via the PAM API before exfiltration (Jamf Threat Labs, 2026-07-02)." }
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "Rather than relying on shell commands such as curl or zsh, the AppleScript executes a self-contained JavaScript for Automation (JXA) downloader that retrieves and stages the payload using native Objective-C APIs."
        attribution: "Jamf Threat Labs"
        source_url: "https://www.jamf.com/blog/pamstealer-macos-infostealer-applescript-rust/"
      - quote: "The result is a quieter routine that keeps only a verified password, and one fewer process chain for defenders to detect on."
        attribution: "Jamf Threat Labs"
        source_url: "https://www.jamf.com/blog/pamstealer-macos-infostealer-applescript-rust/"
      - quote: "Because the cache writes this exchange to disk, it gives responders a reliable place to confirm both the contact and the channel after the fact, even though the contents are encrypted."
        attribution: "Jamf Threat Labs"
        source_url: "https://www.jamf.com/blog/pamstealer-macos-infostealer-applescript-rust/"
    extended_notes: |
      ATT&CK mapping: T1204.002 user execution of malicious file (fake Maccy DMG/scpt); T1036.005 masquerading
      as a legitimate app name/location (Finder.app path); T1059.007 JavaScript/JXA execution; T1497.001
      virtualization/sandbox evasion via locale/host fingerprinting; T1555.001 Keychain credential access;
      T1555.003 credentials from web browsers; T1115 clipboard data collection; T1547 persistence via
      ServiceManagement/LaunchAgent registration; T1071.001 web-protocol C2 with T1573 encrypted channel
      (ChaCha20-Poly1305). Detection concept: Unified Log entries showing pam_authenticate invoked by a process
      other than loginwindow/sudo/su; new LaunchAgent/ServiceManagement registrations by unsigned or ad-hoc-
      signed binaries shortly after a disk-image mount from Downloads; EDR rule for osascript/compiled .scpt
      execution chained to a subsequent unsigned Mach-O writing to
      ~/Library/Application Support/com.apple.finder.core/. Hardening: Gatekeeper/notarization enforcement to
      block unsigned/ad-hoc apps from launching; MDM policy restricting Full Disk Access grants and alerting on
      new TCC.db entries for unrecognized bundle IDs; block AppleScript execution from quarantined/mounted disk
      images via a Content Filter or EDR script-control policy.
      RECENCY CAVEAT: same caveat as the Avalon item above — Jamf's own post is dated 2026-07-02, outside this
      run's strict 8h window but within the 72h developing-story allowance, and not found in prior_coverage.json
      for the last 7 days. Flagging borderline for the main agent's recency call.
