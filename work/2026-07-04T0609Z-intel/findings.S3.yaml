items:
  - title: "Blackpoint Cyber: \"Avalon\" AI-assisted malware framework bundles credential theft, lateral movement and the CrownX ransomware component behind an MSBuild/ETW-patching loader chain"
    sources:
      - { url: "https://blackpointcyber.com/blog/avalons-path-from-legal-lure-to-crownx-ransom-capabilities/", publisher: "Blackpoint Cyber (Adversary Pursuit Group)", date: "2026-07-02", role: "primary" }
      - { url: "https://thehackernews.com/2026/07/new-avalon-malware-framework-packs.html", publisher: "The Hacker News", date: "2026-07-03", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"new malware analysis blog post \\\"July 3, 2026\\\" OR \\\"July 4, 2026\\\"\") → pivot: The Hacker News, URL https://thehackernews.com/2026/07/new-avalon-malware-framework-packs.html → primary: Blackpoint Cyber, URL https://blackpointcyber.com/blog/avalons-path-from-legal-lure-to-crownx-ransom-capabilities/"
    summary: |
      Blackpoint Cyber's Adversary Pursuit Group documented Avalon, a previously undocumented modular malware
      framework distributed via a spoofed legal-document phishing email pointing to a password-protected ISO
      archive hosted on Proton Drive. Inside the ISO, a weaponized LNK disguised with a Microsoft Edge icon
      (masquerading as a "secure PDF") launches cmd.exe, which invokes MSBuild.exe against a malicious project
      file (zfighv.tmp) containing inline C# — a T1127.001 trusted-developer-utility proxy-execution chain. The
      managed downloader patches ETW and AMSI functions with XOR return stubs before pulling an encrypted PE
      payload over HTTPS with certificate-validation bypass. Avalon consolidates credential harvesting (browsers,
      crypto wallets including MetaMask/Phantom/Ledger Live, Discord, Teams, RDP sessions, SSH keys, Windows
      Credential Manager), lateral movement via admin shares and scheduled tasks, and the embedded CrownX
      ransomware component (AES-GCM encryption, 40+ targeted extensions, VSS/WinRE/System Restore disabled to
      impair recovery) under one framework. Defense evasion includes hardware-breakpoint handling, clean-ntdll
      remapping, syscall obfuscation (HalosGate/TartarusGate) and named hooks/checks against Microsoft Defender,
      SentinelOne, CrowdStrike, Sophos, Elastic Endpoint, FortiEDR, ESET, McAfee and Bitdefender. Blackpoint
      assesses the framework shows signs of AI-assisted development, consolidating capability an actor would
      previously have needed several discrete malware families to assemble.
    region_nexus: "global; phishing lure and ISO/LNK delivery chain apply to any Windows enterprise, including EU/CH public-sector endpoints"
    primary_sector_nexus: "indirect"
    sector: "cross-sector"
    cves: []
    entity_keys: []
    new_entities:
      - { key: "tool:avalon-malware-framework", type: tool, name: "Avalon malware framework (CrownX ransomware component)",
          aliases: ["CrownX"],
          summary: "Modular Windows malware framework combining credential theft, lateral movement and the CrownX ransomware payload behind an LNK→MSBuild→ETW/AMSI-patching loader chain; assessed by Blackpoint Cyber as showing signs of AI-assisted development (Blackpoint Cyber, 2026-07-02)." }
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "Avalon consolidated credential theft, persistence, and ransom functionality under one recovered payload rather than distributing them across discrete malware families."
        attribution: "Blackpoint Cyber"
        source_url: "https://blackpointcyber.com/blog/avalons-path-from-legal-lure-to-crownx-ransom-capabilities/"
      - quote: "The shortcut paired a document themed filename with a Microsoft Edge icon, presenting the user with what appeared to be a secure PDF rather than an object capable of launching commands."
        attribution: "Blackpoint Cyber"
        source_url: "https://blackpointcyber.com/blog/avalons-path-from-legal-lure-to-crownx-ransom-capabilities/"
      - quote: "A polished, modular implant recovered from an endpoint may reflect an afternoon of iteration rather than a seasoned development team, and the operational impact is identical either way."
        attribution: "Blackpoint Cyber"
        source_url: "https://blackpointcyber.com/blog/avalons-path-from-legal-lure-to-crownx-ransom-capabilities/"
    extended_notes: |
      ATT&CK mapping (Blackpoint's own description, not an ATT&CK-tagged report): T1566.001/T1204.002 phishing +
      user execution of the ISO/LNK; T1127.001 MSBuild trusted-utility proxy execution; T1562.001 impair
      defenses (ETW/AMSI patching); T1055/T1106 syscall-level evasion (HalosGate/TartarusGate); T1021.002
      lateral movement via admin shares; T1053.005 scheduled tasks; T1555/T1552.001 credential harvesting;
      T1490 inhibit system recovery (VSS/WinRE/System Restore); T1486 data encrypted for impact (CrownX).
      Detection concept: alert on MSBuild.exe spawned by cmd.exe with a command line referencing a .tmp/.csproj
      file outside a build pipeline (Sysmon EID 1, ParentImage=cmd.exe, Image=MSBuild.exe); flag ETW provider
      trace-session termination or AMSI.dll patch signatures (image-load + memory-permission-change telemetry);
      monitor for LNK files with mismatched icon-vs-target-extension delivered via ISO/IMG mount from a mail
      client. Hardening: block MSBuild.exe/InstallUtil.exe/csc.exe execution via WDAC or AppLocker on non-
      developer endpoints; disable automatic ISO/IMG mounting from Outlook/browser downloads; enforce Credential
      Guard and LSA protection to blunt the credential-harvesting stage.
      RECENCY CAVEAT: Blackpoint's own post is dated 2026-07-02 and the corroborating Hacker News write-up
      2026-07-03 — both fall outside this run's strict window_hours=8 (~2026-07-03T22:09Z–2026-07-04T06:09Z),
      though within the 72h developing-story allowance. Checked against prior_coverage.json (last 7 days,
      including today's earlier 00:26Z run) — no match; this appears to be a genuine gap in the last two runs'
      S3 coverage rather than a duplicate. Flagging borderline for the main agent's recency call.
    borderline: true
