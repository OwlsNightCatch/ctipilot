    discovery_trace: "first seen at: cisa-kev bridge (python3 tools/fetch_source.py cisa-kev, catalog 2026.11.04; kev-window.txt NOT COVERED row) -> pivot: Apple security-content pages named in the KEV notes (https://support.apple.com/en-us/120896 /120898 /120901 /120902 /120903 /120905) -> pivot: ENISA EUVD record EUVD-2024-25027 whose GHSA reference list names the Sekoia post -> primary: Sekoia report https://www.sekoia.com/blog/poisoned-source-apt29-watering-holes-targets-mobile-devices-with-n-day-exploits ; press rewrites BleepingComputer/The Hacker News 2026-11-04 are not independent"
    summary: |
      CVE-2024-27834 is a WebKit flaw that lets an attacker with arbitrary read and write capability bypass Pointer Authentication; Apple fixed it on 2024-05-13 in Safari 17.5 (macOS Monterey and Ventura), iOS and iPadOS 16.7.8 (iPhone 8, 8 Plus, X, iPad 5th generation and iPad Pro 9.7-inch and 12.9-inch 1st generation) and 17.5, macOS Sonoma 14.5, tvOS 17.5 and watchOS 10.5, crediting Manfred Paul with Trend Micro's Zero Day Initiative. CISA added it to KEV on 2026-11-04 (due 2026-11-18 under BOD 26-04, ransomware use Unknown, forensic triage No) and ENISA lists it as exploited since the same day (EPSS 0.6); neither names a victim. The in-window source of the exploitation is Sekoia (2026-11-04): in mid-October 2026 it found a watering-hole campaign that injects a fingerprinting script ("UltimateFingerprinter", 61 collectors, 394 fields) into compromised or cloned sites (a Ukrainian gas producer, a US chemical-industry trade association, a Bulgarian military-related site, AiTM clones of America250 and a London hotel near Whitehall) and, from 2026-08-27 to 2026-09-03, into the Plerdy SEO-tracker script loaded by thousands of mostly Ukrainian sites. The server then serves one of three n-day chains: Class A for iOS 16.7 (cookie theft: CVE-2025-43529 as renderer RCE, then CVE-2024-27834 as the PAC bypass), Class B on newer iOS that is the DarkSword chain (CVE-2025-43529, CVE-2026-20700, CVE-2025-14174, CVE-2025-43510, CVE-2025-43520) harvesting messages, WhatsApp and Telegram databases, Keychain and photos, and Class C for Chrome 139 to 145 (not 143) on Android (CVE-2026-3910, then CVE-2025-27038 in the Adreno driver) stealing Chrome cookies and saved Wi-Fi. Sekoia states all three chains use already-patched flaws and none works against fully updated devices, and assesses with moderate to high confidence that APT29 (or a subgroup) is behind it, based on overlap (reported to Sekoia by a partner CERT) with a 2025 APT29-attributed watering hole, Google TAG's confirmation that the framework resembles the 2024 Mongolian-government campaign, victimology and infrastructure habits; Sekoia notes the exploits likely came from a third party (commercial-surveillance lineage, DarkSword). Sekoia does not state the minimum iOS 16.7.x build the chain needs; Apple's own advisory fixes CVE-2024-27834 from iOS 16.7.8. Disposition of the KEV row: new item; this entry overlaps with S3's likely Sekoia item.
    region_nexus: "global; victims in Ukraine, US, Czech Republic, Bulgaria, one Australian clinic; AiTM lures aimed at diplomatic and high-profile event visitors (Sekoia). No Swiss victim reported."
    primary_sector_nexus: "indirect (mobile devices of staff in government, diplomatic and defence roles; unpatched or unmanaged iPhones and Android phones)"
