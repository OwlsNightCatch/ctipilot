      - { subject: "actor:red-heron", object: "product:zyxel-gs1900-series-switches", basis: "Binarly 2026-11-03 recovered the GS1900 exploit from Red Heron JITTERLY/SIXZUT infrastructure (open directory file gs1900_bundle.tar.gz)" }
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "update-of:2026-09-22/cve-2026-7273-zyxel-gs1900-red-heron-kev-exploited"
    suggested_priority: high
    evidence:
      - quote: "Binarly confirms all ten fixed releases addressing CVE-2026-7273 remain vulnerable to the exploit used by the threat actor"
        attribution: "Binarly"
        source_url: "https://www.binarly.io/blog/zyxel-gs1900-rce-cve-2026-107441"
      - quote: "Pre-Auth RCE in Zyxel GS1900 Exploited in the Wild as a Zero-Day"
        attribution: "Binarly"
        source_url: "https://www.binarly.io/blog/zyxel-gs1900-rce-cve-2026-107441"
      - quote: "could allow a LAN-based, unauthenticated attacker to exploit the flaw and potentially execute OS commands via a crafted HTTP request"
        attribution: "Zyxel PSIRT"
        source_url: "https://www.zyxel.com/global/en/support/security-advisories/zyxel-security-advisory-for-out-of-bounds-write-vulnerability-in-gs1900-series-switches-11-03-2026"
      - quote: "it remains unclear whether it was deliberately developed to bypass those updates or exploited a related vulnerability that the earlier patches failed to address"
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/zyxel-fixes-zero-day-exploited-to-hack-nearly-1-000-network-switches/"
    exposure: "Any GS1900 whose web management interface (HTTP/HTTPS to /cgi-bin/dispatcher.cgi) is reachable by an attacker (LAN per Zyxel, internet-exposed per the GreyNoise victims) and whose firmware is at or below 2.90(xxxx.2)C0, including every switch patched for CVE-2026-7273 in June."
    detection: "Web/management-plane access logs or an upstream proxy/IDS: POST requests to /cgi-bin/dispatcher.cgi with an abnormally large number of '&'-separated parameters (about 140 or more) and a ~1 KB parameter; on the device, a hidden process named configd (SIXZUT hides processes by that name per Binarly) or outbound connections from the switch to the Internet (JITTERLY command servers). The sources do not say that patching removes an implant; GreyNoise (covered entry) reports hashed root credentials were exfiltrated, so treat any switch that was reachable on a pre-.3C0 build as exposed and rotate its credentials."
    triage: "From the exploit shape Binarly shows (about 139 empty '&'-separated fields, a 1024-byte filler parameter, then a 32-bit counter value), a POST with that many parameters to dispatcher.cgi is far outside normal admin-form traffic (inference from the stated payload layout); a switch that initiates outbound Internet connections is anomalous for an access switch."
    extended_notes: |
      Two facts the entry for CVE-2026-7273 states and this changes: (a) it says Zyxel patched all ten models on 2026-06-16 as the remedy, (b) it ties the exploitation to CVE-2026-7273. Per Binarly the June builds do not stop the recovered exploit; the build to install is the .3C0 one released 2026-10-22. Zyxel's own advisory is dated 2026-11-03 and does not mention exploitation; the zero-day label is Binarly's, and Binarly says it will publish a minimised PoC "in the near future".
