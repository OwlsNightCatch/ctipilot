  - title: "Zyxel GS1900 switches: Binarly shows the exploit used in the Red Heron / Kapibala campaign works against all ten firmware builds that fixed CVE-2026-7273, a separate flaw (CVE-2026-107441) that Zyxel fixed on 2026-10-22 in the .3C0 builds"
    sources:
      - { url: "https://www.binarly.io/blog/zyxel-gs1900-rce-cve-2026-107441", publisher: "Binarly", date: "2026-11-03", role: "primary" }
      - { url: "https://www.zyxel.com/global/en/support/security-advisories/zyxel-security-advisory-for-out-of-bounds-write-vulnerability-in-gs1900-series-switches-11-03-2026", publisher: "Zyxel PSIRT", date: "2026-11-03", role: "primary" }
      - { url: "https://community.zyxel.com/en/discussion/34420/switch-gs1900-series-v2-90-patch-3-firmware-release", publisher: "Zyxel Community (GS1900 V2.90 Patch 3 firmware release)", date: "2026-11-03", role: "corroborating" }
      - { url: "https://cveawg.mitre.org/api/cve/CVE-2026-107441", publisher: "CVE Program record (Zyxel CNA)", date: "2026-11-03", role: "corroborating" }
      - { url: "https://www.bleepingcomputer.com/news/security/zyxel-fixes-zero-day-exploited-to-hack-nearly-1-000-network-switches/", publisher: "BleepingComputer", date: "2026-11-04", role: "corroborating" }
    discovery_trace: "first seen at: BleepingComputer feed https://www.bleepingcomputer.com/feed/ (gap-fill sweep), article URL https://www.bleepingcomputer.com/news/security/zyxel-fixes-zero-day-exploited-to-hack-nearly-1-000-network-switches/ -> pivot: BSI WID-SEC-2026-4330 (https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-4330, critical 'Zyxel Switch: code execution', fetched via bsi-csaf) -> primary: Zyxel advisory URL above + Binarly blog (fetched through the jina reader; extract returns only a Next.js shell) -> Zyxel firmware post + CVE record"
    summary: |
      Update on the covered finding CVE-2026-7273 (entry 2026-09-22). Binarly, which found a Python exploit for GS1900 switches on the Red Heron infrastructure (JITTERLY backdoor, SIXZUT rootkit) while investigating that campaign, reports that the exploit targets a separate, previously unknown flaw in the web CGI (dispatcher.cgi, web_util_initParaPairs): the request-parameter parser copies a 1024-byte parameter without a length check past a 140-slot buffer and overwrites the adjacent parameter counter, which gives either a GOT overwrite (strcmp replaced by system) or a ROP chain, so one POST to /cgi-bin/dispatcher.cgi runs an OS command with no authentication. Binarly's timeline says it confirmed on 2026-09-28 that all ten firmware builds that fixed CVE-2026-7273 on 2026-06-16 (the "...2)C0" builds) remain vulnerable, notified Zyxel on 2026-09-29, Zyxel confirmed on 2026-10-11 and reserved CVE-2026-107441, released the fix on 2026-10-22 and published its advisory on 2026-11-03. Zyxel's table gives the fixed build per model as "2.90(xxxx.3)C0" for GS1900-8, -8HP, -10HP, -16, -24, -24E, -24EP, -24HPv2, -48 and -48HPv2. Zyxel describes the attacker as "LAN-based" and scores the flaw 8.8 (CVSS 3.1 AV:A) while Binarly and BleepingComputer describe it as unauthenticated remote code execution; the two readings of the attack surface are not reconciled in any source. Attribution of the in-the-wild activity to this flaw is Binarly's inference from the exploit's firmware checks and its testing: BleepingComputer notes it remains unclear whether the exploit was written to bypass the June fix or used a related flaw the June fix missed. Not in the CISA KEV catalog as of 2026-11-04 (only CVE-2026-7273 is).
    region_nexus: "global; GS1900 smart-managed switches are common in small public-sector and branch networks; GreyNoise counted 996 compromised devices in 48 countries (covered entry)"
    primary_sector_nexus: "direct (network edge/access switches in administrations and schools; many on factory-default credentials per the covered entry)"
    sector: "public-sector"
    cves: [CVE-2026-107441, CVE-2026-7273]
