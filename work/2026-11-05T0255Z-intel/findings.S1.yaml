    url_tried: "https://www.connectwise.com/company/trust/advisories"
    fetch_method: "bridge:extract"
    status_code: 403
    error_class: transport-403
    error_message: "fetch_source: all transports failed for https://www.connectwise.com/company/trust/advisories: direct=(direct HTTP 403, 6068 B); trafilatura=(no readable body); jina=(reader proxy relayed an upstream block/challenge"
    attempted_methods: [extract, url, jina]
    mitigation_applied: "read the status page https://status.connectwise.com/ with extract: no new security item in window"
    covered_anyway: false
  - id: cisa-advisories
    url_tried: "https://www.cisa.gov/news-events/cybersecurity-advisories"
    fetch_method: "webfetch"
    status_code: 403
    error_class: transport-403
    error_message: "The server returned HTTP 403 Forbidden. The response body was not retrieved."
    attempted_methods: [webfetch, "bridge:feed all.xml (403, reader no items)", "webfetch alert URL (403)", websearch, "bridge:cisa csaf-recent (worked)"]
    mitigation_applied: "cisa csaf-recent and cisa-kev worked; WebSearch (allowed_domains cisa.gov) found no AA-series advisory in window"
