  - title: "SEPPmail Secure Email Gateway before 15.1.1: unauthenticated mail sender reaches root command execution (CVE-2026-114424, CVSS 4.0 9.2) and arbitrary file read, move or delete (CVE-2026-114425, 9.2); NCSC.ch is the CNA, fix only in the 15.1 branch"
    sources:
      - { url: "https://cveawg.mitre.org/api/cve/CVE-2026-114424", publisher: "CVE Program record (NCSC.ch CNA)", date: "2026-11-04", role: "primary" }
