recipe_notes:
  - "cisa-advisories: see coverage gap; WebFetch on cisa.gov was 403 on 2026-11-05 (listing and alert page); keep csaf-recent and cisa-kev; discover alerts through WebSearch with allowed_domains cisa.gov and cite only pages read."
  - "enisa-euvd: `url 'https://euvdservices.enisa.europa.eu/api/search?fromScore=9&toScore=10&fromDate=2026-11-03&toDate=2026-11-05&size=100'` returned 112 records with exploitedSince; `/api/exploitedvulnerabilities` returned 4 records and caught CVE-2024-27834 (exploitedSince 2026-11-04) on the day; the GHSA record attached to an EUVD record carried the Sekoia reference."
  - "msrc-update-guide: `fs._msrc_fetch_strict_json` with $filter=latestRevisionDate ge 2026-11-03T00:00:00Z returns 100 rows (more exist); filtering with 'and (exploited eq 'Yes' or publiclyDisclosed eq 'Yes')' on older releases returned 0."
  - "fortinet-psirt: `feed https://www.fortiguard.com/rss/ir.xml 30` reset on the first call and worked on retry after ~15 s (recipe note of 2026-10-27/29 confirmed)."
  - "mikrotik-routeros-changelog: `url https://upgrade.mikrotik.com/routeros/NEWESTa7.stable` (reader fallback) returned '7.25.1' and `url https://upgrade.mikrotik.com/routeros/7.25.1/CHANGELOG` the changelog with 'includes CVE-2026-98432'."
  - "splunk-advisories: `extract https://advisory.splunk.com/advisories` returns a 716 KB table with Date and Last Modified columns (use Last Modified for revision sweeps); per-SVD `extract` pages carry Product Status and a Changelog."
  - "xerox: https://security.business.xerox.com/en-bz/documents/bulletins lists current bulletin versions with dates (extract); the PDF href is only in the raw HTML (`url --direct`); `pdf <url>` reads the bulletin and `difflib` on whitespace-normalised text gives the revision delta."
  - "bsi-de: `url --direct https://wid.cert-bund.de/.well-known/csaf/white/changes.csv` stamps are CET-day granular (T23:00Z of the previous day); bsi-csaf WID-SEC-<n> returns references to vendor pages."
  - "kev ransomware flips: older KEV snapshots exist as work/<run>/cisa-kev.json; diffing knownRansomwareCampaignUse against the 2026-07-29 snapshot found 26 flips (see ransomware_flag_review)."
