      - { url: "https://docs.seppmail.com/en/20_revision-history.html", publisher: "SEPPmail GmbH (Gateway documentation, revision history)", date: "2026-11-03", role: "primary" }
    discovery_trace: "first seen at: ENISA EUVD critical-score sweep, URL https://euvdservices.enisa.europa.eu/api/search?fromScore=9&toScore=10&fromDate=2026-11-03&toDate=2026-11-05&size=100 (EUVD-2026-116781 / -116782, SEPPmail Secure Email Gateway before 15.1.1, 9.2) -> pivot: CVE records at https://cveawg.mitre.org/api/cve/CVE-2026-114424 and CVE-2026-114425 (CNA NCSC.ch, finder Dario Weiss of InfoGuard Labs, reference docs.seppmail.com) -> primary: SEPPmail revision history https://docs.seppmail.com/en/20_revision-history.html (Patch release 15.1.1, 2026-11-03, Security section)"
    summary: |
      SEPPmail's revision history lists patch release 15.1.1 of 2026-11-03 with a Security section of five fixes, all "affected versions <15.1.1": CVE-2026-114424 (CVSS 9.2), improper handling of replacement values in address replacement rules that lets a remote sender run arbitrary commands if a ruleset uses values taken from the message as replacement; CVE-2026-114425 (9.2), crafted attachment metadata in an incoming message makes Large File Transfer (LFT) processing read or delete arbitrary files; CVE-2026-114426 (8.7), unauthenticated upload interface processes data before authentication and without a size limit (worker and disk exhaustion); and two GINA webmail flaws, CVE-2026-114421 (8.3, takeover of a created but unregistered GINA account by an unauthenticated attacker through password recovery) and CVE-2026-114420 (6.9, LDAP-filter injection that enumerates email addresses). The NCSC.ch CVE records (published 2026-11-04T08:28 to 08:42Z, credited to Dario Weiss of InfoGuard Labs) add the exposure conditions: for CVE-2026-114424 an unauthenticated remote sender executes OS commands in the mail-processing worker "when an active rule uses message-derived replacement data and its search condition matches", with the validated worker running as root; for CVE-2026-114425 the file operation needs LFT enabled and the message reaching an affected secure-mail processing path, again as root. Both score CVSS 4.0 AV:N/AC:L/AT:P/PR:N. The revision history lists no fix on the 15.0 branch (latest 15.0.7, 2026-09-02), so 15.0.x gateways must move to 15.1.1. No exploitation is reported by any source. The vendor page lists CVE-2026-114421 at 6.9 and CVE-2026-114420 at 8.3 under one shared description, the reverse of the CVE records; this item follows the CVE records. Related covered finding: the May 2026 SEPPmail batch (entry 2026-05-09/cve-2026-44128-et-al-seppmail-secure-email-gateway-cvss-9-3), same researcher team and the same Perl-eval and LFT component classes.
    region_nexus: "switzerland / dach (Swiss vendor; NCSC.ch is CNA)"
    primary_sector_nexus: "direct (SEPPmail is the mail-encryption gateway widely run by Swiss federal, cantonal and communal administrations and their suppliers)"
    sector: "public-sector"
    cves: [CVE-2026-114424, CVE-2026-114425, CVE-2026-114426, CVE-2026-114421, CVE-2026-114420]
    techniques: [T1190, T1059]
    affected_products: ["SEPPmail Secure Email Gateway (SEG)"]
    entity_keys: ["product:seppmail-secure-e-mail-gateway"]
    new_entities: []
    verification: SINGLE-SOURCE-NATIONAL-CERT
    confidence: HIGH
    novelty: new
    suggested_priority: high
    references_existing: ["2026-05-09/cve-2026-44128-et-al-seppmail-secure-email-gateway-cvss-9-3"]
    evidence:
      - quote: "An unauthenticated remote sender can execute operating-system commands in the mail-processing worker context when an active rule uses message-derived replacement data and its search condition matches."
        attribution: "NCSC.ch (CVE-2026-114424 record)"
        source_url: "https://cveawg.mitre.org/api/cve/CVE-2026-114424"
      - quote: "An unauthenticated remote sender can cause the mail-processing worker to disclose, move, or delete an accessible regular file when LFT is enabled and the message reaches an affected secure-mail processing path."
        attribution: "NCSC.ch (CVE-2026-114425 record)"
        source_url: "https://cveawg.mitre.org/api/cve/CVE-2026-114425"
      - quote: "Improper handling of replacement values in address replacement rules could allow a remote sender to execute arbitrary commands on the appliance if a ruleset uses values taken from the message as replacement."
        attribution: "SEPPmail"
        source_url: "https://docs.seppmail.com/en/20_revision-history.html"
      - quote: "Patch release 15.1.1, 2026-11-03"
        attribution: "SEPPmail"
        source_url: "https://docs.seppmail.com/en/20_revision-history.html"
    exposure: "Gateways running a version before 15.1.1 (version shown in the Admin GUI); CVE-2026-114424 only where a rule set uses message-derived values in sender or recipient address replacement rules; CVE-2026-114425 only where Large File Transfer is enabled; the mail-receiving path is internet-facing by design, so reachability is not the limiting factor. 15.0.x has no listed fix."
    detection: "Mail-processing and rule-engine logs for address-replacement rules that fire on inbound mail with unusual sender or recipient strings, unexpected child processes of the mail-processing worker (root), and file operations by the LFT worker outside its storage area; review gateway-initiated outbound connections. Patching does not remove a foothold: check for new accounts, cron entries and changed rule sets on any gateway that ran a pre-15.1.1 build with such rules."
    extended_notes: |
      Sources do not state whether SEPPmail will backport to 15.0.x; the revision history lists only 15.1.1 for these CVEs. NCSC.ch has not posted a Security Hub advisory for this batch as of 2026-11-05 (ncsc-csh recent lists the Barracuda post of 2026-11-03 as newest); the CVE records are the NCSC.ch primary. Candidate source: SEPPmail revision history (see candidate_sources).
