      - { url: "https://thehackernews.com/2026/11/critical-rails-flaw-lets-attackers.html", publisher: "The Hacker News", date: "2026-11-04", role: "corroborating" }
    discovery_trace: "first seen at: The Hacker News feed https://feeds.feedburner.com/TheHackersNews (gap-fill) and BSI WID-SEC-2026-4317 (Ruby on Rails, hoch) -> primary: GitHub advisory https://github.com/rails/rails/security/advisories/GHSA-f3w6-w445-fwh9 (reporter RyotaK, GMO Flatt Security) -> CVE record"
    summary: |
      A Rails application that processes attachments with ImageMagick may allow an unauthenticated attacker to write arbitrary files on the server and, with the Disk storage service, read any file the app can read (typically secret_key_base and credentials). The ImageMagick analyzer runs as soon as a file is attached; an uploaded SVG reached ImageMagick's MSL scripting coder. An app is affected only if it uses ImageMagick for Active Storage image processing (config.active_storage.variant_processor = :mini_magick, the default for load_defaults 6.1 or earlier), runs ImageMagick under a policy that does not deny the coders involved (the Debian and Ubuntu packaged policies do not), and accepts uploads from untrusted users. Fixed in activestorage 8.0.5.2 and 8.1.4.1, which ship a denying ImageMagick policy and need mini_magick 5.1 or later; the workaround is to copy that policy into the system policy.xml. Rails says one attack chain was reported and does not assume it is the only one; the advisory does not say whether the flaw has been exploited. MITRE assigned CVE-2026-122006 on 2026-11-04 (CVSS 3.1 9.8).
