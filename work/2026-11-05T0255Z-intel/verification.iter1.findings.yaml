- code: F8
  category: needs-more-research
  section: updated-entry
  item: "2026-10-31/cve-2026-98432-linux-kernel-tcp-uaf-mptcp-remote-root"
  url_or_quote: "**Exposure:** a Linux host on a kernel below the fixed builds that accepts IPv4 TCP connections from an attacker; the demonstrated exploit needs an MPTCP listener, but CIQ's testing found that setting `net.mptcp.enabled` to 0 leaves the plain-TCP path reachable"
  summary: "The rewrite dropped the 'how to tell' that sources clearly support: the Go team page says 'As of Go 1.24, Go programs enable MPTCP by default for listen sockets on Linux' (so any current Go service is an MPTCP listener), Akamai gives 'ss -M -l -n -p -e' to find MPTCP listeners and says request-socket migration (net.ipv4.tcp_migrate_req / BPF reuseport) is a second reachable path, and the HEAD body's sysctl check was removed. Exposure now says only 'needs an MPTCP listener' with no way to identify one."
