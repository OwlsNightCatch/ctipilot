  summary: 'Sekoia''s Threat Detection & Research team reports a watering-hole campaign it found in mid-October 2026 and assesses with moderate-to-high confidence to be APT29 (Midnight Blizzard, SVR) or one of its subgroups. Three infection vectors load a script that profiles the visitor''s browser and device and only then serves a platform-specific n-day exploit chain that needs no user interaction: JavaScript injected into legitimate sites (a Ukrainian gas producer, a US chemical-industry trade association, a far-right European party, a Bulgarian military-related site, an Australian medical clinic), reverse-proxy clone domains of high-profile sites (the America250 site and a London luxury hotel next to UK government buildings, which Sekoia reads as aimed at diplomatic and event-linked visitors), and a one-week compromise (27 August to 3 September 2026) of the Plerdy SEO Tracker script that thousands of mostly Ukrainian sites load. Sekoia recovered three chains: an iOS 16.x chain that steals
    Safari and app cookies, a DarkSword-based iOS chain that harvests messaging and mail stores, keychain, location, photos and Wi-Fi keys, and an Android chain for Chrome 139 to 145 (not 143) that escapes the sandbox through an Adreno GPU-driver flaw and takes Chrome cookies, saved logins, history and Wi-Fi credentials. All chains use known, already-patched flaws, none installs persistence, and the delivery host only filters out implausible devices. Sekoia''s attribution rests on a partner''s link of one compromised site''s leftover artefacts to a 2025 APT29 watering hole, Google TAG''s statement (as Sekoia reports it) that the framework resembles APT29''s 2024 campaign against Mongolian government sites, victimology and hosting habits; Sekoia says the exploits probably came from a third party, as with the commercial-surveillance-vendor kits GTIG documented in March 2026. Sekoia withholds IOCs, YARA rules and the compromised-site list from the public report and shares them with national
    CERTs and law enforcement under TLP:AMBER on request.'
  region_nexus: Europe and the US; Sekoia names victims in Ukraine, the Czech Republic, Bulgaria and the US (plus an Australian clinic); no Swiss victim named
