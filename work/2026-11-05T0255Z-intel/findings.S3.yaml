  summary: Trellix's semi-annual CyberThreat Report covers 1 April to 30 September 2026 and is built on Trellix telemetry plus leak-site counts, so its ransomware numbers are criminals' claims counted by Trellix. On the public sector it counts 131 government and 118 education ransomware leak-site posts (healthcare 280) and says that, measured by unique ransomware campaigns per sector in its ATLAS data, government is again the most broadly targeted sector. Europe took 26.4% of geo-identified ransomware victims (UK 202, Germany 194, France 166, Italy 147, Spain 100 posts) partly because several of the most active groups, among them The Gentlemen, LockBit 5.0 and DeadLock, named many European victims. Of 22 ransomware campaigns with a known exploited vulnerability, 14 began at a VPN, firewall or other edge device (Fortinet FortiOS, Citrix NetScaler, SonicWall SMA, Palo Alto GlobalProtect, Check Point Remote Access VPN, Cisco Secure Firewall Management Center), and the report says legacy flaws
    on internet-facing infrastructure, not zero-days, drive the heaviest exploit-detection volume. Disable or Modify Tools was the second most common technique, in 40 of 94 ransomware campaigns, 14 of them with EDR killers or vulnerable drivers; Akira rebooted victims into Safe Mode in one August campaign; 13 campaigns targeted ESXi or other hypervisors; Cl0p's PTC Windchill campaign stole data from dozens of companies without encrypting. The Gentlemen overtook Qilin with 719 posts against 38 a year earlier, and 55 groups posting for the first time accounted for 22% of posts. The report also covers underground agentic malware (TITAN AI, and the JadePuffer agent-driven ransomware Sysdig documented) and AI agents moving secrets onto command lines and into model context windows.
