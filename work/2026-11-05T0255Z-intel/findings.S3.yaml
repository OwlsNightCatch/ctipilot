  discovery_trace: 'first seen at: report-uri-blog, feed https://blog.report-uri.com/rss/ (fetched with `feed`, item dated 2026-10-30 ''Polymarket''s CSP Allowed Every Part of the $2.6 Million Crypto Theft'', inside the record''s 168 h lookback) -> primary: Report URI post, URL https://blog.report-uri.com/polymarkets-csp-allowed-every-part-of-the-2-6-million-crypto-theft/ (fetched with `extract`) -> corroboration: BleepingComputer https://www.bleepingcomputer.com/news/security/polymarket-halts-trading-after-crypto-draining-script-breach-25m-traced (found through WebSearch ("DebugBear security incident RUM script Polymarket compromised October 2026"), fetched with `extract`)'
  summary: On 29 October 2026 the file that Polymarket's page loaded from DebugBear's real-user-monitoring CDN was replaced by a smaller script written for Polymarket that read three local-storage keys, drove Polymarket's own order client and moved or sold users' positions, taking roughly 28.6 million POL (about 2.6 million USD) in about fifty minutes; Polymarket removed the embed in a build at 17:59 UTC. DebugBear said it was 'impacted by an ongoing security incident' and asked customers to remove the embed code; it has not said how it was breached. Report URI's analysis of an archived copy of Polymarket's enforced, fairly long Content Security Policy finds that it allowed the DebugBear host in script-src-elem and the hosts the drainer called in connect-src, so every request passed, and that it had no reporting directive; the address of the script was identical before, during and after the attack and only the bytes changed. Report URI counts thousands of other sites loading the same DebugBear
    file and says the malicious code appeared benign on them. The levers it names are Subresource Integrity on every third-party script, the Integrity-Policy header in report-only mode to find script tags without integrity attributes, and a CSP report-sha256 source so browsers report the hash of each executed script and a changed file at a known URL raises an alert; Report URI sells monitoring built on these, so read the remediation text as partly promotional.
  region_nexus: global; crypto-trading platform, no European public-sector victim
  primary_sector_nexus: 'indirect: the mechanism (a monitoring or analytics script that every page loads) applies to any government web portal that embeds third-party scripts, the same class as the Plerdy tracker in the Sekoia item'
  sector: financial
  cves: []
  techniques:
  - T1195.002
  - T1059.007
  - T1657
  affected_products:
  - DebugBear Real User Monitoring
  entity_keys: []
  new_entities: []
  relation_suggestions: []
  verification: MULTI-SOURCE
  sourcing_note: 'Report URI is a vendor of JavaScript-integrity monitoring and did not protect Polymarket; its payload analysis builds on Hudson Rock and DeFi Prime work it credits, and BleepingComputer independently reports the incident (loss figures differ between outlets). Lookback item: the Report URI post is dated 2026-10-30, inside the record''s 168 h lookback but outside the 26 h window.'
  lookback: true
  confidence: MEDIUM
  suggested_classification: B2
  novelty: new
  borderline: true
  borderline_reason: crypto platform victim, not government; kept only for the transferable third-party-script lesson and because it pairs with the Plerdy tracker compromise in the Sekoia item; thin for a standalone entry
  evidence:
  - quote: For about fifty minutes on Thursday afternoon, a performance monitoring script loaded on `polymarket.com` was compromised and started quietly emptying the accounts of anyone it targeted.
    attribution: Report URI (Scott Helme)
    source_url: https://blog.report-uri.com/polymarkets-csp-allowed-every-part-of-the-2-6-million-crypto-theft/
  - quote: 'This is the limit of any defence that''s based on URLs: The address of the script was identical before, during and after the attack. Only the bytes of the script changed.'
    attribution: Report URI (Scott Helme)
    source_url: https://blog.report-uri.com/polymarkets-csp-allowed-every-part-of-the-2-6-million-crypto-theft/
  - quote: There was also no `report-uri` or `report-to` directive in the policy that I could see, so even if something had been blocked, nobody would have heard about it.
    attribution: Report URI (Scott Helme)
    source_url: https://blog.report-uri.com/polymarkets-csp-allowed-every-part-of-the-2-6-million-crypto-theft/
  extended_notes: 'Exposure: any page that loads a third-party script from a host it allowlists in script-src; inventory those hosts and the pages that carry them. Detection: browser-side script-hash reporting (CSP report-sha256) and Integrity-Policy report-only to see unpinned scripts; server-side, a changed Last-Modified, size or hosting fingerprint for a third-party file at an unchanged URL. Defender takeaway: pin what can be pinned with SRI, report on what cannot, and give every enforced CSP a reporting endpoint so a blocked or changed script is visible.'
- title: US DHS order removes Swiss vendor Acronis from federal civilian networks; Nextgov says the focus is Russian developer ties and cites no evidence of a backdoor
  sources:
