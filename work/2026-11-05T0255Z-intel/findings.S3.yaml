    role: corroborating
  discovery_trace: 'first seen at: risky-biz-news, URL https://news.risky.biz/risky-bulletin-hackers-lock-out-and-extort-li-auto-smart-car-owners-in-russia/ (2026-11-04 bulletin, item ''US boots Acronis from government networks'', fetched with `extract`) -> Nextgov https://www.nextgov.com/cybersecurity/2026/11/us-order-purge-acronis-tied-years-scrutiny-over-russian-ties/416970/ (fetched with `extract`) -> primary: Federal Register notice, API record https://www.federalregister.gov/api/v1/documents/2026-22215.json (the human page answered with a CAPTCHA; the API returned the abstract and metadata)'
  summary: The US Department of Homeland Security published a notice in the Federal Register on 30 October 2026 (91 FR 68528) of an order by the Secretary excluding Acronis AG and all affiliated entities, and any covered articles they supply, from federal civilian agency procurement and removing all Acronis covered articles from civilian agency IT systems. Nextgov, citing two former officials, reports that the directive was signed on 31 July, gives civilian agencies until 27 January of next year to remove the software, followed a recommendation of the interagency Federal Acquisition Security Council and ends years of scrutiny, since the first Trump administration, of Russian developers' involvement in the codebase and of supply-chain risk mitigation. Neither official said there was concrete evidence that Acronis products have backdoors to Moscow; an Acronis spokesperson did not say whether the company will challenge the order and pointed to EQT's majority stake since May 2025, cleared by
    CFIUS. Nextgov adds that earlier orders barred Acronis from intelligence-community networks and that GSA and Department of Defense bans followed. The Federal Register abstract states the order; every characterisation of the reasons comes from Nextgov's anonymous sources.
  region_nexus: United States measure against a Swiss-headquartered vendor (Schaffhausen); no Swiss or EU authority action is reported
  primary_sector_nexus: 'indirect: Acronis (backup, recovery, file sharing) is a Swiss technology supplier that Swiss public-sector bodies and their service providers may run; the order is a procurement and supply-chain-risk decision, not a technical finding'
