    basis: SophosLabs identified the payload as the BeaverTail loader (Sophos RCA INC-2026-002)
  - subject: incident:sophos-inc-2026-002-developer-job-lure-2026-09
    object: malware:invisibleferret
    basis: SophosLabs identified the final stage as the InvisibleFerret backdoor (Sophos RCA INC-2026-002)
  verification: SINGLE-SOURCE-OTHER
  sourcing_note: The victim's own disclosure and root-cause analysis (first-hand); no independent confirmation, which is normal for a victim statement. NICKEL ALLEY is Sophos's name for the Contagious Interview cluster; the registry may want it as an alias of campaign:contagious-interview. The Sophos RCA page carries no publication date (its metadata date is a crawl artefact).
  confidence: HIGH
  suggested_classification: B2
  novelty: new
  evidence:
  - quote: A command hidden in the workspace settings ran as soon as a terminal opened, and within two minutes the BeaverTail loader and InvisibleFerret backdoor were running.
    attribution: Sophos
    source_url: https://www.sophos.com/en-us/blog/fake-coding-test-reaches-security-company
  - quote: The Sophos Endpoint agent was installed on the employee’s device but was not functional.
    attribution: Sophos
    source_url: https://www.sophos.com/en-us/trust/root-cause-analyses/inc-2026-002
  - quote: A third-party application (OAuth) authorization that had survived the session revocation was identified and revoked.
    attribution: Sophos
    source_url: https://www.sophos.com/en-us/trust/root-cause-analyses/inc-2026-002
  - quote: a device that's still signing in but not reporting to your endpoint console is a coverage gap.
    attribution: Sophos
    source_url: https://www.sophos.com/en-us/blog/fake-coding-test-reaches-security-company
  extended_notes: 'Behavioral manifestation: a code editor (VS Code) launches an integrated terminal whose profile is defined by the cloned workspace, the shell fetches and runs a payload, files appear in the user profile, the user is prompted to grant the editor Full Disk Access, then a package-manager dependency install runs from the payload directory and an in-memory backdoor takes over. Detection (telemetry classes): process-creation events with the editor as ancestor of curl, shell or package-manager children; macOS privacy (TCC) grants to the editor shortly after a repository is cloned; identity logs showing a corporate password entered on a third-party code-platform page; identity-to-endpoint reconciliation for devices that sign in but never report; code-platform audit logs for reads by third-party OAuth applications from new networks after a session reset. Post-incident check: revoke third-party application authorizations on the code platform and the IdP as well as sessions, because
    revocation of sessions alone left the authorization usable. Triage: legitimate developer activity also spawns shells and package installs from an editor; the discriminators are a terminal profile or workspace settings file inside a freshly cloned third-party repository, a download-and-run in the first minutes, and a source that arrived as a job-interview assignment. Defender takeaway: treat unsolicited coding assignments as untrusted code on a disposable machine, and alert on endpoints that are active in identity logs but silent in the endpoint console.'
- title: 'AI inference credentials are stolen from the platforms that hold them and from cloud accounts, then resold: Wiz and CSA on the platform-chain wave and Mandiant''s LLMjacking playbook'
  sources:
  - url: https://www.securityweek.com/ai-linked-breaches-mount-as-workos-northflank-trigger-dev-disclose-hacks/
    publisher: SecurityWeek
    date: '2026-11-04'
    role: corroborating
  - url: https://www.wiz.io/blog/black-october-for-ai-developer-platforms
    publisher: Wiz (Black October for AI Developer Platforms; updated 2026-11-03)
