    role: primary
  - url: https://labs.cloudsecurityalliance.org/research/csa-research-note-inference-provider-platform-chain-campaign/
    publisher: Cloud Security Alliance AI Safety Initiative (Lab Space note; its landing page says the notes come from an automated research pipeline)
    date: '2026-10-23'
    role: corroborating
  - url: https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models/
    publisher: Google Threat Intelligence Group / Mandiant
    date: '2026-11-02'
    role: primary
  discovery_trace: 'first seen at: securityweek, feed https://www.securityweek.com/feed/ (fetched with `feed`, item dated 2026-11-04 12:43 UTC ''AI-Linked Breaches Mount as WorkOS, Northflank, Trigger.dev Disclose Hacks'') -> SecurityWeek article https://www.securityweek.com/ai-linked-breaches-mount-as-workos-northflank-trigger-dev-disclose-hacks/ (fetched with `extract`) -> primary pivots from its outbound links: Wiz https://www.wiz.io/blog/black-october-for-ai-developer-platforms and CSA https://labs.cloudsecurityalliance.org/research/csa-research-note-inference-provider-platform-chain-campaign/ -> primary found through the 2026-11-04 Risky Bulletin roll-up (https://news.risky.biz/risky-bulletin-hackers-lock-out-and-extort-li-auto-smart-car-owners-in-russia/): GTIG/Mandiant https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models/'
  summary: 'SecurityWeek reports that at least a dozen AI developer platforms (among them Fireworks AI, OpenCode, Railway, Zeabur, Lightning AI, Warp, Northflank, Trigger.dev, plus Chainstack and WorkOS this week) disclosed intrusions within about a month, with the attackers hunting stored customer secrets, above all AI access tokens, and reportedly using AI agents to speed up the work. Wiz says the root causes differ (credential access, build-infrastructure privilege escalation, a third-party dependency, a legacy system) and that it watched stolen enterprise Amazon Bedrock keys used for the first time within 30 minutes of the reported vendor credential access, as a single InvokeModel from a residential address in a one-minute sweep that tested keys across several organisations; one unrestricted key then carried about 800,000 Bedrock calls in 30 hours through global cross-region inference profiles, and Wiz found LLM resale operators holding the same keys while stating it cannot definitively
    tie them to the initial compromises or the bulk abuse. The Cloud Security Alliance names the pattern ''platform-chain'': the intruder uses the platform''s legitimate custody of customer secrets, so deleting a key from the platform does not revoke the attacker''s copy and the keys must be rotated at the issuing provider. Mandiant adds that in 2026 incidents the dominant initial access to cloud LLMs was exposed or stolen cloud identity tokens (IAM keys, service-account keys, GitHub PATs, session tokens), that in multiple incidents LLM services were not enabled at compromise and the attacker switched them on, that key checks used single-token requests to stay below volume alerts, and that fraudulent charges passed 100,000 USD a day and 1 million USD in total. Mandiant also describes a LiteLLM gateway escalation from a virtual key to PROXY_ADMIN and underground ''LLM Mixers'' that pool and resell stolen quota. SecurityWeek and Wiz say the platform incidents do not appear to be one operation.'
  region_nexus: global; Mandiant's cases are in North America, South America and Asia Pacific; no European public-sector victim is named
  primary_sector_nexus: 'indirect: no public-sector victim; relevant to any administration that stores cloud or AI provider keys on third-party platforms or has cloud accounts able to enable LLM services'
  sector: technology
