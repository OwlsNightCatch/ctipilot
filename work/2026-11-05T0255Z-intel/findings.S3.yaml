    attribution: Federal Register
    source_url: https://www.federalregister.gov/api/v1/documents/2026-22215.json
  - quote: Neither said there was concrete evidence produced indicating Acronis offerings had backdoors communicating with Moscow.
    attribution: Nextgov/FCW
    source_url: https://www.nextgov.com/cybersecurity/2026/11/us-order-purge-acronis-tied-years-scrutiny-over-russian-ties/416970/
  - quote: An Acronis spokesperson did not say whether the company would challenge the DHS directive.
    attribution: Nextgov/FCW
    source_url: https://www.nextgov.com/cybersecurity/2026/11/us-order-purge-acronis-tied-years-scrutiny-over-russian-ties/416970/
  extended_notes: 'Defender takeaway: for Swiss public-sector customers the practical step is a supplier-risk inventory (where Acronis software or Acronis-based services from a provider run, who the vendor''s developers and owners are) and a decision on whether the US finding changes your own supplier criteria; it is not an indicator that Acronis software is compromised. Separate from this, an Acronis backup plugin for cPanel carried a KEV-listed local privilege escalation in September 2026 (existing entry in the store).'
- title: 'heise: Calif.io says it bypassed iOS Lockdown Mode with a PDF delivered over AirDrop and that the compromise survives an update to iOS 27.2; shown only in a video, no write-up'
