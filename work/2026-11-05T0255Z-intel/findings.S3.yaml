  extended_notes: 'Defender takeaway: none beyond a watch item. Keep Lockdown Mode and prompt updates as BSI advises; do not read a bypass claim as a reason to drop them. A second source, a Calif.io write-up, a CVE or an Apple security note would change this to a normal item.'
