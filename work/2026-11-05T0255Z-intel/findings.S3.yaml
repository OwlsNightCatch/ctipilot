  extended_notes: 'Defender takeaway (Trellix''s own): make edge-device patching a tracked, time-bound metric reported to leadership, and require tamper protection and vulnerable-driver blocking on every endpoint so an EDR killer finds no way to blind the agent. Hunting concept: ransomware campaigns in the data most often combine the Windows command shell, PowerShell, PsExec, Net and Mimikatz, with Data Encrypted for Impact on 96% of ransomware detections. Treat the counts as Trellix''s reading of public leak sites and its own sensors, not as the true victim population; Switzerland is absent from the country figures quoted here.'
- title: 'SpecterOps: with CHAP left off, any host can impersonate a Windows iSCSI Target Server initiator, read shared virtual disks below NTFS and pull NTDS.dit out of a Hyper-V domain-controller VHDX'
  sources:
  - url: https://specterops.io/blog/2026/11/04/unauthenticated-iscsi-target-server/
    publisher: SpecterOps (Garrett Foster)
    date: '2026-11-04'
    role: primary
  discovery_trace: 'first seen at: specterops, feed https://specterops.io/feed/ (fetched with `feed`, item dated 2026-11-04 17:00 ''Mi Scusi, My SCSI: Abusing iSCSI Target Server'') -> primary: SpecterOps research post, URL https://specterops.io/blog/2026/11/04/unauthenticated-iscsi-target-server/ (fetched with `extract`)'
  summary: 'SpecterOps shows that the Windows iSCSI Target Server role, as set up by a common cluster guide that skips the optional CHAP step, accepts initiator logins without authentication unless CHAP is configured: an attacker only needs the target host, the target IQN and an authorised initiator IQN. Hosts running the role are found by an LDAP query for the SPN the service registers on the computer account; initiator IQNs are predictable because they embed the initiator''s dNSHostName; and the target IQN is returned by an iSCSI Discovery session (the SendTargets operation) when presented with a valid initiator IQN, with no rate limiting or brute-force protection observed. Block-level access bypasses NTFS permissions, so the researcher''s worst case is a Hyper-V domain controller''s VHDX read off the shared disk, then SAM, SYSTEM, SECURITY and NTDS.dit extracted offline and dumped with Impacket''s secretsdump. SpecterOps found that about half of its BloodHound Enterprise customer tenants
    had at least one computer with the iSCSI target SPN, up to close to 700; the author''s own desk research (not telemetry) finds the common uses to be clustered resources such as Hyper-V, MSSQL and Exchange DAGs, followed by third-party backup. This is a design weakness, not a CVE; the author has not tested it in production and warns that abusing it could cause outages. A BitLocker-encrypted volume defeats the read; the author''s tooling (scuzzy.py) is public.'
  region_nexus: global; technology class common in on-premises Windows Server failover-cluster and Hyper-V estates
  primary_sector_nexus: 'indirect: no public-sector victim; relevant to cantonal and communal on-premises Windows data centres that use iSCSI shared storage'
  sector: public-sector
  cves: []
  techniques:
  - T1018
  - T1046
  - T1039
  - T1003.003
  - T1003.002
  affected_products:
  - Microsoft Windows Server iSCSI Target Server (File and Storage Services role)
  entity_keys: []
  new_entities:
  - key: tool:scuzzy
    type: tool
    name: scuzzy.py
    aliases: []
    summary: SpecterOps author's public Python tool that iterates candidate initiator IQNs against a Windows iSCSI Target Server to recover the target IQN, tests whether CHAP is required and lists and downloads files from the exposed virtual disk (SpecterOps, 2026-11-04).
  relation_suggestions: []
  verification: SINGLE-SOURCE-OTHER
  sourcing_note: Original research by the discoverer, demonstrated in a lab; the post credits Himanshu Dwivedi (Black Hat 2005) and Andrew Tierney (Pen Test Partners) for earlier work on unauthenticated iSCSI. No vendor statement; no CVE or patch exists because the behaviour is the default when CHAP is not configured.
  confidence: HIGH
  suggested_classification: B2
  novelty: new
  evidence:
  - quote: In my experience, there’s no rate limiting or brute-force protection on the service.
    attribution: SpecterOps (Garrett Foster)
    source_url: https://specterops.io/blog/2026/11/04/unauthenticated-iscsi-target-server/
  - quote: We queried our BloodHound Enterprise (BHE) customer tenants and found about 50% had at least one computer with the SPN, with the maximum number being close to 700.
    attribution: SpecterOps (Garrett Foster)
    source_url: https://specterops.io/blog/2026/11/04/unauthenticated-iscsi-target-server/
  - quote: Enable CHAP authentication for Windows iSCSI
    attribution: SpecterOps (Garrett Foster)
    source_url: https://specterops.io/blog/2026/11/04/unauthenticated-iscsi-target-server/
  - quote: It’s important to note that if BitLocker or a similar solution was used to encrypt the drive, this obviously becomes invalid.
    attribution: SpecterOps (Garrett Foster)
    source_url: https://specterops.io/blog/2026/11/04/unauthenticated-iscsi-target-server/
  extended_notes: 'Exposure: any Windows Server with the iSCSI Target Server role and no CHAP on its targets that is reachable from a host an attacker controls; the AD view is an LDAP query for the SPN the role registers, which is also the defender''s inventory query. Detection: network telemetry for iSCSI Discovery sessions and logins from hosts that are not on a target''s access list, and many Discovery attempts with different initiator names from one source; host side, unexpected access to the VHDX files that back a target. The source names no Windows event ids and none are claimed here. Hardening (SpecterOps): enable CHAP, use IPsec against sniffing, and above all segment the storage network and restrict the target host with host firewall rules; encrypting the volume (BitLocker or similar) defeats the offline read. Defender takeaway: inventory iSCSI target servers through the SPN, confirm CHAP on every target, and keep storage traffic off user and server access VLANs.'
- title: 'Sophos root-cause analysis INC-2026-002: a fake job-interview repository''s VS Code workspace settings ran BeaverTail and InvisibleFerret on a Mac whose EDR agent had silently stopped, and a third-party OAuth authorization outlived the session revocation'
  sources:
  - url: https://www.sophos.com/en-us/blog/fake-coding-test-reaches-security-company
    publisher: Sophos
    date: '2026-11-04'
    role: primary
  - url: https://www.sophos.com/en-us/trust/root-cause-analyses/inc-2026-002
    publisher: Sophos (root-cause analysis INC-2026-002; page undated, incident closed 2026-09-24)
    date: '2026-09-24'
    role: primary
  discovery_trace: 'first seen at: vendor-blog sweep, Sophos feed https://www.sophos.com/en-us/blog/feed?id=blt6f15f4f7deaf4242 (fetched with `feed`, item dated 2026-11-04 ''What happens when a fake coding test reaches a security company?'') -> primary: Sophos blog, URL https://www.sophos.com/en-us/blog/fake-coding-test-reaches-security-company (fetched with `extract`) -> primary: Sophos RCA INC-2026-002, URL https://www.sophos.com/en-us/trust/root-cause-analyses/inc-2026-002 (linked from the blog; fetched with `extract`)'
  summary: Sophos discloses, as the victim, that on 14 September 2026 an employee cloned a public repository presented as a job-interview coding assignment and opened it as a Visual Studio Code workspace; a weaponized workspace settings file replaced the editor's integrated terminal profile, so when a terminal opened it silently downloaded and ran a multi-stage payload, which SophosLabs identified as the BeaverTail loader and the in-memory InvisibleFerret backdoor (browser-credential, keychain, SSH-key and wallet theft). The Sophos Endpoint agent on the Mac had stopped working on 11 June and was not reporting, so the chain was not blocked although the first dropped file and the delivery domain were already detected; an industry partner's tip through an intelligence-sharing channel on 15 September was the detection. The backdoor ran in memory for about 26 hours until a reboot, with no persistence found; five minutes after execution the user granted VS Code Full Disk Access, which gave the
    malicious child processes broad file access. After sessions were revoked and the password reset, a third-party application (OAuth) authorization linked to the employee's source-code-platform account made 27 read requests against two internal repositories from an unfamiliar address until it was revoked on 16 September. Browser identity telemetry had recorded the corporate password being typed into a public code platform's sign-in page on 10 and 11 September. A fleet review then found other devices that passed identity and device-management compliance but were not reporting to the console; Sophos says correlating identity sign-ins with endpoint telemetry closed that gap, and its CTU says the VS Code technique matches NICKEL ALLEY (Contagious Interview) tradecraft, not necessarily the malware used against Binance.
  region_nexus: global; the technique targets developers and administrators in any sector
  primary_sector_nexus: 'indirect: no public-sector victim; developer and IT-admin endpoints in government hold the same reach (repositories, build systems, production credentials)'
  sector: technology
  cves: []
  techniques:
  - T1204.002
  - T1059.004
  - T1105
  - T1555.003
  - T1550.001
  - T1213.003
