  new_entities:
  - key: incident:sophos-inc-2026-002-developer-job-lure-2026-09
    type: incident
    name: Sophos INC-2026-002 developer job-lure compromise (September 2026)
    aliases:
    - INC-2026-002
    summary: Contagious Interview-style job-lure repository run as a VS Code workspace on a Sophos employee's Mac on 2026-09-14; BeaverTail and InvisibleFerret ran in memory for about 26 hours, the EDR agent had been silent since 2026-06-11, and an OAuth authorization read 27 times from internal repositories after session revocation (Sophos, 2026-11-04).
  relation_suggestions:
  - subject: incident:sophos-inc-2026-002-developer-job-lure-2026-09
    object: campaign:contagious-interview
    basis: 'Sophos CTU: the VS Code technique used against Sophos matches NICKEL ALLEY tradecraft, the cluster that runs Contagious Interview (Sophos, 2026-11-04); an overlap assessment'
