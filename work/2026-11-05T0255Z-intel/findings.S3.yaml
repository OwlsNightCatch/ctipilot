    summary: Notice of an order by the US Secretary of Homeland Security, published 2026-10-30 (91 FR 68528), excluding Acronis AG and affiliates from federal civilian procurement and requiring removal from civilian agency IT systems; Nextgov reports a 27 January removal deadline and Russian developer ties as the focus (Federal Register, Nextgov, 2026-10-30 to 2026-11-02).
  relation_suggestions: []
  verification: MULTI-SOURCE
  sourcing_note: The Federal Register notice is the US government's own primary for the order; the reasons, the 31 July signature date and the deadline come only from Nextgov's anonymous sources and were not confirmed in the notice text, which could not be read (CAPTCHA); the abstract and docket id were read through the API. Risky Bulletin of 2026-11-04 relays the story (discovery only).
  confidence: MEDIUM
  suggested_classification: B2
