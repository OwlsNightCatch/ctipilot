  summary: 'Germany''s BSI says several members of the Bundestag and other public figures have received an Apple threat notification since 29 October 2026, in which Apple reports a detected attack with mercenary spyware; the BSI does not know whether the notices mean actual compromise or only attempts and tells recipients to assume the device may be compromised. Digital Minister Wildberger confirmed the attack to ZDFheute and said the review was still running; Spiegel''s headline says the recipients include participants of the Chancellor''s Asia trip (the article is paywalled and only its headline and teaser were read). Apple told heise the notices went to users in 99 countries on 29 October, bringing its total to 150 countries, and The Record counts journalists among recipients; Apple names no actor, spyware or region. BSI''s guidance: update the operating system at once unless a forensic analysis is planned, keep Lockdown Mode on permanently (it makes new attacks harder but does not remove
    an existing infection), and where the risk is rated high replace the device, reset the accounts used on it and change the phone number. Further steps are a new passcode, new passwords for the Apple account and e-mail, 2FA with the new number as trusted number, re-enrolled authenticator apps, Signal registration lock, WhatsApp two-step verification and a check of linked devices; recipients are asked to report to the BSI service centre. The zero-click delivery BSI describes is the generic profile of mercenary spyware, not a finding about this round.'
  region_nexus: Germany (national government and parliament) within a 99-country Apple notification round; no Swiss recipient is reported, whether Swiss users received notices is not stated
