  borderline_reason: policy and supplier-risk lead rather than research or a technical finding, cross-domain with S2 (Swiss supplier); freshest primary is 2026-10-30 and Nextgov is 2026-11-02, so it is outside the 26 h window, but the store has no entry and the vendor is Swiss
  evidence:
