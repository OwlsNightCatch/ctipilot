    basis: SecurityWeek says Chainstack and WorkOS disclosed attacks that relied on ARTEX; Wiz found an ARTEX landing page on an address tied to an LLM resale operator and named by Zeabur (SecurityWeek 2026-11-04; Wiz 2026-10-30); the WorkOS bulletin itself says only 'AI-assisted offensive security framework'
  verification: MULTI-SOURCE
  sourcing_note: Two first-hand analyses (Wiz telemetry, Mandiant incident response) plus SecurityWeek's roll-up and a CSA synthesis; CSA's Lab Space page states its notes are produced by an automated research pipeline, so treat the CSA note as a collation of vendor disclosures, not as independent evidence. None of the sources shows a single actor, and Wiz states it cannot definitively tie the resale operators to the initial compromises or to the bulk key abuse. Overlaps the S4 item on the WorkOS and Chainstack notices; the unique content here is the Wiz key-abuse timeline, the rotation guidance and Mandiant's playbook.
  confidence: MEDIUM
  suggested_classification: B2
  novelty: new
  borderline: true
  borderline_reason: indirect nexus (no public-sector victim; cloud AI keys and third-party secret custody), the Mandiant post is dated 2026-11-02 (outside the 26 h window) and S4 already returns the WorkOS/Chainstack incident angle as an update on the ARTEX entry; consider folding these sources into that entry instead of a separate one
  evidence:
  - quote: Over the past month, at least a dozen AI developer platforms were hit, with the most recent incidents involving CommandCode, Northflank, Trigger.dev, Chainstack, and WorkOS.
    attribution: SecurityWeek
    source_url: https://www.securityweek.com/ai-linked-breaches-mount-as-workos-northflank-trigger-dev-disclose-hacks/
  - quote: They shared an identical first unauthorized activity, which happened within 30 minutes of the reported credential access within the vendor breach.
    attribution: Wiz
    source_url: https://www.wiz.io/blog/black-october-for-ai-developer-platforms
  - quote: Do the rotation at the issuing provider, because removing the secret from the platform does not revoke it
    attribution: Cloud Security Alliance AI Safety Initiative
    source_url: https://labs.cloudsecurityalliance.org/research/csa-research-note-inference-provider-platform-chain-campaign/
  - quote: Across multiple LLMJacking investigations, however, the dominant initial access vector has been exposed or stolen cloud identity tokens
    attribution: Google Threat Intelligence Group / Mandiant
    source_url: https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models/
  - quote: Defenders should prioritize detection of modifications to LLM accounts and services and treat any unauthorized enablement as a critical security event.
    attribution: Google Threat Intelligence Group / Mandiant
    source_url: https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models/
  extended_notes: 'Exposure: any organisation that stores AI provider, cloud or database credentials as environment variables on a PaaS, evaluation, gateway or developer-console platform, or whose cloud accounts allow enabling Bedrock, Gemini API or similar. Detection: cloud audit logs for first-time InvokeModel (or equivalent) calls from residential or VPN addresses, minimal single-token requests, quota and inference-profile enumeration followed by bulk calls, and above all unexpected enablement of LLM services or creation of new keys and service accounts (Mandiant''s rule categories are key creation, user creation, metadata-injected SSH keys); provider-side spend alerts set near expected consumption. Hardening: rotate at the issuing provider and not only on the platform, keep a per-platform and per-application key so a leak is traceable, apply spending caps and rate limits, prefer short-lived or workload-identity credentials, restrict inference profiles in key policies (in Wiz''s two cases
    the restricted key resisted the first reseller pool until the operator identified the permitted profile IDs), inject secrets at runtime from a secrets manager. Defender takeaway: build the inventory of which third-party platforms hold a copy of each production key; it is the scope of the next platform disclosure. Mandiant''s LiteLLM flaw is CVE-2026-40217 (/key/regenerate user-ID rebind); cves is left empty to avoid colliding with the existing LiteLLM entries.'
- title: 'ANNUAL REPORT — Elastic Security Labs ''threats, etc'' quarterly report, November 2026 (April to September 2026): 23 RMM-abuse findings, a 16-second paste-and-run to DLL sideload, 8 minutes from infostealer to login'
  sources:
