  discovery_trace: 'first seen at: heise-sec, feed https://www.heise.de/security/feed.xml (fetched with `feed`, item dated 2026-11-04 12:06 UTC ''Erstmals geknackt: Calif.io durchbricht iOS-Blockierungsmodus, überlebt Update'') -> heise article https://www.heise.de/news/Calif-io-iOS-Angriff-killt-Blockierungsmodus-bleibt-ueber-Update-persistent-11511374.html (fetched with `extract`); WebSearch ("Calif.io iOS Lockdown Mode bypass AirDrop PDF exploit persists iOS 27.2 update Stefan Esser") found no second source and no Calif.io write-up'
  summary: heise reports that the security team Calif.io, which includes the researcher Stefan Esser, showed in a video on X that it overcame Apple's Lockdown Mode on an iPhone running an iOS version before 27.2, with a PDF delivered over AirDrop starting the attack while Lockdown Mode was on. According to heise, the compromise also stayed in place after the device was updated to iOS 27.2, and the researchers say they used a not yet released OpenAI 'Cyber' model of the Astra series to build exploits in hours. Calif.io gave no technical details, no CVE and no patch information, and heise says it is unclear why Lockdown Mode did not help; Apple said in spring 2026 that devices in Lockdown Mode had never been hacked. The claim rests on a researcher video as described by one outlet and is unverified.
  region_nexus: global
  primary_sector_nexus: 'indirect: Lockdown Mode is the hardening advice for high-risk officials (BSI repeats it in the item above), so a bypass would matter to government staff'
