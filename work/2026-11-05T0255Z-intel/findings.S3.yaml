  extended_notes: 'Exposure: any user on an unpatched mobile browser stack who loads a compromised or cloned page or any page that loaded the Plerdy tracker between 27 August and 3 September 2026. Chain A was served to iOS 16.7 although Sekoia says it works from iOS 16.0 to 17.4; the DarkSword chain targets iOS 18.4 to 18.7 per GTIG (all its flaws fixed with iOS 26.3, most earlier); the Android chain is served to Chrome 139.0.0.0 to 145.0.0 except 143 and stops on one Samsung model (SM-S938B). Web owners: a tracker file served from an unchanged URL with changed bytes is the mechanism; Sekoia names no Swiss site. Detection: because nothing persists (Sekoia: a reboot ends the activity), endpoint forensics will find little; hunt in web-proxy, DNS and mobile-gateway logs for visits to the delivery and exfiltration hosts once CERT-shared indicators arrive, and for mobile browsers posting a large fingerprint JSON to a nonce-path API and, later, data to a non-standard HTTPS port; web teams should
    alert on content-hash changes of third-party scripts and look for a roughly 2.3 MB script appended to a page after window load. Triage: an analytics or SEO tracker legitimately issues extra requests; the discriminators are a late-loaded script padded with a minified AngularJS library, a fingerprint POST of several hundred fields to a nonce path, and a follow-up script returned only for plausible phone-sized touch devices. Defender takeaway: verify (not just require) current iOS, Android and Chrome versions on managed phones, put high-risk staff on Lockdown Mode where updates are not possible (GTIG''s advice for DarkSword), and treat third-party tags on government web properties as supply-chain exposure; national CERTs can ask Sekoia TDR for the withheld IOCs. Related, not the same operation: the DeadTag entry (Report URI, iVerify) shows DarkSword and Coruna served through expired tag domains by an unknown operator. Sekoia''s AndroSnitch resembles Google TAG''s 2024 AndroSnatch, which
    Sekoia calls too small to prove lineage.'
