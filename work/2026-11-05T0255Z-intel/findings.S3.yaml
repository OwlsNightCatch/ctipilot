  summary: 'Elastic Security Labs'' quarterly ''threats, etc'' report, drawn from confirmed customer intrusions and first-party research between April and September 2026, says attackers are shifting from malware to signed, trusted software. Elastic counts 23 confirmed remote-monitoring-and-management (RMM) abuse findings in the quarter, with ScreenConnect named most often, and in one confirmed healthcare finding the path from a paste-and-run lure to MSI delivery with DLL sideloading took roughly 16 seconds. It describes an AI-agent-driven attack with roughly 17,600 reconstructed actions compressed into four days, and says the average time from an infostealer infection to the actor logging in with the same credentials is eight minutes in some cases. On identity it says adversary-in-the-middle phishing kits and legacy authentication let attackers bypass MFA and use pre-authorised first-party applications to reach cloud and SaaS tenants. Elastic''s advice is behavioural: baseline user and entity
    behaviour, correlate across domains, and monitor system-level outcomes such as memory tampering and proxy tunnelling, since signatures miss signed software. Only the landing-page summary was read; the counts and examples are Elastic''s own telemetry and the details sit in the full report.'
