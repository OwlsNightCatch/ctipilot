  extended_notes: 'Exposure: iPhone users who received an Apple threat notification (lock screen, Settings, e-mail to the Apple Account address, banner on account.apple.com per BSI); the notice itself does not say whether the attack succeeded. Detection: Apple''s notice is the detection; BSI adds that victims usually notice nothing, and names unusual crashes and fast battery drain as soft signals; if forensics is wanted, BSI says do not update first. Hardening: Lockdown Mode kept on, immediate OS updates, new passcode, account password rotation, re-enrolling authenticators instead of transferring them, Signal registration lock, WhatsApp two-step verification, review of linked devices and of the Apple Account device list. Defender takeaway: Swiss federal, cantonal and communal security teams can reuse the BSI sequence as a runbook for officials who receive a notification, and should decide in advance who they report to (BSI asks recipients to write to its service centre; the Swiss equivalent
    was not searched). Caveat for the Lockdown Mode advice: a separate, unverified report (heise, 2026-11-04, borderline item in this return) says Calif.io demonstrated a Lockdown Mode bypass on iOS before 27.2; no technical write-up exists.'
- title: 'ANNUAL REPORT — Trellix CyberThreat Report November 2026 (April to September 2026): government the most broadly targeted sector, 14 of 22 ransomware campaigns with a known exploited flaw began at an edge device, defences disabled first'
  sources:
