      - { quote: "Die Untersuchung habe bestätigt, dass diese Schwachstelle beim vorliegenden Vorfall nicht ausgenutzt wurde.", attribution: "Inside IT", source_url: "https://www.inside-it.ch/provider-solnet-schildert-datenabfluss-20261104" }
