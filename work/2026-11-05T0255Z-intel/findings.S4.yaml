    summary: |
      Solnet, a Solothurn internet and solution provider, told Inside IT that an investigation found unauthorised access, through an unnamed vulnerability, to log files of its webmail service covering 13 to 31 October 2026. A forum seller offers a data set of about 6,800 entries on about 5,000 people, which the seller says holds customer data, transactions and failed logins; Solnet confirms that published sample data come from its webmail logs (email addresses, recipients, subject lines and connection data), says passwords appear only masked and none in clear text, and says it cannot confirm the seller's figures or who holds the data. The CEO states the incident was not an attack through the PHP2Shell flaw: Solnet patched its server on 2026-10-21, the day the flaw became known, and the investigation found it was not exploited here. Solnet learned of the listing through the federal cybersecurity office (BACS) and Switch-CERT, reported the incident to BACS, took the webmail server out of service, rebuilt it and had it externally tested; the webmail service has been back since 2 November and affected customers were informed on 2 November. Customers are advised to change their mail password and enable multi-factor authentication; no sign of account takeover. The vulnerable product or flaw class is not named.
