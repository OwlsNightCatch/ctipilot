      Exposure: customers of the Solnet webmail service, mail logs 13-31 Oct 2026. Detection: mail-account sign-in and forwarding-rule review for Solnet-hosted addresses; phishing that quotes real subjects or recipients. Defender takeaway: Swiss organisations with Solnet-hosted mail should rotate mail passwords and enable MFA as Solnet advises.

