    confidence: HIGH
    admiralty_suggestion: { reliability: A, credibility: 1 }
    evidence:
      - { quote: "Si l’EFS n’a pas été directement visé par cet incident de cybersécurité, des anomalies ont été signalées, entraînant une altération des paramètres de fonctionnement de chambres froides, équipées de la solution du prestataire de l’établissement.", attribution: "Etablissement francais du sang (EFS)", source_url: "https://presse.efs.sante.fr/actualites/l-efs-confirme-l-incident-de-cybersecurite-impactant-un-de-ces-prestataires-d-equipement-frigorifique-2c07c-08a0a.html" }
      - { quote: "Concrètement, des seuils de température et de dégivrage ont été portés à de très hautes températures.", attribution: "Etablissement francais du sang (EFS)", source_url: "https://presse.efs.sante.fr/actualites/l-efs-confirme-l-incident-de-cybersecurite-impactant-un-de-ces-prestataires-d-equipement-frigorifique-2c07c-08a0a.html" }
      - { quote: "Aucun impact sanitaire n’a été identifié et aucune perte de produits sanguins n’est à déclarer.", attribution: "Etablissement francais du sang (EFS)", source_url: "https://presse.efs.sante.fr/actualites/l-efs-confirme-l-incident-de-cybersecurite-impactant-un-de-ces-prestataires-d-equipement-frigorifique-2c07c-08a0a.html" }
      - { quote: "The vulnerability currently being reported in the media relates to a component from a third-party supplier and was outside Coolworld’s direct control.", attribution: "Coolworld Rentals", source_url: "https://www.coolworld-rentals.com/news/cybersecurity-update" }
      - { quote: "Coolworld is aware of the cybersecurity incident involving remote monitoring software used in refrigeration systems early November 2026.", attribution: "Coolworld Rentals", source_url: "https://www.coolworld-rentals.com/news/cybersecurity-update" }
      - { quote: "Unter anderem soll es im Pharmahandel Versuche gegeben haben, Kühlgeräte entsprechend zu manipulieren.", attribution: "heise online", source_url: "https://www.heise.de/news/Nach-Gefriertruhen-Attacken-Jetzt-Blutbank-Kuehlung-im-Visier-11511444.html" }
      - { quote: "In der Schweiz sind noch keine Cyberangriffe auf Kühlsysteme in Supermärkten bekannt.", attribution: "SRF", source_url: "https://www.srf.ch/news/international/hintergruende-unklar-hackerangriff-auf-kuehlsysteme-blutbanken-in-frankreich-betroffen" }
    extended_notes: |
      Exposure (source-supported): operators whose cold rooms are supervised or controlled through a supplier's remote-monitoring platform, above all blood, plasma, pharmacy and pharma-logistics stores; EFS says its own monitoring and alarm systems caught the change, a standby technician noticed the overnight rise (heise). How to tell: ask the refrigeration maintenance contractor which remote-monitoring software supervises the cold rooms and whether its management interface is reachable from the internet; neither EFS nor Coolworld names the product.
      Detection (telemetry class first): remote-monitoring and controller audit logs for setpoint or defrost-threshold changes outside maintenance windows; an alarm path independent of the controller (separate loggers) is what saved the product at EFS.
      Triage / benign lookalike: legitimate defrost cycles and technician setpoint changes exist; the discriminators in the sources are extreme values (110 degrees against about minus 30 working temperature, per SRF/heise), the overnight timing, and several sites changing at once.
      Defender takeaway: Swiss hospital, blood-donation and pharmacy cold-chain owners should confirm with their refrigeration suppliers that remote-monitoring access is not internet-exposed and that an independent alarm path exists. The entry's current statement that the blood-service case rests on Le Canard enchaine alone is superseded; the entry also lists only retail as sector.
      Caveat for the composer: EFS and Coolworld do not name each other; the EFS-Coolworld link is made by BleepingComputer, heise and SRF.

