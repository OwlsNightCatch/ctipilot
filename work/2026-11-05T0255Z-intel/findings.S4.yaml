    discovery_trace: "first seen at: bleepingcomputer, URL https://www.bleepingcomputer.com/news/security/cyberattack-disrupts-blood-storage-refrigeration-systems-in-france/ (feed https://www.bleepingcomputer.com/feed/) and heise-sec, URL https://www.heise.de/news/Nach-Gefriertruhen-Attacken-Jetzt-Blutbank-Kuehlung-im-Visier-11511444.html (feed https://www.heise.de/security/feed.xml) -> primary: EFS press statement URL https://presse.efs.sante.fr/actualites/l-efs-confirme-l-incident-de-cybersecurite-impactant-un-de-ces-prestataires-d-equipement-frigorifique-2c07c-08a0a.html (linked from the BleepingComputer article; the http:// link had to be re-fetched over https) -> primary: Coolworld statement URL https://www.coolworld-rentals.com/news/cybersecurity-update -> corroboration: SRF URL https://www.srf.ch/news/international/hintergruende-unklar-hackerangriff-auf-kuehlsysteme-blutbanken-in-frankreich-betroffen (found via the srf-news feed https://www.srf.ch/news/bnf/rss/1646)"
    summary: |
      The entry already carried Le Canard enchaine's report that cold rooms of a contractor of the French blood service were set to 110 degrees overnight on 1 to 2 November; that case is now victim-confirmed. The Etablissement francais du sang (EFS) said on 2026-11-03 that a refrigeration-equipment supplier suffered a cybersecurity incident on 2026-11-02, that the supervision and control installations of cold rooms at three EFS sites were affected, and that temperature and defrost thresholds were raised to very high values. EFS says it was not directly targeted, that its monitoring and alarm systems caught the change quickly, that plasma bags for transfusion and for drug fractionation were moved or secured, that no health impact or product loss is reported, and that it is working with ANSSI and the Ministry of Health. EFS does not name the supplier or the product. Coolworld Rentals, a European refrigeration-rental company, published a statement on 2026-11-04 acknowledging an incident involving remote monitoring software used in its refrigeration systems in early November, saying the vulnerability reported in the media is in a third-party supplier's component outside its direct control and that only a limited number of its units were affected; it does not name EFS, a product or the component. BleepingComputer, heise and SRF connect Coolworld to EFS (SRF and heise say reportedly, via the supplier's remote maintenance; heise credits Le Canard enchaine for the 110 degree setpoint and the Bourgogne-Franche-Comte region). heise adds, without naming a source, that attempts were also reported against cooling equipment in the pharmaceutical trade, and that BSI had already told operators of networked freezer controllers to disconnect them from the internet or secure and patch them. SRF notes that no attacks on supermarket cooling in Switzerland are known. No source in this set ties the blood-service incident to Danfoss, Copeland or Dixell controllers; the link to the entry is the same technique (remote setpoint and defrost manipulation) and the same remote-monitoring layer, not an identified product.
    region_nexus: "France (EFS); Europe-wide wave; Switzerland: no case known (SRF), same remote-monitoring pattern could reach Swiss cold-chain operators"
    primary_sector_nexus: "direct analogue: Swiss emergency-medical and hospital cold chain (blood, plasma, pharmacy), national blood-donation service"
    sector: "healthcare"
    cves: []
    techniques: [T1190, T1199]
    technique_basis: "T1190: Coolworld says a vulnerability in a third-party component of its remote-monitoring software was used; T1199: SRF/heise say the attackers came in through the supplier's remote maintenance (reportedly)."
    affected_products: []
