    attribution: CSIRT Italia (ACN), bulletin BL02/261104/CSIRT-ITA
    source_url: https://www.acn.gov.it/portale/w/sicurezza-dei-sistemi-a-supporto-della-catena-del-freddo-e-interfacce-di-management-di-sistemi-connessi-richiamo-urgente-alle-misure-di-verifica-e-mitigazione
  - quote: In Switzerland, no cyberattacks on cooling systems in supermarkets are known yet. (translated from German)
    original: In der Schweiz sind noch keine Cyberangriffe auf Kühlsysteme in Supermärkten bekannt.
    attribution: SRF
