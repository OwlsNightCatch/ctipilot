  - T1528
  techniques_note: 'T1566.002: lure message with a link to a fake portal; T1528: device-code flow yields OAuth tokens for the victim''s Microsoft 365 account (the
    notice describes the fraudulent account access).'
  affected_products:
  - Microsoft 365
