  summary: Inside IT reports that the ransomware group Emperador claimed at the end of October an attack on the Swiss building-materials group Holcim and says it
    holds about 360 GB, threatening publication; Holcim told Inside IT that it found 'limited, unauthorised access' to data and that data also left. Holcim says the
