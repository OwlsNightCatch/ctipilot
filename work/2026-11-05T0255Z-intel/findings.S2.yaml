    original: Wenn weitere Sperren verhängt werden wollen, müsste der Bundesgesetzgeber eine gesetzliche Grundlage dafür schaffen
    attribution: SRF
    source_url: https://www.srf.ch/news/schweiz/keine-gesetzliche-grundlage-was-das-bundesgerichtsurteil-zum-stopp-von-netzsperren-bedeutet
