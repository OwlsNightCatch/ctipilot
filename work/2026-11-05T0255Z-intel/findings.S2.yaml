- title: 'Swiss Federal Supreme Court: prosecutors have no legal basis to order providers to block fraud websites; ISP and DNS blocking stays limited to gambling
    and child-abuse material until Parliament legislates'
  sources:
  - url: https://www.netzwoche.ch/news/2026-11-04/bundesgericht-urteilt-gegen-netzsperren-ohne-sonderregelung
    publisher: Netzwoche (relaying the Federal Supreme Court's media release)
    date: '2026-11-04'
    role: primary
  - url: https://www.srf.ch/news/schweiz/keine-gesetzliche-grundlage-was-das-bundesgerichtsurteil-zum-stopp-von-netzsperren-bedeutet
    publisher: SRF
    date: '2026-11-04'
    role: corroborating
  discovery_trace: 'first seen at: inside-it-ch RSS, URL https://www.inside-it.ch/rss.xml (title ''Netzsperren: Init7 siegt vor Bundesgericht'') -> pivot: netzwoche
    RSS, URL https://www.netzwoche.ch/rss.xml -> article, URL https://www.netzwoche.ch/news/2026-11-04/bundesgericht-urteilt-gegen-netzsperren-ohne-sonderregelung
    -> pivot: srf-news RSS article, URL https://www.srf.ch/news/schweiz/keine-gesetzliche-grundlage-was-das-bundesgerichtsurteil-zum-stopp-von-netzsperren-bedeutet.
    The Federal Supreme Court''s own media release was not located (WebSearch "bger.ch Medienmitteilung Bundesgericht Netzsperre Sicherungseinziehung Beschlagnahme
    Art. 263 StPO Art. 69 StGB Init7 Urteil 1B" found only press relays).'
  summary: 'The Federal Supreme Court upheld the appeal of the Swiss provider Init7 against a blocking order of the Vaud prosecutor''s office issued in an investment-fraud
    investigation (SRF: more than CHF 1.7 million lost) and held, in a ruling published on 2026-11-04, that the criminal-procedure seizure rules (art. 263 CrimPC
    with art. 69 Criminal Code) are not a sufficient legal basis for ordering a website or DNS block. Under current law, blocks are admissible only under the special
    regimes for prohibited gambling and prohibited pornography; the court says any other regime is for the federal legislature to create, specifying which offences,
    which authority and what provisional measures, and it cannot fill the gap itself. Netzwoche adds that the Federal Council''s draft revision of the Telecommunications
    Act, whose consultation closed in September 2026, would allow blocks on justified suspicion of fraud; the Federal Office of Communications (Bakom) told SRF an
    extension of blocking is currently not on the political agenda although Parliament sees a need for action. For cantonal prosecutors, police and the defenders
    of Swiss public bodies, prosecutor-ordered provider-level blocks of phishing or fraud domains are therefore not an available mitigation layer today.'
  region_nexus: Switzerland; Vaud and Valais prosecutors' blocking orders against Init7
  primary_sector_nexus: 'indirect: cantonal prosecution and police lose a criminal-procedure route to provider-level blocks; public-body defenders cannot rely on
    authority-ordered blocks of fraud or phishing domains'
  sector: public-sector
  cves: []
  techniques: []
  affected_products: []
  entity_keys: []
  new_entities: []
  relation_suggestions: []
  verification: MULTI-SOURCE
  confidence: HIGH
  novelty: new
  classification_suggestion:
    reliability: B
    credibility: '1'
    note: SRF and Netzwoche agree; the court's own media release was not retrieved
  borderline: true
  borderline_reason: 'Policy-watch item (law-enforcement action against threat infrastructure, in reverse): the ruling removes a tool from cantonal prosecutors but
    imposes no obligation on public-body defenders; lean keep only as a short policy note, drop if the main agent holds the obligation-change bar strictly.'
  evidence:
  - quote: the provisions on forfeiture for security and seizure do not constitute a sufficient basis for a block (translated from German)
    original: dass die Bestimmungen zur Sicherungseinziehung und Beschlagnahme keine ausreichende Grundlage für eine Sperre darstellen
    attribution: Netzwoche (relaying the Federal Supreme Court's media release)
