- title: National Council security committee files motion 26.4717 to put digital-dependency risk, including AI services, into federal procurement criteria for critical
    digital infrastructure
  sources:
  - url: https://www.inside-it.ch/bundesrat-soll-digitale-abhaengigkeiten-minimieren-20261104
    publisher: Inside IT
    date: '2026-11-04'
    role: corroborating
  - url: https://ws.parlament.ch/odata.svc/Business?$filter=Modified gt datetime'2026-11-02T00:00:00' and Language eq 'DE'&$orderby=Modified desc&$top=60&$format=json
    publisher: Swiss Parliament Curia Vista (OData service), business 26.4717
    date: '2026-11-04'
    role: primary
  discovery_trace: 'first seen at: inside-it-ch RSS, URL https://www.inside-it.ch/rss.xml (title ''Bundesrat soll digitale Abhängigkeiten minimieren'') -> article,
    URL https://www.inside-it.ch/bundesrat-soll-digitale-abhaengigkeiten-minimieren-20261104 -> pivot: parlament-ch-curia-vista-odata, URL https://ws.parlament.ch/odata.svc/Business?$filter=Modified
    gt datetime''2026-11-02T00:00:00'' and Language eq ''DE''&$orderby=Modified desc&$top=60&$format=json (record 20264717, submitted 2026-11-03, status ''Eingereicht'').'
  summary: 'The Security Policy Committee of the National Council (SiK-N) decided by 16 to 5 votes with 2 abstentions to submit motion 26.4717 ''Digitale Abhängigkeiten.
    Kontinuität kritischer Staatsaufgaben sichern''; the Parliament database lists it as submitted on 2026-11-03 with the Federal Council''s response still open.
    The motion instructs the Federal Council to take operational measures so that public procurement affecting critical digital infrastructure within the meaning
    of art. 5 of the Information Security Act (ISG), or the continuity of core state tasks, including the AI services and models used, systematically weighs technological,
    operational and legal dependency risks in the award criteria; dependencies are to be documented as a strategic vulnerability, risk-mitigated, re-evaluated and
    approved by the Federal Council, with periodic reporting to the committees, and reversibility (return of data in a processable format) is to be demonstrable.
    The committee cites the temporary June 2026 block of access to Anthropic''s most advanced models on US-government order as its example. This is a committee motion
    at the filing stage: it creates no obligation for federal, cantonal or communal bodies and the Federal Council has not answered.'
  region_nexus: Switzerland, federal level
  primary_sector_nexus: direct for federal procurement of critical digital infrastructure; cantons and communes are not bound
