- title: 'Eye-Able, German accessibility-widget vendor: unauthorised access to the customer dashboard on 2026-10-27 may have exposed customer e-mail addresses and
    account data; Swiss customers possibly affected'
  sources:
  - url: https://www.lsb-bremen.de/information-zu-einem-sicherheitsvorfall-im-eye-able-dashboard/
    publisher: Landessportbund Bremen (reproducing the vendor's customer notice)
    date: '2026-11-04'
    role: primary
  - url: https://www.inside-it.ch/unbefugte-zugriffe-auf-kundendaten-bei-eye-able-20261104
    publisher: Inside IT
