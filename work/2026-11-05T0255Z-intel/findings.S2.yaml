  summary: 'New facts of 2026-11-03/04 on the refrigeration-controller campaign. (1) EU level: ENISA, the European Commission (DG CNECT), Europol''s EC3, the EU CSIRTs
    Network and EU-CyCLONe issued a joint statement on 2026-11-04 saying that since 11 October 2026 several commercial refrigeration systems and similar devices have
    been hit in a number of EU Member States, that a new wave occurred on 1-2 November, and advising organisations to take immediate action to mitigate exposure in
    the affected systems; it points to ENISA''s CSIRTs-network advisory collection CNW-2026-05 (dated 2026-11-03, keywords refrigeration systems and retail sector),
    which lists CVE-2025-41450, CVE-2025-41451 and CVE-2025-41452 and refers to member-CSIRT advisories. (2) Healthcare cold chain: franceinfo (2026-11-04) reports
    that in the night of Sunday to Monday (1 to 2 November) attackers took control of the system of a service provider of the Etablissement francais du sang (EFS);
    in three regions, freezers set to -30 C received a defrost order, the attack was neutralised on two sites and on the third the plasma bags were moved to other
    freezers as a precaution, and the EFS says no product was lost. The EFS president says it was ''not data theft, not the compromise of an information system''
    but an attack on ''something very physical''; the provider, Coolworld, says only a limited number of its units was touched; the health ministry says investigations
    continue to understand the modus operandi. heise adds that the EFS confirmed the attempt in a statement of 3 November and that the German BSI knows of cases at
    individual supermarkets; SRF reports that the attackers entered through the remote maintenance of the external provider Coolworld. No source names the controller
    product or the access method at Coolworld, and IT-Connect cautions that nothing allows asserting that Coolworld''s equipment is among the models in CERT-FR''s
    alert or that the authors are the same. (3) CSIRT Italia (ACN) bulletin BL02/261104/CSIRT-ITA of 2026-11-04 extends its urgent call for cold-chain hardening to
    every organisation using cold-chain technology, whatever its sector, and to all users of industrial remote-control tools, with removal of direct internet exposure
    of administration and control interfaces, verification of operating parameters and alarm function, credential and account review, OT/IT segregation and protection
    of remote-maintenance paths as the stated priorities. (4) Swiss position: SRF states on 2026-11-04 that no cyberattacks on supermarket cooling systems are yet
    known in Switzerland.'
  region_nexus: europe-wide campaign; Switzerland not yet reported as hit (SRF 2026-11-04); Swiss blood-donation services, hospitals and pharma logistics use remotely
    maintained refrigeration (no Swiss incident reported)
  primary_sector_nexus: 'indirect: healthcare cold chain (blood plasma) is the first public-sector-adjacent target; emergency medical services and cantonal hospitals
