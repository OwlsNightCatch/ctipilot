  extended_notes: 'Report text (pdf transport, words split by the extractor): ''Meldungen können in diesem Fall alternativ per Telefon oder bundes-externen E-Mail
    eingereicht werden'' and ''Über diese können Meldungen eingereicht werden, die anschliessend manuell im CSH erfasst werden''. Defender takeaway candidate: operators
    subject to the 24-hour duty should have the BACS phone and e-mail reporting route in the on-call runbook, because the primary route (CSH behind the federal login)
