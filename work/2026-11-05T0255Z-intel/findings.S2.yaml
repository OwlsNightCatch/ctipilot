  discovery_trace: 'first seen at: inside-it-ch RSS, URL https://www.inside-it.ch/rss.xml -> article (extract returned the page with the body in its embedded JSON),
    URL https://www.inside-it.ch/unbefugte-zugriffe-auf-kundendaten-bei-eye-able-20261104 -> WebSearch ("\"Eye-Able\" Sicherheitsvorfall Kunden E-Mail Angriff 27.
    Oktober Behörden Websites Barrierefreiheit Plugin") -> primary: customer notice text reproduced by Landessportbund Bremen, URL https://www.lsb-bremen.de/information-zu-einem-sicherheitsvorfall-im-eye-able-dashboard/'
  summary: 'Eye-Able (Web Inclusion GmbH), a German provider of website-accessibility tooling, told customers by e-mail that it detected on the late afternoon of
    2026-10-27 that unauthorised third parties had temporarily gained access to parts of its Eye-Able Dashboard and could reach certain customer and user data: e-mail
    addresses, user-account information, company names and other information stored on the platform. The vendor says it stopped the attack the same day, that attempts
    to delete data, change user passwords or upload files failed, that it saw no further access after the morning of 2026-10-28, and that it has engaged external
    forensic experts and informed the data-protection authority; the access method and the data actually viewed are not stated. Customers are advised to change their
    dashboard password (and any reuse elsewhere), to ignore an unrequested password-reset e-mail received on 2026-10-27, and to treat unexpected e-mails and requests
    for credentials or payments with care. Inside IT names Swiss customers Procap Switzerland and Swiss Tennis (Roche is listed by the vendor as a customer) and says
    Swiss customers may be affected; no Swiss public body is named by either source.'
  region_nexus: Germany-based vendor; Swiss customers possible (Inside IT)
  primary_sector_nexus: 'indirect: accessibility tooling is widely used on public-administration websites, but no Swiss public body is named as an Eye-Able customer
