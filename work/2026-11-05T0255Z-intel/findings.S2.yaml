  - quote: The EFS, which reports to the health ministry, confirmed that such an attempt had taken place in a statement of 3 November. (translated from German)
    original: Dass es einen derartigen Versuch gegeben habe, bestätigte das dem Gesundheitsministerium unterstellte EFS in einer Mitteilung vom 3. November.
    attribution: heise online
    source_url: https://www.heise.de/news/Nach-Gefriertruhen-Attacken-Jetzt-Blutbank-Kuehlung-im-Visier-11511444.html
  extended_notes: 'Already in the store: the 2026-11-04 record on this entry relays Le Canard enchaine''s report that cold rooms of a blood-service contractor were
    set to 110 degrees; the new material is the EFS''s own confirmation and account (three regions, two sites neutralised, plasma moved, nothing lost), the Coolworld
    name, the EU joint statement and the ACN bulletin. Exposure: any organisation with refrigeration or cold-chain controllers (hospital pharmacies, blood and plasma
    stores, vaccine and drug cold rooms, kitchens, municipal and cantonal facilities) that are internet-reachable or serviced through a contractor''s remote-maintenance
    platform; the contractor''s platform is the shared point (the EFS contractor, Sabcobel in Belgium and the CAP supermarket maintenance firm per the existing entry).
    Detection (stated by sources): the EFS case was caught by the temperature alarms and an on-call technician; ACN names alteration of displayed data and disabled
    alarms as the way detection is delayed, so alarm thresholds and notification routes belong in the integrity check; review controller setpoint, defrost-schedule
    and alarm-threshold change history and the contractor-platform access logs. Defender takeaway candidate: inventory remotely managed refrigeration controllers
    including contractor-managed ones, remove direct internet exposure of administration interfaces, check that the alarm path does not depend on the remotely configurable
    controller (derived from the EFS and ACN statements). Swiss angle: SRF says no Swiss supermarket attack is known; the Swiss blood-donation services and cantonal
    hospitals are not named by any source. Also in the sources: CRA reporting duty since 2026-09-11 and CRA main requirements from 2027-12-11 (ENISA text; the store
    already carries the CRA reporting entry 2026-08-29/eu-cra-reporting-obligation-ncsc-fi-checklist).'
  references:
  - 2026-08-29/eu-cra-reporting-obligation-ncsc-fi-checklist
- title: Canton Vaud warns of a Microsoft 365 device-code phishing campaign running in French-speaking Switzerland, with several organisations already affected
  sources:
  - url: https://www.vd.ch/actualites/actualite/news/26768-campagne-de-phishing-ciblant-les-comptes-microsoft-365
    publisher: Etat de Vaud (cantonal cybersecurity notice)
    date: '2026-11-04'
    role: primary
  discovery_trace: 'first seen at: vaud cybersecurity listing (candidate record vaud-soc-cyber-threat-review recipe), URL https://www.vd.ch/cybersecurite (extract)
    -> primary (no pivot needed): https://www.vd.ch/actualites/actualite/news/26768-campagne-de-phishing-ciblant-les-comptes-microsoft-365. Corroboration attempts:
    WebSearch ("Device Code Phishing Microsoft 365 Suisse romande campagne hameçonnage organisations touchées workers.dev"), WebSearch ("Vaud phishing Microsoft 365
    Device Code campagne Suisse romande organisations touchées novembre 2026"), WebSearch ("hameçonnage Device Code Microsoft 365 Suisse romande canton alerte portail
    cloud-storage workers.dev"), WebSearch ("Phishing Device-Code Microsoft 365 Westschweiz Kanton Waadt Warnung Organisationen betroffen"): no Swiss corroboration
    or press relay found.'
  summary: The canton of Vaud's cybersecurity notice of 2026-11-04 says a phishing campaign is currently running in French-speaking Switzerland and that several organisations
    have already been affected. The messages can appear to come from a company or a known contact and invite the recipient to view an invoice, open a document or
    verify information by clicking a link; the notice says the campaign uses device-code phishing, which makes the user type a code into a legitimate Microsoft authentication
    page and thereby gives the attackers fraudulent access to the user's Microsoft 365 account. The malicious links observed follow a pattern of lure pages on Cloudflare
    Workers (workers.dev) subdomains whose names combine a company-style label with a portal and cloud-storage wording; the notice says other addresses can also be
    used. The notice gives users only behavioural advice (do not enter a Microsoft sign-in code at a third party's request, verify unexpected requests through another
    channel, report suspicious messages to IT support, and contact IT support immediately after having entered a code or approved an authentication request); it names
    no actor, kit, victim, number of affected organisations or sector, and no tenant-side hardening. The cantonal notice is the only source found; the technique is
    already documented in the store (FBI-reported Kali365 phishing-as-a-service and the Railway device-code campaign).
  region_nexus: Switzerland, French-speaking cantons (Romandie); issued by the canton of Vaud
  primary_sector_nexus: 'direct: warning from a cantonal administration to organisations in its region; the notice names no sector'
  sector: cross-sector
  cves: []
  techniques:
