    und Ressourcen für den Meldebetrieb'') -> pivot: efk-ch (candidate), URL https://www.efk.admin.ch/ -> primary: https://www.efk.admin.ch/prufung/infrastruktur-und-ressourcen-fuer-den-meldebetrieb/
    -> pivot (report PDF linked from the audit page, read with pdf): https://www.efk.admin.ch/wp-content/uploads/publikationen/berichte/wirtschaft_und_verwaltung/informatikprojekte/26182/26182be-bacs-meldebetrieb.pdf'
  summary: 'The Swiss Federal Audit Office (EFK) published on 2026-11-04 its audit EFK-26182 of the infrastructure and staffing behind the mandatory cyber-incident
    reporting at the Federal Office for Cybersecurity (BACS); the report version including the BACS statement is dated 2026-05-29. It concludes that the Cyber Security
    Hub (CSH), the platform used for the 24-hour reporting duty that has applied to critical-infrastructure operators since 2025-04-01 (legal basis art. 74 para.
    2 and art. 74f ISG per the report), enables efficient processing and that staffing is sufficient: 222 reports in the first year (April to December 2025), an average
    processing time under one hour, 12 incident-response staff and about 5,300 registered CSH users. Findings relevant to reporting operators: after several outages
    in 2025 BACS migrated the CSH to a new service provider and a definitive resilience assessment is not yet possible; identity and access management, run through
    the federal login service eIAM, remains a potential single point of failure with plans to add further identity providers; there is currently no specific emergency
    concept for an eIAM outage; and if the platform or eIAM is down, reports can be submitted by telephone or by e-mail from outside the federal network and are then
    entered manually into the CSH. The CSH has been classified as critical for business continuity management, a concept is being drafted, and BACS agrees with the
    report.'
