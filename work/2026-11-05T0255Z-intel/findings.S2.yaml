  evidence:
  - quote: A phishing campaign is currently running in French-speaking Switzerland. Several organisations have already been affected. (translated from French)
    original: Une campagne de hameçonnage (phishing) est actuellement en cours en Suisse romande. Plusieurs organisations ont déjà été touchées.
    attribution: Etat de Vaud (cantonal cybersecurity notice)
    source_url: https://www.vd.ch/actualites/actualite/news/26768-campagne-de-phishing-ciblant-les-comptes-microsoft-365
  - quote: It consists of making you enter a code on a legitimate Microsoft authentication page. (translated from French)
    original: Elle consiste à vous faire saisir un code sur une page d'authentification Microsoft légitime.
    attribution: Etat de Vaud (cantonal cybersecurity notice)
    source_url: https://www.vd.ch/actualites/actualite/news/26768-campagne-de-phishing-ciblant-les-comptes-microsoft-365
  - quote: If you have already entered a code or approved an authentication request, contact your IT support immediately. (translated from French)
    original: Si vous avez déjà saisi un code ou validé une demande d'authentification, contactez immédiatement votre support informatique.
    attribution: Etat de Vaud (cantonal cybersecurity notice)
    source_url: https://www.vd.ch/actualites/actualite/news/26768-campagne-de-phishing-ciblant-les-comptes-microsoft-365
  extended_notes: 'Exposure: any Microsoft 365 tenant that still permits the OAuth device-code flow for users who do not need it; the cantonal notice does not say
    which tenants or how many organisations are affected. Detection concept (technique-level; the Vaud notice itself states none): sign-in logs showing the device-code
    authentication flow for users with no input-constrained device, followed by token use from an unfamiliar network or a new session within minutes; user reports
    of an unsolicited Microsoft code prompt. The store''s existing device-code entries carry the Conditional Access lever (restricting the device-code flow) and detection
    detail: 2026-05-23/fbi-psa260521-kali365-oauth-device-code-phaas-bypasses-m365, 2026-07-10/m365-conditional-access-gaps-railway-lshiy-campaigns, 2026-07-10/helix-data-extortion-devicecode-vishing-sharepoint-exfil.
    Post-compromise check after a user entered a code: revoke the user''s refresh tokens and sessions, review mailbox rules and registered authentication methods
    and devices (stated by those existing entries, not by the Vaud notice). Triage: a device-code sign-in is benign where users really pair TVs, conference-room systems
    or CLI tools; the discriminator is a user with no such device whose code entry follows a mailed link.'
  references:
