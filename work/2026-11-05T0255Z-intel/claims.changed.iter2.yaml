    entry: 2026-10-31/cve-2026-98432-linux-kernel-tcp-uaf-mptcp-remote-root
    surface: "body"
    kind: cited
    text: "XCP-ng released a kernel fix that needs a reboot ("
    urls: ["https://xcp-ng.org/blog/2026/11/04/november-2026-security-updates-2-for-xcp-ng-8-3-lts/", "https://docs.vates.tech/security-advisories/advisories/2026/vates-sa-2026-056"]
  - claim_id: be558a1607
    entry: 2026-10-31/cve-2026-98432-linux-kernel-tcp-uaf-mptcp-remote-root
    surface: "body"
    kind: cited
    text: "**Exposure:** a Linux host on a kernel below the fixed builds that accepts IPv4 TCP connections from an attacker; the demonstrated exploit needs an MPTCP listener, which `sysctl net.mptcp.enabled` shows as possible when it returns 1 and which every Go program listening on Linux has been since Go 1.24 ("
    urls: ["https://kb.ciq.com/article/security-advisories/cve-2026-98432-mitigation", "https://groups.google.com/g/golang-announce/c/PCoQcdxoScw/m/aD-MgXEvAAAJ"]
  - claim_id: 8a341f17ff
    entry: 2026-10-31/cve-2026-98432-linux-kernel-tcp-uaf-mptcp-remote-root
    surface: "body"
    kind: cited
    text: "), but CIQ's testing found that setting it to 0 leaves the plain-TCP path reachable, and Akamai reports a similar flaw when request-socket migration is enabled, through net.ipv4.tcp_migrate_req or a BPF reuseport migration program ("
    urls: ["https://www.akamai.com/blog/security-research/2026/nov/cve-2026-98432-remote-uaf-linux-kernels-tcp-stack"]
  - claim_id: 3955a95acc
