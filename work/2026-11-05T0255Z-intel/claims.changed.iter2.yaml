  - claim_id: bdab98d77d
    entry: 2026-11-05/apt29-watering-hole-ios-android-n-day-chains-kev
    surface: "body"
    kind: cited
    text: "**Detection:** Sekoia names one on-device trace, a marker cookie that the iOS 16.7 chain's script sets as a replay guard so the exploit does not fire twice on a victim; it publishes some indicators and withholds several delivery and exfiltration hosts, so a visit to an injected site shows in web proxy and DNS telemetry from managed phones only against indicators obtained from Sekoia or a national CERT; the dependable check is the OS and Chrome version inventory ("
    urls: ["https://www.sekoia.com/blog/poisoned-source-apt29-watering-holes-targets-mobile-devices-with-n-day-exploits"]
