  - claim_id: 3ec50e0b52
    entry: 2026-10-31/cve-2026-98432-linux-kernel-tcp-uaf-mptcp-remote-root
    surface: "summary"
    kind: frontmatter
    text: "The Linux kernel CVE team published CVE-2026-98432 on 2026-10-15, a use-after-free in the IPv4 TCP connection setup path that dates to Linux 4.4 and is reached by a SYN packet carrying IP options; the CNA scores it CVSS 9.8. Anthropic reports that Claude wrote an exploit giving a remote, unauthenticated attacker root on servers with a multipath TCP (MPTCP) listener, which CloudLinux's kernel team could not reproduce; the Go team says the bug is not specific to MPTCP and Akamai that disabling MPTCP does not prevent exploitation, and no source reports attacks. Citrix rates its XenServer 8.4 and 9 bulletin Critical and names fixes for Workload Balancing and Conversion Manager, XCP-ng released a kernel fix, MikroTik's RouterOS 7.25.1 and 7.24.6 list the CVE, Debian, CIQ and Amazon Linux kernels are fixed and Ubuntu's were still in progress on 2026-11-04, while WatchGuard (Fireware OS, AP, Dimension) and Fortinet list their products as unresolved or under investigation without a fixed build."
  - claim_id: 77ad0857ff
    entry: 2026-10-31/cve-2026-98432-linux-kernel-tcp-uaf-mptcp-remote-root
    surface: "cves[CVE-2026-98432]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-98432\", \"cvss\": \"9.8 (CVSS 3.1, kernel.org CNA and Red Hat; upstream rates it 8.1 per CIQ)\", \"status\": [\"patch-available\"], \"affected\": \"Linux kernels from 4.4 on the IPv4 TCP path; Ubuntu 22.04, 24.04, 26.04 and 26.10 (fix in progress) and 20.04, 18.04 and 16.04; RHEL 8, 9 and 10; Rocky Linux 8, 9 and 10 (CIQ lists patched kernels for every RLC Pro variant, community releases follow Rocky errata); RHEL 7 and Ubuntu 14.04 are not affected; Citrix XenServer 8.4 and 9, Workload Balancing before 2026.1.1 and Conversion Manager before 2026.2.0; XCP-ng 8.3 and Xen Orchestra Appliance; WatchGuard Fireware OS, AP and Dimension (potentially affected, unresolved)\", \"fixed\": \"upstream 5.10.272, 5.15.223, 6.1.190, 6.6.159, 6.12.113, 6.18.56, 7.2.10 and 7.3-rc7; Debian bookworm 6.1.190-1 and trixie 6.12.113-1; CIQ RLC Pro LTS 9.6 and FIPS 9.6 kernel-5.14.0-570.60.1+27.2.el9_6_ciq, LTS 9.2 and FIPS 9.2 kernel-5.14.0-284.30.1+45.1.el9_2_ciq, LTS 8.6 kernel-4.18.0-372.32.1+40.1.el8_6_ciq (2026-10-31), RLC Pro 8 and FIPS 8.10 kernel-4.18.0-553.178.1+2.1.el8_10_ciq, FIPS 8.6 kernel-4.18.0-553.178.1+2.1.el8_6.ciqfips, RLC Pro 9 kernel-5.14.0-687.60.1+2.1.el9_8_ciq and RLC Pro 10 kernel-6.12.0-211.68.1+2.1.el10_2_ciq (2026-11-01); Debian trixie security 6.12.115-2 (2026-11-03); Amazon Linux 2 and 2023 kernel packages (AWS, 2026-11-02); fixes for some kernels from Oracle Linux and SUSE; Ubuntu fixes in progress as of 2026-11-04; Citrix XenServer 8.4 and 9 updates in the Early Access and Normal channels (no build named), Workload Balancing 2026.1.1 or later and Conversion Manager 2026.2.0; XCP-ng 8.3 kernel-4.19.19-8.0.46.14.xcpng8.3 and Xen Orchestra Appliance linux 6.1.190-1 (reboot required); MikroTik RouterOS 7.25.1 (stable) and 7.24.6 (long-term); no fix yet from WatchGuard or Fortinet; Red Hat's CVE page carries no fix table as read on 2026-11-03\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
