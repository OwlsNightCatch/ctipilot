- 'Served via the jina reader after extract fell back (metered credit spent): EFS press release (cookie banner dropped, article intact, page shows ''Published Time: 2026-11-03T21:45:02+01:00''), Fortinet FG-IR-26-188 (full structured advisory returned), MikroTik 7.25.1 changelog (re-read direct for the verbatim text, same content), FIRST EPSS JSON (url -> jina fallback). Four jina-served calls in total.'
- 'extract dropped nothing load-bearing on: ENISA statement, CNW-2026-05 (GitHub render dropped the member-advisory table; the raw.githubusercontent.com markdown was fetched via ''url'' and carries it), ACN bulletins, Coolworld, franceinfo, BleepingComputer, heise, SRF, IT-Connect, Zyxel advisories and community posts, Citrix, WatchGuard, Vates, XCP-ng, CERT-FR, Ubuntu.'
- 'CERT-FR extract shows the wrong metadata date (2024-04-08) and omits the version table; the raw HTML shows it (ALE-012: 12 octobre 2026 Version initiale; 13 octobre 2026 Ajout d''autres équipements ciblés; 16 octobre 2026 Mise à jour des recommandations; AVI-1449: 04 novembre 2026 Version initiale). Both cert.ssi.gouv.fr and cert.cyber.gouv.fr hostnames exist (CNW and IT-Connect link the latter); the entry''s cert.ssi.gouv.fr URLs still resolve.'
items:
- id: A
  entry: entries/2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack.md
  status: done; read 14 primaries/corroborations in full; EFS, Coolworld, ENISA/EC joint statement, CNW-2026-05 and CSIRT Italia BL02 all primary
  answers_to_the_asked_questions:
    dates_and_hours:
    - 'ENISA/EC/Europol EC3/CSIRTs Network/EU-CyCLONe joint statement: page date 2026-11-04, no hour on the page; statement text dates the campaign ''Since 11 October 2026'' and the new wave ''1-2 November''.'
    - 'CNW-2026-05: ''Date 03-11-2026'', no hour.'
    - 'EFS press release: dated ''Saint-Denis, France, 3 novembre 2026''; the page''s published time as served is 2026-11-03T21:45:02+01:00 (= 20:45Z). EFS dates the incident ''Le 2 novembre 2026''; no hour of day is given by EFS or any source. franceinfo/France 2 (evening news of 2026-11-04): ''Dans la nuit de dimanche à lundi'' (1 to 2 November); heise: ''in der Nacht vom 1. auf den 2. November'' (an on-duty technician noticed). No source gives a clock hour for the attack.'
    - 'Coolworld statement: page date 2026-11-04, no hour; says ''early November 2026''; the page''s meta description is present-tense: ''A cyber incident is affecting some of our refrigeration systems. We are informing affected customers directly''.'
    - 'CSIRT Italia BL02/261104/CSIRT-ITA: published and last updated ''04/11/26 ore 18:38'' (local; Italy was on CET, UTC+1 after 2026-10-25, so 17:38Z is an inference). Earlier bulletin BL01/261013/CSIRT-ITA (published 13/10/26 12:44): version 1.1 on 03/11/2026 and 1.2 on 04/11/2026, last update ''04/11/26 ore 18:37''.'
    - 'franceinfo, BleepingComputer, heise, SRF, IT-Connect: all dated 2026-11-04 (no hours).'
    sites_and_countries:
    - 'EFS: ''trois sites de l''EFS'', France only; France 2/franceinfo: ''Dans trois régions différentes''; heise (via Le Canard enchaîné): ''Insbesondere die Region Bourgogne-Franche-Comté''; SRF: ''mehrere regionale Einrichtungen'' per the French health ministry; BleepingComputer: ''three of its facilities''. Two sites neutralised, plasma moved at the third (franceinfo).'
    - 'ENISA statement: ''a number of EU Member States'' (none named). Nothing in the follow-up documents adds a new country to the second-wave list already in the entry; heise 2026-11-04 repeats Belgium, Luxembourg, Sweden, Germany (BSI knows of cases at individual supermarkets); SRF names Germany, Sweden, Belgium and Ireland.'
    what_the_EU_statement_says_to_do:
    - 'Verbatim, the only instruction: ''advise organisations to take immediate action to mitigate exposure in the affected systems'' (ENISA, the European Commission (DG CNECT), Europol''s EC3, the EU CSIRTs Network and EU-CyCLONe).'
    - The statement gives no technical measure, names no product, vendor, actor, CVE or count, does not mention Switzerland, and points to member-CSIRT advisories ('The latest advisories published by CSIRTs Network members can be found on their relevant official communication channels') and to ENISA's collection CNW-2026-05.
    - 'Policy lines it carries (all restatements): CRA manufacturer reporting duty since 11 September 2026, CRA main requirements from 11 December 2027, NIS2 risk-management and significant-incident reporting duties (verbatim rows in claim_table).'
    CNW_2026_05_measures:
    - 'Verbatim, the only measure: ''For additional details please refer to the specific CNW member advisories referenced below.'''
    - 'The collection page itself is a one-row summary: Date 03-11-2026; Number CNW-2026-05; Keywords Refrigeration Systems, retail sector; CVE CVE-2025-41450, CVE-2025-41451, CVE-2025-41452; Details ''As of mid October, 2026, cyberattacks have compromised remote control systems for refrigeration facilities in the retail sector across Europe.'''
    - 'Member advisories linked (not read in this follow-up except CERT-FR and CSIRT Italia): CERT-AT blog post; CERT.be (''Warning: Security Incidents in France Targeting Remote Controllers of Refrigeration Installations, patch immediately!''); BSI (BSI-CS 154, ''Gefährdung durch internet-verbundene OT-Systeme''); CCN-CERT (alerts page); INCIBE-CERT; NCSC-FI; CERT-FR (ALE-012); EL-CSIRT; CSIRT Italia (the EARLIER bulletin BL01); NCSC-NL (''In het nieuws: cyberaanvallen op koelinstallaties in Europa''); CERT-SE (''Cyberangrepp mot uppkopplade frys- och kylsystem''). No Swiss authority row exists in the table.'
    ? actionable_measures_that_do_exist_in_the_newly_found_authority_text (CSIRT Italia, which the EU statement does not itself contain)
    : - 'BL02 (verbatim in claim_table): verify ''con estrema urgenza'' the measures of the bulletins in ''Correlati'', priority = remove direct internet exposure of administrative and control interfaces and verify the integrity of operating parameters and the correct functioning of the alarms; OT/IT segregation; protection of administration and maintenance paths; verify enabled accounts and credential security; update and support status of devices; constant monitoring for unauthorised access and configuration changes; coordinate interventions with plant managers and maintenance staff; report anomalies to CSIRT Italia.'
      - 'BL01 (the earlier bulletin BL02 tells everyone to apply; six action areas, verbatim rows in claim_table): inventory including manufacturer, model, version, support status; remove direct internet exposure (temporary restriction to trusted IPs if not immediately possible); VPN with MFA, supplier access limited to authorised resources and periods, logged and revoked after the intervention; verify accounts, replace default/weak credentials, MFA on remote access; compare configuration with authorised, verify actual temperatures and alarms with tools independent of the supervision platform, 90-day log look-back, preserve logs; decommission or isolate EOL devices.'
    any_source_names_Danfoss_Copeland_Dixell_for_the_blood_case: 'No. Checked by grep across EFS, Coolworld, franceinfo, heise, SRF, ENISA, CNW and both ACN bulletins: none mentions Danfoss, Copeland, Dixell or xweb. BleepingComputer carries the page tag ''Danfoss'' and a background paragraph on the earlier waves but its body does not tie the blood case to those controllers; IT-Connect names them only as background and says ''rien ne permet d''affirmer que les équipements gérés par Coolworld font partie des modèles visés par l''alerte du CERT-FR, ni que les auteurs sont les mêmes''. The earlier statement in the entry (''no source names the equipment'') still holds.'
    swiss_case_known: 'No Swiss victim is named. SRF 2026-11-04: ''In der Schweiz sind noch keine Cyberangriffe auf Kühlsysteme in Supermärkten bekannt.'' (scope: supermarkets). 20 Minuten 2026-11-02 (already in the entry): Coop registered attempts without success. Nothing on Swiss blood-donation services, hospitals or pharmacies in any source read.'
    guidance_changes:
      CERT-FR: 'No change after 2026-10-16: the ALE-012 revision table still ends ''Mise à jour des recommandations'' on 16 octobre 2026 (read 2026-11-05). CERT-FR is one of the CNW members linked.'
      NCSC.ch: 'No change: Security Hub post 13054 is last modified 2026-10-13T14:06:30Z; a keyword scan of the bridge''s listing of the 100 most recent hub posts (newest created 2026-11-03T15:47Z; fu3-A-ncsc-csh-recent100.json) finds no refrigeration or blood-service post other than 13054. A WebSearch for a BACS/NCSC statement found nothing. (bacs.admin.ch itself was not crawled.)'
      new_authority_guidance_in_window: CSIRT Italia BL02 (2026-11-04) widens its call to all cold-chain users and all users of industrial remote-control tools; ENISA/EC/Europol/CSIRTs Network/EU-CyCLONe joint statement (2026-11-04); BSI per heise (call to disconnect or secure and patch).
    store_counts_with_dates:
    - 'BleepingComputer 2026-11-04: second wave ''more than 115 stores across Belgium, the Netherlands, Sweden, Luxembourg, Ireland, and Estonia''; October wave ''an estimated 250 to 350 French supermarkets''.'
    - 'SRF 2026-11-04: ''hunderter Supermärkte und Lebensmittelverarbeiter'' (no figure).'
    - 'EFS: three sites. ENISA: no figure. franceinfo, heise, Coolworld (''Only a limited number of Coolworld units''): no store figure.'
    - No source read gives a count above or newer than 115+ for the second wave; a WebSearch of October-era coverage returned 'about 700 supermarkets' (French government, 2026-10-13; already in the entry through SecurityWeek).
