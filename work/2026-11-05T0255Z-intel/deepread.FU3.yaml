  supersession_list:
  - location: frontmatter summary (last sentences)
    existing_text: Le Canard enchaîné reports that cold rooms of a French blood-service contractor were programmed to 110 degrees overnight on 1 to 2 November, with no source naming the equipment or tying it to these controllers;
    status: outdated (framing); the closing clause stays true
    why: 'The blood-service case is no longer Canard-only: EFS itself confirmed on 2026-11-03 (incident on 2 November, supplier''s supervision and control installations at three EFS sites, temperature and defrost thresholds raised to very high values, no product lost) and Coolworld published a statement on 2026-11-04. ''No source naming the equipment or tying it to these controllers'' still holds in every document read on 2026-11-05 (EFS, Coolworld, franceinfo, heise, SRF, BleepingComputer body, IT-Connect, ENISA, CNW, ACN). The 110 degrees is still only Canard/heise/SRF (EFS gives no figure).'
    new_source: EFS release; Coolworld statement; franceinfo; BleepingComputer; heise; SRF
  - location: frontmatter sourcing_note (last sentence)
    existing_text: and the blood-service case is Le Canard enchaîné's reporting alone, quoting the blood service and the Health Ministry.
    status: FALSE as of 2026-11-04
    why: 'EFS press statement (2026-11-03, primary), Coolworld statement (2026-11-04, primary), franceinfo/France 2 (2026-11-04), BleepingComputer, heise and SRF (2026-11-04) now carry the case; ENISA''s joint statement of 2026-11-04 refers to the 1-2 November wave without naming it. Note the EFS-Coolworld link is NOT made by either party: EFS does not name its supplier and Coolworld does not name EFS; the link is made by BleepingComputer, heise, SRF and franceinfo (and Canard).'
    new_source: EFS release; Coolworld statement
  - location: frontmatter sourcing_note (German cases)
    existing_text: The German cases rest on heise and WDR reporting, with the cause unconfirmed by the police and the maintenance-firm account the operator's own;
    status: incomplete
    why: heise (2026-11-04) adds that the BSI knows of cases at individual supermarkets in Germany and had urged operators of networked freezer controllers to disconnect them from the internet or at least secure and patch them. This is heise's statement; no BSI primary was read in this follow-up (BSI-CS 154 is listed in CNW-2026-05 but was not fetched).
    new_source: heise 2026-11-04; CNW-2026-05 member table
  - location: frontmatter headline
    existing_text: 'Refrigeration attacks reach Germany; SentinelLABS: no actor established; Coop CH: attempts failed; ANSSI blames exposure'
    status: outdated (no longer the lead development)
    why: 'Newest developments of 2026-11-03/04: victim-confirmed blood-service incident (EFS, healthcare cold chain, via a supplier''s remote-monitoring platform) and the EU-level joint statement of ENISA, DG CNECT, Europol EC3, CSIRTs Network and EU-CyCLONe urging immediate mitigation of exposure.'
    new_source: EFS release; ENISA joint statement
  - location: frontmatter title (tail)
    existing_text: responsibility not established; CERT-FR and NCSC Switzerland say to remove internet exposure
    status: incomplete (still true)
    why: 'No source in the follow-up names an actor either (EU statement, EFS, Coolworld: none). The title does not carry the EFS confirmation or the EU statement; nothing in it is false.'
    new_source: ENISA joint statement
  - location: frontmatter sectors
    existing_text: 'sectors: [retail]'
    status: incomplete
    why: 'The EFS case is healthcare (public blood service: blood products, plasma for transfusion and for drug fractionation); NCSC Switzerland''s advisory 13054 (already cited) says the attack could affect healthcare for specialised cooling equipment; ACN BL02 extends its call to every cold-chain user ''indipendentemente dal relativo settore di appartenenza''. Heise adds an unsourced statement that attempts also hit the pharma trade.'
    new_source: EFS release; ACN BL02; heise
  - location: body paragraph 2 (Canard sentence)
    existing_text: Le Canard enchaîné reports that cold rooms of a French blood-service maintenance contractor were programmed to 110 degrees overnight on 1 to 2 November, frozen plasma among the products, with no operational consequence according to the Health Ministry; no source names the equipment or ties it to the Danfoss cases (translated from French)
    status: outdated (replace with EFS's own account)
    why: 'EFS (2026-11-03): incident on 2 November; supervision and control installations of cold rooms at three EFS sites affected; temperature and defrost thresholds raised to very high values; EFS''s own monitoring and alarm systems caught it; equipment ''maîtrisés'' or ''neutralisés'' and products moved preventively; no health impact and no loss of blood products; plasma for transfusion and for fractionation was in the affected equipment; EFS working with ANSSI and the Ministry of Health. franceinfo: three different regions, -30 C freezers received a defrost order, two sites neutralised, plasma moved at the third. ''No operational consequence according to the Health Ministry'' is Canard''s quote of the ministry; EFS''s wording is ''aucune perte de produits sanguins''.'
    new_source: EFS release; franceinfo
  - location: body 'Update — 2026-11-04T03:30:36Z' (Coolworld sentence)
    existing_text: Le Canard enchaîné reports that Coolworld, a company that maintains refrigerated storage containers for the French blood service, was hacked overnight on 1 to 2 November and that cold rooms held at minus 30 degrees were programmed to reach 110 degrees;
    status: incomplete; role of Coolworld is described differently across sources
    why: 'Canard: maintains refrigerated storage containers. heise: Coolworld ''wartet'' (services) the cooling plants for EFS. franceinfo: Coolworld ''mettait à disposition ses congélateurs'' (made its freezers available). BleepingComputer: ''European refrigeration equipment provider Coolworld Rentals''. EFS: only ''un prestataire d''équipement frigorifique''. Coolworld''s own page is titled for ''Coolworld International B.V.'' and says only that it is aware of ''the cybersecurity incident involving remote monitoring software used in refrigeration systems early November 2026''. Do not state a role with more certainty than ''refrigeration equipment provider to EFS (rental/maintenance, sources differ)''.'
    new_source: Coolworld statement; franceinfo; heise; BleepingComputer
  - location: body 'Update — 2026-11-04T03:30:36Z' (last sentence)
    existing_text: no source names the equipment, the vendor or the access method, or ties this case to the Danfoss and Copeland controllers.
    status: partly outdated ('or the access method')
    why: 'Still true: no source names the equipment or the vendor, and none ties the case to Danfoss/Copeland/Dixell (BleepingComputer''s page TAG ''Danfoss'' and its background paragraph about earlier waves are not a statement about this case; IT-Connect says nothing allows asserting that Coolworld''s equipment is among the CERT-FR models or that the authors are the same). Now stated: Coolworld says the incident involves ''remote monitoring software'' and that ''the vulnerability currently being reported in the media relates to a component from a third-party supplier'' (Coolworld does NOT itself say the attackers exploited it; BleepingComputer''s paraphrase is stronger); SRF says reportedly the attackers entered through the external provider Coolworld''s remote maintenance; EFS says its cold rooms were ''équipées de la solution du prestataire''. None gives a product, flaw id or technique.'
    new_source: Coolworld statement; SRF; EFS release; IT-Connect
  - location: body paragraph 3 'Exposure'
    existing_text: '**Exposure:** a Danfoss AK-SM or AK-SC refrigeration controller, or a Copeland or Dixell xweb unit, whose management interface is reachable from the internet, above all legacy units:'
    status: incomplete
    why: 'EFS says it was ''not directly targeted'': its cold rooms were exposed through the supplier''s solution. The exposure class now includes cold rooms supervised or controlled through a contractor''s remote-monitoring platform (healthcare cold chain, blood and plasma stores, pharmacy), whether or not the operator exposes anything itself. ACN BL02: centralised management platforms can affect several plants or sites. The vendor/product for that case is not public.'
    new_source: EFS release; ACN BL02
  - location: body 'Detection' line
    existing_text: '**Detection:** on the controller, defrost, setpoint and account changes outside a maintenance window,'
    status: incomplete (additive)
    why: 'EFS: the change was caught by EFS''s own monitoring and alarm systems (heise/SRF/Canard: an on-duty technician). ACN BL01 (the measures BL02 tells everyone to apply): verify actual temperatures and alarm function ''anche a strumenti indipendenti dalla piattaforma di supervisione'' (also through tools independent of the supervision platform); look back 90 days in logs where retained; ACN BL02: altered displayed data or disabled alarms can delay detection.'
    new_source: EFS release; ACN BL01; ACN BL02
  - location: frontmatter actions[0] (reason clause)
