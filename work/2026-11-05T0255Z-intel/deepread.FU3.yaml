  composer_cautions:
  - The EFS-Coolworld link is made by BleepingComputer, heise, SRF, franceinfo and Canard; neither EFS nor Coolworld names the other. Write 'EFS's refrigeration supplier (reported by BleepingComputer, heise and SRF as Coolworld)'.
  - Coolworld's statement says 'The vulnerability currently being reported in the media relates to a component from a third-party supplier'; it does not say attackers exploited it. BleepingComputer's 'Coolworld says the attackers exploited a vulnerability in a third-party component' is the outlet's own rendering.
  - 'EFS''s release gives no temperature figure; ''110 degrees'' and ''Bourgogne-Franche-Comté'' come from Le Canard enchaîné (relayed by heise, SRF, IT-Connect). EFS: ''des seuils de température et de dégivrage ont été portés à de très hautes températures''.'
  - EFS says 'trois sites'; franceinfo says 'trois régions différentes'; do not equate sites and regions.
  - heise's 'Unter anderem soll es im Pharmahandel Versuche gegeben haben' is unsourced (soll = reportedly); keep it out or attribute it as heise's unsourced claim.
  - ACN BL01 version notes (1.1 on 03/11, 1.2 on 04/11) say it was reissued 'a seguito dei recenti eventi rilevati sul territorio nazionale' / 'ulteriori eventi rilevati sul territorio nazionale' (events detected on national territory). No Italian incident or victim is named anywhere; do not infer Italian victims.
  - 'The ENISA statement''s CRA lines say ''manufacturers ... must report severe incidents and actively exploited vulnerabilities'' through the CRA Single Reporting Platform: an obligation of manufacturers, not of operators; the NIS2 line is the operator-side duty. The entry store already carries the CRA reporting entry.'
  - 'Whitespace: the ENISA page''s text contains non-breaking spaces (after ''report'', ''and'', ''Directive'', ''2022/2555)''); quote the verbatim segments as split in the claim_table.'
