    Zyxel advisory 2026-11-03 (CVE-2026-107441): could allow a LAN-based, unauthenticated attacker to exploit the flaw and potentially execute OS commands via a crafted HTTP request (no CVSS on the page)
    Zyxel as CNA, CVE record (verify-only, not citable): CVSS 3.1 baseScore 8.8 HIGH, vector CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H; description 'could allow an unauthenticated adjacent attacker  to exploit the flaw and potentially execute OS commands via a crafted HTTP request'; record published 2026-11-03T01:41:52Z, updated 2026-11-04T13:32:59Z; its product list names one model 'GS1900-HPv2 firmware' where the advisory says GS1900-24HPv2
    Binarly advisory BRLY-2026-057: 'CVSS v3.1: 9.8 Critical (CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H); ''An unauthenticated remote attacker can execute arbitrary OS commands with root privileges.''; ''exploitation uses HTTP and has no protocol-level adjacency requirement; an attacker only needs network reachability to the management service; we therefore assess the attack vector as AV:N, producing a CVSS v3.1 score of 9.8 rather than 8.8'''
    Binarly blog: '''honoring the unauthenticated remote code execution nature of this vulnerability''; title ''Pre-Auth RCE in Zyxel GS1900 Exploited in the Wild as a Zero-Day'''
    BleepingComputer 2026-11-04: '''allows an unauthenticated attacker with network access to execute operating system commands using specially crafted HTTP requests'''
  exploitation_statement_and_source:
    who_says_exploited: 'Binarly (blog title: ''Exploited in the Wild as a Zero-Day''; advisory ''Exploitation in the wild'' section: the PyArmor-obfuscated exploit GreyNoise described ''matches the captured exploit analysed by Binarly team''; ''It implements the parameter-counter corruption, and supports both a deterministic GOT overwrite and a stack target mode''). BleepingComputer headline: ''Zyxel fixes zero-day exploited to hack nearly 1,000 network switches''.'
    who_does_not: Zyxel's two advisories contain no exploitation statement; CISA lists only CVE-2026-7273 in KEV; the CISA ADP/SSVC block on the CVE-2026-107441 record (verify-only) reads Exploitation none (2026-11-04T04:56Z).
    inference_flagged_by_the_sources: 'BleepingComputer: ''it remains unclear whether it was deliberately developed to bypass those updates or exploited a related vulnerability that the earlier patches failed to address''. Binarly''s link between the in-the-wild activity and the new flaw rests on code identity (the recovered exploit matches GreyNoise''s description) and on its own tests on emulated environments and ''real hardware''; Binarly will publish a minimised PoC ''in the near future''. Binarly also says ''we believe the exploit is LLM-generated''.'
