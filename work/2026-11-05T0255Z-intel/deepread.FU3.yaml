  supersession_list:
  - location: frontmatter title
    existing_text: 'CVE-2026-7273 — Zyxel GS1900 switches: pre-auth stack overflow reaches CISA KEV after GreyNoise catches an actor overlapping Red Heron exfiltrating configs and hashed root credentials from 996 devices in 48 countries'
    status: false/contested in two respects
    why: '(1) ''stack overflow'': Binarly says the overflowing object exploited is a global .bss buffer (reqParameters) and not the stack; Zyxel, per Binarly, told it CVE-2026-7273 ''was related to a reqParameters overflow due to a lack of counter validation, despite the vulnerability description on their website referring to a stack overflow''. (2) The title ties the exploitation to CVE-2026-7273; Binarly says the recovered exploit works against all ten builds that fixed it, i.e. it targets a separate flaw, CVE-2026-107441 (Zyxel agreed it is separate). GreyNoise''s attribution and CISA''s KEV listing of CVE-2026-7273 stand as facts about what those parties said; the in-the-wild activity is now attributed by Binarly to CVE-2026-107441, and BleepingComputer notes it ''remains unclear whether [the exploit] was deliberately developed to bypass those updates or exploited a related vulnerability that the earlier patches failed to address''.'
    new_source: Binarly blog and advisory; Zyxel advisory 2026-11-03; BleepingComputer
  - location: frontmatter headline
    existing_text: CISA adds a pre-auth Zyxel switch RCE to KEV after GreyNoise catches a Red Heron-linked actor exploiting it at scale
    status: outdated (incomplete)
    why: '''it'' is CVE-2026-7273 in the headline; the exploit GreyNoise caught works on the builds that fix CVE-2026-7273 and targets CVE-2026-107441 (Binarly). The patched-for-June switches are not safe.'
    new_source: Binarly blog
  - location: frontmatter summary
    existing_text: CVE-2026-7273 (CVSS 8.8) is a pre-auth stack-based buffer overflow in the CGI login handler of Zyxel GS1900 series switches, patched in June 2026 and added to CISA KEV on 2026-09-21 after GreyNoise found an actor it assesses is the same as or related to Red Heron exploiting it on or about 17 August 2026,
    status: outdated / unsupported wording
    why: '''CGI login handler'' is not in either Zyxel advisory (both say ''the CGI program''); Binarly says the vulnerable parser is reachable in dispatcher.cgi, httprestorecfg.cgi and httpupload.cgi (all seven CGI binaries carry the function). ''exploiting it'' (CVE-2026-7273) is the GreyNoise/CISA association Binarly disputes. ''patched in June 2026'' is true only of CVE-2026-7273; the same .2C0 builds remain vulnerable to CVE-2026-107441 until the .3C0 builds of 2026-10-22.'
    new_source: Zyxel June advisory; Binarly blog
  - location: frontmatter cves[0].fixed and body paragraph 1 (fixed build)
    existing_text: each model's own "…(x).2C0" build (per-model builds differ; see Zyxel's advisory table)
    status: FALSE as the remedy for the exploited flaw; true only for CVE-2026-7273 as Zyxel scoped it
    why: 'Per Zyxel''s advisory of 2026-11-03 the .2C0 builds are the AFFECTED versions of CVE-2026-107441 (''2.90(xxxx.2)C0 and earlier'') and the fixed builds are ''2.90(xxxx.3)C0''. Binarly: all ten .2 builds are vulnerable to the recovered exploit. The entry needs a fixed-build statement per CVE: CVE-2026-7273 .2C0 (Zyxel 2026-06-16), CVE-2026-107441 .3C0 (Zyxel release notes ''October 2026'', fix released 2026-10-22 per Binarly and BleepingComputer, advisory 2026-11-03).'
    new_source: Zyxel advisory 2026-11-03; Zyxel community Patch 3 post; Binarly blog
  - location: frontmatter cves[0].affected
    existing_text: each at or below its own "…(x).1C0" baseline build
    status: true for CVE-2026-7273; incomplete for the exploited flaw
    why: CVE-2026-107441 affects each model at or below its own '…(x).2C0' (Zyxel); Binarly's impacted-firmware list names builds .0, .1 and .2 of each of the ten models. Zyxel's table lists the ten models only; the community release post also lists a GS1900-8HP (Rev. B1) with the same .3C0 build.
    new_source: Zyxel advisory 2026-11-03; Binarly blog; Zyxel community Patch 3 post
  - location: frontmatter cves[0].epss
    existing_text: 'epss: "0.00315"'
    status: outdated (verify-only data)
    why: 'FIRST EPSS on 2026-11-04: CVE-2026-7273 0.02778 (percentile 0.864); CVE-2026-107441 0.00293 (percentile 0.220). EPSS is verify-only data for the cves[] record, not a citable source.'
    new_source: FIRST EPSS API (verify-only)
  - location: frontmatter cves[0].status
    existing_text: 'status: [exploited, cisa-kev, patch-available]'
    status: contested for 'exploited'
    why: 'CVE-2026-7273 remains in CISA KEV (dateAdded 2026-09-21; catalog 2026.11.04 read 2026-11-05). CVE-2026-107441 is NOT in KEV (catalog 2026.11.04 released 2026-11-04T20:00:05Z): the CISA ADP/SSVC block on its CVE record (timestamp 2026-11-04T04:56Z, verify-only) reads Exploitation none, Automatable no, Technical Impact total; Zyxel''s advisories of 2026-06-16 and 2026-11-03 contain no exploitation statement; only Binarly labels it exploited in the wild as a zero-day, on the basis that the exploit GreyNoise described matches the one it recovered. A new cves[] record for CVE-2026-107441 is needed (not exploited per CISA/Zyxel; exploited per Binarly''s inference).'
    new_source: KEV catalog (bridge); CVE record (verify-only); Binarly advisory
  - location: frontmatter actions[0]
    existing_text: Patch every deployed Zyxel GS1900 switch to its per-model fixed "…(x).2C0" build now,
    status: FALSE (wrong build)
    why: 'The build to install is ''2.90(xxxx.3)C0'' (per-model: AAHH, AAHI, AAZI, AAHJ, AAHL, AAHK, ABTO, ABTP, AAHN, ABTQ). Switches already on .2C0 are still vulnerable. The credential-rotation half of the action stands (GreyNoise 564 of 996 on factory defaults).'
    new_source: Zyxel advisory 2026-11-03; Zyxel community Patch 3 post
  - location: body paragraph 1 (patch statement)
    existing_text: Zyxel patched all ten affected models — GS1900-8, -8HP, -10HP, -16, -24, -24E, -24EP, -24HPv2, -48 and -48HPv2 — on 2026-06-16, each at its own "…(x).2C0" build one increment above the vulnerable "…(x).1C0 and earlier" baseline
    status: outdated (incomplete); date nuance
    why: 'Still an accurate description of Zyxel''s June advisory for CVE-2026-7273, but it presents .2C0 as the remedy. Date nuance: the advisory is dated 2026-06-16; Binarly says the GS1900-24 ''latest firmware was released on June 12, 2026'' and its exploit''s fingerprint table dates 2.90(AAHL.2)C0 ''07 May 2026''; Zyxel''s community ''Patch 2'' release note is headed ''May 2026'' and a reader comment says the PDF change history dates the .2 release 05/22/2026. The sources do not reconcile these; ''patched on 2026-06-16'' is the advisory date only.'
    new_source: Binarly blog; Zyxel community Patch 2 and Patch 3 posts
  - location: body paragraph 2 (exploit description)
    existing_text: 'On or about 17 August 2026 the actor exploited CVE-2026-7273 with a PyArmor-6.7.5-obfuscated Python tool offering two modes: a deterministic single-request GOT-overwrite, and an ASLR-brute-force stack mode averaging roughly 2,048 attempts, explicitly targeting firmware versions 2.10-2.90 of the GS1900-24,'
    status: incomplete / attribution of the CVE disputed
    why: 'Binarly confirms the same tool (GOT mode deterministic; stack mode ASLR brute-force, about 2048 attempts on average) and adds that its fingerprint table includes the build 2.90(AAHL.2)C0, i.e. the build that fixes CVE-2026-7273, and that the exploit was recovered from an open directory on Red Heron C&C infrastructure (JITTERLY, SIXZUT). Binarly: the exploit hits CVE-2026-107441, not CVE-2026-7273. No source says JITTERLY or SIXZUT was deployed on any switch.'
    new_source: Binarly blog
  - location: body 'Detection' paragraph (reachability inference)
    existing_text: the flaw requires a "LAN-based" attacker per Zyxel's own advisory
    status: contested inference
    why: Zyxel's advisory for CVE-2026-107441 repeats 'LAN-based, unauthenticated attacker' (its CNA record, verify-only, scores CVSS 3.1 8.8, AV:A). Binarly's advisory says the exploit 'has no protocol-level adjacency requirement; an attacker only needs network reachability to the management service' and assesses AV:N, CVSS 3.1 9.8; its blog says 'unauthenticated remote code execution'; BleepingComputer says 'an unauthenticated attacker with network access'. GreyNoise's 996 victims in 48 countries are consistent with internet-reachable management planes but no source states how many were internet-exposed. Report each wording verbatim; do not reconcile.
    new_source: Zyxel advisory 2026-11-03; Binarly advisory; BleepingComputer
  - location: body 'Detection' paragraph (exposure window)
    existing_text: treat any GS1900 that was reachable and unpatched between 2026-06-16 and its patch date as a candidate for a compromise assessment centred on credential rotation rather than malware removal.
    status: outdated window
    why: A switch on the .2C0 build was exposed to the recovered exploit until it received the .3C0 build (released 2026-10-22); GreyNoise saw exploitation from about 17 August 2026. 'its patch date' must mean the .3C0 install.
    new_source: Binarly blog; Zyxel advisory 2026-11-03
  - location: body 'Defender takeaway'
    existing_text: patch every GS1900 switch to its per-model fixed build now;
    status: ambiguous/wrong without naming the build
    why: Must name '2.90(xxxx.3)C0'. A switch already on .2C0 is still vulnerable.
    new_source: Zyxel advisory 2026-11-03
  - location: frontmatter sourcing_note
    existing_text: Zyxel and CISA corroborate the vulnerability and exploitation status but do not comment on attribution.
    status: overstated and now contested
    why: 'Zyxel''s June advisory carries no exploitation statement (its page text has none), and its 2026-11-03 advisory carries none either; CISA''s KEV listing is the exploitation corroboration for CVE-2026-7273. Binarly says the activity GreyNoise documented ''represents a different vulnerability'' under its second interpretation, in which case ''CISA''s association of that activity with CVE-2026-7273 would be incorrect''. Binarly''s own two interpretations: (1) if the parser changes are Zyxel''s patch for CVE-2026-7273 then the patch, description and CVSS are incorrect; (2) otherwise the exploitation is of a different vulnerability.'
    new_source: Binarly advisory; Zyxel advisories
  - location: frontmatter evidence[0] quote (Zyxel PSIRT)
    existing_text: A stack-based buffer overflow vulnerability in the CGI program of the Zyxel GS1900 series switch firmware could allow a LAN-based, unauthenticated attacker to exploit the flaw and potentially execute OS commands via a crafted HTTP request.
    status: accurate for CVE-2026-7273 only
    why: The identical sentence with 'out-of-bounds write' replaces 'stack-based buffer overflow' in the 2026-11-03 advisory for CVE-2026-107441; keep each quote attached to its own CVE.
    new_source: Zyxel advisories
  - location: frontmatter confidence / classification
    existing_text: 'credibility: 1'
    status: review
    why: The corroborated core (GreyNoise's 996 compromised switches, CISA KEV for CVE-2026-7273) stands; which CVE the exploitation belongs to is now Binarly's analysis, with Zyxel confirming the separate flaw but not the exploitation and BleepingComputer saying it remains unclear whether the exploit was built to bypass the June fix. Composer's call whether the rating of the updated entry stays 1.
    new_source: Binarly; BleepingComputer; Zyxel
