  section: cve-2026-98432-linux-kernel-tcp-uaf-mptcp-remote-root (Update 2026-11-05T04:04:49Z)
  item: "CVE-2026-98432, Linux kernel IPv4 TCP (updated entry)"
  url_or_quote: "\"MikroTik's RouterOS 7.25.1 of 2026-11-02 and the long-term release 7.24.6 of 2026-10-30 list the CVE under \"improve stability\" ([MikroTik, 2026-11-02](https://upgrade.mikrotik.com/routeros/7.25.1/CHANGELOG); [MikroTik, 2026-10-30](https://upgrade.mikrotik.com/routeros/7.24.6/CHANGELOG))\""
  summary: "Iteration 2 finding #11 (channel labels from a NEWEST7 listing that is in no sources[] record) was remediated in cves[].fixed and in the main analysis, but the label survives in the Update section: the 7.24.6 changelog opens 'What's new in 7.24.6 (2026-10-30):' with no channel statement, and no cited page says 'long-term'. Drop the words 'the long-term release' (say 'RouterOS 7.24.6') or add a source that states the channel."
- code: F11
