  section: danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack (main analysis, ENISA / CSIRT Italia paragraph)
  item: "Danfoss AK-SM and AK-SC ... refrigeration attack (updated entry)"
  url_or_quote: "\"CSIRT Italia tells operators of cold-chain technology in any sector to apply its measures urgently, removing direct internet exposure of control interfaces first\""
  summary: "The bulletin (BL02/261104/CSIRT-ITA) gives two priorities, not one: 'dando priorità alla rimozione dell’esposizione diretta su Internet delle interfacce amministrative e di controllo e alla verifica dell’integrità dei parametri operativi e del corretto funzionamento degli allarmi.' The Update section states both; the main-analysis sentence keeps only the first, with 'first'. Advisory: mirror the Update wording or drop 'first'."
