- code: F3
  category: claim-not-supported
  section: cve-2026-7273-zyxel-gs1900-red-heron-kev-exploited (Update 2026-11-05T03:59:29Z, also body paragraph 3)
  item: "CVE-2026-7273 and CVE-2026-107441, Zyxel GS1900 switches (updated entry)"
  url_or_quote: "Update section: \"Binarly labels the flaw an in-the-wild zero-day on the strength of the exploit match, scores it 9.8 with a network vector against Zyxel's LAN-based wording, and says it will publish a minimised proof of concept; CISA's catalog lists only CVE-2026-7273 ([Binarly, 2026-11-03](https://www.binarly.io/advisories/brly-2026-057); [BleepingComputer, 2026-11-04](...))\" (body paragraph 3 carries the same two citations on \"Binarly calls it a zero-day exploited in the wild\")"
  summary: "The cited Binarly advisory page carries the 9.8 / AV:N scoring and an 'Exploitation in the wild' section but has no proof-of-concept statement (0 matches for 'proof-of-concept', 'PoC', 'minimi') and does not use the word 'zero-day'; BleepingComputer carries neither the PoC statement nor Binarly's own label. Both are on the Binarly blog, which is not cited on the clause: 'We’ll publish a minimized version of the proof-of-concept exploit in the near future.' and the title 'Pre-Auth RCE in Zyxel GS1900 Exploited in the Wild as a Zero-Day'. Add the Binarly blog citation (https://www.binarly.io/blog/zyxel-gs1900-rce-cve-2026-107441) to the clause in the Update section and to the body sentence. The PoC half is clear; the zero-day attribution half on the body sentence is low confidence because BleepingComputer does say 'zero-day' in its own voice."
- code: F3
  category: claim-not-supported
  section: cve-2026-7273-zyxel-gs1900-red-heron-kev-exploited (Defender takeaway)
  item: "CVE-2026-7273 and CVE-2026-107441, Zyxel GS1900 switches (updated entry)"
  url_or_quote: "\"install each switch's \"…(x).3C0\" build now, not the \"…(x).2C0\" build the June advisory names, which still carries the flaw Binarly says is exploited ([Zyxel PSIRT, 2026-11-03](https://www.zyxel.com/global/en/support/security-advisories/zyxel-security-advisory-for-out-of-bounds-write-vulnerability-in-gs1900-series-switches-11-03-2026))\""
  summary: "(low confidence) The Zyxel advisory carries the .2C0-and-earlier affected table and the .3C0 patch column (supports 'still carries the flaw'), but nothing about exploitation or what Binarly says: its text is only the vulnerability description, the table and 'Thanks to Yegor Vasilenko and Fernando Mercês of Binarly for reporting the issue to us.' The 'Binarly says is exploited' attribution sits on a citation that cannot carry it. Add the Binarly blog or advisory beside the Zyxel citation."
