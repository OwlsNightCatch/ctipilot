  item: "cve-2026-7273-zyxel-gs1900-red-heron-kev-exploited, Detection and Defender takeaway"
  url_or_quote: "GreyNoise describes the harvested data staged to a file on the switch and no implant ... / which still carries the flaw Binarly shows is exploited"
  summary: "Two wording points. (1) 'describes ... and no implant' is literally true (the GreyNoise Zyxel section names none) but reads as GreyNoise asserting absence; 'names no implant' is safer. (2) The takeaway says Binarly 'shows' the flaw 'is exploited' while the headline, summary and sourcing_note correctly say Binarly alone calls it the exploited zero-day and BleepingComputer finds intent unclear; use 'says' or 'reports'."
