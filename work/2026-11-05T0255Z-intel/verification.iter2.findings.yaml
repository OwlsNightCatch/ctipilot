  section: updated-entry
  item: "cve-2026-98432-linux-kernel-tcp-uaf-mptcp-remote-root, section Update 2026-11-03T03:41:39Z"
  url_or_quote: "AWS says fixed Amazon Linux 2 and 2023 kernels are available, that Network Load Balancer TCP listeners pass client packets, including IP options, to targets, and that Linux targets behind them, Global Accelerator, PrivateLink and VPC Lattice layer 4 need the kernel update or the interim steps themselves ([AWS, 2026-11-02](https://aws.amazon.com/security/security-bulletins/2026-160-aws/))"
  summary: "(low confidence) The cited AWS bulletin (Last Updated Date 11/04/2026 15:25 PM PST) no longer carries the NLB TCP-listener sentence and now says 'Global Accelerator does not support IP options on IPv4 TCP packets ... all endpoints behind Global Accelerator are not affected by this issue'; only PrivateLink and VPC Lattice still need action. The 11/02 version (captured in work/2026-11-03T0256Z-intel/bodies/k-aws.md) did say it, so the section is true of the version it dates but is now contradicted by the page it links, and this run removed the matching evidence record for exactly that reason. Fix: date the sentence to the 2026-11-02 bulletin version and state the 2026-11-04 revision (Global Accelerator endpoints not affected, NLB TCP paragraph gone), or drop the clause."
- code: F14
  category: quantifier-without-source
  section: updated-entry
  item: "cve-2026-98432-linux-kernel-tcp-uaf-mptcp-remote-root, Exposure"
  url_or_quote: "which every Go program listening on Linux has been since Go 1.24"
  summary: "(low confidence) The Go team page says 'As of Go 1.24, Go programs enable MPTCP by default for listen sockets on Linux. This default may be changed by setting the \"multipathtcp\" GODEBUG' and that programs may override it per socket with net.ListenConfig.SetMultipathTCP. 'Every Go program' is not what the source says; write 'Go programs enable MPTCP on Linux listen sockets by default since Go 1.24, unless GODEBUG multipathtcp=0 or a per-socket setting overrides it'."
- code: F3
  category: claim-not-supported
  section: updated-entry
  item: "cve-2026-98432-linux-kernel-tcp-uaf-mptcp-remote-root, section Update 2026-11-05T04:04:49Z"
  url_or_quote: "Both say a public exploit exists that relies on MPTCP, which the XCP-ng 8.3 kernel does not have, so it does not work against XCP-ng, while the underlying bug is present and other ways to exploit it cannot be ruled out ([XCP-ng, 2026-11-04](...))"
  summary: "(low confidence) 'Both' covers Vates and XCP-ng but only the XCP-ng post is cited. Vates VSA-2026-056 says 'A public exploit has been published by Anthropic. It leverages an MPTCP listener ... The underlying bug is not specific to MPTCP but the exploit does not affect XCP-ng.'; it does not say the XCP-ng kernel lacks MPTCP or that other ways cannot be ruled out. Those two points are XCP-ng's wording ('which the XCP-ng 8.3 kernel doesn't have ... other ways to exploit it can't be ruled out'). Fix: attribute them to XCP-ng alone or cite Vates for the 'does not affect XCP-ng' part."
