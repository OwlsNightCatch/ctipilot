  item: "danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack, actions[0]"
  url_or_quote: "Find every Danfoss AK-SM and AK-SC, Copeland xweb and Dixell xweb refrigeration controller, and any other refrigeration controller with a remote management interface because not every second-wave site's vendor is confirmed, in facilities you own or that a contractor manages for you and take its management interface off the internet now, restoring access only through a secure VPN or protected network (filtering to the contractor's source addresses is an emergency stop-gap, and CERT-FR asks you to check your insurance conditions before cutting the contractor's data uplink); an end-of-life unit that gets no fixes needs replacing, ..., and check actual temperatures and alarms with instruments independent of the supervision platform, as CSIRT Italia advises."
  summary: "(low confidence) The trim removed only the unsourced 'in writing' clause. The action is still one ~150-word sentence that bundles inventory, taking the interface off the internet, VPN restore, the stop-gap and insurance caveats, EOL replacement and an independent temperature check, and largely restates the body's CERT-FR and CSIRT Italia guidance (check 10b b, c). Keep the first task (inventory every refrigeration controller with a remote interface, take the interface off the internet now) and move the EOL replacement and the independent temperature check to actions[1] or drop them as body restatement."
