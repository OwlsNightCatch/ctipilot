  item: "cve-2026-98432-linux-kernel-tcp-uaf-mptcp-remote-root, Exposure"
  url_or_quote: "the demonstrated exploit needs an MPTCP listener, which `sysctl net.mptcp.enabled` shows as possible when it returns 1 ..."
  summary: "(low confidence) The Akamai page (read in this iteration from the raw HTML) gives the direct listener check the entry still lacks: 'To determine whether any applications are listening on MPTCP sockets, run: sudo ss -M -l -n -p -e' and 'sudo sysctl net.mptcp.enabled' / 'sudo sysctl net.ipv4.tcp_migrate_req' to read both settings; CIQ adds that `ss -Mltn` shows tcp and mptcp rows on RLC Pro LTS 9.6 and RLC Pro 10 but not on LTS 8.10. The entry names net.ipv4.tcp_migrate_req without saying how to read it. The previous iteration's remediation left this out because the Akamai passage had not been read; add the ss -M command and the two sysctl reads with the Akamai citation."
