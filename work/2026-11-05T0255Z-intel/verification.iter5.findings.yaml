  section: entries/2026-10-31/cve-2026-98432-linux-kernel-tcp-uaf-mptcp-remote-root
  item: "sourcing_note"
  url_or_quote: "Red Hat's CVE page renders its fix table client-side, which text extraction misses, so the fixed RHEL builds here come from the same data in Red Hat's security-data API."
  summary: "(low confidence, advisory) Reader-facing sourcing_note carries fetch-process narration ('text extraction misses') and runs to four sentences; the provenance can be one clause ('RHEL fix builds from Red Hat's security-data API record for the CVE'). The data itself is right: the API and the raw CVE page both carry RHSA-2026:93412/93413/93414, released 2026-11-01."
- code: F11
