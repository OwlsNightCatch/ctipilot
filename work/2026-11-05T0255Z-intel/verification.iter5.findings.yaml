- code: F3
  category: claim-not-supported
  section: entries/2026-11-05/apt29-watering-hole-ios-android-n-day-chains-kev
  item: "APT29-linked watering hole uses n-day iOS and Chrome chains; CISA lists CVE-2024-27834; updated devices resist"
  url_or_quote: "**Defender takeaway:** ... because Sekoia says updated devices resist these chains and CISA lists every flaw they deliver as exploited ([Sekoia, 2026-11-04](https://www.sekoia.com/blog/poisoned-source-apt29-watering-holes-targets-mobile-devices-with-n-day-exploits))"
  summary: "The citation terminating the clause is Sekoia only; the Sekoia page (cached extract, raw HTML and flattened tables) contains no CISA/KEV text (0 matches for CISA, KEV, Known Exploited). 'CISA lists every flaw they deliver' (all eight CVEs) is true on the CISA KEV catalog 2026.11.04 read this iteration (CVE-2025-43529 2025-12-15, CVE-2025-14174 2025-12-12, CVE-2025-43510 and CVE-2025-43520 2026-03-20, CVE-2026-20700 2026-02-12, CVE-2026-3910 2026-03-13, CVE-2025-27038 2025-06-03, CVE-2024-27834 2026-11-04), but the entry cites the KEV feed only for CVE-2024-27834 in paragraph 1, so seven of the eight have no inline citation. Fix: add the KEV feed citation (https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json) to this clause; the fact stands."
- code: F3
  category: claim-not-supported
  section: entries/2026-09-22/cve-2026-7273-zyxel-gs1900-red-heron-kev-exploited
  item: "CVE-2026-7273 and CVE-2026-107441, Zyxel GS1900 switches"
  url_or_quote: "(low confidence) ... the same day GreyNoise published research on a suspected Chinese-speaking actor tracked since 7 May 2026 that GreyNoise assesses is the same as or related to Red Heron"
  summary: "(low confidence) GreyNoise (https://www.greynoise.io/blog/open-season-on-kapibala-attacker-steals-government-records-wordpress-exploitation) says 'GreyNoise has been tracking malicious use of an IP address since early June 2026' and 'we are confident that activity from 7 May 2026 onwards is associated with a single malicious cyber actor (MCA)'. 7 May is the date from which GreyNoise attributes activity to one actor, not the start of tracking. Wording predates this run but the sentence was rewritten in the iteration-4 remediation. Fix: 'whose activity since 7 May 2026 GreyNoise ties to one actor'."
- code: F3
  category: claim-not-supported
  section: entries/2026-09-22/cve-2026-7273-zyxel-gs1900-red-heron-kev-exploited
  item: "CVE-2026-7273 and CVE-2026-107441, Zyxel GS1900 switches"
  url_or_quote: "(low confidence) '... CISA's catalog lists CVE-2026-7273 and not the new flaw, and BleepingComputer says it is unclear ... ([Binarly, 2026-11-03](blog); [Binarly, 2026-11-03](advisory); [BleepingComputer, 2026-11-04])' (body paragraph 2) and the Update section sentence 'CISA's catalog lists only CVE-2026-7273' with the same three citations"
  summary: "(low confidence) The Binarly blog and advisory and BleepingComputer say CISA added CVE-2026-7273 to KEV, but none of the three says the catalog does not list CVE-2026-107441. The statement is true: KEV catalog 2026.11.04 (bridge fetch this iteration) has no CVE-2026-107441 row. The catalog is the source that carries an absence claim; the entry's sources[] has only the 2026-09-21 CISA alert (names CVE-2026-7273 only). Fix: cite the KEV feed or say 'as of the 2026-11-04 catalog'."
- code: F11
  category: editorial-advisory
  section: entries/2026-11-02/xerox-fiery-php2shell-printers-fixes-due-6-to-23-november; entries/2026-09-22/cve-2026-7273-zyxel-gs1900-red-heron-kev-exploited
  item: "updates[] record summaries of run 2026-11-05T0255Z-intel"
  url_or_quote: "Xerox record: 'the entry's earlier statements that the bulletin names no workaround or interface are replaced'; Zyxel record: 'the entry's earlier remedy, the .2C0 builds, is replaced by .3C0, and exploitation of the new CVE rests on Binarly's exploit match, which BleepingComputer repeats while calling the exploit's intent unclear'"
  summary: "(low confidence, advisory) Both record summaries narrate record-keeping ('the entry's earlier ... replaced') instead of stating the delta. The Zyxel record summary also states that BleepingComputer repeats the label and calls intent unclear, which the 11-05 section does not say (the 'unclear' sentence is in the main analysis; 'repeats the label' appears only in the frontmatter summary and the record). BleepingComputer does carry both (title 'Zyxel fixes zero-day exploited ...'; 'it remains unclear whether it was deliberately developed to bypass those updates'). May be left."
- code: F11
