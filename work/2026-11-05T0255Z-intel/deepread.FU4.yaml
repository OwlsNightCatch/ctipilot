  A:
    entry: entries/2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi.md
    update_summary_for_composer: Splunk SVD-2026-1015 (published 2026-10-28, last updated 2026-11-04) lists Splunk Enterprise (10.0 and lower vulnerable; 10.2 or higher recommended;
      no fixed 10.0 build), the Splunk Visual Exporter app (all Splunk Enterprise versions; no fix, disable or remove), SOAR Automation Broker, UBA, Attack Analyzer, Python for Scientific
      Computing and AppDynamics components as including packages affected by four Node.js CVEs jointly. Citrix CTX697300 (2026-10-30, remediation text updated 2026-11-03) names only
      CVE-2026-111497 for Unicon eLux Scout and gives fixed builds only. Neither page states exploitation, attacker position, reachability or CVSS.
    key_answers:
      attacker_position:
        splunk_page: NOT STATED. The only sentence is the generic "The vulnerabilities pose risks for remote code execution and traffic interception." (A10), applying to all four CVEs
          together.
        node_js_for_CVE_2026_111497: An attacker who can supply Brotli data that an application decompresses with `node:zlib` can corrupt process memory, which can lead to a crash, disclosure
          of process memory, or remote code execution. (A27; Node.js bulletin, the only attacker-position wording in the chain)
        citrix_page: NOT STATED.
      splunk_components_that_ship_nodejs_verbatim:
      - '"the Node.js runtime bundled with Splunk Enterprise" (A13): the runtime itself; the page names no component, path or process that hosts it.'
      - '"All Splunk Enterprise versions include the vulnerable Splunk Visual Exporter app." (A14): a separate app, not fixed by the 10.2 upgrade.'
      - For Splunk UBA, Splunk SOAR Automation Broker, Splunk Attack Analyzer, Python for Scientific Computing and the AppDynamics components the page says only that they "include packages
        affected by the vulnerabilities" (A12); no component is named.
      reachable_in_product: NOT STATED. Splunk says "include packages affected by the vulnerabilities" (presence of the packages, A12) and that Enterprise 10.0 and lower "are vulnerable"
        (A13); there is no reachability, exposure-precondition, listener or feature statement for any product, and no statement that the Brotli decode path is used.
      exploitation_statements: NONE on either page (grep exploit = 0 on both). Splunk and Citrix make no statement of in-the-wild exploitation or of its absence.
      cvss_on_pages: NONE on either page; Splunk gives only "Security Impact Rating (SIR) of High" for all four CVEs (A5).
      precision_flag_for_composer: The S1 findings title says the Splunk products "carry the vulnerable Node.js Brotli decoder (CVE-2026-111497)". Splunk does not tie any product to
        CVE-2026-111497 alone; only Citrix does. Write the Splunk fact as "Splunk lists X as including packages affected by four Node.js flaws, among them CVE-2026-111497".
