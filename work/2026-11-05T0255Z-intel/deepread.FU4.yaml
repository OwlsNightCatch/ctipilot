    other_three_cves:
      what_splunk_says: Nothing beyond the one-line labels A7 to A9 and the shared SIR High rating A5. Splunk maps no CVE to any product, so "Splunk Enterprise 10.0 and lower are vulnerable"
        is a statement about the four Node.js CVEs jointly, not about CVE-2026-111497 alone. The findings title sentence "carry the vulnerable Node.js Brotli decoder (CVE-2026-111497)"
        is therefore an inference for the Splunk products; only the Citrix page ties a product to CVE-2026-111497 specifically.
      matter_to_the_entry: 'None of the three matters as a fact about CVE-2026-111497 or about Node2Shell exploitation: none is Brotli, none is RCE, none is in the CISA KEV catalogue
        2026.11.04 (checked), and the Node.js bulletin states no in-the-wild exploitation for any of them. They matter in exactly one way: because Splunk lists them together, the Splunk
        Enterprise 10.2 upgrade is the remediation Splunk names for the bundled runtime for all four at once (Splunk does not split it per CVE), and an entry sentence about Splunk must
        not attribute the Brotli RCE to Splunk Enterprise as Splunk-confirmed. CVE-2026-105482 (dns.resolve NUL truncation, Node 22/24/26, an app-logic precondition: validate-then-resolve)
        is, in my reading (not a source statement), the only one with a server-side angle; CVE-2026-105483 (24.x and 26.x only) and CVE-2026-106069 (leading-zero IPv4, resolver dependent,
        macOS example) are TLS hostname-verification bypasses on the connecting side; the aggregate Splunk sentence names "remote code execution and traffic interception" for the four
        together and maps neither to a CVE. Recommendation: keep cves[] at CVE-2026-111497, mention the other three at most in one clause as co-listed in SVD-2026-1015, and do not give
        them cves[] records or an exposure line.'
