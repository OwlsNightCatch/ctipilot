    natural_home:
      recommendation: entries/2026-10-29/mdaemon-clamav-unrar-cve-2025-8088-exploited-in-ukraine.md
      why:
      - It is the only one of the four whose finding IS the vulnerable UnRAR code path (ClamAV/MDaemon exposure and its fixed builds) rather than a campaign or backdoor that merely uses
        the CVE as a delivery vector (Sekoia/Gamaredon, Turla STOCKSTAY).
      - It is the only entry that already makes a KEV statement ("since 2025-08-12"), carries the cisa-kev status and tag, and has the sourcing_note caveat that the KEV record is listed
        against WinRAR; a ransomware-flag clause extends an existing KEV sentence instead of introducing KEV into an entry that never mentions it.
      - It is the freshest (2026-10-29, inside the 14-day prior-coverage window), kind threat, with a live cves[] record the flag can be attached to.
      - 'Runner-up: the 2026-06-10 Trend Micro entry (finding = the WinRAR flaw still exploited; has the WinRAR affected/fixed 7.13 and CVSS 8.4) if the composer prefers the WinRAR-product
        home; it is research kind, five months old, and has no KEV statement at all.'
      wording_cautions:
      - Say "CISA's KEV record for CVE-2025-8088 (listed against RARLAB WinRAR) flags ransomware use as Known and names no group or campaign"; do not say ransomware used MDaemon or ClamAV.
      - 'Do not present the flag as new on 2026-11-04: it read Known by 2026-08-07 (bracket above). The honest framing is a context line the store missed, not an in-window event; the
        S1 borderline note ("may be better as an internal record or dropped") stands, and a reader-facing line has little defender value because it changes no action.'
      - 'Optionally correct, in the same record if one is written, the fixed-version slip in the Sekoia entry ("August 2025" vs ESET''s 2025-07-30) and the Turla hardening line ("7.11+"
        vs 7.13): both are factual defects found while reading, not caused by the KEV flag, and belong to the audit if not fixed here.'
