  - claim_id: 1881df6cf7
    entry: 2026-10-31/cve-2026-98432-linux-kernel-tcp-uaf-mptcp-remote-root
    surface: "body"
    kind: cited
    text: "**Exposure:** a Linux host on a kernel below the fixed builds that accepts IPv4 TCP connections from an attacker; the demonstrated exploit needs an MPTCP listener, which `sudo ss -M -l -n -p -e` lists and which Go programs enable on Linux listen sockets by default since Go 1.24 unless the multipathtcp GODEBUG setting or a per-socket option overrides it ("
    urls: ["https://www.akamai.com/blog/security-research/2026/nov/cve-2026-98432-remote-uaf-linux-kernels-tcp-stack", "https://groups.google.com/g/golang-announce/c/PCoQcdxoScw/m/aD-MgXEvAAAJ"]
  - claim_id: 5aeb5c64ad
    entry: 2026-10-31/cve-2026-98432-linux-kernel-tcp-uaf-mptcp-remote-root
    surface: "body"
    kind: cited
    text: "CIQ's testing found that setting `net.mptcp.enabled` to 0 leaves the plain-TCP path reachable ("
    urls: ["https://kb.ciq.com/article/security-advisories/cve-2026-98432-mitigation"]
  - claim_id: e92106e1f6
    entry: 2026-10-31/cve-2026-98432-linux-kernel-tcp-uaf-mptcp-remote-root
