tooling_notes:
- 'extract (trafilatura) DROPS embedded HTML tables on Webflow pages: the Sekoia summary table (class to CVE mapping and iOS 18.5) exists only in the raw HTML. For vendor and CTI pages that carry mapping tables, also read the raw `url` body (bodies/fu1-sekoia-poisoned-source.raw.html) before concluding a mapping is missing.'
- 'sonicwall-psirt recipe fix: `python3 tools/fetch_source.py jina <vuln-detail URL> html` returns the full advisory structure INCLUDING the Affected Product(s), Fixed Software, Credit(s) and Revision History tables; the default markdown reader body and `extract` omit them (sources.json note says the reader body omits the fixed-version table). Strip the HTML to text (scripts/styles removed) for reading; NBSP characters appear in table cells.'
- ENISA EUVD human pages (SPA) read through `extract` only via its jina fallback; the page text carries summary, affected-product row, publication time, assigner (NCSC.ch), CVSS 4.0 vector link text and GHSA/CVE ids, but NOT the numeric score or credits. The euvdservices API carries baseScore/aliases/exploitedSince (data only, not citable).
- bacs.admin.ch CVE list reads with `extract` (direct) but is a tracking list with an explicit not-a-source disclaimer.
- docs.qualcomm.com bulletin pages are an Angular shell; `extract` returns the raw HTML shell (direct-raw). Not readable without the reader.
- Apple support pages, SEPPmail docs, SonicWall support pages, CERT-FR, GTIG, Chrome Releases, THN, BleepingComputer all read cleanly with `extract` (trafilatura-direct).
- 'Reader (jina) calls spent in this follow-up: EUVD x5 (via extract fallback), SonicWall PSIRT 0019 (extract fallback) + html mode, vuln-list, 0011 html = 9.'
items:
  A_seppmail_15_1_1:
    title: SEPPmail Secure Email Gateway before 15.1.1 (CVE-2026-114424, -114425, -114426, -114421, -114420)
    status_line: DONE. Primary read in full; CNA text confirmed on five ENISA EUVD record pages (assigner NCSC.ch); CVSS swap resolved; no exploitation or PoC in any source; no NCSC.ch / bacs.admin.ch / InfoGuard publication found.
    direct_answers:
      affected_versions_by_branch:
        15.1.x: '15.1.0 (feature release 2026-09-28) and 15.1.0.1 (hotfix 2026-09-29) are affected; 15.1.1 (patch release 2026-11-03) is the first fixed build. Vendor writes "Affected versions: <15.1.1" for all five CVEs.'
        15.0.x: 'All 15.0.x builds are inside "<15.1.1" and are affected. No 15.0.x fix exists. The vendor page says of 15.0.7 (2026-09-02, published before this batch): "This release will be the last release in the 15.0 branch and enable the update to version 15.1." so the only fix path is an upgrade to the 15.1 branch (15.1.0 is labelled a feature release on the vendor page). Unknown: no source says whether 15.0.x is formally out of support.'
        older (14.x, 13.x): Covered by the CNA range "0 <15.1.1" and the vendor "<15.1.1". The revision history lists 14.1.4 (2025-10-01) as the last 14.x patch release. No source states support status of 14.x/13.x or whether the vulnerable code paths exist there (CNA defaultStatus is "unknown"; the range is a floor-to-fix range, not a tested statement).
      first_fixed_release: 15.1.1 (patch release, 2026-11-03).
      fix_for_15_0_x: No. See above (15.0.7 is the last 15.0 release; stated 2026-09-02).
      how_admin_reads_running_version: SEPPmail documents the Admin GUI Home page, System section, field "Firmware version" ("Software version currently installed on the system."). The web-based configuration interface is the documented administration surface (default port 8443 on the appliance IP per the login page). The earlier finding said "Admin GUI"; the specific field name is Firmware version (claim A-34, A-35).
      exposure_conditions_from_cna_text:
        CVE-2026-114424 (9.2, CWE-95 eval injection per CVE record verify-only): Unauthenticated remote sender; an ACTIVE rule must use message-derived replacement data and its search condition must match; attacker-influenced replacement text is evaluated as Perl in SENDER or RECIPIENT replacement rules; OS commands run in the mail-processing worker context; "The validated worker context was root." CVSS 4.0 AV:N/AC:L/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H (AT:P = attack requirements present). Claims A-19..A-24.
        CVE-2026-114425 (9.2, CWE-73): Unauthenticated remote sender; Large File Transfer (LFT) must be ENABLED and the message must reach an affected secure-mail processing path; forged file path in externally supplied LFT attachment metadata; disclose, move OR delete an accessible regular file (vendor says "read or delete"); "The validated workers ran as root." Same vector as 114424. Claims A-25..A-27.
        CVE-2026-114426 (8.7, CWE-400): Unauthenticated remote attacker; the v1 file-interface upload data is processed and written BEFORE authentication and without an absolute size limit; concurrent or slow requests occupy workers and fill temporary storage (availability only; AV:N/AC:L/AT:N/PR:N/VA:H). Claims A-28, A-29.
        CVE-2026-114420 (6.9, CWE-90): Unauthenticated; LDAP metacharacters not neutralized in an account-selection input of the GINA web interface; enumerates email addresses (VC:L only; AT:N). Claims A-30, A-31.
        CVE-2026-114421 (8.3, CWE-640): Unauthenticated; password recovery works for a created-but-unregistered GINA account whose initial password is empty; attacker sets a new password, authenticates as that account and locks out the intended recipient until recovery (VI:H; AT:P). Claims A-32, A-33.
      cvss_discrepancy_resolution:
        rule: CNA (NCSC.ch) record wins.
        what_seppmail_page_says: CVE-2026-114421 = 6.9 and CVE-2026-114420 = 8.3, with ONE shared description (account discovery plus takeover) written under both CVEs (claims A-05, A-06, A-13).
        what_cna_records_say: 'CVE-2026-114420 = 6.9 (LDAP wildcard injection, email enumeration; VC:L only) and CVE-2026-114421 = 8.3 (empty-initial-password account takeover; VI:H). Source of the numbers: CVE records (verify-only, claims A-40, A-41) and the EUVD API (data endpoint, same values); the citable EUVD pages EUVD-2026-116797 and -116798 carry the CVSS 4.0 vectors and CNA text but NOT the numeric score in the extracted page text (claims A-31, A-33).'
        consistency_check: 'The vectors support the CNA scores: the enumeration flaw has only VC:L (low), the takeover flaw has VI:H; so the vendor page has the two scores swapped, not the CNA. Use 8.3 for CVE-2026-114421 (takeover) and 6.9 for CVE-2026-114420 (enumeration); mention that the vendor page lists them reversed.'
        scores_that_agree: 114424 = 9.2, 114425 = 9.2, 114426 = 8.7 on both the vendor page and the CNA records.
      exploitation_or_poc: None reported. No fetched source (vendor revision history, five EUVD pages, two GHSA mirror pages, SEPPmail Statuspal listing) states exploitation or a public PoC; the EUVD API records carry no exploitedSince; none of the five CVEs is in the CISA KEV catalogue (catalog 2026.11.04); two WebSearch queries found nothing on these CVE ids. The finding is therefore "no exploitation reported", not "confirmed unexploited".
      ncsc_ch_or_bacs_publication: 'None found. ncsc-csh recent 15: newest post is Barracuda (2026-11-03T15:47Z), no SEPPmail post (A-36). The bacs.admin.ch CVE-list page as served lists nothing newer than 2026-10-26 and states it is not an advisory source (A-37, A-38). WebSearch in English and German found no bacs.admin.ch or NCSC.ch article on this batch. The NCSC.ch contribution is the CNA role: the CVE records and their EUVD mirror pages (Assigner NCSC.ch, A-22).'
      infoguard_labs_publication: 'None found (two WebSearch queries; only the May 2026 InfoGuard report on the earlier batch surfaced in snippets, unverified here). The InfoGuard attribution rests on the CNA record credits (verify-only): Dario Weiss of InfoGuard Labs for 114424/114425/114426; "Synack, Inc" for 114420/114421.'
      vendor_statuspal: 'No 15.1.1 notice on the SEPPmail Statuspal listing at fetch time (newest item: PHP2Shell not-affected notice; page date 2026-10-22). The extended release notes page for 15.1 had not been updated for 15.1.1 (title still "15.1.0.1 Hotfix Release"). Absence only.'
