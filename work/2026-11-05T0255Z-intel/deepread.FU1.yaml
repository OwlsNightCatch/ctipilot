      severity_semantics: 'CVE-2026-109593: 9.1, CWE-636 Not Failing Securely (Failing Open), vector C:H/I:N/A:H (the vendor scores availability High although the described impact is file read). CVE-2026-109594: 6.8, post-authentication SQL injection "in specific conditions", PR:H, S:C, C:H.'
      platform: 'Advisory table: "GMS - Virtual Appliance and Windows". The CVE record (verify-only) lists platforms Windows and Linux; use the advisory wording.'
      gms_end_of_support_date: 'September 30, 2026 (both "Last Day of Support" and "End of Support"), per SonicWall''s GMS EOL announcement (EOL announced May 5, 2025; Last Day of Order October 1, 2025). The FAQ gives the same: "End of Support (EOS): 9/30/2026". So the advisory (2026-11-03) was published about five weeks AFTER end of support. The FAQ also says "SonicWall will only provide updates for security vulnerabilities until the EOS date." and "You can continue to use GMS, but it will not receive support after the EOS date."'
      context_that_changes_the_story: 'SonicWall''s previous GMS advisory SNWLID-2026-0011 (2026-08-11) affected GMS 9.5.1 and earlier and named FIXED version 9.5.2 (its issues included unauthenticated RCE CVE-2026-66145, unauthenticated command injection in the Dispatcher Service CVE-2026-66147, CVSS 9.4 headline). So 9.5.2 was the last fixed build (Aug 2026) and is itself affected by the new flaws with no 9.5.3 coming. Same finder family: Pentest-Tools.com (Matei Badanoiu) is credited on CVE-2026-66147 in August and on both new CVEs. CVE-2026-66145..66148 are not in KEV.'
      ncsc_ch_or_other_relay: 'No NCSC.ch Security Hub post (ncsc-csh recent 15, newest Barracuda 2026-11-03; no SonicWall post) and no bacs.admin.ch article found; WebSearch found none. CERT-FR relayed it: CERTFR-2026-AVI-1456 (listed 2026-11-04) "GMS versions 9.5.2 et antérieures" and "SonicWall indique que ce produit est en fin de vie et ne recevra donc plus de correctifs de sécurité." The advisory carries no Reference(s) entries.'
