  B_cve_2024_27834_sekoia_apt29:
    title: CVE-2024-27834 KEV addition (2026-11-04) and Sekoia "Poisoned Source" APT29-linked watering-hole report
    status_line: 'DONE. Sekoia report read in full (extract plus raw HTML: the extract dropped the summary table that carries the EXPLICIT class-to-CVE mapping and the iOS 18.5 label); KEV row read from the live catalogue 2026.11.04; six Apple 2024 advisories read; GTIG and Chrome Releases read for the other fixed versions.'
    direct_answers:
      explicit_mapping_exists: YES. The report gives an explicit summary table (columns Class | Exploits and goal | Targeting) plus a section per class naming the CVEs per stage. It is not a positional pairing. The table sits in an embedded HTML table that trafilatura/extract drops (the page text reads "Here is a summary of what we found:" and then nothing); it is present in the raw HTML and in the THN and BleepingComputer relays (claims B-40..B-42, B-120).
      chains:
        Class A (iOS 16.x, cookie theft):
          targeting_as_stated: 'Table: "iOS 16.7". Text: "For iOS 16.7 (even if the chain should work from 16.0 to 17.4)"; delivery filter "only filters for iOS 16.7 / 16.7.10" (B-44, B-45).'
          cves_and_roles:
          - CVE-2025-43529 stage 1 initial WebKit RCE (same RCE as in the DarkSword leaked kit, reimplemented)
          - CVE-2024-27834 stage 2 PAC bypass
          - stage 3 JavaScript cookie theft (Cookies.binarycookies of running apps, not only Safari)
          not_delivered_dead_code:
          - CVE-2024-27808 (AccessCase UAF)
          - CVE-2024-27833 (SBFX overflow)
          fixed_versions:
            CVE-2024-27834: iOS/iPadOS 16.7.8 and 17.5, macOS Sonoma 14.5, Safari 17.5 (macOS Monterey and Ventura), tvOS 17.5, watchOS 10.5; all released 2024-05-13 (Apple pages B-90..B-98); the 16.7.8 entry was added on the page on June 10, 2024
            CVE-2025-43529: iOS 26.2 (Apple page 125884, 2025-12-12, iPhone 11 and later) and iOS 18.7.3 (GTIG). NO fetched Apple page lists CVE-2025-43529 for iOS 16.7.x (16.7.15 lists only CVE-2023-43010, 16.7.16 only CVE-2026-28950; 16.7.13 and 16.7.14 are listed on Apple's releases index as "no published CVE entries")
        Class B (DarkSword, full device data):
          targeting_as_stated: 'Table: "iOS 18.5" (THN repeats it). Sekoia text names no version for Class B. GTIG (separate, 2026-03-18): "DarkSword supports iOS versions 18.4 through 18.7" (B-110). Sekoia does not discuss the difference.'
          cves_and_roles:
          - '/v1: CVE-2025-43529 WebContent RCE, then CVE-2026-20700 as PAC bypass'
          - '/v2: CVE-2025-14174 (sbx0) then CVE-2025-43510 (sbx1)'
          - '/v3: CVE-2025-43520 kernel read/write, then the harvester'
          not_used_alternates:
          - CVE-2025-31277 alternate initial entry
          - CVE-2025-24201 alternate escape
          fixed_versions_per_gtig:
            CVE-2025-43510 and CVE-2025-43520: iOS 18.7.2 and 26.1
            CVE-2025-43529 and CVE-2025-14174: iOS 18.7.3 and 26.2
            CVE-2026-20700: iOS 26.3
            all: '"all vulnerabilities were patched with the release of iOS 26.3 (although most were patched prior)"'
        Class C (Android Chrome):
          targeting_as_stated: 'Table: "Android Chrome 139-145 (but 143)". Text: Chrome 139.0.0.0 through 145.0.0, excluding 143, reason unclear; payload for 139-144 and 145 identical except recompiled GPU-exploit shellcode; exploitation stops on SM-S938B (Samsung Galaxy S25 Ultra) (B-58, B-61).'
          cves_and_roles:
          - CVE-2026-3910 stage 1 V8 renderer code execution (no replay guard on Android)
          - CVE-2025-27038 stage 2 Adreno GPU driver sandbox escape and privilege escalation
          - 'stage 3 AndroSnitch (libexploit.so, 16 functions): Chrome Cookies, Login Data, History and WifiConfigStore.xml files'
          fixed_versions:
            CVE-2026-3910: Chrome 146 (desktop stable 146.0.7680.75/76 on 2026-03-12; Google "is aware that an exploit for CVE-2026-3910 exists in the wild"); the Android build number was not fetched
            CVE-2025-27038: Qualcomm June 2025 bulletin / OEM patch level; KEV note says "Please check with specific vendors (OEMs,) for information on patching status." (Qualcomm bulletin page is a JavaScript shell and could not be read)
      three_infection_vectors:
      - direct JavaScript injection into legitimate sites (template injection, or code appended to an existing JavaScript library)
      - Adversary-in-the-Middle-like reverse-proxy clone domains of high-profile sites (America250 and Raffles London at The OWO)
      - supply-chain compromise of the Plerdy SEO Tracker script
      plerdy_compromise:
        dates: 27 August to 3 September 2026 (one week)
        file: the tracker file under the tracker domain was modified so visitors loaded both the legitimate Plerdy script and the attacker script
        scale_wording: 'body and conclusion: "thousands" of sites, the large majority Ukrainian; introduction: "hundreds" (the report is internally inconsistent; B-25, B-26)'
        intent: 'Sekoia: unclear whether specific visitors or indiscriminate (B-28)'
      victim_set_as_sites_not_confirmed_infections: 'First detection: a Ukrainian gas production company site. Compromised: a major US chemical-industry trade association, a far-right European political party (the attribution section says a far-right Czech movement), a Bulgarian military-related site (tampered JavaScript library), an Australian medical clinic (named only in the conclusion). Cloned: America250 and Raffles London at The OWO. Via Plerdy: thousands of mostly Ukrainian sites incl. army, special-forces, military-equipment (ballistic, UAV) sites and defence and military-recruitment sites. Sekoia reports no count of infected devices and says it is coordinating with CERTs to identify victims. No Swiss site or victim is named anywhere in the report (grep "Switz"/"Swiss": none).'
      attribution:
        wording: '"we assess with moderate to high confidence that this campaign was conducted by APT29" (intro) and "These elements lead us to assess with moderate to high confidence that the intrusion set behind this watering hole campaign is APT29, or at least one of its subgroups." (B-65, B-66)'
        evidence_classes:
        - partner CERT told Sekoia a compromised site (not the Plerdy one) carried leftover artefacts matching a private 2025 APT29 report (not published; Sekoia gives two explanations)
        - Google TAG (as reported by Sekoia) says the framework resembles its 2024 Mongolian-government watering hole attributed to APT29; the 2024 case used a hardcoded site filter, this one does not
        - victimology (Ukraine focus, European party sites)
        - infrastructure spread across multiple hosters, a pattern Sekoia links to past APT29 infrastructure incl. Cobalt Strike Cs2modrewrite use
        maker_holds_telemetry: Sekoia holds the delivery-host telemetry it queried (retrieved chains from the live server); the attribution evidence is mostly third-party (partner CERT, Google TAG) and unpublished
        competing_hypotheses_noted_by_sekoia: Sekoia says exploits likely came from a third party (CSV lineage), and that leftover artefacts could be a mistake or a leftover; it does not offer a non-APT29 actor hypothesis
        caveat: a vendor assessment, not a government attribution; THN and BleepingComputer relay it
      persistence: 'Sekoia (intro): the final payloads exfiltrate data "without establishing persistence". That is the only persistence statement in the Sekoia text; there is no "reboot" statement in Sekoia (BleepingComputer adds that a reboot stops the activity; claims B-23, B-121). iOS Class A and B set a fixed-value marker cookie as a replay guard that expires in about a minute due to a day/minute bug (B-84).'
