      - mail rule-engine / mail-processing logs for inbound messages whose sender or recipient strings hit address-replacement rules
      - process-creation events with parent lineage for the mail-processing worker
      - file-operation events by the LFT worker
      - web-server access logs for the v1 file-interface upload endpoint (large or slow requests)
      - GINA web logs for password-recovery events on accounts that never registered and for LDAP wildcard characters in account lookups
