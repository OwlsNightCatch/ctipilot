    contradicted_or_unsupported_in_earlier_findings:
    - 'S1 item 2 detection / S3 summary: "Sekoia holds the indicators ... none are published" and "Sekoia withholds IOCs, YARA rules and the compromised-site list from the public report" are too strong. The report publishes defanged delivery and exfiltration domains, IPs, AiTM clone domains and file hashes (tables and text); what it withholds is "Several indicators, including delivery hosts, exfiltration hosts, YARA rules and details of compromised websites". IOCs must stay out of entries regardless (B-79, B-80).'
    - 'S3 extended_notes "(Sekoia: a reboot ends the activity)": NOT in the Sekoia text. Sekoia says only "without establishing persistence"; the reboot sentence is BleepingComputer''s gloss (B-23, B-121).'
    - 'S1 item 2 detection: "MDM or EDR telemetry for Safari WebContent crashes" is not stated by Sekoia as an observed behaviour; Sekoia mentions a crash only in the generic PAC explanation ("triggering an improperly signed pointer will crash the process").'
    - 'S3 / S1: Class B iOS version. Sekoia''s own table labels Class B "iOS 18.5" (THN repeats it). The earlier findings carry only GTIG''s "18.4 to 18.7" for DarkSword. State both with attribution: Sekoia table 18.5; GTIG kit support 18.4-18.7. GTIG says CVE-2025-43529 is used for iOS 18.6-18.7 (CVE-2025-31277 below), which does not line up neatly with an 18.5 label; Sekoia does not address it. Do not reconcile in the entry.'
    - 'S3 relation_suggestion basis: "Class B ... with a reimplemented WebKit RCE": Sekoia says the reimplemented RCE is in the CLASS A sample ("the same RCE as the one available in the DarkSword leaked exploit kit, but reimplemented"); for Class B it says "This full exploit chain is DarkSword" and stage 2 is "nearly identical" to the kit.'
    - 'S1 item 2 exposure lists macOS, Safari, tvOS and watchOS: that comes from Apple/KEV scope. Sekoia reports exploitation only of iOS 16.7, iOS 18.5 and Chrome on Android; no Mac, Apple TV or Watch targeting is reported.'
    - 'S1 summary: "Sekoia does not state the minimum iOS 16.7.x build the chain needs": correct, but Sekoia does state the delivery filter (16.7 / 16.7.10) and the working range (16.0 to 17.4).'
    - 'S1/S3: Plerdy scale: Sekoia says "hundreds" in the introduction and "thousands" in the body and conclusion. Earlier findings carry only "thousands".'
    - 'S3 victim list: "Australian medical clinic" is named only in the conclusion (among directly compromised sites); "far-right European political party" in the vectors section is the Czech far-right movement named in the attribution section.'
    - 'S1 item 2 summary: "ENISA lists it as exploited since the same day (EPSS 0.6)" was not re-verified in this follow-up.'
    observable_behaviors_stated_by_sources:
      web_content_integrity_and_proxy:
      - a third-party tracker file served from an unchanged URL with changed bytes (Plerdy main.js, 2026-08-27 to 2026-09-03) so that pages load an extra script after window.onload (B-27, B-73)
      - existing first-party JavaScript library on a compromised site carries appended code (B-31); or the page template carries an injected script element (B-32, B-73)
      - visitor loads a script of about 2.3 MB of which about 98% is padded minified AngularJS (B-74)
      - newly registered delivery and exfiltration domains in 2026 (one created 2026-08-26, the day before the Plerdy window; B-82)
      dns_proxy_mobile_gateway:
      - phone browser POSTs a JSON object of about 394 fields (61 collectors) to a second URL with a random nonce path immediately after the script loads; the response is JavaScript that is executed (B-75)
      - for implausible devices (non-phone screen size, maxTouchPoints 0) the server answers 200 OK with an empty body (B-76)
      - iOS stages are fetched as /v1, /v2, /v3 from a nonce-path API; all classes exfiltrate by HTTPS POST to one /telemetry path on TCP port 8881 (B-77)
      - Android payload sends with libcurl and custom headers Filename and X-Device-Id (B-83)
      device_side_file_access_only_visible_with_forensic_telemetry:
      - iOS Class A reads Cookies.binarycookies files in app containers (PID sweep with sandbox container path lookup) (B-51)
      - Android payload reads Chrome profile Cookies, Login Data, History and WifiConfigStore.xml (B-62)
      not_stated_by_sekoia: No mobile EDR alerts, crash logs or MDM signals are described. No indicator of persistence (none installed).
    benign_lookalike_discriminator: none supported as a stated discriminator. Sekoia says the AngularJS padding may exist "to make the malicious script appear legitimate by embedding it within a well-known JavaScript library" (camouflage), and does not discuss lookalikes. The features Sekoia describes (late-loaded script via window.onload; roughly 2.3 MB padded file; JSON POST of several hundred fields to a nonce path whose reply is executed; empty 200 for non-phone fingerprints) can be offered as "behaviors Sekoia describes", not as a validated way to separate this from a legitimate analytics tracker.
    open_gaps:
    - Whether iOS 16.7.8-16.7.16 devices (the six Apple device families on the 16.7.x-only list) are exploitable by Class A is unresolved. Apple fixed CVE-2024-27834 in 16.7.8 (2024-05-13); Sekoia says the delivery host filters "iOS 16.7 / 16.7.10" and that the chain "should work from 16.0 to 17.4"; no fetched Apple page lists CVE-2025-43529 as fixed on iOS 16.7.x; Sekoia says up-to-date devices are safe. Do not write that devices on 16.7.8 or later are exploitable by Class A, and do not write that they are safe. Sources do not state which hardware the chain succeeds on.
    - Sekoia says nothing about iOS 16.7.x as "stuck" devices; that framing is the composer's, supported only by Apple listing a separate 16.7.x line for those device families.
    - Android fixed build numbers for CVE-2026-3910 and the Android patch level for CVE-2025-27038 were not fetched/readable.
    - 'No independent second source: THN and BleepingComputer are relays; Sekoia says Google TAG and CERT-UA contributed, neither has published. Attribution rests on Sekoia''s assessment with unpublished third-party inputs.'
    - KEV listing of CVE-2024-27834 names no campaign; the Sekoia link is inferred from timing.
