    contradicted_or_unsupported_in_earlier_findings:
    - 'S1 detection: "because GMS stores firewall configurations and credentials, treat a reachable GMS as potentially disclosed: rotate the credentials and shared secrets it holds" is not stated by the advisory, which says only "internal GMS files ... sensitive information"; it is an inference from product function. Keep it labelled as such or drop it.'
    - S1 discovery trace says the advisory was "fetched through the reader fallback" and the fixed-version table was not seen; the HTML-mode read shows the vendor Fixed Software table (no fixed version) and Credits (Pentest-Tools.com), which the earlier body omitted.
    - S1 omitted the key context that 9.5.2 is the build that fixed the August advisory (SNWLID-2026-0011) and is now itself affected with no successor; the entry should say so (claims C-22, C-23).
    - 'S1 exposure: "all GMS releases are EOL": supported by the vendor product-wide EOL announcement (Last Day of Support 2026-09-30), but the PSIRT advisory itself lists only "9.5.2 and earlier versions".'
    - S1 summary "(first published and updated 2026-11-03, CVSS 3.1 9.1)", "Workaround false", "no remediation or security update will be released" and the SQL-injection details are all confirmed by the advisory.
    - S1 discovery trace names The Hacker News and BleepingComputer headlines of 2026-11-04 for this item; they were not fetched in this follow-up and are not needed (the vendor advisory is the primary).
    observable_behaviors_stated_by_sources:
      stated: none. The advisory states no endpoint, path, request pattern, log artefact or post-exploitation behaviour; it states only that an unauthenticated network-reachable attacker may read internal GMS files (CWE-636 fail-open) and that an authenticated administrator-level (PR:H) user may reach the GMS database via SQL injection "in specific conditions".
      telemetry_class_that_follows_mechanically_not_stated: web-server / application access logs on the GMS management interface for unauthenticated requests that succeed where authentication should be required (file-read class); nothing more specific is supportable.
    benign_lookalike_discriminator: none supported
    open_gaps:
    - Which internal files are exposed is not stated anywhere; whether any PoC or write-up exists is unknown (Pentest-Tools.com is the credited finder; no write-up found).
    - 'Platform wording differs: advisory "Virtual Appliance and Windows", CVE record "Windows, Linux".'
    - No NCSC.ch / bacs.admin.ch relay; CERT-FR is the only authority relay found.
    - No statement on whether the vendor will provide any mitigation guidance; the advisory says migrate to NSM.
