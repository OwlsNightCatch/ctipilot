  - claim_id: 2cf58a8d8f
    entry: 2026-09-22/cve-2026-7273-zyxel-gs1900-red-heron-kev-exploited
    surface: "body"
    kind: cited
    text: "CVE-2026-7273 is a stack-based buffer overflow in the CGI program of Zyxel GS1900 series smart-managed switch firmware that Zyxel says lets a LAN-based, unauthenticated attacker execute OS commands through a crafted HTTP request to the web-management interface; Zyxel patched ten models on 2026-06-16, each at its own \"…(x).2C0\" build ("
    urls: ["https://www.zyxel.com/global/en/support/security-advisories/zyxel-security-advisory-for-stack-based-buffer-overflow-vulnerability-in-gs1900-series-switches-06-16-2026"]
  - claim_id: b03a3e8380
    entry: 2026-09-22/cve-2026-7273-zyxel-gs1900-red-heron-kev-exploited
    surface: "body"
    kind: cited
    text: "CISA added it to the Known Exploited Vulnerabilities catalog on 2026-09-21 ("
    urls: ["https://www.cisa.gov/news-events/alerts/2026/09/21/cisa-adds-one-known-exploited-vulnerability-catalog"]
