    surface: "body"
    kind: cited
    text: "Zyxel treats it as a separate vulnerability, CVE-2026-107441, which it fixed on 2026-10-22 in the \"…(x).3C0\" builds of all ten models and disclosed on 2026-11-03 ("
    urls: ["https://www.zyxel.com/global/en/support/security-advisories/zyxel-security-advisory-for-out-of-bounds-write-vulnerability-in-gs1900-series-switches-11-03-2026", "https://www.binarly.io/blog/zyxel-gs1900-rce-cve-2026-107441"]
