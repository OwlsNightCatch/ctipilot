  - claim_id: 6292805806
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "summary"
    kind: frontmatter
    text: "CISA added CVE-2026-111497, an out-of-bounds write in the Brotli decoder bundled with Node.js, to its Known Exploited Vulnerabilities catalog on 2026-10-27 on evidence of active exploitation, and ELLIO's sensors recorded exploit traffic against Node.js 24.22.0 on 2026-10-26, though its own copy of the attacker's chain got no shell. Node.js 22.23.4, 24.22.1 and 26.12.1 fix it, and because the flaw is in Google's decoder the PyPI packages Brotli (1.2.1) and brotlicffi (1.2.1.0), Envoy, Microsoft .NET, PHP for Windows, Ubuntu and, with Brotli inspection and TLS decryption enabled, PAN-OS 12.2, 12.1 and 11.2 firewalls carry it too; Palo Alto and Cisco report no malicious use against their own products. Broadcom lists VMware Cloud Foundation's SDDC Manager 9.1.1.x as critically affected (CVSS 3.1 9.8), with the patch pending and only workarounds available, and Splunk lists Splunk Enterprise 10.0 and lower among the products that include affected Node.js packages, with 10.2 or later as the upgrade target and its Visual Exporter app to be disabled."
  - claim_id: 5dadcddaac
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "actions[0]"
    kind: frontmatter
    text: "Update every Node.js 22.x, 24.x and 26.x runtime to 22.23.4, 24.22.1 or 26.12.1, including the Node binary inside container images (a Dockerfile that pins 24.22.0 keeps the flaw until the pin changes), and upgrade the PyPI Brotli package to 1.2.1 and brotlicffi to 1.2.1.0 wherever either is installed; judge a Node.js build by its release version, because process.versions.brotli reads 1.2.0 on patched builds too, and move any application on an end-of-life Node.js line to a supported release. On every WordPress host, upgrade the operating system's libbrotli package to a patched revision (check the package revision, because Debian and Ubuntu backport the fix into 1.1.0) and rebuild WordPress container images, since the official wordpress:latest image still carried a vulnerable libbrotli1 when Patchstack wrote."
  - claim_id: ab54d3b26a
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "actions[1]"
    kind: frontmatter
    text: "Update every Envoy proxy that has the Brotli decompressor configured to v1.40.0, v1.39.3, v1.38.6, v1.37.8 or v1.36.12; the advisory names v1.39.2, v1.38.5, v1.37.7 and v1.36.11 as vulnerable. On every VMware Cloud Foundation SDDC Manager apply Broadcom's workaround, KB460732 on 9.1.1 and KB460734 on 9.1.0, 9.0.x and 5.2.x, until its patch ships. Upgrade every Splunk Enterprise 10.0 and lower to 10.2 or higher and disable or remove the Splunk Visual Exporter app on every Splunk Enterprise instance, because the upgrade does not remediate it, and install Citrix hotfix 2609.1, 2508 CU2 LTSR or 2605.1-3 on Unicon eLux Scout."
  - claim_id: db4549048d
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "actions[2]"
    kind: frontmatter
    text: "On every PA-Series and VM-Series firewall on PAN-OS 12.2, 12.1 or 11.2 that has TLS decryption enabled, run show system setting brotli and, where it returns Enabled: yes, run set system setting brotli-encoding disable until the hotfix for the release is installed; Palo Alto's timeline of 2026-10-29 lists every PAN-OS hotfix for this flaw as released."
  - claim_id: 7cdedb7f84
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "cves[CVE-2026-111497]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-111497\", \"cvss\": \"9.2 (CVSS 4.0)\", \"status\": [\"exploited\", \"cisa-kev\", \"poc-public\", \"patch-available\"], \"affected\": \"Node.js 22.x, 24.x and 26.x before 22.23.4, 24.22.1 and 26.12.1; Google Brotli 1.0.3 to 1.2.0; PyPI Brotli up to 1.2.0; PyPI brotlicffi up to 1.2.0.2; Bun 1.0.21 to before 1.4.4; Istio before 1.29.9, 1.30.6 and 1.31.2; Envoy v1.39.2, v1.38.5, v1.37.7 and v1.36.11 with the Brotli decompressor configured; .NET before 8.0.33, 9.0.22 and 10.0.14 where Brotli data from untrusted parties is decompressed; PAN-OS 12.2 before 12.2.4-h1, 12.1 before 12.1.4-h13, 12.1.7-h11 and 12.1.10-h3, and 11.2 before 11.2.4-h23, 11.2.7-h23, 11.2.10-h17, 11.2.13-h4 and 11.2.16-h1, on PA-Series and VM-Series firewalls with Brotli inspection and TLS decryption enabled (PAN-OS 11.1 and 10.2 and the management interface are not affected); PHP for Windows builds without the -1 suffix, through the cURL extension when automatic decompression is enabled; Ubuntu, Debian and Alpine brotli packages and the Ruby brotli gem before the fixed builds listed; VMware Cloud Foundation SDDC Manager 9.1.1 (critical, CVSS 3.1 9.8) and 9.1.0, 9.0.x and 5.2.x (important, 7.5); Palo Alto Networks Prisma Cloud Application Security Transporter Client before 0.2.9; Splunk Enterprise 10.0 and lower, Splunk Visual Exporter (every Splunk Enterprise version), Splunk SOAR Automation Broker, Splunk UBA and Splunk Attack Analyzer, which Splunk lists as including packages affected by this and three further Node.js flaws; Citrix Unicon eLux Scout On-Prem, Scout On-Prem LTSR and Scout Cloud Gateway On-Prem (no version range stated)\", \"fixed\": \"Node.js 22.23.4, 24.22.1, 26.12.1; Google Brotli 1.0.10, 1.1.1, 1.2.1; PyPI Brotli 1.2.1; PyPI brotlicffi 1.2.1.0; Bun 1.4.4; Istio 1.29.9, 1.30.6, 1.31.2; Envoy v1.40.0, v1.39.3, v1.38.6, v1.37.8, v1.36.12; .NET 8.0.33, 9.0.22, 10.0.14; PAN-OS hotfixes 12.2.4-h1, 12.1.4-h13, 12.1.7-h11, 12.1.10-h3, 11.2.4-h23, 11.2.7-h23, 11.2.10-h17, 11.2.13-h4 and 11.2.16-h1 (all released, as read on 2026-10-29); PHP for Windows 8.5.12-1, 8.4.27-1, 8.3.36-1, 8.2.35-1; Ubuntu brotli 1.2.0-4ubuntu0.1 (26.10), 1.2.0-3ubuntu0.1 (26.04), 1.1.0-2ubuntu0.1 (24.04), 1.0.9-2ubuntu0.1 (22.04), ESM 1.0.7-6ubuntu0.1+esm1 (20.04, whose nodejs package stays vulnerable); Debian brotli 1.0.9-2+deb12u1 (bookworm) and 1.1.0-2+deb13u1 (trixie); Alpine brotli 1.2.1-r0 (edge, 3.24, 3.23) and 1.1.1-r0 (3.21); Ruby brotli gem 0.9.1 and 0.9.2; SDDC Manager none yet, patch pending, workarounds KB460732 (9.1.1) and KB460734 (9.1.0, 9.0.x, 5.2.x); Prisma Cloud Application Security Transporter Client 0.2.9; Splunk Enterprise 10.2 or higher for the bundled Node.js runtime (no fixed 10.0 build or date), Splunk Visual Exporter none (disable or remove the app), no fix stated for the other Splunk products; Citrix Scout On-Prem hotfix 2609.1, Scout On-Prem LTSR 2508 CU2 LTSR, Scout Cloud Gateway On-Prem 2605.1-3\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
