    entry: 2026-11-05/windows-iscsi-target-server-without-chap-disk-access
    surface: "headline"
    kind: frontmatter
    text: "SpecterOps: iSCSI Target Server without CHAP lets a host that knows the target and initiator names read shared disks"
  - claim_id: 5c05a51be4
    entry: 2026-11-05/windows-iscsi-target-server-without-chap-disk-access
    surface: "summary"
    kind: frontmatter
    text: "SpecterOps (2026-11-04) shows that a Windows iSCSI Target Server configured as a common cluster guide describes, with the optional CHAP step skipped, accepts a login from any host that knows the target host, the target name and an authorised initiator name, and the post says the host and the names can be found. The attacker then reads the shared disk below file-system permissions; where it holds a Hyper-V domain controller's virtual disk, the directory database and local credential stores are exposed. CHAP, network segmentation and volume encryption are the levers."
  - claim_id: b77522d324
    entry: 2026-11-05/windows-iscsi-target-server-without-chap-disk-access
    surface: "actions[0]"
    kind: frontmatter
    text: "List the computers in Active Directory that carry the service principal name the iSCSI Target Server registers and every host that listens on TCP 3260, then enable CHAP on each target and restrict TCP 3260 to the addresses of the cluster nodes, starting with targets whose volumes hold Hyper-V disks of domain controllers."
  - claim_id: 8d5e42ff7a
    entry: 2026-11-05/windows-iscsi-target-server-without-chap-disk-access
    surface: "body"
    kind: cited
    text: "SpecterOps shows that the Windows iSCSI Target Server role, set up as a community cluster guide describes it with the optional CHAP step skipped, accepts a login from any host that knows the target host, the target name and an authorised initiator name ("
    urls: ["https://specterops.io/blog/2026/11/04/unauthenticated-iscsi-target-server/"]
  - claim_id: 480a99e770
    entry: 2026-11-05/windows-iscsi-target-server-without-chap-disk-access
    surface: "body"
    kind: cited
    text: "The post says the role registers a service principal name on its computer account, so a directory query lists the target hosts, that initiator names are built from the host's DNS name and are therefore predictable, and that in the author's experience the service has no rate limiting or brute-force protection ("
    urls: ["https://specterops.io/blog/2026/11/04/unauthenticated-iscsi-target-server/"]
  - claim_id: 4171bdd43c
    entry: 2026-11-05/windows-iscsi-target-server-without-chap-disk-access
    surface: "body"
    kind: cited
    text: "Access is below the file system, so NTFS permissions do not apply, and volume encryption such as BitLocker defeats it ("
    urls: ["https://specterops.io/blog/2026/11/04/unauthenticated-iscsi-target-server/"]
  - claim_id: f33aecabf1
    entry: 2026-11-05/windows-iscsi-target-server-without-chap-disk-access
    surface: "body"
    kind: cited
    text: "The worst case the post shows is a volume that holds a Hyper-V domain controller's virtual disk, from which the local credential stores and the directory database can be taken ("
    urls: ["https://specterops.io/blog/2026/11/04/unauthenticated-iscsi-target-server/"]
  - claim_id: 342df4c5ee
    entry: 2026-11-05/windows-iscsi-target-server-without-chap-disk-access
    surface: "body"
    kind: cited
    text: "**Exposure:** Windows Server hosts that run the iSCSI Target Server role without CHAP, found by the service principal name the role registers and by a listener on TCP 3260 ("
    urls: ["https://specterops.io/blog/2026/11/04/unauthenticated-iscsi-target-server/", "https://www.pentestpartners.com/security-blog/an-interesting-route-to-domain-admin-iscsi/"]
  - claim_id: d24cea07eb
    entry: 2026-11-05/windows-iscsi-target-server-without-chap-disk-access
    surface: "body"
    kind: cited
    text: "The author's own research puts the common uses with clustered resources such as Hyper-V, SQL Server and Exchange database availability groups, followed by third-party backup products ("
    urls: ["https://specterops.io/blog/2026/11/04/unauthenticated-iscsi-target-server/"]
  - claim_id: 0f8cd59dcd
    entry: 2026-11-05/windows-iscsi-target-server-without-chap-disk-access
    surface: "body"
    kind: cited
    text: "What the mechanism implies, not stated by the post: iSCSI traffic to TCP 3260 on a target host from a source that is not one of its cluster nodes, and a login that presents a listed initiator name from another source address, because the access list keys on initiator names that an impersonator can present ("
    urls: ["https://specterops.io/blog/2026/11/04/unauthenticated-iscsi-target-server/"]
  - claim_id: 72c6aa7802
    entry: 2026-11-05/windows-iscsi-target-server-without-chap-disk-access
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** enable CHAP on every iSCSI target, and isolate iSCSI traffic with segmentation and host-based firewalling, which the post calls arguably the most effective step; the post says IPsec mitigates network sniffing, and BitLocker or similar volume encryption makes the stolen disk unreadable ("
    urls: ["https://specterops.io/blog/2026/11/04/unauthenticated-iscsi-target-server/"]
