    entry: 2026-09-22/cve-2026-7273-zyxel-gs1900-red-heron-kev-exploited
    surface: "body"
    kind: cited
    text: "The same actor ran a WordPress chain against at least 49 organizations in 29 countries that cost one unnamed Western government more than 18,000 database records ("
