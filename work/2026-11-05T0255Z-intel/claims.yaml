    entry: 2026-10-31/cve-2026-98432-linux-kernel-tcp-uaf-mptcp-remote-root
    surface: "headline"
    kind: frontmatter
    text: "Linux TCP use-after-free: Citrix XenServer and XCP-ng fixes are out, WatchGuard and Fortinet still have none"
  - claim_id: b18561bce3
    entry: 2026-10-31/cve-2026-98432-linux-kernel-tcp-uaf-mptcp-remote-root
    surface: "summary"
    kind: frontmatter
    text: "The Linux kernel CVE team published CVE-2026-98432 on 2026-10-15, a use-after-free in the IPv4 TCP connection setup path that dates to Linux 4.4 and is reached by a SYN packet carrying IP options; the CNA scores it CVSS 9.8. Anthropic reports that Claude wrote an exploit giving a remote, unauthenticated attacker root on servers with a multipath TCP (MPTCP) listener, which CloudLinux's kernel team could not reproduce; the Go team says the bug is not specific to MPTCP and Akamai that disabling MPTCP does not prevent exploitation, and no source reports attacks. Citrix rates its XenServer 8.4 and 9 bulletin Critical and names fixes for Workload Balancing and Conversion Manager, XCP-ng released a kernel fix, MikroTik's RouterOS 7.25.1 and 7.24.6 list the CVE, Red Hat, Debian, CIQ and Amazon Linux kernels are fixed and Ubuntu's were still in progress on 2026-11-04, while WatchGuard (Fireware OS, AP, Dimension) and Fortinet list their products as unresolved or under investigation without a fixed build."
  - claim_id: f63305b3e8
    entry: 2026-10-31/cve-2026-98432-linux-kernel-tcp-uaf-mptcp-remote-root
    surface: "actions[0]"
    kind: frontmatter
    text: "On every internet-facing Linux server and every XenServer or XCP-ng host with its Workload Balancing and Conversion Manager appliances, install the vendor's fix and reboot as soon as it ships, then confirm the running version; Red Hat, Debian, CIQ, Amazon Linux, XCP-ng, MikroTik and Citrix updates are out, and XCP-ng says that a host which cannot reboot at once should take its iptables-based mitigation first and the update later."
  - claim_id: 9e7598e98f
    entry: 2026-10-31/cve-2026-98432-linux-kernel-tcp-uaf-mptcp-remote-root
    surface: "actions[1]"
    kind: frontmatter
    text: "On hosts that cannot reboot yet, drop IPv4 TCP packets that carry IP options ahead of the TCP stack as CIQ, AWS and Vates describe, after testing on one non-production host because it also drops legitimate option-bearing traffic; disabling MPTCP alone does not close the path."
