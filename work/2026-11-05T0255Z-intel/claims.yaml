    entry: 2026-09-22/cve-2026-7273-zyxel-gs1900-red-heron-kev-exploited
    surface: "body"
    kind: cited
    text: "Binarly calls it a zero-day exploited in the wild because the recovered exploit matches the one GreyNoise described; Zyxel's two advisories say nothing about exploitation, CISA's catalog of 2026-11-04 lists CVE-2026-7273 and not the new flaw, and BleepingComputer says it is unclear whether the exploit was built to bypass the June fix ("
    urls: ["https://www.binarly.io/blog/zyxel-gs1900-rce-cve-2026-107441", "https://www.binarly.io/advisories/brly-2026-057", "https://www.bleepingcomputer.com/news/security/zyxel-fixes-zero-day-exploited-to-hack-nearly-1-000-network-switches/", "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"]
  - claim_id: 9edb22d7c7
    entry: 2026-09-22/cve-2026-7273-zyxel-gs1900-red-heron-kev-exploited
    surface: "body"
    kind: cited
    text: "On or about 17 August 2026 the actor used a PyArmor-obfuscated Python tool with a deterministic single-request mode and an ASLR-brute-force mode averaging roughly 2,048 attempts, and exfiltrated configuration data, networking information and hashed root-level credentials from 996 switches in 48 countries, making the switch's on-device shell fetch a TFTP-delivered collector script and stage the harvested data to a file on the switch ("
    urls: ["https://www.greynoise.io/blog/open-season-on-kapibala-attacker-steals-government-records-wordpress-exploitation"]
  - claim_id: 6cf204a877
    entry: 2026-09-22/cve-2026-7273-zyxel-gs1900-red-heron-kev-exploited
    surface: "body"
    kind: cited
    text: "\"While the credentials were hashed, 564 of the victims had factory default credentials\" ("
    urls: ["https://www.greynoise.io/blog/open-season-on-kapibala-attacker-steals-government-records-wordpress-exploitation"]
