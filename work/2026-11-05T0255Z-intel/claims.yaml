    surface: "body"
    kind: cited
    text: "**Exposure:** every GS1900-8, -8HP, -10HP, -16, -24, -24E, -24EP, -24HPv2, -48 and -48HPv2 at or below its \"…(x).2C0\" build, which includes every build Zyxel advertised as the June fix ("
