  - claim_id: 1704bf7bbb
    entry: 2026-09-22/cve-2026-7273-zyxel-gs1900-red-heron-kev-exploited
    surface: "summary"
    kind: frontmatter
    text: "CISA lists CVE-2026-7273, a pre-auth stack overflow in the CGI of Zyxel GS1900 series switches patched in June in the .2C0 builds, after GreyNoise caught an actor it assesses is the same as or related to Red Heron exfiltrating configurations and hashed root credentials from 996 switches in 48 countries from about 17 August, 57% of them still on factory-default credentials. Binarly shows the recovered exploit works against all ten June-fixed builds because it targets a separate out-of-bounds write, CVE-2026-107441, which Zyxel fixed in the .3C0 builds on 2026-10-22 and disclosed on 2026-11-03; Binarly calls it an exploited zero-day on the strength of the exploit match and BleepingComputer repeats the label, while CISA's catalog lists CVE-2026-7273 and not the new flaw."
  - claim_id: 52b6980490
    entry: 2026-09-22/cve-2026-7273-zyxel-gs1900-red-heron-kev-exploited
    surface: "actions[0]"
    kind: frontmatter
    text: "Install each Zyxel GS1900 switch's \"…(x).3C0\" build now (2.90(AAHL.3)C0 on the GS1900-24, for example), including switches already moved to the June \"…(x).2C0\" build, which Binarly shows still carries the flaw the recovered exploit targets, and audit and rotate any switch still on its factory-default admin credentials: GreyNoise found 564 of 996 exploited switches (57%) had never had theirs changed, which lets the actor re-enter even after the hashed credential set is rotated."
