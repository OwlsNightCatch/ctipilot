    entry: 2026-11-05/seppmail-gateway-15-1-1-unauth-root-rce-and-file-access
    surface: "summary"
    kind: frontmatter
    text: "SEPPmail's patch release 15.1.1 of 2026-11-03 fixes five flaws in the Secure Email Gateway, with NCSC.ch as the CNA: CVE-2026-114424 lets an unauthenticated remote sender run operating-system commands as root through an active address-replacement rule that uses message-derived data, and CVE-2026-114425 lets one disclose, move or delete files as root when Large File Transfer is enabled (both CVSS 4.0 9.2). The vendor says 15.0.7 was the last 15.0 release, so 15.0.x gateways must move to the 15.1 branch; no source reports exploitation."
  - claim_id: 2650f8a027
    entry: 2026-11-05/seppmail-gateway-15-1-1-unauth-root-rce-and-file-access
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade every SEPPmail Secure Email Gateway to 15.1.1 now, moving 15.0.x gateways to the 15.1 branch because 15.0.7 is the last 15.0 release, and check each gateway's active address-replacement rules for values taken from the message and its Large File Transfer setting, the two conditions the CNA names."
