    entry: 2026-09-22/cve-2026-7273-zyxel-gs1900-red-heron-kev-exploited
    surface: "body"
    kind: cited
    text: "Zyxel's advisories say the attacker is LAN-based, while Binarly and BleepingComputer say network access to the web interface is enough ("
    urls: ["https://www.zyxel.com/global/en/support/security-advisories/zyxel-security-advisory-for-out-of-bounds-write-vulnerability-in-gs1900-series-switches-11-03-2026", "https://www.binarly.io/advisories/brly-2026-057", "https://www.bleepingcomputer.com/news/security/zyxel-fixes-zero-day-exploited-to-hack-nearly-1-000-network-switches/"]
  - claim_id: e9abbe05a2
    entry: 2026-09-22/cve-2026-7273-zyxel-gs1900-red-heron-kev-exploited
    surface: "body"
    kind: cited
    text: "**Detection:** an outbound TFTP request (UDP/69, or a non-standard high port, as observed here) from a switch's management IP is a strong hunt signal, as is the switch's on-device shell invoking an interpreter against a file just retrieved via TFTP ("
    urls: ["https://www.greynoise.io/blog/open-season-on-kapibala-attacker-steals-government-records-wordpress-exploitation"]
  - claim_id: 15e71f685d
    entry: 2026-09-22/cve-2026-7273-zyxel-gs1900-red-heron-kev-exploited
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** install each switch's \"…(x).3C0\" build now, not the \"…(x).2C0\" build the June advisory names, which still carries the flaw Binarly says is exploited ("
    urls: ["https://www.zyxel.com/global/en/support/security-advisories/zyxel-security-advisory-for-out-of-bounds-write-vulnerability-in-gs1900-series-switches-11-03-2026", "https://www.binarly.io/blog/zyxel-gs1900-rce-cve-2026-107441"]
  - claim_id: f2a9f7d98b
