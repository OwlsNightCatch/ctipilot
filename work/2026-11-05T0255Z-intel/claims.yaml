    surface: "body"
    kind: derived
    text: "GreyNoise describes the harvested data staged to a file on the switch and names no implant, so treat any GS1900 whose web interface was reachable on a \"…(x).2C0\" or earlier build as a candidate for a compromise assessment centred on credential rotation rather than malware removal."
