    entry: 2026-11-05/sophos-rca-fake-interview-repo-vscode-beavertail-edr-gap
    surface: "headline"
    kind: frontmatter
    text: "Sophos RCA: fake interview repo ran BeaverTail via VS Code settings; dead EDR agent, OAuth grant survived revocation"
  - claim_id: b26413cb64
    entry: 2026-11-05/sophos-rca-fake-interview-repo-vscode-beavertail-edr-gap
    surface: "summary"
    kind: frontmatter
    text: "Sophos discloses, as the victim, that on 2026-09-14 an employee cloned a repository presented as a job-interview coding assignment and opened it as a trusted VS Code workspace; its settings replaced the terminal profile, so opening a terminal downloaded and ran the BeaverTail loader and the in-memory InvisibleFerret backdoor on a Mac whose Sophos Endpoint agent had not reported since 2026-06-11. A third-party OAuth authorization on the employee's code-platform account survived the session revocation and read two internal repositories 27 times; Sophos found no other host and no customer impact."
  - claim_id: 1f3b4b360d
    entry: 2026-11-05/sophos-rca-fake-interview-repo-vscode-beavertail-edr-gap
    surface: "body"
    kind: cited
    text: "On 2026-09-14 a Sophos employee cloned a public repository presented as a job-interview coding assignment and opened it as a workspace in VS Code; a weaponized workspace settings file replaced the editor's integrated terminal profile with a command that downloads and runs a remote script in a loop, delivery relied on the user opening the workspace as trusted, and no exploit or vulnerability was involved ("
    urls: ["https://www.sophos.com/en-us/trust/root-cause-analyses/inc-2026-002"]
  - claim_id: c730b2ec10
    entry: 2026-11-05/sophos-rca-fake-interview-repo-vscode-beavertail-edr-gap
    surface: "body"
    kind: cited
    text: "Opening a terminal was enough: a shell script fetched a JavaScript component and a package manifest into a hidden directory in the user profile, a package-manager install ran, the JavaScript ran under Node.js and the final-stage backdoor lived in memory only, with no persistence found ("
    urls: ["https://www.sophos.com/en-us/trust/root-cause-analyses/inc-2026-002"]
  - claim_id: 9d2d22b12c
    entry: 2026-11-05/sophos-rca-fake-interview-repo-vscode-beavertail-edr-gap
    surface: "body"
    kind: cited
    text: "SophosLabs identified the BeaverTail loader followed by the InvisibleFerret backdoor, able to steal browser-stored credentials, keychain data and SSH keys, and the JavaScript stage sent the process environment to an attacker web endpoint on a cloud application-hosting service ("
    urls: ["https://www.sophos.com/en-us/trust/root-cause-analyses/inc-2026-002"]
  - claim_id: 7edb519716
    entry: 2026-11-05/sophos-rca-fake-interview-repo-vscode-beavertail-edr-gap
    surface: "body"
    kind: cited
    text: "The Sophos Endpoint agent was installed but its core services were not running, so it enforced nothing and reported nothing; the device was last seen in Sophos Central on 2026-06-11, the cause is still under investigation, and SophosLabs says a working agent would have blocked the chain at the first dropped file ("
    urls: ["https://www.sophos.com/en-us/trust/root-cause-analyses/inc-2026-002"]
  - claim_id: 0d4e011735
    entry: 2026-11-05/sophos-rca-fake-interview-repo-vscode-beavertail-edr-gap
    surface: "body"
    kind: cited
    text: "A third-party application authorization on the employee's source-code platform account survived the session revocation and password reset of 2026-09-15 and made 27 read requests against two internal repositories from an address new to the user until it was revoked on 2026-09-16; Sophos found no other host, no cloud activity and no customer impact ("
    urls: ["https://www.sophos.com/en-us/trust/root-cause-analyses/inc-2026-002"]
  - claim_id: c11fef5c3c
    entry: 2026-11-05/sophos-rca-fake-interview-repo-vscode-beavertail-edr-gap
    surface: "body"
    kind: cited
    text: "The analysis names no group; Sophos CTU says the technique matches the tradecraft of NICKEL ALLEY, which it describes as running the Contagious Interview campaign of fake companies, fake recruiters and malicious code repositories ("
    urls: ["https://www.sophos.com/en-us/blog/fake-coding-test-reaches-security-company"]
  - claim_id: 12de9f48f9
    entry: 2026-11-05/sophos-rca-fake-interview-repo-vscode-beavertail-edr-gap
    surface: "body"
    kind: cited
    text: "**Exposure:** developer workstations whose users clone and open repositories from outside parties, recruitment pretexts included, in an editor that trusts the workspace; and any managed device that is compliant in identity and device management but does not report to the endpoint console, as Sophos's fleet review found ("
    urls: ["https://www.sophos.com/en-us/trust/root-cause-analyses/inc-2026-002"]
  - claim_id: 6cbd6f833a
    entry: 2026-11-05/sophos-rca-fake-interview-repo-vscode-beavertail-edr-gap
    surface: "body"
    kind: cited
    text: "**Detection:** in macOS process lineage, the code editor's integrated terminal launching a download-and-run command that a cloned workspace's settings define, followed by a hidden directory in the user profile and a package-manager install run from it ("
    urls: ["https://www.sophos.com/en-us/trust/root-cause-analyses/inc-2026-002"]
  - claim_id: 5db23521ac
    entry: 2026-11-05/sophos-rca-fake-interview-repo-vscode-beavertail-edr-gap
    surface: "body"
    kind: cited
    text: "In identity telemetry, a device that still signs in but does not report to the endpoint console is a coverage gap; a third-party authorization reading repositories from an address new to the user is the second signal ("
    urls: ["https://www.sophos.com/en-us/blog/fake-coding-test-reaches-security-company", "https://www.sophos.com/en-us/trust/root-cause-analyses/inc-2026-002"]
  - claim_id: bf8b349bac
    entry: 2026-11-05/sophos-rca-fake-interview-repo-vscode-beavertail-edr-gap
    surface: "body"
    kind: cited
    text: "**Triage:** a terminal profile normally launches a shell executable; this one launched a command that downloads and runs a remote script in a loop; it came from the settings of a freshly cloned repository ("
    urls: ["https://www.sophos.com/en-us/trust/root-cause-analyses/inc-2026-002"]
  - claim_id: b58079c409
    entry: 2026-11-05/sophos-rca-fake-interview-repo-vscode-beavertail-edr-gap
    surface: "body"
    kind: cited
    text: "Sophos's lasting controls are to require the endpoint agent for device compliance, to monitor for managed devices that stop reporting, and to revoke application authorizations as part of credential containment, not only sessions and passwords ("
    urls: ["https://www.sophos.com/en-us/trust/root-cause-analyses/inc-2026-002"]
  - claim_id: 7e4f91a19c
    entry: 2026-11-05/sophos-rca-fake-interview-repo-vscode-beavertail-edr-gap
    surface: "body"
    kind: uncited
    text: "Two gaps lengthened the exposure."
  - claim_id: 17718e2056
    entry: 2026-11-05/sophos-rca-fake-interview-repo-vscode-beavertail-edr-gap
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** treat a coding assignment or repository from a recruiter or interviewer as untrusted code, because here the compromise needed only a trusted workspace and an opened terminal."
