    telemetry_the_post_states: NONE. The post names no Windows event IDs, no Zeek or Wireshark observations, no iSCSI target logs and no detection section at all. Its only defender content is the three numbered recommendations (A21-A23) and the BitLocker remark (A11). Anything an entry says about detection is a derived concept and must be framed as such.
    defenses_named_by_post:
    - defense: CHAP
      verbatim: Enable CHAP authentication for Windows iSCSI
      claim: A21
      stops_per_sources: 'A6: without CHAP the login needs only host plus target name plus initiator name. A40: the author''s tool does not support CHAP targets.'
      post_does_not_say: No configuration steps, nothing on CHAP secret strength, and nothing on whether discovery requests are still answered when CHAP is on.
    - defense: IPsec
      verbatim: IPSEC is available to mitigate any sort of network sniffing
      claim: A22
      stops_per_sources: Framed as a sniffing mitigation only.
      post_does_not_say: Does not claim IPsec stops the unauthenticated login or the impersonation; PTP lists it as an alternative to segregation (A33).
    - defense: Segmentation and host-based firewalling
      verbatim: Arguably the most effective thing you can do is have proper network segmentation and host-based firewall configurations to isolate the drive
      claim: A23
      stops_per_sources: 'PTP (2016): the same class of attack fails if TCP 3260 cannot be routed from the user''s machine (A34).'
      post_does_not_say: No port number, rule examples or VLAN design.
    - defense: BitLocker or a similar volume encryption
      verbatim: It’s important to note that if BitLocker or a similar solution was used to encrypt the drive, this obviously becomes invalid.
      claim: A11
      stops_per_sources: The post says the below-NTFS read 'becomes invalid' when the drive is encrypted.
      post_does_not_say: Not in the numbered Defensive Recommendations list; does not say which layer must be encrypted (the iSCSI volume or the VM disk) or how keys work for clustered use.
    microsoft_position:
      post_says: Nothing. No Microsoft report, response, fix, CVE, documentation change or won't-fix is mentioned. Its only Microsoft-related comment is the open question about the SPN (A25).
      microsoft_pages_fetched: Learn 'iSCSI Target Server Overview' has no security content; the Learn training module states CHAP and reverse CHAP are supported (A41, A42). Neither mentions this research.
      searches: Two WebSearches (Microsoft CHAP guidance; the research title plus a Microsoft response) found no advisory, CVE or MSRC statement. Legacy 2008 R2-era TechNet pages for the older Microsoft iSCSI Software Target were listed by search but not fetched.
      conclusion: No Microsoft statement found. 'No CVE or patch exists' in the earlier finding is an absence in the sources read, not a statement by anyone.
    inventory_handle: 'Role: the iSCSI Target Server role service of File and Storage Services (A1). AD handle: the SPN the service registers on the host computer account when it first starts (A7); the SPN string is NOT stated in the post and a WebSearch for it found nothing, so write ''the SPN the iSCSI Target Server service registers'', never a guessed class. Network handle: TCP 3260 (PTP, A29).'
    consistency_checks_against_earlier_finding:
    - 'Supported: role, CHAP optional and skipped by the followed guide (A4, A5), host/target/initiator names suffice without CHAP (A6), initiator names derive from host names (A9), no rate limiting observed (A10), below-NTFS access and encryption caveat (A11), Hyper-V disk worst case (A15, A18), the three defences (A21-A23), not tested in production (A24), BHE 50 percent figure (A26, vendor telemetry), author''s use-case research is desk research (A27), prior-art credit (A28).'
    - 'Unsupported / earlier agent''s inference: extended_notes ''Detection: network telemetry for iSCSI Discovery sessions and logins from hosts that are not on a target''s access list ... unexpected access to the VHDX files'' is not in the post. ''Hosts not on the access list'' is also a weak discriminator because the list is keyed on the initiator name (A3) and an impersonator presents a listed name; the mechanically sound derived discriminator is the same initiator name logging in from a source address that is not the node that normally owns it.'
    - 'Unsupported characterisation: ''design weakness, not a CVE'' and ''no CVE or patch exists because the behaviour is the default when CHAP is not configured'' are the earlier agent''s wording; the post says only that CHAP is an optional setup step (A4) and is silent on Microsoft.'
    - 'Nuance: the guide the post followed is a community Samba-wiki lab guide (A5), not a Microsoft guide; the earlier ''common cluster guide'' is correct but should name its origin if mentioned.'
    - 'Techniques: the post gives no ATT&CK ids. T1039 (Data from Network Shared Drive) is a weak fit for a below-file-system block read; T1018 (SPN-based host discovery), T1003.003 and T1003.002 are mechanically supportable.'
    - The BloodHound Enterprise statistic (about half of its customer tenants, maximum close to 700 computers) is recorded in A26 as vendor telemetry and must stay out of the headline.
    observable_behaviors_stated:
    - 'AD: an LDAP query for the iSCSI Target Server SPN (A7) - no log named.'
    - 'Network: iSCSI traffic to the target host on TCP 3260 (A29) from a host that is not a configured cluster node - no sensor named.'
    - 'Storage: the author''s tool is read-only (A35); the post shows a stolen domain-controller disk image as the worst case (A15, A18).'
    benign_lookalike_discriminator: none supported by the sources. Legitimate cluster nodes use the same target over the same port with the same initiator-name access list; the only available discriminator is the derived source-address check described above.
