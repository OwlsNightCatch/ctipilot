    ordered_timeline_utc:
    - '2026-06-11: agent last seen in Sophos Central; afterwards it stopped functioning and reporting (cause undetermined, under investigation) [B19, B18]'
    - '2026-09-10 to 2026-09-11: browser identity telemetry recorded the corporate password entered on a public code platform sign-in page, including during a third-party ''sign in with'' authorization for a coding-practice website [B20]'
    - '2026-09-14 15:17:59: repository presented as a coding assignment cloned and opened as a (trusted) VS Code workspace [B21, B7]'
    - '2026-09-14 15:19:31: workspace settings ran when a terminal opened; first- and second-stage files written to the profile [B22]'
    - '2026-09-14 15:24:33: user granted VS Code Full Disk Access [B23]'
    - '2026-09-14 15:36:11: package-manager install from the payload directory; final-stage backdoor in memory from here [B24]'
    - '2026-09-15 13:37: industry partner''s report; incident opened; device found not reporting to Sophos Central [B25]'
    - '2026-09-15 afternoon: sessions revoked, password reset, device moved to non-compliant group [B26]; the surviving OAuth authorization made 27 read requests against two internal repositories (actor undetermined) [B27]'
    - '2026-09-15 18:05: device rebooted, ending the in-memory implant [B28]'
    - '2026-09-15 to 2026-09-16: SophosLabs analysis; estate-wide indicator sweep, no other host'
    - '2026-09-16 14:52: authorization revoked and code-organization access removed [B29]'
    - '2026-09-17 to 2026-09-22: endpoint engineering confirmed the agent''s core services were not running; fleet-wide review began [B30]'
    - '2026-09-24: fresh agent installed, device isolated, replacement issued, incident closed [B31]'
    - '2026-11-04: Sophos blog published, linking the RCA [B46]'
    vscode_behavior:
      stated_by_sophos: A weaponized workspace settings file replaced the editor's integrated terminal profile with a command that downloads and runs a remote script in a loop; the workspace was opened as a TRUSTED VS Code workspace; opening a terminal was enough (B3, B5, B7, B8).
      setting_key_name: NOT STATED by Sophos in either page. Do not name a key or file path as Sophos's statement.
      workspace_trust_state: Trusted (B7, B8). Sophos draws no explicit Workspace Trust lesson and gives no instruction about Restricted Mode.
      background_from_microsoft_docs: Unfamiliar folders open in Restricted Mode, where the terminal is blocked behind a trust prompt and a set of workspace settings is disabled (B56-B59). This explains why the trust decision is the control point; it is Microsoft's documentation, not Sophos's finding.
    sophos_lessons_verbatim:
      identity_endpoint_correlation: B48 (blog), B41, B45 (RCA)
      workspace_trust: none stated by Sophos (see vscode_behavior)
      edr_health_monitoring: 'B45: ''a silent agent failure goes unnoticed unless it is monitored. The lasting controls are to require the endpoint agent for device compliance, to monitor for managed devices that stop reporting, and to revoke application authorizations as part of credential containment.''; also B42, B43'
      oauth_grant_review: B44 (only a post-incident review item) and B45 (revoke application authorizations as part of credential containment); the second gap statement is B18
    attribution_wording:
      rca: 'B14: ''No attribution to a named group is made or implied.'''
      blog: 'B53: Sophos CTU says NICKEL ALLEY runs the Contagious Interview campaign and ''The VS Code technique used against us matches its tradecraft.'' B47: not claimed to be the Binance malware; employment-themed social engineering is used by multiple North Korean threat groups.'
      assessment: A tradecraft match asserted by the victim's own threat-research unit, no confidence level stated, no infrastructure or code-overlap evidence given. Compose as 'Sophos CTU says the technique matches NICKEL ALLEY tradecraft; the RCA names no group', never as an attribution of the incident.
    contradicts_or_unsupported_in_earlier_findings:
    - 'SOURCE DATE: findings.S3 lists the RCA as dated 2026-09-24. That is the incident-closed date inside the RCA, not a publication date. The RCA page is undated; cite it without a publication date, or as ''published by 2026-11-04'' (the blog of that date links it).'
    - 'SCOPE LOSS: findings.S3 summarised from an `extract` capture that truncated the RCA''s Analysis and Resolution sections. It therefore lacks: the trusted-workspace statement (B7, B8), the download-and-run-in-a-loop terminal profile (B5), lure rotation (B6), about 100 wallet extensions (B12), the no-attribution sentence (B14), the corrective actions (B42, B43), the OAuth post-incident review item (B44), the still-open root cause of the agent failure (B18) and the ATT&CK ids Sophos itself states (T1204, T1059.004, T1105, T1059.007, T1071.001, T1041, T1555.001, T1555.003, T1552.004).'
    - 'TIMING: the blog says the loader and backdoor were running ''within two minutes'' (B46). The RCA timeline is finer: settings ran 15:19:31 (about 1.5 minutes after the 15:17:59 clone), Full Disk Access was granted 15:24:33, and the package-manager install that marks the in-memory final stage was 15:36:11, about 16.7 minutes after the settings ran. Trust the RCA timeline; ''two minutes'' only holds for the first-stage file write.'
    - 'AGENT DATE: S3 says the agent ''stopped working on 11 June''. The RCA says the device was LAST SEEN on 11 June and the agent stopped reporting after it; the cause is undetermined and under investigation (B18, B19).'
    - 'DETECTION WORDING: S3 says ''the first dropped file and the delivery domain were already detected''. The RCA says a functioning agent would have blocked at the first dropped file and the domain was on the block list (B17); the agent was not running, so nothing fired. Signature coverage existed; no detection event occurred.'
    - 'OAUTH TIMING: S3 says the authorization made 27 read requests ''until it was revoked on 16 September''. The RCA puts the 27 requests on 15 September (after the afternoon revocation) and says no further use was observed after revocation on 16 September 14:52 (B27, B35, B40). The RCA does not state how the reads were detected, and does not say the 10-11 September ''sign in with'' authorization is the same grant; do not link them.'
    - 'ATTRIBUTION: S3''s relation_suggestion incident -> campaign:contagious-interview is acceptable only as an overlap (B53); the RCA states no attribution (B14).'
    - 'TELEMETRY NAMING: S3''s extended_notes name macOS TCC grants and identity-provider logs. The RCA says only ''VS Code was granted Full Disk Access'' (no TCC or log source) and ''Browser identity telemetry'' (browser-side, not named as IdP logs). Keep Sophos''s wording.'
    - 'BLOG CLAIMS RELAYED, NOT VERIFIED HERE: the Binance theft figures and FBI attribution (B54) and the joint-advisory scale numbers (B55) are Sophos relaying other parties. Keep them out of the entry or attribute them as relayed.'
    observable_behaviors_stated:
    - 'Process lineage on macOS: the code editor opens an integrated terminal whose profile comes from the cloned workspace and launches a download-and-run command (B3, B5, B8); a shell script then fetches a JavaScript component and a package manifest into a hidden directory in the user profile (B9); a package-manager dependency install runs from that directory and the JavaScript runs under Node.js (B10, B24).'
    - 'Privacy permission: the editor was granted Full Disk Access about five minutes after the settings ran, giving its child processes broad file access (B23).'
    - 'Network: a payload-hosting domain, then an attacker web endpoint on a cloud application-hosting service receiving the process environment (B11, B15); nothing is named.'
    - 'Identity: the corporate password entered on a public code platform''s sign-in page, including via a ''sign in with'' flow (B20), recorded by browser identity telemetry; later, a third-party OAuth grant reading internal repositories from an unfamiliar address (B35).'
    - 'Fleet: devices compliant in identity and device management that do not report to the endpoint console (B41, B48).'
    benign_lookalike_discriminator: 'none stated by Sophos. Mechanical, derived from the RCA wording only (not a Sophos discriminator): a normal terminal profile launches a shell executable; this one launches a command that downloads and runs a remote script repeatedly (B5), and it comes from workspace settings in a freshly cloned repository (B2, B3). S3''s longer Triage text about legitimate developer shells and package installs is not supported by the sources.'
