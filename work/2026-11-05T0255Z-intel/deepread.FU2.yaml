    lure_and_sender_pattern_behavior_only: Mail that appears to come from a company or a known contact, inviting the reader to open an invoice, a document or to verify information through a link (C5, C6). The link leads to a page on a workers.dev subdomain (Cloudflare Workers hosting, per C20) whose first label combines a company-style name with a portal word and whose second label starts with a cloud-storage word plus an identifier (C8); the notice says other addresses can be used (C12). The page then has the reader type a code on the genuine Microsoft authentication page (C9).
    corroboration_search:
      ncsc_security_hub: '`ncsc-csh recent 30` on 2026-11-05: newest post 2026-11-03T15:47Z; no post about device-code, Microsoft 365 or phishing.'
      websearch: 'Five further WebSearches in German and French this run (BACS/NCSC; OFCS and canton queries; Waadt; other Romandie cantons) plus the four of the earlier run: no Swiss corroboration, no other canton, no Swiss ICT outlet, no Microsoft statement. Results were generic device-code coverage from 2025-2026 (vendor and press), none dated November 2026 and none naming Switzerland.'
      conclusion: The Vaud notice stands alone (single source, first-party cantonal authority).
    microsoft_documentation:
      url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/policy-block-authentication-flows
      page_title: Block authentication flows with Conditional Access policy
      exact_wording_of_the_lever: 'Microsoft does not prescribe a policy name. The page''s steps use the Conditional Access condition ''Authentication Flows'' (Configure = Yes, select ''Device code flow'') with grant control ''Block access'', and say to set ''Enable policy'' to ''Report-only'' first and then switch it on (C23-C26). Microsoft Entra admin center path as written: Entra ID > Conditional Access > Policies > New policy.'
      companion_page: https://learn.microsoft.com/en-us/entra/identity/conditional-access/concept-authentication-flows (concept page; title 'Authentication flows as a condition in Conditional Access policy')
      details_the_store_does_not_yet_carry:
      - Report-only first, and filtering sign-in logs by the 'authentication protocol' filter to find legitimate device-code use before blocking (C27, C31).
      - 'Protocol tracking: the tracked state survives token refreshes, so a later sign-in in the same session can be blocked by an authentication-flows policy; the sign-in log property ''original transfer method'' shows it (C32, C33); error code AADSTS530036 appears in the concept page''s troubleshooting text.'
      - Device Registration Service exclusion when device-code is used for registration (C34).
      - Microsoft's stated rationale and legitimate use (input-constrained shared devices, signage) (C29, C30).
    existing_entries:
    - id: 2026-05-23/fbi-psa260521-kali365-oauth-device-code-phaas-bypasses-m365
      already_carries:
      - 'CA lever: block user-interactive device-code flow through Conditional Access''s `Authentication flows` condition (block / require compliant device), plus FIDO2 for high-value accounts and a review of OAuth app consents; claims public-sector tenants often leave device-code open for legacy device enrolment (the store''s own statement).'
      - 'Telemetry: Entra sign-in logs showing `authenticationProtocol = deviceCode` events (alert on unfamiliar device names or geographies, and on sign-in activity right after a device-code event from another IP) and `Revoke-MgUserSignInSession` to clear a refresh token. It carries no protocol-tracking, `Original transfer method`, AADSTS530036, report-only rollout or Device Registration Service exclusion detail, no Microsoft Learn link, and no Exposure/Triage lines (legacy migrated shape).'
    - id: 2026-10-23/m365-token-spray-replay-rogue-entra-devices-mfa-wipe
      already_carries:
      - Treats device-code phishing only as one of three token sources feeding a hosting-range token-replay campaign; its device-code lever is the single clause 'restrict the device-code flow with authentication-flow policies' plus 'or where the device-code flow is open' in Exposure.
      - Its sign-in telemetry is replay-specific (OAuth2:Token and Cmsi:Cmsi from hosting infrastructure with Office/Authentication Broker clients and a `node` user agent, AADSTS53003 after-authentication blocks, DESKTOP-plus-eight-hex device names, MFA wipes, short-named inbox rules) and its post-compromise guidance is revoke sessions because a reset leaves a roughly 90-minute token, devices, MFA methods and rules. The new entry should not restate that persistence audit; link it through references[].
    existing_entries_additional_note: 'Also relevant, not asked: entries/2026-07-10/m365-conditional-access-gaps-railway-lshiy-campaigns.md already carries the tenant-wide block-or-restrict lever and a hunt for device-code completions not tied to a genuine input-constrained device (its actions[] lines).'
    contradicts_or_unsupported_in_earlier_findings:
    - 'Supported: campaign running now and several organisations affected (C4); lure types (C6); sender pretext (C5); device-code mechanism (C9, C10); no actor, kit, count or sector named; behavioural-only advice (C11-C16).'
    - 'Not supported by the notice: ''Cloudflare Workers''. The notice says only the suffix workers.dev; the Cloudflare attribution rests on Cloudflare''s own documentation (C20). Say ''workers.dev (Cloudflare Workers) subdomains'' only with that qualification.'
    - 'Slightly loose: the earlier summary calls the pattern ''a company-style label with a portal and cloud-storage wording''; the template shows the portal word attached to the first label and the cloud-storage word with an identifier in the second (C8).'
    - 'Issuer: the earlier text says ''canton of Vaud''s cybersecurity notice''. The notice itself names no office (C17-C19 come from the landing page). Use ''canton of Vaud''.'
    - 'Earlier extended_notes: the Conditional Access lever, sign-in telemetry, post-compromise revocation and benign-lookalike text come from the store''s existing entries and Microsoft Learn, not from the notice. Microsoft Learn (C21-C34) is now fetched and can be cited for the lever.'
    - The notice's last instruction covers both 'entered a code' and 'approved an authentication request' (C16); do not narrow it to code entry.
    observable_behaviors_stated:
    - 'Mail: messages that appear to come from a company or known contact with an invoice, document or verification link (C5, C6).'
    - 'Web: a link to a workers.dev subdomain page of the structure in C8 (proxy, DNS or mail-link telemetry would carry it; the notice names no sensor).'
    - 'Identity: the user types a code on the genuine Microsoft authentication page, or approves an authentication request (C9, C16); the notice names no log. Microsoft Learn names the sign-in log filter ''authentication protocol'' and the ''original transfer method'' property (C31, C33).'
    benign_lookalike_discriminator: 'Not given by the notice. Supported by Microsoft Learn (C29, C27): device-code sign-in is legitimately used for devices without local input (shared devices, signage, Android conference-room devices, legacy tooling), so a device-code sign-in for a user with no such device, shortly after a mailed link, is the case that stands out. That pairing combines the notice with Microsoft''s documentation; neither source states it as a discriminator.'
