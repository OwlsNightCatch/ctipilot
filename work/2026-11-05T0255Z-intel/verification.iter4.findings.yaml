- code: F13
  category: analytical-link-as-fact
  section: entries/2026-09-22/cve-2026-7273-zyxel-gs1900-red-heron-kev-exploited
  item: "Zyxel entry body paragraph 1 (claim 55f425cc33)"
  url_or_quote: "CISA added it to the Known Exploited Vulnerabilities catalog on 2026-09-21 ([CISA]), acting on GreyNoise research published the same day"
  summary: "(low confidence) No cited source states that CISA acted on GreyNoise's research. The CISA alert lists only 'CVE-2026-7273 Zyxel GS1900 Series Switches Stack-Based Buffer Overflow Vulnerability'; BleepingComputer says only 'That same day, CISA added CVE-2026-7273'; Binarly says 'GreyNoise and CISA KEV linked' it. Text predates this run but is in the entry. Say 'on the day GreyNoise published' instead of 'acting on'."
- code: F3
  category: claim-not-supported
  section: entries/2026-09-22/cve-2026-7273-zyxel-gs1900-red-heron-kev-exploited
  item: "Zyxel entry Exposure line (claim 45a1033ed1)"
  url_or_quote: "Zyxel's advisories say the attacker is LAN-based, while Binarly and BleepingComputer say network access to the web interface is enough ([Zyxel PSIRT, 2026-11-03]; [BleepingComputer, 2026-11-04])"
  summary: "The clause attributes a statement to Binarly but cites only Zyxel and BleepingComputer. BleepingComputer carries its half ('an unauthenticated attacker with network access'); the Binarly half ('an attacker only needs network reachability to the management service; we therefore assess the attack vector as AV:N') is on the Binarly advisory https://www.binarly.io/advisories/brly-2026-057, which this clause does not cite. Add that citation."
- code: F14
  category: quantifier-without-source
  section: entries/2026-09-22/cve-2026-7273-zyxel-gs1900-red-heron-kev-exploited
  item: "Zyxel entry summary (claim 6b0d72ba36); same wording in the run record's contradiction note"
  url_or_quote: "Binarly alone calls it the exploited zero-day, and CISA's catalog lists CVE-2026-7273 and not the new flaw."
  summary: "(low confidence) BleepingComputer, a cited source, calls it a zero-day in its own voice: title 'Zyxel fixes zero-day exploited to hack nearly 1,000 network switches' and lede 'Zyxel has patched a zero-day vulnerability ... that hackers exploited to compromise nearly 1,000 devices'. So 'alone' is contradicted. What is true: the exploitation link rests on Binarly's analysis. Say 'the exploited-zero-day label rests on Binarly's comparison of the exploit' or similar."
