items:
  - title: "CVE-2026-20191 — Cisco Catalyst Center: unauthenticated path-traversal to arbitrary file read"
    sources:
      - { url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0218", publisher: "NCSC-NL", date: "2026-07-02", role: "primary" }
      - { url: "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-2174", publisher: "BSI CERT-Bund (WID-SEC-2026-2174)", date: "2026-07-01", role: "primary" }
      - { url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-catc-file-read-wLH2vf8X", publisher: "Cisco PSIRT", date: "2026-07-01", role: "primary" }
      - { url: "https://nvd.nist.gov/vuln/detail/CVE-2026-20191", publisher: "NVD", date: "2026-07-01", role: "corroborating" }
    discovery_trace: "first seen at: advisories-ncsc-nl (RSS), URL https://advisories.ncsc.nl/rss/advisories → pivot: NCSC-NL advisory detail (ncsc-nl csaf bridge), URL https://advisories.ncsc.nl/advisory?id=NCSC-2026-0218 → corroboration: BSI WID-SEC-2026-2174, URL https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-2174 → primary: Cisco PSIRT advisory, URL https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-catc-file-read-wLH2vf8X → verified: NVD, URL https://nvd.nist.gov/vuln/detail/CVE-2026-20191"
    summary: |
      Cisco patched CVE-2026-20191 (CVSS 3.1: 7.5, AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N) in Cisco Catalyst
      Center (formerly DNA Center), the centralized network management/SDN controller for Catalyst switch
      and campus-fabric estates. The flaw is a CWE-22 path-traversal in the platform's HTTP request
      handling: insufficient validation of user-supplied input lets an unauthenticated remote attacker send
      a crafted HTTP request to read arbitrary files from within a restricted container on the appliance,
      potentially exposing configuration secrets or credentials stored on the management plane. No
      authentication or user interaction is required (AV:N/PR:N/UI:N); impact is confidentiality-only
      (no integrity/availability impact per the vector), consistent with a pure file-read primitive rather
      than RCE. Affected releases run 2.3.7.0-VA through 3.1.6-GSMU100; the fix ships in Catalyst Center
      3.1.6-GSMU200. Both NCSC-NL (NCSC-2026-0218) and BSI CERT-Bund (WID-SEC-2026-2174) independently
      published national-CERT advisories on this the same day Cisco's bulletin went out, and both cite the
      Cisco PSIRT advisory cisco-sa-catc-file-read-wLH2vf8X as origin. No public PoC or in-the-wild
      exploitation has been reported by either CERT or Cisco as of this writing.
    region_nexus: "global; Cisco Catalyst Center is widely deployed in enterprise/public-sector campus networks across Europe, flagged independently by NL and DE national CERTs"
    primary_sector_nexus: "indirect — network-management-plane exposure relevant to any public-sector campus network running Catalyst Center"
    sector: "cross-sector, network infrastructure / public-sector IT operations"
    cves: [CVE-2026-20191]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "A vulnerability in Cisco Catalyst Center allows an unauthenticated remote attacker to read arbitrary files from a restricted container by exploiting insufficient validation of user-supplied input via crafted HTTP requests."
        attribution: "NCSC-NL (NCSC-2026-0218, CSAF)"
        source_url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0218"
      - quote: "Affected Product: Cisco Catalyst Center (versions 2.3.7.0-VA through 3.1.6-GSMU100)"
        attribution: "NVD"
        source_url: "https://nvd.nist.gov/vuln/detail/CVE-2026-20191"
    extended_notes: |
      Detection angle: Catalyst Center access/HTTP logs for anomalous request paths containing traversal
      sequences (../, encoded variants) against the management API; the platform runs on a restricted
      container filesystem, so successful exploitation is most visible as unexpected 200-status reads of
      files outside the web-app's intended document root. Hardening: upgrade to 3.1.6-GSMU200; in the
      interim, restrict management-plane HTTP access to trusted admin networks only (Catalyst Center should
      never be internet-exposed). Maps to T1190 Exploit Public-Facing Application (network-management
      plane) and, given the file-read outcome, potential downstream credential-harvesting if configuration
      secrets are exposed.
  - title: "CVE-2026-34038 — Coolify: authenticated command injection in deployment job leads to RCE and secrets exfiltration (CVSS 9.9)"
    sources:
      - { url: "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-2182", publisher: "BSI CERT-Bund (WID-SEC-2026-2182)", date: "2026-07-01", role: "primary" }
      - { url: "https://github.com/coollabsio/coolify/security/advisories/GHSA-qqrq-r9h4-x6wp", publisher: "coollabsio (vendor GitHub Security Advisory)", date: "2026-07-02", role: "primary" }
    discovery_trace: "first seen at: bsi-de (WID RSS), URL https://wid.cert-bund.de/content/public/securityAdvisory/rss → pivot: BSI advisory detail (bsi-csaf bridge), URL https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-2182 → primary: vendor GitHub Security Advisory GHSA-qqrq-r9h4-x6wp, URL https://github.com/coollabsio/coolify/security/advisories/GHSA-qqrq-r9h4-x6wp"
    summary: |
      Coolify, a widely-used open-source self-hosted PaaS/deployment platform (an increasingly common
      self-hosted alternative to Heroku/Vercel for organizations running their own CI/CD-to-production
      pipelines), fixed CVE-2026-34038, a CWE-78 OS command-injection vulnerability (CVSS 3.1: 9.9,
      AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H) in `ApplicationDeploymentJob.php`. The `dockerfile_location`
      and `pre_deployment_command` parameters used during an application deployment are passed to a shell
      without proper escaping or input validation, letting an authenticated user with application "write"
      permissions inject arbitrary OS commands via shell metacharacters (`;`, `&&`, backticks) that execute
      on the underlying host during the deployment step. Because deployment logs capture command output,
      successful exploitation also exfiltrates environment variables/secrets configured for the
      application. The vendor advisory notes the attack surface is larger than initially scoped: a
      separate permission-bypass mechanism means the attacker does not need explicit "deploy" rights to
      reach the vulnerable code path — only broad "write" access. Fixed in Coolify >= v4.0.0-beta.469;
      versions <= 4.0.0-beta.462 are affected. BSI CERT-Bund published WID-SEC-2026-2182 the same day
      citing the GitHub Security Advisory as origin. CVE-2026-34038 is not yet enriched on NVD (reserved
      status) at the time of this research.
    region_nexus: "global open-source deployment tooling; relevant to any organization self-hosting Coolify for CI/CD, including public-sector dev teams running self-hosted PaaS instead of commercial cloud"
    primary_sector_nexus: "indirect — DevOps/CI-CD tooling used across sectors including public-sector technology suppliers"
    sector: "technology / DevOps tooling, cross-sector"
    cves: [CVE-2026-34038]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "An authenticated remote command injection vulnerability (CWE-78) in Coolify allows users with application 'write' permissions to achieve Remote Code Execution (RCE)"
        attribution: "coollabsio GitHub Security Advisory GHSA-qqrq-r9h4-x6wp"
        source_url: "https://github.com/coollabsio/coolify/security/advisories/GHSA-qqrq-r9h4-x6wp"
      - quote: "Ein entfernter, authentisierter Angreifer kann eine Schwachstelle in Coolify ausnutzen, um beliebigen Programmcode auszuführen und Informationen offenzulegen."
        attribution: "BSI CERT-Bund (WID-SEC-2026-2182)"
        source_url: "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-2182"
    extended_notes: |
      Detection angle: audit Coolify deployment-job logs / application audit trail for
      `dockerfile_location` or `pre_deployment_command` values containing shell metacharacters
      (`;`, `&&`, `|`, backticks) submitted by non-admin "write"-scoped accounts; host-level EDR/auditd on
      the Coolify server should flag unexpected child processes spawned from the PHP-FPM/queue-worker
      process tree during a deployment job (parent-image anomaly consistent with T1059 Command and
      Scripting Interpreter / T1190 Exploit Public-Facing Application via an authenticated app-tier
      pivot). Hardening: upgrade to >= v4.0.0-beta.469 immediately; in the interim, restrict "write"
      permission grants to trusted users only and review the permission-bypass note in the vendor advisory
      for any environments allowing self-service app creation. Any secrets referenced in deployment
      environment variables should be treated as exposed if this bug was reachable prior to patching —
      rotate them post-patch.
