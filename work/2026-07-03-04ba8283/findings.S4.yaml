items:
  - title: "AdaptHealth Corp. 8-K (Item 1.05): social-engineering session hijack of a third-party contractor exposes patient PII/PHI"
    sources:
      - { url: "https://www.sec.gov/Archives/edgar/data/1725255/000110465926080297/ahco-20260627x8k.htm", publisher: "SEC EDGAR / AdaptHealth Corp. (victim's own 8-K filing)", date: "2026-07-02", role: "primary" }
      - { url: "https://www.stocktitan.net/sec-filings/AHCO/8-k-adapt-health-corp-reports-material-event-80512081bbc7.html", publisher: "StockTitan (SEC filing digest)", date: "2026-07-02", role: "corroborating" }
    discovery_trace: "first seen at: sec-disclosures-edgar bridge (sec-edgar 8k 2026-06-30 2026-07-03 1.05), URL https://www.sec.gov/Archives/edgar/data/1725255/000110465926080297/ → primary: AdaptHealth's own 8-K, URL https://www.sec.gov/Archives/edgar/data/1725255/000110465926080297/ahco-20260627x8k.htm → corroboration: StockTitan filing digest, URL https://www.stocktitan.net/sec-filings/AHCO/8-k-adapt-health-corp-reports-material-event-80512081bbc7.html"
    summary: |
      AdaptHealth Corp. (Nasdaq: AHCO), a US home-medical-equipment / durable-medical-equipment (DME) and
      home-healthcare-services provider, filed a Form 8-K on 2026-07-02 disclosing an Item 1.05 material
      cybersecurity incident. Per the filing, a threat actor gained unauthorized access to the company's
      cloud-based business applications — including internal patient-management systems and document-storage
      platforms — via "a successful social engineering attack that compromised a user session associated with
      a third-party contractor." The company received a threat-actor extortion communication on 2026-06-15 and
      determined the incident material on 2026-06-27. Confirmed exfiltrated data includes a stored password
      file tied to insurance billing plus patient PII and PHI; the company states Social Security numbers and
      payment-card / financial-account data are not held in the affected systems. Containment steps taken:
      disabling the compromised account, resetting credentials, and adding access controls. No threat-actor
      group name is disclosed in the filing.
    region_nexus: "United States; DME/home-healthcare provider — transferable lesson for any org relying on third-party contractor access into cloud EHR/document-storage platforms (relevant to Swiss/EU healthcare and public-sector suppliers with similar contractor-access models)"
    primary_sector_nexus: "indirect — healthcare-adjacent (DME/home-health services)"
    sector: "healthcare"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "The incident was the result of a successful social engineering attack that compromised a user session associated with a third-party contractor."
        attribution: "AdaptHealth Corp. (SEC Form 8-K, Item 1.05)"
        source_url: "https://www.sec.gov/Archives/edgar/data/1725255/000110465926080297/ahco-20260627x8k.htm"
      - quote: "The Company has confirmed that certain data was exfiltrated from its systems including a stored password file associated with insurance billing."
        attribution: "AdaptHealth Corp. (SEC Form 8-K, Item 1.05)"
        source_url: "https://www.sec.gov/Archives/edgar/data/1725255/000110465926080297/ahco-20260627x8k.htm"
    extended_notes: |
      Technique class: initial access via social engineering to compromise/hijack an authenticated user
      session belonging to a third-party contractor (consistent with the vishing/help-desk session-hijack
      pattern popularised by Scattered-Spider-style intrusion sets, though no actor is named here) —
      maps loosely to T1566 Phishing for the social-engineering vector and T1550.001/T1539 Steal
      Application Access Token / Web Session Cookie for the session-compromise mechanism (ATT&CK IDs are
      the analyst's mapping, not stated by the source). Defender takeaway: third-party/contractor sessions
      into cloud EHR and document-storage SaaS are a distinct trust boundary — Conditional Access policies
      that don't differentiate contractor accounts from staff accounts, and long-lived session tokens not
      re-validated against device/location, are the exploitable gap. Detection hook: SaaS/CASB session
      anomaly alerts (impossible-travel, new-device session reuse) scoped specifically to third-party/
      guest/contractor identities, not just full-time-employee baselines. Hardening lever: phishing-resistant
      MFA + session binding (token-theft-resistant, e.g. DPoP/Continuous Access Evaluation) enforced on
      contractor accounts with the same rigor as staff, and step-up authentication before insurance-billing
      credential stores or PHI document repositories are accessed.

  - title: "Navient Corp. 8-K (Item 1.05): ransomware attack on a third-party law firm exposes borrower SSNs and PII"
    sources:
      - { url: "https://www.sec.gov/Archives/edgar/data/1593538/000114036126027441/ef20077249_8k.htm", publisher: "SEC EDGAR / Navient Corporation (victim's own 8-K filing)", date: "2026-07-02", role: "primary" }
    discovery_trace: "first seen at: sec-disclosures-edgar bridge (sec-edgar 8k 2026-06-30 2026-07-03 1.05), URL https://www.sec.gov/Archives/edgar/data/1593538/000114036126027441/ → primary: Navient's own 8-K, URL https://www.sec.gov/Archives/edgar/data/1593538/000114036126027441/ef20077249_8k.htm (no corroborating third-party news coverage found in-window; WebSearch for the filing surfaced only mirrors of the same SEC document)"
    summary: |
      Navient Corporation (Nasdaq: NAVI, JSM) — a major US student-loan servicer — filed a Form 8-K on
      2026-07-02 disclosing an Item 1.05 material cybersecurity incident that did not touch Navient's own
      systems. On 2026-06-08, Navient learned that a third-party law firm providing services to the company
      ("the Firm") suffered a ransomware attack against its own information systems. The unauthorized actor
      accessed Company-related borrower data held by the Firm, including customer names, dates of birth,
      addresses, and Social Security numbers. Navient states it found no evidence of unauthorized access to
      its own environment and has experienced no operational disruption; it nonetheless determined the
      incident material on 2026-06-29 given the volume and sensitivity of the exposed data. Notifications to
      affected individuals and regulators are underway.
    region_nexus: "United States; fourth-party/vendor (professional-services firm) exposure of financial-services borrower data — directly relevant lesson for Swiss/EU public-sector and regulated entities that entrust SSN-equivalent (AHV-number-class) identifiers to outside counsel or collections firms"
    primary_sector_nexus: "indirect — financial services (student-loan servicing)"
    sector: "financial services"
    cves: []
    actors_campaigns_malware: []
    verification: SINGLE-SOURCE-OTHER
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "On June 8, 2026, the Company became aware of a cybersecurity incident involving a third-party law firm (the \"Firm\") that provides services to the Company. The incident involved a ransomware attack affecting certain of the Firm's information systems."
        attribution: "Navient Corporation (SEC Form 8-K, Item 1.05)"
        source_url: "https://www.sec.gov/Archives/edgar/data/1593538/000114036126027441/ef20077249_8k.htm"
      - quote: "Such data includes borrower information such as customer names, date of birth, addresses and Social Security numbers."
        attribution: "Navient Corporation (SEC Form 8-K, Item 1.05)"
        source_url: "https://www.sec.gov/Archives/edgar/data/1593538/000114036126027441/ef20077249_8k.htm"
    extended_notes: |
      No ransomware group is named in the filing and no leak-site posting has surfaced yet — this is purely
      the victim's own regulatory disclosure of a fourth-party (outside-counsel) compromise. Defender
      takeaway: the exposure sits entirely inside the vendor's environment, so Navient's own controls did
      not fail — the actionable lesson is upstream, at vendor-risk-management: contracts with law firms/
      collections agencies that hold SSN-class identifiers should mandate encryption-at-rest, prompt breach
      notification SLAs, and independent security assessment, since litigation and servicing files are a
      known high-value ransomware target class (bulk PII with minimal security investment relative to the
      regulated entities that generate the data).
      Borderline note: single-source (the company's own 8-K); no independent press coverage of this specific
      filing was found in-window via WebSearch, but the carve-out for a victim's own regulatory disclosure
      (equivalent to a national-CERT-class primary for its own incident) applies per the domain brief
      ("prefer victim statements ... over leak-site claims").

  - title: "Medtronic notifies ~9 million customers of a ShinyHunters-claimed corporate IT breach — notification arrives 2.5 months after containment"
    sources:
      - { url: "https://www.bleepingcomputer.com/news/security/medtronic-notifies-customers-impacted-by-shinyhunters-data-breach/", publisher: "BleepingComputer", date: "2026-07-02", role: "primary" }
      - { url: "https://www.theregister.com/security/2026/07/02/pacemaker-manufacturer-medtronic-warns-patients-cybercrooks-may-have-swiped-health-data/5265768", publisher: "The Register", date: "2026-07-02", role: "corroborating" }
    discovery_trace: "first seen at: bleepingcomputer (webfetch listing https://www.bleepingcomputer.com/news/security/) → article https://www.bleepingcomputer.com/news/security/medtronic-notifies-customers-impacted-by-shinyhunters-data-breach/ → corroboration: The Register, URL https://www.theregister.com/security/2026/07/02/pacemaker-manufacturer-medtronic-warns-patients-cybercrooks-may-have-swiped-health-data/5265768"
    summary: |
      Medical-device manufacturer Medtronic began notifying customers on 2026-07-02 of a data breach the
      ShinyHunters extortion group first claimed in April 2026. Medtronic's investigation found that an
      unauthorized actor accessed certain Medtronic corporate IT systems between 2026-04-13 and 2026-04-19,
      after the company noticed unusual activity on 2026-04-15. ShinyHunters listed Medtronic on its dark-web
      extortion portal on 2026-04-18, claiming roughly nine million records comprising names, contact details,
      dates of birth, Social Security numbers, and health-related information, and threatened publication if
      a ransom was not paid by 2026-04-21; the listing was subsequently removed, consistent with the group's
      pattern of pulling entries after a ransom is paid. Medtronic states it found "no evidence" the stolen
      data was posted publicly, that medical devices were unaffected and continued to operate safely (the
      corporate systems compromised were segregated from device-operating networks), and it has not confirmed
      whether attackers retained a copy of the exfiltrated data. No initial-access vector is disclosed by
      either source. The roughly 2.5-month gap between detection (mid-April) and customer notification
      (early July) is itself the operationally notable delta.
    region_nexus: "global; US-headquartered medical-device manufacturer with EU/Swiss healthcare-system device deployments"
    primary_sector_nexus: "direct — healthcare (medical-device manufacturer)"
    sector: "healthcare"
    cves: []
    actors_campaigns_malware: ["ShinyHunters"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "The investigation determined that from April 13 to April 19, 2026, an unauthorized actor accessed certain Medtronic corporate IT systems."
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/medtronic-notifies-customers-impacted-by-shinyhunters-data-breach/"
      - quote: "Based on our investigation, this incident did not impact the ability of any Medtronic device to operate safely and deliver intended therapy."
        attribution: "Medtronic, quoted by The Register"
        source_url: "https://www.theregister.com/security/2026/07/02/pacemaker-manufacturer-medtronic-warns-patients-cybercrooks-may-have-swiped-health-data/5265768"
      - quote: "ShinyHunters typically publishes stolen data if ransom negotiations with the victim organization fail to secure payment."
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/medtronic-notifies-customers-impacted-by-shinyhunters-data-breach/"
    extended_notes: |
      No technical intrusion vector (initial access, tooling) is disclosed in either source, so no ATT&CK
      mapping beyond T1567 Exfiltration to Cloud Storage / dark-web leak-site listing can be responsibly
      assigned. This is the same ShinyHunters cluster already tracked across this week's other Salesforce/
      PeopleSoft-adjacent extortion activity (Nissan, NAIC, 7-Eleven — see prior coverage), but this incident
      is corporate-IT-systems-based rather than the third-party-SaaS-integration pattern seen elsewhere in
      the cluster's recent activity; the source material does not confirm whether the same initial-access
      tradecraft was used. Defender takeaway for a healthcare-adjacent constituency: the delisting of an
      extortion-portal entry is not proof data was destroyed — treat any group listed-then-delisted victim
      as presumptively breached for downstream monitoring (credential-stuffing, targeted phishing using
      exposed DOB/PII) regardless of ransom outcome. The 2.5-month detection-to-notification gap is worth
      flagging to compliance/legal stakeholders reviewing their own breach-notification timelines.

  - title: "Kubota North America discloses a 35-day dwell-time breach exposing employee SSNs, DOB, driver's-license and bank data — no actor claimed"
    sources:
      - { url: "https://www.bleepingcomputer.com/news/security/kubota-says-hackers-had-month-long-access-to-network-systems/", publisher: "BleepingComputer", date: "2026-07-01", role: "primary" }
      - { url: "https://www.kubotausa.com/notice-of-security-incident", publisher: "Kubota North America Corporation (victim's own notice)", date: "2026-07-01", role: "corroborating" }
    discovery_trace: "first seen at: bleepingcomputer (webfetch listing https://www.bleepingcomputer.com/news/security/) → article https://www.bleepingcomputer.com/news/security/kubota-says-hackers-had-month-long-access-to-network-systems/ → primary: Kubota's own notice, URL https://www.kubotausa.com/notice-of-security-incident"
    summary: |
      Kubota North America Corporation (agricultural/construction-equipment manufacturer) disclosed that a
      threat actor had unauthorized access to its network systems between 2026-03-16 and 2026-04-20 — a
      roughly 35-day dwell time — with the breach discovered on 2026-04-30 when HR files were found to have
      been accessed. Files affected include employee and enrolled-dependent names in combination with Social
      Security numbers, dates of birth, taxpayer identification numbers, driver's-license/government-ID
      numbers, direct-deposit financial-account information, and corporate payment-card details; benefits
      enrollment/claims data for enrolled dependents was also affected. Kubota mailed notification letters on
      2026-06-30 and is offering Kroll identity-monitoring services. No ransomware group or extortion actor
      has claimed responsibility, and Kubota's notice does not disclose the initial-access vector.
    region_nexus: "United States; manufacturer with a global (incl. European) equipment-distribution and dealer network"
    primary_sector_nexus: "indirect — manufacturing"
    sector: "manufacturing"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "We identified and addressed an incident involving unauthorized access to certain network systems between March 16, 2026 and April 20, 2026."
        attribution: "Kubota North America Corporation (official notice)"
        source_url: "https://www.kubotausa.com/notice-of-security-incident"
      - quote: "At the time of writing, no data extortion groups or ransomware gangs have assumed responsibility"
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/kubota-says-hackers-had-month-long-access-to-network-systems/"
    extended_notes: |
      Data-type profile (SSN + DOB + government-ID + direct-deposit banking + payment-card, scoped to HR/
      payroll/benefits files) points to compromise of HR/payroll-adjacent systems or file shares rather than
      customer-facing infrastructure, though the source does not confirm the compromised system class or
      intrusion vector. Defender takeaway: this data-type combination (SSN + bank account + government ID)
      is the highest-value bundle for identity-theft/BEC-adjacent fraud; hardening lever is DLP/access
      review specifically scoped to HR and payroll file shares (who can bulk-export personnel records,
      whether service accounts touching those shares have anomaly alerting), independent of whatever the
      initial-access vector turns out to be. The 35-day undetected dwell before discovery (triggered
      incidentally by HR-file access review, not proactive detection) is the structurally interesting
      signal — it suggests the intrusion set had broad lateral reach into HR systems before being noticed.
      Borderline note: no threat actor named and initial vector undisclosed reduces detection-hunt
      specificity; included because the SSN+bank+government-ID data-type combination and the discovery-
      trigger pattern (incidental HR review vs. proactive alerting) is a transferable hunt-maturity lesson.

