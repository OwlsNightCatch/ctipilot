    extended_notes: |
      Caveats for the composer: (1) no CVE has been assigned to the Nextcloud zero-day and SOCRadar has
      withheld technical detail pending its full whitepaper (linked from the primary as
      https://socradar.io/resources/whitepapers/dismantling-fortibleed-inside-a-russian-fortinet-compromise-operation/
      but gated/registration content — did not fetch, so treat any deeper technical claim beyond what's
      quoted above as unverified). (2) Attribution to "Russian-speaking" operators and the specific
      operator-overlap claim rests entirely on SOCRadar's own investigation of an exposed staging server —
      no independent lab has yet corroborated the operator-identity linkage itself, only the story's
      existence (Dark Reading, The Hacker News, BleepingComputer [inaccessible, 403], Cybersecurity Dive,
      Security Boulevard all relay SOCRadar's claims without independent verification). (3) No MITRE ATT&CK
      technique IDs or hardening/detection guidance were given in the source material — SOCRadar defers this
      to the forthcoming whitepaper. Given prior brief coverage already carries FortiBleed as a long-running
      thread (state summary confirms "item:fortibleed" tracked with the 86,644-device figure), the main
      agent should route this as an UPDATE on that thread rather than a fresh top-level item, and should
      flag the device-count escalation (86,644 → 430,000+) explicitly since it is a material scale revision,
      not just a new development.
