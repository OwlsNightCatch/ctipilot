    discovery_trace: "first seen at: darkreading (S3 slice), URL https://www.darkreading.com/rss.xml (RSS item 'FortiBleed Actors Collaborating With Inc, Lynx Ransomware Gangs') → pivot: WebSearch (\"FortiBleed Fortinet Inc Lynx ransomware Nextcloud zero-day collaboration July 2026\") → pivot: The Hacker News, URL https://thehackernews.com/2026/07/fortibleed-credential-theft-linked-to.html → primary: SOCRadar, URL https://socradar.io/blog/fortibleed-inc-lynx-ransomware-link/"
    summary: |
      SOCRadar's Threat Research Unit (STRU) reports the first confirmed link between the mass FortiGate
      credential-harvesting operation it dubbed FortiBleed and actual ransomware deployment. FortiBleed
      uses a custom Golang tool ("FortigateSniffer") that passively intercepts authentication traffic on
      compromised FortiGate devices via FortiOS's native `diagnose sniffer packet` command, harvesting
      credentials across 20+ protocols; SOCRadar now sizes the campaign at 430,000+ targeted FortiGate
      firewalls (a scale-up from the 86,644-device figure reported when this brief first covered FortiBleed
      in the 2026-W26 weekly). An operational-security lapse on attacker infrastructure exposed internal
      logs showing a single operator actively working negotiation panels for both the INC Ransom and Lynx
      RaaS operations, with victim data overlapping between the FortiBleed dataset and an INC-linked open
      directory. STRU also recovered an internal tracking document describing an organized ~20-person,
      Russian-speaking operation with a clear division of labor (core operators, specialists, back-office
      support) running as an initial-access-broker model — of the scanned FortiGate portals, admin-level
      access was confirmed on 409 targets, full domain compromise (VPN → domain controller → domain admin)
      on 354, and at least 12 ransomware deployments with "hundreds of endpoints" encrypted. Separately,
      SOCRadar says the group is in possession of at least one undisclosed Nextcloud zero-day, discovered
      through analysis of the group's AI-assisted vulnerability-research tooling on the exposed staging
      server; SOCRadar states it is coordinating responsible disclosure with Nextcloud but has withheld
      technical detail (no CVE assigned yet, no patch confirmed) pending a fuller whitepaper. The Hacker
      News's reporting adds that the same staging server contained reconnaissance data on ~29,000 Citrix
      IP addresses, suggesting the group is expanding targeting beyond Fortinet devices.
    region_nexus: "global; FortiGate is a very common perimeter/VPN device in Swiss and European public-sector and critical-infrastructure networks, and this is the FortiBleed thread this brief has already tracked as long-running"
