    extended_notes: |
      IMPORTANT COMPOSER NOTE (backlog task response): This is confirmed as a DISTINCT finding from the already-published entry 2026-09-13/gtg-20006-anthropic-russia-ai-orchestrated-espionage, not a duplicate or an update candidate. Both derive from the same Anthropic September 2026 report but describe entirely different actors, harm categories and mechanics: GTG-20006 is a Russian cyber-espionage cluster (device-code phishing, malware rebuilding, network intrusion against 20+ government/military/drone-supply-chain targets, overlapping with Midnight Blizzard) — a genuine cyber-intrusion finding with an ATT&CK-mappable techniques[] set. GTG-27005 is a freelance team's AI-assisted PHYSICAL WEAPONS engineering effort (autonomous drone-swarm targeting software) with no network-intrusion component of its own. Recommend the new entry declare 2026-09-13/gtg-20006-anthropic-russia-ai-orchestrated-espionage in references[] as a same-report companion finding, per the backlog row's own instruction.
      TECHNIQUES[] NOTE: left empty deliberately, not by oversight. Enterprise ATT&CK models adversary behavior against IT/network environments; this case is about an AI coding assistant being misused to engineer physical weapons hardware/firmware and targeting software, which has no meaningful enterprise ATT&CK mapping (the closest candidate, T1090 Proxy for the VPS-routing-to-bypass-geoblock behavior, was considered and rejected — T1090 specifically covers C2-to-victim proxying, not evading a SaaS vendor's own access controls, and forcing it would misrepresent the source). Recommend composing this as a "research" or "threat"-adjacent entry that explicitly carries an empty/omitted techniques[] with a one-line note explaining why, consistent with the pipeline's "omit or [] only when the item genuinely carries no attacker behavior" rule — the source genuinely describes a different behavior class entirely (weapons engineering, not network intrusion).
      The report also mentions (same "conventional weapons" section, not separately verified to primary depth this run beyond what's quoted in my extract): GTG-87001 (Yemen guided-rocket/ballistic-missile cell, live field test conducted), GTG-17001 (China-based anti-torpedo fire-control spec/proposal work), and GTG-17002 (China-based electronic-warfare/SEAD targeting suite that mid-project switched its default scenario to 12 Taiwan targets). These are each distinct case studies in the same report; flagging for awareness in case a future run wants to assess them individually — not included as findings here since GTG-27005 was this run's specific tasked verification target and the strongest, most novel case (autonomous lethal engagement with no human veto).

  - title: "Regular Labs' second Joomla catalogue-wide security release in eight weeks: nine CVEs across ten extensions, led by an article-author PHP-execution flaw in Conditional Content — all nine identifiers still RESERVED and invisible to scanners on release day"
    sources:
      - { url: "https://mysites.guru/blog/regular-labs-september-2026-security-updates/", publisher: "mySites.guru", date: "2026-09-13", role: primary }
      - { url: "https://regularlabs.com/latest-releases", publisher: "Regular Labs (vendor changelog)", date: "2026-09-13", role: primary }
    discovery_trace: "first seen at: mysites-guru RSS feed, URL https://mysites.guru/rss.xml → primary: mySites.guru's own disclosure/vulnerability-database write-up, URL https://mysites.guru/blog/regular-labs-september-2026-security-updates/ → corroboration: Regular Labs' own vendor changelog, URL https://regularlabs.com/latest-releases (independently confirms each CVE id, fixed version and fix description cell-by-cell)."
    summary: |
      Regular Labs (Peter van Westen's Joomla extension house) shipped 24 extension updates on 2026-09-13, its second catalogue-wide security release in eight weeks after a July 2026 round. Ten of the 24 carry a vendor-labelled [SECURITY FIX] entry covering nine CVE identifiers (CVE-2026-85188, -85189, -85190, -85191, -85192, -85195, -85196, -88852, -88853); every affected version range starts at the July 2026 build. All nine CVE identifiers were still in RESERVED state on release day — mySites.guru states it checked the MITRE record endpoint, the NVD API and the CVE Project's own git mirror and all three returned empty, meaning no vulnerability database or commercial scanner can currently surface any of these nine flaws by CVE id.
      The standout is CVE-2026-85192 in Conditional Content, fixed in 8.0.0: an untrusted article author could run arbitrary PHP through an inline "Condition Rule," i.e. code execution reachable by the lowest content-authoring role Joomla defines — and on any site permitting self-registration into an authoring role, an attacker can create that account itself. The remaining eight are cross-site-scripting or information-disclosure class (CWE-79-adjacent): CVE-2026-85195/85196 (Articles Anywhere, also affecting Users Anywhere for -85196) — unescaped request input and JavaScript-Events attachable by any content author; CVE-2026-85189/-88853 (Modals) — modal links accepting javascript: URLs, and JavaScript-Events again attachable by any author; CVE-2026-88852 (Snippets) — snippet variable overrides settable by any author; CVE-2026-85190 (Quick Index) and CVE-2026-85191 (Tabs & Accordions) — crafted attribute/option values injecting JavaScript on render; CVE-2026-85188 — a single Condition-Set-label defect shared across four products (Advanced Module Manager, Conditional Content, Content Templater, ReReplacer) that allowed a label to reference unrelated database fields. Every one of the nine requires an authenticated account with content-authoring rights; none is reachable by an anonymous visitor.
      Four of the ten security releases (Articles Anywhere 20.0.0, Conditional Content 8.0.0, Modals 17.0.0, Snippets 11.0.0) are flagged BC BREAK by the vendor: the fix removes a previously-open capability (JavaScript Events, Snippet variable overrides, or inline PHP Condition Rules) and gates it behind an author-group allow-list that the vendor's own shipped plugin manifest defaults to "Super Users" only — verified directly in the packages (the `javascript_events_usergroups` field default) rather than inferred. Sites that legitimately used those features from a non-Super-User account will silently lose that functionality on update with no warning. mySites.guru also flags a propagation gap: Regular Labs' own auto-update feed (download.regularlabs.com/updates.xml) was still serving pre-fix versions for three of the ten extensions roughly three hours after the public release (a six-hour cache-lifetime artifact), so a same-day "no update available" prompt does not mean a site is current — administrators must check the installed version number against the vendor's changelog directly. A structurally identical, unbackported gap applies to any Joomla 3 install: Regular Labs stopped shipping Joomla-3-branch builds on 4 September 2023 (its last J3 release date), so roughly a fifth of the installs mySites.guru monitors across the affected extensions sit on that final, permanently-unpatchable J3 build and require a Joomla 4/5/6 migration rather than an update to receive any of these nine fixes.
    region_nexus: "global (Joomla is widely deployed by Swiss cantonal/communal public-sector and municipal websites; several prior entries in this store already track the Regular Labs extension family and the broader Joomla third-party-extension pattern)"
    primary_sector_nexus: "indirect — public-facing municipal/cantonal websites built on Joomla with third-party extensions are a plausible exposure class"
