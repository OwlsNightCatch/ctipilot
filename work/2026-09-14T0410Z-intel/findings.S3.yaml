    extended_notes: |
      Distinct from the already-published entries entries/2026-08-28/sourcerer-joomla-unauth-rce-patch-bypass-of-patch-bypass.md (July 2026 Regular Labs round, Sourcerer only) and the three YOOtheme-ZOO/ICagenda/Sourcerer entries from the same 2026-08-28 fire — no CVE overlap with any of them; this is a fresh 2026-09-13 catalogue release covering different extensions and a different CVE range. Composed as a single entry (not one-per-extension) because it is one vendor's one coordinated disclosure event driven by shared underlying code (CVE-2026-85188 alone spans four products), matching how mySites.guru itself frames the story.
      auth prerequisite is important to state prominently: every flaw needs an authenticated Joomla content-author-level account, not anonymous access — T1190 is applied because the vulnerable code lives in an internet-facing CMS application, but detection/hardening guidance should emphasize reviewing which accounts hold Author/Editor rights and whether self-registration into those groups is enabled.

