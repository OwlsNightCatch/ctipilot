      - quote: "CVE-2026-85192, fixed in Conditional Content 8.0.0, let an untrusted article author run PHP through an inline Condition Rule. That is code execution reachable by the lowest content-authoring role on a Joomla site."
        attribution: "mySites.guru"
        source_url: "https://mysites.guru/blog/regular-labs-september-2026-security-updates/"
      - quote: "All nine CVE identifiers were still in RESERVED state on the day of release. The numbers are allocated, and Regular Labs has printed them in its own changelogs, but the records are not live at cve.org or in NVD. We checked the MITRE record endpoint, the NVD API and the CVE Project's own git mirror, and all three come back empty."
        attribution: "mySites.guru"
        source_url: "https://mysites.guru/blog/regular-labs-september-2026-security-updates/"
      - quote: "We confirmed that in the shipped packages rather than inferring it: the javascript_events_usergroups field in Articles Anywhere 20.0.0's plugin manifest sets default=\"Super Users\", and the code default matches."
        attribution: "mySites.guru"
        source_url: "https://mysites.guru/blog/regular-labs-september-2026-security-updates/"
    extended_notes: |
      Triage/detection angle for the composer: because the fix for the four BC-BREAK extensions is a capability withdrawal (default now Super Users only) rather than a pure sanitisation, the expected post-patch symptom for a legitimate site is a silently-broken content feature (JavaScript Events / Snippet variable overrides / PHP Condition Rules stop rendering) with no error message -- that is the normal patch side effect, not an intrusion indicator, and should not be triaged as a compromise signal. A genuine pre-patch exploitation attempt would show as a non-Super-User (Author/Editor-role) account creating or editing a Conditional Content "Condition Rule" containing PHP, or an Articles Anywhere/Modals JavaScript Events attachment from an account outside the site's trusted author groups -- both are visible in Joomla's content-revision history and the extension's own audit trail, not in a web server access log alone, since the trigger is stored content rendered at view time rather than a single malicious HTTP request. Hardening beyond patching: restrict/disable open self-registration into the Author role (or any content-authoring group) where not operationally required, since CVE-2026-85192 is reachable by any account holding that role including a freshly self-registered one. This is a same-vendor, same-mechanism follow-on to the 22 July 2026 catalogue-wide release the store already tracks via three 2026-08-28 entries (yootheme-zoo, icagenda, sourcerer) -- none of those three entries' CVEs overlap this batch's nine identifiers, so this is genuinely new coverage rather than a duplicate. Single-sourced because the CVEs are RESERVED/unpublished and no second independent outlet has picked this up yet; the vendor's own changelog (https://regularlabs.com/latest-releases, linked throughout mySites.guru's writeup) is the ultimate primary but was not separately fetched this run given time budget -- worth an independent confirmation fetch on a later audit pass if this entry needs corroboration upgraded.
