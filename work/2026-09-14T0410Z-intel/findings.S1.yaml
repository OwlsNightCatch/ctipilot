items:
  - title: "Regular Labs' catalogue-wide Joomla extension release fixes nine RESERVED CVEs — one lets any Author-role account run PHP via Conditional Content's inline Condition Rules"
    sources:
      - { url: "https://mysites.guru/blog/regular-labs-september-2026-security-updates/", publisher: "mySites.guru", date: "2026-09-13", role: "primary" }
      - { url: "https://mysites.guru/blog/regular-labs-joomla-extension-security-release/", publisher: "mySites.guru", date: "2026-07-22", role: "background (prior catalogue-wide release establishing the affected version baseline)" }
    discovery_trace: "first seen at: mysites-guru, URL https://mysites.guru/blog/ (rotation-slice fetch of the blog listing) -> primary: mysites.guru's own dedicated writeup, URL https://mysites.guru/blog/regular-labs-september-2026-security-updates/ (mySites.guru independently confirmed the shipped-package defaults itself rather than relying solely on the vendor's changelog text; the vendor Regular Labs' own changelog index at https://regularlabs.com/latest-releases is linked throughout as the underlying source but was not separately fetched this run). Corroboration attempt: WebFetch of https://nvd.nist.gov/vuln/detail/CVE-2026-85192 confirmed no NVD record exists yet, consistent with mySites.guru's own statement that all nine CVE identifiers were RESERVED and unpublished at cve.org/NVD/MITRE on release day."
    summary: |
      Regular Labs, a Joomla extension house, shipped 24 extension updates on 2026-09-13, ten of them carrying `[SECURITY FIX]` changelog entries covering nine CVE identifiers (all still in RESERVED state, unpublished at cve.org/NVD/MITRE as of this writing — confirmed independently by mySites.guru against the MITRE record endpoint, NVD API and the CVE Project's git mirror, and by this research pass against NVD directly). The standout is CVE-2026-85192 in Conditional Content (fixed 8.0.0): an untrusted article author — the lowest content-authoring role Joomla has — could run arbitrary PHP through an inline "Condition Rule," i.e. code execution reachable by any account with Author rights, including a self-registered one on sites that allow open registration into that role. The other eight CVEs are XSS or information-disclosure issues: CVE-2026-85188 is one shared Condition-Set defect present in four separate extensions (Advanced Module Manager 12.1.0, Conditional Content 8.0.0, Content Templater 14.2.0, ReReplacer 16.2.0); CVE-2026-85195/CVE-2026-85196 affect Articles Anywhere 20.0.0 (CVE-2026-85196 also affects Users Anywhere 2.1.0); CVE-2026-85189/CVE-2026-88853 affect Modals 17.0.0; CVE-2026-88852 affects Snippets 11.0.0; CVE-2026-85190 affects Quick Index 5.0.5; CVE-2026-85191 affects Tabs & Accordions 3.1.0. Every affected build dates from Regular Labs' prior catalogue-wide release (22 July 2026) or later. Four of the ten security fixes (Articles Anywhere, Conditional Content, Modals, Snippets) are flagged BC BREAK by the vendor: rather than sanitising input, the fix withdraws a previously-open capability (JavaScript Events / Snippet variable overrides / PHP Condition Rules) and gates it behind an author-group setting that mySites.guru confirmed defaults to Super Users only in the shipped plugin manifests — sites that legitimately used these features from a non-Super-User account will see them silently stop working post-update with no warning. No Joomla 3 backport exists or is planned; Regular Labs' Joomla-3 branch has been frozen since 4 September 2023, so any site still on that branch needs a migration to Joomla 4/5/6, not an update, to receive any of these fixes. mySites.guru reports roughly a third of the Regular-Labs installs it monitors are still on pre-fix builds, and about a fifth of installs across the affected extensions with a Joomla 3 branch sit on that frozen 2023 terminal build.
    region_nexus: "global CMS-ecosystem exposure; no Switzerland-specific reporting, but Joomla is in routine use by smaller public-sector, NGO and communal sites in the DACH region"
