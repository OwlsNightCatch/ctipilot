  - title: "CVE-2026-59509 — cve-search POST /fetch_cve_data: unauthenticated NoSQL-parameter manipulation to arbitrary MongoDB collection read, admin credential exposure"
    sources:
      - { url: "https://nvd.nist.gov/vuln/detail/CVE-2026-59509", publisher: "NVD/MITRE", date: "2026-07-05", role: "primary" }
      - { url: "https://github.com/cve-search/cve-search/pull/1218", publisher: "cve-search project (GitHub PR — fix)", date: "2026-06-22", role: "primary" }
      - { url: "https://cve.threatint.eu/CVE/CVE-2026-59509", publisher: "ThreatInt.eu (CVE aggregator)", date: "2026-07-05", role: "corroborating" }
    discovery_trace: "first seen at: enisa-euvd bridge (recent lastvulnerabilities), URL https://euvd.enisa.europa.eu/ → primary: NVD, URL https://nvd.nist.gov/vuln/detail/CVE-2026-59509 → pivot: cve-search GitHub fix PR, URL https://github.com/cve-search/cve-search/pull/1218 → corroborating: ThreatInt.eu, URL https://cve.threatint.eu/CVE/CVE-2026-59509"
    summary: |
      CVE-2026-59509 (CVSS 4.0: 9.2, CRITICAL; CWE-20 Improper Input Validation) is an unauthenticated
      vulnerability in cve-search — the open-source CVE/CPE aggregation tool maintained by CIRCL
      (Luxembourg's CSIRT) that many national CERTs, CSIRTs and MISP-adjacent CTI teams run internally
      to index and search vulnerability data. The flaw sits in the POST /fetch_cve_data endpoint: the
      handler trusts attacker-controlled request parameters to select the target MongoDB collection,
      the projected fields, and regex-based filters, rather than restricting queries to the intended CVE
      collection. A remote, unauthenticated attacker can redirect the query to arbitrary application
      collections — including mgmt_users — to exfiltrate administrative usernames and password hashes,
      enabling offline cracking and admin-account takeover of the cve-search instance. Affected versions
      run from v4.0 through v6.0.0; the fix (merged 2026-06-22, CVE assigned 2026-07-05 by CIRCL) adds
      three server-side controls: restricting the endpoint to CVE-only collections, an allowlist for
      DataTables column/field parameters, and enforced pagination bounds. No exploitation-in-the-wild
      has been reported by either source at time of writing; EPSS is listed at 0.0, consistent with a
      same-day disclosure rather than confirmed active exploitation.
    region_nexus: "Europe — cve-search is maintained by CIRCL (Luxembourg national CSIRT) and is widely deployed by European CERTs/CSIRTs and MISP-ecosystem CTI teams for local vulnerability-database search; a compromised instance exposes analyst/admin credentials for the tool itself."
    primary_sector_nexus: "indirect"
    sector: "public-sector, telco"
    cves: [CVE-2026-59509]
