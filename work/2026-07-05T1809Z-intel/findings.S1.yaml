      - quote: "An unauthenticated improper input validation vulnerability in the POST /fetch_cve_data endpoint in cve-search. A remote attacker can manipulate request parameters controlling the MongoDB collection, projected fields, and regular-expression filters to read arbitrary application MongoDB collections. This can expose administrative usernames and password hashes from the mgmt_users collection, enabling offline password cracking and potential administrative account compromise."
        attribution: "NVD / CIRCL (CVE-2026-59509 description)"
        source_url: "https://nvd.nist.gov/vuln/detail/CVE-2026-59509"
      - quote: "unauthenticated NoSQL injection vulnerability in /fetch_cve_data, which allowed arbitrary MongoDB collection access"
        attribution: "cve-search project, GitHub PR #1218"
        source_url: "https://github.com/cve-search/cve-search/pull/1218"
      - quote: "The endpoint previously trusted attacker-controlled request parameters to determine collection selection, field projection, sorting, and pagination behavior"
        attribution: "cve-search project, GitHub PR #1218"
        source_url: "https://github.com/cve-search/cve-search/pull/1218"
    extended_notes: |
      Detection concept: cve-search deployments should be treated as internal CTI infrastructure, not
      internet-facing by design — the primary defender action is confirming the web UI/API is not
      reachable from untrusted networks (check reverse-proxy / firewall ACLs on the Flask web
      component's listening port) and reviewing access logs for POST requests to /fetch_cve_data with
      non-default `collection`/`columns`/regex-filter parameter values (T1190 Exploit Public-Facing
      Application). Hardening: upgrade past the fixed commit (server-side allowlisting of
      collection/field/pagination parameters) or apply a reverse-proxy rule restricting /fetch_cve_data
      to POST bodies referencing only the CVE collection until upgraded. If admin credentials in
      mgmt_users may have been read, rotate all cve-search admin passwords (bcrypt/hash exposure enables
      offline cracking, T1110.002 Password Cracking) as a precaution even absent confirmed exploitation.
      No CISA KEV or ENISA EUVD "exploited" listing as of fetch time — this is a fresh, unconfirmed-exploitation
      disclosure, included for its target class (CTI/CSIRT tooling relevant to this org's own
      threat-intel supply chain) and CVSS severity, not for confirmed in-the-wild activity.
