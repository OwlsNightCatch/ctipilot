        attribution: "Apache Airflow security team (Shahar Epstein, oss-sec)"
        source_url: "https://seclists.org/oss-sec/2026/q3/298"
      - quote: "Credit: MalHyuk (finder), Jarek Potiuk (remediation developer)"
        attribution: "Apache Airflow security team (oss-sec)"
        source_url: "https://seclists.org/oss-sec/2026/q3/298"
      - quote: "\"aggregate_severity\": {\"text\": \"hoch\"}"
        attribution: "BSI CERT-Bund CSAF (WID-SEC-W-2026-2551, document.aggregate_severity)"
        source_url: "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-2551"
    sources:
