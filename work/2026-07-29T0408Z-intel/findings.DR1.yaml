  - key: airflow-fab-cve-2026-59243
    title: "Apache Airflow FAB provider CVE-2026-59243 — structured deep-read (BSI CSAF + Apache oss-sec)"
    vulnerable_component: >
      apache-airflow-providers-fab (the Flask-AppBuilder auth-manager provider for Apache Airflow).
      Specific code path: the FAB auth manager's Azure AD OAuth login callback, which decodes the
      OAuth-supplied JWT ID token with the `verify_signature` decode parameter defaulted to `False`
      (CWE-347 Improper Authentication). Apache's own oss-sec text names no specific file/function
      beyond "the FAB auth manager's Azure AD OAuth login" and points to the remediation PR
      (github.com/apache/airflow/pull/69374, not fetched this run — github.com egress-blocked) for the
      exact code diff.
    prerequisites: >
      No prior authentication and no privileged network position required beyond the ability to reach
      the deployment's OAuth callback endpoint: an attacker able to present a forged or unsigned
      (`alg:none`) ID token to that callback is authenticated as an arbitrary user, including Admin.
      Only affects deployments running the FAB auth manager configured for the Azure AD OAuth login
      path — CONFIRMED from Apache's own text that this is a default-configuration issue on that path,
      not something requiring extra misconfiguration beyond choosing Azure AD OAuth as the login method.
    authentik_path_confirmation: >
      CONFIRMED unaffected. Apache's oss-sec advisory states verbatim: "Deployments running the FAB
      auth manager with the Azure AD OAuth login path under its default configuration are affected;
      the Authentik path already defaulted to `True`." No BSI or Apache text qualifies this further —
      taken at face value as Apache's own statement about its own codebase.
    affected_fixed_versions_structured: >
      From BSI CERT-Bund's CSAF (WID-SEC-W-2026-2551, fetched via `tools/fetch_source.py bsi-csaf
      WID-SEC-2026-2551`) product_tree/product_status fields (STRUCTURED, not prose): product_id
      T057287 "Apache Airflow FAB provider <3.7.3" listed under `vulnerabilities[0].product_status.
      known_affected`; the sibling product_id T057287-fixed "Apache Airflow FAB provider 3.7.3"
      (cpe:/a:apache:airflow:fab_provider__3.7.3) is the fixed release. This corroborates Apache's own
      oss-sec prose ("This issue affects apache-airflow-providers-fab before 3.7.3... upgrade to
      apache-airflow-providers-fab 3.7.3, which defaults verify_signature=True"). No lower bound is
      given (i.e., the CSAF range is an open "<3.7.3", consistent with the flaw existing since the
      Azure AD OAuth login path was introduced).
    exploitation_status: >
      No indication of in-the-wild exploitation in either Apache's oss-sec text or BSI's CSAF. Same-day
      disclosure-and-fix: Apache/BSI both dated 2026-07-27/28, GitHub remediation PR dated 2026-07-27.
    cvss: >
      NO CVSS SCORE IS PUBLISHED BY EITHER PARTY. Apache's own oss-sec advisory states only
      "Severity: moderate" (a word, not a CVSS vector/score). BSI's CSAF carries only a document-level
      `aggregate_severity.text: "hoch"` (German for "high") with NO `scores`/`cvss_v3` block anywhere in
      the `vulnerabilities[]` array (confirmed by reading the full structured CSAF JSON — the
      vulnerabilities entry for CVE-2026-59243 has only `product_status` and no `scores` key, unlike
      the Siemens/CISA CSAF records handled under the DR1-2 item below, which DO carry `scores`).
      MITRE's own CVE record does not yet exist: a direct query to `https://cveawg.mitre.org/api/
      cve/CVE-2026-59243` returned `{"error":"CVE_RECORD_DNE","message":"The cve record for the cve
      id does not exist."}` at time of this research (2026-07-29, ~04:34 UTC) — the CVE ID is reserved/
      used in both advisories but has not yet propagated to a published MITRE CVE record. Severity-word
      mismatch worth flagging for the entry: Apache calls its own flaw "moderate" despite it being a
      full authentication bypass to Admin; BSI's aggregate rating is "hoch"/high — a materially
      different severity characterization of the identical vulnerability by the vendor vs. the
      national CERT re-publishing it, mirroring the OpenSSL-vs-Siemens severity-word gap found in the
      Desigo CC item below.
    credit_and_dates: >
      Finder: MalHyuk. Remediation developer: Jarek Potiuk. Disclosed by Shahar Epstein (Apache Airflow
      security team) via oss-sec, dated "Tue, 28 Jul 2026 10:24:07 +0000" (message header) / BSI's CSAF
      tracking shows `initial_release_date: 2026-07-27T22:00:00Z`, i.e. Apache's fix/disclosure and
      BSI's republication both landed within the same ~12-hour window (2026-07-27 22:00 UTC / 2026-07-28
      10:24 UTC).
    additional_evidence:
