  - key: langflow-cve-2026-0769-exploited-outside-kev
    title: "VERIFICATION RESULT: CVE-2026-0769 and CVE-2026-5027 both resolve as real, distinct Langflow vulnerabilities, confirmed absent from current CISA KEV — item CONFIRMED, not dropped"
    verification_outcome: "DO NOT DROP. Both CVE identifiers resolve to real, published, Langflow-specific vulnerability records (one via ZDI/MITRE, one via Tenable/MITRE), and a direct fetch of the current CISA KEV JSON catalog confirms neither is present, while a near-identical, easily-confused sibling ID (CVE-2026-0770) IS present in KEV — a distinction worth calling out explicitly in the entry so readers do not conflate the two."
    cve_2026_0769:
      resolves: "YES — confirmed via the MITRE CVE Services API (cveawg.mitre.org/api/cve/CVE-2026-0769), state=PUBLISHED, and independently via ZDI's own advisory page (ZDI-26-035 / ZDI-CAN-26972)."
      is_langflow: "YES — title: \"Langflow eval_custom_component_code Eval Injection Remote Code Execution Vulnerability\"; Affected Vendor/Product on ZDI's own page: Langflow / Langflow."
      type_and_mechanism: >
        CWE-95 (Improper Neutralization of Directives in Dynamically Evaluated Code — 'Eval Injection').
        Root cause per ZDI's own text: "The specific flaw exists within the implementation of
        eval_custom_component_code function. The issue results from the lack of proper validation of a
        user-supplied string before using it to execute python code. An attacker can leverage this
        vulnerability to execute code in the context of the current process."
      auth_prerequisite: "None — ZDI's own text: \"This vulnerability allows remote attackers to execute arbitrary code on affected installations of Langflow. Authentication is not required to exploit this vulnerability.\""
      cvss: "9.8 CRITICAL, CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H — ZDI's own score (confirmed identically on both the ZDI advisory page and the MITRE CVE record, CNA=zdi)."
      affected_range_and_fixed_version: >
        The MITRE CVE record lists only `"versions":[{"version":"1.3.2","status":"affected"}]` with
        `defaultStatus:"unknown"` — i.e. ZDI's own structured record does NOT give a clean lower/upper
        affected-version bound, only the single tested version 1.3.2. NO FIXED VERSION IS IDENTIFIED
        ANYWHERE in this research: (a) ZDI's own advisory page explicitly frames this as a "(0Day)"
        advisory and states under "Additional Details": "07/18/25 – ZDI submitted the report to the
        vendor's GitHub account / 09/11/25 – ZDI asked for updates / 10/10/25 – ZDI asked for the fix /
        12/10/25 – ZDI notified the vendor of the intention to publish the case as a 0-day advisory" —
        i.e. the vendor did not fix it before ZDI's 0-day publication; ZDI's own mitigation guidance is
        "Given the nature of the vulnerability, the only salient mitigation strategy is to restrict
        interaction with the product" (no patch to apply, only network/access restriction). (b) A
        WebSearch for the GitHub Advisory Database record (GHSA-5v3c-9g74-93w7) found it explicitly
        states "Dependabot alerts are not currently supported on this advisory because it does not have
        a package from a supported ecosystem with an affected and fixed version listed" — i.e. GitHub's
        own advisory database also carries no fixed-version data for this CVE. (c) A direct OSV lookup
        for the same GHSA ID (`tools/fetch_source.py osv vuln GHSA-5v3c-9g74-93w7`) returned HTTP 404
        (not found in OSV's database), consistent with (b). CONCLUSION: as of this research, no publicly
        documented fixed version exists for CVE-2026-0769 — this reads as an unpatched (or at minimum
        undocumented-as-patched) pre-auth RCE, which is directly consistent with VulnCheck's report of
        ongoing exploitation.
      reporter: "Peter Girnus (@gothburz) of Trend Zero Day Initiative. Report timeline: reported to vendor 2025-07-18; ZDI coordinated public release 2026-01-09 (per ZDI's own Disclosure Timeline); MITRE CVE record shows datePublished 2026-01-23T03:28:47Z, dateReserved 2026-01-08."
      cisa_adp_note: "CISA's own ADP Vulnrichment layer on the CVE record (dateUpdated 2026-02-26) recorded SSVC Exploitation=\"none\" as of that date — this predates VulnCheck's July 2026 claim of ongoing exploitation and is now stale; CISA has not (per the current KEV catalog fetch) added this CVE to KEV despite VulnCheck's canary-observed activity."
    cve_2026_5027:
      resolves: "YES — confirmed via the MITRE CVE Services API (cveawg.mitre.org/api/cve/CVE-2026-5027), state=PUBLISHED, CNA=Tenable."
      is_langflow: "YES — title: \"Langflow - Path Traversal Arbitrary File Write via upload_user_file\"; vendor/product langflow-ai/langflow, repo https://github.com/langflow-ai/langflow (per the CVE record's own affected[] block)."
      type_and_mechanism: >
        CWE-22 (Improper Limitation of a Pathname to a Restricted Directory). Per Tenable's own CVE
        description: "The 'POST /api/v2/files' endpoint does not sanitize the 'filename' parameter from
        the multipart form data, allowing an attacker to write files to arbitrary locations on the
        filesystem using path traversal sequences ('../')."
      auth_prerequisite: >
        LOW privileges required — CVSS vector PR:L, distinct from CVE-2026-0769's PR:N. This is NOT a
        fully unauthenticated flaw per the structured CVSS vector; a foothold with at least low-privilege
        access to the Langflow API is implied by PR:L (Tenable's own reference/write-up at
        https://www.tenable.com/security/research/tra-2026-26 was NOT fetched directly in this run —
        gap noted below).
      cvss: "8.8 HIGH, CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H — Tenable's own score, CNA=tenable, per the MITRE CVE record."
      affected_range_and_fixed_version: >
        The MITRE CVE record's structured `affected[]` block is UNINFORMATIVE on version bounds: only
        `"versions":[{"status":"affected","version":"0","versionType":"custom"}]` with
        `defaultStatus:"unaffected"` — Tenable's own CNA container gives no explicit lower/upper affected
        range or named fixed version in the machine-readable record. WebSearch-only (NOT independently
