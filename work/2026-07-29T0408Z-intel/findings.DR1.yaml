    vulnerable_method: >
      `LoginSvcImpl.authenticateRemoteApplication(String applicationName, String suppliedSicDn)` in
      class `com.checkpoint.management.dleserver.coresvc.internal.LoginSvcImpl`, decompiled by Rapid7
      from `work/t146/mgmt_wrapper.tgz:fw1/cpm-server/dleserver.jar.full` (i.e. the CPM/DLE service's
      dleserver.jar). Vulnerable logic (verbatim from Rapid7's decompilation): `String effectiveSicDn =
      suppliedSicDn == null ? this.j.getCertificateDnName() : suppliedSicDn;` — the method prefers the
      caller-supplied SIC distinguished name whenever the caller supplies one at all, falling back to
      `getCertificateDnName()` (the DN bound to the authenticated peer certificate) only when no DN was
      supplied. If `effectiveSicDn.equals("CN=siclocal")` it authenticates as the local/loopback
      identity; otherwise it calls `identifyDomainForRemoteLogin(effectiveSicDn)` and trusts that
      identity for the remote session.
    protocol_generations_and_ports: >
      SmartConsole logins cross two generations of Check Point management-plane plumbing: (1) the
      legacy FWM/CPMI service, TCP port 18190, using Check Point's SIC (Secure Internal Communication)
      certificate-based trust mechanism; once the SIC bootstrap completes, FWM exchanges length-prefixed
      "FwSet" name/value objects (a Check Point-proprietary encoding used by older management services);
      (2) the newer CPM/DLE service, exposing SOAP services over HTTPS on TCP port 19009 under the URI
      path `/cpmws/`; authenticated requests to this newer service carry `DLESESSIONID` and
      `CLIENTSESSIONID` header values to prove the client is authenticated.
    gen_sso_token_step: >
      After forging an application-session identity via the DN-substitution bug above, the attacker
      issues a `gen-sso-token` command to the legacy FWM service. The request's `sso_original_client`
      block claims `lower_name (system_admin)`, `soap_local_bind (1)`, and `permissions
      ("ffffffff|ffffffff|ffffffff")` — a full-permission bitmap (all bits set across all three
      permission-mask fields). Rapid7's decompiled FWM authorization code shows a special case: "If the
      current client is treated as a Check Point config administrator (which it will be [given the
      forged identity from the DN bug]), a gen-sso-token request is allowed before the normal
      permission mask check" — i.e. the DN-forgery bug upstream causes the FWM authorization layer to
      treat the attacker as a config administrator, which then bypasses gen-sso-token's normal
      permission gate entirely. The gen-sso-token response contains a new SSO ticket; the attacker
      redeems that ticket through the normal SmartConsole SOAP login path to obtain a full-administrator
      SmartConsole session.
    patch_take158_diff: >
      Rapid7 diffed the decompiled class between vulnerable "R81.20 Jumbo Hotfix Take 146" and patched
      "R81.20 Jumbo Hotfix Take 158." The patch restructures `authenticateRemoteApplication` to: (a)
      compute `boolean localSic = IpUtils.isLoopback(remoteIp) && "CN=siclocal".equals(certificateDn)`;
      (b) only honor a caller-supplied DN when `localSic && suppliedSicDn != null` (i.e. loopback
      CN=siclocal traffic only — preserving the local-application case Rapid7 notes was the original
      intent); (c) for all other (remote) callers, bind `effectiveSicDn` to the authenticated peer
      certificate DN (`certificateDn`) regardless of what the caller supplied; (d) explicitly detect a
      mismatch between a supplied DN and the authenticated certificate DN and reject it with a logged
      error — "Rejecting caller-supplied SIC name that does not match the client certificate DN for
      application {} from {}" — throwing `AuthenticationFailureLoginException`; (e) add a new check that
      rejects the login outright when there is no authenticated SIC identity at all (empty/null
      `effectiveSicDn`), also logged and exception-raised. Rapid7's own summary: "This is why replaying
      the management server's DN no longer works."
    builds_reproduced_against: "R81.20 and R82.10 — Rapid7's own words: \"Rapid7 Labs has reproduced CVE-2026-16232 against affected R81.20 and R82.10 versions of the target software... The vendor supplied patches have been confirmed to successfully remediate the vulnerability and prevent our PoC script from succeeding.\" PoC repository referenced (github.com/sfewer-r7/CVE-2026-16232) but not independently fetched this run (github.com egress-blocked for repo content)."
    default_trusted_clients_claim_exact_wording: >
      "Exploitation requires network access to the Management Server and for a Trusted Clients
      configuration that does not restrict GUI clients, which in our testing was a default setting." —
      this is Rapid7's own exact sentence (also captured identically in S3's evidence block; confirmed
      unchanged on this direct re-fetch of the live article body).
    additional_evidence:
      - quote: "By leveraging CVE-2026-16232, an unauthenticated attacker can obtain an application login token, use this token to log in through SmartConsole with full administrator privileges, and modify the security policy or security configuration."
        attribution: "Rapid7 Labs"
        source_url: "https://www.rapid7.com/blog/post/ra-check-point-smartconsole-authentication-bypass-technical-analysis-cve-2026-16232"
      - quote: "Shown above, the vulnerable “Take 146” accepts the caller's DN at [1]. The patched “Take 158” only allows a supplied DN for loopback CN=siclocal traffic at [2], which preserves the local application case. Remote clients now use the authenticated remote peer certificate DN at [3], and any mismatch between the supplied DN and that authenticated identity is rejected at [4]."
        attribution: "Rapid7 Labs"
        source_url: "https://www.rapid7.com/blog/post/ra-check-point-smartconsole-authentication-bypass-technical-analysis-cve-2026-16232"
      - quote: "The native FWM authorization code has a special case for this command. If the current client is treated as a Check Point config administrator (which it will be), a gen-sso-token request is allowed before the normal permission mask check"
        attribution: "Rapid7 Labs"
        source_url: "https://www.rapid7.com/blog/post/ra-check-point-smartconsole-authentication-bypass-technical-analysis-cve-2026-16232"
    sources:
      - { url: "https://www.rapid7.com/blog/post/ra-check-point-smartconsole-authentication-bypass-technical-analysis-cve-2026-16232", publisher: "Rapid7 Labs", date: "2026-07-28", role: "primary" }
    discovery_trace: "re-verification/deepening of S3 item → full raw-body re-fetch (bridge url, Next.js embedded JSON extracted directly), URL https://www.rapid7.com/blog/post/ra-check-point-smartconsole-authentication-bypass-technical-analysis-cve-2026-16232 (no pivot needed — same primary as S3, read to greater depth)"
