  - key: teamcity-cve-2026-63077
    title: "JetBrains TeamCity CVE-2026-63077 — full-body deep-read of JetBrains' own advisory, cross-checked against the MITRE CVE record"
    vulnerable_component: >
      The TeamCity agent polling protocol — "the mechanism by which distributed build agents check in
      with the central TeamCity server to retrieve job assignments and configuration data" (this
      framing is CSA Labs' phrasing per S3, corroborated in substance but not verbatim by JetBrains'
      own text: "An unauthenticated attacker could exploit the vulnerability via the TeamCity agent
      polling protocol to bypass authentication checks and execute arbitrary operating system commands
      with the privileges of the TeamCity server process."). JetBrains' advisory deliberately withholds
      the specific deserialization gadget/class chain. CWE-502 (Deserialization of Untrusted Data),
      confirmed structurally from the MITRE CVE record's `problemTypes` field — JetBrains' own blog
      text does not use the word "deserialization" itself, describing the impact only as "bypass
      authentication checks and execute arbitrary operating system commands."
    prerequisites: >
      No authentication required; reachable to "any attacker with HTTP(S) access to a TeamCity server."
      No user interaction, no prior foothold. Affects the on-premises agent-polling endpoint
      specifically — TeamCity Cloud is explicitly excluded (see below).
    affected_fixed_versions_structured: >
      From the MITRE CVE record (`cveawg.mitre.org/api/cve/CVE-2026-63077`, CNA=JetBrains): `"affected":
      [{"vendor":"JetBrains","product":"TeamCity","versions":[{"version":"0","status":"affected",
      "lessThan":"2026.1.3, 2025.11.7","versionType":"semver"}],"defaultStatus":"unaffected"}]` — i.e.
      structurally, all versions from "0" up to (but not including) 2026.1.3 and 2025.11.7 are affected
      (two parallel release branches), matching JetBrains' own prose: "This vulnerability affects all
      TeamCity On-Premises versions... A fix for this vulnerability has been introduced in versions
      2025.11.7 and 2026.1.3." Security patch plugin: confirmed available for "TeamCity 2017.1+" via
      direct download (https://download.jetbrains.com/teamcity/plugins/internal/fix_CVE_2026_63077.zip)
      — this is the vendor-stated floor for the patch-plugin mitigation path, distinct from the full
      upgrade path. TeamCity 2024.03+ auto-detects and offers the plugin under Administration | Updates
      | Available security updates. For TeamCity 2017.1–2018.1 a server restart is required after
      installing the plugin; 2018.2+ can enable it without a restart.
    teamcity_cloud_confirmation: >
      CONFIRMED unaffected, in JetBrains' own words: "TeamCity Cloud customers are not required to take
      any action, as the necessary measures have already been applied. We have verified that there is
      no evidence of TeamCity Cloud environments being exploited through this vulnerability." (Note the
      second half of that sentence is technically an exploitation statement about Cloud specifically,
      not a blanket "not vulnerable" claim — read literally, JetBrains states Cloud already had the
      necessary measures applied AND separately verified no exploitation evidence there.)
    reporter_and_dates: >
      Reported privately July 10, 2026 by researcher Antoni Tremblay under JetBrains' coordinated
      disclosure policy. Blog post authored by Daniel Gallo, published 2026-07-27 (page metadata:
      day=27, hours=15, minutes=09 UTC, i.e. 2026-07-27T15:09Z).
    exploitation_statement: "JetBrains' own words, verbatim: \"At the time of publishing this advisory, we are not aware of any active exploitation of this vulnerability.\""
    cvss_and_assigner: >
      9.8 CRITICAL, CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H — present in the MITRE CVE record's
      `metrics[0].cvssV3_1` block under the JetBrains CNA container (i.e. JetBrains self-assigned this
      score as the CVE Numbering Authority for its own product — this is NOT a NVD/third-party score).
      JetBrains' own blog post does not print a numeric CVSS anywhere in its body text; the 9.8 figure
      comes only from the structured CVE record, not the prose advisory. CISA's ADP Vulnrichment layer
      (also present in the same CVE record) separately assessed SSVC: Exploitation="none",
      Automatable="yes", Technical Impact="total", dated 2026-07-28 — i.e. CISA's own automated
      enrichment corroborates JetBrains' "no known exploitation" statement one day after publication.
    csa_labs_caveat: "CSA Labs' research note is treated per the task instruction as non-load-bearing context only (historical framing: CVE-2023-42793/APT29 and CVE-2024-23917 precedent, Shodan enumeration figures) — no fact from CSA Labs is carried as authoritative in this deep-read; every version/patch/mechanism/reporter fact above is sourced to JetBrains' own advisory body text or the MITRE CVE record."
    additional_evidence:
      - quote: "A critical security vulnerability has been identified in TeamCity On-Premises. If exploited, this flaw may enable an unauthenticated attacker with HTTP(S) access to a TeamCity server to bypass authentication checks and execute arbitrary operating system commands with the privileges of the TeamCity server process."
        attribution: "JetBrains (TeamCity PSIRT, Daniel Gallo)"
        source_url: "https://blog.jetbrains.com/teamcity/2026/07/cve-2026-63077/"
      - quote: "This unauthenticated remote code execution vulnerability was reported to us privately on July 10, 2026, by Antoni Tremblay in accordance with our coordinated disclosure policy."
        attribution: "JetBrains (TeamCity PSIRT)"
        source_url: "https://blog.jetbrains.com/teamcity/2026/07/cve-2026-63077/"
      - quote: "TeamCity Cloud customers are not required to take any action, as the necessary measures have already been applied. We have verified that there is no evidence of TeamCity Cloud environments being exploited through this vulnerability."
        attribution: "JetBrains (TeamCity PSIRT)"
        source_url: "https://blog.jetbrains.com/teamcity/2026/07/cve-2026-63077/"
      - quote: "\"cvssV3_1\":{\"version\":\"3.1\",\"attackVector\":\"NETWORK\",\"attackComplexity\":\"LOW\",\"privilegesRequired\":\"NONE\",\"userInteraction\":\"NONE\",\"scope\":\"UNCHANGED\",\"confidentialityImpact\":\"HIGH\",\"integrityImpact\":\"HIGH\",\"availabilityImpact\":\"HIGH\",\"baseScore\":9.8,\"baseSeverity\":\"CRITICAL\"}"
