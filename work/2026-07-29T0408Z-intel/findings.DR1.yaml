  - key: cisa-ics-28jul-desigo-cc-mendix
    title: "CISA ICSA-26-209-01/-02 (Siemens Desigo CC / Mendix Runtime) — structured CSAF deep-read, corroborated against Siemens' own SSA-734552/SSA-814963 and OpenSSL's own advisory"
    desigo_cc_cve_2025_15467:
      vulnerable_component: >
        OpenSSL's `evp_cipher_get_asn1_aead_params()` function (crypto/evp/evp_lib.c per third-party
        analysis of the GitHub PoC — NOT named verbatim in the OpenSSL advisory text itself, which
        describes the flaw only as "parsing CMS AuthEnvelopedData structures"). The bug: when parsing
        a CMS `AuthEnvelopedData` structure that uses an AEAD cipher (e.g. AES-GCM), the IV encoded in
        the ASN.1 parameters is copied into a fixed-size stack buffer (EVP_MAX_IV_LENGTH, 16 bytes per
        third-party PoC analysis) without verifying the IV length fits the destination — an attacker-
        supplied oversized IV triggers a stack-based out-of-bounds write (CWE-787, confirmed by both
        CISA's and Siemens' own CSAF) BEFORE any authentication or AEAD tag verification occurs, so no
        valid key material is required to trigger it. Applications/services parsing untrusted CMS or
        PKCS#7 content with AEAD ciphers (S/MIME AuthEnvelopedData/AES-GCM) are the exposed surface —
        Siemens Desigo CC is affected because it vendors OpenSSL for this parsing path.
      prereqs: >
        Pre-authentication in the sense that no valid cryptographic key/credential is needed — the
        overflow fires during ASN.1/IV-length parsing, before the AEAD tag check. Requires only that
        the target process parses an attacker-supplied CMS/S-MIME AuthEnvelopedData message (e.g. via
        an exposed mail-processing, file-upload, or API endpoint that accepts such content).
      openssl_own_advisory: >
        CONFIRMED via OpenSSL's own oss-security posting (Tomas Mraz, "OpenSSL Security Advisory
        [27th January 2026]", fetched in full): "Stack buffer overflow in CMS AuthEnvelopedData parsing
        (CVE-2025-15467) === Severity: High" — OpenSSL itself rates this vulnerability HIGH, not
        Critical, despite the CVSS 9.8/CRITICAL score later assigned in the Siemens/CISA CSAF
        (AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H). OpenSSL's affected-version statement: "OpenSSL 3.6, 3.5,
        3.4, 3.3 and 3.0 are vulnerable to this issue. OpenSSL 1.1.1 and 1.0.2 are not affected by this
        issue." FIPS modules in 3.6/3.5/3.4/3.3/3.0 are NOT affected (CMS implementation sits outside
        the OpenSSL FIPS module boundary). OpenSSL's own fixed versions: 3.6.1, 3.5.5, 3.4.4, 3.3.6,
        3.0.19. Reported 2025-12-14 by Stanislav Fort (Aisle/AISLE Research, an AI-assisted vulnerability-
        research organization); fix developed by Igor Ustinov.
      desigo_cc_structured_affected_fixed: >
        Read directly from Siemens ProductCERT's own CSAF (SSA-734552, fetched via
        `cert-portal.siemens.com/productcert/csaf/ssa-734552.json` — a SEPARATE, independent primary
        from CISA's verbatim republication, confirmed byte-identical in substance) — NOT the prose
        summary:
        - Desigo CC family V7 (product range "vers:all/*" = ALL versions): `known_affected`; remediation
          category "none_available" — "Currently no fix is available."
        - Desigo CC family V8 (product range "vers:all/*" = ALL versions): `known_affected`; remediation
          category "vendor_fix" — "Update to patch V8.0 QU2.0021" (plus a second vendor_fix entry whose
          `details` field is itself a URL, https://support.industry.siemens.com/cs/ww/en/view/109989041/
          — likely a malformed/duplicate CSAF remediation record, but the "vendor_fix" category and the
          named patch V8.0 QU2.0021 are unambiguous). CORRECTION TO THE ASSUMED FRAMING: V8 IS FIXED —
          it is NOT in the same "no fix yet" bucket as V7. Only V7 has `none_available`.
        - Desigo CC family V9 (product range "vers:intdot/<9.0.1" = versions below 9.0.1 affected):
          `known_affected`; remediation category "vendor_fix" — "Update to V9.0 QU1 or later version"
          (URL https://support.industry.siemens.com/cs/ww/en/view/110002555/) — i.e., 9.0.1 (styled
          "V9.0 QU1" in Siemens' own naming) is the fixed release, confirming S1's "9.0.1" figure.
      cvss_desigo: >
        9.8 CRITICAL, CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H — present in the `scores` array of
        BOTH Siemens' own SSA-734552 CSAF and CISA's ICSA-26-209-01 republication (identical vector),
        i.e. Siemens ProductCERT is the assigning party (CISA's advisory is a verbatim CSAF conversion/
        republication, not an independent assessment — CISA's document explicitly states: "This ICSA is
        a verbatim republication of Siemens ProductCERT SSA-734552... provided \"as-is\"... CISA is not
        responsible for the editorial or technical accuracy"). This 9.8/CRITICAL score is a materially
        higher characterization than OpenSSL's own "High" severity word for the identical underlying
        flaw — worth surfacing as a vendor-vs-upstream severity discrepancy, paralleling the Airflow
        item's Apache-vs-BSI gap.
      exploitation_status: "No in-the-wild exploitation confirmed by CISA, Siemens, or OpenSSL. Public command-execution PoC exists on GitHub (guiimoraes/CVE-2025-15467), covered by S1; not independently re-verified in this pass."
      publication_dates: "Siemens SSA-734552 initial_release_date 2026-07-14 (status 'interim' per Siemens' own tracking metadata); CISA republished as revision 2 on 2026-07-28 (\"Initial CISA Republication of Siemens ProductCERT SSA-734552 advisory\")."
    mendix_cve_2026_7891:
      vulnerable_component: >
        Not a code vulnerability — a documentation/access-control-model gap (CWE-277 Insecure
        Inherited Permissions, confirmed from both CISA's and Siemens' own CSAF `cwe` field). Mendix's
        access-rule documentation does not adequately describe the special/reserved behavior of the
        built-in `System.User` entity. Siemens' own CSAF vulnerability description (verbatim): "A common
        misconfiguration identified is with the anonymous user role with a System.User entity to gain
        access to all stored records, even though no access rights are explicitly configured on that
        role." Root mechanism per remediation text: "System.User has built-in platform-enforced access
        rules that cannot be overridden or restricted by access rules defined on a specialization" —
        i.e. developers who define XPath constraints on a System.User specialization believing it
        restricts access are wrong; the platform's own built-in rule silently supersedes it.
      structured_affected_fixed: >
        Siemens' own CSAF (SSA-814963, fetched independently from cert-portal.siemens.com — confirmed
        byte-identical to CISA's ICSA-26-209-02 republication): product "Mendix Runtime", range
        "vers:all/*" (ALL versions), `known_affected`. Remediation is NOT a code patch: category
        "mitigation" — "Any security model relying solely on XPath constraints on a System.User
        specialization to restrict access should be revised to enforce restrictions at the App Security
        role-management configuration level instead" — plus a second remediation entry category
        "vendor_fix" whose content is itself a documentation-review instruction, not a shipped code
        change. CONFIRMS S1: no code patch exists; this is fixed by developer reconfiguration per
        updated Siemens/Mendix documentation.
      cvss_mendix: "9.1 CRITICAL, CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N — present in Siemens' own SSA-814963 `scores` array (assigned by Siemens ProductCERT); CISA's republication carries the identical vector."
      publication_dates: "Siemens SSA-814963 initial_release_date 2026-07-14 (status 'final'); CISA republished as revision 2 on 2026-07-28."
    additional_evidence:
      - quote: "Stack buffer overflow in CMS AuthEnvelopedData parsing (CVE-2025-15467) === Severity: High ... This issue was reported on 14th December 2025 by Stanislav Fort (Aisle Research). The fix was developed by Igor Ustinov."
        attribution: "OpenSSL Security Advisory (Tomas Mraz, tomas@openssl.org, oss-security)"
        source_url: "https://www.openwall.com/lists/oss-security/2026/01/27/7"
      - quote: "Update to patch V8.0 QU2.0021"
        attribution: "Siemens ProductCERT (SSA-734552 CSAF, remediations[] for Desigo CC family V8)"
        source_url: "https://cert-portal.siemens.com/productcert/csaf/ssa-734552.json"
      - quote: "Currently no fix is available"
        attribution: "Siemens ProductCERT (SSA-734552 CSAF, remediations[] for Desigo CC family V7)"
        source_url: "https://cert-portal.siemens.com/productcert/csaf/ssa-734552.json"
      - quote: "Any security model relying solely on XPath constraints on a System.User specialization to restrict access should be revised to enforce restrictions at the App Security role-management configuration level instead."
        attribution: "Siemens ProductCERT (SSA-814963 CSAF, remediations[])"
        source_url: "https://cert-portal.siemens.com/productcert/csaf/ssa-814963.json"
    sources:
      - { url: "https://raw.githubusercontent.com/cisagov/CSAF/develop/csaf_files/OT/white/2026/icsa-26-209-01.json", publisher: "CISA ICSA-26-209-01 (structured CSAF)", date: "2026-07-28", role: "primary" }
      - { url: "https://cert-portal.siemens.com/productcert/csaf/ssa-734552.json", publisher: "Siemens ProductCERT SSA-734552 (structured CSAF, independent primary)", date: "2026-07-14", role: "primary" }
      - { url: "https://raw.githubusercontent.com/cisagov/CSAF/develop/csaf_files/OT/white/2026/icsa-26-209-02.json", publisher: "CISA ICSA-26-209-02 (structured CSAF)", date: "2026-07-28", role: "primary" }
      - { url: "https://cert-portal.siemens.com/productcert/csaf/ssa-814963.json", publisher: "Siemens ProductCERT SSA-814963 (structured CSAF, independent primary)", date: "2026-07-14", role: "primary" }
      - { url: "https://www.openwall.com/lists/oss-security/2026/01/27/7", publisher: "OpenSSL Security Advisory (oss-security, Tomas Mraz)", date: "2026-01-27", role: "primary" }
    discovery_trace: "re-verification of S1 item → CISA CSAF bridge, URL https://raw.githubusercontent.com/cisagov/CSAF/develop/csaf_files/OT/white/2026/icsa-26-209-01.json → pivot to Siemens' own CSAF referenced in ICSA-26-209-01's references[], URL https://cert-portal.siemens.com/productcert/csaf/ssa-734552.json → pivot to OpenSSL's own upstream advisory (WebSearch \"openssl.org advisory CVE-2025-15467\") located at URL https://www.openwall.com/lists/oss-security/2026/01/27/7 → same pattern for Mendix, CISA URL https://raw.githubusercontent.com/cisagov/CSAF/develop/csaf_files/OT/white/2026/icsa-26-209-02.json → Siemens SSA-814963 URL https://cert-portal.siemens.com/productcert/csaf/ssa-814963.json"
