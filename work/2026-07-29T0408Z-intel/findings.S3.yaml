      (compromised WordPress plugins planting comment-spam backlinks) toward pages harvesting exchange
      credentials or wallet seed phrases, with some intercepting 2FA codes in real time. Netcraft's most concrete
      detection signal: a number of AI-generated phishing pages retain leftover LLM prompt text in the page source
