  - title: "Rapid7 publishes full root-cause and exploitation mechanics for the Check Point SmartConsole auth bypass (CVE-2026-16232) — a broken SIC-identity trust boundary across two management-plane protocol generations"
    sources:
      - { url: "https://www.rapid7.com/blog/post/ra-check-point-smartconsole-authentication-bypass-technical-analysis-cve-2026-16232", publisher: "Rapid7 Labs", date: "2026-07-28", role: "primary" }
      - { url: "https://www.rapid7.com/rss.xml", publisher: "Rapid7 Blog — RSS index", date: "2026-07-28", role: "corroborating" }
    discovery_trace: "first seen at: rapid7-research, URL https://www.rapid7.com/rss.xml → primary: Rapid7 Labs, URL https://www.rapid7.com/blog/post/ra-check-point-smartconsole-authentication-bypass-technical-analysis-cve-2026-16232 (no pivot needed)"
    summary: |
      Rapid7 Labs published a full root-cause and exploitation write-up for CVE-2026-16232 (the Check Point
      SmartConsole authentication bypass this pipeline already covers as exploited-in-the-wild and CISA
      KEV-listed), reverse-engineered from decompiled Java across two Jumbo Hotfix builds (vulnerable "Take 146"
      vs patched "Take 158"). SmartConsole logins cross two management-plane protocol generations: the legacy
      FWM/CPMI service (TCP 18190, Check Point's SIC certificate-based trust mechanism, length-prefixed "FwSet"
      objects) and the newer CPM/DLE service (SOAP over HTTPS, TCP 19009, path /cpmws/). The root cause is a
      broken trust boundary in LoginSvcImpl.authenticateRemoteApplication(): the vulnerable code sets
      effectiveSicDn to the caller-supplied SIC distinguished name whenever one is present, only falling back to
      the authenticated peer certificate's own getCertificateDnName() if none was supplied — so a remote client
      that copies the management server's own SIC DN into the :DN field of an unauthenticated certificate-bind
      request is accepted as that identity with no client certificate ever presented. The forged application
      session then requests a gen-sso-token from the legacy FWM service with sso_original_client claiming
      system_admin and a full permission bitmap (ffffffff|ffffffff|ffffffff), redeems that ticket over the CPM
      SOAP API, and receives a full-administrator SmartConsole session. The patch (Take 158) restricts the
      caller-supplied DN path to loopback CN=siclocal traffic only; remote logins now always bind to the
      authenticated peer certificate DN, and any mismatch between a supplied DN and that certificate is rejected
      with an explicit log entry. Exploitation requires only network reachability to the Management Server and a
      Trusted-Clients configuration that does not restrict GUI clients — which Rapid7 found to be the default.
      Rapid7 reproduced the exploit against affected R81.20 and R82.10 builds and confirmed the vendor patch
      stops its PoC.
    region_nexus: "global — Check Point Security Management / Multi-Domain Security Management is widely deployed across CH/EU government and enterprise networks as the firewall-policy control plane, making this root-cause detail directly actionable for any estate that was internet-exposed with a default Trusted-Clients configuration during the exploitation window."
    primary_sector_nexus: "direct"
    sector: "public-sector, finance, telco, energy"
    cves: ["CVE-2026-16232"]
    techniques: [T1190]
    affected_products: ["Check Point Security Management Server", "Check Point Multi-Domain Security Management Server (MDS)"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: HIGH
    novelty: "update-of:2026-07-23/check-point-smartconsole-auth-bypass-cve-2026-16232"
    evidence:
      - quote: "Our analysis finds that the root cause of CVE-2026-16232 is a broken trust boundary in the application authentication path. A vulnerable server accepts an attacker-supplied Secure Internal Communication (SIC) distinguished name (DN) as the identity of a remote application instead of binding that identity to the authenticated remote peer certificate DN returned by getCertificateDnName()."
        attribution: "Rapid7 Labs"
        source_url: "https://www.rapid7.com/blog/post/ra-check-point-smartconsole-authentication-bypass-technical-analysis-cve-2026-16232"
      - quote: "Exploitation requires network access to the Management Server and for a Trusted Clients configuration that does not restrict GUI clients, which in our testing was a default setting."
        attribution: "Rapid7 Labs"
        source_url: "https://www.rapid7.com/blog/post/ra-check-point-smartconsole-authentication-bypass-technical-analysis-cve-2026-16232"
      - quote: "Rapid7 Labs has reproduced CVE-2026-16232 against affected R81.20 and R82.10 versions of the target software. Our proof-of-concept (PoC) exploit script can be used to successfully validate if a target is either vulnerable or patched."
        attribution: "Rapid7 Labs"
        source_url: "https://www.rapid7.com/blog/post/ra-check-point-smartconsole-authentication-bypass-technical-analysis-cve-2026-16232"
    extended_notes: |
      Material technical delta over the prior 2026-07-23 entry, which reported the exploited-in-the-wild fact and
      patch availability but not the underlying mechanics. This item is composed as a research-angle deep dive
      (protocol/root-cause reverse engineering); the underlying CVE facts (affected versions, KEV status, patch
      availability) remain sourced to the original 2026-07-23 entry and its Check Point/CISA/NCSC-NL corroboration.

  - title: "JetBrains TeamCity On-Premises: unauthenticated deserialization RCE via the unauthenticated agent-polling protocol (CVE-2026-63077, CVSS 9.8) — all on-prem versions affected, no active exploitation yet"
    sources:
      - { url: "https://blog.jetbrains.com/teamcity/2026/07/cve-2026-63077/", publisher: "JetBrains (TeamCity PSIRT)", date: "2026-07-27", role: "primary" }
      - { url: "https://labs.cloudsecurityalliance.org/research/csa-research-note-teamcity-cve-2026-63077-auth-bypass-rce-20/", publisher: "Cloud Security Alliance — Lab Space", date: "2026-07-28", role: "corroborating" }
    discovery_trace: "first seen at: csa-labs, URL https://labs.cloudsecurityalliance.org/research/ → pivot: CSA Labs research note, URL https://labs.cloudsecurityalliance.org/research/csa-research-note-teamcity-cve-2026-63077-auth-bypass-rce-20/ → primary: JetBrains, URL https://blog.jetbrains.com/teamcity/2026/07/cve-2026-63077/"
    summary: |
      JetBrains disclosed CVE-2026-63077 on 2026-07-27, a critical (CVSS 3.1 9.8) unauthenticated remote code
      execution vulnerability affecting all TeamCity On-Premises versions, reported privately by researcher
      Antoni Tremblay on 2026-07-10 under coordinated disclosure. The vulnerable code path sits in the agent
      polling protocol — the channel distributed TeamCity build agents use to check in with the central server
      for job assignments and configuration — which does not require authentication and is reachable to any
      attacker with plain HTTP(S) network access to the server; a crafted request against it triggers an insecure
      deserialization of untrusted data (CWE-502) that yields arbitrary OS command execution with the privileges
      of the TeamCity server process, without any credential, session or user interaction. Fixed in versions
      2025.11.7 and 2026.1.3, with a security patch plugin released for 2017.1+ for environments that cannot
      immediately upgrade (auto-detected and offered under Administration → Updates on TeamCity 2024.03+).
      TeamCity Cloud is not affected. JetBrains states no evidence of exploitation as of publication. CSA Labs'
      analysis situates the flaw against the CI/CD trust-boundary risk category TeamCity has occupied twice before
