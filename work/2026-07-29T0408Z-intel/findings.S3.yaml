          summary: "Mirage Kitten WebSocket SOCKS5 tunneling proxy engineered to traverse corporate proxy environments (HTTP 407 handling, Negotiate/NTLM SSO retry, exponential backoff) and gated by a per-victim hardcoded username substring check (Kaspersky Securelist, 2026-07-28)." }
    relation_suggestions:
