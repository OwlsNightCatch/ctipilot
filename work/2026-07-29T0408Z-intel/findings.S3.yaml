          summary: "WebSocket-based SOCKS5 tunneling tool used by Mirage Kitten since at least April 2026, with an embedded C2-host/port/SSL-flag configuration block and UUID-style mutex for single-instance enforcement (Kaspersky Securelist, 2026-07-28)." }
      - { key: "tool:bridgehead-tunneler", type: tool, name: "BridgeHead",
