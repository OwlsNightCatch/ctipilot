  - title: "Kaspersky: Mirage Kitten (UNC1549/Smoke Sandstorm/Nimbus Manticore) fields a new backdoor and two WebSocket tunnelers hardened against corporate proxies"
    sources:
      - { url: "https://securelist.com/mirage-kitten-new-tools/120811/", publisher: "Kaspersky Securelist (GReAT)", date: "2026-07-28", role: "primary" }
      - { url: "https://securelist.com/feed/", publisher: "Kaspersky Securelist (GReAT) — RSS index", date: "2026-07-28", role: "corroborating" }
    discovery_trace: "first seen at: kaspersky-securelist, URL https://securelist.com/feed/ → primary: Kaspersky Securelist (GReAT), URL https://securelist.com/mirage-kitten-new-tools/120811/ (no pivot needed)"
    summary: |
      Kaspersky GReAT documents a previously undocumented malware set from Mirage Kitten (Kaspersky's designation
      for the actor tracked elsewhere as UNC1549, Smoke Sandstorm and Nimbus Manticore — already registered in
      this pipeline as an Iran-nexus APT under the alias set), an aerospace/aviation/defense/telecom espionage
      group. NightLedger, a new Windows backdoor, masquerades as SspiCli.dll and relies on a DLL search-order
      hijack: the legitimate AppVShNotify.exe does not directly import SspiCli.dll but imports RPCRT4.dll, which
      delay-loads SspiCli.dll when an authenticated RPC API is invoked — letting a co-located malicious DLL load
      under a trusted vendor process. It beacons over HTTPS to hardcoded C2 (realhealthshop[.]com, fallback
      tjconsultingservices[.]com), tokenizing responses with a custom "#%%#" delimiter, and supports 13 numeric
      command IDs (host/network recon, file ops, screenshot capture, process listing/kill, NetSetup.log
      collection). Kaspersky notes NightLedger's command-dispatch design closely mirrors TWOSTROKE, an implant
      GTIG previously attributed to the same actor. Two companion WebSocket tunnelers — BridgeHead and ArcBridge
      — implement full SOCKS5 tunnel-proxy functionality over an authenticated WebSocket channel and are built to
      survive corporate proxy environments: on an HTTP 407 they enumerate supported auth schemes and prefer
      Negotiate over NTLM using the current user's SSO credentials, then retry with exponential backoff capped at
      60 seconds. Both tunnelers hardcode a 3-character substring that must match the lowercased Windows username
      before the malware activates — a per-target anti-sandbox check that causes silent exit on any non-matching
      host. Victimology spans Egypt, Jordan, Tanzania (SMB/government), Pakistan (aviation), Ethiopia (telecom)
      and Burkina Faso (finance); Kaspersky notes a broader infrastructure shift away from Azure-subdomain C2 to
      Cloudflare-backed domains to complicate attribution.
    region_nexus: "Middle East / Africa (Egypt, Jordan, Tanzania, Pakistan, Ethiopia, Burkina Faso); no direct CH/EU victim nexus, but the actor is a tracked Iran-nexus APT and the DLL-delay-load hijack + proxy-aware WebSocket tunneling technique class is directly transferable to any CH/EU government or CI network defending against APT lateral tooling."
    primary_sector_nexus: "indirect"
    sector: "public-sector, telco, transport"
    cves: []
    techniques: [T1574.001, T1071.001, T1090, T1572, T1113, T1057, T1082]
