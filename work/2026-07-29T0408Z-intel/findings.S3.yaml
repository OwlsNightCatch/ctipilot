  - title: "Sophos X-Ops: STAC4749 runs Microsoft Teams vishing with certificate-pinned Golang C2 implants through to Chaos ransomware in under 17 hours"
    sources:
      - { url: "https://www.sophos.com/en-us/blog/chaos-in-teams-vishing", publisher: "Sophos X-Ops", date: "2026-07-28", role: "primary" }
      - { url: "https://www.sophos.com/en-us/blog/feed?id=blt6f15f4f7deaf4242", publisher: "Sophos X-Ops — RSS index", date: "2026-07-28", role: "corroborating" }
    discovery_trace: "first seen at: sophos-xops, URL https://www.sophos.com/en-us/blog/feed?id=blt6f15f4f7deaf4242 → primary: Sophos X-Ops, URL https://www.sophos.com/en-us/blog/chaos-in-teams-vishing (no pivot needed)"
    summary: |
      Sophos X-Ops documents STAC4749, a financially motivated cluster running Microsoft Teams voice-phishing
      (vishing) intrusions against dozens of North American organizations (50% Canada, 44% US) between February
      and June 2026, ending in Chaos ransomware in at least three confirmed cases. Operators impersonate IT/help­
      desk personas from freshly registered ".top"-TLD cloud domains (not the onmicrosoft[.]com spoofing seen in
      earlier Teams-abuse campaigns) and push victims toward Microsoft Quick Assist or, increasingly since April,
      the cloud-based RemSupp RMM tool — a shift Sophos attributes to RemSupp being less likely to sit on
      application blocklists. Lateral movement starts by enabling RDP on the initial host via msconfig service
      reconfiguration. The first-stage payload evolved through three static-string-plus-random-numeric filename
      generations (sekv*.exe → helper*.exe → 74fs*.exe) before the actors dropped the standalone loader in favor
      of downloading a PyArmor-obfuscated PyInstaller backdoor directly; that backdoor retrieves its AES
      key/IV for decrypting embedded config and payload data from a public GitHub repository. Persistence uses
      HKCU Run keys masquerading as Realtek/WinAudio audio components plus .vbs-created Startup-folder shortcuts
      disguised as SecurityHealth/OneDriveUpdate. Golang-based C2 implants (one-word filenames — graph.exe,
      confirm.exe, midnight.exe, shield.exe) authenticate to C2 via a "--token-raw" Base64 token/signature pair
      and, notably, hard-code CA certificates (issuer names loop-CA, connectify-CA, james-bond-CA) so the implant
      only completes a TLS handshake with a C2 server presenting a matching issuer — segmenting infrastructure by
      payload/operational role and complicating interception-based analysis. In ransomware-culminating incidents,
      operators added DWAgent/AnyDesk for redundant access and, in one case, a custom sc5.exe reverse-SOCKS
      tunneling proxy supporting up to 1,000 concurrent connections. Time from initial access to encryption was
      under 17 hours in one case; ransom notes carried the filename pattern readme.chaos.txt. Sophos assesses
      STAC4749 as financially motivated with limited-but-present Russian-language keyboard-layout artifacts, finds
      no evidence linking it to MuddyWater's separate 2026 Chaos false-flag use, and notes shared tradecraft
      lineage (Teams vishing → Quick Assist → DWAgent/AnyDesk) with earlier Sophos-tracked campaigns tied to
      former BlackSuit/Royal members.
    region_nexus: "North America (Canada 50%, United States 44% of observed cases); the STAC4749 technique class — Teams-vishing initial access, certificate-pinned Golang C2, and the Chaos RaaS back end — is directly transferable to CH/EU organizations given the near-universal enterprise deployment of Microsoft Teams and legitimate RMM tooling."
