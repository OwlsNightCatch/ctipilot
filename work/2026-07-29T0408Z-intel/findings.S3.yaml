    techniques: [T1566.004, T1219, T1021.001, T1547.001, T1547.009, T1027, T1572, T1090, T1071.001, T1486]
    affected_products: ["Microsoft Teams", "Microsoft Quick Assist", "AnyDesk", "DWAgent"]
    entity_keys: ["actor:chaos-ransomware"]
    new_entities:
      - { key: "actor:stac4749", type: actor, name: "STAC4749",
          aliases: [],
          summary: "Sophos X-Ops designation for a financially motivated cluster running Microsoft Teams vishing (IT-helpdesk impersonation from freshly registered .top-TLD domains) against North American organizations February–June 2026, culminating in Chaos ransomware in at least three confirmed cases (Sophos X-Ops, 2026-07-28)." }
    relation_suggestions:
