  - title: "Cisco Talos IR Trends Q2 2026: phishing overtakes exploitation as top initial-access vector, MFA-bypass abuse triples, and Sinobi/Warlock ransomware weaponize legitimate RMM tools for covert C2"
    sources:
      - { url: "https://blog.talosintelligence.com/ir-trends-q2-2026/", publisher: "Cisco Talos Incident Response", date: "2026-07-28", role: "primary" }
      - { url: "https://blog.talosintelligence.com/rss/", publisher: "Cisco Talos Blog — RSS index", date: "2026-07-28", role: "corroborating" }
    discovery_trace: "first seen at: talos, URL https://blog.talosintelligence.com/rss/ → primary: Cisco Talos, URL https://blog.talosintelligence.com/ir-trends-q2-2026/ (no pivot needed)"
    summary: |
      QUARTERLY REPORT — Cisco Talos IR Trends Q2 2026. Phishing was the initial-access vector in over half of Talos
      IR's Q2 engagements (up from ~a third in Q1), including a QR-code-in-PDF campaign against Australian
      organizations that Talos attributes to a new actor it designates UAT-11764: auto-generated, victim-tailored
      PDFs with QR codes routing to M365 credential-harvesting pages, with post-compromise inbox-rule creation and
      SharePoint-hosted follow-on lures to propagate through each newly-compromised mailbox's contact list. A
      second engagement uncovered ARToken, a phishing-as-a-service panel (already tracked in this pipeline,
      lineage-linked to EvilTokens) exposing 80+ API endpoints for device-code phishing, primary-refresh-token
      persistence and SharePoint exfiltration via a React dashboard. Authentication abuse (AitM proxies,
      session-token theft, MFA-fatigue, self-enrolled attacker devices) jumped to 65% of engagements from 35% the
      prior quarter. On the ransomware side, Talos responded to Sinobi ransomware for the first time and observed
      the operators weaponize a trojanized MeshAgent binary (the open-source agent of the MeshCentral RMM
      platform) as a SYSTEM-level auto-start service for covert encrypted-WebSocket C2 — a tactic not previously
      publicly associated with the group — before moving laterally via RDP/WinRM using a cracked service-account
      password pulled from ntds.dit and deploying ransomware domain-wide via a malicious GPO logon script, with
      rclone.exe staging exfiltration. Separately, Warlock ransomware operators (Storm-2603) were observed
      deploying the Zoho Assist Unattended Agent — enabling admin remote control with no logged-in user — a tool
      not previously attributed to that group. Healthcare led targeted-sector share for the second consecutive
      quarter (17%), followed by public administration and manufacturing (14% each), both characterized by
      near-zero downtime tolerance. The report's top-weakness ranking: authentication abuse (65%), insufficient
      logging/retention (42%, up from 18% — including domain-controller logs retained only hours and absent
      NetFlow preventing exfiltration-scope determination), and exposed/unpatched internet-facing infrastructure
      (31%, including ToolShell, an older Telerik UI deserialization flaw, and SD-WAN/VPN CVEs).
    region_nexus: "global Talos IR engagement base; the top-targeted sectors (healthcare, public administration/local government, manufacturing) map directly onto the constituency's core and additional sectors, and the QR-phishing/MFA-bypass/RMM-weaponization techniques are equally exploitable against CH/EU M365 and RMM-managed estates."
