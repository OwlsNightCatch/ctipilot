    university_statement_full_content_ro_and_en: |
      ROMANIAN (fullest verbatim reconstruction, principally from Aradon.ro's direct quotation
      of "un comunicat de presă"):
      "Recent a fost identificat un atac cibernetic care a afectat infrastructura informatică a
      universității și funcționarea serviciilor digitale utilizate în activitatea academică și
      administrativă. Acest incident se înscrie în contextul creșterii numărului de atacuri
      cibernetice îndreptate împotriva instituțiilor publice și private, inclusiv a
      instituțiilor de învățământ superior, atât în România, cât și la nivel internațional.
      Imediat după identificarea incidentului, au fost anunțate autoritățile competente în
      domeniu – DNSC, ANSPDCP, DIICOT – și s-au demarat toate măsurile necesare pentru
      limitarea efectelor acestuia. Echipele tehnice lucrează în prezent cu specialiști pentru
      reluarea treptată a serviciilor afectate. [UVVG] tratează acest incident cu maximă
      responsabilitate și deplină transparență și se află în contact permanent cu instituțiile
      abilitate."
      ENGLISH GLOSS: "A cyberattack was recently identified that affected the university's IT
      infrastructure and the functioning of digital services used in academic and
      administrative activity. This incident falls within the context of a growing number of
      cyberattacks directed against public and private institutions, including higher-education
      institutions, both in Romania and internationally. Immediately after identifying the
      incident, the competent authorities in the field were notified — DNSC [National
      Directorate for Cybersecurity], ANSPDCP [National Supervisory Authority for Personal Data
      Processing], DIICOT [Directorate for Investigating Organized Crime and Terrorism
      Offenses] — and all measures necessary to limit its effects were initiated. Technical
      teams are currently working with specialists on the gradual resumption of affected
      services. [UVVG] treats this incident with maximum responsibility and full transparency
      and remains in permanent contact with the competent institutions."

    what_is_confirmed_vs_not: |
      CONFIRMED by the university's own statement: (1) a cyberattack occurred and was "recently
      identified"; (2) IT infrastructure and digital services used in academic/administrative
      activity were affected; (3) three specific authorities were notified — DNSC, ANSPDCP,
      DIICOT; (4) technical teams are working with external cybersecurity specialists on
      gradual service restoration; (5) the university frames the incident within a general
      trend of rising attacks on public/private and higher-education institutions.
      EXPLICITLY NOT CONFIRMED — per Radio România's own direct reporting on the gaps in the
      statement (this is the clearest explicit non-confirmation language found, verbatim):
      "Universitatea nu a precizat, deocamdată, care sunt sistemele indisponibile și nici dacă
      au fost compromise sau extrase date personale." (English: "The university has not yet
      specified which systems are unavailable, nor whether personal data was compromised or
      extracted.") Radio România further states: "Autoritățile urmează să stabilească natura
      atacului, modul în care agresorii au pătruns în sistemele informatice și amploarea
      eventualelor prejudicii. Universitatea nu a anunțat un termen pentru restabilirea completă
      a serviciilor digitale." (English: "Authorities are yet to determine the nature of the
      attack, how the attackers got into the information systems, and the scope of any
      damages. The university has not announced a timeframe for full restoration of digital
      services.") NO SOURCE — including the university's own statement — names an attacker,
      confirms data exfiltration, gives an exact attack date, or lists the specific affected
      systems/services.

