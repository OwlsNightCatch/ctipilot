      - figure: "insufficient logging/visibility 42% of engagements (up from 18%)"
        sentence: "Insufficient logging and visibility was the second most common weakness, observed in 42 percent of engagements compared to 18 percent last quarter."
        category: "Talos engagement-share statistic."
      - figure: "vulnerable/exposed/unpatched infrastructure 31% of engagements (vs 25% last quarter)"
        sentence: "Vulnerable, exposed, or unpatched internet-facing infrastructure was the third most common weakness, observed in 31 percent of engagements, similar to last quarter's 25 percent."
        category: "Talos engagement-share statistic."
      - figure: "unlimited outbound email thresholds implicated in ~15% of engagements"
        sentence: "unlimited outbound email thresholds were a notable security weakness this quarter, enabling threat actors to propagate malicious activity in almost 15 percent of engagements."
        category: "Talos engagement-share statistic."
      - figure: "ransomware/pre-ransomware >20% of engagements (vs just under 20% last quarter)"
        sentence: "Ransomware and pre-ransomware incidents made up over 20 percent of engagements this quarter, relatively similar to just under 20 percent last quarter."
        category: "Talos engagement-share statistic."
      - figure: "healthcare 17%, public administration 14%, manufacturing 14% of engagements"
        sentence: "For the second quarter in a row, health care led as the most targeted industry vertical accounting for 17 percent of all engagements, with public administration and manufacturing following at 14 percent each."
        category: "Talos engagement-share statistic."
      - figure: "one mailbox compromise generated over 6,600 outbound phishing/spam emails"
        sentence: "Shortly after the threat actors gained access to the user's mailbox, they sent over 6,600 phishing and spam emails to continue the attack chain."
        category: "Defender-actionable fact (a concrete observed case, not a share statistic) — usable as a rough scale benchmark for outbound-email-rate alerting thresholds."
      - figure: "Sinobi dwell time ~3 days before ransomware deployment"
        sentence: "This approach allowed the actor to blend malicious traffic with legitimate remote management activity and maintain undetected access for approximately three days before ransomware deployment."
        category: "Defender-actionable fact (specific engagement detail, not a share statistic)."
      - figure: "ARToken exposes 80+ API endpoints"
        sentence: "the ARToken panel exposes 80+ API endpoints for device code phishing, primary refresh token (PRT) persistence, email access, business email compromise (BEC) operations, and SharePoint exfiltration"
        category: "Defender-actionable fact (platform capability scale, not a share statistic)."

    caveat_on_figures: >
      EVERY percentage above is a share of Talos IR's OWN engagement case load this quarter —
      it describes what Talos's incident responders were called in to handle, not a
      representative sample of the global or Swiss/European threat landscape, and Talos does
      not state its total N of engagements (so absolute counts behind each percentage are
      unknown; a swing from 35% to 65% could reflect a small case-load base). Treat these as
      directional signal on TTP prevalence within Talos's client base, not as base-rate
      probabilities for any other organization's own risk. The dwell-time, command-count, and
      email-volume figures (Sinobi's 3 days, the 6,600-email case, ARToken's 80+ endpoints) are
      by contrast concrete, defender-actionable facts about a specific observed
      engagement/tool, independent of the share-statistic caveat.

    techniques: [T1566.001, T1557, T1111, T1621, T1098.005, T1219, T1543.003, T1003.003, T1021.001, T1021.006, T1484.001, T1486, T1567, T1190, T1564.008, T1078, T1204.001, T1053, T1133, T1687, T1070, T1110.003, T1018, T1083, T1087, T1082, T1526, T1534, T1071.001, T1102, T1572, T1048, T1598, T1595, T1593, T1589]
    techniques_note: >
      T1566.001/T1557/T1111/T1621/T1098.005/T1219/T1021.001/T1021.006/T1484.001/T1486/T1567/T1190
      /T1564.008/T1078/T1204.001/T1053/T1133/T1687/T1070/T1110.003/T1018/T1083/T1087/T1082/T1526/
      T1534/T1071.001/T1102/T1572/T1048/T1598/T1595/T1593/T1589 are ALL directly source-provided
