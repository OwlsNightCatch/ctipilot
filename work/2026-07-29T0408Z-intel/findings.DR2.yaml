      - quote: "affirmed that the Minnesota attacks have not yet been attributed to any particular party, and that 'it is unclear' whether the attacks involved the programmable logic controllers CISA warned about."
        attribution: "TJ Sayers (Center for Internet Security), via StateScoop"
