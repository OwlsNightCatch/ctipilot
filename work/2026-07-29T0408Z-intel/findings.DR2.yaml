          basis: "Kaspersky: BridgeHead's HTTP-407 proxy-traversal logic 'closely mirrors the enterprise proxy traversal logic seen in the backdoor we track internally as Retrograde, which overlaps with tooling publicly reported as MiniFast / MiniUpdate, attributed to the same APT group' (Kaspersky Securelist, 2026-07-28) — surfaced for the main agent's registry consideration; not one of the six required fields but a genuine new lineage/alias data point found during the deep read." }

  # ==========================================================================
  # 3. stac4749-teams-vishing-chaos
  # ==========================================================================
  - key: stac4749-teams-vishing-chaos
    title: "Sophos X-Ops: STAC4749 Teams-vishing intrusions culminate in Chaos ransomware in under 17 hours via certificate-pinned Golang implants"
    primary_source:
      url: "https://www.sophos.com/en-us/blog/chaos-in-teams-vishing"
      publisher: "Sophos X-Ops (author: Morgan Demboski, with Sophos MDR/SophosLabs/CTU)"
      published_at: "2026-07-28 (date only — no publish TIME is exposed in the page's own schema metadata beyond the date)"

    initial_access_sequence_and_domain_pattern: |
      STAC4749 operators initiate contact via MICROSOFT TEAMS CHATS AND CALLS, impersonating
      helpdesk/IT-support staff; observed scam-call durations ranged 90 seconds to 20+ minutes,
      "with most lasting between two to two-and-a-half minutes." Persona/domain PATTERN
      (behavioral description, no literal domain reproduced): rather than the onmicrosoft[.]com
      TENANT-SPOOFING seen in earlier Teams-abuse campaigns, STAC4749 registers its OWN
      IT-themed cloud domains under the ".top" TOP-LEVEL DOMAIN, paired with plausible-sounding
      individual employee-style usernames (first-name + last-name combinations) to make the
      "IT support" persona's account look legitimate. Sophos's own naming-convention examples
      cluster around security/update/service-desk themes (words like "security", "scan",
      "update", "connect", "support", "service" combined into the second-level domain label).
      This is a DELIBERATE TRADECRAFT SHIFT from tenant-spoofing to attacker-owned-domain
      persona infrastructure, which changes the detection surface from "is this Teams tenant
      the real onmicrosoft.com tenant" to "is this an unrecognized external .top-TLD domain
      contacting our users via Teams."
      Sophos's own trend context: Teams vishing was first publicly documented by Microsoft in
      mid-2024 (helpdesk/support impersonation for social engineering into remote-access
      grants); Sophos CTU identified similar GOLD REBELLION (associated with Black Basta
      ransomware) activity in late 2024; Sophos's own January 2025 research covered STAC5777
      and STAC5143 combining email bombing with Teams vishing. Sophos observed "a sharp
      increase in MDR cases involving Teams vishing across multiple threat groups and
      campaigns" starting January 2026, with additional jumps in March and May 2026 — while
      cautioning "improved detections may partially explain these increases," Sophos still
      concludes "the trend more strongly suggests that Teams vishing has become an increasingly
      common initial access vector."

    quick_assist_to_remsupp_shift: |
      STAC4749 "initially favored Microsoft Quick Assist and deployed the cloud-based RemSupp
      remote monitoring and management (RMM) tool as a fallback when Quick Assist was blocked
      or unavailable." Sophos's stated reason for the shift: "activity since April [2026]
      suggests the threat actors began to prefer RemSupp, LIKELY BECAUSE IT IS LESS LIKELY TO
      BE INCLUDED IN APPLICATION BLOCKLISTS" than Quick Assist (i.e. Quick Assist has become a
      known/blocklisted tool at many defended organizations following its wide reporting since
      2024, pushing the actor toward a less-recognized RMM brand).

    msconfig_rdp_step: >
      "To move laterally to additional systems, STAC4749 intrusions consistently included
      attempts to enable Remote Desktop Protocol (RDP) on the initial host by modifying Windows
      service configurations via msconfig."

    pyarmor_pyinstaller_backdoor: |
      First-stage payload evolution: originally a malware LOADER (system discovery, persistence
      establishment, C2 connection to retrieve a PyInstaller backdoor + additional payloads),
      whose filename followed a pattern of a STATIC STRING that changed over time plus a unique
      10-digit randomized numeric string — three successive naming generations observed:
      "sekv<10-digit>.exe" (13–18 March), "helper<10-digit>.exe" (26 March – 9 April), and
      "74fs<10-digit>.exe" (10–13 April). The loader communicated via gRPC, performed extensive
      host profiling, generated per-sample mutexes/identifiers, and verified the presence of a
      specific dependency log file — exiting if absent (an anti-sandbox/environment check).
      By mid-April the operators abandoned the standalone loader stage and instead used the
      live remote session to download the backdoor directly.
      The backdoor itself (per Sophos's malware table): a PYARMOR-OBFUSCATED PYINSTALLER
      binary that "can execute shell commands, collect system information, and dynamically
      load additional Python modules." Its AES key/initialization-vector (IV) RETRIEVAL
      MECHANISM: it "Retrieved its AES key and initialization vector (IV) from a PUBLIC GITHUB
      REPOSITORY and used the key to decrypt embedded configuration data and payload" — i.e.
      the decryption secret is fetched at runtime from a public code-hosting platform rather
      than being hardcoded in the binary, which both evades static-analysis key extraction and
      lets the operators rotate the key by updating the GitHub-hosted content. The decrypted
      payload established communications with attacker infrastructure hosted on a
      Cloudflare-Workers-style subdomain (described generically here per the no-IOC rule); the
      backdoor created supporting Python files in a temp directory plus an archive used to
      stage collected/exfiltrated data.

    persistence_mechanisms: |
      HKCU RUN-KEY MASQUERADE CLASS: the first-stage payload created a new HKCU Run key at
      logon-persistence time, initially masquerading as REALTEK AUDIO components ("Realtek HD
      Audio Universal Service," "Realtek HD Audio," "Realtek Audio," "Realtek Audio UHD" —
      naming evolved February through May 2026 in step with the filename-generation changes);
      from mid-May the operators ALSO began creating Run keys masquerading as WINAUDIO
      components ("WinAudio life2"). Registry-value TARGETS pointed at the evolving
      loader/backdoor filenames under AppData\Local\Temp or AppData\Roaming.
      SECONDARY PERSISTENCE: ".vbs scripts (mklink-%.vbs) to create Startup folder shortcuts,"
      disguised as seemingly legitimate filenames ("SecurityHealth," "OneDriveUpdate"), with
      hidden file attributes applied in some instances.

    certificate_pinning_behavior: |
      "Sophos analysis indicates that STAC4749 operators embedded certificate authority (CA)
      certificates directly within their payloads to tightly control C2 communications. Several
      of the Golang-based implants contained hard-coded CA certificates associated with issuer
      names such as loop-CA, connectify-CA, and james-bond-CA. These implants only established
      encrypted connections if the C2 server had the same issuer as the embedded certificate."
      Sophos's stated purpose/effect: "In addition to limiting unintended exposure and
      complicating analysis, this approach enabled clear infrastructure segmentation. Payloads
      sharing the same issuer consistently communicated with the same C2 servers, while those
      using different issuers connected to separate infrastructure. This pattern suggests the
      operators deliberately segment C2 infrastructure by payload or operational role rather
      than relying on a single shared backend." The Golang C2 implants themselves are launched
      via PowerShell Invoke-WebRequest with a "--token-raw" argument carrying two Base64-encoded
      components (a token and a corresponding signature) used to authenticate to C2 or validate
      commands; implant filenames are one-word nouns (graph.exe, confirm.exe, midnight.exe,
      shield.exe) that differ per compromise. In several incidents these implants "only
      communicated with C2 servers protected by pinned certificates and used unique identifiers
      to manage victims individually." In ransomware-culminating cases, operators additionally
      deployed DWAgent/AnyDesk for redundant remote-access channels, and in one case a custom
      tunneling tool (a standalone reverse-SOCKS-proxy binary, described generically here)
      supporting up to 1,000 concurrent connections — Sophos notes its use "as a standalone
      component indicates the operators selectively deployed proxy functionality rather than
      embedding it into a single all-purpose backdoor."

    time_to_ransomware_figure: >
      "In one incident, the time from initial access to ransomware deployment was less than 17
      hours, consistent with prior Chaos ransomware cases observed by Sophos analysts." Encryption
      "occurred nearly simultaneously across endpoints, and ransom notes with filenames such as
      readme.chaos.txt were dropped on affected systems." At least THREE STAC4749 compromises
      led to Chaos ransomware deployment overall.

    sophos_attribution_and_muddywater_statement: |
      Motivation assessment (Sophos's own confidence-graded language): "Given the short interval
      between initial access and encryption, Sophos analysts assess WITH HIGH CONFIDENCE that
      STAC4749 was a financially motivated operation that either directly deployed ransomware
      or coordinated with affiliates." Chaos RaaS background (Sophos's own statement, not
      STAC4749-specific): "active since at least February 2025 and was reportedly launched by
      former members of BlackSuit (Royal) ransomware operation (tracked by CTU researchers as
      GOLD SOUVENIR)." Sophos explicitly notes the STAC4749 custom-malware chain itself "has
      not been reported" elsewhere, but tactics (Teams vishing abusing Quick Assist, DWAgent/
      AnyDesk for lateral movement) align with prior Chaos-linked activity Sophos and third
      parties have documented, including a May 2025 Sophos report on similar Teams-vishing
      activity leading to 3AM ransomware (also linked to former BlackSuit members).
      MUDDYWATER — explicit non-linkage statement (verbatim, as requested): "In May 2026,
      Rapid7 suggested that Chaos may be used as a false flag by the Iranian threat group known
      as MuddyWater (tracked by CTU researchers as COBALT ULSTER). SOPHOS ANALYSTS HAVE FOUND
      NO EVIDENCE LINKING STAC4749 ACTIVITY TO THAT GROUP. Instead, limited hands-on-keyboard
      artifacts suggest a Russian-language connection. For example, Sophos analysts observed a
      mistyped command (a Cyrillic-keyboard-layout typo consistent with attempting to type
      'dir') that is consistent with the operator attempting to enter 'dir' while using a
      Russian keyboard layout. HOWEVER, THERE IS INSUFFICIENT EVIDENCE FOR ATTRIBUTION." — i.e.
      Sophos explicitly rules out the MuddyWater/false-flag hypothesis for STAC4749 specifically
      (that hypothesis was Rapid7's, about Chaos generally, not Sophos's own claim), while
      simultaneously declining to commit to a Russian-actor attribution despite the keyboard
      artifact.

    victimology_stats: >
      Between February and June 2026, "nearly 95% of observed cases... targeted organizations
      based in Canada (50%) and the U.S. (44%)." Sector distribution: services 20%, manufacturing
      17%, energy 12%, construction and engineering 12%; Sophos separately notes "all the legal
      organizations targeted in the campaign specialize in intellectual property (IP) law or
      services" — a targeting specificity worth flagging for any IP-law-adjacent constituency.

    techniques: [T1566.004, T1219, T1021.001, T1547.001, T1547.009, T1027, T1572, T1090, T1071.001, T1486, T1105]
    techniques_note: "T1105 (Ingress Tool Transfer) added for the PowerShell Invoke-WebRequest download-and-launch step of the Golang implants; all others carried over from the S3 mapping and confirmed against the full text."

    benign_lookalike: >
      Sophos does not state a single explicit discriminator, but the report's own detection
      recommendations imply one: legitimate Quick Assist/RemSupp/DWAgent/AnyDesk sessions are
      normally INITIATED BY THE END USER in response to an INTERNAL, pre-arranged support
      ticket — the STAC4749 pattern is inverted (an UNSOLICITED external Teams chat/call from an
      unrecognized .top-TLD "IT support" persona, immediately followed by a request to launch
      or install a remote-access tool). Sophos's stated control: "establish processes to
      investigate unexpected contact from external parties, especially interactions that
      attempt to persuade users to launch remote support tools, download software, or grant
      system access" — i.e. the discriminator is the ABSENCE of a corresponding internal
      support ticket / employee-initiated request, not any property of the RMM tool itself
      (which is fully legitimate software in both the benign and malicious case).

    evidence:
      - quote: "STAC4749 operators created IT-themed cloud domains under the \".top\" top-level domain (TLD) and leveraged plausible employee usernames to make the accounts appear legitimate"
        attribution: "Sophos X-Ops"
        source_url: "https://www.sophos.com/en-us/blog/chaos-in-teams-vishing"
      - quote: "Retrieved its AES key and initialization vector (IV) from a public GitHub repository and used the key to decrypt embedded configuration data and payload"
        attribution: "Sophos X-Ops"
        source_url: "https://www.sophos.com/en-us/blog/chaos-in-teams-vishing"
      - quote: "Sophos analysts have found no evidence linking STAC4749 activity to that group. Instead, limited hands-on-keyboard artifacts suggest a Russian-language connection... However, there is insufficient evidence for attribution."
        attribution: "Sophos X-Ops"
        source_url: "https://www.sophos.com/en-us/blog/chaos-in-teams-vishing"
      - quote: "Given the short interval between initial access and encryption, Sophos analysts assess with high confidence that STAC4749 was a financially motivated operation that either directly deployed ransomware or coordinated with affiliates."
        attribution: "Sophos X-Ops"
        source_url: "https://www.sophos.com/en-us/blog/chaos-in-teams-vishing"
      - quote: "Several of the Golang-based implants contained hard-coded CA certificates associated with issuer names such as loop-CA, connectify-CA, and james-bond-CA. These implants only established encrypted connections if the C2 server had the same issuer as the embedded certificate."
        attribution: "Sophos X-Ops"
        source_url: "https://www.sophos.com/en-us/blog/chaos-in-teams-vishing"

  # ==========================================================================
  # 4. legacyhive-windows-profile-registry-hijack
  # ==========================================================================
  - key: legacyhive-windows-profile-registry-hijack
    title: "LevelBlue SpiderLabs: LegacyHive cross-account profile hijack via offline registry-hive manipulation and NT Object Manager namespace redirection"
    primary_source:
      url: "https://www.levelblue.com/blogs/spiderlabs-blog/legacyhive-hunting-windows-profile-initialization-abuse-through-offline-registry-manipulation"
      publisher: "LevelBlue SpiderLabs (authors: Serhii Melnyk and Timmy Lister)"
      published_at: "2026-07-27T14:07:50Z"
      published_at_source: "Confirmed via the page's own JSON schema 'datePublished' field (exact ISO timestamp), not the rendered 'July 27, 2026' date-only byline. This is ~38 hours before this run's 04:08Z kickoff, i.e. genuinely outside a strict 24-36h window — correctly flagged by the spawn message as being carried on relevance grounds, not recency."
    disclosure_context: >
      LegacyHive is the latest in a named SERIES of Windows PoCs from a disclosure actor
      LevelBlue calls "Nightmare-Eclipse" — preceded by GreenPlasma, YellowKey, MiniPlasma,
      RoguePlanet and GreatXML — released shortly after Microsoft's July 2026 Patch Tuesday.
      LevelBlue is explicit that this is NOT a traditional software vulnerability (no CVE):
      "Like its predecessors, LegacyHive explores a different corner of the Windows operating
      system, this time focusing on profile initialization and registry hive loading rather
      than introducing a traditional software vulnerability."

    exact_prerequisite_bounding_severity: |
      PRECISE PREREQUISITE (this is the key severity-bounding fact): the attacker must already
      hold (1) an active, logged-in LOW-PRIVILEGED account session on the target machine
      (their own foothold), AND (2) valid CREDENTIALS FOR A SEPARATE "HELPER" ACCOUNT on the
      same machine (a second account's username + password, distinct from both the attacker's
      own logged-in account and the ultimate target account). In the published PoC example,
      the low-privileged logged-in user possesses credentials for helper account "u1"; the
      command line is "LegacyHive.exe u1 test123 adm" where u1/test123 are the helper account's
      credentials and "adm" is the target account whose profile data becomes exposed. Critically,
      the attacker does NOT need the target ("adm") account's own credentials at any point —
      the technique's entire value is bypassing that requirement by hijacking the HELPER
      account's profile-load path so it aliases into the target account's UsrClass.dat
      directory. LevelBlue's own scoping statement: "the publicly released PoC should also be
      viewed in context. As released, it requires control of a low-privileged account and the
      credentials of a separate helper account, MAKING IT MORE USEFUL AS A POST-COMPROMISE
      CAPABILITY THAN AS A STANDALONE ATTACK. According to the disclosure, these limitations
      were intentionally introduced before publication to discourage immediate abuse." Bottom
      line for severity triage: this is strictly a POST-COMPROMISE / LATERAL technique requiring
      the attacker to have already obtained at least one additional (non-target) local account's
      valid credentials — it is not remote, not pre-auth, and not a privilege-escalation-from-
      nothing primitive.

    seven_stage_execution_chain: |
      Stage 1 — Building a shadow namespace: creates a custom directory hierarchy inside the
      Windows NT OBJECT MANAGER namespace (a low-level namespace beneath the Win32 API that
      "most applications never interact with"), under a restricted path resolved dynamically
      via NtCreateDirectoryObjectEx (resolved from ntdll.dll) — called from USER MODE, which
      LevelBlue calls "unusual behavior — normal applications almost never create new Object
      Manager namespaces after system initialization."
      Stage 2 — Redirecting paths via symbolic links: creates OBJECT MANAGER SYMBOLIC LINKS
      (native-API-level, NOT Windows shortcuts or NTFS junctions) inside the Stage-1 namespace
      via NtCreateSymbolicLinkObject, forming the redirection layer that later determines where
      the modified registry values actually resolve. LevelBlue: "The combination of
      NtCreateDirectoryObjectEx followed by NtCreateSymbolicLinkObject is extremely rare in
      legitimate software."
      Stage 3 — Modifying the registry hive OFFLINE: opens the (helper) user's ntuser.dat file
      DIRECTLY and modifies it OFFLINE using Microsoft's own REGISTRY OFFLINE API (offreg.dll),
      targeting the value Software\Microsoft\Windows\CurrentVersion\Explorer\User Shell
      Folders, replacing the normal LOCAL APPDATA path with the Stage-1/2 redirected Object
      Manager path. LevelBlue's key point: "the registry modification itself is legitimate.
      LegacyHive uses valid registry structures, valid APIs, and a valid registry value type.
      The abuse happens because Local AppData no longer points to the user's normal profile
      directory. Instead, it points into the attacker-controlled Object Manager namespace."
      After modification the hive is saved back to disk, replacing the original file — leaving
      "one of the strongest forensic artifacts": a user hive whose Local AppData value
      references BaseNamedObjects, NT paths, or other kernel namespaces "should be considered
      suspicious."
      Stage 4 — The timing trick (oplocks): uses a BATCH OPPORTUNISTIC LOCK
      (FSCTL_REQUEST_BATCH_OPLOCK) on UsrClass.dat — "Instead of relying on timing or repeated
      attempts, the exploit uses a built-in Windows synchronization mechanism to pause execution
      until profile initialization reaches the expected point." LevelBlue frames this as a
      deliberate design choice: "the exploit does not fight the Windows startup process — it
      uses Windows' own synchronization features to control it."
      Stage 5 — Triggering profile loading: launches a process AS THE TARGET (HELPER) USER via
      CREATEPROCESSWITHLOGONW using the LOGON_WITH_PROFILE flag — the goal "is not execution; it
      is forcing Windows to perform a normal profile load," which activates the modified
      registry hive and redirected paths.
      Stage 6 — Confirming the hijack: validation via RegOpenUserClassesRoot; if Windows exposes
      the modified user hive, the chain has succeeded.
      Stage 7 — Cleanup without removing impact: temporary files are removed, but "the modified
      registry configuration and Object Manager redirection persist" — i.e. the persistence is
      in the on-disk hive/namespace state, not in any running process or scheduled task.

    detection_signals: |
      LevelBlue names three specific behavioral signals mapped directly to the chain (rule
      code / query syntax intentionally NOT reproduced here per the no-rule-code policy — only
      the underlying telemetry concept):
        1. REGISTRY SIGNAL — Object Manager path injection in the VOLATILE ENVIRONMENT registry
           key: once the tampered hive loads, %LOCALAPPDATA% resolves into the Object Manager
           namespace (e.g. a BaseNamedObjects-rooted path) instead of a normal filesystem path
           — directly queryable from the per-user Volatile Environment key.
        2. FILE-ACCESS SIGNAL — offline ntuser.dat / UsrClass.dat STAGING: because the exploit
           copies and modifies hive files OUTSIDE their normal profile locations, unusual access
           paths to ntuser.dat or UsrClass.dat are themselves detectable, independent of the
           registry values they contain.
        3. PROCESS SIGNAL — cross-account profile load via CreateProcessWithLogonW: LevelBlue
           explicitly cautions that detection should NOT anchor on the specific target
           executable (notepad.exe in the published PoC is trivially substitutable — LevelBlue
           demonstrates this) but on the CALLING PATTERN itself: a cross-account
           CreateProcessWithLogonW invocation using LOGON_WITH_PROFILE, routed through the
           seclogon service.
      EDR-level strongest signal (LevelBlue's own words): "For EDR platforms with visibility
      into native Windows APIs, the strongest signals are user-mode invocations of
      NtCreateDirectoryObjectEx and NtCreateSymbolicLinkObject. These functions are rarely used
      outside system components, debugging tools, or specialized research utilities. Seeing
      both from the same process should immediately warrant investigation."

    levelblue_benign_lookalike_wording: >
      LevelBlue's own explicit discriminator statement (verbatim structure): "Each operation is
      legitimate in isolation but observing them together within a short time window is highly
      unusual and well suited for behavioral correlation by EDR and SIEM platforms." And, on
      the substitutable target-process point specifically: detection should focus on "the
      calling pattern (cross-account, LOGON_WITH_PROFILE, via seclogon) rather than on
      notepad.exe specifically" — because LevelBlue itself demonstrated the PoC can launch any
      binary in place of notepad.exe, so the target executable carries no discriminating value;
      the co-occurrence of offline hive access + Object Manager namespace creation +
      cross-account CreateProcessWithLogonW within a short window is the actual signal.

    reproduction_statement_and_patch_level: >
      "LevelBlue OpsIntel CTI and Threat Operations and Research (THOR) teams reviewed and
      reproduced the complete LegacyHive exploitation chain on FULLY PATCHED WINDOWS SYSTEMS
      WITH THE JULY 2026 PATCH TUESDAY UPDATES INSTALLED, confirming the PoC functions as
      described." I.e. this is not a patched/mitigated flaw — LevelBlue confirms the technique
      works unmodified against a fully current, fully patched Windows build, consistent with
      it being an abuse of legitimate OS mechanisms rather than a fixable bug.

    scope_caveat: >
      LevelBlue frames the released PoC as "a demonstration of the technique rather than a
      definitive representation of its full potential" — adapting it to alternative
      profile-loading workflows "would require additional engineering and a solid
      understanding of Windows internals," and future variants "may change how profile loading
      is triggered or which registry hives are targeted, but they will likely continue to rely
      on the same core building blocks: offline hive modification, NT Object Manager
      manipulation, controlled registry loading, and abnormal profile initialization." No
      Microsoft mitigation exists yet for "this class of abuse" per LevelBlue.

    techniques: [T1112, T1078, T1574]
    techniques_note: >
      Imperfect mapping, flagged explicitly rather than forced: T1112 (Modify Registry) is the
      most directly source-supported id (the offline User Shell Folders hive edit). T1078
      (Valid Accounts) covers the prerequisite use of the helper account's own valid
      credentials. T1574 (Hijack Execution Flow) is offered as the closest parent category for
      the Object-Manager-namespace path-redirection mechanism, but no existing enterprise
      sub-technique cleanly describes "offline profile-hive path redirection via NT Object
      Manager symbolic links" — this is a genuine ATT&CK-coverage gap the source itself
      effectively documents (a new technique class), not a mapping the agent is confident in;
      compose with that caveat intact rather than asserting a precise sub-technique id.

    evidence:
      - quote: "As released, it requires control of a low-privileged account and the credentials of a separate helper account, making it more useful as a post-compromise capability than as a standalone attack. According to the disclosure, these limitations were intentionally introduced before publication to discourage immediate abuse."
        attribution: "LevelBlue SpiderLabs"
        source_url: "https://www.levelblue.com/blogs/spiderlabs-blog/legacyhive-hunting-windows-profile-initialization-abuse-through-offline-registry-manipulation"
      - quote: "the registry modification itself is legitimate. LegacyHive uses valid registry structures, valid APIs, and a valid registry value type. The abuse happens because Local AppData no longer points to the user's normal profile directory. Instead, it points into the attacker-controlled Object Manager namespace."
        attribution: "LevelBlue SpiderLabs"
        source_url: "https://www.levelblue.com/blogs/spiderlabs-blog/legacyhive-hunting-windows-profile-initialization-abuse-through-offline-registry-manipulation"
      - quote: "For EDR platforms with visibility into native Windows APIs, the strongest signals are user-mode invocations of NtCreateDirectoryObjectEx and NtCreateSymbolicLinkObject. These functions are rarely used outside system components, debugging tools, or specialized research utilities. Seeing both from the same process should immediately warrant investigation."
        attribution: "LevelBlue SpiderLabs"
        source_url: "https://www.levelblue.com/blogs/spiderlabs-blog/legacyhive-hunting-windows-profile-initialization-abuse-through-offline-registry-manipulation"
      - quote: "LevelBlue OpsIntel CTI and Threat Operations and Research (THOR) teams reviewed and reproduced the complete LegacyHive exploitation chain on fully patched Windows systems with the July 2026 Patch Tuesday updates installed, confirming the PoC functions as described."
        attribution: "LevelBlue SpiderLabs"
        source_url: "https://www.levelblue.com/blogs/spiderlabs-blog/legacyhive-hunting-windows-profile-initialization-abuse-through-offline-registry-manipulation"

  # ==========================================================================
  # 5. minnesota-water-utilities-ot-attack
  # ==========================================================================
  - key: minnesota-water-utilities-ot-attack
    title: "Coordinated two-day OT cyberattack disrupts 30+ Minnesota water/wastewater utilities — attribution explicitly unconfirmed by every named authority"
    sources:
      - { url: "https://www.cybersecuritydive.com/news/authorities-investigating-a-coordinated-cyberattack-against-minnesota-water/826427/", publisher: "Cybersecurity Dive (David Jones)", published_at: "2026-07-28T17:20:39 (US Eastern, no explicit offset in schema); dateModified 2026-07-28T18:13:56 same local scale", role: "primary" }
      - { url: "https://statescoop.com/coordinated-cyberattack-disrupts-water-utilities-in-30-minnesota-communities/", publisher: "StateScoop (Colin Wood)", published_at: "2026-07-28T18:54:49Z", role: "primary — richer per-utility detail" }
      - { url: "https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-097a", publisher: "CISA/FBI/NSA/EPA/DOE/CNMF/Treasury joint advisory AA26-097A", published_at: "originally 2026-04-07; last updated 2026-07-22", role: "background/TTP reference for the ONGOING national campaign — NOT itself reporting the Minnesota event" }

    scale_and_dates: |
      "More than 30 Minnesota communities saw their water and wastewater utilities disrupted by
      a coordinated cyberattack on Sunday and Monday [26–27 July 2026], the state's technology
      bureau announced Tuesday [28 July]." Cybersecurity Dive corroborates: "The coordinated
      attacks took place over two days, starting on Sunday, according to authorities." This is
      a TWO-DAY, MULTI-COMMUNITY, COORDINATED event, not a single-utility incident.

    what_was_disrupted_vs_not: |
      DISRUPTED (per named utilities, StateScoop):
        - City of Braham (pop. ~1,700): water plant went "offline for an unknown reason" Monday
          morning; officials initially asked residents to MINIMIZE WATER USE because the city's
          water tower held only a "limited quantity" — this is a genuine, if temporary,
          consumption-guidance instruction (a nuance the Cybersecurity Dive framing of "no
          evidence that local officials have instructed residents to modify their usage" does
          NOT fully capture — Braham DID issue a temporary minimize-use request tied to tank
          level, later lifted once the plant was back online). A second Braham notice
          clarified the plant was back online and that the outage was "the result of a
          malicious cyber-attack of computerized operating systems by UNKNOWN ACTORS."
        - Plymouth (Minneapolis suburb, ~80,000 pop.): IT division "disconnected the affected
          equipment from the network to stop the cyberattack and avoid any potential
          retargeting while the equipment is reconfigured." Impact SCOPE explicitly stated:
          "the attack was limited to equipment connected via CELLULAR COMMUNICATIONS at two
          city water towers and 'multiple' lift stations."
        - South St. Paul: "identified a cyberattack on Monday that impacted certain automated
          controls." After contingency procedures, "no major impact to drinking and wastewater
          treatment operations."
      NOT DISRUPTED / EXPLICITLY REASSURED (consistent across multiple utilities and both news
      primaries): no evidence of impact to drinking-water SAFETY or treatment QUALITY; Plymouth
      explicitly: "the water is safe and there is no need for the public to adjust
      consumption"; South St Paul: "Drinking water remains safe for use."
      EQUIPMENT CLASS affected, where specified: PLCs / "automated controls" and CELLULAR-
      CONNECTED field equipment at water towers and lift stations — i.e. remote/field OT
      endpoints, not (per any source) the treatment-process chemistry/quality-control systems
      themselves.

    attribution_statements_verbatim: |
      1. Braham's OWN city statement (via its official website, quoted by Cybersecurity Dive):
         the outage was the result of "a malicious cyber-attack of computerized operating
         systems by UNKNOWN ACTORS" — the affected utility itself explicitly says "unknown
         actors," no actor name.
      2. FBI (via spokesperson, to Cybersecurity Dive): "The FBI is aware of the incident and in
         contact with victims to resolve the matter." — no attribution content, purely a
         posture statement.
      3. TJ Sayers, Senior Director of Threat Intelligence, Center for Internet Security
         (quoted directly by StateScoop) — the clearest EXPLICIT non-attribution: "affirmed
         that the Minnesota attacks have NOT YET BEEN ATTRIBUTED TO ANY PARTICULAR PARTY, and
         that 'IT IS UNCLEAR' whether the attacks involved the programmable logic controllers
         CISA warned about." Sayers separately noted that of the numerous nation-state attacks
         on US water facilities in recent years, none has documented "major downstream health
         impacts."
      4. StateScoop's OWN editorial inference (NOT an official/authority claim — must be
         labeled as the reporter's framing, not attributed to any named source): "The Minnesota
         state government and several local governments contacted for this story declined to
         comment on who attacked the state's water utilities, THOUGH IRAN IS A REASONABLE
         GUESS." This sentence is StateScoop's own editorializing, immediately followed by
         context about the CISA/FBI/NSA/EPA/DOE/CNMF/Treasury AA26-097A advisory update and
         about a separate, unrelated recent event (US strikes near the Strait of Hormuz and a
         Hanzala-group claim against several California water utilities) — none of which is
         presented by StateScoop as direct evidence tying Iran to the Minnesota event
         specifically.
      5. Cybersecurity Dive's framing (its own subhead/lede, not an authority quote): "The
         two-day attack comes days after federal officials warned of state-linked threat groups
         targeting a wider set of industrial devices" and "Iran-linked hackers have been
         exploiting vulnerable devices in an effort to disrupt a series of critical
         infrastructure providers, including drinking water, wastewater treatment and energy
         companies." This is CONTEXTUAL FRAMING tied to the AA26-097A advisory timing, not a
         direct claim by CSD or any named official that Iran conducted the Minnesota attack.
      NET: as of both news primaries' publication, NO named authority (FBI, CISA, EPA, MNIT,
      any affected city) has attributed the Minnesota attack to any actor; the Iran/CyberAv3ngers
      connection appearing in press coverage is CONTEXTUAL JUXTAPOSITION with the concurrently-
      updated AA26-097A advisory and reporter inference, not a stated attribution. Compose this
      distinction carefully — do not let AA26-097A's Iran attribution (which is about a
      SEPARATE, ongoing nationwide PLC-targeting pattern) bleed into a direct claim about who
      conducted the Minnesota incident specifically.

    authorities_involved: >
      State: Minnesota IT Services (MNIT) — coordinating response; John Israel (MNIT assistant
      commissioner / Minnesota's chief information security officer) quoted describing a
      "whole-of-government response" that helped "prevent more serious impacts to critical
      services"; Minnesota's own public-safety and health departments; a state fusion center.
      Federal: FBI, CISA, EPA (all three coordinating with local utilities per Cybersecurity
      Dive); MNIT's own listed federal partners per StateScoop match this same set.
      Local: individual city/utility officials (Braham's mayor Nate George, Plymouth's city
      spokesperson, South St. Paul officials).

    stated_technique: >
      No utility or authority names a specific intrusion technique for the MINNESOTA incident
      itself (TJ Sayers explicitly says it is unclear whether the CISA-warned PLC vector was
      involved). The closest to a technical detail is Plymouth's own description of IMPACT
      SCOPE: the attack was "limited to equipment connected via cellular communications" at
      water towers and lift stations — i.e. cellular-connected OT/field endpoints were the
      affected equipment class, though this is a scope statement, not a confirmed intrusion
      vector.

    aa26_097a_background_behavior_and_mitigations_no_iocs: |
      AA26-097A (originally 7 April 2026, updated 22 July 2026) is a SEPARATE, ONGOING national
      advisory describing Iranian-affiliated APT activity against internet-connected PLCs
      broadly (Rockwell Automation/Allen-Bradley CompactLogix and Micro850; Schneider Electric
      BMX P34/Modicon M340; Siemens S7-1200) — it is background/TTP context for this item, NOT
      itself reporting on the Minnesota event.
      LADDER-LOGIC / HMI TAMPERING BEHAVIOR (verbatim from the advisory, no IOC tables
      reproduced): actors used LEASED, THIRD-PARTY HOSTED INFRASTRUCTURE and the vendors' OWN
      ENGINEERING/CONFIGURATION SOFTWARE (Rockwell Studio 5000 Logix Designer; Schneider
      EcoStruxure Control Expert; Siemens TIA Portal) to connect to MISCONFIGURED, INTERNET-
      FACING PLCs and exfiltrate device PROJECT FILES to attacker-controlled infrastructure. "At
      one U.S. victim, the FBI observed the APT actors download a malicious project file to a
      targeted PLC using configuration software. Analysis indicated the project file retained
      ladder logic for downstream function but ADDED LOGIC THAT OVERRODE SPECIFIC INSTRUCTION
      SETS RESPONSIBLE FOR MAINTAINING SAFE OPERATING PARAMETERS in the victim's environment."
      Impact: "the FBI and CISA identified the modification and deletion of project file logic,
      to include Add-On Instructions (AOIs) [analogous to a 'Function Block'/'User Defined
      Function Block' in other PLC vendors' programs] and data manipulation on HMI and SCADA
      displays. Additionally, THE CHANGES DISABLED CRITICAL SHUTDOWN AND ALARM LOGIC, ALLOWING
      SYSTEMS TO ENTER UNSAFE CONDITIONS WITHOUT NOTIFYING OPERATORS OF THE ANOMALIES." In one
      instance, actors used Dropbear SSH software on victim MODEMS to gain remote access via
      port 22; inbound traffic was otherwise observed on PLC-associated ports 44818, 2222, 102
      and 502 (ports named as protocol context, not reproduced as an indicator list to block —
      CISA itself cautions organizations to "investigate or vet" any IP indicators before
      blocking).
      MITIGATION SET (CISA's own, condensed — no IOCs): disconnect PLCs from the public-facing
      internet and mediate all remote access through a secure gateway/jump host (never direct
      inbound exposure); for cellular modems specifically, secure with strong authentication,
      enable and review modem logs, and consider isolated architectures (private APN, 5G
      PNI-NPN, cellular SD-WAN, ZTNA, or site-to-site VPN); strictly control network access to
      PLCs via firewall/ACL rules limited to authorized control-system devices; for controllers
      with a physical mode switch, place it in RUN position (only switch to program/remote
      mode briefly for updates, and validate project files before switching back); enable
      programming-protection features in vendor configuration software; review project files
      for unauthorized changes using vendor integrity-checking tools and visual comparison
      against known-good logic (explicitly including AOI review); change all device passwords
      from defaults to complex unique values; implement MFA for any remote access to the OT
      network; keep PLC firmware/software patched; disable unused authentication methods and
      unnecessary services (Telnet, FTP, RDP, VNC, web services on the device); monitor asset-
      management systems for configuration drift and monitor network-traffic content for
      unusual logins or mode-changing/program-modifying protocol functions; ensure any
      third-party OT service providers are informed of the active threat. CISA separately notes
      this advisory update does NOT represent a new vulnerability in the named products — it
      is "opportunistic targeting" of misconfiguration, not a CVE-driven flaw.

    techniques_aa26_097a_source_provided: [T1219, T1041, T1565]
    techniques_aa26_097a_note: >
      These three are CISA's own enterprise-ATT&CK-mapped ids for AA26-097A (T1219 Remote
      Access Software — Dropbear SSH on victim modems; T1041 Exfiltration Over C2 Channel —
      project-file exfil via the leased third-party infrastructure; T1565 Data Manipulation —
      project-file logic modification/deletion + HMI/SCADA display tampering). CISA also maps
      two ICS-matrix (not enterprise) ids not carried into this pipeline's technique taxonomy:
      T0883 (Internet Accessible Device) and T0885 (Commonly Used Port) — flagged for awareness
      since the pipeline's techniques[] field is enterprise-ATT&CK-only.
      No technique is source-stated for the MINNESOTA incident itself (attribution/vector
      unconfirmed) — do not assign AA26-097A's techniques to the Minnesota incident entry
      without an explicit caveat that this is background-advisory context, not a confirmed
      match to the Minnesota event's own mechanism.

    evidence:
