  # ==========================================================================
  # 2. mirage-kitten-nightledger-arcbridge-bridgehead
  # ==========================================================================
  - key: mirage-kitten-nightledger-arcbridge-bridgehead
    title: "Kaspersky Securelist: Mirage Kitten (self-stated = UNC1549/Smoke Sandstorm/Nimbus Manticore) fields NightLedger backdoor and two proxy-resilient WebSocket tunnelers"
    primary_source:
      url: "https://securelist.com/mirage-kitten-new-tools/120811/"
      publisher: "Kaspersky Securelist (GReAT) — authors Omar Amin, Vasily Berdnikov"
      published_at: "2026-07-28T08:00:20Z"
      modified_at: "2026-07-28T09:18:10Z"

    alias_mapping_confirmation: |
      CONFIRMED — this is Kaspersky's OWN stated equivalence, not an externally-sourced or
      inferred mapping. The article's own opening sentence: "Mirage Kitten – also known as
      UNC1549, Smoke Sandstorm, and Nimbus Manticore – is an advanced persistent threat (APT)
      group focused on cyber-espionage operations against aerospace, aviation, defense, and
      telecommunications sectors across the Middle East and Africa..." The same equivalence is
      repeated in the article's own meta-description/schema data ("Kaspersky researchers reveal
      previously undocumented malware attributed to Mirage Kitten (UNC1549, Smoke Sandstorm,
      Nimbus Manticore)..."). Do NOT attribute this alias set to any third party — Kaspersky
      states it directly, in its own voice, as background framing before any technical content.

    nightledger_hijack_chain: |
      The DLL-hijack mechanism, per Kaspersky's exact description: "The implant masquerades as
      SspiCli.dll and appears to be designed for DLL search-order hijacking, targeting a
      legitimate AppVShNotify.exe binary. While AppVShNotify.exe does not directly import
      SspiCli.dll, it imports RPCRT4.dll, which can delay-load SspiCli.dll when it invokes an
      RPC API that requires authentication. This allows a co-located malicious SspiCli.dll to
      be loaded while forwarding expected exports to the legitimate DLL." In plain terms: the
      malicious sspicli.dll is placed alongside the legitimate AppVShNotify.exe; the chain of
      trust exploited is AppVShNotify.exe → (imports) RPCRT4.dll → (delay-loads, only when an
      authenticated RPC API call actually occurs) SspiCli.dll — and because Windows resolves
      that delay-load via the normal DLL search order, the co-located malicious DLL wins and
      is loaded under the trusted, legitimately-signed AppVShNotify.exe process, forwarding
      expected exports back to the genuine DLL so the host process continues functioning
      normally (proxying/forwarding-DLL pattern, not a crash-on-load).

    nightledger_command_dispatch: |
      CORRECTION to the S3 findings summary for this run, which stated NightLedger "supports 13
      numeric command IDs" — the full-text re-read counts 16 distinct numeric command IDs in
      the article's own table: 1 (gather user/host identity info), 3 (execute a
      process/program), 17 (list directories), 20 (download a file to the infected system), 25
      (gather host and network information), 27 (copy a file), 30 (update beacon interval), 36
      (take a screenshot), 43 (load a DLL), 56 (kill a process), 62 (delete a file), 69
      (terminate thread), 70 (upload file to C2 via POST), 75 (enumerate logical drives), 90
      (list processes), 93 (collect C:\Windows\debug\NetSetup.log together with process-list
      output — NetSetup.log is described by Kaspersky as "a Windows diagnostic log generated
      under C:\Windows\debug\ during domain/workgroup join, unjoin, and related network setup
      operations"). Command output is returned to the C2 via a POST request to a
      distinctly-named endpoint (endpoint path omitted here as attacker infrastructure detail).
      Payload tokenization: "the implant tokenizes the payload using the custom delimiter
      (#%%#) and passes the parsed fields to its command dispatcher."

      TWOSTROKE relationship — Kaspersky's OWN stated basis and confidence level: Kaspersky
      does NOT use a calibrated confidence phrase (no "high/medium confidence" language) for
      this specific dispatch-structure comparison. The article states it as an observational,
      code/behavior-level similarity claim: "From a development standpoint, this is similar to
      TWOSTROKE, a backdoor attributed to the same APT and previously documented by GTIG, whose
      C2 response is hex-encoded and uses (@##@) as a field separator." The conclusion restates
      this as: "The NightLedger backdoor retains similar core command functionality to
      TWOSTROKE while introducing additional capabilities, including screenshot capture and
      collection of the NetSetup.log file." By contrast, the broader NightLedger→Mirage Kitten
      attribution DOES carry a stated basis (though still no numeric/qualitative confidence
      label): "NightLedger is a recently identified Windows backdoor that we attribute to
      Mirage Kitten based on code and behavioral similarities to the historical implants
      developed and used by the group." Net: treat the TWOSTROKE-lineage claim as a
      Kaspersky-stated structural/behavioral similarity observation, not a confidence-graded
      assessment — do not upgrade the wording when composing.

    bridgehead_arcbridge_proxy_behavior: |
      BridgeHead's HTTP 407 handling (its own dedicated logic, described by Kaspersky in a
      table): on receiving HTTP 407 (Proxy Auth Required), the tunneler "Queries supported auth
      schemes via WinHttpQueryAuthSchemes, selects Negotiate (0x10) or NTLM (0x2) IN THAT EXACT
      ORDER, sets Windows SSO credentials (null username/password), retries up to 3 times." On
      HTTP 101 (Switching Protocols) it proceeds to WebSocket upgrade + authentication; any
      other response closes all handles and enters exponential backoff. Kaspersky's own
      framing: "The implant is designed to operate through corporate proxy environments by
      handling HTTP 407 responses, negotiating Windows-integrated proxy authentication with
      Negotiate preferred over NTLM, retrying with the current user's SSO context, and falling
      back to exponential C2 connection retry logic capped at 60 seconds." Kaspersky further
      states this "closely mirrors the enterprise proxy traversal logic seen in the backdoor we
      track internally as Retrograde, which overlaps with tooling publicly reported as MiniFast
      / MiniUpdate, attributed to the same APT group" — a SEPARATE internal-alias/overlap claim
      from the TWOSTROKE one, tying BridgeHead's proxy logic (not NightLedger's dispatch logic)
      to a third tool lineage. Once authenticated, BridgeHead functions as a full SOCKS5 tunnel
      proxy: "The C2 server initiates all tunnel connections by sending binary commands over
      the WebSocket; the implant simply forwards traffic between server-specified targets and
      the WebSocket channel" — described by Kaspersky as making the host "a relay node: the
      operator runs tools server-side, and all resulting TCP traffic is tunneled through the
      victim's machine as if originating from the victim's network." The wire protocol supports
      7 active message types (CONNECT, CONNECT_RESPONSE, DATA, DISCONNECT, PING/PONG every 30
      seconds, and FLOWCTRL for flow throttling), addressed in SOCKS5-style target encoding
      (IPv4 / domain name / IPv6).
      ArcBridge (a separate, related tool, first identified April 2026) implements its own
      WebSocket tunneling with an OPEN (create proxy/tunnel session) and DNS (hostname/address
      resolution) command set; its embedded configuration block carries C2 host, port,
      retry/timeout value, an SSL flag and a likely implant identifier — a simpler control
      surface than BridgeHead's full SOCKS5 relay.

    username_substring_activation_gate: |
      Both BridgeHead and a separately-hunted NightLedger-adjacent variant implement the SAME
      per-target anti-analysis gate: the malware "dynamically loads advapi32.dll, resolves
      GetUserNameA, retrieves the current Windows username, converts it to lowercase, and
      searches for a specific substring in it." Kaspersky's own read: "This behavior suggests
      prior reconnaissance was performed within the internal network and the username check is
      needed to make sure it runs on a specific machine. This is potentially intended to
      prevent execution of the standalone malware sample inside virtual analysis systems. If
      the substring is not found, the function returns silently without activating." The
      hardcoded control value is a 3-CHARACTER substring that must appear within the lowercased
      username; on the separately-hunted variant, Kaspersky states this "confirm[s] per-target
      tailoring of each deployed binary" — i.e. Kaspersky treats this as evidence that each
      sample is individually built/configured for a specific intended victim host rather than
      distributed as one generic binary across a target set.

    victimology_sentence: >
      "According to our telemetry, we identified victims across Middle East and African
      countries including Egypt, SMB and government environments in Jordan and Tanzania,
      aviation organizations in Pakistan, telecommunication companies in Ethiopia and
      financial-sector entities in Burkina Faso."

    infrastructure_note: >
      Kaspersky states the group's tunneling-utility reliance "aligns with previous public
      reporting, which documented the group's use of the LIGHTRAIL and POLLBLEND tunnelers" and
      notes "a gradual shift away from Microsoft Azure subdomain-style infrastructure in favor
      of Cloudflare-backed domains in some of its malware, a change likely intended to
      complicate attribution while maintaining resilient command-and-control communications."
      No initial-access vector was confirmed for most samples in this specific activity, though
      Kaspersky notes BridgeHead deployment "followed targeted spear-phishing activity
      consistent with tradecraft we recently documented as part of our private threat
      intelligence reporting service and publicly reported by Unit 42 and Check Point
      Research" — recruitment-themed lures impersonating trusted brands/hiring platforms and
      lookalike videoconferencing pages redirecting to malicious archives on third-party
      file-sharing services.

    techniques: [T1574.001, T1071.001, T1090, T1572, T1113, T1057, T1082, T1018]
    techniques_note: "T1018 (Remote System Discovery) added for NightLedger's 'gather host and network information' command; all others carried over from the S3 mapping and confirmed against the full text."

    benign_lookalike: >
      Kaspersky does not offer an explicit benign-lookalike discriminator for either tool.
      Analytically: the DLL-hijack chain (RPCRT4.dll delay-loading SspiCli.dll only on an
      authenticated RPC call) means the malicious module loads under a legitimately-signed,
      expected parent process (AppVShNotify.exe) — the discriminating signal is therefore file
      IDENTITY/provenance of the loaded sspicli.dll (co-located with, rather than in its normal
      system directory, and not signed as the genuine Microsoft binary) rather than any
      behavioral anomaly in the parent process itself.

    evidence:
      - quote: "Mirage Kitten – also known as UNC1549, Smoke Sandstorm, and Nimbus Manticore – is an advanced persistent threat (APT) group focused on cyber-espionage operations against aerospace, aviation, defense, and telecommunications sectors across the Middle East and Africa"
        attribution: "Kaspersky Securelist (GReAT)"
        source_url: "https://securelist.com/mirage-kitten-new-tools/120811/"
      - quote: "This implementation closely mirrors the enterprise proxy traversal logic seen in the backdoor we track internally as Retrograde, which overlaps with tooling publicly reported as MiniFast / MiniUpdate, attributed to the same APT group."
        attribution: "Kaspersky Securelist (GReAT)"
        source_url: "https://securelist.com/mirage-kitten-new-tools/120811/"
      - quote: "Still, it implements the same technique of limiting execution to a specific username on the infected machine by hardcoding a 3-character control value that must appear as a substring in the lowercased Windows username retrieved via GetUserNameA. If the match fails, the implant silently exits, confirming per-target tailoring of each deployed binary."
        attribution: "Kaspersky Securelist (GReAT)"
        source_url: "https://securelist.com/mirage-kitten-new-tools/120811/"
      - quote: "According to our telemetry, we identified victims across Middle East and African countries including Egypt, SMB and government environments in Jordan and Tanzania, aviation organizations in Pakistan, telecommunication companies in Ethiopia and financial-sector entities in Burkina Faso."
        attribution: "Kaspersky Securelist (GReAT)"
        source_url: "https://securelist.com/mirage-kitten-new-tools/120811/"

    relation_suggestions_additional:
