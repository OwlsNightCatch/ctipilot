  # ==========================================================================
  # 1. talos-ir-trends-q2-2026 — RUN'S DEEP DIVE
  # ==========================================================================
  - key: talos-ir-trends-q2-2026
    title: "Cisco Talos IR Trends Q2 2026: phishing overtakes exploitation as top initial-access vector, MFA-bypass abuse triples, RMM weaponization drives Sinobi/Warlock ransomware"
    primary_source:
      url: "https://blog.talosintelligence.com/ir-trends-q2-2026/"
      publisher: "Cisco Talos Incident Response (authors: Lexi DiScola, Dave Liebenberg)"
      published_at: "2026-07-28T10:00:01Z"
      note: "Confirmed via the page's own article:published_time / datePublished JSON-LD metadata, not just the rendered 'Tuesday, July 28, 2026 06:00' byline (which appears to be rendered in US Eastern time, consistent with 10:00:01 UTC)."
    corroborating_sources: []
    report_cadence: "QUARTERLY REPORT — Talos IR Trends Q2 2026 (not annual; flag as periodic-report shape rather than 'ANNUAL REPORT' marker)."

    sinobi_engagement_chain_in_order: |
      Talos IR's first-ever Sinobi ransomware engagement (April 2026; RaaS operation active
      "nearly a year" with "minimal public reporting on the actors' operations" per Talos).
      Reconstructed attack-chain order, as Talos describes it:
        1. C2 establishment / durable backdoor: operators weaponized a TROJANIZED MeshAgent
           BINARY (the open-source agent component of the MeshCentral remote-management
           platform) — "a tactic that has not been previously associated with the group in
           public reporting." The trojanized agent was installed as a SYSTEM-LEVEL AUTO-START
           SERVICE, giving the backdoor SYSTEM privileges and boot-persistence from the start
           rather than needing a separate privilege-escalation step.
        2. C2 channel: the backdoor communicated over ENCRYPTED WEBSOCKET (WSS) to an
           attacker-controlled server — chosen specifically, per Talos, to "blend malicious
           traffic with legitimate remote management activity" (MeshCentral/MeshAgent traffic
           is itself normally WebSocket-based, so the malicious channel rides the same
           transport shape as benign RMM traffic).
        3. Dwell time: this approach "maintain[ed] undetected access for approximately THREE
           DAYS before ransomware deployment."
        4. Credential access: lateral movement was enabled by a SERVICE ACCOUNT WITH A WEAK,
           EASILY CRACKED PASSWORD obtained from the domain credential store, ntds.dit (i.e.
           the operators pulled/exfiltrated or otherwise accessed the NTDS database, extracted
           a service-account hash, and cracked it offline).
        5. Lateral movement: the actor "moved laterally through the network using RDP and
           WinRM" with the cracked service-account credentials.
        6. Ransomware deployment mechanism: "the actor ultimately deployed the ransomware
           across the ENTIRE DOMAIN using a MALICIOUS GROUP POLICY OBJECT (GPO) LOGON SCRIPT"
           — i.e. domain-wide, centrally-pushed execution via GPO rather than manual
           host-by-host deployment.
        7. Impact / exfiltration staging: encryption used the .SINOBI file extension, "alongside
           observed data exfiltration staging activity conducted via rclone.exe."
      Talos's own forward-looking assessment: "Sinobi operators will likely continue
      weaponizing legitimate tools like MeshAgent because these binaries blend into standard
      administrative traffic and bypass many traditional signature-based alerts. The use of
      GPO-based deployment scripts suggests an understanding of enterprise architecture."
      Talos's stated defensive recommendation for this chain specifically: prioritize
      monitoring of administrative tools, implement strict application allowlisting to prevent
      unauthorized binaries running as services, proactively hunt for unauthorized MeshAgent
      instances, and audit service-account permissions.
      Detection-engineering read (analytical addition, not Talos's own wording): the
      discriminator between this and a legitimate MeshCentral/MeshAgent deployment is that a
      genuine agent install is provisioned through the organization's own MeshCentral server
      (a known, inventoried management endpoint) and appears as an expected, pre-approved
      service on a pre-approved asset — a rogue instance instead surfaces as an UNEXPECTED new
      "MeshAgent"-named SYSTEM service on a host with no organizational MeshCentral deployment
      of record, immediately followed (within the ~3-day dwell window) by RDP/WinRM sessions
      from a service account authenticating from unusual source hosts, and by GPO logon-script
      changes pushed domain-wide.

    warlock_storm2603_zoho_assist_detail: |
      In a separate engagement, Talos IR observed Warlock ransomware operators (also tracked as
      Storm-2603) deploying an installer for the ZOHO ASSIST UNATTENDED AGENT — an RMM
      capability "designed to allow administrative remote control of an endpoint without a user
      logged in." Talos states this specific tool "we have not previously seen attributed to
      Warlock." The stated operational value to the actor: it "enables the attackers to
      maintain persistent, stealthy, and unrestricted control, significantly increasing the
      potential malicious impact of an incident." In this particular engagement the activity
      "did not lead to encryption," but Talos states it "was consistent with a successful
      Warlock ransomware attack Talos observed in May [2026]" — i.e. Talos is drawing a
      pattern-match to an earlier, encryption-culminating Warlock incident rather than treating
      this as an isolated toolset choice. Talos's recommended defensive shift: move from
      signature-based detection to behavior-based monitoring of Storm-2603 TTPs specifically
      (abuse of legitimate administrative tools + rapid lateral movement).

    uat11764_qr_phishing_chain: |
      Starting in April 2026 and "remained ongoing as of late June 2026," a persistent QR-code
      phishing campaign primarily targeting AUSTRALIAN organizations, attributed by Talos to an
      actor it designates UAT-11764. Chain, in order:
        1. Delivery: AUTO-GENERATED, VICTIM-TAILORED PDF documents containing embedded QR codes
           (chosen specifically to evade traditional email-gateway text/link scanning).
        2. Redirection: QR codes direct to adversary-controlled Microsoft 365 credential
           HARVESTING pages.
        3. Account takeover: on successful credential capture, the adversary attempts access to
           the victim's Microsoft 365 account.
        4. Post-compromise defense evasion: creation of EMAIL INBOX RULES (T1564.008-class
           behavior) to hide/redirect incoming mail and reduce victim visibility into the
           compromise.
        5. Post-compromise staging: use of SHAREPOINT to host malicious follow-on documents.
        6. Propagation: sends ADDITIONAL internal and external phishing emails — using each
           newly-compromised mailbox's own contact list — to continue the compromise chain
           into new victims.
      Talos's confidence statement (verbatim structure, not paraphrased): "We assess with HIGH
      CONFIDENCE that the threat actor... will almost certainly continue leveraging this QR
      code phishing operation, using each newly compromised mailbox's contact lists to expand
      its reach and sustain the campaign's momentum." Talos frames the actor's core tradecraft
      insight as bypassing "many standard email security gateways" specifically by weaponizing
      trusted infrastructure (SharePoint, M365) rather than attacker-registered domains.
      Talos's stated defensive controls: block/flag emails containing QR codes inside PDF
      attachments, enforce phishing-resistant MFA on M365 accounts, and monitor for suspicious
      inbox-rule creation and anomalous SharePoint file staging as post-compromise indicators.
      Separately (same report, different engagement, NOT UAT-11764): Talos also profiled
      ARToken, a phishing-as-a-service platform "closely linked to the EvilTokens platform"
      (already tracked in this pipeline as tool:talos-artoken-eviltokens-bec-panel) — exposing
      80+ API endpoints for device-code phishing, primary-refresh-token (PRT) persistence,
      email access, BEC operations and SharePoint exfiltration via a React dashboard; bypasses
      MFA through the OAuth device-authorization flow rather than stealing passwords, and adds
      OneDrive/SharePoint administration, geo-dynamic lure templates, inbox-rule manipulation,
      cross-account keyword monitoring, collaborative token sharing, and "layered evasion
      mechanisms and encrypted client-side payloads" for anti-analysis.

    authentication_abuse_breakdown: |
      "Authentication abuse was the most prevalent security weakness this quarter, observed in
      65 percent of engagements — up sharply from 35 percent last quarter." Talos's own
      enumeration of what specifically made up that 65%: adversaries "consistently defeated or
      bypassed MFA using AiTM [adversary-in-the-middle] proxies and session-token theft, MFA
      fatigue attacks, registration of attacker-controlled devices for authentication, and
      legacy authentication protocols that circumvent MFA altogether." (The same components —
      AitM proxies, session-token theft, MFA-fatigue, self-enrolled attacker devices — are also
      named in the report's opening summary paragraph, "amongst other methods.") Recommended
      controls tied to this specific weakness: transition from push/SMS-based MFA to
      phishing-resistant methods (FIDO2/WebAuthn, hardware security keys); restrict
      self-service MFA enrollment by requiring helpdesk verification; block legacy
      authentication via Conditional Access; enforce number-matching or verified push where
      phishing-resistant methods are not yet feasible; condition access on device compliance
      and trusted infrastructure rather than geographic location alone.

    logging_retention_finding: |
      "Insufficient logging and visibility was the second most common weakness, observed in 42
      percent of engagements compared to 18 percent last quarter." Talos's own enumeration of
      the specific deficiencies observed:
        - domain controller SECURITY LOGS retained for ONLY A FEW HOURS;
        - host event logs truncated or overwritten before capture;
        - ABSENT NETFLOW that prevented reconstruction of external authentication and
          exfiltration;
        - on-device-only logs that adversaries deleted to evade detection;
        - short cloud-telemetry retention that did not extend back to the true initial-access
          date.
      Talos's direct consequence statement: "In several engagements these gaps PREVENTED
      DEFINITIVE DETERMINATION of the initial access vector or the scope of data exfiltration"
      — i.e. this is not a hypothetical hygiene gap, Talos is stating that inadequate logging
      concretely blocked root-cause and scope determination in real IR engagements this
      quarter. Recommended remediation: SIEM/centralized logging with a MINIMUM OF 90 DAYS
      retention; forward logs off-device (servers, workstations, network infrastructure, cloud
      identity providers, security appliances) so they survive log tampering and host rebuilds;
      enable process-creation, command-line, and cloud-API (e.g. Microsoft Graph) auditing.
      Talos also plugs its own "Log Architecture Assessment" service for gap identification —
      note this is a vendor service reference, not a defender-neutral fact.

    other_named_weaknesses: |
      Third-ranked weakness: vulnerable/exposed/unpatched internet-facing infrastructure, 31%
      of engagements (vs 25% last quarter) — named examples: ToolShell, "an older Telerik UI
      deserialization flaw," and SD-WAN/perimeter-VPN appliance CVEs; internet-exposed services
      also "subjected to SQL-injection and denial-of-service activity."
      A named but lower-ranked weakness: unlimited outbound email thresholds enabled
      propagation in "almost 15 percent of engagements" — illustrated with a specific case: a
      single phishing-driven mailbox compromise was followed by "over 6,600 phishing and spam
      emails" sent from the compromised mailbox before containment. Talos frames outbound
      rate-limiting as "a low-effort, high-impact mitigation."

    targeting_and_initial_access_stats: |
      Healthcare led targeted-sector share for the SECOND CONSECUTIVE QUARTER (17% of
      engagements); public administration and manufacturing followed at 14% each. Talos's
      framing: the shared characteristic across these three is "a critical lack of downtime
      tolerance" — healthcare targets were "entities that directly support clinical operations
      and/or diagnostic services"; "almost all" targeted public-administration organizations
      were LOCAL GOVERNMENTS; targeted manufacturing entities were "high-value targets within
      the industrial supply chain, where potential disruptions could create cascading effects
      across the downstream technology and energy sectors." Initial access: phishing accounted
      for "over half" of engagements where initial access could be determined (up from ~35%
      last quarter); other observed initial-access vectors: "exploitation of public-facing
      applications and drive-by compromise." Ransomware/pre-ransomware made up "over 20 percent
      of engagements this quarter, similar to just under 20 percent last quarter" — this is
      presented as roughly flat quarter-over-quarter, in contrast to the sharp swings in
      phishing/auth-abuse/logging shares.

    exact_figures_with_sentence:
      - figure: "phishing >50% of engagements (up from ~33% last quarter)"
        sentence: "Phishing was the primary means of gaining initial access this quarter, appearing in over half of all Cisco Talos Incident Response (Talos IR) engagements – an increase from approximately a third of engagements last quarter."
