  - title: "Garante fines US data broker Lusha EUR 2M for unlawfully scraping and reselling Italian residents' data, including government, law-enforcement and judiciary personnel"
    sources:
      - { url: "https://cyberinsider.com/italy-fines-us-data-broker-lusha-e2-million-over-unlawful-data-collection/", publisher: "CyberInsider", date: "2026-07-28", role: "primary (fresh in-window coverage)" }
      - { url: "https://www.gpdp.it/home/docweb/-/docweb-display/docweb/10275230", publisher: "Garante per la protezione dei dati personali (Italian DPA)", date: "2026-07-27", role: "primary (regulator's own decision/press release)" }
    discovery_trace: "first seen at: cyberinsider, URL https://cyberinsider.com (listing) → article https://cyberinsider.com/italy-fines-us-data-broker-lusha-e2-million-over-unlawful-data-collection/ → primary: Garante decision, URL https://www.gpdp.it/home/docweb/-/docweb-display/docweb/10275230"
    summary: |
      Italy's Garante per la protezione dei dati personali announced on 27 July 2026 (covered fresh by CyberInsider on 28 July) a EUR 2,000,000 fine against Lusha Systems Inc., a US-based data-enrichment broker whose subscription platform sells professional contact records (job titles, email addresses, phone numbers) assembled by web-scraping social networks and by purchasing records from other data brokers. The Garante found the GDPR applicable via the "monitoring" criterion (Art. 3(2)(b)) given Lusha's continuous tracking/updating of individuals' professional data, and ruled that Lusha's stated legal basis — legitimate interest — did not justify the processing, and that its privacy notice failed the lawfulness/fairness/transparency/data-minimization principles. The dataset was found to include government officials, law-enforcement and judiciary personnel among the profiled Italian residents. The Authority ordered Lusha to cease processing Italian residents' data and delete the records held. Defender-relevant takeaway: this is a documented, still-live commercial aggregation of exactly the identity data (role, email, phone) that underpins spear-phishing and vishing targeting playbooks against public-sector and judiciary staff (cf. the helpdesk-vishing chains already seen this run-window against Scattered Spider/ShinyHunters-style targets) — the technique class the broker automated (open-source identity aggregation) mirrors adversary reconnaissance (T1589 Gather Victim Identity Information, T1596 Search Open Technical Databases): an attacker targeting a specific ministry or judiciary office no longer needs to run this OSINT collection themselves if a broker dataset with a "monitoring" business model already holds it.
