      - quote: "Iran-linked hackers have been exploiting vulnerable devices in an effort to disrupt a series of critical infrastructure providers, including drinking water, wastewater treatment and energy companies."
        attribution: "Cybersecurity Dive"
        source_url: "https://www.cybersecuritydive.com/news/authorities-investigating-a-coordinated-cyberattack-against-minnesota-water/826427/"
      - quote: "Analysis indicated the project file retained ladder logic for downstream function but added logic that overrode specific instruction sets responsible for maintaining safe operating parameters in the victim's environment."
        attribution: "CISA/FBI joint advisory AA26-097A"
        source_url: "https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-097a"
      - quote: "the changes disabled critical shutdown and alarm logic, allowing systems to enter unsafe conditions without notifying operators of the anomalies."
        attribution: "CISA/FBI joint advisory AA26-097A"
        source_url: "https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-097a"
    extended_notes: |
      Attribution for the Minnesota event itself is explicitly unconfirmed by both news primaries as of publication ("it is not yet clear who is responsible", "not yet been attributed to any particular party") - do not upgrade to a named-actor claim. AA26-097A's IOC tables (2 tables of IP addresses, Sept 2025-July 2026) are IOC material and intentionally excluded here per the no-IOCs rule; the mitigation set (disconnect PLC from public internet, physical mode-switch to RUN, ACL/firewall restriction to known-good IPs, project-file integrity verification against known-good ladder logic, password rotation, MFA for any remote OT access) is the actionable takeaway. Companion same-day CISA/ACSC "CI Fortify" guidance on preparing to isolate OT during an active attack (https://www.bleepingcomputer.com/news/security/cisa-shares-advice-on-isolating-vital-systems-during-cyberattacks/, 2026-07-28) is contextually related but not folded into this item — it is general strategic guidance, not an incident, and may be better suited to a different domain if not already covered.
