items:
  - title: "Coordinated two-day cyberattack disrupts OT at 30+ Minnesota water utilities amid an ongoing Iranian-affiliated PLC-exploitation campaign"
    sources:
      - { url: "https://www.cybersecuritydive.com/news/authorities-investigating-a-coordinated-cyberattack-against-minnesota-water/826427/", publisher: "Cybersecurity Dive", date: "2026-07-28", role: "primary" }
      - { url: "https://statescoop.com/coordinated-cyberattack-disrupts-water-utilities-in-30-minnesota-communities/", publisher: "StateScoop", date: "2026-07-28", role: "primary" }
      - { url: "https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-097a", publisher: "CISA/FBI/NSA/EPA/DOE/CNMF/Treasury (joint advisory AA26-097A)", date: "2026-07-22 (last update; orig. 2026-04-07)", role: "corroborating (TTP/background reference for the ongoing campaign; not itself the in-window news event)" }
    discovery_trace: "first seen at: databreaches-net, URL https://databreaches.net/feed/ (item: \"Multiple water facilities in Minnesota attacked; Iranian hackers may be responsible (UPDATED)\", 2026-07-28) → pivot: Cybersecurity Dive, URL https://www.cybersecuritydive.com/news/authorities-investigating-a-coordinated-cyberattack-against-minnesota-water/826427/ → pivot: StateScoop, URL https://statescoop.com/coordinated-cyberattack-disrupts-water-utilities-in-30-minnesota-communities/ → background primary: CISA joint advisory AA26-097A, URL https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-097a (fetched via python3 tools/fetch_source.py cisa page, per CLAUDE.md's mandatory bridge rule for cisa.gov)"
    summary: |
      Federal (FBI, CISA, EPA) and Minnesota state authorities are investigating a coordinated cyberattack against operational technology at more than 30 community water and wastewater systems in Minnesota over 26-27 July 2026 (a "two-day attack"), affecting PLCs and cellular-connected equipment at water towers and lift stations; there is no evidence of impact to drinking-water safety or treatment quality, and no utility has told residents to change water usage. Attribution to a specific actor is not yet established, but the timing lines up with a live, US authorities-tracked Iranian-affiliated APT campaign against internet-exposed PLCs: joint advisory AA26-097A (orig. 7 April 2026, updated 22 July 2026) documents actors connecting to misconfigured, internet-facing Rockwell Automation/Allen-Bradley (CompactLogix, Micro850), Schneider Electric (BMX P34/Modicon M340) and Siemens (S7-1200) PLCs over ports 44818, 2222, 102 and 502 (plus modem SSH on port 22 via Dropbear), using the vendors' own engineering software (Studio 5000 Logix Designer, EcoStruxure Control Expert, TIA Portal) from leased third-party infrastructure to pull down device project files, then re-upload files with modified/deleted ladder logic (including Add-On Instructions) and manipulated HMI/SCADA display data — deliberately disabling shutdown and alarm logic so systems can enter unsafe states without operator notification. This is the same technique class CyberAv3ngers (IRGC CEC / Shahid Kaveh Group) pioneered against US water utilities in Nov 2023 (AA23-335A), now expanded in scope beyond Rockwell to Schneider and Siemens PLCs. For Swiss/European water and energy CI operators running the same PLC families with any internet-facing exposure (including via cellular modems), the transferable lesson is direct: the attack path requires no CVE, only a misconfigured internet-reachable device and vendor engineering software used as a legitimate-looking access tool.
    region_nexus: "United States (out-of-nexus victim); transferable to Swiss/European water and energy CI given the shared PLC vendor base (Rockwell/Allen-Bradley, Schneider Electric, Siemens) and a documented Iran-linked campaign with prior escalation patterns tied to Iran-Israel/US hostilities"
    primary_sector_nexus: "indirect"
    sector: "water, energy, public-sector"
