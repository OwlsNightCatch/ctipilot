  - entry: 2026-05-12/gtig-ai-threat-tracker-may-2026-first-confirmed-ai-generated
    verdict: factual-error
    defects:
      - where: "title/headline; summary; Background paragraph"
        claim: "First Confirmed AI-Generated Zero-Day Exploit ITW ... the first report to publicly attribute an AI-generated **functional zero-day exploit** observed in active criminal use"
        defect: "GTIG says it believes the exploit was developed with AI (high confidence, not confirmed), and that the criminal actor planned a mass exploitation event that GTIG's counter-discovery may have prevented; no source reports the exploit observed in active use. The Hacker News's 'put to use in the wild' framing conflicts with the primary."
        ground_truth: "GTIG: 'For the first time, GTIG has identified a threat actor using a zero-day exploit that we believe was developed with AI. The criminal threat actor planned to use it in a mass exploitation event but our proactive counter discovery may have prevented its use.' Help Net Security: 'worked with the impacted vendor to disclose the vulnerability before the planned mass exploitation campaign could be executed.'"
        ground_truth_url: "https://cloud.google.com/blog/topics/threat-intelligence/ai-vulnerability-exploitation-initial-access"
        fix: "'GTIG reports the first zero-day exploit it assesses with high confidence was AI-developed, prepared by criminal actors for a planned mass-exploitation event that coordinated disclosure may have prevented'; add 'Contradiction:' for the THN 'in the wild' wording."
        class: factual-error
      - where: "summary; section 'AI-augmented malware families'; hardening item 1"
        claim: "The same GTIG release documents four malware families that integrate LLM calls into runtime behaviour rather than into development ... CANFAIL and LONGSTREAM (Russia-nexus) insert LLM-generated inert decoy code blocks and daylight-saving-time API calls at runtime to inflate benign-looking telemetry ... Catches PROMPTFLUX / HONESTCUE / CANFAIL-class runtime LLM calls"
        defect: "Inverted on two counts. CANFAIL and LONGSTREAM carry LLM-generated decoy code in their source (a development-time use of AI), not runtime LLM calls, so egress allowlisting would not catch them; the 32 daylight-saving queries are inert code blocks meant to look benign, and nothing says they target behavioural-sequence detectors. PROMPTFLUX and HONESTCUE are from GTIG's prior reports, not documented anew in this release. The report's new runtime-LLM malware, PROMPTSPY (Android backdoor using the Gemini API for autonomous UI navigation, biometric replay, uninstall-blocking overlay), is absent from the entry."
        ground_truth: "GTIG: 'Analysis confirms the use of CANFAIL and LONGSTREAM, which utilize LLM-generated decoy code to obfuscate their malicious functionality.' 'we identified 32 instances of the code querying the system's daylight saving status. This type of repetitive query exists to populate the script with activity that can appear benign.' 'In prior reports, we highlighted malware families like PROMPTFLUX ... and HONESTCUE'. 'A primary example of this evolution is PROMPTSPY, an Android backdoor ... sending this payload to the gemini-2.5-flash-lite model via an HTTP POST request'."
        ground_truth_url: "https://cloud.google.com/blog/topics/threat-intelligence/ai-vulnerability-exploitation-initial-access"
        fix: "Rewrite the section: CANFAIL/LONGSTREAM (Russia-nexus, against Ukrainian organisations) embed LLM-generated junk code as obfuscation; PROMPTSPY is the report's runtime-LLM malware; PROMPTFLUX/HONESTCUE as prior-report context; drop 'Catches ... CANFAIL-class runtime LLM calls' and the detector-pollution claims."
        class: factual-error
      - where: "section 'State-actor abuse of Gemini' (stolen API keys; SANDCLOCK)"
        claim: "meaning the operational unit of compromise has shifted to include **stolen LLM API keys** as a primary objective ... This is the structural reason TeamPCP's SANDCLOCK stealer (§ 4 UPDATE) now explicitly enumerates LLM API keys alongside cloud credentials: there is a developed criminal market for stolen LLM access keys"
        defect: "GTIG describes UNC5673 and UNC6201 pooling and registering LLM accounts (account aggregation, trial abuse, automated registration), not stealing API keys; SANDCLOCK is described as extracting AWS keys and GitHub tokens, and no source mentions it enumerating LLM keys or a market for stolen LLM keys."
        ground_truth: "GTIG: UNC5673 'employ \"Claude-Relay-Service\" to aggregate multiple Gemini, Claude, and OpenAI accounts, enabling account pooling and cost-sharing'; TeamPCP 'leveraged their access ... to embed the SANDCLOCK credential stealer and extract high-value cloud secrets, such as AWS keys and GitHub tokens'; LiteLLM compromise 'could lead to considerable exposure of AI API secrets'."
        ground_truth_url: "https://cloud.google.com/blog/topics/threat-intelligence/ai-vulnerability-exploitation-initial-access"
        fix: "State the account-pooling and automated-registration findings as GTIG gives them; for keys, cite only 'the LiteLLM compromise could expose AI API secrets'; drop the SANDCLOCK and criminal-market claims."
        class: factual-error
      - where: "hardening item 4"
        claim: "the SANDCLOCK / TeamPCP Jenkins compromise carried as the § 4 UPDATE"
        defect: "GTIG names GitHub repositories and GitHub Actions (Trivy, Checkmarx, LiteLLM, BerriAI) reached via compromised PyPI packages and malicious pull requests; no Jenkins. '§ 4 UPDATE' is pipeline self-reference."
        ground_truth: "GTIG: 'TeamPCP gained initial access through compromised PyPI packages and malicious pull requests to these GitHub repositories.'"
        ground_truth_url: "https://cloud.google.com/blog/topics/threat-intelligence/ai-vulnerability-exploitation-initial-access"
        fix: "'the TeamPCP (UNC6780) GitHub Actions / PyPI supply-chain compromises that embedded the SANDCLOCK stealer in build environments'."
        class: factual-error
      - where: "section 'The first AI-generated zero-day' (preconditions, attribution artefacts, disruption)"
        claim: "The underlying flaw is a 2FA-bypass arising from a semantic logic error ... consistent variable-naming patterns that read like a tutorial ... Responsible-disclosure coordination patched the underlying tool before mass exploitation took hold; GTIG explicitly believes the disclosure disrupted the campaign."
        defect: "Omits GTIG's material qualifier that the bypass requires valid user credentials (T1078 precondition) and that GTIG does not believe Gemini was used; 'consistent variable-naming patterns' is not among GTIG's stated artefacts; GTIG says the disclosure 'may have prevented' use, not that it 'explicitly believes' it disrupted the campaign, and gives no patch timing."
        ground_truth: "GTIG: 'The vulnerability can be classified as a 2FA bypass, though it requires valid user credentials in the first place.' 'Although we do not believe Gemini was used ... the script contains an abundance of educational docstrings, including a hallucinated CVSS score, and uses a structured, textbook Pythonic format ... (e.g., detailed help menus and the clean _C ANSI color class).'"
        ground_truth_url: "https://cloud.google.com/blog/topics/threat-intelligence/ai-vulnerability-exploitation-initial-access"
        fix: "Add the valid-credentials precondition, use GTIG's artefact list verbatim, and say disclosure 'may have prevented' use."
        class: imprecision
      - where: "ATT&CK mapping in the malware section"
        claim: "Mapped to T1553 Subvert Trust Controls (as an EDR-evasion variant) and T1027 Obfuscated Files or Information"
        defect: "Nothing in the report describes subverting trust controls; decoy code is obfuscation, matching T1027.016 Junk Code Insertion (active in the pinned dataset)."
        ground_truth: "GTIG: 'LLM-generated decoy code to obfuscate their malicious functionality'; 'coherent but inactive blocks of code related to administrative tasks'."
        ground_truth_url: "https://cloud.google.com/blog/topics/threat-intelligence/ai-vulnerability-exploitation-initial-access"
        fix: "techniques[]: drop T1553, use T1027.016."
        class: imprecision
      - where: "state-actor section (UNC5673, OFTP)"
        claim: "**UNC5673 (TEMP.Hex)** ... persona-driven jailbreaking attempts against embedded-device firmware analysis (TP-Link, the OFTP industrial protocol)"
        defect: "GTIG says UNC5673 'has notable overlaps with TEMP.Hex', not that it is TEMP.Hex; OFTP is the Odette File Transfer Protocol, not described as an industrial protocol. The inference that the profile 'applies directly to government developers and government-procured AI tooling' is the entry's, not GTIG's."
        ground_truth: "GTIG: 'UNC5673, a PRC-nexus threat cluster that has notable overlaps with TEMP.Hex and that has targeted government sectors primarily in South and Southeast Asia'; 'TP-Link firmware and Odette File Transfer Protocol (OFTP) implementations'."
        ground_truth_url: "https://cloud.google.com/blog/topics/threat-intelligence/ai-vulnerability-exploitation-initial-access"
        fix: "'UNC5673 (PRC-nexus, overlaps with TEMP.Hex)'; 'Odette File Transfer Protocol (OFTP) implementations'."
        class: imprecision
      - where: "banner; Background; summary (pipeline self-reference)"
        claim: "> **ANNUAL REPORT** — this is the dedicated treatment ... per PD-9 ... (covered in this brief's 2026-05-10 daily) ... the NCSC-CH BACS assessment on AI in vulnerability management (covered same day) ... full treatment in § 5 Deep Dive"
        defect: "Pipeline self-reference (PD-9, 'this brief', '§ 5', '§ 4 UPDATE'); the report is a periodic tracker ('Since our February 2026 report'), not annual; the BACS assessment is uncited. CERTFR-2026-ACT-016 is a CERT-FR news bulletin on agentic-AI automation products, which the entry calls an advisory."
        ground_truth: "GTIG: 'Since our February 2026 report on AI-related threat activity'; CERT-FR ACT-016 title: 'Vulnérabilités et risques des produits d'automatisation par IA agentique sur les postes de travail'."
        ground_truth_url: "https://www.cert.ssi.gouv.fr/actualite/CERTFR-2026-ACT-016/"
        fix: "Remove the banner and section references; cite or drop the BACS assessment; call ACT-016 a CERT-FR bulletin."
        class: imprecision
      - where: "Defender takeaways and hardening list (uncited composition)"
        claim: "Hunt pivots that survive: (a) network-layer detection of outbound calls to LLM API endpoints from process trees that should not be talking to LLM APIs (e.g. `winlogon.exe`, `services.exe` ...) ... rotate quarterly minimum ... OIDC-federated short-lived credentials ... validate against API-call-sequence pollution"
        defect: "None of these controls or process examples is in the report; several rest on the inverted CANFAIL/LONGSTREAM claim. GTIG's only stated mitigation in that area is provider-side signal logic on AI-API aggregator infrastructure."
        ground_truth: "GTIG: 'To mitigate the nature of this obfuscation, LLM providers can build signal logic to analyze network infrastructure data associated with AI-related API aggregators.'"
        ground_truth_url: "https://cloud.google.com/blog/topics/threat-intelligence/ai-vulnerability-exploitation-initial-access"
        fix: "Keep only guidance derivable from the report (e.g. PROMPTSPY Gemini API calls via HTTP POST, the exploit-artefact heuristic) and label the rest as analysis or drop it."
        class: imprecision
