  - entry: 2026-05-12/bka-and-zit-dismantle-relaunched-crimenetwork-darknet-market
    verdict: imprecision
    defects:
      - where: "body paragraph 1 (seized data framing)"
        claim: "which the BKA states will drive a wave of follow-on prosecutions — the press release explicitly frames the seized infrastructure data as the operational value, not the headline arrest"
        defect: "The reporting says only that the user and transaction data are expected to support further investigations; nothing says the release frames the data as the operational value rather than the arrest, or predicts 'a wave of follow-on prosecutions'. The €194,000 is a preliminary seizure, not a recovery. (The BKA release itself could not be read: bka.de timed out or reset on every transport.)"
        ground_truth: "(low confidence: the BKA release was unreachable) Help Net Security (quoting BKA): 'the operation led to the preliminary seizure of about €194,000 in assets linked to the marketplace.' 'User and transaction data obtained during the operation are expected to support further investigations into the platform's users and operators, who are believed to be mainly located in German-speaking countries.'"
        ground_truth_url: "https://www.helpnetsecurity.com/2026/05/11/germany-crimenetwork-marketplace-shut-down/"
        fix: "'Authorities preliminarily seized about €194,000; the seized user and transaction data are expected to support further investigations into users and operators, mainly in German-speaking countries.'"
        class: imprecision
      - where: "body paragraph 1 (arrest)"
        claim: "The German Bundeskriminalamt (BKA) and Frankfurt's Central Office for Combating Internet Crime (ZIT), with Spanish National Police support, arrested a 35-year-old German national at his residence in Mallorca on a European Arrest Warrant on **2026-05-08**"
        defect: "The arrest was made by a special unit of the Spanish National Police (with BKA and ZIT); the arrest date is not on the readable page (2026-05-08 is the BKA release date, which could not be fetched). Also missing: the charges (section 127 StGB, sections 29a/30a BtMG)."
        ground_truth: "Help Net Security: 'A special unit of the Spanish National Police arrested the suspected 35-year-old German operator at his residence in Mallorca under a European Arrest Warrant.' 'accused of operating criminal trading platforms on the internet under Section 127 of the German Criminal Code, as well as trafficking narcotics ... Sections 29a and 30a of the Narcotics Act.'"
        ground_truth_url: "https://www.helpnetsecurity.com/2026/05/11/germany-crimenetwork-marketplace-shut-down/"
        fix: "'A Spanish National Police special unit arrested the suspected operator in Mallorca on a European Arrest Warrant in an operation with the BKA and ZIT (announced 2026-05-08)'; re-check the arrest date against the BKA release when bka.de is reachable."
        class: imprecision
      - where: "summary; body paragraph 1 (market position, repeat takedown)"
        claim: "Crimenetwork was the dominant German-language darknet marketplace ... Second BKA/ZIT/Spanish-Police takedown of the same brand inside 18 months"
        defect: "BKA calls it 'one of the central marketplaces', not the dominant one; no readable page says Spanish police took part in the December 2024 takedown. The relaunch came 'a few days' after that takedown, not merely 'shortly afterwards'."
        ground_truth: "Help Net Security quoting BKA: 'Before being shut down by law enforcement at the end of 2024, \"Crimenetwork\" was for many years one of the central marketplaces of the German-speaking underground economy'; 'created and operated a new technical infrastructure for Crimenetwork a few days after the previous version was shut down and its administrator was arrested in December 2024.'"
        ground_truth_url: "https://www.helpnetsecurity.com/2026/05/11/germany-crimenetwork-marketplace-shut-down/"
        fix: "'one of the central German-speaking underground marketplaces; relaunched a few days after its December 2024 takedown'; drop 'Spanish-Police' from the first takedown."
        class: imprecision
      - where: "Defender takeaway"
        claim: "expect a downstream wave of leaked-credential validations once the BKA dataset reaches partner CERTs ... when an EU-wide darknet platform is dismantled, the replacement is typically a same-branding relaunch on residual customer trust rather than a forum migration — the rebrand interval has now compressed to weeks"
        defect: "Speculation and a generalisation from one case; no source mentions partner CERTs, credential-validation waves or a typical relaunch pattern."
        ground_truth: "Help Net Security: the only forward-looking statement is that seized data 'are expected to support further investigations into the platform's users and operators'."
        ground_truth_url: "https://www.helpnetsecurity.com/2026/05/11/germany-crimenetwork-marketplace-shut-down/"
        fix: "Cut to the sourced takeaway, or drop the paragraph; a takedown with no defender decision is a short awareness item."
        class: imprecision
      - where: "priority; event_date; techniques"
        claim: "priority: high ; event_date: 2026-05-11 ; kind: incident (no techniques mappable)"
        defect: "(low confidence) A law-enforcement takedown with no exposure of constituency systems and no defender decision does not clear the high bar. event_date is the Help Net Security date; the primary (BKA release) is dated 2026-05-08. The sources describe no intrusion technique, so the incident-kind requirement for techniques[] cannot be met from them."
        ground_truth: "Help Net Security 2026-05-11 cites the BKA release; the BKA source record is dated 2026-05-08."
        ground_truth_url: "https://www.helpnetsecurity.com/2026/05/11/germany-crimenetwork-marketplace-shut-down/"
        fix: "Consider notable or routine; event_date 2026-05-08; do not invent techniques (sources carry none)."
        class: imprecision
