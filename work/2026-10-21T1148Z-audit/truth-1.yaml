  - entry: 2026-05-12/koda-auto-deutschland-online-shop-breach-exposes-customer-pi
    verdict: factual-error
    defects:
      - where: "body paragraph 1 (GDPR timing)"
        claim: "the German operating company's notification reached the competent EU supervisory authority within the GDPR Article 33 72-hour window"
        defect: "Neither page gives the timing of the notification; the vendor says only that the incident was reported to the competent data-protection authority."
        ground_truth: "Vendor: 'Zusätzlich wurde der Vorfall der zuständigen Datenschutzaufsichtsbehörde gemeldet.'"
        ground_truth_url: "https://www.skoda-auto.de/unternehmen/sicherheitsvorfall-skoda-shop"
        fix: "'The incident was reported to the competent data-protection authority.'"
        class: factual-error
      - where: "Defender takeaway (quoted phrase)"
        claim: "*\"we know they read the database; we cannot prove they copied it\"*"
        defect: "Presented in quotation marks but appears on neither page; the vendor says access to stored data was possible and the logs cannot show whether data was copied. 'the dominant blind spot in EU e-commerce' is an unsourced generalisation."
        ground_truth: "Vendor: 'Die technische Analyse hat ergeben, dass ein Zugriff auf im Shop gespeicherte Daten grundsätzlich möglich war. Aufgrund der Art der vorhandenen Protokolle lässt sich im Nachhinein jedoch nicht in allen Einzelheiten nachvollziehen, ob und in welchem Umfang Daten tatsächlich kopiert oder abgerufen wurden.'"
        ground_truth_url: "https://www.skoda-auto.de/unternehmen/sicherheitsvorfall-skoda-shop"
        fix: "Quote the vendor (translated, with original) instead of the invented phrase; drop the 'dominant blind spot' claim."
        class: factual-error
      - where: "summary; body paragraph 1 (what was accessed; scope)"
        claim: "an unauthorised actor exploited a vulnerability in the standard shop-software platform underlying its German online-retail store, accessing customer names, postal addresses, email addresses, telephone numbers, order history, account data and password hashes"
        defect: "The vendor lists the data the shop stores and says access to it was possible, not that it was accessed (SecurityWeek's 'accessed' is firmer than the primary). Missing qualifiers the vendor states: only the accessories shop (shop.skoda-auto.de) for German customers was affected; other Škoda shops, Škoda Auto a.s. systems and Škoda Connect were not; 'full' card data is what is not stored. 'Mladá Boleslav' is on neither page."
        ground_truth: "Vendor: 'Der Sicherheitsvorfall betraf ausschließlich den Online-Shop für Zubehör unter der Adresse shop.skoda-auto.de ... Andere Škoda Online-Shops sowie die Systeme des Herstellers Škoda Auto a.s. sind von diesem Vorfall nicht betroffen.' 'Das Škoda Connect Portal ist vom Sicherheitsvorfall nicht betroffen.' 'Vollständige Kreditkartendaten werden nicht im Shop-System abgelegt'."
        ground_truth_url: "https://www.skoda-auto.de/unternehmen/sicherheitsvorfall-skoda-shop"
        fix: "'exploited a vulnerability in the standard shop software of its German accessories shop; access to stored customer data (names, addresses, contact details, orders, account credentials with hashed passwords) was possible; Škoda Connect and other systems unaffected; full card data not stored'."
        class: imprecision
      - where: "Defender takeaway (downstream action)"
        claim: "add Škoda customer email addresses to credential-stuffing watchlists at federated O365 / Google Workspace tenants for the next quarter"
        defect: "Not executable from any source (no customer list or count is published) and not derived from the vendor guidance, which is password change for reused passwords and phishing vigilance; the database-logging hardening paragraph is also uncited composition."
        ground_truth: "Vendor: 'Wenn Sie bisher mit Ihrem Zugang zum Škoda Online-Shop identische oder sehr ähnliche Passwörter bei verschiedenen Online-Angeboten nutzen, ist es sinnvoll, diese Passwörter umgehend zu ändern'."
        ground_truth_url: "https://www.skoda-auto.de/unternehmen/sicherheitsvorfall-skoda-shop"
        fix: "Replace with the sourced exposure (password reuse, follow-on phishing referencing Škoda orders) or drop."
        class: imprecision
      - where: "techniques[] (missing)"
        claim: "kind: incident (no techniques)"
        defect: "The access vector is stated (exploited vulnerability in standard shop software) and maps to T1190."
        ground_truth: "Vendor: 'dass Unbefugte eine Schwachstelle in der eingesetzten Shop-Standardsoftware ausgenutzt haben'."
        ground_truth_url: "https://www.skoda-auto.de/unternehmen/sicherheitsvorfall-skoda-shop"
        fix: "techniques[]: T1190."
        class: imprecision
