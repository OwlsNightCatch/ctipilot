entries:
  - entry: 2026-05-10/bauman-university-department-no-4-leaked-gru-cyber-operator
    verdict: factual-error
    defects:
      - where: "body paragraph 2 (2025-2026 activity clause)"
        claim: "with continuing 2025–2026 activity against EU government and election-adjacent targets"
        defect: "No cited page states 2025-2026 APT28 activity against EU government or election-adjacent targets; the pages mention only the 2024 Paris Olympics targeting (Le Monde) and a generic Swedish minister accusation against 'Russia' (Guardian)."
        ground_truth: "Le Monde: 'more recently, of targeting institutions involved in organizing the most recent Paris Olympic Games in 2024'. Guardian: 'On 15 April, Sweden's minister for civil defence, Carl-Oskar Bohlin, publicly accused Russia of regularly carrying out destructive cyber-attacks against EU institutions.' (no actor named)"
        ground_truth_url: "https://www.lemonde.fr/en/m-le-mag/article/2026/05/07/moscow-s-bauman-university-the-clandestine-school-training-russian-hackers_6753208_117.html"
        fix: "Drop the clause or cite the page that states it; the cited pages support only the Paris 2024 Olympics targeting for APT28."
        class: factual-error
      - where: "body paragraph 2 (Macron attribution)"
        claim: "APT28 (Fancy Bear — responsible for the 2016 Bundestag hack and the 2017 Macron campaign breach"
        defect: "Sources disagree on which unit the 2017 Macron campaign breach belongs to: Le Monde attributes it to APT28/Fancy Bear, Guardian and Meduza list it among Sandworm's accused operations; the entry picks one silently and states both as fact. The Bundestag hack is on no cited page's text."
        ground_truth: "Guardian: 'Sandworm has been accused by western intelligence agencies of unleashing ... Emmanuel Macron's French presidential campaign in 2017'. Meduza: 'Sandworm is also considered responsible for ... interference in Emmanuel Macron's presidential campaign in France in 2017'. Le Monde: Fancy Bear/APT28 'notably accused of ... stealing emails from Emmanuel Macron's team when he was a presidential candidate in early 2017'."
        ground_truth_url: "https://www.theguardian.com/world/2026/may/07/revealed-russia-top-secret-spy-school-hacking-western-electoral-interference"
        fix: "Say 'accused of' and surface the contradiction (Le Monde: APT28; Guardian, Meduza: Sandworm), or drop the Macron item; cite a page for the Bundestag hack or drop it."
        class: imprecision
      - where: "summary, body paragraph 1"
        claim: "published more than 2 000 leaked internal documents from Bauman Moscow State Technical University on 2026-05-07"
        defect: "The consortium obtained and reviewed the documents and published an investigation based on them; no source says the documents themselves were published. The sixth outlet also differs by page: Meduza lists Frontstory, the Guardian and Le Monde list Delfi (VSquare lists Delfi Estonia and Frontstory.pl both as collaborators)."
        ground_truth: "Meduza: 'The journalists reviewed more than two thousand internal documents from the department'. Guardian: 'more than 2,000 internal documents from Bauman, obtained by a consortium of journalists from six outlets: the Guardian, Der Spiegel, Le Monde, the Insider, Delfi and VSquare.'"
        ground_truth_url: "https://www.theguardian.com/world/2026/may/07/revealed-russia-top-secret-spy-school-hacking-western-electoral-interference"
        fix: "'published an investigation based on more than 2,000 leaked internal documents ... obtained by a consortium including The Insider, The Guardian, Le Monde, Der Spiegel, VSquare and Frontstory/Delfi'."
        class: imprecision
      - where: "body paragraph 1 (curriculum)"
        claim: "CVE-driven exploitation using Metasploit *against US DoD network architectures by name*, custom trojan development, DDoS methodologies, penetration testing against Western targets"
        defect: "Metasploit and the US Department of Defense networks are on none of the five listed source pages (Spiegel is paywalled); they appear only on VSquare, which is not a listed source. 'penetration testing against Western targets' and 'CVE-driven' are on no page read (sources say 'software vulnerabilities', 'practical penetration tests')."
        ground_truth: "VSquare: 'students learn, among other things, the detailed functioning of protected computer networks of the US Department of Defense ... trained to \"exploit vulnerabilities\" in such systems using the Metasploit software'."
        ground_truth_url: "https://vsquare.org/welcome-to-the-gru-university-where-moscow-turns-students-into-spies-and-hackers-bauman-stupakov/"
        fix: "Add VSquare (or The Insider theins.ru/inv/292287, which also carries Metasploit) as a source for the Metasploit/DoD clause; drop 'penetration testing against Western targets' and 'CVE-driven'."
        class: imprecision
      - where: "body paragraph 1 (training camp)"
        claim: "Candidates are physically assessed at a mandatory training camp"
        defect: "(low confidence) heise carries a mandatory one-month training camp but no page read says candidates are physically assessed there."
        ground_truth: "heise: 'zur Ausbildung gehört dem Bericht zufolge auch ein einmonatiges Trainingscamp, in das alle müssen.' (Spiegel original paywalled, not read)"
        ground_truth_url: "https://www.heise.de/news/Cyberkrieg-Medien-zitieren-Interna-aus-Russlands-Geheimdienstausbildung-11285528.html"
        fix: "'All students attend a mandatory one-month training camp'."
        class: imprecision
      - where: "body paragraph 2 (analysis)"
        claim: "GRU cyber units are not ad-hoc-recruited contractors, they are graduates of a structured technical-intelligence training stream with measurable annual throughput"
        defect: "Analytical generalisation no source states; sources show 10-15 assignments a year from one department and the Guardian's source says another university (Mirea) was 'even more crucial'. Also the 'NATO-aligned default mental model' inference is the entry's own."
        ground_truth: "Guardian: 'Another Russian university, Mirea, was even more crucial in training hackers' and 'Bauman is one of a handful of elite universities used to identify gifted students'."
        ground_truth_url: "https://www.theguardian.com/world/2026/may/07/revealed-russia-top-secret-spy-school-hacking-western-electoral-interference"
        fix: "Replace with the sourced statement: Bauman's Department 4 is one structured pipeline into GRU units (10-15 assignments a year, including Unit 74455 and Fancy Bear); mark the 'mental model' reading as analysis or drop it."
        class: imprecision
      - where: "summary"
        claim: "operating under the cover of …"
        defect: "Summary is truncated mid-sentence with an ellipsis; unusable as a standalone summary."
        ground_truth: "n/a (field defect)"
        ground_truth_url: "https://meduza.io/amp/en/feature/2026/05/07/secret-gru-linked-department-at-top-russian-university-trains-hackers-and-saboteurs-investigation-finds"
        fix: "Rewrite as a complete one-to-two sentence summary."
        class: imprecision
      - where: "body paragraph 2 (attributions as fact)"
        claim: "Sandworm / VoodooBear — responsible for the 2015–2016 Ukraine power-grid attacks, 2017 NotPetya global wiper, and 2023 Kyivstar telecom outage"
        defect: "Sources frame these as accusations or links ('accused by western intelligence agencies', 'linked'); NotPetya appears only as heise's hedge that a graduate 'offenbar' landed at a unit 'die hinter der Malware NotPetya gesteckt haben soll'. 'VoodooBear' is on VSquare/Frontstory only."
        ground_truth: "Guardian: 'Sandworm has been accused by western intelligence agencies of unleashing some of the most destructive cyber-attacks of the past decade'. heise: 'die hinter der Malware NotPetya gesteckt haben soll'."
        ground_truth_url: "https://www.theguardian.com/world/2026/may/07/revealed-russia-top-secret-spy-school-hacking-western-electoral-interference"
        fix: "'accused of' wording; note 'responsible' is the cited outlets' attribution, not the leak's."
        class: imprecision
    upgrade:
      techniques: []
      rating:
        reliability: B
        credibility: 2
        basis: "Original investigative journalism by a six-outlet consortium (Guardian, Le Monde, Spiegel, The Insider, VSquare, Delfi/Frontstory) working from one leaked document set: one assessor, independently published by several outlets, none a primary custodian of the documents. No technique mapped: the entry describes a training curriculum, not observed intrusion activity."
      exposure:
        - {quote: "The documents indicate that the GRU exerts direct control over the recruitment and grading process – sending its own officers to conduct exams, approve candidates and oversee placements.", url: "https://www.theguardian.com/world/2026/may/07/revealed-russia-top-secret-spy-school-hacking-western-electoral-interference"}
      detection: []
      triage: []
      takeaway:
        - {quote: "Between 10 and 15 students from the department are assigned to GRU units each year. Some graduates serve in military unit 74455, which belongs to the hacking group Sandworm", url: "https://meduza.io/amp/en/feature/2026/05/07/secret-gru-linked-department-at-top-russian-university-trains-hackers-and-saboteurs-investigation-finds"}
      bodies:
        - work/2026-10-21T1148Z-audit/truth-1/bodies/bauman-meduza.txt
        - work/2026-10-21T1148Z-audit/truth-1/bodies/bauman-guardian.txt
        - work/2026-10-21T1148Z-audit/truth-1/bodies/bauman-lemonde.txt
        - work/2026-10-21T1148Z-audit/truth-1/bodies/bauman-spiegel.txt
        - work/2026-10-21T1148Z-audit/truth-1/bodies/bauman-heise.txt
        - work/2026-10-21T1148Z-audit/truth-1/bodies/bauman-vsquare.txt
        - work/2026-10-21T1148Z-audit/truth-1/bodies/bauman-insider.txt
        - work/2026-10-21T1148Z-audit/truth-1/bodies/bauman-frontstory.txt
    possible_twin_outside_batch: null
  - entry: 2026-05-10/braintrust-ai-evaluation-platform-aws-account-breach-multi-t
    verdict: factual-error
    defects:
      - where: "summary, body paragraph 1"
        claim: "confirmed on 2026-05-06 that an attacker accessed one of its AWS accounts on 2026-05-04"
        defect: "05-04 is the date the incident was discovered, not the date of access; the vendor notice was published 05-05 (2026-05-06 is the TechCrunch article date). The sources give no access date."
        ground_truth: "SecurityWeek: 'The incident, the company says, was discovered on May 4, after receiving a report of suspicious behavior, and was communicated to customers via email on May 5.' TechCrunch: 'disclosed the security incident on its website on Tuesday' (trust-center link text 'Security Incident Notification Published May 5'); customer email 'sent to customers Monday'."
        ground_truth_url: "https://www.securityweek.com/ai-firm-braintrust-prompts-api-key-rotation-after-data-breach/"
        fix: "'Braintrust disclosed on 2026-05-05 that it had discovered on 2026-05-04 unauthorized access to one of its AWS accounts'; note TechCrunch (customer email Monday) and SecurityWeek (email 05-05) differ by a day on the customer email."
        class: factual-error
      - where: "headline"
        claim: "multi-tenant LLM-provider keys and SaaS credentials at risk; mandatory key rotation across customer base"
        defect: "The rotation was recommended/requested, not mandatory, and no source says SaaS credentials were at risk (the vendor said the account likely gave access to customer-stored AI provider API keys)."
        ground_truth: "SecurityWeek: 'As a precaution, we recommend that all customers rotate any org-level AI provider keys used with Braintrust'. TechCrunch: 'The email asked \"every customer to rotate\" any of the API keys that they store with Braintrust.'"
        ground_truth_url: "https://www.securityweek.com/ai-firm-braintrust-prompts-api-key-rotation-after-data-breach/"
        fix: "'Braintrust AWS account breach — customer-stored AI provider API keys likely exposed; all customers urged to rotate org-level keys'."
        class: factual-error
      - where: "body paragraph 1 (SecurityWeek third-party list)"
        claim: "SecurityWeek separately notes that customers commonly federate access from Braintrust into Box, Cloudflare, Dropbox, Notion, Ramp, and Stripe, framing those as adjacent SaaS providers whose credentials warrant the same audit posture"
        defect: "Misreads the page: the named companies are AI-forward companies (likely Braintrust customers) whose org-level provider keys were likely stored, per a Nudge Security executive; nothing about federation into those SaaS products or an audit posture for them."
        ground_truth: "SecurityWeek: 'The org-level AI provider API keys potentially exposed in the incident were likely stored for AI-forward companies such as Box, Cloudflare, Dropbox, Notion, Ramp, Stripe, and others, Nudge Security CTO Jaime Blasco told SecurityWeek.'"
        ground_truth_url: "https://www.securityweek.com/ai-firm-braintrust-prompts-api-key-rotation-after-data-breach/"
        fix: "'A Nudge Security executive told SecurityWeek the exposed org-level provider keys were likely stored for AI-forward companies such as Box, Cloudflare, Dropbox, Notion, Ramp and Stripe' (third-party estimate, not Braintrust's)."
        class: factual-error
      - where: "body paragraph 1 (key providers)"
        claim: "organisation-level API keys customers use to connect to upstream LLM providers (OpenAI, Anthropic, Azure OpenAI)"
        defect: "OpenAI, Anthropic and Azure OpenAI are named on neither cited page."
        ground_truth: "TechCrunch: 'which contained API keys used by customers for accessing cloud-based AI models'. SecurityWeek: 'API keys that organizations use to access AI models'."
        ground_truth_url: "https://techcrunch.com/2026/05/06/ai-evaluation-startup-braintrust-confirms-breach-tells-every-customer-to-rotate-sensitive-keys/"
        fix: "Drop the provider list or cite a page that names them."
        class: factual-error
      - where: "body paragraph 1 (customer impact)"
        claim: "One customer was confirmed compromised and three others reported anomalous AI usage spikes consistent with credential abuse during the post-incident review."
        defect: "Sources say at least one customer was affected and three others reported suspicious usage spikes; 'confirmed compromised', 'consistent with credential abuse' and 'during the post-incident review' are not on either page."
        ground_truth: "SecurityWeek: 'at least one customer has been affected by the incident, with three other customers reporting suspicious spikes in AI provider usage.'"
        ground_truth_url: "https://www.securityweek.com/ai-firm-braintrust-prompts-api-key-rotation-after-data-breach/"
        fix: "'At least one customer was affected and three others reported suspicious spikes in AI provider usage (SecurityWeek, citing Braintrust); Braintrust found no evidence of broader exposure to date.' Cite SecurityWeek on the sentence."
        class: imprecision
      - where: "body paragraph 2 (AI gateways sentence)"
        claim: "The same risk profile applies to AI gateways (LiteLLM,, agent-evaluation harnesses, prompt-rule-based observability, and AI prompt-management platforms."
        defect: "Malformed sentence (unclosed parenthesis, doubled comma); LiteLLM and the other product classes are on neither page (the Nudge executive says only 'AI eval, observability, and gateway tool'); the 'every downstream tenant' propagation is that executive's view, unattributed, while Braintrust says it found no broader exposure."
        ground_truth: "SecurityWeek (Blasco): 'every AI eval, observability, and gateway tool a company adopts becomes a credential warehouse'; Braintrust: 'We have not identified broader customer exposure based on our investigation to date'."
        ground_truth_url: "https://www.securityweek.com/ai-firm-braintrust-prompts-api-key-rotation-after-data-breach/"
        fix: "Attribute the 'credential warehouse' framing to the Nudge Security executive, drop LiteLLM, fix the sentence."
        class: imprecision
      - where: "Defender takeaway"
        claim: "treat any 2026-05-04 → 2026-05-06 audit-log gap on Braintrust as potentially related to this incident"
        defect: "The 05-04 to 05-06 window is invented: no source gives an intrusion window; 05-04 is the discovery date."
        ground_truth: "SecurityWeek: 'discovered on May 4 ... communicated to customers via email on May 5'; TechCrunch: 'The company said the cause of the breach is under investigation.'"
        ground_truth_url: "https://www.securityweek.com/ai-firm-braintrust-prompts-api-key-rotation-after-data-breach/"
        fix: "Replace with a sourced check: review provider-side usage logs for the Braintrust-stored keys (SecurityWeek reports suspicious AI provider usage spikes at three customers) and rotate."
        class: factual-error
      - where: "frontmatter event_date; body paragraph 1 (self-reference)"
        claim: "event_date: 2026-05-08 ; \"No specific Swiss/EU customer impact was identified in available sources at this run's window close.\""
        defect: "event_date is the SecurityWeek publication date, not the primary (TechCrunch 2026-05-06, vendor notice 05-05); 'at this run's window close' is pipeline self-reference."
        ground_truth: "TechCrunch dateline 2026-05-06; trust-center notice 'Published May 5'."
        ground_truth_url: "https://techcrunch.com/2026/05/06/ai-evaluation-startup-braintrust-confirms-breach-tells-every-customer-to-rotate-sensitive-keys/"
        fix: "event_date 2026-05-05 (vendor notice) or 2026-05-06 (primary source date); reword to 'No Swiss or EU customer impact is reported in the cited sources'."
        class: imprecision
    upgrade:
      techniques:
        - id: T1496.004
          behavior: "Three customers reported 'suspicious spikes in AI provider usage' after the breach (SecurityWeek); the sources do not state that the attacker used the keys, so treat as a low-confidence mapping. The access vector is not stated ('cause of the breach is under investigation'): no initial-access technique is mappable."
          url: "https://www.securityweek.com/ai-firm-braintrust-prompts-api-key-rotation-after-data-breach/"
      rating:
        reliability: B
        credibility: 2
        basis: "TechCrunch (original reporting from the customer email) and SecurityWeek relay one vendor statement (the vendor trust-center notice, not readable: JS-rendered Vanta page); one assessor, uncorroborated by an independent party. Vendor is the primary custodian, outlets are large reporters."
      exposure:
        - {quote: "As a precaution, we recommend that all customers rotate any org-level AI provider keys used with Braintrust", url: "https://www.securityweek.com/ai-firm-braintrust-prompts-api-key-rotation-after-data-breach/"}
        - {quote: "unauthorized access\" in one of its Amazon Web Services (AWS) cloud accounts, which contained API keys used by customers for accessing cloud-based AI models.", url: "https://techcrunch.com/2026/05/06/ai-evaluation-startup-braintrust-confirms-breach-tells-every-customer-to-rotate-sensitive-keys/"}
      detection:
        - {quote: "at least one customer has been affected by the incident, with three other customers reporting suspicious spikes in AI provider usage.", url: "https://www.securityweek.com/ai-firm-braintrust-prompts-api-key-rotation-after-data-breach/"}
      triage: []
      takeaway:
        - {quote: "Braintrust recommends that customers access their org-level settings page, delete or revoke the existing secrets, configure new secrets, and confirm that they were rotated by checking their timestamps.", url: "https://www.securityweek.com/ai-firm-braintrust-prompts-api-key-rotation-after-data-breach/"}
      bodies:
        - work/2026-10-21T1148Z-audit/truth-1/bodies/braintrust-techcrunch.txt
        - work/2026-10-21T1148Z-audit/truth-1/bodies/braintrust-securityweek.txt
    possible_twin_outside_batch: null
  - entry: 2026-05-10/clickfix-campaign-expands-to-macos-macsync-shub-stealer-and
    verdict: factual-error
    defects:
      - where: "body paragraph 1 (wallet apps)"
        claim: "Some variants substitute backdoored DMG copies of legitimate wallet applications (Ledger Live, Trezor Suite)."
        defect: "Microsoft describes wallet apps replaced by trojanized app archives fetched from the C2 (app.zip), not DMG copies; .dmg is named only as the delivery of the earlier iterations. The replaced apps are Ledger Wallet, Trezor Suite and Exodus (Ledger Live is only in the probed-wallet list)."
        ground_truth: "Microsoft: 'The stealer was also observed replacing legitimate cryptocurrency wallets apps with attacker-controlled or trojanized ones: Ledger Wallet.app is replaced by app.zip ... Trezor suite.app is replaced by apptwo.zip ... Exodus.app is replaced by appex.zip'."
        ground_truth_url: "https://www.microsoft.com/en-us/security/blog/2026/05/06/clickfix-campaign-uses-fake-macos-utilities-lures-deliver-infostealers/"
        fix: "'In some campaigns the stealer replaces installed wallet applications (Ledger Wallet, Trezor Suite, Exodus) with trojanized versions'."
        class: factual-error
      - where: "Detection concepts (Endpoint Security hook)"
        claim: "anomalous Keychain API calls from processes without UI entitlements (Endpoint Security framework `ES_EVENT_TYPE_NOTIFY_OPENSSH`-style hooks expose this on EDR-instrumented Macs)"
        defect: "(low confidence) Not from any cited source and technically doubtful: `ES_EVENT_TYPE_NOTIFY_OPENSSH` is not a constant in Apple's es_event_type_t list I read (the snapshot predates macOS 13 login events), and OpenSSH login events do not expose Keychain access. Microsoft's own detection guidance is different."
        ground_truth: "Microsoft: 'Detect native tool abuse. Flag unusual sequences of macOS utilities (curl, Base64, Gunzip, osascript, and dscl).' 'Protect credential stores. Detect unauthorized access to keychain items, browser data, SSH keys, and cloud credentials.' Apple's es_event_type_t list (read) carries no OPENSSH constant."
        ground_truth_url: "https://developer.apple.com/tutorials/data/documentation/endpointsecurity/es_event_type_t.md"
        fix: "Replace the hook sentence with Microsoft's stated telemetry: Terminal/shell sessions spawned by installers or user apps, curl/Base64/Gunzip/osascript/dscl sequences, archive creation followed by HTTP POST, keychain and browser-store access."
        class: factual-error
      - where: "headline, summary"
        claim: "ClickFix campaign expands to macOS ... now targeting macOS users"
        defect: "The campaign already targeted macOS (disk-image delivery in earlier iterations); what is new is the shift to ClickFix-style Terminal instructions. 'Expands to macOS' misstates the development."
        ground_truth: "Microsoft: 'Prior iterations of this campaign delivered the infostealers through disk image (.dmg) files that required users to manually install an application. This recent activity reflects a shift in tradecraft, where threat actors instruct users to run Terminal commands'."
        ground_truth_url: "https://www.microsoft.com/en-us/security/blog/2026/05/06/clickfix-campaign-uses-fake-macos-utilities-lures-deliver-infostealers/"
        fix: "'macOS infostealer campaign shifts to ClickFix Terminal-paste delivery'."
        class: imprecision
      - where: "body paragraph 1 (lure mechanics)"
        claim: "the decoded one-liner pipes a remote shell payload directly to `bash`, bypassing Gatekeeper because no signed application bundle is ever launched"
        defect: "Only Microsoft's script campaign is a one-line pipeline; the loader campaign fetches a zsh loader with curl and runs it via eval, the helper campaign downloads a Mach-O executable. 'bash' is not named for the pipeline. Gatekeeper wording is looser than the source ('might be subjected to Gatekeeper verification checks ... don't undergo the same evaluation'). No inline citation sits on the sentence."
        ground_truth: "Microsoft: 'Unlike application bundles opened through Finder—which might be subjected to Gatekeeper verification checks such as code signing and notarization—scripts downloaded and launched directly through Terminal ... don't undergo the same evaluation.' Script campaign: 'resolves a one‑line shell pipeline that retrieves a remote script, which is then handed off immediately for execution.'"
        ground_truth_url: "https://www.microsoft.com/en-us/security/blog/2026/05/06/clickfix-campaign-uses-fake-macos-utilities-lures-deliver-infostealers/"
        fix: "Describe the three execution paths (loader, script, helper) as Microsoft does and cite Microsoft on each clause."
        class: imprecision
      - where: "ATT&CK mapping line (body paragraph 2)"
        claim: "T1204.002 User Execution: Malicious File"
        defect: "Microsoft describes users pasting Base64 instructions into Terminal, not opening a malicious file; the matching sub-technique is T1204.004 Malicious Copy and Paste. T1204.002 is active but does not fit the sourced behavior."
        ground_truth: "Microsoft: 'threat actors instruct users to run Terminal commands that leverage native utilities to retrieve remotely hosted content'."
        ground_truth_url: "https://www.microsoft.com/en-us/security/blog/2026/05/06/clickfix-campaign-uses-fake-macos-utilities-lures-deliver-infostealers/"
        fix: "techniques[]: replace T1204.002 with T1204.004; add the further sourced ids from the upgrade block."
        class: imprecision
      - where: "frontmatter entities; sourcing"
        claim: "AMOS (Atomic macOS Stealer)"
        defect: "The expansion 'Atomic macOS Stealer' is on neither cited page (Microsoft uses 'AMOS' and 'Possible AMOS stealer'); wallet names listed in the clause (Trezor, Ledger, Exodus, Electrum, Atomic, Coinomi, MetaMask, Phantom) are on the Microsoft page. Cosmetic."
        ground_truth: "Microsoft: 'load an infostealing malware like Macsync, Shub Stealer, and AMOS'."
        ground_truth_url: "https://www.microsoft.com/en-us/security/blog/2026/05/06/clickfix-campaign-uses-fake-macos-utilities-lures-deliver-infostealers/"
        fix: "Keep 'AMOS' as Microsoft writes it, or cite a page for the expansion."
        class: imprecision
    upgrade:
      techniques:
        - {id: T1204.004, behavior: "Users are instructed to paste Base64-encoded ClickFix instructions into Terminal from fake macOS troubleshooting pages", url: "https://www.microsoft.com/en-us/security/blog/2026/05/06/clickfix-campaign-uses-fake-macos-utilities-lures-deliver-infostealers/"}
        - {id: T1059.004, behavior: "Decoded one-line shell pipelines, curl-fetched zsh loader executed via eval, bash wrapper for the persistence agent", url: "https://www.microsoft.com/en-us/security/blog/2026/05/06/clickfix-campaign-uses-fake-macos-utilities-lures-deliver-infostealers/"}
        - {id: T1059.002, behavior: "Remote AppleScript executed in memory via osascript; obfuscated persisted AppleScript C2 orchestrator", url: "https://www.microsoft.com/en-us/security/blog/2026/05/06/clickfix-campaign-uses-fake-macos-utilities-lures-deliver-infostealers/"}
        - {id: T1056.002, behavior: "Stealer prompts the victim for their macOS password 'pretending to install a helper utility' and validates it with dscl", url: "https://www.microsoft.com/en-us/security/blog/2026/05/06/clickfix-campaign-uses-fake-macos-utilities-lures-deliver-infostealers/"}
        - {id: T1555.001, behavior: "Copies macOS Keychain databases", url: "https://www.microsoft.com/en-us/security/blog/2026/05/06/clickfix-campaign-uses-fake-macos-utilities-lures-deliver-infostealers/"}
        - {id: T1555.003, behavior: "Collects Chromium-based browser saved usernames and passwords, cookies, autofill data", url: "https://www.microsoft.com/en-us/security/blog/2026/05/06/clickfix-campaign-uses-fake-macos-utilities-lures-deliver-infostealers/"}
        - {id: T1543.001, behavior: "LaunchAgent plist (masquerading as a Google updater, or randomly named) persists the bot component", url: "https://www.microsoft.com/en-us/security/blog/2026/05/06/clickfix-campaign-uses-fake-macos-utilities-lures-deliver-infostealers/"}
        - {id: T1543.004, behavior: "Helper campaign writes a LaunchDaemon plist that runs a wrapper with root privileges at boot (KeepAlive)", url: "https://www.microsoft.com/en-us/security/blog/2026/05/06/clickfix-campaign-uses-fake-macos-utilities-lures-deliver-infostealers/"}
        - {id: T1036.005, behavior: "Persistence masqueraded as a Google software-update agent", url: "https://www.microsoft.com/en-us/security/blog/2026/05/06/clickfix-campaign-uses-fake-macos-utilities-lures-deliver-infostealers/"}
        - {id: T1497.001, behavior: "Virtualization detection via system_profiler; Russian keyboard kill switch; sandbox detection", url: "https://www.microsoft.com/en-us/security/blog/2026/05/06/clickfix-campaign-uses-fake-macos-utilities-lures-deliver-infostealers/"}
