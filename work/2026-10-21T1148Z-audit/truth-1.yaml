        - {id: T1204.002, behavior: "Victims ran the downloaded malicious Windows or Linux installer", url: "https://jdownloader.org/incident_8.5.2026.html"}
        - {id: T1036.005, behavior: "Substitute files carried the names of the genuine JDownloader installers", url: "https://jdownloader.org/incident_8.5.2026.html"}
        - {id: T1059.006, behavior: "Windows loader deploys a heavily obfuscated Python-based RAT executing Python code from C2", url: "https://www.bleepingcomputer.com/news/security/jdownloader-site-hacked-to-replace-installers-with-python-rat-malware/"}
        - {id: T1105, behavior: "Linux installer downloads an archive from a remote host (disguised as an SVG file) and extracts two ELF binaries", url: "https://www.bleepingcomputer.com/news/security/jdownloader-site-hacked-to-replace-installers-with-python-rat-malware/"}
        - {id: T1036.008, behavior: "Linux payload archive disguised as an SVG file", url: "https://www.bleepingcomputer.com/news/security/jdownloader-site-hacked-to-replace-installers-with-python-rat-malware/"}
        - {id: T1548.001, behavior: "Linux installer installs a SUID-root binary under /usr/bin", url: "https://www.bleepingcomputer.com/news/security/jdownloader-site-hacked-to-replace-installers-with-python-rat-malware/"}
        - {id: T1546.004, behavior: "Persistence script created under /etc/profile.d (runs at shell login)", url: "https://www.bleepingcomputer.com/news/security/jdownloader-site-hacked-to-replace-installers-with-python-rat-malware/"}
        - {id: T1027.002, behavior: "Linux main payload heavily obfuscated with Pyarmor", url: "https://www.bleepingcomputer.com/news/security/jdownloader-site-hacked-to-replace-installers-with-python-rat-malware/"}
      rating:
        reliability: A
        credibility: 1
        basis: "Vendor incident notice (primary custodian, timeline and scope) agrees with an independent analyst's malware analysis (Klemenc, via BleepingComputer; ANY.RUN run via Security Affairs) and with user reports; PiunikaWeb and CyberKendra relay the developer's Reddit statements."
      exposure:
        - {quote: "Only people who downloaded and installed from jdownloader.org during 6th–7th May 2026 (UTC) using one or more website download links for \"Download Alternative Installer\" and/or the affected Linux shell installer link", url: "https://jdownloader.org/incident_8.5.2026.html"}
        - {quote: "Updates installed through JDownloader's built-in updater (RSA-signed; see In-app updates), which is independent of the manipulated website links.", url: "https://jdownloader.org/incident_8.5.2026.html"}
