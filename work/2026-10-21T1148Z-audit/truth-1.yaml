  - entry: 2026-05-13/foxconn-confirms-nitrogen-ransomware-crippled-north-american
    verdict: factual-error
    defects:
      - where: "body paragraph 1 (affected sites, timeline, halt)"
        claim: "several North-American factories — including Mount Pleasant (Wisconsin), Houston (Texas), and additional sites in Ohio, Virginia, Indiana and Mexico — suffered a cyberattack starting at approximately 07:00 ET on 2026-05-01 ... production halted for roughly a week"
        defect: "Foxconn declined to say which or how many factories were hit; The Record lists the states where Foxconn has factories, not affected sites. Only Mount Pleasant (worker accounts via The Cybersec Guru) and possibly Houston (AppleInsider) are reported. The 7:00 AM time is a worker account with no time zone (Mount Pleasant is in US Central time, not ET); no page gives a week-long production halt."
        ground_truth: "The Record: 'A spokesperson for the company confirmed the incident but declined to provide specifics on how many factories in North America were impacted. Foxconn has factories in Wisconsin, Ohio, Texas, Virginia, Indiana and several across Mexico.' 9to5Mac (quoting The Cybersec Guru): 'By 7:00 AM, Wi-Fi was gone. By 11:00 AM, the disruption had spread through core plant infrastructure.'"
        ground_truth_url: "https://therecord.media/foxconn-confirms-cyberattack-north-american-factories"
        fix: "'Foxconn confirmed that some North American factories suffered a cyberattack and are resuming production; workers at Mount Pleasant, Wisconsin reported a network outage from 1 May (The Cybersec Guru via 9to5Mac), and AppleInsider reports Houston also affected'; drop the state list, 'ET' and 'roughly a week'."
        class: factual-error
      - where: "summary; headline"
        claim: "Foxconn's statement on 2026-05-12 acknowledges the network collapse that began at the Mount Pleasant, Wisconsin plant on May 1 ... Foxconn confirms Nitrogen ransomware crippled North-American manufacturing sites"
        defect: "Foxconn's statement confirms only that some North American factories suffered a cyberattack and are resuming normal production; it does not mention Mount Pleasant, May 1, a network collapse or Nitrogen, and the Mount Pleasant detail comes from workers quoted by a third-party site."
        ground_truth: "The Register (Foxconn statement): 'Some of Foxconn's factories in North America suffered a cyberattack,' ... 'The affected factories are currently resuming normal production.' 'Foxconn declined to confirm that these - or any - customers' information was hoovered up'."
        ground_truth_url: "https://www.theregister.com/cyber-crime/2026/05/12/foxconn-confirms-cyberattack-after-nitrogen-claims-apple-nvidia-data-theft/5239144"
        fix: "'Foxconn confirms cyberattack on some North American factories after Nitrogen claims 8 TB data theft'; attribute the Mount Pleasant timeline to worker accounts."
        class: factual-error
      - where: "body paragraph 1 (Nitrogen claim, citation binding)"
        claim: "claims 8 TB / 11 million files, alleging \"confidential technical drawings and project documentation\" for Apple, Nvidia, Intel, Google and Dell engagements ([9to5Mac, 2026-05-12])"
        defect: "The quoted phrase appears on no page (The Register: 'confidential instructions, internal project documentation, and technical drawings'); '11 million files' and Intel are in The Register, not the cited 9to5Mac page; 'Conti 2 leaked-builder derivative active since 2023' is from The Record / Coveware, not 9to5Mac."
        ground_truth: "The Register: 'stolen 8 TB of data comprising more than 11 million files'; 'confidential instructions, internal project documentation, and technical drawings' 'related to projects at Intel, Apple, Google, Dell, and Nvidia, among others.' 9to5Mac (WIRED): 'schematics and project details from customers including Dell, Google, Apple, and Nvidia'."
        ground_truth_url: "https://www.theregister.com/cyber-crime/2026/05/12/foxconn-confirms-cyberattack-after-nitrogen-claims-apple-nvidia-data-theft/5239144"
        fix: "Quote The Register verbatim and cite it on that clause; cite The Record/Coveware for the Conti 2 and 2023 lineage."
        class: imprecision
      - where: "Why it matters (ESXi recovery claims)"
        claim: "If Nitrogen encrypts an ESXi host in your estate, paying does not restore your VMs. Backup integrity at the hypervisor layer (not just guest-level) is the only recovery path."
        defect: "Coveware's finding concerns the ESXi malware sample it analysed and tells victims to check their files against the specific malware; the absolute claim for any Nitrogen ESXi encryption goes beyond it, and no source says Foxconn's ESXi hosts were encrypted."
        ground_truth: "Coveware: 'Any ESXi encrypted files that are without viable backups, must be analyzed in conjunction with the corresponding malware that encrypted them to ascertain their status.' The Register: 'even paying the ransom demand may not guarantee recovery of encrypted files.'"
        ground_truth_url: "https://www.coveware.com/blog/2026/2/2/nitrogen-ransomware-esxi-malware-has-a-bug"
        fix: "'For the Nitrogen ESXi encryptor Coveware analysed, a coding bug makes files unrecoverable even for the operator; check encrypted files against the specific sample before relying on a decryptor.'"
        class: imprecision
      - where: "Why it matters (relevance; detection; hunting)"
        claim: "Foxconn is the dominant EMS supplier for endpoints widely procured by Swiss / EU government ... alert on `vmkfstools` / `esxcli` invocations from non-administrator sessions on ESXi `/var/log/shell.log` ... (Cobalt Strike beaconing, Rclone exfiltration)"
        defect: "Swiss/EU procurement link, ESXi detection guidance and the Cobalt Strike / Rclone hunting are on no cited page; 'Why it matters to us' is organisation-internal wording. (low confidence) The out-of-nexus single-victim incident with no disclosed vector rests its high priority on this uncited supply-chain argument."
        ground_truth: "The Record: Foxconn 'is considered the world's largest contract manufacturer of electronics — making products for companies like Apple, Google, Microsoft, Cisco and others.'"
        ground_truth_url: "https://therecord.media/foxconn-confirms-cyberattack-north-american-factories"
        fix: "Keep only the sourced relevance (largest contract manufacturer; Nitrogen ESXi decryptor bug); drop or cite the rest; reconsider priority."
        class: imprecision
    upgrade:
      techniques:
