  - entry: 2026-05-10/groupe-3r-r-seau-radiologique-romand-akira-ransomware-claims
    verdict: factual-error
    defects:
      - where: "summary; body paragraph 1 (disclosure date)"
        claim: "Victim disclosed the attack on 2026-04-30 via its own site ... The operator confirmed the attack publicly via its own website on 2026-04-30"
        defect: "2026-04-30 is the attack date, not the disclosure date. The victim page speaks of 1 and 2 May in the past tense, so it was written after 2 May; the first press report is ICTjournal 2026-05-06 and the earliest archive capture of the page is 2026-05-07. The source record's publisher label 'Groupe 3R victim statement, 2026-04-30' carries the same error."
        ground_truth: "Victim page: 'Le Groupe 3R a été victime d'une cyberattaque le jeudi 30 avril 2026' and 'Surtout les 1 et 2 mai. Tous les centres sont toutefois restés ouverts'. ICTjournal first report dated 2026-05-06."
        ground_truth_url: "https://web.archive.org/web/20260507161112/https://www.groupe3r.ch/fr/information-importante-perturbation-de-nos-services-7268/"
        fix: "'Groupe 3R reported a ransomware attack of 2026-04-30 on its website (first press coverage 2026-05-06)'; relabel the source 'Groupe 3R statement' without the 04-30 date."
        class: factual-error
      - where: "body paragraph 3 (Defender takeaway, second outage claim); actions[0]"
        claim: "this is the second 3R outage inside a year ... should not treat a single successful defence as retiring the threat model"
        defect: "The April 2025 incident was not an outage and not a successful defence: attackers stole medical and administrative data without disrupting operations."
        ground_truth: "SwissCybersecurity.net: 'Damals stahlen die Angreifer medizinische und administrative Daten, ohne jedoch den Betrieb zu stören.' ICTjournal: 'marqué par le vol de données médicales et administratives, sans perturber les activités du groupe'."
        ground_truth_url: "https://www.swisscybersecurity.net/news/2026-05-07/cyberangriff-legt-westschweizer-radiologie-netzwerk-erneut-lahm"
        fix: "'second incident in about a year: the 2025 attack stole medical and administrative data without disrupting operations; the 2026 attack encrypted systems'; drop 'single successful defence' and 'second outage'."
        class: factual-error
      - where: "body paragraph 1 (Akira claim, no supporting citation)"
        claim: "Akira listed Groupe 3R on its dark-web leak site on approximately 2026-05-08, claiming an attack dated 2026-04-30 and threatening release of 48 GB including employee identity documents ..., patient records ..., payment information, and signed NDAs"
        defect: "None of the three cited pages (victim statement, ICTjournal, Blick) mentions Akira, 48 GB or the data categories; the claim is carried by leak-tracker and aggregator pages. The entry presents the data list as a 'threat' without saying it is the criminal group's own wording."
        ground_truth: "DeXpose 2026-05-09 quotes the Akira post: 'We will upload 48gb of corporate data soon. Detailed employee personal information (passport, DLs, IDs and other personal information), patient information (phone, addresses, medical info and so on), payment details, NDAs and so on.' ransomware.live: 'discovered on 2026-05-08 ... Est. attack date 2026-04-30'."
        ground_truth_url: "https://www.dexpose.io/?p=32553"
        fix: "Add ransomware.live / DeXpose (or another page that carries the listing) as the citation for the leak-site claim and label the data list as Akira's claim."
        class: imprecision
      - where: "summary; body paragraph 1 (cantons); update section"
        claim: "20 medical-imaging centres across seven Romandie cantons (Geneva, Vaud, Valais, Fribourg, Neuchâtel, Berne and a seventh) ... a further canton listed in the operator statement"
        defect: "The press says seven Swiss cantons, not Romandie cantons; the operator's site lists Zurich as the seventh, which is not a Romandie canton. The operator statement (as archived on 2026-05-07) lists no cantons. The 2026-07-09 section lists six and drops the seventh."
        ground_truth: "ICTjournal: 'vingt centres d'imagerie médicale dans sept cantons suisses'. Operator site navigation under 'Nos centres': Vaud, Valais, Fribourg, Genève, Neuchâtel, Berne, Zurich."
        ground_truth_url: "https://www.ictjournal.ch/news/2026-05-06/le-reseau-radiologique-romand-a-nouveau-victime-dune-cyberattaque-ses-systemes"
        fix: "'20 imaging centres in seven Swiss cantons (Vaud, Valais, Fribourg, Geneva, Neuchâtel, Berne and Zurich)'."
        class: imprecision
      - where: "body paragraph 1 (exfiltration statement); summary"
        claim: "Data-exfiltration was not confirmed by the victim; Akira's leak-site post asserts 48 GB exfiltrated."
        defect: "Superseded by the entry's own 2026-07-09 section and the victim's later statements: the victim confirmed theft of administrative data (including personal data of current and former staff) and that internal documents were published on the darknet. The Akira post says it 'will upload' 48 GB 'soon', not that 48 GB were exfiltrated. The main analysis was not corrected."
        ground_truth: "ICTjournal 2026-07-06: 'Il confirme que l'attaque a conduit au vol de données administratives de l'entreprise.' Victim page (2026-09-22): 'Des données administratives de l'entreprise ont été cryptées et volées, incluant des informations personnelles de collaborateurs actuels et anciens. ... Il n'est par contre pas possible d'indiquer avec certitude si ces données médicales de patients ont aussi été volées.'"
        ground_truth_url: "https://www.groupe3r.ch/fr/information-importante-perturbation-de-nos-services-7268/"
        fix: "State the current position: administrative data stolen and partly published (victim-confirmed); medical-data exfiltration unconfirmed and possibly never provable; keep the 2026-05-08 Akira claim as history."
        class: factual-error
      - where: "body paragraph 2 (Akira playbook); Defender takeaway; ATT&CK links"
        claim: "Akira's documented playbook ... emphasises edge-device initial access (Cisco ASA / FTD CVEs, Fortinet SSL-VPN CVEs, VMware ESXi authenticated RCE) and intermittent file-encryption to evade EDR file-IO heuristics; ATT&CK techniques observed across recent Akira incidents include T1190, T1133"
        defect: "No cited page states Akira's playbook or Groupe 3R's access vector (the sources say nothing on how access was obtained). CISA's Akira advisory supports VPN access without MFA and 'mostly ... known CVEs' (SonicWall named) and 'full or partial encryption', not Fortinet SSL-VPN access, ESXi authenticated RCE or 'intermittent' encryption; the MITRE technique links are not evidence for the claim. 'PACS/RIS environments tend to co-tenant with Windows file shares' is uncited."
        ground_truth: "CISA AA24-109A (rev. 2025-11-13): 'obtaining initial access to organizations through a virtual private network (VPN) service'; 'mostly using known Common Vulnerabilities and Exposures (CVEs)'; 'customizes encryption methods based on file type and size, and enables full or partial encryption'."
        ground_truth_url: "https://www.cisa.gov/news-events/cybersecurity-advisories/aa24-109a"
        fix: "Cite CISA AA24-109A for the actor profile, drop Fortinet/ESXi/intermittent-encryption wording, and say the 3R access vector is not public; map only T1486 and victim-confirmed data theft."
        class: factual-error
      - where: "body paragraph 1 (rebuilt infrastructure)"
        claim: "new examination data security has been restored on rebuilt infrastructure"
