  - entry: 2026-05-12/west-pharmaceutical-services-files-sec-form-8-k-item-1-05-da
    verdict: imprecision
    defects:
      - where: "body paragraph 1 (ATT&CK framing)"
        claim: "terminology consistent with a T1486 Data Encrypted for Impact plus T1041 Exfiltration Over C2 Channel double-extortion ransomware pattern"
        defect: "The filing states exfiltration and encryption but not the exfiltration channel, so T1041 is not supported; T1486 is."
        ground_truth: "8-K Item 1.05: 'certain data was exfiltrated by an unauthorized party and certain systems were encrypted.'"
        ground_truth_url: "https://www.sec.gov/Archives/edgar/data/105770/000010577026000068/wst-20260507.htm"
        fix: "techniques[]: T1486 only; say the exfiltration method is not disclosed."
        class: imprecision
      - where: "body paragraph 1 (absence of claims); company description"
        claim: "No threat actor has claimed responsibility publicly at time of filing. ... a US-headquartered global manufacturer of drug-delivery and packaging components"
        defect: "Both are true per BleepingComputer (2026-05-13) but neither is on the only cited page (the 8-K has no business description and says nothing about claims)."
        ground_truth: "BleepingComputer: 'No ransomware groups have taken credit for the attack on West Pharmaceutical Services at the time of writing.' 'The company specializes in injectable drug packaging, syringe and vial components, containment systems, and drug delivery devices.'"
        ground_truth_url: "https://www.bleepingcomputer.com/news/security/west-pharmaceutical-says-hackers-stole-data-encrypted-systems/"
        fix: "Cite BleepingComputer for both clauses and date the absence statement ('as of 2026-05-13')."
        class: imprecision
      - where: "Defender takeaway"
        claim: "West Pharma's elastomeric closures, vials and drug-delivery devices feed European biopharma packaging lines including those of national-formulary suppliers ... OT-adjacent ... Detection pivot for analogous targets: large-volume SMB enumeration, VSSAdmin / WBEM shadow-copy deletion (T1490 Inhibit System Recovery), and abnormal DLP egress volume"
