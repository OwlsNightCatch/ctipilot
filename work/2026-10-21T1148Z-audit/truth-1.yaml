  - entry: 2026-05-12/ico-fines-south-staffordshire-water-963-900-water-sector-oes
    verdict: factual-error
    defects:
      - where: "body paragraph 1 (regulator and CVE); cves[]"
        claim: "the regulator does not name a CVE or threat actor in its public notice. The technical kill-chain detail — ... CVE-2020-1472 (ZeroLogon, T1068) ... — comes from The Record's reporting"
        defect: "The ICO's published monetary penalty notice names ZeroLogon (CVE-2020-1472) and states it was exploited by the threat actor; The Record took the detail from that notice. Only the press release and the notice omit the actor name (Cl0p comes from The Record and The Register). cves[] is empty although the body names CVE-2020-1472."
        ground_truth: "ICO penalty notice para 43: 'As at May 2022, two domain controllers in the IT environment were unpatched against the ZeroLogon vulnerability (CVE-2020-1472) ... While it is noted that the Incident did not occur as a result of this vulnerability, the vulnerability was exploited by the threat actor during the Incident.'"
        ground_truth_url: "https://ico.org.uk/media2/xdrfahsw/south-staffordshire-plc-and-south-staffordshire-water-plc-monetary-penalty-notice.pdf"
        fix: "Cite the penalty notice for ZeroLogon; say the ICO does not name the actor (Cl0p per The Record/The Register); add CVE-2020-1472 to cves[] with the vendor (Microsoft) advisory as authority."
        class: factual-error
      - where: "body paragraph 1 (kill chain)"
        claim: "phishing initial access in September 2020 → CVE-2020-1472 (ZeroLogon, T1068) against two unpatched domain controllers → domain admin → ~20 months of unimpeded lateral movement → detection in July 2022"
        defect: "Mis-sequenced: the malware sat undetected for 20 months after the September 2020 phishing foothold, and lateral movement and domain-admin compromise began in May 2022; the notice says the incident did not occur as a result of ZeroLogon (it was exploited during it), so ZeroLogon is not established as the route to domain admin."
        ground_truth: "ICO: 'the recipient opened an attachment which enabled the attacker to install malicious software which remained undetected within the organisation's systems for 20 months. Then, in May 2022, the hacker moved through the network and compromised domain administrator privileges'. Detection: 'internal investigation to commence on 15 July 2022'."
        ground_truth_url: "https://ico.org.uk/about-the-ico/media-centre/news-and-blogs/2026/05/fine-of-nearly-1m-issued-against-south-staffordshire-plc-and-south-staffordshire-water-plc/"
        fix: "'phishing attachment (September 2020) → dormant foothold for 20 months → lateral movement and domain-admin compromise from May 2022, with ZeroLogon exploited during the incident on two unpatched DCs → detected 15 July 2022'."
        class: factual-error
      - where: "Why it matters to us (regulatory framing); headline"
        claim: "The ICO action is the first significant post-Cyber-Security-and-Resilience-Bill UK regulatory action against a water-sector OES, and the regulator's operational findings transfer verbatim to NIS2 Article 21 technical measures and the German KRITIS-DachG public-administration scope that came into force this spring"
        defect: "The Cyber Security and Resilience Bill had not been introduced to Parliament, so there is no 'post-Bill' action; the ICO fined under UK GDPR Articles 5(1)(f) and 32(1), not as a NIS/OES regulator. The NIS2 and KRITIS-DachG claims are on no page read."
        ground_truth: "The Record: 'The U.K. government's Cyber Security and Resilience Bill ... is expected to be introduced to Parliament this year.' ICO enforcement page: 'for the infringement of Article 5(1)(f) and Article 32(1) of the UK General Data Protection Regulation'."
        ground_truth_url: "https://therecord.media/uk-water-company-had-hackers-lurking-for-years"
        fix: "'A UK GDPR (Art. 5(1)(f), 32(1)) penalty against a water supplier'; drop the CSR-Bill, NIS2 and KRITIS-DachG sentence or cite it; drop 'OES' from the headline."
        class: factual-error
      - where: "summary; body paragraph 1 (monitoring finding)"
        claim: "partial SIEM coverage ... incomplete SIEM coverage"
        defect: "Understates the regulator's finding: a third-party SOC monitored only 5% of the IT environment (December 2021) and endpoint telemetry was not integrated into the SIEM."
        ground_truth: "ICO penalty notice para 39: 'in December 2021, a third-party security operations centre was monitoring only 5% of the IT environment. ... Endpoint telemetry and logging were not integrated into South Staffordshire's security incident and event monitoring platform.'"
        ground_truth_url: "https://ico.org.uk/media2/xdrfahsw/south-staffordshire-plc-and-south-staffordshire-water-plc-monetary-penalty-notice.pdf"
        fix: "'only 5% of the IT environment was monitored'."
        class: imprecision
      - where: "body paragraph 1 (citation binding for data figures)"
        claim: "The ICO press release records that data on **about 1.85 million customers** (approximately 750,000 current and 1.1 million former) ... **over 4.1 TB** ... ([The Register, 2026-05-11](...))"
        defect: "The clause attributes the figures to the ICO press release but cites The Register, which gives 'exceeding 4 TB' and no current/former split; the ICO press release carries them."
        ground_truth: "ICO: 'approximately 1.85 million customers — around 750,000 current and 1.1 million former'; 'over 4.1 terabytes of data had been published on the dark web'. The Register: 'a file exceeding 4 TB'."
        ground_truth_url: "https://ico.org.uk/about-the-ico/media-centre/news-and-blogs/2026/05/fine-of-nearly-1m-issued-against-south-staffordshire-plc-and-south-staffordshire-water-plc/"
        fix: "Cite the ICO press release on that sentence."
        class: imprecision
      - where: "Defender takeaway (c)"
        claim: "detection logic that survives this case maps to Sysmon-class auditing of DC authentication events — `4742` (account changes) and `4769` Kerberos service-ticket anomalies"
        defect: "Uncited; 4742 and 4769 are Windows Security audit events, not Sysmon events, and no source gives detection guidance for this case."
        ground_truth: "Neither the ICO pages nor The Record give detection guidance; the notice states only that endpoint telemetry and logging were not integrated into the SIEM."
        ground_truth_url: "https://ico.org.uk/media2/xdrfahsw/south-staffordshire-plc-and-south-staffordshire-water-plc-monetary-penalty-notice.pdf"
        fix: "Cite Microsoft's CVE-2020-1472 guidance for any DC detection, or drop the event IDs."
        class: imprecision
      - where: "priority; headline; sourcing_note"
        claim: "priority: high ; headline ending 'sourced to The' ; sourcing_note: \"migration: CVE fields incomplete in v2 footer (CVE-2020-1472)\""
        defect: "A UK regulatory fine for a 2020-2022 single-victim incident with no Swiss nexus and no new TTP plainly misses the high bar (single-victim event older than 30 days). Headline truncated; sourcing_note is pipeline self-reference."
        ground_truth: "ICO: 'The attack, which can be traced back to September 2020 but largely took place between May and July 2022'."
        ground_truth_url: "https://ico.org.uk/about-the-ico/media-centre/news-and-blogs/2026/05/fine-of-nearly-1m-issued-against-south-staffordshire-plc-and-south-staffordshire-water-plc/"
        fix: "priority notable or routine; complete the headline; replace the sourcing_note with provenance or null."
        class: imprecision
    upgrade:
      techniques:
        - {id: T1566.001, behavior: "Phishing email whose attachment, once opened, installed malicious software (September 2020)", url: "https://ico.org.uk/about-the-ico/media-centre/news-and-blogs/2026/05/fine-of-nearly-1m-issued-against-south-staffordshire-plc-and-south-staffordshire-water-plc/"}
        - {id: T1204.002, behavior: "Recipient opened the malicious attachment", url: "https://ico.org.uk/about-the-ico/media-centre/news-and-blogs/2026/05/fine-of-nearly-1m-issued-against-south-staffordshire-plc-and-south-staffordshire-water-plc/"}
        - {id: T1068, behavior: "ZeroLogon (CVE-2020-1472) exploited on two unpatched domain controllers during the incident", url: "https://ico.org.uk/media2/xdrfahsw/south-staffordshire-plc-and-south-staffordshire-water-plc-monetary-penalty-notice.pdf"}
        - {id: T1078.002, behavior: "Attacker moved laterally using a domain administrator account from May 2022", url: "https://therecord.media/uk-water-company-had-hackers-lurking-for-years"}
      rating:
        reliability: A
        credibility: 2
        basis: "UK ICO (regulator, own enforcement action: press release and published penalty notice); The Record and The Register restate the notice and add the Cl0p attribution (from the group's 2022 claim): one assessor for the findings."
      exposure:
        - {quote: "As at May 2022, two domain controllers in the IT environment were unpatched against the ZeroLogon vulnerability (CVE-2020-1472)", url: "https://ico.org.uk/media2/xdrfahsw/south-staffordshire-plc-and-south-staffordshire-water-plc-monetary-penalty-notice.pdf"}
        - {quote: "Use of obsolete, unsupported software on some devices, including Windows Server 2003.", url: "https://ico.org.uk/about-the-ico/media-centre/news-and-blogs/2026/05/fine-of-nearly-1m-issued-against-south-staffordshire-plc-and-south-staffordshire-water-plc/"}
      detection:
        - {quote: "Inadequate monitoring and logging — only 5% of the IT environment was being monitored, meaning malicious activity was not detected.", url: "https://ico.org.uk/about-the-ico/media-centre/news-and-blogs/2026/05/fine-of-nearly-1m-issued-against-south-staffordshire-plc-and-south-staffordshire-water-plc/"}
      triage: []
      takeaway:
        - {quote: "Are logging and monitoring controls in place providing sufficient coverage of the IT environment, and are alerts being acted upon?", url: "https://ico.org.uk/about-the-ico/media-centre/news-and-blogs/2026/05/fine-of-nearly-1m-issued-against-south-staffordshire-plc-and-south-staffordshire-water-plc/"}
      bodies:
