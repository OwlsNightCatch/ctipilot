        - {quote: "Zugangsdaten bestehen aus der E Mail-Adresse und einem Passwort, das in verschlüsselter Form, also als kryptografischer Hash, gespeichert wird.", url: "https://www.skoda-auto.de/unternehmen/sicherheitsvorfall-skoda-shop"}
      detection:
