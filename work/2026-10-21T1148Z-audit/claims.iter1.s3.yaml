- claim_id: eb55042222
  entry: 2026-05-19/grafana-labs-coinbasecartel-breach-victim-confirms-source-co
  surface: summary
  kind: frontmatter
  text: Grafana Labs confirmed on 2026-05-17 that an unauthorized party used a token for its GitHub environment to download its codebase, two days after the data-extortion group CoinbaseCartel listed it
    on its leak site, and refused the ransom demand. Its update of 2026-05-19 traces the breach to the TanStack npm supply-chain attack attributed to TeamPCP, detected on 2026-05-11, after which a missed
    GitHub workflow token let the attackers in; the download also took internal repositories holding business contact names and email addresses, while customer production systems and Grafana Cloud were
    not affected.
