  surface: immediate_action
  kind: frontmatter
  text: 'Update Drupal core sites on PostgreSQL to 11.3.10, 11.2.12, 11.1.10, 10.6.9, 10.5.10 or 10.4.10: CVE-2026-9082 (SA-CORE-2026-004, 2026-05-20) is an anonymous SQL injection in Drupal core''s database
    abstraction API that only affects sites using PostgreSQL; Drupal confirmed exploit attempts in the wild on 2026-05-22 and CISA added it to its KEV catalog the same day. Update to 11.3.10, 11.2.12, 11.1.10,
    10.6.9, 10.5.10 or 10.4.10, or on Drupal 9.5 and 8.9 apply the best-effort patch file by hand; sites behind Drupal Steward are protected against known attack vectors but should still update. Imperva
    observed over 15,000 attack attempts against almost 6,000 sites, most of them probing.'
