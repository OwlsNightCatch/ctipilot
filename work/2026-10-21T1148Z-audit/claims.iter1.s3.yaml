  entry: 2026-05-19/symantec-carbon-black-document-fast16-hook-engine-targeting
  surface: headline
  kind: frontmatter
  text: 'Symantec: fast16 corrupted LS-DYNA and AUTODYN simulations of uranium compression in nuclear detonations'
- claim_id: c716599474
  entry: 2026-05-19/symantec-carbon-black-document-fast16-hook-engine-targeting
  surface: summary
  kind: frontmatter
  text: Broadcom's Symantec and Carbon Black teams reported on 2026-05-16 that fast16, the circa-2005 sabotage framework SentinelOne first analyzed in April 2026, hooks LS-DYNA and AUTODYN through a boot-start
    filesystem driver and scales down simulation outputs only in high-explosive runs once the simulated material passes 30 g/cm³, a density uranium reaches only in an implosion device. It spreads only inside
    its own network and avoids hosts with endpoint-security products; Kim Zetter argues that, if it targeted Iran, it was contemporaneous with Stuxnet rather than a predecessor, while Broadcom still calls
    it pre-Stuxnet.
- claim_id: 4363d7d51d
  entry: 2026-05-19/symantec-carbon-black-document-fast16-hook-engine-targeting
  surface: body
  kind: cited
  text: Broadcom's Symantec and Carbon Black teams published on 2026-05-16 an analysis of fast16, the sabotage framework that SentinelOne first analyzed in April 2026 and whose oldest components date from
    around 2005, and confirm that its hook engine targets LS-DYNA and AUTODYN, applications used to simulate problems such as vehicle crashworthiness, material modelling and explosive simulation (
  urls:
  - https://www.security.com/blog-post/fast16-nuclear-sabotage
  - https://thehackernews.com/2026/05/pre-stuxnet-fast16-malware-tampered.html
- claim_id: 5a92451242
  entry: 2026-05-19/symantec-carbon-black-document-fast16-hook-engine-targeting
  surface: body
  kind: cited
  text: The framework combines a service binary that embeds a Lua 5.0 virtual machine, a boot-start filesystem filter driver that patches Intel-compiled executables on the fly as they are read from disk,
    and 101 byte-pattern rules in nine or ten groups for different builds of the two programs (
  urls:
  - https://www.security.com/blog-post/fast16-nuclear-sabotage
- claim_id: 6a61d91f0c
  entry: 2026-05-19/symantec-carbon-black-document-fast16-hook-engine-targeting
  surface: body
  kind: cited
  text: Its hooks act only in high-explosive simulations and scale down outputs such as pressure or stress once the simulated material density passes 30 g/cm³, the threshold Broadcom says uranium reaches
    only under the shock compression of an implosion device, which it reads as sabotage of nuclear weapons research (
  urls:
  - https://www.security.com/blog-post/fast16-nuclear-sabotage
- claim_id: 86d00a77c4
  entry: 2026-05-19/symantec-carbon-black-document-fast16-hook-engine-targeting
  surface: body
  kind: cited
  text: Before installing, fast16 checks for 18 endpoint-security registry keys and refuses to spread if any is present; it then registers itself as a service whose file takes the creation dates and permissions
    of a system binary, loads its driver as a SCSI-class filter at the next boot, and persists by hijacking a chosen application through the Image File Execution Options Debugger value (
  urls:
  - https://www.security.com/blog-post/fast16-nuclear-sabotage
- claim_id: e83980b575
  entry: 2026-05-19/symantec-carbon-black-document-fast16-hook-engine-targeting
  surface: body
  kind: cited
  text: It spreads only inside its own network, enumerating domains, servers and shares and, for hosts in local address ranges, copying itself to their admin share under the logged-on user's credentials
    and creating a remote service (
  urls:
  - https://www.security.com/blog-post/fast16-nuclear-sabotage
