  text: The demo.pdb BadIIS variant is a native IIS module registered in the server module list (globalModules and modules), not an ISAPI filter or extension loaded from web.config, and a hidden backup
    copy restores it on each IIS restart. Talos contrasts it with the BadIIS variants of DragonRank and UAT-8099 rather than placing it in their activity, and finds it difficult to attribute the attacks
