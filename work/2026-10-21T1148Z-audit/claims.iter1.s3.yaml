- claim_id: 5678f8821c
  entry: 2026-05-20/huawei-vrp-enterprise-router-zero-day-caused-post-luxembourg
  surface: summary
  kind: frontmatter
  text: Recorded Future News reported on 2026-05-19 that an attack exploiting a previously unknown vulnerability in Huawei enterprise router software caused POST Luxembourg's nationwide outage of 23 July
    2025, which cut mobile, landline and emergency communications for more than three hours. Specially crafted traffic relayed through POST's network sent the routers into a continuous restart loop; investigators
    found no evidence that POST was the chosen target, and no CVE or public warning had been issued ten months later.
