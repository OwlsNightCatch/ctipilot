  entry: 2026-05-21/sonicwall-gen6-ssl-vpn-incomplete-patching-cve-2024-12802-ak
  surface: body
  kind: cited
  text: 'On Gen6 the fixed firmware does not remove the vulnerable LDAP configuration, so six manual steps are needed: delete the LDAP configuration that uses userPrincipalName, remove cached LDAP users,
    remove the SSL VPN user domain, reboot, recreate the LDAP configuration without userPrincipalName and take a fresh backup ('
