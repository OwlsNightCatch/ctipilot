  text: Lumen's Black Lotus Labs (2026-05-20) and PwC Threat Intelligence (2026-05-21) documented Showboat, a modular Linux post-exploitation framework that PwC calls kworker, which spawns shells, moves
    files, hides its own process and acts as a SOCKS5 proxy, and JFMBackdoor, a Windows backdoor delivered by DLL side-loading. Lumen confirms an Afghanistan-based ISP and an entity in Azerbaijan as victims
