  surface: body
  kind: cited
  text: Since 2024 Talos has investigated attacks, mainly in the Asia-Pacific region and a few in South Africa, Europe and North America, that use a BadIIS variant marked by "demo.pdb" strings, which it
    assesses with moderate confidence is commodity malware sold privately or shared among several Chinese-speaking cybercrime groups under a malware-as-a-service model (
