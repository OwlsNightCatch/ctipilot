  entry: 2026-05-20/cve-2026-31635-dirtydecrypt-linux-kernel-rxgk-page-cache-wri
  surface: summary
  kind: frontmatter
  text: V12 and Zellic, and separately Delphos Labs, reported DirtyDecrypt (also DirtyCBC), a page-cache write from a missing copy-on-write guard in the Linux kernel's rxgk_decrypt_skb() that lets a local
    user gain root, and a working proof of concept was public by 2026-05-18; maintainers said it duplicated a flaw already fixed in mainline. Will Dormann and the NVD record tie it to CVE-2026-31635, which
    the kernel's numbering authority describes as an inverted RESPONSE authenticator length check scored 7.5 for denial of service, fixed in 6.18.23, 6.19.13 and 7.0; only kernels built with CONFIG_RXGK,
    as on Fedora, Arch Linux and openSUSE Tumbleweed, are exposed.
