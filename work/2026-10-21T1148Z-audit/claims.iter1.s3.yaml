- claim_id: 4c35fdd1e9
  entry: 2026-05-20/cisco-talos-demo-pdb-badiis-variant-now-a-commodity-maas-iis
  surface: body
  kind: cited
  text: Service-based installers from the same author impersonate Windows services such as Winlogin, FaxService or AudiosService, authenticate to a C2 server, download further payloads, hide their command
    lines with custom Base64 and register the BadIIS DLL in the globalModules and modules sections of the IIS configuration, and the latest copies the DLL to a hidden backup location so it is restored every
    time IIS restarts (
  urls:
  - https://blog.talosintelligence.com/from-pdb-strings-to-maas-tracking-a-commodity-badiis-ecosystem/
