  text: MiniPlasma revived Windows Cloud Files flaw CVE-2020-17103 for a SYSTEM shell; Microsoft's June 2026 updates fix it
- claim_id: 1d462f2c3f
  entry: 2026-05-19/chaotic-eclipse-windows-zero-days-miniplasma-is-third-poc-in
  surface: summary
  kind: frontmatter
  text: The researcher Chaotic Eclipse (also Nightmare Eclipse) released MiniPlasma on 2026-05-17, an exploit for the HsmOsBlockPlaceholderAccess routine of the Windows Cloud Files Mini Filter Driver (cldflt.sys),
    the flaw Google Project Zero reported in 2020 as CVE-2020-17103, which opened a SYSTEM command prompt from a standard user on Windows 11 with the May 2026 updates; BleepingComputer and Will Dormann
    reproduced it. Microsoft re-released CVE-2020-17103 on 2026-06-09 and recommends the June 2026 Windows updates to address MiniPlasma; it scores the flaw CVSS 3.1 7.0 and lists it as not exploited.
