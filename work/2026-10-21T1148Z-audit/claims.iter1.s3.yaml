  text: 'Cisco Talos: commodity "demo.pdb" BadIIS module for SEO fraud survives IIS restarts through a hidden backup copy'
- claim_id: 5d65a38119
  entry: 2026-05-20/cisco-talos-demo-pdb-badiis-variant-now-a-commodity-maas-iis
  surface: summary
  kind: frontmatter
  text: Cisco Talos reported on 2026-05-19 that a BadIIS variant marked by "demo.pdb" strings, seen since 2024 mainly in the Asia-Pacific region and in a few cases in South Africa, Europe and North America,
    is commodity malware likely sold or shared among Chinese-speaking cybercrime groups, configured with a recovered builder for visitor redirection, crawler reverse proxying, content hijacking and backlink
    injection. Its installers register the malicious DLL in the IIS server module list, run as services impersonating Windows ones and keep a hidden backup copy that restores it on every IIS restart; Talos
    ties development since at least September 2021 to the alias "lwxat".
