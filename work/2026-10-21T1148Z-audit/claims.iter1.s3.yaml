  entry: 2026-05-21/webworm-china-aligned-shifts-to-eu-government-targets-echocr
  surface: summary
  kind: frontmatter
  text: 'ESET reported on 2026-05-20 that the China-aligned group Webworm targeted governmental organizations in Belgium, Italy, Serbia and Poland, and a South African university, in 2025 with two new backdoors:
    EchoCreep, written in Go, which takes commands through Discord, and GraphWorm, which uses Microsoft Graph and OneDrive for command and control. A compromised third-party Amazon S3 bucket held its proxy
    configurations and files taken from Italian and Spanish governmental entities; ESET could not find the entry point, but the group scanned victims'' web servers and ran a public SquirrelMail exploit
    (CVE-2017-7692) against a Serbian webmail target.'
