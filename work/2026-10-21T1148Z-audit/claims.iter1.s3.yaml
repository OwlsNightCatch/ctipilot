  entry: 2026-05-21/verizon-2026-dbir-vulnerability-exploitation-overtakes-crede
  surface: summary
  kind: frontmatter
  text: Verizon's 2026 Data Breach Investigations Report, published on 2026-05-19 and built on more than 31,000 incidents and 22,000 confirmed breaches from November 2024 to October 2025, finds vulnerability
    exploitation at 31% of initial access, up from 20%, ahead of credential abuse at 13%. Only 26% of KEV-listed vulnerabilities were fully remediated in 2025 (38% the year before), median time to full
    patching rose from 32 to 43 days, and breaches involving a third party rose 60% to 48% of all breaches.
