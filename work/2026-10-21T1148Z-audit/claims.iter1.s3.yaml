  text: Patched SonicWall Gen6 SSL-VPNs still let brute-forced accounts skip MFA unless the LDAP fix is redone by hand
- claim_id: 09f02a5487
  entry: 2026-05-21/sonicwall-gen6-ssl-vpn-incomplete-patching-cve-2024-12802-ak
  surface: summary
  kind: frontmatter
  text: ReliaQuest reported on 2026-05-19 that between February and March 2026 an attacker brute-forced SonicWall Gen6 SSL-VPN accounts and bypassed MFA through CVE-2024-12802 on appliances running fixed
    firmware, because the manual LDAP remediation steps had not been done; it assesses this with medium confidence as the first in-the-wild exploitation, by a likely initial access broker using tools of
    the ransomware ecosystem. SonicWall scores the flaw CVSS 6.5 (CISA's ADP 9.1); Gen7 and Gen8 are fixed by firmware, while Gen6, end-of-life since 2026-04-16, needs a six-step LDAP reconfiguration.
