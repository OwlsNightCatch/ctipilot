- claim_id: 255e4bc5ed
  entry: 2026-05-21/pintheft-linux-kernel-local-privilege-escalation-primitive-r
  surface: summary
  kind: frontmatter
  text: 'V12 Security released PinTheft and a working exploit on 2026-05-19, relayed to oss-security by Gentoo''s Sam James: a double-free in the Linux kernel''s RDS zerocopy send path, rds_message_zcopy_from_user(),
    that the exploit turns into a page-cache overwrite of a SUID-root binary through io_uring fixed buffers for a root shell. The bug was patched upstream earlier in May and the kernel fix was published
    as CVE-2026-43494 (CVSS 7.8) on 2026-05-21; exploitation needs the RDS modules, which V12 found loaded by default only on Arch Linux among common distributions.'
