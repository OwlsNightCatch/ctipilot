  entry: 2026-05-20/cisco-talos-demo-pdb-badiis-variant-now-a-commodity-maas-iis
  surface: body
  kind: cited
  text: Talos ties development from at least September 2021 to January 2026, including a build to bypass Norton, to the alias "lwxat" with moderate-to-high confidence, from the builder's authentication
