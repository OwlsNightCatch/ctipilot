  entry: 2026-05-20/cisco-talos-demo-pdb-badiis-variant-now-a-commodity-maas-iis
  surface: body
  kind: cited
  text: The BadIIS variants of the DragonRank and UAT-8099 groups Talos documented before relied on hardcoded C2 and statically compiled payloads, whereas this variant is configured with a recovered builder
    that injects parameters for JavaScript redirection of visitors to illicit sites, reverse proxying of illicit content to search-engine crawlers, site-wide content hijacking and backlink injection, and
    that encodes the C2 address with single-byte XOR (
  urls:
