  text: Lumen confirms an Afghanistan-based ISP and an entity in Azerbaijan as Showboat victims, calls the US cases potential and ties the Ukrainian traffic to a separate cluster, and no source places European
    telecoms in the targeting. Showboat is not shown masquerading as a kernel worker (kworker is PwC's name for it), the campaign dates from mid-2022 while PwC has tracked Red Lamassu since 2019, and JFMBackdoor's
    capabilities, the certificate clustering and the side-loading mapping are stated as the sources give them, with exposure, detection and takeaway guidance added.
