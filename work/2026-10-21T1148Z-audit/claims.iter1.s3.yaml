- claim_id: e82dbad867
  entry: 2026-05-20/drupal-core-highly-critical-pre-patch-warning-unauthenticate
  surface: summary
  kind: frontmatter
  text: Drupal's SA-CORE-2026-004 (2026-05-20), pre-announced in PSA-2026-05-18, fixes CVE-2026-9082, an anonymous SQL injection in Drupal core's database abstraction API that affects only sites using PostgreSQL
    and can lead to information disclosure and in some cases privilege escalation or remote code execution. Drupal confirmed exploit attempts in the wild on 2026-05-22, raising its risk score from 20 to
    23 of 25, and CISA added the flaw to its KEV catalog the same day; the fixed releases are 11.3.10, 11.2.12, 11.1.10, 10.6.9, 10.5.10 and 10.4.10.
