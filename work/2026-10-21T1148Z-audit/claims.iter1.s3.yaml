  entry: 2026-05-21/keycloak-26-6-2-16-cves-including-oidc-session-fixation-cve
  surface: summary
  kind: frontmatter
  text: Keycloak 26.6.2, released on 2026-05-19, fixes 16 security issues carrying 18 CVE ids. CVE-2026-7507 (CVSS 7.5, which Red Hat calls critical) lets an unauthenticated attacker pre-create an authentication
    session and take over a victim's account through a crafted /login-actions/restart link, up to the master-realm admin account in default deployments; CVE-2026-37982 lets an intercepted execute-actions
    e-mail link register the attacker's WebAuthn authenticator. Red Hat build of Keycloak fixes them in 26.2.16 and 26.4.12, and BSI rates its nine-CVE advisory high.
