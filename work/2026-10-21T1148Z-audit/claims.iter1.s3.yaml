  kind: cited
  text: 'SonicWall''s SNWLID-2025-0001 describes CVE-2024-12802 (CWE-305, CVSS 6.5): when SSL-VPN authenticates against Microsoft Active Directory, UPN and SAM account names are handled separately, so MFA
    can be configured independently for each and an attacker can bypass it through the alternative account name ('
