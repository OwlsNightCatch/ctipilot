        basis: "GTIG original research (Mandiant IR, Gemini abuse telemetry, proactive research); The Hacker News, Help Net Security, SecurityWeek and The Register restate GTIG: one assessor. PROMPTSPY was first reported by ESET (Android, outside the pinned enterprise matrix)."
