  - claim_id: 5f668e7304
    entry: 2026-05-13/cve-2026-45185-exim-dead-letter-use-after-free-in-bdat-chunk
    surface: "body"
    kind: cited
    text: "XBOW disclosed CVE-2026-45185 on 2026-05-12 after a coordinated-disclosure window with Exim maintainers, Linux distros and CVE authorities that began 2026-05-01 ("
    urls: ["https://xbow.com/blog/dead-letter-cve-2026-45185-xbow-found-rce-exim", "https://www.openwall.com/lists/oss-security/2026/05/12/4", "https://thehackernews.com/2026/05/new-exim-bdat-vulnerability-exposes.html"]
  - claim_id: 844bd2ec3a
    entry: 2026-05-13/cve-2026-45185-exim-dead-letter-use-after-free-in-bdat-chunk
    surface: "body"
    kind: uncited
    text: "The bug is a use-after-free (CWE-416) in Exim's BDAT (RFC 3030 CHUNKING) body-parser when the binary was built with GnuTLS (`USE_GNUTLS=yes`) — the default on Debian and Ubuntu packages."
  - claim_id: db9ca75f97
    entry: 2026-05-13/cve-2026-45185-exim-dead-letter-use-after-free-in-bdat-chunk
    surface: "body"
    kind: uncited
    text: "OpenSSL builds are unaffected."
  - claim_id: 4fc4459d1f
    entry: 2026-05-13/cve-2026-45185-exim-dead-letter-use-after-free-in-bdat-chunk
    surface: "body"
    kind: uncited
    text: "The trigger: an SMTP client sends a TLS `close_notify` mid-BDAT body, then one final cleartext byte on the same TCP connection."
  - claim_id: acf3d9e3f1
    entry: 2026-05-13/cve-2026-45185-exim-dead-letter-use-after-free-in-bdat-chunk
    surface: "body"
    kind: uncited
    text: "Exim's `xfer_buffer` has already been freed in `tls_close()`, but the BDAT `lwr_receive_*` function pointers remain live and `tls_ungetc()` writes a single `\\n` byte into the freed region."
  - claim_id: 0392864acb
    entry: 2026-05-13/cve-2026-45185-exim-dead-letter-use-after-free-in-bdat-chunk
    surface: "body"
    kind: uncited
    text: "XBOW's AI-driven exploitation (within the seven-day disclosure window) produced two working chains under ASLR: a largebin-corruption → `FILE` struct hijack chain on No-PIE builds, and a `storeblock` length-inflation → bump-pointer corruption → `${run}` ACL execution chain on PIE builds."
  - claim_id: 9f55df03b9
    entry: 2026-05-13/cve-2026-45185-exim-dead-letter-use-after-free-in-bdat-chunk
    surface: "body"
    kind: uncited
    text: "No authentication is required; the CHUNKING extension is default-on."
