    text: "CVE-2026-45185 — Exim \"Dead.Letter\" use-after-free in BDAT/CHUNKING on GnuTLS builds"
  - claim_id: bc166bb249
    entry: 2026-05-13/cve-2026-45185-exim-dead-letter-use-after-free-in-bdat-chunk
    surface: "summary"
    kind: frontmatter
    text: "Exim \"Dead.Letter\" pre-auth RCE on the default Debian/Ubuntu MTA. CVE-2026-45185 (CVSS 9.8) is a use-after-free in the BDAT/CHUNKING body-parsing path triggered when a client sends TLS close_notify mid-body and then one cleartext byte on the same TCP connection. GnuTLS builds only (the distro default); OpenSSL builds unaffected. CHUNKING extension is default-on. Fixed in Exim 4.99.3 (XBOW research, 2026-05-12; oss-security, 2026-05-12)."
  - claim_id: f8e245c8a3
    entry: 2026-05-13/cve-2026-45185-exim-dead-letter-use-after-free-in-bdat-chunk
