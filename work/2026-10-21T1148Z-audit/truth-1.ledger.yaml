    entry: 2026-05-13/cve-2026-45185-exim-dead-letter-use-after-free-in-bdat-chunk
    surface: "body"
    kind: uncited
    text: "No public exploitation reported at disclosure, but exim.org is the dominant MTA on the public internet and the GnuTLS default on Debian / Ubuntu maps directly to the typical EU university, academic-research and small-government mail-relay estate."
  - claim_id: b5edf93b54
    entry: 2026-05-13/cve-2026-45185-exim-dead-letter-use-after-free-in-bdat-chunk
    surface: "body"
    kind: uncited
    text: "Detection / hunt concepts mapped to `T1190 Exploit Public-Facing Application` and `T1499.004 Endpoint Denial of Service: Application or System Exploitation`: monitor `exim` `panic.log` for `tls_ungetc` traces and segfaults under non-zero load; egress-monitor any outbound TCP from the MTA host that does not match the usual upstream-relay set; on Debian / Ubuntu, audit `exim -bV | grep GnuTLS` per host."
