    entry: 2026-05-13/cve-2026-34263-cve-2026-34260-sap-commerce-cloud-pre-auth-rc
    surface: "summary"
    kind: frontmatter
    text: "SAP Commerce Cloud pre-auth RCE plus S/4HANA Enterprise Search SQLi. CVE-2026-34263 (CVSS 9.6) is unauthenticated arbitrary code injection via overly permissive Spring Security ordering on the cloud-config endpoint; CVE-2026-34260 (CVSS 9.6) is post-auth SQL injection in the Enterprise Search ABAP component — enabled by default. SAP Commerce and S/4HANA are core to Swiss federal procurement (NOVE/SUPERB programmes) and EU institutional ERP (Onapsis, 2026-05-12; SecurityWeek, 2026-05-12)."
  - claim_id: 2c37eb0b28
