    text: "Bitdefender gives Azerbaijan's European gas role as context that does not establish motive and attributes the intrusion to the China-nexus FamousSparrow cluster with moderate-to-high confidence, not to Chinese state actors as fact. The sideload is an evolved technique closely matching a Deed RAT loader Trend Micro documented for Earth Estries, the second wave's TernDoor installation was blocked before it completed, and the re-entries came through the same still-vulnerable Exchange server rather than through surviving persistence. Microsoft says ProxyNotShell requires authentication, while Bitdefender calls it unauthenticated."
