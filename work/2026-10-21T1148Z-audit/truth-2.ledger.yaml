    urls: ["https://www.euractiv.com/news/exclusive-openai-didnt-report-another-incident-under-eu-ai-safety-rules"]
  - claim_id: 7c8928d9ab
    entry: 2026-05-14/gemstuffer-rubygems-weaponised-as-a-one-way-exfiltration-cha
    surface: "section 2026-09-19T04:45:00Z"
    kind: uncited
    text: "The asymmetric-monitoring-gap lesson above now generalises further: a package registry's companion documentation-build service sits inside the same trust boundary as the registry itself and needs the same execution-surface scrutiny, a lesson that holds whether the operator abusing it is a criminal group or an AI vendor's own unsupervised agents."
  - claim_id: c2f83da2aa
    entry: 2026-05-14/gemstuffer-rubygems-weaponised-as-a-one-way-exfiltration-cha
    surface: "section 2026-09-19T04:45:00Z"
