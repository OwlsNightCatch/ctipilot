  - claim_id: c112865dc3
    entry: 2026-05-14/dutch-igj-rules-clinical-diagnostics-nmdl-failed-nen-7510-in
    surface: "summary"
    kind: frontmatter
    text: "Dutch IGJ rules Clinical Diagnostics/NMDL failed mandatory NEN 7510 information-security standard at time of July 2025 ransomware breach. The Dutch Health & Youth Care Inspectorate's 2026-05-13 finding cites two specific failures: no independent information-security audit, and no periodic processing-risk assessments — meaning the laboratory could not determine which controls were required. The breach exposed approximately 941,000 patients' records, including results of the national cervical-cancer screening programme (Bevolkingsonderzoek Nederland). IGJ has no fining power but has demanded independent certification and signalled sector-wide enforcement; Autoriteit Persoonsgegevens (AP) holds a parallel GDPR investigation that can. NEN 7510 (Dutch healthcare security baseline) is the structural analogue of Switzerland's EPDG security profile — same gap, same regulator pattern (IGJ, 2026-05-13; Computable, 2026-05-13)."
  - claim_id: 3d83536bea
    entry: 2026-05-14/dutch-igj-rules-clinical-diagnostics-nmdl-failed-nen-7510-in
    surface: "body"
    kind: cited
    text: "The Dutch Health & Youth Care Inspectorate (Inspectie Gezondheidszorg en Jeugd, IGJ) issued a public finding on 2026-05-13 concluding that Clinical Diagnostics LCPL BV and NMDL BV (Rijswijk) did not meet the mandatory NEN 7510 information-security standard at the time of their July 2025 ransomware breach, and had not fully remediated the deficiencies as of IGJ's December 2025 follow-up inspection ("
    urls: ["https://www.igj.nl/actueel/nieuws/2026/05/13/clinical-diagnostics-voldeed-niet-aan-wettelijke-norm-voor-informatiebeveiliging"]
  - claim_id: 11663a446b
    entry: 2026-05-14/dutch-igj-rules-clinical-diagnostics-nmdl-failed-nen-7510-in
    surface: "body"
    kind: cited
    text: "The July 2025 breach — Computable's prior reporting attributes it to the Nova ransomware group — exposed approximately 941,000 patients' personal and medical records, including cervical-cancer screening results processed for the population-screening programme Bevolkingsonderzoek Nederland ("
    urls: ["https://www.computable.nl/2026/05/13/inspectie-vernietigend-over-beveiliging-clinical-diagnostics-na-datahack/"]
  - claim_id: e3fd4411e6
    entry: 2026-05-14/dutch-igj-rules-clinical-diagnostics-nmdl-failed-nen-7510-in
    surface: "body"
    kind: uncited
    text: "NEN 7510 is the Dutch statutory information-security baseline for healthcare organisations under the Wabvpz, structurally aligned with ISO/IEC 27001 but extended for health-data obligations; non-compliance is independently actionable by multiple regulators."
  - claim_id: 81ad174473
    entry: 2026-05-14/dutch-igj-rules-clinical-diagnostics-nmdl-failed-nen-7510-in
    surface: "body"
    kind: uncited
    text: "IGJ's two named failures are foundational rather than technical: (1) no independent audit of the laboratory's information security had ever been performed, and (2) the organisation had not periodically assessed its processing risks, leaving it unable to determine which controls were necessary."
