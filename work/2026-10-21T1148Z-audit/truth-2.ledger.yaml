    entry: 2026-05-13/mini-shai-hulud-s-github-actions-pwn-request-oidc-token-thef
    surface: "body"
    kind: uncited
    text: "This is the most significant evolution: SLSA L3 was the assurance many EU procurement frameworks were starting to demand; this campaign demonstrates it is forgeable when an attacker controls *any* step in the workflow chain that produces the artefact, not just the publish step."
  - claim_id: 4840b6a62f
