    text: "The ten questions interrogate (a) **process prerequisites** — is there a triage / remediation pipeline that can absorb what the AI surfaces, or will the backlog simply grow while team capacity stays flat; (b) **data governance** — what code, infrastructure and secrets is the model being given access to; (c) **infrastructure security** — is the AI agent sandboxed from production; (d) **permissions blast-radius** — has the model been granted excessive permissions that magnify attacker reach if the agent itself is compromised; (e) legal / data-retention; (f) false-positive overhead on the blue team."
