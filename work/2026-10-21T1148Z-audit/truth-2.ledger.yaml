    text: "**What detection looks like.** No IOCs in this brief; the behaviour patterns to alert on are the durable signals: - **CI/CD telemetry:** any GitHub Actions workflow run triggered by `pull_request_target` that wrote to the Actions cache and was not initiated by a trusted contributor."
