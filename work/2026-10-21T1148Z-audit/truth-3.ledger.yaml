    entry: 2026-05-17/kaspersky-great-documents-kimsuky-s-rust-based-hellodoor-and
    surface: "actions[0]"
    kind: frontmatter
    text: "**Hunt for Kimsuky's TryCloudflare-tunnel C2 pattern on government / defence / healthcare endpoints.** Alert on outbound `*.trycloudflare.com` connections that don't correlate with a developer's legitimate Cloudflare-tunnel usage profile; review VSCode tunnel authentications via GitHub for unrecognised tunnel names; flag Rust-compiled PE images loading from non-standard paths. The German targeting documented in Kaspersky's report is the closest geographic-proximity Kimsuky signal to Swiss government estate in recent reporting. Reference: § 3 Kimsuky item."
