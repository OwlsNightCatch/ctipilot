    text: "The most operationally significant capability change is that HelloDoor's C2 channel uses **Cloudflare Quick Tunnels via TryCloudflare** — short-lived `*.trycloudflare.com` hostnames issued ad-hoc, terminating attacker control infrastructure behind Cloudflare's CDN, eliminating fixed C2 IPs and making network-layer indicator blocking impractical."
