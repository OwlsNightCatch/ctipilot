    surface: "body"
    kind: uncited
    text: "Talos recovered a dedicated **builder tool** that lets operators generate configuration files and inject parameters into BadIIS ISAPI DLL payloads — traffic redirection to illicit sites, search-engine-crawler proxying, content hijacking, and back-link injection for SEO-fraud monetisation."
