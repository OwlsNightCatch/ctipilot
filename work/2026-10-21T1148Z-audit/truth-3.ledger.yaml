    surface: "body"
    kind: cited
    text: "7-Eleven, Inc. confirmed on 2026-05-18 that an unauthorised third party accessed systems storing franchisee documents on 2026-04-08, in a breach claimed by ShinyHunters on or around 2026-04-17 ("
    urls: ["https://www.securityweek.com/7-eleven-data-breach-confirmed-after-shinyhunters-ransom-demand/", "https://securityaffairs.com/192336/data-breach/shinyhunters-hack-7-eleven-franchisee-data-and-salesforce-records-exposed.html"]
