  - claim_id: 9dea88322d
    entry: 2026-05-16/bka-arrests-dream-market-lead-administrator-speedstepper-in
    surface: "body"
    kind: uncited
    text: "A US federal grand jury in the Northern District of Georgia had returned a sealed indictment on 2026-01-13 charging Andresen with six counts of international concealment money laundering and six counts of concealment money laundering (240 years aggregate maximum); German charges carry up to five years."
  - claim_id: 31b6b4932b
    entry: 2026-05-16/bka-arrests-dream-market-lead-administrator-speedstepper-in
    surface: "body"
    kind: uncited
    text: "The OPSEC failures that closed the seven-year gap were operational, not technical: in late 2022 Andresen allegedly accessed Dream Market's dormant cryptocurrency wallets — an action only the holder of the original private keys could perform — and consolidated the contents into a single wallet, providing prosecutors with a definitive on-chain link; and in August 2023 he used an Atlanta-based cryptocurrency-to-physical-asset service to purchase gold bars that were shipped directly to his home address in Germany, providing the geographic and identity link."
