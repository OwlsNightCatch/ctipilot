    entry: 2026-05-19/7-eleven-confirms-shinyhunters-breach-of-600-000-salesforce
    surface: "section 2026-05-25T05:00:03Z"
    kind: uncited
    text: "By our own campaign tracking Charter is the first telco/ISP victim of this wave to respond publicly — an inference from the prior named victims (Instructure, Vimeo, Wynn, Vercel, Medtronic, 7-Eleven), none of them telcos, rather than a claim made by the cited sources."
  - claim_id: 3a2534838f
