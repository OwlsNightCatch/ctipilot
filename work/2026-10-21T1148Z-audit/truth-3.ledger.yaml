    text: "Tycoon2FA after the March 2026 takedown — OAuth Device Authorization Grant abuse on Microsoft 365"
  - claim_id: b059ce21b9
    entry: 2026-05-18/tycoon2fa-after-the-march-2026-takedown-oauth-device-authori
    surface: "summary"
    kind: frontmatter
    text: "Tycoon2FA PhaaS pivots from credential-relay AiTM to OAuth 2.0 Device Authorization Grant abuse against Microsoft 365. Victims paste an attacker-supplied device code into the legitimate microsoft.com/devicelogin endpoint; MFA succeeds on the real Microsoft endpoint and tokens are issued to the attacker's registered device. eSentire documented the campaign with a four-layer browser chain ending in a fake Microsoft CAPTCHA (BleepingComputer, 2026-05-17; eSentire TRU, 2026-05-12)."
  - claim_id: 3d7a707228
    entry: 2026-05-18/tycoon2fa-after-the-march-2026-takedown-oauth-device-authori
    surface: "body"
    kind: cited
    text: "Tycoon2FA is one of the established Microsoft 365 Phishing-as-a-Service (PhaaS) kits, previously documented as a classic adversary-in-the-middle (AiTM) credential-relay kit ("
    urls: ["https://blog.sekoia.io/tycoon-2fa-an-in-depth-analysis-of-the-latest-version-of-the-aitm-phishing-kit/"]
  - claim_id: 52d5e580ae
    entry: 2026-05-18/tycoon2fa-after-the-march-2026-takedown-oauth-device-authori
    surface: "body"
    kind: cited
    text: "catalogued earlier versions of the kit). eSentire's Threat Response Unit documented a late-April 2026 campaign in which the kit's operators have moved away from credential-relay AiTM and are now abusing the legitimate OAuth 2.0 Device Authorization Grant flow as their post-MFA token-theft primitive ("
    urls: ["https://www.esentire.com/blog/tycoon-2fa-operators-adopt-oauth-device-code-phishing", "https://www.bleepingcomputer.com/news/security/tycoon2fa-hijacks-microsoft-365-accounts-via-device-code-phishing/"]
  - claim_id: 0f4600fd53
    entry: 2026-05-18/tycoon2fa-after-the-march-2026-takedown-oauth-device-authori
    surface: "body"
    kind: cited
    text: "The code is a real device code that the attacker pre-generated by calling the OAuth Device Authorization Grant endpoint (`/oauth2/v2.0/devicecode`) on the victim's tenant, presenting itself as the"
    urls: ["https://learn.microsoft.com/en-us/entra/identity-platform/v2-oauth2-device-code"]
  - claim_id: 9ec44a41bb
    entry: 2026-05-18/tycoon2fa-after-the-march-2026-takedown-oauth-device-authori
