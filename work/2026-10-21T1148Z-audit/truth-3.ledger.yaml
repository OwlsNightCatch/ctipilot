  - claim_id: dd5324ba7b
    entry: 2026-05-19/chaotic-eclipse-windows-zero-days-miniplasma-is-third-poc-in
    surface: "body"
    kind: uncited
    text: "Defender takeaway: the proliferation of unpatched LPEs from one researcher signals an extended period of `SYSTEM`-shell availability for any attacker that lands user-level execution on Windows endpoints."
