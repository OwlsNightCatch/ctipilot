    surface: "body"
    kind: uncited
    text: "The material new technical detail: MiniPlasma targets the `cldflt.sys` Cloud Filter Mini Filter Driver — specifically the `HsmOsBlockPlaceholderAccess` routine — and abuses the undocumented `CfAbortHydration` API to create arbitrary registry keys in the `.DEFAULT` user hive without proper ACL checks, escalating from standard user to SYSTEM."
