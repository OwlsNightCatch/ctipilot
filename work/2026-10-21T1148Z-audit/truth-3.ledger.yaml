    surface: "body"
    kind: cited
    text: "**Hardening.**"
    urls: ["https://learn.microsoft.com/en-us/entra/identity/conditional-access/policy-block-authentication-flows"]
  - claim_id: d3602887ee
    entry: 2026-05-18/tycoon2fa-after-the-march-2026-takedown-oauth-device-authori
    surface: "body"
    kind: uncited
    text: "The substantive defender consequence is that the new chain runs against Microsoft's own authentication endpoints rather than against a credential-relay proxy the defender could block at the infrastructure layer; the abuse is structurally indistinguishable from a legitimate device-code sign-in until the resulting token is used."
  - claim_id: f6efd348ff
    entry: 2026-05-18/tycoon2fa-after-the-march-2026-takedown-oauth-device-authori
    surface: "body"
    kind: uncited
    text: "**Attack chain.** A phishing email directs the victim through a four-layer browser chain documented by eSentire: a Trustifi click-tracking redirect (legitimate-email-marketing infrastructure, abused for reputation laundering) hands off to a Cloudflare Workers throwaway subdomain whose stage performs anti-analysis fingerprinting, AES-GCM-encrypted JavaScript decrypts the next stage only when the browser fingerprint clears, and finally the victim lands on a fake Microsoft CAPTCHA / \"Check Domain\" page that bridges into the OAuth device-code lure. eSentire records the underlying hosting ASN rotated to AS45102 (Alibaba Cloud) from 2026-04-10 onward, replacing previously documented ASNs."
  - claim_id: 22c39798df
    entry: 2026-05-18/tycoon2fa-after-the-march-2026-takedown-oauth-device-authori
    surface: "body"
    kind: uncited
    text: "The terminal step is the technique pivot: instead of relaying credentials through an AiTM proxy, the phishing site displays a Microsoft-branded prompt instructing the victim to *\"complete sign-in by visiting `microsoft.com/devicelogin` and entering this code: AB12-CDEF\"*."
  - claim_id: 9568112988
    entry: 2026-05-18/tycoon2fa-after-the-march-2026-takedown-oauth-device-authori
    surface: "body"
    kind: uncited
    text: "When the victim completes the device-code login in their browser they are authenticating to genuine Microsoft endpoints, MFA fires and succeeds against the victim's own MFA method (push, OTP, SMS) — and the resulting access and refresh tokens are issued to the attacker's polling device, not the victim."
  - claim_id: cf62852a6f
    entry: 2026-05-18/tycoon2fa-after-the-march-2026-takedown-oauth-device-authori
    surface: "body"
    kind: uncited
    text: "Entra ID sign-in logs record this as `AuthenticationProtocol = deviceCode` originating from an unfamiliar IP, but the actual authentication is logged as successful with valid MFA, masking the abuse."
  - claim_id: 71ee1a5533
    entry: 2026-05-18/tycoon2fa-after-the-march-2026-takedown-oauth-device-authori
    surface: "body"
    kind: uncited
    text: "MFA bypass is structural here — Tycoon2FA does not break MFA; it sidesteps it by binding the MFA-validated session to an attacker-owned device through the legitimate OAuth flow."
  - claim_id: 4b18651d00
    entry: 2026-05-18/tycoon2fa-after-the-march-2026-takedown-oauth-device-authori
    surface: "body"
    kind: uncited
    text: "Every MFA method except FIDO2 / WebAuthn with phishing-resistant attestation is vulnerable to this attack class because the victim approves an MFA prompt on a flow the kit chose, not the flow the victim believes they are completing."
  - claim_id: b91de0873a
    entry: 2026-05-18/tycoon2fa-after-the-march-2026-takedown-oauth-device-authori
    surface: "body"
    kind: uncited
    text: "**Hunt / detection concepts.** Per eSentire's TRU analysis: query Entra ID sign-in logs for `AuthenticationProtocol = \"deviceCode\"` paired with `ClientAppUsed = \"Microsoft Authentication Broker\"` from IPs the user has never authenticated from previously; alert on any device-code authentication from foreign ASNs against high-privilege users (Global Admins, Privileged Role Admins, Compliance Admins) regardless of MFA outcome; correlate device-code sign-ins with Entra audit-log entries showing immediate token-refresh activity against Exchange Online or SharePoint endpoints (`Add OAuth2PermissionGrant`); on the email layer hunt for inbound mail containing the literal string `microsoft.com/devicelogin` paired with a device-code-shaped substring (eight alphanumerics with a hyphen at the midpoint) in the body — legitimate Microsoft messaging almost never instructs an end user to enter such a code in response to an email."
  - claim_id: 8b498b73db
    entry: 2026-05-18/tycoon2fa-after-the-march-2026-takedown-oauth-device-authori
    surface: "body"
    kind: uncited
    text: "Kit-fingerprint detection (useful when investigating a confirmed campaign): the Tycoon2FA browser stage retains the hardcoded CryptoJS AES-CBC key `1234567890123456` first documented in the kit's 2024 build, and the fake CAPTCHA layer still embeds the same Cloudflare-anti-bot bypass JavaScript across the rebuilt infrastructure."
  - claim_id: 2e502e4961
    entry: 2026-05-18/tycoon2fa-after-the-march-2026-takedown-oauth-device-authori
    surface: "body"
    kind: uncited
    text: "Where a wholesale block is operationally infeasible, scope the block to all licensed user accounts and exempt only the named service principals that require it."
  - claim_id: 36a28a24a8
    entry: 2026-05-18/tycoon2fa-after-the-march-2026-takedown-oauth-device-authori
    surface: "body"
    kind: uncited
    text: "Enable Continuous Access Evaluation (CAE) so that anomaly-driven sign-in revocation can cut an attacker's session within minutes rather than hours."
  - claim_id: e859783d65
    entry: 2026-05-18/tycoon2fa-after-the-march-2026-takedown-oauth-device-authori
    surface: "body"
    kind: uncited
    text: "Migrate high-privilege users to FIDO2 / WebAuthn with phishing-resistant attestation as their only permitted MFA method — the device-code flow can still be initiated, but the attacker cannot complete it because the FIDO2 origin-binding fails on a non-matching browser session."
  - claim_id: 05789d9000
    entry: 2026-05-18/tycoon2fa-after-the-march-2026-takedown-oauth-device-authori
    surface: "body"
    kind: uncited
    text: "Awareness messaging should make explicit that Microsoft never sends device codes via email and that any incoming message asking the recipient to enter a code at `microsoft.com/devicelogin` is fraudulent regardless of the apparent sender."
