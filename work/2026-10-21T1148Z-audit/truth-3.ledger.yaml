  - claim_id: 72e57d8210
    entry: 2026-05-16/cve-2026-44112-cve-2026-44113-cve-2026-44115-cve-2026-44118
    surface: "summary"
    kind: frontmatter
    text: "Cyera Research discloses OpenClaw \"Claw Chain\" — four chainable vulnerabilities (CVE-2026-44112 CVSS 9.6 / CVE-2026-44115 8.8 / CVE-2026-44118 7.8 / CVE-2026-44113 7.7) in the autonomous-agent platform enabling sandbox escape → credential leak → privilege escalation → file disclosure; ~245 K publicly accessible instances; fixed by the 2026-04-23 OpenClaw release (GHSA-5h3g-6xhh-rg6p / wppj-c6mr-83jj / r6xh-pqhr-v4xh / x3h8-jrgh-p8jx) (Cyera Research, 2026-05-15)."
  - claim_id: 247aa1045c
    entry: 2026-05-16/cve-2026-44112-cve-2026-44113-cve-2026-44115-cve-2026-44118
    surface: "actions[0]"
    kind: frontmatter
    text: "**Apply the OpenClaw / Clawdbot 2026-04-23 fixes (GHSA-5h3g-6xhh-rg6p / wppj-c6mr-83jj / r6xh-pqhr-v4xh / x3h8-jrgh-p8jx) or block OpenClaw instances from the internet; audit plugin supply chain.** The Claw Chain (CVE-2026-44112 CVSS 9.6 + CVE-2026-44115 / 44118 / 44113) requires code execution inside the sandbox boundary — but the chain's entry point (malicious plugin install, prompt injection, or supply-chain compromise of a plugin) is realistic for any environment running OpenClaw against untrusted inputs. Where the fix release cannot be deployed immediately, remove public internet exposure of the OpenClaw management interface; review installed plugins and rotate credentials accessible from the agent context."
