    surface: "body"
    kind: uncited
    text: "Talos describes the geographic distribution as primarily the **Asia-Pacific region** with a smaller number of compromised servers in South Africa, Europe, and North America; the activity overlaps with the broader **DragonRank** SEO-poisoning ecosystem Talos previously documented under the actor cluster **UAT-8099**."
  - claim_id: d1191e570c
    entry: 2026-05-20/cisco-talos-demo-pdb-badiis-variant-now-a-commodity-maas-iis
    surface: "body"
    kind: uncited
    text: "BadIIS itself is not a vulnerability — it requires a prior IIS-server compromise (web-shell, vulnerable CMS plugin) to plant the DLL."
  - claim_id: e34cdee7fd
    entry: 2026-05-20/cisco-talos-demo-pdb-badiis-variant-now-a-commodity-maas-iis
    surface: "body"
    kind: uncited
    text: "Detection concepts: enumerate `applicationHost.config` and each site's `web.config` for unexpected `<isapiFilters>` / `<httpModules>` entries; alert on IIS worker (`w3wp.exe`) loading DLLs from non-standard paths (Sysmon EID 7); monitor IIS response-body sizes for anomalies on content that should be static; alert on `w3wp.exe` initiating outbound HTTP to non-allow-listed destinations."
  - claim_id: 304c082fc2
    entry: 2026-05-20/cisco-talos-demo-pdb-badiis-variant-now-a-commodity-maas-iis
    surface: "body"
    kind: uncited
