    entry: 2026-05-19/7-eleven-confirms-shinyhunters-breach-of-600-000-salesforce
    surface: "body"
    kind: uncited
    text: "The campaign vector is identity-side rather than Salesforce-product-side — Connected App OAuth grant abuse, phishing of admin sessions, mis-scoped third-party SaaS integrations."
  - claim_id: 805ee74e8e
