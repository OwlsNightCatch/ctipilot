    text: "**Apply the F5 BIG-IP / BIG-IQ May 2026 Quarterly Notification across all internet-or-management-network-reachable F5 appliances** within standard change windows, and rotate every Manager-role iControl REST credential at the same time. CVE-2026-41225 is post-auth Manager-role only, but the practical attack chain is *credential theft → iControl REST object creation → shell execution*, so credential rotation is the operationally critical companion to the patch. Reference: § 2 F5 item."
