    text: "CVE-2026-46353 (CVSS 8.1) is a CWE-284 access-control bypass in the `presentationUploadExternalUrl` endpoint: by supplying specific URL parameters an attacker can bypass checksum validation and send valid API requests to restricted endpoints without proper authentication, with high confidentiality + integrity impact ("
