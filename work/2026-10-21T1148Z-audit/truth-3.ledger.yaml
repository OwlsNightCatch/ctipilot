  - claim_id: 8ec589deb4
    entry: 2026-05-17/funnelkit-funnel-builder-for-woocommerce-actively-exploited
    surface: "summary"
    kind: frontmatter
    text: "FunnelKit \"Funnel Builder for WooCommerce\" actively exploited as Magecart skimmer on 40,000+ WordPress checkout pages — no CVE assigned. Unauthenticated POST to an internal-method dispatcher writes attacker-controlled JavaScript into the plugin's External Scripts setting; a fake Google Tag Manager loader opens a WebSocket to attacker C2 and pulls a storefront-tailored card skimmer. Patched in v3.15.0.3 (Sansec, 2026-05-14)."
  - claim_id: febb5fed5f
    entry: 2026-05-17/funnelkit-funnel-builder-for-woocommerce-actively-exploited
    surface: "actions[0]"
    kind: frontmatter
    text: "**Patch FunnelKit Funnel Builder for WooCommerce to v3.15.0.3+ immediately on any operator-managed WordPress instance** and manually purge `Settings > Checkout > External Scripts`. Active exploitation across 40,000+ stores via unauthenticated checkout-endpoint injection; the WebSocket-fed skimmer is polymorphic per victim and will not be caught by static IOC matches. Reference: § 1 FunnelKit item."
  - claim_id: 4772940f26
