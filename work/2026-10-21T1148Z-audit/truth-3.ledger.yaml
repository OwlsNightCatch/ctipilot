  - claim_id: 61c5d2be2d
    entry: 2026-05-16/cve-2026-44112-cve-2026-44113-cve-2026-44115-cve-2026-44118
    surface: "body"
    kind: cited
    text: "Cyera Research published on 2026-05-15 four chained vulnerabilities in OpenClaw (also marketed as Clawdbot), an autonomous AI-agent platform released in late 2025 with integrations including Microsoft Agent 365 ("
    urls: ["https://www.cyera.com/blog/claw-chain-cyera-research-unveil-four-chainable-vulnerabilities-in-openclaw"]
  - claim_id: 318a98a3a1
    entry: 2026-05-16/cve-2026-44112-cve-2026-44113-cve-2026-44115-cve-2026-44118
    surface: "body"
    kind: uncited
    text: "All four CVEs are fixed by the OpenClaw release dated 2026-04-23, addressed under GitHub Security Advisories GHSA-5h3g-6xhh-rg6p, GHSA-wppj-c6mr-83jj, GHSA-r6xh-pqhr-v4xh, and GHSA-x3h8-jrgh-p8jx."
  - claim_id: 4590ea5daa
    entry: 2026-05-16/cve-2026-44112-cve-2026-44113-cve-2026-44115-cve-2026-44118
    surface: "body"
    kind: uncited
    text: "The defender-relevant detail is that an attacker who can obtain code execution **inside the OpenClaw managed sandbox** — achievable via a malicious plugin, prompt injection into the agent context, or supply-chain compromise of an OpenClaw plugin — can chain the four primitives to a full sandbox-escape → credential-harvest → owner-level agent control → file-disclosure sequence whose steps each mimic normal agent behaviour and so evade controls calibrated to \"human-attacker\" indicators."
  - claim_id: db4d343317
    entry: 2026-05-16/cve-2026-44112-cve-2026-44113-cve-2026-44115-cve-2026-44118
    surface: "body"
    kind: uncited
    text: "CVE-2026-44112 (CVSS 9.6, Critical) is a TOCTOU race in the OpenShell sandbox backend that lets the sandbox process win the filesystem write race and redirect writes outside the intended mount root, enabling host-filesystem tampering and persistent backdoor placement."
  - claim_id: 0e665a0ec2
    entry: 2026-05-16/cve-2026-44112-cve-2026-44113-cve-2026-44115-cve-2026-44118
    surface: "body"
    kind: uncited
    text: "CVE-2026-44115 (CVSS 8.8, High) is an incomplete allowlist in OpenClaw's command parser — shell-expansion tokens embedded in environment-variable names bypass the validation gate, leaking API keys, tokens, and credentials at execution time."
  - claim_id: 2041ef5839
    entry: 2026-05-16/cve-2026-44112-cve-2026-44113-cve-2026-44115-cve-2026-44118
    surface: "body"
    kind: uncited
    text: "CVE-2026-44118 (CVSS 7.8, High) trusts a client-controlled `senderIsOwner` flag in MCP loopback messages without validating against the authenticated session, allowing privilege escalation to owner-level agent control."
  - claim_id: 9f23fc1926
    entry: 2026-05-16/cve-2026-44112-cve-2026-44113-cve-2026-44115-cve-2026-44118
    surface: "body"
    kind: uncited
    text: "CVE-2026-44113 (CVSS 7.7, High) is the companion TOCTOU read escape enabling file disclosure outside the sandbox root."
  - claim_id: 305299c586
    entry: 2026-05-16/cve-2026-44112-cve-2026-44113-cve-2026-44115-cve-2026-44118
    surface: "body"
    kind: uncited
    text: "Exposure is broad: Cyera cites ~65 K (Shodan) and ~180 K (ZoomEye) publicly accessible OpenClaw instances as of May 2026, summing to an estimated ~245 K exposed servers."
  - claim_id: 66b31fa4b4
    entry: 2026-05-16/cve-2026-44112-cve-2026-44113-cve-2026-44115-cve-2026-44118
    surface: "body"
    kind: uncited
    text: "No in-the-wild exploitation reported at disclosure."
  - claim_id: 22c49e4131
    entry: 2026-05-16/cve-2026-44112-cve-2026-44113-cve-2026-44115-cve-2026-44118
    surface: "body"
    kind: uncited
    text: "Detection: alert on the agent process writing files outside designated sandbox mount directories; flag MCP loopback messages with `senderIsOwner=true` from sources not matching the authenticated session; alert on environment-variable expansion in command strings at agent execution time."
