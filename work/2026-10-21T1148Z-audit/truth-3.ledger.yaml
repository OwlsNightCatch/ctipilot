    kind: uncited
    text: "The vulnerable component is a publicly-exposed POST endpoint for checkout-funnel session management that fails to validate caller permissions — per The Hacker News's coverage of Sansec's research, *\"Funnel Builder includes a publicly exposed checkout endpoint that allows an incoming request to choose the type of internal method to run\"*."
