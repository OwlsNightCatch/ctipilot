    text: "CVE-2026-46351 (CVSS 8.1) is a CWE-330 weakness: the `sessionToken` is generated with insufficiently random values, letting an authenticated low-privilege attacker who shares or has observed a meeting determine other participants' session tokens and impersonate any conference user ("
