  - claim_id: 3f7dae32e0
    entry: 2026-05-17/cert-pl-cve-2026-44088-szafirhost-jar-zip-polyglot-bypass-in
    surface: "summary"
    kind: frontmatter
    text: "CERT-PL discloses CVE-2026-44088 in SzafirHost — JAR zip-polyglot bypass enables RCE in Poland's national eIDAS-recognised qualified e-signature browser helper. A class-loading split-brain between JarInputStream (verifies signature from file start) and JarFile/URLClassLoader (loads classes from ZIP Central Directory at end) lets an attacker chain a genuine signed JAR with a malicious ZIP so signature verification passes but the malicious class loads. Direct impact on Polish public administration, courts, procurement and healthcare workflows that produce qualified electronic signatures cross-recognised under eIDAS. Patched in SzafirHost 1.2.1 (CERT-PL, 2026-05-15)."
  - claim_id: 53b056c8ec
    entry: 2026-05-17/cert-pl-cve-2026-44088-szafirhost-jar-zip-polyglot-bypass-in
    surface: "actions[0]"
    kind: frontmatter
    text: "**Audit Polish-Qualified-Electronic-Signature workflows for SzafirHost 1.2.1 deployment** if your environment accepts eIDAS-cross-recognised signatures from KIR Szafir signers (federal procurement, court e-filing counterparties, healthcare partners). The pre-patch zip-polyglot JAR bypass means SzafirHost endpoints exposed to a compromised download path could have produced silently-fraudulent signatures during the disclosure window. Reference: § 1 SzafirHost item."
  - claim_id: b5cd33a10e
    entry: 2026-05-17/cert-pl-cve-2026-44088-szafirhost-jar-zip-polyglot-bypass-in
    surface: "cves[CVE-2026-44088]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-44088\", \"cvss\": \"8.6\", \"status\": [\"patch-available\"], \"affected\": null, \"fixed\": null, \"auth\": \"pre-auth\", \"vector\": \"user-interaction\"}"
  - claim_id: 1fd9ef9553
