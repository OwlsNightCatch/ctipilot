    entry: 2026-05-17/cert-pl-cve-2026-44088-szafirhost-jar-zip-polyglot-bypass-in
    surface: "body"
    kind: cited
    text: "ENISA's EUVD entry"
    urls: ["https://euvd.enisa.europa.eu/enisa/eu_vulnerability_database/EUVD-2026-30512"]
  - claim_id: 97b111152e
    entry: 2026-05-17/cert-pl-cve-2026-44088-szafirhost-jar-zip-polyglot-bypass-in
    surface: "body"
    kind: uncited
    text: "SzafirHost is the helper that downloads and loads signed JAR plugins to bridge smart-card signing into Chrome, Firefox, and Opera."
  - claim_id: 9f3a5a67d2
    entry: 2026-05-17/cert-pl-cve-2026-44088-szafirhost-jar-zip-polyglot-bypass-in
    surface: "body"
    kind: uncited
    text: "The bug abuses how Java parses the same archive two different ways: `JarInputStream` validates the JAR's code-signing certificate by reading from the start of the file, while `JarFile` / `URLClassLoader` loads actual classes from the ZIP Central Directory at the end."
