    surface: "summary"
    kind: frontmatter
    text: "F5 BIG-IP / BIG-IQ May 2026 Quarterly Notification — SecurityWeek reports \"over 19 high-severity and 32 medium-severity\" bugs across BIG-IP, BIG-IQ and NGINX; NCSC-NL CSAF lists 43 in the BIG-IP / BIG-IQ scope. Lead CVE-2026-41225 (CVSS 4.0 score 8.6 per F5 / SecurityWeek; CVSS 3.1 score 9.1 per NCSC-NL / NVD; both confirm post-auth Manager-role RCE on iControl REST); secondary 8.7-class cluster includes iControl REST command injection, SSH-password exposure in audit logs, and Appliance-mode-bypass privilege escalation. No in-the-wild exploitation reported as of advisory publication. Affects BIG-IP appliances widely deployed across European public-sector load-balancing / WAF perimeters (F5 K000160932, 2026-05-14; SecurityWeek, 2026-05-14)."
  - claim_id: 2613ca75cd
    entry: 2026-05-17/cve-2026-41225-f5-big-ip-big-iq-icontrol-rest-manager-role-a
