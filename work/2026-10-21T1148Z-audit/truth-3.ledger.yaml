    kind: cited
    text: "Sansec published primary research on 2026-05-14 documenting active exploitation of an unauthenticated code-injection flaw in FunnelKit's Funnel Builder for WooCommerce plugin, with BleepingComputer corroborating on 2026-05-15 and The Hacker News expanding on 2026-05-16 ("
    urls: ["https://sansec.io/research/funnelkit-woocommerce-vulnerability-exploited", "https://www.bleepingcomputer.com/news/security/funnel-builder-wordpress-plugin-bug-exploited-to-steal-credit-cards/", "https://thehackernews.com/2026/05/funnel-builder-flaw-under-active.html"]
