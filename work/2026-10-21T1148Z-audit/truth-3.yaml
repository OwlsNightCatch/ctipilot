    - work/2026-10-21T1148Z-audit/truth-3/bodies/oc-thn.txt
    - work/2026-10-21T1148Z-audit/truth-3/bodies/oc-GHSA-5h3g-6xhh-rg6p.txt
    - work/2026-10-21T1148Z-audit/truth-3/bodies/oc-GHSA-wppj-c6mr-83jj.txt
    - work/2026-10-21T1148Z-audit/truth-3/bodies/oc-GHSA-r6xh-pqhr-v4xh.txt
    - work/2026-10-21T1148Z-audit/truth-3/bodies/oc-GHSA-x3h8-jrgh-p8jx.txt
    - work/2026-10-21T1148Z-audit/truth-3/bodies/oc-vc-44112.txt
