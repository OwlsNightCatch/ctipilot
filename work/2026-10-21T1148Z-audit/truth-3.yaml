    - id: T1550.001
      behavior: Operator reuses refresh tokens from Node.js automation; Broker tokens exchanged for Exchange, Graph and OneDrive
      url: https://www.esentire.com/blog/tycoon-2fa-operators-adopt-oauth-device-code-phishing
    - id: T1078.004
