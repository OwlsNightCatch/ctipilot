      url: https://www.bleepingcomputer.com/news/security/tycoon2fa-hijacks-microsoft-365-accounts-via-device-code-phishing/
    note: All ids checked active; T1656 (Impersonation) is revoked in v20 and was not used.
    rating:
      reliability: B
      credibility: 2
      basis: eSentire TRU is an original research/MDR team reporting its own analysis; BleepingComputer restates eSentire. One assessor; the wider device-code trend is corroborated by Proofpoint and Push Security as cited by BleepingComputer, but not this campaign.
    exposure:
    - quote: The attack begins when a victim clicks a Trustifi click-tracking URL in a lure email and culminates in the victim unknowingly granting OAuth tokens to an attacker-controlled device through Microsoft's legitimate device-login flow at microsoft.com/devicelogin.
      url: https://www.esentire.com/blog/tycoon-2fa-operators-adopt-oauth-device-code-phishing
    - quote: it appears in Entra telemetry as a normal Microsoft application - not as an unknown third-party OAuth app - so it does not trigger the unverified-publisher detections that catch many OAuth phishing campaigns.
      url: https://www.esentire.com/blog/tycoon-2fa-operators-adopt-oauth-device-code-phishing
    detection:
