      url: https://www.esentire.com/blog/tycoon-2fa-operators-adopt-oauth-device-code-phishing
    - quote: UserAgent strings "node" and "undici" against AppId 29d9ed98 in non-interactive sign-in logs are direct fingerprints of the operator's Node.js automation backend.
      url: https://www.esentire.com/blog/tycoon-2fa-operators-adopt-oauth-device-code-phishing
    - quote: After a confirmed device-code phish, revoking the refresh-token chain via Revoke-AzureADUserAllRefreshToken terminates persistence.
      url: https://www.esentire.com/blog/tycoon-2fa-operators-adopt-oauth-device-code-phishing
    triage:
    - quote: Their appearance against the Microsoft Authentication Broker AppId in non-interactive sign-in logs is highly anomalous in production environments and is, in practice, a strong post-compromise indicator.
