      url: https://krebsonsecurity.com/2026/05/cisa-admin-leaked-aws-govcloud-keys-on-github/
    - quote: Caturegli said the exposed AWS keys inexplicably continued to remain valid for another 48 hours.
      url: https://krebsonsecurity.com/2026/05/cisa-admin-leaked-aws-govcloud-keys-on-github/
