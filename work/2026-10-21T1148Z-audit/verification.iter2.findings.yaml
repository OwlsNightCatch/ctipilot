  item: "2026-05-13/bwh-hotels-best-western-worldhotels-sure-hotels-181-day-unau (claims ed80615e6a, d0aa77e5de)"
  url_or_quote: "\"...with no payment, bank or passport data involved ([The Register, 2026-05-11](https://www.theregister.com/security/2026/05/11/best-western-hotels-confirms-web-app-data-breach/5238020))\"; record summary: \"the exposed fields are contact and reservation data, not passport data\""
