    ground_truth_url: https://github.com/nextcloud/security-advisories/security/advisories/GHSA-x43f-gmgh-vvjj
    fix: Correct each id and severity as above, citing the four GHSAs; note CVE-2026-45690 is a second 2FA bypass fixed in the same Server releases.
    class: factual-error
  - where: headline; summary
    claim: 2FA bypass on WebDAV via pre-authenticated session token reuse ... pre-auth 2FA bypass via WebDAV session token reuse
    defect: 'The flaw requires the user''s password: the reusable cookie is created after password authentication, and the advisory scores it PR:L. ''Pre-auth'' tells readers it is exploitable without credentials.'
    ground_truth: '''A pre-2FA session cookie (created after successful password authentication but before TOTP completion) could be reused as a Bearer token to authenticate against DAV endpoints''; CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:U/C:L/I:H/A:N.'
    ground_truth_url: https://github.com/nextcloud/security-advisories/security/advisories/GHSA-mp6x-g55j-w9jw
