      url: https://www.stepsecurity.io/blog/mini-shai-hulud-is-back-a-self-spreading-supply-chain-attack-hits-the-npm-ecosystem
    - id: T1552.001
      behavior: Payload reads 100+ credential file paths (cloud, SSH/Git, developer tools, AI tools, wallets, VPN, messaging, shell history)
      url: https://www.stepsecurity.io/blog/mini-shai-hulud-is-back-a-self-spreading-supply-chain-attack-hits-the-npm-ecosystem
