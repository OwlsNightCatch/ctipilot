      behavior: Runner.Worker located via /proc/*/cmdline; /proc/<pid>/maps and /proc/<pid>/mem read to dump secrets and the OIDC token
      url: https://tanstack.com/blog/npm-supply-chain-compromise-postmortem
    - id: T1528
      behavior: GitHub Actions OIDC token taken from runner memory
      url: https://tanstack.com/blog/npm-supply-chain-compromise-postmortem
    - id: T1550.001
