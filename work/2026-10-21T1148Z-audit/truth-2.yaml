entries:
- entry: 2026-05-12/teampcp-unc6780-pcpjack-ecosystem-backdoors-the-checkmarx-je
  verdict: factual-error
  defects:
  - where: cves[CVE-2026-33634]; body paragraph 2 ('a CVE has been issued as CVE-2026-33634 per the Checkmarx advisory')
    claim: 'id: CVE-2026-33634, cvss: "9.4", status: [exploited, patch-available], auth: pre-auth, vector: zero-click'
    defect: CVE-2026-33634 is the Aqua Security Trivy embedded-malicious-code CVE from March 2026, not a CVE for the Checkmarx Jenkins plugin; the Checkmarx page names no CVE at all, so the body sentence attributing it to 'the Checkmarx advisory' is false and the cves[] record binds the wrong flaw.
    ground_truth: GHSA-69fq-xp46-6x23 is titled 'CVE-2026-33634' and reads 'On March 19, 2026, a threat actor used compromised credentials to publish a malicious Trivy v0.69.4 release, force-push 76 of 77 version tags in aquasecurity/trivy-action to credential-stealing malware'. CISA KEV lists CVE-2026-33634 as 'Aquasecurity Trivy Embedded Malicious Code Vulnerability', dateAdded 2026-03-26. The Checkmarx page contains no 'CVE' string.
    ground_truth_url: https://github.com/advisories/GHSA-69fq-xp46-6x23
    fix: 'Delete the cves[] record and the body sentence; no source read assigns a CVE to the Jenkins build 2026.5.09. If kept for context, say only that the credentials came from the March Trivy compromise (CVE-2026-33634), per Checkmarx: ''This access occurred on March 19, 2026 due to the Trivy Supply Chain Attack''. kind: vulnerability then no longer fits (threat or incident).'
    class: factual-error
  - where: headline; summary; body paragraphs 1-3 (SANDCLOCK)
    claim: Malicious plugin build 2026.5.09 ... deploys SANDCLOCK to exfiltrate every CI secret reachable from the runner
    defect: None of the three cited pages (nor BleepingComputer, SOCRadar) names SANDCLOCK for the Jenkins build; GTIG ties SANDCLOCK to the late-March Trivy, Checkmarx, LiteLLM and BerriAI compromises, and Checkmarx describes the May payload without naming it.
    ground_truth: 'GTIG (2026-05-11): ''In late March 2026, ... TeamPCP (aka UNC6780) claimed responsibility for multiple supply chain compromises ... including those associated with the Trivy vulnerability scanner, Checkmarx, LiteLLM, and BerriAI ... embed the SANDCLOCK credential stealer''. Checkmarx on the May build: ''The malicious payload associated with the modified plug-in targets lists of file paths for common applications ... We are still conducting malware analysis''.'
    ground_truth_url: https://cloud.google.com/blog/topics/threat-intelligence/ai-vulnerability-exploitation-initial-access
    fix: Drop SANDCLOCK from headline, summary and body, or state it only as GTIG's name for the stealer used in the March compromises, with the GTIG URL as the citation.
    class: factual-error
  - where: summary; body paragraph 2 (list of targeted secrets); defender pivot ('audit Checkmarx One API logs')
    claim: 'SANDCLOCK targets every secret reachable from a typical CI/CD pipeline environment: GitHub Personal Access Tokens, AWS / Azure / GCP credentials, Kubernetes service-account tokens, Docker / OCI registry credentials, SSH keys, and Checkmarx One API tokens.'
    defect: No page read lists these targets for the Jenkins build; Checkmarx names a narrower set and says no threat-actor access to the Checkmarx One SaaS environment was found, so 'Checkmarx One API tokens' and container-registry credentials are unsupported.
    ground_truth: 'Checkmarx: ''it traverses the corresponding file list looking for credentials. Targeted applications include crypto wallets, VPNs, AWS, and Github ... to date we have not seen any references to Jenkins.'' and ''There was no threat actor access to the Checkmarx One SaaS environment''.'
    ground_truth_url: https://checkmarx.com/blog/ongoing-security-updates/
    fix: State Checkmarx's list (file-path sweep for credentials of crypto wallets, VPNs, AWS and GitHub, per OS) and Checkmarx's advice to rotate 'all credentials that the pipeline that executed the malicious payload has access to'; remove the Checkmarx One API token claim and the Checkmarx One log-audit pivot.
    class: factual-error
  - where: body paragraph 2 (third compromise sentence)
    claim: after the March 2026 KICS Docker image and the April 2026 VS Code extension defacement
    defect: 'Chronology is wrong: the KICS Docker image belongs to the April wave, and the March wave was malicious GitHub Actions and Open VSX extensions; the repository defacement belongs to the May Jenkins incident, not April.'
    ground_truth: 'Checkmarx timeline: ''23-Mar-2026 ... malicious GitHub Actions & VSCode extensions to OpenVSX''; ''22-Apr-2026 Second Wave Artifacts: Cached credentials enable publication of malicious KICS Docker image, updated VSCode & DevAssist extensions, and GitHub Action''; ''9-May-2026 Jenkins Plugin Compromise''. BleepingComputer: ''This is the third incident in a series of supply-chain attacks the application security testing firm has suffered since late March.'''
    ground_truth_url: https://checkmarx.com/blog/ongoing-security-updates/
    fix: 'Write: third Checkmarx artifact compromise since late March (March GitHub Actions and Open VSX extensions; April KICS Docker image, extensions and GitHub Action; May Jenkins plugin), cited to the Checkmarx timeline. ''In three months'' is calendar-month rounding of a roughly six-week span.'
    class: factual-error
  - where: body paragraph 3 (GTIG sentence)
    claim: The GTIG AI Threat Tracker ( attributes SANDCLOCK specifically to TeamPCP and flags the stealer as explicitly designed to harvest **LLM API keys** in addition to traditional cloud credentials
    defect: GTIG does not say SANDCLOCK is designed to harvest LLM API keys; it says the LiteLLM compromise could expose AI API secrets. The inline link is also empty ('(' with no URL).
    ground_truth: 'GTIG: ''embed the SANDCLOCK credential stealer and extract high-value cloud secrets, such as AWS keys and GitHub tokens'' and, of LiteLLM, ''this incident could lead to considerable exposure of AI API secrets from affected victims''.'
    ground_truth_url: https://cloud.google.com/blog/topics/threat-intelligence/ai-vulnerability-exploitation-initial-access
    fix: Restate as GTIG does (stealer harvests cloud secrets such as AWS keys and GitHub tokens; the LiteLLM compromise could expose AI API secrets) and give the GTIG URL; drop 'explicitly designed to harvest LLM API keys' and the 'pivot to monetising stolen LLM access' inference.
    class: factual-error
  - where: headline; body opening ('PCPJack worm ... same actor ecosystem'); entities tool:pcpjack-cloud-worm-2026
    claim: TeamPCP (UNC6780 / PCPJack ecosystem) ... this is a distinct new artefact in the same actor ecosystem
    defect: PCPJack is a separate cloud worm whose first act is to evict TeamPCP tooling; SentinelLABS only speculates its operator 'could be a former operator', and no cited page links PCPJack to the Checkmarx Jenkins incident.
    ground_truth: 'SentinelLABS: ''the script''s first actions are to evict and delete tools associated with the TeamPCP attack group, leading us to call the toolset PCPJack'' and ''We believe this could be a former operator who is deeply familiar with the group''s tooling.'''
    ground_truth_url: https://www.sentinelone.com/labs/cloud-worm-evicts-teampcp-and-steals-credentials-at-scale/
    fix: Remove 'PCPJack ecosystem' from headline and body and the PCPJack entity link from this entry; if mentioned, say PCPJack is a distinct worm that removes TeamPCP infections (SentinelLABS).
    class: factual-error
  - where: body paragraph 1 ('marketed under the actor's signature naming')
    claim: version 2026.5.09, marketed under the actor's signature naming "Checkmarx-Fully-Hacked-by-TeamPCP"
    defect: The defacement name was given to the plugin's GitHub repository, not to the plugin build; the name quoted is also truncated.
    ground_truth: 'THN: TeamPCP ''renamed it to "Checkmarx-Fully-Hacked-by-TeamPCP-and-Their-Customers-Should-Cancel-Now."'' (the plugin''s GitHub repository) with the description ''Checkmarx fails to rotate secrets again. with love - TeamPCP.'''
    ground_truth_url: https://thehackernews.com/2026/05/teampcp-compromises-checkmarx-jenkins.html
    fix: Say the plugin's GitHub repository was renamed and defaced, separately from the malicious build 2026.5.09.
    class: imprecision
  - where: body paragraph 1 ('configured to auto-update'); summary ('auto-updated')
    claim: Any Jenkins instance configured to auto-update the AST plugin during that window pulled the malicious build
    defect: No page says exposure required auto-update configuration; Checkmarx gives an exposure window and SOCRadar says any instance 'that pulled this version'.
    ground_truth: 'Checkmarx: ''The malicious window was 2026-05-09 01:25 UTC to 2026-05-10 08:47 UTC.'' SOCRadar: ''Any Jenkins instance that pulled this version during the exposure window would have installed a compromised plugin.'''
    ground_truth_url: https://checkmarx.com/blog/ongoing-security-updates/
    fix: Write 'any instance that installed or updated to build 2026.5.09 between 2026-05-09 01:25 UTC and 2026-05-10 08:47 UTC'.
    class: imprecision
  - where: headline; summary; body paragraph 1 (attribution stated as fact)
    claim: On 2026-05-09-10 (UTC) TeamPCP (UNC6780) published a backdoored build of the Checkmarx Jenkins AST plugin
    defect: The May attribution rests on the repository defacement and researcher statements; Checkmarx's own May row names only 'External service account'; the UNC6780 designation comes from GTIG's March-activity report.
    ground_truth: 'THN: ''TeamPCP is said to have gained unauthorized access to the plugin''s GitHub repository'' per Adnan Khan and SOCRadar. BleepingComputer: ''The compromise was claimed by the TeamPCP hacker group.'' Checkmarx timeline: ''9-May-2026 Jenkins Plugin Compromise: External service account modified Jenkins AST plugin and published to Jenkins Marketplace''.'
    ground_truth_url: https://www.bleepingcomputer.com/news/security/official-checkmarx-jenkins-package-compromised-with-infostealer/
    fix: Write 'TeamPCP claimed (defacement) and researchers attribute ...; Checkmarx says credentials from the March Trivy compromise were reused'.
    class: imprecision
  - where: body opening; evidence[0]; sourcing_note
    claim: UPDATE (TeamPCP / mini-shai-hulud first covered 2026-05-07; PCPJack worm covered 2026-05-10; this is a distinct new artefact in the same actor ecosystem)
    defect: Pipeline self-reference in reader text; evidence[0] quotes 'ctipilot v2 brief (migrated)' (the pipeline quoting itself); the claimed 2026-05-07 and 2026-05-10 coverage entries do not exist in the store for PCPJack.
    ground_truth: grep of entries/ finds 'PCPJack' only in this entry.
    ground_truth_url: work/2026-10-21T1148Z-audit/truth-2/bodies/e1-s1-pcpjack.txt
    fix: Remove the UPDATE preamble and the self-quoting evidence record; replace with a verbatim Checkmarx or BleepingComputer passage.
    class: imprecision
  upgrade:
    techniques:
    - id: T1195.002
      behavior: Modified Checkmarx Jenkins AST plugin published to the Jenkins Marketplace outside the release pipeline (build 2026.5.09)
      url: https://checkmarx.com/blog/ongoing-security-updates/
    - id: T1078
      behavior: Attacker reused access obtained in the March incident (an external service account) to publish the plugin
      url: https://checkmarx.com/blog/ongoing-security-updates/
    - id: T1552.001
      behavior: Payload selects a per-OS list of file paths for common applications and traverses it looking for credentials
      url: https://checkmarx.com/blog/ongoing-security-updates/
    rating:
      reliability: A
      credibility: 2
      basis: Primary is Checkmarx's own incident page for its own product (A); the press (THN, SecurityWeek, BleepingComputer) restates it and the TeamPCP link rests on a defacement claim plus one researcher, so one assessor uncorroborated on attribution (2).
    exposure:
    - quote: Ensure you are on one of those versions or on 2.0.13-829.vc72453fa_1c16 from December 17, 2025 or earlier. The malicious window was 2026-05-09 01:25 UTC to 2026-05-10 08:47 UTC.
      url: https://checkmarx.com/blog/ongoing-security-updates/
    detection:
    - quote: Restrict egress from CI runners to an allowlist; monitor outbound connections for unexpected domains
      url: https://checkmarx.com/blog/ongoing-security-updates/
    - quote: it traverses the corresponding file list looking for credentials. Targeted applications include crypto wallets, VPNs, AWS, and Github.
      url: https://checkmarx.com/blog/ongoing-security-updates/
    triage: []
    takeaway:
    - quote: We recommend rotating all credentials that the pipeline that executed the malicious payload has access to.
      url: https://checkmarx.com/blog/ongoing-security-updates/
    - quote: Treat CI runner credentials as short-lived and tightly scoped.
      url: https://checkmarx.com/blog/ongoing-security-updates/
    bodies:
    - work/2026-10-21T1148Z-audit/truth-2/bodies/e1-checkmarx.txt
    - work/2026-10-21T1148Z-audit/truth-2/bodies/e1-thn.txt
    - work/2026-10-21T1148Z-audit/truth-2/bodies/e1-secweek.txt
    - work/2026-10-21T1148Z-audit/truth-2/bodies/e1-bleeping.txt
    - work/2026-10-21T1148Z-audit/truth-2/bodies/e1-socradar.txt
    - work/2026-10-21T1148Z-audit/truth-2/bodies/e1-gtig.txt
    - work/2026-10-21T1148Z-audit/truth-2/bodies/e1-s1-pcpjack.txt
    - work/2026-10-21T1148Z-audit/truth-2/bodies/e1-ghsa-trivy.txt
  possible_twin_outside_batch: null
- entry: 2026-05-13/microsoft-mdash-multi-model-agentic-vulnerability-discovery
  verdict: factual-error
  defects:
  - where: body paragraph 1 (benchmark sentence citation)
    claim: The harness scored 88.45% on the public CyberGym benchmark (1,507 real-world CVEs across 188 open-source projects) and achieved 100% recall on the `tcpip.sys` historical-CVE corpus ([The Register, 2026-05-13]
    defect: The Register article carries none of these figures (it only says MDASH found 16 of the May vulnerabilities and is in limited private preview); they are on Microsoft's own blog, and the entry drops the sample size and the clfs.sys result.
    ground_truth: 'Microsoft: ''the Microsoft Security multi-model agentic scanning harness reaches an 88.45% success rate'' on CyberGym, ''a corpus of 1,507 real-world vulnerability reproduction tasks drawn from across 188 OSS-Fuzz projects''; ''tcpip.sys: 100% recall on 7 MSRC cases spanning five years''; ''clfs.sys: 96% recall on 28 MSRC cases''; ''retrospective recall benchmarks on internal code with a finite case count''.'
    ground_truth_url: https://www.microsoft.com/en-us/security/blog/2026/05/12/defense-at-ai-speed-microsofts-new-multi-model-agentic-security-system-finds-16-new-vulnerabilities/
    fix: 'Cite the Microsoft blog for the figures; write ''tcpip.sys: 100% of 7 historical MSRC cases'' (and clfs.sys 96% of 28), not ''historical-CVE corpus''; say 1,507 reproduction tasks across 188 OSS-Fuzz projects.'
    class: imprecision
  - where: body paragraph 1 (prove-stage sentence)
    claim: ends with an **automated end-to-end exploitability proof** before a finding is sent to engineering — meaning every MDASH-disclosed CVE was validated as practically exploitable, not just theoretically reachable
    defect: Microsoft describes the prove stage as constructing triggering inputs 'where the bug class admits it' to prove the bug exists; it does not claim exploitability was proven for every finding, and several of the 16 are DoS or information-disclosure bugs.
    ground_truth: '''Prove stage: Constructs and executes triggering inputs where the bug class admits it. The prove stage validates the pre-condition dynamically and formulates the bug-triggering inputs to prove existence of vulnerability (for example, ASan in C/C++).'' Of CVE-2026-33827: ''exploitation requires winning a narrow timing window and shaping allocator reuse''.'
    ground_truth_url: https://www.microsoft.com/en-us/security/blog/2026/05/12/defense-at-ai-speed-microsofts-new-multi-model-agentic-security-system-finds-16-new-vulnerabilities/
    fix: 'Write: the prove stage builds and runs triggering inputs where the bug class allows, to confirm the bug exists; drop ''practically exploitable'' for every CVE.'
    class: factual-error
  - where: Defender takeaway, first implication
    claim: the MDASH-discovered Windows CVEs (a substantial subset of the May 2026 Patch Tuesday in § 2) should be treated as "practically exploitable" even without observed ITW activity ... that lifts these above the typical "Less Likely / More Likely" scoring noise
    defect: Microsoft's own exploitability assessments for the four Critical MDASH CVEs are 'Exploitation Less Likely' (three) and 'Exploitation Unlikely' (one), none exploited or publicly disclosed; the premise (proof-of-exploitability before disclosure) is not in the source. Two of the four were released in April, not May.
    ground_truth: 'MSRC: CVE-2026-33827 (released 2026-04-14, CVSS 8.1) ''Exploitation Less Likely''; CVE-2026-33824 (2026-04-14, 9.8) ''Exploitation Less Likely''; CVE-2026-41089 (2026-05-12, 9.8) ''Exploitation Less Likely''; CVE-2026-41096 (2026-05-12, 9.8) ''Exploitation Unlikely''; all exploited: No, publiclyDisclosed: No. The Register: ''Redmond says exploitation is "unlikely"'' for CVE-2026-41096.'
    ground_truth_url: work/2026-10-21T1148Z-audit/truth-2/bodies/e2-msrc-CVE-2026-33824.txt
    fix: Replace with the vendor's own ratings per CVE and a patch-priority argument based on unauthenticated network reachability (tcpip.sys, IKEEXT, Netlogon CLDAP, DNS client), not 'practically exploitable'.
    class: factual-error
  - where: body paragraph 1 ('first production run')
    claim: In MDASH's first production run against Windows the harness produced 16 previously unknown CVEs
    defect: '''First production run'' is not in either cited page; Microsoft says only that 16 CVEs in the Patch Tuesday were found with MDASH and that the harness is used by Microsoft security engineering teams.'
    ground_truth: '''Across the Windows network stack and adjacent services, today''s Patch Tuesday includes 16 CVEs our engineering teams found using codename MDASH.'''
    ground_truth_url: https://www.microsoft.com/en-us/security/blog/2026/05/12/defense-at-ai-speed-microsofts-new-multi-model-agentic-security-system-finds-16-new-vulnerabilities/
    fix: Delete 'In MDASH's first production run'; write 'Microsoft credits MDASH with 16 CVEs in the May 2026 release'.
    class: factual-error
  - where: body paragraph 1 (last sentence)
    claim: Microsoft has scheduled a customer-facing preview of the harness for June 2026.
    defect: Neither page gives a June date; the preview is already running as a limited private preview.
    ground_truth: 'Microsoft: ''tested by a small set of customers as part of a limited private preview''; The Register: ''making the tool available to a limited number of customers in private preview''.'
    ground_truth_url: https://www.microsoft.com/en-us/security/blog/2026/05/12/defense-at-ai-speed-microsofts-new-multi-model-agentic-security-system-finds-16-new-vulnerabilities/
    fix: Write 'a limited private preview with a small set of customers has started; sign-up is open'.
    class: factual-error
  - where: Defender takeaway, second implication
    claim: DirectAccess and Always-On VPN are widely deployed as the AD-integrated remote-access primitive across Swiss federal and EU government estates
    defect: No page read says anything about deployment in Swiss federal or EU government estates; the exposure statement the source gives is narrower and has a precondition.
    ground_truth: CVE-2026-33824 is 'reachable by a remote, unauthenticated attacker over UDP/500 on any host configured as an IKEv2 responder (RRAS VPN, DirectAccess, Always-On VPN infrastructure, or any machine with an inbound connection security rule)'; 'a bare Start-Service IKEEXT with no responder policy is not vulnerable'.
    ground_truth_url: https://www.microsoft.com/en-us/security/blog/2026/05/12/defense-at-ai-speed-microsofts-new-multi-model-agentic-security-system-finds-16-new-vulnerabilities/
    fix: Drop the deployment assertion; state the exposure condition (IKEv2 responder policy present) and tell the reader to check for hosts with RRAS VPN, DirectAccess, Always-On VPN infrastructure or inbound connection security rules.
    class: factual-error
  - where: headline; cves[]; Defender takeaway (Patch Tuesday month)
    claim: 'finds 16 Windows CVEs in network-stack kernel components; cves: []; ''expedite May 2026 cumulative update'''
    defect: Six of the 16 are user-mode, the table also covers http.sys and telnet.exe, none of the CVE ids is named in the entry (cves[] is empty), and two of the four Critical RCEs (CVE-2026-33827, CVE-2026-33824) were released in April, so the 'May cumulative update' is not where they first shipped.
    ground_truth: 'Microsoft: ''These vulnerabilities are 10 kernel-mode / 6 usermode.'' Critical rows: CVE-2026-33827 (tcpip.sys), CVE-2026-33824 (ikeext.dll), CVE-2026-41089 (netlogon.dll), CVE-2026-41096 (dnsapi.dll); ''CVE-2026-33827, patched in April Patch Tuesday'', ''CVE-2026-33824, patched in April Patch Tuesday''. MSRC release dates 2026-04-14 for those two, 2026-05-12 for the other two.'
    ground_truth_url: https://www.microsoft.com/en-us/security/blog/2026/05/12/defense-at-ai-speed-microsofts-new-multi-model-agentic-security-system-finds-16-new-vulnerabilities/
    fix: 'Headline: ''finds 16 Windows CVEs in networking and authentication components''; list the four Critical ids with MSRC CVSS (8.1, 9.8, 9.8, 9.8) and release months in cves[] or the body.'
    class: imprecision
  - where: Defender takeaway (ATT&CK sentence)
    claim: Mapped to `T1190 Exploit Public-Facing Application` and `T1133 External Remote Services`.
    defect: T1133 describes use of legitimate remote services with valid access; the source describes pre-authentication memory-corruption bugs in network services, which is T1190 only, and no exploitation is reported.
    ground_truth: '''Unauth IKEv2 SA_INIT double-free triggers LocalSystem RCE''; MSRC ''exploited: No''.'
    ground_truth_url: https://www.microsoft.com/en-us/security/blog/2026/05/12/defense-at-ai-speed-microsofts-new-multi-model-agentic-security-system-finds-16-new-vulnerabilities/
    fix: Keep T1190 (as a potential, not observed, vector); drop T1133.
    class: imprecision
  - where: body (Defender takeaway)
    claim: (a substantial subset of the May 2026 Patch Tuesday in § 2)
    defect: Reference to a section of the retired v2 brief ('§ 2') is pipeline self-reference with no target for readers.
    ground_truth: 'n/a (migration artefact; entry has migrated_from: briefs/2026-05-13.md)'
    ground_truth_url: work/2026-10-21T1148Z-audit/truth-2/bodies/e2-msft.txt
    fix: Delete the '§ 2' reference.
    class: imprecision
  upgrade:
    techniques:
    - id: T1190
      behavior: Unauthenticated network-reachable memory-corruption bugs in tcpip.sys (SSRR UAF), IKEEXT (SA_INIT double-free), Netlogon CLDAP and the DNS client; vulnerability disclosure, no exploitation reported
      url: https://www.microsoft.com/en-us/security/blog/2026/05/12/defense-at-ai-speed-microsofts-new-multi-model-agentic-security-system-finds-16-new-vulnerabilities/
    rating:
      reliability: B
      credibility: 2
      basis: Primary is Microsoft's own research blog on its own system and CVEs (benchmarks are self-reported); The Register restates the announcement, so one assessor uncorroborated.
    exposure:
    - quote: reachable by a remote, unauthenticated attacker over UDP/500 on any host configured as an IKEv2 responder (RRAS VPN, DirectAccess, Always-On VPN infrastructure, or any machine with an inbound connection security rule)
      url: https://www.microsoft.com/en-us/security/blog/2026/05/12/defense-at-ai-speed-microsofts-new-multi-model-agentic-security-system-finds-16-new-vulnerabilities/
    - quote: a bare `Start-Service IKEEXT` with no responder policy is not vulnerable
      url: https://www.microsoft.com/en-us/security/blog/2026/05/12/defense-at-ai-speed-microsofts-new-multi-model-agentic-security-system-finds-16-new-vulnerabilities/
    detection:
    - quote: The trigger sequence is two UDP packets, no race, no special timing.
      url: https://www.microsoft.com/en-us/security/blog/2026/05/12/defense-at-ai-speed-microsofts-new-multi-model-agentic-security-system-finds-16-new-vulnerabilities/
    triage: []
    takeaway:
    - quote: CVE-2026-33824, patched in April Patch Tuesday.
      url: https://www.microsoft.com/en-us/security/blog/2026/05/12/defense-at-ai-speed-microsofts-new-multi-model-agentic-security-system-finds-16-new-vulnerabilities/
    - quote: Microsoft also said its secret-until-now AI bug hunting system, codenamed MDASH, found 16 of the vulnerabilities addressed in this month's release.
      url: https://www.theregister.com/patches/2026/05/13/doozy-of-a-patch-tuesday-includes-30-critical-microsoft-cves/5239224
    bodies:
    - work/2026-10-21T1148Z-audit/truth-2/bodies/e2-msft.txt
    - work/2026-10-21T1148Z-audit/truth-2/bodies/e2-register-raw.txt
    - work/2026-10-21T1148Z-audit/truth-2/bodies/e2-msrc-CVE-2026-33827.txt
    - work/2026-10-21T1148Z-audit/truth-2/bodies/e2-msrc-CVE-2026-33824.txt
    - work/2026-10-21T1148Z-audit/truth-2/bodies/e2-msrc-CVE-2026-41089.txt
    - work/2026-10-21T1148Z-audit/truth-2/bodies/e2-msrc-CVE-2026-41096.txt
  possible_twin_outside_batch: entries/2026-05-13/cve-2026-41089-cve-2026-41096-cve-2026-41103-cve-2026-42898.md (May 2026 Patch Tuesday entry that also mentions MDASH; CVE-2026-41089 and CVE-2026-41096 are among the MDASH CVEs)
- entry: 2026-05-13/mini-shai-hulud-s-github-actions-pwn-request-oidc-token-thef
  verdict: factual-error
  defects:
  - where: summary; body 'Background' paragraph
    claim: Mini Shai-Hulud (the TeamPCP self-propagating npm worm) first surfaced in coverage on 2026-05-10 as a SAP CAP-package compromise.
    defect: The SAP wave was published on 2026-04-29 and reported on 2026-04-30/05-01; 2026-05-10 is the pipeline's own first-coverage date, not when the worm surfaced. The summary field also holds only this background sentence, not the finding, and the body links to an internal brief ('/briefs/2026-05-10/').
    ground_truth: 'The Register: ''On April 29, TeamPCP compromised four official npm packages from the SAP JavaScript and cloud application development ecosystem and published the poisoned releases between 09:55 and 12:14 UTC.'''
    ground_truth_url: https://www.theregister.com/2026/04/30/supply_chain_attacks_sap_npm_packages/
    fix: Write 'Mini Shai-Hulud first hit SAP npm packages (mbt, @cap-js/*) on 2026-04-29'; make the summary state the TanStack pwn-request/cache-poisoning/OIDC-extraction chain of 2026-05-11; remove the internal brief link.
    class: factual-error
  - where: body 'Background' paragraph (original campaign description)
    claim: The original campaign relied on attacker-published versions of dependency-chain packages catching legitimate downstream consumers; its blast-radius was bounded by which packages opted into the affected dependency graph.
    defect: The SAP wave was a worm-style compromise of official packages that stole developer and CI secrets, self-propagated and exfiltrated to GitHub repositories; it was not 'dependency-chain' packages bounded by an opt-in graph, and it already used runner-memory extraction.
    ground_truth: 'The Register: ''The compromised packages contain malicious preinstall scripts ... This new campaign deploys a multi-stage payload that steals developer secrets, self-propagates, encrypts all the stolen goods, and then exfiltrates the now-locked secrets into a new GitHub repository''; Wiz: ''leveraging advanced techniques such as extracting secrets from runner memory''.'
    ground_truth_url: https://www.theregister.com/2026/04/30/supply_chain_attacks_sap_npm_packages/
    fix: Delete the characterisation or restate it as in The Register (compromised official SAP packages with preinstall payloads, worm-style propagation).
    class: factual-error
  - where: body paragraph 1 (cited sentence on the 2026-05-11 wave)
    claim: it uses no infostealer of a maintainer's machine, no credential theft from the package owner; instead it abuses a class problem in GitHub Actions
    defect: True only for the initial TanStack publish (no npm tokens stolen). The wave's payload is itself a credential stealer that spread to other maintainers' packages with stolen credentials, so 'no infostealer' misdescribes the wave and contradicts the entry's own step 10.
    ground_truth: 'TanStack: ''No npm tokens were stolen and the npm publish workflow itself was not compromised.'' StepSecurity: ''Mini Shai-Hulud is a true worm: after stealing credentials from one CI/CD pipeline, it enumerates every package that maintainer controls and publishes infected versions of each.'''
    ground_truth_url: https://www.stepsecurity.io/blog/mini-shai-hulud-is-back-a-self-spreading-supply-chain-attack-hits-the-npm-ecosystem
    fix: 'Scope it: the TanStack publish needed no stolen npm token (OIDC token taken from runner memory); the payload then steals credentials from install hosts and spreads with them.'
    class: imprecision
  - where: chain step 1 (Reconnaissance) and its T1593 mapping
    claim: The operator (`voicproducoes`, GitHub account ID 269549300, created 2026-03-19) identifies a target repository whose CI/CD configuration triggers on `pull_request_target`. ... Mapped to `T1593 Search Open Websites/Domains` (the operator surveys public Actions configurations).
    defect: The account id and creation date are right, but no source describes a reconnaissance step; the timeline starts with fork creation. The behavior and its ATT&CK mapping are inference presented as fact.
    ground_truth: 'StepSecurity: ''The attacker created a fork of TanStack/router on May 10, 2026, using the GitHub account voicproducoes (ID: 269549300, created 2026-03-19).'' TanStack timeline begins ''2026-05-10 17:16 Attacker creates fork''.'
    ground_truth_url: https://tanstack.com/blog/npm-supply-chain-compromise-postmortem
    fix: Drop step 1 and T1593, or label it as an assumption; start the chain at fork creation.
    class: imprecision
  - where: chain step 3 (Pwn-Request lure content)
    claim: attacker-controlled code paths reached via subtle changes the human reviewer is unlikely to read (e.g. a modified `pnpm-lock.yaml`, a new dev-dependency, or a CI helper script under `.github/`)
    defect: 'Invented detail. The PR added a ~30,000-line payload file under packages/history and was titled ''WIP: simplify history build''; the pull_request_target workflow checked out the PR merge ref and ran the benchmark build, which executed it. No lockfile, dev-dependency or .github change is reported.'
    ground_truth: 'TanStack: ''Adds packages/history/vite_setup.mjs (a ~30,000-line bundled JS payload)''; ''bundle-size.yml''s benchmark-pr job checks out refs/pull/7378/merge, runs pnpm install + pnpm nx run @benchmarks/bundle-size:build — this executes vite_setup.mjs''; the attacker then ''force-pushes the PR back to current main HEAD ... making the visible PR a 0-file no-op''.'
    ground_truth_url: https://tanstack.com/blog/npm-supply-chain-compromise-postmortem
    fix: 'Replace with: the workflow checked out and built the fork''s merge ref, executing a payload file added in the PR; the PR was afterwards force-pushed to a no-op and closed.'
    class: factual-error
  - where: chain step 5 (Wait for release)
    claim: The release workflow on `main` restores the poisoned cache, builds the package using the trojanised pnpm store, and reaches the publish step.
    defect: The publish step was not reached; tests failed, the Publish Packages step was skipped, and the malware published directly during the test/cleanup phase. The entry contradicts itself in step 8 ('The "Publish Packages" step ... was bypassed entirely').
    ground_truth: 'TanStack: ''it does not come from the workflow''s defined Publish Packages step, which was skipped because tests failed. It comes from the malware running during the test/cleanup phase, which mints an OIDC token via the workflow''s id-token: write permission and POSTs directly to registry.npmjs.org''.'
    ground_truth_url: https://tanstack.com/blog/npm-supply-chain-compromise-postmortem
    fix: 'Write: the poisoned store ran during the release job; the attacker''s code minted an OIDC token and published directly while the real publish step was skipped.'
    class: factual-error
  - where: chain steps 6 and 7 (OIDC token handling)
    claim: The token sits in the workflow process's memory but is not surfaced as an environment variable to step scripts. ... no audit signal at the npm side distinguishes it from a normal publish.
    defect: (low confidence) StepSecurity shows the payload reading ACTIONS_ID_TOKEN_REQUEST_TOKEN / ACTIONS_ID_TOKEN_REQUEST_URL environment variables to obtain tokens, and TanStack names a detectable difference (publishes from unexpected workflow steps), so both absolutes overreach.
    ground_truth: 'StepSecurity: ''It uses the stolen GitHub OIDC token (ACTIONS_ID_TOKEN_REQUEST_TOKEN / ACTIONS_ID_TOKEN_REQUEST_URL) to obtain a Fulcio signing certificate''. TanStack: ''add provenance-source-verification to detect publishes from unexpected workflow steps''.'
    ground_truth_url: https://www.stepsecurity.io/blog/mini-shai-hulud-is-back-a-self-spreading-supply-chain-attack-hits-the-npm-ecosystem
    fix: 'Say the OIDC token is minted in the runner for id-token: write jobs and was read from Runner.Worker memory; say TanStack found the publish came from outside the defined publish step.'
    class: imprecision
  - where: chain step 8 (Provenance fraud) and Hardening SLSA bullet
    claim: SLSA L3 was the assurance many EU procurement frameworks were starting to demand; this campaign demonstrates it is forgeable ... The 2026-05-11 campaign shows L3 alone is forgeable.
    defect: 'No page mentions EU procurement frameworks, and the attestation was not forged: it is a genuine attestation of a compromised pipeline.'
    ground_truth: 'StepSecurity: ''SLSA provenance confirms which pipeline produced the artifact, not whether the pipeline was behaving as intended. A compromised build step can produce a validly-attested but malicious package.'''
    ground_truth_url: https://www.stepsecurity.io/blog/mini-shai-hulud-is-back-a-self-spreading-supply-chain-attack-hits-the-npm-ecosystem
    fix: Delete the procurement clause; write 'valid SLSA provenance proves which pipeline built the package, not that the pipeline behaved'.
    class: factual-error
  - where: chain step 9 (payload)
    claim: a 2.3 MB triple-obfuscated `router_init.js` that on `postinstall` harvests ... browser cookie jars and 100+ further credential paths
    defect: The payload ran from the `prepare` script of an optional git dependency (Wiz notes a `preinstall` variant for UiPath/Mistral packages), not `postinstall`; the 100+ path list names Slack's Cookies file, crypto wallets, VPN, AI-tool and shell-history files, not browser cookie jars.
    ground_truth: 'StepSecurity: ''"prepare": "bun run tanstack_runner.js && exit 1"'' ... ''The `prepare` lifecycle hook runs automatically when the dependency is installed via a `github:` URL''; path table lists ''~/.config/Slack/Cookies''.'
    ground_truth_url: https://www.stepsecurity.io/blog/mini-shai-hulud-is-back-a-self-spreading-supply-chain-attack-hits-the-npm-ecosystem
    fix: Write 'a git-URL optional dependency whose prepare script launches the Bun-run payload' and list the path categories as StepSecurity does.
    class: imprecision
  - where: What detection looks like, runner-process introspection bullet
    claim: any step that reads from `/proc/*/mem` from a non-`root` process on the runner.
    defect: The memory scraper is run under sudo, so a non-root filter would miss it.
    ground_truth: 'StepSecurity: ''The orchestrator feeds this Python script to `sudo python3` via stdin'' and the captured process tree shows ''sudo python3 | tr | grep | sort'' with ''python3 reads /proc/2138/mem''.'
    ground_truth_url: https://www.stepsecurity.io/blog/mini-shai-hulud-is-back-a-self-spreading-supply-chain-attack-hits-the-npm-ecosystem
    fix: Alert on any read of Runner.Worker's /proc/<pid>/mem regardless of user (including sudo-launched interpreters).
    class: factual-error
  - where: What detection looks like (uncited generalisations)
    claim: npm's audit log surfaces this if the org has it enabled. ... GitHub-hosted runners do not need to read `/proc/<pid>/mem` for any legitimate workflow purpose.
    defect: Neither clause is stated by any page read.
    ground_truth: 'TanStack: ''No internal alerting. We learned about the compromise from a third party.'' Detection came from StepSecurity.'
    ground_truth_url: https://tanstack.com/blog/npm-supply-chain-compromise-postmortem
    fix: Remove the audit-log assurance or cite an npm doc; qualify the /proc statement as an assessment.
    class: imprecision
  - where: Hardening bullets 1, 3 and 5 (invented option and command)
    claim: '`actions/cache` with `save: false` from `pull_request_target` ... pair it with a maintainer-verified `npm provenance verify`'
    defect: 'Neither exists: actions/cache has no `save` input (restore-only is actions/cache/restore) and npm verifies provenance with `npm audit signatures`.'
    ground_truth: 'actions/cache README inputs: path, key, restore-keys, enableCrossOsArchive, fail-on-cache-miss, lookup-only; ''New actions are available for granular control over caches - restore and save''. npm docs: ''You can verify the provenance attestations of downloaded packages with the following `audit` command: `npm audit signatures`''.'
    ground_truth_url: https://github.com/actions/cache
    fix: Use actions/cache/restore for fork-reachable jobs (no save), and `npm audit signatures` for attestation checks.
    class: factual-error
  - where: Hardening bullet 1
    claim: Pin every `pull_request_target` workflow to a SHA-locked version of every action it uses; never `@main` or `@v1`. Forks cannot influence what runs.
    defect: 'Overclaim: pinning does not stop a workflow that checks out and builds the fork''s merge ref from running fork code, which was the root cause.'
    ground_truth: 'TanStack root cause: ''bundle-size.yml ran pull_request_target for fork PRs and, inside that trigger context, checked out the fork''s PR-merge ref and ran a build''. GitHub Security Lab: the danger is ''Combining pull_request_target workflow trigger with an explicit checkout of an untrusted PR''.'
    ground_truth_url: https://securitylab.github.com/resources/github-actions-preventing-pwn-requests/
    fix: Lead with 'never check out or build fork code under pull_request_target'; keep SHA pinning as a separate item without the 'forks cannot influence' sentence.
    class: imprecision
  - where: ATT&CK mappings in prose (steps 2, 3, 7)
    claim: 'T1583.001 Acquire Infrastructure: Domains-equivalent; T1199 Trusted Relationship and T1505.003 Web Shell-equivalent; T1606.002 Forge Web Credentials: SAML Tokens-equivalent for OIDC'
    defect: These ids name behaviors the sources do not describe (domains, third-party access, web shells, SAML forgery); 'equivalent' hedges do not make them mapping-valid.
    ground_truth: 'Sources describe: fork/account creation, a pull_request_target build running fork code, Actions cache poisoning, /proc/<pid>/mem token extraction, OIDC token use to publish to npm, credential-file and IMDS theft, GitHub/Session exfiltration, systemd/LaunchAgent persistence, rm -rf wiper.'
    ground_truth_url: https://tanstack.com/blog/npm-supply-chain-compromise-postmortem
    fix: Remove these inline ids and carry the mapping in techniques[] (see upgrade block).
    class: imprecision
  - where: cves[] (empty)
    claim: 'cves: []'
    defect: The TanStack compromise has a CVE (reserved 2026-05-11, published 2026-05-12, CVSS 3.1 9.6 by the GitHub CNA) and was added to CISA KEV on 2026-05-27, after this entry was filed.
    ground_truth: 'CISA KEV: CVE-2026-45321 ''TanStack Unspecified Vulnerability'', dateAdded 2026-05-27, notes cite ''https://github.com/TanStack/router/security/advisories/GHSA-g7cv-rxg3-hmpx''. CVE record: ''Malware in 42 @tanstack/* packages exfiltrates cloud credentials, GitHub tokens, and SSH keys'', CWE-506, baseScore 9.6.'
    ground_truth_url: https://github.com/TanStack/router/security/advisories/GHSA-g7cv-rxg3-hmpx
    fix: Add CVE-2026-45321 (cvss 9.6 per the GitHub CNA record; KEV 2026-05-27) via a changelog record citing the GHSA; the CVE record itself is not citable.
    class: imprecision
  - where: sources[] dates; chain step 2 (accounts)
    claim: TanStack post-mortem, 2026-05-12; fork `zblgg/configuration` created by operator `voicproducoes`
    defect: 'The post-mortem''s datePublished is 2026-05-11 (updated 2026-05-15); the sources split the fork across two attacker accounts (TanStack: zblgg, StepSecurity and NCSC-CH: voicproducoes).'
    ground_truth: 'TanStack page: datePublished 2026-05-11, dateModified 2026-05-15; ''Real attacker accounts: zblgg (id 127806521), voicproducoes (id 269549300)''; NCSC-CH: ''Fork: voicproducoes/router (fork of TanStack/router, created 2026-05-10)''.'
    ground_truth_url: https://tanstack.com/blog/npm-supply-chain-compromise-postmortem
    fix: Date the citation 2026-05-11 and write 'two attacker accounts (zblgg, voicproducoes)'.
    class: imprecision
  - where: body chain steps 1-10, payload and detection paragraphs (inline citation)
    claim: (no inline citation on steps 1-10, 'What detection looks like' or 'Hardening')
    defect: Only the opening paragraph carries citations; every technical clause that follows is uncited, which is how the unsupported details above went unchecked. Also 'No IOCs in this brief' is pipeline self-reference.
    ground_truth: 'Pages that carry the chain: TanStack post-mortem (steps 2-8), StepSecurity (steps 7-10, payload, persistence), NCSC-CH hub post 12558 (dead-man''s switch, persistence).'
    ground_truth_url: https://security-hub.ncsc.admin.ch/#/posts/12558
    fix: Bind each step to the page above that carries it; replace 'in this brief' with neutral wording.
    class: imprecision
  upgrade:
    techniques:
    - id: T1190
      behavior: 'pull_request_target ''Pwn Request'': fork PR triggers a base-repo workflow that checks out and builds fork code (closest ATT&CK fit; no CI-specific technique exists)'
      url: https://tanstack.com/blog/npm-supply-chain-compromise-postmortem
    - id: T1195.001
      behavior: Poisoned pnpm store written to the Actions cache under the key the release workflow restores
      url: https://tanstack.com/blog/npm-supply-chain-compromise-postmortem
