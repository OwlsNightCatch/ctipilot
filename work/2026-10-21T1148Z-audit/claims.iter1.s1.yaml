  entry: 2026-05-10/cpanel-whm-second-emergency-tsr-in-10-days-embargo-lifted-on
  surface: summary
  kind: frontmatter
  text: 'cPanel released fixes on 2026-05-08 for three cPanel & WHM and WP Squared flaws: CVE-2026-29202 lets an authenticated account run arbitrary Perl code as its system user through the create_user
