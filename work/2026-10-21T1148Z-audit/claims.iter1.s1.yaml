- claim_id: 3e42d92707
  entry: 2026-05-12/teampcp-unc6780-pcpjack-ecosystem-backdoors-the-checkmarx-je
  surface: summary
  kind: frontmatter
  text: A modified build 2026.5.09 of the Checkmarx Jenkins AST plugin, published to the Jenkins Marketplace outside the plugin's release pipeline, was live from 2026-05-09 01:25 to 2026-05-10 08:47 UTC;
    its payload walks an OS-specific list of file paths looking for credentials of crypto wallets, VPNs, AWS and GitHub (Checkmarx). Checkmarx says the attacker reused access obtained in the March 2026
    Trivy compromise, and TeamPCP claimed the attack, the third wave of malicious Checkmarx artifacts since late March. Checkmarx recommends rotating every credential a pipeline that ran the build could
    reach.
