  surface: summary
  kind: frontmatter
  text: West Pharmaceutical Services, a maker of injectable drug packaging, syringe and vial components and drug delivery devices, disclosed in a Form 8-K filed on 2026-05-11 that an intrusion detected
    on 2026-05-04, judged material on 2026-05-07, led to data exfiltration and the encryption of some systems. Core enterprise systems were restored and shipping, receiving and manufacturing had restarted
    at some sites with no timeline for full restoration; no ransomware group had claimed the attack as of 2026-05-13.
