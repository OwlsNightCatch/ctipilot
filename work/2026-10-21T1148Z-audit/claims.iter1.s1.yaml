- claim_id: 0aecf4d139
  entry: 2026-05-14/cve-2026-8043-ivanti-xtraction-external-file-control-cvss-9
  surface: summary
  kind: frontmatter
  text: Ivanti's May 2026 security update of 2026-05-12 fixes CVE-2026-8043 in Xtraction before version 2026.2, which lets a remote authenticated attacker read sensitive files and write arbitrary HTML files
    to a web directory (CVSS 9.6). The same batch fixes an authenticated SQL injection to remote code execution in the Endpoint Manager web console before 2024 SU6 (CVE-2026-8111, 8.8), an admin-only OS
    command injection in Virtual Traffic Manager before 22.9r4 (CVE-2026-8051, 7.2) and Secure Access Client flaws fixed in 22.8R6. Ivanti reported no exploitation in the wild.
