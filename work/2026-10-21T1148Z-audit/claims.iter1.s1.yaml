  surface: body
  kind: cited
  text: '**Defender takeaway:** for any organisation whose sensitive data is processed by a laboratory or other service provider, ask for an independent assessment of that provider''s information security,
    as IGJ now expects of Dutch healthcare providers, and confirm that legacy environments holding the data are either decommissioned or inside monitoring scope ('
