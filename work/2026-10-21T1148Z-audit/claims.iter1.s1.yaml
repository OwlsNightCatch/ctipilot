- claim_id: b2efd0c57a
  entry: 2026-05-10/braintrust-ai-evaluation-platform-aws-account-breach-multi-t
  surface: summary
  kind: frontmatter
  text: Braintrust, an AI evaluation and observability platform, discovered on 2026-05-04 that attackers had accessed one of its AWS accounts, which likely gave them the org-level API keys customers store
    with it to access AI models. At least one customer was affected and three others reported suspicious spikes in AI provider usage; Braintrust asked every customer to rotate the AI provider keys they
    store with it.
