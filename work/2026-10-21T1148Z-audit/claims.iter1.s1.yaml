- claim_id: 80bb3b4fa5
  entry: 2026-05-11/sms-blaster-smishing-establishing-itself-in-switzerland-port
  surface: summary
  kind: frontmatter
  text: BACS reported in September 2025 that fake parking-fine texts in western Switzerland were being sent with SMS blasters, portable fake base stations that pull phones within 500 to 1,000 metres onto
    2G and deliver texts with spoofed senders past the operators' SMS filters; Basel-Landschaft police arrested a suspect with such a device in November 2025. The awareness portal ebas.ch warned on 2026-05-07
    that the scam is establishing itself in Switzerland, with lures posing as authorities, banks or couriers that link to fake sites collecting card data and e-banking credentials.
