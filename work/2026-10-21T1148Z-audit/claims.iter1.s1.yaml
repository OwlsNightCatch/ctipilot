    "zero-click"}'
- claim_id: 6600bcdb66
  entry: 2026-05-13/cve-2026-45185-exim-dead-letter-use-after-free-in-bdat-chunk
  surface: body
  kind: cited
  text: 'The Exim maintainers published EXIM-Security-2026-05-01.1 (CVE-2026-45185, Critical, CVSS 9.8) on 2026-05-12 after a report from Federico Kirschbaum of XBOW on 2026-05-01: when a client sends a
    TLS close_notify alert before a BDAT body transfer is complete and follows it with a final byte in cleartext on the same TCP connection, Exim writes into a buffer already freed during the TLS teardown
    and corrupts the heap, and an attacker only needs to establish a TLS connection and use the CHUNKING (BDAT) extension ('
  urls:
  - https://exim.org/static/doc/security/EXIM-Security-2026-05-01.1/EXIM-Security-2026-05-01.1.txt
- claim_id: 6fcd16a48c
  entry: 2026-05-13/cve-2026-45185-exim-dead-letter-use-after-free-in-bdat-chunk
  surface: body
  kind: cited
  text: Exim 4.97 up to and including 4.99.2 built with USE_GNUTLS=yes are affected, OpenSSL builds are not, and 4.99.3 fixes the flaw by resetting the input-processing stack when a TLS close notification
    arrives during a BDAT transfer; there is no known mitigation other than upgrading (
  urls:
  - https://exim.org/static/doc/security/EXIM-Security-2026-05-01.1/EXIM-Security-2026-05-01.1.txt
- claim_id: 3626e62539
  entry: 2026-05-13/cve-2026-45185-exim-dead-letter-use-after-free-in-bdat-chunk
  surface: body
  kind: cited
  text: XBOW's write-up places the freed memory in Exim's TLS transfer buffer, into which the still-active BDAT receive wrapper's call to ungetc() writes a single newline, and notes that GnuTLS is the default
    TLS library on many Debian-based distributions, including Ubuntu (
  urls:
  - https://xbow.com/blog/dead-letter-cve-2026-45185-xbow-found-rce-exim
- claim_id: 6bf045433c
  entry: 2026-05-13/cve-2026-45185-exim-dead-letter-use-after-free-in-bdat-chunk
