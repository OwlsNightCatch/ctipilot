- claim_id: 66c4d32ca1
  entry: 2026-05-13/microsoft-mdash-multi-model-agentic-vulnerability-discovery
  surface: summary
  kind: frontmatter
  text: Microsoft's Autonomous Code Security team disclosed MDASH on 2026-05-12, a harness that runs more than 100 specialised AI agents across several models and that Microsoft credits with 16 CVEs in
    the Windows networking and authentication stack. Four are Critical remote code execution flaws in tcpip.sys, the IKEv2 service, Netlogon and the DNS client (CVE-2026-33827 and CVE-2026-33824, patched
    in April 2026; CVE-2026-41089 and CVE-2026-41096, patched in May 2026). MDASH is in a limited private preview with a small set of customers.
