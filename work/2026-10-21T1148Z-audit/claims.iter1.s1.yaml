  surface: summary
  kind: frontmatter
  text: 'BSI''s advisory WID-SEC-2026-1435 of 2026-05-08 lists CVE-2025-69690 in Netgate pfSense CE 2.7.2 and CVE-2025-69691 in pfSense CE 2.8.0 as critical: both let an authenticated administrator run
    code as root, through a crafted configuration backup and through the XMLRPC method pfsense.exec_php. The researcher says Netgate acknowledged the reports but will issue no patch, and the CVE records
    note that the supplier disputes both because the functions are available only to administrators.'
