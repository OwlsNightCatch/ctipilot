  entry: 2026-05-13/cve-2026-45185-exim-dead-letter-use-after-free-in-bdat-chunk
  surface: headline
  kind: frontmatter
  text: Exim 4.99.3 fixes an unauthenticated use-after-free in BDAT handling on GnuTLS builds (CVE-2026-45185)
- claim_id: cea3422760
  entry: 2026-05-13/cve-2026-45185-exim-dead-letter-use-after-free-in-bdat-chunk
  surface: summary
  kind: frontmatter
  text: 'Exim 4.99.3, released on 2026-05-12, fixes CVE-2026-45185 (CVSS 9.8), a remotely reachable use-after-free in the GnuTLS backend: a client that sends a TLS close_notify before a BDAT body is complete
    and then one cleartext byte makes Exim write into its freed TLS transfer buffer, corrupting the heap. It affects Exim 4.97 to 4.99.2 built with GnuTLS that advertise STARTTLS and CHUNKING; GnuTLS is
    the default TLS library on many Debian-based distributions including Ubuntu, and the only mitigation is the upgrade.'
- claim_id: 839c736753
