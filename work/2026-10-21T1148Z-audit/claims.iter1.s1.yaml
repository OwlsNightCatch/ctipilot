  entry: 2026-05-10/jdownloader-official-site-compromised-windows-and-linux-inst
  surface: headline
  kind: frontmatter
  text: JDownloader site hack repointed Windows alternative-installer and Linux shell links to malware on 6 and 7 May 2026
- claim_id: 29c05bbd1c
  entry: 2026-05-10/jdownloader-official-site-compromised-windows-and-linux-inst
  surface: summary
  kind: frontmatter
  text: Attackers exploited an unpatched flaw in the content management system of jdownloader.org, the site of the free JDownloader download manager, and from about 00:01 UTC on 2026-05-06 until the server
    was shut down on 2026-05-07 pointed its Windows "Download Alternative Installer" links and its Linux shell installer link to malicious files. The Windows files load a Python-based RAT and the Linux
    installer plants a SUID-root binary and a login-script persistence; anyone who ran one is advised to reinstall the operating system.
