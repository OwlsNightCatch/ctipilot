- claim_id: df4326446c
  entry: 2026-05-14/dutch-igj-rules-clinical-diagnostics-nmdl-failed-nen-7510-in
  surface: record 2026-10-21T20:23:07Z
  kind: record-summary
  text: IGJ asked Clinical Diagnostics to demonstrate NEN 7510 compliance at short notice rather than demanding certification, the company reports a positive external audit, and IGJ's call on all healthcare
    providers to prove compliance, including at their labs, comes from Computable's account of the inspection. No source compares NEN 7510 with Switzerland's EPDG or describes Swiss providers, and IGJ says
    compliance could have reduced the likelihood and limited the consequences of the hack rather than calling the breach scale their proximate result. The Nova attribution and the count of about 941,000
    people come from press reporting, and the lab could not confirm the full extent; a Dutch regulatory finding on a breach outside Switzerland moves from high to notable priority.
