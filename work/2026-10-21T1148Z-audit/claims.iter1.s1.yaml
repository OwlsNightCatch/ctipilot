- claim_id: d54a1778ed
  entry: 2026-05-14/dutch-igj-rules-clinical-diagnostics-nmdl-failed-nen-7510-in
  surface: summary
  kind: frontmatter
  text: The Dutch Health and Youth Care Inspectorate (IGJ) found on 2026-05-13 that Clinical Diagnostics LCPL and NMDL in Rijswijk did not meet the statutory NEN 7510 information-security standard during
    the July 2025 data hack or at a December 2025 inspection visit, citing no independent audit and no periodic risk assessment. According to Computable, attackers used a compromised account without multi-factor
    authentication in legacy environments that had dropped out of SOC monitoring, and data of about 941,000 people, mostly cervical-cancer screening participants, was viewed or stolen. IGJ cannot impose
    penalties, the Dutch data protection authority can and is investigating, and IGJ is calling on healthcare providers to prove NEN 7510 compliance, including at the labs they use.
