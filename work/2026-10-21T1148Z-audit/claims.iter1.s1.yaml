  entry: 2026-05-14/dutch-igj-rules-clinical-diagnostics-nmdl-failed-nen-7510-in
  surface: body
  kind: cited
  text: '**Detection:** what hid this intrusion was monitoring coverage, not missing signatures: legacy environments that were still reachable had been dropped from SOC collection as inactive, and the account
