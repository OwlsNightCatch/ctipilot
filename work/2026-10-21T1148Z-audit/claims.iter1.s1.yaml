- claim_id: d64aa647f2
  entry: 2026-05-12/koda-auto-deutschland-online-shop-breach-exposes-customer-pi
  surface: summary
  kind: frontmatter
  text: Škoda Auto Deutschland disclosed in May 2026 that unauthorised parties exploited a vulnerability in the standard shop software of its German accessories shop and gained temporary access to the shop
    system, which stores names, addresses, contact details, orders and account credentials with hashed passwords. Its logs cannot show whether or how much data was copied; full card data is not stored in
    the shop, and other Škoda shops, the manufacturer's systems and Škoda Connect are not affected.
