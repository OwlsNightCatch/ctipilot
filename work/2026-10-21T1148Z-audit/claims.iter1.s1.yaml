  surface: summary
  kind: frontmatter
  text: Foxconn confirmed on 2026-05-12 that some of its North American factories suffered a cyberattack and were resuming normal production, after the Nitrogen ransomware group claimed on 2026-05-11 to
    have stolen 8 TB, more than 11 million files of instructions, project documentation and technical drawings related to Intel, Apple, Google, Dell and Nvidia projects; Foxconn declined to confirm that
    any customer data was taken. Workers at the Mount Pleasant, Wisconsin plant reported a network outage from 2026-05-01, and Coveware has documented a bug in Nitrogen's ESXi encryptor that leaves files
    unrecoverable even by the attackers.
