  text: 'ICO fines South Staffordshire £963,900: a 20-month phishing foothold, ZeroLogon on two DCs and only 5% of IT monitored'
- claim_id: 84d0ba6a60
  entry: 2026-05-12/ico-fines-south-staffordshire-water-963-900-water-sector-oes
  surface: summary
  kind: frontmatter
  text: The UK ICO fined South Staffordshire Plc and South Staffordshire Water Plc £963,900 under UK GDPR on 2026-05-11 for an attack in which a phishing attachment opened in September 2020 gave an attacker
    a foothold that went undetected for 20 months, followed by domain-admin compromise from May 2022 with ZeroLogon (CVE-2020-1472) exploited on two unpatched domain controllers; the personal data of 633,887
    people was published on the dark web. The ICO found that only 5% of the IT environment was monitored, Windows Server 2003 was still in use and no regular vulnerability scans were run.
