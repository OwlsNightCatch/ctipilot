- claim_id: b4ca050027
  entry: 2026-05-14/cve-2026-8043-ivanti-xtraction-external-file-control-cvss-9
  surface: record 2026-10-21T20:20:51Z
  kind: record-summary
  text: CVE-2026-8043 in Ivanti Xtraction is a file-read and arbitrary HTML-write flaw leading to information disclosure and possible client-side attacks, not remote code execution or a web-shell route,
    and Endpoint Manager is affected before 2024 SU6 rather than up to and including it. No source describes where Xtraction is deployed, an exploitation window starting 2026-04-01 or initial-access brokers
    abusing these flaws; Ivanti's no-exploitation statement comes from its own blog. Every flaw in the batch needs authentication and none was exploited, so the batch is a regular-cycle patch rather than
    a high-priority item.
