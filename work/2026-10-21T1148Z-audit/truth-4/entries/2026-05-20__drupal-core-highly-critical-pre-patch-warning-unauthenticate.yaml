- entry: 2026-05-20/drupal-core-highly-critical-pre-patch-warning-unauthenticate
  verdict: factual-error
  defects:
  - where: cves[CVE-2026-9082].cvss
    claim: 'cvss: "6.5"'
    defect: 6.5 is the NVD-side score; the numbering authority (Drupal, CNA) scores CVE-2026-9082 CVSS 3.1 9.8 CRITICAL and ENISA EUVD carries that score. Also affected/fixed are null and type is rce although the advisory describes SQL injection that leads to RCE only "in some cases".
    ground_truth: 'EUVD-2026-31153 (assigner drupal): baseScore 9.8, CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H, exploitedSince "May 22, 2026"; affected "from 8.9.0 before 10.4.10, from 10.5.0 before 10.5.10, from 10.6.0 before 10.6.9, from 11.0.0 before 11.1.10, from 11.2.0 before 11.2.12, from 11.3.0 before 11.3.10". BleepingComputer: NIST rates it "medium severity based on a CVSS v3 score of 6.5".'
    ground_truth_url: https://euvd.enisa.europa.eu/vulnerability/EUVD-2026-31153
    fix: cvss "9.8" (vector CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H); type sqli (RCE conditional); fill affected/fixed from the SA table; add Drupal risk score 23/25 where scores are discussed.
    class: factual-error
  - where: evidence[2]; evidence[0]
    claim: 'quote: "Imperva sees more than 15,000 exploit attempts against around 6,000 Drupal websites in 65 countries" (publisher Imperva); quote: "Drupal confirmed: exploit attempts are now being detected in the wild" (publisher BleepingComputer)'
    defect: Neither is a contiguous passage of its cited page. Imperva wrote "attack attempts" (not exploit attempts) and described mostly probing; BleepingComputer paraphrases and quotes the advisory in a different sentence.
    ground_truth: 'Imperva: "Since CVE-2026-9082 was released, Imperva has observed over 15,000 attack attempts targeting almost 6,000 individual sites across 65 countries." and "Most of the observed activity so far appears to be probing." BleepingComputer: "In an update to the advisory on May 22, Drupal confirmed that exploitation attempts have been detected." SA: "The risk score has been updated to reflect that exploit attempts are now being detected in the wild."'
    ground_truth_url: https://www.imperva.com/blog/imperva-customers-protected-against-cve-2026-9082-in-drupal-core/
    fix: Replace with the verbatim Imperva sentence and the SA update line; do not call Imperva's count exploitation.
    class: factual-error
  - where: body paragraph 1, sentence 2
    claim: scores the flaw 20/25 on Drupal's own published security scale — the second-highest tier — ... meaning exploitation is unauthenticated and requires no special conditions; the chained score sits below the theoretical 25/25 only because the Drupal Security Team rates the affected configuration as "Uncommon"
    defect: Highly critical (20-25) is the highest tier. 20/25 is below 25 for two reasons (E:Theoretical +1 instead of Exploit +4, TD:Uncommon +1 instead of All +3), not one; and TD:Uncommon is itself a special condition ("only uncommon module configurations are exploitable").
    ground_truth: 'Drupal risk levels: "20 to 25 is considered Highly Critical" (top tier). PSA: "Highly critical 20 / 25 AC:None/A:None/CI:All/II:All/E:Theoretical/TD:Uncommon". The Register: "The only two things preventing it from scoring a perfect 25/25 are the fact that a known exploit doesn''t exist yet and that it doesn''t affect all configurations".'
    ground_truth_url: https://www.drupal.org/drupal-security-team/security-risk-levels-defined
    fix: '"20/25 (Highly critical, the top tier), held below 25 because no exploit existed yet and only uncommon configurations were affected; AC:None and A:None mean anonymous exploitation by visiting a page." The advisory now reads 23/25 with E:Exploit.'
    class: factual-error
  - where: body paragraph 1, sentence 5
    claim: Drupal also reserved manual emergency patch files for EOL branches 8.9, 9.5, 10.4 (→ 10.4.9) and 11.1 (→ 11.1.9)
    defect: The PSA provides manual patch files only for 8.9 and 9.5. Sites on 10.4/10.x and 11.1/11.0 were told to update to at least 10.4.9 / 11.1.9 ahead of the window and received security releases (10.4.10 / 11.1.10) on 2026-05-20.
    ground_truth: 'PSA: "we will provide patch files for Drupal 8.9 and 9.5" and "These patches must be applied manually."; "Sites on Drupal 11.1 or 11.0 should update to at least Drupal 11.1.9." SA: "If you use Drupal 11.1.x or 11.0.x, update to Drupal 11.1.10." "If you use Drupal 10.4.x or earlier, update to Drupal 10.4.10."'
    ground_truth_url: https://www.drupal.org/psa-2026-05-18
    fix: '"Security releases also cover the EOL minors 11.1.x and 10.4.x (update to 11.1.10 / 10.4.10); only Drupal 8.9 and 9.5 get patch files that must be applied manually."'
    class: factual-error
  - where: body paragraph 2; section 2026-05-21T05:00:07Z
    claim: No technical mitigation exists pre-patch.
    defect: The PSA states the issue is protected by Drupal Steward, and The Register and CSO Online report Steward customers were protected against known attack vectors before and at release. The advisory itself promised mitigation information.
    ground_truth: 'PSA: "This issue is being protected by Drupal Steward." and "Mitigation information will be included in the advisory." The Register: "sites using Drupal Steward, its paid web application firewall service, are protected against known attack vectors". CSO: "Sites that use the Drupal Steward web application firewall are already protected from known attack vectors".'
    ground_truth_url: https://www.drupal.org/psa-2026-05-18
    fix: '"Drupal Steward (paid WAF) protects known attack vectors from the advisory onward; no other mitigation was published pre-patch."'
    class: factual-error
  - where: body paragraph 2 ("Why it matters to us")
    claim: Drupal is the dominant CMS for Swiss federal / cantonal / municipal portals, European Commission and EU-agency sites, universities, and public-sector NGOs.
    defect: Uncited absolute quantifier; for Swiss federal sites the Federal Administration documents a different CMS.
    ground_truth: 'bk.admin.ch: SS Web, "the Swiss Federal Administration''s centralised standard service for managing and publishing web content ... is based on a modified version of Livingdocs"; Innosuisse: "All of the Swiss Confederation''s websites are migrating to a single content management system (CMS), Livingdocs." No page read names Drupal as dominant in Switzerland.'
    ground_truth_url: https://www.bk.admin.ch/en/standard-service-websites
    fix: Drop "dominant" and the Swiss/EU prevalence claims, or replace by a cited statement such as "Drupal powers hundreds of thousands of websites" (SecurityWeek) and tell readers to inventory their own Drupal instances.
    class: factual-error
  - where: section 2026-05-21T05:00:07Z, second paragraph
    claim: 'Affected versions: 8.9.0 through 10.4.10, 10.5.x < 10.5.10, 10.6.x < 10.6.9, 11.0.0 through 11.1.10, 11.2.x < 11.2.12, 11.3.x < 11.3.10.'
    defect: '"through 10.4.10" and "through 11.1.10" list the fixed releases as affected; the advisory ranges end below those versions.'
    ground_truth: 'SA affected versions: ">= 8.9.0 < 10.4.10 || >= 10.5.0 < 10.5.10 || >= 10.6.0 < 10.6.9 || >= 11.0.0 < 11.1.10 || >= 11.2.0 < 11.2.12 || >= 11.3.0 < 11.3.10".'
    ground_truth_url: https://www.drupal.org/sa-core-2026-004
    fix: '"8.9.0 up to (not including) 10.4.10; 10.5.0 < 10.5.10; 10.6.0 < 10.6.9; 11.0.0 < 11.1.10; 11.2.0 < 11.2.12; 11.3.0 < 11.3.10."'
    class: factual-error
  - where: section 2026-05-23T05:00:10Z, first paragraph
    claim: also recording the addition of CVE-2026-9082 to the CISA Known Exploited Vulnerabilities catalog on 2026-05-22 (the NCSC-CH post is the brief's source of record on the KEV add; the CISA news-events alert URL constructed earlier in the day returned a 404 at composition time)
    defect: The NCSC.ch post never mentions CISA or KEV (its 22.05 update only records active exploitation). The KEV addition is real but only the CISA catalog carries it. The parenthesis is pipeline-internal narration.
    ground_truth: 'NCSC post 12584 update 22.05.2026: "Current exploitation status: Actively exploited ... The Vendor advisory was updated to mention that exploit attempts are now being detected in the wild". CISA KEV catalog (cisa-kev recipe, catalog 2026.10.20): CVE-2026-9082 dateAdded 2026-05-22, dueDate 2026-05-27, Drupal Core SQL injection.'
    ground_truth_url: https://security-hub.ncsc.admin.ch/#/posts/12584
    fix: State the KEV listing on its own clause cited to the CISA catalog entry (or the CVE record's CISA-ADP kev block); delete the parenthesis.
    class: factual-error
  - where: immediate_action; section 2026-05-23T05:00:10Z second paragraph
    claim: Imperva reports observing **15,000+ exploitation attempts against approximately 6,000 Drupal sites across 65 countries** within days of disclosure
    defect: Imperva counts "attack attempts" and says most of it is probing; calling them exploitation attempts overstates it. The 6,000 sites/65 countries figure is Imperva customer telemetry.
    ground_truth: 'Imperva: "Imperva has observed over 15,000 attack attempts targeting almost 6,000 individual sites across 65 countries." "Most of the observed activity so far appears to be probing." "Attacks are primarily targeting Gaming and Financial Services sites so far, at collectively almost 50% of all attacks."'
    ground_truth_url: https://www.imperva.com/blog/imperva-customers-protected-against-cve-2026-9082-in-drupal-core/
    fix: '"Imperva observed over 15,000 attack attempts against almost 6,000 sites in 65 countries, mostly probing" and cite it.'
    class: imprecision
  - where: section 2026-05-23T05:00:10Z second paragraph (technical mechanism)
    claim: on the case-insensitive `IN` operator path through `core/lib/Drupal/Core/Entity/Query/Sql/Condition::compile()` / `ConditionAggregate::compile()`, a JSON-encoded array value survives into the SQL placeholder name without sanitisation
    defect: The vulnerable loop is the PostgreSQL override in core/modules/pgsql/src/EntityQuery/Condition.php; it is attacker-controlled array keys (not values) that become the placeholder name. The two core/lib compile() methods are where the fix adds array_values().
    ground_truth: 'Searchlight: "an unauthenticated JSON object survives into the SQL placeholder name on the case-insensitive `IN` path"; "If the caller hands the entity query an associative array, `$key` can be any string, and that string ends up inside the SQL."; "two anonymous entry points ... the JSON login endpoint and the JSON:API filter syntax".'
    ground_truth_url: https://slcyber.io/research-center/keys-to-the-kingdom-anonymous-sql-injection-in-drupal-core-cve-2026-9082/
    fix: '"Attacker-controlled array keys (JSON object keys on the anonymous JSON login endpoint and the JSON:API filter syntax) reach the placeholder name built by the PostgreSQL entity-query override of the case-insensitive IN path."'
    class: imprecision
  - where: actions[0]; section 2026-05-23T05:00:10Z last sentence of paragraph 2
    claim: MySQL/MariaDB/SQLite backends are unaffected — if patching slips, swap the backend as a temporary control. / which is the temporary control to fall back on if the patch window slips past today.
    defect: No source proposes replacing the database backend as a control; the stated protections are patching and the Drupal Steward WAF.
    ground_truth: 'SA: "This SQL injection vulnerability only affects sites using PostgreSQL." CSO: "Sites that use the Drupal Steward web application firewall are already protected from known attack vectors, but should upgrade in the near future".'
    ground_truth_url: https://www.csoonline.com/article/4175329/drupal-admins-rushing-to-patch-maximum-severity-sql-injection-vulnerability.html
    fix: Replace with the sourced interim control (Drupal Steward WAF where subscribed) and keep "only PostgreSQL is affected" as exposure, not as a control.
    class: factual-error
  - where: immediate_action; updates[0].summary; section 2026-05-23T05:00:10Z paragraph 3
    claim: Swiss federal and cantonal portals, EU institution Drupal instances, and academic SWITCH-hosted sites running PostgreSQL backends are direct targets. / EU/CH government portals and university CMSes are the primary exposed surface / Drupal-on-PostgreSQL is widespread across FITKO and SWITCH-hosted university sites, French `gouvernement.fr` instances and EU institution portals.
    defect: No linked source names these organisations or sectors as targeted or as running Drupal on PostgreSQL; FITKO, SWITCH and gouvernement.fr appear in no source. Imperva reports Gaming and Financial Services as the main targets.
    ground_truth: 'Imperva: "Attacks are primarily targeting Gaming and Financial Services sites so far, at collectively almost 50% of all attacks." NCSC.ch post carries no sector or victim statement.'
    ground_truth_url: https://www.imperva.com/blog/imperva-customers-protected-against-cve-2026-9082-in-drupal-core/
    fix: Remove the targeting and prevalence assertions; keep the sourced exposure rule (Drupal core on PostgreSQL, versions per SA) and let readers inventory their own instances.
    class: factual-error
  - where: section 2026-05-21T05:00:07Z paragraph 1 (stale score, supersession)
    claim: rated **20/25 on Drupal's risk scale (Highly Critical)**
    defect: The advisory score was raised on 2026-05-22 to 23/25 when exploitation began; the entry's newest section, immediate_action and summary never carry it, and the advisory page the clause cites now shows 23/25.
    ground_truth: 'SA now: "Highly critical 23 / 25 AC:None/A:None/CI:All/II:All/E:Exploit/TD:Uncommon"; "May 22 2026, 04:30 UTC: The risk score has been updated to reflect that exploit attempts are now being detected in the wild." BleepingComputer: "assigning it an internal score of 23 out of 25".'
    ground_truth_url: https://www.drupal.org/sa-core-2026-004
    fix: Say "20/25 at disclosure, raised to 23/25 on 2026-05-22 (E:Exploit)".
    class: imprecision
  - where: section 2026-05-21T05:00:07Z paragraph 2 (citation binding)
    claim: Drupal 7 is unaffected; sites on EOL Drupal 8/9 majors must apply manual patch files. [Drupal Steward WAF](https://www.drupal.org/steward) subscribers receive vendor-provided rules at advisory release
    defect: The Steward page carries only the WAF clause ("The rule is live the moment the advisory is."); the Drupal 7 and Drupal 8/9 clauses are carried by the PSA and SA. The SA says "try manually applying" (best effort), not "must".
    ground_truth: 'SA: "If you use any version of Drupal 9, try manually applying the Drupal 9.5 patch for this issue." "unsupported releases and patches for unsupported versions are provided as a best effort". PSA: "Drupal 7 is not affected."'
    ground_truth_url: https://www.drupal.org/sa-core-2026-004
    fix: Cite the PSA for Drupal 7 and the SA for 8.9/9.5 best-effort patches; keep Steward as its own clause.
    class: imprecision
  - where: section 2026-05-21T05:00:07Z paragraph 1
    claim: successful exploitation leads to information disclosure, privilege escalation and — in some database configurations — RCE.
    defect: The advisory says "in some cases", applying to privilege escalation and RCE alike; "database configurations" is not in the source.
    ground_truth: 'SA: "This can lead to information disclosure, and in some cases privilege escalation, remote code execution, or other attacks."'
    ground_truth_url: https://www.drupal.org/sa-core-2026-004
    fix: Use the advisory sentence.
    class: imprecision
  - where: body paragraph 1, quoted phrase with SecurityWeek link
    claim: The Security Team explicitly notes ["exploits might be developed within hours or days"](https://www.securityweek.com/drupal-to-patch-highly-critical-vulnerability-at-risk-of-quick-exploitation/)
    defect: The quoted wording is the PSA's; SecurityWeek paraphrases it ("might" be created within hours or days). Link the PSA or a page that reproduces the sentence.
    ground_truth: 'PSA/Register/THN: "The Drupal Security Team urges you to reserve time for core updates at that time because exploits might be developed within hours or days." SecurityWeek: "They believe an exploit for the vulnerability “might” be created within hours or days of disclosure."'
    ground_truth_url: https://thehackernews.com/2026/05/drupal-to-release-urgent-core-security.html
    fix: Cite https://www.drupal.org/psa-2026-05-18 on that quotation.
    class: imprecision
  - where: title; headline; summary; tags; section 2026-05-21T05:00:07Z and 2026-05-23T05:00:10Z (pipeline self-reference, supersession)
    claim: Drupal core "highly critical" pre-patch warning — ... patch window today 17:00–21:00 UTC / tags no-patch / "Yesterday's brief carried Drupal's PSA pre-warning" / "Defender vantage update from yesterday's brief ... the § 0 Immediate Action carries the operational framing" / "the brief's source of record"
    defect: Title, headline and summary still describe the 2026-05-20 pre-patch state although the entry now documents a patched, exploited, KEV-listed CVE; tag no-patch contradicts patch-available; the update sections refer to "yesterday's brief" and "§ 0".
    ground_truth: 'SA (2026-05-20, updated 2026-05-22): patches released for all listed branches; exploit attempts detected in the wild; KEV dateAdded 2026-05-22.'
    ground_truth_url: https://www.drupal.org/sa-core-2026-004
    fix: Retitle around CVE-2026-9082 (Drupal core PostgreSQL SQL injection, exploited, KEV), rewrite the summary to the current state, drop no-patch and the brief self-references.
    class: imprecision
  upgrade:
    techniques:
    - id: T1190
      behavior: Anonymous SQL injection against an internet-facing Drupal site on PostgreSQL via the JSON login endpoint or the JSON:API filter syntax (array keys flow into the SQL placeholder name)
      url: https://slcyber.io/research-center/keys-to-the-kingdom-anonymous-sql-injection-in-drupal-core-cve-2026-9082/
    rating:
      reliability: A
      credibility: 1
      basis: Drupal Security Team is the vendor authority and confirmed in-the-wild exploit attempts; CISA KEV (2026-05-22) and Imperva telemetry are independent of Drupal; NCSC.ch restates the vendor advisory. Imperva's activity is mostly probing.
    exposure:
    - quote: A vulnerability in this API allows an attacker to send specially crafted requests, resulting in arbitrary SQL injection for sites using PostgreSQL databases.
      url: https://www.drupal.org/sa-core-2026-004
    - quote: only affects sites using PostgreSQL
      url: https://www.drupal.org/sa-core-2026-004
    - quote: This vulnerability can be exploited by anonymous users.
      url: https://www.drupal.org/sa-core-2026-004
    detection:
    - quote: The payloads in the attached Imperva data largely focus on JSON:API routes, particularly /jsonapi/node/article, and use crafted filter parameters designed to test whether a target is vulnerable.
      url: https://www.imperva.com/blog/imperva-customers-protected-against-cve-2026-9082-in-drupal-core/
    - quote: 'There are two anonymous entry points that we have confirmed reach this loop with attacker-controlled array keys: the JSON login endpoint and the JSON:API filter syntax.'
      url: https://slcyber.io/research-center/keys-to-the-kingdom-anonymous-sql-injection-in-drupal-core-cve-2026-9082/
    triage: []
    takeaway:
    - quote: updating these dependencies is highly recommended whether the SQL Injection vulnerability affects you or not
      url: https://www.drupal.org/sa-core-2026-004
    - quote: Sites that use the Drupal Steward web application firewall are already protected from known attack vectors, but should upgrade in the near future in case additional attack vectors are discovered
      url: https://www.csoonline.com/article/4175329/drupal-admins-rushing-to-patch-maximum-severity-sql-injection-vulnerability.html
