      url: https://www.bleepingcomputer.com/news/linux/exploit-released-for-new-pintheft-arch-linux-root-escalation-flaw/
    bodies:
    - work/2026-10-21T1148Z-audit/truth-4/bodies/oss-security-pintheft.txt
    - work/2026-10-21T1148Z-audit/truth-4/bodies/bc-pintheft.txt
    - work/2026-10-21T1148Z-audit/truth-4/bodies/cveawg-cve-2026-43494.txt
