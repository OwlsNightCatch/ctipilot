duplicate_groups:
  - entries:
      - 2026-05-20/drupal-core-highly-critical-pre-patch-warning-unauthenticate
      - 2026-05-20/prepare-emergency-drupal-patch-window-for-today-17-00-21-00
    proposed_survivor: 2026-05-20/drupal-core-highly-critical-pre-patch-warning-unauthenticate
    why: >
      One finding, one disclosure: the Drupal Security Team PSA-2026-05-18 pre-announcement of the 2026-05-20 17:00-21:00 UTC
      core release. Both entries cite exactly the same two primaries (PSA-2026-05-18 and NCSC.ch Security Hub post 12584),
      carry the same facts (20/25 Highly critical, AC:None/A:None, branches 10.5.x/10.6.x/11.2.x/11.3.x plus EOL patch files,
      "exploits might be developed within hours or days") and even repeat the same errors (second-highest tier, manual patches
      for 10.4/11.1, no mitigation). The second entry is the v2 brief's Immediate Action callout for the item the first
      entry reports (the survivor's own 2026-05-23 section says "the § 0 Immediate Action carries the operational framing").
      The survivor already absorbed the SA-CORE-2026-004 / CVE-2026-9082 patch and the KEV and exploitation updates through
      two merged_from records, carries cves[], 11 sources and an immediate_action block; the twin has cves: [] and nothing
      sourced that the survivor lacks (its change-control advice is unsourced author advice).
    action: fold 2026-05-20/prepare-emergency-drupal-patch-window-for-today-17-00-21-00 into the survivor
pair_decisions:
  - pair:
      - 2026-05-20/drupal-core-highly-critical-pre-patch-warning-unauthenticate
      - 2026-05-20/prepare-emergency-drupal-patch-window-for-today-17-00-21-00
    decision: one finding (duplicate group above)
  - pair:
      - 2026-05-20/cve-2026-41091-microsoft-defender-engine-link-following-eop
      - 2026-05-20/cve-2026-45584-microsoft-defender-engine-heap-buffer-overflo
    decision: two distinct findings, keep both, no fold
    why: >
      Different flaws with different MSRC records: CVE-2026-41091 is a local link-following privilege escalation (CWE-59, CVSS 7.8,
      exploited=Yes, publiclyDisclosed=Yes, CISA KEV 2026-05-20) and CVE-2026-45584 is a heap-based buffer overflow RCE (CWE-122,
      CVSS 8.1, AC:H, exploited=No, publiclyDisclosed=No, not in KEV). Different attack surface (local authorized attacker vs
      remote unauthenticated attacker who needs a local user to act), different exploitation status, different priority and
      defender action (hunt for exploitation vs patch). They share only the vendor, the 2026-05-19 release and the fixed
      engine build 1.1.26040.8. Recommendation: cross-link them with references[] and add CVE-2026-45584 to the cves[] of
      the 41091 entry (or drop it from that entry's actions[0]), since actions[0] there already names it.
