    text: "CVE-2026-41091 — Microsoft Defender Engine link-following EoP confirmed exploited in the wild and publicly disclosed. Engine ≤1.1.26030.3008 grants SYSTEM via CWE-59 link following; Engine 1.1.26040.8 auto-remediates via signature channel (MSRC CVE-2026-41091, 2026-05-19). Air-gapped or auto-update-blocked endpoints remain vulnerable."
  - claim_id: 0938019a1e
    entry: 2026-05-20/cve-2026-41091-microsoft-defender-engine-link-following-eop
    surface: "actions[0]"
    kind: frontmatter
    text: "**Verify Microsoft Defender Engine ≥ 1.1.26040.8 across the Windows estate.** Run `Get-MpComputerStatus` and confirm `AMEngineVersion` ≥ 1.1.26040.8. Closes both CVE-2026-41091 (actively exploited LPE to SYSTEM) and CVE-2026-45584 (network RCE in Defender). For hosts with auto-updates blocked (GPO \"Turn off routine remediation\"), push the Engine signature update manually ([MSRC CVE-2026-41091](https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-41091))."
  - claim_id: a31056ef3b
    entry: 2026-05-20/cve-2026-41091-microsoft-defender-engine-link-following-eop
    surface: "actions[1]"
    kind: frontmatter
    text: "**Verify Defender Antimalware Engine >= 1.1.26040.8 (LPE fix) AND Platform >= 4.18.26040.7 (DoS fix)** — CVE-2026-41091 (SYSTEM LPE via MsMpEng.exe link-following) confirmed ITW; run `Get-MpComputerStatus | Select AMEngineVersion, AMProductVersion` on all Windows endpoints. `AMProductVersion` alone does not confirm the LPE is patched — check `AMEngineVersion`. Environments using delayed-approval WSUS/Intune update rings may not have received the out-of-band engine update yet — approve immediately."
