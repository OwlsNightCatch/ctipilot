    entry: 2026-05-20/sparx-enterprise-architect-pro-cloud-server-five-cve-chain-p
    surface: "body"
    kind: uncited
    text: "The URL query parameter `model` is checked at the auth gate; the model name resent only inside the binary blob bypasses it, enabling unauthenticated arbitrary SQL query execution (read + write) against any configured repository database. - **CVE-2026-42096** (CWE-863) — Authenticated SQL injection in an exposed database API endpoint; any authenticated user can inject arbitrary SQL. - **CVE-2026-42099** (CWE-362, CVSS4 7.7) — Race condition in `/data_api/dl_internal_artifact.php`."
