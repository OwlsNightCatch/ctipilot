    urls: ["https://www.openwall.com/lists/oss-security/2026/05/19/6", "https://www.bleepingcomputer.com/news/linux/exploit-released-for-new-pintheft-arch-linux-root-escalation-flaw/"]
  - claim_id: 77f423a5e5
    entry: 2026-05-21/pintheft-linux-kernel-local-privilege-escalation-primitive-r
    surface: "body"
    kind: uncited
    text: "The bug lives in `rds_message_zcopy_from_user()` in the RDS send path: a partial page fault mid-scatter causes the error path to drop already-pinned pages while leaving the scatterlist bookkeeping live, so cleanup drops the pages a second time."
  - claim_id: b7670461bb
    entry: 2026-05-21/pintheft-linux-kernel-local-privilege-escalation-primitive-r
    surface: "body"
    kind: uncited
    text: "The exploit registers an anonymous memory page as an `io_uring` fixed buffer (`FOLL_PIN` bias of 1024 references), drains all references via 1024 deliberately-failing RDS sends, then reuses the stale `io_uring` page pointer to overwrite the page cache of a SUID-root binary and redirect execution to attacker shellcode."
  - claim_id: 42741d7b4b
    entry: 2026-05-21/pintheft-linux-kernel-local-privilege-escalation-primitive-r
    surface: "body"
    kind: uncited
    text: "Prerequisites: RDS kernel module loaded, `io_uring` enabled, a readable SUID-root binary, x86_64."
