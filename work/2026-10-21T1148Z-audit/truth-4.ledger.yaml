    kind: uncited
    text: "Requires the WebEA component. - **CVE-2026-42098** (CWE-603, CVSS4 8.7) — Client-side authentication in Enterprise Architect ≤17.1: RBAC is enforced in the client binary, so any authenticated user who patches the binary can log in as any other user (including administrator) and perform arbitrary repository modifications. - **CVE-2026-42100** (CWE-835) — Malformed SQL crashes the Pro Cloud Server service (DoS)."
