    surface: "body"
    kind: uncited
    text: "An attacker who can stage a repository file controls both filename and contents written to `__DIR__`; a slow-client timing attack keeps the PHP file live during transmission so a parallel HTTP request executes it — RCE in the web-server context."
  - claim_id: f5d47f4265
    entry: 2026-05-20/sparx-enterprise-architect-pro-cloud-server-five-cve-chain-p
