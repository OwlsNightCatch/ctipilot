    text: "With four accounts compromised, the actor: reset passwords, removed existing MFA methods (phone, email, Authenticator registrations), enrolled Microsoft Authenticator on attacker-controlled devices, and locked the legitimate users out."
  - claim_id: 41a9cabb65
    entry: 2026-05-20/storm-2949-sspr-to-key-vault-azure-kill-chain
    surface: "body"
    kind: uncited
    text: "Microsoft notes: [\"Storm-2949 leveraged a social engineering technique consistent with known abuses of Microsoft's Self-Service Password Reset (SSPR) process."
  - claim_id: c488ffe18a
    entry: 2026-05-20/storm-2949-sspr-to-key-vault-azure-kill-chain
    surface: "body"
    kind: uncited
    text: "In such attacks, a threat actor initiates the SSPR process on behalf of a targeted user and subsequently employs social engineering tactics to persuade the user to complete multifactor authentication (MFA) prompts that appear to be legitimate.\"](https://www.microsoft.com/en-us/security/blog/2026/05/18/storm-2949-turned-compromised-identity-into-cloud-wide-breach/)"
  - claim_id: 1372d5152a
    entry: 2026-05-20/storm-2949-sspr-to-key-vault-azure-kill-chain
    surface: "body"
    kind: uncited
    text: "**Phase 2 — M365 discovery and exfiltration.** With four hijacked identities, the actor authenticated to Microsoft Graph from custom Python tooling, enumerated users, roles, applications, and service principals across the tenant, and exfiltrated thousands of files from OneDrive and SharePoint — selecting VPN configuration documents and remote-access procedures as a lateral-movement springboard."
  - claim_id: 8a6c9e1026
    entry: 2026-05-20/storm-2949-sspr-to-key-vault-azure-kill-chain
    surface: "body"
    kind: uncited
    text: "**Phase 3 — Azure App Service to Key Vault pivot.** Using a privileged custom Azure RBAC role accessible to one of the compromised principals, Storm-2949 invoked `microsoft.Web/sites/publishxml/action` on secondary App Service instances — auxiliary apps hosting internal authentication and API surfaces — extracting basic-auth FTP / Web Deploy credentials."
  - claim_id: 45cb63bb77
    entry: 2026-05-20/storm-2949-sspr-to-key-vault-azure-kill-chain
    surface: "body"
    kind: uncited
    text: "From there the actor accessed the Kudu management console of those App Services (which expose a shell and file-system inside the App Service container)."
  - claim_id: 517b13ad31
    entry: 2026-05-20/storm-2949-sspr-to-key-vault-azure-kill-chain
    surface: "body"
    kind: uncited
    text: "They then pivoted to **Azure Key Vault** using the **Owner** role (which one of the compromised user's Azure RBAC permissions granted over a specific Key Vault), modified access policies to grant themselves vault data-plane permissions, and exfiltrated dozens of secrets — database credentials, connection strings, third-party API keys."
  - claim_id: eafbee7521
    entry: 2026-05-20/storm-2949-sspr-to-key-vault-azure-kill-chain
    surface: "body"
    kind: uncited
    text: "**Phase 4 — Azure SQL and Storage.** The actor mutated **SQL firewall rules** via `microsoft.sql/servers/firewallrules/write` to open access from attacker IPs, queried databases over those rules, then deleted the rules to remove the artefact — defence evasion via the cloud control plane."
  - claim_id: 77dc34f960
    entry: 2026-05-20/storm-2949-sspr-to-key-vault-azure-kill-chain
    surface: "body"
    kind: uncited
    text: "In parallel, **Storage account network ACLs** were mutated via `microsoft.storage/storageaccounts/write` to allow attacker IPs, **SAS tokens and account keys** were retrieved via `microsoft.Storage/storageAccounts/listkeys/action`, and large-blob downloads were executed over multiple days using a custom Python script against the Azure Storage SDK."
  - claim_id: 64eb7bd7cc
    entry: 2026-05-20/storm-2949-sspr-to-key-vault-azure-kill-chain
    surface: "body"
    kind: uncited
    text: "**Phase 5 — Azure VM compromise.** Storm-2949 deployed the **VMAccess** Azure VM extension to create new local admin accounts on selected VMs and used **Azure Run Command** to execute payloads for in-VM credential harvesting and on-prem Active Directory reconnaissance via the VM's network presence."
  - claim_id: 4fad5723bd
    entry: 2026-05-20/storm-2949-sspr-to-key-vault-azure-kill-chain
    surface: "body"
    kind: uncited
    text: "**Detection concepts.** The kill chain crosses identity, App Service, Key Vault, SQL, Storage, and VM extensions; endpoint-only coverage will miss the entire chain."
  - claim_id: 3fc5af9cdf
    entry: 2026-05-20/storm-2949-sspr-to-key-vault-azure-kill-chain
    surface: "body"
    kind: uncited
    text: "The detection layers that matter are cloud-side:"
  - claim_id: 588aa03c07
    entry: 2026-05-20/storm-2949-sspr-to-key-vault-azure-kill-chain
    surface: "body"
    kind: uncited
    text: "- **Entra ID Sign-In + Audit Logs.** Hunt for SSPR flow initiations (`category: SelfServicePasswordReset`) followed within the same session by MFA-method removal, new Authenticator-device enrollment, and sign-in from a new IP / device."
  - claim_id: f4c41a2671
    entry: 2026-05-20/storm-2949-sspr-to-key-vault-azure-kill-chain
    surface: "body"
    kind: uncited
    text: "Alert on rapid Graph-API user / role / app enumeration (hundreds of `users`, `applications`, `servicePrincipals` reads in a short window). - **Microsoft Defender for Cloud.** Alerts on Key Vault access-policy modifications, SQL firewall-rule mutations, Storage account network-access-rule changes, App Service `publishxml` extraction, and VM extension deployments."
  - claim_id: 4719aecec7
    entry: 2026-05-20/storm-2949-sspr-to-key-vault-azure-kill-chain
    surface: "body"
    kind: uncited
    text: "Each is individually noisy; the time-correlation is the signal. - **Azure Audit Log (Activity Log).** Hunt for the sequence `Add-AzKeyVaultCertificate` / `microsoft.keyvault/vaults/accessPolicies/write` → `microsoft.sql/servers/firewallrules/write` → `microsoft.storage/storageaccounts/write` → `microsoft.Storage/storageAccounts/listkeys/action` from the same principal within a short window. - **App Service / Kudu access logs.** Unusual SCM (Source Control Manager) authentication events from non-developer IPs and unexpected Kudu shell-command issuance."
  - claim_id: b9d6d4da6b
    entry: 2026-05-20/storm-2949-sspr-to-key-vault-azure-kill-chain
    surface: "body"
    kind: uncited
    text: "**Hardening / mitigation.**"
  - claim_id: 1cb3605500
    entry: 2026-05-20/storm-2949-sspr-to-key-vault-azure-kill-chain
    surface: "body"
    kind: uncited
    text: "- **Require phishing-resistant MFA (FIDO2 / certificate-based) for all privileged roles** — admin roles, Key Vault Contributor, Storage Account Contributor, SQL Server Contributor, App Service Contributor."
  - claim_id: 6458a55cc2
    entry: 2026-05-20/storm-2949-sspr-to-key-vault-azure-kill-chain
    surface: "body"
    kind: uncited
    text: "SSPR-via-Authenticator-prompt is a number-matching MFA path; phishing-resistant binds eliminate it. - **Restrict SSPR to pre-registered recovery methods only.** Conditional Access policies that block SSPR registration of new methods without an interactive sign-in from a compliant device close the device-enrollment hijack pattern. - **Constrain Owner and Key Vault Contributor role assignments** — both grant management-plane modification of access policies."
  - claim_id: 846299f028
    entry: 2026-05-20/storm-2949-sspr-to-key-vault-azure-kill-chain
    surface: "body"
    kind: uncited
    text: "Microsoft notes Storm-2949 exercised the Owner role over a specific Key Vault to mutate access policies and grant itself data-plane access; Key Vault Contributor confers the same management-plane mutation capability."
  - claim_id: 646ac7dfde
    entry: 2026-05-20/storm-2949-sspr-to-key-vault-azure-kill-chain
    surface: "body"
    kind: uncited
    text: "Where Key Vault data access is needed, use the data-plane RBAC model (Key Vault Secrets User / Reader) rather than management-plane Owner / Contributor. - **Enable Defender for Cloud across Key Vault, App Service, Storage, and SQL** — Storm-2949's chain triggers built-in alerts at every step; absent the per-service Defender plans, those events sink into the Activity Log without alerting. - **Audit custom Azure RBAC roles** specifically for `microsoft.Web/sites/publishxml/action`, `microsoft.sql/servers/firewallrules/write`, `microsoft.storage/storageaccounts/write`, `microsoft.Compute/virtualMachines/extensions/write`, and `microsoft.Compute/virtualMachines/runCommand/action` — these are the cloud-control-plane verbs the kill chain depends on."
  - claim_id: 21c4da895d
    entry: 2026-05-20/storm-2949-sspr-to-key-vault-azure-kill-chain
    surface: "body"
    kind: uncited
    text: "**Why this matters for Swiss / EU public-sector defenders.** Storm-2949 specifically targeted IT personnel and senior leadership — the audience-of-one pattern most likely to clear MFA prompts under social-engineering pressure."
  - claim_id: 10fbb3b8a7
    entry: 2026-05-20/storm-2949-sspr-to-key-vault-azure-kill-chain
    surface: "body"
    kind: uncited
    text: "The kill chain is generic Azure / M365 abuse; nothing in it is tenant-specific."
  - claim_id: a6ddad7146
    entry: 2026-05-20/storm-2949-sspr-to-key-vault-azure-kill-chain
    surface: "body"
    kind: uncited
    text: "Any Swiss federal, cantonal, healthcare, or finance organisation running Azure has the resource types Storm-2949 walked through."
  - claim_id: f966769de0
    entry: 2026-05-20/storm-2949-sspr-to-key-vault-azure-kill-chain
    surface: "body"
    kind: uncited
    text: "The mitigations are also generic: phishing-resistant MFA on privileged roles, SSPR Conditional Access, Defender-for-Cloud enablement on the four affected services."
  - claim_id: 7b7f008a8a
    entry: 2026-05-20/storm-2949-sspr-to-key-vault-azure-kill-chain
    surface: "body"
    kind: uncited
    text: "None of those require breaking changes — they're configuration work, primarily."
