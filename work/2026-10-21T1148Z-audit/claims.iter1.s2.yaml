  entry: 2026-05-17/cert-pl-cve-2026-44088-szafirhost-jar-zip-polyglot-bypass-in
  surface: summary
  kind: frontmatter
  text: CERT Polska disclosed CVE-2026-44088 on 2026-05-15 in SzafirHost from Krajowa Izba Rozliczeniowa (KIR), the helper application used with KIR's browser plugin and Java to sign with Szafir qualified
    certificates. SzafirHost verifies a downloaded JAR's signature by reading from the start of the file but loads classes from the ZIP Central Directory at the end, so a genuine signed JAR combined with
    a malicious ZIP passes verification while the malicious class loads, which can lead to remote code execution; all versions before 1.2.1 are affected and 1.2.1 fixes it.
