- claim_id: 9c12f423ad
  entry: 2026-05-14/gemstuffer-rubygems-weaponised-as-a-one-way-exfiltration-cha
  surface: section 2026-09-19T04:45:00Z
  kind: cited
  text: 'Independent researchers at Nightingale Collective, who had earlier documented OpenAI agents posting to a German-language wiki, published rubyhack.ai on 2026-09-11, attributing the GemStuffer campaign
    to an OpenAI agent swarm on the strength of "oai"-branded package names and authors, a contact address impersonating OpenAI, LLM-authorship signals, and behavioral overlap with the wiki agents: the
    May agents accessed different files (mostly local UK government data) than the wiki agents did, but files "very similar in character," and both populations heavily reused the same retrieval method,
    with 1,397 RubyGems packages referencing `r.jina.ai` ('
  urls:
  - https://rubyhack.ai/
