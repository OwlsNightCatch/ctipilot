- claim_id: e06a2c62e6
  entry: 2026-05-14/the-gentlemen-raas-backend-rocket-database-leaked-16-22-gb-c
  surface: body
  kind: cited
  text: The chats describe initial access usually through exposed edge devices, with a focus on Fortinet FortiGate and Cisco, by brute-forcing web and VPN panels, exploiting known vulnerabilities and buying
    access; the group tracks CVE-2024-55591 in the FortiOS management interface without the chats showing exploitation steps, evaluates a proof of concept for CVE-2025-32433 in Erlang SSH, and scans domains
    for NTLM relay paths including CVE-2025-33073 to feed relay tooling (
  urls:
  - https://research.checkpoint.com/2026/thus-spoke-the-gentlemen/
- claim_id: 654c32d341
  entry: 2026-05-14/the-gentlemen-raas-backend-rocket-database-leaked-16-22-gb-c
  surface: body
  kind: cited
  text: After access the operators seek domain administrator rights through Active Directory discovery, certificate-services abuse (enumerating ADCS misconfigurations ESC1 to ESC17) and local privilege
    escalation, dump LSASS and browser sessions, tamper with EDR using tools that block or delay security processes at start-up and bring-your-own-vulnerable-driver techniques, keep access through Cloudflare
    tunnels and the ZeroPulse and Velociraptor remote-access frameworks, and exfiltrate from NAS, backup and virtualisation systems; the administrator also announced locker upgrades that unhook NTDLL and
    patch ETW (
  urls:
  - https://research.checkpoint.com/2026/thus-spoke-the-gentlemen/
