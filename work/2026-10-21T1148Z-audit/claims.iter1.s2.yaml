  entry: 2026-05-15/cve-2026-45793-php-composer-github-actions-ci-token-disclosu
  surface: body
  kind: cited
  text: Composer validates configured GitHub tokens against an allowed character set in `Composer\IO\BaseIO::loadConfiguration()`; GitHub's new structured format for GitHub App installation tokens contains
    a hyphen, fails that check, and the resulting exception prints the full token to stderr, which CI captures in the job log, while GitHub Actions' secret masker may not redact it because the message is
    wrapped or framed (
  urls:
