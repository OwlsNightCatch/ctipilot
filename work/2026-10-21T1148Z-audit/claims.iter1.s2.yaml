  entry: 2026-05-17/kaspersky-great-documents-kimsuky-s-rust-based-hellodoor-and
  surface: body
  kind: cited
  text: MemLoad runs anti-VM checks and reconnaissance, persists through scheduled tasks that run regsvr32 on its DLL every minute, and reflectively loads the RC4-encrypted httpTroy backdoor in memory for
    long-term access and exfiltration; the AppleSeed Spy variant collects documents, screenshots, keystrokes and the GPKI certificate directory (
  urls:
