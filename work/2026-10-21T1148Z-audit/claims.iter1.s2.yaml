  entry: 2026-05-19/interpol-operation-ramz-13-country-mena-cybercrime-sweep-201
  surface: record 2026-10-21T20:41:04Z
  kind: record-summary
  text: INTERPOL describes Operation Ramz as aimed at phishing, malware and cyber scams that cost the MENA region and names no targeting of EU banking customers or payment systems. In Jordan police raided
    a fake trading-platform fraud run by 15 trafficking victims from Asia and arrested two suspected organizers, and in Oman investigators disabled a vulnerable, malware-infected server in a private residence
    whose owner had legitimate access to its data; the Algeria takedown also led to one arrest and compromised devices in Qatar were found spreading malicious threats.
