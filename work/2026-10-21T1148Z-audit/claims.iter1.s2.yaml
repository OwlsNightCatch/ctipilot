- claim_id: 8806b74d40
  entry: 2026-05-19/cisa-contractor-nightwing-exposed-aws-govcloud-admin-keys-an
  surface: summary
  kind: frontmatter
  text: A Nightwing employee working for CISA kept a public GitHub repository named Private-CISA, created on 2025-11-13 and taken offline after GitGuardian, KrebsOnSecurity and Seralys raised it in mid-May
    2026, that held cloud keys, tokens, plaintext passwords and files on how CISA builds software, including administrative credentials for three AWS GovCloud accounts and passwords for dozens of internal
    systems (Krebs on Security, 2026-05-18). The contractor had disabled GitHub's default block on publishing secrets, the AWS keys stayed valid for 48 hours after the takedown, and CISA said there was
    no indication that sensitive data was compromised.
