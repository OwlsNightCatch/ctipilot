- claim_id: 3c0b7dd981
  entry: 2026-05-15/datadog-security-labs-analyzes-leaked-teampcp-shai-hulud-off
  surface: body
  kind: cited
  text: '**Detection:** on hosts, a `gh-token-monitor` LaunchAgent or systemd user service, and Claude Code `SessionStart` hooks or VS Code `folderOpen` tasks that run a `setup.mjs` loader; in repositories,
    commits on any branch under a spoofed `claude` identity that add these hook and loader files; under stolen tokens, new public repositories with Dune-themed names; in npm, unexpected patch releases of
    your packages that add a `preinstall` script ('
  urls:
  - https://securitylabs.datadoghq.com/articles/shai-hulud-open-source-framework-static-analysis/
- claim_id: 55700621fa
  entry: 2026-05-15/datadog-security-labs-analyzes-leaked-teampcp-shai-hulud-off
  surface: body
  kind: cited
  text: '**Defender takeaway:** before revoking any GitHub token on a suspect host, disable the token-monitoring daemon, then rotate credentials; yank any package version that gained an unexpected `preinstall`
    script ('
  urls:
  - https://securitylabs.datadoghq.com/articles/shai-hulud-open-source-framework-static-analysis/
