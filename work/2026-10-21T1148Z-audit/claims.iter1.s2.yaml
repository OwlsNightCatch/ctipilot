  entry: 2026-05-17/kaspersky-great-documents-kimsuky-s-rust-based-hellodoor-and
  surface: body
  kind: cited
  text: HelloDoor, a Rust DLL backdoor first seen in August 2025 that Kaspersky judges early-stage, persists through an HKCU Run value that launches regsvr32 and talks to a C2 hosted through TryCloudflare,
    which makes the infrastructure behind it hard to trace; httpMalice (version 1.9 over HTTP or HTTPS, version 1.8 over the Dropbox API) persists as a service when elevated and through an HKCU Run value
    otherwise, profiles the host, captures the screen, uploads archived directories and encrypts its traffic with ChaCha20 (
  urls:
  - https://securelist.com/kimsuky-appleseed-pebbledash-campaigns/119785/
