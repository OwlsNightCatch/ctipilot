- claim_id: 4696171e33
  entry: 2026-05-19/arwini-lower-saxony-statutory-prescription-audit-body-invest
  surface: summary
  kind: frontmatter
  text: The Hannover police directorate confirmed that data left the systems of ARWINI, the body that audits prescriptions for Lower Saxony's statutory health insurers and the regional doctors' association
    (KVN), and told heise online on 2026-05-18 that the Kairos ransomware group is behind the attack discovered on 2026-05-04. ARWINI says personal and particularly sensitive data are likely affected, up
    to 75,000 records in the worst case, while the KVN says the patient data it supplies are anonymised; Kairos has listed a 2.87 TB dataset for sale since 2026-05-11, and no source states how the attackers
    got in.
