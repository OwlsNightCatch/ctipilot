  kind: cited
  text: '**Detection:** in runtime syscall telemetry, Ruby processes calling `putenv` or `setenv` to move `HOME` out of `/home` or `/root` into `/tmp`; in egress logs, HTTPS POSTs to the RubyGems gem-upload
