- claim_id: 9478255957
  entry: 2026-05-15/datadog-security-labs-analyzes-leaked-teampcp-shai-hulud-off
  surface: body
  kind: cited
  text: Stolen GitHub tokens are used to commit VS Code folder-open tasks and Claude Code SessionStart hooks to every branch of the victim's repositories, stolen npm tokens to republish the victim's packages
    with a `preinstall` loader, and, in a release workflow it was hardcoded to target, the workflow's OIDC token to publish a poisoned package with genuine Sigstore provenance; where it attaches a stolen
    token it installs a LaunchAgent or systemd user service that checks the token every minute and runs `rm -rf ~/` once it is revoked (
  urls:
  - https://securitylabs.datadoghq.com/articles/shai-hulud-open-source-framework-static-analysis/
- claim_id: 1bb64d3e8d
  entry: 2026-05-15/datadog-security-labs-analyzes-leaked-teampcp-shai-hulud-off
  surface: body
  kind: cited
  text: '**Exposure:** CI/CD pipelines, developer workstations and cloud environments open to the documented techniques, in particular Runner.Worker memory extraction, instance and container metadata collection
    and IDE hook persistence; with the code public, other actors can reuse the playbook ('
  urls:
