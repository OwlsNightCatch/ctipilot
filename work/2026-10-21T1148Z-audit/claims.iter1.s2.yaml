- claim_id: db0c187d17
  entry: 2026-05-14/gemstuffer-rubygems-weaponised-as-a-one-way-exfiltration-cha
  surface: body
  kind: cited
  text: '**Triage:** a `gem push` from a release job is routine; the same push from a process that has redirected `HOME` into `/tmp` is "an abnormal operation in any legitimate Ruby application", and a
