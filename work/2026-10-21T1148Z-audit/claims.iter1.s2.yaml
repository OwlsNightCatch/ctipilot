  kind: frontmatter
  text: 'CERT Polska disclosed three DHTMLX flaws on 2026-05-15: CVE-2026-41553 lets an unauthenticated attacker inject JavaScript into the data parameter of the PDF Export Module used by DHTMLX Gantt and
