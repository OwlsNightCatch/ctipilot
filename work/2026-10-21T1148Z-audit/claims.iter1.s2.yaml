  entry: 2026-05-14/the-gentlemen-raas-backend-rocket-database-leaked-16-22-gb-c
  surface: body
  kind: cited
  text: DynaRisk adds that the group modified Group Policy Objects after reaching domain admin and targeted NAS, Exchange, storage and backup systems to prevent recovery (
  urls:
  - https://www.bankinfosecurity.com/tables-turned-gentlemen-ransomware-group-suffers-data-leak-a-31654
