- claim_id: 5eaaa8902e
  entry: 2026-05-16/unit-42-gremlin-stealer-evolved-with-net-resource-xor-obfusc
  surface: summary
  kind: frontmatter
  text: Unit 42 reported on 2026-05-15 a Gremlin stealer variant that moves its payload into an XOR-encoded .NET resource section, decrypts functions only when needed and, in one sample, sits under a commercial
    packer with instruction virtualization. New modules steal Discord tokens, swap copied cryptocurrency wallet addresses for the attacker's in real time and hijack live Chromium-based browser sessions
    over WebSocket; stolen data leaves as a ZIP uploaded to an attacker-controlled web panel, with the Telegram Bot API as an alternative channel.
