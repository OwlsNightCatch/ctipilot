  entry: 2026-05-15/datadog-security-labs-analyzes-leaked-teampcp-shai-hulud-off
  surface: body
  kind: cited
  text: Data leaves AES-256-GCM encrypted over HTTPS to a campaign domain, with a fallback domain found through signed GitHub commits and, failing that, new public GitHub repositories used as dead-drops
    (
  urls:
