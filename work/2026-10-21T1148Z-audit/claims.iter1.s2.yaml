  kind: cited
  text: Unit 42 identified a new Gremlin stealer variant that bundles stolen browser cookies, session tokens, clipboard contents, cryptocurrency wallet data and FTP and VPN credentials into a ZIP archive
    named with the victim's public IP address and uploads it to an attacker-controlled site, while exfiltration through private web panels or the Telegram Bot API stays as in earlier builds (
  urls:
  - https://unit42.paloaltonetworks.com/gremlin-stealer-evolution/
- claim_id: 41e42c8847
  entry: 2026-05-16/unit-42-gremlin-stealer-evolved-with-net-resource-xor-obfusc
  surface: body
