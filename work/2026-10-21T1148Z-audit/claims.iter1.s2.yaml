- claim_id: 98c1e90579
  entry: 2026-05-15/datadog-security-labs-analyzes-leaked-teampcp-shai-hulud-off
  surface: record 2026-10-21T20:34:33Z
  kind: record-summary
  text: 'TeamPCP released the Shai-Hulud framework source deliberately, signing it "Love - TeamPCP", and GitHub removed the repository after it had been forked, rather than it leaking before an account
    was removed. Datadog''s analysis finds no pull_request_target or expression-injection exploitation in the code: the framework harvests credentials where it already runs, reads Runner.Worker memory,
    poisons repositories and npm packages with stolen tokens, and uses a workflow''s OIDC token only in a release workflow it was hardcoded to target. Datadog''s compromise checks, including disabling the
    wipe-on-revocation daemon before rotating tokens, are now stated.'
