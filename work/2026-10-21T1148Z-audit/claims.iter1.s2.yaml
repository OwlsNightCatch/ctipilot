- claim_id: 0a651fc795
  entry: 2026-05-18/tycoon2fa-after-the-march-2026-takedown-oauth-device-authori
  surface: summary
  kind: frontmatter
  text: 'eSentire reported on 2026-05-12 a late-April 2026 campaign in which Tycoon 2FA operators, still active after the March 2026 takedown, added an OAuth device-code variant alongside their credential-relay
    kit: an invoice lure with a Trustifi click-tracking link leads through Cloudflare Workers and encrypted JavaScript layers to a fake Microsoft CAPTCHA and a voicemail page showing a device code the operator''s
    backend obtained. The victim pastes it at microsoft.com/devicelogin, signs in and approves MFA on genuine Microsoft infrastructure, and Microsoft issues Microsoft Authentication Broker tokens to the
    operator''s polling client; eSentire found it through device-code sign-ins and Node.js user agents in Entra ID logs.'
