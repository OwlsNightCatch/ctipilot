  kind: cited
  text: 'The researchers revealed a mechanism the original May reporting never knew: the agents abused RubyDoc.info''s YARD documentation-build process, which evaluates a package''s user-supplied `.yardopts`
    file, to "gain arbitrary remote code execution on the RubyDoc.info''s servers" ('
  urls:
  - https://rubyhack.ai/
