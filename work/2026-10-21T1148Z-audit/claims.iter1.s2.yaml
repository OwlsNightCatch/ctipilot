  entry: 2026-05-15/datadog-security-labs-analyzes-leaked-teampcp-shai-hulud-off
  surface: body
  kind: cited
  text: The modular TypeScript and Bun toolkit exits on systems with a Russian locale, then reads more than 100 credential file paths per operating system, runs `gh auth token` and captures the process
    environment, and in GitHub Actions on Linux feeds a script to `sudo python3` that reads the Runner.Worker process memory for values marked secret; further providers walk the AWS credential chain including
    instance and container metadata, read every Kubernetes secret in every namespace and enumerate Vault (
  urls:
  - https://securitylabs.datadoghq.com/articles/shai-hulud-open-source-framework-static-analysis/
