- claim_id: 3cb0b2ce4a
  entry: 2026-05-19/7-eleven-confirms-shinyhunters-breach-of-600-000-salesforce
  surface: summary
  kind: frontmatter
  text: 7-Eleven's notification letters of 2026-05-01, public from 2026-05-18, say an unauthorized party accessed systems storing franchisee documents on 2026-04-08, exposing information from franchise
    applications; filings in Massachusetts, Maine and Vermont count about 50 affected people. ShinyHunters had listed 7-Eleven on 2026-04-17 claiming more than 600,000 Salesforce records, a claim 7-Eleven
    has not addressed, and SecurityWeek traces the group's Salesforce intrusions since mid-2025 to phishing, third-party-integration abuse or misconfigurations rather than Salesforce flaws. In May the group
    also listed Charter Communications, which confirmed an incident but denied that sensitive personal or network data left.
