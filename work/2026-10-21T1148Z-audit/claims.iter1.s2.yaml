  entry: 2026-05-14/famoussparrow-three-wave-intrusion-of-an-azerbaijani-energy
  surface: summary
  kind: frontmatter
  text: Bitdefender documented an intrusion at an Azerbaijani oil and gas company from late December 2025 to late February 2026 that it attributes with moderate-to-high confidence to the China-nexus FamousSparrow
    cluster. The attackers came back three times through the same vulnerable on-premises Exchange server (ProxyNotShell), ran Deed RAT through a LogMeIn Hamachi binary whose malicious loader splits its
    trigger across two exports and a hooked StartServiceCtrlDispatcherW call, attempted TernDoor in a second wave that security software blocked, and moved laterally with a domain administrator account
    over RDP and Impacket-style tools.
