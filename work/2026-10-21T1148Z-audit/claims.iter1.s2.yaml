  entry: 2026-05-15/cve-2026-45793-php-composer-github-actions-ci-token-disclosu
  surface: record 2026-10-21T20:33:27Z
  kind: record-summary
  text: Composer's token leak was triggered on the default path by GitHub's new hyphenated installation-token format failing Composer's validation when it loaded its configuration, not by package-resolution
