  entry: 2026-05-15/datadog-security-labs-analyzes-leaked-teampcp-shai-hulud-off
  surface: section 2026-10-21T20:34:33Z
  kind: cited
  text: The framework harvests credentials where it already runs, reads Runner.Worker memory, poisons repository branches and npm packages with stolen tokens, and uses a workflow's own OIDC token only inside
    a release workflow and for a package it was hardcoded to target, so that path was manually targeted while the token-driven spread is opportunistic (
  urls:
  - https://securitylabs.datadoghq.com/articles/shai-hulud-open-source-framework-static-analysis/
- claim_id: 8dd4795f77
  entry: 2026-05-15/datadog-security-labs-analyzes-leaked-teampcp-shai-hulud-off
  surface: section 2026-10-21T20:34:33Z
  kind: cited
  text: 'The analysis also documents what defenders need for a compromise check: an exit on Russian-locale systems, a daemon that deletes the home directory when a stolen GitHub token is revoked and must
    be disabled before rotation, and the hook files, commits and npm releases it leaves behind ('
  urls:
  - https://securitylabs.datadoghq.com/articles/shai-hulud-open-source-framework-static-analysis/
