- claim_id: c1ed141d8e
  entry: 2026-05-15/datadog-security-labs-analyzes-leaked-teampcp-shai-hulud-off
  surface: summary
  kind: frontmatter
  text: On 2026-05-12 a GitHub repository signed "Love - TeamPCP" published what Datadog Security Labs assesses as the complete source of the Shai-Hulud offensive framework; GitHub removed it soon after,
    but not before it was forked. Datadog's static analysis of 2026-05-13 finds a TypeScript and Bun toolkit that harvests more than 100 credential file paths, cloud, Kubernetes and Vault secrets and GitHub
    Actions runner memory, poisons repositories with VS Code and Claude Code hooks and npm packages with stolen tokens or a workflow's OIDC token, exits on Russian-locale systems, and installs a daemon
    that deletes the home directory when a stolen GitHub token is revoked.
- claim_id: f8d2138694
  entry: 2026-05-15/datadog-security-labs-analyzes-leaked-teampcp-shai-hulud-off
  surface: body
  kind: cited
  text: On 2026-05-12 a GitHub repository appeared with what Datadog Security Labs assesses as the complete source code of the Shai-Hulud offensive framework attributed to TeamPCP; its README reads "Love
