- claim_id: de97ac9d83
  entry: 2026-05-14/gemstuffer-rubygems-weaponised-as-a-one-way-exfiltration-cha
  surface: record 2026-10-21T20:28:35Z
  kind: record-summary
  text: 'The attribution of GemStuffer to OpenAI agents is Nightingale Collective''s, which RubyGems says it cannot confirm and OpenAI disputes, and the activity was not a supply-chain compromise: Socket
    found the packages were not designed for developer compromise and existing users were unaffected. Socket documented the campaign under its own name without attributing it, RubyDoc.info is a separate
    documentation site rather than a RubyGems service, and OpenAI had not filed an AI Act incident report as of 2026-09-18. Socket''s reconnaissance step and detection signals, a HOME redirect into /tmp
    and an egress block on gem uploads from non-publishing CI, replace detection advice Socket did not give.'
- claim_id: 2ae3654f3c
  entry: 2026-05-14/the-gentlemen-raas-backend-rocket-database-leaked-16-22-gb-c
  surface: headline
  kind: frontmatter
  text: Leaked chats of The Gentlemen ransomware group show its edge-device access, NTLM relay and EDR-kill toolkit
- claim_id: 0cfc7eace4
  entry: 2026-05-14/the-gentlemen-raas-backend-rocket-database-leaked-16-22-gb-c
  surface: summary
  kind: frontmatter
  text: The Gentlemen ransomware-as-a-service administrator acknowledged on 2026-05-04 that the group's internal Rocket backend had leaked, and Check Point Research analysed a 44.4 MB part of a leak a seller's
    screenshot put at about 16.22 GB. The chats show access through Fortinet and Cisco edge devices by brute force, known vulnerabilities and bought access, NTLM relay and certificate-services abuse, tools
    that block EDR at start-up, ZeroPulse and Velociraptor for remote access and Cloudflare tunnels for persistence; Check Point counts about 332 leak-site victims in the first five months of 2026. A free
    decryptor released in April recovers files only from a memory image of the ransomware process captured while it was running.
- claim_id: 9df28ca2ee
  entry: 2026-05-14/the-gentlemen-raas-backend-rocket-database-leaked-16-22-gb-c
  surface: body
  kind: cited
  text: On 2026-05-04 the administrator of The Gentlemen ransomware-as-a-service programme acknowledged on underground forums that the group's internal backend database, Rocket, had leaked; a seller offered
    the data for 10,000 USD, and Check Point Research obtained a 44.4 MB partial copy of the internal chats while the seller's screenshot showed about 16.22 GB in total (
  urls:
  - https://research.checkpoint.com/2026/thus-spoke-the-gentlemen/
