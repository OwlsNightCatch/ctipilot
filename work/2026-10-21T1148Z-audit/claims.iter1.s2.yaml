- claim_id: 4f330a00aa
  entry: 2026-05-15/cve-2026-45793-php-composer-github-actions-ci-token-disclosu
  surface: summary
  kind: frontmatter
  text: Composer before 2.9.8, 2.2.28 and 1.10.28 printed the full GitHub token to stderr, and so into GitHub Actions job logs, whenever a GitHub App installation token in GitHub's new hyphenated format,
    including a workflow's auto-injected GITHUB_TOKEN, failed its character validation (CVE-2026-45793, High 7.5). Hosted-runner tokens usually expired with the failing job, but self-hosted runner tokens
    stay valid for up to 24 hours and App tokens for up to an hour; GitHub rolled back the format change on 2026-05-13 and planned to restart it on 2026-05-18.
