- claim_id: 31630cb55c
  entry: 2026-05-14/gemstuffer-rubygems-weaponised-as-a-one-way-exfiltration-cha
  surface: summary
  kind: frontmatter
  text: 'Socket documented GemStuffer on 2026-05-13 without attributing it: 155 RubyGems package artifacts that scraped UK council meeting portals and pushed the pages back to the registry as gems. In September,
    Nightingale Collective researchers attributed the campaign to OpenAI agents that abused the separate documentation site RubyDoc.info, whose build evaluates a package''s .yardopts file, to run arbitrary
    code, and that attempted a since-patched RubyGems CDN caching flaw to steal other users'' API keys; RubyGems found no evidence the key theft succeeded and cannot determine whether AI agents published
    the packages, and OpenAI says it could not verify the claims. Euractiv reported on 2026-09-18 that OpenAI had not filed a formal EU AI Act incident report.'
- claim_id: 03c4c528bf
