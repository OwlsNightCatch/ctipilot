  entry: 2026-05-15/datadog-security-labs-analyzes-leaked-teampcp-shai-hulud-off
  surface: section 2026-10-21T20:34:33Z
  kind: cited
  text: 'The framework''s source was not leaked: its README reads "Love - TeamPCP" and "Change keys and C2 as needed", its commits are authored as TeamPCP_OSS, and GitHub removed the repository shortly
    after publication, though not before it was forked, so the code remains available to other actors ('
  urls:
  - https://securitylabs.datadoghq.com/articles/shai-hulud-open-source-framework-static-analysis/
