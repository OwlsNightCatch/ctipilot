      - {id: T1195.001, behavior: "Poisoned pnpm store written to the Actions cache under the key the release workflow restores", url: "https://tanstack.com/blog/npm-supply-chain-compromise-postmortem"}
      - {id: T1195.002, behavior: "84 malicious versions of 42 @tanstack/* packages published through the project's own release pipeline with valid provenance", url: "https://tanstack.com/blog/npm-supply-chain-compromise-postmortem"}
      - {id: T1003.007, behavior: "Runner.Worker located via /proc/*/cmdline; /proc/<pid>/maps and /proc/<pid>/mem read to dump secrets and the OIDC token", url: "https://tanstack.com/blog/npm-supply-chain-compromise-postmortem"}
      - {id: T1528, behavior: "GitHub Actions OIDC token taken from runner memory", url: "https://tanstack.com/blog/npm-supply-chain-compromise-postmortem"}
