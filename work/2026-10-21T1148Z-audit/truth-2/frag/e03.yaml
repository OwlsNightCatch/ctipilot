      - {id: T1027, behavior: "Three obfuscation layers (string table, per-byte cipher, AES-256-GCM payloads)", url: "https://www.stepsecurity.io/blog/mini-shai-hulud-is-back-a-self-spreading-supply-chain-attack-hits-the-npm-ecosystem"}
      - {id: T1105, behavior: "Bun runtime installed and second-stage scripts fetched/decrypted on the victim host", url: "https://www.stepsecurity.io/blog/mini-shai-hulud-is-back-a-self-spreading-supply-chain-attack-hits-the-npm-ecosystem"}
    rating: {reliability: A, credibility: 1, basis: "TanStack's own post-mortem and GHSA for its incident (A), corroborated independently by StepSecurity's payload analysis, Wiz and the NCSC-CH hub post, which agree on the pwn-request, cache-poisoning and OIDC-extraction chain."}
    exposure:
      - {quote: "anyone who installed an affected version on 2026-05-11 must treat the install host as potentially compromised.", url: "https://tanstack.com/blog/npm-supply-chain-compromise-postmortem"}
      - {quote: "Only the Router/Start repo was affected — 42 monorepo packages, 2 versions each.", url: "https://tanstack.com/blog/npm-supply-chain-compromise-postmortem"}
    detection:
      - {quote: "The `files` field in `package.json` only lists `[\"dist\", \"src\"]`, so `router_init.js` should *not* be included in the published tarball. Its presence confirms the tarball was tampered with outside the normal build process.", url: "https://www.stepsecurity.io/blog/mini-shai-hulud-is-back-a-self-spreading-supply-chain-attack-hits-the-npm-ecosystem"}
      - {quote: "GitHub commit author: claude@users.noreply.github.com - dead-drop commit author; unexpected commits = active exfiltration", url: "https://security-hub.ncsc.admin.ch/#/posts/12558"}
    triage: []
    takeaway:
      - {quote: "we strongly recommend that anyone who installed an affected version on 2026-05-11 rotate AWS, GCP, Kubernetes, Vault, GitHub, npm, and SSH credentials reachable from the install host.", url: "https://tanstack.com/blog/npm-supply-chain-compromise-postmortem"}
      - {quote: "Do not revoke these tokens before isolating and imaging the machine - the payload includes a destructive wipe routine triggered by revocation.", url: "https://www.stepsecurity.io/blog/mini-shai-hulud-is-back-a-self-spreading-supply-chain-attack-hits-the-npm-ecosystem"}
