- entry: 2026-05-13/microsoft-mdash-multi-model-agentic-vulnerability-discovery
  verdict: factual-error
  defects:
    - where: "body paragraph 1 (benchmark sentence citation)"
      claim: "The harness scored 88.45% on the public CyberGym benchmark (1,507 real-world CVEs across 188 open-source projects) and achieved 100% recall on the `tcpip.sys` historical-CVE corpus ([The Register, 2026-05-13]"
      defect: "The Register article carries none of these figures (it only says MDASH found 16 of the May vulnerabilities and is in limited private preview); they are on Microsoft's own blog, and the entry drops the sample size and the clfs.sys result."
      ground_truth: "Microsoft: 'the Microsoft Security multi-model agentic scanning harness reaches an 88.45% success rate' on CyberGym, 'a corpus of 1,507 real-world vulnerability reproduction tasks drawn from across 188 OSS-Fuzz projects'; 'tcpip.sys: 100% recall on 7 MSRC cases spanning five years'; 'clfs.sys: 96% recall on 28 MSRC cases'; 'retrospective recall benchmarks on internal code with a finite case count'."
      ground_truth_url: "https://www.microsoft.com/en-us/security/blog/2026/05/12/defense-at-ai-speed-microsofts-new-multi-model-agentic-security-system-finds-16-new-vulnerabilities/"
      fix: "Cite the Microsoft blog for the figures; write 'tcpip.sys: 100% of 7 historical MSRC cases' (and clfs.sys 96% of 28), not 'historical-CVE corpus'; say 1,507 reproduction tasks across 188 OSS-Fuzz projects."
      class: imprecision
    - where: "body paragraph 1 (prove-stage sentence)"
      claim: "ends with an **automated end-to-end exploitability proof** before a finding is sent to engineering — meaning every MDASH-disclosed CVE was validated as practically exploitable, not just theoretically reachable"
      defect: "Microsoft describes the prove stage as constructing triggering inputs 'where the bug class admits it' to prove the bug exists; it does not claim exploitability was proven for every finding, and several of the 16 are DoS or information-disclosure bugs."
      ground_truth: "'Prove stage: Constructs and executes triggering inputs where the bug class admits it. The prove stage validates the pre-condition dynamically and formulates the bug-triggering inputs to prove existence of vulnerability (for example, ASan in C/C++).' Of CVE-2026-33827: 'exploitation requires winning a narrow timing window and shaping allocator reuse'."
      ground_truth_url: "https://www.microsoft.com/en-us/security/blog/2026/05/12/defense-at-ai-speed-microsofts-new-multi-model-agentic-security-system-finds-16-new-vulnerabilities/"
      fix: "Write: the prove stage builds and runs triggering inputs where the bug class allows, to confirm the bug exists; drop 'practically exploitable' for every CVE."
      class: factual-error
    - where: "Defender takeaway, first implication"
      claim: "the MDASH-discovered Windows CVEs (a substantial subset of the May 2026 Patch Tuesday in § 2) should be treated as \"practically exploitable\" even without observed ITW activity ... that lifts these above the typical \"Less Likely / More Likely\" scoring noise"
      defect: "Microsoft's own exploitability assessments for the four Critical MDASH CVEs are 'Exploitation Less Likely' (three) and 'Exploitation Unlikely' (one), none exploited or publicly disclosed; the premise (proof-of-exploitability before disclosure) is not in the source. Two of the four were released in April, not May."
      ground_truth: "MSRC: CVE-2026-33827 (released 2026-04-14, CVSS 8.1) 'Exploitation Less Likely'; CVE-2026-33824 (2026-04-14, 9.8) 'Exploitation Less Likely'; CVE-2026-41089 (2026-05-12, 9.8) 'Exploitation Less Likely'; CVE-2026-41096 (2026-05-12, 9.8) 'Exploitation Unlikely'; all exploited: No, publiclyDisclosed: No. The Register: 'Redmond says exploitation is \"unlikely\"' for CVE-2026-41096."
      ground_truth_url: "work/2026-10-21T1148Z-audit/truth-2/bodies/e2-msrc-CVE-2026-33824.txt"
      fix: "Replace with the vendor's own ratings per CVE and a patch-priority argument based on unauthenticated network reachability (tcpip.sys, IKEEXT, Netlogon CLDAP, DNS client), not 'practically exploitable'."
      class: factual-error
    - where: "body paragraph 1 ('first production run')"
      claim: "In MDASH's first production run against Windows the harness produced 16 previously unknown CVEs"
      defect: "'First production run' is not in either cited page; Microsoft says only that 16 CVEs in the Patch Tuesday were found with MDASH and that the harness is used by Microsoft security engineering teams."
      ground_truth: "'Across the Windows network stack and adjacent services, today's Patch Tuesday includes 16 CVEs our engineering teams found using codename MDASH.'"
      ground_truth_url: "https://www.microsoft.com/en-us/security/blog/2026/05/12/defense-at-ai-speed-microsofts-new-multi-model-agentic-security-system-finds-16-new-vulnerabilities/"
      fix: "Delete 'In MDASH's first production run'; write 'Microsoft credits MDASH with 16 CVEs in the May 2026 release'."
      class: factual-error
    - where: "body paragraph 1 (last sentence)"
      claim: "Microsoft has scheduled a customer-facing preview of the harness for June 2026."
      defect: "Neither page gives a June date; the preview is already running as a limited private preview."
      ground_truth: "Microsoft: 'tested by a small set of customers as part of a limited private preview'; The Register: 'making the tool available to a limited number of customers in private preview'."
      ground_truth_url: "https://www.microsoft.com/en-us/security/blog/2026/05/12/defense-at-ai-speed-microsofts-new-multi-model-agentic-security-system-finds-16-new-vulnerabilities/"
      fix: "Write 'a limited private preview with a small set of customers has started; sign-up is open'."
      class: factual-error
    - where: "Defender takeaway, second implication"
      claim: "DirectAccess and Always-On VPN are widely deployed as the AD-integrated remote-access primitive across Swiss federal and EU government estates"
      defect: "No page read says anything about deployment in Swiss federal or EU government estates; the exposure statement the source gives is narrower and has a precondition."
      ground_truth: "CVE-2026-33824 is 'reachable by a remote, unauthenticated attacker over UDP/500 on any host configured as an IKEv2 responder (RRAS VPN, DirectAccess, Always-On VPN infrastructure, or any machine with an inbound connection security rule)'; 'a bare Start-Service IKEEXT with no responder policy is not vulnerable'."
      ground_truth_url: "https://www.microsoft.com/en-us/security/blog/2026/05/12/defense-at-ai-speed-microsofts-new-multi-model-agentic-security-system-finds-16-new-vulnerabilities/"
      fix: "Drop the deployment assertion; state the exposure condition (IKEv2 responder policy present) and tell the reader to check for hosts with RRAS VPN, DirectAccess, Always-On VPN infrastructure or inbound connection security rules."
      class: factual-error
    - where: "headline; cves[]; Defender takeaway (Patch Tuesday month)"
      claim: "finds 16 Windows CVEs in network-stack kernel components; cves: []; 'expedite May 2026 cumulative update'"
      defect: "Six of the 16 are user-mode, the table also covers http.sys and telnet.exe, none of the CVE ids is named in the entry (cves[] is empty), and two of the four Critical RCEs (CVE-2026-33827, CVE-2026-33824) were released in April, so the 'May cumulative update' is not where they first shipped."
      ground_truth: "Microsoft: 'These vulnerabilities are 10 kernel-mode / 6 usermode.' Critical rows: CVE-2026-33827 (tcpip.sys), CVE-2026-33824 (ikeext.dll), CVE-2026-41089 (netlogon.dll), CVE-2026-41096 (dnsapi.dll); 'CVE-2026-33827, patched in April Patch Tuesday', 'CVE-2026-33824, patched in April Patch Tuesday'. MSRC release dates 2026-04-14 for those two, 2026-05-12 for the other two."
      ground_truth_url: "https://www.microsoft.com/en-us/security/blog/2026/05/12/defense-at-ai-speed-microsofts-new-multi-model-agentic-security-system-finds-16-new-vulnerabilities/"
      fix: "Headline: 'finds 16 Windows CVEs in networking and authentication components'; list the four Critical ids with MSRC CVSS (8.1, 9.8, 9.8, 9.8) and release months in cves[] or the body."
      class: imprecision
    - where: "Defender takeaway (ATT&CK sentence)"
      claim: "Mapped to `T1190 Exploit Public-Facing Application` and `T1133 External Remote Services`."
      defect: "T1133 describes use of legitimate remote services with valid access; the source describes pre-authentication memory-corruption bugs in network services, which is T1190 only, and no exploitation is reported."
      ground_truth: "'Unauth IKEv2 SA_INIT double-free triggers LocalSystem RCE'; MSRC 'exploited: No'."
      ground_truth_url: "https://www.microsoft.com/en-us/security/blog/2026/05/12/defense-at-ai-speed-microsofts-new-multi-model-agentic-security-system-finds-16-new-vulnerabilities/"
      fix: "Keep T1190 (as a potential, not observed, vector); drop T1133."
      class: imprecision
    - where: "body (Defender takeaway)"
      claim: "(a substantial subset of the May 2026 Patch Tuesday in § 2)"
      defect: "Reference to a section of the retired v2 brief ('§ 2') is pipeline self-reference with no target for readers."
      ground_truth: "n/a (migration artefact; entry has migrated_from: briefs/2026-05-13.md)"
      ground_truth_url: "work/2026-10-21T1148Z-audit/truth-2/bodies/e2-msft.txt"
      fix: "Delete the '§ 2' reference."
      class: imprecision
  upgrade:
    techniques:
      - {id: T1190, behavior: "Unauthenticated network-reachable memory-corruption bugs in tcpip.sys (SSRR UAF), IKEEXT (SA_INIT double-free), Netlogon CLDAP and the DNS client; vulnerability disclosure, no exploitation reported", url: "https://www.microsoft.com/en-us/security/blog/2026/05/12/defense-at-ai-speed-microsofts-new-multi-model-agentic-security-system-finds-16-new-vulnerabilities/"}
    rating: {reliability: B, credibility: 2, basis: "Primary is Microsoft's own research blog on its own system and CVEs (benchmarks are self-reported); The Register restates the announcement, so one assessor uncorroborated."}
    exposure:
      - {quote: "reachable by a remote, unauthenticated attacker over UDP/500 on any host configured as an IKEv2 responder (RRAS VPN, DirectAccess, Always-On VPN infrastructure, or any machine with an inbound connection security rule)", url: "https://www.microsoft.com/en-us/security/blog/2026/05/12/defense-at-ai-speed-microsofts-new-multi-model-agentic-security-system-finds-16-new-vulnerabilities/"}
      - {quote: "a bare `Start-Service IKEEXT` with no responder policy is not vulnerable", url: "https://www.microsoft.com/en-us/security/blog/2026/05/12/defense-at-ai-speed-microsofts-new-multi-model-agentic-security-system-finds-16-new-vulnerabilities/"}
    detection:
      - {quote: "The trigger sequence is two UDP packets, no race, no special timing.", url: "https://www.microsoft.com/en-us/security/blog/2026/05/12/defense-at-ai-speed-microsofts-new-multi-model-agentic-security-system-finds-16-new-vulnerabilities/"}
    triage: []
    takeaway:
      - {quote: "CVE-2026-33824, patched in April Patch Tuesday.", url: "https://www.microsoft.com/en-us/security/blog/2026/05/12/defense-at-ai-speed-microsofts-new-multi-model-agentic-security-system-finds-16-new-vulnerabilities/"}
      - {quote: "Microsoft also said its secret-until-now AI bug hunting system, codenamed MDASH, found 16 of the vulnerabilities addressed in this month's release.", url: "https://www.theregister.com/patches/2026/05/13/doozy-of-a-patch-tuesday-includes-30-critical-microsoft-cves/5239224"}
    bodies: [work/2026-10-21T1148Z-audit/truth-2/bodies/e2-msft.txt, work/2026-10-21T1148Z-audit/truth-2/bodies/e2-register-raw.txt, work/2026-10-21T1148Z-audit/truth-2/bodies/e2-msrc-CVE-2026-33827.txt, work/2026-10-21T1148Z-audit/truth-2/bodies/e2-msrc-CVE-2026-33824.txt, work/2026-10-21T1148Z-audit/truth-2/bodies/e2-msrc-CVE-2026-41089.txt, work/2026-10-21T1148Z-audit/truth-2/bodies/e2-msrc-CVE-2026-41096.txt]
  possible_twin_outside_batch: "entries/2026-05-13/cve-2026-41089-cve-2026-41096-cve-2026-41103-cve-2026-42898.md (May 2026 Patch Tuesday entry that also mentions MDASH; CVE-2026-41089 and CVE-2026-41096 are among the MDASH CVEs)"
