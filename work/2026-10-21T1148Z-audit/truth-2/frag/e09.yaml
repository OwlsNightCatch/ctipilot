    - work/2026-10-21T1148Z-audit/truth-2/bodies/e9-socket.txt
    - work/2026-10-21T1148Z-audit/truth-2/bodies/e9-thn.txt
    - work/2026-10-21T1148Z-audit/truth-2/bodies/e9-rubyhack.txt
