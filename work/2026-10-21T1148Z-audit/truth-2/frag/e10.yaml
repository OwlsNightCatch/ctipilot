    rating: {reliability: B, credibility: 2, basis: "Check Point Research analysed a partial leak (B); BankInfoSecurity's DynaRisk analyst read the same leak independently and agrees on the broad workflow (edge access, EDR killers, ZeroPulse), but the specific counts and tool roles rest on Check Point alone (2)."}
    exposure:
      - {quote: "The group claims to usually gain initial access through exposed edge devices such as VPN appliances, firewalls, and other internet-facing systems, with a particular focus on platforms like Fortinet FortiGate and Cisco.", url: "https://research.checkpoint.com/2026/thus-spoke-the-gentlemen/"}
    detection:
      - {quote: "Rather than immediately deploying ransomware, the group carefully mapped the environment, searched for virtualization infrastructure, backup systems, NAS devices and critical servers to maximize impact", url: "https://www.bankinfosecurity.com/tables-turned-gentlemen-ransomware-group-suffers-data-leak-a-31654"}
    triage: []
    takeaway:
      - {quote: "The keys are lost soon after the process exits. Once the ransomware process terminates, the operating system reclaims its memory and the keys are quickly gone.", url: "https://github.com/Bedrock-Safeguard/gentlemen-decryptor"}
      - {quote: "EDR/XDR solutions — CrowdStrike, SentinelOne, Carbon Black, Microsoft Defender for Endpoint, and others may capture process memory when they detect the threat. Check your EDR console for memory captures or forensic snapshots from the incident.", url: "https://github.com/Bedrock-Safeguard/gentlemen-decryptor"}
