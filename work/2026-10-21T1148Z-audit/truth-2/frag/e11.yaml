      - {id: T1550.004, behavior: "Pre-2FA session cookie replayed as a Bearer token against DAV endpoints to skip TOTP", url: "https://github.com/nextcloud/security-advisories/security/advisories/GHSA-mp6x-g55j-w9jw"}
      - {id: T1213, behavior: "Read/write access to files, calendars and contacts over DAV after the bypass", url: "https://github.com/nextcloud/security-advisories/security/advisories/GHSA-mp6x-g55j-w9jw"}
    rating: {reliability: A, credibility: 2, basis: "Nextcloud's own GHSA for its own product (A); BSI WID-SEC-2026-1517 restates the vendor batch (one assessor, 2)."}
    exposure:
      - {quote: "A pre-2FA session cookie (created after successful password authentication but before TOTP completion) could be reused as a Bearer token to authenticate against DAV endpoints, granting read/write access and bypassing mandatory two-factor authentication.", url: "https://github.com/nextcloud/security-advisories/security/advisories/GHSA-mp6x-g55j-w9jw"}
