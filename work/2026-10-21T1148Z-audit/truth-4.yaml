    ground_truth_url: https://cveawg.mitre.org/api/cve/CVE-2026-7507
    fix: Set each cvss to the Red Hat score; vector network with UI:R where stated; auth post-auth for 37979/4630/37978; fixed "26.6.2".
    class: factual-error
  - where: entities
    claim: 'entities: ["actor:akira"]'
    defect: Akira has nothing to do with Keycloak; the link comes from the SonicWall row of the pasted CVE table.
    ground_truth: Keycloak 26.6.2 release notes and BSI WID-SEC-2026-1612 name no threat actor.
    ground_truth_url: https://www.keycloak.org/2026/05/keycloak-2662-released
    fix: 'entities: [] (or a product entity for Keycloak if the registry has one).'
    class: factual-error
  - where: body "CVE Summary Table"
    claim: '| CVE-2026-9082 | Drupal core ... | CVE-2026-42822 | ... ALDO | CVE-2026-45829 | ChromaDB ... | CVE-2024-12802 | SonicWall Gen6 SSL-VPN | 9.1 (CVSS 3.1) | ... | Yes — Akira-linked'
    defect: 'The v2 brief''s cross-item CVE table is pasted into this entry: four of five rows are other findings, the Drupal row is superseded (exploited, KEV-listed, 23/25 since 2026-05-22), the Keycloak row says CVSS not yet assigned, and the SonicWall row gives CISA-ADP''s 9.1 instead of SonicWall''s 6.5 and calls the activity Akira-linked where the source says only "consistent with".'
    ground_truth: 'Cybersecurity Dive: "the flaw was given a severity score of only 6.5 by SonicWall"; "Researchers could not provide direct attribution for the attacks, but the threat activity was consistent with ransomware activity from the Akira group."'
    ground_truth_url: https://www.cybersecuritydive.com/news/patch-bypass-hackers-exploit-flaw-sonicwall/820600/
    fix: Delete the table from this entry.
    class: factual-error
  - where: summary; body sentence 1
    claim: fixing 16 CVEs ...; BSI's CERT-Bund issued advisory WID-SEC-2026-1612 on 2026-05-20 classifying the batch as HIGH risk
    defect: The release notes list 16 CVE-tagged issues carrying 18 CVE ids (one issue bundles three Bouncy Castle CVEs). BSI's advisory covers 9 of them (it omits 6856, 4628, 37980 and the third-party CVEs), so it does not classify "the batch".
    ground_truth: 'BSI CSAF WID-SEC-2026-1612 "Keycloak: Mehrere Schwachstellen", initial release 2026-05-19T22:00Z, aggregate severity "hoch", CVEs 37978, 37979, 37981, 37982, 4630, 7307, 7504, 7507, 7571.'
    ground_truth_url: https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-1612
    fix: '"16 security issues (18 CVE ids, several in bundled Netty/Bouncy Castle components); BSI rates its nine-CVE advisory high".'
    class: imprecision
  - where: body (37979, 37978 endpoint paths; 37982 precondition; Red Hat build; Defender takeaway)
    claim: '`/auth/realms/{realm}/protocol/openid-connect/token/introspect` ... after one user interaction ... Red Hat build of Keycloak (RH-SSO / RHBK) 26.2.x is similarly affected via separate RHSA advisories ... Keycloak is the de-facto standard IAM for EU public-sector and Swiss cantonal / federal identity federation projects'
