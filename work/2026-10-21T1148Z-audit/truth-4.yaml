- entry: 2026-05-20/huawei-vrp-enterprise-router-zero-day-caused-post-luxembourg
  verdict: factual-error
  defects:
  - where: title; headline; summary; body paragraph 1
    claim: Huawei VRP enterprise-router zero-day ... a zero-day vulnerability in **Huawei VRP** (Versatile Routing Platform) operating-system software on enterprise routers was the root cause
    defect: (low confidence) The Record never states that the unknown flaw is in VRP; it says "Huawei enterprise router software". VRP is named once, as the OS that earlier had DoS CVEs, which POST says were not involved.
    ground_truth: 'The Record: "An attack exploiting a previously unknown vulnerability in Huawei enterprise router software caused a nationwide telecoms outage in Luxembourg"; "Huawei’s VRP network operating system has previously been affected by denial-of-service vulnerabilities involving specially crafted protocol traffic, including CVE-2021-22359 and CVE-2022-29798."; "POST said neither previously disclosed Huawei vulnerability was involved". Paperjam (2025, quoted 2026-05-22): two sources said attackers targeted "Huawei routers and their operating software".'
    ground_truth_url: https://therecord.media/huawei-zero-day-behind-last-year-luxembourg-telecom-outage
    fix: Say "a previously unknown vulnerability in Huawei enterprise router software" and drop "VRP" from title, headline and summary unless a second source names VRP.
    class: factual-error
  - where: body paragraph 1, sentence 4
    claim: Luxembourg prosecutors stated they found "no evidence that an attack was specifically directed at POST Luxembourg"
    defect: Misattributed. The no-evidence statement came from a spokesperson of Luxembourg's High Commission for National Protection; the public prosecutor's statement was about corrupted data relayed through POST. The clause is also uncited and truncates the quote ("as a chosen target").
    ground_truth: 'The Record: "investigators ultimately concluded there was “no evidence that an attack was specifically directed at POST Luxembourg as a chosen target,” a spokesperson for Luxembourg’s High Commission for National Protection told Recorded Future News." and "The country’s public prosecutor said an investigation by police and cybersecurity experts identified that “corrupted data ... had been relayed through POST Luxembourg acting in its role as internet service provider and caused their systems to stop and reboot instead of simply relaying the data.”"'
    ground_truth_url: https://therecord.media/huawei-zero-day-behind-last-year-luxembourg-telecom-outage
    fix: '"A spokesperson for Luxembourg''s High Commission for National Protection told Recorded Future News investigators found ''no evidence that an attack was specifically directed at POST Luxembourg as a chosen target''" and cite The Record.'
    class: factual-error
  - where: body paragraph 1, Rausch quotation
    claim: the incident "exploited a non-public, non-documented behaviour, for which no patch was available at the time"
    defect: The quotation marks include the reporter's verb "exploited"; Rausch's quoted words start at "a non-public". The article also reports he called it a denial-of-service attack targeting a network device, which the entry omits, and that the zero-day characterisation otherwise rests on anonymous sources.
    ground_truth: 'The Record: "Rausch said the incident was a denial-of-service (DoS) attack targeting a network device. He confirmed it exploited “a non-public, non-documented behaviour, for which no patch was available at the time” and was “not related to the exploitation of any known or previously documented vulnerabilities.”" and "Multiple sources briefed on the matter, who spoke on condition of anonymity ... described the incident as a zero-day attack."'
    ground_truth_url: https://therecord.media/huawei-zero-day-behind-last-year-luxembourg-telecom-outage
    fix: Quote only "a non-public, non-documented behaviour, for which no patch was available at the time", add "denial-of-service", and hedge "reportedly ... according to anonymous sources" on the zero-day label.
    class: imprecision
  - where: tags
    claim: 'tags: nation-state'
    defect: No source attributes the traffic to a state actor; the article reports no actor, no target intent and no charges.
    ground_truth: 'The Record: "no evidence that an attack was specifically directed at POST Luxembourg as a chosen target"; "No criminal charges have been filed."; the government''s early wording was "an exceptionally advanced and sophisticated cyberattack" (no attribution).'
    ground_truth_url: https://therecord.media/huawei-zero-day-behind-last-year-luxembourg-telecom-outage
    fix: Remove the nation-state tag.
    class: imprecision
  - where: summary; body last line; migrated_from
    claim: '... disruption of landline, 4G, and 5G networks for more than … / [SINGLE-SOURCE — Recorded Future News, named institutional sources].'
    defect: The frontmatter summary is cut off mid-sentence ("for more than …"), and the body ends with a pipeline flag marker, which is reader-facing pipeline self-reference.
    ground_truth: 'The Record: "disrupting mobile, landline and emergency communications for more than three hours".'
    ground_truth_url: https://therecord.media/huawei-zero-day-behind-last-year-luxembourg-telecom-outage
    fix: Finish the summary sentence ("for more than three hours") and replace the bracketed marker with a sourcing_note of two provenance sentences.
    class: imprecision
  upgrade:
    techniques:
    - id: T1499.004
      behavior: Specially crafted traffic transiting an ISP puts Huawei enterprise routers into a continuous restart loop (application or system exploitation DoS); no access vector or actor is reported, so nothing else is mapped
      url: https://therecord.media/huawei-zero-day-behind-last-year-luxembourg-telecom-outage
    rating:
      reliability: B
      credibility: 2
      basis: The Record (Recorded Future News) is original reporting by a specialist outlet; POST Luxembourg (victim) and the High Commission for National Protection are quoted on record. The zero-day label rests partly on anonymous sources and Huawei has not commented; Paperjam restates The Record and reported Huawei enterprise routers on 2025-07-30.
    exposure:
    - quote: It was caused by specially crafted network traffic that sent Huawei enterprise routers into a continuous restart loop, crashing critical parts of POST’s infrastructure.
      url: https://therecord.media/huawei-zero-day-behind-last-year-luxembourg-telecom-outage
    - quote: Ten months later, it remains unclear whether the vulnerability was ever fully patched, how many operators may have been exposed or whether similar Huawei systems remain vulnerable today.
      url: https://therecord.media/huawei-zero-day-behind-last-year-luxembourg-telecom-outage
    detection:
    - quote: corrupted data, which may be used to prepare an attack on a random server responding to it, had been relayed through POST Luxembourg acting in its role as internet service provider and caused their systems to stop and reboot instead of simply relaying the data.
      url: https://therecord.media/huawei-zero-day-behind-last-year-luxembourg-telecom-outage
    triage: []
    takeaway:
    - quote: The company still publishes enterprise security advisories, but through a restricted customer portal rather than broad public advisories.
      url: https://therecord.media/huawei-zero-day-behind-last-year-luxembourg-telecom-outage
    bodies:
    - work/2026-10-21T1148Z-audit/truth-4/bodies/therecord-huawei-luxembourg.txt
    - work/2026-10-21T1148Z-audit/truth-4/bodies/paperjam-post-huawei.txt
    - work/2026-10-21T1148Z-audit/truth-4/bodies/securityaffairs-huawei-lux.txt
    extra:
      note: No CVE exists for the flaw (The Record, 2026-05-19). Huawei told POST "it had never encountered the attack among any of its customers and had no ready-made solution". Separate restricted-portal Huawei advisory (April 2026, DoS in packet parsing, no CVE) is stated NOT to be related.
      age: single-victim event of 2025-07-23 reported 2026-05-19; relevant as unpatched-status/unknown exposure for operators of Huawei enterprise routers
  possible_twin_outside_batch: null
- entry: 2026-05-20/nx-console-vs-code-extension-2-2-m-installs-compromised-via
  verdict: factual-error
  defects:
  - where: title; headline; summary; body paragraph 1; body paragraph 2 ("the 11-minute window")
    claim: 11-minute window 2026-05-18 12:36–12:47 UTC ... On 2026-05-18 between 12:36 and 12:47 UTC, version 18.95.0 ... was pushed to the Visual Studio Marketplace
    defect: 12:36 UTC is when a maintainer received the automatic upload e-mail and 12:47 UTC is the unpublish. The vendor's exposure window is 12:30 to 13:09 UTC (Marketplace upload registered 12:30, removed 12:48; Open VSX live 12:33 to 13:09), and Nx's advisory had already corrected the timeline on 2026-05-19 13:37 UTC.
    ground_truth: 'GHSA-c9j4-9m59-847w: "A malicious version of Nx Console 18.95.0 was published at 12:30 PM UTC and removed soon after at 12:48 PM UTC, leaving it available for ~18 minutes in Visual Studio Marketplace. For OpenVSX ... the compromised version was available from 12:33 UTC to 13:09 UTC (~36 minutes)." Nx postmortem: "Anyone who installed v18.95.0 during the exposure window (2026-05-18, 12:30-13:09 UTC) should treat their machine as compromised".'
    ground_truth_url: https://github.com/nrwl/nx-console/security/advisories/GHSA-c9j4-9m59-847w
    fix: '"On 2026-05-18 an attacker published Nx Console 18.95.0 to the Visual Studio Marketplace (12:30 to 12:48 UTC) and Open VSX (12:33 to 13:09 UTC)"; headline: drop "11-minute window" or say "~18 minutes on the Marketplace, ~36 on Open VSX"; exposure window 12:30-13:09 UTC.'
    class: factual-error
  - where: title; headline; summary; body paragraph 1 (root cause)
    claim: compromised via stolen publisher credentials ... pushed to the Visual Studio Marketplace using stolen publisher credentials
    defect: Nx's root cause is a contributor's GitHub CLI OAuth token stolen seven days earlier by the TanStack npm supply-chain compromise (a malicious @tanstack package resolved during pnpm install); the upload was authenticated as that contributor. "Publisher credentials" is the secondary outlets' framing and the upstream chain, the transferable lesson, is absent.
    ground_truth: 'Nx postmortem: "The attacker published the malicious version as a legitimate Nx core contributor. A credential-stealing payload that arrived through the TanStack supply-chain compromise had silently exfiltrated that contributor''s GitHub CLI OAuth token seven days earlier." GHSA: "One of our developers was compromised by a recent supply-chain compromise on Tanstack, which leaked their GitHub credentials through the GitHub CLI (`gh`)."'
    ground_truth_url: https://nx.dev/blog/nx-console-v18-95-0-postmortem
    fix: '"... published as a compromised core contributor whose GitHub CLI OAuth token was stolen in the 2026-05-11 TanStack npm supply-chain compromise"; add that no single-actor-release gate existed.'
    class: imprecision
  - where: body paragraph 1, THN-cited sentence
    claim: On macOS the loader installs a persistent Python backdoor using the GitHub Search API as command channel, with messages signed with a 4096-bit RSA key ([The Hacker News, 2026-05-19](...))
    defect: The Hacker News carries the Python backdoor and the GitHub Search API dead-drop, but not "persistent" or the 4096-bit RSA signing; StepSecurity and CybersecurityNews carry those.
    ground_truth: 'THN: "It also installs a Python backdoor on macOS systems that abuses the GitHub Search API as a dead drop resolver for receiving further commands." StepSecurity: "persistent Python backdoor on macOS that uses the GitHub Search API as a dead-drop for receiving further commands signed with a 4096-bit RSA key."'
    ground_truth_url: https://www.stepsecurity.io/blog/nx-console-vs-code-extension-compromised
    fix: Cite StepSecurity (or CybersecurityNews) for the RSA clause and "persistent"; keep THN for the dead-drop.
    class: imprecision
  - where: body paragraph 1 (uncited stealer sentence)
    claim: 'exfiltrating over three independent channels: HTTPS, GitHub API as dead-drop, and DNS tunnelling'
    defect: (low confidence) The sources list HTTPS, the GitHub API and DNS as exfiltration channels; the dead-drop use of the GitHub Search API is the macOS backdoor's command channel. "Kubernetes kubeconfigs" is StepSecurity's remediation list, while Nx lists Kubernetes service-account tokens under Vault.
    ground_truth: 'StepSecurity: "exfiltrates them over three independent channels: HTTPS, the GitHub API, and DNS tunneling. It also installs a persistent Python backdoor on macOS that uses the GitHub Search API as a dead-drop". Nx postmortem: "Exfiltrated via HTTPS to attacker infrastructure, the GitHub API, and DNS-based covert channels"; "Vault: ... Kubernetes service-account tokens, AWS IAM auth tokens".'
    ground_truth_url: https://www.stepsecurity.io/blog/nx-console-vs-code-extension-compromised
    fix: '"... exfiltrating over HTTPS, the GitHub API and DNS; the macOS backdoor takes signed commands through the GitHub Search API"; cite StepSecurity or the Nx postmortem.'
    class: imprecision
  - where: headline; summary (scope)
    claim: Nx Console VS Code extension (2.2 M installs) compromised
