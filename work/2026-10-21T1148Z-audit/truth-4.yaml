      behavior: Stolen payment card records (PAN, CVV2, billing identity) distributed for card-not-present fraud; SOCRadar only assesses the collection as likely e-commerce skimming or phishing, so no collection technique is mapped as fact
      url: https://socradar.io/blog/b1acks-stash-4-6-million-stolen-credit-cards-free/
    rating:
      reliability: B
      credibility: 2
