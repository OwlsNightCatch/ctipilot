    ground_truth_url: https://security-hub.ncsc.admin.ch/#/posts/12584
    fix: State the KEV listing on its own clause cited to the CISA catalog entry (or the CVE record's CISA-ADP kev block); delete the parenthesis.
    class: factual-error
  - where: immediate_action; section 2026-05-23T05:00:10Z second paragraph
    claim: Imperva reports observing **15,000+ exploitation attempts against approximately 6,000 Drupal sites across 65 countries** within days of disclosure
    defect: Imperva counts "attack attempts" and says most of it is probing; calling them exploitation attempts overstates it. The 6,000 sites/65 countries figure is Imperva customer telemetry.
    ground_truth: 'Imperva: "Imperva has observed over 15,000 attack attempts targeting almost 6,000 individual sites across 65 countries." "Most of the observed activity so far appears to be probing." "Attacks are primarily targeting Gaming and Financial Services sites so far, at collectively almost 50% of all attacks."'
    ground_truth_url: https://www.imperva.com/blog/imperva-customers-protected-against-cve-2026-9082-in-drupal-core/
    fix: '"Imperva observed over 15,000 attack attempts against almost 6,000 sites in 65 countries, mostly probing" and cite it.'
