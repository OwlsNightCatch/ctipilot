- entry: 2026-05-21/b1ack-s-stash-carding-marketplace-publicly-releases-4-6m-car
  verdict: imprecision
  defects:
  - where: body, Defender takeaway
    claim: review e-skimming exposure on legacy WooCommerce / Magento storefronts in the customer-facing estate; the consistent collection-method finding across multiple B1ack's Stash waves points at front-end JavaScript skimmer infections as the upstream root cause that still goes undetected in many low-volume merchant configurations.
    defect: No source names WooCommerce, Magento or FS-ISAC, compares collection methods across waves, or says skimmers go undetected in low-volume merchants; SOCRadar only assesses that this dataset "appears" to come from skimming or phishing.
    ground_truth: 'SOCRadar: "The data appears to be sourced from e-commerce skimming or phishing operations, given the presence of full cardholder identity details alongside payment data." SecAffairs on earlier waves: free releases used "as a marketing tool".'
    ground_truth_url: https://socradar.io/blog/b1acks-stash-4-6-million-stolen-credit-cards-free/
    fix: '"SOCRadar assesses the records likely come from e-commerce skimming or phishing; card-fraud teams can check exposure via their card-network compromise notifications." Drop the platform names and the cross-wave root-cause claim.'
    class: imprecision
  - where: headline; summary; event_date; sources[].publisher
    claim: '...not confirmed by issuing / ...as a punitive action against vendors that … / event_date: 2026-05-20'
    defect: Headline and summary are cut off mid-phrase. The primary (SOCRadar) is dated 2026-05-18 while event_date is 2026-05-20 (the Security Affairs date). The "announced ... on 2026-05-18" date is SOCRadar's publication date; SOCRadar says only that the marketplace "recently declared" the release. Source records carry no dates.
    ground_truth: 'SOCRadar page date 2026-05-18: "B1ack Stash recently declared the suspension of approximately 8 million stolen CVV2 records"; Security Affairs dated 2026-05-20.'
    ground_truth_url: https://socradar.io/blog/b1acks-stash-4-6-million-stolen-credit-cards-free/
    fix: Finish the headline and summary; event_date 2026-05-18; "reported on 2026-05-18".
    class: imprecision
  - where: body sentence 3 (citation binding)
    claim: SOCRadar's analysis estimates ~4.3 million records are net-new after de-duplication and expired-card filtering
    defect: The 4.3 million figure is not on the SOCRadar page; Security Affairs reports it as SOCRadar's validation. The clause carries no citation.
    ground_truth: 'Security Affairs: "SOCRadar validated a portion of the records and found that some had already expired or appeared as duplicates. After filtering, roughly 4.3 million records appear to be fresh and potentially usable."'
    ground_truth_url: https://securityaffairs.com/192415/cyber-crime/carding-site-b1acks-stash-dumps-4-6-million-stolen-cards-for-free.html
    fix: Cite Security Affairs on the 4.3 million clause; also note SOCRadar's "approximately 8 million stolen CVV2 records" suspended, of which 4.6 million were released.
    class: imprecision
  - where: tags
    claim: 'tags: cryptocrime'
    defect: Nothing in the sources concerns cryptocurrency; this is payment-card fraud.
    ground_truth: 'SOCRadar: "one of the most active illicit card shops on the Dark Web".'
    ground_truth_url: https://socradar.io/blog/b1acks-stash-4-6-million-stolen-credit-cards-free/
    fix: Drop cryptocrime.
    class: imprecision
  upgrade:
