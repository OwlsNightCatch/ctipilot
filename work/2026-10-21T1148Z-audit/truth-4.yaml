- entry: 2026-05-21/cve-2026-42822-microsoft-azure-local-disconnected-operations
  verdict: factual-error
  defects:
  - where: body sentence 1; summary; cves[CVE-2026-42822].vector
    claim: allows an unauthorised network attacker to elevate privileges over a network with no credentials and no prior foothold
    defect: The advisory's own FAQ says the realistic attacker is a malicious or compromised insider with existing access and identity context; an external attacker must first gain internal network access and valid identity context, and ALDO runs disconnected and isolated. "No credentials and no prior foothold" contradicts it, and "zero-click" overstates it.
    ground_truth: 'MSRC FAQ: "The most realistic exploitation scenario involves a malicious or compromised insider with existing access to the customer’s environment." "In external attacker scenarios, exploitation is significantly more constrained. An attacker would first need to: Gain access to the customer’s internal network ... and Obtain valid identity context within the environment."'
    ground_truth_url: https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-42822
    fix: '"Improper authentication lets an unauthorized attacker on the network elevate privileges (CVSS 10.0, PR:N); Microsoft says the realistic attacker is an insider or a compromised internal identity, since ALDO runs isolated." Set vector to network (internal), not zero-click.'
    class: factual-error
  - where: summary; body sentence 3; actions[0]
    claim: Cloud-managed Azure customers using Microsoft-operated Resource Manager environments are already protected — only manually-operated air-gapped Azure Local stacks need action.
    defect: The MSRC record contains no such statement; its remediation FAQ addresses only ALDO customers. The scope sentence is unsourced.
    ground_truth: 'MSRC FAQ: "For Azure Local Disconnected Operations (ALDO) customers: To protect against this vulnerability, customers must update their Azure Local Disconnected Operations (ALDO) environment to the latest available release (version 2604 or later)."'
    ground_truth_url: https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-42822
    fix: '"Only ALDO deployments are affected (MSRC tags the product Azure Local Disconnected Operations)"; drop the Resource Manager sentence.'
    class: factual-error
  - where: body Defender takeaway; priority
    claim: EU public-sector operators running Azure Local for data-sovereignty / federal data-residency compliance (a common pattern in Bundesverwaltung and German Bundesbehörden environments) should treat this as a Patch-Tuesday-class emergency
    defect: The prevalence claim has no source. MSRC describes ALDO as a restricted, allow-listed offering whose realistic attacker is an insider, which the entry omits; the `high` priority leans on the contradicted "no credentials, no foothold" framing.
    ground_truth: 'MSRC: "ALDO is a restricted offering, and updates are only available to approved customers via allow-listing."'
    ground_truth_url: https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-42822
    fix: Drop the Bundesverwaltung claim; state who is exposed (approved ALDO customers) and reconsider the priority on the insider-precondition facts.
    class: imprecision
  - where: actions[0]; cves[].affected/fixed; body sentence 4
    claim: '"Exploitation More Likely" — cloud-managed Azure is already protected, manual stacks are not (. / affected: null, fixed: null / via the standard ALDO update channel'
    defect: actions[0] contains a broken parenthesis; the fix version is known but not in cves[]; MSRC says updates are full system updates through the Azure portal for allow-listed customers, not standalone patches.
    ground_truth: 'MSRC: "Updates are not available as standalone patches and must be applied as a full system update through the Azure portal."'
    ground_truth_url: https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-42822
    fix: 'fixed: "ALDO 2604"; describe the update path as a full system update via the Azure portal; remove "(.".'
    class: imprecision
  upgrade:
    techniques:
    - id: T1068
      behavior: Improper authentication in ALDO lets an attacker elevate privileges over the network (CVSS 10.0, scope change)
      url: https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-42822
    - id: T1078
      behavior: 'Microsoft''s realistic scenario: a malicious or compromised insider identity with tenant/user identifiers, credentials or tokens performs the exploitation'
      url: https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-42822
    rating:
      reliability: A
      credibility: 2
      basis: MSRC is the vendor PSIRT for its own product; single assessor, not exploited, not publicly disclosed, not in CISA KEV.
    exposure:
    - quote: ALDO is a restricted offering, and updates are only available to approved customers via allow-listing.
