- entry: 2026-05-21/pintheft-linux-kernel-local-privilege-escalation-primitive-r
  verdict: imprecision
  defects:
  - where: body, exposure sentence
    claim: '**The RDS module is default-loaded only on Arch Linux** — not on Ubuntu, Fedora, Debian, RHEL or SUSE'
    defect: V12 says only that, among the common distributions it tested, the RDS module is default only on Arch; it names no other distribution and does not say "loaded".
    ground_truth: 'oss-security (quoting V12): "Sadly, the RDS kernel module this requires is only default on Arch Linux among the common distributions we tested." Sam James: "The referenced kernel module is CONFIG_RDS + CONFIG_RDS_TCP."'
    ground_truth_url: https://www.openwall.com/lists/oss-security/2026/05/19/6
    fix: '"V12 found the RDS module (CONFIG_RDS + CONFIG_RDS_TCP) enabled by default only on Arch Linux among the common distributions it tested."'
    class: imprecision
  - where: cves[]; body ("no CVE assigned at disclosure")
    claim: 'cves: [] / Upstream kernel patch landed before disclosure; **no CVE assigned at disclosure**.'
    defect: (low confidence) True at disclosure, but the kernel CNA published CVE-2026-43494 on 2026-05-21 for the same rds_message_zcopy_from_user() double-free; the record does not use the PinTheft name, so the mapping rests on the identical function and mechanism (and on third-party write-ups).
    ground_truth: 'CVE-2026-43494 (Linux CNA, 2026-05-21): "When iov_iter_get_pages2() fails in rds_message_zcopy_from_user(), the pinned pages are released with put_page() ... But we fail to properly clear rm->data.op_nents. Later when rds_message_purge() is called from rds_sendmsg() the cleanup loop ... frees them again." CVSS 3.1 7.8 AV:L/AC:L/PR:L.'
    ground_truth_url: https://cveawg.mitre.org/api/cve/CVE-2026-43494
    fix: Add CVE-2026-43494 (cvss 7.8, lpe, local, post-auth, patch-available, poc-public) and say "CVE-2026-43494 was assigned on 2026-05-21".
    class: imprecision
  - where: body, Defender detection
    claim: auditd syscall events for `rds_sendmsg` / `io_uring_*` from unexpected binaries
    defect: (low confidence) rds_sendmsg is a kernel function, not a syscall auditd can match (the syscalls are socket(AF_RDS)/sendmsg and io_uring_setup/io_uring_register); no source gives this detection.
    ground_truth: 'CVE-2026-43494: "Later when rds_message_purge() is called from rds_sendmsg() the cleanup loop iterates over the incorrectly non zero number of op_nents".'
    ground_truth_url: https://cveawg.mitre.org/api/cve/CVE-2026-43494
    fix: '"auditd on socket() with the RDS address family and io_uring_register from unexpected processes, followed by a SUID binary spawning a root shell" and mark it as analyst guidance.'
    class: imprecision
  - where: summary; body sentence 1
    claim: Aaron Esau (V12 Security) disclosed PinTheft on 2026-05-19 via the oss-security mailing list
    defect: V12 published the PoC on GitHub; the oss-security post is Sam James (Gentoo) relaying it. The summary is truncated mid-sentence and event_date (2026-05-20) is the BleepingComputer date, not the 2026-05-19 primary.
    ground_truth: 'oss-security: "From: Sam James ... v12-security have shared a new Linux LPE today, PinTheft"; "PinTheft was discovered with V12 by Aaron Esau of the V12 security team."'
    ground_truth_url: https://www.openwall.com/lists/oss-security/2026/05/19/6
    fix: '"V12 Security (Aaron Esau) released PinTheft and a PoC on 2026-05-19; Gentoo''s Sam James relayed it to oss-security"; event_date 2026-05-19; finish the summary.'
    class: imprecision
  upgrade:
    techniques:
    - id: T1068
      behavior: Local unprivileged user turns an RDS zerocopy double-free into a page-cache overwrite of a SUID-root binary via io_uring fixed buffers and executes it for a root shell
      url: https://www.openwall.com/lists/oss-security/2026/05/19/6
    rating:
      reliability: B
      credibility: 2
      basis: V12 Security (discoverer) is original research with a public PoC; the Linux kernel CNA record confirms the bug (same mechanism); BleepingComputer restates. No in-the-wild exploitation (CISA-ADP SSVC Exploitation none, 2026-10-16); not in KEV.
    exposure:
    - quote: Sadly, the RDS kernel module this requires is only default on Arch Linux among the common distributions we tested
      url: https://www.bleepingcomputer.com/news/linux/exploit-released-for-new-pintheft-arch-linux-root-escalation-flaw/
    - quote: This drastically limits the attack surface, with V12 stating that the RDS module is enabled by default only on Arch Linux out of the most common Linux distros.
      url: https://www.bleepingcomputer.com/news/linux/exploit-released-for-new-pintheft-arch-linux-root-escalation-flaw/
    detection: []
    triage: []
    takeaway:
    - quote: Linux users on affected distros are advised to install the latest kernel updates as soon as possible.
      url: https://www.bleepingcomputer.com/news/linux/exploit-released-for-new-pintheft-arch-linux-root-escalation-flaw/
    bodies:
    - work/2026-10-21T1148Z-audit/truth-4/bodies/oss-security-pintheft.txt
    - work/2026-10-21T1148Z-audit/truth-4/bodies/bc-pintheft.txt
    - work/2026-10-21T1148Z-audit/truth-4/bodies/cveawg-cve-2026-43494.txt
    extra:
      mitigation: 'BleepingComputer: rmmod rds_tcp rds; modprobe.d entries "install rds /bin/false" and "install rds_tcp /bin/false"'
      cve: CVE-2026-43494 (kernel CNA 7.8; Red Hat ADP 7.0 AC:H, Important); not in CISA KEV; mapping to PinTheft by identical function/mechanism
      kind: kind research for a patched kernel LPE with PoC; vulnerability fits better
  possible_twin_outside_batch: null
- entry: 2026-05-21/sonicwall-gen6-ssl-vpn-incomplete-patching-cve-2024-12802-ak
  verdict: factual-error
  defects:
  - where: cves[CVE-2024-12802]; body sentence 1 (CVSS and vector)
    claim: 'cvss: "9.1" ... auth: pre-auth, vector: zero-click / CVE-2024-12802 (CVSS 9.1, `AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N`)'
    defect: 'SonicWall, the CNA, scores the flaw 6.5 with PR:L: the attacker needs valid credentials, and the bypass is of the second factor. 9.1 and the PR:N/I:H vector are CISA-ADP''s assessment.'
    ground_truth: 'SonicWall SNWLID-2025-0001: "CVSS v3 6.5", "CVSS Vector CVSS:3.0/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:N", CWE-305. BleepingComputer: "allowing an attacker with valid credentials to authenticate directly and bypass the MFA requirement." ReliaQuest: "SonicWall assigned CVE-2024-12802 a CVSS score of 6.5 (Medium); CISA''s Authorized Data Publisher assessment rates it 9.1 (Critical)."'
    ground_truth_url: https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2025-0001
    fix: cvss "6.5" (vendor; CISA-ADP 9.1 noted), auth post-auth (valid credentials, MFA bypassed), vector network; affected "Gen6 6.5.4.15-117n and older (NSv 6.5.4.4-44v-21-2457 and older)" plus remediation steps; fixed Gen7 7.2.0-7015 / Gen8 8.0.1-8017.
    class: factual-error
  - where: title; headline; entities
    claim: 'Akira-linked actors brute-force MFA via UPN/SAM account-name split / entities: ["actor:akira"]'
    defect: 'The primary research makes no Akira attribution: ReliaQuest assesses an initial access broker using tools common in the ransomware ecosystem and cites Akira only as a group that used similar tooling before. Even Cybersecurity Dive says only "consistent with".'
    ground_truth: 'ReliaQuest: "The voluntary logouts, combined with re-entry attempts days later using different accounts in some environments, are consistent with initial access broker (IAB) activity." "The tools observed were consistent with actors operating in the ransomware ecosystem." Cybersecurity Dive: "Researchers could not provide direct attribution for the attacks".'
    ground_truth_url: https://reliaquest.com/blog/threat-spotlight-vpn-exploitation-when-patched-doesnt-mean-protected/
    fix: Headline "... unattributed actor (assessed initial access broker) brute-forces SSL-VPN accounts and bypasses MFA"; drop actor:akira from entities or keep only as a hedged comparison in the body.
    class: factual-error
  - where: body sentence 1; Hardening
    claim: six additional manual LDAP-reconfiguration steps from SonicWall KB `kA1VN0000000RBd0AM` are required
    defect: (low confidence) The KB identifier appears in no source read; the six steps are in the advisory's Comments section as reproduced by BleepingComputer.
    ground_truth: 'SonicWall: "we have incorporated the remediation steps described in the advisory (Comments section) into versions 7.2.0-7015 and 8.0.1-8017." BleepingComputer lists the six steps (delete the LDAP configuration using userPrincipalName, remove cached LDAP users, remove the SSL VPN User Domain, reboot, recreate LDAP without userPrincipalName, take a fresh backup).'
    ground_truth_url: https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2025-0001
    fix: Cite SNWLID-2025-0001 (Comments section) for the six steps and drop the KB id unless sourced.
    class: imprecision
  - where: body Detection concept
    claim: SonicWall Gen6 SSL-VPN syslog filter for successful SSL-VPN authentications where the `login` field is UPN-format rather than SAM-format
