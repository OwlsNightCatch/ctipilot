entries:
- entry: 2026-05-20/cve-2026-41091-microsoft-defender-engine-link-following-eop
  verdict: factual-error
  defects:
  - where: actions[0]; body paragraph 2 (Detection/Exposure text)
    claim: For hosts with auto-updates blocked (GPO "Turn off routine remediation"), push the Engine signature update manually
    defect: 'The named GPO does not control Defender engine or signature updates; it controls whether detected threats are remediated automatically or the user is prompted. Body paragraph 2 repeats it: "for any host where the GPO "Turn off routine remediation" disables auto-remediation, push the Engine update manually."'
    ground_truth: 'Microsoft Learn, remediation settings table: "Turn off routine remediation. Specify whether Microsoft Defender Antivirus automatically remediates threats, or whether to prompt the user. Disabled. Threats are remediated automatically." MSRC FAQ: engine and definition updates arrive via the default automatic-update configuration; Defender AV updates doc lists Windows Update, WSUS and other channels.'
    ground_truth_url: https://learn.microsoft.com/en-us/defender-endpoint/configure-remediation-microsoft-defender-antivirus
    fix: 'Drop the GPO name from actions[0] and body paragraph 2. Say instead: confirm AMEngineVersion >= 1.1.26040.8 and manually push the engine update on hosts where Windows Update/WSUS/Intune hold engine updates back or that are offline.'
    class: factual-error
  - where: section 2026-05-22T05:00:07Z first sentence; updates[0].summary
    claim: Both Microsoft Defender vulnerabilities confirmed as actively exploited in the wild in a combined out-of-band engine update
    defect: The cited Hacker News page and MSRC describe two separate fixes (Malware Protection Engine for CVE-2026-41091, Antimalware Platform for CVE-2026-45498); neither calls the release out-of-band. Cited clause binds a release characterisation the page does not carry (and THN itself mislabels 1.1.26040.8 a Platform version).
    ground_truth: 'THN: "The two vulnerabilities have been addressed in Microsoft Defender Antimalware Platform versions 1.1.26040.8 and 4.18.26040.7, respectively." MSRC CVE-2026-41091: "First version of the Microsoft Malware Protection Engine with this vulnerability addressed Version 1.1.26040.8"; MSRC CVE-2026-45498: "First version of the Microsoft Defender Antimalware Platform ... addressed Version 4.18.26040.7". MSRC FAQ: engine updates ship "once a month or as needed".'
    ground_truth_url: https://thehackernews.com/2026/05/microsoft-warns-of-two-actively.html
    fix: 'Write: both flaws are exploited in the wild (MSRC exploited=Yes, CISA KEV 2026-05-20); fixes are Engine 1.1.26040.8 (CVE-2026-41091) and Platform 4.18.26040.7 (CVE-2026-45498). Drop "combined out-of-band". Drop "(originally covered 2026-05-20)" from the record summary.'
    class: imprecision
  - where: section 2026-05-22T05:00:07Z, CVE-2026-41091 sentence
    claim: CWE-59 improper link resolution / link following in `MsMpEng.exe`) allows an authorized local standard-user to abuse Defender's privileged process's symbolic-link resolution during file-system operations to elevate to `NT AUTHORITY\SYSTEM`
    defect: No cited page names MsMpEng.exe, a standard-user attacker, or symbolic-link resolution during file-system operations. The advisory names the Microsoft Malware Protection Engine and an "authorized attacker".
    ground_truth: 'MSRC: "Improper link resolution before file access (''link following'') in Microsoft Defender allows an authorized attacker to elevate privileges locally." and "The Microsoft Malware Protection Engine, mpengine.dll, provides the scanning, detection, and cleaning capabilities".'
    ground_truth_url: https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-41091
    fix: 'Use the advisory wording: authorized local attacker, Microsoft Malware Protection Engine, SYSTEM. If the RedSun mechanism is wanted (researcher-confirmed mapping, reported by BleepingComputer and THN), cite Vectra: Cloud Files API, oplocks and a directory junction redirecting a Defender-triggered rewrite into a protected system path.'
    class: imprecision
  - where: body paragraph 2 (hunt sentence); section 2026-05-22T05:00:07Z last sentence
    claim: 'Hunt signal: Sysmon EID 1 for SYSTEM-level process spawns from `MsMpEng.exe` as parent.'
    defect: (low confidence) No cited source supports this hunt signal, and the one technical description of the researcher-confirmed RedSun mechanism has SYSTEM execution arriving through the Cloud Files infrastructure, not as a child of MsMpEng.exe. The paragraph-2 hunt ("junction / hard-link creation events (Sysmon EID 11 ... pointing to privileged Defender / Program Files paths)") is likewise carried by no source; Vectra describes a junction redirecting a Defender-triggered rewrite into a protected system path.
    ground_truth: 'Vectra: "Defender sees a known signature, initiates a remediation cycle, and RedSun wins the race to redirect the resulting file rewrite. At that point, the Cloud Files Infrastructure executes the attacker-planted binary as SYSTEM." HelpNet/Huntress: exploit files dropped "into the user''s Pictures and Downloads folders".'
    ground_truth_url: https://www.vectra.ai/blog/when-the-defender-becomes-the-door-bluehammer-redsun-and-undefend-in-the-wild
    fix: 'Remove both Sysmon-specific hunt statements or replace with the sourced behaviour: low-privilege user staging an exploit binary in Pictures/Downloads, a Defender remediation cycle on a test string, a junction in a user-writable path, then a SYSTEM-context process from a system service.'
    class: factual-error
  - where: cves[CVE-2026-45498]; cves[CVE-2026-41091]; cves[]
    claim: 'id: CVE-2026-45498 ... type: lpe ... auth: post-auth (and affected: null, fixed: null on both records)'
    defect: CVE-2026-45498 is a denial of service (CWE-400, AV:L/AC:L/PR:N, impact Denial of Service), not an LPE and not privileged-access-required. Both records leave affected/fixed null although MSRC gives them. CVE-2026-45584 is named in actions[0] but absent from cves[].
    ground_truth: 'MSRC CVE-2026-45498: impact "Denial of Service", CWE-400, vector CVSS:3.1/AV:L/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:L, baseScore 4.0, "Last version of the Microsoft Defender Antimalware Platform affected ... 4.18.26030.3011", fixed 4.18.26040.7. MSRC CVE-2026-41091: last affected Engine 1.1.26030.3008, fixed 1.1.26040.8.'
    ground_truth_url: https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-45498
    fix: 'CVE-2026-45498: type dos, auth none. Fill affected "Malware Protection Engine <= 1.1.26030.3008" / fixed "1.1.26040.8" for CVE-2026-41091 and affected "Antimalware Platform <= 4.18.26030.3011" / fixed "4.18.26040.7" for CVE-2026-45498. Either add CVE-2026-45584 to cves[] or reference its own entry and drop the id from actions[0].'
    class: factual-error
  - where: evidence[0..1]; sourcing_note; updates[0].summary
    claim: 'publisher: ctipilot v2 brief (migrated) ... sourcing_note: "migration: evidence backfilled from v2 brief body (item predates the Evidence footer field)"; "UPDATE (originally covered 2026-05-20)"'
    defect: 'Both evidence quotes are the pipeline quoting itself and prove nothing; sourcing_note and the record summary carry pipeline self-reference. The second source is a news outlet labelled role: primary.'
    ground_truth: 'Verbatim carriers exist: MSRC "Systems that have disabled Microsoft Defender are not in an exploitable state."; THN "Huntress has since observed exploitation of both the vulnerabilities, alongside BlueHammer (CVE-2026-33825)."'
    ground_truth_url: https://thehackernews.com/2026/05/microsoft-warns-of-two-actively.html
    fix: Replace evidence with verbatim MSRC and THN passages, set the sourcing_note to two sentences of provenance (MSRC advisory, CISA KEV listing, Hacker News and BleepingComputer reporting), mark the Hacker News record secondary.
    class: imprecision
  - where: body paragraph 1 (uncited clauses); summary
    claim: 'The flaw is an **improper link resolution before file access** (CWE-59, "link following") ... CVSS 7.8 (AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H). Vulnerable Engine builds: ≤ 1.1.26030.3008; fixed in Engine 1.1.26040.8.'
    defect: 'The sole inline citation terminates the first sentence (the 2026-05-19 release date); the CWE, CVSS vector, affected and fixed builds are uncited though MSRC carries them. The summary says the engine "auto-remediates via signature channel", which loosens MSRC: the default configuration keeps the engine and definitions up to date automatically (two separate things).'
    ground_truth: 'MSRC: "the default configuration in Microsoft antimalware software helps ensure that malware definitions and the Microsoft Malware Protection Engine are kept up to date automatically."'
    ground_truth_url: https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-41091
    fix: 'Cite the MSRC page on the CVSS, builds and fix clauses; summary: "the default configuration updates the engine automatically".'
    class: imprecision
  upgrade:
    techniques:
    - id: T1068
      behavior: Local privilege escalation to SYSTEM through link following in the Microsoft Malware Protection Engine by an authorized local attacker
      url: https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-41091
    - id: T1687
      behavior: CVE-2026-45498, exploited alongside it, is a Defender denial of service that standard users use to block Defender definition updates (researcher-confirmed UnDefend mapping, reported by BleepingComputer)
      url: https://www.bleepingcomputer.com/news/security/microsoft-warns-of-new-defender-zero-days-exploited-in-attacks/
    rating:
      reliability: A
      credibility: 1
      basis: MSRC is the vendor PSIRT for its own product and states exploited=Yes; CISA KEV (dateAdded 2026-05-20) and Huntress in-the-wild observation of the researcher PoCs (via Help Net Security) are independent of Microsoft. THN and BleepingComputer restate. The PoC-to-CVE mapping is the researcher's own confirmation.
    exposure:
    - quote: Systems that have disabled Microsoft Defender are not in an exploitable state.
      url: https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-41091
    - quote: Defender runs on all supported version of Windows.
      url: https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-41091
    - quote: Yes, Microsoft System Center Endpoint Protection, Microsoft System Center 2012 R2 Endpoint Protection, Microsoft System Center 2012 Endpoint Protection and Microsoft Security Essentials.
      url: https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-41091
    detection:
    - quote: The attacker dropped the exploit files into the user’s Pictures and Downloads folders and renamed them to avoid suspicion. Then, before launching the exploits, they ran commands to map out user privileges, discovered stored credentials, and the Active Directory structure.
      url: https://helpnetsecurity.com/2026/04/17/microsoft-defender-zero-days-exploited/
    - quote: The exploit baits Defender's real-time protection engine using an embedded EICAR test string.
      url: https://www.vectra.ai/blog/when-the-defender-becomes-the-door-bluehammer-redsun-and-undefend-in-the-wild
    triage: []
    takeaway:
    - quote: Best practices recommend that customers regularly verify whether software distribution, such as the automatic deployment of Microsoft Malware Protection Engine updates and malware definitions, is working as expected in their environment.
      url: https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-41091
    bodies:
    - work/2026-10-21T1148Z-audit/truth-4/bodies/msrc-cve-2026-41091.txt
    - work/2026-10-21T1148Z-audit/truth-4/bodies/msrc-cve-2026-45498.txt
    - work/2026-10-21T1148Z-audit/truth-4/bodies/thn-defender-two-actively.txt
    - work/2026-10-21T1148Z-audit/truth-4/bodies/bleeping-defender-zerodays.txt
    - work/2026-10-21T1148Z-audit/truth-4/bodies/helpnet-defender-zerodays.txt
    - work/2026-10-21T1148Z-audit/truth-4/bodies/vectra-defender-door.txt
    - work/2026-10-21T1148Z-audit/truth-4/bodies/ms-config-remediation.txt
    - work/2026-10-21T1148Z-audit/truth-4/bodies/ms-defender-av-updates.txt
    - work/2026-10-21T1148Z-audit/truth-4/bodies/cisa-kev.json
    extra:
      ioc_scan_note: Four-part version strings (1.1.26030.3008, 1.1.26040.8, 4.18.26030.3011, 4.18.26040.7) appear bare in summary, body, actions and section; write them as "Engine version 1.1.26040.8" / "Platform version 4.18.26040.7" so the IOC scan does not read them as IPv4 addresses.
      cisa_kev: CVE-2026-41091 and CVE-2026-45498 both in CISA KEV, dateAdded 2026-05-20, dueDate 2026-06-03, knownRansomwareCampaignUse Unknown (cisa-kev recipe, 2026.10.20 catalog)
      affected_products: Microsoft Defender (Malware Protection Engine <= 1.1.26030.3008; Antimalware Platform <= 4.18.26030.3011); also Microsoft System Center Endpoint Protection and Microsoft Security Essentials per MSRC FAQ
      timeline: PoCs published 2026-04-16 by researcher Nightmare Eclipse; Huntress observed use on 2026-04-16 (Help Net Security); MSRC advisory 2026-05-19; KEV 2026-05-20; researcher confirmed CVE-2026-41091 = RedSun and CVE-2026-45498 = UnDefend (BleepingComputer update 2026-05-25).
  possible_twin_outside_batch: null
- entry: 2026-05-20/cve-2026-45584-microsoft-defender-engine-heap-buffer-overflo
  verdict: factual-error
  defects:
  - where: cves[CVE-2026-45584].vector
    claim: 'vector: zero-click'
    defect: MSRC states exploitation requires a user-assisted step and high attack complexity; the record types the flaw zero-click.
    ground_truth: 'MSRC FAQ: "Successful exploitation of this vulnerability would require a remote, unauthenticated attacker to entice a local user to take multiple actions that results in Defender scanning a malicious file that has been quarantined." and "the attack complexity is high (AC:H) ... requires an attacker to take additional actions prior to exploitation to prepare the target environment."'
    ground_truth_url: https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-45584
    fix: Set vector to network with the quarantined-file/user-action prerequisite (not zero-click); auth stays pre-auth (unauthenticated attacker).
    class: factual-error
  - where: summary; body paragraph 1
    claim: a heap-based buffer overflow in the Defender Engine reachable over the network (AV:N), allowing unauthenticated code execution in the Defender process context.
    defect: 'The advisory does not say "in the Defender process context", and "reachable over the network" omits the stated prerequisite: Defender must scan a malicious quarantined file after the user took multiple actions (AC:H). Body: "Network-reachable code execution inside an endpoint security product ... lands attacker code in the same privileged context as Defender" repeats the unstated context.'
    ground_truth: 'MSRC: "Heap-based buffer overflow in Microsoft Defender allows an unauthorized attacker to execute code over a network." plus the FAQ quoted in the vector defect.'
    ground_truth_url: https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-45584
    fix: '"... allows an unauthorized attacker to execute code over a network; MSRC says exploitation needs a local user to take multiple actions that lead Defender to scan a malicious file that was quarantined (attack complexity high)." Drop "in the Defender process context" or mark it as analyst inference.'
    class: imprecision
  - where: summary; body paragraph 1
    claim: CVSS 8.1; no exploitation observed at disclosure, no public PoC.
    defect: 'MSRC records exploited: No and publiclyDisclosed: No; "no public PoC" is a looser statement than either field. The Hacker News adds only "no evidence" of exploitation. Uncited as written (the single link carries the date only).'
    ground_truth: 'MSRC record: publiclyDisclosed: No, exploited: No, baseScore 8.1 (CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H), severity Critical. THN: "There is no evidence the vulnerability has been exploited in the wild."'
    ground_truth_url: https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-45584
    fix: '"MSRC lists it as not exploited and not publicly disclosed at disclosure" and cite the MSRC page on that clause.'
    class: imprecision
  - where: cves[CVE-2026-45584].affected / fixed
    claim: 'affected: null, fixed: null'
    defect: MSRC gives the boundary; the body states the fix only as the Engine update that closes CVE-2026-41091.
    ground_truth: 'MSRC FAQ table: "Last version of the Microsoft Malware Protection Engine affected by this vulnerability 1.1.26030.3008; First version of the Microsoft Malware Protection Engine with this vulnerability addressed Version 1.1.26040.8".'
    ground_truth_url: https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-45584
    fix: affected "Microsoft Malware Protection Engine <= 1.1.26030.3008", fixed "1.1.26040.8".
    class: imprecision
  upgrade:
    techniques:
    - id: T1203
      behavior: Memory-corruption (heap overflow) in the Defender engine reached when it scans a malicious quarantined file, giving code execution; MSRC describes a user-assisted step but not how the lure arrives, so no delivery technique is mapped
      url: https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-45584
    rating:
      reliability: A
      credibility: 2
      basis: MSRC is the vendor PSIRT for its own product; one assessor, no exploitation or public disclosure at disclosure. The Hacker News restates it.
    exposure:
    - quote: Successful exploitation of this vulnerability would require a remote, unauthenticated attacker to entice a local user to take multiple actions that results in Defender scanning a malicious file that has been quarantined.
      url: https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-45584
    - quote: Systems that have disabled Microsoft Defender are not in an exploitable state.
      url: https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-45584
    detection: []
    triage: []
    takeaway:
    - quote: the default configuration in Microsoft antimalware software helps ensure that malware definitions and the Microsoft Malware Protection Engine are kept up to date automatically.
      url: https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-45584
    bodies:
    - work/2026-10-21T1148Z-audit/truth-4/bodies/msrc-cve-2026-45584.txt
    - work/2026-10-21T1148Z-audit/truth-4/bodies/thn-defender-two-actively.txt
    extra:
      ioc_scan_note: Four-part version strings (1.1.26030.3008, 1.1.26040.8) appear bare; write them as "Engine version 1.1.26040.8".
      cisa_kev: CVE-2026-45584 is NOT in the CISA KEV catalog (2026.10.20 catalog, 1754 entries)
      affected_products: Microsoft Defender (Malware Protection Engine <= 1.1.26030.3008); same engine family also serves System Center Endpoint Protection and Microsoft Security Essentials per MSRC FAQ
      detection_note: Neither MSRC nor THN gives a detection or hunting signal for this flaw; leave detection empty or write only "no public detection guidance".
  possible_twin_outside_batch: null
- entry: 2026-05-20/drupal-core-highly-critical-pre-patch-warning-unauthenticate
  verdict: factual-error
  defects:
  - where: cves[CVE-2026-9082].cvss
    claim: 'cvss: "6.5"'
    defect: 6.5 is the NVD-side score; the numbering authority (Drupal, CNA) scores CVE-2026-9082 CVSS 3.1 9.8 CRITICAL and ENISA EUVD carries that score. Also affected/fixed are null and type is rce although the advisory describes SQL injection that leads to RCE only "in some cases".
    ground_truth: 'EUVD-2026-31153 (assigner drupal): baseScore 9.8, CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H, exploitedSince "May 22, 2026"; affected "from 8.9.0 before 10.4.10, from 10.5.0 before 10.5.10, from 10.6.0 before 10.6.9, from 11.0.0 before 11.1.10, from 11.2.0 before 11.2.12, from 11.3.0 before 11.3.10". BleepingComputer: NIST rates it "medium severity based on a CVSS v3 score of 6.5".'
    ground_truth_url: https://euvd.enisa.europa.eu/vulnerability/EUVD-2026-31153
    fix: cvss "9.8" (vector CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H); type sqli (RCE conditional); fill affected/fixed from the SA table; add Drupal risk score 23/25 where scores are discussed.
    class: factual-error
  - where: evidence[2]; evidence[0]
    claim: 'quote: "Imperva sees more than 15,000 exploit attempts against around 6,000 Drupal websites in 65 countries" (publisher Imperva); quote: "Drupal confirmed: exploit attempts are now being detected in the wild" (publisher BleepingComputer)'
    defect: Neither is a contiguous passage of its cited page. Imperva wrote "attack attempts" (not exploit attempts) and described mostly probing; BleepingComputer paraphrases and quotes the advisory in a different sentence.
    ground_truth: 'Imperva: "Since CVE-2026-9082 was released, Imperva has observed over 15,000 attack attempts targeting almost 6,000 individual sites across 65 countries." and "Most of the observed activity so far appears to be probing." BleepingComputer: "In an update to the advisory on May 22, Drupal confirmed that exploitation attempts have been detected." SA: "The risk score has been updated to reflect that exploit attempts are now being detected in the wild."'
    ground_truth_url: https://www.imperva.com/blog/imperva-customers-protected-against-cve-2026-9082-in-drupal-core/
    fix: Replace with the verbatim Imperva sentence and the SA update line; do not call Imperva's count exploitation.
    class: factual-error
  - where: body paragraph 1, sentence 2
    claim: scores the flaw 20/25 on Drupal's own published security scale — the second-highest tier — ... meaning exploitation is unauthenticated and requires no special conditions; the chained score sits below the theoretical 25/25 only because the Drupal Security Team rates the affected configuration as "Uncommon"
    defect: Highly critical (20-25) is the highest tier. 20/25 is below 25 for two reasons (E:Theoretical +1 instead of Exploit +4, TD:Uncommon +1 instead of All +3), not one; and TD:Uncommon is itself a special condition ("only uncommon module configurations are exploitable").
    ground_truth: 'Drupal risk levels: "20 to 25 is considered Highly Critical" (top tier). PSA: "Highly critical 20 / 25 AC:None/A:None/CI:All/II:All/E:Theoretical/TD:Uncommon". The Register: "The only two things preventing it from scoring a perfect 25/25 are the fact that a known exploit doesn''t exist yet and that it doesn''t affect all configurations".'
    ground_truth_url: https://www.drupal.org/drupal-security-team/security-risk-levels-defined
    fix: '"20/25 (Highly critical, the top tier), held below 25 because no exploit existed yet and only uncommon configurations were affected; AC:None and A:None mean anonymous exploitation by visiting a page." The advisory now reads 23/25 with E:Exploit.'
    class: factual-error
  - where: body paragraph 1, sentence 5
    claim: Drupal also reserved manual emergency patch files for EOL branches 8.9, 9.5, 10.4 (→ 10.4.9) and 11.1 (→ 11.1.9)
    defect: The PSA provides manual patch files only for 8.9 and 9.5. Sites on 10.4/10.x and 11.1/11.0 were told to update to at least 10.4.9 / 11.1.9 ahead of the window and received security releases (10.4.10 / 11.1.10) on 2026-05-20.
    ground_truth: 'PSA: "we will provide patch files for Drupal 8.9 and 9.5" and "These patches must be applied manually."; "Sites on Drupal 11.1 or 11.0 should update to at least Drupal 11.1.9." SA: "If you use Drupal 11.1.x or 11.0.x, update to Drupal 11.1.10." "If you use Drupal 10.4.x or earlier, update to Drupal 10.4.10."'
    ground_truth_url: https://www.drupal.org/psa-2026-05-18
    fix: '"Security releases also cover the EOL minors 11.1.x and 10.4.x (update to 11.1.10 / 10.4.10); only Drupal 8.9 and 9.5 get patch files that must be applied manually."'
    class: factual-error
  - where: body paragraph 2; section 2026-05-21T05:00:07Z
    claim: No technical mitigation exists pre-patch.
    defect: The PSA states the issue is protected by Drupal Steward, and The Register and CSO Online report Steward customers were protected against known attack vectors before and at release. The advisory itself promised mitigation information.
    ground_truth: 'PSA: "This issue is being protected by Drupal Steward." and "Mitigation information will be included in the advisory." The Register: "sites using Drupal Steward, its paid web application firewall service, are protected against known attack vectors". CSO: "Sites that use the Drupal Steward web application firewall are already protected from known attack vectors".'
    ground_truth_url: https://www.drupal.org/psa-2026-05-18
    fix: '"Drupal Steward (paid WAF) protects known attack vectors from the advisory onward; no other mitigation was published pre-patch."'
    class: factual-error
  - where: body paragraph 2 ("Why it matters to us")
    claim: Drupal is the dominant CMS for Swiss federal / cantonal / municipal portals, European Commission and EU-agency sites, universities, and public-sector NGOs.
    defect: Uncited absolute quantifier; for Swiss federal sites the Federal Administration documents a different CMS.
    ground_truth: 'bk.admin.ch: SS Web, "the Swiss Federal Administration''s centralised standard service for managing and publishing web content ... is based on a modified version of Livingdocs"; Innosuisse: "All of the Swiss Confederation''s websites are migrating to a single content management system (CMS), Livingdocs." No page read names Drupal as dominant in Switzerland.'
    ground_truth_url: https://www.bk.admin.ch/en/standard-service-websites
    fix: Drop "dominant" and the Swiss/EU prevalence claims, or replace by a cited statement such as "Drupal powers hundreds of thousands of websites" (SecurityWeek) and tell readers to inventory their own Drupal instances.
    class: factual-error
  - where: section 2026-05-21T05:00:07Z, second paragraph
    claim: 'Affected versions: 8.9.0 through 10.4.10, 10.5.x < 10.5.10, 10.6.x < 10.6.9, 11.0.0 through 11.1.10, 11.2.x < 11.2.12, 11.3.x < 11.3.10.'
    defect: '"through 10.4.10" and "through 11.1.10" list the fixed releases as affected; the advisory ranges end below those versions.'
    ground_truth: 'SA affected versions: ">= 8.9.0 < 10.4.10 || >= 10.5.0 < 10.5.10 || >= 10.6.0 < 10.6.9 || >= 11.0.0 < 11.1.10 || >= 11.2.0 < 11.2.12 || >= 11.3.0 < 11.3.10".'
    ground_truth_url: https://www.drupal.org/sa-core-2026-004
    fix: '"8.9.0 up to (not including) 10.4.10; 10.5.0 < 10.5.10; 10.6.0 < 10.6.9; 11.0.0 < 11.1.10; 11.2.0 < 11.2.12; 11.3.0 < 11.3.10."'
    class: factual-error
  - where: section 2026-05-23T05:00:10Z, first paragraph
    claim: also recording the addition of CVE-2026-9082 to the CISA Known Exploited Vulnerabilities catalog on 2026-05-22 (the NCSC-CH post is the brief's source of record on the KEV add; the CISA news-events alert URL constructed earlier in the day returned a 404 at composition time)
    defect: The NCSC.ch post never mentions CISA or KEV (its 22.05 update only records active exploitation). The KEV addition is real but only the CISA catalog carries it. The parenthesis is pipeline-internal narration.
