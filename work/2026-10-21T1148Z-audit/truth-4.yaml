- entry: 2026-05-20/sparx-enterprise-architect-pro-cloud-server-five-cve-chain-p
  verdict: factual-error
  defects:
  - where: cves[CVE-2026-42096..42100] (type, auth, vector, cvss)
    claim: 'every record: type: rce, vector: user-interaction, auth: pre-auth; CVE-2026-42096 cvss: n/a; CVE-2026-42100 cvss: n/a'
    defect: 'Only CVE-2026-42097 is pre-auth. The numbering authority (CERT-PL) scores 42096, 42098, 42099 and 42100 with PR:L, all five with UI:N (not user-interaction), and gives 42096 and 42100 scores. Types: 42096 broken access control, 42097 authorization bypass, 42098 client-side authentication, 42099 race-condition RCE, 42100 DoS.'
    ground_truth: 'CNA CVSS 4.0 via EUVD: CVE-2026-42096 8.7 (AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:L), CVE-2026-42097 9.3 (PR:N), CVE-2026-42098 8.7 (PR:L), CVE-2026-42099 7.7 (AV:N/AC:H/AT:P/PR:L), CVE-2026-42100 7.1 (PR:L, VA:H only). CERT-PL: 42099 "An attacker with repository access can control both the filename and file contents".'
    ground_truth_url: https://euvd.enisa.europa.eu/vulnerability/EUVD-2026-30927
    fix: 'cvss: 42096 "8.7", 42100 "7.1" (CVSS 4.0, say so); auth: 42097 pre-auth, others low-privilege authenticated (42099 needs repository access); type: 42096 authz/sql-exec, 42097 auth-bypass, 42098 auth-bypass, 42099 rce, 42100 dos; vector network; affected "Pro Cloud Server <= 6.1 (build 167 tested)" for 42096/97/99/100 and "Enterprise Architect <= 17.1" for 42098; fixed unknown.'
    class: factual-error
  - where: body bullet CVE-2026-42100
    claim: '**CVE-2026-42100** (CWE-835) — Malformed SQL crashes the Pro Cloud Server service (DoS).'
    defect: 'Wrong CWE: CERT Polska and the CVE record give CWE-228.'
    ground_truth: 'CERT Polska: "Vulnerability type (CWE) Improper Handling of Syntactically Invalid Structure (CWE-228)"; CVE record problemTypes CWE-228.'
    ground_truth_url: https://cert.pl/en/posts/2026/05/CVE-2026-42096/
    fix: CWE-228 (Improper Handling of Syntactically Invalid Structure); CNA CVSS 4.0 7.1.
    class: factual-error
  - where: body paragraph 1 (EUVD citation)
    claim: each separately filed in [ENISA EUVD-2026-30929 through EUVD-2026-30932](https://euvd.enisa.europa.eu/enisa/eu_vulnerability_database/EUVD-2026-30931)
    defect: 'Five CVEs, five EUVD records: CVE-2026-42096 is EUVD-2026-30927; 30929-30932 cover only the other four, and the single cited page is the CVE-2026-42097 record.'
    ground_truth: 'EUVD: 42096 = EUVD-2026-30927; 42099 = -30929; 42098 = -30930; 42097 = -30931; 42100 = -30932 (all assigner CERT-PL, published 2026-05-19).'
    ground_truth_url: https://euvd.enisa.europa.eu/enisa/eu_vulnerability_database/EUVD-2026-30931
    fix: '"EUVD-2026-30927 and EUVD-2026-30929 through -30932", or one link per CVE.'
    class: factual-error
  - where: actions[0]; body paragraph 4 (Why it matters to us)
    claim: monitor IIS / Apache for POSTs to `/data_api/dl_internal_artifact.php` and for `_api/data` requests omitting `model` query param / for any `_api/data` POST that omits the `model` query parameter
    defect: No source names an `_api/data` path. The authentication-bypass request is a POST to the PCS endpoint /SparxCloudLink.sseap sent without the `model` query parameter (model name only in the binary blob).
    ground_truth: 'sploit.tech: "Thus an attacker can simply omit the model query parameter and send the model name only in the binary blob"; request shown as `https://${PCS_HOSTNAME}/SparxCloudLink.sseap` without `?model=`; workaround "dropping requests with no or wrong model query parameter".'
    ground_truth_url: https://sploit.tech/2026/05/19/Sparx-Enterprise-Architect-PCS.html
    fix: 'Replace `_api/data` by the /SparxCloudLink.sseap endpoint: alert on POSTs to it that lack the model query parameter.'
    class: factual-error
  - where: title; headline; summary; body bullet CVE-2026-42096
    claim: pre-auth SQL injection (42097) ... CVE-2026-42096 (CWE-863) — Authenticated SQL injection in an exposed database API endpoint; any authenticated user can inject arbitrary SQL.
    defect: (low confidence) The sources describe an authorization bypass (42097, CWE-639) and missing permission checks (42096, CWE-863) that let a caller run arbitrary SQL queries through the PCS database proxy; the advisory never calls either SQL injection.
    ground_truth: 'CERT-PL: "Broken Access Control within communication with the database. Due to lack of permission checks, any low privileged user can run arbitrary SQL queries within database user context." and "An attacker can omit the \"model\" query parameter ... allowing SQL query execution without authentication."'
    ground_truth_url: https://cert.pl/en/posts/2026/05/CVE-2026-42096/
    fix: '"unauthenticated arbitrary SQL execution (authorization bypass 42097 plus unrestricted SQL access 42096)" instead of "SQL injection".'
    class: imprecision
  - where: summary; body paragraph 1 (chain claims)
    claim: five-CVE chain reaching CVSSv4 10.0 ... chains to unauthenticated code execution (CERT Polska, 2026-05-19 · sploit.tech, 2026-05-19)
    defect: The 10.0 is the researcher's own chained score (the CNA scores top out at 9.3) and the chain to unauthenticated RCE (needs WebEA) is stated by sploit.tech, not by CERT Polska.
    ground_truth: 'sploit.tech: "CVSSv4 chained score: 10.0 Critical (AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H)"; "In case where PCS is installed with WebEA the vulnerabilities allow further for remote unauthenticated code execution (RCE) within the web server context."'
    ground_truth_url: https://sploit.tech/2026/05/19/Sparx-Enterprise-Architect-PCS.html
    fix: Attribute "chained CVSSv4 10.0" and the unauthenticated-RCE chain to the researcher (sploit.tech); cite CERT Polska for per-CVE descriptions and CNA scores.
    class: imprecision
  - where: actions[0] ("Public PoC available (CERT Polska ...)"); body "Public exploit code is published in br0xpl/sparx_hack"
    claim: Public PoC available ([CERT Polska CVE-2026-42096](https://cert.pl/en/posts/2026/05/CVE-2026-42096/)). / Public exploit code is published in br0xpl/sparx_hack
    defect: The CERT Polska page does not mention a PoC. The repository covers CVE-2026-42096 and 42097 only and its author deliberately published it with an incorrect key; PoC steps for the other CVEs are in the sploit.tech write-up.
    ground_truth: 'GitHub README: "Exploit code for executing arbitrary SQL command in Sparx PCS server without authentication. NOTE: the key is *NOT correct* to prevent s|<rIpt kIddi3 from easy hacking ;-)". Belgian CCB: "There is a publicly available Proof-of-Concept (PoC) for all five vulnerabilities."'
    ground_truth_url: https://github.com/br0xpl/sparx_hack/
    fix: Cite sploit.tech or the CCB advisory for the PoC and say the repository code ships without the working key (it is embedded in the Enterprise Architect binary per the write-up).
    class: imprecision
  - where: summary; body paragraph 4; priority
    claim: Sparx EA is widely deployed in EU/CH government enterprise-architecture units. / Sparx Enterprise Architect is one of the dominant tools for IT enterprise-architecture modelling across EU and Swiss federal / cantonal IT units
    defect: Uncited absolute claim; no page read gives any deployment figure or names an EU or Swiss government user. The `high` priority and the Swiss/EU nexus rest on it.
    ground_truth: CERT Polska, sploit.tech, CCB and EUVD describe only affected versions; none states prevalence or government use.
    ground_truth_url: https://cert.pl/en/posts/2026/05/CVE-2026-42096/
    fix: Drop the prevalence claim or cite a source; keep the sourced exposure (PCS reachable over HTTP, WebEA installed) as the reason to inventory.
    class: imprecision
  - where: summary; body paragraph 3; tags no-patch; cves status no-patch
    claim: no vendor patch / no official patch has been released
    defect: 'True when written (researcher: "Currently vendor did not resolve any of the CVEs", 2026-05-19) but stated without a date; the vendor channel now lists Pro Cloud Server 6.5 whose release notes record security fixes (unauthenticated execution of arbitrary SQL queries, WebEA internal-artifact download), though none names CVE-2026-42096 to 42100.'
    ground_truth: 'Sparx Systems PCS 6.5 history: "Corrected Unauthenticated execution of arbitrary SQL queries (CVE-2025-15625)"; WebEA: "Corrected vulnerability when downloading Internal Artifacts"; "Added validation of the Model Number parameter on the initial page". The page does not state which CVE ids or which build 6.5.x fixes CVE-2026-42096 to 42100.'
    ground_truth_url: https://sparxsystems.com/products/procloudserver/6.5/history.html
    fix: '"As of 2026-05-19 the vendor had not released a fix" and note the vendor''s later PCS 6.5 security updates (CVE mapping not stated by the vendor).'
    class: imprecision
