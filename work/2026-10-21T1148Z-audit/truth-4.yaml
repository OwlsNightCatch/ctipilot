- entry: 2026-05-20/storm-2949-sspr-to-key-vault-azure-kill-chain
  verdict: factual-error
  defects:
  - where: body paragraph 1; tags organized-crime
    claim: The actor is financially motivated, currently unattributed to a nation-state nexus
    defect: No source states a motive other than data theft; Microsoft says Storm is a temporary designation, observed no follow-on extortion, and Microsoft security research leadership told BleepingComputer the activity is not linked to ShinyHunters. The organized-crime tag has no source.
    ground_truth: 'Microsoft: "a threat actor we track as Storm-2949 launched a relentless campaign with a singular focus: to exfiltrate as much sensitive data from a target organization’s high-value assets as possible." BleepingComputer: "current Storm-2949 activity does not indicate a connection to ShinyHunters or an affiliate of the group. Additionally, the attacker did not engage in follow-on extortion activity"; "Microsoft uses Storm as a temporary designation for threat activity that has yet to be classified".'
    ground_truth_url: https://www.bleepingcomputer.com/news/security/microsoft-self-service-password-reset-abused-in-azure-data-theft-attacks/
    fix: '"Microsoft tracks the actor as Storm-2949 (a temporary designation); its stated objective is mass data exfiltration, no extortion was observed, and Microsoft sees no link to ShinyHunters." Drop organized-crime from tags.'
    class: factual-error
  - where: body paragraph 1; Background paragraph; Phase 5
    claim: no traditional malware, no exploits, no zero-days — only end-to-end abuse of legitimate Azure / M365 management features ... a single chain crossing five Azure resource providers without dropping a binary.
    defect: Microsoft documents a ScreenConnect remote-management tool installed on VMs via Run Command from actor infrastructure, Microsoft Defender Antivirus protections disabled, Windows event logs cleared and .pfx certificate files exfiltrated. The entry omits all of this and its "without dropping a binary" is false; "no exploits, no zero-days" is not stated by Microsoft.
    ground_truth: 'Microsoft: "The script then installed the ScreenConnect remote monitoring and management (RMM) tool obtained from threat actor-controlled infrastructure."; "The script attempted to weaken Microsoft Defender Antivirus by disabling several protections, including real-time protection and behavior monitoring"; "These included clearing Windows event logs"; "They discovered and exfiltrated .pfx certificate files".'
    ground_truth_url: https://www.microsoft.com/en-us/security/blog/2026/05/18/storm-2949-turned-compromised-identity-into-cloud-wide-breach/
    fix: '"Mostly legitimate cloud management features, no traditional malware (Microsoft); on VMs the actor installed ScreenConnect through Run Command, weakened Defender Antivirus, cleared event logs and exfiltrated certificate files." Drop "no exploits, no zero-days" and "without dropping a binary".'
    class: factual-error
  - where: summary; body paragraph 3 (Phase 1 heading); event_date
    claim: Storm-2949 turns one SSPR-abused identity into a cloud-wide breach ... Microsoft Threat Intelligence published the full incident analysis on 2026-05-18;.
    defect: Four user accounts were taken over by the same SSPR abuse, not one identity (the body itself says four), and the summary ends with a stray ";." The event_date is 2026-05-19 while the Microsoft blog is dated 2026-05-18.
    ground_truth: 'Microsoft: "Storm-2949 used a similar process repeatedly across multiple users within the targeted organization."; "the threat actor expanded their foothold by compromising three additional cloud user accounts." Blog date 2026-05-18.'
    ground_truth_url: https://www.microsoft.com/en-us/security/blog/2026/05/18/storm-2949-turned-compromised-identity-into-cloud-wide-breach/
    fix: '"turns SSPR abuse of four privileged users into a cloud-wide breach"; remove the stray punctuation; event_date 2026-05-18.'
    class: factual-error
  - where: body Phase 1 (heading and first sentence); Background paragraph
    claim: '**Phase 1 — Identity (SSPR + voice phishing).** Storm-2949 initiated the Microsoft SSPR flow for selected target users ..., then contacted those users posing as internal IT support / typically pairs a legitimate SSPR initiation by the attacker with a phone call posing as IT support / documented in passing by several vendors since 2024'
    defect: 'Microsoft hedges: the technique is "consistent with known abuses" of SSPR and the IT-support call is an example ("might impersonate"); "voice phishing" and "phone call" are not stated, and no source supports "several vendors since 2024".'
    ground_truth: 'Microsoft: "We assess with high confidence that Storm-2949 leveraged a social engineering technique consistent with known abuses of Microsoft’s Self-Service Password Reset (SSPR) process."; "For example, the threat actor might impersonate an internal information technology (IT) support representative and contact the user ..."; "we assess that the threat actor likely used an organized and convincing phishing scheme".'
    ground_truth_url: https://www.microsoft.com/en-us/security/blog/2026/05/18/storm-2949-turned-compromised-identity-into-cloud-wide-breach/
    fix: Keep Microsoft's hedge ("consistent with SSPR abuse; likely a convincing phishing scheme, for example posing as IT support"), drop "voice phishing", "phone call" and the uncited "several vendors since 2024".
    class: imprecision
  - where: body Phase 3
    claim: From there the actor accessed the Kudu management console of those App Services ... exfiltrated dozens of secrets — database credentials, connection strings, third-party API keys. / modified access policies to grant themselves vault data-plane permissions
    defect: Microsoft does not state that the actor used Kudu; it says the retrieved publishing profile "often contains" Kudu credentials. The secret types it names are "database connection strings, identity credentials, and more" (no "third-party API keys"), and it says the actor "manipulated Key Vault access configurations", not specifically access policies granting data-plane permissions. Microsoft also says the secondary web apps did not yield the target and that the Key Vault secrets then gave access to the main production web app, whose password the actor changed.
    ground_truth: 'Microsoft: "Over the span of four minutes, the threat actor successfully manipulated Key Vault access configurations and accessed dozens of secrets within the said Key Vault. These secrets included database connection strings, identity credentials, and more"; "After they successfully authenticated into the web app, the threat actor changed its password to retain control."'
    ground_truth_url: https://www.microsoft.com/en-us/security/blog/2026/05/18/storm-2949-turned-compromised-identity-into-cloud-wide-breach/
    fix: Say "retrieved the publishing profiles (which often hold FTP, Web Deploy and Kudu credentials)" and "manipulated Key Vault access configurations and accessed dozens of secrets (connection strings, identity credentials)"; add the production web app compromise.
    class: imprecision
  - where: body "Detection concepts" bullets 1 and 3
    claim: 'Hunt for SSPR flow initiations (`category: SelfServicePasswordReset`) ... Hunt for the sequence `Add-AzKeyVaultCertificate` / `microsoft.keyvault/vaults/accessPolicies/write` → `microsoft.sql/servers/firewallrules/write` → `microsoft.storage/storageaccounts/write` → `microsoft.Storage/storageAccounts/listkeys/action`'
    defect: The Entra audit category for SSPR events is "Self-Service Password Management", not SelfServicePasswordReset. Neither Add-AzKeyVaultCertificate (a PowerShell cmdlet that adds a certificate) nor the Key Vault accessPolicies operation name appears in Microsoft's blog, which names publishxml, sql firewallrules/write, storage storageaccounts/write and listkeys/action.
    ground_truth: 'Microsoft Learn: "The following activity types appear in the Self-Service Password Management audit event category". Microsoft blog operations: microsoft.Web/sites/publishxml/action, microsoft.sql/servers/firewallrules/write, microsoft.storage/storageaccounts/write, microsoft.Storage/storageAccounts/listkeys/action.'
    ground_truth_url: https://learn.microsoft.com/en-us/entra/identity/authentication/howto-sspr-reporting
    fix: Use the audit category "Self-Service Password Management" and drop Add-AzKeyVaultCertificate and the unsourced Key Vault operation, or cite a Key Vault operation reference.
    class: factual-error
  - where: body Hardening bullets 3 and 4
    claim: SSPR-via-Authenticator-prompt is a number-matching MFA path ... Key Vault Contributor confers the same management-plane mutation capability ... Storm-2949's chain triggers built-in alerts at every step
    defect: (low confidence) "number-matching", the Key Vault Contributor equivalence and "alerts at every step" are in no linked source; Microsoft says Defender "generated multiple alerts" and recommends Azure RBAC over Key Vault access policies.
    ground_truth: 'Microsoft: "Throughout this incident, Microsoft Defender generated multiple alerts that helped analysts piece together activity across endpoints and cloud."; "Microsoft explicitly recommends Azure RBAC over Key Vault access policies."'
    ground_truth_url: https://www.microsoft.com/en-us/security/blog/2026/05/18/storm-2949-turned-compromised-identity-into-cloud-wide-breach/
    fix: Drop the three unsupported assertions or cite sources; keep "Microsoft Defender generated multiple alerts" and the RBAC-over-access-policies recommendation.
    class: imprecision
  - where: body (prose ATT&CK mappings); frontmatter techniques absent
    claim: 'Maps to T1562.007 (Impair Defenses: Disable or Modify Cloud Firewall), T1530, and T1041 (Exfiltration Over C2 Channel) / T1083 via Graph / T1552.001 (Credentials In Files) / T1021.007 (Run Command)'
    defect: T1562.007 is revoked in the pinned ATT&CK v20 dataset (replaced by T1686.001). T1083 does not describe Graph user/application enumeration (Cloud Account discovery, T1087.004), T1552.001 does not describe Key Vault secret theft (T1555.006), T1021.007 is not Run Command (T1651), and T1041 does not fit direct Azure SDK blob downloads. The frontmatter carries no techniques[] at all.
    ground_truth: 'attack/enterprise-attack.json (v20): T1562.007 revoked_by T1686.001; T1555.006 "Cloud Secrets Management Stores"; T1651 "Cloud Administration Command"; T1087.004 "Cloud Account".'
    ground_truth_url: https://www.microsoft.com/en-us/security/blog/2026/05/18/storm-2949-turned-compromised-identity-into-cloud-wide-breach/
    fix: Move the mapping to techniques[] with the ids in the upgrade block and remove the T-numbers from prose.
    class: imprecision
  - where: body paragraph 1 ("operationally relevant to every Swiss / EU organisation ... Azure Government"); sectors; regions
    claim: 'The incident is operationally relevant to every Swiss / EU organisation running production workloads on commercial Azure or Azure Government, which now spans much of federal admin, cantonal IT, healthcare, finance, telco, and education. / sectors: public-sector, healthcare, finance, telco'
    defect: No source gives Azure adoption figures for Swiss or EU administrations. The victim is a single unnamed organization with no stated sector or country, so the sector and region tags are unsupported.
    ground_truth: 'Microsoft: "a target organization"; BleepingComputer: "A threat actor targeting Microsoft 365 and Azure production environments"; neither names a sector, country or victim.'
    ground_truth_url: https://www.microsoft.com/en-us/security/blog/2026/05/18/storm-2949-turned-compromised-identity-into-cloud-wide-breach/
