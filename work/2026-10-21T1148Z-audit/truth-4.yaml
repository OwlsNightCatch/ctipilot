    claim: cross-realm IDOR in Authorization Services (CVE-2026-4630) ... allowing an authenticated attacker with a token from realm A to read or modify resource permissions in realm B on the same Keycloak instance
    defect: The flaw is a cross-resource-server IDOR inside one realm, not cross-realm.
    ground_truth: 'CVE record (Red Hat CNA): "By knowing or obtaining a resource''s unique identifier (UUID) belonging to another Resource Server within the same realm, the client could bypass authorization checks." Release notes: "Keycloak Authorization Services Protection API IDOR (Cross-Resource Server Access)".'
    ground_truth_url: https://cveawg.mitre.org/api/cve/CVE-2026-4630
    fix: '"cross-resource-server IDOR within a realm: an authenticated client that knows another resource server''s resource UUID can GET/PUT/DELETE it"; drop "cross-realm" everywhere.'
    class: factual-error
  - where: body (CVE-2026-7507 description)
    claim: session fixation in the OIDC login flow where a crafted `state` parameter before user authentication completes enables account takeover
    defect: The mechanism is a pre-created authentication session pushed on the victim through a crafted link to the login-actions/restart endpoint, which lacks CSRF protection and cookie-ownership checks; no source mentions the state parameter.
    ground_truth: 'CVE record: "An unauthenticated attacker could exploit this flaw by pre-creating an authentication session and tricking a victim into visiting a maliciously crafted link. By leveraging the /login-actions/restart endpoint—which processes session handles without adequate CSRF protection or cookie ownership validation—an attacker can reset the authenti..."'
    ground_truth_url: https://cveawg.mitre.org/api/cve/CVE-2026-7507
    fix: Use the CVE-record mechanism (pre-created auth session, crafted link, /login-actions/restart, victim interaction).
    class: factual-error
  - where: cves[] (all six records)
    claim: 'cvss: not yet assigned (BSI HIGH classification); vector: zero-click; auth: pre-auth'
    defect: Red Hat (CNA) published CVSS scores on 2026-05-19; none is zero-click and four need privileges or victim interaction.
