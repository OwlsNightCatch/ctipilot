  - claim_id: 23b1aab52c
    entry: 2026-05-20/cisco-talos-demo-pdb-badiis-variant-now-a-commodity-maas-iis
    surface: "headline"
    kind: frontmatter
    text: "Cisco Talos: commodity \"demo.pdb\" BadIIS module for SEO fraud survives IIS restarts through a hidden backup copy"
  - claim_id: 5d65a38119
    entry: 2026-05-20/cisco-talos-demo-pdb-badiis-variant-now-a-commodity-maas-iis
    surface: "summary"
    kind: frontmatter
    text: "Cisco Talos reported on 2026-05-19 that a BadIIS variant marked by \"demo.pdb\" strings, seen since 2024 mainly in the Asia-Pacific region and in a few cases in South Africa, Europe and North America, is commodity malware likely sold or shared among Chinese-speaking cybercrime groups, configured with a recovered builder for visitor redirection, crawler reverse proxying, content hijacking and backlink injection. Its installers register the malicious DLL in the IIS server module list, run as services impersonating Windows ones and keep a hidden backup copy that restores it on every IIS restart; Talos ties development since at least September 2021 to the alias \"lwxat\"."
  - claim_id: db1b1f0b3b
    entry: 2026-05-20/cisco-talos-demo-pdb-badiis-variant-now-a-commodity-maas-iis
    surface: "body"
    kind: cited
    text: "Since 2024 Talos has investigated attacks, mainly in the Asia-Pacific region and a few in South Africa, Europe and North America, that use a BadIIS variant marked by \"demo.pdb\" strings, which it assesses with moderate confidence is commodity malware sold privately or shared among several Chinese-speaking cybercrime groups under a malware-as-a-service model ("
    urls: ["https://blog.talosintelligence.com/from-pdb-strings-to-maas-tracking-a-commodity-badiis-ecosystem/"]
  - claim_id: 111e83fe41
    entry: 2026-05-20/cisco-talos-demo-pdb-badiis-variant-now-a-commodity-maas-iis
    surface: "body"
    kind: cited
    text: "The BadIIS variants of the DragonRank and UAT-8099 groups Talos documented before relied on hardcoded C2 and statically compiled payloads, whereas this variant is configured with a recovered builder that injects parameters for JavaScript redirection of visitors to illicit sites, reverse proxying of illicit content to search-engine crawlers, site-wide content hijacking and backlink injection, and that encodes the C2 address with single-byte XOR ("
    urls: ["https://blog.talosintelligence.com/from-pdb-strings-to-maas-tracking-a-commodity-badiis-ecosystem/"]
  - claim_id: 4c35fdd1e9
    entry: 2026-05-20/cisco-talos-demo-pdb-badiis-variant-now-a-commodity-maas-iis
    surface: "body"
    kind: cited
    text: "Service-based installers from the same author impersonate Windows services such as Winlogin, FaxService or AudiosService, authenticate to a C2 server, download further payloads, hide their command lines with custom Base64 and register the BadIIS DLL in the globalModules and modules sections of the IIS configuration, and the latest copies the DLL to a hidden backup location so it is restored every time IIS restarts ("
    urls: ["https://blog.talosintelligence.com/from-pdb-strings-to-maas-tracking-a-commodity-badiis-ecosystem/"]
  - claim_id: 3beaf036a7
    entry: 2026-05-20/cisco-talos-demo-pdb-badiis-variant-now-a-commodity-maas-iis
    surface: "body"
    kind: cited
    text: "Talos ties development from at least September 2021 to January 2026, including a build to bypass Norton, to the alias \"lwxat\" with moderate-to-high confidence, from the builder's authentication string, a configuration parameter and a custom user agent seen in samples ("
    urls: ["https://blog.talosintelligence.com/from-pdb-strings-to-maas-tracking-a-commodity-badiis-ecosystem/"]
  - claim_id: 83f3b63088
    entry: 2026-05-20/cisco-talos-demo-pdb-badiis-variant-now-a-commodity-maas-iis
    surface: "body"
    kind: cited
    text: "**Exposure:** internet-facing Microsoft IIS servers that have already been compromised by means Talos does not describe; the victims it observed are mostly in the Asia-Pacific region ("
    urls: ["https://blog.talosintelligence.com/from-pdb-strings-to-maas-tracking-a-commodity-badiis-ecosystem/"]
  - claim_id: 71c154649c
    entry: 2026-05-20/cisco-talos-demo-pdb-badiis-variant-now-a-commodity-maas-iis
    surface: "body"
    kind: cited
    text: "**Detection:** in the IIS server configuration, unknown native modules in the globalModules and modules sections; in the file system, a second copy of the module DLL in a hidden backup location; in service telemetry, new services named like Windows components that run command lines altering the IIS module list ("
    urls: ["https://blog.talosintelligence.com/from-pdb-strings-to-maas-tracking-a-commodity-badiis-ecosystem/"]
  - claim_id: 1c9e96e928
    entry: 2026-05-20/cisco-talos-demo-pdb-badiis-variant-now-a-commodity-maas-iis
    surface: "body"
    kind: cited
    text: "Deleting the DLL alone does not clean the server, because the backup copy returns it at the next IIS restart ("
    urls: ["https://blog.talosintelligence.com/from-pdb-strings-to-maas-tracking-a-commodity-badiis-ecosystem/"]
  - claim_id: 4523eab50b
    entry: 2026-05-20/cisco-talos-demo-pdb-badiis-variant-now-a-commodity-maas-iis
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** operators of internet-facing IIS servers should check the server-level module list for modules they did not install; on a finding, remove the backup copy and the impersonating service along with the module, or BadIIS comes back at the next restart ("
    urls: ["https://blog.talosintelligence.com/from-pdb-strings-to-maas-tracking-a-commodity-badiis-ecosystem/"]
  - claim_id: c5a134f9be
    entry: 2026-05-20/cisco-talos-demo-pdb-badiis-variant-now-a-commodity-maas-iis
    surface: "body"
    kind: uncited
