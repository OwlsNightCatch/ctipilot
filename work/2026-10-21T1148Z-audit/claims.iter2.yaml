    urls: ["https://ico.org.uk/about-the-ico/media-centre/news-and-blogs/2026/05/fine-of-nearly-1m-issued-against-south-staffordshire-plc-and-south-staffordshire-water-plc/"]
  - claim_id: 7ec278a17d
    entry: 2026-05-12/ico-fines-south-staffordshire-water-963-900-water-sector-oes
    surface: "body"
    kind: cited
    text: "The attack began in September 2020 with a phishing email whose attachment, once opened, let the attacker install malicious software that stayed undetected for 20 months; in May 2022 the attacker moved through the network and compromised domain administrator privileges, and the breach was found only when IT performance problems started an internal investigation on 15 July 2022, followed by a ransom note on 26 July ("
    urls: ["https://ico.org.uk/about-the-ico/media-centre/news-and-blogs/2026/05/fine-of-nearly-1m-issued-against-south-staffordshire-plc-and-south-staffordshire-water-plc/"]
  - claim_id: ceb4589a72
    entry: 2026-05-12/ico-fines-south-staffordshire-water-963-900-water-sector-oes
    surface: "body"
    kind: cited
    text: "Two domain controllers were unpatched against ZeroLogon (CVE-2020-1472) in May 2022, and while the incident did not start through it, the attacker exploited it during the incident ("
    urls: ["https://ico.org.uk/media2/xdrfahsw/south-staffordshire-plc-and-south-staffordshire-water-plc-monetary-penalty-notice.pdf"]
