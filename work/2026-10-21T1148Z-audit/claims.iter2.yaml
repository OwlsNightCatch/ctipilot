    text: "**Detection:** in process-creation telemetry, a script host running a .jse attachment that spawns a hidden PowerShell calling certutil to decode a file, followed by regsvr32 /s or rundll32 on a file in C:\\ProgramData or the temp folder; in persistence artifacts, HKCU Run values or per-minute scheduled tasks named after browser checks that run regsvr32 on a DLL, and a new service whose command runs rundll32 ("
