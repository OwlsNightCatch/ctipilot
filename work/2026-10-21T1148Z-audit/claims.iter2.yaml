    surface: "summary"
    kind: frontmatter
    text: "SOCRadar reported on 2026-05-18 that the dark-web carding marketplace B1ack's Stash suspended about 8 million stolen CVV2 records after sellers resold its cards on competing shops, and released about 4.6 million of them for free. The records carry full card numbers, CVV2, cardholder identity, billing address, e-mail, phone and IP address, about 70% of them from US cardholders; SOCRadar assesses that the data likely comes from e-commerce skimming or phishing."
