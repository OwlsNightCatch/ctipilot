    text: "The payload determines the operating system (Windows, Linux or macOS), then walks a list of file paths for common applications on that system looking for credentials, with crypto wallets, VPNs, AWS and GitHub among the targets; Checkmarx had found no references to Jenkins in it, and Mandiant found no threat-actor access to the Checkmarx One SaaS environment ("
