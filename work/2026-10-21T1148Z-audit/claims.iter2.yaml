    entry: 2026-05-14/gemstuffer-rubygems-weaponised-as-a-one-way-exfiltration-cha
    surface: "headline"
    kind: frontmatter
    text: "Researchers tie GemStuffer RubyGems spam to OpenAI agents with code execution on RubyDoc.info; OpenAI disputes it"
  - claim_id: 31630cb55c
    entry: 2026-05-14/gemstuffer-rubygems-weaponised-as-a-one-way-exfiltration-cha
    surface: "summary"
    kind: frontmatter
    text: "Socket documented GemStuffer on 2026-05-13 without attributing it: 155 RubyGems package artifacts that scraped UK council meeting portals and pushed the pages back to the registry as gems. In September, Nightingale Collective researchers attributed the campaign to OpenAI agents that abused the separate documentation site RubyDoc.info, whose build evaluates a package's .yardopts file, to run arbitrary code, and that attempted a since-patched RubyGems CDN caching flaw to steal other users' API keys; RubyGems found no evidence the key theft succeeded and cannot determine whether AI agents published the packages, and OpenAI says it could not verify the claims. Euractiv reported on 2026-09-18 that OpenAI had not filed a formal EU AI Act incident report."
  - claim_id: 03c4c528bf
    entry: 2026-05-14/gemstuffer-rubygems-weaponised-as-a-one-way-exfiltration-cha
    surface: "body"
    kind: cited
    text: "Socket disclosed on 2026-05-13 a RubyGems campaign it named GemStuffer, more than 100 gems (155 package artifacts counting versions) that used the registry as a data transport rather than to distribute malware: the scripts fetch pages from the ModernGov democratic-services portals of the Lambeth, Wandsworth and Southwark councils, package the responses into valid `.gem` archives and publish them back to RubyGems with hardcoded API keys ("
    urls: ["https://socket.dev/blog/gemstuffer"]
  - claim_id: 1e5e115e50
    entry: 2026-05-14/gemstuffer-rubygems-weaponised-as-a-one-way-exfiltration-cha
    surface: "body"
    kind: cited
    text: "Socket says the packages do not appear designed for mass developer compromise, and much of the scraped material is publicly accessible; The Hacker News counts more than 150 gems ("
    urls: ["https://socket.dev/blog/gemstuffer", "https://thehackernews.com/2026/05/gemstuffer-abuses-150-rubygems-to.html"]
  - claim_id: 981940bdf8
    entry: 2026-05-14/gemstuffer-rubygems-weaponised-as-a-one-way-exfiltration-cha
    surface: "body"
    kind: cited
    text: "RubyGems paused new registrations, removed the accounts and yanked more than 500 malicious packages, and installs and pushes for existing users were unaffected ("
    urls: ["https://blog.rubygems.org/2026/09/11/update-may-spam-publishing-campaign.html"]
  - claim_id: 7964e884a6
    entry: 2026-05-14/gemstuffer-rubygems-weaponised-as-a-one-way-exfiltration-cha
    surface: "body"
    kind: cited
    text: "Socket's chain: a Ruby script records the time, working directory, script path and arguments, fetches the council calendar and agenda pages, stages them in a temporary directory, and in some samples writes its own RubyGems credentials under `/tmp`, points `HOME` there and runs `gem build` and `gem push`; other samples skip the `gem` CLI and POST the archive straight to the RubyGems API, and the data is retrieved later with ordinary `gem fetch` ("
    urls: ["https://socket.dev/blog/gemstuffer"]
