  - claim_id: f8ef5a346f
    entry: 2026-05-21/cve-2026-45829-chromadb-python-fastapi-server-pre-auth-rce-v
    surface: "summary"
    kind: frontmatter
    text: "CVE-2026-45829, reported by HiddenLayer and analysed by Hadrian on 2026-05-19, lets an unauthenticated attacker make ChromaDB's Python FastAPI server load a HuggingFace model of the attacker's choosing with trust_remote_code enabled, executing the attacker's Python in the server process before the authentication check rejects the request (CVSS 4.0 10.0). Every Python server from 1.0.0 is affected, the default Rust frontend is not, and no fixed version existed as of 2026-05-19, 1.5.9 being the latest."
