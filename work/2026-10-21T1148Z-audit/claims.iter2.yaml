  - claim_id: f129acb791
    entry: 2026-05-17/cert-pl-cve-2026-44088-szafirhost-jar-zip-polyglot-bypass-in
    surface: "section 2026-10-21T20:21:19Z"
    kind: cited
    text: "The CVSS 4.0 base score of 8.6 is CERT-PL's as the numbering authority, carried by ENISA's EUVD ("
    urls: ["https://euvd.enisa.europa.eu/enisa/eu_vulnerability_database/EUVD-2026-30512"]
  - claim_id: 679011dfd5
    entry: 2026-05-17/cert-pl-cve-2026-44088-szafirhost-jar-zip-polyglot-bypass-in
    surface: "record 2026-10-21T20:21:19Z"
    kind: record-summary
    text: "Polish qualified electronic signatures are not recognised as equivalent in Switzerland, which has no mutual recognition agreement with the EU, so the flaw carries no Swiss signature-trust exposure. CERT Polska states only that combining a genuine signed JAR with a malicious ZIP can lead to remote code execution in SzafirHost before 1.2.1, and names neither a download-path attack nor silent signing of fraudulent documents nor the public-sector workflows that rely on it. The CVSS 4.0 score of 8.6 is CERT-PL's as carried by ENISA's EUVD."
