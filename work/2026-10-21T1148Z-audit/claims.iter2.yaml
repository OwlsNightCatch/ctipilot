  - claim_id: 80bb3b4fa5
    entry: 2026-05-11/sms-blaster-smishing-establishing-itself-in-switzerland-port
    surface: "summary"
    kind: frontmatter
    text: "BACS reported in September 2025 that fake parking-fine texts in western Switzerland were being sent with SMS blasters, portable fake base stations that pull phones within 500 to 1,000 metres onto 2G and deliver texts with spoofed senders past the operators' SMS filters; Basel-Landschaft police arrested a suspect with such a device in November 2025. The awareness portal ebas.ch warned on 2026-05-07 that the scam is establishing itself in Switzerland, with lures posing as authorities, banks or couriers that link to fake sites collecting card data and e-banking credentials."
  - claim_id: 6fda5d70f3
    entry: 2026-05-11/sms-blaster-smishing-establishing-itself-in-switzerland-port
    surface: "body"
    kind: cited
    text: "BACS reported on 2025-09-09 that numerous fake parking-fine texts were reaching people in western Switzerland who had recently been in the places mentioned, and that one recipient's phone switched from 4G to 2G just before the message arrived, pointing to an SMS blaster ("
    urls: ["https://www.bacs.admin.ch/en/25w36-en"]
  - claim_id: 8fbfd2c392
    entry: 2026-05-11/sms-blaster-smishing-establishing-itself-in-switzerland-port
    surface: "body"
    kind: cited
    text: "The device builds on IMSI-catcher technology: it poses as the best available mobile mast within a radius of 500 to 1,000 metres, forces connecting phones onto the outdated 2G standard and sends texts with forged sender information directly to the handset, bypassing the operator's SMS filters ("
    urls: ["https://www.bacs.admin.ch/en/25w36-en"]
  - claim_id: 0994835784
    entry: 2026-05-11/sms-blaster-smishing-establishing-itself-in-switzerland-port
    surface: "body"
    kind: cited
