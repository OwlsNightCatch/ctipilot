    surface: "body"
    kind: cited
    text: "ReliaQuest describes the tools as consistent with actors in the ransomware ecosystem and the logouts and later re-entries with other accounts as initial access broker activity ("
    urls: ["https://reliaquest.com/blog/threat-spotlight-vpn-exploitation-when-patched-doesnt-mean-protected/"]
