    entry: 2026-05-20/vm2-node-js-sandbox-12-critical-cves-cve-2026-43997-43999-44
    surface: "body"
    kind: cited
    text: "The Hacker News reported on 2026-05-07 a dozen critical vulnerabilities in vm2, the Node.js library that runs untrusted JavaScript in a sandbox by intercepting and proxying objects, which let an attacker break out and execute arbitrary code on the host; fixes landed across versions 3.10.5 to 3.11.2, and users were told to update to 3.11.2 ("
    urls: ["https://thehackernews.com/2026/05/vm2-nodejs-library-vulnerabilities.html"]
  - claim_id: 0445d67312
    entry: 2026-05-20/vm2-node-js-sandbox-12-critical-cves-cve-2026-43997-43999-44
    surface: "body"
    kind: cited
    text: "Among them, CVE-2026-43997 (CVSS 10.0) obtains the host `Object` despite earlier protections ("
    urls: ["https://github.com/patriksimek/vm2/security/advisories/GHSA-47x8-96vw-5wg6"]
  - claim_id: 7c7fafaa02
    entry: 2026-05-20/vm2-node-js-sandbox-12-critical-cves-cve-2026-43997-43999-44
    surface: "body"
    kind: cited
    text: "), CVE-2026-44006 (10.0) reaches `BaseHandler.getPrototypeOf` to get arbitrary prototypes ("
    urls: ["https://github.com/patriksimek/vm2/security/advisories/GHSA-qcp4-v2jj-fjx8"]
  - claim_id: 13aef6195f
    entry: 2026-05-20/vm2-node-js-sandbox-12-critical-cves-cve-2026-43997-43999-44
    surface: "body"
    kind: cited
    text: "), and CVE-2026-43999 (9.9) bypasses NodeVM's builtin allowlist whenever the `module` builtin is allowed, including through the `'*'` wildcard, so sandboxed code can load excluded builtins such as `child_process` ("
    urls: ["https://github.com/patriksimek/vm2/security/advisories/GHSA-947f-4v7f-x2v8"]
  - claim_id: 0fd4ed2401
    entry: 2026-05-20/vm2-node-js-sandbox-12-critical-cves-cve-2026-43997-43999-44
    surface: "body"
    kind: cited
    text: "); CVE-2026-44008 escapes through `neutralizeArraySpeciesBatch()` and CVE-2026-44009 through a null-proto exception, both 9.8 and fixed in 3.11.2 ("
    urls: ["https://thehackernews.com/2026/05/vm2-nodejs-library-vulnerabilities.html"]
  - claim_id: 3743049c3d
    entry: 2026-05-20/vm2-node-js-sandbox-12-critical-cves-cve-2026-43997-43999-44
    surface: "body"
    kind: cited
    text: "On 2026-05-18 the maintainer published a second set of advisories affecting 3.11.3 and earlier and fixed in 3.11.4 ("
    urls: ["https://github.com/patriksimek/vm2/security/advisories/GHSA-v6mx-mf47-r5wg"]
  - claim_id: 90d32ca0b3
    entry: 2026-05-20/vm2-node-js-sandbox-12-critical-cves-cve-2026-43997-43999-44
    surface: "body"
    kind: cited
    text: "), covered by BSI's WID-SEC-2026-1583 with CVE-2026-47131, CVE-2026-47135, CVE-2026-47137, CVE-2026-47139, CVE-2026-47140, CVE-2026-47141, CVE-2026-47208, CVE-2026-47209 and CVE-2026-47210; BSI says a remote, anonymous attacker can use them to execute arbitrary code, bypass security measures and disclose confidential information ("
    urls: ["https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-1583"]
