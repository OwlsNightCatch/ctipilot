    entry: 2026-05-20/sparx-enterprise-architect-pro-cloud-server-five-cve-chain-p
    surface: "body"
    kind: cited
    text: "CERT Polska coordinated the disclosure of five vulnerabilities in Sparx Systems Pro Cloud Server (PCS) and Enterprise Architect (EA) on 2026-05-19, reported by Blazej Adamczyk (br0x) of Efigo ("
    urls: ["https://cert.pl/en/posts/2026/05/CVE-2026-42096/"]
