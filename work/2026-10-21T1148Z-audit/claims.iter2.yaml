    text: "The company held data on about 1.85 million customers, around 750,000 current and 1.1 million former, and on its staff; the personal data of 633,887 people was published on the dark web, part of over 4.1 TB of data, including online-service usernames and passwords, bank account numbers and sort codes, employees' National Insurance numbers and information from which disabilities of Priority Services Register customers could be inferred ("
    urls: ["https://ico.org.uk/about-the-ico/media-centre/news-and-blogs/2026/05/fine-of-nearly-1m-issued-against-south-staffordshire-plc-and-south-staffordshire-water-plc/"]
