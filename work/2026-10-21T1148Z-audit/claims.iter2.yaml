  - claim_id: 6947aa13cd
    entry: 2026-05-16/amd-sb-7052-cve-2025-54518-amd-zen-2-op-cache-corruption-soc
    surface: "summary"
    kind: frontmatter
    text: "AMD disclosed on 2026-05-12 that a flaw in the CPU operation cache of Zen 2-based processors can cause incorrect instructions to execute at a higher privilege level (CVE-2025-54518, CVSS 4.0 score 7.3, local, low privileges). AMD's mitigation for EPYC 7002 and EPYC Embedded 7002 is an OS update, which Microsoft says the May 2026 Windows builds enable, while Ryzen, Threadripper PRO and Ryzen Embedded V2000 parts need OEM BIOS updates carrying the Platform Initialization versions AMD lists. Xen says code of any privilege could escalate, including guest to host, and ships XSA-490 patches with no other mitigation."
