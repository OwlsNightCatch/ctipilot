  - claim_id: ad6e14fda8
    entry: 2026-05-18/tycoon2fa-after-the-march-2026-takedown-oauth-device-authori
    surface: "body"
    kind: cited
    text: "The lure, a forwarded vendor-invoice reminder, carries a Trustifi click-tracking URL whose clean-reputation domain launders the link, and Trustifi redirects to a throwaway Cloudflare Workers subdomain that returns an AES-GCM-encrypted page decrypted in the browser ("
    urls: ["https://www.esentire.com/blog/tycoon-2fa-operators-adopt-oauth-device-code-phishing"]
