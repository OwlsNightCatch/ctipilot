    entry: 2026-05-10/clickfix-campaign-expands-to-macos-macsync-shub-stealer-and
    surface: "headline"
    kind: frontmatter
    text: "Microsoft: macOS infostealer campaign moves from disk images to ClickFix Terminal-paste lures for MacSync, SHub and AMOS"
  - claim_id: 5be6f13b1e
    entry: 2026-05-10/clickfix-campaign-expands-to-macos-macsync-shub-stealer-and
    surface: "summary"
    kind: frontmatter
    text: "Microsoft reported on 2026-05-06 that a macOS infostealer campaign which earlier shipped disk images now hosts ClickFix-style instructions on standalone sites, Medium posts and Craft pages that tell users to paste a Base64-encoded command into Terminal, loading MacSync, SHub Stealer or AMOS. The stealers take Keychain entries, browser credentials, iCloud data and wallet data, and in some campaigns replace installed Ledger Wallet, Trezor Suite and Exodus apps with trojanized versions; macOS 26.4 and later blocks the paste of such commands."
  - claim_id: b4436b463a
    entry: 2026-05-10/clickfix-campaign-expands-to-macos-macsync-shub-stealer-and
    surface: "body"
    kind: cited
    text: "Microsoft reported on 2026-05-06 that an infostealer campaign targeting macOS, whose earlier iterations delivered the stealers in disk-image (.dmg) files that users installed by hand, now instructs users to run Terminal commands that retrieve remote content with native utilities and then execute a script-based loader ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/05/06/clickfix-campaign-uses-fake-macos-utilities-lures-deliver-infostealers/"]
  - claim_id: 8503d65830
    entry: 2026-05-10/clickfix-campaign-expands-to-macos-macsync-shub-stealer-and
    surface: "body"
    kind: cited
    text: "The ClickFix-style instructions sit on standalone sites, on the note-taking platform Craft and in fake troubleshooting posts on Medium that promise to fix common macOS problems such as low disk space, and the pasted Base64 command decodes and runs an AppleScript or Bash loader ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/05/06/clickfix-campaign-uses-fake-macos-utilities-lures-deliver-infostealers/"]
  - claim_id: 770f9378fd
    entry: 2026-05-10/clickfix-campaign-expands-to-macos-macsync-shub-stealer-and
    surface: "body"
    kind: cited
    text: "Scripts launched from Terminal do not undergo the code-signing and notarization evaluation Gatekeeper can apply to application bundles opened through Finder ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/05/06/clickfix-campaign-uses-fake-macos-utilities-lures-deliver-infostealers/"]
  - claim_id: 97768b0de4
    entry: 2026-05-10/clickfix-campaign-expands-to-macos-macsync-shub-stealer-and
    surface: "body"
    kind: cited
    text: "In the loader campaign, seen since February 2026, curl fetches a loader, a zsh script decodes a Base64 and Gzip payload and runs it with eval, fingerprints the host, stops on a Russian or CIS keyboard layout and runs a remote AppleScript stealer in memory through osascript; the stealer, which calls itself SHub Stealer, asks for the user's password as if installing a helper, validates it with dscl, stages browser credentials, Keychain entries, iCloud and Telegram data, wallets and small documents in a temporary folder, compresses and exfiltrates them and deletes the staging files, then persists as a LaunchAgent disguised as a Google software-update agent that runs Base64 commands returned by its C2 ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/05/06/clickfix-campaign-uses-fake-macos-utilities-lures-deliver-infostealers/"]
  - claim_id: d388673249
    entry: 2026-05-10/clickfix-campaign-expands-to-macos-macsync-shub-stealer-and
    surface: "body"
    kind: cited
    text: "The script campaign, seen in April 2026, streams a remote script straight into the shell from a one-line pipeline and persists an obfuscated AppleScript in a LaunchAgent that probes hard-coded C2 candidates with curl, falls back to a server identifier hidden on a Telegram bot page and pipes the server's response into osascript ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/05/06/clickfix-campaign-uses-fake-macos-utilities-lures-deliver-infostealers/"]
  - claim_id: 391d2a49e7
    entry: 2026-05-10/clickfix-campaign-expands-to-macos-macsync-shub-stealer-and
    surface: "body"
    kind: cited
    text: "The helper campaign (AMOS), seen since late January 2026, decodes and gunzips a first stage that downloads a Mach-O executable, strips its extended attributes, checks for virtualisation with system_profiler, copies Keychain databases and Chromium browser passwords and session cookies, exfiltrates a ZIP archive and installs a LaunchDaemon that runs a bash wrapper with root privileges at every boot to keep a backdoor running ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/05/06/clickfix-campaign-uses-fake-macos-utilities-lures-deliver-infostealers/"]
  - claim_id: f9c26c0ad2
    entry: 2026-05-10/clickfix-campaign-expands-to-macos-macsync-shub-stealer-and
    surface: "body"
    kind: cited
    text: "In the loader and helper campaigns the stealer replaces installed Ledger Wallet and Trezor Suite apps, and in the loader campaign also Exodus, with trojanized versions fetched from its C2 ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/05/06/clickfix-campaign-uses-fake-macos-utilities-lures-deliver-infostealers/"]
  - claim_id: 869e35c3ce
    entry: 2026-05-10/clickfix-campaign-expands-to-macos-macsync-shub-stealer-and
    surface: "body"
    kind: cited
    text: "); Malwarebytes documented SHub Stealer modifying wallet apps after a Terminal-paste lure on a fake CleanMyMac site in March 2026 ("
    urls: ["https://www.malwarebytes.com/blog/threat-intel/2026/03/fake-cleanmymac-site-installs-shub-stealer-and-backdoors-crypto-wallets"]
  - claim_id: 9a183fe66e
    entry: 2026-05-10/clickfix-campaign-expands-to-macos-macsync-shub-stealer-and
    surface: "body"
    kind: cited
    text: "**Exposure:** Mac users who can paste commands into Terminal; Apple has updated XProtect signatures, and macOS 26.4 and later blocks the paste of a potentially malicious command into Terminal, so earlier releases lack that mitigation ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/05/06/clickfix-campaign-uses-fake-macos-utilities-lures-deliver-infostealers/"]
  - claim_id: cd78c2db85
    entry: 2026-05-10/clickfix-campaign-expands-to-macos-macsync-shub-stealer-and
