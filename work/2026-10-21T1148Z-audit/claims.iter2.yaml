    kind: record-summary
    text: "Sophos published its State of Identity Security 2026 on 2026-05-12, two days before Help Net Security's report. Its ransomware finding is that two-thirds of ransomware victims tied the incident to their most significant identity attack, and it says attackers increasingly use stolen credentials as their primary delivery mechanism."
  - claim_id: d75c8f37d5
    entry: 2026-05-15/datadog-security-labs-analyzes-leaked-teampcp-shai-hulud-off
    surface: "headline"
    kind: frontmatter
    text: "TeamPCP open-sourced its Shai-Hulud framework; Datadog maps its theft, persistence and npm-poisoning code"
  - claim_id: c1ed141d8e
    entry: 2026-05-15/datadog-security-labs-analyzes-leaked-teampcp-shai-hulud-off
    surface: "summary"
    kind: frontmatter
    text: "On 2026-05-12 a GitHub repository signed \"Love - TeamPCP\" published what Datadog Security Labs assesses as the complete source of the Shai-Hulud offensive framework; GitHub removed it soon after, but not before it was forked. Datadog's static analysis of 2026-05-13 finds a TypeScript and Bun toolkit that harvests more than 100 credential file paths, cloud, Kubernetes and Vault secrets and GitHub Actions runner memory, poisons repositories with VS Code and Claude Code hooks and npm packages with stolen tokens or a workflow's OIDC token, exits on Russian-locale systems, and installs a daemon that deletes the home directory when a stolen GitHub token is revoked."
  - claim_id: f8d2138694
    entry: 2026-05-15/datadog-security-labs-analyzes-leaked-teampcp-shai-hulud-off
    surface: "body"
    kind: cited
    text: "On 2026-05-12 a GitHub repository appeared with what Datadog Security Labs assesses as the complete source code of the Shai-Hulud offensive framework attributed to TeamPCP; its README reads \"Love - TeamPCP\" and \"Change keys and C2 as needed\", its commits are authored as TeamPCP_OSS, and GitHub removed it shortly after publication, though not before it was forked several times ("
    urls: ["https://securitylabs.datadoghq.com/articles/shai-hulud-open-source-framework-static-analysis/"]
  - claim_id: f2f03a2638
    entry: 2026-05-15/datadog-security-labs-analyzes-leaked-teampcp-shai-hulud-off
    surface: "body"
    kind: cited
    text: "Datadog maps the source directly to compiled payloads seen in the wild, including those of the TanStack and UiPath compromises, and finds 19 of the 22 TeamPCP techniques described in earlier reporting implemented in it ("
    urls: ["https://securitylabs.datadoghq.com/articles/shai-hulud-open-source-framework-static-analysis/"]
  - claim_id: 2fabce1c3f
    entry: 2026-05-15/datadog-security-labs-analyzes-leaked-teampcp-shai-hulud-off
    surface: "body"
    kind: cited
    text: "The modular TypeScript and Bun toolkit exits on systems with a Russian locale, then reads OS-specific lists of more than 100 sensitive file paths, runs `gh auth token` and captures the process environment, and in GitHub Actions on Linux feeds a script to `sudo python3` that reads the Runner.Worker process memory for values marked secret; further providers walk the AWS credential chain including instance and container metadata, read every Kubernetes secret in every namespace and enumerate Vault ("
    urls: ["https://securitylabs.datadoghq.com/articles/shai-hulud-open-source-framework-static-analysis/"]
  - claim_id: 6b0bb8ce5a
    entry: 2026-05-15/datadog-security-labs-analyzes-leaked-teampcp-shai-hulud-off
    surface: "body"
    kind: cited
    text: "Data leaves AES-256-GCM encrypted over HTTPS to a campaign domain, with a fallback domain found through signed GitHub commits and, failing that, new public GitHub repositories used as dead-drops ("
    urls: ["https://securitylabs.datadoghq.com/articles/shai-hulud-open-source-framework-static-analysis/"]
  - claim_id: 9478255957
    entry: 2026-05-15/datadog-security-labs-analyzes-leaked-teampcp-shai-hulud-off
    surface: "body"
    kind: cited
    text: "Stolen GitHub tokens are used to commit VS Code folder-open tasks and Claude Code SessionStart hooks to every branch of the victim's repositories, stolen npm tokens to republish the victim's packages with a `preinstall` loader, and, in a release workflow it was hardcoded to target, the workflow's OIDC token to publish a poisoned package with genuine Sigstore provenance; where it attaches a stolen token it installs a LaunchAgent or systemd user service that checks the token every minute and runs `rm -rf ~/` once it is revoked ("
    urls: ["https://securitylabs.datadoghq.com/articles/shai-hulud-open-source-framework-static-analysis/"]
  - claim_id: 1bb64d3e8d
    entry: 2026-05-15/datadog-security-labs-analyzes-leaked-teampcp-shai-hulud-off
    surface: "body"
    kind: cited
    text: "**Exposure:** CI/CD pipelines, developer workstations and cloud environments open to the documented techniques, in particular Runner.Worker memory extraction, instance and container metadata collection and IDE hook persistence; with the code public, other actors can reuse the playbook ("
    urls: ["https://securitylabs.datadoghq.com/articles/shai-hulud-open-source-framework-static-analysis/"]
  - claim_id: 118b21bdba
    entry: 2026-05-15/datadog-security-labs-analyzes-leaked-teampcp-shai-hulud-off
    surface: "body"
    kind: cited
    text: "**Detection:** on hosts, a `gh-token-monitor` LaunchAgent or systemd user service, and Claude Code `SessionStart` hooks or VS Code `folderOpen` tasks that run a `setup.mjs` loader; in repositories, commits on any branch under a spoofed `claude` identity that add these hook and loader files; under stolen tokens, new public repositories with Dune-themed names; in npm, unexpected patch releases of your packages that add a `preinstall` script; in GitHub Actions, a disguised workflow that dumps the repository's secrets, followed by deleted workflow runs and branches ("
    urls: ["https://securitylabs.datadoghq.com/articles/shai-hulud-open-source-framework-static-analysis/"]
  - claim_id: 55700621fa
    entry: 2026-05-15/datadog-security-labs-analyzes-leaked-teampcp-shai-hulud-off
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** before revoking any GitHub token on a suspect host, disable the token-monitoring daemon, then rotate credentials; yank any package version that gained an unexpected `preinstall` script ("
    urls: ["https://securitylabs.datadoghq.com/articles/shai-hulud-open-source-framework-static-analysis/"]
  - claim_id: ecf5588f4d
    entry: 2026-05-15/datadog-security-labs-analyzes-leaked-teampcp-shai-hulud-off
    surface: "section 2026-10-21T20:34:33Z"
    kind: cited
    text: "The published repository's README reads \"Love - TeamPCP\" and \"Change keys and C2 as needed\", its commits are authored as TeamPCP_OSS, and GitHub removed the repository shortly after publication, though not before it was forked, so the code remains available to other actors ("
    urls: ["https://securitylabs.datadoghq.com/articles/shai-hulud-open-source-framework-static-analysis/"]
  - claim_id: b6f4260ec7
    entry: 2026-05-15/datadog-security-labs-analyzes-leaked-teampcp-shai-hulud-off
    surface: "section 2026-10-21T20:34:33Z"
    kind: cited
    text: "The framework harvests credentials where it already runs, reads Runner.Worker memory, poisons repository branches and npm packages with stolen tokens, and uses a workflow's own OIDC token only inside a release workflow and for a package it was hardcoded to target, so that path was manually targeted while the token-driven spread is opportunistic ("
    urls: ["https://securitylabs.datadoghq.com/articles/shai-hulud-open-source-framework-static-analysis/"]
  - claim_id: 8dd4795f77
    entry: 2026-05-15/datadog-security-labs-analyzes-leaked-teampcp-shai-hulud-off
    surface: "section 2026-10-21T20:34:33Z"
    kind: cited
    text: "The analysis also documents what defenders need for a compromise check: an exit on Russian-locale systems, a daemon that deletes the home directory when a stolen GitHub token is revoked and must be disabled before rotation, and the hook files, commits and npm releases it leaves behind ("
    urls: ["https://securitylabs.datadoghq.com/articles/shai-hulud-open-source-framework-static-analysis/"]
  - claim_id: 4afea70592
    entry: 2026-05-15/datadog-security-labs-analyzes-leaked-teampcp-shai-hulud-off
    surface: "section 2026-10-21T20:34:33Z"
    kind: uncited
    text: "Datadog's analysis describes no pull-request exploitation, `pull_request_target` targeting or expression-injection capability in the code."
  - claim_id: 5fe0f46e7b
    entry: 2026-05-15/datadog-security-labs-analyzes-leaked-teampcp-shai-hulud-off
    surface: "record 2026-10-21T20:34:33Z"
    kind: record-summary
    text: "The repository that published the Shai-Hulud framework source is signed \"Love - TeamPCP\", and GitHub removed it after it had been forked. Datadog's analysis finds no pull_request_target or expression-injection exploitation in the code: the framework harvests credentials where it already runs, reads Runner.Worker memory, poisons repositories and npm packages with stolen tokens, and uses a workflow's OIDC token only in a release workflow it was hardcoded to target. Datadog's compromise checks include disabling the wipe-on-revocation daemon before rotating tokens."
