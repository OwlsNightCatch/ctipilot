    text: "**Defender takeaway:** on managed Android devices at API level 34 (Android 14) or later, a device owner or the owner of an organisation-owned managed profile can block 2G for the whole device with the DISALLOW_CELLULAR_2G restriction, and emergency calls still use 2G ("
