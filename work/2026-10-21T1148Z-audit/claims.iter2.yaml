  - claim_id: 947404aeed
    entry: 2026-05-11/sms-blaster-smishing-establishing-itself-in-switzerland-port
    surface: "record 2026-10-21T20:36:37Z"
    kind: record-summary
    text: "BACS had already reported SMS-blaster smishing in western Switzerland in September 2025, and Basel-Landschaft police arrested a suspect with a device in November 2025, so ebas.ch's May 2026 post is a later awareness note rather than the only Swiss source. On managed Android devices 2G is blocked with the DISALLOW_CELLULAR_2G restriction from API level 34, set by a device owner; the user-visible sign is the brief switch from 4G to 2G that BACS describes."
  - claim_id: 523d567327
    entry: 2026-05-12/ico-fines-south-staffordshire-water-963-900-water-sector-oes
    surface: "headline"
    kind: frontmatter
    text: "ICO fines South Staffordshire £963,900: a 20-month phishing foothold, ZeroLogon on two DCs and only 5% of IT monitored"
  - claim_id: 84d0ba6a60
    entry: 2026-05-12/ico-fines-south-staffordshire-water-963-900-water-sector-oes
    surface: "summary"
    kind: frontmatter
    text: "The UK ICO fined South Staffordshire Plc and South Staffordshire Water Plc £963,900 under UK GDPR on 2026-05-11 for an attack in which a phishing attachment opened in September 2020 gave an attacker a foothold that went undetected for 20 months, followed by domain-admin compromise from May 2022 with ZeroLogon (CVE-2020-1472) exploited on two unpatched domain controllers; the personal data of 633,887 people was published on the dark web. The ICO found that only 5% of the IT environment was monitored, Windows Server 2003 was still in use and no regular vulnerability scans were run."
  - claim_id: f73d3af28f
    entry: 2026-05-12/ico-fines-south-staffordshire-water-963-900-water-sector-oes
    surface: "cves[CVE-2020-1472]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2020-1472\", \"cvss\": \"5.5 (CVSS 3.1, MSRC's current record; its vector AV:L/PR:L disagrees with MSRC's own description of an unauthenticated network attack)\", \"status\": [\"exploited\", \"cisa-kev\", \"patch-available\"], \"affected\": \"Windows domain controllers without the August 2020 Netlogon security updates\", \"fixed\": \"August 2020 security updates, the first of Microsoft's two-phase rollout\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
