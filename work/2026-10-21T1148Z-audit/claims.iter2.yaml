    text: "Foxconn confirmed only that some North American factories suffered a cyberattack and were resuming production, without naming sites or confirming that customer data was taken; the Mount Pleasant timeline comes from workers, Houston from AppleInsider, and the state list from The Record's description of where Foxconn has factories. Coveware's finding is that a bug in one Nitrogen ESXi encryptor leaves files unrecoverable even for the attackers, so recovery depends on checking encrypted files against the specific sample, not on the claim that paying never restores VMs."
