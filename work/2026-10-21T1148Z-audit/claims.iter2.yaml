    text: "F5's quarterly security notification of 2026-05-13 fixes CVE-2026-41225 in BIG-IP iControl REST, where an authenticated attacker with at least the Manager role and network access to the management port or self IP addresses can create configuration objects that run arbitrary commands, escalating privileges or bypassing Appliance mode. F5 scores it CVSS 4.0 8.6 and calls it a control-plane issue only; fixed versions are 21.0.0.2, 17.5.1.6 and 17.1.3.2, the 16.1 branch is past end of technical support, and no exploitation was reported as of 2026-05-14."
