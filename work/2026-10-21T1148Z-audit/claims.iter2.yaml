    entry: 2026-05-21/sonicwall-gen6-ssl-vpn-incomplete-patching-cve-2024-12802-ak
    surface: "body"
    kind: cited
    text: "**Exposure:** SonicWall Gen6 firewalls and NSv appliances running SSL-VPN with LDAP authentication against Active Directory where the LDAP configuration used userPrincipalName, even on the fixed firmware, until all six remediation steps are done; affected builds are firmware version 6.5.4.15-117n and older and NSv firmware version 6.5.4.4-44v-21-2457 and older ("
    urls: ["https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2025-0001", "https://www.bleepingcomputer.com/news/security/hackers-bypass-sonicwall-vpn-mfa-due-to-incomplete-patching/"]
