    kind: cited
    text: "A US federal grand jury had indicted him on 2026-01-13 on six counts of international concealment money laundering and six counts of concealment money laundering, each carrying up to 20 years, and Germany has charged him with several counts of concealment money laundering, each punishable by up to five years ("
    urls: ["https://www.dea.gov/press-releases/2026/05/13/german-citizen-charged-laundering-funds-linked-prominent-darknet"]
