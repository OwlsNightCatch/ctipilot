    kind: cited
    text: "**Defender takeaway:** update SzafirHost to version 1.2.1 or later on every workstation that signs with Szafir certificates ("
    urls: ["https://cert.pl/en/posts/2026/05/CVE-2026-44088/"]
  - claim_id: 3cb99f455f
    entry: 2026-05-17/cert-pl-cve-2026-44088-szafirhost-jar-zip-polyglot-bypass-in
    surface: "body"
    kind: cited
    text: "Swiss bodies are not drawn in through signature recognition: without a mutual recognition agreement between Switzerland and the EU, a foreign qualified signature is not equivalent to a qualified signature under Swiss law ("
