    text: "{\"id\": \"CVE-2025-54518\", \"cvss\": \"7.3\", \"status\": [\"patch-available\"], \"affected\": \"Zen 2-based AMD processors (EPYC 7002, EPYC Embedded 7002, Ryzen 3000, 4000, 5000, 7020 and 7030, Threadripper PRO 3000 WX, Ryzen Embedded V2000); all Xen versions\", \"fixed\": \"OS updates for EPYC 7002 and EPYC Embedded 7002 (Windows builds from May 2026); OEM BIOS updates with the PI versions in AMD-SB-7052 for Ryzen, Threadripper PRO and Ryzen Embedded; Xen XSA-490 patches\", \"auth\": \"post-auth\", \"vector\": \"local\"}"
