  - claim_id: 5eaaa8902e
    entry: 2026-05-16/unit-42-gremlin-stealer-evolved-with-net-resource-xor-obfusc
    surface: "summary"
    kind: frontmatter
    text: "Unit 42 reported on 2026-05-15 a Gremlin stealer variant that moves its payload into an XOR-encoded .NET resource section, decrypts functions only when needed and, in one sample, sits under a commercial packer with instruction virtualization. New modules steal Discord tokens, swap copied cryptocurrency wallet addresses for the attacker's in real time and hijack live Chromium-based browser sessions over WebSocket; stolen data leaves as a ZIP uploaded to an attacker-controlled web panel, with the Telegram Bot API as an alternative channel."
  - claim_id: e8b1934dc8
    entry: 2026-05-16/unit-42-gremlin-stealer-evolved-with-net-resource-xor-obfusc
    surface: "body"
    kind: cited
    text: "Unit 42 identified a new Gremlin stealer variant that bundles stolen browser cookies, session tokens, clipboard contents, cryptocurrency wallet data and FTP and VPN credentials into a ZIP archive named with the victim's public IP address and uploads it to an attacker-controlled site, while exfiltration through private web panels or the Telegram Bot API stays as in earlier builds ("
    urls: ["https://unit42.paloaltonetworks.com/gremlin-stealer-evolution/"]
  - claim_id: 41e42c8847
    entry: 2026-05-16/unit-42-gremlin-stealer-evolved-with-net-resource-xor-obfusc
    surface: "body"
    kind: cited
    text: "The variant moves its payload into the .NET resource section masked with single-byte XOR encoding, decrypts and maps each critical function into memory only when needed, and hides its strings behind a runtime decoder that reads them from an embedded encrypted resource; one sample is wrapped in a commercial packer that turns the code into custom bytecode run by a private virtual machine ("
    urls: ["https://unit42.paloaltonetworks.com/gremlin-stealer-evolution/"]
