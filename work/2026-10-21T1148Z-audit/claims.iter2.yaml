    text: "ESET reported on 2026-05-14 new activity since March 2026 by FrostyNeighbor (Ghostwriter, UNC1151), a cyberespionage group apparently aligned with Belarus, against governmental organisations in Ukraine: spearphishing PDFs impersonating Ukrtelecom link to a server that returns a benign PDF outside Ukraine and a RAR archive with a JavaScript dropper to Ukrainian IP addresses. The JavaScript PicassoLoader it installs reports a host fingerprint every 10 minutes, and the operators very likely decide manually whether to send a dropper that runs a Cobalt Strike beacon through a renamed copy of rundll32 with Run-key persistence."
