    kind: cited
    text: "**Detection:** in egress telemetry, a ZIP archive named after the host's public IP address uploaded to an unfamiliar web panel, and Telegram Bot API traffic from a process that is not a messaging client; in endpoint telemetry, a process requesting session data from a running Chromium browser process, and a process that rewrites clipboard contents matching wallet-address patterns ("
    urls: ["https://unit42.paloaltonetworks.com/gremlin-stealer-evolution/"]
