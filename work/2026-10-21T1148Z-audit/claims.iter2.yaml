    urls: ["https://www.bleepingcomputer.com/news/linux/exploit-released-for-new-pintheft-arch-linux-root-escalation-flaw/"]
  - claim_id: 451245f2b3
    entry: 2026-05-21/pintheft-linux-kernel-local-privilege-escalation-primitive-r
    surface: "body"
    kind: cited
    text: "**Detection:** process and syscall telemetry: an unprivileged process that opens RDS sockets, registers an io_uring fixed buffer and issues a burst of failing RDS zerocopy sends, then executes a SUID-root binary that yields a root shell, is the exploit's sequence ("
    urls: ["https://www.openwall.com/lists/oss-security/2026/05/19/6"]
  - claim_id: 1d967a5bac
    entry: 2026-05-21/pintheft-linux-kernel-local-privilege-escalation-primitive-r
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** install the fixed kernel; where that cannot happen at once, unload `rds_tcp` and `rds` and block both from loading through modprobe configuration, the mitigation BleepingComputer gives ("
    urls: ["https://www.bleepingcomputer.com/news/linux/exploit-released-for-new-pintheft-arch-linux-root-escalation-flaw/"]
