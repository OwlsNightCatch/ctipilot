  - claim_id: c198b7423c
    entry: 2026-05-18/tycoon2fa-after-the-march-2026-takedown-oauth-device-authori
    surface: "summary"
    kind: frontmatter
    text: "eSentire reported on 2026-05-12 a late-April 2026 campaign in which Tycoon 2FA operators, still active after the March 2026 takedown, added an OAuth device-code variant alongside their credential-relay kit: an invoice lure with a Trustifi click-tracking link leads through Cloudflare Workers and encrypted JavaScript layers to a fake Microsoft CAPTCHA and a voicemail page showing a device code the operator's backend obtained. The victim pastes it at microsoft.com/devicelogin, signs in and approves MFA on genuine Microsoft infrastructure, and Microsoft issues Microsoft Authentication Broker tokens to the operator's polling client; eSentire's hunts look for device-code sign-ins and Node.js user agents in Entra ID logs."
  - claim_id: 83a987b225
    entry: 2026-05-18/tycoon2fa-after-the-march-2026-takedown-oauth-device-authori
    surface: "body"
    kind: cited
    text: "eSentire's Threat Response Unit analyzed in late April 2026 a campaign by operators of the Tycoon 2FA phishing-as-a-service kit, which kept running after the March 2026 takedown led by Microsoft and Europol, that keeps the kit's in-browser tradecraft but ends in Microsoft's legitimate device-login flow instead of a credential-relay proxy ("
    urls: ["https://www.esentire.com/blog/tycoon-2fa-operators-adopt-oauth-device-code-phishing"]
  - claim_id: 4ac1f42a0c
    entry: 2026-05-18/tycoon2fa-after-the-march-2026-takedown-oauth-device-authori
    surface: "body"
    kind: cited
    text: "The device-code variant runs beside the relay kit: eSentire still names the OfficeHome AppId as the primary marker of the credential-relay variant and treats the two AppIds as one detection set ("
    urls: ["https://www.esentire.com/blog/tycoon-2fa-operators-adopt-oauth-device-code-phishing"]
