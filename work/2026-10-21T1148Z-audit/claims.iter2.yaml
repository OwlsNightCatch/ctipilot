    text: "Broadcom's Symantec and Carbon Black teams reported on 2026-05-16 that fast16, the circa-2005 sabotage framework SentinelOne first analyzed in April 2026, hooks LS-DYNA and AUTODYN through a boot-start filesystem driver and scales down simulation outputs only in high-explosive runs once the simulated material passes 30 g/cm³, a density uranium reaches only in an implosion device. It spreads only inside its own network and avoids hosts with endpoint-security products; Kim Zetter argues that, if it targeted Iran, it was contemporaneous with Stuxnet rather than a predecessor, while Broadcom still calls it pre-Stuxnet."
