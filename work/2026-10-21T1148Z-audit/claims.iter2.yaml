  - claim_id: 76242ea4f3
    entry: 2026-05-19/bigbluebutton-bbb-web-3-0-21-3-0-23-three-flaws-in-eu-educat
    surface: "headline"
    kind: frontmatter
    text: "BigBlueButton fixes predictable session tokens, an API checksum bypass and an SSRF in bbb-web (3.0.21, 3.0.23)"
  - claim_id: 4fbfcf8743
    entry: 2026-05-19/bigbluebutton-bbb-web-3-0-21-3-0-23-three-flaws-in-eu-educat
    surface: "summary"
    kind: frontmatter
    text: "BigBlueButton published three advisories for bbb-web on 2026-05-13: before 3.0.21 a session user could predict other users' conference session tokens and impersonate them (CVE-2026-46351, CVSS 8.1), and a presentationUploadExternalUrl parameter let any user send valid requests to some API endpoints without a checksum (CVE-2026-46353, 8.1); before 3.0.23 presentation URL validation did not keep requests away from site-local and link-local addresses (CVE-2026-46404, 6.8, high privileges). Germany's BSI summarizes the set as letting a remote, authenticated attacker bypass security measures and disclose confidential information; no source reports exploitation."
  - claim_id: 259624a59f
