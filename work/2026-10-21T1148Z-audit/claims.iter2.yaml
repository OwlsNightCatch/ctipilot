  - claim_id: c155ab5fa7
    entry: 2026-05-13/certfr-2026-avi-0564-spip-4-4-14-multiple-rces-public-and-pr
    surface: "summary"
    kind: frontmatter
    text: "SPIP 4.4.14, released on 2026-05-12 and flagged by CERT-FR in CERTFR-2026-AVI-0564, fixes two remote code execution flaws, one in the private area and one in the public area that is limited to certain nginx configurations. SPIP's security screen does not cover them, so only the upgrade protects; neither source publishes CVE identifiers or reports exploitation as of 2026-05-12."
  - claim_id: fd901bf23a
    entry: 2026-05-13/certfr-2026-avi-0564-spip-4-4-14-multiple-rces-public-and-pr
    surface: "body"
    kind: cited
    text: "SPIP's maintenance team released SPIP 4.4.14 on 2026-05-12 to fix two security flaws, a remote code execution (RCE) flaw in the private area and an RCE flaw in the public area that is limited to the use of certain nginx configurations, reported by Louka Jacques-Chevallier (Laluka), Baptiste Rolando, Arthur Deloffre (Vozec), jvoisin and Cezame ("
    urls: ["https://blog.spip.net/Mise-a-jour-de-securite-sortie-de-SPIP-4-4-14.html"]
