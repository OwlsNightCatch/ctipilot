    kind: cited
    text: "**Triage:** a device-code sign-in alone can be a legitimate command-line tool or input-constrained device; eSentire's discriminators are a source with no prior device-code activity and Node.js user agents against the Broker AppId in non-interactive sign-ins, which it calls highly anomalous in production environments ("
    urls: ["https://www.esentire.com/blog/tycoon-2fa-operators-adopt-oauth-device-code-phishing"]
