  - claim_id: dfa882d592
    entry: 2026-05-19/interpol-operation-ramz-13-country-mena-cybercrime-sweep-201
    surface: "summary"
    kind: frontmatter
    text: "INTERPOL announced on 2026-05-18 the results of Operation Ramz (October 2025 to 2026-02-28), in which 13 Middle East and North African countries went after phishing, malware and cyber scams: 201 arrests, 382 further suspects and 3,867 victims identified, and 53 servers seized. Highlights include a phishing-as-a-service website dismantled in Algeria with one arrest, phishing software and banking data seized in Morocco, compromised devices found spreading malicious threats in Qatar, and in Jordan a fake trading-platform scam run by 15 trafficking victims from Asia, whose two suspected organizers were arrested."
  - claim_id: 9a1ab9af1a
    entry: 2026-05-19/interpol-operation-ramz-13-country-mena-cybercrime-sweep-201
