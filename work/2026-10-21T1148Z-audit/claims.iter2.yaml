    urls: ["https://www.srf.ch/news/schweiz/seltener-fahndungserfolg-baselbieter-polizei-schnappt-mutmasslichen-sms-betrueger"]
  - claim_id: ce8bbc7ba8
    entry: 2026-05-11/sms-blaster-smishing-establishing-itself-in-switzerland-port
    surface: "body"
    kind: cited
    text: "On 2026-05-07 the awareness portal ebas.ch warned that the scam is establishing itself in Switzerland, with texts posing as authorities, banks or courier services that link to fake websites collecting credit card data or e-banking credentials and are adapted to the location, such as a parking fine where many cars are parked ("
    urls: ["https://www.ebas.ch/en/2026/05/sms-blaster-new-scam-reaches-switzerland/"]
  - claim_id: bf6ee1d428
    entry: 2026-05-11/sms-blaster-smishing-establishing-itself-in-switzerland-port
    surface: "body"
    kind: cited
    text: "**Exposure:** any phone in range that still connects to 2G, which includes many modern smartphones; only SMS is affected, not services such as WhatsApp, Signal or Telegram ("
    urls: ["https://www.ebas.ch/en/2026/05/sms-blaster-new-scam-reaches-switzerland/"]
