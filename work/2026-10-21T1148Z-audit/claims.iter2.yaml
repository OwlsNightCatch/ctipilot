    entry: 2026-05-18/tycoon2fa-after-the-march-2026-takedown-oauth-device-authori
    surface: "body"
    kind: cited
    text: "The decrypted controller blanks the page for headless browsers and Burp, suppresses developer-tool shortcuts, redirects to microsoft.com when a debugger timing trap fires, checks the visitor's network owner against 230 cloud, sandbox, security-vendor, VPN and AI-crawler names, and stops rendering after a hardcoded expiry date ("
    urls: ["https://www.esentire.com/blog/tycoon-2fa-operators-adopt-oauth-device-code-phishing"]
  - claim_id: 1879fc11a4
    entry: 2026-05-18/tycoon2fa-after-the-march-2026-takedown-oauth-device-authori
    surface: "body"
    kind: cited
    text: "A Microsoft-branded fake CAPTCHA then queries a Tycoon 2FA Check Domain, which serves suspected analysts a benign decoy website and real victims a Microsoft 365 voicemail lure ("
    urls: ["https://www.esentire.com/blog/tycoon-2fa-operators-adopt-oauth-device-code-phishing"]
