    entry: 2026-05-21/pintheft-linux-kernel-local-privilege-escalation-primitive-r
    surface: "headline"
    kind: frontmatter
    text: "PinTheft gives a local user root through an RDS zerocopy double-free, wherever the RDS kernel module is loaded"
  - claim_id: 255e4bc5ed
    entry: 2026-05-21/pintheft-linux-kernel-local-privilege-escalation-primitive-r
    surface: "summary"
    kind: frontmatter
    text: "V12 Security released PinTheft and a working exploit on 2026-05-19, relayed to oss-security by Gentoo's Sam James: a double-free in the Linux kernel's RDS zerocopy send path, rds_message_zcopy_from_user(), that the exploit turns into a page-cache overwrite of a SUID-root binary through io_uring fixed buffers for a root shell. The bug was patched upstream earlier in May and the kernel fix was published as CVE-2026-43494 (CVSS 7.8) on 2026-05-21; exploitation needs the RDS modules, which V12 found loaded by default only on Arch Linux among common distributions."
  - claim_id: 6ddb7fd112
    entry: 2026-05-21/pintheft-linux-kernel-local-privilege-escalation-primitive-r
    surface: "cves[CVE-2026-43494]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-43494\", \"cvss\": \"7.8\", \"status\": [\"poc-public\", \"patch-available\"], \"affected\": \"Linux kernel RDS zerocopy send path before the upstream fix of May 2026\", \"fixed\": \"upstream fix net/rds: reset op_nents when zerocopy page pin fails\", \"auth\": \"post-auth\", \"vector\": \"local\"}"
  - claim_id: 796e298913
    entry: 2026-05-21/pintheft-linux-kernel-local-privilege-escalation-primitive-r
    surface: "body"
    kind: cited
    text: "V12 Security released PinTheft with a proof-of-concept exploit on 2026-05-19, and Gentoo's Sam James relayed it to the oss-security list the same day; Aaron Esau of the V12 team found the bug ("
    urls: ["https://www.openwall.com/lists/oss-security/2026/05/19/6"]
  - claim_id: 73b32e1b25
    entry: 2026-05-21/pintheft-linux-kernel-local-privilege-escalation-primitive-r
    surface: "body"
    kind: cited
    text: "In the RDS zerocopy send path, `rds_message_zcopy_from_user()` pins user pages one at a time; when a later page faults, the error path drops the pages already pinned while the scatterlist entries stay live, so message cleanup drops them again and each failed send steals a reference from the first page ("
    urls: ["https://www.openwall.com/lists/oss-security/2026/05/19/6"]
  - claim_id: 63c4628ff2
    entry: 2026-05-21/pintheft-linux-kernel-local-privilege-escalation-primitive-r
    surface: "body"
    kind: cited
    text: "The exploit registers an anonymous page as an `io_uring` fixed buffer, which gives it a FOLL_PIN bias of 1024 references, steals those references with failing RDS zerocopy sends, lets the page be reclaimed as page cache of a SUID-root binary and overwrites it through the stale fixed-buffer pointer with a small ELF payload, so running the binary drops into a root shell ("
    urls: ["https://www.openwall.com/lists/oss-security/2026/05/19/6"]
  - claim_id: b6122ec8f0
    entry: 2026-05-21/pintheft-linux-kernel-local-privilege-escalation-primitive-r
    surface: "body"
    kind: cited
    text: "It needs the RDS modules, io_uring enabled, a readable SUID-root binary and x86_64 for the included payload ("
    urls: ["https://www.bleepingcomputer.com/news/linux/exploit-released-for-new-pintheft-arch-linux-root-escalation-flaw/"]
  - claim_id: 399275a5f5
    entry: 2026-05-21/pintheft-linux-kernel-local-privilege-escalation-primitive-r
    surface: "body"
    kind: cited
    text: "The bug was patched upstream earlier in May ("
    urls: ["https://www.bleepingcomputer.com/news/linux/exploit-released-for-new-pintheft-arch-linux-root-escalation-flaw/"]
  - claim_id: 3c11e4e438
    entry: 2026-05-21/pintheft-linux-kernel-local-privilege-escalation-primitive-r
    surface: "body"
    kind: cited
    text: "), and the kernel CNA published that fix, which resets `op_nents` in `rds_message_zcopy_from_user()`, as CVE-2026-43494 (CVSS 7.8) on 2026-05-21 ("
    urls: ["https://euvd.enisa.europa.eu/vulnerability/EUVD-2026-31267"]
