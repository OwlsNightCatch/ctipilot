    text: "Lumen and PwC detail Showboat, a Linux implant that hides and proxies inside telcos, and Red Lamassu's JFMBackdoor"
  - claim_id: c1674cb449
    entry: 2026-05-22/calypso-red-lamassu-bronze-medley-deploys-showboat-linux-and
    surface: "summary"
    kind: frontmatter
    text: "Lumen's Black Lotus Labs (2026-05-20) and PwC Threat Intelligence (2026-05-21) documented Showboat, a modular Linux post-exploitation framework that PwC calls kworker, which spawns shells, moves files, hides its own process and acts as a SOCKS5 proxy, and JFMBackdoor, a Windows backdoor delivered by DLL side-loading. Lumen confirms an Afghanistan-based ISP and an entity in Azerbaijan as victims and ties Showboat to at least one and likely several PRC-aligned clusters; PwC attributes the JFMBackdoor operation to Red Lamassu (Calypso), which it has tracked since 2019 against telecom providers in Asia."
