  - claim_id: 69bda92656
    entry: 2026-05-16/bka-arrests-dream-market-lead-administrator-speedstepper-in
    surface: "summary"
    kind: frontmatter
    text: "Owe Martin Andresen, 49, whom a US indictment accuses of being the main administrator of the Dream Market darknet marketplace that shut down in 2019, was arrested on German money-laundering charges on 2026-05-07 in a coordinated German and US operation announced on 2026-05-13. US prosecutors allege he moved the marketplace's dormant commission wallets into new consolidated wallets in late 2022 and laundered over $2 million between August 2023 and April 2025, partly by buying gold bars shipped to his home in Germany."
