    entry: 2026-05-20/storm-2949-sspr-to-key-vault-azure-kill-chain
    surface: "headline"
    kind: frontmatter
    text: "Storm-2949 hijacked privileged Entra ID accounts through SSPR abuse, then mined Azure management features for data"
  - claim_id: a91554c2d7
    entry: 2026-05-20/storm-2949-sspr-to-key-vault-azure-kill-chain
    surface: "summary"
    kind: frontmatter
    text: "Microsoft Threat Intelligence reported on 2026-05-18 that Storm-2949 abused Microsoft's Self-Service Password Reset to take over four privileged Entra ID accounts at one organization, re-enrolled MFA on its own devices, and used their Azure RBAC roles to pull App Service publishing profiles, Key Vault secrets, SQL and Storage data and VM access through Run Command and VMAccess. The actor relied mostly on legitimate cloud management features, installed ScreenConnect on VMs, aimed at mass data exfiltration and, per Microsoft, did not extort and shows no link to ShinyHunters."
  - claim_id: d895504e38
    entry: 2026-05-20/storm-2949-sspr-to-key-vault-azure-kill-chain
    surface: "body"
    kind: cited
    text: "Microsoft Threat Intelligence published its account of an intrusion by Storm-2949 on 2026-05-18: a campaign whose singular focus was to exfiltrate as much sensitive data as possible from one target organization's high-value assets, across Microsoft 365, file hosting and the Azure production environment ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/05/18/storm-2949-turned-compromised-identity-into-cloud-wide-breach/"]
  - claim_id: 476b4a9af3
    entry: 2026-05-20/storm-2949-sspr-to-key-vault-azure-kill-chain
    surface: "body"
    kind: cited
    text: "The actor did not rely on traditional malware but on legitimate cloud and Azure management features that blend into administrative behavior ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/05/18/storm-2949-turned-compromised-identity-into-cloud-wide-breach/"]
  - claim_id: a3fc091656
    entry: 2026-05-20/storm-2949-sspr-to-key-vault-azure-kill-chain
    surface: "body"
    kind: cited
    text: "Storm is Microsoft's temporary designation for activity not yet classified, and Microsoft saw no follow-on extortion and no link to ShinyHunters ("
    urls: ["https://www.bleepingcomputer.com/news/security/microsoft-self-service-password-reset-abused-in-azure-data-theft-attacks/"]
  - claim_id: 10e0541729
    entry: 2026-05-20/storm-2949-sspr-to-key-vault-azure-kill-chain
    surface: "body"
    kind: cited
    text: "Microsoft assesses with high confidence that Storm-2949 abused Self-Service Password Reset (SSPR): the actor starts a reset on a targeted user's behalf and persuades the user to approve the resulting MFA prompts, likely through an organized and convincing phishing scheme, for example by posing as IT support ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/05/18/storm-2949-turned-compromised-identity-into-cloud-wide-breach/"]
  - claim_id: 6a5942587d
    entry: 2026-05-20/storm-2949-sspr-to-key-vault-azure-kill-chain
    surface: "body"
    kind: cited
    text: "It then reset the password, removed the user's phone, e-mail and Authenticator methods and enrolled Microsoft Authenticator on its own device, locking the user out; the victims included IT personnel and senior leadership, and the actor repeated the process until it held four accounts ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/05/18/storm-2949-turned-compromised-identity-into-cloud-wide-breach/"]
  - claim_id: 9804c91c8e
    entry: 2026-05-20/storm-2949-sspr-to-key-vault-azure-kill-chain
    surface: "body"
    kind: cited
    text: "A custom Python script enumerated users and applications through Microsoft Graph to find privileged identities, and an attempt to add credentials to a service principal failed for lack of permissions ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/05/18/storm-2949-turned-compromised-identity-into-cloud-wide-breach/"]
  - claim_id: 502195de4e
    entry: 2026-05-20/storm-2949-sspr-to-key-vault-azure-kill-chain
    surface: "body"
    kind: cited
    text: "The actor searched OneDrive and SharePoint for VPN configuration and remote-access documents and in one instance downloaded thousands of files from the OneDrive web interface in a single action ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/05/18/storm-2949-turned-compromised-identity-into-cloud-wide-breach/"]
  - claim_id: e97b780a3c
    entry: 2026-05-20/storm-2949-sspr-to-key-vault-azure-kill-chain
    surface: "body"
    kind: cited
    text: "With privileged custom RBAC roles on several subscriptions, the actor called `microsoft.Web/sites/publishxml/action` to retrieve the publishing profiles of secondary App Service apps, which often hold FTP, Web Deploy and Kudu credentials; with an Owner role over one Key Vault it changed the vault's access configuration and read dozens of secrets within four minutes; Microsoft believes they held the credentials the actor then used to take over the primary production web app and change its password ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/05/18/storm-2949-turned-compromised-identity-into-cloud-wide-breach/"]
  - claim_id: 1c23701d3b
    entry: 2026-05-20/storm-2949-sspr-to-key-vault-azure-kill-chain
    surface: "body"
    kind: cited
    text: "It opened SQL server firewall rules with `microsoft.sql/servers/firewallrules/write` and deleted them after taking data, opened storage account network access to its own addresses with `microsoft.storage/storageaccounts/write`, and retrieved account keys and SAS tokens with `microsoft.Storage/storageAccounts/listkeys/action` to download blobs over several days with an Azure SDK script ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/05/18/storm-2949-turned-compromised-identity-into-cloud-wide-breach/"]
  - claim_id: 537abe0fc8
    entry: 2026-05-20/storm-2949-sspr-to-key-vault-azure-kill-chain
    surface: "body"
    kind: cited
    text: "Through the VMAccess extension the actor created a local administrator on a VM, and through Run Command it tried to use the VM's managed-identity token from the Instance Metadata Service against Key Vault, which failed on permissions ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/05/18/storm-2949-turned-compromised-identity-into-cloud-wide-breach/"]
  - claim_id: c423c3c0ee
    entry: 2026-05-20/storm-2949-sspr-to-key-vault-azure-kill-chain
    surface: "body"
    kind: cited
    text: "A Run Command PowerShell script then attempted to weaken Defender Antivirus by disabling several protections, installed ScreenConnect from actor infrastructure under names resembling Windows components, and attempted to clear event logs, command history and temporary files; over ScreenConnect the actor ran host and domain discovery, exfiltrated .pfx certificate files and scanned file shares for password strings ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/05/18/storm-2949-turned-compromised-identity-into-cloud-wide-breach/"]
  - claim_id: 580b5ebf20
    entry: 2026-05-20/storm-2949-sspr-to-key-vault-azure-kill-chain
    surface: "body"
    kind: cited
    text: "**Exposure:** Entra ID tenants where users with privileged Azure RBAC roles over Key Vault, App Service, SQL, Storage or VMs can reset their password through SSPR; Microsoft names no sector, country or victim ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/05/18/storm-2949-turned-compromised-identity-into-cloud-wide-breach/"]
  - claim_id: f8af4fd917
    entry: 2026-05-20/storm-2949-sspr-to-key-vault-azure-kill-chain
    surface: "body"
    kind: cited
    text: "**Detection:** identity audit logs first: Entra ID records reset and registration activity in the Self-Service Password Management audit category, and combined security-information registration events, such as a new Authenticator registration, under Security > Authentication Methods ("
    urls: ["https://learn.microsoft.com/en-us/entra/identity/authentication/howto-sspr-reporting"]
  - claim_id: 8c29053ff9
    entry: 2026-05-20/storm-2949-sspr-to-key-vault-azure-kill-chain
    surface: "body"
    kind: cited
    text: "); the pattern here is a reset followed by removal of every existing method and a new Authenticator registration ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/05/18/storm-2949-turned-compromised-identity-into-cloud-wide-breach/"]
  - claim_id: d35231d12d
    entry: 2026-05-20/storm-2949-sspr-to-key-vault-azure-kill-chain
    surface: "body"
    kind: cited
    text: "Then the Azure activity log for the operations above from one principal (publishing-profile retrieval, Key Vault access changes, SQL firewall and storage network rule writes, key listing, VMAccess and Run Command), and on VMs the disabling of Defender protections, a new remote-access service and cleared event logs ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/05/18/storm-2949-turned-compromised-identity-into-cloud-wide-breach/"]
  - claim_id: 232e57c2b0
    entry: 2026-05-20/storm-2949-sspr-to-key-vault-azure-kill-chain
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** require phishing-resistant MFA for administrators and privileged users and make sure every privileged user already has a registered MFA method, which blocks the malicious registration step; limit publishing-profile access, Run Command and VMAccess through RBAC, and prefer Azure RBAC over Key Vault access policies ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/05/18/storm-2949-turned-compromised-identity-into-cloud-wide-breach/"]
  - claim_id: 6bf97a1236
    entry: 2026-05-20/storm-2949-sspr-to-key-vault-azure-kill-chain
    surface: "body"
    kind: derived
    text: "Evicting the accounts is not enough: the actor's Authenticator registrations, the web app password it changed, the Key Vault secrets it read and the storage keys it listed all stay usable until they are removed or rotated."
