    entry: 2026-05-15/cve-2026-45793-php-composer-github-actions-ci-token-disclosu
    surface: "headline"
    kind: frontmatter
    text: "Composer printed GitHub Actions tokens into CI logs once GitHub's new token format arrived; fixed in 2.9.8 and 2.2.28"
  - claim_id: 4f330a00aa
    entry: 2026-05-15/cve-2026-45793-php-composer-github-actions-ci-token-disclosu
    surface: "summary"
    kind: frontmatter
    text: "Composer before 2.9.8, 2.2.28 and 1.10.28 printed the full GitHub token to stderr, and so into GitHub Actions job logs, whenever a GitHub App installation token in GitHub's new hyphenated format, including a workflow's auto-injected GITHUB_TOKEN, failed its character validation (CVE-2026-45793, High 7.5). Hosted-runner tokens usually expired with the failing job, but self-hosted runner tokens stay valid for up to 24 hours and App tokens for up to an hour; GitHub rolled back the format change on 2026-05-13 and planned to restart it on 2026-05-18."
  - claim_id: 9c3df98a69
    entry: 2026-05-15/cve-2026-45793-php-composer-github-actions-ci-token-disclosu
    surface: "cves[CVE-2026-45793]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-45793\", \"cvss\": \"7.5\", \"status\": [\"patch-available\"], \"affected\": \">= 2.3.0 < 2.9.8; >= 2.0.0 < 2.2.28; >= 1.0 < 1.10.28\", \"fixed\": \"2.9.8, 2.2.28, 1.10.28\", \"auth\": \"default-config\", \"vector\": \"zero-click\"}"
  - claim_id: 673dcc92d0
    entry: 2026-05-15/cve-2026-45793-php-composer-github-actions-ci-token-disclosu
    surface: "body"
    kind: cited
    text: "Composer validates configured GitHub tokens against an allowed character set in `Composer\\IO\\BaseIO::loadConfiguration()`; GitHub's new structured format for GitHub App installation tokens contains a hyphen, fails that check, and the resulting exception prints the full token to stderr, which CI captures in the job log, while GitHub Actions' secret masker may not redact it because the message is wrapped or framed ("
    urls: ["https://blog.packagist.com/composer-2-9-8-and-2-2-28-fix-github-actions-token-disclosure-in-error-messages/"]
  - claim_id: 33aa646dd6
    entry: 2026-05-15/cve-2026-45793-php-composer-github-actions-ci-token-disclosu
    surface: "body"
    kind: cited
    text: "Any workflow that configures a GitHub App installation token, including the auto-injected `GITHUB_TOKEN`, into Composer's auth and then runs any Composer command hits it, and actions such as `shivammathur/setup-php` register `GITHUB_TOKEN` automatically, so no unusual configuration is needed ("
    urls: ["https://blog.packagist.com/composer-2-9-8-and-2-2-28-fix-github-actions-token-disclosure-in-error-messages/"]
  - claim_id: f1e3b2e2e9
    entry: 2026-05-15/cve-2026-45793-php-composer-github-actions-ci-token-disclosu
    surface: "body"
    kind: cited
    text: "The advisory's header rates CVE-2026-45793 High 7.5 while its own text calls the severity medium, and it lists Composer from 2.3.0 before 2.9.8, from 2.0.0 before 2.2.28 and from 1.0 before 1.10.28 as affected, fixed in 2.9.8, 2.2.28 and 1.10.28 ("
    urls: ["https://github.com/composer/composer/security/advisories/GHSA-f9f8-rm49-7jv2"]
  - claim_id: fa24eeaf6c
    entry: 2026-05-15/cve-2026-45793-php-composer-github-actions-ci-token-disclosu
    surface: "body"
    kind: cited
    text: "CISA's Known Exploited Vulnerabilities catalogue did not list it as of 2026-10-21 ("
    urls: ["https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"]
  - claim_id: 6846717e48
    entry: 2026-05-15/cve-2026-45793-php-composer-github-actions-ci-token-disclosu
    surface: "body"
    kind: cited
    text: "The exposure window depends on the token: a hosted-runner `GITHUB_TOKEN` expires when the job ends or after six hours, and the error usually fails the job and expires it at once; on self-hosted runners it can stay valid for up to 24 hours after issuance; and tokens from `actions/create-github-app-token` or another GitHub App last up to an hour by default and can carry permissions broader than the workflow's own `permissions:` declaration ("
    urls: ["https://blog.packagist.com/composer-2-9-8-and-2-2-28-fix-github-actions-token-disclosure-in-error-messages/"]
  - claim_id: c57fed4a55
    entry: 2026-05-15/cve-2026-45793-php-composer-github-actions-ci-token-disclosu
    surface: "body"
    kind: cited
    text: "GitHub rolled back the token change on 2026-05-13 at 14:30 UTC and planned to restart the rollout on 2026-05-18 after 14:00 UTC ("
    urls: ["https://blog.packagist.com/composer-2-9-8-and-2-2-28-fix-github-actions-token-disclosure-in-error-messages/"]
  - claim_id: 892ba0b0b7
    entry: 2026-05-15/cve-2026-45793-php-composer-github-actions-ci-token-disclosu
    surface: "body"
    kind: cited
    text: "**Exposure:** GitHub Actions workflows that run Composer below 2.9.8, 2.2.28 or 1.10.28 with a `GITHUB_TOKEN` or GitHub App installation token in Composer's auth, on repositories that received the new token format; `setup-php` users who did not pin the Composer version were moved to a fixed release ("
    urls: ["https://blog.packagist.com/composer-2-9-8-and-2-2-28-fix-github-actions-token-disclosure-in-error-messages/"]
  - claim_id: d3aec6c72f
    entry: 2026-05-15/cve-2026-45793-php-composer-github-actions-ci-token-disclosu
    surface: "body"
    kind: cited
    text: "**Detection:** in CI job logs, the error line \"Your github oauth token for github.com contains invalid characters\" followed by the token itself; for each such log, check activity under that token within its validity window ("
    urls: ["https://blog.packagist.com/composer-2-9-8-and-2-2-28-fix-github-actions-token-disclosure-in-error-messages/"]
  - claim_id: c7aadb850f
    entry: 2026-05-15/cve-2026-45793-php-composer-github-actions-ci-token-disclosu
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** update Composer to 2.9.8 or 2.2.28, and where the error appears in a log, delete the log content holding the token and confirm no unexpected activity occurred under it, counting up to 24 hours for self-hosted runners and 6 hours for GitHub-hosted ones ("
    urls: ["https://blog.packagist.com/composer-2-9-8-and-2-2-28-fix-github-actions-token-disclosure-in-error-messages/"]
  - claim_id: 2f68937fcc
    entry: 2026-05-15/cve-2026-45793-php-composer-github-actions-ci-token-disclosu
    surface: "section 2026-10-21T20:33:27Z"
    kind: cited
    text: "The leak was not tied to package-resolution errors: GitHub's new format for GitHub App installation tokens contains a hyphen, fails Composer's character validation when its configuration loads, and the exception prints the full token to stderr, so any workflow with such a token in Composer's auth hit it on the default path, including the auto-injected `GITHUB_TOKEN` ("
    urls: ["https://blog.packagist.com/composer-2-9-8-and-2-2-28-fix-github-actions-token-disclosure-in-error-messages/"]
  - claim_id: 68f78dbf2d
    entry: 2026-05-15/cve-2026-45793-php-composer-github-actions-ci-token-disclosu
    surface: "section 2026-10-21T20:33:27Z"
    kind: cited
    text: "Classic `ghp_` personal access tokens are not affected by the validation bug itself, though the advisory notes the same leak applies to any future credential that fails validation ("
    urls: ["https://github.com/composer/composer/security/advisories/GHSA-f9f8-rm49-7jv2"]
  - claim_id: 28c9223e43
    entry: 2026-05-15/cve-2026-45793-php-composer-github-actions-ci-token-disclosu
    surface: "section 2026-10-21T20:33:27Z"
    kind: cited
    text: "Packagist's relevant permission point is that App tokens can carry permissions broader than the workflow's own `permissions:` declaration, not that every `GITHUB_TOKEN` can write workflow files ("
    urls: ["https://blog.packagist.com/composer-2-9-8-and-2-2-28-fix-github-actions-token-disclosure-in-error-messages/"]
  - claim_id: 3ccb96f2d0
    entry: 2026-05-15/cve-2026-45793-php-composer-github-actions-ci-token-disclosu
    surface: "section 2026-10-21T20:33:27Z"
    kind: cited
    text: "The exposure was bounded: hosted-runner tokens usually expired with the failing job, self-hosted runner tokens stay valid for up to 24 hours and App tokens for up to an hour, and GitHub rolled the format change back on 2026-05-13 before planning a new rollout from 2026-05-18 ("
    urls: ["https://blog.packagist.com/composer-2-9-8-and-2-2-28-fix-github-actions-token-disclosure-in-error-messages/"]
  - claim_id: 84d7f0d8ad
    entry: 2026-05-15/cve-2026-45793-php-composer-github-actions-ci-token-disclosu
    surface: "section 2026-10-21T20:33:27Z"
    kind: cited
    text: "Neither the Packagist post nor the advisory mentions Mini Shai-Hulud or exploitation; the advisory rates the flaw High 7.5, fixed in 2.9.8, 2.2.28 and 1.10.28 ("
    urls: ["https://github.com/composer/composer/security/advisories/GHSA-f9f8-rm49-7jv2"]
  - claim_id: 5b22b7230a
    entry: 2026-05-15/cve-2026-45793-php-composer-github-actions-ci-token-disclosu
    surface: "record 2026-10-21T20:33:27Z"
    kind: record-summary
    text: "Composer's token leak was triggered on the default path by GitHub's new hyphenated installation-token format failing Composer's validation when it loaded its configuration, not by package-resolution errors, and it concerned GITHUB_TOKEN and GitHub App installation tokens rather than personal access tokens. Hosted-runner tokens usually expired with the failing job, self-hosted runner tokens stay valid for up to 24 hours and App tokens for up to an hour, and GitHub rolled the format change back on 2026-05-13. No source links the bug to Mini Shai-Hulud, and the advisory rates it High 7.5 with fixes in 2.9.8, 2.2.28 and 1.10.28."
