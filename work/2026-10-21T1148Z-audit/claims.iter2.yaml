    entry: 2026-05-17/cve-2026-41553-dhtmlx-pdf-export-module-unauthenticated-serv
    surface: "summary"
    kind: frontmatter
    text: "CERT Polska disclosed three DHTMLX flaws on 2026-05-15: CVE-2026-41553 lets an unauthenticated attacker inject JavaScript into the data parameter of the PDF Export Module used by DHTMLX Gantt and Scheduler, which Node.js then executes (CVSS 4.0 10.0), while CVE-2026-41552 in the same module and CVE-2026-7182 in Diagram's export module let crafted HTML pull local server files into the generated PDF (9.2 each). The PDF Export Module from 0.3.3 is fixed in 0.7.6 and Diagram from 1.0.0 in 1.1.1; no source reports exploitation."
