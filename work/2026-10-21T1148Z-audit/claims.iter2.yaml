    text: "SentinelOne's post of 2026-05-15 describes CI/CD subversion seen in 2025: attackers on a vulnerable self-hosted TeamCity server ran a backdoor-deploying build job and stayed undetected for over a year, a stolen GitLab service-account token planted Ansible playbooks the pipeline ran automatically, Contagious Interview lured developers into running malware, and Sha1-Hulud registered rogue self-hosted GitHub runners. It recommends alerting on runner registrations, pipeline changes by service accounts and suspicious process behavior on build runners."
