    surface: "body"
    kind: cited
    text: "On 2026-05-07, in a coordinated effort by German and US law enforcement, Owe Martin Andresen, 49, was arrested in Germany on German charges, and his residence and two other locations were searched ("
    urls: ["https://www.dea.gov/press-releases/2026/05/13/german-citizen-charged-laundering-funds-linked-prominent-darknet"]
