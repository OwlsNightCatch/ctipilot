    entry: 2026-05-14/dutch-igj-rules-clinical-diagnostics-nmdl-failed-nen-7510-in
    surface: "body"
    kind: cited
    text: "The Wabvpz requires organisations working with patient data to meet NEN 7510, and IGJ says working to the norm could have reduced the likelihood of an incident like this and limited its consequences ("
    urls: ["https://www.igj.nl/actueel/nieuws/2026/05/13/clinical-diagnostics-voldeed-niet-aan-wettelijke-norm-voor-informatiebeveiliging"]
