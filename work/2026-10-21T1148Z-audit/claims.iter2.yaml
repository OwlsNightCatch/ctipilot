    entry: 2026-05-13/mini-shai-hulud-s-github-actions-pwn-request-oidc-token-thef
    surface: "summary"
    kind: frontmatter
    text: "On 2026-05-11 between 19:20 and 19:26 UTC an attacker published 84 malicious versions of 42 @tanstack/* npm packages through TanStack's own release workflow by chaining a pull_request_target Pwn Request, GitHub Actions cache poisoning and extraction of the workflow's OIDC token from runner memory; no npm token was stolen (TanStack). The install-time payload steals cloud, GitHub, npm and SSH credentials, spreads to its victims' other packages and plants a service that wipes the home directory when the stolen token is revoked (StepSecurity, NCSC-CH). The compromise is CVE-2026-45321 (CVSS 9.6), in CISA's KEV catalog since 2026-05-27."
