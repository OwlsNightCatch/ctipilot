    text: "Google Threat Intelligence Group's AI Threat Tracker of 2026-05-11 reports the first zero-day exploit it believes was developed with AI: a Python 2FA bypass for a popular open-source web-based system administration tool that needs valid credentials, which criminals planned to use in mass exploitation before GTIG's coordinated disclosure may have prevented it. The report also documents LLM-generated decoy code in the Russia-nexus CANFAIL and LONGSTREAM malware, the Android backdoor PROMPTSPY driving devices through Gemini, PRC and DPRK actors using Gemini for vulnerability research, pooled LLM access, and TeamPCP's supply-chain compromises of AI components."
