    entry: 2026-05-19/cisa-contractor-nightwing-exposed-aws-govcloud-admin-keys-an
    surface: "headline"
    kind: frontmatter
    text: "CISA contractor's public GitHub repo exposed AWS GovCloud admin keys and plaintext passwords for internal systems"
  - claim_id: 8806b74d40
    entry: 2026-05-19/cisa-contractor-nightwing-exposed-aws-govcloud-admin-keys-an
    surface: "summary"
    kind: frontmatter
    text: "A Nightwing employee working for CISA kept a public GitHub repository named Private-CISA, created on 2025-11-13 and taken offline after GitGuardian, KrebsOnSecurity and Seralys raised it in mid-May 2026, that held cloud keys, tokens, plaintext passwords and files on how CISA builds software, including administrative credentials for three AWS GovCloud accounts and passwords for dozens of internal systems (Krebs on Security, 2026-05-18). The contractor had disabled GitHub's default block on publishing secrets, the AWS keys stayed valid for 48 hours after the takedown, and CISA said there was no indication that sensitive data was compromised."
  - claim_id: 2f0a0ccabc
    entry: 2026-05-19/cisa-contractor-nightwing-exposed-aws-govcloud-admin-keys-an
    surface: "body"
    kind: cited
    text: "GitGuardian researcher Guillaume Valadon alerted KrebsOnSecurity on 2026-05-15 to a public GitHub repository named Private-CISA, kept by an employee of the government contractor Nightwing, that held cloud keys, tokens, plaintext passwords, logs and files describing how CISA builds, tests and deploys software ("
    urls: ["https://krebsonsecurity.com/2026/05/cisa-admin-leaked-aws-govcloud-keys-on-github/"]
  - claim_id: c7b4167501
    entry: 2026-05-19/cisa-contractor-nightwing-exposed-aws-govcloud-admin-keys-an
    surface: "body"
    kind: cited
    text: "One file held administrative credentials to three AWS GovCloud servers, which Philippe Caturegli of Seralys validated as authenticating to three GovCloud accounts at a high privilege level; a CSV of browser-saved passwords listed plaintext credentials for dozens of internal CISA systems, among them LZ-DSO (Landing Zone DevSecOps), the agency's secure code development environment; and the archive also held plaintext credentials to CISA's internal Artifactory package repository ("
    urls: ["https://krebsonsecurity.com/2026/05/cisa-admin-leaked-aws-govcloud-keys-on-github/"]
  - claim_id: eb06c1a746
    entry: 2026-05-19/cisa-contractor-nightwing-exposed-aws-govcloud-admin-keys-an
    surface: "body"
    kind: cited
    text: "The commit logs show the administrator had disabled GitHub's default setting that blocks publishing SSH keys or other secrets, and many passwords were each platform's name followed by the current year ("
    urls: ["https://krebsonsecurity.com/2026/05/cisa-admin-leaked-aws-govcloud-keys-on-github/"]
  - claim_id: 22ca696e3a
    entry: 2026-05-19/cisa-contractor-nightwing-exposed-aws-govcloud-admin-keys-an
