    surface: "body"
    kind: cited
    text: "Lumen's Black Lotus Labs published Showboat on 2026-05-20: a modular Linux post-exploitation framework, used since at least mid-2022, that spawns a remote shell, uploads and downloads files, acts as a SOCKS5 proxy and port mapper into internal hosts, can persist as a service and swap C2 nodes, and has a \"hide\" command that conceals its process with code fetched from Pastebin or online forums used as a dead drop ("
    urls: ["https://www.lumen.com/blog/en-us/introducing-showboat-a-new-malware-family-taunts-defenses-and-targets-international-telecom-firms"]
  - claim_id: ea22fd5f2e
    entry: 2026-05-22/calypso-red-lamassu-bronze-medley-deploys-showboat-linux-and
    surface: "body"
    kind: cited
    text: "It reports the host data it gathers in a PNG field as an encrypted, base64-encoded string, and Lumen found it on VirusTotal rather than on a live system, so the initial access vector is unknown ("
    urls: ["https://www.lumen.com/blog/en-us/introducing-showboat-a-new-malware-family-taunts-defenses-and-targets-international-telecom-firms"]
  - claim_id: 1a09effb88
    entry: 2026-05-22/calypso-red-lamassu-bronze-medley-deploys-showboat-linux-and
    surface: "body"
    kind: cited
    text: "PwC, publishing in tandem on 2026-05-21, found a Showboat sample, which it calls kworker, in an open directory active from July to October 2025 next to JFMBackdoor: a batch script downloads the files into the victim's temp directory and runs the legitimate `fltMC.exe`, which side-loads a malicious `FLTLIB.dll` that decrypts its configuration and loads the backdoor in memory through a shellcode stub; JFMBackdoor then offers a remote shell, full file operations including timestomping, TCP proxying and screenshots it base64-encodes and XOR-encrypts for exfiltration ("
    urls: ["https://www.pwc.com/gx/en/issues/cybersecurity/cyber-threat-intelligence/red-lamassu-open-season.html"]
  - claim_id: 8f19612f10
    entry: 2026-05-22/calypso-red-lamassu-bronze-medley-deploys-showboat-linux-and
    surface: "body"
    kind: cited
    text: "Lumen's telemetry confirms two victims, an Afghanistan-based ISP whose Outlook server talked to a C2 node from 2025-12-01 to 2026-02-03 and an entity in Azerbaijan, finds two potential compromises in the United States, and links C2 traffic with the Donbas region, with moderate confidence, to a separate cluster sharing the tooling; the C2 nodes cluster on a shared self-signed certificate ("
    urls: ["https://www.lumen.com/blog/en-us/introducing-showboat-a-new-malware-family-taunts-defenses-and-targets-international-telecom-firms"]
  - claim_id: 22103b49ed
    entry: 2026-05-22/calypso-red-lamassu-bronze-medley-deploys-showboat-linux-and
    surface: "body"
    kind: cited
    text: "PwC ties the open directory to a telecommunications provider in Afghanistan and attributes it to Red Lamassu (also known as Calypso), a China-based actor likely operating from Sichuan Province that it has tracked since 2019 against telecom organizations in Asia ("
    urls: ["https://www.pwc.com/gx/en/issues/cybersecurity/cyber-threat-intelligence/red-lamassu-open-season.html"]
  - claim_id: dd26b84f6f
    entry: 2026-05-22/calypso-red-lamassu-bronze-medley-deploys-showboat-linux-and
    surface: "body"
    kind: cited
    text: "), while Lumen attributes Showboat only to at least one and likely several PRC-aligned clusters ("
    urls: ["https://www.lumen.com/blog/en-us/introducing-showboat-a-new-malware-family-taunts-defenses-and-targets-international-telecom-firms"]
  - claim_id: 34b60343ca
    entry: 2026-05-22/calypso-red-lamassu-bronze-medley-deploys-showboat-linux-and
    surface: "body"
    kind: cited
    text: "**Exposure:** telecommunications providers, chiefly in Asia and the Middle East ("
    urls: ["https://www.pwc.com/gx/en/issues/cybersecurity/cyber-threat-intelligence/red-lamassu-open-season.html", "https://www.lumen.com/blog/en-us/introducing-showboat-a-new-malware-family-taunts-defenses-and-targets-international-telecom-firms"]
  - claim_id: 3dd9d2094a
    entry: 2026-05-22/calypso-red-lamassu-bronze-medley-deploys-showboat-linux-and
    surface: "body"
    kind: cited
    text: "), and in particular their Linux servers and routers, which Lumen notes typically run no EDR ("
    urls: ["https://www.lumen.com/blog/en-us/introducing-showboat-a-new-malware-family-taunts-defenses-and-targets-international-telecom-firms"]
  - claim_id: 3c29a44771
    entry: 2026-05-22/calypso-red-lamassu-bronze-medley-deploys-showboat-linux-and
    surface: "body"
    kind: cited
    text: "**Detection:** network and host telemetry on Linux servers: east-west traffic from servers that does not map to a business process, which Lumen recommends monitoring, and, from Showboat's functions, a server process fetching Pastebin or forum content, a SOCKS5 listener or port mapper on a server, and a new service persisting an unfamiliar binary ("
    urls: ["https://www.lumen.com/blog/en-us/introducing-showboat-a-new-malware-family-taunts-defenses-and-targets-international-telecom-firms"]
  - claim_id: 36fd637f0c
    entry: 2026-05-22/calypso-red-lamassu-bronze-medley-deploys-showboat-linux-and
    surface: "body"
    kind: cited
    text: "On Windows, a legitimate binary such as `fltMC.exe` launched from the temp directory next to a `FLTLIB.dll` is the side-loading pattern PwC describes ("
    urls: ["https://www.pwc.com/gx/en/issues/cybersecurity/cyber-threat-intelligence/red-lamassu-open-season.html"]
  - claim_id: 6605ef9829
    entry: 2026-05-22/calypso-red-lamassu-bronze-medley-deploys-showboat-linux-and
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** telecom operators hunt their Linux server and router estate for these behaviors rather than waiting for EDR alerts; Lumen calls the presence of such implants an early warning sign of broader compromise ("
    urls: ["https://www.lumen.com/blog/en-us/introducing-showboat-a-new-malware-family-taunts-defenses-and-targets-international-telecom-firms"]
  - claim_id: 8bfe280703
    entry: 2026-05-22/calypso-red-lamassu-bronze-medley-deploys-showboat-linux-and
    surface: "section 2026-10-21T20:43:20Z"
    kind: cited
    text: "The confirmed victims are an Afghanistan-based ISP and an entity in Azerbaijan; Lumen calls the US cases potential compromises, links the traffic from Ukraine's Donbas region with moderate confidence to a separate cluster sharing the tooling, and neither source places European telecoms in the targeting ("
    urls: ["https://www.lumen.com/blog/en-us/introducing-showboat-a-new-malware-family-taunts-defenses-and-targets-international-telecom-firms"]
