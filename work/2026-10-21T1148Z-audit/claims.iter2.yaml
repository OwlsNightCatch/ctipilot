    surface: "body"
    kind: cited
    text: "Completing the LDAP remediation does not undo access already taken: the actor came back days later with other accounts, so the VPN accounts that authenticated through the bypass need new credentials and an audit of their privileges ("
    urls: ["https://reliaquest.com/blog/threat-spotlight-vpn-exploitation-when-patched-doesnt-mean-protected/"]
  - claim_id: 155b35f786
    entry: 2026-05-21/sonicwall-gen6-ssl-vpn-incomplete-patching-cve-2024-12802-ak
    surface: "body"
    kind: cited
    text: "**Triage:** where no CLI-based VPN client is authorized or typical, any `sess=\"CLI\"` event is a high-fidelity indicator; where scripted VPN authentication is legitimate, ReliaQuest says to baseline it and tune on volume, source IP and timing ("
    urls: ["https://reliaquest.com/blog/threat-spotlight-vpn-exploitation-when-patched-doesnt-mean-protected/"]
  - claim_id: 2ea4c6b2a2
    entry: 2026-05-21/sonicwall-gen6-ssl-vpn-incomplete-patching-cve-2024-12802-ak
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** treat a Gen6 SSL-VPN as exposed until all six remediation steps are confirmed, whatever its firmware version shows, because patch dashboards cannot tell patched from fully remediated ("
    urls: ["https://reliaquest.com/blog/threat-spotlight-vpn-exploitation-when-patched-doesnt-mean-protected/"]
