    kind: cited
    text: "INTERPOL's Operation Ramz ran from October 2025 to 2026-02-28 across Algeria, Bahrain, Egypt, Iraq, Jordan, Lebanon, Libya, Morocco, Oman, Palestine, Qatar, Tunisia and the UAE and focused on phishing and malware threats and on cyber scams; it led to 201 arrests, identified 382 further suspects and 3,867 victims, seized 53 servers and spread nearly 8,000 pieces of data and intelligence among the participants ("
    urls: ["https://www.interpol.int/en/News-and-Events/News/2026/201-arrests-in-first-of-its-kind-cybercrime-operation-in-MENA-region", "https://thehackernews.com/2026/05/interpol-operation-ramz-disrupts-mena.html", "https://www.helpnetsecurity.com/2026/05/18/interpol-mena-cybercrime-operation-ramz-201-arrests/"]
