  - claim_id: 2c991d5585
    entry: 2026-05-19/bigbluebutton-bbb-web-3-0-21-3-0-23-three-flaws-in-eu-educat
    surface: "section 2026-10-21T20:35:59Z"
    kind: cited
    text: "), and for the SSRF, which needs a high-privilege user, BigBlueButton says only that private-address assets may be compromised if the attacker has gained additional access ("
    urls: ["https://github.com/bigbluebutton/bigbluebutton/security/advisories/GHSA-xqm3-6q7q-4v5h", "https://euvd.enisa.europa.eu/enisa/eu_vulnerability_database/EUVD-2026-44997"]
  - claim_id: b84bbd7735
    entry: 2026-05-19/bigbluebutton-bbb-web-3-0-21-3-0-23-three-flaws-in-eu-educat
    surface: "record 2026-10-21T20:35:59Z"
    kind: record-summary
    text: "BigBlueButton published its three bbb-web advisories on 2026-05-13, and BSI's advisory followed on 2026-05-18; no source names DFN, SWITCH, GÉANT, Swiss cantonal schools or German education ministries as BigBlueButton operators. The checksum bypass lets any user send valid requests to some endpoints without a checksum, and the SSRF, which needs a high-privilege user, exposes private-address assets only if the attacker has gained additional access."
