  - claim_id: 836d7869f2
    entry: 2026-05-13/cve-2026-45185-exim-dead-letter-use-after-free-in-bdat-chunk
    surface: "headline"
    kind: frontmatter
    text: "Exim 4.99.3 fixes an unauthenticated use-after-free in BDAT handling on GnuTLS builds (CVE-2026-45185)"
  - claim_id: cea3422760
    entry: 2026-05-13/cve-2026-45185-exim-dead-letter-use-after-free-in-bdat-chunk
    surface: "summary"
    kind: frontmatter
    text: "Exim 4.99.3, released on 2026-05-12, fixes CVE-2026-45185 (CVSS 9.8), a remotely reachable use-after-free in the GnuTLS backend: a client that sends a TLS close_notify before a BDAT body is complete and then one cleartext byte makes Exim write into its freed TLS transfer buffer, corrupting the heap. It affects Exim 4.97 to 4.99.2 built with GnuTLS that advertise STARTTLS and CHUNKING; GnuTLS is the default TLS library on many Debian-based distributions including Ubuntu, and the only mitigation is the upgrade."
  - claim_id: 839c736753
    entry: 2026-05-13/cve-2026-45185-exim-dead-letter-use-after-free-in-bdat-chunk
    surface: "cves[CVE-2026-45185]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-45185\", \"cvss\": \"9.8\", \"status\": [\"patch-available\"], \"affected\": \"Exim 4.97 to 4.99.2 built with GnuTLS (USE_GNUTLS=yes)\", \"fixed\": \"Exim 4.99.3\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
  - claim_id: 6600bcdb66
    entry: 2026-05-13/cve-2026-45185-exim-dead-letter-use-after-free-in-bdat-chunk
    surface: "body"
    kind: cited
    text: "The Exim maintainers published EXIM-Security-2026-05-01.1 (CVE-2026-45185, Critical, CVSS 9.8) on 2026-05-12 after a report from Federico Kirschbaum of XBOW on 2026-05-01: when a client sends a TLS close_notify alert before a BDAT body transfer is complete and follows it with a final byte in cleartext on the same TCP connection, Exim writes into a buffer already freed during the TLS teardown and corrupts the heap, and an attacker only needs to establish a TLS connection and use the CHUNKING (BDAT) extension ("
    urls: ["https://exim.org/static/doc/security/EXIM-Security-2026-05-01.1/EXIM-Security-2026-05-01.1.txt"]
  - claim_id: 6fcd16a48c
    entry: 2026-05-13/cve-2026-45185-exim-dead-letter-use-after-free-in-bdat-chunk
    surface: "body"
    kind: cited
    text: "Exim 4.97 up to and including 4.99.2 built with USE_GNUTLS=yes are affected, OpenSSL builds are not, and 4.99.3 fixes the flaw by resetting the input-processing stack when a TLS close notification arrives during a BDAT transfer; there is no known mitigation other than upgrading ("
    urls: ["https://exim.org/static/doc/security/EXIM-Security-2026-05-01.1/EXIM-Security-2026-05-01.1.txt"]
  - claim_id: 3626e62539
    entry: 2026-05-13/cve-2026-45185-exim-dead-letter-use-after-free-in-bdat-chunk
    surface: "body"
    kind: cited
    text: "XBOW's write-up places the freed memory in Exim's TLS transfer buffer, into which the still-active BDAT receive wrapper's call to ungetc() writes a single newline, and notes that GnuTLS is the default TLS library on many Debian-based distributions, including Ubuntu ("
    urls: ["https://xbow.com/blog/dead-letter-cve-2026-45185-xbow-found-rce-exim"]
  - claim_id: 1218941d70
    entry: 2026-05-13/cve-2026-45185-exim-dead-letter-use-after-free-in-bdat-chunk
    surface: "body"
    kind: cited
    text: "During the disclosure window an LLM guided step by step by XBOW Native produced working exploits against non-PIE builds, first without ASLR and then with ASLR, the latter running its payload through Exim's ${run} expansion, which forks bash; against the default PIE build no full exploit was reported: the researcher's side got as far as leaking a stack address, while the LLM never got as far as a leak ("
    urls: ["https://xbow.com/blog/dead-letter-cve-2026-45185-xbow-found-rce-exim"]
  - claim_id: 1085392a26
    entry: 2026-05-13/cve-2026-45185-exim-dead-letter-use-after-free-in-bdat-chunk
    surface: "body"
    kind: cited
    text: "**Exposure:** Exim 4.97 to 4.99.x built with GnuTLS that advertise STARTTLS and CHUNKING ("
    urls: ["https://www.openwall.com/lists/oss-security/2026/05/12/4"]
  - claim_id: 3e0b5d42f4
    entry: 2026-05-13/cve-2026-45185-exim-dead-letter-use-after-free-in-bdat-chunk
    surface: "body"
    kind: cited
    text: "); XBOW worked from Exim 4.97 as it ships in default Debian-based installations, including Ubuntu 24.04 LTS ("
    urls: ["https://xbow.com/blog/dead-letter-cve-2026-45185-xbow-found-rce-exim"]
  - claim_id: 9fc58dac06
    entry: 2026-05-13/cve-2026-45185-exim-dead-letter-use-after-free-in-bdat-chunk
    surface: "body"
    kind: cited
    text: "**Detection:** process lineage on mail servers: the Exim daemon forking a shell that opens an outbound TCP connection, the path XBOW's ASLR chain used to run its payload and return data outside the SMTP session ("
    urls: ["https://xbow.com/blog/dead-letter-cve-2026-45185-xbow-found-rce-exim"]
  - claim_id: ec21487d65
    entry: 2026-05-13/cve-2026-45185-exim-dead-letter-use-after-free-in-bdat-chunk
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** upgrade GnuTLS-built Exim to 4.99.3; the maintainers know no other mitigation ("
    urls: ["https://exim.org/static/doc/security/EXIM-Security-2026-05-01.1/EXIM-Security-2026-05-01.1.txt"]
  - claim_id: 1cd0f390cd
    entry: 2026-05-13/cve-2026-45185-exim-dead-letter-use-after-free-in-bdat-chunk
    surface: "body"
    kind: derived
    text: "OpenSSL builds need no action."
  - claim_id: ecd991a3c4
    entry: 2026-05-13/cve-2026-45185-exim-dead-letter-use-after-free-in-bdat-chunk
    surface: "section 2026-10-21T20:55:03Z"
    kind: cited
    text: "The LLM-built exploits covered non-PIE builds only, first without ASLR and then with ASLR; against the default PIE build the researcher's side got as far as leaking a stack address and the LLM never reached a leak, so no full exploit was reported ("
    urls: ["https://xbow.com/blog/dead-letter-cve-2026-45185-xbow-found-rce-exim"]
  - claim_id: ab448949a5
    entry: 2026-05-13/cve-2026-45185-exim-dead-letter-use-after-free-in-bdat-chunk
    surface: "section 2026-10-21T20:55:03Z"
    kind: cited
    text: "The Exim maintainers state there is no known mitigation other than upgrading, so suppressing the CHUNKING advertisement is not a vendor-endorsed workaround, and their advisory, not XBOW's post, sets the CVSS 9.8 and the affected range of 4.97 up to and including 4.99.2 on builds using GnuTLS, fixed in 4.99.3 ("
    urls: ["https://exim.org/static/doc/security/EXIM-Security-2026-05-01.1/EXIM-Security-2026-05-01.1.txt"]
  - claim_id: 3e8f177782
    entry: 2026-05-13/cve-2026-45185-exim-dead-letter-use-after-free-in-bdat-chunk
    surface: "section 2026-10-21T20:55:03Z"
    kind: cited
    text: "Exposure further requires STARTTLS and CHUNKING to be advertised ("
    urls: ["https://www.openwall.com/lists/oss-security/2026/05/12/4"]
  - claim_id: e99702de03
    entry: 2026-05-13/cve-2026-45185-exim-dead-letter-use-after-free-in-bdat-chunk
    surface: "record 2026-10-21T20:55:03Z"
    kind: record-summary
    text: "The exploits produced with an LLM during the disclosure window worked only against non-PIE builds, first without and then with ASLR; against the default PIE build no full exploit was reported, the researcher's side getting as far as a leaked stack address. The Exim maintainers know no mitigation other than upgrading to 4.99.3, so disabling CHUNKING advertisement is not a vendor workaround, and the advisory sets the CVSS 9.8 and the affected range of 4.97 to 4.99.2 on builds with GnuTLS."
