    surface: "body"
    kind: cited
    text: "**Detection:** handset network state as users report it: the phone drops from 4G to 2G shortly before the scam text arrives and returns to 4G immediately afterwards ("
    urls: ["https://www.bacs.admin.ch/en/25w36-en"]
