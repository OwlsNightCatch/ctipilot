    surface: "body"
    kind: cited
    text: "The case is investigated by the IRS-CI Cyber Crimes Unit and the DEA Miami Counternarcotic Cyber Investigations Task Force with substantial assistance from the Bundeskriminalamt Cybercrime Unit and the Zentrale Kriminalinspektion Oldenburg; the FBI, USPIS and HSI were part of the task force that investigated the marketplace between 2016 and 2022, whose prosecutions convicted the administrators \"Oxymonster\" and \"KITT3N\" in the US and the mid-level administrator \"GOWRON\" in the UK ("
    urls: ["https://www.dea.gov/press-releases/2026/05/13/german-citizen-charged-laundering-funds-linked-prominent-darknet"]
  - claim_id: ad00383414
    entry: 2026-05-16/bka-arrests-dream-market-lead-administrator-speedstepper-in
    surface: "body"
    kind: cited
    text: "Prosecutors allege that in November and December 2022 Andresen moved funds from the marketplace's dormant commission wallets into new consolidated wallets, activity that could only have been initiated by someone holding Dream Market's original private keys, and that in August 2023 he used an Atlanta-based cryptocurrency service provider to buy gold bars that were shipped to his home address in Germany; in total he is alleged to have laundered over $2 million between August 2023 and April 2025 ("
    urls: ["https://www.dea.gov/press-releases/2026/05/13/german-citizen-charged-laundering-funds-linked-prominent-darknet"]
