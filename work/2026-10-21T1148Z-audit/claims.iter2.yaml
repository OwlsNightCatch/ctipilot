    entry: 2026-05-20/sparx-enterprise-architect-pro-cloud-server-five-cve-chain-p
    surface: "body"
    kind: cited
    text: "CVE-2026-42097 lets an attacker omit the \"model\" query parameter and send the model name only in the POST request's binary blob, so PCS executes SQL queries without authentication, and CVE-2026-42096 lets any low-privileged user run arbitrary SQL queries in the database user context because permission checks are missing ("
    urls: ["https://cert.pl/en/posts/2026/05/CVE-2026-42096/"]
  - claim_id: f04244dee0
    entry: 2026-05-20/sparx-enterprise-architect-pro-cloud-server-five-cve-chain-p
    surface: "body"
    kind: cited
    text: "CVE-2026-42099 is a race condition in WebEA's `/data_api/dl_internal_artifact.php`: an attacker with repository access controls the name and contents of the file it writes, so a delayed response keeps a malicious PHP file reachable long enough for a second request to execute it; CVE-2026-42098 lets an authenticated EA user modify the client, for example with a debugger, to log in as any other user or administrator; and CVE-2026-42100 makes the PCS service terminate on a crafted SQL query ("
    urls: ["https://cert.pl/en/posts/2026/05/CVE-2026-42096/"]
  - claim_id: 0fbd15c92b
    entry: 2026-05-20/sparx-enterprise-architect-pro-cloud-server-five-cve-chain-p
    surface: "body"
    kind: cited
    text: "The researcher scores the chain CVSS 4.0 10.0 because, with WebEA installed, the flaws give remote unauthenticated code execution in the web server context ("
