    entry: 2026-05-12/ico-fines-south-staffordshire-water-963-900-water-sector-oes
    surface: "body"
    kind: cited
    text: "The UK Information Commissioner's Office fined South Staffordshire Plc and South Staffordshire Water Plc £963,900 for infringing Articles 5(1)(f) and 32(1) of the UK GDPR ("
    urls: ["https://ico.org.uk/action-weve-taken/enforcement/2026/05/south-staffordshire-plc-and-south-staffordshire-water-plc/"]
