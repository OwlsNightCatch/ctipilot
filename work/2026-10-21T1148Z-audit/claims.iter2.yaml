    entry: 2026-05-10/groupe-3r-r-seau-radiologique-romand-akira-ransomware-claims
    surface: "summary"
    kind: frontmatter
    text: "Groupe 3R (Réseau Radiologique Romand), which runs 20 medical-imaging centres in seven Swiss cantons, was hit on 2026-04-30 by a ransomware attack that encrypted administrative and medical data; Akira listed the operator on its leak site on 2026-05-08. Groupe 3R, which attributes the attack to Akira and refused to pay, confirmed that administrative data including employee personal information was stolen and internal documents published, and says it cannot establish whether patient medical data was also taken."
