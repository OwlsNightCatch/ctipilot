    entry: 2026-05-14/the-gentlemen-raas-backend-rocket-database-leaked-16-22-gb-c
    surface: "summary"
    kind: frontmatter
    text: "The Gentlemen ransomware-as-a-service administrator acknowledged on 2026-05-04 that the group's internal Rocket backend had leaked, and Check Point Research analysed a 44.4 MB part of a leak a seller's screenshot put at about 16.22 GB. The chats show access through Fortinet and Cisco edge devices by brute force, known vulnerabilities and bought access, NTLM relay and certificate-services abuse, tools that block EDR at start-up, ZeroPulse and Velociraptor for remote access and Cloudflare tunnels for persistence; Check Point counts about 332 leak-site victims in the first five months of 2026. A free decryptor released in April recovers files only from a memory image of the ransomware process captured while it was running."
