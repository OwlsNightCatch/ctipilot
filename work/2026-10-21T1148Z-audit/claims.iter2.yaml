    text: "**Detection:** in CI/CD platform audit logs, new runner registrations and unusual runner names, new or modified pipelines created by service accounts, jobs touching unfamiliar repositories and workflows that open network tunnels; on the build runners themselves, process and credential-access telemetry for suspicious child processes, credential access attempts, reverse tunnels and persistence ("
