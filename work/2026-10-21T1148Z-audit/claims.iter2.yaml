    text: "On 2026-05-18 an attacker published a malicious Nx Console 18.95.0 to the Visual Studio Marketplace (12:30 to 12:48 UTC) and Open VSX (12:33 to 13:09 UTC) as a legitimate core contributor, whose GitHub CLI OAuth token a credential stealer from the 2026-05-11 TanStack npm compromise had exfiltrated a week earlier. On activation the extension fetched an obfuscated payload that harvested GitHub, npm, AWS, Vault, Kubernetes and 1Password secrets and planted a Python backdoor; Microsoft counts 28 Marketplace installs and Nx about 6,000 activations, and version 18.100.0 or later is clean."
