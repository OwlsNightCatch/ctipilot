  - claim_id: ef24a9c09a
    entry: 2026-05-19/bigbluebutton-bbb-web-3-0-21-3-0-23-three-flaws-in-eu-educat
    surface: "body"
    kind: cited
    text: "BigBlueButton, an open-source virtual classroom, published three security advisories for its bbb-web component on 2026-05-13 ("
    urls: ["https://euvd.enisa.europa.eu/enisa/eu_vulnerability_database/EUVD-2026-44996", "https://github.com/bigbluebutton/bigbluebutton/security/advisories/GHSA-7959-pf2v-xc4h", "https://github.com/bigbluebutton/bigbluebutton/security/advisories/GHSA-43hc-5g2m-cqff", "https://github.com/bigbluebutton/bigbluebutton/security/advisories/GHSA-xqm3-6q7q-4v5h"]
  - claim_id: bcd1bb751b
    entry: 2026-05-19/bigbluebutton-bbb-web-3-0-21-3-0-23-three-flaws-in-eu-educat
    surface: "body"
    kind: cited
    text: "Before version 3.0.21, bbb-web generated conference session tokens with insufficiently secure randomness, so a user could determine the session tokens of other users in the same session and impersonate them (CVE-2026-46351) ("
    urls: ["https://github.com/bigbluebutton/bigbluebutton/security/advisories/GHSA-7959-pf2v-xc4h", "https://euvd.enisa.europa.eu/enisa/eu_vulnerability_database/EUVD-2026-44996"]
  - claim_id: 8ed46a0c7f
    entry: 2026-05-19/bigbluebutton-bbb-web-3-0-21-3-0-23-three-flaws-in-eu-educat
    surface: "body"
    kind: cited
    text: "), and supplying a presentationUploadExternalUrl parameter bypassed checksum validation, so any user could send valid requests to some endpoints without a checksum (CVE-2026-46353) ("
    urls: ["https://github.com/bigbluebutton/bigbluebutton/security/advisories/GHSA-43hc-5g2m-cqff", "https://euvd.enisa.europa.eu/enisa/eu_vulnerability_database/EUVD-2026-44998"]
  - claim_id: b514a79bef
    entry: 2026-05-19/bigbluebutton-bbb-web-3-0-21-3-0-23-three-flaws-in-eu-educat
    surface: "body"
    kind: cited
    text: "Before 3.0.23, presentation URL validation did not restrict access to site-local and link-local addresses, and the fix also pins resolved IPs when following redirects; BigBlueButton says private-address assets may be compromised if the attacker has gained additional access (CVE-2026-46404) ("
    urls: ["https://github.com/bigbluebutton/bigbluebutton/security/advisories/GHSA-xqm3-6q7q-4v5h", "https://euvd.enisa.europa.eu/enisa/eu_vulnerability_database/EUVD-2026-44997"]
  - claim_id: 3318ba0930
    entry: 2026-05-19/bigbluebutton-bbb-web-3-0-21-3-0-23-three-flaws-in-eu-educat
    surface: "body"
    kind: cited
    text: "The CVSS 3.1 scores in the CVE records are 8.1 for the first two, with low privileges and no user interaction, and 6.8 for the SSRF, with high privileges and a changed scope ("
    urls: ["https://euvd.enisa.europa.eu/enisa/eu_vulnerability_database/EUVD-2026-44996", "https://euvd.enisa.europa.eu/enisa/eu_vulnerability_database/EUVD-2026-44998", "https://euvd.enisa.europa.eu/enisa/eu_vulnerability_database/EUVD-2026-44997"]
  - claim_id: 796f89b558
    entry: 2026-05-19/bigbluebutton-bbb-web-3-0-21-3-0-23-three-flaws-in-eu-educat
    surface: "body"
    kind: cited
    text: "Germany's BSI summarized the set as letting a remote, authenticated attacker bypass security measures and disclose confidential information (translated from German) ("
    urls: ["https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-1568"]
  - claim_id: 84c15e40c9
    entry: 2026-05-19/bigbluebutton-bbb-web-3-0-21-3-0-23-three-flaws-in-eu-educat
    surface: "body"
    kind: cited
    text: "**Exposure:** BigBlueButton servers running bbb-web older than 3.0.21, or older than 3.0.23 for the SSRF; the token flaw needs a user inside the meeting, the checksum bypass any user of the API, and the SSRF a high-privilege user ("
    urls: ["https://euvd.enisa.europa.eu/enisa/eu_vulnerability_database/EUVD-2026-44996", "https://euvd.enisa.europa.eu/enisa/eu_vulnerability_database/EUVD-2026-44998", "https://euvd.enisa.europa.eu/enisa/eu_vulnerability_database/EUVD-2026-44997"]
  - claim_id: 3e1dc24384
    entry: 2026-05-19/bigbluebutton-bbb-web-3-0-21-3-0-23-three-flaws-in-eu-educat
    surface: "body"
    kind: cited
    text: "**Detection:** in bbb-web API logs, requests carrying a presentationUploadExternalUrl parameter that reach endpoints without a valid checksum, and joins in which one participant presents another participant's session token; in egress telemetry from the BigBlueButton server, presentation fetches to site-local or link-local addresses ("
    urls: ["https://github.com/bigbluebutton/bigbluebutton/security/advisories/GHSA-43hc-5g2m-cqff", "https://github.com/bigbluebutton/bigbluebutton/security/advisories/GHSA-7959-pf2v-xc4h", "https://github.com/bigbluebutton/bigbluebutton/security/advisories/GHSA-xqm3-6q7q-4v5h"]
  - claim_id: c1d088babb
    entry: 2026-05-19/bigbluebutton-bbb-web-3-0-21-3-0-23-three-flaws-in-eu-educat
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** upgrade BigBlueButton to 3.0.23 or later, which covers all three flaws; the advisories offer no workaround besides updating ("
    urls: ["https://github.com/bigbluebutton/bigbluebutton/security/advisories/GHSA-xqm3-6q7q-4v5h", "https://github.com/bigbluebutton/bigbluebutton/security/advisories/GHSA-7959-pf2v-xc4h"]
  - claim_id: 8fbb6e9976
    entry: 2026-05-19/bigbluebutton-bbb-web-3-0-21-3-0-23-three-flaws-in-eu-educat
    surface: "body"
    kind: uncited
    text: "No source reports exploitation."
  - claim_id: 2794bf8a02
