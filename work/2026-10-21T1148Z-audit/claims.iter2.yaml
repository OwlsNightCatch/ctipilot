    entry: 2026-05-20/sparx-enterprise-architect-pro-cloud-server-five-cve-chain-p
    surface: "summary"
    kind: frontmatter
    text: "CERT Polska disclosed five flaws in Sparx Systems Pro Cloud Server (through 6.1) and Enterprise Architect (through 17.1) on 2026-05-19: CVE-2026-42097 lets an attacker who omits the model query parameter run SQL queries without authentication (CVSS 4.0 9.3), and with WebEA installed the CVE-2026-42099 race turns that access into code execution in the web server context, which the researcher scores 10.0 chained. Proof-of-concept code exists for all five, no exploitation was known as of 2026-05-20, and the vendor had resolved none of them at disclosure."
