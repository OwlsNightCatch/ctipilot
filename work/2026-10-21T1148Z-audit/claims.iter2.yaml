    text: "**Exposure:** Microsoft Entra ID tenants that allow the OAuth device-code flow for end users; the protocol does not bind the device that requested a code to the user, so anyone who starts a device-code grant for a Microsoft first-party AppId can collect tokens from any user who consents ("
