  - claim_id: 591f7543b5
    entry: 2026-05-21/sonicwall-gen6-ssl-vpn-incomplete-patching-cve-2024-12802-ak
    surface: "body"
    kind: cited
    text: "**Detection:** SonicWall authentication logs forwarded with the Authentication category: rapid logins with session type `sess=\"CLI\"` from VPS and VPN hosting ranges, together with Event ID 238 (failed VPN login) or Event ID 1080 (successful SSL VPN zone login), and after a success a change of the session type from CLI to GMS, which marks hands-on access to internal resources ("
    urls: ["https://reliaquest.com/blog/threat-spotlight-vpn-exploitation-when-patched-doesnt-mean-protected/"]
  - claim_id: 27dd6674e5
