    entry: 2026-05-13/certfr-2026-avi-0564-spip-4-4-14-multiple-rces-public-and-pr
    surface: "body"
    kind: cited
    text: "The bulletin states that \"these flaws are not covered by the security screen\" (translated from French), so SPIP's built-in screen gives no interim protection; it gives no technical detail beyond the nginx condition, and the release's change list also includes better sanitisation of HTTP_HOST and a fix to REMOTE_USER handling under nginx ("
    urls: ["https://blog.spip.net/Mise-a-jour-de-securite-sortie-de-SPIP-4-4-14.html"]
