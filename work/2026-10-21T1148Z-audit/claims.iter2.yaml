  - claim_id: 5c10d0b891
    entry: 2026-05-19/bigbluebutton-bbb-web-3-0-21-3-0-23-three-flaws-in-eu-educat
    surface: "section 2026-10-21T20:35:59Z"
    kind: cited
    text: "The checksum bypass lets any user send valid requests to some endpoints without a checksum, rather than arbitrary authenticated API calls ("
