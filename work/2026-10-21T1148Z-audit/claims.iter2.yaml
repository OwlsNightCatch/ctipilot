    entry: 2026-05-20/vm2-node-js-sandbox-12-critical-cves-cve-2026-43997-43999-44
    surface: "body"
    kind: cited
    text: "**Exposure:** any service that runs untrusted JavaScript through vm2 before 3.11.4, as a direct or transitive dependency: user-submitted code in plugin or SaaS environments, and LLM output produced in response to a manipulated prompt in AI-agent frameworks, CI/CD runners and online IDEs ("
    urls: ["https://www.kodemsecurity.com/resources/vm2-sandbox-escape-vulnerabilities-the-2026-cve-wave-turning-ai-agents-into-host-rce-vectors"]
  - claim_id: 7caba45426
    entry: 2026-05-20/vm2-node-js-sandbox-12-critical-cves-cve-2026-43997-43999-44
    surface: "body"
    kind: cited
    text: "**Detection:** process lineage and runtime telemetry: shells (`sh`, `bash`, `cmd.exe`) parented to a Node.js runtime that should not start them, `child_process` calls originating in sandboxed contexts, reads of cloud, npm and Docker credential files or the process environment from inside an agent runtime, and egress from agent or CI runtimes to destinations outside the allowlist ("
    urls: ["https://www.kodemsecurity.com/resources/vm2-sandbox-escape-vulnerabilities-the-2026-cve-wave-turning-ai-agents-into-host-rce-vectors"]
  - claim_id: 2dff4a9a0b
    entry: 2026-05-20/vm2-node-js-sandbox-12-critical-cves-cve-2026-43997-43999-44
    surface: "body"
    kind: cited
    text: "An escape before the upgrade ran with the host process's access, so after patching rotate the credentials the runtime could reach and audit its logs for those signs ("
    urls: ["https://www.kodemsecurity.com/resources/vm2-sandbox-escape-vulnerabilities-the-2026-cve-wave-turning-ai-agents-into-host-rce-vectors"]
  - claim_id: ea0c755740
    entry: 2026-05-20/vm2-node-js-sandbox-12-critical-cves-cve-2026-43997-43999-44
    surface: "body"
    kind: cited
    text: "**Triage:** the discriminator is whether the Node.js runtime is expected to start shells at all: Kodem's indicator is a shell parented to a runtime that should not invoke one, or a `child_process` call traced to a sandboxed context ("
    urls: ["https://www.kodemsecurity.com/resources/vm2-sandbox-escape-vulnerabilities-the-2026-cve-wave-turning-ai-agents-into-host-rce-vectors"]
  - claim_id: ae2681fb59
    entry: 2026-05-20/vm2-node-js-sandbox-12-critical-cves-cve-2026-43997-43999-44
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** upgrade vm2 to 3.11.4 or later, which covers both sets ("
    urls: ["https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-1583"]
