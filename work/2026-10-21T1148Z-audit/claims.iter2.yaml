    text: "Nextcloud's advisory GHSA-mp6x-g55j-w9jw (CVE-2026-45691, Moderate 5.9) says a session cookie issued after password login but before the TOTP step could be reused as a Bearer token on DAV endpoints, giving read and write access without the second factor; an attacker needs the user's password. Server is fixed in 33.0.3 and 32.0.9 and Enterprise Server also in version 31.0.14.5, version 30.0.17.9 and version 29.0.16.16, the same releases that fix a second 2FA bypass, CVE-2026-45690."
