  - claim_id: 3e42d92707
    entry: 2026-05-12/teampcp-unc6780-pcpjack-ecosystem-backdoors-the-checkmarx-je
    surface: "summary"
    kind: frontmatter
    text: "A modified build 2026.5.09 of the Checkmarx Jenkins AST plugin, published to the Jenkins Marketplace outside the plugin's release pipeline, was live from 2026-05-09 01:25 to 2026-05-10 08:47 UTC; its payload walks an OS-specific list of file paths looking for credentials of crypto wallets, VPNs, AWS and GitHub (Checkmarx). Checkmarx says the attacker reused access obtained in the March 2026 Trivy compromise, and TeamPCP claimed the attack, the third wave of malicious Checkmarx artifacts since late March. Checkmarx recommends rotating every credential a pipeline that ran the build could reach."
  - claim_id: 9d2db7d80d
    entry: 2026-05-12/teampcp-unc6780-pcpjack-ecosystem-backdoors-the-checkmarx-je
    surface: "body"
    kind: cited
    text: "On Saturday 2026-05-09 a rogue build, version `2026.5.09`, of the Checkmarx Jenkins AST plugin was uploaded to repo.jenkins-ci.org outside the plugin's release pipeline; it broke the plugin's version scheme and had no git tag or GitHub release ("
    urls: ["https://www.bleepingcomputer.com/news/security/official-checkmarx-jenkins-package-compromised-with-infostealer/"]
  - claim_id: b4adfa1aba
    entry: 2026-05-12/teampcp-unc6780-pcpjack-ecosystem-backdoors-the-checkmarx-je
    surface: "body"
    kind: cited
    text: "Checkmarx says an external service account modified the plugin and published it to the Jenkins Marketplace, that the malicious window ran from 2026-05-09 01:25 UTC to 2026-05-10 08:47 UTC, and that the attacker used access obtained in the March incident, which began with credentials taken in the Trivy supply-chain attack on 2026-03-19 ("
    urls: ["https://checkmarx.com/blog/ongoing-security-updates/"]
  - claim_id: 7592fd33ac
    entry: 2026-05-12/teampcp-unc6780-pcpjack-ecosystem-backdoors-the-checkmarx-je
    surface: "body"
    kind: cited
    text: "It is the third wave of malicious Checkmarx artifacts after GitHub Actions and Open VSX extensions on 2026-03-23 and a KICS Docker image, VS Code and DevAssist extensions and a GitHub Action on 2026-04-22 ("
    urls: ["https://checkmarx.com/blog/ongoing-security-updates/"]
