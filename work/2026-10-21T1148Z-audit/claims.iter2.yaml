  - claim_id: 7f4801d9cc
    entry: 2026-05-17/cert-pl-cve-2026-44088-szafirhost-jar-zip-polyglot-bypass-in
    surface: "headline"
    kind: frontmatter
    text: "SzafirHost before 1.2.1 can load a malicious class from a JAR that passes its signature check (CVE-2026-44088)"
  - claim_id: 7d8ea51b6a
    entry: 2026-05-17/cert-pl-cve-2026-44088-szafirhost-jar-zip-polyglot-bypass-in
    surface: "summary"
    kind: frontmatter
    text: "CERT Polska disclosed CVE-2026-44088 on 2026-05-15 in SzafirHost from Krajowa Izba Rozliczeniowa (KIR), the helper application used with KIR's browser plugin and Java to sign with a qualified signature. SzafirHost verifies a downloaded JAR's signature by reading from the start of the file but loads classes from the ZIP Central Directory at the end, so a genuine signed JAR combined with a malicious ZIP passes verification while the malicious class loads, which can lead to remote code execution; all versions before 1.2.1 are affected and 1.2.1 fixes it."
  - claim_id: 0d0b670d9b
    entry: 2026-05-17/cert-pl-cve-2026-44088-szafirhost-jar-zip-polyglot-bypass-in
    surface: "cves[CVE-2026-44088]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-44088\", \"cvss\": \"8.6 (CVSS 4.0, CERT-PL via ENISA EUVD)\", \"status\": [\"patch-available\"], \"affected\": \"SzafirHost, all versions before 1.2.1\", \"fixed\": \"1.2.1\", \"auth\": \"pre-auth\", \"vector\": \"user-interaction\"}"
  - claim_id: ac5522bcfb
    entry: 2026-05-17/cert-pl-cve-2026-44088-szafirhost-jar-zip-polyglot-bypass-in
    surface: "body"
    kind: cited
    text: "CERT Polska coordinated the disclosure of CVE-2026-44088 in SzafirHost from Krajowa Izba Rozliczeniowa (KIR) on 2026-05-15: SzafirHost verifies the signature of a downloaded JAR file with JarInputStream, which reads from the beginning of the file, but loads classes with JarFile/URLClassLoader, which reads the ZIP Central Directory from the end ("
    urls: ["https://cert.pl/en/posts/2026/05/CVE-2026-44088/"]
  - claim_id: eddd555d9f
    entry: 2026-05-17/cert-pl-cve-2026-44088-szafirhost-jar-zip-polyglot-bypass-in
    surface: "body"
    kind: cited
    text: "An attacker who combines a genuine signed JAR with a malicious ZIP file therefore passes verification while the malicious class is loaded, which CERT Polska says can lead to remote code execution; all versions before 1.2.1 are affected and version 1.2.1 fixes the flaw ("
    urls: ["https://cert.pl/en/posts/2026/05/CVE-2026-44088/"]
  - claim_id: 244016cb0a
