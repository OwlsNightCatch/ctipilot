  - claim_id: 3ead063428
    entry: 2026-05-16/cve-2026-44112-cve-2026-44113-cve-2026-44115-cve-2026-44118
    surface: "headline"
    kind: frontmatter
    text: "OpenClaw \"Claw Chain\": code running in the agent sandbox can expose secrets, take owner control and plant backdoors"
  - claim_id: 317874e3d4
    entry: 2026-05-16/cve-2026-44112-cve-2026-44113-cve-2026-44115-cve-2026-44118
    surface: "summary"
    kind: frontmatter
    text: "Cyera disclosed on 2026-05-15 four chainable flaws in the OpenClaw AI-agent platform: symlink races in the OpenShell sandbox file bridge that redirect writes (CVE-2026-44112) or reads (CVE-2026-44113) outside the mount root, shell expansion hidden in heredocs that slips past the exec allowlist (CVE-2026-44115), and a spoofable owner flag on the MCP loopback (CVE-2026-44118). From code execution inside the sandbox they let an attacker expose credentials, gain owner-level control of the agent runtime and persist; all four are fixed in openclaw release 2026.4.22."
  - claim_id: 5b0afcc5c0
