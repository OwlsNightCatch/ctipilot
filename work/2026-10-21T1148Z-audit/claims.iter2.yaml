    text: "Sansec reported on 2026-05-14 active exploitation of Funnel Builder by FunnelKit, a WooCommerce checkout plugin used on 40,000+ stores, whose public checkout endpoint before version 3.15.0.3 let unauthenticated requests write the plugin's External Scripts setting; attackers planted a fake Google Tag Manager loader that pulls a store-tailored card skimmer over WebSocket. The flaw is tracked as CVE-2026-47100 (CVSS 4.0 8.7); FunnelKit pushed the fix to older branches through WordPress.org automatic updates, saw signs of compromise on 3 of more than 1,300 sites it monitored, and said the exploitation path was closed."
