  - claim_id: 43be714d36
    entry: 2026-05-16/cve-2026-44112-cve-2026-44113-cve-2026-44115-cve-2026-44118
    surface: "body"
    kind: cited
    text: "Cyera disclosed four vulnerabilities in OpenClaw, an open-source platform for autonomous AI agents originally launched as Clawdbot in late 2025, on 2026-05-15 after reporting them to the maintainers in April ("
    urls: ["https://www.cyera.com/blog/claw-chain-cyera-research-unveil-four-chainable-vulnerabilities-in-openclaw"]
  - claim_id: 7961565341
    entry: 2026-05-16/cve-2026-44112-cve-2026-44113-cve-2026-44115-cve-2026-44118
    surface: "body"
    kind: cited
    text: "OpenClaw's advisories of 2026-04-23 list the openclaw npm package up to release 2026.4.21 as affected and 2026.4.22 as fixed for all four ("
    urls: ["https://github.com/openclaw/openclaw/security/advisories/GHSA-wppj-c6mr-83jj", "https://github.com/openclaw/openclaw/security/advisories/GHSA-5h3g-6xhh-rg6p", "https://github.com/openclaw/openclaw/security/advisories/GHSA-x3h8-jrgh-p8jx", "https://github.com/openclaw/openclaw/security/advisories/GHSA-r6xh-pqhr-v4xh"]
  - claim_id: bb8052fd44
    entry: 2026-05-16/cve-2026-44112-cve-2026-44113-cve-2026-44115-cve-2026-44118
    surface: "body"
    kind: cited
    text: "CVE-2026-44112 and CVE-2026-44113 are time-of-check/time-of-use races in the OpenShell sandbox's filesystem bridge, where a symlink swap redirects a write outside the intended mount root or makes a read return bytes from outside it ("
    urls: ["https://github.com/openclaw/openclaw/security/advisories/GHSA-wppj-c6mr-83jj", "https://github.com/openclaw/openclaw/security/advisories/GHSA-5h3g-6xhh-rg6p"]
  - claim_id: 5d760182be
    entry: 2026-05-16/cve-2026-44112-cve-2026-44113-cve-2026-44115-cve-2026-44118
    surface: "body"
    kind: cited
    text: "CVE-2026-44115 lets an allowlisted command hide shell expansion in an unquoted heredoc body, so the shell evaluates more than the approved command text shows, which Cyera says returns environment variables such as API keys and tokens ("
    urls: ["https://github.com/openclaw/openclaw/security/advisories/GHSA-x3h8-jrgh-p8jx", "https://www.cyera.com/blog/claw-chain-cyera-research-unveil-four-chainable-vulnerabilities-in-openclaw"]
  - claim_id: 8e4a88d6db
    entry: 2026-05-16/cve-2026-44112-cve-2026-44113-cve-2026-44115-cve-2026-44118
    surface: "body"
    kind: cited
    text: "CVE-2026-44118 sits on the loopback MCP path, which accepted spoofable owner-context metadata from request headers and so let a non-owner loopback client act as owner for owner-gated operations such as gateway configuration, cron scheduling and execution-environment management ("
