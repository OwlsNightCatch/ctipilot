    surface: "summary"
    kind: frontmatter
    text: "CVE-2026-41091 (CVSS 7.8) is a link-following flaw in the Microsoft Malware Protection Engine that lets an authorized local attacker gain SYSTEM, and CVE-2026-45498 (CVSS 3.1 base score 4.0) is a denial of service in the Microsoft Defender Antimalware Platform. Microsoft marked both exploited on 2026-05-19 and CISA added both to its KEV catalog on 2026-05-20; the fixes are Engine version 1.1.26040.8 and Platform version 4.18.26040.7, which the default configuration installs automatically. The researcher who published the RedSun and UnDefend exploits in April says the two CVEs are those flaws."
