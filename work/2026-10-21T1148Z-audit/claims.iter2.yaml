    entry: 2026-05-19/cisa-contractor-nightwing-exposed-aws-govcloud-admin-keys-an
    surface: "body"
    kind: cited
    text: "**Exposure:** organizations whose staff or contractors can push agency material to public code repositories and can switch off the platform's secret-blocking setting, as this administrator did ("
    urls: ["https://krebsonsecurity.com/2026/05/cisa-admin-leaked-aws-govcloud-keys-on-github/"]
  - claim_id: 4da0cab303
    entry: 2026-05-19/cisa-contractor-nightwing-exposed-aws-govcloud-admin-keys-an
    surface: "body"
    kind: cited
    text: "**Detection:** in code-hosting and secret-scanning telemetry, alerts on public repositories outside the organization's own namespace that contain its credentials, the kind of finding GitGuardian raised here; in cloud control-plane audit logs, use of long-lived access keys after the material they leaked from has been taken down, since these keys kept working for 48 hours ("
    urls: ["https://krebsonsecurity.com/2026/05/cisa-admin-leaked-aws-govcloud-keys-on-github/"]
  - claim_id: 0702ab4bf9
    entry: 2026-05-19/cisa-contractor-nightwing-exposed-aws-govcloud-admin-keys-an
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** when a secret leaks through a public repository, revoke the keys and passwords at once rather than relying on the takedown, and check that administrators cannot disable the code platform's secret blocking for repositories that hold agency material ("
    urls: ["https://krebsonsecurity.com/2026/05/cisa-admin-leaked-aws-govcloud-keys-on-github/"]
  - claim_id: 22c9a934e4
    entry: 2026-05-19/cisa-contractor-nightwing-exposed-aws-govcloud-admin-keys-an
    surface: "body"
    kind: uncited
    text: "For public bodies the case is a transferable pattern: a contractor's own repository holding an agency's privileged cloud and build-system credentials."
