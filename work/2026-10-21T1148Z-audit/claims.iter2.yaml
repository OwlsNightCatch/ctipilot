    surface: "body"
    kind: cited
    text: "The Dutch Health and Youth Care Inspectorate (IGJ) concluded on 2026-05-13 that the business units Clinical Diagnostics LCPL BV and NMDL BV in Rijswijk \"did not meet the standard either at the time of the hack or during an inspection visit in December 2025\" (translated from Dutch): among other gaps, no independent audit of information security had been carried out and processing risks had not been mapped periodically, so the company could not determine which data-security measures it needed ("
    urls: ["https://www.igj.nl/actueel/nieuws/2026/05/13/clinical-diagnostics-voldeed-niet-aan-wettelijke-norm-voor-informatiebeveiliging"]
