    entry: 2026-05-17/kaspersky-great-documents-kimsuky-s-rust-based-hellodoor-and
    surface: "summary"
    kind: frontmatter
    text: "Kaspersky's Securelist report of 2026-05-14 analyzes Kimsuky (APT43, Ruby Sleet) campaigns with droppers detected from August 2025 to February 2026: spear-phishing attachments disguised as documents (JSE, SCR, PIF) install the PebbleDash-family backdoors HelloDoor (Rust, early-stage, C2 behind TryCloudflare), httpMalice, the MemLoad loader and httpTroy, and the AppleSeed and HappyDoor malware. For post-exploitation the group runs a legitimate VSCode CLI tunnel authorized with its own GitHub account or deploys DWAgent tied to its account; targets are mainly South Korean, and PebbleDash also hit defense organizations in Brazil and Germany."
