    text: "The free Gentlemen decryptor released in April 2026 recovers files only from a memory image of the ransomware process captured while it ran, has no master key and predates the leak, so trying decryption before negotiating does not help most victims; capturing the running locker's memory does. The 1,570 figure is victims of one affiliate's SystemBC server from an earlier Check Point investigation, not hidden ransomware victims, and the group tracks CVE-2024-55591 among other CVEs without the chats showing exploitation. Initial access usually runs through Fortinet and Cisco edge devices by brute force, known vulnerabilities and bought access, the ETW and NTDLL tampering belongs to the locker, and the 8,200 chat lines are DynaRisk's count."
