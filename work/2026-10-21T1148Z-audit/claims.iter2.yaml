    text: "ENISA's EUVD carries CERT-PL's CVSS 4.0 base score of 8.6, with a network attack vector, no privileges and active user interaction ("
    urls: ["https://euvd.enisa.europa.eu/enisa/eu_vulnerability_database/EUVD-2026-30512"]
  - claim_id: 6effc902fe
    entry: 2026-05-17/cert-pl-cve-2026-44088-szafirhost-jar-zip-polyglot-bypass-in
    surface: "body"
    kind: cited
    text: "SzafirHost is the application that, with KIR's browser plugin and Java, signs documents and tax declarations with a qualified signature; accounting software prompts users to install the plugin and SzafirHost at the first signing attempt ("
    urls: ["https://pomoc.wfirma.pl/-podpisywanie-deklaracji-i-dokumentow-wlasnym-podpisem-kwalifikowanym"]
  - claim_id: 8691a956f1
    entry: 2026-05-17/cert-pl-cve-2026-44088-szafirhost-jar-zip-polyglot-bypass-in
    surface: "body"
    kind: cited
    text: "**Exposure:** workstations that sign with KIR Szafir qualified certificates through SzafirHost earlier than version 1.2.1 ("
    urls: ["https://cert.pl/en/posts/2026/05/CVE-2026-44088/", "https://pomoc.wfirma.pl/-podpisywanie-deklaracji-i-dokumentow-wlasnym-podpisem-kwalifikowanym"]
