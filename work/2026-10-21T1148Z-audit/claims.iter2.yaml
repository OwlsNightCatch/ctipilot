  - claim_id: ef8cc4d056
    entry: 2026-05-21/sonicwall-gen6-ssl-vpn-incomplete-patching-cve-2024-12802-ak
    surface: "headline"
    kind: frontmatter
    text: "Patched SonicWall Gen6 SSL-VPNs still let brute-forced accounts skip MFA unless the LDAP fix is redone by hand"
  - claim_id: 09f02a5487
    entry: 2026-05-21/sonicwall-gen6-ssl-vpn-incomplete-patching-cve-2024-12802-ak
    surface: "summary"
    kind: frontmatter
    text: "ReliaQuest reported on 2026-05-19 that between February and March 2026 an attacker brute-forced SonicWall Gen6 SSL-VPN accounts and bypassed MFA through CVE-2024-12802 on appliances running fixed firmware, because the manual LDAP remediation steps had not been done; it assesses this with medium confidence as the first in-the-wild exploitation, by a likely initial access broker using tools of the ransomware ecosystem. SonicWall scores the flaw CVSS 6.5 (CISA's ADP 9.1); Gen7 and Gen8 are fixed by firmware, while Gen6, end-of-life since 2026-04-16, needs a six-step LDAP reconfiguration."
  - claim_id: 430c8f4316
    entry: 2026-05-21/sonicwall-gen6-ssl-vpn-incomplete-patching-cve-2024-12802-ak
    surface: "cves[CVE-2024-12802]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2024-12802\", \"cvss\": \"6.5\", \"status\": [\"exploited\", \"patch-available\"], \"affected\": \"Gen6 firmware version 6.5.4.15-117n and older (NSv version 6.5.4.4-44v-21-2457 and older); Gen7 firmware versions 7.0.1-5161, 7.1.1-7058 and 7.1.2-7019 and older; Gen8 TZ80 version 8.0.0-8035; SMA100 version 10.2.1.13-72sv and older\", \"fixed\": \"Gen6 firmware version 6.5.5.1-6n (NSv version 6.5.4.4-44v-21-2472) plus the manual LDAP remediation; Gen7 firmware version 7.0.1-5169 or 7.2.0-7015; Gen8 firmware version 8.0.1-8017; SMA100 version 10.2.1.14-75sv\", \"auth\": \"post-auth\", \"vector\": \"zero-click\"}"
  - claim_id: 8d009f55b9
    entry: 2026-05-21/sonicwall-gen6-ssl-vpn-incomplete-patching-cve-2024-12802-ak
    surface: "body"
    kind: cited
    text: "SonicWall's SNWLID-2025-0001 describes CVE-2024-12802 (CWE-305, CVSS 6.5): when SSL-VPN authenticates against Microsoft Active Directory, UPN and SAM account names are handled separately, so MFA can be configured independently for each and an attacker can bypass it through the alternative account name ("
    urls: ["https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2025-0001"]
  - claim_id: d71d3adb2c
    entry: 2026-05-21/sonicwall-gen6-ssl-vpn-incomplete-patching-cve-2024-12802-ak
    surface: "body"
    kind: cited
    text: "); in practice an attacker with valid credentials authenticates without the MFA step ("
    urls: ["https://www.bleepingcomputer.com/news/security/hackers-bypass-sonicwall-vpn-mfa-due-to-incomplete-patching/"]
  - claim_id: 3f1620284c
    entry: 2026-05-21/sonicwall-gen6-ssl-vpn-incomplete-patching-cve-2024-12802-ak
    surface: "body"
    kind: cited
    text: "On Gen6 the fixed firmware does not remove the vulnerable LDAP configuration, so six manual steps are needed: delete the LDAP configuration that uses userPrincipalName, remove cached LDAP users, remove the SSL VPN user domain, reboot, recreate the LDAP configuration without userPrincipalName and take a fresh backup ("
    urls: ["https://www.bleepingcomputer.com/news/security/hackers-bypass-sonicwall-vpn-mfa-due-to-incomplete-patching/"]
  - claim_id: a7484e3745
    entry: 2026-05-21/sonicwall-gen6-ssl-vpn-incomplete-patching-cve-2024-12802-ak
    surface: "body"
    kind: cited
    text: "); Gen7 firmware version 7.2.0-7015 and Gen8 firmware version 8.0.1-8017 build those steps in ("
    urls: ["https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2025-0001"]
  - claim_id: e528296e18
    entry: 2026-05-21/sonicwall-gen6-ssl-vpn-incomplete-patching-cve-2024-12802-ak
    surface: "body"
    kind: cited
    text: "ReliaQuest responded to intrusions between February and March 2026 on Gen6 devices that looked patched and assesses with medium confidence that they are the first in-the-wild exploitation; the attacker brute-forced VPN accounts with an automated tool, in one case after only 13 attempts, and reached a file server within 30 minutes ("
    urls: ["https://reliaquest.com/blog/threat-spotlight-vpn-exploitation-when-patched-doesnt-mean-protected/"]
  - claim_id: aa19bfe99d
    entry: 2026-05-21/sonicwall-gen6-ssl-vpn-incomplete-patching-cve-2024-12802-ak
    surface: "body"
    kind: cited
    text: "), connected to it over RDP with a shared local administrator password, and tried to deploy a Cobalt Strike beacon and a vulnerable driver to disable endpoint protection, both blocked by EDR ("
