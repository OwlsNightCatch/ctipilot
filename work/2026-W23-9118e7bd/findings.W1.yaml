  - title: "W22 LOOKING-AHEAD UPDATE: Shai-Hulud / Miasma supply-chain worm — Cargo (Rust) still un-hit as of window close; Miasma evolves to target AI coding agents in GitHub repos"
    sources:
      - url: "https://thehackernews.com/2026/06/miasma-worm-hits-73-microsoft-github.html"
        publisher: "The Hacker News"
        date: "2026-06-06"
        role: "primary"
      - url: "https://www.stepsecurity.io/blog/miasma-worm-hits-microsoft-again-azure-functions-action-and-72-other-repositories-disabled-after-supply-chain-attack-targeting-ai-coding-agents"
        publisher: "StepSecurity"
        date: "2026-06-06"
        role: "corroborating"
    discovery_trace: "WebSearch 'Shai-Hulud 3.0 Cargo Maven June 2026' → confirmed Cargo still un-hit; WebSearch 'Miasma worm GitHub Microsoft 73 repos AI coding agents June 5 2026' → The Hacker News June 6 article → StepSecurity analysis"
    summary: |
      W22 status check on the prediction 'Cargo (Rust) and Maven (Java) as next likely Shai-Hulud targets': Cargo remains un-hit as of 7 June 2026. Maven was previously hit via automated npm-mirror pipeline (confirmed in W22 weekly) but without independent Maven-native worm propagation. The most material new development is Miasma's June 5–6 pivot to GitHub repository persistence, specifically targeting AI coding agent configuration files. The malicious commit planted 4.6 MB payload runners wired to execute via Claude Code, Gemini CLI, Cursor, and VS Code workspace-config files — meaning the trigger is a developer opening the repository in an AI-assisted IDE, not an `npm install`. GitHub disabled 73 Microsoft repositories (Azure, Azure-Samples, Microsoft, MicrosoftDocs organizations). The Durable Task ecosystem (Azure/durabletask and siblings) and Azure Functions Action (azure-functions-action) disrupted CI/CD pipelines globally. TeamPCP's reuse of a previously compromised contributor account from the May GitHub breach suggests incomplete credential rotation after the initial incident. Key delta from prior coverage: the AI-coding-agent config injection vector is new and the Cargo prediction remains unconfirmed.
    ch_eu_nexus: "Global; EU and CH software development pipelines using Miasma-affected GitHub Actions (azure-functions-action) may have had CI/CD disrupted."
    public_sector_nexus: "indirect"
    sector: "IT-infrastructure, software-development"
    cves: []
    actors_campaigns_malware: ["TeamPCP", "Miasma", "Mini Shai-Hulud"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "update-to-prior:2026-06-06"
    evidence:
      - quote: "The commit added no dependencies. It planted a 4.3 MB payload runner and wired it to execute automatically through five developer tools: Claude Code, Gemini CLI, Cursor, VS Code, and the npm test script. The attack detonates when a developer clones one of the affected repos and opens it in an AI coding agent."
        attribution: "SafeDep (cited in The Hacker News)"
        source_url: "https://thehackernews.com/2026/06/miasma-worm-hits-73-microsoft-github.html"
    extended_notes: |
      Detection vantage for the AI-coding-agent injection vector: monitor `.claude/commands/`, `CLAUDE.md`, `.gemini/`, `.cursor/rules`, and `.vscode/settings.json` for unexpected modifications in cloned repositories — especially when those files trigger outbound HTTP requests or spawn child processes on file-open events. In CI/CD contexts, block workspace-config files (CLAUDE.md, .cursorrules, .gemini/) from being executed as code; treat them as data-only. GitHub Actions consumers: verify azure-functions-action is restored and re-check workflows that reference the affected repositories. The 'same wound reopening' finding from StepSecurity suggests the contributor account from the May breach was never fully revoked — a credential hygiene gap that defenders should note as a model for their own post-breach token rotation processes.

  - title: "W22 LOOKING-AHEAD UPDATE: Gogs argument-injection RCE — still no patch; no confirmed exploitation ITW; CISA has not yet listed the new vulnerability"
    sources:
      - url: "https://www.rapid7.com/blog/post/ve-authenticated-rce-via-argument-injection-gogs-unfixed/"
        publisher: "Rapid7"
        date: "2026-05-28"
        role: "primary"
    discovery_trace: "WebSearch 'Gogs RCE argument injection June 2026 vendor response' → Rapid7 primary (May 28, boundary of window) → CISA KEV checked — not listed for the new argument injection CVE"
    summary: |
      W22 status check: The Rapid7-discovered argument injection in Gogs' pull-request merge flow (Merge() in internal/database/pull.go) remains unpatched and the Gogs maintainer has provided no further response since acknowledging receipt on 28 March. A public Metasploit module is available. Shadowserver tracks over 2,400 internet-exposed Gogs instances (319 in Europe). No confirmed ITW exploitation of this specific flaw reported in the window; CISA has not added it to KEV (the prior CISA Gogs KEV entry from January 2026 covers the separate path-traversal CVE-2025-8110). Note: the Rapid7 primary source was published 28 May 2026, at the boundary of the 8-day window. The key delta for this window: no change — Gogs maintainer silence continues, and defenders should treat any internet-exposed Gogs instance with open registration as fully compromised until patched or isolated.
    ch_eu_nexus: "319 European Gogs instances internet-exposed per Shadowserver. EU public-sector self-hosted Git infrastructure may be affected."
    public_sector_nexus: "indirect"
    sector: "IT-infrastructure, software-development"
    cves: []
    actors_campaigns_malware: []
    verification: SINGLE-SOURCE
    confidence: MEDIUM
    novelty: "update-to-prior:2026-W22"
    evidence:
      - quote: "The researcher reported the security flaw to the Gogs maintainers on March 17, but they have yet to provide a patch or respond to further requests for a status update, despite acknowledging the report on March 28."
        attribution: "BleepingComputer (citing Rapid7)"
        source_url: "https://www.rapid7.com/blog/post/ve-authenticated-rce-via-argument-injection-gogs-unfixed/"
    extended_notes: |
      Defender action: Disable open registration on internet-facing Gogs instances (Site settings → Registration → Disable self-registration). Limit 'Rebase before merging' merge strategy to trusted repository owners — the vulnerable code path only triggers when this specific merge strategy is active. Network-layer: Gogs should not be internet-exposed without authentication enforced at the perimeter. The Metasploit module availability means this will appear in opportunistic scan-and-exploit campaigns even before any specific threat actor prioritises it.

