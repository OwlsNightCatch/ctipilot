  - title: "CRA June 11 deadline: EU member states must designate notifying authorities for conformity assessment bodies — ENISA publishes CRA Single Reporting Platform manual and Secure Update Mechanisms technical advisory in-window"
    sources:
      - url: "https://openssf.org/policy/2026/06/03/updates-from-europe-single-reporting-platform-public-consultations-new-publications/"
        publisher: "OpenSSF"
        date: "2026-06-03"
        role: "primary"
      - url: "https://www.enisa.europa.eu/topics/product-security-and-certification/single-reporting-platform-srp"
        publisher: "ENISA"
        date: "2026-06"
        role: "corroborating"
    discovery_trace: "WebSearch ('ENISA Single Reporting Platform CRA June 2026 guidance manufacturers') → openssf.org article (2026-06-03) → primary; cross-checked against ENISA SRP page"
    summary: |
      The Cyber Resilience Act's Chapter IV provisions on notifying authorities and conformity assessment bodies (CABs) take effect on June 11, 2026 — the first hard CRA milestone. Member states must by that date designate the national authority responsible for assessing, designating, and notifying conformity assessment bodies; without designated notifying authorities, manufacturers of Important and Critical products (as defined by CRA Annex III/IV — operating systems, anti-virus, firewalls, smart cards, secure elements, HSMs, smart meter gateways) cannot obtain the third-party conformity assessment certificates they will need by the December 2027 full-application date. In parallel, ENISA published in-window (June 2026): (1) updated access/registration manual and instructions for the CRA Single Reporting Platform (SRP) — the platform that manufacturers must use from September 11, 2026 to report actively exploited vulnerabilities within 24 h (early warning) and 72 h (full notification); (2) a draft Technical Advisory on Secure Update Mechanisms (public consultation closes July 10, 2026) targeting micro, small, and medium manufacturers; (3) a new draft EUCC ACM (Agreed Cryptographic Mechanisms) scheme v3.0 under public review. For defenders: the SRP manual means software vendors deploying into EU environments should be validating their vulnerability-disclosure pipeline now; the 90-day window to SRP operational date (September 11) is shorter than it appears.
    ch_eu_nexus: "Direct — Swiss software and hardware manufacturers selling into the EU market are subject to CRA; ENISA SRP obligations apply to them from September 2026"
