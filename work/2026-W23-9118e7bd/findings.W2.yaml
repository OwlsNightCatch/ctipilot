  - title: "ENISA NIS360 2026 (3rd edition): public administration, health, water and rail remain in the 'risk zone' where criticality outpaces maturity — 63% of EU hacktivist attacks land on public admin"
    sources:
      - url: "https://www.enisa.europa.eu/enisa-nis360-2026"
        publisher: "ENISA"
        date: "2026-05-28"
        role: "primary"
      - url: "https://securityaffairs.com/193002/reports/enisa-nis360-2026-progress-across-the-board-but-the-sectors-that-matter-most-are-still-falling-short.html"
        publisher: "Security Affairs"
        date: "2026-06-02"
        role: "corroborating"
    discovery_trace: "WebSearch ('ENISA NIS360 2026 member state cybersecurity maturity national authority follow-up') → enisa.europa.eu landing + securityaffairs.com article (2026-06-02) → primary: ENISA NIS360 2026 report page"
    summary: |
      ENISA published its third annual NIS360 on 28 May 2026, assessing cybersecurity maturity vs. criticality for all NIS2 Annex I high-criticality sectors. The headline finding is structural rather than trending: a persistent 'risk zone' where criticality exceeds maturity, comprising health, railway, maritime, ICT service management, space, public administrations, and drinking and waste water. Public administration receives 63% of all hacktivist attacks in Europe and remains the most consistently targeted sector, yet roughly one-third of public admin entities lack structured cybersecurity expertise at management level and about half provide no cybersecurity training to management. Health is improving on paper (pharmaceutical manufacturers boosting aggregate scores) but hospitals continue to struggle with asset tracking, legacy systems, and budget constraints. Water sector: one in three entities surveyed has never conducted a risk assessment. High-maturity sectors — banking, electricity, telecoms, and newly elevated trust services, aviation, and financial market infrastructures — share a common driver: regulatory pressure backed by supervisory capacity with real enforcement. The report's key policy implication for NIS2 national authorities: sectors without comparable oversight structures (like ICT service management, where national authorities are often new and under-resourced) lag structurally. Only 16% of NIS2-affected entities consider themselves fully compliant; 41% face uncertainty about national obligations. This creates an immediate detection-engineering context: SOC managers at public-admin entities should cross-reference their threat model against the elevated hacktivist pressure specifically confirmed by ENISA for their sector.
    ch_eu_nexus: "Direct EU policy relevance — NIS360 is the authoritative annual baseline for NIS2 national authority oversight planning; Swiss public-sector entities parallel EU posture concerns"
    public_sector_nexus: "direct"
