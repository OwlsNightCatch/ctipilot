  - title: "EU 20th Russia sanctions package — managed security services prohibition to Russia in force since May 25; compliance guidance from Commission/national authorities still awaited"
    sources:
      - url: "https://www.squirepattonboggs.com/insights/publications/the-20th-eu-sanctions-package-against-russia-scope-entry-into-force-and-compliance-implications-for-operators/"
        publisher: "Squire Patton Boggs"
        date: "2026-04"
        role: "primary"
      - url: "https://www.gtlaw.com/en/insights/2026/5/eus-20th-russia-sanctions-package-key-changes-and-compliance-implications"
        publisher: "Greenberg Traurig"
        date: "2026-05"
        role: "corroborating"
    discovery_trace: "WebSearch ('EU Russia 20th sanctions package managed security services prohibition cybersecurity guidance June 2026') → gtlaw.com and squirepattonboggs.com articles → primary regulatory analysis"
    summary: |
      Since May 25, 2026, EU operators are prohibited from providing managed security services (MSS) to the Russian government and to entities established in Russia, including Russian subsidiaries of EU-incorporated companies, unless a national-authority licence is obtained. 'Managed security services' is defined by reference to Regulation (EU) 2019/881 (Cybersecurity Act): services involving cybersecurity risk management, incident handling, penetration testing, security audits, and related consulting. The prohibition was adopted in the EU's 20th Russia sanctions package (Council Regulation (EU) 2026/506, adopted April 23, 2026) as an amendment to Regulation (EU) No 833/2014. Notably, relevant wind-down transactions must be completed before October 24, 2026. As of publication, interpretive guidance from the European Commission on the prohibition's exact scope and the new sectoral crypto regime has not been issued; national competent authority guidance is also awaited. This creates a compliance gap particularly for European MSSPs with legacy Russian contracts: in the absence of guidance, the safe course is cessation of service. Swiss MSSPs are not directly subject to EU sanctions law but should note that EU-headquartered affiliates and any SWIFT/correspondent-banking touch points in EU create indirect exposure.
    ch_eu_nexus: "Significant — EU MSSPs providing any security services to Russian clients must have ceased operations or obtained a licence since May 25; Swiss MSSPs with EU-entity structures are in scope"
    public_sector_nexus: "indirect (policy awareness for SOC procurement, vendor risk management)"
    sector: "managed security services, all"
