  - title: "EU Council TTE June 9 — CSA2/NIS2 simplification progress report tabled; trilogue targeted for early 2027"
    sources:
      - url: "https://industrialcyber.co/regulation-standards-and-compliance/eu-council-to-examine-cybersecurity-package-focused-on-enisa-nis2-simplification-and-supply-chain-security/"
        publisher: "Industrial Cyber"
        date: "2026-06-05"
        role: "primary"
    discovery_trace: "WebSearch ('EU Council Telecommunications meeting June 8 9 2026 cybersecurity act agenda CSA2 NIS2') → industrialcyber.co article (2026-06-05) → primary reporting on Council agenda"
    summary: |
      The EU Transport, Telecommunications and Energy (TTE) Council met on June 9, 2026, with the Presidency presenting progress reports on the Cybersecurity Act 2 (CSA2) and the targeted NIS2 simplification directive — both proposed by the Commission on January 20, 2026. The CSA2 introduces a trusted ICT supply-chain framework with a 'high-risk supplier' designation mechanism targeting vendors whose legal/geopolitical context creates cybersecurity risk to critical sectors; listing consequences include exclusion from EU public procurement and EU funding programmes, and penalties up to 7% of worldwide turnover for violations of component-use prohibitions. The NIS2 simplification amendments clarify jurisdictional rules, streamline ransomware-attack data collection, add EU Digital Identity Wallet providers and submarine data-transmission infrastructure operators as new essential-entity categories, and strengthen ENISA's cross-border supervisory coordination role. Both proposals now enter trilogue negotiations; political agreement is targeted for early 2027. For Swiss public-sector procurement teams: the CSA2 'high-risk supplier' framework, once enacted, will reshape telecom and IT supply-chain decisions across EU critical sectors and is expected to influence Swiss procurement policy given alignment pressure from the bilateral track.
    ch_eu_nexus: "Direct — CSA2 high-risk supplier framework will affect Swiss ICT vendors selling into EU markets; NIS2 simplification amendments will reduce harmonisation gaps that affect Swiss entities operating in the EU"
    public_sector_nexus: "direct"
