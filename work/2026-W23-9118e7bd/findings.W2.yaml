  - title: "Germany's Gesetzentwurf zur Stärkung der Cybersicherheit: cabinet approved May 27 — BKA and Bundespolizei to get active-cyberdefence powers against attacker infrastructure"
    sources:
      - url: "https://www.bundesregierung.de/breg-en/news/strengthening-cyber-security-2433588"
        publisher: "German Federal Government"
        date: "2026-05-27"
        role: "primary"
      - url: "https://dig.watch/updates/germany-approves-draft-law-expanding-cyber-defense-powers-for-federal-authorities"
        publisher: "Digital Watch Observatory"
        date: "2026-05-31"
        role: "corroborating"
      - url: "https://netzpolitik.org/2026/gesetzentwurf-zur-staerkung-der-cybersicherheit-gefaehrliche-offensive/"
        publisher: "netzpolitik.org"
        date: "2026-03-16"
        role: "background/civil-society-critique"
    discovery_trace: "WebSearch ('Germany BMI proactive cyber defence Hackback active defence draft law 2026') → dig.watch article (2026-05-31) → primary: German Federal Government press release (2026-05-27) → netzpolitik.org civil-society critique"
    summary: |
      On 27 May 2026, the German Federal Cabinet adopted the Gesetzentwurf zur Stärkung der Cybersicherheit (Draft Law to Strengthen Cybersecurity). The bill grants three agencies new active-cyberdefence powers: the BKA and Bundespolizei may shut down or disrupt attacker-controlled IT infrastructure (including servers located outside Germany), reroute and block data traffic, and collect, modify, or delete data on foreign systems. The BSI gains authority to collect and store threat-preparation data and to require telecoms and major platforms to relay BSI threat warnings to end users. Interior Minister Dobrindt described the shift explicitly: "In future, we will target the attacker, their servers, their software and their strategy." The bill is now proceeding to Bundestag parliamentary debate; no vote date has been set. Civil-society analysis (netzpolitik.org, interface institute) flags constitutional exposure: state action against systems outside Germany raises fundamental-rights concerns, AG KRITIS questions whether cybersecurity jurisdiction belongs with the BKA at all (constitutionally a Ländersache), and the Bundesrechnungshof noted federal IT is still underprepared. The personnel bill is significant: BKA +264 positions, Bundespolizei +90, BSI +21 by 2030. No patch or network-level hardening implication for defenders, but public-sector SOC managers in DACH should note: (a) new duty-to-relay for telecoms/platforms once enacted means threat-warning feeds will become more regulated; (b) the BSI's expanded detection mandate implies broader threat-intelligence sharing obligations may follow in secondary legislation.
    ch_eu_nexus: "Direct DACH relevance — Germany is Switzerland's largest neighbour and economic partner; if enacted, this law sets a precedent for EU active-cyberdefence norms that Switzerland will face pressure to address in its own forthcoming cyber-resilience legislation (draft expected autumn 2026)"
    public_sector_nexus: "direct"
    sector: "government, critical infrastructure, all"
    cves: []
    actors_campaigns_malware: []
