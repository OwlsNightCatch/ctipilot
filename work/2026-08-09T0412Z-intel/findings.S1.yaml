items:
  - title: "Metabase — unauthenticated CVSS 10.0 SQL-injection zero-day via /api/session/reset_password, no CVE yet assigned, confirmed exploited against Framework, Tally and LexisNexis"
    sources:
      - { url: "https://www.metabase.com/blog/security-update", publisher: "Metabase (vendor)", date: "2026-08-06", role: "primary" }
      - { url: "https://github.com/metabase/metabase/security/advisories/GHSA-vwf4-m7j8-wcjf", publisher: "Metabase GitHub Security Advisory GHSA-vwf4-m7j8-wcjf", date: "2026-08-06", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/framework-tally-disclose-metabase-data-theft-attacks/", publisher: "BleepingComputer", date: "2026-08-07", role: "corroborating" }
      - { url: "https://thehackernews.com/2026/08/metabase-zero-day-exploited-in-wild.html", publisher: "The Hacker News", date: "2026-08-08", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"CVE exploited in the wild August 8 2026\") → pivot: The Hacker News, URL https://thehackernews.com/2026/08/metabase-zero-day-exploited-in-wild.html → primary: Metabase vendor advisory, URL https://www.metabase.com/blog/security-update → primary: GitHub Security Advisory GHSA-vwf4-m7j8-wcjf, URL https://github.com/metabase/metabase/security/advisories/GHSA-vwf4-m7j8-wcjf → corroborating victim confirmation: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/framework-tally-disclose-metabase-data-theft-attacks/"
    summary: |
      Metabase disclosed (2026-08-06) that Metabase Cloud was compromised through a previously
      unknown, unauthenticated SQL-injection vulnerability in the /api/session/reset_password
      endpoint, reaching CVSS 3.1 10.0 (AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H) — no CVE identifier
      has been assigned; it is tracked only via GHSA-vwf4-m7j8-wcjf. An unauthenticated remote
      attacker injects arbitrary SQL into the Metabase application database through the
      reset-password flow, which grants administrator access to the instance — from there an
      attacker can modify configuration, harvest stored database-connection credentials, and
      export any data reachable through the BI platform's connected data sources. Affected
      version branches run v58.0–v58.22, v59.0–v59.19, v60.0–v60.15, v61.0–v61.9, v62.0–v62.7
      and v63.0–v63.2; patched in v58.24, v59.21, v60.17, v61.11, v62.9 and v63.5. Metabase Cloud
      instances were patched immediately by the vendor; self-hosted instances remain exposed
      until manually upgraded. Metabase's own advisory states active exploitation was confirmed,
      and BleepingComputer (2026-08-07) reports laptop maker Framework, form-builder Tally and
      data broker LexisNexis have all disclosed customer-data breaches traced to compromised
      self-hosted or cloud Metabase instances accessed on 2026-08-03; stolen data includes names,
      emails, login IPs, billing/shipping addresses, phone numbers and company names. This is a
      pre-auth, internet-exposed-BI-platform RCE-equivalent (full admin takeover via SQLi) with
      confirmed real-world victim breaches and no CVE/KEV listing yet — exactly the disclosure
      profile that is easy to miss in a CVE-driven patch pipeline.
    region_nexus: "global; self-hosted Metabase is widely deployed as an internal/customer-facing BI layer, including by public-sector and finance analytics teams in the constituency's footprint"
    primary_sector_nexus: "indirect"
    sector: "cross-sector, finance, public-sector, technology"
