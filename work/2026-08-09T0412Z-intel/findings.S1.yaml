  Quiet-weekend run: 2026-08-08 (Sat) and 2026-08-09 (Sun) fall inside the 26h window. Every
  government/CERT essential source in the S1 slice (CISA KEV catalog, CISA cybersecurity-advisories
  feed and ICS advisories, ENISA EUVD criticals/exploited/lastvulnerabilities listings, NCSC-NL,
