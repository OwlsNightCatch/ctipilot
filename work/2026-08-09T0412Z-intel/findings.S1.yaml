  2026-06-30, Check Point IKEv1 CVE-2026-50751 from 2026-06-08, cPanel CVE-2026-41940 from
  2026-02/05, Windows Netlogon CVE-2026-41089 from 2026-05, Microsoft SharePoint CVE-2026-55040
  from 2026-07-14) or that duplicate the run's heavy-prior-coverage list verbatim.

  Checked and confirmed NOT yet shipped: Phoenix Contact CHARX SEC-3xxx firmware 1.9.1 (fixing
  20 CVEs including five at CVSS 9.8, CERT-VDE VDE-2026-008) remains listed as "will be made
  available as soon as possible, but no later than August 12, 2026" as of the advisory's last
  update (2026-07-30) — no material delta to report yet; recommend a check again before the
  2026-08-12 deadline.

  Deliberately dropped as out-of-scope/out-of-relevance rather than omitted silently: four fresh
  EUVD-listed critical (CVSS 9.3) command-injection CVEs in MSI Radix AXE6600 consumer/gaming
  Wi-Fi routers (CVE-2026-71990/71991/71992/71993, published 2026-08-08/09, VulnCheck-sourced,
