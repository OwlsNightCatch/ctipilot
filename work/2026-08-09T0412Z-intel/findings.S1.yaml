      - quote: "This is a CRITICAL vulnerability that allows an unauthenticated remote attacker to inject arbitrary SQL into the Metabase application database."
        attribution: "Metabase GitHub Security Advisory GHSA-vwf4-m7j8-wcjf"
        source_url: "https://github.com/metabase/metabase/security/advisories/GHSA-vwf4-m7j8-wcjf"
      - quote: "Metabase has confirmed active exploitation of this vulnerability."
        attribution: "Metabase GitHub Security Advisory GHSA-vwf4-m7j8-wcjf"
        source_url: "https://github.com/metabase/metabase/security/advisories/GHSA-vwf4-m7j8-wcjf"
      - quote: "The vulnerability (CVSS score: 10.0), which does not carry a CVE identifier, allows an unauthenticated remote attacker to inject arbitrary SQL into the Metabase application database, enabling them to gain administrator access."
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/08/metabase-zero-day-exploited-in-wild.html"
      - quote: "The vulnerability is an unauthenticated SQL injection flaw in Metabase that can ultimately give a remote attacker administrator access to a customer's instance."
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/framework-tally-disclose-metabase-data-theft-attacks/"
    extended_notes: |
      Detection concept (telemetry class first): web/application access-log analysis on any
      internet-reachable Metabase instance — the vendor's own stated fingerprint is a
      POST /api/session/reset_password returning HTTP 400 immediately followed by a
      GET /api/user/current returning HTTP 200 from the same source, observed in Metabase
      server ingress logs or reverse-proxy access logs. That 400-then-200 sequence from the
      same client on an unauthenticated session is the discriminator from benign
      password-reset traffic (which would not chain into a successful /api/user/current
      call without a valid session). No IOC-level indicators are published by the vendor.

      Hardening: upgrade self-hosted Metabase to v0.58.24 / v0.59.21 / v0.60.17 / v0.61.11 /
      v0.62.9 / v0.63.5 (Cloud already patched by the vendor); do not expose the
      /api/session/reset_password endpoint to the open internet where avoidable; after
      upgrading, rotate any credentials Metabase held for connected data-source databases
      and review admin-account and API-key creation logs for the exposure window, since the
      vendor confirms the exploitation path grants full administrative takeover capable of
      minting new credentials.

      No named threat-actor cluster is attributed by any source consulted; treat as
      opportunistic/financially-motivated data-theft exploitation of a public BI-platform
      0-day pending further attribution reporting.

