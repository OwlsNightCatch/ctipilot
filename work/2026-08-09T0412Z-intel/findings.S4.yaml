    discovery_trace: "first seen at: securityaffairs, URL https://securityaffairs.com/ (listing fetch surfaced 2026-08-08T11:50:21Z item) → primary: Metabase's own vendor advisory, URL https://www.metabase.com/blog/security-update → cross-checked against BleepingComputer (named both victims), TechCrunch and heise.de (Framework's own statement), and the Metabase/GitHub security advisory GHSA-vwf4-m7j8-wcjf (technical detail, login-walled — confirmed via corroborating secondary summaries only, flagged below)"
    summary: |
      Metabase, the widely deployed open-source business-intelligence and embedded-analytics platform (self-hosted and Cloud), disclosed on 2026-08-06 that its own Metabase Cloud infrastructure was compromised on 2026-08-03 by an unauthenticated attacker exploiting a maximum-severity zero-day (CVSS 10.0, no CVE identifier assigned as of publication). The vulnerable component is the unauthenticated password-reset API endpoint, POST /api/session/reset_password: an attacker can inject arbitrary SQL through this pre-auth endpoint and forge a valid session, then call GET /api/user/current to obtain full administrator access to a Metabase instance without any credentials. From admin access the attacker can rewrite application configuration, read the stored credentials Metabase uses to connect to downstream data warehouses, query and export any data those connections expose, and pull data directly from the Metabase application database itself. Affected versions span every currently supported release line: x.58.0–x.58.22, x.59.0–x.59.19, x.60.0–x.60.15, x.61.0–x.61.9, x.62.0–x.62.7 and x.63.0–x.63.2; fixed releases are x.58.24, x.59.21, x.60.17, x.61.11, x.62.9 and x.63.5. Two named victims have confirmed customer-data theft as a direct result: laptop maker Framework, which notified "all customers" that names, login IP addresses, billing/shipping addresses, phone numbers and e-mail addresses were exfiltrated (Framework states payment data was not exposed); and online form-builder Tally, whose co-founder confirmed the attacker accessed customer e-mail addresses and password hashes on 2026-08-03 (Tally states form content and submitted responses were not affected, as they sit in a separate database). Metabase told affected customers of the exposure on 2026-08-06. Given the platform's ubiquity as an embedded/self-hosted BI layer sitting in front of production data warehouses — including within organisations far beyond these two named victims — any self-hosted Metabase instance that was internet-reachable and unpatched between disclosure of the affected version ranges and the 2026-08-06 fix should be treated as a compromise-assessment target, not merely a patch target.
    region_nexus: "global — named victims (Framework, Tally) are US-based; Metabase Cloud and self-hosted deployments are used worldwide, including by European/Swiss organisations for internal and embedded BI"
    primary_sector_nexus: "indirect — no confirmed public-sector or Swiss/EU critical-infrastructure victim named to date, but Metabase is a common self-hosted embedded-analytics component that could sit inside any sector's data-warehouse stack, including public-sector and CI operators"
