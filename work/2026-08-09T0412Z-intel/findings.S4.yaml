    extended_notes: |
      Detection/hunt concept (behavioral, no IOCs): the vendor-confirmed compromise signature is a POST to /api/session/reset_password that returns HTTP 400, immediately followed by a successful GET to /api/user/current (HTTP 200) from the same source — the 400 on the reset call is expected (the SQLi rides inside a request the application still rejects at the surface level) while the follow-on authenticated call is the tell that a session was forged. Any org running self-hosted Metabase should hunt this sequence in web-server/reverse-proxy access logs across the full exposure window (all versions prior to the 2026-08-06 patch line), not just from the fix date forward. Hardening: patch to x.58.24/x.59.21/x.60.17/x.61.11/x.62.9/x.63.5 immediately; until patched, block or rate-limit external access to /api/session/reset_password at the WAF/reverse-proxy layer (the mitigation heise.de reports Metabase itself recommended); rotate all database credentials stored in Metabase's connection configuration regardless of confirmed compromise, since admin access exposes them in plaintext to the attacker. A third company, LexisNexis, surfaced in some secondary aggregator summaries as a possible Metabase victim; on tracing to primary reporting this could not be corroborated — the LexisNexis "Metabase API" service-disruption reporting found on inspection traces to an unrelated, earlier (2026-02/03) React2Shell/AWS-misconfiguration breach at LexisNexis Legal & Professional, not this Metabase zero-day. Dropped per the fake-news/fabrication-avoidance rule; only Framework and Tally are reported here as confirmed named victims. Likely overlap candidate: S1 may independently be covering the Metabase CVSS-10 zero-day itself as a vulnerability-kind entry; this S4 item is scoped to the confirmed victim-disclosure angle (named orgs, data types exposed) — main agent should dedup/cross-reference if both surface.
