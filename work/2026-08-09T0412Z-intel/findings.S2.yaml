      - quote: "the use of a private APN to gain access to the OT network was the first instance of this attack vector being observed in a real-world cyberattack"
        attribution: "CERT Polska"
        source_url: "https://cert.pl/uploads/docs/CERT_Polska_Energy_Sector_Incident_Follow_up_Report_2025.pdf"
      - quote: "the router was configured with two physical interfaces: a serial link connected to the RTU and a second interface, Ethernet, connected to a VLAN managed by the central firewall that had been compromised by the attacker"
        attribution: "CERT Polska"
        source_url: "https://cert.pl/uploads/docs/CERT_Polska_Energy_Sector_Incident_Follow_up_Report_2025.pdf"
      - quote: "the PLCs were switched to STOP mode and protected with a password that prevented changes to their operating state and modification of the control logic. As a result, the steam turbine and the water treatment system used to produce process water were shut down"
        attribution: "CERT Polska"
        source_url: "https://cert.pl/uploads/docs/CERT_Polska_Energy_Sector_Incident_Follow_up_Report_2025.pdf"
    extended_notes: |
      Note on novelty tagging: this is NOT a duplicate of the already-covered 2026-07-13 Static Tundra/FSB Centre 16
      attribution entry — that entry covered UK/EU government attribution of the December 2025 incident; this item
      is a materially new technical delta (a second, previously undisclosed victim facility and an entirely new
      documented attack vector: private-APN pivot into OT). The registry entity
      incident:poland-energy-grid-attack-2025-12-29 links both. No actor attribution is stated in this follow-up
      report (it is purely a technical forensic account); the main agent may wish to note in the entry that this
      does not update the contested Sandworm-vs-Static-Tundra attribution question, only the technical incident
      timeline.
      CERT Polska's hardening recommendations for private-APN operators (directly reusable in the entry's
      detection/hardening section): enable client isolation between APN-connected devices; treat the private APN as
      an untrusted/external network from the OT side with segmentation and traffic control at least equivalent to a
      corporate WAN boundary; strictly allowlist OT<->APN-gateway communication; monitor APN<->OT traffic for
      deviation from the expected communication profile; centralize logging on APN-gateway devices; minimize open
      admin ports (web admin/SSH/Telnet) reachable from the APN; change default credentials on all APN-connected
      devices; and include private APNs and their gateway devices in penetration tests / red-team scope.
      Detection-relevant telemetry classes supported by the source: process-creation/administrative-session logs on
      cellular-router and PLC web-admin interfaces (login attempts, especially default-account names like "admin"/
      "user" plus vendor-integrator usernames); network flow logs showing SSH sessions FROM a cellular router's
      WAN/APN-facing interface (SSH should not be reachable there in a correctly configured deployment); ICS
      protocol-port scan telemetry (102/TCP S7, 502/TCP Modbus, 11740/TCP CODESYS, 554/TCP RTSP) sourced from
      unexpected internal subnets; PLC mode-change events (RUN->STOP transitions) outside planned maintenance
      windows; and device-configuration-change logs showing IP-address or credential changes to industrial routers/
      switches shortly before or after a mode-change event (the anti-forensics pattern the report documents).
