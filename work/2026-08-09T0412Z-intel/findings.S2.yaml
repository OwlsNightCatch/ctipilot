items:
  - title: "CERT Polska's follow-up report on the December 2025 Poland energy-sector attack reveals a second, previously undisclosed CHP-plant sabotage reached via a private-APN OT access path never before documented in a real-world intrusion"
    sources:
      - { url: "https://cert.pl/en/posts/2026/08/incident-follow-up-report-energy-sector-2025/", publisher: "CERT Polska (NASK)", date: "2026-08-08", role: "primary" }
      - { url: "https://cert.pl/uploads/docs/CERT_Polska_Energy_Sector_Incident_Follow_up_Report_2025.pdf", publisher: "CERT Polska (NASK) — full 19-page technical report", date: "2026-08-08", role: "primary" }
      - { url: "https://cert.pl/en/posts/2026/01/incident-report-energy-sector-2025/", publisher: "CERT Polska (NASK) — initial incident report", date: "2026-01-30", role: "background" }
    discovery_trace: "first seen at: cert-pl, URL https://cert.pl/en/rss.xml (item dated 08 Aug 2026 18:00 +0100) -> primary: CERT Polska announcement, URL https://cert.pl/en/posts/2026/08/incident-follow-up-report-energy-sector-2025/ -> primary detail: CERT Polska 19-page PDF technical report, URL https://cert.pl/uploads/docs/CERT_Polska_Energy_Sector_Incident_Follow_up_Report_2025.pdf -> background: CERT Polska initial report (30 Jan 2026), URL https://cert.pl/en/posts/2026/01/incident-report-energy-sector-2025/"
    summary: |
      CERT Polska published a follow-up technical report (presented in parallel at DEF CON 2026 by CERT Polska head
      Marcin Dudek) disclosing that the 29 December 2025 coordinated attack on Poland's energy sector — previously
      described as hitting 30+ wind/solar Grid Connection Points and one large CHP plant — also destructively hit a
      second, smaller combined heat-and-power (CHP) plant supplying heat to ~50,000 residents, an event not included
      in the January 2026 initial report because the three-month forensic investigation was still ongoing. The attacker
      pivoted from an already-compromised wind-farm substation (FortiGate VPN/firewall, internet-exposed with
      no MFA on device-local accounts) via SSH tunneling through a Teltonika RUTX50 cellular router into the
      Distribution System Operator's private APN (Access Point Name) mobile network — the channel DSOs use for
      DNP3.0 SCADA-to-RTU telecom — and from there reached a WAGO PFC200 PLC with an internet-facing (WAN-side)
      web admin interface still on default "admin" credentials. CERT Polska assesses this is the first documented
      real-world use of a private-APN pivot to reach an OT network, enabled by a misconfiguration allowing arbitrary
      client-to-client communication inside the APN — a configuration the report says is common in Poland and
      believed widespread internationally. After a week of reconnaissance (scanning for S7/102, Modbus/502,
      CODESYS/11740, RTSP/554, RDP, VNC, HTTP/S), the attacker connected to three Siemens PLCs (S7-300, S7-1200,
      S7-1500) via the S7 protocol on 29 December, switched them to STOP mode and password-locked them — shutting
      down the steam turbine and process-water treatment system and interrupting cogeneration (short outage only,
      no customer heat/power loss) — then reconfigured seven Moxa serial device servers and three Moxa switches to
      unreachable IPs (127.0.0.1) and new passwords to delay recovery, and finally corrupted the WAGO controller's
      partition table and factory-reset the Teltonika router and FortiGate to destroy logs. Operator recovery
      (factory-reset + logic-backup reload on the Siemens PLCs) restored service but also deleted controller logs;
      Siemens Product CERT confirmed they were unrecoverable.
    region_nexus: "Poland / EU — energy-sector critical infrastructure; the private-APN architecture the report flags as commonly deployed by DSOs 'in Poland' and 'widely used in other countries around the world', including any DSO/RTU telemetry design serving Swiss or other European utilities"
