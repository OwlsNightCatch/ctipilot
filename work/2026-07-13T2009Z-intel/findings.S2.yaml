  - title: "Swiss Armed Forces Cyber Command drops Microsoft 365 for OpenDesk by October, citing US CLOUD Act exposure"
    sources:
      - { url: "https://www.republik.ch/2026/07/09/die-cyber-spezialisten-des-bundes-kehren-microsoft-den-ruecken", publisher: "Republik (investigative)", date: "2026-07-09", role: "primary" }
      - { url: "https://www.heise.de/en/news/Swiss-Army-breaks-with-Microsoft-Cyber-Command-relies-on-Open-Source-11361516.html", publisher: "heise online", date: "2026-07-10", role: "corroborating" }
      - { url: "https://www.inside-it.ch/kommando-cyber-verabschiedet-sich-von-microsoft-20260713", publisher: "inside-it.ch", date: "2026-07-13", role: "corroborating (link discovered via RSS; article body blocked by anti-bot on both direct fetch and jina reader — cited for its in-window republication timestamp, not as the fetched-content source)" }
    discovery_trace: >
      first seen at: inside-it-ch (RSS feed), URL https://www.inside-it.ch/rss.xml (item:
      https://www.inside-it.ch/kommando-cyber-verabschiedet-sich-von-microsoft-20260713, published
      2026-07-13T12:13:29Z — both direct fetch and jina reader blocked/challenged on this specific article)
      -> WebSearch ("Kommando Cyber Opendesk Microsoft 365 Schweizer Armee US Cloud Act")
      -> primary: Republik investigative report, URL https://www.republik.ch/2026/07/09/die-cyber-spezialisten-des-bundes-kehren-microsoft-den-ruecken
      -> corroborating: heise online, URL https://www.heise.de/en/news/Swiss-Army-breaks-with-Microsoft-Cyber-Command-relies-on-Open-Source-11361516.html
    summary: |
      The Swiss Armed Forces' Cyber Command and its CEA sub-unit (Dienst für Cyber- und elektromagnetische
      Aktionen) will equip all staff with the open-source OpenDesk suite by October 2026, replacing
      Microsoft 365 — confirmed to investigative outlet Republik by the Federal Chancellery (Bundeskanzlei)
      on request, and independently reported by heise online. Cyber Command chief Simon Müller states that
      "as long as companies are subject to laws like the US CLOUD Act, they are no longer usable for
      certain military contexts," citing the risk of a hidden "call home" function silently exfiltrating
      data to foreign security authorities; Microsoft has moved email, documents, calendar and video-
      conferencing entirely into its own cloud, ending the prior arrangement where sensitive federal data
      stayed in Switzerland's own data centres. OpenDesk is built by Germany's Centre for Digital Sovereignty
      (Zendis) and is already used in pilot form by Switzerland's Federal Chancellery (feasibility-study
      results now delayed to mid-August 2026) and by Germany's Bundeswehr IT house (BWI) and public-health
      administration; Austria's armed forces are separately migrating to LibreOffice. Parliament allocated
      CHF 10 million in December 2025 specifically to fund Cyber Command's contribution to European
      open-source alternatives. Cyber Command's IT-savvy staff run OpenDesk in their own data centres under
      full self-managed control, sidestepping deficiencies (missing desktop apps, no telephony integration,
      unclear migration cost) that a City of Zurich study found would block a near-term OpenDesk switch for
      general civil-administration use.
