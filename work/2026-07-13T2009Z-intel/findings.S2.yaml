      2026-07-13/fsb-centre-16-static-tundra-router-hijacking-advisory (published from this morning's
      12:12Z run). That entry covered the 19-agency joint advisory on Static Tundra/Berserk Bear router
      hijacking (SNMP + CVE-2018-0171) and the UK/EU attribution + sanctions for the 29 Dec 2025 Poland
      grid attack. THIS item covers the sibling FSB Centre 16 cluster (Turla/Secret Blizzard) specifically
      — its own French victimology (2017-2025), its own initial-access TTPs (phishing, watering holes,
      webmail/browser exploitation), its own named sanctioned enabler companies (AO AST, NPP Gamma), and a
      wider EU country-impact list (Germany, Poland, Cyprus, NL, Austria, Slovakia, Romania, Finland) plus
      separate UK sanctions on 24 individuals/organisations. Given the depth and distinctness of the new
