      -> reference: French MFA attribution statement page, URL https://www.diplomatie.gouv.fr/fr/presse-et-ressources/decouvrir-et-informer/actualites/attribution-a-la-russie-d-activites-cyber-malveillantes-a-des-fins-d-espionnage-en-france
    summary: |
      On 13 July 2026 France's Cyber Crisis Coordination Centre (C4 — ANSSI, COMCYBER, DGA, DGSE, DGSI
      and the Ministry for Europe and Foreign Affairs) and the EU High Representative jointly attributed
      the Turla intrusion set to the 16th Centre of Russia's FSB, publishing CERT-FR's technical report
      CERTFR-2026-CTI-005/004 alongside formal French and EU diplomatic attribution statements. This is a
      companion but technically distinct disclosure to the same-day 19-agency Static Tundra/Berserk Bear
      router-hijacking advisory already covered this morning: COMCYBER explicitly states Turla and Berserk
      Bear are separate "modes opératoires d'attaque" (MOAs) run by the same FSB parent unit — Turla for
      espionage since at least 2004, Berserk Bear for the December 2025 Polish grid-sabotage attack. ANSSI
      names Military Unit 61240 as one of eleven FSB interception centres, specifically tasked with
      targeting France and closely tied to two Russian firms newly sanctioned by the EU for enabling FSB
      offensive-cyber operations — AO AST (Advanced System Technology, already US-sanctioned in 2021) and
      NPP Gamma. Documented French victims include Ministry of Armed Forces webmail accounts (compromised
      since 2017), the network of the French Embassy in Moscow (2018), a justice-sector personnel-training
      host (2019) and an advanced-technology company (2025), plus opportunistic intermediary compromises
      across varied sectors between 2021 and 2025 used as relay infrastructure. Initial-access chains
      combine spearphishing and watering-hole attacks that lure targets into downloading malicious files
      masquerading as legitimate software, plus exploitation of vulnerabilities in webmail/messaging
      services, browsers, business applications and web servers; the operators favour rented or
      previously-compromised infrastructure — including hijacked Iranian servers used for camouflage — to
      resist detection. The EU sanctioned 9 individuals and 4 organisations (entry bans, asset freezes) and
      the UK sanctioned 24 individuals/organisations in coordination; affected EU/NATO countries named in
      the EU Council statement include Germany (government-institution targeting) and Poland (attempted
      sabotage of heating plants and rail networks), plus Cyprus, the Netherlands, Austria, Slovakia,
      Romania and Finland.
    region_nexus: "Home-region direct: France (neighbouring EU state) plus EU/NATO-wide (Germany, Poland, Cyprus, Netherlands, Austria, Slovakia, Romania, Finland named); companion coordinated action to the UK/EU Static Tundra advisory covered earlier today."
