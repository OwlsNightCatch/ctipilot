- code: F3
  category: claim-not-supported
  section: france-eu-turla-fsb-centre-16-attribution-french-victimology
  item: "France/EU attribute Turla to FSB Centre 16 (update_of morning Static Tundra entry)"
  url_or_quote: "France's COMCYBER frames Turla and Berserk Bear as separate attack modes run by the same FSB 16th Centre — Turla for intelligence-gathering since at least 2004, Berserk Bear for the Polish grid sabotage ([COMCYBER, 2026-07-13])"
  summary: "Fetched the cited COMCYBER page (defense.gouv.fr) in full: it discusses ONLY the Turla MOA (attributed to FSB 16th Centre, active since 2004, intelligence collection) and, as separate background, APT28/GRU. It never mentions Berserk Bear, Static Tundra, the Polish grid, or sabotage. The 'Turla for intelligence since 2004' clause IS supported; the 'Berserk Bear as separate attack mode of the same centre / Berserk Bear for the Polish grid sabotage' clause is NOT in the cited source. The sourcing_note's assertion 'the Turla-vs-Berserk-Bear same-unit framing is COMCYBER's' is therefore inaccurate. The umbrella framing is corpus-true (established by the morning update-parent entry and the EU Council statement per heise 'FSB 16th Center, which controls groups like Turla'), so the fix is to re-attribute the Berserk-Bear/Poland clause to the correct basis (the morning entry / EU Council) or soften, not to delete the fact."
- code: F4
  category: hallucinated-fact
  section: russia-ip-camera-hijacking-nato-military-supply-routes
  item: "AIVD/MIVD IP-camera hijacking along NATO supply routes"
  url_or_quote: "including consumer IP cameras and smart doorbells, not only professional CCTV (body); consumer IP cameras and doorbells with default passwords (summary)"
  summary: "Fetched both cited NL Times/ANP articles (07-11 and 07-13) in full via the bridge. The 07-11 body states: 'the hackers targeted IP cameras... The systems included cameras used by businesses' and 'Many are poorly secured because they still use default passwords or outdated firmware.' Neither cited source mentions 'smart doorbells' or 'consumer IP cameras', nor draws a consumer-vs-professional-CCTV distinction; the 07-11 source in fact emphasises cameras USED BY BUSINESSES. The 'smart doorbells / consumer IP cameras, not only professional CCTV' framing is unsupported by the cited sources (the AIVD/MIVD bulletin that might carry it is explicitly noted as not reachable and is not cited). Core story (IP cameras, default creds/outdated firmware) is solid; the doorbell/consumer embellishment should be dropped or re-sourced."
