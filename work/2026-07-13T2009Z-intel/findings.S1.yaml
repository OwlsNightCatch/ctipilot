  - title: "@zereight/mcp-gitlab (GitLab MCP server) path traversal lets an AI agent's own GitLab PAT be redirected to arbitrary API endpoints (CVE-2026-61462)"
    sources:
      - { url: "https://euvd.enisa.europa.eu/", publisher: "ENISA EUVD (EUVD-2026-43504)", date: "2026-07-13", role: primary }
      - { url: "https://github.com/zereight/gitlab-mcp/issues/587", publisher: "zereight/gitlab-mcp (GitHub issue)", date: "2026-07-13", role: corroborating }
      - { url: "https://github.com/zereight/gitlab-mcp/commit/e2a81a047ab8750fa5bfa1763b5d85e5616f3994", publisher: "zereight/gitlab-mcp (patch commit)", date: "2026-07-13", role: corroborating }
    discovery_trace: "first seen at: enisa-euvd bridge (recent criticals), URL https://euvd.enisa.europa.eu/ → primary: ENISA EUVD record EUVD-2026-43504, URL https://euvd.enisa.europa.eu/ → corroboration: GitHub issue #587 and patch commit, URL https://github.com/zereight/gitlab-mcp/issues/587"
    summary: |
      mcp-gitlab (npm package @zereight/mcp-gitlab), a third-party Model Context Protocol server that gives
      AI coding agents GitLab access, carries a path-traversal vulnerability (CVE-2026-61462, CVSS 4.0: 9.2)
      in the job_id parameter of build/index.js. An attacker able to influence the job_id value supplied to
      the MCP tool call — e.g. via a malicious prompt, a poisoned repository, or an untrusted CI artifact fed
      to the agent — can supply crafted values such as ../../../user to escape the intended GitLab API path
      prefix and redirect the request to arbitrary GitLab API resources, executed using the operator's own
      personal access token. This is a further instance of the broader agentic-tooling exposure pattern
      already flagged for MCP servers (indirect prompt injection into tool-call parameters escalating to
      abuse of the operator's own credentials) rather than a novel technique class. Fixed via GitHub commit
      e2a81a047ab8750fa5bfa1763b5d85e5616f3994. No exploitation reported.
    region_nexus: "global; relevant to any organization whose developers use AI coding agents wired to GitLab via this MCP connector"
    primary_sector_nexus: "indirect"
    sector: "cross-sector"
