items:
  - title: "Rejetto HFS < 3.2.1: predictable session-signing PRNG lets unauthenticated attackers forge admin sessions to RCE (six-CVE chain, CVE-2026-61500)"
    sources:
      - { url: "https://www.vulncheck.com/advisories/rejetto-hfs-session-forgery-via-predictable-signing-key", publisher: "VulnCheck", date: "2026-07-13", role: primary }
      - { url: "https://euvd.enisa.europa.eu/", publisher: "ENISA EUVD (EUVD-2026-43505)", date: "2026-07-13", role: corroborating }
      - { url: "https://github.com/rejetto/hfs/releases/tag/v3.2.1", publisher: "Rejetto (GitHub release)", date: "2026-07-13", role: corroborating }
      - { url: "https://cve.threatint.eu/CVE/CVE-2026-61500", publisher: "THREATINT CVE aggregator", date: "2026-07-13", role: corroborating }
    discovery_trace: "first seen at: enisa-euvd bridge (recent criticals), URL https://euvd.enisa.europa.eu/ → primary: VulnCheck advisory, URL https://www.vulncheck.com/advisories/rejetto-hfs-session-forgery-via-predictable-signing-key → corroboration: Rejetto GitHub release notes, URL https://github.com/rejetto/hfs/releases/tag/v3.2.1 → corroboration: THREATINT CVE record, URL https://cve.threatint.eu/CVE/CVE-2026-61500"
    summary: |
      VulnCheck (finder: Zach Hanley/Horizon3.ai, with Anthropic Research) disclosed a six-CVE vulnerability
      chain in Rejetto HFS (HTTP File Server) 3.0.0 through 3.2.0, all fixed in 3.2.1 (2026-07-13). The
      headline bug, CVE-2026-61500 (CVSS 3.1: 9.8 / CVSS 4.0: 9.3, CWE-338 weak PRNG), derives the
      session-cookie HMAC signing key from JavaScript's non-cryptographic Math.random() and leaks generator
      outputs to unauthenticated clients on the login endpoint. An attacker who collects a small number of
      login responses can reconstruct the PRNG's internal state, recover the signing key, and forge a valid
      administrator session cookie — reaching full admin access and RCE via HFS's built-in server_code
      configuration feature (arbitrary server-side script execution). No authentication or user interaction
      is required. The companion bugs in the same disclosure lower the bar further: CVE-2026-61503 (username
      enumeration via login-endpoint response differences, incl. the default admin account), CVE-2026-61502
      (state-changing admin actions accepted over GET with no anti-CSRF check — including code execution
      with zero credentials on default installs when the request originates from the server's own machine),
      CVE-2026-61501 (unauthenticated stored XSS via a crafted failed-login username reflected unsanitized
      into the admin error log, executing when an admin views logs), CVE-2026-61504 (stored XSS via
      unescaped filenames in HFS's fallback "basic" listing, forceable via ?get=basic, exploitable by
      anonymous uploaders on open-upload servers), and CVE-2026-61505 (path traversal via the lang query
      parameter, limited to reading specific JSON files outside shared folders). Rejetto HFS 2.x has a
      well-documented history of rapid post-disclosure weaponization by opportunistic ransomware and
      cryptomining botnets (e.g. CVE2024-23692); no in-the-wild exploitation of this 3.x chain has been
      reported yet, but the pre-auth, internet-facing, patch-just-shipped profile matches that pattern
      closely.
    region_nexus: "global; any Swiss/EU organization running an internet-exposed Rejetto HFS instance for ad-hoc file sharing is at risk — this product class has historically been a favored opportunistic-botnet target"
    primary_sector_nexus: "indirect"
    sector: "cross-sector"
    cves: [CVE-2026-61500, CVE-2026-61501, CVE-2026-61502, CVE-2026-61503, CVE-2026-61504, CVE-2026-61505]
    techniques: [T1190]
    affected_products: ["Rejetto HFS (HTTP File Server)"]
    entity_keys: []
