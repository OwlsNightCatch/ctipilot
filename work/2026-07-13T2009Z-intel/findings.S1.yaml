    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Rejetto HFS 3.0.0 through 3.2.0 derives its session-cookie signing key from the non-cryptographic Math.random() generator and discloses outputs of the same generator to unauthenticated clients during login."
        attribution: "VulnCheck"
        source_url: "https://www.vulncheck.com/advisories/rejetto-hfs-session-forgery-via-predictable-signing-key"
      - quote: "A remote attacker can collect a small number of login responses, reconstruct the generator's state, recover the signing key, and forge a valid administrator session cookie, leading to full administrative access and remote code execution via the server_code configuration feature."
        attribution: "VulnCheck"
        source_url: "https://www.vulncheck.com/advisories/rejetto-hfs-session-forgery-via-predictable-signing-key"
    extended_notes: |
      Detection concept: HFS instances log HTTP requests; look for repeated rapid login attempts from a
      single source ahead of a successful admin-cookie-bearing session with no prior credential-setting
      event — the PRNG-recovery attack requires "a small number" of login responses collected in sequence,
      which should show as a short burst of /login (or equivalent) requests immediately followed by
      privileged actions (server_code edits, account creation) from the same session. Hardening: upgrade to
      3.2.1; if upgrade is not immediately possible, do not expose HFS admin interfaces to the internet and
      disable the server_code feature. No IOC-level detail published (session tokens/keys are per-instance
      and not reusable across deployments).
    watchlist: []

  - title: "ServiceNow AI Platform sandbox escape (CVE-2026-6875) lets unauthenticated requests execute code on the platform — patched 2026-07-13"
    sources:
      - { url: "https://support.servicenow.com/kb?id=kb_article_view&sysparm_article=KB3137947", publisher: "ServiceNow (vendor security KB / PSIRT)", date: "2026-07-13", role: primary }
      - { url: "https://euvd.enisa.europa.eu/", publisher: "ENISA EUVD (EUVD-2026-43520)", date: "2026-07-13", role: corroborating }
    discovery_trace: "first seen at: enisa-euvd bridge (recent criticals), URL https://euvd.enisa.europa.eu/ → primary: ServiceNow vendor security KB, URL https://support.servicenow.com/kb?id=kb_article_view&sysparm_article=KB3137947"
    summary: |
      ServiceNow published KB3137947 (initial publication 2026-07-13, article created 2026-07-08) disclosing
      CVE-2026-6875, a "Sandbox Escape in ServiceNow AI Platform" rated CVSS 4.0: 9.5. Per ServiceNow's own
      description, the flaw "could enable an unauthenticated user, in certain circumstances, to execute code
      within the ServiceNow platform" — a sandbox-isolation failure in the AI Platform's code-execution
      environment, the same general vulnerability class as the earlier ServiceNow AI Platform sandbox-escape
      RCE disclosed in January 2026 (CVE-2026-0542, already patched, not tracked in this pipeline). ServiceNow
      states it has already deployed the fix to its own hosted instances; self-hosted customers and partners
      must apply the listed patches themselves (fixed releases: Brazil EA/GA, Australia Patch 2, Zurich Patch
      7b/9, Yokohama Patch 12 Hot Fix 1b/13). ServiceNow states it is "not currently aware of exploitation
      against ServiceNow instances." ServiceNow's AI Platform (Now Assist / AI Agents) underpins ITSM,
      HR-service-delivery and case-management workflows widely deployed across public-sector and critical-
      infrastructure operators, making self-hosted/partner-managed instances that have not yet applied the
      patch the residual exposure to track.
    region_nexus: "global; ServiceNow is broadly deployed across Swiss/European public-sector ITSM and case-management environments — self-hosted/partner-managed instances are the residual exposure until patched"
    primary_sector_nexus: "direct"
    sector: "public-sector, cross-sector"
