items:
  - title: "Lidl discloses online-shop customer data theft from an unnamed IT service provider, hitting Germany, Belgium and the Netherlands"
    sources:
      - { url: "https://www.bleepingcomputer.com/news/security/lidl-discloses-online-shop-breach-after-service-provider-hack/", publisher: "BleepingComputer", date: "2026-07-13", role: "primary" }
      - { url: "https://www.helpnetsecurity.com/2026/07/13/lidl-data-breach-customer-data/", publisher: "Help Net Security", date: "2026-07-13", role: "corroborating" }
      - { url: "https://nltimes.nl/2026/07/10/supermarket-chain-lidl-warns-customers-data-leak", publisher: "NL Times (ANP wire)", date: "2026-07-10", role: "corroborating" }
    discovery_trace: "first seen at: bleepingcomputer, URL https://www.bleepingcomputer.com/news/security/lidl-discloses-online-shop-breach-after-service-provider-hack/ (2026-07-13, published after the prior 12:12Z run) → corroboration: Help Net Security, URL https://www.helpnetsecurity.com/2026/07/13/lidl-data-breach-customer-data/ → corroboration: NL Times, URL https://nltimes.nl/2026/07/10/supermarket-chain-lidl-warns-customers-data-leak (first Dutch notification, confirms Dutch DPA notified) → no vendor/service-provider name disclosed by Lidl in any fetched source"
    summary: |
      Lidl (Schwarz Group) notified online-shop customers in Germany, Belgium and the Netherlands that
      "unknown individuals briefly gained access to a separately stored file containing customer data" at
      an external IT service provider — Lidl has not named the provider. Exposed fields are salutation,
      first/last name, phone number, email address, date of birth, customer number, and (per German press)
      order metadata from Jan-Jun 2026. Lidl states the online-shop application itself, passwords, billing/
      shipping addresses, and payment/bank data were not affected, and that it has no evidence of misuse to
      date. Lidl notified the Dutch Data Protection Authority, engaged forensic experts, and filed a police
      report; the company is warning customers of follow-on phishing risk using the exposed PII. No threat
      actor or extortion group has claimed the breach and no ransomware leak-site listing has surfaced —
      this reads as a straight third-party/vendor-side data exposure rather than a ransomware event. The
      access vector into the service provider itself has not been disclosed.
