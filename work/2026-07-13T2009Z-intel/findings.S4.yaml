    extended_notes: |
      Distinct from the already-covered 2026-07-13 FSB Centre 16/Static Tundra router-hijacking joint
      advisory (2026-07-13/fsb-centre-16-static-tundra-router-hijacking-advisory, already in prior
      coverage) — that item is about SNMP/Cisco Smart Install router compromise for network-configuration
      exfiltration; this item is about consumer/commercial IP-camera hijacking for physical-logistics
      surveillance. Both surfaced the same day as part of a coordinated Western response to Russian
      hybrid/cyber activity, but are separate technical stories with separate primaries. No specific Russian
      APT codename was given in the AIVD/MIVD reporting fetched this run; WebSearch surfaced background
      that UK/allies attributed a similar camera-targeting pattern to APT28/GRU Unit 26165 in May 2025, but
      that link was not stated in the 2026-07-11/07-13 disclosures fetched here, so it is not carried as a
      confirmed attribution — flagged as background only. Confidence set to MEDIUM rather than HIGH because
      this run could not directly fetch the AIVD/MIVD's own bulletin (only ANP-wire secondary reporting,
      itself Admiralty B/2 given AIVD/MIVD is a national authority acting as primary discloser of its own
      finding, corroborated across many outlets per WebSearch but not independently fetched here).
