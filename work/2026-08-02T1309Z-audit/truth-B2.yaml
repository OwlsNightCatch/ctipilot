- entry: entries/2026-07-26/weekly-w30-ai-autonomous-operator-and-target.md
  verdict: factual-error
  machine_surface: false
  defect: >-
    The entry frames the Searchlight Cyber GPT-5.6 WordPress WP2Shell case as AI "rediscovering and
    weaponising the already-patched" pre-auth chain (headline: "an LLM rebuilt a patched exploit chain
    for ~$25"; body: "tasking GPT-5.6 with autonomously rediscovering and weaponising the already-patched
    WordPress 'WP2Shell' pre-auth chain"), but the cited Searchlight Cyber source states the opposite
    trajectory: GPT-5.6 made an ORIGINAL discovery of an unpatched pre-auth RCE, and the researcher
    "held off on publishing this issue to give defenders a chance to upgrade their WordPress instances
    over the weekend" -- i.e. the vulnerability was not yet patched when the AI found it; Searchlight
    delayed disclosure until a fix was available. The article never uses "rediscover," "already patched,"
    or "already known," and explicitly frames the find as novel ("I didn't quite believe this at first,
    as WordPress ... hadn't had any meaningful pre-auth vulnerabilities this decade").
  ground_truth: >-
    Searchlight Cyber (slcyber.io, 2026-07-20): GPT-5.6 Sol Ultra autonomously discovered a NEW
    pre-auth RCE chain in WordPress core (batch-API validation/execution desync + SQLi + oEmbed cache
    poisoning) in ~10 hours for ~$25 in model usage; the researcher withheld publication to let WordPress
    ship a fix first. Rapid7's independent CVE-2026-63030/-60137 write-up separately confirms Searchlight
    Cyber "identified the vulnerability" (disclosed 2026-07-17, patched in 6.9.5/7.0.2, later exploited
    in the wild and KEV-listed 2026-07-21) -- so the WP2Shell CVE was patched roughly concurrently with
    Searchlight's own disclosure, not before or independent of the AI's discovery.
  ground_truth_url: "https://slcyber.io/research-center/exploit-brokers-pay-500000-for-a-wordpress-rce-i-found-one-with-gpt5-6/"
