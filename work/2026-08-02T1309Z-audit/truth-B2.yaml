- entry: entries/2026-07-26/weekly-w30-joomla-extension-wave-status.md
  verdict: imprecision
  machine_surface: false
  defect: >-
    The body asserts three distinct vulnerability claims -- "unauthenticated SQL injection and
    order-forgery in EasyStore" and "an invoice IDOR in Events Booking" -- with NO inline citation
    attached to the sentence, and neither product has a corresponding record in frontmatter `sources[]`
    (only the two Gridbox/Membership-Pro mySites.guru URLs are listed). The underlying facts are real
    and independently confirmable (mySites.guru did publish both disclosures), but the entry does not
    cite them anywhere, violating the inline-citation requirement. Additionally `affected_products[]`
    lists only "Balbooa Gridbox for Joomla" even though the body discusses four distinct products
    (Gridbox, Membership Pro, EasyStore, Events Booking).
  ground_truth: >-
    mySites.guru separately published "EasyStore Joomla Security Vulnerabilities" (CVE-2026-65759
    order-forgery, CVE-2026-65760 invoice disclosure, CVE-2026-65761 SQL injection, fixed in EasyStore
    2.0.2, 2026-07-23) and "Events Booking Upload & Enumeration Flaws" (CVE-2026-58149/-60024/-60025,
    unauthenticated file upload + user-enumeration + cross-customer order/invoice leak, fixed in
    5.8.1 / 4.9.5) -- both real, both attributable, neither cited in this entry.
  ground_truth_url: "https://mysites.guru/blog/easystore-security-disclosure/"
- entry: entries/2026-07-26/weekly-w30-looking-ahead.md
  verdict: imprecision
  machine_surface: false
  defect: >-
    Body states "anyone running internet-facing nginx should complete the F5 out-of-band patch before
    that window closes in early August," but the entry's sole cited source for the nginx item
    (cyberstan.co.uk, 2026-07-19) describes the fix as "scheduled for the F5 Security Advisory on 15
    July 2026" -- i.e. a regular/planned release, not an emergency out-of-band one -- and never uses
    the phrase "out-of-band." The underlying fact that F5 did in fact ship this as an out-of-band
    update is independently true (corroborated by BleepingComputer and others) but is not supported
    by the page actually cited in this entry.
  ground_truth: >-
    cyberstan.co.uk's disclosure timeline reads "The fix is scheduled for the F5 Security Advisory on
    15 July 2026 with a CVE assignment" -- framed as a scheduled release, with no "out-of-band"
    language anywhere on the page. (Separately, BleepingComputer and other outlets not cited by this
    entry do describe F5's July release as an out-of-band patch bundle, so the underlying fact is
    true; only the citation-to-claim link is broken.)
  ground_truth_url: "https://cyberstan.co.uk/nginx-rce/"
