- entry: entries/2026-07-29/minnesota-30-water-utilities-coordinated-ot-attack.md
  verdict: imprecision
  machine_surface: false
  defect: >-
    The frontmatter `summary` asserts the coordinated attack affected "programmable logic
    controllers and cellular-connected equipment at water towers and lift stations"; no cited
    source establishes PLC involvement in the Minnesota event, and the same summary two
    sentences later, the body, and the sourcing_note all say the opposite ("it is unclear
    whether the PLC vector ... was involved", "no source names any controller model involved
    in the Minnesota event"). Only the cellular-equipment half is sourced (Plymouth).
  ground_truth: >-
    StateScoop quotes TJ Sayers of the Center for Internet Security affirming "that the Minnesota
    attacks have not yet been attributed to any particular party, and that 'it is unclear' whether
    the attacks involved the programmable logic controllers CISA warned about". Plymouth's own
    statement scopes its impact to "equipment connected via cellular communications" at two water
    towers and "multiple" lift stations — no controller type is named by any cited source.
  ground_truth_url: https://statescoop.com/coordinated-cyberattack-disrupts-water-utilities-in-30-minnesota-communities/
