- entry: entries/2026-07-30/hashicorp-terraform-mcp-server-hcsec-2026-23-token-exfil.md
  verdict: imprecision
  machine_surface: false
  defect: >-
    `classification.credibility: 1` overstates the corroboration the entry actually shows. The
    only two sources are HashiCorp's own bulletin and BSI CERT-Bund's republication of that same
    bulletin; the entry's own body describes BSI as having "surfaced the bulletin the following
    day". One assessor, two publishers — the pipeline's own Airflow entry from the same window
    reasons this identical shape to credibility 2 and states the rule explicitly. All three CVSS
    scores (8.6 / 8.9 / 10.0) and the 0.3.0→<1.1.0 vs 0.2.1–1.0.0 range discrepancy were verified
    correct against HashiCorp's own CNA records; the truth surface of this entry is sound.
  ground_truth: >-
    Sibling entry entries/2026-07-29/cve-2026-59243-airflow-fab-azure-ad-jwt-signature-bypass.md:
    "Credibility is rated 2 rather than 1 for that same reason: two publishers carry the item, but
    only one of them assessed it, so the claim is authoritative without being independently
    corroborated." BSI WID-SEC-2026-2572 carries no independent analysis of terraform-mcp-server.
  ground_truth_url: https://discuss.hashicorp.com/t/hcsec-2026-23-multiple-vulnerabilities-impacting-hashicorp-terraform-mcp-server/77606
- entry: entries/2026-07-30/hugging-face-openai-artifactory-zero-day-escape-vector.md
  verdict: imprecision
  machine_surface: false
  defect: >-
    The Hugging Face scope statement is presented inside quotation marks as verbatim but is not a
    contiguous substring of the cited post-mortem, and the rewording drops Hugging Face's own
    hedge. The entry renders it as "the only customer content accessed was the set of
    ExploitGym/CyberGym challenge solutions stored in five datasets"; Hugging Face wrote that the
    five datasets' "names and files suggest a connection to" those challenges and solutions. A
    suggestive identification is presented as a definite one, and the leading clause "while the
    intrusion did reach Hugging Face's internal infrastructure," is not visible in the source text.
  ground_truth: >-
    Hugging Face, "Anatomy of a Frontier Lab Agent Intrusion: A Technical Timeline of the July 2026
    Incident" (2026-07-27): "the only customer content accessed was five datasets whose names and
    files suggest a connection to ExploitGym/CyberGym challenges and solutions. No other
    customer-facing models, datasets, Spaces, or packages were affected, and the only customer
    records read were operational metadata tied to search queries against the dataset server."
    All nine Artifactory CVE ids, their severity bands, the branch-specific fixed builds, the
    Anonymous Access precondition quote and both OpenAI quotes verified correct.
  ground_truth_url: https://huggingface.co/blog/agent-intrusion-technical-timeline
