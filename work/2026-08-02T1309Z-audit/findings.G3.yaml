coverage_gaps:
  - source_id: withsecure-labs
    reason: "Page is a client-hydrated Next.js filter/search UI (content-type filters for Article/Blog post/Publications/Reports/Research). Direct WebFetch returned 'No results found'; jina reader (forced) returned only navigation chrome, not the hydrated post grid — the reader did not execute enough of the client JS to populate results. Recipe gap: needs a structured listing endpoint (sitemap, JSON API, or category-filtered URL) not identified this run."
  - source_id: group-ib
    reason: "Bridge fetch of https://www.group-ib.com/blog/ returned HTTP 200 but the byte range read (head -c 6000) captured only <head>/schema.org metadata, not the post-grid HTML — an artefact of my own truncation, not a transport failure. Direct WebFetch separately returned a transient HTTP 503. Net effect: could not confirm whether Group-IB published anything in-window beyond the already-tracked HOLLOWGRAPH (07-21, pre-window)."
  - source_id: huntress
    reason: "Both the documented rss.xml feed and a direct WebFetch of /blog returned posts no newer than 2026-07-13, despite prior_coverage.json confirming Huntress published in-window items (FakeAgent 07-26, SonicWall credential stuffing 07-30, device-code phishing 08-01) that other runs found via a different path. The general /blog feed/listing appears to be a stale or partial index; a category-specific feed (/blog-categories/threat-analysis, /blog-categories/attacker-tradecraft) may be needed."
  - source_id: zscaler-threatlabz
    reason: "WebFetch of https://www.zscaler.com/blogs/security-research returned only marketing/partnership content with no dates past January 2026 visible in the extracted summary — inconsistent with the source record noting this URL as the correct security-research listing (which surfaced TELESHIM/MIXEDKEY/BINDCLOAK on 2026-07-20 per a prior run). Could not confirm absence of a new post in-window; recommend a follow-up direct/bridge fetch with a larger content window."
  - source_id: claroty-team82
    reason: "Listing renders titles only, no dates (documented recipe gap — dates live on the per-post pages). Titles visible match already-known older research (Iran-linked warning-systems op, UPS/data-center, Trane HVAC, EnOcean, Sixnet RTU); none suggest an obviously new in-window post, but this is not date-confirmed."
  - source_id: nozomi-networks
