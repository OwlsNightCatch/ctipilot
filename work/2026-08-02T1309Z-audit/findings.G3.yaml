items:
  - title: "SP Page Builder for Joomla: pre-auth SQL injection reachable via the anonymous-CSRF-token trick, plus a hardcoded shared secret that turns any install into an open mail relay"
    sources:
      - { url: "https://mysites.guru/blog/sp-page-builder-sql-injection-mail-relay-disclosure/", publisher: "mySites.guru", date: "2026-07-27", role: "primary" }
      - { url: "https://cvefeed.io/vuln/detail/CVE-2026-65766", publisher: "cvefeed.io (CVE aggregator)", date: "2026-07-27", role: "corroborating (CVE-existence only, reduced confidence — aggregator)" }
    discovery_trace: "first seen at: mysites-guru, URL https://mysites.guru/blog/ (listing, jina reader) -> drill: https://mysites.guru/blog/sp-page-builder-sql-injection-mail-relay-disclosure/ -> primary: mySites.guru's own disclosure write-up (no further pivot needed, discoverer's own advisory) -> corroboration attempt: WebSearch (\"CVE-2026-65766 OR CVE-2026-65877 SP Page Builder Joomla\") -> cvefeed.io CVE-existence confirmation"
    summary: |
      mySites.guru's own vulnerability-research team found four vulnerabilities in SP Page Builder (JoomShaper's drag-and-drop
      Joomla page builder) 6.7.0 during a follow-on audit, privately reported them, and JoomShaper fixed all four in 6.7.1
      (released 27 July 2026; four CVEs assigned by the Joomla CNA the same day). The most severe, CVE-2026-65766 (CVSS
      3.1 8.7, High), is a SQL injection in the Dynamic Content endpoint's tag-sort feature: the sort `direction` value is
      concatenated raw into the query's ORDER BY clause (dynamic_content.php:232, duplicated at CollectionData.php:2004),
      a position that cannot be safely parameterised. The only control in front of it is a Joomla CSRF token — but Joomla
      issues a valid token to every visitor including anonymous ones on page load, so a scripted attacker simply fetches a
      token and replays it, making this a de-facto pre-authentication SQL injection capable of reading the entire Joomla
      database (accounts, password hashes, site secret). mySites.guru confirmed it with a time-based blind proof on their
      own test install. The second finding (CVE-2026-65877, CVSS 6.9, Medium) is a design flaw, not a slip: the
      `ajax_contact`/`form_builder` contact-form addons sign the configured recipient address with a secret hardcoded
      identically into every shipped copy of the extension (site.php:24, CWE-798) — anyone with the extension can read
      the secret and forge a valid signature, letting an attacker set an arbitrary recipient and a spoofed sender and turn
      any site's own mail server into an open spam/phishing relay. Two secondary weaknesses removed the remaining
      friction: the built-in "default" captcha compares two attacker-controlled values (site.php:460), and the CSRF check
      silently disables itself whenever Joomla page caching is enabled (site.php:257), a common production setting. Two
      further issues need only a low-privileged "author" account: an authenticated SQL injection in the media manager's
      search/date filters (CVE-2026-65878, CVSS 7.1, unescaped input in media.php's getDateFilters()/getTotalMedia()),
      and an authenticated arbitrary file delete (CVE-2026-65879, CVSS 7.2) where the media-delete action removes a
      request-supplied path with no traversal guard (media.php:804) — letting a low-trust author delete configuration.php
      or a protective .htaccess. Affected: SP Page Builder <= 6.7.0 (all versions); fixed in 6.7.1. This is separate from
      SP Page Builder's June 2026 unauthenticated icon-upload zero-day (fixed in 6.6.2) — sites need both fixes. No
      in-the-wild exploitation is reported for these four (contrast with the same publisher's Gridbox and iCagenda
      disclosures this wave, which were exploited). This extends the actively tracked Joomla-extension vulnerability wave
      with a genuinely new technique class within it: a hardcoded-shared-secret design flaw (CWE-798) enabling an open
      mail relay, distinct from the wave's earlier file-upload-RCE and cookie-forgery patterns, and directly relevant to
      any CH/EU municipal or public-sector site running this widely-installed Joomla page builder.
    region_nexus: "global; Joomla and SP Page Builder are commonly deployed by CH/EU municipal and SME public-sector sites (the tracked Joomla-extension wave has repeatedly surfaced in this pipeline's home-region incident coverage)"
    primary_sector_nexus: "indirect"
    sector: "public-sector, cross-sector (any organization running a public Joomla site with SP Page Builder)"
    cves: [CVE-2026-65766, CVE-2026-65877, CVE-2026-65878, CVE-2026-65879]
    techniques: [T1190, T1562.001]
    affected_products: ["SP Page Builder for Joomla (JoomShaper, com_sppagebuilder)"]
    entity_keys: ["trend:joomla-extension-file-upload-rce-wave"]
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "A scripted attacker simply fetches a token and sends it back, so in practical terms this is a pre-authentication SQL injection: an anonymous attacker could read any table in the Joomla database, from user accounts and password hashes to the site secret and every stored record."
        attribution: "mySites.guru"
        source_url: "https://mysites.guru/blog/sp-page-builder-sql-injection-mail-relay-disclosure/"
      - quote: "The problem is the secret: it is a single string hardcoded into the addon source (site.php:24), identical in every copy of SP Page Builder ever shipped. A secret that ships in the product is not a secret."
        attribution: "mySites.guru"
        source_url: "https://mysites.guru/blog/sp-page-builder-sql-injection-mail-relay-disclosure/"
      - quote: "Reported privately, fixed in 6.7.1 on 27 July 2026. The Joomla CNA assigned four CVEs the same day: CVE-2026-65766, CVE-2026-65877, CVE-2026-65878 and CVE-2026-65879"
        attribution: "mySites.guru"
        source_url: "https://mysites.guru/blog/sp-page-builder-sql-injection-mail-relay-disclosure/"
    extended_notes: |
      Recovered by the per-publisher LISTING sweep, not by CVE/KEV discovery — the disclosure is real, dated, and
      CVE-assigned, but no aggregator/CERT feed had surfaced it as of this audit. Consistent with the audit's stated
      purpose (recoverable misses via listing sweeps). Only one independent technical source exists (the discoverer's
      own write-up); the Joomla CNA's same-day CVE assignment corroborates existence/severity but is not a second
      narrative account. mySites.guru's disclosure practice (private report -> vendor fix -> public writeup) is the
      same publisher already cited as primary for other entries in this wave (Gridbox, RSFiles!, Phoca Download,
      Balbooa Forms), so its Admiralty B rating and vendor-facing responsible-disclosure track record are already
      established in sources.json.
    watchlist: null
    borderline: false

  - title: "Astaroth banking trojan adds a headless-browser WhatsApp Web spambot for self-propagation through victims' own contact lists"
    sources:
      - { url: "https://www.crowdstrike.com/en-us/blog/inside-astaroths-new-spambot-component/", publisher: "CrowdStrike", date: "2026-07-29", role: "primary" }
    discovery_trace: "first seen at: crowdstrike (source-list slice record), URL https://www.crowdstrike.com/blog/category/counter-adversary-operations/ (listing, WebFetch) -> primary: https://www.crowdstrike.com/en-us/blog/inside-astaroths-new-spambot-component/ (no pivot needed)"
    summary: |
      CrowdStrike documents (2026-07-29) a new self-propagation component added to Astaroth, an established LATAM-focused
      banking-trojan family, in Q4 2025. The component runs a headless Chrome or Edge instance (WebDriver session with
      automation indicators stripped so no browser window is ever shown to the victim) and drives it against WhatsApp Web
      using the WPPConnect JavaScript automation library to enumerate the logged-in victim's own contact list. It filters
      out group chats, broadcast lists and non-Brazil phone numbers, then composes and sends multilingual spam messages
      carrying Astaroth downloader links to the victim's real contacts — turning every successful infection into a
      self-propagation node riding a trusted messaging platform rather than email. CrowdStrike also reports code overlap
      between this spambot and one used by a separate malware family, Vareg, which it assesses "highly likely" indicates
      shared authorship or a code-sharing arrangement between the two toolsets' operators. Victimology is explicitly
      Brazil-scoped (the component actively filters for Brazilian numbers), so this is not a direct CH/EU CI/government
      targeting item; it is included for the transferable technique — headless-browser automation of a legitimate,
      widely-used messaging platform (WhatsApp Web has substantial personal and SME use across Switzerland/Europe) as a
      self-propagating malware-distribution channel, a pattern likely to be reused against other regions' user bases of
      the same platform.
    region_nexus: "Brazil/LATAM-scoped victimology; technique (headless-browser automation of a trusted messaging platform for self-propagation) is transferable to any WhatsApp Web user base, including in Switzerland/Europe"
    primary_sector_nexus: "none (consumer/SME banking-fraud victimology, not CI/government)"
    sector: "finance (consumer banking fraud), cross-sector for the technique class"
    cves: []
    techniques: [T1566, T1204.002]
    affected_products: []
    entity_keys: []
    new_entities:
      - { key: "malware:astaroth", type: malware, name: "Astaroth",
          aliases: [],
          summary: "Long-running LATAM/Brazil-focused banking trojan; per CrowdStrike (2026-07-29) its developer added a headless-browser WhatsApp Web spambot component (WPPConnect-driven) for self-propagation via victims' own contact lists, sharing code with the Vareg spambot." }
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "By running a browser instance in headless mode and stripping automation indicators from a WebDriver session, the spambot conducts its entire spam campaign without ever displaying a browser window to the victim."
        attribution: "CrowdStrike"
        source_url: "https://www.crowdstrike.com/en-us/blog/inside-astaroths-new-spambot-component/"
      - quote: "The code overlap between the Astaroth and Vareg spambots highly likely indicates that the same threat actor developed both spambots or that the actors operating the two toolsets have a code-sharing arrangement."
        attribution: "CrowdStrike"
        source_url: "https://www.crowdstrike.com/en-us/blog/inside-astaroths-new-spambot-component/"
    extended_notes: |
      Recovered by the per-publisher listing sweep (CrowdStrike's counter-adversary-operations listing shows this as
      its most recent dated item, 2026-07-29, ahead of the "Black Hat special" newsletter posts) — no CVE/KEV channel
      would have surfaced it, matching the audit's stated recoverable-miss pattern. Flagged borderline given the
      Brazil-only victimology; the main agent should weigh transferable-technique value (trusted-platform-driven
      self-propagation) against the strict regional/sector relevance gate.
    watchlist: null
    borderline: true
    borderline_reason: "Victimology explicitly Brazil/LATAM-scoped (component filters for Brazilian phone numbers); included only for the transferable self-propagation-via-trusted-platform technique, not for direct constituency nexus."

