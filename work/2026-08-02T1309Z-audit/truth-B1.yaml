- entry: entries/2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave.md
  verdict: factual-error
  machine_surface: true
  defect: "1. cves[] records CVE-2026-62415 as `type: rce`; the discloser's own page states the opposite for shipped defaults — the impact is anonymous file writes constrained to image/document types, and it 'rises to unauthenticated remote code execution only on a site whose allowed file types have been widened to include an executable type'. 2. The summary states 'The mySites.guru research campaign against Joomla third-party extensions produced six further disclosures between 2026-07-20 and 2026-07-23' and the body frames the batch as 'the same research campaign continuing'; the Membership Pro page says explicitly 'We did not discover or report the Membership Pro flaw.' 3. sourcing_note states 'Scores are CVSS 4.0' — CVE-2026-62415's 9.1 is CVSS 3.1 per the same page ('9.1 critical (CVSS 3.1, AV:N/AC:L/PR:N/UI:N/C:H/I:H/A:N)') — and states 'Events Booking carries none' while cves[].cvss is null, though the discloser assesses CVE-2026-63047 at CVSS 4.0 8.7 (only the Joomla CNA published no score)."
  ground_truth: "mySites.guru Membership Pro post: 'We did not discover or report the Membership Pro flaw. We reported the identical anonymous upload flaw in Events Booking… The Membership Pro issue is now tracked separately as CVE-2026-62415, assigned by the Joomla project's CNA and rated 9.1 critical (CVSS 3.1). One piece of nuance to that critical rating: on a default configuration the practical impact is anonymous file writes constrained to image and document types, which is serious but not a web shell.' Events Booking post: 'Our assessment is CVSS 4.0 8.7 (High)… The Joomla CNA published CVE-2026-63047 for the flaw on 22 July 2026 without a score of its own.' (Gridbox 10.0/CVSS 4.0 discloser-assessed, EasyStore 8.7/9.2/9.3 Joomla-CNA scores, and all fixed versions verified correct.)"
  ground_truth_url: "https://mysites.guru/blog/membership-pro-unauthenticated-file-upload/"
