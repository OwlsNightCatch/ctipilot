  - title: "Xen Project — 18 CVEs across 10 Xen Security Advisories (XSA-499 to XSA-508), cross-tenant RAM disclosure and host crash in grant-table/PoD/event-channel code; affects Citrix XenServer and XCP-ng too"
    sources:
      - { url: "https://ccb.belgium.be/advisories/warning-multiple-severe-vulnerabilities-xen-project-patch-immediately", publisher: "Centre for Cybersecurity Belgium (CCB)", date: "2026-07-30", role: "primary" }
      - { url: "https://xenbits.xenproject.org/xsa/", publisher: "Xen Project (official XSA index)", date: "2026-07-28", role: "primary" }
    discovery_trace: "first seen at: ccb-belgium, URL https://ccb.belgium.be/advisories (listing, jina reader) → https://ccb.belgium.be/advisories/warning-multiple-severe-vulnerabilities-xen-project-patch-immediately → primary: Xen Project official advisory index, URL https://xenbits.xenproject.org/xsa/ (fetched via bridge `url`)"
    summary: |
      The Xen Project publicly released ten Xen Security Advisories (XSA-499 through XSA-508) on 2026-07-28,
      covering 18 CVEs; CCB Belgium escalated the batch on 2026-07-30 noting CVSS scoring was not yet
      available at publication time. Xen is the Type-1 hypervisor underlying Citrix XenServer and XCP-ng in
      addition to native Xen deployments, so the exposure extends to those platforms. The most severe
      cross-tenant-impact items, per CCB's reading of the batch: CVE-2026-62428 (XSA-500, grant-table type
      confusion in grant-copy), CVE-2026-62432/-62433/-62434 (XSA-505/506/507 — PoD reclaim, DM_OP hypercall
      buffer-check and evtchn FIFO expand/reset races) "could lead to RAM from a different guest VM being
      claimed by the affected VM," with the same state-corruption bugs likely crashing the host and affecting
      availability of co-resident VMs. CVE-2026-62435/-62436 (XSA-501) covers a grant-table version-change race
      with other operations; CVE-2026-62430 (XSA-503) is an out-of-bounds read in x86 vRTC emulation;
      CVE-2026-62431 (XSA-504) is a Viridian STIMER division-by-zero; CVE-2026-62429 (XSA-502) is a vNUMA
      domain-cleanup race. CCB assesses other flaws in the batch as limited to service disruption, with
      privilege escalation and data leakage from some CVEs remaining "theoretical." This is especially
      relevant to multi-tenant cloud/hosting environments where memory isolation between guest VMs is the
      security boundary being violated.
