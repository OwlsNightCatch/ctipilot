    sources:
      - { url: "https://www.certvde.com/en/advisories/VDE-2026-008/", publisher: "CERT@VDE (Germany's OT/ICS coordinating CERT and CNA)", date: "2026-07-30", role: "primary" }
    discovery_trace: "first seen at: certvde, URL https://www.certvde.com/en/advisories/ (listing, fetched via bridge `url`) → primary: https://www.certvde.com/en/advisories/VDE-2026-008/ (fetched via bridge `url`)"
    summary: |
      CERT@VDE published VDE-2026-008 on 2026-07-30 for the Phoenix Contact CHARX SEC-3000/3050/3100/3150 EV
      charging controllers, covering 20 CVEs in firmware before 1.9.1. The summary states the flaws "could
      allow attackers to compromise the devices remotely, resulting in a complete loss of confidentiality,
      integrity, and availability." Several are unauthenticated CVSS 9.8 (CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H):
      CVE-2026-7849 (CWE-77 command injection — an unauthenticated remote attacker injects a command into the
      system configuration, executed as root); CVE-2026-44108 (CWE-696 — a flaw in shutdown script execution
      order terminates the firewall prematurely, creating a window where internal services become externally
      reachable, leading to full compromise); CVE-2026-44104 (CWE-347 — the basemodule firmware-update process
      validates only a CRC32 checksum with NO cryptographic signature verification, letting an unauthenticated
      attacker install modified firmware for full compromise); CVE-2026-44101 (CWE-306 — missing authentication
      lets an unauthenticated attacker reconfigure the CHARX OCPP Agent's backend connection, causing DoS and
      confidential-data disclosure); and CVE-2026-44090 (also CWE-306, missing authentication, unauthenticated
      remote). Sixteen further CVEs (CVE-2026-44091 through -44107, excluding those named) round out the
      20-item disclosure at varying severities down to CVSS 5.3 (a race condition in firmware-file cleanup).
      Critically: as of this advisory, Phoenix Contact's fixed firmware (1.9.1) is NOT YET released —
      the vendor states it "will be made available as soon as possible, but no later than August 12, 2026."
      The interim mitigation is network isolation: CERT@VDE/Phoenix Contact states the controllers "are
      designed and developed for use in closed industrial networks" and should be firewalled. No exploitation
      is reported, but the full technical root-cause detail (CWE classes, exact mechanisms) is already public
      with no patch to apply — the textbook "disclosure ahead of the fix" timeline-forcing shape. Reported by
      Zero Day Initiative (ZDI), coordinated by CERT@VDE.
