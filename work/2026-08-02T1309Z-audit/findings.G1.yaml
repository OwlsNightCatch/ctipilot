      with no user interaction. Both NCSC-NL and CCB Belgium escalated the bulletin the same day (2026-07-31);
      neither CERT nor Adobe reports any public PoC or in-the-wild exploitation as of publication. Adobe
      Campaign Classic is a marketing-automation platform (email/SMS campaign orchestration) frequently
      operated by public-sector communications and citizen-engagement teams in on-prem or hybrid configuration.
