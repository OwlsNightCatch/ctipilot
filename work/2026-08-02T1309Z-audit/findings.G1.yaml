  - title: "Gladinet CentreStack — 23-flaw vendor-commissioned audit yields a hardcoded cryptographic key (CVSS 9.3) that forges domain-admin tokens for full unauthenticated RCE, on a product with a repeat mass-exploitation history"
    sources:
      - { url: "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-2607", publisher: "BSI Germany (CERT-Bund)", date: "2026-07-30", role: "primary" }
      - { url: "https://github.com/advisories/GHSA-vmg2-rwj3-8rq2", publisher: "GitHub Advisory Database (CVE-2026-54363)", date: "2026-07-30", role: "primary" }
      - { url: "https://github.com/advisories/GHSA-q7f4-j8r5-hmxq", publisher: "GitHub Advisory Database (CVE-2026-54365)", date: "2026-07-30", role: "primary" }
      - { url: "https://github.com/advisories/GHSA-4cmj-5m56-fg8c", publisher: "GitHub Advisory Database (CVE-2026-54368)", date: "2026-07-30", role: "corroborating" }
    discovery_trace: "first seen at: bsi-de, URL https://wid.cert-bund.de/content/public/securityAdvisory/rss (listing, item '[NEU] [hoch] Gladinet CentreStack') → https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-2607 (fetched via `bsi-csaf WID-SEC-2026-2607`) → primary: GitHub Advisory Database, URL https://github.com/advisories/GHSA-vmg2-rwj3-8rq2 and five sibling GHSA records referenced from the BSI CSAF document"
    summary: |
      A vendor-commissioned follow-on source-code audit of Gladinet CentreStack (a self-hosted file
      sync/sharing platform previously mass-exploited via hardcoded-key flaws in 2025) found 23 further
      vulnerabilities; six carry CVEs as of BSI CERT-Bund's 2026-07-30 advisory (WID-SEC-2026-2607, rated
      "hoch"/high), all fixed in CentreStack 17.5. The most severe, CVE-2026-54363 (CVSS v4 9.3, CWE-321
      Use of Hard-coded Cryptographic Key), affects every version before 17.5: a static `SysNumber` value is
      used as entropy for `AccessTicket.Encrypt()`/`Decrypt()` identically across ALL installations, letting
      an unauthenticated attacker forge valid `x-glad-auth` headers, call privileged endpoints such as
      `acquiretenantbackuptoken`, and obtain a domain-administrator `IdentityTicket` — an unauthenticated
      RCE chain end to end. Companion flaws (all before 17.2–17.4 depending on the CVE): CVE-2026-54364
      (CVSS 6.9, session-variable injection via newline/tab characters in the `AccountName` parameter posted
      to `SelectProvider.aspx`, bypassing auth checks); CVE-2026-54365 (CVSS 8.7, CWE-306 — an unauthenticated
      deserialization flaw in `GSNamespace.dll` lets a crafted base64 XML string reach `InternalImportAdUserByUPN()`
      and make `GladinetCloudMonitor.exe` call `NetUserAdd` with attacker-controlled credentials, creating
      arbitrary local OS accounts); CVE-2026-54366 (CVSS 8.7, XXE in the unauthenticated `StorageConfig`
      handler, exfiltrating files such as `Web.config` with DB credentials/keys); CVE-2026-54367 (CVSS 8.8,
      CWE-306 — API endpoints missing authorization checks let an attacker read/write/delete arbitrary account
      settings and forge user identifiers via a static shared encryption key); CVE-2026-54368 (CVSS 8.7,
      SQL injection in `GladDBFiles.SearchEx()`/`SearchExUnder()` via the `x-glad-filter` header on the
      `jsondir` endpoint, chainable through PostgreSQL `lo_from_bytea()`/`lo_export()` to write files and
      achieve RCE — requires low-privileged authentication). No exploitation of these six is confirmed as of
      this sweep, but CentreStack has been repeatedly mass-exploited within days of prior disclosures
      (CVE-2025-30406, CVE-2025-11371, CVE-2025-14611), so the historical base rate for this product is high.
    region_nexus: "global; self-hosted file-sync platform, adoption unconfirmed in CH/EU public sector but the product class is broadly deployed by SMEs and MSPs"
    primary_sector_nexus: "indirect — general enterprise file-sharing infrastructure"
    sector: "public-sector, finance"
    cves: ["CVE-2026-54363", "CVE-2026-54364", "CVE-2026-54365", "CVE-2026-54366", "CVE-2026-54367", "CVE-2026-54368"]
    techniques: ["T1190", "T1606", "T1136.001"]
