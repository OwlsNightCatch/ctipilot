    summary: |
      Adobe published APSB26-114 on 2026-07-29 (priority 1, fixed in Adobe Campaign Classic v7 build 9398)
      for two flaws in on-premise and hybrid deployments only — Adobe-hosted (cloud) instances were already
      remediated and need no action. CVE-2026-48449 (CVSS 3.1 10.0, CWE-863 Incorrect Authorization) is an
      unauthenticated arbitrary-code-execution flaw in ACC's core authorization mechanism requiring no user
      interaction. CVE-2026-48448 (CVSS 3.1 8.6, CWE-89 SQL Injection) lets an unauthenticated attacker run
