    discovery_trace: "first seen at: ccb-belgium, URL https://ccb.belgium.be/advisories (listing, fetched via jina reader) → https://ccb.belgium.be/advisories/warning-multiple-vulnerabilities-apache-traffic-server-patch-immediately → primary: Apache Software Foundation mailing-list announcement, URL https://lists.apache.org/thread/5prl9glcm9g2swnq9hqxvnokylm1gr6d (fetched via jina reader after a plain bridge fetch returned only a JS shell)"
    summary: |
      The Apache Software Foundation fixed 38 vulnerabilities in Apache Traffic Server (ATS 9.2.15 and
      10.1.4, announced 2026-07-28) affecting ATS 9.0.0–9.2.14 and 10.0.0–10.1.3; CCB Belgium escalated the
      batch on 2026-07-29. ATS is a forward/reverse proxy used for HTTP traffic routing and policy
      enforcement (CDN/reverse-proxy tier). Highest-severity items (CVSS v4 9.2, unauthenticated, no user
      interaction): CVE-2026-58155 (header-name-length truncation enables header aliasing and request
      smuggling), CVE-2026-58154 (memory-safety errors — out-of-bounds writes/integer overflows — in MIME and
      HTTP header parsing), and CVE-2026-58161 (null dereferences and dangling references in TLS/SNI handling
      can crash the server). CVE-2026-58151 (CVSS 8.7) lets abusive HTTP/2 framing and flow-control exhaust
      resources and crash the server; CVE-2026-58150 lets HTTP/2 requests carrying Transfer-Encoding bypass
      rejection, enabling downgrade request smuggling; CVE-2026-33267 means hop-by-hop and internal `@`
      headers from untrusted peers are not stripped before plugin hooks, enabling smuggling and metadata
      injection; CVE-2026-22068 is unanchored regular-expression matching in remap/plugin ACL, SNI, signature
      and geo controls, allowing substring/suffix matches to bypass policy. No PoC or in-the-wild exploitation
      has been reported for any of the 38, but CCB assesses "most of the vulnerabilities are of low complexity,
      remotely exploitable and require no privileges or user interaction," and notes the flaws are chainable.
    region_nexus: "global; ATS underlies CDN/reverse-proxy tiers, telco and hosting infrastructure"
    primary_sector_nexus: "indirect — network/edge infrastructure common to telco and any org fronting services with ATS"
