  - title: "Certighost — public exploit tool forges AD CS-issued Domain Controller certificates for DCSync (CVE-2026-54121), never given a standalone entry despite three weekly mentions"
    sources:
      - { url: "https://security-hub.ncsc.admin.ch/#/posts/12804", publisher: "NCSC Switzerland / GovCERT.ch (Cyber Security Hub)", date: "2026-07-27", role: "primary" }
      - { url: "https://thehackernews.com/2026/07/certighost-exploit-lets-low-privileged.html", publisher: "The Hacker News", date: "2026-07-24", role: "corroborating" }
      - { url: "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-54121", publisher: "Microsoft MSRC", date: "2026-07-14", role: "primary" }
    discovery_trace: "first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/12804 (fetched via `ncsc-csh recent 20` → `ncsc-csh post 12804`) → pivot: The Hacker News, URL https://thehackernews.com/2026/07/certighost-exploit-lets-low-privileged.html (named discoverers H0j3n and Aniq Fakhrul, PoC published 2026-07-24) → primary: Microsoft MSRC, URL https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-54121 (fetched via `msrc cve CVE-2026-54121`, patched 2026-07-14 Patch Tuesday)"
    summary: |
      A working exploit tool codenamed "Certighost", published 2026-07-24 by researchers H0j3n and Aniq
      Fakhrul, lets any standard low-privileged Active Directory domain user obtain a valid certificate for
      a Domain Controller and authenticate as that machine, then run DCSync to pull the krbtgt secret. The
      root cause is an AD CS enrollment fallback ("chase"): when a certification authority cannot resolve
      an end-entity's information, the enrollment protocol lets the requester supply `cdc` (the AD server to
      contact) and `rmd` (the machine object to resolve) — and the CA followed the requester-supplied `cdc`
      host over SMB/LDAP without first proving it was a real Domain Controller. The public tool automates
      the whole chain: it creates or reuses a machine account under the default `ms-DS-MachineAccountQuota`
      of 10, starts rogue LSA/LDAP listeners on ports 445/389, relays the CA's Netlogon challenge to the real
      DC to obtain that DC's objectSid/dNSHostName, then has the CA sign those into a certificate for a PKINIT
      credential — writing out a PFX and a Kerberos ccache. Microsoft patched the underlying flaw
      (CVE-2026-54121, CVSS 8.8, CWE-285 Improper Authorization) on 2026-07-14 and initially assessed
      "Exploitation Less Likely"; the 2026-07-24 public PoC and NCSC-CH's dedicated 2026-07-27 advisory move
      the effective risk to "PoC available, weaponization trivial". Microsoft has observed researcher testing
      traffic but has not confirmed in-the-wild abuse by threat actors as of the sources reviewed. Prerequisites:
      network reachability to an Enterprise CA following the vulnerable chain path, enrollment via the default
      Machine certificate template, and a standard domain account able to create/control a machine account.
      Interim mitigation (lab-tested, can break legitimate enrollment): clear the `EDITF_ENABLECHASECLIENTDC`
      flag and restart Certificate Services; the durable fix is the July 2026 AD CS update. Despite two
      successive weekly roll-ups referencing "a public AD CS DCSync PoC" / "Certighost… full PoC", this
      pipeline never gave the vulnerability its own operational vulnerability entry.
    region_nexus: "global; any AD CS deployment, including CH/EU government and CI Active Directory forests"
    primary_sector_nexus: "direct — identity infrastructure underlies every public-sector and CI Active Directory estate"
    sector: "public-sector, energy, water, transport, healthcare, finance, telco"
    cves: ["CVE-2026-54121"]
    techniques: ["T1649", "T1003.006"]
    affected_products: ["Microsoft Windows Server Active Directory Certificate Services (AD CS)"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Successful exploitation allows low-privileged domain users with network access to authenticate as a Domain Controller and extract critical account secrets via DCSync."
        attribution: "NCSC Switzerland (GovCERT.ch)"
        source_url: "https://security-hub.ncsc.admin.ch/#/posts/12804"
      - quote: "Researchers H0j3n and Aniq Fakhrul published a working exploit on July 24 that lets a low-privileged Active Directory user obtain a certificate for a Domain Controller and authenticate as that machine."
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/07/certighost-exploit-lets-low-privileged.html"
      - quote: "Improper authorization in Active Directory Certificate Services (AD CS) allows an authorized attacker to elevate privileges over a network."
        attribution: "Microsoft MSRC"
        source_url: "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-54121"
    extended_notes: |
      Audit-recovery candidate: CVE-2026-54121 appears in prior_coverage.json ONLY inside three weekly
      synthesis entries (2026-07-19/weekly-w29-looking-ahead, 2026-07-26/weekly-w30-vuln-status-rollup,
      2026-07-26/weekly-w30-looking-ahead) as a one-line watch-item, never as its own operational
      `vulnerability` entry — despite an in-window (2026-07-27) dedicated NCSC-CH advisory. No clean
      `update_of` target exists (the prior mentions are synthesis-kind, not vulnerability-kind), so this is
      returned as `novelty: new`; the main agent should treat it as the first standalone entry for this CVE
      rather than a duplicate of the weekly mentions.

