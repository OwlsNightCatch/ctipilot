        attribution: "GitHub Advisory Database (GHSA-vmg2-rwj3-8rq2 / CVE-2026-54363)"
        source_url: "https://github.com/advisories/GHSA-vmg2-rwj3-8rq2"
      - quote: "CentreStack before 17.3 contains an unauthenticated deserialization vulnerability in GSNamespace.dll that allows unauthenticated attackers to create arbitrary local OS user accounts by supplying a crafted base64-encoded XML string to exposed API endpoints."
        attribution: "GitHub Advisory Database (GHSA-q7f4-j8r5-hmxq / CVE-2026-54365)"
