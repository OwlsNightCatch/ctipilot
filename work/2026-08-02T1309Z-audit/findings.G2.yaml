        attribution: "ransomware.live claim record (re-stated by search aggregation)"
        source_url: "https://www.ransomware.live/id/Q0VOIGFuZCBDZW5lbGVjQGNvaW5iYXNlY2FydGVs"
    extended_notes: |
      Judgement call flagged for the main agent: this is exactly the shape
      the S4/G2 mission asks to surface ("which extortion-site claims remain
      claims") given the EU-institutional nexus, but it fails the standard
      fake-news gate (no victim confirmation, no Admiralty A/B journalism --
      only leak-site mirrors). Recommend holding for a follow-up run rather
      than publishing as a confirmed incident; if it is dropped this run, no
      further action needed.
    borderline: true
    borderline_reason: "EU-institutional target of real interest to the constituency, but sourcing is leak-site-claim-only with zero independent corroboration as of research time."

