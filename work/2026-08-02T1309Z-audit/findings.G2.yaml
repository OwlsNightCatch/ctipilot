watch_items:
  - id: banatic-tchap-sdis-french-leak-wave
    question: >
      Unconfirmed French leak-site claim wave (BANATIC / Interior Ministry
      ~111,500 agents; four SDIS fire-and-rescue departments; actor handles
      overlapping the tracked Tchap breach cluster) — resolution condition:
      official confirmation (Interior Ministry / ANSSI-CERT-FR / a named SDIS
      / Admiralty A-B journalism) => publishable; claims withdrawn or
      continued silence => document and close.
    resolution: continued-silence
    detail: |
      Re-researched the full cluster as of 2026-08-02. Three related but
      distinct claims are in play, all still UNCONFIRMED by any authority:
      (1) "misere" of the CuteSec collective claimed on 2026-07-26 to have
      published 111,528 French Interior Ministry / Gendarmerie agent records
      (identifiers, names, professional emails, some personal contacts),
      framed as protest against the EU "Chat Control" proposal. (2) A
      related BANATIC (banatic.interieur.gouv.fr, local-government/EPCI
      registry) claim from "misere" with hackers Snufkxn and ChimeraZ dated
      2026-07-20, ~91,213 records. (3) ChimeraZ separately claimed breaches
      of four SDIS fire-and-rescue departments (Alpes-Maritimes/06,
      Marne/51, Alpes-de-Haute-Provence/04, Landes/40) on 2026-07-24 (~4,800
      profiles, 16,800+ documents, 34 GB), on top of earlier SDIS claims
      (Aisne, Touraine, Indre-et-Loire). The actor-handle overlap with the
      June-2026 Tchap breach (DINUM secure-messaging platform, 73,467 agents,
      account-takeover via Education Ministry social engineering, itself
      already outside this window) is what the prior audit was tracking.
      INCYBER (French cybersecurity trade press, 2026-07-27) states plainly:
      "A ce stade, le ministere de l'Interieur n'a pas confirme l'incident."
      Cyberattaque.org's SDIS piece (2026-07-25) states none of the four
      SDIS has confirmed authenticity or origin. No ANSSI/CERT-FR advisory,
      no Interior Ministry statement, no named SDIS confirmation, and no
      Admiralty A/B journalism confirming any of the three claims was found
      as of 2026-08-02 — only community leak-trackers (cyberattaque.org,
      frenchbreaches.com, ZATAZ, INCYBER relaying the claim) republish it.
      Two candidate "confirmation" articles surfaced by search
      (franceinfo.fr slugs _7683346 and _7683745, "Ce que l'on sait de la
      cyberattaque...") were checked and are BOTH recycled December 2025
      reporting on an unrelated, older Interior Ministry breach (16.4
      million police-file access) — a classic stale-republish trap, verified
      via article:published_time meta tags (2025-12-16) and excluded.
      Conclusion: continued silence holds; no publishable item this run.
    sources:
      - { url: "https://incyber.org/article/une-fuite-revendiquee-viserait-plus-de-111-000-agents-de-letat/", publisher: "INCYBER", date: "2026-07-27", role: "primary-for-claim-status" }
      - { url: "https://www.cyberattaque.org/ministere-de-linterieur-111-528-agents-revendiques-dans-une-fuite-massive-de-donnees/", publisher: "Cyberattaque.org", date: "2026-07-26", role: "corroborating" }
      - { url: "https://www.cyberattaque.org/4-sdis-frappes-5-000-pompiers-exposes-dans-une-fuite-massive/", publisher: "Cyberattaque.org", date: "2026-07-25", role: "corroborating" }
      - { url: "https://www.zataz.com/des-donnees-de-pompiers-francais-exposees-en-serie/", publisher: "ZATAZ.COM", date: "2026-07-26", role: "corroborating" }
      - { url: "https://frenchbreaches.com/alertes/tchap-mq4aeab2jsbmxt87pgb", publisher: "FrenchBreaches", date: "2026-06-08", role: "background (Tchap cluster, out-of-window)" }

  - id: zscaler-teleshim-part-2
    question: >
      Zscaler ThreatLabz TELESHIM/MIXEDKEY/BINDCLOAK series Part 1 published
      2026-07-20 (already an entry: 2026-07-26/teleshim-bindcloak-volume-serial-keying-government-espionage).
      Check whether Part 2 (promised BINDCLOAK deep technical analysis) has
      published; if yes, return as an update item.
    resolution: not-yet-published
    detail: |
      Part 1 (zscaler.com/blogs/security-research/targeted-attack-government-entities-middle-east-part-1)
      explicitly states a follow-up post will cover BINDCLOAK's C2 implant
      mechanics in full technical detail. Checked the Zscaler
      security-research blog listing and the ThreatLabz portal directly, and
      ran multiple targeted searches for a "part-2" URL or any BINDCLOAK
      standalone analysis — none found as of 2026-08-02. Every hit (The
      Hacker News, GBHackers, Security Boulevard, Ankura CTIX, cybersecuritynews.com)
      covers only Part 1's TELESHIM/MIXEDKEY content and repeats the same
      "Part 2 to follow" framing. No publishable item; continue to watch.
    sources:
      - { url: "https://www.zscaler.com/blogs/security-research/targeted-attack-government-entities-middle-east-part-1", publisher: "Zscaler ThreatLabz", date: "2026-07-20", role: "primary (Part 1, confirmed still the latest)" }

  - id: ifage-geneva-dragonforce-ancpi-romania-closure-recheck
    question: >
      IFAGE Geneva/DragonForce and ANCPI Romania/DNSC were both closed at the
      2026-07-26 audit; check only for a materially new development inside
      this window (07-26 -> 08-02).
    resolution: no-in-window-delta
    detail: |
      IFAGE Geneva: the last tracked delta (DragonForce publishing the
      stolen data, exposing student exam records) is dated 2026-07-23 with
      pipeline coverage discovered_at 2026-07-26T13:58:00Z -- inside this
      audit's window by design (same-day handoff from the prior audit to
      the same day's regular intel run) and already a published entry
      (2026-07-26/ifage-geneva-dragonforce-data-published-student-records).
      Targeted re-search for anything past that point (early August) found
      only recycled coverage of the same ransom-then-publication sequence.
      No further delta.
      ANCPI Romania: the last tracked delta is the DNSC interim technical
      report (vCenter/ESXi ransomware, ~2M ePayment records exfiltrated),
      discovered_at 2026-07-26T13:55:00Z, likewise already published
      (2026-07-26/ancpi-romania-dnsc-report-2m-epayment-records-exfiltrated).
      One in-window development surfaced by search: publicrecord.ro
      (2026-07-31, Romanian outlet) reports ANCPI paid 68M lei over 8 years
      on IT maintenance across three active contracts (eTerra, GIS, RENNS,
      32M+ lei), that contractor vulnerability findings are covered by
      confidentiality clauses invoked to avoid comment, and the ANCPI
      director denies "millions of euros" cybersecurity spend claims. This
      is a procurement/accountability angle, not a new technical or
      exploitation fact -- judged below the bar for a standalone entry and
      not surfaced as an item; noted here for completeness. An older
      actor-interview pair (securitypatch.ro / stop-ransomware.com,
      2026-07-17; risky.biz bulletin, 2026-07-20, both PRE-window and
      already available to the 2026-07-26 audit) named the attacker as
      Zakaria Mahdjoub (Oran, Algeria) and confirmed the foothold was "a
      simple vulnerability... no 0day" -- checked but excluded on recency
      grounds (published before window start).
    sources:
      - { url: "https://publicrecord.ro/2026/07/31/milioanele-ancpi-pentru-aplicatii-lovite-cibernetic/", publisher: "Public Record (Romania)", date: "2026-07-31", role: "in-window, minor delta, not entry-worthy" }

