  - title: "CoinbaseCartel claims a data-theft breach of EU standards bodies CEN and CENELEC -- unconfirmed leak-site post, no victim or authority statement found"
    sources:
      - { url: "https://www.ransomware.live/id/Q0VOIGFuZCBDZW5lbGVjQGNvaW5iYXNlY2FydGVs", publisher: "Ransomware.live (leak-site mirror)", date: "2026-08-01", role: "primary (leak-site claim record)" }
      - { url: "https://www.redpacketsecurity.com/coinbasecartel-ransomware-victim-cen-and-cenelec/", publisher: "RedPacket Security", date: "2026-08-01", role: "corroborating (re-publishes same claim)" }
      - { url: "https://www.cencenelec.eu/news-events/news/?tags%5B%5D=Cybersecurity", publisher: "CEN-CENELEC (own news feed)", date: "2026-08-02 (checked)", role: "negative check -- no statement present" }
    discovery_trace: >
      first seen at: WebSearch ("CEN CENELEC cyberattack ransomware
      coinbasecartel data breach") -> ransomware.live claim record, URL
      https://www.ransomware.live/id/Q0VOIGFuZCBDZW5lbGVjQGNvaW5iYXNlY2FydGVs
      -> corroboration attempt: RedPacket Security, URL
      https://www.redpacketsecurity.com/coinbasecartel-ransomware-victim-cen-and-cenelec/
      (same claim, no independent confirmation) -> checked CEN-CENELEC's
      own news/cybersecurity feed, URL
      https://www.cencenelec.eu/news-events/news/?tags%5B%5D=Cybersecurity
      for any acknowledgement -- none present as of check time.
    summary: |
      The data-theft-only extortion group tracked as CoinbaseCartel (active
      since September 2025, encryption-free, credential/infostealer-log-driven
      access, 160+ claimed victims globally) posted a leak-site listing for
      "CEN and Cenelec" on 2026-08-01 -- CEN (European Committee for
      Standardization) and CENELEC (European Committee for Electrotechnical
      Standardization), the two EU-recognised standards bodies headquartered
      in Brussels that draft the harmonised standards underpinning EU product
      and cybersecurity legislation including the Cyber Resilience Act. No
      compromise date, no data sample, and no scope detail accompanies the
      listing beyond the organisations' names. Neither CEN-CENELEC nor any
      EU authority (CERT-EU, the European Commission) has issued any
      statement; the only sources are the leak-site record itself and
      community trackers that mechanically mirror it (RedPacket Security,
      hendryadrian.com, malware.news) -- none is an independent confirmation.
      Surfaced here because of the entities' direct EU-institutional/standards
      nexus (CRA-relevant standards drafting) should this develop, but it
      does not clear the two-source / victim-or-Admiralty-A-B-journalism bar
      for a confirmed-breach entry as things stand.
    region_nexus: "EU institutional (Brussels-headquartered EU standards bodies)"
    primary_sector_nexus: "indirect (public-sector/regulatory standards-setting, not the primary sector itself)"
    sector: "public-sector"
