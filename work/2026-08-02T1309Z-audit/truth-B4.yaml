- entry: entries/2026-07-31/unit42-autonomous-deepseek-hermes-netscaler-cve-2026-3055.md
  verdict: factual-error
  machine_surface: true
  defect: >
    1. evidence[] quote "Across all the exploitation attempts, both autonomous and manual, Unit 42 was only able to
    confirm three targets were successfully exploited." is not a real Unit 42 sentence -- the source's actual
    sentence is "Across all the exploitation attempts, both autonomous and manual, Unit 42 confirmed data
    exfiltration from three Citrix NetScaler targets (CVE-2026-3055) and command execution on 11 Marimo notebook
    endpoints (CVE-2026-39987)." The entry's quote drops the 11 confirmed Marimo (CVE-2026-39987) compromises
    entirely and fabricates wording ("was only able to confirm three targets") that does not appear on the page.
    2. Consequently the entry's headline/summary framing ("the three confirmed compromises came from the
    operator's own manual work against Citrix NetScaler") understates Unit 42's own confirmed-compromise count:
    Unit 42's CVE table separately lists CVE-2026-39987 (Marimo Notebook) as "Active exploitation, command
    execution confirmed" for 11 endpoints, so total confirmed compromises per the source is at least 14, not 3.
    The entry's sourcing_note acknowledges an "unresolved tension" between Unit 42's narrative and its CVE table
    but this does not excuse quoting a fabricated sentence or leading with the narrower, lower number as the
    entry's headline claim.
  ground_truth: >
    "Across all the exploitation attempts, both autonomous and manual, Unit 42 confirmed data exfiltration from
    three Citrix NetScaler targets (CVE-2026-3055) and command execution on 11 Marimo notebook endpoints
    (CVE-2026-39987)." CVE table: "CVE-2026-39987 Marimo Notebook 9.8 Manual Active exploitation, command
    execution confirmed."
  ground_truth_url: "https://unit42.paloaltonetworks.com/autonomous-ai-cyber-attack-campaign/"
