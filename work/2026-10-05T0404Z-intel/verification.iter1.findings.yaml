  section: 2026-08-31/microsoft-terminalfix-clickfix-reverse-tunnel-campaign (frontmatter summary; claim c7e36c1aa5)
  item: "Microsoft Threat Intelligence documents TerminalFix ... Sophos reports the same chain running since March with 19 different legitimate executables sideloading a malicious DLL"
  url_or_quote: "https://www.sophos.com/en-us/blog/terminalfix-and-lorem-ipsum-loader-enable-covert-tunneling"
  summary: "Sophos Table 1 has 19 pairing rows but only 15 distinct executables (changepk.exe x3, embeddedapplauncher.exe x2, sessionmsg.exe x2; ResilientStorageCoordinator.exe is 'originally WerFaultSecure.exe'); the body and the changelog record correctly say '19 pairings'. Fix: '19 pairings of a legitimate executable and a malicious DLL' (or '15 different executables')."
- code: F4
  category: hallucinated-fact
  section: 2026-08-31/microsoft-terminalfix-clickfix-reverse-tunnel-campaign (frontmatter summary; claim c7e36c1aa5)
  item: "(low confidence) Sophos reports the same chain running since March"
  url_or_quote: "https://www.sophos.com/en-us/blog/terminalfix-and-lorem-ipsum-loader-enable-covert-tunneling"
  summary: "Sophos says the campaign (STAC4924) has been active since at least March, in two phases: March-April used SEO-poisoned sites and trojanized Teams MSI installers with a PowerShell loader; the TerminalFix lure chain only 'beginning in late May'. 'The same chain since March' conflates the phases; the summary should say the campaign has run since March, with TerminalFix lures from late May."
- code: F3
  category: claim-not-supported
  section: 2026-08-31/microsoft-terminalfix-clickfix-reverse-tunnel-campaign (Defender takeaway paragraph; claim 4cb14de757)
  item: "The other pairings Sophos lists follow the same shape: a legitimate Windows or updater-named executable running from a user-writable or application directory with a DLL beside it that it loads from there"
  url_or_quote: "https://www.sophos.com/en-us/blog/terminalfix-and-lorem-ipsum-loader-enable-covert-tunneling"
  summary: "Sophos Table 1 gives only 'Legitimate application' and 'Malicious DLL' names; the page states no run location (user-writable or application directory) for any pairing, and not every listed executable is 'Windows or updater-named' (bin.exe, net runtime optimization service.exe). The location and 'same shape' claims are the entry's inference attributed to the Sophos citation; drop them or mark as inference. The same applies to the clause 'so the same finding for any other executable running from a user-writable or application directory ... carries the same weight' (claim cc19f93ca2), which is also not in Sophos."
