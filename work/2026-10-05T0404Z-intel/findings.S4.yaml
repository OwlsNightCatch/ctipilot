items:
  - title: "DIVD says the ticketing system its CSIRT uses was the way in: anyone who wrote to or answered csirt@divd.nl should assume those messages may be in the attackers' hands"
    novelty: "update-of:2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach"
    update_type_hint: update
    lookback: true
    lookback_note: "DIVD's data-investigation page carries a header time of 2026-10-02 08:30 GMT (about 68 h before this run: outside divd-csirt's 50 h lookback, inside the 72 h developing-story window); the covered entry (updated 2026-10-04) does not cite it."
    sources:
      - { url: "https://csirt.divd.nl/DIVD-2026-00014/overview_data_investigation/", publisher: "DIVD CSIRT (data-investigation overview, victim's own statement)", date: "2026-10-02", role: "primary" }
      - { url: "https://csirt.divd.nl/cases/DIVD-2026-00014/", publisher: "DIVD CSIRT (case DIVD-2026-00014, statements #1-#5)", date: "2026-10-01", role: "primary" }
    discovery_trace: "first seen at: divd-csirt, URL https://csirt.divd.nl/feed.xml (feed item 'Case update: DIVD-2026-00014 - When, not if...', 2026-10-01) → drilled URL https://csirt.divd.nl/cases/DIVD-2026-00014/ (statement #5 links the data overview) → primary: https://csirt.divd.nl/DIVD-2026-00014/overview_data_investigation/ (read in full; fetched via the reader fallback of `extract`)"
    summary: |
      DIVD's own data-investigation page says the attackers got in through the ticketing system its CSIRT team uses, which holds every email sent to the CSIRT mailbox and every reply, but not DIVD's initial notifications. DIVD says the attackers had difficulty extracting information, so only part of it left, but tells any organisation or individual that has been emailing back and forth with the CSIRT team to assume the attackers may have that information, and lists what such correspondence can hold: follow-up requests on scan data including IP addresses of vulnerable systems, vulnerabilities reported through the mailbox, and extracts of credential dumps with masked passwords. The page's status table, as read on 2026-10-05, marks the CSIRT ticket system, the Jira and Confluence project-support environment and system data on supporting IT systems as showing "signs of compromise"; DIVD's Google Workspace office and HR environment, Slack, source-code repositories, vulnerable-system lists, fingerprints, de-weaponised PoCs, zero-day material and private researcher correspondence are still under investigation with no preliminary result, and its accounting systems and bank account (handled by an external party) show no signs of compromise. Confirmed so far: DIVD email addresses and possibly volunteer contact details were exfiltrated, and DIVD warns this makes it easier to pose as a DIVD volunteer. The Zammad zero-day mechanics and the AI-agent assessment are already in the covered entry; the ticket-system exposure of third-party correspondents is not.
    region_nexus: "Europe/global; no source names Swiss correspondents. Any Swiss organisation that has replied to or initiated mail with csirt@divd.nl or *@csirt.divd.nl (notification follow-ups, vulnerability reports, credential-dump queries) is in scope; organisations that only received a DIVD notification and never replied are, by DIVD's statement, not in the ticket system."
    primary_sector_nexus: "indirect (a coordinated-disclosure team's correspondents; not a public-sector breach)"
    sector: "public-sector, technology"
    cves: [CVE-2026-102489, CVE-2026-102490]
    techniques: [T1190, T1068, T1213]
    affected_products: ["Zammad"]
    entity_keys: ["product:zammad"]
    new_entities:
      - { key: "incident:divd-csirt-breach-2026-09", type: incident, name: "DIVD CSIRT breach through Zammad zero-days, September 2026 (case DIVD-2026-00014)", aliases: ["DIVD-2026-00014", "When, not if"],
          summary: "DIVD says attackers first reached its data centre on 2026-09-21 through two Zammad zero-days, reached the ticketing system used by its CSIRT team and exfiltrated at least volunteer email addresses; the extent of exposure of correspondents' messages is under investigation (DIVD, 2026-10-01/02)." }
    relation_suggestions:
      - { subject: "incident:divd-csirt-breach-2026-09", object: "product:zammad", basis: "DIVD states its attackers got in via two Zammad zero-days, CVE-2026-102489 and CVE-2026-102490 (DIVD case page 2026-10-01)" }
    verification: SINGLE-SOURCE-VICTIM
    verification_note: "Victim's own first-party statement on its own incident (the covered entry already treats it that way); Zammad's contrary statements about the disclosure are covered in the entry and not affected by this delta. Third-party corroboration of the ticket-system exposure not located."
    confidence: HIGH
    classification_suggestion: { reliability: A, credibility: 2 }
    evidence:
      - quote: "We know for sure that the attackers got in through the ticketing system our CSIRT team uses."
        attribution: "DIVD CSIRT"
        source_url: "https://csirt.divd.nl/DIVD-2026-00014/overview_data_investigation/"
      - quote: "If an organisation or individual has been emailing back and forth with our CSIRT team, assume the attackers may have that information."
        attribution: "DIVD CSIRT"
        source_url: "https://csirt.divd.nl/DIVD-2026-00014/overview_data_investigation/"
      - quote: "This could be follow-up requests on scan data (including IP addresses of vulnerable systems), vulnerabilities reported to us through the CSIRT mailbox and extracts of credential dumps with masked passwords."
        attribution: "DIVD CSIRT"
        source_url: "https://csirt.divd.nl/DIVD-2026-00014/overview_data_investigation/"
      - quote: "What we know for sure is that volunteer data got out, such as DIVD email addresses and possibly contact details."
        attribution: "DIVD CSIRT"
        source_url: "https://csirt.divd.nl/cases/DIVD-2026-00014/"
    extended_notes: |
      Exposure: the system "holds every email sent to the CSIRT mailbox and every reply, but not our initial notifications", so the exposed population is correspondents who replied or wrote in, not everyone DIVD notified. DIVD adds that its setup meant "the attacker had to work for every bit of data they got out" and that the extraction scope is still being worked out.
      Detection / post-incident check (follows from DIVD's own risk statement, not a vendor IOC list): inventory internal mailboxes and ticket systems for correspondence with the DIVD CSIRT domains; for each thread, list the IP addresses, vulnerabilities and credential-dump extracts it contained and treat them as potentially known to an attacker (re-verify the exposure, rotate anything a credential extract touched even though passwords were masked); treat unsolicited contact claiming to come from DIVD as unverified until confirmed through the DIVD communications mailbox, which DIVD itself directs recipients to ("check with us first at communications@divd.nl", case page statement #5).
      Hardening lever DIVD credits: network segmentation ("Thanks to proper network segmentation ... we were able to stop the attackers from going deeper", statement #4), which the covered entry already quotes in its takeaway.
      Suggested handling: a dated update on the covered Zammad entry (the existing Exposure/Defender-takeaway lines gain the correspondents' exposure); no new entry, no actions[] beyond the correspondents' inventory (the do-now bar is met only for orgs that corresponded with DIVD, which no source quantifies).

