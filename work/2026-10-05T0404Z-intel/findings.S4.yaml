    summary: |
      Reuters, relayed by BleepingComputer, The Hacker News and DataBreaches.net, reports that Jordanian authorities detained Saif al-Din Khader, the ShinyHunters-linked actor known as "Rey" (the same alias the covered entry carries from Krebs's reporting as the person who took effective control of the group's operations), this week, with The Hacker News dating it to 2026-09-29 and BleepingComputer to "Tuesday", the same day. Reuters's three anonymous sources say he is cooperating with the FBI and international law enforcement and is walking investigators through his devices and communications to locate co-conspirators; Jordan has not confirmed it and Reuters could not establish the circumstances. It follows the Dutch arrest of a 24-year-old on 2026-09-15 that the entry already covers; BleepingComputer adds that an affiliate who had spoken to press about the FBI intrusion and a Cl0p leak-site hack shut down their messaging account the same day. This is an anonymously sourced report, not a statement by a government. No source links the detention to a change in the group's extortion or leak behaviour.
    region_nexus: "global; ShinyHunters is on Swiss victim lists this year (ransomware.live shows Medela, Logitech/Streamlabs and Alcon claims), the PeopleSoft campaign is the entry's defender hook"
    primary_sector_nexus: "indirect (law-enforcement context for an actor that hit a US federal agency and a mass PeopleSoft campaign)"
    sector: "public-sector, technology"
    cves: []
    techniques: [T1190]
    affected_products: ["Oracle PeopleSoft"]
    entity_keys: ["actor:shinyhunters"]
    verification: SINGLE-SOURCE-OTHER
    verification_note: "All three relays trace to one Reuters report (three unnamed sources); not independent confirmations. Reuters's own page unreadable here."
