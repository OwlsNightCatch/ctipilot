candidate_sources:
  - id: securityworldmarket
    publisher: "SecurityWorldMarket (Nordic security trade press)"
    url: "https://www.securityworldmarket.com/se/Nyheter"
    category: breaches
    why: "Only publisher found carrying a first-hand victim press-office statement on the Securitas incident (2026-10-01); Admiralty C trade press. Direct fetch returns 403 (Cloudflare), the /se/rss path is not a feed, and `extract` reads it only through the jina reader (metered), so the recipe is weak; keep as a lead source only."

coverage_gaps:
  - source_id: ransomware-live
    reason: "Not a gap: all endpoints returned data. Observation for the recipe note: recentcyberattacks lags (newest 'added' 2026-10-02 on a 2026-10-05 read) while recentvictims is current to 2026-10-04 19:37 UTC, so use recentvictims plus countryvictims/CH for the day-of sweep and recentcyberattacks for press links only."
  - source_id: inside-it-ch
    reason: "Not in this slice; observation: articles are paywalled after the lead paragraph and the host answered one `extract` with a Vercel 429 checkpoint, so only the feed lead and teaser are readable."
  - source_id: reuters
    reason: "Primary of the Rey-detention report is unreadable on every transport (jina returns a CAPTCHA page); the item is carried through three relays."
  - source_id: sec-disclosures-edgar
    reason: "Quiet, not a gap: `sec-edgar 8k` (default Item 1.05, 2026-09-21..2026-10-05) returned one hit, Astrana Health 2026-09-23."

