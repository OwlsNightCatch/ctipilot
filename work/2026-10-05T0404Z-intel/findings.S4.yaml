  - "FTAPI / The Gentlemen: no development. heise (2026-09-29) and Cybernews (2026-09-30) unchanged; Ransomware.live shows FTAPI Software listed 2026-09-26 with no data size; the countdown (about five days from 2026-09-29) has passed with no public leak or new FTAPI statement found."
  - "Belnet: no development. Belnet's notice is still 'Update 2 October 2026 - 11:00' (https://www.belnet.be/en/news-events/news/security-and-privacy-incident-affecting-belnets-it-infrastructure), says no further information on the actor's identity."
  - "SDIS 66 / France fire-and-rescue campaign: no development located (no new ICI/Radio France or tracker item after 2026-10-01); ChimeraZ's separate Région Hauts-de-France claim is logged under borderline-drop."
  - "Stadt Wien: no in-window development (see drop note on omitted 2026-09-30 facts)."
  - "Flink / LPG Group: no real delta. Later coverage repeats the claims already in the entry (Cybernews, De Belegger: stolen credentials as vector, 100 ETH from the company, about 10 euros per customer); LPG's claim of over one million customers and 13,000 employees is unverified."
  - "Recreation-platform webshell incident (Huntress): no development; no vendor or CVE named."
  - "Zammad / DIVD: real delta, returned as item 1."
  - "ShinyHunters FBI claim: real delta, returned as item 2."

