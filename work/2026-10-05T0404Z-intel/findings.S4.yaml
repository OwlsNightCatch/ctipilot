        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/shinyhunters-hacker-reportedly-detained-in-jordan-aiding-fbi/"
      - quote: "Rey, whose real name is Saif al-Din Khader, is said to have been brought into custody on September 29, 2026"
