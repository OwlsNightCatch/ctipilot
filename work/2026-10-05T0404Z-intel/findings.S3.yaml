  - title: "CloudSyncD: fake Zoom disk image phishes the macOS login password, hides it in a decoy config with zero-width Unicode, and launches an embedded backdoor via sudo (Jamf Threat Labs)"
    sources:
      - { url: "https://www.jamf.com/blog/cloudsyncd-macos-backdoor-fake-zoom-installer/", publisher: "Jamf Threat Labs", date: "2026-09-30", role: "primary" }
      - { url: "https://securityaffairs.com/200293/malware/fake-zoom-installer-hides-macos-backdoor-cloudsyncd.html", publisher: "Security Affairs", date: "2026-10-03", role: "corroborating" }
    discovery_trace: "first seen at: securityaffairs, listing URL https://securityaffairs.com/ (title 'Fake Zoom installer hides macOS backdoor CloudSyncD') → article URL https://securityaffairs.com/200293/malware/fake-zoom-installer-hides-macos-backdoor-cloudsyncd.html (fetched via extract) → primary: Jamf Threat Labs, URL https://www.jamf.com/blog/cloudsyncd-macos-backdoor-fake-zoom-installer/ (fetched via extract, full body). The story also appears in the SecurityWeek and borncity.com feeds (seen in the feed sweep, not fetched, not cited)."
    summary: |
      FACTS (Jamf Threat Labs, who found the sample while monitoring executables on VirusTotal and first saw it on
      15 September 2026 in a plainly unfinished build). The family arrives as a disk image mounting as a volume named
      Zoom whose background artwork walks the user through System Settings > Privacy & Security > Open Anyway and
      entering the administrator password, because the bundle is only ad-hoc signed. The first stage, Zoom.app/Contents/
      MacOS/app_installer, shows a fake authorization dialog and does not continue until the typed password validates
      against the local account via dscl; it shows a fake "Downloading Zoom..." progress window with no download behind
      it. The password is written to ~/.config/zoom/data.json, base64-encoded and buried in a padded "cache" value whose
      offset and length are encoded by 48 zero-width Unicode characters (U+200B, U+200C) after the visible "1.0.0" in the
      neighbouring version field. The dropper carries a complete universal Mach-O (about 756 KB in the development
      build); it first tries to run it from an anonymous file descriptor via /dev/fd (which fails on most Macs under
      System Integrity Protection), then writes it to a temporary file and executes it with sudo using the stolen
      password. A self-deleting shell script (.app_swap_<pid>.sh in the temp directory) was meant to swap in a decoy
      app bundle but the bundle was absent in every build Jamf holds. Both stages accept any TLS server certificate.
      The second stage ("cloudsyncd" after its disguised daemon name; ad-hoc signed, arm64 and x86_64) decrypts an
      embedded configuration, creates a hidden tree under ~/.local/share/cloudsync/.config/logs, writes ChaCha20-Poly1305
      log records to sync.err, sends a host survey of just under 2 KB (hardware UUID, CPU, RAM, OS, user name, MAC, model
      and raw ioreg output) and then beacons every 8 to 16 seconds with only the hardware UUID. Tasking returns either a
      gzipped tar (unpacked with /usr/bin/tar) or a raw Mach-O (executed directly), so the observable is a newly written
      or fileless Mach-O, not shell commands. Jamf did not observe persistence (no LaunchAgent or LaunchDaemon). Within
      two days of first sight Jamf saw builds pointed at live C2 on two domains (the beacon URI mimics a jQuery fetch;
      both domains were registered in 2011 through one registrar, sit behind Cloudflare and had no detections), and all
      builds share one C2 key and IV, so one sample decrypts traffic of the others.
      WHAT IS NOT KNOWN: no victim count, no delivery channel for the DMG (Jamf names none), no actor attribution.
      Jamf calls it a quieter implant that "lies low until further access is needed".
      DEFENDER USE: macOS telemetry classes: a process (the unsigned app_installer) spawning dscl authentication checks
      right after a "Zoom" image mount, a sudo-launched executable from a mkstemp-style temp path, a tar or Mach-O
      materialising under ~/.local/share, ChaCha20-record log files in a hidden user directory, and periodic 8-16 s
      HTTPS beacons to a Cloudflare-fronted host with a jQuery-style path from a non-browser process. Hardening: the
      installer needs the user to override Gatekeeper and type the admin password, so block Open Anyway for standard
      users via MDM-managed Gatekeeper policy and restrict sudo for non-admins.
