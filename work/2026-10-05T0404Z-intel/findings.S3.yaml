items:
  - title: "Sophos X-Ops: the TerminalFix intrusions are one campaign (STAC4924) running since March, with 19 DLL side-load pairings, a word-encoded shellcode loader and a Python tunnel, linked to GOLD VICTOR / Vice Society-Rhysida"
    sources:
      - { url: "https://www.sophos.com/en-us/blog/terminalfix-and-lorem-ipsum-loader-enable-covert-tunneling", publisher: "Sophos X-Ops", date: "2026-09-30", role: "primary" }
      - { url: "https://www.bluevoyant.com/blog/orem-ipsum-clickfix-rapid-brigantine", publisher: "BlueVoyant", date: "2026-06-16", role: "corroborating" }
    discovery_trace: "first seen at: sophos-xops feed, URL https://www.sophos.com/en-us/blog/feed?id=blt6f15f4f7deaf4242 (item dated 2026-09-30) → primary: Sophos X-Ops article, URL https://www.sophos.com/en-us/blog/terminalfix-and-lorem-ipsum-loader-enable-covert-tunneling (fetched via extract; datePublished 2026-09-30 read from the page HTML) → pivot: Sophos' own link to BlueVoyant's attribution post, URL https://www.bluevoyant.com/blog/orem-ipsum-clickfix-rapid-brigantine (fetched via url/jina fallback; WebFetch 403) → store check: entries/2026-08-31/microsoft-terminalfix-clickfix-reverse-tunnel-campaign.md carries the Microsoft + BSI reporting but no Sophos/STAC4924 content. The 2026-10-04 run record lists this exact Sophos post as a lead for the audit 'possible changelog record on the 2026-08-31 TerminalFix entry', not recovered."
    summary: |
      FACTS (Sophos, first-hand MDR telemetry). From August 2026 Sophos analysts investigated Managed Detection and
      Response cases in which ClickFix-style lures told users to open a Windows Terminal window (instead of the Run
      dialog) and paste a command, ending in a Python-based tunneling implant. Sophos states TerminalFix "is not linked
      to a specific threat group or a single campaign" and that several 2026 campaigns used the lure; it ties these
      intrusions, through Lorem Ipsum Loader, C2 infrastructure, persistence and DLL sideloading, to one campaign active
      since at least March that it tracks as STAC4924.
      Chain as Sophos describes it: the pasted PowerShell downloads a ZIP holding a legitimate Windows executable, a
      malicious DLL and a batch script; the batch script installs several persistence mechanisms and launches the
      legitimate LockScreenContentServer.exe, which sideloads dui70.dll (the Lorem Ipsum Loader). The loader stores
      shellcode bytes as English words with a separate word-to-byte lookup table (to evade entropy-based detection),
      reads an attacker-controlled profile page on a legitimate community platform (Letsdiskuss) to decode the current
      C2 list, and talks to C2 over HTTP POST requests that appear to carry JPEG files but hold encoded data. PowerShell
      then does reconnaissance and persistence and pulls the legitimate embedded Python package from python.org into
      Users\Public\indigo, where client.py runs as an encrypted WebSocket tunnel with a per-host UUID.
      The delta against the store: Sophos publishes 19 sideload pairings (legitimate binary / malicious DLL name)
      observed March to September, not only LockScreenContentServer.exe + dui70.dll: e.g. changepk.exe with slc.dll,
      faultrep.dll or sppcext.dll; werfaultsecure.exe (also renamed ResilientStorageCoordinator.exe) with faultrep.dll;
      embeddedapplauncher.exe with sspicli.dll or secur32.dll; certenrollctrl.exe with certenroll.dll; phoneactivate.exe,
      sessionmsg.exe and wlrmdr.exe with dui70.dll/duser.dll; vdsldr.exe with vdsutil.dll; wuauclt.exe with sspicli.dll;
      plus binaries renamed to look like Microsoft components (net runtime optimization service.exe with mscoree.dll,
      Microsoft Edge Updates Helper.exe and Microsoft Teams Revo Helper.exe with msvcp140.dll). The covered entry's
      Triage and takeaway lines name a single binary and are therefore too narrow.
      TWO PHASES (Sophos; BlueVoyant reaches the same inference independently). March-April: SEO-poisoned sites
      distributing trojanized, signed Microsoft Teams MSI installers feeding a multi-stage PowerShell loader and
      victim-specific C2 with dead-drop profiles. From late May: TerminalFix lures, "coinciding with Microsoft's takedown
      of the malware-signing service that supplied the fraudulently obtained certificates" (the 19 May 2026 Fox Tempest
      action already in the store). Sophos says phase 2 "has continued through September" with DLL sideloading,
      image-based steganography, Active Directory reconnaissance and the Python reverse tunnel.
      ASSESSMENTS (owner stated). Sophos assesses with moderate confidence that the two phases are the same or closely
      associated actors (per-victim UUID callback, the dead-drop resolver on one platform, the sideloading tradecraft,
      auto-run entries masquerading as Microsoft or update components reinforced by scheduled tasks). BlueVoyant
      attributed Lorem Ipsum Loader to Rapid Brigantine, which Sophos CTU tracks as GOLD VICTOR (Vanilla Tempest, DEV-0832,
      VICE SPIDER, Vice Society), linked to the Vice Society and Rhysida ransomware families; Sophos says its tooling,
      infrastructure and delivery-shift observations "support BlueVoyant's attribution" but it "has not observed
      encryption in the STAC4924 campaign". This is a third independent line (Sophos telemetry, BlueVoyant telemetry,
      BSI incident handling already in the entry) converging on the same group.
      CONTRADICTIONS HELD, NOT RESOLVED. (1) Sophos says BlueVoyant first observed Lorem Ipsum Loader in February 2026;
      BlueVoyant's own June post says it first documented the family in May 2026 (the registry follows BlueVoyant).
      (2) BlueVoyant (2026-06-16) reports the dead-drop resolver moving from letsdiskuss to digitalpoint after its public
      disclosure, while Sophos still describes letsdiskuss profiles in the August-September TerminalFix chain: parallel
      infrastructure or divergent sub-clusters, unexplained by either source. (3) The covered entry frames TerminalFix as
      a campaign; Sophos frames it as a lure technique shared across campaigns with STAC4924 as one of them.
      DEFENDER USE (telemetry classes, no IOCs): (a) process-creation with parent lineage: Windows Terminal or PowerShell
      parent spawning a download-and-extract of a ZIP into ProgramData or Users\Public, then a Windows system binary
      executing from that user-writable directory rather than System32/SystemApps; (b) image-load events where a
      system-named DLL loads from an application directory next to the executable (the 19 pairings are a hunt list); (c) a
      python.exe/pythonw.exe running from a user-writable path with a client.py argument on a non-developer endpoint, and
      a PowerShell download of the python.org embeddable package; (d) proxy/DNS: non-browser processes fetching a
      community-platform profile page followed by HTTP POSTs with image content types to non-CDN hosts; (e) autorun and
      scheduled-task entries named like Microsoft/Teams/Edge updaters that point at user-writable directories; (f) Active
      Directory enumeration launched from a user-session child process. Sophos' own warning that persistence is
      redundant means removing one artefact does not evict the access; treat the host as a pivot and rotate credentials
      reachable from it (the covered entry already says so).
