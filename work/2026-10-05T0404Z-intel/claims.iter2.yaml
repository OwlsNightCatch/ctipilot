claims:
  - claim_id: 44749a8453
    entry: 2026-08-31/microsoft-terminalfix-clickfix-reverse-tunnel-campaign
    surface: "summary"
    kind: frontmatter
    text: "Microsoft Threat Intelligence documents TerminalFix, a ClickFix variant that tricks users into pasting a malicious command into Windows Terminal or PowerShell via a fake Cloudflare CAPTCHA overlay, then runs a multi-stage chain of DLL sideloading, PNG-steganography payload delivery, domain reconnaissance and a custom Python reverse-tunnel implant that gives the attacker persistent SOCKS-style proxy access into the victim's internal network. Sophos reports the campaign running since March, with TerminalFix lures from late May and 19 pairings of a legitimate executable and a malicious DLL, so a detection keyed to one file name misses most of it."
  - claim_id: e64c592cc0
    entry: 2026-08-31/microsoft-terminalfix-clickfix-reverse-tunnel-campaign
    surface: "body"
    kind: cited
    text: "Microsoft Threat Intelligence documents TerminalFix, a ClickFix variant targeting organizations across multiple industries ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/08/28/terminalfix-campaign-deploys-reverse-tunnel-through-multistage-intrusion/"]
  - claim_id: b8eda09cfe
    entry: 2026-08-31/microsoft-terminalfix-clickfix-reverse-tunnel-campaign
    surface: "body"
    kind: cited
    text: "A compromised website displays a fake Cloudflare Turnstile verification overlay that silently copies a malicious PowerShell command to the clipboard and instructs the user to paste it into Windows Terminal or PowerShell rather than Windows' Run dialog, which traditional ClickFix lures use; a console runs complex, multi-line scripts far more reliably ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/08/28/terminalfix-campaign-deploys-reverse-tunnel-through-multistage-intrusion/"]
  - claim_id: b92a2d6e15
    entry: 2026-08-31/microsoft-terminalfix-clickfix-reverse-tunnel-campaign
    surface: "body"
    kind: cited
    text: "Once pasted, the command downloads a ZIP archive containing a legitimate signed binary (`LockScreenContentServer.exe`) alongside a malicious `dui70.dll` masquerading as the Windows DirectUI Engine; the signed binary's static import dependency loads the planted DLL from its own working directory instead of System32, a DLL side-loading technique that starts execution inside a trusted, signed process ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/08/28/terminalfix-campaign-deploys-reverse-tunnel-through-multistage-intrusion/"]
  - claim_id: 3ee01d077b
    entry: 2026-08-31/microsoft-terminalfix-clickfix-reverse-tunnel-campaign
    surface: "body"
    kind: cited
    text: "The sideloaded DLL runs an elaborate second stage: PowerShell downloads three PNG images from attacker domains, extracts binary data hidden in their pixel channels (the first eight bytes of each embedded payload encode its length) and reassembles an executable and a DLL split across two of the images, deleting the source images afterward to reduce forensic artifacts ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/08/28/terminalfix-campaign-deploys-reverse-tunnel-through-multistage-intrusion/"]
  - claim_id: 1ef8ba3e33
    entry: 2026-08-31/microsoft-terminalfix-clickfix-reverse-tunnel-campaign
    surface: "body"
    kind: cited
    text: "Persistence lands through both an `HKCU\\...\\Run` registry key and a scheduled task re-executing every 60 minutes, both under a masquerading name chosen to blend with the abused Lock Screen component, with the payload directory hidden via system and hidden file attributes ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/08/28/terminalfix-campaign-deploys-reverse-tunnel-through-multistage-intrusion/"]
  - claim_id: 6260eecbb5
    entry: 2026-08-31/microsoft-terminalfix-clickfix-reverse-tunnel-campaign
    surface: "body"
    kind: cited
    text: "The malware then conducts extensive Active Directory reconnaissance: domain trust enumeration, domain admin group membership, user and computer discovery, and targeted pings of named infrastructure roles (domain controllers, databases, backup, gateways, mail), with the system-information-collection step run in English, Spanish and German locale variants, consistent with an operator or automated pre-assessment scoring whether the compromised host sits near high-value, domain-joined infrastructure ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/08/28/terminalfix-campaign-deploys-reverse-tunnel-through-multistage-intrusion/"]
  - claim_id: e534a8525e
    entry: 2026-08-31/microsoft-terminalfix-clickfix-reverse-tunnel-campaign
    surface: "body"
    kind: cited
    text: "The most significant capability is the final stage: an unmodified, signed embeddable Python 3.14.5 runtime pulled directly from python.org, launched with no visible window via `pythonw.exe`, running a custom `client.py` tunneling implant that dials out over TLS on port 443, upgrades to a WebSocket, and relays arbitrary TCP connections to any internal host and port the operator specifies: SOCKS5-style addressing over a custom 7-byte multiplexed protocol, indistinguishable on the wire from an ordinary encrypted web session ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/08/28/terminalfix-campaign-deploys-reverse-tunnel-through-multistage-intrusion/"]
  - claim_id: 22be8f79bf
    entry: 2026-08-31/microsoft-terminalfix-clickfix-reverse-tunnel-campaign
    surface: "body"
    kind: cited
    text: "Microsoft states it did not observe the downstream hands-on-keyboard actions this access typically enables (privilege escalation, security-control tampering, data exfiltration, ransomware deployment) in the analyzed chain, but assesses the access itself makes those the expected next step ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/08/28/terminalfix-campaign-deploys-reverse-tunnel-through-multistage-intrusion/"]
  - claim_id: 147c91f325
    entry: 2026-08-31/microsoft-terminalfix-clickfix-reverse-tunnel-campaign
    surface: "body"
    kind: cited
    text: "That file name is one of 19 pairings of a legitimate executable and a malicious DLL that Sophos lists for the same campaign ("
    urls: ["https://www.sophos.com/en-us/blog/terminalfix-and-lorem-ipsum-loader-enable-covert-tunneling"]
  - claim_id: 8ec227a9a8
    entry: 2026-08-31/microsoft-terminalfix-clickfix-reverse-tunnel-campaign
    surface: "body"
    kind: cited
    text: "Sophos lists the other pairings as the same DLL sideloading technique ("
    urls: ["https://www.sophos.com/en-us/blog/terminalfix-and-lorem-ipsum-loader-enable-covert-tunneling"]
  - claim_id: 7c04eb8ba1
    entry: 2026-08-31/microsoft-terminalfix-clickfix-reverse-tunnel-campaign
    surface: "body"
    kind: uncited
    text: "Combined with the reconnaissance data already gathered, this turns the compromised host into a full network pivot point."
  - claim_id: 4077f85d54
    entry: 2026-08-31/microsoft-terminalfix-clickfix-reverse-tunnel-campaign
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** any host found running `LockScreenContentServer.exe` from a path other than `C:\\Windows\\SystemApps` has been compromised by this technique and must be treated as a network pivot point; prioritise credential rotation for anything reachable from that host, including domain admin accounts if it was domain-joined."
  - claim_id: a92d4b9203
    entry: 2026-08-31/microsoft-terminalfix-clickfix-reverse-tunnel-campaign
    surface: "body"
    kind: derived
    text: "Detection concepts: process-creation telemetry for `LockScreenContentServer.exe` executing from a non-standard directory and immediately loading `dui70.dll` from that same directory, and the same pattern for the other pairings Sophos lists; PowerShell logs showing a `cmd.exe`/`LockScreenContentServer.exe` chain launched from a `ProgramData` path shortly after clipboard-paste activity into Terminal or PowerShell; process lineage showing `pythonw.exe` or `python.exe` invoking a script with `client.py` and `--uuid` arguments with no visible console window; and outbound TLS-443 connections from an otherwise-idle host that establish a WebSocket upgrade and sustain long-lived, low-and-slow traffic patterns rather than a normal page-load profile."
  - claim_id: b19819bbf7
    entry: 2026-08-31/microsoft-terminalfix-clickfix-reverse-tunnel-campaign
    surface: "body"
    kind: derived
    text: "**Triage:** legitimate `LockScreenContentServer.exe` only ever runs from `C:\\Windows\\SystemApps`; the same binary name executing from `ProgramData` or a user-writable temp path, with a co-located `dui70.dll` bearing a forged future timestamp, is the discriminator: a benign lock-screen component never side-loads from an application directory."
  - claim_id: d05a38d18b
    entry: 2026-08-31/microsoft-terminalfix-clickfix-reverse-tunnel-campaign
    surface: "body"
    kind: derived
    text: "Restrict PowerShell execution for standard users via AppLocker or Application Control, enable PowerShell script-block logging, and train users to recognise that a legitimate CAPTCHA never asks them to paste a command into a terminal."
  - claim_id: 0bfda64a44
    entry: 2026-08-31/microsoft-terminalfix-clickfix-reverse-tunnel-campaign
    surface: "section 2026-10-05T04:34:00Z"
    kind: cited
    text: "Sophos X-Ops reports that this chain is part of a campaign it tracks as STAC4924, active since at least March, in two phases ("
    urls: ["https://www.sophos.com/en-us/blog/terminalfix-and-lorem-ipsum-loader-enable-covert-tunneling"]
  - claim_id: 830978a188
    entry: 2026-08-31/microsoft-terminalfix-clickfix-reverse-tunnel-campaign
    surface: "section 2026-10-05T04:34:00Z"
    kind: cited
    text: "The first, in March and April, used SEO-poisoned websites distributing trojanized Microsoft Teams installer packages; from late May the campaign moved to TerminalFix lures, a shift Sophos says coincided with Microsoft's takedown of the malware-signing service that supplied the fraudulently obtained certificates ("
    urls: ["https://www.sophos.com/en-us/blog/terminalfix-and-lorem-ipsum-loader-enable-covert-tunneling"]
  - claim_id: 816f7940ad
    entry: 2026-08-31/microsoft-terminalfix-clickfix-reverse-tunnel-campaign
    surface: "section 2026-10-05T04:34:00Z"
    kind: cited
    text: "Sophos assesses with moderate confidence that the two phases are linked to the same group or closely associated actors, on the shared per-victim identifier callback and the use of a legitimate community platform as a dead-drop resolver for C2 addresses, and adds that the TerminalFix lure itself is not linked to a specific threat group or a single campaign, since several 2026 campaigns have used it ("
    urls: ["https://www.sophos.com/en-us/blog/terminalfix-and-lorem-ipsum-loader-enable-covert-tunneling"]
  - claim_id: 355f9aedea
    entry: 2026-08-31/microsoft-terminalfix-clickfix-reverse-tunnel-campaign
    surface: "section 2026-10-05T04:34:00Z"
    kind: cited
    text: "Sophos lists 19 pairings of a legitimate executable and a malicious DLL observed between March and September, not only the lock-screen binary with `dui70.dll`: they include `changepk.exe`, `werfaultsecure.exe`, `wuauclt.exe` and `embeddedapplauncher.exe`, and helper executables named after Microsoft Edge and Teams ("
    urls: ["https://www.sophos.com/en-us/blog/terminalfix-and-lorem-ipsum-loader-enable-covert-tunneling"]
  - claim_id: 7406c2858e
    entry: 2026-08-31/microsoft-terminalfix-clickfix-reverse-tunnel-campaign
    surface: "section 2026-10-05T04:34:00Z"
    kind: cited
    text: "The loader stores shellcode bytes as English words with a separate lookup table to evade entropy-based detections, reads an attacker-controlled profile on the community platform to decode the current C2 server list, and then talks to C2 over HTTP POST requests that appear to carry JPEG images but hold encoded data ("
    urls: ["https://www.sophos.com/en-us/blog/terminalfix-and-lorem-ipsum-loader-enable-covert-tunneling"]
  - claim_id: e9871aa1ea
    entry: 2026-08-31/microsoft-terminalfix-clickfix-reverse-tunnel-campaign
    surface: "section 2026-10-05T04:34:00Z"
    kind: cited
    text: "BlueVoyant attributed the loader to the Rapid Brigantine group, which Sophos tracks as GOLD VICTOR (also known as Vanilla Tempest, DEV-0832, VICE SPIDER and Vice Society) and which has been linked to the Vice Society and Rhysida ransomware families; Sophos says its STAC4924 observations support that attribution but that it has not observed encryption in the campaign ("
    urls: ["https://www.sophos.com/en-us/blog/terminalfix-and-lorem-ipsum-loader-enable-covert-tunneling"]
  - claim_id: 7542f9b423
    entry: 2026-08-31/microsoft-terminalfix-clickfix-reverse-tunnel-campaign
    surface: "record 2026-10-05T04:34:00Z"
    kind: record-summary
    text: "Sophos X-Ops reports the same chain as a campaign it tracks as STAC4924, active since at least March, with 19 pairings of a legitimate executable and a malicious DLL rather than one, a loader that stores shellcode as English words, C2 addresses read from a profile on a legitimate community platform, and a first phase of trojanized Teams installers before the TerminalFix lures. Sophos says its observations support BlueVoyant's attribution to the group linked to Vice Society and Rhysida, and that it has seen no encryption."
  - claim_id: 4ca8ff5d05
    entry: 2026-10-04/cve-2026-88779-citrix-netscaler-saml-overflow-exploited
    surface: "summary"
    kind: frontmatter
    text: "Citrix's bulletin CTX697174 fixes CVE-2026-88779, a memory overflow in NetScaler ADC and Gateway that a network attacker needing no privileges reaches when the appliance is configured as a SAML service provider or identity provider; Citrix says it has observed targeted attacks and scopes the impact to denial of service. Appliances already on the 14.1-73.37 or 13.1-64.23 builds that fixed the September zero-days remain affected and must move to 14.1-73.41, 13.1-64.28 or the FIPS builds. Reports of code execution on patched honeypots are unconfirmed, and CISA added the flaw to its KEV catalog on 2026-10-04."
  - claim_id: dc8d1f8545
    entry: 2026-10-04/cve-2026-88779-citrix-netscaler-saml-overflow-exploited
    surface: "cves[CVE-2026-88779]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-88779\", \"cvss\": \"8.7\", \"status\": [\"exploited\", \"cisa-kev\", \"patch-available\"], \"affected\": \"NetScaler ADC and Gateway 14.1 before 14.1-73.41; 13.1 before 13.1-64.28; ADC 14.1-FIPS before 14.1-73.41 FIPS; ADC 13.1-FIPS and 13.1-NDcPP before 13.1-37.282; only when configured as a SAML service provider or identity provider\", \"fixed\": \"14.1-73.41; 13.1-64.28; 14.1-73.41 FIPS; 13.1-37.282 (13.1-FIPS and 13.1-NDcPP)\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
  - claim_id: 3b192c78ed
    entry: 2026-10-04/cve-2026-88779-citrix-netscaler-saml-overflow-exploited
    surface: "body"
    kind: cited
    text: "Citrix's bulletin CTX697174 describes CVE-2026-88779, a memory overflow in customer-managed NetScaler ADC and NetScaler Gateway reachable only when the appliance is configured as a SAML service provider or identity provider; the CVSS 4.0 vector is network, no privileges, no interaction, availability impact only ("
    urls: ["https://support.citrix.com/external/article/CTX697174/citrix-netscaler-adc-and-citrix-netscale.html"]
  - claim_id: d21ea14cd6
    entry: 2026-10-04/cve-2026-88779-citrix-netscaler-saml-overflow-exploited
    surface: "body"
    kind: cited
    text: "Citrix says it \"has observed targeted attacks on unmitigated NetScaler deployments which can lead to Denial of Service\" and has not identified an integrity impact on customer data ("
    urls: ["https://community.citrix.com/techzone-blogs/110_security-updates/understanding-and-addressing-cve-2026-88779-in-citrix-netscaler-adc-and-citrix-netscaler-gateway/"]
  - claim_id: 58e6cfc748
    entry: 2026-10-04/cve-2026-88779-citrix-netscaler-saml-overflow-exploited
    surface: "body"
    kind: cited
    text: "The flaw is independent of the vulnerabilities disclosed in the earlier bulletin CTX697096 ("
    urls: ["https://community.citrix.com/techzone-blogs/110_security-updates/security-update-guidance-for-netscaler-saml-authentication-deployments/"]
  - claim_id: 9186b4a224
    entry: 2026-10-04/cve-2026-88779-citrix-netscaler-saml-overflow-exploited
    surface: "body"
    kind: cited
    text: "), so an appliance already on 14.1-73.37 or 13.1-64.23 is still affected, and Citrix tells operators who meet the SAML precondition to \"upgrade your deployment again\" ("
    urls: ["https://community.citrix.com/techzone-blogs/110_security-updates/understanding-and-addressing-cve-2026-88779-in-citrix-netscaler-adc-and-citrix-netscaler-gateway/"]
  - claim_id: 80a625e4a8
    entry: 2026-10-04/cve-2026-88779-citrix-netscaler-saml-overflow-exploited
    surface: "body"
    kind: cited
    text: "The fixed builds are 14.1-73.41, 13.1-64.28, 14.1-73.41 FIPS and 13.1-37.282 ("
    urls: ["https://support.citrix.com/external/article/CTX697174/citrix-netscaler-adc-and-citrix-netscale.html"]
  - claim_id: 4785385451
    entry: 2026-10-04/cve-2026-88779-citrix-netscaler-saml-overflow-exploited
    surface: "body"
    kind: cited
    text: "Until the upgrade, Citrix offers Global Deny List signatures through NetScaler Console with virtual patching enabled, for builds from 14.1-73.37 up to 14.1-73.41 and from 13.1-64.23 up to 13.1-64.28; they \"can help to mitigate\" the flaw, but the upgrade is the fix ("
    urls: ["https://community.citrix.com/techzone-blogs/110_security-updates/understanding-and-addressing-cve-2026-88779-in-citrix-netscaler-adc-and-citrix-netscaler-gateway/"]
  - claim_id: 56553cab8f
    entry: 2026-10-04/cve-2026-88779-citrix-netscaler-saml-overflow-exploited
    surface: "body"
    kind: cited
    text: "Other reporting reads more into the flaw: administrators reported repeated crashes and reboots of appliances running patched releases, including 14.1-73.37, with the `nsaaad` authentication service failing after crafted SAML-related requests, one seeing a script-download command in the logs that did not succeed and another a payload in the username field ("
    urls: ["https://cyberpress.org/new-citrix-netscaler-saml-flaw-triggers-crashes-and-suspected-exploitation-attempts/"]
  - claim_id: 4c6cdfd5de
    entry: 2026-10-04/cve-2026-88779-citrix-netscaler-saml-overflow-exploited
    surface: "body"
    kind: cited
    text: "). heise relays researcher Kevin Beaumont's observation that one of two patched honeypots was running a downloaded binary, and a statement that watchTowr Labs reproduced the flaw ("
    urls: ["https://www.heise.de/en/news/Netscaler-admins-beware-Zero-day-causes-crashes-and-code-execution-11474996.html"]
  - claim_id: d4a1afd069
    entry: 2026-10-04/cve-2026-88779-citrix-netscaler-saml-overflow-exploited
    surface: "body"
    kind: cited
    text: "); ASD's ACSC says an attacker \"may induce system crashes, denial of service and potential exploitation\" and that it is aware of impacts to Australian organisations ("
    urls: ["https://www.cyber.gov.au/about-us/view-all-content/alerts-and-advisories/critical-vulnerabilities-in-citrix-netscaler-adc-and-citrix-netscaler-gateway-products"]
  - claim_id: 3a2346fd19
    entry: 2026-10-04/cve-2026-88779-citrix-netscaler-saml-overflow-exploited
    surface: "body"
    kind: cited
    text: "None of these sources gives evidence of code execution beyond that observation and reproduction claim, and CISA added the flaw to its KEV catalog on 2026-10-04 ("
    urls: ["https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"]
  - claim_id: 58a78e2cc1
    entry: 2026-10-04/cve-2026-88779-citrix-netscaler-saml-overflow-exploited
    surface: "body"
    kind: cited
    text: "**Exposure:** a customer-managed NetScaler ADC or Gateway (Secure Private Access Hybrid deployments using NetScaler instances too) whose configuration holds a SAML service-provider or identity-provider action ("
    urls: ["https://support.citrix.com/external/article/CTX697174/citrix-netscaler-adc-and-citrix-netscale.html"]
  - claim_id: 20b8043e2c
    entry: 2026-10-04/cve-2026-88779-citrix-netscaler-saml-overflow-exploited
    surface: "body"
    kind: cited
    text: "); Citrix ties the issue to deployments that use SAML authentication with Gateway or AAA virtual servers, and its check is a configuration search for `add authentication samlAction` or `add authentication samlIdPProfile`, then compare the running build with the fixed list above ("
    urls: ["https://community.citrix.com/techzone-blogs/110_security-updates/understanding-and-addressing-cve-2026-88779-in-citrix-netscaler-adc-and-citrix-netscaler-gateway/"]
  - claim_id: e6a2470f82
    entry: 2026-10-04/cve-2026-88779-citrix-netscaler-saml-overflow-exploited
    surface: "body"
    kind: cited
    text: "**Detection:** appliance system, authentication-daemon and HA logs: repeated `nsaaad` crashes, failovers and reboots on a SAML-configured appliance, correlated with inbound SAML request volume in gateway access and firewall logs, since heise says the exploit likely works by sending a massive number of SAML requests ("
    urls: ["https://www.heise.de/en/news/Netscaler-admins-beware-Zero-day-causes-crashes-and-code-execution-11474996.html"]
