  - title: "ZITADEL identity platform: CVE ids published 2026-10-04 for eight-plus unauthenticated or cross-tenant account-takeover and MFA-enrollment bypass advisories (CVSS 4.0 8.7-9.3), GitHub advisories dating from 2026-07-29"
    novelty: new
    borderline: true
    borderline_reason: >
      Recency and relevance both marginal. The vendor's GitHub advisories were published 2026-07-29 to 2026-09-28 (weeks old);
      only the CVE ids (VulnCheck CNA records, ENISA EUVD EUVD-2026-92100..92108) landed 2026-10-04, inside the window. No
      exploitation, no public PoC and no KEV or EUVD-exploited flag found. Relevance rests on ZITADEL being an internet-facing
      IdP where a victim's login name alone yields account takeover (administrator included) and on a web-search lead that the
      vendor is Swiss-founded (aggregator company profiles only, not verified against a primary). The main agent should drop
      unless it finds a Swiss public-sector deployment or an exploitation signal.
    sources:
      - { url: "https://github.com/zitadel/zitadel/security/advisories/GHSA-45f2-5q3r-xgg6", publisher: "ZITADEL (GitHub security advisory)", date: "2026-07-29", role: "primary" }
      - { url: "https://github.com/zitadel/zitadel/security/advisories/GHSA-g8gj-gq47-xgf4", publisher: "ZITADEL (GitHub security advisory)", date: "2026-09-04", role: "primary" }
      - { url: "https://github.com/zitadel/zitadel/security/advisories/GHSA-3gwm-5wx8-4gm6", publisher: "ZITADEL (GitHub security advisory)", date: "2026-08-14", role: "primary" }
      - { url: "https://github.com/zitadel/zitadel/security/advisories/GHSA-738m-7888-jfv8", publisher: "ZITADEL (GitHub security advisory)", date: "2026-07-29", role: "primary" }
      - { url: "https://www.vulncheck.com/advisories/zitadel-before-3.4.14-and-4.16.2-account-takeover-via-passkey-enrollment", publisher: "VulnCheck (CNA record for CVE-2026-105212)", date: "2026-10-04", role: "corroborating" }
    discovery_trace: >
      first seen at: enisa-euvd (python3 tools/fetch_source.py url --direct
      "https://euvdservices.enisa.europa.eu/api/search?fromDate=2026-10-03&toDate=2026-10-05&fromScore=8.5&toScore=10&page=0&size=100",
      human form euvd.enisa.europa.eu/enisa/EUVD-2026-92100 .. 92108) -> nine ZITADEL records published 2026-10-04 13:10 with
      GHSA references -> primary: ZITADEL GitHub advisories, URLs
      https://github.com/zitadel/zitadel/security/advisories/GHSA-45f2-5q3r-xgg6 and the three above (extract) ->
      corroborating: VulnCheck CNA advisory URL
      https://www.vulncheck.com/advisories/zitadel-before-3.4.14-and-4.16.2-account-takeover-via-passkey-enrollment .
      GitHub advisory list (https://github.com/zitadel/zitadel/security/advisories, extract) read to date each advisory.
    summary: |
      ZITADEL (open-source identity platform, self-hosted or cloud; hosted Login V1 and Login V2 UIs, OIDC/SAML) received a block
      of CVE ids (CVE-2026-105207 to CVE-2026-105215, VulnCheck as CNA, 2026-10-04) for GitHub advisories the project issued from
      2026-07-29 to 2026-09-28. The headline flaws need no authentication beyond knowing a victim's login name. GHSA-45f2
      (CVE-2026-105212, CVSS 4.0 8.7; Login V1 and V2): enrollment of a passkey or other authenticator was accepted on an
      identify-only session before any primary factor, so the attacker registers an authenticator and logs in as the victim,
      bypassing the password and MFA; affects 4.0.0 to 4.16.1 and 3.0.0 to 3.4.13, fixed in 4.16.2 and 3.4.14. GHSA-g8gj
      (CVE-2026-105207, 9.3; Login V2 and the User Service V2 AddIDPLink endpoint): an unauthenticated attacker can bind their own
      external-IdP identity to the victim's account in organizations that allow external IdP linking; affects 4.0.0 to 4.17.2
      and 3.0.0 to 3.4.15, fixed in 4.17.3, and the 3.x line reached end of life on 2026-08-31 so it gets no fix. GHSA-3gwm
      (CVE-2026-105211, 9.2; Login V2): where the victim has both OTP-Email and OTP-SMS enrolled, both codes can be read from
      the server-action response, giving a fully MFA-authenticated session including administrator takeover; 4.0.0 to 4.17.0,
      fixed in 4.17.1. GHSA-738m (CVE-2026-105215, 9.3; Login V1 only): a forged external-IdP callback pre-creates an account
      bound to a victim's public external identity, fixed in 3.4.14 and 4.16.2. The set also holds a cross-organization passkey
      enrollment-code flaw (CVE-2026-105209, 9.3; needs user-write permission in another organization, fixed 3.4.15 / 4.17.1),
      forgeable IdP-intent tokens (CVE-2026-105208, 8.7; 4.17.3), unauthenticated Login V1 MFA enrollment (CVE-2026-105210,
      8.8) and sign-in for users of a deactivated organization (CVE-2026-105213, 8.8; 4.17.1). The vendor says no configuration
      fully closes the gaps on unpatched versions; disabling external IdP linking only closes the Login V2 vector of GHSA-g8gj.
      No source reports exploitation.
    region_nexus: "global; web-search company profiles describe ZITADEL as Swiss-founded (Zurich), unverified against a primary source"
    primary_sector_nexus: "indirect (IdP used for administration or citizen portals only where deployed; no deployment evidenced)"
    sector: "public-sector"
    cves: [CVE-2026-105207, CVE-2026-105208, CVE-2026-105209, CVE-2026-105210, CVE-2026-105211, CVE-2026-105212, CVE-2026-105213, CVE-2026-105215]
