    verification: MULTI-SOURCE
    confidence: MEDIUM
    classification_suggestion: { reliability: A, credibility: 2 }
    evidence:
      - quote: "An attacker who knows a valid login name can take over the corresponding account without knowing the password, using an existing passkey, completing MFA, or interacting with the victim."
        attribution: "ZITADEL (GitHub security advisory)"
        source_url: "https://github.com/zitadel/zitadel/security/advisories/GHSA-45f2-5q3r-xgg6"
      - quote: "release line reached end-of-life on 2026-08-31 and will not receive a fix for this vulnerability"
        attribution: "ZITADEL (GitHub security advisory)"
        source_url: "https://github.com/zitadel/zitadel/security/advisories/GHSA-g8gj-gq47-xgf4"
      - quote: "allowed an unauthenticated attacker who knows only a victim’s login name to obtain a fully MFA-authenticated session for that victim"
        attribution: "ZITADEL (GitHub security advisory)"
        source_url: "https://github.com/zitadel/zitadel/security/advisories/GHSA-3gwm-5wx8-4gm6"
      - quote: "Unauthenticated attackers knowing only a victim's login name can register an attacker-controlled authenticator and log in as that user, bypassing existing passwords and MFA."
        attribution: "VulnCheck"
        source_url: "https://www.vulncheck.com/advisories/zitadel-before-3.4.14-and-4.16.2-account-takeover-via-passkey-enrollment"
    extended_notes: |
      Defender angle if the main agent keeps it: exposure is any ZITADEL instance on 4.x before 4.17.3 (or any 3.x, which is
      EOL as of 2026-08-31 and unfixed for the later flaws); check with the running version and whether Login V1 or Login V2
      is exposed. Detection concept: IdP audit events for authenticator enrollment, external-IdP link creation or OTP
      challenges on a session that has not completed a primary factor, and new authenticators on administrator accounts;
      post-patch compromise check is review of authenticators and IdP links added since 2026-07-29 on privileged accounts.
      Only four of the eight-plus advisories were read in full; the rest rely on the EUVD record text. The EUVD records were
      read through the ENISA API; the human URL form is euvd.enisa.europa.eu/enisa/EUVD-2026-92100 to 92108 and was not
      fetched. Swiss origin comes only from search-result company profiles (and a DINAcon awards page that did not render
      content in extract); verify before using as a nexus claim.

