      (extract, reader-served) for the vendor's exploitation wording -> BleepingComputer 2026-10-04 for the in-window press state.
    summary: |
      CISA added CVE-2026-88779 to the KEV catalog on 2026-10-04 (catalog release 2026.10.04, 18:52Z, after the previous fire
      composed the entry) with a federal remediation due date of 2026-10-07. The KEV record describes it as a NetScaler ADC /
      Gateway "improper restriction of operations within the bounds of a memory buffer vulnerability that could allow for a
      denial of service" (CWE-119), sets knownRansomwareCampaignUse to Unknown and forensicTriage to Yes (the record's
      requiredAction cites BOD 26-04 and CISA's Forensics Triage Requirements). The KEV scope matches Citrix's: Citrix says it
      "has observed targeted attacks on unmitigated NetScaler deployments which can lead to Denial of Service" and has not
      identified an integrity impact; BleepingComputer (2026-10-04) adds that researchers are still investigating whether the
      flaw can also be exploited for remote code execution, so code execution remains unconfirmed by Citrix or CISA. ENISA EUVD
      carries it as EUVD-2026-92065 (CVSS 4.0 8.7) with an exploitation-since date of 2026-10-02; FIRST EPSS is 0.00276
      (2026-10-04). Fixed builds are unchanged: 14.1-73.41, 13.1-64.28, 14.1-73.41 FIPS and 13.1-37.282 (13.1-FIPS/NDcPP); the
      only precondition is a SAML SP (add authentication samlAction) or IdP (add authentication samlIdPProfile) configuration.
      Citrix bulletin CTX697174 and the covered NetScaler entry are otherwise unrevised (bulletin history: 2026-10-03 initial
      publication plus the blog link).
    suggested_update_shape: >
      type: update (non-internal; it is a reader-facing fact that changes the entry's own sentence). Replace the summary clause
      "the flaw is not in CISA's KEV catalog as of 2026-10-04" with the KEV listing (added 2026-10-04, due 2026-10-07,
      forensic-triage flag set); add the KEV record's description as scope confirmation. No new action needed (the entry's two
