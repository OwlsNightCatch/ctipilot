    surface: "body"
    kind: cited
    text: "Citrix says it \"has observed targeted attacks on unmitigated NetScaler deployments which can lead to Denial of Service\" and has not identified an integrity impact on customer data ("
    urls: ["https://community.citrix.com/techzone-blogs/110_security-updates/understanding-and-addressing-cve-2026-88779-in-citrix-netscaler-adc-and-citrix-netscaler-gateway/"]
  - claim_id: 58e6cfc748
    entry: 2026-10-04/cve-2026-88779-citrix-netscaler-saml-overflow-exploited
    surface: "body"
    kind: cited
    text: "The flaw is independent of the vulnerabilities disclosed in the earlier bulletin CTX697096 ("
    urls: ["https://community.citrix.com/techzone-blogs/110_security-updates/security-update-guidance-for-netscaler-saml-authentication-deployments/"]
  - claim_id: 9186b4a224
    entry: 2026-10-04/cve-2026-88779-citrix-netscaler-saml-overflow-exploited
    surface: "body"
    kind: cited
    text: "), so an appliance already on 14.1-73.37 or 13.1-64.23 is still affected, and Citrix tells operators who meet the SAML precondition to \"upgrade your deployment again\" ("
    urls: ["https://community.citrix.com/techzone-blogs/110_security-updates/understanding-and-addressing-cve-2026-88779-in-citrix-netscaler-adc-and-citrix-netscaler-gateway/"]
  - claim_id: 80a625e4a8
    entry: 2026-10-04/cve-2026-88779-citrix-netscaler-saml-overflow-exploited
    surface: "body"
    kind: cited
    text: "The fixed builds are 14.1-73.41, 13.1-64.28, 14.1-73.41 FIPS and 13.1-37.282 ("
    urls: ["https://support.citrix.com/external/article/CTX697174/citrix-netscaler-adc-and-citrix-netscale.html"]
  - claim_id: 4785385451
    entry: 2026-10-04/cve-2026-88779-citrix-netscaler-saml-overflow-exploited
    surface: "body"
    kind: cited
    text: "Until the upgrade, Citrix offers Global Deny List signatures through NetScaler Console with virtual patching enabled, for builds from 14.1-73.37 up to 14.1-73.41 and from 13.1-64.23 up to 13.1-64.28; they \"can help to mitigate\" the flaw, but the upgrade is the fix ("
    urls: ["https://community.citrix.com/techzone-blogs/110_security-updates/understanding-and-addressing-cve-2026-88779-in-citrix-netscaler-adc-and-citrix-netscaler-gateway/"]
  - claim_id: 56553cab8f
    entry: 2026-10-04/cve-2026-88779-citrix-netscaler-saml-overflow-exploited
    surface: "body"
    kind: cited
    text: "Other reporting reads more into the flaw: administrators reported repeated crashes and reboots of appliances running patched releases, including 14.1-73.37, with the `nsaaad` authentication service failing after crafted SAML-related requests, one seeing a script-download command in the logs that did not succeed and another a payload in the username field ("
    urls: ["https://cyberpress.org/new-citrix-netscaler-saml-flaw-triggers-crashes-and-suspected-exploitation-attempts/"]
  - claim_id: 4c6cdfd5de
    entry: 2026-10-04/cve-2026-88779-citrix-netscaler-saml-overflow-exploited
    surface: "body"
    kind: cited
    text: "). heise relays researcher Kevin Beaumont's observation that one of two patched honeypots was running a downloaded binary, and a statement that watchTowr Labs reproduced the flaw ("
    urls: ["https://www.heise.de/en/news/Netscaler-admins-beware-Zero-day-causes-crashes-and-code-execution-11474996.html"]
  - claim_id: d4a1afd069
    entry: 2026-10-04/cve-2026-88779-citrix-netscaler-saml-overflow-exploited
    surface: "body"
    kind: cited
    text: "); ASD's ACSC says an attacker \"may induce system crashes, denial of service and potential exploitation\" and that it is aware of impacts to Australian organisations ("
    urls: ["https://www.cyber.gov.au/about-us/view-all-content/alerts-and-advisories/critical-vulnerabilities-in-citrix-netscaler-adc-and-citrix-netscaler-gateway-products"]
  - claim_id: 3a2346fd19
    entry: 2026-10-04/cve-2026-88779-citrix-netscaler-saml-overflow-exploited
    surface: "body"
    kind: cited
    text: "None of these sources gives evidence of code execution beyond that observation and reproduction claim, and CISA added the flaw to its KEV catalog on 2026-10-04 ("
    urls: ["https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"]
  - claim_id: 58a78e2cc1
    entry: 2026-10-04/cve-2026-88779-citrix-netscaler-saml-overflow-exploited
    surface: "body"
    kind: cited
    text: "**Exposure:** a customer-managed NetScaler ADC or Gateway (Secure Private Access Hybrid deployments using NetScaler instances too) whose configuration holds a SAML service-provider or identity-provider action ("
    urls: ["https://support.citrix.com/external/article/CTX697174/citrix-netscaler-adc-and-citrix-netscale.html"]
  - claim_id: 20b8043e2c
    entry: 2026-10-04/cve-2026-88779-citrix-netscaler-saml-overflow-exploited
    surface: "body"
    kind: cited
    text: "); Citrix ties the issue to deployments that use SAML authentication with Gateway or AAA virtual servers, and its check is a configuration search for `add authentication samlAction` or `add authentication samlIdPProfile`, then compare the running build with the fixed list above ("
    urls: ["https://community.citrix.com/techzone-blogs/110_security-updates/understanding-and-addressing-cve-2026-88779-in-citrix-netscaler-adc-and-citrix-netscaler-gateway/"]
  - claim_id: e6a2470f82
    entry: 2026-10-04/cve-2026-88779-citrix-netscaler-saml-overflow-exploited
    surface: "body"
    kind: cited
    text: "**Detection:** appliance system, authentication-daemon and HA logs: repeated `nsaaad` crashes, failovers and reboots on a SAML-configured appliance, correlated with inbound SAML request volume in gateway access and firewall logs, since heise says the exploit likely works by sending a massive number of SAML requests ("
    urls: ["https://www.heise.de/en/news/Netscaler-admins-beware-Zero-day-causes-crashes-and-code-execution-11474996.html"]
  - claim_id: c2f8740b06
    entry: 2026-10-04/cve-2026-88779-citrix-netscaler-saml-overflow-exploited
    surface: "body"
    kind: cited
    text: "The Citrix pages list no signs of compromise to look for ("
    urls: ["https://community.citrix.com/techzone-blogs/110_security-updates/understanding-and-addressing-cve-2026-88779-in-citrix-netscaler-adc-and-citrix-netscaler-gateway/"]
  - claim_id: bb006164e1
    entry: 2026-10-04/cve-2026-88779-citrix-netscaler-saml-overflow-exploited
    surface: "body"
    kind: cited
    text: "), and the crash signs are administrator reports ("
    urls: ["https://cyberpress.org/new-citrix-netscaler-saml-flaw-triggers-crashes-and-suspected-exploitation-attempts/", "https://www.heise.de/en/news/Netscaler-admins-beware-Zero-day-causes-crashes-and-code-execution-11474996.html"]
  - claim_id: 5e0c2201a8
    entry: 2026-10-04/cve-2026-88779-citrix-netscaler-saml-overflow-exploited
    surface: "body"
    kind: cited
    text: "**Triage:** reboots alone are not proof of compromise; crashes together with malformed authentication traffic and scanning warrant incident-response handling until forensics rules out intrusion ("
    urls: ["https://cyberpress.org/new-citrix-netscaler-saml-flaw-triggers-crashes-and-suspected-exploitation-attempts/"]
  - claim_id: 667acbee7d
    entry: 2026-10-04/cve-2026-88779-citrix-netscaler-saml-overflow-exploited
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** treat every SAML-configured NetScaler as exposed even if it is already on the September fixed builds: upgrade to the .41 and .28 builds or the FIPS builds, and use the Global Deny List signatures only as a bridge."
  - claim_id: 0dca26c497
    entry: 2026-10-04/cve-2026-88779-citrix-netscaler-saml-overflow-exploited
    surface: "body"
    kind: derived
    text: "Do not read the denial-of-service scoring as a reason to wait: crashes are reported on appliances already on the September builds, and code execution is unconfirmed."
