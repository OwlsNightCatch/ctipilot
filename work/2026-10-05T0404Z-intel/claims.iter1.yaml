  - claim_id: 860e6880b3
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "body"
    kind: derived
    text: "**Detection:** web and application logs on the Zammad host."
  - claim_id: e2bbea9661
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "body"
    kind: derived
    text: "DIVD lists no process or network indicators, so these follow from the mechanism and from DIVD's account that the attackers reached other services: shells or interpreters as children of the Zammad service account, a privilege change from that account to root, and connections from the ticket host to internal services it does not normally contact."
  - claim_id: 1f9a7a98ab
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** upgrade to Zammad 7.2.0 after saving the logs (6.5 and older receive no security fixes), and treat any internet-reachable instance on 6.3.0 to 6.5.4 since 2026-09-21 as possibly compromised, including the ticket data and anything the host can reach, since NCSC-NL says an attacker can take over the system, read, change or delete data and use it for further attacks; until the root flaw is confirmed fixed, keep Zammad behind authentication or off the internet and segmented, as DIVD credits segmentation for stopping its own intruders."
  - claim_id: 4a35f0fc74
