    kind: cited
    text: "DIVD says the attackers had difficulties extracting data, so only part of it left, and tells any organisation or individual that has corresponded with its CSIRT to \"assume the attackers may have that information\" ("
    urls: ["https://csirt.divd.nl/DIVD-2026-00014/overview_data_investigation/"]
