    text: "{\"id\": \"CVE-2026-88779\", \"cvss\": \"8.7\", \"status\": [\"exploited\", \"cisa-kev\", \"patch-available\"], \"affected\": \"NetScaler ADC and Gateway 14.1 before 14.1-73.41; 13.1 before 13.1-64.28; ADC 14.1-FIPS before 14.1-73.41 FIPS; ADC 13.1-FIPS and 13.1-NDcPP before 13.1-37.282; only when configured as a SAML service provider or identity provider\", \"fixed\": \"14.1-73.41; 13.1-64.28; 14.1-73.41 FIPS; 13.1-37.282 (13.1-FIPS and 13.1-NDcPP)\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
