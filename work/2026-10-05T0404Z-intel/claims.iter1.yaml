# run_id: 2026-10-05T0404Z-intel
# claims: 71
# by_kind: {"cited": 50, "derived": 11, "frontmatter": 3, "record-summary": 3, "uncited": 4}
claims:
  - claim_id: c7e36c1aa5
    entry: 2026-08-31/microsoft-terminalfix-clickfix-reverse-tunnel-campaign
    surface: "summary"
    kind: frontmatter
    text: "Microsoft Threat Intelligence documents TerminalFix, a ClickFix variant that tricks users into pasting a malicious command into Windows Terminal or PowerShell via a fake Cloudflare CAPTCHA overlay, then runs a multi-stage chain of DLL sideloading, PNG-steganography payload delivery, domain reconnaissance and a custom Python reverse-tunnel implant that gives the attacker persistent SOCKS-style proxy access into the victim's internal network. Sophos reports the same chain running since March with 19 different legitimate executables sideloading a malicious DLL, so a detection keyed to one file name misses most of it."
  - claim_id: e64c592cc0
    entry: 2026-08-31/microsoft-terminalfix-clickfix-reverse-tunnel-campaign
    surface: "body"
    kind: cited
    text: "Microsoft Threat Intelligence documents TerminalFix, a ClickFix variant targeting organizations across multiple industries ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/08/28/terminalfix-campaign-deploys-reverse-tunnel-through-multistage-intrusion/"]
  - claim_id: e045e5c9af
    entry: 2026-08-31/microsoft-terminalfix-clickfix-reverse-tunnel-campaign
    surface: "body"
    kind: cited
    text: "A compromised website displays a fake Cloudflare Turnstile verification overlay that silently copies a malicious PowerShell command to the clipboard and instructs the user to paste it into Windows Terminal or PowerShell rather than Windows' Run dialog, which traditional ClickFix lures use — a console that runs complex, multi-line scripts far more reliably ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/08/28/terminalfix-campaign-deploys-reverse-tunnel-through-multistage-intrusion/"]
  - claim_id: b92a2d6e15
    entry: 2026-08-31/microsoft-terminalfix-clickfix-reverse-tunnel-campaign
    surface: "body"
    kind: cited
    text: "Once pasted, the command downloads a ZIP archive containing a legitimate signed binary (`LockScreenContentServer.exe`) alongside a malicious `dui70.dll` masquerading as the Windows DirectUI Engine; the signed binary's static import dependency loads the planted DLL from its own working directory instead of System32, a DLL side-loading technique that starts execution inside a trusted, signed process ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/08/28/terminalfix-campaign-deploys-reverse-tunnel-through-multistage-intrusion/"]
  - claim_id: d192908eb4
    entry: 2026-08-31/microsoft-terminalfix-clickfix-reverse-tunnel-campaign
    surface: "body"
    kind: cited
    text: "The sideloaded DLL runs an elaborate second stage: PowerShell downloads three PNG images from attacker domains, extracts binary data hidden in their pixel channels — the first eight bytes of each embedded payload encode its length — and reassembles an executable and a DLL split across two of the images, deleting the source images afterward to reduce forensic artifacts ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/08/28/terminalfix-campaign-deploys-reverse-tunnel-through-multistage-intrusion/"]
  - claim_id: c9953a92f0
    entry: 2026-08-31/microsoft-terminalfix-clickfix-reverse-tunnel-campaign
    surface: "body"
    kind: cited
    text: "The malware then conducts extensive Active Directory reconnaissance — domain trust enumeration, domain admin group membership, user and computer discovery, and targeted pings of named infrastructure roles (domain controllers, databases, backup, gateways, mail), with the system-information-collection step run in English, Spanish and German locale variants — consistent with an operator or automated pre-assessment scoring whether the compromised host sits near high-value, domain-joined infrastructure ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/08/28/terminalfix-campaign-deploys-reverse-tunnel-through-multistage-intrusion/"]
  - claim_id: 346f8b81fe
    entry: 2026-08-31/microsoft-terminalfix-clickfix-reverse-tunnel-campaign
    surface: "body"
    kind: cited
    text: "The most significant capability is the final stage: an unmodified, signed embeddable Python 3.14.5 runtime pulled directly from python.org, launched with no visible window via `pythonw.exe`, running a custom `client.py` tunneling implant that dials out over TLS on port 443, upgrades to a WebSocket, and relays arbitrary TCP connections to any internal host and port the operator specifies — SOCKS5-style addressing over a custom 7-byte multiplexed protocol, indistinguishable on the wire from an ordinary encrypted web session ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/08/28/terminalfix-campaign-deploys-reverse-tunnel-through-multistage-intrusion/"]
  - claim_id: b29eaac44e
    entry: 2026-08-31/microsoft-terminalfix-clickfix-reverse-tunnel-campaign
    surface: "body"
    kind: cited
    text: "Microsoft states it did not observe the downstream hands-on-keyboard actions this access typically enables — privilege escalation, security-control tampering, data exfiltration, ransomware deployment — in the analyzed chain, but assesses the access itself makes those the expected next step ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/08/28/terminalfix-campaign-deploys-reverse-tunnel-through-multistage-intrusion/"]
  - claim_id: cc19f93ca2
    entry: 2026-08-31/microsoft-terminalfix-clickfix-reverse-tunnel-campaign
    surface: "body"
    kind: cited
    text: "That file name is one of 19 pairings of a legitimate executable and a malicious DLL that Sophos has seen in the same campaign, so the same finding for any other executable running from a user-writable or application directory beside a planted DLL carries the same weight ("
    urls: ["https://www.sophos.com/en-us/blog/terminalfix-and-lorem-ipsum-loader-enable-covert-tunneling"]
  - claim_id: 4cb14de757
    entry: 2026-08-31/microsoft-terminalfix-clickfix-reverse-tunnel-campaign
    surface: "body"
    kind: cited
    text: "The other pairings Sophos lists follow the same shape: a legitimate Windows or updater-named executable running from a user-writable or application directory with a DLL beside it that it loads from there ("
    urls: ["https://www.sophos.com/en-us/blog/terminalfix-and-lorem-ipsum-loader-enable-covert-tunneling"]
  - claim_id: 01a8ae686c
    entry: 2026-08-31/microsoft-terminalfix-clickfix-reverse-tunnel-campaign
    surface: "body"
    kind: uncited
    text: "Persistence lands through both an `HKCU\\...\\Run` registry key and a scheduled task re-executing every 60 minutes, both under a masquerading name chosen to blend with the abused Lock Screen component, with the payload directory hidden via system and hidden file attributes."
  - claim_id: 7c04eb8ba1
    entry: 2026-08-31/microsoft-terminalfix-clickfix-reverse-tunnel-campaign
    surface: "body"
    kind: uncited
    text: "Combined with the reconnaissance data already gathered, this turns the compromised host into a full network pivot point."
  - claim_id: 68974dc93d
    entry: 2026-08-31/microsoft-terminalfix-clickfix-reverse-tunnel-campaign
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** any host found running `LockScreenContentServer.exe` from a path other than `C:\\Windows\\SystemApps` has been compromised by this technique and must be treated as a network pivot point — prioritise credential rotation for anything reachable from that host, including domain admin accounts if it was domain-joined."
  - claim_id: a92d4b9203
    entry: 2026-08-31/microsoft-terminalfix-clickfix-reverse-tunnel-campaign
    surface: "body"
    kind: derived
    text: "Detection concepts: process-creation telemetry for `LockScreenContentServer.exe` executing from a non-standard directory and immediately loading `dui70.dll` from that same directory, and the same pattern for the other pairings Sophos lists; PowerShell logs showing a `cmd.exe`/`LockScreenContentServer.exe` chain launched from a `ProgramData` path shortly after clipboard-paste activity into Terminal or PowerShell; process lineage showing `pythonw.exe` or `python.exe` invoking a script with `client.py` and `--uuid` arguments with no visible console window; and outbound TLS-443 connections from an otherwise-idle host that establish a WebSocket upgrade and sustain long-lived, low-and-slow traffic patterns rather than a normal page-load profile."
  - claim_id: 17a5357a71
    entry: 2026-08-31/microsoft-terminalfix-clickfix-reverse-tunnel-campaign
    surface: "body"
    kind: derived
    text: "**Triage:** legitimate `LockScreenContentServer.exe` only ever runs from `C:\\Windows\\SystemApps`; the same binary name executing from `ProgramData` or a user-writable temp path, with a co-located `dui70.dll` bearing a forged future timestamp, is the discriminator — a benign lock-screen component never side-loads from an application directory."
  - claim_id: d05a38d18b
    entry: 2026-08-31/microsoft-terminalfix-clickfix-reverse-tunnel-campaign
    surface: "body"
    kind: derived
    text: "Restrict PowerShell execution for standard users via AppLocker or Application Control, enable PowerShell script-block logging, and train users to recognise that a legitimate CAPTCHA never asks them to paste a command into a terminal."
  - claim_id: 0bfda64a44
    entry: 2026-08-31/microsoft-terminalfix-clickfix-reverse-tunnel-campaign
    surface: "section 2026-10-05T04:34:00Z"
    kind: cited
    text: "Sophos X-Ops reports that this chain is part of a campaign it tracks as STAC4924, active since at least March, in two phases ("
    urls: ["https://www.sophos.com/en-us/blog/terminalfix-and-lorem-ipsum-loader-enable-covert-tunneling"]
  - claim_id: 830978a188
    entry: 2026-08-31/microsoft-terminalfix-clickfix-reverse-tunnel-campaign
    surface: "section 2026-10-05T04:34:00Z"
    kind: cited
    text: "The first, in March and April, used SEO-poisoned websites distributing trojanized Microsoft Teams installer packages; from late May the campaign moved to TerminalFix lures, a shift Sophos says coincided with Microsoft's takedown of the malware-signing service that supplied the fraudulently obtained certificates ("
    urls: ["https://www.sophos.com/en-us/blog/terminalfix-and-lorem-ipsum-loader-enable-covert-tunneling"]
  - claim_id: 816f7940ad
    entry: 2026-08-31/microsoft-terminalfix-clickfix-reverse-tunnel-campaign
    surface: "section 2026-10-05T04:34:00Z"
    kind: cited
    text: "Sophos assesses with moderate confidence that the two phases are linked to the same group or closely associated actors, on the shared per-victim identifier callback and the use of a legitimate community platform as a dead-drop resolver for C2 addresses, and adds that the TerminalFix lure itself is not linked to a specific threat group or a single campaign, since several 2026 campaigns have used it ("
    urls: ["https://www.sophos.com/en-us/blog/terminalfix-and-lorem-ipsum-loader-enable-covert-tunneling"]
  - claim_id: 26c2e3f389
    entry: 2026-08-31/microsoft-terminalfix-clickfix-reverse-tunnel-campaign
    surface: "section 2026-10-05T04:34:00Z"
    kind: cited
    text: "Sophos lists 19 pairings of a legitimate executable and a malicious DLL observed between March and September, not only the lock-screen binary with `dui70.dll`: they include `changepk.exe`, `werfaultsecure.exe`, `wuauclt.exe` and `embeddedapplauncher.exe`, and executables renamed to look like Microsoft Edge or Teams helper components ("
    urls: ["https://www.sophos.com/en-us/blog/terminalfix-and-lorem-ipsum-loader-enable-covert-tunneling"]
  - claim_id: 7406c2858e
    entry: 2026-08-31/microsoft-terminalfix-clickfix-reverse-tunnel-campaign
    surface: "section 2026-10-05T04:34:00Z"
    kind: cited
    text: "The loader stores shellcode bytes as English words with a separate lookup table to evade entropy-based detections, reads an attacker-controlled profile on the community platform to decode the current C2 server list, and then talks to C2 over HTTP POST requests that appear to carry JPEG images but hold encoded data ("
    urls: ["https://www.sophos.com/en-us/blog/terminalfix-and-lorem-ipsum-loader-enable-covert-tunneling"]
  - claim_id: e9871aa1ea
    entry: 2026-08-31/microsoft-terminalfix-clickfix-reverse-tunnel-campaign
    surface: "section 2026-10-05T04:34:00Z"
    kind: cited
    text: "BlueVoyant attributed the loader to the Rapid Brigantine group, which Sophos tracks as GOLD VICTOR (also known as Vanilla Tempest, DEV-0832, VICE SPIDER and Vice Society) and which has been linked to the Vice Society and Rhysida ransomware families; Sophos says its STAC4924 observations support that attribution but that it has not observed encryption in the campaign ("
    urls: ["https://www.sophos.com/en-us/blog/terminalfix-and-lorem-ipsum-loader-enable-covert-tunneling"]
  - claim_id: 7542f9b423
    entry: 2026-08-31/microsoft-terminalfix-clickfix-reverse-tunnel-campaign
    surface: "record 2026-10-05T04:34:00Z"
    kind: record-summary
    text: "Sophos X-Ops reports the same chain as a campaign it tracks as STAC4924, active since at least March, with 19 pairings of a legitimate executable and a malicious DLL rather than one, a loader that stores shellcode as English words, C2 addresses read from a profile on a legitimate community platform, and a first phase of trojanized Teams installers before the TerminalFix lures. Sophos says its observations support BlueVoyant's attribution to the group linked to Vice Society and Rhysida, and that it has seen no encryption."
  - claim_id: f2e531b28b
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "body"
    kind: cited
    text: "DIVD, the Dutch Institute for Vulnerability Disclosure, says attackers first reached its systems on 2026-09-21 and that they got in through two zero-days in Zammad, the customer-service ticketing software, which together allowed session hijacking, remote code execution and privilege escalation from the Zammad user to root \"in seconds\" ("
    urls: ["https://csirt.divd.nl/cases/DIVD-2026-00014/"]
  - claim_id: e08e502feb
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "body"
    kind: cited
    text: "From there the attackers reached other services and exfiltrated data; DIVD says network segmentation and its incident response stopped them going deeper, and that volunteer data such as email addresses and possibly contact details left the network ("
    urls: ["https://csirt.divd.nl/cases/DIVD-2026-00014/"]
  - claim_id: b2d4026edc
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "body"
    kind: cited
    text: "DIVD assesses the attack as driven by an AI agent, because the attacker's scripts carry notes in which the agent justifies its own actions, and says it sees no link to a known threat actor ("
    urls: ["https://csirt.divd.nl/cases/DIVD-2026-00014/"]
  - claim_id: a03b8b036c
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "body"
    kind: cited
    text: "CVE-2026-102489 is a session hijack that leads to remote code execution as the zammad user in versions 6.3.0 to 6.5.4; the defect is also present in 7.0.0 to 7.1.3 but DIVD says it is not exploitable there because of environment conditions ("
    urls: ["https://csirt.divd.nl/DIVD-2026-00015"]
  - claim_id: 5bf3603018
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "body"
    kind: cited
    text: "NCSC-NL describes it as exploitable by an attacker who has not logged in ("
    urls: ["https://www.ncsc.nl/alerts/actief-misbruik-van-zeroday-kwetsbaarheden-in-zammad-update-nu"]
  - claim_id: e86f7e914c
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "body"
    kind: cited
    text: "), while DIVD's CVE record scores it CVSS 4.0 8.7 with passive user interaction ("
    urls: ["https://csirt.divd.nl/cves/CVE-2026-102489"]
  - claim_id: b4ed953885
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "body"
    kind: cited
    text: "CVE-2026-102490 lets the local zammad user escalate to root in all versions including the latest alpha, and DIVD scores the pair 9.4 when chained ("
    urls: ["https://csirt.divd.nl/cves/CVE-2026-102490"]
  - claim_id: 26e44287d0
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "body"
    kind: cited
    text: "NCSC-NL states both flaws have been actively exploited since 2026-09-21, rates likelihood and damage as high, says Zammad has released an update for the first flaw only, and says the second \"is not yet fixed\" (translated from Dutch) ("
    urls: ["https://www.ncsc.nl/alerts/actief-misbruik-van-zeroday-kwetsbaarheden-in-zammad-update-nu"]
  - claim_id: 8d3bc89b4b
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "body"
    kind: cited
    text: "DIVD's case page instead lists patch status Available, recommends upgrading to Zammad 7 or taking Zammad offline, and says it is scanning for and notifying owners of vulnerable instances ("
    urls: ["https://csirt.divd.nl/DIVD-2026-00015"]
  - claim_id: 469009b3cc
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "body"
    kind: cited
    text: "The code-execution flaw needs a version from 6.3.0 to 6.5.4 per DIVD and NCSC-NL ("
    urls: ["https://csirt.divd.nl/DIVD-2026-00015", "https://www.ncsc.nl/alerts/actief-misbruik-van-zeroday-kwetsbaarheden-in-zammad-update-nu"]
  - claim_id: 0d63d5f257
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "body"
    kind: cited
    text: "), and Zammad says only 6.5 and older are exploitable and 7.0 and later are not affected ("
    urls: ["https://community.zammad.org/t/take-care-local-privilege-escalation-cve-2026-102490-is-reported-as-being-actively-exploited/21297"]
  - claim_id: ea0799be6a
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "body"
    kind: cited
    text: "DIVD links a log-check script for the code-execution flaw that searches the Zammad application and nginx logs for error lines carrying session material, a cookie value or a client list, and says to look for unfamiliar processes and files as well ("
    urls: ["https://csirt.divd.nl/DIVD-2026-00015", "https://csirt.divd.nl/downloads/DIVD-2026-00015/cve-2026-102489_ioc_check_script_v2.sh"]
  - claim_id: 02771335ff
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "body"
    kind: cited
    text: "Updating does not show whether an instance was already compromised: NCSC-NL asks operators to copy application and network logs before installing the update so the second flaw's use can be investigated later ("
    urls: ["https://www.ncsc.nl/alerts/actief-misbruik-van-zeroday-kwetsbaarheden-in-zammad-update-nu"]
  - claim_id: 82ee4f630d
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "body"
    kind: cited
    text: "Any organisation that has exchanged mail with DIVD's CSIRT should treat the vulnerable systems, reported flaws and masked credential extracts in that correspondence as possibly known to the attackers, as DIVD advises, and prioritise fixing the systems they concern ("
    urls: ["https://csirt.divd.nl/DIVD-2026-00014/overview_data_investigation/"]
  - claim_id: ac6baa75e9
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "body"
    kind: derived
    text: "**Exposure:** self-hosted Zammad."
