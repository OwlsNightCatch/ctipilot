    surface: "section 2026-10-05T04:33:00Z"
    kind: cited
    text: "DIVD's data-investigation page says the attackers got in through the ticketing system its CSIRT team uses, which holds every email sent to the CSIRT mailbox and every reply but not DIVD's initial notifications ("
    urls: ["https://csirt.divd.nl/DIVD-2026-00014/overview_data_investigation/"]
