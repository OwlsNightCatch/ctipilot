    summary: |
      Proofpoint published on 4 June 2026 an analysis of TA4922 (a Chinese-speaking, financially-motivated cybercrime cluster), which it assesses as now running the highest observed campaign tempo of any tracked cybercrime actor. Historically concentrated on Japanese organisations, TA4922 expanded in March–April 2026 with localised lures targeting UK, German, Italian, and South African organisations. Lures are carefully tailored: tax-authority impersonation, HR/payroll/benefits notices, and invoice themes, delivered in the target's native language. The malware toolkit comprises: Atlas RAT (aka AtlasCross RAT, a fully featured C-based RAT) and RomulusLoader (a C-based loader staging AnyDesk and SyncFuture via DLL side-loading) — both apparently new families introduced to the arsenal alongside previously known ValleyRAT (aka Winos 4.0); and SilentRunLoader, a newly documented "vibe-coded" Python-based infostealer/loader that exfiltrates Chrome-stored credentials, cookies, and browsing data. Delivery chains rely on DLL side-loading (T1574.002) from spear-phishing attachments. Proofpoint assesses TA4922 as primarily financially motivated (data theft, fraud, access resale), with surveillance capabilities that could serve espionage purposes. A notable TTP evolution is the use of out-of-band communication channels (LINE, WhatsApp, Microsoft Teams) to move conversations away from enterprise email controls and facilitate payload delivery and social engineering.
