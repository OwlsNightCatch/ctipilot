  - title: "Volexity discloses VerdantBamboo (UNC5221/WARP PANDA): BRICKSTORM backdoor on firewalls, NAS and Egnyte Storage Sync, MSP supply-chain pivot, two new implants AGENTPSD and PLENET"
    sources:
      - url: "https://www.volexity.com/blog/2026/06/04/verdantbamboo-just-another-brickstorm-in-the-firewall/"
        publisher: "Volexity"
        date: "2026-06-04"
        role: "primary"
    discovery_trace: "first seen at: volexity, URL https://www.volexity.com/blog/ → primary: Volexity blog post, URL https://www.volexity.com/blog/2026/06/04/verdantbamboo-just-another-brickstorm-in-the-firewall/ (no pivot needed)"
    summary: |
      Volexity published on 4 June 2026 a detailed incident-response write-up identifying a China-linked threat actor it names VerdantBamboo, assessed with high confidence as UNC5221 (also tracked as WARP PANDA), as having maintained persistent access to a European victim organisation for at least 18 months. The intrusion began via the victim's MSP: VerdantBamboo had compromised the MSP's pfSense firewall with a BSD variant of the BRICKSTORM backdoor — a publicly documented Golang implant that Volexity notes overlaps with prior CISA, Google Cloud/GTIG, and NVISO reporting. The threat actor used BRICKSTORM's proxying capabilities on the Egnyte Storage Sync appliance (a Linux VM designed for cloud-syncing on-premise files) to route connections to the victim's Microsoft 365 environment through the Storage Sync system's egress IP, bypassing Conditional Access policies that would otherwise have blocked access from unrecognised IPs. After Volexity's initial remediation, VerdantBamboo re-entered by authenticating to the victim firewall with stolen administrative credentials, re-enabling SSL VPN, and deploying BRICKSTORM to a Synology NAS. The threat actor also deployed two previously undocumented implants: AGENTPSD, a PyInstaller-packaged Python reverse shell (HTTPS POST loop) described as a persistence fallback in case BRICKSTORM was removed; and PLENET (aka GRIMBOLT), an advanced backdoor compiled with .NET Native AOT, deployed on a Linux NAS. VerdantBamboo's distinguishing characteristic is deliberate avoidance of EDR coverage: all implants were placed on network-edge appliances (firewalls, NAS, Storage Sync servers) and retired VMs that do not support EDR agents. Infrastructure pivoting was tracked via Censys by keying on minimalistic Golang HTTP server TLS fingerprint + ≤4 open services per host. No vulnerability exploitation was the initial vector; the MSP's firewall breach appears to have relied on prior credential exposure or a separate unspecified access path.
    ch_eu_nexus: "Victim is a European organisation (jurisdiction not disclosed). Threat actor targets network-edge infrastructure widely deployed across EU public and private sector. MSP supply-chain pivot is directly relevant to Swiss and EU managed-service customers."
    public_sector_nexus: "indirect — European organisation (sector undisclosed), MSP supply-chain pathway relevant to public-sector managed-service deployments"
    sector: "MSP/managed services, enterprise, government"
    cves: []
    actors_campaigns_malware: ["VerdantBamboo", "UNC5221", "WARP PANDA", "BRICKSTORM", "AGENTPSD", "PLENET", "GRIMBOLT"]
    verification: SINGLE-SOURCE-OTHER
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Volexity's analysis revealed that a Chinese threat actor, which Volexity tracks as VerdantBamboo (WARP PANDA, UNC5221), had compromised the Storage Sync system."
        attribution: "Volexity"
        source_url: "https://www.volexity.com/blog/2026/06/04/verdantbamboo-just-another-brickstorm-in-the-firewall/"
      - quote: "VerdantBamboo's modus operandi was to target devices that lacked EDR coverage. By deploying malware on these devices, the threat actor was able to establish proxy connections to access the victim's M365 environment. This allowed VerdantBamboo to blend in with legitimate traffic and bypass Conditional Access policies."
        attribution: "Volexity"
        source_url: "https://www.volexity.com/blog/2026/06/04/verdantbamboo-just-another-brickstorm-in-the-firewall/"
      - quote: "VerdantBamboo had compromised the victim organization's Managed Services Provider (MSP)... Volexity found that the MSP's pfSense firewall had been compromised by VerdantBamboo with a BSD variant of BRICKSTORM. Volexity concluded that this firewall, like the victim organization's Storage Sync system, had also been compromised at least 18 months earlier."
        attribution: "Volexity"
        source_url: "https://www.volexity.com/blog/2026/06/04/verdantbamboo-just-another-brickstorm-in-the-firewall/"
    extended_notes: |
      Detection: Monitor outbound TLS from non-standard Linux appliances (NAS, Storage Sync servers, retired VMs) to Cloudflare-fronted infrastructure. Look for low-and-slow HTTP POST patterns from these hosts. Censys/Shodan pivot: hosts with ≤4 services + minimal Golang HTTP TLS cert = VerdantBamboo C2 fingerprint. In Microsoft 365, M365 audit logs for logins from Storage Sync appliance IP ranges are the primary visibility signal — this bypasses Entra Conditional Access because the source IP appears trusted/internal. Enforce MFA for all firewall administrative interfaces including SSL VPN. Mandate EDR coverage for all appliances and retire any appliance whose vendor prohibits root access or EDR installation.

  - title: "GMO Flatt Security: prompt injection + GitHub App actor-bypass in Anthropic's claude-code-action lets one malicious issue hijack any public repo and potentially poison the upstream action (CVSS 4.0: 7.8, fixed in v1.0.94)"
    sources:
      - url: "https://flatt.tech/research/posts/poisoning-claude-code-one-github-issue-to-break-the-supply-chain/"
        publisher: "GMO Flatt Security (RyotaK)"
        date: "2026-06-04"
        role: "primary"
      - url: "https://thehackernews.com/2026/06/claude-code-github-action-flaw-let-one.html"
        publisher: "The Hacker News"
        date: "2026-06-04"
        role: "corroborating"
    discovery_trace: "first seen at: hackernews feed, URL https://feeds.feedburner.com/TheHackersNews → pivot to THN article https://thehackernews.com/2026/06/claude-code-github-action-flaw-let-one.html → primary: Flatt Security research post https://flatt.tech/research/posts/poisoning-claude-code-one-github-issue-to-break-the-supply-chain/"
    summary: |
      Researcher RyotaK of GMO Flatt Security disclosed on 4 June 2026 (reported to Anthropic in January, fixed within four days) a two-part vulnerability chain in Anthropic's claude-code-action GitHub Actions workflow (v1.0.94 remediated). The first flaw is a permission-check bypass in the `checkWritePermissions()` function (src/github/validation/permissions.ts): the function unconditionally trusts any GitHub actor whose username ends in `[bot]`, on the assumption that GitHub Apps are always administrator-installed. In reality, anyone can register a GitHub App, install it on a personal repository, and use its token to open issues or PRs on any public repository — the implicit GitHub permission model grants public-resource access with no explicit permissions required. `agent` mode lacked the secondary `checkHumanActor()` safeguard present in `tag` mode. Combined with indirect prompt injection (the attack embeds instructions inside an issue body that Claude reads during triage), the attacker can make Claude: read `/proc/self/environ` (bypassing naive file-path guards via crafted prompt phrasing), extract the CI/CD credential pair (OIDC token exchange with Anthropic's backend yields a Claude GitHub App installation token with code/issues/workflows write access), and exfiltrate those secrets to the issue comment feed — all within a legitimate Anthropic-invoked workflow run. Aimed at the `anthropics/claude-code-action` repository itself, the same chain could have poisoned the action and propagated malicious code to every downstream consumer. The second vector — exposed via Anthropic's own published example workflow which shipped `allowed_non_write_users: "*"` — allowed any external contributor to trigger Claude without write access and leak the GitHub token via the workflow's publicly visible summary panel. Both vectors are fixed in v1.0.94 (Anthropic rated 7.8 CVSS 4.0, bug bounty paid). Practical exploitation was demonstrated in researcher-owned test repositories; no confirmed exploitation against production repositories was disclosed. Prior realised attacks with the same architecture include the February Cline@2.3.0 npm-token theft and the HackerBot-Claw February/March automated GitHub Actions misconfiguration probing campaign.
    ch_eu_nexus: "Global; directly affects any European organisation using claude-code-action in public GitHub repositories for automated triage, PR review or CI/CD. Supply-chain impact (action poisoning) is organisation-agnostic."
    public_sector_nexus: "indirect — any public-sector DevOps team using AI-assisted GitHub Actions workflows"
    sector: "software development, DevOps, technology"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "I found a vulnerability that let an attacker bypass its permission controls and feed untrusted input into a workflow designed to process only trusted input. By default, the workflow has read and write access to code, issues, pull requests, discussions, and workflow files, so this bypass could be used to inject malicious code or steal sensitive information from the repository."
        attribution: "GMO Flatt Security (RyotaK)"
        source_url: "https://flatt.tech/research/posts/poisoning-claude-code-one-github-issue-to-break-the-supply-chain/"
      - quote: "The trigger check had a hole. It waved through any actor whose name ended in [bot], on the assumption that GitHub Apps are trusted things admins install. Trouble is, anyone can register a GitHub App, install it on a repo they own, and use its token to open an issue or pull request on any public repository."
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/06/claude-code-github-action-flaw-let-one.html"
    extended_notes: |
      MITRE ATT&CK: T1195.002 (Compromise Software Supply Chain), T1562.001 (Impair Defenses: AI-mediated prompt manipulation), T1552.004 (CI/CD secrets exfiltration from workflow env). Detection: CI/CD audit logs for claude-code-action invocations where actor username ends in `[bot]` and the triggering actor is not an expected integration; GitHub Actions workflow run summary panel write events from Claude (data-exfiltration precursor). Hardening: upgrade to claude-code-action v1.0.94+; audit all workflows using `allowed_non_write_users` for secret exposure; restrict additional permissions beyond ANTHROPIC_API_KEY and GITHUB_TOKEN; disable tools that can exfiltrate (`gh issue view` can leak data). Note: RyotaK has reported ~50 separate permission-system bypasses in Claude Code — this class of issue is not isolated.

  - title: "Unit 42 Operation FlutterBridge: macOS malvertising campaign (CL-CRI-1089) delivers FlutterShell backdoor — shell command execution + Chrome hijacking via Flutter WebView/JS-to-native bridge, signed with valid Apple Developer IDs, zero VirusTotal detections at time of analysis"
    sources:
      - url: "https://unit42.paloaltonetworks.com/flutterbridge-new-fluttershell-backdoor/"
        publisher: "Palo Alto Networks Unit 42"
        date: "2026-06-02"
        role: "primary"
      - url: "https://thehackernews.com/2026/06/fluttershell-backdoor-spreads-to-macos.html"
        publisher: "The Hacker News"
        date: "2026-06-04"
        role: "corroborating"
    discovery_trace: "first seen at: hackernews feed, URL https://feeds.feedburner.com/TheHackersNews → THN article https://thehackernews.com/2026/06/fluttershell-backdoor-spreads-to-macos.html → primary: Unit 42 blog post https://unit42.paloaltonetworks.com/flutterbridge-new-fluttershell-backdoor/"
    summary: |
      Unit 42 published on 2 June 2026 a detailed technical analysis of Operation FlutterBridge, the evolution of activity cluster CL-CRI-1089 (previously tracked as JSCoreRunner, active since August 2025). The campaign distributes macOS backdoors disguised as legitimate productivity applications (PodcastsLounge, PDF-Brain, PDF-Ninja) through hundreds of Google Ads managed by verified shell companies (AdsParkPro LTD, Advantage Web Marketing LLC — UK/Ukraine-registered entities with minimal digital presence). All samples are signed with valid Apple Developer IDs and passed Apple notarization at submission time; zero VirusTotal detections were recorded at analysis time. The FlutterShell payload implements a WebView-based architecture where the malicious logic is hosted on attacker-controlled external websites rather than embedded in the binary — enabling real-time payload changes without recompiling the application. A JavaScript-to-native bridge translates JSON commands from the attacker's web server into native macOS system calls. Confirmed capabilities include arbitrary shell command execution, file system read/write, environment variable exfiltration, and system fingerprinting. Observed behaviour: Chrome hijacking via modification of the "Secure Preferences" file, routing all user traffic through an ad-filled attacker-controlled intermediary. The PDF-Brain and PDF-Ninja variants add AI-powered document summarisation by relaying documents through an attacker-controlled server before processing — enabling document exfiltration via a feature users actively invoke. Unit 42 identified over 4,000 file hashes across 100+ variants across the broader TamperedChef/CL-CRI-1089/CL-UNK-1090/CL-UNK-1110 clusters since 2024. Targeting was global with emphasis on Anglophone and Western European markets (US, Canada, Australia, France, Germany). Evidence of unfinished functions and Windows versions without malicious payloads suggests phased deployment and active malware-as-adware-plus-backdoor development.
    ch_eu_nexus: "Direct: France and Germany explicitly listed as targeted Anglophone/Western European markets. Campaign distributes through EU-registered shell entities. macOS users in EU public sector and enterprises are within the targeting profile."
    public_sector_nexus: "indirect — targets macOS users broadly including enterprises and government employees"
    sector: "cross-sector, macOS users"
    cves: []
    actors_campaigns_malware: ["CL-CRI-1089", "FlutterShell", "Operation FlutterBridge", "JSCoreRunner"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "All observed samples were signed with valid Apple Developer IDs and successfully passed notarization, meaning Apple's automated security checks did not flag them as malicious at the time of submission."
        attribution: "Palo Alto Networks Unit 42"
        source_url: "https://unit42.paloaltonetworks.com/flutterbridge-new-fluttershell-backdoor/"
      - quote: "FlutterShell employs a WebView-based architecture utilizing a JavaScript-to-native bridge... the malicious logic of FlutterShell is stored on the attackers' website and is only triggered when the application loads the specific web content."
        attribution: "Palo Alto Networks Unit 42"
        source_url: "https://unit42.paloaltonetworks.com/flutterbridge-new-fluttershell-backdoor/"
    extended_notes: |
      Detection: Look for macOS apps using WKWebView + custom JavaScript message handlers that invoke shell commands. Monitor for suspicious Chrome "Secure Preferences" file modifications from non-browser processes. Look for outbound connections from unexpected applications to Cloudflare-fronted CDN infrastructure. XProtect/notarization bypass is a recurring evasion class — Apple typically revokes Developer IDs within days of malware report. Hardening: macOS Gatekeeper does not catch notarization-bypassed malware; endpoint agents that monitor for process spawns from downloaded applications and suspicious WebView bridge calls are the reliable detection layer.

