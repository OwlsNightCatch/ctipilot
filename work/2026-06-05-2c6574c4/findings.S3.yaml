  - title: "CVE-2026-23479: Redis use-after-free in unblockClientOnKey() yields authenticated RCE via GOT overwrite; Wiz/Xint Code autonomous AI discovery; 80% of cloud Redis instances potentially reachable; patched May 5"
    sources:
      - url: "https://www.zeroday.cloud/blog/redis-cve-2026-23479-deep-dive"
        publisher: "Wiz / ZeroDay.cloud (Xint Code)"
        date: "2026-06-02"
        role: "primary"
      - url: "https://redis.io/blog/security-advisory-cve202623479-cve202625243-cve-2026-25588-cve202625589-cve-2026-23631/"
        publisher: "Redis"
        date: "2026-05-05"
        role: "corroborating"
      - url: "https://thehackernews.com/2026/06/autonomous-ai-tool-finds-2-year-old-rce.html"
        publisher: "The Hacker News"
        date: "2026-06-03"
        role: "corroborating"
    discovery_trace: "first seen at: hackernews feed, URL https://feeds.feedburner.com/TheHackersNews → THN article https://thehackernews.com/2026/06/autonomous-ai-tool-finds-2-year-old-rce.html → pivot to Wiz/ZeroDay.cloud writeup https://www.zeroday.cloud/blog/redis-cve-2026-23479-deep-dive (primary) and Redis advisory https://redis.io/blog/security-advisory-cve202623479-cve202625243-cve-2026-25588-cve202625589-cve-2026-23631/ (corroborating)"
    summary: |
      Wiz's autonomous AI vulnerability-discovery tool Xint Code discovered CVE-2026-23479, a use-after-free in Redis's blocking-client code path (`unblockClientOnKey()` in `src/blocked.c`). The flaw was introduced across two separate commits: PR #11012 (January 2023) and PR #11568 (March 2023), both landing in Redis 7.2-rc1 and reaching general availability in Redis 7.2.0. It persisted undetected for over two years across all maintained Redis branches. The full exploit chain is public as of the ZeroDay.Cloud 2025 conference writeup (released 2 June 2026 coinciding with patch availability). Root cause: `unblockClientOnKey()` calls `processCommandAndResetClient()` without checking whether the client was freed as a side effect of client eviction during command processing; `zfree()` does not zero memory, so the freed slot retains stale bytes and the function continues to operate on freed memory. Exploit chain (three stages): Stage 1 — leak a Lua heap pointer via `EVAL "return tostring(redis.call)" 0`; Stage 2 — memory groom via client memory limit manipulation, park a bloated client on a stream via `XREAD`, trigger eviction by dropping memory limits, reclaim freed client slot via pipelined `SET` with a fake client structure; Stage 3 — `updateClientMemoryUsage()` performs an OOB decrement against the GOT using attacker-controlled fields in the fake client, redirecting `strcasecmp()` to `system()` for arbitrary command execution. The official Redis Docker image ships with partial RELRO, leaving the GOT writable. Prerequisites: authenticated session with `@admin` + `@scripting` (`CONFIG SET`, `EVAL`) + `@stream` (`XREAD`/`XADD`) + `@read`/`@write` — all assigned to the default user in a default deployment. No in-the-wild exploitation has been reported. Patched versions: 7.2.14, 7.4.9, 8.2.6, 8.4.3, 8.6.3 (all released May 5, 2026). Wiz reports 80% of cloud environments use Redis; 85% of those are configured without a password. Redis Cloud is already patched.
    ch_eu_nexus: "Global but broad cloud exposure relevant to Swiss and EU deployments. EU public-sector cloud databases and self-hosted Redis instances are in scope."
    public_sector_nexus: "indirect — any organisation running Redis in cloud or on-premise"
    sector: "cross-sector, cloud, database"
    cves: ["CVE-2026-23479"]
    actors_campaigns_malware: ["Xint Code (autonomous AI discovery tool)"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "CVE-2026-23479 is a use-after-free inside Redis's blocking-client code path that allows an authenticated user to execute arbitrary operating system commands on the Redis host. The use-after-free occurs in unblockClientOnKey() (src/blocked.c), where the function calls processCommandAndResetClient() without checking whether the client was freed as a side effect before continuing to access the client structure."
        attribution: "Wiz / Xint Code (ZeroDay.cloud)"
        source_url: "https://www.zeroday.cloud/blog/redis-cve-2026-23479-deep-dive"
      - quote: "Wiz's analysis shows that 80% of cloud environments use Redis. Out of those Redis instances, almost 85% are configured without a password, which significantly increases the attack surface."
        attribution: "Wiz / Xint Code (ZeroDay.cloud)"
        source_url: "https://www.zeroday.cloud/blog/redis-cve-2026-23479-deep-dive"
    extended_notes: |
      MITRE ATT&CK: T1203 (Exploitation for Client Execution, server-side), T1059 (Command and Scripting Interpreter). CVSS: 8.8 (CVSS 3.1, NVD), 7.7 (CVSS 4.0, Redis). EPSS: not yet retrieved. Affected: Redis 7.2.0 through 7.2.13; 7.4.0 through 7.4.8; 8.2.0 through 8.2.5; 8.4.0 through 8.4.2; 8.6.0 through 8.6.2. Defender hardening (if cannot patch immediately): (1) deny `CONFIG` command access from application user ACLs — breaks this specific exploit chain; (2) deny `@scripting` (Lua) if not used — kills Stage 1 heap leak; (3) network-isolate Redis behind TLS + VPN, no public internet exposure; (4) enforce per-user ACL roles with least privilege, separate `@admin` from application role; (5) rotate broadly shared Redis credentials. Detection: anomalous EVAL commands followed by large output writes; rapid sequences of XADD/XREAD/CONFIG SET from a single client; Redis daemon spawning child processes; `strcasecmp` system call chain anomalies in Redis process.

