    summary: |
      Europol announced Operation KRATOS 2 on 3 June 2026, a seven-month enforcement action (September 2025 – April 2026) coordinated by Bulgaria targeting criminal networks operating illegal IPTV and streaming platforms. The operation resulted in 29 arrests, 86 suspects identified, 148 house searches, and the dismantling of nine organised crime groups. Law enforcement removed 27,332 illegal streaming URLs and reported 169 domains; cooperation with private-sector partners identified 4,370 piracy-linked domains, 18,331 associated IP addresses, and 397,384 URLs for suspension. Participating countries included Belgium, Bulgaria, Croatia, France, Greece, Ireland, Italy, the Netherlands, Poland, Romania, Spain, the United Kingdom, and the United States. The criminal networks used technically sophisticated infrastructure — separating customer-facing sites from content-hosting servers and distributing operations across jurisdictions to avoid detection. This follows Operation KRATOS 1 and reflects Europol's sustained focus on disrupting the cybercrime-adjacent IPTV underground (which funds broader criminal ecosystems including fraud and money laundering).
