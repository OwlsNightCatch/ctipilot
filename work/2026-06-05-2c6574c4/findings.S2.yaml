  - title: "CERTFR-2026-ACT-024 weekly bulletin highlights Samba CVE-2026-4408/4480 (CVSS 10.0) shell injection, Veeam backup chain LPE, and Palo Alto PAN-OS active exploitation — period 25-31 May 2026"
    sources:
      - url: "https://www.cert.ssi.gouv.fr/actualite/CERTFR-2026-ACT-024/"
        publisher: "ANSSI / CERT-FR"
        date: "2026-06-01"
        role: "primary"
    discovery_trace: "first seen at: WebSearch ('CERT-FR bulletin actualité juin 2026') → primary: cert.ssi.gouv.fr/actualite/CERTFR-2026-ACT-024/ (2026-06-01)"
    summary: |
      ANSSI's CERT-FR published weekly bulletin CERTFR-2026-ACT-024 on 1 June 2026 covering significant vulnerabilities from 25–31 May 2026. The bulletin flags six critical (CVSS 9–10) vulnerabilities: Samba CVE-2026-4408 (CVSS 10.0, unauthenticated shell injection via %u substitution in the `check password script` executed under smbd; affects `raw` and `classic` print modes) and CVE-2026-4480 (CVSS 10.0, unauthenticated shell injection via %J substitution in the print-command subsystem); a Joomla! authentication downgrade flaw (CVE-2026-48902); Veeam Service Provider Console arbitrary file upload (CVE-2026-32998) and a related Backup & Replication chain; and Oracle Database Server RCE. The bulletin also highlights active exploitation of Palo Alto PAN-OS CVE-2026-0257 (GlobalProtect authentication bypass, PoC public), active exploitation of SonicWALL CVE-2024-12802 (MFA bypass), the DAEMON Tools supply-chain compromise (CVE-2026-8398), and the Nx Console VS Code extension compromise (CVE-2026-48027). CERT-FR explicitly notes these items as requiring prioritised review.
    ch_eu_nexus: "EU (France) — ANSSI national bulletin; Samba is widely deployed in EU SME and public-sector AD environments; Oracle Database is prevalent in EU government and healthcare systems"
