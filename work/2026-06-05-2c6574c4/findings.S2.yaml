    discovery_trace: "first seen at: WebSearch ('site:cert.pl news advisory June 2026') → primary: cert.pl/en/posts/2026/06/CVE-2026-34906/ (2026-06-02)"
    summary: |
      CERT Polska published two vulnerability advisories on 2 June 2026 for Wirtualna Uczelnia (translates: "Virtual University"), a proprietary higher-education administration platform by Simple SA used across Polish universities. CVE-2026-34906 (CVSS not yet assigned but researcher-classified Critical) is a Server-Side Template Injection vulnerability in the `redirectToUrl` endpoint; insufficient validation of the `redirectUrlParameter` input allows an unauthenticated attacker to inject arbitrary template expressions that execute on the server, achieving remote code execution including reverse shell establishment. CVE-2026-34907 is a companion Reflected XSS via improper handling of the locale parameter. Both vulnerabilities affect all versions through wu#2016.437.295#0#20260327_105545. The reporter is Dawid Bakaj of VIPentest. The vendor was notified through CERT Polska's coordinated vulnerability disclosure (CVD) process; no confirmation of patched version or timeline was published at the time of reporting.
    ch_eu_nexus: "EU (Poland) — Polish public higher-education sector; EU educational institutions are NIS2-adjacent under the sectoral scope for public administration and digital infrastructure"
    public_sector_nexus: "direct — Polish public universities use Wirtualna Uczelnia for student/faculty administration; unauthenticated RCE in student portal management creates risk to academic data and network footholds"
    sector: "education, public-sector"
    cves: [CVE-2026-34906, CVE-2026-34907]
    actors_campaigns_malware: []
    verification: SINGLE-SOURCE-NATIONAL-CERT
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "CVE-2026-34906 is a Server-Side Template Injection (SSTI) flaw in the redirectToUrl endpoint allowing unauthenticated Remote Code Execution through insufficient input validation"
        attribution: "CERT Polska (cert.pl, 2 June 2026)"
        source_url: "https://cert.pl/en/posts/2026/06/CVE-2026-34906/"
      - quote: "Both affect versions through wu#2016.437.295#0#20260327_105545"
        attribution: "CERT Polska (cert.pl, 2 June 2026)"
        source_url: "https://cert.pl/en/posts/2026/06/CVE-2026-34906/"
    extended_notes: |
      MITRE ATT&CK mapping: T1190 (Exploit Public-Facing Application) — pre-authentication via student-portal-facing HTTP endpoint. Detection: web-server access logs should be hunted for unusual `redirectUrlParameter` values containing template syntax (e.g., `${...}`, `#{...}`, `{{...}}`); WAF rules should block SSTI payload patterns on this endpoint. Hardening: immediate patch application when vendor releases a fix; in the interim, firewall the `redirectToUrl` endpoint to restrict access to internal/authenticated sources only. Affected component: the student redirect handler in the Wirtualna Uczelnia application server (Java-based CMS). CWE-1336 (Improper Neutralization of Special Elements Used in a Template Engine). No exploitation in the wild reported as of publication.

  - title: "Europol Operation KRATOS 2: 29 arrested, 9 criminal networks dismantled, 27,000+ illegal streaming URLs removed across 13 countries — Bulgaria-led, 7-month operation"
