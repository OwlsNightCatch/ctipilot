    novelty: new
    evidence:
      - quote: "newer AI models help attackers find and exploit weaknesses faster. Rapidly advancing models can discover vulnerabilities and chain 'seemingly minor issues into serious threats'"
        attribution: "ECB (Frank Elderson speech, 3 June 2026)"
        source_url: "https://www.ecb.europa.eu/press/key/date/2026/html/ecb.sp260603~5b8e67f237.en.html"
