    sector: "all-sectors"
    cves: [CVE-2026-4408, CVE-2026-4480, CVE-2026-48902, CVE-2026-32998, CVE-2026-0257, CVE-2024-12802, CVE-2026-8398, CVE-2026-48027]
    actors_campaigns_malware: []
    verification: SINGLE-SOURCE-NATIONAL-CERT
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Bulletin highlights six critical (CVSS 9–10) vulnerabilities: Samba CVE-2026-4408 CVSS 10.0, CVE-2026-4480 CVSS 10.0 — both unauthenticated shell injection in print subsystem components"
        attribution: "ANSSI CERT-FR (CERTFR-2026-ACT-024, 1 June 2026)"
        source_url: "https://www.cert.ssi.gouv.fr/actualite/CERTFR-2026-ACT-024/"
    extended_notes: |
      Samba CVE-2026-4408: the %u substitution in the `check password script` smb.conf directive is executed by smbd with the username value unsanitised; network-accessible Samba instances with `raw printing` or `classic printing` enabled are at risk. Detection: monitor for unusual child processes spawned from smbd (Sysmon EID 1, parent `smbd`); look for unexpected shell interpreters (bash, sh, cmd.exe) as children of Samba service accounts. Hardening: disable `check password script` or switch to a safer password-management approach; upgrade to fixed Samba version per samba.org/samba/security/CVE-2026-4408.html. CVE-2026-4480 affects the broader `print command` subsystem via %J (job name) substitution — the same detection logic applies. Both CVEs were already covered individually in prior briefs (state: CVE-2026-4408 last_seen 2026-05-31, CVE-2026-4480 last_seen 2026-05-31) but the CERT-FR bulletin consolidation serves as a French national-authority confirmation.

