    extended_notes: |
      Defender implications: (1) Network micro-segmentation becomes essential because the worm exploits lateral-movement paths across heterogeneous device types — NCSC-UK's concurrent "patch wave" blog (May 2026) flagged AI-accelerated exploitation of accumulated technical debt. (2) Patch-velocity SLAs need reassessment: the model demonstrated synthesis of exploits for post-cutoff CVEs, so "no public PoC" is no longer a reliable indicator of low near-term exploitation risk. (3) Monitoring for LLM inference traffic (port 11434 Ollama, GPU-heavy processes) on compromised hosts may be an early-warning signal for active AI-worm deployment. No MITRE ATT&CK mapping was provided by the paper; closest analogues are T1203 (Exploitation for Client Execution), T1210 (Exploitation of Remote Services), T1570 (Lateral Tool Transfer). The research stops short of disclosing usable exploit code. Principal paper author: Nicolas Papernot (CleverHans Lab, U of T).

