    summary: |
      ECB Executive Board member Frank Elderson delivered a speech on 3 June 2026 announcing a supervisory "dear CEO letter" to be sent to every bank under Single Supervisory Mechanism (SSM) oversight, asking for targeted action on AI-enabled cyber risks. The ECB's concern is that frontier AI models materially lower the barrier for attackers to discover and chain vulnerabilities faster than current patching cycles can respond. Elderson cited the 2023 ICBC New York ransomware incident and the 2024 CrowdStrike platform outage as reference points for systemic operational-resilience failure scenarios. The ECB will require individual follow-up for banks assessed as most exposed and frames the issue explicitly under DORA (Digital Operational Resilience Act). Elderson warned that smaller institutions may struggle to afford equivalent defences to large banks and signalled that supervisors expect AI-cyber spending to be a permanent fixture of operational risk budgets — not a one-time exercise.
    ch_eu_nexus: "EU — direct ECB/SSM supervisory action targeting all euro-area banks; DORA is EU regulation applying equally to Swiss entities providing financial services to EU counterparties"
    public_sector_nexus: "direct — SSM-supervised institutions include public-sector banks and savings institutions; DORA applies to EU public-sector financial entities"
    sector: "finance, public-sector"
    cves: []
