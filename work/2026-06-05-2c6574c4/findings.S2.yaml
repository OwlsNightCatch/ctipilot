    extended_notes: |
      The ECB action has regulatory significance beyond finance: DORA (Regulation 2022/2554) applies to financial entities including public credit institutions and applies to their ICT third-party providers. The "dear CEO letter" mechanism, while not a binding order, is a supervisory expectation that regulators enforce through ongoing examination. Swiss financial entities operating under FINMA jurisdiction should note the ECB's expectations as a de facto benchmark given Swiss-EU regulatory alignment in financial services. Detection / hardening relevance: ECB specifically flagged cloud-provider concentration risk and payment-system interdependency — the exact TLPT (Threat-Led Penetration Testing) and ICT concentration reporting obligations under DORA Art. 30-44.

