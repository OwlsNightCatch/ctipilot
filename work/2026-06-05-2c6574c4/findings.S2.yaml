    discovery_trace: "first seen at: heise-sec RSS feed (https://www.heise.de/security/feed.xml), item published 2026-06-04 → WebSearch confirmed arXiv paper 2606.03811 → primary: arxiv.org/abs/2606.03811 (2026-06-02)"
    summary: |
      Researchers from CleverHans Lab (University of Toronto), the Vector Institute, University of Cambridge, and ServiceNow Research published arXiv:2606.03811 on 2 June 2026, demonstrated at Infosecurity Europe 2026 (London, 3-5 June 2026). They built a proof-of-concept worm that runs open-weight LLMs (e.g., Llama-class models) on already-compromised hosts to generate per-target exploit code — consuming stolen compute rather than attacker infrastructure. Tested on an isolated 33-node network spanning Linux, Windows, and IoT devices, the worm identified vulnerabilities on ~74% of machines, exploited ~25%, and propagated across ~20% (seven generations). Critically, the agent synthesised working exploits for three CVEs published after its LLM training cutoff, demonstrating adaptive reasoning beyond static knowledge. Because no commercial AI API is required, platform-level safety controls (rate-limiting, content policies) are structurally irrelevant. The research characterises this as a "destabilising economic asymmetry": marginal attacker cost per infection is zero while defenders must patch every reachable vulnerability. Presented at the main European security conference, the work has direct implications for network-segmentation assumptions and patch-velocity obligations under NIS2 across EU critical-sector environments.
    ch_eu_nexus: "EU — research presented at Infosecurity Europe 2026 (London); directly addresses AI-accelerated threat to NIS2-scope organisations across the EU and Switzerland"
