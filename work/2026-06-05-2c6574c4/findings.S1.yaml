    extended_notes: |
      Detection: Redis's slow log (CONFIG SET slowlog-log-slower-than 0) captures EVAL and CONFIG SET sequences. Audit ACL LIST for users holding CONFIG, EVAL, and XREAD simultaneously; no default Redis user should be left unscoped in a production deployment. EDR process telemetry: watch for redis-server spawning unexpected child processes (would indicate successful code execution). Wiz analysis confirms Redis is present in a large majority of cloud environments, with many instances running without a password — the combination of ubiquity and minimal auth makes this high-priority for asset-enumeration pass even before patching.

  - title: "CVE-2026-41283 — OpenStack Mistral pre-auth arbitrary code execution (CVSS 9.9); API endpoints allow unauthenticated OS command execution via policy enforcement bypass"
