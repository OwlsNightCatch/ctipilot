    discovery_trace: "first seen at: WebSearch ('OpenStack Mistral CVE-2026-41283 critical RCE vulnerability June 2026') → oss-security list https://www.openwall.com/lists/oss-security/2026/06/03/14 → NVD https://nvd.nist.gov/vuln/detail/CVE-2026-41283"
    summary: |
      OpenStack Mistral through 22.0.0 contains a critical policy-enforcement bypass that allows an unauthenticated, network-reachable attacker to execute arbitrary code and exfiltrate service credentials when the Mistral workflow-orchestration API is internet-exposed. OSSA-2026-020 (published 2026-06-03) describes the root cause as a failure to apply Oslo.policy enforcement on specific endpoints that accept and execute user-supplied workflow definitions — the workflows can invoke system actions including arbitrary shell commands. Attack vector: network (AV:N), no authentication (PR:N), no user interaction (UI:N), CVSS 3.x score reported as 9.9 Critical. Affected versions: Mistral >=20.0.0 <20.1.1, ==21.0.0, ==22.0.0 (i.e., OpenStack releases 2025.1/epoxy, 2025.2/flamingo, 2026.1/gazpacho). Patches are available via review.opendev.org for each release. NVD description: "OpenStack Mistral through 22.0.0 allows Arbitrary Remote Code Execution when the API is exposed. There are endpoints that allow code execution, which can lead to exfiltration of service credentials." No exploitation reported in the wild at time of disclosure. The Mistral workflow service is deployed by EU research institutions, cloud providers, and public-sector OpenStack operators (particularly those running open-source cloud infrastructure). The attack surface is the Mistral API endpoint — operators who have not exposed Mistral externally (typical for private-cloud deployments) carry lower risk, but Mistral's API-accessible nature in OpenStack environments means any tenant or internal threat with API access is a risk path.
    ch_eu_nexus: "EU public-sector OpenStack cloud operators (research institutions, national cloud providers, cantonal IT operators); Switzerland's public-sector cloud infrastructure includes OpenStack deployments"
