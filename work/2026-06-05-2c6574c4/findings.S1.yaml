        date: "2026-06-03"
        role: "corroborating"
    discovery_trace: "first seen at: hackernews (THN), URL https://feeds.feedburner.com/TheHackersNews → primary: THN article https://thehackernews.com/2026/06/autonomous-ai-tool-finds-2-year-old-rce.html → vendor advisory https://redis.io/blog/security-advisory-cve202623479-cve202625243-cve-2026-25588-cve202625589-cve-2026-23631/ → NVD https://nvd.nist.gov/vuln/detail/CVE-2026-23479"
    summary: |
      A use-after-free in Redis's `unblockClientOnKey()` function (`src/blocked.c`) allows an authenticated attacker with a specific ACL privilege set to achieve remote code execution. The bug was introduced in Redis 7.2.0 (a January 2023 refactor in PR #11012 added an unchecked processCommandAndResetClient() call); a March 2023 follow-on change removed the preceding NULL guard, leaving the pointer live-but-freed. The full exploit chain — discovered by Theori's autonomous AI tool "Xint Code" and demonstrated at ZeroDay.Cloud 2025 (London, December 2025) — requires: (1) EVAL to leak a heap address via a one-line Lua script; (2) grooming client memory limits, parking a bloated client on a stream (XREAD), then collapsing limits to trigger a free-then-reuse; (3) using Redis's own updateClientMemoryUsage() routine to perform an out-of-bounds decrement aimed at the Global Object Table, repointing strcasecmp() to attacker shellcode. The official Docker image ships with partial RELRO only, leaving the GOT writable; ASLR and PIE are insufficient because the write is relative to a globally-known symbol. ACL prerequisites: @admin (CONFIG SET), @scripting (EVAL), @stream (XREAD/XADD), @read/@write — the default Redis user holds all of these. NVD CVSS 3.1 score: 8.8. Redis rates it 7.7 under CVSS 4.0. Patched versions: 7.2.14, 7.4.9, 8.2.6, 8.4.3, 8.6.3 (all released 2026-05-05). Redis states no known exploitation in the wild or customer environments as of publication, but the full exploit chain is now public and Redis is ubiquitous in EU cloud environments. Immediate mitigations if patching is delayed: restrict CONFIG SET and EVAL via ACL, deny @scripting if Lua is not required, keep Redis off the public internet, rotate any broadly-shared credentials combining @admin, @scripting, and @stream.
    ch_eu_nexus: "global; Redis is deployed across Swiss and EU public-sector cloud environments, frequently as a shared session/cache service with broadly-scoped default credentials"
    public_sector_nexus: "indirect — Redis widely used in public-sector web and middleware stacks"
    sector: "all sectors, cloud, web"
