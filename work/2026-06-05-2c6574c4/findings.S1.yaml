  - title: "Claude Code GitHub Actions — permission-model bypass via [bot]-suffix actor check allows unauthenticated external attackers to hijack CI/CD pipelines and inject supply-chain payloads (patched v1.0.94)"
    sources:
      - url: "https://flatt.tech/research/posts/poisoning-claude-code-one-github-issue-to-break-the-supply-chain/"
        publisher: "GMO Flatt Security (RyotaK)"
        date: "2026-06-04"
        role: "primary"
      - url: "https://thehackernews.com/2026/06/claude-code-github-action-flaw-let-one.html"
        publisher: "The Hacker News"
        date: "2026-06-04"
        role: "corroborating"
      - url: "https://www.securityweek.com/claude-code-gemini-cli-github-copilot-agents-vulnerable-to-prompt-injection-via-comments/"
        publisher: "SecurityWeek"
        date: "2026-06-04"
        role: "corroborating"
    discovery_trace: "first seen at: hackernews (THN feed), URL https://feeds.feedburner.com/TheHackersNews → THN article https://thehackernews.com/2026/06/claude-code-github-action-flaw-let-one.html → primary research disclosure https://flatt.tech/research/posts/poisoning-claude-code-one-github-issue-to-break-the-supply-chain/ → SecurityWeek corroboration"
    summary: |
      Security researcher RyotaK (GMO Flatt Security) disclosed a vulnerability in Anthropic's `claude-code-action` GitHub Actions workflow that allows an unauthenticated external contributor to bypass the action's write-permission check and trigger Claude Code in agent mode. The root cause is in `checkWritePermissions()` (`src/github/validation/permissions.ts`): the function unconditionally returns `true` for any actor whose GitHub username ends in `[bot]`, on the assumption that GitHub App bot accounts are trusted. Since any GitHub user can register a GitHub App and use its bot token to open issues or PRs against any public repository, an attacker registers an app named `<anything>[bot]`, installs it on an attacker-controlled repo, and uses its token to open a malicious issue on a target repository running the vulnerable Claude Code action. The action sees a `[bot]`-suffixed actor and grants full workflow execution rights — the default workflow has read/write access to code, issues, PRs, discussions, and workflow files. A separate finding covers the example workflow in Anthropic's official documentation, which exposes `secrets.GITHUB_TOKEN` to any external contributor without the write-permission gate. Critically, Anthropic's own `claude-code-action` repository used the vulnerable `agent` mode workflow, meaning a successful exploit against it would have injected malicious code into the action's source, propagating to every downstream consumer. The variants were exploited in the wild before the article was published (the Cline supply-chain incident in February 2026 used the same class). Anthropic rate this CVSS v4.0: 7.8; bug bounty paid. Fixed in claude-code-action v1.0.94. Separately, SecurityWeek reports that Claude Code, Gemini CLI, and GitHub Copilot agents are all vulnerable to prompt injection via malicious GitHub issue/PR comments — a structural class problem across AI-in-CI/CD tooling.
    ch_eu_nexus: "global; any EU public-sector or Swiss cantonal organisation using Claude Code GitHub Actions in their CI/CD pipelines is affected; the Anthropic action itself was a single-point-of-supply-chain-failure"
    public_sector_nexus: "indirect — affects developer tooling and CI/CD pipelines including those in public-sector organisations using Anthropic's claude-code-action"
    sector: "all sectors, software development, public-sector DevOps"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "I found a vulnerability that let an attacker bypass its permission controls and feed untrusted input into a workflow designed to process only trusted input. By default, the workflow has read and write access to code, issues, pull requests, discussions, and workflow files, so this bypass could be [exploited]."
        attribution: "GMO Flatt Security (RyotaK)"
        source_url: "https://flatt.tech/research/posts/poisoning-claude-code-one-github-issue-to-break-the-supply-chain/"
      - quote: "Note: Variants of the misconfiguration issues described in this article were actively exploited in the wild before this article was published."
        attribution: "GMO Flatt Security (RyotaK)"
        source_url: "https://flatt.tech/research/posts/poisoning-claude-code-one-github-issue-to-break-the-supply-chain/"
      - quote: "Anthropic rated the issues 7.8 under CVSS v4.0 and paid a bug bounty."
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/06/claude-code-github-action-flaw-let-one.html"
    extended_notes: |
      Defender actions: (1) Immediately update claude-code-action to v1.0.94 or later. (2) Audit all GitHub Actions workflows using `pull-request-target` or `issues` triggers with write permissions — these are structurally dangerous when combined with AI agent execution. (3) Inspect `allowed_non_write_users` configuration: never expose secrets beyond the Anthropic API key and `secrets.GITHUB_TOKEN` in such configurations. (4) Detection: GitHub Actions audit log entries (`workflow_run` events) for `[bot]`-suffixed actors triggering agent-mode Claude Code workflows; branch-protection bypass attempts. Broader class: this is a structural prompt-injection / actor-spoofing problem across AI-in-CI/CD tooling (Claude Code, Gemini CLI, GitHub Copilot Agents all affected per SecurityWeek), not a unique Anthropic issue.

  - title: "UPDATE: CVE-2022-0492 — Linux kernel cgroups v1 release_agent container escape added to CISA KEV (June 2, 2026); deadline June 5 — container escape to host root via unprivileged namespace mount"
    sources:
      - url: "https://www.cisa.gov/known-exploited-vulnerabilities-catalog"
        publisher: "CISA KEV Catalog"
        date: "2026-06-02"
        role: "primary"
      - url: "https://windowsforum.com/threads/cisa-kev-june-2-2026-linux-cgroups-android-framework-exploits-what-to-patch.421611/"
        publisher: "Windows Forum / Community analysis"
        date: "2026-06-02"
        role: "corroborating"
    discovery_trace: "first seen at: cisa-kev bridge, URL https://www.cisa.gov/known-exploited-vulnerabilities-catalog → in-window KEV addition dated 2026-06-02"
    summary: |
      CISA added CVE-2022-0492 to the Known Exploited Vulnerabilities catalog on 2026-06-02 (deadline June 5 for federal agencies), confirming active exploitation four years after the original disclosure and patch. The vulnerability resides in `cgroup_release_agent_write()` in `kernel/cgroup/cgroup-v1.c`: an unprivileged attacker who can mount cgroupfs in a new user namespace (enabled by default on many Linux distributions) can edit the `release_agent` file, which the kernel executes as root when any process in the cgroup terminates. In containerised environments (Docker, Kubernetes on cgroups v1 hosts), this path enables a container-to-host escape — a compromised container that gains unprivileged namespace creation can elevate to node root, then laterally compromise all pods on that node. CVSS 3.x: 7.8 High. The 2026 KEV listing follows a pattern of attackers rediscovering unpatched legacy instances; cgroups v1 is still active on many Ubuntu/Debian LTS, RHEL 7/8, and enterprise Kubernetes distributions that have not pinned `kernel.unprivileged_userns_clone=0`. Mitigations: apply kernel patches (most distros shipped fixes in April 2022); set `kernel.unprivileged_userns_clone=0` (Debian/Ubuntu) or `user.max_user_namespaces=0` (RHEL); enforce Seccomp and AppArmor/SELinux on containers; in Kubernetes, use PodSecurity Admission to reject `CAP_SYS_ADMIN`-capable containers. This is a delta update — CVE-2022-0492 appeared in this publication's prior coverage last seen 2026-06-03, but the KEV listing is a fresh, high-priority action signal.
    ch_eu_nexus: "global; EU public-sector Kubernetes and Linux infrastructure running cgroups v1 hosts is directly at risk; Swiss cantonal cloud operators with unpatched nodes"
    public_sector_nexus: "direct — Linux is the dominant OS in EU public-sector cloud and HPC environments"
    sector: "cloud, public-sector, infrastructure"
    cves:
      - CVE-2022-0492
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: update-to-prior:2026-06-03
    evidence:
      - quote: "Linux Kernel contains an improper authentication vulnerability which could allow for privilege escalation via the cgroups v1 release_agent feature."
        attribution: "CISA KEV Catalog"
        source_url: "https://www.cisa.gov/known-exploited-vulnerabilities-catalog"
    extended_notes: |
      Detection: monitor for mounts of cgroupfs type in new user namespaces (`unshare(CLONE_NEWUSER|CLONE_NEWNS)`), particularly from container runtimes not expected to perform such operations. Falco rule `New Mount in Container` (or Falco's built-in `CVE-2022-0492-Checker` detection rule) catches the exploit path. EDR/Linux AV: alert on `release_agent` writes not originating from the container runtime. Kubernetes: check node kernel version and cgroup driver (`cgroupfs` vs `systemd`); nodes using cgroupfs driver on unpatched kernels are at highest risk.

