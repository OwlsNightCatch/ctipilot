  - title: "Truffle Security: 9,300+ leaked AWS access keys still authenticate, and 768 of them hold full administrative control of the company account they belong to — most never rotated in five years"
    tail_gap: true
    sources:
      - { url: "https://trufflesecurity.com/blog/leaked-corporate-aws-keys-held-full-admin-rights", publisher: "Truffle Security", date: "2026-08-19", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/hundreds-of-leaked-aws-keys-give-full-control-over-corporate-accounts/", publisher: "BleepingComputer", date: "2026-08-21", role: "corroborating" }
    discovery_trace: "first seen at: bleepingcomputer (source-slice id, listing https://www.bleepingcomputer.com/news/security/) → primary: Truffle Security, URL https://trufflesecurity.com/blog/leaked-corporate-aws-keys-held-full-admin-rights"
    summary: |
      Truffle Security published research on 2026-08-19, picked up by BleepingComputer on 2026-08-21, that
      re-verified 10,616 AWS access-key pairs drawn from 431,875 public findings (code repositories, Git
      history, Docker images, CI logs and public datasets, spanning August 2022 to August 2026) using
      only read-only, non-destructive metadata calls — STS GetCallerIdentity, IAM ListAccessKeys, policy
      enumeration and account-contact/budget-alert checks — with no resource access, no data read, and
      nothing modified. 88% of the keys tested still authenticated. Of those, 768 live keys grant full
      administrative control of the AWS account they belong to: 526 are root account keys and 242 are IAM
      users with the AdministratorAccess managed policy attached. Hugging Face-hosted datasets were the
      single largest source, accounting for 8,482 of the exposed keys. The median live leaked key is five
      years old, and 86% have never been rotated since creation; only 9.5% of the affected accounts have
      any billing/budget alert configured, so an attacker abusing a live key could also operate undetected
      on the victim's own cost dashboard. Truffle Security's stated remediation is to delete root access
      keys entirely, enforce maximum key-age rotation policies, configure budget alerts, and treat any
      credential that has ever appeared in a commit history as compromised regardless of subsequent
      history rewrites.
