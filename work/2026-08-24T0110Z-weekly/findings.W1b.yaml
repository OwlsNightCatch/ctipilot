  - title: "Unit 42 frames a defender taxonomy for software-development-lifecycle supply-chain compromise across developer endpoints, CI/CD pipelines and cloud runtimes, tying together prior npm-worm and build-tool incidents into one attack-surface model"
    tail_gap: true
    sources:
      - { url: "https://unit42.paloaltonetworks.com/sdlc-supply-chain/", publisher: "Palo Alto Networks Unit 42", date: "2026-08-21", role: "primary" }
    discovery_trace: "first seen at: unit42 (source-slice id, listing https://unit42.paloaltonetworks.com/) → primary: Unit 42, URL https://unit42.paloaltonetworks.com/sdlc-supply-chain/"
    summary: |
      Unit 42 published a defensive-framework piece on 2026-08-21 arguing that software supply-chain
      attacks have moved beyond compromising finished applications to targeting the entire software
      development lifecycle — developer endpoints, CI/CD pipelines and cloud build runtimes. It uses the
      ChainDrop npm worm (already tracked in this registry as campaign:shai-hulud-chaindrop-2026-08,
      which infected 400+ packages including keyv and cacheable-request via malicious preinstall scripts
      to steal OpenID Connect tokens and credentials from GitHub Actions runners and persist by modifying
      a developer's VS Code tasks.json) as its central case study, and situates it alongside prior
      incidents — XZ Utils (CVE-2024-3094), the Axios npm compromise, the Shai-Hulud lineage, the
      GlassWorm OpenVSX self-propagating worm, and the Trivy build-tool supply-chain compromise — as
      instances of one attack-surface class rather than unrelated events. Its stated mitigations: disable
      package lifecycle install scripts (--ignore-scripts), enforce new-package publication cooldowns
      before adoption, restrict CI/CD runner egress, use ephemeral build servers, pin dependencies to
      exact commit SHAs rather than version ranges, move toward short-lived OIDC tokens instead of static
      credentials, and verify cryptographic package provenance before build.
    region_nexus: "global; framework applicable to any organisation's software development pipeline"
    primary_sector_nexus: "indirect"
    sector: "public-sector, finance, telco"
    cves: []
    techniques: [T1195.002, T1528]
    affected_products: []
    entity_keys: ["campaign:shai-hulud-chaindrop-2026-08"]
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "By targeting continuous integration/continuous delivery (CI/CD) pipelines and developer environments, they hijack software at the source before it ever hits production."
        attribution: "Palo Alto Networks Unit 42"
        source_url: "https://unit42.paloaltonetworks.com/sdlc-supply-chain/"
      - quote: "Developer tools lack basic guardrails...the second they run, they get the same permissions you have, giving malware total freedom."
        attribution: "Palo Alto Networks Unit 42"
        source_url: "https://unit42.paloaltonetworks.com/sdlc-supply-chain/"
    extended_notes: |
      This is substantially a synthesis/awareness piece tying together already-known incidents (ChainDrop
      is already a registered campaign; XZ Utils, Axios and Shai-Hulud are all historical) under a named
      attack-surface framework rather than reporting new technical findings of its own. Marked borderline
      for the main agent's judgement — the mitigations list (--ignore-scripts, cooldowns, egress
      restriction, ephemeral runners, SHA pinning, OIDC, provenance verification) is the concretely useful,
      hardening-lever part; the rest repackages prior coverage.
    borderline: true
    borderline_reason: "primarily a synthesis/awareness framework over already-known incidents (ChainDrop, XZ Utils, Axios, Shai-Hulud) rather than new primary technical findings; the mitigations checklist is the novel, actionable part"

