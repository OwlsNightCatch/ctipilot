items:
  - title: "MoYu Group turns a legitimate automotive-head-unit updater into a proxy-botnet dropper — the first documented malware infection chain built specifically for a car head unit"
    tail_gap: true
    sources:
      - { url: "https://securelist.com/android-head-unit-malware/121106/", publisher: "Kaspersky Securelist (Dmitry Kalinin)", date: "2026-08-21", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/hackers-infect-android-car-head-units-with-proxy-botnet-malware/", publisher: "BleepingComputer", date: "2026-08-22", role: "corroborating" }
    discovery_trace: "first seen at: kaspersky-securelist (source-slice id, listing https://securelist.com/) → primary: Kaspersky Securelist, URL https://securelist.com/android-head-unit-malware/121106/ → corroborating: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/hackers-infect-android-car-head-units-with-proxy-botnet-malware/"
    summary: |
      Kaspersky published research on 2026-08-21 documenting the first known malware infection chain
      built specifically for an automotive head unit: Android-based DoFun-brand head units whose
      legitimate over-the-air updater application, TWCore, was weaponised to push malicious APKs over
      MQTT messaging with no user interaction. The dropper, JarService, XOR-decrypts an embedded payload
      that fetches a final-stage module named "zhima" — a reverse-proxy client that recruits the device
      into a residential-proxy botnet used for click fraud, geo-restriction circumvention and traffic
      monetisation, supporting nine remote commands for device reconnaissance and arbitrary module
      execution. Kaspersky attributes the campaign to a cluster it calls the MoYu Group on infrastructure
      overlap and internal naming-convention similarity with the BADBOX botnet platform (the ecosystem
      Google and Human Security disrupted in prior operations). Kaspersky and BleepingComputer both state
      the malware does not touch driving-critical vehicle-control functions — the compromise is confined
      to the infotainment/connectivity head unit and its ad-fraud/proxy value to the operator. No CVE is
      involved; the attack surface is a legitimate supply-chain update mechanism trusted by the device,
      not a software flaw.
    region_nexus: "global; DoFun head units are an aftermarket/OEM automotive component with no stated regional restriction — transferable lesson for any fleet or personal-vehicle IoT/infotainment supply chain"
    primary_sector_nexus: "indirect"
    sector: "transport"
    cves: []
    techniques: [T1195.002]
    affected_products: ["DoFun automotive head units", "TWCore"]
    entity_keys: []
    new_entities:
      - { key: "actor:moyu-group", type: actor, name: "MoYu Group", aliases: [],
          summary: "Kaspersky designation for the cluster behind a supply-chain compromise of the DoFun automotive head-unit OTA updater (TWCore), which Kaspersky links to the BADBOX botnet platform by infrastructure overlap and internal naming-convention similarity (Kaspersky Securelist, 2026-08-21)." }
      - { key: "malware:zhima", type: malware, name: "zhima", aliases: [],
          summary: "Reverse-proxy final-stage module delivered by the JarService dropper on compromised DoFun automotive head units, recruiting the device into a residential-proxy botnet for ad fraud and traffic monetisation (Kaspersky Securelist, 2026-08-21)." }
    relation_suggestions:
      - { subject: "actor:moyu-group", object: "malware:zhima",
          basis: "Kaspersky: the operator loaded the reverse-proxy module 'zhima' as the final payload turning the head unit into a proxy botnet node (Kaspersky Securelist, 2026-08-21)" }
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "This is the first documented case of malware found on a car head unit with an infection chain specific to that type of device."
        attribution: "Kaspersky Securelist"
        source_url: "https://securelist.com/android-head-unit-malware/121106/"
      - quote: "The malware does not interfere with driving or critical vehicle control systems, and appears designed for advertising fraud and turning internet-connected car head units into residential proxy nodes."
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/hackers-infect-android-car-head-units-with-proxy-botnet-malware/"
      - quote: "The malware spread through the built-in updaters of Android-based automotive head unit firmware."
        attribution: "Kaspersky Securelist"
        source_url: "https://securelist.com/android-head-unit-malware/121106/"
    extended_notes: |
      Detection concept, telemetry-class-first: an in-vehicle/connected-fleet IoT inventory should treat
      unexpected outbound MQTT sessions from an infotainment unit, or reverse-proxy/relay traffic
      egressing from an OTA-update process, as the anchor signal — the update mechanism itself is the
      abused telemetry class, not a discrete IOC. No patch exists because no vulnerability is involved;
      the lever is supply-chain trust in the OTA channel, which is a hardening/vendor-assurance question
      (does the updater verify payload provenance/signing before install) rather than a patchable flaw.
    borderline: false

  - title: "FTP server banners join Pinterest and SurveyMonkey as dead-drop resolvers for two new, previously undocumented RATs"
    tail_gap: true
    sources:
      - { url: "https://socradar.io/blog/ftp-banners-new-dead-drop-resolver-rats/", publisher: "SOCRadar Threat Research Unit", date: "2026-08-21", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/hackers-abuse-ftp-server-banners-to-deliver-new-windows-malware/", publisher: "BleepingComputer", date: "2026-08-21", role: "corroborating" }
    discovery_trace: "first seen at: socradar (source-slice id, listing https://socradar.io/blog/) → primary: SOCRadar, URL https://socradar.io/blog/ftp-banners-new-dead-drop-resolver-rats/ → corroborating: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/hackers-abuse-ftp-server-banners-to-deliver-new-windows-malware/"
    summary: |
      SOCRadar's Threat Research Unit documented, on 2026-08-21, a dead-drop-resolver (DDR) technique
      active since July 2026 in which threat actors embed C2 addressing and staged instructions inside
      the banner text an FTP server sends on connection — a channel most defenders do not monitor as a
      DDR the way they would a GitHub Gist or Pastebin page. Delivery starts from ZIP archives carrying
      malicious .LNK shortcut files that pull PowerShell from the FTP-banner response. Two previously
      undocumented RAT families ride this delivery: E4del, a Node.js/Electron implant masquerading as
      Discord with command execution, screenshot capture and desktop streaming, using tiered jitter
      beaconing and AES-256-CBC encryption; and PINHOLE, a multi-stage RAT that resolves its C2
      configuration from Pinterest pins and SurveyMonkey survey questions with Cloudflare Workers
      proxying the traffic, and that uses Halo's Gate syscall-stub inspection to evade EDR hooking plus
      Early Bird APC injection for process hollowing, keeping only a single 4 KB page of shellcode
      decrypted and executable at any time ("shellcode fluctuation") and storing its configuration in an
      NTFS Alternate Data Stream on disk. SOCRadar assigns no actor attribution to either cluster.
    region_nexus: "global; no stated regional targeting"
    primary_sector_nexus: "indirect"
    sector: "public-sector, finance, telco"
    cves: []
    techniques: [T1102.001, T1055.004, T1564.004]
    affected_products: []
    entity_keys: []
    new_entities:
      - { key: "malware:e4del", type: malware, name: "E4del", aliases: [],
          summary: "Node.js/Electron-based RAT masquerading as Discord, delivered via FTP-banner dead-drop-resolver staging; implements tiered jitter beaconing and AES-256-CBC C2 encryption (SOCRadar Threat Research Unit, 2026-08-21)." }
      - { key: "malware:pinhole-rat", type: malware, name: "PINHOLE", aliases: [],
          summary: "Multi-stage RAT resolving its C2 configuration from Pinterest pins and SurveyMonkey survey content behind Cloudflare Workers proxying, using Halo's Gate syscall evasion, Early Bird APC injection ('shellcode fluctuation') and NTFS Alternate Data Stream configuration storage (SOCRadar Threat Research Unit, 2026-08-21)." }
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "FTP banners represent a novel alternative...less stealthy than traditional web-based DDRs, as security teams are more likely to flag FTP connections to unknown servers as anomalous."
        attribution: "SOCRadar Threat Research Unit"
        source_url: "https://socradar.io/blog/ftp-banners-new-dead-drop-resolver-rats/"
      - quote: "PINHOLE retrieves its C2 configuration from Pinterest pins and SurveyMonkey survey questions, a tactic that offers versatility and resilience to take-downs."
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/hackers-abuse-ftp-server-banners-to-deliver-new-windows-malware/"
      - quote: "Only a single 4 KB page of the payload remains decrypted and executable at any given time...a mechanism commonly referred to as shellcode fluctuation."
        attribution: "SOCRadar Threat Research Unit"
        source_url: "https://socradar.io/blog/ftp-banners-new-dead-drop-resolver-rats/"
    extended_notes: |
      Detection concept: network egress monitoring for outbound connections to FTP servers on
      unexpected/first-seen hosts immediately followed by PowerShell process spawning is the specific,
      telemetry-class-first hunt SOCRadar itself frames as the discriminator (ordinary FTP client use
      rarely chains directly into script-host execution). For PINHOLE specifically, syscall-stub
      integrity checks (Halo's Gate detection relies on inspecting the stub bytes at the syscall
      instruction rather than trusting ntdll export addresses) and monitoring APC-queue injection into a
      newly created, suspended process (Early Bird pattern) are the process-injection-class hunts.
    borderline: false

  - title: "SynkLoader: a new multi-language malware family distributed through Microsoft Teams helpdesk-impersonation phishing, chaining reconnaissance, credential-phishing lock-screen, persistence, reverse-proxy tunnelling and VNC into one loader"
    tail_gap: true
    sources:
      - { url: "https://expel.com/blog/synkloader-when-you-throw-in-everything-but-the-kitchen-sink/", publisher: "Expel (Marcus Hutchins)", date: "2026-08-20 (updated 2026-08-21)", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/new-synkloader-malware-pushed-in-microsoft-teams-phishing-campaign/", publisher: "BleepingComputer", date: "2026-08-21", role: "corroborating" }
    discovery_trace: "first seen at: bleepingcomputer (source-slice id, listing https://www.bleepingcomputer.com/news/security/) → primary: Expel, URL https://expel.com/blog/synkloader-when-you-throw-in-everything-but-the-kitchen-sink/"
    summary: |
      Expel researcher Marcus Hutchins published an analysis on 2026-08-20 (updated 2026-08-21) of
      SynkLoader, a newly identified malware family distributed via Microsoft Teams messages in which
      the attacker impersonates the target organisation's own IT help desk — the same tactic pattern
      Microsoft flagged earlier this year as an increasingly common Teams-abuse vector, and directly
      complementary to Unit 42's 2026-08-20 telemetry finding (already covered this week) that
      collaboration-platform malicious activity quadrupled year-on-year with 99% starting as chat
      phishing. The lure directs the victim to install a fake "PowerShell Cleaner" MSI hosted on
      Microsoft Azure infrastructure; the installer extracts a PowerShell script and a ZIP archive
      containing a Python framework, additional scripts, and DLLs disguised as Microsoft runtime
      components. Compiled around 2026-07-28, SynkLoader deliberately blends Python, PowerShell, C# and
      C++ — sometimes three languages in a single module — across six identified modules: a System
      Profiler for environment reconnaissance, PhishLocker (a fake Windows 11 lock screen for credential
      theft), a Persistence Module using scheduled tasks, TrafficRedirector (a reverse proxy),
      an interactive-shell RAT, and StreamMaster (VNC-style remote desktop). Expel assesses the harvested
      domain password, combined with the tunnelling module, would let the operator reach the corporate
      environment from the infected device while bypassing IP-allowlist restrictions, and states
      Active-Directory-targeting patterns in the code make ransomware-affiliate use of the loader likely.
    region_nexus: "global; targets any organisation using Microsoft Teams for internal support workflows — directly relevant to Swiss/EU public-sector and enterprise Teams deployments"
    primary_sector_nexus: "direct"
    sector: "public-sector, finance, telco"
    cves: []
    techniques: [T1684.001, T1204.002, T1053.005, T1090]
    affected_products: ["Microsoft Teams"]
    entity_keys: []
    new_entities:
      - { key: "malware:synkloader", type: malware, name: "SynkLoader", aliases: [],
          summary: "Multi-language (Python/PowerShell/C#/C++) malware loader distributed via Microsoft Teams IT-helpdesk-impersonation phishing behind a fake 'PowerShell Cleaner' MSI; modules span reconnaissance, a fake-lock-screen credential phisher (PhishLocker), scheduled-task persistence, a reverse-proxy tunnel (TrafficRedirector), an interactive-shell RAT and VNC-style remote desktop (StreamMaster). Expel assesses likely ransomware-affiliate use on Active-Directory-targeting patterns in the code (Expel, 2026-08-20)." }
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "The attacker impersonates the target company's IT help desk, a tactic Microsoft highlighted earlier this year as increasingly common in multi-stage attacks."
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/new-synkloader-malware-pushed-in-microsoft-teams-phishing-campaign/"
      - quote: "SynkLoader was named as such because of its unusual combination of Python, PowerShell, C#, and C++, sometimes blending up to three programming languages in a single module."
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/new-synkloader-malware-pushed-in-microsoft-teams-phishing-campaign/"
      - quote: "By obtaining the password, the attackers could use it alongside the tunneling module to access corporate environments from the infected device, bypassing IP allow-list restrictions."
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/new-synkloader-malware-pushed-in-microsoft-teams-phishing-campaign/"
    extended_notes: |
      Directly complements this week's already-published Unit 42 collaboration-platform telemetry
      finding (99% of malicious Teams/Slack activity starting as chat phishing) with a concrete, named
      malware family riding exactly that vector — the main agent may want to reference the two together
      rather than as fully independent items. Detection concept: an MSI installer launched from a Teams
      chat attachment/link, followed by PowerShell extracting a bundled Python interpreter and DLLs named
      after Microsoft runtime components (but not signed by Microsoft), is the process-lineage anchor;
      the fake Windows-11-style full-screen lock overlay (PhishLocker) appearing outside a normal
      lock/unlock session is the user-facing tell.
    borderline: false

  - title: "ToxicPanda 2.0: the Android banking trojan adds VPN-permission abuse to silently block Google Play's own security checks, plus wireless-ADB shell takeover"
    tail_gap: true
    sources:
      - { url: "https://zimperium.com/blog/the-toxicpanda-never-sleeps-toxicpanda-2.0-prepares-its-next-strike-on-mobile", publisher: "Zimperium zLabs", date: "2026-08-19", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/toxicpanda-android-malware-uses-vpn-permissions-to-block-google-play/", publisher: "BleepingComputer", date: "2026-08-23", role: "corroborating" }
    discovery_trace: "first seen at: bleepingcomputer (source-slice id, listing https://www.bleepingcomputer.com/news/security/) → primary: Zimperium zLabs, URL https://zimperium.com/blog/the-toxicpanda-never-sleeps-toxicpanda-2.0-prepares-its-next-strike-on-mobile"
    summary: |
      Zimperium published an update on 2026-08-19, picked up by BleepingComputer on 2026-08-23, on a new
      version of the ToxicPanda Android banking trojan expanding its target list to 349 financial and
      cryptocurrency applications across 16 countries in Europe and Latin America, up sharply from the
      family's earlier scope. Two mechanisms are new: first, the dropper displays a fake installation
      screen through a WebView to trick the victim into granting VPN-service permission, which the
      malware then uses to stand up a local network interface that intercepts and silently blocks
      Google Play and Google Play Protect's own network communications — defeating the security checks
      and update mechanism a victim might otherwise rely on to catch or remove it. Second, the malware
      automates abuse of Android's Wireless Debugging (ADB) feature in five stages: enabling Developer
      Options, locating the Wireless Debugging setting, using Accessibility-Service UI-node extraction to
      read the six-digit SPAKE2 pairing code off-screen, completing the pairing handshake programmatically,
      and using the resulting ADB shell access to execute high-privilege commands directly through the
      ADB daemon — reaching shell-level control without an exploit. The malware supports 167 remote
      commands and layers phishing overlays, fake system-update screens and a spoofed lock screen for PIN
      harvesting on top. Distribution infrastructure is hosted on Amazon AWS-hosted storage buckets;
      Zimperium names Xiaomi, OPPO, Vivo, Samsung and Huawei devices among observed targets.
    region_nexus: "Europe and Latin America named explicitly; global distribution infrastructure"
    primary_sector_nexus: "direct"
    sector: "finance"
    cves: []
    techniques: [T1204.002]
    affected_products: ["Android"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "By abusing the Android Accessibility Service, threat actors can steal every UI element on the screen, alongside an overlay-based credential theft mechanism targeting 349 financial institutions."
        attribution: "Zimperium zLabs"
        source_url: "https://zimperium.com/blog/the-toxicpanda-never-sleeps-toxicpanda-2.0-prepares-its-next-strike-on-mobile"
      - quote: "The feature enables ToxicPanda 2.0 to block communication from Google Play and Google Play Services."
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/toxicpanda-android-malware-uses-vpn-permissions-to-block-google-play/"
      - quote: "Once the malware gains shell user permissions, it starts executing high-privilege commands directly through the ADB daemon."
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/toxicpanda-android-malware-uses-vpn-permissions-to-block-google-play/"
    extended_notes: |
      ToxicPanda is a previously known family (first documented 2024, not newly registered here); this
      item is the 2.0 evolution. No Enterprise ATT&CK mapping cleanly covers the mobile-specific
      behaviours (VPNService-permission abuse, Accessibility-Service UI scraping, wireless-ADB pairing
