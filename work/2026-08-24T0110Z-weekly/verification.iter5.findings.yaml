  item: "sources_changed[trendmicro-research] describes a change the file does not carry and contradicts the notes body"
  url_or_quote: "change: \"note only — same shape defect (fetch_method rss, rss_url null) but no feed URL could be verified this run; a feedburner guess 404s and the reader pool is credit-exhausted. NOT demoted — a recipe gap plus a quota condition is never a content failure\""
  summary: >-
    Frontmatter was not amended when the maintenance prose was. The notes body now says
    "the primary weekly did, and its record for that source (carrying the feedburner URL)
    was taken in preference to this run's weaker note", and the working tree agrees: the
    trendmicro-research record is byte-identical to origin/main's (verified by dict compare
