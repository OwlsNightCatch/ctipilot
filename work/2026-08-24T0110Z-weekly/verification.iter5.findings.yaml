    tools/fetch_source.py url — returns a valid RSS channel "Trend Micro Research, News,
    Perspectives") and main's own 2026-08-23 note. This run's note is NOT in the file, and
    check_run.py's sources-touched check counts only huntress and expel as fetched on
    2026-08-24. So (a) "note only" claims a change that does not exist, and (b) "fetch_method
    rss, rss_url null" states a present-tense condition that the file no longer has — a
    machine consumer of sources_changed would conclude the source is still feedless. The
    sub-clause "a feedburner guess 404s" is itself accurate (the run's guess was
    https://feeds.feedburner.com/TrendMicroResearchNewsAndPerspectives per
    work/2026-08-24T0110Z-weekly/findings.W1b.yaml coverage_gaps, and it does fail — probed
    this iteration), but it now reads as though the working feedburner URL was disproved.
    Fix: restate to origin/main's own convention for exactly this case — cf. its
    sources_changed entry `change: "no record change — investigated as the sweep's only
    UNSOLVED and found healthy..."` — e.g. "no record change by this run — same shape defect
    diagnosed (this run's own guessed feedburner path 404s), but the primary weekly located
    and shipped the working feed URL first and its record was adopted in preference."
