  - title: "Unit 42 telemetry: malicious activity on Microsoft Teams and Slack quadrupled year-on-year, and 99% of it starts as chat phishing that authentication logs alone cannot see"
    sources:
      - { url: "https://unit42.paloaltonetworks.com/communication-channel-identity-risks/", publisher: "Palo Alto Networks Unit 42 (Bill Batchelor)", date: "2026-08-20", role: "primary" }
    discovery_trace: "first seen at: unit42 (source-slice id, listing https://unit42.paloaltonetworks.com/) → primary: Unit 42, URL https://unit42.paloaltonetworks.com/communication-channel-identity-risks/"
    summary: |
      Unit 42 published telemetry-driven research (2026-08-20) showing endpoint alerts tied to malicious activity on enterprise collaboration platforms — overwhelmingly Microsoft Teams and Slack — have more than quadrupled over the last 12 months, with 99% of the generated alerts tracing to chat-phishing operations rather than exploited software flaws. The article frames three attack phases entirely built on abusing legitimate collaboration-platform features: (1) Initial Access via external federation and direct messages, in observed cases delivering malware through WinRAR-based DLL side-loading; (2) Impersonation via compromised accounts and staged workspaces spoofing legitimate organizations, citing the Fireblocks "Contagious Interview" recruitment-scam pattern (DPRK-nexus) and the Axios npm maintainer social-engineering compromise as concrete precedents; (3) Persistence via native integrations — specifically Slack webhooks abused for credential exfiltration from compromised network appliances. Because the attacker operates inside an already-authenticated session using the victim's own identity, the activity is indistinguishable from normal collaboration traffic to controls that watch only authentication and email; Unit 42's own framing is that authentication alone no longer establishes trust and defenders must add visibility into messaging, file-sharing, external-tenant interaction and webhook traffic as first-class telemetry classes.
    region_nexus: "global; the underlying platforms (Teams, Slack) are near-universal in Swiss and EU public-sector and enterprise environments"
    primary_sector_nexus: "direct"
    sector: "public-sector, finance, telco"
    cves: []
    techniques: [T1566.002, T1528, T1078.004]
    affected_products: ["Microsoft Teams", "Slack"]
