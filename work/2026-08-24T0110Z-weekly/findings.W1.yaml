items:
  - title: "SilkParasite — a new China-nexus APT fields five previously undocumented RAT families against Central Asian and Georgian government bodies, one of them C2'd entirely through a shared Google Drive folder"
    sources:
      - { url: "https://www.bitdefender.com/en-us/blog/businessinsights/silkparasite-tracking-china-nexus-apt-across-central-asia", publisher: "Bitdefender Business Insights (Martin Zugec)", date: "2026-08-19", role: "primary" }
      - { url: "https://therecord.media/china-cyber-espionage-central-asia", publisher: "The Record (Jonathan Greig)", date: "2026-08-20", role: "corroborating" }
      - { url: "https://blog.talosintelligence.com/new-spicerat-sneakychef/", publisher: "Cisco Talos", date: "unknown (cited as prior research)", role: "corroborating — attribution basis for SpiceRAT/SneakyChef link" }
    discovery_trace: "first seen at: WebSearch (\"Bitdefender SilkParasite China-nexus APT Central Asia\") surfaced from the bitdefender-threat-debrief source-slice entry's listing page (https://www.bitdefender.com/en-us/blog/businessinsights/) → primary: Bitdefender Business Insights, URL https://www.bitdefender.com/en-us/blog/businessinsights/silkparasite-tracking-china-nexus-apt-across-central-asia → corroborating: The Record, URL https://therecord.media/china-cyber-espionage-central-asia"
    summary: |
      Bitdefender Labs published (2026-08-19) an assessed-medium-confidence China-nexus cyberespionage campaign, SilkParasite, against government bodies in Uzbekistan, Turkmenistan, Kyrgyzstan, Tajikistan, Kazakhstan and Georgia, discovered after a late-2025 infection at a Central Asian government body involved in economic decision-making and traced back roughly a year. The toolset comprises seven RAT families, five previously undocumented and newly named by Bitdefender: DriveSilkRAT (C++/.NET, routes command-and-control entirely through a shared Google Drive folder using in-memory .NET plugins rather than a dedicated C2 server — network telemetry sees ordinary Google Drive traffic); CookiETagRAT (hides tasking inside HTTP Cookie and ETag response headers); NomadRAT (C++) and GoginRAT (Go), both modular with separate transmitter libraries and numbered plugins fetched on demand; and NodeEdgeRAT. Delivery is spear-phishing with malicious Office documents (often macro-laden, sometimes inside password-protected RAR archives) that trigger DLL side-loading chains in which legitimately signed applications — Calibre, ABBYY FineReader, Mp3tag, Windows Defender, Quick Heal — load a malicious DLL placed in the same directory. Attribution to a China-nexus actor is medium confidence, resting on Cisco Talos's prior public link of the known SpiceRAT family (also present in this toolset alongside BloodAlchemy) to SneakyChef, a China-based espionage group active since August 2023; on infrastructure analysis tying several IPs to China Unicom's backbone; and on victimology consistent with Chinese intelligence interests. Bitdefender assesses the toolset was built by human malware developers assisted by (not generated by) AI — leftover Go test functions, placeholder encryption keys and shared cross-language architectural patterns are the tells, without the degradation AI-generated code typically shows. Bitdefender's own detection framing: the most consistent surface across the whole campaign is DLL side-loading, and the reliable signal is the *pairing* — a legitimately signed application loading a library placed beside it — not any single DLL name.
    region_nexus: "Central Asia (Uzbekistan, Turkmenistan, Kyrgyzstan, Tajikistan, Kazakhstan) and Georgia — outside the constituency's home region, but a live China-nexus espionage toolset and DLL-side-loading detection pattern directly transferable to any government-sector hunt team"
