    discovery_trace: "first seen at: WebSearch (\"Berlin Landesnetz Cyberangriff Stand 23 August 2026\") → pivot: WebSearch (\"Berlin Senatsverwaltung Cyberangriff Wohngeld Update\") → primary: Tagesspiegel, URL https://www.tagesspiegel.de/berlin/wohngeld-kann-ausgezahlt-werden-berliner-senatsverwaltungen-sind-nach-hackerangriff-wieder-online-15973885.html → corroboration: heise online, URL https://www.heise.de/news/Berliner-Verwaltungen-nach-Cyberangriff-weiter-vom-Netz-getrennt-11421320.html → corroboration: berlin.de (Senatskanzlei) official release, URL https://www.berlin.de/aktuelles/10581479-958090-hackerangriff-auf-landesnetz-arbeit-mit-.html. This item settles the specific mission task set in the spawn message and continues the open row in state/coverage_backlog.md (surfaced 2026-08-20, re-confirmed still-blocked 2026-08-23)."
    summary: |
      Status update on the compromise of Berlin's shared state administrative network (Landesnetz), which the Senate Chancellery confirmed on 2026-08-17 and which had isolated the Senate Administrations for Urban Development/Building/Housing and for Mobility/Transport/Climate/Environment since 2026-08-14. heise online reported on 2026-08-21 that both administrations remained isolated, still cut off from external email and the internet, with housing-benefit (Wohngeld) payouts to more than 50,000 eligible households and "Bildung und Teilhabe" child/youth support payments still blocked and no restoration timeline given. Tagesspiegel reported on 2026-08-23 that both administrations have been reconnected to the Landesnetz since the weekend (2026-08-22/23): the specialised procedures are available again, Wohngeld payouts are again possible, but new Wohngeld applications were still not processable at time of writing and "occasional disruptions and delays" were not excluded. Both administrations have implemented "immediate measures to increase IT security," including continuous enhanced monitoring. Forensic investigation by LKA Berlin, the Berlin public prosecutor and BSI continues; the Senate spokesperson (Christine Richter) has disputed one broadcaster's (rbb) reporting of sensitive-data exfiltration, stating that what left was open-data-class geodata already publicly accessible, not sensitive data. Separately, the incident triggered a governance debate: Finance Senator Stefan Evers (CDU) used the episode to call publicly for a centralised digital budget and a Chief Digital Officer with cross-departmental authority, arguing decentralised Berlin IT-resource ownership ("dezentrale Ressourcenverantwortung") impeded the response.

      **No named, attributable authority — not BSI, not the Senate Chancellery, not LKA, not the public prosecutor, across any of the five sources checked this run spanning 2026-08-17 through 2026-08-23 — states an initial-access vector, an exploited product, or a CVE.** The Senate Chancellery's own releases withhold detail "for investigative reasons." No source found this run repeats or newly corroborates the single "malware-bearing PDF/email attachment" claim that traced, in the prior run's research, to one outlet citing Reuters citing unnamed "Sicherheitskreise" (security-circle sources) — that claim remains unconfirmed by any authority and was not seen again in this sweep.
