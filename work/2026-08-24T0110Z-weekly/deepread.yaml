        - "Halo's Gate — exploits the fact Windows assigns syscall numbers (SSNs) sequentially in memory; when the target function's SSN bytes are hooked by an EDR, it scans neighboring unhooked functions immediately above/below in memory, extracts their SSNs, and calculates the target's actual SSN via arithmetic offset, then issues direct syscalls to bypass userland hooks (page notes this improves on the older Hell's Gate technique, which fails when the target function itself is hooked)."
        - "Early Bird APC Injection — used to inject the next-stage payload into a legitimate process after C2 retrieval."
        - "Shellcode fluctuation — only a single 4 KB page of the payload (of ~15 KB total / 15.5 KB position-independent loader) remains decrypted and executable at any given time; a memory dump at an arbitrary moment yields only one readable page, leaving ~11 KB fully encrypted. Payload upgrades the target page to PAGE_EXECUTE_READ then returns EXCEPTION_CONTINUE_EXECUTION to resume seamlessly."
        - "ADS-based configuration storage — build token and C2-DDR decryption key stored in the Alternate Data Streams of desktop.ini files rather than as a discrete config file on disk."
        - "Persistence via legacy 'Load' registry value at HKCU\\Software\\Microsoft\\Windows NT\\CurrentVersion\\Windows, copying itself to C:\\Users\\{user}\\AppData\\Local\\Packages\\{random_name}\\{random_name}.exe."
