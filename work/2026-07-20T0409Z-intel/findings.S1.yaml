    extended_notes: |
      Detection concept (behavioural, no IOCs): the researcher's public config-scanner
      (github.com/0xCyberstan/CVE-2026-42533-Config-Scanner) statically flags nginx configs that
      combine a regex-capturing block with a regex `map` variable referenced afterward in the same
      evaluated string — run it against every internet-facing nginx/NGINX Plus config now, before
      patching, to know which vhosts were exposed. At the network layer: anomalously large or
      malformed request bodies immediately followed by worker-process restarts/crashes on nginx edge
      hosts is the DoS-primitive's crash signature; a GET immediately followed by a POST from the
      same source to the same vhost, where the GET's response size deviates from the configured
      capture's expected length, is the two-request exploitation chain's shape (info-leak GET, then
      overflow POST) — though this is inferred from the mechanism, not stated by the source as an
      observed detection rule. Hardening: upgrade to 1.30.4/1.31.3/NGINX Plus 37.0.3.1 immediately;
      until patched, restructure any config matching the vulnerable pattern (move the map-variable
      reference before the capture reference, or split them into separate evaluated expressions).
      Relevant precedent the researcher cites: CVE-2026-42945 ("Rift"), a weaker flaw in the same
      nginx script engine that required ASLR disabled, "saw active exploitation shortly after its
      PoC dropped" — the same trajectory should be assumed here once the withheld PoC ships (~early
      August 2026 by the researcher's stated timeline).
