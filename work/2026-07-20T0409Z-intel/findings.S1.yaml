items:
  - title: "CVE-2026-42533 — nginx/NGINX Plus: 15-year-old two-pass capture-clobbering heap overflow, researcher disputes F5's DoS-only framing and demonstrates pre-auth RCE"
    sources:
      - { url: "https://cyberstan.co.uk/nginx-rce/", publisher: "cyberstan.co.uk (Stan Shaw, independent researcher, reported to F5 SIRT)", date: "2026-07-19", role: "primary" }
      - { url: "https://thehackernews.com/2026/07/critical-nginx-vulnerability-can-crash.html", publisher: "The Hacker News", date: "2026-07-19", role: "corroborating" }
      - { url: "https://www.securityweek.com/f5-patches-multiple-nginx-big-ip-vulnerabilities/", publisher: "SecurityWeek", date: "2026-07-16", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"new CVE exploit proof-of-concept published this weekend security research\") → pivot: The Hacker News, URL https://thehackernews.com/2026/07/critical-nginx-vulnerability-can-crash.html → primary: cyberstan.co.uk (discoverer's own technical write-up), URL https://cyberstan.co.uk/nginx-rce/ → corroborating: SecurityWeek, URL https://www.securityweek.com/f5-patches-multiple-nginx-big-ip-vulnerabilities/ (confirms F5's out-of-band patch and CVSS 9.2 rating) → CVE identifier verified via NVD (https://nvd.nist.gov/vuln/detail/CVE-2026-42533, not cited as a source per policy)"
    summary: |
      CVE-2026-42533 is a missing save/restore of PCRE capture state across nginx's two-pass
      script-expression engine (LEN-measure pass then VALUE-write pass) in ngx_http_script.c /
      ngx_stream_script.c, reachable from any directive that evaluates a compiled expression:
      proxy_set_header, fastcgi_param, scgi_param, uwsgi_param, grpc_set_header, return, add_header,
      rewrite, set, root, alias, access_log. When a config combines a regex-capturing block
      (location/server_name/rewrite/if) with a regex `map` directive referenced after the capture in
      the same evaluated string, evaluating the map's regex mid-pass clobbers the shared
      r->captures/r->captures_data state, so the LEN and VALUE passes disagree on buffer size —
      an unauthenticated, pre-auth heap buffer overflow triggerable via crafted HTTP requests. The
      bug has existed since nginx 0.9.6 (2011, when `map` gained regex support) through 1.30.3 /
      1.31.2; F5 (which now owns nginx) shipped an out-of-band fix in nginx 1.30.4 (stable), 1.31.3
      (mainline) and NGINX Plus 37.0.3.1 / R36 P7 on 2026-07-15/16 (CVSS 3.1 8.1 / CVSS 4.0 9.2).
      F5's advisory frames real-world risk on ASLR-enabled systems as primarily denial-of-service;
      independent researcher Stan Shaw (credited in the fix, reported directly to F5 SIRT) disputes
      that framing and demonstrates two chainable primitives — an information-leak variant (clobbered
      capture smaller than original) that returns uninitialized heap residue (a libc pointer at
      offset 0x08, a heap pointer at 0x10) sufficient to defeat ASLR in one unauthenticated GET, and
      a heap-overflow variant (clobbered capture larger than original) that writes unbounded
      attacker-controlled request-body content past the allocated buffer, hijacking control flow via
      nginx's pool-cleanup mechanism. Tested at 10/10 reliability on stock Ubuntu 24.04 (glibc 2.39,
      full ASLR). No public PoC or full exploit write-up yet — the researcher is deliberately
      withholding both for ~21 days post-patch, citing CVE-2026-42945 ("Rift", a weaker nginx flaw in
      the same engine that only needed ASLR disabled) as precedent for how quickly PoC-driven
      exploitation follows disclosure in this codebase. A non-exploitative config-audit scanner is
      already public. As of 2026-07-20, CVE-2026-42533 is not yet in CISA KEV and no exploitation has
      been observed.
