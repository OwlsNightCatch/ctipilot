    extended_notes: |
      CERT-UA frames this as a continuation of years-long UAC-0145 tracking; prior tradecraft (torrent-bundled backdoored installers, Signal "antivirus" social engineering, KALAMBUR/SUMBUR/TAMBUR + OpenSSH/Tor port-forwarding for remote access) is background, not part of the in-window delta — the in-window delta is specifically the ClickFix/CAPTCHA vector, the EtherHiding C2-resolution layer (SMARTAXE), and the COWARDDUCK Android backdoor. Defender-relevant hunt: any Startup-folder VBS created around the time of a browser "CAPTCHA" prompt asking the user to open Win+R/Terminal and paste text; PowerShell child processes of explorer.exe/browser processes with no prior parent-child history; outbound HTTPS to images.stockmemory.site/.space or unusual `eth_call` JSON-RPC traffic to public Ethereum nodes from endpoint agents (EtherHiding's tell); Android fleets (BYOD/MDM) receiving APKs via Signal claiming to be AV/security tools.

  - title: "SANS ISC: new honeypot-observed reconnaissance scans probe Hikvision's ISAPI /System/status endpoint"
    sources:
      - { url: "https://isc.sans.edu/diary/33164", publisher: "SANS Internet Storm Center (Johannes Ullrich)", date: "2026-07-19", role: "primary" }
    discovery_trace: "first seen at: sans-isc, URL https://isc.sans.edu/rssfeed.xml → primary (no pivot needed), URL https://isc.sans.edu/diary/33164"
    summary: |
      SANS ISC's Johannes Ullrich reports that ISC honeypots picked up a new class of reconnaissance scanning this past weekend (mid-July 2026) against Hikvision's "OPEN Intelligent Security API" (ISAPI) — specifically requests to `/ISAPI/System/status`, an endpoint that has existed since at least 2018 but had not previously been observed as a scan target. ISAPI is a fully-documented REST interface intended for third-party integration that exposes camera configuration and management, not just AI/facial-recognition features as the name implies; the `/System/status` path is a low-noise way to fingerprint whether a device supports the API (a 401/403 response confirms it exists, a 404 means it doesn't) and to stage credential brute-forcing against Basic/Digest auth. Ullrich notes a specific transport-security gap: ISAPI messages can be AES-128/256-CBC encrypted with a key derived from the device password and an IV exposed in the URL, but if the device is still using Basic authentication (password sent in cleartext) this encryption adds no real protection — proper protection requires HTTPS with device-configured certificates, which many exposed IoT-class devices never get. No exploitation has yet been captured in full by the honeypot network (no authentication data logged so far); this is reconnaissance, not confirmed compromise.
    region_nexus: "Global scanning activity picked up by ISC's distributed honeypot network; directly relevant wherever Hikvision or similarly ISAPI-enabled IP cameras sit on internet-reachable networks, including physical-security camera deployments across Swiss/EU critical-infrastructure and public-sector sites."
    primary_sector_nexus: "indirect"
    sector: "energy, water, transport, public-sector (physical-security/IoT camera fleets)"
    cves: []
    techniques: [T1595]
    affected_products: ["Hikvision IP cameras (ISAPI-enabled)"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "This weekend, I noticed a new type of recon scans against the newer OPEN Intelligent Security API (ISAPI) provided by Hikvision cameras."
        attribution: "SANS ISC (Johannes Ullrich)"
        source_url: "https://isc.sans.edu/diary/33164"
      - quote: "The ISAPI has been around since at least 2018, but I have only now noticed scans for /ISAPI/System/status, an endpoint that is an obvious choice to profile ISAPI devices."
        attribution: "SANS ISC (Johannes Ullrich)"
        source_url: "https://isc.sans.edu/diary/33164"
      - quote: "the encryption does not provide any additional security if Basic authentication is used and the password is sent in the clear"
        attribution: "SANS ISC (Johannes Ullrich)"
        source_url: "https://isc.sans.edu/diary/33164"
    extended_notes: |
      Thin but concrete and timely: a single handler's honeypot observation (no independent corroboration found this run), reconnaissance only, no confirmed exploitation. Included as a low-cost hunt tip (watch for /ISAPI/System/status probes in web/proxy logs; confirm no Hikvision or ISAPI-compatible camera exposes management interfaces to the internet; verify HTTPS + non-Basic auth is actually configured, not just supported) rather than a high-severity item.
    borderline: true
    borderline_reason: "single-source (SANS ISC handler diary, reliability B, no national-CERT carve-out), reconnaissance/scanning only with no confirmed exploitation, and a narrow product footprint — moderate severity but timely, concrete, and transferable to any org running internet-reachable IP cameras."
