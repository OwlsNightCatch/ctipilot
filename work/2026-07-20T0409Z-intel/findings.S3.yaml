  - title: "CERT-UA: Sandworm subcluster UAC-0145 pairs ClickFix fake-CAPTCHA with Ethereum-smart-contract C2 resolution and a Signal-delivered Android backdoor"
    sources:
      - { url: "https://cert.gov.ua/article/6318437", publisher: "CERT-UA", date: "2026-07 (mid-month; page's 'Published Time' metadata reads 2026-03-10, which conflicts with the article's own text describing 'June-July 2026' activity — treated as a site-metadata artefact, not the true publish date)", role: "primary" }
      - { url: "https://thehackernews.com/2026/07/uac-0145-uses-clickfix-captchas-to.html", publisher: "The Hacker News", date: "2026-07-19", role: "corroborating" }
    discovery_trace: "first seen at: hackernews, URL https://thehackernews.com/2026/07/uac-0145-uses-clickfix-captchas-to.html → primary: CERT-UA, URL https://cert.gov.ua/article/6318437 (fetched via jina reader after the direct URL returned only a JS-SPA shell)"
    summary: |
      CERT-UA reports that UAC-0145 — a subcluster of UAC-0002/Sandworm (aka APT44, Seashell Blizzard), Russia's GRU-linked destructive-actor family — compromised at least 10 legitimate websites between June and July 2026 to serve a fake CAPTCHA that instructs visitors to paste and run a PowerShell command in the ClickFix pattern (MITRE ATT&CK now has a dedicated ID for this: T1204.004 Malicious Copy and Paste). The PowerShell one-liner drops a VBS persistence stub (GHETTOVIBE) into the Startup folder, which stages a PowerShell recon script (SCOUTCURL) that profiles the host and browser data, and separately loaders FLUIDLEECH (disguised as an "ESET AV Remover") and LOADLOOP fetch a Python-compiled (.pyc) backdoor, FREAKYPOLL. The compromised-site injection itself uses a custom script, SMARTAXE, layered on top of the commodity Cloaking.House traffic-filtering service; SMARTAXE resolves its remote CAPTCHA-content domain dynamically via an `eth_call` to an Ethereum smart contract (EtherHiding — MITRE maps this class of behavior to T1568 Dynamic Resolution), rather than a hardcoded domain, to survive takedowns. Separately, UAC-0145 distributes an Android backdoor (COWARDDUCK) via Signal disguised as security software; it exfiltrates contacts, files (DCIM/Documents/Downloads/Pictures/Alarms plus config/VPN/office-document extensions), and real-time geolocation via the Dropbox API, and pulls C2 tasking from images hosted on legitimate services (images.stockmemory.site/space, steamcommunity.com) proxied through proxy.duckduckgo.com — both chosen to blend into normal outbound traffic. CERT-UA's advisory is explicitly a continuation of its multi-year UAC-0145/Sandworm tracking, which previously relied on trojanized torrent installers and Signal-delivered "antivirus" lures using KALAMBUR/SUMBUR/TAMBUR plus OpenSSH/Tor port-forwarding for remote access.
    region_nexus: "Primary targeting is Ukraine; Sandworm/GRU is a standing shared threat to European critical infrastructure and government, and the technique stack (ClickFix, blockchain-resolved C2, a messenger-delivered mobile backdoor) is directly transferable to Swiss/EU environments."
    primary_sector_nexus: "indirect"
    sector: "public-sector, government, defense"
