  # ITEM 5 — HashiCorp Terraform MCP Server HCSEC-2026-23
  # origin: findings.S1.yaml item 4
  # ==========================================================================
  - key: hashicorp-hcsec-2026-23
    title: "HashiCorp Terraform MCP Server HCSEC-2026-23: SSRF-driven bearer-token exfiltration and cross-session/cross-tenant credential reuse across three CVEs"
    origin: "findings.S1.yaml item 4"
    sources:
      - { url: "https://discuss.hashicorp.com/t/hcsec-2026-23-multiple-vulnerabilities-impacting-hashicorp-terraform-mcp-server/77606", publisher: "HashiCorp Security Bulletin (HCSEC-2026-23, posted by james.warren)", date: "2026-07-28T17:50:43Z", role: "primary" }
      - { url: "https://nvd.nist.gov/vuln/detail/CVE-2026-14869", publisher: "NVD", date: "2026-07-30 (fetched)", role: "corroborating" }
      - { url: "https://nvd.nist.gov/vuln/detail/CVE-2026-16496", publisher: "NVD", date: "2026-07-30 (fetched)", role: "corroborating" }
      - { url: "https://nvd.nist.gov/vuln/detail/CVE-2026-16498", publisher: "NVD", date: "2026-07-30 (fetched)", role: "corroborating" }

    bulletin_metadata: >
      Bulletin ID HCSEC-2026-23. Affected Products/Versions (HashiCorp's own
      statement): terraform-mcp-server 0.2.1 up to and including 1.0.0; fixed
      in 1.1.0. Publication Date: July 28, 2026. NOTE: the HashiCorp bulletin
      text itself does NOT publish CVSS scores for any of the three CVEs —
      CVSS confirmed below is sourced from each CVE's own NVD record, per the
      task's instruction to use the record that owns each CVSS, never a
      roundup.

      Background (verbatim structure, paraphrased for length): the
      streamable-HTTP transport mode supports centralized, multi-user
      deployments where each user supplies their own Terraform Cloud/
      Enterprise token per request for RBAC enforcement; the server can run
      statelessly (each request handled independently) or statefully
      (maintaining a per-session Terraform API client cache); the server also
      authenticates to the configured Terraform endpoint using its OWN
      server-side bearer token.

    stateful_vs_stateless: >
      CVE-2026-16496 (session-cache authorization bypass) affects ONLY
      deployments in stateful streamable-HTTP mode — confirmed by HashiCorp:
      "This issue affected only deployments using stateful streamable-HTTP
      mode, which is the default when running the server centrally; stdio
      mode and stateless HTTP mode were not affected." CVE-2026-16498
      (cross-tenant credential reuse) affects ONLY deployments EXPLICITLY
      configured for stateless HTTP mode — confirmed: "This issue affected
      only deployments explicitly configured to use stateless HTTP mode;
      deployments using the default stateful HTTP mode or stdio mode were not
      affected." CVE-2026-14869 (SSRF/bearer-token exfiltration) affects the
      streamable-HTTP transport regardless of stateful/stateless
      configuration, but NOT stdio-only deployments.

    mitigation_verbatim: "Customers should evaluate the risk associated with these issues and consider upgrading to terraform-mcp-server 1.1.0. Operators who cannot upgrade immediately should restrict network access to the streamable-HTTP listener to trusted users only and treat MCP session IDs as sensitive values."

    reporting_credits: "CVE-2026-16496 was reported to HashiCorp by Juan Pablo Martinez Kuhn of Coinspect. CVE-2026-14869 and CVE-2026-16498 were identified by an internal HashiCorp team."

    region_nexus: "global; MCP-server deployments are emerging AI-agentic infrastructure now entering EU/CH public-sector and enterprise IaC pipelines"
    primary_sector_nexus: "indirect — DevOps/IaC tooling supporting public-sector and CI cloud infrastructure automation"
    sector: "public-sector, telco, finance"

    cves:
      - id: CVE-2026-14869
        cvss: "8.6 HIGH (CVSSv3.1, NVD — the record that owns this CVE, not a roundup)"
        vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:N"
        type: "Server-side request forgery (SSRF) — the middleware validated a client-supplied Terraform address only when passed as an HTTP header, not when passed as a query parameter, letting the attacker redirect the server's own bearer token to an attacker-controlled endpoint"
        auth: "Unauthenticated remote client — 'exploitation required only the ability to send an HTTP request to the streamable-HTTP listener, with no authentication required' (HashiCorp)"
        status: "Not observed exploited in the wild"
        affected: "terraform-mcp-server 0.2.1 up to and including 1.0.0, in streamable-HTTP transport mode (stdio-only deployments not affected)"
        fixed: "1.1.0"
      - id: CVE-2026-16496
        cvss: "8.9 HIGH (CVSSv3.1, NVD)"
        vector: "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:C/C:H/I:H/A:L"
        type: "Authorization bypass via session-ID-keyed credential cache with no token binding, in stateful streamable-HTTP mode"
