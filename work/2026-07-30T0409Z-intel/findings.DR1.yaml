  - key: vmware-vmsa-2026-0006
    title: "VMware VMSA-2026-0006: vCenter auth bypass, Syslog directory traversal, VMXNET3 VM-escape, and two lower-severity flaws across ESX/vCenter/Workstation/Fusion"
    origin: "findings.S1.yaml item 1"
    sources:
      - { url: "https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/SecurityAdvisories/0/38017", publisher: "Broadcom/VMware PSIRT (VMSA-2026-0006)", date: "2026-07-29 (issue date; last updated 2026-07-29, initial advisory)", role: "primary" }

    advisory_metadata: >
      Advisory ID VMSA-2026-0006. Notification ID 38017. Status: OPEN.
      Overall Severity: CRITICAL. CVSSv3 range across the five CVEs: 2.7–9.8.
      Issue date and last-updated date both 2026-07-29 (initial advisory, no
      revisions yet). Workaround column for every one of the five CVEs reads
      "None" — Broadcom states no workaround exists for any of the five
      issues; patching is the only remediation path.

    impacted_products_full_list: >
      Per the advisory's own "1. Impacted Products" section: VMware ESX,
      VMware vCenter, VMware Workstation, VMware Fusion, VMware Cloud
      Foundation, VMware vSphere Foundation, VMware Telco Cloud Platform,
      VMware Telco Cloud Infrastructure (8 products total; the advisory's
      product/component picker separately labels the ESX line "VMware vSphere
      ESXi" — same product, inconsistent naming within the same advisory page).

      Per-CVE product/component breakdown from the advisory's own Response
      Matrix tables (confirms which CVEs affect which product lines):
      - CVE-2026-59309 and CVE-2026-59310 (vCenter authentication bypass and
        Syslog directory traversal) affect ONLY the vCenter component — VMware
        Cloud Foundation/vSphere Foundation (vCenter 9.1.x.x, 9.0.x.x), VMware
        vCenter 8.0, and VMware Cloud Foundation 5.x (vCenter component). ESX,
        Workstation and Fusion are NOT listed as affected by either CVE.
      - CVE-2026-47876 (VMXNET3 out-of-bounds write / VM escape) affects ONLY
        the ESX component — Cloud Foundation/vSphere Foundation (ESX 9.1.x.x,
        9.0.x.x), VMware ESX 8.0, Cloud Foundation 5.x (ESX component), and
        VMware Telco Cloud Platform (ESX 5.0.x, 5.1.x). Despite Workstation and
        Fusion both supporting VMXNET3-adapter guests, NEITHER is listed in
        this CVE's response matrix — per the advisory, this CVE affects ESX
        only, not Workstation/Fusion.
      - CVE-2026-41703 (out-of-bounds read) affects ESX, Workstation, AND
        Fusion — the only one of the five CVEs to span all three hypervisor
        product lines. CVSS differs materially by product: 7.6 (Important) on
        ESX/Cloud Foundation/vSphere Foundation/Telco Cloud Platform vs. only
        2.7 (Low) on Workstation and Fusion, reflecting the advisory's own
        note that "on Workstation and Fusion, the impact of this vulnerability
        is restricted to information disclosure" (no DoS impact on those
        products, unlike ESX where a DoS of the host process is the more
        likely outcome).
      - CVE-2026-41709 (insufficient logging) affects ONLY the ESX component,
        same product spread as CVE-2026-47876 (Cloud Foundation/vSphere
        Foundation, standalone ESX 8.0, Cloud Foundation 5.x, Telco Cloud
        Platform). NOT vCenter, NOT Workstation/Fusion.

    vmxnet3_precondition: >
      Confirmed from the advisory's own "Known Attack Vectors" text for
      CVE-2026-47876: "A malicious actor with local administrative privileges
      on a virtual machine with VMXNET3 virtual network adapter may exploit
      this issue to execute code on the host. Non VMXNET3 virtual adapters are
      not affected by this issue." — i.e. the guest VM must (a) already grant
      the attacker local administrative privileges inside the guest, and (b)
      be configured with a VMXNET3 virtual network adapter specifically; any
      other virtual NIC type (E1000/E1000e/VMXNET2/paravirtual variants) is
      confirmed not vulnerable to this specific CVE.

    workaround_confirmation: "Every one of the five CVEs' Response Matrix tables lists 'Workarounds: None' — Broadcom confirms no workaround exists for any of the five vulnerabilities in this advisory; patching to the listed fixed versions is the sole remediation path."

    reporting_credits: >
      CVE-2026-59309 and CVE-2026-59310: Phil Brass and Matt South of Atredis
      Partners. CVE-2026-47876: Nguyen Hoang Thach (@hi_im_d4rkn3ss) of
      STARLabs SG, working with Pwn2Own held by Zero Day Initiative.
      CVE-2026-41703: Maxim Suhanov (@errno_fail). CVE-2026-41709: Ian Barton
      of CrowdStrike.

