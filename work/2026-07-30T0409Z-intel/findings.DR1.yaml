    extended_notes: |
      Detection guidance: because the RAKP hash disclosure requires no repeated
      authentication attempt, BMC-side login/authentication logs are NOT a
      viable detection surface for this technique — the only realistic
      detection telemetry is network-flow/firewall logs showing inbound UDP/623
      traffic from unexpected external sources (i.e. any BMC that has ever
      accepted an inbound UDP/623 connection from the internet should be
      treated as already compromised). Triage discriminator: legitimate BMC
      management traffic originates from a known, internal management-VLAN
      source; any UDP/623 session from a WAN-facing or unrecognized source IP
      is inherently anomalous, not merely suspicious, given the technique's
      undetectable-by-design nature at the BMC layer itself.

