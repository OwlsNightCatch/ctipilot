  # ==========================================================================
  # ITEM 4 — RufRoot CVE-2026-59726 (Ruflo / formerly Claude Flow)
  # origin: findings.S3.yaml item 3
  # ==========================================================================
  - key: rufroot-cve-2026-59726
    title: "RufRoot (CVE-2026-59726, CVSS 10): unauthenticated MCP-bridge RCE in the Ruflo AI-agent-swarm host lets an attacker plant memory that outlives the patch"
    origin: "findings.S3.yaml item 3"
    sources:
      - { url: "https://noma.security/blog/rufroot-the-mcp-bridge-vulnerability-that-turns-agents-into-rogue-admins-cve-2026-59726/", publisher: "Noma Security (Noma Labs, author Eli Ainhorn)", date: "2026-07-29", role: "primary" }
      - { url: "https://github.com/ruvnet/ruflo/security/advisories/GHSA-c4hm-4h84-2cf3", publisher: "Ruflo maintainer (ruvnet) GHSA advisory", date: "2026-07-01 (published; per GitHub advisory page)", role: "primary" }
      - { url: "https://nvd.nist.gov/vuln/detail/CVE-2026-59726", publisher: "NVD", date: "2026-07-30 (fetched; NVD published date 07/09/2026, last modified 07/10/2026)", role: "corroborating" }

    endpoint_and_request_shape: >
      Ruflo's MCP Bridge is an Express.js server exposing 233 tools over the
      Model Context Protocol JSON-RPC interface via a POST /mcp endpoint (and
      per NVD, also POST /mcp/:group). The bridge "accepts tool invocations
      and passes them directly to executeTool() with no authentication
      layer" (Noma). Among the 233 exposed tools, `ruflo__terminal_execute`
      runs arbitrary shell commands inside the container as the node user
      (UID 1000). A command-blocklist (AUTOPILOT_BLOCKED_PATTERNS) exists but
      "is enforced only in the autopilot flow" — the /mcp and /mcp/:group
      endpoints bypass it completely (confirmed on both Noma's blog and the
      GHSA advisory). No exploit payload or request body is reproduced here
      per the no-operational-attack-detail rule; the request SHAPE is: a
      single unauthenticated JSON-RPC "tools/call" method invocation against
      the exposed port (default 3001), naming `ruflo__terminal_execute` as
      the tool. Noma states this single request was sufficient for full
      command execution with "no token, no API key, no header check, no IP
      allowlist."

    default_network_exposure: >
      Ruflo is commonly self-hosted via `docker compose up -d`. Per Noma:
      "the docker-compose.yml binds port 3001 to 0.0.0.0 by default, exposing
      the bridge on all network interfaces. The extent of exposure depends on
      the deployment's firewall rules, security groups, and network
      segmentation, but any network-reachable instance is fully exploitable
      without authentication." MongoDB is also exposed on the internal Docker
      network (port 27017) without authentication by default in the
      pre-patch configuration.

    what_attacker_can_read: >
      Per Noma's 8-step demonstrated PoC (confirmed live against a default
      Ruflo deployment on AWS EC2, OAST-callback-verified): full shell access
      as the node user; ALL AI-provider API keys (OpenAI, Anthropic, Google,
      OpenRouter, etc.) — the docker-compose passes these as environment
      variables and backend processes inherit the full environment, so a
      single `printenv` dumps every key; every stored user conversation
      (message content, titles, metadata) via the unauthenticated internal
      MongoDB instance; and the ability to spawn attacker-controlled agent
      swarms using the victim's own API keys and compute.

    memory_tampering_persistence: >
      The GHSA advisory's own remediation guidance states explicitly:
      "Audit the AgentDB pattern store for injected agentdb_pattern-store
      entries; purge poisoned patterns. A patched redeploy alone does NOT
      undo poisoning." Noma's demonstrated mechanism: inject malicious
      patterns into the AgentDB learning-store pipeline via the
      `ruflo__agentdb_pattern-store` tool — e.g. a fake SOC2-compliance
      policy instructing the AI to include an attacker-controlled URL in all
      future generated deployment scripts. Because this poisoned pattern
      persists in the AgentDB data store (not the application code), applying
      the authentication-bypass fix does not remove it — "future
      conversations produce attacker-influenced output, and the user has no
      way to tell." Noma additionally demonstrated a code-level persistence
      mechanism: writing a beacon script to /app/beacon.js that phones home
      with API keys on a schedule, requiring `require('./beacon.js')` into
      index.js so it loads on startup, relying on Docker's
      `restart: unless-stopped` policy to bring the backdoored container back
      up after killing PID 1.

    disclosure_timeline: >
      Per the GHSA advisory, published by the Ruflo maintainer (ruvnet) on
      2026-07-01. Per Noma's blog (2026-07-29): "Noma Labs disclosed
      responsibly, and within a few hours, Ruflo had a full fix merged (PR
      #2521), a public security advisory published (GHSA-c4hm-4h84-2cf3), and
      it was scored CVSS 10/10." NVD's own record shows CVE-2026-59726
      published 07/09/2026, last modified 07/10/2026 — i.e. the CVE
      assignment and NVD publication happened roughly a week after the GHSA
      advisory, and the public Noma write-up followed nearly a month later
      (2026-07-29).

    fixed_version_and_config: >
      Fixed in ruflo 3.16.3 (affected: 0.2.1 up to and including... NVD states
      "Prior to 3.16.3" — i.e. all versions before 3.16.3). Per the GHSA
      advisory, the fix (branch security/adr-166-mcp-bridge-rce, PR #2521,
      "ADR-166 Phase 1-3") includes: MCP bridge binds to loopback (127.0.0.1)
      by default and fails closed if a public bind is attempted without
      explicitly setting MCP_AUTH_TOKEN; bearer-token auth middleware using a
      constant-time (timingSafeEqual) comparison; `terminal_execute` gated
      behind an explicit MCP_ENABLE_TERMINAL=true opt-in (off by default);
      MongoDB requires authentication on boot (MONGO_INITDB_ROOT_PASSWORD
      required); container runs read-only with tmpfs; CORS allowlist
      replacing a wildcard; and CI regression tests to prevent these secure
      defaults from regressing.

    noma_remediation_guidance_verbatim: "Operators of any exposed instance MUST: 1. Firewall :3001 and :27017 immediately 2. Rotate OPENAI / GOOGLE / OPENROUTER / ANTHROPIC keys 3. Audit the AgentDB pattern store for injected agentdb_pattern-store entries; purge poisoned patterns. A patched redeploy alone does NOT undo poisoning. 4. Audit MongoDB for tampering"

    nvd_status: "CVE-2026-59726 IS published on NVD (confirmed this pass — description: 'Ruflo is an agent meta-harness for Claude Code and Codex. Prior to 3.16.3, ruflo's default docker-compose deployment exposed the MCP bridge POST /mcp and POST /mcp/:group endpoints without authentication, allowing an unauthenticated network attacker to invoke tools/call to terminal_execute, obtain a shell in the bridge container, read provider API keys, and poison AgentDB learning-store patterns. This issue is fixed in version 3.16.3.' CVSS 3.1: 10.0 CRITICAL, vector AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H. NVD published 07/09/2026, last modified 07/10/2026.)"

    region_nexus: "global; any organization running self-hosted Ruflo/Claude-Flow AI-agent-swarm infrastructure is affected regardless of region"
    primary_sector_nexus: "indirect"
    sector: "public-sector, finance, energy, telco, healthcare"

    cves:
      - id: CVE-2026-59726
        cvss: "10.0 CRITICAL (CVSSv3.1, NVD)"
        vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H"
        type: "Missing authentication on MCP JSON-RPC bridge endpoints (POST /mcp, POST /mcp/:group), enabling unauthenticated remote command execution via the terminal_execute tool, credential theft, and persistent AI-memory poisoning"
        auth: "Unauthenticated — zero prerequisites beyond network reachability to the default-exposed port (3001)"
        status: "No in-the-wild exploitation reported — responsibly disclosed research finding; working PoC built and demonstrated by Noma Labs but not publicly released"
        affected: "ruflo (npm package) versions 0.2.1 up to and including 1.0.0 per HashiCorp-style versioning stated in original S3 record — CORRECTION: NVD's own affected range is 'prior to 3.16.3' (i.e. all pre-3.16.3 releases), which supersedes any earlier version-range statement; GHSA states affected versions as '< 3.16.3'"
        fixed: "3.16.3 (also requires explicit MCP_AUTH_TOKEN opt-in for any public bind, and MCP_ENABLE_TERMINAL=true opt-in for terminal_execute specifically — patching alone restores secure-by-default configuration but does NOT remediate any pre-existing AgentDB memory poisoning, which requires separate manual audit/purge)"

    affected_products: ["Ruflo (formerly Claude Flow)"]
    techniques: ["T1190", "T1059.004", "T1552.001", "T1565.001"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new

    evidence:
      - quote: "Noma Labs found a critical (10 CVSS) vulnerability in Ruflo, an open source AI agent orchestration platform with more than 67,000 GitHub stars at the time of this writing and ranked #2 on MCPMarket. Ruflo ships with a chat UI, agent swarms, persistent memory, and MCP-based tool calling. The platform's MCP Bridge, the Express.js server that handles all tool invocations, exposes 233 tools over HTTP with zero authentication."
        attribution: "Noma Security / Noma Labs"
        source_url: "https://noma.security/blog/rufroot-the-mcp-bridge-vulnerability-that-turns-agents-into-rogue-admins-cve-2026-59726/"
      - quote: "A single unauthenticated HTTP POST request to port 3001 gave full command execution inside the container. No token, no API key, no header check, no IP allowlist. Nothing."
        attribution: "Noma Security / Noma Labs"
        source_url: "https://noma.security/blog/rufroot-the-mcp-bridge-vulnerability-that-turns-agents-into-rogue-admins-cve-2026-59726/"
      - quote: "The docker-compose.yml binds port 3001 to 0.0.0.0 by default, exposing the bridge on all network interfaces."
        attribution: "Noma Security / Noma Labs"
        source_url: "https://noma.security/blog/rufroot-the-mcp-bridge-vulnerability-that-turns-agents-into-rogue-admins-cve-2026-59726/"
      - quote: "Audit the AgentDB pattern store for injected agentdb_pattern-store entries; purge poisoned patterns. A patched redeploy alone does NOT undo poisoning."
        attribution: "Ruflo maintainer (ruvnet), GHSA-c4hm-4h84-2cf3"
        source_url: "https://github.com/ruvnet/ruflo/security/advisories/GHSA-c4hm-4h84-2cf3"
      - quote: "Ruflo is an agent meta-harness for Claude Code and Codex. Prior to 3.16.3, ruflo's default docker-compose deployment exposed the MCP bridge POST /mcp and POST /mcp/:group endpoints without authentication, allowing an unauthenticated network attacker to invoke tools/call to terminal_execute, obtain a shell in the bridge container, read provider API keys, and poison AgentDB learning-store patterns. This issue is fixed in version 3.16.3."
        attribution: "NVD (CVE-2026-59726 description)"
