  # ==========================================================================
  # ITEM 1 (DEEP DIVE) — Lava BMC/IPMI research, CVE-2013-4786
  # origin: findings.S3.yaml item 6
  # ==========================================================================
  - key: bmc-ipmi-cve-2013-4786
    title: "24,650 internet-exposed BMCs leak crackable RAKP password hashes pre-authentication via 22-year-old CVE-2013-4786 — Lava finds confirmed in-the-wild ransomware exploitation"
    origin: "findings.S3.yaml item 6"
    sources:
      - { url: "https://lavahq.io/research/bmc-exposure-alert", publisher: "Lava (Lava HQ research, author Michael Katchinskiy)", date: "2026-07-29", role: "primary" }
      - { url: "https://www.darkreading.com/cyber-risk/flaw-exposes-data-centers-server-takeover", publisher: "Dark Reading (Jai Vijayan)", date: "2026-07-28", role: "corroborating" }
      - { url: "https://nvd.nist.gov/vuln/detail/CVE-2013-4786", publisher: "NVD", date: "2026-07-30 (fetched; CVE record itself dates to 2013)", role: "corroborating" }
      - { url: "https://www.helpnetsecurity.com/2026/07/28/exposed-bmc-ipmi-vulnerability-research/", publisher: "Help Net Security", date: "2026-07-28", role: "corroborating (from S3, not re-fetched this pass — Lava + Dark Reading covers all load-bearing facts independently)" }

    protocol_mechanism: >
      CVE-2013-4786 is a design flaw in the IPMI 2.0 specification's RMCP+
      Authenticated Key-Exchange Protocol (RAKP), introduced with IPMI 2.0's
      2004 release and publicly disclosed/CVE-assigned only in 2013. Per NVD's
      own description, RAKP authentication "allows remote attackers to obtain
      password hashes and conduct offline password guessing attacks by
      obtaining the HMAC from a RAKP message 2 response from a BMC." In
      concrete exchange terms (per Lava's account): the client sends an RAKP
      Message 1 identifying the requested account; the BMC (RAKP Message 2)
      returns an HMAC-SHA1 authentication code computed over the account
      password and session values already known to the requester — BEFORE the
      client has actually authenticated. An unauthenticated remote party that
      can reach UDP port 623 can request this response and test password
      guesses fully offline: because the HMAC is a per-request, self-contained
      value, cracking it generates no repeated-login telemetry on the BMC
      whatsoever (no lockout, no rate limit, no failed-login log entry) —
      the offline-crackable-hash property is itself the reason BMC login logs
      are not a viable detection surface for this technique.
      NVD CWE classification: CWE-255 (Credentials Management Errors).

    scan_methodology: >
      Lava queried Shodan for BMC/IPMI services on UDP port 623. On 2026-05-06
      the query returned 36,872 unique internet-exposed IPMI hosts. Across
      repeated measurements between May and July 2026, Lava observed an
      average of ~60 previously-unseen IP addresses newly exposing IPMI each
      day. Lava built a lightweight auditor to check the exposed population
      for: cipher-suite-0 support, empty/null usernames accepted, "NONE"
      authentication mode advertisement, RAKP responses tied to common
      vendor-default usernames, and CVE-2013-4786 itself (pre-auth
      password-derived hash disclosure). Lava published an interactive map of
      the findings ("BMCRadar", https://lavahq.io/bmc).

    exposure_breakdown: >
      Of 36,872 internet-exposed IPMI hosts: 24,650 (66.9%) returned at least
      one password-derived RAKP authentication hash before client
      authentication completed. Of the total population, 6,240 (16.9%)
      accepted an empty/null username paired with a password that matched a
      common wordlist during offline analysis; 2,340 (6.3% of the total
      population, ~9.5% of the RAKP-responding population) had a named
      account (e.g. ADMIN or root) whose password matched a common wordlist.
      Lava states many wordlist matches were found "within minutes" of first
      pass. Lava did NOT submit recovered passwords to any BMC or attempt to
      authenticate — cracking was performed entirely offline against captured
      hash material. Supermicro hardware accounted for more than 50% of the
      responding BMCs in Lava's dataset.

    factory_password_schemes: >
      Supermicro: since November 2019 (to support California SB-327
      compliance), Supermicro replaced the shared "ADMIN:ADMIN" factory
      credential with a unique, chassis-sticker-printed password. Username
      remains ADMIN; password is exactly 10 uppercase alphabetic characters
      (keyspace 26^10 ≈ 141 trillion). Lava assessed this keyspace as
      exhaustively crackable by a targeted attacker: on a server with eight
      GPUs running Hashcat, the full candidate space searches in
      approximately one hour. Lava validated this in practice against two
      adjacent IPs belonging to a US-based bare-metal GPU provider (testing
      authorized under the provider's published security policy, limited to
      password material already disclosed via the IPMI flow, no
      authentication attempted) — both were modern Supermicro X13DEM
      motherboards (manufactured 2023) and both recovered passwords matched
      the 10-character chassis-sticker format. HPE iLO: factory format is 8
      characters of uppercase letters + digits (keyspace 36^8 ≈ 2.8 trillion,
      ~50x smaller than Supermicro's). On an Apple M3, a full search took
      ~1 day per captured response; on Lava's lab server with eight RTX 6000
      PRO GPUs, the same search took ~32 seconds per response.

    itw_exploitation_evidence: >
      Lava found an internet-exposed HPE iLO 4 login page displaying a ransom
      note in its Security Notice panel, claiming RSA-2048 encryption of the
      server's data and demanding 0.3 BTC (Lava could not confirm whether the
      underlying server data was actually encrypted, only that the management
      interface itself had been accessed and modified by an unauthorized
      party). Separately, per Dark Reading's interview with Lava CTO/co-founder
      Yakir Kadkoda, Lava identified compromised, internet-exposed BMC
      interfaces belonging to "one of the world's largest automotive component
      manufacturers," with multiple exposed servers displaying ransomware
      notes and payment demands, indicating active targeting. Lava also cites
      prior public research on "iLOBleed," a persistent iLO 4 rootkit
      associated with destructive attacks, as precedent for attacker interest
      in this management layer.

    mitigations: >
      Lava (researcher) and vendor (Supermicro, via disclosure) both
      recommend: block UDP/623 at the network edge (remove IPMI/BMC from the
      public internet entirely — stated as "the main fix"); replace
      factory-issued passwords during provisioning; disable IPMI 1.5,
      cipher-suite-0, anonymous accounts and NONE authentication; restrict BMC
      access to a dedicated private management network/VPN/bastion; apply
      network access controls so only approved administrative systems can
      reach BMC interfaces; monitor the management network separately from
      production workloads. Supermicro (per Lava's June 2026 disclosure)
      acknowledged the scenario is plausible with modern multi-GPU cracking
      capability, reiterated its standing guidance to rotate default BMC
      passwords at setup and keep management networks off the public internet
      behind VLANs/ACLs, and stated it will review possible improvements to
      the default password policy (longer passwords / expanded character set)
      for future hardware revisions. No CVE-level "patch" exists or is
      applicable — CVE-2013-4786 is a specification-level design flaw in the
      IPMI 2.0 RAKP handshake itself, not a vendor code defect, so no vendor
      patch remediates it; only network isolation and credential/protocol
      hardening close the exposure.

    redfish_vs_ipmi: >
      Redfish (the newer HTTPS-based management API) is NOT subject to the
      CVE-2013-4786 pre-auth RAKP hash-disclosure mechanism itself — that flaw
      is specific to the legacy IPMI 2.0 RAKP handshake. However, Lava
      explicitly notes that "in many implementations, these interfaces share
      the same user database. A credential that works for IPMI may also work
      for the web interface or Redfish API" — so a password recovered via the
      IPMI-2.0 RAKP weakness can often be reused to authenticate directly to
      Redfish or the web UI. Lava's own guidance: "Where supported, prefer
      Redfish over TLS within an isolated management network. Neither Redfish
      nor IPMI should be exposed directly to the public internet" — i.e.
      Redfish is the recommended migration target, but only within an isolated
      network, never as a public-facing substitute.

    region_nexus: "global; any organization operating on-prem or colocated bare-metal server infrastructure with BMC/IPMI management (Supermicro, HPE, and by extension any IPMI-2.0-implementing vendor) is potentially exposed, including European data-centre and critical-infrastructure operators"
    primary_sector_nexus: "indirect"
    sector: "energy, telco, public-sector, finance, healthcare"

    cves:
      - id: CVE-2013-4786
        cvss: "7.5 HIGH (CVSS 3.0, NVD) / 7.8 HIGH (CVSS 2.0, NVD)"
        vector: "CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N (CVSS 2.0: AV:N/AC:L/Au:N/C:C/I:N/A:N)"
        type: "Improper credentials management / IPMI 2.0 RAKP protocol specification design flaw enabling pre-auth password-hash disclosure (CWE-255: Credentials Management Errors)"
        auth: "Unauthenticated / pre-authentication — network reachability to UDP/623 is the only prerequisite; no valid credentials or prior foothold required to obtain the crackable hash"
        status: "Confirmed exploitation observed in the wild by Lava (ransom note found on an exposed HPE iLO 4 interface; compromised, ransom-note-displaying servers found belonging to a named-class automotive component manufacturer). Not KEV-listed as of this research; CVE dates to 2013."
        affected: "IPMI 2.0 specification's RAKP authentication mechanism — universal to any BMC/IPMI implementation supporting IPMI 2.0 RAKP (introduced 2004); confirmed in Lava's tested population on Supermicro BMC and HPE iLO implementations specifically, at scale (24,650 of 36,872 scanned hosts, 66.9%)"
        fixed: "No vendor patch exists or is applicable — this is a specification-level design flaw in the IPMI 2.0 protocol itself, not a code defect. Mitigation is exclusively network- and configuration-level: remove IPMI/BMC from public internet exposure, rotate factory/default credentials, disable legacy IPMI 1.5/cipher-suite-0/anonymous auth, and prefer Redfish-over-TLS on an isolated management network."

    affected_products: ["Supermicro BMC (IPMI)", "HPE iLO"]
    techniques: ["T1110.002", "T1078.001", "T1542.001"]
    techniques_note: >
      Correction to S3's original mapping: T1200 (Hardware Additions) does
      not fit this finding — no physical hardware is added; the BMC is a
      pre-existing, already-installed management processor being remotely
      exploited over the network. Recommended mapping: T1110.002 (Password
      Cracking — offline HMAC-SHA1 cracking of the RAKP-disclosed hash),
      T1078.001 (Default Accounts — blank/ADMIN/root accounts with
      common/factory passwords), and T1542.001 (Pre-OS Boot: System Firmware —
      Lava explicitly flags that BMC/platform-firmware persistence can survive
      OS reinstalls, disk replacement, and standard IR procedures, requiring
      platform-level recovery).

