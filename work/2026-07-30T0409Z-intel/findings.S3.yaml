  - title: "Operation Double Barrel: Korean government joint advisory finds shared infrastructure, malware and SSH-key fingerprints between a state-sponsored actor and the Gunra ransomware group"
    sources:
      - { url: "https://asec.ahnlab.com/en/94696/", publisher: "AhnLab ASEC (joint advisory with Korea NIS/NPA/KISA/FSI)", date: "2026-07-29", role: "primary" }
    discovery_trace: "first seen at: ahnlab-asec (major-research-lab, always swept), URL https://asec.ahnlab.com/en/feed/ → primary: AhnLab ASEC, URL https://asec.ahnlab.com/en/94696/ (no pivot needed)"
    summary: |
      AhnLab's ASEC published the technical annex to a joint cybersecurity advisory issued with South Korea's National Intelligence Service, National Police Agency, Korea Internet & Security Agency and Financial Security Institute, naming a campaign "Operation Double Barrel" that documents overlapping infrastructure between a state-sponsored threat group and the Gunra ransomware operation. The commonalities ASEC identifies: identical vulnerabilities exploited during initial access against two named Korean financial-security software products, shared malware, matching SSH key fingerprints, and shared network infrastructure (download servers and reverse-tunneling addresses). Tooling observed across the intrusions includes the backdoors "Struggle" (aka SIGNBT 3.0) and "Brandoor" (aka COPPERHEDGE) alongside UACMe, PetitPotam, Impacket, Certipy, TightVNC, WinSCP, FileZilla, Plink and Socat. Initial access combined watering-hole compromises of legitimate Korean media, education, healthcare and manufacturing websites with spear-phishing and the financial-security-software exploitation; ASEC additionally flags a possible supply-chain angle because several of the watering-holed sites shared the same Korean web-development/management vendor. Victimology spans 2025 through H1 2026 and is confined to Korean citizens and businesses. ASEC is explicit that it cannot yet definitively establish whether the relationship is common tooling/infrastructure reuse or actual operational collaboration between the state actor and the ransomware group, naming the campaign precisely to track that open question.
    region_nexus: "South Korea only; carried for the technique class — a documented nation-state/ransomware-affiliate infrastructure overlap via shared SSH fingerprints and C2, a pattern (state actors moonlighting into or supplying ransomware crews) increasingly relevant to European critical-infrastructure threat modeling"
