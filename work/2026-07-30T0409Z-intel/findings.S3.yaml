          summary: "DPRK financially-motivated cluster Amazon (2026-07-29, medium confidence) attributes to the March 2026 axios and September 2025 debug/chalk npm supply-chain compromises via shared C2 indicators, TTPs and code reuse, tracing both back to a March 2025 'typo-crypto' rehearsal package." }
