  - title: "RufRoot (CVE-2026-59726, CVSS 10): unauthenticated MCP-bridge RCE in the Ruflo AI-agent-swarm host lets an attacker plant memory that outlives the patch"
    sources:
      - { url: "https://noma.security/blog/rufroot-the-mcp-bridge-vulnerability-that-turns-agents-into-rogue-admins-cve-2026-59726/", publisher: "Noma Security (Noma Labs)", date: "2026-07-29", role: "primary" }
      - { url: "https://www.darkreading.com/cyber-risk/patch-resistant-rufroot-flaw-malicious-ai-agent-swarms", publisher: "Dark Reading", date: "2026-07-29", role: "corroborating" }
    discovery_trace: "first seen at: darkreading (rotational source), URL https://www.darkreading.com/cyber-risk/patch-resistant-rufroot-flaw-malicious-ai-agent-swarms → primary: Noma Security / Noma Labs, URL https://noma.security/blog/rufroot-the-mcp-bridge-vulnerability-that-turns-agents-into-rogue-admins-cve-2026-59726/"
    summary: |
      Noma Labs (Noma Security) discovered CVE-2026-59726 ("RufRoot," CVSS 10) in Ruflo (formerly Claude Flow), an open-source platform that hosts and orchestrates swarms of AI coding agents for Codex and Claude Code. The vulnerability sits in Ruflo's Model Context Protocol (MCP) bridge, which by default is exposed to the network with no authentication: a single unauthenticated HTTP request against the bridge achieves full remote code execution inside the Ruflo container. From there, an attacker can read every AI-provider API key the platform holds, read every stored user conversation, and — most significantly — plant instructions into the AI agent's own persistent memory that continue to steer its behavior for future users after the attacker has left, and after the platform is patched (the authentication bypass closes, but a memory-tampering payload planted before the patch is not itself removed by it). Noma Labs disclosed the flaw with a working PoC to Ruflo maintainers on 2026-06-30; Ruflo shipped a fix within 24 hours that defaults the platform to a locked-down configuration requiring explicit opt-in for public exposure, which Noma independently verified. Noma's remediation guidance for anyone who ran an affected deployment: treat all AI-provider credentials as compromised and rotate them, audit the platform's AI memory store for tampering, and rebuild containers from a clean image — patching alone is explicitly stated as insufficient.
    region_nexus: "global; any organization running self-hosted Ruflo/Claude-Flow AI-agent-swarm infrastructure is affected regardless of region"
    primary_sector_nexus: "indirect"
    sector: "public-sector, finance, energy, telco, healthcare (any org self-hosting AI-agent orchestration platforms)"
    cves: [CVE-2026-59726]
    techniques: [T1190, T1552.001, T1565.001]
    affected_products: ["Ruflo (formerly Claude Flow)"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "The weakness is a lack of authentication coupled with command execution capabilities, enabling complete control over the container and exposure of sensitive credentials."
        attribution: "Noma Labs, via OpenCVE / Dark Reading"
        source_url: "https://www.darkreading.com/cyber-risk/patch-resistant-rufroot-flaw-malicious-ai-agent-swarms"
      - quote: "researchers also found they could tamper with the AI's own memory in ways that would influence its responses to future users long after the attacker had gone"
        attribution: "Dark Reading, citing Noma Labs"
        source_url: "https://www.darkreading.com/cyber-risk/patch-resistant-rufroot-flaw-malicious-ai-agent-swarms"
