  - title: "24,650 internet-exposed Baseboard Management Controllers leak crackable password hashes pre-authentication via a 22-year-old IPMI flaw — Lava finds confirmed in-the-wild ransomware exploitation"
    sources:
      - { url: "https://lavahq.io/research/bmc-exposure-alert", publisher: "Lava (Lava HQ research)", date: "2026-07-29", role: "primary" }
      - { url: "https://www.helpnetsecurity.com/2026/07/28/exposed-bmc-ipmi-vulnerability-research/", publisher: "Help Net Security", date: "2026-07-28", role: "corroborating" }
      - { url: "https://www.darkreading.com/cyber-risk/flaw-exposes-data-centers-server-takeover", publisher: "Dark Reading", date: "2026-07-28", role: "corroborating" }
    discovery_trace: "first seen at: darkreading (rotational source), URL https://www.darkreading.com/cyber-risk/flaw-exposes-data-centers-server-takeover → pivot: Help Net Security, URL https://www.helpnetsecurity.com/2026/07/28/exposed-bmc-ipmi-vulnerability-research/ → primary: Lava, URL https://lavahq.io/research/bmc-exposure-alert"
    summary: |
      Lava researchers scanned Shodan on 2026-05-06 for every public host answering on UDP/623 (the IPMI management port) and found 36,872 exposed Baseboard Management Controllers (BMCs) — the dedicated, OS-independent processor built into server motherboards for out-of-band remote management (reboot, power control, virtual media, firmware, health) via IPMI or the newer Redfish/HTTPS interface. Of those, 24,650 returned password-derived RAKP authentication material (an HMAC-SHA1 hash computed over the account password) to an unauthenticated client before the login handshake completed — CVE-2013-4786, an IPMI 2.0 specification flaw baked in since the protocol's 2004 release and publicly disclosed in 2013 but still unremediated 13 years later. Because the hash is returned once per request rather than requiring a fresh authentication attempt per guess, an attacker can crack it fully offline with no lockout, rate limit or failed-login alert generated on the BMC. Lava assessed roughly two-thirds of the captured hashes as crackable via wordlists or predictable factory-format passwords: Supermicro's 10-character-uppercase factory scheme (~141 trillion candidates) falls in about an hour on 8 GPUs, and HPE iLO's shorter factory format falls in 32 seconds on 8 RTX 6000 PRO cards; 2,340 endpoints paired an empty/ADMIN/root username with a dictionary password. Lava found direct evidence of in-the-wild exploitation: a ransom note (demanding 0.3 BTC, claiming RSA-2048 encryption) embedded in an exposed HPE iLO 4 Security Notice panel, and — per Dark Reading's interview with Lava CTO Yakir Kadkoda — compromised, ransom-note-displaying servers belonging to "one of the world's largest automotive component manufacturers." Because a BMC operates below and independently of the host OS, kernel, containers and workloads, host-based security tooling is structurally blind to a compromised BMC; Lava and Dark Reading both warn that a BMC foothold can pivot laterally across an entire out-of-band management network to reach other BMCs, storage and provisioning infrastructure, and in GPU-cloud environments potentially cross tenant boundaries.
    region_nexus: "global; any organization operating on-prem or colocated bare-metal server infrastructure with BMC/IPMI management (Supermicro, HPE, and other vendors) is potentially exposed, including European data-centre and critical-infrastructure operators"
    primary_sector_nexus: "indirect"
