    extended_notes: |
      Amazon's own hardening guidance is unusually concrete for a vendor post: evaluate dependency graphs rather than single packages; watch for maintainers who patiently build trust over weeks/months before publishing malicious updates; treat externally-fetched "license check" or config-cache scripts as a red flag; expect layered/runtime-derived crypto (AES-GCM, RC4-style arrays) rather than embedded keys; and expect AI-generated malware to read as clean, well-documented code, reducing the value of pattern-based review. debug and chalk were previously publicly attributed (Sept 2025) to a phishing-compromised maintainer without nation-state attribution — this is a materially new attribution layered onto a previously-known incident, not merely a rehash.

  - title: "Flying Eagle: a leaked, Docker-packaged Android RAT-builder MaaS runs 170+ servers across China; a successor kit, Night Dragon, targets AliPay/WeChat/state bank apps"
    sources:
      - { url: "https://hunt.io/blog/flying-eagle-android-rat-170-servers-night-dragon", publisher: "hunt.io / NetAskari (independent researcher)", date: "2026-07-30", role: "primary" }
      - { url: "https://www.darkreading.com/endpoint-security/flying-eagle-mobile-rat-builder-china", publisher: "Dark Reading", date: "2026-07-30", role: "corroborating" }
    discovery_trace: "first seen at: darkreading (rotational source), URL https://www.darkreading.com/endpoint-security/flying-eagle-mobile-rat-builder-china → primary: hunt.io/NetAskari, URL https://hunt.io/blog/flying-eagle-android-rat-170-servers-night-dragon"
    summary: |
      Independent researcher NetAskari and hunt.io traced two IP addresses named in a 2026-06-18 Chinese National Cybersecurity Reporting Center public warning (about a fake "one-stop public-safety-services" app) to a full-service Android malware-as-a-service builder called Flying Eagle. Flying Eagle ships as a complete Docker deployment — every buyer gets their own Web server, WebSocket server, PHP and MySQL instance plus APK/SDK build tooling (Java 11), a default TLS cert, and ready-made phishing-lure templates impersonating TikTok, adult services, financial apps and government welfare programs. The APK builder includes out-of-the-box AV-evasion: it strips revealing class names and pads samples with several megabytes of Base64-encoded JSON dressed up as SDK config cache (rather than random bytes) to keep file entropy low and avoid antivirus heuristics — hunt.io's head of research notes the developer left a comment confirming this was deliberate. Built samples steal payment credentials and screenshots, support keylogging and camera access, abuse Android accessibility services for privilege escalation, and inject overlays into government, adult and financial-services apps. Flying Eagle leaked from closed circles into the wider Chinese cybercriminal underground earlier in 2026 and is now marketed and supported through Telegram channels (the "SQLRCE0" channel sells a "repaired" build for $2,000 in Tether). Five days after the government warning, SQLRCE0 released a successor kit, "Night Dragon" — currently on far fewer servers than Flying Eagle's hundreds but more capable: live screen/microphone/camera capture, SMS and photo-gallery access, overlay injection specifically against AliPay, WeChat, crypto-wallet apps and the Agricultural Bank of China, China Construction Bank and ICBC, plus an artificial black "update screen" to hide hands-on-keyboard activity from the victim, and its own icon-hiding.
    region_nexus: "targeting is China-domestic; the transferable signal is the commoditized Docker-packaged MaaS builder model, AV-evasion technique (JSON-padding to suppress entropy heuristics), and accessibility-service abuse pattern, all directly portable to any mobile-banking-fraud threat model"
