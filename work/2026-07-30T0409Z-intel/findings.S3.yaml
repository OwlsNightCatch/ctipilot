  - title: "Amazon attributes the axios/debug/chalk npm supply-chain compromises to a DPRK financially-motivated cluster, naming a March 2025 'typo-crypto' package as the dress rehearsal"
    sources:
      - { url: "https://aws.amazon.com/blogs/security/amazon-identifies-north-korean-hacker-group-behind-open-source-supply-chain-attacks/", publisher: "AWS Security Blog (Amazon)", date: "2026-07-29", role: "primary" }
      - { url: "https://cyberscoop.com/amazon-north-korea-open-source-software-attacks/", publisher: "CyberScoop", date: "2026-07-29", role: "corroborating" }
    discovery_trace: "first seen at: cyberscoop (rotational source), URL https://cyberscoop.com/amazon-north-korea-open-source-software-attacks/ → primary: AWS Security Blog, URL https://aws.amazon.com/blogs/security/amazon-identifies-north-korean-hacker-group-behind-open-source-supply-chain-attacks/"
    summary: |
      Amazon's threat-intelligence team (posted by CISO CJ Moses) assesses with MEDIUM confidence that a DPRK cluster it names SAPPHIRE SLEET, STARDUST CHOLLIMA, BlueNoroff, CageyChameleon and Alluring Pisces is behind both the high-impact September 2025 compromise of the widely-depended-on npm packages debug and chalk and the March 2026 compromise of axios (100M+ weekly downloads), and traces both back to a March 2025 "dress rehearsal": a small, low-download typosquat package named typo-crypto. Access to legitimate maintainer accounts was obtained through social engineering ("earned the trust of an employee to hand them the keys") rather than exploiting a platform vulnerability. The typo-crypto payload shipped as a trojanized core.js file impersonating the legitimate core-js package: it stayed dormant until it received a hash input beginning with the literal string "0098273", then fetched an OS-specific second-stage payload from a hardcoded C2 (npmjs[.]store, 216.74.123.126), using layered Base64 + XOR obfuscation (XOR key "01042025"). Wiz Research separately found roughly 1 in 10 scanned cloud environments were touched by the debug/chalk compromise within a two-hour window. Amazon frames the campaign as a template for supply-chain patience: low-value packages used to refine maintainer social-engineering and payload tradecraft before it is redirected at packages with tens or hundreds of millions of weekly installs, and flags that dependency-graph-level (not single-package) review, externally-fetched runtime "guard scripts," and AI-hallucinated ("slopsquatted") package names are now part of the same attacker toolkit.
    region_nexus: "global; npm ecosystem impact is universal, directly relevant to any Swiss/EU organization consuming JavaScript/Node.js dependencies (axios alone at 100M+ weekly downloads)"
    primary_sector_nexus: "indirect"
    sector: "public-sector, finance, energy, telco (any org with a Node.js/JavaScript software supply chain)"
    cves: []
    techniques: [T1195.002, T1199, T1027]
    affected_products: ["axios (npm)", "debug (npm)", "chalk (npm)"]
