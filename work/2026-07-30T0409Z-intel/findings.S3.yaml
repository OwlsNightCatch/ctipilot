    summary: |
      Huntress observed a broad, opportunistic credential-stuffing (automated credential-validation) campaign against SonicWall VPN/firewall remote-management interfaces active 2026-07-25 through 07-27: 92 unique user accounts across 30 distinct customer organizations were successfully logged into (26 accounts on the 25th, 34 on the 26th, 32 on the 27th) from five primary attacking IPs, all registered to DigitalOcean. Login attempts used already-valid credentials rather than exploiting a software vulnerability; Huntress does not disclose the credential source but the campaign follows a string of prior SonicWall incidents (an October 2025 state-sponsored firewall-configuration exposure, and earlier SSLVPN CVE-driven compromises) that could plausibly be feeding the same credential pool. Critically, Huntress states no post-compromise hands-on-keyboard activity was observed following any of the successful logins — the attacker validated access and stopped, consistent with pre-positioning for later exploitation rather than immediate abuse. SonicWall had not published an advisory as of the Huntress report. Huntress's own framing: "edge devices are one of the most targeted interfaces, comprising over 70% of active intrusions triaged by Huntress."
