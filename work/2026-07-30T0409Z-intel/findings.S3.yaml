      No in-the-wild exploitation reported — this is a responsibly-disclosed research finding (PoC not released publicly), not an active campaign. Included because the "patch removes the door, not what already walked through it" mechanic is a genuinely new risk class for any organization standing up agentic-AI infrastructure, and MCP-bridge default-exposure is a pattern likely to recur across the wider MCP-server ecosystem.

  - title: "Huntress: opportunistic credential-stuffing spree compromised 30 SonicWall customers (92 accounts) over three days — no post-compromise activity observed, suggesting pre-positioning"
    sources:
      - { url: "https://www.huntress.com/blog/sonicwall-credential-stuffing-campaign", publisher: "Huntress", date: "2026-07-28", role: "primary" }
