  section: incidents
  item: "Hugging Face intrusion update — Artifactory escape vector"
  url_or_quote: "sourcing_note: \"those per-CVE database pages are not cited as sources ... so the per-CVE scores and ranges live in the structured metadata rather than as body claims\""
  summary: "Contradicted by the entry's own body paragraph 2, which states five of the scores as body claims: '(CVE-2026-65617, CVSS 8.8)', '(CVE-2026-65921, CVSS 8.8)', '(CVE-2026-66014, CVSS 8.8)', '(CVE-2026-66015, CVSS 7.2)', '(CVE-2026-66018, CVSS 6.5)', plus the six fixed builds and the branch scoping. (Contrast the HashiCorp entry, whose body genuinely carries no CVSS and whose identical sourcing-note sentence is accurate.) Either correct the sourcing note or move the scores out of prose."
- code: F14
  category: quantifier-without-source
  section: research
  item: "Amazon DPRK npm attribution — axios / debug / chalk / typo-crypto"
  url_or_quote: "\"The compromises span eighteen months and escalate in blast radius: debug and chalk in September 2025, then axios in March 2026 ...\""
  summary: "No cited source states eighteen months and no reading of the entry's own dates produces it. CyberScoop (fetched): typo-crypto in 'March 2025, a full year before the axios breach'. Amazon (fetched): typo-crypto March 2025, debug and chalk September 2025, axios March 2026. March 2025 -> March 2026 is twelve months; September 2025 -> March 2026 is six. Correct to twelve months (or drop the span)."
- code: F14
  category: quantifier-without-source
  section: research
  item: "Amazon DPRK npm attribution — axios / debug / chalk / typo-crypto"
  url_or_quote: "\"no other vendor has published a matching assessment\" (body para 1); \"no second party has published a corroborating attribution\" (sourcing_note)"
  summary: "The cited Amazon post says the opposite for axios: 'While the axios compromise has been publicly attributed to this DPRK-linked threat actor, the typo-crypto, debug, and chalk incidents haven't previously been connected to it', and 'This is the first time these compromises have been publicly tied to this DPRK-linked threat actor.' CyberScoop concurs: 'Until now, those three incidents had not been publicly linked to the same actor.' The absolute is only true of typo-crypto, debug and chalk — narrow it, or use Amazon's own framing."
- code: F4
  category: hallucinated-fact
  section: research
  item: "Amazon DPRK npm attribution — axios / debug / chalk / typo-crypto"
  url_or_quote: "title: \"... and names a 2025 typosquat as the rehearsal\"; summary: \"a small March 2025 typosquat named typo-crypto was a testing ground\""
  summary: "'typosquat' appears in neither cited source (grep over both fetched pages returns no match), and both describe the opposite mechanism: Amazon says 'the DPRK-linked threat actor compromised the typo-crypto package' and 'committed a trojanized file to the typo-crypto NPM package'; CyberScoop says the group 'planted malicious code in a package called typo-crypto'. The malicious FILE masqueraded as core-js inside an existing package — that is a maintainer/package compromise, not name-confusion typosquatting, and the two imply different defences. The same wording is also in the new registry record actor:sapphire-sleet ('a small March 2025 typosquat named typo-crypto'), which should be corrected with it."
- code: F14
  category: quantifier-without-source
  section: trending-vulnerabilities
  item: "CVE-2013-4786 — exposed BMC IPMI RAKP hash disclosure (deep dive)"
  url_or_quote: "summary: \"has no patch because it is not a code defect\"; cves[].fixed: \"No vendor patch exists or can exist — the flaw is in the IPMI 2.0 protocol specification, not in vendor code.\""
  summary: "Neither cited source states this absolute. Lava (fetched in full) frames remediation as network- and credential-level ('The main fix is simple: IPMI should not be reachable from the public internet') but never says no patch exists or can exist — and its Prior Work section links a vendor advisory on the same issue: 'HPE, IPMI 2.0 RAKP RMCP+ Authentication HMAC Password Hash Exposure — HPE's advisory covering the IPMI password-hash disclosure issue affecting earlier iLO generations.' Dark Reading (fetched) makes no patchability claim either. Soften to what the sources carry ('no vendor patch is offered; remediation is exposure removal and credential replacement')."
- code: F5
  category: missing-citation
  section: incidents
  item: "Hugging Face intrusion update — Artifactory escape vector"
  url_or_quote: "Body paragraph 2, entire: \"JFrog has now shipped the corresponding fixes, and the scope is wider than a single bug: nine CVEs across Artifactory Self-Managed, published 2026-07-27 with JFrog as CNA. ... Fixed builds are branch-specific — 7.111.18, 7.117.25, 7.125.18, 7.133.27, 7.146.34 and 7.161.15 — and CVE-2026-66015 and CVE-2026-66018 affect only the 7.146 and 7.161 branches rather than the full set.\""
  summary: "A ~150-word paragraph asserting nine CVE ids, five CVSS scores, six fixed builds, the CNA and a publication date carries not one inline citation. Every fact in it is TRUE — I verified all nine against the JFrog CNA records (all assigner JFROG, all datePublished 2026-07-27, scores 8.8/8.8/8.8/7.2/7.1/6.8/6.5/6.5/6.5, and 66015/66018 scoped to 7.146.x and 7.161.x only) and the ids/severities/fixed builds against the cited JFrog release notes — so this is a citation defect, not a truth defect. Attach the JFrog release-notes citation to the ids/builds/branch scoping (the page carries them; it does not carry the numeric CVSS)."
- code: F9
  category: surface-contradiction
  section: trending-vulnerabilities
  item: "HCSEC-2026-23 — HashiCorp Terraform MCP Server"
  url_or_quote: "Entry (all three cves[] records + body): \"terraform-mcp-server 0.2.1 through 1.0.0\" vs CVE-2026-14869 / -16496 / -16498 CNA records: versions {version: 0.3.0, lessThan: 1.1.0}"
  summary: "HashiCorp's cited bulletin says 'terraform-mcp-server 0.2.1 up to and including 1.0.0; fixed in 1.1.0'; HashiCorp's own CVE records for all three (assigner HashiCorp, published 2026-07-28) give the affected range as 0.3.0 to below 1.1.0. Same vendor, two lower bounds. The entry's sourcing note says the scores were taken from the per-CVE records but silently keeps the bulletin's range. An operator on 0.2.x gets a different answer depending on which HashiCorp document they read — surface it as a Contradiction line rather than picking one silently."
- code: F11
  category: editorial-advisory
  section: run-record
  item: "Run record 2026-07-30T0409Z-intel — verification & coverage notes"
  url_or_quote: "line 124: \"The Phase 4 deep read established that Switzerland appears only as a bare secondary geography\"; line 144: \"an incident-domain sub-agent mentioned a possible webmail zero-day\"; sub_agents notes lines 73 and 85: \"Scoped Phase 4 deep-read over the will-publish ... set\""
  summary: "Workflow-internal language in published run-record text: 'Phase 4' (three occurrences) and 'sub-agent' (one) are both on the banned list for reader-facing output. Reword to 'the deep read' / 'the incident-domain research pass'. Contract violation rather than taste — worth fixing even though it is advisory-class."
- code: F11
  category: editorial-advisory
  section: active-threats
  item: "Huntress SonicWall credential stuffing — 92 accounts / 30 orgs"
  url_or_quote: "tags: [identity, phishing, infostealer]"
  summary: "The `phishing` theme tag has no basis in either cited source — phishing appears nowhere in the Huntress post or the CyberScoop article (both fetched), and the entry's own sourcing note stresses that the credential-origin hypotheses are 'explicitly hedged speculation'. `infostealer` at least traces to the analyst's 'aggregation of stealer malware logs' line; `phishing` traces to nothing. Dropping it keeps the site's phishing list page honest."
- code: F11
  category: editorial-advisory
  section: trending-vulnerabilities
  item: "VMSA-2026-0006 (BSI citation) and HCSEC-2026-23 (BSI citation)"
  url_or_quote: "VMware summary: \"NCSC-CH, BSI CERT-Bund and NCSC-NL all escalated it the same day\"; HashiCorp body: \"BSI CERT-Bund surfaced the bulletin the following day ([BSI CERT-Bund, 2026-07-29])\""
  summary: "Both BSI pages, fetched: WID-SEC-2026-2569 shows 'Datum 28.07.2026 / Stand 29.07.2026' and WID-SEC-2026-2572 shows 28.07.2026 for its product listing. NCSC-CH (2026-07-29T13:00Z) and NCSC-NL (29-07-2026) are confirmed on the day. The one-day drift on the citation dates is inside tolerance, but the derived timing claims ('all ... the same day', 'the following day') are asserted more precisely than the BSI datelines support. Soften both, or drop the timing clause."
- code: F11
  category: editorial-advisory
  section: research
  item: "Amazon DPRK npm attribution — evidence[] quote"
  url_or_quote: "evidence[]: \"The malware implements file-based persistence with payload rotation and uses multi-layer obfuscation, combining base64-encoded text with an XOR cipher keyed to 01042025.\""
  summary: "The body deliberately withholds both malware constants ('under a fixed key', 'one specific literal value') but the frontmatter evidence quote prints the XOR key verbatim, so the run's own no-constants discipline is undone by its own published quote. Not a hard no-IOC breach (no hash, IP, domain or rule code appears in any of the eight entries — I checked) but it is inconsistent; trim the quote at 'multi-layer obfuscation' or pick another sentence."
