- code: F3
  category: claim-not-supported
  section: trending-vulnerabilities
  item: "VMSA-2026-0006 — VMware vCenter auth bypass / Syslog traversal / VMXNET3 escape"
  url_or_quote: "\"all were reported privately through Broadcom's bug-bounty programme and Pwn2Own\" (summary) / \"The flaws came from Broadcom's bug-bounty programme and from Pwn2Own ... ([Broadcom, 2026-07-29])\" (body para 6)"
  summary: "Fetched the cited Broadcom advisory (notification 38017) in full: the string 'bounty' appears nowhere. The advisory says only 'Multiple vulnerabilities in VMware ESX, vCenter, Workstation, and Fusion were privately reported to Broadcom' and names Atredis Partners (Phil Brass, Matt South), Nguyen Hoang Thach of STARLabs SG 'working with the Pwn2Own held by Zero day initiative', Maxim Suhanov, and Ian Barton of CrowdStrike. Only the Pwn2Own channel is sourced; 'Broadcom's bug-bounty programme' is not. Replace with 'privately reported to Broadcom' / 'private reports and Pwn2Own'."
- code: F3
  category: claim-not-supported
  section: trending-vulnerabilities
  item: "VMSA-2026-0006 — VMware vCenter auth bypass / Syslog traversal / VMXNET3 escape"
  url_or_quote: "\"Broadcom's standing hardening guidance applies and both NCSC-CH and NCSC-NL repeat it: management interfaces for vCenter and ESX belong on a dedicated management segment and should never face the internet or an untrusted network.\" (body, final sentence)"
  summary: "Sentence carries no inline citation and half of what it attributes is absent. Fetched NCSC-CH post 12814 via `fetch_source.py ncsc-csh post 12814`: its whole body is SEVERITY AND IMPACT / AFFECTED PRODUCTS / VULNERABILITY DETAILS ('Available Mitigations: Vendor patches available') / CVEs / REFERENCES — no segmentation or management-interface guidance at all. Fetched NCSC-NL NCSC-2026-0269, which DOES carry it ('Het is goed gebruik om toegang tot ESX en vCenter uitsluitend beschikbaar te stellen vanuit een gescheiden beheeromgeving ... niet rechtstreeks vanaf internet of externe netwerken toegankelijk'). The Broadcom advisory records 'Workarounds: None' and no hardening section. Attribute the guidance to NCSC-NL alone, with a citation."
- code: F4
  category: hallucinated-fact
  section: trending-vulnerabilities
  item: "VMSA-2026-0006 — CVE-2026-41703 fixed-version record"
  url_or_quote: "cves[] CVE-2026-41703 fixed: \"ESXi-9.1.0.0, ESXi-9.0.2.0100 and ESXi80U3i; Workstation and Fusion on their respective 5.2.3 / 26H1 tracks.\""
  summary: "Contradicts the cited Broadcom response matrix for 3d, which I read in full: VMware Workstation 25H2 -> 26H1 and VMware Fusion 25H2 -> 26H1 (both 26H1, CVSS 2.7); 5.2.3 is the fixed version for VMware Cloud Foundation 5.x ESX (CVSS 7.6), not a Workstation or Fusion track. The entry mis-assigns a Cloud Foundation ESX build to the desktop products. Correct to 'Workstation and Fusion both fix in 26H1; Cloud Foundation 5.x ESX takes 5.2.3'."
- code: F3
  category: claim-not-supported
  section: trending-vulnerabilities
  item: "CVE-2026-59726 (RufRoot) — Ruflo MCP bridge unauth RCE"
  url_or_quote: "\"no in-the-wild exploitation is reported and the proof-of-concept was not released\" (summary); \"Noma Labs built a working proof-of-concept but states it was not publicly released\" (sourcing_note); \"the working proof-of-concept was not published ([Noma Security, 2026-07-29])\" (body para 5)"
  summary: "Fetched the Noma post: it makes no statement of the kind. Its only PoC sentence is 'Noma Labs built an automated 8-step proof of concept to demonstrate the full impact' — and it PUBLISHES a working single-request RCE: 'All it took to get remote code execution was one single request:' followed by a complete copy-pasteable curl POST to /mcp invoking ruflo__terminal_execute. grep for 'not published|not publicly released|withh' over the fetched page returns nothing. The claim understates urgency in the reader's face; the poc-public status is in fact correct and it is the prose that needs fixing (e.g. 'Noma published the single-request exploit in full; the automated 8-step chain was not released')."
- code: F3
  category: claim-not-supported
  section: trending-vulnerabilities
  item: "CVE-2026-59726 (RufRoot) — Ruflo MCP bridge unauth RCE"
  url_or_quote: "\"Noma Labs disclosed to the maintainers on 2026-06-30 and a fix shipped within a day, which Noma independently verified ([Noma Security, 2026-07-29])\""
  summary: "The cited Noma post carries no date for the disclosure (grep for 'June|06-30|July 1' returns nothing) and no statement that Noma verified the fix. What it says is 'Noma Labs disclosed responsibly, and within a few hours, Ruflo had a full fix merged (PR #2521)'. 'Every step was confirmed live against a default Ruflo deployment' refers to Noma's own PoC, not to the fix. The 2026-06-30 date appears to be back-derived from the GHSA's Jul 1 2026 publication; either drop it or source it."
- code: F4
  category: hallucinated-fact
  section: trending-vulnerabilities
  item: "CVE-2026-59726 (RufRoot) — Ruflo MCP bridge unauth RCE"
  url_or_quote: "\"in Ruflo (formerly Claude Flow)\" (summary); \"Ruflo, formerly Claude Flow, orchestrates swarms of AI coding agents\" (body, first sentence)"
  summary: "Neither cited source supports the former name. `grep -c -i claude` over the fetched Noma page raw HTML (158 KB) returns 0; the GHSA advisory page never mentions it either. (The CVE-2026-59726 CNA record says only 'Ruflo is an agent meta-harness for Claude Code and Codex' — a different statement.) Either cite the rename or drop the clause."
- code: F3
  category: claim-not-supported
  section: trending-vulnerabilities
  item: "HCSEC-2026-23 — HashiCorp Terraform MCP Server"
  url_or_quote: "\"All three affect versions 0.2.1 through 1.0.0 and are fixed in 1.1.0, credited to Juan Pablo Martinez Kuhn of Coinspect ([HashiCorp, 2026-07-28])\""
  summary: "The cited bulletin's Acknowledgement section says the opposite of 'all three': 'CVE-2026-16496 was reported to HashiCorp by Juan Pablo Martinez Kuhn of Coinspect. CVE-2026-14869 and CVE-2026-16498 were identified by an internal team.' Only one of the three is Kuhn's. Restrict the credit to CVE-2026-16496."
