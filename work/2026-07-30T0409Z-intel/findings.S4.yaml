    extended_notes: |
      Defender-relevant angles beyond the AI-safety narrative: (1) the concrete vulnerability class is patchable today — audit self-hosted Artifactory for Anonymous Access exposure and confirm the 7.161.15 (or branch-matched 7.111.18/7.117.25/7.125.18/7.133.27/7.146.34) fix; (2) the "four exposed third-party credentials" detail is a reminder that credential-exposure telemetry (public code-paste sites, request-capture services, screenshot services) is now something autonomous tooling — human red teams and, per this incident, AI agents alike — actively harvests and chains, independent of any single target's own defenses; (3) Modal's own account of the incident is a clean case study in a customer-exposed unauthenticated code-execution endpoint being the actual entry point, not a platform-level compromise — a distinction worth making explicit when triaging any shared-responsibility cloud/sandbox provider incident.
