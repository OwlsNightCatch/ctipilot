  - title: "Health-ISAC issues a sector-wide ShinyHunters warning: helpdesk-vishing to SSO takeover is now a repeatable healthcare-sector attack chain"
    sources:
      - { url: "https://health-isac.org/shiny-hunters-impact-to-health-sector-and-recommended-mitigation-strategies/", publisher: "Health-ISAC", date: "2026-07-24", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/health-isac-warns-of-rising-shinyhunters-data-theft-attacks-on-healthcare/", publisher: "BleepingComputer", date: "2026-07-29", role: "corroborating" }
    discovery_trace: "first seen at: bleepingcomputer, URL https://www.bleepingcomputer.com/news/security/ (listing) → pivot: BleepingComputer article, URL https://www.bleepingcomputer.com/news/security/health-isac-warns-of-rising-shinyhunters-data-theft-attacks-on-healthcare/ → primary: Health-ISAC advisory, URL https://health-isac.org/shiny-hunters-impact-to-health-sector-and-recommended-mitigation-strategies/"
    summary: |
      Health-ISAC (the healthcare-sector ISAC) published an advisory — freshly reported by BleepingComputer on 2026-07-29 — warning of a rising, repeatable ShinyHunters attack chain against healthcare and medtech organizations: vishing (voice social engineering) against a helpdesk to trigger a password reset, MFA reset, or device re-enrollment; takeover of the resulting Microsoft Entra ID (or Okta/Google) SSO session; then lateral pivot through the SSO trust relationship into connected SaaS platforms (Microsoft 365, SharePoint, OneDrive, Salesforce, ServiceNow, Teams) for rapid bulk data exfiltration used as extortion leverage — with no ransomware/encryption deployed. Health-ISAC frames the group as an identity- and SaaS-access extortion operation rather than a conventional ransomware crew, names Medtronic (3.8M records), DentaQuest (2.6M accounts), iRhythm and OneMedical as recent healthcare victims of this pattern, and states "SSO is the control plane, and ShinyHunters' leverage is created through data theft at cloud scale." Recommended mitigations are concrete and Tier-0-scoped: out-of-band identity proofing for any password reset, MFA reset, or device re-enrollment request; phishing-resistant MFA (FIDO2/WebAuthn) for admins and high-risk groups; and treating SSO infrastructure itself as a Tier-0 critical asset with enhanced monitoring. This is the same tradecraft already reported here against Abbott/Exact Sciences (2026-07-18) and claimed against Ernst & Young (2026-07-28); the delta is Health-ISAC's sector-wide framing and its concrete, actionable helpdesk/SSO-hardening guidance, directly relevant to any Swiss/European public or private healthcare provider running Entra ID, Okta or Google Workspace SSO in front of clinical or business SaaS.
    region_nexus: "no direct Swiss/European named victim in this advisory, but healthcare is a profiled additional sector and the SSO/helpdesk-vishing chain is identical to tradecraft already observed against Abbott/Exact Sciences and claimed against Ernst & Young — directly transferable to any European healthcare provider or health-insurer using SSO-fronted SaaS"
