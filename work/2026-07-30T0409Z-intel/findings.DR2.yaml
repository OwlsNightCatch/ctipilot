  # ============================================================
  # ITEM 3 — Operation Talked (SOCRadar)
  # (findings.S3.yaml item 7)
  # ============================================================
  - item_ref: "S3#7 Operation Talked (SOCRadar)"
    sources_refetched:
      - { url: "https://socradar.io/blog/operation-talked-russia-ukraine-defense-industry/", publisher: "SOCRadar", date: "2026-07-29", role: "primary" }
    corroboration_check: "Two targeted WebSearch queries run this pass ('\"Operation Talked\" SOCRadar Russia Ukraine defense espionage' and '\"Operation Talked\" Ukraine defense breach Sliver C2 Yandex') returned no independent pickup of this specific report by any second party as of this run. Remains genuinely SINGLE-SOURCE, published same day (2026-07-29)."
    enriched_summary: |
      Attribution basis and confidence, SOCRadar's own words: "SOCRadar attributes
      this activity to a Russia-nexus actor with high confidence, based on TTP
      overlap with UAC-0056 / UAC-0114, Moscow-timezone activity, and Russian-
      language artifacts the actor left in their own shell history." The
      specific artifacts cited: a JCUKEN (Russian) keyboard layout set on the
      operator's system while Latin shell commands were typed, leaving "stray
      Cyrillic strings in the shell history"; Russian-language script output
      ("Готово! Данные сохранены"); and a Russian-language code comment ("ваш
      запрос"). This is SOCRadar's own assessed confidence — no second party
      corroborates the attribution or the underlying discovery as of this run.

      Switzerland — EXACT VERBATIM TEXT (this is the entire and only mention of
      Switzerland anywhere in the report): "Ukraine is the primary target across
      the defense and logistics sector. Secondary geographies observed include
      Russia, Romania, Poland, Moldova, Latvia, Switzerland, Ireland, and South
      Korea, on top of a broad opportunistic global scanning footprint." This is
      a BARE geography mention in a list of "secondary geographies observed" —
      the article explicitly frames this list as part of the mass, opportunistic
      pre-authentication SCANNING footprint (1.1M+ unique internet-facing
      targets), not the targeted-espionage victim set. NO Swiss victim
      organization, sector, or organization class is named anywhere in the
      report. The nine confirmed breaches (Git-repository theft) are explicitly
      and exclusively Ukrainian defense/aerospace/aviation entities; the one
      additional live/ongoing compromise (interactive shell) is a Ukrainian
      railway-logistics operator. Switzerland's appearance is consistent with
      "a host in Switzerland was among the population scanned/opportunistically
      probed" — it must NOT be reported as "Switzerland was breached," "a Swiss
      organization was a confirmed victim," or similar; the entry should state
      plainly that Switzerland appears only as a bare secondary-geography mention
      in the mass-scanning footprint, with no named Swiss victim, sector, or
      organization class disclosed.

      CVE arsenal — SOCRadar states "The arsenal spans 19 CVEs with disclosed
      identifiers, plus SonicWall SSL-VPN and RabbitMQ exploitation observed
      without a disclosed CVE." Only 7 of the 19+ are individually named in the
      article's PROSE (the full 19+ list and the full per-CVE scan-volume
      breakdown exist only as an embedded chart IMAGE on the page — e.g.
      "operation-talked-cve-exploit-inventory-wp2shell-sonicwall-rabbitmq.jpg" —
      which is NOT machine-text-extractable from this fetch; flagging this as a
      genuine data gap, not an omission on my part). The 7 named, verified via
      the article's own outbound hyperlinks (one sentence in the source's prose
      ambiguously appears to group two different products together, but the
      hyperlink targets resolve the correct per-product mapping):
        - Sophos XG — CVE-2022-1040 — the ONLY CVE with a stated scan-volume
          figure in prose: "Sophos XG (CVE-2022-1040) alone accounts for
          roughly 757,000 targets" (of the 1.1M+ unique-target total; a single
          host can be scanned for multiple CVEs, so per-CVE counts sum higher
          than the deduplicated unique-target total).
        - WordPress — CVE-2026-63030 ("wp2shell," described as "very recent")
        - FortiOS SSL-VPN — CVE-2024-55591
        - F5 BIG-IP — CVE-2023-46747
        - SAP NetWeaver — CVE-2025-31324
        - Roundcube Webmail — CVE-2025-49113
        - FortiWeb — CVE-2025-25257 (SOCRadar's remediation sentence reads
          "...and Roundcube (CVE-2025-49113 / CVE-2025-25257)" — grouping BOTH
          CVE ids under a single "Roundcube" label in prose, which is a
          drafting error in SOCRadar's own text; the article's own hyperlink for
          CVE-2025-25257 resolves to SOCRadar's separate FortiWeb SQL-injection
          write-up ("cve-2025-25257-fortiweb-sql-injection-bug-rce"), confirming
          CVE-2025-25257 is the FortiWeb CVE, not a second Roundcube CVE. The
          earlier findings.S3.yaml entry already assigned this correctly
          (FortiWeb) — confirmed correct despite the source's own confusing
          prose.

      Tooling classes (behavior only): C2 — Sliver framework (stated version
      "v1.5.x," ECC P-256 certificate, both mTLS and HTTP listener transports);
      webshells — Godzilla ASPX, r57, suo5, reGeorg/Neo-reGeorg (the latter two
      function as both webshell and tunneling relay); tunneling — Chisel, Gost
      SOCKS5, multi-hop proxy chains (stated as "80+ proxies"); credential
      theft — mimikatz (LSASS memory), DonPAPI (web/DPAPI-protected credential
      stores); lateral movement — NetExec for Pass-the-Hash, Kerberos ticket
      theft for Pass-the-Ticket, evil-winrm for WinRM sessions; reconnaissance —
      masscan, fscan, nuclei scanners plus Netlas/Shodan/FOFA search-engine
      reconnaissance, powerview.py/LDAP for domain-account discovery;
      collection/exfiltration — git-dumper for bulk Git-repository theft,
      exfiltration to AWS S3.

      Victim count and sectors: nine confirmed breaches, each involving Git-
      repository theft, at Ukrainian organizations described only by sector (no
      names, "withheld pending coordinated disclosure and remediation"): two
      drone/UAV manufacturers, one military-aerial-reconnaissance organization,
      two aviation-sector organizations, one military-aviation organization, one
      defense-sector organization, one state-defense-industry organization, and
      one military-electronic-procurement organization. A tenth, distinct and
      ongoing compromise — described separately from the "nine" — is an
      interactive shell (as of 2026-07-26) on a Ukrainian railway-logistics
      operator's Debian 11 server, reached via four compromised Laravel
      applications sharing a common database password; SMTP relay credentials
      recovered from this host would additionally enable phishing pivots from
      the victim's own mail infrastructure. SOCRadar states this organization
      "has been notified, and remediation is in progress."

      MITRE ATT&CK mapping — SOCRadar's own report includes a full kill-chain-
      to-technique table; all ids below are sourced directly from that table:
      T1595.001 (Active Scanning), T1583.003 (Acquire Infrastructure: Virtual
      Private Server), T1190 (Exploit Public-Facing Application), T1133
      (External Remote Services — both as an initial-access vector via FortiGate
      SSL-VPN credential reuse, and separately as a persistence mechanism via
      Sliver beaconing), T1505.003 (Server Software Component: Web Shell),
      T1573.001 (Encrypted Channel: Symmetric Cryptography — Sliver mTLS),
      T1003.001 (OS Credential Dumping: LSASS Memory), T1555.003 (Credentials
      from Web Browsers — DonPAPI), T1087.002 (Domain Account Discovery),
      T1550.002 (Pass the Hash), T1550.003 (Pass the Ticket), T1021.006
      (Remote Services: Windows Remote Management), T1213 (Data from
      Information Repositories — git-dumper), T1567.002 (Exfiltration to Cloud
      Storage — AWS S3), T1090.003 (Multi-hop Proxy).
