  # ITEM 1 — Huntress SonicWall credential-stuffing spree
  # (findings.S3.yaml item 4)
  # ============================================================
  - item_ref: "S3#4 Huntress SonicWall credential-stuffing spree"
    sources_refetched:
      - { url: "https://www.huntress.com/blog/sonicwall-credential-stuffing-campaign", publisher: "Huntress", date: "2026-07-28", role: "primary", author: "Jevon Ang, Ethan Williams" }
      - { url: "https://cyberscoop.com/sonicwall-credential-attacks-vpn-firewall/", publisher: "CyberScoop", date: "2026-07-29", role: "corroborating", author: "Matt Kapko" }
    enriched_summary: |
      Activity window per Huntress's own telemetry: detection began 2026-07-25 at
      approximately 18:02:21 UTC (an "out-of-the-ordinary spike in successful
      SonicWall VPN and firewall logins" from "a suspicious Autonomous System
      Number"). Per-day breakdown, stated directly by Huntress: July 25 — 26
      unique user accounts compromised across 6 distinct organizations; July 26 —
      34 unique user accounts across 16 distinct organizations; July 27 — 32
      unique user accounts across 8 distinct organizations. Totals: 92 unique
      compromised accounts, 30 distinct customer organizations (the daily
      distinct-org counts sum exactly to 30 — Huntress does not explicitly state
      whether any organization recurred across days, but the arithmetic is
      consistent with no overlap). CyberScoop adds that the campaign "started
      Saturday and grew rapidly, ultimately compromising 92 unique user accounts
      during the next 41 hours," and that "the last compromise occurred Monday"
      (2026-07-27), per Huntress principal tactical response analyst Michael
      Tigges, who frames this as a recognizable campaign shape: "A rash of
      compromise will break out, followed by silence until the adversary rotates
      infrastructure."

      Attacking infrastructure, as a class (no addresses reproduced here): Huntress
      states it identified five primary malicious IP addresses driving the attack,
      "all of which are registered to DigitalOcean, LLC" — i.e., a single commodity
      cloud-hosting provider, not a distributed botnet or residential-proxy
      network. This is stated identically in both the Huntress primary and
      corroborated independently by CyberScoop's reporting.

      Post-compromise activity — verbatim, from the Huntress blog's Background
      section: "We did not observe any post-compromise hands-on-keyboard activity
      from these attacks." IMPORTANT PRECISION FLAG: the word "pre-positioning"
      does NOT appear anywhere in the Huntress blog post (confirmed via full-text
      search of the fetched page). "Pre-positioning" is CyberScoop's own editorial
      framing, not a Huntress-sourced claim: CyberScoop's article states
      "Attackers, which haven't been identified, have also refrained from
      initiating any post-compromise activity, indicating the intrusions could be
      pre-positioning for future attacks" — this sentence is CyberScoop's
      synthesis/inference, not a quote attributed to Huntress or Tigges. Tigges IS
      quoted making a related but distinct risk statement: "With local network
      access, the sky is essentially the limit for most networks that do not have
      proper topology controls in place." The entry should attribute the
      "pre-positioning" characterization to CyberScoop's reporting/inference, not
      to Huntress, and should not present it as a Huntress-confirmed assessment.

      Credential source — Huntress's blog makes NO statement about where the
      credentials originated; it only describes the observed behavior as
      "automated credential validation" (i.e., credential stuffing using
      already-valid credentials, not a software exploit). Huntress explicitly
      declines to disclose a root cause. CyberScoop separately quotes Tigges
      offering an explicitly speculative, unconfirmed hypothesis: "This could be
      an aggregation of stealer malware logs, previously compromised SonicWall
      configuration files, or historic CVE compromise that resulted in more
      credentials than the adversary could use at the time." This is Tigges'
      own hedge ("could be") covering three alternative, unconfirmed explanations
      — it must not be reported as an established finding.

      Targeted interface — Huntress's blog refers throughout to "SonicWall VPN
      and firewall accounts" and "remote access portals" without specifying
      whether the successful logins hit the SSLVPN service specifically, the
      SonicOS management interface specifically, or both; CyberScoop similarly
      reports the attacks as "hitting various SonicWall devices, rather than
      targeting specific types of organizations." Huntress's own mitigation
      guidance spans both surfaces ("Disable or limit HTTP, HTTPS, SSH, SSL VPN
      and inbound management until credentials are reset"), implying the exposure
      is not confined to one interface class, but the successful-login telemetry
      itself is not broken down by interface type in either source.

      SonicWall's own response — not published as of the Huntress report.
      CyberScoop states explicitly: "SonicWall hasn't released a security
      advisory about the malicious activity as of press time. A spokesperson
      told CyberScoop the company is still investigating and hopes to have more
      information soon."

      Prior-incident context Huntress cites for its "automated credential
      validation" assessment: (1) the same four compromised user accounts in
      this event were previously targeted in a separate incident on 2026-05-22;
      (2) an October 2025 incident where "threat actors authenticated into
      multiple accounts rapidly across compromised devices" (this is the
      previously-reported SonicWall cloud/firewall-configuration exposure
      incident); (3) a February 2026 incident where "threat actors leveraged
      compromised SonicWall SSLVPN credentials to gain initial access to a
      victim network." CyberScoop separately notes 17 SonicWall CVEs are in
      CISA's KEV catalog since late 2021, 10 tied to ransomware campaigns
      including "a wave of about 40 Akira ransomware attacks between mid-July
      and early August 2025" — general SonicWall exploitation context, not
      specific to this credential-stuffing event.
