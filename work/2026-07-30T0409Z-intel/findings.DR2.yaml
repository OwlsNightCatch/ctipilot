  # ITEM 2 — Amazon/AWS DPRK npm supply-chain attribution
  # (findings.S3.yaml item 1)
  # ============================================================
  - item_ref: "S3#1 Amazon attributes axios/debug/chalk npm compromises to DPRK cluster"
    sources_refetched:
      - { url: "https://aws.amazon.com/blogs/security/amazon-identifies-north-korean-hacker-group-behind-open-source-supply-chain-attacks/", publisher: "AWS Security Blog (CJ Moses, CISO of Amazon Integrated Security)", date: "2026-07-29", role: "primary" }
      - { url: "https://cyberscoop.com/amazon-north-korea-open-source-software-attacks/", publisher: "CyberScoop", date: "2026-07-29", role: "corroborating", author: "Greg Otto" }
    enriched_summary: |
      Confidence level, exact wording from AWS's own post: "Based on analysis of
      command-and-control (C2) indicators and TTPs, Amazon Threat Intelligence
      assesses with medium confidence that these campaigns are attributable to
      the DPRK-linked threat actor tracked as SAPPHIRE SLEET, STARDUST CHOLLIMA,
      BlueNoroff, CageyChameleon, and Alluring Pisces." This is a MEDIUM-confidence
      assessment, not a factual claim — the entry must preserve that hedge.
      CyberScoop's companion piece (from a media roundtable, not the written
      post) adds a further alias used by "security researchers" generally:
      "Security researchers track the group under several names, including
      UNC1069, Sapphire Sleet and Stardust Chollima" — UNC1069 is a candidate
      additional alias for the registry entry, sourced to CyberScoop reporting
      on the roundtable rather than to Amazon's own blog text.

      Maintainer-access mechanism, Amazon's own words: "In each case, the threat
      actor gained access by socially engineering a trusted maintainer of the
      package, then published a software update containing malicious code."
      CyberScoop's roundtable quote from Moses is more vivid but describes the
      identical mechanism: "They didn't break through a window... They basically
      earned the trust of an employee to hand them the keys."

      typo-crypto "dress rehearsal" (March 2025), full technical detail from
      Amazon's post: the trojanized file is named core.js and "masquerades as
      the legitimate core-js NPM package within the typo-crypto repository" (i.e.
      typo-crypto is itself a typosquat container package, and core.js inside it
      impersonates the unrelated, legitimate core-js package). Dormancy/trigger
      condition, verbatim: "The trojanized file executes when it receives a hash
      input beginning with the value 0098273." Payload behavior on trigger,
      verbatim: "When triggered, it downloads a second-stage payload from a
      hardcoded C2 server, then executes the payload based on the victim's
      operating system, with behavior tailored for Windows, macOS, or Linux."
      Persistence and obfuscation, verbatim: "The malware implements file-based
      persistence with payload rotation and uses multi-layer obfuscation,
      combining base64-encoded text with an XOR cipher keyed to 01042025." Amazon
      Inspector reported the malware to the OSV database, where it is tracked as
      MAL-2026-3400. Amazon's own scale assessment: "Based on the limited number
      of observed downloads, Amazon Threat Intelligence assesses that this
      campaign was small scale and likely served as a testing ground for the more
      visible supply chain operations that followed in late 2025 and 2026."
      (IOCs for typo-crypto — domain, IP, two SHA256 hashes — are published in
      Amazon's post but are deliberately NOT reproduced here per the no-IOC
      policy.)

      Affected/patched VERSION precision for axios, debug, chalk: Amazon's post
      does NOT give specific version numbers or ranges for any of the three
      compromised packages. It states only compromise timing/scale: typo-crypto
      compromised March 2025; debug and chalk compromised September 2025; axios
      compromised March 2026 ("one of the most widely used JavaScript libraries
      with more than 100 million weekly downloads"). The only "version" language
      in the post is generic: "Any organization that automatically pulled the
      latest version of these packages received the compromised update." If the
      entry needs vendor-precise affected/fixed version numbers for axios/
      debug/chalk, that must come from a different source (e.g. the GHSA/OSV
      advisories for each package) — Amazon's post is not that source.

      Dependency-graph-review recommendation: Amazon's post does NOT contain an
      explicit imperative recommendation sentence (no "we recommend auditing your
      dependency graph" or equivalent). The closest supporting content is a
      description of an attacker-tradecraft shift, framed as observation, not
      advice: "Amazon Inspector has observed attackers increasingly splitting a
      single malicious workflow across several ordinary-looking packages... This
      approach is designed to defeat scanners that evaluate packages one by one
      instead of reasoning about how they interact in a real dependency graph."
      The post's closing paragraph is the closest thing to customer-facing
      guidance, and it is general, not a specific dependency-graph directive:
      "Our goal is to help customers understand where their environments rely on
      open source components, identify suspicious behavior early, and respond
      quickly when the software supply chain is used as an entry point." The
      entry should not attribute a specific "audit your dependency graph"
      recommendation as an Amazon quote — it should instead describe the
      fragment-level-attack finding and let the defensive implication stand on
      its own.
