  item: "2026-07-30/rufroot-cve-2026-59726-ruflo-mcp-bridge-unauth-rce"
  url_or_quote: "\"Noma withheld its automated eight-step impact chain but published the single unauthenticated request that reaches code execution in full ([Noma Security, 2026-07-29])\" / sourcing_note: \"Noma Labs built a working proof-of-concept covering the full eight-step impact chain, which it did not release\""
  summary: "The cited Noma post never states that anything was withheld or not released. It says \"Noma Labs built an automated 8-step proof of concept to demonstrate the full impact:\" and then publishes all eight steps in narrative detail, naming the tools (tools/list, terminal_execute, ruflo__swarm_init, ruflo__agent_spawn, ruflo__agentdb_pattern-store), the MongoDB conversation dump, the /app/beacon.js persistence write with require() injection and PID-1 kill, and the shell-history cleanup, closing with \"Every step was confirmed live against a default Ruflo deployment on AWS EC2.\" What is absent from the page is a link to an exploit script, not a statement of withholding. The entry's wording both rests on an uncited inference and understates what is public. Suggested fix: say the post describes the full eight-step chain step by step and publishes the single RCE request in copy-pasteable form, without asserting a withholding decision no source states."
