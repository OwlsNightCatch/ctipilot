  summary: "Broadcom's cited advisory lists eight impacted products - the six above plus \"VMware Telco Cloud Platform\" and \"VMware Telco Cloud Infrastructure\" - and every one of the five response matrices carries Telco Cloud rows with a distinct remediation: \"VMware Telco Cloud Platform vCenter 3.0, 4.x, 5.0.x, 5.1.x Any CVE-2026-59309, CVE-2026-59310 9.8 Critical KB449886\", \"VMware Telco Cloud Infrastructure vCenter 3.0 ... KB449886\", and \"VMware Telco Cloud Platform ESX 5.0.x, 5.1.x\" rows for CVE-2026-47876, CVE-2026-41703 and CVE-2026-41709. NCSC-CH's cited advisory also lists VMware Telco Cloud Platform under AFFECTED PRODUCTS. Neither affected_products[] nor any cves[].affected field mentions either product, so a telco operator - a sector this entry itself tags - reading the affected list would wrongly conclude they are out of scope, and would miss that their fix is a KB rather than a version. Source-supported affected/patched-version depth that dropped out of the entry."
