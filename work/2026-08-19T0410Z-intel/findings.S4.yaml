  - title: "UPDATE — the Metabase downstream-victim list grows to at least 9 named organisations, including a newly disclosed Israeli crypto-broker breach of 200,000 customers traced to the same third-party BI compromise"
    sources:
      - { url: "https://venarix.com/blog/metabase-security-incident-downstream-impact-across-customer-environments", publisher: "VenariX", date: "2026-08-10 (updated 2026-08-17)", role: "primary" }
      - { url: "https://databreaches.net/2026/08/17/israels-largest-crypto-broker-bits-of-gold-hit-by-data-breach-affecting-200000-customers/", publisher: "DataBreaches.net", date: "2026-08-17", role: "corroborating" }
    discovery_trace: "first seen at: databreaches-net, URL https://databreaches.net/feed/ (RSS item on the Bits of Gold breach, published 2026-08-17T13:19:23Z, describing access via 'a third-party data analytics network') → pivot: WebSearch confirming Bits of Gold appears on VenariX's Metabase downstream-victim tracker → primary: VenariX's tracker page, URL https://venarix.com/blog/metabase-security-incident-downstream-impact-across-customer-environments (last updated 2026-08-17, adding five new named victims)"
    summary: |
      The unauthenticated SQL-injection zero-day in Metabase's password-reset endpoint (CVE-2026-72898, CVSS 10.0, KEV-listed 2026-08-11 — covered here 2026-08-09 and 2026-08-12) has produced a growing, independently trackable list of downstream customer breaches. VenariX's running tracker, last updated 2026-08-17, now lists nine named organisations whose Metabase instances were compromised and used to pivot into connected data warehouses: n8n (136 records including 5 bcrypt password hashes tied to n8n Cloud accounts), Framework, Tally, Kilo Code, and — newly added on 2026-08-17 — Stocksy United Co-op, ShipMonk, Checkly, Cypress.io, and Bits of Gold. Bits of Gold, described by DataBreaches.net as Israel's largest cryptocurrency broker, separately disclosed on 2026-08-17 that "a hacker gained unauthorized access to a third-party data analytics network" and obtained names, national ID numbers, and emails for roughly 200,000 customers — the described access path (third-party analytics platform) is consistent with the Metabase compromise chain. The underlying mechanism: an unauthenticated attacker injects SQL via the reset-password endpoint to reach administrator context, then retrieves the Metabase instance's own stored credentials for every connected downstream database, exposing whatever those credentials reach. VenariX's own compromise indicator: a `POST /api/session/reset_password` returning HTTP 400 immediately followed by a `GET /api/user/current` returning HTTP 200 in access logs is stated as diagnostic of successful exploitation on a given instance. Critically, the tracker stresses that patching the Metabase instance does not invalidate credentials or session cookies already harvested before the patch — affected organisations must rotate every downstream credential the compromised instance held, not just patch the BI tool itself.
    region_nexus: "global self-hosted/SaaS BI-tool exposure; Metabase is widely deployed by European and Swiss organisations as an open-source analytics layer, so any self-hosted instance not yet confirmed patched and credential-rotated remains exposed to the same downstream-pivot pattern documented across these nine victims"
