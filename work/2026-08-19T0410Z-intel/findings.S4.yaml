  - title: "UPDATE — ReliaQuest reverse-engineers Cl0p's purpose-built Windchill web shell: application-native JSP implant with a custom X-windchill-req HTTP header protocol, in-memory Java class loading, and plaintext LDAP credential theft in one command; GE joins Philips and Shell as a named victim under investigation"
    sources:
      - { url: "https://reliaquest.com/blog/clop-returns-with-custom-implant-in-mass-extortion-campaign", publisher: "ReliaQuest", date: "2026-08-18", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/clop-created-custom-web-shell-for-windchill-data-theft-attacks/", publisher: "BleepingComputer", date: "2026-08-18", role: "corroborating" }
      - { url: "https://www.bleepingcomputer.com/news/security/philips-and-ge-investigating-clop-ransomware-data-theft-claims/", publisher: "BleepingComputer", date: "2026-08-17", role: "corroborating" }
    discovery_trace: "first seen at: bleepingcomputer (WebFetch listing https://www.bleepingcomputer.com/news/security/) → pivot: https://www.bleepingcomputer.com/news/security/clop-created-custom-web-shell-for-windchill-data-theft-attacks/ → primary: ReliaQuest's own research post, URL https://reliaquest.com/blog/clop-returns-with-custom-implant-in-mass-extortion-campaign"
    summary: |
      ReliaQuest published technical analysis on 2026-08-18 of a custom web shell it attributes with high confidence to Cl0p, deployed following exploitation of CVE-2026-12569 (CVSS 9.3, PTC Windchill/FlexPLM login-servlet deserialization flaw) in the ongoing Windchill/FlexPLM extortion campaign (44+ victims named on Cl0p's leak site as of 2026-08-13, including Swiss and Dutch organisations; Philips and Shell confirmed investigating as of 2026-08-15). Unlike a generic JSP web shell, this implant is purpose-built with detailed knowledge of Windchill's internals: it directly imports the application's own Java classes — MethodContext, WTConnection and WTKeyStoreUtil — so its database queries execute under Windchill's existing application database identity rather than a separately configured attacker account, and it decrypts credentials directly from Windchill's keystore. Command-and-control runs through a custom protocol carried in the `X-windchill-req` HTTP request header (an eight-character value, first character = command byte) rather than a visible request body, with GZIP-compressed responses to blend with normal application traffic and evade standard network monitoring. Of the implant's command set, ReliaQuest details two: a single `S` command returns Windchill's LDAP/directory-management and administrative credentials in plaintext; an `fl` command (backed by a `Flst1` class) enumerates the file-vault database for stream IDs, filenames, storage paths and file sizes, writing results to `flst.txt` ahead of staged exfiltration. The shell also embeds a custom Java class loader that accepts a Base64-encoded ZIP payload and executes it entirely in memory — no files written to disk — for arbitrary follow-on code execution. ReliaQuest bases its Cl0p attribution on matching extortion-email sender addresses to entries already live on Cl0p's leak site, prior observation of the same `X-windchill-req` header value in earlier Cl0p activity, and consistency with Cl0p's established web-shell tradecraft lineage (DEWMODE, LEMURLOOT). Separately, General Electric confirmed on 2026-08-17 it is assessing Clop's data-theft claims, joining Philips (which describes the incident as contained with no customer-environment impact) and Shell as named organisations responding to the campaign; PTC's advisory notes the affected platforms are used by more than 30,000 customers globally, and the U.S. State Department is offering a $10 million reward for information linking Cl0p's operations to a foreign government.
    region_nexus: "global manufacturing/PLM-software supply chain; the underlying Cl0p Windchill/FlexPLM campaign already includes a Swiss and a Dutch organisation among its 44+ named leak-site victims (covered 2026-08-13)"
    primary_sector_nexus: "indirect"
    sector: "manufacturing, industrials, energy (Shell)"
    cves: ["CVE-2026-12569"]
    techniques: [T1190, T1505.003, T1552.001, T1620, T1005]
    affected_products: ["PTC Windchill", "PTC FlexPLM"]
    entity_keys: ["actor:clop", "campaign:clop-windchill-flexplm-extortion-2026"]
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "update-of:2026-08-15/clop-windchill-philips-shell-first-victim-confirmations"
    evidence:
      - quote: "The web shell connects to Windchill's database through the application's own MethodContext and WTConnection classes, meaning its queries run under the application's existing database identity rather than through a separately configured attacker account."
        attribution: "ReliaQuest"
        source_url: "https://reliaquest.com/blog/clop-returns-with-custom-implant-in-mass-extortion-campaign"
      - quote: "A single 'S' command to the web shell returns Windchill's directory-management and administrative credentials in plaintext."
        attribution: "ReliaQuest"
        source_url: "https://reliaquest.com/blog/clop-returns-with-custom-implant-in-mass-extortion-campaign"
      - quote: "The web shell routes commands through a custom HTTP header, 'X-windchill-req,' rather than a visible request body."
        attribution: "ReliaQuest"
        source_url: "https://reliaquest.com/blog/clop-returns-with-custom-implant-in-mass-extortion-campaign"
      - quote: "Because it mimics normal application behavior rather than following known attacker patterns, it is significantly harder to detect."
        attribution: "ReliaQuest"
        source_url: "https://reliaquest.com/blog/clop-returns-with-custom-implant-in-mass-extortion-campaign"
      - quote: "Organizations that suspect their Windchill servers were compromised should also change the LDAP manager password and other Windchill credentials, as they should be considered compromised."
        attribution: "ReliaQuest"
        source_url: "https://reliaquest.com/blog/clop-returns-with-custom-implant-in-mass-extortion-campaign"
    extended_notes: |
      Triage/detection framing: hunt for JSP files with recent modification timestamps under Windchill's codebase/login directories; grep web-server access logs for the literal header name X-windchill-req (any organisation running Windchill should treat its presence as a high-confidence compromise indicator, not just the specific eight-character value ReliaQuest observed, since the value itself may rotate across campaigns); watch for creation of flst.txt in application working directories; and treat any Windchill LDAP/service-account credential as compromised — requiring rotation, not just monitoring — once CVE-2026-12569 exploitation is suspected, per ReliaQuest's own remediation guidance. Benign-lookalike note: because the shell reuses Windchill's own MethodContext/WTConnection database-access classes, its DB traffic will NOT show up as an anomalous external database credential/connection in application-layer monitoring — the discriminator is the HTTP header and the JSP file artifact, not database-session anomaly detection.

