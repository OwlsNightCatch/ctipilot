    evidence:
      - quote: "Post /api/session/reset_password returning HTTP 400 followed by GET /api/user/current returning HTTP 200 indicates the instance was likely compromised."
        attribution: "VenariX"
        source_url: "https://venarix.com/blog/metabase-security-incident-downstream-impact-across-customer-environments"
