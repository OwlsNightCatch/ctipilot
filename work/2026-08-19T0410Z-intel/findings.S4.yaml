  - title: "CISA/FBI/HHS update the Medusa ransomware-as-a-service advisory: victim count crosses 500 (up from 300+ in March 2025), access-broker pricing detailed, healthcare disproportionately hit"
    sources:
      - { url: "https://cyberscoop.com/medusa-ransomware-tactics-cisa-advisory/", publisher: "CyberScoop", date: "2026-08-18", role: "primary" }
      - { url: "https://databreaches.net/2026/08/18/medusa-ransomware-tallies-hundreds-of-new-victims-says-updated-advisory-on-groups-tactics/", publisher: "DataBreaches.net (relaying Tim Starks/CyberScoop)", date: "2026-08-18", role: "corroborating" }
    discovery_trace: "first seen at: databreaches-net, URL https://databreaches.net/feed/ (RSS item published 2026-08-18T20:20:47Z) → primary: CyberScoop's own reporting on the updated joint advisory, URL https://cyberscoop.com/medusa-ransomware-tactics-cisa-advisory/ (the advisory itself at https://www.cisa.gov/news-events/cybersecurity-advisories/aa25-071a was unreachable this run — direct 403, bridge 403, jina reader pool exhausted on all 7 keys)"
    summary: |
      FBI, CISA and HHS updated the joint #StopRansomware Medusa advisory (AA25-071A) on 2026-08-18 with FBI investigative data through April 2026: the ransomware-as-a-service operation's confirmed victim count rose from 300+ (as of the original March 2025 advisory) to 500+ across medical, education, legal, insurance, technology and manufacturing sectors. The update details Medusa's shift toward paid initial-access brokers, who receive $100 to $1 million per set of valid corporate credentials, with the highest payouts reserved for brokers who work exclusively with Medusa affiliates — many of the same brokers sell access to multiple competing RaaS operations in parallel. Medusa affiliates favour opportunistic exploitation of recently disclosed vulnerabilities in internet-facing software (the advisory names Fortra GoAnywhere and BeyondTrust among historically exploited products) over developing zero-days, and the advisory states affiliates have weaponised newly announced exploits within 24 hours of disclosure and in some observed cases before public disclosure. Post-compromise tradecraft leans on living-off-the-land binaries, legitimate remote-administration tooling and RDP for lateral movement, credential access and staging, rather than bespoke malware. HHS joined as a co-author specifically because of Medusa's disproportionate and continuing impact on hospitals and public-health organisations. Medusa is deployed by multiple affiliate clusters; Microsoft Threat Intelligence has separately tracked a China-nexus affiliate, Storm-1175, using Medusa against healthcare, professional-services and finance targets in Australia, Britain and the United States before pivoting to a new strain (StormEncryptor) from 2 August 2026.
    region_nexus: "global RaaS operation with confirmed prior targeting of UK and Australian healthcare/professional-services/finance organisations via the Storm-1175 affiliate (e.g. HCRG Care Group, UK) — directly relevant to Swiss/EU healthcare and public-health defenders given the advisory's explicit HPH-sector emphasis"
    primary_sector_nexus: "direct"
    sector: "healthcare, education, legal, insurance, technology, manufacturing"
    cves: []
    techniques: [T1190, T1021.001, T1078, T1486]
