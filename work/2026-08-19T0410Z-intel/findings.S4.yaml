  - title: "Bridewell/BCON Collective: infostealer telemetry shows manufacturing absorbing 40% of confirmed UK critical-national-infrastructure victims in Q2 2026, with exposure preceding ransomware by weeks"
    sources:
      - { url: "https://www.bridewell.com/insights/blogs/detail/uk-cni-infostealer-threat-insights", publisher: "Bridewell (BCON Collective)", date: "2026-08-10", role: "primary" }
    discovery_trace: "first seen at: backlog task (three prior runs blocked on transport, entry-point https://industrialcyber.co/critical-infrastructure/bridewell-reports-infostealer-threat-to-uk-critical-infrastructure-sector/ which 403s every transport, corrected canonical slug found via WebSearch: https://industrialcyber.co/manufacturing/bridewell-reports-infostealer-threat-to-uk-critical-infrastructure-sector-as-manufacturing-takes-40-of-victims/, also 403/402 on every transport this run) → pivot: WebFetch https://www.bridewell.com/bcon-collective (BCON Collective landing page, listed the underlying blog post) → primary: Bridewell's own blog, URL https://www.bridewell.com/insights/blogs/detail/uk-cni-infostealer-threat-insights"
    summary: |
      Bridewell's BCON Collective threat-intelligence practice published Q2 2026 (April-June) infostealer-exposure telemetry for UK critical national infrastructure, built from Ransomware.Live PRO API and Hudson Rock stealer-log data. Methodology: a victim counts only with confirmed, non-zero infostealer telemetry (empty credential/detection fields excluded); exposure without a named family is bucketed as "Unknown Stealer" rather than dropped. Result: 10 confirmed UK CNI victim organisations spanning 13 distinct stealer families across 5 CNI sectors (averaging 3/month), totalling 1,355 credential detections. Manufacturing was the hardest-hit sector at 40% of victims, with the top three sectors together accounting for 80%. Named families included RedLine, Lumma, Raccoon, StealC and Vidar, but "Unknown Stealer" dominated at 278 detections (20.5%) despite no family attribution — Bridewell's point being that named-family visibility undercounts real exposure. One victim was linked to an actor Bridewell tracks as APT73 (publicly also known as Bashe, a self-styled "APT"-branded double-extortion ransomware/data-leak group, not a nation-state designation). The report's central defender-relevant claim: infostealer credential theft "frequently happens weeks or months before the ransomware payload is deployed," making infostealer telemetry (stealer-log marketplaces, corporate credential-exposure feeds) one of the most actionable pre-ransomware early-warning signals available to CNI defenders, and that "stolen session cookies remain usable until explicitly revoked" — patching or password rotation alone does not neutralise an exposure once session tokens have already been harvested.
    region_nexus: "UK critical national infrastructure; methodology and finding (infostealer exposure as a pre-ransomware early-warning signal, session-cookie persistence beyond password rotation) is directly transferable to Swiss/EU CNI operators in the same sectors (manufacturing-adjacent industrial/OT, and by extension energy, water, transport, healthcare, finance)"
