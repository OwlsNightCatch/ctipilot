      Detection/hunt framing for defenders: since Medusa affiliates rely on IAB-purchased valid credentials and RDP/LOLBin tradecraft rather than custom malware, the actionable telemetry classes are (1) authentication logs for anomalous/impossible-travel logons on accounts recently exposed in stealer-log or credential-marketplace feeds — ties directly into the Bridewell infostealer item above as an early-warning source; (2) RDP session establishment from unusual source hosts/geographies immediately following external-facing patch/CVE announcements (the advisory's 24-hour weaponisation window argues for accelerated patch-verification SLAs on GoAnywhere/BeyondTrust-class edge software); (3) HPH-sector organisations specifically should treat any newly disclosed, unpatched internet-facing vulnerability as a same-day Medusa exposure window, not a routine patch-cycle item.
