# Findings summary (machine-readable) — verification iteration 3 (Opus 5, cti-verification)
- code: F1
  category: analytical-link-as-fact
  section: entities-registry
  item: "entities/registry.yaml — malware:medusa (entity added by this run)"
  url_or_quote: "The agencies state affiliates exploit newly announced vulnerabilities within 24 hours and have been observed using exploits up to a week before public disclosure while developing no zero-day or N-day flaws of their own, buying access from initial-access brokers paid between $100 and $1 million with a premium for exclusivity"
  summary: >-
    Accumulated editing damage: iteration 1's F3 required the entry to stop presenting the initial-access-broker
    payments as the source of Medusa's exploit access, and the ENTRY was rewritten correctly ("The economics of
    *entry* are spelled out separately, and are not the same market as the exploit access above — these payments
    buy a way into a victim network, not a vulnerability"). The registry record created by the same run still
    carries the withdrawn construction: it chains "developing no zero-day or N-day flaws of their own, buying
    access from initial-access brokers", i.e. the broker purchases stand in for exploit development, and it omits
    the advisory's actual statement entirely. No cited source makes that link. The Record quotes the advisory as
    "obtain advanced access to exploits from unknown sources"; healthsystemCIO: "Advance access comes instead from
    sources the agencies could not identify." CyberScoop's $100–$1 million figure is for access brokers who sell
    entry into networks. The run record's iteration-1 remediation text lists only "title, headline, summary and
    body" as rewritten, so the registry was never in scope, and iteration 2's note wrongly claims it confirmed
    "the whole ransomware-advisory rewrite including the registry record". Fix: split the registry sentence the
    way the entry now does — exploit access from sources the agencies could not identify, and separately
    initial-access brokers paid $100–$1 million for network entry.
- code: F2
  category: claim-not-supported
  section: trending-vulnerabilities
  item: "2026-08-19/cve-2026-15748-forminator-forms-unauth-file-upload-rce"
  url_or_quote: "The researcher credited as daroo reported it through Wordfence's bug-bounty programme on 2026-07-14, the vendor acknowledged on 2026-07-20 and shipped 1.56.2 on 2026-07-31"
  summary: >-
    The bug-bounty report date is wrong and the sentence carries no inline citation. The cited Wordfence text
    (read from the entry's own malware.news syndication URL, saved at work/2026-08-19T0410Z-intel/raw/
    malwarenews-forminator.txt) gives the disclosure timeline as: "July 11, 2026 – We received the submission for
    the Unauthenticated Arbitrary File Upload vulnerability in Forminator Forms via the Wordfence Bug Bounty
    Program."; "July 14, 2026 – We validated the report and confirmed the proof-of-concept exploit."; "July 14,
    2026 – Full disclosure details were sent instantly to the vendor through our Wordfence Vulnerability
    Management Portal." So 2026-07-11 is when the researcher reported through the programme and 2026-07-14 is
    Wordfence's validation and its disclosure to the vendor. The sibling User Profile Builder entry states the
    same two-step shape correctly after iteration 1's F14 fix ("reported through Wordfence's bug-bounty programme
    on 2026-07-14 ... with full disclosure details provided to Cozmoslabs on 2026-07-15"); the Forminator entry
    retains the conflation. The 2026-07-20 vendor acknowledgement and 2026-07-31 release are both correct.
    Fix: report received via the bug-bounty programme 2026-07-11, full disclosure to the vendor 2026-07-14, and
    cite the malware.news URL on the sentence.
- code: F3
  category: hallucinated-fact
  section: run-record
  item: "runs/2026-08-19/2026-08-19T0410Z-intel.md § Verification & coverage notes"
  url_or_quote: "In both cases the several publishers relay one assessor, so both sets of entries carry a credibility of 2 rather than 1."
  summary: >-
    The published run record asserts a fact about its own entries that the shipped files contradict — the same
    class of bookkeeping defect iteration 2 caught. The sentence's "both cases" are the Medusa advisory and the
    Wordfence blog. The two Wordfence entries do carry credibility 2, but
    entries/2026-08-19/medusa-raas-advisory-update-24-hour-weaponisation.md carries "classification:
    {reliability: B, credibility: 1}". Iteration 1 examined this rating deliberately and upheld it — its report
    states "For contrast, the Medusa entry's B/1 IS defensible: two editorially independent journalists each read
    and quoted the same primary" and "should be left alone" — so the rating is not the thing to change and
    re-lowering it would be a flip-flop. The run record's prose is the defect. Fix: reword so the credibility-2
    statement covers only the Wordfence-sourced entries, and state the Medusa entry's credibility 1 with the
    reason iteration 1 gave (two editorially independent reads of the primary).
- code: F4
  category: quantifier-without-source
  section: trending-vulnerabilities
  item: "2026-08-19/cve-2026-15748-forminator-forms-unauth-file-upload-rce"
  url_or_quote: "the root cause went public three weeks after the patch (CVSS 9.8)  [title]  /  \"Wordfence published the technical write-up for CVE-2026-15748 on 2026-08-17, three weeks after the fix shipped\"  [body]"
  summary: >-
    A numeric interval no cited source states and that the entry's own dates contradict. The entry itself gives
    the patch as 1.56.2 on 2026-07-31 (confirmed in the cited Wordfence text: "July 31, 2026 – The fully patched
    version of the plugin, 1.56.2, was released.") and the write-up as 2026-08-17 (the malware.news dateline
    reads "August 17, 2026, 5:15pm"). That is 17 days — two and a half weeks, not three. The claim sits in the
    title, which is the most-read field, and is trivially checkable by any reader. Fix: "seventeen days after the
    patch" or "two and a half weeks", in both the title and the body.
- code: F5
  category: editorial-advisory
  section: trending-vulnerabilities
  item: "2026-08-19/cve-2026-55040-sharepoint-kev-exploitation-confirmed"
  url_or_quote: "the vendor rates the flaw Critical at CVSS 9.1 and assesses exploitation as more likely, but has published no revision since 14 July. That is the second Microsoft CVE in this catalogue update where the vendor's exploitability field and the catalogue disagree"
  summary: >-
    Advisory — internally muddled pointer, no false fact. Both statements are individually correct against the
    Microsoft advisory API record saved at raw/msrc.CVE-2026-55040.json ("exploited": "No",
    "latestSoftwareRelease": "Exploitation More Likely"), but naming "the vendor's exploitability field" as the
    disagreeing one lands one clause after telling the reader the vendor assesses exploitation as MORE likely —
    which agrees with the catalogue. What disagrees here is the `exploited` field. In the sibling IKEEXT entry the
    exploitability assessment genuinely is the disagreeing field ("Exploitation Less Likely", verified in
    raw/msrc.CVE-2026-33824.json), so the shared phrasing fits one entry and not the other. A triage engineer
    keying on a named MSRC field is pointed at the wrong one. Suggested wording: "where the vendor's own
    exploited flag and the catalogue disagree".
- code: F6
  category: editorial-advisory
  section: threat-activity
  item: "2026-08-19/purpledelta-dprk-it-worker-facilitator-rmm-detection (summary) + entities/registry.yaml actor:purpledelta"
  url_or_quote: "running at least 22 fabricated personas built from AI-generated photos, illicit identity documents and purpose-configured chatbot assistants"
  summary: >-
    Advisory — a preserved-hedge entry drops one hedge. Insikt's own sentence (raw/purpledelta.txt) is "PurpleDelta
    operators maintained at least 22 fabricated personas across multiple clusters, SOME OF WHICH were supported by
    AI-generated profile photos, custom-configured ChatGPT assistants, and identity documents sourced from an
    illicit ID-generation service". The summary and the registry record both generalise "some of which were
    supported by" into all 22 being "built from" / "supported by" those artifacts. The body avoids the
    over-generalisation, and the entry's sourcing note makes a point of preserving Insikt's other hedges, which is
    why this one stands out. Low operational impact; fix by restoring "some of them supported by".
- code: F7
  category: editorial-advisory
  section: deep-dive
  item: "2026-08-19/clop-windchill-custom-implant-reverse-engineered"
  url_or_quote: "\"its queries run under the application's existing database identity rather than through a separately configured attacker account\""
  summary: >-
    Advisory — the only inline quotation in the run that is not a literal substring of its source. ReliaQuest's
    page (raw/reliaquest.txt) reads "meaning its queries run under the application’s existing database identity
    rather than through a separately configured attacker account" with a right single quotation mark (U+2019) in
    "application’s"; the entry renders a straight apostrophe (U+0027). No semantic change, and every entry's
    evidence[] quote across all eleven entries checked clean. Worth naming only because the run record's notes
    claim "Every quotation in every entry this run was literal-substring-checked against the retrieved page body
    before the entry was composed" — this one falsifies that claim. Fix either the character or the claim.
