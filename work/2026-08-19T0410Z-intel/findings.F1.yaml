      IMPORTANT FOR COMPOSITION: the AA25-071A advisory itself (cisa.gov) could NOT be directly reached this run despite the full ladder (WebFetch 403, bridge cisa-page/cisa-feed both fall back to a jina reader that is fully credit-exhausted across all 7 keys with HTTP 402, and web.archive.org is categorically refused by WebFetch with a direct-bridge TLS reset). However, TWO editorially independent outlets each read and quoted the advisory directly and both link to https://www.cisa.gov/news-events/cybersecurity-advisories/aa25-071a inline: CyberScoop (Tim Starks) and The Record/Recorded Future News (Jonathan Greig) — confirmed via raw-body extraction that The Record's article makes no reference to CyberScoop anywhere in its text, so this is NOT the DataBreaches.net-relays-CyberScoop pattern the assignment flagged as disqualifying. A third outlet, healthsystemcio.com (Anthony Guerra), independently confirms the HHS co-sealer angle and the BeyondTrust dating, also citing federal sources directly. This clears the two-independent-source bar on the strength of quote-level corroboration even though the advisory's own HTML could not be fetched by this agent — verification is MULTI-SOURCE, not SINGLE-SOURCE-NATIONAL-CERT, because it rests on two independent journalists' direct quotations rather than this agent's own read of the primary. CVE-2025-10035 and CVE-2026-1731 were corroborated independently via WebSearch against vendor/CERT reporting (Rapid7, Unit42, Canadian Centre for Cyber Security AL26-003, BleepingComputer) rather than pulled from the advisory text itself — flag as "named in the advisory per secondary reporting, CVE numbers independently verified" rather than "advisory states CVE-2025-10035" verbatim.
      Detection: telemetry class is authentication/session logs plus EDR process-creation telemetry — presence of a second/unauthorized RMM client (AnyDesk, Atera, ConnectWise, eHorus, N-able, BeyondTrust, SimpleHelp, Splashtop) installed alongside a sanctioned one, or any of these tools appearing on a host with no change-management ticket, is the discriminator; RDP session logs (4624 Logon Type 10) to unusual internal destinations shortly after a public-facing service exploit event on the same host is the lateral-movement correlation. Hardening: given the advisory's own emphasis on sub-24-hour and pre-disclosure weaponization of internet-facing-service flaws, patch SLA for internet-exposed management/file-transfer software (the GoAnywhere/BeyondTrust pattern) needs to be measured in hours, not the standard patch-cycle window; RMM allow-listing (deny by default, allow only the organization's sanctioned tool) directly closes the persistence/evasion vector named in the advisory.
    borderline: false

  - title: "WordPress plugin disclosures: Forminator Forms arbitrary-file-upload RCE and User Profile Builder absint()/WP_Error type-confusion admin takeover — both confirmed unauthenticated, pre-auth CVSS 9.8; Royal Elementor Addons flaws confirmed Contributor-authenticated only"
    sources:
      - { url: "https://thehackernews.com/2026/08/forminator-wordpress-flaw-can-enable.html", publisher: "The Hacker News, quoting Wordfence directly", date: "2026-08-17", role: "primary-corroborating" }
      - { url: "https://malware.news/t/600-000-wordpress-sites-affected-by-arbitrary-file-upload-vulnerability-in-forminator-forms-wordpress-plugin/124864", publisher: "malware.news (verbatim RSS syndication of the Wordfence Intelligence blog post)", date: "2026-08-17", role: "primary-mirror" }
      - { url: "https://malware.news/t/40-000-wordpress-sites-affected-by-authentication-bypass-vulnerability-in-user-profile-builder-wordpress-plugin/124811", publisher: "malware.news (verbatim RSS syndication of the Wordfence Intelligence blog post)", date: "2026-08-14", role: "primary-mirror" }
      - { url: "https://security-hub.ncsc.admin.ch/#/posts/12860", publisher: "NCSC-CH Security Hub", date: "2026-08-18", role: "corroborating-national-cert" }
      - { url: "https://api.wordpress.org/plugins/info/1.0/profile-builder.json", publisher: "WordPress.org Plugin Directory (official API)", date: "2026-08-18", role: "corroborating" }
    discovery_trace: "first seen at: prior triage hand-off (already covered generally by S1; User Profile Builder's exact mechanism was flagged as unsourced) → re-attempted direct Wordfence fetch, both blog-post URLs → WebFetch returned empty content and the bridge got upstream HTTP 202 (anti-bot async-challenge shell) with jina fully credit-exhausted on both → pivot: The Hacker News, URL https://thehackernews.com/2026/08/forminator-wordpress-flaw-can-enable.html, quotes Wordfence directly for BOTH CVEs including the exact User Profile Builder mechanism → corroboration/near-primary: WebSearch (\"malware.news Forminator Forms arbitrary file upload wordfence daroo bounty\") and a parallel search for the User Profile Builder post located malware.news mirrors at /t/600-000-.../124864 and /t/40-000-.../124811, both confirmed via raw-body fetch to be verbatim RSS syndications of the actual Wordfence Intelligence blog posts (identical function names, dollar bounty figures, researcher aliases, and direct links back to wordfence.com/threat-intel/vulnerabilities/... database entries) → cross-checked against NVD's Wordfence-sourced (security@wordfence.com) CVE records for CVE-2026-15748 and CVE-2026-15826, which carry the identical technical description verbatim → cross-checked plugin version history via https://api.wordpress.org/plugins/info/1.0/profile-builder.json, confirming versions 3.16.5/3.16.6 exist in the release train → NCSC-CH advisory (post 12860) bundles all four CVEs and links the exact Wordfence vulnerability-database URLs for each."
    summary: |
      CVE-2026-15748 (Forminator Forms, WPMU DEV, 600,000+ installs, CVSS 3.1 9.8, assigned by Wordfence acting as CNA — security@wordfence.com): Wordfence's own description, corroborated verbatim on NVD and via a full-text malware.news mirror of the original blog post: "The Forminator Forms plugin for WordPress is vulnerable to Arbitrary File Upload in all versions up to, and including, 1.56.1 via the handle_file_upload function. This is due to insufficient file type validation in handle_file_upload, where the dangerous-extension blocklist performs exact-key matching that is bypassed by pipe-alternative MIME type keys, combined with a public submission handler that trusts attacker-controlled upload field configuration injected via a forged Select field value." The precondition is that the target form contains BOTH a File Upload field and a Select field — the forged Select-field value is what lets the attacker override the upload's allowed-type configuration at submission time. Notably, Wordfence adds a secondary detail on impact: in a default configuration uploaded files land in a directory protected by an `.htaccess` file blocking PHP execution, but if an admin has configured a Custom File Upload Storage root, that directory can end up WITHOUT the `.htaccess` protection because it is only created on first use during a frontend request where WordPress's own `.htaccess`-writing helper is not loaded — meaning some misconfigurations skip the built-in mitigation entirely. Timeline (from the full-text Wordfence mirror): reported by researcher "daroo" via the Wordfence Bug Bounty Program on 2026-07-14 (validated same day, $2,048 bounty), disclosed to the Forminator/WPMU DEV team same day, vendor acknowledged 2026-07-20, patch (1.56.2) released 2026-07-31, public write-up 2026-08-17. Wordfence does not report any observed exploitation attempts or blocked attacks in the wild for this CVE. CVE-2026-15826 (User Profile Builder, Cozmoslabs, 40,000+ installs, CVSS 3.1 9.8, also security@wordfence.com): the exact mechanism, previously unsourced, is now confirmed via a full-text Wordfence mirror plus NVD's identical Wordfence-sourced description and corroborated independently by The Hacker News quoting Wordfence directly: "This is due to the wppb_log_in_user() function calling absint() on the return value of wp_insert_user() before performing an is_wp_error() check — when a registration is submitted with a 61–70 character username, WordPress core rejects it with a WP_Error object, but absint() coerces that object to the integer 1 before the error check can short-circuit execution, causing the plugin to bind and return a transient-backed autologin nonce tied to user ID 1." This is a genuine type-confusion bug (a PHP object silently coerced to an integer by `absint()`), and the earlier characterization of it as reachable "via the username parameter" is correct — the trigger is a crafted 61–70 character username at registration — but an important precondition was previously missing: it is "only exploitable on sites where the plugin's Automatically Log In setting is enabled." Timeline: reported by researcher "Supakiad S." (alias m3ez) via the Wordfence Bug Bounty Program on 2026-07-14, validated 2026-07-15 ($975 bounty), full disclosure sent to Cozmoslabs same day, vendor acknowledged and patched (3.16.5) 2026-07-16, public write-up 2026-08-14 — i.e. this CVE's own disclosure predates Forminator's by three days, consistent with The Hacker News framing Forminator as coming "days after" this one. No observed in-the-wild exploitation is reported for this CVE either. Both fixed versions (3.16.5, and successor 3.16.6) are confirmed present in the plugin's official release history via the WordPress.org plugin API. NCSC-CH's advisory (post 12860, published 2026-08-18T11:26:32Z) bundles all four CVEs, explicitly states "Current exploitation status: UNKNOWN" for the set, and separately confirms the Royal Elementor Addons preconditions: CVE-2026-17123 (SSRF via the Form Builder widget's `webhook_url` setting, CVSS 8.8) and CVE-2026-19217 (stored XSS via an unvalidated widget setting used in HTML output, CVSS 5.4 per NVD / 6.4 per NCSC-CH's own scoring) BOTH require Contributor-level WordPress access or higher — confirmed independently via NVD's CVSS vector strings for both (PR:L in both cases: `CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H` for the SSRF, `CVSS:3.1/AV:N/AC:L/PR:L/UI:R/S:C/C:L/I:L/A:N` for the XSS). One added technical nuance on the SSRF: NVD's own description notes the vulnerable AJAX handler (`wpr_form_builder_webhook`) is "registered for both authenticated and unauthenticated callers," but the write primitive that plants the malicious webhook URL (the widget's `render()` method) still requires Contributor-level access to preview a draft — so the overall attack chain remains gated on Contributor+ access despite that one handler's looser registration.
    region_nexus: "global; WordPress-based public-sector and SME websites in Switzerland/EU commonly run these form/profile/page-builder plugins"
