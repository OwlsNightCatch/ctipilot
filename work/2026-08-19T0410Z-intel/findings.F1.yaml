  - title: "PurpleDelta: Insikt Group profiles a North Korean IT-worker fraud cluster running deepfake-assisted interviews, AI resume/persona tooling, and RMM-based laptop takeover across 1,100+ targeted employers"
    sources:
      - { url: "https://www.recordedfuture.com/research/purpledelta-fraudulent-employment-operations", publisher: "Recorded Future / Insikt Group", date: "2026-08-18", role: "primary" }
    discovery_trace: "first seen at: prior triage hand-off (already cleared for publication) → re-fetched primary: Recorded Future / Insikt Group, URL https://www.recordedfuture.com/research/purpledelta-fraudulent-employment-operations (confirmed publish date 2026-08-18 via page metadata) → checked for independent second read: WebSearch (\"PurpleDelta Recorded Future North Korean IT worker report\") surfaced only Recorded Future's own prior PurpleBravo report, a malware.news RSS mirror (not independent analysis), and an unrelated therecord.media article on Okta's separate research from 2025-09-30 that does not cover this PurpleDelta report at all — confirmed by direct WebFetch of that article. No editorially independent second reader of this specific report was found as of this run."
    summary: |
      Insikt Group published "PurpleDelta's Fraudulent Employment Operations" on 2026-08-18, its designation for a North Korean state-directed IT-worker fraud cluster. The dataset covers one cluster's activity "between late 2024 and early 2025," with the report stating multiple such clusters have been tracked "since 2025"; Insikt does not disclose its collection methodology beyond citing artifacts it directly reviewed — recorded video sessions, Google Sheets/Calendar tracking artifacts, Slack workspace content, and device forensics from what Insikt assesses was the threat actor's own accidental self-infection. Insikt states as fact, without hedged confidence language, that "PurpleDelta" (its own designation) "overlaps with threat actor designations used by other vendors, including Jasper Sleet, UNC5267, Wagemole, and Famous Chollima" — i.e., Insikt presents this as different vendors' names for the same broader North Korean IT-worker phenomenon rather than a confidence-qualified attribution claim. Separately, and explicitly hedged, Insikt reports "signs of overlap" with "PurpleBravo" (a related, malware-deploying North Korean cluster Insikt tracks separately, targeting cryptocurrency-sector developers), describing this only as "indicating the broader potential" for downstream compromise — not a firm claim of operational unity. Defender-relevant tradecraft directly observed: operators recorded internal company meetings and job interviews using iTop Screen Recorder plus Krisp/Caption.Ed for call transcription, fed transcribed interview questions into custom-configured ChatGPT assistants and read back the answers verbatim (sometimes visibly wrong, indicating limited subject-matter grasp); a network-monitoring tool called NetProvider was observed on an operator's own machine alerting them to unusually high traffic during a live interview call, implying operator-side network self-monitoring; facilitators who physically hold the employer-issued laptop maintain operator access via AnyDesk, Google Chrome Remote Desktop, Jump Desktop, and RealVNC, with Astrill VPN (marketed for circumventing China's firewall) used consistently for connectivity. Personas are built from AI-generated profile photos (insertFace.com, a face-swap service), fabricated ID documents from a paid identity-document generator (TrustID Card, trustidcard[.]com), credentials/identities acquired via infostealer-log-selling Telegram channels, faked GitHub contribution graphs, and multi-account browser tooling (Wavebox) with Android emulation (MEmu) for platform-specific verification steps. Of 1,100+ companies one cluster applied to, ~41% were software/SaaS, ~26% staffing/consulting, ~10% healthcare/biotech, ~80% headquartered in North America; Insikt assesses the operators have "a nexus in Shenyang, China" from calendar and profile artifacts. Insikt hedges the actual-hire count throughout — "highly likely to have been actively employed by at least ten organizations," "confirmed or probable placements" — and does not give an exact confirmed number; one operator was seen managing at least two simultaneously-employed/interviewing personas ("Patrick" at an AI company, "Michael Brown" interviewing elsewhere) in a single recorded session, and job-interview/meeting time overlaps for different personas were directly observed. Insikt's own recommendations distinguish clearly detectable technical measures from generic HR policy: under a "Technical Measures" heading it separately recommends port-checking to detect desktop-sharing/VPN remote access, RMM software allow/deny-listing (flagging any second, unauthorized RMM tool found alongside a sanctioned one), insider-threat monitoring software on company devices, and regular geolocation of company laptops against claimed login locations — all distinct from its separate "Pre-Employment"/"Financial Precautions"/"Communication and Work Practices" HR-process advice (background checks, document-consistency checks, payment verification).
    region_nexus: "global; ~80% of targeted employers are North American, but Insikt states operators applied to companies in every region including Europe — directly relevant to any organization (including Swiss/EU public-sector and critical-infrastructure bodies) hiring remote technical staff"
