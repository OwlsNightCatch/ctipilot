        attribution: "Wordfence"
        source_url: "https://malware.news/t/40-000-wordpress-sites-affected-by-authentication-bypass-vulnerability-in-user-profile-builder-wordpress-plugin/124811"
    extended_notes: |
      IMPORTANT FOR COMPOSITION: wordfence.com itself was unreachable on every transport this run (WebFetch returned empty content on both blog-post URLs; the direct bridge got an HTTP 202 anti-bot async-challenge shell with no body; jina is fully credit-exhausted at 7/7 keys HTTP 402). The malware.news URLs cited above are confirmed, via raw-body fetch, to be verbatim RSS syndications of the actual Wordfence Intelligence posts — not summaries or third-party rewrites — carrying identical function names, dollar bounty figures, researcher aliases, dates, and direct outbound links back to the real wordfence.com/threat-intel/vulnerabilities/... database entries (e.g. .../profile-builder/user-profile-builder-3164-unauthenticated-authentication-bypass-via-type-confusion-to-administrator-account-takeover-via-username-parameter, named explicitly in the NCSC-CH advisory's own References section). Text is additionally cross-verified verbatim against NVD's CVE record for both CVEs, sourced from security@wordfence.com (Wordfence acting as CNA) — the description text on NVD is character-for-character identical to the mirror. Treat the malware.news URLs as a corroborated-primary-equivalent, not as ordinary news commentary, when composing the entry; if the pipeline's citation-discipline gate rejects malware.news as a link category, cite The Hacker News (which quotes Wordfence directly with matching text) as the primary instead and use the malware.news fetch only as the verification basis noted here.
      CVSS assignment: both Forminator (CVE-2026-15748) and User Profile Builder (CVE-2026-15826) show `security@wordfence.com` as the NVD sourceIdentifier — Wordfence is the assigning CNA for both, score 9.8, vector CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H (unauthenticated, no privileges, no user interaction, full C/I/A impact) for both.
      Royal Elementor Addons CONFIRMED authenticated-only: CVE-2026-17123 (SSRF, CVSS 8.8, vector CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H) and CVE-2026-19217 (stored XSS, CVSS 5.4, vector CVSS:3.1/AV:N/AC:L/PR:L/UI:R/S:C/C:L/I:L/A:N) both carry PR:L (Contributor-level or above) per NVD — correctly droppable/lower-priority as routine authenticated-only patch-cycle items relative to the two unauthenticated pre-auth 9.8s.
      Detection: telemetry class is web-server access logs — for Forminator, POST requests to the plugin's public submission handler carrying a multipart file upload alongside a Select-field value that does not match any value actually configured in the form (the forged-configuration indicator), followed by a GET to a newly created file with a `.php`/executable extension under a custom (non-default) upload storage path — the `.htaccess`-gap detail above means a custom upload root is the highest-risk configuration to audit first. For User Profile Builder, a registration POST with a 61–70 character username immediately followed by autologin/session-cookie issuance for user ID 1 with no corresponding email-verification-click event is the discriminator (only relevant on sites with "Automatically Log In after Registration" enabled — check this setting first before treating the CVE as applicable). Hardening: Forminator Forms >= 1.56.2, User Profile Builder >= 3.16.5 (3.16.6/4.0.0 superseding), Royal Elementor Addons >= 1.7.1065; sites that cannot immediately patch Forminator should remove File-Upload+Select field combinations, and sites running User Profile Builder should disable "Automatically Log In after Registration" as an interim mitigation.
