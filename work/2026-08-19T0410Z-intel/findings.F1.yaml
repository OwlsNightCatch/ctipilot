    extended_notes: |
      IMPORTANT FOR COMPOSITION: this item is SINGLE-SOURCE (Check Point Research is a private vendor research team, not a national-CERT carve-out entity) — a second, editorially independent read of the underlying research could not be found despite two WebSearch passes; the only other hit is Check Point's own corporate blog restating its own research. Flag per verification policy; confidence set to MEDIUM rather than HIGH on that basis despite the depth of Check Point's own technical evidence (hashes, screenshots, dual chat captures for every named component).
      Do NOT let the entry imply a specific initial-WordPress-compromise vector (no plugin CVE, no credential-theft method) — Check Point states only that outdated WordPress/plugin installations are the general precondition; the one specific example scan found ~40 issues on a 5-year-old install without confirming which one was actually the intrusion vector.
      Detection: telemetry class is web-server access/error logs for POST requests to a `wp-json/<custom-namespace>/v1/upload`-shaped REST route not registered by any known plugin, especially followed by GET requests to newly created `.php` files under the WordPress root outside the plugin/theme directories — the MU-plugin mechanism (`wp-content/mu-plugins/`) itself is a discriminator worth an integrity/file-monitoring baseline since MU plugins do not appear in the standard wp-admin Plugins UI and are commonly abused for exactly this kind of stealth persistence. For endpoint telemetry: PowerShell process-creation events (Sysmon EID 1) with `-w hidden -ep bypass` and `IEX(New-Object Net.WebClient).DownloadString(...)` in the command line, launched with no parent other than a browser process (clipboard-paste execution pattern, ClickFix / T1204.004) is the discriminator vs. legitimate PowerShell automation, which is not typically launched by a user pasting into a Run dialog immediately after visiting a website. Hardening: keep WordPress core and all plugins current (Check Point's own stated root cause); periodically diff `wp-content/mu-plugins/` against a known-good baseline since MU plugins bypass the normal plugin-management UI.
