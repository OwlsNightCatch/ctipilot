        attribution: "Recorded Future / Insikt Group"
        source_url: "https://www.recordedfuture.com/research/purpledelta-fraudulent-employment-operations"
    extended_notes: |
      IMPORTANT FOR COMPOSITION: SINGLE-SOURCE — Recorded Future/Insikt is a Tier-1 research vendor but no editorially independent second read of this specific report was found (checked therecord.media, which under the same parent company published a DIFFERENT, unrelated 2025-09-30 article on Okta's own North Korea IT-worker research — confirmed by direct fetch that it does not reference or corroborate this PurpleDelta report). Do NOT upgrade the Jasper Sleet/UNC5267/Wagemole/Famous Chollima overlap into a firm cross-vendor attribution claim in the entry body — Insikt states it as a naming-overlap fact about its own designation, not as an independently-confirmed joint assessment with those other vendors, and the PurpleBravo connection is explicitly hedged ("signs of overlap," "indicating the broader potential") and must stay hedged in the entry.
      Detection: telemetry class is endpoint EDR / conditional-access session logs on company-issued hardware — a second, unauthorized remote-access or screen-recording client (AnyDesk/Chrome Remote Desktop/Jump Desktop/RealVNC alongside a company's sanctioned RMM tool, or iTop Screen Recorder/Krisp with no legitimate call-recording policy) is the discriminator; legitimate employee RMM/monitoring usage is singular and policy-sanctioned, whereas a second unauthorized tool co-resident with the sanctioned one is anomalous. Identity/HR telemetry: geolocation of VPN/RDP session source against the employee's claimed on-file address, and commercial-VPN usage (Astrill VPN specifically named) on a company network are stated as verifiable technical discriminators, not just policy advice.
