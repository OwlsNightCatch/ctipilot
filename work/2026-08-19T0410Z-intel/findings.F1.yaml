  - title: "CISA/FBI/HHS update the Medusa ransomware joint advisory (AA25-071A): victim count crosses 500, affiliates weaponize disclosed flaws within 24 hours and up to a week pre-disclosure, HHS added as healthcare-sector co-sealer"
    sources:
      - { url: "https://cyberscoop.com/medusa-ransomware-tactics-cisa-advisory/", publisher: "CyberScoop (Tim Starks)", date: "2026-08-18", role: "primary-corroborating" }
