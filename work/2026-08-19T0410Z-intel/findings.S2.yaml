    summary: |
      This is a same-proceeding delta on the entry published 2026-08-18 for the Zurich District Court trial of a
      52-year-old Ukrainian software developer charged over the LockerGoga/MegaCortex/Nefilim ransomware operation
      (Stadler Rail, Meier Tobler, Crealogix, IHI Ionbond among the named Swiss victims). Six facts from the same
      2026-08-17 hearing day were not captured in the original entry and are new here: (1) the court will announce
      its verdict on 2026-09-10, not immediately; (2) the defense sought full acquittal, arguing the seized data
      carriers should be ruled inadmissible because the defendant was not properly informed of his Siegelung
      (evidence-sealing) rights during the house search, and separately argued that assigning him the "unique and
      irreplaceable" developer role the prosecution alleges contradicts the normally compartmentalised division of
      labour in ransomware operations; (3) the defendant personally denied all charges in court, stating he never
      developed malware or took part in any attack and that the source code and cryptocurrency found on his devices
      came from consulting work for an unnamed IT-security client; (4) the prosecution's closing argument
      characterised the ransomware campaign as consistent with a Russian state strategy of tolerating or facilitating
      criminal hacking against Western targets because criminal and state interests overlap; (5) the prosecution
      named the alleged principal behind the defendant, Ukrainian national Oleksandr Ieremenko, said to have operated
      from Moscow under an FSB cover identity and to have been the subject of a USD 1 million US bounty; (6) Ieremenko
      is reported to have died in Moscow in a "window fall" in February 2022 under circumstances multiple outlets
      describe as unclarified, with press speculation (relayed, not confirmed) that the death may have been staged.
      The prosecution additionally seeks confiscation of at least CHF 490,000 in seized cryptocurrency or CHF 1.8
      million in the alternative, on top of the twelve-year prison term and twelve-year entry ban already reported.
      Every attribution and role claim here is the prosecution's own courtroom argument in a contested trial the
      defendant is actively disputing — none of it is an independent finding, and no source claims otherwise.
