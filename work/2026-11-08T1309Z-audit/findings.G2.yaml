  - title: "Federal Administrative Court confirms the data-breach duty to inform data subjects of an online-shop operator (SkySale / apfelkiste.ch); later technical fixes do not remove it and public notice is allowed where the persons can no longer be identified (EDÖB, 2026-11-06)"
    novelty: new
    borderline: true
    borderline_reason: >
      Regulator-published confirmation (final judgment of 2026-04-08) of an existing revDSG breach-notification duty, a private-sector case. It matters to
      federal bodies' incident playbooks (the duty to inform the persons concerned survives remediation) but changes no obligation or deadline, and the pipeline
      dropped the comparable EFK, Federal Supreme Court and bodycam items this week as 'no obligation change'. Hold unless the audit treats notification-duty
      case law as in scope.
    sources:
      - { url: "https://www.edoeb.admin.ch/de/datensicherheitsverletzung-bundesverwaltungsgericht-bestaetigt-informationspflicht-der-onlineshop-betreiberin", publisher: "EDÖB / FDPIC, press release", date: "2026-11-06", role: "primary" }
    discovery_trace: >
      first seen at: edoeb-ch-press via the sitemap recipe, URL https://www.edoeb.admin.ch/sitemap/de.xml (index ~251) -> extract of the page
      (frontmatter date 2026-11-06) -> primary (no pivot needed). The BVGer judgment itself was not read.
    summary: |
      The EDÖB reports that the Federal Administrative Court, by judgment of 2026-04-08 (final), dismissed SkySale Schweiz GmbH's appeal against the EDÖB's
      order of 2024-05-28 that, after a data-security breach, the persons concerned must be informed within 10 days of the order becoming final. The court held that
      technical measures taken afterwards to remedy the breach change nothing about the duty and, because SkySale could no longer identify the persons
      concerned as a result of those measures, the information may take the form of a public announcement. The order will be published once the publication order
      is final. Operational reading for IR: remediation steps that destroy the ability to identify affected persons (log rotation, rebuilds) do not release the
      controller from the notification duty and push it toward public notice.
    region_nexus: "switzerland (federal data-protection law)"
    primary_sector_nexus: "indirect"
    sector: "public-sector (federal bodies are controllers under the same Act), general"
