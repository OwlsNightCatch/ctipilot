  - title: "ARTEX: CERT-EU says it observed AI-driven activity against its own constituency that 'highly likely' used ARTEX, and BACS's GovCERT co-head says no autonomous-AI-agent intrusion has been reported to BACS"
    update_target: "2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse"
    update_type: "improvement (government-CERT corroboration, Swiss calibration)"
    borderline: true
    borderline_reason: >
      Corroboration of an already well-covered tool (six store entries mention ARTEX; GTIG, Microsoft, CrowdStrike, Recorded Future); the Swiss calibration is a
      conference remark relayed by a trade outlet. Worth a short improvement record for the constituency angle only if the audit judges
      government-CERT corroboration and the Swiss absence statement decision-relevant.
    sources:
      - { url: "https://cert.europa.eu/blog/from-penetration-testing-to-cyber-threat-beware-of-artex", publisher: "CERT-EU", date: "2026-11-05", role: "primary" }
      - { url: "https://www.netzwoche.ch/news/2026-11-02/wie-it-lieferketten-und-insider-zur-gefahr-werden-koennen", publisher: "Netzwoche (Gohack26 report, remarks by BACS GovCERT co-head Roman Hüssy, event 2026-10-29/30)", date: "2026-11-02", role: "corroborating (for the BACS statement, single outlet)" }
    discovery_trace: >
      first seen at: cert-eu-blog, URL https://cert.europa.eu/blog (extract; first paragraph) -> url --direct listing for the href
      /blog/from-penetration-testing-to-cyber-threat-beware-of-artex -> extract of the post (date 2026-11-05);
      Netzwoche: tag listing https://www.netzwoche.ch/tags/cybersicherheit -> extract of the 2026-11-02 article.
    summary: |
      CERT-EU (Union institutions' CERT; Admiralty A for its own observations) says that in recent weeks it saw several threat actors worldwide use
      ARTEX to automate their campaigns, that it saw "similar instances of AI-driven activities against its constituency" which "highly likely"
      involved ARTEX, and assesses that ARTEX's public availability will likely accelerate adoption. It names the original author's withdrawal of the
      repository in October 2026 (public versions are independent forks, integrations differ per fork), maps the activity to T1595 Active
      Scanning, T1588.002 Obtain Capabilities: Tool and T1190 Exploit Public-Facing Application, and recommends limiting internet exposure, isolating
      management panels, emergency-patching internet-exposed assets, hunting for automated scanning patterns, sanitising error responses, and keeping
      non-severe findings in the remediation cycle so AI tooling cannot chain them. Separately, Netzwoche reports that at Gohack26 (2026-10-29/30)
      Roman Hüssy, co-head GovCERT at BACS, said BACS has so far had no reported case in which autonomous AI agents hacked anyone, that AI makes attacks easier
      and more convincing and that supplier and IT-service-provider compromises remain an attack surface customers can protect against only to a limited
      degree. The existing ARTEX entries carry neither statement.
