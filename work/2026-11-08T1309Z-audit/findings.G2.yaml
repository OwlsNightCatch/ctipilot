  - title: "Publica / PK Softech: BPK's own letter says ransomware was installed on 2026-09-29 (T1486 not mapped), BPK says it does not know whether its insured persons' data left, and Publica and PKZH refreshed their notices on 2026-11-06 and 2026-11-03"
    update_target: "2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow"
    update_type: "improvement (technique mapping, dates) plus correction (BPK wording)"
    sources:
      - { url: "https://bpk.ch/hauptnavigation/cybervorfall", publisher: "Bernische Pensionskasse (BPK), notice page with letters of 14, 15, 20 and 30 October 2026", date: "2026-10-30", role: "primary" }
      - { url: "https://www.publica.ch/de/cyberangriff-auf-softwarelieferanten", publisher: "Publica (Pensionskasse des Bundes), status page 'Stand: 6.11.2026'", date: "2026-11-06", role: "primary" }
      - { url: "https://www.pkzh.ch/de/aktuelles/cyberangriff-softech.html", publisher: "Pensionskasse Stadt Zürich (PKZH)", date: "2026-11-03", role: "primary" }
      - { url: "https://pksoftech.ch/de/newsreader/Cyberangriff-auf-die-PKSoftechAG", publisher: "PK Softech AG", date: "2026-10-08", role: "primary (re-read, unchanged)" }
    discovery_trace: >
      first seen at: WebSearch ("Publica PK Softech Datenabfluss Akira neue Erkenntnisse November 2026") returned nothing newer than October
      -> fetched primaries directly: extract https://www.publica.ch/de/cyberangriff-auf-softwarelieferanten (frontmatter date 2026-11-06),
      extract https://www.pkzh.ch/de/aktuelles/cyberangriff-softech.html (date 2026-11-03),
      extract https://bpk.ch/hauptnavigation/cybervorfall (letters of 2026-10-14, 10-15, 10-20, 10-30; linked from bpk.ch home),
      extract https://pksoftech.ch/de/newsreader/Cyberangriff-auf-die-PKSoftechAG (unchanged since 2026-10-08).
    summary: |
      Facts from the funds' own pages that the entry does not carry. (1) BPK's letter to all insured persons of 2026-10-14 says the supplier
      incident of 2026-09-29 installed software that encrypts data (ransomware) and that on 2026-10-08 it became known that data was also
      stolen; the entry maps T1199 and T1657 only and nowhere states encryption, so T1486 (Data Encrypted for Impact) is evidence-bound
      by a customer's own primary and PK Softech's restoration on 2026-10-02 (already in the entry) now has a start date, 2026-09-29.
      (2) A wording over-read: BPK's pages say that, contrary to PK Softech's earlier information, it must be assumed personal data left PK Softech
      generally, but "we do not have clarity whether personal data of the Bernische Pensionskasse is affected" (2026-10-15, repeated 2026-10-30:
      "can neither confirm nor rule out"); BPK itself filed a criminal complaint on 2026-10-19. The entry's summary ("the Bernische Pensionskasse
      says it must be assumed so") and the first action ("which now says it must be assumed personal data left") attribute the assumption to
      BPK's own insured persons; the body sentence (told the NZZ that ... it must be assumed personal data left) is closer to the source.
      (3) Publica's status page was re-dated "Stand: 6.11.2026": analyses continue, "no indications" that data was published on the darkweb,
      productive systems unaffected, purchases (Einkäufe) possible through myPublica; nothing materially new on scope. (4) PKZH's page is
      dated 2026-11-03: its own statement of the suspension of the PK Softech system introduction (the entry carries it via Inside IT),
      a letter to all insured persons that week, Art. 85a BVG as the stated legal basis for processing by a contracted provider, and the
      payout controls (signed written request, identity check, additional check of bank-detail changes). No actor, vector or ransom statement
      in any of these pages; Akira remains press/Federal-Prosecutor reporting.
