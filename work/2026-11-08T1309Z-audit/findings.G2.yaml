      internet"), but no actor, behaviour, data class or Swiss nexus is public; the investigation is Italian; the first reports date 2026-11-06/07. Below the incident floor
      (PD-11); the same week's Swiss ARX claim remains tracker-only and no source links it to BBT or to the Femern Link Contractors incident.
