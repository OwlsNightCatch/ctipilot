- entry: 2026-11-02/xerox-fiery-php2shell-printers-fixes-due-6-to-23-november
  verdict: factual-error
  findings:
  - code: F4
    claim_id: 09ef84c07c, 8b7423f896, ad0d07d734, 061d019388, cd97efc614
    where: title/headline/summary ("no fixed build is out"; "fixes due 6 to 23 November"; AltaLink/EC81xx/VersaLink "expected on 2026-11-06"; WorkCentre "in development"), actions[0], cves[].fixed ("none released as of 2026-11-03"), cves[].status [no-patch, mitigation-only], tags [no-patch]
    defect: 'Xerox revised bulletin XRX26-016 to v6 on 2026-11-06 (the day the entry says fixes are expected): AltaLink 82xx/81xx, EC81xx and VersaLink C/B415, C/B625, C/B620 are Remediated; WorkCentre 3655/EC7836/EC7856 now have a patch; AltaLink C80xx/B80xx/EC80xx are newly listed as Affected with a patch. Only Fiery (due Nov 9-23) and the Worldwide Ticketing Tool remain open.'
    ground_truth: 'v6 ("Updated: November 6, 2026"): "Xerox AltaLink 82xx, AltaLink 81xx and Xerox EC81xx products | Remediated | This release adds PHP 8.2.35 which contains the fixes ... Version 123.xxx.006.29800"; "VersaLink C/B415, C/B625, C/B620 | Remediated | ... Version 123.xxx.006.30100"; "AltaLink C8030/C8035, C8045/C8055, C8070; AltaLink B8045/B8055, B8065/B8075/B8090; EC8036, EC8056 | Affected | A System Software Patch to Reduce Exposure to PHP2Shell Vulnerabilities is available ... XRX26-018"; "WorkCentre 3655, EC7836, EC7856 | Affected | A System Software Patch ... is available ... XRX26-017"; "Fiery patches are scheduled for release November 9-23, 2026"; "Worldwide Ticketing Tool | Fix in development". Bulletin index lists v6 (November 6, 2026) and XRX26-017/-018 (November 5, 2026).'
    ground_truth_url: https://securitydocs.business.xerox.com/wp-content/uploads/2026/11/Xerox-Security-Bulletin-XRX26-016-for-PHP2Shell-Vulnerabilities-CVE-2026-109618-and-CVE-2026-109619-v6.pdf
    fix: 'Add a changelog update for bulletin v6 (2026-11-06): AltaLink 82xx/81xx, EC81xx, VersaLink remediated with PHP 8.2.35 firmware; patches for WorkCentre (XRX26-017) and AltaLink C80xx/B80xx/EC80xx (XRX26-018) that reduce exposure; Fiery still due Nov 9-23; ticketing tool in development. Rewrite title, headline, summary, actions[0], cves[].affected/fixed/status, tags and the main analysis (including "the bulletin does not give a PHP version") to the new state.'
  - code: F4
    claim_id: 00116df2ee, 315fea1c6d, 0270ef55a9
    where: 'body: "No fixed build is out: ..."; Defender takeaway "install the fixes on release, 2026-11-06 for AltaLink, EC81xx and VersaLink"; "The bulletin does not give a PHP version"'
    defect: Cited v5 supports these sentences for 2026-11-03 but they are false against the current bulletin.
    ground_truth: 'v6: "This release adds PHP 8.2.35 which contains the fixes for the critical (RCE) vulnerabilities."; AltaLink/VersaLink "Remediated".'
    ground_truth_url: https://securitydocs.business.xerox.com/wp-content/uploads/2026/11/Xerox-Security-Bulletin-XRX26-016-for-PHP2Shell-Vulnerabilities-CVE-2026-109618-and-CVE-2026-109619-v6.pdf
    fix: Correct through the same changelog record; the 2026-11-05 section ("fix dates are unchanged") stays as a dated section.
  length_note: null
- entry: 2026-11-02/android-sms-of-death-wap-push-telephony-crash
  verdict: factual-error
  findings:
  - code: F4
    claim_id: ce1bc081b5, 55113190dc, 8f9c21f82d
    where: actions[0] ("Install the October 2026 Android security update ..."), Exposure ("any Android phone on a patch level before October 2026"), Defender takeaway ("move every managed Android handset to the October 2026 patch level")
    defect: The entry builds its patch-level guidance on the researcher's statement that the fix shipped in October; Google's own bulletins attach the CVE to the November 2026 bulletin, so the October patch level is not the vendor-stated fix level.
    ground_truth: 'Android Security Bulletin November 2026 (Published November 2, Updated November 6), "2026-11-01 security patch level", System: "CVE-2026-58882 | A-517376969 | DoS | Critical | 14, 15, 16, 16-qpr2, 17"; the October 2026 bulletin lists no decodeWapPdu/WapPushOverSms issue (BleepingComputer: "the flaw is not listed in Google''s October security bulletin").'
    ground_truth_url: https://source.android.com/docs/security/bulletin/2026/2026-11-01
    fix: 'Add a changelog update: Google lists the flaw as CVE-2026-58882 (Critical DoS, Android 14 to 17) in the November 2026 bulletin, fixed at patch level 2026-11-01; change actions, Exposure and Defender takeaway to the 2026-11-01 patch level and note the researcher-vs-bulletin discrepancy (the researcher''s "October" claim stays attributed).'
  - code: F4
    claim_id: null
    where: 'sourcing_note ("no CVE record by that number exists and the researcher names none") and cves: []'
    defect: CVE-2026-58882 now exists as a published CVE record, assigned by Google (Android); the entry says no record exists and carries an empty cves[].
    ground_truth: 'CVE record CVE-2026-58882: state PUBLISHED, assignerShortName google_android, datePublished 2026-11-02T19:54:02Z; "In decodeWapPdu of WapPushOverSms.java, there is a possible out of bounds read due to an integer overflow. This could lead to a remote denial of service ..."; affected Android 14, 15, 16, 16-qpr2, 17; references the 2026-11-01 Android bulletin; CISA ADP CVSS 3.1 7.5, SSVC Exploitation none.'
    ground_truth_url: https://cveawg.mitre.org/api/cve/CVE-2026-58882
    fix: Record CVE-2026-58882 in cves[] (status patch-available, Google bulletin 2026-11-01, Android 14 to 17) and replace the "no CVE record exists" sentence in sourcing_note (the CVE was published after the entry was written).
  length_note: null
- entry: 2026-11-06/cve-2026-116779-freeswitch-sip-message-api-command-execution
  verdict: imprecision
  findings:
  - code: F8
    claim_id: null
    where: Exposure and cves[].affected/fixed (only "a SIP profile that accepts inbound MESSAGE" and sofia are named)
    defect: (low confidence) The 1.11.3 release notes gate the api chat proto in mod_verto as well as mod_sofia; the entry names only the SIP profile surface. The GHSA text itself does not mention Verto, so whether Verto endpoints are exposed to the same selector is not stated by the advisory.
    ground_truth: 'FreeSWITCH v1.11.3 release notes: "[mod_sofia] Add enable-chat-api-proto to gate the api chat proto" and "[mod_verto] Add enable-chat-api-proto to gate the api chat proto"; "[mod_sofia] Bound the To-user split in the inbound MESSAGE handler".'
    ground_truth_url: https://github.com/signalwire/freeswitch/releases
    fix: 'Optional: add that 1.11.3 also adds the enable-chat-api-proto gate to mod_verto (installations exposing Verto should treat it as in scope until the vendor says otherwise).'
  length_note: null
