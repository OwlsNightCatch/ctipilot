- entry: 2026-10-31/cve-2026-98432-linux-kernel-tcp-uaf-mptcp-remote-root
  verdict: imprecision
  findings:
  - code: F4
    claim_id: 62db259b59
    where: cves[CVE-2026-98432].affected ("Ubuntu 22.04, 24.04, 26.04 and 26.10 (fix in progress)") and, dated 2026-11-04, the Ubuntu paragraph of the body, Defender takeaway and summary
    defect: 'Entry states Ubuntu 26.10 is still "fix in progress" (undated in cves[].affected); the dated body/summary statements ("tracker last updated 2026-11-04") were true on that date (confirmed on a Wayback snapshot: "Last updated 4 November 2026 ... linux | 26.10 stonking | Vulnerable work in progress in 7.3.0-10.10").'
    ground_truth: 'Canonical tracker, now "Last updated 7 November 2026": "linux | 26.10 stonking | Fixed in 7.3.0-10.10"; 26.04, 24.04, 22.04, 20.04, 18.04 and 16.04 remain "Vulnerable work in progress" (14.04 Not affected).'
    ground_truth_url: https://ubuntu.com/security/CVE-2026-98432
    fix: 'Add a changelog record: Ubuntu 26.10 fixed in linux 7.3.0-10.10 (tracker revision 2026-11-07), other releases still in progress; move 26.10 out of the "fix in progress" list in cves[].affected/fixed.'
  - code: F10
    claim_id: null
    where: headline / summary / Fortinet sentences ("Fortinet still have none"; "Fortinet's advisory is unchanged")
    defect: Fortinet FG-IR-26-188 was revised after the entry's last record and now carries a mitigation the entry does not mention; the "no fixed build" statements remain true but the "unchanged" statement (2026-11-05 section) no longer holds.
    ground_truth: 'FG-IR-26-188 "Updated Date Nov 7, 2026"; Timeline "2026-11-07: Added IPS package info"; "Virtual Patch named ''Linux.Kernel.tcp_v4_syn_recv_sock.Use.After.Free.'' is available in FMWP db update 26.113"; "Virtual Patch: Yes"; the products-under-investigation list has grown to about 60 products; "Known Exploited: No" unchanged.'
    ground_truth_url: https://fortiguard.fortinet.com/psirt/FG-IR-26-188
    fix: Record the Fortinet IPS virtual patch (FMWP db update 26.113, 2026-11-07) in a changelog update; keep "no fixed build" wording.
  - code: F10
    claim_id: null
    where: coverage of vendor fixes (body paragraph 3; actions[0])
    defect: Sophos Firewall and SD-RED fixes released on 2026-11-06 are not covered; the entry names WatchGuard and Fortinet as the network-appliance vendors without a fix but is silent on Sophos (new vendor advisory, low severity).
    ground_truth: 'sophos-sa-20261102-linux-kernel-tcp (first published 2 Nov, updated 6 Nov, version 3): "Sophos Firewall | Hotfix HF110626.1 released on November 6, 2026 for v23.0 GA, v23.0 EAP1 and v22.0 MR3 ... Sophos SD-RED 20 and SD-RED 60 | Fixed in SD-RED firmware 3.0.012, released on November 5, 2026".'
    ground_truth_url: https://www.sophos.com/en-us/security-advisories/sophos-sa-20261102-linux-kernel-tcp
    fix: 'Optional: add Sophos Firewall hotfix HF110626.1 and SD-RED 3.0.012 to the vendor-status paragraph and cves[].fixed.'
  length_note: null
- entry: 2026-10-30/wordpress-core-7-1-4-unauthenticated-upgrade-window-rce-race
  verdict: imprecision
  findings:
  - code: F3
    claim_id: 1d28e17828
    where: 'body Detection line: "confirm that `wp-config.php` and the database it names are unchanged ([Picus Security, 2026-11-05])"'
    defect: (low confidence) The clause is bound to the Picus post, which describes how the attacker overwrites the live wp-config.php but gives no compromise-check advice; the check is the entry's own inference from that mechanism.
    ground_truth: 'Picus (last updated November 05, 2026): "an attacker can create a malicious wp-config.php inside the temporary update directory and have the updater copy it over the live configuration. The replacement file can redirect the site to an attacker-controlled empty database" - no instruction to verify wp-config.php or the database.'
    ground_truth_url: https://www.picussecurity.com/resource/blog/cve-2026-119977-when-updating-wordpress-becomes-the-vulnerability
    fix: Rephrase as the entry's inference ("the mechanism implies ...") or cite the mechanism sentence only; the Wordfence list of what to check (admin accounts, plugins, PHP files under wp-content/upgrade) is the sourced part.
  length_note: null
