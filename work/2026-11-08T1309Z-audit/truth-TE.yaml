- entry: 2026-09-22/cve-2026-13684-synology-dsm-unauth-file-read-write
  verdict: imprecision
  findings:
  - code: F5
    claim_id: ec1664c516
    where: 'body Detection paragraph, second sentence: "the SCGI and login-logic surfaces sit behind the standard DSM web-management port, so file reads or writes outside a session''s own storage scope, or unauthenticated requests to the SCGI and login endpoints from outside the administrative source range, are the sharpest signal"'
    defect: (low confidence) Presented as fact without a citation and without the "(an inference)" label other entries use; no cited source says the SCGI or login-logic code is reached through a particular port or endpoint.
    ground_truth: 'NCSC Switzerland post 12960 states only "Prerequisites: Network access to the DSM management interface"; Synology SA-26:13 says "improper encoding or escaping of output vulnerability in SCGI" and "insufficient entropy vulnerability in login logic" with no port or endpoint detail.'
    ground_truth_url: https://security-hub.ncsc.admin.ch/#/posts/12960
    fix: Mark the sentence as an inference from the described flaws, or cite NCSC for "network access to the management interface" and drop the endpoint specifics.
  length_note: null
- entry: 2026-10-25/qnap-synology-php2shell-qts-quts-hero-fixed-others-unfixed
  verdict: factual-error
  findings:
  - code: F4
    claim_id: c2278b61b6, d0273cdf21, e5b990a915, 90c5051850, 7fa4a02997
    where: title ("QNE (ADRA) still unfixed"), headline ("QNE still unfixed"), summary ("QNE (ADRA) ... with no fixed version"), actions[0] ("take any QNAP device running QNE (ADRA) off the internet until QNAP lists a fix"), cves[].fixed ("no fix yet for QNE (ADRA)")
    defect: QNE (ADRA) is stated to have no fixed version; QNAP revised QSA-26-19 on 2026-11-02 and now lists a fix.
    ground_truth: 'QSA-26-19 now reads "Status #### Resolved"; table "QNE (ADRA) 1.0.7 and earlier Resolved QNE (ADRA) 1.0.7.q327"; "Revision History: V1.0 (October 22, 2026) - Fixing Published; V1.1 (November 2, 2026) - Resolved Published".'
    ground_truth_url: https://www.qnap.com/en/security-advisory/qsa-26-19
    fix: 'Add a changelog update (QSA-26-19 V1.1, 2026-11-02): QNE (ADRA) fixed in 1.0.7.q327; replace title/headline/summary/actions/cves[].fixed wording and the "no fix" clauses in the main analysis; keep the QSA-26-18 and Synology content.'
  - code: F3
    claim_id: f86a379255, a88c55178e, 10837e3d48
    where: 'body (QNE paragraph: "its fixed version is still to be announced"; Defender takeaway: "for QNE (ADRA), which has no fix"), and the 2026-10-31 section ("whose status is Fixing and whose fixed version is still to be announced")'
    defect: The cited QSA-26-19 page no longer supports these statements (the 2026-10-31 section was accurate for that date and may stay as a dated section; the main-analysis sentences and the Defender takeaway are now false).
    ground_truth: 'QSA-26-19: "Affected product Status Fixed version / QNE (ADRA) 1.0.7 and earlier Resolved QNE (ADRA) 1.0.7.q327"; V1.1 (November 2, 2026) - Resolved Published.'
    ground_truth_url: https://www.qnap.com/en/security-advisory/qsa-26-19
    fix: 'Fix the main-analysis and Defender-takeaway sentences through a correction/update record: QNE (ADRA) 1.0.7.q327 is the fixed build.'
  - code: quote-literal (lead)
    claim_id: null
    where: 'evidence[6]: "QNE (ADRA) 1.0.7 and earlier Fixing To be announced" (QSA-26-19)'
    defect: 'Lead decided: the quote is not a contiguous passage of the page today because QSA-26-19 was revised to V1.1 (Resolved) on 2026-11-02; when written it was a flattened table row (same row format confirmed on the QSA-26-18 page of 2026-10-26: "| QNE (ADRA) 1.0.7 and earlier | Fixing | To be announced |"), i.e. a table row quoted as prose, not a fabricated quote. No independent defect; it now supports a superseded state.'
    ground_truth: 'Current QSA-26-19 table row: "QNE (ADRA) 1.0.7 and earlier Resolved QNE (ADRA) 1.0.7.q327"; Wayback 2026-10-26 snapshot of QSA-26-18 shows the earlier "Fixing | To be announced" row.'
    ground_truth_url: https://www.qnap.com/en/security-advisory/qsa-26-19
    fix: When the entry is corrected, replace this evidence quote with the current row ("QNE (ADRA) 1.0.7 and earlier Resolved QNE (ADRA) 1.0.7.q327") or drop it.
  length_note: null
