    text: "CISA lists WordPress core's upgrade-window RCE race as exploited; block wp-content/upgrade before installing 7.1.4"
  - claim_id: 6d2c30e4bc
    entry: 2026-10-30/wordpress-core-7-1-4-unauthenticated-upgrade-window-rce-race
    surface: "summary"
    kind: frontmatter
    text: "WordPress 7.1.4 of 2026-10-28 fixes a weakness in the core upgrade process that lets an unauthenticated attacker reach the staged installer and run code on the server during a full-package core update, in versions 4.7 to 7.1.3, with backports for every branch down to 4.7. CISA added CVE-2026-119977 to its Known Exploited Vulnerabilities catalog on 2026-11-03; Wordfence reports more than 18,500 probing requests in the first 21 hours, while Patchstack calls the race hard to win and says it needs a web-reachable staging directory. The discoverer says the update that installs the fix still unpacks with the old code, so the staging directory must be blocked before updating."
  - claim_id: 4517da78a0
    entry: 2026-10-30/wordpress-core-7-1-4-unauthenticated-upgrade-window-rce-race
    surface: "actions[0]"
    kind: frontmatter
    text: "On every WordPress site your organisation, its web agencies or its hosting suppliers run, deny web access to wp-content/upgrade/ in the web server configuration (not with an .htaccess file inside that folder) and confirm it answers 403 before installing 7.1.4 or the fixed release of its branch, because the update itself still unpacks with the old code and a firewall that WordPress itself loads does not run for that request; then confirm in Dashboard > Updates that each site is on 7.1.4 or the fixed release of its branch."
  - claim_id: d609856d2c
    entry: 2026-10-30/wordpress-core-7-1-4-unauthenticated-upgrade-window-rce-race
    surface: "cves[CVE-2026-119977]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-119977\", \"cvss\": \"8.1 (CVSS 3.1, Wordfence)\", \"status\": [\"exploited\", \"cisa-kev\", \"patch-available\"], \"affected\": \"WordPress Core 4.7.0 to 7.1.3 (every branch from 4.7 below its fixed release)\", \"fixed\": \"7.1.4, 7.0.8 and the backport of each branch down to 4.7.39\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
  - claim_id: 67d4530c04
    entry: 2026-10-30/wordpress-core-7-1-4-unauthenticated-upgrade-window-rce-race
    surface: "body"
    kind: cited
    text: "WordPress 7.1.4, released on 2026-10-28, fixes a weakness in the upgrade process that can lead to remote code execution during the upgrade window, and backports follow for every branch that receives security fixes, currently through 4.7 ("
    urls: ["https://wordpress.org/news/2026/10/wordpress-7-1-4/"]
  - claim_id: ea242b9b6a
    entry: 2026-10-30/wordpress-core-7-1-4-unauthenticated-upgrade-window-rce-race
    surface: "body"
    kind: cited
    text: "During a core update with a complete package, the new files are unpacked into a predictable directory under `wp-content/upgrade`; the temporary copy includes the installer, and an unauthenticated attacker who requests it at the right moment can interact with the staged copy and reach PHP code execution ("
    urls: ["https://www.wordfence.com/blog/2026/10/wordpress-7-1-4-security-release-rce/"]
  - claim_id: b8957b44af
