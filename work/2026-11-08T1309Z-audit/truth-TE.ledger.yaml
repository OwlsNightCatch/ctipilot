    text: "Progress's bulletin, as listed by heise, covers fifteen WS_FTP Server flaws on Windows, six of them critical: CVE-2026-84295, an improper-authentication flaw that could let an unauthenticated remote attacker reach administrative credentials (CVSS 3.1 10.0), and five command-injection, path-traversal and missing-authorization flaws (CVE-2026-90868 at 9.9, CVE-2026-90866, CVE-2026-90864 and CVE-2026-90863 at 9.1, CVE-2026-90865 at 9.0), four of which NCSC Switzerland describes as a route from the exposed administrator credentials to full server compromise. Builds before 2024.0.7 and 2025.0.4 are affected, and CSIRT Italia says Progress will issue no patch for unsupported versions. NCSC Switzerland lists exploitation as unknown and no source reports it; CISA's catalog holds no 2026 WS_FTP flaw, though a 2023 flaw in the same product is listed with known ransomware use."
