  - claim_id: e6911d0ca0
    entry: 2026-11-06/cve-2026-123158-openssh-musl-no-pam-password-bypass-sshole
    surface: "headline"
    kind: frontmatter
    text: "OpenSSH 10.6p2: password bypass on musl Linux without PAM (Alpine, OpenWrt); update or turn passwords off"
  - claim_id: 55d6d7d536
    entry: 2026-11-06/cve-2026-123158-openssh-musl-no-pam-password-bypass-sshole
    surface: "summary"
    kind: frontmatter
    text: "OpenSSH Portable 10.6p2 of 2026-11-05 works around CVE-2026-123158, a password-authentication bypass on Linux systems that use musl libc and run sshd without PAM, Alpine's default OpenSSH server and OpenWrt among them: a password of 257 to 1,024 bytes logs in to an account whose password field is *. NCSC Switzerland published an advisory the same day and rates exploitation unknown; Alpine shipped fixed packages for every branch back to 3.16. Previdian's page, as read on 2026-11-07, reports 15 exploitation attempts from 10 addresses since 2026-11-06 and, according to The Hacker News, a successful root login on an Alpine honeypot; CISA does not list the flaw."
  - claim_id: 5fd9f58a68
    entry: 2026-11-06/cve-2026-123158-openssh-musl-no-pam-password-bypass-sshole
    surface: "actions[0]"
    kind: frontmatter
    text: "On every musl-based Linux host that runs sshd (Alpine, OpenWrt, Buildroot, Yocto), install OpenSSH 10.6p2 or the distribution's fixed openssh package and restart sshd, because updating the package does not replace the running server, and rebuild container and cloud images from a fixed base; until then set PasswordAuthentication no in sshd_config and restart sshd."
  - claim_id: 2a9547ed63
    entry: 2026-11-06/cve-2026-123158-openssh-musl-no-pam-password-bypass-sshole
    surface: "cves[CVE-2026-123158]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-123158\", \"cvss\": \"8.1\", \"status\": [\"poc-public\", \"patch-available\"], \"affected\": \"OpenSSH Portable before 10.6p2 on Linux with musl libc and no PAM; needs an account whose password field is * and at least one other account with a real password\", \"fixed\": \"OpenSSH Portable 10.6p2; Alpine edge 10.6_p2-r0, 3.24 10.3_p1-r2, 3.23 10.2_p1-r1, 3.22 10.0_p1-r11, 3.21 9.9_p2-r1, 3.20 9.7_p1-r6, 3.19 9.6_p1-r3, 3.18 9.3_p2-r4, 3.17 9.1_p1-r7, 3.16 9.0_p1-r6 per OX Security; temporary mitigation PasswordAuthentication no\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
  - claim_id: d1609edcc7
    entry: 2026-11-06/cve-2026-123158-openssh-musl-no-pam-password-bypass-sshole
    surface: "body"
    kind: cited
    text: "Portable OpenSSH 10.6p2 carries what its release notes call a critical security workaround for Linux systems that use the musl libc with PAM disabled ("
    urls: ["https://www.openssh.org/txt/release-10.6p2"]
  - claim_id: b797396646
    entry: 2026-11-06/cve-2026-123158-openssh-musl-no-pam-password-bypass-sshole
    surface: "body"
    kind: cited
    text: "NCSC Switzerland says remote, unauthenticated attackers can bypass SSH password authentication over the network and gain access, and rated the exploitation status unknown ("
    urls: ["https://security-hub.ncsc.admin.ch/#/posts/13155"]
  - claim_id: e0841f8538
    entry: 2026-11-06/cve-2026-123158-openssh-musl-no-pam-password-bypass-sshole
    surface: "body"
    kind: cited
    text: "OX Security explains the mechanism: musl's crypt() refuses inputs over 256 bytes and returns the string `*` when it fails, `*` is also what /etc/shadow holds for an account with no valid password, and OpenSSH, whose 2016 user-enumeration countermeasure can hash a password with settings taken from another account, reads the two matching values as a successful login ("
    urls: ["https://www.ox.security/blog/openssh-authentication-bypass-cve-2026-123158/"]
  - claim_id: 7c0ad37eb0
    entry: 2026-11-06/cve-2026-123158-openssh-musl-no-pam-password-bypass-sshole
    surface: "body"
    kind: cited
    text: "OX gives the conditions: sshd on musl without PAM (Alpine's openssh-server by default), password logins enabled, an account whose password field is `*` (key-only users, LDAP users, root on Alpine) and at least one other account on the host with a real password; accounts that hold `!`, glibc systems, PAM setups, Dropbear and OpenBSD are not affected, and OX scores the flaw CVSS 3.1 8.1 ("
    urls: ["https://www.ox.security/blog/openssh-authentication-bypass-cve-2026-123158/"]
  - claim_id: 9f9039b1ab
    entry: 2026-11-06/cve-2026-123158-openssh-musl-no-pam-password-bypass-sshole
    surface: "body"
    kind: cited
    text: "On Alpine's official AWS and Azure images the passwordless account is the default alpine user, which can run doas without a password, so the bypass chains to root ("
    urls: ["https://www.ox.security/blog/openssh-authentication-bypass-cve-2026-123158/"]
  - claim_id: 389859f7d0
    entry: 2026-11-06/cve-2026-123158-openssh-musl-no-pam-password-bypass-sshole
    surface: "body"
    kind: cited
    text: "); Alpine says those tiny-cloud images are safe on first boot and exploitable once any `$6$` hash exists, and that cloud-init images, which write `PasswordAuthentication no`, are not affected ("
    urls: ["https://alpinelinux.org/posts/2026-11-05-openssh-password-authentication-bypass/"]
  - claim_id: c2f6b1d81d
    entry: 2026-11-06/cve-2026-123158-openssh-musl-no-pam-password-bypass-sshole
    surface: "body"
    kind: cited
    text: "The OpenSSH developers do not consider the root cause to lie in OpenSSH ("
    urls: ["https://www.heise.de/en/news/OpenSSH-and-Alpine-Linux-warn-of-severe-but-niche-bug-11513360.html"]
  - claim_id: 6149ca9519
    entry: 2026-11-06/cve-2026-123158-openssh-musl-no-pam-password-bypass-sshole
    surface: "body"
    kind: cited
    text: "), and NCSC Switzerland adds that other software with similar authentication paths may be affected ("
    urls: ["https://security-hub.ncsc.admin.ch/#/posts/13155"]
  - claim_id: 3fae13d508
    entry: 2026-11-06/cve-2026-123158-openssh-musl-no-pam-password-bypass-sshole
    surface: "body"
    kind: cited
    text: "Alpine pushed the fix to every branch back to 3.16 ("
    urls: ["https://www.ox.security/blog/openssh-authentication-bypass-cve-2026-123158/"]
  - claim_id: 9343ac1307
    entry: 2026-11-06/cve-2026-123158-openssh-musl-no-pam-password-bypass-sshole
    surface: "body"
    kind: cited
    text: "); on release day other distributions and many OpenSSH download servers still offered 10.6p1 ("
    urls: ["https://www.heise.de/en/news/OpenSSH-and-Alpine-Linux-warn-of-severe-but-niche-bug-11513360.html"]
  - claim_id: dd7816a7a9
    entry: 2026-11-06/cve-2026-123158-openssh-musl-no-pam-password-bypass-sshole
    surface: "body"
    kind: cited
    text: "**Exposure:** sshd on a musl-based Linux system built without PAM, which NCSC Switzerland lists as Alpine, KISS, Sabotage, OpenWrt, Morpheus and other musl distributions that do not use PAM for password authentication, with password logins enabled ("
    urls: ["https://security-hub.ncsc.admin.ch/#/posts/13155"]
  - claim_id: 111794787e
    entry: 2026-11-06/cve-2026-123158-openssh-musl-no-pam-password-bypass-sshole
    surface: "body"
    kind: cited
    text: ") and, per OX Security, an account whose /etc/shadow password field is `*` ("
    urls: ["https://www.ox.security/blog/openssh-authentication-bypass-cve-2026-123158/"]
  - claim_id: dba341d66b
    entry: 2026-11-06/cve-2026-123158-openssh-musl-no-pam-password-bypass-sshole
    surface: "body"
    kind: cited
    text: "Containers that do not run an OpenSSH server are not affected ("
    urls: ["https://www.ox.security/blog/openssh-authentication-bypass-cve-2026-123158/"]
  - claim_id: 3c12b86ed7
    entry: 2026-11-06/cve-2026-123158-openssh-musl-no-pam-password-bypass-sshole
    surface: "body"
    kind: cited
    text: "**Detection:** OX Security advises searching /var/log/messages for `Accepted password for` on an account that has no password (alpine, root, key-only users) and treating the machine as compromised if one is found ("
    urls: ["https://www.ox.security/blog/openssh-authentication-bypass-cve-2026-123158/"]
  - claim_id: 11e6b01161
    entry: 2026-11-06/cve-2026-123158-openssh-musl-no-pam-password-bypass-sshole
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** install OpenSSH 10.6p2 or the distribution's fixed package on every musl-based host that runs sshd and restart sshd, because updating the package alone does not replace the SSH server that is already running, and rebuild container and cloud images from a fixed base ("
    urls: ["https://www.ox.security/blog/openssh-authentication-bypass-cve-2026-123158/"]
  - claim_id: 48344d9acd
    entry: 2026-11-06/cve-2026-123158-openssh-musl-no-pam-password-bypass-sshole
    surface: "body"
    kind: cited
    text: "); until then set `PasswordAuthentication no` and restart sshd, as NCSC Switzerland advises ("
    urls: ["https://security-hub.ncsc.admin.ch/#/posts/13155"]
  - claim_id: d48fc6ac46
    entry: 2026-11-06/cve-2026-123158-openssh-musl-no-pam-password-bypass-sshole
    surface: "body"
    kind: derived
    text: "The mechanism implies the same event in any sshd authentication log; no source publishes an indicator beyond that."
  - claim_id: ce495186ab
    entry: 2026-11-06/cve-2026-123158-openssh-musl-no-pam-password-bypass-sshole
    surface: "body"
    kind: derived
    text: "**Triage:** an accepted password login is normal for an account with a real hash; the same event for an account whose password field is `*` has no benign explanation, because such an account cannot match any password."
  - claim_id: 986ccd3850
    entry: 2026-11-06/cve-2026-123158-openssh-musl-no-pam-password-bypass-sshole
    surface: "body"
    kind: derived
