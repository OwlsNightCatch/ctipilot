    entry: 2026-11-02/xerox-fiery-php2shell-printers-fixes-due-6-to-23-november
    surface: "summary"
    kind: frontmatter
    text: "Xerox's security bulletin XRX26-016 (published 2026-10-23, updated 2026-11-03) lists AltaLink, EC81xx, VersaLink C/B415, C/B625 and C/B620, WorkCentre 3655, EC7836 and EC7856, the Fiery Digital Front End and the Worldwide Ticketing Tool as affected by the PHP flaws CVE-2026-109618 and CVE-2026-109619, and no fixed build is out: Xerox expects the AltaLink, EC81xx and VersaLink fixes on 2026-11-06, Fiery patches are due between 2026-11-09 and 2026-11-23, and the WorkCentre and Ticketing Tool fixes are in development. Until then Xerox says to restrict the web interface of AltaLink, EC81xx, VersaLink and WorkCentre devices to trusted networks or management hosts, or to disable HTTP/HTTPS; the bulletin gives no statement on exploitation of Xerox devices, and CISA lists both PHP flaws as exploited."
  - claim_id: ad0d07d734
    entry: 2026-11-02/xerox-fiery-php2shell-printers-fixes-due-6-to-23-november
    surface: "actions[0]"
    kind: frontmatter
    text: "Until Xerox's fixes ship (AltaLink, EC81xx and VersaLink expected 2026-11-06; WorkCentre 3655, EC7836 and EC7856 in development), limit the web interface (HTTP/HTTPS) of those printers to trusted networks or management hosts with a firewall or segmentation, or disable HTTP/HTTPS where remote web administration is not needed, accepting that this also disables the embedded web server and the features that depend on it."
