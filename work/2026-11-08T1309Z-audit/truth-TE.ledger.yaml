    text: "Synology said on 2026-10-29 that threat actors are exploiting a vulnerability patched in December 2024 to encrypt and extort devices on outdated DSM, naming no CVE and pointing to Synology-SA-24:20, while the Chinese vendor 360 identifies the ransomware as C3RB3R, a Cerber variant, and says it got in through CVE-2026-13684 and CVE-2026-13639, the two unauthenticated CVSS 9.8 flaws of Synology-SA-26:13 (fixed in DSM 7.4-90075, 7.3.2-86009-4, 7.2.2-72806-9 and 7.2.1-69057-12, with no mitigation). The two accounts conflict and no source reconciles them; a DSM that is current on both advisories is out of scope on either."
