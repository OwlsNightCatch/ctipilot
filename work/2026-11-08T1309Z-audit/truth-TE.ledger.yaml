  - claim_id: b2de8166f6
    entry: 2026-11-02/android-sms-of-death-wap-push-telephony-crash
    surface: "body"
    kind: cited
    text: "One malformed WAP Push data message to port 2948 makes `WapPushOverSms.decodeWapPdu()` cast a 64-bit header length to a signed 32-bit integer and allocate a negative-sized array; the uncaught `NegativeArraySizeException` kills the `com.android.phone` process, which drops active calls, emergency calls included, and cuts service for one to two seconds per message ("
    urls: ["https://smsofdeath.com/"]
