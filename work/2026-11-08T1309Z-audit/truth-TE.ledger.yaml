  - claim_id: 172fd4491a
    entry: 2026-11-06/cve-2026-116779-freeswitch-sip-message-api-command-execution
    surface: "headline"
    kind: frontmatter
    text: "FreeSWITCH: one SIP MESSAGE runs API commands, vendor says exploited; fixed in 1.11.3"
  - claim_id: 211f253865
    entry: 2026-11-06/cve-2026-116779-freeswitch-sip-message-api-command-execution
    surface: "summary"
    kind: frontmatter
    text: "SignalWire's advisory of 2026-10-28 describes CVE-2026-116779 (CVSS 3.1 9.8): an inbound SIP MESSAGE to a FreeSWITCH SIP profile selects the api chat proto and runs FreeSWITCH API commands with the privileges of the FreeSWITCH process, in the default configuration of 1.11.2 and earlier, and the advisory states that exploitation of this path has been observed in the wild. BSI CERT-Bund relayed it as a critical advisory on 2026-11-05; no source names an actor or victim, and the exploitation claim is the vendor's alone."
  - claim_id: bc03cf9cbb
    entry: 2026-11-06/cve-2026-116779-freeswitch-sip-message-api-command-execution
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade every FreeSWITCH to 1.11.3, or until then set enable-chat=false on every SIP profile that does not need inbound SIP chat and remove directory users that have no password; on an instance that SIP peers could reach, rotate the SIP trunk and directory credentials stored in its configuration, because the advisory lists disclosure of configuration and credentials as an impact and says exploitation has been observed."
  - claim_id: fbaa17d443
    entry: 2026-11-06/cve-2026-116779-freeswitch-sip-message-api-command-execution
    surface: "cves[CVE-2026-116779]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-116779\", \"cvss\": \"9.8\", \"status\": [\"exploited\", \"patch-available\"], \"affected\": \"FreeSWITCH 1.11.2 and earlier; any SIP profile that accepts inbound MESSAGE, which stock conf/vanilla enables on the internal and external profiles\", \"fixed\": \"FreeSWITCH 1.11.3, which adds a per-profile enable-chat-api-proto parameter that is off unless set\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
  - claim_id: cc01ef5333
    entry: 2026-11-06/cve-2026-116779-freeswitch-sip-message-api-command-execution
    surface: "body"
    kind: cited
    text: "SignalWire's advisory GHSA-mg63-h38w-8p9p describes CVE-2026-116779: FreeSWITCH's sofia_presence_handle_sip_i_message() splits the To user of an inbound SIP MESSAGE on `+` and treats the left half as a chat proto name, the mod_dptools module registers an `api` chat interface that hands its address to switch_api_execute(), and a peer that can deliver a MESSAGE to a profile therefore selects which FreeSWITCH API command the server runs ("
    urls: ["https://github.com/signalwire/freeswitch/security/advisories/GHSA-mg63-h38w-8p9p"]
