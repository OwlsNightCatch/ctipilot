    entry: 2026-11-02/android-sms-of-death-wap-push-telephony-crash
    surface: "body"
    kind: cited
    text: "The poison message stays in the pending queue and is retried on every boot and on carrier redelivery: the researcher reports that about 20 messages leave a device unusable and that one Android 12 phone rebooted into recovery roughly every 90 seconds until the messages were deleted over ADB ("
    urls: ["https://smsofdeath.com/"]
