  - claim_id: 0bd56d6305
    entry: 2026-11-08/cve-2026-117691-keycloak-saml-http-redirect-signature-bypass
    surface: "body"
    kind: cited
    text: "Red Hat, the CNA, explains that Keycloak's SAML HTTP-Redirect binding processes percent-encoded parameter names while the signature verification logic checks only literal ones, so an attacker can supply a crafted, unsigned SAML message that the server processes instead of a legitimately signed one; it scores the flaw CVSS 3.1 9.1 with no privileges or user interaction, rates it Important because it allows full account takeover of federated users, and says no available mitigation meets its criteria; it lists its build of Keycloak 26.6.9 packages as fixed by RHSA-2026:96040 and the 26.6 container images by RHSA-2026:96039, both released on 2026-11-07, and Red Hat Single Sign-On 7 as not affected ("
    urls: ["https://access.redhat.com/security/cve/CVE-2026-117691"]
  - claim_id: 5e122a2318
    entry: 2026-11-08/cve-2026-117691-keycloak-saml-http-redirect-signature-bypass
    surface: "body"
    kind: cited
    text: "**Exposure:** a Keycloak without the 26.8.2 fix (the release notes state no affected range), or a Red Hat build of Keycloak 26.6 without the 2026-11-07 errata, that uses the SAML HTTP-Redirect binding, which the release notes tie to broker login; the SAML 1.1 parser flaws need no authentication either ("
    urls: ["https://www.keycloak.org/2026/11/keycloak-2682-released", "https://access.redhat.com/security/cve/CVE-2026-117691"]
