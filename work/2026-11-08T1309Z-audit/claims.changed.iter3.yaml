  - claim_id: 4e52208f59
    entry: 2026-11-08/cve-2026-117691-keycloak-saml-http-redirect-signature-bypass
    surface: "summary"
    kind: frontmatter
    text: "Keycloak 26.8.2, released on 2026-11-05, fixes CVE-2026-117691 (CVSS 3.1 9.1, no privileges or user interaction): the SAML HTTP-Redirect binding processes percent-encoded parameter names such as %53AMLResponse while signature verification checks only literal names, so a crafted unsigned SAML message is processed instead of a signed one and the attacker logs in as any federated user. Red Hat, the CNA, names no mitigation that meets its criteria and fixed its build of Keycloak 26.6 in 26.6.9 on 2026-11-07. The release also fixes an unauthenticated JVM termination in the SAML 1.1 parser (CVE-2026-110931) and the bundled Brotli decoder flaw CVE-2026-111497, which CISA lists as exploited; no source reports exploitation of the SAML flaws."
  - claim_id: dfa5ca1a1b
    entry: 2026-11-08/cve-2026-117691-keycloak-saml-http-redirect-signature-bypass
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade every Keycloak instance that brokers a SAML identity provider or serves SAML clients to 26.8.2, and every Red Hat build of Keycloak 26.6 to 26.6.9 (RHSA-2026:96039, RHSA-2026:96040), internet-reachable login endpoints first."
  - claim_id: 7e4a4e4831
    entry: 2026-11-08/cve-2026-117691-keycloak-saml-http-redirect-signature-bypass
    surface: "cves[CVE-2026-117691]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-117691\", \"cvss\": \"9.1 (CVSS 3.1)\", \"status\": [\"patch-available\"], \"affected\": \"Keycloak releases before 26.8.2 that use the SAML HTTP-Redirect binding (the release notes give no range for older upstream lines); Red Hat build of Keycloak 26.6 without the 2026-11-07 errata; Red Hat Single Sign-On 7 not affected\", \"fixed\": \"Keycloak 26.8.2 (2026-11-05); Red Hat build of Keycloak 26.6.9 (RHSA-2026:96039 and RHSA-2026:96040, 2026-11-07); Red Hat says no mitigation meets its criteria\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
  - claim_id: ce54ca76db
    entry: 2026-11-08/cve-2026-117691-keycloak-saml-http-redirect-signature-bypass
    surface: "body"
    kind: cited
    text: "Red Hat, the CNA, explains that Keycloak's SAML HTTP-Redirect binding processes percent-encoded parameter names while the signature verification logic checks only literal ones, so an attacker can supply a crafted, unsigned SAML message that the server processes instead of a legitimately signed one; it scores the flaw CVSS 3.1 9.1 with no privileges or user interaction, rates it Important because it allows full account takeover of federated users, and says no available mitigation meets its criteria; it lists its build of Keycloak 26.6.9 as fixed by RHSA-2026:96039 and RHSA-2026:96040, released on 2026-11-07, and Red Hat Single Sign-On 7 as not affected ("
    urls: ["https://access.redhat.com/security/cve/CVE-2026-117691"]
  - claim_id: b9f526f5ce
    entry: 2026-11-08/cve-2026-117691-keycloak-saml-http-redirect-signature-bypass
    surface: "body"
    kind: cited
    text: "**Exposure:** a Keycloak below 26.8.2, or a Red Hat build of Keycloak 26.6 without the 2026-11-07 errata, that uses the SAML HTTP-Redirect binding, which the release notes tie to broker login; the SAML 1.1 parser flaws need no authentication either ("
    urls: ["https://www.keycloak.org/2026/11/keycloak-2682-released", "https://access.redhat.com/security/cve/CVE-2026-117691"]
  - claim_id: 2e3998845c
    entry: 2026-11-08/cve-2026-117691-keycloak-saml-http-redirect-signature-bypass
    surface: "body"
    kind: uncited
    text: "No source reports exploitation of the SAML flaws or a public proof of concept; CISA's listing concerns the Brotli decoder."
  - claim_id: 7cbb749331
    entry: 2026-11-08/cve-2026-117691-keycloak-saml-http-redirect-signature-bypass
    surface: "body"
    kind: derived
    text: "**Detection:** in Keycloak event logs and reverse-proxy access logs, SAML messages received by HTTP GET whose query string carries an encoded parameter name such as %53AMLResponse, with or without a literal SAMLResponse beside it, and federated logins of privileged accounts with no matching authentication at the upstream identity provider (both inferences from the mechanism Red Hat describes)."
  - claim_id: 8b2df04ba0
    entry: 2026-11-08/cve-2026-117691-keycloak-saml-http-redirect-signature-bypass
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** move every Keycloak that brokers SAML to 26.8.2, or the Red Hat build to 26.6.9, outside the regular cycle, because the bypass needs no privileges or user interaction and Red Hat's formal statement names no mitigation that meets its criteria; until then, restrict account registration on the external identity providers, as Red Hat's courtesy guidance suggests; after updating, review federated logins of privileged accounts for logins the upstream identity provider never saw."
