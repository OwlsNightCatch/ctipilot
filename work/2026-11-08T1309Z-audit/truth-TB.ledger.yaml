    kind: cited
    text: "The post says the controller still used its default Administrator credentials, publishes no evidence for that statement, says the log cannot show how the attackers got in or what temperatures were reached, and says it has no evidence linking the case to NoName057(16), Z-Pentest Alliance or the French attacks ("
    urls: ["https://ransom-isac.org/blog/the-copeland-incident/"]
