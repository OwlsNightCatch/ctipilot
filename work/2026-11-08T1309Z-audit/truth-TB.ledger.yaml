    surface: "section 2026-10-29T07:03:00Z"
    kind: cited
    text: "Broadcom rates it critical, CVSS 3.1 9.8, on SDDC Manager 9.1.1 only and important, 7.5, on 9.1.0, 9.0.x and 5.2.x, none has a patch yet, and workarounds are in KB460732 for 9.1.1 and KB460734 for the others ("
