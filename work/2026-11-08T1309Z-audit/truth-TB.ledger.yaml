    surface: "section 2026-10-29T07:03:00Z"
    kind: cited
    text: "Palo Alto Networks' timeline of 2026-10-29 removes the estimated dates of 11.2.4-h23, 12.1.4-h13 and 12.1.10-h3 because those builds are released, so every PAN-OS hotfix listed for this flaw is now available ("
