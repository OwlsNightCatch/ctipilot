    text: "PHP rebuilt its Windows packages as 8.5.12-1, 8.4.27-1, 8.3.36-1 and 8.2.35-1 on 2026-10-26 with Brotli 1.2.1; the vulnerable decoder is reachable there through the cURL extension when automatic HTTP response decompression is enabled, which cURL leaves off by default ("
    urls: ["https://www.php.net/archive/2026.php#2026-10-26-1"]
