    text: "Broadcom's advisory VMSA-2026-0008, issued on 2026-10-27 and revised as 0008.1 on 2026-10-28 to clarify the impacted products, lists VMware Cloud Foundation's SDDC Manager as affected because it uses Node.js: a malicious actor with network access to SDDC Manager may exploit the flaw to execute arbitrary code ("
