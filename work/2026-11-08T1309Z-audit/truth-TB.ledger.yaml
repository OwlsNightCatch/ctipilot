    text: "Brotli encoding is disabled by default in PAN-OS 11.2.4 and later, the command show system setting brotli shows whether a firewall is exposed (Enabled: yes), and set system setting brotli-encoding disable is the vendor's interim mitigation; Palo Alto rates the urgency moderate and is not aware of malicious exploitation ("
    urls: ["https://security.paloaltonetworks.com/CVE-2026-111497"]
