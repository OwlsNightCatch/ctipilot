    surface: "section 2026-10-27T03:43:51Z"
    kind: cited
    text: "NCSC Switzerland (BACS) published advisory 13105 on 2026-10-26 on the Brotli decoder flaw: it names Node.js, Microsoft .NET, Visual Studio, PowerShell, the Python Brotli and brotlicffi packages and Bun among the affected dependents, rated the exploitation status unknown with a proof of concept available in its text of that day, and gives as the temporary measure disabling Brotli decoding of untrusted data and rejecting Content-Encoding: br until patched, with services restarted and containers rebuilt after updating ("
    urls: ["https://security-hub.ncsc.admin.ch/#/posts/13105"]
