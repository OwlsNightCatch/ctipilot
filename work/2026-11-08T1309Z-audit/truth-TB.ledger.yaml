  - claim_id: 9888f66a79
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "section 2026-11-01T13:56:19Z"
    kind: cited
    text: "The 2026-10-26 section's statement that no source reported exploitation outside Imperva's laboratory held only for that day: CISA listed the flaw as exploited on 2026-10-27, and NCSC Switzerland's advisory, updated on 2026-10-29, now gives the status as actively exploited with a proof of concept available ("
    urls: ["https://security-hub.ncsc.admin.ch/#/posts/13105"]
  - claim_id: 469cb411a4
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "section 2026-11-01T13:56:19Z"
    kind: cited
    text: "ELLIO's capture is not the only attack telemetry: Zscaler's decoys recorded 402 events from 20 source addresses against 12 customers within a day of disclosure, 60% of them exploitation attempts and the rest reconnaissance ("
    urls: ["https://www.zscaler.com/blogs/security-research/cve-2026-111497-node2shell-http2shell-vulnerability-may-allow-rce"]
  - claim_id: a70fdd0d55
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "section 2026-11-01T13:56:19Z"
    kind: cited
    text: "Datadog, which reproduced the bug, finds no conventional indicators because no attacker infrastructure is involved and lays out three layers to correlate ("
    urls: ["https://securitylabs.datadoghq.com/articles/node2shell-cve-2026-111497-nodejs-brotli-decoder/"]
  - claim_id: 81f33bfcc0
