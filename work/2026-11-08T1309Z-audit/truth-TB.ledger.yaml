    entry: 2026-11-06/storm-2603-fileless-toolshell-virtualpathprovider-shell
    surface: "headline"
    kind: frontmatter
    text: "Storm-2603-linked SharePoint intrusion: memory-only VirtualPathProvider shell in w3wp.exe, then Velociraptor and tunnels"
  - claim_id: b56e6000f2
    entry: 2026-11-06/storm-2603-fileless-toolshell-virtualpathprovider-shell
    surface: "summary"
    kind: frontmatter
    text: "Kaspersky's retrospective of a December intrusion at a customer's on-premises SharePoint server, which it attributes to Storm-2603 with moderate confidence, shows a ToolShell exploit that left no file on disk: a C# memory shell registered as an ASP.NET VirtualPathProvider inside the IIS worker process w3wp.exe, dormant until a specific User-Agent arrived, with an suo5 proxy that turned the SharePoint host into a pivot. The actor then installed an outdated Velociraptor and several tunnelling mechanisms so access outlived the worker process, and Kaspersky's endpoint product blocked the Warlock encryption attempt."
  - claim_id: 4400cdd86e
    entry: 2026-11-06/storm-2603-fileless-toolshell-virtualpathprovider-shell
    surface: "body"
    kind: cited
    text: "Kaspersky's retrospective analysis of a December intrusion at a customer's on-premises SharePoint server found activity consistent with Storm-2603, with the access and control layer held entirely inside the IIS worker process w3wp.exe and nothing written to disk ("
    urls: ["https://securelist.com/storm-2603-fileless-toolshell-attack/121467/"]
  - claim_id: 6708be4d47
    entry: 2026-11-06/storm-2603-fileless-toolshell-virtualpathprovider-shell
    surface: "body"
    kind: cited
    text: "On December 20 a single request to a SharePoint administrative endpoint tied to the ToolPane component fingerprinted the host for ToolShell (CVE-2025-53770); the full exploit chain ran on December 24 against the same endpoint, and the gap kept the probe from being correlated with it ("
    urls: ["https://securelist.com/storm-2603-fileless-toolshell-attack/121467/"]
  - claim_id: a8e52f58dc
    entry: 2026-11-06/storm-2603-fileless-toolshell-virtualpathprovider-shell
    surface: "body"
    kind: cited
    text: "The payload was loaded into the ASP.NET runtime and lost when the application pool recycled or IIS restarted ("
    urls: ["https://securelist.com/storm-2603-fileless-toolshell-attack/121467/"]
  - claim_id: a41db69b1f
    entry: 2026-11-06/storm-2603-fileless-toolshell-virtualpathprovider-shell
    surface: "body"
    kind: cited
    text: "The memory shell registers a custom VirtualPathProvider through a non-public method of the ASP.NET HostingEnvironment class, subverts trust controls so that the registration works even in a precompiled application, intercepts requests at the GetCacheKey() hook and stays dormant unless a specific User-Agent header arrives ("
    urls: ["https://securelist.com/storm-2603-fileless-toolshell-attack/121467/"]
  - claim_id: 1a36b80106
    entry: 2026-11-06/storm-2603-fileless-toolshell-virtualpathprovider-shell
    surface: "body"
    kind: cited
    text: "It speaks a custom XOR-obfuscated binary protocol, and the open-source suo5 tool proxies traffic so connections from the command server reach arbitrary hosts inside the network through the SharePoint server ("
    urls: ["https://securelist.com/storm-2603-fileless-toolshell-attack/121467/"]
  - claim_id: 13839c8a2a
    entry: 2026-11-06/storm-2603-fileless-toolshell-virtualpathprovider-shell
    surface: "body"
    kind: cited
    text: "It reaches SYSTEM by named-pipe token impersonation adapted from EfsPotato and creates administrative accounts through native SAM RPC calls ("
    urls: ["https://securelist.com/storm-2603-fileless-toolshell-attack/121467/"]
  - claim_id: 25b1c0e9cf
    entry: 2026-11-06/storm-2603-fileless-toolshell-virtualpathprovider-shell
    surface: "body"
    kind: cited
    text: "Shortly after the injection w3wp.exe started msiexec.exe to install a remote MSI that was Velociraptor 0.73.4.0, vulnerable to CVE-2025-6264, which the actor used for persistence, discovery, data collection and payload execution and to deploy Zoho Assist unattended access, a VS Code CLI tunnel, Cloudflare Tunnel and a reverse proxy, so access no longer depended on the IIS process ("
    urls: ["https://securelist.com/storm-2603-fileless-toolshell-attack/121467/"]
  - claim_id: 46cee7c1a3
    entry: 2026-11-06/storm-2603-fileless-toolshell-virtualpathprovider-shell
    surface: "body"
    kind: cited
    text: "The actor then uploaded a vulnerable driver that is used to terminate EDR products and sideloaded a DLL that Kaspersky identified as Warlock ransomware's AV killer, possibly meant to use that driver; Kaspersky's endpoint product blocked the ransomware process ("
    urls: ["https://securelist.com/storm-2603-fileless-toolshell-attack/121467/"]
  - claim_id: 22ffb2ff82
    entry: 2026-11-06/storm-2603-fileless-toolshell-virtualpathprovider-shell
    surface: "body"
    kind: cited
    text: "**Exposure:** an internet-reachable on-premises SharePoint Server on which ToolShell (CVE-2025-53770 and CVE-2025-53771) is exploitable ("
    urls: ["https://securelist.com/storm-2603-fileless-toolshell-attack/121467/"]
  - claim_id: c67717a0a0
    entry: 2026-11-06/storm-2603-fileless-toolshell-virtualpathprovider-shell
    surface: "body"
    kind: cited
    text: "**Detection:** in CLR loader telemetry, a dynamically compiled App_Web_toolpane assembly and a Microsoft.GeneratedCode assembly loading in the same application domain after a ToolPane request; in the IIS-Configuration ETW provider, events 25 and 47 for a path without the file-change-monitor events 17, 18, 19 and 21 that a real file produces, checked against an allow-list of legitimate VirtualPathProvider implementations; and memory inspection of w3wp.exe ("
    urls: ["https://securelist.com/storm-2603-fileless-toolshell-attack/121467/"]
  - claim_id: 60b75e5cee
    entry: 2026-11-06/storm-2603-fileless-toolshell-virtualpathprovider-shell
    surface: "body"
    kind: cited
    text: "**Triage:** App_Web_* assemblies come from ordinary ASP.NET page compilation and Microsoft.GeneratedCode from legitimate XmlSerializer use, so neither is a signal alone; the signal is the pair in one application domain right after a ToolPane request, and any VirtualPathProvider that is not on the application's inventory ("
    urls: ["https://securelist.com/storm-2603-fileless-toolshell-attack/121467/"]
  - claim_id: c2a7400bc7
    entry: 2026-11-06/storm-2603-fileless-toolshell-virtualpathprovider-shell
    surface: "body"
    kind: cited
    text: "The December 20 probe came from infrastructure associated with ONYPHE, an attack-surface discovery platform whose vulnerability checks use non-intrusive probes, so a probe alone looks like a benign scanner; Kaspersky's retrospective analysis established the probe as the initial phase of the intrusion that followed on the same endpoint ("
    urls: ["https://securelist.com/storm-2603-fileless-toolshell-attack/121467/"]
  - claim_id: 72705db86b
    entry: 2026-11-06/storm-2603-fileless-toolshell-virtualpathprovider-shell
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** on a SharePoint host that shows a code-execution exploit, contain the host, hunt the persistence that was installed afterwards, and rotate credentials and the exposed ASP.NET MachineKey; removing the initial shell or known indicators is not enough ("
    urls: ["https://securelist.com/storm-2603-fileless-toolshell-attack/121467/"]
  - claim_id: 1eeadba6d3
    entry: 2026-11-06/storm-2603-fileless-toolshell-virtualpathprovider-shell
    surface: "body"
    kind: derived
    text: "Hunt for VirtualPathProvider implants with the ETW pattern above on SharePoint farms that were exposed to ToolShell."
