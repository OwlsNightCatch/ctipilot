    entry: 2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack
    surface: "record 2026-10-14T03:44:00Z"
    kind: record-summary
    text: "CERT-FR revised its alert on 2026-10-13 to add Copeland xweb and Dixell xweb to the compromised controllers, says campaigns are probably still running, and says a factory reset alone is insufficient on an unpatched end-of-life unit. NCSC Switzerland published an advisory rating the activity actively exploited and naming the current AK-SM 800A on outdated firmware, and Danfoss says that is the case for the affected current units. Blick reports that Migros uses the same Danfoss systems in a limited number of Swiss stores and sees no sign they were targeted."
  - claim_id: 8d65451885
    entry: 2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack
    surface: "record 2026-10-15T03:49:00Z"
    kind: record-summary
    text: "Censys's exposure report of 2026-10-14 points to three published 2025 AK-SM 800A flaws that Danfoss patched more than a year earlier and gives their firmware boundaries (4.3.1 or later fixes all three; Danfoss has not confirmed the vector), and shows exposed French controllers falling about 71 percent in three days with patched and unpatched builds leaving at the same rate, which Censys reads as operators taking units offline rather than patching."
  - claim_id: 239fb85db9
    entry: 2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack
    surface: "record 2026-10-18T03:33:00Z"
    kind: record-summary
    text: "CERT-FR's alert has a third version dated 2026-10-16 whose guidance differs for compromised and uncompromised units: the whole configuration, defrost ranges included, is to be checked, and a compromised Danfoss unit is to be restarted or otherwise factory-reset and reconfigured, with a caution to check insurance conditions before cutting the contractor's data uplink. The Dixell France operator guide that the alert links says any XWEB PRO on firmware 1.12.1 or earlier must be updated without delay, that XWEB units ship with a factory Admin account, and that remote access must go through an encrypted VPN; neither document names an entry vector."
  - claim_id: 99191be6dc
    entry: 2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack
    surface: "record 2026-10-19T04:06:00Z"
    kind: record-summary
    text: "The Dixell France guide that CERT-FR links was replaced on 2026-10-18 and now carries Copeland's own bulletin of 14 October 2026, which acknowledges the vulnerability on a discontinued, end-of-life generation of XWEB EVO controllers, says to remove every XWEB EVO from the public internet at once, gives a restore procedure and says to check product temperatures in the cabinets directly; the earlier statements about XWEB PRO firmware 1.12.1, a CISA advisory and a March 2024 bulletin are no longer on that page and are removed. Le Monde's report that the defrost operation was lengthened from one hour to eight so that alarms trigger late, and SecurityWeek's figure of about 700 supermarkets, the prosecutor's report of fires and the absence of a claim or ransom demand, are added, with Cybersecurity Dive's report that Copeland confirmed the flaw was found in discontinued controllers."
  - claim_id: 6db9bab8e2
    entry: 2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack
    surface: "record 2026-10-19T21:00:14Z"
    kind: record-summary
    text: "The Defender takeaway says, as CERT-FR does, that a factory reset removes the compromised instance's persistence, instead of 'the implant'."
  - claim_id: 10c36ea0b2
    entry: 2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack
    surface: "record 2026-10-25T03:37:30Z"
    kind: record-summary
    text: "ANSSI's director general told the French Senate on 2026-10-21 that elementary flaws were exploited, starting with controllers directly on the internet, administered without particular protection, and weak passwords, not vulnerabilities researchers had published, so a firmware update alone does not close the exposure. Forescout, on 2026-10-22, counts 12,976 exposed service observations in 99 countries, 3,762 exposed Danfoss StoreView observations on AK-SM 800A units, 80 percent of the 4,697 StoreView observations, on firmware older than 4.3.1, and over 20 hacktivist-claimed refrigeration attacks since January 2026, and says the French access vector remains unconfirmed."
  - claim_id: 73b6b59815
    entry: 2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack
    surface: "record 2026-10-25T13:39:27Z"
    kind: record-summary
    text: "The 2026-10-25 section said Forescout's 20-plus claimed refrigeration attacks were mostly by Z-Pentest Alliance and NoName057(16); Forescout calls them the most active groups, and the sentence now says so."
  - claim_id: a9276e20b0
    entry: 2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack
    surface: "record 2026-11-02T03:47:57Z"
    kind: record-summary
    text: "Reuters reports that the Pentagon treats late-August freezer failures at at least six US military commissaries as a suspected hack, with Cyber Command and Army investigators in touch with their French counterparts, and Nextgov adds that two people familiar with the matter say US officials suspect Iran-linked hackers; neither says how the intruders got in, and no official has attributed the activity on the record."
  - claim_id: 2465b12f4a
    entry: 2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack
    surface: "record 2026-11-03T03:45:49Z"
    kind: record-summary
    text: "The attacks returned on 2026-11-02 across Belgium, Luxembourg, the Netherlands, Sweden, Ireland and Estonia, and Finland per The Guardian: BleepingComputer counts more than 115 stores and says it is unclear whether the attacks were coordinated, Sabcobel says its sites were hit through the same vulnerability as in France, Euronews names Danfoss as the software supplier in both incidents while CyberInsider says the manufacturer and access method of the new wave remain unknown, and Coop Switzerland says attempts against it failed."
  - claim_id: 65d062216a
    entry: 2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack
    surface: "record 2026-11-04T03:30:36Z"
    kind: record-summary
    text: "The attacks reached Germany: heise reports an Edeka market in Reisbach whose cooling systems were heated to 50 degrees overnight into 2 November, WDR quotes a CAP supermarket manager saying the attack hit the firm that maintains the cooling plants remotely and reports that Rewe's head office confirmed an attack aimed at Danfoss; SentinelLABS says responsibility has not been publicly established; and Le Canard enchaîné reports that cold rooms of a contractor of the French blood service were programmed to 110 degrees overnight on 1 to 2 November, with no source tying that case to these controllers."
  - claim_id: 0a3f4be5c9
    entry: 2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack
    surface: "record 2026-11-05T04:02:44Z"
    kind: record-summary
    text: "The French blood service EFS confirmed that an incident at its refrigeration supplier on 2 November altered the temperature and defrost thresholds of cold rooms at three of its sites, caught by its own alarms with no loss of blood products, so the case no longer rests on Le Canard enchaîné alone; ENISA, the European Commission, Europol and the CSIRTs Network advised organisations on 2026-11-04 to take immediate action, CSIRT Italia issued cold-chain measures, and no source ties the blood-service case to the Danfoss, Copeland or Dixell controllers."
  - claim_id: 71a7311e51
    entry: 2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack
    surface: "record 2026-11-06T03:44:30Z"
    kind: record-summary
    text: "SRF reported on 2026-11-05 the first publicly known cases of the refrigeration attacks in Switzerland, a butcher in Köniz whose freezer reached 50 to 70 degrees and three Volg stores with changed cooling parameters; BACS has received one reportable notification about an attack on commercial refrigeration, and CISA, FBI, HHS, USDA and DOT published a joint fact sheet on refrigeration and cold-chain controllers that names no vendor, CVE or actor. No source names the controller make or the access route in the Swiss cases."
  - claim_id: 47eda3b8ea
    entry: 2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack
    surface: "record 2026-11-07T03:53:29Z"
    kind: record-summary
    text: "NCSC Switzerland updated its advisory on 2026-11-06 with the Swiss incidents, Copeland and Dixell XWEB and healthcare, a four-point checklist for refrigeration management systems across all relevant operations, supplier-managed equipment included, and the statement that the public information does not establish a common attack method or confirm exploitation of the Danfoss CVEs it lists. Ransom-ISAC published the event log of one internet-reachable Copeland XWEB Pro compromise (743 parameter writes in two administrator sessions, default credentials claimed without published evidence), and Unit 42 counts over 5,000 exposed devices across countries on 5 and 6 November and a falling count in France since October."
  - claim_id: 4a83d481a0
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "headline"
    kind: frontmatter
    text: "Node2Shell Brotli flaw is now on CISA KEV, with exploit traffic seen against Node.js 24.22.0; update now"
  - claim_id: 6292805806
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "summary"
    kind: frontmatter
    text: "CISA added CVE-2026-111497, an out-of-bounds write in the Brotli decoder bundled with Node.js, to its Known Exploited Vulnerabilities catalog on 2026-10-27 on evidence of active exploitation, and ELLIO's sensors recorded exploit traffic against Node.js 24.22.0 on 2026-10-26, though its own copy of the attacker's chain got no shell. Node.js 22.23.4, 24.22.1 and 26.12.1 fix it, and because the flaw is in Google's decoder the PyPI packages Brotli (1.2.1) and brotlicffi (1.2.1.0), Envoy, Microsoft .NET, PHP for Windows, Ubuntu and, with Brotli inspection and TLS decryption enabled, PAN-OS 12.2, 12.1 and 11.2 firewalls carry it too; Palo Alto and Cisco report no malicious use against their own products. Broadcom lists VMware Cloud Foundation's SDDC Manager 9.1.1.x as critically affected (CVSS 3.1 9.8), with the patch pending and only workarounds available, and Splunk lists Splunk Enterprise 10.0 and lower among the products that include affected Node.js packages, with 10.2 or later as the upgrade target and its Visual Exporter app to be disabled."
  - claim_id: 5dadcddaac
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "actions[0]"
    kind: frontmatter
    text: "Update every Node.js 22.x, 24.x and 26.x runtime to 22.23.4, 24.22.1 or 26.12.1, including the Node binary inside container images (a Dockerfile that pins 24.22.0 keeps the flaw until the pin changes), and upgrade the PyPI Brotli package to 1.2.1 and brotlicffi to 1.2.1.0 wherever either is installed; judge a Node.js build by its release version, because process.versions.brotli reads 1.2.0 on patched builds too, and move any application on an end-of-life Node.js line to a supported release. On every WordPress host, upgrade the operating system's libbrotli package to a patched revision (check the package revision, because Debian and Ubuntu backport the fix into 1.1.0) and rebuild WordPress container images, since the official wordpress:latest image still carried a vulnerable libbrotli1 when Patchstack wrote."
  - claim_id: ab54d3b26a
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "actions[1]"
    kind: frontmatter
    text: "Update every Envoy proxy that has the Brotli decompressor configured to v1.40.0, v1.39.3, v1.38.6, v1.37.8 or v1.36.12; the advisory names v1.39.2, v1.38.5, v1.37.7 and v1.36.11 as vulnerable. On every VMware Cloud Foundation SDDC Manager apply Broadcom's workaround, KB460732 on 9.1.1 and KB460734 on 9.1.0, 9.0.x and 5.2.x, until its patch ships. Upgrade every Splunk Enterprise 10.0 and lower to 10.2 or higher and disable or remove the Splunk Visual Exporter app on every Splunk Enterprise instance, because the upgrade does not remediate it, and install Citrix hotfix 2609.1, 2508 CU2 LTSR or 2605.1-3 on Unicon eLux Scout."
  - claim_id: db4549048d
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "actions[2]"
    kind: frontmatter
    text: "On every PA-Series and VM-Series firewall on PAN-OS 12.2, 12.1 or 11.2 that has TLS decryption enabled, run show system setting brotli and, where it returns Enabled: yes, run set system setting brotli-encoding disable until the hotfix for the release is installed; Palo Alto's timeline of 2026-10-29 lists every PAN-OS hotfix for this flaw as released."
  - claim_id: 7cdedb7f84
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "cves[CVE-2026-111497]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-111497\", \"cvss\": \"9.2 (CVSS 4.0)\", \"status\": [\"exploited\", \"cisa-kev\", \"poc-public\", \"patch-available\"], \"affected\": \"Node.js 22.x, 24.x and 26.x before 22.23.4, 24.22.1 and 26.12.1; Google Brotli 1.0.3 to 1.2.0; PyPI Brotli up to 1.2.0; PyPI brotlicffi up to 1.2.0.2; Bun 1.0.21 to before 1.4.4; Istio before 1.29.9, 1.30.6 and 1.31.2; Envoy v1.39.2, v1.38.5, v1.37.7 and v1.36.11 with the Brotli decompressor configured; .NET before 8.0.33, 9.0.22 and 10.0.14 where Brotli data from untrusted parties is decompressed; PAN-OS 12.2 before 12.2.4-h1, 12.1 before 12.1.4-h13, 12.1.7-h11 and 12.1.10-h3, and 11.2 before 11.2.4-h23, 11.2.7-h23, 11.2.10-h17, 11.2.13-h4 and 11.2.16-h1, on PA-Series and VM-Series firewalls with Brotli inspection and TLS decryption enabled (PAN-OS 11.1 and 10.2 and the management interface are not affected); PHP for Windows builds without the -1 suffix, through the cURL extension when automatic decompression is enabled; Ubuntu, Debian and Alpine brotli packages and the Ruby brotli gem before the fixed builds listed; VMware Cloud Foundation SDDC Manager 9.1.1 (critical, CVSS 3.1 9.8) and 9.1.0, 9.0.x and 5.2.x (important, 7.5); Palo Alto Networks Prisma Cloud Application Security Transporter Client before 0.2.9; Splunk Enterprise 10.0 and lower, Splunk Visual Exporter (every Splunk Enterprise version), Splunk SOAR Automation Broker, Splunk UBA and Splunk Attack Analyzer, which Splunk lists as including packages affected by this and three further Node.js flaws; Citrix Unicon eLux Scout On-Prem, Scout On-Prem LTSR and Scout Cloud Gateway On-Prem (no version range stated)\", \"fixed\": \"Node.js 22.23.4, 24.22.1, 26.12.1; Google Brotli 1.0.10, 1.1.1, 1.2.1; PyPI Brotli 1.2.1; PyPI brotlicffi 1.2.1.0; Bun 1.4.4; Istio 1.29.9, 1.30.6, 1.31.2; Envoy v1.40.0, v1.39.3, v1.38.6, v1.37.8, v1.36.12; .NET 8.0.33, 9.0.22, 10.0.14; PAN-OS hotfixes 12.2.4-h1, 12.1.4-h13, 12.1.7-h11, 12.1.10-h3, 11.2.4-h23, 11.2.7-h23, 11.2.10-h17, 11.2.13-h4 and 11.2.16-h1 (all released, as read on 2026-10-29); PHP for Windows 8.5.12-1, 8.4.27-1, 8.3.36-1, 8.2.35-1; Ubuntu brotli 1.2.0-4ubuntu0.1 (26.10), 1.2.0-3ubuntu0.1 (26.04), 1.1.0-2ubuntu0.1 (24.04), 1.0.9-2ubuntu0.1 (22.04), ESM 1.0.7-6ubuntu0.1+esm1 (20.04, whose nodejs package stays vulnerable); Debian brotli 1.0.9-2+deb12u1 (bookworm) and 1.1.0-2+deb13u1 (trixie); Alpine brotli 1.2.1-r0 (edge, 3.24, 3.23) and 1.1.1-r0 (3.21); Ruby brotli gem 0.9.1 and 0.9.2; SDDC Manager none yet, patch pending, workarounds KB460732 (9.1.1) and KB460734 (9.1.0, 9.0.x, 5.2.x); Prisma Cloud Application Security Transporter Client 0.2.9; Splunk Enterprise 10.2 or higher for the bundled Node.js runtime (no fixed 10.0 build or date), Splunk Visual Exporter none (disable or remove the app), no fix stated for the other Splunk products; Citrix Scout On-Prem hotfix 2609.1, Scout On-Prem LTSR 2508 CU2 LTSR, Scout Cloud Gateway On-Prem 2605.1-3\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
  - claim_id: 13c835c243
