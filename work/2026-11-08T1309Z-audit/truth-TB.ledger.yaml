    surface: "section 2026-11-07T03:53:29Z"
    kind: cited
    text: "Ransom-ISAC published the event log of a Copeland XWEB Pro controller, reportedly on firmware 1.9.0 and reachable through a public address, compromised on 2 November: two Administrator sessions from different external addresses read parameters across 31 devices, then made 588 writes across 26 devices in about six minutes, which Ransom-ISAC reads as scripted or bulk programming rather than manual edits, and 155 further writes across five cold rooms, moving setpoints to 110 and 150 degrees C and recording keypad-lock, alarm-mute and defrost commands ("
