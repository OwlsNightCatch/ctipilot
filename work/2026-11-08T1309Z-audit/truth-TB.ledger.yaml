    surface: "section 2026-10-27T03:43:51Z"
    kind: cited
    text: "Palo Alto Networks lists PAN-OS 12.2 before 12.2.4-h1, 12.1 before 12.1.4-h13, 12.1.7-h11 and 12.1.10-h3, and 11.2 before 11.2.4-h23, 11.2.7-h23, 11.2.10-h17, 11.2.13-h4 and 11.2.16-h1 as affected, but only on PA-Series and VM-Series firewalls that have inspection of Brotli-compressed traffic and TLS decryption enabled on the dataplane; PAN-OS 11.1 and 10.2 and the management interface are not affected, and the hotfixes carry estimated dates from 2026-10-27 to 2026-10-30 ("
    urls: ["https://security.paloaltonetworks.com/CVE-2026-111497"]
