    surface: "section 2026-11-01T13:56:19Z"
    kind: cited
    text: "Payload byte signatures, WAF content matching and body-size limits do not catch it, because the WAF forwards compressed bytes and the middleware counts decompressed size ("
    urls: ["https://securitylabs.datadoghq.com/articles/node2shell-cve-2026-111497-nodejs-brotli-decoder/"]
  - claim_id: a0d6344f12
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "section 2026-11-01T13:56:19Z"
    kind: cited
    text: "Palo Alto's advisory also lists Prisma Cloud Application Security Transporter Client before 0.2.9 as affected, fixed in 0.2.9 ("
    urls: ["https://security.paloaltonetworks.com/CVE-2026-111497"]
  - claim_id: 8f3490db4e
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "section 2026-11-03T03:43:03Z"
    kind: cited
    text: "Patchstack reports that WordPress ships no Brotli of its own but links the operating system's libbrotli through libcurl, so one unauthenticated POST to xmlrpc.php can take down a PHP worker on a stock install: the pingback method makes WordPress fetch an attacker-named URL and decode the Brotli reply ("
    urls: ["https://patchstack.com/articles/wordpress-doesnt-ship-brotli-its-still-exposed-to-cve-2026-111497/"]
  - claim_id: 5255cff4f9
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "section 2026-11-03T03:43:03Z"
    kind: cited
    text: "A laboratory demonstration killed a worker or pinned it at full CPU, its author says no code execution is included, and Patchstack says no public chain aims at PHP; the fix is a patched libbrotli package, and the official wordpress:latest image still carried a vulnerable one when Patchstack wrote ("
    urls: ["https://patchstack.com/articles/wordpress-doesnt-ship-brotli-its-still-exposed-to-cve-2026-111497/"]
  - claim_id: c79cdc0b68
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "section 2026-11-05T03:52:52Z"
    kind: cited
    text: "Splunk's advisory SVD-2026-1015, published on 2026-10-28 and updated on 2026-11-04, lists Splunk Enterprise, the Splunk Visual Exporter app, SOAR Automation Broker, UBA, Attack Analyzer, Python for Scientific Computing, several AppDynamics components and Smartlook as including packages affected by four Node.js flaws, CVE-2026-111497 among them; the page gives no CVSS score, no attacker position and no exploitation statement, and it covers the Brotli flaw and three DNS and TLS hostname-validation flaws together, so it does not show which of them reaches a given product ("
    urls: ["https://advisory.splunk.com/advisories/SVD-2026-1015"]
  - claim_id: 3210725b06
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "section 2026-11-05T03:52:52Z"
    kind: cited
    text: "Splunk Enterprise 10.0 and lower is vulnerable, Splunk recommends upgrading to 10.2 or higher for the bundled Node.js runtime and plans to upgrade the packages in a future 10.0 release, and the upgrade does not remediate the Visual Exporter app, which every Splunk Enterprise version includes and which Splunk says to disable or remove ("
    urls: ["https://advisory.splunk.com/advisories/SVD-2026-1015"]
  - claim_id: c7bf48b5d4
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "section 2026-11-05T03:52:52Z"
    kind: cited
    text: "Citrix bulletin CTX697300, published on 2026-10-30 and revised on 2026-11-03 with remediation for the LTSR and Cloud Gateway products, lists Unicon eLux Scout as affected by CVE-2026-111497 alone and names the fixes as hotfix 2609.1 for Scout On-Prem, 2508 CU2 LTSR for Scout On-Prem LTSR and 2605.1-3 for Scout Cloud Gateway On-Prem, without a vulnerable version range or an exploitation statement ("
    urls: ["https://support.citrix.com/external/article/CTX697300/citrix-security-advisory-for-cve-2026-11.html"]
  - claim_id: 8188288991
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "section 2026-11-05T03:52:52Z"
    kind: uncited
    text: "The page gives no fix for the other listed products."
  - claim_id: 4e5f609763
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "section 2026-11-05T03:52:52Z"
    kind: uncited
    text: "Neither Splunk nor Citrix says anything on malicious use against its products."
  - claim_id: 0c03faf70a
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "record 2026-10-26T03:40:22Z"
    kind: record-summary
    text: "Envoy and Microsoft have shipped fixes for the same Brotli decoder flaw: Envoy's advisory of 2026-10-23 lists v1.40.0, v1.39.3, v1.38.6, v1.37.8 and v1.36.12 for deployments with the Brotli decompressor configured, and Microsoft's out-of-band .NET release of 2026-10-25 (8.0.33, 9.0.22, 10.0.14) covers applications that decompress attacker-controlled Brotli data. Still no source reports exploitation outside Imperva's laboratory demonstration."
  - claim_id: 0a40922f5f
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "record 2026-10-27T03:43:51Z"
    kind: record-summary
    text: "NCSC Switzerland rates exploitation of the Brotli flaw unknown with a proof of concept available and names rejecting Content-Encoding: br as the interim measure; Palo Alto lists PAN-OS 12.2, 12.1 and 11.2 firewalls that inspect Brotli traffic with TLS decryption enabled (hotfixes due by 2026-10-30), and PHP for Windows and Ubuntu shipped fixes. Still no source reports exploitation outside Imperva's laboratory demonstration."
  - claim_id: 8826d8fe8d
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "record 2026-10-28T03:40:27Z"
    kind: record-summary
    text: "CISA added CVE-2026-111497 to its Known Exploited Vulnerabilities catalog on 2026-10-27 on evidence of active exploitation, and ELLIO's sensors recorded exploit traffic against Node.js 24.22.0 on 2026-10-26; JFrog shows the decoder reachable beyond HTTP and Cisco and Palo Alto report no malicious use against their products. The entry's earlier statement that no source reports exploitation is replaced, the priority moves from notable to high. Palo Alto's advisory, as read on 2026-10-28, shows six of its nine PAN-OS hotfixes released and three due on 2026-10-29 and 2026-10-30."
  - claim_id: e9ff81252a
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "record 2026-10-29T07:03:00Z"
    kind: record-summary
    text: "Broadcom's advisory VMSA-2026-0008.1 lists VMware Cloud Foundation's SDDC Manager as affected, critical (CVSS 3.1 9.8) on 9.1.1 and important (7.5) on 9.1.0, 9.0.x and 5.2.x, with the patch pending and workarounds only; the SDDC Manager workaround is added to the actions. Palo Alto's timeline of 2026-10-29 records the last three PAN-OS hotfixes (11.2.4-h23, 12.1.4-h13 and 12.1.10-h3) as released, so the PAN-OS action no longer says they are due. Removed from the main text: ELLIO's reading of the attacker as a mass-exploitation operator and its count of 50 attempts (the 2026-10-28 section still carries them). The Ubuntu 20.04 entry in the CVE record now shows the ESM fix."
  - claim_id: 3424e085bc
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "record 2026-11-01T13:56:19Z"
    kind: record-summary
    text: "An earlier section's statement that no source reported exploitation outside the laboratory is dated to the day it held; NCSC Switzerland now rates the flaw actively exploited, and Zscaler's first-day decoy telemetry joins ELLIO's. Datadog's detection layers (decoder errors, worker crashes, leaked decompressed output) and what does not catch the attack are added, as is Palo Alto's Prisma Cloud Transporter Client."
  - claim_id: 4ed6036fe8
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "record 2026-11-03T03:43:03Z"
    kind: record-summary
    text: "Patchstack reports that default WordPress installs reach the Brotli decoder without authentication through the xmlrpc.php pingback and the operating system's libbrotli, shown to crash a worker but not to execute code; WordPress hosts need a patched libbrotli package, which the official WordPress image did not yet carry."
  - claim_id: 5344eebfa7
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "record 2026-11-05T03:52:52Z"
    kind: record-summary
    text: "Splunk's advisory lists Splunk Enterprise 10.0 and lower, its Visual Exporter app, SOAR Automation Broker, UBA and Attack Analyzer as including packages affected by four Node.js flaws, CVE-2026-111497 among them, with Splunk Enterprise 10.2 or higher as the upgrade target and the Visual Exporter app to be disabled, and Citrix names Unicon eLux Scout with hotfix 2609.1, 2508 CU2 LTSR and 2605.1-3 as the fixes."
  - claim_id: b8148bfea8
    entry: 2026-11-07/cve-2026-111497-brotli-desigo-cc-mitel-openscape-cisco-duo
    surface: "headline"
    kind: frontmatter
    text: "Brotli flaw hits Desigo CC, Industrial Edge and Mitel; Cisco lists Duo; Mitel and Common Configurator fixes pending"
  - claim_id: 4683033f62
    entry: 2026-11-07/cve-2026-111497-brotli-desigo-cc-mitel-openscape-cisco-duo
    surface: "summary"
    kind: frontmatter
    text: "Between 2026-10-27 and 2026-11-06 Siemens, Mitel and Cisco listed affected products in advisories that cover the Brotli decoder flaw CVE-2026-111497: Siemens names Desigo CC V8 and V9 (remedy: the latest .NET security updates) and Industrial Edge, where Common Configurator has no fix; Mitel names MiVoice Business and five OpenScape products with updates planned and workaround articles for three; Cisco's combined advisory lists Duo Network Gateway (3.4.2) and RoomOS among its products with fixes, a longer list of which is dated up to 2027, without saying which of its CVEs each fix addresses. Cisco says it is not aware of malicious use against any Cisco product, and CISA lists the flaw as exploited."
  - claim_id: 1bd08f6ef2
    entry: 2026-11-07/cve-2026-111497-brotli-desigo-cc-mitel-openscape-cisco-duo
    surface: "actions[0]"
    kind: frontmatter
    text: "Install the latest .NET security updates through Windows Update on every Siemens Desigo CC V8 and V9 host."
  - claim_id: b9d5a55305
    entry: 2026-11-07/cve-2026-111497-brotli-desigo-cc-mitel-openscape-cisco-duo
    surface: "actions[1]"
    kind: frontmatter
    text: "On every Industrial Edge Management instance running Common Configurator, uninstall all Management Applications and put the instance behind a firewall or WAF, and stop Common Configurator on Edge devices, until Siemens ships a fix, because Siemens lists no fix for it."
  - claim_id: 2d45f61f41
