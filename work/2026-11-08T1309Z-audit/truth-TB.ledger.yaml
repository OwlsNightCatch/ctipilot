    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "section 2026-10-26T03:40:22Z"
    kind: cited
    text: "Envoy's advisory of 2026-10-23 says a buffer overflow in its Brotli decompressor allows a remote unauthenticated attacker to corrupt adjacent decoder state memory, disclose sensitive memory contents, cause a denial of service or potentially execute arbitrary code with a crafted Brotli-compressed stream; it names v1.39.2, v1.38.5, v1.37.7 and v1.36.11 as vulnerable, v1.40.0, v1.39.3, v1.38.6, v1.37.8 and v1.36.12 as fixed, and limits the impact to deployments that have the Brotli decompressor configured ("
    urls: ["https://github.com/envoyproxy/envoy/security/advisories/GHSA-3wvj-j6qm-62mr"]
  - claim_id: 7b3fa9eb15
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "section 2026-10-26T03:40:22Z"
    kind: cited
    text: "Microsoft's out-of-band .NET release of 2026-10-25 (8.0.33, 9.0.22, 10.0.14 and 11 Release Candidate 3) fixes the same CVE, and an application is exposed only when it decompresses attacker-controlled Brotli data through ASP.NET Core request decompression, HttpClient automatic decompression or the Brotli APIs ("
    urls: ["https://github.com/dotnet/announcements/issues/494", "https://devblogs.microsoft.com/dotnet/dotnet-october-2026-oob-security-updates/"]
  - claim_id: d4a0d89620
