  - claim_id: 97e7bde6d4
    entry: 2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack
    surface: "summary"
    kind: frontmatter
    text: "Coopérative U, Intermarché and E. Leclerc confirmed to AFP a cyberattack on their refrigeration systems overnight on 11 to 12 October 2026, a remotely forced defrost at hundreds of French stores; on 2026-11-02 more than 115 stores in at least six more countries and the first German shops followed. The French blood service EFS confirmed on 2026-11-03 that an incident at its refrigeration supplier altered the temperature and defrost thresholds of cold rooms at three EFS sites on 2 November, caught by its own alarms with no loss of blood products, and ENISA, the European Commission, Europol and the CSIRTs Network advised organisations on 2026-11-04 to take immediate action to mitigate exposure; no source ties the blood-service case to the Danfoss, Copeland or Dixell controllers. SRF reported on 2026-11-05 the first publicly known cases in Switzerland, a butcher in Köniz whose freezer reached 50 to 70 degrees and three Volg stores whose cooling parameters were changed; BACS has received one reportable notification, and CISA, FBI, HHS, USDA and DOT published a joint warning on refrigeration and cold-chain controllers that names no vendor. CERT-FR reports numerous compromises of Danfoss AK-SM and AK-SC controllers and of Copeland xweb and Dixell xweb, NCSC Switzerland rates the activity actively exploited and Coop Switzerland says attempts against it failed, ANSSI says elementary flaws were exploited, controllers directly on the internet and weak passwords, and SentinelLABS says responsibility has not been publicly established. Reuters and Nextgov report that the Pentagon treats freezer failures at US military commissaries as a suspected hack. NCSC Switzerland's advisory, updated on 2026-11-06, says the public information does not establish a common attack method or confirm exploitation of the Danfoss CVEs it lists, and Ransom-ISAC's log of one Copeland XWEB Pro compromise shows 743 parameter writes in two administrator sessions, with default credentials claimed."
  - claim_id: 77cd5c82bc
    entry: 2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack
    surface: "actions[0]"
    kind: frontmatter
    text: "Find every Danfoss AK-SM and AK-SC, Copeland xweb and Dixell xweb refrigeration controller, and any other refrigeration controller with a remote management interface because not every second-wave site's vendor is confirmed, in facilities you own or that a contractor manages for you and take its management interface off the internet now, restoring access only through a secure VPN or protected network (filtering to the contractor's source addresses is an emergency stop-gap, and CERT-FR asks you to check your insurance conditions before cutting the contractor's data uplink); an end-of-life unit that gets no fixes needs replacing, because a factory reset leaves it vulnerable and probably compromised again."
  - claim_id: 146722b263
    entry: 2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack
    surface: "actions[1]"
    kind: frontmatter
    text: "On every such controller that was reachable from the internet, check the whole configuration, defrost ranges, alarm thresholds and notification recipients included, against the intended one, verify the actual temperatures and test that alarms reach staff; for a Danfoss unit that may have been taken over, restart it or otherwise factory-reset it, restore access only through a secure VPN or protected network and reconfigure it for service, then update its firmware, set the security level to Strict and replace the default and any weak passwords, and on every Copeland or Dixell XWEB unit confirm the factory Admin password was changed and give each contractor a named account with an expiry date."
