  - claim_id: 920e5f5e0f
    entry: 2026-11-07/cve-2026-19868-sonicwall-sonicos-sslvpn-saml-mfa-bypass-kev
    surface: "body"
    kind: cited
    text: "SonicWall's advisory SNWLID-2026-0014 of 2026-11-06 fixes seven SonicOS flaws on Gen7 and Gen8 firewalls, and one of them, CVE-2026-19868, is an authentication enforcement weakness in the SSLVPN service: a user with valid credentials for an alternate authentication method may bypass the SAML authentication controls, and successful exploitation may also bypass SAML-enforced multi-factor authentication ("
    urls: ["https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2026-0014"]
  - claim_id: 648b1e47c3
    entry: 2026-11-07/cve-2026-19868-sonicwall-sonicos-sslvpn-saml-mfa-bypass-kev
    surface: "body"
    kind: cited
    text: "SonicWall says the flaw only affects SSLVPN when SAML is enabled for SSLVPN logins, and scores it CVSS 3.1 7.1 as a use of single-factor authentication (CWE-308) ("
    urls: ["https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2026-0014"]
  - claim_id: e92974330f
    entry: 2026-11-07/cve-2026-19868-sonicwall-sonicos-sslvpn-saml-mfa-bypass-kev
    surface: "body"
    kind: cited
    text: "The advisory says SonicWall PSIRT \"has investigated a report indicating potential exploitation\" and urges customers to upgrade, with no workaround available ("
    urls: ["https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2026-0014"]
  - claim_id: 341745c89b
    entry: 2026-11-07/cve-2026-19868-sonicwall-sonicos-sslvpn-saml-mfa-bypass-kev
