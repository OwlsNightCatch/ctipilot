    kind: cited
    text: "**Triage:** Cisco's own discriminator is the mail_logs pattern `COPY.*TO PROGRAM`; any hit is evidence of attempted or successful exploitation and warrants incident response, not just a patch, since success implies root-level compromise and possible log tampering; a clean mail_logs result does not rule out the S/MIME injection, which left no such pattern in the module author's reproduction ("
