    kind: cited
    text: "It puts the response in an order: fully isolate the appliance from both the internet and the internal network, snapshot the file system and memory of a virtual appliance, avoid powering it off so that traces survive, place the logs under seal and analyse the appliance with the Volexity indicators, and only then, on compromise, factory-reset it, upgrade and reset the secrets ("
