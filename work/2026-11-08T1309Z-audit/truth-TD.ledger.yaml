    entry: 2026-11-07/cve-2026-19868-sonicwall-sonicos-sslvpn-saml-mfa-bypass-kev
    surface: "body"
    kind: cited
    text: "The advisory applies one table to all seven flaws: Gen7 hardware firewalls (TZ, NSa and NSsp) and Gen7 NSv up to and including 7.3.3-7015 are fixed in 7.3.4-7013 and higher, and Gen8 hardware firewalls (TZ and NSa) and Gen8 NSv up to and including 8.2.2-8015 are fixed in 8.2.3-8015 and higher ("
    urls: ["https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2026-0014"]
  - claim_id: e8483ad828
    entry: 2026-11-07/cve-2026-19868-sonicwall-sonicos-sslvpn-saml-mfa-bypass-kev
    surface: "body"
    kind: cited
    text: "It also fixes two management-interface flaws scored 8.8 that in specific conditions could potentially let a remote unauthenticated attacker perform unauthorized operations, and that need user interaction, a pre-authentication heap overflow in the SSL-VPN service that could cause a denial of service, and three lower-severity flaws; no source reports them exploited ("
    urls: ["https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2026-0014"]
  - claim_id: 7a1ad83601
    entry: 2026-11-07/cve-2026-19868-sonicwall-sonicos-sslvpn-saml-mfa-bypass-kev
    surface: "body"
    kind: cited
    text: "**Exposure:** a Gen7 or Gen8 SonicWall firewall or NSv at or below the builds above with the SSL VPN enabled and SAML configured as a login method for SSLVPN; the running SonicOS build is the first check and the SAML setting for SSLVPN the second, the vendor's stated precondition ("
    urls: ["https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2026-0014"]
  - claim_id: 2955e3f009
    entry: 2026-11-07/cve-2026-19868-sonicwall-sonicos-sslvpn-saml-mfa-bypass-kev
    surface: "body"
    kind: derived
    text: "**Detection:** the advisory gives no indicators."
  - claim_id: d9774ce26f
    entry: 2026-11-07/cve-2026-19868-sonicwall-sonicos-sslvpn-saml-mfa-bypass-kev
    surface: "body"
    kind: derived
    text: "From the stated mechanism, compare successful SSLVPN logins on the firewall with the identity provider's sign-in log: a VPN session with no matching SAML sign-in or MFA event, or a SAML-enrolled user who authenticated through another authentication method, is the signal."
  - claim_id: eaecf52c6b
    entry: 2026-11-07/cve-2026-19868-sonicwall-sonicos-sslvpn-saml-mfa-bypass-kev
    surface: "body"
    kind: derived
    text: "Patching does not evict an attacker who already holds a session or reuses the credentials, so review VPN sessions since SAML was enabled and reset the credentials of accounts that work through both authentication methods."
  - claim_id: 6e3244548a
    entry: 2026-11-07/cve-2026-19868-sonicwall-sonicos-sslvpn-saml-mfa-bypass-kev
    surface: "body"
    kind: derived
    text: "**Triage:** a legitimate SAML sign-in leaves an event at the identity provider; a login through the alternate path does not, which follows from the stated mechanism."
  - claim_id: 58ee77ea66
    entry: 2026-11-07/cve-2026-19868-sonicwall-sonicos-sslvpn-saml-mfa-bypass-kev
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** upgrade every Gen7 and Gen8 firewall that serves SAML SSLVPN logins to 7.3.4-7013 or 8.2.3-8015 or later now, because there is no workaround and the exploitation evidence is a vendor-investigated report plus CISA's listing; then review VPN sessions for logins that skipped the identity provider."
