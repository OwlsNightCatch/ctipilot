  - claim_id: f7d372e4ea
    entry: 2026-10-14/cve-2026-104935-ivanti-connect-secure-zero-day-chain-kev
    surface: "body"
    kind: uncited
    text: "A request to the public login script `welcome.cgi` names a protected script in an `X-DSCGI-PATH` header, which passes the authentication check and picks the destination."
  - claim_id: 9973a11cfc
    entry: 2026-10-14/cve-2026-104935-ivanti-connect-secure-zero-day-chain-kev
    surface: "body"
    kind: uncited
    text: "The upload script `wu.cgi` writes a file to disk before checking that it is a ZIP, and parallel requests run a Perl script before it is deleted."
