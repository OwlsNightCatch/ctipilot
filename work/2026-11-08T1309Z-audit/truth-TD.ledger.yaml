    text: "Install each Zyxel GS1900 switch's \"…(x).3C0\" build now (2.90(AAHL.3)C0 on the GS1900-24, for example), including switches already moved to the June \"…(x).2C0\" build, which Binarly shows still carries the flaw the recovered exploit targets, and audit and rotate any switch still on its factory-default admin credentials: GreyNoise found 564 of 996 exploited switches (57%) had never had theirs changed, which lets the actor re-enter even after the hashed credential set is rotated."
