    text: "watchTowr Labs published the full chain on 2026-11-05 and a detection tool: one unauthenticated request to the Email Security Gateway's login handler reaches the backup-restore function, a secret that is hard-coded in the product lets an attacker build a valid archive, and the restored timezone value reaches the root command injection, so exploitation needs no account; Barracuda changed its own advisory the same day to say authentication is not required for CVE-2026-116606. No source reports attacks."
