    surface: "section 2026-10-16T04:10:00Z"
    kind: cited
    text: "CERT-FR's alert of 2026-10-14 says Ivanti reports the vulnerability as actively exploited and that CERT-FR itself is aware of lateral movement using the LDAP and Active Directory secrets stored on the appliance ("
