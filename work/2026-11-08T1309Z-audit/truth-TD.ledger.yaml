    entry: 2026-10-14/cve-2026-104935-ivanti-connect-secure-zero-day-chain-kev
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** Upgrade to 25.1.1.3, 25.1.3.1 or 22.8R2.6 now, then treat every appliance that was exposed on an affected build as a compromise-assessment target and rotate what it could reach."
