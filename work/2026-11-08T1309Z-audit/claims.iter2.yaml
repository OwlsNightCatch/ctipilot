    entry: 2026-11-08/ibm-api-connect-hard-coded-administrative-credentials-unauth
    surface: "body"
    kind: cited
    text: "IBM's security bulletins of 2026-11-05 for API Connect, its API management platform, list more than two hundred CVEs, and 18 rows of the v12 bulletin need no privileges at CVSS 3.1 9.0 or higher; among them is CVE-2026-17360, through which a remote attacker can gain full administrative control because of hard-coded credentials, scored CVSS 3.1 9.8 on the v12 bulletin ("
    urls: ["https://www.ibm.com/support/pages/node/7295635"]
  - claim_id: f81e22530f
    entry: 2026-11-08/ibm-api-connect-hard-coded-administrative-credentials-unauth
    surface: "body"
    kind: cited
    text: "The same bulletin lists, each at 9.8 with no privileges or user interaction, OS command injection to arbitrary code execution (CVE-2026-17408), path traversal to arbitrary code execution (CVE-2026-17340), an authentication bypass through improper verification of a cryptographic signature (CVE-2026-17301), valid access tokens for other users because authentication against a connected directory service is not sufficiently enforced (CVE-2026-16720), and missing authorization that lets a remote attacker create, modify or delete tenants (CVE-2026-17362); a second hard-coded credential row, CVE-2026-17403, scores 9.0 ("
    urls: ["https://www.ibm.com/support/pages/node/7295635"]
  - claim_id: d905917808
    entry: 2026-11-08/ibm-api-connect-hard-coded-administrative-credentials-unauth
    surface: "body"
    kind: cited
    text: "The V10.0.8 bulletin carries CVE-2026-17403, CVE-2026-17408, CVE-2026-17301 and CVE-2026-16720 as well ("
    urls: ["https://www.ibm.com/support/pages/node/7295637"]
  - claim_id: 9b012cb2db
    entry: 2026-11-08/ibm-api-connect-hard-coded-administrative-credentials-unauth
    surface: "body"
    kind: cited
    text: "API Connect V12 on-premises v12.1.0.0 to v12.1.1.2 is fixed in v12.1.1.3 and V10.0.8.0 to 10.0.8.12 in 10.0.8.13; IBM lists no workaround or mitigation on either page ("
    urls: ["https://www.ibm.com/support/pages/node/7295635", "https://www.ibm.com/support/pages/node/7295637"]
  - claim_id: be2d41e0e6
    entry: 2026-11-08/ibm-api-connect-hard-coded-administrative-credentials-unauth
    surface: "body"
    kind: cited
    text: "**Exposure:** an API Connect installation in the listed ranges whose management, developer portal or gateway endpoints an attacker can reach; the bulletins give no per-component split, so every reachable endpoint counts ("
    urls: ["https://www.ibm.com/support/pages/node/7295635"]
  - claim_id: b3f527f374
    entry: 2026-11-08/ibm-api-connect-hard-coded-administrative-credentials-unauth
    surface: "body"
    kind: uncited
    text: "Neither bulletin mentions exploitation, and neither says which component each flaw sits in."
  - claim_id: 2ca880bebb
    entry: 2026-11-08/ibm-api-connect-hard-coded-administrative-credentials-unauth
    surface: "body"
    kind: derived
    text: "**Detection:** in API Connect and reverse-proxy access logs, administrative or tenant-management actions without a preceding authenticated session from an expected administrator, and access tokens issued to identities that did not authenticate against the directory; in process telemetry on the API Connect hosts, shells or interpreters spawned by the API Connect service accounts (inferences from the flaw descriptions)."
  - claim_id: 36e2951d90
    entry: 2026-11-08/ibm-api-connect-hard-coded-administrative-credentials-unauth
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** treat these as out-of-cycle updates, because the worst rows need neither credentials nor user interaction and IBM offers no workaround; after upgrading, check administrator, tenant and token-issuance events for activity nobody can account for, because patching removes the credential, not an account or token an attacker already created."
