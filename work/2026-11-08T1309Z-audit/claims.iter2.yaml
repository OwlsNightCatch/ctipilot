  - claim_id: fec04ea087
    entry: 2026-11-08/cve-2026-117691-keycloak-saml-http-redirect-signature-bypass
    surface: "headline"
    kind: frontmatter
    text: "Keycloak 26.8.2 fixes a SAML signature bypass that logs an unauthenticated attacker in as any federated user"
  - claim_id: 597339fce9
    entry: 2026-11-08/cve-2026-117691-keycloak-saml-http-redirect-signature-bypass
    surface: "summary"
    kind: frontmatter
    text: "Keycloak 26.8.2, released on 2026-11-05, fixes CVE-2026-117691 (CVSS 3.1 9.1, no privileges or user interaction): the SAML HTTP-Redirect binding processes percent-encoded parameter names such as %53AMLResponse while signature verification checks only literal names, so a crafted unsigned SAML message is processed instead of a signed one and the attacker logs in as any federated user. Red Hat, the CNA, names no usable mitigation. The release also fixes an unauthenticated single-request JVM termination in the SAML 1.1 parser (CVE-2026-110931); no source reports exploitation."
  - claim_id: 76c8748a31
    entry: 2026-11-08/cve-2026-117691-keycloak-saml-http-redirect-signature-bypass
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade every Keycloak instance that brokers a SAML identity provider or serves SAML clients to 26.8.2, internet-reachable login endpoints first."
  - claim_id: 8234068e9c
    entry: 2026-11-08/cve-2026-117691-keycloak-saml-http-redirect-signature-bypass
