    text: "IBM's two security bulletins of 2026-11-05 for API Connect fix, among many CVEs, flaws that need no privileges at CVSS 3.1 9.8: hard-coded credentials that give a remote attacker full administrative control (CVE-2026-17360, v12 only), OS command injection and path traversal to arbitrary code execution, an authentication bypass through improper signature verification, token issuance for other users and missing authorization over tenants. Affected are API Connect V12 on-premises v12.1.0.0 to v12.1.1.2 (fixed in v12.1.1.3) and V10.0.8.0 to 10.0.8.12 (fixed in 10.0.8.13); IBM lists no workaround and no source reports exploitation."
