  - claim_id: a770dcdb03
    entry: 2026-11-08/cve-2026-117691-keycloak-saml-http-redirect-signature-bypass
    surface: "body"
    kind: cited
    text: "Keycloak 26.8.2, released on 2026-11-05, fixes CVE-2026-117691, a SAML redirect binding signature bypass via a percent-encoded parameter name (%53AMLResponse) that its release notes describe as broker login as any user ("
    urls: ["https://www.keycloak.org/2026/11/keycloak-2682-released"]
  - claim_id: 2f177fa654
    entry: 2026-11-08/cve-2026-117691-keycloak-saml-http-redirect-signature-bypass
    surface: "body"
    kind: cited
    text: "Red Hat, the CNA, explains that Keycloak's SAML HTTP-Redirect binding processes percent-encoded parameter names while the signature verification logic checks only literal ones, so an attacker can supply a crafted, unsigned SAML message that the server processes instead of a legitimately signed one; it scores the flaw CVSS 3.1 9.1 with no privileges or user interaction, rates it Important because it allows full account takeover of federated users, and says no available mitigation meets its criteria ("
    urls: ["https://access.redhat.com/security/cve/CVE-2026-117691"]
  - claim_id: ea5c262f39
    entry: 2026-11-08/cve-2026-117691-keycloak-saml-http-redirect-signature-bypass
    surface: "body"
    kind: cited
    text: "Its courtesy guidance describes the attack as a crafted request that places an encoded unsigned SAML parameter before a legitimately signed one, and suggests auditing and restricting account registration on external identity providers so attackers cannot capture legitimately signed redirect-binding messages ("
    urls: ["https://access.redhat.com/security/cve/CVE-2026-117691"]
  - claim_id: 4ad04b3bff
    entry: 2026-11-08/cve-2026-117691-keycloak-saml-http-redirect-signature-bypass
    surface: "body"
    kind: cited
    text: "The release fixes further issues tagged with CVE identifiers, among them an unauthenticated single-request JVM termination through a SAML 1.1 AuthorityBinding parser loop, labelled an incomplete fix of an earlier flaw (CVE-2026-110931), unauthenticated CPU and worker-pool exhaustion through the SAML 1.1 KeyInfo parser that needs a restart (CVE-2026-107602), unverified identity-provider email auto-linking that enables account takeover (CVE-2026-97175), an account takeover through an authentication race (CVE-2026-103112) and a SAML broker that accepts holder-of-key assertions without proof of key possession (CVE-2026-92855) ("
    urls: ["https://www.keycloak.org/2026/11/keycloak-2682-released"]
  - claim_id: be6412f31d
    entry: 2026-11-08/cve-2026-117691-keycloak-saml-http-redirect-signature-bypass
    surface: "body"
    kind: cited
    text: "The release also fixes CVE-2026-111497, the out-of-bounds write in its bundled Brotli decoder ("
    urls: ["https://www.keycloak.org/2026/11/keycloak-2682-released"]
  - claim_id: e472bd047e
    entry: 2026-11-08/cve-2026-117691-keycloak-saml-http-redirect-signature-bypass
    surface: "body"
    kind: cited
    text: "), which CISA lists as exploited ("
    urls: ["https://www.cisa.gov/news-events/alerts/2026/10/27/cisa-adds-two-known-exploited-vulnerabilities-catalog"]
  - claim_id: 787e0da924
