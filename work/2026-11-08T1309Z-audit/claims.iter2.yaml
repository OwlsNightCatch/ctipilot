otfixes 12.2.4-h1, 12.1.4-h13, 12.1.7-h11, 12.1.10-h3, 11.2.4-h23, 11.2.7-h23, 11.2.10-h17, 11.2.13-h4 and 11.2.16-h1 (all released, as read on 2026-10-29); PHP for Windows 8.5.12-1, 8.4.27-1, 8.3.36-1, 8.2.35-1; Ubuntu brotli 1.2.0-4ubuntu0.1 (26.10), 1.2.0-3ubuntu0.1 (26.04), 1.1.0-2ubuntu0.1 (24.04), 1.0.9-2ubuntu0.1 (22.04), ESM 1.0.7-6ubuntu0.1+esm1 (20.04, whose nodejs package stays vulnerable); Debian brotli 1.0.9-2+deb12u1 (bookworm) and 1.1.0-2+deb13u1 (trixie); Alpine brotli 1.2.1-r0 (edge, 3.24, 3.23) and 1.1.1-r0 (3.21); Ruby brotli gem 0.9.1 and 0.9.2; SDDC Manager none yet, patch pending, workarounds KB460732 (9.1.1) and KB460734 (9.1.0, 9.0.x, 5.2.x); Prisma Cloud Application Security Transporter Client 0.2.9; Splunk Enterprise 10.2 or higher for the bundled Node.js runtime (no fixed 10.0 build or date), Splunk Visual Exporter none (disable or remove the app), no fix stated for the other Splunk products; Citrix Scout On-Prem hotfix 2609.1, Scout On-Prem LTSR 2508 CU2 LTSR, Scout Cloud Gateway On-Prem 2605.1-3; Keycloak 26.8.2\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
