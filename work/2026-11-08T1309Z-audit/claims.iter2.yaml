.14.xcpng8.3 and Xen Orchestra Appliance linux 6.1.190-1 (reboot required); MikroTik RouterOS 7.25.1 and 7.24.6; no fix yet from WatchGuard or Fortinet; Red Hat RHEL 8 kernel-4.18.0-553.182.1.el8_10 (RHSA-2026:93414), RHEL 9 kernel-5.14.0-687.64.1.el9_8 (RHSA-2026:93412) and RHEL 10 kernel-6.12.0-211.72.1.el10_2 (RHSA-2026:93413), all released 2026-11-01\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
