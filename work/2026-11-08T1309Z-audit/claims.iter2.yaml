    text: "On 2026-10-21 LiteLLM 1.107.0, the open-source LLM gateway, shipped with malicious Python startup files in all seven PyPI wheels (live 11:39 to 13:23 UTC) and in the official GHCR and Docker Hub images behind the v1.107.0, latest, main-latest and main-stable tags (11:46 to 14:20 UTC); they run a credential stealer at every Python start and start a background loader that could execute code fetched from an attacker-chosen host, though Socket saw its pointer empty at 13:01 UTC. The maintainers' root-cause post of 2026-10-23 says an administrative key committed to a public repository on 2026-05-27 and never revoked gave the attacker, from 2026-10-10, a GitHub organization owner's CLI token, with which it stole two maintainers' tokens and, on 2026-10-21, overrode branch protection to build the release from a look-alike repository; Socket independently found secret-stealing workflows running on 2026-10-10. Wiz saw stolen AWS instance-role credentials tested about 4.5 hours after exfiltration; PyPI and the registries removed the release the same day and the maintainers say to pin 1.106.2 or an explicit earlier version."
