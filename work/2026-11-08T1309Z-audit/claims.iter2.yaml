  - claim_id: 3c743a2675
    entry: 2026-11-08/elastic-threats-etc-report-november-2026-signed-ai-assistant
    surface: "summary"
    kind: frontmatter
    text: "Elastic Security Threat Command's quarterly report of 2026-11-04, on confirmed intrusions and research from 2026-04-04 to 2026-09-08, documents attackers operating through trusted software: Claude Code and the ChatGPT desktop app as parents of tunnelling and keychain theft, 23 confirmed RMM abuse findings led by ScreenConnect, paste-and-run infostealer delivery, and identity abuse through the ROPC grant, which Conditional Access does not evaluate, and device-code phishing that ends in a registered device and a primary refresh token."
