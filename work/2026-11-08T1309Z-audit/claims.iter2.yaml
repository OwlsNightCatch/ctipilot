    surface: "body"
    kind: cited
    text: "**Exposure:** a Keycloak or Red Hat Build of Keycloak below 26.8.2 that uses the SAML HTTP-Redirect binding, which the release notes tie to broker login; the SAML 1.1 parser flaws need no authentication either ("
    urls: ["https://www.keycloak.org/2026/11/keycloak-2682-released"]
  - claim_id: a1f43ab51f
    entry: 2026-11-08/cve-2026-117691-keycloak-saml-http-redirect-signature-bypass
    surface: "body"
    kind: uncited
    text: "Neither source reports exploitation of the Keycloak flaws or a public proof of concept."
  - claim_id: b37522ddb6
    entry: 2026-11-08/cve-2026-117691-keycloak-saml-http-redirect-signature-bypass
    surface: "body"
    kind: derived
    text: "**Detection:** in Keycloak event logs and reverse-proxy access logs, SAML messages received by HTTP GET whose query string carries an encoded parameter name such as %53AMLResponse instead of SAMLResponse, and federated logins of privileged accounts with no matching authentication at the upstream identity provider (an inference from the mechanism Red Hat describes)."
  - claim_id: c8fd88ddd6
    entry: 2026-11-08/cve-2026-117691-keycloak-saml-http-redirect-signature-bypass
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** move every Keycloak that brokers SAML to 26.8.2 outside the regular cycle, because the bypass needs no privileges or user interaction and Red Hat's formal statement names no mitigation that meets its criteria; until then, restrict account registration on the external identity providers, as Red Hat's courtesy guidance suggests; after updating, review federated logins of privileged accounts for logins the upstream identity provider never saw."
