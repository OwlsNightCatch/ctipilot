    text: "Xerox's security bulletin XRX26-016, updated on 2026-11-06, marks AltaLink 82xx and 81xx, EC81xx and VersaLink C/B415, C/B625 and C/B620 as remediated by releases that add PHP 8.2.35 against the PHP flaws CVE-2026-109618 and CVE-2026-109619. WorkCentre 3655, EC7836 and EC7856 and the newly listed AltaLink C8030 to C8070, AltaLink B8045 to B8090, EC8036 and EC8056 stay affected with a system software patch that Xerox says reduces exposure; Fiery patches are due between 2026-11-09 and 2026-11-23 and the Worldwide Ticketing Tool fix is in development. The bulletin gives no statement on exploitation of Xerox devices, and CISA lists both PHP flaws as exploited."
