    entry: 2026-11-08/elastic-threats-etc-report-november-2026-signed-ai-assistant
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** Elastic calls RMM abuse an inventory problem before a detection problem: knowing which agents the organisation pays for turns every other vendor name into a high-confidence alert ("
    urls: ["https://www.elastic.co/pdf/elastic-threats-etc-elastic-security-threat-command-nov-2026.pdf"]
