  - claim_id: ee72b0a973
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "summary"
    kind: frontmatter
    text: "Microsoft reports that since at least September 2026 Storm-0940, a China-state aligned actor, has used ARTEX, an open-source multi-agent LLM penetration-testing framework, to automate scanning, password spraying and OAuth-application abuse against hundreds of organizations across many industries including government, reaching privileged cloud access in under three hours in several cases; Expel saw the same infrastructure create its own accounts through Okta self-service registration. Google Threat Intelligence Group and Mandiant report on 2026-10-31 that since late August they have seen ARTEX, PentAGI and CAIRN operated in incident-response cases, with ARTEX adopted by extortion groups and suspected PRC-nexus clusters whose victims include US government organizations, and that the original ARTEX repository was taken down in October while forks keep it in circulation. CrowdStrike and Recorded Future document another actor using the framework, and Seoul police referred a criminal group's leader to prosecutors on 2026-10-23 for extorting 38 of more than 90 organizations, with the same framework according to BleepingComputer. Microsoft adds on 2026-11-06 another cluster, the Cambodia-based, financially motivated Storm-3358 targeting financial organisations, and Check Point reads ten exposed operator consoles that show near-autonomous, opportunistic ARTEX campaigns. CERT-EU says AI-driven activity against the EU institutions it protects highly likely involved ARTEX."
  - claim_id: dc9983f446
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "section 2026-11-08T14:11:58Z"
    kind: cited
    text: "CERT-EU, the cybersecurity service of the EU institutions, says it has seen several threat actors use ARTEX to automate their campaigns in recent weeks and has observed AI-driven activity against its own constituency that highly likely involved ARTEX; it assesses that the framework's public availability will likely accelerate adoption, notes that the public versions are independent forks since the original author withdrew the repository in October, and maps the activity to active scanning, tool acquisition and exploitation of public-facing applications ("
    urls: ["https://cert.europa.eu/blog/from-penetration-testing-to-cyber-threat-beware-of-artex"]
  - claim_id: 884abe9aca
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
