    entry: 2026-11-08/elastic-threats-etc-report-november-2026-signed-ai-assistant
    surface: "body"
    kind: cited
    text: "**Detection:** in process lineage, PowerShell, curl with --socks5-hostname or security dump-keychain under claude.exe or the ChatGPT desktop app; a ScreenConnect client beaconing to an unknown host on TCP 8041 or an RMM process hollowing MSBuild.exe; in Entra sign-in logs, successful ROPC sign-ins with BAV2RPOC user agents from anonymized hosting addresses, and a device registration followed by a primary refresh token after a device-code sign-in ("
