    text: "**Exposure:** endpoints where AI coding assistants or desktop AI clients may run shell commands, endpoints that can install RMM agents the organisation does not use, Entra tenants that still accept the ROPC grant or device-code sign-in, and IIS servers whose ASP.NET machine keys have been published."
