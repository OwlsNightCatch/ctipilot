    entry: 2026-11-02/android-sms-of-death-wap-push-telephony-crash
    surface: "summary"
    kind: frontmatter
    text: "An independent researcher published a working proof of concept on 2026-10-29 for a zero-click remote denial of service in Android's telephony framework: one malformed WAP Push data message crashes the com.android.phone process, drops active calls including emergency calls and, because the message is retried, can leave a phone in a restart loop. Google's November 2026 bulletin lists CVE-2026-58882, the identifier BleepingComputer gives for the flaw, as a critical denial of service fixed at the 2026-11-01 security patch level for Android 14 to 17 (the researcher had named the October update); Android 12 and 13 phones run the same code unfixed, and no source reports exploitation."
