    entry: 2026-11-08/elastic-threats-etc-report-november-2026-signed-ai-assistant
    surface: "body"
    kind: cited
    text: "**Triage:** Elastic says the same primitive is often both normal product behavior and confirmed theft, so judge an AI-assistant child process by its outcome (a proxy tunnel, a keychain read), not by the signed parent ("
