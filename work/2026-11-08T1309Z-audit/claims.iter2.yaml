    entry: 2026-11-08/elastic-threats-etc-report-november-2026-signed-ai-assistant
    surface: "body"
    kind: uncited
    text: "On Windows an operator drove Claude Code through its VS Code extension over RDP to stage tooling and reach a self-hosted GitLab instance through a SOCKS5 proxy tunnel; Elastic's rules fired on PowerShell children of claude.exe and repeated curl.exe calls with --socks5-hostname against port 1080."
  - claim_id: 0f6c8a25e2
    entry: 2026-11-08/elastic-threats-etc-report-november-2026-signed-ai-assistant
    surface: "body"
    kind: uncited
    text: "In the SILENTCONNECT chain a CAPTCHA page framed as a digital invitation drops a VBS script from Cloudflare r2.dev storage and ends in a silent ScreenConnect install whose client runs as a Windows service and beacons to the attacker's server on TCP 8041."
  - claim_id: 90b29fee1b
    entry: 2026-11-08/elastic-threats-etc-report-november-2026-signed-ai-assistant
    surface: "body"
    kind: uncited
    text: "A compromised university account reached Azure Resource Manager over the ROPC grant from an anonymized address known to be malicious; every successful attempt returned a token, and Conditional Access was bypassed because ROPC never traverses the surface the policy governs."
