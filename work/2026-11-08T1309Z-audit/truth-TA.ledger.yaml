    entry: 2026-08-30/berlin-landesnetz-rhysida-extortion-phishing-vector
    surface: "section 2026-11-02T03:47:06Z"
    kind: derived
    text: "Compare the endpoints and servers that actually run the detection agent, file servers holding shared and personal directories first, with the estate, and settle who in a federated administration is accountable for acting on a national-CERT warning, because in Berlin's chain the ITDZ and the Senate Chancellery left open whether the warnings reached the two departments."
  - claim_id: 4220df78eb
    entry: 2026-08-30/berlin-landesnetz-rhysida-extortion-phishing-vector
    surface: "record 2026-09-05T04:50:00Z"
    kind: record-summary
    text: "Rhysida's ultimatum lapsed on 2026-09-04 after Berlin's Senate refused to pay; the group then published the full stolen dataset on its darknet leak site, replacing its prior partial \"auction\" listing. Chaos Computer Club spokesperson Joachim Selzer confirmed the complete dataset is now publicly accessible to anyone, but whether it actually contains the drinking-water vulnerability analyses and administration credentials the group had earlier claimed remains what the Senate itself must still verify, per a state-parliament faction leader's own account."
  - claim_id: 41ebbdc573
    entry: 2026-08-30/berlin-landesnetz-rhysida-extortion-phishing-vector
    surface: "record 2026-09-06T04:50:00Z"
    kind: record-summary
    text: "Germany's federal government has quietly abandoned a plan set by the previous coalition to amend the Basic Law so the BSI could act as a true central authority for state- and municipal-level cyber incidents, per the Interior Ministry's own written Bundestag reply: a structural gap in federated cyber-incident response the fallout from this exact incident has now surfaced. Separately, the Chaos Computer Club identifies specific exposed record types (personnel matters, employment references, a handwritten signature on an internal device-request form) in the now fully-published leak."
  - claim_id: bf02da10f3
    entry: 2026-08-30/berlin-landesnetz-rhysida-extortion-phishing-vector
    surface: "record 2026-09-07T04:47:00Z"
    kind: record-summary
    text: "Follow-up reporting establishes for the first time that the published leak extends well beyond personnel data: it includes records tied to district heating and power plants, fuel depots, backup-power installations, electrical substations, prisons and defense-industrial / Bundeswehr-related material. Germany's BSI issued a public warning of an elevated threat level from the leak — heightened targeted-phishing risk plus a hack-and-leak risk given Berlin's 20 September state election — while assessing the underlying intrusion itself as financially motivated. Berlin's government set up a dedicated coordination unit (BSI, BKA and the domestic intelligence service BfV jointly reviewing the material) and started a risk-based notification process for affected citizens, employees and companies."
  - claim_id: fa09d44de1
    entry: 2026-08-30/berlin-landesnetz-rhysida-extortion-phishing-vector
    surface: "record 2026-09-08T04:49:00Z"
    kind: record-summary
    text: "Germany's BSI officially confirms, for the first time, both the intrusion technique and the actor attribution this entry had previously carried only from investigative journalism: the compromise matches BSI's own TerminalFix campaign advisory, and Rhysida is attributed to a group BSI tracks as Vice Spider (aka Vice Society, WhiteNefas, White Hekate, DEV-0832, Vanilla Tempest). BSI's advisory adds that operators staged exfiltration into attacker-controlled Azure cloud storage using the vendor's own azcopy tool and separately names the malware family LoremIpsumLoader (aka AxolotLoader) as attributed to the same group. Confidence moves from medium to high on the strength of this national-CERT technical confirmation."
  - claim_id: ed1177b4d5
    entry: 2026-08-30/berlin-landesnetz-rhysida-extortion-phishing-vector
    surface: "record 2026-09-10T05:05:00Z"
    kind: record-summary
    text: "The leak's national-security framing sharpens: a CDU defense-policy spokesperson states the published dataset includes civil-defense/total-defense emergency plans and barracks documents alongside the critical-infrastructure material already recorded, prompting the Bundeswehr's own operational command to join BSI's review. Separately, the Berlin district of Lichtenberg has refused to deploy CrowdStrike's Falcon Agent on its own servers over data-access and monitoring concerns, and Berlin's data protection commissioner has issued concrete victim guidance."
  - claim_id: f88ffee4d0
    entry: 2026-08-30/berlin-landesnetz-rhysida-extortion-phishing-vector
    surface: "record 2026-11-02T03:47:06Z"
    kind: record-summary
    text: "rbb24 Recherche reported on 2026-10-21 that the Senate department for urban development's attack-detection licences covered only five percent of devices and that neither the entry endpoint nor the servers the data left from were covered; BSI told rbb24 it does not confirm that the Berlin attack followed the TerminalFix pattern."
