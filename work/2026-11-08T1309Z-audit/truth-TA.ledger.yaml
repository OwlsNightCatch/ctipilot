  - claim_id: 2ce109f23f
    entry: 2026-11-04/threeam-uk-school-veeam-rogue-domain-admins-new-ad-trusts
    surface: "summary"
    kind: frontmatter
    text: "Bitdefender MDR describes a September 2026 intrusion by a 3AM ransomware affiliate into a UK school estate that began as several unconnected Active Directory domains: a modified public Veeam script decrypted credentials stored on three backup servers, the attacker created two backdoor domain-administrator accounts, joined three domains with new two-way trusts within about three hours, tried to remove EDR agents (anti-tampering blocked it) and encrypted machines. Initial access is unknown, every attacker action Bitdefender saw came from an unmanaged internal host, and Bitdefender reads the 40 to 101 second retry cadence as a model-driven loop, flagged as its own interpretation; it says a new trust between domains is a rare change that is cheap to alert on."
  - claim_id: e9c2eb75d7
    entry: 2026-11-04/threeam-uk-school-veeam-rogue-domain-admins-new-ad-trusts
    surface: "body"
    kind: cited
    text: "Bitdefender MDR attributes the intrusion to a 3AM (ThreeAM) ransomware affiliate on the encryptor build and its command-line pattern; the target was a school estate in the UK whose domains began as separate Active Directory environments, and initial access is unknown ("
    urls: ["https://businessinsights.bitdefender.com/3am-ransomware-hybrid-ai-attack"]
  - claim_id: 57d0fcc87b
    entry: 2026-11-04/threeam-uk-school-veeam-rogue-domain-admins-new-ad-trusts
    surface: "body"
    kind: cited
    text: "In September 2026 the attacker first took credentials from the backup software: a modified copy of a public script read the credentials stored in Veeam's databases on three backup servers and decrypted them with the Windows Data Protection API, and a browser credential database was copied from a terminal server ("
    urls: ["https://businessinsights.bitdefender.com/3am-ransomware-hybrid-ai-attack"]
  - claim_id: 56505e247a
    entry: 2026-11-04/threeam-uk-school-veeam-rogue-domain-admins-new-ad-trusts
    surface: "body"
    kind: cited
    text: "It then worked with built-in tools (PowerShell, WMI, reg, netsh, rundll32) and a few public ones (an Impacket-like remote-execution tool that returns output over administrative shares, Mimikatz renamed to look like a monitoring binary), enumerated domain trusts from a domain controller, searched SYSVOL logon scripts for the names and subnets of other schools, created two backdoor domain-administrator accounts, joined three separate domains with two-way trusts within about three hours, tried to remove EDR agents, which anti-tampering controls blocked, deleted system-state backups and encrypted machines with a Rust-based encryptor ("
    urls: ["https://businessinsights.bitdefender.com/3am-ransomware-hybrid-ai-attack"]
  - claim_id: 28a01077f5
    entry: 2026-11-04/threeam-uk-school-veeam-rogue-domain-admins-new-ad-trusts
    surface: "body"
    kind: cited
    text: "Every attacker action Bitdefender saw came from an unmanaged internal host with no agent, so the automation itself was never seen, and Bitdefender says it could not document anything about a language model ("
    urls: ["https://businessinsights.bitdefender.com/3am-ransomware-hybrid-ai-attack"]
  - claim_id: 82c2dde819
    entry: 2026-11-04/threeam-uk-school-veeam-rogue-domain-admins-new-ad-trusts
    surface: "body"
    kind: cited
    text: "**Detection:** in directory-service change events, new trust relationships between domains, which Bitdefender calls a rare change that is cheap to alert on, and new domain-administrator group members; in backup-server logs, Veeam web-interface calls and credential-store reads from hosts that are not backup administrators'; in endpoint telemetry, saves of the SECURITY, SYSTEM or SAM registry hives by any process that is not a known backup or administration job, LSASS access, a Windows Defender exclusion for the temporary directory, and the same command re-issued with small edits at a steady cadence; across hosts, file contents staged into registry values, which Bitdefender calls an unusual channel and a strong indicator to hunt for, and sent out by HTTP POST to an internal host, and probe or confirmation artifacts such as a scheduled task named for the probe left on production hosts; in authentication logs, unmanaged hosts authenticating to domain controllers ("
    urls: ["https://businessinsights.bitdefender.com/3am-ransomware-hybrid-ai-attack"]
  - claim_id: 5b0b391250
    entry: 2026-11-04/threeam-uk-school-veeam-rogue-domain-admins-new-ad-trusts
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** alert on any new domain trust and on additions to the domain-administrator groups, alert on credential-reading access to backup-software databases and on saves of the SECURITY, SYSTEM or SAM hives outside known backup or administration jobs, put an endpoint agent on every machine because the staging host here was unmanaged, and limit remote execution and administrative shares to known management hosts ("
    urls: ["https://businessinsights.bitdefender.com/3am-ransomware-hybrid-ai-attack"]
  - claim_id: f53909634d
    entry: 2026-11-04/threeam-uk-school-veeam-rogue-domain-admins-new-ad-trusts
