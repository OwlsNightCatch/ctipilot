    text: "Berlin's data protection commissioner Meike Kamp has now issued concrete guidance for potentially affected individuals: \"change passwords, closely monitor account activity, and increased scepticism toward phishing emails\" (translated from German) ("
    urls: ["https://www.heise.de/news/Gefahr-fuer-die-nationale-Sicherheit-Berliner-Datenleck-schlaegt-hohe-Wellen-11444301.html"]
