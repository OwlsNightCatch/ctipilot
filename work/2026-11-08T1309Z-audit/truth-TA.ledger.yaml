    surface: "section 2026-10-24T03:41:16Z"
    kind: cited
    text: "About 1,700 are persons who left the fund through resignation or death in 2024 and 2025: surname, first name, postal address, date of birth, AHV number and insured number, the exit-benefit amount and the receiving fund with its bank account (IBAN), and the personal IBAN for about 50 who were paid out directly, with no e-mail address or telephone number ("
    urls: ["https://www.ipct.ch/Attacco-informatico-criminale-presso-un-fornitore-di-software-dell-IPCT-Lettera-inviata-a-tutti-gli-assicurati-IPCT-b03fe500?i=1"]
  - claim_id: 3b21f5aada
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-24T03:41:16Z"
    kind: cited
    text: "About 80 are insured persons on a disability pension whose passive pension data was being updated: name, date of birth, AHV number, insured number, passive insured salary, passive retirement assets, degree and start of invalidity, with no contact data ("
    urls: ["https://www.ipct.ch/Attacco-informatico-criminale-presso-un-fornitore-di-software-dell-IPCT-Lettera-inviata-a-tutti-gli-assicurati-IPCT-b03fe500?i=1"]
  - claim_id: b529fa4a99
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-24T03:41:16Z"
    kind: cited
    text: "The fund says it has no certain evidence that these data were taken but that it appears plausible, that savings capital and pensions of all insured are untouched, that the cantonal administration's IT centre hosting the fund's infrastructure was not breached, and that it filed a criminal complaint against unknown persons and was recognised as private plaintiff, while the Federal Prosecutor's Office and the federal police investigate ("
    urls: ["https://www.ipct.ch/Attacco-informatico-criminale-presso-un-fornitore-di-software-dell-IPCT-Lettera-inviata-a-tutti-gli-assicurati-IPCT-b03fe500?i=1", "https://www.tio.ch/ticino/attualita/1958742/dati-stati-cantone-istituto-ticino-attacco-pensioni-casse-previdenza"]
  - claim_id: 0ceced170a
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-24T03:41:16Z"
    kind: cited
    text: "It decided to send the letter to all insured because its information is partial, the analyses are still evolving and it may never have certainty, and it asks them to watch for unexpected e-mails, calls and messages over the coming weeks and never to disclose passwords, access data or personal data unless sure of the requester ("
    urls: ["https://www.ipct.ch/Attacco-informatico-criminale-presso-un-fornitore-di-software-dell-IPCT-Lettera-inviata-a-tutti-gli-assicurati-IPCT-b03fe500?i=1"]
  - claim_id: f1f30cee3f
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-24T03:41:16Z"
    kind: cited
    text: "The letter names PK Softech's other customers as Publica, large cantonal public funds such as Bern and Zurich and company funds such as Migros and Post, for hundreds of thousands of insured persons in total ("
    urls: ["https://www.ipct.ch/Attacco-informatico-criminale-presso-un-fornitore-di-software-dell-IPCT-Lettera-inviata-a-tutti-gli-assicurati-IPCT-b03fe500?i=1"]
  - claim_id: 64e2090483
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-25T03:37:54Z"
    kind: cited
    text: "The Federal Data Protection and Information Commissioner (EDÖB) says PK Softech notified it of the cyberattack on its IT infrastructure on 2026-10-08, that the affected pension funds also reported to it, that it started an informal preliminary inquiry at Publica on 2026-10-14 and that on 2026-10-22 it opened a formal investigation against PK Softech AG on suspicion of data-protection violations ("
    urls: ["https://www.edoeb.admin.ch/de/edoeb-leitete-nach-cyberangriff-auf-softwarelieferant-abklaerungen-ein"]
  - claim_id: 5dc63e3966
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-25T03:37:54Z"
    kind: cited
    text: "Its release states that data of several important occupational pension institutions, Publica among them, was exfiltrated in the attack; the investigation is to give an overall picture of the personal data the funds handed to the software supplier and to clarify the legal framework of those transfers, how they were actually implemented and the scope of the data that left, and the EDÖB gives no further information on pending proceedings ("
    urls: ["https://www.edoeb.admin.ch/de/edoeb-leitete-nach-cyberangriff-auf-softwarelieferant-abklaerungen-ein"]
  - claim_id: 310041a1ad
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-25T03:37:54Z"
    kind: cited
    text: "Der Bund relays the step and adds that besides Publica the pension funds of Migros, Post and the City of Zurich obtain software from PK Softech ("
    urls: ["https://www.derbund.ch/cyberangriff-auf-pk-softech-bund-eroeffnet-untersuchung-985784970943"]
  - claim_id: 7c70e95f73
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-25T03:37:54Z"
    kind: uncited
    text: "The release names neither the actor nor the number of insured persons."
  - claim_id: 05641b021a
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-30T03:55:40Z"
    kind: cited
    text: "Publica's own newsletter of 2026-10-22 says that the hacker group Akira is being associated with the attack, referring readers to the Federal Office for Cybersecurity's description of the group's methods, and that Publica filed a criminal complaint with the Federal Prosecutor's Office on 2026-10-15 ("
    urls: ["https://www.publica.ch/de/dokumente/newsletter-22102026-cyberangriff-was-wir-wissen-und-was-nicht"]
  - claim_id: add486ec9d
