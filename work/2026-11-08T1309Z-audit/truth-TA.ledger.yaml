    surface: "section 2026-10-24T03:41:16Z"
    kind: cited
    text: "The Ticino cantonal pension fund IPCT has put numbers on its exposure in a letter of 2026-10-23 to its roughly 17,000 active insured and 10,000 pensioners ("
    urls: ["https://www.ipct.ch/Attacco-informatico-criminale-presso-un-fornitore-di-software-dell-IPCT-Lettera-inviata-a-tutti-gli-assicurati-IPCT-b03fe500?i=1"]
  - claim_id: 241fcc32f5
