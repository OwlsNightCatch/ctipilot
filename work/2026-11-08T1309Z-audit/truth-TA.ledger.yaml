    surface: "section 2026-10-23T03:40:13Z"
    kind: cited
    text: "The Ticino cantonal pension fund IPCT says through Corriere del Ticino, relayed by Ticinonline on 2026-10-20, that potentially all of its insured could be involved but that there is no evidence yet that their data was actually taken; it has filed a complaint with the Federal Prosecutor's Office and is preparing a letter to the insured warning of telephone and e-mail fraud ("
