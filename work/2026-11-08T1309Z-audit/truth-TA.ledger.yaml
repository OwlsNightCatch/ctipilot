    text: "), so the link between TerminalFix and this incident rests on BSI's Mastodon post, which heise reads as confirmation ("
    urls: ["https://www.heise.de/news/BSI-erklaert-ersten-Angriffsvektor-auf-Berliner-Behoerden-11444072.html"]
