    kind: cited
    text: "The stolen data includes a copy of the transport senator's identity card and of her digital signature and, rbb's analysis shows, further identity-card copies and personal documents of employees; the mobility department confirmed to rbb that the data is mostly unstructured files from shared and personal directories (translated from German) ("
    urls: ["https://www.rbb24.de/politik/beitrag/2026/10/berlin-hackerangriff-verwaltung-darknet-rhysida-daten-senatorin-bonde.html"]
