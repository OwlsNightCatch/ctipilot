    kind: cited
    text: "Inside IT recalls that Akira was also behind the attack on a US subsidiary of the state-owned arms company Ruag a year ago, where Ruag paid the ransom, and that the Federal Prosecutor's Office, fedpol and the Federal Office for Cybersecurity warned in October 2025 of stepped-up Akira activity in Switzerland ("
