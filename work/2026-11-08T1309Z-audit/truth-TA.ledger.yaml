    kind: frontmatter
    text: "Germany's Berlin state administration confirmed on 2026-08-28 that it faces an active extortion attempt following a compromise of its shared Landesnetz government network first disclosed on 2026-08-17; media reporting attributes the attack to the ransomware group Rhysida, which separately claimed it on its own leak site. Investigative reporting states an employee's phishing-email click opened the network to attackers who exfiltrated 5.7 to 5.8 terabytes of data, including critical-infrastructure and emergency-planning material, before detection; Berlin's government has publicly refused the roughly EUR 2 million ransom demand."
