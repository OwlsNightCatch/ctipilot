    entry: 2026-08-30/berlin-landesnetz-rhysida-extortion-phishing-vector
    surface: "section 2026-11-02T03:47:06Z"
    kind: cited
    text: "BSI told rbb that it had warned repeatedly since at least March 2025 of fake security prompts that make users run a malicious command themselves, publicly and in daily situation reports that also went to representatives of the federal states, and that it described the TerminalFix variant in September 2026; it does not confirm to rbb that the Berlin attack followed that pattern, saying only that it is in close contact with Berlin and supporting the response (translated from German) ("
    urls: ["https://www.rbb24.de/politik/beitrag/2026/10/berlin-hackerangriff-verwaltung-darknet-rhysida-daten-senatorin-bonde.html"]
