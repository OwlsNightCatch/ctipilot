    surface: "section 2026-10-23T03:40:13Z"
    kind: cited
    text: "Inside IT also relays, from Tamedia, that the Federal Prosecutor's Office confirmed that data was extracted by the Akira ransomware group, which still threatens to publish or sell it; 20 Minuten writes that according to findings so far Akira stole the data ("
