    text: "Acronis TRU describes BOSSAI, an agentic campaign it attributes with high confidence to one operator in Taiwan: a mesh of 12 AI agents, nine active, that over 12 observed days targeted government emergency services, banks, universities and military systems in 11 countries, with confirmed data exfiltration or system access at roughly ten targets in three countries. The confirmed emergency-services harm was patient-care records of a Taipei fire department and dispatch case records of a city 119 system; TRU says the agents failed where authentication was enforced and endpoints were filtered."
