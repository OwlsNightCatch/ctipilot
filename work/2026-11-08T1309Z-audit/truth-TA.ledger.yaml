    text: "The canton of Vaud said on 2026-11-04 that a Microsoft 365 device-code phishing campaign is running in French-speaking Switzerland and that several organisations are already affected: mail that appears to come from a company or a known contact leads the reader to type a code on a genuine Microsoft sign-in page, which gives the attacker access to the account. Microsoft documents a Conditional Access policy that blocks the device code flow for tenants that do not need it."
