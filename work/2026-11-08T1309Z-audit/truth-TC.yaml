- entry: 2026-10-22/litellm-1-107-0-pypi-docker-credential-stealer-lookalike
  verdict: factual-error
  findings:
  - code: F4
    claim_id: null
    where: evidence[] quote 1 (publisher "LiteLLM maintainers (root-cause post, attack chain)")
    defect: '"On October 10th, the threat actor used this key to gain access to our LiteLLM Agent Platform and extracted this GitHub CLI OAuth token."'
    ground_truth: 'NOT verbatim on the current page. Current text: "On October 10th, the threat actor used this key to gain control of our LiteLLM Agent Platform deployment. ... The threat actor used their access to extract this GitHub token." Archive copies of 2026-10-23T23:01Z through 2026-10-24T16:59Z carry the entry''s sentence exactly; the 2026-11-04 copy carries the rewrite (the page was rewritten between 2026-10-28 and 2026-11-04; its visible/JSON-LD date is still 2026-10-23).'
    ground_truth_url: https://docs.litellm.ai/blog/security-incident-oct-21-2026-attack-chain
    fix: Replace the quote with the current sentence ("... used this key to gain control of our LiteLLM Agent Platform deployment.") or drop it; record a correction.
  - code: F4
    claim_id: null
    where: evidence[] quote 2
    defect: '"However, key revocation did not occur for the master key."'
    ground_truth: 'NOT on the current page (neither "key revocation" nor "master key" occurs). Current text: "Because of human error, nobody followed through on revoking the administrative key to the LiteLLM Agent Platform, so it was still valid more than four months later." The earlier revision (archive 2026-10-24T16:59Z) read "The error was quickly identified, the commit force-pushed over, and we identified the exposed keys as requiring revocation. However, key revocation did not occur for the master key."'
    ground_truth_url: https://docs.litellm.ai/blog/security-incident-oct-21-2026-attack-chain
    fix: Replace with the current wording; record a correction.
  - code: F4
    claim_id: null
    where: 'body (outside the strict quote lead, same page): "a configuration file committed on 2026-05-27 to a public repository with the master key ... the commit was force-pushed over but the key was never revoked" (and summary/record text "a master key committed ... and never revoked")'
    defect: Entry says the commit was force-pushed over and calls it a "master key".
    ground_truth: 'Current page: the committed file "inadvertently contained an administrative key to an internal deployment of LiteLLM Agent Platform ... About three hours later a follow-up commit deleted the file and the keys were noted as requiring revocation, but the original commit stayed in the repository''s public history until October 22." The entry''s "force-pushed over" is contradicted by the revision (the original commit stayed public until 2026-10-22), and "administrative key" replaces "master key". Also new in the revision: the key let the attacker read the Agent Platform API, which returned the organization owner''s GitHub CLI token on 2026-10-10.'
    ground_truth_url: https://docs.litellm.ai/blog/security-incident-oct-21-2026-attack-chain
    fix: 'Correction record: administrative key (not master key), commit deleted by a follow-up commit but left in public history until 2026-10-22, key never revoked; mechanism of the 10-10 token theft per the current post.'
