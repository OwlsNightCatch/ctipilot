- entry: 2026-11-06/exposed-app-credentials-entra-signins-msp-clients-artex
  verdict: factual-error
  findings:
  - code: F4
    claim_id: 9fa789d06e
    where: summary (last sentence); same statement in sourcing_note ("Todyl does not tie its operator to ARTEX or to any framework ... sits in tension with the GitHub-search explanation") and in the body
    defect: '"Microsoft says a similar campaign involving the same addresses was reported by Todyl, while Todyl does not tie its case to ARTEX and cannot say where the secrets came from."'
    ground_truth: 'Todyl revised its post on 2026-11-06 (page dateModified 2026-11-06; "Investigation Update (11/6/2026 - 1:19pm MT)" = about 2026-11-06T20:19Z, after the entry''s discovered_at 2026-11-06T03:46Z): "Root cause: an agentic credential crawler, now corroborated by Microsoft ... The research covers the same infrastructure we reported in this post ... This activity is an automated, agentic credential crawler ... Microsoft names the tooling as ARTEX, an AI offensive framework that finds secrets and carries out follow-on attacks". The summary was true at publication and is now contradicted by the publisher''s own current page.'
    ground_truth_url: https://www.todyl.com/blog/stolen-app-credentials-real-access-an-actor-is-signing-into-entra-id-and-azure-devops-as-your-workloads
    fix: 'Append an update record: Todyl (2026-11-06) now states its operator is the agentic credential crawler Microsoft names as ARTEX and cites Microsoft for the GitHub initial-access path; rewrite the summary sentence, the sourcing_note and the "does not tie" statements to the new state (and revisit confidence/credibility, now corroborated by both parties).'
  - code: F4
    claim_id: b8c222daa9
    where: 'body paragraph 2 (Todyl): "does not know how the credentials were obtained ... points to a file store or live backend rather than configurations crawled from the internet"; evidence[3] quote'
    defect: Body presents the credential source as unknown and pointing away from internet-crawled secrets; evidence[3] ("We have not tied the activity to a specific agentic workflow or offensive framework ...") is still literally on the page but belongs to the superseded 2026-11-03 update.
    ground_truth: 'Todyl 2026-11-06 update: "Microsoft confirms the initial access path: ''Starting in August 2026, Microsoft observed threat actors using an agentic AI offensive framework to submit large volumes of queries to GitHub for secrets.''" and "Custom-built apps. Many of the affected apps are custom-built, which makes credentials exposed in public repos or web apps the likely source."'
    ground_truth_url: https://www.todyl.com/blog/stolen-app-credentials-real-access-an-actor-is-signing-into-entra-id-and-azure-devops-as-your-workloads
    fix: 'Same update record: state Todyl''s revised root-cause assessment next to its earlier 11-03 uncertainty; replace or supplement evidence[3] with a quote from the 11-06 update.'
