    claim_id: f4c2eb9fa0
    where: 'body paragraph 2 (uncited) and the derived Exposure/Detection lines (claim 2961 etc.): "an internal AI tool that let one compromised user act on colleagues'' machines"; Detection: "in the access logs of internal AI tools, one user''s session acting on other users'' endpoints"; Exposure: "any internal AI assistant or agent that can act with one employee''s access on behalf of another" (low confidence)'
    defect: The entry states as the mechanism that the AI tool let one compromised user act on colleagues' machines / sessions, and builds a detection and an exposure statement on it.
    ground_truth: 'Binance says only: "The attacker leveraged the compromised computer of engineer B and used an internal AI tool to gain control over the Wallet DevOps Engineer A and another Wallet Software Engineer C." and "Some technical details will remain confidential"; BleepingComputer: "used the compromised engineer''s computer and an internal AI tool to compromise two additional employees". No source describes how the tool was abused (session impersonation, agent actions, credential exposure).'
    ground_truth_url: https://www.binance.com/en/blog/community/3229153443759566763
    fix: Quote Binance's own wording and mark the mechanism as not disclosed; keep the Detection/Exposure lines but label them as inferred from "gain control over" rather than described by Binance.
