- entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
  verdict: factual-error
  findings:
  - code: F3
    claim_id: 7cdedb7f84
    where: 'cves[CVE-2026-111497].affected; also summary (last sentence), actions[1], body Exposure, ## Update 2026-11-05T03:52:52Z, updates[] record 2026-11-05 summary, evidence[] Splunk quote (claims 6292805806, ab54d3b26a, 3d529e6d0b, 688ef615c7, 3210725b06, 5344eebfa7)'
    defect: The entry states "Splunk Enterprise 10.0 and lower" is vulnerable and actions[1] says "Upgrade every Splunk Enterprise 10.0 and lower to 10.2 or higher"; the evidence quote "Splunk Enterprise versions 10.0 and lower are vulnerable." was verbatim on the 2026-11-04 revision.
    ground_truth: 'Splunk revised SVD-2026-1015 on 2026-11-05 and 2026-11-06 (Last Updated 2026-11-06): "Splunk Enterprise version 10.0 is vulnerable. Splunk Enterprise versions 9.4 and 10.2 and higher are not affected. To address the Node.js runtime bundled with Splunk Enterprise 10.0, we recommend upgrading to Splunk Enterprise 10.2 or higher." The page now also lists Splunk Observability Cloud, Observability OpenTelemetry Collector, AppDynamics On-Premises and Galileo (remedied) and gives Splunk Synthetic Runner "Upgrade to 1.71.0 or higher". A Splunk 9.4 estate is now told to upgrade for no reason.'
    ground_truth_url: https://advisory.splunk.com/advisories/SVD-2026-1015
    fix: 'Correction record: scope Splunk Enterprise to 10.0 only (9.4 and 10.2 and higher not affected) in cves[].affected, summary, actions[1] and Exposure; replace the evidence quote with "Splunk Enterprise version 10.0 is vulnerable. Splunk Enterprise versions 9.4 and 10.2 and higher are not affected." (contiguous on today''s page); the Visual Exporter statement (every Splunk Enterprise version, disable or remove) and the 10.2 upgrade target for 10.0 stay correct.'
  - code: F4
    claim_id: null
    where: sourcing_note, sentence "ELLIO's sensor telemetry is the only first-hand account of an attack found"
    defect: The sourcing_note still says ELLIO is the only first-hand attack account and that Tenable relays it without confirming it.
    ground_truth: 'The entry''s own ## Correction 2026-11-01T13:56:19Z says "ELLIO''s capture is not the only attack telemetry: Zscaler''s decoys recorded 402 events from 20 source addresses against 12 customers within a day of disclosure, 60% of them exploitation attempts"; Zscaler ThreatLabz: "Within the first 24 hours following public disclosure, Zscaler Deception’s global decoy mesh observed activity from 20 source IP addresses targeting 12 customers across 402 events. Of these events, 40% involved reconnaissance and 60% involved exploitation attempts." NCSC Switzerland also moved the status to Actively Exploited on 2026-10-29. The 2026-11-01 correction did not name sourcing_note in fields.'
    ground_truth_url: https://www.zscaler.com/blogs/security-research/cve-2026-111497-node2shell-http2shell-vulnerability-may-allow-rce
    fix: In the next correction record rewrite the sentence to name ELLIO and Zscaler decoy telemetry as first-hand attack observations, and declare sourcing_note in fields.
  - code: F4
    claim_id: 0a40922f5f
    where: updates[] record 2026-10-27T03:43:51Z summary, last sentence
    defect: (low confidence; append-only history already superseded by the 2026-11-01 correction) "Still no source reports exploitation outside Imperva's laboratory demonstration."
    ground_truth: 'ELLIO page: "Update, 26 October 2026. ELLIO sensors have recorded CVE-2026-111497 exploit traffic in the wild" (15:08 UTC on 2026-10-26, before the record''s 03:43Z on 2026-10-27). The 2026-11-01 correction dates the 10-26 statement to the day it held but gives CISA''s 2026-10-27 listing as the end, not ELLIO''s earlier report.'
    ground_truth_url: https://ellio.tech/en/blog/node2shell-cve-2026-111497-rce-on-stock-nodejs-builds/
    fix: No edit to the record itself; when the Splunk correction is written, make the correction text say ELLIO reported exploit traffic on 2026-10-26.
