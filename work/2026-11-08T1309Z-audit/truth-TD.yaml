  verdict: imprecision
  findings:
  - code: F16
    claim_id: null
    where: 'frontmatter priority: critical + immediate_action (low confidence)'
    defect: 'priority: critical with an immediate_action block is retained on 2026-11-08, 26 days after disclosure and 10 days after the full-chain patch.'
    ground_truth: 'Critical bar (prompts/cti-run.md Phase 4): newly disclosed or newly weaponised (in-window), time-critical to the hour or day; disqualifier "patches >=1 week old without new exploitation".
      Volexity: "On October 29, 2026, Ivanti published a patch that addresses this vulnerability, which is tracked as CVE-2026-111357"; CISA KEV additions of the other two flaws are dated 2026-10-30; the
      only in-window items (CERT-FR AVI-1442 of 2026-11-02 relaying Ivanti''s statement that all three are actively exploited; Ivanti CNA record of CVE-2026-118527 published 2026-11-03) are confirmations,
      not new exploitation or weaponisation.'
    ground_truth_url: https://www.volexity.com/blog/2026/10/13/a-series-of-unauthenticated-events-chained-exploitation-of-ivanti-connect-secure-zero-days/
    fix: 'Judgement call: either keep as sticky-critical and say so in the audit, or re-rate to high (a decision within 7 days remains: upgrade to 25.1.1.3 / 25.1.3.1 / 22.8R2.6 and run the compromise check)
      with immediate_action null. Everything else in the entry (63 claims, 3 CVE records, all quotes) checks out against fetched primaries.'
  length_note: null
- entry: 2026-09-15/cve-2026-76461-cisco-secure-email-gateway-sqli-root-rce
  verdict: imprecision
  findings:
  - code: F3
    claim_id: d816fa716a
    where: body, paragraph 4 (hardening-release paragraph), last sentence; this is the pre-pass citation-cve lead
    defect: '"Upgrading to 15.5.5-014 or 16.5.0-780 closes the exploited flaw and the hardening CVEs together, while for a 16.0 appliance the hardening advisory names no fixed release and says to migrate,
      so 16.0.4-302 closes CVE-2026-76461 only ([Cisco PSIRT, hardening-release advisory, 2026-09-14])" cites the hardening advisory for the whole clause.'
    ground_truth: 'The hardening advisory (revision 1.1, 2026-OCT-14) carries only the fixed-release table "15.5 and earlier 15.5.5-014 / 16.0 Migrate to a fixed release. / 16.5 16.5.0-780" for the five
      hardening CVEs; it never names CVE-2026-76461 or 16.0.4-302. The CVE binding is supported by another page the entry already cites: the SQL-injection advisory carries "CVE-2026-76461" in its CVE list
      and the table "15.5 and earlier 15.5.5-014* / 16.0 16.0.4-302 / 16.5 16.5.0-780" (also KEV and NCSC-NL name the id). Lead decision: real defect (adjacency), fact is true, citation must be split.'
    ground_truth_url: https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-hardening-esa-dfCrfXkm
    fix: 'Split the sentence: cite the hardening advisory only for "names no fixed 16.0 release and says to migrate", and cite the SQL-injection advisory (cisco-sa-esa-inj-2bLVGmhX) for "15.5.5-014, 16.0.4-302
      and 16.5.0-780 close CVE-2026-76461" and for the CVE id.'
  - code: F3
    claim_id: 6303226fae
    where: section "Update — 2026-11-04T03:26:59Z", fourth sentence (same defect, not flagged mechanically because the clause says "the SQL injection", not the CVE id)
    defect: '"For a 16.0 appliance the hardening advisory''s table names no fixed release and says to migrate to one, so 16.0.4-302 closes the SQL injection only ([Cisco PSIRT, hardening-release advisory,
      2026-09-14])".'
    ground_truth: The hardening page states only "16.0 Migrate to a fixed release."; the build 16.0.4-302 and its mapping to the SQL injection appear only on cisco-sa-esa-inj-2bLVGmhX ("16.0 16.0.4-302").
    ground_truth_url: https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-hardening-esa-dfCrfXkm
    fix: 'Same split: hardening advisory for the "migrate" statement, SQL-injection advisory for 16.0.4-302 closing the SQL injection.'
  - code: F8
    claim_id: null
    where: body labelled lines (low confidence)
    defect: The exploited root-RCE entry has no **Exposure:** and no **Detection:** labelled line; exposure sits in paragraph 1 prose and detection only inside **Triage:** and actions[1].
    ground_truth: 'The SQL-injection advisory supports both fields: "regardless of device configuration", Secure Email and Web Manager and Secure Web Appliance not affected, mail_logs grep "COPY.*TO PROGRAM",
      cross-check network and firewall logs outside the device, cluster members and SSH keys, rebuild virtual appliances after recording forensics.'
    ground_truth_url: https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-esa-inj-2bLVGmhX
    fix: 'Add short **Exposure:** and **Detection:** lines (telemetry class first, post-patch compromise check: root access may have removed local log evidence; restore each member of a cluster with a compromised
      appliance) carrying what the advisory already says.'
  length_note: null
