- entry: 2026-09-22/cve-2026-7273-zyxel-gs1900-red-heron-kev-exploited
  verdict: imprecision
  findings:
  - code: F13
    claim_id: 52b6980490
    where: actions[0] last clause ("... 564 of 996 exploited switches (57%) had never had theirs changed, which lets the actor re-enter even after the hashed credential set is rotated") and body paragraph
      4 (", so for the majority of victims the unrotated default password alone gave durable re-entry") (low confidence)
    defect: 'Asserts that factory-default credentials gave the actor durable re-entry / re-entry after credential rotation. The action clause is also internally muddled: a switch whose credentials were
      rotated is no longer on its default.'
    ground_truth: 'GreyNoise says only: "While the credentials were hashed, 564 of the victims had factory default credentials." Nothing on the page says the actor re-entered with, or relied on, default
      credentials (grep for re-enter/persist/default returns that single sentence). 564/996 = 56.6% is the only supported figure.'
    ground_truth_url: https://www.greynoise.io/blog/open-season-on-kapibala-attacker-steals-government-records-wordpress-exploitation
    fix: State the source fact (564 of 996 victims were on factory-default credentials) and mark the consequence as the entry's inference ("a switch still on its default password is open to anyone who knows
      the default"); drop "re-enter even after the hashed credential set is rotated".
  - code: F4
    claim_id: null
    where: 'frontmatter techniques[]: T1078.001 (Default Accounts) (low confidence)'
    defect: T1078.001 is mapped although no cited source says the actor used a default account; it rests only on the inference above (added by the internal 2026-09-27 mapping record).
    ground_truth: GreyNoise describes the actor exploiting the CGI flaw, fetching a collector over TFTP and staging /tmp/info; the default-credential sentence describes victims' state, not actor behaviour.
      All other mapped ids (T1190, T1105, T1059.004, T1005, T1074.001) are supported.
    ground_truth_url: https://www.greynoise.io/blog/open-season-on-kapibala-attacker-steals-government-records-wordpress-exploitation
    fix: Drop T1078.001 (or keep only if a source states default-account logins by the actor).
