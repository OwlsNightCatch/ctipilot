lead_decisions:
- lead: citation-cve on 2026-09-15/cve-2026-76461-cisco-secure-email-gateway-sqli-root-rce (hardening advisory cited for a clause naming CVE-2026-76461)
  decision: Real defect, adjacency (F3), fact true. The clause binds CVE-2026-76461 and 16.0.4-302 to the hardening advisory, which carries neither (it says only "16.0 Migrate to a fixed release."). The
    binding is supported by the SQL-injection advisory the entry already cites (CVE list header "CVE-2026-76461"; table "16.0 16.0.4-302"), and by KEV and NCSC-NL. The citation needs splitting; the same
    clause in the 2026-11-04 section has the identical defect and was not flagged mechanically (it says "the SQL injection", not the id).
  claim_ids:
  - d816fa716a
  - 6303226fae
