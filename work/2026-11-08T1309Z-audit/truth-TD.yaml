    ground_truth_url: https://api.github.com/repos/watchtowrlabs/watchTowr-vs-Barracuda-RCE-CVE-2026-116606-CVE-2026-111560
    fix: Say the detection tool has been public since 2026-11-03 and the full technical chain since 2026-11-05 (blog); the tool was public one day after the CVEs were published and before Barracuda changed
      its advisory.
