    defect: CERT-UA is treated as a national-CERT carve-out and rated reliability A, but it is not on the profile's national-CERT single-source list and has no record in sources/sources.json.
    ground_truth: 'Org-profile carve-out list: NCSC-CH, GovCERT.ch, CERT-EU, ENISA, BSI, ANSSI/CERT-FR, NCSC-UK, NCSC-NL, CISA, CCN-CERT, AGID-CSIRT-IT, CERT.at, CERT-PL. cti-run.md PD-5 carve-out is worded
      generically ("high-reliability (A/B) national CERT ... for its own jurisdiction"), so the value is defensible under the prompt but not under the profile list. The CERT-UA alert itself was read this
      pass (jina reader) and every CERT-UA claim holds; the other cited pages restate it.'
    ground_truth_url: https://cip.gov.ua/ua/news/khakeri-mozhut-otrimati-kontrol-nad-kamerami-ta-videoreyestratorami-cherez-khmarnii-dostup
    fix: 'Either set verification: single-source with the existing sourcing_note (and consider reliability B), or add CERT-UA to sources.json / the profile list so the carve-out is explicit.'
