    discovery_trace: "first seen at: elastic-seclabs, URL https://www.elastic.co/security-labs/rss/feed.xml (feed item 2026-11-04 'When trust becomes the payload: Inside the threats, etc quarterly report') -> extract of https://www.elastic.co/security-labs/reports/threats-etc-report-november-2026-trouble-with-trust (summary page; the 2026-11-0x fires dropped it as 'landing page only readable') -> raw url --direct of that page surfaced the link to https://www.elastic.co/resources/security/report/threat-command-cybersecurity-report -> extract of that page surfaced https://www.elastic.co/pdf/elastic-threats-etc-elastic-security-threat-command-nov-2026.pdf -> primary: tools/fetch_source.py pdf of the full report (47,565 characters decoded, per-font ToUnicode, 34 pages)"
    summary: |
      Elastic Threat Command (Elastic Security Labs) published the November 2026 edition of its quarterly 'threats, etc' report, covering Elastic telemetry, confirmed customer intrusions and first-party research between 2026-04-04 and 2026-09-08. This is a first-hand telemetry report; the counts are Elastic observations and Elastic itself states they are not market share. Its six themes are all behaviour-level and detection-relevant. (1) Signed AI assistants as execution parents: Elastic confirmed a Windows intrusion on 2026-08-05 in which an operator drove Claude Code through its VS Code extension over RDP to stage tooling through a SOCKS5 tunnel (PowerShell children of claude.exe, repeated curl calls with --socks5-hostname to port 1080), a macOS case five days later in which the ChatGPT desktop application acted as a shell-command proxy for a compound zsh pipeline that ended in a login-keychain dump, and two macOS coding-agent cases started with permission-bypass flags that stood up Cloudflare quick tunnels and installed LaunchAgent persistence. (2) RMM as the payload: 23 confirmed findings between 2026-06-15 and 2026-08-12, ScreenConnect named most often and delivered from freshly registered domains; the SILENTCONNECT chain (CAPTCHA-gated 'e-invite' page, VBS from object storage, PowerShell that compiles C# at runtime, a CMSTPLUA COM UAC bypass, a Defender exclusion for .exe files, then a silent ScreenConnect MSI that beacons on TCP 8041); a trojanized RMM agent on a healthcare endpoint injecting into other processes with WriteProcessMemory to harvest browser credentials; ScreenConnect driving MSBuild.exe hollowing; and TOLLBOOTH (REF3927), where ViewState deserialization on an IIS server using leaked ASP.NET machine keys led to a Godzilla-fork web shell and, after account creation failed, GotoHTTP as fallback persistence over ports 80 and 443. (3) ClickFix-style paste-and-run as the dominant infostealer on-ramp (27 confirmed findings), with Elastic reporting an average of eight minutes from infostealer infection to the actor logging in with the same credentials, one healthcare case from lure to MSI delivery with DLL sideloading in roughly 16 seconds, and a macOS chain that validates the prompted password with dscl before it harvests browser keys and the keychain. (4) Identity: valid credentials over the ROPC grant through the Azure AD PowerShell client to Azure Resource Manager from anonymized hosting addresses, which Conditional Access never evaluates; a Kali365 device-code compromise through the Microsoft Authentication Broker that ended in a registered virtual device and a primary refresh token; and Tycoon 2FA relays obtaining a PRT within minutes. (5) Supply chain: the CHAINDROP worm (return of Shai-Hulud via the keyv maintainer, spreading only through npm tokens carrying bypass_2fa, resolving C2 from an Ethereum contract, with SessionStart and folderOpen hooks that execute on workspace open), a Contagious Interview lure hiding payload fragments in SVG flags, and PHANTOMPULSE resolving C2 from blockchain transaction inputs. (6) Exploitation: the host footprint of the wp2shell WordPress pre-auth RCE (writes under wp-content/upgrade and wp-content/uploads, a transient plugin directory, and an INTO OUTFILE web shell under wp-content/cache) and auditd-level detection of the Copy Fail and DirtyFrag page-cache privilege escalations (AF_ALG and splice sequences from non-root processes). Elastic's forecast is blockchain-resolved C2 becoming standard in commodity loaders, agentic applications becoming a routinely abused execution path, post-consent behaviour in identity, and paste-based lures spreading to new platforms.
    region_nexus: "global vendor telemetry; healthcare, education and cloud-tenant victims named without country; no Swiss case. Transferable to any Microsoft 365 / Windows / macOS estate"
    primary_sector_nexus: "indirect (healthcare and university endpoints, Entra ID tenants, WordPress and IIS servers are all common in cantonal and communal estates)"
