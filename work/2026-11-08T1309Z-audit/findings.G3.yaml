      - quote: "Out of 23 confirmed RMM abuse findings this quarter, ScreenConnect was the product named most often."
        attribution: "Elastic Security Labs"
        source_url: "https://www.elastic.co/security-labs/reports/threats-etc-report-november-2026-trouble-with-trust"
      - quote: "In some cases, the average time from an infostealer infection to the threat actor logging in via the same credentials is only eight minutes."
        attribution: "Elastic Security Labs"
        source_url: "https://www.elastic.co/security-labs/reports/threats-etc-report-november-2026-trouble-with-trust"
      - quote: "RMM abuse is an inventory problem before it is a detection problem"
        attribution: "Elastic Security Threat Command"
        source_url: "https://www.elastic.co/pdf/elastic-threats-etc-elastic-security-threat-command-nov-2026.pdf"
      - quote: "Treat maintainer credentials as production credentials."
        attribution: "Elastic Security Threat Command"
        source_url: "https://www.elastic.co/pdf/elastic-threats-etc-elastic-security-threat-command-nov-2026.pdf"
    extended_notes: |
      Detection and triage concepts the report itself states (no rule code): (a) coding agents and desktop AI clients as parent processes -- hunt PowerShell, curl with --socks5-hostname, or `security dump-keychain` as children of claude.exe or the ChatGPT desktop app, and sessions started with permission-bypass flags that create Cloudflare quick tunnels and LaunchAgents; Elastic says the same primitive is often both normal product behaviour and confirmed theft, so the discriminator is the outcome (proxy tunnel, keychain read), not the parent. (b) RMM: inventory the agents the organization pays for; a ScreenConnect client beaconing to an unknown host on TCP 8041, an RMM parent hollowing MSBuild.exe or reading browser credential stores, or an RMM upload right after failed account creation on a server is not administrator activity; certificate revocation state discriminated the trojanized-agent case. (c) Paste-and-run: detect the shell one-liner spawned from a browser or Run-dialog context, and curl output piped to osascript; on macOS the password prompt plus `dscl` validation fires before collection, bulk file access after; rotation scope is the vault contents, not only the browser profile. (d) Identity: authentication protocol, result and 'all sign-ins succeeded' are queryable in any tenant (ROPC with the Azure AD PowerShell client, BAV2RPOC user agents, anonymized hosting-provider sources); alert on unmanaged device registration and PRT issuance; a first-party application identifier is not a trust signal; scoping legacy authentication removes the cheapest observed route. (e) Supply chain: revoke npm automation tokens carrying bypass_2fa, enforce 2FA, npm 12 blocks preinstall hooks by default per Elastic, audit repositories for 'chore: update config' commits by author 'claude', and snapshot .npmrc to catch removed install cooldowns. (f) wp2shell: missing wp2shell_* plugin directory does not clear a host (the PoC deletes it); INTO OUTFILE webshells land under wp-content/cache. Items in the report already covered in the store: CHAINDROP (campaign:shai-hulud-chaindrop-2026-08), Contagious Interview, Tycoon 2FA and Kali365 device-code, Copy Fail and DirtyFrag. Elastic's own caution applies: counts are findings, not victims, and the window ends 2026-09-08, so several items predate the report by months.
    suggested_actions: []

