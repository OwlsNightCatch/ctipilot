    verification: SINGLE-SOURCE-NATIONAL-CERT
    confidence: MEDIUM
    novelty: "update-of:2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse"
    update_target: "2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse"
    borderline: true
    borderline_reason: "Authority primary (A) with a transferable attack pattern, but Indian BFSI victims only and the hardening advice is generic; the ARTEX entry currently carries no CERT-In or CRAFTY FALCON mention (grep of the entry returned 0). Delta for the entry: a national CERT's cluster name, the tool list and the non-production-environment / allow-list-bypass / cloud-management-channel pattern."
    evidence:
      - quote: "CSIRT-Fin continues to receive reports of successful attacks, including from NBFCs and fintech entities that had already received the earlier restricted (TLP:AMBER) advisories and had undertaken remediation."
        attribution: "CERT-In"
        source_url: "https://www.cert-in.org.in/s2cMainServlet?VLCODE=CIAD-2026-0058&pageid=PUBVLNOTES02"
      - quote: "Internet-exposed non-production environments (UAT/staging/testing) used as entry points, followed by movement to production environments using shared credentials, tokens or network paths."
        attribution: "CERT-In"
        source_url: "https://www.cert-in.org.in/s2cMainServlet?VLCODE=CIAD-2026-0058&pageid=PUBVLNOTES02"
      - quote: "IP allow-listing bypassed by originating traffic from whitelisted third-party fetcher IP pools"
        attribution: "CERT-In"
        source_url: "https://www.cert-in.org.in/s2cMainServlet?VLCODE=CIAD-2026-0058&pageid=PUBVLNOTES02"
    extended_notes: |
      Detection concept CERT-In states: central real-time alerting on cloud audit events for remote command execution, serverless function code updates and creation of roles, users or access keys; alert on any access from non-production systems to production systems, credentials or data; file-integrity monitoring on application directories made read-only to the runtime user. The full indicator set and detection rules are in restricted (TLP:AMBER) versions that were not read; do not infer IOCs.

