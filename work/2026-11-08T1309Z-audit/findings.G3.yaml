    discovery_trace: "first seen at: csa-labs, URL https://labs.cloudsecurityalliance.org/research/ (research note 'Crafty Falcon: Weaponized Pentest Agents Hit the Financial Sector', 2026-11-05, a Cloud Security Alliance re-report used as a lead only) -> WebSearch (\"CERT-In advisory Crafty Falcon autonomous offensive AI framework financial sector November 2026\") -> pivot: GitGuardian, URL https://blog.gitguardian.com/the-agents-have-now-found-your-secrets-on-github-artex-is-abusing-public-secrets-right-now/ (links the advisory URL) -> primary: extract of https://www.cert-in.org.in/s2cMainServlet?VLCODE=CIAD-2026-0058&pageid=PUBVLNOTES02"
    summary: |
      CERT-In's finance unit CSIRT-Fin issued advisory CIAD-2026-0058 on 2026-11-04 (severity Critical), an update to CIAD-2026-0046 of 2026-10-09, naming the actor behind a campaign against Indian banking, financial-services and insurance entities 'CRAFTY FALCON' and calling it active and escalating. CERT-In says it found the 'ARTEX' family, 'PentAGI', the 'Cairn' attack search engine and the 'CyberStrikeAI' framework used against NBFCs, digital-lending platforms, fintechs, payment aggregators and crypto exchanges, and that entities were re-attacked after incomplete remediation and at holidays and weekends. The advisory's attack pattern is concrete: cloud management and serverless services (AWS Systems Manager, Lambda) abused to run commands and deploy files; internet-exposed UAT, staging and test environments as entry points with movement to production over shared credentials, tokens or network paths; application packages reverse-engineered and API calls made from altered packages; IP allow-listing bypassed by sending traffic from whitelisted third-party fetcher IP pools; micro-value test transactions before large transfers; newly published file-upload and deserialization flaws exploited as soon as they are public, leading to web shells in PHP and Node.js applications; and many tailored scripts generated in rapid succession, which CERT-In calls consistent with AI-generated code. CERT-In names no victims, loss figures or nation-state; the CSA note and press coverage disagree on whether China is linked, so attribution is not established by the primary. The advisory adds a government-authority naming and a transferable attack pattern to the ARTEX entry; the victims are Indian, so the nexus to Swiss public bodies is the shared hardening levers, not the target set.
    region_nexus: "India (BFSI); ARTEX-family tooling is globally exposed"
    primary_sector_nexus: "indirect (payment and disbursement APIs, non-production environments and cloud management planes exist in cantonal and communal e-government estates)"
    sector: "financial-services (India)"
