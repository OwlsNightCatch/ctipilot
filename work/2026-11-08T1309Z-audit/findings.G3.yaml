    prior_drop_note: "2026-11-0x intel fire dropped this as 'S3-6 Elastic threats etc report: landing page only readable, claims not verifiable'. The full PDF is public (landing page links https://www.elastic.co/pdf/elastic-threats-etc-elastic-security-threat-command-nov-2026.pdf) and was read in full here, so the verifiability objection no longer holds."
