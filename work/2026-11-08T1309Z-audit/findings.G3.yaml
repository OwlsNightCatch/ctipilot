      - { subject: "actor:anubis-raas", object: "tool:lindnor-backdoor", basis: "Symantec: attackers using the Anubis ransomware deployed the new Lindnor backdoor (Symantec, 2026-11-05)" }
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    borderline: true
    borderline_reason: "Detection-relevant malware-family and BYOVD tradecraft (kernel-callback listing and removal tools, AnyDesk registered under SafeBoot\\Network) but one vendor's single case, a US victim, initial access unknown and the encryptor blocked; no constituency nexus beyond ransomware tradecraft transfer. The week's fires dropped comparable single-victim malware write-ups (NetamLoader, camera-management intrusion); main agent to decide."
    evidence:
      - quote: "Attackers using the Anubis ransomware targeted a U.S. organization in October 2026 using a new custom backdoor that Symantec has called Backdoor.Lindnor."
        attribution: "Symantec"
        source_url: "https://www.security.com/threat-intelligence/lindnor-new-backdoor-anubis-ransomware"
      - quote: "Within roughly an hour, the attackers dropped at least 13 executables to help terminate security services, along with five publicly known vulnerable drivers."
        attribution: "Symantec"
        source_url: "https://www.security.com/threat-intelligence/lindnor-new-backdoor-anubis-ransomware"
      - quote: "The attackers also installed the legitimate remote access tool AnyDesk and a separate tool to run it in Safe Mode, likely to maintain access when security software was not fully running."
        attribution: "Symantec"
        source_url: "https://www.security.com/threat-intelligence/lindnor-new-backdoor-anubis-ransomware"
      - quote: "We did not identify how the attackers gained initial access."
        attribution: "Symantec"
        source_url: "https://www.security.com/threat-intelligence/lindnor-new-backdoor-anubis-ransomware"
    extended_notes: |
      Detection concepts the source supports: (1) service-install and process-creation events for executables running from folders that mimic a Chrome component unpacker or a VMware directory on SQL Server hosts; (2) a burst of a dozen executables from one directory followed by driver loads (kernel driver-load telemetry, signed-but-vulnerable drivers on a block list) and kernel-callback enumeration switches; (3) registry modification under HKLM\SYSTEM\CurrentControlSet\Control\SafeBoot\Network\<name> with value 'Service' for a remote-access product (Symantec shows the reg.exe form for AnyDesk) together with a new local account; benign lookalike: IT-managed RMM registered for Safe Mode by the organization's own deployment, so discriminate on the creating process, the account and the absence of a change ticket. Hardening: driver block lists (HVCI / vulnerable-driver blocklist) and application control on SQL Server hosts. IOCs deliberately omitted.

