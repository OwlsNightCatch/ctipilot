  - title: "ANNUAL REPORT - Elastic Security Labs 'threats, etc' quarterly report, November 2026 (Elastic Threat Command, April to September 2026): signed AI assistants as execution parents, RMM agents as the payload, ClickFix infostealers, ROPC and device-code identity abuse"
