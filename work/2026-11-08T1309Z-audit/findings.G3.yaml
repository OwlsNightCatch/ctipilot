  - title: "Anubis ransomware affiliate (Symantec: Hawkmoth) with a new custom Lindnor backdoor, 13 security-killer executables and five vulnerable drivers within an hour, and AnyDesk registered for Safe Mode with Networking, stopped before encryption (US organization, October 2026)"
    suggested_kind: threat
    sources:
      - { url: "https://www.security.com/threat-intelligence/lindnor-new-backdoor-anubis-ransomware", publisher: "Symantec Threat Hunter Team (Broadcom) / Carbon Black", date: "2026-11-05", role: "primary" }
    discovery_trace: "first seen at: symantec-security-com, URL https://www.security.com/threat-intelligence (undated listing of five posts; the headline entry 'New Lindnor Backdoor and Glut of Security Killers Used in Ransomware Attack on U.S. Org') -> primary (no pivot needed): extract of https://www.security.com/threat-intelligence/lindnor-new-backdoor-anubis-ransomware, date field 2026-11-05. The other four listed posts were drilled for dates and predate the window (2026-10-20 Swallowtail, 2026-10-21 Skynet LLMjacking, 2026-10-22 PHP2Shell, 2026-10-29 unauthorized AI relays)."
    summary: |
      Symantec reports an October 2026 intrusion at a US organization by attackers using the Anubis ransomware, which Symantec says is run by a group it tracks as Hawkmoth (a RaaS that emerged in December 2024 as a rebrand of Sphinx, so affiliates differ between attacks). The first indicator was a previously undocumented custom backdoor, Backdoor.Lindnor, found as a service on the only two Microsoft SQL Servers among the affected machines, masquerading as a Chrome component unpacker folder on one and as a VMware file on the other; it reports host and domain identity to a primary and a fallback C2 over port 443, and Symantec saw it on two further unrelated organizations without ransomware activity. Within roughly an hour the attackers dropped at least 13 executables to terminate security services plus five signed, publicly known vulnerable drivers (BYOVD); two of the tools masqueraded as Symantec software and take a switch to list and another to remove kernel callbacks through a loaded driver. They also installed AnyDesk, created a local user, and ran a tool that registers AnyDesk as a service under the SafeBoot Network registry key so remote access survives Safe Mode with Networking, when security software is not fully running. The encryption payload (extension .anubis, optional wiper mode) was blocked before it ran, and Symantec did not identify initial access. Symantec says custom backdoors are rare in ransomware cases and BYOVD is now a standard part of the RaaS playbook; Symantec says the group has claimed about 96 victims in 12 months, 52 percent of them in the US.
    region_nexus: "United States victim; Anubis is global RaaS; no Swiss case"
    primary_sector_nexus: "indirect (ransomware affiliate tradecraft transferable to any Windows estate with SQL Servers; no public-sector victim stated)"
    sector: "unspecified (US organization)"
    cves: []
    techniques: [T1685, T1068, T1219, T1688, T1543.003, T1036.005, T1136.001, T1486, T1485]
    affected_products: ["Microsoft SQL Server", "AnyDesk"]
    entity_keys: ["actor:anubis-raas", "product:anydesk"]
    new_entities:
      - { key: "tool:lindnor-backdoor", type: tool, name: "Backdoor.Lindnor", aliases: ["Lindnor"], summary: "Custom backdoor Symantec found on two SQL Servers in an October 2026 Anubis ransomware intrusion, installed as a service masquerading as a Chrome component or VMware file, C2 over port 443 with a fallback (Symantec, 2026-11-05)." }
      - { key: "actor:hawkmoth", type: actor, name: "Hawkmoth", aliases: [], summary: "Symantec's name for the group that develops and runs the Anubis RaaS (emerged December 2024 as a rebrand of Sphinx) (Symantec, 2026-11-05)." }
    relation_suggestions:
