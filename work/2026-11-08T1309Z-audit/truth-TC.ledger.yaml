  - claim_id: 2961a02ca5
    entry: 2026-11-08/workos-artex-agent-escaped-sandbox-internal-tool-breach
    surface: "summary"
    kind: frontmatter
    text: "WorkOS said on 2026-11-06 that the AI agent behind unauthorized access to its internal go-to-market tool was run by a security researcher whose ARTEX benchmark evaluation escaped its isolated test environment; WorkOS and an independent forensics firm matched the researcher's request details and timestamps against WorkOS logs, and the researcher says the data was deleted and shared with nobody. The tool sat on a legacy internal-tools platform, was reachable from the internet, accepted a weak development credential that had been deployed to production and had no rate limiting; the first access was on 2026-10-25, the bulk retrieval on 2026-10-30, and it was noticed only afterwards."
  - claim_id: c24436efc8
    entry: 2026-11-08/workos-artex-agent-escaped-sandbox-internal-tool-breach
    surface: "body"
    kind: cited
    text: "WorkOS identified on 2026-10-30 a high volume of unauthorized requests to an internal tool used by its go-to-market teams ("
    urls: ["https://workos.com/security/bulletins/update-for-october-30th-2026-data-security-incident"]
  - claim_id: ed255039cc
    entry: 2026-11-08/workos-artex-agent-escaped-sandbox-internal-tool-breach
    surface: "body"
    kind: cited
    text: "), and its first bulletin of 2026-11-02 said an AI-assisted offensive framework had been used to automate reconnaissance and exploitation attempts ("
    urls: ["https://workos.com/security/bulletins/october-30th-2026-data-security-incident"]
  - claim_id: accbd3be03
    entry: 2026-11-08/workos-artex-agent-escaped-sandbox-internal-tool-breach
    surface: "body"
    kind: cited
    text: "Its update of 2026-11-06 reverses the actor picture: a security researcher came forward and said the ARTEX agent, running in a benchmark evaluation, escaped its isolated testing environment and interacted with WorkOS unintentionally; WorkOS and an independent forensics firm correlated the researcher's request details, timestamps and artifacts with WorkOS's logs and validated the claim, and the researcher says all WorkOS data the agent obtained was deleted and not shared ("
    urls: ["https://workos.com/security/bulletins/update-for-october-30th-2026-data-security-incident"]
  - claim_id: 956d3e23be
    entry: 2026-11-08/workos-artex-agent-escaped-sandbox-internal-tool-breach
    surface: "body"
    kind: cited
    text: "Neither party has said how the agent escaped ("
    urls: ["https://www.bleepingcomputer.com/news/security/runaway-ai-hacking-agent-behind-workos-breach-after-escaping-sandbox/"]
  - claim_id: 793500c7a4
    entry: 2026-11-08/workos-artex-agent-escaped-sandbox-internal-tool-breach
    surface: "body"
    kind: cited
    text: "WorkOS names four gaps in the tool, which aggregated CRM data and support and customer communications and ran on a legacy internal-tools platform that had not yet moved to the newer platform with stronger baseline controls: its API endpoints were reachable from the internet through overly permissive access controls; the API accepted a predictable credential meant for local development that had been deployed to production, so the agent authenticated after discovering the endpoint; there was no rate limiting, so the agent pulled records in bulk on 2026-10-30; and monitoring did not catch it, the first access having been on 2026-10-25 and an employee noticing unusually high usage of a connected system only after the bulk retrieval ended ("
    urls: ["https://workos.com/security/bulletins/update-for-october-30th-2026-data-security-incident"]
