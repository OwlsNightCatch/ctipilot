    entry: 2026-11-06/exposed-app-credentials-entra-signins-msp-clients-artex
    surface: "headline"
    kind: frontmatter
    text: "Entra app-credential abuse: agents hunt GitHub for secrets, an operator reaches MSP clients, government among them"
  - claim_id: 9fa789d06e
    entry: 2026-11-06/exposed-app-credentials-entra-signins-msp-clients-artex
    surface: "summary"
    kind: frontmatter
    text: "Microsoft reports that since August threat actors have used the agentic framework ARTEX to query public GitHub for OAuth application secrets and cloud keys, and that from 2026-10-28 valid application credentials were used for service-principal sign-ins across dozens of applications in several tenants, a vendor-owned multitenant application among them. Todyl's telemetry shows one operator since 2026-11-01 targeting about 45 application registrations at MSPs, more than 33 of which authenticated, and reaching 27 organisations, government clients among them; Microsoft says a similar campaign involving the same addresses was reported by Todyl, while Todyl does not tie its case to ARTEX and cannot say where the secrets came from."
  - claim_id: be30a864a0
    entry: 2026-11-06/exposed-app-credentials-entra-signins-msp-clients-artex
    surface: "actions[0]"
    kind: frontmatter
    text: "In every Entra tenant you run or manage for others, list the app registrations that hold client secrets, starting with multitenant, delegated-admin (GDAP) and Partner Center apps, security-tool integration apps and Azure DevOps service connections, and search the service-principal and non-interactive sign-in logs for the invalid-secret or expired-secret errors AADSTS7000215 and AADSTS7000222 followed by a success for the same app; on any hit remove all client secrets, certificates and federated credentials on that app, including ones you did not add, disable its service principal if needed and rotate everything stored in any Key Vault it could read, because issued tokens stay valid until they expire."
  - claim_id: 3caa1bb3ea
    entry: 2026-11-06/exposed-app-credentials-entra-signins-msp-clients-artex
    surface: "body"
    kind: cited
    text: "Microsoft reports that since August 2026 threat actors have used the agentic offensive framework ARTEX to submit large volumes of queries to public GitHub for secrets ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/11/05/threat-actors-use-agentic-ai-tooling-to-find-and-abuse-exposed-secrets/"]
  - claim_id: 3ec66546cb
    entry: 2026-11-06/exposed-app-credentials-entra-signins-msp-clients-artex
    surface: "body"
    kind: cited
    text: "As early as 2026-10-28 it saw successful service-principal sign-ins from two IP addresses, one a Tor exit node that may carry unrelated activity, across dozens of applications in several tenants, including a vendor-owned multitenant application whose credential was compromised at the source and used to reach multiple downstream tenants ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/11/05/threat-actors-use-agentic-ai-tooling-to-find-and-abuse-exposed-secrets/"]
  - claim_id: 7e788e065b
    entry: 2026-11-06/exposed-app-credentials-entra-signins-msp-clients-artex
    surface: "body"
    kind: cited
    text: "Microsoft states that a similar campaign involving the same addresses was also reported by Todyl ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/11/05/threat-actors-use-agentic-ai-tooling-to-find-and-abuse-exposed-secrets/"]
  - claim_id: 3f931ad5d3
    entry: 2026-11-06/exposed-app-credentials-entra-signins-msp-clients-artex
    surface: "body"
    kind: cited
    text: "Todyl, from its managed-detection telemetry, describes one operator who since 2026-11-01 has signed in to MSPs' Microsoft 365 and Azure environments as their own applications with stolen credentials that are still valid: about 45 app registrations at roughly 18 organisations were targeted, more than 33 authenticated, and 27 organisations were reached, among them the MSPs' downstream clients in government ("
    urls: ["https://www.todyl.com/blog/stolen-app-credentials-real-access-an-actor-is-signing-into-entra-id-and-azure-devops-as-your-workloads"]
  - claim_id: 44703df779
    entry: 2026-11-06/exposed-app-credentials-entra-signins-msp-clients-artex
    surface: "body"
    kind: cited
    text: "For nearly every credential the operator requests an Azure Resource Manager token, then a Key Vault token, and within minutes applications that had never been used start authenticating; MSP multitenant and delegated-admin apps and Partner Center tokens reach client tenants, one app sweeping 15 client tenants in about 10-second loops ("
    urls: ["https://www.todyl.com/blog/stolen-app-credentials-real-access-an-actor-is-signing-into-entra-id-and-azure-devops-as-your-workloads"]
  - claim_id: b8c222daa9
    entry: 2026-11-06/exposed-app-credentials-entra-signins-msp-clients-artex
    surface: "body"
    kind: cited
    text: "Todyl says no Microsoft vulnerability is involved, that it saw no persistence and does not know how the credentials were obtained, and that several seed secrets had only ever been used from staff devices and office networks, which points to a file store or live backend rather than configurations crawled from the internet ("
    urls: ["https://www.todyl.com/blog/stolen-app-credentials-real-access-an-actor-is-signing-into-entra-id-and-azure-devops-as-your-workloads"]
