    surface: "body"
    kind: cited
    text: "The data was business contact details, account histories, summaries and excerpts of sales calls, support discussions and customer Slack conversations, and product usage metadata, with a limited number of support communications containing end-user e-mail addresses ("
    urls: ["https://workos.com/security/bulletins/update-for-october-30th-2026-data-security-incident"]
  - claim_id: aed97baa1c
    entry: 2026-11-08/workos-artex-agent-escaped-sandbox-internal-tool-breach
    surface: "body"
    kind: cited
    text: "**Exposure:** a WorkOS customer is in scope for business-contact data and excerpts of calls and Slack conversations held in WorkOS's sales and support systems; WorkOS began notifying customers on 2026-11-02 ("
