    entry: 2026-11-08/claude-code-dont-ask-again-secrets-in-settings-local-json
    surface: "headline"
    kind: frontmatter
    text: "Claude Code's don't-ask-again file leaks secrets: 1,122 public copies on GitHub hold a real one"
  - claim_id: 11969cb92e
    entry: 2026-11-08/claude-code-dont-ask-again-secrets-in-settings-local-json
    surface: "summary"
    kind: frontmatter
    text: "Apiiro reports that when a developer picks \"Yes, and don't ask again\" on a shell command that carries a password or token, Claude Code saves that exact command, secret included, in the project's .claude/settings.local.json, a file that Claude Code keeps out of commits only through the user's own global git excludes; 1,122 of 104,185 public copies on GitHub hold a real secret, and gitleaks and TruffleHog both missed 215 of them. Anthropic's documentation confirms the approval is saved as an allow rule in that file and that the exclusion is a global git setting."
  - claim_id: 7d3a224d8c
    entry: 2026-11-08/claude-code-dont-ask-again-secrets-in-settings-local-json
    surface: "body"
    kind: cited
    text: "Apiiro reports that when a developer chooses \"Yes, and don't ask again\" on a shell command that carries a secret, Claude Code saves that exact command, secret included, in plain text in `.claude/settings.local.json` inside the project ("
    urls: ["https://apiiro.com/blog/coding-agents-leaking-secrets-github-dont-ask-again"]
  - claim_id: a45c997492
    entry: 2026-11-08/claude-code-dont-ask-again-secrets-in-settings-local-json
    surface: "body"
    kind: cited
    text: "Anthropic's documentation confirms that the approval is saved as an allow rule in that file, and that Claude Code adds the file to the user's global git excludes the first time it writes it, so it stays out of that user's commits ("
    urls: ["https://code.claude.com/docs/en/settings"]
  - claim_id: 3c5f663dc2
    entry: 2026-11-08/claude-code-dont-ask-again-secrets-in-settings-local-json
    surface: "body"
    kind: cited
    text: "Apiiro points out that this protection lives in one user's git settings on one machine: it does not cover a folder that becomes a repository later, a clone on another machine or a file already committed, and the rule never goes into the repository's own .gitignore ("
    urls: ["https://apiiro.com/blog/coding-agents-leaking-secrets-github-dont-ask-again"]
  - claim_id: 744fc47e71
    entry: 2026-11-08/claude-code-dont-ask-again-secrets-in-settings-local-json
    surface: "body"
    kind: cited
    text: "Apiiro found 104,185 public copies of the file in 103,617 repositories; 1,122 of those files hold at least one secret, 1,379 distinct secrets in all: 379 database passwords, 122 Supabase service-role keys, 43 SSH logins, 42 GitHub, GitLab and npm tokens and 23 AWS keys among them ("
    urls: ["https://apiiro.com/blog/coding-agents-leaking-secrets-github-dont-ask-again"]
  - claim_id: d7e98d82d2
    entry: 2026-11-08/claude-code-dont-ask-again-secrets-in-settings-local-json
    surface: "body"
    kind: cited
    text: "Counting git history, the shared settings.json and saved agent transcripts, it counts 2,539 secrets in 1,994 repositories ("
    urls: ["https://apiiro.com/blog/coding-agents-leaking-secrets-github-dont-ask-again"]
  - claim_id: 545347b305
    entry: 2026-11-08/claude-code-dont-ask-again-secrets-in-settings-local-json
    surface: "body"
    kind: cited
    text: "Gitleaks flagged 564 and TruffleHog 643 of the 1,122 files, and 215 were flagged by neither, mostly because a password typed after PGPASSWORD=, sshpass -p or mysql -p looks like an ordinary word in a command line ("
    urls: ["https://apiiro.com/blog/coding-agents-leaking-secrets-github-dont-ask-again"]
  - claim_id: 9c52f30856
    entry: 2026-11-08/claude-code-dont-ask-again-secrets-in-settings-local-json
    surface: "body"
    kind: cited
    text: "**Exposure:** any repository where a developer used Claude Code and approved a command containing a password, token or key with \"don't ask again\", and every laptop where that was done, because the file sits in plain text there too ("
    urls: ["https://apiiro.com/blog/coding-agents-leaking-secrets-github-dont-ask-again"]
  - claim_id: d3f64ca458
    entry: 2026-11-08/claude-code-dont-ask-again-secrets-in-settings-local-json
    surface: "body"
    kind: cited
    text: "To tell, search the organisation's repositories for the two settings files and look in their history, as Apiiro advises ("
    urls: ["https://apiiro.com/blog/coding-agents-leaking-secrets-github-dont-ask-again"]
  - claim_id: 78de296fd0
    entry: 2026-11-08/claude-code-dont-ask-again-secrets-in-settings-local-json
    surface: "body"
    kind: cited
    text: "**Detection:** in pre-commit and CI secret scanning, include git history and make sure the scanner catches passwords typed inside commands, not only known key formats ("
    urls: ["https://thehackernews.com/2026/11/claude-codes-dont-ask-again-file.html"]
  - claim_id: 490c7ddb96
    entry: 2026-11-08/claude-code-dont-ask-again-secrets-in-settings-local-json
    surface: "body"
    kind: cited
    text: "); history matters because removing the file does not undo the leak, older versions staying in git history and in forks ("
    urls: ["https://thehackernews.com/2026/11/claude-codes-dont-ask-again-file.html"]
  - claim_id: 4b1436e578
    entry: 2026-11-08/claude-code-dont-ask-again-secrets-in-settings-local-json
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** treat every secret found in these files as exposed and rotate it first, then stop tracking the file with `git rm --cached` and add it to the repository's own .gitignore and the organisation's templates ("
    urls: ["https://apiiro.com/blog/coding-agents-leaking-secrets-github-dont-ask-again"]
  - claim_id: 384a8c4ccf
    entry: 2026-11-04/binance-theft-fake-recruiter-ai-tool-pivot-deploy-token
    surface: "headline"
    kind: frontmatter
    text: "Binance's report: fake recruiter, trojaned pyenv, AI-tool pivot and a deployment token reached the signing service"
  - claim_id: 46adba5fd5
    entry: 2026-11-04/binance-theft-fake-recruiter-ai-tool-pivot-deploy-token
    surface: "summary"
    kind: frontmatter
    text: "Binance's report of 2026-11-03 says the theft of about USD 6.34 billion on 2026-10-29 was a multi-stage campaign: in September a software engineer contacted through a job platform was led through two fake interviews and told to download an assignment repository to his work computer, whose setup code replaced the pyenv executable in the Homebrew install with a malicious one that endpoint protection did not detect. On 2026-10-20 the attacker used that computer and an internal AI tool to take over two wallet-team engineers and found a container-deployment token, which on 2026-10-29 let it deploy a container and run a script that reached the wallet signing service. The FBI says North Korea was responsible and calls the activity TraderTraitor; Binance says some technical details stay confidential."
  - claim_id: f261932782
    entry: 2026-11-04/binance-theft-fake-recruiter-ai-tool-pivot-deploy-token
    surface: "body"
    kind: cited
    text: "Binance says the theft of about USD 6.34 billion in digital assets on 2026-10-29 was \"a sophisticated, multi-stage campaign\" and not a single breach or a simple phishing incident ("
    urls: ["https://www.binance.com/en/blog/community/3229153443759566763"]
  - claim_id: 9f33666ca4
    entry: 2026-11-04/binance-theft-fake-recruiter-ai-tool-pivot-deploy-token
    surface: "body"
    kind: cited
    text: "In September 2026 a software engineer whose job-platform profile named Binance was approached by a person posing as a project director, interviewed by a purported HR representative on live video and then by a purported CEO in a chat application, and told to download an \"assignment\" repository onto his work computer; its setup code replaced the legitimate pyenv executable in the Homebrew installation with a malicious version, repointed the symlink and spawned a zsh shell, and the 0-day malware was not detected by endpoint protection ("
    urls: ["https://www.binance.com/en/blog/community/3229153443759566763"]
  - claim_id: 48dd225e2f
    entry: 2026-11-04/binance-theft-fake-recruiter-ai-tool-pivot-deploy-token
    surface: "body"
    kind: cited
    text: "On 2026-10-20 the attacker used that computer and an internal AI tool to gain control over a wallet DevOps engineer and a second wallet software engineer, and found a container-deployment permission token on the first engineer's computer; on 2026-10-29 it logged onto the second engineer's computer with the stolen credentials, deployed a container and triggered a script that launched the attack on the wallet signing service ("
    urls: ["https://www.binance.com/en/blog/community/3229153443759566763"]
  - claim_id: 7f5b8019ad
    entry: 2026-11-04/binance-theft-fake-recruiter-ai-tool-pivot-deploy-token
    surface: "body"
    kind: cited
    text: "Binance reports an earlier supply-chain event in June 2026, when a wallet DevOps engineer installed a tampered Homebrew installation while searching for an AI coding tool, and says its security team blocked 57 suspected North Korea-linked cases in 2026 ("
    urls: ["https://www.binance.com/en/blog/community/3229153443759566763"]
  - claim_id: 652329ed9e
    entry: 2026-11-04/binance-theft-fake-recruiter-ai-tool-pivot-deploy-token
    surface: "body"
    kind: cited
    text: "The FBI says North Korea was responsible and calls the activity \"TraderTraitor\" ("
    urls: ["https://www.fbi.gov/investigate/cyber/alerts/2026/north-korea-responsible-for-6-billion-binance-attack"]
  - claim_id: 1a9b8a3c1f
    entry: 2026-11-04/binance-theft-fake-recruiter-ai-tool-pivot-deploy-token
    surface: "body"
    kind: cited
    text: "BleepingComputer notes that fake job interviews leading to malware installs are a common tactic of the North Korean campaigns known as Contagious Interview and Operation Dream Job, a comparison Binance does not make ("
    urls: ["https://www.bleepingcomputer.com/news/security/binance-says-fake-job-interview-led-to-63-billion-crypto-heist/"]
  - claim_id: a0cd81aeff
    entry: 2026-11-04/binance-theft-fake-recruiter-ai-tool-pivot-deploy-token
    surface: "body"
    kind: cited
    text: "**Detection:** in endpoint file-event telemetry, a version-manager or interpreter binary deleted, renamed and re-linked inside a package-manager directory followed by a shell spawned from it, which is the sequence Binance describes for pyenv in the Homebrew installation ("
    urls: ["https://www.binance.com/en/blog/community/3229153443759566763"]
  - claim_id: 67c6c5ff23
    entry: 2026-11-04/binance-theft-fake-recruiter-ai-tool-pivot-deploy-token
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** treat a recruiter's \"assignment\" repository as untrusted code and keep it off managed machines, restrict what an internal AI tool can reach with one user's session and what a stored deployment token can deploy, and alert on shells spawned from replaced developer-tool binaries; Binance's own stated fixes are tighter device controls, rebuilt systems and tools, rotated credentials and tokens, and AI-based behavioural anomaly detection ("
    urls: ["https://www.binance.com/en/blog/community/3229153443759566763"]
  - claim_id: f4c2eb9fa0
    entry: 2026-11-04/binance-theft-fake-recruiter-ai-tool-pivot-deploy-token
    surface: "body"
    kind: uncited
    text: "The transfer to other organisations is the access chain, not the loss: a developer endpoint reached through a recruiting lure, a trojaned version-manager binary that endpoint protection missed, an internal AI tool that let one compromised user act on colleagues' machines, and a deployment token that turned one workstation into code execution in a trusted pipeline."
  - claim_id: 2dd46748f5
    entry: 2026-11-04/binance-theft-fake-recruiter-ai-tool-pivot-deploy-token
    surface: "body"
    kind: derived
    text: "**Exposure:** any organisation whose developers, DevOps or administrators can be approached through job platforms and run third-party assignment code on managed laptops, and any internal AI assistant or agent that can act with one employee's access on behalf of another."
  - claim_id: d7c760d3c6
    entry: 2026-11-05/sophos-rca-fake-interview-repo-vscode-beavertail-edr-gap
    surface: "headline"
    kind: frontmatter
    text: "Sophos RCA: fake interview repo ran BeaverTail via VS Code settings; dead EDR agent, OAuth grant survived revocation"
  - claim_id: b26413cb64
    entry: 2026-11-05/sophos-rca-fake-interview-repo-vscode-beavertail-edr-gap
    surface: "summary"
    kind: frontmatter
    text: "Sophos discloses, as the victim, that on 2026-09-14 an employee cloned a repository presented as a job-interview coding assignment and opened it as a trusted VS Code workspace; its settings replaced the terminal profile, so opening a terminal downloaded and ran the BeaverTail loader and the in-memory InvisibleFerret backdoor on a Mac whose Sophos Endpoint agent had not reported since 2026-06-11. A third-party OAuth authorization on the employee's code-platform account survived the session revocation and read two internal repositories 27 times; Sophos found no other host and no customer impact."
  - claim_id: 1f3b4b360d
    entry: 2026-11-05/sophos-rca-fake-interview-repo-vscode-beavertail-edr-gap
    surface: "body"
    kind: cited
    text: "On 2026-09-14 a Sophos employee cloned a public repository presented as a job-interview coding assignment and opened it as a workspace in VS Code; a weaponized workspace settings file replaced the editor's integrated terminal profile with a command that downloads and runs a remote script in a loop, delivery relied on the user opening the workspace as trusted, and no exploit or vulnerability was involved ("
    urls: ["https://www.sophos.com/en-us/trust/root-cause-analyses/inc-2026-002"]
  - claim_id: c730b2ec10
    entry: 2026-11-05/sophos-rca-fake-interview-repo-vscode-beavertail-edr-gap
    surface: "body"
    kind: cited
    text: "Opening a terminal was enough: a shell script fetched a JavaScript component and a package manifest into a hidden directory in the user profile, a package-manager install ran, the JavaScript ran under Node.js and the final-stage backdoor lived in memory only, with no persistence found ("
    urls: ["https://www.sophos.com/en-us/trust/root-cause-analyses/inc-2026-002"]
  - claim_id: 9d2d22b12c
    entry: 2026-11-05/sophos-rca-fake-interview-repo-vscode-beavertail-edr-gap
    surface: "body"
    kind: cited
    text: "SophosLabs identified the BeaverTail loader followed by the InvisibleFerret backdoor, able to steal browser-stored credentials, keychain data and SSH keys, and the JavaScript stage sent the process environment to an attacker web endpoint on a cloud application-hosting service ("
    urls: ["https://www.sophos.com/en-us/trust/root-cause-analyses/inc-2026-002"]
  - claim_id: 7edb519716
    entry: 2026-11-05/sophos-rca-fake-interview-repo-vscode-beavertail-edr-gap
    surface: "body"
    kind: cited
    text: "The Sophos Endpoint agent was installed but its core services were not running, so it enforced nothing and reported nothing; the device was last seen in Sophos Central on 2026-06-11, the cause is still under investigation, and SophosLabs says a working agent would have blocked the chain at the first dropped file ("
    urls: ["https://www.sophos.com/en-us/trust/root-cause-analyses/inc-2026-002"]
  - claim_id: 0d4e011735
    entry: 2026-11-05/sophos-rca-fake-interview-repo-vscode-beavertail-edr-gap
    surface: "body"
    kind: cited
    text: "A third-party application authorization on the employee's source-code platform account survived the session revocation and password reset of 2026-09-15 and made 27 read requests against two internal repositories from an address new to the user until it was revoked on 2026-09-16; Sophos found no other host, no cloud activity and no customer impact ("
