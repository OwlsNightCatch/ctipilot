    kind: cited
    text: "**Detection:** in API and web access logs of internal tools, a sustained run of authenticated bulk-query requests from an external source, and in the connected CRM or support system an unusual spike in query volume, which is how WorkOS's employee noticed it ("
    urls: ["https://workos.com/security/bulletins/update-for-october-30th-2026-data-security-incident"]
