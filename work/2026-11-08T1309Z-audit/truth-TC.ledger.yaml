  - claim_id: 48f04000c2
    entry: 2026-11-06/microsoft-email-threat-landscape-q3-2026-security-overrides
    surface: "headline"
    kind: frontmatter
    text: "Microsoft Q3 email report: overrides let authentication-failing spoofed mail through; SVG CAPTCHA phishing returns"
  - claim_id: dd8a600fcf
    entry: 2026-11-06/microsoft-email-threat-landscape-q3-2026-security-overrides
    surface: "summary"
    kind: frontmatter
    text: "Microsoft's Q3 2026 email-threat report finds that many malicious messages spoofing the sender domains of business services were delivered despite failing authentication because tenant- or user-level overrides applied, 63% of the messages with a recorded security outcome in September. It also reports SVG attachments leading CAPTCHA-gated phishing at quarter end, Teams impersonators shifting from help-desk display names to ordinary personal names, and an August device-code phishing campaign that used a QR code in a Word document against legal organisations."
  - claim_id: 36a8ef1501
    entry: 2026-11-06/microsoft-email-threat-landscape-q3-2026-security-overrides
    surface: "body"
    kind: cited
    text: "Microsoft Threat Intelligence's report on Q3 2026 draws four points that matter to a Microsoft 365 defender ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/11/05/email-threat-landscape-q3-2026-trends-and-insights/"]
  - claim_id: 2df215b8f4
    entry: 2026-11-06/microsoft-email-threat-landscape-q3-2026-security-overrides
    surface: "body"
    kind: cited
    text: "First, malicious messages that spoof the sender domains of business services, such as document-signing and survey platforms, were often delivered because tenant- or user-level overrides applied, even after the messages failed email authentication and were identified as malicious: in September overrides applied to 63% of messages with a recorded security outcome, most of them tenant-level ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/11/05/email-threat-landscape-q3-2026-trends-and-insights/"]
  - claim_id: cba62e98d4
    entry: 2026-11-06/microsoft-email-threat-landscape-q3-2026-security-overrides
    surface: "body"
    kind: cited
    text: "Microsoft says the figures do not show that recipients opened the messages and that an overly broad exception made for a legitimate workflow can weaken protection against messages impersonating it ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/11/05/email-threat-landscape-q3-2026-trends-and-insights/"]
  - claim_id: fd0043d79a
    entry: 2026-11-06/microsoft-email-threat-landscape-q3-2026-security-overrides
    surface: "body"
    kind: cited
    text: "Second, CAPTCHA-gated phishing recovered while QR-code phishing kept falling, with SVG attachments central to the recovery: they carried 65% of CAPTCHA-gated attacks in August and 49% in September ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/11/05/email-threat-landscape-q3-2026-trends-and-insights/"]
  - claim_id: 67aa549efc
    entry: 2026-11-06/microsoft-email-threat-landscape-q3-2026-security-overrides
    surface: "body"
    kind: cited
    text: "Third, in Teams, ordinary personal-name display names rose from 46% of the observed July sample to 88% in September while explicit help-desk identities fell from 17% to 2%; Microsoft notes a personal name can accompany a help-desk claim while the account address keeps technical wording, and that more targeted attempts used domains resembling the victim organisation's ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/11/05/email-threat-landscape-q3-2026-trends-and-insights/"]
  - claim_id: 02de6165ce
    entry: 2026-11-06/microsoft-email-threat-landscape-q3-2026-security-overrides
    surface: "body"
    kind: cited
    text: "Fourth, an August campaign against legal organisations sent a Word document with a personalised QR code that led to a device-code phishing page and the genuine Microsoft device sign-in portal; completing the sign-in would have transferred a valid session token that gave persistent access without exposing the password or re-triggering MFA ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/11/05/email-threat-landscape-q3-2026-trends-and-insights/"]
  - claim_id: 1cfd681178
    entry: 2026-11-06/microsoft-email-threat-landscape-q3-2026-security-overrides
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** review the tenant and user overrides in your mail protection for entries that cover well-known service sender domains, because the override, not the detection, decided delivery; Microsoft's own advice is to check its recommended settings for Exchange Online Protection and Defender for Office 365 ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/11/05/email-threat-landscape-q3-2026-trends-and-insights/"]
  - claim_id: 096f41b441
    entry: 2026-11-06/microsoft-email-threat-landscape-q3-2026-security-overrides
    surface: "body"
    kind: derived
    text: "**Exposure:** a Microsoft 365 tenant that has tenant- or user-level allow or override entries covering the sender domains of widely used business services, since a message that fails authentication and is detected as malicious can still be delivered when such an override applies."
  - claim_id: a67d227d4b
    entry: 2026-11-06/microsoft-email-threat-landscape-q3-2026-security-overrides
    surface: "body"
    kind: derived
    text: "**Detection:** in mail-flow and message-trace telemetry, delivered messages that claim a business service's domain but fail SPF, DKIM and DMARC, together with the override that applied; in mail-gateway logs, SVG attachments that lead to a CAPTCHA page; in Teams audit, first-contact chats and calls from external tenants whose display name is a personal name but whose account address carries help-desk or service wording; in sign-in logs, device-code flow sign-ins."
  - claim_id: ad6205e6d4
    entry: 2026-11-07/file-system-access-api-browser-persistence-chrome-edge
    surface: "headline"
    kind: frontmatter
    text: "Oneconsult: a site granted a folder in Chrome or Edge can steal tokens and plant VS Code and PowerShell persistence"
  - claim_id: 977ed4b22c
    entry: 2026-11-07/file-system-access-api-browser-persistence-chrome-edge
    surface: "summary"
    kind: frontmatter
    text: "Oneconsult's analysis of Chromium's Windows blocklist shows that a website granted a folder through the File System Access API after two clicks keeps a handle for as long as the tab is open, and that the blocklist leaves .vscode, .Azure, C:\\Users\\Public, SMB shares and, after a OneDrive Known Folder Move, the Desktop reachable. The paths it demonstrates are token and .env theft, a fake VS Code extension and PowerShell profile or module backdoors that need the Bypass or Unrestricted execution policy, and a file proxy through the open tab that EDR sees only as browser file activity."
  - claim_id: f26240a993
    entry: 2026-11-07/file-system-access-api-browser-persistence-chrome-edge
    surface: "body"
    kind: cited
    text: "Oneconsult analyses, from the Chromium source and tests on Windows 11 with Chrome and Edge 150.0.7871.101, what a website can reach through the File System Access API once a user selects a folder and grants permission: the handle stays valid as long as the tab is open and is obtained after just two user clicks ("
    urls: ["https://www.oneconsult.com/en/blog/attack-simulation-red-teaming/fsa-api-possible-attacks-using-the-file-system-access-api/"]
  - claim_id: b9a8aa0cbc
    entry: 2026-11-07/file-system-access-api-browser-persistence-chrome-edge
    surface: "body"
    kind: cited
    text: "Chrome rejects blocklisted paths, but a path that is not in its table and not an ancestor of a blocked path is allowed, and the kDontBlockChildren rule leaves the subfolders of listed directories selectable; Oneconsult confirmed .vscode, the Azure token cache, C:\\Users\\Public and SMB shares as accessible ("
    urls: ["https://www.oneconsult.com/en/blog/attack-simulation-red-teaming/fsa-api-possible-attacks-using-the-file-system-access-api/"]
  - claim_id: d0e0a31218
    entry: 2026-11-07/file-system-access-api-browser-persistence-chrome-edge
    surface: "body"
    kind: cited
    text: "And it can run an interactive file proxy through the still-open tab, where EDR sees only the browser reading and writing files ("
    urls: ["https://www.oneconsult.com/en/blog/attack-simulation-red-teaming/fsa-api-possible-attacks-using-the-file-system-access-api/"]
  - claim_id: 76084f30dd
    entry: 2026-11-07/file-system-access-api-browser-persistence-chrome-edge
    surface: "body"
    kind: cited
    text: "A OneDrive Known Folder Move enabled while Chrome is running leaves a stale blocklist, so the redirected Desktop was writable; Oneconsult notes that the bypass has been reported to Google, which made the issue public, and that Google classed reading a single dragged file from a blocked folder as \"not a security issue\" ("
