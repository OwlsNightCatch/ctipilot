  summary: >-
    HPE's advisory (Critical, published 2026-11-03, revision 1) covers Fabric Composer 7.4.0 and below and 7.3.4 and below, fixed in 7.4.1 and 7.3.5: hard-coded passwords in the command-line interface give an unauthenticated remote attacker administrative access (CVE-2026-95731, CVSS 3.1 9.8), an authentication bypass in the underlying operating system for an unauthenticated adjacent attacker (CVE-2026-95732, 9.6), and further rows including an authenticated API privilege-escalation. HPE says all rows were found by its internal research and that it is not aware of public discussion or exploit code at the release date; it urges customers to patch given the breadth and impact. A companion bulletin HPESBNW05173 covers Virtual Intranet Access (VIA) before 4.7.9 (not read in full).
