    role: corroborating
  - url: https://wid.cert-bund.de/.well-known/csaf/white/2026/wid-sec-w-2026-4375.json
    publisher: BSI WID (WID-SEC-2026-4375, 27 CVEs, rated mittel)
    date: '2026-11-05'
    role: corroborating
  - url: https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-117441
    publisher: ENISA EUVD (record for CVE-2026-117691, 9.1)
    date: '2026-11-05'
    role: corroborating
  discovery_trace: >-
    first seen at: bsi-de, URL https://wid.cert-bund.de/.well-known/csaf/white/changes.csv (new WID-SEC-2026-4375 'Keycloak: Mehrere Schwachstellen', 27 CVEs) and enisa-euvd critical-score sweep URL https://euvdservices.enisa.europa.eu/api/search?fromScore=9&toScore=10&fromDate=2026-11-01&toDate=2026-11-08&size=100&page=1 (EUVD-2026-117441, CVE-2026-117691, 9.1) -> pivot: keycloak RSS URL https://www.keycloak.org/rss.xml (item 'Keycloak 26.8.2 released', 2026-11-05) -> primary: Keycloak release post URL https://www.keycloak.org/2026/11/keycloak-2682-released -> corroborating: Red Hat CVE page URL https://access.redhat.com/security/cve/CVE-2026-117691
  summary: >-
    Keycloak 26.8.2, released 2026-11-05, tags 36 distinct CVE ids in its release notes. The headline row is CVE-2026-117691: the SAML HTTP-Redirect binding implementation processes percent-encoded parameter names such as %53AMLResponse while the signature check only inspects literal parameter names, so a crafted unsigned SAML message is processed instead of a legitimately signed one, which Red Hat describes as full account takeover of federated users (CVSS 3.1 9.1, AV:N/AC:L/PR:N/UI:N; Red Hat rates it Important and states that mitigation is not available). The same release fixes further identity-integrity rows: account takeover through a stale SSO_AUTH note in the Organization identity-first login (CVE-2026-112208), an authentication race (CVE-2026-103112), unverified IdP email auto-linking (CVE-2026-97175), SAML broker issues (holder-of-key assertions accepted without proof of key possession CVE-2026-92855, ignored ProxyRestriction CVE-2026-92856, SAML adapter accepting assertions from
    the wrong issuer CVE-2026-93998), default-allowed dynamic client registration protocol mappers that write the reserved sub and aud claims or forge realm_access.roles (CVE-2026-92857, CVE-2026-96547) and an azp plus sid claim substitution that takes over a victim's Account REST session (CVE-2026-97367), a client manager able to take over the realm (CVE-2026-97847), unauthenticated SAML 1.1 parser loops that terminate the JVM (CVE-2026-110931, labelled an incomplete fix of CVE-2026-7307) or exhaust CPU until restart (CVE-2026-107602), and the bundled Brotli decoder write (CVE-2026-111497). Fixed version: Keycloak 26.8.2 (Red Hat builds via RHSA-2026:96039 and RHSA-2026:96040 per the EUVD references). No exploitation or public proof of concept is reported in the sources; BSI rates its aggregate advisory mittel. Assessment (mine): the federation-trust rows make this a priority upgrade for any Keycloak that brokers SAML IdPs or exposes dynamic client registration, but not an emergency without
    exploitation.
  region_nexus: global; Keycloak is widely used as open-source SSO/IAM, including in public-sector estates (no Swiss deployment evidenced in sources)
