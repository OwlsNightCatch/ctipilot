    attribution: Keycloak project (release notes 26.8.2)
    source_url: https://www.keycloak.org/2026/11/keycloak-2682-released
  - quote: Unauthenticated single-request JVM termination (OutOfMemoryError) via SAML 1.1 AuthorityBinding parser loop, incomplete fix of CVE-2026-7307
    attribution: Keycloak project (release notes 26.8.2)
    source_url: https://www.keycloak.org/2026/11/keycloak-2682-released
  - quote: leading to full account takeover of federated users.
    attribution: Red Hat Product Security
    source_url: https://access.redhat.com/security/cve/CVE-2026-117691
  - quote: The Red Hat Product Security team has assessed the severity of this vulnerability as Important
    attribution: Red Hat Product Security
    source_url: https://access.redhat.com/security/cve/CVE-2026-117691
  extended_notes: >-
    Exposure: Keycloak releases before 26.8.2 (the 26.8.1 build of 2026-10-13 is named as reproduced vulnerable for CVE-2026-112208). Exploitation of CVE-2026-117691 is an unauthenticated network request (Red Hat: a crafted HTTP GET with a percent-encoded parameter name) against the SAML HTTP-Redirect binding; which realm configurations expose it (analyst inference: a SAML identity-provider broker or SAML client using that binding) is not spelled out in the sources read. Triage/Detection concept (analyst inference from the stated mechanism): authentication and session logs showing federated logins whose SAML request arrived via GET with percent-encoded SAMLResponse/SigAlg/Signature parameter names, and logins for high-privilege federated accounts without a matching IdP-side authentication event. Store context: earlier Keycloak entries exist (26.6.2 16-CVE release, SAML broker signature bypass CVE-2026-16443 on 2026-08-07, reset-credentials takeover CVE-2026-18963); none covers 26.8.2.
