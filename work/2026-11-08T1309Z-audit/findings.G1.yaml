coverage_gaps:
- source_id: ibm-support-security-bulletins
  reason: >-
    Not in this slice but proven by the miss: the record's url pins one IBM MQ bulletin and has no listing transport, so IBM's two API Connect bulletins of 2026-11-05 (206 CVEs, 18 unauthenticated at 9.0 to 9.9) reached no run. IBM's /support/pages/bulletin/ page is JavaScript-rendered (url --direct returns a 45 KB shell with no bulletin links). Working discovery route this audit: the ENISA EUVD critical-score search (`url --direct 'https://euvdservices.enisa.europa.eu/api/search?fromScore=9&toScore=10&fromDate=YYYY-MM-DD&toDate=YYYY-MM-DD&size=100&page=N'`, pages 0 to 3 returned all 318 records of a week and carry vendor, product, EPSS and reference URLs), then `extract https://www.ibm.com/support/pages/node/<id>` for the bulletin (reads clean, per-CVE vectors and affected/fixed table).
- source_id: qnap-security-advisories
  reason: >-
    Recipe: the QSA feed (advisory/feed) lists only QSA-26-NN advisories and ended 2026-10-22; QNAP's vendor notices live under /en/security-news/2026. `python3 tools/fetch_source.py url --direct https://www.qnap.com/en/security-news/2026` returned the server-rendered listing with every notice href, and `extract <notice URL>` read the Plex2Shell notice of 2026-11-06 (trafilatura-direct).
- source_id: connectwise-trust-center
  reason: >-
    403 on url --direct again; WebSearch found no November 2026 bulletin (newest ScreenConnect bulletin 2026-09-08). Stays blocked with the status-page and WebSearch substitute.
- source_id: bsi-de
  reason: >-
    Recipe for a week's lookback that worked end to end: parse `url --direct https://wid.cert-bund.de/.well-known/csaf/white/changes.csv` (14,547 rows, 714 changed since 2026-11-01), import tools/fetch_source.py in a short script and call `bsi_csaf('WID-SEC-2026-<n>')` through a ThreadPoolExecutor(8) (610 documents in about 90 seconds, 43 early ids answer 404), then filter on document.tracking.initial_release_date and document.aggregate_severity.text; the BSI CSAF carries no CVSS scores, so pair it with the EUVD critical-score search for scores.
- source_id: enisa-euvd
  reason: >-
    Recipe note: the search endpoint accepts `page` (0-based) with size=100; one week with fromScore=9 returned total 318 over four pages; rows carry baseScoreVector, epss, aliases (CVE ids), enisaIdVendor/enisaIdProduct and references. `euvd.enisa.europa.eu/enisa/<EUVD id>` is a JavaScript shell and `extract` of it falls back to the reader; use `euvdservices.enisa.europa.eu/api/enisaid?id=<EUVD id>`.
- source_id: ncsc-ch-security-hub
  reason: >-
    Recipe note: `ncsc-csh recent N` returns {count, posts[]} with fields id, created, history[] (Published/Edited events with reason text), title, summary, citation_url; the Edited history reason carries the update note (13054: 'Update: 6 November 2026, added Swiss incidents, Copeland/Dixell XWEB and healthcare attacks.').
- source_id: msrc-update-guide
  reason: >-
    Recipe note: the SUG vulnerability list returns no exploited/publiclyDisclosed fields; per-CVE `msrc cve <CVE>` does. The revised-CVE sweep returned 1742 records, only 11 with a Microsoft CNA (the rest are Linux, Chrome, GitHub and similar CNAs relayed for Azure Linux/Edge), so filter on issuingCna first.
- source_id: fortinet-psirt
  reason: >-
    Reader credit: `extract https://www.fortiguard.com/psirt/FG-IR-26-186` fell back to the jina reader and returned only the site navigation (no advisory body), while FG-IR-26-187 read through trafilatura-direct; advisory pages are inconsistent, prefer the /psirt listing which carries ids, CVEs, component, attack type and severity.
- source_id: extract-reader-fallbacks
  reason: >-
    Four of my `extract` calls fell back to the jina reader and spent credit without benefit: euvd.enisa.europa.eu/enisa/EUVD-2026-118789 (SPA shell), github.com/keycloak/keycloak/security/advisories/GHSA-c85j-3hq2-q6wj (404 page), wordfence.com/threat-intel/vulnerabilities/id/<uuid> (read OK but through the reader) and fortiguard.com/psirt/FG-IR-26-186. Avoid `extract` on GitHub advisory URLs, EUVD portal pages and Wordfence ids; use the EUVD API, the GitHub advisory JSON (`url --direct https://api.github.com/advisories/<GHSA id>` returned the record for GHSA-c85j-3hq2-q6wj; `.../repos/<owner>/<repo>/security-advisories?per_page=N` lists a project's own advisories) or the vendor release notes.
- source_id: citrix-support-portal
  reason: >-
    support.citrix.com article pages (CTX697256, CTX697300) are an Angular shell on `extract`; no scores for the 2026-11-03 XenServer Workload Balancing, Conversion Manager and Unicon eLux Scout bulletins could be read, CERT-FR AVI-1449 names versions and CVE ids only.
