  summary: >-
    Canonical's advisory (dated 2026-10-28, fixes released 2026-10-29: LXD 6.10.1, 5.21.9, 5.0.11, 4.0.15 and MicroCloud 3.4.1, 2.1.5) says the remote API's mutual-TLS logic compared every certificate the client sent with the trust store although only the leaf proves key ownership, so an attacker who can reach the LXD HTTPS API and holds a trusted client's public certificate can authenticate as that client by placing it as an intermediate in the chain; in MicroCloud an attacker can intercept a joining member's public certificate and then authenticate as that member, and depending on the victim's privilege may reach root on the host. NCSC-NL relayed it on 2026-11-02 (kans medium, schade high). Canonical and NCSC-NL report no exploitation.
