  summary: >-
    On 2026-11-05 IBM published two security bulletins for IBM API Connect, its API management platform (gateway, manager and developer portal): one for the v12 on-premises line (affected v12.1.0.0 to v12.1.1.2, fixed in v12.1.1.3) and one for V10.0.8.0 to V10.0.8.12 (fixed in 10.0.8.13). Counting the CVE blocks on the two pages, the bulletins carry 206 distinct CVEs (202 on the v12 page, 134 on the v10 page, 130 in both); 46 of the v12 rows and 25 of the v10 rows score CVSS 3.1 9.0 or higher, and 18 (v12) and 8 (v10) of those carry PR:N, meaning no privileges. Unauthenticated 9.x rows named in the bulletins include an OS command injection to arbitrary code execution (CVE-2026-17408, 9.8, in both), a path traversal to code execution (CVE-2026-17340, 9.8, v12 only), an authentication bypass through improper verification of a cryptographic signature (CVE-2026-17301, 9.8, both), an authentication bypass through an alternate path that exposes gateway configuration (CVE-2026-17313, 9.8, v12),
    two hard-coded administrative credential rows (CVE-2026-17360, 9.8, v12; CVE-2026-17403, 9.0, both), missing authorization that lets a remote caller create, modify or delete tenants (CVE-2026-17362, 9.8, v12), token issuance for other users because directory authentication is not enforced (CVE-2026-16720, 9.8, both), an XXE (CVE-2026-16884, 9.9, v12), an open-redirect account takeover (CVE-2026-17297, 9.6, user interaction required, both) and several SSRF rows at 9.3. The much larger set of authenticated 9.9 rows (OS command injection, upload-to-code-execution, LDAP injection across tenants, cross-tenant portal access) matters for multi-tenant installs. IBM lists 'None' under Workarounds and Mitigations on both pages and neither bulletin mentions exploitation or a proof of concept; I found no CISA KEV entry and no exploitation report. The bulletins are the vendor's own statements; the CVSS vectors are IBM's (CVSS Source: IBM). Assessment (mine, not IBM's): the sheer count and the mix
    of authentication bypass, hard-coded credential and command-injection rows on an internet-facing control plane makes this a patch-now item for any API Connect estate, but with no exploitation evidence it is a notable rather than a critical entry.
  region_nexus: >-
    global; relevant to any Swiss federal, cantonal or communal estate that runs IBM API Connect as an API gateway or e-government integration layer (no Swiss deployment evidenced in sources)
