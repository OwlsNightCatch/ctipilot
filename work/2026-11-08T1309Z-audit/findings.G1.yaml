  extended_notes: >-
    Exposure: v12 on-premises 12.1.0.0 to 12.1.1.2 and V10.0.8.0 to 10.0.8.12 (IBM tables: '| API Connect V12 OnPrem | v12.1.0.0 - v12.1.1.2 |', '| API Connect | V10.0.8.0 - V10.0.8.12 |'); the vulnerable surface depends on component (gateway, manager, portal) per CVE and the bulletins give no per-component split in the summary table, so exposure is the reachable API Connect management, portal and gateway interfaces. Post-patch check: because two rows are hard-coded administrative credentials (CVE-2026-17360, CVE-2026-17403) and token/authentication-bypass rows exist, patching does not by itself evict an attacker who used them; review administrative and tenant-creation events, token issuance for unexpected principals and unexpected outbound requests from API Connect components after upgrading (analyst inference, IBM names no indicators). Detection concept (analyst inference tied to the stated mechanisms): web and API access logs on the management and portal endpoints for requests that reach
    admin or tenant operations without a preceding authenticated session, and process-creation events spawned by the API Connect service accounts (command-injection rows). Discovery note: the store's ibm-support-security-bulletins record has no listing transport and IBM changes normally reach the pipeline only through NCSC-NL relays; none had carried API Connect by 2026-11-08, so this reached the audit only through the EUVD critical-score sweep.
- title: 'Keycloak 26.8.2 (2026-11-05): SAML redirect-binding signature bypass allows broker login as any user (CVE-2026-117691, CVSS 9.1) among 36 CVE-tagged fixes'
  sources:
  - url: https://www.keycloak.org/2026/11/keycloak-2682-released
    publisher: Keycloak project (release notes 26.8.2)
    date: '2026-11-05'
    role: primary
