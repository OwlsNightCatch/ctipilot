    text: "Splunk's advisory SVD-2026-1015, published on 2026-10-28 and updated through 2026-11-06, lists Splunk Enterprise, the Splunk Visual Exporter app, SOAR Automation Broker, UBA, Attack Analyzer, Python for Scientific Computing, several AppDynamics components and Smartlook as including packages affected by four Node.js flaws, CVE-2026-111497 among them; the page gives no CVSS score, no attacker position and no exploitation statement, and it covers the Brotli flaw and three DNS and TLS hostname-validation flaws together, so it does not show which of them reaches a given product ("
