  - claim_id: c6ca90f946
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "cves[CVE-2026-111497]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-111497\", \"cvss\": \"9.2 (CVSS 4.0)\", \"status\": [\"exploited\", \"cisa-kev\", \"poc-public\", \"patch-available\"], \"affected\": \"Node.js 22.x, 24.x and 26.x before 22.23.4, 24.22.1 and 26.12.1; Google Brotli 1.0.3 to 1.2.0; PyPI Brotli up to 1.2.0; PyPI brotlicffi up to 1.2.0.2; Bun 1.0.21 to before 1.4.4; Istio before 1.29.9, 1.30.6 and 1.31.2; Envoy v1.39.2, v1.38.5, v1.37.7 and v1.36.11 with the Brotli decompressor configured; .NET before 8.0.33, 9.0.22 and 10.0.14 where Brotli data from untrusted parties is decompressed; PAN-OS 12.2 before 12.2.4-h1, 12.1 before 12.1.4-h13, 12.1.7-h11 and 12.1.10-h3, and 11.2 before 11.2.4-h23, 11.2.7-h23, 11.2.10-h17, 11.2.13-h4 and 11.2.16-h1, on PA-Series and VM-Series firewalls with Brotli inspection and TLS decryption enabled (PAN-OS 11.1 and 10.2 and the management interface are not affected); PHP for Windows builds without the -1 suffix, through the cURL extension when automatic decompression is enabled; Ubuntu, Debian and Alpine brotli packages and the Ruby brotli gem before the fixed builds listed; VMware Cloud Foundation SDDC Manager 9.1.1 (critical, CVSS 3.1 9.8) and 9.1.0, 9.0.x and 5.2.x (important, 7.5); Palo Alto Networks Prisma Cloud Application Security Transporter Client before 0.2.9; Splunk Enterprise 10.0 (9.4 and 10.2 or later not affected), Splunk Visual Exporter (every Splunk Enterprise version), Splunk SOAR Automation Broker, Splunk UBA and Splunk Attack Analyzer, which Splunk lists as including packages affected by this and three further Node.js flaws; Citrix Unicon eLux Scout On-Prem, Scout On-Prem LTSR and Scout Cloud Gateway On-Prem (no version range stated); Keycloak before 26.8.2 (bundled Brotli decoder)\", \"fixed\": \"Node.js 22.23.4, 24.22.1, 26.12.1; Google Brotli 1.0.10, 1.1.1, 1.2.1; PyPI Brotli 1.2.1; PyPI brotlicffi 1.2.1.0; Bun 1.4.4; Istio 1.29.9, 1.30.6, 1.31.2; Envoy v1.40.0, v1.39.3, v1.38.6, v1.37.8, v1.36.12; .NET 8.0.33, 9.0.22, 10.0.14; PAN-OS hotfixes 12.2.4-h1, 12.1.4-h13, 12.1.7-h11, 12.1.10-h3, 11.2.4-h23, 11.2.7-h23, 11.2.10-h17, 11.2.13-h4 and 11.2.16-h1 (all released, as read on 2026-10-29); PHP for Windows 8.5.12-1, 8.4.27-1, 8.3.36-1, 8.2.35-1; Ubuntu brotli 1.2.0-4ubuntu0.1 (26.10), 1.2.0-3ubuntu0.1 (26.04), 1.1.0-2ubuntu0.1 (24.04), 1.0.9-2ubuntu0.1 (22.04), ESM 1.0.7-6ubuntu0.1+esm1 (20.04, whose nodejs package stays vulnerable); Debian brotli 1.0.9-2+deb12u1 (bookworm) and 1.1.0-2+deb13u1 (trixie); Alpine brotli 1.2.1-r0 (edge, 3.24, 3.23) and 1.1.1-r0 (3.21); Ruby brotli gem 0.9.1 and 0.9.2; SDDC Manager none yet, patch pending, workarounds KB460732 (9.1.1) and KB460734 (9.1.0, 9.0.x, 5.2.x); Prisma Cloud Application Security Transporter Client 0.2.9; Splunk Enterprise 10.2 or higher for the bundled Node.js runtime (no fixed 10.0 build or date), Splunk Visual Exporter none (disable or remove the app), no fix stated for the other Splunk products; Citrix Scout On-Prem hotfix 2609.1, Scout On-Prem LTSR 2508 CU2 LTSR, Scout Cloud Gateway On-Prem 2605.1-3; Keycloak 26.8.2\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
