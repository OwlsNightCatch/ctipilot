    kind: record-summary
    text: "Splunk narrowed advisory SVD-2026-1015 on 2026-11-05 and 2026-11-06: only Splunk Enterprise 10.0 is vulnerable, 9.4 and 10.2 or later are not, so the upgrade applies to 10.0 instances alone while the Visual Exporter app is still to be disabled on every version. The revision adds Splunk Observability components and a Synthetic Runner fix, and Keycloak 26.8.2 fixes the flaw in its bundled Brotli decoder."
