items:
  - title: "DDRop — a $159 DDR5 hardware interposer drops targeted memory writes to defeat Intel TDX/SGX and AMD SEV-SNP, forging TDX remote-attestation reports; no CVE, no vendor fix planned"
    sources:
      - { url: "https://www.heise.de/news/DDROP-Adapterstecker-hebelt-Confidential-Computing-aus-11454579.html", publisher: "heise Security (Dirk Knop)", date: "2026-09-16", role: "primary" }
      - { url: "https://ddropattack.eu/", publisher: "DDRop research team (KU Leuven / ETH Zurich / Durham University / Google)", date: "2026-09-14", role: "primary" }
      - { url: "https://www.intel.com/content/www/us/en/security-center/announcement/intel-security-announcement-2026-08-11-001.html", publisher: "Intel PSIRT (announcement 2026-09-14-001)", date: "2026-09-14", role: "corroborating" }
      - { url: "https://www.amd.com/en/resources/product-security/bulletin/amd-sb-3048.html", publisher: "AMD Product Security (AMD-SB-3048)", date: "2026-09-15", role: "corroborating" }
    discovery_trace: "first seen at: heise-sec (essential source), URL https://www.heise.de/news/DDROP-Adapterstecker-hebelt-Confidential-Computing-aus-11454579.html → primary: DDRop research site, URL https://ddropattack.eu/ (research paper https://ddropattack.eu/ddrop.pdf) → pivot: Intel security announcement, URL https://www.intel.com/content/www/us/en/security-center/announcement/intel-security-announcement-2026-08-11-001.html → pivot: AMD security bulletin AMD-SB-3048, URL https://www.amd.com/en/resources/product-security/bulletin/amd-sb-3048.html"
    summary: |
      Researchers from KU Leuven, ETH Zurich, Durham University and Google disclosed DDRop, an open-source
      DDR5 hardware interposer (~$159 in parts, installs in minutes) that defeats the confidentiality/integrity
      guarantees of Intel TDX, Intel Scalable SGX and AMD SEV-SNP without reading encrypted memory or requiring
      any software bug in the victim VM. Instead of snooping the bus like earlier passive attacks (Membuster,
      WireTap, TEE.fail), DDRop actively abuses the DDR5 bus's error-handling path: it forges a parity error on
      a targeted write and suppresses the resulting alert, so the memory module silently discards the command
      while the processor believes the write completed — leaving stale, attacker-chosen ciphertext in place, at
      full native bus speed with no timing signature to flag the tampering. Against Intel TDX, the team used this
      to corrupt the TDX module's initialization writes to Secure Extended Page Tables (SEPT), letting an
      attacker-controlled Trust Domain remap its own memory onto any physical RAM address; in TDX's default
      Logical Integrity mode this exposes and corrupts other TDs' encrypted control structures, and even under
      the stronger Cryptographic Integrity mode an attacker can still forge their own TD's launch-measurement
      attestation (via TDG.MR.REPORT) so a backdoored VM passes remote attestation as trusted, or flip the TD's
      debug-mode bit (~50% success per attempt) to obtain a hypervisor-level plaintext memory dump. The only
      prerequisite is brief physical access to install the interposer plus the standard TEE threat model
      (compromised hypervisor/BIOS) — the researchers list malicious data-center technicians, hardware
      supply-chain tampering, and law-enforcement/state seizure as realistic access vectors. Intel and AMD
      confirmed the findings under coordinated disclosure (2026-09-14/15) but both declared physical DRAM-bus
      attacks out of scope for their current products' threat model; neither is assigning a CVE or shipping a
      mitigation. Intel says it is evaluating "Platform Owner Endorsements" (to let remote parties verify who
      physically holds sensitive hardware) and next-generation memory-encryption schemes with built-in freshness
      protection. This is disclosed academic research with public PoC code, hardware schematics and firmware on
      GitHub (github.com/ddropattack/ddrop) — no in-the-wild exploitation is claimed or plausible given the
      physical-access requirement.
    region_nexus: "global; co-authored by ETH Zurich (Switzerland). Directly relevant to any organization or agency that relies on a cloud provider's Confidential Computing marketing (Intel TDX/SGX, AMD SEV-SNP) as a data-sovereignty or trust assurance for hosting sensitive workloads on infrastructure it does not physically control."
    primary_sector_nexus: "indirect"
    sector: "public-sector"
