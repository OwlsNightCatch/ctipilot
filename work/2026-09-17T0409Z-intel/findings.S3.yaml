          summary: "Second annual Mandiant special report (published 2026-09-15) synthesizing Mandiant IR/red-team and Google Threat Intelligence Group frontline observations on adversarial AI use, AI-system security assessments, and AI-powered defense; carries eight named case studies of AI-agent abuse in real intrusions and red-team engagements." }
      - { key: "actor:dark-castle", type: actor, name: "DARK CASTLE", aliases: ["UNC2814"],
          summary: "Cyber-espionage cluster targeting global telecommunications providers and government organizations, per Mandiant/GTIG (2026-09), using a backdoor that hides C2 inside legitimate cloud productivity-spreadsheet traffic; formerly tracked as UNC2814 under Google's updated threat-actor naming system." }
