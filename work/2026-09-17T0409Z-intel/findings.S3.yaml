          summary: "Open-source $159 DDR5 hardware interposer disclosed 2026-09-14 by KU Leuven/ETH Zurich/Durham University/Google researchers that abuses DDR5 bus error-handling to silently drop targeted memory writes, defeating Intel TDX/Scalable SGX and AMD SEV-SNP confidential-computing integrity — including forging Intel TDX remote-attestation reports and toggling TD debug mode. No CVE assigned; Intel and AMD declare physical DRAM-bus attacks out of scope for their current threat models (Intel PSIRT / AMD-SB-3048, 2026-09-14/15)." }
