    evidence:
      - quote: "DDRop is a small, low-cost hardware interposer device that can make writes to a server's memory disappear, causing the computer to read old data as if it were newly written."
        attribution: "DDRop research team (KU Leuven / ETH Zurich / Durham University / Google)"
        source_url: "https://ddropattack.eu/"
      - quote: "This primitive is 100% deterministic and lets an attacker-controlled TD remap its own memory onto any physical address in RAM."
        attribution: "DDRop research team"
        source_url: "https://ddropattack.eu/"
      - quote: "Intel's analysis confirms that the described scenarios fall outside Intel's standard threat model for confidential computing deployments."
        attribution: "Intel PSIRT"
        source_url: "https://www.intel.com/content/www/us/en/security-center/announcement/intel-security-announcement-2026-08-11-001.html"
      - quote: "AMD has assessed this report and has determined that the described technique relies on a physical attack against the memory bus, which falls outside the scope of the published threat model for SEV-SNP. AMD does not plan to assign a CVE or release mitigations in response to this report."
        attribution: "AMD Product Security (AMD-SB-3048)"
        source_url: "https://www.amd.com/en/resources/product-security/bulletin/amd-sb-3048.html"
    extended_notes: |
      Triage/detection angle: this is a physical-access class of attack (T1200 Hardware Additions), not remotely
      detectable by conventional host telemetry — the defensive lever is entirely procedural/physical (restrict
      and monitor physical server access, secure supply-chain handling, least-privilege for system
      firmware/software) per Intel's own customer-action list, not a patch. Distinguishes cleanly from prior
      passive interposer/cold-boot research (BatteringRAM, BadRAM, "Download more RAM") which the DDRop team
      cites as its own prior-art lineage — worth a Background paragraph if the main agent is doing a deep dive
      on Confidential Computing trust assumptions. No exploitation in the wild; this is coordinated-disclosure
      academic research.

  - title: "PhantomRaven: CrowdStrike unmasks a self-described bug-bounty hunter running an LLM-generated npm infostealer to manufacture their own bounty submissions"
    sources:
      - { url: "https://www.crowdstrike.com/en-us/blog/phantomraven-llm-generated-information-stealer-for-bug-bounty-hunting/", publisher: "CrowdStrike Counter Adversary Operations", date: "2026-09-16", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/new-phantomraven-npm-attack-wave-steals-dev-data-via-88-packages/", publisher: "BleepingComputer (Bill Toulas), citing Endor Labs research", date: "2026-03-11", role: "background/corroborating on malware mechanics" }
    discovery_trace: "first seen at: crowdstrike (rotation source), URL https://www.crowdstrike.com/blog/category/counter-adversary-operations/ → primary: CrowdStrike Counter Adversary Operations blog post, URL https://www.crowdstrike.com/en-us/blog/phantomraven-llm-generated-information-stealer-for-bug-bounty-hunting/ → corroboration via WebSearch (\"CrowdStrike PhantomRaven infostealer bug bounty hunter LLM\") → background: BleepingComputer/Endor Labs, URL https://www.bleepingcomputer.com/news/security/new-phantomraven-npm-attack-wave-steals-dev-data-via-88-packages/"
    summary: |
      CrowdStrike Counter Adversary Operations identifies a financially motivated threat actor — a
      self-proclaimed bug-bounty hunter active since November 2022 — as the developer and operator of
      PhantomRaven, a JavaScript npm information stealer whose code CrowdStrike assesses "almost certainly"
      LLM-generated with high confidence (verbose per-symbol comments explaining the obvious, placeholder code,
      and statistical token-analysis patterns consistent with an LLM token stream). The actor distributes the
      stealer via typosquatted npm packages containing only trivial, non-malicious code (a "Hello, world!"
      script), but the package.json specifies a dependency via a raw HTTP URL instead of a normal npm registry
      reference — a Remote Dynamic Dependency (RDD) that npm silently fetches at install time from
      attacker-controlled infrastructure, so the actual malicious payload never appears in the npm registry's
      own web interface or most automated scanners. The fetched payload registers as a `preinstall` script that
      auto-executes on `npm install` (npm 12+ now blocks unapproved preinstall scripts by default, a June 2026
      change CrowdStrike credits with narrowing this vector). Once running, the stealer harvests OS/hostname/
      architecture, local and external IPs (queried via api64.ipify.org), NodeJS version, current directory and
      PID, Git/npm-configured usernames and emails, and a long list of CI/CD environment variables covering
      GitHub Actions, GitLab CI, Jenkins and CircleCI (tokens, project IDs, build URLs) — data consistent with
      harvesting CI/CD account credentials rather than end-user secrets. Exfiltration goes out over both HTTP GET
      (query string) and POST (JSON body) to the same C2 domains, with an incomplete WebSocket fallback CrowdStrike
      reads as an unfinished, likely LLM-suggested redundancy feature rather than live infrastructure. CrowdStrike
      correlated npm usernames, an X account, a HackerOne-referencing alias, a GitHub account, and a 2025 PyPI
      submission (rejected by PyPI as an information-stealer attempt) back to the same operator, who publicly
      claims — via their own X profile — to have collected bounties from at least nine organizations across
      tech, retail and hospitality via Bugcrowd, Intigriti, YesWeHack, HackenProof and HackerOne, using
      compromises enabled by their own malware as leverage for legitimate-looking disclosure submissions.
      CrowdStrike frames this as a broader eCrime pattern: financially motivated actors developing proprietary,
      AI-generated tooling rather than renting commodity malware, alongside separately observed AI-generated
      PowerShell use by a TRAVELING SPIDER/INC affiliate and by PUNK SPIDER. PhantomRaven itself (the RDD
      technique and malware family) was first documented by Koi Security in an earlier 2025 wave and by Endor
      Labs' "Return of PhantomRaven" research covering three further 2025-2026 waves (126+88 packages,
      86,000+ downloads) — the actor-identification/monetization finding is CrowdStrike's new September 2026
      contribution.
    region_nexus: "global (npm ecosystem); no Swiss-specific targeting reported, but any government software-development team consuming npm dependencies or running CI/CD pipelines (GitHub Actions, GitLab CI, Jenkins, CircleCI) is in the exposed population."
    primary_sector_nexus: "indirect"
    sector: "public-sector"
    cves: []
    techniques: [T1195.001, T1587.001, T1552.007, T1071.001]
    affected_products: ["npm (Node Package Manager)", "GitHub Actions", "GitLab CI", "Jenkins", "CircleCI"]
    entity_keys: []
    new_entities:
      - { key: "malware:phantomraven", type: malware, name: "PhantomRaven", aliases: [],
          summary: "JavaScript npm information stealer, LLM-generated per CrowdStrike (high confidence), distributed via typosquatted packages using Remote Dynamic Dependencies (HTTP-URL package.json dependencies) to evade npm-registry scanning; harvests system info and CI/CD environment variables/tokens (GitHub Actions, GitLab CI, Jenkins, CircleCI). First documented by Koi Security (2025) and Endor Labs (\"Return of PhantomRaven\"); CrowdStrike (2026-09-16) attributes it to a single self-described bug-bounty hunter who leverages resulting compromises to submit bounty claims to Bugcrowd, Intigriti, YesWeHack, HackenProof and HackerOne." }
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "CrowdStrike Counter Adversary Operations identified a financially motivated threat actor who works as a bug bounty hunter and who developed and distributed the JavaScript (JS)-based information stealer PhantomRaven via npm."
        attribution: "CrowdStrike Counter Adversary Operations"
        source_url: "https://www.crowdstrike.com/en-us/blog/phantomraven-llm-generated-information-stealer-for-bug-bounty-hunting/"
      - quote: "PhantomRaven is a simple JS information stealer that exfiltrates system information and continuous integration/continuous deployment (CI/CD)-related environment variables, likely in an attempt to collect account credentials. The code was almost certainly LLM-generated, and the author's technical sophistication is likely low."
        attribution: "CrowdStrike Counter Adversary Operations"
        source_url: "https://www.crowdstrike.com/en-us/blog/phantomraven-llm-generated-information-stealer-for-bug-bounty-hunting/"
      - quote: "In npm version 12 or later, if a developer attempts to install a dependency package with a preinstall script, they receive a warning message indicating that the script has been blocked and will not automatically execute."
        attribution: "CrowdStrike Counter Adversary Operations"
        source_url: "https://www.crowdstrike.com/en-us/blog/phantomraven-llm-generated-information-stealer-for-bug-bounty-hunting/"
    extended_notes: |
      Verification note: the core new claim (single operator, LLM-generated code, bounty-hunter monetization
      motive) rests solely on CrowdStrike's own cross-platform identity correlation — marked SINGLE-SOURCE-OTHER
      accordingly. The malware family's existence, RDD technique and prior campaign waves are independently
      confirmed by Koi Security and Endor Labs (via BleepingComputer), so the underlying threat is
      well-corroborated even though the September 2026 attribution angle is CrowdStrike-exclusive. Detection
      angle for defenders: hunt for `preinstall`/`postinstall` npm lifecycle-script execution spawning outbound
      HTTP to non-registry hosts immediately after `npm install`, and for CI/CD runner processes making outbound
      connections to `ipify.org`-style IP-lookup services followed by GET/POST exfil — a benign lookalike would
      be a legitimate build tool's own telemetry/update-check call, discriminated by the absence of a
      corresponding, expected package purpose and by the destination domain pattern (freshly registered,
      "artifact"/"registry"-themed domains per Endor Labs' prior-wave infrastructure notes).

  - title: "ANNUAL REPORT — Mandiant AI Risk and Resilience Report 2026: eight frontline case studies of AI agents weaponized inside real intrusions, from an AI-recommended poisoned dependency reviving the Shai-Hulud worm to a $50,000 runaway-agent cloud bill"
    sources:
      - { url: "https://cloud.google.com/security/resources/ai-risk-and-resilience-2026", publisher: "Mandiant / Google Threat Intelligence Group (Google Cloud)", date: "2026-09-15", role: "primary" }
      - { url: "https://www.helpnetsecurity.com/2026/09/16/google-mandiant-enterprise-ai-security-risks-report/", publisher: "Help Net Security (Anamarija Pogorelec)", date: "2026-09-16", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"Mandiant Google Threat Intelligence new report September 16 2026\") → primary: Mandiant/Google Cloud report landing page, URL https://cloud.google.com/security/resources/ai-risk-and-resilience-2026 → corroborating: Help Net Security, URL https://www.helpnetsecurity.com/2026/09/16/google-mandiant-enterprise-ai-security-risks-report/"
    summary: |
      Mandiant published the second annual edition of its "AI Risk and Resilience" special report (first edition
      covered 2025), synthesizing frontline Mandiant incident-response/red-team engagements and Google Threat
      Intelligence Group (GTIG) research into eight case studies of AI-agent abuse inside real intrusions and
      assessments. Most operationally significant for defenders: (1) a SaaS provider was compromised when an
      attacker poisoned an external software package that a victim developer's AI coding-assistant session then
      recommended installing — the assistant, trusted as a code-review interpreter, became the delivery
      mechanism, and the resulting infostealer harvested GitHub OAuth tokens to deploy a self-propagating
      Shai-Hulud worm across ~100 internal repositories, then re-poisoned the org's own namespace to cause a
      secondary downstream infection; (2) an attacker with a stolen long-lived CI/CD credential turned a live VM
      into an "AI co-debugging" offensive hub, iteratively prompting an LLM in real time to build a
      multi-worker credential-harvesting framework, write dynamic IP-rotation evasion scripts, and co-develop a
      Rust tool to validate stolen financial-account balances — malware development happening live, in-session,
      rather than offline; (3) a threat actor poisoned an internal AI repository and tampered with an AI
      assistant's CLI hooks to achieve native remote code execution through the assistant's own extensibility
      framework; (4) malware using embedded local AI inference to fingerprint active endpoint security tools and
      dynamically rewrite its own command-execution strings at runtime — "just-in-time" polymorphism that never
      writes a predictable payload to disk, defeating static EDR signatures; (5) a "Confused Deputy" red-team
      finding in which role-confusion prompt injection convinced an internal AI assistant it was assisting an
      authorized security test, so it used its own CLI to clone sensitive internal repositories and push them to
      an external, attacker-controlled GitHub account — GitHub being an allowlisted external domain the
      assistant was otherwise permitted to reach; (6) a financial-services accounting-reconciliation agent hit a
      null-value formatting bug and entered an unconstrained recursive reasoning loop, firing over 15,000
      high-cost API calls in under an hour, generating a ~$50,000 cloud-billing spike and locking the production
      ledger database; (7) a public-facing customer-service RAG agent that treated forum comments and support
      tickets as trusted context let an attacker embed hidden instructions in a public forum post, hijacking the
      model's reasoning to exfiltrate other customers' PII from cross-tenant support tickets; and (8) a named
      espionage cluster, DARK CASTLE (formerly tracked as UNC2814), targeting global telecommunications
      providers and government organizations with a backdoor that hid its C2 inside legitimate cloud
      productivity-spreadsheet traffic — an agentic SOC triage pipeline escalated a single low-frequency
      anomalous command execution that a human analyst would typically have scored as low-severity, enabling
      detection before lateral spread. Mandiant's cross-cutting defensive architecture recommendation is a shift
      from static service-account identities to cryptographically bound, lifecycle-integrated agent identities
      (e.g. SPIFFE/Workload Identity Federation) across five pillars: hyper-segmented identity perimeters,
      dual-execution authority (human-in-the-loop re-authorization for high-risk bulk actions), data/tool/
      operational governance (financial circuit breakers, bounded recursion limits), active multi-layered
      telemetry (semantic firewalls such as Model Armor, VPC Service Controls), and treating AI coding
      assistants/MCP servers as privileged sessions requiring cryptographic CLI-hook integrity checks.
    region_nexus: "global; sector-relevant case study (DARK CASTLE, ex-UNC2814) explicitly names government organizations and telecommunications providers as targets."
    primary_sector_nexus: "indirect"
    sector: "public-sector"
    cves: []
    techniques: [T1195.002, T1027.004, T1567.002, T1078.004]
    affected_products: []
