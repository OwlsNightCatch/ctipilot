    confidence: HIGH
    novelty: new
    evidence:
      - quote: "By executing this recommendation, the assistant inadvertently functioned as a trojan horse, facilitating the installation of malicious software... deploy the self-propagating Shai-Hulud worm across approximately 100 internal code repositories."
        attribution: "Mandiant (Google Cloud)"
        source_url: "https://cloud.google.com/security/resources/ai-risk-and-resilience-2026"
      - quote: "In under an hour it generated over 15,000 high-frequency, high-cost reasoning API calls, triggering a sudden ~$50,000 cloud-billing spike and causing severe local database locking that halted active business transactions."
        attribution: "Mandiant (Google Cloud)"
        source_url: "https://cloud.google.com/security/resources/ai-risk-and-resilience-2026"
      - quote: "During the attack phase, the malware dynamically rewrites its own command execution strings at runtime to bypass detection."
        attribution: "Mandiant (Google Cloud)"
        source_url: "https://cloud.google.com/security/resources/ai-risk-and-resilience-2026"
    extended_notes: |
      This is a long, dense periodic report (PD-9 flag: ANNUAL REPORT). If the main agent runs this as a deep
      dive, the strongest detection-engineering hooks are: (a) for case study 4's JIT polymorphic malware —
      monitor for unexpected native-compiler process spawns from non-developer parent processes and
      rapid file-create-execute-delete cycles in temp directories, plus endpoint CPU/GPU baseline anomalies from
      otherwise-lightweight background processes; (b) for case study 5's Confused Deputy — SIEM correlation
      rules that trigger when an internal-facing AI-service account initiates outbound data transfer to an
      allowlisted-but-attacker-controlled external endpoint (the discriminator from a benign lookalike being
      destination account/repo identity, not the allowlisted domain itself); (c) for case study 8 (DARK CASTLE)
      — the transferable lesson is that agentic SOC triage escalated a single low-frequency command-execution
      anomaly a human analyst would routinely have deprioritized, which is the concrete argument for correlating
      isolated endpoint anomalies against outbound-traffic telemetry rather than triaging events in isolation.

  - title: "Spain's AEPD confirms the first regulatory notification of a personal-data breach executed by an autonomous AI agent, which chained vulnerability discovery, login, further vulnerability discovery, and data modification without human step-by-step direction"
    sources:
      - { url: "https://www.heise.de/news/Spaniens-Datenschutzaufsicht-Erster-Cyberangriff-mithilfe-eines-KI-Agenten-11454545.html", publisher: "heise Security (Martin Holland)", date: "2026-09-16", role: "primary (in-window discovery)" }
      - { url: "https://www.aepd.es/prensa-y-comunicacion/blog/primera-notiviacion-brecha-datos-personales-causada-por-ataque-ejecutado-mediante-agente-ia", publisher: "Agencia Española de Protección de Datos (AEPD)", date: "2026-09-14", role: "primary (regulator's own statement)" }
    discovery_trace: "first seen at: heise-sec (essential source), URL https://www.heise.de/news/Spaniens-Datenschutzaufsicht-Erster-Cyberangriff-mithilfe-eines-KI-Agenten-11454545.html → primary: AEPD's own blog post, URL https://www.aepd.es/prensa-y-comunicacion/blog/primera-notiviacion-brecha-datos-personales-causada-por-ataque-ejecutado-mediante-agente-ia"
    summary: |
      Spain's data-protection authority (AEPD) states it has received the first breach notification in which
      the reported incident was executed by an AI agent built on a known language model. Per the affected
      organization's own notification (which AEPD stresses is unverified and un-audited at this stage): the
      attacking agent launched a vulnerability search against generic files, achieved a successful login,
      then autonomously continued searching for further vulnerabilities inside the system; once found, it
      modified personal data and accessed invoices. AEPD is explicit that this does not imply the underlying AI
      provider or model infrastructure was compromised, nor that the tool was purpose-built for malicious use —
      the significant fact from a data-protection standpoint is that a third party used an AI agent as the
      instrument chaining multiple attack phases together autonomously. AEPD's deputy director (Francisco Pérez
      Bes) frames the qualitative change as speed and autonomy rather than novel technique: an agent "can receive
      a goal, plan intermediate steps, use tools, execute code, query sources, interpret results, and adapt its
      approach autonomously based on what it finds" — which AEPD says obsoletes risk-assessment language that
      references malware/phishing/unauthorized-access only generically, without naming AI-assisted or
      AI-executed attacks explicitly. AEPD's stated practical implications for data controllers/processors:
      (1) risk analyses must explicitly name AI-assisted/AI-executed attack scenarios rather than relying on
      generic threat categories; (2) incident-response procedures built for manually executed attacks may be
      too slow, since an agent can probe multiple assets and adapt in parallel; (3) digital credentials and API
      keys gain outsized importance, since whoever obtains them can operate at machine speed, complicating
      detection; (4) security cannot depend solely on manual intervention and must be backed by
      detection/containment/response mechanisms fast enough to match agent-speed attacks. Neither the affected
      organization nor the specific AI model/agent framework used is named.
    region_nexus: "EU (Spain); establishes a regulatory precedent directly relevant to how EU/Swiss data-protection risk assessments and GDPR-equivalent (Swiss FADP) breach-notification processes should characterize AI-agent-driven attacks going forward."
    primary_sector_nexus: "indirect"
    sector: "public-sector"
