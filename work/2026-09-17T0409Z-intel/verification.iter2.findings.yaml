  item: "CVE-2026-76460 (+ CVE-2026-76423) — Cisco Identity Services Engine"
  url_or_quote: "\"Cisco ISE 3.0 has reached End of Software Maintenance and must migrate to a supported, fixed release ([Cisco PSIRT, 2026-09-16](...); [MITRE CVE record, 2026-09-16](https://cveawg.mitre.org/api/cve/CVE-2026-76460))\""
  summary: "The MITRE CVE record (fetched) carries only CVSS metrics and an affected-versions list — no EOL/migration statement at all; that fact is carried solely by the Cisco PSIRT advisory. The MITRE co-citation is an adjacency violation (check 2d). Separately, https://cveawg.mitre.org/api/cve/CVE-2026-76460 is cited inline but is absent from the entry's frontmatter sources[] (only 3 sources listed: two Cisco advisories + CISA KEV alert)."
