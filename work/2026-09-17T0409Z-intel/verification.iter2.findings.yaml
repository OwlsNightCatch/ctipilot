- code: F3
  category: claim-not-supported
  section: ddrop-dram-interposer-defeats-confidential-computing
  item: "DDRop hardware interposer"
  url_or_quote: "\"even under TDX's strongest Cryptographic Integrity mode, an attacker can still forge their own Trust Domain's launch-measurement attestation so a backdoored VM passes remote attestation as trusted, or flip the Trust Domain's debug-mode bit to obtain a hypervisor-level plaintext memory dump\""
  summary: "(medium confidence) Fetched ddropattack.eu: the source explicitly labels the debug-mode-toggle case study \"LI only\" (works only under TDX's default Logical Integrity mode) and separately labels the attestation-forging case study \"LI + CI\". The entry's sentence structure attaches \"even under ... Cryptographic Integrity mode\" to both disjuncts, implying the debug-mode-dump attack also works under CI — which the source contradicts."
