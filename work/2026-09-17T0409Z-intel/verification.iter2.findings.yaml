  url_or_quote: "\"CISA added the flaw to its Known Exploited Vulnerabilities catalog the same day with a three-day remediation deadline ([CISA, 2026-09-16](https://www.cisa.gov/news-events/alerts/2026/09/16/cisa-adds-two-known-exploited-vulnerabilities-catalog))\""
  summary: "Fetched the cited CISA alert page verbatim: it lists only the two added CVE ids and BOD 26-04 boilerplate, no due-date text at all. The 3-day figure is true (KEV catalog JSON: dateAdded 2026-09-16, dueDate 2026-09-19) but that JSON/catalog isn't the cited source and per the org's hard-blocked-pattern table the catalog URL itself couldn't be cited directly — the fact is effectively uncited to any page the reader can check."
