  - title: "CVE-2026-76460 (+ sibling CVE-2026-76423) — Cisco Identity Services Engine: unauthenticated CVSS 10.0 REST API authentication bypass, confirmed exploited and found via a real customer compromise"
    sources:
      - { url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-ISE-ABP-VNSW7Tn5", publisher: "Cisco PSIRT", date: "2026-09-16", role: "primary" }
      - { url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-ise-multi-hrP9jQSQ", publisher: "Cisco PSIRT", date: "2026-09-16", role: "primary" }
      - { url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-notice-jfxK98ZP", publisher: "Cisco PSIRT (advance notification / index)", date: "2026-09-16", role: "corroborating" }
      - { url: "https://forkast.news/the-gatekeeper-is-the-door-cisco-ises-nine-cve-disclosure-and-the-identity-infrastructure-attack-surface/", publisher: "Forkast", date: "2026-09-16", role: "corroborating" }
      - { url: "https://www.cisa.gov/news-events/alerts/2026/09/16/cisa-adds-two-known-exploited-vulnerabilities-catalog", publisher: "CISA (KEV addition)", date: "2026-09-16", role: "corroborating" }
    discovery_trace: "first seen at: cisa-kev, URL https://www.cisa.gov/known-exploited-vulnerabilities-catalog (bridge fetch, mandatory KEV-sweep target CVE-2026-76460, dateAdded 2026-09-16) → primary: Cisco Security Advisory cisco-sa-ISE-ABP-VNSW7Tn5, URL https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-ISE-ABP-VNSW7Tn5 → pivot: Cisco Advance Notification index, URL https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-notice-jfxK98ZP → pivot: sibling advisory cisco-sa-ise-multi-hrP9jQSQ, URL https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-ise-multi-hrP9jQSQ → corroborating: Forkast, URL https://forkast.news/the-gatekeeper-is-the-door-cisco-ises-nine-cve-disclosure-and-the-identity-infrastructure-attack-surface/"
    summary: |
      Cisco disclosed CVE-2026-76460 (CVSS 3.1 10.0, AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H) on
      2026-09-16: an unauthenticated, remote authentication bypass in an API endpoint of Cisco
      Identity Services Engine (ISE) and ISE Passive Identity Connector (ISE-PIC), affecting every
      release "regardless of device configuration". Insufficient authentication control on the
      endpoint lets an attacker send a crafted request to bypass the web-based management interface
      entirely; Cisco's own advisory states that "upon successful exploitation ... threat actors may
      obtain command execution with root privileges." Cisco PSIRT confirms active exploitation and
      states the flaw was found while resolving a Cisco TAC support case — i.e. discovered off a real
      customer compromise, not internal research. There is no workaround; the only mitigation is
      restricting management-plane access via infrastructure ACLs. Fixed in ISE/ISE-PIC 3.1 Patch 12,
      3.2 Patch 11, 3.3 Patch 12, 3.4 Patch 7, 3.5 Patch 4 (3.0 is past End of Software Maintenance —
      customers on 3.0 must migrate). This CVE was part of a bundled Cisco ISE disclosure covering
      nine advisories that same day; a sibling CVSS 10.0 REST API authentication bypass in the same
      bundle, CVE-2026-76423 (also unauthenticated, "regardless of device configuration", letting an
      attacker read/modify ISE configuration and identity data with administrative privileges), is
      NOT confirmed exploited — Cisco's advisory for it states PSIRT is "not aware of any public
      announcements or malicious use" — but shares the same fixed-release schedule and equally
      removes the identity/network-access-control plane's authentication boundary. Cisco ISE is
      widely deployed as 802.1X/network-access-control and identity infrastructure, including in
      government and critical-infrastructure networks, making an unauthenticated bypass of its
      management/API surface a direct path to defeating an organization's network access controls.
    region_nexus: "global; Cisco ISE is standard network-access-control/802.1X identity infrastructure in enterprise and public-sector networks worldwide, including plausible Swiss government/critical-infrastructure deployments"
    primary_sector_nexus: "indirect"
    sector: "public-sector"
    cves: ["CVE-2026-76460", "CVE-2026-76423"]
