    extended_notes: |
      Included per the mandatory KEV-sweep duty; disposition assessment: this CVE clears the bare
      CISA KEV bar (confirmed exploitation, formal BOD 26-04 remediation deadline) but the attack
      surface is narrow and specific (Linux shared-hosting control-panel backup tooling requiring an
      existing low-privilege tenant account), and no evidence was found of it affecting a platform a
      Swiss federal/cantonal/communal administration would itself operate. Flagging borderline for
      the main agent's judgment on whether the indirect hosting-supply-chain angle is worth carrying
      at full item weight versus a shorter awareness note. CISA/CISO-facing news coverage of this CVE
      (TheHackerNews, Help Net Security, SecurityWeek, GBHackers) was consulted only for discovery —
      all of it traces back to the same Acronis SEC-10986 advisory text quoted above, so it is not
      counted as independent corroboration; verification is scored SINGLE-SOURCE-OTHER accordingly.
    watchlist: []
    borderline: true
    borderline_reason: "KEV-listed and actively exploited, but the attack surface (Linux cPanel/WHM & Plesk shared-hosting backup plugin, requiring an existing low-privilege tenant account) is narrow and not confirmed to run on any platform a Swiss federal/cantonal/communal administration would itself operate; relevance to the constituency is indirect (smaller hosting providers that host public-sector websites)."

