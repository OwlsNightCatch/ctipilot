    priority_hint: critical
    evidence:
      - quote: "The Cisco PSIRT is aware of active exploitation of this vulnerability. Cisco strongly recommends that customers upgrade to a fixed software release to remediate this vulnerability."
        attribution: "Cisco PSIRT"
        source_url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-ISE-ABP-VNSW7Tn5"
      - quote: "This vulnerability was found during the resolution of a Cisco Technical Assistance Center (TAC) support case."
        attribution: "Cisco PSIRT"
        source_url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-ISE-ABP-VNSW7Tn5"
      - quote: "Note: Upon successful exploitation of this vulnerability, threat actors may obtain command execution with root privileges."
        attribution: "Cisco PSIRT"
        source_url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-ISE-ABP-VNSW7Tn5"
    extended_notes: |
      Detection concept Cisco itself supplies: review each node's access.log (or, for a distributed
      deployment, every node's log) for suspicious usernames on the exposed API endpoint — Cisco's
      example command is `show logging application ise-kong/access.log | include dummyuser`; full
      logs require a support bundle with debug logs and shared-key decryption
      (./ise/logs/apigateway/access.log.*.gz). Cisco explicitly warns that because successful
      exploitation can reach root, "evidence of exploitation and indicators of compromise may be
      removed or hidden by the threat actors" — so cross-checking network/firewall logs OUTSIDE the
      ISE node itself (unexpected outbound uploads, downloads from unfamiliar IPs) is the more
      reliable triage path than trusting the appliance's own logs. The bundled September 16 ISE
      disclosure also includes two authenticated command-injection flaws reported by STAR Labs SG
      (CVE-2026-20305, CVE-2026-20306, CVSS 9.1, root-level command injection via diagnostic tools
      and REST API) and CVE-2026-76424 (authenticated arbitrary file upload/copy reaching root RCE,
      CVSS 7.2) — none reported in this entry's cves[] since they require existing admin credentials
      and are not confirmed exploited, but they compound the same day's identity-infrastructure
      exposure for any organization running ISE.
