  - title: "CVE-2026-87886 — Acronis Backup plugin for cPanel & WHM: local privilege escalation via insecure default file permissions, exploited in limited, targeted attacks against Linux shared-hosting deployments"
    sources:
      - { url: "https://security-advisory.acronis.com/advisories/SEC-10986", publisher: "Acronis", date: "2026-09-16", role: "primary" }
      - { url: "https://www.cisa.gov/news-events/alerts/2026/09/16/cisa-adds-two-known-exploited-vulnerabilities-catalog", publisher: "CISA (KEV addition)", date: "2026-09-16", role: "corroborating" }
    discovery_trace: "first seen at: cisa-kev, URL https://www.cisa.gov/known-exploited-vulnerabilities-catalog (bridge fetch, mandatory KEV-sweep target CVE-2026-87886, dateAdded 2026-09-16) → primary: Acronis Advisory Database SEC-10986, URL https://security-advisory.acronis.com/advisories/SEC-10986 (retrieved via jina reader after the page's direct HTML returned a JavaScript-only shell) → corroborating: CISA alert, URL https://www.cisa.gov/news-events/alerts/2026/09/16/cisa-adds-two-known-exploited-vulnerabilities-catalog"
    summary: |
      CVE-2026-87886 (CVSS 3.0 7.8, AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H, CWE-276 Incorrect Default
      Permissions) is a local privilege-escalation flaw in the Acronis Backup plugin for cPanel & WHM
      (Linux) and the Acronis Backup extension for Plesk (Linux), caused by insecure file permissions
      set by the backup tooling. Acronis's own advisory states: "Exploitation of this vulnerability
      has been detected in the wild in limited, targeted attacks against Acronis Backup plugin for
      cPanel & WHM deployments" specifically — it does not report the same for the Plesk extension.
      The attack requires an attacker to already control a low-privileged account on a shared-hosting
      Linux server running the vulnerable plugin; from there, the insecure permissions on backup-
      related files let that low-privilege tenant escalate to root, which in a shared-hosting context
      means full compromise of every other customer's site on the same host. Fixed in Acronis Backup
      plugin for cPanel & WHM build 1.9.3.1021 (1.9.3 HF3) and Acronis Backup extension for Plesk
      build 1.8.11.638. CISA added it to KEV on 2026-09-16.
    region_nexus: "global; narrow to Linux-based shared-hosting environments (cPanel & WHM, Plesk) running the Acronis Backup plugin/extension — most plausible Swiss public-sector exposure is indirect, via smaller web-hosting providers that host cantonal/communal websites on shared cPanel/WHM or Plesk infrastructure, rather than direct deployment inside a government network"
    primary_sector_nexus: "indirect"
    sector: "public-sector"
    cves: ["CVE-2026-87886"]
    techniques: [T1068]
