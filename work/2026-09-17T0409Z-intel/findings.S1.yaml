items:
  - title: "CVE-2026-58704 — Google Pixel: cellular-modem privilege-escalation zero-day exploited in limited, targeted attacks (added to CISA KEV)"
    sources:
      - { url: "https://source.android.com/docs/security/bulletin/pixel/2026/2026-09-01", publisher: "Google (Pixel Update Bulletin)", date: "2026-09-15", role: "primary" }
      - { url: "https://techcrunch.com/2026/09/16/google-says-some-pixel-phone-owners-were-hacked-in-zero-day-attacks/", publisher: "TechCrunch", date: "2026-09-16", role: "corroborating" }
      - { url: "https://www.cisa.gov/news-events/alerts/2026/09/16/cisa-adds-one-known-exploited-vulnerability-catalog", publisher: "CISA (KEV addition)", date: "2026-09-16", role: "corroborating" }
      - { url: "https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-1176/", publisher: "CERT-FR (ANSSI)", date: "2026-09-16", role: "corroborating" }
    discovery_trace: "first seen at: cisa-kev, URL https://www.cisa.gov/known-exploited-vulnerabilities-catalog (bridge fetch, mandatory KEV-sweep target CVE-2026-58704, dateAdded 2026-09-16) → primary: Google Pixel Update Bulletin, URL https://source.android.com/docs/security/bulletin/pixel/2026/2026-09-01 → corroborating: TechCrunch, URL https://techcrunch.com/2026/09/16/google-says-some-pixel-phone-owners-were-hacked-in-zero-day-attacks/ → corroborating: CERT-FR, URL https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-1176/"
    summary: |
      CVE-2026-58704 is an improper-authorization/permission-bypass logic error in the cellular
      modem component of Google Pixel devices (bug A-484011314, Modem subcomponent, High severity).
      Google's own Pixel Update Bulletin (published 2026-09-15, patch level 2026-09-05) and ENISA
      EUVD both describe it as a possible permission bypass reachable with no additional execution
      privileges and no user interaction needed for exploitation — i.e. a zero-click privilege
      escalation out of the modem's sandbox into the wider device, reachable proximally/adjacently
      per the CVSS vector (AV:A). CISA added it to the Known Exploited Vulnerabilities catalog on
      2026-09-16 with a 3-day remediation deadline (2026-09-19). Google has not attributed the
      exploitation to a named actor, but describes it only as "limited, targeted exploitation" —
      phrasing Google and other vendors have historically reserved for commercial-spyware or
      state-aligned surveillance activity against high-value individuals (journalists, dissidents,
      officials). No CVE-specific IOC or victim detail has been published. This is a real device-
      fleet action item for any Swiss public-sector organization issuing Pixel handsets to staff who
      could plausibly be individually targeted (law enforcement, diplomatic, ministerial personnel).
    region_nexus: "global; direct relevance to any Swiss public-sector organization issuing Google Pixel devices to personnel who could be individually targeted by surveillance-grade exploitation (police, government officials, diplomatic staff)"
    primary_sector_nexus: "indirect"
    sector: "public-sector"
