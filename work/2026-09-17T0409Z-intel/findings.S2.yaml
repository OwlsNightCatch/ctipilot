    extended_notes: |
      Standing backlog item per spawn instructions: this crosses the "no named mechanism/actor/data-theft claim" threshold that was blocking composition as of 2026-09-16 — there are now two distinct named handles, two distinct claimed datasets, one of them with a claimed (though unverified) technical mechanism (IDOR), and two independent trackers who examined samples. Still no AFPA confirmation and no mainstream press pickup found. Main agent should decide whether this now clears the bar for a first entry or should continue to sit in the backlog pending AFPA confirmation.
      Ville du Tampon (La Réunion) and Familea re-checked per spawn instructions: no material change found for either. Ville du Tampon's own 2026-09-09 statement (via FrenchBreaches) still names no mechanism, actor or data-theft claim. Familea's 2026-09-15 statement (via FrenchBreaches, WebSearch) confirms the Bruguières municipal family-portal outage is at Familea's (~1,600-client) infrastructure level, external access cut as a precaution, "no data breach confirmed" — unchanged from the prior run's note. No new coverage found for either in cyberattaque.org's latest feed items (checked through 2026-09-16T20:13Z) or via targeted WebSearch.

  - title: "Spain's AEPD publishes the first notified GDPR breach it attributes to an autonomous AI-agent-executed attack, and tells data controllers to treat agentic attacks as a distinct risk-analysis category"
    sources:
      - { url: "https://www.aepd.es/prensa-y-comunicacion/blog/primera-notiviacion-brecha-datos-personales-causada-por-ataque-ejecutado-mediante-agente-ia", publisher: "AEPD (Agencia Española de Protección de Datos)", date: "2026-09-14", role: "primary" }
      - { url: "https://www.heise.de/news/Spaniens-Datenschutzaufsicht-Erster-Cyberangriff-mithilfe-eines-KI-Agenten-11454545.html", publisher: "heise online", date: "2026-09-16", role: "corroborating" }
    discovery_trace: "first seen at: heise-sec (essential RSS source), URL https://www.heise.de/security/feed.xml → article URL https://www.heise.de/news/Spaniens-Datenschutzaufsicht-Erster-Cyberangriff-mithilfe-eines-KI-Agenten-11454545.html → primary: AEPD blog post, URL https://www.aepd.es/prensa-y-comunicacion/blog/primera-notiviacion-brecha-datos-personales-causada-por-ataque-ejecutado-mediante-agente-ia"
    summary: |
      Spain's national data-protection authority (AEPD) disclosed on 2026-09-14 (picked up by heise online in-window on 2026-09-16) that it received what it describes as the first personal-data breach notification attributing the incident to a third party's use of an autonomous AI agent, built on a well-known commercial language model, as the attack instrument. Per AEPD's account (sourced from the affected organization's own breach notification, not independently verified by AEPD): the attacking agent began by searching for vulnerabilities in generic files, achieved a successful login, then autonomously searched the target application for further vulnerabilities, and — once it found them — modified personal data and accessed invoices. AEPD is explicit that this does not mean an AI provider or its infrastructure was compromised, and does not name the affected organization or the LLM used. AEPD's deputy director Francisco Pérez Bes frames the qualitative change as one of speed and autonomy rather than novel technique: an agent "can receive a goal, plan intermediate steps, use tools, execute code, query sources, interpret results and autonomously adapt its approach to what it finds." AEPD draws four concrete risk-management conclusions for data controllers and DPOs: (1) AI-agent-assisted or -executed attacks must be explicitly named in processing risk analyses — a generic reference to malware, phishing or unauthorized access is no longer sufficient, because automation materially changes probability, speed and scale; (2) incident-response timing built for manually-executed attacks may be insufficient against an agent that tests multiple access paths simultaneously and adapts in real time; (3) digital credentials and API keys gain outsized importance, since an agent that obtains one can operate at machine speed across services before anomalous-behaviour detection catches up; (4) security cannot depend on manual intervention alone — human oversight must be backed by detection, containment and response mechanisms fast enough to keep pace.
    region_nexus: "Spain (EU member-state DPA); directly informs GDPR-adjacent risk-analysis and breach-notification practice, transferable to Swiss FADP-regulated public-sector data controllers and their DPOs"
