  - title: "AFPA (France's national vocational-training agency): a second, larger criminal claim of 1.73M records via an alleged access-control flaw follows an unconfirmed 971K-record claim a day earlier — three alerts in one month, none confirmed by AFPA"
    sources:
      - { url: "https://www.cyberattaque.org/afpa-pres-dun-million-de-dossiers-revendiques-apres-une-cyberattaque/", publisher: "Cyberattaque.org", date: "2026-09-16", role: "primary" }
      - { url: "https://frenchbreaches.com/alertes/afpa-mu4jbja3w3es4t7j0a8", publisher: "FrenchBreaches", date: "2026-09-16", role: "primary" }
    discovery_trace: "first seen at: cyberattaque-org (rotation source RSS), URL https://www.cyberattaque.org/feed/ → article URL https://www.cyberattaque.org/afpa-pres-dun-million-de-dossiers-revendiques-apres-une-cyberattaque/ → corroboration: frenchbreaches (rotation source), URL https://frenchbreaches.com/alertes/afpa-mu4jbja3w3es4t7j0a8 → WebSearch (\"AFPA cyberattaque déclaration communiqué septembre 2026\") and WebSearch (\"AFPA formation professionnelle piratage données Le Monde\") found no AFPA statement or mainstream French-press corroboration; a ZATAZ article matching \"AFPA + Dopple ransomware\" (https://www.zataz.com/afpa-dopple-fuite-ransomware/) proved to be recycled 2020 reporting on an unrelated 2020 DoppelPaymer incident and was discarded as stale/off-window."
    summary: |
      AFPA, France's national public agency for adult vocational training (under the Ministry of Labour), is the subject of a third data-theft claim in roughly one month. On 2026-09-15 the handle xMetah advertised for sale a file of 971,420 records (name, date of birth, postal address, phone number, an internal "partenaire" field referencing "LHEA"); on 2026-09-16 a separate handle, Cybernox — already tracked by this pipeline for a recurring campaign against French departmental fire-and-rescue services (SDIS) — advertised a second, larger and distinct file of 1,732,811 records spanning 2006-2026, which Cyberattaque.org attributes to Cybernox's own claim of exploiting an IDOR (Insecure Direct Object Reference) vulnerability; FrenchBreaches' independent review of the same claim states only that Cybernox "evokes a vulnerability" without enough detail to identify a specific flaw or intrusion method. Both trackers independently examined data samples and caution the two record counts must not be summed (they cannot yet establish overlap between the two files) and that "records" does not equal "distinct victims" without deduplication. This is the third alert in about a month: a first Cybernox claim in mid-August already exposed 101 AFPABox accounts plus a published administrator-access credential. AFPA has not confirmed any of the three claims, named an access vector, or stated whether an intrusion occurred; no mainstream French outlet coverage was found despite search. For Swiss public-sector defenders this is a transferable pattern-of-life data point (not a Swiss incident): a large public-interest agency's citizen-facing web platform targeted repeatedly by IDOR/access-control-style claims, consistent with the broader 2026 wave of French public-administration breaches this pipeline already tracks (DGFiP, Ministère de la Transition écologique, Département de l'Aveyron, AMF).
    region_nexus: "France (national public-sector agency); transferable lesson for Swiss federal/cantonal/communal case-management and citizen-portal platforms exposed to similar IDOR/access-control classes of flaw"
