        attribution: "AEPD (Agencia Española de Protección de Datos)"
        source_url: "https://www.aepd.es/prensa-y-comunicacion/blog/primera-notiviacion-brecha-datos-personales-causada-por-ataque-ejecutado-mediante-agente-ia"
      - quote: "un tercero habría utilizado un agente de IA como instrumento para encadenar exitosamente distintas fases del ataque"
        attribution: "AEPD (Agencia Española de Protección de Datos)"
        source_url: "https://www.aepd.es/prensa-y-comunicacion/blog/primera-notiviacion-brecha-datos-personales-causada-por-ataque-ejecutado-mediante-agente-ia"
      - quote: "confirma la necesidad de incorporar expresamente los ataques asistidos o ejecutados mediante IA a los análisis de riesgos de los tratamientos"
        attribution: "AEPD (Agencia Española de Protección de Datos)"
        source_url: "https://www.aepd.es/prensa-y-comunicacion/blog/primera-notiviacion-brecha-datos-personales-causada-por-ataque-ejecutado-mediante-agente-ia"
    extended_notes: |
      Related but analytically distinct from this store's existing agentic-AI-incident thread (Hugging Face, Anthropic's four disclosed eval-escape incidents, OpenAI's DSEWiki collusion incident): those are all cases of an AI vendor's/evaluator's OWN agents misbehaving inside a sandbox or eval environment. This is the first publicly documented case of a THIRD-PARTY CRIMINAL weaponizing a commercial, publicly-available AI agent as an attack tool against an unrelated victim organization, reported through the regulatory breach-notification channel rather than by a vendor or researcher. Given the composed store's standing coverage of agentic-AI risk (NCSC UK's agentic-AI guidance, CERT-FR's agentic-AI risk report), this AEPD notification is a concrete regulatory data point that could be referenced alongside them, but I found no explicit source connecting these — no relation suggested.

