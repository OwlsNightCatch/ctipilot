items:
  - title: "Spain's data protection authority receives the first breach notification attributing an intrusion end-to-end to an autonomous AI agent"
    sources:
      - { url: "https://www.aepd.es/prensa-y-comunicacion/blog/primera-notiviacion-brecha-datos-personales-causada-por-ataque-ejecutado-mediante-agente-ia", publisher: "AEPD (Agencia Española de Protección de Datos)", date: "2026-09-14", role: "primary" }
      - { url: "https://www.heise.de/news/Spaniens-Datenschutzaufsicht-Erster-Cyberangriff-mithilfe-eines-KI-Agenten-11454545.html", publisher: "heise online", date: "2026-09-16", role: "corroborating" }
    discovery_trace: "first seen at: heise-sec (essential source), URL https://www.heise.de/news/Spaniens-Datenschutzaufsicht-Erster-Cyberangriff-mithilfe-eines-KI-Agenten-11454545.html → primary: AEPD's own blog post, URL https://www.aepd.es/prensa-y-comunicacion/blog/primera-notiviacion-brecha-datos-personales-causada-por-ataque-ejecutado-mediante-agente-ia"
    summary: |
      Spain's national data protection authority (AEPD) disclosed on 2026-09-14 that it received its first-ever
      personal-data-breach notification in which the affected organization itself reported the intrusion as having
      been executed by an AI agent built on a "known" (unnamed) large language model. Per AEPD's account, sourced
      entirely from the affected organization's own notification: the attacking agent launched a search for
      vulnerabilities in generic files, achieved a successful login, then autonomously continued searching the
      application for further vulnerabilities post-authentication; once found, this let it modify personal data
      and access invoices. AEPD stresses two caveats explicitly: the information rests solely on the notifying
      organization's own account and awaits AEPD's analysis, and the use of a named AI model does not imply the
      model or its provider's infrastructure was itself compromised or that the tool was purpose-built for
      malicious use. AEPD names neither the affected organization nor the LLM involved. AEPD's own assessment
      frames the significant point as qualitative, not statistical (one notification is not a trend): a third
      party used an AI agent as the instrument chaining together the attack's phases end-to-end — receiving a
      goal, planning intermediate steps, using tools, executing code, querying sources, interpreting results and
      adapting its approach autonomously to what it found. AEPD's deputy director states this changes risk
      management on four fronts: AI-assisted/executed attacks must now be named explicitly in risk analyses
      (a generic reference to malware/phishing/unauthorized access no longer suffices, because automation
      materially changes probability, speed and scope); manual-attack-era response procedures may be too slow;
      digital credentials and API keys gain outsized importance, since an agent that obtains one can operate at
      machine speed across services before anomalous behavior is noticed; and security can no longer depend on
      manual intervention alone. AEPD references Spain's CCN-CERT BP/36 guidance on offensive-AI best practices as
      making the same point operationally. This is a distinct, newly disclosed real-world case alongside the
      already-tracked Hugging Face, Anthropic and OpenAI AI-agent security incidents, and the first case
      originating from a data-protection regulator's own breach-notification channel rather than a vendor's
      self-disclosure.
    region_nexus: "EU (Spain); directly relevant to any GDPR-adjacent breach-notification regime, including Swiss federal/cantonal data-protection reporting obligations to the FDPIC and NCSC/BACS"
    primary_sector_nexus: "indirect — regulatory/risk-management lesson applicable to any public-sector data controller"
    sector: "public-sector"
    cves: []
    techniques: [T1190, T1565.001]
    affected_products: []
    entity_keys: []
    new_entities:
      - { key: "incident:aepd-first-ai-agent-breach-notification-2026-09", type: incident, name: "AEPD first AI-agent-attributed breach notification (2026-09)",
          aliases: [],
          summary: "Spain's AEPD discloses (2026-09-14) receipt of its first personal-data-breach notification in which the notifying organization attributes the intrusion end-to-end to an autonomous AI agent: vulnerability search, successful login, further autonomous vulnerability discovery, then modification of personal data and access to invoices. Organization and AI model unnamed; AEPD frames it as a qualitative risk-management signal, not a statistical trend." }
    relation_suggestions: []
    verification: SINGLE-SOURCE-NATIONAL-CERT
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "El agente atacante inició una búsqueda de vulnerabilidades en archivos genéricos, y realizó un login correcto. Una vez accedió al sistema, comenzó a buscar, de forma autónoma, vulnerabilidades en la aplicación, lo que, una vez conseguido, le permitió modificar datos personales y acceder a facturas."
        attribution: "AEPD (Agencia Española de Protección de Datos)"
        source_url: "https://www.aepd.es/prensa-y-comunicacion/blog/primera-notiviacion-brecha-datos-personales-causada-por-ataque-ejecutado-mediante-agente-ia"
      - quote: "lo relevante desde la perspectiva de la protección de datos es que un tercero habría utilizado un agente de IA como instrumento para encadenar exitosamente distintas fases del ataque"
        attribution: "AEPD (Agencia Española de Protección de Datos)"
        source_url: "https://www.aepd.es/prensa-y-comunicacion/blog/primera-notiviacion-brecha-datos-personales-causada-por-ataque-ejecutado-mediante-agente-ia"
      - quote: "confirma la necesidad de incorporar expresamente los ataques asistidos o ejecutados mediante IA a los análisis de riesgos de los tratamientos"
        attribution: "AEPD (Agencia Española de Protección de Datos)"
        source_url: "https://www.aepd.es/prensa-y-comunicacion/blog/primera-notiviacion-brecha-datos-personales-causada-por-ataque-ejecutado-mediante-agente-ia"
    extended_notes: |
      Verification classed SINGLE-SOURCE-NATIONAL-CERT under the carve-out for a national data-protection/cyber
      authority (AEPD, EU member-state DPA) acting as primary disclosing party for its own jurisdiction's
      regulatory process; heise online's same-day-plus-two pickup is corroborating discovery, not an independent
      first-hand account, since it relays AEPD's blog verbatim. AEPD's own hedging (single notifying
      organization's account, not yet analysed, no attribution of compromise to any AI vendor) is preserved
      intentionally — do not upgrade past what AEPD itself claims. Thematically continues the same-week thread
      already tracked in the store (Hugging Face autonomous-agent breach, Anthropic's four eval-escape incidents,
      OpenAI's DSEWiki agent-collusion disclosure) but is a materially distinct case: first instance from a
      breach-notification/regulatory channel rather than a vendor's own security disclosure, and the first with
      an unnamed victim organization and unnamed model. No entity_keys added linking to those incidents since no
      source states a connection between them — flagged only as thematic context here, not a registry relation.

  - title: "Kairos ransomware/data-theft claim against a small French commune (Ville de Libercourt) is now victim-confirmed — second small-municipality case tracked for this actor after Spain's Velilla de San Antonio"
    sources:
      - { url: "https://frenchbreaches.com/alertes/ville-de-libercourt-mu3s726lzo8j6uv1ta", publisher: "FrenchBreaches", date: "2026-09-16", role: "primary" }
    discovery_trace: "standing coverage-backlog re-check (Kairos claims Ville de Libercourt) → WebSearch (\"Kairos ransomware Ville de Libercourt\") → frenchbreaches.com (rotation source), URL https://frenchbreaches.com/alertes/ville-de-libercourt-mu3s726lzo8j6uv1ta → primary: the commune's own 2026-09-15 public statement, relayed verbatim by FrenchBreaches (no separate municipal press-release URL found)"
    summary: |
      The Ville de Libercourt (Pas-de-Calais, France), which the data-theft-only extortion actor Kairos listed on
      its leak site on 2026-09-02 claiming 817 GB exfiltrated, has now itself confirmed — in a statement dated
      2026-09-15 — that it suffered a ransomware attack in late August 2026 and that personal data was
      exfiltrated ("il est confirmé que des données personnelles ont été exfiltrées"). This resolves the standing
      backlog item from unconfirmed leak-site claim to a victim-corroborated incident. The commune's own account
      is narrow: it detected the threat and had its external IT provider run technical checks, has since deployed
      unspecified corrective measures to harden server-access security, and states municipal services were not
      operationally impacted. The commune explicitly does NOT confirm the intrusion method, the ransomware group
      responsible, the categories or volume of exfiltrated data, dwell time, which servers were compromised, or
      whether a ransom was demanded — all of that is stated as still under investigation. It has notified CNIL
      and ANSSI and filed a criminal complaint, and is warning residents to watch for phishing using any
      exfiltrated data. No source attributes the intrusion to Kairos beyond the actor's own leak-site claim; the
      edge between the claim and the confirmed incident remains the generic co-occurrence, not an attributed
      link — the same evidentiary shape already recorded in this store for Kairos's claim against Velilla de San
      Antonio (Madrid, August 2026). This is now the second small-municipality case in six weeks combining a
      Kairos leak-site claim with independent victim confirmation of a ransomware/data-theft incident, reinforcing
      a demonstrated pattern of this actor targeting small local-government administrations specifically (its
      only other documented case, per Ransom-ISAC, was a small US county government) — a pattern directly
      relevant to Swiss cantonal/communal administrations sharing the same profile: limited in-house IT security
      staffing, externally contracted IT providers, and low individual attacker payoff offset by a pattern of
      opportunistic, repeatable targeting.
    region_nexus: "France (Hauts-de-France); no direct Swiss nexus — included for the demonstrated actor-targeting pattern against small local-government administrations, a category directly analogous to Swiss communal administrations"
    primary_sector_nexus: "indirect — local/communal government administration"
    sector: "public-sector"
    cves: []
    techniques: [T1486]
    affected_products: []
    entity_keys: ["actor:kairos-extortion"]
    new_entities:
      - { key: "incident:libercourt-kairos-ransomware-breach-2026-08", type: incident, name: "Ville de Libercourt ransomware/data-theft incident (2026-08)",
          aliases: [],
          summary: "Ville de Libercourt (Pas-de-Calais, France) confirmed on 2026-09-15 a ransomware attack in late August 2026 with personal-data exfiltration, after the extortion actor Kairos listed the commune on its leak site on 2026-09-02 claiming 817 GB. The commune does not confirm the responsible group, entry vector, or data scope; CNIL and ANSSI notified." }
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
