    novelty: new
    borderline: true
    borderline_reason: "Out-of-nexus small French commune with no confirmed attacker attribution and minimal technical detail; included under the PD-11 same-actor-pattern criterion (c) — Kairos's second documented small-local-government victim, directly analogous to the profiled Swiss constituency's cantonal/communal administrations — rather than on the incident's own scale or novelty. Main agent should make the final call on inclusion vs. fold into a Kairos-actor changelog note only."
    evidence:
      - quote: "Il est confirmé que des données personnelles ont été exfiltrées."
        attribution: "Ville de Libercourt (relayed by FrenchBreaches)"
        source_url: "https://frenchbreaches.com/alertes/ville-de-libercourt-mu3s726lzo8j6uv1ta"
      - quote: "la méthode utilisée pour pénétrer les systèmes ; le groupe de rançongiciel responsable ; la nature exacte des données exfiltrées"
        attribution: "FrenchBreaches, listing what the commune's statement leaves unknown"
        source_url: "https://frenchbreaches.com/alertes/ville-de-libercourt-mu3s726lzo8j6uv1ta"
    extended_notes: |
      Considered and dropped: a related same-week story (Familea/Abélium, a SaaS vendor serving ~1,600 French
      municipalities for childcare/family-portal services, suffered a server-side cyberattack from 2026-09-14
      forcing several communes' portals offline) was evaluated but not included — no data breach is confirmed as
      of the source (cyberattaque.org, 2026-09-14/16), only a multi-commune availability outage under active
      investigation, and no actor or CVE is named. Flagged here in case a future run finds a confirmed-breach
      follow-up; not worth a standing item on its own given the "no confirmed compromise yet" state.

