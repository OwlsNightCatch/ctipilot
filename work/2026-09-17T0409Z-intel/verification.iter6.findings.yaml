- code: F5
  category: missing-citation
  section: ddrop-dram-interposer-defeats-confidential-computing
  item: "DDRop: a $159 DDR5 hardware interposer silently drops targeted memory writes..."
  url_or_quote: "Intel says it is evaluating \"Platform Owner Endorsements\" — a mechanism to let remote parties verify who physically holds sensitive hardware — and next-generation memory-encryption schemes with built-in freshness protection."
  summary: "This sentence carries no inline citation of its own. Intel's own PSIRT announcement (cited in the preceding sentence) states the Platform Owner Endorsements fact but does not mention \"next-generation memory-encryption schemes with built-in freshness protection\" — that specific framing is stated only by heise (\"das Unternehmen prüfe Speicherverschlüsselung der nächsten Generation mit stärkerem Hardwareschutz\") and by the ddropattack.eu FAQ, neither cited on this clause even though heise is in the entry's sources[]."
- code: F11
  category: editorial-advisory
  section: phantomraven-npm-llm-generated-infostealer
  item: "PhantomRaven: CrowdStrike attributes an LLM-generated npm infostealer..."
  url_or_quote: "techniques: [T1195.001, T1552.001, T1552.007, T1071.001, T1016.001, T1082, T1036.005, T1072, T1027.009, T1587.001, T1041, T1005]"
  summary: "CrowdStrike's own ATT&CK table (fetched this iteration) maps 18 techniques for PhantomRaven, six of which remain unmapped after five prior remediation rounds. T1083 (File and Directory Discovery — \"searches for and reads package.json files, Git configuration files, and npm configuration files\") is the clearest gap: the body already describes exactly this behavior (\"Git- and npm-configured usernames and emails\") without the id. Also unmapped, with weaker body support: T1583.001 (Acquire Infrastructure: Domains), T1059.007 (Command and Scripting Interpreter: JavaScript), T1614.001 (System Location Discovery), T1119 (Automated Collection), and T1104 (Multi-Stage Channels — the WebSocket fallback exfiltration method CrowdStrike and Endor Labs both describe but which the entry's body never mentions at all: CrowdStrike — \"PhantomRaven's code also contains an incomplete fallback WebSocket exfiltration method\"; Endor Labs' infection-chain summary — \"Data sent via HTTP GET → HTTP POST → WebSocket (redundant exfil)\")."
