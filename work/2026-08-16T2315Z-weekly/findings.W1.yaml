items:
  - title: "Minnesota water-utility campaign status: Dragos's decade retrospective cites a CVE for the MicroLogix intrusion that documented sources say does not affect MicroLogix at all"
    sources:
      - { url: "https://www.dragos.com/blog/water-utility-attacks-decade-of-gaps", publisher: "Dragos", date: "2026-08-13", role: "primary" }
      - { url: "https://www.tenable.com/cve/CVE-2021-22681", publisher: "Tenable (CVE-2021-22681 reference)", date: "2026-08-16", role: "corroborating" }
      - { url: "https://www.dragos.com/blog/dragos-industrial-ransomware-analysis-q2-2026", publisher: "Dragos", date: "2026-08-10", role: "corroborating" }
    discovery_trace: "first seen at: WebFetch drill of dragos.com/blog listing, URL https://www.dragos.com/blog/ → primary: Dragos retrospective, URL https://www.dragos.com/blog/water-utility-attacks-decade-of-gaps → corroboration pivot: WebSearch (\"CVE-2021-22681 affected products Rockwell Automation Logix Designer MicroLogix\") → Tenable CVE reference, URL https://www.tenable.com/cve/CVE-2021-22681"
    summary: |
      Dragos published a decade-spanning retrospective on 2026-08-13 comparing the 2013 Bowman Dam
      intrusion to the July 2026 Minnesota coordinated water-utility campaign this pipeline has
      tracked since 2026-07-29 (incident:minnesota-water-utilities-coordinated-cyberattack-2026-07).
      The piece states the Minnesota MicroLogix 1100/1400 PLCs "reachable over cellular links" were
      compromised "through a known authentication bypass vulnerability, (CVE-2021-22681)... added to
      CISA's Known Exploited Vulnerabilities catalog in March 2026, five years after initial
      disclosure." That claim does not hold up against the CVE record: CISA's own advisory scope and
      Tenable's CVE reference both list CVE-2021-22681 as affecting Rockwell Automation's
      CompactLogix, ControlLogix, DriveLogix, Compact GuardLogix, GuardLogix and SoftLogix families
      via Studio 5000 Logix Designer (v21+) / RSLogix 5000 (v16-20) — a different controller product
      line and a different remote-engineering-software authentication mechanism than MicroLogix. No
      source this pipeline has reviewed, including this one, states that MicroLogix uses the same
      Logix-Designer session-key verification CVE-2021-22681 breaks. Dragos's own citation trail
      points to CISA advisory AA26-097A (updated 2026-07-22, four days before Minnesota), which
      documents a related but textually distinct CyberAv3ngers campaign against the Logix family and
      (per its later update) Schneider Electric and Siemens devices — not MicroLogix. This pipeline's
      2026-08-10 entry on the same incident separately recorded a different, MicroLogix-relevant flaw
      (CVE-2017-16740, present in firmware on 19 of 22 devices Forescout found in campaign-targeted
      cities) with no claim that flaw was exploited either. Net status: no investigating body has
      named a CVE or an actor for the Minnesota MicroLogix intrusions specifically; the FBI/EPA
      description remains an IP-address-and-password-change technique consistent with exposed
      management access rather than a documented software vulnerability. Dragos's attribution-adjacent
      framing appears to conflate a genuinely documented, CVE-anchored CyberAv3ngers campaign against
      a different Rockwell product family with the still-unattributed MicroLogix campaign — a
      sourcing-hygiene lapse from a normally authoritative OT vendor that is itself worth a defender's
      attention when triaging vendor claims about this campaign.
    region_nexus: "primary nexus is the US water sector; Dragos frames the underlying gaps (internet-exposed OT over cellular links, default/weak credentials, multi-year patch lag) as directly transferable to any water utility with similar remote-access architecture, including the European exposure this pipeline already quantified (4,117 internet-facing Siemens S7-1200 units, 86% concentrated in Greece, Spain, Italy and Austria via mobile-carrier links, W31 coverage)."
    primary_sector_nexus: "indirect"
    sector: "water, critical-infrastructure, energy"
    cves: [CVE-2021-22681]
    techniques: [T1078, T1133]
    affected_products: ["Rockwell Automation MicroLogix 1100", "Rockwell Automation MicroLogix 1400", "Rockwell Automation Logix Designer (Studio 5000 / RSLogix 5000)"]
    entity_keys: ["incident:minnesota-water-utilities-coordinated-cyberattack-2026-07"]
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: "update-of:2026-08-10/forescout-rockwell-plc-exposure-census-cellular-carrier-path"
    evidence:
      - quote: "In Minnesota, it was dozens of PLCs reachable over cellular links, exploitable through a known authentication bypass vulnerability, (CVE-2021-22681) that was first disclosed in 2021 and added to CISA's Known Exploited Vulnerabilities catalog in March 2026, five years after initial disclosure."
        attribution: "Dragos"
        source_url: "https://www.dragos.com/blog/water-utility-attacks-decade-of-gaps"
      - quote: "CISA advisory AA26-097A, updated just four days before the Minnesota activity began, documents a broader campaign of PLC exploitation tied to Iran-affiliated actors, specifically CyberAv3ngers and affiliated hacktivist groups"
        attribution: "Dragos"
        source_url: "https://www.dragos.com/blog/water-utility-attacks-decade-of-gaps"
      - quote: "Rockwell Automation Studio 5000 Logix Designer Versions 21 and later, and RSLogix 5000 Versions 16 through 20 use a key to verify Logix controllers."
        attribution: "Tenable"
        source_url: "https://www.tenable.com/cve/CVE-2021-22681"
    extended_notes: |
      Only 3-6% of OT vulnerabilities require immediate action according to Dragos's own aggregate
      data cited in the same piece — a reasonable, separately-supportable claim that stands regardless
      of the CVE-attribution issue above. Worth carrying forward if a future entry does the same
      exposure-quantification work Forescout did on 2026-08-10, this time checking whether any European
      water operator runs MicroLogix (as opposed to the S7-1200 units already counted) reachable via
      cellular/mobile-carrier links.

  - title: "Passkey/WebAuthn attack-surface trend gains a fourth independent research thread: SpecterOps' 'Pass-the-Passkey' recovers cached YubiKey signatures in cleartext to replay against Entra ID"
    sources:
      - { url: "https://thehackernews.com/2026/08/new-passkey-attacks-can-recover-synced.html", publisher: "The Hacker News", date: "2026-08-10", role: "primary" }
      - { url: "https://www.dsinternals.com/en/black-hat-usa-26-pass-the-passkey/", publisher: "DSInternals (Michael Grafnetter)", date: "2026-08-16", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"passkey WebAuthn phishing bypass research August 2026\") → primary: The Hacker News, URL https://thehackernews.com/2026/08/new-passkey-attacks-can-recover-synced.html → corroboration: DSInternals talk page, URL https://www.dsinternals.com/en/black-hat-usa-26-pass-the-passkey/"
    summary: |
      This pipeline's tracked passkey/WebAuthn attack-surface trend (entity trend:passkey-webauthn-attack-surface-2026-08,
      W32 weekly: Unit 42 on Chrome synced-passkey forgery, Google TAG on FIDO2-enrolment vishing, and
      Dirk-jan Mollema on borrowing signed-in Windows Hello for Business keys) gets an in-window
      write-up of a fourth, distinct research thread: SpecterOps researcher Michael Grafnetter's
      "Pass-the-Passkey" work, presented at Black Hat USA 2026 and covered by The Hacker News on
      2026-08-10. The mechanism is different from Mollema's: Windows stored past YubiKey WebAuthn
      assertion signatures in cleartext in the Windows Event Logging Service, readable by any
      authenticated unprivileged user (including remote users, e.g. over RDP) with no elevation
      required. An attacker who recovers a cached signature can replay it against Microsoft Entra ID's
      JWT-based authentication challenge to impersonate a privileged user while satisfying a
      phishing-resistant-MFA policy, because Entra ID's challenge construction is not bound to a
      specific session, user or tenant. Microsoft closed the Windows-side element as CVE-2026-34348 in
      its July 2026 updates, which stop WebAuthn assertions written to the event log from being usable
      for replay; SpecterOps states it has not observed a corresponding fix on the Entra ID side, so
      the underlying assertion-replay weakness in Entra ID's challenge validation persists if an
      attacker can source a valid cached assertion through any other channel.
    region_nexus: "global; Microsoft Entra ID is a common identity backbone across Swiss/European public-sector and enterprise deployments standardising on passkeys as phishing-resistant MFA"
    primary_sector_nexus: "direct"
    sector: "public-sector, cross-sector"
    cves: [CVE-2026-34348]
    techniques: [T1556.006, T1552.001]
    affected_products: ["Microsoft Windows (Event Logging Service)", "Microsoft Entra ID", "YubiKey FIDO2 security keys (Windows-cached assertions)"]
    entity_keys: ["trend:passkey-webauthn-attack-surface-2026-08"]
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "update-of:2026-08-09/weekly-w32-passkeys-attacked-from-three-directions"
    evidence:
      - quote: "Windows stored past YubiKey signatures in cleartext where authenticated unprivileged users, including remote users, could read them."
        attribution: "The Hacker News, reporting SpecterOps research"
        source_url: "https://thehackernews.com/2026/08/new-passkey-attacks-can-recover-synced.html"
      - quote: "Microsoft's July 2026 Windows updates make the WebAuthn assertions written to event logs unusable for replay attacks."
        attribution: "The Hacker News, reporting SpecterOps research"
        source_url: "https://thehackernews.com/2026/08/new-passkey-attacks-can-recover-synced.html"
      - quote: "SpecterOps said it has not observed subsequent changes on Entra's side."
        attribution: "The Hacker News, reporting SpecterOps research"
        source_url: "https://thehackernews.com/2026/08/new-passkey-attacks-can-recover-synced.html"
    extended_notes: |
      Detection angle: hunt for read access to Windows Event Logging Service records (Security/Application
      event channels holding WebAuthn/FIDO2 assertion data) by non-administrative or remote-session
      accounts, and for Entra ID sign-in events where a FIDO2/passkey-satisfied authentication
      originates from a session or device with no prior passkey-registration telemetry for that user.
      Hardening: apply CVE-2026-34348 (July 2026 Patch Tuesday) to close the Windows-side cleartext
      caching; the Entra ID-side replay surface has no vendor fix as of this research.

  - title: "Recorded Future maps the malware-crypting-service market: 24 named vendors, tiered pricing to $20,000+/month, and why static-signature defenses cannot keep pace"
    sources:
      - { url: "https://www.recordedfuture.com/research/malware-crypting-services-threat-actors", publisher: "Recorded Future (Insikt Group)", date: "2026-08-13", role: "primary" }
    discovery_trace: "first seen at: bridge fetch of recordedfuture.com/feed, URL https://www.recordedfuture.com/feed → primary: Recorded Future Insikt Group, URL https://www.recordedfuture.com/research/malware-crypting-services-threat-actors (no pivot needed)"
    summary: |
      Recorded Future's Insikt Group published a market survey on 2026-08-13 of the criminal
      "crypting-as-a-service" ecosystem: 24 named providers/brands (VIP Crypt/mrlapis, ASMCrypt/o1oo1,
      ImComplexed, GoldenCrypt and others) operating tiered dark-web offerings from roughly $30 to
      $20,000+ per month, targeting Windows executables almost exclusively. Beyond basic packing, the
      surveyed services bundle anti-analysis checks (debugger/VM detection), process injection,
      DLL-sideloading, in-memory PE mapping, and automated re-encryption cycles that let a customer
      re-obfuscate a payload the moment a security vendor flags the previous build — services are
      advertised alongside public/semi-public multi-AV scanning sites (avcheck.net, scanner.to,
      KleenScan) used to validate re-encrypted output stays undetected before redeployment. Named
      downstream malware families the report ties to crypting-service customers include Rhadamanthys,
      Remcos RAT, PureRAT, Trickbot-lineage loaders, Agent Tesla, BianLian and HijackLoader/IDAT
      Loader. Recorded Future's defender-facing conclusion is explicit that static-signature detection
      cannot keep pace with a commercial re-encryption cycle measured in hours, and recommends shifting
      weight to behavioural indicators: security-product tampering or unusual process exclusions,
      unsigned binaries executing from temp directories, DLL sideloading patterns, and process
      injection telemetry, correlated with upstream threat-intel on which crypting brand a given
      malware family currently favours.
    region_nexus: "global; crypting-as-a-service is vendor/geography-agnostic and affects any organisation defending against commodity-loader-delivered malware"
    primary_sector_nexus: "indirect"
    sector: "cross-sector"
    cves: []
    techniques: [T1027, T1497, T1685, T1055]
    affected_products: []
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "Crypting services and products modify malicious payloads to help threat actors bypass detection, complicate analysis, and preserve malware usability after exposure."
        attribution: "Recorded Future Insikt Group"
        source_url: "https://www.recordedfuture.com/research/malware-crypting-services-threat-actors"
      - quote: "The significance of crypters lies less in technical innovation than in making mature evasion methods available as paid services."
        attribution: "Recorded Future Insikt Group"
        source_url: "https://www.recordedfuture.com/research/malware-crypting-services-threat-actors"
    extended_notes: |
      Defender-actionable hunt: alert on process creation events where a security-product process
      (AV/EDR service names) is the target of a handle-open or termination request from an unsigned,
      recently-created binary running from %TEMP%, %APPDATA%, or a similarly non-standard path — the
      report frames security-software tampering and exclusion-list modification as a more durable
      signal than any hash or static rule keyed to a specific crypter build.

  - title: "Wiz CIRT's GitHub PAT-compromise playbook: a multi-organisation mass-repository-exfiltration campaign run from 102 AWS IPs in one AWS region, and why repo theft is a credentials incident, not a source-code incident"
    sources:
      - { url: "https://www.wiz.io/blog/investigating-github-pat-compromise", publisher: "Wiz (Customer Incident Response Team)", date: "2026-08-13", role: "primary" }
      - { url: "https://www.wiz.io/blog/securing-personal-repositories", publisher: "Wiz", date: "2026-08-13", role: "corroborating" }
    discovery_trace: "first seen at: WebFetch drill of wiz.io/blog listing, URL https://www.wiz.io/blog → primary: Wiz CIRT investigation writeup, URL https://www.wiz.io/blog/investigating-github-pat-compromise"
    summary: |
      Wiz's Customer Incident Response Team published a technical investigation playbook on
      2026-08-13 for a coordinated campaign, run against multiple customer organisations, that abused
      compromised GitHub Personal Access Tokens (PATs) for mass repository exfiltration. The
      documented attack progressed through three phases: reconnaissance via GitHub API queries to
      enumerate every repository the compromised PAT could reach; validation through a small number of
      limited-scope clone operations; then bulk exfiltration — in the case Wiz details, the actor used
      102 distinct AWS IP addresses in the ca-central-1 region between 09:14 and 14:55 UTC to clone up
      to thousands of repositories per victim organisation in parallel. Wiz's framing for defenders is
      that repository theft should be treated as a credentials-and-secrets incident rather than a
      source-code-confidentiality incident: cloned repositories routinely carry embedded cloud
      credentials, SaaS API tokens, private keys and internal documentation whose blast radius exceeds
      the code itself. The published investigation playbook is concrete: contain the compromised PAT
      first, then reconstruct the timeline from GitHub's enterprise audit-log events (which record the
      token's principal, source IP and cloned-repository identifiers), inventory every repository the
      token could reach to scope blast radius, rotate every credential type the exfiltrated repositories
      contained, and hunt cloud-provider logs (CloudTrail, GuardDuty, equivalent) for use of any secret
      recovered from the stolen repositories. A companion Wiz post published the same day separately
      reports that 56% of company-impacting secrets Wiz found across the Forbes AI 50 companies' code
      resided in employees' personal (non-organisational) GitHub repositories — outside the visibility
      of enterprise secret-scanning tooling entirely.
    region_nexus: "global; GitHub Enterprise and AWS are common developer-tooling stacks across the constituency's public-sector and CI technology suppliers"
    primary_sector_nexus: "indirect"
    sector: "cross-sector, software-supply-chain"
    cves: []
    techniques: [T1552.001, T1213.003, T1550.001]
    affected_products: ["GitHub Enterprise Cloud", "GitHub Personal Access Tokens"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "Between 09:14 and 14:55 UTC, the actor used 102 AWS IP addresses located in the ca-central-1 region to clone up to thousands of repositories per organization."
        attribution: "Wiz (Customer Incident Response Team)"
        source_url: "https://www.wiz.io/blog/investigating-github-pat-compromise"
      - quote: "Repository exfiltration should be treated as more than source code theft. Repositories frequently contain cloud credentials, SaaS tokens, internal documentation, private keys, and sensitive data that can significantly increase the impact of a compromise."
        attribution: "Wiz (Customer Incident Response Team)"
        source_url: "https://www.wiz.io/blog/investigating-github-pat-compromise"
      - quote: "56% of company-impacting secrets lived in employees' personal repositories, where most security programs have no visibility."
        attribution: "Wiz"
        source_url: "https://www.wiz.io/blog/securing-personal-repositories"
    extended_notes: |
      No named actor or cluster attribution is offered by Wiz for the May-June 2026 campaign the
      playbook describes; this is a defensive-tooling writeup rather than a threat-actor profile.
      Detection hook independent of any specific IOC: GitHub Enterprise audit-log events showing a
      single PAT/principal issuing a burst of repository-clone or archive-download API calls from
      source IPs spanning a narrow cloud-provider CIDR range within a short time window — a shape that
      is anomalous for legitimate CI/CD or developer tooling, which typically clones from a stable,
      small set of known egress ranges.

  - title: "ANNUAL REPORT — Dragos: Industrial Ransomware Analysis Q2 2026, and Check Point Research: The State of Ransomware Q2 2026 — two independent Q2 counts converge on the same fragmentation-without-de-concentration pattern"
    sources:
      - { url: "https://www.dragos.com/blog/dragos-industrial-ransomware-analysis-q2-2026", publisher: "Dragos", date: "2026-08-10", role: "primary" }
      - { url: "https://research.checkpoint.com/2026/the-state-of-ransomware-q2-2026/", publisher: "Check Point Research", date: "2026-08-13", role: "primary" }
    discovery_trace: "first seen at: WebFetch drill of dragos.com/blog listing, URL https://www.dragos.com/blog/ → primary: Dragos Q2 2026 report, URL https://www.dragos.com/blog/dragos-industrial-ransomware-analysis-q2-2026; separately first seen at: RSS feed https://research.checkpoint.com/feed/ → primary: Check Point Research Q2 2026 report, URL https://research.checkpoint.com/2026/the-state-of-ransomware-q2-2026/"
    summary: |
      Two independent quarterly reports, published three days apart in-window, converge on the same
      shape for the Q2 2026 ransomware landscape from different vantage points. Dragos (industrial-
      sector-focused, published 2026-08-10) recorded 1,140 ransomware incidents against industrial
      organisations in Q2, up 12% from Q1's 1,020; manufacturing took 65% of that volume (747
      incidents), with Germany the fastest-growing regional target (37 to 68 incidents quarter over
      quarter) and North America still the largest absolute total (514). Critically, Dragos states it
      observed no case in Q2 in which a ransomware operator reached Stage 2 of the ICS Cyber Kill Chain
      or directly manipulated a control system — every operational-technology disruption traced back
      to compromise of enterprise IT or virtualisation infrastructure cascading into OT rather than
      direct OT-targeted tradecraft. Check Point Research (cross-sector, all leak-site victims,
      published 2026-08-13) counted 2,139 total data-leak-site victims in Q2 — flat quarter over
      quarter but up 33% year over year — and found the top 10 groups' combined share fell from 71% in
      Q1 to 57.6% in Q2 even as the number of distinct active groups climbed to a tracked high of 93.
      Qilin remained the single most prolific operator for a fourth straight quarter (279 victims, down
      17%), but The Gentlemen surged 62% to 269 victims and briefly overtook Qilin in June; the newer,
      faster-growing groups (The Gentlemen, the newly active Krybit) target the US noticeably less
      often than established players, pulling the US victim share down from 50% to 42%. Check Point
      separately measured ransom-payment rates at a multi-year low near 23%, continuing a six-year
      decline from 85% in 2019, with a widening split between large enterprises still paying heavily
      and mid-market organisations increasingly resisting. Both reports independently describe the same
      structural dynamic in different words: the ecosystem is fragmenting into more, smaller,
      faster-moving brands even as a stable top tier retains disproportionate volume — and for OT
      operators specifically, Dragos's finding that zero Q2 incidents reached true ICS-manipulation
      stage is the operationally load-bearing fact: the ransomware risk to control systems in Q2
      remained entirely a function of IT/virtualisation exposure, not OT-specific tradecraft.
    region_nexus: "global; Dragos names Germany as the fastest-growing regional target quarter over quarter, directly relevant to European critical-infrastructure and manufacturing constituencies"
    primary_sector_nexus: "indirect"
    sector: "manufacturing, energy, cross-sector"
