    evidence:
      - quote: "Dragos identified 1,140 ransomware incidents affecting industrial organizations in Q2 2026, a 12% increase over the 1,020 recorded in Q1."
        attribution: "Dragos"
        source_url: "https://www.dragos.com/blog/dragos-industrial-ransomware-analysis-q2-2026"
      - quote: "Dragos observed no case in Q2 2026 in which a ransomware operator reached Stage 2 of the ICS Cyber Kill Chain or directly manipulated a control system"
        attribution: "Dragos"
        source_url: "https://www.dragos.com/blog/dragos-industrial-ransomware-analysis-q2-2026"
      - quote: "The top 10 groups accounted for 57.6% of all victims, down from 71% in Q1, while the number of active groups climbed from 71 to 93, a new high for the period tracked in this report."
        attribution: "Check Point Research"
        source_url: "https://research.checkpoint.com/2026/the-state-of-ransomware-q2-2026/"
      - quote: "Ransom payment rates fell to a multi year low near 23%, continuing a six year decline from 85% in 2019."
        attribution: "Check Point Research"
        source_url: "https://research.checkpoint.com/2026/the-state-of-ransomware-q2-2026/"
    extended_notes: |
      Germany's quarter-over-quarter growth (37 to 68 Dragos-tracked industrial incidents) is worth a
      standing watch item for the constituency's neighbouring-jurisdiction sector lens. Neither report
      names a Swiss victim or incident specifically.

