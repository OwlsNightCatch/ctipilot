          summary: "Newly active ransomware operation Check Point Research tracks as one of the fastest-growing Q2 2026 leak-site operators, targeting the US less frequently than established groups (Check Point Research, State of Ransomware Q2 2026, 2026-08-13)." }
    relation_suggestions: []
    verification: MULTI-SOURCE
