    extended_notes: |
      Classification: reliability A (ETSI is the official EU-recognised standards development
      organisation acting as primary source for its own standardisation-process announcement), credibility
      1 (corroborated by Help Net Security's independent report and directly verified against ETSI's own
      open document store, which lists the 17 draft filenames with their own embedded draft dates —
