items:
  - title: "Dutch Cyberbeveiligingswet (NIS2) takes effect with no transition period — registration is a live obligation from day one"
    sources:
      - { url: "https://www.ncsc.nl/nieuws/cbw-en-wwke-nu-van-kracht", publisher: "NCSC-NL", date: "2026-08-15", role: "primary" }
      - { url: "https://www.ncsc.nl/cyberbeveiligingswet-nis2/registreren", publisher: "NCSC-NL", date: "2026-08-15", role: "primary" }
      - { url: "https://ees.nl/2026/08/11/nis2-is-definitief-cyberbeveiligingswet-gaat-op-15-augustus-in/", publisher: "EES.nl", date: "2026-08-11", role: "corroborating" }
    discovery_trace: "first seen at: advisories-ncsc-nl feed, URL https://feeds.ncsc.nl/nieuws.rss (item: 'Cyberbeveiligingswet en Wet weerbaarheid kritieke entiteiten vanaf vandaag van kracht') → primary: NCSC-NL, URL https://www.ncsc.nl/nieuws/cbw-en-wwke-nu-van-kracht → pivot: NCSC-NL registration guidance, URL https://www.ncsc.nl/cyberbeveiligingswet-nis2/registreren → corroboration: EES.nl, URL https://ees.nl/2026/08/11/nis2-is-definitief-cyberbeveiligingswet-gaat-op-15-augustus-in/"
    summary: |
      On 15 August 2026 the Cyberbeveiligingswet (Cbw) and the companion Wet weerbaarheid kritieke
      entiteiten (Wwke) entered into force, confirmed the same day by NCSC-NL — the delta this pipeline's
      W32 brief flagged as still-prospective is now a live obligation. Roughly 8,000 organisations across
      18 NIS2 essential/important sectors carry registration, duty-of-care, board-accountability and
      incident-notification obligations effective immediately, with no grace period: NCSC-NL's own
      guidance states the registration duty "geldt pas vanaf de inwerkingtreding... op 15 augustus 2026"
      (applies only from entry into force on 15 August 2026) and does not describe any transition window —
      an in-scope organisation that had not registered was already non-compliant the moment the clock
      started. Registration runs through the national entity register at mijn.ncsc.nl, gated by
      eHerkenning (assurance level EH2+) or SSOnRijk for connected government bodies; post-registration
      changes must be reported within 14 days. Incident reporting follows the NIS2-standard cadence
      (24-hour early warning, 72-hour notification, one-month final report). Downstream commentary
      (EES.nl) puts the directly-regulated population at "over 10,000" organisations and estimates
      50,000–100,000 further businesses drawn in indirectly through the supply-chain due-diligence
      obligations the directly-regulated entities must now impose on their own vendors. For a Swiss
      federal SOC the direct obligation is EU/Dutch, but the enforcement mechanics — mandatory portal
      registration with strong-authentication gating, no grace period, and supply-chain due-diligence
      cascading onto unregulated vendors — are the template Germany (registration deadline lapsed 31 July,
      enforcement phase now active) and other member states are converging on, and it is what Swiss
      suppliers selling into the Dutch/EU public sector will be asked to demonstrate.
    region_nexus: "EU (Netherlands) — direct regulatory obligation on ~8,000+ organisations; enforcement-mechanics template transferable across EU member states and to Swiss suppliers selling into Dutch/EU public-sector and CI markets"
    primary_sector_nexus: "indirect"
    sector: "public-sector, energy, water, transport, healthcare, finance, telco"
