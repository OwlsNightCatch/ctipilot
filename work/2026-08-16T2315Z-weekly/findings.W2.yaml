  - title: "NCSC UK adds a water-sector worked example to its OT Secure Connectivity Principles guidance"
    sources:
      - { url: "https://www.ncsc.gov.uk/blogs/water-sector-example-added-to-the-ncscs-secure-connectivity-principles", publisher: "NCSC UK", date: "2026-08-11", role: "primary" }
    discovery_trace: "first seen at: ncsc-uk RSS feed, URL https://www.ncsc.gov.uk/api/1/services/v1/all-rss-feed.xml (item: 'Water sector example added to the NCSC's Secure connectivity principles') → primary: NCSC UK, URL https://www.ncsc.gov.uk/blogs/water-sector-example-added-to-the-ncscs-secure-connectivity-principles (no pivot needed)"
    summary: |
      On 11 August 2026 NCSC UK published a worked example — developed jointly with the Industrial
      Control Systems Community of Interest (ICS-COI) Boundary Expert Group, and the first NCSC website
      content that group has directly authored — applying the existing Secure Connectivity Principles for
      Operational Technology to a fictional regional water utility ("Admin Corp Water"). It walks through
      how a water OT operator can use the eight connectivity principles as a "target state" to reduce
      exposure, centralise connectivity, manage legacy protocols and strengthen OT/IT boundaries while
      balancing safety, reliability and operational constraints against legacy infrastructure. NCSC states
      explicitly this is not prescriptive: "The aim of the example is not to prescribe a single
      architecture or implementation." It carries no compliance obligation and does not reference the
      ongoing water-sector PLC-lockout campaign this pipeline has tracked across multiple US states
      (Rockwell MicroLogix targeting, credential-based reachability rather than a vulnerability) — the
      post is guidance capability, not incident response to that campaign. Marked borderline because it
      changes what a water-sector OT defender is able to plan an architecture against, but creates no new
      obligation and dates no compliance clock, which is the stated bar for this domain's inclusion.
    region_nexus: "UK — voluntary guidance; principles are referenced as a target-state model any European water-sector OT operator (including Swiss) could adopt"
    primary_sector_nexus: "indirect"
    sector: "water"
