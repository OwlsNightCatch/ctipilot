      specific enforcement date.

  - title: "ETSI opens the formal approval process for the first 17 draft harmonised standards under the EU Cyber Resilience Act"
    sources:
      - { url: "https://www.etsi.org/newsroom/press-releases/etsi-launches-approval-process-for-17-european-standards-supporting-the-cyber-resilience-act/", publisher: "ETSI", date: "2026-08-13", role: "primary" }
      - { url: "https://docbox.etsi.org/CYBER/EUSR/Open", publisher: "ETSI (document store)", date: "2026-08-13", role: "primary" }
      - { url: "https://www.helpnetsecurity.com/2026/08/14/etsi-cyber-resilience-act-standards/", publisher: "Help Net Security", date: "2026-08-14", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"Cyber Resilience Act delegated act harmonised standard August 2026\") → pivot: Help Net Security, URL https://www.helpnetsecurity.com/2026/08/14/etsi-cyber-resilience-act-standards/ → primary: ETSI press release, URL https://www.etsi.org/newsroom/press-releases/etsi-launches-approval-process-for-17-european-standards-supporting-the-cyber-resilience-act/ → primary: ETSI open document store, URL https://docbox.etsi.org/CYBER/EUSR/Open"
    summary: |
      On 13 August 2026 ETSI announced it has submitted 17 "vertical" final-draft EN 304-6xx series
      standards to the national standardisation bodies of all 41 European Economic Area member
      organisations, opening the CRA's formal Public Enquiry/approval phase — the mechanism that, once
      complete, gives manufacturers the Article-27 "presumption of conformity" under the Cyber Resilience
      Act. ETSI's own words: "The Cyber Resilience Act lays down what manufacturers, and the market need
      to achieve, but it does not tell you how" (Sandra Feliciano, Chair, TC CYBER-EUSR) — these standards
      are what fills that gap. The product categories are concrete and procurement-relevant, confirmed
      from ETSI's own open document store: browsers (EN 304-617), password managers (EN 304-618),
      antivirus (EN 304-619), VPNs (EN 304-620), network management systems (EN 304-621), SIEM
      (EN 304-622), boot managers (EN 304-623), PKI certificate-issuance software (EN 304-624), network
      interfaces (EN 304-625), operating systems (EN 304-626), routers/modems/switches (EN 304-627),
      smart-home virtual assistants (EN 304-631), smart-home security products (EN 304-632),
      internet-connected toys (EN 304-633), personal wearables (EN 304-634), virtualization/container
      platforms (EN 304-635), and firewalls (EN 304-636). The approval procedure runs from mid-September
      to mid-November 2026 depending on the vertical (ETSI's Annex III societal partners — ANEC, ECOS,
      ETUC, SBS — also get a comment window), and the Commission's own standardisation mandate (M/606)
      has already pushed the 2026 drafting deadlines back two months; as of 9 August 2026 no CRA
      harmonised standard has yet been ratified as an EN or published in the Official Journal. Practical
      consequence: the presumption-of-conformity route is still unusable for any of these categories as
      the CRA's first hard clock — the 11 September 2026 reporting-obligation start date this pipeline
      already tracks — arrives. Manufacturers, importers, distributors and integrators for the
      public-sector/CI procurement basket (firewalls, VPNs, network management systems, SIEM, PKI
      issuance software, routers/switches, operating systems) will have to demonstrate CRA compliance
      through self-assessment against the essential requirements, or third-party conformity assessment
      for critical-category products, until standards clear the full approval chain — expected no earlier
      than late October 2026 for the first horizontal standard (prEN 40000-1-2).
    region_nexus: "EU/EEA-wide — obligates manufacturers, importers, distributors and integrators selling connected products into the EU/EEA market, including Swiss vendors and suppliers to the Swiss public sector that also sell into the EU"
    primary_sector_nexus: "indirect"
