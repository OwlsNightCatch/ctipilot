  item: "weekly-w33-compromised-party-was-not-the-notifying-party"
  url_or_quote: "Poland's digital affairs minister, Krzysztof Gawkowski, put the stolen database at almost 19 million people ([Notes from Poland, 2026-08-13](https://notesfrompoland.com/2026/08/13/poland-hit-by-theft-of-19-million-patients-data-from-medical-platform/))"
  summary: >-
    Iteration 6 corrected the ministerial TITLE against Notes from Poland but left the FIGURE bound to him on
    the same citation. Fetched this iteration: Notes from Poland never attributes a number to Gawkowski. It
    quotes him only as "We are dealing with one of the largest incidents in Poland's history", that "there is
    no indication we are dealing with an external attack...from Russia or any other country", that it is "very
    likely" cybercriminals are behind it, and his advice to lock the PESEL number. The number is the article's
    own framing ("The personal data of almost 19 million people...has been compromised") and the perpetrators'
    claim relayed by Zaufana Trzecia Strona ("The alleged perpetrators...claimed to have accessed the data of
    around 18.8 million people"). Same misattribution in two more places in the same entry - summary line 12-13
    "confirmed a criminal intrusion the government put at nearly 19 million people", and sourcing_note line 85
    "The MyDr scale figure is a government minister's statement rather than a company or forensic finding and
    is attributed as such". Fix: de-attribute the figure in all three places (e.g. "reported at almost 19
    million people, the alleged perpetrators claiming 18.8 million"), or move it to Gazeta Prawna only if that
    page is confirmed to carry the minister stating it.
- code: F14
  category: quantifier-without-source
  section: weekly-sector-patterns
  item: "weekly-w33-compromised-party-was-not-the-notifying-party"
  url_or_quote: "in three of them the notification duty landed where the intrusion did not"
  summary: >-
    Iteration 5 corrected the disclosure count from seven to six but left the derived displaced-duty count at
    three, which was calibrated to the seven-case set that still counted bol.com. The entry's own sourcing_note
    (lines 87-89) enumerates the opposite: "The notification duty is displaced in the MyDr and CEVA cases and,
    through CEVA, for bol.com; in the DGFiP, Zabka, Retelit and ACRO cases the compromised body is also the
    notifying body" - i.e. two of the six, with bol.com a downstream notification inside the CEVA case, exactly
    as iteration 5 established when it removed bol.com from the disclosure count. "Three of them" appears in
    three places over the six-case set: headline (line 7), summary (lines 11-12 "in three of them that displaced
    the duty to tell the affected people"), and body (line 111 "In three of them that separation ran all the way
    to the notification"). Fix: two in all three places, or scope explicitly as two of the six plus bol.com
    downstream of CEVA.
- code: F11
