  item: "weekly-w33-disclosure-to-exploitation-interval-collapsed"
  url_or_quote: "\"Switzerland's NCSC published its own advisories on the vCenter, SharePoint, NetScaler and GeoServer items inside the same week\" / summary: \"Switzerland's NCSC put four of the five in front of its own constituency inside the same week.\" cited to https://security-hub.ncsc.admin.ch/#/posts/12844"
  summary: "The cited NCSC-CH post (id 12844, created 2026-08-14) is the GeoServer advisory only. Fetched the hub's own post list this iteration (tools/fetch_source.py ncsc-csh recent 60): the only NCSC-CH Security Hub posts inside 2026-W33 are 12839 SAP (08-11), 12840 Microsoft Patch Tuesday (08-12), 12841 Adobe (08-12), 12844 GeoServer (08-14). No in-week hub advisory on vCenter, SharePoint or NetScaler; the referenced operational entries describe an *update* to an existing vCenter advisory and a NetScaler position held since 3 July, and no cited source or referenced entry supports an NCSC-CH SharePoint advisory at all. NCSC-CH publishes on more than one surface, so this does not prove none exists — but the citation as placed claims all four and carries one. Fix: narrow the clause to GeoServer (and SAP, which the hub did publish in-week), or cite each advisory."
