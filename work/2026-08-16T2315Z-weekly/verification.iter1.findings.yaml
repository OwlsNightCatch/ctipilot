  section: weekly-research
  item: "weekly-w33-developer-credential-audits-wrong-artefact"
  url_or_quote: "\"found 2,085 of the 2,188 identified organisations — 95% — had credential collection that ended before the poisoned LiteLLM packages were ever published\" cited to https://socradar.io/blog/litellm-supply-chain-attack/"
  summary: "Fetched the SOCRadar post this iteration. Its own wording is 'More pointedly, 2,085 of the 2,188 organizations, or 95%, show collection activity before March 24, the day the poisoned LiteLLM packages reached PyPI' and '95% of affected organizations were already exposed before March 24'. SOCRadar also states its records' last-seen timestamps run to 'March 24 at 20:09 UTC' — i.e. after publication — so 'collection that ENDED before the packages were published' is a stronger claim than the source makes. 'began before' / 'was already under way before' matches the source. (Same phrasing was inherited from operational entry 2026-08-15/trivy-not-litellm-behind-2500-org-credential-collection.)"
- code: F3
  category: claim-not-supported
  section: weekly-top-stories
  item: "weekly-w33-disclosure-to-exploitation-interval-collapsed (also weekly-w33-vuln-status-rollup)"
  url_or_quote: "\"361 unique victim IP addresses across 47 countries, with Germany the largest single concentration ahead of the United States, Turkey, Iran and France\" cited to https://thehackernews.com/2026/08/attackers-exploit-vmware-vcenter.html"
  summary: "Fetched THN this iteration. It states: 'In all, there are as many as 361 unique victim IP addresses located across 47 countries. Most of them are located in Germany, the U.S., Turkey, Iran, and France.' That is an unordered enumeration, not a ranking; THN nowhere says Germany is the largest concentration or that it is 'ahead of' the United States. The QUIRSO original could not be reached (medium.com direct 403; all seven jina keys HTTP 402), so no source available to this run states the ranking. Lightest finding of the set — minimal fix is 'concentrated in Germany, the US, Turkey, Iran and France'. The roll-up entry carries the same clause ('Germany the largest concentration')."
- code: F4
  category: hallucinated-fact
  section: weekly-multi-day
  item: "weekly-w33-attacking-the-record-not-the-sensor"
  url_or_quote: "summary: \"Four disclosures inside 2026-W33 share a property that is not ordinary defence evasion.\" / body: \"Four of this week's disclosures are about something else\" / title: \"Three unrelated intrusions and one research publication this week\""
  summary: "Contradicted by the entry's own sources[] dates. 2026-W33 is Mon 2026-08-10 – Sun 2026-08-16 (the run record defines it). CrowdStrike is dated 2026-08-07 (confirmed live: 'August 07, 2026'), Group-IB 2026-07-30 (confirmed live: 'July 30, 2026'), Sophos 2026-08-07 (no publication date on the page at all), and only the six-agency advisory (2026-08-10) is in-window. Three of the four were *covered* by this pipeline on 2026-08-10 but were not disclosed inside W33. Fix the framing ('four disclosures this pipeline worked in W33' / 'four disclosures from the last fortnight') rather than the facts, which are otherwise verbatim-correct."
- code: F4
  category: hallucinated-fact
