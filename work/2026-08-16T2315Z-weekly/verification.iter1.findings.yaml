  item: "'six flaws with no fix in existence' — the count does not match either entry's own enumeration"
  url_or_quote: "roll-up: \"this week's disclosures left six flaws with no fix in existence: the ShieldBreak bypass ..., the three FreeBSD CTL HA pre-authentication kernel primitives behind TCP/999, the GeoServer injection, and three of the five NatJack NAT primitives\" (1+3+1+3 = 8) / looking-ahead: \"Six flaws tracked this week have no fix in existence\" enumerating ShieldBreak + three FreeBSD + three NatJack (= 7), with GeoServer carried as a separate bullet (= 8 overall)"
