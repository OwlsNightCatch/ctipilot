  item: "weekly-w33-vuln-status-rollup"
  url_or_quote: "headline: \"W33 CVE trajectory — ten newly exploited or newly catalogued, two exploited with no identifier at all, and six flaws with no fix in existence\""
  summary: "'two exploited with no identifier at all' is not supported by the body. The body's dedicated section '**Exploited with no identifier, and unpatched.**' names exactly one item, the GeoServer jsonArrayContains SQL injection, and the summary likewise reads 'Exploited with no identifier: the GeoServer jsonArrayContains SQL injection'. The only candidate second item is CVE-2026-72898 (Metabase), which the same entry places under 'Newly confirmed exploited or newly KEV-listed' and which now HAS an identifier and a KEV entry (KEV dateAdded 2026-08-11, verified). Headlines render at the top of the brief; correct to 'one'."
- code: F14
  category: quantifier-without-source
  section: weekly-top-stories
  item: "weekly-w33-disclosure-to-exploitation-interval-collapsed"
  url_or_quote: "summary: \"Two researchers rebuilt working pre-authentication root exploits from Apple's Screen Sharing binary diff in about four hours\""
  summary: "The 'two' belongs to the exploits, not the researchers. Calif's post (fetched live this iteration) is subtitled 'Two pre-auth macOS remote root exploits in four hours' and closes 'We pulled the 26.6 and 26.6.1 binaries, diffed them, and built a working exploit against a live 26.6 machine. We then did the same for the first bug, diffing 26.5.2 against 26.6 ... Two pre-auth remote root exploits in four hours, on and off, across a busy weekend.' The work is by one team ('we', 'our engineers are in APAC'); the only other named researcher, @osxreverser, found the FIRST bug and did not report it, and did not participate in the diffing. Also 'binary diff' (singular) covers two different diffs. The body's rendering of the same fact is accurate — only the frontmatter summary drifts."
