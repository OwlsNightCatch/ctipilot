- code: F10
  category: missed-angle
  section: whole-run
  item: "No Russia / Ukraine-nexus content anywhere in the week's 14 strategic entries"
  url_or_quote: "https://www.truesec.com/hub/blog/russia-targets-businesses-and-officials-behind-europes-ukraine-defence-supply-chain (published 2026-08-14, in-window)"
  summary: "Fetched this iteration: Truesec, 14 August 2026, 'Russia Targets Businesses and Officials Behind Europe's Ukraine Defense Supply Chain' — GRU Unit 26165 and Russian services running combined surveillance, sabotage and cyber operations against European defence manufacturers, drone start-ups, component suppliers and LOGISTICS firms, including cyber access attempts against logistics and technology companies transporting aid to Ukraine to obtain 'train schedules, manifests, routes, cargo contents and sender/recipient details', plus published target addresses and an assassination plot against a named CEO. Transport is one of the profiled additional sectors and the coverage focus is European critical infrastructure and government. Evidence this was surfaced and then silently lost: the run's own url-liveness ledger records both the Truesec blog index and this exact article at HTTP 200 at 2026-08-16T23:19:58Z; 'truesec' appears in W1's sources_attempted but not in sources_used; it is NOT in triage.json 'dropped'; and it is NOT in the run record's coverage-gaps list. Prior coverage carries zero records matching 'Ukraine' or 'truesec' across all 165 records / 14 days, so this is not a dedup suppression. Either publish it or record it as a reasoned drop. Suggested query: \"GRU Unit 26165 European defence logistics targeting August 2026\"."
