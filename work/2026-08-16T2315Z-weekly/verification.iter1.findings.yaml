  item: "weekly-w33-etsi-cra-harmonised-standards-approval"
  url_or_quote: "\"Alongside browsers, password managers, antivirus software, smart-home assistants, connected toys and wearables, the drafts cover VPNs, network management systems, SIEM, boot managers, PKI certificate-issuance software, network interfaces, operating systems, routers, modems and switches, virtualization and container platforms, and firewalls — most of a public-sector security stack.\""
