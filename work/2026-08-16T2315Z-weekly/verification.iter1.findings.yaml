  item: "weekly-w33-water-plc-lockout-status"
  url_or_quote: "cves[0]: status: [cisa-kev, patch-available] / fixed: \"Per Rockwell Automation's own advisory for the affected Logix families\""
  summary: "Contradicted by the entry's own cited primary. The CISA CSAF advisory ICSA-21-056-03 (fetched this iteration) records under remediations: 'Rockwell Automation has determined this vulnerability cannot be mitigated with a patch. Rockwell encourages users to combine its specific risk mitigation recommendations with general security guidelines for a comprehensive defense-in-depth strategy.' Every remediation entry is category 'mitigation'; there is no fixed version. 'patch-available' and a 'fixed' field asserting a Rockwell fix are both unsupported and machine-consumed. Use no-patch / mitigation-only. (Everything else in this entry verified: title 'Rockwell Automation Logix Controllers', known_affected = RSLogix 5000 16–20 + Studio 5000 Logix Designer >=21 + FactoryTalk Security >=2.10, CVSS 10.0, both CISA quotes verbatim, both Dragos quotes verbatim, KEV dateAdded 2026-03-05, CVE-2017-16740 absent from KEV.)"
- code: F4
  category: hallucinated-fact
  section: run-record
  item: "runs/2026-08-16/2026-08-16T2315Z-weekly.md — verification notes"
  url_or_quote: "\"W1 reported a Dragos figure of 514 incidents for North America. That number does not appear in the report, whose own text gives the United States 431 incidents, or 38%.\""
  summary: "The 514 figure IS in the Dragos Q2 2026 report. The report's regional section reads: 'North America: Recorded 514 incidents in Q2 2026 (up from 480 recorded in Q1 2026), remaining the second-most impacted region.' (Present in the run's own saved body work/.../raw/dragos_q2.txt line 3145 and in the live page.) The correction's OUTCOME is right — 431 / 38% is the report's US figure and is what the entry uses — but the stated reason is false and the run-record notes publish. Rewrite as: W1 attributed the North America regional figure (514) to the United States; the report's US figure is 431 (38%)."
- code: F14
  category: quantifier-without-source
  section: weekly-long-running
  item: "weekly-w33-clop-windchill-status"
  url_or_quote: "summary: \"ReliaQuest separately reported actors deploying JSP webshells on compromised product-lifecycle platforms, the first post-exploitation detail published for this campaign.\" / body: \"The third delta is the first technical detail anyone has published about what the actors do after exploitation\" / takeaway: \"until this week the campaign offered no post-exploitation artefact to hunt for, and now it offers one class\" / title: \"the first post-exploitation detail was published\""
  summary: "Refuted by the entry's OWN cited source. Foresiet (2026-08-10, cited in this entry, fetched this iteration) states: 'PTC went on to report heightened threat activity and documented attackers deploying JSP webshells inside Windchill login directories' and 'PTC identified hexadecimal-named JSP webshells under /Windchill/login/, a custom HTTP request header named X-windchill-req, and flst.txt as an artefact associated with attacker file-listing activity.' PTC published the webshell artefact class before this week, so ReliaQuest's report is corroboration, not a first, and the Defender takeaway ('offered no post-exploitation artefact to hunt for') is wrong on the entry's own evidence. Drop the 'first' from title/summary/body and rework the takeaway to 'a second, independent confirmation of the artefact class PTC already documented'. (Inherited from operational entry 2026-08-15/clop-windchill-philips-shell-first-victim-confirmations, which carries the same claim.)"
- code: F14
