  item: "weekly-w33-attacking-the-record-not-the-sensor"
  url_or_quote: "\"the theft of records on 678,000 individuals and businesses was established only after the attacker advertised the dataset for sale on 12 August ([Ministère de l'Économie et des Finances, 2026-08-14])\""
  summary: "Fetched the press release (n°953, 14 août 2026) this iteration. It says: 'Mercredi 12 et jeudi 13 août 2026, un acteur malveillant a revendiqué des accès illégitimes au système d'information de la Direction générale des Finances publiques' — the actor CLAIMED illegitimate access on 12 AND 13 August. The release says nothing about the dataset being advertised for sale, and dates the claim across two days, not one. Everything else in the sentence (678,000, June/July intrusions, access reviews that did not detect theft) is verbatim supported."
- code: F3
