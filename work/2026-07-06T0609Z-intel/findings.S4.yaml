      - { url: "https://securityaffairs.com/194788/cyber-crime/medtronic-notifies-3-8-million-after-shinyhunters-data-breach.html", publisher: "Security Affairs", date: "2026-07-05", role: "corroborating" }
      - { url: "https://news.medtronic.com/Medtronic-statement-on-unauthorized-system-access", publisher: "Medtronic (vendor statement)", date: "2026-06-29", role: "corroborating" }
    discovery_trace: "first seen at: securityaffairs-source-id, URL https://securityaffairs.com/ (listing, 2026-07-05) → pivot: securityaffairs article, URL https://securityaffairs.com/194788/cyber-crime/medtronic-notifies-3-8-million-after-shinyhunters-data-breach.html → primary: SecurityWeek, URL https://www.securityweek.com/medtronic-data-breach-impacts-3-8-million-people/ (cites Indiana Attorney General filing) → corroboration: Medtronic vendor statement, URL https://news.medtronic.com/Medtronic-statement-on-unauthorized-system-access"
    summary: |
      Medtronic's notification filed with the Indiana Attorney General's Office states the April 2026
      corporate-IT intrusion — publicly attributed to ShinyHunters — affected 3,834,294 individuals, roughly
      42% of the ~9 million figure the actor originally claimed and that BleepingComputer/multiple outlets
      reported on 2026-07-02/03 (previously covered in this pipeline). The intrusion window was 13-19 April
      2026, detected 15 April; exposed fields are name, contact information, date of birth, Social Security
      number, and health-related information. Medtronic states corporate/manufacturing networks are
      segregated from device/product systems and it has no evidence data was posted publicly; SecurityWeek
      notes the group has since delisted Medtronic from its leak site, "which suggests that the company
      might have paid a ransom" (SecurityWeek's own assessment, not a Medtronic admission). The delta matters
      operationally: it is the latest in a recurring ShinyHunters pattern (also seen with Charter/Spectrum,
      One Medical, and Council of Europe claims) where the extortion actor's initially publicized record
      count runs materially above the count eventually confirmed to regulators — a corroboration-discipline
      lesson for any SOC triaging a ShinyHunters leak-site claim against a named org.
    region_nexus: "US filing (Indiana AG); Medtronic operates globally including EU/CH healthcare-device supply chains"
