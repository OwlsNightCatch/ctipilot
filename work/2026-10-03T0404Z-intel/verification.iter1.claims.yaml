claims:
  - {claim_id: 9d14975ca3, verdict: ok, source_url: "https://www.fortiguard.com/psirt/FG-IR-26-175", passage: "This has been reported to be exploited in the wild; table: 7.4.0-7.4.8 'Upgrade to upcoming 7.4.9'; KEV dateAdded 2026-10-01; Belnet links FG-IR-26-175, affected period from 22 July"}
