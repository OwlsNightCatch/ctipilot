  - {claim_id: 8370abb395, verdict: ok, source_url: "https://www.fortiguard.com/psirt/FG-IR-26-175", passage: "CWE-22 and CWE-158 ... may allow an unauthenticated attacker to write arbitrary files on the underlying system via crafted HTTP or HTTPS requests; Timeline 2026-10-01"}
  - {claim_id: 8b2dcd5fa5, verdict: ok, source_url: "https://www.fortiguard.com/psirt/FG-IR-26-175", passage: "This has been reported to be exploited in the wild, customers are urged to apply the workaround below."}
