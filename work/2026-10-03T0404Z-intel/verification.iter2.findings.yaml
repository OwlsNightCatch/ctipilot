- code: F3
  category: claim-not-supported
  section: threat
  item: "2026-10-03/warlock-longlegs-sharepoint-machinekey-sysvol-ransomware (Defender takeaway; actions[0])"
  url_or_quote: "\"...and rotate the machine keys if a web shell is found; in Active Directory domains, watch SYSVOL scripts paths for executables ([Symantec, 2026-10-01](https://www.security.com/threat-intelligence/warlock-ransomware-critical-infrastructure))\" and actions[0] \"where a web shell turns up, rotate the farm's ASP.NET machine keys and restart IIS, as Microsoft's ToolShell guidance says.\""
  summary: "Remediation #5 is incomplete. The takeaway still places key rotation inside a clause terminated by the Symantec link, and the Symantec report carries no rotate/replace/restart-IIS advice (it only says the web shell harvests the machine keys). The action attributes a web-shell-conditional rotation to Microsoft, but Microsoft's step 6/7 reads 'After applying the latest security updates above or enabling AMSI, it is critical that customers rotate SharePoint server ASP.NET machine keys and restart Internet Information Services (IIS) on all SharePoint servers', unconditional and for all servers. Cite the Microsoft ToolShell post on the takeaway's rotation clause (or move it out of the Symantec-cited clause) and make the condition match Microsoft's wording or drop 'as Microsoft's ToolShell guidance says'."
- code: F4
  category: hallucinated-fact
  section: threat
  item: "2026-10-03/warlock-longlegs-sharepoint-machinekey-sysvol-ransomware (body, paragraph 2)"
  url_or_quote: "\"From 2026-07-28 PowerShell commands loading the System.Workflow.ComponentModel assembly ... ran at intervals ([Symantec]). The attackers then used DLL sideloading, fetched installers with msiexec ..., enumerated domain accounts and trusts, added a setup-lookalike domain account ...\""
  summary: "(low confidence) 'then' places DLL sideloading and domain account/trust enumeration after the 2026-07-28 exploitation chain. Symantec dates both to 2026-07-24 ('Malicious activity resumed on July 24 when a number of reconnaissance commands (net user /domain and whoami)'; 'nltest /domain_trusts'; the doexe.exe/ssvagent.exe side-loading pairs), before 'The exploitation chain proper began' on July 28. Use 'also' or drop the sequencing word."
- code: F3
  category: claim-not-supported
  section: vulnerabilities
  item: "2026-10-02/cve-2026-104286-fortimail-path-traversal-zero-day-kev (summary; Update section first sentence)"
  url_or_quote: "\"Belnet, the Belgian government and research network, updated its incident notice on 2026-10-02 ... ([Belnet, 2026-10-02](https://www.belnet.be/en/news-events/news/security-and-privacy-incident-affecting-belnets-it-infrastructure))\""
  summary: "(low confidence) The cited Belnet notice does not describe Belnet as a government and research network. The only cited page that does is Risky Bulletin ('a government-funded internet provider that caters to the Belgian government, educational institutions, and science and research centres'), which is cited in the Belnet entry but not in this one. Cite Risky Bulletin for the descriptor or drop it from this entry's summary and Update."
- code: F14
  category: quantifier-without-source
  section: vulnerabilities
  item: "2026-10-02/cve-2026-104286-fortimail-path-traversal-zero-day-kev (frontmatter summary)"
  url_or_quote: "\"FortiMail 7.4, 7.6 and 8.0 have no fixed build as of 2026-10-03 (...) and 7.2 users are told to move to 7.4 or above, so the vendor workarounds are the only control.\""
  summary: "(low confidence) No cited source says the workarounds are the only control; Fortinet's page lists three workarounds and 'Virtual Patch: No', BleepingComputer says 'apply the shared workarounds until a security update can be installed'. Reword to 'the vendor workarounds are the available mitigation'."
- code: F18
  category: action-item-discipline
  section: vulnerabilities
  item: "2026-10-02/cve-2026-76504-cisco-catalyst-sd-wan-manager-auth-bypass-kev (actions[1])"
  url_or_quote: "\"On every Manager that was internet-reachable before the upgrade, run the compromise check described in the body and open a Severity 3 Cisco TAC case with the CVE id in the title if anything matches.\""
  summary: "Fails check 10b(c): the task is not executable without re-reading the entry ('the compromise check described in the body'). Name the check in the action (audit serviceproxy-access.log for POSTs to the encoded login path from unknown addresses and vmanage-server.log for the encoded path tied to viptela-reserved- users, per the Cisco advisory) or drop the action; the immediate_action already carries the TAC step."
- code: F11
  category: editorial-advisory
  section: incidents
  item: "2026-10-02/belnet-supplier-zero-day-mail-copied-65-days (updates[0].summary vs Update section)"
  url_or_quote: "\"The vulnerability was remediated on 2026-09-25, the Centre for Cybersecurity Belgium is assisting, ... Priority moves from routine to notable because the vector class is now known.\""
  summary: "After the Update section was cut to the delta, the record summary states more than the section: the 2026-09-25 remediation (already in the main analysis), 'the FortiMail path traversal ... without naming the product' and the priority change appear in no section text. Trim the record summary to what the section carries (supplier named and advisory linked, CCB engaged, 2026-09-29 link removal and disabled transfers, new transfers needed)."
- code: F11
  category: editorial-advisory
  section: vulnerabilities
  item: "2026-10-02/cve-2026-104286-fortimail-path-traversal-zero-day-kev (body paragraph 4 and Detection)"
  url_or_quote: "\"a cron job launched from the migration directory\" / \"a modified admin-migration archive\" / \"a cron job launching from the migration directory\""
  summary: "(low confidence) The cited page and BleepingComputer give only the path '/migadmin' (cron 'O=/migadmin ...') and 'migadmin.tar.gz'; 'migration' is the entry's expansion of the abbreviation and no source expands it. Phrase it as 'a cron job that runs from an admin path on the data partition' or note the path as Fortinet's wording."
- code: F11
