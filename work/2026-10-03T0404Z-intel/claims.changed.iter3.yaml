    surface: "actions[1]"
    kind: frontmatter
    text: "On every Manager that was internet-reachable before the upgrade, search serviceproxy-access.log for POSTs to the login path with a percent-encoded character from unknown addresses and vmanage-server.log for login-path requests tied to viptela-reserved- user names, and open a Severity 3 Cisco TAC case with the CVE id in the title if anything matches."
  - claim_id: 68d5a137c9
    entry: 2026-10-02/belnet-supplier-zero-day-mail-copied-65-days
    surface: "record 2026-10-03T04:55:00Z"
    kind: record-summary
    text: "Belnet's notice, updated 2026-10-02, now names the supplier as Fortinet and links Fortinet's advisory FG-IR-26-175, says the Centre for Cybersecurity Belgium is assisting, and says transfers created in the affected period were disabled on 2026-09-29, so senders who still need to share the files must create new transfers."
  - claim_id: da82336321
    entry: 2026-10-03/warlock-longlegs-sharepoint-machinekey-sysvol-ransomware
    surface: "actions[0]"
    kind: frontmatter
    text: "On every on-premises SharePoint Server farm that was reachable from the internet while unpatched, rotate the ASP.NET machine keys and restart IIS on all SharePoint servers, as Microsoft's ToolShell guidance says, and look for unexpected .aspx files in the LAYOUTS template directories of every installed SharePoint version and for domain accounts named like SharePoint setup accounts in local Administrators groups."
