claims:
  - claim_id: 1d1e475963
    entry: 2026-10-02/cve-2026-104286-fortimail-path-traversal-zero-day-kev
    surface: "summary"
    kind: frontmatter
    text: "Fortinet's advisory FG-IR-26-175 of 2026-10-01 describes a path traversal in FortiMail that lets an unauthenticated attacker write arbitrary files through crafted HTTP or HTTPS requests, and says it has been reported exploited in the wild; CISA listed it in KEV the same day. Belnet, the Belgian government and research network, says a zero-day in its supplier Fortinet's technology let attackers copy its inbound mail from 2026-07-22 and links this advisory, which puts exploitation about ten weeks before the disclosure. FortiMail 7.4, 7.6 and 8.0 have no fixed build as of 2026-10-03 (8.0.2, 7.6.7 and 7.4.9 are listed as upcoming) and 7.2 users are told to move to 7.4 or above, so the vendor workarounds are the available mitigation."
  - claim_id: 95775c2094
    entry: 2026-10-02/cve-2026-104286-fortimail-path-traversal-zero-day-kev
    surface: "body"
    kind: cited
    text: "Fortinet's advisory, as read on 2026-10-03, lists attacker addresses and the system events that exploitation left behind: a cron job running a command that references the /migadmin path, an admin CLI session that added a mail archive account sending to a remote host, and IBE decrypter exceptions for invalid Base64 input plus failed internal-user logins ("
    urls: ["https://www.fortiguard.com/psirt/FG-IR-26-175"]
  - claim_id: 6fdb68c0b5
    entry: 2026-10-02/cve-2026-104286-fortimail-path-traversal-zero-day-kev
    surface: "body"
    kind: cited
    text: "BleepingComputer reports that Fortinet's advisory also listed files added or modified on compromised appliances, a shared library under the data partition registered through an `ld.so.preload` entry, a modified system binary, added service binaries, a modified web server configuration and a modified migadmin archive, and reads the archive account as a possible path to send archived data to a remote server ("
    urls: ["https://www.bleepingcomputer.com/news/security/fortinet-warns-of-critical-fortimail-flaw-exploited-in-zero-day-attacks/"]
  - claim_id: 6f58ff496f
    entry: 2026-10-02/cve-2026-104286-fortimail-path-traversal-zero-day-kev
    surface: "body"
    kind: cited
    text: "**Detection:** appliance admin and CLI audit events (a configuration change from the CLI adding an archive account whose destination is a remote host), system-event entries for a cron job running a command that references the /migadmin path, IBE decrypter exceptions for invalid Base64 input, and a file-integrity comparison of the data partition against a known-good image for the added library, the `ld.so.preload` entry and the modified binary and web server configuration; Fortinet's advisory lists the log patterns, and BleepingComputer reproduces the file list it attributes to Fortinet ("
    urls: ["https://www.fortiguard.com/psirt/FG-IR-26-175", "https://www.bleepingcomputer.com/news/security/fortinet-warns-of-critical-fortimail-flaw-exploited-in-zero-day-attacks/"]
