    surface: "body"
    kind: cited
    text: "To judge whether a Manager was already accessed, Cisco directs customers to open a Severity 3 TAC case with the CVE id in the title and to attach the output of `request admin-tech` ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-sdwan-webauth-xr8beuuU"]
