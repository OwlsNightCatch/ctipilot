    entry: 2026-10-03/warlock-longlegs-sharepoint-machinekey-sysvol-ransomware
    surface: "actions[0]"
    kind: frontmatter
    text: "On every on-premises SharePoint Server farm that was reachable from the internet while unpatched, look for unexpected .aspx files in the LAYOUTS template directories of every installed SharePoint version and for domain accounts named like SharePoint setup accounts in local Administrators groups; where a web shell turns up, treat the farm's ASP.NET machine keys as stolen."
