    text: "Senders who still need to share the files must create new transfers, because Belnet cannot recreate them, and Belnet still names no actor ("
    urls: ["https://www.belnet.be/en/news-events/news/security-and-privacy-incident-affecting-belnets-it-infrastructure"]
  - claim_id: 208a8d6402
    entry: 2026-10-02/belnet-supplier-zero-day-mail-copied-65-days
    surface: "record 2026-10-03T04:55:00Z"
    kind: record-summary
    text: "Belnet's notice, updated 2026-10-02, now names the supplier as Fortinet and links Fortinet's advisory FG-IR-26-175, the FortiMail path traversal, without naming the product. The vulnerability was remediated on 2026-09-25, the Centre for Cybersecurity Belgium is assisting, and transfers created in the affected period were disabled on 2026-09-29. Priority moves from routine to notable because the vector class is now known."
