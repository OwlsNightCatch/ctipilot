  - claim_id: c0d0c656a7
    entry: 2026-10-02/cve-2026-104286-fortimail-path-traversal-zero-day-kev
    surface: "body"
    kind: cited
    text: "Affected are FortiMail 8.0.0 through 8.0.1, 7.6.0 through 7.6.6, 7.4.0 through 7.4.8 and 7.2.0 through 7.2.9; the advisory lists 8.0.2, 7.6.7 and 7.4.9 as upcoming fixes and tells 7.2 users to move to branch 7.4 or above, and no fix is listed as of 2026-10-03 ("
    urls: ["https://www.fortiguard.com/psirt/FG-IR-26-175"]
  - claim_id: 334d465f95
    entry: 2026-10-02/cve-2026-104286-fortimail-path-traversal-zero-day-kev
    surface: "body"
    kind: cited
    text: "); BleepingComputer reads the 7.2 row as a patch by upgrading to the 7.4 branch or later, but 7.4.0 through 7.4.8 are themselves affected, so Fortinet's table is followed here ("
    urls: ["https://www.bleepingcomputer.com/news/security/fortinet-warns-of-critical-fortimail-flaw-exploited-in-zero-day-attacks/"]
  - claim_id: 2709259b7b
    entry: 2026-10-02/cve-2026-104286-fortimail-path-traversal-zero-day-kev
    surface: "body"
    kind: cited
    text: "Fortinet lists three workarounds: disable IBE feature support in the GUI or with a CLI command; alternatively disable access to the FortiMail webmail interface from the internet or limit it to a trusted private network; or, where a web application firewall sits in front of FortiMail, block POST requests to /ibe that contain '../' ("
    urls: ["https://www.fortiguard.com/psirt/FG-IR-26-175"]
  - claim_id: 9a335bda39
    entry: 2026-10-02/cve-2026-104286-fortimail-path-traversal-zero-day-kev
    surface: "body"
    kind: cited
    text: "BleepingComputer and NCSC Switzerland word the second workaround as restricting the management interface, which is not Fortinet's wording ("
    urls: ["https://www.bleepingcomputer.com/news/security/fortinet-warns-of-critical-fortimail-flaw-exploited-in-zero-day-attacks/", "https://security-hub.ncsc.admin.ch/#/posts/13027"]
  - claim_id: 207bc7046f
    entry: 2026-10-02/cve-2026-104286-fortimail-path-traversal-zero-day-kev
    surface: "body"
    kind: cited
    text: "Fortinet's compromise section shows what exploitation left behind: a shared library added under the appliance's data partition with an `ld.so.preload` entry, a modified system binary, added service binaries, a modified web server configuration and a modified admin-migration archive; a cron job launched from the migration directory; an admin CLI session that added a mail archive account sending to a remote host; and IBE decrypter exceptions for invalid Base64 input plus failed internal-user logins ("
    urls: ["https://www.fortiguard.com/psirt/FG-IR-26-175"]
  - claim_id: 3c2c995365
    entry: 2026-10-02/cve-2026-104286-fortimail-path-traversal-zero-day-kev
    surface: "body"
    kind: cited
    text: "BleepingComputer lists the added and modified files from Fortinet's table and reads the archive account as a possible path to send archived data to a remote server ("
    urls: ["https://www.bleepingcomputer.com/news/security/fortinet-warns-of-critical-fortimail-flaw-exploited-in-zero-day-attacks/"]
  - claim_id: 9b19254aa1
    entry: 2026-10-02/cve-2026-104286-fortimail-path-traversal-zero-day-kev
    surface: "body"
    kind: cited
    text: "**Exposure:** every FortiMail on the four listed branches; Fortinet's workarounds point to the IBE feature, the webmail interface and the /ibe request path as the reachable surface, so whether IBE is enabled and whether the webmail interface is reachable from the internet is the first check ("
    urls: ["https://www.fortiguard.com/psirt/FG-IR-26-175"]
  - claim_id: cfb30d2240
    entry: 2026-10-02/cve-2026-104286-fortimail-path-traversal-zero-day-kev
    surface: "body"
    kind: cited
    text: "NCSC-NL reads the affected builds as those with IBE enabled, a condition Fortinet's table does not state ("
    urls: ["https://advisories.ncsc.nl/2026/ncsc-2026-0398.html"]
  - claim_id: f247cd78a7
    entry: 2026-10-02/cve-2026-104286-fortimail-path-traversal-zero-day-kev
    surface: "body"
    kind: cited
    text: "**Detection:** appliance admin and CLI audit events (a configuration change from the CLI adding an archive account whose destination is a remote host), system-event entries for a cron job launching from the migration directory, IBE decrypter exceptions for invalid Base64 input, and a file-integrity comparison of the data partition against a known-good image for the added library, the `ld.so.preload` entry and the modified binary and web server configuration; Fortinet's advisory lists the exact artifacts and log patterns ("
    urls: ["https://www.fortiguard.com/psirt/FG-IR-26-175"]
  - claim_id: 53a6190bb9
    entry: 2026-10-02/cve-2026-104286-fortimail-path-traversal-zero-day-kev
    surface: "body"
    kind: cited
    text: "Because Belnet's notice dates the copying of mail from 2026-07-22, the review should reach back to at least that date and should include mail flow copied to destinations outside the organization ("
    urls: ["https://www.belnet.be/en/news-events/news/security-and-privacy-incident-affecting-belnets-it-infrastructure"]
  - claim_id: d0555356ab
    entry: 2026-10-02/cve-2026-104286-fortimail-path-traversal-zero-day-kev
    surface: "body"
    kind: uncited
    text: "Fortinet names no actor, victim count or date of first exploitation; Belnet's account, described below, supplies a date and one victim."
