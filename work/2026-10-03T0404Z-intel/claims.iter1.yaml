  - claim_id: cb64f82590
    entry: 2026-10-03/warlock-longlegs-sharepoint-machinekey-sysvol-ransomware
    surface: "summary"
    kind: frontmatter
    text: "Symantec reports that Longlegs (also known as Storm-2603), the China-nexus developer of Warlock ransomware, attacked at least four organizations in two months, a water utility, a telecommunications provider, a regional government body and a university in Portuguese- and Spanish-speaking countries, and still gets in through on-premises SharePoint Server. In the intrusion Symantec walks through, a web shell harvested the farm's ASP.NET machine keys to forge signed payloads, a security-tool killer ran on at least 40 hosts in about two hours, and Warlock reached at least 33 hosts through SYSVOL replication."
