claims:
  - claim_id: 9d14975ca3
    entry: 2026-10-02/cve-2026-104286-fortimail-path-traversal-zero-day-kev
    surface: "summary"
    kind: frontmatter
    text: "Fortinet's advisory FG-IR-26-175 of 2026-10-01 describes a path traversal in FortiMail that lets an unauthenticated attacker write arbitrary files through crafted HTTP or HTTPS requests, and says it has been reported exploited in the wild; CISA listed it in KEV the same day. Belnet, the Belgian government and research network, says a zero-day in its supplier Fortinet's technology let attackers copy its inbound mail from 2026-07-22 and links this advisory, which puts exploitation about ten weeks before the disclosure. FortiMail 7.4, 7.6 and 8.0 have no fixed build as of 2026-10-03 (8.0.2, 7.6.7 and 7.4.9 are listed as upcoming) and 7.2 users are told to move to 7.4 or above, so the vendor workarounds are the only control."
  - claim_id: 8a1769646d
    entry: 2026-10-02/cve-2026-104286-fortimail-path-traversal-zero-day-kev
    surface: "immediate_action"
    kind: frontmatter
    text: "Apply Fortinet's workaround to every FortiMail now: no fixed build exists for 7.4, 7.6 or 8.0: Fortinet reports in-the-wild exploitation of an unauthenticated file-write flaw in FortiMail and has not yet shipped a fixed build for 7.4, 7.6 or 8.0. Today, disable IBE support with the vendor's CLI command, or cut the FortiMail webmail interface off from the internet, or block POST requests to /ibe that contain '../' at a web application firewall in front of FortiMail; then check every appliance that was reachable against the compromise artifacts in advisory FG-IR-26-175, looking back to at least 2026-07-22."
  - claim_id: 7e021dff59
    entry: 2026-10-02/cve-2026-104286-fortimail-path-traversal-zero-day-kev
    surface: "actions[0]"
    kind: frontmatter
    text: "On every FortiMail on 7.2, 7.4, 7.6 or 8.0, disable IBE support (config system encryption ibe, set status disable) or, as Fortinet's alternatives, cut the webmail interface off from the internet or block POST requests to /ibe containing '../' at a web application firewall in front of it; no fixed build exists for 7.4, 7.6 or 8.0, and 7.2 must move to 7.4 or above once a fixed 7.4 build ships."
  - claim_id: b2d7c6f4bd
    entry: 2026-10-02/cve-2026-104286-fortimail-path-traversal-zero-day-kev
    surface: "actions[1]"
    kind: frontmatter
    text: "Check every FortiMail that was internet-reachable before the workaround against the file, cron and CLI-audit artifacts published in FG-IR-26-175 and by NCSC Switzerland, looking back to at least 2026-07-22, including a mail archive account that sends to a remote host and mail copied to destinations outside the organization."
