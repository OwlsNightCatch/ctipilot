    text: "**Detection:** in web and application access logs on the Manager, Cisco names two sources: `serviceproxy-access.log` (under `/var/log/nms/containers/service-proxy/`) for POSTs to the login path with an encoded character from unknown or unauthorized addresses, and `vmanage-server.log` for lines about that path tied to usernames starting `viptela-reserved-` ("
