  - claim_id: 9c957ca0ef
    entry: 2026-10-02/belnet-supplier-zero-day-mail-copied-65-days
    surface: "headline"
    kind: frontmatter
    text: "A national research and government network had its mail copied for 65 days through a zero-day in Fortinet technology"
  - claim_id: bfa6cabb4d
    entry: 2026-10-02/belnet-supplier-zero-day-mail-copied-65-days
    surface: "summary"
    kind: frontmatter
    text: "Belnet, the Belgian research and education network that also serves the Belgian government, says an attacker used a zero-day in technology from its supplier Fortinet to copy all incoming mail to Belnet-owned domains between 2026-07-22 and 2026-09-25, plus every download link its FileSender and FedSender transfer services generated and sent directly. Belnet links Fortinet's advisory FG-IR-26-175, the FortiMail path traversal, without naming the product; the actor is not named."
  - claim_id: 50a62ba0d9
    entry: 2026-10-02/belnet-supplier-zero-day-mail-copied-65-days
    surface: "body"
    kind: cited
    text: "Belnet identified the incident on 2026-09-24 and says an attacker exploited a zero-day in technology from its external supplier Fortinet; the vulnerability was remediated on 2026-09-25 at 08:10 ("
    urls: ["https://www.belnet.be/en/news-events/news/security-and-privacy-incident-affecting-belnets-it-infrastructure"]
  - claim_id: 848ee3faed
    entry: 2026-10-02/belnet-supplier-zero-day-mail-copied-65-days
    surface: "body"
    kind: cited
    text: "Belnet says Fortinet has published technical information about the vulnerability, including the CVE, and links Fortinet's advisory FG-IR-26-175 without naming the product ("
    urls: ["https://www.belnet.be/en/news-events/news/security-and-privacy-incident-affecting-belnets-it-infrastructure"]
  - claim_id: 891634d9f5
    entry: 2026-10-02/belnet-supplier-zero-day-mail-copied-65-days
    surface: "body"
    kind: cited
    text: "); that advisory covers a FortiMail path traversal that Fortinet reports exploited in the wild ("
    urls: ["https://www.fortiguard.com/psirt/FG-IR-26-175"]
  - claim_id: 35c83cc020
    entry: 2026-10-02/belnet-supplier-zero-day-mail-copied-65-days
    surface: "body"
    kind: cited
    text: "Between 2026-07-22 and the morning of 2026-09-25, a window of 65 days, the attackers copied to external infrastructure all incoming mail to Belnet-owned domains (for example guest-roaming and BNIX addresses) and every download link its FileSender and FedSender services generated and sent directly, which could let them fetch the transferred files; password-protected or authenticated transfers are described as unreadable unless the password was written in the upload comment, and Risky Bulletin adds that mail sent to one of its customers was also stolen ("
    urls: ["https://www.belnet.be/en/news-events/news/security-and-privacy-incident-affecting-belnets-it-infrastructure", "https://news.risky.biz/risky-bulletin-sanctions-force-cas-to-revoke-tls-certs-in-iran-russia/"]
  - claim_id: 177aef8b56
    entry: 2026-10-02/belnet-supplier-zero-day-mail-copied-65-days
    surface: "body"
    kind: cited
    text: "**Exposure:** organizations that sent mail to Belnet-owned addresses or shared files through Belnet's FileSender or FedSender between 2026-07-22 and 2026-09-25, and any organization whose own mail gateway runs a FortiMail build listed in FG-IR-26-175, where the same flaw would let an attacker write files and, as Belnet's loss shows, copy mail in bulk ("
    urls: ["https://www.belnet.be/en/news-events/news/security-and-privacy-incident-affecting-belnets-it-infrastructure", "https://www.fortiguard.com/psirt/FG-IR-26-175"]
  - claim_id: 7f9146e45d
    entry: 2026-10-02/belnet-supplier-zero-day-mail-copied-65-days
    surface: "body"
    kind: cited
    text: "**Detection:** Belnet publishes no technique or indicator itself and does not name the product; Fortinet's advisory FG-IR-26-175 lists the compromise artifacts and log patterns for FortiMail, and the 65-day window shows the retention needed, since scoping an incident like this one takes mail-flow and transfer-link logs reaching back at least that far ("
    urls: ["https://www.fortiguard.com/psirt/FG-IR-26-175"]
  - claim_id: 43184820aa
    entry: 2026-10-02/belnet-supplier-zero-day-mail-copied-65-days
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** this is a Belgian incident, relevant here as the shared-service supplier-zero-day pattern, in which one exploited flaw in a mail or transfer service run for many public-sector customers exposes all of them at once; treat download links and unprotected attachments exchanged with Belnet in the window as exposed, and check every FortiMail gateway you run against Fortinet's advisory with a look-back to at least 2026-07-22."
  - claim_id: 99608ab5c0
    entry: 2026-10-02/belnet-supplier-zero-day-mail-copied-65-days
    surface: "section 2026-10-03T04:55:00Z"
    kind: cited
    text: "Belnet's incident notice, updated on 2026-10-02 at 11:00, now names the external supplier as Fortinet and links Fortinet's advisory FG-IR-26-175 ("
    urls: ["https://www.belnet.be/en/news-events/news/security-and-privacy-incident-affecting-belnets-it-infrastructure"]
  - claim_id: 4fc2b440bd
    entry: 2026-10-02/belnet-supplier-zero-day-mail-copied-65-days
    surface: "section 2026-10-03T04:55:00Z"
    kind: cited
    text: "Belnet also says it engaged the Centre for Cybersecurity Belgium for incident response and forensics, and that on 2026-09-29 it removed download links that were still active and disabled transfers created during the affected period, which generated notifications to senders and recipients ("
    urls: ["https://www.belnet.be/en/news-events/news/security-and-privacy-incident-affecting-belnets-it-infrastructure"]
  - claim_id: 97fc273ee8
    entry: 2026-10-02/belnet-supplier-zero-day-mail-copied-65-days
    surface: "section 2026-10-03T04:55:00Z"
    kind: cited
    text: "Senders who still need to share the files must create new transfers, because Belnet cannot recreate them, and Belnet still names no actor ("
    urls: ["https://www.belnet.be/en/news-events/news/security-and-privacy-incident-affecting-belnets-it-infrastructure"]
  - claim_id: 68d5a137c9
    entry: 2026-10-02/belnet-supplier-zero-day-mail-copied-65-days
    surface: "record 2026-10-03T04:55:00Z"
    kind: record-summary
    text: "Belnet's notice, updated 2026-10-02, now names the supplier as Fortinet and links Fortinet's advisory FG-IR-26-175, says the Centre for Cybersecurity Belgium is assisting, and says transfers created in the affected period were disabled on 2026-09-29, so senders who still need to share the files must create new transfers."
