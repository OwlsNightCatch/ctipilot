    urls: ["https://security-hub.ncsc.admin.ch/#/posts/13027"]
  - claim_id: 9b19254aa1
    entry: 2026-10-02/cve-2026-104286-fortimail-path-traversal-zero-day-kev
    surface: "body"
    kind: cited
    text: "**Exposure:** every FortiMail on the four listed branches; Fortinet's workarounds point to the IBE feature, the webmail interface and the /ibe request path as the reachable surface, so whether IBE is enabled and whether the webmail interface is reachable from the internet is the first check ("
    urls: ["https://www.fortiguard.com/psirt/FG-IR-26-175"]
  - claim_id: d7ac765be5
    entry: 2026-10-02/cve-2026-104286-fortimail-path-traversal-zero-day-kev
    surface: "body"
    kind: cited
    text: "NCSC-NL reads the affected builds as those with IBE enabled, a condition Fortinet's table does not state, and says Fortinet released security updates, which contradicts Fortinet's table listing the fixes as upcoming; Fortinet's table is followed here ("
    urls: ["https://advisories.ncsc.nl/2026/ncsc-2026-0398.html"]
  - claim_id: 6f58ff496f
    entry: 2026-10-02/cve-2026-104286-fortimail-path-traversal-zero-day-kev
    surface: "body"
    kind: cited
    text: "**Detection:** appliance admin and CLI audit events (a configuration change from the CLI adding an archive account whose destination is a remote host), system-event entries for a cron job running a command that references the /migadmin path, IBE decrypter exceptions for invalid Base64 input, and a file-integrity comparison of the data partition against a known-good image for the added library, the `ld.so.preload` entry and the modified binary and web server configuration; Fortinet's advisory lists the log patterns, and BleepingComputer reproduces the file list it attributes to Fortinet ("
    urls: ["https://www.fortiguard.com/psirt/FG-IR-26-175", "https://www.bleepingcomputer.com/news/security/fortinet-warns-of-critical-fortimail-flaw-exploited-in-zero-day-attacks/"]
