  - claim_id: 4d062176c5
    entry: 2026-10-02/cve-2026-76504-cisco-catalyst-sd-wan-manager-auth-bypass-kev
    surface: "summary"
    kind: frontmatter
    text: "Cisco's advisory of 2026-09-30 fixes CVE-2026-76504, an unauthenticated authentication bypass in the API of Cisco Catalyst SD-WAN Manager (formerly vManage) that gives an attacker the privileges of the admin user, regardless of configuration. Cisco says it became aware of exploitation in September 2026 and CISA added the flaw to its KEV catalog the same day; Cisco lists no workaround but added a Live Protect shield on 2026-10-02 that it calls temporary, partial protection, and NCSC Switzerland published its own advisory."
  - claim_id: a4a6c3c6fc
    entry: 2026-10-02/cve-2026-76504-cisco-catalyst-sd-wan-manager-auth-bypass-kev
    surface: "immediate_action"
    kind: frontmatter
    text: "Patch or take offline every internet-reachable Catalyst SD-WAN Manager now: Cisco confirms in-the-wild exploitation of an unauthenticated admin-level API bypass in Catalyst SD-WAN Manager and offers no workaround. Upgrade to the first fixed release of the train (20.9.10.1, 20.12.8.2, 20.15.6.1, 20.18.4.1, 26.1.2.1 or 26.2.1), restrict the Manager's web and API access to known trusted hosts behind a firewall in the meantime (Cisco's Live Protect shield adds only temporary, partial protection and may block legitimate logins that use URI encoding), and open a Severity 3 TAC case with the CVE id in the title for any Manager whose logs show the encoded login-path pattern."
  - claim_id: 115d34a617
    entry: 2026-10-02/cve-2026-76504-cisco-catalyst-sd-wan-manager-auth-bypass-kev
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade every Catalyst SD-WAN Manager to the first fixed release of its train (20.9.10.1, 20.12.8.2, 20.15.6.1, 20.18.4.1, 26.1.2.1 or 26.2.1; anything earlier than 20.9 must migrate) and, until the upgrade is done, restrict the Manager's web and API access to known trusted hosts behind a firewall; Cisco's Live Protect shield for this CVE adds only temporary, partial protection and may block legitimate logins that use URI encoding."
