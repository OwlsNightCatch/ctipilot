      First-party list with the project's own impact rating (low / moderate / important / critical), fixed-in version, report date and finder per CVE; reads cleanly with extract (verified 2026-10-03, 2.4.69 / 20 CVEs). The project's
      rating is the discriminator against EUVD/CISA-ADP CVSS 9.8 scores for the same CVEs. Ubiquitous in public-sector web estates. Fetch method: extract.

coverage_gaps:
  - source_id: ssd-disclosure
    reason: "No transport reads the host: direct GETs on /advisories/ and /feed/ return HTTP 202 (SiteGround captcha, empty body), WebFetch returns an empty body, WebSearch site: and allowed_domains queries return only old advisories. Recipe unchanged (fetch_method blocked); no reader call spent. Zero in-window visibility on this source again."
  - source_id: fortinet-psirt
    reason: "RECIPE FIX: `feed https://filestore.fortinet.com/fortiguard/rss/ir.xml 20` fell back to the jina reader and returned items WITHOUT dates. Working command that returns the full XML with pubDate per item: `python3 tools/fetch_source.py url --direct https://filestore.fortinet.com/fortiguard/rss/ir.xml` (50 items; FG-IR-26-175 = Thu 01 Oct 2026, FG-IR-26-164..174 = Tue 08 Sep 2026). Use it, then `extract https://fortiguard.fortinet.com/psirt/FG-IR-26-NNN`."
  - source_id: enisa-euvd
    reason: "RECIPE FIX: `enisa-euvd recent` is a 4-item spot check; the EUVD service supports a real sweep: `python3 tools/fetch_source.py url --direct \"https://euvdservices.enisa.europa.eu/api/search?fromDate=2026-10-01&toDate=2026-10-03&fromScore=8.5&toScore=10&page=0&size=100\"` returned {items,total:198} with description, score, aliases (CVE), vendor/product, references, assigner, epss, exploitedSince (verified 2026-10-03; page=1 gives the rest). Suggested as the S1 in-window sweep; every item carries the CVE id for the store-wide dedup."
  - source_id: yeswehack
    reason: "RECIPE FIX: https://www.yeswehack.com/feed is a working direct RSS with pubDate (8 items, newest 2026-10-01); record still says webfetch with rss_url null. Set rss_url and fetch_method rss."
  - source_id: censys-blog
    reason: "RECIPE FIX: `feed https://censys.com/feed/ 8` works on the direct transport (method direct, dated items, newest 2026-09-24); the record is pinned webfetch with the 2026-08-05 'blocked on every transport' note in recipe_note. Candidate for rss_url + fetch_method rss. Advisory pages (https://censys.com/advisory/<slug>/) read with extract."
  - source_id: flatt-security
    reason: "`feed https://flatt.tech/research/index.xml` falls to jina and returns undated items; the listing HTML read by extract carries the date in a badge per post (newest: 'Jun 1, 26'); no in-lookback post. Use the HTML listing for dates."
  - source_id: joomla-security-centre
    reason: "Feed pubDate for the 16 core advisories is 2026-09-25 14:00 but the advisories went live about an hour after the 2026-09-29 release (mySites.guru); feed dates are creation dates, not publication dates. Note when applying lookback."
  - source_id: morphisec
    reason: "extract of the listing drops titles; titles are in the raw HTML (`url --direct`). Content was marketing only (30 Sep 'Aligning AI speed with AI trust', 23 Sep MTD, 16 Sep polymorphic malware): nothing relevant."
  - source_id: csirt.divd.nl (not a slice record; divd-csirt exists in sources.json)
    reason: "extract on csirt.divd.nl/DIVD-2026-00015 and /CVE-2026-102490 fell through to jina (trafilatura-direct failed); WebFetch/ jina read them. Note for the divd-csirt record."

