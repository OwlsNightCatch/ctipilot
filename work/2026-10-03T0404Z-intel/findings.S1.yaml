  - title: "FortiMail CVE-2026-104286: Fortinet's own workaround names the webmail interface and a WAF rule on POST /ibe, not the management interface; fixed builds still 'upcoming'"
    novelty: "update-of:2026-10-02/cve-2026-104286-fortimail-path-traversal-zero-day-kev"
    suggested_update_type: correction
    suggested_fields: [summary, actions, immediate_action, evidence, sources, body]
    sources:
      - { url: "https://fortiguard.fortinet.com/psirt/FG-IR-26-175", publisher: "Fortinet PSIRT (FG-IR-26-175, initial publication 2026-10-01, no revision)", date: "2026-10-01", role: "primary" }
      - { url: "https://advisories.ncsc.nl/2026/ncsc-2026-0398.html", publisher: "NCSC-NL", date: "2026-10-02", role: "corroborating" }
      - { url: "https://www.helpnetsecurity.com/2026/10/02/fortinet-fortimail-vulnerability-cve-2026-104286/", publisher: "Help Net Security", date: "2026-10-02", role: "corroborating" }
    discovery_trace: >
      first seen at: S1 duty-1 re-fetch of the covered entry's primary, URL https://fortiguard.fortinet.com/psirt/FG-IR-26-175 (extract, fetched 2026-10-03T04:07Z;
      timeline still "2026-10-01: Initial publication", fix column still "upcoming") -> pivot: NCSC-NL RSS item NCSC-2026-0398 via bridge ncsc-nl recent 15
      (https://advisories.ncsc.nl/rss/advisories) -> NCSC-NL detail page https://advisories.ncsc.nl/2026/ncsc-2026-0398.html -> Help Net Security,
      URL https://www.helpnetsecurity.com/2026/10/02/fortinet-fortimail-vulnerability-cve-2026-104286/ (carries the "management interface" wording)
    summary: |
      Comparing the covered entry with Fortinet's advisory page fetched this run shows the entry paraphrases one of Fortinet's workarounds wrongly
      (the same 'management interface' wording appears in Help Net Security, SecurityWeek and The Hacker News, all fetched this run). Fortinet lists three alternatives: disable IBE feature support; or
      "Disable access to the FortiMail webmail interface from the internet or limit the access only from trusted private network"; or,
      with a WAF in front of FortiMail, "block POST requests to /ibe that contain '../'". The entry's headline action and immediate_action
      say to take the "management interface" off the internet, and its third workaround (WAF rule on POST /ibe) is missing. An operator who
      follows the entry literally and restricts only the administrative interface leaves the webmail-side path to /ibe untouched; Fortinet
      does not say the management interface is the reachable surface. NCSC-NL adds a scoping statement the entry lacks: it reads the
      affected builds (7.2.0-7.2.9, 7.4.0-7.4.8, 7.6.0-7.6.6, 8.0.0-8.0.1) as affected "waarbij de functionaliteit IBE (Identity Based
      Encryption) is aangezet" (with the IBE function enabled); Fortinet's table does not state that precondition, so treat it as NCSC-NL's
      reading. NCSC-NL's advisory title says "kwetsbaarheid verholpen" and its text says Fortinet released security updates, which
      contradicts Fortinet's own table ("Upgrade to upcoming 8.0.2 / 7.6.7 / 7.4.9"): Fortinet is authoritative, no fixed FortiMail build
      is documented as of 2026-10-03T04:07Z, and the 7.2 branch still has no fix in place ("Upgrade to branch 7.4 or above", itself
      affected below 7.4.9). Everything else in the entry is unchanged: exploited-in-the-wild statement, CVSS 9.8, KEV 2026-10-01
      (due 2026-10-04), Fortinet "Virtual Patch: No", discovered internally by Fortinet Product Security.
    region_nexus: "global; FortiMail is common email-security-gateway infrastructure in European public-sector mail chains; NCSC-CH advisory 13027 already cited"
    primary_sector_nexus: "direct (mail gateways at administrations)"
    sector: "public-sector"
    cves: [CVE-2026-104286]
    techniques: [T1190]
    affected_products: ["Fortinet FortiMail"]
    entity_keys: ["product:fortinet-fortimail"]
    new_entities: []
    verification: SINGLE-SOURCE-VENDOR-PRIMARY
    confidence: HIGH
    classification_hint: "A2"
    evidence:
      - quote: "Disable access to the FortiMail webmail interface from the internet or limit the access only from trusted private network"
        attribution: "Fortinet PSIRT"
        source_url: "https://fortiguard.fortinet.com/psirt/FG-IR-26-175"
      - quote: "block POST requests to /ibe that contain '../'"
        attribution: "Fortinet PSIRT"
        source_url: "https://fortiguard.fortinet.com/psirt/FG-IR-26-175"
      - quote: "Upgrade to upcoming 8.0.2 or above"
        attribution: "Fortinet PSIRT"
        source_url: "https://fortiguard.fortinet.com/psirt/FG-IR-26-175"
      - quote: "This has been reported to be exploited in the wild, customers are urged to apply the workaround below."
        attribution: "Fortinet PSIRT"
        source_url: "https://fortiguard.fortinet.com/psirt/FG-IR-26-175"
      - quote: "waarbij de functionaliteit IBE (Identity Based Encryption) is aangezet"
        attribution: "NCSC-NL"
        source_url: "https://advisories.ncsc.nl/2026/ncsc-2026-0398.html"
      - quote: "administrators can block internet access to the management interface or restrict it to a trusted private network"
        attribution: "Help Net Security"
        source_url: "https://www.helpnetsecurity.com/2026/10/02/fortinet-fortimail-vulnerability-cve-2026-104286/"
    extended_notes: |
      Suggested edit set for the changelog record (type correction, no re-float): (1) immediate_action and actions[0]: replace "remove internet access to the
      management interface" with Fortinet's wording (webmail interface) and add the WAF alternative (block POST requests to /ibe containing '../'); (2) Exposure:
      add NCSC-NL's IBE-enabled reading as NCSC-NL's, not Fortinet's; (3) add NCSC-NL's "fixed" wording as a contradicted statement only if the entry wants to
      surface it. The Help Net Security wording ("management interface") is a likely origin of the drift; SecurityWeek and The Hacker News use the same words (BleepingComputer, which the entry cites,
      was not re-read this run), so a reader cross-checking against press will see the entry "confirmed" by secondary sources: cite Fortinet for the workaround text.
      Exposure check that follows from Fortinet's text: is the webmail interface reachable from the internet, is IBE enabled (config system encryption ibe).

