  - title: "OrdaSoft OS CCK for Joomla CVE-2026-102427: unauthenticated PHP upload (CVSS 10.0), fixed in 8.3.16 but the vendor update server still offers 8.3.14"
    novelty: new
    lookback: true
    sources:
      - { url: "https://mysites.guru/blog/ordasoft-os-cck-sql-injection/", publisher: "mySites.guru (Phil E Taylor)", date: "2026-09-30", role: "primary" }
    discovery_trace: >
      first seen at: mysites-guru, URL https://mysites.guru/rss.xml (feed, fetched 2026-10-03T04:08Z; item "OS CCK 8.3.16 for Joomla Fixes a No-Login PHP Upload and an SQL Injection, but the Updater Still Offers 8.3.14", 2026-09-30,
      inside the record's 121 h lookback) -> primary: https://mysites.guru/blog/ordasoft-os-cck-sql-injection/ (extract). CVE record (Joomla CNA, published 2026-09-30T15:14Z, finder Ala Arfaoui, CVSS 4.0 10.0, CISA ADP SSVC
      "Exploitation: none / Automatable: yes / Technical Impact: total") read through https://cveawg.mitre.org/api/cve/CVE-2026-102427 (not citable as a source URL; named in the sourcing note instead)
    summary: |
      OrdaSoft's OS CCK (com_os_cck) Joomla content-construction-kit extension up to 8.3.15 exposes site/uploader.php through the component's normal front-end routing
      (task=getContent) with no authentication or ACL check. The handler runs a magic-byte MIME check but its extension allow-list was commented out and the saved
      file keeps the attacker-supplied extension, so an image/PHP polyglot saved as .php under the web root is executed (CWE-434, unauthenticated remote code execution).
      The Joomla CNA scores it CVSS 4.0 10.0. Fixed in 8.3.16 (extension allow-list jpg/jpeg/png/gif/webp restored); mySites.guru, which read the 8.3.16 package, also reports a
      separate no-login SQL injection in the listing sort-order fixed in the same release with no CVE. mySites.guru says OrdaSoft's own update server still advertises 8.3.14,
      so no affected site is offered 8.3.16 and it must be installed by hand. No exploitation is reported (mySites.guru: "There is no public report of exploitation yet"; CISA
      ADP SSVC: exploitation none, automatable yes); not in CISA KEV. The Joomla CNA's own CVSS vector carries E:A (attacked) but mySites.guru notes that is the CNA's default
      on every record it publishes, so it is not an exploitation signal. Hunt concept: front-end requests with task=getContent to the component followed by a new .php file
      under images/com_os_cck<n>/original/ and a later request to it (web-server access logs; file-integrity check of that directory for script files).
      Prior-art calibration: the store covers three exploited unauthenticated Joomla extension upload/auth-bypass flaws (Balbooa Forms 2026-07-09, Gridbox 2026-07-26, SP Page
      Builder 2026-08-02) and one unexploited unauthenticated Joomla extension RCE kept at notable (Aimy Captcha 2026-08-01, justified by that wave).
    region_nexus: "global; Joomla is common on Swiss communal and regional sites (joomla-security-centre record note), but OS CCK is a niche listings/directory extension and no Swiss deployment is evidenced"
    primary_sector_nexus: "indirect"
    sector: "public-sector"
    cves: [CVE-2026-102427]
    techniques: [T1190, T1505.003]
    affected_products: ["OrdaSoft OS CCK (com_os_cck) for Joomla"]
    entity_keys: ["product:joomla"]
    new_entities:
      - { key: "product:ordasoft-os-cck-for-joomla", type: product, name: "OrdaSoft OS CCK (com_os_cck) for Joomla", aliases: ["OrdaSoft Joomla CCK", "com_os_cck"], summary: "OrdaSoft's Joomla content-construction-kit extension; versions up to 8.3.15 carry an unauthenticated PHP upload (CVE-2026-102427, fixed in 8.3.16) per the Joomla CNA record and mySites.guru (2026-09-30)." }
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    classification_hint: "B2"
    evidence:
      - quote: "any visitor could upload a file to a site running OS CCK below 8.3.16 and have the server run it as PHP"
        attribution: "mySites.guru"
        source_url: "https://mysites.guru/blog/ordasoft-os-cck-sql-injection/"
      - quote: "There is no public report of exploitation yet."
        attribution: "mySites.guru"
        source_url: "https://mysites.guru/blog/ordasoft-os-cck-sql-injection/"
      - quote: "still tells Joomla that the current version is the older, vulnerable 8.3.14, so no affected site is offered 8.3.16"
        attribution: "mySites.guru"
        source_url: "https://mysites.guru/blog/ordasoft-os-cck-sql-injection/"
    borderline: true
    borderline_reason: >
      Pre-auth, trivially automatable, CVSS 10.0, details effectively public and the updater will not deliver the fix (mechanics-driven manual install), but no exploitation, no KEV, niche
      extension with no Swiss deployment evidenced, and the standing vulnerability bar asks for exploited / imminent mass exploitation / mechanics-forced timeline. Recommendation:
      drop unless the main agent wants the Joomla-extension wave covered; if kept, notable priority and a short entry (precedent: Aimy Captcha, 2026-08-01).
    extended_notes: |
      Same mySites.guru stream, below the bar and not returned: JCTables unauthenticated SQLi (CVE-2026-76570, fixed 1.21.1 on 2026-08, CVE on 2026-09-30), three OrdaSoft extensions with
      unauthenticated SQLi in sort order (2026-09-28), Quix Page Builder 6.3.4 guest access and editor code execution (no CVEs), Phoca Cart 6.1.9 download IDOR, SP Page Builder Joomla 3 patch 1.0.3
      (captcha bypass CVE-2026-79701 extended to Joomla 3, medium), Joomla core 5.4.9/6.1.4 (16 CVEs, 2026-09-29; two High both need a backend login; none exploited).

