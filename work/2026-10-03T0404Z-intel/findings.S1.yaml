  - title: "Cisco Catalyst SD-WAN Manager CVE-2026-76504: Cisco advisory revision 1.1 (2026-10-02) adds a Live Protect shield as a temporary, partial control"
    novelty: "update-of:2026-10-02/cve-2026-76504-cisco-catalyst-sd-wan-manager-auth-bypass-kev"
    suggested_update_type: update
    suggested_fields: [summary, actions, immediate_action, sources, evidence, body]
    sources:
      - { url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-sdwan-webauth-xr8beuuU", publisher: "Cisco PSIRT", date: "2026-10-02", role: "primary" }
      - { url: "https://www.cisco.com/c/en/us/td/docs/routers/sdwan/26x-later/network-monitoring/network-monitoring-guide/live-protect-for-cisco-catalyst-sd-wan.html", publisher: "Cisco (Catalyst SD-WAN Network Monitoring Guide, Live Protect)", date: "2026-10-03", role: "corroborating" }
    discovery_trace: >
      first seen at: S1 duty-1 re-fetch of the covered entry's primary, URL
      https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-sdwan-webauth-xr8beuuU (extract, fetched 2026-10-03T04:09Z; revision table row "1.1 ... 2026-OCT-02")
      -> pivot: Cisco Live Protect feature page, URL
      https://www.cisco.com/c/en/us/td/docs/routers/sdwan/26x-later/network-monitoring/network-monitoring-guide/live-protect-for-cisco-catalyst-sd-wan.html
    summary: |
      Cisco revised its advisory for CVE-2026-76504 to version 1.1 on 2026-OCT-02 ("Added information about Live Protect
      shield availability"). The covered entry (written from the 2026-09-30 version 1.0) says Cisco lists no workaround and
      stops at "restrict access and upgrade". Cisco now states it has released a Live Protect shield for this CVE "to provide
      temporary security coverage to allow time for software upgrade planning", that the shield "offers only temporary partial
      protection", and that "the only way to remediate this vulnerability is to upgrade to the first fixed software release".
      Documented side effect: with the shield applied, a legitimate user with URI encoding might not be able to log in to the
      Manager. Cisco's Live Protect page lists the feature from Catalyst SD-WAN Control Components release 20.18.3 and describes
      two shield modes (monitoring: visibility into exploit attempts without enforcement; protecting/enforce: applies the
      mitigation policy), applied without a reload. The "no workaround" statement still stands: Cisco keeps "There are no
      workarounds that address this vulnerability" and the network-restriction mitigation for on-prem deployments is unchanged.
      Nothing else moved: exploitation status (Cisco PSIRT aware of active exploitation in September 2026), KEV listing (added
      2026-09-30), the per-train fixed releases (20.9.10.1, 20.12.8.2, 20.15.6.1, 20.18.4.1, 26.1.2.1, 26.2.1; Cisco-managed cloud
      20.15.605) and CVSS 9.8 are identical to the entry. Detection concept is unchanged (serviceproxy-access.log and
      vmanage-server.log entries for j_security_check from unknown sources, viptela-reserved- usernames).
    region_nexus: "global; Catalyst SD-WAN Manager is internet-reachable management plane at public-sector WAN operators incl. Switzerland (NCSC-CH advisory already cited by the entry)"
    primary_sector_nexus: "indirect"
    sector: "public-sector"
    cves: [CVE-2026-76504]
    techniques: [T1190]
    affected_products: ["Cisco Catalyst SD-WAN Manager"]
    entity_keys: ["product:cisco-catalyst-sd-wan-manager"]
    new_entities: []
    verification: SINGLE-SOURCE-VENDOR-PRIMARY
    confidence: HIGH
    classification_hint: "A2"
    evidence:
      - quote: "Cisco has released a Live Protect shield for CVE-2026-76504 to provide temporary security coverage"
        attribution: "Cisco PSIRT"
        source_url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-sdwan-webauth-xr8beuuU"
      - quote: "This shield offers only temporary partial protection."
        attribution: "Cisco PSIRT"
        source_url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-sdwan-webauth-xr8beuuU"
      - quote: "A legitimate user with URI encoding might not be able to login to SDWAN Manager."
        attribution: "Cisco PSIRT"
        source_url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-sdwan-webauth-xr8beuuU"
      - quote: "Added information about Live Protect shield availability."
        attribution: "Cisco PSIRT"
        source_url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-sdwan-webauth-xr8beuuU"
      - quote: "Cisco Catalyst SD-WAN Control Components Release 20.18.3"
        attribution: "Cisco"
        source_url: "https://www.cisco.com/c/en/us/td/docs/routers/sdwan/26x-later/network-monitoring/network-monitoring-guide/live-protect-for-cisco-catalyst-sd-wan.html"
    extended_notes: |
      Suggested action delta (keep to the do-now bar): where a Manager cannot be upgraded today, the vendor-documented interim layer is
      the Live Protect shield (feature present from Control Components 20.18.3), run in enforce mode only after weighing the stated login
      side effect, on top of (not instead of) restricting Manager access to trusted hosts; it does not replace the upgrade and does not
      evict an attacker already inside. The entry's headline "no workaround" is still accurate for workarounds; the shield is a separate
      vendor control, so the headline needs no change. I could not read the shield's release/version prerequisites for pre-20.18.3 trains
      (the Live Protect page extract was a feature-history stub), so do not assert shield availability on older trains.

