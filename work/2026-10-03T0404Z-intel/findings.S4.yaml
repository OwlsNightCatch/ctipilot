items:
  - title: "Warlock operator Longlegs (Storm-2603) breaches a water utility, a telecom operator, a regional government body and a university through on-premises SharePoint, then delivers ransomware to 33+ hosts via SYSVOL"
    sources:
      - { url: "https://www.security.com/threat-intelligence/warlock-ransomware-critical-infrastructure", publisher: "Symantec Threat Hunter Team / Carbon Black", date: "2026-10-01", role: "primary" }
      - { url: "https://therecord.media/warlock-ransomware-used-in-critical-infrastructure-attacks", publisher: "The Record", date: "2026-10-02", role: "corroborating" }
      - { url: "https://www.securityweek.com/warlock-expands-sharepoint-exploitation-in-critical-infrastructure-attacks/", publisher: "SecurityWeek", date: "2026-10-02", role: "corroborating" }
      - { url: "https://www.bleepingcomputer.com/news/security/warlock-ransomware-breach-sharepoint-in-water-telecom-operator-attacks/", publisher: "BleepingComputer", date: "2026-10-02", role: "corroborating" }
    discovery_trace: "first seen at: bleepingcomputer, URL https://www.bleepingcomputer.com/news/security/ (listing, WebFetch 2026-10-03) -> pivot: BleepingComputer article URL https://www.bleepingcomputer.com/news/security/warlock-ransomware-breach-sharepoint-in-water-telecom-operator-attacks/ -> primary: Symantec/Carbon Black, URL https://www.security.com/threat-intelligence/warlock-ransomware-critical-infrastructure (also seen via The Record feed https://therecord.media/feed and SecurityWeek feed https://www.securityweek.com/feed/)"
    summary: |
      Symantec's Threat Hunter Team (with Carbon Black) reports that the actor it calls Longlegs, which it links to Microsoft's
      Storm-2603 and the Warlock ransomware, attacked at least four organisations in the past two months in Portuguese- and
      Spanish-speaking countries across Europe, Africa and Latin America: a water utility, a telecommunications provider, a
      regional government body and a university (no victim is named). Initial access in the intrusion Symantec walks through
      was most likely exploitation of on-premises SharePoint Server (the 2025 "ToolShell" chain CVE-2025-49704, CVE-2025-49706,
      CVE-2025-53770, CVE-2025-53771, plus newer 2026 SharePoint flaws that CISA flagged in July 2026). The attacker dropped a web
      shell into the SharePoint LAYOUTS directory (written for several SharePoint versions at once), harvested the farm's
      ASP.NET machine keys and used them to forge a validly signed payload that gives code execution inside the application
      pool; it then side-loaded DLLs, pulled follow-on installers from legitimate cloud file-sharing and storage services,
      enumerated domain trusts, added a masquerading account to the local Administrators group on several hosts, installed
      VS Code Insiders as a tunnel service for covert remote access and ran NetExec for AD enumeration and credential spraying.
      An AV/EDR killer was pushed to at least 40 hosts in about two hours (in other recent attacks the group used the signed,
      vulnerable K7RKScan driver, CVE-2025-1055), then Warlock was staged in the domain SYSVOL scripts share and reached at
      least 33 hosts through ordinary DFS replication. Timeline in that intrusion: web shell 2026-07-22, ransomware 2026-07-31.
      Symantec assesses the Portuguese/Spanish-language focus is either opportunistic (exposed, unpatched SharePoint) or more
      deliberate tasking. The attribution to Longlegs/Storm-2603 and its earlier-cluster links (CL-CRI-1040, CamoFei, ChamelGang)
      are Symantec's assessments; The Record notes Microsoft could not tie Warlock to another tracked Chinese group in 2025.
      The Record's own coverage recalls the August 2026 Swiss federal (BIT/FOITT) and Graubuenden SharePoint breaches; no source
      links Longlegs/Warlock to those.
    region_nexus: "Europe (Portuguese/Spanish-speaking countries) and global; same technology class (on-premises SharePoint) as the Swiss federal BIT/FOITT and canton Graubuenden breaches already in the store (no actor link stated by any source)"
    primary_sector_nexus: "direct (a regional government body is among the four victims; SharePoint is common in Swiss federal/cantonal estates)"
    sector: "public-sector, utilities, telecom, education"
    cves: [CVE-2025-49704, CVE-2025-49706, CVE-2025-53770, CVE-2025-53771, CVE-2025-1055]
    techniques: [T1190, T1505.003, T1574.001, T1685, T1219.001, T1570, T1486, T1482, T1110.003]
    affected_products: ["Microsoft SharePoint Server (on-premises)", "K7RKScan driver (vendor not named in the fetched sources)"]
    entity_keys: ["actor:warlock-storm-2603"]
    new_entities:
