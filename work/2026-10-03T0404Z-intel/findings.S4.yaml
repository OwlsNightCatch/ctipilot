  - title: "Metabase wave reaches Japanese suppliers: VOISING's final report blames an unpatched BI tool, and ApplyNow's recruitment-platform breach exposes candidate data of at least eight municipalities"
    sources:
      - { url: "https://piyolog.hatenadiary.jp/entry/2026/10/02/174228", publisher: "Piyolog (Piyokango)", date: "2026-10-02", role: "primary" }
      - { url: "https://piyolog.hatenadiary.jp/entry/2026/10/01/112213", publisher: "Piyolog (Piyokango)", date: "2026-10-01", role: "corroborating" }
      - { url: "https://voising-official.com/news/1015", publisher: "VOISING (fourth report)", date: "2026-09-30", role: "primary" }
      - { url: "https://www.city.tokorozawa.saitama.jp/tokoronews/press/r8/9gatu/kojinjyohou.html", publisher: "Tokorozawa City", date: "2026-09-19", role: "primary" }
    discovery_trace: "first seen at: piyolog, URL https://piyolog.hatenadiary.jp/ (listing, WebFetch 2026-10-03) -> pivot: Piyolog posts https://piyolog.hatenadiary.jp/entry/2026/10/02/174228 and https://piyolog.hatenadiary.jp/entry/2026/10/01/112213 -> primaries: VOISING https://voising-official.com/news/1015 and Tokorozawa City https://www.city.tokorozawa.saitama.jp/tokoronews/press/r8/9gatu/kojinjyohou.html (ApplyNow's own notice at https://applynow.co.jp/news/20260909 is a JS shell and was not readable; Piyolog summarises it)"
    summary: |
      Two Japanese supplier breaches extend the Metabase CVE-2026-72898 downstream-victim picture the store already tracks. VOISING's fourth
      report (2026-09-30) names the cause as exploitation of a vulnerability in a BI tool before the fix was applied: about 170,000 customer
      records, intrusion from 2026-08-10, data downloaded on 2026-08-16 over roughly 90 minutes, the BI tool stopped on 2026-08-17, attacker-created
      accounts and API keys revoked and the compromised environment discarded. VOISING does not name the tool; Piyolog assesses it was probably
      Metabase (the host ran v0.63.1.2, older than fix v0.63.5; timing follows Metabase's 2026-08-06 disclosure; account/API-key creation and bulk
      table download match Metabase's own account of the attacks). ApplyNow, a recruitment-video and e-contract platform, said on 2026-09-09 that
      a third party exploited a vulnerability in a data-analysis tool it uses, with access from 2026-08-09 to 2026-09-07; it does not name the tool and no source ties it to
      Metabase beyond timing. At least eight municipalities (Fuji, Osaka, Shimada, Iruma, Ichinomiya, Kashihara, Tokorozawa, Fukuyama, per Piyolog's compilation of their
      notices) disclosed that candidates for staff-recruitment exams were in the scope; Tokorozawa confirmed 1,701 records (name, email, phone) on 2026-09-16.
      Ichinomiya and Shimada said the data should have been deleted at contract end, and Piyolog reports a restaurant-group customer found the supplier's real retention practice differed from its terms.
    region_nexus: "Japan; transferable pattern for Swiss communal and cantonal HR/recruitment SaaS buyers (supplier-held applicant data, retention after contract end, supplier BI tools exposed to the internet)"
    primary_sector_nexus: "indirect (municipal recruitment data held by a supplier)"
    sector: "public-sector, HR SaaS"
    cves: [CVE-2026-72898]
    techniques: [T1190, T1199]
    affected_products: ["Metabase"]
    entity_keys: ["incident:metabase-sqli-zeroday-2026-08", "product:metabase"]
    new_entities:
      - { key: "incident:voising-bi-tool-breach-2026-08", type: incident, name: "VOISING BI-tool breach (August 2026)", aliases: [],
          summary: "Japanese consumer-service operator VOISING disclosed on 2026-08-18 that a BI-tool vulnerability exploited before patching exposed about 170,000 customer records; final report 2026-09-30; Piyolog assesses probable Metabase CVE-2026-72898 (VOISING, Piyolog, 2026-09-30/10-01)." }
      - { key: "incident:applynow-bi-tool-breach-2026-09", type: incident, name: "ApplyNow recruitment-platform breach (August-September 2026)", aliases: ["Interview Cloud breach"],
          summary: "ApplyNow disclosed on 2026-09-09 unauthorised access (2026-08-09 to 2026-09-07) through a vulnerability in a data-analysis tool it uses; at least eight Japanese municipalities and several restaurant groups disclosed candidate data in scope (ApplyNow, municipal notices, Piyolog, 2026-09-09..10-02)." }
    relation_suggestions:
      - { subject: "incident:voising-bi-tool-breach-2026-08", object: "incident:metabase-sqli-zeroday-2026-08",
          basis: "Piyolog assesses it is 'probably' the Metabase CVE-2026-72898 exploitation; VOISING does not name the tool (Piyolog, 2026-10-01) - an overlap assessment, not an attribution" }
    verification: MULTI-SOURCE
    sourcing_note: "Victim primaries (VOISING, Tokorozawa City) plus Piyolog's compilation. The Metabase identification for VOISING is Piyolog's inference; for ApplyNow it is not made by anyone (timing only) and must stay hedged."
