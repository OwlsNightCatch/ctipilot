      - quote: "この脆弱性が悪用された可能性が高いとpiyokangoは推測"
        attribution: "Piyolog (Piyokango)"
        source_url: "https://piyolog.hatenadiary.jp/entry/2026/10/01/112213"
      - quote: "同社が利用しているデータ分析ツールの脆弱性を突いた第三者による不正アクセスが発生し"
        attribution: "Piyolog (Piyokango), summarising ApplyNow's 2026-09-09 notice"
        source_url: "https://piyolog.hatenadiary.jp/entry/2026/10/02/174228"
