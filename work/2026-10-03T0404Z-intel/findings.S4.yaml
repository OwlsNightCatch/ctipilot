  - title: "ANSSI's REACTIV report also records Metabase compromises of ANSSI's own innovation lab and DINUM's ProConnect and Nuage-Public, plus Metabase-linked claims against two platforms used by territorial authorities"
    sources:
      - { url: "https://www.cert.ssi.gouv.fr/uploads/CERTFR-2026-CTI-006.pdf", publisher: "ANSSI / CERT-FR (CERTFR-2026-CTI-006)", date: "2026-09-30", role: "primary" }
      - { url: "https://www.it-connect.fr/anssi-dinum-fuite-donnees-metabase/", publisher: "IT-Connect", date: "2026-10-01", role: "corroborating" }
    discovery_trace: "first seen at: it-connect (not in this slice), URL https://www.it-connect.fr/feed/ (feed fetch 2026-10-03, item 'Faille Metabase : l'ANSSI et la DINUM victimes d'une fuite de données') -> pivot: IT-Connect article https://www.it-connect.fr/anssi-dinum-fuite-donnees-metabase/ -> primary: ANSSI REACTIV PDF https://www.cert.ssi.gouv.fr/uploads/CERTFR-2026-CTI-006.pdf (image-only PDF; downloaded and read page by page, pages 6-8; the stdlib pdf extractor returns binary noise for it)"
    summary: |
      The store's 2026-10-02 REACTIV entry carries the six recurring causes and the Tchap, SNU and TRACFIN cases but not the following incident summaries
      in the same ANSSI report (pages 6-8, read directly). ANSSI's own innovation laboratory had 118 Metabase user accounts compromised (about thirty external)
      through a Metabase vulnerability (usage statistics, identifiers, emails, hashed passwords; instances updated, all passwords renewed, accounts unused for
      three months disabled). DINUM had two Metabase instances, ProConnect and Nuage-Public, compromised (administrative data of public bodies, open-source
      contribution metadata, anonymised connection histories, which ANSSI says are already public; attacker-created accounts deleted, secrets reset). Two
      platforms used by territorial authorities are tied to Metabase only as a claim or first indication: Docurba (a ministry-run platform used by
      territorial authorities, departmental directorates and ministries; claim of 2026-08-25, compromise may date back months, a Metabase instance
      vulnerability is the working hypothesis) and Zero Logement Vacant (claim of 2026-08-28, entry point reportedly a compromised Metabase instance, service cut). Qualicharge is stated as a Metabase
      exploitation (102,000 charging sessions and about a hundred technical accounts exfiltrated). The report also describes a non-Metabase shared-mailbox
      case: over 300 Bureau Numerique accounts compromised on 2026-08-25 with the mutualised mailbox and shared file space exfiltrated, MFA now enforced,
      and a DGDDI case where three agent mailboxes were linked to an agent-supplier exchange server that was then removed. The figures are provisional by the report's own statement.
    region_nexus: "France (state services); transferable to Swiss communal/cantonal estates running Metabase or platforms shared with municipalities"
    primary_sector_nexus: "direct (public-sector)"
    sector: "public-sector"
    cves: [CVE-2026-72898]
    techniques: [T1190, T1199]
    affected_products: ["Metabase"]
    entity_keys: ["report:anssi-reactiv-situation-report-2026-09", "incident:metabase-sqli-zeroday-2026-08", "product:metabase"]
    new_entities: []
    verification: SINGLE-SOURCE-NATIONAL-CERT
