  - title: "DragonForce: Lab52 documents a second, persistent backdoor with an MQTT fallback beside the Teams TURN-relay C2, and Seqrite walks the ransomware payload (ARP-cache SMB discovery, WMIC shadow-copy deletion, 16 encryption workers)"
    sources:
      - { url: "https://lab52.io/blog/backdoors-in-the-dungeon-turn-mqtt-abused-by-dragonforce/", publisher: "Lab52", date: "2026-10-01", role: "primary" }
      - { url: "https://www.seqrite.com/blog/inside-dragonforce-how-a-ransomware-cartels-payload-actually-runs/", publisher: "Seqrite Labs", date: "2026-10-01", role: "primary" }
    discovery_trace: "first seen at: seqrite-labs slice record, feed https://www.seqrite.com/blog/feed/ (2026-10-01 'Inside DragonForce: How a Ransomware Cartel's Payload Actually Runs') → primary (extract): https://www.seqrite.com/blog/inside-dragonforce-how-a-ransomware-cartels-payload-actually-runs/ ; Lab52 found in the discovery pass of research feeds, URL https://lab52.io/blog/feed/ (2026-10-01) → primary (extract): https://lab52.io/blog/backdoors-in-the-dungeon-turn-mqtt-abused-by-dragonforce/ ; WebSearch ('DragonForce ransomware Lab52 MQTT TURN backdoor') returned only the June Symantec/BleepingComputer/Hexnode coverage already in the store."
    published_date: "2026-10-01"
    lookback: true
    novelty: "update-of:2026-06-17/dragonforce-abuses-microsoft-teams-turn-relays-for-c2-and-ch"
    summary: |
      Two independent labs published DragonForce analyses on 2026-10-01. Lab52 (attribution via artifact overlap with earlier
      reporting; no victim named) describes two backdoors that abuse legitimate Microsoft Teams TURN servers to encapsulate
      implant-to-C2 traffic. The first is the type Symantec reported in June (a Go implant injected into memory that
      resolves its C2 address by in-memory decryption; already in the store as Backdoor.Turn). The second, new to the store,
      is built to stay resident: a scheduled task left by an earlier stage runs the legitimate javaw.exe, which side-loads a
      first-stage jli.dll that differs in hash on every host and loads a next stage encrypted with DPAPI, so the file only
      works on the machine it was written on. Its C2 runs over the TURN relay with a custom framed request/response
      protocol (task polling, block-wise download with per-block MD5 checks, retransmission and acknowledgement) and falls
      back to an MQTT broker when TURN fails: per-implant topics, Base64 plus an XOR key derived from 8 bytes of leading
      material, and a JSON task carrying a command number from 1 to 4 that selects a shellcode template (supplied URL and
      identifier; a PowerShell command line; the payload as is; a remote host and port) executed via VirtualProtect and
      CreateThread. If every channel fails the beacon sleeps five minutes and encrypts its own memory region. Lab52 says
      the first type is seen in the initial-deployment phase and the second is expected to remain on disk. Seqrite's
      separate payload analysis (Windows sample, traced from entry point): ChaCha20-encrypted embedded configuration, an
      encrypted runtime log written to the world-writable Public profile, a configurable list of 38 process names (security,
      backup, database, productivity) that background workers keep terminating, WMI query of Win32_ShadowCopy followed by
      WMIC shadow-copy deletion, Restart Manager use for locked files, and network discovery that reads the local IPv4 ARP
      cache and filters it against embedded prefixes before enumerating SMB shares with NetShareEnum (it does not scan the
      subnet), so no port-scan precedes the share access. Sixteen workers in two batches of eight encrypt local drives
      and network shares from separate queues; each file gets a fresh ChaCha20 key wrapped with an embedded RSA-4096
      public key, files with any of 200+ database/virtualisation extensions are encrypted in 20% chunks, a ransom note
      identifies 'The DragonForce Ransomware Cartel', and the encrypted-file icon and wallpaper are written through the
      Public profile and registry. Seqrite stresses the trace showed no data upload, so the note's claim of stolen data is
      a claim, not observed behaviour.
    region_nexus: "global; the store already holds a Swiss DragonForce leak-site claim (2026-07-14, Geneva adult-education body)"
    primary_sector_nexus: "indirect (RaaS actor with a Swiss claim in the store; relevant to cantonal and communal estates)"
    sector: "cross-sector ransomware"
    cves: []
    techniques: [T1574.001, T1053.005, T1090, T1071, T1027.013, T1055, T1486, T1490, T1135, T1018, T1685]
    affected_products: ["Microsoft Teams (TURN relay infrastructure abused)", "Java runtime (javaw.exe used as side-loading host)"]
    entity_keys: ["actor:dragonforce", "campaign:dragonforce-backdoor-turn-teams-relay-byovd"]
    new_entities: []
    verification: MULTI-SOURCE
    verification_note: "The TURN-relay C2 type is corroborated by the stored Symantec-based entry; the MQTT-fallback backdoor rests on Lab52 alone, and the payload walk-through rests on Seqrite alone."
    confidence: MEDIUM
    classification_suggestion: { reliability: B, credibility: 2 }
    evidence:
      - quote: "The second backdoor is used for persistence, as it is executed through a scheduled task left behind by a previous stage."
        attribution: "Lab52"
        source_url: "https://lab52.io/blog/backdoors-in-the-dungeon-turn-mqtt-abused-by-dragonforce/"
      - quote: "the second type is notable for its use of MQTT as an additional communication channel in the event that communication through TURN fails."
        attribution: "Lab52"
        source_url: "https://lab52.io/blog/backdoors-in-the-dungeon-turn-mqtt-abused-by-dragonforce/"
      - quote: "For network discovery, DragonForce reads the existing IPv4 ARP cache through GetIpNetTable() and filters candidate addresses against embedded prefixes."
        attribution: "Seqrite Labs"
        source_url: "https://www.seqrite.com/blog/inside-dragonforce-how-a-ransomware-cartels-payload-actually-runs/"
      - quote: "The analyzed execution did not show a data-upload operation or a separate exfiltration channel."
        attribution: "Seqrite Labs"
        source_url: "https://www.seqrite.com/blog/inside-dragonforce-how-a-ransomware-cartels-payload-actually-runs/"
    extended_notes: |
      Detection telemetry classes: image-load events for a legitimate runtime executable (javaw.exe) loading a DLL named
      like a Java library from outside the Java install directory; scheduled-task creation whose action launches a
      signed Java binary from a user-writable path; DPAPI-bound files that exist next to the side-loading pair;
      outbound traffic to TURN (UDP/TCP 3478-style relay ports) or to MQTT brokers from non-collaboration processes; for the
      payload, WMI Win32_ShadowCopy enumeration followed by WMIC 'shadowcopy ... delete', IP-ARP-table reads (GetIpNetTable)
      followed by NetShareEnum against many hosts with no preceding scan, a single process opening C$ and other shares
      on a dozen-plus hosts, and creation of an icon/wallpaper in the Public profile plus a per-extension DefaultIcon
      registry association. Triage: Java and Teams traffic are common; the discriminator is the TURN/MQTT use by a
      process that is neither Teams nor a Java application, and a javaw.exe whose loaded jli.dll sits outside the JRE.
      Hardening: block or inspect outbound TURN/MQTT where not needed, enforce DLL-load restrictions for signed
      runtime binaries copied outside their install folders, and restrict admin-share access between workstations.
      The attribution of the two backdoors to DragonForce rests on Lab52's artifact-overlap reasoning; Symantec's earlier
      report (stored entry) is the stronger link for the first type.
    borderline: false

