  - title: "tac_plus (TACACS+ daemon): pre-authentication format string in send_authen_error() gives root RCE on the network-device AAA server; fixed only in Shrubbery F4.0.4.32, the Facebook fork never will be, CVE pending"
    sources:
      - { url: "https://www.elttam.com/blog/att-cking-tacacs-to-pwn-your-network-via-a-pre-auth-rce", publisher: "elttam (Matt Jones)", date: "2026-09-23", role: "primary" }
      - { url: "https://github.com/elttam/publications/blob/master/writeups/elttam-tac_plus_rce_fmtstring_advisory.txt", publisher: "elttam security advisory (CVE pending)", date: "2026-09-23", role: "primary" }
    discovery_trace: "first seen at: elttam-blog slice record, URL https://www.elttam.com/blog (extract returned only the /resources page with one article; the real index was read with `url`) → RSS https://www.elttam.com/blog/rss.xml (feed subcommand, 15 dated items, newest 2026-09-23) → primary: https://www.elttam.com/blog/att-cking-tacacs-to-pwn-your-network-via-a-pre-auth-rce (extract) → advisory https://github.com/elttam/publications/blob/master/writeups/elttam-tac_plus_rce_fmtstring_advisory.txt (extract). WebSearch (tac_plus format string F4.0.4.32) found no independent coverage."
    published_date: "2026-09-23"
    summary: |
      elttam (finder; published 2026-09-23 after months of disclosure attempts and two deferrals past its 90-day deadline) reports a remote, pre-authentication format-string
      vulnerability (CWE-134, CVE pending; elttam asked MITRE for the identifier) in tac_plus, the open-source TACACS+ daemon
      many networks use to authenticate and authorise administrators on routers, switches, firewalls and console servers.
      The attacker-controlled "port" field of an AUTHEN/START request is copied without validation into session.port;
      send_authen_error() in packet.c then passes a message embedding it to report() as the format string, so %x leaks
      process memory into the daemon log and %n writes memory (blind; no read-back channel). The error path is reached with
      two packets, a well-formed AUTHEN/START carrying the payload and a deliberately malformed continuation. Affected per
      elttam: Cisco's original TACACS+ developer kit code, every Shrubbery tac_plus release up to and including F4.0.4.31
      (February 2026; a second sink in get_authen_continue() is present in the Shrubbery tree), and the Facebook fork
      F4.0.4.28-7fb (send_authen_error() sink; repository archived 2025-08-22, so no fix is coming); any other
      Cisco-derived fork carrying the same report()/send_authen_error() code should be assumed affected. Shrubbery published
      F4.0.4.32 on 2026-09-21 (elttam's account; its CHANGES line reads "Remote pre-authentication format string
      vulnerability (CWE-134)"). Cisco PSIRT told elttam no Cisco product uses these forks. Distribution status per elttam:
      the FreeBSD port net/tac_plus4 and pkgsrc entries net/tacacs-shrubbery and net/tacacs are the actively packaged
      copies; Debian dropped its package in 2019; and because Shrubbery shipped nothing between 2015 and 2026 many
      installations carry distribution patches, so version strings alone are not a reliable test. Prerequisite and
      impact: the daemon runs as root by default (privileges drop only with -U or -Q) and forks a child per connection
      without exec, so the address layout is stable across attempts; elttam demonstrated code execution on a build with
      ASLR and NX disabled and believes a hardened build is achievable. The TACACS+ shared secret is the only gate on
      delivering a chosen payload (elttam scores CVSS 9.8 where no or a weak secret is in effect, 8.1 where the secret is
      long and random), and elttam shows the secret is not much of a gate: the error reply to a truncated AUTHEN/START
      is predictable plaintext returned before the peer proves any key knowledge, giving an offline key-verification
      oracle from a single connection that resolves a wordlist-grade secret in seconds. A second, untested-on-vendor-gear
      route is a legitimate device that truncates or wraps an over-long username, so a payload arrives correctly keyed from
      a login form. elttam's recounting of prior attacks (Salt Typhoon capture of TACACS+ shared secrets per Talos and
      CISA AA25-239A; Sygnia's August 2026 Fire Ant TacTap toolset hooking accept/accept4 inside tac_plus) is context, not
      part of this bug.
    region_nexus: "global; TACACS+ is standard in enterprise, telco and critical-infrastructure management networks, including government networks"
    primary_sector_nexus: "indirect (management-plane AAA server; applies to any Swiss administration running tac_plus or an appliance derived from it)"
    sector: "public-sector; telecommunications; critical infrastructure"
    cves: []
    cve_pending: true
    techniques: [T1190, T1210, T1110.002]
    affected_products: ["Shrubbery Networks tac_plus", "Facebook tac_plus fork (archived)", "FreeBSD net/tac_plus4", "pkgsrc net/tacacs-shrubbery", "pkgsrc net/tacacs"]
    entity_keys: []
    new_entities:
      - { key: "product:tac-plus", type: product, name: "tac_plus (TACACS+ daemon)", aliases: ["Shrubbery tac_plus", "TACACS+ daemon", "Facebook tac_plus"], summary: "Open-source TACACS+ AAA daemon descended from Cisco's early-1990s developer kit; maintained by Shrubbery Networks (releases F4.0.4.x) and forked by Facebook (archived 2025-08-22); elttam disclosed a pre-authentication format-string RCE in send_authen_error() on 2026-09-23, fixed in Shrubbery F4.0.4.32 (elttam, 2026-09-23)." }
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    classification_suggestion: { reliability: B, credibility: 2 }
    novelty: new
    evidence:
      - quote: "On a large number of those networks the daemon answering is `tac_plus`, a piece of C descended from reference code Cisco published in the early nineties and abandoned long ago."
        attribution: "elttam"
        source_url: "https://www.elttam.com/blog/att-cking-tacacs-to-pwn-your-network-via-a-pre-auth-rce"
      - quote: "Shrubbery fixed it in F4.0.4.32, published on 21 September, and the Facebook fork is archived, so it will not be fixed at all."
        attribution: "elttam"
        source_url: "https://www.elttam.com/blog/att-cking-tacacs-to-pwn-your-network-via-a-pre-auth-rce"
      - quote: "a server that answers a truncated AUTHEN/START with `<client ip> : Invalid AUTHEN/START packet (too short)` is running something descended from this code."
        attribution: "elttam"
        source_url: "https://www.elttam.com/blog/att-cking-tacacs-to-pwn-your-network-via-a-pre-auth-rce"
      - quote: "If you run `tac_plus`, upgrade to F4.0.4.32, or apply the change above to your own build if your packages have not caught up"
        attribution: "elttam"
        source_url: "https://www.elttam.com/blog/att-cking-tacacs-to-pwn-your-network-via-a-pre-auth-rce"
    extended_notes: |
      Exposure: inventory every TACACS+ server (TCP/49) and ask appliance vendors whether their TACACS+ server derives from
      Cisco's developer kit / Shrubbery / the Facebook fork. elttam's fingerprint for derived code is the error text
      "<client ip> : Invalid AUTHEN/START packet (too short)" in reply to a truncated AUTHEN/START.
      Detection telemetry classes: TACACS+ server logs (error-path lines carrying raw '%' conversion specifiers or
      memory-like hex runs in the logged port/peer text), network flow logs for TCP/49 from sources that are not
      registered NAS/management addresses, repeated truncated-AUTHEN/START plus malformed-CONTINUE pairs (also the
      shared-secret oracle), daemon child crashes, and unexpected child processes of the daemon. Treat a compromised AAA
      server as exposing every device credential and command it has authorised.
      Hardening (elttam): upgrade to F4.0.4.32 or change both report() call sites to pass the message as an argument, not
      as the format; restrict TCP/49 to NAS management addresses; use a long random unique shared secret; run with -U/-Q
      so the daemon does not stay root; plan migration to RFC 9887 (TACACS+ over TLS 1.3); build with -Wformat-security.
      Recency note: published 2026-09-23, so older than every window and the elttam-blog lookback (168 h); returned because
      no store entry, CVE record or feed carries it and the source was added as a candidate precisely for such
      pre-CVE disclosures. The patched-version claim rests on elttam; Shrubbery's own page and CHANGES file read from
      this container did not show F4.0.4.32.
    borderline: true
    borderline_reason: "Published 2026-09-23 (10 days before this run, beyond the elttam-blog 168 h lookback); never covered in the store and no CVE exists yet, so no KEV/EUVD-driven coverage will surface it. Actionability is high (pre-auth, root by default, management-plane AAA). Main agent decides on the recency gate."

