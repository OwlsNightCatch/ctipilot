        attribution: "Symantec / Carbon Black Threat Hunter Team"
        source_url: "https://www.security.com/threat-intelligence/warlock-ransomware-critical-infrastructure"
      - quote: "The webshell's function is to harvest the SharePoint farm's ASP.NET machine keys, which the attackers then use to forge a validly signed payload that achieves remote code execution inside the SharePoint application pool."
        attribution: "Symantec / Carbon Black Threat Hunter Team"
        source_url: "https://www.security.com/threat-intelligence/warlock-ransomware-critical-infrastructure"
      - quote: "In one intrusion against a critical infrastructure operator, the attackers pushed a tool designed to disable security software to at least 40 hosts within about two hours, then deployed Warlock on at least 33 hosts by staging it in the domain's SYSVOL share, where ordinary domain replication delivered it to machines."
        attribution: "Symantec / Carbon Black Threat Hunter Team"
        source_url: "https://www.security.com/threat-intelligence/warlock-ransomware-critical-infrastructure"
      - quote: "These vulnerabilities affect all supported on-premises SharePoint Server versions (Subscription Edition, 2019, and 2016)."
        attribution: "CISA (text as returned by WebFetch summariser; page not readable by extract from this container)"
        source_url: "https://www.cisa.gov/news-events/alerts/2026/07/14/cisa-urges-sharepoint-hardening-after-new-exploitations"
    extended_notes: |
      Exposure: any on-premises SharePoint Server reachable from the internet or from a partner network; the ASP.NET machine
      key is the lasting asset, so patching alone does not evict an actor who already harvested it. Post-patch compromise
      check: look in the LAYOUTS template directories of every SharePoint hive version for new .aspx files written by
      PowerShell or the worker process, rotate the farm's machine keys (CISA links Microsoft's ViewState key-management and
      AMSI-integration guidance), and review local Administrators membership for setup-lookalike domain accounts.
      Detection telemetry classes: process creation (SharePoint worker process spawning PowerShell/cmd; PowerShell
      [Reflection.Assembly]::Load of System.Workflow.ComponentModel; msiexec with a URL argument on a server);
      file creation under SharePoint template\layouts; outbound DNS/HTTP from the SharePoint server to out-of-band
      testing services; group-membership change events adding a domain account to local Administrators on multiple hosts;
      service creation by code-insiders.exe (tunnel service install) on servers; file writes into SYSVOL scripts paths and
      dfsrs.exe as the parent of executables on endpoints; one-line net use/copy/start patterns fanned out to dozens of
      hosts; driver-load events for known-vulnerable signed drivers.
      Hardening: do not expose SharePoint directly, enable AMSI integration, restrict write ACLs on SYSVOL scripts,
      enforce a vulnerable-driver blocklist, and alert on developer tunnel services on server tiers.
      Triage: a VS Code tunnel on a developer workstation is normal; on a SharePoint/AD server or installed as a service
      from C:\Windows\debug it is not.
