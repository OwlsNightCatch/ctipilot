      Huntress SOC reports that from 2026-09-10 a threat actor compromised multiple tenants on one shared recreation-management
      software platform across three web servers using one repeatable path: register a member account, upload a file
      through the application's member-document upload feature into a web-served directory, and request it as a webshell.
      The first server saw about six hours of noisy unauthenticated attempts first (login brute force, IIS 8.3 tilde
      enumeration, WebDAV verbs, upload-handler parser bypasses, forced browsing), possibly AI-assisted; the registered
      account then worked where those failed. Fourteen uploaded files (eight .aspx plus .jpg and .pdf extension-execution tests; only the .aspx ran) gave reconnaissance
      through the IIS worker process (whoami, hosts file, netstat, appcmd list sites/vdirs, PowerShell WebAdministration),
      extraction of the server-wide IIS configuration, string searches of web.config and source files for connection
      strings, API/transaction keys and the ASP.NET machineKey, SQL access with the harvested credentials, and a hunt for
      cardholder data including a payment-gateway webhook log directory. On the third server the actor first renamed
      copies of its shells to look like site assets and timestomped them to the web.config's times, then, after the
      server was put back into production before it was fully locked down, returned through the same registered account
      and re-uploaded shells and scripts, this time appending an obfuscated loader to a jQuery file loaded by the
      authentication page so that visitors' browsers would pull a second-stage script and open encrypted WebRTC/WebSocket
      channels to attacker infrastructure on a serverless edge platform for live credential harvesting. Huntress sees AI-generated
      scripts (comment text that reads like prompt instructions) and infers, from a zh-CN locale string in the PowerShell
      user agent, that the actor is most likely China-based; that is an inference from one header, not attribution.
      Huntress does not name the platform vendor or a CVE; the flaw is the combination of open self-registration and an
      upload function that lets a member place executable content in a web-served directory.
    region_nexus: "US municipalities (platform tenants); transferable to shared multi-tenant municipal e-service and payment portals"
    primary_sector_nexus: "direct-by-analogy (municipal government service platform; payment data at risk)"
    sector: "public-sector (municipal); payment data"
