    discovery_trace: "first seen at: infosec-magazine slice record, URL https://www.infosecurity-magazine.com/rss/news/ (feed; headline 'Microsoft Warns NeedyMantis Malware Enables Persistent Network Access', 2026-09-29) → Microsoft Security Blog feed https://www.microsoft.com/en-us/security/blog/feed/ (2026-09-28 item) → primary (extract): https://www.microsoft.com/en-us/security/blog/2026/09/28/needymantis-unpacking-a-post-compromise-malware-family-used-in-targeted-operations/ → WebSearch ('NeedyMantis Storm-3069 DAEMON Tools Microsoft malware framework') → SecurityWeek https://www.securityweek.com/daemon-tools-hackers-needymantis-malware-dissected-by-microsoft/ (extract)"
    published_date: "2026-09-28"
    lookback: true
    summary: |
      Microsoft Threat Intelligence describes NeedyMantis, a modular post-compromise malware family seen since at least
      October 2025 in a limited number of targeted operations against telecommunications organisations, universities,
      medical nonprofits, intergovernmental organisations and government contractors. Microsoft found it by pivoting from
      indicators in Kaspersky's DAEMON Tools supply-chain investigation (store entry 2026-05-09). Microsoft names Storm-3069
      (its designator for the DAEMON Tools compromise activity) as at least one operator, says other activity suggests more
      than one operator, and says the activity so far aligns with threat actors operating from China while it has not
      attributed Storm-3069 to a Chinese nation-state actor and has not determined whether all activity is one operator.
      NeedyMantis is deployed after access exists, so the initial vector varies; Microsoft has not seen the malware itself
      delivered via a supply-chain compromise. Mechanics: a first-stage loader DLL is dropped beside legitimate software
      and loaded by DLL side-loading, then extracts the second stage from a custom encrypted archive that sits next to it
      and is named like the DLL without an extension. Microsoft saw the loader masquerading as the WinSparkle update
      component of Poedit, a curl library, Vim and TightVNC components, and Office, Broadcom, Intel and NVIDIA component names,
      in look-alike folders under ProgramData and Program Files. The archive's format (XOR plus RtlDecompressBuffer, per-sample
      offsets and keys) bundles legitimate tool components (7-Zip, Sysinternals) with a second-stage loader that is x64
      shellcode in a file with a .ps1 extension, a configuration file and a WebSockets communications DLL with spoofed
      Windows library names, and shellcode that loads further module DLLs; loaders use obfuscated stack strings and
      anti-debugger checks. C2 starts as an HTTPS GET whose Set-Cookie header carries compressed, Base64-encoded host and
      user information, then upgrades to WebSockets with a hard-coded old Firefox user agent and a binary protocol with
      an RC4 key exchange; the main component mutex is named after the user and the host process. Commands exist to load,
      unload and dispatch data to modules, but the modules' capabilities are unconfirmed. In one intrusion the operator
      used Impacket during hands-on-keyboard activity to copy the legitimate software, the malicious DLL and the archive
      from a network share and run them on a target host. Microsoft publishes Defender detections, Advanced Hunting and
      Sentinel queries and IOCs (omitted here).
    region_nexus: "global; DAEMON Tools victims per SecurityWeek were in Belarus, Russia and Thailand; intergovernmental-organisation and telecom targeting is relevant to Geneva-area and Swiss telecom/public bodies"
    primary_sector_nexus: "indirect (intergovernmental organisations, government contractors, universities, telecoms)"
    sector: "telecommunications; education; government contractors; intergovernmental organisations"
