    summary: |
      Proofpoint's first public report on TA419, a China-aligned, espionage-motivated actor it has seen running regular
      targeted credential phishing since at least April 2025 against US- and Japan-based think tanks, defence contractors,
      universities and law firms (focus: defence, national security, energy, international relations, foreign policy).
      From 2026-07-08 TA419 impersonated a former White House OSTP deputy director and then a prominent economist to
      reach AI-policy experts; in February 2026 it impersonated a senior employee of an AI company. The opening mail is
      benign (an invitation to join a fictitious "AI Policy Advisory Committee" or to contribute to a Senate foreign-relations
      report on AI export controls) and builds rapport; only after the target replies does a shortened link follow. The
      chain: URL shortener, then a first-hop domain that shows a fake OneDrive loading screen behind a Cloudflare Turnstile
      check as a filter, then a second domain serving an adversary-in-the-middle phish of Microsoft 365 / Entra ID through
      the first-party OfficeHome application, built on the open-source Frameless BitB kit (a Browser-in-the-Browser overlay
      plus an Evilginx phishlet for Microsoft 365). Proofpoint describes TA419's own telemetry/automation script that tracks
      the victim's position in the sign-in flow, ticks "Keep me signed in" to lengthen the stolen session and submits
      one-time codes as soon as they validate; because the proxy relays the real sign-in, password, MFA code and
      conditional-access checks all pass and the actor takes the session cookies. Infrastructure sits behind Cloudflare,
      domains are file-sharing/cloud themed and registered with NameSilo, some sender domains impersonate named
      organisations (a Japan-Taiwan exchange body, a US think tank, a Japanese defence minister's website), and some
      first-hop mail headers expose likely actor-controlled VPS sharing a self-signed certificate; other mail went
      through residential proxies. Proofpoint assesses (likely) that the targeting supports Chinese intelligence collection
      on US AI policy and expects continued expert impersonation; it recommends phishing-resistant, origin-bound
      authentication such as passkeys and out-of-band verification of unsolicited subject-matter outreach.
