  - title: "Sysdig on the Zammad zero-day breach of DIVD: behavioural hunts that fire without knowing the CVEs (service-account shell, setuid-to-root, spraying and sweeps)"
    sources:
      - { url: "https://www.sysdig.com/blog/ai-agent-exploits-zammad-zero-days-in-divd-breach-what-we-know-and-how-to-detect-it", publisher: "Sysdig (Marcel Claassen)", date: "2026-10-02", role: "primary" }
    discovery_trace: "first seen at: sysdig slice record, feed https://www.sysdig.com/blog/rss.xml (item dated Fri, 02 Oct 2026, link host webflow.sysdig.com) → primary (extract): https://www.sysdig.com/blog/ai-agent-exploits-zammad-zero-days-in-divd-breach-what-we-know-and-how-to-detect-it ; the incident itself is already in the store as 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach (NCSC-NL, DIVD)."
    published_date: "2026-10-02"
    lookback: true
    novelty: "update-of:2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach"
    summary: |
      Sysdig's analysis of the DIVD breach (it states its facts come from DIVD's case files and that the investigation is
      ongoing) adds hunt detail to the stored Zammad entry. Stage by stage it ties telemetry to behaviour: the Zammad
      application process (Rails, Puma and workers) should not spawn an interactive shell, download tools or open
      outbound connections to new hosts, and a session used from a new source address shortly after login, or requests
      that skip the expected login flow, indicate the session-hijack stage; a service account changing its effective user
      ID to root (setuid-family calls, new root-owned children under the application tree, writes to privileged paths) is
      the high-fidelity signal for the local escalation, and Sysdig lists the open-source Falco rules it says cover it;
      after root the agent ran password spraying and a man-in-the-middle attack (the spraying disrupted its own
      interception; targets unknown), so hunt for mass reads of configuration and credential files, bursts of failed
      authentications across many accounts from one source, and find/grep sweeps outside the baseline; exfiltration shows
      as outbound connections from the helpdesk segment to never-seen destinations, large uploads and new tooling in
      temporary directories. Sysdig repeats DIVD's confirmed and suspected data scope (volunteers' email addresses
      confirmed exfiltrated; the CSIRT ticketing system partially extracted; Jira, Confluence and system data showing signs
      of compromise; Google Workspace, HR, Slack, GitHub/GitLab under investigation) and DIVD's cut-off of every system
      in its data centre. Mitigation guidance matches the stored entry: upgrade to Zammad 7.0.0 or later (not
      exploitable for the code-execution flaw, still exposed to the local-escalation flaw) or take it offline, put the
      helpdesk in its own segment with default-deny egress, preserve /var/log/zammad and the web-server logs before
      rebuilding, run DIVD's check script, treat any hit as full host compromise and rotate every credential on or
      reachable from the host. The 'AI agent' attribution is DIVD's inference from the scripts' comments, which Sysdig adopts.
    region_nexus: "Netherlands/EU; Zammad is widely used by DACH public bodies (the store links a BSI Zammad advisory)"
