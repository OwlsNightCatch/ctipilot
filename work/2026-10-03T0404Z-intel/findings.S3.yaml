  - title: "Longlegs (Storm-2603), the actor behind Warlock ransomware, still gets in through on-premises SharePoint: a water utility, a telecom, a regional government body and a university hit in two months"
    sources:
      - { url: "https://www.security.com/threat-intelligence/warlock-ransomware-critical-infrastructure", publisher: "Symantec / Carbon Black Threat Hunter Team", date: "2026-10-01", role: "primary" }
      - { url: "https://www.cisa.gov/news-events/alerts/2026/07/14/cisa-urges-sharepoint-hardening-after-new-exploitations", publisher: "CISA (alert, last revised 2026-08-26)", date: "2026-07-14", role: "corroborating" }
    discovery_trace: "first seen at: Symantec listing, URL https://www.security.com/threat-intelligence (extract, discovery pass over major vendor research listings; the 2026-10-01 post was the newest entry) → primary: https://www.security.com/threat-intelligence/warlock-ransomware-critical-infrastructure (extract) → pivot: Symantec cites a CISA July 2026 SharePoint advisory, fetched via WebFetch https://www.cisa.gov/news-events/alerts/2026/07/14/cisa-urges-sharepoint-hardening-after-new-exploitations; WebSearch (two queries on Longlegs/Warlock/SharePoint) found no independent coverage of the Symantec report."
    published_date: "2026-10-01"
    summary: |
      Symantec's Threat Hunter Team reports that the China-nexus group it tracks as Longlegs (which it equates with Microsoft's
      Storm-2603 and says it has previously tied to the older clusters CL-CRI-1040, CamoFei and ChamelGang) developed and
      deploys Warlock ransomware, and that in the past two months it attacked at least four organisations in Portuguese- and
      Spanish-speaking countries across Europe, Africa and Latin America: two critical-infrastructure operators (a water
      utility and a telecommunications provider), a regional government body and a university. Initial access remains
      exploitation of on-premises SharePoint Server: the ToolShell chain (CVE-2025-49704, -49706, -53770, -53771) "likely"
      stays in the arsenal alongside newer flaws, and Symantec points to CISA's July 2026 advisory (CISA lists six exploited
      2026 SharePoint CVEs affecting SharePoint Subscription Edition, 2019 and 2016, and says to avoid exposing SharePoint to
      the internet). In the detailed intrusion the actor wrote a webshell into the SharePoint LAYOUTS template directory
      (Symantec says it drops one into the directories of several SharePoint versions at once so it works whichever is
      installed), used it to harvest the farm's ASP.NET machine keys and forged a validly signed __VIEWSTATE payload whose
      deserialisation gadget needs the System.Workflow.ComponentModel assembly, giving code execution in the SharePoint
      application pool. First activity was 2026-07-22; five days later a SharePoint host made an out-of-band callback to a
      Burp-Collaborator style canary domain carrying the target's own name (a per-target "did my payload run" check), and
      the actor then fetched follow-on MSI packages with msiexec /q /i from public file-sharing and object-storage services. Lateral movement used a domain
      account with a SharePoint-setup-lookalike name added to the local Administrators group on several hosts, DLL
      side-loading (legitimate signed executables beside malicious DLLs under the Windows system folder, later copied into
      ProgramData), domain-trust and account enumeration (nltest /domain_trusts, net user /domain), NetExec for AD
      enumeration, credential spraying and remote command execution, and a Visual Studio Code Insiders tunnel installed as
      a service from the Windows\debug folder for covert access that relays through Microsoft infrastructure. Defence
      evasion: a security-product killer (likely driver-based; in other recent attacks Symantec saw the signed vulnerable
      K7RKScan driver, CVE-2025-1055) was pushed to 40+ hosts in about two hours with one-line "net use, copy, start"
      commands from an internal share, after which Warlock binaries were staged in the domain's SYSVOL scripts folder and
      reached 33+ hosts by ordinary DFS replication (Symantec's process data shows the DFS Replication service,
      dfsrs.exe, as the parent that delivered the payload). Symantec leaves open whether the Iberian/Latin focus is
      opportunistic exposure of unpatched SharePoint or deliberate tasking. Facts above are Symantec's first-hand incident
      data; the Longlegs = Storm-2603 equivalence and the lineage to older clusters are Symantec's own assessments, and no
      second lab has yet confirmed the four recent victims.
    region_nexus: "Europe/Africa/Latin America per Symantec (Portuguese- and Spanish-speaking countries); SharePoint-on-premises exposure is transferable to Swiss federal, cantonal and communal estates"
    primary_sector_nexus: "direct (regional government body and critical-infrastructure victims; on-prem SharePoint is common in public administration)"
    sector: "public-sector; utilities (water); telecommunications; education"
    cves: [CVE-2025-49704, CVE-2025-49706, CVE-2025-53770, CVE-2025-53771, CVE-2025-1055]
