        attribution: "Huntress"
        source_url: "https://www.huntress.com/blog/parks-recreation-platform-webshell-attack"
      - quote: "After registering a new account on the platform, the attacker was able to upload malicious files directly to the `/documents/MemberFiles/` directory."
        attribution: "Huntress"
        source_url: "https://www.huntress.com/blog/parks-recreation-platform-webshell-attack"
      - quote: "When the third server was put back into production prematurely, the threat actor returned with a vengeance."
        attribution: "Huntress"
        source_url: "https://www.huntress.com/blog/parks-recreation-platform-webshell-attack"
    extended_notes: |
      Detection telemetry classes: IIS worker-process (w3wp) child processes running cmd/powershell/sqlcmd/findstr;
      new executable-extension files (.aspx etc.) in user-content upload directories; web-server logs showing a GET/POST to
      a file in an upload folder minutes after account creation; text sweeps of web.config for connection strings and
      payment keywords; $STANDARD_INFORMATION versus $FILE_NAME timestamp mismatches on web content; file-integrity
      monitoring on static JavaScript included by login pages. Hardening: remove script execution (handler mappings) from
      upload directories, restrict self-registration and uploadable types, keep payment webhook logs out of the web
      root, and do not return a cleaned server to production before closing the entry path (the actor came back through the
      same registered account). Recency: published 2026-09-30, outside the 26 h window but inside the 72 h developing window.
