- code: F3
  category: claim-not-supported
  section: updated-entry
  item: "2026-10-02/cve-2026-104286-fortimail-path-traversal-zero-day-kev"
  url_or_quote: "Fortinet's compromise section shows what exploitation left behind: a shared library added under the appliance's data partition with an `ld.so.preload` entry, a modified system binary, added service binaries, a modified web server configuration and a modified admin-migration archive; a cron job ... ([Fortinet PSIRT, 2026-10-01](https://www.fortiguard.com/psirt/FG-IR-26-175))"
  summary: "The Fortinet page as read on 2026-10-03 (extract, raw url, WebFetch) has no file table: its IoC section lists two IPs, system event logs and encryption logs only; WebFetch: 'No table of added/modified files was present'. The file list (liblog.so, smit, webconsole, mailservice, httpd.conf, ld.so.preload, migadmin.tar.gz) is carried by BleepingComputer, which says Fortinet published it, and NCSC-CH 13027 names ld.so.preload, webconsole and mailservice. The sentence chains the file clauses (not on the cited page) with the cron/archive-account/IBE-log clauses (on it) under one Fortinet citation. Split the attribution: file artifacts to BleepingComputer (and NCSC-CH), log events to Fortinet, and say the advisory page no longer displays the table. Same fix for the Detection line 'Fortinet's advisory lists the exact artifacts and log patterns' (claim f247cd78a7) and the file part of actions[1]. The earlier run's verifiers did read the table on Fortinet's page on 2026-10-02 (work/2026-10-02T0404Z-intel/verification.iter3.claims.yaml:643), so the page was revised."
- code: F4
  category: hallucinated-fact
  section: updated-entry
  item: "2026-10-02/cve-2026-104286-fortimail-path-traversal-zero-day-kev"
  url_or_quote: "The workaround text and the exposure statement above are corrected to Fortinet's wording: the webmail interface rather than the management interface, plus the web application firewall rule on POST requests to /ibe"
  summary: "'Corrected' (also the record summary 'restated as written', the body's 'which is not Fortinet's wording', and the run-record note 'the earlier text had ... management interface where Fortinet's advisory says the webmail interface ... fixed where it stood') presents the earlier text and the secondary sources as having misworded the advisory. Fortinet's own page said 'Disable access to the FortiMail management interface from the internet or limit the access only from trusted private network' when the prior run's eight verifier iterations read it (work/2026-10-02T0404Z-intel/verification.iter8.claims.yaml:645, iter3:603), and BleepingComputer (2026-10-01) and NCSC-CH 13027 (2026-10-02) repeat that wording. The live page now says webmail, adds the WAF rule and the GUI path, drops the file table, yet its Timeline still lists only '2026-10-01: Initial publication'. State that Fortinet revised the advisory after publication and that BleepingComputer/NCSC-CH reproduce the earlier wording; current wording (webmail + WAF rule) is still the one to follow. The section's 'corrected ... above' sentence is record-keeping narration and should go."
