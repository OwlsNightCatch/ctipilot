  item: "2026-10-03/warlock-longlegs-sharepoint-machinekey-sysvol-ransomware"
  url_or_quote: "**Triage:** Visual Studio Code tunnels are ordinary on developer workstations; the observed pattern is a service installed from a system folder on a host already showing SharePoint exploitation"
  summary: "(low confidence) Symantec installs the tunnel (code-insiders.exe tunnel service install, from the Windows debug folder) on 'Computer 4', one of the three 'further hosts' where SPSEPRDSetup was added to local Administrators; the SharePoint servers are Computer 1 and Computer 2. 'A host already showing SharePoint exploitation' is not what the source describes; 'a host in a domain already showing SharePoint exploitation, or where an unexpected admin account appeared' is. 'Ordinary on developer workstations' is the entry's inference from Symantec's 'traffic that typically originates from developer or administrator workstations'."
