  item: "2026-10-03/warlock-longlegs-sharepoint-machinekey-sysvol-ransomware"
  url_or_quote: "**Defender takeaway:** ... look for the web shell, check local Administrators for setup-lookalike accounts, and replace the machine keys if a web shell is found; ... ([Symantec, 2026-10-01](https://www.security.com/threat-intelligence/warlock-ransomware-critical-infrastructure)) (low confidence)"
  summary: "(low confidence) Symantec does not recommend replacing machine keys; the entry's own Exposure paragraph says 'Symantec does not address key replacement', and the same recommendation sits in actions[0] ('treat the farm's ASP.NET machine keys as stolen'). The Symantec citation at the end of the takeaway makes the advice read as Symantec's. Cite Microsoft's ToolShell guidance (read this iteration: 'it is critical that customers rotate SharePoint server ASP.NET machine keys and restart Internet Information Services (IIS)', https://www.microsoft.com/en-us/security/blog/2025/07/22/disrupting-active-exploitation-of-on-premises-sharepoint-vulnerabilities/) for the rotation step, which would also turn the Exposure 'inference' into a sourced statement, or mark the clause as the entry's own inference."
