    summary: |
      The Swiss broadcaster SRG reported (relayed 2026-09-28 by SwissCybersecurity.net and Keystone-SDA/swissinfo) that unauthorised persons
      obtained data on about 340 current and former employees of SRF, mostly from today's "Information" unit. SRG's analysis says the
      data are contact and organisational data from 2020 (names, functions, work and partly private contact details); personal passwords,
      financial or bank data, journalistic sources, research data and communications content are stated as not affected. SRG deactivated the
      affected accesses, added security measures, notified the competent authorities and filed a criminal complaint; it says nothing has been published or
      misused so far. The cause and the vector are not disclosed. No actor or leak-site claim was found.
