  - title: "CERT-FR and CERT Santé: health-software vendors leave critical, easily exploited flaws open for over a year, with exposed admin secrets, unauthenticated remote access and broken access control (CERTFR-2026-CTI-007)"
    sources:
      - { url: "https://www.cert.ssi.gouv.fr/cti/CERTFR-2026-CTI-007/", publisher: "ANSSI / CERT-FR", date: "2026-10-02", role: "primary" }
      - { url: "https://www.cert.ssi.gouv.fr/uploads/CERTFR-2026-CTI-007.pdf", publisher: "ANSSI / CERT-FR (report PDF)", date: "2026-10-02", role: "primary" }
      - { url: "https://www.cyberattaque.org/sante-82-des-etablissements-francais-ont-eu-connaissance-de-vulnerabilites-en-un-an/", publisher: "Cyberattaque.org", date: "2026-10-02", role: "corroborating" }
    discovery_trace: "first seen at: anssi-fr, URL https://www.cert.ssi.gouv.fr/cti/feed/ (CERT-FR CTI feed, item CERTFR-2026-CTI-007 dated 2 Oct 2026) -> primary: report page URL https://www.cert.ssi.gouv.fr/cti/CERTFR-2026-CTI-007/ -> PDF (href found on the page), URL https://www.cert.ssi.gouv.fr/uploads/CERTFR-2026-CTI-007.pdf (read with fetch_source pdf) -> corroboration: cyberattaque.org article of 2026-10-02 confirming same-day publication"
    summary: |
      CERT Santé and CERT-FR published on 2026-10-02 an anonymised experience report on vulnerabilities in digital products
      deployed in French health establishments. Findings stated by the two CERTs: for four important health-sector vendors the handling
      of vulnerabilities still open has lasted over a year, and in one case the last patch for a medium-severity flaw was scheduled
      five years after the report; causes named are security fixes bundled into infrequent, sometimes paid functional releases,
      many supported versions, no customer-notification channel, late security design and medical-device regulation. Observed
      weaknesses: secrets retrievable by anyone via a URL (in one case the password of the server hosting the service),
      an exposed .git directory leaking application source with secrets, administrator credentials embedded in application code,
      default remote-maintenance credentials left on various sites; XSS and SQL injection reappearing a year after a first fix;
      many internet-exposed instances of one health application reachable without authentication (the vendor says some customers kept
      VNC access open and signed liability waivers); and missing tenant separation, which the report says is "particularly
      exploited at present" on SaaS health solutions: attackers first compromise a health professional's account by phishing or
      compromised passwords, then widen access to other users' and establishments' data, which is hard to detect. In one case, credentials
      recovered from code plus server access authorised for dozens of establishments could have enabled lateral movement into them and
      access to thousands of patients' data. The report cites an Agence du Numérique en Santé survey (82% of respondents aware of
      vulnerabilities in the last twelve months, 74% faced vendors that delay or refuse fixes, 90% without a formal channel to
      report vulnerabilities to vendors) and CERT Santé malicious incidents rising from 328 (2024) to 400 (2025). It also states that
      Article 14 of the EU Cyber Resilience Act (vendors must report actively exploited vulnerabilities and severe incidents on a single
      EU platform) has applied since 2026-09-11, full application is 2027-12-11, medical devices are excluded, and ANFR will be France's
      market-surveillance authority (administrative fines up to EUR 15 million or 2.5% of worldwide turnover). The CERTs recommend
      detection and alerting on unusual or massive access to sensitive data, and robust native authentication on remote-maintenance
      tools before heavier measures (MFA, VPN).
    region_nexus: "france (health sector); transferable to Swiss cantonal and communal hospitals, care providers and the health-software suppliers that serve them"
    primary_sector_nexus: "indirect (public hospitals and health software suppliers are public institutions' technology suppliers)"
    sector: "healthcare, public-sector"
