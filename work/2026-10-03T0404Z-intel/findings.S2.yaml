    summary: |
      Belnet, the Belgian government and research network, says an exploited zero-day in technology from its supplier Fortinet let
      attackers copy all incoming mail to Belnet-owned domains between 2026-07-22 and the morning of 2026-09-25, and links Fortinet's
      advisory FG-IR-26-175 for the flaw. That advisory is the FortiMail IBE path traversal (CVE-2026-104286), published 2026-10-01
      with the flag "Known Exploited: Yes". Reading the two together (an inference from Belnet's pointer; Belnet does not name
      FortiMail), the earliest observed exploitation is 2026-07-22, roughly ten weeks before Fortinet's advisory and CISA's KEV listing,
      and the attacker's objective in a public-sector victim was bulk copying of inbound mail and attachments rather than
      appliance disruption. The covered entry carries a 2026-10-01 disclosure and no earlier exploitation date. NCSC Switzerland's
      advisory of 2026-10-02 (CSH post 13027) adds the observed post-exploitation artefacts: "malicious binaries and modified system
      files (e.g., ld.so.preload, webconsole, mailservice)". Fortinet lists no fixed build for 7.4, 7.6 or 8.0 as of its advisory
      (upcoming 7.4.9, 7.6.7, 8.0.2), so the workaround (disable IBE support, restrict the webmail interface, or block POST
      requests to /ibe containing '../') remains the only vendor control.
