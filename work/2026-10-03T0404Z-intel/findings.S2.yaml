    summary: |
      Belnet's own incident notice, updated 2026-10-02 at 11:00, now names the external supplier as Fortinet and links Fortinet's
      security advisory FG-IR-26-175 for the vulnerability "including the corresponding CVE". That advisory (published 2026-10-01)
