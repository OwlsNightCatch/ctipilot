  - title: "Swiss Parliament refers motion 24.4393 to the Federal Council: .ch and .swiss domains only to identified holders, wider blocking powers for authorities"
    sources:
      - { url: "https://ws.parlament.ch/odata.svc/Business?$filter=ID%20eq%2020244393%20and%20Language%20eq%20'DE'&$format=json", publisher: "Swiss Parliament (Curia Vista web service, business 24.4393)", date: "2026-10-01", role: "primary" }
    discovery_trace: "first seen at: inside-it-ch, URL https://www.inside-it.ch/rss.xml (RSS teaser 'Schweizer Domains werden besser geschuetzt', 2026-10-02: 'Ein Vorstoss ist in beiden Kammern im Bundeshaus erfolgreich'; article page returns HTTP 429, not cited) -> WebSearch (\"Ständerat Identifikationspflicht Domainregistrierung .ch .swiss Motion Götte Oktober 2026\") identified motion 24.4393 -> primary: parlament.ch web service record, URL https://ws.parlament.ch/odata.svc/Business?$filter=ID%20eq%2020244393%20and%20Language%20eq%20'DE'&$format=json (Curia Vista's own SPA page is template-only)"
    summary: |
      Motion 24.4393 (Michael Götte, SVP/SG, submitted 2024-12-17, "Es braucht griffige Massnahmen gegen die missbräuchliche
      Verwendung von schweizerischen Domains!") instructs the Federal Council to change the legal basis so that .ch and .swiss
      domains are issued only to clearly identified natural or legal persons and so that authorities can block domains in
      abuse cases beyond phishing and malware. The Curia Vista record shows the status "Überwiesen an den Bundesrat" dated 2026-10-01
      06:40 UTC (SWICO's session recommendation, seen only as a search snippet, had the Council of States treating it on 2026-10-01),
      with the Federal Council on record (2025-02-12) proposing adoption. Search snippets of parliament.ch and trade press (not fetched)
      say the National Council insisted on the original text on 2026-06-18 against the Council of States' weaker version; the fetched record
      shows only the National Council vote of 2026-06-18 on "original version vs Council of States version" without its result, does not state
      which text was finally referred, and holds no vote detail for the Council of States. No implementing ordinance
      draft (VID, SR 784.104.2) exists yet; Inside IT's teaser says the motion succeeded in both chambers. Defender relevance is
      indirect and future-dated: identification of registrants and a broader blocking basis would change how look-alike and phishing
      domains impersonating cantonal and communal services can be taken down, and who must be identified when administrations
      register domains.
