policy_watch_result: |
  Covered-and-unchanged (no new step in window): Swiss Cybersecurity Act (CSG) Federal Council mandate of 2026-09-25 (BACS press list shows no follow-up),
  Swiss sovereign-cloud motion 24.3209, Austria NISG 2026 (in force 2026-10-01, already in store; heise 2026-09-30 only repeats it),
  ECA special report. Swiss e-ID: start 2026-12-01 per the Federal Council announcement of 2026-02-25, nothing new in window.
  New step found: motion 24.4393 (domain identification and blocking basis) referred to the Federal Council on 2026-10-01 (borderline item above).
  Also found and returned: BSI's Classic McEliece recommendation (2026-10-01, borderline) and ANSSI/CERT-FR/CERT Santé health-software report (2026-10-02),
  whose CRA Article 14 note confirms the single reporting platform obligation has applied since 2026-09-11.
  No in-window EU cyber-sanction listing, Europol/Eurojust or OFAC action against actor infrastructure was found (WebSearch is not date-reliable;
  Europol newsroom unreadable), apart from Operation KillSwitch already covered.
