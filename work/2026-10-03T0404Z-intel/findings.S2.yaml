      - quote: "Ce type de vulnérabilité est particulièrement exploité actuellement sur des solutions numériques de santé,"
        attribution: "ANSSI / CERT-FR (report PDF)"
        source_url: "https://www.cert.ssi.gouv.fr/uploads/CERTFR-2026-CTI-007.pdf"
      - quote: "exposées sur Internet, accessibles sans authentification."
        attribution: "ANSSI / CERT-FR (report PDF)"
        source_url: "https://www.cert.ssi.gouv.fr/uploads/CERTFR-2026-CTI-007.pdf"
      - quote: "sécurité des produits sur une plateforme unique européenne s’applique d’ores et déjà depuis le 11 septembre 2026."
        attribution: "ANSSI / CERT-FR (report PDF)"
        source_url: "https://www.cert.ssi.gouv.fr/uploads/CERTFR-2026-CTI-007.pdf"
    extended_notes: |
      Defender angle for the entry body: telemetry class = application/access logs of health SaaS and on-prem health software showing
      one authenticated professional account reading records across many patients or establishments (unusual or bulk reads), plus
      internet-exposure checks for VNC/remote-maintenance listeners and for .git or secret-bearing URLs on supplier-run web front ends;
      procurement lever = ask suppliers for a vulnerability-notification channel and security-fix cadence independent of functional
      releases (the CRA Annex I expectations the report quotes). The report names no vendors and no CVEs. CRA SRP already launched
      per ENISA (2026-09-11), registry key policy:eu-cyber-resilience-act exists. Note the CERT-FR RSS timestamp is flat 00:00 UTC;
      same-day publication confirmed by cyberattaque.org ("publient ce 2 octobre 2026").
