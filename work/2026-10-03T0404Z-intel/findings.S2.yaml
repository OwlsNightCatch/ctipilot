  - title: "BSI advises against Classic McEliece for new developments after cryptanalysis progress; ML-KEM and FrodoKEM unaffected, TR-02102 revision due early 2027"
    sources:
      - { url: "https://www.bsi.bund.de/DE/Service-Navi/Presse/Alle-Meldungen-News/Meldungen/2026/Classic-McEliece_261001.html", publisher: "BSI (Germany)", date: "2026-10-01", role: "primary" }
      - { url: "https://www.bsi.bund.de/SharedDocs/Downloads/DE/BSI/Krypto/Hinweis_Classic_McEliece.pdf?__blob=publicationFile", publisher: "BSI (Germany), Hinweis zu Classic McEliece (PDF)", date: "2026-10-01", role: "primary" }
    discovery_trace: "first seen at: bsi-de, URL https://www.bsi.bund.de/DE/Service-Navi/Presse/Alle-Meldungen-News/alle-meldungen-news_node.html (BSI news listing, fetched with url --direct; first row dated 01.10.2026; the WID RSS recipe does not surface it) -> primary: BSI news page and its Hinweis PDF (read with fetch_source pdf)"
    summary: |
      On 2026-10-01 BSI published a notice recommending that Classic McEliece, a code-based post-quantum key-encapsulation scheme listed
      in BSI TR-02102 since 2020, not be used for new developments or when planning new cryptographic applications, because recent
      cryptanalysis suggests a markedly lower security level than assumed. BSI states that with the TR-02102-1 parameter sets no
      practical attack is possible today, that TR-02102 always required Classic McEliece only in hybrid combination with a classical key
      agreement (so the hybrid still delivers at least the classical security), and that TR-02102-1 will be revised in the next version, planned
      for early 2027. FrodoKEM and ML-KEM, the other post-quantum KEMs it recommends, are named as unaffected and preferable; HQC is
      also unaffected and will be recommended once its standard exists. BSI keeps its urgency message that migration of key agreement
      to post-quantum cryptography should be done by 2031 at the latest and stresses crypto-agility. The notice matters beyond Germany
      because TR-02102 is the reference behind BSI's TLS minimum standard and TR-03116 (cryptographic requirements for federal projects)
      and is widely used by DACH administrations and suppliers as a cryptographic baseline.
    region_nexus: "germany / DACH; relevant to Swiss federal and cantonal PQC planning (Swiss Council of States treated a national PQC roadmap motion 26.3628 on 2026-09-16, per a SWICO session recommendation found in search, not fetched)"
    primary_sector_nexus: "indirect (cryptographic baseline for government projects and suppliers)"
