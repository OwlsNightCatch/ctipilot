- code: F3
  category: claim-not-supported
  section: body paragraph 4 (claim 6fdb68c0b5)
  item: "2026-10-02/cve-2026-104286-fortimail-path-traversal-zero-day-kev"
  url_or_quote: "BleepingComputer reports that Fortinet's advisory also listed files added or modified on compromised appliances, a shared library under the data partition registered through an `ld.so.preload` entry, a modified system binary, added service binaries, ... ([BleepingComputer, 2026-10-01](https://www.bleepingcomputer.com/news/security/fortinet-warns-of-critical-fortimail-flaw-exploited-in-zero-day-attacks/))"
  summary: "(low confidence) The BleepingComputer file table lists `/data/lib/liblog.so` Added and `/data/etc/ld.so.preload` Added as two separate rows and never says the library is registered through the preload entry; the two `/data/bin/` binaries are listed as Added with no 'service' characterization. The link and the label are the entry's inference attributed to BleepingComputer. Say 'a shared library added under the data partition alongside an added ld.so.preload file' and 'two added binaries'."
- code: F3
  category: claim-not-supported
  section: body Detection (claim 42c828b0ff)
  item: "2026-10-02/cve-2026-76504-cisco-catalyst-sd-wan-manager-auth-bypass-kev"
  url_or_quote: "To judge whether a Manager was already accessed, Cisco directs customers to open a Severity 3 TAC case with the CVE id in the title and to attach the output of `request admin-tech` ([Cisco PSIRT, 2026-09-30](https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-sdwan-webauth-xr8beuuU))"
  summary: "(low confidence) Cisco's page reads 'For help determining if Cisco Catalyst SD-WAN Manager has been compromised, customers may open a case with the Cisco Technical Assistance Center (TAC). Cisco TAC cases should be opened as a Severity 3 with the CVE-ID CVE-2026-76504 in the title. Before opening a new TAC case, customers are encouraged to use the request admin-tech command'. 'directs' overstates an optional help path ('may open', 'encouraged'). Reword to 'Cisco says customers may open ... and encourages running `request admin-tech` first'."
- code: F11
