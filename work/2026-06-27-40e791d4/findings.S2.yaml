        publisher: "The Hacker News"
        date: "2026-06-26"
        role: "corroborating"
    discovery_trace: "first seen at: bridge feed https://www.inside-it.ch/rss.xml, item published June 26 → bridge url article body returned 403 → summary obtained from RSS feed → pivot: THN June 26 for full technical detail → corroborating Check Point Research data"
    summary: |
      Fresh reporting on June 26, 2026 by inside-it.ch (German-language Swiss tech press) and The Hacker News covers significant escalation in The Gentlemen ransomware group's Swiss and German targeting, with updated victim counts and technical detail not present in the W25 weekly brief coverage of the EDR-killing GentleKiller framework. The group now claims 478 confirmed victims since becoming operational in early 2026. Germany is the most heavily targeted European country; Switzerland is second. The ransomware includes a `--spread` command-line argument enabling self-propagating worm behaviour across Windows networks via SMB share enumeration and credential reuse (T1021.002 SMB/Windows Admin Shares, T1210 Exploitation of Remote Services). The worm capability means a single foothold in a Swiss federal or cantonal organisation could spread laterally without further operator interaction. Previously reported: the GentleKiller framework uses BYOVD (Bring Your Own Vulnerable Driver) techniques to disable EDR products (T1562.001) before payload deployment. New in this reporting: specific Swiss victim names not disclosed, but inside-it.ch cites Check Point Research as the source for the Swiss-targeting data. The RaaS model means the group continues to expand affiliate operations. Detection: monitor for `--spread` flag process arguments on ransomware process trees; SMB share enumeration from unexpected hosts; BYOVD driver drop patterns (Sysmon EID 6 for vulnerable driver loads, cross-referenced against known BYOVD driver blocklists). Hardening: enforce SMB signing; restrict admin shares; apply Microsoft-recommended BYOVD driver blocklist.
    ch_eu_nexus: "direct — Switzerland specifically named as second-most-targeted European country; Swiss victims reported by inside-it.ch citing Check Point Research"
    public_sector_nexus: "indirect"
    sector: "all sectors, ransomware"
