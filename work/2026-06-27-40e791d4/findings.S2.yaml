    discovery_trace: "first seen at: bridge feed https://blog.powerdns.com/rss.xml → PowerDNS advisory 2026-08 and DNSdist release note June 25 → pivot: BSI WID-SEC-2026-2091 June 26 corroboration"
    summary: |
      PowerDNS released coordinated security updates on June 25, 2026 for all three of its main product lines, addressing 14 CVEs total. The releases are: Authoritative Server 4.9.16/5.0.6/5.1.2, Recursor 5.2.11/5.3.8/5.4.3, and DNSdist 1.9.15/2.0.7. Key CVE classes include DNS cache manipulation, DNSSEC validation bypass, denial-of-service, and information disclosure. PowerDNS Recursor advisory 2026-08 (CVE-2026-33612, CVE-2026-40011, CVE-2026-40012) covers cache manipulation and DNSSEC integrity bugs at varying severity levels. DNSdist advisories cover DoS and backend abuse scenarios (CVE-2026-42004, CVE-2026-42005, CVE-2026-40208 through CVE-2026-40211). Authoritative Server advisories cover CVE-2026-42387 through CVE-2026-42390 and CVE-2026-52690. The impact of DNS cache manipulation flaws (T1584.002 DNS Server infrastructure compromise class, T1565.002 Transmitted Data Manipulation) is particularly relevant for DNS operators: attackers with network-path access can inject malicious records affecting downstream resolvers. DNSSEC bypass flaws could allow forged DNS responses to bypass signature validation. PowerDNS is widely deployed across European ISPs, telecom operators, and DNS infrastructure providers; DENIC (German ccTLD operator) and SURFnet (Dutch academic network) are known users. BSI flagged WID-SEC-2026-2091 on June 26. Patches are available — update to fixed versions. Detection: monitor DNS audit logs for anomalous NXDOMAIN-to-valid response flips; enable DNSSEC strict validation mode on resolvers; review DNSdist backend access controls.
    ch_eu_nexus: "direct — PowerDNS is deployed in European DNS infrastructure operators including ISPs, telecom carriers, and ccTLD registries"
