  - title: "GitLab CE/EE 19.1.1/19.0.3/18.11.6 security release patches 13 CVEs including unauthenticated XSS in Web IDE and high-severity analytics XSS (EE)"
    sources:
      - url: "https://www.securityweek.com/gitlab-patches-code-execution-information-disclosure-vulnerabilities/"
        publisher: "SecurityWeek"
        date: "2026-06-25"
        role: "primary"
      - url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0211"
        publisher: "NCSC-NL"
        date: "2026-06-25"
        role: "corroborating"
      - url: "https://docs.gitlab.com/releases/patches/patch-release-gitlab-19-1-1-released/"
        publisher: "GitLab"
        date: "2026-06-25"
        role: "corroborating"
    discovery_trace: "first seen at: ncsc-nl recent listing, NCSC-2026-0211 published June 25 → ncsc-nl csaf NCSC-2026-0211 yielded 13 CVEs → pivot: SecurityWeek June 25 article corroborating → docs.gitlab.com release notes for exact versions"
    summary: |
      GitLab released security updates on June 25, 2026 for versions 19.1.1, 19.0.3, and 18.11.6 addressing 13 CVEs. The three highest-severity issues are: CVE-2026-10712 (CVSS 8.0) — unauthenticated XSS in the Web IDE workbench asset handler, exploitable against any GitLab user who visits a crafted URL; CVE-2026-10086 (CVSS 8.7) — high-severity stored XSS in the Analytics Dashboard, Enterprise Edition only; CVE-2026-12053 (CVSS 8.6) — information disclosure in Duo Workflows that could expose AI workflow data to unauthorized parties. Additional CVEs cover lower-severity XSS, privilege escalation, CSRF, and access-control bypass issues across both CE and EE versions. GitLab CE/EE is widely deployed in EU public-sector organisations for source code management and CI/CD pipelines. Attack technique for XSS flaws: T1059.007 JavaScript execution, T1185 Man in the Browser. The Web IDE XSS (CVE-2026-10712) is notable because it is unauthenticated — any browser that loads the crafted Web IDE URL executes attacker JavaScript. This could be leveraged to steal session tokens from logged-in GitLab users visiting crafted issue/MR comments. Affected versions: 19.1.0 and earlier (CE/EE), 19.0.2 and earlier, 18.11.5 and earlier. Patched: 19.1.1, 19.0.3, 18.11.6. GitLab.com SaaS updated automatically. Self-managed installations must update manually. Detection: web server / application logs for unexpected requests to Web IDE asset handler endpoints; CSP violation reports for unexpected script execution origins. Hardening: update to patched versions immediately; review Analytics Dashboard access permissions in EE deployments; disable Duo Workflows feature if unused.
