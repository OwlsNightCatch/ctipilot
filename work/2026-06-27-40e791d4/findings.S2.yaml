  - title: "Cisco Catalyst SD-WAN zero-day chain (CVE-2026-20127/20182/20245): Mandiant documents full exploitation TTP chain including CSV-injection-to-root backdoor"
    sources:
      - url: "https://cloud.google.com/blog/topics/threat-intelligence/zero-day-exploitation-cisco-catalyst-sd-wan-manager"
        publisher: "Google Mandiant (GTIG)"
        date: "2026-06-24"
        role: "primary"
      - url: "https://security-hub.ncsc.admin.ch/#/posts/12579"
        publisher: "NCSC-CH Security Hub"
        date: "2026-06-25"
        role: "corroborating"
    discovery_trace: "first seen at: ncsc-csh recent 10, post 12579 updated June 25 with Mandiant report link → pivot: bridge url https://cloud.google.com/blog/topics/threat-intelligence/zero-day-exploitation-cisco-catalyst-sd-wan-manager → primary: Google Mandiant GTIG June 24 2026"
    summary: |
      Google Mandiant (GTIG) published a detailed threat-intelligence report on June 24, 2026 documenting observed exploitation of the Cisco Catalyst SD-WAN zero-day chain. While CVE-2026-20182 (authentication bypass) and CVE-2026-20127 (peering auth bypass) were previously reported, the Mandiant report is the first public disclosure of the complete multi-stage TTP chain and timeline. The observed activity spans late 2025 to April 2026. Key TTPs: (1) Initial access via CVE-2026-20127/20182 — attacker establishes unauthorized peering connection masquerading as a trusted router, bypassing SD-WAN Manager authentication (T1190); (2) Credential manipulation — attacker changes the default admin account password, then reverts changes to avoid detection; (3) Privilege escalation via CVE-2026-20245 — malicious CSV file `evil_tenant.csv` uploaded via the `request tenant-upload` CLI command, containing OS shell commands in tenant fields; the CSV processing path executes those commands without sanitisation (T1068 Exploitation for Privilege Escalation, T1059.004 Unix Shell); (4) Backdoor persistence — shell commands add a `troot` user with root privileges to /etc/passwd and /etc/shadow; (5) Anti-forensics — systematic deletion of uploaded file and restoration of modified configurations. Mandiant observed activity at a service provider victim. Prerequisites: network access to SD-WAN Manager control connection peering interfaces. Patched in the May 14, 2026 advisory. The NCSC-CH Security Hub updated post 12579 on June 25 to add the Mandiant report. This report adds significant operational hunt value: defenders should search for `evil_tenant.csv` artefacts and unexpected user additions to /etc/passwd on SD-WAN Manager instances, unexpected peering connections, and audit `request tenant-upload` execution logs.
    ch_eu_nexus: "direct — Cisco Catalyst SD-WAN is deployed in Swiss and EU enterprise/telecom networks; NCSC-CH flagged this"
    public_sector_nexus: "indirect"
    sector: "telco, enterprise, critical infrastructure"
    cves: ["CVE-2026-20127", "CVE-2026-20182", "CVE-2026-20245"]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "update-to-prior:2026-06-18"
    evidence:
      - quote: "In a report published on June 24th 2026, Google Mandiant observed malicious activity related to CVE-2026-20127 and CVE-2026-20182 leading to authentication bypass and the exploitation of CVE-2026-20245 to escalate privileges. Activity was observed from late 2025 to January 2026 and March 2026."
        attribution: "NCSC-CH Security Hub post 12579"
        source_url: "https://security-hub.ncsc.admin.ch/#/posts/12579"
      - quote: "The threat actor uploaded evil_tenant.csv containing shell commands that backed up original configuration and system files, appended malicious troot user to /etc/passwd and /etc/shadow, enabled root-level access while maintaining operational security."
        attribution: "Google Mandiant (GTIG)"
        source_url: "https://cloud.google.com/blog/topics/threat-intelligence/zero-day-exploitation-cisco-catalyst-sd-wan-manager"

  - title: "The Gentlemen ransomware: 478 confirmed victims, worm spread capability, Germany and Switzerland most-targeted European countries"
    sources:
      - url: "https://www.inside-it.ch/aufstrebende-ransomware-bande-findet-mehr-schweizer-opfer-20260626"
        publisher: "inside-it.ch"
        date: "2026-06-26"
        role: "primary"
