      ATT&CK: T1190 (Exploit Public-Facing Application), T1133 (External Remote Services).
      Prerequisites: IKEv1 must be enabled on the gateway (disabled by default on R81.10+ but
      may be enabled for legacy site-to-site tunnels with older peers); no authentication required.
      Detection: Check Point logs for IKEv1 Phase 1 authentication events without corresponding
      valid user certificate chains; anomalous VPN sessions from unrecognised source IPs; forensic
      review of logs from 2026-05-07 onward per vendor guidance.
      Hardening: apply hotfixes from sk185033 (CVE-50751) and sk185035 (CVE-50752) immediately;
      if IKEv1 is not required, disable via Security Gateway settings; migrate site-to-site tunnels
      to IKEv2 as a permanent fix.

  - title: "CVE-2026-43503 'DirtyClone' — Linux kernel LPE via XFRM/IPsec skb cloning; working exploit public, fourth DirtyFrag-family variant; requires CAP_NET_ADMIN"
    sources:
      - url: "https://research.jfrog.com/post/dissecting-and-exploiting-linux-lpe-variant-dirtyclone-cve-2026-43503/"
        publisher: "JFrog Security Research"
        date: "2026-06-25"
        role: "primary"
      - url: "https://nvd.nist.gov/vuln/detail/CVE-2026-43503"
        publisher: "NVD/NIST"
        date: "2026-06-26"
        role: "corroborating"
      - url: "https://thehackernews.com/2026/06/new-dirtyclone-linux-kernel-flaw-lets.html"
        publisher: "The Hacker News"
        date: "2026-06-26"
        role: "corroborating"
    discovery_trace: "first seen at: THN feed (feed bridge) → article https://thehackernews.com/2026/06/new-dirtyclone-linux-kernel-flaw-lets.html → primary: JFrog research https://research.jfrog.com/post/dissecting-and-exploiting-linux-lpe-variant-dirtyclone-cve-2026-43503/ → NVD corroboration"
    summary: |
      CVE-2026-43503 (CVSS 8.8 HIGH, CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H) is a local privilege
      escalation in the Linux kernel networking subsystem dubbed "DirtyClone", and is the fourth variant in
      the DirtyFrag family following Copy Fail (CVE-2026-31431), DirtyFrag (CVE-2026-43284/43500) and
      Fragnesia (CVE-2026-46300). The flaw resides in __pskb_copy_fclone() and skb_shift() helper functions
      which transfer socket-buffer (skb) fragment descriptors without propagating the SKBFL_SHARED_FRAG safety
      flag to cloned packets. When the cloned packet traverses the XFRM/IPsec ESP input decryption path
      (esp_input()), the decryption operation performs in-place writes into file-backed page-cache memory —
      specifically the page-cache backing of setuid-root binaries such as /usr/bin/su — without triggering
      the copy-on-write path. JFrog published a working exploit walkthrough on 2026-06-25. The exploit chain
      requires CAP_NET_ADMIN (obtainable from unprivileged user namespaces on default Debian/Ubuntu/Fedora
      configurations) plus an IPsec tunnel. Affected kernel range spans 3.9 through all stable branches up to
      v7.1-rc4; the fix was merged to mainline on 2026-05-21 (commit 48f6a5356a33, v7.1-rc5) and backported
      to stable/LTS branches. Major distributions (Debian, Ubuntu, Fedora, SUSE, RHEL) have not yet shipped
      patched kernels per the advisory.
    ch_eu_nexus: "Affects all mainstream Linux distributions shipped in Swiss and European public-sector environments; particular risk on Kubernetes nodes and CI/CD runners where unprivileged user namespaces are enabled"
    public_sector_nexus: "direct — Linux servers are pervasive in public-sector infrastructure; Kubernetes is widely used in cloud-native public-sector deployments"
    sector: "cross-sector, cloud, public-sector"
    cves: [CVE-2026-43503, CVE-2026-31431, CVE-2026-43284, CVE-2026-43500, CVE-2026-46300]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "CVE-2026-43503 is a high-severity (8.8 CVSS) local privilege escalation flaw affecting Linux kernel networking. The exploit requires CAP_NET_ADMIN capability, typically obtainable via unprivileged user namespaces. Vulnerable kernels include any lacking the complete DirtyFrag patch series; the fix was merged to mainline on 21 May 2026 (commit 48f6a5356a33, v7.1-rc5)."
        attribution: "JFrog Security Research"
        source_url: "https://research.jfrog.com/post/dissecting-and-exploiting-linux-lpe-variant-dirtyclone-cve-2026-43503/"
      - quote: "The vulnerability involves Linux kernel networking functions that fail to preserve a critical security marker (SKBFL_SHARED_FRAG) when transferring packet fragments between buffers."
        attribution: "NVD/NIST"
        source_url: "https://nvd.nist.gov/vuln/detail/CVE-2026-43503"
    extended_notes: |
      ATT&CK: T1068 (Exploitation for Privilege Escalation).
      Prerequisites: local shell access with CAP_NET_ADMIN; unprivileged user namespaces enabled
      (the default on Debian, Ubuntu, Fedora; requires sysctl kernel.unprivileged_userns_clone=1 on
      some configs). IPsec configured in the namespace.
      Detection: Sysmon EID 1 for suspicious invocations of ip / setkey / ipsec from non-root processes;
      seccomp or AppArmor deny alerts for CAP_NET_ADMIN from non-administrative processes; runtime
      detection of unexpected su / passwd / setuid-binary executions following abnormal parent process trees.
      Hardening: apply kernel updates when available from your distro; as an interim mitigation disable
      unprivileged user namespaces (sysctl kernel.unprivileged_userns_clone=0) if not operationally required;
      this is the same mitigation class as for all DirtyFrag-family variants.
      Context: This is the fourth variant — organisations that applied the DirtyFrag mitigations from the
      earlier Copy Fail (CVE-2026-31431 / CERT-EU 2026-005) advisory may still be vulnerable via this
      distinct code path.

  - title: "CVE-2026-46331 'pedit COW' — Linux kernel LPE via traffic-control act_pedit module; out-of-bounds write poisons setuid binary page cache; public exploit within 24 hours of CVE assignment"
    sources:
      - url: "https://thehackernews.com/2026/06/new-linux-pedit-cow-exploit-enables.html"
        publisher: "The Hacker News"
        date: "2026-06-26"
        role: "primary"
      - url: "https://nvd.nist.gov/vuln/detail/CVE-2026-46331"
        publisher: "NVD/NIST"
        date: "2026-06-26"
        role: "corroborating"
    discovery_trace: "first seen at: THN feed (feed bridge) → article https://thehackernews.com/2026/06/new-linux-pedit-cow-exploit-enables.html → NVD corroboration https://nvd.nist.gov/vuln/detail/CVE-2026-46331"
    summary: |
      CVE-2026-46331, nicknamed "pedit COW", is an out-of-bounds write in the Linux kernel's traffic-control
      (tc) packet editor action module (net/sched/act_pedit.c). The vulnerable function tcf_pedit_act()
      pre-computes the writable COW range for skb_ensure_writable() before the per-key loop using
      tcfp_off_max_hint, but this calculation does not account for runtime header offsets; writes from
      later keys in the loop land outside the privately-copied region and directly into shared file-backed
      page-cache memory. This allows a local, unprivileged attacker (with tc rule-write access, obtainable
      via user namespaces on default configurations) to overwrite page-cache copies of setuid-root binaries
      (e.g. /usr/bin/su) in-memory without modifying the on-disk file, defeating file-integrity monitoring.
      A public working exploit appeared within 24 hours of the CVE being assigned on 2026-06-16; Red Hat
      rates the flaw as "important". Affected distributions include RHEL 8/9/10, Debian 11/12/13, and Ubuntu
      18.04 through 26.04 with default kernel configurations. The flaw is distinct from but structurally
      similar to the DirtyFrag/DirtyClone family.
    ch_eu_nexus: "Affects all supported Linux server distributions shipped in CH/EU public-sector environments; same attack surface as DirtyClone"
    public_sector_nexus: "direct — any Linux server or containerised workload"
    sector: "cross-sector, cloud, public-sector"
    cves: [CVE-2026-46331]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "CVE-2026-46331, nicknamed 'pedit COW,' is an out-of-bounds write in the Linux kernel's traffic-control subsystem, specifically in the packet-editing action (act_pedit) component. The flaw corrupts shared page-cache memory. A public working exploit emerged within one day of CVE assignment on June 16."
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/06/new-linux-pedit-cow-exploit-enables.html"
    extended_notes: |
      ATT&CK: T1068 (Exploitation for Privilege Escalation).
      Prerequisites: local shell access, ability to configure tc rules — obtainable via unprivileged user
      namespaces on Debian/Ubuntu/Fedora defaults; no authentication bypass required.
      Detection: same class as DirtyFrag/DirtyClone — watch for non-root processes invoking tc / ip from
      unusual parent processes; AppArmor / seccomp alerts for CAP_NET_ADMIN in unprivileged namespace
      contexts; unusual writes to /usr/bin setuid binaries that do not correlate with package updates.
      Hardening: apply distro kernel update when available; interim mitigation: sysctl
      kernel.unprivileged_userns_clone=0 (Debian/Ubuntu) or equivalent GPO/policy on managed Linux fleets.
      Note: This is the FIFTH distinct public Linux kernel LPE with PoC in the DirtyFrag-class since
      April 2026, indicating systematic research into this code pathway. Defenders should treat unpatched
      Linux servers as locally privilege-escalated for threat-hunt purposes.

  - title: "TonRAT / Node.js implant: Microsoft-documented phishing campaign targets hotel front-desk systems across Europe and Asia via 'authentication laundering' through Calendly and Google"
    sources:
      - url: "https://www.microsoft.com/en-us/security/blog/2026/06/25/photo-zip-campaign-targeting-hospitality-industry-delivers-node-js-implant-persistent-access/"
        publisher: "Microsoft Threat Intelligence"
        date: "2026-06-25"
        role: "primary"
      - url: "https://thehackernews.com/2026/06/microsoft-warns-of-photo-zip-phishing.html"
        publisher: "The Hacker News"
        date: "2026-06-26"
        role: "corroborating"
    discovery_trace: "first seen at: THN feed (feed bridge) → https://thehackernews.com/2026/06/microsoft-warns-of-photo-zip-phishing.html → primary: Microsoft Security Blog https://www.microsoft.com/en-us/security/blog/2026/06/25/photo-zip-campaign-targeting-hospitality-industry-delivers-node-js-implant-persistent-access/"
    summary: |
      Microsoft Threat Intelligence documented an active multi-stage intrusion campaign against hospitality
      organisations across Europe and Asia (active since April 2026). The campaign uses "authentication
      laundering" — routing phishing emails through Calendly's notification infrastructure and Google's
      URL redirect service to make them pass DMARC/SPF/DKIM checks, then tricking front-desk staff into
      downloading photo-themed ZIP archives containing .png.lnk shortcut files. Upon execution, heavily
      obfuscated PowerShell (using BigInt arithmetic to decode hidden download URLs) retrieves additional
      payloads including a .NET DLL compiled on-the-fly via csc.exe/cvtres.exe. The final payload is
      TonRAT: a persistent Node.js implant (v24.13.0 delivered from nodejs.org) that establishes dual
      HKCU Run/RunOnce registry persistence and communicates C2 via the TON (Telegram Open Network)
      blockchain API over encrypted WebSocket channels on non-standard ports (56001–56003, 8443–8453),
      making traffic appear to be legitimate blockchain API calls. Lure emails are crafted in Japanese,
      Danish, and Dutch targeting reception, reservations, and front-office systems specifically. No
      attribution to a known threat actor; no confirmed data theft or ransomware yet observed.
    ch_eu_nexus: "European hotel and hospitality chains directly targeted; Swiss hospitality sector is in scope based on the European targeting pattern and Dutch-language lure observed"
    public_sector_nexus: "indirect — public-sector accommodation and event facilities may be targeted"
    sector: "hospitality, tourism"
    cves: []
    actors_campaigns_malware: ["TonRAT"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "The attack chain begins with phishing emails using 'authentication laundering'—misusing Calendly's notification infrastructure and Google's URL redirects to bypass email authentication controls. The Node.js implant (v24.13.0) executes from user-space AppData paths, establishing dual persistence through HKCU\\Run and HKCU\\RunOnce registry keys. Post-compromise activity includes C2 beaconing on non-standard ports (56001-56003, 8443-8453)"
        attribution: "Microsoft Threat Intelligence"
        source_url: "https://www.microsoft.com/en-us/security/blog/2026/06/25/photo-zip-campaign-targeting-hospitality-industry-delivers-node-js-implant-persistent-access/"
    extended_notes: |
      ATT&CK: T1566.002 (Spearphishing Link), T1199 (Trusted Relationship — abuse of Calendly/Google
      infra), T1204.002 (Malicious File), T1059.001 (PowerShell), T1059.007 (JavaScript), T1027 /
      T1027.004 (Compile After Delivery), T1547.001 (Registry Run Keys), T1571 (Non-Standard Port).
      Detection: Event ID 4104 (script block logging) for PowerShell containing BigInt decode patterns;
      process creation (Sysmon EID 1) where cmd.exe/powershell.exe parent is explorer.exe invoked from
      .lnk file; node.exe spawned from %APPDATA% paths with outbound WebSocket to TON API endpoints;
      csc.exe/cvtres.exe invoked outside of development tool contexts.
      Hardening: Attack Surface Reduction rule "Block execution of potentially obfuscated scripts" (Windows
      Defender); restrict Constrained Language Mode for PowerShell via GPO; block node.exe in AppData
      via AppLocker/WDAC; review Calendly URL redirects in email gateway allow/deny policies.

  - title: "Turla STOCKSTAY .NET backdoor: modular WebSocket C2 via Render/Glitch platforms, targeting Ukrainian government and Italian foreign-policy entities"
    sources:
      - url: "https://cloud.google.com/blog/topics/threat-intelligence/stockstay-turla-intelligence-gathering"
        publisher: "Google Threat Intelligence Group (GTIG / Mandiant)"
        date: "2026-06-25"
        role: "primary"
      - url: "https://thehackernews.com/2026/06/google-details-turlas-new-stockstay.html"
        publisher: "The Hacker News"
        date: "2026-06-26"
        role: "corroborating"
    discovery_trace: "first seen at: THN feed (feed bridge) → https://thehackernews.com/2026/06/google-details-turlas-new-stockstay.html → primary: GTIG blog https://cloud.google.com/blog/topics/threat-intelligence/stockstay-turla-intelligence-gathering"
    summary: |
      Google Threat Intelligence Group (GTIG, formerly Mandiant) published a full technical analysis of
      STOCKSTAY, a modular .NET backdoor attributed with high confidence to Turla (aka Secret Blizzard,
      SUMMIT, FSB Center 16) active since at least December 2022. STOCKSTAY consists of four .NET
      assemblies: MARKETMAKER (downloader), STOCKBROKER (proxy-aware WebSocket tunneler using the open-source
      websocket-sharp library), STOCKTRADER (main backdoor supporting 13+ commands: file I/O, registry
      manipulation, process execution, system reconnaissance), and STOCKMARKET (task orchestrator). The
      components communicate via Windows WM_COPYDATA inter-process messages, decoupling the network layer
      from command execution. C2 uses encrypted WebSocket sessions hosted on legitimate PaaS platforms
      (Render, Glitch) with server-side code publicly on GitHub — preventing platform operator introspection
      of the encrypted traffic. Attribution rests on code-level overlap with the KAZUAR K1MORPHER obfuscator,
      Windows-1251 Cyrillic encoding, and deployment alongside confirmed Turla tools (WILDDAY, DIAMONDBACK).
      Delivery includes phishing with RDP file attachments, RAR archives exploiting CVE-2025-8088 (WinRAR
      path traversal), MSI installers and HTA scripts. Primary targets are Ukrainian government/military
      organisations and European entities with Italian foreign-policy interests.
    ch_eu_nexus: "European entities with Italian foreign-policy interests are directly named as targets; Swiss diplomatic and foreign-affairs organisations in scope for similar targeting"
    public_sector_nexus: "direct — government ministries, military, diplomatic missions are the stated target class"
    sector: "government, defence, diplomatic"
    cves: [CVE-2025-8088]
    actors_campaigns_malware: ["Turla", "STOCKSTAY", "KAZUAR", "WILDDAY", "DIAMONDBACK"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "STOCKSTAY is a multi-component .NET backdoor utilizing the Windows Forms framework and secure WebSocket connections via the open-source websocket-sharp library. Google Threat Intelligence attributes it to Russian state-sponsored actor Turla, with suspected development dating to December 2022. Primary targets include Ukrainian government and military organizations plus European entities with Italian foreign policy interests."
        attribution: "Google Threat Intelligence Group"
        source_url: "https://cloud.google.com/blog/topics/threat-intelligence/stockstay-turla-intelligence-gathering"
      - quote: "STOCKSTAY Another Day: The Latest Addition to Turla's Intelligence Gathering Apparatus"
        attribution: "Google Threat Intelligence Group"
        source_url: "https://cloud.google.com/blog/topics/threat-intelligence/stockstay-turla-intelligence-gathering"
    extended_notes: |
      ATT&CK: T1574.014 (AppDomainManager Injection), T1547.001 (Registry Run Keys), T1547.015 (Login Items),
      T1005 (Data from Local System), T1041 (Exfil over C2), T1104 (Multi-stage Channels),
      T1140 (Deobfuscate/Decode Files).
      Prerequisites: initial access via phishing (RDP attachment or RAR exploiting CVE-2025-8088) or
      social engineering; no authentication bypass on the target system is required post-initial access.
      Detection: monitor for .NET assemblies loaded from unusual AppData/Temp paths; WM_COPYDATA messages
      between processes in unusual parent-child chains (Sysmon EID 8 / 10); outbound WebSocket connections
      to Render.com or Glitch.com from non-browser processes; HKCU Run registry key persistence for
      processes not associated with known software.
      Hardening: block WinRAR CVE-2025-8088 (update to 7.11+); enable AMSI and ETW for .NET assemblies;
      block .NET AppDomainManager hijack path by preventing DLL placement in application directories;
      Zero Trust access policies restricting lateral movement from diplomat workstations.

  - title: "FBI/CISA update: Russian intelligence (UNC5792 / UNC4221) now coercing Signal users to hand over Backup Recovery Keys — account takeover persists across phone-number reuse"
    sources:
      - url: "https://www.ic3.gov/PSA/2026/PSA260626"
        publisher: "FBI Internet Crime Complaint Center (IC3)"
        date: "2026-06-26"
        role: "primary"
      - url: "https://cloud.google.com/blog/topics/threat-intelligence/russia-targeting-signal-messenger/"
        publisher: "Google Threat Intelligence Group"
        date: "2026-03 (referenced)"
        role: "corroborating"
      - url: "https://thehackernews.com/2026/06/fbi-warns-russian-intelligence-hackers.html"
        publisher: "The Hacker News"
        date: "2026-06-27"
        role: "corroborating"
    discovery_trace: "first seen at: THN feed (feed bridge) → https://thehackernews.com/2026/06/fbi-warns-russian-intelligence-hackers.html → primary: FBI IC3 advisory https://www.ic3.gov/PSA/2026/PSA260626 → GTIG corroboration"
    summary: |
      The FBI and CISA issued an updated advisory on 2026-06-26 (PSA260626) detailing an evolved phishing
      technique by Russian Intelligence Services (RIS), specifically operators tracked as UNC5792 (FSB-linked)
      and UNC4221 (Russian military-linked), targeting Signal accounts of US and international government
      officials, military personnel, journalists, and Ukrainian officials. The new campaign variant coerces
      targets into disclosing their Signal Backup Recovery Key — a 30-character alphanumeric code that
      can restore the account's complete message history and group memberships on a new device. Once obtained,
      the key grants the attacker: (1) full access to historical private and group messages without triggering
      device-linking notifications, (2) persistent account takeover that survives the victim creating a new
      account on the same phone number, and (3) access to group conversations the victim participates in.
      The technique has evolved from earlier variants (SMS OTP coercion, PINs, linked-device QR code abuse)
      and specifically abuses Signal's optional encrypted backup feature, not any cryptographic flaw in the
      Signal Protocol itself. The updated advisory includes guidance on protecting backup keys and revoking
      compromised sessions.
    ch_eu_nexus: "Swiss federal employees, diplomatic staff and journalists using Signal are in the target population; Germany's BSI and BfV, France's ANSSI, and the Netherlands AIVD/MIVD have all previously warned about this campaign class"
    public_sector_nexus: "direct — government officials, military personnel, diplomatic staff explicitly named as targets"
    sector: "government, defence, journalism, diplomatic"
    cves: []
    actors_campaigns_malware: ["UNC5792", "UNC4221"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Russian Intelligence Services (RIS) cyber threat actors, including FSB officers and military-affiliated operators tracked as UNC5792 and UNC4221, are conducting phishing campaigns against Signal users to obtain Backup Recovery Keys. Once obtained, these keys grant threat actors access to historical messages, private/group communications, and account takeover capabilities. Compromised keys remain valid even after victims create new accounts using the same phone number."
        attribution: "FBI Internet Crime Complaint Center (IC3)"
        source_url: "https://www.ic3.gov/PSA/2026/PSA260626"
    extended_notes: |
      ATT&CK: T1598.003 (Spearphishing via Service), T1539 (Steal Web Session Cookie — analogous:
      credential backup key theft), T1078 (Valid Accounts — account takeover).
      Detection: no technical sensor detects this at the platform layer; relies on user reporting and
      security-awareness training. Defenders should implement: (1) policy requiring Signal users to
      verify backup key status and generate new keys if recently received unsolicited support messages;
      (2) Zero Trust architecture treating Signal as an untrustworthy exfiltration channel for classified
      material; (3) MDM controls to prevent Signal backup from being enabled on managed devices.
      Hardening: generate a new Signal Backup Recovery Key immediately if you received unsolicited
      Signal "support" messages requesting recovery key; disable backups on managed devices where
      operational security requires it; review linked devices list on Signal and remove any unknown entries.

  - title: "StrikeShark / SharkLoader: Chinese-attributed DLL-hijack loader delivering Cobalt Strike via Perfect DLL Hijack through SystemSettings.exe — targets diplomatic and government entities"
    sources:
      - url: "https://securelist.com/strikeshark-campaign/120326/"
        publisher: "Kaspersky SecureList"
        date: "2026-06-24"
        role: "primary"
      - url: "https://thehackernews.com/2026/06/new-sharkloader-malware-deploys-cobalt.html"
        publisher: "The Hacker News"
        date: "2026-06-26"
        role: "corroborating"
    discovery_trace: "first seen at: THN feed (feed bridge) → https://thehackernews.com/2026/06/new-sharkloader-malware-deploys-cobalt.html → primary: Kaspersky SecureList https://securelist.com/strikeshark-campaign/120326/"
    summary: |
      Kaspersky disclosed the StrikeShark intrusion cluster on 2026-06-24, deploying a previously
      undocumented loader called SharkLoader that delivers Cobalt Strike Beacon across government and
      diplomatic targets in Indonesia, Taiwan, Hong Kong, Lebanon, Syria, Colombia, North Macedonia,
      Nepal, and Serbia. Initial access exploits internet-facing RCE vulnerabilities including
      CVE-2021-26855 (Exchange ProxyLogon), CVE-2023-32315 (Openfire), CVE-2024-36401 (GeoServer),
      CVE-2023-46747 (F5 BIG-IP), CVE-2024-21762 (FortiOS), CVE-2023-20198 (Cisco IOS XE), and
      CVE-2022-41082 (ProxyNotShell), or distributes the loader via dropper executables masquerading as
      Google Update and Cisco AnyConnect installers. SharkLoader employs "Perfect DLL Hijacking" to bypass
      Windows Loader Lock: it uses SystemSettings.exe sideloading to load DscCoreR.mui, which decrypts
      (Blowfish + AES) and decompresses SyncRes.dat, then installs API hooks via MinHook and Microsoft
      Detours monitoring VirtualAlloc and Sleep, copies decompressed Cobalt Strike Beacon shellcode into
      allocated memory, and resumes execution in a suspended thread. Post-exploitation tools include FScan,
      Searchall, Pillager (credential harvesting), and SharpGPOAbuse. Attribution is assessed as a
      Chinese-speaking threat actor with low confidence based on development-environment artefacts.
    ch_eu_nexus: "Government and diplomatic entities across Europe are in scope; the Balkans-region targeting (North Macedonia, Serbia) is geographically adjacent to the EU/Swiss diplomatic sphere"
    public_sector_nexus: "direct — government and diplomatic organisations are the stated target"
    sector: "government, diplomatic, software"
    cves: [CVE-2021-26855, CVE-2023-32315, CVE-2024-36401, CVE-2023-46747, CVE-2024-21762, CVE-2023-20198, CVE-2022-41082]
    actors_campaigns_malware: ["StrikeShark", "SharkLoader"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "SharkLoader implements 'Perfect DLL Hijacking' to bypass Windows Loader Lock, executing malicious code through SystemSettings.exe to load DscCoreR.mui, which decompresses and loads Cobalt Strike Beacon in a suspended thread. The loader uses MinHook and Microsoft Detours libraries to install API hooks monitoring VirtualAlloc and Sleep functions."
        attribution: "Kaspersky SecureList"
        source_url: "https://securelist.com/strikeshark-campaign/120326/"
    extended_notes: |
      ATT&CK: T1190 (Exploit Public-Facing Application — initial access CVEs), T1574.001 (DLL Search Order
      Hijacking via SystemSettings.exe), T1055.012 (Process Injection: Process Hollowing — suspended thread
      Beacon load), T1562.001 (Disable/Modify Tools — ETW patching via Detours), T1059.003 (Windows Command
      Shell), T1552.001 (Credentials in Files — Pillager), T1046 (Network Service Discovery — FScan).
      Detection: Sysmon EID 7 (image loaded) for DscCoreR.mui or SyncRes.dat loaded from %AppData% paths
      by SystemSettings.exe; Sysmon EID 10 (process access) for VirtualAlloc/Sleep API hooks injected into
      processes; abnormal outbound C2 beacons (named-pipe Beacon or HTTPS Beacon indicators per Cobalt
      Strike telemetry); FScan/Searchall network scanning originating from compromised hosts.
      Hardening: patch internet-facing Exchange, Openfire, GeoServer, F5, Fortinet, Cisco; block DLL
      sideloading in %AppData% via WDAC/AppLocker; Microsoft Defender ASR rule "Block abuse of exploited
      vulnerable signed drivers".

  - title: "Miasma/Mini Shai-Hulud supply chain worm: 24 LeoPlatform/RStreams npm packages backdoored via stolen npm token; GitHub Actions CI/CD secrets harvested; spreads to Go ecosystem"
    sources:
      - url: "https://socket.dev/blog/miasma-mini-shai-hulud-hits-leoplatform-npm-packages-go-ecosystem"
        publisher: "Socket Security"
        date: "2026-06-25"
        role: "primary"
      - url: "https://thehackernews.com/2026/06/miasma-malware-targets-npm-packages-and.html"
        publisher: "The Hacker News"
        date: "2026-06-26"
        role: "corroborating"
    discovery_trace: "first seen at: THN feed (feed bridge) → https://thehackernews.com/2026/06/miasma-malware-targets-npm-packages-and.html → primary: Socket Security https://socket.dev/blog/miasma-mini-shai-hulud-hits-leoplatform-npm-packages-go-ecosystem"
    summary: |
      Socket Security disclosed on 2026-06-25 that 24 npm packages associated with the LeoPlatform and
      RStreams serverless data-pipeline ecosystem (including leo-sdk, leo-auth, leo-aws, leo-cli) were
      backdoored by the Miasma/Mini Shai-Hulud worm after an attacker obtained a stolen npm token for
      publisher account "czirker". The malware exploits a "Phantom Gyp" execution pattern: malicious
      binding.gyp files trigger code execution during npm install without visible preinstall hooks; ROT
      cipher and AES-GCM decryption then decode a JavaScript loader that downloads the Bun runtime,
      harvests developer credentials (npm tokens, GitHub PATs, AWS access keys, SSH private keys, Docker
      auth, Kubernetes configs, AI agent API keys from Cursor/Claude/Copilot settings), and exfiltrates
      them to attacker-controlled GitHub repositories via AES-128-GCM encrypted blobs. A second GitHub
      Actions workflow named "Run Copilot" captures CI/CD environment secrets. A separate Go module
      (verana-blockchain v0.10.1-dev.20) was compromised via a .claude/index.js file triggering execution
      on VS Code folder-open. This is the latest wave in the ongoing Miasma campaign family; prior waves
      hit immobiliarelabs and bioinformatics packages.
    ch_eu_nexus: "Any Swiss or European software team using LeoPlatform/RStreams or running the affected npm packages in CI/CD pipelines has their cloud credentials and secrets at risk"
    public_sector_nexus: "indirect — public-sector development teams using these packages are exposed"
    sector: "software, cloud, DevOps"
    cves: []
    actors_campaigns_malware: ["Miasma", "Mini Shai-Hulud", "Hades"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "The attack exploited a 'Phantom Gyp' execution pattern where malicious binding.gyp files triggered code execution during npm installation without visible preinstall scripts. The payload harvested developer and CI/CD credentials (npm tokens, GitHub tokens, AWS keys, SSH keys, Docker auth, Kubernetes configs, AI agent settings), targeted GitHub Actions workflows for secret exfiltration."
        attribution: "Socket Security"
        source_url: "https://socket.dev/blog/miasma-mini-shai-hulud-hits-leoplatform-npm-packages-go-ecosystem"
    extended_notes: |
      ATT&CK: T1195.002 (Compromise Software Supply Chain), T1552.001 (Credentials in Files),
      T1552.004 (Private Keys), T1059.007 (JavaScript), T1027 (Obfuscated Files or Information).
      Detection: npm audit / Socket.dev scanning for binding.gyp-based code execution triggers in
      installed packages; SIEM alert on unexpected outbound connections to GitHub APIs from CI/CD
      runner processes; EDR process creation alert for bun.exe spawned from node_modules/.bin;
      review GitHub Actions logs for workflows named "Run Copilot" or similar AI-impersonation names
      added without authorisation.
      Hardening: pin exact npm package versions in package-lock.json / lockfile; enable npm audit in
      CI/CD pipelines; restrict npm token permissions to minimum required; rotate all cloud credentials
      from CI/CD environments that ran any of the affected LeoPlatform/RStreams packages since 2026-06-20;
      enable GitHub secret scanning on repositories.

