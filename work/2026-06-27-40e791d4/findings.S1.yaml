  - title: "CVE-2026-12569 — PTC Windchill PDMlink / FlexPLM: pre-auth RCE via Java deserialization, actively exploited with JSP web shells (CISA KEV due 2026-06-28)"
    sources:
      - url: "https://thehackernews.com/2026/06/cisa-adds-exploited-ptc-windchill-rce.html"
        publisher: "The Hacker News"
        date: "2026-06-26"
        role: "primary"
      - url: "https://nvd.nist.gov/vuln/detail/CVE-2026-12569"
        publisher: "NVD/NIST"
        date: "2026-06-26"
        role: "corroborating"
      - url: "https://euvd.enisa.europa.eu/enisa/eu_vulnerability_database/EUVD-2026-37831"
        publisher: "ENISA EUVD"
        date: "2026-06-26"
        role: "corroborating"
    discovery_trace: "first seen at: cisa-kev bridge → CVE-2026-12569 newly added 2026-06-25 with due date 2026-06-28 → THN primary article https://thehackernews.com/2026/06/cisa-adds-exploited-ptc-windchill-rce.html → NVD corroboration https://nvd.nist.gov/vuln/detail/CVE-2026-12569 → ENISA EUVD corroboration"
    summary: |
      CVE-2026-12569 (CVSS 4.0: 9.3 / CVSS 3.1: 9.8 Critical) is an unauthenticated remote code execution
      vulnerability in PTC Windchill PDMlink and PTC FlexPLM, enterprise-grade PLM and PDM software widely
      deployed in manufacturing, automotive, aerospace and pharmaceutical organisations. The root cause is
      deserialization of untrusted data (CWE-502) combined with improper input validation (CWE-20) in the
      Windchill HTTP API; an unauthenticated remote attacker sends a specially crafted HTTP request containing
      a malicious Java serialized object which is deserialized server-side and executes arbitrary code.
      Active exploitation was confirmed by CISA when it added the CVE to the KEV catalog on 2026-06-25 with
      a mandatory remediation deadline of 2026-06-28 for federal agencies (BOD 26-04). Observed post-exploitation
      artefacts include JSP web shells deployed to the path /Windchill/login/<16-hex-char-name>.jsp and a
      persistence marker file flst.txt written to /tmp or the Windchill working directory. Affected versions
      span all PTC Windchill PDMlink and FlexPLM releases up to and including versions 11.0 M030, 11.1 M020,
      11.2.1.0, 12.0.2.0, 12.1.2.0/3.0 and 13.x series through 13.1.3.0; no named threat actor cluster has
      been publicly attributed, though the web-shell pattern and target sector are consistent with financially
      and espionage-motivated actors.
    ch_eu_nexus: "PTC Windchill is deployed in Swiss and European manufacturing, pharma and aerospace supply chains; public-sector engineering organisations using Windchill PDMLink are exposed"
    public_sector_nexus: "indirect — PLM platforms are used in defence procurement and public-sector engineering programmes"
    sector: "manufacturing, aerospace, automotive, pharma, defence"
    cves: [CVE-2026-12569]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "CISA added CVE-2026-12569 (CVSS 9.3) to its Known Exploited Vulnerabilities catalog on June 25, 2026. Active exploitation was confirmed post-patch release, with threat actors deploying JSP web shells against vulnerable systems using filenames matching the pattern /Windchill/login/[0-9a-f]{16}.jsp"
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/06/cisa-adds-exploited-ptc-windchill-rce.html"
      - quote: "A critical remote code execution (RCE) vulnerability has been reported in PTC Windchill PDMlink and PTC FlexPLM. The vulnerability may be exploited through the deserialization of untrusted data."
        attribution: "ENISA EUVD"
        source_url: "https://euvd.enisa.europa.eu/enisa/eu_vulnerability_database/EUVD-2026-37831"
    extended_notes: |
      ATT&CK: T1190 (Exploit Public-Facing Application), T1505.003 (Web Shell).
      Prerequisites: none — unauthenticated, network-reachable HTTP/HTTPS interface.
      Detection: web-server access logs for POST requests hitting the Windchill servlet endpoint
      containing Base64-encoded serialized Java objects; EDR process tree where PTC Windchill
      service accounts spawn cmd.exe/bash children; file-creation alerts for *.jsp in
      /Windchill/login/; creation of flst.txt in /tmp.
      Hardening: patch per PTC advisory CS473270; if patch cannot be applied immediately,
      restrict WebDAV/HTTP port access to internal networks via WAF; disable serialization
      endpoints where PTC guidance allows.
      CISA KEV due date for US federal agencies: 2026-06-28.

