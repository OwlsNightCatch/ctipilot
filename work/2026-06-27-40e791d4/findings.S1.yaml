    discovery_trace: "first seen at: ncsc-nl recent (bridge) → NCSC-2026-0179 → Check Point blog primary → NVD corroboration"
    summary: |
      CVE-2026-50751 (CVSS 9.3 Critical, CWE-287 Improper Authentication) is an authentication bypass in
      Check Point Quantum Security Gateways and Spark Firewalls affecting Remote Access VPN and Mobile Access
      when the deprecated IKEv1 key exchange protocol is in use. A logic flaw in IKEv1 certificate validation
      allows an unauthenticated remote attacker to establish a VPN session without possessing a valid user
      password. The companion flaw CVE-2026-50752 (CVSS 7.4, CWE-295 Improper Certificate Validation) enables
      a man-in-the-middle attack against IKEv1 site-to-site VPN connections. CVE-2026-50751 was exploited as
      a zero-day from at least 2026-05-07; in at least one confirmed case post-exploitation involved ransomware
      deployment, attributed by Check Point to a Qilin ransomware affiliate. Public PoC code is now available,
      and NCSC-NL warns of imminent large-scale exploitation. Affected products span Quantum Security Gateway
      (R80.40 through R82.10) and Spark Firewall lines (R80.20.X, R81.10.X, R82.00.X); hotfixes are released
      (sk185033 / sk185035). The flaw requires IKEv1 to be enabled — organisations using only IKEv2 are not
      affected.
