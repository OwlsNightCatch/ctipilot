  - title: "Tata Electronics (Apple/Tesla supplier) confirms World Leaks ransomware breach — 630 GB of manufacturing trade secrets posted"
    sources:
      - url: "https://techcrunch.com/2026/06/22/tata-electronics-a-major-tech-supplier-to-apple-and-tesla-confirms-data-breach/"
        publisher: "TechCrunch"
        date: "2026-06-22"
        role: "primary"
      - url: "https://www.bleepingcomputer.com/news/security/tata-electronics-confirms-cyberattack-as-hackers-leak-data/"
        publisher: "BleepingComputer"
        date: "2026-06-23"
        role: "corroborating"
      - url: "https://securityaffairs.com/194237/data-breach/tata-electronics-confirms-data-breach-after-630gb-leak-claim-targets-apple-and-tesla.html"
        publisher: "Security Affairs"
        date: "2026-06-25"
        role: "corroborating"
    discovery_trace: "first seen at: securityaffairs feed, URL https://securityaffairs.com/feed → pivot: securityaffairs article URL https://securityaffairs.com/194237/... → primary: TechCrunch article https://techcrunch.com/2026/06/22/..."
    summary: |
      Tata Electronics — a Tata Group subsidiary and major electronics manufacturing services supplier to Apple (iPhone circuit board components) and Tesla (EV manufacturing documentation) — confirmed on June 22, 2026, that a cybersecurity incident affected parts of its IT infrastructure "a few weeks ago." The World Leaks ransomware group published 630 GB of data (204,300+ files) on June 10, 2026, including a 52-page Apple-proprietary quality inspection standard for iPhone PCB components and Tesla Model 3/Y documents marked "TRADE SECRET." Tata confirmed its operational continuity was not materially disrupted. Apple confirmed it was investigating; a ransom demand was made to Tata per Reuters. World Leaks is widely assessed as a rebrand of Hunter's International ransomware cartel, operational since early 2025.

      **Operational lessons:** Supply chain breach where a Tier 1 contract manufacturer held sensitive principal-company IP (Apple and Tesla design documentation). The exfiltrated data represents both a competitive intelligence loss and a social-engineering enabler — document templates, circuit-board specs, and employee passport scans provide high-fidelity pretexting material for follow-on attacks against Apple/Tesla employees or their suppliers. Defenders in the automotive and consumer-electronics supply chain should audit data-handling contracts with contract manufacturers, verify that principal-company confidential documents are subject to DRM or data-loss-prevention controls that prevent bulk exfiltration, and red-team the question of what data a contract manufacturer actually holds beyond the minimum necessary.
    ch_eu_nexus: "global; limited direct CH/EU nexus — Apple and Tesla have significant European operations that depend on Tata's manufacturing output; employee passport scans may include EU data subjects"
