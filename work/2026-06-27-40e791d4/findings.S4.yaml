  - title: "KDDI breach: third-party email platform vulnerability exposes 14.22 million addresses and passwords across six Japanese ISPs"
    sources:
      - url: "https://www.infosecurity-magazine.com/news/kddi-breach-japanese-telcos/"
        publisher: "Infosecurity Magazine"
        date: "2026-06-24"
        role: "primary"
      - url: "https://www.theregister.com/cyber-crime/2026/06/24/you-have-got-to-be-kddi-ng-japanese-telco-exposes-142-million-managed-email-credentials/5260555"
        publisher: "The Register"
        date: "2026-06-24"
        role: "corroborating"
      - url: "https://www.japantimes.co.jp/business/2026/06/24/companies/kddi-data-breach-cyberattack/"
        publisher: "The Japan Times"
        date: "2026-06-24"
        role: "corroborating"
    discovery_trace: "first seen at: infosecurity-magazine RSS feed, URL https://www.infosecurity-magazine.com/rss/news/ → article drill: https://www.infosecurity-magazine.com/news/kddi-breach-japanese-telcos/ → corroborating: The Register"
    summary: |
      KDDI, Japan's second-largest telco, detected on June 17, 2026, that an attacker had exploited a vulnerability in third-party software running on the email infrastructure KDDI manages and provides to partner ISPs, potentially exposing up to 14.22 million email addresses and passwords. Six ISPs are affected: STNet (Pikara services), KDDI Web Communications (CPI rental server), JCOM (J:COM NET and cable TV email), Chubu Telecommunications (COMINA Hikari, Business COMINA), Nifty Corporation (@nifty email), and Biglobe (BIGLOBE email). Some passwords were stored in hashed or encrypted form. KDDI stopped the intrusion the same day it was detected, notified Japan's Personal Information Protection Commission (PPC) and the Ministry of Internal Affairs and Communications (MIC), and directed affected customers to change email credentials immediately. The third-party software vendor is not named in public disclosures.

      **Operational lessons:** Shared email infrastructure managed by a single telco across multiple ISP brands created a single point of compromise for 14M+ accounts. The attack vector — a vulnerability in unnamed third-party software — highlights the risk of delegating critical email authentication infrastructure to external vendors without independent security validation. Defenders running shared hosted services should apply the same vulnerability management lifecycle (discovery → patch → verify) to third-party components as to first-party code. Incident notification was to national regulators (PPC, MIC) within days — a model for GDPR Article 33 equivalent reporting. The exposed credentials represent a high-value corpus for credential-stuffing attacks against other services where email is used as an authentication factor.
