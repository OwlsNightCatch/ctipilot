  - title: "River Financial Corporation (River Bank & Trust) — SEC 8-K Item 1.05 ransomware filing: network compromised June 16, ransomware deployed"
    sources:
      - url: "https://www.sec.gov/Archives/edgar/data/0001641601/000119312526282946/ck0001641601-20260619.htm"
        publisher: "SEC EDGAR"
        date: "2026-06-25"
        role: "primary"
      - url: "https://www.stocktitan.net/sec-filings/RVRF/8-k-river-financial-corp-reports-material-event-3e0a30b705d5.html"
        publisher: "StockTitan (EDGAR filing mirror)"
        date: "2026-06-25"
        role: "corroborating"
    discovery_trace: "first seen at: bridge:sec-edgar 8k 2026-06-25 2026-06-27 1.05 → primary (no pivot needed): SEC EDGAR filing URL https://www.sec.gov/Archives/edgar/data/0001641601/000119312526282946/ck0001641601-20260619.htm"
    summary: |
      River Financial Corporation (OTC: RVRF), parent of River Bank & Trust, filed a Form 8-K Item 1.05 (Material Cybersecurity Incident) with the SEC on June 25, 2026. An unauthorized threat actor accessed River Financial's network environment — including River Bank & Trust's systems — on or around June 16; ransomware was deployed across portions of the server environment. The company detected the activity on June 19, a three-day dwell time, and took immediate containment measures including disabling affected administrative accounts and taking impacted systems offline. A third-party forensic firm has been engaged. As of the filing, the full scope — including whether personally identifiable information was accessed or exfiltrated — has not been determined; the company committed to filing a 4-day amendment when material additional information is available.

      **Operational lessons:** The three-day detection gap (June 16 access, June 19 detection) is consistent with a pattern of attackers deploying ransomware after initial reconnaissance. For community banks and regional financial institutions, key detection telemetry includes: anomalous administrative account activity (lateral movement via domain admin — Event ID 4624 Type 3/10 from unusual source hosts), unusual volume of file read/access to file share paths (Windows Security Event 4663 on sensitive shares), shadow copy deletion (`vssadmin delete shadows` — Sysmon EID 1 with parent cmd/powershell), and endpoint EDR alerts on process injection from lsass or LSASS credential access behaviours. Patch and credential hygiene on VPN/RDP ingress points remain the most likely initial vector class for regional bank ransomware.
    ch_eu_nexus: "US regional bank; no direct CH/EU nexus — operational pattern lesson applicable to EU community banks"
