  - title: "Polymarket $2.94M crypto theft via third-party frontend vendor injection — prediction-market platform refunding users"
    sources:
      - url: "https://techcrunch.com/2026/06/25/polymarket-says-hackers-stole-users-funds/"
        publisher: "TechCrunch"
        date: "2026-06-25"
        role: "primary"
      - url: "https://securityaffairs.com/194266/security/third-party-breach-at-polymarket-leads-to-2-94m-crypto-theft.html"
        publisher: "Security Affairs"
        date: "2026-06-26"
        role: "corroborating"
      - url: "https://www.securityweek.com/3-million-reportedly-stolen-in-polymarket-hack/"
        publisher: "SecurityWeek"
        date: "2026-06-26"
        role: "corroborating"
    discovery_trace: "first seen at: securityaffairs feed, URL https://securityaffairs.com/feed → article drill: https://securityaffairs.com/194266/... → primary: TechCrunch https://techcrunch.com/2026/06/25/polymarket-says-hackers-stole-users-funds/"
    summary: |
      Polymarket, a decentralised prediction market platform running on Polygon, confirmed on June 25-26, 2026, that a third-party vendor compromise allowed attackers to inject malicious JavaScript into its frontend, resulting in theft of approximately $2.94M in pUSD (Polymarket's USDC-backed stablecoin) from at least 11 user wallets. The stolen funds were bridged from Polygon to Ethereum and converted to 1,893 ETH. Polymarket patched the vulnerability and committed to fully reimbursing affected users. This is the platform's second breach in two months — a prior incident in May 2026 involved a $700K loss from a six-year-old private-key compromise of an internal operations wallet.

      **Operational lessons:** Web-supply-chain injection (T1195.002) via a compromised third-party JavaScript vendor is the same attack class as the 2022 Magecart campaigns and the 2025 Polyfill.io poisoning. For web applications handling financial assets, defenders should: enforce Content Security Policy (CSP) restricting script execution to approved sources; implement Subresource Integrity (SRI) hashes for all third-party script includes; monitor for unexpected script-src additions in the DOM (browser extension telemetry or synthetic monitoring with hash verification); and audit third-party vendor access to production CDN/build pipelines regularly (T1195.002, T1071.001).
    ch_eu_nexus: "global crypto platform; no direct CH/EU nexus beyond Swiss residents holding pUSD assets"
