  - title: "UPDATE: Klue/Icarus Salesforce breach — victim list expands to ~24 firms, Icarus itself hacked, second extortion actor emerges"
    sources:
      - url: "https://www.securityweek.com/more-klue-breach-victims-identified-as-hackers-get-hacked/"
        publisher: "SecurityWeek"
        date: "2026-06-26"
        role: "primary"
      - url: "https://techcrunch.com/2026/06/25/hacked-klue-says-criminals-are-deleting-stolen-customer-data-but-now-other-hackers-are-making-threats/"
        publisher: "TechCrunch"
        date: "2026-06-25"
        role: "corroborating"
    discovery_trace: "first seen at: securityweek RSS feed, URL https://www.securityweek.com/feed/ → primary: SecurityWeek article, URL https://www.securityweek.com/more-klue-breach-victims-identified-as-hackers-get-hacked/"
    summary: |
      The Klue/Icarus Salesforce OAuth breach (originally covered 2026-06-19, with rolling deltas) hit a new phase on June 26: approximately two dozen companies have now publicly notified customers, up from nine named on June 23 and eleven on June 25. New named victims include Blackbaud, Autodesk, Deel, AlertMedia, Camunda, Cresta, Lucanet, Link11, and Tines — in addition to the previously covered BeyondTrust, LastPass, HackerOne, Huntress, Jamf, and others. The attacker (Icarus) is alleged by Klue to have been themselves compromised, with their leaked dataset now in the hands of a second unnamed extortion actor running an independent campaign; Icarus's Tor leak site went offline, suggesting either ransom payment or takedown. The root cause remains a legacy OAuth integration credential at Klue that provided mass access to 195 customers' Salesforce environments via the platform's CRM connector. The Klue-Salesforce integration connector was disabled by both Salesforce and Gong on June 17 as a containment measure.

      **Operational lessons:** The attack exploited the over-privileged nature of SaaS integration credentials — a single legacy credential at a third-party integration vendor translated to bulk CRM data exfiltration across ~195 customer Salesforce orgs. Defenders should audit and revoke dormant OAuth integration tokens; Salesforce admins should review Connected Apps with write or export scopes granted to third-party integration vendors. Detection telemetry: anomalous Salesforce API bulk-export activity outside business hours from an integration service account (e.g., Salesforce Event Monitoring logs: `LightningInteraction`, `API Total Usage`, `ReportExport` event types) or sudden new OAuth grant from an existing Connected App.
    ch_eu_nexus: "Lucanet (Germany-based financial software vendor) and Link11 (Germany-based DDoS mitigation provider) are newly named EU-domiciled victims; Blackbaud serves European nonprofits and public-sector bodies"
    public_sector_nexus: "indirect — Blackbaud serves charities and universities; Autodesk customer base includes public-sector design/architecture users"
