  - title: "Turla STOCKSTAY: modular .NET backdoor deployed against Ukraine and European diplomatic targets (Google GTIG)"
    sources:
      - url: "https://cloud.google.com/blog/topics/threat-intelligence/stockstay-turla-intelligence-gathering"
        publisher: "Google Cloud / GTIG (Mandiant)"
        date: "2026-06-26"
        role: "primary"
      - url: "https://therecord.media/russia-turla-espionage-ukraine-stockstay-malware"
        publisher: "The Record"
        date: "2026-06-26"
        role: "corroborating"
    discovery_trace: "first seen at: hackernews feed, THN article 2026-06-26 → pivot: WebSearch 'Turla STOCKSTAY backdoor .NET Ukraine 2026 Google GTIG technical analysis' → primary: GTIG blog, URL https://cloud.google.com/blog/topics/threat-intelligence/stockstay-turla-intelligence-gathering → corroborating: The Record, URL https://therecord.media/russia-turla-espionage-ukraine-stockstay-malware"
    summary: |
      Google Threat Intelligence Group (GTIG) published a comprehensive analysis (2026-06-26) of STOCKSTAY, a four-component .NET backdoor deployed by Turla (FSB Center 16, SUMMIT, Secret Blizzard) against Ukrainian government, military, and European diplomatic targets since December 2022.

      STOCKSTAY is architecturally partitioned into four specialised components communicating via WM_COPYDATA inter-process messages: STOCKSTAY.STOCKBROKER ("net") — a proxy-aware WebSocket tunneller using the open-source websocket-sharp library; STOCKSTAY.STOCKMARKET ("cor") — the orchestrator that generates 4096-bit RSA key pairs on first execution; STOCKSTAY.STOCKTRADER ("sys") — the backdoor executor supporting 15+ command types (Dir, Get, Put, Run, RegRead/Write/Delete, Image/screenshot, Sysinfo via WMI, UnpackArchive, MultyTask, self-destruct); and STOCKSTAY.MARKETMAKER — a downloader/installer that establishes Registry Run Key persistence masquerading as "MicrosoftUpdateOneDrive."

      The C2 protocol wraps responses in an RSA-4096 encrypted "CryptoContainer" JSON structure; configuration is AES-encrypted using hostname/domain-name environmental keying (post-reconnaissance phase) or a hard-coded password (initial-access phase). The Python Tornado WebSocket server controller, exposed on a public GitHub repository (ChikenFresh/google-ai-labs-it), stores victim data in SQLite (weather_data1.db), hosted on Render.com platforms. Working hours are enforced (09:00–18:00 Mon–Fri), with configurable sleep intervals.

      STOCKSTAY shares code with Kazuar (K1MORPHER Squirrel3-based string obfuscation introduced April 2025, environmental keying, identical component separation pattern) suggesting a common developer team. The campaign exploited CVE-2025-8088 (WinRAR path traversal) for delivery from November 2025, and also used malicious RDP configuration files and diplomatic-themed phishing lures (drone content, military logistics, diplomatic education platforms). Key MITRE ATT&CK TTPs: T1566.001/.002 (phishing), T1547.001/.005 (Registry Run Keys / Startup Folder), T1027 (K1MORPHER obfuscation), T1036.005 (masquerading), T1480 (environmental keying), T1071.001 (WebSocket C2), T1560.001 (ZIP/base64 exfiltration), T1082 (Sysinfo/WMI).

      Detection: monitor DNS to *.onrender.com / *.glitch.me from endpoints; alert on LNK/RDP file writes to staging directories (Sysmon EID 11); registry Run key creation pointing to user-space paths (EID 4657/13); WM_COPYDATA inter-process messages between unknown processes in EDR telemetry; K1MORPHER-patterned .NET assemblies (Squirrel3 RNG import). GTIG published YARA rules and Google SecOps detection rules publicly. Hardening: block Render.com WebSocket traffic at perimeter where not legitimately required; patch CVE-2025-8088 (WinRAR); GPO to restrict RDP file auto-connection.
    ch_eu_nexus: "High — primary EU targets: Italy, Netherlands, Poland, Germany. Switzerland (diplomatic, defence-adjacent entities) directly in threat profile. Turla/FSB actor with documented operations across DACH region."
