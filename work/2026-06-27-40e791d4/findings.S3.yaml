  - title: "Miasma/Mini Shai-Hulud npm supply chain worm: 'Phantom Gyp' binding.gyp evasion hits 23 LeoPlatform and RStreams packages plus Go ecosystem"
    sources:
      - url: "https://socket.dev/blog/miasma-mini-shai-hulud-hits-leoplatform-npm-packages-go-ecosystem"
        publisher: "Socket Security"
        date: "2026-06-26"
        role: "primary"
      - url: "https://research.jfrog.com/post/shai-hulud-miasma-alright-lets-see-if-this-works/"
        publisher: "JFrog Security Research"
        date: "2026-06-26"
        role: "corroborating"
    discovery_trace: "first seen at: hackernews feed, THN article 2026-06-26 → pivot: WebSearch 'Miasma malware npm Mini Shai-Hulud Hades supply chain LeoPlatform RStreams Go 2026' → primary: Socket Security blog, URL https://socket.dev/blog/miasma-mini-shai-hulud-hits-leoplatform-npm-packages-go-ecosystem → corroborating: JFrog, URL https://research.jfrog.com/post/shai-hulud-miasma-alright-lets-see-if-this-works/"
    summary: |
      Socket Threat Research documented a fresh wave of the Mini Shai-Hulud / Miasma / Hades supply chain worm family (2026-06-26), with 23 malicious versions published in a tight window on 2026-06-24 across the LeoPlatform data-pipeline and RStreams npm ecosystems, plus a Go module compromise of Verana Blockchain.

      The defining technical novelty is the "Phantom Gyp" execution pattern: instead of a visible `preinstall`/`postinstall` script in `package.json`, the attacker adds a `binding.gyp` file. npm automatically invokes `node-gyp` when this file is present; the `binding.gyp` uses command expansion to execute JavaScript during the build configuration phase, bypassing static scanners that inspect only `scripts` hooks. This is a deliberate improvement on prior Miasma activity.

      Execution chain: `binding.gyp` command expansion → `index.js` (Caesar/ROT + AES-GCM + JavaScript-obfuscator) decodes first-stage loader → Bun runtime installed and resolved → credential-theft payload executes under Bun. The payload exfiltrates `.env` files, npm/PyPI/GitHub tokens, SSH keys, Docker/Kubernetes configs, AWS/Azure/GCP credentials, Vault data, shell history, CI secrets, and IDE/AI-agent configurations including Claude, VS Code, Cursor and Copilot settings. EDR product checks for CrowdStrike, SentinelOne, Defender, Carbon Black, Cylance, Qualys; Russian locale guards present.

      GitHub Actions is heavily targeted: the campaign searches for publishing workflows and collects secrets from runner context. The recurring dead-drop marker "RevokeAndItGoesKaboom" links this wave to the codfish/semantic-release-action compromise (1,442 dependent repositories). The Go module compromise (github.com/verana-labs/verana-blockchain@v0.10.1-dev.20) places obfuscated payloads at `.claude/index.js` triggered by VS Code folder-open tasks.

      Compromised npm accounts: `czirker` (LeoPlatform publisher) and `llxlr` (three additional packages). MITRE TTPs: T1195.001 (supply chain compromise), T1195.002 (compromised software), T1105 (Bun staging), T1555 (credentials in software), T1041 (GitHub API exfil), T1547.013 (IDE/AI-agent hooks). Detection: alert on `node-gyp` spawning JavaScript evaluation from `binding.gyp`; `node` or `bun` processes spawned by npm install; network connections to GitHub API (`api.github.com`) from npm/pip post-install hooks; unexpected CI secret access from runner workflows. Hardening: audit npm registry for binding.gyp in all direct and transitive dependencies; enable npm audit in CI; block outbound GitHub API calls from CI workers except on explicit allowed paths.
    ch_eu_nexus: "Moderate — affects any Swiss/EU development team consuming LeoPlatform, RStreams, or the 20 affected packages; cloud credential theft reaches AWS/Azure/GCP deployments globally."
    public_sector_nexus: "indirect"
    sector: "technology, software development, cloud"
