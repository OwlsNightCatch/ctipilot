  - title: "SANS ISC: Linux process name masquerading via prctl(PR_SET_NAME) — detection blind spots in ps/top, Auditd, and eBPF-based approaches"
    sources:
      - url: "https://isc.sans.edu/diary/33102"
        publisher: "SANS Internet Storm Center"
        date: "2026-06-24"
        role: "primary"
    discovery_trace: "first seen at: SANS ISC RSS feed, URL https://isc.sans.edu/diary/rss/33102 → primary (no pivot needed): SANS ISC, URL https://isc.sans.edu/diary/33102"
    summary: |
      SANS ISC handler Xavier Mertens published (2026-06-24) a detection-engineering diary documenting how Linux malware can masquerade its process name via `prctl(PR_SET_NAME, ...)`, the syscall that writes to `/proc/<pid>/comm`. The diary demonstrates how a process running as `./ps-masquerade` can appear in `ps`, `top`, and `pgrep -n` output as `[kworker/0:1-events]` — a standard kernel worker thread name — making it visually indistinguishable from legitimate kernel activity during manual triage.

      Two process-name storage locations matter for detection: `/proc/<pid>/comm` (the 15-character comm field altered by `prctl`) and `/proc/<pid>/cmdline` (the full command line, typically reflecting the original executable path unless the argv[0] fixed-size buffer is also overwritten). Discrepancies between comm and cmdline can flag masquerading, but malware can overwrite both argv and environ blocks since argv[0] resides in a fixed-size allocation the kernel will not grow. The diary cites Operation Highland Velvet Ant (Sygnia research) as a real-world example of this technique.

      Detection approaches discussed: (1) Auditd rule on `prctl` syscall with `PR_SET_NAME` argument — catches the syscall but cannot easily correlate with original binary path in all cases; (2) Kunai (eBPF-based process monitoring) — captures the real command line at exec time and persists it independently of comm-field mutation, making it robust against post-exec `prctl` masquerading. MITRE ATT&CK T1036 (Masquerading). Hunt artefact: any process where `/proc/<pid>/comm` resembles a kernel worker thread name (e.g., `[kworker/*]`, `[kthreadd]`, `[migration/*]`) but `/proc/<pid>/cmdline` is non-empty (kernel threads have empty cmdline).
    ch_eu_nexus: "Moderate — technique documented in active threat campaigns; applicable to any Linux endpoint or server monitoring."
    public_sector_nexus: "indirect"
    sector: "all — Linux endpoint monitoring"
    cves: []
    actors_campaigns_malware: ["Velvet Ant"]
    verification: SINGLE-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "A proof-of-concept program masks a process as [kworker/0:1-events] while actually running ./ps-masquerade, with prctl(PR_SET_NAME) altering the comm field in /proc/<pid>/comm"
        attribution: "SANS Internet Storm Center"
        source_url: "https://isc.sans.edu/diary/33102"

