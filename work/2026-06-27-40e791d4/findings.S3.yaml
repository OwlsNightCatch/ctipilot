  - title: "Microsoft documents 'Photo ZIP' hospitality phishing — Calendly email auth-laundering drops Node.js TonRAT implant with dual RunOnce self-refresh persistence"
    sources:
      - url: "https://www.microsoft.com/en-us/security/blog/2026/06/25/photo-zip-campaign-targeting-hospitality-industry-delivers-node-js-implant-persistent-access/"
        publisher: "Microsoft Threat Intelligence"
        date: "2026-06-25"
        role: "primary"
    discovery_trace: "first seen at: hackernews feed, THN article 2026-06-26 → pivot: WebSearch 'hotel hospitality phishing photo ZIP Node.js implant Microsoft threat intelligence June 2026' → primary: Microsoft Security Blog, URL https://www.microsoft.com/en-us/security/blog/2026/06/25/photo-zip-campaign-targeting-hospitality-industry-delivers-node-js-implant-persistent-access/"
    summary: |
      Microsoft Threat Intelligence published a detailed two-wave technical breakdown (2026-06-25) of an active campaign targeting hospitality front-desk systems across Europe and Asia since April 2026. The campaign is unattributed but shows disciplined obfuscation evolution and investment in persistence suggestive of preparation for more invasive follow-on activity.

      Initial access: phishing emails with a "Booking Manager (via Calendly)" display name route through Calendly's SendGrid infrastructure, passing SPF/DKIM/DMARC authentication laundering, before redirecting via share.google to Cloudflare-fronted .cfd landing pages serving `photo-<random>.zip`. The archive contains `IMG-<random>.png.lnk` shortcuts (1,989–2,079 bytes) masquerading as PNG images. Wave 2 renamed to PHOTO- prefix and shifted to Cloudflare-fronted .cfd domains.

      Execution chain: LNK → multi-phase obfuscated PowerShell (seven decoder variants documented: XOR/subtraction BigInt → hex-to-decimal → modulo/division → for-loop arithmetic mask, progressively hardening each wave) → Wave 2 adds `.NET DLL compilation via csc.exe → cvtres.exe` (T1027.004 Compile After Delivery) → download Node.js v24.13.0 runtime → execute random-named `.js` payload as `node.exe`. The Node.js implant (TonRAT/Wacatac) communicates C2 on non-standard ports (8443, 8445, 8453, 5555, 56001–56003) and performs geolocation via `ip-api.com`, browser automation with `--headless --no-sandbox`, and environment discovery.

      Persistence model is the key technical novelty: dual registry — `HKCU\Run` for the Node.js component and `HKCU\RunOnce` for a PE payload in `C:\ProgramData\<random>\`. After each execution, the payload refreshes the RunOnce key, creating a self-perpetuating loop that frustrates standard cleanup (removing only one key leaves the other to re-install on next logon). Windows Defender Exclusions are added via `Add-MpPreference -ExclusionProcess` to exempt temp executables from scanning. MITRE TTPs: T1566.002, T1204.002, T1059.001/.007, T1027/.004, T1036, T1562.001, T1547.001, T1571 (non-standard port).

      Detection: alert on node.exe spawned from user AppData paths (Sysmon EID 1, parent: PowerShell/cmd); csc.exe + cvtres.exe sequence outside CI pipelines; `Add-MpPreference -ExclusionProcess` for temp paths (Sysmon EID 13 registry); RunOnce key writing after each execution of the same process. Hunt: hospitality-sector endpoints with node.js in `%LOCALAPPDATA%\Nodejs\` running random-named .js files. IMPORTANT: cleanup must remove BOTH HKCU\Run and HKCU\RunOnce keys simultaneously.
    ch_eu_nexus: "Moderate-High — campaign targets European hospitality organisations (Polish, French, Czech language target evidence); Swiss hotels and hospitality chains running front-desk Windows systems directly at risk."
    public_sector_nexus: "indirect"
    sector: "hospitality, tourism"
    cves: []
    actors_campaigns_malware: ["TonRAT", "Wacatac", "PureRat"]
    verification: SINGLE-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Phishing emails routed through Calendly's SendGrid infrastructure, with emails passing SPF, DKIM, and DMARC checks despite malicious intent"
