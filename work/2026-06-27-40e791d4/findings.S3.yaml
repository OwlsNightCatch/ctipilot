  - title: "StrikeShark / SharkLoader — Kaspersky GReAT documents a new Chinese-suspected espionage loader deploying Cobalt Strike via Perfect DLL Hijacking and API hook evasion"
    sources:
      - url: "https://securelist.com/strikeshark-campaign/120326/"
        publisher: "Kaspersky Securelist (GReAT)"
        date: "2026-06-26"
        role: "primary"
      - url: "https://www.helpnetsecurity.com/2026/06/26/sharkloader-dropper-governments-software-developers/"
        publisher: "Help Net Security"
        date: "2026-06-26"
        role: "corroborating"
    discovery_trace: "first seen at: hackernews feed, THN article 2026-06-26 → pivot: WebSearch 'SharkLoader StrikeShark Cobalt Strike loader Kaspersky Indonesia Taiwan government 2026' → primary: Kaspersky Securelist, URL https://securelist.com/strikeshark-campaign/120326/ → corroborating: Help Net Security, URL https://www.helpnetsecurity.com/2026/06/26/sharkloader-dropper-governments-software-developers/"
    summary: |
      Kaspersky GReAT published a full technical analysis (2026-06-26) of SharkLoader, a previously undocumented loader used in a cluster they track as StrikeShark, assessed with low confidence as a Chinese-speaking threat actor based on development tool overlap (FScan, Searchall, Pillager were written by Chinese-speaking developers on GitHub).

      SharkLoader's architectural centrepiece is "Perfect DLL Hijacking": it abuses legitimate Windows executables (SystemSettings.exe, msedge.exe, PrintDialog.dll) to DLL sideload malicious components, then forcibly releases `LdrpLoaderLock` and decrements `LdrpWorkInProgress` before spawning threads from `DllMain` to avoid Windows loader deadlocks — an unusual and technically sophisticated pattern.

      Two encrypted modules carry the core logic: DscCoreR.mui (Blowfish ECB, 16-byte key from file header) and SyncRes.dat (AES-128, key/IV embedded in first 32 bytes). After reflective loading, SyncRes.dat installs Microsoft Detours hooks across 50+ Windows APIs: EtwEventWrite/EventWriteEx (ETW nulled), VirtualProtect (manages RWX during Cobalt Strike), CreateProcessA/W (spoofs svchost.exe as PPID via T1134.004), and several direct-syscall stubs built with jitasm runtime code generation. MinHook intercepts VirtualAlloc and Sleep to demote Beacon memory from RWX to RW during sleep, evading memory-scanner tools.

      Initial access via exploitation of public-facing services: CVE-2021-26855 (ProxyLogon), CVE-2022-41082 (Exchange), CVE-2023-32315 (Openfire), CVE-2024-36401 (GeoServer), CVE-2021-27076 (SharePoint), CVE-2022-27925 (Zimbra), CVE-2023-46747 (F5 BIG-IP), CVE-2024-21762/CVE-2022-40684 (FortiOS), CVE-2025-55182 (React Server Components). Dropper droppers masquerade as Google Update, Cisco AnyConnect, AutoUpdate MSIs. Persistence via scheduled tasks (`%APPDATA%\xwreg` or `xgdf`) calling SystemSettings.exe every 5 minutes. Post-exploitation: ntdsutil NTDS extraction, procdump LSASS dump, SharpGPOAbuse, AD enumeration via PowerShell/dsquery.

      Key MITRE TTPs: T1190 (exploit public-facing), T1574.004 (DLL side-loading), T1055 (process injection), T1056 (API hooking), T1134.004 (PPID spoofing), T1053.005 (scheduled task), T1003.001 (LSASS dump). Detection: alert on SystemSettings.exe execution from %APPDATA% subdirectories; Sysmon EID 7 (image loaded) for PrintDialog.dll loaded outside system32; ETW subsystem producing zero events for a process (all hooks firing); svchost.exe as parent of unexpected child processes via PPID-spoofing EID 4688/Sysmon EID 1 parent correlation. Hardening: patch the listed Exchange/SharePoint/Fortinet CVEs; restrict direct syscall capabilities with Windows Defender Credential Guard; EDR memory scanning during sleep intervals.
    ch_eu_nexus: "Moderate — European targets documented (North Macedonia, Serbia); Swiss organisations running Exchange, SharePoint, F5 or Fortinet appliances on those CVE versions directly exposed."
