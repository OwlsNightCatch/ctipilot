  - title: "CVE-2026-46331 'pedit COW' — Linux kernel act_pedit partial-COW page-cache corruption: public weaponised PoC (packet_edit_meme), root on RHEL 8/9/10 and Debian 13"
    sources:
      - url: "https://access.redhat.com/security/vulnerabilities/RHSB-2026-008"
        publisher: "Red Hat Product Security"
        date: "2026-06-19"
        role: "primary"
      - url: "https://nvd.nist.gov/vuln/detail/CVE-2026-46331"
        publisher: "NVD / MITRE"
        date: "2026-06-16"
        role: "corroborating"
    discovery_trace: "first seen at: hackernews feed, THN article 2026-06-26 → pivot: WebSearch 'CVE-2026-46331 pedit COW Linux kernel act_pedit privilege escalation exploit 2026' → primary: Red Hat RHSB-2026-008, URL https://access.redhat.com/security/vulnerabilities/RHSB-2026-008 → corroborating: NVD, URL https://nvd.nist.gov/vuln/detail/CVE-2026-46331"
    summary: |
      CVE-2026-46331, nicknamed "pedit COW" (by analogy with DirtyCOW), is a missing-bounds-check out-of-bounds write in the Linux kernel's traffic-control packet-editing action `tcf_pedit_act()` in `net/sched/act_pedit.c` (exposed since kernel v5.18). The function computes the copy-on-write range once before iterating over the key list, but the runtime offset added by typed keys (TCPEDIT_HDR_TYPE_*) is not accounted for in the range, resulting in writes into read-only, file-backed shared page-cache memory — a partial COW.

      A weaponised PoC named `packet_edit_meme` was released publicly one day after CVE assignment (June 17, 2026). The exploit maps the setuid-root `/bin/su` binary into the page cache via vmsplice/splice, then uses craft crafted tc pedit rules through a loopback network interface to overwrite authentication-check instructions in the cached binary, yielding a root shell. Exploitation requires only unprivileged local access when unprivileged user namespaces are available (default on most distributions). The exploit is silent: no kernel log entries, no audit trail, on-disk binary unchanged.

      Affected: Linux kernel v5.18 through v7.1-rc6; patched in v7.1-rc7 (upstream commits 2bec122b9fb91507a, 3dee9d0c198faeb9, 899ee91156e57784, b198ed4e52580a72 in stable trees). Red Hat confirms RHEL 8, 9, 10, RHCOS (OpenShift), RHOSP affected. Mitigation without patching: `echo "blacklist act_pedit" > /etc/modprobe.d/blacklist-act-pedit.conf` (check for tc pedit use in network policy before applying); also restrict unprivileged user namespaces (`kernel.unprivileged_userns_clone=0`) to eliminate the namespace-based escalation path.

      MITRE TTPs: T1068 (Exploitation for Privilege Escalation). Detection: the exploit is audit-blind; best pre-exploitation detection is via eBPF/Falco/auditd rules alerting on vmsplice(2) combined with tc qdisc/filter manipulation from unprivileged processes; EDR telemetry for setuid binary execution from unexpected parent processes; kernel integrity checks (IMA/EVM) to detect page-cache versus disk divergence.
    ch_eu_nexus: "High — all Linux-based infrastructure in Swiss/EU public sector (servers, containers, Kubernetes nodes on RHEL/Debian/Ubuntu kernel 5.18–7.1-rc6) is affected."
    public_sector_nexus: "indirect"
