  - title: "CVE-2026-43503 'DirtyClone' — JFrog publishes working LPE PoC for DirtyFrag variant abusing XFRM/IPsec netfilter TEE path; silent root with no kernel audit trace"
    sources:
      - url: "https://research.jfrog.com/post/dissecting-and-exploiting-linux-lpe-variant-dirtyclone-cve-2026-43503/"
        publisher: "JFrog Security Research"
        date: "2026-06-25"
        role: "primary"
      - url: "https://access.redhat.com/security/cve/CVE-2026-43503"
        publisher: "Red Hat"
        date: "2026-06-23"
        role: "corroborating"
    discovery_trace: "first seen at: hackernews feed, THN article 2026-06-25 → pivot: WebSearch 'CVE-2026-43503 DirtyClone DirtyFrag JFrog Linux kernel privilege escalation exploit 2026' → primary: JFrog Security Research, URL https://research.jfrog.com/post/dissecting-and-exploiting-linux-lpe-variant-dirtyclone-cve-2026-43503/"
    summary: |
      JFrog Security Research published the first working exploit walkthrough (2026-06-25) for CVE-2026-43503 (CVSS 8.8), named DirtyClone — a residual variant of the DirtyFrag family that exploits a different code path than the original (May 2026) patches addressed.

      Root cause: during socket buffer (skb) cloning via `__pskb_copy_fclone()`, the SKBFL_SHARED_FRAG safety flag is not correctly preserved. This flag marks buffers referencing shared, file-backed page-cache memory. When lost, the netfilter TEE (Traffic Egress Engine) packet-duplication mechanism passes cloned skbs with shared page-cache references into the XFRM/IPsec in-place AES-CBC cryptographic transformation path. AES-CBC key and IV are attacker-controlled, enabling selective byte overwrites of cached binary images (same page-cache corruption primitive as DirtyFrag/Fragnesia). Related variants: CVE-2026-43284 (original DirtyFrag), CVE-2026-43500 (DirtyFrag variant), CVE-2026-46300 (Fragnesia via skb_try_coalesce).

      Exploit steps: (1) create network namespace with `unshare -Urn` to acquire CAP_NET_ADMIN; (2) configure loopback IPsec tunnel with XFRM policies + netfilter TEE rules; (3) map privileged binary (/usr/bin/su) into page cache via vmsplice/splice; (4) route crafted packets whose AES-CBC decryption yields targeted byte changes in the cached binary; (5) execute the patched binary for root shell. Exploitation requires local access and default-enabled unprivileged user namespaces. The attack leaves no kernel audit log entries, no on-disk changes.

      Patched: commit 48f6a5356a33 merged May 21, first shipping in Linux v7.1-rc5. Full protection requires the complete patch series for CVE-2026-43284/43500/46300/43503. Mitigation if immediate patching is not possible: `kernel.unprivileged_userns_clone=0`; blacklist `esp4`, `esp6`, `rxrpc` modules; restrict `CAP_NET_ADMIN` acquisition through namespace policy.

      MITRE TTPs: T1068 (Exploitation for Privilege Escalation), T1611 (Escape to Host in container/Kubernetes scenarios). Detection: the exploit generates no kernel log artefacts — best signal is eBPF/Falco/auditd watching for `unshare(CLONE_NEWUSER|CLONE_NEWNET)` followed by `vmsplice`/`splice` and xfrm policy creation from the same process tree; memory-integrity checks (IMA/EVM/dm-verity) catching page-cache vs. on-disk divergence.
    ch_eu_nexus: "High — Debian, Ubuntu, Fedora confirmed exploitable by published PoC; kernel versions broadly deployed across Swiss/EU infrastructure containers and VMs."
    public_sector_nexus: "indirect"
    sector: "all — Linux infrastructure, cloud, Kubernetes"
