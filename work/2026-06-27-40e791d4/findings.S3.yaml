  - title: "FBI/CISA update Signal phishing alert — attackers now harvest Backup Recovery Keys to persist account takeover"
    sources:
      - url: "https://www.ic3.gov/PSA/2026/PSA260626"
        publisher: "FBI IC3 / CISA"
        date: "2026-06-26"
        role: "primary"
      - url: "https://cyberscoop.com/fbi-cisa-issue-psa-on-russian-intelligence-campaign-to-target-messaging-apps/"
        publisher: "CyberScoop"
        date: "2026-06-26"
        role: "corroborating"
    discovery_trace: "first seen at: hackernews feed, THN article 2026-06-27 → pivot: WebSearch 'FBI CISA Signal backup recovery key phishing Russian intelligence 2026' → primary: FBI IC3 PSA, URL https://www.ic3.gov/PSA/2026/PSA260626 → corroborating: CyberScoop, URL https://cyberscoop.com/fbi-cisa-issue-psa-on-russian-intelligence-campaign-to-target-messaging-apps/"
    summary: |
      The FBI and CISA issued an updated joint alert (I-062626-PSA, 2026-06-26) escalating their March 2026 warning about Russian Intelligence Services (RIS) phishing Signal accounts. The new vector targets Signal's Backup Recovery Key: attackers impersonate Signal support, claim a mandatory two-factor account recovery process, and direct victims to navigate to Settings > Chats > Chat Backups, enable backups, and paste the Recovery Key into the phishing session.

      The technical severity is that a compromised Recovery Key persists even after a new account is created on the same phone number. The attacker can download the complete encrypted backup and decrypt it offline, obtaining full private and group message history. Generating a new key in Settings invalidates the old one for future backup downloads but does not undo already-exfiltrated backups.

      Attributed actors include UNC5792 and UNC4221 (Russian military/intelligence services); earlier waves in the same campaign used doctored group-invite links and SMS verification code extraction. Targeting focus: current and former US and international government officials, military personnel, political figures, journalists, and key officials in Ukraine — directly relevant to Swiss diplomatic, federal, and parliamentary staff using Signal for sensitive communications.

      Detection/hunt: inspect MDM or endpoint telemetry for Signal backup-enable events on devices belonging to high-value staff; review access logs for sudden cloud backup uploads; identity-protection alerts on credential reuse. Hardening: generate new Recovery Keys immediately for all high-risk Signal accounts; enforce organisational Signal security policies prohibiting sharing of recovery keys; confirm no recovery key is stored in messaging history or email.
    ch_eu_nexus: "High — targeting profile explicitly includes international government officials and military personnel; Swiss diplomatic community, cantonal police, and parliamentary staff directly at risk."
