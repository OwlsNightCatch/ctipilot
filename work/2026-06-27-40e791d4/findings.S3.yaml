  - title: "CL-STA-1062 / TinyRCT — Unit 42 documents Chinese-suspected APT targeting Southeast Asian energy and government with AppDomainManager injection and custom C# RAT"
    sources:
      - url: "https://unit42.paloaltonetworks.com/cl-sta-1062-tinyrct-backdoor/"
        publisher: "Palo Alto Networks Unit 42"
        date: "2026-06-26"
        role: "primary"
    discovery_trace: "first seen at: hackernews feed, THN article 2026-06-26 → pivot: WebSearch 'TinyRCT backdoor CL-STA-1062 Chinese APT Southeast Asia energy government 2026 Unit 42' → primary: Unit 42, URL https://unit42.paloaltonetworks.com/cl-sta-1062-tinyrct-backdoor/"
    summary: |
      Unit 42 published a detailed analysis (2026-06-26) of CL-STA-1062 (also tracked as UAT-7237 by Cisco Talos), a Chinese-speaking APT cluster that expanded from targeting Taiwanese web hosting infrastructure in mid-2025 to breaching at least 10 Southeast Asian government and state-owned energy organisations between October and December 2025. Unconfirmed geographic range suggests broader East Asian campaigns since March 2022.

      The new custom backdoor TinyRCT is a C# .NET RAT that operates via HTTP (GET for polling, POST for exfiltration) with a 10-second default sleep interval. Encryption: AES-128 CBC with hardcoded key "ThisIsASecretKey87654321" and null IV — the hard-coded key limits forensic attribution complexity but leaves all TinyRCT traffic recognisable under network decryption. Capabilities include arbitrary cmd.exe execution, directory enumeration, text/binary file exfiltration (AES+gzip in 40 KB chunks), JPEG screenshot capture, sleep-interval reconfiguration, and `choice.exe`-based self-destruction. Environmental sandbox checks abort execution outside `%LOCALAPPDATA%`.

      Infection chain exploits AppDomainManager injection (T1574.014), a .NET CLR trust mechanism: the attacker distributes `chrome_setup.zip` containing a legitimate `chrome_setup.exe` alongside a malicious `chrome_setup.exe.config` that forces the CLR to load `MyAppDomainManager.dll`. The loader validates it is running from `%USERPROFILE%\Downloads`, then downloads TinyRCT (`PerfWatson2.exe`) from the staging server. Persistence via scheduled task "GoogleUpdaterTaskSystem140.0.7272.0" at user logon with elevated privileges.

      Supporting toolkit: SoftEther VPN (disguised as vmtools.exe), VNT network tunnel (VMware executable disguise), JuicyPotato for privilege escalation, yuze C2 tunnelling, Mimikatz credential harvesting, RAR password-protected staging, curl for enumeration exfil. Initial foothold via ASPX web shells. Post-exploitation includes ntdsutil NTDS extraction, MSSQL data exfiltration, and AD enumeration.

      MITRE TTPs: T1574.014 (AppDomainManager injection), T1018 (remote system discovery), T1005 (data from local system), T1041 (exfiltration over C2), T1113 (screen capture), T1059.001 (PowerShell), T1053.005 (scheduled task). Detection: alert on .exe.config files containing `appDomainManagerType` (Sysmon EID 11); CLR loading DLLs from non-standard paths (EID 7); scheduled task creation with elevated privileges matching "GoogleUpdaterTask" pattern; vmtools.exe or PerfWatson2.exe communicating to internet IPs; AES-128 encrypted HTTP with null IV patterns in network monitoring. Hardening: restrict .NET AppDomainManager override via registry (`HKCU\Software\Classes\<TypeName>`) and application-allowlisting; monitor .config file writes alongside executable drops.
    ch_eu_nexus: "Low-Moderate — campaign targets Southeast Asian energy/government; geopolitical expansion into Western European diplomatic/energy targets consistent with actor's broader interest in state-owned enterprises."
    public_sector_nexus: "direct (energy, government)"
    sector: "energy, government, state-owned enterprises"
