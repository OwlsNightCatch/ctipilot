  - title: "Pay Tel prison communications service: 1.1TB Azure misconfiguration exposes 300K+ driver's licenses, inmate communications, and geolocation data"
    sources:
      - url: "https://www.upguard.com/breaches/breaking-containment-how-a-corrections-vendor-exposed-inmate-communications"
        publisher: "UpGuard"
        date: "2026-05-28"
        role: "primary"
      - url: "https://techcrunch.com/2026/05/28/a-security-lapse-at-prison-payphone-service-pay-tel-publicly-exposed-over-300000-callers-drivers-licenses/"
        publisher: "TechCrunch"
        date: "2026-05-28"
        role: "corroborating"
    discovery_trace: "first seen at: privacyguides.org May 22-28 roundup (published 2026-05-29), URL https://www.privacyguides.org/news/2026/05/29/data-breach-roundup-may-22-28-2026/ → primary: UpGuard research, URL https://www.upguard.com/breaches/breaking-containment-how-a-corrections-vendor-exposed-inmate-communications → corroborating: TechCrunch, URL https://techcrunch.com/2026/05/28/a-security-lapse-at-prison-payphone-service-pay-tel-publicly-exposed-over-300000-callers-drivers-licenses/"
    summary: |
      UpGuard researchers discovered that Pay Tel Communications, a US provider of tablet-based prison inmate communication services operating across many US states, left a Microsoft Azure Blob Storage container publicly readable with no authentication required. The exposure totalled 1.1 TB across 3.4 million files. Data classes exposed included approximately 300,000 unredacted government-issued driver's license scans, inmate text messages, handwritten letters, legal documents, financial records, and family photographs; EXIF geodata in user-uploaded images was sufficient in many cases to identify the home addresses of callers. UpGuard discovered the exposure on May 4, 2026, notified Pay Tel on May 7, followed up with senior executives on May 11, and the bucket was secured by May 11 afternoon — a seven-day remediation window. Pay Tel has not publicly acknowledged the incident or confirmed breach notification obligations to state AGs (US state data breach notification laws typically cover driver's license numbers). This is Pay Tel's second known security incident in two years, following a Dragonforce ransomware attack in June 2025. Attack surface class: unauthenticated cloud storage exposure (T1530 — Data from Cloud Storage Object). No threat actor involved; pure misconfiguration. Defender takeaway: enforce Azure Storage Account public access block at the management-group policy level via `Microsoft.Storage/storageAccounts/allowBlobPublicAccess: Deny`; alert on any storage account with public blob access enabled (Azure Policy built-in: `Audit Storage accounts with permissive network access`). Sensitive-data workloads (ID documents, PII) require separate Defender for Storage DLP scan with automatic remediation.
    ch_eu_nexus: "US-only; relevant to EU cloud storage configuration guidance and GDPR Art. 32 obligations for cloud-hosted sensitive data"
    public_sector_nexus: "indirect — corrections industry; government-issued ID documents exposed"
    sector: "corrections/justice, telecommunications"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "UpGuard discovered a misconfigured Microsoft Azure cloud server containing at least 300,000 unencrypted driver's license scans and government-issued identity documents. The storage server lacked password protection, making all contents publicly accessible via the internet."
        attribution: "TechCrunch"
        source_url: "https://techcrunch.com/2026/05/28/a-security-lapse-at-prison-payphone-service-pay-tel-publicly-exposed-over-300000-callers-drivers-licenses/"
      - quote: "The exposed dataset contained approximately 300,000 unredacted driver's licenses, inmate legal/financial documents, personal communications (texts, emails, letters), and family photographs."
        attribution: "UpGuard"
