items:
  - title: "CNIL fines IQVIA Operations France €5M for systematic health data warehouse security failures affecting tens of millions"
    sources:
      - url: "https://www.cnil.fr/en/health-data-fine-5-million-euros-against-iqvia"
        publisher: "CNIL (Commission Nationale de l'Informatique et des Libertés)"
        date: "2026-05-28"
        role: "primary"
      - url: "https://ppc.land/cnil-fines-iqvia-eur5m-for-health-data-warehouse-breaches/"
        publisher: "PPC.land"
        date: "2026-05-28"
        role: "corroborating"
    discovery_trace: "first seen at: cnil-fr source, URL https://www.cnil.fr/en/news → primary: CNIL enforcement notice, URL https://www.cnil.fr/en/health-data-fine-5-million-euros-against-iqvia"
    summary: |
      On 26 May 2026 (published 28 May 2026), France's CNIL fined IQVIA Operations France €5 million for systematic GDPR violations in the operation of two authorised health data warehouses (LRX, fed by ~14,000 pharmacies; EMR, fed by several thousand GPs). The CNIL found: (1) pharmacies were transmitting patient prescription data to IQVIA despite stated patient objections, meaning the objection right under GDPR Art. 21 was not operationally enforced; (2) patients were not informed their data was flowing to IQVIA, violating GDPR Art. 14 information obligations; (3) multi-factor authentication was absent from warehouse access paths; (4) connection log monitoring and automated alerting were not in place (IQVIA confirmed retrospective deployment of audit-trail logging and alerts in March 2026, after CNIL investigation commenced); (5) no network segmentation between warehouse and other IQVIA infrastructure. The fine quantum reflects the scope — "tens of millions" of individuals' sensitive health data — and IQVIA's substantial market position in pharmaceutical analytics across France. The CNIL simultaneously issued a compliance order with a €10,000/day penalty-period sanction if corrective measures are not implemented within six months. GDPR Articles implicated: Art. 14 (information obligations), Art. 25 (data protection by design and default), Art. 32 (security of processing), plus Art. 66 of the French Data Protection Act. For defenders: this enforcement action codifies a set of baseline controls now explicitly required for health data warehouse operations — MFA on all data-warehouse access paths, automated connection log analysis, operationally enforced data-subject objection workflows, and network segmentation between sensitive-data stores and corporate infrastructure.
    ch_eu_nexus: "EU; directly affects pharmaceutical data processing across French healthcare sector; IQVIA operates in Switzerland and across EU"
    public_sector_nexus: "indirect — health data from public-scheme pharmacies and doctors"
    sector: "healthcare, pharmaceutical research, data analytics"
    cves: []
    actors_campaigns_malware: []
    verification: SINGLE-SOURCE-NATIONAL-CERT
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "On 26 May 2026, IQVIA OPERATIONS FRANCE was fined €5 million, in particular because it didn't respect guarantees aimed at limiting risks to individuals in the management of health data warehouses."
        attribution: "CNIL"
        source_url: "https://www.cnil.fr/en/health-data-fine-5-million-euros-against-iqvia"
      - quote: "The fine amount was determined in regard to the seriousness of the violations identified, which concern health data (sensitive data), the large number of individuals affected (several tens of millions), the company's market position and its financial capacity."
        attribution: "CNIL"
        source_url: "https://www.cnil.fr/en/health-data-fine-5-million-euros-against-iqvia"
    extended_notes: |
      Defender hardening angle: GDPR Art. 25 (DPbD) now operationally requires that data-subject objection workflows are enforced at the point of data collection from third-party data feeders (here, pharmacies), not merely in policy documents. Warehouse operators should audit whether downstream data-collection agents (pharmacies, clinicians) actually enforce objection flags before transmitting. MFA enforcement on warehouse access and automated log-alerting are now explicit regulatory expectations per this ruling.

  - title: "Silent Ransom Group / Luna Moth escalates to physical in-person IT impersonation at law firm offices — FBI IC3 flash advisory"
    sources:
      - url: "https://www.bleepingcomputer.com/news/security/fbi-warns-of-silent-ransom-group-in-person-data-theft-attacks/"
        publisher: "BleepingComputer"
        date: "2026-05-27"
        role: "primary"
      - url: "https://www.infosecurity-magazine.com/news/silent-ransom-group-it/"
        publisher: "Infosecurity Magazine"
        date: "2026-05-29"
        role: "corroborating"
      - url: "https://www.helpnetsecurity.com/2026/05/27/fbi-silent-ransom-group-law-firms-social-engineering/"
        publisher: "Help Net Security"
        date: "2026-05-27"
        role: "corroborating"
    discovery_trace: "first seen at: infosecurity-magazine feed, URL https://www.infosecurity-magazine.com/news/silent-ransom-group-it/ (published 2026-05-29) → pivot: FBI IC3 advisory PDF https://www.ic3.gov/CSA/2026/260526.pdf (403 — bridge failed) → primary: BleepingComputer article https://www.bleepingcomputer.com/news/security/fbi-warns-of-silent-ransom-group-in-person-data-theft-attacks/ → corroborating: Help Net Security https://www.helpnetsecurity.com/2026/05/27/fbi-silent-ransom-group-law-firms-social-engineering/"
    summary: |
      The FBI IC3 issued a flash advisory (TLP:CLEAR, 26 May 2026) warning that the Silent Ransom Group (SRG), also tracked as Luna Moth, Chatty Spider, and UNC3753, has escalated its social engineering campaigns against US law firms to include physical in-person intrusions. The group's standard chain (TOAD — Telephone-Oriented Attack Delivery): phishing email or cold call posing as internal IT support → victim directed to call a fake helpdesk number → victim grants remote desktop access via legitimate RMM tools → data exfiltrated via WinSCP or a hidden/renamed Rclone binary to attacker-controlled storage or cloud (Google Drive, OneDrive). When the remote-access gambit fails, SRG dispatches a physical operative to the victim's office who presents as IT staff, requests physical access to a workstation, and inserts a USB storage device claiming to image the disk or create a backup. No ransomware payload is deployed — there is no encryption, no locked screen. The attack is entirely invisible until an extortion email arrives threatening to publish on SRG's clearnet leak site. Over 38 US law firms have had data published; the group also targets insurance, finance, and healthcare sectors. Prior law firm victims include Orrick, Herrington & Sutcliffe (Q1 2026), Jones Day, and Wood Smith Henning & Berman. SRG emerged from the Conti/Ryuk ecosystem in March 2022. MITRE ATT&CK: T1566 Phishing (TOAD variant), T1598.003 Spearphishing Voice, T1078 Valid Accounts (RMM tool abuse), T1048.003 Exfiltration Over Alternative Protocol (WinSCP/Rclone), T1052.001 Exfiltration over USB (physical intrusion variant). Detection: alert on Rclone or WinSCP spawned from user sessions lacking prior RMM-tool parent-process history; alert on USB mass storage device insertion events (Windows Event ID 6416 / Sysmon EID 6 for device attachment) correlated with absence of prior approved-device baseline; monitor for RMM tools (AnyDesk, TeamViewer, ConnectWise) launched from unexpected parent processes.
    ch_eu_nexus: "US-primary; law firm targeting is sector-agnostic and tactics directly applicable to EU professional-services firms; no confirmed EU victims in this advisory"
    public_sector_nexus: "indirect — finance and insurance sectors; legal counsel to public bodies"
    sector: "legal services, insurance, finance, healthcare"
    cves: []
    actors_campaigns_malware: ["Silent Ransom Group", "Luna Moth", "UNC3753", "Chatty Spider"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "SRG sends a threat actor to the victim's location to gain access to insert a storage device into the victim's computer. In this scheme, the threat actor tells the victim they need to image the device or create a backup file to address potential impacts from the phishing email."
        attribution: "BleepingComputer (citing FBI IC3 advisory)"
        source_url: "https://www.bleepingcomputer.com/news/security/fbi-warns-of-silent-ransom-group-in-person-data-theft-attacks/"
      - quote: "SRG actors use WinSCP (Windows Secure Copy) or a hidden or renamed version of Rclone to exfiltrate data."
        attribution: "BleepingComputer (citing FBI IC3 advisory)"
