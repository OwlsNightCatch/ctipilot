  - title: "Akira ransomware claims GS Yuasa Lithium Power (US aerospace battery supplier to Boeing satellites) — leak-site only, not confirmed by victim"
    sources:
      - url: "https://www.ransomware.live/id/R1MgWXVhc2EgTGl0aGl1bSBQb3dlckBha2lyYQ=="
        publisher: "Ransomware.live"
        date: "2026-05-28"
        role: "primary"
    discovery_trace: "first seen at: WebSearch ('GS Yuasa Lithium Power Akira ransomware May 2026') → primary: ransomware.live entry, URL https://www.ransomware.live/id/R1MgWXVhc2EgTGl0aGl1bSBQb3dlckBha2lyYQ== (discovered 2026-05-28)"
    summary: |
      Ransomware.live recorded on 2026-05-28 that Akira ransomware group posted GS Yuasa Lithium Power on its dark web leak site. GS Yuasa Lithium Power is the North American subsidiary of Japanese battery manufacturer GS Yuasa, specialising in high-reliability lithium-ion cells for aerospace, military, undersea, and specialty applications; the company holds a long-term supply agreement with Boeing for satellite batteries. Akira's posting claims forthcoming publication of project data from Boeing satellite programmes, contracts, NDAs, engineering drawings, specifications, and customer information. No data has been published yet as of the discovery date. GS Yuasa Lithium Power has issued no public statement and the claim has not been independently confirmed. This qualifies as an unconfirmed leak-site claim. Akira is a RaaS operation active since March 2023, having claimed over 1,400 victims; the group primarily gains initial access through Cisco VPN products lacking MFA (CVE-2023-20269 and related vulnerabilities). If the claimed data is genuine, the aerospace/defence-sector implications include potential exposure of satellite design specifications, supply-chain relationships, and NDAs — relevant to national-security and critical-infrastructure supply-chain risk across EU and NATO partners. No victim confirmation, no data verified.
    ch_eu_nexus: "US-primary; aerospace/defense supply chain implications affect EU/NATO partners if data is genuine"
    public_sector_nexus: "indirect — defense supply chain (Boeing satellite programmes)"
    sector: "aerospace, defense, manufacturing"
    cves: []
    actors_campaigns_malware: ["Akira ransomware"]
    verification: SINGLE-SOURCE-OTHER
    confidence: LOW
    novelty: new
    evidence:
      - quote: "Ransomware.live discovered on 2026-05-28 that GS Yuasa Lithium Power has been claimed by Akira ransomware group"
        attribution: "Ransomware.live"
        source_url: "https://www.ransomware.live/id/R1MgWXVhc2EgTGl0aGl1bSBQb3dlckBha2lyYQ=="
    extended_notes: |
      [SINGLE-SOURCE] — only ransomware.live aggregator available; no victim statement, no independent confirmation, no data sample verification. Treat as unconfirmed claim until GS Yuasa Lithium Power issues a statement. Akira's aerospace/defence targeting pattern is consistent with historical victims (LG Energy Solution Nov 2025, multiple manufacturing targets). If confirmed, this represents a defence-supply-chain exposure with Boeing programme data.

