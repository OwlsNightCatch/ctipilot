items:
  - title: "CVE-2026-0257 — PAN-OS GlobalProtect authentication bypass actively exploited; CISA KEV added 2026-05-29 with 3-day federal deadline"
    sources:
      - url: "https://security.paloaltonetworks.com/CVE-2026-0257"
        publisher: "Palo Alto Networks PSIRT"
        date: "2026-05-29"
        role: "primary"
      - url: "https://www.rapid7.com/blog/post/etr-rapid7-observed-exploitation-of-pan-os-globalprotect-authentication-bypass-vulnerability-cve-2026-0257/"
        publisher: "Rapid7"
        date: "2026-05-29"
        role: "corroborating"
      - url: "https://www.cisa.gov/known-exploited-vulnerabilities-catalog"
        publisher: "CISA KEV"
        date: "2026-05-29"
        role: "corroborating"
    discovery_trace: |
      first seen at: cisa-kev bridge, URL https://www.cisa.gov/known-exploited-vulnerabilities-catalog → pivot: Palo Alto Networks PSIRT, URL https://security.paloaltonetworks.com/CVE-2026-0257 → corroborating: Rapid7 ETR, URL https://www.rapid7.com/blog/post/etr-rapid7-observed-exploitation-of-pan-os-globalprotect-authentication-bypass-vulnerability-cve-2026-0257/
    summary: |
      CVE-2026-0257 is an authentication bypass (CWE-565: Reliance on Cookies without Validation and Integrity Checking) in the GlobalProtect portal and gateway of Palo Alto Networks PAN-OS. The root cause is that when GlobalProtect authentication override cookies are enabled and the portal/gateway certificate is shared with another feature (such as the HTTPS service), an unauthenticated attacker can extract the certificate's public key from the HTTPS service and use it to forge valid authentication override cookies. This results in full VPN authentication bypass — the attacker establishes an unauthorised GlobalProtect VPN session gaining network-level access to whatever network segment the VPN serves. CVSS 4.0 = 7.8 HIGH (Exploit Maturity: ATTACKED). Palo Alto Networks confirmed limited exploitation of unpatched appliances. Rapid7 MDR observed two waves: Wave 1 on 2026-05-18 from Vultr-hosted infrastructure, Wave 2 on 2026-05-21 from Dromatics Systems IP space; both waves shared a spoofed MAC address (aa:bb:cc:dd:ee:ff) and used machine names GP-CLIENT (Linux) and DESKTOP-GP01 (Windows) — consistent MAC suggests the same actor. Rapid7 confirmed successful exploitation but no observed lateral movement. A public PoC is available (github.com/sfewer-r7/CVE-2026-0257). CISA added the CVE to KEV on 2026-05-29 with a three-day remediation deadline (2026-06-01) for FCEB agencies. Affected versions span PAN-OS 10.2.x, 11.1.x, 11.2.x, and 12.1.x; Prisma Access 10.2 and 11.2; Panorama and Cloud NGFW are NOT affected. Patches are available. The vulnerability is only exploitable when authentication override cookies are enabled AND the same certificate is reused with another feature (non-default but operationally common). Detection: look for GlobalProtect VPN sessions authenticating without prior web-based MFA interaction, unusual source IPs in GlobalProtect connection logs, and cookie-based auth-override events in pan-gp logs. Hardening: immediately upgrade to fixed versions; if patching is delayed, disable authentication override cookies or generate a dedicated certificate solely for this feature.
    ch_eu_nexus: "Global; PAN-OS GlobalProtect is widely deployed across European enterprise and public-sector perimeters. CERT-EU 2026-006 (PAN-OS) referenced earlier PAN-OS advisories — operations here are independent but share the same product surface."
    public_sector_nexus: "direct — perimeter VPN for government and cantonal networks"
    sector: "all, government, critical-infrastructure"
    cves: ["CVE-2026-0257"]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Palo Alto Networks has become aware of limited exploit attempts on unpatched PAN-OS devices without mitigations applied."
        attribution: "Palo Alto Networks PSIRT"
        source_url: "https://security.paloaltonetworks.com/CVE-2026-0257"
      - quote: "Rapid7 MDR observed a second wave of exploitation on May 21st, and due to consistent MAC address, they believe both waves of exploitation are likely from the same threat actor."
        attribution: "Rapid7"
