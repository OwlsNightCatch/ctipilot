  - title: "CVE-2026-48710 'BadHost' — Starlette/FastAPI host-header auth bypass hits AI/ML serving infrastructure (vLLM, LiteLLM, MCP servers); NCSC-NL advisory 2026-05-29"
    sources:
      - url: "https://badhost.org/"
        publisher: "X41 D-Sec / Persistent Security (badhost.org)"
        date: "2026-05-22"
        role: "primary"
      - url: "https://ostif.org/disclosing-the-badhost-vulnerability-in-starlette/"
        publisher: "OSTIF.org"
        date: "2026-05-22"
        role: "corroborating"
      - url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0171"
        publisher: "NCSC-NL"
        date: "2026-05-29"
        role: "corroborating"
      - url: "https://github.com/Kludex/starlette/security/advisories/GHSA-86qp-5c8j-p5mr"
        publisher: "GitHub Advisory Database"
        date: "2026-05-22"
        role: "corroborating"
    discovery_trace: |
      first seen at: ncsc-nl recent listing, item NCSC-2026-0171 published 2026-05-29T19:08Z → pivot: NCSC-NL CSAF NCSC-2026-0171, URL https://advisories.ncsc.nl/advisory?id=NCSC-2026-0171 (reference: badhost.org) → primary: X41 D-Sec advisory, URL https://badhost.org/ → corroborating: OSTIF, URL https://ostif.org/disclosing-the-badhost-vulnerability-in-starlette/
    summary: |
      CVE-2026-48710 ("BadHost") is a critical authentication bypass in the Starlette Python ASGI framework (all versions < 1.0.1), which underpins FastAPI, vLLM, LiteLLM, Google ADK-Python, BentoML, Gradio, Langflow, Dify, CrewAI, Open WebUI, and the Python MCP SDK. The root cause (CWE-444: Inconsistent Interpretation of HTTP Requests) is that Starlette reconstructs `request.url` by concatenating the `Host` header with the request path and re-parsing the composite URL; the parts are validated separately under different rules. A Host header containing `/`, `?`, or `#` shifts where Starlette believes the path begins, so `request.url.path` reports a different path than the ASGI server actually routed. Middleware and endpoints that apply access-control decisions via `request.url.path` can be bypassed: the attacker sends `GET /admin` with a Host header of `example.com/health?x=` and Starlette reports the path as `/health` while routing to `/admin`. No auth, no privileges required — a single malformed HTTP header character achieves the bypass. Three populations are most exposed: FastAPI/Starlette apps on an application server with no compliant reverse proxy (nginx, Caddy, Traefik, HAProxy, Cloudflare all strip/reject malformed Host headers and are protective); model proxies such as LiteLLM or vLLM exposed directly; and applications where access-control code reads `request.url.path` rather than `scope["path"]`. Starlette has roughly 325 million downloads/week and 400,000+ GitHub dependents. The patch shipped as Starlette 1.0.1 on 2026-05-21, one day before disclosure (effectively zero lead time). X41 D-Sec discovered the flaw in January 2026 during an OSTIF-sponsored audit of vLLM. NCSC-NL issued advisory NCSC-2026-0171 on 2026-05-29 in-window. Fix: upgrade Starlette to ≥ 1.0.1; downstream frameworks (FastAPI etc.) require a dependency update to pull the fixed Starlette. If upgrading is not immediately possible, place a compliant reverse proxy in front of the application and configure it to validate or strip malformed Host headers. Detection: parse web-server access logs for Host header values containing `/`, `?`, or `#` characters followed by path components — that pattern is the exploit fingerprint.
    ch_eu_nexus: "Relevant wherever AI/ML inference infrastructure (vLLM, LiteLLM, FastAPI-based model proxies, MCP servers) is deployed in Swiss or European research, government, or enterprise environments — particularly cantonal AI pilots and university research clusters."
    public_sector_nexus: "indirect — AI serving infrastructure in public-sector deployments"
    sector: "technology, research, public-sector AI"
    cves: ["CVE-2026-48710"]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "A Host header containing a slash, question mark or hash character shifts where the path begins, so the path Starlette reports no longer matches the one the server actually received and routed against."
        attribution: "X41 D-Sec / badhost.org"
        source_url: "https://badhost.org/"
      - quote: "Starlette receives roughly 325 million downloads per week and serves as the routing foundation for FastAPI, vLLM, LiteLLM, Text Generation Inference, OpenAI-compatible API proxies, MCP servers, and a sprawling ecosystem of AI agent frameworks."
        attribution: "OSTIF.org"
        source_url: "https://ostif.org/disclosing-the-badhost-vulnerability-in-starlette/"

  - title: "GreyVibe — Russia-nexus threat cluster targeting Ukraine with AI-assisted tooling (ChatGPT/Gemini/Ideogram) across five attack chains; custom PowerShell RATs and Android spyware"
    sources:
      - url: "https://labs.withsecure.com/publications/greyvibe"
        publisher: "WithSecure Labs"
        date: "2026-05-28"
        role: "primary"
      - url: "https://www.bleepingcomputer.com/news/security/greyvibe-hackers-use-chatgpt-gemini-to-power-cyberattacks/"
        publisher: "BleepingComputer"
        date: "2026-05-28"
        role: "corroborating"
    discovery_trace: |
      first seen at: BleepingComputer RSS feed, item published 2026-05-28T18:24Z, URL https://www.bleepingcomputer.com/news/security/greyvibe-hackers-use-chatgpt-gemini-to-power-cyberattacks/ → primary: WithSecure Labs publication, URL https://labs.withsecure.com/publications/greyvibe
    summary: |
      WithSecure Labs published their GREYVIBE research on 2026-05-28, documenting a previously-unnamed Russia-nexus threat cluster active since at least August 2025 and targeting Ukrainian military, government, civilian, and business entities. WithSecure describes GreyVibe as low-to-moderately sophisticated but notable for systematic, integrated use of generative AI across the full attack lifecycle — including ChatGPT, Google Gemini, and Ideogram AI — for lure generation, obfuscator development, and malware coding (likely with LLM-assistance). The group operates five distinct attack chains: PhantomMail (spear-phishing with ZIP/RAR archives via Google Drive and 4sync), PhantomClick (fake CAPTCHA/ClickFix pages impersonating Zoom and LAPAS), PrincessClub (fake adult/dating sites with live WebRTC calls for social engineering), DroneLink (counterfeit Ukrainian military charity sites), and Nebo (fake Russian military communications login portals). Core malware includes LegionRelay (PowerShell RAT: file theft, screenshots, credential harvesting, RDP access) and PhantomRelay (PowerShell RAT: system fingerprinting, dynamic script loading), plus FallSpy (Android spyware for contact/call log/location extraction). Four custom obfuscators are used: LOOKVALPS, LOOKVALJS, DAYLIGHT, TEASOUP. Attribution evidence: Russian-language malware panels and code comments, C2 servers set to UTC+3 (Moscow time), operational security blunders including uploading samples to public scanning platforms, cryptocurrency mining as side activity. WithSecure notes possible links to UAC-0098 (former TrickBot associates). MITRE ATT&CK: T1566.001/T1566.002 (Phishing), T1059.001 (PowerShell), T1005 (Data from Local System), T1204.001 (User Execution: Malicious Link), T1133 (External Remote Services/RDP). Detection: process chains spawning PowerShell from browser processes (CAPTCHA/ClickFix delivery), outbound connections to newly-registered domains from `powershell.exe`, Android APK side-loading patterns, AI-image metadata (LLM artifact markers). WithSecure IoCs available at github.com/WithSecureLabs/iocs/blob/master/GREYVIBE/greyvibe_iocs.csv.
    ch_eu_nexus: "Ukraine-focused campaign with European adjacency — Ukraine-supporting European institutions and NGOs are within the targeting scope. Phishing lure impersonation of European platforms (Zoom) relevant for Swiss/EU defenders."
    public_sector_nexus: "indirect — government and NGO targeting against Ukraine-aligned organisations"
    sector: "government, defence, NGO"
    cves: []
    actors_campaigns_malware: ["GreyVibe", "LegionRelay", "PhantomRelay", "FallSpy", "LOOKVALPS", "LOOKVALJS", "DAYLIGHT", "TEASOUP"]
