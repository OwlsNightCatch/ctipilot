  - title: "'LLMShare' malvertising campaign abuses ChatGPT share-link feature to render fake outage pages and serve infostealer downloads via Google Ads"
    sources:
      - url: "https://pushsecurity.com/blog/llmshare-malvertising-campaign"
        publisher: "Push Security"
        date: "2026-05-29"
        role: "primary"
      - url: "https://www.bleepingcomputer.com/news/security/chatgpt-share-links-abused-to-host-fake-outage-pages-to-deliver-malware/"
        publisher: "BleepingComputer"
        date: "2026-05-29"
        role: "corroborating"
    discovery_trace: |
      first seen at: BleepingComputer RSS feed, item published 2026-05-29T14:21Z, URL https://www.bleepingcomputer.com/news/security/chatgpt-share-links-abused-to-host-fake-outage-pages-to-deliver-malware/ → primary: Push Security research, URL https://pushsecurity.com/blog/llmshare-malvertising-campaign
    summary: |
      Push Security (dubbed the campaign "LLMShare") documented a novel malvertising technique exploiting ChatGPT's content-sharing feature in which attackers place Google ads targeting ChatGPT-related searches ("ChatGPT", "ChatGPT desktop app", "ChatGPT download"). Victims clicking ads land on legitimate `chatgpt.com/s/[unique-id]` share URLs — owned by OpenAI — that render attacker-controlled HTML via ChatGPT's shared-conversation capability, displaying a fake high-traffic outage page with a "Download our desktop app to continue" button. Because the serving domain is `chatgpt.com`, enterprise web-filtering rules and firewall URL blocks do not trigger. The download button redirects to an external domain (`openew[.]app`) impersonating OpenAI's download portal; the site uses cloaking so security scanners see a harmless AR/VR company website instead of the malicious payload. Windows users receive an infostealer (Beagle malware) with VM-detection commands; macOS users receive a separate infostealer payload. The campaign is similar to an earlier Claude.ai Artifacts abuse pattern. No CVEs. MITRE ATT&CK: T1566.002 (Spearphishing Link), T1204.001 (Malicious Link), T1036 (Masquerading as ChatGPT), T1027 (Obfuscation/Cloaking). Detection: monitor for process execution chains spawning from browser-downloaded applications from chatgpt.com domains — the masquerade as an app download is unusual for that domain. EDR parent-child: browser spawning a newly-downloaded unsigned or oddly-signed executable. User awareness note: legitimate ChatGPT desktop app downloads are hosted only on openai.com, not on OpenAI-impersonating third-party domains. Defender action: update web-proxy/email security to flag/block `openew[.]app` class of look-alike domains at the network perimeter.
    ch_eu_nexus: "Global campaign; relevant wherever enterprise users search for AI tools via Google — Swiss and European knowledge-worker populations are targeted."
    public_sector_nexus: "indirect — targets any user searching for AI productivity tools"
    sector: "all, technology"
    cves: []
    actors_campaigns_malware: ["LLMShare", "Beagle"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "The LLMShare campaign works by abusing the share features of popular LLM chatbots like ChatGPT. The attackers render a custom HTML layout directly on the legitimate domain to display a fake system maintenance message."
        attribution: "Push Security"
        source_url: "https://pushsecurity.com/blog/llmshare-malvertising-campaign"
      - quote: "Because the domain belongs to OpenAI, web filter rules and firewall blocks do not trigger."
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/chatgpt-share-links-abused-to-host-fake-outage-pages-to-deliver-malware/"

  - title: "UPDATE: Nightmare Eclipse zero-day escalation — Microsoft calls uncoordinated releases 'never justifiable'; researcher threatens July 14 drop of additional Windows LPEs (GreenPlasma / MiniPlasma still unpatched)"
    sources:
      - url: "https://therecord.media/microsoft-calls-zero-day-releases-never-justifiable-as-researcher-threatens-more"
        publisher: "The Record (Recorded Future News)"
        date: "2026-05-29"
        role: "primary"
      - url: "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-45585"
        publisher: "Microsoft MSRC"
        date: "2026-05-27"
        role: "corroborating"
    discovery_trace: |
      first seen at: The Record RSS feed, item published 2026-05-29T13:33Z, URL https://therecord.media/microsoft-calls-zero-day-releases-never-justifiable-as-researcher-threatens-more → corroborating: Microsoft MSRC advisory for YellowKey/CVE-2026-45585, URL https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-45585
    summary: |
      The Record published a 2026-05-29 article covering fresh escalation in the Nightmare Eclipse / Chaotic Eclipse zero-day campaign. The pseudonymous researcher has now released six Windows vulnerabilities since early April 2026 (BlueHammer/CVE-2026-33825, UnDefend/CVE-2026-45498, RedSun/CVE-2026-41091 in April — all now patched; YellowKey/CVE-2026-45585 BitLocker bypass, GreenPlasma LPE, and MiniPlasma LPE in May — GreenPlasma and MiniPlasma remain unpatched as of 2026-05-29). Microsoft issued a formal public statement calling uncoordinated disclosures "never justifiable" and inviting vulnerability submissions. The researcher responded by threatening to "shatter bones" with a new release on July 14 (the next Patch Tuesday). MiniPlasma (unpatched): abuse of the Windows Cloud Files Mini Filter Driver (`cldflt.sys`); a low-privileged user runs the PoC and gets a SYSTEM shell on fully-patched Windows 11 — confirmed by BleepingComputer. Root cause: a variant of CVE-2020-17103 in the cloud-sync subsystem that was not fully remediated when originally patched in 2020. GreenPlasma: also unpatched; LPE class. This is an UPDATE to prior coverage of the Chaotic Eclipse campaign (covered in brief 2026-W21). The new in-window information is: Microsoft's formal public response, the July 14 deadline threat, and confirmation that GreenPlasma and MiniPlasma remain without a Microsoft patch going into June. Defenders with unmanaged Windows 11 estates should monitor for `cldflt.sys`-related anomalies and consider AppLocker/WDAC policies to block unsigned executables from running as low-privileged users while patches are pending.
    ch_eu_nexus: "Global — MiniPlasma and GreenPlasma affect all supported Windows 11 and Windows 10 versions in Swiss and European public-sector environments."
    public_sector_nexus: "direct — Windows LPE on government workstations"
    sector: "all, government"
    cves: ["CVE-2026-45585"]
    actors_campaigns_malware: ["Nightmare Eclipse", "Chaotic Eclipse"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "update-to-prior:2026-W21"
    evidence:
      - quote: "Microsoft stated that uncoordinated disclosures are 'never justifiable' and warned the Digital Crimes Unit would pursue cases against those enabling cybercrime."
        attribution: "The Record"
