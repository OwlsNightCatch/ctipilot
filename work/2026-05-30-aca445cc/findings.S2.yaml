  - title: "Ghost Stadium PhaaS — 300+ FIFA domain clones impersonating World Cup SSO, targeting UK/Germany/Portugal/Spain fan base ahead of June 2026 kickoff; FBI IC3 PSA 260527"
    sources:
      - url: "https://www.bleepingcomputer.com/news/security/fbi-warns-of-fake-fifa-websites-running-world-cup-fraud-schemes/"
        publisher: "BleepingComputer"
        date: "2026-05-28"
        role: "primary"
      - url: "https://www.ic3.gov/PSA/2026/PSA260527"
        publisher: "FBI IC3"
        date: "2026-05-27"
        role: "primary"
    discovery_trace: "first seen at: heise-sec (RSS feed), URL https://www.heise.de/news/Warnung-vor-gefaelschten-FIFA-Webseiten-vor-der-Fussball-WM-2026-11309777.html → pivot: FBI IC3 primary PSA https://www.ic3.gov/PSA/2026/PSA260527 → corroborating: BleepingComputer https://www.bleepingcomputer.com/news/security/fbi-warns-of-fake-fifa-websites-running-world-cup-fraud-schemes/"
    summary: |
      The FBI issued Public Service Announcement PSA260527 on 27 May 2026 warning that a sophisticated Chinese-speaking, financially-motivated threat actor tracked by Group-IB as Ghost Stadium has deployed more than 300 phishing site clones impersonating the official FIFA website (fifa.com) ahead of the 2026 FIFA World Cup (tournament begins 11 June in the USA, Canada and Mexico). Ghost Stadium's infrastructure reproduces the FIFA site pixel-for-pixel including a fake single-sign-on authentication flow supporting 11 languages, directly targeting European fan demographics (UK, Portugal, Spain, Germany explicitly named by FBI). Typosquatting variants registered include alternative TLDs (.org, .xyz, .live, .sale) and domain typos (e.g. fiffa[.com]); additional fake employment portals (jobs-fifa[.com], fifa-hiring[.com]) impersonate FIFA HR functions. Criminal objectives span: credential and financial-data theft via fake SSO; counterfeit ticket and hospitality-package sales; fake merchandise and streaming-rights fraud. Multi-language support in 11 languages significantly lowers the language-barrier for deceiving European fans purchasing tickets. For defenders and SOC managers at organisations with significant employee populations likely to purchase World Cup tickets (large enterprise, government, telecom): this is a phishing-training and awareness moment. Browser-based security posture (Google Safe Browsing, Microsoft SmartScreen) will not catch fresh domain registrations before abuse is reported. Users should be advised to bookmark `https://www.fifa.com` directly rather than relying on search engines (sponsored results have been weaponised). DMARC/DKIM email-authentication controls do not directly mitigate this vector but help verify legitimate FIFA communications against impersonation. The July 14 final is the likely high-intensity fraud window.
    ch_eu_nexus: "direct — Germany, UK, Portugal, Spain named as target regions; Swiss fans travelling to North America are within the SSO credential-theft scope; German-language FIFA clone confirmed by Group-IB"
    public_sector_nexus: "indirect — employees of public-sector organisations purchasing tickets are personal targets; identity theft from SSO phishing could enable secondary credential attacks on work accounts if password reuse occurs"
    sector: "all, consumer"
    cves: []
    actors_campaigns_malware: ["Ghost Stadium"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Ghost Stadium – a Chinese-speaking, financially motivated operator said to be running a sophisticated phishing campaign across more than 300 domains, having built an exact replica of the official FIFA website down to the pixel, including a fake single sign-on (SSO) authentication flow and multi-language support in 11 languages."
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/fbi-warns-of-fake-fifa-websites-running-world-cup-fraud-schemes/"

  - title: "UPDATE: Ivanti Secure Access Client — NCSC.ch adds CVE-2026-8992 (local privilege escalation, CVSS 7.8) to ongoing Ivanti May advisory on 29 May 2026"
    sources:
      - url: "https://security-hub.ncsc.admin.ch/#/posts/12548"
        publisher: "NCSC Switzerland (GovCERT.ch Security Hub)"
        date: "2026-05-29"
        role: "primary"
      - url: "https://thehackernews.com/2026/05/ivanti-epmm-cve-2026-6973-rce-under.html"
        publisher: "The Hacker News"
        date: "2026-05-08"
        role: "corroborating"
    discovery_trace: "first seen at: ncsc-ch-security-hub (bridge ncsc-csh), URL https://security-hub.ncsc.admin.ch/#/posts/12548 → advisory updated 29.05.2026 adding CVE-2026-8992 for Ivanti Secure Access Client"
    summary: |
      NCSC Switzerland updated its Ivanti May 2026 advisory (post ID 12548) on 29 May 2026 to add CVE-2026-8992, a local privilege escalation (LPE) in Ivanti Secure Access Client (SAC) that Ivanti itself patched on 22 May 2026 in all SAC client versions released on or after 12 May 2026. CVSS 3.1 score is 7.8 HIGH. The vulnerability allows a locally-authenticated attacker on a managed endpoint running the Ivanti SAC client to escalate privileges. The Ivanti vendor advisory covers CVE-2026-7431 and CVE-2026-7432 in the same SAC advisory bundle; CVE-2026-8992 was added retroactively to the May 2026 release. This is a secondary item in the context of the actively exploited CVE-2026-6973 (EPMM RCE, CISA KEV, admin-authenticated), which remains the highest-severity Ivanti item this cycle. The LPE risk from CVE-2026-8992 is relevant for organisations with SAC deployed on privileged-user workstations where a local attacker (insider threat or post-exploitation foothold) could use the LPE to escalate from a standard Windows user session to local admin. Detection: Windows Privilege Escalation events (Windows EID 4672, 4673 — special privileges assigned, sensitive privilege use) combined with Ivanti SAC process lineage from `ivanti-vpn.exe` or `Ivanti Secure Access Client.exe` parent processes. Hardening: ensure SAC client is updated to any release from 12 May 2026 or later; verify via installed-software inventory (Sysmon EID 19 or endpoint management console).
    ch_eu_nexus: "direct CH relevance — NCSC Switzerland (GovCERT.ch) issued the update; Ivanti EPMM and SAC are widely deployed in Swiss federal IT and cantonal administrations"
    public_sector_nexus: "direct — Ivanti EPMM is deployed across government MDM estates; SAC is the VPN client used by EPMM-managed devices"
    sector: "public-sector, all"
    cves: [CVE-2026-8992]
    actors_campaigns_malware: []
    verification: SINGLE-SOURCE-NATIONAL-CERT
    confidence: HIGH
    novelty: update-to-prior:2026-05-08

