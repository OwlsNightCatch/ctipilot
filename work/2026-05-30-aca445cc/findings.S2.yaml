        attribution: "The Record (Recorded Future News)"
        source_url: "https://therecord.media/microsoft-calls-zero-day-releases-never-justifiable-as-researcher-threatens-more"
      - quote: "Attackers began hammering three of the six — BlueHammer, RedSun, and UnDefend — soon after Nightmare published working proof-of-concept exploit code for each on now-banned GitHub and GitLab accounts."
        attribution: "The Record (Recorded Future News)"
