items:
  - title: "CVE-2026-48710 (BadHost) — Starlette/FastAPI Host-header auth bypass exposes AI-agent infrastructure, Python LLM gateways and MCP servers; CCB Belgium issues Patch Immediately advisory"
    sources:
      - url: "https://www.x41-dsec.de/lab/advisories/x41-2026-002-starlette"
        publisher: "X41 D-Sec"
        date: "2026-05-22"
        role: "primary"
      - url: "https://github.com/Kludex/starlette/security/advisories/GHSA-86qp-5c8j-p5mr"
        publisher: "GitHub Security Advisory (Starlette)"
        date: "2026-05-22"
        role: "primary"
      - url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0171"
        publisher: "NCSC-NL"
        date: "2026-05-29"
        role: "corroborating"
      - url: "https://www.csoonline.com/article/4177711/fastapi-based-ai-tools-exposed-to-authentication-bypass-by-flaw-in-starlette-framework.html"
        publisher: "CSO Online"
        date: "2026-05-29"
        role: "corroborating"
      - url: "https://ccb.belgium.be/advisories/warning-vulnerability-starlette-framework-and-related-frameworks-fastapi-exposes"
        publisher: "Centre for Cybersecurity Belgium (CCB)"
        date: "2026-05-28"
        role: "corroborating"
    discovery_trace: "first seen at: ncsc-nl (bridge), URL https://advisories.ncsc.nl/advisory?id=NCSC-2026-0171 → pivot: X41 D-Sec advisory https://www.x41-dsec.de/lab/advisories/x41-2026-002-starlette → corroborating: GHSA-86qp-5c8j-p5mr → corroborating: CCB Belgium advisory"
    summary: |
      X41 D-Sec discovered CVE-2026-48710 (internally named BadHost) in January 2026 while auditing vLLM under an OSTIF grant, coordinating disclosure with the Starlette maintainer through February–May 2026. The flaw lives in Starlette's URL reconstruction logic: the framework concatenates the HTTP Host header with the request path to build `request.url` using the template `f"{scheme}://{host_header}{path}"`, but validates only the path against routing rules. When the Host header contains an RFC 3986-illegal character such as `/`, `?`, or `#`, the subsequent URL parse shifts path, query, and fragment boundaries. The result is that `request.url.path` — the value middleware uses for access control — diverges from the actual route path the handler receives, silently bypassing path-based authentication middleware. X41 demonstrated the bypass with a single-character injection: `curl -H 'Host: foo?' localhost:8000/admin` returns HTTP 200 instead of 403. The vulnerability is tracked under CWE-444 (Inconsistent Interpretation of HTTP Requests) and scored CVSS 4.0 at 7.0 (High) by X41 (`CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:N/VI:N/VA:N/SC:H/SI:H/SA:N`); the official GitHub advisory assigns CVSS 3.1 6.5 (Moderate). Affected versions: Starlette ≥0.8.3, <1.0.1; patch is 1.0.1 (released 2026-05-21). Downstream projects with confirmed exposure include FastAPI, vLLM, LiteLLM, Model Context Protocol (MCP) servers, OpenAI-compatible API proxies, and LLM inference dashboards. Starlette receives approximately 325 million downloads per week. Nginx and Apache HTTP Server correctly reject malformed Host headers before the request reaches the application layer, so deployments behind these reverse proxies are protected. Direct-listen Python servers — common in research, R&D, and evaluation environments — are fully exposed. The Centre for Cybersecurity Belgium (CCB) issued a "Patch Immediately" advisory. NCSC-NL classified the advisory as severity High/Medium (likelihood high). No active exploitation confirmed; proof-of-concept is public. Detection: proxy access logs and WAF rules should alert on Host header values containing `/`, `?`, or `#`. EDR parent-process monitoring for Python ASGI servers (`uvicorn`, `hypercorn`, `gunicorn`) may help baseline legitimate traffic patterns.
    ch_eu_nexus: "EU-wide; CCB Belgium national CERT advisory; NCSC-NL advisory 29 May; affects any EU public-sector or research organisation running FastAPI, LiteLLM or vLLM without a reverse proxy"
    public_sector_nexus: "direct — government AI platforms, university research APIs, national health LLM deployments using FastAPI are exposed if not proxied"
    sector: "technology, public-sector, healthcare, education, research"
    cves: [CVE-2026-48710]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Starlette versions before 1.0.1 did not validate the HTTP Host header when reconstructing request URLs, allowing attackers to inject paths and potentially bypass authentication based on the reconstructed URL path."
        attribution: "GitHub Security Advisory GHSA-86qp-5c8j-p5mr"
        source_url: "https://github.com/Kludex/starlette/security/advisories/GHSA-86qp-5c8j-p5mr"
      - quote: "The flaw exists in how Starlette reconstructs incoming request URLs. The framework joins the Host header with the requested path to form a complete URL, but parses them using different validation rules. When a Host header contains a slash, question mark, or hash character, 'the path Starlette reports no longer matches the one the server actually received.'"
        attribution: "CSO Online"
        source_url: "https://www.csoonline.com/article/4177711/fastapi-based-ai-tools-exposed-to-authentication-bypass-by-flaw-in-starlette-framework.html"
      - quote: "Example Attack: A malformed header like `Host: example.com/abc?bar=` transforms the path from `/foo` to `/abc`, bypassing path-based security checks."
        attribution: "X41 D-Sec Advisory x41-2026-002"
        source_url: "https://www.x41-dsec.de/lab/advisories/x41-2026-002-starlette"
    extended_notes: |
      The risk is amplified by AI-deployment patterns: MCP servers, LiteLLM proxies, and vLLM model-serving dashboards are frequently deployed with a single Python process listening directly on a high port, exposed internally to the developer subnet or externally for remote model access. These deployments often rely on path-based authentication (`/v1/admin`, `/api/management`) implemented in middleware rather than WAF rules. A defender hunt should enumerate Python ASGI processes and validate whether a reverse proxy (nginx, caddy, traefik) sits in front. For organisations running Kubernetes, check Service type (ClusterIP vs NodePort/LoadBalancer) and ingress controller configuration. Ingress controllers based on nginx (most common in EU public-sector Kubernetes) would block malformed Host headers by default.

  - title: "ENISA NIS360 2026 — public administrations, health, maritime and space sector remain in the NIS2 'risk zone'; space joins highest-criticality tier"
    sources:
      - url: "https://www.enisa.europa.eu/news/nis360-the-bigger-picture-on-maturity-and-criticality-of-nis-critical-sectors"
        publisher: "ENISA"
        date: "2026-05-28"
        role: "primary"
      - url: "https://ieu-monitoring.com/editorial/enisa-eu-critical-sectors-improve-cybersecurity-maturity-under-nis2/1242399"
        publisher: "INSIGHT EU MONITORING"
        date: "2026-05-29"
        role: "corroborating"
      - url: "https://www.heise.de/news/Cybersicherheit-Kritische-Infrastrukturen-holen-auf-doch-Risiko-Zone-waechst-11312014.html"
        publisher: "heise Security (DE)"
        date: "2026-05-29"
        role: "corroborating"
    discovery_trace: "first seen at: heise-sec (RSS feed), URL https://www.heise.de/news/Cybersicherheit-Kritische-Infrastrukturen-holen-auf-doch-Risiko-Zone-waechst-11312014.html → pivot: ENISA primary news page https://www.enisa.europa.eu/news/nis360-the-bigger-picture-on-maturity-and-criticality-of-nis-critical-sectors → corroborating: INSIGHT EU Monitoring article"
    summary: |
      ENISA published the third edition of NIS360 on 28 May 2026, its annual maturity-and-criticality assessment of all sectors covered by NIS2 Annex I. The report introduces a structural risk concept: a "risk zone" of sectors where operational criticality exceeds cybersecurity maturity, leaving them structurally under-defended relative to their systemic importance. In 2026 the risk-zone sectors are public administrations, health, maritime, ICT management services, railway, drinking water, and waste water. Space joins the highest-criticality tier for the first time, reflecting growing societal and cross-sector dependency on satellite and space-based services. Three sectors advanced to high maturity since last year: trust services, aviation, and financial market infrastructures. Gas began exiting the risk zone. The NIS360 maturity score integrates four dimensions: legislation effectiveness, company preparedness, national-authority institutional capacity, and sectoral ecosystem structures. For defenders in NIS2-scope public administrations (which remain in the risk zone), the report highlights that the gap between criticality and maturity is not primarily a technology gap but a governance gap: incident-reporting obligations and risk-management measures are unevenly implemented. Switzerland is not in scope for NIS2 but the bilateral framing of the EU-Switzerland Digital Access Act (in negotiation) means the maturity benchmarks have direct policy resonance for Swiss public-sector CISO offices. ENISA's full PDF is available at `https://www.enisa.europa.eu/sites/default/files/2026-05/ENISA%20NIS360%202026.pdf`. Defenders in risk-zone sectors should benchmark against the NIS360 maturity indicators: test incident-reporting timelines against the 24/72-hour NIS2 notification clock, validate risk-management documentation against Article 21 requirements, and verify supply-chain risk assessments particularly for ICT-managed-service dependencies (NIS2 Annex I, key sector).
    ch_eu_nexus: "EU-wide; Switzerland bilateral relevance; specific sectors named are public administrations, health, maritime, space — all present in CH/EU public-sector estate"
    public_sector_nexus: "direct — public administrations explicitly named as in the risk zone"
    sector: "public-sector, healthcare, maritime, transport, energy, space"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Public administrations remain in the risk zone, indicating cybersecurity maturity gaps despite operational criticality. The report emphasizes 'improved information sharing, stronger collaboration, and better implementation of risk management measures' drive maturity gains."
        attribution: "INSIGHT EU MONITORING"
        source_url: "https://ieu-monitoring.com/editorial/enisa-eu-critical-sectors-improve-cybersecurity-maturity-under-nis2/1242399"
      - quote: "Space has joined this year's group of most critical sectors, reflecting its growing role in society and across other sectors, which increases dependency, impact, and time criticality."
        attribution: "ENISA NIS360 2026"
        source_url: "https://www.enisa.europa.eu/news/nis360-the-bigger-picture-on-maturity-and-criticality-of-nis-critical-sectors"

  - title: "UPDATE: Nightmare Eclipse / Chaotic Eclipse — Microsoft's Digital Crimes Unit threatens criminal action; three actively exploited Windows zero-days patched, three (YellowKey, GreenPlasma, MiniPlasma) remain unpatched; researcher promises another July 14 release"
    sources:
      - url: "https://therecord.media/microsoft-calls-zero-day-releases-never-justifiable-as-researcher-threatens-more"
        publisher: "The Record (Recorded Future News)"
        date: "2026-05-29"
        role: "primary"
      - url: "https://www.heise.de/en/news/Too-many-zero-days-Microsoft-threatens-legal-action-11310736.html"
        publisher: "heise Security (EN)"
        date: "2026-05-28"
        role: "corroborating"
      - url: "https://www.theregister.com/security/2026/05/28/microsoft-0-day-feud-escalates-as-researcher-threatens-another-windows-exploit-dump/5248085"
        publisher: "The Register"
        date: "2026-05-28"
        role: "corroborating"
    discovery_trace: "first seen at: heise-sec (RSS feed), URL https://www.heise.de/news/Zu-viele-Zero-Days-Microsoft-droht-mit-Gericht-11310723.html → pivot: The Record primary article https://therecord.media/microsoft-calls-zero-day-releases-never-justifiable-as-researcher-threatens-more → corroborating: The Register"
    summary: |
      On 28–29 May 2026 the dispute between pseudonymous researcher Nightmare Eclipse (also operating as Chaotic Eclipse) and Microsoft reached a new escalation: Microsoft's Digital Crimes Unit issued a formal threat of criminal action against the researcher, stating that uncoordinated zero-day releases are "never justifiable" and that its DCU would "continue bringing cases against these actors and those that enable their criminal activity." The researcher countered that Microsoft deleted their MSRC reporting account, withheld bounty payments, and removed attribution from published advisories. The dispute involves six Windows LPE/bypass vulnerabilities released publicly over six weeks: BlueHammer (CVE-2026-33825), UnDefend (CVE-2026-45498), and RedSun (CVE-2026-41091) were all subsequently patched by Microsoft and saw active exploitation in the wild shortly after public PoC release; YellowKey (CVE-2026-45585, BitLocker bypass via WinRE requiring physical access), GreenPlasma, and MiniPlasma remain unpatched as of 30 May 2026. The researcher's GitHub and GitLab accounts were banned after hosting the PoC code; BlueHammer, RedSun, and UnDefend saw real-world exploitation within days of publication. The researcher announced a "July 14" release date for additional unspecified Windows vulnerabilities. Microsoft's legal threat drew sharp criticism from the wider security community: former Tenable CEO Amit Yoran's prior criticism of Microsoft's vulnerability-disclosure practices was widely recirculated; Trend Micro cited analogous non-responsiveness in 2024; Katie Moussouris warned that vendor legal threats drive researchers toward full non-disclosure. The three unpatched vulnerabilities (YellowKey, GreenPlasma, MiniPlasma) have no vendor-issued mitigations beyond BitLocker PIN policy (for YellowKey). Defenders should monitor for Windows Recovery Environment (`winre.wim`) tampering (Sysmon EID 11 on WinRE path), process lineage from `reagentc.exe`, and unusual `bcdboot.exe` or `bcdedit.exe` execution (Sysmon EID 1 with parent-image checks). The July 14 release should be treated as a hard deadline for patching any outstanding Windows LPE chain gaps.
    ch_eu_nexus: "global; directly relevant to CH/EU public-sector Windows estates running BitLocker + TPM-only configuration (unmitigated YellowKey exposure)"
    public_sector_nexus: "direct — government Windows estates with BitLocker TPM-only configs are exposed to YellowKey"
    sector: "all, public-sector, technology"
    cves: [CVE-2026-45585, CVE-2026-33825, CVE-2026-45498, CVE-2026-41091]
    actors_campaigns_malware: ["Nightmare Eclipse", "Chaotic Eclipse"]
