  - title: "Red Canary primer: detecting privilege escalation and persistence via autonomous AI agents in Microsoft Entra Agent ID"
    sources:
      - url: "https://redcanary.com/blog/threat-detection/entra-id-ai-workflows/"
        publisher: "Red Canary"
        date: "2026-05-27"
        role: "primary"
    discovery_trace: "first seen at: redcanary RSS feed https://redcanary.com/feed/ → article https://redcanary.com/blog/threat-detection/entra-id-ai-workflows/"
    summary: |
      Red Canary published a detection-engineering primer on the new Entra Agent ID identity class — autonomous apps that perform actions in a tenant without human interaction. The primer demonstrates how a misconfigured or adversary-controlled agent identity can be assigned the AgentIdentityBlueprint.AddRemoveCreds.All role, enabling it to add client secrets to any agent blueprint, authenticate as any agent identity in the tenant, and persist access after legitimate credential rotation. Privilege escalation path: agent app → malicious role assignment → credential injection → authenticate as high-privilege agent identity → pivot to downstream resources. Key log sources for detection: AuditLogs (look for "Update application – Certificates and secrets management" with non-human InitiatedBy.app.servicePrincipalId); MicrosoftGraphActivityLogs (Graph API calls from agent service principals, IP and UserAgent fields); AADServicePrincipalSignInLogs (filter on Agent.agentType: agenticAppInstance). Correlation: match SignInActivityId from Graph logs to UniqueTokenIdentifier in sign-in logs to reconstruct credential-add-to-authentication chains. Defenders should establish baselines for each agent identity's normal API scope, alert on credential additions to blueprints by any identity other than the provisioning pipeline, and audit which agents hold dangerous app roles. MITRE ATT&CK relevant techniques: T1098 Account Manipulation, T1078.004 Valid Accounts: Cloud Accounts (implied).
    ch_eu_nexus: "global; Microsoft Entra is the dominant identity platform in Swiss public-sector organisations; EU government adoption of AI agents in productivity suites is accelerating"
    public_sector_nexus: "direct — Entra is the identity backbone of most public-sector M365 deployments"
