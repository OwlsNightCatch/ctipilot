    discovery_trace: "first seen at: risky-biz-news RSS feed URL https://news.risky.biz/rss/ → drill: https://news.risky.biz/risky-bulletin-dutch-police-take-down-giant-botnet-of-17-million-devices/ → BleepingComputer primary https://www.bleepingcomputer.com/news/security/dutch-govt-disrupts-malware-botnet-with-17-million-infected-devices/ → corroborating: HelpNetSecurity https://www.helpnetsecurity.com/2026/05/29/dutch-police-disrupts-botnet-composed-of-17-million-devices/"
    summary: |
      Dutch National Police and NCSC-NL executed a takedown of infrastructure supporting the Asocks commercial residential proxy service, which operators had weaponised as a botnet of approximately 17 million infected consumer devices including computers, mobile phones, routers, smart cameras, and other IoT devices. After a tip from a security researcher at NCSC-NL, police seized 200 servers physically located in the Netherlands from a hosting provider; the provider then took remaining infrastructure offline upon discovering the criminal use. Asocks generated revenue by renting access to the infected devices' IP addresses, enabling cybercriminals to route DDoS attack traffic, spam, credential-stuffing, brute-force, click-fraud, and SMS-pumping campaigns through trusted residential IPs that are substantially harder to block than known datacenter ranges. Device compromise occurred through bundled software installers (PUP model) and malware. Asocks shares infrastructure and operational DNA with previously disrupted residential proxy networks 5socks, Anyproxy, and SocksEscort. HUMAN Security's Satori team and Sekoia.io are cited as prior researchers into this ecosystem. Defender recommendation: block commercial residential-proxy IP ranges at perimeter; monitor for outbound SOCKS5 proxy establishment from endpoint telemetry; treat unusual volume spikes in authentication logs from consumer-ISP address space as a credential-stuffing indicator.
