    discovery_trace: "first seen at: hackernews feed, URL https://feeds.feedburner.com/TheHackersNews → pivot: THN article https://thehackernews.com/2026/05/new-russian-linked-greyvibe-targets.html → pivot: SecurityWeek https://www.securityweek.com/russia-linked-greyvibe-attackers-use-ai-to-supercharge-cyberattacks/ → primary: WithSecure Labs https://labs.withsecure.com/publications/greyvibe"
    summary: |
      WithSecure's threat intelligence team disclosed GREYVIBE, a previously undocumented Russia-nexus group targeting Ukrainian military, government, civilian, and business entities since at least August 2025. The group operates five parallel attack chains: PhantomMail (spear-phishing delivering ZIP/RAR archives hosted on Google Drive and 4sync), PhantomClick (fake CAPTCHA pages impersonating Zoom and LAPAS), PrincessClub (fraudulent adult-club websites serving Android malware via WebRTC), DroneLink (fraudulent Ukrainian Armed Forces charity sites), and Nebo (malware mimicking Russian military login interfaces). GREYVIBE's malware includes PhantomRelay and PhantomRelayV1 (PowerShell RATs with watchdog persistence), LegionRelay (lightweight PowerShell RAT), and FallSpy (Android spyware). The group uses ChatGPT, Google Gemini, and Ideogram AI to generate lure imagery, develop and obfuscate loader scripts, build backend infrastructure, and draft post-compromise command sequences. AI usage is assessed to bridge gaps in technical expertise — code artifacts show design flaws typical of LLM-generated output (e.g. variable-naming artefacts, internet-slang handles like 'letsrollboyos', 'totallyunsus'). The group's ISO builder shares artefacts with the TrickBot ecosystem and UAC-0098 cluster. FallSpy targets Android devices via fake adult-club registration flows exploiting WebRTC permission prompts. GREYVIBE is assessed as low-to-moderately sophisticated; AI usage enables operational ambition exceeding technical skill. Detection: monitor for PowerShell execution spawning from browser-downloaded archives (Sysmon EID 1, parent process patterns matching archive extraction utilities); hunt for scheduled tasks created by PowerShell scripts that beacon to dynamic DNS; Android MDM telemetry for sideloaded APKs accessing microphone/camera.
    ch_eu_nexus: "Targets Ukrainian entities; Russian state-aligned group relevant to EU member states supporting Ukraine. European organisations aiding Ukraine are plausible secondary targets."
