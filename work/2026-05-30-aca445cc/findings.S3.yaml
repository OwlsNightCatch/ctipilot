  - title: "Kimsuky (Velvet Chollima) deploys HTTPSpy RAT and HelloDoor (Rust-based PebbleDash variant) with VS Code Remote Tunnel and Cloudflare tunnel C2 evasion"
    sources:
      - url: "https://thehackernews.com/2026/05/kimsuky-deploys-httpspy-expands-arsenal.html"
        publisher: "The Hacker News"
        date: "2026-05-29"
        role: "primary"
      - url: "https://www.enki.co.kr/en/media-center/blog/kimsuky-s-advanced-attack-techniques-jsonping-webex-spoofing-and-a-new-httpspy-variant"
        publisher: "ENKI WhiteHat"
        date: "2026-05-27"
        role: "corroborating"
    discovery_trace: "first seen at: hackernews RSS feed https://feeds.feedburner.com/TheHackersNews → THN article https://thehackernews.com/2026/05/kimsuky-deploys-httpspy-expands-arsenal.html → corroborating: ENKI primary blog https://www.enki.co.kr/en/media-center/blog/kimsuky-s-advanced-attack-techniques-jsonping-webex-spoofing-and-a-new-httpspy-variant (Framer SPA — text not extractable)"
    summary: |
      Kimsuky (aka Velvet Chollima, North Korea nexus) ran campaigns targeting South Korean military personnel and corporate entities in March and April 2026. March campaign: malicious executables "nos-setup.exe" and "astx-setup.exe" masquerade as nProtect Online Security and AhnLab Safe Transaction installers; they launch MemLoader.dll via regsvcs.exe, which then downloads and executes HTTPSpy. April campaign: fake Webex meeting page directs victims to download encrypted JavaScript files ("fix-camera.jse"), which deploy an intermediate PowerShell downloader, ultimately installing HTTPSpy. HTTPSpy (first observed 2022, previously used against a German defence manufacturer from May–September 2024) is a full-capability RAT supporting: shell command execution, file upload/download, screenshot capture, process injection, and self-deletion. It uses RC4 encryption for C2 communication. HelloDoor is a Rust-based PebbleDash variant first identified in August 2025, likely LLM-assisted development per ENKI assessment; it supports basic command execution, directory traversal, and configurable sleep intervals. Kimsuky's C2 evasion now abuses legitimate infrastructure: Visual Studio Code Remote Tunneling (authenticated via GitHub OAuth) and Cloudflare Quick Tunnels eliminate traditional C2 channels — network defenders cannot block these by IP/domain without blocking Microsoft and Cloudflare services. The JSONPing technique uses a locally-running web server to verify infection status via real-time GET request polling, reducing exposure of C2 endpoints. Selective payload delivery based on C2-side monitoring of GET requests further limits detection opportunities. Detection: hunt for regsvcs.exe as a parent process of DLL loads; monitor for VS Code Remote Tunnel process spawns from non-developer endpoints (VSCode CLI arguments --tunnel --name <random>); audit GitHub OAuth application grants for unknown VS Code tunnel registrations; monitor Cloudflare Tunnel (cloudflared.exe) processes on managed endpoints.
