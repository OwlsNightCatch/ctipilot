  - title: "Sysdig TRT: first observed LLM-agent-driven intrusion — CVE-2026-39987 (Marimo RCE) to internal database exfiltration in 4 pivots under 1 hour"
    sources:
      - url: "https://www.sysdig.com/blog/ai-agent-at-the-wheel-how-an-attacker-used-llms-to-move-from-a-cve-to-an-internal-database-in-4-pivots"
        publisher: "Sysdig TRT"
        date: "2026-05-26"
        role: "primary"
      - url: "https://thehackernews.com/2026/05/attackers-use-llm-agent-for-post.html"
        publisher: "The Hacker News"
        date: "2026-05-29"
        role: "corroborating"
    discovery_trace: "first seen at: hackernews feed URL https://feeds.feedburner.com/TheHackersNews → THN article https://thehackernews.com/2026/05/attackers-use-llm-agent-for-post.html → primary: Sysdig TRT blog https://www.sysdig.com/blog/ai-agent-at-the-wheel-how-an-attacker-used-llms-to-move-from-a-cve-to-an-internal-database-in-4-pivots"
    summary: |
      Sysdig's Threat Research Team documented what they assess as the first observed LLM-agent-driven intrusion in the wild. On 2026-05-10, an unknown threat actor exploited CVE-2026-39987, a pre-auth RCE in Marimo notebook (all versions < 0.20.4; patched in 0.23.0), to gain initial execution on an internet-accessible notebook instance (T1190 Exploit Public-Facing Application). From that foothold, an AI agent drove four subsequent pivots: (1) extracted two cloud credentials from the host filesystem (T1552.001 Credentials In Files); (2) replayed them through a Cloudflare Workers egress pool to call AWS Secrets Manager APIs and retrieve an SSH private key (T1555 Credentials from Password Stores); (3) executed eight parallel SSH sessions against a downstream bastion server using the retrieved key (T1021.004 SSH); (4) exfiltrated the full schema and contents of a downstream PostgreSQL database within two minutes (T1048 Exfiltration Over Alternative Protocol). Sysdig identified four indicators of LLM agent involvement: improvised database schema discovery without prior environmental knowledge; a Chinese-language planning comment in the command stream ("看还能做什么" — "See what else we can do"); machine-optimised command formatting (delimiter-separated commands, bounded output caps, stderr discarded, `less` disabled); and sequential value hand-offs from prior outputs into subsequent commands. The egress pool used Cloudflare Workers to obscure the attacker's origin IP. No attribution was made. Defender countermeasures: update Marimo to >= 0.23.0; audit internet-accessible notebook deployments; monitor AWS CloudTrail for Secrets Manager:GetSecretValue calls from unexpected IPs; restrict SSH bastion access to known IP ranges; use Sysdig/Falco behavioural rules for anomalous process chains spawned from notebook kernels.
    ch_eu_nexus: "global; any internet-exposed Marimo notebook is at risk; cloud-heavy EU public-sector environments running AI development toolchains are directly in scope"
    public_sector_nexus: "indirect — toolchain risk"
    sector: "technology, cloud, AI infrastructure"
