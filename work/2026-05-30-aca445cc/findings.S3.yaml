  - title: "ChatGPhish: Permiso Security discloses ChatGPT Markdown-rendering flaw enabling prompt injection and web-page-as-phishing-payload attacks"
    sources:
      - url: "https://permiso.io/blog/chatgpt-markdown-rendering-vulnerability"
        publisher: "Permiso Security (P0 Labs)"
        date: "2026-05-29"
        role: "primary"
      - url: "https://thehackernews.com/2026/05/chatgphish-vulnerability-turns-chatgpt.html"
        publisher: "The Hacker News"
        date: "2026-05-29"
        role: "corroborating"
    discovery_trace: "first seen at: hackernews RSS feed URL https://feeds.feedburner.com/TheHackersNews → THN article https://thehackernews.com/2026/05/chatgphish-vulnerability-turns-chatgpt.html → primary: Permiso P0 Labs https://permiso.io/blog/chatgpt-markdown-rendering-vulnerability"
    summary: |
      Permiso Security's P0 Labs (researcher Andi Ahmeti) publicly disclosed ChatGPhish, a vulnerability class in ChatGPT's web summarisation feature. The chatgpt.com response renderer unconditionally trusts Markdown links and image URLs extracted from third-party pages it summarises, rendering them as live, clickable elements and auto-fetching inline images inside the trusted assistant UI. An attacker can embed a small Markdown payload on any web page (GitHub README, SaaS dashboard, documentation portal, blog). When a victim asks ChatGPT to summarise the page, the payload executes silently and can: (1) exfiltrate the victim's IP address, User-Agent, and Referer via attacker-hosted image fetch; (2) render malicious links styled identically to genuine ChatGPT output, enabling targeted phishing; (3) inject fake system-style security alerts; (4) serve QR codes from attacker-controlled S3 buckets, bypassing desktop URL filters and enterprise security controls by moving the click action to the victim's mobile device. Permiso submitted the report to OpenAI via Bugcrowd on 2026-04-29 under the title "Untrusted Markdown Rendering Leads to XSS, Phishing, and Data Exfiltration"; after follow-up on 2026-05-07, OpenAI marked it as not reproducible then as a duplicate without resolution. Research was published on 2026-05-29. No CVE has been assigned. Defenders using ChatGPT in enterprise workflows should educate users that any AI-summarised page can carry attacker instructions; restrict ChatGPT's access to internal documentation portals; consider proxy-based content-security-policy (CSP) enforcement on the ChatGPT SaaS endpoint.
    ch_eu_nexus: "global; direct risk to any enterprise workforce using ChatGPT for document summarisation, including Swiss public-sector users of AI productivity tools"
    public_sector_nexus: "indirect — AI productivity workflow risk"
