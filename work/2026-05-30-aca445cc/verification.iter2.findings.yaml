  summary: "Fetched CNIL primary (https://www.cnil.fr/en/health-data-fine-5-million-euros-against-iqvia) and PPC.land (https://ppc.land/cnil-fines-iqvia-eur5m-for-health-data-warehouse-breaches/) this iteration. Neither source mentions Art. 21 (right to object) or stated patient objections as a violation. CNIL cites Art. 14 GDPR (failure to inform data subjects), Art. 25 GDPR (data protection by design), Art. 9 GDPR (special-category data), and Art. 66 French Data Protection Act (warehouse authorization conditions exceeded). PPC.land confirms the same set. The brief misidentifies the GDPR basis as Art. 21 and characterises it as an objection-right enforcement failure. Fix: Replace Art. 21 / patient-objections framing with the actual violations — warehouses operated beyond their authorized scope (French DPA Art. 66) and patients were not informed data flowed to IQVIA (GDPR Art. 14)."
