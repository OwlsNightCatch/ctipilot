  - title: "Oracle June 2026 CPU: Solaris RAD and PeopleSoft critical unauthenticated RCE (CVE-2026-46978, CVE-2026-35278)"
    sources:
      - url: "https://www.securityweek.com/oracle-releases-245-security-patches-in-june-2026-critical-patch-update/"
        publisher: "SecurityWeek"
        date: "2026-06-17"
        role: "primary"
      - url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0416"
        publisher: "NCSC-NL"
        date: "2026-06-17"
        role: "corroborating"
      - url: "https://nvd.nist.gov/vuln/detail/CVE-2026-46978"
        publisher: "NVD/NIST"
        date: "2026-06-17"
        role: "corroborating"
      - url: "https://nvd.nist.gov/vuln/detail/CVE-2026-35278"
        publisher: "NVD/NIST"
        date: "2026-06-17"
        role: "corroborating"
      - url: "https://www.oracle.com/security-alerts/cpujun2026.html"
        publisher: "Oracle PSIRT"
        date: "2026-06-17"
        role: "primary-advisory"
    discovery_trace: "first seen at: bridge:ncsc-nl.recent, URL https://advisories.ncsc.nl/rss/advisories → pivot: NCSC-NL CSAF for NCSC-2026-0416 → primary: SecurityWeek https://www.securityweek.com/oracle-releases-245-security-patches-in-june-2026-critical-patch-update/ → corroborating: NVD CVE-2026-46978 + CVE-2026-35278"
    summary: |
      Oracle released its June 2026 Critical Patch Update on 2026-06-17 addressing 245 vulnerabilities.
      Two critical unauthenticated remote code execution vulnerabilities are highlighted here as operationally
      significant for Swiss/EU public-sector environments. CVE-2026-46978 (CVSS 10.0, CWE-284) affects Oracle
      Solaris 11.4's Remote Administration Daemon (RAD), the management API service listening by default on HTTPS.
      An unauthenticated remote attacker can exploit the vulnerability over HTTPS without any prerequisites.
      CVE-2026-35278 (CVSS 9.8, CWE-306) affects Oracle PeopleSoft PeopleTools 8.61 and 8.62 Performance Monitor
      — unauthenticated HTTP access to the Performance Monitor endpoint enables RCE. Both CVEs carry complete
      confidentiality/integrity/availability impact. Additionally, CVE-2026-21962 (CVSS 10.0, CWE-284) affecting
      the Oracle HTTP Server / WebLogic Server Proxy Plug-in was previously listed in the January 2026 CPU and
      is re-addressed in this update cycle. Oracle has not reported active exploitation as of advisory publication;
      however, CVSS 10.0 and unauthenticated attack vectors warrant emergency patching prioritisation.
      Detection focus: RAD process spawning unexpected child processes (Sysmon EID 1, parent process rad or
      radrelay), anomalous HTTPS connections to Solaris management interfaces; for PeopleSoft, web-server access
      logs showing POST/GET to /PSEMHUB/hub.do or Performance Monitor servlet paths from external source IPs.
    ch_eu_nexus: "global; Oracle Solaris and PeopleSoft widely deployed in EU/CH public-sector HR and financial systems"
    public_sector_nexus: "direct — PeopleSoft is a core HR/ERP platform in CH/EU government deployments"
    sector: "public-sector, finance, higher-education"
    cves: [CVE-2026-46978, CVE-2026-35278, CVE-2026-21962]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Oracle has released its June 2026 Critical Patch Update (CPU) with patches for 245 security vulnerabilities"
        attribution: "SecurityWeek"
        source_url: "https://www.securityweek.com/oracle-releases-245-security-patches-in-june-2026-critical-patch-update/"
      - quote: "CVE-2026-46978 — CVSS Base Score 10.0 — Solaris 11.4 — Remote Administration Daemon — unauthenticated network exploitable"
        attribution: "NVD/NIST"
        source_url: "https://nvd.nist.gov/vuln/detail/CVE-2026-46978"
      - quote: "CVE-2026-35278 — CVSS Base Score 9.8 — PeopleSoft PeopleTools 8.61 and 8.62 — Performance Monitor — Missing Authentication for Critical Function (CWE-306)"
        attribution: "NVD/NIST"
        source_url: "https://nvd.nist.gov/vuln/detail/CVE-2026-35278"
    extended_notes: |
      Oracle PeopleSoft PeopleTools versions affected: 8.61 and 8.62 (fixed in 8.61.18 and 8.62.07 or later per CPU advisory).
      Oracle Solaris affected: 11.4 (fix included in June 2026 SRU). The RAD daemon (rad / radrelay) can be
      disabled or scoped to localhost if remote administration is not required as a interim hardening measure.
      CVE-2026-21962 affects OHS/WebLogic Proxy Plug-in across WebLogic Server 12.2.1.3, 12.2.1.4, 14.1.1.0
      and Oracle HTTP Server 12.2.1.4 — previously addressed in Jan 2026 CPU; customers on interim builds
      should verify patch level.

  - title: "CVE-2026-50656 RoguePlanet — Microsoft Defender Antivirus EoP, CVSS 7.8, public PoC, no patch"
    sources:
      - url: "https://www.bleepingcomputer.com/news/security/researcher-releases-poc-for-windows-defender-zero-day-exploit/"
        publisher: "BleepingComputer"
        date: "2026-06-17"
        role: "primary"
      - url: "https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-50656"
        publisher: "Microsoft MSRC"
        date: "2026-06-16"
        role: "primary-advisory"
      - url: "https://www.securityweek.com/microsoft-defender-zero-day-cve-2026-50656-has-public-poc/"
        publisher: "SecurityWeek"
        date: "2026-06-17"
        role: "corroborating"
    discovery_trace: "first seen at: WebSearch ('Microsoft Defender EoP zero day June 2026 CVE') → primary: BleepingComputer https://www.bleepingcomputer.com/news/security/researcher-releases-poc-for-windows-defender-zero-day-exploit/ → corroborating: MSRC https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-50656 → corroborating: SecurityWeek"
    summary: |
      CVE-2026-50656, nicknamed RoguePlanet by the discovering researcher Nightmare Eclipse, is an
      Elevation of Privilege vulnerability in Microsoft Defender Antivirus (mpengine.dll). CVSS 7.8,
      CWE-59 (Improper Link Resolution Before File Access — link-following). Exploitation requires
      local access (standard user or low-privileged process), making it a post-initial-access
      privilege-escalation primitive. The vulnerability is a race condition in the SysIO* class of
      mpengine — the engine's file-system scanning code follows an attacker-controlled symbolic link
      between the time the path is enumerated and the time the privileged write occurs, enabling
      write to an arbitrary location as SYSTEM. A public proof-of-concept was released on 2026-06-16,
      the same day Microsoft acknowledged the vulnerability. MSRC rates exploitation likelihood as
      "More Likely." No patch is yet available. Technique: T1068 Exploitation for Privilege Escalation.
      Detection: Sysmon EID 11 (FileCreate) or EID 23 (FileDelete) in protected system paths originating
      from a non-SYSTEM process; process creation (Sysmon EID 1) of cmd.exe / powershell.exe with
      Defender/MsMpEng.exe as grandparent; Windows Security EID 4672 (Special Privileges) assigned to
      an unexpected session. Hardening: no vendor patch available; consider enabling WDAC / AppLocker
      policies to restrict execution of untrusted binaries that could carry the PoC; monitor for
      anomalous symbolic-link creation using driver-level ETW (ObjectType=SymbolicLink).
    ch_eu_nexus: "global; Microsoft Defender is the default AV on every Windows endpoint in CH/EU public-sector fleets"
    public_sector_nexus: "direct — ubiquitous Windows endpoint AV"
    sector: "all-sectors"
    cves: [CVE-2026-50656]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "A researcher has released a proof-of-concept (PoC) exploit for CVE-2026-50656, a zero-day elevation of privilege vulnerability in Microsoft Defender Antivirus"
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/researcher-releases-poc-for-windows-defender-zero-day-exploit/"
      - quote: "Exploitation More Likely — No patch available — CVSS 7.8 — Elevation of Privilege — Windows Defender Antivirus"
        attribution: "Microsoft MSRC"
        source_url: "https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-50656"
    extended_notes: |
      The specific vulnerable function is in the mpengine!SysIO* class — the Defender engine's
      privileged file-system access pathway. The race window is between path enumeration and
      privileged write. Exploitation has been demonstrated on Windows 10/11 and Windows Server 2019/2022.
      Microsoft has not yet assigned a Patch Tuesday release date. Defenders should watch MSRC for
      an out-of-band update.

  - title: "Mastra npm supply-chain attack via hijacked easy-day-js: credential stealer stage-2 deployed to 144 packages"
    sources:
      - url: "https://socket.dev/blog/mastra-supply-chain-attack-easy-day-js"
        publisher: "Socket Security"
        date: "2026-06-17"
        role: "primary"
      - url: "https://www.bleepingcomputer.com/news/security/mastra-npm-package-backdoored-via-easy-day-js-supply-chain-attack/"
        publisher: "BleepingComputer"
        date: "2026-06-17"
        role: "corroborating"
      - url: "https://www.endorclabs.com/blog/mastra-supply-chain-attack-easy-day-js"
        publisher: "Endor Labs"
        date: "2026-06-17"
        role: "corroborating"
    discovery_trace: "first seen at: WebSearch ('npm supply chain attack June 2026 Mastra easy-day-js') → primary: Socket Security https://socket.dev/blog/mastra-supply-chain-attack-easy-day-js → corroborating: BleepingComputer + Endor Labs"
    summary: |
      On 2026-06-17, Socket Security disclosed a software supply-chain compromise affecting the Mastra
      AI orchestration framework's npm ecosystem. An attacker hijacked the npm account of contributor
      ehindero and published poisoned easy-day-js@1.11.22. The malicious version injects a postinstall
      lifecycle hook (node setup.cjs) into the package, which executes a Stage 1 loader that disables
      TLS certificate verification and self-deletes. The Stage 1 loader then fetches and executes a
      Stage 2 payload — a credential stealer that (a) establishes persistence via a scheduled-task or
      cron-equivalent, (b) exfiltrates crypto wallet files and browser-saved credentials, and (c) polls
      a C2 endpoint for follow-on commands. Approximately 144 downstream packages in the Mastra
      ecosystem pulled easy-day-js as a dependency, with @mastra/core carrying approximately 918,000
      weekly downloads. The poisoned easy-day-js@1.11.22 has been removed from npm, but packages
      already installed with that version in lock files remain affected. MITRE ATT&CK: T1195.002
      (Compromise Software Supply Chain), T1543 (Create or Modify System Process — persistence),
      T1056.001 (Keylogging), T1071.001 (Application Layer Protocol — C2 polling). Detection: npm
      audit output flagging easy-day-js@1.11.22; process-creation events (Sysmon EID 1) showing
      node.exe spawning setup.cjs or an encoded powershell.exe / bash child; filesystem writes to
      wallet directories (AppData\Roaming\Metamask, .config/metamask, etc.); scheduled-task creation
      by a node.exe parent (EID 4698 Windows / crontab modification Linux). Hardening: pin
      easy-day-js to a pre-1.11.22 verified version or remove dependency; enforce npm package
      integrity via lockfile hash verification in CI; enable provenance attestation checks.
    ch_eu_nexus: "global supply-chain; affects any CH/EU development or AI-pipeline environment using Mastra / easy-day-js"
    public_sector_nexus: "indirect — government development shops, AI procurement pipelines"
    sector: "technology, software-development, public-sector-IT"
    cves: []
    actors_campaigns_malware: ["easy-day-js supply chain", "Stage-2 credential stealer"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Socket researchers identified that easy-day-js@1.11.22 was injected with a malicious postinstall hook targeting Mastra ecosystem packages"
        attribution: "Socket Security"
        source_url: "https://socket.dev/blog/mastra-supply-chain-attack-easy-day-js"
      - quote: "The attack hijacked contributor account ehindero to publish the poisoned package, impacting approximately 144 downstream Mastra packages with @mastra/core at 918K weekly downloads"
        attribution: "Endor Labs"
        source_url: "https://www.endorclabs.com/blog/mastra-supply-chain-attack-easy-day-js"
    extended_notes: |
      The attack vector is the npm lifecycle hook mechanism — any package with a `postinstall` script
      runs arbitrary code during `npm install`. CI pipelines that run `npm ci` against a poisoned
      lock file are equally at risk. The Stage 2 stealer targets Metamask, Coinbase Wallet, and
      Exodus browser extension storage directories, as well as Chrome/Firefox saved-credential vaults.
      Mastra maintainers have issued a clean release; consumers should rotate any secrets (API keys,
      tokens) present on systems where the poisoned version was installed.

  - title: "FortiBleed: 73,932 FortiGate admin credential sets leaked, SHA-256 hash cracking, PBKDF2 migration gap"
    sources:
      - url: "https://www.bleepingcomputer.com/news/security/fortibleed-73932-fortigate-admin-credentials-leaked-online/"
        publisher: "BleepingComputer"
        date: "2026-06-17"
        role: "primary"
      - url: "https://arcticwolf.com/resources/blog/fortibleed-fortinet-vpn-credential-exposure/"
        publisher: "Arctic Wolf"
        date: "2026-06-17"
        role: "corroborating"
      - url: "https://www.fortiguard.com/psirt/FG-IR-26-FortiBleed"
        publisher: "Fortinet PSIRT"
        date: "2026-06-17"
        role: "primary-advisory"
    discovery_trace: "first seen at: WebSearch ('FortiBleed Fortinet credentials leaked June 2026') → primary: BleepingComputer https://www.bleepingcomputer.com/news/security/fortibleed-73932-fortigate-admin-credentials-leaked-online/ → corroborating: Arctic Wolf https://arcticwolf.com/resources/blog/fortibleed-fortinet-vpn-credential-exposure/ → vendor advisory: Fortinet PSIRT"
    summary: |
      On 2026-06-17, a threat actor published 73,932 FortiGate admin credential sets (username, SHA-256
      password hash, management IP) on underground forums, branded "FortiBleed." The data originates from
      a previously disclosed information-disclosure vulnerability chain (believed to overlap with
      CVE-2022-40684 / FortiOS authentication bypass and related config-read primitives) that allowed
      unauthenticated reading of hashed credential files. The critical operational risk is a PBKDF2
      migration gap: FortiOS 7.2.11, 7.4.8, and 7.6.1 introduced PBKDF2-SHA256 for new password hashes,
      but existing admin passwords set before the upgrade remain as plain SHA-256 until the admin
      explicitly re-authenticates after upgrade. SHA-256 password hashes are trivially crackable offline
      (GPU-accelerated hashcat benchmarks exceed 10 billion hashes/second). Organisations that upgraded
      FortiOS but have not forced admin password resets post-upgrade are at elevated risk of account
      takeover via cracked credentials. MITRE ATT&CK: T1078.004 (Valid Accounts — Cloud/Device Admin),
      T1110.002 (Brute Force — Password Cracking). Detection: review FortiGate admin login audit logs
      (event log: user=admin, logdesc="Admin login successful" from unexpected source IPs); enable admin
      login alerting in FortiOS; check whether management interface is exposed to the internet (FortiGate
      HTTPS / SSH on WAN interface). Hardening: force immediate admin password reset post-upgrade to
      trigger PBKDF2 hash generation; restrict management interface access to out-of-band networks or
      jump hosts; enable MFA for all admin accounts; verify FortiOS is at 7.2.11+, 7.4.8+, or 7.6.1+.
    ch_eu_nexus: "direct — FortiGate is ubiquitous in Swiss and EU public-sector perimeter security; CH government uses FortiGate extensively"
    public_sector_nexus: "direct"
    sector: "public-sector, telco, finance, critical-infrastructure"
    cves: []
    actors_campaigns_malware: ["FortiBleed credential set leak"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "A threat actor has leaked 73,932 FortiGate administrator credentials including usernames, SHA-256 password hashes, and management IP addresses in an event researchers are calling FortiBleed"
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/fortibleed-73932-fortigate-admin-credentials-leaked-online/"
      - quote: "FortiOS 7.2.11, 7.4.8, and 7.6.1 introduced PBKDF2 hashing but passwords set before the upgrade are still stored as SHA-256 until the admin performs a post-upgrade login"
        attribution: "Arctic Wolf"
        source_url: "https://arcticwolf.com/resources/blog/fortibleed-fortinet-vpn-credential-exposure/"
    extended_notes: |
      The PBKDF2 migration gap is the acute risk here — even patched and upgraded FortiOS installations
      retain SHA-256 hashes for accounts that haven't been reset. Admin teams should run
      `diagnose sys flash admin` (or equivalent CLI) to audit which admin accounts still hold
      SHA-256-format hashes and force password changes before the cracked credentials enable adversary
      access. The SHA-256 algorithm used by pre-7.2.11 FortiOS is unsalted, making rainbow-table
      attacks viable for common passwords.

  - title: "Rockwell Automation FLEX I/O CVE-2026-0647: unauthenticated web interface password reset, CVSS 9.4, ICS/OT"
    sources:
      - url: "https://security-hub.ncsc.admin.ch/api/csh-api/posts/2026-06-17-rockwell-flex-io"
        publisher: "NCSC-CH CSH / GovCERT.ch"
