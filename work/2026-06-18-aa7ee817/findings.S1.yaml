        role: "primary"
      - url: "https://www.cisa.gov/news-events/ics-advisories/icsa-26-168-02"
        publisher: "CISA ICS-CERT"
        date: "2026-06-17"
        role: "corroborating"
      - url: "https://rockwellautomation.custhelp.com/app/answers/answer_view/a_id/1145599"
        publisher: "Rockwell Automation PSIRT"
        date: "2026-06-16"
        role: "primary-advisory"
    discovery_trace: "first seen at: bridge:ncsc-csh.recent → NCSC-CH CSH post 2026-06-17 Rockwell → primary: NCSC-CH CSH URL → corroborating: CISA ICS-CERT ICSA-26-168-02 → vendor advisory: Rockwell Automation PSIRT"
    summary: |
      CVE-2026-0647 affects Rockwell Automation 1794-AENTR / 1794-AENTRXT FLEX I/O EtherNet/IP adapters.
      CVSS v3.1 score 9.4 (CVSS v4.0: 8.8), CWE-306 (Missing Authentication for Critical Function).
      An unauthenticated attacker with network access to the device's embedded web interface can send
      a crafted HTTP GET request to reset the device administrator password without prior authentication.
      Affected firmware: 2.012 and prior. Fixed firmware: 2.013. The vulnerability is on the device's
      built-in HTTP management interface, which is typically exposed on OT/ICS plant networks. No
      authentication bypass precondition — the password-reset endpoint is directly reachable over HTTP.
      MITRE ATT&CK ICS: T0866 (Exploitation of Remote Services), T0831 (Manipulate I/O Image — via
      device takeover post authentication reset). Detection: network monitoring for HTTP GET requests
      targeting FLEX I/O management interface from non-engineering workstation source IPs; review
      industrial network flow logs for unexpected connections to EtherNet/IP adapter web ports (TCP/80,
      TCP/443). Hardening: upgrade firmware to 2.013; if upgrade cannot be applied immediately, restrict
      network access to FLEX I/O web interface to engineering workstations only via OT network segmentation;
      disable the web interface if not required for operations (if firmware supports this option).
    ch_eu_nexus: "direct — Rockwell Automation FLEX I/O widely deployed in CH/EU industrial environments; NCSC-CH published specific advisory"
    public_sector_nexus: "indirect — public utilities, water/energy infrastructure using Rockwell ICS"
