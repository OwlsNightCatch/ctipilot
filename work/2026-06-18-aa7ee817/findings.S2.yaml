        role: "corroborating"
    discovery_trace: |
      first seen at: bsi-rss bridge subcommand → WID-SEC-2026-1981 (Zammad), published 2026-06-17 →
      primary: BSI CERT-Bund advisory, URL https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-1981 →
      bsi-csaf WID-SEC-2026-1981 → references: 13 GitHub GHSAs (all 2026-06-16) + Zammad release notes URL →
      corroborating: Zammad product release page https://zammad.com/en/product/releases/zammad-7-1
    summary: |
      Zammad, a widely-deployed open-source helpdesk and ticketing system particularly prevalent in German and Austrian
      public-sector IT service desks, released version 7.1 on 16 June 2026 addressing 13 security vulnerabilities
      tracked under GitHub Security Advisories (GHSA-374g-4f73-g7m7, GHSA-45cx-9mrq-mmcj, GHSA-4m54-p3mr-22g2,
      GHSA-56jc-34c8-2xq4, GHSA-6rmm-28j9-q99q, GHSA-7fwx-3xr4-qm6w, GHSA-96hh-fmj3-h4hp, GHSA-jvcg-5539-vvc3,
      GHSA-p3mg-2jxr-hww2, GHSA-p9xp-gx8r-4397, GHSA-pf47-8964-pp23, GHSA-pv3q-74g5-w7fv, GHSA-q3cr-3wq3-29hx).
      BSI advisory WID-SEC-2026-1981 (published 2026-06-17) classifies aggregate severity as "hoch" (high) and
      summarises that an attacker can exploit multiple vulnerabilities to gain administrator privileges, bypass security
      measures, manipulate data, disclose confidential information, or cause denial-of-service. The prior April 2026
      security release (Zammad 7.0.1) addressed server-side template injection to RCE via AI Agent and missing
      authorization on the POST /api/v1/ai_assistance/text_tools/:id endpoint (CVE-2026-34782); the 7.1 release
      moves all future advisories to GitHub exclusively. Specific CVE identifiers for the June 2026 GHSA set are not
      yet individually enumerated in public CSAF/NVD records; the GHSA pages on GitHub are authentication-gated.
      Affected versions: Zammad 7.x prior to 7.1. Patched version: 7.1. Organizations running Zammad 7.0.x or earlier
      should upgrade to 7.1 immediately. Zammad is deployed by EU public administrations, municipalities, and
      government IT service desks as a ticketing/helpdesk solution for internal and citizen-facing services — any
      admin privilege escalation path in this system represents a direct risk to internal IT operations data, ticket
      contents (potentially sensitive), and staff account credentials. Zammad instances exposed to the internet via
      reverse proxy are at highest risk for unauthenticated attack paths in the bundle.
    ch_eu_nexus: "Direct — BSI CERT-Bund issued WID-SEC-2026-1981 on 2026-06-17; Zammad is widely deployed across German, Austrian, and Swiss public-sector IT service desks"
    public_sector_nexus: "direct"
    sector: "public-sector, government, IT services"
