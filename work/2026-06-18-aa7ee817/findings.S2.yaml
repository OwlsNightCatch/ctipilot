    evidence:
      - quote: "An improper authentication security issue exists within the 1794-AENTR adapter's embedded web server. The vulnerability allows an unauthenticated attacker to change the device's web interface password by sending a crafted HTTP GET request to a specific endpoint, without any prior authentication being required."
        attribution: "CISA ICS-CERT (ICSA-26-167-05)"
        source_url: "https://www.cisa.gov/news-events/ics-advisories/icsa-26-167-05"
      - quote: "A denial of service security issue exists in the affected product. The security issue stems from a fault occurring when a crafted CIP message is sent. Devices with less memory are more likely to be affected. This can result in a major nonrecoverable fault (MNRF). A program download is required to recover."
        attribution: "CISA ICS-CERT (ICSA-26-167-03)"
        source_url: "https://www.cisa.gov/news-events/ics-advisories/icsa-26-167-03"
      - quote: "Depending on the product, successful exploitation allows unauthenticated network-based attackers to execute administrative operations, bypass login mechanisms, or crash industrial controllers."
        attribution: "NCSC-CH Security Hub post 12639"
        source_url: "https://security-hub.ncsc.admin.ch/#/posts/12639"
    extended_notes: |
      ICS-specific detection: OT network monitoring for unsolicited HTTP GET requests to the FLEX I/O web server
      endpoint (port 80/443 on 1794-AENTR/AENTRXT adapters) — particularly password-change requests that don't
      originate from the expected engineering workstation IP. CIP DoS detection: industrial protocol monitors
      (e.g. Claroty, Nozomi) alerting on malformed CIP messages or unexpected MNR fault events on Logix controllers.
      Rockwell SD1772 covers Logix DoS fix; SD1775 covers FLEX I/O adapter fixes; SD1776 covers CompactLogix 5370
      CIP Connection ID exposure. Firmware update scheduling should target air-gapped ICS maintenance windows.
      FactoryTalk Historian SE authentication bypass (CVE-2025-13036, SD1773) is an additional high-risk finding
      for OT data historians exposed to OT/IT boundary networks.

  - title: "Zammad 7.1 patches 13 security vulnerabilities across helpdesk platform — admin privilege escalation, SSRF, DoS (BSI WID-SEC-2026-1981)"
    sources:
      - url: "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-1981"
        publisher: "BSI CERT-Bund"
        date: "2026-06-17"
        role: "primary"
