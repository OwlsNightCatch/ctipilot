items:
  - title: "Oracle June 2026 CSPU: 245 patches including CVSS 10.0 WebLogic Proxy Plugin (CVE-2026-21962)"
    sources:
      - url: "https://www.oracle.com/security-alerts/cspujun2026.html"
        publisher: "Oracle PSIRT"
        date: "2026-06-17"
        role: "primary"
      - url: "https://www.securityweek.com/oracles-second-monthly-security-updates-deliver-245-patches/"
        publisher: "SecurityWeek"
        date: "2026-06-17"
        role: "corroborating"
      - url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0201"
        publisher: "NCSC-NL"
        date: "2026-06-17"
        role: "corroborating"
    discovery_trace: |
      first seen at: ncsc-nl recent bridge subcommand → NCSC-2026-0201 through NCSC-2026-0207 (Oracle CSPU cluster, all published 2026-06-17) →
      primary: Oracle PSIRT, URL https://www.oracle.com/security-alerts/cspujun2026.html →
      corroborating: SecurityWeek article, URL https://www.securityweek.com/oracles-second-monthly-security-updates-deliver-245-patches/ →
      CVE-2026-21962 detail: NetSPI blog https://www.netspi.com/blog/executive-blog/critical-vulnerability/oracle-weblogic-server-proxy-plugin-cve-2026-21962-overview-takeaways/
    summary: |
      Oracle released its June 2026 Critical Security Patch Update (CSPU) on 17 June 2026, delivering 245 security patches
      across Communications, E-Business Suite, Enterprise Manager, Fusion Middleware, JD Edwards, MySQL, PeopleSoft, Siebel CRM,
      Supply Chain, Systems, and Virtualization product families. The highest-severity vulnerability is CVE-2026-21962
      (CVSS 3.1 10.0 Critical) in the Oracle HTTP Server and WebLogic Server Proxy Plugin, affecting Oracle HTTP Server /
      Proxy Plugin for Apache HTTP Server and Microsoft IIS at versions 12.2.1.4.0, 14.1.1.0.0, and 14.1.2.0.0. The flaw
      permits unauthenticated remote attackers to bypass security controls via crafted HTTP requests to the proxy plugin
      endpoint, with no authentication required (network-adjacent or internet-exposed HTTP port). Successful exploitation
      grants read/write access to all data accessible by the Oracle HTTP Server proxy and enables lateral movement into
      backend WebLogic clusters (T1190). More than 100 of the 245 patches address Oracle Fusion Middleware, with the majority
      rated critical or high. Oracle E-Business Suite patched products explicitly covering public-sector use cases include
      Public Sector Financials (International), Financials for EMEA, and Public Sector Payroll (NCSC-2026-0201 advisory).
      CVSS scores across the CSPU cluster range from 7.1 to 9.9 on E-Business Suite modules; MySQL Router versions 8.4.0
      through 8.4.9 and 9.0.0 through 9.7.0 are included. No active exploitation of CSPU June 2026 vulnerabilities was
      confirmed at time of publication; Oracle CVE-2024-21182 (WebLogic T3/IIOP) was added to CISA KEV earlier in June but
      is distinct from CVE-2026-21962. Defenders should prioritise patching internet-facing Oracle HTTP Server proxy plugin
      deployments and WebLogic clusters before internal JD Edwards / EBS instances.
    ch_eu_nexus: "Direct — NCSC-NL issued seven advisories (NCSC-2026-0200 through 0207) on 2026-06-17; Oracle E-Business Suite modules explicitly covering EU public-sector financials and payroll"
    public_sector_nexus: "direct"
    sector: "public-sector, finance, manufacturing, telco"
    cves:
      - CVE-2026-21962
      - CVE-2026-35273
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Oracle released 245 patches in its second monthly Critical Security Patch Update. Approximately 120 vulnerabilities received 'critical' severity ratings based on CVSS scores, with 100 flaws exploitable remotely without authentication."
        attribution: "SecurityWeek"
        source_url: "https://www.securityweek.com/oracles-second-monthly-security-updates-deliver-245-patches/"
      - quote: "CVE-2026-21962 is a critical flaw in Oracle WebLogic Server Proxy Plugin request handling with a CVSS 3.1 Base Score of 10.0 (Critical). The vulnerability allows unauthenticated remote attackers to bypass security controls and potentially gain unauthorized access to backend WebLogic systems."
        attribution: "NetSPI"
        source_url: "https://www.netspi.com/blog/executive-blog/critical-vulnerability/oracle-weblogic-server-proxy-plugin-cve-2026-21962-overview-takeaways/"
      - quote: "kwetsbaarheden stellen een aanvaller met netwerktoegang in staat om ongeautoriseerde acties uit te voeren, waaronder het verkrijgen van volledige controle over het systeem… De CVSS 3.1 basis scores variëren van 7.1 tot 9.9"
        attribution: "NCSC-NL"
        source_url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0201"
    extended_notes: |
      Detection focus: Web server access logs for unusual HTTP request patterns to Oracle HTTP Server OHS proxy
      endpoints. CVE-2026-21962 exploits the proxy plugin's request-forwarding logic — look for unexpected
      HTTP methods or oversized headers forwarded to WebLogic backend listeners on T3/IIOP ports (7001/7002).
      Oracle Fusion Middleware patch bundle is the immediate hardening path; interim mitigation: restrict
      network access to Oracle HTTP Server proxy ports from untrusted segments. VirtualBox NCSC-2026-0203
      (max CVSS 7.5, June 17) is also part of this CSPU release but requires local access and is lower priority.

  - title: "Rockwell Automation ICS cluster: unauthenticated web-server password reset on FLEX I/O adapters and CIP DoS on Logix controllers (CISA ICSA-26-167-03/04/05)"
    sources:
      - url: "https://www.cisa.gov/news-events/ics-advisories/icsa-26-167-05"
        publisher: "CISA ICS-CERT"
        date: "2026-06-16"
        role: "primary"
      - url: "https://www.cisa.gov/news-events/ics-advisories/icsa-26-167-03"
        publisher: "CISA ICS-CERT"
        date: "2026-06-16"
        role: "primary"
      - url: "https://www.cisa.gov/news-events/ics-advisories/icsa-26-167-04"
        publisher: "CISA ICS-CERT"
        date: "2026-06-16"
        role: "primary"
      - url: "https://security-hub.ncsc.admin.ch/#/posts/12639"
        publisher: "NCSC-CH Security Hub"
        date: "2026-06-17"
        role: "corroborating"
    discovery_trace: |
      first seen at: ncsc-csh recent bridge subcommand → post 12639, published 2026-06-17T14:20:35Z →
      primary: CISA ICS-CERT ICSA-26-167-05 (FLEX I/O) https://www.cisa.gov/news-events/ics-advisories/icsa-26-167-05 →
      CISA ICS-CERT ICSA-26-167-03 (Logix DoS) https://www.cisa.gov/news-events/ics-advisories/icsa-26-167-03 →
      CISA ICS-CERT ICSA-26-167-04 (CompactLogix CIP info-disclosure) https://www.cisa.gov/news-events/ics-advisories/icsa-26-167-04
    summary: |
      Rockwell Automation disclosed five CVEs across ICS product lines on 16 June 2026, consolidated by NCSC-CH on
      17 June 2026. The highest-severity finding is CVE-2026-0647 (CVSS 3.1 9.4 Critical) in the 1794-AENTR and
      1794-AENTRXT FLEX I/O Dual-Port EtherNet/IP Adapters version V2.012: the adapter's embedded web server allows an
      unauthenticated attacker to change the web interface password by sending a crafted HTTP GET request to a specific
      endpoint with no prior authentication required (T1190, improper authentication CWE). If exploited, the attacker
      can fully take over the adapter's web interface, disconnect the adapter from its associated I/O modules, and
      disrupt the industrial process. A companion vulnerability CVE-2026-0646 (CVSS 7.5) on the same 1794-AENTR adapter
      enables a separate denial-of-service through improper memory handling of CIP protocol requests, requiring a manual
      reset to recover. Both are patched in firmware version 2.013 (Rockwell SD1775).
      CVE-2026-11317 (CVSS 7.5) affects CompactLogix 5370 (<=34.016), Compact GuardLogix 5370 (<=35.015),
      ControlLogix 5570 (<=35.015), and GuardLogix 5570 (36.012): a crafted CIP message causes a major nonrecoverable
      fault (MNRF) on the PLC, requiring a full program download to recover — a high-impact denial-of-service against
      OT infrastructure (T1499.004 Endpoint DoS). Attack prerequisite is network access to the CIP port; devices with
      less memory are more likely to be affected. Fixed in CompactLogix 5370 firmware 34.016+, ControlLogix 5570 36.012+
      (Rockwell SD1772). CVE-2025-11694 (CVSS 7.5) and CVE-2026-9307 (CVSS N/A, CIP Connection ID information disclosure
      enabling DoS construction) affect CompactLogix 5370 L1/L2/L3 < V38.011 (Rockwell SD1776). CVE-2025-13036 (CVSS 7.7)
      is an authentication bypass in FactoryTalk Historian Site Edition. Exploitation status: UNKNOWN for all CVEs.
      Defender action: firmware updates from Rockwell vendor advisories; network segmentation to restrict CIP and HTTP/HTTPS
      access to ICS devices from untrusted zones (follow ICS-CERT defense-in-depth guidance on OT network isolation).
    ch_eu_nexus: "Direct — NCSC-CH issued advisory 12639 on 2026-06-17; Rockwell Automation ICS widely deployed in EU industrial/energy/manufacturing environments"
    public_sector_nexus: "indirect"
    sector: "energy, manufacturing, ot-ics, critical-infrastructure"
    cves:
