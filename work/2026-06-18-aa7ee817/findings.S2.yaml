        attribution: "BSI CERT-Bund WID-SEC-2026-1981"
        source_url: "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-1981"
      - quote: "This is the last security advisory published on the Zammad website. Going forward, all advisories will be available on GitHub."
        attribution: "Zammad GmbH (ZAA-2026-07, April 2026)"
        source_url: "https://zammad.com/en/advisories"
      - quote: "Zammad 7.1 is live! Turn incoming requests into structured, actionable ticket data with new AI Agents."
        attribution: "Zammad GmbH product release page (2026-06-16)"
        source_url: "https://zammad.com/en/product/releases/zammad-7-1"
    extended_notes: |
      Detection for Zammad admin privilege escalation: review Zammad audit logs for unexpected role changes
      (admin rights granted to non-admin users) and API calls to admin endpoints (/api/v1/roles, /api/v1/users)
      from unprivileged sessions. SSRF-class findings (GHSA-45cx-9mrq-mmcj, webhook SSRF per CVE-2026-34719)
      can be hunted via outbound HTTP requests from the Zammad application server to internal RFC-1918 or
      cloud metadata endpoints. Hardening: upgrade to Zammad 7.1 immediately; for internet-exposed instances,
      consider requiring VPN/mTLS before exposing the Zammad HTTPS port. The move to GitHub-only advisories
      means defenders should subscribe to https://github.com/zammad/zammad/security/advisories for future
      release notification, as the zammad.com/en/advisories RSS feed will no longer carry new entries.

