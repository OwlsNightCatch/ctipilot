        attribution: "Zimperium zLabs"
        source_url: "https://zimperium.com/blog/goldpickaxe-returns-when-your-biometric-information-is-as-important-as-your-money"
    extended_notes: |
      Single-source (Zimperium); no independent corroboration found in-window. Detection concept:
      mobile EDR/MTD telemetry on PackageInstaller/SessionInstaller session-commit events originating
      from non-Play-Store install sources; Accessibility-Service enablement immediately following a
      sideloaded install; apps simultaneously requesting Camera + SMS + Accessibility + Overlay
      permissions. Hardening: MDM/UEM policy blocking unknown-source installs and SessionInstaller-API
      use outside the managed app-distribution channel; Play Protect; permission-combination alerting
      in EMM.
    borderline: true
    borderline_reason: "Primary targeting is Southeast Asia with no confirmed European/Swiss victim; included for transferable technique value (installer-API sideload evasion, encrypted dynamic DEX loading) to mobile-banking-app defenders in the finance sector."

  - title: "RedWing: a Russia-focused Android spyware-as-a-service that defeats voice-based 2FA via SIM call-forwarding codes (Zimperium zLabs)"
    sources:
      - { url: "https://zimperium.com/blog/redwing-a-mobile-malware-as-a-service-operation", publisher: "Zimperium zLabs", date: "2026-07-07", role: "primary" }
    discovery_trace: "first seen at: zimperium-zlabs, URL https://zimperium.com/blog/rss.xml → primary: Zimperium zLabs, URL https://zimperium.com/blog/redwing-a-mobile-malware-as-a-service-operation (no pivot needed)"
    summary: |
      Zimperium zLabs documented RedWing, a commercial-grade Android spyware Malware-as-a-Service
      operation sold via a Telegram bot with tiered subscription pricing and a server-side dropper
      constructor panel that mimics legitimate app-store listings (Google Play, Galaxy Store,
      AppGallery, RuStore) to make phishing-distributed droppers look genuine. RedWing's operators
      overlap with the previously documented "Oblivion" Android RAT (dropper-stage and overlay
      similarities). Once installed, RedWing deploys fraudulent banking overlays and uses regex-based
      extraction (OTP: ^\d{4,8}$, card number: ^\d{13,19}$, CVV: ^\d{3,4}$) to automatically harvest
      credentials as victims type them. Its most notable capability is abusing USSD call-forwarding
      codes (*21*) to silently redirect the victim's voice calls at the SIM/carrier level — defeating
      banks' voice-callback OTP fallback, which many institutions still treat as a stronger
      authentication factor than SMS. A unified C2 panel drives phishing campaigns and overlay
      injection across a target list of 82 Russian financial institutions without requiring new APK
      releases per campaign. Zimperium frames the operation's low barrier to entry (documentation,
      demo videos, referral incentives) as what makes it dangerous beyond its immediate Russian
      target set.
    region_nexus: "Russia-focused (82 named Russian financial institutions); the MaaS commoditization model and the SIM call-forwarding 2FA-bypass technique are directly transferable to any region using voice-callback OTP as a banking authentication fallback, including Swiss/EU institutions."
