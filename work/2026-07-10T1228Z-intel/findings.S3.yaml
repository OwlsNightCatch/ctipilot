items:
  - title: "GoldFactory's GoldPickaxe mobile banking trojan returns, abusing Android's SessionInstaller API and AES-encrypted dynamic DEX loading (Zimperium zLabs)"
    sources:
      - { url: "https://zimperium.com/blog/goldpickaxe-returns-when-your-biometric-information-is-as-important-as-your-money", publisher: "Zimperium zLabs", date: "2026-07-09", role: "primary" }
    discovery_trace: "first seen at: zimperium-zlabs, URL https://zimperium.com/blog/rss.xml → primary: Zimperium zLabs, URL https://zimperium.com/blog/goldpickaxe-returns-when-your-biometric-information-is-as-important-as-your-money (no pivot needed)"
    summary: |
      Zimperium zLabs documented a new GoldPickaxe variant (GoldFactory lineage, first profiled by
      Group-IB in 2024) distributed via phishing sites spoofing the Chinese video platform KuaiBo.
      The dropper abuses the legitimate Android SessionInstaller API — normally used for split-APK
      and self-update installs — to silently install the payload package without triggering the
      conspicuous "install unknown apps" system prompt a manual sideload would show. Once installed,
      the payload decrypts an AES-encrypted DEX blob (payload_dex.bin) and dynamically loads it at
      runtime, so static/signature scanners see only an encrypted blob rather than executable code;
      a companion native library encrypts C2 traffic. The malware abuses Accessibility Services and
      the Media Projection API for screen scraping/recording, layers a fake lock-screen over the
      real one to harvest PIN/pattern/password unlock credentials, and uses the device camera to
      capture biometric/ID-document imagery — on top of routine SMS, contact and call-log theft.
      Zimperium found 19 samples across five countries, with a hardcoded target list of 118
      distinct Indonesian banking/e-wallet/financial apps; Indonesia is the primary target, with
      secondary samples touching Malaysia, Singapore, Saudi Arabia and the US. No European or Swiss
      targeting is reported, but the technique class — legitimate installer-API abuse to dodge the
      sideload warning, encrypted dynamic code loading to dodge static AV, and fake-lock-screen
      credential capture — is directly transferable to any mobile-banking threat model.
    region_nexus: "Southeast Asia primary (Indonesia; also Malaysia, Singapore, Saudi Arabia, US samples) — no confirmed European/Swiss targeting; technique class (SessionInstaller-API sideload evasion, encrypted dynamic DEX loading, fake lock-screen credential capture) is directly transferable to any mobile-banking deployment, including Swiss/EU institutions."
