      - { key: "tool:goldpickaxe", type: tool, name: "GoldPickaxe", aliases: [],
          summary: "Android banking trojan (GoldFactory family) that harvests biometric/ID imagery, SMS, credentials via a fake lock-screen, and banking-app data; 2026 variant abuses the SessionInstaller API for silent install and AES-encrypted dynamic DEX loading for static-detection evasion (Zimperium zLabs, 2026-07-09)." }
    verification: SINGLE-SOURCE-OTHER
