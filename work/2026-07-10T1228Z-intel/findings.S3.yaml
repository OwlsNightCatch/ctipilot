        attribution: "Zimperium zLabs"
        source_url: "https://zimperium.com/blog/redwing-a-mobile-malware-as-a-service-operation"
    extended_notes: |
      Single-source (Zimperium); published 2026-07-07, ~60h before this run (within the 72h
      developing window, outside the strict 24h window — included as still-fresh, no prior
      coverage found). Detection concept: carrier/telecom-side monitoring of USSD call-forwarding
      code (*21*) invocation immediately following a sideloaded-app install event; mobile EDR
      alerting on apps that both request SMS-read permission and programmatically dial USSD
      sequences. Hardening: bank-side move away from voice-callback OTP as a standalone fallback
      factor toward app-based/hardware-token MFA that does not depend on carrier call routing.
    borderline: true
    borderline_reason: "Primary targeting is Russian financial institutions with no confirmed European/Swiss victim; included for the transferable MaaS-commoditization and SIM call-forwarding 2FA-bypass technique, relevant to finance-sector defenders relying on voice-OTP fallback."

  - title: "npm supply-chain compromise of @injectivelabs/sdk-ts hides a wallet-key stealer inside fake 'telemetry', evading install-time scanners via runtime-triggered credential-API hooking (Aikido Security)"
    sources:
      - { url: "https://www.aikido.dev/blog/compromised-injectivelabs-exfiltrates-keys", publisher: "Aikido Security", date: "2026-07-09", role: "primary" }
    discovery_trace: "first seen at: aikido-security, URL https://www.aikido.dev/blog/rss.xml → primary: Aikido Security, URL https://www.aikido.dev/blog/compromised-injectivelabs-exfiltrates-keys (no pivot needed)"
    summary: |
      Aikido Security published a technical breakdown (2026-07-09) of a compromise of
      @injectivelabs/sdk-ts (an npm package with ~50,000 weekly downloads, part of the Injective
      blockchain SDK ecosystem). The underlying compromise event occurred on 2026-06-08 via
      what Aikido assesses as a GitHub account takeover (commits came from an account with an
      established contribution history); the malicious 1.20.21 release was live for under an hour
      before the maintainer reverted it, but in that window the attacker also republished the same
      1.20.21 version number, pinned to the poisoned SDK, across 17 other packages in the
      @injectivelabs scope — so any project depending on any of the 17 (not just sdk-ts directly)
      resolved the stealer transitively. The payload itself is notable for what it does NOT do:
      it carries no install-time (postinstall) hook at all, so scanners and sandboxes that only
      watch lifecycle scripts saw a clean package. Instead, two one-line hooks were inserted into
      the SDK's own key-derivation entry points, PrivateKey.fromMnemonic and PrivateKey.fromHex —
      the exact functions an application calls to turn a seed phrase or raw hex string into a
      usable wallet — so the secret is captured on every legitimate derivation call at runtime.
      The hook function is documented in its own doc-comment as "anonymized usage metrics for SDK
      optimization"; the exfiltration destination is stored as a character-code array and rebuilt
      only at runtime, defeating plaintext string search of the bundle, and decodes to
      testnet.archival.chain.grpc-web.injective[.]network — a subdomain crafted to look like
      Injective's own gRPC-web infrastructure. Captured mnemonics/keys are base64-batched and sent
      via the X-Request-Id HTTP header (not the request body) with a application/grpc-web+proto
      content-type, so the exfil traffic is indistinguishable on the wire from a normal Injective
      SDK network call; every failure path uses a silent empty catch so a blocked send never
      surfaces an error. npm's own download counter shows only 310 downloads of the malicious
      version before removal (against ~87 dependent packages), and Aikido notes containment was
      incomplete at time of writing — the malicious version remained deprecated-but-downloadable
      on npm and the release artifacts were still present on GitHub.
    region_nexus: "global — npm/Node.js ecosystem; no specific European or Swiss victim named, but the technique class (runtime-triggered, lifecycle-hook-free credential hooking; protocol-mimicking exfil channel) applies to any organisation, including Swiss/EU public-sector software suppliers, consuming npm dependencies."
    primary_sector_nexus: "indirect"
    sector: "public-sector, finance"
    cves: []
    techniques: [T1195.002, T1056.004, T1132, T1071.001]
    affected_products: ["npm package @injectivelabs/sdk-ts (and 17 dependent @injectivelabs scope packages, all version 1.20.21)"]
    entity_keys: []
    new_entities:
      - { key: "incident:injectivelabs-npm-sdk-ts-supply-chain-2026", type: incident, name: "@injectivelabs/sdk-ts npm supply-chain compromise (2026)", aliases: [],
          summary: "GitHub-account-takeover-driven npm supply-chain compromise (2026-06-08) of @injectivelabs/sdk-ts and 17 dependent packages, injecting a runtime-triggered (no install-hook) wallet-key stealer disguised as telemetry that hooks PrivateKey.fromMnemonic/fromHex and exfiltrates via a gRPC-web-mimicking channel; disclosed by Aikido Security 2026-07-09." }
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "The malicious `1.20.21`was published at 22:59 GMT+2 on June 8, 2026, the maintainer reverted the change at 23:18, and a clean version was published at 23:48."
        attribution: "Aikido Security"
        source_url: "https://www.aikido.dev/blog/compromised-injectivelabs-exfiltrates-keys"
      - quote: "Each hook fires before the real derivation runs, so the secret is captured on every legitimate call"
        attribution: "Aikido Security"
        source_url: "https://www.aikido.dev/blog/compromised-injectivelabs-exfiltrates-keys"
      - quote: "Because the trigger is key derivation at runtime and not a lifecycle script, install-time scanners and sandboxes that only watch postinstall see a clean package."
        attribution: "Aikido Security"
        source_url: "https://www.aikido.dev/blog/compromised-injectivelabs-exfiltrates-keys"
    extended_notes: |
      Underlying compromise event is from 2026-06-08 (contained same day); this Aikido write-up
      is the first public technical disclosure and is fresh (published/last-updated 2026-07-09),
      hence treated as new in-window signal per the "freshest describing source" recency rule, not
      as an update-of any prior entry (no prior coverage found for this event). Detection concept:
      SCA/SBOM diffing of shipped npm package artifacts against their declared source (byte-diff
      dist/ build output vs. repository source, since the injected code lived only in the compiled
      artifact); runtime egress monitoring for wallet/crypto-SDK processes making outbound HTTPS
      calls to domains not matching the SDK's documented API endpoints, particularly ones carrying
      unusual data in custom request headers. Hardening: pin exact dependency versions and verify
      via provenance/build attestation (npm provenance, Sigstore) rather than trusting the registry
      alone; audit transitive dependencies, not just direct ones, since 17 of 18 compromised
      packages carried no malicious code of their own.

  - title: "SANS ISC: \"comment stuffing\" pads an HTML phishing attachment to 2.5 MB to dilute or exhaust AI/NLP-based email-security scanners"
    sources:
      - { url: "https://isc.sans.edu/diary/33144", publisher: "SANS Internet Storm Center", date: "2026-07-10", role: "primary" }
    discovery_trace: "first seen at: sans-isc, URL https://isc.sans.edu/rssfeed_full.xml → primary: SANS Internet Storm Center, URL https://isc.sans.edu/diary/33144 (no pivot needed)"
    summary: |
      A SANS Internet Storm Center diary (2026-07-10, Jan Kopriva) analyzes a phishing email
      carrying an oversized (.xls.html-styled) HTML attachment of roughly 2.5 MB. Decompressed,
      the file is ~431 KB, of which the actual functional phishing payload — the credential-
      harvesting HTML/JS logic — accounts for only about 11 KB; the remainder is a single HTML
      comment containing roughly 430,000 repeated "X" characters placed after the functional
      payload. The author's working hypothesis is that this padding is deliberately engineered to
      defeat AI/NLP-based email-security classifiers in one of two ways: by diluting the malicious
      content's statistical weight within a large low-entropy block until a probability-based
      classifier's confidence drops below its flagging threshold, or by inflating the sheer token
      count an LLM-based scanner must process until it exceeds a processing time/token budget and
      the scan degrades or times out before reaching the actual payload. The diary notes the
      padding does not help the file blend in with statistically normal benign content either,
      since 430,000 repetitions of a single character is itself an anomalous, low-entropy pattern
      that a well-tuned classifier could flag on its own. Other anomalies in the message (headers
      suggesting a homemade sending script rather than standard mail infrastructure) support the
      assessment that this was a deliberately engineered evasion attempt rather than an accidental
      artifact.
    region_nexus: "global — technique is agnostic to region or sector; directly relevant to any organisation deploying AI/NLP-based email security, an increasingly common control across Swiss/EU public-sector and enterprise mail gateways."
    primary_sector_nexus: "direct"
    sector: "public-sector, finance, healthcare, energy, telco"
    cves: []
    techniques: [T1566.001, T1027.001]
    affected_products: []
    entity_keys: []
    new_entities: []
    verification: SINGLE-SOURCE-NATIONAL-CERT
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "The padding is also about as low-entropy as any data can get, which means it wouldn't help the file blend in with benign content on a statistical level either."
        attribution: "SANS Internet Storm Center (Jan Kopriva)"
        source_url: "https://isc.sans.edu/diary/33144"
      - quote: "If a message contains enough innocuous material, the weight of the malicious portion can be diluted to the point where the model no longer flags it with sufficient confidence."
        attribution: "SANS Internet Storm Center (Jan Kopriva)"
        source_url: "https://isc.sans.edu/diary/33144"
      - quote: "The padding may serve a second, cruder purpose – inflating the sheer volume of data (and, for an LLM, the number of tokens) that has to be processed."
        attribution: "SANS Internet Storm Center (Jan Kopriva)"
        source_url: "https://isc.sans.edu/diary/33144"
    extended_notes: |
      Single sample, author's own hypothesis (clearly hedged, not a confirmed campaign) — treat the
      "designed to evade AI scanners" framing as an assessment, not a confirmed fact. Detection
      concept: mail-gateway telemetry class — flag HTML/XLS-disguised attachments where a single
      repeated-character run or a single HTML comment exceeds a size threshold (e.g. >50 KB of a
      single repeated byte/character), a discriminator independent of whatever AI/NLP scoring the
      gateway also runs; decompressed-vs-declared-size ratio outliers. Hardening: attachment
      pre-processing that strips or truncates oversized comments/padding before AI-based scoring,
      and a non-AI fallback rule keyed on the anomalous size/entropy signature described above so
      the control does not rely solely on the classifier being defeated.

