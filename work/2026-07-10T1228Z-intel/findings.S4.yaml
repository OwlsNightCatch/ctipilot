          summary: "Ransomware-as-a-service brand active through at least 2023-2025; the DOJ's Martino case documents affiliate collusion with a victim-side ransomware negotiator to inflate extortion payments (DOJ, 2026-07-09)." }
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Angelo Martino sold out the very victims he was hired to represent, handing their confidential negotiating positions to BlackCat actors to drive up ransoms and enrich himself"
        attribution: "Brett Leatherman, FBI (via CyberScoop)"
        source_url: "https://cyberscoop.com/digitalmint-ransomware-negotiator-angelo-martino-sentenced/"
      - quote: "Martino had also shared confidential information about victims' insurance policy limits and negotiation positions with operators."
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/us-ransomware-negotiator-gets-4-years-in-prison-for-blackcat-attacks/"
      - quote: "This was not a crime of opportunity or momentary weakness; it was a sustained abuse of a fiduciary-like relationship driven by a single purpose: greed"
        attribution: "US prosecutors (via CyberScoop)"
        source_url: "https://cyberscoop.com/digitalmint-ransomware-negotiator-angelo-martino-sentenced/"
    extended_notes: |
      Operational takeaway for SOC/IR management, not a hunt signal: when engaging a ransomware-negotiation or IR retainer, segregate negotiator-to-attacker and negotiator-to-client communication channels with independent audit logging, avoid letting a single individual control both sides of a negotiation without oversight, and treat the sharing of insurance-limit figures with any external party as a need-to-know-controlled disclosure. This is a governance/vendor-risk lesson, not a technical detection concept — flagging as borderline for the main agent given the US-only venue.
    borderline: true
    borderline_reason: "US DOJ case with no Swiss/EU victim named; included for the transferable vendor-trust/insider-risk lesson to any organisation that retains a ransomware negotiation or IR firm during an extortion event — main agent to weigh fit against daily-vs-weekly placement."

  - title: "Signal username deactivation/reuse let an impersonator run The Intercept's tip line for four months, illustrating a persona-hijack risk for any org's secure-tipline account"
    sources:
      - { url: "https://freedom.press/digisec/blog/lessons-from-the-intercepts-signal-tipline-username-breach/", publisher: "Freedom of the Press Foundation", date: "2026-07-08", role: "primary" }
      - { url: "https://www.dropsitenews.com/p/intercept-signal-tip-line-breach-hack", publisher: "Drop Site News", date: "2026-07-08", role: "primary (original break)" }
      - { url: "https://cyberinsider.com/the-intercepts-signal-tipline-username-was-hijacked-for-months/", publisher: "CyberInsider", date: "2026-07-09", role: "corroborating" }
    discovery_trace: "first seen at: cyberinsider, URL https://cyberinsider.com -> pivot: cyberinsider article, URL https://cyberinsider.com/the-intercepts-signal-tipline-username-was-hijacked-for-months/ -> primary: Freedom of the Press Foundation, URL https://freedom.press/digisec/blog/lessons-from-the-intercepts-signal-tipline-username-breach/"
    summary: |
      Drop Site News and Freedom of the Press Foundation (FPF) document that the Signal username The Intercept publicly advertised for its confidential tip line (TheIntercept.01) was taken over by an impersonator from at least February through June 2026, who actively solicited sources roughly 100 times between April and May while the fraudulent account remained listed on The Intercept's official tip page. FPF's analysis, citing Signal-Server source (`RemoveExpiredAccountsCommand.java`), identifies the takeover mechanism as a platform design property rather than a vulnerability: Signal usernames become claimable again after (1) roughly 120 days of account inactivity triggering automatic deactivation, (2) a ~one-week grace window after a voluntary username change during which the old username is released, or (3) a SIM-swap against the phone number tied to the account. This is a persona/impersonation technique class (T1684.001), not an intrusion of Signal itself or of The Intercept's systems — no Signal security flaw was exploited — but it directly threatens confidentiality and safety for whistleblowers/confidential sources who believed they were contacting the legitimate outlet. FPF's hardening guidance: keep tipline accounts continuously active, avoid changing a publicly advertised username, secure the underlying phone number with a carrier PIN against SIM-swapping, and enable Signal's Registration Lock PIN.
    region_nexus: "global platform-design issue; directly applicable to any Swiss/EU public-sector, ombudsman, or journalism-adjacent whistleblower/tipline channel run over Signal (a messaging platform increasingly recommended for government and investigative secure-communications use)"
    primary_sector_nexus: "indirect"
    sector: "public-sector, cross-sector"
    cves: []
    techniques: [T1684.001, T1586]
    affected_products: ["Signal"]
    entity_keys: []
    new_entities: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "Signal's code suggests that accounts are automatically deactivated after 120 days, at which point you will also lose access to your username."
        attribution: "Freedom of the Press Foundation"
        source_url: "https://freedom.press/digisec/blog/lessons-from-the-intercepts-signal-tipline-username-breach/"
      - quote: "If you change your username, after about a week, someone else can snag it."
        attribution: "Freedom of the Press Foundation"
        source_url: "https://freedom.press/digisec/blog/lessons-from-the-intercepts-signal-tipline-username-breach/"
      - quote: "The fraudulent account reportedly began soliciting tips from potential sources as early as February 2026 and actively promoted the compromised username across social media."
        attribution: "CyberInsider"
        source_url: "https://cyberinsider.com/the-intercepts-signal-tipline-username-was-hijacked-for-months/"
    extended_notes: |
      Confidence set to MEDIUM because FPF itself presents three "plausible" root-cause mechanisms without confirming which one actually occurred in this case (inactivity deactivation vs. username-change window vs. SIM-swap) — the lesson (keep tipline accounts active, lock registration, don't rotate the public username) holds regardless of which mechanism fired. No technical detection telemetry applies here (this is a platform/process control, not a network-observable behavior); the hardening lever is the actionable takeaway.
    borderline: true
    borderline_reason: "US newsroom (The Intercept) victim, not a Swiss/EU organisation; included because the platform-design risk (Signal username reuse after inactivity/rename) is directly transferable to any Swiss/EU public-sector or investigative body operating a Signal-based secure tipline."

