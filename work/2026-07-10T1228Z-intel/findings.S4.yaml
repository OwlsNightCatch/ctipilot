items:
  - title: "\"Helix\" data-extortion group bypasses Conditional Access with device-code vishing to bulk-exfiltrate SharePoint libraries"
    sources:
      - { url: "https://reliaquest.com/blog/threat-spotlight-helix-new-name-in-data-extortion-ecosystem", publisher: "ReliaQuest", date: "2026-07-09", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/new-helix-vishing-group-emerges-in-sharepoint-data-theft-attacks/", publisher: "BleepingComputer", date: "2026-07-09", role: "corroborating" }
    discovery_trace: "first seen at: bleepingcomputer, URL https://www.bleepingcomputer.com/news/security/new-helix-vishing-group-emerges-in-sharepoint-data-theft-attacks/ -> primary: ReliaQuest, URL https://reliaquest.com/blog/threat-spotlight-helix-new-name-in-data-extortion-ecosystem"
    summary: |
      ReliaQuest documents a new data-extortion cluster it calls Helix, assessed as a likely rebrand/continuation of the BlackFile (UNC6671) and ShinyHunters (UNC6240) extortion ecosystems based on shared infrastructure and technique overlap. Initial access is voice phishing: operators impersonate a target's direct manager, spoofing the caller-ID to match, and talk the victim into completing an Entra ID device-code authentication flow in Chrome — this captures a valid session token (T1528 Steal Application Access Token) without ever touching the account password, and the device-code flow itself sidesteps Conditional Access policies that would otherwise block an unfamiliar sign-in. Within minutes of the fraudulent sign-in, the operators register a new Microsoft Authenticator app against the compromised identity from the same residential-proxy IP used for the sign-in (T1098.005 Device Registration), establishing MFA-backed persistence that looks like ordinary user behavior. Enumeration and exfiltration are then fully automated: a Python tool using a `python-requests/2.28.1` user-agent issues `contentclass:STS_Site` and wildcard SharePoint search queries to inventory every reachable site/library before bulk-downloading content (T1213.002 Data from Information Repositories: SharePoint). ReliaQuest ties Helix to BlackFile via shared hosting (an exfiltration IP four addresses away, on the same AS 51852 / Private Layer INC) and a shared domain registrar (NICENIC) previously seen in ShinyHunters/Scattered Spider infrastructure; no specific named victims are disclosed in the primary write-up. ReliaQuest states disabling device-code authentication is the single highest-impact mitigation, alongside correlating unfamiliar sign-ins with new MFA-device registrations and SharePoint bulk-download volume within short time windows.
    region_nexus: "global; SharePoint + Entra ID Conditional Access is the default identity/collaboration stack across Swiss and EU public-sector and enterprise tenants, so the bypass is directly reachable there"
    primary_sector_nexus: "indirect"
    sector: "public-sector, cross-sector"
    cves: []
    techniques: [T1566.004, T1528, T1098.005, T1213.002]
    affected_products: ["Microsoft SharePoint", "Microsoft Entra ID", "Microsoft 365"]
    entity_keys: ["actor:unc6671", "actor:shinyhunters"]
    new_entities:
      - { key: "actor:helix-extortion", type: actor, name: "Helix", aliases: [],
          summary: "Data-extortion cluster documented by ReliaQuest (2026-07-09), assessed as a likely continuation of BlackFile (UNC6671) / ShinyHunters (UNC6240) infrastructure and tradecraft; uses manager-impersonation vishing to drive Entra ID device-code phishing, bypassing Conditional Access, followed by rapid MFA-device registration and automated SharePoint enumeration/bulk exfiltration." }
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Helix likely emerged from the 'BlackFile' and 'ShinyHunters' ecosystem. Groups fragment and rebrand, but the techniques and infrastructure persist across every iteration."
        attribution: "ReliaQuest"
        source_url: "https://reliaquest.com/blog/threat-spotlight-helix-new-name-in-data-extortion-ecosystem"
      - quote: "Device code phishing then sidesteps Conditional Access policies, and automated tools enumerate and mass-download SharePoint libraries before bulk exfiltration triggers an alert."
        attribution: "ReliaQuest"
        source_url: "https://reliaquest.com/blog/threat-spotlight-helix-new-name-in-data-extortion-ecosystem"
      - quote: "Disabling device code authentication is the single highest-impact action."
        attribution: "ReliaQuest"
        source_url: "https://reliaquest.com/blog/threat-spotlight-helix-new-name-in-data-extortion-ecosystem"
    extended_notes: |
      Triage note for the composer: benign lookalike discriminator per the source — legitimate device-code use is rare in modern tenants (mostly CLI/headless auth flows); the discriminating features are (1) an unfamiliar or manager-impersonation-preceded phone call immediately before the sign-in, (2) a NEW MFA authenticator registered within minutes of a device-code sign-in from a residential-proxy IP the account has never used, (3) SharePoint search queries using `contentclass:STS_Site` / wildcard patterns at automation speed with a `python-requests` user-agent rather than a browser UA, and (4) bulk-download volume disproportionate to the user's normal SharePoint usage baseline. Any one of these alone can be benign (IT staff use device-code auth for headless scripts; users do sometimes get new phones); the co-occurrence within a short window is the signal. Detection telemetry classes: Entra ID sign-in logs (auth method = device code), MFA-registration audit events, SharePoint/Graph API access logs, and network egress logging for the automation user-agent pattern.

  - title: "DOJ: former DigitalMint ransomware negotiator secretly fed BlackCat/ALPHV victims' insurance limits and negotiating positions to the extortionists to inflate ransoms"
    sources:
      - { url: "https://www.justice.gov/opa/pr/florida-ransomware-negotiator-who-extorted-and-attacked-multiple-us-victims-sentenced-prison", publisher: "U.S. Department of Justice", date: "2026-07-09", role: "primary" }
      - { url: "https://cyberscoop.com/digitalmint-ransomware-negotiator-angelo-martino-sentenced/", publisher: "CyberScoop", date: "2026-07-09", role: "corroborating" }
      - { url: "https://www.bleepingcomputer.com/news/security/us-ransomware-negotiator-gets-4-years-in-prison-for-blackcat-attacks/", publisher: "BleepingComputer", date: "2026-07-10", role: "corroborating" }
    discovery_trace: "first seen at: bleepingcomputer, URL https://www.bleepingcomputer.com/news/security/us-ransomware-negotiator-gets-4-years-in-prison-for-blackcat-attacks/ -> pivot: cyberscoop, URL https://cyberscoop.com/digitalmint-ransomware-negotiator-angelo-martino-sentenced/ -> primary: DOJ, URL https://www.justice.gov/opa/pr/florida-ransomware-negotiator-who-extorted-and-attacked-multiple-us-victims-sentenced-prison"
    summary: |
      The US Department of Justice sentenced Angelo John Martino III, a former ransomware negotiator at incident-response firm DigitalMint, to 70 months in prison for conspiring with BlackCat/ALPHV affiliates against the very clients he was hired to represent. While negotiating on victims' behalf, Martino covertly shared each company's confidential negotiating position and cyber-insurance policy limits with the BlackCat operators, letting the attackers calibrate ransom demands to extract the maximum a victim could pay; DOJ ties this scheme to five extorted US companies (nonprofit, financial-services, hospitality and medical-sector victims) totalling $75.3M in ransom, plus a further $1.3M from a separate BlackCat deployment Martino ran with two co-conspirators (Kevin Tyler Martin, Ryan Clifford Goldberg — both also incident-response/red-team professionals, sentenced to 4 years each in April 2026). Law enforcement seized roughly $10M in assets (real estate, cryptocurrency, luxury goods) purchased with the proceeds. This is not a new intrusion technique; it is a documented, adjudicated case of insider betrayal inside the ransomware-response supply chain itself — the negotiator a victim organization retains to reduce its exposure was, in five of nine attempted extortions, working for the attacker.
    region_nexus: "US legal case with no direct Swiss/EU victim; the structural risk is not jurisdiction-specific — any organisation (including Swiss/EU public-sector and CI operators) that retains a third-party ransomware-negotiation/incident-response firm during an extortion event is exposed to the same single-point-of-trust failure"
    primary_sector_nexus: "indirect"
    sector: "cross-sector, financial, healthcare, non-profit"
