items:
  - title: "NCSC-CH flags Gitea Docker image auth bypass (CVE-2026-20896) — first scan activity seen 13 days after disclosure"
    sources:
      - { url: "https://security-hub.ncsc.admin.ch/#/posts/12755", publisher: "NCSC-CH Security Hub", date: "2026-07-10", role: "primary" }
      - { url: "https://github.com/go-gitea/gitea/security/advisories/GHSA-f75j-4cw6-rmx4", publisher: "GitHub Security Advisory (go-gitea/gitea)", date: "2026-06-21", role: "primary" }
      - { url: "https://blog.gitea.com/release-of-1.26.3-and-1.26.4/", publisher: "Gitea", date: "2026-06-21", role: "primary" }
      - { url: "https://www.securityweek.com/critical-gitea-flaw-under-active-exploitation-researchers-warn", publisher: "SecurityWeek", date: "2026-07-07", role: "corroborating" }
      - { url: "https://thehackernews.com/2026/07/threat-actors-probe-gitea-docker-flaw.html", publisher: "The Hacker News", date: "2026-07-06", role: "corroborating" }
    discovery_trace: "first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/12755 (bridge: ncsc-csh recent 15) → primary: Gitea vendor blog, URL https://blog.gitea.com/release-of-1.26.3-and-1.26.4/ → primary: GitHub Security Advisory, URL https://github.com/go-gitea/gitea/security/advisories/GHSA-f75j-4cw6-rmx4 → corroborating: SecurityWeek, URL https://www.securityweek.com/critical-gitea-flaw-under-active-exploitation-researchers-warn (fetched via jina reader after direct WebFetch 403) → corroborating: The Hacker News, URL https://thehackernews.com/2026/07/threat-actors-probe-gitea-docker-flaw.html"
    summary: |
      NCSC-CH's Security Hub published an advisory today (2026-07-10, 08:55 UTC) flagging CVE-2026-20896
      (CVSS 9.8) as "Actively Exploited, Proof of Concept Available" — a critical authentication-bypass flaw
      in Gitea's official Docker images. The vulnerable component is the shipped app.ini template, which
      hard-codes REVERSE_PROXY_TRUSTED_PROXIES = "*" instead of a loopback-only allowlist. When an admin
      enables ENABLE_REVERSE_PROXY_AUTHENTICATION = true to sit Gitea behind an authenticating reverse
      proxy, the wildcard means Gitea accepts the X-WEBAUTH-USER header from ANY source IP, not just the
      proxy's loopback connection — any process that can reach the container's HTTP port directly (bypassing
      the intended proxy) can set that header to impersonate any user whose login name is known or
      guessable, admin accounts included. No password or token is required — a single crafted HTTP header
      is sufficient. Affected: Gitea Docker images <=1.26.2; fixed in 1.26.3 (patch makes reverse-proxy
      auth opt-in), with 1.26.4 shipping a related hotfix — vendor "strongly recommends upgrading directly
      to 1.26.4." Prerequisites: official Gitea Docker image with ENABLE_REVERSE_PROXY_AUTHENTICATION=true
      and network reachability to the container's HTTP port (i.e. the proxy is bypassable, e.g. exposed
      directly or via a misrouted network segment). Exploitation status is contested between sources: NCSC-CH's
      advisory states "Actively Exploited"; the primary research (Sysdig, via The Hacker News and
      SecurityWeek) is more precise — Sysdig's Michael Clark says sensors caught a single scan/probe hit
      from a ProtonVPN-associated "VPN-exit scanner" IP (159.26.98[.]241) 13 days after disclosure, sending
      the spoofed header but with "no password, no token, one header" and, per Clark, "it has not so far
      progressed to any exploitation or attack progress" beyond that probe. SecurityWeek's headline frames
      this as "active exploitation" while its body quote is closer to reconnaissance/credential-testing.
      Sysdig counted ~6,200 internet-facing Gitea instances; how many run the vulnerable Docker default is
      unknown. Impact of a successful compromise: full read/write on all repositories (private included) —
      source code, accidentally committed secrets (API keys, DB credentials, deploy tokens), CI/CD config
      and deploy keys.
