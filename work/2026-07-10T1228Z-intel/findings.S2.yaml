        attribution: "GitHub Security Advisory GHSA-f75j-4cw6-rmx4 (rz1027 / bircni)"
        source_url: "https://github.com/go-gitea/gitea/security/advisories/GHSA-f75j-4cw6-rmx4"
      - quote: "Any process that can reach the Gitea container's HTTP port directly — not through the intended authenticating proxy — can impersonate any user whose login name is known or guessable."
        attribution: "Security researcher Ali Mustafa (rz1027), quoted via SecurityWeek"
        source_url: "https://www.securityweek.com/critical-gitea-flaw-under-active-exploitation-researchers-warn"
      - quote: "While we saw the first action from an IP from the ProtonVPN service, 159.26.98[.]241, it has not so far progressed to any exploitation or attack progress."
        attribution: "Michael Clark, Sysdig Sr. Director of Threat Research, quoted via The Hacker News"
        source_url: "https://thehackernews.com/2026/07/threat-actors-probe-gitea-docker-flaw.html"
    extended_notes: |
      Confidence marked MEDIUM rather than HIGH because of the exploitation-status contradiction between
      the NCSC-CH advisory ("Actively Exploited") and the primary research it cites indirectly (Sysdig via
      THN/SecurityWeek), which describes a single scan/probe hit rather than a confirmed successful
      compromise or follow-on activity. Both readings are surfaced rather than reconciled — defenders
      should treat this as "scanning/probing confirmed, compromise unconfirmed" and prioritise patching
      over incident response. Detection angle: any Gitea deployment using ENABLE_REVERSE_PROXY_AUTHENTICATION
      should audit inbound HTTP requests carrying an X-WEBAUTH-USER (or configured reverse-proxy auth
      header) that did NOT originate from the trusted proxy's loopback/internal address — this is the
      telemetry class (web/app access logs on the Gitea container plus network flow logs distinguishing
      proxy-origin vs. direct-to-container traffic) that would catch both the disclosed PoC and the
      observed scanning IP. Hardening: upgrade to Gitea >=1.26.3/1.26.4 (removes the wildcard default and
      makes reverse-proxy auth opt-in with an explicit trusted-proxy allowlist); in the interim, ensure the
      Gitea container's HTTP port is not directly reachable except through the intended authenticating
      reverse proxy (network policy / firewall rule), and explicitly set REVERSE_PROXY_TRUSTED_PROXIES to
      the proxy's actual address rather than relying on the shipped default.
