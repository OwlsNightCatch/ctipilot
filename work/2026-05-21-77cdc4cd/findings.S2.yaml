  - title: "SAP May 2026 Security Patch Day: CVE-2026-34260 (SQL injection in S/4HANA, CVSS 9.6) and CVE-2026-34263 (unauthenticated RCE in SAP Commerce Cloud, CVSS 9.6)"
    sources:
      - url: "https://support.sap.com/en/my-support/knowledge-base/security-notes-news/may-2026.html"
        publisher: "SAP"
        date: "2026-05-12"
        role: "primary"
      - url: "https://security-hub.ncsc.admin.ch/#/posts/12565"
        publisher: "NCSC-CH Security Hub"
        date: "2026-05-12"
        role: "corroborating"
    discovery_trace: "first seen at: ncsc-csh bridge, URL https://security-hub.ncsc.admin.ch/#/posts/12565 (2026-05-12) → primary: SAP Security Notes May 2026, URL https://support.sap.com/en/my-support/knowledge-base/security-notes-news/may-2026.html"
    summary: |
      SAP released May 2026 security patch day on 2026-05-12, addressing multiple high and critical vulnerabilities. Two critical findings of highest priority for defenders: CVE-2026-34260 (CVSS 9.6) — SQL injection in SAP S/4HANA's database API layer; requires basic authenticated access (e.g., a standard user account with no special privileges); allows an attacker to read and exfiltrate sensitive ERP database contents including financial records, HR data, supply chain data, and user credential tables. CVE-2026-34263 (CVSS 9.6) — missing authentication check in SAP Commerce Cloud; allows a remote unauthenticated attacker to execute arbitrary server-side code on the Commerce Cloud application node via a crafted HTTP request to an unprotected API endpoint, achieving full compromise of the e-commerce tier. Both vulnerabilities have patches available in the May 2026 SAP Security Notes. SAP S/4HANA is the dominant ERP platform across EU public administrations, national revenue authorities, EU institutions, and large defence contractors. SAP Commerce Cloud is used by government digital marketplaces and citizen service portals. Affected versions: SAP S/4HANA and Commerce Cloud (specific release numbers available via SAP Note search in SAP Support Portal). Defender priority: apply SAP Security Notes for May 2026 immediately; restrict S/4HANA database API access to service accounts with least-privilege grants.
    ch_eu_nexus: "High — SAP S/4HANA runs German, Swiss, Austrian, and many EU member-state government ERP back-ends. Swiss federal agencies and large cantonal governments are SAP customers."
    public_sector_nexus: "direct — SAP S/4HANA is core ERP in multiple EU/CH government bodies"
    sector: "government, finance, defence, manufacturing"
    cves: [CVE-2026-34260, CVE-2026-34263]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
