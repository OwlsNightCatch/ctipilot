    evidence:
      - quote: "CVE-2026-44277 CVSS3.1: 9.8 (CRITICAL) - Improper access control in FortiAuthenticator leading to RCE; CVE-2026-26083 CVSS3.1: 9.1 (CRITICAL) - Missing authorization in FortiSandbox Web UI leading to RCE"
