  - title: "Fortinet CVE-2026-44277 / CVE-2026-26083: critical unauthenticated RCE in FortiAuthenticator and FortiSandbox; patches available May 12; no exploitation observed but high weaponisation risk"
    sources:
      - url: "https://fortiguard.fortinet.com/psirt/FG-IR-26-128"
        publisher: "Fortinet PSIRT"
        date: "2026-05-12"
        role: "primary"
      - url: "https://security-hub.ncsc.admin.ch/#/posts/12569"
        publisher: "NCSC-CH Security Hub"
        date: "2026-05-13"
        role: "corroborating"
    discovery_trace: "first seen at: ncsc-csh bridge, URL https://security-hub.ncsc.admin.ch/#/posts/12569 (published 2026-05-13) → primary: Fortinet PSIRT FG-IR-26-128, URL https://fortiguard.fortinet.com/psirt/FG-IR-26-128 (2026-05-12) → corroborating: NCSC-NL advisory NCSC-2026-0156"
    summary: |
      Fortinet disclosed two independent critical vulnerabilities on 2026-05-12: CVE-2026-44277 (CVSS 9.8 per NCSC-CH; also reported as 9.1 in some sources — CVSS vector disputed pending NVD scoring) in FortiAuthenticator, and CVE-2026-26083 (CVSS 9.1) in FortiSandbox. Both are improper access control / missing authorization flaws (CWE-284 / CWE-862) that allow unauthenticated remote attackers to execute arbitrary code or commands via crafted HTTP requests to the management web UI or API endpoint. No authenticated access is required; network access to the appliance management interface is the only prerequisite. CVE-2026-44277 (FortiAuthenticator): An `Improper Access Control [CWE-284]` flaw in FortiAuthenticator may allow an unauthenticated attacker to execute unauthorized code or commands via crafted requests. Affects: FortiAuthenticator 6.4.0-6.4.10 (fix: 6.4.11), 6.5.x below 6.5.7 (fix: 6.5.7), 6.6.x below 6.6.9 (fix: 6.6.9), 8.0.x below 8.0.3 (fix: 8.0.3). FortiAuthenticator Cloud (IDaaS) is not affected. CVE-2026-26083 (FortiSandbox): Missing authorization in FortiSandbox Web UI. Vulnerability discovered internally by Fortinet. No exploitation observed at time of advisory. However, FortiAuthenticator is a high-value target as it functions as the RADIUS/SAML/LDAP/MFA authentication hub for FortiGate, FortiManager, VPN and network access control flows — compromise gives an attacker the ability to bypass MFA, forge RADIUS responses, and gain access to downstream network resources. Defender priority: upgrade FortiAuthenticator to patched version immediately; restrict management interface to dedicated OOB network segments (T1190 Exploit Public-Facing Application). Detection: HTTP 200 responses to unauthenticated POST requests on `/api/v1/` or `/auth/` endpoints from external source IPs; auth audit logs for unexpected sessions with null or anonymous user context.
    ch_eu_nexus: "High — FortiAuthenticator and FortiSandbox are widely deployed in EU financial-sector, government, and critical infrastructure environments. Swiss federal agencies and cantonal governments use Fortinet appliances. BSI Germany and NCSC-CH both flagged this."
    public_sector_nexus: "direct — FortiAuthenticator is a primary MFA/IAM component in government network access control"
    sector: "government, finance, critical infrastructure, telco"
    cves: [CVE-2026-44277, CVE-2026-26083]
    actors_campaigns_malware: []
