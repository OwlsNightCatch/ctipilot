  - title: "Drupal Core CVE-2026-9082: highly critical unauthenticated SQL injection in database API affects PostgreSQL-backed government and university sites; patch released May 20"
    sources:
      - url: "https://www.drupal.org/sa-core-2026-004"
        publisher: "Drupal Security Team"
        date: "2026-05-20"
        role: "primary"
      - url: "https://www.securityweek.com/drupal-to-patch-highly-critical-vulnerability-at-risk-of-quick-exploitation/"
        publisher: "SecurityWeek"
        date: "2026-05-19"
        role: "corroborating"
      - url: "https://security-hub.ncsc.admin.ch/#/posts/12584"
        publisher: "NCSC-CH Security Hub"
        date: "2026-05-19"
        role: "corroborating"
    discovery_trace: "first seen at: ncsc-csh (bridge), URL https://security-hub.ncsc.admin.ch/#/posts/12584 (post published 2026-05-19) → primary: Drupal Security Team SA-CORE-2026-004, URL https://www.drupal.org/sa-core-2026-004 → corroborating: SecurityWeek, URL https://www.securityweek.com/drupal-to-patch-highly-critical-vulnerability-at-risk-of-quick-exploitation/"
    summary: |
      CVE-2026-9082 (SA-CORE-2026-004, Drupal risk score 20/25 — Highly Critical) is an unauthenticated SQL injection in Drupal core's database abstraction API affecting sites backed by PostgreSQL. The flaw resides in how the core database API processes certain query parameters, allowing a remote unauthenticated attacker to inject arbitrary SQL, leading to information disclosure, privilege escalation, and in some configurations remote code execution. Exploitation requires no authentication and no access complexity. Only PostgreSQL-backed Drupal sites are affected; MySQL / MariaDB / SQLite sites are not impacted. Affected versions: Drupal 8.9.0 before 10.4.10, 10.5.0 before 10.5.10, 10.6.0 before 10.6.9, 11.0.0 before 11.1.10, 11.2.0 before 11.2.12, 11.3.0 before 11.3.10. Patched versions: 10.5.10, 10.6.9, 11.1.10, 11.2.12, 11.3.10, released 2026-05-20. No known exploitation observed as of advisory publication; however, the Drupal Security Team explicitly warned that working exploits could emerge within hours of release — standard Drupal post-patch exploitation timeline. Defender priority: patches available — update immediately. For detection, PostgreSQL slow-query logs and Drupal access logs showing anomalous query patterns targeting the core DB API layer are the primary hunt surface. Drupal CMS is widely deployed across EU public administrations, education networks (universities), healthcare portals, and government information sites where PostgreSQL is a common backend — this is directly in scope for CH/EU defenders.
    ch_eu_nexus: "High — Drupal is the CMS of choice for a significant share of EU and Swiss government portals, university websites, and public-sector information sites. PostgreSQL is the default recommended database for many EU public-sector Drupal deployments."
    public_sector_nexus: "direct — EU/CH government portals and university systems commonly run Drupal on PostgreSQL"
    sector: "government, education, public-sector web"
    cves: [CVE-2026-9082]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "This vulnerability can be exploited by anonymous users. This vulnerability only affects sites using PostgreSQL."
        attribution: "Drupal Security Team"
        source_url: "https://www.drupal.org/sa-core-2026-004"
      - quote: "Drupal is warning users that it's preparing a patch for a 'highly critical' vulnerability that may be exploited shortly after its disclosure."
        attribution: "SecurityWeek"
        source_url: "https://www.securityweek.com/drupal-to-patch-highly-critical-vulnerability-at-risk-of-quick-exploitation/"
      - quote: "A critical vulnerability has been identified affecting several versions of Drupal core, with a fix scheduled for release on May 20, 2026 ... The Drupal security team has classified this issue as highly critical, warning that exploits may be developed shortly after the disclosure."
        attribution: "NCSC-CH Security Hub"
        source_url: "https://security-hub.ncsc.admin.ch/#/posts/12584"

  - title: "Keycloak 26.6.2: 16 CVEs including session fixation (CVE-2026-7507), OIDC introspection audience bypass (CVE-2026-37979), execute-actions token replay for WebAuthn enrollment (CVE-2026-37982), and IDOR in Authorization Services API (CVE-2026-4630) — critical batch for public-sector IAM"
    sources:
      - url: "https://www.keycloak.org/2026/05/keycloak-2662-released"
        publisher: "Keycloak Project"
        date: "2026-05-19"
        role: "primary"
      - url: "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-1612"
        publisher: "BSI (CERT-Bund)"
        date: "2026-05-20"
        role: "corroborating"
    discovery_trace: "first seen at: bsi-rss (bridge), URL https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-1612 (published 2026-05-20) → primary: Keycloak Project release notes, URL https://www.keycloak.org/2026/05/keycloak-2662-released (2026-05-19) → corroborating: BSI WID advisory WID-SEC-2026-1612"
    summary: |
      Keycloak 26.6.2, released 2026-05-19, addresses 16 CVEs across identity, authentication, and authorization subsystems. The operationally highest-priority CVEs for public-sector defenders: CVE-2026-7507 — session fixation in the OIDC login flow allowing account takeover via a crafted state parameter before user authentication completes (T1078 Valid Accounts, T1556 Modify Authentication Process); CVE-2026-37982 — execute-actions token replay allowing unauthorized WebAuthn/FIDO2 credential enrollment on a victim account without user consent after one interaction (T1098.005 Account Manipulation: Device Registration); CVE-2026-37979 — the OIDC `/auth/realms/{realm}/protocol/openid-connect/token/introspect` endpoint does not enforce audience restrictions, causing lightweight access tokens scoped to one client to leak claims when presented to any introspection-enabled endpoint; CVE-2026-4630 — cross-resource-server IDOR in the Authorization Services Protection API allowing an authenticated attacker with a token from realm A to query or modify resource permissions in realm B on the same Keycloak instance; CVE-2026-37978 — cross-role PII leakage via the admin `/auth/admin/realms/{realm}/clients/{client}/evaluate-scopes` endpoint bypassing user view permissions. Additionally: CVE-2026-6856 — acceptable AAGUID policy bypass in WebAuthn packed self-attestation allowing enrollment of hardware tokens outside policy (T1078.003); CVE-2026-5588 — Bouncy Castle crypto package with broken algorithm in `bcpkix` modules. Affected versions: Keycloak 26.x below 26.6.2; Red Hat SSO / RH build of Keycloak similarly affected (see separate Red Hat advisories). Fix: upgrade to 26.6.2. Detection: admin audit logs showing unexpected token introspection responses for mismatched audiences; realm cross-access attempts surfaced in Keycloak admin event logs (`RESOURCE_TYPE: authorization_resource`); WebAuthn enrollment events outside policy aaguid list in event logs. Keycloak is the dominant open-source SSO / IAM platform in EU public-sector environments (widely used by EU Commission, European Parliament internal apps, national government portals, municipalities, and health-sector federations).
    ch_eu_nexus: "Very high — Keycloak is the de-facto standard IAM platform for EU public-sector and Swiss cantonal/federal identity federation projects. Multiple EU member state digital identity frameworks and national eHealth platforms are built on Keycloak."
    public_sector_nexus: "direct"
    sector: "government, health, education, finance (EU identity federation)"
    cves: [CVE-2026-7507, CVE-2026-37982, CVE-2026-37979, CVE-2026-4630, CVE-2026-37978, CVE-2026-6856, CVE-2026-5588, CVE-2026-33871, CVE-2026-33870, CVE-2026-4628, CVE-2026-37980, CVE-2026-7504, CVE-2026-7571, CVE-2026-37981]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "[CVE-2026-7507] Session fixation in OIDC login flow leading to account takeover"
        attribution: "Keycloak Project"
        source_url: "https://www.keycloak.org/2026/05/keycloak-2662-released"
      - quote: "[CVE-2026-37982] Execute-actions token replay allows unauthorized WebAuthn credential enrollment on victim account"
        attribution: "Keycloak Project"
