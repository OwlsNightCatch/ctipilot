    extended_notes: |
      The BSI issued WID-SEC-2026-1612 on 2026-05-20 specifically covering these Keycloak vulnerabilities with a HIGH risk classification. German and Austrian public-sector operators running Keycloak should consult the BSI advisory for jurisdiction-specific guidance. Red Hat build of Keycloak (RH-SSO / RHBK) versions in the 26.2.x stream also require separate Red Hat RHSA advisories.

  - title: "Exim CVE-2026-45185 'Dead.Letter': CVSS 9.8 unauthenticated RCE via use-after-free in BDAT body parsing on GnuTLS builds; patched in 4.99.3 (May 12)"
    sources:
      - url: "https://xbow.com/blog/dead-letter-cve-2026-45185-xbow-found-rce-exim"
        publisher: "XBOW"
        date: "2026-05-12"
        role: "primary (researcher disclosure)"
      - url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0163"
        publisher: "NCSC-NL"
        date: "2026-05-15"
        role: "corroborating (national CERT advisory)"
    discovery_trace: "first seen at: ncsc-nl bridge (ncsc-nl recent 15), URL https://advisories.ncsc.nl/advisory?id=NCSC-2026-0163 (published 2026-05-15) → primary: XBOW researcher disclosure, URL https://xbow.com/blog/dead-letter-cve-2026-45185-xbow-found-rce-exim (2026-05-12)"
    summary: |
      CVE-2026-45185 "Dead.Letter" is a use-after-free in Exim's BDAT (SMTP CHUNKING extension, RFC 3030) body parsing code path, present only in builds compiled with `USE_GNUTLS=yes` (OpenSSL builds are not affected). Trigger mechanism: attacker establishes a STARTTLS connection, sends a partial BDAT message body, then sends a TLS `close_notify` alert before the body transfer completes, followed immediately by a single cleartext byte on the same TCP connection. During TLS session teardown (`tls_close()`), the GnuTLS backend frees the TLS receive buffer; however, the BDAT MIME-body wrapper still has a live receive pointer and calls `smtp_ungetc()`, writing that single byte into the freed heap region. This one-byte heap corruption allows an attacker to control adjacent heap metadata and achieve reliable arbitrary code execution on the mail server. Affected: Exim 4.97 through 4.99.2 compiled with GnuTLS — which includes most Debian, Ubuntu, Alpine, and Gentoo default package builds. OpenSSL-based builds (CentOS/RHEL packages, Fedora packages using `--with-openssl`) are not affected. Patched: Exim 4.99.3 (released 2026-05-12). CVSS v3.1 base score 9.8 (Critical). The NCSC-NL advisory confirmed knowledge of exploitation attempts. EPSS data not yet surfaced, but internet-facing SMTP servers with `CHUNKING` advertised and GnuTLS are an attractive target given zero-auth, no config prerequisite beyond default Debian package. Detection: watch for unexpected MTA crashes/restarts, smtp_accept_max events paired with short-lived connections that issue BDAT followed by immediate TLS close, memory error logs from Exim (segfault in smtp process / postmaster). Immediate mitigation: upgrade to 4.99.3 or compile with OpenSSL backend. For Debian/Ubuntu: `apt-get update && apt-get install exim4-daemon-heavy` (or `-light`). Exim is the default MTA in Debian-based Linux distributions and is widely deployed across EU government and academic mail servers.
    ch_eu_nexus: "High — Exim on GnuTLS is the default MTA stack for Debian-based Linux in EU government IT environments, university mail servers, and Swiss cantonal SMTP relays. NCSC-NL issued a national advisory confirming exploitation awareness."
    public_sector_nexus: "indirect — mail infrastructure, government and education SMTP relays"
    sector: "government IT, education, telco, managed services"
    cves: [CVE-2026-45185]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "XBOW discovered CVE-2026-45185, a critical unauthenticated RCE in Exim, and used the disclosure window to test how far human and autonomous exploit development could go."
        attribution: "XBOW"
        source_url: "https://xbow.com/blog/dead-letter-cve-2026-45185-xbow-found-rce-exim"
