  - title: "Microsoft Exchange Server CVE-2026-42897: actively-exploited XSS-to-arbitrary-code-execution zero-day via crafted OWA email; EEMS auto-mitigation available, no permanent patch"
    sources:
      - url: "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-42897"
        publisher: "Microsoft MSRC"
        date: "2026-05-14"
        role: "primary"
      - url: "https://techcommunity.microsoft.com/blog/exchange/addressing-exchange-server-may-2026-vulnerability-cve-2026-42897/4518498"
        publisher: "Microsoft Exchange Team"
        date: "2026-05-14"
        role: "primary"
      - url: "https://www.helpnetsecurity.com/2026/05/15/exchange-server-cve-2026-42897-exploited/"
        publisher: "Help Net Security"
        date: "2026-05-15"
        role: "corroborating"
      - url: "https://security-hub.ncsc.admin.ch/#/posts/12577"
        publisher: "NCSC-CH Security Hub"
        date: "2026-05-15"
        role: "corroborating"
    discovery_trace: "first seen at: ncsc-csh bridge, URL https://security-hub.ncsc.admin.ch/#/posts/12577 (2026-05-15) → primary: Microsoft MSRC advisory, URL https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-42897 → corroborating: Microsoft Exchange Team blog, URL https://techcommunity.microsoft.com/blog/exchange/addressing-exchange-server-may-2026-vulnerability-cve-2026-42897/4518498 → corroborating: ENISA EUVD EUVD-2026-30343 (exploitedSince: 2026-05-15)"
    summary: |
      CVE-2026-42897 (CVSS 8.1, CWE-79 XSS, actively exploited) is a spoofing and stored cross-site scripting vulnerability in on-premises Microsoft Exchange Server Outlook Web Access (OWA). Attack flow: attacker sends a specially crafted email to a target; when the recipient opens the message in OWA (Exchange Web Application at `/owa/`), attacker-controlled JavaScript executes in the victim's browser within the Exchange OWA security context, enabling cookie theft, session hijacking, NTLM relay triggering, and spoofed page rendering. Exchange Online is NOT affected — only on-premises Exchange Server 2016, 2019, and Subscription Edition (SE). Affected products: Exchange Server 2016 CU23, 2019 CU14, SE RTM. Microsoft confirmed active exploitation as of 2026-05-14. CISA added to KEV 2026-05-15 with remediation deadline 2026-05-29. No permanent patch available at disclosure. Microsoft issued: (a) automatic EEMS (Exchange Emergency Mitigation Service) mitigation — auto-applies a URL-rewrite rule that blocks the malicious email rendering path; (b) manual EOMT (Exchange On-premises Mitigation Tool) script for environments with EEMS disabled. Defender priority: confirm EEMS is enabled (`Get-WebConfigurationProperty -Filter "//defaultDocument" -PSPath IIS:\Sites\Default Web Site\` and check ExchangeMitigations event log EID 12); if EEMS is disabled, run EOMT immediately. Detection: OWA access logs (`%ExchangeInstallPath%\Logging\HttpProxy\Owa`) for suspicious JavaScript-bearing responses; browser-side telemetry for unexpected `document.cookie` access from OWA context; Sysmon EID 3 outbound connections from `w3wp.exe` spawned under Exchange application pool. Context: on-premises Exchange remains dominant in EU public administrations, German Bundesbehörden, Swiss Bundesverwaltung, and mid-size municipalities across CH/EU where Exchange Online migration has not been completed.
    ch_eu_nexus: "Very high — on-premises Exchange Server is extensively deployed in Swiss federal, cantonal, and municipal government environments and EU member-state agencies. Actively exploited; CISA KEV listed."
    public_sector_nexus: "direct"
    sector: "government, finance, defense, education"
