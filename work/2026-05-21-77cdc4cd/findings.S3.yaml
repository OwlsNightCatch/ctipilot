        attribution: "ESET Research (Eric Howard)"
        source_url: "https://www.welivesecurity.com/en/eset-research/webworm-new-burrowing-techniques/"
      - quote: "At that time, we also saw that the group started to slow down operations in Asia and shift its focus toward European countries. This trend continued in 2025, with the attacks we observed targeting governmental organizations in Belgium, Italy, Serbia, and Poland."
        attribution: "ESET Research"
