  - title: "SEPPMail Secure E-Mail Gateway: 7 critical vulnerabilities disclosed by InfoGuard Labs (Switzerland) — unauthenticated RCE, LFI, Perl eval injection, deserialization; patched in v15.0.4"
    sources:
      - url: "https://labs.infoguard.ch/posts/seppmail_secure_e-mail_gateway_rce_vulnerabilities_cve-2026-2743_cve-2026-7864_cve-2026-44127_cve-2026-44128/"
        publisher: "InfoGuard Labs (Dario Weiss, Manuel Feifel, Olivier Becker)"
        date: "2026-05-18"
        role: "primary"
      - url: "https://thehackernews.com/2026/05/seppmail-secure-e-mail-gateway.html"
        publisher: "The Hacker News"
        date: "2026-05-19"
        role: "corroborating"
    discovery_trace: "first seen at: hackernews feed, URL https://thehackernews.com/2026/05/seppmail-secure-e-mail-gateway.html → primary: InfoGuard Labs, URL https://labs.infoguard.ch/posts/seppmail_secure_e-mail_gateway_rce_vulnerabilities_cve-2026-2743_cve-2026-7864_cve-2026-44127_cve-2026-44128/"
    summary: |
      InfoGuard Labs (Swiss security firm) disclosed seven vulnerabilities in SEPPMail Secure E-Mail Gateway — a widely-deployed Swiss/EU enterprise secure email solution — with multiple reaching unauthenticated RCE. The vulnerabilities were discovered with partial assistance from LLM agents and reported to the vendor from February 2026; patches were released in versions 15.0.2.1, 15.0.3, and 15.0.4.

      CVE-2026-2743 (CVSS 10.0): Path traversal in the Large File Transfer (LFT) feature of the SeppMail User Web Interface. The endpoint `/v1/file.app` accepts an unsanitized path parameter enabling arbitrary file write as the `nobody` user. Chained to RCE by overwriting `/etc/syslog.conf`, which newsyslog (cron, every 15 minutes) reloads via SIGHUP, enabling Perl reverse shell injection. Only instances with the Large File Transfer license are affected; testable by checking if `https://<gateway>/v1/file.app` returns 404 (unaffected) or another status code (potentially affected). Technique: T1190 (Exploit Public-Facing Application), T1059.006 (Python/Perl reverse shell).

      CVE-2026-44128 (CVSS 9.3): Unauthenticated Perl eval() injection in `/api.app/template`. The `upldd` parameter is passed directly to Perl's `eval()` without sanitization. The endpoint entirely lacks authentication checks due to per-function (rather than centralized) access-control enforcement — the `nosession` key-value pair is specified but never evaluated for this endpoint. Silently patched before v15.0.2.1 (no release notes entry). Technique: T1059 (Command and Scripting Interpreter).

      CVE-2026-44127 (CVSS 8.8): Unauthenticated path traversal in `/api.app/attachment/preview`. The `identifier` parameter accepts arbitrary filesystem paths (e.g., `/tmp/../etc/ldap.conf`), enabling read of LDAP database, user records, password hashes, and mail content. After preview, `remove_folder()` is called deleting the parent directory of the specified path (limited by `nobody` permissions). Technique: T1083 (File and Directory Discovery), T1555 (Credentials from Password Stores).

      CVE-2026-44126 (CVSS 9.2): Unauthenticated deserialization of untrusted data enabling RCE via crafted serialized objects.

      CVE-2026-44125 (CVSS 9.3): Missing authorization for multiple GINA v2 endpoints enabling unauthenticated access to protected functionality.

      CVE-2026-7864 (CVSS 6.9): Unauthenticated env variable dump via `/api.app/hello?op=env`, leaking server environment variables including secrets.

      CVE-2026-44129 (CVSS 8.3): Template engine eval injection via `/api.app/template` enabling template expression execution and potential RCE depending on enabled plugins.

      Full appliance takeover via CVE-2026-2743 gives read access to ALL mail traffic and persistent access. Blue teams typically have zero visibility into SEPPMail virtual appliances. Patch path: CVE-2026-44128 fixed in v15.0.2.1; CVE-2026-44126 fixed in v15.0.3; remaining CVEs patched in v15.0.4. Also note CVE-2026-27441 (CVSS 9.5, OS command execution) patched in an earlier release.
    ch_eu_nexus: "Direct — SEPPMail is a Swiss company (SEPPmail AG, headquartered in Switzerland); the gateway product is widely deployed in Swiss and European enterprises and public sector"
    public_sector_nexus: "direct — secure email gateway used by Swiss federal and cantonal entities, European government organisations"
    sector: "all sectors (email security appliance)"
    cves: ["CVE-2026-2743", "CVE-2026-7864", "CVE-2026-44125", "CVE-2026-44126", "CVE-2026-44127", "CVE-2026-44128", "CVE-2026-44129", "CVE-2026-27441"]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "These vulnerabilities could have been exploited to read all mail traffic or as an entry vector into the internal network. Blue Teams are usually blind on these virtual appliances."
        attribution: "InfoGuard Labs (Dario Weiss, Manuel Feifel, Olivier Becker)"
        source_url: "https://labs.infoguard.ch/posts/seppmail_secure_e-mail_gateway_rce_vulnerabilities_cve-2026-2743_cve-2026-7864_cve-2026-44127_cve-2026-44128/"
      - quote: "The application takes the user-supplied upldd parameter and passes it directly into a Perl eval() statement. Because the input is not sanitized or validated, any Perl code injected into this parameter is immediately executed by the server"
        attribution: "InfoGuard Labs"
        source_url: "https://labs.infoguard.ch/posts/seppmail_secure_e-mail_gateway_rce_vulnerabilities_cve-2026-2743_cve-2026-7864_cve-2026-44127_cve-2026-44128/"
      - quote: "Seven SEPPMail Secure E-Mail Gateway flaws disclosed, including RCE, path traversal, authorization, deserialization, and eval injection flaws."
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/05/seppmail-secure-e-mail-gateway.html"
    extended_notes: |
      The InfoGuard Labs disclosure notes the CVE-2026-44128 patch was silently applied between v15.0.0 and v15.0.2.1 with no release-notes mention — a transparency concern for organisations performing patch-gap analysis. Affected organisations on v15.0.x should check the exact build number, not just the minor version. The LFT endpoint test (HTTP status check on `/v1/file.app`) gives a quick pre-patch exposure assessment without credentials.

  - title: "DirtyDecrypt (CVE-2026-31635) — Linux kernel rxgk COW guard bypass, local privilege escalation PoC public; affects Fedora, Arch, openSUSE Tumbleweed, container escape path"
    sources:
      - url: "https://thehackernews.com/2026/05/dirtydecrypt-poc-released-for-linux.html"
        publisher: "The Hacker News"
        date: "2026-05-19"
        role: "primary"
      - url: "https://github.com/v12-security/pocs/tree/main/dirtydecrypt"
        publisher: "Zellic / V12 Security (Luna Tong)"
        date: "2026-05-09"
        role: "corroborating"
    discovery_trace: "first seen at: hackernews feed, URL https://thehackernews.com/2026/05/dirtydecrypt-poc-released-for-linux.html → pivot: NVD CVE record mentioned → corroborating: GitHub PoC repo linked in article"
    summary: |
      Proof-of-concept exploit code was published for CVE-2026-31635 (CVSS 7.5), a Linux kernel local privilege escalation vulnerability nicknamed DirtyDecrypt (aka DirtyCBC). Discovered and reported by Zellic/V12 Security on May 9, 2026, then found to be a duplicate of an already-patched upstream bug. The vulnerability sits in `rxgk_decrypt_skb()` — the receive-side decryption function for the RXGK Kerberos-based AFS security module. The function decrypts an incoming sk_buff without a copy-on-write (COW) guard, so write operations can bleed into the page cache of privileged processes, enabling overwrite of files such as `/etc/shadow`, `/etc/sudoers`, or SUID binaries — all paths to local root. Technique class: T1068 (Exploitation for Privilege Escalation), with container-escape vector in containerized Kubernetes environments where worker nodes run a vulnerable kernel.

      Impact scope is bounded by CONFIG_RXGK=y: currently only distributions that compile this option (Fedora, Arch Linux, openSUSE Tumbleweed) are affected. The vulnerability is classified as a variant of the Copy Fail family (CVE-2026-31431 → Dirty Frag CVE-2026-43284/CVE-2026-43500 → Fragnesia CVE-2026-46300 → DirtyDecrypt CVE-2026-31635), all sharing the COW-guard-missing primitive targeting kernel page-cache write paths. The Linux kernel developer community is now evaluating a runtime "killswitch" mechanism to disable vulnerable kernel functions until patches are available.

      For defenders: check if the host OS has CONFIG_RXGK enabled (`grep CONFIG_RXGK /boot/config-$(uname -r)`). In containerized environments, if the node kernel is affected, workloads with CAP_NET_RAW or the ability to create AF_RXRPC sockets have a privilege escalation path. Mitigation while patching: restrict kernel module loading, apply seccomp/AppArmor profiles preventing AF_RXRPC socket creation. Patched in mainline prior to PoC publication; distros should have kernel updates.
    ch_eu_nexus: "Global; affects European Linux deployments with RXGK-enabled kernels (particularly Fedora/Arch-based)"
    public_sector_nexus: "indirect — Linux servers including public sector infrastructure on affected distributions"
    sector: "all sectors"
    cves: ["CVE-2026-31635", "CVE-2026-31431", "CVE-2026-43284", "CVE-2026-43500", "CVE-2026-46300"]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "The absence of this COW guard in rxgk_decrypt_skb means that data gets written to the memory of privileged processes or, depending on the exploit path, to the page cache of privileged files, such as etc/shadow, /etc/sudoers, or a SUID binary, leading to local privilege escalation."
        attribution: "The Hacker News (citing moselwal.com analysis)"
        source_url: "https://thehackernews.com/2026/05/dirtydecrypt-poc-released-for-linux.html"
      - quote: "DirtyDecrypt impacts only distributions with CONFIG_RXGK enabled, such as Fedora, Arch Linux, and openSUSE Tumbleweed. In containerized environments, worker nodes running a vulnerable version of Linux could provide a pathway to escape the pod."
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/05/dirtydecrypt-poc-released-for-linux.html"

  - title: "UPDATE: TeamPCP Mini Shai-Hulud worm claims GitHub itself as victim — 3,800+ internal repos exfiltrated via poisoned VS Code extension; durabletask PyPI package (417k monthly downloads) also compromised"
    sources:
      - url: "https://thehackernews.com/2026/05/github-investigating-teampcp-claimed.html"
        publisher: "The Hacker News"
        date: "2026-05-20"
        role: "primary"
      - url: "https://www.wiz.io/blog/durabletask-teampcp-supply-chain-attack"
        publisher: "Wiz Security"
        date: "2026-05-20"
        role: "corroborating"
    discovery_trace: "first seen at: hackernews feed, URL https://thehackernews.com/2026/05/github-investigating-teampcp-claimed.html → pivot: Wiz blog on durabletask, URL https://www.wiz.io/blog/durabletask-teampcp-supply-chain-attack"
    summary: |
      GitHub confirmed on 2026-05-20 that a TeamPCP supply chain attack targeting a GitHub employee device led to exfiltration of approximately 3,800 internal GitHub repositories. The attack vector was a compromised Visual Studio Code extension (GitHub did not name the extension, but Nx Console 18.95.0 compromise coincided — separately disclosed). The attacker gained access through a poisoned VSCode extension, exfiltrated GitHub internal secrets, and from those had access to PyPI tokens to publish malicious packages. GitHub stated no evidence of impact to customer data stored outside GitHub's internal repos; critical secrets have been rotated.

      The exfiltrated repositories include GitHub Actions, agentic workflows, Copilot internal projects, CodeQL tools, internal infrastructure, security tools, marketing materials, Codespaces, Dependabot, and a Rails controller managing organisations and pull requests. LAPSUS$ announced a joint sale with TeamPCP for $95,000, claiming no ransom intent and threatening free release if no buyer is found.

      Simultaneously, TeamPCP's Mini Shai-Hulud worm compromised the `durabletask` PyPI package (Microsoft's official Python client for Durable Task workflows, ~417,000 downloads/month) via versions 1.4.1, 1.4.2, and 1.4.3. The worm propagates using tokens stolen from infected environments. The payload is a dropper fetching `rope.pyz` from `check.git-service[.]com`; the second stage is a full-featured infostealer targeting AWS credentials, 1Password and Bitwarden vaults, SSH keys, Docker credentials, VPN configs, and shell history. Container escape: on Kubernetes, propagates via `kubectl exec`; on AWS, propagates to other EC2 instances via AWS Systems Manager `SendCommand` (AWS-RunShellScript) up to 5 instances per profile. FIRESCALE backup C2 mechanism: scans GitHub public commit messages for pattern `FIRESCALE <base64_url>.<base64_signature>` to recover C2 address if primary is unreachable. The stealer contains anti-execution logic: on Israeli or Iranian systems, 1-in-6 probability of executing `rm -rf /*`. Technique class: T1195.001 (Compromise Software Dependencies — npm/PyPI), T1078.004 (Cloud Accounts — AWS SSM propagation), T1552.001 (Credentials in Files), T1570 (Lateral Tool Transfer via SSM).

      Teams running durabletask 1.4.1–1.4.3 should treat the host as fully compromised. Any pipeline that imported the package during the malicious window triggered the stealer automatically with no visible error messages. Hunt via CI/CD pipeline logs for durabletask import events in the malicious version range and review IAM access logs for SSM SendCommand events that do not correspond to authorized maintenance windows.
    ch_eu_nexus: "Global; PyPI packages affect Swiss and European development pipelines; GitHub internal code breach has supply chain ramifications for all GitHub users including public-sector developers"
    public_sector_nexus: "indirect — public-sector developers and contractors using GitHub and PyPI may be affected"
    sector: "technology, software development, all sectors using Python CI/CD"
    cves: []
    actors_campaigns_malware: ["TeamPCP", "Mini Shai-Hulud", "LAPSUS$", "rope.pyz", "durabletask", "Nx Console 18.95.0"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: update-to-prior:2026-05-16
    evidence:
