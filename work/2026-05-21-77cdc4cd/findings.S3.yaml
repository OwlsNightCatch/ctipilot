  - title: "Fox Tempest malware-signing-as-a-service disrupted by Microsoft (OpFauxSign) — Rhysida, Lumma Stealer, Vidar, Oyster delivered via fraudulent Azure Artifact Signing certificates"
    sources:
      - url: "https://www.microsoft.com/en-us/security/blog/2026/05/19/exposing-fox-tempest-a-malware-signing-service-operation/"
        publisher: "Microsoft Threat Intelligence"
        date: "2026-05-19"
        role: "primary"
      - url: "https://blogs.microsoft.com/on-the-issues/2026/05/19/disrupting-fox-tempest-a-cybercrime-service/"
        publisher: "Microsoft On the Issues (Steven Masada / DCU)"
        date: "2026-05-19"
        role: "primary"
      - url: "https://thehackernews.com/2026/05/microsoft-takes-down-malware-signing.html"
        publisher: "The Hacker News"
        date: "2026-05-20"
        role: "corroborating"
    discovery_trace: "first seen at: msft-secblog recent feed, URL https://www.microsoft.com/en-us/security/blog/2026/05/19/exposing-fox-tempest-a-malware-signing-service-operation/ → corroborating: THN, URL https://thehackernews.com/2026/05/microsoft-takes-down-malware-signing.html → corroborating: Microsoft On the Issues, URL https://blogs.microsoft.com/on-the-issues/2026/05/19/disrupting-fox-tempest-a-cybercrime-service/"
    summary: |
      Microsoft's Digital Crimes Unit disrupted Fox Tempest, a financially motivated threat actor that operated a malware-signing-as-a-service (MSaaS) exploiting Microsoft's Azure Artifact Signing (formerly Azure Trusted Signing) system. Fox Tempest, active since May 2025, used stolen identities — likely from US and Canadian individuals — to pass verification checks and generate short-lived (72-hour) code-signing certificates through Microsoft's legitimate signing infrastructure. The operation, codenamed OpFauxSign, involved seizing the Fox Tempest-operated website SignSpace[.]cloud, taking down hundreds of VMs, and blocking access to the underlying code repository.

      The MSaaS operated as a two-stage service: initially customers uploaded malicious files for signing; from February 2026 Fox Tempest shifted to providing Cloudzy-hosted pre-configured VMs where customers uploaded artifacts directly and received signed binaries in return. The service charged $5,000–$9,000 per engagement.

      Signed malware was distributed as trojanised AnyDesk, Microsoft Teams, PuTTY, and Cisco Webex installers delivered via malicious search advertisements. Vanilla Tempest used this pipeline to distribute Oyster/Broomstick/CleanUpLoader followed by Rhysida ransomware. Connected ransomware affiliates include INC, Qilin, BlackByte, and Akira. Other malware families delivered: Lumma Stealer, Vidar. Targeted sectors: healthcare, education, government, financial services in the US, France, India, and China. The distribution TTPs map to T1553.002 (Code Signing), T1195.002 (Compromise Software Supply Chain — malvertising as initial distribution), T1036.001 (Masquerading — Renamed System Utilities). Defenders should monitor for Authenticode-signed PE files where the signing certificate was issued by Microsoft Artifact Signing / Azure Trusted Signing and the signer entity resolves to a recently-created organisation (< 30 days), combined with child process chains spawning from browser or search download paths. Microsoft's 72-hour certificate validity window is now closed; revocation of the fraudulently obtained certificates removes the signing trust for files already in the wild.
    ch_eu_nexus: "Global; France explicitly named as a targeted country; EU healthcare/education/government sectors in scope"
    public_sector_nexus: "direct — government sector explicitly targeted"
    sector: "healthcare, education, government, finance"
    cves: []
    actors_campaigns_malware: ["Fox Tempest", "Vanilla Tempest", "Rhysida", "Oyster", "Lumma Stealer", "Vidar", "INC ransomware", "Qilin", "BlackByte", "Akira", "OpFauxSign"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Fox Tempest is a financially motivated threat actor operating a malware‑signing‑as‑a‑service (MSaaS) used by other cybercriminals, including Vanilla Tempest and Storm groups, to more effectively distribute malicious code, including ransomware."
        attribution: "Microsoft Threat Intelligence"
        source_url: "https://www.microsoft.com/en-us/security/blog/2026/05/19/exposing-fox-tempest-a-malware-signing-service-operation/"
      - quote: "Fox Tempest is said to have leveraged this mechanism to generate short-lived, fraudulent code-signing certificates and use them to deliver trusted, signed malware and slip past security controls. The certificates were valid for only 72 hours."
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/05/microsoft-takes-down-malware-signing.html"
      - quote: "To obtain legitimate signed certificates through Artifact Signing, the requestor must pass detailed identity validation processes in keeping with industry standard verifiable credentials (VC), which suggests the threat actor very likely used stolen identities based in the United States and Canada"
        attribution: "Microsoft Threat Intelligence"
        source_url: "https://www.microsoft.com/en-us/security/blog/2026/05/19/exposing-fox-tempest-a-malware-signing-service-operation/"
    extended_notes: |
      The Artifact Signing abuse is novel because it abuses a legitimate developer-identity-validation pipeline rather than a compromised certificate authority. The 72-hour validity is likely a deliberate operational security choice to reduce exposure; post-revocation the certificates remain in signed binaries but signature verification fails. Detection surfaces: Windows Security EID 8029 / EID 8033 (code integrity events) on Authenticode violations; Sysmon EID 7 (image loaded) with 'Signed=true, SignatureStatus=Valid' but the signing certificate store entry is from an Artifact Signing OID and the issuing entity age is short. Hunt: search EDR telemetry for processes launched from download directories with valid Authenticode signatures issued by 'Microsoft Artifact Signing CA' or 'Microsoft Azure Code Signing PCA' where the certificate's Not-After timestamp is <72h after Not-Before.

  - title: "ESET: Webworm APT (China-aligned) shifts focus to European government targets — new EchoCreep (Discord C2) and GraphWorm (MS Graph API / OneDrive C2) backdoors documented; Belgium, Italy, Serbia, Poland governmental victims"
    sources:
      - url: "https://www.welivesecurity.com/en/eset-research/webworm-new-burrowing-techniques/"
        publisher: "ESET Research (Eric Howard)"
        date: "2026-05-20"
        role: "primary"
      - url: "https://thehackernews.com/2026/05/webworm-deploys-echocreep-and-graphworm.html"
        publisher: "The Hacker News"
        date: "2026-05-20"
        role: "corroborating"
    discovery_trace: "first seen at: msft-secblog recent feed (no new THN entry seen initially) → WebSearch pivot → ESET WeLiveSecurity primary, URL https://www.welivesecurity.com/en/eset-research/webworm-new-burrowing-techniques/ → THN corroborating, URL https://thehackernews.com/2026/05/webworm-deploys-echocreep-and-graphworm.html"
    summary: |
      ESET Research published a technical analysis of Webworm (also linked to FishMonger/Aquatic Panda, SixLittleMonkeys, Space Pirates — all China-aligned) documenting a significant 2025 campaign pivot targeting European governmental organizations in Belgium, Italy, Serbia, and Poland, plus a university in South Africa. The group has abandoned its previous primary backdoors (Trochilus RAT, McRat/9002 RAT) in favour of two new custom implants and an expanded custom proxy toolkit.

      EchoCreep: Go-written backdoor (earliest Discord messages from March 21, 2024) that uses Discord as C2 channel, encoding commands with base64 + AES-CBC-128. Capabilities: file upload/download, shell command execution via cmd.exe. C2 creates per-victim Discord channels named after the victim IP address or IP+hostname. Four unique victims identified from four Discord channels in the recovered messages (433 total messages decrypted). Initial access vector unknown; post-compromise discovery uses dirsearch (web path bruteforce against 56 targets in Spain, Hungary, Belgium, Nigeria, Czechia, Serbia) and nuclei (vulnerability scanner). Technique class: T1102.002 (Web Service — Bidirectional Communication), T1059.003 (Windows Command Shell).

      GraphWorm: More sophisticated Go-written backdoor using Microsoft Graph API OneDrive endpoints for C2 (/createUploadSession for large file exfiltration). Commands received from and data uploaded to dedicated per-victim OneDrive directories. Data encrypted AES-256-CBC using OpenSSL EVP calls, base64-encoded. Executes at logon via persistence mechanism. Capabilities: cmd.exe session spawning, process creation, file upload/download to/from OneDrive. Technique class: T1102.002, T1071.001 (Application Layer Protocol — Web Protocols).

      Custom proxy toolkit: WormFrp (modified frp, pulls config from compromised AWS S3 bucket wamanharipethe.s3.ap-south-1.amazonaws.com), ChainWorm (multi-hop proxy chaining), SmuxProxy, WormSocket (socket.io-based proxy). Infrastructure runs on Vultr and IT7 Networks cloud servers. SharpSecretsdump (credential dumping tool mimicking Impacket secretsdump.py) uploaded to S3 in October 2025. Files exfiltrated from an Italian governmental entity (virtual machine snapshots) and a Spanish governmental entity (mRemoteNG connection config, Microsoft Visio infrastructure diagram) via the S3 bucket. Technique class: T1003.001 (OS Credential Dumping — LSASS Memory), T1557 (Adversary-in-the-Middle for proxy exfil path), T1537 (Transfer Data to Cloud Account).

      Initial access probe used CVE-2017-7692 (SquirrelMail post-auth RCE) against Serbian targets, suggesting credential theft preceded exploitation. Defender detection targets: outbound HTTPS to api.discord.com or graph.microsoft.com from non-user process trees (e.g. parent process = svchost, lsass, or system processes); SoftEther VPN process execution (vpnclient.exe, vpnserver.exe) on workstations or servers; nuclei/dirsearch execution in post-exploitation context; cmd.exe spawned by processes with no interactive user context.
    ch_eu_nexus: "Direct — Belgium, Italy, Serbia, Poland government organizations confirmed as Webworm 2025 victims; Spain governmental entity also targeted (documents exfiltrated)"
    public_sector_nexus: "direct — governmental organizations in four EU member states are confirmed victims"
    sector: "government, education"
    cves: ["CVE-2017-7692"]
    actors_campaigns_malware: ["Webworm", "EchoCreep", "GraphWorm", "WormFrp", "ChainWorm", "SmuxProxy", "WormSocket", "SharpSecretsdump", "FishMonger", "SixLittleMonkeys", "Space Pirates"]
