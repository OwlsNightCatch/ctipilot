        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/05/github-investigating-teampcp-claimed.html"
      - quote: "In a follow-up update shared on X, GitHub said it detected and contained a compromise of an employee device involving a poisoned Microsoft Visual Studio Code extension."
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/05/github-investigating-teampcp-claimed.html"
      - quote: "If the machine is running inside AWS, it propagates itself to other EC2 instances using SSM. If it's inside Kubernetes, it propagates through kubectl exec"
        attribution: "The Hacker News (citing Aikido Security)"
        source_url: "https://thehackernews.com/2026/05/github-investigating-teampcp-claimed.html"

  - title: "Drupal SA-CORE-2026-004 / CVE-2026-9082 — unauthenticated SQL injection in database abstraction API (PostgreSQL-only); 20/25 Drupal risk score, arbitrary data read/write, potential RCE"
    sources:
