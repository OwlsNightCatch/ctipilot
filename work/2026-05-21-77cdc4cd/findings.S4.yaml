  - title: "GitHub internal repositories breached by TeamPCP via poisoned VS Code extension — ~3,800 repos exfiltrated, customer data not affected"
    sources:
      - url: "https://therecord.media/github-confirms-teampcp-hack-customers-unaffected"
        publisher: "The Record (Recorded Future News)"
        date: "2026-05-20"
        role: "primary"
      - url: "https://www.infosecurity-magazine.com/news/github-confirms-breach-vs-code/"
        publisher: "Infosecurity Magazine"
        date: "2026-05-20"
        role: "corroborating"
      - url: "https://www.helpnetsecurity.com/2026/05/20/github-breached-teampcp/"
        publisher: "Help Net Security"
        date: "2026-05-20"
        role: "corroborating"
    discovery_trace: >
      first seen at: hackernews RSS feed (https://feeds.feedburner.com/TheHackersNews),
      item title 'GitHub Breached — Employee Device Hack Led to Exfiltration of 3,800+ Internal Repos',
      link https://thehackernews.com/2026/05/github-investigating-teampcp-claimed.html →
      pivoted to Infosecurity Magazine primary article https://www.infosecurity-magazine.com/news/github-confirms-breach-vs-code/ →
      corroborated via The Record https://therecord.media/github-confirms-teampcp-hack-customers-unaffected →
      corroborated via Help Net Security https://www.helpnetsecurity.com/2026/05/20/github-breached-teampcp/
    summary: |
      On May 19–20, 2026, GitHub confirmed that TeamPCP (also tracked as UNC6780) gained unauthorised access to approximately 3,800 of its internal code repositories after a single GitHub employee installed a poisoned Visual Studio Code extension. The malicious extension — whose name has not been disclosed — had full access to the compromised developer workstation, including stored credentials, cloud API keys, and SSH keys. GitHub detected and contained the breach on May 19, immediately isolating the affected endpoint, rotating all high-impact secrets, and removing the malicious extension from its environment. The exfiltration was limited to GitHub-internal repositories; GitHub stated there is no evidence that customer data stored outside of those internal systems was accessed. TeamPCP listed the stolen repositories for sale at $50,000, threatening public release if no buyer materialises. The incident extends TeamPCP's systematic supply-chain attack campaign that previously compromised Aqua Security's Trivy, Checkmarx KICS, LiteLLM, TanStack, and the Nx Console VS Code extension, and which was previously attributed by CERT-EU to the March 2026 European Commission AWS breach (92 GB exfiltrated). The VS Code extension ecosystem — with extensions having broad filesystem and credential access on developer machines — is the consistent attack surface; defenders should audit approved-extension policies, enforce code-signing requirements, and monitor VS Code extension installation events via EDR telemetry.
    ch_eu_nexus: "European Commission previously breached by TeamPCP via same Trivy supply-chain vector; GitHub's internal repos may contain code used in European enterprise deployments"
    public_sector_nexus: "indirect — European Commission previously targeted; GitHub internal tools may touch government developer workflows"
    sector: "technology, software development, public sector (via European Commission prior attack)"
    cves: []
    actors_campaigns_malware: ["TeamPCP", "UNC6780"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "GitHub confirmed the breach occurred after 'an employee's device was compromised via a malicious VS Code extension.' The company stated the breach was 'detected and contained' and limited to internal repositories"
        attribution: "Infosecurity Magazine"
        source_url: "https://www.infosecurity-magazine.com/news/github-confirms-breach-vs-code/"
      - quote: "GitHub confirmed being hacked by TeamPCP, says customer data unaffected"
        attribution: "The Record (Recorded Future News)"
        source_url: "https://therecord.media/github-confirms-teampcp-hack-customers-unaffected"
      - quote: "TeamPCP (aka UNC6780) successfully breached GitHub's internal repositories through a malicious Visual Studio Code extension installed by a GitHub employee. The attackers exfiltrated approximately 3,800 internal GitHub repositories."
        attribution: "Help Net Security"
        source_url: "https://www.helpnetsecurity.com/2026/05/20/github-breached-teampcp/"
    extended_notes: |
      Defender hunting angles: monitor process creation from Code.exe / code-server spawning credential-access tools (git-credential-manager, keychain access, aws configure); audit VS Code extension manifests for `contributes.authentication` and filesystem access scopes; review extension installation logs — Sysmon EID 1 with `code --install-extension` command-line pattern. TeamPCP's consistent TTPs: supply-chain compromise of widely-used dev tools, credential harvest from developer workstations, cloud API key exfiltration, followed by ransom/dark-web sale. MITRE ATT&CK: T1195.002 (Compromise Software Supply Chain), T1078.004 (Cloud Accounts via stolen tokens), T1020 (Automated Exfiltration). The VS Code marketplace lacks mandatory code-signing — hardening: set `extensions.autoUpdate: false`, use an approved-extensions allowlist enforced via Group Policy or MDM, and rotate all secrets accessible from developer machines whenever a supply-chain compromise is confirmed.

  - title: "Verizon 2026 DBIR: vulnerability exploitation overtakes credentials as leading breach initial-access vector for the first time in 19 years; third-party breaches up 60%"
    sources:
      - url: "https://www.globenewswire.com/news-release/2026/05/19/3297614/0/en/Vulnerability-Exploitation-Top-Breach-Entry-Point-2026-Industry-Wide-DBIR-Finds.html"
        publisher: "Verizon / GlobeNewswire (official press release)"
        date: "2026-05-19"
        role: "primary"
      - url: "https://www.helpnetsecurity.com/2026/05/20/verizon-2026-dbir-findings/"
        publisher: "Help Net Security"
        date: "2026-05-20"
        role: "corroborating"
      - url: "https://www.verizon.com/business/resources/reports/dbir/"
        publisher: "Verizon (report landing page)"
        date: "2026-05-19"
        role: "corroborating"
    discovery_trace: >
      first seen at: infosec-magazine RSS feed, item 'Verizon DBIR: Vulnerability Exploits Overtake Credentials as Top Access Vector', link https://www.infosecurity-magazine.com/news/verizon-dbir-exploits-top-access/ →
      WebSearch confirmed publication date May 19, 2026 →
      primary: Verizon official GlobeNewswire press release https://www.globenewswire.com/news-release/2026/05/19/3297614/0/en/Vulnerability-Exploitation-Top-Breach-Entry-Point-2026-Industry-Wide-DBIR-Finds.html →
      corroborated via Help Net Security https://www.helpnetsecurity.com/2026/05/20/verizon-2026-dbir-findings/
    summary: |
      Verizon published the 2026 Data Breach Investigations Report (DBIR) on May 19, 2026, covering 22,052 incidents and 12,195 confirmed breaches from November 2024 to October 2025. For the first time in the report's 19-year history, vulnerability exploitation has surpassed stolen credentials as the leading initial-access vector, accounting for 31% of breaches (up from approximately 20% the previous year), while credentials dropped to 13%. Only 26% of CISA Known Exploited Vulnerabilities (KEV) were fully remediated by polled organisations — down from 38% — and median patching time deteriorated to 43 days from 32. Third-party / supply-chain breaches increased 60% year-over-year and now represent 48% of all breaches, with only 23% of affected organisations having fully remediated MFA gaps in third-party cloud accounts. Ransomware was present in 48% of breaches (up from 44%); 69% of victims did not pay. Shadow AI usage quadrupled, now ranked as the third most common insider data-loss mechanism. The report explicitly notes that AI is compressing attacker exploitation windows from months to hours, with AI bot traffic growing 21% month-over-month against 0.3% for human traffic. Defenders at Swiss/European public-sector organisations should interpret the 26% KEV remediation rate as a direct benchmark for their own patching programme effectiveness.
    ch_eu_nexus: "Global findings directly applicable to Swiss and European public-sector environments; the 60% supply-chain breach increase and 43-day median patch time are sector-relevant benchmarks"
    public_sector_nexus: "direct — government entities are among Verizon DBIR's covered sectors; patching and third-party risk findings apply to public-sector procurement and ISMS programmes"
    sector: "all sectors — cross-industry finding"
    cves: []
    actors_campaigns_malware: ["ShinyHunters", "Lapsus$"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Vulnerability exploitation has become the primary initial access vector at 31% of breaches, surpassing compromised credentials which dropped to 13%"
        attribution: "Verizon / GlobeNewswire"
        source_url: "https://www.globenewswire.com/news-release/2026/05/19/3297614/0/en/Vulnerability-Exploitation-Top-Breach-Entry-Point-2026-Industry-Wide-DBIR-Finds.html"
      - quote: "Only 26% of critical vulnerabilities in the CISA Known Exploited Vulnerabilities catalog were remediated by organizations in 2025, down from 38% the previous year. Median patching time increased to 43 days from 32 days."
        attribution: "Help Net Security"
        source_url: "https://www.helpnetsecurity.com/2026/05/20/verizon-2026-dbir-findings/"
    extended_notes: |
      Key DBIR finding for detection engineers: the shift from credential-first to exploit-first as the primary breach vector changes the prioritisation of detection investments — EDR exploit-detection coverage and network-layer anomaly detection for exploitation activity (T1190 Exploit Public-Facing Application) should now rank above credential-stuffing detection. The 60% supply-chain increase maps directly to T1195 Supply Chain Compromise. Full report PDF: https://www.verizon.com/business/resources/T1f0/reports/2026-dbir-data-breach-investigations-report.pdf

  - title: "Huawei enterprise router zero-day triggered 2025 Luxembourg nationwide telecom outage — no CVE assigned, no public patch, near-10-month disclosure gap"
    sources:
      - url: "https://therecord.media/huawei-zero-day-behind-last-year-luxembourg-telecom-outage"
        publisher: "The Record (Recorded Future News)"
        date: "2026-05-19"
        role: "primary"
      - url: "https://securityaffairs.com/192431/hacking/alleged-huawei-zero-day-blamed-for-the-2025-luxembourg-telecom-crash.html"
        publisher: "Security Affairs"
        date: "2026-05-20"
        role: "corroborating"
    discovery_trace: >
      first seen at: therecord.media homepage listing https://therecord.media/ (WebFetch of homepage returned article titles) →
      primary: The Record article https://therecord.media/huawei-zero-day-behind-last-year-luxembourg-telecom-outage fetched directly →
      corroborated via Security Affairs https://securityaffairs.com/192431/hacking/alleged-huawei-zero-day-blamed-for-the-2025-luxembourg-telecom-crash.html
    summary: |
      On May 19, 2026, The Record reported that the nationwide telecommunications outage that hit Luxembourg on July 23, 2025 — disrupting landline, 4G, and 5G services including emergency communications for over three hours — was caused by a previously unknown vulnerability in Huawei enterprise router software running the VRP (Versatile Routing Platform) network operating system. Luxembourg police and the High Commission for National Protection concluded that specially crafted network traffic, which may have been in transit through POST Luxembourg as an ISP relay rather than deliberately targeted at the operator, triggered an undocumented failure condition in Huawei routers causing continuous reboot loops. No CVE identifier has been assigned despite approximately ten months elapsing since the incident. No public Huawei security advisory exists. Investigators found no evidence of deliberate targeting and filed no criminal charges; the traffic was characterised as "corrupted data which may be used to prepare an attack on a random server." The near-one-year gap between the incident (July 2025) and the public disclosure (May 2026) raises concerns about coordinated vulnerability disclosure timeliness; no confirmation of patch status for affected Huawei VRP versions has been published. Any European operator or public-sector network running Huawei enterprise routers on transit internet paths should consider the risk that malformed transit traffic can destabilise router control-planes and review their Huawei vendor advisories and PSIRT subscriptions.
    ch_eu_nexus: "Direct — Luxembourg is an EU member state; POST Luxembourg is a state-owned national carrier. Huawei enterprise routers are deployed across European telecom operators and in some European public-sector networks."
    public_sector_nexus: "direct — POST Luxembourg is state-owned; the outage affected emergency services across the entire country"
    sector: "telecommunications, critical national infrastructure, public sector"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "A previously unknown vulnerability in Huawei enterprise router software caused Luxembourg's nationwide telecoms outage on July 23, 2025. The flaw allowed specially crafted network traffic to trigger continuous restart loops in Huawei routers, disabling POST Luxembourg's landline, 4G, and 5G networks for over three hours."
        attribution: "The Record (Recorded Future News)"
        source_url: "https://therecord.media/huawei-zero-day-behind-last-year-luxembourg-telecom-outage"
      - quote: "The vulnerability was never before encountered by Huawei. No CVE was issued, and no public advisory was released."
        attribution: "Security Affairs"
        source_url: "https://securityaffairs.com/192431/hacking/alleged-huawei-zero-day-blamed-for-the-2025-luxembourg-telecom-crash.html"
    extended_notes: |
      Confidence rated MEDIUM rather than HIGH because: (1) no official Huawei PSIRT advisory exists to confirm details; (2) the original investigation report is not publicly released; (3) the causation description — "corrupted transit traffic" causing router crashes — lacks the technical specificity (CVE, affected VRP version range, crash type) that a vendor advisory would provide. Defender angle: operators running Huawei enterprise routers (NE series, AR series) should ensure PSIRT advisory subscriptions are active and escalate vendor inquiries about VRP control-plane resilience to malformed transit traffic. MITRE ATT&CK mapping uncertain without CVE detail — most plausible: T1498 Network Denial of Service (if intentional) or an input-validation class (CWE-20) flaw. ATT&CK T1499.002 Service Exhaustion Flood is plausible as a delivery mechanism. The near-10-month disclosure gap and absence of a CVE is itself a finding for European NISD2 operators — telecom operators subject to the NIS2 Directive's major incident reporting requirements should review their incident notification obligations in similar scenarios.

  - title: "B1ack's Stash carding marketplace releases 4.6 million stolen payment card records publicly — US-centric dump with full PAN/CVV2/billing data; punitive release against rule-breaking vendors [SINGLE-SOURCE-OTHER]"
    sources:
      - url: "https://socradar.io/blog/b1acks-stash-4-6-million-stolen-credit-cards-free/"
        publisher: "SOCRadar"
        date: "2026-05-18"
        role: "primary"
      - url: "https://securityaffairs.com/192415/cyber-crime/carding-site-b1acks-stash-dumps-4-6-million-stolen-cards-for-free.html"
        publisher: "Security Affairs"
        date: "2026-05-20"
        role: "corroborating"
    discovery_trace: >
      first seen at: securityaffairs.com homepage listing (WebFetch of listing page), item 'Carding site B1ack's Stash dumps 4.6 Million stolen cards for free', link https://securityaffairs.com/192415/cyber-crime/carding-site-b1acks-stash-dumps-4-6-million-stolen-cards-for-free.html →
      drilled to Security Affairs article for initial summary →
      pivoted to SOCRadar primary analysis https://socradar.io/blog/b1acks-stash-4-6-million-stolen-credit-cards-free/ for technical details
    summary: |
      B1ack's Stash — a dark-web carding marketplace operational since at least 2023, which previously released 1 million cards in April 2024 and 4 million in February 2025 — released approximately 4.6 million stolen credit and debit card records as a punitive action against vendors who violated platform terms by cross-listing cards on competing sites. Each record contains the full primary account number (PAN), expiration date, CVV2, cardholder name, billing address, email address, phone number, and IP address — sufficient detail for card-not-present (CNP) fraud. SOCRadar estimates approximately 4.3 million records are net-new and actionable after filtering duplicates and expired cards. Geographic analysis shows approximately 70% of records originating from US-issued cards; secondary sources include Canada, UK, France, Malaysia, Hong Kong, Singapore, and Thailand. The release follows B1ack's Stash's established pattern of using free card dumps as a customer-acquisition tool. The Security Affairs article corroborates the dump and attributes collection methods to e-skimming and phishing based on the completeness of capture data. This is a dark-web claim; victim institutions have not individually confirmed specific cards originated from their systems. Swiss and European financial institutions should alert card fraud teams and consider issuing proactive re-issuance notices for cards matching the geographic profile if their card portfolio includes international issuance in affected markets.
    ch_eu_nexus: "UK and France represented in dataset; potential exposure for Swiss-issued cards with international issuance"
    public_sector_nexus: "indirect — financial fraud risk to citizens; relevant for cantonal banks and Postfinance card portfolios"
    sector: "financial services, payment card industry"
    cves: []
    actors_campaigns_malware: ["B1ack's Stash"]
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "B1ack's Stash announced the free release of approximately 4.6 million stolen credit card records through a forum post in English and Russian. The operator framed the release as punishment for sellers violating platform rules by reselling cards in competing shops."
        attribution: "SOCRadar"
        source_url: "https://socradar.io/blog/b1acks-stash-4-6-million-stolen-credit-cards-free/"
      - quote: "Analysis revealed roughly 70% of records originated from the United States, with Canada and UK as secondary sources."
        attribution: "SOCRadar"
        source_url: "https://socradar.io/blog/b1acks-stash-4-6-million-stolen-credit-cards-free/"
    extended_notes: |
      Dark-web listing — B1ack's Stash's claims are operator-facing and have not been independently confirmed by issuing banks. The MULTI-SOURCE label applies because SOCRadar analysed the actual dump and Security Affairs corroborates the release event; however, individual card-issuer attribution is unverified. Framing: "B1ack's Stash carding marketplace publicly released 4.6M card records; not confirmed by issuing institutions." Defender angle: financial institutions should query their fraud-monitoring feeds (FS-ISAC, card networks' compromise feeds) for flagged records and review e-skimming exposure on customer-facing web properties — especially legacy WooCommerce or Magento storefronts — given the collection method attribution to e-skimming.

