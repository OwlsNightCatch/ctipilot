  - title: "Drupal core SA-CORE-2026-004 (CVE-2026-9082): Highly critical pre-auth SQL injection on PostgreSQL backends — patch released 2026-05-20"
    sources:
      - { url: "https://www.drupal.org/sa-core-2026-004", publisher: "Drupal.org Security Team", date: "2026-05-20", role: "primary" }
      - { url: "https://www.csoonline.com/article/4175329/drupal-admins-rushing-to-patch-maximum-severity-sql-injection-vulnerability.html", publisher: "CSO Online", date: "2026-05-20", role: "corroborating" }
    discovery_trace: "first seen at: bleepingcomputer (RSS feed), title 'Drupal critical update to fix bug with high exploitation risk', 2026-05-20 → Drupal.org PSA-2026-05-18 pre-warning (2026-05-18) → WebSearch 'Drupal SA-CORE-2026-004 May 20 21 2026' → primary: drupal.org/sa-core-2026-004 (2026-05-20)"
    summary: |
      Drupal released SA-CORE-2026-004 on 2026-05-20, assigning CVE-2026-9082 to a highly critical SQL injection vulnerability (rated 20/25 on Drupal's risk scale) in Drupal core's database abstraction API (CWE-89). The flaw allows unauthenticated remote attackers to inject arbitrary SQL against PostgreSQL-backed Drupal installations by sending specially crafted HTTP requests that bypass query sanitization in the database abstraction layer. MySQL and MariaDB backends are not affected. Affected versions span Drupal 8.9.0 through current: 8.9.x before 10.4.10, 10.5.x before 10.5.10, 10.6.x before 10.6.9, 11.1.x before 11.1.10, 11.2.x before 11.2.12, 11.3.x before 11.3.10. Successful exploitation can lead to information disclosure, privilege escalation, and in some database configurations potentially remote code execution. Coordinated releases also include security updates for Symfony and Twig bundled with Drupal. The Drupal Steward WAF service provided immediate protection at advisory release; sites not using Steward must apply the core update. Drupal 7 is not affected. Government and higher-education sectors, where Drupal PostgreSQL deployments are common (approximately 15% of Drupal installs globally), face heightened risk.
    ch_eu_nexus: "High — Drupal is the dominant CMS for Swiss and EU federal government and university websites. PostgreSQL-backed public-sector Drupal instances are common."
    public_sector_nexus: "direct"
    sector: "government, education, media"
    cves: [CVE-2026-9082]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "update-to-prior:2026-05-20"
    evidence:
      - quote: "Drupal core - Highly critical - SQL injection - SA-CORE-2026-004"
        attribution: "Drupal.org Security Team"
        source_url: "https://www.drupal.org/sa-core-2026-004"
      - quote: "A flaw in the API allows specially crafted HTTP requests to slip past sanitization, enabling arbitrary SQL to execute directly against the database"
        attribution: "CSO Online"
        source_url: "https://www.csoonline.com/article/4175329/drupal-admins-rushing-to-patch-maximum-severity-sql-injection-vulnerability.html"
    extended_notes: |
      Prior coverage was the PSA pre-warning (2026-05-20) — this is the UPDATE item reflecting the actual advisory and CVE release. Detection: web-server access logs for anomalous URL-encoded characters and PostgreSQL error traces in application logs. Hardening: apply patch immediately; if patch cannot be applied immediately, disable PostgreSQL backend or enforce Drupal Steward WAF. Hunt: query PostgreSQL logs for abnormal SQL statements from the Drupal application user (pg_stat_activity).

  - title: "SonicWall Gen6 SSL-VPN (CVE-2024-12802): Incomplete patching leaves MFA bypassable; Akira-linked actors exploited via brute force + UPN/SAM account name split"
    sources:
      - { url: "https://www.cybersecuritydive.com/news/patch-bypass-hackers-exploit-flaw-sonicwall/820600/", publisher: "Cybersecurity Dive", date: "2026-05-20", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/hackers-bypass-sonicwall-vpn-mfa-due-to-incomplete-patching/", publisher: "BleepingComputer", date: "2026-05-20", role: "corroborating" }
    discovery_trace: "first seen at: bleepingcomputer feed (2026-05-20), title 'Hackers bypass SonicWall VPN MFA due to incomplete patching' → WebSearch 'SonicWall Gen6 SSL-VPN CVE-2024-12802 MFA bypass incomplete patching 2026' → primary: cybersecuritydive.com 2026-05-20"
    summary: |
      Between February and March 2026, threat actors consistent with Akira ransomware activity successfully bypassed MFA on SonicWall Gen6 SSL-VPN appliances running officially patched firmware (CVE-2024-12802). The root cause is that SonicWall's firmware update alone does not remediate CVE-2024-12802 — six additional manual LDAP server reconfiguration steps are required to enforce MFA on both UPN (User Principal Name) and SAM (Security Account Manager) login formats when integrated with Active Directory. Attackers exploited the UPN login path that accepted credentials without triggering MFA checks, brute-forcing accounts at speed without generating standard authentication alerts. CVSS 3.1 score for CVE-2024-12802 is 9.1 (Critical, AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N). Gen6 SSL-VPN appliances reached end-of-life on 2026-04-16 and no longer receive security updates. Gen7 and Gen8 devices are fully remediated by firmware update alone. In investigated incidents, threat actors pivoted to domain controllers within hours of initial access, deploying ransomware tooling. Attribution consistent with Akira TTPs but not formally confirmed.
    ch_eu_nexus: "Moderate — SonicWall SSL-VPN is common in Swiss SME and municipal networks. EoL status means no future patches."
    public_sector_nexus: "indirect"
    sector: "all sectors, SME, local government"
    cves: [CVE-2024-12802]
    actors_campaigns_malware: ["Akira ransomware (TTPs-consistent, unconfirmed)"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "installing the firmware update alone on Gen6 devices does not fully mitigate the vulnerability, and a manual reconfiguration of the LDAP server is required"
        attribution: "Cybersecurity Dive"
        source_url: "https://www.cybersecuritydive.com/news/patch-bypass-hackers-exploit-flaw-sonicwall/820600/"
      - quote: "VPN accounts brute-forced at speed, MFA appearing enabled but not stopping authentication, and a specific session type in the logs pointing to automated tooling"
        attribution: "Cybersecurity Dive"
        source_url: "https://www.cybersecuritydive.com/news/patch-bypass-hackers-exploit-flaw-sonicwall/820600/"
    extended_notes: |
      Detection: SonicWall Gen6 SSL-VPN syslog — filter for successful SSL-VPN authentications where the login field uses UPN format (user@domain) rather than SAM format (DOMAIN\user). High-volume authentication attempts from single source IPs. Lateral movement within hours to domain controllers. Hardening: complete all six LDAP reconfiguration steps from SonicWall's advisory kA1VN0000000RBd0AM; migrate to Gen7/Gen8 immediately given EoL status of Gen6.

  - title: "CVE-2026-45829 — ChromaDB Python FastAPI server: pre-auth RCE via embedding-function model loading before auth check (CVSS 4.0 = 10.0, unpatched in v1.5.9)"
    sources:
      - { url: "https://hadrian.io/blog/cve-2026-45829----chromadb-python-server-hands-you-rce-before-it-asks-who-you-are", publisher: "Hadrian Security", date: "2026-05-19", role: "primary" }
      - { url: "https://nvd.nist.gov/vuln/detail/CVE-2026-45829", publisher: "NVD/NIST", date: "2026-05-19", role: "corroborating" }
      - { url: "https://www.bleepingcomputer.com/news/security/max-severity-flaw-in-chromadb-for-ai-apps-allows-server-hijacking/", publisher: "BleepingComputer", date: "2026-05-19", role: "corroborating" }
    discovery_trace: "first seen at: bleepingcomputer RSS feed (2026-05-19), title 'Max-severity flaw in ChromaDB for AI apps allows server hijacking' → WebSearch 'ChromaDB CVE 2026 max severity RCE pre-auth' → primary: hadrian.io/blog/cve-2026-45829 → NVD confirmed CVE"
    summary: |
      HiddenLayer researchers discovered CVE-2026-45829, a CVSS 4.0 = 10.0 pre-authentication RCE vulnerability in ChromaDB's Python FastAPI server (affected from version 1.0.0). The vulnerable endpoint is POST /api/v2/tenants/{tenant}/databases/{db}/collections: when a request includes an embedding function configuration with trust_remote_code: true and a malicious HuggingFace model identifier (or local path), the server fetches and executes the attacker-controlled Python code before running its authentication check, granting arbitrary code execution on the server. The attacker receives a 403 Forbidden response after code execution — the server completes execution before the auth gate fires. The flaw exists only in the Python FastAPI server implementation (chromadb[server] pip package); the default Rust server (chroma run) does not traverse this code path. Approximately 73% of internet-accessible ChromaDB deployments use the Python server. As of publication (May 2026), ChromaDB v1.5.9 (latest) remains unpatched. HiddenLayer reported on 2025-11-28; Chroma acknowledged 2025-12-16; full disclosure 2026-05-13. The vulnerability is directly relevant to AI development pipelines and RAG (Retrieval-Augmented Generation) infrastructure increasingly deployed across enterprise and research environments, including EU academic and government AI labs.
    ch_eu_nexus: "Moderate-high — ChromaDB is the dominant open-source vector database for AI workloads; EU academic and federal research environments deploying RAG pipelines are affected."
    public_sector_nexus: "indirect"
    sector: "technology, research, AI infrastructure"
    cves: [CVE-2026-45829]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "ChromaDB's Python FastAPI server loads attacker-controlled embedding-function configuration before it runs its auth check. Set trust_remote_code: true and point model_name at any HuggingFace repo (or a local path) you control, and the server executes your Python from inside the POST /api/v2/.../collections request — and then politely returns 403 Forbidden afterwards. CVSS 4.0 = 10.0. Still unpatched in v1.5.9"
        attribution: "Hadrian Security"
        source_url: "https://hadrian.io/blog/cve-2026-45829----chromadb-python-server-hands-you-rce-before-it-asks-who-you-are"
      - quote: "A pre-authentication, code injection vulnerability in version 1.0.0 or later of the ChromaDB Python project allows an unauthenticated attacker to run arbitrary code on the server"
        attribution: "NVD/NIST"
        source_url: "https://nvd.nist.gov/vuln/detail/CVE-2026-45829"
    extended_notes: |
      No patch available — mitigate by: (1) disabling the Python FastAPI server and migrating to the Rust server; (2) blocking network-level access to the ChromaDB API (it should never be directly internet-exposed); (3) if internal only, restrict trust_remote_code to false via server config if possible. Detection: unexpected outbound network connections from ChromaDB Python server processes; process spawned by uvicorn/gunicorn with unusual child process trees; access logs showing POST /api/v2/.../collections with model identifiers containing paths or unusual HuggingFace repo references. T1190 Exploit Public-Facing Application.

  - title: "PinTheft Linux LPE: RDS zerocopy double-free + io_uring page-cache overwrite gives root on Arch Linux; PoC public, no CVE yet"
    sources:
      - { url: "https://www.openwall.com/lists/oss-security/2026/05/19/6", publisher: "oss-security mailing list / V12 Security", date: "2026-05-19", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/linux/exploit-released-for-new-pintheft-arch-linux-root-escalation-flaw/", publisher: "BleepingComputer", date: "2026-05-20", role: "corroborating" }
    discovery_trace: "first seen at: bleepingcomputer RSS feed (2026-05-20), title 'Exploit released for new PinTheft Arch Linux root escalation flaw' → WebSearch 'PinTheft Linux CVE number RDS io_uring double-free Arch Linux' → primary: openwall.com/lists/oss-security/2026/05/19/6"
    summary: |
      Aaron Esau (V12 Security) disclosed PinTheft on 2026-05-19 via oss-security, a local privilege escalation exploit combining an RDS (Reliable Datagram Sockets) zerocopy double-free with io_uring fixed-buffer reference manipulation to overwrite SUID binary page cache entries and gain root. The bug lives in rds_message_zcopy_from_user() in the Linux kernel's RDS send path: when a partial page fault occurs mid-scatter, the error path drops already-pinned pages but leaves the scatterlist bookkeeping live, causing the cleanup path to drop them a second time (double-free). The attacker registers an anonymous memory page as an io_uring fixed buffer (FOLL_PIN bias of 1024 refs), then drains all references via 1024 deliberate failing RDS sends, leaving io_uring holding a stale page pointer. This pointer is then used to overwrite the page cache of a SUID-root binary, redirecting execution to attacker shellcode for root. The exploit requires: RDS kernel module loaded, io_uring enabled, readable SUID-root binary, x86_64. The RDS module is default-loaded only on Arch Linux; it is not default on Ubuntu, Fedora, Debian, RHEL, or SUSE. A kernel patch was committed upstream before disclosure. No CVE has been assigned as of disclosure date. The primary threat is to Arch Linux systems — including CI/CD runners, developer workstations, and AUR-based server deployments — where local privilege escalation leads to container escapes or domain persistence.
    ch_eu_nexus: "Low-moderate — Arch Linux is rare in Swiss public-sector production; relevant for security research workstations, CI/CD environments, and developer infrastructure."
    public_sector_nexus: "indirect"
    sector: "technology, DevOps"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "PinTheft is a Linux local privilege escalation exploit for an RDS zerocopy double-free that can be turned into a page-cache overwrite through io_uring fixed buffers"
        attribution: "oss-security mailing list / V12 Security"
        source_url: "https://www.openwall.com/lists/oss-security/2026/05/19/6"
    extended_notes: |
      Detection: Sysmon Linux EID 1 — process lineage where a non-root process spawns a new root shell without going through sudo/su; audit framework events on rds_sendmsg / io_uring ops from unexpected binaries. T1068 Exploitation for Privilege Escalation. Mitigation: modprobe.d blacklist for rds if not in use; disable io_uring via sysctl kernel.io_uring_disabled=2 for untrusted workloads; apply upstream kernel patch when distributed.

  - title: "Webworm (China-aligned APT): ESET documents EchoCreep and GraphWorm backdoors using Discord and MS Graph API for C2"
    sources:
      - { url: "https://www.welivesecurity.com/en/eset-research/webworm-new-burrowing-techniques/", publisher: "ESET WeLiveSecurity", date: "2026-05-20", role: "primary" }
      - { url: "https://thehackernews.com/2026/05/webworm-deploys-echocreep-and-graphworm.html", publisher: "The Hacker News", date: "2026-05-20", role: "corroborating" }
    discovery_trace: "first seen at: TheHackersNews RSS feed (2026-05-20), title 'Webworm Deploys EchoCreep and GraphWorm Backdoors Using Discord and MS Graph API' → primary: welivesecurity.com/en/eset-research/webworm-new-burrowing-techniques/ (2026-05-20)"
    summary: |
      ESET published a technical report on 2026-05-20 documenting new capabilities added by Webworm, a China-aligned APT first documented by Symantec in September 2022 and linked to SixLittleMonkeys and FishMonger clusters. The group added two new custom backdoors in 2025: EchoCreep, which uses Discord channels for command-and-control via direct message API (supports file upload/download and cmd.exe command execution); and GraphWorm, a more capable implant that uses the Microsoft Graph API and OneDrive for C2 (supports spawning cmd.exe sessions, arbitrary process execution, file staging to OneDrive, and operator-initiated self-termination). EchoCreep C2 channel activity was traced back to 2024-03-21 with 433 C2 messages. Both backdoors abuse legitimate cloud communication platforms to blend C2 traffic with ordinary business traffic and evade URL/domain-based detection. Targeting remains government agencies and organizations in IT services, aerospace, and power sectors; fresh activity documented extends to European targets per Infosecurity Magazine reporting. The cloud-API C2 technique (T1102.002 Web Service — Bidirectional Communication) makes these highly resistant to standard proxy and DNS-based detection.
    ch_eu_nexus: "High — Webworm has documented European targeting activity; sectors of relevance (IT services, government, power/energy) match Swiss and EU public-sector exposure."
    public_sector_nexus: "direct"
    sector: "government, IT services, aerospace, energy"
    cves: []
    actors_campaigns_malware: ["Webworm", "EchoCreep", "GraphWorm", "SixLittleMonkeys", "FishMonger"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "ESET researchers describe new tools and techniques that the Webworm APT group recently added to its arsenal"
        attribution: "ESET WeLiveSecurity"
        source_url: "https://www.welivesecurity.com/en/eset-research/webworm-new-burrowing-techniques/"
    extended_notes: |
      Detection: network proxy/DLP — TLS sessions to discord.com/api or graph.microsoft.com from non-standard applications (not Discord.exe, Teams.exe, Office/OneDrive processes); look for beacon-like periodic API calls at short uniform intervals. EDR: cmd.exe spawned by processes with no user context (service account, scheduled task). T1102.002 Web Service Bidirectional Communication. Hunting in SIEM: correlate endpoint process tree (parent=GraphWorm implant → child=cmd.exe) with Graph API token acquisition events in Azure AD sign-in logs (non-interactive sign-ins from unfamiliar app registrations).

  - title: "CVE-2026-42822 — Azure Local Disconnected Operations (ALDO): CVSS 10.0 unauthenticated network EoP; 'Exploitation More Likely'"
    sources:
      - { url: "https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-42822", publisher: "Microsoft MSRC", date: "2026-05-18", role: "primary" }
      - { url: "https://nvd.nist.gov/vuln/detail/CVE-2026-42822", publisher: "NVD/NIST", date: "2026-05-18", role: "corroborating" }
    discovery_trace: "first seen at: MSRC May 2026 release listing (bridge:msrc release 2026-May) → msrc cve CVE-2026-42822 → primary: msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-42822 (2026-05-18) → NVD confirmed"
    summary: |
      CVE-2026-42822 is a CVSS 3.1 = 10.0 (Critical) improper authentication vulnerability in Azure Local Disconnected Operations (ALDO), Microsoft's solution for running Azure services in air-gapped or disconnected infrastructure environments. The MSRC assessment rates exploitation as "More Likely." An unauthorized network attacker can bypass authentication entirely and elevate privileges without requiring any prior foothold or credentials. CVSS vector: AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H. Not yet exploited in the wild; no public PoC confirmed. Remediation requires upgrading ALDO to version 2604 or later via a full system update. Standard Azure cloud customers using Microsoft-managed Resource Manager environments are already protected; only air-gapped / locally-operated Azure Local infrastructure requires manual action. This is directly relevant to EU public-sector organizations running on-premises Azure Local stacks for data-sovereignty compliance.
    ch_eu_nexus: "High — Azure Local / Azure Stack HCI is widely deployed in EU public-sector environments (healthcare, government) for data-residency compliance. Air-gapped instances require manual patching."
    public_sector_nexus: "direct"
    sector: "government, healthcare, defense, financial services"
    cves: [CVE-2026-42822]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Improper authentication in Azure Local Disconnected Operations allows an unauthorized attacker to elevate privileges over a network."
        attribution: "Microsoft MSRC"
        source_url: "https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-42822"
    extended_notes: |
      Detection: Azure Local / Windows Admin Center audit logs — look for unauthenticated API calls or unexpected elevation events from network-sourced sessions in the ALDO management plane. Hardening: upgrade ALDO to v2604+; if immediate upgrade is not possible, restrict network access to the ALDO management interface to trusted admin subnets only. T1078.004 Cloud Accounts (abuse of authentication bypass grants cloud-level account context).

  - title: "Grafana breach root-cause: missed GitHub token rotation after TanStack npm supply-chain attack; TeamPCP confirmed as actor"
    sources:
      - { url: "https://grafana.com/blog/grafana-labs-security-update-latest-on-tanstack-npm-supply-chain-ransomware-incident/", publisher: "Grafana Labs", date: "2026-05-19", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/grafana-breach-caused-by-missed-token-rotation-after-tanstack-attack/", publisher: "BleepingComputer", date: "2026-05-20", role: "corroborating" }
    discovery_trace: "first seen at: bleepingcomputer RSS feed (2026-05-20), title 'Grafana breach caused by missed token rotation after TanStack attack' → WebSearch 'Grafana breach TanStack npm attack GitHub token rotation May 20 2026' → primary: grafana.com blog update 2026-05-19"
    summary: |
      Grafana Labs published a root-cause disclosure on 2026-05-19 confirming that the actor who exfiltrated approximately 3,800 private GitHub repositories was TeamPCP, the same group behind the TanStack npm supply-chain attack. The attack vector: Grafana's CI/CD workflows consumed the malicious TanStack npm package; the embedded infostealer exfiltrated GitHub Actions OIDC tokens. Grafana detected the compromise on 2026-05-01 and rotated GitHub workflow tokens — but one token was not rotated, and TeamPCP exploited this residual token to clone private source code repositories. Grafana received an extortion demand on 2026-05-16 and refused to pay, citing no evidence of customer production data being accessed. Scope confirmed limited to internal GitHub repositories. The incident is a downstream consequence of the TanStack supply-chain attack and illustrates the systemic risk of partial token rotation — a gap detectable via GitHub secret scanning if the missed token generated new API calls. This is a material UPDATE on the TeamPCP/GitHub supply-chain campaign already covered.
    ch_eu_nexus: "Moderate — Grafana is widely used in Swiss and EU government and enterprise observability stacks. The supply-chain attack pattern applies to any organization whose CI/CD consumed the TanStack package."
    public_sector_nexus: "indirect"
    sector: "technology, DevOps, observability"
    cves: []
    actors_campaigns_malware: ["TeamPCP", "Mini Shai-Hulud"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "update-to-prior:2026-05-19"
    evidence:
      - quote: "The Grafana data breach was caused by a single GitHub workflow token that slipped through the rotation process following the TanStack npm supply-chain attack"
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/grafana-breach-caused-by-missed-token-rotation-after-tanstack-attack/"
    extended_notes: |
      Action for defenders: audit GitHub Actions OIDC token rotation completeness after any supply-chain event. GitHub's secret scanning and push-protection features would flag tokens used post-rotation if the token generated new API calls. Hunt: GitHub audit log — filter for oauth_access or installations.access_tokens.create events from unrecognized IP ranges after incident detection date.

