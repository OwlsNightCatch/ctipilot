    evidence:
      - quote: "the first signs of the attack were detected October 22"
        attribution: "The Record"
        source_url: "https://therecord.media/european-commission-confirms-cyberattack-using-ai"
      - quote: "did not identify the tool used or the attackers’ apparent motivation"
        attribution: "The Record"
        source_url: "https://therecord.media/european-commission-confirms-cyberattack-using-ai"
      - quote: "Regnier said investigators had found no evidence of a data breach affecting Commission staff broadly and were unaware of any ransom demand."
        attribution: "The Record"
        source_url: "https://therecord.media/european-commission-confirms-cyberattack-using-ai"
      - quote: "CERT-EU, detected earlier this month that international hackers used ARTEX, a publicly available AI-powered tool designed to identify vulnerabilities in IT systems."
        attribution: "POLITICO Europe"
        source_url: "https://www.politico.eu/newsletter/brussels-playbook/cyberattack-hits-the-commission/"
      - quote: "Sysper, the Commission’s HR platform for payslips, leave requests and timesheets, and MyPMO, its medical reimbursement system, were restored earlier this week"
        attribution: "POLITICO Europe"
        source_url: "https://www.politico.eu/newsletter/brussels-playbook/cyberattack-hits-the-commission/"
