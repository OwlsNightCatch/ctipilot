  - title: "DIVD closes the forensics on its 2026-09-21 breach: AI-agent-driven post-exploitation, 11:47 from first probe to first breach and 19 minutes to root, attacker hunted credentials and tokens, about 41,000 ticket titles and 4,121 personal email addresses leaked"
    sources:
