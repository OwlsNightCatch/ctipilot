    techniques: [T1595, T1588.002]
    techniques_note: "T1190 is CERT-EU's tool-level mapping of ARTEX use (cert.europa.eu blog, 2026-11-05); it is NOT stated for the Commission intrusion itself. Composer's call whether to add it."
