        attribution: "Corriere del Ticino (USI communiqué)"
        source_url: "https://www.cdt.ch/news/ticino/lusi-vittima-di-un-incidente-informatico-444916"
      - quote: "ma non è ancora chiaro quando sia iniziata l'intrusione né quanto sia durata"
        attribution: "Ticinonline"
        source_url: "https://www.tio.ch/ticino/cronaca/1963886/usi-vittima-di-un-attacco-informatico"
    extended_notes: |
      What the sources support for the entry's labelled lines: Exposure - any organisation running an internet-facing online-forms/survey/application-intake system that stores uploaded documents; USI names no product, so the check is inventory-driven (forms and survey tools, their versions, whether the response store and attachments sit on the same internet-reachable host). Detection - web/application access logs on the forms server for the 2026-11-09 to 2026-11-17 window (request patterns to the forms application, file reads or exports of the response store and attachments, new files or admin sessions), and whether the application host can reach internal services; the post-patch check is whether stored form submissions and attachments were read, since patching the application does not show prior access. USI itself says the start and duration of the intrusion are unknown. Defender takeaway candidate: treat form-intake tools as data stores (they hold CVs, scholarship files, survey answers), patch/segment them like databases, and minimise retention of attachments. Do not infer a link to the contemporaneous PHP and survey-software disclosures: no source connects them to USI. Public-sector adjacency: the contemporaneous Swiss cantonal incidents (Basel-Landschaft, Vaud school platform of 2026-10-31) are separate. RSI page metadata date reads 2026-11-16 but its text says USI announced "giovedì" (2026-11-19).
