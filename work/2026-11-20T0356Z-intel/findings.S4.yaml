    discovery_trace: "first seen at: next-ink (slice), URL https://next.ink/feed (feed item https://next.ink/268532/cyberattaque-a-la-commission-europeenne-une-plateforme-agentique-de-pentest-mise-en-cause/) → pivot: Politico Brussels Playbook, URL https://www.politico.eu/newsletter/brussels-playbook/cyberattack-hits-the-commission/ (originating report; read with extract, WebFetch refuses politico.eu) → pivot: The Record, URL https://therecord.media/european-commission-confirms-cyberattack-using-ai (spokesperson briefing, Commission's own words) → context: CERT-EU blog https://cert.europa.eu/blog/from-penetration-testing-to-cyber-threat-beware-of-artex and FBI FLASH https://www.ic3.gov/CSA/2026/261113.pdf (pdf subcommand); also seen at borncity (slice) https://borncity.com/blog/2026/11/19/cybervorfaelle-bei-orderando-gmbh-tourismus-und-moeglicherweise-slack/ and heise-sec feed. The Commission's own midday-briefing video (audiovisual.ec.europa.eu) was not fetched; its words are cited as relayed by The Record, Next and heise."
    summary: |
      Facts (Commission spokesperson Thomas Regnier at the 2026-11-19 midday briefing, as relayed by The Record, Next and heise): the first signs of the campaign were detected on 2026-10-22 (Next and heise add confirmation on 2026-10-26); he called it an "AI-generated cyber campaign"; several applications were taken offline as a protective measure and most are back; other systems are being checked preventively together with CERT-EU and the European Data Protection Supervisor; investigators have found no evidence of a data breach affecting Commission staff broadly and know of no ransom demand; the investigation is open. He did not name the tool or the attackers. Claims (POLITICO, anonymous EU officials, not confirmed by the Commission): CERT-EU detected "earlier this month" that international hackers used ARTEX; the HR platform Sysper (payslips, leave, timesheets) and the medical-reimbursement system MyPMO were disrupted for more than 10 days and restored earlier in the week (Sysper briefly crashed again on 2026-11-18); translation services failed on 2026-11-17; the Corporate Management Board met in urgent session; investigators have not yet established whether staff data was reached, which is why staff communication was thin; salaries were largely paid on time. No source states the initial access vector, the vulnerable component, the intrusion's dwell time or any attacker post-exploitation behaviour; Cyber Security News notes the report does not establish whether ARTEX was used for entry or only to find weaknesses. Context from authorities (not tied to the Commission by either): CERT-EU wrote on 2026-11-05 that it had seen AI-driven activity against its own constituency that "highly likely involved the use of ARTEX", and an FBI FLASH of 2026-11-13 lists government among the sectors targeted with the framework since August 2026 and notes the original author withdrew the repository in October 2026 while forks and a commercial variant circulate (The Record: this is the Commission's third disclosed incident of 2026, after the January Ivanti and March cloud-infrastructure cases; officials have not linked them).
    region_nexus: "EU institution (Brussels; CERT-EU constituency); Swiss relevance indirect but real: ARTEX-driven activity against government networks is described by CERT-EU and the FBI as global and sector-agnostic, and the FBI names government among targeted sectors"
    primary_sector_nexus: "direct (public-sector: an EU government institution; HR/payroll and medical-reimbursement platforms)"
    sector: "public-sector"
