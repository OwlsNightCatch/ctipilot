    discovery_trace: "first seen at: divd-csirt (slice), URL https://csirt.divd.nl/feed.xml (feed item 'Case update: DIVD-2026-00014 - When, not if...', 2026-11-18) → primary (no pivot needed): https://csirt.divd.nl/cases/DIVD-2026-00014/ → linked data-investigation overview https://csirt.divd.nl/cases/DIVD-2026-00014/overview_data_investigation/ (the case page's own link https://csirt.divd.nl/DIVD-2026-00014/overview_data_investigation/ is a meta-refresh to this path)."
    summary: |
      DIVD, the Dutch vulnerability-disclosure CSIRT, updated its case file on 2026-11-18 (20:09 CET) to say the forensic investigation of its 2026-09-21 breach is complete. Facts per DIVD: the attacker breached its Zammad ticketing instance on 2026-09-21 using the two Zammad zero-days already in the store (CVE-2026-102489 session-leak code execution and CVE-2026-102490 zammad-to-root escalation, fixed in Zammad 7.2 and 7.2.2 per DIVD); after obtaining root the attacker "used AI agents to continue the attack", which DIVD infers from the sheer volume of activity (990 custom-written payloads, 228 output directories and 3,259 output files recovered) and from attack-script comments in which the agents appear to address each other. DIVD's timeline metrics: 11:47:20 from first probe to first breach, 00:19:01 from first breach to root, first monitoring alert within minutes (mean time to detect 00:15:11), but 19 hours before a first response was initiated and 27:40 to contain. Final data assessment: the attacker was mainly after credentials (all leaked credentials rotated); a GitLab personal access token and a Slack API key were compromised without giving access (the token could not reach internal GitLab; the Slack key had no read permission); OAuth tokens of two shared mailboxes were obtained and used to send test emails with no mailbox-content compromise observed; only the host carrying Zammad was compromised at root level; because direct outbound traffic from that host was impossible, exfiltration was selective, covering roughly 41,000 ticket titles and a limited set of older conversations, 207 volunteer email addresses, two phone numbers and seven identifiable profile pictures from Jira/Confluence, and, after DIVD's LLM-and-human filtering of the ticket export, 4,121 personal email addresses, 34 phone numbers and three street addresses; masked (never plaintext) credentials of a small number of organisations leaked; the CVE/CNA environment, scanning signatures, non-weaponised exploits and zero-day research showed no sign of access. DIVD is both victim and discoverer, so this is its own account (it names Merlon Security as forensic partner and reported to the Dutch DPA and NCSC-NL); the AI-agent attribution is DIVD's assessment from artefact volume and script comments, not independent telemetry.
    region_nexus: "Netherlands (DIVD, EU); Swiss relevance: Zammad is common in public-sector helpdesks and the entry already tracks it; the AI-agent speed profile is transferable"
    primary_sector_nexus: "indirect (vulnerability-disclosure CSIRT; same exploited Zammad flaws already in the store)"
    sector: "technology"
    cves: [CVE-2026-102489, CVE-2026-102490]
    techniques: [T1190, T1068, T1528, T1550.001, T1552]
    techniques_note: "T1190/T1068 are already on the Zammad entry; T1528 (steal application access token) and T1550.001 (use of the stolen OAuth tokens to send test emails) come from DIVD's data-investigation table; T1552 is the credentials hunt DIVD describes ('mainly interested in credentials'). Composer to keep only what the entry's body will describe."
