    discovery_trace: "first seen at: tio-ch-attacco-informatico (slice), URL https://www.tio.ch/temi/attacco-informatico (read with `url --direct`; article href /ticino/cronaca/1963886/usi-vittima-di-un-attacco-informatico, then `extract`) → pivot: WebSearch (\"USI \\\"attacco informatico\\\" Lugano università dati personali accesso non autorizzato 9 17 novembre\") → CdT https://www.cdt.ch/news/ticino/lusi-vittima-di-un-incidente-informatico-444916 and laRegione https://www.laregione.ch/cantone/ticino/1963907/dati-usi-accesso-particolare-ateneo (both reproduce the USI communiqué) → primary notice at usi.ch (bluewin links https://www.usi.ch/it/data-breach; every transport incl. WebFetch returned 403, so the USI page itself was NOT read and is not cited)."
    summary: |
      USI says it was the victim of an IT incident in which unauthorised third parties accessed data held on one of its applications between 2026-11-09 and 2026-11-17 by exploiting a vulnerability in the software of an online-forms system used to collect certain job applications, scholarship requests and surveys. The affected server stored users' form responses and the documents attached to them. USI's IT services activated incident procedures and secured the server, informed the competent authorities and the people whose data may be affected, and is working with external specialists; cause, scope, sensitivity of the data and risk to individuals are still being established, the review will take several more weeks, and individuals will be told directly if specially protected personal data turn out to be involved. Ticinonline adds that it is not yet clear when the intrusion began or how long it lasted. USI's notice names neither the forms product nor the vulnerability nor any attacker, and no source reports a claim by an extortion group; the ransomware.live Swiss feed (checked 2026-11-20) listed no USI post. USI warns affected people to treat unexpected emails, calls and messages with suspicion and not to open unusual links or attachments, which is the standard follow-on risk for application and scholarship data.
