    confidence: HIGH
    confidence_note: "HIGH that the Commission confirmed an AI-generated campaign detected 2026-10-22 with 10+ days of HR-platform disruption (spokesperson via three outlets); MEDIUM on the ARTEX linkage (one anonymous EU official via POLITICO, then rewritten by others; the Commission did not confirm the tool)."
    classification_suggestion: { reliability: B, credibility: 2 }
