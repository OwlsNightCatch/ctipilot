claims:
  - claim_id: 37acbdcff3
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "body"
    kind: cited
    text: "DIVD, the Dutch Institute for Vulnerability Disclosure, says attackers first reached its systems on 2026-09-21 and that they got in through two zero-days in Zammad, the customer-service ticketing software ("
    urls: ["https://csirt.divd.nl/cases/DIVD-2026-00014/"]
  - claim_id: 2e3fa45658
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "body"
    kind: cited
    text: "), which together allowed session hijacking, remote code execution and privilege escalation from the Zammad user to root \"in seconds\" ("
    urls: ["https://csirt.divd.nl/cases/DIVD-2026-00014/public_statements_on_hack/"]
  - claim_id: 4f3de1ed76
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "body"
    kind: cited
    text: "From there the attackers could access other services and exfiltrate data; DIVD says network segmentation and its incident response stopped them going deeper, and that volunteer data such as email addresses and possibly contact details got out ("
    urls: ["https://csirt.divd.nl/cases/DIVD-2026-00014/public_statements_on_hack/"]
  - claim_id: 58e7061bef
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "body"
    kind: cited
    text: "DIVD assesses the attack as driven by AI agents, because the attacker's scripts carry notes in which the agent justifies its own actions, and says it sees no link to any known public threat actor ("
    urls: ["https://csirt.divd.nl/cases/DIVD-2026-00014/public_statements_on_hack/"]
  - claim_id: a03b8b036c
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "body"
    kind: cited
    text: "CVE-2026-102489 is a session hijack that leads to remote code execution as the zammad user in versions 6.3.0 to 6.5.4; the defect is also present in 7.0.0 to 7.1.3 but DIVD says it is not exploitable there because of environment conditions ("
    urls: ["https://csirt.divd.nl/DIVD-2026-00015"]
  - claim_id: 5bf3603018
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "body"
    kind: cited
    text: "NCSC-NL describes it as exploitable by an attacker who has not logged in ("
    urls: ["https://www.ncsc.nl/alerts/actief-misbruik-van-zeroday-kwetsbaarheden-in-zammad-update-nu"]
  - claim_id: e86f7e914c
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "body"
    kind: cited
    text: "), while DIVD's CVE record scores it CVSS 4.0 8.7 with passive user interaction ("
    urls: ["https://csirt.divd.nl/cves/CVE-2026-102489"]
