    text: "They fix CVE-2026-115560, the third path that the October releases left open, and disable session upload progress by default, so the interim advice to keep it off now applies only to hosts that have not updated; where upload progress is explicitly enabled, every reader and writer of the session store must still use one session.serialize_handler ("
    urls: ["https://github.com/php/php-src/security/advisories/GHSA-658j-r8rw-q6mx"]
  - claim_id: 61e1b34798
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "section 2026-11-20T05:14:20Z"
    kind: cited
    text: "PHP also calls CVE-2026-129481, a use-after-free of a stale session filename that affects PHP 8.3 and later, an incomplete fix for CVE-2026-109619, and CVE-2026-129182, for PHP 8.5 only, covers further scenarios after the 8.5.12 fix, and the 2026-11-19 builds carry both fixes ("
    urls: ["https://github.com/php/php-src/security/advisories/GHSA-g3vh-838c-65v7", "https://github.com/php/php-src/security/advisories/GHSA-2fjv-p558-g82m"]
  - claim_id: 0165a6baf4
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "section 2026-11-20T05:14:20Z"
    kind: cited
    text: "The same release fixes an unauthenticated PHP-FPM request-smuggling flaw, CVE-2026-129289, that needs a front end reusing FastCGI backend connections ("
    urls: ["https://github.com/php/php-src/security/advisories/GHSA-qc49-hpvq-g2w6"]
  - claim_id: 097cf212cf
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "record 2026-11-20T05:14:20Z"
    kind: record-summary
    text: "PHP's regular releases of 2026-11-19 (8.5.13, 8.4.28, 8.3.37, 8.2.36) fix CVE-2026-115560, which the October releases left open, and carry follow-up fixes PHP ties to the incomplete CVE-2026-109619 fix; the update target and the interim upload-progress advice change accordingly."
  - claim_id: a5eeae5fcb
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "Microsoft Threat Intelligence reports that as early as September 2026 Storm-0940, a China-state aligned actor active since 2021, used the agentic penetration-testing framework ARTEX to automate attacks on hundreds of organizations across many industries, government and military among them ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/10/21/storm-0940-uses-artex-agentic-ai-connectwise-supply-chain-compromise/"]
  - claim_id: 0054f6f66c
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "ARTEX is an open-source multi-agent LLM system that can use any AI model and runs a penetration test from reconnaissance to exfiltration with little human involvement ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/10/21/storm-0940-uses-artex-agentic-ai-connectwise-supply-chain-compromise/"]
  - claim_id: eeb0bb5d15
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "Microsoft says ARTEX accelerated the abuse of compromised applications already granted access to Microsoft 365 tenants ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/10/21/storm-0940-uses-artex-agentic-ai-connectwise-supply-chain-compromise/"]
  - claim_id: 58f1d8575e
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "), and Expel adds that it is not a vulnerability and only speeds up familiar techniques such as password spraying and OAuth-application abuse ("
    urls: ["https://expel.com/blog/storm-0940-artex-attacks-connectwise-app-abuse-and-okta-sign-ups/"]
  - claim_id: 7c0408f67d
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "); most targeting failed, yet several cases went from first targeting to privileged cloud access in under three hours ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/10/21/storm-0940-uses-artex-agentic-ai-connectwise-supply-chain-compromise/"]
  - claim_id: 404a1df459
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "Microsoft assesses the same actor was behind the ConnectWise Cloud Backup application-credential abuse ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/10/21/storm-0940-uses-artex-agentic-ai-connectwise-supply-chain-compromise/"]
  - claim_id: dafb9278f4
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "Expel saw Storm-0940 infrastructure scan a customer and, from 2026-10-13, abuse its Okta self-service registration with no ConnectWise application involved: the attacker created five accounts of its own, enrolled Okta Verify on three of them about a minute after activation, made 50 single sign-on logins with more than 100 OAuth tokens issued and ran a password spray that Okta ThreatInsight blocked ("
    urls: ["https://expel.com/blog/storm-0940-artex-attacks-connectwise-app-abuse-and-okta-sign-ups/"]
  - claim_id: 2ed4adeac1
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "Expel says the shared source address is its only link to Storm-0940, the activity alone does not prove ARTEX was used, and it had not seen the technique reported before ("
    urls: ["https://expel.com/blog/storm-0940-artex-attacks-connectwise-app-abuse-and-okta-sign-ups/"]
  - claim_id: 7d55fabb7c
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "Other actors use it: CrowdStrike analysed an unnamed, probably Chinese-speaking and financially motivated actor that ran ARTEX against South Korean financial institutions from late September ("
    urls: ["https://www.crowdstrike.com/en-us/blog/unknown-threat-actor-uses-artex-to-target-south-korean-finance/"]
  - claim_id: 56c61ed5bd
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "), and Recorded Future, which tracks that activity as TAG-217, says use of ARTEX and other AI penetration-testing tools is not limited to it ("
    urls: ["https://www.recordedfuture.com/blog/tag-217-artex-south-korean-banks"]
  - claim_id: 8e9f927275
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "Wiz Research independently reports that throughout October 2026 it tracked an actor using ARTEX-associated tooling, overlapping with Storm-0940, against IT and software vendors, focused on identity providers (Okta, Entra, Cognito) and Microsoft 365 integrations, and says that most attempts failed and that none of the techniques is novel ("
    urls: ["https://www.wiz.io/blog/artex-in-the-wild-storm-0940-expands-targeting-of-it-and-software-vendors"]
  - claim_id: 00ba73e031
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "It describes a consistent sequence: downloading JavaScript bundles, exposed source maps, runtime configuration and OpenAPI documents, then calling internal API routes by name minutes later; fabricated authorization codes and malformed state values against Microsoft OAuth callbacks; unsigned JWTs tried against more than 60 SSO route variants in two minutes; and account-recovery, sign-up and Cognito calls such as InitiateAuth, ForgotPassword and ResendConfirmationCode ("
    urls: ["https://www.wiz.io/blog/artex-in-the-wild-storm-0940-expands-targeting-of-it-and-software-vendors"]
  - claim_id: 3cd9fdcb64
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "Its password sprays against Entra and Okta hit hundreds of users, mainly software engineers, in bursts of 20 to 60 minutes with a unique user agent per burst, a median gap of one second between attempts and new source addresses within minutes of a block ("
    urls: ["https://www.wiz.io/blog/artex-in-the-wild-storm-0940-expands-targeting-of-it-and-software-vendors"]
  - claim_id: 4bde764d50
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "**Exposure:** any tenant that relies on password sign-in or grants OAuth consent to applications, and any Okta org with self-service registration enabled; not using ConnectWise does not exclude exposure ("
    urls: ["https://expel.com/blog/storm-0940-artex-attacks-connectwise-app-abuse-and-okta-sign-ups/"]
  - claim_id: 50c37af9af
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "**Detection:** in the authentication logs of every identity provider in use, bursts of failed logons and lockouts spread over many accounts; in the Okta system log, newly self-registered accounts that enrol Okta Verify and start single sign-on within minutes; and in the Entra audit log, credentials or certificates added to applications that nobody on your team created and any application that assigns itself a directory role ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/10/21/storm-0940-uses-artex-agentic-ai-connectwise-supply-chain-compromise/", "https://expel.com/blog/storm-0940-artex-attacks-connectwise-app-abuse-and-okta-sign-ups/"]
  - claim_id: 297a697100
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "A clean audit log is not proof of no access, because Microsoft Graph directory reads leave no Entra audit record ("
    urls: ["https://expel.com/blog/storm-0940-artex-attacks-connectwise-app-abuse-and-okta-sign-ups/"]
  - claim_id: 08571f196b
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "In web access logs of an application exposed to the same actor, Wiz points to source-map and OpenAPI downloads followed minutes later by calls to internal routes that appear only in those files, and to sign-in telemetry showing a new user agent for each burst of attempts at a one-second cadence ("
    urls: ["https://www.wiz.io/blog/artex-in-the-wild-storm-0940-expands-targeting-of-it-and-software-vendors"]
  - claim_id: b553d7b4b1
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "**Triage:** Python and curl user agents match common legitimate automation, so Expel treats them as supporting evidence only, and a Python user agent on an application that normally calls Microsoft Graph with a .NET SDK is the anomaly ("
    urls: ["https://expel.com/blog/storm-0940-artex-attacks-connectwise-app-abuse-and-okta-sign-ups/"]
  - claim_id: d048ad9945
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** Expel's reading is that the framework adds speed, not a new vulnerability, so the levers are the identity controls it runs into: least privilege on multi-tenant application permissions and consent grants, alerting on credential additions and privileged role assignments by applications, and a review of self-registered Okta accounts since 2026-10-13 ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/10/21/storm-0940-uses-artex-agentic-ai-connectwise-supply-chain-compromise/", "https://expel.com/blog/storm-0940-artex-attacks-connectwise-app-abuse-and-okta-sign-ups/"]
  - claim_id: 9f3783e95e
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "section 2026-11-20T05:12:58Z"
    kind: cited
    text: "The European Commission confirmed on 2026-11-19 that an AI-generated cyber campaign hit its internal systems: its spokesperson said the incident was detected on 2026-10-22 and confirmed on 2026-10-26, that several applications were taken offline as a protective measure and most are restored, that there is no evidence of a data breach affecting Commission staff as a whole and that it is not aware of a ransom request, and the Commission names no tool or attacker and declines to attribute or size the campaign ("
    urls: ["https://audiovisual.ec.europa.eu/en/media/video/I-298222"]
  - claim_id: 317a747f98
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "section 2026-11-20T05:12:58Z"
    kind: cited
    text: "POLITICO, citing an anonymous EU official, reports that CERT-EU detected earlier this month that international hackers used ARTEX, that the staff HR platform Sysper and the medical-reimbursement system MyPMO were offline for more than 10 days, and that investigators have not yet established whether staff data was compromised ("
    urls: ["https://www.politico.eu/newsletter/brussels-playbook/cyberattack-hits-the-commission/"]
  - claim_id: d7506f0539
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "section 2026-11-20T05:12:58Z"
    kind: cited
    text: "The Commission has not confirmed the ARTEX link, and the reporting does not establish whether ARTEX provided entry or was only used to find weaknesses ("
    urls: ["https://cybersecuritynews.com/european-commission-cyberattack/"]
  - claim_id: cc5e75d972
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "record 2026-11-20T05:12:58Z"
    kind: record-summary
    text: "The European Commission confirmed an AI-generated cyber campaign against its internal systems, detected on 2026-10-22, with its HR and medical-reimbursement systems offline for more than 10 days per POLITICO; only an anonymous EU official names ARTEX, and no access vector is stated."
  - claim_id: dac7310604
    entry: 2026-11-11/turla-cereal-exchange-server-c2-and-mail-collector-gov
    surface: "body"
    kind: cited
    text: "ESET found a previously undocumented .NET toolset, Cereal, on a Kazakh government organisation's Exchange server on 2025-11-28 and, after tuning its detections, on a Romanian government organisation's Exchange server compromised from 2025-12-23; in Romania the mail-collection module was configured to identify messages to or from NATO and EU institutional addresses ("
    urls: ["https://www.welivesecurity.com/en/eset-research/exchange-for-breakfast-turlas-cereal-tricks-are-not-for-kids/"]
  - claim_id: 14617a1ba5
    entry: 2026-11-11/turla-cereal-exchange-server-c2-and-mail-collector-gov
    surface: "body"
    kind: cited
    text: "ESET attributes Cereal to Turla with high confidence, on the concurrent use of another component publicly linked to Turla and conceptual similarity to older Turla malware, and could not determine the initial access method, although it considers a vulnerability exploit possible because the servers are reachable from the internet ("
    urls: ["https://web-assets.esetstatic.com/wls/en/papers/white-papers/turla-cereal-tricks.pdf"]
  - claim_id: 5036315692
    entry: 2026-11-11/turla-cereal-exchange-server-c2-and-mail-collector-gov
    surface: "body"
    kind: cited
    text: "CerealNeuron runs on the compromised server and passively waits for requests on web paths made to look like Outlook Web Access, Autodiscover and ActiveSync traffic; a correctly encrypted request is treated as a command and a bad one gets a normal-looking Exchange error page, and ESET found no operator-controlled server and could not identify ingress addresses ("
    urls: ["https://www.welivesecurity.com/en/eset-research/exchange-for-breakfast-turlas-cereal-tricks-are-not-for-kids/"]
  - claim_id: 0abdaf01bc
    entry: 2026-11-11/turla-cereal-exchange-server-c2-and-mail-collector-gov
    surface: "body"
    kind: cited
    text: "CerealHermit is a network-less variant that reads encrypted command files from disk, and each task runs as a small .NET assembly inside a CerealRunner (mailbox retrieval, Active Directory and WMI queries, LSA secrets extraction, file operations) ("
    urls: ["https://www.welivesecurity.com/en/eset-research/exchange-for-breakfast-turlas-cereal-tricks-are-not-for-kids/"]
  - claim_id: 90a9bb07ec
    entry: 2026-11-11/turla-cereal-exchange-server-c2-and-mail-collector-gov
    surface: "body"
    kind: cited
    text: "CerealLoader, the only component written to disk in recognisable .NET form, abuses .NET VTable fixups so native code runs before managed code and is placed where trusted processes load it: the System32 wbem directory (ncobjapi.dll, wbemcomn.dll, loaded by WMI) and the .NET native image cache ("
    urls: ["https://www.welivesecurity.com/en/eset-research/exchange-for-breakfast-turlas-cereal-tricks-are-not-for-kids/"]
  - claim_id: d1adb7fd2f
    entry: 2026-11-11/turla-cereal-exchange-server-c2-and-mail-collector-gov
    surface: "body"
    kind: cited
    text: "CerealBox, injected into EdgeTransport.exe, wraps the handlers of transport agents already loaded, so \"no new agent appears anywhere in Exchange's configuration\"; it keeps messages with .doc, .docx or .pdf attachments that match hard-coded sender, recipient, subject or attachment-name lists and stages them compressed and encrypted on disk for exfiltration through CerealNeuron ("
    urls: ["https://www.welivesecurity.com/en/eset-research/exchange-for-breakfast-turlas-cereal-tricks-are-not-for-kids/"]
  - claim_id: a56611c428
    entry: 2026-11-11/turla-cereal-exchange-server-c2-and-mail-collector-gov
    surface: "body"
    kind: uncited
    text: "The command channel is the victim's own Exchange server."
  - claim_id: 50bb008a32
    entry: 2026-11-11/turla-cereal-exchange-server-c2-and-mail-collector-gov
    surface: "body"
    kind: derived
    text: "**Exposure:** any organisation that runs Microsoft Exchange on premises with a role reachable from the internet; ESET names no vulnerable version, so exposure is the deployment model."
  - claim_id: e0bf6e0e9b
    entry: 2026-11-11/turla-cereal-exchange-server-c2-and-mail-collector-gov
    surface: "body"
    kind: derived
    text: "**Detection:** file-integrity telemetry on the Exchange host for DLLs in the System32 wbem directory and .NET native image cache files that do not match the Microsoft originals; module telemetry for non-Microsoft assemblies loaded into EdgeTransport.exe while Get-TransportAgent lists nothing new; web-server logs for requests to the Outlook Web Access, Autodiscover and ActiveSync look-alike paths from clients with no matching mailbox flow, whose encrypted bodies return a generic error page; and Exchange Web Services mailbox retrievals made from the server's own context."
  - claim_id: f876e814b4
    entry: 2026-11-11/turla-cereal-exchange-server-c2-and-mail-collector-gov
    surface: "body"
    kind: derived
    text: "With no external C2 and no known entry vector, the check is a compromise assessment of every internet-facing Exchange server."
  - claim_id: 4bc462771d
    entry: 2026-11-11/turla-cereal-exchange-server-c2-and-mail-collector-gov
    surface: "body"
    kind: derived
    text: "**Triage:** third-party anti-spam, data-loss-prevention and archiving products also inject into the transport service, but they are vendor-signed and appear in the transport-agent configuration, which CerealBox does not; the native image cache regenerates legitimately after .NET updates, so a changed timestamp alone is weak, while a file that does not match the Microsoft binary is the signal."
  - claim_id: 32f970e9e8
    entry: 2026-11-11/turla-cereal-exchange-server-c2-and-mail-collector-gov
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** treat internet-facing Exchange servers as top-tier assets with endpoint detection and restricted egress, baseline the wbem directory and the native image cache, and run the compromise assessment now, because network-only detection will not find a channel that rides the victim's own web paths."
  - claim_id: 45657363e0
    entry: 2026-11-11/turla-cereal-exchange-server-c2-and-mail-collector-gov
    surface: "section 2026-11-20T05:12:44Z"
    kind: cited
    text: "ReversingLabs correlated ESET's published loader samples and says the same files carry different vendor names, CerealLoader at ESET, BlankPage in Microsoft Defender and CerealMood in other engines, so a hunt on a single family name can miss matches; it says the work extends the artifacts defenders can search for and establishes no additional victims or initial-access method ("
    urls: ["https://www.reversinglabs.com/blog/inside-turlas-cereal-12-exchange-loaders-older-traces-and-new-ways-to-hunt"]
  - claim_id: 06037a38a4
    entry: 2026-11-11/turla-cereal-exchange-server-c2-and-mail-collector-gov
    surface: "section 2026-11-20T05:12:44Z"
    kind: cited
    text: "Its hunting guidance adds three checks to the Detection line: list live HTTP.sys listeners with `netsh http show servicestate` and read reverse-proxy, load-balancer and WAF logs for the reported CerealNeuron paths, because IIS site logs alone may not show requests served by an independent HTTP.sys listener; search the Exchange and Windows service directories for unexpected managed DLLs named version.dll, WTSAPI32.dll, SensApi.dll or dbghelp.dll; and review module loads in WmiPrvSE.exe as well as EdgeTransport.exe ("
    urls: ["https://www.reversinglabs.com/blog/inside-turlas-cereal-12-exchange-loaders-older-traces-and-new-ways-to-hunt"]
  - claim_id: d20102fd7c
    entry: 2026-11-11/turla-cereal-exchange-server-c2-and-mail-collector-gov
    surface: "record 2026-11-20T05:12:44Z"
    kind: record-summary
    text: "ReversingLabs' follow-up adds hunting specifics to Cereal: the loaders appear under other vendor names (BlankPage, CerealMood), a check for live HTTP.sys listeners, the proxy-DLL names to look for in Exchange and Windows service directories and module loads in WmiPrvSE.exe; it adds no victim or entry vector."
  - claim_id: fb0c3d5419
    entry: 2026-11-18/cve-2026-115731-puppet-enterprise-report-deserialization-rce
    surface: "summary"
    kind: frontmatter
    text: "CISA added CVE-2026-115731 to its Known Exploited Vulnerabilities catalog on 2026-11-17 on evidence of active exploitation it does not describe. A client holding any CA-signed agent certificate can run code on a Puppet Enterprise server as its service user by sending a crafted report, and where the CA autosigns requests without strong verification an unauthenticated attacker can first obtain that certificate; a trigger event has been public since 2026-11-03, and Puppet Enterprise 2023.8.13, 2025.12.1 and 2026.0.1 carry the fix. The same advisory fixed CVE-2026-115732, a certificate-name authorization bypass (CVSS 4.0 9.0) that lets a certificate for a name extending a real host name authenticate as that host; CISA lists only CVE-2026-115731."
  - claim_id: 3ef50cdd7b
    entry: 2026-11-18/cve-2026-115731-puppet-enterprise-report-deserialization-rce
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade every Puppet Enterprise server to 2023.8.13, 2025.12.1 or 2026.0.1 (Puppet Core to 9.1.3 or 8.22.2, OpenVox Server to 9.2.0 or 8.18.0; open-source Puppet gets no fix) and, until the upgrade is in, stop the CA from autosigning certificate requests without strong verification and audit the certificates it issued for names that collide with an existing node name, because CISA lists the deserialization flaw as exploited, any holder of a CA-signed agent certificate reaches code execution on the server and a colliding name authenticates as another host."
  - claim_id: fc4d9d89fc
    entry: 2026-11-18/cve-2026-115731-puppet-enterprise-report-deserialization-rce
    surface: "cves[CVE-2026-115731]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-115731\", \"cvss\": \"9.4\", \"status\": [\"exploited\", \"cisa-kev\", \"poc-public\", \"patch-available\"], \"affected\": \"Puppet Enterprise 2023.8.0 before 2023.8.13, 2025.0.0 before 2025.12.1, 2026.0.0 before 2026.0.1; OpenVox Server up to 9.1.0 and 8.17.0\", \"fixed\": \"Puppet Enterprise 2023.8.13, 2025.12.1, 2026.0.1; OpenVox Server 9.2.0, 8.18.0\", \"auth\": \"post-auth\", \"vector\": \"zero-click\"}"
  - claim_id: 8d7ac8318b
    entry: 2026-11-18/cve-2026-115731-puppet-enterprise-report-deserialization-rce
    surface: "cves[CVE-2026-115732]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-115732\", \"cvss\": \"9.0\", \"status\": [\"patch-available\"], \"affected\": \"Puppet Enterprise 2023.8.0 before 2023.8.13, 2025.0.0 before 2025.12.1, 2026.0.0 before 2026.0.1; OpenVox Server and OpenVoxDB up to 9.1.0 and 8.17.0; Puppet Core before 9.1.3 and 8.22.2\", \"fixed\": \"Puppet Enterprise 2023.8.13, 2025.12.1, 2026.0.1; Puppet Core 9.1.3, 8.22.2; OpenVox Server and OpenVoxDB 9.2.0, 8.18.0\", \"auth\": \"post-auth\", \"vector\": \"zero-click\"}"
