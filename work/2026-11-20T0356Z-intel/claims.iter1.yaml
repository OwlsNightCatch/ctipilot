  - claim_id: d041d2b5cd
    entry: 2026-11-20/vmware-vcenter-cve-2026-123890-auth-bypass-exploited-gtig
    surface: "summary"
    kind: frontmatter
    text: "Broadcom's advisory VMSA-2026-0009 of 2026-11-19 fixes CVE-2026-123890, an authentication bypass in the VMware Directory Service of vCenter that needs only network access to vCenter (CVSS 3.1 9.8), with no workaround and, in Broadcom's words, an emergency change. Google Threat Intelligence Group and Mandiant say ARMORY CASTLE, a suspected PRC-nexus actor, exploited it from early September 2026 to move from a compromised remote-support appliance to vCenter, forge administrator SAML sessions and steal guest virtual disks from ESXi; Broadcom's advisory does not state exploitation. Fixed builds are 8.0 U3m, 9.0.2.0200, 9.1.1.0200 and VMware Cloud Foundation 5.2.5, and vCenter 7.0 has no public fix."
  - claim_id: 4b9e58cb78
    entry: 2026-11-20/vmware-vcenter-cve-2026-123890-auth-bypass-exploited-gtig
    surface: "actions[0]"
    kind: frontmatter
    text: "Update every vCenter Server to 9.1.1.0200, 9.0.2.0200 or 8.0 U3m (VMware Cloud Foundation 5.x to 5.2.5 through KB88287) now as an emergency change, and until it is in, drop inbound TCP 2012 to vCenter from every address that is not an allowlisted management host, as Google's hardening guidance lists, because GTIG reports exploitation since early September and Broadcom lists no workaround."
  - claim_id: 78b7c046aa
    entry: 2026-11-20/vmware-vcenter-cve-2026-123890-auth-bypass-exploited-gtig
    surface: "actions[1]"
    kind: frontmatter
    text: "On every vCenter that was reachable from an internal host before the update, list the SSO and local administrators on vsphere.local that nobody created, check the appliance management logs for SSH switched on and off again within minutes, and check ESXi authorized_keys files and hidden directories on VMFS volumes, because the actor extracted the SAML signing key and created accounts and GTIG says patching alone is not sufficient for the vCenter control plane."
