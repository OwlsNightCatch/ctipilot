    entry: 2026-11-18/mitel-micollab-misa-2026-0012-awv-unauth-command-injection
    surface: "summary"
    kind: frontmatter
    text: "Mitel's advisory MISA-2026-0012 of 2026-11-16 covers five flaws in the Audio, Web and Video Conferencing (AWV) component of MiCollab 10.3 (10.3.0.18) and earlier, led by an unauthenticated blind command injection scored CVSS 3.1 10.0 and an unauthenticated XML injection scored 9.0 that could run commands. MITRE has assigned CVE ids to all five (CVE-2026-133323 for the 10.0 injection, CVE-2026-133303 for the XML injection) although Mitel's own page still says none is assigned, Mitel offers a patch through its portal (KB000129195) and says restricting external access to the AWV component reduces the risk, and neither Mitel nor any national authority states exploitation. The 10.3.0.18 release that Mitel named as the fix for its July advisory is itself in the affected range."
