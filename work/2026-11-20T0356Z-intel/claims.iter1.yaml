  - claim_id: 1b04e589d4
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "body"
    kind: cited
    text: "Zammad says SaaS customers need take no action for 7.2.1 because their instances are already patched ("
    urls: ["https://zammad.com/en/product/releases/7-2-1"]
  - claim_id: 990bd54b4d
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "body"
    kind: cited
    text: "), and the 27 advisories of 2026-10-06 list affected versions up to 7.2.0 ("
    urls: ["https://api.github.com/repos/zammad/zammad/security-advisories?per_page=100"]
  - claim_id: 0268b73b3b
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "body"
    kind: cited
    text: "); the two critical ones concern the public sign-up form and accounts with multi-factor authentication configured that never completed email verification ("
    urls: ["https://github.com/zammad/zammad/security/advisories/GHSA-79wh-8g2f-xj2c", "https://github.com/zammad/zammad/security/advisories/GHSA-f3qr-94c2-7mx2"]
  - claim_id: ea0799be6a
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "body"
    kind: cited
    text: "DIVD links a log-check script for the code-execution flaw that searches the Zammad application and nginx logs for error lines carrying session material, a cookie value or a client list, and says to look for unfamiliar processes and files as well ("
    urls: ["https://csirt.divd.nl/DIVD-2026-00015", "https://csirt.divd.nl/downloads/DIVD-2026-00015/cve-2026-102489_ioc_check_script_v2.sh"]
  - claim_id: a1e8b3730e
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "body"
    kind: cited
    text: "Horizon3's public exploit shows the flaw from the attacker's side: a single request to the /ws WebSocket endpoint makes the server return an error carrying every active user's session cookies, so those error log lines are the trace, and an administrator session obtained that way can install a package through the admin interface that writes a template over the password-reset email view, so unexpected packages and overridden view templates in the application directory are the follow-on artifact ("
    urls: ["https://horizon3.ai/attack-research/disclosures/cve-2026-102489-zammad-session-leak-rce/"]
  - claim_id: 2e95b2ef70
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "body"
    kind: cited
    text: "Updating to 7.2.2 closes the escalation but does not show whether it was already used: Zammad's advisory says an attacker holding a foothold as the zammad account could have reached root within seconds ("
    urls: ["https://github.com/zammad/zammad/security/advisories/GHSA-p97w-927q-8vxq"]
  - claim_id: 1e41c2d64e
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "body"
    kind: cited
    text: "More generally, updating does not show whether an instance was already compromised: NCSC-NL asks operators to copy application and network logs before installing the update so the second flaw's use can be investigated later ("
    urls: ["https://www.ncsc.nl/alerts/actief-misbruik-van-zeroday-kwetsbaarheden-in-zammad-update-nu"]
  - claim_id: d7bc725c9e
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "body"
    kind: cited
    text: "For the two critical flaws of 2026-10-06 the advisories' mechanics point to application and authentication logs: sign-ups that carry account attributes the form should ignore, such as an organization membership or a pre-confirmed state, and a session established through an email-verification link with no second-factor step, followed by creation of a personal access token, which outlives the session ("
    urls: ["https://github.com/zammad/zammad/security/advisories/GHSA-79wh-8g2f-xj2c", "https://github.com/zammad/zammad/security/advisories/GHSA-f3qr-94c2-7mx2"]
  - claim_id: 70c83c7a0a
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** upgrade to Zammad 7.2.2 after saving the logs, as Zammad says to upgrade to the latest version immediately ("
    urls: ["https://zammad.com/en/product/releases/7-2-2"]
  - claim_id: 9f14b90729
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "body"
    kind: cited
    text: "): 7.2.2 fixes the root escalation on DEB and RPM installs ("
    urls: ["https://github.com/zammad/zammad/security/advisories/GHSA-p97w-927q-8vxq"]
  - claim_id: 07499e5ccc
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "body"
    kind: cited
    text: "), 6.5 and older receive no regular security fixes ("
    urls: ["https://community.zammad.org/t/take-care-local-privilege-escalation-cve-2026-102490-is-reported-as-being-actively-exploited/21297"]
  - claim_id: 20acaa5ca0
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "body"
    kind: cited
    text: "), with 6.5.5 as an emergency fix for the code-execution flaw on 6.5 only where upgrading is not yet possible ("
    urls: ["https://zammad.com/en/product/releases/6-5-5"]
  - claim_id: 0f7bbe9a1b
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "body"
    kind: cited
    text: "), and 7.2.0 is affected by the advisories published on 2026-10-06 ("
    urls: ["https://api.github.com/repos/zammad/zammad/security-advisories?per_page=100"]
  - claim_id: 5b6d4c8de3
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "body"
    kind: cited
    text: "); treat any internet-reachable instance on 6.3.0 to 6.5.4 since 2026-09-21 as possibly compromised, including the ticket data and anything the host can reach, since NCSC-NL says an attacker can take over the system, read, change or delete data and use it for further attacks ("
    urls: ["https://www.ncsc.nl/alerts/actief-misbruik-van-zeroday-kwetsbaarheden-in-zammad-update-nu"]
  - claim_id: daf697bae3
