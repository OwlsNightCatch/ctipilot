    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "body"
    kind: cited
    text: "NCSC-NL states both flaws have been actively exploited since 2026-09-21, rates likelihood and damage as high, said then that Zammad had released an update for the first flaw only and that the second \"is not yet fixed\" (translated from Dutch) ("
    urls: ["https://www.ncsc.nl/alerts/actief-misbruik-van-zeroday-kwetsbaarheden-in-zammad-update-nu"]
