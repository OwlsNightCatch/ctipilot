    text: "**Detection:** in the vCenter appliance management audit log, SSH switched on and off again within minutes, a new local or SSO administrator, and reads of the Directory Service database, the master key and the PostgreSQL credential file; in network telemetry, sweeps of ports 2012, 5480 and 9080 from a Linux appliance that is not a management host; on ESXi, vpxuser or root SSH logins from the vCenter or an appliance, a new authorized_keys entry and a hidden directory on a VMFS volume ("
