  - claim_id: e2bbea9661
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "body"
    kind: derived
    text: "DIVD lists no process or network indicators, so these follow from the mechanism and from DIVD's account that the attackers reached other services: shells or interpreters as children of the Zammad service account, a privilege change from that account to root, and connections from the ticket host to internal services it does not normally contact."
  - claim_id: 087284fc59
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "section 2026-11-20T05:14:45Z"
    kind: cited
    text: "It says that after obtaining root the attacker used AI agents to continue the attack, which it infers from the volume of payloads and the comments in the attack scripts, and that the attacker was mainly interested in credentials, all of which have been rotated ("
    urls: ["https://csirt.divd.nl/cases/DIVD-2026-00014/"]
  - claim_id: 74c85896fd
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "section 2026-11-20T05:14:45Z"
    kind: cited
    text: "The credential material it touched was a GitLab personal access token that could not reach the internal GitLab, a Slack API key without read permission and the OAuth tokens of two shared mailboxes, used to send test emails with no mailbox-content compromise observed; only the host carrying Zammad was compromised at root level, and because direct outbound traffic from it was impossible the extraction was selective, about 41,000 ticket titles and a limited set of older conversations, 207 volunteer email addresses, two phone numbers and seven profile pictures ("
    urls: ["https://csirt.divd.nl/cases/DIVD-2026-00014/overview_data_investigation/"]
  - claim_id: 94ed373f54
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "section 2026-11-20T05:14:45Z"
    kind: cited
    text: "DIVD's own lesson is response time: its monitoring alert arrived quickly, but it took 19 hours to initiate the first response ("
    urls: ["https://csirt.divd.nl/cases/DIVD-2026-00014/"]
  - claim_id: 5130fc61fd
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "section 2026-11-20T05:14:45Z"
    kind: uncited
    text: "DIVD closed its forensic investigation on 2026-11-18 and updated its case file."
  - claim_id: 789c2666f8
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "record 2026-11-20T05:14:45Z"
    kind: record-summary
    text: "DIVD closed its forensic investigation: the attacker, who used AI agents after reaching root, was mainly after credentials (a GitLab token, a Slack key and shared-mailbox OAuth tokens, none giving further access); about 41,000 ticket titles and a limited set of older conversations left the host, and the first response started 19 hours after the alert."
  - claim_id: 95203c1953
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "summary"
    kind: frontmatter
    text: "The PHP project released 8.5.12, 8.4.27, 8.3.36 and 8.2.35 on 2026-10-21 to fix CVE-2026-109618 and CVE-2026-109619 (CVSS 4.0 9.2), two flaws in the runtime that allow unauthenticated remote code execution as the web worker account, most directly on Apache mod_php, with no upstream release for PHP 8.1 and older; a third path, CVE-2026-115560, was fixed in the regular releases of 2026-11-19. CISA added both flaws to its Known Exploited Vulnerabilities catalog on 2026-10-26, after a honeypot operator documented 35 successful code executions on PHP 8.4.26 under single-worker mod_php and VulnCheck extended its working exploit across builds of PHP 8.2 to 8.5; GreyNoise's sensors have recorded shell sessions since 2026-10-28, Palo Alto Networks' advisory now reports active exploitation against internet-exposed PAN-OS management interfaces, Dream Research recovered a custom build chained with the Linux kernel flaw CVE-2026-46300 that rooted 25 Palo Alto Networks PAN-OS firewall and management servers and attacked a US government-affiliated network, SRF links a data theft at TCS Camping's booking-system supplier to the flaws without naming a CVE, and Unit 42 retracted on 2026-10-25 its update that linked an attack on a European government agency to them. As of 2026-10-22 BACS knew of no attack in Switzerland but said federal PHP applications were affected and that it had no complete overview of the update status, and Swiss cantons, universities, Cyon, the Lodur platform and Publica took sites offline as a precaution."
  - claim_id: 9bd79a845b
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "actions[0]"
    kind: frontmatter
    text: "Update the PHP runtime, not the CMS or its plugins, on every internet-facing server and container image to 8.5.13, 8.4.28, 8.3.37 or 8.2.36 (they carry the October fixes and the follow-up fixes of 2026-11-19) or to your distribution's patched package, restart PHP-FPM, Apache and every long-running worker, rebuild images, and confirm the running version, because a distribution backport can keep the old version string; isolate any application that cannot be updated from public networks until it is."
  - claim_id: 923c0be55e
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "actions[1]"
    kind: frontmatter
    text: "List every appliance and management server whose web interface embeds PHP (firewalls, network access control and security consoles), take each interface off the internet and install its vendor's PHP2Shell fix, because Dream Research reports Palo Alto Networks PAN-OS firewalls rooted through an exposed management interface."
  - claim_id: 03f3cd5c92
