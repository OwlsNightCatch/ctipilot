  - claim_id: cf014c92ba
    entry: 2026-11-20/php-8-5-13-release-fpm-request-smuggling-session-flaws
    surface: "headline"
    kind: frontmatter
    text: "PHP 8.5.13, 8.4.28, 8.3.37, 8.2.36: FPM request smuggling to code execution; the open session flaw is fixed"
  - claim_id: f397059e74
    entry: 2026-11-20/php-8-5-13-release-fpm-request-smuggling-session-flaws
    surface: "summary"
    kind: frontmatter
    text: "The PHP project released 8.5.13, 8.4.28, 8.3.37, 8.2.36 and 8.6.0 on 2026-11-19 with fixes for 18 CVEs. The one reachable without an application bug is CVE-2026-129289: PHP-FPM keeps unread php://input bytes on a persistent FastCGI connection, so an unauthenticated multipart request can plant a second FastCGI request and run PHP code as the worker, but only behind a front end that reuses FastCGI connections, which standard nginx and Apache setups do not. The release also fixes CVE-2026-115560, left open in October, and follow-ups to an incomplete earlier fix; no source reports exploitation or a public proof of concept."
  - claim_id: 24054def60
    entry: 2026-11-20/php-8-5-13-release-fpm-request-smuggling-session-flaws
    surface: "actions[0]"
    kind: frontmatter
    text: "On every PHP-FPM server behind nginx with fastcgi_keep_conn on, Apache mod_proxy_fcgi with enablereuse=on or HAProxy in FastCGI mode, switch FastCGI backend connection reuse off until the server runs 8.2.36, 8.3.37, 8.4.28 or 8.5.13, because CVE-2026-129289 gives an unauthenticated request code execution as the worker wherever a connection is reused and an application path leaves php://input unread."
