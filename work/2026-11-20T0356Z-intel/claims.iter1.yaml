    entry: 2026-11-20/vmware-vcenter-cve-2026-123890-auth-bypass-exploited-gtig
    surface: "body"
    kind: cited
    text: "The flaw is a session-key disclosure over DCE/RPC in the rpc_srp_verifier service on TCP 2012 that yields an authenticated administrator@vsphere.local session; BONESAW then read the Directory Service database, extracted the SAML signing key and created an SSO administrator, SAWSNAKE forged administrator SAML assertions, and the actor switched SSH on through the appliance management API, took the master symmetric key and the PostgreSQL credential file, switched SSH off again, logged in to ESXi hosts, planted an authorized_keys entry and read Windows guest virtual disks, among them the domain database, before copying an archive out over SCP ("
