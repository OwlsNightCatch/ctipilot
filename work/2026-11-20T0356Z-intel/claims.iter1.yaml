  - claim_id: d6cb3b8062
    entry: 2026-11-18/cve-2026-115731-puppet-enterprise-report-deserialization-rce
    surface: "section 2026-11-20T05:12:02Z"
    kind: cited
    text: "); NCSC.ch labels the pair actively exploited with a proof of concept available, and the Reddit intrusion report it rests on describes a CVE-2026-115731 intrusion, so exploitation of CVE-2026-115732 itself is not established ("
    urls: ["https://security-hub.ncsc.admin.ch/#/posts/13204", "https://thehackernews.com/2026/11/hackers-exploiting-critical-puppet-rce.html"]
