    surface: "body"
    kind: cited
    text: "), and treat a DEB or RPM host where code ran as the zammad account as possibly root-compromised, since the upgrade does not undo an escalation already made; keep restricting access to the underlying server to trusted administrators, as Zammad advises ("
    urls: ["https://zammad.com/en/advisories/cve-2026-102489-cve-2026-102490"]
