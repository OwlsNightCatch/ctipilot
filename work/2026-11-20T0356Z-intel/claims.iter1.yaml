    entry: 2026-11-20/mitel-openscape-4000-misa-2026-0013-unauth-cvss-10
    surface: "summary"
    kind: frontmatter
    text: "Mitel's advisory MISA-2026-0013 of 2026-11-18 covers three flaws in the Platform component of OpenScape 4000 and OpenScape 4000 Manager: an unauthenticated improper-authentication flaw and an unauthenticated command injection, both CVSS 3.1 10.0, and a command injection reachable from the adjacent network (9.6). CVE ids have been requested but not assigned; the fix is V11 R2.14, PLT HF5 on V11 R1.26 or a patch for V10 R0.28 to V11 R0.22, and enabling Security Mode restricted access is Mitel's workaround. The advisory says nothing about exploitation, and it is the second critical Mitel advisory in a week."
