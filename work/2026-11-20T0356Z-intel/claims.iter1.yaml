  - claim_id: ec729bc2bd
    entry: 2026-11-20/php-8-5-13-release-fpm-request-smuggling-session-flaws
    surface: "body"
    kind: cited
    text: "The PHP project released 8.5.13, 8.4.28, 8.3.37, 8.2.36 and 8.6.0 on 2026-11-19, and the changelog of each carries the same security block of up to 18 CVEs ("
    urls: ["https://www.php.net/ChangeLog-8.php"]
  - claim_id: e9cc5e83a8
    entry: 2026-11-20/php-8-5-13-release-fpm-request-smuggling-session-flaws
    surface: "body"
    kind: cited
    text: "The one that needs no application bug is CVE-2026-129289: when php://input was opened but not read to the end, PHP-FPM leaves the unread request bytes on a persistent FastCGI connection, so a malformed multipart body can place a second FastCGI request inside the first, and an unauthenticated attacker can bypass front-end routing and execute attacker-controlled PHP code with the privileges of the worker ("
    urls: ["https://github.com/php/php-src/security/advisories/GHSA-qc49-hpvq-g2w6"]
  - claim_id: 6aadd0a3c1
    entry: 2026-11-20/php-8-5-13-release-fpm-request-smuggling-session-flaws
    surface: "body"
    kind: cited
    text: "It requires a front end that enables persistent backend connections and an application path that opens php://input without reading it fully; standard nginx and Apache configurations that close the FastCGI connection after each request are not affected by the demonstrated attack, ("
    urls: ["https://github.com/php/php-src/security/advisories/GHSA-qc49-hpvq-g2w6"]
  - claim_id: a1ba842f0f
    entry: 2026-11-20/php-8-5-13-release-fpm-request-smuggling-session-flaws
    surface: "body"
    kind: cited
    text: "Two session flaws close the item the October release left open: CVE-2026-115560, where upload-progress session data is written in one serializer format and read in another, and CVE-2026-126714, where an interrupted write by the default files handler leaves a mixed old and new session file; both end in object injection and need an object gadget chain in the application ("
    urls: ["https://github.com/php/php-src/security/advisories/GHSA-658j-r8rw-q6mx", "https://github.com/php/php-src/security/advisories/GHSA-fm2m-fjf5-v3cp"]
  - claim_id: bfadca858f
    entry: 2026-11-20/php-8-5-13-release-fpm-request-smuggling-session-flaws
    surface: "body"
    kind: cited
    text: "The fix for the first disables upload progress by default ("
    urls: ["https://github.com/php/php-src/security/advisories/GHSA-658j-r8rw-q6mx"]
  - claim_id: 730ef72b7f
    entry: 2026-11-20/php-8-5-13-release-fpm-request-smuggling-session-flaws
    surface: "body"
    kind: cited
    text: "CVE-2026-129481, a use-after-free of a stale session filename after an interrupted session shutdown, is in PHP's words an incomplete fix for CVE-2026-109619 and affects PHP 8.3 and later, and CVE-2026-129182, for PHP 8.5 only, covers further scenarios after the 8.5.12 fix, with no code execution shown through its entry points ("
    urls: ["https://github.com/php/php-src/security/advisories/GHSA-g3vh-838c-65v7", "https://github.com/php/php-src/security/advisories/GHSA-2fjv-p558-g82m"]
  - claim_id: 0fc773ebb9
    entry: 2026-11-20/php-8-5-13-release-fpm-request-smuggling-session-flaws
    surface: "body"
    kind: cited
    text: "Two more memory flaws need non-default settings: CVE-2026-129474, PHP 8.5 only, needs fatal_error_backtraces=1 with zend.exception_ignore_args=0 ("
    urls: ["https://github.com/php/php-src/security/advisories/GHSA-8mjj-2r7p-4hg2"]
  - claim_id: 73c122c342
    entry: 2026-11-20/php-8-5-13-release-fpm-request-smuggling-session-flaws
    surface: "body"
    kind: cited
    text: "), and CVE-2026-129496 a startup diagnostic written through a file-based error_log in a non-thread-safe build ("
    urls: ["https://github.com/php/php-src/security/advisories/GHSA-gr4f-wgx5-jpfv"]
  - claim_id: 2a3194b258
    entry: 2026-11-20/php-8-5-13-release-fpm-request-smuggling-session-flaws
    surface: "body"
    kind: cited
    text: "CVE-2026-129291, an epoll use-after-free in PHP-FPM, gives root from a worker where catch_workers_output is on, which the official Docker images enable, and the advisory lists no patched version for PHP 8.1.20 to 8.1.34 ("
    urls: ["https://github.com/php/php-src/security/advisories/GHSA-jm4m-qfqx-967m"]
  - claim_id: f436767f13
    entry: 2026-11-20/php-8-5-13-release-fpm-request-smuggling-session-flaws
    surface: "body"
    kind: cited
    text: "NCSC.ch lists exploitation as unknown with no public proof of concept referenced, and watchTowr reports none as of 2026-11-20 ("
    urls: ["https://security-hub.ncsc.admin.ch/#/posts/13212", "https://watchtowr.com/intelligence/php-cve-2026-115560-faq/"]
  - claim_id: 7062ad9249
    entry: 2026-11-20/php-8-5-13-release-fpm-request-smuggling-session-flaws
    surface: "body"
    kind: cited
    text: "**Exposure:** PHP-FPM servers whose front end keeps FastCGI backend connections open (nginx fastcgi_keep_conn on, Apache mod_proxy_fcgi enablereuse=on, HAProxy in FastCGI mode) and whose applications open php://input without consuming it, which the PHP advisory says some frameworks do; standard nginx and Apache setups are outside the demonstrated attack ("
    urls: ["https://github.com/php/php-src/security/advisories/GHSA-qc49-hpvq-g2w6"]
  - claim_id: cb800a872b
    entry: 2026-11-20/php-8-5-13-release-fpm-request-smuggling-session-flaws
    surface: "body"
    kind: cited
    text: "**Detection:** in web and proxy access logs, multipart/form-data requests with a malformed or unterminated boundary to endpoints that read php://input early, followed by PHP execution that no logged request explains; in process telemetry, a shell or network tool spawned by the PHP-FPM worker, the same pattern a worker-level code execution produces ("
    urls: ["https://github.com/php/php-src/security/advisories/GHSA-qc49-hpvq-g2w6"]
  - claim_id: 886c471d32
    entry: 2026-11-20/php-8-5-13-release-fpm-request-smuggling-session-flaws
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** move the PHP runtime, not the CMS or its plugins, to the fixed build of its branch and restart PHP-FPM; where that waits, turn FastCGI connection reuse off ("
    urls: ["https://github.com/php/php-src/security/advisories/GHSA-qc49-hpvq-g2w6"]
  - claim_id: cc0b60a60b
    entry: 2026-11-20/php-8-5-13-release-fpm-request-smuggling-session-flaws
    surface: "body"
    kind: cited
    text: "PHP 8.1 and older are end of life and get no fix for CVE-2026-129291, so those hosts need a supported branch ("
    urls: ["https://github.com/php/php-src/security/advisories/GHSA-jm4m-qfqx-967m"]
  - claim_id: 938214c56f
    entry: 2026-11-20/php-8-5-13-release-fpm-request-smuggling-session-flaws
    surface: "body"
    kind: derived
    text: "The session flaws need an object gadget chain in the application, and the version is shown by `php -v` on the host or in the container image."
  - claim_id: 3267713b8f
    entry: 2026-11-20/f5-big-ip-six-tmm-stack-overflow-flaws-k000164058
    surface: "headline"
    kind: frontmatter
    text: "F5 BIG-IP: six unauthenticated TMM overflows reach code execution via iRule commands or APM; install -ENG builds"
  - claim_id: 644675ea5b
    entry: 2026-11-20/f5-big-ip-six-tmm-stack-overflow-flaws-k000164058
    surface: "summary"
    kind: frontmatter
    text: "F5's security notification K000164058 of 2026-11-18 covers six BIG-IP flaws, each CVSS 3.1 9.8: stack overflows in the Traffic Management Microkernel that an unauthenticated remote attacker can use to crash TMM and that may lead to remote code execution, on virtual servers that run an iRule using GENERICMESSAGE::route, PSC::ip_address, MR::message route, DNS::scrape or PEM::subscriber, or an APM per-request policy. CERT-FR lists fixed builds with an -ENG suffix for BIG-IP 17.1, 17.5 and 21.1; no source reports exploitation, and F5's own bulletin could not be read."
  - claim_id: 4add11af2c
    entry: 2026-11-20/f5-big-ip-six-tmm-stack-overflow-flaws-k000164058
    surface: "actions[0]"
    kind: frontmatter
    text: "Install the fixed build of each BIG-IP branch (17.1.3.6.0.14.20-ENG or 17.1.3.7.0.21.4-ENG, 17.5.1.10.0.80.35-ENG or 17.5.1.11.0.61.12-ENG, 21.1.0.4.0.19.3-ENG) on every BIG-IP whose virtual servers run an iRule that uses GENERICMESSAGE::route, PSC::ip_address, MR::message route, DNS::scrape or PEM::subscriber, or an APM per-request policy, internet-facing units first, and confirm the exact build, not the branch, because six unauthenticated flaws reach remote code execution on the data plane."
