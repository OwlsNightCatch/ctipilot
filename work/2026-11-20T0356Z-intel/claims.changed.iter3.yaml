    surface: "cves[CVE-2026-123894]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-123894\", \"cvss\": \"6.7\", \"status\": [\"patch-available\"], \"affected\": \"VMware Tools for Windows 13.x and 12.3 to 12.5 before the fixed builds (the Q&A names 12.x and 11.x)\", \"fixed\": \"13.1.5.0; 12.5.5 (12.4.10 for 32-bit Windows)\", \"auth\": \"admin-required\", \"vector\": \"local\"}"
  - claim_id: 4f6b5119e2
    entry: 2026-11-20/vmware-vcenter-cve-2026-123890-auth-bypass-exploited-gtig
    surface: "body"
    kind: cited
    text: "**Detection:** in the vCenter appliance management audit log, SSH switched on and then off again, a new local or SSO administrator, and reads of the Directory Service database, the master key and the PostgreSQL credential file; in network telemetry, sweeps of ports 2012, 5480 and 9080 from a Linux appliance that is not a management host; on ESXi, logins as vpxuser or root, a new authorized_keys entry and a hidden directory on a VMFS volume ("
    urls: ["https://cloud.google.com/blog/topics/threat-intelligence/armory-castle-exploits-vsphere/"]
  - claim_id: fb9e13afe7
    entry: 2026-11-20/vmware-vcenter-cve-2026-123890-auth-bypass-exploited-gtig
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** treat the update as an emergency change and plan around vCenter 7.0, which has no public fix; until it is in, GTIG's hardening guidance lists dropping inbound TCP 2012 from non-allowlisted addresses, to be tested first because the port carries SSO traffic ("
    urls: ["https://cloud.google.com/blog/topics/threat-intelligence/armory-castle-exploits-vsphere/", "https://github.com/vmware/vcf-security-and-compliance-guidelines/blob/main/security-advisories/vmsa-2026-0009/README.md"]
  - claim_id: a59042e6e4
    entry: 2026-11-20/php-8-5-13-release-fpm-request-smuggling-session-flaws
    surface: "summary"
    kind: frontmatter
    text: "The PHP project released 8.5.13, 8.4.28, 8.3.37, 8.2.36 and 8.6.0 on 2026-11-19 with fixes for up to 18 CVEs per branch. The most direct is CVE-2026-129289: PHP-FPM keeps unread php://input bytes on a persistent FastCGI connection, so an unauthenticated multipart request can plant a second FastCGI request and run PHP code as the worker, but only behind a front end that reuses FastCGI connections, which standard nginx and Apache setups do not. The release also fixes CVE-2026-115560, left open in October, and follow-ups to an incomplete earlier fix; no source reports exploitation or a public proof of concept."
  - claim_id: a4d97228cd
