  - claim_id: c921b33dbf
    entry: 2026-11-20/vmware-vcenter-cve-2026-123890-auth-bypass-exploited-gtig
    surface: "actions[0]"
    kind: frontmatter
    text: "Update every vCenter Server to 9.1.1.0200, 9.0.2.0200 or 8.0 U3m (VMware Cloud Foundation 5.x to 5.2.5 through KB88287) now as an emergency change, and until it is in, drop inbound TCP 2012 to vCenter from every address that is not an allowlisted management host, as Google's hardening guidance lists, after testing because TCP 2012 is the vCenter SSO control-interface RPC, because GTIG reports exploitation since early September and Broadcom lists no workaround."
