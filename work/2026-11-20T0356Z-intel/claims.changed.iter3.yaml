    surface: "cves[CVE-2026-129481]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-129481\", \"cvss\": \"9.2\", \"status\": [\"patch-available\"], \"affected\": \"PHP 8.3 before 8.3.37, 8.4 before 8.4.28 and 8.5 before 8.5.13, where a fatal error interrupts session shutdown; PHP 8.2 does not carry the affected field\", \"fixed\": \"8.3.37; 8.4.28; 8.5.13; 8.6.0\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
  - claim_id: feaedfc2b9
    entry: 2026-11-20/php-8-5-13-release-fpm-request-smuggling-session-flaws
    surface: "cves[CVE-2026-129474]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-129474\", \"cvss\": \"9.2\", \"status\": [\"patch-available\"], \"affected\": \"PHP 8.5 before 8.5.13 on the built-in defaults (fatal error backtraces on, arguments included) with an application path that enters a magic method and request control over allocation size; php.ini-production sets zend.exception_ignore_args=1 and prevents the attack\", \"fixed\": \"8.5.13; 8.6.0\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
