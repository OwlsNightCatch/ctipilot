    summary: |
      The Ruby project released 4.0.10, 3.4.13 and 3.3.14 on 2026-11-18 to fix seven vulnerabilities, referenced by GitHub advisory id because CVE ids had not been assigned: a one-byte heap overflow in case conversion of strings in single-byte encodings such as ISO-8859-1 and Windows-1252 (GHSA-34m4-m9fh-gqp5), a double free in regexp compilation (GHSA-7x2q-68qv-6p8x), an integer overflow in case conversion causing a heap overflow (GHSA-87fm-7w84-j2px), an out-of-bounds read in case-insensitive regexp matching (GHSA-wpqw-5qxg-m68r), a heap overflow in regexp compilation (GHSA-3p8q-wmhx-vm2w), a heap overflow in Regexp#to_s (GHSA-7whj-cfh7-xgm4) and an out-of-bounds read in case-insensitive backreference matching (GHSA-pvgc-g7gj-pv6h). The project says it is aware of PoCs that prove most of them can be used for remote code execution in some scenarios. Regexp flaws require an application that compiles, matches or stringifies an attacker-controlled pattern; case-conversion flaws require attacker-controlled strings passed to upcase, swapcase, downcase(:fold) or casecmp?. Affected: Ruby 3.3.13 and earlier, 3.4.0 to 3.4.12, 4.0.0 to 4.0.9; Ruby 3.2 and earlier are end of life and unfixed.
