    summary: |
      The existing entry 2026-11-18/cve-2026-115731-puppet-enterprise-report-deserialization-rce covers only CVE-2026-115731 (report deserialisation RCE, on CISA KEV since 2026-11-17). The Perforce advisory, the Neodyme write-up and the NCSC.ch hub post of 2026-11-19 treat it together with CVE-2026-115732 (CVSS 4.0 9.0): a certificate-name authorization bypass in the Clojure trapperkeeper-authorization library, where the ACL matcher zips the reversed host-name segments and stops at the shorter list, so a certificate for evil.target.lab.local authenticates as target.lab.local. With CA autosign enabled (not default, common in provisioning workflows) an attacker can first obtain a certificate for such a non-existent subdomain, download the catalog of the impersonated host (which can carry configuration files with database credentials and API tokens), push forged facts and add exported resources. Perforce and OpenVox patched both on 2026-11-03: Puppet Enterprise and Enterprise Advanced 2026.0.1, 2025.12.1 and 2023.8.13 and Puppet Core 9.1.3 and 8.22.2; OpenVox Agent 9.3.0 and 8.32.0 and OpenVox Server 9.2.0 and 8.18.0 (the OpenVox fix versions are from The Hacker News). Neodyme presents them as two separate paths: the deserialisation bug gives the Puppet service user on the server, from where the CA key can be copied to mint certificates and, with Puppet Enterprise's PXP, run tasks as root on managed nodes (shown in its lab); the name-matching flaw independently yields host impersonation.
