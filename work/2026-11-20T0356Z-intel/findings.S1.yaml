    extended_notes: |
      DEDUP / COMPOSITION NOTE FOR THE MAIN AGENT. The existing entry 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619 carries CVE-2026-115560 as "left unfixed" and tells readers to keep session.upload_progress.enabled=0 until PHP's next regular bugfix release; that statement is now stale (fixed in 8.2.36, 8.3.37, 8.4.28, 8.5.13). CVE-2026-115560 therefore overlaps that entry, so a new entry must list it in references[] (done above), and the old entry deserves a short companion `update` record (CVE-2026-115560 fixed on 2026-11-19; two follow-ups to the CVE-2026-109619 fix; new standing action: update to the 2026-11-19 builds, and keep upload-progress off if unused). Alternative the main agent may prefer: one `update-of:2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619` record carrying all of this; the new-entry shape is recommended because 17 of 18 CVEs are new and the headline flaw (CVE-2026-129289) has its own prerequisites. CVE-2026-115560 is mentioned only in the body (never in cves[] frontmatter) of four existing entries (the October PHP entry and the PAN-OS, Trend Micro and Check Point PHP2Shell entries), so listing it in the new entry's cves[] does not collide with the store's CVE index.
      Detection concepts (telemetry class first): web/proxy access logs: POST bodies with multipart/form-data and an unterminated or malformed boundary to endpoints whose framework opens php://input early (a request that is followed by a second, unlogged FastCGI request cannot be seen in the front-end log; compare FPM access/slow logs and PHP worker process activity against front-end request counts); FPM or CGI child processes spawning shells or other unexpected children (process-creation events with php-fpm/php-cgi/apache parent); changed PHP_ADMIN_VALUE effects (allow_url_include / auto_prepend_file) visible in phpinfo or runtime ini_get audits; FPM workers crashing or respawning in bursts at the start of requests (timezone-cache case); session files in the session directory containing mixed or duplicated serialised segments. Post-patch compromise check: the request-smuggling bug lets an attacker set admin-level INI values that persist on that worker until restart, so restart every FPM pool and Apache worker after the update and review web roots and process trees on hosts that fronted PHP-FPM with connection reuse.
      Hardening levers named by the advisories: leave nginx fastcgi_keep_conn off / Apache enablereuse off (or the HAProxy equivalent); never expose FPM or LSAPI listeners to untrusted networks; zend.exception_ignore_args=1 and/or fatal_error_backtraces=0 in the effective pool config (CLI php.ini alone is not enough); session.upload_progress.enabled=0 and one consistent session.serialize_handler across applications sharing a session store; send PHP errors to syslog or fix startup warnings; disable catch_workers_output in FPM pools; PHP 8.1 and older have no upstream fix (end of life). NCSC.ch's summary additionally lists pm.max_requests=1 in PHP-FPM as a temporary measure at a performance cost; the GHSAs read do not state it.
      Triage: the documented crash trigger of the timezone-cache bug is a request that exceeds max_input_vars on a fresh worker (default value); worker recycling at pm.max_requests or on deploy produces the same restarts, so correlate crashes with request content and an error_log startup diagnostic rather than with restarts alone.
      Recency: php.net changelog dated 2026-11-19; NCSC.ch hub post 2026-11-19T16:09Z; NCSC-NL 2026-11-19T16:26Z; all in window.
