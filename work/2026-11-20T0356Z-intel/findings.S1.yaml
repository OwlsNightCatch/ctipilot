    summary: |
      The PHP project released 8.5.13, 8.4.28, 8.3.37, 8.2.36 and 8.6.0 on 2026-11-19; the php.net ChangeLog of each carries the same security block (18 CVEs on 8.5.13/8.6.0, 14 on 8.4.28, 13 on 8.3.37, 12 on 8.2.36) and the project published a GitHub advisory for 17 of them (CVE-2026-48841 is a bundled uriparser upgrade to 1.0.3). The one reachable without an application bug or a non-default PHP setting is CVE-2026-129289: PHP leaves unread request-body bytes on a persistent PHP-FPM or LSAPI connection when php://input was opened but not read to the end, so a malformed multipart/form-data body can place a second FastCGI request inside the first; the forged request carries its own SCRIPT_FILENAME, REMOTE_ADDR and PHP_ADMIN_VALUE (allow_url_include=1, auto_prepend_file=php://input) and runs attacker PHP as the pool user. It needs a front end that reuses FastCGI backend connections (nginx fastcgi_keep_conn on, Apache mod_proxy_fcgi enablereuse=on, HAProxy FastCGI, LSAPI) and an application path that opens php://input without consuming it (frameworks that do so before routing); the PHP advisory says standard nginx and Apache setups that close the connection after each request are not affected, and dates the flaw to PHP 5.6.0.
      Two session flaws close the open item of the October release: CVE-2026-115560 (upload-progress data written in one serializer format and read in another, object injection) and CVE-2026-126714 (an interrupted write by the default files handler leaves a mixed old/new session file that deserialises into attacker objects); both need an object gadget chain in the application. CVE-2026-129182 and CVE-2026-129481 are follow-ups that PHP ties to the incomplete fix for CVE-2026-109619 (use-after-free of the last_fatal_error_backtrace global, and after an interrupted session shutdown). CVE-2026-129474 affects PHP 8.5 only: its remote path needs fatal_error_backtraces=1 and zend.exception_ignore_args=0, and php.ini-production sets ignore_args=1. CVE-2026-129496 (timezone-cache use-after-free) needs a startup diagnostic written through the file-based error_log path and crashes FPM workers with the default max_input_vars; code execution is demonstrated locally with known addresses. CVE-2026-129291 gives root from an FPM worker when catch_workers_output is on (the official PHP-FPM Docker images enable it). CVE-2026-129538 is php-cgi only (cgi.fix_pathinfo=1, default; FPM and mod_php unaffected). CVE-2026-128090 lets a Phar signature be downgraded from OpenSSL to SHA-256 so a tampered archive loads.
      Exploitation status: NCSC.ch lists it as unknown and watchTowr reports no exploitation in the wild as of 2026-11-20; the PHP advisories describe working demonstrations (root from a www-data worker on unmodified PHP 8.5.12 images; request smuggling needs no memory corruption), but no public PoC is referenced.
    region_nexus: "global; Swiss federal, cantonal and communal web estates and supplier-run PHP hosting; NCSC.ch and NCSC-NL published advisories on 2026-11-19"
