  - title: "Ruby 4.0.10, 3.4.13 and 3.3.14 (2026-11-18): seven memory-safety flaws in the regexp engine and string case conversion with PoCs for RCE, one rated by the project as critical in Rails and classic Sinatra by default; Ruby 3.2 and older get no fix"
    sources:
      - { url: "https://www.ruby-lang.org/en/news/2026/11/18/multiple-vulnerabilities-in-regexp-and-string/", publisher: "Ruby project (ruby-lang.org security announcement)", date: "2026-11-18", role: "primary" }
