    summary: |
      Broadcom published VMSA-2026-0009 on 2026-11-19 (initial advisory, severity Critical) for five flaws in vCenter, SDDC Manager and VMware Tools. CVE-2026-123890 is an authentication bypass in the VMware Directory Service of vCenter (CVSS 3.1 9.8, AV:N/AC:L/PR:N/UI:N): an actor with network access to vCenter can bypass authentication and gain unauthorised access to the system; Broadcom credits Mandiant, lists no workaround and says the vCenter issue qualifies as an emergency change. The other four are authenticated or local: CVE-2026-123891 (SDDC Manager SQL injection, 8.1), CVE-2026-123892 (SDDC Manager command injection, 7.2), CVE-2026-123893 (SDDC Manager local privilege escalation to root, 6.7) and CVE-2026-123894 (VMware Tools for Windows SAML token signature bypass with Guest Alias mapping, 6.7). Fixed vCenter builds from the advisory's response matrix: 9.1.x to 9.1.1.0200, 9.0.x to 9.0.2.0200, 8.0 to 8.0 U3m, VMware Cloud Foundation 5.x to 5.2.5 (async patch guide KB88287), Telco Cloud Platform 3.0/4.x/5.0.x/5.1.x/5.2 and Telco Cloud Infrastructure 3.0 through KB463116; for vCenter 7.0 the matrix says to contact Broadcom Support if you hold an extended support contract (no public fix). SDDC Manager fixes: 9.1.1.0200, 9.0.2.0100, VCF 5.2.5; VMware Tools 13.1.5 and 12.5.5. Exploitation status: Broadcom does not state exploitation, NCSC.ch lists it as unknown; no PoC or exploitation report was found in the window (none of the third-party sources had covered it yet).
