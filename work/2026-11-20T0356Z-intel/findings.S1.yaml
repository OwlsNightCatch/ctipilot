    extended_notes: |
      Single vendor primary (Broadcom PSIRT, Admiralty A for its own product) plus two relays (NCSC.ch, ENISA EUVD) that restate it; no independent third-party analysis existed at fetch time. The earlier vCenter VMSA-2026-0006 (CVE-2026-59309, July) is a different flaw in the same component family (vmdir); the store already carries product:vmware-vcenter-server since 2026-07-19.
      Exposure check: read the vCenter version in the vSphere Client (Help > About) or the appliance management interface (VAMI) and compare with the response matrix; the vulnerable interface is the vCenter server's network-reachable services, so internet-facing or broadly reachable vCenter instances are the exposure. Hardening lever: restrict vCenter management and directory-service ports to a dedicated management network (Broadcom's published ports reference) while patching; there is no vendor workaround.
      Detection concepts: vCenter authentication and SSO (vmdir/identity) logs showing successful directory-service sessions without a matching authentication event; new or unexpected administrator accounts, role assignments, or SSO identity-source changes; vSphere audit events for VM console, snapshot and host-connection actions from unfamiliar sources. Post-patch compromise check: because a bypass yields an authenticated administrative position, review vCenter users, permissions, scheduled tasks, VIB/extension registrations and ESXi host SSH enablement for changes dating from before the patch.
      Triage: legitimate vCenter upgrades and SSO re-configuration by administrators also change identity sources and permissions; the discriminator is the actor, source address and change window, not the event type.
