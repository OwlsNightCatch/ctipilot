    summary: |
      F5's security notification of 2026-11-18 (K000164058, with per-flaw K000163929 to K000163946) covers NGINX (already in the store as the nginx2root entry) and a second, uncovered set for BIG-IP. Six BIG-IP flaws are stack-based buffer overflows in the Traffic Management Microkernel that F5 describes as able to crash TMM and "may lead to remote code execution (RCE)" for a remote unauthenticated attacker, each CVSS 3.1 9.8 (CVSS 4.0 9.3): CVE-2026-116953 (iRule using GENERICMESSAGE::route), CVE-2026-120285 (HTTP profile plus an iRule using PSC::ip_address), CVE-2026-120292 (HTTP profile plus an iRule using MR::message route), CVE-2026-120722 (iRule using DNS::scrape), CVE-2026-121805 (iRule using PEM::subscriber) and CVE-2026-123637 (APM per-request policy containing the Client Information and Endpoint Security agents). F5 states these are data-plane only, with no control-plane exposure, and that versions past End of Technical Support were not evaluated. Further BIG-IP items: CVE-2026-125274 (iControl SOAP CRLF injection, authenticated with at least the Guest role, command execution on the control plane, CVSS 8.8), CVE-2026-120718 (iControl REST tokens that do not expire, 8.1) and four TMM denial-of-service flaws (APM SAML SP, form-based logon page, policytrace key; 7.5). F5 credits Sina Kheirkhah (SinSinology) of watchTowr for the iRule/APM findings, but no watchTowr write-up or exploitation report had appeared at fetch time.
      Affected and fixed (F5 CNA records and CERT-FR): BIG-IP 17.1.x (fixed in 17.1.3.6.0.14.20-ENG and 17.1.3.7.0.21.4-ENG), 17.5.x (17.5.1.10.0.80.35-ENG and 17.5.1.11.0.61.12-ENG), 21.1.x (21.1.0.4.0.19.3-ENG), BIG-IP Next for Kubernetes 2.2.x/2.3.x/2.4.x (BNK-2.2.5-EHF1, BNK-2.3.4-EHF1, BNK-2.4.2-EHF1), BIG-IP Next CNF for some CVEs, BIG-IQ 8.4.x before 8.4.2.3 (CVE-2026-125274). The fixed builds carry the -ENG suffix, which F5 uses for engineering hotfixes, so a plain "latest maintenance release" is not necessarily fixed. NCSC-NL rates likelihood medium and damage high; CERT-FR lists the risk as remote arbitrary code execution, denial of service and policy bypass. Exploitation status: none reported in any source read.
