  - title: "F5 BIG-IP November 2026 security notification (K000164058): six unauthenticated TMM stack-overflow flaws rated CVSS 3.1 9.8 that may lead to remote code execution when specific iRules or APM policies are configured, fixed only in engineering hotfix builds of 17.1, 17.5 and 21.1"
