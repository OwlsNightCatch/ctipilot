- code: F3
  category: claim-not-supported
  section: java4shell-update
  item: "2026-11-18/cve-2026-114938-java4shell-openjdk-avx512-base64-decoder-rce"
  url_or_quote: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-nov2026-java-rce-eCa6ss9z"
  summary: "(low confidence) Frontmatter summary says 'Cisco lists 13 products as affected with no fixed release yet' and the body says 'Cisco lists 13 products, Catalyst Center, Secure Network Analytics and Secure Workload among them, as affected with the fixed release still to be determined ([Cisco, 2026-11-18])'. The cited advisory is now revision 1.2 (2026-NOV-19, 'Updated the status of affected products') and its affected-products table lists 21 products (Smart PHY ... Virtualized Voice Browser) plus Catalyst Center in the priority table, several with a named target release marked (TBD). The entry was updated this run, so the stale count ships on a re-floated entry. Fix: restate the count from revision 1.2 (or drop the number) in summary and body."
- code: F4
  category: hallucinated-fact
  section: ruby-4-0-10
  item: "2026-11-20/ruby-4-0-10-regexp-case-conversion-memory-flaws"
  url_or_quote: "tags: [vulnerabilities, rce, pre-auth, poc-public, patch-available]"
  summary: "(low confidence) Frontmatter tag poc-public overstates the body: the body says Ruby is 'aware of proofs of concept', Veria 'plans to publish a proof of concept ... on 25 November 2026' and NCSC.ch 'Proof of Concepts will become available in a week'; no cited source says a PoC is public, and cves[].status carries only patch-available. Fix: drop poc-public until the 25 November publication, or cite a public PoC."
