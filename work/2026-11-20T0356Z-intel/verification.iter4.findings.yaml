  item: "2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619"
  url_or_quote: "https://www.vulncheck.com/blog/php2shell-vulnerabilities"
  summary: "(low confidence) The VulnCheck page the entry cites for its 2026-10-26 build list also says 'As of November 10, the team has added RCE support for the following older PHP versions ... PHP 7.4.10-7.4.33, PHP 8.0.15-8.0.30, PHP 8.1.10-8.1.34', i.e. the branches with no upstream fix; the entry (touched this run, priority critical) says only that 8.1 and older need a backport. Search: VulnCheck PHP2Shell exploit PHP 8.1 8.0 7.4 support November 10."
