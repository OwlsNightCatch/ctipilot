    summary: |
      Politico's Brussels Playbook reported on 2026-11-19 that a cyber campaign had disrupted the European Commission's internal systems for more than 10 days: the staff HR platform Sysper (payslips, leave, timesheets) and the medical-reimbursement system MyPMO were taken offline as a precaution and restored earlier in the week, Sysper crashed again briefly on 2026-11-18, and internal translation services were hit on 2026-11-17. An anonymous EU official told Politico that CERT-EU detected earlier this month that international hackers used ARTEX, the publicly available AI-driven penetration-testing framework, and that the Commission believes it has contained most of the attack but the full extent of damage is unclear; the Commission's spokesperson said individual systems were targeted and those concerned have been informed. Sources disagree on timing and data impact: heise reports that the spokesperson, at the midday briefing, put discovery on 2026-10-22 and confirmation on 2026-10-26 and said no personal information is known to have left, while Politico's official said investigators were still establishing whether staff data was compromised, and Inside IT (relaying Politico) puts CERT-EU's detection in early November. No source names the initial access vector, and IT-Connect notes it is not established whether ARTEX provided entry or was only used to find weaknesses. Context from the authorities: CERT-EU's 2026-11-05 blog says it observed several threat actors worldwide using ARTEX, maps it to active scanning (T1595), obtained tool (T1588.002) and exploitation of public-facing applications (T1190), and assesses that public availability will accelerate adoption; the FBI's FLASH of 2026-11-13 says actors have used ARTEX since at least August 2026, some intrusions reached privileged access in under three hours, and the framework is strongest against overlooked peripheral systems such as partner and supplier portals, mobile backends, employee applications and legacy services. Whether the Commission's staff-facing HR, medical and translation applications fit that pattern is an analyst observation, not a stated finding.
