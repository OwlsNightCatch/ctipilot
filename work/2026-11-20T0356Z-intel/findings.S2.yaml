    summary: |
      BSI published its annual situation report on 2026-11-19 and rates the German cyber situation 'angespannt bis kritisch' (heise: the first time since 2023), citing AI-enabled attack infrastructure and exploitation attacks. BSI reports 160 new vulnerabilities a day (35 % more than the previous period) and a mean time from disclosure to first known exploitation of 53 days in the previous period, 25 days in this one and only 8 days in the second quarter of 2026, adding that attackers often know a flaw before it is public or a patch exists. The first BSI Cyber Index averages 170 points (up 50 %); within the threat picture the exploitation-attack score, which counts attacks that use flaws in internet-reachable systems to enter networks and then encrypt or exfiltrate data, rose 48 % to 133 points while other mass and targeted attack classes stayed roughly flat, and reconnaissance of internet-facing targets rose 57 %, which BSI links to residential-proxy botnets built from poorly protected Android devices. BSI again names small and medium enterprises and municipalities (Kommunen) as particularly vulnerable targets. heise, reporting the press conference, adds that BSI sees perimeter systems as a likely entry point, observed mostly with Chinese attackers and often through zero-days, while client-side exploits delivered by spear-phishing attachments have become rare, and that BSI urges crypto-agility in all new developments because of store-now-decrypt-later collection. The statistics are BSI's own Germany-specific telemetry; no Swiss figures are given.
    region_nexus: "Germany (neighbouring national authority, BSI); no Swiss data in the report, so the exploitation-window and perimeter-device findings transfer to the Swiss public sector only as an analyst inference"
