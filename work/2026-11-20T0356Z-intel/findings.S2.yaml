  - title: "Canton Zug lifts its 2024 ban on editing 'vertraulich' documents in Microsoft 365 from 2027-03-01, drops the duty to classify every document, and keeps tax data and 'geheim' information out of the platform"
    sources:
      - { url: "https://zg.ch/de/news/2026/November/der-kanton-zug-setzt-microsoft-365-gestuetzt-auf-einen-regierungsratsbeschluss-aus-dem-jahr-2022-als-plattform-fuer-kommunikation-und-zusammenarbeit-ein-eine-weisung-aus-dem-jahr-2024-schraenkt-die-nutzung-jedoch-stark-ein-als-vertraulich-eingestufte-dokumente-duerfen-bisher-nicht-in-microsoft-365-bearbeitet-werden-im-arbeitsalltag-fuehrt-dies-zu-einem-umstaendlichen-wechsel-zwischen-verschiedenen-systemen-und-zu-unsicherheiten-bei-den-mitarbeitenden-der-regierungsrat-hebt-die-weisung-deshalb-auf-ab-dem-1-maerz-2027-gelten-stattdessen-klare-von-den-zustaendigen-stellen-verantwortete-regeln-dokumente-der-stufen-oeffentlich-und-intern-durften-schon-bisher-in-microsoft-365-bearbeitet-werden-neu-entfaellt-zudem-die-pflicht-jedes-dokument-einzustufen", publisher: "Kanton Zug (Finanzdirektion)", date: "2026-11-16", role: "primary" }
      - { url: "https://www.inside-it.ch/zug-will-vertrauliche-daten-verarbeiten-in-m365-20261119", publisher: "Inside IT", date: "2026-11-19", role: "corroborating" }
    discovery_trace: "first seen at: inside-it-ch, URL https://www.inside-it.ch/rss.xml (item https://www.inside-it.ch/zug-will-vertrauliche-daten-verarbeiten-in-m365-20261119) → WebSearch (\"Kanton Zug Regierungsrat Microsoft 365 vertrauliche Daten Weisung aufgehoben Medienmitteilung\") → primary: zg.ch press release, URL as listed in sources"
    summary: |
      The Zug government repeals, with effect from 2027-02-28, its 2024 directive that barred documents classified 'vertraulich' from being edited in Microsoft 365; from 2027-03-01 'clear, binding rules owned by the responsible offices' apply, the duty to classify every document disappears, and documents classed 'öffentlich' and 'intern' were already allowed. Tax data stays in the cantonal tax solution, information classified 'geheim' stays excluded canton-wide, office heads may restrict further especially sensitive holdings under canton-wide criteria, and Microsoft 365 does not replace the records-management system or specialist applications such as the residents' register. The canton's own basis, prepared by the Zuger Polizei in the project 'Modern Workplace' with the IT office and the information-security unit and an external law firm, says the contracts meet data-protection, secrecy and information-security requirements, that data is by default stored in Swiss data centres, that access by foreign authorities under the US CLOUD Act cannot be fully excluded but Microsoft is contractually bound to contest such requests in court, and that the canton rates the risk from cyberattacks and outages as clearly larger and Microsoft 365 as clearly better protected against them, so overall risk falls. The canton says it keeps monitoring the risk and examining an exit, and will address alternatives in its report on the pending motion on digital sovereignty. This is a Zug decision about its own administration; no other canton is bound.
    region_nexus: "Switzerland, canton Zug (cantonal administration)"
    primary_sector_nexus: "direct (cantonal public administration policy)"
    sector: "public-sector"
    cves: []
    techniques: []
    affected_products: ["Microsoft 365"]
    entity_keys: []
    new_entities: []
    verification: SINGLE-SOURCE-OTHER
    confidence: HIGH
    novelty: new
    evidence:
      - { quote: "Der Regierungsrat hebt die Weisung deshalb auf.", attribution: "Kanton Zug", source_url: "https://zg.ch/de/news/2026/November/der-kanton-zug-setzt-microsoft-365-gestuetzt-auf-einen-regierungsratsbeschluss-aus-dem-jahr-2022-als-plattform-fuer-kommunikation-und-zusammenarbeit-ein-eine-weisung-aus-dem-jahr-2024-schraenkt-die-nutzung-jedoch-stark-ein-als-vertraulich-eingestufte-dokumente-duerfen-bisher-nicht-in-microsoft-365-bearbeitet-werden-im-arbeitsalltag-fuehrt-dies-zu-einem-umstaendlichen-wechsel-zwischen-verschiedenen-systemen-und-zu-unsicherheiten-bei-den-mitarbeitenden-der-regierungsrat-hebt-die-weisung-deshalb-auf-ab-dem-1-maerz-2027-gelten-stattdessen-klare-von-den-zustaendigen-stellen-verantwortete-regeln-dokumente-der-stufen-oeffentlich-und-intern-durften-schon-bisher-in-microsoft-365-bearbeitet-werden-neu-entfaellt-zudem-die-pflicht-jedes-dokument-einzustufen" }
      - { quote: "Steuerdaten werden auch künftig nicht mit Microsoft 365 bearbeitet.", attribution: "Kanton Zug", source_url: "https://zg.ch/de/news/2026/November/der-kanton-zug-setzt-microsoft-365-gestuetzt-auf-einen-regierungsratsbeschluss-aus-dem-jahr-2022-als-plattform-fuer-kommunikation-und-zusammenarbeit-ein-eine-weisung-aus-dem-jahr-2024-schraenkt-die-nutzung-jedoch-stark-ein-als-vertraulich-eingestufte-dokumente-duerfen-bisher-nicht-in-microsoft-365-bearbeitet-werden-im-arbeitsalltag-fuehrt-dies-zu-einem-umstaendlichen-wechsel-zwischen-verschiedenen-systemen-und-zu-unsicherheiten-bei-den-mitarbeitenden-der-regierungsrat-hebt-die-weisung-deshalb-auf-ab-dem-1-maerz-2027-gelten-stattdessen-klare-von-den-zustaendigen-stellen-verantwortete-regeln-dokumente-der-stufen-oeffentlich-und-intern-durften-schon-bisher-in-microsoft-365-bearbeitet-werden-neu-entfaellt-zudem-die-pflicht-jedes-dokument-einzustufen" }
      - { quote: "Neu entfällt zudem die Pflicht, jedes Dokument einzustufen.", attribution: "Kanton Zug", source_url: "https://zg.ch/de/news/2026/November/der-kanton-zug-setzt-microsoft-365-gestuetzt-auf-einen-regierungsratsbeschluss-aus-dem-jahr-2022-als-plattform-fuer-kommunikation-und-zusammenarbeit-ein-eine-weisung-aus-dem-jahr-2024-schraenkt-die-nutzung-jedoch-stark-ein-als-vertraulich-eingestufte-dokumente-duerfen-bisher-nicht-in-microsoft-365-bearbeitet-werden-im-arbeitsalltag-fuehrt-dies-zu-einem-umstaendlichen-wechsel-zwischen-verschiedenen-systemen-und-zu-unsicherheiten-bei-den-mitarbeitenden-der-regierungsrat-hebt-die-weisung-deshalb-auf-ab-dem-1-maerz-2027-gelten-stattdessen-klare-von-den-zustaendigen-stellen-verantwortete-regeln-dokumente-der-stufen-oeffentlich-und-intern-durften-schon-bisher-in-microsoft-365-bearbeitet-werden-neu-entfaellt-zudem-die-pflicht-jedes-dokument-einzustufen" }
      - { quote: "Ein Zugriff ausländischer Behörden, etwa gestützt auf den US CLOUD Act, lässt sich nicht vollständig ausschliessen.", attribution: "Kanton Zug", source_url: "https://zg.ch/de/news/2026/November/der-kanton-zug-setzt-microsoft-365-gestuetzt-auf-einen-regierungsratsbeschluss-aus-dem-jahr-2022-als-plattform-fuer-kommunikation-und-zusammenarbeit-ein-eine-weisung-aus-dem-jahr-2024-schraenkt-die-nutzung-jedoch-stark-ein-als-vertraulich-eingestufte-dokumente-duerfen-bisher-nicht-in-microsoft-365-bearbeitet-werden-im-arbeitsalltag-fuehrt-dies-zu-einem-umstaendlichen-wechsel-zwischen-verschiedenen-systemen-und-zu-unsicherheiten-bei-den-mitarbeitenden-der-regierungsrat-hebt-die-weisung-deshalb-auf-ab-dem-1-maerz-2027-gelten-stattdessen-klare-von-den-zustaendigen-stellen-verantwortete-regeln-dokumente-der-stufen-oeffentlich-und-intern-durften-schon-bisher-in-microsoft-365-bearbeitet-werden-neu-entfaellt-zudem-die-pflicht-jedes-dokument-einzustufen" }
    extended_notes: |
      Policy-kind candidate (obligation change for one canton's administration). The primary is dated 2026-11-16, three days before the window start; the in-window source is Inside IT's relay of 2026-11-19, so the item is only inside the horizon through that relay. Analyst inference, not stated by Zug: with confidential documents moving into the cantonal M365 tenant and per-document classification labels no longer required, tenant identity protection becomes the main control for those documents, and label-based DLP rules cannot be assumed to separate 'vertraulich' material; Zug itself says only that it rates cyberattack risk as the larger one and M365 as protecting better. Zug's draft information-security law passed first reading in the government on 2026-07-07 (from search coverage, not fetched), classification rules to follow in a separate directive. Suggested Admiralty A2.
    borderline: true
    borderline_reason: "cantonal policy change with a stated risk assessment, but the defender-side consequence is an analyst inference; primary dated 2026-11-16, only a 2026-11-19 trade-press relay falls inside the window"

  - title: "NGINX nginx2root: Risikomonitor counts 142,895 Swiss nginx servers, 37,768 announcing a version in the vulnerable range and 96,620 hiding their version (Netzwoche, 2026-11-19)"
    sources:
      - { url: "https://www.netzwoche.ch/news/2026-11-19/kritische-nginx-luecken-bedrohen-schweizer-webserver", publisher: "Netzwoche", date: "2026-11-19", role: "primary" }
    discovery_trace: "first seen at: swisscybersecurity-net listing, URL https://www.swisscybersecurity.net/news (item 'Kritische Nginx-Lücken bedrohen Schweizer Webserver', 2026-11-19 14:55) → netzwoche feed, URL https://www.netzwoche.ch/rss.xml → primary (trade-press relay of the Risikomonitor figures; the Risikomonitor release itself was not found by WebSearch)"
    summary: |
      Netzwoche reports on 2026-11-19, citing the Austrian security firm Risikomonitor, that of 142,895 nginx servers recorded in Switzerland, 37,768 announce a version number in the vulnerable range and a further 96,620 do not reveal their version, so Risikomonitor classes 134,388 Swiss servers as potentially affected; across 32 European countries it counts about 9.7 million nginx servers, almost 2.9 million announcing a vulnerable version and 6.4 million with unknown version. Netzwoche itself stresses that the figures are banner-based and cannot say how many servers actually run HTTP/2, which both HTTP/2 flaws need, or already carry a patch, because Linux distributions backport fixes without changing the version string. The article repeats the vendor facts the store already holds (fixed in nginx 1.30.7 and 1.31.9, Rapid7 proof of concept needing about 128 GB of HTTP/2 traffic, CERT-EU: no exploitation known on 2026-11-18).
    region_nexus: "Switzerland (nationwide nginx exposure estimate by an Austrian vendor)"
    primary_sector_nexus: "indirect (all Swiss internet-facing nginx, including public-sector web and reverse-proxy estates)"
    sector: "technology"
    cves: [CVE-2026-123007, CVE-2026-123633]
    techniques: [T1190]
    affected_products: ["NGINX Open Source", "NGINX Plus"]
    entity_keys: ["product:f5-nginx-open-source", "product:f5-nginx-plus"]
    new_entities: []
    verification: SINGLE-SOURCE-OTHER
    confidence: LOW
    novelty: update-of:2026-11-19/nginx-nginx2root-five-unauth-memory-corruption-flaws
    evidence:
      - { quote: "Davon melden 37'768 eine Versionsnummer aus dem verwundbaren Bereich.", attribution: "Netzwoche", source_url: "https://www.netzwoche.ch/news/2026-11-19/kritische-nginx-luecken-bedrohen-schweizer-webserver" }
      - { quote: "Die Zahlen erlauben allerdings keine Aussage darüber, wie viele Server tatsächlich verwundbar sind.", attribution: "Netzwoche", source_url: "https://www.netzwoche.ch/news/2026-11-19/kritische-nginx-luecken-bedrohen-schweizer-webserver" }
    extended_notes: |
      Only delta over the existing entry is the Swiss exposure estimate; it is a version-banner count from a single trade-press relay with no primary release found, and it adds no action beyond the entry's own update-and-restart guidance. Suggested Admiralty C3. Likely a drop; returned only because it is the one Swiss-specific exposure figure in the window.
    borderline: true
    borderline_reason: "single trade-press relay of a banner-based vendor count; no new technical fact, no action beyond the existing entry's guidance"

