  contradictions:
  - S1 summary says exploitation was not stated by any source and none was found in the window; GTIG (published 2026-11-19, before the NCSC.ch hub post at 15:32Z) states exploitation since early September 2026, so the S1 exploitation status is stale and S3's record governs (S3 already carries the cross-domain note).
  - 'S1 attributes ''no workaround'' and ''emergency change'' to Broadcom: confirmed. It does not mention that the Q&A says other compensating controls may exist (generic, no specific control named).'
  - 'S3 says GTIG recommends a post-patch check: GTIG recommends NO post-patch compromise check. Its remediation section names patching, the Mandiant VCSA hardening tool and the vSphere/BRICKSTORM defender guide only. S3''s own ''inference, not a vendor statement'' label is correct and must survive into the entry (no rotation of the STS signing key, master key or PostgreSQL credentials is recommended by GTIG or Broadcom).'
  - S3 states BONESAW exposes 'any vCenter 7.0, 8.0, 9.0 or 9.1'. GTIG states full compromise only for vCenter Server 7.x and 8.x appliances; Broadcom's matrix lists 7.0, 8.0, 9.0 and 9.1 as affected. State GTIG's 7.x/8.x scope as GTIG's, and the matrix as Broadcom's.
  - BleepingComputer writes of the 'victims' virtualized environments' (plural); GTIG describes a single intrusion with one internal vCenter and names no victim sector, country or count. Do not carry 'victims' or any victim class.
  - Within GTIG's own post, the hardening-table row label says TCP 2010 while the row text and the body say TCP 2012 (a typo in the table).
  - Broadcom's matrix lists 5.2.5 as the fixed version for vCenter in VCF 5.x (with KB88287), while the Q&A says to apply vCenter 8.0 U3m through the asynchronous patching process and update SDDC Manager to 5.2.5; both are Broadcom statements, the Q&A names the vCenter build, the matrix the VCF release.
  not_confirmed:
  - A post-patch check from GTIG or Broadcom (none exists, see contradictions).
  - 'Any public PoC or third-party exploitation report for CVE-2026-123890: two WebSearch queries (CVE id plus PoC/Horizon3/watchTowr/GreyNoise) returned nothing for this identifier; the search index may simply lag, so this is absence of evidence only.'
  - 'CISA KEV listing: the bridge''s KEV catalogue (version 2026.11.18) does not list CVE-2026-123890; the run window carries no KEV additions (work/.../kev-window.txt). Re-check later; GTIG''s report could prompt an addition.'
  - 'S3''s reading that GTIG''s SecOps rule names are ''the base64 shell-command rules'': confirmed as 5 rule names (VAMI API SSH Enablement; Base64 Encoded Shell Command Execution; Linux Web Server Process Echo Base64 Encoded String; Suspicious Curl Network Connection to Staging Directory; Suspicious Curl Download to tmp).'
  - The Register article cited by S3 (2026-11-20) was not re-fetched in this pass (outside the assigned primaries); it should not be cited for any fact this record does not also carry from GTIG, Broadcom or BleepingComputer.
  confirmed_absences:
  - 'Broadcom advisory (1.md) and Q&A (2.md): no statement that CVE-2026-123890 is exploited in the wild; grep -i for ''in the wild|actively exploited|being exploited|exploitation'' finds nothing, and the only ''exploited'' in the Q&A concerns CVE-2026-123894''s mechanism.'
  - GTIG names no victim sector, country, number of victims or dwell time beyond 'early September 2026'; it gives no end date of the activity.
  - GTIG gives no CVSS and no statement on whether 9.x vCenter builds were attacked.
  - GTIG recommends no credential, key or certificate rotation after patching.
  additional_findings:
  - 'Detection and hunt list GTIG actually provides (for composing ''Detection''): behaviours with telemetry hooks - VAMI API PUT /rest/appliance/access/ssh enabling SSH then disabling it again (vCenter VAMI logs; GTIG SecOps rule ''VMware vCenter VAMI API SSH Enablement''); creation of a local administrator named sps-<...>@vsphere.local; reads of /storage/db/vmware-vmdir/data.mdb and the vCenter master-key and PostgreSQL password files; nmap-style sweeps for 443/2012/389/5480/9080 from a non-management Linux appliance; base64-encoded shell commands echoed into temp files and gdb attaching to a running process to set SUID on /bin/env (the repeated BeyondTrust-appliance technique); curl downloads into /tmp from the Remote Support appliance; JSP web shells on Linux appliances; Dropbear listeners on 53 or high ports with banner SSH-2.0-pulsesecure_*; Slack API egress (conversations.history, files.getUploadURLExternal) from servers that never use Slack; ESXi root or vpxuser logins from the vCenter or a Linux appliance, a new authorized_keys entry, a hidden ''.a'' directory on a VMFS volume, scp into /vmfs/volumes, tar xzf of vmfs-pydist.tar.gz, python vmfs_browser.py reading guest -flat.vmdk (NTDS, SYSTEM, SECURITY, dns). GTIG also publishes six YARA rules and a login-gated GTI collection of IOCs; do not reproduce IOCs.'
  - 'Defender-relevant operational detail from the Q&A: updating vCenter 8.0 U3m or 9.0.2.0200 blocks later upgrades to VCF 9.1.1 until VCF 9.1.2 (back-in-time, KB 67077); vCenter stays unavailable briefly during the update but workloads keep running; patches are cumulative.'
  reader_unreachable_sources:
  - 'None for the five assigned primaries: Broadcom advisory, Broadcom Q&A (github.com README), GTIG post and BleepingComputer all read with extract (trafilatura-direct). The GTIG HTML tables (hardening table, IOC tables) are not in the extract body and were read from the raw HTML (url --direct) and saved as vcenter/3tables.md.'
  - 'brcm.tech/vmsa-2026-0009-qna not fetched separately: it resolves to the github.com README that was read.'
