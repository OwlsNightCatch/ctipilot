  contradictions:
  - 'S1 (summary and extended_notes) says Mitel ''offers no workaround in the advisory text read''. The advisory HAS a ''Mitigations / Workarounds'' section: ''enabling Security Mode restricted access can be used as a workaround to prevent exploitation of these vulnerabilities'', with details in KB000129263 (login-gated, partner-supplied). S1''s recommendation of ''restrict external access'' borrowed from the MiCollab advisory is therefore not the OpenScape workaround. The entry must carry the workaround and its source.'
  - S1 says 'Mitel states no exploitation'. The advisory contains no statement about exploitation either way (the only occurrences of 'exploited' are 'if successfully exploited' in the description sentences). 'No exploitation stated' is silence, not a Mitel assertion; neither CERT-FR nor BSI states exploitation.
  - 'S1: ''CERT-FR ... its affected-version wording matches Mitel''s''. It does not match exactly: Mitel lists OpenScape 4000 V11 R0.22 through V11 R2.11 and V10 R1.68 and earlier (so V11 R2.12 and R2.13 are not stated either way); CERT-FR says ''versions before V11 R2.14'', ''V10 R0.28 to V11 R0.22 without the latest security patch'' and ''V11 R1.x before V11 R1.26 without PLT HF5''. CERT-FR''s wording is broader and includes patch-state conditions.'
  - 'S1 extended_notes: ''The surface ... normally reachable only inside the telephony network; internet-facing or flat-network exposure is the risk condition''. No fetched source says so: neither Mitel, CERT-FR, nor BSI describes exposure as internal-only. Mitel states only that MTLVULN-1785 and 1786 are unauthenticated (attack vector network, AV:N) and MTLVULN-1793 needs adjacent network access (AV:A). The internal-network framing is S1''s inference (Platform Portal and SSH being access-restrictable via Security Mode is consistent with, but does not prove, an internal-only deployment) and should be labelled as such or dropped.'
  - S1's evidence quote 'Upgrade to OpenScape 4000 version V11 R2.14 or later.' is accurate for the affected-product table; the Solution section additionally lists PLT HF5 for V11 R1.26 and patches for older releases, as S1's summary says.
  not_confirmed:
  - 'CVE ids: none exist as of 2026-11-20 (Mitel: ''requested but not yet assigned''; EUVD search for MTLVULN-1785/1786/1793, OpenScape and product=OpenScape returned total 0; vendor=Mitel since 2026-11-15 returned only MiCollab AWV records; CERT-FR and BSI list no CVE ids).'
  - 'What ''Security Mode restricted access'' restricts in this advisory: the KB (KB000129263) is login-gated. The prior advisory MISA-2025-0001 describes the same setting as ''Restricted access to Platform Portal and SSH of Platform and CSTA''; that this is the same switch for the 2026 flaws is likely but not stated in MISA-2026-0013.'
  - 'Exploitation, public PoC or scanning for these flaws: none found in the sources read; two WebSearch queries returned no coverage of MISA-2026-0013 at all (the search index lags).'
  - 'Whether OpenScape 4000 Manager and the OpenScape 4000 platform are normally internet-exposed: no source states it.'
  - 'Mitel''s affected range stops at V11 R2.11 while the first fixed release is V11 R2.14: the status of V11 R2.12 and R2.13 is not stated.'
