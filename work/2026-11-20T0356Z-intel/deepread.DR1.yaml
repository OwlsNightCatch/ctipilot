  contradictions:
  - 'S1 says ''CVE-2026-129182 and CVE-2026-129481 are follow-ups that PHP ties to the incomplete fix for CVE-2026-109619''. Exact wording differs: GHSA-g3vh-838c-65v7 (CVE-2026-129481) says ''This is an incomplete fix for CVE-2026-109619''; GHSA-2fjv-p558-g82m (CVE-2026-129182) says ''Further scenarios have been discovered'' after the 8.5.12 fix and says the fix ''did not stop later shutdown work from setting it again''. CVE-2026-129182 is PHP 8.5 only; CVE-2026-129481 covers 8.3, 8.4 and 8.5. CVE-2026-115560 is explicitly NOT a follow-up (''separate from the stale global state vulnerability in CVE-2026-109619'').'
  - S1 extended_notes says NCSC.ch lists pm.max_requests=1 as a temporary measure and 'the GHSAs read do not state it'. GHSA-g3vh-838c-65v7 (CVE-2026-129481) does state it ('setting `pm.max_requests=1` and restarting the workers prevents the demonstrated sequence ...'), so for that flaw it is a PHP-stated workaround, not only an NCSC.ch addition.
  - 'S1 lists the HAProxy/LSAPI front ends as enabling the code-execution chain. The GHSA says LSAPI is only desynchronised by the shared cleanup error: ''this advisory does not establish arbitrary code execution through LSAPI''. Code execution is shown for PHP-FPM behind a connection-reusing front end only; the CVE record says ''With LSAPI, subsequent requests on the connection can be disrupted''.'
  - 'S1 states ''the PHP advisory ... dates the flaw to PHP 5.6.0'': the GHSA says ''The affected code has been present since PHP 5.6.0. This is based on code inspection.'' (code inspection, not version testing).'
  - 'S1 summary: ''CVE-2026-129474 affects PHP 8.5 only: its remote path needs fatal_error_backtraces=1 and zend.exception_ignore_args=0, and php.ini-production sets ignore_args=1''. Confirmed, but note the GHSA says fatal error backtraces are ON by default in 8.5 and PHP''s built-in ignore_args default includes arguments, so a PHP without php.ini-production (many container images ship no php.ini) is in the vulnerable default state.'
  - 'S1 says NCSC.ch rates ''unknown'' for exploitation and ''no public PoC referenced'': confirmed verbatim. NCSC.ch also says ''Numeric CVSS scores were not published in the referenced advisories'', whereas the CVE Program (CNA php) records carry CVSS 4.0 numbers (9.2 CRITICAL for the six headline CVEs, 8.8 for CVE-2026-129291, 6.9 for CVE-2026-129538); GitHub advisory pages show a severity label and a CVSS 4.0 vector but no number.'
  - 'S1: CVE-2026-129538 ''php-cgi only (cgi.fix_pathinfo=1, default; FPM and mod_php unaffected)'': confirmed; it is rated Moderate by the GHSA (CVSS 4.0 6.9), unlike the 9.2 group.'
  - 'S1: ''CVE-2026-129291 gives root from an FPM worker when catch_workers_output is on'': confirmed, but it needs code execution inside a worker first (local privilege escalation), and PHP 8.1.20-8.1.34 are affected with ''Patched versions: None'' on the GHSA page.'
  - PHP's own pre-announcement of 2026-11-18 says 'The issues rated CRITICAL require either non-default configuration or uncommon setups.' That is consistent with the GHSAs for the session/UAF flaws; for CVE-2026-129289 the non-default element is on the front end (connection reuse), not in PHP.
  not_confirmed:
  - 'Whether any source states a public PoC for the 2026-11-19 flaws: none found (php.net, the seven GHSAs, watchTowr, NCSC.ch). One WebSearch (''CVE-2026-129289 ... proof of concept exploit'') returned only unrelated 2026 items; absence of evidence only.'
  - 'S1''s claim that 17 of 18 CVEs have a GitHub advisory: GHSA pages were read for 10 (qc49, 658j, fm2m, 2fjv, g3vh, 8mjj, gr4f, jm4m, 5j3f, 68fq); the changelog lists a GHSA for 17 of the 18 entries (CVE-2026-48841 is the uriparser bump). The remaining GHSAs (3mg3, x8r7, q23r, 4646, f6gg, mmf9, mg3p) were not re-read; their facts come from the CNA records.'
  - 'CVE-2026-48841: no CVE Program record returned (HTTP body empty); CVSS and description for the bundled uriparser fix could not be confirmed here.'
  - The October pre-announcement entry's claim of interim 'enforce memory_limit=-1 administratively, a low post_max_size' advice belongs to the 2026-10-21 PHP advisory, which this pass did not re-read.
  additional_findings:
  - 'STORE STATE: state/cves_seen.json already holds CVE-2026-115560 (first_seen/last_seen 2026-10-24, primary_source_url https://www.php.net/archive/2026.php#2026-10-23-1, title ''not fixed by the October releases ... no score or versions published yet''). None of the four entries that mention it carries it in cves[] frontmatter (checked: the October PHP entry, the PAN-OS, Trend Micro and Check Point PHP2Shell entries list only CVE-2026-109618/109619/123039 there), but the state index record is now stale and should be updated rather than duplicated. The other 17 CVEs are absent from entries/ and state/cves_seen.json.'
  - 'EOL branches: the CNA records word the affected range as ''PHP versions before 8.2.36'' for CVE-2026-129289, 115560, 126714, 129496, 128090, 128064, 129292, 129506, 15353 and 129538, i.e. 8.1 and older are affected and there is no upstream fix; CVE-2026-129291 (GHSA page: patched versions None) and CVE-2026-127960 name 8.1.20-8.1.34 and 8.1.32-8.1.34 explicitly. Distribution backports (Debian, RHEL, Ubuntu) are the only route there; no source read states any distribution''s status.'
  - 'Reporting provenance seen on the GitHub advisory pages: six of the ten GHSAs read (CVE-2026-129289, 129481, 129474, 129496, 129291, 129538) carry the banner ''This report was submitted with AI assistance''; the CNA credits for CVE-2026-129289 name Stephan Lipp and David Korczynski (Ada Logics / Anthropic) and Aviral Srivastava as reporters. Not decision-relevant for defenders beyond context.'
  - PHP calls the 2026-11-19 releases part of its regular four-week cycle (pre-announcement of 2026-11-18); the release announcements carry no CVE detail, which sits only in the ChangeLog, the GHSAs and the CVE records.
  - 'Post-patch check: none of the GHSAs names a compromise check. The only related statements are that changed PHP_ADMIN_VALUE settings ''can also remain active for later requests served by the same worker'' (GHSA-qc49-hpvq-g2w6) and that CVE-2026-129182 and CVE-2026-129496 need workers restarted after configuration changes; restarting every FPM pool and Apache worker after updating, and treating hosts whose front end reused FastCGI connections as possibly tainted, is S1''s inference from those sentences, not a PHP statement.'
