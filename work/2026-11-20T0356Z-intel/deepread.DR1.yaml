  contradictions:
  - S1 credits Sina Kheirkhah (SinSinology) of watchTowr 'for the iRule/APM findings'. The CNA records credit him only for CVE-2026-116953, 120285, 120292 and 123637 (spelled 'watchtower' in three records and 'watchTowr' in 123637); CVE-2026-120722 and 121805 are credited to 'F5' alone (finder); CVE-2026-120718 to v3rtical; CVE-2026-125274 to Dan Stefan Alexandru of Pentest-Tools.
  - 'S1''s ''fixed only in engineering hotfix builds'' is SUPPORTED, but scoped: for the eight records CVE-2026-116953, 120285, 120292, 120722, 121805, 123637, 125272 and 126822 the CNA affected range is open-ended (lessThan ''*'') for BIG-IP 17.1.0, 17.5.0 and 21.1.0 and the only ''unaffected'' builds are ENG builds (17.1.3.6.0.14.20-ENG and 17.1.3.7.0.21.4-ENG; 17.5.1.10.0.80.35-ENG and 17.5.1.11.0.61.12-ENG; 21.1.0.4.0.19.3-ENG; Next for Kubernetes BNK-2.4.2-EHF1, BNK-2.3.4-EHF1, BNK-2.2.5-EHF1). Both ENG builds of a branch are listed for every one of those CVEs (two parallel hotfix lines), and CERT-FR repeats the list. CVE-2026-125274, 120718, 121812 and 126336 use ordinary thresholds (BIG-IP <17.1.3.6, <17.5.1.10, <21.1.0.3, or <21.1.0.2 for 120718; the 125274 21.x range starts at 21.0.0; BIG-IQ <8.4.2.3), i.e. regular releases fix those. S1''s wording that these are fixed in ENG builds could be read as covering all twelve; it holds only for the eight open-ended records. The delivery path (how a customer obtains an ENG build) is in F5''s K-articles, which were unreachable.'
  - CVE-2026-120718 (iControl REST token expiry) is 8.1 HIGH under CVSS 3.1 but 9.2 CRITICAL under CVSS 4.0 in F5's CNA record; S1 gives only the 8.1. The six TMM RCE records show CVSS 4.0 9.3; CVE-2026-125274 shows 8.8 (3.1) / 8.7 (4.0); the four APM DoS records 7.5 (3.1) / 8.7 (4.0).
  - 'S1''s ''BIG-IP Next CNF for some CVEs'' is exact: Next CNF 2.2.0-2.4.0 is listed only for CVE-2026-120285, 120722 and 121805; Next for Kubernetes 2.2.0-2.4.0 for 116953, 120285, 120292, 120722 and 121805; CVE-2026-123637 (APM) lists BIG-IP only. S1''s ''BIG-IQ 8.4.x before 8.4.2.3 (CVE-2026-125274)'' also covers CVE-2026-120718 (the same BIG-IQ threshold).'
  - 'CNA record inconsistency: for CVE-2026-121805 (PEM::subscriber) the BIG-IP Next for Kubernetes and Next CNF entries carry the modules ''DNS::scrape iRule Command, DNS'' (apparently copied from CVE-2026-120722) while the BIG-IP entry says ''PEM::subscriber iRule Command, PEM''. The Next-product module prerequisite for 121805 is therefore unclear.'
  not_confirmed:
  - F5's own K-articles (K000164058 and K000163929-K000163946) are unreachable on every transport (JS shell), so every F5 statement here comes from F5's CVE Program (CNA) records, which carry affected ranges, ENG fixed builds, workarounds and credits. Per-CVE K numbers are known only from the CNA records (CVE-2026-116953 K000163941; 120285 K000163939; 120292 K000163940; 120718 K000163929; 120722 K000163945; 121805 K000163946; 123637 K000163937; 125274 K000163936).
  - 'A statement that exploitation has not occurred: the CNA records, CERT-FR and NCSC-NL carry no exploitation statement either way; ''none reported'' is silence in the sources read, not an F5 assertion.'
  - 'Any watchTowr write-up of the iRule/APM flaws: none found at fetch time (not searched beyond the CNA credit).'
  - 'Coverage of the other NGINX CVEs in the same bulletin: CVE-2026-118899 (TLS 1.3 infinite loop, CVSS 3.1 7.5 / 4.0 8.7), CVE-2026-120967 (stream client-certificate verification bypass, 4.8 / 6.3), CVE-2026-120993, CVE-2026-123640 and CVE-2026-125283 (5.3 / 6.9) are in K000164058 and in CERT-FR''s list but not in the nginx2root entry (which carries 113425, 121810, 123007, 123633, 123634) and not in the store at all (grep over entries/ and state/cves_seen.json returned nothing).'
  additional_findings:
  - 'Store check: none of CVE-2026-116953, 120285, 120292, 120722, 121805, 123637, 125274, 120718, 121812, 125272, 126336, 126822 appears in entries/ or state/cves_seen.json (grep -rl returned nothing for each), so a new entry is not blocked by the CVE-overlap check. Not in CISA KEV (catalogue 2026.11.18).'
  - 'NCSC-NL''s CSAF lists 12 BIG-IP CVEs; BSI''s WID-SEC-2026-4665 lists 9; CERT-FR lists 22 including 10 NGINX ones. CWE entries per NCSC-NL: CWE-121, CWE-93, CWE-1463 and CWE-191 (the integer underflow belongs to one of the APM DoS flaws).'
  - 'Exposure anchors from the CNA texts and module fields: virtual servers whose iRules call GENERICMESSAGE::route, PSC::ip_address (HTTP profile; PEM module listed), MR::message route (HTTP profile), DNS::scrape (DNS module listed) or PEM::subscriber (PEM module listed); APM per-request policies containing both the Client Information agent and Endpoint Security agents; for the DoS flaws APM access profiles with a SAML SP agent (encrypted assertions), a form-based Logon Page in a per-request policy, or the tmm.access.policytrace database key enabled. Effect described by F5: TMM terminates and restarts, traffic disrupted.'
  reader_unreachable_sources:
  - 'F5 myF5 K000164058 and per-flaw K000163929-K000163946: extract and url --direct return the myF5 JS shell (736 KB shell, no article text); WebFetch returns only the ''Sorry to interrupt / CSS Error'' shell; jina reader pool exhausted (HTTP 402 on both keys, seen on the NCSC-NL fetch).'
  - 'advisories.ncsc.nl human page (NCSC-2026-0508): JS shell via extract; data read through the CSAF API (ncsc-nl csaf NCSC-2026-0508), which carries the same text.'
  - 'Read successfully: CERT-FR AVI-1567 (extract), BSI WID-SEC-2026-4665 (bsi-csaf), and 21 CVE Program JSON records (url --direct on cveawg.mitre.org; the entry should cite cve.org or the CERT advisories, not the API).'
