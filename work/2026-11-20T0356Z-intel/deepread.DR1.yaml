  contradictions:
  - S1 title says 'one rated by the project as critical in Rails and classic Sinatra by default'. The Ruby project's GHSAs rate THREE flaws Critical (GHSA-34m4, 7x2q, 3p8q), three High and one Moderate (GitHub labels; The Hacker News repeats the split). 'Rails and classic Sinatra exposed by default' is a statement by NCSC.ch, watchTowr and Veria Labs, not by the Ruby project.
  - 'S1 summary: ''The project says it is aware of PoCs that prove most of them can be used for remote code execution''. Exact: the announcement says ''some of them''; the individual advisories claim an RCE PoC for five (34m4, 7x2q, 87fm, 3p8q, 7whj), attacker-controlled memory corruption without RCE for wpqw, and nothing for pvgc.'
  - 'S1 provenance: ''watchTowr and heise (as relayed by watchTowr) call Ruby2Shell and attribute to Veria Labs, while the Ruby advisory itself credits Stephan Lipp (Ada Logics) and Anthropic for that flaw; this attribution difference is unresolved''. It resolves from Veria''s own page: Veria says it ''found this vulnerability independently and was the first to demonstrate remote code execution'', acknowledges the Ruby advisory''s credit for ''reporting the underlying primitive'', and adds Moritz Sanft in collaboration with OpenAI as an additional discoverer. The Ruby announcement credits report of the issue; Veria claims independent discovery and the first working RCE; the name Ruby2Shell is Veria''s. The CVE record has no credits. The per-CVE authority for the id is MITRE (assigner mitre), not the Ruby project, so the CVE id-to-flaw mapping rests on the record''s description and its link to GHSA-34m4.'
  - 'S1: ''the other six GHSA ids may receive CVEs later'' - still true at 2026-11-20 (the GHSA page for 34m4 still reads ''A CVE ID has been requested and is pending'' although the MITRE CVE record exists). ENISA EUVD lists CVE-2026-132825 under GHSA-8452-w857-wpmw, a different GHSA id from the Ruby advisory''s GHSA-34m4-m9fh-gqp5; the CVE record itself links GHSA-34m4.'
  - 'S1 lists GitLab, GitHub Enterprise Server, Mastodon, OpenProject, Discourse and Chatwoot only as products that ''bundle Ruby'' (NCSC.ch). Veria Labs (updated 2026-11-20 04:29 UTC) lists per-product status: GitLab 19.6.0 and earlier, GitHub Enterprise Server 3.22.5 and earlier and Chatwoot 4.20.0 and earlier have NO fixed release (''every current version is vulnerable''); Mastodon (4.7.6, 4.6.12, 4.5.22, 4.4.29), OpenProject (17.9.8, 17.8.3) and the Discourse base image (2.0.20261119-0203) are patched. This is single-source (Veria Labs); The Hacker News notes the Ruby advisories themselves do not say any named product can be attacked. It matters for a public-sector estate running self-hosted GitLab or GitHub Enterprise Server.'
  - 'S1 states exploitation ''none reported as of 2026-11-19 (watchTowr, NCSC.ch: Proof of Concepts will become available in a week)''. Source of the PoC wording: NCSC.ch''s exploitation-status field; its basis is Veria Labs'' plan. Veria''s own page gives a concrete date: a PoC for RCE on stock Rails on 25 November 2026, ''or later if major vendors have not shipped a fix by then''. So the public-PoC date is 2026-11-25 (not ''a week after 2026-11-19'' loosely), and it is a stated plan, not a release.'
  - The CISA-ADP SSVC entry on the CVE record (2026-11-19T18:55Z) says Exploitation none, Automatable no, Technical Impact total.
  not_confirmed:
  - 'That the Rails/classic-Sinatra default exposure is confirmed by an independent source: Veria Labs, watchTowr and NCSC.ch all state it, but NCSC.ch''s text and watchTowr''s FAQ track Veria''s write-up; the Ruby project does not state framework exposure. Treat it as Veria''s assessment relayed by two others.'
  - 'The Veria Labs vendor-status table (GitLab, GitHub Enterprise Server, Chatwoot unfixed): single source; GitLab''s and GitHub''s own advisories were not checked in this pass.'
  - S1's 'PoCs will become available in a week' wording is NCSC.ch's; it is confirmed there and re-grounded in Veria's 25 November 2026 date, but no PoC existed publicly at fetch time (2026-11-20 ~05:00 UTC).
  - heise online (named by watchTowr as the source for the Veria Labs attribution) was not fetched; Veria's own page supersedes it.
