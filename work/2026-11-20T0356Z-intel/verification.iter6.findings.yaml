- code: F3
  category: claim-not-supported
  section: java4shell-update-fields
  item: "2026-11-18/cve-2026-114938-java4shell-openjdk-avx512-base64-decoder-rce, cves[CVE-2026-114938].fixed (changed by this fire's record, fields: cves)"
  url_or_quote: "fixed: \"Oracle builds 17.0.21.1, 21.0.13.1, 25.0.5.1, 27.0.1.1 and 8u513-perf; Cisco Catalyst Center, Secure Network Analytics, Secure Workload and further Cisco products listed in its advisory, which Cisco keeps updating\" (https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-nov2026-java-rce-eCa6ss9z)"
  summary: "The iteration-5 remediation dropped the hedge together with the stale count. In a `fixed` field the Cisco products now read as having fixed builds, but Cisco's rev 1.2 (2026-NOV-19) table says Catalyst Center 'Release No. TBD', Secure Network Analytics '7.6.0 (TBD)', Secure Workload 'Release no. TBD' and 'The Cisco PSIRT validates only the affected and fixed release information that is documented in this advisory'. Fix: restore the qualifier, e.g. '...Cisco Catalyst Center, Secure Network Analytics, Secure Workload and further Cisco products have no fixed release yet (Cisco marks target releases TBD) and Cisco keeps updating its advisory'."
- code: F3
  category: claim-not-supported
  section: php-8-5-13-body
  item: "2026-11-20/php-8-5-13-release-fpm-request-smuggling-session-flaws, body paragraph 3, claim a1ba842f0f"
  url_or_quote: "(low confidence) \"Two session flaws close the item the October release left open: CVE-2026-115560, where upload-progress session data is written in one serializer format and read in another, and CVE-2026-126714, ... ([PHP, 2026-11-19](.../GHSA-658j-r8rw-q6mx); [PHP, 2026-11-19](.../GHSA-fm2m-fjf5-v3cp))\""
  summary: "(low confidence) Adjacency: the clause is terminated by the two GHSA pages, and neither says anything is 'left open' in October (GHSA-658j: 'This is a configuration-dependent deserialization issue, separate from the stale global state vulnerability in CVE-2026-109619'). The fact is true and sits on watchTowr's FAQ, which the entry cites elsewhere: 'PHP disclosed the session serializer mismatch, now tracked as CVE-2026-115560, in an informational advisory published on October 23, 2026 ... planned to fix it in its regular release cycle ... The fix shipped on November 19, 2026'. Same for the summary and title ('left open in October'). Fix: add the watchTowr citation to that clause."
- code: F11
  category: editorial-advisory
  section: zammad-summary
  item: "2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach, summary (changed by this fire, claim 315426d594)"
  url_or_quote: "\"Zammad 7.2.2 (2026-10-08) fixes the root escalation, which affects only DEB and RPM (packager.io), and Zammad 7.2.3 of 2026-11-11, a critical security update, supersedes it installations, and 6.5.5 (2026-10-15) is an emergency fix ...\""
  summary: "Garbled sentence in a reader-facing field: 'supersedes it installations' is an edit residue (a clause lost between 'supersedes it' and 'installations'). The facts hold (Zammad 7.2.3 page: 'a security update that addresses several vulnerabilities'; title 'Critical Security Update'), but the summary should be re-read and the sentence rewritten, e.g. 'Zammad 7.2.3 of 2026-11-11, a critical security update, supersedes it on all installations'."
- code: F11
  category: editorial-advisory
  section: java4shell-older-sections
  item: "2026-11-18/cve-2026-114938-java4shell..., ## Update 2026-11-19 section (previous fire's text; staleness note for the audit)"
  url_or_quote: "\"IOS XE and UCS Central are under investigation\" and \"as of 2026-11-18 Red Hat and Ubuntu had released no fix and Debian had fixed only its unstable branch ... its x86-64 container images tagged 26.8.2-1 and 26.8.2-2 carrying an affected Java build\""
  summary: "Both statements are dated to the previous fire and were true then. Cisco rev 1.2 (2026-NOV-19) now lists IOS XE Software and UCS Central Software as 'Not affected'; Tenable's page now says 'As of November 19, Red Hat has released fixed OpenJDK packages ... Ubuntu released fixes ... on November 18. Debian has fixed openjdk-21 and openjdk-25 in its stable release' and 'Keycloak has updated its 26.8 container images to Red Hat OpenJDK 21.0.13.1'. This fire's 2026-11-20 section does not repeat them; leave to the quality audit (the iteration-5 decline is accepted)."
- code: F11
  category: editorial-advisory
  section: ruby-missed-angle
  item: "2026-11-20/ruby-4-0-10-regexp-case-conversion-memory-flaws, sources and run-record note on the ENISA record (carried over from iteration 5 #8)"
  url_or_quote: "https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-129481 ; run record: \"the ENISA record for CVE-2026-132825 re-read at the main agent lists three references ... and no GitHub reproduction repository\""
  summary: "The note holds only for the top-level `references` field. The same JSON response carries a nested record (GHSA-8452-w857-wpmw, alias of CVE-2026-132825) whose `references` include https://github.com/evenomn/CVE-2026-132825. WebFetch of that repository this iteration: independent 'Ruby2Shell Research', ASAN crash scripts and a glibc heap-corruption script for CVE-2026-132825 and GHSA-87fm-7w84-j2px, 'local, in-process', author states the chain 'has not been executed to code execution yet' and no remote delivery path was built. So the entry's 'no exploitation is reported' stays right, and no weaponised public exploit exists, but a public local crash reproduction does; the entry mentions only Veria's planned PoC. Audit item, not a fix for this fire; the run-record sentence could say 'top-level references'."
- code: F11
  category: editorial-advisory
  section: vcenter-wording
  item: "2026-11-20/vmware-vcenter-cve-2026-123890-auth-bypass-exploited-gtig, headline/summary/title and Detection line"
  url_or_quote: "headline \"vCenter auth bypass exploited since September (GTIG)\"; summary \"exploited it from early September 2026\"; Detection \"in the vCenter appliance management audit log, SSH switched on and then off again, a new local or SSO administrator, and reads of the Directory Service database ...\""
  summary: "GTIG's text is 'ARMORY CASTLE exploited this vulnerability in early September 2026 using BONESAW, according to forensic evidence' and 'BONESAW was executed in early September 2026' in one intrusion; 'since September' / 'from early September' reads as continuing exploitation (BleepingComputer's own wording is 'since September 2026', GTIG's is not). Separately the Detection line's first clause cites GTIG for the telemetry location ('appliance management audit log'); GTIG describes the actor's actions (VAMI PUT /rest/appliance/access/ssh, SSH logins, key reads) but names no log source, so the location is the entry's inference and could carry the 'follows from the mechanism' qualifier used on the other entries."
- code: F11
  category: editorial-advisory
  section: php-exposure
  item: "2026-11-20/php-8-5-13-release-fpm-request-smuggling-session-flaws, Exposure line and cves[CVE-2026-129474].affected"
  url_or_quote: "\"PHP 8.5 without php.ini-production settings is exposed to CVE-2026-129474 on the defaults, when an application path enters a magic method\" (GHSA-8mjj-2r7p-4hg2)"
  summary: "GHSA-8mjj also says 'The demonstrated code execution chain also requires knowledge of usable memory addresses despite address space randomisation' and 'Authentication requirements depend on that path'; the entry's 'confirmed code execution' sentence and the `pre-auth` / `zero-click` fields omit both. Advisory caveat only; the cited sentence itself is accurate."
- code: F11
  category: editorial-advisory
  section: source-dates
  item: "sources[].date drift against the pages' own dates (new this fire)"
  url_or_quote: "Elastic thread cited 2026-11-19 (datePublished 2026-11-18T22:01:58Z, dateModified 2026-11-19T12:30Z); Veria Labs cited 2026-11-20 (datePublished 2026-11-19T03:45Z, dateModified 2026-11-20T07:29Z); watchTowr CVE-2026-115560 FAQ cited 2026-11-20 (page date 2026-11-19, body 'As of November 20')"
  summary: "One-day drifts that match the pages' modified dates, so probably intended as the as-of date; the rule asks for the publication date. Low value; fix only if the entries are touched again."
