    entry: 2026-11-20/vmware-vcenter-cve-2026-123890-auth-bypass-exploited-gtig
    surface: "summary"
    kind: frontmatter
    text: "Broadcom's advisory VMSA-2026-0009 of 2026-11-19 fixes CVE-2026-123890, an authentication bypass in the VMware Directory Service of vCenter that needs only network access to vCenter (CVSS 3.1 9.8), with no workaround and, in Broadcom's words, an emergency change. Google Threat Intelligence Group and Mandiant say ARMORY CASTLE, a suspected PRC-nexus actor, exploited it from early September 2026 to move from a compromised remote-support appliance to vCenter, forge administrator SAML sessions and extract domain-controller data from guest virtual disks on ESXi; Broadcom's advisory does not state exploitation. Fixed builds are 8.0 U3m, 9.0.2.0200, 9.1.1.0200 and VMware Cloud Foundation 5.2.5, and vCenter 7.0 has no public fix."
  - claim_id: a3e79325ec
    entry: 2026-11-20/vmware-vcenter-cve-2026-123890-auth-bypass-exploited-gtig
    surface: "actions[1]"
    kind: frontmatter
    text: "On every vCenter that was reachable from an internal host before the update, list the SSO and local administrators on vsphere.local that nobody created, review the SSO signing material and ESXi authorized_keys files, because the actor extracted the SAML signing key and created accounts, which updating does not undo."
