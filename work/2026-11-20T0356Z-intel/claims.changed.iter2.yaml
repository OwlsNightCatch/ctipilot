    kind: cited
    text: "The flaw is a session-key disclosure over DCE/RPC in the rpc_srp_verifier service on TCP 2012 that yields an authenticated administrator@vsphere.local session; BONESAW then read the Directory Service database, extracted the SAML signing key and created an SSO administrator, SAWSNAKE forged administrator SAML assertions, and the actor switched SSH on through the appliance management API, took the master symmetric key and the PostgreSQL credential file, switched SSH off again, logged in to ESXi hosts, planted an authorized_keys entry and extracted the domain database, registry hives and DNS data from Windows guest virtual disks before copying an archive out over SCP ("
