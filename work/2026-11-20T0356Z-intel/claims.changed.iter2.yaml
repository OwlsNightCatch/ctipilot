    text: "{\"id\": \"CVE-2026-129474\", \"cvss\": \"9.2\", \"status\": [\"patch-available\"], \"affected\": \"PHP 8.5 before 8.5.13 on the built-in defaults (fatal error backtraces on, arguments included); php.ini-production sets zend.exception_ignore_args=1 and prevents the attack\", \"fixed\": \"8.5.13; 8.6.0\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
