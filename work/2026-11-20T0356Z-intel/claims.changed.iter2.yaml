  - claim_id: bd887e1085
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "immediate_action"
    kind: frontmatter
    text: "Update the PHP runtime on every internet-facing host today: Two unauthenticated remote-code-execution flaws in PHP itself are on CISA's exploited list since 2026-10-26, honeypots recorded working code execution and Palo Alto reports attacks on internet-exposed PAN-OS management interfaces, fixed builds have been out since 2026-10-21 (the regular releases of 2026-11-19, 8.5.13, 8.4.28, 8.3.37 and 8.2.36, add follow-up fixes), and public proofs of concept circulate. Update PHP, not the CMS, on every internet-facing server and container image, restart PHP-FPM, Apache and all long-running workers, and confirm the running version, because distribution packages can keep the old version string. Isolate anything that cannot be updated from public networks, and check web roots, logs, crashes and unexpected processes, since an update does not remove an attacker who is already in."
