    entry: 2026-11-20/php-8-5-13-release-fpm-request-smuggling-session-flaws
    surface: "body"
    kind: cited
    text: "The PHP project released 8.5.13, 8.4.28, 8.3.37, 8.2.36 and 8.6.0 on 2026-11-19, and the changelogs list up to 18 CVEs per branch, fewer on the older branches ("
    urls: ["https://www.php.net/ChangeLog-8.php"]
  - claim_id: b6ee5e9ebd
    entry: 2026-11-20/php-8-5-13-release-fpm-request-smuggling-session-flaws
    surface: "body"
    kind: cited
    text: "The most direct is CVE-2026-129289: when php://input was opened but not read to the end, PHP-FPM leaves the unread request bytes on a persistent FastCGI connection, so a malformed multipart body can place a second FastCGI request inside the first, and an unauthenticated attacker can bypass front-end routing and execute attacker-controlled PHP code with the privileges of the worker ("
    urls: ["https://github.com/php/php-src/security/advisories/GHSA-qc49-hpvq-g2w6"]
  - claim_id: 48af05ff8d
    entry: 2026-11-20/php-8-5-13-release-fpm-request-smuggling-session-flaws
    surface: "body"
    kind: cited
    text: "CVE-2026-129481, a use-after-free of a stale session filename after an interrupted session shutdown, is in PHP's words an incomplete fix for CVE-2026-109619 and affects PHP 8.3 and later, and CVE-2026-129182, for PHP 8.5 only, covers further scenarios after the 8.5.12 fix ("
    urls: ["https://github.com/php/php-src/security/advisories/GHSA-g3vh-838c-65v7", "https://github.com/php/php-src/security/advisories/GHSA-2fjv-p558-g82m"]
  - claim_id: 8defa1a95c
