    surface: "body"
    kind: cited
    text: "CVE-2026-129474, PHP 8.5 only, is exposed on the built-in defaults, because fatal error backtraces are on in 8.5 and the default includes arguments, and only php.ini-production, which sets zend.exception_ignore_args=1, prevents the attack; PHP confirmed code execution on 8.5 ("
    urls: ["https://github.com/php/php-src/security/advisories/GHSA-8mjj-2r7p-4hg2"]
  - claim_id: fbf9d04767
