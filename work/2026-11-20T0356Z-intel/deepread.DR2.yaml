  delta_vs_existing_entry:
    new_since_entry: '(1) FORENSICS CLOSED: DIVD says the forensic investigation is complete (entry never says this; DIVD''s 2026-10-09 pages were interim).

      (2) RESPONSE METRICS: MTTD 00:15:11, MTTA 07:20:00, MTTR 11:56:00, MTTC 27:40:00; narrative: alert within minutes, 19 h to first response (2026-09-22), nine further hours to execute containment (about 27 h 40 min total); DIVD''s own lesson is response
      time + not running Zammad 7.x.

      (3) ADVERSARY TIMING: first probe to first breach 11:47:20, breach to root 00:19:01, probe to root 12:06:21 (the entry has only ''root in seconds'' from DIVD''s 2026-10-09 statement; the final metrics give 00:19:01 from first breach to root - the
      two measure different spans and DIVD does not reconcile them, so do not present ''seconds'' and 19 minutes as the same measurement).

      (4) ARTEFACT VOLUME: 990 payloads, 228 output directories, 3,259 files (the basis of the AI-agent inference); second indicator reworded to ''attack agents appear to communicate with one another'' (entry says the scripts carry notes in which the agent
      justifies its own actions).

      (5) TOKEN/CREDENTIAL INVENTORY: GitLab PAT (internal GitLab not reachable), Slack API key (no read permission), OAuth tokens of two shared mailboxes (csirt@, report-abuse@) used to send test emails, no mailbox-data compromise; ''attacker mainly interested
      in credentials; all leaked credentials rotated''.

      (6) FINAL DATA-LOSS FIGURES: ~41,000 ticket titles + limited older conversations; 207 volunteer addresses, 2 phones, 7 profile pictures; 48,928 -> 4,121 personal emails, 316 -> 34 phones, 39 -> 3 street addresses; masked credentials of a small number
      of organisations; TLP:Red/Amber pages leaked (no longer sensitive); only the Zammad host compromised at root level; CVE/CNA environment, scanning signatures, non-weaponised exploits, zero-day research untouched.

      (7) EXFILTRATION LIMITER: no direct outbound traffic from the compromised host made exfiltration selective (entry credits ''network segmentation and incident response'').

      (8) PROCESS: forensic partner Merlon Security; Dutch DPA + NCSC-NL + regulator under the Cyberweerbaarheidswet notified; police report 2026-10-05.

      '
    contradictions_or_tensions_with_entry: '(a) FIXED VERSIONS: DIVD now writes that Zammad ''fixed both vulnerabilities: the first in release 7.2 and the second in release 7.2.2''. The entry (from Zammad''s own statements) says CVE-2026-102489 is exploitable
      only on 6.5 and older, 7.0+ not affected, 7.2.0 hardens the code, and 6.5.5 (2026-10-15) is the emergency fix for 6.5; DIVD''s ''first in release 7.2'' is a simplification and does not mention 6.5.5. Keep the entry''s vendor-sourced matrix; do not
      overwrite it with DIVD''s one-liner.

      (b) REPORTING DATE: DIVD timeline says the vulnerability was reported to Zammad on 2026-09-24; the entry already records Zammad''s statement that it first received a report on the code-execution flaw in August 2026 (different reporter or an earlier
      report; no source reconciles them).

      (c) LIMITER: the entry says ''network segmentation and its incident response stopped them going deeper''; the final overview credits the lack of direct outbound traffic for selective exfiltration and says the host and application were completely
      compromised. Not contradictory but the entry''s sentence should be refined.

      (d) AI-AGENT CLAIM: unchanged as DIVD''s own inference from volume and script comments; still no third-party telemetry; the 10-09 wording (agent ''justifies its own actions'') and the 11-18 wording (''appear to communicate with one another'') differ.

      (e) METRICS: DIVD''s ''Mean Time to Respond 11:56:00'' is a mean across alerts or phases, while the narrative says 19 hours to the first response; the two are not reconciled by DIVD (MTTA 07:20:00 also differs). Quote the narrative figure and the
      table with DIVD''s labels; do not recompute.

      (f) ''IT support systems including our helpdesk'' row: preliminary ''Signs of (partial) data exfiltration found'' but final ''No signs of compromise'' although the Zammad CSIRT ticket system IS compromised; DIVD does not explain the difference (the
      row is the internal IT helpdesk, a different system from the CSIRT Zammad per DIVD''s own category split, but this is an inference).

      '
