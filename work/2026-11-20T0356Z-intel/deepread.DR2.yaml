  delta_vs_existing_entry:
    new_since_entry: '(1) NAMING: CerealLoader (ESET) = BlankPage (Microsoft Defender, RL) = CerealMood (RL, Bitdefender-engine products); ESET''s own generic detections MSIL/Agent.YCA / .YCC; Trend BLANKPAGE, Malwarebytes Trojan.Turla.

      (2) LISTENER CHECK: ''netsh http show servicestate'' for live HTTP.sys listeners and reverse-proxy/load-balancer/WAF logs, because IIS site logs may not show requests handled by an independent HTTP.sys listener (RL''s inference; ESET says HttpListener).

      (3) FIVE PREFIXES: /owa/sdds/, /AUTODISCOVER/PROXYSERVICE/, /AUTODISCOVER/MICROSOFT.EXCHANGE.PROXYSERVICE/, /AUTODISCOVER/INTEGRATED/API/, /MICROSOFT-SERVER-ACTIVESYNC/INTEGRATED/API/ (the entry says only ''OWA, Autodiscover and ActiveSync look-alike
      paths''; ESET white paper lists the same five, so this is a primary-backed detail).

      (4) PROXY-DLL NAMES: version.dll, WTSAPI32.dll, SensApi.dll, dbghelp.dll (plus the wbem names ncobjapi.dll and wbemcomn.dll already in the entry); every export forwards to the genuine System32 DLL.

      (5) MODULE-LOAD REVIEW: WmiPrvSE.exe in addition to EdgeTransport.exe.

      (6) SANDBOX/STATIC: quiet in generic sandboxes; static + multi-engine verdicts better than detonation; earlier file visibility dates (2022-05-11 matches ESET''s own earliest-sample date; 2025-11-18; 2026-03-04) are not evidence of earlier victims.

      (7) YARA FALSE-POSITIVE WARNING (66 hits incl. 60 legitimate Exchange assemblies before the unsigned-file condition).

      '
    not_new: 'Attribution (Turla; ESET high confidence), victims (Kazakh and Romanian government bodies), vector unknown, component roles, no external C2: all ESET''s and already in the entry. RL adds no victim and no vector.'
  contradictions:
  - 'RL''s draft remnants: the published page carries editorial checklist lines (''Confirm that all full-length hashes match the upstream RL repository, that the published YARA syntax compiles in the intended engine...'', ''Use EX1550543 only in separate
    outage communications if necessary. The November 12 Microsoft 365 availability incident should not appear in this malware article without credible evidence of a connection.'') and says the appendix rule is a third revision ''whose Retro run had not
    completed when this draft was prepared''. This signals an unpolished publication; it does not contradict content but lowers confidence in RL''s rule claims. Do not carry RL''s YARA statements as validated.'
  - 'RL''s ''HTTP.sys'' framing vs ESET''s ''HttpListener class'': compatible (HttpListener sits on HTTP.sys) but only RL says HTTP.sys; ESET does not.'
