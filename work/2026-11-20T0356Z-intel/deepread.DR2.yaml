  already_in_artex_entry: 'entries/2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse.md (kind threat, updated_at 2026-11-16T04:29:57Z) ALREADY carries, with these sources cited: (a) CERT-EU 2026-11-05 blog (role primary): "AI-driven
    activity against the EU institutions it protects highly likely involved ARTEX", public availability will likely accelerate adoption, original author withdrew the repo in October (forks independent), maps to active scanning / obtain-tool / exploit-public-facing-application,
    and its guidance (limit exposure, isolate management panels, keep non-severe findings in the remediation cycle); update record 2026-11-08T14:11:58Z. (b) FBI FLASH-2026-1113-001 (2026-11-13, TLP:CLEAR; role primary): variety of actors using ARTEX since
    at least August 2026 against financial services, government, technology, defense and more; privileged access in under three hours in some intrusions; repo withdrawn 2026-10-08; 1,600+ exposed consoles in early November; peripheral systems (partner/supplier
    portals, mobile backends, employee applications, legacy services); the full table of observed techniques (unsigned SAML assertions, XXE, SSRF, anonymous upload, hard-coded admin passwords in SPA bundles, VPN configs, cross-account/B2B trust, JSP/PHP
    web shells, Kudu, Kerberoasting, DCSync, etc.); telemetry list (LLM API calls, sequential enumeration, ARM dry runs, IAM DryRun, DryRun blob writes/deletes, credential additions, .aspx/.jsp in odd paths); recommendations (inventory peripheral apps,
    restrict Kudu/SCM, disable basic publishing auth, ConnectWise app review). Also Microsoft (Storm-0940, Storm-3358), Expel, Wiz, GTIG UNC7228, Check Point, CrowdStrike/Recorded Future TAG-217, Seoul police. The new entry must therefore NOT restate CERT-EU/FBI
    content: cite the ARTEX entry via references[] and carry only (1) the Commission statements, (2) the anonymous-official ARTEX claim, (3) the disagreement on dates and data, (4) what is unknown. Neither the CERT-EU blog nor the FBI FLASH mentions the
    Commission (grep-checked: the FLASH only cites the CERT-EU blog in its reference list; the CERT-EU blog speaks of ''its constituency'', never names the Commission).

    '
