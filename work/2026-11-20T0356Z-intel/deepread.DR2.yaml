  delta_vs_existing_entry:
    new_since_entry: '(1) SECOND CVE: CVE-2026-115732 (CVSS 4.0 9.0), the certificate-name authorization bypass in trapperkeeper-authorization: certificate for evil.target.lab.local authenticates as target.lab.local because the matcher zips the reversed
      host-name segments and stops at the shorter list; needs a CA-signed certificate with a colliding name (autosign OR manual approval); effects: catalog theft (secrets), spoofed facts, exported-resource injection, and in Puppet Enterprise CA administration
      and remote command execution on managed nodes (per Perforce CNA text). Added to the entry''s cves[] and title/summary. (2) NCSC.ch hub post 13204 (published 2026-11-19T10:10Z): pair labelled Actively Exploited / PoC available; recommended temporary
      measures (disable autosign, strong CSR validation, audit issued certificates for suspicious or COLLIDING names, review CA configuration). (3) VERSIONS: Puppet Core 9.1.3 / 8.22.2 (SecurityWeek, THN); OpenVox Agent 9.3.0 / 8.32.0 (115731), OpenVox
      Server and OpenVoxDB 9.2.0 / 8.18.0 (both); open-source Puppet no fix. (4) PE 2026.0.1 release notes now list both CVEs; the stricter auth.conf matching is the fix for the name bug (the entry already carries the wildcard note). (5) EPSS refresh:
      0.00691 vs the entry''s 0.00366 for 115731. (6) The Reddit exploitation report is about a 115731 intrusion on a ''severely misconfigured CA'' (2026-11-04); no weaponisation details.'
    conflicts_or_tensions: '(a) NCSC.ch names OpenVox Agent AND Server as affected by the pair; the OpenVox advisory for the name bug lists Server and OpenVoxDB only; the Agent fix belongs to the deserialization advisory. (b) Exploitation: NCSC.ch''s label
      is for the pair, the evidence it cites concerns 115731, CISA lists 115731 only. (c) CVSS for 115732: Perforce CNA 9.0 vs OpenVox GHSA 9.5. (d) The entry''s PE 2026.0.1 release-notes citation date (2026-11-12) vs the page''s current date 2026-11-19
