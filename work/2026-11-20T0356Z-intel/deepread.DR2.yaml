  entry_already_states: 'entries/2026-11-18/cve-2026-114938-java4shell-openjdk-avx512-base64-decoder-rce.md (kind vulnerability, priority high, updated_at 2026-11-19T05:03:07Z, one update record 2026-11-19): upstream CVE (Oracle CSPU and OpenJDK advisory
    2026-11-17; OpenJDK 17.0.6+, 21, 25, 27; fixed 17.0.21.1, 21.0.13.1, 25.0.5.1, 27.0.1.1 and 8u513-perf; cves[] record has auth: pre-auth, cvss 8.1, epss null); Calif''s chains (pre-auth RCE in Keycloak, Jira, Confluence, Artifactory, Jenkins, PingFederate)
    and its CVSS 4.0 9.2; Immersive claim; AVX-512 VBMI CPU requirement (Ice Lake to Granite Rapids, Zen 4+); CISA alert; NCSC.ch/BACS; Talos; GreyNoise attempts and VulnCheck exploit (via Tenable); Red Hat/Ubuntu/Debian unfixed as of 2026-11-18; Keycloak
    interim mitigation; Cisco 13 products (fix TBD) and Fortinet (investigating); JVM options -XX:-UseBASE64Intrinsics / -XX:UseAVX=2. The entry''s affected_products has OpenJDK, Oracle Java SE, GraalVM and Cisco products only; it carries NOTHING on Elastic,
    Tanzu or Palo Alto Networks. Its pre-authentication framing is qualified in the body (''Pre-authentication reach depends on the application decoding attacker-controlled Base64 ... before it authenticates the caller'', Upwind) but never mentions an
    authenticated-RCE product case.'
  verified_facts:
  - claim: 'ELASTIC (post created 2026-11-18T22:01Z, edited to version 4 on 2026-11-19T12:30Z): Elasticsearch 7.17.3 and later are vulnerable ''with some mitigating factors'': RCE only on affected CPU architectures by an AUTHENTICATED user with at least
      ''read'' access; unauthenticated actors can achieve only denial of service against Elasticsearch nodes.'
    source_url: https://discuss.elastic.co/t/java4shell-remote-code-execution-rce-vulnerability-cve-2026-114938/391703
    file: work/2026-11-20T0356Z-intel/deepread/java4shell/1.md
    passage: Elastic has confirmed that Elasticsearch versions 7.17.3 and later are vulnerable to this CVE, with some mitigating factors. The vulnerability can only be exploited on affected CPU architectures by an authenticated user with at least "read"
      access to achieve Remote Code Execution (RCE) and by unauthenticated actors to achieve Denial of Service (DoS) against Elasticsearch nodes.
  - claim: 'Elastic fix plan for Elasticsearch: bundled JDK 27.0.1.1+4 in the upcoming 8.19.26, 9.4.10, 9.5.7 and 9.6.0 releases (no dates).'
    source_url: https://discuss.elastic.co/t/java4shell-remote-code-execution-rce-vulnerability-cve-2026-114938/391703
    file: work/2026-11-20T0356Z-intel/deepread/java4shell/1.md
    passage: Elastic is also preparing an update to remediate this vulnerability by updating the bundled JDK to 27.0.1.1+4. This is expected to ship with the upcoming 8.19.26, 9.4.10, 9.5.7, and 9.6.0 Elastic releases.
  - claim: 'Elastic Logstash: 8.6.2 and later affected; 7.17.x and before 8.6.2 not affected; API, Ruby plugins and common inputs (Beats, HTTP, TCP) do not use the affected function.'
    source_url: https://discuss.elastic.co/t/java4shell-remote-code-execution-rce-vulnerability-cve-2026-114938/391703
    file: work/2026-11-20T0356Z-intel/deepread/java4shell/1.md
    passage: Elastic has confirmed that Logstash versions 8.6.2 and later are vulnerable to this CVE. Logstash 7.17.x and versions before 8.6.2 are not affected at this time.
  - claim: 'Logstash reach: only through the elastic_integration filter AND an ingest pipeline that decodes Base64 from an untrusted source; impact for unauthenticated senders is denial of service (the Logstash section later says ''The result is a crash,
      not code execution'').'
    source_url: https://discuss.elastic.co/t/java4shell-remote-code-execution-rce-vulnerability-cve-2026-114938/391703
    file: work/2026-11-20T0356Z-intel/deepread/java4shell/1.md
