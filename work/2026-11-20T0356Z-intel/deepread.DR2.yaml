  materiality_verdict: 'MODERATE. New downstream vendor product impact and fixes (three vendors) with one framing-relevant fact for readers who run the Elastic stack (RCE needs authentication, unauthenticated reach is DoS), plus concrete fixed builds for
    Tanzu and PAN. No change to exploitation status (no vendor of the three states in-the-wild exploitation; PAN says it is not aware). Note the S1 item underreports Tanzu: the advisory now lists released fixes on 2026-11-18 and 2026-11-19, not only ''still
    being assessed''.'
