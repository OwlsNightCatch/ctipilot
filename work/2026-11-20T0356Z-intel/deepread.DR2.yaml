      Server, ECK operator, Maps Server not affected (no Java); fix versions announced 8.19.26 / 9.4.10 / 9.5.7 / 9.6.0 (bundled JDK 27.0.1.1+4; Logstash default flag) with no dates; ECE 4.2.2 / 3.8.7 pending; Serverless hot-fixed 2026-11-18; ECH about
