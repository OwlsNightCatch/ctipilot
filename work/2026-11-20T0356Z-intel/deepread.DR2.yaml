  entry_detection_line_already_states: 'Detection line: file-integrity telemetry on the Exchange host for DLLs in the System32 wbem directory and .NET native image cache files that do not match the Microsoft originals; module telemetry for non-Microsoft
    assemblies loaded into EdgeTransport.exe while Get-TransportAgent lists nothing new; web-server logs for requests to the Outlook Web Access, Autodiscover and ActiveSync look-alike paths from clients with no matching mailbox flow, whose encrypted bodies
    return a generic error page; Exchange Web Services mailbox retrievals made from the server''s own context; with no external C2 and no known entry vector, a compromise assessment of every internet-facing Exchange server. Body adds: CerealLoader placed
    in System32 wbem (ncobjapi.dll, wbemcomn.dll, loaded by WMI) and the .NET native image cache; CerealBox injected into EdgeTransport.exe wraps transport agents (no new agent in configuration); CerealNeuron passive listener, encrypted requests, bad requests
    get an Exchange-looking error page; no external C2 found. Triage line: third-party anti-spam/DLP/archiving transport agents are vendor-signed and appear in the transport-agent configuration, which CerealBox does not; the native image cache regenerates
    legitimately after .NET updates. Action: compare ncobjapi.dll, wbemcomn.dll and the Microsoft.Exchange .ni.dll files with Microsoft originals and list non-Microsoft assemblies loaded into EdgeTransport.exe.

    The entry does NOT contain: vendor-name synonyms (BlankPage, CerealMood, the Microsoft/Bitdefender-engine/Trend/Malwarebytes labels, ESET''s MSIL/Agent.YCA / .YCC names), the HTTP.sys listener check or any reverse-proxy/WAF log advice, the five CerealNeuron
    URL prefixes, the proxy-DLL names version.dll / WTSAPI32.dll / SensApi.dll / dbghelp.dll, WmiPrvSE.exe module-load review, the native-image-cache names Microsoft.Exchange.Search.Mdb.ni.dll / EdgeTransport.ni.exe, RL''s sandbox/static findings, the
    earlier-file-visibility dates (2022-05-11, 2025-11-18, 2026-03-04), or RL as a source (grep-checked: no ''ReversingLabs'' in the entry).

    '
  verified_facts:
  - claim: 'RL''s scope statement: 12 related loader files (six of ESET''s 11 listed CerealLoader samples, two additional WTSAPI32.dll candidates, four byte-different copies); the work extends searchable artefacts and does not establish additional victims
      or a new initial-access method.'
    source_url: https://www.reversinglabs.com/blog/inside-turlas-cereal-12-exchange-loaders-older-traces-and-new-ways-to-hunt
    file: work/2026-11-20T0356Z-intel/deepread/turla-rl/1.md
    passage: 'We identified 12 related loader files: six of the 11 CerealLoader samples on ESET’s published indicator list, two additional WTSAPI32.dll candidates, and four byte-different copies of already documented builds. The work extends the artifacts
      defenders can search for; it does not establish additional victims or a new initial-access method.'
  - claim: 'VENDOR-NAME SYNONYMS (RL): BlankPage, CerealMood and CerealLoader can describe the same files; a single-family-name hunt can miss matches.'
    source_url: https://www.reversinglabs.com/blog/inside-turlas-cereal-12-exchange-loaders-older-traces-and-new-ways-to-hunt
    file: work/2026-11-20T0356Z-intel/deepread/turla-rl/1.md
    passage: BlankPage, CerealMood and CerealLoader can describe the same files. A single-family-name hunt can miss matches.
  - claim: 'Who calls it what (RL): ESET uses CerealLoader for the loader component and its own products detect these files under generic names MSIL/Agent.YCA and MSIL/Agent.YCC; RL''s threat names include BlankPage and CerealMood; other engines add BLANKPAGE
      and Trojan.Turla.'
    source_url: https://www.reversinglabs.com/blog/inside-turlas-cereal-12-exchange-loaders-older-traces-and-new-ways-to-hunt
    file: work/2026-11-20T0356Z-intel/deepread/turla-rl/1.md
    passage: ESET’s own products detect these files under the generic names MSIL/Agent.YCA and MSIL/Agent.YCC. RL’s threat names for samples in the same cluster include BlankPage and CerealMood, and other engines apply further labels, among them BLANKPAGE
      and Trojan.Turla.
  - claim: 'Per-vendor label detail (RL, point-in-time snapshot November 10-13): Microsoft Defender BlankPage variants, Trend Micro BLANKPAGE, Malwarebytes Trojan.Turla, two Bitdefender-engine products Generic.CerealMood before moving to a generic label.'
    source_url: https://www.reversinglabs.com/blog/inside-turlas-cereal-12-exchange-loaders-older-traces-and-new-ways-to-hunt
    file: work/2026-11-20T0356Z-intel/deepread/turla-rl/1.md
    passage: Microsoft Defender reports Backdoor:MSIL/BlankPage.E!dha, Trend Micro reports Trojan.MSIL.BLANKPAGE.USBLKB26 and Malwarebytes reports Trojan.Turla, while two products built on the Bitdefender engine reported Generic.CerealMood before moving
      to a generic label. Across the cluster, Microsoft applies BlankPage variants .C, .E and .F, and RL’s family names follow that antivirus consensus.
  - claim: 'HTTP.sys LISTENER CHECK (RL''s own guidance): check live HTTP.sys listeners with ''netsh http show servicestate'' and inspect reverse-proxy, load-balancer and WAF logs for the five reported CerealNeuron paths, because IIS site logs alone may
      not show requests served by an independent HTTP.sys listener.'
    source_url: https://www.reversinglabs.com/blog/inside-turlas-cereal-12-exchange-loaders-older-traces-and-new-ways-to-hunt
    file: work/2026-11-20T0356Z-intel/deepread/turla-rl/1.md
    passage: Check live HTTP.sys listeners with netsh http show servicestate, and inspect reverse-proxy, load-balancer and WAF logs for the five reported CerealNeuron paths. IIS site logs alone may not show requests served by an independent HTTP.sys listener.
  - claim: ESET (white paper) says CerealNeuron uses the HttpListener class with URL prefixes and relies on an operating-system-level TLS binding; ESET's text does not use the term 'HTTP.sys' (grep-checked in both ESET pages). The HTTP.sys inference is
      RL's own technical reading of the same mechanism.
    source_url: https://web-assets.esetstatic.com/wls/en/papers/white-papers/turla-cereal-tricks.pdf
    file: work/2026-11-20T0356Z-intel/deepread/turla-rl/3.md
    passage: HttpListener
  - claim: 'FIVE CerealNeuron URL PREFIXES: RL lists them in its appendix; ESET''s white paper lists the same five as ''All of the prefixes that we have observed'' (ESET''s blog lists three ''among the paths we observed''). The RL list: /owa/sdds/, /AUTODISCOVER/PROXYSERVICE/,
      /AUTODISCOVER/MICROSOFT.EXCHANGE.PROXYSERVICE/, /AUTODISCOVER/INTEGRATED/API/, /MICROSOFT-SERVER-ACTIVESYNC/INTEGRATED/API/ (HTTPS 443; normalise case). These are paths on the victim''s own Exchange server, not attacker infrastructure; whether to
