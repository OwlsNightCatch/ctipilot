- code: F3
  category: claim-not-supported
  section: ruby-4-0-10-regexp-case-conversion-memory-flaws
  item: "Ruby 4.0.10, 3.4.13 and 3.3.14: seven memory-safety flaws ... (CVE-2026-132825)"
  url_or_quote: "Veria lists GitLab 19.6.0 and earlier, GitHub Enterprise Server 3.22.5 and earlier and Chatwoot 4.20.0 and earlier as having no fixed release and Mastodon, OpenProject and the Discourse base image as patched"
  summary: "The live Veria page (https://verialabs.com/ruby2shell/, 'Updated 20 November 2026 at 06:00 UTC') now lists GitLab as 'GitLab | 19.6.0 and earlier | 19.6.1, 19.5.8 | Patched'; only GitHub Enterprise Server (3.22.5 and earlier) and Chatwoot (4.20.0 and earlier) still show 'None / Vulnerable'. The saved 04:29 UTC copy said GitLab had no fix, so the sentence was right at composition and the cited page has since moved. GitLab is the product a Swiss public-sector SOC is most likely to run; correct the sentence to the current table (GitLab 19.6.1 / 19.5.8 patched per Veria) and re-read the page just before publish."
- code: F4
  category: hallucinated-fact
  section: zammad-cve-2026-102489-102490-exploited-divd-breach
  item: "CVE-2026-102489 / CVE-2026-102490, Zammad helpdesk ... (cves[CVE-2026-102489].fixed, actions[0], Defender takeaway)"
  url_or_quote: "7.2.2 (2026-10-08) is the current release  |  upgrade it to Zammad 7.2.2 (7.2.0 is affected by the 27 advisories Zammad published on 2026-10-06)  |  **Defender takeaway:** upgrade to Zammad 7.2.2 after saving the logs"
  summary: "Zammad released 7.2.3 on 2026-11-11 (https://zammad.com/en/product/releases/7-2-3, title 'Zammad 7.2.3: Critical Security Update') and published 43 GitHub advisories the same day, every one with vulnerable range '<= 7.2.2' and patched version '7.2.3', two rated critical (GHSA-pv63-rf47-cj6r unauthenticated administrator creation during a migration; GHSA-9x94-gcq4-jjgw privileged headers reintroduced via encrypted or signed mail) and ten high. The entry's own cited source https://api.github.com/repos/zammad/zammad/security-advisories?per_page=100 now lists them. The frontmatter says 7.2.2 'is the current release' and the first action and the takeaway tell defenders to upgrade to 7.2.2, which is itself an affected build. The run touched this priority-high entry this fire, so the stale target ships to readers; replace with 7.2.3 (or later) and say why 7.2.2 is no longer the target."
- code: F3
  category: claim-not-supported
  section: php-8-5-13-release-fpm-request-smuggling-session-flaws
  item: "PHP 8.5.13 ... CVE-2026-129291"
  url_or_quote: "CVE-2026-129291, an epoll use-after-free in PHP-FPM, gives root from a worker where catch_workers_output is on"
  summary: "(low confidence) GHSA-jm4m-qfqx-967m says 'execute commands with the privileges of the FPM master, which commonly runs as root' and 'If the master runs as an unprivileged user, successful exploitation is limited to that user's privileges'; NCSC.ch: 'yields root command execution when the FPM master runs as root'. The sentence drops the root-master condition (and the epoll backend and worker-lifetime prerequisites) and states root unconditionally. Suggested wording: 'gives the privileges of the FPM master, commonly root, to code already running in a worker'."
- code: F14
  category: quantifier-without-source
  section: php-8-5-13-release-fpm-request-smuggling-session-flaws
  item: "PHP 8.5.13 ... CVE-2026-129474"
  url_or_quote: "and only php.ini-production, which sets zend.exception_ignore_args=1, prevents the attack"
  summary: "(low confidence) GHSA-8mjj-2r7p-4hg2 says php.ini-production sets zend.exception_ignore_args=1 and prevents the attack path, and also 'On PHP 8.5 and later, setting fatal_error_backtraces=0 also prevents this attack path' and lists zend.exception_ignore_args=1 as the immediate workaround in the workers' configuration; NCSC.ch lists both settings. 'only' is the entry's own quantifier and the source names more than one preventing setting. Reword to 'php.ini-production prevents it, as does setting either option explicitly'."
- code: F10
  category: missed-angle
  section: coverage
  item: "Zammad 7.2.3 critical security update of 2026-11-11 (43 advisories, 2 critical, 10 high; vulnerable range <= 7.2.2)"
  url_or_quote: "https://zammad.com/en/product/releases/7-2-3 ; https://github.com/zammad/zammad/security/advisories/GHSA-pv63-rf47-cj6r"
  summary: "No entry or changelog record in the store covers the 2026-11-11 Zammad release; the store's only Zammad entries are the 2026-10-02 exploited-flaw entry (which this run updated) and a June BSI entry. Zammad is common in public-sector helpdesks and the existing entry is priority high. Add an update record on the 2026-10-02 Zammad entry (not a new entry). Suggested search: 'Zammad 7.2.3 security release GHSA-pv63-rf47-cj6r GHSA-9x94-gcq4-jjgw'."
- code: F11
  category: editorial-advisory
  section: zammad-cve-2026-102489-102490-exploited-divd-breach
  item: "updates[2026-11-20T05:14:45Z].summary"
  url_or_quote: "DIVD closed its forensic investigation: the attacker, who used AI agents after reaching root, was mainly after credentials"
  summary: "The body section was corrected to 'completed its forensic investigation and updated its case file on 2026-11-18' but the record summary still says 'closed'. DIVD's case page says 'The forensic investigation of the breach has been completed' while its Status field reads 'Open' and 'We will update this page when we have more information', so 'closed' can be read as the case being closed. Align the summary with the section ('completed')."
- code: F11
  category: editorial-advisory
  section: mitel-openscape-4000-misa-2026-0013-unauth-cvss-10
  item: "Exposure line and entities"
  url_or_quote: "the advisory does not say which of its interfaces are normally reachable. ([Mitel, 2026-11-18](https://www.mitel.com/support/security-advisories/mitel-product-security-advisory-misa-2026-0013))."
  summary: "Typography: a full stop closes the clause before the citation parenthesis, so the ledger reads the citation as detached. Also `entities: []` although the registry carries product:mitel-openscape-4000 and product:mitel-openscape-4000-manager (first_seen 2026-11-20, listed in the run record's entities_added); an entry that registers the product keys should link them."
- code: F11
  category: editorial-advisory
  section: php-8-5-13-release-fpm-request-smuggling-session-flaws
  item: "cves[CVE-2026-126714].auth and cves[CVE-2026-129481].auth"
  url_or_quote: "auth: pre-auth"
  summary: "GHSA-fm2m-fjf5-v3cp says 'Authentication requirements depend on how the application exposes the affected session operations' and GHSA-g3vh-838c-65v7 says 'Authentication requirements depend on the application path that reaches the failing cleanup'. The CNA vectors are PR:N, which supports the field, and the body makes no auth claim for either, so this is advisory only; the earlier iteration's remediation (application conditions in `affected`) stands."
