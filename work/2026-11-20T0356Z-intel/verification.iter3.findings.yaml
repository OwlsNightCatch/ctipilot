- code: F11
  category: editorial-advisory
  section: usi-lugano-online-forms-vulnerability-exploited
  item: "body length for a routine incident"
  url_or_quote: "USI said on 2026-11-19 that unauthorised third parties had access to data held on one of its applications ..."
  summary: "A routine incident with no named product, vector detail or actor is meant to be two sentences at most; the body is one three-sentence paragraph plus the takeaway. The Swiss public-sector nexus justifies keeping it; consider trimming the second sentence."
