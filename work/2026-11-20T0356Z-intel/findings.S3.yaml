    discovery_trace: "first seen at: outside-slice standing check, mandiant-gtig feed https://feeds.feedburner.com/threatintelligence/pvexyqv7v0v (item 'ARMORY CASTLE Exploits vSphere', 2026-11-19T14:00Z) → primary (no pivot needed): https://cloud.google.com/blog/topics/threat-intelligence/armory-castle-exploits-vsphere/ → pivot: GTIG's own link to Broadcom VMSA-2026-0009, URL https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/SecurityAdvisories/0/39495 → Broadcom Q&A (brcm.tech/vmsa-2026-0009-qna, resolves to the github.com/vmware README above) → corroboration: BleepingComputer URL above and The Register URL above (found in THN/BC/Register feed scans, https://www.theregister.com/security/headlines.atom)"
    summary: |
      Mandiant and GTIG report that ARMORY CASTLE (formerly UNC5221; suspected PRC-nexus, registry actor:verdantbamboo) continued its BeyondTrust Remote Support zero-day intrusion (CVE-2026-102764, GTIG report of 2026-10-15) with a second zero-day. CVE-2026-123890 is an unauthenticated flaw in the vCenter Directory Service (vmdir) DCE/RPC interface (rpc_srp_verifier service on TCP 2012): the SRP session key can be recovered without a password, which yields an authenticated administrator@vsphere.local session and access to the vmdir LMDB (data.mdb). Broadcom fixed it on 2026-11-19 in VMSA-2026-0009 (CVSS 9.8, no workaround, credits Mandiant); the advisory itself does not say it is exploited, and BleepingComputer notes Broadcom has not confirmed exploitation, so the exploitation claim rests on Mandiant and GTIG.
      GTIG says the Go utility BONESAW ran against an internal vCenter already patched for CVE-2026-59309 in early September 2026, and that its build timestamp (2026-07-13) predates that earlier flaw's disclosure by 16 days, with the caveat that Go build metadata can be altered. The actor reached vCenter from the compromised Remote Support appliance through EDR-less internal Linux appliances: it scanned for VMware ports (2012, 5480, 9080), forced SUID on /bin/env via gdb to reach root, dropped the JSP web shells SLIMSAVAGE (command execution) and CAGEMATCH (file staging), and later the Dropbear-based BEARBONES backdoor (password bypass, credential logging) and the Slack-C2 backdoor LAZYBONES (also seen in the 2025 Ivanti CVE-2025-22457 intrusions).
      With BONESAW the actor read the vmdir LMDB and created an SSO administrator (the tool also extracts the vCenter STS SAML signing key and writes key and certificate files); GTIG says SAWSNAKE, a Go port of a public vCenter SAML login tool, then let the actor forge administrator SAML assertions (golden SAML) to obtain admin session cookies. The actor enabled SSH on the vCenter through the VAMI API (PUT /rest/appliance/access/ssh), created a local administrator named sps-<redacted>@vsphere.local, took the vCenter master symmetric key and the PostgreSQL credential file, disabled SSH again, logged into ESXi as vpxuser and root, planted an authorized_keys entry, and used a staged vmfs_browser.py in a hidden directory on a VMFS volume to read Windows guest VMDKs (NTDS, SYSTEM, SECURITY, DNS) before archiving and copying them out over SCP. GTIG attributes the activity by tooling and TTP overlap with earlier ARMORY CASTLE intrusions (direct overlap for LAZYBONES). Fixed builds named by Broadcom: vCenter 8.0 U3m, 9.0.2.0200 and 9.1.1.0200; VCF 5.x through the asynchronous patching process in KB 88287 (the Q&A says apply vCenter 8.0 U3m that way and update SDDC Manager to 5.2.5; the VMSA matrix row for VCF 5.x lists 5.2.5 with KB88287); Telco Cloud via KB463116; vCenter 7.0 only through an extended-support contract.
    region_nexus: "global; vCenter is the virtualization control plane in many public-sector data centres, no Swiss or public-sector victim named by GTIG"
