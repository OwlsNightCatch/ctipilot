  - title: "Phantom53 and HavoX: a Russian-speaking operator's ClickFix-to-MSI chain installs a pythonw.exe beacon that talks DNS-over-HTTPS with a weekly DGA and loads Havoc on demand (SOCRadar, 2026-11-13); Hunt.io's exposed server shows 603 implants, cracked password vaults, Chrome app-bound-encryption bypass, M365 session-cookie replay past MFA and RMM persistence"
