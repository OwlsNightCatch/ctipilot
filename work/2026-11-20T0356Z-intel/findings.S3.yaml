    evidence:
      - { quote: "ARMORY CASTLE exploited this vulnerability in early September 2026 using BONESAW, according to forensic evidence.", attribution: "Google Threat Intelligence Group / Mandiant", source_url: "https://cloud.google.com/blog/topics/threat-intelligence/armory-castle-exploits-vsphere/" }
      - { quote: "CVE-2026-123890 is an unauthenticated Secure Remote Password (SRP-6a) session key disclosure vulnerability over Distributed Computing Environment/Remote Procedure Calls (DCE/RPC).", attribution: "Google Threat Intelligence Group / Mandiant", source_url: "https://cloud.google.com/blog/topics/threat-intelligence/armory-castle-exploits-vsphere/" }
