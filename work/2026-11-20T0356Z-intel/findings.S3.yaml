  - title: "ARMORY CASTLE used a second zero-day, the vCenter authentication bypass CVE-2026-123890, from early September after entering through BeyondTrust Remote Support; GTIG documents BONESAW, SAWSNAKE golden-SAML forging, a Dropbear backdoor and ESXi guest-disk theft; Broadcom fixed it on 2026-11-19 in VMSA-2026-0009 (CVSS 9.8, no workaround)"
    sources:
