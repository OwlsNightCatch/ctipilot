      - { quote: "While Broadcom has not confirmed that the flaw was exploited, researchers at Google's Mandiant have documented attacks exploiting CVE-2026-123890.", attribution: "BleepingComputer", source_url: "https://www.bleepingcomputer.com/news/security/vmware-patches-vcenter-zero-day-exploited-in-attacks-since-september/" }
    extended_notes: |
      Exposure: any vCenter 7.0, 8.0, 9.0 or 9.1 (and VCF/VVF 5.x, Telco Cloud) before the fixed builds in VMSA-2026-0009; network reachability to the vmdir RPC interface is the only prerequisite, and BONESAW ran from an internal appliance, so a vCenter that is not internet-facing is still exposed once any internal foothold exists. Broadcom lists no workaround (its Q&A adds that other compensating controls such as perimeter and appliance firewalls may exist and that the flaw is present whether or not Enhanced Linked Mode is used; BleepingComputer reports network restrictions can reduce exposure); the fixed builds also carry the VMSA-2026-0008 fixes.
      Detection (telemetry class first): vCenter appliance (VAMI) access logs for PUT /rest/appliance/access/ssh enabling then disabling SSH within minutes; vmdir/SSO directory changes (new SSO admin, new local administrator on vsphere.local, e.g. a name starting sps-); file reads of /storage/db/vmware-vmdir/data.mdb and of the vCenter master key and PostgreSQL password files; SAML-authenticated administrator sessions with no matching IdP sign-in (golden SAML); ESXi: vpxuser or root SSH logins from the Linux appliance, authorized_keys changes, hidden directories on VMFS volumes, scp into /vmfs/volumes; network: scans for 2012, 5480 and 9080 from appliances, Slack API egress (conversations.history, file upload) from servers that never use Slack, Dropbear listeners on port 53 or high ports. GTIG's own SecOps rule names are VMware vCenter VAMI API SSH Enablement and the base64 shell-command rules.
      Post-patch check (inference from GTIG's description, not a vendor statement): the actor copied the STS SAML signing key and created SSO and local administrators, so updating does not by itself remove a key or account the actor already holds; GTIG recommends the Mandiant VCSA hardening tool (default-deny iptables, egress filtering, remote logging) and its vSphere and BRICKSTORM defender guide.
      Triage: legitimate administrators do enable SSH through VAMI for maintenance; the discriminator in GTIG's sequence is SSH enabled then disabled again immediately after the master key and database credentials were read, from an account created minutes earlier, with the session preceded by internal scans of 2012/5480/9080 from a non-management Linux appliance.
      Contradiction to surface: Broadcom's advisory is silent on exploitation, GTIG states it as observed in early September; the BONESAW build date (2026-07-13) is offered by GTIG as evidence the actor knew the flaw before CVE-2026-59309 was disclosed (2026-07-29), but GTIG itself notes build metadata can be modified.
  # ---------------------------------------------------------------- ITEM B
  - title: "depthfirst 'Narrow Grants, Wide Engines': a low-privilege SQL role can reach native engine bugs and run code as the database OS user in PostgreSQL (CVE-2026-116331, fixed 2026-11-12), MySQL (CVE-2026-101786) and ClickHouse; the researcher chains Oracle Text CVE-2026-114819 (CVSS 9.9) with an ORDS GraphQL flaw into a pre-login path that Oracle rates as needing a session"
    sources:
      - { url: "https://depthfirst.com/research/narrow-grants-wide-engines", publisher: "depthfirst (Zheng Yu)", date: "2026-11-18", role: "primary" }
      - { url: "https://thehackernews.com/2026/11/researcher-demonstrates-database-rce.html", publisher: "The Hacker News", date: "2026-11-19", role: "corroborating" }
      - { url: "https://www.postgresql.org/support/security/CVE-2026-116331/", publisher: "PostgreSQL Global Development Group", date: "2026-11-12", role: "primary" }
      - { url: "https://www.oracle.com/security-alerts/cspunov2026.html", publisher: "Oracle Critical Security Patch Update, November 2026", date: "2026-11-17", role: "primary" }
      - { url: "https://www.oracle.com/security-alerts/cpuoct2026.html", publisher: "Oracle Critical Patch Update, October 2026", date: "2026-10-20", role: "primary" }
      - { url: "https://dev.mysql.com/community/security/advisories/2026-10-20/", publisher: "Oracle MySQL security advisory", date: "2026-10-20", role: "primary" }
    discovery_trace: "first seen at: The Hacker News feed https://feeds.feedburner.com/TheHackersNews (discovery scan of the news feeds; item 'Researcher Demonstrates Database RCE Exploits Affecting PostgreSQL, MySQL and Oracle', 2026-11-19T13:44Z) → pivot: THN article https://thehackernews.com/2026/11/researcher-demonstrates-database-rce.html → primary: depthfirst write-up https://depthfirst.com/research/narrow-grants-wide-engines → vendor confirmations fetched: PostgreSQL https://www.postgresql.org/support/security/CVE-2026-116331/ ; Oracle November CSPU https://www.oracle.com/security-alerts/cspunov2026.html ; Oracle October CPU https://www.oracle.com/security-alerts/cpuoct2026.html ; MySQL https://dev.mysql.com/community/security/advisories/2026-10-20/"
    summary: |
      depthfirst (Zheng Yu) argues that SQL GRANTs gate tables and schemas but barely narrow the C and C++ engine code a session can exercise, so one memory-corruption or type-confusion bug turns even a minimally privileged role into code execution as the database's OS service user. The write-up walks three chains: PostgreSQL CVE-2026-116331 (a user-defined aggregate whose SORTOP option makes the planner skip FINALFUNC, giving type confusion that the role builds into infoleak and fakeobj primitives inside its own pg_temp schema), MySQL CVE-2026-101786 (an out-of-bounds write in windowed BIT_OR through a prepared-statement parameter bound as a longer BLOB at execution time) and a ClickHouse RowBinary length-wraparound reproduced on 26.7.5.10 (no CVE; fixed in September).
      Vendor pages confirm the fixes: PostgreSQL rates CVE-2026-116331 CVSS 8.8 and fixes it in 18.7, 17.12, 16.16, 15.20 and 14.25 (published 2026-11-12); MySQL lists CVE-2026-101786 at CVSS 7.2 requiring high privileges (Server and Cluster 26.7.0 to 26.7.1, October 2026 advisory); Oracle's November update carries CVE-2026-114819 in Oracle Text at CVSS 9.9, but Oracle's table lists it as needing a Create Session privilege and not as remotely exploitable without authentication, and the October ORDS GraphQL flaw CVE-2026-91609 as CVSS 6.5 (ORDS 24.2.0 to 26.2.1). depthfirst claims the two together let an attacker with only the exposed HTTP endpoint run commands before any login; that chain is the researcher's claim and The Hacker News reports it was not reproduced independently. Both sources report no exploitation in the wild.
      The hardening lever the researcher names is to revoke the default TEMPORARY privilege from PUBLIC in PostgreSQL and avoid broad CREATE TEMPORARY TABLES grants in MySQL and ClickHouse where applications do not need them; that raises the bar for post-authentication chains but does not close the Oracle pre-login path.
    region_nexus: "global; Oracle Database, PostgreSQL and MySQL back many public-sector applications, no Swiss victim or exploitation reported"
    primary_sector_nexus: "indirect (database estates behind administrative applications; relevant to shared multi-tenant databases and to application-level SQL injection that lands as a low-privilege role)"
    sector: "technology"
    cves: [CVE-2026-116331, CVE-2026-101786, CVE-2026-114819, CVE-2026-91609]
    techniques: [T1190, T1068]
    affected_products: ["PostgreSQL", "MySQL Server", "MySQL Cluster", "Oracle Database", "Oracle REST Data Services", "ClickHouse"]
    entity_keys: ["product:oracle-database-server"]
    new_entities:
      - { key: "product:postgresql", type: product, name: "PostgreSQL", aliases: [], summary: "Open-source relational database; CVE-2026-116331 (type confusion in min/max aggregate optimization, CVSS 8.8) fixed in 18.7, 17.12, 16.16, 15.20, 14.25 on 2026-11-12 (PostgreSQL project)." }
      - { key: "product:mysql-server", type: product, name: "MySQL Server", aliases: ["MySQL"], summary: "Oracle MySQL; CVE-2026-101786 in the optimizer (CVSS 7.2) affects Server and Cluster 26.7.0 to 26.7.1, fixed in the October 2026 update (Oracle)." }
      - { key: "product:clickhouse", type: product, name: "ClickHouse", aliases: [], summary: "Columnar database; depthfirst reproduced an integer-overflow write in RowBinary parsing on 26.7.5.10, fixed in 26.9 and backported builds, no CVE (depthfirst, 2026-11-18; ClickHouse statement to The Hacker News)." }
      - { key: "product:oracle-rest-data-services", type: product, name: "Oracle REST Data Services", aliases: ["ORDS"], summary: "Oracle's HTTP front end for Oracle Database; GraphQL flaw CVE-2026-91609 (CVSS 6.5, versions 24.2.0 to 26.2.1) fixed in the October 2026 CPU (Oracle)." }
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    cross_domain_note: "S1 may carry the PostgreSQL 2026-11-12 release or Oracle CSPU rows (the store's Oracle CSPU entry of 2026-11-18 is a per-row table without this chain); no store entry covers CVE-2026-116331, CVE-2026-101786 or this research. The primary is dated 2026-11-18 (up to 26 h before the window start of 2026-11-19T01:56Z; its exact publication time was not shown); the in-window source is The Hacker News of 2026-11-19, updated 2026-11-20 with the ClickHouse fix."
    evidence:
      - { quote: "A single memory corruption bug in any of those paths collapses the SQL privilege model into arbitrary command execution under the database’s OS service account.", attribution: "depthfirst (Zheng Yu)", source_url: "https://depthfirst.com/research/narrow-grants-wide-engines" }
      - { quote: "Together, the two vulnerabilities allow an unauthenticated attacker with access only to the exposed HTTP endpoint to smuggle a crafted document into the database and execute arbitrary commands as the database’s OS service user.", attribution: "depthfirst (Zheng Yu)", source_url: "https://depthfirst.com/research/narrow-grants-wide-engines" }
      - { quote: "| CVE-2026-114819 | Oracle Text | Create Session | Oracle Net | No | 9.9 |", attribution: "Oracle Critical Security Patch Update, November 2026", source_url: "https://www.oracle.com/security-alerts/cspunov2026.html" }
      - { quote: "All five flaws now have vendor fixes, four of them with CVEs, but the full attack chains were not reproduced independently, and the research reports no sign that any of them has been used in an attack.", attribution: "The Hacker News", source_url: "https://thehackernews.com/2026/11/researcher-demonstrates-database-rce.html" }
      - { quote: "Versions before PostgreSQL 18.7, 17.12, 16.16, 15.20, and 14.25 are affected.", attribution: "PostgreSQL Global Development Group", source_url: "https://www.postgresql.org/support/security/CVE-2026-116331/" }
    extended_notes: |
      Exposure: PostgreSQL before 18.7/17.12/16.16/15.20/14.25 where any role can create objects (the default TEMPORARY privilege on PUBLIC is enough per depthfirst); MySQL Server or Cluster 26.7.0-26.7.1 where a role can create temporary tables; Oracle Database 19.3-19.32, 21.3-21.24, 23.4.0-23.26.3 (Oracle Text row) with ORDS 24.2.0-26.2.1 behind an exposed HTTP endpoint for the researcher's pre-login chain.
      Detection (telemetry class): database audit and server logs for CREATE AGGREGATE with SORTOP from non-owner roles, burst temp-schema object creation by application roles, prepared-statement BIT_OR windows with oversized BLOB binds, and the database OS user spawning shells or unexpected child processes (process-creation events with the postgres/mysqld/oracle parent); ORDS access logs for GraphQL requests carrying unusual document payloads. No behavioural indicators beyond these are stated by the sources.
      Defender takeaway: a short SHOW GRANTS output does not mean a small native attack surface (researcher's own wording in essence); update first, then revoke default TEMPORARY / CREATE TEMPORARY TABLES grants where unused. Competing claims to surface: Oracle rates the Oracle Text flaw as needing Create Session and the ORDS flaw at 6.5; depthfirst says the pair is unauthenticated end to end.
  # ---------------------------------------------------------------- ITEM C
  - title: "React2STEAL: 45 hijacked-account GitHub repositories run a GitHub Actions pipeline that sprays React2Shell (CVE-2025-55182) and the Next.js middleware bypass (CVE-2025-29927), runs a Node.js payload that steals environment variables, .env files, AWS role credentials and AI provider keys, and commits the loot to the public repos; OpenSourceMalware ties the accounts to wfx-loot but finds no shared code"
    sources:
      - { url: "https://opensourcemalware.com/blog/react2steal-github-actions", publisher: "OpenSourceMalware", date: "2026-11-18", role: "primary" }
    discovery_trace: "first seen at: opensourcemalware, feed https://opensourcemalware.com/rss.xml (item 'React2STEAL Uses GitHub Actions to Exploit React2Shell', 2026-11-18T06:30Z) → primary (no pivot needed): https://opensourcemalware.com/blog/react2steal-github-actions. Two WebSearch attempts for corroboration (\"React2STEAL\"; 'React2STEAL GitHub Actions React2Shell Karina Reaño ci-wk repositories') returned nothing independent; no second source exists in this run."
    summary: |
      OpenSourceMalware reviewed research by the threat-intelligence analyst Karina Reaño (38 repositories, more than 20,000 targeted hosts, about 277 compromised) and expanded it to 45 repositories created in three waves from 2026-10-22 (26+ on 10-22, 8 on 11-11, 5 on 11-14), named ci-wk-<number>, which it names React2STEAL. Each repository holds a workflow_dispatch GitHub Actions workflow (contents: write, 350-minute timeout) that splits a host list, prefilters for Next.js, tries seven React2Shell request variants (chunked encoding, 8 KB padding, randomised multipart boundary, null byte before Content-Type, spaces in Content-Type, dual header), then the CVE-2025-29927 x-middleware-subrequest bypass and an SSRF through /_next/image to the cloud metadata address to pull IAM role credentials. On success a JavaScript payload runs inside the victim's Node.js process, collects environment variables, config and .env files (full contents up to 300 KB in the newer variant), cloud and Kubernetes credentials, and tests AI provider keys (ten providers, 28 variable names) with real inference calls made from the victim's server under a Chrome user agent.
      The workflow then commits everything back to the same public repository, so the loot is world-readable; a Telegram channel is built in but off by default. OpenSourceMalware counts at least 1,281 victim hostnames across about 1,100 domains in 34 live repositories, mostly small and mid-sized organisations and many dev, staging and admin hosts, with new results landing about every 11 minutes on 2026-11-17; dated code comments suggest the pipeline ran at volume from at least 2026-09-10. The repository owners look like victims: 25 of 39 inspected repositories carry the wfx-loot probe branch and file, and GitHub ties the w@w commit email on the result commits in every live repository checked to a single account that now returns 404. OpenSourceMalware says it does not know who runs React2STEAL or how the tokens were obtained, found no shared code or infrastructure with wfx-loot (slightly favouring two operations), and found none of the ARTEX traces SentinelOne lists, while noting the scripts show signs of AI-assisted authoring.
    region_nexus: "global; no Swiss or public-sector victim named; targets are unpatched or edge-reachable Next.js servers"
    primary_sector_nexus: "indirect (any public-sector web application on Next.js or React Server Components that stayed unpatched or sits behind an unfiltered header path; stolen cloud and AI-provider keys)"
    sector: "technology"
    cves: [CVE-2025-55182, CVE-2025-29927]
    techniques: [T1190, T1552.005, T1552.001, T1059.007, T1078.004]
    affected_products: ["React Server Components", "Next.js", "GitHub Actions"]
    entity_keys: ["malware:wfx-phantom", "product:github-actions"]
    new_entities:
      - { key: "campaign:react2steal", type: campaign, name: "React2STEAL", aliases: [], summary: "Automated React2Shell and Next.js middleware-bypass exploitation run from GitHub Actions in 45 hijacked-account repositories (ci-wk-<n>) since 2026-10-22, committing stolen environment variables, .env files, AWS role credentials and AI keys to public repositories (OpenSourceMalware, 2026-11-18)." }
