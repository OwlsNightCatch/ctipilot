    evidence:
      - { quote: "The operation officially launched in August 2026 and remains active as of this publication.", attribution: "SOCRadar", source_url: "https://socradar.io/blog/xaocmail-clickfix-phantom53-havox-america-asia-europe/" }
      - { quote: "Microsoft 365 MFA bypassed without credentials via PKCE OAuth session cookie replay.", attribution: "Hunt.io", source_url: "https://hunt.io/blog/us-bank-irs-ssa-logins-stolen-russian-speaking-operator" }
      - { quote: "At least 57 distinct victims hold a US bank or US government login, and at least 46 hold a US federal benefits or identity account.", attribution: "Hunt.io", source_url: "https://hunt.io/blog/us-bank-irs-ssa-logins-stolen-russian-speaking-operator" }
    extended_notes: |
      Detection (telemetry class, from SOCRadar's hunt list): process-creation events for msiexec.exe spawned from the Run dialog (explorer.exe parent) with a workers.dev URL; pythonw.exe started by the Task Scheduler service (svchost.exe parent) running a .pyw from %APPDATA% or %LOCALAPPDATA%; pythonw.exe loading .pyd files outside a standard Python install; pythonw.exe making HTTPS connections to DoH resolvers on 443 or to IP addresses on port 53. Hunt.io adds: pythonw.exe running .pyw under AppData\Roaming with random hex names, uniform-interval POST beacons to workers.dev, ScreenConnect or Level.io agents enrolled by a non-IT process.
      Identity side (Hunt.io): Microsoft Entra sign-in logs showing a refresh or authorization-code redemption (PKCE, prompt=none) from a new IP and device with the ESTSAUTHPERSISTENT cookie but no interactive MFA event; Hunt.io recommends Conditional Access with Continuous Access Evaluation and device-bound sessions, short refresh-token lifetimes and revocation on location change, and treating AI CLI auth files (~/.claude/.credentials.json, ~/.codex/auth.json, ~/.gemini/oauth_creds.json) like SSH private keys.
      Triage: scheduled tasks named MicrosoftEdgeUpdateTask, OneDriveSyncTask or similar exist legitimately; the discriminator is the task action (pythonw.exe in a random user-writable directory running a .pyw with a .pyd from a non-Python path) rather than the name.
