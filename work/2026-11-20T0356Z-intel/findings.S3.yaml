    summary: |
      Two vendors describe two ends of what looks like one toolset. SOCRadar (2026-11-13) describes a campaign launched in August 2026 and still active at publication: the XaocMail phishing platform sends personalised document-sharing lures whose Cloudflare Workers pages carry a ClickFix command; the preferred variant runs msiexec /i against a workers.dev URL from the Win+R dialog and installs an MSI that drops a private Python 3.11 runtime into a random directory under %LOCALAPPDATA% or %APPDATA%, two scheduled tasks named like Edge, OneDrive, Defender or Adobe updaters (beacon every 12 minutes, watcher every 3 minutes, via pythonw.exe loading a .pyd named after numpy, PIL, cv2 or lxml modules), and the Phantom53 beacon, which uses DNS-over-HTTPS through public resolvers, a week-keyed SHA256 DGA for failover and an anti-sandbox gate; on a trigger the watcher reflectively loads the Havoc Demon (SOCRadar's HavoX label). SOCRadar counts almost a thousand lure pages aimed mostly at Brazil, Peru, India, Indonesia and Spain across technology, finance, education, government, logistics and manufacturing, and reports Claude Code task and prompt artefacts in the operator's codebase.
      Hunt.io (displayed 2026-11-18) found the operator's open directory on a Netherlands VPS in October and November 2026 with 603 implants beaconing between 2026-10-12 and 2026-11-08 behind 12 Cloudflare Workers domains, three C2 layers (a Python HavoX manager whose implants run as .pyw under pythonw.exe from AppData\Roaming, a Go task broker called Phantom53, and a Russian-language bridge). Its loot shows offline cracking of LastPass, 1Password and KeePass vaults, hardcoded-key decryption of Chrome and Edge v20/v21 app-bound-encrypted data, replay of stolen ESTSAUTHPERSISTENT cookies through a PKCE flow with prompt=none to obtain Microsoft Graph tokens without an MFA prompt (two M365 tenants confirmed), theft of session and auth files for 35 AI developer products (Claude CLI and Desktop, Codex, Gemini), and ScreenConnect and Level.io deployment for persistence beyond implant removal. Victims are mostly US individuals (at least 57 hold a US bank or government login), with one corporate host profiled. Hunt.io's operator attribution rests on Russian-language comments and logs. The two reports share the Phantom53 and HavoX names, Cloudflare Workers fronting, Russian-language tooling and AI-assisted development; neither states that it is the same operator, so the link is this analyst's reading of the overlap, not a vendor claim.
