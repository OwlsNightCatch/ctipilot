    extended_notes: |
      Exposure: React Server Components 19.0.0, 19.1.0, 19.1.1 and 19.2.0 (and Next.js apps built on them) for React2Shell; Next.js versions that trust the internal x-middleware-subrequest header for CVE-2025-29927 (OpenSourceMalware's description; affected-version table for the latter is not in the post). Internet-reachable server-side Node.js apps with cloud instance roles or AI keys in the process environment.
