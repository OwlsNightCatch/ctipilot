claims:
  - claim_id: ed222a3a6d
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade every PaperCut NG/MF Application Server, Site Server and secondary/print server to the security maintenance release for its line (26.0.5, 25.0.13 or 24.1.11, the v24 build the September bulletin now names), starting with any still on Emergency Patch Release 1 or 2, because the emergency builds do not carry the fix for CVE-2026-82077, an administrator-only Scan-to-Fax code-execution flaw that the vendor's September bulletin lists as fixed in 26.0.5, 25.0.13 and 24.1.10; for v23 and earlier, immediately restrict the Application Server's web interface to trusted/internal IP addresses only; no patch exists for that line. On every server, patched or not, set the advanced config key auth.webservices.auth-token to a long random secret and limit auth.webservices.allowed-addresses to the hosts that call the XML-RPC API, because Hunt.io says an instance hardened against the Tapestry bypass is not necessarily protected against the XML-RPC route it recovered, which works when the allowlist is too permissive or no token is set."
  - claim_id: c70d7750b1
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "summary"
    kind: frontmatter
    text: "Atlassian's advisory of 2026-10-05 fixes CVE-2026-21589, an unauthenticated arbitrary file access flaw in every version of Bitbucket, Confluence, Jira Service Management, Jira Software, Bamboo and Crowd Data Center, plus Crucible and Fisheye (CVSS 4.0 9.3), and tells customers to patch immediately or take internet-facing instances off the internet. watchTowr Labs published the root cause, the request shape and a runnable checker on 2026-10-06, and exploitation attempts followed the same day: Previdian's honeypot sensors recorded attempts from dozens of addresses in about twenty countries, SANS ISC recorded similar attempts on its own honeypots, and a Nuclei template exists; neither honeypot operator reports a compromise. CISA added the flaw to its Known Exploited Vulnerabilities catalog on 2026-10-15 on evidence of active exploitation, without saying what the evidence is. Where Jira is integrated with Crowd, the file read exposes a plaintext Crowd application password that gives access to Crowd as an administrator of that application. The CVE record for this ID was marked rejected on 2026-10-16 with only a generic reason, while Atlassian's advisory and fixed versions are unchanged, so tooling keyed on the ID can lose track of an exploited flaw."
