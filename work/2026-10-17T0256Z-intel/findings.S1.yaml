      - { url: "https://community.atlassian.com/forums/discussion/3310306/cve-2026-21589-arbitrary-file-access-vulnerability-impacts-multiple-data-center-products", publisher: "Atlassian Community", date: "2026-10-05", role: "corroborating" }
      - { url: "https://jira.atlassian.com/browse/CONFSERVER-104488", publisher: "Atlassian Jira (public security ticket)", date: "2026-10-02", role: "corroborating" }
    discovery_trace: "first seen at: enisa-euvd bridge, `enisa-euvd recent exploited` (also `url --direct` on the euvdservices search API with exploited=true), EUVD-2026-92807 whose description reads as a rejection, URL https://euvd.enisa.europa.eu/enisa/eu_vulnerability_database/EUVD-2026-92807 → pivot: CVE Services record for the ID read with `url --direct https://cveawg.mitre.org/api/cve/CVE-2026-21589` (state REJECTED, dateRejected 2026-10-16T20:39:09Z, assigner atlassian; read-only, not citable) → pivot: NVD REST record `url --direct https://services.nvd.nist.gov/rest/json/cves/2.0?cveId=CVE-2026-21589` (vulnStatus Rejected, lastModified 2026-10-16T21:17:24Z, still carries cisaExploitAdd 2026-10-15; read-only) → pivot: NVD sourceIdentifier=security@atlassian.com sweep lastMod 2026-10-14 to 2026-10-17 (only this one record, so no replacement ID published yet) → vendor pages re-fetched 2026-10-17 with `extract`: Atlassian advisory, Jira ticket CONFSERVER-104488 and Community post, all still name CVE-2026-21589 → primary for the rejection itself is the CNA's own CVE Services action, mirrored by ENISA EUVD"
    summary: |
      The CVE record for CVE-2026-21589, the unauthenticated arbitrary file access flaw in eight Atlassian Data Center products that CISA listed in KEV on 2026-10-15, was marked REJECTED by its CNA (Atlassian) at 2026-10-16T20:39:09Z. The CVE Services record, the NVD record (status Rejected since 2026-10-16T21:17Z) and the ENISA EUVD entry EUVD-2026-92807 (updated 2026-10-16 20:39 UTC, still carrying exploitedSince 2026-10-15) all carry only the generic reason "This CVE's publication may have been a false positive or a mistake. As a result, we have rejected this record." and the descriptive text, CVSS 4.0 vector and product list were stripped from the CVE record. Nothing else changed: Atlassian's security advisory (fetched 2026-10-17), its public Jira tickets (CONFSERVER-104488) and its Community post still use CVE-2026-21589, still list the same fixed builds (Confluence 9.2.26 and 10.2.19, Jira 9.12.40/10.3.26/11.3.12, Bitbucket 9.4.26/10.2.8/10.5.1, Bamboo 10.2.24/12.1.12, Crowd 6.3.7/7.0.3/7.1.7/7.2.4, Crucible and Fisheye 4.9.15) and the same WAF and Tomcat RewriteValve mitigations; the advisory is still version 1 with no rejection note. The KEV JSON read at 2026-10-17T02:57Z (catalogVersion 2026.10.16, released 2026-10-16T17:15Z, before the rejection) still lists CVE-2026-21589, and the GitHub advisory GHSA-gr66-x5pq-8g2g is not withdrawn. An NVD sweep of Atlassian-CNA records modified since 2026-10-14 shows no replacement ID. No source gives a reason or says whether a new ID will follow; that is unknown. Consequence for a defender: tooling keyed on the CVE ID or on the NVD feed (vulnerability scanner plugins, SIEM enrichment, asset-inventory matching, ticket auto-closure on rejected IDs) can silently drop a flaw that is exploited, so track it by advisory, fixed build and KEV listing until Atlassian says more.
