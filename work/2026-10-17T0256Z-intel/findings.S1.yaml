  - title: "CVE-2026-21589 (Atlassian Data Center): the CVE record was REJECTED by Atlassian on 2026-10-16 while Atlassian's advisory, the Jira tickets and CISA's KEV listing still use the ID"
    sources:
      - { url: "https://euvd.enisa.europa.eu/enisa/eu_vulnerability_database/EUVD-2026-92807", publisher: "ENISA EUVD", date: "2026-10-16", role: "primary" }
