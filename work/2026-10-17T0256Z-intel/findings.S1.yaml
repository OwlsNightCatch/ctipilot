        source_url: "https://community.atlassian.com/forums/discussion/3310306/cve-2026-21589-arbitrary-file-access-vulnerability-impacts-multiple-data-center-products"
    extended_notes: |
      Verification detail for the composer. The NVD per-CVE page and the CVE Services record cannot be cited (check_run BLOCKED_SOURCE_PATTERNS); they are the read-only verification for the rejection and are why EUVD is the citable source. The rejection text is boilerplate that the CVE programme uses for any rejection, so it is not evidence that the flaw is not real: the vendor advisory, the fixed builds, watchTowr's root cause and runnable checker, the honeypot observations and CISA's KEV listing are all unchanged. Possible reasons (duplicate ID, wrong ID block, planned reissue) are speculation and no source states one. Suggested handling: one `update` record on the existing entry (headline and summary gain the rejection and the tooling consequence; tags stay), no new CVE row, and `check_run` entry-CVE overlap logic should be told that CVE-2026-21589 is a rejected-but-exploited ID so a later replacement ID is linked to this entry rather than becoming a second entry.
  - title: "CVE-2026-111357: MITRE assigns an ID to the unpatched root-escalation step of the Ivanti Connect Secure zero-day chain; Volexity and CISA's record disagree with the ID text on exploitation"
    sources:
      - { url: "https://github.com/advisories/GHSA-fhw5-mpvj-x89m", publisher: "GitHub Advisory Database (NVD-sourced record)", date: "2026-10-15", role: "primary" }
      - { url: "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-3989", publisher: "BSI / CERT-Bund (WID-SEC-2026-3989)", date: "2026-10-16", role: "corroborating" }
      - { url: "https://www.volexity.com/blog/2026/10/13/a-series-of-unauthenticated-events-chained-exploitation-of-ivanti-connect-secure-zero-days/", publisher: "Volexity", date: "2026-10-13", role: "corroborating" }
    discovery_trace: "first seen at: bsi-de RSS https://wid.cert-bund.de/content/public/securityAdvisory/rss, item WID-SEC-2026-3989 '[NEU] [mittel] Ivanti Connect Secure: Schwachstelle ermöglicht Privilegieneskalation' (pubDate 2026-10-16 10:35 GMT, initial release 2026-10-15T22:00Z) → pivot: `bsi-csaf WID-SEC-2026-3989` (CVE-2026-111357, known_affected Ivanti Connect Secure 22.8R2.4, references GHSA-fhw5-mpvj-x89m and the Volexity post; CSAF file https://wid.cert-bund.de/.well-known/csaf/white/2026/wid-sec-w-2026-3989.json) → pivot: GitHub advisory https://github.com/advisories/GHSA-fhw5-mpvj-x89m (text of the CVE) → pivot: CVE Services record `url --direct https://cveawg.mitre.org/api/cve/CVE-2026-111357` and NVD REST record (read-only: assigner mitre via the CVE request form, reserved 2026-10-15T20:56:57Z, CVSS 3.1 7.0 AV:L/AC:H/PR:L, CWE-829, CISA ADP SSVC 'Exploitation: none, Automatable: no, Technical Impact: total' stamped 2026-10-16T03:57Z) → pivot: Volexity post re-read in full (still says the root fix will come 'in the coming weeks') → Ivanti advisory https://hub.ivanti.com/s/article/Security-Advisory-Ivanti-Connect-Secure-CVE-2026-104935 is a JavaScript shell on WebFetch and could not be read; WebSearch for the ID and for a root-escalation fix found nothing else"
    summary: |
      The root-privilege-escalation step that Volexity chained with the Ivanti Connect Secure authentication bypass and code execution (CVE-2026-104935) now has its own identifier, CVE-2026-111357, published 2026-10-15 and relayed by BSI as WID-SEC-2026-3989 (rated medium, local attacker, product tree lists only Ivanti Connect Secure 22.8R2.4 as affected, no fixed version). The record was assigned by MITRE through the CVE request form on 2026-10-15, not by Ivanti, and reads: Connect Secure 22.8R2.4 mishandles how the dsinvoked broker trusts DSCache configuration data, leading to privilege escalation to root, as exploited in the wild in October 2026. It scores 7.0 (CVSS 3.1, AV:L/AC:H/PR:L) and maps to CWE-829. This matches Volexity's description of the step (the in-memory patched libdsplibs.so lets the cgi-server process rewrite a DSCache maintenance task so that dsinvoked launches the Perl interpreter as root) and Volexity's statement that Ivanti 'is working on a fix for the privilege escalation vulnerability' for a release 'in the coming weeks'. Two things to hold apart: (1) the CVE text says exploited in the wild while CISA's ADP SSVC entry on the same CVE record says Exploitation none (stamped 2026-10-16; CISA's KEV entry covers only CVE-2026-104935), so the exploitation claim rests on Volexity's incident and the CNA wording, not on a CISA record for this ID; (2) the record names 22.8R2.4 only while CERT-FR's alert and Ivanti's fixed builds (22.8R2.5, 25.1.1.2, 25.1.3.1) address the first two steps, so whether 22.8R2.5 or the 25.1 builds contain a root-step fix is unstated by any source read; Ivanti's own advisory could not be read. A defender can now track the unfixed step by ID in scanners, SIEM and ticketing and should keep treating a patched appliance as needing a compromise check.
    region_nexus: "global; SSL-VPN edge appliance common in public administrations; NCSC Switzerland hub post 13055 and CERT-FR ALE-013 already advise the constituency on the CVE-2026-104935 chain"
