        attribution: "BSI WID-SEC-2026-3989 (CSAF summary, German: a local attacker can exploit a flaw in Ivanti Connect Secure to raise privileges)"
        source_url: "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-3989"
    extended_notes: |
      Suggested handling: `improvement` (it changes what defenders can track, not what they must do now; the entry already says the root step is unfixed and an exposed appliance needs a compromise check), add CVE-2026-111357 to cves[] as status [exploited-claimed] if the vocabulary allows, otherwise `[patch-unavailable]`, and state the SSVC conflict. The CNA text 'as exploited in the wild in October 2026' and CISA's SSVC 'Exploitation none' are both read from the CVE record JSON (not citable); the citable carrier of the CNA text is the GitHub advisory page. EPSS (FIRST, 2026-10-16) 0.00247 for this ID versus 0.25982 for CVE-2026-104935.
