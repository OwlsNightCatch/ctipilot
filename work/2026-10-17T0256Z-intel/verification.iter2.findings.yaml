- code: F5
  category: missing-citation
  section: aomei-backupper-update-channel-tampering-unc7017-shinyroad / Triage
  item: "AOMEI Backupper and AnyViewer update files tampered with ... (UNC7017 / SHINYROAD)"
  url_or_quote: "Radmin is legitimate software, so provenance discriminates: METAL's EDR recorded the backup program itself installing it {m}."
  summary: "The sentence ends in an unresolved '{m}' template token with no citation (it reaches readers as literal text). The fact is on METAL ('ManageEngine EDR recorded AOMEI Backupper installing Radmin'; process table: upgrade-now.exe dropped Radmin components, rsetup64.exe installed Radmin Server). Replace '{m}' with ([METAL, 2026-10-16](https://www.manageengine.com/threat-analysis-lab/aomei-backupper-supply-chain-compromise.html)); consider 'an AOMEI updater child process launching a Radmin installer' since the installer was started by the unsigned dropper, not by Backupper's own code."
- code: F4
  category: hallucinated-fact
  section: cve-2026-104935-ivanti-connect-secure-zero-day-chain-kev / Defender takeaway
  item: "CVE-2026-104935, Ivanti Connect Secure ..."
  url_or_quote: "rotate what it could reach: the root-escalation step stays unfixed and the Integrity Checker cannot clear it."
  summary: "(low confidence) Present-tense 'stays unfixed' rests only on Volexity's 2026-10-13 sentence ('Ivanti is working on a fix ... in the coming weeks'). The entry's own newest section (Improvement 2026-10-17) says 'no source read says whether any build now fixes it', and the title, headline, summary and immediate_action were already re-dated to 'at disclosure'/'when Volexity reported'. Qualify the Defender takeaway the same way (supersession, check 4c(h))."
- code: F4
  category: hallucinated-fact
  section: papercut-ng-mf-tapestry-request-confusion-preauth-rce / actions[0]
  item: "CVE-2026-82078 / CVE-2026-81578, PaperCut NG/MF ..."
  url_or_quote: "because the route Hunt.io recovered needs neither the Tapestry bypass nor an unpatched build when the allowlist is too permissive or no token is set."
  summary: "(low confidence) Hunt.io says only: 'A PaperCut instance that has already been hardened against the Tapestry bypass is not necessarily protected against this one if its XML-RPC API is exposed with weak access controls', and the actor's note calls it 'proven when API network and token controls are weak'. No fetched source states that a build carrying the 26.0.5 / 25.0.13 / 24.1.x fixes is exploitable through the XML-RPC route. Reword to Hunt.io's hedge ('an instance hardened against the Tapestry bypass is not necessarily protected')."
- code: F3
  category: claim-not-supported
  section: cve-2026-21589-atlassian-data-center-arbitrary-file-access / summary
  item: "CVE-2026-21589, Atlassian Data Center ..."
  url_or_quote: "Previdian's sensors had recorded 607 attempts from 65 addresses in 20 countries as of its 2026-10-16 update"
  summary: "(low confidence) The cited page https://previdian.com/CVE-2026-21589, fetched this iteration, reads 'Updated 17 Oct 2026', 613 attempts, 66 unique attacker IPs, 21 countries, last observed 16 Oct 2026; the 607/65/20 reading is not on the page any more. The date qualifier makes it a historical figure, but a reader following the link cannot confirm it. Refresh to the current figures with an as-of date, or drop the counts."
- code: F3
  category: claim-not-supported
  section: publica-pk-softech-supplier-malware-intrusion-data-outflow / Update 2026-10-17
  item: "PK Softech ... PKZH"
  url_or_quote: "PKZH still runs another provider's system, which it says is not affected, and plans to move to PK Softech's system in early 2027 ([PKZH, 2026-10-15]); Inside IT reports the same ([Inside IT, 2026-10-16])."
  summary: "(low confidence) 'reports the same' binds Inside IT to all three facts. Inside IT (full text in page JSON) says only 'Die PKZH setzt aktuell noch auf einen anderen Softwareanbieter, will aber 2027 auf das System von PK Softech wechseln'; it carries neither 'not affected' nor 'early'. The cited 2026-10-15 PKZH page implies the current system is another provider's ('soll ... künftig das Verwaltungssystem liefern'); the explicit 'arbeitet derzeit mit einem anderen Softwareanbieter' is on the 2026-10-13 PKZH page. Reword to 'Inside IT reports that PKZH currently uses another provider and plans to move in 2027'."
