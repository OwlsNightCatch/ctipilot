- code: F11
  category: editorial-advisory
  section: sourcing_note (Atlassian, Ivanti, PK Softech)
  item: "sourcing_note fields"
  url_or_quote: "its text is readable in the record's data, not on the rendered page. | Ivanti's own advisory page is not readable without a browser, so ... | (PK Softech: 5+ sentences, per-source narration)"
  summary: "Rule 12: sourcing_note is two sentences of provenance, nothing else; remarks about how a page was fetched ('record's data, not the rendered page', 'not readable without a browser') are fetch-transport language, and the Atlassian (7 sentences) and PK Softech (5+ sentences) notes narrate per-source reading. Trim to provenance."
