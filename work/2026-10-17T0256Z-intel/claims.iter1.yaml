    entry: 2026-10-17/aomei-backupper-update-channel-tampering-unc7017-shinyroad
    surface: "actions[0]"
    kind: frontmatter
    text: "Inventory every Windows host that runs AOMEI Backupper or AnyViewer and check each for scheduled tasks named RadminComponentRuntime or NitroRuntime, a Radmin directory under the user's local application data and cached update files in the install tree's Tmphtml folder, searching proxy and firewall logs back to April 2026; isolate any host that matches and keep the cached files before any cleanup."
