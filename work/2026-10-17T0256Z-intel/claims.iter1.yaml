claims:
  - claim_id: c8682d1d55
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "summary"
    kind: frontmatter
    text: "PaperCut NG and PaperCut MF (all versions) carry an unauthenticated remote-code-execution chain — CVE-2026-81578 (auth bypass, CVSS4.0 8.8) and CVE-2026-82078 (unsafe dynamic class loading, CVSS4.0 9.4) — that PaperCut confirmed under active exploitation on 2026-08-27, before any CVE or patch existed. Fully tested maintenance releases 26.0.5, 25.0.13 and 24.1.10 (10 September 2026) replace the emergency patches and are the vendor's recommended build; servers still on Emergency Patch Release 1 or 2 need to upgrade now. There is no fix for v23 and earlier, and Huntress estimates 47% of the PaperCut installs it tracks run v23 or older. GreyNoise now documents an AI-agent-orchestrated mass-exploitation campaign against this same chain, compromising at least 440 instances across 395 identified organizations since 31 August 2026, reaching full domain admin in as little as five minutes via legacy Active Directory escalation paths. watchTowr's write-up of 2026-10-09 shows the 28 August emergency build could still be taken without authentication through the Setup Wizard forms, and names CVE-2026-82077, an administrator-only Scan-to-Fax code-execution flaw that the vendor lists as fixed only in 26.0.5 and 25.0.13. Hunt.io's recovery of the attacker's open directories (2026-10-15) adds a second route to code execution through PaperCut's XML-RPC API, usable when its address allowlist is too permissive or no explicit token is set, a cron-kept reverse SOCKS tunnel, and live pivots into 45 victims, with Switzerland among the countries listed."
  - claim_id: c0041bd290
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade every PaperCut NG/MF Application Server, Site Server and secondary/print server to the security maintenance release for its line (26.0.5, 25.0.13 or 24.1.10), starting with any still on Emergency Patch Release 1 or 2, and note that the emergency builds do not carry the fix for CVE-2026-82077, an administrator-only Scan-to-Fax code-execution flaw that the vendor's September bulletin lists as fixed in 26.0.5 and 25.0.13 and does not list for 24.1.10; for v23 and earlier, immediately restrict the Application Server's web interface to trusted/internal IP addresses only; no patch exists for that line. On every server, patched or not, set the advanced config key auth.webservices.auth-token to a long random secret and limit auth.webservices.allowed-addresses to the hosts that call the XML-RPC API, because the route Hunt.io recovered needs neither the Tapestry bypass nor an unpatched build when the allowlist is too permissive or no token is set."
  - claim_id: c9862ed924
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "actions[1]"
    kind: frontmatter
    text: "Before patching or restarting an internet-facing server, preserve the server/logs directory and process tree; check server.log for the two vendor-documented error strings and for an unexplained gap or truncation, check derby.log for a Derby boot line naming an in-memory database directory ending in \"pwn\", and hunt for a Windows service named \"Remote Access Service\" running SimpleService.exe (SimpleHelp) or an unexpected AnyDesk install, as PaperCut's own published incident data names both as an observed post-compromise access method."
  - claim_id: e89dbc4b75
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "actions[2]"
    kind: frontmatter
    text: "Given GreyNoise's confirmed domain-admin escalation paths, verify no PaperCut Application Server is domain-joined with a privileged service account or hosted on a domain controller, and confirm domain controllers reachable from any PaperCut host are patched against the 2021 noPac flaws (CVE-2021-42278/CVE-2021-42287); GreyNoise reports the AI-orchestrated campaign reaching full domain admin through these paths in as little as five minutes after initial access."
  - claim_id: 69f8c5e55b
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "body"
    kind: cited
    text: "PaperCut has been targeted before: Rapid7 notes that in 2023 CVE-2023-27350 was broadly exploited in the wild by multiple threat-actor groups, including ransomware operators, which raises the urgency of this new zero-day ("
    urls: ["https://www.rapid7.com/blog/post/etr-papercut-ng-mf-critical-zero-day-exploited-in-the-wild/"]
  - claim_id: b391a6dffe
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "body"
    kind: cited
    text: "PaperCut disclosed on 27 August 2026 that it was investigating active exploitation of a new flaw in the same product line, before any CVE, patch or public technical detail existed ("
    urls: ["https://labs.watchtowr.com/death-by-a-thousand-papercuts-papercut-pre-auth-rce-chain-and-patch-bypasses-wt-2026-0141-0144-cve-2026-82077-cve-2026-82078-cve-2026-81578/"]
  - claim_id: acafea0f07
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "body"
    kind: cited
    text: "); Rapid7 relays PaperCut's statement that information supplied by a university customer's security team and its digital forensics and incident response team enabled PaperCut to reproduce the vulnerability ("
    urls: ["https://www.rapid7.com/blog/post/etr-papercut-ng-mf-critical-zero-day-exploited-in-the-wild/"]
  - claim_id: 5fd7186016
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "body"
    kind: cited
    text: "PaperCut's own authorization check validates only the page selected for rendering, not the component that runs behind it — so a request that asks Tapestry to render the public, unauthenticated Error, Exception, or Home page while invoking the administrative `ConfigEditor` or `UserList` component bypasses authentication entirely ("
    urls: ["https://www.rapid7.com/blog/post/etr-papercut-ng-mf-critical-zero-day-exploited-in-the-wild/"]
  - claim_id: 2f444ec8f9
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "body"
    kind: cited
    text: "Through three such POST requests — `/app?service=direct/1/Error/ConfigEditor/quickFindForm`, `.../ConfigEditor/$Form`, and `.../UserList/$QuickFind.$Form` — an unauthenticated attacker rewrites four external card/ID lookup settings (`user-lookup.db-driver`, `user-lookup.db-url`, `user-lookup.id-to-username-sql`, `user-lookup.enabled`) that normally point PaperCut at an administrator-configured external card database ("
    urls: ["https://www.rapid7.com/blog/post/etr-papercut-ng-mf-critical-zero-day-exploited-in-the-wild/"]
  - claim_id: 333994c528
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "body"
    kind: cited
    text: "Redirected instead to an attacker-controlled JDBC target through PaperCut's bundled Apache Derby driver and its `foreignViews` feature, the connection reaches an attacker-controlled H2 database whose inline `INIT` statement creates a JavaScript-backed trigger; PaperCut's bundled Nashorn JavaScript engine then executes that trigger to launch an operating-system process — full remote code execution as the PaperCut server, triggered the moment the forged `UserList` search runs the malicious lookup ("
    urls: ["https://www.rapid7.com/blog/post/etr-papercut-ng-mf-critical-zero-day-exploited-in-the-wild/"]
  - claim_id: 73c5d03654
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "body"
    kind: cited
    text: "This is a two-CVE chain: CVE-2026-81578 (CWE-306, missing authentication) is the pre-auth entry that gains write access to the server configuration; CVE-2026-82078 (CWE-470, unsafe dynamic class loading) is the flaw that turns a reconfigured database connection into arbitrary Java bytecode execution once that write access is held ("
    urls: ["https://www.papercut.com/kb/Main/security-bulletin-27-aug-2026-urgent-security-advisory/"]
  - claim_id: 00bee77116
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "body"
    kind: cited
    text: "Huntress observed two live customer exploitations: one on 26 August lasting under two minutes against version 25.0.10.75465, and a second on 27 August against version 24.1.5.71847 — before Emergency Patch Release 2 extended coverage to the v24 line ("
    urls: ["https://www.huntress.com/blog/papercut-actively-exploited"]
  - claim_id: f4ca498785
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "body"
    kind: cited
    text: "In both cases the attacker ran base64-encoded discovery commands (`whoami & ver`, and separately `whoami & ver & tasklist`) via a dropped, OS-agnostic Java `.class` file; in the first incident it wrote its output to a temporary file and then deleted both that file and the server's own `server.log` ("
    urls: ["https://www.huntress.com/blog/papercut-actively-exploited"]
  - claim_id: 4e97a48625
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "body"
    kind: cited
    text: "Huntress's own proof-of-concept reproduced the full chain against a stock PaperCut NG install and observed the code execution surface as an observable `charmap.exe` process running as SYSTEM, spawned under the PaperCut Application Server's own `pc-app.exe` process ("
    urls: ["https://www.huntress.com/blog/papercut-actively-exploited"]
  - claim_id: 0e1508796d
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "body"
    kind: cited
    text: "PaperCut released an initial emergency patch for v25 and v26 on 28 August and patches for v24 later the same day, and Rapid7 says the first patch could be bypassed by using the Home page for display while the newest version of the vendor patch remediates that bypass ("
    urls: ["https://www.rapid7.com/blog/post/etr-papercut-ng-mf-critical-zero-day-exploited-in-the-wild/"]
  - claim_id: 26182ef731
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "body"
    kind: cited
    text: "PaperCut then superseded the earlier emergency patches with Emergency Patch Release 3 on 1 September 2026 and replaced all three emergency patches on 10 September with fully tested maintenance releases (see the updates below) ("
    urls: ["https://www.papercut.com/kb/Main/security-bulletin-27-aug-2026-urgent-security-advisory/"]
  - claim_id: 4a99fa97af
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "body"
    kind: cited
    text: "There is no fix for v23 and earlier; PaperCut's guidance for that line is to upgrade to a supported version ("
    urls: ["https://www.papercut.com/kb/Main/security-bulletin-27-aug-2026-urgent-security-advisory/"]
  - claim_id: 37b63e7eb9
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "body"
    kind: cited
    text: "), and Huntress estimates 47% of the roughly 2,500 PaperCut installations it tracks still run v23 or older ("
