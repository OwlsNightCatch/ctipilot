    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "body"
    kind: derived
    text: "Upgrading does not undo a read of the Crowd credential, so Crowd's own audit records of new users and changed group memberships are the post-patch check for Jira instances integrated with Crowd."
  - claim_id: c135c5aa04
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** upgrade each affected installation to a fixed version of its line now, internet-reachable ones first, and until each is upgraded keep it off the internet or behind Atlassian's rule; then search the access logs for the exposure period for traversal sequences, rotate the Crowd application password on every Jira instance integrated with Crowd and review Crowd for accounts created since the exposure began, because the flaw's mechanics are public, exploitation attempts have been observed since 2026-10-06, CISA lists the flaw as actively exploited and Atlassian cannot confirm that any instance is unaffected."
  - claim_id: bbba55bcb5
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "section 2026-10-17T03:34:00Z"
    kind: cited
    text: "The same record still lists exploitation since 2026-10-15 ("
    urls: ["https://euvd.enisa.europa.eu/enisa/eu_vulnerability_database/EUVD-2026-92807"]
  - claim_id: e12de6d4be
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "section 2026-10-17T03:34:00Z"
    kind: cited
    text: "The flaw itself is unchanged: Atlassian's advisory, as read on 2026-10-17, still uses the ID, lists the same fixed versions and carries no note of the rejection ("
    urls: ["https://confluence.atlassian.com/security/cve-2026-21589-arbitrary-file-access-vulnerability-impacts-multiple-products-1870495748.html"]
  - claim_id: 5b0c3b9ae9
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "section 2026-10-17T03:34:00Z"
    kind: uncited
    text: "ENISA's EUVD record EUVD-2026-92807 for CVE-2026-21589, which names Atlassian as the assigner, was updated at 20:39 UTC on 2026-10-16 and now describes the record only as \"This CVE's publication may have been a false positive or a mistake."
  - claim_id: 44f05dc644
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "section 2026-10-17T03:34:00Z"
    kind: uncited
    text: "No source read says why the record was rejected or whether a replacement ID will follow."
  - claim_id: 02bdb3d1f9
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "section 2026-10-17T03:34:00Z"
    kind: uncited
    text: "The consequence is for tooling: a scanner plugin, SIEM enrichment rule or ticket keyed on the ID, or on a feed that drops rejected IDs, can stop reporting a flaw that is exploited, so track it by Atlassian's advisory and the fixed versions above until a replacement ID appears."
  - claim_id: 895406e954
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "record 2026-10-17T03:34:00Z"
    kind: record-summary
    text: "Atlassian, the assigner, rejected the CVE record for CVE-2026-21589 on 2026-10-16, giving only the generic reason that its publication may have been a false positive or a mistake; ENISA's EUVD record mirrors it and still lists exploitation since 2026-10-15. Atlassian's advisory still uses the ID with the same fixed versions, and no source says why the record was rejected or whether a replacement ID will follow, so tooling keyed on the ID can lose track of an exploited flaw."
  - claim_id: eae6dfa3b3
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "headline"
    kind: frontmatter
    text: "PK Softech: the City of Zurich pension fund confirms its test data was stolen; Pensionskasse Post says data left"
  - claim_id: 482629c439
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "summary"
    kind: frontmatter
    text: "The Confederation, in a release headlined \"data outflow confirmed\", said on 2026-10-08 that a software supplier of Publica detected a cyberattack at the end of September, and the supplier PK Softech AG (Reinach BL) says unknown attackers used malware to reach part of its IT infrastructure and that it must be assumed data left its systems; the Federal Prosecutor's Office is investigating. Publica insures, among others, staff of the federal administration and the ETH domain, about 70,000 active members and 41,600 pensioners at the end of 2025, and says personal data of insured persons has presumably left, while the AWP agency relays the supplier's position that the volume is rather small and the data may be business data. The Pensionskasse Stadt Zürich now says personal data of its insured persons and pensioners, handed to PK Softech as test data for a planned 2027 switch to its system, was stolen, and Pensionskasse Post says personal data did leave but not yet whether its insured persons' data is among it; the Bernische Pensionskasse has no indication of theft but cannot exclude it and the Bernische Lehrerversicherungskasse is still checking. Which fields were taken is still being clarified by each fund, and the access vector and the actor are not public. Cantonal police warn that criminals could use leaked salary and pension data for investment-fraud calls, and the Zurich cantonal fund BVK, a customer since 2011, says it runs the software in its own data centre and is not directly affected."
  - claim_id: f55529fb9c
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "actions[0]"
    kind: frontmatter
    text: "Tell the helpdesk, HR and payroll teams of every body whose staff are insured with Publica (including the federal administration and the ETH domain) or with the Pensionskasse Stadt Zürich, which says data of its insured persons and pensioners was stolen, that AHV number, date of birth, address, salary and IBAN may now be known to criminals and must not count as proof of identity, and route requests that quote them, a request to change a payout account included, to a call-back on a known number; for staff insured with Pensionskasse Post, the Bernische Pensionskasse or the Bernische Lehrerversicherungskasse apply the same rule until those funds report the scope, because Pensionskasse Post says personal data left but not whose, the Bernische Pensionskasse says it has no indication of theft but cannot exclude it and the Bernische Lehrerversicherungskasse is still checking whether and to what extent its data is affected; also tell insured staff that cantonal police warn of investment-fraud calls from people who know their salary and pension details, which prove nothing about the caller."
  - claim_id: 3aeb339533
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "actions[1]"
    kind: frontmatter
    text: "If your organisation's pension administration, HR or payroll runs on PK Softech software, is being migrated to it or tested on it, or your staff are insured with Pensionskasse Post, ask the supplier or the fund in writing whether your data, test data included, was in the affected environment and what it holds."
