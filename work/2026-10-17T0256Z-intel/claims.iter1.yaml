    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "body"
    kind: cited
    text: "Until a patch is applied, Atlassian says to remove the instance from the internet where possible, including instances that require user authentication, or to block at a web application firewall or proxy any URL that carries '..' directly next to a slash, backslash or '::' in plain or percent-encoded form; it also gives a Tomcat RewriteValve rule for Confluence, Jira Service Management, Jira Software, Bamboo and Crowd and a urlrewrite.xml rule for Bitbucket ("
    urls: ["https://confluence.atlassian.com/security/cve-2026-21589-arbitrary-file-access-vulnerability-impacts-multiple-products-1870495748.html"]
  - claim_id: 8e5b87b4d3
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "body"
    kind: cited
    text: "**Exposure:** every self-managed Data Center installation of the eight products on a version below the fixed ones, internet-facing instances first, because Atlassian asks that even instances requiring user authentication be taken off the internet until patched; Atlassian Cloud customers need do nothing ("
    urls: ["https://confluence.atlassian.com/security/cve-2026-21589-arbitrary-file-access-vulnerability-impacts-multiple-products-1870495748.html"]
  - claim_id: 0d1ff41bed
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "body"
    kind: cited
    text: "Jira instances integrated with Crowd carry a plaintext application password in a configuration file under the readable web root, so a file read can end in administrator access there; watchTowr demonstrated this on Jira only ("
    urls: ["https://labs.watchtowr.com/you-wont-hear-about-these-even-in-myths-atlassian-jira-confluence-and-more-pre-auth-arbitrary-file-read-cve-2026-21589/"]
  - claim_id: 7209ad98ba
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "body"
    kind: cited
    text: "Atlassian says to URL-decode each request line (up to two decoding passes) and look for '..' directly next to '/', '\\' or '::', or to search the raw lines with its regular expression; it cannot confirm whether any instance was affected and asks customers to check every affected instance for evidence of compromise ("
    urls: ["https://confluence.atlassian.com/security/cve-2026-21589-arbitrary-file-access-vulnerability-impacts-multiple-products-1870495748.html"]
  - claim_id: d821652bd6
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "body"
    kind: cited
    text: "The public attempts use the paths from watchTowr's write-up: resource-download URLs under the Jira, Confluence and Bitbucket plugin paths with '..::' sequences ahead of a WEB-INF file such as web.xml or urlrewrite.xml, and SANS ISC notes the target file must exist, which is why web.xml, present in every Tomcat application, is the probe of choice ("
    urls: ["https://isc.sans.edu/diary/33406"]
  - claim_id: 430fb29ef6
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "body"
    kind: cited
    text: "Because the CVE record was rejected on 2026-10-16 ("
    urls: ["https://euvd.enisa.europa.eu/enisa/eu_vulnerability_database/EUVD-2026-92807"]
  - claim_id: 2efa9318c1
