  discovery_trace: 'first seen at: hackernews, URL https://feeds.feedburner.com/TheHackersNews (item ''AI-Found Linux Kernel Flaw Gives Local Users Root, and Can Break a Guest Out to the Host'') -> pivot: https://thehackernews.com/2026/10/ai-found-linux-kernel-flaw-gives-local.html -> primary: Tencent Zhuque Lab https://matrix.tencent.com/en/2026/10/12/vghost-cve-2026-74580 -> CVE record https://cveawg.mitre.org/api/cve/CVE-2026-74580'
  summary: 'Tencent Zhuque Lab published its write-up of Vghost on 2026-10-12, ten weeks after the upstream fix (3 August, per The Hacker News) and seven weeks after the CVE record (21 August): vhost keeps a per-ring metadata cache whose hit is taken as proof that the region was already validated, but VHOST_SET_VRING_ADDR and VHOST_SET_VRING_NUM do not clear it while the ring is live with a device IOTLB attached, so later accesses translate new addresses through a stale mapping and vhost copies to or from an unchecked pointer. The result on the host is a deterministic, race-free arbitrary kernel read of 8 bytes at a time and a repeatable arbitrary write of an 8-byte used-ring element (two attacker-chosen bytes followed by six zero bytes), with KASLR bypass, for anyone who can open /dev/vhost-net or /dev/vhost-vsock; Tencent reproduced the local-user-to-root chain on Ubuntu 26.04, RHEL 9.8, Amazon Linux 2023, Azure Linux 3.0 and Oracle Linux 10.2, with the device nodes mode 0666 by default on four of them and restricted to the kvm group on Ubuntu. The second path needs a virtual IOMMU with the virtio device behind it and vhost in device-IOTLB mode: an untrusted guest can then trigger the same condition and make the host kernel write out of bounds into the host''s QEMU process heap (The Hacker News reports working demos of both attacks, including overwriting a QEMU function pointer). The kernel.org CNA rates it CVSS 3.1 8.8 (scope changed); Red Hat, Amazon and Oracle rate it 7.3 to 7.8. Affected range 4.11 up to 7.2-rc4; first fixed stable releases per The Hacker News are 5.10.265, 5.15.216, 6.1.183, 6.6.152, 6.12.104, 6.18.45, 7.1.9 and 7.2. No exploitation is reported, the CVE is not in CISA KEV and EPSS is about 0.001. Tencent says its Corvus AI system found the flaw in two hours.'
  region_nexus: global; Linux KVM and container hosts that expose vhost device nodes
  primary_sector_nexus: 'indirect: shared Linux virtualization and container hosts; the local-root path matters wherever unprivileged users or service accounts exist on a host that exposes the device nodes'
