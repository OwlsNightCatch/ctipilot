  - quote: 'Not vulnerable: 1.31.7+, 1.30.6+'
    attribution: nginx.org security advisories (vendor)
    source_url: https://nginx.org/en/security_advisories.html
  extended_notes: |-
    How to tell exposure: nginx -V for the version, nginx -T for the running configuration, then look for alias beside a rewrite, a regex map used by root or log_format, aio with ssi, listen lines with quic or http3, and ssl_session_cache shared: without ssl_session_ticket_key (The Hacker News's recipe). Workarounds are per flaw (do not use alias in the location or $request_filename; named captures only inside the matching block, which the press report notes was questioned in July; turn aio off or stop serving SSI pages; proxy_request_buffering off for the HTTP/3 case; remove the shared cache or load ticket keys from a file, and servers with ssl_session_tickets off are unaffected). Upgrade remains the complete fix.
    Detection: worker process crashes or restarts in the error log following requests to the exposed paths; client-certificate-authenticated locations accepting sessions without a valid certificate in the access log's SSL variables. The sources describe no exploitation indicators.
- title: Next.js out-of-band update fixes two unauthenticated remote-code-execution flaws (React Server Components typed arrays, SVG image optimization via sharp/librsvg) and a Server Actions denial of service
  sources:
  - url: https://nextjs.org/blog/nextjs-security-update-october-14-2026
    publisher: Next.js (Vercel, vendor)
    date: '2026-10-14'
    role: primary
  - url: https://thehackernews.com/2026/10/nextjs-ships-out-of-band-patch-for-two.html
    publisher: The Hacker News
    date: '2026-10-15'
    role: corroborating
  discovery_trace: 'first seen at: hackernews, URL https://feeds.feedburner.com/TheHackersNews (item ''Next.js Ships Out-of-Band Patch for Two Critical RCE Flaws in Caching and SVG Processing'') -> pivot: https://thehackernews.com/2026/10/nextjs-ships-out-of-band-patch-for-two.html -> primary: Next.js advisory https://nextjs.org/blog/nextjs-security-update-october-14-2026'
  summary: Vercel shipped an out-of-band Next.js security update on 2026-10-14, versions 16.4.1 (Active LTS) and 15.5.28 (Maintenance LTS), carrying two fixes postponed from September because of upstream dependency delays. (1) Unauthenticated remote code execution in App Router applications with Cache Components when a use cache function returns multiple typed arrays (GHSA-673q-mjm6-r5xr; related React advisory GHSA-xqc2-xf4c-x3h3 for react-server-dom-webpack, -parcel and -turbopack 19.0.0 to 19.3.0); Next.js 16.0.0 to 16.4.0 is affected, there is no workaround and Vercel says to upgrade even without such a function. (2) Unauthenticated RCE through the image optimization API when SVGs are processed on glibc-based Linux, via a memory flaw in librsvg reached through sharp (CVE-2026-96889 / GHSA-2464-fhr4-w9xw; Next.js 10.0.0 to 15.5.27 and 16.0.0 to 16.4.0); workaround is sharp 0.35.5 or later, and SVG optimization is off by default, requiring the dangerouslyAllowSVG setting (The Hacker News adds that next/og on the Node.js runtime also renders through the same library). (3) A high-severity denial of service in App Router applications with at least one Server Action (GHSA-p3m5-59mp-jv5r; 13.0.0 to 15.5.27 and 16.0.0 to 16.4.0). Vercel rates both RCE flaws CVSS 9.5; Red Hat rates the underlying librsvg bug 7.8 with user interaction. The Hacker News reports no public attack reports as of 2026-10-15, that the use-cache and Server Actions advisories had no CVE and were absent from the npm advisory feed at that time (dependency scanners may stay silent), and that on version 15 the upgrade can leave an affected sharp 0.34.x in place, so npm ls sharp must be checked. Not in CISA KEV; EPSS for CVE-2026-96889 about 0.0015.
  region_nexus: global; Next.js is common in citizen-portal and public-website front ends built by contractors
  primary_sector_nexus: 'indirect: web front ends of public bodies built on React/Next.js; exposure depends on App Router, Cache Components, Server Actions and SVG settings'
  sector: all
  cves:
  - CVE-2026-96889
  techniques:
  - T1190
  - T1499.004
  affected_products:
  - Next.js
  - React Server Components
  entity_keys: []
  new_entities:
  - key: product:nextjs
    type: product
    name: Next.js
    aliases:
    - Next.js (Vercel)
    summary: Vercel's React framework; its 2026-10-14 out-of-band release 16.4.1/15.5.28 fixes two unauthenticated RCE flaws and a Server Actions DoS.
  relation_suggestions: []
  verification: MULTI-SOURCE
  confidence: HIGH
  novelty: new
  lookback: true
  suggested_classification:
    reliability: A
    credibility: 1
    why: vendor advisory for its own product; the press report adds scanner-gap and sharp-version caveats read directly from the advisory table
  evidence:
  - quote: There is no known workaround for affected applications. You should upgrade immediately even if your application does not have similar functions.
    attribution: Next.js (Vercel, vendor)
    source_url: https://nextjs.org/blog/nextjs-security-update-october-14-2026
  - quote: Updates are now available in v16.4.1 (Active LTS) and v15.5.28 (Maintenance LTS) to address these issues.
    attribution: Next.js (Vercel, vendor)
    source_url: https://nextjs.org/blog/nextjs-security-update-october-14-2026
  - quote: As of October 15, there are no public reports that any of the three flaws fixed on October 14 has been used in attacks.
    attribution: The Hacker News
    source_url: https://thehackernews.com/2026/10/nextjs-ships-out-of-band-patch-for-two.html
  extended_notes: |-
    Exposure: npm ls next and npm ls sharp on every build; App Router with Cache Components (use cache) is the trigger for the typed-array flaw; image optimizer with dangerouslyAllowSVG or next/og on Node.js is the SVG path; any App Router app with a Server Action is in the DoS population. Hosting platforms differ: Netlify says its platform does not run the optimizer path.
    Detection: unexplained process-level CPU saturation on Next.js servers (Server Actions DoS); child processes spawned by the Node.js server after SVG upload or image optimization requests; rebuild and redeploy is required, a dependency bump alone is not enough. Interim for the image flaw: block the SVG loader in sharp (VipsForeignLoadSvg) per sharp's advisory.
- title: 'GreyNoise: a proxyjacking campaign enrols 143 edge devices in a residential-proxy network, and a live demo showed why geolocation-based sign-in rules fail against residential proxies'
  sources:
  - url: https://www.greynoise.io/blog/proxyjacking-edge-devices-residential-proxies
    publisher: GreyNoise
    date: '2026-10-15'
    role: primary
  - url: https://news.risky.biz/risky-bulletin-russia-arrests-datasuckers-hacking-group/
    publisher: Risky Bulletin
    date: '2026-10-16'
    role: discovery
  discovery_trace: 'first seen at: risky-biz-news, URL https://news.risky.biz/risky-bulletin-russia-arrests-datasuckers-hacking-group/ (item ''A proxyjacking campaign is underway'') -> primary: GreyNoise https://www.greynoise.io/blog/proxyjacking-edge-devices-residential-proxies'
  summary: 'GreyNoise (2026-10-15) tracks an actor it calls skynox7 that compromised at least 143 internet-facing devices in 34 countries to install the Pawns.app proxyware, which enrols the device''s bandwidth in a commercial residential-proxy network on the attacker''s account. GreyNoise''s table lists the exploited technologies as D-Link ShareCenter NAS (CVE-2024-3272 and CVE-2024-3273), Ubiquiti UniFi Video NVR (CVE-2021-44228) and SAP NetWeaver Visual Composer (CVE-2025-31324), and says Hikvision and Dahua recorders also appeared targeted; in some cases the actor added its own SSH key as a fallback. The detection lesson comes from a separate product demonstration: an organisation saw GreyNoise-labelled addresses in its Entra ID sign-in logs that looked residential and in-country, then found several users authenticating from the same residential address and confirmed a serious intrusion; GreyNoise will not publish that investigation. GreyNoise''s point is that residential proxies defeat rules based on VPS or out-of-country addresses, so it recommends flagging residential-proxy addresses in authentication logs, scrutinising several enterprise users sharing one such address, and comparing device, session and user-agent attributes instead of geolocation alone.'
  region_nexus: global; no Swiss victims reported
  primary_sector_nexus: 'indirect: identity-log detection lesson for Microsoft 365/Entra environments; exploited device classes (NAS, NVR, SAP Visual Composer) are old, known flaws'
  sector: all
  cves:
  - CVE-2024-3272
  - CVE-2024-3273
  - CVE-2021-44228
  - CVE-2025-31324
  techniques:
  - T1190
  - T1584.008
  - T1090.003
  - T1078
  affected_products:
  - D-Link ShareCenter NAS
  - Ubiquiti UniFi Video
  - SAP NetWeaver Visual Composer
  entity_keys: []
  new_entities: []
  relation_suggestions: []
  verification: SINGLE-SOURCE-OTHER
  confidence: MEDIUM
  novelty: new
  lookback: true
  borderline: true
  borderline_reason: one lab's telemetry on old-CVE edge compromise; the transferable value is the residential-proxy sign-in detection advice, which sits close to the relevance floor for a Swiss public-sector SOC
  suggested_classification:
    reliability: B
    credibility: 2
    why: original honeypot telemetry from the discovering lab, uncorroborated; the intrusion in the demo is not published
  evidence:
  - quote: 'The actor successfully compromised at least 143 devices in 34 countries using exploits for the following vulnerabilities:'
    attribution: GreyNoise
    source_url: https://www.greynoise.io/blog/proxyjacking-edge-devices-residential-proxies
  - quote: Detect residential proxy IP addresses in authentication logs, and especially scrutinize scenarios where multiple enterprise users are authenticating from the same residential proxy IP
    attribution: GreyNoise
    source_url: https://www.greynoise.io/blog/proxyjacking-edge-devices-residential-proxies
  extended_notes: 'Triage lookalike: a legitimate user''s home address can also be a proxyware node, so a residential-proxy label alone does not prove malicious logins; several different accounts authenticating from one residential address is the discriminator GreyNoise''s customer used.'
