  summary: 'On 2026-10-14 Microsoft and Health-ISAC, under an order from the US District Court for the Southern District of Florida, seized and redirected domains behind YAM Store, CoGUI and Iron Man, after an investigation that began when Japan''s National Police Agency flagged scam campaigns in late 2025 and later drew in JC3, Resecurity, Cloudflare, Oracle, Proofpoint and TRM Labs. Microsoft says the three services enabled more than one billion malicious emails and SMS messages to over 75,000 organizations in 150+ countries since January 2026 (more than 750 million aimed at Microsoft customers), has disabled over 20,000 YAM Store accounts and is blocking more than 100,000 impersonation domains. MSTIC''s technical account: YAM Store (tracked Storm-3119) is an access broker that takes over or fraudulently creates Microsoft 365 and Azure tenants, especially education and non-profit ones, partly by acquiring expired domains of real organizations and rebuilding their websites; its panels use a compromised tenant''s client secret with application-only authentication to reset passwords silently, assign education licences and grant privileged attributes, self-provision the PnP Management Shell service principal in a compromised Global Administrator account to obtain broad Microsoft Graph rights (including AppCatalog.ReadWrite.All) and full SharePoint API control, and then sell the tenant''s SharePoint and OneDrive storage as bulk hosting. Storm-2990 (CoGUI, Haozi, Iron Man System) supplies the kits: Iron Man ships 2,335+ templates for 139+ countries, including local government, police, traffic and parking authorities, with geofencing, fake CAPTCHA gates, researcher IP blocklists and Telegram-driven real-time operator interaction over WebSockets; downstream actors were observed using credential phishing, device-code phishing and card fraud. Proofpoint separately counts CoGUI, CoAceV and CoFish_Ws campaigns (over 100 million blocked messages a month, overwhelmingly Japan; government among the five most affected sectors) and assesses with high confidence that the three kits share roots and affiliates. Microsoft states that a template impersonating an organization does not mean it was compromised, and assesses the ecosystem is not limited to Microsoft and Google services.'
