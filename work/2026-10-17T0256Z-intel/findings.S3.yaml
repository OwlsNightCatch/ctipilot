- title: 'OX Security: Apache Airflow SSH and SFTP providers disable host-key verification by default (CVE-2026-94134, CVE-2026-94135); fixed in providers 7.0.0'
  sources:
  - url: https://www.ox.security/blog/by-default-insecure-apache-airflow-disables-ssh-host-key-verification/
    publisher: OX Security
    date: '2026-10-16'
    role: primary
  - url: https://cveawg.mitre.org/api/cve/CVE-2026-94134
    publisher: Apache Software Foundation CNA (CVE record, JSON API)
    date: '2026-10-15'
    role: primary-record
  discovery_trace: 'first seen at: ox-security, URL https://www.ox.security/blog/ (listing, newest post 2026-10-16) -> primary (no pivot needed): https://www.ox.security/blog/by-default-insecure-apache-airflow-disables-ssh-host-key-verification/ -> CVE record https://cveawg.mitre.org/api/cve/CVE-2026-94134'
  summary: 'OX Security (2026-10-16) reports that apache-airflow-providers-ssh and apache-airflow-providers-sftp, through version 6.0.1, accept any server key by default: SSHHook hard-codes no_host_key_check to true and uses Paramiko''s AutoAddPolicy, the SFTP hook treats a missing setting as no verification, and the asynchronous asyncssh path passes known_hosts=None. A party that can sit on the network path between an Airflow worker and the target (ARP spoofing on a shared subnet, a compromised network device, cloud routing manipulation or BGP hijack) can present its own key, read the service-account credentials Airflow stores, alter command output and modify transferred files. CVSS 3.1 8.1 with attack complexity High (the man-in-the-middle position is the barrier). Fixes are in the providers'' 7.0.0 releases; the Apache CNA published both CVE records on 2026-10-15. Interim mitigation is to set no_host_key_check=false with an explicit host_key on every connection (without a key, connections fail, which is the secure behaviour), and OX suggests searching task logs for the warning string that marks connections running unverified. No exploitation is reported; a proof-of-concept repository is linked.'
