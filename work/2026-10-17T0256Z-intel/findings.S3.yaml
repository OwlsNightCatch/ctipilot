  - quote: Instead, much of the underlying network capacity has survived by transferring Internet resources to new legal entities controlled by the same people or closely connected partners.
    attribution: Qurium Media Foundation
    source_url: https://www.qurium.org/press-releases/aeza-infrastructure-thrives-despite-sanctions/
  extended_notes: |-
    Registry corroboration (RIPE database via RIPEstat, 2026-10-17): the /17 carries netname WW-VAN-STRIJ-DE-REGT, country CH, status LEGACY, organisation ORG-PA18-RIPE; a sampled /24 inside it carries netname Aeza-Network, country RU, maintainers including aeza-mnt, with route objects originating from AS210644 (created 2025-04) and AS216246 (created 2025-10). Specific prefixes and AS numbers are infrastructure indicators and are omitted from the summary; they are in Qurium's report.
    Use for defenders (analyst inference): egress and reputation controls built on country-of-registry or geolocation can misclassify such space; blocking or monitoring by origin AS and by Qurium's published prefix list is the stable handle. This is awareness-level: Qurium links the address space to malware, infostealer, traffic-distribution and fraud hosting, but the entry should not imply that every host in those prefixes is malicious.
