  - quote: There is no interim workaround for the guest-to-host escape; for that path, the patched kernel is the only remedy.
    attribution: The Hacker News
    source_url: https://thehackernews.com/2026/10/ai-found-linux-kernel-flaw-gives-local.html
  extended_notes: |-
    Exposure check: ls -l /dev/vhost-net /dev/vhost-vsock on each host (mode 0666 means any local user reaches the bug); virtual-IOMMU guests (iommu_platform on the virtio device) with vhost in device-IOTLB mode are the guest-escape population. Patch the host kernel and reboot; vendors may backport without changing the version number. Interim for the local path only: remove world access to the nodes and limit the owning group to trusted virtualization services, treating membership as a privilege (The Hacker News).
    Detection (stated by the sources): none beyond the pre-fix state of the nodes; the primitives leave no dedicated telemetry. Vendor patch status per The Hacker News as of 2026-10-13: Red Hat, Amazon Linux and Oracle Linux shipped fixes, Ubuntu fixed 22.04 and still listed 24.04 and 26.04 in progress; not re-verified here.
