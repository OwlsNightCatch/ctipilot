    why: two independent first-hand telemetry sources (GTIG, METAL); vendor changelog read directly by this agent confirms the absence of a client-side verification fix
  evidence:
  - quote: Each tampering window remained active for only five to ten minutes before reverting to authentic versions.
    attribution: Google Threat Intelligence Group / Mandiant
    source_url: https://cloud.google.com/blog/topics/threat-intelligence/investigating-ephemeral-supply-chain-tampering
  - quote: impacted organizations spanned diverse sectors, including IT services, telecommunications, higher education and related entities in Australia, Brazil, India, Pakistan, Portugal, Singapore, South Africa, Spain, Switzerland, Türkiye, and the United States.
    attribution: Google Threat Intelligence Group / Mandiant
    source_url: https://cloud.google.com/blog/topics/threat-intelligence/investigating-ephemeral-supply-chain-tampering
  - quote: Organizations running AOMEI software cannot assume they are protected solely because the vendor took corrective server-side action.
    attribution: Google Threat Intelligence Group / Mandiant
    source_url: https://cloud.google.com/blog/topics/threat-intelligence/investigating-ephemeral-supply-chain-tampering
  - quote: Nothing in this attack exploited a software defect. There was no CVE, no memory corruption, and no unpatched component.
    attribution: ManageEngine Threat Analysis Lab (METAL)
    source_url: https://www.manageengine.com/threat-analysis-lab/aomei-backupper-supply-chain-compromise.html
  - quote: As of publication, we have not independently verified that the compromise has been contained.
    attribution: ManageEngine Threat Analysis Lab (METAL)
    source_url: https://www.manageengine.com/threat-analysis-lab/aomei-backupper-supply-chain-compromise.html
  extended_notes: |-
    Exposure: any Windows host running AOMEI Backupper or AnyViewer whose update/notification polling reached AOMEI during an unseen window between April and July 2026; the hunt period both reports ask for is the whole April-to-July span, and a fixed vendor server does not tell you whether a given host was hit. No source lists affected Backupper versions; METAL reproduced on 8.3.0 and AOMEI's changelog through 8.5.0 (2026-10-09) shows no verification change, so treat every installed version as having the unauthenticated-config design until the vendor says otherwise.
    Detection concepts (behavioural, per METAL and GTIG): an executable written by the backup program's update process into its staging folder and then launched by the notification process from the rendering folder (a genuine promotional bundle contains no executables); an unsigned child of a signed AOMEI process presenting AOMEI publisher metadata; a genuine signed Radmin binary loading an unexpected DLL; dllhost.exe hosting a COM server registered from a non-standard path; scheduled tasks named RadminComponentRuntime or NitroRuntime; a Radmin installation with no configured server address; outbound connections to a hard-coded address with no preceding DNS lookup; egress SMB (445) and WebDAV to external addresses. Collection targets: the program's cached update files under its install tree (Tmphtml folder) and proxy or firewall records from the second an alert fired.
    Triage trap (GTIG and METAL): do not validate an alert by fetching the vendor URL now, because the files revert within minutes and the live page serves genuine content, which has led analysts to dismiss real detections.
    Hardening levers named by the sources: block outbound SMB and WebDAV to the internet (kills the NetNTLMv2 coercion even when the payload is blocked); restrict who may install unmanaged remote-administration tools; treat vendor promotional/notification channels as code-execution paths in third-party software reviews.
    Host artifact names above are behavioural anchors, not network IOCs; the sources also publish hashes, domains and addresses which are deliberately omitted here.
- title: 'PaperCut NG/MF: Hunt.io''s recovery of an attacker''s open directories documents a second XML-RPC code-execution path, a cron-kept reverse SOCKS tunnel and live pivots into 45 victims, one of them Swiss'
  sources:
  - url: https://hunt.io/blog/papercut-attacker-ai-toolkit-exploit-code-second-rce
    publisher: Hunt.io
    date: '2026-10-15'
    role: primary
  - url: https://www.papercut.com/help/manuals/ng-mf/common/tools-web-services-tips/
    publisher: PaperCut (product documentation)
    date: '2026-10-17'
    role: vendor-doc
  - url: https://news.risky.biz/risky-bulletin-russia-arrests-datasuckers-hacking-group/
    publisher: Risky Bulletin
    date: '2026-10-16'
    role: discovery
  discovery_trace: 'first seen at: risky-biz-news, URL https://news.risky.biz/risky-bulletin-russia-arrests-datasuckers-hacking-group/ (item ''PaperCut campaign: Open directories have exposed yet another hacking operation'') -> primary: Hunt.io, URL https://hunt.io/blog/papercut-attacker-ai-toolkit-exploit-code-second-rce -> vendor documentation for the hardening levers: https://www.papercut.com/help/manuals/ng-mf/common/tools-web-services-tips/'
  summary: 'Hunt.io (2026-10-15) found three open directories on the single attacker host that GreyNoise and Blackpoint Cyber had already tied to the AI-orchestrated mass exploitation of CVE-2026-81578 and CVE-2026-82078, and reconstructs the operator''s toolkit from the files. New facts against what the entry already carries: (1) the operator''s own notes record a second route that does not use the Tapestry bypass: PaperCut''s XML-RPC endpoint accepts api.setConfigValue when the web-services allowlist is too permissive or no explicit API token is configured, because the handler then falls back to the built-in admin password as the token; the same user-lookup settings are rewritten and the same Derby export trick is run. The actor logged it as proven only when API network and token controls are weak, and a probe results file lists nine hosts where the API answered; Hunt does not report it used against victims. (2) A Linux persistence kit keeps a chisel reverse SOCKS5 client alive through cron (periodic and @reboot entries plus a pgrep watchdog) from a hidden directory under /var/tmp. (3) The post-exploitation playbook exports the SECURITY and SYSTEM hives to recover LSA secrets and the machine-account hash offline, harvests service, LDAP, database and keystore credentials, and runs Metasploit automation over per-target reverse SOCKS pivots; folders are labelled by outcome including domain-admin access. (4) Scale from the actor''s own files: a 1,005-host reconnaissance pool in at least 45 countries (800 confirmed vulnerable, 205 version-based), 2,165 logged attempts, 46 distinct Active Directory domains in packaged kits (education by far the largest naming-based sector, 39 percent) and 45 targets with a live reverse SOCKS5 pivot at capture time, Switzerland among the listed countries. Hunt says it gave the victim data to the national CERTs concerned. The operating instructions (AGENTS.md, Codex harness with a DeepSeek model, up to 25 concurrent subagents) match GreyNoise''s earlier description.'
  region_nexus: 'Switzerland: Hunt lists it among the countries of the 45 targets with a live internal pivot (one target, sector not stated); global campaign, UK/US/France/Belgium heaviest'
  primary_sector_nexus: 'direct: PaperCut NG/MF is the print-management platform of schools, universities and administrations; education is the largest sector in the compromised AD domains Hunt could classify by name'
  sector: education, public-sector, healthcare
