  summary: 'Symantec''s Threat Hunter Team (2026-10-15) reports that recent builds of the little-documented Aoki (Aokigahara) Windows infostealer, first seen earlier in 2026, added theft of credential and session files for AI coding assistants: the newest sample targeted .claude.json and Claude desktop and ChatGPT cookies, the Codex config.toml and .env files, and tokens for GitHub Copilot, Cursor, Gemini, JetBrains AI Assistant and Kiro plus AWS credentials; older samples did not look for AI files. It has no backdoor command list, collects what is available and posts it to its command server over a /gate endpoint, and it also takes browser data from dozens of browsers, wallets, password managers, messaging, FTP and VPN clients and records installed security products. Symantec''s assessment is that stolen AI keys can be cashed in like card data (resale or LLMjacking) and, unlike card data, can expose connected repositories, cloud services and CI/CD pipelines; it knows no actor, sees no link to an existing family and infers a financial motive from the crypto focus (Symantec''s inference). Cursor''s local state database, which can cache chat context and code snippets, is the one place source code could leak.'
