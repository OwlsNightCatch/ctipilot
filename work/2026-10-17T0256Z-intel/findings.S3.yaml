    publisher: The Hacker News
    date: '2026-10-16'
    role: discovery
  discovery_trace: 'first seen at: hackernews, URL https://feeds.feedburner.com/TheHackersNews (item ''Critical PwnEscape Linux Kernel Vulnerability Lets Guest VMs Read Host Memory'') -> pivot: https://thehackernews.com/2026/10/critical-pwnescape-linux-kernel.html -> primary: pwn.ai write-up https://pwn.ai/blog/pwnescape -> corroboration: Vercel https://vercel.com/blog/findings-from-the-1-million-dollar-vercel-sandbox-challenge -> CVE record https://cveawg.mitre.org/api/cve/CVE-2026-99999 -> distro status https://security-tracker.debian.org/tracker/CVE-2026-99999 and https://access.redhat.com/security/cve/cve-2026-99999'
  summary: 'The Linux kernel CNA published CVE-2026-99999 on 2026-10-15 (CVSS 3.1 9.3, AV:L/PR:N/S:C) for a defect in the IPv4 stack that a guest virtual machine can trigger through virtio-net: a guest-supplied checksum start and offset (CHECKSUM_PARTIAL) are honoured by skb_checksum_help() on the host after routing and validation, so the deferred write lands inside an already-parsed IPv4 header and changes its header length; ip_do_fragment() then trusts the new length and copies beyond the linear head into transmitted IP options. pwn.ai (found in three days during Vercel''s $1M Sandbox challenge with an LLM-assisted harness) and Vercel report three outcomes: a continuous host-memory leak (about 32 bytes per guest packet, demonstrated on Vercel production sandboxes), a host crash from two packets, and host command execution as root, the last two shown only on the researcher''s own KVM and Firecracker machines configured like Vercel''s; pwn.ai says explicitly it is not a claim of root execution in any vendor''s production environment, and Vercel reports no customer data accessed. The fix is mainline commit 6785011f8b16 (Red Hat''s Michael Tsirkin), merged 2026-10-14 and described by its author as defence in depth with fuller ingress validation still to come; per the CVE record the flaw dates to 2.6.27 and the first fixed stable releases are 5.10.272, 5.15.223, 6.1.190, 6.6.159, 6.12.113, 6.18.57 and 7.2.11. Distribution state when fetched: Debian trixie (security) 6.12.113-1 fixed via DSA-6568-1, bookworm 6.1.187-1 and forky 7.2.9-1 still listed vulnerable; Red Hat lists no mitigation; Ubuntu lists every release as needing evaluation. pwn.ai assesses that exploits for weaker configurations will arrive within weeks and for default hypervisor configurations in under a month (a finder''s assessment, not an observation). No in-the-wild use is reported, the CVE is not in CISA KEV (checked against the catalogue released 2026-10-16) and EPSS is about 0.002.'
  region_nexus: global; any Linux host that carries guest workloads through virtio-net (KVM/QEMU, Firecracker and similar), including private-cloud and virtualization estates of public bodies
  primary_sector_nexus: 'indirect: host kernels under shared virtualization and VM-hosting platforms; severity is highest where untrusted or compromised tenants share a host'
  sector: cloud-and-hosting, public-sector
