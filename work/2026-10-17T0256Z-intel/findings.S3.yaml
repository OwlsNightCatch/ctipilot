    role: corroborating
  discovery_trace: 'first seen at: hackernews, URL https://thehackernews.com/2026/10/ (monthly archive page, scanned because the feed''s 50-item cap hid 2026-10-11 to 2026-10-13 11:30) -> pivot: https://thehackernews.com/2026/10/sap-discloses-critical-cvss-10-flaw-in.html -> primary: SAP advisory https://github.com/SAP/cloud-sdk-python/security/advisories/GHSA-4mv3-jxxm-9cx2 -> CVE record https://cveawg.mitre.org/api/cve/CVE-2026-89111'
  summary: SAP's advisory of 2026-10-13 (CVE-2026-89111, SAP CVSS 3.1 10.0, AV:N/PR:N/S:C, CWE-918) says the SAP Cloud SDK for Python lets an attacker who controls the tenant_subdomain value a multi-tenant SAP BTP application passes to the SDK redirect OAuth2 token requests to an attacker-controlled server, so the application's client ID and secret are exfiltrated. The advisory names 0.45.2 (released 2026-08-21, RFC 1123 DNS-label validation) as the fix and an allowlist of registered tenant subdomains as the workaround; the affected range is below 0.45.2. The Hacker News reports, from running SAP's own tests against each release, that versions 0.53.0 to 0.55.0 (2026-09-10 to 09-18) skip the check for Destination-service calls (and in 0.55.0 for Document Management calls) after a refactor onto shared token code that SAP's 0.55.1 notes confirm and fix, and that the older 0.36.1 and 0.36.2 releases also lack it; the advisory does not list any version above 0.45.2 as affected and does not say whether the six releases fall under the CVE or whether credentials should be rotated (The Hacker News's testing and reading, not SAP's statement). Only applications that pass a user-influenced tenant subdomain to the SDK are exposed; no exploitation is reported, it is not in CISA KEV and EPSS is about 0.003.
