    reliability: B
    credibility: 2
    why: Hunt.io read the actor's own exposed files (first-hand) and says its country breakdown matches GreyNoise's defender telemetry; the second-RCE claim and the Swiss target rest on Hunt alone
  evidence:
  - quote: The exposed tooling revealed a second PaperCut RCE path through XML-RPC, using api.setConfigValue and api.lookUpUserNameByCardNo when API access controls were weak.
    attribution: Hunt.io
    source_url: https://hunt.io/blog/papercut-attacker-ai-toolkit-exploit-code-second-rce
  - quote: The remaining targets were spread across South Africa, Spain, Sweden, Saudi Arabia, Puerto Rico, Malaysia, Ireland, Chile, Switzerland, and Canada.
    attribution: Hunt.io
    source_url: https://hunt.io/blog/papercut-attacker-ai-toolkit-exploit-code-second-rce
  - quote: ready-with-proxy.txt lists 45 targets with a live, working reverse SOCKS5 pivot at the time of capture.
    attribution: Hunt.io
    source_url: https://hunt.io/blog/papercut-attacker-ai-toolkit-exploit-code-second-rce
  - quote: A PaperCut instance that has already been hardened against the Tapestry bypass is not necessarily protected against this one if its XML-RPC API is exposed with weak access controls.
    attribution: Hunt.io
    source_url: https://hunt.io/blog/papercut-attacker-ai-toolkit-exploit-code-second-rce
  - quote: The authentication token (required on each method call) should be defined in the advanced config key `auth.webservices.auth-token`.
    attribution: PaperCut (product documentation)
    source_url: https://www.papercut.com/help/manuals/ng-mf/common/tools-web-services-tips/
  extended_notes: |-
    Hardening levers (vendor documentation): define auth.webservices.auth-token as a long random secret so the handler never falls back to the admin password, and restrict the allowlist key auth.webservices.allowed-addresses (set in the admin interface or via server-command); PaperCut's page says using the admin password as the token is a risk and recommends TLS for the API. Disable or do not expose /rpc/api/xmlrpc where it is not needed; Hunt also recommends egress filtering for PaperCut servers and treating the service account's reach into AD as the blast radius.
    Detection concepts from Hunt: changes to user-lookup.* settings; new .class files under the PaperCut install tree; short-lived output files under server/custom/web/ served at /custom/ that delete themselves after about 30 seconds; chisel-style command lines, SOCKS listeners and long-lived TLS to non-standard ports from the print server; cron entries referencing a watchdog under /var/tmp; account creation, privilege changes and DCSync-style activity originating from the PaperCut service account or host.
    Caveats: the Swiss mention is one target among 45 and names no sector or organisation; Hunt says it notified national CERTs. IP-level indicators are shared too widely to rely on (Hunt's own caution), so prefer behavioural hunts. Existing entry already carries the GreyNoise 440-instance figures and the patch lineage (26.0.5, 25.0.13, 24.1.10); this item adds only the second path, the persistence and credential playbook, and the scale/country evidence.
- title: 'PwnEscape (CVE-2026-99999): crafted virtio checksum metadata from a guest corrupts host IPv4 header handling, leaking host memory and crashing the Linux host, and in a lab taking it over'
  sources:
  - url: https://pwn.ai/blog/pwnescape
    publisher: pwn.ai
    date: '2026-10-16'
    role: primary
  - url: https://vercel.com/blog/findings-from-the-1-million-dollar-vercel-sandbox-challenge
    publisher: Vercel
    date: '2026-10-14'
    role: corroborating
  - url: https://cveawg.mitre.org/api/cve/CVE-2026-99999
    publisher: Linux kernel CNA (CVE record, JSON API)
    date: '2026-10-15'
    role: primary-record
  - url: https://security-tracker.debian.org/tracker/CVE-2026-99999
    publisher: Debian Security Tracker
    date: '2026-10-17'
    role: vendor-status
  - url: https://access.redhat.com/security/cve/cve-2026-99999
    publisher: Red Hat
