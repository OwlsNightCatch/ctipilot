  summary: 'Qurium Media Foundation (2026-10-14) reconstructs how the address space of the Russian hosting provider Aeza, designated by US Treasury on 2025-07-01 and linked by Qurium to Doppelganger, malware, infostealer, traffic-distribution and BlackSprut hosting, survived exposure and sanctions by moving to successor entities: as of 2026-09-22 Aeza and NetCrafters together originated 536 IPv4 /24 networks (137,216 addresses, over twenty times the roughly 6,400 Aeza announced at the end of 2022), and eleven local internet registries account for more than two thirds of it. One of the largest single sources, Qurium reports, is a legacy IPv4 block registered to Plant Holding GmbH of Buchs ZH, Switzerland (about 11,264 addresses, 8.21 percent), of which 44 /24 networks were in use by Aeza or NetCrafters in Qurium''s September 2026 snapshot; Qurium names the owner and says he also directs a UK IPv4 broker. The RIPE database, queried in this run, independently shows the parent /17 registered with country CH, netname WW-VAN-STRIJ-DE-REGT and organisation handle ORG-PA18-RIPE (the identifiers Qurium lists for Plant Holding), and a sub-allocation labelled Aeza-Network with route objects originating from two Aeza AS numbers. Qurium documents the allocation chain and states no knowledge or intent on the part of the Swiss holder, and the report does not say whether the holder responded; sanctions and licensing consequences are not assessed by any source read. Qurium''s broader finding is that sanctions on legal entities did not remove capacity because routing, prefixes and upstream providers persisted.'
