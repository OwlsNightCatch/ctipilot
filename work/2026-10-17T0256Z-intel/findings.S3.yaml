  discovery_trace: 'first seen at: hackernews, URL https://feeds.feedburner.com/TheHackersNews (item ''NGINX Fixes 5 Flaws, Including Possible RCE and a TLS Bug That May Skip Client-Cert Checks'') -> pivot: https://thehackernews.com/2026/10/nginx-fixes-5-flaws-including-possible.html -> primary: nginx.org security advisories https://nginx.org/en/security_advisories.html'
  summary: 'NGINX released 1.30.6 (stable) and 1.31.7 (mainline) on 2026-10-14 for five vulnerabilities, all of which nginx.org lists as not vulnerable from those versions and rates medium, while F5 (as reported by The Hacker News) scores the three memory bugs 9.2 on CVSS v4.0, the TLS flaw 8.3 and the HTTP/3 flaw 6.9. Each needs a specific configuration: CVE-2026-15176, a heap overflow when an alias location combines with a rewrite that changes the URI and a read of $request_filename (affected 0.1.29 to 1.31.6); CVE-2026-93479, a heap overflow in script evaluation when regex-map captures feed root or log_format before the map''s output variable (1.30.0 to 1.30.5 and 1.31.2 to 1.31.6, a regression path from July''s CVE-2026-42533 fix per the press report); CVE-2026-97205, a use-after-free with aio enabled and SSI include virtual pages (0.8.11 to 1.31.6); CVE-2026-95101, request-body injection past client_max_body_size over HTTP/3 with proxy_request_buffering on, which is the default (1.25.0 to 1.31.6); and CVE-2026-97629, where a shared ssl_session_cache without ssl_session_ticket_key turns on automatic ticket-key rotation that leaves one of three key slots uninitialised, so a forged session ticket may be accepted and may bypass client-certificate verification in a non-deterministic way F5 says the attacker cannot control (1.23.2 to 1.31.6). No attacks are reported for these five and none is in CISA KEV (catalogue released 2026-10-16 checked); the same product''s May rewrite-module overflow CVE-2026-42945 was reported exploited within days of disclosure (VulnCheck, per The Hacker News). NGINX publishes fixes for the two current branches only, so older branches stay in the affected ranges and a distribution package is fixed only if backported; F5 products built on NGINX need their own advisories.'
  region_nexus: global; NGINX terminates TLS or proxies for a large share of public web services including government portals
  primary_sector_nexus: 'indirect: ubiquitous reverse proxy and web server in administration web stacks; mutual-TLS deployments depend on the client-certificate path'
