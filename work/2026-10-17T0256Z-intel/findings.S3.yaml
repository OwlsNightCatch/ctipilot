  summary: 'Check Point Research (2026-10-13) assessed LiteLLM v1.77.7 and reports two issues resolved in 1.83.9: CVE-2026-35029, where POST /config/update relies on the generic API-key dependency without the PROXY_ADMIN role check the sibling administrative endpoints perform, combined with an overly permissive route allowlist for UI-session tokens, so any authenticated user including a low-privileged account can modify the proxy''s runtime configuration, read files, take over the administrator account and obtain remote code execution through malicious Python modules loaded from cloud storage; and CVE-2026-59823, an SSRF in the ''Clientside LLM Credentials'' feature that lets an attacker redirect gateway API calls and exfiltrate provider keys. The gateway stores the API keys for every model provider an organisation uses, which is why Check Point recommends reviewing who holds accounts, rotating provider keys if unauthorised access is suspected, verifying that limited roles are actually limited, and including LLM gateways in penetration tests. No exploitation is reported; EPSS for CVE-2026-35029 is about 0.04 (90th percentile), the highest of the CVEs in this return, and it is not in CISA KEV.'
