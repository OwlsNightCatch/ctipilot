    role: context
  discovery_trace: 'first seen at: hackernews, URL https://feeds.feedburner.com/TheHackersNews (item ''Attackers Tampered with AOMEI Backupper''s Update Servers for Minutes to Deliver a Backdoor'') -> pivot: The Hacker News article, URL https://thehackernews.com/2026/10/attackers-tampered-with-aomei.html -> primary: GTIG/Mandiant blog, URL https://cloud.google.com/blog/topics/threat-intelligence/investigating-ephemeral-supply-chain-tampering -> primary (independent telemetry): ManageEngine METAL, URL https://www.manageengine.com/threat-analysis-lab/aomei-backupper-supply-chain-compromise.html -> vendor context: AOMEI changelog https://www.ubackup.com/changelog.html read directly this run'
  summary: 'Google Threat Intelligence Group (GTIG) and Mandiant, working with the ManageEngine Threat Analysis Lab (METAL, whose EDR first saw the activity on 2026-05-28), disclosed on 2026-10-16 that a cluster GTIG tracks as UNC7017 repeatedly altered two remote configuration files on AOMEI Technology''s update servers between April and July 2026. Each alteration stayed live for only five to ten minutes before the files reverted to genuine content; GTIG confirmed windows on 28 May (10 min), 16 July (6 min) and 20 July (5 min) and says more probably went unseen. No software flaw is involved: the client (METAL examined Backupper 8.3.0; GTIG says the AnyViewer remote-desktop tool uses the same flow) fetches down_html.ini, which names a ZIP and carries its own MD5, and Notifycfg.ini, which tells the notification process what to run; neither file is cryptographically authenticated, so a copy that polled during a window downloaded an attacker-chosen package and ran the unsigned CROSSROAD dropper from its own html directory with the privileges of the AOMEI process. CROSSROAD unpacks a bundle containing a genuine signed Radmin binary, registers a scheduled task that runs it every three hours, then deletes itself and restores the local update file; the Radmin binary side-loads an attacker DLL that loads the SHINYROAD implant (encrypted PocketPy bytecode, remote shell, in-memory extension). It stops if the host geolocates to China, and METAL adds that it stops when specific security agents are present. On some hosts GTIG later saw Adaptix C2 pushed, disguised as Nitro PDF tooling. The 20 July window also pointed the notification popup at a remote WebDAV path through an invisible 1x1 window, which can make Windows send the logged-in user''s NetNTLMv2 response without any program running. GTIG''s telemetry shows IT-services, telecom and higher-education victims in 11 countries including Switzerland, gives no totals and calls victimology opportunistic and likely broader; GTIG names no country or known actor. Vendor status: Mandiant notified AOMEI on 2026-07-17 and AOMEI replied on 07-29 that it had secured its servers; METAL says it has not independently verified containment, and AOMEI''s public Backupper changelog through 8.5.0 (2026-10-09), read in this run, lists no change to update verification. Server-side repair does not clean endpoints that already ran the dropper.'
  region_nexus: Switzerland named by GTIG among 11 affected countries (Australia, Brazil, India, Pakistan, Portugal, Singapore, South Africa, Spain, Switzerland, Turkiye, US); opportunistic, global
  primary_sector_nexus: 'indirect: IT services, telecom and higher education named; backup/cloning software of this class is common on administrator and SMB-managed Windows endpoints, so exposure inside public-sector fleets is plausible but not stated by any source'
  sector: it-services, telecommunications, education
