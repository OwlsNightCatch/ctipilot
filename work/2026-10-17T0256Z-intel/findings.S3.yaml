- title: 'Fox-IT releases an eight-year Cobalt Strike Beacon corpus: 56,843 raw beacons from 30,604 Team Servers, with data on staging decline, DNS beacons and Team Server lifetimes'
  sources:
  - url: https://blog.fox-it.com/2026/10/13/releasing-the-cobalt-strike-beacon-corpus/
    publisher: Fox-IT (NCC Group)
    date: '2026-10-13'
    role: primary
  discovery_trace: 'first seen at: fox-it-blog, URL https://blog.fox-it.com/feed/ (feed listing, newest item dated 2026-10-13 in its URL) -> primary (no pivot needed): https://blog.fox-it.com/2026/10/13/releasing-the-cobalt-strike-beacon-corpus/'
  summary: 'Fox-IT published on 2026-10-13 the dataset behind its Cobalt Strike scanning: 190,182 beacon sightings and 56,843 unique raw beacons with parsed configurations, collected from 30,604 Team Server addresses between 2018-07-04 and 2026-09-29, on Hugging Face (a 52 MB parsed table and a 9.7 GB CaRT-wrapped payload table), plus dissect.cobaltstrike 1.3.0 with layout-independent configuration scanning. Findings Fox-IT highlights: old versions persist (4.9 and 4.5-4.8 share the lead since 2024, 4.10+ small); beacon collection fell to about 200 a month as operators disable staging (host_stage), and only about 32 percent of fingerprinted Team Servers handed out a beacon on average, down from about 40 percent in 2023 to 20-25 percent in 2026, so public scanning sees a shrinking part of the landscape; the median Team Server was reachable for 14 days, 35 percent seen on a single day, 14 percent still serving after three months and 2 percent after a year; DNS beacons declined far less than HTTP(S) ones, which Fox-IT attributes to less attention in public research and OPSEC advice; 128 beacons (0.23 percent) could not be parsed, mostly customised builds, and some early payloads are Metasploit Meterpreter. Fox-IT keeps its scanning fingerprints private.'
