    why: finder, affected operator (Vercel) and the kernel CNA record agree on mechanism, versions and scope of demonstrated impact
  evidence:
  - quote: This is the story of CVE-2026-99999, a Critical rated Linux kernel vulnerability leading to KVM escape.
    attribution: pwn.ai
    source_url: https://pwn.ai/blog/pwnescape
  - quote: The patch was applied to net.git on October 8, 2026, and subsequently merged into the mainline Linus's tree Oct 14th, 2026.
    attribution: pwn.ai
    source_url: https://pwn.ai/blog/pwnescape
  - quote: we expect exploits in weaker configurations to arrive in weeks, and exploits working in default hypervisor configurations to arrive in under a month.
    attribution: pwn.ai
    source_url: https://pwn.ai/blog/pwnescape
  - quote: Almost every major cloud provider isolates customer workloads on this same layer of the Linux kernel, so any defect is shared-infrastructure risk.
    attribution: Vercel
    source_url: https://vercel.com/blog/findings-from-the-1-million-dollar-vercel-sandbox-challenge
  - quote: Mitigation for this issue is either not available or the currently available options do not meet the Red Hat Product Security criteria
    attribution: Red Hat
    source_url: https://access.redhat.com/security/cve/cve-2026-99999
  extended_notes: |-
    Exposure: a Linux host kernel earlier than the fixed stable releases above (or a distribution kernel without the backport) that forwards guest egress through a TAP device into the host IPv4 stack, the path the CVE record describes (tun_get_user -> IPv4 stack -> ip_do_fragment -> skb_checksum_help). Updating only a guest kernel does not help; the host must be patched and rebooted. Read the running host kernel with uname -r and compare against the distribution advisory rather than the bare version number, since vendors backport.
    Detection (what the sources support): host kernel WARN_ONCE or panic traces in the checksum-completion path and unexplained host crashes taking down every guest on it (the CVE text names these paths); guests emitting IPv4 fragments whose header length field disagrees with the packet geometry. No exploitation indicators exist yet.
    Hardening named by Vercel: keep host kernels current, disable nested virtualization and run each microVM under Firecracker's jailer; these narrow impact but do not fix the flaw. The kernel fix is explicitly partial, so watch for the broader ingress-validation follow-up.
    Companion item: Tencent Zhuque Lab's Vghost (CVE-2026-74580), another Linux virtualization-host flaw published 2026-10-12, is returned separately.
    Date note: pwn.ai's page metadata shows 2026-10-17 but The Hacker News linked the write-up by 2026-10-16T01:54Z and the CVE record was published 2026-10-15, so the source date is given as 2026-10-16 at the latest.
