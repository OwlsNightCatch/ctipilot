    publisher: Infosecurity Magazine
    date: '2026-10-14'
    role: corroborating
  discovery_trace: 'first seen at: infosec-magazine, URL https://www.infosecurity-magazine.com/rss/news/ (item ''ROMULUS Malware Server Leverages ClickFix to Deliver Multiple Payloads'') -> pivot: https://www.infosecurity-magazine.com/news/romulus-malware-clickfix-deliver/ -> WebSearch (''forescout.com blog ROMULUS ClickFix panel shared delivery platform Vedere Labs October 2026'') -> primary: Forescout https://www.forescout.com/blog/romulus-analysis-of-a-new-multi-payload-clickfix-delivery-platform/'
  summary: 'Forescout''s Vedere Labs (2026-10-15; Infosecurity dates the post 2026-10-14) found, while investigating an incident, a server hosting a login-protected panel named ROMULUS and, by pivoting on its login page, six servers running it. One of them is the server Huntress reported as hosting the ClickFix script in the ChatGPT Custom GPT campaign, and another served the same Stardock DeElevation sideloading package, so that campaign is one route of a shared platform. Two token-based routes are documented: /s/<token> serves an obfuscated PowerShell staging script (self-deleting, fetches over a decimal-notation IP with a Chrome user agent, then runs msiexec quietly from the temp folder) and /app/<token> serves a trojanized MSI; a second route downloads a nested encrypted archive containing an artificially inflated executable that Forescout identifies as LegionLoader (also called CurlyGate, RobotDropper and Satacom), the inflation being a likely evasion of scanner file-size limits. A statistics page shows installs, runs and a country breakdown per campaign. Forescout does not know the operator and says ROMULUS may be a private panel, a commercial delivery service, an affiliate framework or copied software, and has no evidence linking it to the RomulusLoader Proofpoint reported for Silver Fox. Its hunting guidance is long PowerShell run from the temp folder or against decimal IP addresses, silent MSI installs from temp, PowerShell started with -NoProfile, -ep bypass or -w hidden with a URL, and POST requests whose form body is a single base64 blob.'
  region_nexus: global; no region stated
