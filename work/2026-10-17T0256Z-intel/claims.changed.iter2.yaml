    text: "Requests to `/rpc/api/xmlrpc` that call `api.setConfigValue` or `api.lookUpUserNameByCardNo` from addresses outside the allowlist match the XML-RPC route, and Hunt.io advises disabling the endpoint where it is not needed ("
    urls: ["https://hunt.io/blog/papercut-attacker-ai-toolkit-exploit-code-second-rce"]
