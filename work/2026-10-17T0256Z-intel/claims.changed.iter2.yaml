    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "body"
    kind: cited
    text: "Hunt.io's recovered kit also adds changes to the `user-lookup.*` settings, unexpected files under `custom/web/`, and chisel or cron entries calling out to non-standard ports ("
    urls: ["https://hunt.io/blog/papercut-attacker-ai-toolkit-exploit-code-second-rce"]
  - claim_id: 5bd8f02f8e
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
