    surface: "record 2026-10-17T03:38:00Z"
    kind: record-summary
    text: "Hunt.io recovered the attacker's open directories (2026-10-15) and reports a second route to code execution through PaperCut's XML-RPC API that does not use the Tapestry bypass and works when the API allowlist is too permissive or no explicit token is set, a cron-kept reverse SOCKS tunnel, an offline LSA-secret playbook and 45 victims with live internal pivots, Switzerland among the countries listed. Hunt.io does not report the XML-RPC route used against a victim; PaperCut's documentation names the token and allowlist settings that close it. PaperCut's September bulletin, revised 2026-10-13, now lists CVE-2026-82077 as fixed in 24.1.10 and names 24.1.11 as the v24 build."
  - claim_id: 7fae840387
    entry: 2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access
    surface: "summary"
    kind: frontmatter
    text: "Atlassian's advisory of 2026-10-05 fixes CVE-2026-21589, an unauthenticated arbitrary file access flaw in every version of Bitbucket, Confluence, Jira Service Management, Jira Software, Bamboo and Crowd Data Center, plus Crucible and Fisheye (CVSS 4.0 9.3), and tells customers to patch immediately or take internet-facing instances off the internet. watchTowr Labs published the root cause, the request shape and a runnable checker on 2026-10-06, and exploitation attempts followed the same day: Previdian's sensors had recorded 607 attempts from 65 addresses in 20 countries as of its 2026-10-16 update, SANS ISC recorded similar attempts on its own honeypots, and a Nuclei template exists; neither honeypot operator reports a compromise. CISA added the flaw to its Known Exploited Vulnerabilities catalog on 2026-10-15 on evidence of active exploitation, without saying what the evidence is. Where Jira is integrated with Crowd, the file read exposes a plaintext Crowd application password that gives access to Crowd as an administrator of that application. The CVE record for this ID was marked rejected on 2026-10-16 with only a generic reason, while Atlassian's advisory and fixed versions are unchanged, so tooling keyed on the ID can lose track of an exploited flaw."
