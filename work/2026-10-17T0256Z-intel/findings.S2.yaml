      - { url: "https://www.srf.ch/news/schweiz/pensionskasse-des-bundes-wie-konnten-heikle-daten-bei-externer-softwarefirma-landen", publisher: "SRF", date: "2026-10-10", role: "context (expert reading of the test-data pattern, published before the PKZH finding)" }
    discovery_trace: >
