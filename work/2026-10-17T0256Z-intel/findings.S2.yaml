  - title: "Republik, the Zurich online magazine, discloses that unknown attackers used a flaw in its Metabase analytics tool from August until 2026-10-14: the data of all users left, the flaw had been known since 6 August"
    sources:
      - { url: "https://www.inside-it.ch/republik-gesteht-datenleck-20261016", publisher: "Inside IT (relaying Republik's own statement)", date: "2026-10-16", role: "primary (no Republik-hosted statement was reachable)" }
    discovery_trace: >
      first seen at: inside-it-ch, URL https://www.inside-it.ch/rss.xml (item "Republik gesteht Datenleck", 2026-10-16T09:33Z)
      -> drill: extract https://www.inside-it.ch/republik-gesteht-datenleck-20261016 (full text readable)
      -> WebSearch ("Republik Datenleck Metabase Sicherheitslücke Nutzerdaten republik.ch Hackerangriff", "republik.ch Datenleck Metabase 14. Oktober Eidgenössischer Datenschutzbeauftragter gemeldet") found no Republik-hosted or second-outlet copy
      -> existing coverage: entries/2026-08-09/metabase-unauth-sqli-zeroday-exploited-framework-tally (CVE-2026-72898, CISA KEV 2026-08-11)
    summary: |
      Delta on the covered Metabase CVE-2026-72898 entry, from a Swiss victim. Inside IT reports Republik's own account: one of its analytics tools stopped working on the morning of Wednesday 2026-10-14, which was the end of an
      unauthorised access that had run since August; Republik writes that the vulnerability "had been known since 6 August" but that it failed to take the necessary countermeasures in time. The tool is Metabase; Inside IT does not
      name a CVE, and the 6 August date matches Metabase's own disclosure date for the flaw the entry tracks, so the identification with CVE-2026-72898 is an inference to be confirmed. Republik does not know who is behind it and
      says much points to a broad, automated wave that first looked for what every Metabase installation holds, such as credentials and keys for AI services that can be resold. The data of all users was retrieved (active members
      and subscribers, newsletter subscribers and former users): e-mail address, name and, where stored, telephone number, year of birth and gender; no credit-card data. Metabase was shut down on 14 October, which also ended
      the attackers' access, and Republik reported the incident to the Federal Data Protection and Information Commissioner (FDPIC) on 2026-10-15 after its first damage assessment. Relevance for the Swiss public sector is the
      pattern, not the victim: a self-run Metabase reachable from outside stayed exposed for about ten weeks after a KEV-listed pre-auth flaw with a public fix.
    region_nexus: "Switzerland (private-sector media victim; the product is common in public-administration BI use)"
    primary_sector_nexus: "indirect (private-sector victim, shared exposure of a self-hosted analytics tool)"
    sector: "media (private); transferable to public-sector"
    cves: ["CVE-2026-72898"]
    cve_note: "Inside IT does not name the CVE; the link is the Metabase product plus the 6 August date. Mark as 'presumed' if the composer carries it."
