    extended_notes: |
      Where the 2026-10-15 notices sit against the covered entry: (1) its 2026-10-15 update said PKZH "is still clarifying whether" migration-test data was affected; that is now answered yes by PKZH itself
      (the page quoted above, dated 2026-10-15; Inside IT reports it on 2026-10-16). (2) The 2026-10-10 update recorded Pensionskasse Post saying its data at PK Softech is anonymised; the 2026-10-15
      Post notice does not repeat that and says personal data did leave (whether Post insureds are among it is still open). (3) The entry's takeaway about quoting AHV number / IBAN as proof of identity is
      reinforced by PKZH's own FAQ: it says name, AHV number or IBAN alone cannot trigger a payout there and that a change of bank details is checked additionally, but that criminals can use the data to appear credible;
      AHV number and date of birth cannot be changed, so PKZH tells members to stay cautious long-term.
      Suggested action tweak (only if the composer keeps actions[]): organisations that hand a supplier "realistic" data for a migration test or evaluation should ask in writing whether that data sat in the
      affected PK Softech environment (PKZH shows this is how a fund that is not yet a production customer was hit).
      Verification note: the entry may stay `notable`; this is a scope widening (PKZH confirms an outflow of its own insured persons' and pensioners' data, Pensionskasse Post confirms that personal data left without yet saying whose; BPK still says it has no indication and BLVK is still checking), not a new incident.
