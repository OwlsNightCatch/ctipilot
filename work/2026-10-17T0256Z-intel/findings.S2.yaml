  - title: "Safepay leaks the data of DD-Automation (Aesch BL), a sub-supplier of the contractor that runs the conveyor technology of the Swiss Army's logistics base; the Army says no interfaces exist and the data does not affect site security"
    sources:
      - { url: "https://www.inside-it.ch/ransomware-angriff-trifft-sublieferanten-der-armee-20261016", publisher: "Inside IT", date: "2026-10-16", role: "primary (carries the Army media office's own statement; full text only in the raw HTML, see extended_notes)" }
      - { url: "https://www.ransomware.live/group/safepay", publisher: "Ransomware.live (tracker)", date: "2026-10-16", role: "corroborating (leak-site listing of dd-automation.ch, discovery date 2026-10-05, attack estimate 2026-09-25)" }
    discovery_trace: >
      first seen at: inside-it-ch, URL https://www.inside-it.ch/rss.xml (item "Ransomware-Angriff trifft Sublieferanten der Armee", 2026-10-16T13:28Z)
      -> drill: extract https://www.inside-it.ch/ransomware-angriff-trifft-sublieferanten-der-armee-20261016 returned only the lead and the first paragraph ("Abo" paywall)
      -> bridge: python3 tools/fetch_source.py url <same URL> returned the full article text inside the page's embedded JSON (rawState.blocks[].text)
      -> corroboration (claim only): https://www.ransomware.live/group/safepay (fetched with the bridge `url`; row "dd-automation.ch Safepay Discovered: 2026-10-05 ... Attack est.: 2026-09-25")
      -> WebSearch ("DD-Automation Ransomware Safepay Armee Logistik Aesch") found no second outlet; DD-Automation told Inside IT it may not give media information
    summary: |
      Inside IT reports that the ransomware group Safepay claimed an attack on DD-Automation of Aesch (BL), a maker of controls used mainly in logistics, at the start of October and a few days later put a data package
      on its leak site; Inside IT's look at the directory shows folders attributable to DD-Automation's customers, among them one titled "Armasuisse" with sub-folders for logistics centres of the Swiss Army.
      The Army's media office told Inside IT that DD-Automation is a sub-supplier of Gilgen Logistics, an Army contractor that operates the conveyor technology of the narrow-aisle warehouses of the Army Logistics Base,
      that Gilgen informed the Army of the incident, that no interfaces exist between the Army and DD-Automation (remote access is the example it gives), that DD-Automation does hold address data and contacts
      at the Logistics Base, that the affected people were contacted and told not to open suspicious mails, attachments or links, that messages with changed payment or invoice details need particular caution (verify
      only through known contacts), and that the stolen data and documents have no effect on the security of the logistics sites. DD-Automation declined to comment to Inside IT. The tracker Ransomware.live independently
      lists dd-automation.ch under Safepay with discovery 2026-10-05 and an attack estimate of 2026-09-25; that is the criminals' claim as recorded by a tracker, not a victim statement. Inside IT adds that Safepay has
      hit other Swiss victims in recent weeks (the supplement maker Bio-Strath, which confirmed an attack, and a hotel in Lugano, which confirmed one and cited the criminal investigation); the registry already tracks
      the Manno (TI) commune listing by the same group. No access vector, no encryption detail and no ransom information is public.
