  - title: "PK Softech supplier incident: the Pensionskasse Stadt Zürich now says its insured persons' and pensioners' data, supplied for migration tests, was stolen; Pensionskasse Post says personal data did leave"
    sources:
      - { url: "https://www.pkzh.ch/de/aktuelles/cyberangriff-softech.html", publisher: "Pensionskasse Stadt Zürich (PKZH)", date: "2026-10-15", role: "primary" }
      - { url: "https://www.pkpost.ch/news/263-cyberangriff-bei-softwarelieferant-versichertendaten-moeglicherweise-betroffen", publisher: "Pensionskasse Post", date: "2026-10-15", role: "primary" }
