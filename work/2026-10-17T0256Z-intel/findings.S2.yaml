      - quote: "Various issues related to DAG members not being able to reach quorum have been reported too."
        attribution: "Microsoft Exchange Team"
        source_url: "https://techcommunity.microsoft.com/blog/exchange/exchange-servers-may-become-unstable-after-installation-of-october-2026-windows-/4565382"
      - quote: "/v EpmapSavedContextCap /t REG_DWORD /d 65536 /f"
        attribution: "Microsoft Exchange Team"
        source_url: "https://techcommunity.microsoft.com/blog/exchange/exchange-servers-may-become-unstable-after-installation-of-october-2026-windows-/4565382"
    extended_notes: |
      Detection/triage hook (vendor-described symptoms only): Exchange Application log event 1006 together with OWA MapiExceptionMdbOffline errors, growing transport queues and DAG quorum alerts after an October Windows
      Server update. Benign-lookalike discriminator for an SOC that sees mail-flow stalls on Exchange this week: this pattern is a patch regression, not an intrusion; a genuine exploitation lead for the October Exchange SU
      flaw would look different (entry 2026-10-14/exchange-oct-2026-su-cve-2026-70571-last-2016-2019-update).
