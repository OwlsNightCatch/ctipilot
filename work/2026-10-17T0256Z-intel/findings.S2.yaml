  - title: "Microsoft Exchange Team: the October Windows Server cumulative updates can make Exchange servers unstable (OWA MapiExceptionMdbOffline, growing mail queues, DAG quorum loss); the vendor says do not uninstall them and gives a registry workaround"
    sources:
      - { url: "https://techcommunity.microsoft.com/blog/exchange/exchange-servers-may-become-unstable-after-installation-of-october-2026-windows-/4565382", publisher: "Microsoft Exchange Team blog", date: "2026-10-17", role: "primary" }
      - { url: "https://techcommunity.microsoft.com/blog/exchange/released-october-2026-exchange-server-security-updates/4563014", publisher: "Microsoft Exchange Team blog", date: "2026-10-16", role: "primary (carries the 2026-10-16 update note pointing to the post above)" }
      - { url: "https://www.heise.de/news/Oktober-Updates-legen-Exchange-Server-lahm-11490529.html", publisher: "heise online", date: "2026-10-16", role: "corroborating" }
    discovery_trace: >
      first seen at: heise-sec, URL https://www.heise.de/security/feed.xml (item "Microsoft untersucht Exchange-Probleme nach Updates", 2026-10-16T10:24Z)
      -> drill: extract https://www.heise.de/news/Oktober-Updates-legen-Exchange-Server-lahm-11490529.html (names the four KBs and links the Exchange team's October 2026 SU post)
      -> primary: https://techcommunity.microsoft.com/blog/exchange/released-october-2026-exchange-server-security-updates/4563014 (fetched with extract; its 2026-10-16 update note links the new post)
      -> primary: https://techcommunity.microsoft.com/blog/exchange/exchange-servers-may-become-unstable-after-installation-of-october-2026-windows-/4565382 (fetched with the bridge `url`; JSON-LD datePublished 10/17/2026 1:00:38 AM, modified 2026-10-16T18:02-07:00)
    summary: |
      Operational regression on the Exchange side of the October 2026 patch cycle, relevant to Swiss public-sector Exchange operators. The Exchange team says that since 13 October it has seen reports of Exchange servers becoming
      unstable after a set of October Windows Server updates: OWA failing with "MapiExceptionMdbOffline: Unable to make connection to the server" (hr=0x80004005, ec=1142) and event 1006 in the Application log, mail queues growing during
      the day, DAG members unable to reach quorum, a reboot helping only temporarily; Exchange 2016, 2019 and Subscription Edition can all be hit. It states the problem is not caused by the October Exchange security updates
      (so it is not a "known issue" of those) but by Windows updates KB5126646 (Windows Server 2025), KB5126655 (2022), KB5126651 (2019) and KB5126868 (2016); impact depends on load and some servers may never see it. Recommendation: do not
      uninstall the October 2026 Windows Server updates; on the Exchange server set the registry value EpmapSavedContextCap (REG_DWORD) under HKLM\SOFTWARE\Microsoft\Rpc to 65536, reboot, monitor, and raise the limit if it recurs,
      which the vendor says solved the cases it has assisted. heise adds that Microsoft had updated its warning on 2026-10-15 and that a Microsoft staff member said in the comments that day that no workaround existed yet, so the
      registry workaround is new on 2026-10-16/17.
    region_nexus: "global; any on-premises Exchange estate, including Swiss federal, cantonal and communal administrations"
    primary_sector_nexus: "indirect (product class widely used in public administration)"
    sector: "public-sector (generic)"
    cves: []
    techniques: []
    technique_note: "No attacker behaviour: this is a patch-induced availability regression, so no ATT&CK mapping applies. The covered Exchange entry carries the exploitation mapping."
    affected_products: ["Microsoft Exchange Server", "Microsoft Windows Server"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "update-of:2026-10-14/exchange-oct-2026-su-cve-2026-70571-last-2016-2019-update"
    borderline: true
    borderline_reason: "Availability regression, not a threat; S1 may also return it. Kept because it changes a patch decision (the Exchange team says not to uninstall, and the same October cycle carries fixes the store tracks as exploited) and gives a vendor workaround. Whether KB5126646/-55/-51/-868 contain the fix for the exploited Windows Shell flaw (entry 2026-10-14/cve-2026-96951-windows-shell-motw-bypass-zero-day-kev) is NOT stated by either source and must be checked against MSRC before the composer links them."
    classification_suggestion: "A1 (vendor's own post; heise corroborates the symptoms)"
