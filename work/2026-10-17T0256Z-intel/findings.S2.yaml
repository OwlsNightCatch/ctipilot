  - "Bürgerrechtler/Bitkom paper on vulnerability management in the German intelligence-law reform (heise 2026-10-16): German legislative advocacy, no obligation on the constituency."
  - "Cnaf / Vacaf platform leak (Le Monde Informatique 2026-10-13; FrenchBreaches claim of about 1.2 million records unconfirmed): French social-security body, supplier-hosted platform, no vector, no Swiss nexus; only its NIS2 remark is used above."
  - "Offerz (Inside IT/Netzwoche 2026-10-15/16, 115,000 customers' order data via a test environment) and Ricardo-class consumer breaches: private-sector, no public-sector nexus (incident floor, as the 2026-10-10/11/12/13 fires decided)."
  - "Albert Heijn cyberattack (NL Times 2026-10-12 to 2026-10-16): private retailer, S4 territory, no public-sector nexus."
  - "German municipal DDoS at the Cham district office is folded into item 4 as a contrast; ZIDKOR (Rhineland-Palatinate) NetScaler shutdown and faulty-update outage of 2026-09-27/30 predate the window and follow the covered NetScaler entries."
  - "NCSC.ch security-hub advisories of 2026-10-16 (Drupal, Cisco SEG, BeyondTrust, PAN-OS): all four already have entries; adding the NCSC advisory as a source is an S1 call."
  - "Kaspersky survey on Swiss executives' ransom fears, BACS 'Swiss-washing' online-shop warning (week 41), Kapo Zürich PostFinance phishing warning: consumer/awareness content."
  - "Next.ink: EU Commission inquiries into AI-agent hacking (2026-10-15) and ECB/BoE/Fed AI-resilience demands on banks (2026-10-14): neither changes an obligation for the Swiss public sector."

candidate_sources:
  - { id: br24-bayern, publisher: "BR24 Bayern (Bayerischer Rundfunk)", url: "https://www.br.de/nachrichten/bayern", category: "ch-eu / news", why: "Public broadcaster with fast regional reporting that relays municipal and district statements and names the investigating authorities (Eichstätt, Cham this window); reliability B; article bodies read cleanly with extract; no feed probed." }

promotion_notes:
  - "kommunaler-notbetrieb-de (candidate, reliability D): in this run's 97 h horizon its listing carried two German municipal incidents (Eichstätt, Cham) with dated cards and links to the municipality's own page or the broadcaster's article; extract of the root page returns a clean structured listing. It performed as a discovery aggregator; keep it a candidate, but its recipe can move from webfetch to extract."

coverage_gaps:
  - { source_id: inside-it-ch, reason: "recipe finding: article pages with the 'Abo' paywall return only the lead and first paragraph through extract (the Ransomware/Armee article, the PKZH article), but the full text is embedded in the raw HTML as JSON (rawState.blocks[].text); `python3 tools/fetch_source.py url <article URL>` returns it and a short Python JSON parse recovers the paragraphs. The 2026-10-16 note that extract reads articles cleanly holds for non-paywalled articles (Republik, Beyond Gravity)." }
  - { source_id: enisa, reason: "recipe confirmed: `extract https://www.enisa.europa.eu/news` returns the listing (undated) via trafilatura-direct; per-item dates need `extract https://www.enisa.europa.eu/news/<slug>` (frontmatter date). fetch_method could be recorded as bridge/extract rather than webfetch." }
  - { source_id: cnil-fr, reason: "recovered: the 2026-10-15 maintenance 503 is gone; `extract https://www.cnil.fr/fr/actualites` returned dated items (newest 2026-10-16)." }
  - { source_id: edpb, reason: "recipe: `extract` of the news listing returns only the page header, while `url https://www.edpb.europa.eu/news/news_en` returns the dated items (parse the title, date and /news/<slug>_en href pattern)." }
  - { source_id: ncc-research, reason: "recipe: `url https://www.nccgroup.com/research-blog/` lists /research/<slug>/ hrefs without dates; per-item `extract https://www.nccgroup.com/research/<slug>/` carries the date in its frontmatter (items dated 2026-10-06, 10-09, 10-12)." }
  - { source_id: ico-uk, reason: "recipe: `ico-uk enforcement 10` returned ten enforcement URLs with no titles or dates; the date is only inferable from the /YYYY/MM/ path (newest 2026/09 on 2026-10-17)." }
  - { source_id: le-monde-info, reason: "recipe: `url .../securite-informatique-3.html` is ISO-8859-1 (mojibake unless decoded as latin-1) and each date precedes its item ('le 13 Octobre 2026 / <category> <title>'), so a regex must pair a date with the following item, not the preceding one." }
  - { source_id: swisscybersecurity-net, reason: "not in my slice, noted for the owner: `extract` of the home page returns a dated headline list, but `extract` of an article URL (e.g. .../news/2026-10-15/update-china-koennte-hinter-dem-cyberangriff-auf-beyond-gravity-stehen) returned an ad-tracker page (match.adsrvr.org) instead of the article." }
  - { source_id: heise-sec, reason: "no gap; note that the feed's 20-item window reaches back only to 2026-10-13, so a 26 h sweep is complete." }

