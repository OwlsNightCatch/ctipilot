    summary: |
      The city administration of Eichstätt (Upper Bavaria) became aware of a cyberattack on Monday 2026-10-12 (BR24: the attack probably happened over the weekend), when staff reported IT problems; the IT department
      noticed the attack from outside and took the local servers off the network. Town hall and branch offices were closed and e-mail was down. According to BR24's report of the city's statement of Tuesday evening, "a large
      part of the administration's data" was probably copied; the backup worked, so the data can be restored; investigators (the Bavarian cybercrime unit ZCB and the state criminal police office LKA, which took over) assume
      ransomware, and no ransom demand has reached the city yet. Origin, method and the data concerned are unknown, and the city warned about forged invoices in its name. The utilities (Stadtwerke) were not affected. For contrast, the
      Cham district office and several of its 39 connected municipalities were hit on 2026-10-08 by a DDoS flood from compromised systems in about 50 countries; e-mail, telephony and internet services dropped out for part of
      the day, no data was taken or altered, and normal operation resumed the same afternoon.
