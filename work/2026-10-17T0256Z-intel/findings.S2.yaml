      -> primary: https://www.pkpost.ch/news (listing) -> https://www.pkpost.ch/news/263-cyberangriff-bei-softwarelieferant-versichertendaten-moeglicherweise-betroffen (2026-10-15)
      -> context: https://www.srf.ch/news/schweiz/pensionskasse-des-bundes-wie-konnten-heikle-daten-bei-externer-softwarefirma-landen (fetched by extract)
    summary: |
      Delta on the covered PK Softech entry. The Pensionskasse Stadt Zürich (PKZH, the City of Zurich's pension fund) said on 2026-10-13 only that it was checking whether migration-test data was in the affected
      environment; its notice of 2026-10-15 now states that its enquiries indicate personal data of PKZH insured persons was stolen in the attack, and its FAQ adds that the stolen data from PK Softech's system
      includes data of insured persons and of pensioners. The data was handed to PK Softech as test data for the planned switch to PK Softech's administration system in early 2027 (the fund still runs another
      provider's system, which is not affected); the fund says it was told on 2026-10-13, that the suspicion was confirmed, that it filed a criminal complaint and reported to the data-protection office, and that
      which data was taken is still being clarified. "In the worst case" the fields are first name, name, date of birth, AHV number, address, private and business e-mail and telephone, insured salary and
      retirement assets, civil status, partner details and IBAN. The FAQ also says a payout needs a signed written request plus identity check (plus spouse consent for married members) and that bank-account changes
      are checked additionally, and that whether PK Softech met its contractual duty to protect the transferred data is under investigation. Pensionskasse Post's notice of 2026-10-15 now says the investigation has
      shown personal data did leave, while still saying it is unclear whether Post insureds are among them; the fetched 2026-10-15 text no longer repeats the 2026-10-09 statement that Post's data at PK Softech
      is anonymised, and lists name, address, date of birth, AHV number, contact details, e-mail and pension data as possibly affected. Still not public in any source read: access vector, actor, ransom demand,
      per-fund scope. The transferable lesson, which SRF's 2026-10-10 expert interview had named as one of two possible routes into the supplier's environment, is production-derived test and migration data placed at
      a supplier before the system goes live.
    region_nexus: "Switzerland (City of Zurich municipal pension fund; Swiss Post pension fund)"
