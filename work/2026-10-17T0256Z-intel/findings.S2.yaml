    borderline: true
    borderline_reason: "Swiss, victim-confirmed, but a private-sector magazine, one trade-press relay of the victim's statement, CVE not named by the source; useful as the first Swiss victim of the covered Metabase exploitation and as a patch-lag illustration (6 August to 14 October). Drop if the composer judges it adds nothing to the covered entry's decisions."
    classification_suggestion: "C2 (Inside IT relays the victim's own statement; no independent confirmation)"
    evidence:
      - quote: "Unbekannte haben eine Sicherheitslücke in einem Analyse-Werkzeug ausgenutzt."
        attribution: "Inside IT"
        source_url: "https://www.inside-it.ch/republik-gesteht-datenleck-20261016"
      - quote: "Die Sicherheitslücke war seit dem 6. August bekannt, aber wir haben es versäumt, rechtzeitig die nötigen Gegenmassnahmen zu treffen"
        attribution: "Republik, as quoted by Inside IT"
        source_url: "https://www.inside-it.ch/republik-gesteht-datenleck-20261016"
      - quote: "Die Angreifer hätten zuerst nach dem gesucht, was in jeder Metabase-Installation – dem Tool mit der Sicherheitslücke – stecke, etwa Zugangsdaten und Schlüssel für KI-Dienste, die sich weiterverkaufen liessen."
        attribution: "Inside IT"
        source_url: "https://www.inside-it.ch/republik-gesteht-datenleck-20261016"
      - quote: "Vieles spreche für eine breite, automatisierte Angriffswelle."
        attribution: "Inside IT"
        source_url: "https://www.inside-it.ch/republik-gesteht-datenleck-20261016"
    extended_notes: |
      Exposure/Detection angle the covered entry already carries (Metabase's published indicator: a POST to /api/session/reset_password answered 400 followed by a successful GET /api/user/current; block public access to that
      path; revoke sessions, rotate every connected database credential). The Republik account adds that the attackers harvested what a Metabase instance stores (connection credentials, keys) first, which is why
      credential rotation for every connected data source, not only for Metabase users, is the post-patch step for any self-hosted instance that ran an unpatched build after 2026-08-03.

