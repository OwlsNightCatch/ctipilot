    role: primary
  discovery_trace: 'first seen at: heise-sec feed, URL https://www.heise.de/security/feed.xml -> heise article https://www.heise.de/news/Nach-Hackerangriff-Akute-Gefaehrdung-fuer-Berlins-Verwaltung-gebannt-11490231.html (cites the Senatskanzlei via Tagesspiegel; the Tagesspiegel original and a Berlin.de release were not located; a WebSearch for them found only August coverage)'
  summary: 'heise online (dpa) reports on 2026-10-16 that, per Berlin''s Senatskanzlei, the acute threat-response phase after the August compromise of the Landesnetz is over: there have been no attacks on the examined areas of the state network since 13 August, and the attacker did not manage to infiltrate the network durably. The Senatskanzlei says analysis of the exfiltrated data continues, IT-protection measures keep being strengthened and prosecution continues. The article''s recap restates what the existing entry already records: data taken 7 to 12 August from two Senate administrations, isolation on 14 August, extortion by Rhysida (30 bitcoin), refusal to pay, publication of about 1.44 million files on 4 September, and a BSI warning on 5 September.


    Single secondary report (heise/dpa) relaying a government statement; the Senatskanzlei statement itself was not retrieved.'
