  summary: 'The Administrative Office of the US Courts said on 2026-10-15 that BAE Systems IT and the websites supporting the Bankruptcy Noticing Center (BNC) had been hit by a cybersecurity incident. BAE operates the BNC on behalf of the federal judiciary; all access to the BNC systems and websites, including the National Creditor Registration Service, is unavailable and production and distribution of bankruptcy notices for all federal bankruptcy courts has halted. SecurityWeek, citing the US Bankruptcy Court for the Eastern District of Texas, reports that BAE first told the Administrative Office about the problem late on 2026-10-09, that several courts posted ''service disruption'' notices on 10-13 without mentioning a cyber incident, that paper and electronic notices issued since 10-09 have not been delivered, that e-filing notifications to attorneys and trustees and new case filings continue, and that no restoration date exists. BAE told BleepingComputer and SecurityWeek it is aware of a security incident that is isolated to the BNC system. Neither the judiciary nor BAE has said what caused the incident, whether it was an attack, or whether data was compromised. No claim of responsibility appears in the sources.


    Status per source: the outage and its scope are the judiciary''s and BAE''s own statements; cause, attack type, actor and data impact are unknown and nothing in the sources supports a vector.'
