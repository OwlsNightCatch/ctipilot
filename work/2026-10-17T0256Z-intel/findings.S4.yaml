  summary: 'Arkadia Co., Ltd. (Minoh, Osaka) runs SpeeCAN RAIDEN, a multi-tenant cloud service that Japanese municipalities, fire departments and companies use to push disaster and crime-prevention alerts to residents by e-mail, phone and fax and to call out or account for their own staff. The vendor says it saw suspicious behaviour at 16:30 JST on 2026-10-11, sealed the intrusion path around 03:00 on 10-12 and, on 10-13, identified the path, blocked the source IP address and emergency-stopped the two services that were the path (the main RAIDEN tenant and its school-facing service). On 10-14 it added that its NET119 service (pre-registered emergency-call reporting for deaf and speech-impaired residents, operated for fire departments) and its 119RAIDEN service also showed traces of unauthorised access. All stopped services were restored on 10-15 and every customer was told to change its login password; the vendor says the intrusion path is closed, no rogue program is present, and that it is still working through vulnerabilities, but it names neither the vulnerability nor the actor, and it states exposure as ''possible'' rather than confirmed theft.


    Vendor-stated maximum exposure for the RAIDEN estate (estimates, investigation continuing): about 3.136 million e-mail addresses, about 105,000 phone numbers and about 15,000 fax numbers, plus contact names, contact-person and contract data and the message bodies kept in delivery histories. On 2026-10-16 the vendor revised NET119 to personal data tied to 9,020 e-mail addresses (users'' name, date of birth, sex, address, phone, e-mail, fax) and said no special-care personal information was leaked; 119RAIDEN stays at about 97,000 e-mail addresses, 17,000 phone and 400 fax numbers. Also on 10-16 the vendor said that, after consulting Japan''s Personal Information Protection Commission, it is preparing to file the regulator report on its customers'' behalf (customers would otherwise each have to report, and must consent). The vendor told INTERNET Watch the service had 875 deployments at the end of September and that the whole service is affected.


    Customer-side facts: Japan''s MIC said (Kyodo, 2026-10-14) that 36 municipalities had reported stopped alert services as of 21:00 on 10-13; Nikkei, as compiled by Piyolog, counted 111 bodies (6 prefectures, 104 municipalities, 1 union) reporting a stop or a possible leak as of 17:00 on 10-14. Operational effects named by the customers themselves (per municipal notices as compiled by Piyolog): Okayama lost phone notification of dam releases and its staff mobilisation broadcast, Ayase was left with only its public-address radio for emergency information, and Saga''s fire-brigade call-out mails stopped arriving. Shizuoka itself confirms that 34,336 residents'' e-mail addresses and 6,915 city staff (name, staff number, department) leaked. By 2026-10-15 several customers had resumed delivery (Fukui, Nagahama, Kagawa, Otaru, Kainan) while Konan kept its system off pending its own safety check. Shizuoka, Matsumoto, Sasebo and Konan report suspicious or phishing mails reaching registrants after the intrusion (Shizuoka and Sasebo describe credit-card-company lures); Shizuoka calls its sample a spoofed mail ''possibly related'', the others say a link to the intrusion is not established.


    Assessment status: facts above are vendor and customer statements. The vendor''s wording (''vulnerabilities are being addressed'', an external source IP identified) is consistent with exploitation of an internet-reachable service, but that is an inference: no source names the vector, the data theft is ''possible'', and no actor has been named or has claimed it.'
  region_nexus: Japan (outside the home region). Transferable to Swiss communes, cantons and blue-light organisations that delegate resident alerting, staff call-out or emergency-report registration to a multi-tenant SaaS notification provider; no Swiss victim or Swiss customer of this vendor is reported.
