  summary: 'FLC (Femern Link Contractors), the construction consortium building the Fehmarnbelt immersed tunnel between Denmark and Germany, was the target of a cyberattack in the night to Monday 2026-10-12, per NDR. Sund & Bælt, the Danish state project company behind Femern A/S, said on 2026-10-13 that its contractor had told it of a cyber incident and that it had no further information; FLC confirmed the incident on its own website and says it cannot give details while investigations run. Danish police are investigating. Media reports relayed by heise and NDR (Lolland-Falsters Folketidende, TV 2) say the attack knocked out staff access cards, site computers, WLAN and e-mail, and specialised equipment: construction vessels that depend on precise positioning could not leave port and cranes were shut down. By 2026-10-16 Femern A/S says several IT systems on site are still affected but earth works continue on both sides, concrete works are partly under way and the production plant in Rødbyhavn should restart soon; preparatory tests for lowering the first special element went ahead.


    Claims and unknowns: TV 2 reports, as relayed by NDR, that the attackers exploited a security hole to gain access; no official source confirms the vector, an actor, ransomware, or data theft. Danish officials framed the incident as showing national vulnerability; heise notes Denmark is exposed to Russian hybrid attacks, but no source attributes this attack.'
