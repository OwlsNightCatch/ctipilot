    attribution: Piyolog (compiling Nikkei)
    source_url: https://piyolog.hatenadiary.jp/entry/2026/10/14/014350
  extended_notes: 'Admiralty suggestion: source reliability A for the vendor and the customer municipalities on their own facts, B for the press compilations; credibility 1 (vendor, a customer municipality and MIC via Kyodo are independent first-hand observers of the same event). Priority suggestion: notable (no Swiss victim; strong analogue for any Swiss commune or blue-light service using hosted alerting).


    Exposure (for the entry''s Exposure line, from the sources): any organisation whose resident alerting, staff call-out or emergency-report registration runs on a provider-hosted multi-tenant platform where the provider also stores contact lists, staff safety-confirmation records and message histories. Customers learned of the exposure late and unevenly: Okayama says the vendor contacted it on 10-13 at 10:48, while Saitama and Yokosuka report first hearing of it from residents'' inquiries about suspicious mail (per Piyolog''s compilation). Note the mix of data classes: staff muster lists with name/staff number/department, dam-release call lists, and a registry of users who report emergencies by text (per Piyolog''s reading of Toyooka''s release, NET119 handles users'' medical history and family doctor; the vendor says no special-care data leaked: treat as handled, not confirmed leaked).


    Detection concepts (telemetry class first): inbound mail to alert subscribers and staff that claims a financial lure while borrowing the alerting service''s sender identity (mail gateway authentication results: SPF/DKIM/DMARC alignment against the provider''s sending domain; user-reported phishing queue); helpdesk reports of unsolicited mail referencing alert registration; provider-portal audit logs (admin logins, password resets, API or export events) for the period around 2026-10-11; delivery-history exports. Post-incident check from the vendor''s own instruction: rotate every administrator login for the platform. Triage discriminator (from Shizuoka''s notice): legitimate alerts from the service carry alert content only and the city sends only disaster information from that sender; a message from the same sender domain asking to confirm credit-card use is not an alert. The sender string alone does not discriminate (Shizuoka says the lure displays a fragment of the genuine sender address).


    Defender takeaway candidates (derived from the stated mechanics, not from a source): treat provider-hosted alert, callout and registry data as crown-jewel contact data; have a tested non-SaaS fallback channel (Ayase and Okayama show what happens without one); know whether delivery-history message bodies are retained by the provider; contract for provider breach notification and for who files the regulator report (here the vendor consulted the PPC to file on its customers'' behalf).


    Not in any source and therefore omitted: attacker identity, vulnerability, dwell time, whether data was actually exfiltrated, whether the phishing is operationally linked.'
