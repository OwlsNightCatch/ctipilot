    text: "Cisco's eMudhra advisory reached version 1.8 on 2026-11-06 with a CA-trust distrust guide for IOS XE and NX-OS and MDS releases listed as impacted without a remediation; Apple's own page confirms that the curl, git, python3 and openssl that ship with macOS keep trusting the intermediates until a future update, and heise reports that macOS 27.2 undid the manual workaround and that Apple's change is not expected before December. Google's post adds that Chrome 153 and higher will stop trusting by default certificates under emSign Root CA - G1 whose earliest SCT is after 2026-11-16, and Apple's page dates its blocks to 2026-10-19 and 2026-10-23."
