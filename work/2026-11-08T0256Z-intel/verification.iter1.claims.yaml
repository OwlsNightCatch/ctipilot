  - {claim_id: 85691a92f0, verdict: ok, source_url: "https://workos.com/security/bulletins/update-for-october-30th-2026-data-security-incident", passage: "Derived generalisation of the stated root cause: legacy platform, public network exposure, dev credential in production, no rate limiting"}
  - {claim_id: 9dc70c291c, verdict: ok, source_url: "https://apiiro.com/blog/coding-agents-leaking-secrets-github-dont-ask-again", passage: "Out of 104,185 public copies of this file on GitHub, 1,122 hold a real secret ... one in five of those files is flagged by neither gitleaks nor TruffleHog"}
  - {claim_id: 11969cb92e, verdict: ok, source_url: "https://apiiro.com/blog/coding-agents-leaking-secrets-github-dont-ask-again", passage: "Of the 1,122 files with a real secret, gitleaks flagged 564 and TruffleHog 643; 215 were flagged by neither; Claude Code adds it to the developer's global git ignore list"}
  - {claim_id: 52ba6e442c, verdict: ok, source_url: "https://apiiro.com/blog/coding-agents-leaking-secrets-github-dont-ask-again", passage: "Search your GitHub organization for .claude/settings.local.json and .claude/settings.json ... Check each repo's git history ... Rotate every credential the file has ever held (public/private and contractors not in source; see F18)"}
