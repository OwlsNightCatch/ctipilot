  - {claim_id: d7e98d82d2, verdict: ok, source_url: "https://apiiro.com/blog/coding-agents-leaking-secrets-github-dont-ask-again", passage: "Counting the file's history, the shared settings file and agent transcripts ... 2,539 distinct real secrets in 1,994 repos"}
  - {claim_id: 545347b305, verdict: ok, source_url: "https://apiiro.com/blog/coding-agents-leaking-secrets-github-dont-ask-again", passage: "gitleaks flagged 564 and TruffleHog 643; 215 were flagged by neither ... A password typed after PGPASSWORD=, sshpass -p or mysql -p is an ordinary word in an ordinary command line"}
  - {claim_id: 9c52f30856, verdict: ok, source_url: "https://apiiro.com/blog/coding-agents-leaking-secrets-github-dont-ask-again", passage: "The same file sits in plain text on every laptop where someone clicked 'don't ask again.'"}
  - {claim_id: d3f64ca458, verdict: ok, source_url: "https://apiiro.com/blog/coding-agents-leaking-secrets-github-dont-ask-again", passage: "Search your GitHub organization for .claude/settings.local.json and .claude/settings.json ... Check each repo's git history"}
