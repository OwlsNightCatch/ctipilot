  - {claim_id: 4b1436e578, verdict: ok, source_url: "https://apiiro.com/blog/coding-agents-leaking-secrets-github-dont-ask-again", passage: "Found something: rotate first, clean up second ... untrack it with git rm --cached ... add it to the repo's own .gitignore ... Add .claude/settings.local.json to your org's .gitignore templates"}
