  - title: "Chainalysis: an actor using 'offensive agentic techniques' exposed names, usernames, password hashes and live tokens for all users and reached some KYT accounts; products restored 2026-11-07 behind trusted-IP allowlisting, password resets and API-key rotation"
    sources:
      - { url: "https://www.chainalysis.com/blog/security-incident-october-30/", publisher: "Chainalysis", date: "2026-11-07", role: "primary" }
