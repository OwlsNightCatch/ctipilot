      - { url: "https://www.bleepingcomputer.com/news/security/chainalysis-discloses-data-breach-from-offensive-agentic-techniques/", publisher: "BleepingComputer", date: "2026-10-31", role: "corroborating" }
    discovery_trace: "first seen at: bleepingcomputer, URL https://www.bleepingcomputer.com/feed/ (item https://www.bleepingcomputer.com/news/security/chainalysis-says-breach-exposed-credentials-for-all-customers/) -> primary: Chainalysis incident page, URL https://www.chainalysis.com/blog/security-incident-october-30/ (running update log, newest entry 2026-11-07 1:50 PM EST) -> corroboration: The Record, URL https://therecord.media/chainalysis-all-users-hit-by-agentic-cyberattack; BleepingComputer first-disclosure article 2026-10-31. Swiss-nexus check: WebSearch (\"Chainalysis Reactor Schweiz Kantonspolizei Bundeskriminalpolizei fedpol Staatsanwaltschaft Kryptowährungen Ermittlungen Software Lizenz\") found no Swiss licence; WebSearch (\"Chainalysis breach \\\"on-path attack\\\" law enforcement customers Reactor offline credentials tokens\")."
    summary: |
      Chainalysis, the blockchain-analytics vendor, disclosed on 2026-10-30 that "an external actor using offensive agentic techniques" gained unauthorized access to its systems and internal tools, first saying only user IDs, full names, e-mail addresses and organisation role labels were accessed and that it had no evidence of credential or session-token exposure. The vendor's updates widened that: on 2026-11-02 it took Reactor and Data Solutions offline; on 2026-11-04 it said names, usernames, password hashes and live tokens of all Chainalysis users had been exposed to a malicious actor, separately told a subset of customers that an "on-path attack" had exposed their passwords (method contained and remediated, per the vendor), said some KYT customer accounts appeared to have been accessed without authorisation, and took KYT (UI and API), address screening and the login page offline after abnormal activity. Restoration began in phases on 2026-11-06 and on 2026-11-07 the vendor said Reactor, KYT and Address Screening are back "with enhanced security measures", with customers asked to submit trusted IP addresses for an allowlist and every user required to reset passwords and rotate API keys. Chainalysis claims no evidence that investigations data was accessed or attribution data altered, and says the incident is unrelated to the Binance theft; these are vendor statements, not independently verified. The Record notes Chainalysis lists more than 1,500 customers across law enforcement, crypto and finance, regulators and national security. Unstated in every source: what "offensive agentic techniques" means technically, how the on-path interception was achieved, how many users or customers are affected, whether the three exposure strands share an attacker, and any attribution; no source ties the incident to ARTEX or any actor (a trade outlet states the vendor has not tied it to ARTEX).
    region_nexus: "global vendor; no fetched source shows Swiss (or any named European) agency among the affected customers, and a public-source search found no Swiss licence"
    primary_sector_nexus: "indirect: the vendor's customer base includes law-enforcement, regulator and national-security users (The Record, citing the vendor's website), the investigative-tool class cantonal and federal police and prosecutors could hold"
    sector: "technology (blockchain-analytics vendor); customers in law enforcement and finance"
