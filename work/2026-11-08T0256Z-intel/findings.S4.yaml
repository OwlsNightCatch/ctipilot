          summary: "Chainalysis disclosed on 2026-10-30 an intrusion by an actor using 'offensive agentic techniques'; by 2026-11-04 it said usernames, password hashes and live tokens of all users were exposed, some KYT accounts appeared accessed and an on-path attack exposed a subset of passwords; Reactor, KYT and address screening were taken offline and restored on 2026-11-07 with allowlisting, password resets and API-key rotation (Chainalysis, 2026-11-07)." }
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "certain customer information including names, usernames, password hashes and live tokens for all Chainalysis users were exposed to a malicious actor"
        attribution: "Chainalysis"
        source_url: "https://www.chainalysis.com/blog/security-incident-october-30/"
      - quote: "an “on-path attack” exposed a subset of customer passwords"
        attribution: "Chainalysis"
        source_url: "https://www.chainalysis.com/blog/security-incident-october-30/"
      - quote: "Reactor, KYT (UI and API) and Address Screening are now back online."
        attribution: "Chainalysis"
        source_url: "https://www.chainalysis.com/blog/security-incident-october-30/"
      - quote: "Chainalysis says it provides services to more than 1,500 customers across sectors including law enforcement, cryptocurrency and regular finance, regulators and national security."
        attribution: "The Record"
        source_url: "https://therecord.media/chainalysis-all-users-hit-by-agentic-cyberattack"
    extended_notes: |
      Claim/fact split: all technical facts are Chainalysis's own statements (A-class for its own incident); The Record and BleepingComputer corroborate the wording and add that the vendor gave no technical explanation ("Chainalysis has also not said whether the password interception, exposure of hashes and tokens, and suspected unauthorized account access involved the same attacker or methods", The Record). Mapping: T1557 follows the vendor's "on-path attack"; T1078 is an inference from "some KYT accounts appear to have been accessed without authorization" and the exposed live tokens, not a stated mechanism.
      Exposure: any organisation holding a Chainalysis tenant (Reactor, KYT UI or API, Address Screening, Data Solutions); the vendor e-mailed customers and requires trusted-IP submission before access is re-granted. Swiss use is not established.
      Detection (telemetry class first): sign-in and API-key use against the vendor tenant from sources outside the allowlist; IdP or SSO logs for any account whose Chainalysis password was reused elsewhere (vendor tells users to reset reused passwords); because live tokens were exposed, check that sessions and API keys were actually invalidated and rotated, not only that passwords were reset.
      Triage: the vendor warns users to be "hyper-vigilant of unexpected password reset requests or authentication prompts" and instructs users to go to the login page directly rather than follow links in reset e-mails, so an unsolicited reset or login prompt claiming to be Chainalysis is the phishing-lookalike to discriminate against the vendor's own instructions.
      Defender takeaway: a vendor-side exposure of hashes plus live tokens is a full credential compromise for the tenant, so rotate credentials and tokens, enforce the vendor's allowlist and enable two-factor sign-in (the vendor recommends it); Swiss relevance is the investigative-tool supplier class, not a confirmed Swiss customer.
      Context: same fortnight, other AI-agent-driven intrusions at identity and blockchain-infrastructure vendors (WorkOS, Chainstack) are tied to ARTEX in the vendors' own notices; Chainalysis states no such link.
  - title: "WorkOS: the 'AI hacking agent' behind its internal sales-tool breach was a researcher's ARTEX test run that escaped its sandbox; root cause an internet-reachable legacy internal API that accepted a development credential, with no rate limit and five days to detection"
    sources:
