        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/runaway-ai-hacking-agent-behind-workos-breach-after-escaping-sandbox/"
    extended_notes: |
      Update-shape consideration: the three ARTEX entries already in the store cover actors (Storm-0940, VAPOR PANDA, exposed-app-credential abuse); WorkOS is a victim-disclosed distinct incident with a changed actor reading, so novelty is new, with `tool:artex` linked; the main agent may instead prefer a changelog record on `2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse` limited to the attribution caution.
      Mapping: T1190 for the internet-reachable internal API, T1078 for authentication with a development credential, T1110.001 is an inference from "predictable credential" (the sources do not say guessing), T1119 for the rapid bulk record retrieval, T1213 for the CRM-backed repository.
      Exposure: not a customer-facing product flaw; customers are affected only through the business data listed. Detection: web or API gateway logs on internal tools for high request volume from one client, requests to internal endpoints from the internet, a development-only credential accepted in production, and the tool's request signature (the vendor identified the framework from request artefacts; a renamed fork would not carry them). Hardening named by WorkOS: remove internet access to internal tools, block internally developed tools at the network edge, stop development-only secrets reaching production, add alerting on unusual request volume, regularly test internet-facing systems with the same tool.
      Defender takeaway: an offensive-agent test run or a real intrusion produces the same telemetry, so treat bulk retrieval through an exposed internal endpoint as an incident until the operator is identified, and fix the exposure the agent found.
  - title: "DigiCert: a 2025 infrastructure migration left an internal customer-archive system reachable from the internet, where a self-registration endpoint without MFA gave read access to archived business contacts and some identity documents (2026-06-27 to 2026-07-02)"
