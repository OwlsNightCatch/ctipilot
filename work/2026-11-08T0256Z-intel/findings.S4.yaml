    summary: |
      DigiCert's incident report on Mozilla's Bugzilla says that on 2025-02-04 an internal business system that archives information customers supply to validate their identity was moved from a VPN-restricted segment to an availability zone that was externally reachable. A registration feature of the account-manager component, intended for other use cases, became available on that system; accounts created through it were not subject to the MFA DigiCert otherwise requires and were read-only by default but could read archived data. DigiCert saw non-DigiCert accounts on 2026-06-18, moved the system behind a WAF, received a managed-security-programme report on 2026-06-21, shipped an authorisation fix on 2026-07-02, and confirmed on 2026-10-19 that archived data had been accessed from about 2026-06-27. Data was mostly names, business e-mail addresses, phone numbers and addresses, with a small minority of accounts also holding customer-provided documents such as a driver's licence, passport or utility bill. DigiCert says the access could not write records, act as a validation approver or issue certificates, that CA systems sit on separate network segments and that logs show no validation, issuance or revocation activity for the account; these are vendor statements. It says detection was late because the migration was treated as an infrastructure change rather than a security change and the system lacked alerting on new accounts through the exposed endpoint and on request volume. The count of affected customers and whether files were copied are not stated; DigiCert reported no evidence of misuse. A separate April 2026 DigiCert incident on code-signing certificates is not part of this event.
    region_nexus: "global CA; DigiCert customer-representative data (names, contacts, identity documents) could cover public bodies that validated certificates with it, but no source names a Swiss or European public-sector customer"
    primary_sector_nexus: "indirect: trust-service supplier; customers' named representatives and their ID documents tied to certificate validation"
