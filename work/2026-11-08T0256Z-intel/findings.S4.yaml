    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "This migration inadvertently allowed this internal business system to be accessible externally."
        attribution: "DigiCert (Mozilla Bugzilla incident report 2084460)"
        source_url: "https://bugzilla.mozilla.org/show_bug.cgi?id=2084460"
      - quote: "accounts registered through this endpoint were not subject to the multi-factor authentication (MFA) that DigiCert otherwise requires"
        attribution: "DigiCert (Mozilla Bugzilla incident report 2084460)"
        source_url: "https://bugzilla.mozilla.org/show_bug.cgi?id=2084460"
      - quote: "was treated as an infrastructure change rather than a security change which would have triggered more detailed review and sign off."
        attribution: "The Record"
        source_url: "https://therecord.media/digicert-certificate-authority-reports-data-breach"
    extended_notes: |
      Exposure: organisations that supplied identity documents or contact details to DigiCert for certificate validation received breach-notification e-mails (The Record: customers shared them on social media); the vendor says active certificates need no action. Detection: for a defender, the lesson is the control gap, not an indicator: network moves treated as infrastructure change without security review, an unintended self-registration path bypassing MFA, and no alerting on account creation or request volume on an internal endpoint; the vendor's own source of detection was a managed security (bug-bounty) programme report. Mapping: T1190 for the exposed internal system, T1136 for the account created through the registration endpoint, T1213 for the read of archived records.
