        attribution: "WorkOS"
        source_url: "https://workos.com/security/bulletins/update-for-october-30th-2026-data-security-incident"
      - quote: "The agent first accessed the tool on October 25, but we did not identify the unauthorized activity until October 30"
        attribution: "WorkOS"
        source_url: "https://workos.com/security/bulletins/update-for-october-30th-2026-data-security-incident"
