  - title: "Swiss Federal Audit Office on the BACS cyber-reporting platform: Cyber Security Hub lost about 12 hours to outages in Q1 2025 and still hangs on one federal login system, with phone and e-mail as the fallback"
    kind_hint: policy
    sources:
      - { url: "https://www.efk.admin.ch/prufung/infrastruktur-und-ressourcen-fuer-den-meldebetrieb/", publisher: "Eidgenössische Finanzkontrolle (EFK), audit EFK-26182 summary page", date: "2026-11-04", role: "primary" }
      - { url: "https://www.efk.admin.ch/wp-content/uploads/publikationen/berichte/wirtschaft_und_verwaltung/informatikprojekte/26182/26182be-bacs-meldebetrieb.pdf", publisher: "EFK, audit report EFK-26182 (version incl. statements, 29.05.2026)", date: "2026-11-04", role: "primary" }
      - { url: "https://www.inside-it.ch/efk-stellt-cyber-meldebetrieb-des-bacs-gutes-zeugnis-aus-20261105", publisher: "Inside IT", date: "2026-11-05", role: "corroborating" }
    discovery_trace: "first seen at: efk-ch, URL https://www.efk.admin.ch/ (extract of the home page, audit efk-26182 listed 04.11.2026) → primary: https://www.efk.admin.ch/prufung/infrastruktur-und-ressourcen-fuer-den-meldebetrieb/ (extract) → full report PDF https://www.efk.admin.ch/wp-content/uploads/publikationen/berichte/wirtschaft_und_verwaltung/informatikprojekte/26182/26182be-bacs-meldebetrieb.pdf (python3 tools/fetch_source.py pdf) → corroborating: Inside IT, URL https://www.inside-it.ch/efk-stellt-cyber-meldebetrieb-des-bacs-gutes-zeugnis-aus-20261105 (url --direct, __NEXT_DATA__ parse; first seen in the inside-it-ch RSS feed https://www.inside-it.ch/rss.xml)"
    summary: |
      The Eidgenössische Finanzkontrolle (EFK) published audit EFK-26182 on 2026-11-04 (report version including the audited office's statements dated 29 May 2026) on whether BACS has a robust reporting platform and enough staff for the cyber-incident reporting duty that has applied to critical-infrastructure operators since 1 April 2025, with a 24-hour deadline. The EFK concludes that the Cyber Security Hub (CSH) allows efficient processing and that the 12 full-time posts of the GovCERT incident-response team are sufficient for the current volume: 222 reports from critical-infrastructure operators between April and December 2025 (about one a day), an average first-handling time under one hour (88 percent under an hour, about 11 percent up to four hours in a January 2026 evaluation), about 5,300 registered CSH users, and 2 to 4 further posts planned after the budget increase Parliament approved in December. On availability, the CSH was unreachable for about 12 hours in total in the first quarter of 2025, mainly because the federal central access system (eIAM) failed and blocked all access and because provider disruptions were not detected early; BACS moved the platform in March 2026 to an external provider outside the federal administration, with servers at two geographically separate Swiss sites, monitoring and contractual availability terms, and the EFK says the short operating period does not yet allow a final judgement. The identity and access management remains a potential single point of failure (additional identity providers are planned), there is no specific contingency concept for an eIAM outage, and the alternative channels for reporting when the platform or eIAM is down are telephone and a federal-external e-mail address, with the reports entered into the CSH manually afterwards; the CSH is now classed as critical for business continuity and that concept is in preparation. The EFK made no formal recommendation. Further findings: security testing is regular but a sample found components not updated for at least three years and no longer supported (per Inside IT, supplementary analyses found no known vulnerabilities in them), BACS automated version checks in April 2026, the CSH is in BACS's bug-bounty programme but was not publicly reachable until the migration, no load test was run because volumes are low, and the CSH records incidents only: reporting organisations have no view of BACS's internal handling.
    region_nexus: "Switzerland (federal level); applies to every operator that must report to BACS"
    primary_sector_nexus: "direct: the reporting channel public bodies and critical-infrastructure operators depend on under the Information Security Act"
    sector: "public-sector; critical infrastructure"
    cves: []
    techniques: []
    affected_products: ["Cyber Security Hub (CSH), BACS reporting platform"]
    entity_keys: []
    new_entities:
      - { key: "report:efk-26182-bacs-cyber-reporting-platform-audit", type: report, name: "EFK audit 26182: infrastructure and resources for the BACS reporting operation",
          aliases: ["EFK-26182", "Prüfung der Infrastruktur und Ressourcen für den Meldebetrieb"],
          summary: "Swiss Federal Audit Office audit (report version including statements 29 May 2026, published 2026-11-04) of BACS's Cyber Security Hub and GovCERT staffing for the critical-infrastructure reporting duty: 222 reports April to December 2025, platform outages of about 12 hours in Q1 2025, migration to an external provider in March 2026, eIAM named a remaining single point of failure, no formal recommendation (EFK, 2026-11-04)." }
    references_hint: ["2026-06-22/swiss-federal-audit-office-federal-cyber-governance-split-le"]
    verification: SINGLE-SOURCE-OTHER
    confidence: HIGH
    novelty: new
    lookback: true
    evidence:
      - quote: "Seit dem 1. April 2025 müssen Betreiber kritischer Infrastrukturen Cyberangriffe innerhalb von 24 Stunden an das Bundesamt für Cybersicherheit (BACS) melden."
        attribution: "EFK"
        source_url: "https://www.efk.admin.ch/prufung/infrastruktur-und-ressourcen-fuer-den-meldebetrieb/"
      - quote: "Nach mehreren Ausfällen im Jahr 2025 hat das BACS den CSH zu einem neuen Leistungserbringer migriert."
        attribution: "EFK"
        source_url: "https://www.efk.admin.ch/prufung/infrastruktur-und-ressourcen-fuer-den-meldebetrieb/"
      - quote: "Das Identity- und Access-Management stellt weiterhin einen potenziellen Single Point of Failure dar."
        attribution: "EFK"
        source_url: "https://www.efk.admin.ch/prufung/infrastruktur-und-ressourcen-fuer-den-meldebetrieb/"
    sourcing_note: |
      The EFK is the primary disclosing federal authority for its own audit (Admiralty A); Inside IT's article is a re-report of the same report, so this counts as one independent source, with the full PDF read through `pdf` (text extraction with some spacing artefacts, so the evidence quotes are taken from the audit summary page, not the PDF). The fallback-channel facts (telephone and federal-external e-mail; no specific eIAM-outage concept) are in the PDF section 2.1 and in Inside IT. The report text is dated 29.05.2026, so the platform state it describes (external provider in operation since March 2026) is as of the audit, not necessarily today. Scope of the reporting duty (which public bodies are covered) is not stated on the EFK page and is not asserted here. Suggested Admiralty: A2.
    extended_notes: |
      Defender angle, from the report only: an operator subject to the reporting duty should know that the 24-hour clock still runs when the CSH or the federal login is down, that BACS names telephone and a federal-external e-mail address as the alternative channels, and that those reports are entered into the CSH by BACS afterwards, so the incident-response runbook should carry that contact route and not only the CSH log-in. The audit is a regulator's view of a federal service (no attacker behaviour, no exploitation), hence no techniques; it also names third authorities with their own CSH roles (EDÖB, FINMA, BSV, SEPOS, ElCom, BAZL) per ISG, and a EFK remark that the infrastructure now sits with an external provider with no explicit exit strategy defined yet in the security and data-protection concept. Related store entry: 2026-06-22/swiss-federal-audit-office-federal-cyber-governance-split-le (EFK-25152).
    borderline: true
    borderline_reason: "Oversight audit with no attacker behaviour and limited actionability (confirm fallback reporting channels in IR runbooks); kept as a candidate because the standing policy watch covers ISG implementation and the reporting duty, which lowers the relevance bar."

