    discovery_trace: "first seen at: heise topic listing, URL https://www.heise.de/thema/Cyberangriff (url --direct, newest item 11516406) → extract https://www.heise.de/news/Brenner-Basistunnel-Cyberangriff-auf-Baufirma-11516406.html → originating report: Tiroler Tageszeitung, URL https://www.tt.com/artikel/30946313/hackerangriff-auf-brenner-basistunnel-gesellschaft-bestaetigt-cyberattacke (extract; only the teaser and lead were readable, the rest is behind the paywall)"
    summary: |
      BBT SE, the Bolzano-based Austrian-Italian project company building the 64-kilometre Brenner Base rail tunnel, confirmed a cyberattack from mid-October 2026 after the Tiroler Tageszeitung reported it on 2026-11-06. Per a BBT spokesperson quoted by dpa and heise (2026-11-07), unknown attackers accessed parts of data that were reachable from the internet; the spokesperson said the attack created no danger for construction or later operation, that high-security data was not affected, and made no statement on perpetrators or motive. Italian authorities lead the investigation because BBT is seated in Bolzano, and the Tiroler Tageszeitung's teaser adds that the state-protection service was informed and that BBT did not answer whether there were negotiations or a payment to the attackers. heise sets it beside the mid-October cyberattack on the contractor Femern Link Contractors on the German-Danish Fehmarnbelt tunnel project, which temporarily affected several IT systems on that construction site according to the project company Femern A/S (heise, the Femern report not fetched). No source names the access route, a ransomware or extortion claim, or the data involved.
