    discovery_trace: "first seen at: heise-sec, URL https://www.heise.de/security/feed.xml (feed item 2026-11-07T17:32Z) → extract https://www.heise.de/news/Supermarkt-Kuehlsysteme-Deutsche-Geheimdienste-ermitteln-nach-Sabotageakten-11516390.html → primary: Handelsblatt, URL https://www.handelsblatt.com/politik/deutschland/hacker-cyberattacken-auf-supermaerkte-werden-fall-fuer-die-geheimdienste/100267954.html (extract). Second lead: nzz-technologie, URL https://www.nzz.ch/technologie.rss (feed item 2026-11-05T15:55Z) → extract of the NZZ Pro article. Third: WebSearch (\"NZZ russische Aktivistengruppen bekennen sich Cyberangriff Kühlregale Europa stimmt das\") → https://www.arabnews.pk/world/kremlin-denies-russia-role-in-fridge-cyberattacks-3006194 (WebFetch)"
    summary: |
      German intelligence services have joined the investigation of the refrigeration-controller attacks, and no government has attributed them. Handelsblatt reports (2026-11-06) that the Bundesamt für Verfassungsschutz told it the incidents are the subject of current intelligence investigations and that the joint centre against hybrid threats (GAZ Hybrid, in which security authorities and intelligence services including the BND and MAD work together) is dealing with the matter; the Federal Interior Ministry said it holds no findings that allow a clear attribution to a specific actor or a state body, and that a final assessment needs detailed analysis. heise (2026-11-07) relays this and adds its own summary that the attackers used automated searches for open systems and got in through known flaws in outdated software or unchanged default passwords, in at least one case through an external maintenance provider, and that the federal government sees no immediate threat to food supply because the affected businesses lie below the critical-infrastructure thresholds. NZZ (2026-11-05) reports that NoName057(16) posted a Telegram video titled "Operation Danfoss" on Tuesday evening 2026-11-03 and is said to have acted together with Z-Pentest Alliance, and assesses the claim as doubtful: it came late for a group that normally claims quickly, the French wave drew no claim and looked aimed at large chains while the later wave looks opportunistic, so different perpetrators are possible; NZZ separately calls Russian involvement plausible in principle and floats, as its own inference, that the GRU could stand behind the attacks with the activist claim as cover. The Kremlin spokesman called the accusations absurd and without proof (Reuters via Arab News, 2026-11-05; read through a summariser). No source gives new technical detail on the access route in the Swiss cases.
    region_nexus: "Switzerland (the Köniz butcher and Volg cases are already in the entry) and the DACH/EU states hit by the second wave; Germany's investigation status is new"
    primary_sector_nexus: "indirect: cold-chain controllers in retail and healthcare; no Swiss public-body victim named"
    sector: "retail; healthcare; food supply"
