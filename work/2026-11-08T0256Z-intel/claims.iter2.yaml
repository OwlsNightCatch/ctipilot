    entry: 2026-11-08/apple-spyware-alerts-german-officials-bsi-guidance
    surface: "body"
    kind: cited
    text: "**Triage:** a genuine notification never asks to click a link, open a file, install an app or profile, or give a password or verification code; a message that does is a phishing imitation, and the recipient should open account.apple.com directly in the browser instead ("
    urls: ["https://support.apple.com/en-us/102174"]
  - claim_id: b29a077497
    entry: 2026-11-08/apple-spyware-alerts-german-officials-bsi-guidance
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** give people who are plausible targets the authenticity check above and a named internal reporting path, and keep a replace-device-and-reset-accounts procedure that follows BSI's order; a recipient updates iOS at once unless a forensic analysis is intended, considers Lockdown Mode and keeps it on permanently once enabled, and replaces the device where the risk is rated high, treating it as possibly compromised until then."
