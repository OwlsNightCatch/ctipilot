    entry: 2026-11-08/apple-spyware-alerts-german-officials-bsi-guidance
    surface: "body"
    kind: cited
    text: "BSI notes that mercenary spyware is generally assumed to infect devices without any action by the user, for example through a prepared message that need not be opened, and that a compromised device exposes messages including those in encrypted messengers, calls, contacts, calendar, location, camera and microphone ("
    urls: ["https://www.bsi.bund.de/DE/Themen/Unternehmen-und-Organisationen/Informationen-und-Empfehlungen/Empfehlungen-nach-Angriffszielen/Buero/Apple_Mercenary-Spyware/apple_mercenary-spyware_node.html"]
  - claim_id: 7a073b35a2
    entry: 2026-11-08/apple-spyware-alerts-german-officials-bsi-guidance
    surface: "body"
    kind: cited
    text: "BSI's guidance for a recipient: assume the device may be compromised; update the operating system at once unless a forensic analysis is intended; keep Lockdown Mode on permanently, also on a new device, noting that it hampers new attacks but does not remove an existing infection; where the risk looks high, consider replacing the device, resetting every account used on it and changing the phone number; then set a new device passcode, change the Apple Account and mail passwords, re-enrol authenticator apps instead of transferring them, enable Signal's registration lock and WhatsApp's two-step verification with new PINs, remove linked devices nobody recognises, and report the notification to BSI's service centre ("
    urls: ["https://www.bsi.bund.de/DE/Themen/Unternehmen-und-Organisationen/Informationen-und-Empfehlungen/Empfehlungen-nach-Angriffszielen/Buero/Apple_Mercenary-Spyware/apple_mercenary-spyware_node.html"]
  - claim_id: 2c9fd54f3c
    entry: 2026-11-08/apple-spyware-alerts-german-officials-bsi-guidance
    surface: "body"
    kind: cited
    text: "**Exposure:** Apple sends these notifications to individuals it judges to have been individually targeted, \"likely because of who they are or what they do\", and names politicians and diplomats among the usual targets ("
    urls: ["https://support.apple.com/en-us/102174"]
  - claim_id: 0590be2071
    entry: 2026-11-08/apple-spyware-alerts-german-officials-bsi-guidance
    surface: "body"
    kind: cited
    text: "); a recipient confirms authenticity on the lock screen, in Settings, in the e-mail to the Apple Account address and in the banner at account.apple.com after signing in ("
    urls: ["https://support.apple.com/en-us/102174"]
  - claim_id: f605955039
