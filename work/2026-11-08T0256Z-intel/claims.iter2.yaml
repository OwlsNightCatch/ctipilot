    kind: cited
    text: "), and BSI's guidance names no artefact to check, so the organisational signal is a recipient reporting the notification; unusual device behaviour such as frequent crashes or fast battery drain is the only on-device hint BSI mentions ("
    urls: ["https://www.bsi.bund.de/DE/Themen/Unternehmen-und-Organisationen/Informationen-und-Empfehlungen/Empfehlungen-nach-Angriffszielen/Buero/Apple_Mercenary-Spyware/apple_mercenary-spyware_node.html"]
