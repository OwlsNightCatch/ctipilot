        source_url: "https://www.qnap.com/en/security-news/2026/qnap-security-notice-plex-media-server-vulnerabilities-plex2shell-update-to-1-43-3-10861-or-later-immediately"
      - quote: "Compromised servers have been used to run cryptocurrency miners and proxy software, which routes other people’s traffic through the victim’s internet connection."
        attribution: "Plex"
        source_url: "https://forums.plex.tv/t/important-security-update-for-plex-media-server-v1-43-2-and-earlier/942319/3"
    extended_notes: |
      Exposure (how to tell): Plex Web > Settings > General shows the server version; anything below 1.43.3.10861 is affected.
      The attack surface is TCP 32400 reachable from the internet (Plex Remote Access, a router port forward or UPnP).
      Detection concept (Plex's own list): processes started by the Plex Media Server process that are not Plex's own
      transcoder/helpers, unfamiliar shared objects (.so/.dll) in the Plex Codecs folder, transcoder options in
      Preferences.xml nobody set, outbound connections and sustained CPU use while nothing is playing. Telemetry classes:
      process-creation events with parent lineage, file-creation events in the Codecs directory, egress/NetFlow from the
      NAS or server. Benign lookalike: Plex's own transcoder child processes during playback; discriminators are an unknown
      image name, a library written to Codecs outside an app update, and activity with no playback session.
      Post-patch check: rebuild from a clean install if the version was 1.43.2 or earlier and the port was reachable; sign out
      all Plex devices, change the Plex password, treat mounted shares and credentials on the same host as exposed (Plex).
      Hardening: disable Remote Access, stop forwarding 32400, use a VPN (QNAP, Plex).
      Chain mechanics are the discoverer's account (zmain.info); CVE summaries are Plex's. EPSS (FIRST, 2026-11-07):
      CVE-2026-96652 0.119, -96655 0.107, -96654 0.019, -96656 0.018. KEV dueDates in the catalogue: 2026-10-23 (96654, 96656),
      2026-11-03 (96652, 96655). Suggested Admiralty: A1 (vendor + KEV + vendor-confirmed exploitation + corroboration).
      Source discrepancy to keep: Plex's table calls CVE-2026-96655 the disclosure of the owner's admin token, while the CISA
      catalogue text (and BleepingComputer's list) describes it as an authenticated SSRF in the transcoder endpoint and CVE-2026-96656 as the
      administrator-level file write; the chain and the fixed version are the same in every source.

