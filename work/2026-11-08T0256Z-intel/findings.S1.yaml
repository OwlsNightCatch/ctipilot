    discovery_trace: "first seen at: bleepingcomputer feed (python3 tools/fetch_source.py feed https://www.bleepingcomputer.com/feed/), URL https://www.bleepingcomputer.com/news/security/qnap-says-hackers-breaching-nas-devices-in-plex2shell-attacks/ -> primary: QNAP security notice, URL https://www.qnap.com/en/security-news/2026/qnap-security-notice-plex-media-server-vulnerabilities-plex2shell-update-to-1-43-3-10861-or-later-immediately -> primary: Plex announcement, URL https://forums.plex.tv/t/important-security-update-for-plex-media-server-v1-43-2-and-earlier/942319/3 -> primary: discoverer write-up, URL https://zmain.info/blog/plex2shell -> corroborating: BleepingComputer CISA KEV article, URL https://www.bleepingcomputer.com/news/security/cisa-hackers-chain-plex-flaws-in-plex2shell-attacks-to-breach-servers/ ; KEV membership read from tools/fetch_source.py cisa-kev (all four CVEs dateAdded 2026-10-20)"
    summary: |
      Plex2Shell is the name for four Plex Media Server flaws that, chained, give an unauthenticated remote attacker code
      execution as the Plex service account on any server running 1.43.2 or earlier; Plex lists the pieces as an
      unauthenticated server-side request forgery in the player timeline endpoint (CVE-2026-96652), access to internal
      agent functions over the loopback interface (CVE-2026-96654), disclosure of the server owner's admin token
      (CVE-2026-96655) and an arbitrary file write into the Codecs directory through transcoder preferences
      (CVE-2026-96656). The discoverer's write-up (2026-10-16) describes the chain as the SSRF reaching the loopback-only
      plugin API, which hands the attacker the owner token, which in turn lets the transcoder write a shared object that is
      loaded on the next transcode. CISA added all four CVEs to KEV on 2026-10-20. Plex states the flaws are "actively and
      widely exploited" since a public proof of concept appeared on 2026-10-16, with compromised servers used for
      cryptocurrency mining and proxyware. New in the developing window: QNAP's security notice of 2026-11-06 says it has
      received reports of Plex Media Server on customer NAS devices being compromised through the chain, that QTS and QuTS hero
      themselves are not affected, and that updating does not remove anything already installed, so a NAS that ran 1.43.2 or
      earlier with Plex reachable from the internet (Remote Access, port 32400 forwarded, or opened by UPnP) is to be treated
      as compromised and rebuilt. Fixed: Plex Media Server 1.43.3.10861 and later (QNAP App Center carries it). The store has
      no earlier entry for this chain (KEV listing of 2026-10-20 was never covered).
    region_nexus: "global; internet-exposed NAS and home/SMB servers; Switzerland relevance only where Plex runs on estate NAS or shadow-IT hosts"
