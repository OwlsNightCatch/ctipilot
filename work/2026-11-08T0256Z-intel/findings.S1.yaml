  # ------------------------------------------------------------------ 3. AWS Babelfish CVE-2026-119923 (new)
  - title: "CVE-2026-119923, Babelfish for PostgreSQL and Amazon Aurora PostgreSQL with Babelfish: an unauthenticated memory-corruption flaw in the TDS prelogin handshake on TCP 1433 (CVSS 4.0 9.3); upgrade clusters or restrict the TDS port"
    sources:
      - { url: "https://aws.amazon.com/security/security-bulletins/2026-166-aws/", publisher: "AWS Security Bulletin 2026-166-AWS", date: "2026-11-06", role: "primary" }
      - { url: "https://github.com/babelfish-for-postgresql/babelfish_extensions/security/advisories/GHSA-vq28-vgj3-r26w", publisher: "Babelfish for PostgreSQL (GitHub security advisory)", date: "2026-11-07", role: "primary" }
    discovery_trace: "first seen at: enisa-euvd, URL via python3 tools/fetch_source.py enisa-euvd recent criticals (EUVD-2026-118415, published 2026-11-06, updated 2026-11-07T21:32Z) -> python3 tools/fetch_source.py enisa-euvd advisory EUVD-2026-118415 (references list) -> primary: AWS bulletin, URL https://aws.amazon.com/security/security-bulletins/2026-166-aws/ -> primary: GHSA, URL https://github.com/babelfish-for-postgresql/babelfish_extensions/security/advisories/GHSA-vq28-vgj3-r26w"
    summary: |
      AWS Security Bulletin 2026-166-AWS (2026-11-06, content type "Important (requires attention)") discloses two memory-safety
      issues in the TDS protocol layer that lets Babelfish present a SQL Server wire endpoint on Aurora PostgreSQL (and in the
      open-source Babelfish extension). CVE-2026-119923 is in the TDS connection-handshake (prelogin) handling and can be
      reached by a remote, unauthenticated actor sending a crafted request to the TDS endpoint (default TCP 1433); AWS says it
      can affect confidentiality, integrity and availability of the database process, and the CVE record (ENISA EUVD, CNA
      Amazon) describes a heap-based buffer overflow that might allow execution of OS commands as the database process user
      (CVSS 4.0 9.3, AV:N/AC:L/AT:N/PR:N/UI:N). CVE-2026-119924 is a TDS RPC-request memory-safety issue reachable by an
      authenticated actor (adjacent memory read or denial of service). Affected: Babelfish for PostgreSQL 1.0-1.5, 2.1-2.15,
      3.1-3.12, 4.0-4.8, 5.1-5.4; Aurora branches listed per version in the bulletin (for example 4.x below 4.5.5 and the
      per-minor ranges up to 4.9.0 below 4.9.1; 6.x 6.0.0 below 6.0.2). Fixed in extension versions 4.10, 5.6 and 6.1 and in
      Aurora PostgreSQL versions such as 16.14.1 (Babelfish 4.10.0), 17.10.1 (5.6.0) and 18.4.1 (6.1.0), with pending maintenance
      applied. Workaround: restrict the TDS port to trusted sources with VPC security groups. Neither AWS nor the GHSA reports
      exploitation. EPSS (FIRST, 2026-11-07) 0.0062.
    region_nexus: "global; AWS regions (Swiss federal public cloud and cantonal AWS tenants only if Babelfish is enabled)"
    primary_sector_nexus: "indirect (managed database on a hyperscaler the Swiss federal administration contracts)"
    sector: "technology"
