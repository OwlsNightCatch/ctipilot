  # ------------------------------------------------------------------ 7. eMudhra update (Cisco v1.8 + Apple macOS command-line gap)
  - title: "eMudhra distrust: Cisco's advisory is at version 1.8 (2026-11-06), and macOS command-line tools (curl, git, python3, openssl) keep trusting the eight compromised intermediates until macOS 27.3"
    sources:
      - { url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-emudhra-info-ScS22A1r", publisher: "Cisco PSIRT (cisco-sa-emudhra-info, version 1.8)", date: "2026-11-06", role: "primary" }
      - { url: "https://support.apple.com/de-de/149555", publisher: "Apple Support (eMudhra intermediate CA information, German)", date: "2026-10-30", role: "primary" }
      - { url: "https://www.heise.de/news/macOS-27-3-Apple-behebt-letztes-eMudhra-Leck-aber-es-wird-dauern-11513443.html", publisher: "heise online", date: "2026-11-06", role: "corroborating" }
    discovery_trace: "first seen at: cisco-psirt feed, URL https://sec.cloudapps.cisco.com/security/center/psirtrss20/CiscoSecurityAdvisory.xml (python3 tools/fetch_source.py feed; 'Cisco Informational for Emergency Distrust of eMudhra Root and Intermediate Certificate Authorities' revised 2026-11-06 20:40) -> primary: Cisco advisory (fetched with extract), URL https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-emudhra-info-ScS22A1r ; second lead: heise feed, URL https://www.heise.de/security/feed.xml -> heise article URL https://www.heise.de/news/macOS-27-3-Apple-behebt-letztes-eMudhra-Leck-aber-es-wird-dauern-11513443.html -> primary: Apple Support, URL https://support.apple.com/de-de/149555"
    summary: |
      Two developments on the tracked eMudhra intermediate-CA compromise. (1) Cisco's informational advisory moved from version 1.5
      (the version the entry cites, 2026-10-30) to 1.8 on 2026-11-06 (1.6 on 2026-11-04, 1.7 on 2026-11-05); the 1.8 entry reads "Updated
      products under investigation and products impacted". The current page lists remediation or procedures for IOS XE (a
      CA-trust distrust guide plus a GuestShell bug), IOS XR (fix 26.4.1, 2026-11-30), Secure Firewall ASA/FTD/FMC, ISE
      (patches dated December 2026 and April 2027), Duo, Webex, Meraki and others, with target dates for several still-pending
      software fixes (for example IP Phone 8800 14.4(1)ES1 on 2026-11-13, Meraki MV firmware 2026-11-18, ASR 5000 StarOS 2026-11-15),
      and keeps NX-OS (Nexus 3000 and 9000, MDS 9000 9.4) and ACI trains in the "still under investigation" table with the
      affected releases noted. (2) On Apple platforms, Apple's support page says the block is automatic for Safari, Mail and apps
      using Apple's networking and security frameworks, but command-line tools in macOS and the Xcode command-line tools (curl,
      git, python3, ruby, perl, openssl) validate against /etc/ssl/cert.pem, check neither Apple's block nor revocation, and
      stay exposed until a future macOS update refreshes that file; administrators can remove the affected root certificates from
      the file meanwhile. heise (2026-11-06) adds that the macOS 27.2 update undid that manual workaround, that macOS 27.3,
      which entered developer beta this week, replaces the file, and that the final release is unlikely before December.
      The registered entry mentions Apple's automatic block (2026-10-22) but not this command-line gap.
    region_nexus: "global; enterprise network estates (Cisco), macOS administrator and developer workstations"
    primary_sector_nexus: "indirect (TLS trust on network infrastructure and admin workstations)"
    sector: "public-sector"
    cves: []
    techniques: [T1557]
    affected_products: ["Cisco IOS XE Software", "Cisco IOS XR Software", "Cisco Identity Services Engine", "Apple macOS"]
    entity_keys: ["incident:emudhra-intermediate-ca-key-compromise-2026-10", "product:apple-macos"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "update-of:2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates"
    developing_window: true
    evidence:
      - quote: "Updated products under investigation and products impacted."
        attribution: "Cisco PSIRT (version 1.8, 2026-NOV-06)"
        source_url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-emudhra-info-ScS22A1r"
      - quote: "Releases 9.3(9) through 9.3(18) are impacted."
        attribution: "Cisco PSIRT (Nexus 3000 Series row)"
        source_url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-emudhra-info-ScS22A1r"
      - quote: "Diese Datei wird mit einem zukünftigen macOS-Update aktualisiert."
        attribution: "Apple Support (German; 'This file will be updated with a future macOS update')"
        source_url: "https://support.apple.com/de-de/149555"
      - quote: "Erst mit macOS 27.3, das in dieser Woche in den Betatest durch Entwickler gegangen ist, wird das Problem abgestellt."
        attribution: "heise online (German; 'Only macOS 27.3, which went into developer beta this week, fixes the problem')"
        source_url: "https://www.heise.de/news/macOS-27-3-Apple-behebt-letztes-eMudhra-Leck-aber-es-wird-dauern-11513443.html"
    extended_notes: |
      Exposure: Cisco products on the Cisco table that trust the eight intermediates through their trust bundle or embedded
      certificates; macOS hosts where curl, git, python3, ruby, perl or openssl validate against /etc/ssl/cert.pem (the
      developer/admin path where a forged certificate would be accepted, for example when downloading code). Apple's workaround
      (remove the affected CA roots from cert.pem) was reverted by macOS 27.2 per heise, so a host that applied it before
      27.2 needs it again. The Cisco page lists products with no fix date; the entry's existing guidance (apply the listed
      Cisco procedures; replace certificates chaining to the removed roots) stands. Cisco states it is not aware of malicious
      use. Admiralty suggestion: A1 (vendor + Apple + press). Low-to-moderate value as a changelog sentence; the macOS
      command-line gap is the part not in the entry.

