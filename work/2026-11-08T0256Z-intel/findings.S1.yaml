  - title: "Plex2Shell, Plex Media Server 1.43.2 and earlier: a four-flaw unauthenticated RCE chain on CISA KEV since 2026-10-20; QNAP now reports compromised NAS devices (fixed in 1.43.3.10861)"
    sources:
