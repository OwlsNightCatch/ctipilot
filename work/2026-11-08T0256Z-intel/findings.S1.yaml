# Process notes for the main agent (self-evolution)
process_notes:
  - "Weekend quiet window: most CERT/PSIRT feeds have no item newer than Friday 2026-11-06. Per-record fetches were sufficient; the productive discovery layer was the security-news feeds (bleepingcomputer, thehackernews, securityweek, heise) used as leads only, which surfaced Plex2Shell/QNAP, the Paint advisory fight and the heise macOS eMudhra gap."
  - "tools/fetch_source.py: never run `url` against api.github.com (hangs, then spends the metered reader). WebFetch on github.com/advisories works for listings."
  - "MSRC: `msrc cve <CVE>` exposes revisions[] with dated change notes, which is how Paint's 2026-11-06 and 2026-11-07 revisions were found; worth using for any covered Microsoft CVE the entries cite."
