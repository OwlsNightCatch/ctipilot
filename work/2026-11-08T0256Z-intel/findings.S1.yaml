    verification: SINGLE-SOURCE-OTHER
    confidence: HIGH
    novelty: new
    borderline: true
    borderline_reason: "Unauthenticated pre-auth memory corruption in a managed database listener at CVSS 4.0 9.3, vendor-primary and patch available, but niche (only clusters with Babelfish enabled), typically VPC-internal, no exploitation reported, and the AWS bulletin lies ~7 h before the 26 h window (EUVD record updated inside it). Single vendor source (AWS bulletin and AWS-owned GHSA are the same maker)."
    evidence:
      - quote: "A memory-safety issue in the TDS connection-handshake handling could allow a remote, unauthenticated actor to affect the confidentiality, integrity, and availability of the database process."
        attribution: "AWS Security Bulletin 2026-166-AWS"
        source_url: "https://aws.amazon.com/security/security-bulletins/2026-166-aws/"
      - quote: "Restrict network access to the TDS port (default 1433) to trusted sources using VPC security groups until the upgrade is applied."
        attribution: "AWS Security Bulletin 2026-166-AWS"
        source_url: "https://aws.amazon.com/security/security-bulletins/2026-166-aws/"
      - quote: "This issue has been addressed in Babelfish for PostgreSQL versions 4.10, 5.6 and 6.1."
        attribution: "Babelfish for PostgreSQL GHSA"
        source_url: "https://github.com/babelfish-for-postgresql/babelfish_extensions/security/advisories/GHSA-vq28-vgj3-r26w"
    extended_notes: |
      Exposure: only Aurora PostgreSQL clusters with Babelfish enabled (TDS listener) and self-managed PostgreSQL with the Babelfish
      extension; the vulnerable surface is whatever can reach TCP 1433 on the cluster, so VPC security groups, peering and
      transit paths are the check. Detection concept (derived from the mechanism, not stated by AWS): connection attempts to
      the TDS port from sources outside the application tier (VPC flow logs), and database-process crashes or restarts
      (RDS/Aurora event log) following malformed handshakes. Post-patch compromise check: AWS publishes none; on any
      cluster that was reachable from untrusted networks before patching, review DB-process crashes and OS-command
      activity as the database user. Suggested Admiralty: A2. CVSS 4.0 vector per ENISA EUVD record:
      CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N. EUVD shows EPSS 0.62 which is percent; FIRST gives 0.0062.

  # ------------------------------------------------------------------ 4. UgCS CVE-2026-59104 (new)
  - title: "CVE-2026-59104, SPH Engineering UgCS before 6.2: the drone ground-control server's HCI login on TCP 3334 accepts empty credentials on single-user installs and returns a fully authenticated session (CVSS 3.1 9.8, fixed 2026-10-09)"
    sources:
      - { url: "https://offseq.com/en/research/ugcs-cve-2026-59104/", publisher: "OffSeq (discoverer, coordinated via CERT.LV)", date: "2026-11-06", role: "primary" }
    discovery_trace: "first seen at: enisa-euvd, URL via python3 tools/fetch_source.py enisa-euvd recent lastvulnerabilities (EUVD-2026-118522, published 2026-11-06T21:41Z, CNA ENISA, EPSS 0.66 percent) -> python3 tools/fetch_source.py enisa-euvd advisory EUVD-2026-118522 (references) -> primary: OffSeq write-up, URL https://offseq.com/en/research/ugcs-cve-2026-59104/ (fetched with extract); a CERT.LV page and a vendor advisory were searched for (WebSearch 'CERT.LV UgCS SPH Engineering authentication bypass CVE-2026-59104 HCI port 3334') and not found"
    summary: |
      OffSeq discloses CVE-2026-59104 in UgCS, SPH Engineering's drone ground-control software (UgCS for Windows, macOS and
      Linux before 6.2). The UgCS server exposes a host-computer-integration (HCI) protocol on TCP 3334 so other software can
      log in, read state, issue commands and upload flight routes. The login handler resolves a login request with absent
      user login and password to "the only user" when the user database holds exactly one account, which is the default
      single-operator installation, and returns a fully authenticated, non-degraded session; because the listener binds to
      every interface and runs without TLS by default, any host that reaches port 3334 can command connected drones and
      upload or modify flight routes without a credential. CVSS 3.1 9.8 and CVSS 4.0 9.3 (AV:N/AC:L/PR:N/UI:N). Timeline per
      OffSeq: reported to CERT.LV 2026-06-30, forwarded to the vendor 2026-07-06, CVE reserved 2026-08-06, vendor fix released
      as UgCS 6.2 on 2026-10-09; the CVE record went public in ENISA's EUVD on 2026-11-06. Fixed: UgCS 6.2 or later. For
      installs that cannot upgrade, OffSeq advises binding the HCI listener to 127.0.0.1, restricting TCP 3334 by host and
      network firewall rules and using an authenticated TLS transport. No exploitation is reported. EPSS (FIRST, 2026-11-07)
      0.0066.
    region_nexus: "global; UAS/drone operators (police, emergency services, survey and defence users would be exposed if the HCI port is reachable)"
    primary_sector_nexus: "indirect (drone operations by emergency services / armed forces are plausible but unevidenced)"
    sector: "public-sector"
    cves: [CVE-2026-59104]
    techniques: [T1190]
    affected_products: ["UgCS"]
    entity_keys: []
