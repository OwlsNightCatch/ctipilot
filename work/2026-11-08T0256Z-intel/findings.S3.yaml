  - title: "XLab: cwpdoor replaces the Control Web Panel web server binary with a passive backdoor that suppresses access logging; 340,000 CWP instances are exposed"
    sources:
      - { url: "https://blog.xlab.qianxin.com/cwpdoor-the-invisible-backdoor-living-inside-control-web-panel/", publisher: "QiAnXin XLab", date: "2026-11-05", role: "primary" }
      - { url: "https://thehackernews.com/2026/11/hackers-hide-linux-backdoor-in-control.html", publisher: "The Hacker News", date: "2026-11-06", role: "corroborating" }
    discovery_trace: "first seen at: The Hacker News feed (https://feeds.feedburner.com/TheHackersNews, discovery sweep, 2026-11-06 11:09Z) -> https://thehackernews.com/2026/11/hackers-hide-linux-backdoor-in-control.html -> primary: extract https://blog.xlab.qianxin.com/cwpdoor-the-invisible-backdoor-living-inside-control-web-panel/"
    summary: |
      QiAnXin XLab reports cwpdoor, a passive backdoor built into cwpsrv, the nginx-based web server of Control Web Panel (CWP): after root access an installer script posing as a version update overwrites the cwpsrv binary (it handles only versions 1.15.10 and 1.24.0), restores the file and directory timestamps and deletes the session history so ls and stat show no change, and the backdoored server then runs commands carried in a request that has a valid timestamp, an AES-encrypted command and an RSA signature in custom X-Ngx-Integrity headers, passes them to a helper process over a Unix domain socket named for the integrity helper, and leaves those requests out of the access log. XLab captured the installer on 2026-06-29, saw an archive uploaded to VirusTotal from Brazil on 2026-09-30 whose backdoored binary had zero detections and which also held a file most vendors identify as the Ebury backdoor, and concludes that real victims exist; it does not know how attackers obtain the root access the installer needs, says the relationship to Ebury is unclear, and counts more than 340,000 CWP instances exposed to the internet in a month, which is the pool at risk, not the number infected. XLab gives three host checks: the Unix socket, unexpected helper processes started by cwpsrv, and the replaced binary.
    region_nexus: "global; CWP is a free hosting-control panel, and Swiss public-sector use is not established"
    primary_sector_nexus: "indirect: relevant only where a public body or its hosting supplier runs CentOS Web Panel"
    sector: "technology"
    cves: []
    techniques: [T1554, T1070.006, T1070, T1090]
    affected_products: ["Control Web Panel (CWP)"]
    entity_keys: []
    new_entities:
      - { key: "tool:cwpdoor", type: tool, name: "cwpdoor", aliases: [], summary: "Passive Linux backdoor compiled into the Control Web Panel web server cwpsrv, triggered by signed X-Ngx-Integrity request headers and excluded from access logs; named by QiAnXin XLab (2026-11-05), infection vector unknown." }
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    borderline: true
    borderline_reason: "Substantive detection-relevant malware analysis (log-suppressing binary replacement, timestomping) from a telemetry-holding lab, but CWP is a niche hosting panel with no established Swiss public-sector footprint, the vector is unknown, and XLab's post is dated 2026-11-05, outside the 26 h window."
    evidence:
      - { quote: "real victims already exist in the wild", attribution: "QiAnXin XLab", source_url: "https://blog.xlab.qianxin.com/cwpdoor-the-invisible-backdoor-living-inside-control-web-panel/" }
      - { quote: "Zero AV detections. No access logs. Triggered only by a signed request—and 340,000 CWP instances are at risk.", attribution: "QiAnXin XLab", source_url: "https://blog.xlab.qianxin.com/cwpdoor-the-invisible-backdoor-living-inside-control-web-panel/" }
      - { quote: "The researchers do not yet know how attackers get the root access the installer needs.", attribution: "The Hacker News", source_url: "https://thehackernews.com/2026/11/hackers-hide-linux-backdoor-in-control.html" }
    extended_notes: |
      Suggested Admiralty: B2 (XLab is in sources.json as an active standard record; vendor-side detection of the backdoor was zero at publication).
      Detection concept (XLab): look for the Unix domain socket named for the integrity helper (ss -axp | grep integrity), unexpected child processes of cwpsrv, and a cwpsrv binary whose hash differs from the vendor's although its timestamps look unchanged; web access logs will not show the trigger, so compare against a known-good binary and watch for the process and socket anomalies. Post-compromise note: root was a prerequisite, so the underlying intrusion is the finding to hunt; a Brazilian archive held cwpdoor beside Ebury, and XLab says they may have been planted by different attackers.
