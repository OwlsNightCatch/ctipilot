  - title: "Hunt.io's capture of the PAN-OS PHP2Shell and Fragnesia toolkit adds the operator's AI pentest platform, a GlobalProtect cookie-forging tool and persistence that Hunt says is designed to survive reboots and firmware updates"
    sources:
      - { url: "https://hunt.io/blog/inside-the-php2shell-arsenal", publisher: "Hunt.io (Inside the PHP2Shell Arsenal)", date: "2026-11-05", role: "primary" }
      - { url: "https://dreamgroup.com/blog/chained-php2shell-exploit-roots-25-servers", publisher: "Dream Research (updated 2026-10-29)", date: "2026-10-29", role: "corroborating" }
    discovery_trace: "first seen at: hunt-io (slice record), WebFetch https://hunt.io/blog (ten newest posts with dates; 'Nov 5, 2026' for this one) -> primary: extract https://hunt.io/blog/inside-the-php2shell-arsenal -> comparison: extract https://dreamgroup.com/blog/chained-php2shell-exploit-roots-25-servers (already cited by the existing entry); prior_coverage check: the PAN-OS entry cites Dream Research and Unit 42 but not this Hunt.io post"
    summary: |
      Hunt.io says its AttackCapture platform flagged on 2026-10-24 an open file server on a Tokyo VPS that held the operator's whole working environment for a chain against the PAN-OS management web interface: PHP session upload-progress heap corruption (code execution as the unprivileged web user) followed by the Fragnesia XFRM kernel flaw (CVE-2026-46300), with a PAM change to pam_permit.so so that su works without a password inside the same request, then replacement of the unauthenticated change_password.php page by a root command relay. New against the entry: Hunt says the persistence was designed to survive reboots and firmware updates, without saying whether it did (a systemd oneshot unit plus an rc.local fallback, payload in a hidden directory under /usr/local/lib, reverse SSH tunnels and a SOCKS5 proxy into the internal network) and that monitoring scripts re-deployed Active Directory reconnaissance automatically when a firewall came back after a reboot or update. The same directory held a tool that forges GlobalProtect authentication-override cookies for CVE-2026-0257, which Hunt assesses would survive the firewall being reimaged or patched, and scripts probing Keycloak and SAML endpoints and spraying passwords. Hunt also found an AI offensive platform ("aiscan") on the VPS using DeepSeek v4-pro and Kimi k3, and says Claude Code was installed but the capture shows no sign it was used. Hunt's version matrix says the chain is calibrated only for PAN-OS 12.x on PHP 8.0.30 (12.1.4 calibrated; 12.1.9, 12.1.10, 12.2.3 and 12.2.4 provisional; 11.1.6 unsupported because its PHP is 7.4.33); the vendor's advisory, not this matrix, defines the affected range.
    region_nexus: "global; Hunt's reconnaissance covered 19,182 internet-facing PAN-OS management portals in 95 countries, the 240-host batch was 219 US, 9 China, 6 South Korea and 6 Japan, and the 25 confirmed roots were 18 US, 6 South Korea and 1 internal pivot"
    primary_sector_nexus: "direct for any Swiss public-sector PAN-OS or Panorama estate with a management interface reachable from outside the administrator range; Hunt names one managed firewall inside a US defense-sector organization as the long-dwell victim"
    sector: "public-sector"
    cves: [CVE-2026-109618, CVE-2026-109619, CVE-2026-46300, CVE-2026-0257]
    techniques: [T1190, T1068, T1505.003, T1543.002, T1037.004, T1572, T1090.001, T1552.001, T1110.003, T1606.001, T1087.002, T1021.004, T1595.002]
    affected_products: ["Palo Alto Networks PAN-OS", "Palo Alto Networks Panorama", "Palo Alto Networks GlobalProtect"]
    entity_keys: ["product:palo-alto-networks-pan-os", "tool:php2shell", "campaign:php2shell-pan-os-fragnesia-rooting-2026-10", "actor:cl-unk-1280"]
    new_entities:
      - { key: "tool:aiscan", type: tool, name: "aiscan", aliases: [], summary: "Multi-agent AI penetration-testing platform (coordinator, worker and RCE-verify agent roles) that Hunt.io found installed on the operator VPS of the PAN-OS PHP2Shell campaign, configured with DeepSeek v4-pro and Kimi k3 back ends (Hunt.io, 2026-11-05)." }
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: "update-of:2026-10-22/pan-os-panorama-php2shell-mgmt-interface-no-fixed-release"
    lookback: true
    evidence:
      - { quote: "Exploitation is restricted to the 12.x branch running PHP 8.0.30.", attribution: "Hunt.io", source_url: "https://hunt.io/blog/inside-the-php2shell-arsenal" }
      - { quote: "ensuring the persistence survives even if systemd unit loading is disrupted during a firmware update", attribution: "Hunt.io", source_url: "https://hunt.io/blog/inside-the-php2shell-arsenal" }
      - { quote: "the operator maintained a toolkit for multiple Palo Alto Networks attack vectors", attribution: "Hunt.io", source_url: "https://hunt.io/blog/inside-the-php2shell-arsenal" }
      - { quote: "which would survive the firewall being reimaged or patched", attribution: "Hunt.io", source_url: "https://hunt.io/blog/inside-the-php2shell-arsenal" }
      - { quote: "Anthropic's Claude Code was also installed on the VPS, but the capture shows no evidence it was used in the exploitation.", attribution: "Hunt.io", source_url: "https://hunt.io/blog/inside-the-php2shell-arsenal" }
    extended_notes: |
      Suggested Admiralty: B2 (Hunt.io B: first-hand open-directory capture; the campaign itself is already corroborated by Dream Research, Unit 42 and the vendor in the existing entry, the Hunt-specific additions are single-source).
      Same operator or not: Hunt and Dream Research describe near-identical artefacts (about 19,000 FOFA-discovered portals, a 240-host batch, PHP 8.0.30, a root relay at change_password.php, 25 roots), but neither cites the other, Hunt names no actor and does not mention Unit 42's CL-UNK-1280, and the geography differs (Dream: US, Japan, Taiwan, South Korea; Hunt: 18 US, 6 South Korea, 1 pivot). Treat it as very likely the same operator and toolkit, but do not merge the counts. Hunt's tool-install timestamps are logged in UTC+8, which fits Unit 42's UTC+8 remark; Hunt draws no attribution from it.
      Tension to hold: the existing entry says Dream found profiles for PAN-OS 12.1, 12.2 and 11.1; in the text of Dream's page that I could extract (its version-profile table did not come through), the funnel says the final list was the 12.1 and 12.2 branches on PHP 8.0.30, and Hunt lists 11.1.6 as unsupported (PHP 7.4.33). The 11.1 statement should be re-read against Dream's profile table before it is repeated; the vendor's affected range is unchanged either way.
      Exposure: affected range is the vendor's (every PAN-OS and Panorama release below its train's hotfix, management web interface); the operator's observed calibration is narrower (12.x, PHP 8.0.30), which says what was exploited at scale, not what is safe. Hunt reports the rooted devices were customer-run firewalls on cloud, carrier and colocation networks, not provider breaches.
      Detection (post-patch compromise check, Hunt's list): a hotfix does not undo an earlier root. Audit the appliance for unauthorised services and SSH keys, PAM changes (the su path made passwordless via pam_permit), modified PHP files in the management web root (change_password.php replaced by a relay while health.php is left intact so the operator can re-enter), a systemd oneshot unit and an rc.local hook that start scripts from a hidden directory under /usr/local/lib, outbound SSH and reverse tunnels from the firewall, and a SOCKS5 listener. On the identity side look for LDAP enumeration and password-spray bursts launched from the firewall's address and for GlobalProtect logins by users who never enrolled; patch CVE-2026-0257 and review GlobalProtect authentication-override cookie use, because Hunt says the cookie forger gives access that outlives a patched or reimaged management plane. Rotate LDAP bind credentials, HA keys and RADIUS secrets that the device held (Hunt lists LDAP bind passwords, HA SSH keys and RADIUS secrets as extraction targets).
      Behaviour and benign lookalike: the unauthenticated web request that fires the chain is a very large multipart POST (Dream); a lookalike is a legitimate administrator password-change page request, but the attacker's page is replaced in place, so a file-integrity comparison of the web root against a known-good image discriminates.
      AI angle (Hunt's account, not independently verified): the aiscan platform ran a coordinator, workers and an RCE-verify agent; Hunt reports its session log shows DeepSeek v4-pro reading 22 offensive playbooks and downloading 17 tools in under nine minutes on 2026-10-08. This supports, but does not prove, the "AI-assisted" label Dream uses.
