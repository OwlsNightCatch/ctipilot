      - { quote: "Der Blockierungsmodus erschwert neue Angriffe, eine bestehende Infektion beseitigt er nicht.", attribution: "BSI", source_url: "https://www.bsi.bund.de/DE/Themen/Unternehmen-und-Organisationen/Informationen-und-Empfehlungen/Empfehlungen-nach-Angriffszielen/Buero/Apple_Mercenary-Spyware/apple_mercenary-spyware_node.html" }
      - { quote: "Apple has begun sending a new round of threat notifications to victims of suspected mercenary spyware attacks located in nearly 100 countries", attribution: "The Record (Recorded Future News)", source_url: "https://therecord.media/apple-warns-users-99-countries-mercenary-spyware" }
      - { quote: "So far we do not see any signs of compromise in the logs that could confirm which actor is responsible for the breaches", attribution: "The Record (Recorded Future News)", source_url: "https://therecord.media/apple-warns-users-99-countries-mercenary-spyware" }
    extended_notes: |
      Suggested Admiralty: A2 on the BSI facts (first-party authority); attribution and infection status are unknown, not assessed.
      Why this surfaced here and not in S2: the BSI page (dated 2026-11-02) is outside the 26 h window; it reached this run only through the Security Affairs lookback (2026-11-03). No prior_coverage entry carries it (the only store hit for "mercenary spyware" is the unrelated Candiru adfection entry). S2 may also return it from the BSI listing.
      Exposure (source-supported): the targeted population is individuals "likely because of who they are or what they do" (Apple) - politicians, diplomats, journalists; a recipient can check authenticity on the lock screen, in Settings, in the Apple-account mailbox and at account.apple.com after sign-in. Apple states it relies solely on internal threat intelligence and gives no detail on what triggers a notification, so there is no log-based or MDM-side indicator to hunt; the only organisational signal is the user's own report.
      Detection / response (BSI): there is no artefact-based check in the sources; the post-notification path is update, Lockdown Mode, device replacement for high-risk cases, account and messenger re-arming, and reporting to the national authority (BSI service centre). A forensic analysis must precede the update if one is wanted ("sofern keine forensische Analyse beabsichtigt ist").
      Triage / benign lookalike: Apple and BSI both say a genuine notification never asks to click links, open files, install apps or profiles, or give passwords or codes - an e-mail or SMS that does is a phishing impersonation, and the recipient should open account.apple.com directly instead.
      Context (claim by Citizen Lab's John Scott-Railton via The Record): the notifications became public shortly before the Pall Mall Process meeting in Paris on 11-12 November, where voluntary industry guidelines on spyware use are due; The Record relays his speculation that firms giving feedback there may be among the notified. It is his remark, not a finding.
      Defender takeaway candidate: confirm that high-risk users (executives, parliamentarians, diplomatic and security staff) know the genuine-notification checks and have a named reporting path and a replace-device-and-reset-accounts playbook; no Swiss statement exists yet to align with.
