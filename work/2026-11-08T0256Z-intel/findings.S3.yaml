  - title: "Layer3 Intel finds residential-proxy exits on the White House network (AS2650): 236 exits in 30 days through 28 proxy services; Synthient ties them to Infatica installs on Windows 11 devices"
    sources:
      - { url: "https://layer3intel.com/blog/residential-proxies-white-house-network", publisher: "Layer3 Intel", date: "2026-11-04", role: "primary" }
      - { url: "https://krebsonsecurity.com/2026/11/want-to-rent-an-internet-address-at-the-white-house/", publisher: "KrebsOnSecurity", date: "2026-11-04", role: "corroborating" }
      - { url: "https://securityaffairs.com/202563/security/white-house-network-appears-in-global-residential-proxy-traffic.html", publisher: "Security Affairs", date: "2026-11-06", role: "corroborating" }
    discovery_trace: "first seen at: securityaffairs (slice record, rss https://securityaffairs.com/feed, 2026-11-06 22:17Z, https://securityaffairs.com/202563/security/white-house-network-appears-in-global-residential-proxy-traffic.html) -> primary: Layer3 Intel, URL https://layer3intel.com/blog/residential-proxies-white-house-network -> corroboration: KrebsOnSecurity https://krebsonsecurity.com/2026/11/want-to-rent-an-internet-address-at-the-white-house/ (also seen in the Krebs feed sweep); SecurityWeek also reported it 2026-11-06 (not fetched)"
    summary: |
      Layer3 Intel reports that between 2026-10-05 and 2026-11-03 its residential-proxy enumeration pipeline, which buys access to public proxy services and records where the exits land, exited through the network registered to the Executive Office of the President (AS2650) 236 times, from six addresses, on 26 of 30 days, through 28 separate proxy services; Spur's and Synthient's public IP-context pages independently identify the same addresses as residential-proxy exits. About half of the activity falls between 17:00 and midnight US Eastern, which Layer3 reads as a person's device carrying a proxy SDK rather than public guest Wi-Fi, while stating that its data "shows the exits, not the device or the person behind them" and accusing no one. KrebsOnSecurity adds that Synthient told it the AS2650 activity was tied to multiple Windows 11 installations of Infatica, a proxy program often bundled into free desktop and mobile apps, and relays Spur's January 2026 finding of residential proxies in nearly 300 government-owned and operated networks and Infoblox's finding that 65% of its customers query one or more residential-proxy domains (not independently checked here); the White House had not responded. Layer3, citing Synthient's earlier Kimwolf research, warns that poorly secured proxy SDKs have let buyers of proxy access reach the enrolled device's internal network; it presents that risk for AS2650 as conditional, not shown.
    region_nexus: "US federal network in the finding; the exposure class is global - Spur's count, as relayed by Krebs, covers government networks worldwide, and no Swiss network is named by any source"
    primary_sector_nexus: "indirect but transferable: employee Windows endpoints on a government network acting as paid proxy exits, a gap that applies to any public administration with BYOD or unmanaged software installs"
    sector: "public-sector"
    cves: []
    techniques: [T1090]
    affected_products: []
    entity_keys: []
    new_entities:
      - { key: "incident:white-house-network-residential-proxy-exits-2026-11", type: incident, name: "Residential-proxy exits on the White House network (AS2650), October-November 2026", aliases: [], summary: "Layer3 Intel (2026-11-04) counted 236 residential-proxy exits through the Executive Office of the President's network in 30 days via 28 proxy services; Synthient attributes the activity to Infatica installs on Windows 11 devices (via KrebsOnSecurity, 2026-11-04)." }
      - { key: "tool:infatica", type: tool, name: "Infatica proxy service and SDK", aliases: [], summary: "Residential-proxy program often embedded in free mobile and desktop applications; Synthient says it was the proxy software on Windows 11 installations behind the AS2650 exits (KrebsOnSecurity, 2026-11-04)." }
    relation_suggestions:
      - { subject: "incident:white-house-network-residential-proxy-exits-2026-11", object: "tool:infatica", basis: "Synthient says the activity it saw coming from AS2650 was related to multiple Windows 11 installations of Infatica (via KrebsOnSecurity, 2026-11-04)" }
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    lookback: true
    borderline: true
    borderline_reason: "Transferable egress-hygiene lesson with first-party telemetry and independent corroboration, but the finding is about one US network, the device and user are unidentified, and the source is outside the 26 h window (Layer3 and Krebs 2026-11-04, Security Affairs 2026-11-06 via its 145 h lookback)."
    evidence:
      - { quote: "AS2650 is registered to the Executive Office of the President, the federal agency that hosts the White House network.", attribution: "Layer3 Intel", source_url: "https://layer3intel.com/blog/residential-proxies-white-house-network" }
      - { quote: "Our data shows the exits, not the device or the person behind them.", attribution: "Layer3 Intel", source_url: "https://layer3intel.com/blog/residential-proxies-white-house-network" }
      - { quote: "the activity it saw coming from AS2650 was related to multiple Windows 11 installations of a service called", attribution: "KrebsOnSecurity", source_url: "https://krebsonsecurity.com/2026/11/want-to-rent-an-internet-address-at-the-white-house/" }
      - { quote: "found residential proxies in nearly 300 government owned and operated networks", attribution: "KrebsOnSecurity", source_url: "https://krebsonsecurity.com/2026/11/want-to-rent-an-internet-address-at-the-white-house/" }
    extended_notes: |
      Suggested Admiralty: B2 (Layer3 is a new, telemetry-holding vendor; Spur and Synthient identify the same addresses independently; Krebs is B). Candidate source: Layer3 Intel (see candidate_sources).
      Detection concept (from how the finding was made, plus Krebs' Infoblox point): the finding came from outside, by buying proxy access and listing exits, so a defender can run the same check on its own egress addresses and ASN with Layer3's observatory, Spur or Synthient; from inside, DNS and proxy logs queried for the domains of residential-proxy SDK services (Infoblox's statistic rests on DNS visibility), and endpoint software inventory for proxy-SDK apps on managed Windows hosts. The sources do not publish domain or process lists, so none are given here.
      Triage / benign lookalike (Layer3): a guest or visitor Wi-Fi network produces proxy exits too; a strong evening-hours skew with almost no early-morning activity points to a person's device, a flat 24 h pattern to a shared or guest network.
      Defender takeaway candidate: treat unmanaged free-app installs and local-admin rights as the root cause class; the lateral-access risk (a proxy SDK exposing the host's local network) is conditional on SDK quality and is not shown for AS2650.
      Related, not merged: the 2026-11-02/03 dismantling of the XCPE set-top-box proxy botnet (GTIG, Trend, Krebs) is a different infrastructure of the same market; none of the three sources ties it to AS2650.
