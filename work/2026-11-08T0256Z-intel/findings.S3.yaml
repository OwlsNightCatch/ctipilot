  # ------------------------------------------------------------------ 5
  - title: "Apiiro: Claude Code's 'Yes, and don't ask again' saves approved commands, secrets included, in .claude/settings.local.json; 1,122 public copies hold a real secret"
    sources:
      - { url: "https://apiiro.com/blog/coding-agents-leaking-secrets-github-dont-ask-again", publisher: "Apiiro", date: "2026-11-05", role: "primary" }
      - { url: "https://thehackernews.com/2026/11/claude-codes-dont-ask-again-file.html", publisher: "The Hacker News", date: "2026-11-07", role: "corroborating" }
      - { url: "https://code.claude.com/docs/en/settings", publisher: "Anthropic (Claude Code settings documentation)", date: "2026-11-08", role: "context" }
      - { url: "https://code.claude.com/docs/en/permissions", publisher: "Anthropic (Claude Code permissions documentation)", date: "2026-11-08", role: "context" }
    discovery_trace: "first seen at: The Hacker News feed (https://feeds.feedburner.com/TheHackersNews, discovery sweep, 2026-11-07 12:14Z) -> https://thehackernews.com/2026/11/claude-codes-dont-ask-again-file.html -> primary: Apiiro, URL https://apiiro.com/blog/coding-agents-leaking-secrets-github-dont-ask-again -> vendor behaviour: https://code.claude.com/docs/en/settings and https://code.claude.com/docs/en/permissions"
    summary: |
      Apiiro reports that Claude Code, when a developer picks "Yes, and don't ask again" on a shell command that carries a password or token, saves that exact command with the secret in plain text in .claude/settings.local.json in the project; Anthropic's documentation confirms the file and says Claude Code adds it only to the user's global git excludes, so the protection does not travel with the project, a fresh clone, or a file committed earlier. Of 104,185 public copies on GitHub, Apiiro counts 1,122 holding at least one secret (1,379 distinct, among them 379 database passwords, 122 Supabase service-role keys, 43 SSH logins, 42 GitHub, GitLab and npm tokens and 23 AWS keys); counting git history, the shared settings.json and saved agent transcripts the total is 2,539 secrets in 1,994 repositories across 63 organizations, one of which confirmed its key had been live. In the median affected repository the file was first committed 217 days earlier, 215 of the 1,122 files are flagged by neither gitleaks nor TruffleHog because the secret is a password typed inside a command, and of 16 coding agents whose documentation Apiiro compared, Claude Code is the only one confirmed to save the full approved command to a project file by default. Apiiro did not test whether the secrets still work. The mechanism matters to government developers because ARTEX agents were reported this week searching public GitHub for exposed secrets, and because infostealer worms already sweep developer machines for files like this.
    region_nexus: "global; any Swiss public-sector team whose developers use Claude Code with public repositories, forks or shared project folders"
    primary_sector_nexus: "indirect: developer-workstation and repository hygiene; the file also sits on every developer laptop where a command was approved, which is where infostealers look"
    sector: "technology"
    cves: []
    techniques: [T1552.001, T1593.003]
    affected_products: ["Anthropic Claude Code"]
    entity_keys: ["product:anthropic-claude-code"]
    new_entities:
      - { key: "trend:claude-code-settings-local-json-secret-exposure-2026-11", type: trend, name: "Secrets saved in Claude Code's .claude/settings.local.json and published to GitHub (November 2026)", aliases: [], summary: "Apiiro (2026-11-05): 1,122 of 104,185 public copies of the file hold a real secret, typed into commands approved with 'don't ask again'; 2,539 secrets in 1,994 repositories across 63 organizations including history, shared settings and transcripts." }
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    evidence:
      - { quote: "Out of 104,185 public copies of this file on GitHub, 1,122 hold a real secret.", attribution: "Apiiro", source_url: "https://apiiro.com/blog/coding-agents-leaking-secrets-github-dont-ask-again" }
      - { quote: "Pick \"Yes, and don't ask again\" and it saves that exact command, secret included", attribution: "Apiiro", source_url: "https://apiiro.com/blog/coding-agents-leaking-secrets-github-dont-ask-again" }
      - { quote: "Of 16 coding agents whose documentation the researchers compared, Claude Code is the only one confirmed to save the full approved command in a project file by default.", attribution: "The Hacker News", source_url: "https://thehackernews.com/2026/11/claude-codes-dont-ask-again-file.html" }
      - { quote: "it adds `**/.claude/settings.local.json` to your global git excludes file", attribution: "Anthropic (Claude Code settings documentation)", source_url: "https://code.claude.com/docs/en/settings" }
    extended_notes: |
      Suggested Admiralty: B2 (Apiiro B: first-party counting on public GitHub plus vendor documentation confirming the mechanism; no independent count). Candidate source: Apiiro blog (see candidate_sources). Related existing entry: 2026-08-10/coding-agent-forensic-artefacts-opencode-codex-credentials (coding-agent credential artefacts); main agent should reference it rather than fold.
      Exposure: check the organisation's GitHub for .claude/settings.local.json and .claude/settings.json (Apiiro), including git history and forks; on laptops, read the allow list of every project folder where "don't ask again" was used. The file is plain JSON and can also ride along in an npm package, a Docker image, an archive or a synced folder (Apiiro).
      Detection: secret scanners built on key formats miss about one file in five (passwords typed after PGPASSWORD=, sshpass -p or mysql -p look like ordinary words); a custom scanner rule for allow-list entries in these files is the gap; the post-find step is rotate first, clean up second, then git rm --cached and a repository-level .gitignore entry (Apiiro).
      Hardening (Apiiro): approve command patterns such as Bash(npm run:*) rather than single commands, and refer to secrets as variables from a secrets manager so the saved rule holds the variable name.
      Defender takeaway candidate: a rotation-first response for any hit; and the ARTEX connection - public-GitHub secret search by agents is now observed in the wild (Microsoft 2026-11-05, already in the store), which makes a leaked-and-deleted key a live exposure.
