  - title: "Apple's 29-30 October mercenary-spyware threat notifications reach Bundestag members and federal-government staff; BSI tells recipients to treat the iPhone as possibly compromised"
    sources:
      - { url: "https://www.bsi.bund.de/DE/Themen/Unternehmen-und-Organisationen/Informationen-und-Empfehlungen/Empfehlungen-nach-Angriffszielen/Buero/Apple_Mercenary-Spyware/apple_mercenary-spyware_node.html", publisher: "BSI (Bedrohungsbenachrichtigungen von Apple zu Mercenary Spyware)", date: "2026-11-02", role: "primary" }
      - { url: "https://therecord.media/apple-warns-users-99-countries-mercenary-spyware", publisher: "The Record (Recorded Future News)", date: "2026-11-02", role: "corroborating" }
      - { url: "https://therecord.media/german-officials-among-apple-spyware-warning-recipients", publisher: "The Record (Recorded Future News)", date: "2026-11-03", role: "corroborating" }
      - { url: "https://www.euronews.com/2026/11/02/german-mps-and-ministers-warned-iphones-have-been-targeted-by-spyware", publisher: "Euronews", date: "2026-11-02", role: "corroborating" }
      - { url: "https://support.apple.com/en-us/102174", publisher: "Apple Support (About Apple threat notifications)", date: "2026-08-13", role: "context" }
    discovery_trace: "first seen at: securityaffairs (slice record, rss https://securityaffairs.com/feed?paged=2 -> https://securityaffairs.com/202297/intelligence/apples-spyware-notifications-reach-the-bundestag-what-the-bsi-says-to-do-now.html, 2026-11-03) -> primary: BSI page, URL https://www.bsi.bund.de/DE/Themen/Unternehmen-und-Organisationen/Informationen-und-Empfehlungen/Empfehlungen-nach-Angriffszielen/Buero/Apple_Mercenary-Spyware/apple_mercenary-spyware_node.html -> corroboration: The Record https://therecord.media/apple-warns-users-99-countries-mercenary-spyware and https://therecord.media/german-officials-among-apple-spyware-warning-recipients, Euronews https://www.euronews.com/2026/11/02/german-mps-and-ministers-warned-iphones-have-been-targeted-by-spyware, Apple https://support.apple.com/en-us/102174; WebSearch (\"Apple Bedrohungsbenachrichtigung Mercenary Spyware Schweiz Parlament Bundesverwaltung November 2026\") found no Swiss authority or parliament statement"
    summary: |
      Apple began a new round of threat notifications to victims of suspected mercenary-spyware attacks in 99 countries on 2026-10-29/30 (The Record, from the notification screenshot threat researcher Costin Raiu says he verified). Germany's BSI says several Bundestag members and other public figures have received the notification since 29 October, that it does not know whether the alerts mean actual compromise or only attempted attacks, and that it wrote to the Bundestag members on 30 October; the digital minister said members of the federal government were also warned, and The Record, citing Der Spiegel, reports that staffers of federal ministries, lawmakers and journalists travelling with the Chancellor in Asia were among the recipients. BSI's recommendation is to assume the device may be compromised: update iOS at once unless a forensic analysis is planned, keep Lockdown Mode on permanently (it hampers new attacks but does not remove an existing infection), consider replacing the device and the phone number where the risk looks high, set a new passcode, change Apple-account and mail passwords, and re-arm Signal registration lock and WhatsApp two-step verification with new PINs. Apple does not attribute the attacks, and neither Apple nor BSI has named an actor, a spyware vendor or an infection vector; Raiu says the logs he has seen show no signs of compromise that would identify the actor. Apple's own page says it has notified users in over 150 countries since 2021 and that a genuine notification shows on the lock screen, in Settings, by e-mail to the Apple-account address and as a banner at account.apple.com after sign-in, and never asks for links, files, apps, profiles, passwords or codes. I found no statement by a Swiss authority or the Swiss parliament as of 2026-11-08.
    region_nexus: "Germany (neighbouring federal government and parliament); the wave spans 99 countries and no source lists them, so Swiss recipients are neither confirmed nor excluded"
    primary_sector_nexus: "direct: elected officials, ministry staff and delegation members of a federal government are the targeted population; the same high-risk-user exposure exists for Swiss federal, cantonal and communal officials"
    sector: "public-sector"
