  - title: "Joint FBI/NPA/ASD/BND/BfV advisory: DPRK's WaterPlum (\"Contagious Interview\") crew infected 30,000+ devices and drained $10.7M from 7,000 crypto wallets via fake job interviews, while the same network's IT-worker scheme keeps placing operators as remote developers"
    sources:
      - { url: "https://www.ic3.gov/CSA/2026/260918.pdf", publisher: "FBI / IC3 (Joint Cybersecurity Advisory with NPA Japan, Japan NCO, DoD Cyber Crime Center, Australian Signals Directorate/ACSC, Germany BND, Germany BfV)", date: "2026-09-18", role: "primary" }
      - { url: "https://www.verfassungsschutz.de/SharedDocs/kurzmeldungen/DE/2026/2026-09-18-joint-cybersecurity-advisory.html", publisher: "Bundesamt für Verfassungsschutz (Germany)", date: "2026-09-18", role: "primary" }
      - { url: "https://www.heise.de/news/Nordkoreanische-Cybergruppe-bestiehlt-IT-Fachleute-auf-Jobsuche-11458275.html", publisher: "heise online", date: "2026-09-18", role: "corroborating" }
    discovery_trace: "first seen at: heise-sec (RSS), URL https://www.heise.de/security/feed.xml → article URL https://www.heise.de/news/Nordkoreanische-Cybergruppe-bestiehlt-IT-Fachleute-auf-Jobsuche-11458275.html → primary: Bundesamt für Verfassungsschutz, URL https://www.verfassungsschutz.de/SharedDocs/kurzmeldungen/DE/2026/2026-09-18-joint-cybersecurity-advisory.html → primary: FBI/IC3 joint CSA PDF, URL https://www.ic3.gov/CSA/2026/260918.pdf"
    summary: |
      Germany's BfV and BND jointly published a security notice on 2026-09-18 alongside a US/Japan/Australia
      joint Cybersecurity Advisory (FBI, Japan's National Police Agency and National Cybersecurity Office, the
      US DoD Cyber Crime Center, and the Australian Signals Directorate's ACSC) on the North Korean "WaterPlum"
      cyber-actor group, publicly tracked as "Contagious Interview" (registry aliases: DeceptiveDevelopment,
      REF9403). WaterPlum poses as recruiters — frequently impersonating AI, cryptocurrency or NFT companies,
      and also using legitimate recruiting/freelance platforms — to lure software developers and IT
      professionals worldwide into technical "interviews" or take-home coding assignments. Victims are
      instructed to download and run files hosted on collaboration platforms and code repositories to
      "complete an assignment" or "fix an error"; those files are malicious npm packages carrying BeaverTail
      (JavaScript loader, distributed via GitHub/Bitbucket-hosted npm packages), InvisibleFerret (Python-based
      backdoor), OtterCookie (JavaScript RAT/infostealer), OtterCandy (combines OtterCookie + RATatouille
      features) or StoatWaffle — a modular Node.js loader/credential-harvester/RAT that hides inside
      blockchain-themed VS Code project repositories and auto-executes via a malicious VS Code configuration
      file that fires when the folder is opened and trusted. Once backdoored, operators deploy RATs for
      persistence/lateral pivoting and infostealers that exfiltrate browser-stored credentials, clipboard
      contents, keystrokes/screenshots, and cryptocurrency wallet credentials/seed phrases to a C2 IP. The
      advisory states WaterPlum has infected at least 30,000 devices across more than 100 countries and
      exfiltrated funds or credentials from over 7,000 cryptocurrency wallets, moving roughly JPY 1.7 billion
      (~USD 10.7 million/10.71M) in crypto assets to DPRK; Japanese authorities separately dismantled the
      country's first identified "laptop farm" tied to this network. The FBI and NPA assess that WaterPlum
      actors and some North Korean IT workers both operate under the General Bureau of the Munitions Industry
      Department (subordinate to the Workers' Party of Korea Central Committee) — i.e. the same organizational
      umbrella runs both the malware-delivery crew and the separate, long-running scheme (tracked elsewhere as
      PurpleDelta/Jasper Sleet/UNC5267/Wagemole/Famous Chollima) of North Korean nationals obtaining remote
      developer jobs under false identities via facilitator-run "laptop farms" and VPS infrastructure that
      obscures their true location, funnelling salaries back to the regime; the advisory records cases of such
      workers extorting employers over stolen source code and defacing/disabling a hiring company's website.
    region_nexus: "Germany (BfV/BND co-issuer); joint advisory also covers Japan, US, Australia — directly relevant to any Swiss public-sector body or supplier that recruits software developers/IT contractors via freelance platforms or crowdsourcing, or that could unknowingly engage a facilitator-run remote-developer front"
    primary_sector_nexus: "indirect — HR/recruitment and IT-contractor vetting processes across public administration and its technology suppliers"
