      - { key: "malware:invisibleferret", type: malware, name: "InvisibleFerret", aliases: [],
          summary: "Python-based backdoor deployed by DPRK's WaterPlum/Contagious Interview actor group after initial BeaverTail-loader access, used to preserve connectivity and pivot across victim systems (joint FBI/NPA/BfV/ASD Cybersecurity Advisory, 2026-09-18)." }
      - { key: "malware:ottercandy", type: malware, name: "OtterCandy", aliases: [],
          summary: "DPRK/WaterPlum malware combining the features of OtterCookie and RATatouille; disclosed alongside BeaverTail, InvisibleFerret and StoatWaffle in the 2026-09-18 joint Cybersecurity Advisory on the Contagious Interview campaign." }
      - { key: "malware:stoatwaffle", type: malware, name: "StoatWaffle", aliases: [],
          summary: "Modular Node.js malware family (malware loader + credential harvesting + RAT) delivered via malicious Microsoft Visual Studio Code projects using blockchain-themed decoy repositories; an embedded VS Code configuration file triggers auto-run code execution when the victim opens and trusts the folder (joint FBI/NPA/BfV/ASD Cybersecurity Advisory, 2026-09-18)." }
