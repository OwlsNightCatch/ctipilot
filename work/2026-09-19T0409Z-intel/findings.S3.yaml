  - title: "WaterPlum/Contagious Interview: a seven-agency joint advisory quantifies DPRK's fake-job crypto-theft scheme — 30,000 devices, 100 countries, $10.7M laundered, and Japan's first dismantled 'laptop farm'"
    sources:
      - { url: "https://www.ic3.gov/CSA/2026/260918.pdf", publisher: "FBI/DC3/NPA Japan/NCO Japan/ASD-ACSC Australia/BND+BfV Germany (joint Cybersecurity Advisory)", date: "2026-09-18", role: "primary" }
      - { url: "https://www.verfassungsschutz.de/SharedDocs/kurzmeldungen/DE/2026/2026-09-18-joint-cybersecurity-advisory.html", publisher: "Bundesamt für Verfassungsschutz (BfV)", date: "2026-09-18", role: "primary" }
      - { url: "https://therecord.media/north-korean-hackers-infect-thousands-of-devices-waterplum-scheme", publisher: "The Record (Recorded Future News)", date: "2026-09-18", role: "corroborating" }
      - { url: "https://www.heise.de/news/Nordkoreanische-Cybergruppe-bestiehlt-IT-Fachleute-auf-Jobsuche-11458275.html", publisher: "heise online", date: "2026-09-18", role: "corroborating" }
    discovery_trace: "first seen at: heise-sec, URL https://www.heise.de/security/feed.xml → article https://www.heise.de/news/Nordkoreanische-Cybergruppe-bestiehlt-IT-Fachleute-auf-Jobsuche-11458275.html → primary: Bundesamt für Verfassungsschutz (BfV) announcement, URL https://www.verfassungsschutz.de/SharedDocs/kurzmeldungen/DE/2026/2026-09-18-joint-cybersecurity-advisory.html → primary: joint Cybersecurity Advisory (FBI, DoD Cyber Crime Center, Japan NPA/NCO, Australia ASD-ACSC, Germany BND/BfV), URL https://www.ic3.gov/CSA/2026/260918.pdf → corroborating: The Record, URL https://therecord.media/north-korean-hackers-infect-thousands-of-devices-waterplum-scheme"
    summary: |
      Seven government agencies (Japan's NPA and National Cybersecurity Office, the US FBI and DoD Cyber Crime Center, Australia's ASD/ACSC, and Germany's BND and BfV) jointly published a Cybersecurity Advisory on 2026-09-18 quantifying the DPRK "WaterPlum" actor group — the group behind the long-running "Contagious Interview" campaign already tracked in the store — for the first time with concrete scale: at least 30,000 infected devices across 100+ countries between December 2025 and July 2026, with funds or credentials exfiltrated from over 7,000 cryptocurrency wallets, and roughly 1.7 billion JPY ($10.7M) transferred to DPRK. NPA and FBI assess WaterPlum and some DPRK IT-worker operations sit under the General Bureau of the Munitions Industry Department, subordinate to the Workers' Party of Korea Central Committee. The advisory names five distinct malware families dropped via malicious NPM packages during fake technical-interview coding assignments: BeaverTail (JavaScript, hidden in NPM packages hosted on GitHub/Bitbucket), InvisibleFerret (Python backdoor), OtterCookie (JavaScript RAT/infostealer), OtterCandy (combines OtterCookie and RATatouille features), and StoatWaffle — a modular Node.js loader/credential-harvester/RAT that uses blockchain-themed decoy repositories embedding a malicious VS Code configuration file that triggers auto-run code execution the moment the victim opens and trusts the project folder. Post-compromise, RATs preserve connectivity/persistence/lateral pivoting while infostealers exfiltrate browser-stored credentials, clipboard data and keystrokes to a C2 IP. Separately, Japanese authorities disrupted their first-ever DPRK "laptop farm" (operated by a Japanese national enabler), documenting several hundred million JPY moved to foreign accounts and North Korean IT workers using AI face-swapping and AI-generated Japanese speech synthesis to pass video interviews under false identities.
    region_nexus: "global; Germany (BfV/BND, home-region-adjacent) named as a co-issuing authority citing German victims"
