      - { subject: "campaign:contagious-interview", object: "malware:invisibleferret", basis: "Joint CSA, same passage as above — five named malware families used interchangeably by the same campaign." }
      - { subject: "campaign:contagious-interview", object: "malware:ottercandy", basis: "Joint CSA, same passage as above." }
