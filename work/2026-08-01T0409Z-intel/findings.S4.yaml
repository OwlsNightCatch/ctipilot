      - { url: "https://databreaches.net/2026/07/31/amgen-reports-breach-to-sec/", publisher: "DataBreaches.net", date: "2026-08-01", role: "corroborating" }
    discovery_trace: "first seen at: databreaches.net feed, URL https://databreaches.net/feed/ (item 'AMGEN reports breach to SEC', published 2026-08-01T01:45Z) → primary: sec-edgar bridge (8k 2026-07-30 2026-08-01) confirmed the filing, URL https://www.sec.gov/Archives/edgar/data/318154/000031815426000119/amgn-20260729.htm → corroboration: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/amgen-says-cloud-data-breach-exposed-patient-health-proprietary-info/"
    summary: |
      Amgen Inc. filed an 8-K on 2026-07-29 (Item 1.05, Material Cybersecurity Incidents) disclosing that
      in July 2026 it identified unauthorized activity involving data stored in cloud environments hosted
      by third-party cloud service providers, and has since confirmed that proprietary data, patient
      protected health information (PHI), and other information were exfiltrated. Amgen has not named the
      third-party cloud provider(s), the intrusion vector, the number of individuals affected, or any
      threat-actor/extortion claim; no impact to products, manufacturing, or financial-reporting systems
      has been identified, and the company states the incident is not reasonably likely to have a
      material financial impact. Amgen is one of the world's largest biopharmaceutical companies with
      substantial EU manufacturing (Netherlands) and patient populations across Europe, so PHI exposure
      is not necessarily confined to US data subjects. The incident extends the pattern this pipeline has
      tracked all week — breaches entering through a trusted third party (cloud host, ITSM platform,
      supplier data-exchange) rather than the victim's own perimeter (cf. Ernst & Young's ITSM-platform
      breach, IWB Basel's service-provider breach) — and is a reminder that "cloud environment operated by
      a third party" sits outside most classic network-perimeter monitoring and DLP scope.
    region_nexus: "global — Amgen is a multinational biopharmaceutical company with EU manufacturing (Netherlands) and patients across Europe; no EU-specific confirmation yet but PHI scope is not disclosed as US-only"
    primary_sector_nexus: "indirect (healthcare/pharma — additional profiled sector; no direct Swiss/European public-sector nexus confirmed yet)"
