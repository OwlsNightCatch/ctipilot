        attribution: "Censys Research"
        source_url: "https://censys.com/blog/cisa-alert-water-tower-plc-targeting/"
    extended_notes: |
      Clears the out-of-nexus inclusion gate primarily on (d) — an imminent, directly transferable threat:
      the same targeted PLC family (Siemens SIMATIC S7-1200) is disproportionately internet-exposed inside
      the EU right now per independent Censys telemetry — and secondarily on (c), since the suspected actor
      class (Iran-nexus, per FBI/state-official statements — not CISA's own attribution) already has a
      documented history of targeting European/international ICS (cf. tracked actor:cyberav3ngers). Note
      the attribution is explicitly unconfirmed at the CISA-advisory level; CyberScoop reports a political
      dispute over the Iran attribution (Trump vs. state/intelligence-agency assessments), which is why this
      entry frames it as "suspected" per FBI/state officials rather than a confirmed CISA finding. No CVE is
      involved — this is default/weak-credential and unauthenticated-exposure abuse, not a software flaw.

