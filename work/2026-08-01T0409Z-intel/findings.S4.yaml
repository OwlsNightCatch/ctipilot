  - title: "CISA/FBI/EPA: coordinated attacks on internet-exposed water-utility PLCs disrupt 30+ Minnesota systems; Censys shows the same Siemens PLC family is heavily exposed across southern/central Europe"
    sources:
      - { url: "https://www.cisa.gov/news-events/alerts/2026/07/30/cisa-urges-water-and-wastewater-systems-sector-protect-ot-against-activity-targeting-plcs", publisher: "CISA (with EPA and FBI)", date: "2026-07-30", role: "primary" }
      - { url: "https://www.securityweek.com/dozens-of-minnesota-water-utilities-targeted-in-coordinated-ot-attacks/", publisher: "SecurityWeek", date: "2026-07-29", role: "corroborating" }
      - { url: "https://www.securityweek.com/cyberattacks-on-minnesota-water-systems-investigated-as-officials-warn-about-iranian-hackers/", publisher: "SecurityWeek / Associated Press", date: "2026-07-31", role: "corroborating" }
      - { url: "https://www.bleepingcomputer.com/news/security/cisa-warns-of-cyberattacks-disrupting-us-water-utilities/", publisher: "BleepingComputer", date: "2026-07-31", role: "corroborating" }
