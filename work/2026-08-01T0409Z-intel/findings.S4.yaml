      - { url: "https://cyberscoop.com/trump-blames-minnesota-water-cyberattacks-iran/", publisher: "CyberScoop", date: "2026-07-31", role: "corroborating" }
    discovery_trace: "first seen at: securityweek feed, URL https://www.securityweek.com/feed/ (item 'Cyberattacks on Minnesota Water Systems Investigated...', published 2026-07-31T15:17Z) → pivot: SecurityWeek's earlier report, URL https://www.securityweek.com/dozens-of-minnesota-water-utilities-targeted-in-coordinated-ot-attacks/ → primary: CISA alert (bridge fetch via jina fallback), URL https://www.cisa.gov/news-events/alerts/2026/07/30/cisa-urges-water-and-wastewater-systems-sector-protect-ot-against-activity-targeting-plcs → corroboration: Censys geographic exposure data, URL https://censys.com/blog/cisa-alert-water-tower-plc-targeting/"
    summary: |
      CISA, with the EPA and FBI, issued an alert on 2026-07-30 describing "a significant increase in cyber
      threat actors targeting programmable logic controllers (PLCs) in the Water and Wastewater Systems
      Sector." Over 30 Minnesota community water systems were hit on 26-27 July: attackers reached
      internet-exposed PLCs, modified passwords to lock operators out, and changed the devices' IP
      addresses to disconnect them — CISA states this activity "has resulted in boil water notices and
      sustained manual operations" nationally. One town (Braham) had its well/treatment-plant controls
      shut down; Plymouth traced its exposure to a PLC reachable via an undocumented cellular modem. FBI
      and Minnesota state officials are investigating a suspected Iran nexus based on TTP similarity to
      prior Iran-linked water-sector campaigns (SecurityWeek/AP), though CISA's own alert does not name an
      actor. Vendor-neutral hardening: disconnect PLCs from the internet (route remote access through a
      VPN/gateway, never direct), enable password protection and change default passwords, allowlist IPs
      to known engineering hosts, and keep a known-clean PLC backup image in case of password lockout;
      CISA singles out Rockwell Automation MicroLogix 1400 owners for vendor-specific recovery guidance.
      Censys's follow-on scan quantifies the exposed surface: 4,148 internet-exposed Rockwell/Allen-Bradley
      EtherNet/IP hosts (71% US, cellular carriers 59% of the total) and 4,117 exposed Siemens SIMATIC
      S7-1200 hosts concentrated 86% in southern/central Europe — Greece, Spain, Italy and Austria — plus
      2,072 exposed Schneider Electric hosts (55.5% Turkey/Australia). The Siemens S7-1200 exposure
      concentration in EU member states is the direct transferability signal: the same PLC family and
      exposure pattern targeted in this US campaign sits, in large numbers, inside European water/energy
      networks today.
    region_nexus: "primary victims are US (Minnesota); Censys confirms the targeted Siemens SIMATIC S7-1200 PLC family is disproportionately internet-exposed in Greece, Spain, Italy and Austria (86% of global exposure), giving direct EU relevance to the same exposure class"
