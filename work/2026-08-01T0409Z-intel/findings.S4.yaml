  - title: "Amgen discloses a material cybersecurity incident: patient PHI and proprietary data exfiltrated from third-party cloud environments"
    sources:
      - { url: "https://www.sec.gov/Archives/edgar/data/318154/000031815426000119/amgn-20260729.htm", publisher: "Amgen Inc. (SEC Form 8-K, Item 1.05)", date: "2026-07-29", role: "primary" }
