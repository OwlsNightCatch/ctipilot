  item: "CaptiveCrunch: Storm-2945 hospitality captive-portal RAT (DEEP DIVE)"
  url_or_quote: "Microsoft: \"Despite some tactic, technique, and procedure (TTP) similarities to the Forest Blizzard DNS hijacking operation that we publicly disclosed in April 2026, we attribute this campaign, which we call CaptiveCrunch, to Storm-2945.\" / ReliaQuest: \"ReliaQuest assesses this tradecraft is similar to that of APT28 (also known as Fancy Bear and Forest Blizzard), a Russian military intelligence group that was previously linked to similar router-based campaigns compromising Microsoft 365 accounts.\""
  summary: "Two cited sources point at two different Russian services for the same attack surface — Microsoft at Storm-2945 / Midnight Blizzard (SVR) and ReliaQuest at APT28 / Forest Blizzard (GRU) — and Microsoft explicitly addresses and overrides the Forest Blizzard reading in its opening paragraph. For a government reader the GRU-vs-SVR question is the most consequential line in the entry, and it is currently invisible: the entry never mentions Forest Blizzard/APT28 at all. Add a Contradiction line and quote Microsoft's own 'Despite some TTP similarities…' sentence. (The registry note on campaign:captivecrunch-storm-2945-hospitality-wifi already records this nuance — the entry does not.)"
