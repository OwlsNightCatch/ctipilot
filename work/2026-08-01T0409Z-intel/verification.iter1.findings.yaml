  item: "M365 device-code phishing second wave on BL Networks (update_of 2026-07-10)"
  url_or_quote: "headline: \"a VPS reseller that also sells legitimate hosting, so reputation scoring never flags it\"; summary: \"because the provider carries legitimate customers, reputation and ASN blocklists do not flag it\""
  summary: "The absolute 'never' / 'do not' is contradicted by the cited Huntress post, which states 'However, cybersecurity researchers have frequently flagged its IP addresses because bad actors have used its servers for malicious campaigns as well' and closes 'The bigger lesson here is not that one provider is bad forever.' Huntress's actual claim is narrower — 'infrastructure reputation is holding too much weight in many defense stacks. When a login originates from a provider or autonomous system that is generally trusted across commercial controls, attackers get a window to operate.' Fix: replace the absolute with Huntress's 'generally trusted across commercial controls' framing."
- code: F8
