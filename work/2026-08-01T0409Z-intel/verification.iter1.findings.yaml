  item: "CVE-2026-14512 / CVE-2026-14446 — IBM WebSphere Application Server"
  url_or_quote: "\"offers only two paths — an interim fix resolving APAR DT496500 for the console flaw, or APAR PH72166 for the deserialization and log-disclosure pair — with the permanent Fix Packs 9.0.5.29 and 8.5.5.31 carrying a \\\"targeted availability 3Q2026\\\" ([IBM PSIRT, 2026-07-28](https://www.ibm.com/support/pages/node/7281631))\""
