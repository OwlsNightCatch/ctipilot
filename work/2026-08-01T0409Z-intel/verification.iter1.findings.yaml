  item: "Water-utility PLC lockouts spread to seven US states (update_of 2026-07-29 Minnesota)"
  url_or_quote: "\"SecurityWeek, relaying the Associated Press, reports that the FBI and Minnesota state officials are examining a possible Iranian nexus ([SecurityWeek / AP, 2026-07-31](https://www.securityweek.com/cyberattacks-on-minnesota-water-systems-investigated-as-officials-warn-about-iranian-hackers/))\""
