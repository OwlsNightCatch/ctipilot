  item: "CVE-2026-28323 — SolarWinds Web Help Desk SAML auth bypass"
  url_or_quote: "sourcing_note: \"The vendor advisory is dated 2026-07-23 and the fix predates it\""
  summary: "Contradicted by the vendor. SolarWinds' own WHD 2026.2.1 release notes (https://documentation.solarwinds.com/en/success_center/whd/content/release_notes/whd_2026-2-1_release_notes.htm, linked from the NCSC-CH advisory this entry cites) state 'Release date: July 30, 2026'. The advisory (First Published 07/23/2026) PREDATES the fix by seven days. This also inverts the entry's freshness argument: the fixed release only became available on 2026-07-30, one day before the NCSC-CH/heise pickup, which is a stronger in-window anchor than the one currently given."
