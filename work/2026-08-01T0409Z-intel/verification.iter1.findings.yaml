  item: "CaptiveCrunch: Storm-2945 hospitality captive-portal RAT (DEEP DIVE)"
  url_or_quote: "\"but it stops short of attributing its cases to this cluster, stating that \\\"this campaign isn't currently assessed to be FrostArmada itself, but it shares enough tactics, techniques, and procedures (TTPs) to suggest tradecraft reuse at a minimum\\\"\""
  summary: "'this cluster' in the entry means Storm-2945 / Midnight Blizzard (SVR). The quoted ReliaQuest sentence is about a DIFFERENT actor: FrostArmada is an APT28-linked SOHO-router DNS campaign disrupted in April 2026, and ReliaQuest's own assessment is 'ReliaQuest assesses this tradecraft is similar to that of APT28 (also known as Fancy Bear and Forest Blizzard), a Russian military intelligence group' — i.e. GRU, not SVR. ReliaQuest never considered the Midnight Blizzard cluster. The sourcing_note repeats it ('explicitly declines to attribute its own cases to the same cluster'). Fix: say ReliaQuest declines to attribute to FrostArmada/APT28 specifically, and note it did not assess the Midnight Blizzard hypothesis. Also: 'FrostArmada' appears with no explanation of what it is."
- code: F4
