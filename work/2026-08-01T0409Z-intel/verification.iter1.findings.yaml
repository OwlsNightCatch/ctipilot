  item: "CVE-2026-14512 / CVE-2026-14446 — IBM WebSphere Application Server"
  url_or_quote: "actions[0]: \"Apply the IBM interim fixes resolving APAR PH72166 and APAR DT496500 to every WebSphere Application Server traditional 9.0.x and 8.5.x instance now\""
  summary: "The entry's own cited heise article (fetched) lists a wider 2026-07-28 WebSphere bulletin batch that the entry never acknowledges — including 'IBM WebSphere Application Server is affected by an authentication bypass (CVE-2026-16184)' (node/7281628), a Liberty RCE/path-segment-injection pair (CVE-2026-14976, CVE-2026-15280, node/7281633), a further XSS+deserialization bulletin (CVE-2026-14974, CVE-2026-14515, node/7281641) and a Liberty DoS (CVE-2026-16192) — and heise names interim fixes 'APAR PH72191 oder PH72192' for that wider batch. An admin who works the entry's single action item applies two APARs and remains exposed to another authentication bypass in the same release. Add one sentence scoping the entry to the NCSC-CH-carried trio and pointing at the wider 28 July batch."
