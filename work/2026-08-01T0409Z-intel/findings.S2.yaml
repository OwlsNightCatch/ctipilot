    discovery_trace: "first seen at: WebSearch (\"cyberattaque administration commune France 31 juillet 2026\") -> cyberattaque.org RSS feed (https://www.cyberattaque.org/type/attaque/feed/) -> primary lead: Cyberattaque.org, URL https://www.cyberattaque.org/education-nationale-25-ans-de-donnees-dagents-potentiellement-exposees-apres-une-cyberattaque/ -> corroboration: Clubic, URL https://www.clubic.com/actualite-623734-nouvelle-cyberattaque-contre-l-education-nationale-les-donnees-d-un-grand-nombre-d-agents-potentiellement-dans-la-nature.html -> corroboration: franceinfo, URL https://www.franceinfo.fr/societe/education/potentiel-vol-de-donnees-personnelles-d-un-nombre-important-d-agents-de-l-education-nationale_8130599.html -> background pivot: Ministère de l'Éducation nationale official communiqué on the March 2026 COMPAS precedent, URL https://www.education.gouv.fr/incident-de-securite-affectant-les-donnees-de-certains-personnels-de-l-education-nationale-470657 (confirmed via fetch to be the March incident, not a fresh release for this one)"
    summary: |
      France's Ministère de l'Éducation nationale confirmed on 2026-07-31 a security incident in which an attacker used a hijacked professional (staff) account to reach the ministry's internal information system dedicated to managing agent training. The intrusion is dated to the night of 2026-07-25; the ministry's security operations centre was alerted the next day (26 July), external access to the affected application was suspended, and a crisis cell was activated to check other ministry systems for propagation or additional compromised accounts. The exposed environment held identity and professional data — name, function, and academy-employment history — for every agent who has worked in a French académie since 2001; for a subset of those records, postal address, phone number and French national ID/social-security number (NIR) were also present. The ministry states the compromised system held no passwords, no banking details and no student data. ANSSI and the CNIL (data-protection authority) have been notified and a criminal complaint filed; the exact number of records actually viewed or exfiltrated (versus merely present in scope) is not yet stated. Neither the initial-access mechanism (credential phishing, password reuse, infostealer) nor the MFA status of the compromised account has been confirmed publicly — the account takeover itself is the only confirmed fact. This is the third major Éducation nationale data-security incident disclosed in 2026: a March 2026 breach of the COMPAS trainee-management system (exfiltration of ~243,000 agent/trainee records via a similarly hijacked "external account") and an April 2026 incident exposing student data through an ÉduConnect-linked service. The recurrence at the same ministry within five months, each time via compromised-account access rather than a technical exploit, points to a systemic identity-hardening gap (credential hygiene / MFA coverage / privileged-application exposure) rather than an isolated event — a transferable lesson for any public-sector body running centralised HR/training platforms with externally reachable authentication.
