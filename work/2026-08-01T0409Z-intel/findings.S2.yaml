    extended_notes: |
      Detection concept (telemetry class first): authentication/session-log anomaly detection on centralised HR/training applications — off-hours sign-ins (this intrusion ran overnight) from a staff account followed by unusually broad read/export activity against personnel records is the observable pattern across all three 2026 Éducation nationale incidents (COMPAS in March, this one in July); the discriminating feature versus a legitimate HR-staff bulk export is the combination of off-hours timing plus a session that never previously touched bulk-record functionality. Session/API access logs on the training-management application, plus conditional-access or identity-provider sign-in logs (impossible-travel, new-device, off-hours flags) are the concrete anchors a defender with an equivalent internal HR/training platform should instrument.
      Hardening: enforce MFA universally on any account with access to centralised personnel/HR/training systems (the source explicitly could not confirm MFA was present or absent on the compromised account, which is itself the gap to close); restrict external/internet-facing reachability of internal HR-training applications to VPN or conditional-access-gated paths (the ministry's own remediation step — suspending external access — is the control that should have been the default posture); rotate and monitor for credential reuse given the ministry has now had three account-takeover-rooted incidents in five months.
      Not mapped to a specific ATT&CK sub-technique beyond T1078 Valid Accounts because the source does not state whether the account was a cloud identity, on-prem AD account, or a bespoke application login, nor confirm the credential-theft vector (phishing / reuse / infostealer are all raised as possibilities, none confirmed).
