  - title: "Huntress: the device-code-phishing wave against Microsoft 365 keeps moving infrastructure — Railway gives way to a VPS reseller (BL Networks), and reputation-based defenses keep missing it"
    sources:
      - { url: "https://www.huntress.com/blog/device-code-phishing-evolving-threats", publisher: "Huntress Labs", date: "2026-07-31", role: "primary" }
    discovery_trace: "first seen at: huntress (S3 slice) via direct article-URL probe (RSS feed at huntress.com/blog/rss.xml only listed items through 2026-07-13, so the article was found by drilling a URL guessed from the site's slug pattern and confirmed live via bridge fetch), URL https://www.huntress.com/blog/device-code-phishing-evolving-threats → primary (no further pivot needed)"
    summary: |
      Huntress documents the continued evolution of Microsoft 365 device-code phishing, the OAuth device-authorization-flow abuse that lets an attacker obtain and replay a legitimate M365 token without stealing a password or defeating MFA outright (T1528, following T1566.002 lure delivery). The campaign this pipeline previously tracked as the Railway/EvilTokens device-code phishing wave (registry: campaign:railway-device-code-phishing-m365-2026, first reported by Huntress 2026-07-09 hosting on the Railway PaaS) has since moved its hosting to BL Networks, a VPS reseller operating since 2017 under ASN AS399629 — disposable, low-reputation infrastructure that keeps outrunning IP/ASN blocklists. Between April and July 2026, Huntress logged 533 events from a single BL Networks IP (216.203.20[.]95), including 113 successful logins in a 48-hour window. Huntress's detection guidance is explicitly behavioral rather than reputation-based: cluster successful `UserLoggedIn` events by hosting provider/ASN misalignment with a user's normal business context, especially when paired with device-code OAuth flow activity across multiple identities and organizations, and treat repeated successful sign-ins from infrastructure inconsistent with the account's normal geography/provider as the signal — not the underlying IP's reputation score, which lags disposable-infrastructure churn. Recommended hardening: restrict or disable device-code authentication where not required, enforce Conditional Access, enable Continuous Access Evaluation for faster token revocation, and treat MFA as insufficient on its own when a legitimate Microsoft authentication flow is what's being abused.
    region_nexus: "global; any Microsoft 365 tenant permitting device-code authentication is exposed, including Swiss/European public-sector and enterprise tenants"
    primary_sector_nexus: "indirect (identity/M365 tenant hardening applies across the public-sector and CI constituency)"
    sector: "cross-sector"
    cves: []
    techniques: [T1528, T1566.002]
    affected_products: ["Microsoft 365", "Microsoft Entra ID"]
    entity_keys: ["campaign:railway-device-code-phishing-m365-2026"]
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "Device code phishing is already difficult to detect because it doesn't look like old-school credential theft."
        attribution: "Huntress Labs"
        source_url: "https://www.huntress.com/blog/device-code-phishing-evolving-threats"
      - quote: "Infrastructure reputation is holding too much weight in many defense stacks."
        attribution: "Huntress Labs"
        source_url: "https://www.huntress.com/blog/device-code-phishing-evolving-threats"
      - quote: "Assume MFA alone is not enough when the attacker is abusing a legitimate Microsoft flow."
