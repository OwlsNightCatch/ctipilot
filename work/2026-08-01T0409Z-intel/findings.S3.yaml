  - title: "Kaspersky documents the exact correlation logic KATA uses to flag Kerberoasting (per-account/IP unique-SPN thresholding) and DNS tunneling (subdomain+TXT volumetric thresholding)"
    sources:
      - { url: "https://securelist.com/tr/network-anomaly-detection-in-kata/120892/", publisher: "Kaspersky Securelist (GReAT)", date: "2026-07-31", role: "primary" }
    discovery_trace: "first seen at: kaspersky-securelist (S3 slice), URL https://securelist.com/ → primary: Kaspersky Securelist, URL https://securelist.com/tr/network-anomaly-detection-in-kata/120892/ (correct URL recovered via securelist.com/feed/ after an initial WebSearch-suggested mirror URL 404'd)"
    summary: |
      Kaspersky's GReAT team publishes the actual correlation-rule logic behind two of its Kaspersky Anti Targeted Attack (KATA) Network Anomaly Detection rules, which is portable analytic guidance beyond the specific product. For Kerberoasting (T1558.003) detection: group Kerberos sessions by source IP and client account name (`cname`), aggregate the set of unique Service Principal Names (`sname`) that receive TGS-REP responses for that IP/account pair within a configurable search window, and alert when the unique-SPN count meets or exceeds a threshold (`count_spns`) — after excluding system SPNs and an allowlist of known-legitimate IPs/users (`excl_sip`, `excl_users`). This directly targets the behavioral signature of mass ticket-granting-service requests used to harvest crackable service-account hashes, while avoiding false positives from routine TGS issuance. For DNS tunneling (T1071.004): flag a single client sending DNS queries with variable left-hand subdomain labels against a static right-hand domain while receiving TXT responses, when the combined byte volume of the encoded subdomains plus TXT response data crosses a `traffic_size` threshold within the search window. Kaspersky frames both rules as examples of a general design pattern — protocol-specific statistical baselining tuned to the organization's own infrastructure and usage patterns rather than static signatures — intended to reduce false positives against legitimate high-volume Kerberos/DNS traffic.
    region_nexus: "global; the detection logic is directly reusable by any organization instrumenting Kerberos/DNS telemetry, independent of vendor"
    primary_sector_nexus: "indirect"
    sector: "cross-sector"
    cves: []
    techniques: [T1558.003, T1071.004]
    affected_products: []
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    borderline: true
    borderline_reason: "This is Kaspersky's own product-detection documentation (KATA Network Anomaly Detection rules) rather than independent attacker-technique research; included because the correlation logic for both Kerberoasting and DNS-tunneling detection is concrete, vendor-portable, and directly reusable by a detection engineer building the equivalent SIEM/EDR analytic outside KATA. The main agent should judge whether this crosses the 'no product pitches' line for this deployment."
    evidence:
      - quote: "Group the sessions by the source IP address and client account name (cname), while aggregating sessions with unique SPNs. Generate an alert if a single IP address using a single client account receives TGS-REP responses for N unique SPN names within the specified search depth window, where N equals or exceeds the threshold variable count_spns."
        attribution: "Kaspersky Securelist (GReAT)"
        source_url: "https://securelist.com/tr/network-anomaly-detection-in-kata/120892/"
      - quote: "Generate an alert if the combined size (in bytes) of the unique DNS names and TXT response data for a single IP address within the search depth window exceeds the specified threshold (the traffic_size parameter)."
        attribution: "Kaspersky Securelist (GReAT)"
        source_url: "https://securelist.com/tr/network-anomaly-detection-in-kata/120892/"
    extended_notes: |
      Corroborated only by Kaspersky's own product documentation; no independent source found describing this specific ruleset. Confidence set MEDIUM to reflect the single-source, vendor-documentation nature despite high technical specificity.

