items:
  - title: "XCSSET v40: Unit 42 uses LLM-assisted deobfuscation to reverse a polymorphic, in-memory macOS Xcode-supply-chain implant"
    sources:
      - { url: "https://unit42.paloaltonetworks.com/xcsset-v40-malware-analysis/", publisher: "Palo Alto Networks Unit 42", date: "2026-07-31", role: "primary" }
    discovery_trace: "first seen at: unit42 (S3 slice), URL https://unit42.paloaltonetworks.com/ → primary: Unit 42, URL https://unit42.paloaltonetworks.com/xcsset-v40-malware-analysis/ (URL confirmed via WebSearch after an initial guessed slug 404'd)"
    summary: |
      Unit 42 published a deep-dive on XCSSET v40, the latest version of the long-running macOS malware family that infects Xcode projects and Git repositories to compromise developers via a software-supply-chain vector (T1195.001): the malicious payload rides the Xcode "run script" build phase and executes when a developer locally builds an infected project, then pulls further stages from C2. Distribution has run since early April 2026 through dozens of legitimate Xcode projects with thousands of active users, with heightened targeting observed across South Asia. v40's defense evasion is unusually layered: payload binaries are recompiled every few hours with different hashes (polymorphic generation), a dual-key encryption architecture separates inbound/outbound C2, and a per-module Caesar-cipher obfuscates string literals; core logic is deliberately kept in memory to reduce on-disk footprint (T1027). Persistence combines Git hooks with a Launch Daemon (T1543.004), and fileless persistence abuses the macOS `defaults` preference-domain system as an ad hoc configuration cache — storing Base64-encoded payload fragments under randomized preference keys, a technique Unit 42 calls uncommon in the macOS malware landscape. The malware actively degrades host defenses: it disables SoftwareUpdate channels, kills CloudTelemetryService, takes an exclusive file lock on the XProtect signature database, and resets TCC permission state to force the user to re-consent (T1685, T1548.006). Unit 42 states it used pattern-matching plus LLM assistance to break XCSSET's identifier-substitution cipher and recover the server-side pre-compilation obfuscation — a concrete case of AI-assisted reverse engineering being used defensively against an AI-obfuscation-resistant malware design.
    region_nexus: "global distribution via public Xcode/Git repositories; heightened targeting observed across South Asia; any organization running Xcode-based development, including EU/CH software suppliers, is in the exposure set"
    primary_sector_nexus: "indirect (public-sector software suppliers using Xcode/macOS developer tooling)"
    sector: "technology, software-development, cross-sector"
    cves: []
    techniques: [T1195.001, T1027, T1543.004, T1685, T1548.006]
    affected_products: ["Apple Xcode"]
    entity_keys: []
    new_entities:
      - { key: "malware:xcsset", type: malware, name: "XCSSET", aliases: ["XCSSET v40"],
          summary: "Long-running macOS malware that infects Xcode projects/Git repos to compromise developers via a build-time supply-chain vector; v40 adds polymorphic payload recompilation, in-memory core logic, and abuse of the macOS defaults system for fileless persistence (Unit 42, 2026-07-31)." }
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Since early April 2026, the malware has spread through supply chain attacks by hiding itself in the Xcode projects of dozens of legitimate applications with thousands of active users."
        attribution: "Palo Alto Networks Unit 42"
        source_url: "https://unit42.paloaltonetworks.com/xcsset-v40-malware-analysis/"
      - quote: "The malware scrambles its payload generation at compile time, switching between nested layers of different encryption mechanisms."
        attribution: "Palo Alto Networks Unit 42"
        source_url: "https://unit42.paloaltonetworks.com/xcsset-v40-malware-analysis/"
      - quote: "XCSSET v40 uses the defaults system during initial infection to store and query system information. Misusing defaults as an operational configuration cache is uncommon in the macOS malware landscape."
        attribution: "Palo Alto Networks Unit 42"
        source_url: "https://unit42.paloaltonetworks.com/xcsset-v40-malware-analysis/"
    extended_notes: |
      Background: XCSSET has been tracked since 2020 by Trend Micro and updated by Microsoft in March and September 2025 (both cited as outbound references). This v40 disclosure is the first 2026 technical update in this pipeline's coverage.

  - title: "CaptiveCrunch: a Midnight Blizzard sub-cluster (Storm-2945) hijacks hospitality captive-Wi-Fi portals to plant a Go RAT and a PowerShell stealer on corporate travelers"
    sources:
      - { url: "https://www.microsoft.com/en-us/security/blog/2026/07/31/captivecrunch-midnight-blizzard-targets-travelers-worldwide-for-malware-delivery-and-credential-theft/", publisher: "Microsoft Threat Intelligence", date: "2026-07-31", role: "primary" }
      - { url: "https://reliaquest.com/blog/threat-spotlight-dns-poisoning-tactics-expand-to-hospitality/", publisher: "ReliaQuest", date: "2026-07-23", role: "corroborating" }
    discovery_trace: "first seen at: msft-ti (S3 slice), URL https://www.microsoft.com/en-us/security/blog/topic/threat-intelligence/ → primary: Microsoft Threat Intelligence, URL https://www.microsoft.com/en-us/security/blog/2026/07/31/captivecrunch-midnight-blizzard-targets-travelers-worldwide-for-malware-delivery-and-credential-theft/ → cross-reference: ReliaQuest, URL https://reliaquest.com/blog/threat-spotlight-dns-poisoning-tactics-expand-to-hospitality/ (linked from the Microsoft post's references)"
    summary: |
      Microsoft Threat Intelligence assesses Storm-2945 is an operational sub-cluster of Midnight Blizzard (the SVR-attributed Russian actor) running an operation it names CaptiveCrunch, active since May 2026, that targets corporate travelers by manipulating hospitality-venue captive-portal networks (hotels, conference centers, airports). The actor manipulates DNS/HTTP traffic at the compromised gateway to redirect connecting users through actor-controlled infrastructure (T1557, Adversary-in-the-Middle) and then serves a ClickFix-style fake Windows/browser-update lure via JavaScript injected into the captive-portal page (T1204.004). The primary payload, CornFlake, is a feature-rich Go-based Windows RAT with screenshot capture, keylogging, clipboard monitoring, audio/video surveillance, browser credential theft, USB monitoring and remote shell; it persists via a `svchost32` Windows service (T1543.003), Registry Run keys (T1547.001) and a scheduled task (T1053.005), with a watchdog routine that restores any persistence mechanism an operator or defender removes. C2 uses ECDH P-256 ephemeral key exchange with SHA-256 session-key derivation over a custom encrypted JSON protocol. A secondary PowerShell tool, ChocoShell, is deployed for high-volume theft of browser session cookies, saved passwords, Microsoft 365 SSO tokens and Wi-Fi credentials (T1555.003, T1539, T1528), using multiple UAC-bypass techniques. Storm-2945 has separately run device-code and OAuth-code phishing against the same traveler population, tying the campaign into Microsoft's broader Entra-ID phishing tracking. Independently, ReliaQuest reported a related but not identical hospitality-captive-portal DNS-poisoning campaign on 2026-07-23 (compromised gateways in the US, India and Saudi Arabia, victim traffic from financial services, legal, healthcare and energy sectors) that it explicitly declines to attribute to CaptiveCrunch/Storm-2945 itself, noting only TTP overlap with the actor's prior "FrostArmada" activity — corroborating the broader captive-portal attack surface without confirming the specific Storm-2945 claim. Microsoft ships KQL hunting queries (NCSI-connectivity-then-file-creation patterns, CornFlake service/registry artifacts, ChocoShell C2 traffic) and Defender alert names including a Russian-state-actor tag, UAC-bypass detections and OAuth device-code anomaly detections.
    region_nexus: "global targeting of traveling corporate/government personnel at hotels and conference venues; directly relevant to Swiss/European government and CI staff traveling internationally, and to any hospitality-sector operator running captive-portal Wi-Fi"
    primary_sector_nexus: "direct (government/diplomatic travelers are the named target population); additional exposure for hospitality, finance, legal, healthcare and energy per ReliaQuest's related finding"
    sector: "public-sector, hospitality, cross-sector (any captive-portal operator)"
    cves: []
    techniques: [T1557, T1204.004, T1543.003, T1547.001, T1053.005, T1555.003, T1539, T1528]
