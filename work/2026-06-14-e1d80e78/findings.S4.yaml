items:
  - title: "Kyushu Electric Power subsidiary discloses unencrypted SSD with 10.9 million customer records missing — Japan's largest-ever personal data breach"
    sources:
      - url: "https://www.bleepingcomputer.com/news/security/japanese-energy-firm-loses-drive-with-data-of-109-million-clients/"
        publisher: "BleepingComputer"
        date: "2026-06-11"
        role: "primary"
      - url: "https://databreaches.net/2026/06/10/power-company-in-japan-fears-data-breach-after-losing-storage-drive-containing-customer-details/"
        publisher: "DataBreaches.net"
        date: "2026-06-10"
        role: "corroborating"
      - url: "https://www.techtimes.com/articles/318287/20260612/japan-data-breach-kyushu-electric-loses-unencrypted-ssd-109-million-customer-records.htm"
        publisher: "TechTimes"
        date: "2026-06-12"
        role: "corroborating"
    discovery_trace: "first seen at: bleepingcomputer (RSS feed https://www.bleepingcomputer.com/feed/), URL https://www.bleepingcomputer.com/news/security/japanese-energy-firm-loses-drive-with-data-of-109-million-clients/ → corroborated via DataBreaches.net (403 on direct fetch — search-driven discovery) and TechTimes"
    summary: |
      Kyushu Electric Power Transmission and Distribution Co. — a wholly-owned subsidiary of one of Japan's largest regional utilities — disclosed on 8 June 2026 that a palm-sized portable SSD containing personal records for approximately 10.9 million customers went missing from a restricted server room. A contractor backed up data to the SSD on 27 April 2026 and stored it in a server-room cabinet; when staff returned on 26 May the cabinet was found unlocked and the drive absent. The SSD held customer names, service-location addresses, telephone numbers, electricity usage data, and retail supplier names — all stored unencrypted and without password protection. No financial data (bank or card) was on the drive. Kyushu Electric notified Japan's Personal Information Protection Commission (PIPC) and the Ministry of Economy, Trade and Industry (METI); METI set a 8 July 2026 deadline for a full incident account and remediation plan. The breach is reported as the largest personal data breach in Japanese history, surpassing the 7.93 million-record JTB incident from 2016. No evidence of data misuse has been confirmed to date, but the unencrypted nature of the lost media means exposure risk is total.
    ch_eu_nexus: "indirect — energy-sector physical-security failure with regulatory notification model that mirrors EU NIS2 Article 23 and GDPR Article 33 obligations; no Swiss or EU entities directly affected"
    public_sector_nexus: "indirect — critical energy infrastructure operator"
    sector: "energy, utilities"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Kyushu Electric Power Transmission and Distribution Co., Inc. has disclosed a physical security incident that affects private data of more than 10 million customers."
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/japanese-energy-firm-loses-drive-with-data-of-109-million-clients/"
      - quote: "The 10.9 million records on that drive were readable by anyone who picked up the device, because the company never encrypted them."
        attribution: "TechTimes"
        source_url: "https://www.techtimes.com/articles/318287/20260612/japan-data-breach-kyushu-electric-loses-unencrypted-ssd-109-million-customer-records.htm"
    extended_notes: |
      Detection/hardening angle for EU/CH SOC teams: physical media controls are frequently an underweight control. Defenders should audit whether backup media leaving server rooms is (a) encrypted at rest with hardware-enforced AES-256, (b) access-logged via RFID or similar, and (c) asset-tagged and inventoried. For EU operators under NIS2, Article 21(2)(h) requires physical security measures; this case demonstrates how a single procedural failure (unlocked cabinet, no media tracking) can produce a regulatory notification and reputational incident even without any remote attack.

  - title: "23andMe bankruptcy court approves $46.75M settlement fund for 7 million genetic data breach victims (2023 breach, June 2026 court action)"
    sources:
      - url: "https://therecord.media/bankruptcy-admin-approves-settlement-for-23andme-breach-victims"
        publisher: "The Record (Recorded Future News)"
        date: "2026-06-12"
        role: "primary"
      - url: "https://news.bloomberglaw.com/bankruptcy-law/23andme-data-breach-claimants-to-receive-47-million-under-deal"
        publisher: "Bloomberg Law"
        date: "2026-06-12"
        role: "corroborating"
    discovery_trace: "first seen at: therecord (RSS feed https://therecord.media/feed), URL https://therecord.media/bankruptcy-admin-approves-settlement-for-23andme-breach-victims → primary (no pivot needed); corroborated by Bloomberg Law (fetched via bridge)"
    summary: |
      The Missouri bankruptcy court administrator for Chrome Holding Co. (formerly 23andMe) approved the disbursement of a $46.75 million settlement fund to approximately 7 million victims of the April 2023 genetic data breach, in which credential-stuffing attackers accessed accounts and posted sensitive ancestry and health-predisposition data on dark-web forums. The settlement represents a $3.25M reduction from the original $50 million cap, with $32.5M going to claimants and more than $14M allocated to Kroll as settlement administrator. 23andMe filed for Chapter 11 bankruptcy in March 2025 and liquidated most of its assets. The approved settlement marks the formal close of the civil liability phase; no criminal charges have been filed against the company or its executives. The breach exposed data for users who had opted into the DNA Relatives feature — making ancestry information, health predispositions, ethnicity profiles, and family-connection graphs accessible.
    ch_eu_nexus: "EU/CH users of 23andMe (including Swiss customers who opted into DNA Relatives) are among the global pool; the settlement does not cover non-US claimants via US bankruptcy proceedings — EU subjects may have separate Article 82 GDPR claims"
    public_sector_nexus: "none"
    sector: "healthcare, consumer"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "About 7 million customers of the genetics testing company had their data stolen by hackers starting in April 2023, and many had their information posted on the dark web."
        attribution: "The Record (Recorded Future News)"
        source_url: "https://therecord.media/bankruptcy-admin-approves-settlement-for-23andme-breach-victims"
      - quote: "The bankruptcy plan administrator for the company once known as 23andMe agreed to disburse $46.7 million under a prior settlement reached with US data breach claimants."
        attribution: "Bloomberg Law"
        source_url: "https://news.bloomberglaw.com/bankruptcy-law/23andme-data-breach-claimants-to-receive-47-million-under-deal"
    extended_notes: |
      The 23andMe breach is a notable reference case for genetic data risk. The credential-stuffing attack vector (no MFA on accounts until after the breach) and the DNA Relatives opt-in feature that amplified the exposure beyond direct account owners are recurring themes in discussions of sensitive-data-class categorisation under GDPR Article 9. The outcome — bankruptcy and $47M settlement — illustrates the tail-risk of holding Category 1 sensitive biometric/genetic data at scale.

  - title: "Conti ransomware member Oleksii Lytvynenko pleads guilty in US federal court — extradited from Ireland, faces 20 years; first Conti conviction under Operation Riptide"
    sources:
      - url: "https://cyberscoop.com/conti-ransomware-member-ukrainian-lytvynenko-guilty/"
        publisher: "CyberScoop"
        date: "2026-06-12"
        role: "primary"
      - url: "https://www.bleepingcomputer.com/news/security/ukrainian-national-pleads-guilty-to-role-in-conti-ransomware-operation/"
        publisher: "BleepingComputer"
        date: "2026-06-12"
        role: "corroborating"
      - url: "https://www.globalsecurity.org/security/library/news/2026/06/sec-260612-doj01.htm"
        publisher: "DOJ (via GlobalSecurity.org)"
        date: "2026-06-12"
        role: "corroborating"
    discovery_trace: "first seen at: bleepingcomputer (RSS feed https://www.bleepingcomputer.com/feed/), URL https://www.bleepingcomputer.com/news/security/ukrainian-national-pleads-guilty-to-role-in-conti-ransomware-operation/ → pivoted to CyberScoop for full body → pivoted to DOJ mirror at globalsecurity.org for official press release text"
    summary: |
      Oleksii Oleksiyovych Lytvynenko, 44, a Ukrainian national, pleaded guilty on 12 June 2026 in the Middle District of Tennessee to conspiracy to commit wire fraud for his role in the Conti ransomware operation. Lytvynenko joined Conti circa September 2021 and was tasked with developing a malware loader component. He admitted to possessing data stolen from eight US and four overseas victims. Conti attacked 1,000+ organisations across 47 US states, DC, Puerto Rico and 31 countries, extorting at least $150 million in ransom before disbanding in 2022. Lytvynenko was arrested in Cork, Ireland in July 2023, extradited to the US in October 2025, and remains in federal custody in Tennessee. He faces a maximum 20-year sentence; sentencing is scheduled for 10 September 2026. The guilty plea is part of FBI Operation Riptide, the bureau's sustained cybercrime-enforcement campaign. Four co-conspirators (Galochkin, Rudenskiy, Tsarev, Zhuykov) were indicted in 2023 and remain at large. The Irish Garda National Cyber Crime Bureau and Irish Department of Justice provided extradition assistance, demonstrating the EU–US MLAT channel for Conti-lineage defendants.
    ch_eu_nexus: "high EU nexus — Irish law-enforcement (Garda GNCCB) and legal assistance from Irish Department of Justice and AG critical to extradition; demonstrates EU member state cooperation with US MLAT chain for ransomware actors; Conti victims included entities in 31 countries"
    public_sector_nexus: "confirmed — Conti attacked a Tennessee sheriff's department, local EMS, and a police department, among the 1,000+ victims including critical infrastructure"
    sector: "cross-sector, public-sector, law-enforcement"
    cves: []
    actors_campaigns_malware: ["Conti", "Conti ransomware"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "A longtime former member of Conti, a ransomware group that attacked more than 1,000 organizations globally before it disbanded in 2022, pleaded guilty to participating in some of those attacks in federal court Wednesday, the Justice Department said."
        attribution: "CyberScoop"
        source_url: "https://cyberscoop.com/conti-ransomware-member-ukrainian-lytvynenko-guilty/"
      - quote: "The defendant and his conspirators used the Conti ransomware to terrorize people and businesses in the United States and around the world, causing millions of dollars in damage."
        attribution: "DOJ (via GlobalSecurity.org)"
        source_url: "https://www.globalsecurity.org/security/library/news/2026/06/sec-260612-doj01.htm"
      - quote: "Lytvynenko was arrested in Ireland in July 2023, extradited to the United States in October 2025, and remains in federal custody in Tennessee."
        attribution: "CyberScoop"
        source_url: "https://cyberscoop.com/conti-ransomware-member-ukrainian-lytvynenko-guilty/"
    extended_notes: |
      Operational context: Conti's known sub-groups after its 2022 dissolution — Zeon, Black Basta, and Quantum/Royal/BlackSuit — remain active or have successors. The Lytvynenko plea covers only a loader-developer role, not the leadership (Stern, Target) who directed the infrastructure. Defenders hunting Conti-lineage intrusions should key on: Cobalt Strike beacons with staged HTTP fetch, AnchorDNS for C2, BazarLoader as first-stage dropper, and Active Directory enumeration via BloodHound/SharpHound. The Ireland extradition precedent strengthens deterrence for actors seeking refuge in EU-member states using temporary protective status.

  - title: "Great Marlow School UK cyberattack closes 1,428-pupil secondary for two days — ICT malware incident, NCSC guidance followed, reopened 12 June after forensic clearance"
    sources:
      - url: "https://gms.bucks.sch.uk/news/important-partial-school-closure-following-ict-incident/"
        publisher: "Great Marlow School (victim statement)"
        date: "2026-06-12"
        role: "primary"
      - url: "https://therecord.media/british-school-sends-students-home-cyberattack"
        publisher: "The Record (Recorded Future News)"
        date: "2026-06-11"
        role: "corroborating"
    discovery_trace: "first seen at: therecord (RSS feed https://therecord.media/feed), URL https://therecord.media/british-school-sends-students-home-cyberattack → pivoted to victim statement at gms.bucks.sch.uk which confirmed reopening and forensic outcome"
    summary: |
      Great Marlow School, a 1,428-pupil secondary in Buckinghamshire, UK, was partially closed on 10 June 2026 after malware affected parts of its ICT infrastructure. All pupils except Year 11 and Year 13 students sitting external (GCSE/A-level) examinations were sent home; internal examinations for Years 10 and 12 were postponed. The school worked with specialist cybersecurity professionals and followed NCSC and Department for Education guidance. On 12 June, the school published a notice on its official website stating that following thorough testing and in collaboration with cybersecurity specialists, no threat was identified on any systems, and that the school would be fully open for all students on Friday 12 June. No ransomware group has claimed responsibility; no data exfiltration has been confirmed. The incident follows an established pattern of UK state-funded secondary schools facing malware-driven ICT disruption during examination season.
    ch_eu_nexus: "UK education sector incident; relevant for EU/CH defenders tracking the pattern of ransomware/malware affecting school exam-season ICT, a trend documented by NCSC UK guidance for schools"
    public_sector_nexus: "direct — state-funded secondary school (public sector)"
    sector: "education, public-sector"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Great Marlow School, which has 1,428 pupils according to the Department for Education (DfE), said it was set to remain closed while it works with specialist IT and cybersecurity professionals to resolve the issue."
        attribution: "The Record (Recorded Future News)"
        source_url: "https://therecord.media/british-school-sends-students-home-cyberattack"
      - quote: "We are pleased to confirm that Great Marlow School will be fully open and operational for all students on Friday 12th June 2026. We would like to reassure you that, following thorough testing and in collaboration with cybersecurity specialists, no threat was identified on any [systems]."
        attribution: "Great Marlow School (victim statement)"
        source_url: "https://gms.bucks.sch.uk/news/important-partial-school-closure-following-ict-incident/"
    extended_notes: |
      Pattern context: UK state secondary schools have faced a sustained wave of ransomware and disruptive malware since 2020. NCSC UK publishes a specific "Cyber security for schools" guidance set, and the ICO has documented 15+ school breaches. The Buckinghamshire case is notable for the rapid forensic clearance (under 48 hours) and transparent victim communication. For CH/EU school district IT teams: exam season (May–July) coincides with end-of-year IT change windows, reduced staffing, and increased pressure not to disrupt examinations — a timing that threat actors exploit.

  - title: "University of Nottingham confirms ShinyHunters breach: Oracle WebLogic zero-day entry, 40+ GB exfiltrated, 455K email addresses exposed, ICO notified [UPDATE on CVE-2026-35273]"
    sources:
      - url: "https://www.nottingham.ac.uk/Home/Alerts/Cyber-attack-incident.aspx"
        publisher: "University of Nottingham (victim statement)"
        date: "2026-06-10"
        role: "primary"
      - url: "https://www.securityweek.com/university-of-nottingham-confirms-breach-after-hackers-leak-data/"
        publisher: "SecurityWeek"
        date: "2026-06-11"
        role: "corroborating"
      - url: "https://www.theregister.com/cyber-crime/2026/06/11/shinyhunters-raids-nottingham-uni-for-student-alumni-data/5253961"
        publisher: "The Register"
        date: "2026-06-11"
        role: "corroborating"
    discovery_trace: "first seen at: WebSearch ('Nottingham University cyberattack data stolen 455000 records 2026') → pivoted to victim statement at https://www.nottingham.ac.uk/Home/Alerts/Cyber-attack-incident.aspx → pivoted to SecurityWeek https://www.securityweek.com/university-of-nottingham-confirms-breach-after-hackers-leak-data/ → The Register https://www.theregister.com/cyber-crime/2026/06/11/shinyhunters-raids-nottingham-uni-for-student-alumni-data/5253961"
    summary: |
      The University of Nottingham confirmed on 10 June 2026 that ShinyHunters (tracked as UNC6240 by Mandiant) had breached its Campus Solutions student-records platform after exploiting a vulnerability in Oracle WebLogic supporting the PeopleSoft Environment Management Hub — the same CVE-2026-35273 zero-day used against other PeopleSoft customers during 27 May–9 June 2026. The attackers exfiltrated more than 40 GB of documents. Have I Been Pwned indexed approximately 455,000 unique email addresses from the leaked files; the full dataset includes names, home addresses, phone numbers, ethnicities, disability status, passport numbers, academic enrolments, fee-payment records, and campus portal exports spanning the UK, Malaysia, and China campuses. The university has contacted affected individuals, notified the UK Information Commissioner's Office (ICO), and reported to Action Fraud. This item constitutes a material delta on the CVE-2026-35273 / ShinyHunters campaign: it adds a confirmed higher-education victim with a victim-owned disclosure, ICO notification, and multi-campus scope (UK, Malaysia, China).
    ch_eu_nexus: "EU education sector — 455K records include students and alumni from across three continents; ICO notification opens a regulatory track in the UK; the Oracle WebLogic exploit vector is the same as the broader ShinyHunters PeopleSoft campaign already tracked"
    public_sector_nexus: "direct — publicly funded higher education institution"
    sector: "education, public-sector"
    cves: ["CVE-2026-35273"]
    actors_campaigns_malware: ["ShinyHunters", "UNC6240"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "update-to-prior:2026-06-12"
    evidence:
      - quote: "The ShinyHunters hacker group has taken credit for the attack, leaking more than 450,000 email addresses and other information."
        attribution: "SecurityWeek"
        source_url: "https://www.securityweek.com/university-of-nottingham-confirms-breach-after-hackers-leak-data/"
      - quote: "The university's forensic investigation identified that an external threat actor exploited a vulnerability in Oracle WebLogic, which supports the Campus Solutions platform, allowing unauthorised remote code execution."
        attribution: "News9Live (aggregating university statement)"
        source_url: "https://www.news9live.com/technology/tech-news/nottingham-university-cyberattack-455000-emails-exposed-2979310"
    extended_notes: |
      UPDATE shape: The CVE-2026-35273 ShinyHunters campaign was first covered in the brief on 2026-06-11/12 (PeopleSoft / Oracle, 100+ victims, Nottingham 455K mentioned). The fresh delta here is: (1) confirmed victim statement from Nottingham itself with ICO notification; (2) multi-campus data exposure (UK + MY + CN campuses); (3) Have I Been Pwned indexing enabling individual notification. The ICO notification opens a formal enforcement track.

