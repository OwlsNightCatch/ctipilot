        publisher: "Infosecurity Magazine"
        date: "2026-06-12"
        role: "corroborating"
      - url: "https://www.group-ib.com/media-center/press-releases/sniperdz-investigation/"
        publisher: "Group-IB"
        date: "2026-06-11"
        role: "corroborating"
    discovery_trace: "first seen at: feed https://feeds.feedburner.com/TheHackersNews → THN item dated 2026-06-12 → WebSearch ('Sniper Dz INTERPOL phishing takedown June 2026') → primary: INTERPOL press release https://www.interpol.int/News-and-Events/News/2026/201-arrests-in-first-of-its-kind-cybercrime-operation-in-MENA-region → corroborating: Infosecurity Magazine https://www.infosecurity-magazine.com/news/interpol-dismantles-sniperdz/"
    summary: |
      INTERPOL announced Operation Ramz, a coordinated cybercrime operation running October 2025 through February 2026 across 13 MENA countries (Algeria, Bahrain, Egypt, Iraq, Jordan, Lebanon, Libya, Morocco, Oman, Palestine, Qatar, Tunisia, UAE). The operation dismantled SniperDz (also written SniperDz), a phishing-as-a-service platform active since approximately 2015. SniperDz provided 80 ready-made phishing templates impersonating PayPal, Facebook, Instagram, Yahoo, Netflix, Steam and others across five languages, hosted free-of-charge infrastructure, and was distributed via Telegram and Facebook channels. Platform scale: 140,000+ phishing pages detected 2023-2024 alone; 20,000+ unique domains identified across nine years; 7,300+ Telegram subscribers; 19,000+ Facebook followers. Operation results: 201 arrests, 382 suspects identified, 3,867 victims documented, 53 servers seized. The primary developer and administrator ("Guedz") was arrested in Algeria by Algerian National Police with intelligence provided by Group-IB, who traced the suspect through OPSEC failures in video tutorials and social media. This is classified as a law enforcement / takedown action rather than active threat intelligence, but is notable for the scale and cross-border coordination.
    ch_eu_nexus: "indirect — SniperDz templates were language-agnostic and used across Europe; the platform provided infrastructure to threat actors globally including European-targeted campaigns"
    public_sector_nexus: "indirect"
    sector: "finance, consumer, all sectors (phishing platform targeting any credential)"
    cves: []
    actors_campaigns_malware: ["SniperDz"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "201 arrests in first of its kind cybercrime operation in MENA region"
        attribution: "INTERPOL"
        source_url: "https://www.interpol.int/News-and-Events/News/2026/201-arrests-in-first-of-its-kind-cybercrime-operation-in-MENA-region"
      - quote: "Over 140,000 phishing pages detected between 2023-2024 alone; more than 20,000 unique domains identified across nine years"
        attribution: "Infosecurity Magazine (citing Group-IB)"
        source_url: "https://www.infosecurity-magazine.com/news/interpol-dismantles-sniperdz/"
    extended_notes: |
      For threat hunters: SniperDz infrastructure (domains, templates) may continue to be used by buyers who obtained kits before the seizure. Hunt for credential exfiltration POST requests to domains not matching institutional patterns. The platform's Telegram-distributed templates are often adaptable — defenders should update phishing detection rules to catch template-shared visual patterns. Group-IB's OSINT attribution (video tutorials, social media footprints) is a case study in threat-actor OPSEC failure modes.

  - title: "CVE-2026-10795: UpdraftPlus WordPress plugin authentication bypass — 3M+ sites exposed, active exploitation observed, unauthenticated RCE via forged RPC commands"
    sources:
      - url: "https://wpscan.com/vulnerability/68addf8c-9ea6-4b62-9f85-e95350b3992e/"
        publisher: "WPScan"
        date: "2026-06-11"
        role: "primary"
      - url: "https://malware.news/t/critical-unauthenticated-authentication-bypass-vulnerability-patched-in-updraftplus-wordpress-plugin/107751"
        publisher: "Malware.news (via Wordfence)"
        date: "2026-06-11"
        role: "corroborating"
    discovery_trace: "first seen at: WebSearch ('UpdraftPlus WordPress critical RCE June 2026') → WPScan advisory https://wpscan.com/vulnerability/68addf8c-9ea6-4b62-9f85-e95350b3992e/ (primary) → corroborating via Wordfence reporting on Malware.news"
    summary: |
      CVE-2026-10795 (CVSS 8.1) is an unauthenticated authentication bypass in UpdraftPlus: WP Backup & Migration Plugin versions ≤ 1.26.4 (3M+ active WordPress installations). The vulnerable function is `UpdraftPlus_Remote_Communications_V2::wp_loaded()`, which registers an unauthenticated RPC listener on every page load for sites connected to UpdraftCentral or using Migrator keys. The cryptographic flaw: `decrypt_message()` fails to validate the return value of `$rsa->decrypt()` — when RSA decryption fails, `false` is passed to `Rijndael::setKey()`, which collapses to a deterministic all-zero AES-128 key. An unauthenticated attacker who knows the key derivation outcome can forge arbitrary RPC commands that execute as the connected administrator. Practical impact: upload and activate a malicious plugin → remote code execution. Sites only exploitable when an active Migrator key or UpdraftCentral key is configured. Patch available in version 1.26.5. Discovered by researcher "vtim" through Wordfence Bug Bounty ($5,200 bounty). Wordfence blocked 4,987 attacks targeting this vulnerability in the 24 hours following disclosure (June 11, 2026). WordPress plugins are widely used across Swiss cantonal and municipal government websites.
    ch_eu_nexus: "global; WordPress/UpdraftPlus is widely used in Swiss cantonal and municipal government sites and EU public-sector web properties"
    public_sector_nexus: "indirect — WordPress is commonly used for public-sector web presence"
    sector: "public-sector, SMB, all WordPress hosting"
    cves: [CVE-2026-10795]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "The decrypt_message() function fails to validate the return value of $rsa->decrypt(), and when RSA decryption fails, false is passed to Rijndael::setKey(), which collapses to a deterministic all-zero AES-128 key"
        attribution: "Wordfence (via Malware.news)"
        source_url: "https://malware.news/t/critical-unauthenticated-authentication-bypass-vulnerability-patched-in-updraftplus-wordpress-plugin/107751"
      - quote: "Wordfence users are protected since June 3, 2026 [blocking 4,987 attacks in 24 hours]"
        attribution: "Wordfence (via Malware.news)"
        source_url: "https://malware.news/t/critical-unauthenticated-authentication-bypass-vulnerability-patched-in-updraftplus-wordpress-plugin/107751"
    extended_notes: |
      Detection: Monitor WordPress admin logs for unexpected plugin upload/activation events outside change windows. Suspicious POST requests containing the `udrpc_message` parameter targeting WordPress `wp-admin/admin-ajax.php` or the site's REST API should alert. Hardening: update to UpdraftPlus 1.26.5 immediately; audit whether UpdraftCentral or Migrator keys are in use; disable if not needed. The Wordfence attack data confirms this is being actively weaponized at scale — treat as urgent patch.

