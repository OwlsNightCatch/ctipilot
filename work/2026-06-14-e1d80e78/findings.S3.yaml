items:
  - title: "watchTowr confirms Splunk Enterprise CVE-2026-20253: unauthenticated pre-auth RCE via PostgreSQL sidecar proxy — Splunk-on-AWS vulnerable out of the box"
    sources:
      - url: "https://labs.watchtowr.com/why-use-app-level-auth-when-every-database-has-auth-splunk-enterprise-cve-2026-20253-pre-auth-rce/"
        publisher: "watchTowr Labs"
        date: "2026-06-12"
        role: "primary"
      - url: "https://advisory.splunk.com/advisories/SVD-2026-0603"
        publisher: "Splunk (Cisco)"
        date: "2026-06-10"
        role: "corroborating"
      - url: "https://thehackernews.com/2026/06/critical-splunk-enterprise-flaw-lets.html"
        publisher: "The Hacker News"
        date: "2026-06-13"
        role: "corroborating"
    discovery_trace: "first seen at: feed https://labs.watchtowr.com/rss/ → watchTowr Labs article URL https://labs.watchtowr.com/why-use-app-level-auth-when-every-database-has-auth-splunk-enterprise-cve-2026-20253-pre-auth-rce/ (primary, fetched via bridge) → vendor advisory https://advisory.splunk.com/advisories/SVD-2026-0603 (fetched via WebFetch)"
    summary: |
      CVE-2026-20253 (CVSS 9.8, CWE-306 Missing Authentication for Critical Function) affects Splunk Enterprise 10.0.0–10.0.6 and 10.2.0–10.2.3. The PostgreSQL Sidecar Service (`splunk-postgres` binary) exposes a Go-based REST API on loopback port 5435 (`/v1/postgres/recovery/backup` and `/v1/postgres/recovery/restore` endpoints) that accepts requests without any authentication. Splunk's main web application proxies these endpoints outbound through `/en-US/splunkd/__raw/v1/postgres/recovery/backup`, making them reachable network-wide with empty credentials (`Authorization: Basic Og==`). watchTowr Labs demonstrated that an unauthenticated attacker can write arbitrary files to `/opt/splunk/var/run/supervisor/pkg-run/pkg-postgres*/` and, by injecting malicious SQL into a crafted backup/restore payload, achieve code execution during database restoration. Splunk Enterprise on AWS is vulnerable out of the box (PostgreSQL sidecar enabled by default); on-premises Windows installs are only vulnerable when the sidecar is explicitly enabled. Patched versions: 10.4.0, 10.2.4, 10.0.7. No observed in-the-wild exploitation reported at time of publication (June 12). Splunk is widely deployed as SIEM in EU public-sector environments.
    ch_eu_nexus: "global; Splunk Enterprise is deployed as SIEM in Swiss federal and cantonal environments and across EU public-sector SOCs"
    public_sector_nexus: "direct — Splunk Enterprise is commonly deployed as the SIEM/log-aggregation platform in government security operations"
    sector: "public-sector, finance, technology, all sectors using Splunk SIEM"
    cves: [CVE-2026-20253]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Splunk Enterprise on AWS is vulnerable out of the box"
        attribution: "watchTowr Labs"
        source_url: "https://labs.watchtowr.com/why-use-app-level-auth-when-every-database-has-auth-splunk-enterprise-cve-2026-20253-pre-auth-rce/"
      - quote: "The vulnerability exists because the PostgreSQL sidecar service endpoint lacks authentication controls, allowing any network-reachable user to invoke file operations without credentials."
        attribution: "Splunk (SVD-2026-0603)"
        source_url: "https://advisory.splunk.com/advisories/SVD-2026-0603"
    extended_notes: |
      Detection: Monitor for unexpected POST requests to `/en-US/splunkd/__raw/v1/postgres/` in Splunk's own access logs. Look for unusual PostgreSQL backup/restore activity in Splunk operational logs. Harden: upgrade to patched version; if on-prem with sidecar disabled, verify it remains disabled post-upgrade. On AWS, prioritize patching immediately given the default-enabled exposure.

  - title: "Sygnia Operation Highland: Velvet Ant (China-nexus) backdoored PAM and OpenSSH on isolated critical-infrastructure network for nearly a decade"
    sources:
      - url: "https://www.sygnia.co/blog/operation-highland-velvet-ant/"
        publisher: "Sygnia"
        date: "2026-06-11"
        role: "primary"
      - url: "https://www.bleepingcomputer.com/news/security/chinese-hackers-hijack-auth-flow-spy-on-isolated-network-for-a-decade/"
        publisher: "BleepingComputer"
        date: "2026-06-12"
        role: "corroborating"
      - url: "https://thehackernews.com/2026/06/china-linked-hackers-backdoored-linux.html"
        publisher: "The Hacker News"
        date: "2026-06-12"
        role: "corroborating"
    discovery_trace: "first seen at: WebSearch ('Sygnia Velvet Ant PAM OpenSSH backdoor Operation Highland June 2026') → primary: Sygnia research blog https://www.sygnia.co/blog/operation-highland-velvet-ant/ → corroborating: BleepingComputer https://www.bleepingcomputer.com/news/security/chinese-hackers-hijack-auth-flow-spy-on-isolated-network-for-a-decade/"
    summary: |
      Sygnia's incident response team disclosed Operation Highland, a 10-year China-nexus cyberespionage intrusion beginning in 2016. The threat actor, tracked as Velvet Ant (attributed to China's state apparatus by Sygnia across multiple prior investigations), achieved initial access through internet-facing systems, then pivoted to an air-gapped internal network by compromising Nginx configurations to create HTTP-based FastCGI execution paths. The core persistence technique was replacing legitimate Linux PAM modules (`pam_unix.so`) with nine distinct trojanized variants that (a) accept a hardcoded attacker-controlled password to bypass authentication entirely and (b) harvest all credentials presented at login and store them locally for exfiltration. OpenSSH components (`ssh`, `sshd`, `scp`) were similarly replaced with trojanized versions that logged all commands, captured credentials during sessions, and wrote them to attacker-controlled local files. Because the authentication layer itself was compromised, all password-reset procedures were ineffective — responders found new victims logging in with changed passwords, only to have those new credentials immediately captured. The attack class is notable because network-isolation / air-gapping of the victim environment did not prevent deep compromise once the authentication layer was owned. Sygnia previously documented Velvet Ant compromising F5 BIG-IP appliances (2024) and exploiting Cisco NX-OS zero-days (CVE-2024-20399). MITRE ATT&CK relevant techniques: T1556.003 (Pluggable Authentication Modules), T1543.002 (Systemd Service — persistence via trojanized system binaries), T1078 (Valid Accounts — auth bypass via hardcoded password), T1552 (Unsecured Credentials — credential harvesting from authentication flows).
    ch_eu_nexus: "global; attack pattern (PAM/OpenSSH backdooring of air-gapped OT/critical infrastructure) directly relevant to Swiss and EU critical infrastructure defenders"
    public_sector_nexus: "indirect — technique targets air-gapped critical infrastructure commonly found in public-sector and critical-infrastructure environments"
    sector: "critical infrastructure, energy, government, telecom"
    cves: [CVE-2024-20399]
    actors_campaigns_malware: ["Velvet Ant"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "By extending control to the authentication process by modifying the PAM and OpenSSH components, the threat actor had access to credentials as they were used in the target environment and could bypass the authentication flow."
        attribution: "BleepingComputer (citing Sygnia)"
        source_url: "https://www.bleepingcomputer.com/news/security/chinese-hackers-hijack-auth-flow-spy-on-isolated-network-for-a-decade/"
      - quote: "nine separate versions that either 'let them in with a secret password' or 'quietly recorded real usernames and passwords as people logged in'"
        attribution: "The Hacker News (citing Sygnia)"
        source_url: "https://thehackernews.com/2026/06/china-linked-hackers-backdoored-linux.html"
    extended_notes: |
      Detection: Hunt for anomalous PAM module files — compare `pam_unix.so` and related modules against vendor-signed checksums (sha256deep or rpm -V / dpkg --verify). Monitor for unexpected `sshd` writes to filesystem locations outside /run/. Log forwarding from air-gapped systems is critical — without out-of-band integrity checking, these trojans are undetectable in normal operations. Consider deploying kernel-level file-integrity monitoring (e.g., eBPF-based FIM) on authentication-critical binaries. Prior Velvet Ant campaigns targeted F5 BIG-IP (2024) and Cisco NX-OS — defender pattern: broad network appliance and authentication infrastructure integrity checks. The 10-year undetected dwell time underlines that containment without root-cause analysis (specifically authentication-layer integrity) is ineffective.

  - title: "Sekoia TDR: APT28 (GRU Unit 26165) evolves to LLM-powered infostealer (LameHug) and cloud-service C2 (BeardShell) across seven documented eras"
    sources:
      - url: "https://blog.sekoia.io/apt28-an-evolution-of-tradecraft/"
        publisher: "Sekoia TDR"
        date: "2026-06-11"
        role: "primary"
    discovery_trace: "first seen at: feed https://blog.sekoia.io/feed/ → article https://blog.sekoia.io/apt28-an-evolution-of-tradecraft/ → fetched via WebFetch (primary, no pivot needed)"
    summary: |
      Sekoia's Threat Detection & Research team published a comprehensive tradecraft evolution analysis of APT28 (Fancy Bear, Forest Blizzard, GRU Unit 26165) covering seven operational eras from 2004 to 2026. The most operationally relevant 2025-2026 developments are: (1) **FrostArmada** (April 2026): APT28 DNS hijacking of MikroTik/TP-Link SOHO routers at scale — 18,000+ unique IPs across 120+ countries, ~200 organizations, ~5,000 consumer devices, using DHCP/DNS rewriting for adversary-in-the-middle against Microsoft 365 (T1557.002 AiTM via rogue AP). (2) **LameHug infostealer**: first documented APT28 malware that delegates logic to an LLM — base64-encoded prompts are sent to Alibaba's Qwen 2.5-Coder-32B-Instruct via the Hugging Face Inference API to generate exfiltration code on the fly; observed against Ukrainian executive government targets. (3) **BeardShell**: C++ backdoor using cloud storage provider rotation (Koofr, Icedrive, Filen) for C2 communication, making traditional domain/IP blocklisting ineffective. (4) Continued weaponization of Signal Desktop for initial access (Office lures delivered via Signal exploit lack of Mark-of-the-Web protection). (5) **Slimagent** C++ keylogger with X-Agent code lineage, deployed in Operation Phantom Net Voxel. Historical context: GooseEgg (CVE-2022-38028 Print Spooler PrivEsc) was deployed silently for ~5 years before public disclosure; similar extended blind-spot risk with current tools. Targeting in 2025-2026: Ukrainian government/military/energy, NATO foreign ministries, European defense suppliers, EU critical infrastructure and IT/hosting providers.
    ch_eu_nexus: "direct — NATO European member states are explicitly named targets; EU public-sector defenders, foreign ministries, defense suppliers, and critical infrastructure operators are the primary audience"
    public_sector_nexus: "direct — APT28 targeting pattern explicitly covers European government ministries, defense, and critical infrastructure"
    sector: "government, defense, energy, critical infrastructure, telecom"
    cves: [CVE-2022-38028, CVE-2023-23397]
    actors_campaigns_malware: ["APT28", "Forest Blizzard", "Fancy Bear", "FrostArmada", "LameHug", "BeardShell", "Slimagent", "HeadLace", "CredoMap", "MASEPIE", "OCEANMAP", "STEELHOOK", "GooseEgg", "Operation Phantom Net Voxel", "Operation RoundPress", "SpyPress"]
    verification: SINGLE-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "LameHug infostealer: First observed APT28 malware delegating logic to LLM — Base64-encoded prompts querying Alibaba's Qwen 2.5-Coder-32B-Instruct via Hugging Face Inference API"
        attribution: "Sekoia TDR"
        source_url: "https://blog.sekoia.io/apt28-an-evolution-of-tradecraft/"
      - quote: "FrostArmada campaign (April 2026): DNS hijacking on MikroTik/TP-Link routers — 18,000+ unique IPs across 120+ countries, ~200 organizations, ~5,000 consumer devices affected"
        attribution: "Sekoia TDR"
        source_url: "https://blog.sekoia.io/apt28-an-evolution-of-tradecraft/"
    extended_notes: |
      Detection priorities from this research: (1) Hunt for cloud-storage beaconing to Koofr/Icedrive/Filen from non-user workstations — these platforms have no enterprise monitoring integrations and are effectively C2 over legitimate HTTPS. (2) Signal Desktop as initial access vector: monitor child process spawning from Signal.exe (parent process spawning powershell.exe, mshta.exe, cmd.exe). (3) MikroTik/TP-Link DNS settings changes in network device logs — FrostArmada's persistence relies on router-level DNS rewriting. (4) For LameHug: outbound HTTP to api.huggingface.co or inference.huggingface.co from Windows hosts is anomalous. MITRE ATT&CK: T1071.001 (Web Protocols for cloud-provider C2), T1557 (Adversary-in-the-Middle via router hijacking), T1598.003 (Spearphishing via messaging apps — Signal). The 5-year GooseEgg deployment underscores that APT28 operates implants at multi-year time horizons before operational use.

  - title: "INTERPOL Operation Ramz dismantles SniperDz PhaaS: 201 arrests, 53 servers seized, administrator arrested in Algeria"
    sources:
      - url: "https://www.interpol.int/News-and-Events/News/2026/201-arrests-in-first-of-its-kind-cybercrime-operation-in-MENA-region"
        publisher: "INTERPOL"
