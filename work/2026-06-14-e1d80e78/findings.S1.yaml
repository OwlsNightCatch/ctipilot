  - title: "UPDATE: CVE-2026-10520 Ivanti Sentry MICS RCE — Backdoored Gateways Confirmed, CISA June 14 Patch Deadline"
    sources:
      - url: "https://securityaffairs.com/193530/hacking/cve-2026-10520-exploited-ivanti-sentry-gateways-compromised-shortly-after-patch-release.html"
        publisher: "Security Affairs"
