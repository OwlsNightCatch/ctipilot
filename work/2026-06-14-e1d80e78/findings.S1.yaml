        role: "primary"
      - url: "https://securityaffairs.com/193557/security/u-s-cisa-adds-ivanti-sentry-flaw-to-its-known-exploited-vulnerabilities-catalog-and-urges-patching-by-june-14.html"
        publisher: "Security Affairs"
        date: "2026-06-12"
        role: "corroborating"
      - url: "https://www.bleepingcomputer.com/news/security/cisa-gives-feds-3-days-to-patch-ivanti-flaw-exploited-in-attacks/"
        publisher: "BleepingComputer"
        date: "2026-06-12"
        role: "corroborating"
      - url: "https://cert.europa.eu/publications/security-advisories/2026-008/"
        publisher: "CERT-EU"
        date: "2026-06-12"
        role: "corroborating"
      - url: "https://www.helpnetsecurity.com/2026/06/10/ivanti-sentry-cve-2026-10520-cve-2026-10523/"
        publisher: "Help Net Security"
        date: "2026-06-10"
        role: "background"
    discovery_trace: "first seen at: cert-eu bridge (cert-eu recent), URL https://cert.europa.eu/publications/security-advisories/2026-008/ → pivot: Security Affairs exploitation article, URL https://securityaffairs.com/193530/hacking/cve-2026-10520-exploited-ivanti-sentry-gateways-compromised-shortly-after-patch-release.html → pivot: Security Affairs CISA KEV addition, URL https://securityaffairs.com/193557/security/u-s-cisa-adds-ivanti-sentry-flaw-to-its-known-exploited-vulnerabilities-catalog-and-urges-patching-by-june-14.html → primary: Ivanti advisory corroborated via CERT-EU 2026-008"
    summary: |
      CVE-2026-10520 (CVSS 10.0) is an OS command injection in Ivanti Sentry's Mobile Iron Core Services (MICS)
      layer, reachable via unauthenticated HTTP POST to `/mics/api/v2/sentry/mics-config/handleMessage`
      (ConfigServiceController). The vulnerability allows arbitrary command execution as root on the appliance
      without authentication. Ivanti patched on June 10 (versions R10.5.2, R10.6.2, R10.7.1). Within 40 hours
      of watchTowr publishing a proof-of-concept, Shadowserver Foundation confirmed active exploitation: at
      least two of 19 then-exposed internet-facing instances had been backdoored. CISA added CVE-2026-10520 to
      the KEV catalog on June 12 under BOD 26-04, issuing a three-day patch mandate to federal agencies
      (deadline June 14 — today). A root-level compromise of Sentry yields unrestricted access to every
      mailbox, calendar entry, and enterprise application the gateway brokers (Exchange ActiveSync, MobileIron,
      etc.). CERT-EU issued advisory 2026-008 urging immediate upgrade. Technique class: T1190 Exploit
      Public-Facing Application, T1505.003 Web Shell (post-exploitation). Affected: Sentry <= R10.5.1,
      <= R10.6.1, <= R10.7.0; patched: R10.5.2, R10.6.2, R10.7.1. Prerequisite: network access to
      MICS listener (TCP 443 or 8443 by default); no authentication required. Detection: web server access
      logs on `/mics/api/v2/sentry/mics-config/handleMessage` with anomalous POST bodies; EDR alerts on
      unexpected child processes spawned from the MICS Java process; Shadowserver exposure scanning.
      Hardening: patch immediately; restrict MICS listener to known management IP ranges via host firewall;
      audit for persistence artefacts (unexpected cron entries, SSH authorized_keys changes).
    ch_eu_nexus: "direct — Ivanti Sentry is widely deployed by Swiss cantonal and federal agencies, and EU public sector as MDM gateway; CISA June 14 federal deadline; CERT-EU 2026-008"
    public_sector_nexus: "direct"
    sector: "government, healthcare, education, enterprise"
    cves: [CVE-2026-10520]
