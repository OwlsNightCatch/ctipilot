items:
  - title: "UPDATE: Ivanti Sentry CVE-2026-10520 — CISA adds to KEV with 3-day deadline (today), Shadowserver confirms backdoored instances"
    sources:
      - url: "https://www.bleepingcomputer.com/news/security/cisa-gives-feds-3-days-to-patch-ivanti-flaw-exploited-in-attacks/"
        publisher: "BleepingComputer"
        date: "2026-06-12"
        role: "primary"
      - url: "https://cert.europa.eu/publications/security-advisories/2026-008/"
        publisher: "CERT-EU"
        date: "2026-06-10"
        role: "corroborating"
      - url: "https://security-hub.ncsc.admin.ch/#/posts/12624"
        publisher: "NCSC-CH Security Hub"
        date: "2026-06-10"
        role: "corroborating"
    discovery_trace: >
      first seen at: bridge:ncsc-csh.recent, URL https://security-hub.ncsc.admin.ch/#/posts/12624
      → pivot: bridge:cisa-kev, URL https://www.cisa.gov/known-exploited-vulnerabilities-catalog (dateAdded 2026-06-11, dueDate 2026-06-14)
      → pivot: WebSearch ("Ivanti Sentry CVE-2026-10520 CISA KEV June 11 exploitation Shadowserver backdoored instances")
      → primary: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/cisa-gives-feds-3-days-to-patch-ivanti-flaw-exploited-in-attacks/
    summary: |
      CISA added CVE-2026-10520 — the CVSS 10.0 OS command injection in Ivanti Sentry (formerly MobileIron Sentry) — to its Known Exploited Vulnerabilities catalog on 11 June, invoking BOD 26-04's new 3-day remediation class for the highest-risk exposures and mandating patching by 14 June (today). The flaw is in the MICS `handleMessage` gateway interface; an unauthenticated remote attacker sends a crafted request to execute arbitrary OS commands as root. watchTowr published a full PoC and technical analysis on 10 June; within 48 hours the Shadowserver Foundation observed mass exploitation attempts and confirmed at least two publicly reachable Sentry appliances had been actively backdoored. NCSC-NL advisory NCSC-2026-0180 (updated 11 June) notes that exploitation requires the Sentry management port to be internet-exposed — not the default — but many enterprise deployments are in unmanaged state. CERT-EU advisory 2026-008 (10 June) urges immediate deployment. Patched versions: Sentry R10.5.2 (10.5.x branch), R10.6.2 (10.6.x), R10.7.1 (10.7.x). Detection: network telemetry for POST requests to the MICS interface not originating from an EPMM or Neurons-for-MDM management plane; EDR process-tree showing commands spawned from the Sentry service account; web-server access logs for anomalous `handleMessage` requests. Hardening: restrict MICS management port to management network only; enforce mTLS with EPMM; apply Ivanti advisory firewall rules.
    ch_eu_nexus: "Global; Ivanti Sentry is common in European enterprise EMM/MDM deployments including public-sector email-security gateways. CERT-EU and NCSC-CH both issued advisories."
    public_sector_nexus: "direct — Ivanti Sentry commonly deployed as the email and application enforcement gateway in government MDM estates"
    sector: "government, finance, healthcare, critical infrastructure"
    cves: [CVE-2026-10520, CVE-2026-10523]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "update-to-prior:2026-06-10"
    evidence:
      - quote: "The U.S. Cybersecurity and Infrastructure Security Agency (CISA) ordered government agencies to patch an actively exploited Ivanti Sentry flaw within three days, as mandated by the newly issued Binding Operational Directive (BOD) 26-04."
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/cisa-gives-feds-3-days-to-patch-ivanti-flaw-exploited-in-attacks/"
      - quote: "The Shadowserver Foundation reported it was observing a large amount of CVE-2026-10520 exploitation attempts based on the public proof-of-concept, with at least two vulnerable instances backdoored."
        attribution: "BleepingComputer (citing Shadowserver)"
        source_url: "https://www.bleepingcomputer.com/news/security/cisa-gives-feds-3-days-to-patch-ivanti-flaw-exploited-in-attacks/"
    extended_notes: |
      BOD 26-04 (Prioritizing Security Updates Based on Risk) introduced a risk-tiered remediation schedule; the 3-day class is invoked for the most severe actively-exploited exposures. This is the first invocation of the 3-day tier against a non-OS vulnerability in 2026. CISA KEV entry notes: exploitation may be blocked by mTLS with EPMM or restricted HTTPS through Neurons for MDM. The NCSC-NL CSAF advisory NCSC-2026-0180 was revised on 11 June to update exploitation status.

  - title: "Cyber Europe 2026: EU activates its revised Cyber Blueprint and tests the Cybersecurity Reserve for the first time"
    sources:
      - url: "https://www.enisa.europa.eu/news/cyber-europe-2026-all-eyes-on-the-eus-collective-response-and-resilience"
        publisher: "ENISA"
        date: "2026-06-11"
        role: "primary"
      - url: "https://brusselsmorning.com/eu-cyber-exercise-2026/99116/"
        publisher: "Brussels Morning"
        date: "2026-06-11"
        role: "corroborating"
    discovery_trace: >
      first seen at: WebSearch ("EU cybersecurity Switzerland cyber incident June 13 14 2026")
      → WebSearch ("Cyber Europe 2026 ENISA rail maritime exercise June 10-11 results")
      → primary: ENISA, URL https://www.enisa.europa.eu/news/cyber-europe-2026-all-eyes-on-the-eus-collective-response-and-resilience
    summary: |
      The eighth edition of Cyber Europe took place on 10–11 June, becoming the first EU-wide test of the revised EU Cyber Blueprint (adopted June 2025) and the first live invocation of the EU Cybersecurity Reserve under the Cyber Solidarity Act (Article 14). Over 5,000 participants from national cybersecurity agencies, EU institutions, private sector, and partner countries (including Switzerland, the UK, Norway, and Ukraine) simulated a multi-stage attack on interconnected European rail and maritime transport networks, escalating to a declared cyber crisis requiring coordinated EU response. The scenario tested cross-border incident information-sharing procedures between national CSIRTs, activation of ENISA's Standard Operating Procedure for Reserve deployment, and crisis escalation to political level. The Cybersecurity Reserve — a €36 million pool of incident-response services from pre-vetted managed-security-service providers — was notionally activated to test its SOP. No actual real-world incident occurred; findings and after-action assessment will be published by ENISA in a post-exercise report. Defender relevance: Swiss federal defenders (BACS/NCSC) participated as a partner country; the exercise scenario (ransomware disrupting cross-border rail operational technology + disinformation layer) closely mirrors the threat environment documented in ENISA's NIS360 2026 and NCSC-CH's mandatory-reporting statistics.
    ch_eu_nexus: "Direct — Switzerland participated as a partner country. Exercise scenario maps to CH/EU transport OT threat environment. Exercise tests EU crisis mechanisms that CH aligns to under bilateral agreements."
    public_sector_nexus: "direct — ENISA, national CSIRTs including BACS/NCSC-CH, EU institutions"
    sector: "government, transport, OT/ICS"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "new"
    evidence:
      - quote: "Cyber Europe 2026 this week – 10/11 June – was also the first EU-wide test of the 2025 EU cyber blueprint which clarifies roles and responsibilities in a crisis. Additionally, for the first time, the EU Cybersecurity Reserve, provided for in the EU Cyber Solidarity Regulation and operated by ENISA, was tested."
        attribution: "ENISA"
        source_url: "https://www.enisa.europa.eu/news/cyber-europe-2026-all-eyes-on-the-eus-collective-response-and-resilience"
    extended_notes: |
      The 2025 EU Cyber Blueprint updates the 2017 Blueprint and aligns with the Cyber Solidarity Act crisis framework. The Reserve's SOP activation procedure — requiring a formal request from a Member State CSIRT, a severity threshold assessment, and ENISA activation within hours — was tested for the first time in a realistic crisis scenario. For defenders: understanding this activation pathway matters when considering when/how to invoke EU-level support in a major incident.

  - title: "ServiceNow unauthenticated REST endpoint queried customer instance tables — actively exploited, patch applied silently 4 days before disclosure"
    sources:
      - url: "https://www.bleepingcomputer.com/news/security/servicenow-discloses-security-incident-exposing-customer-data/"
        publisher: "BleepingComputer"
        date: "2026-06-09"
        role: "primary"
      - url: "https://security-hub.ncsc.admin.ch/#/posts/12621"
        publisher: "NCSC-CH Security Hub"
        date: "2026-06-10"
        role: "corroborating"
    discovery_trace: >
      first seen at: bridge:ncsc-csh.recent, URL https://security-hub.ncsc.admin.ch/#/posts/12621
      → WebSearch ("ServiceNow data breach API unauthenticated June 2026 exploitation")
      → primary: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/servicenow-discloses-security-incident-exposing-customer-data/
    summary: |
      ServiceNow disclosed on 9 June that a Scripted REST Resource at `/api/now/related_list_edit/create` was configured with `requires_authentication=false`, disabling the identity check that normally gates every REST API request. The endpoint accepted unauthenticated queries and returned data from customer instance tables — which commonly contain IT support tickets, employee records, credentials embedded in ticket descriptions, API tokens, asset inventories, and configuration data. Suspicious activity was detected on June 2–3 (approximately five API requests per tenant from a single external IP). ServiceNow silently patched the endpoint on 5 June, four days before disclosure on 9 June. The advisory was placed behind a customer-portal login for an additional period. Primarily affects customers running the "Australia" platform release, or those on older releases who made specific configuration changes. NCSC-CH Security Hub advisory (ID 12621) advised temporary log review for `/api/now/related_list_edit` requests, credential/token rotation for anything stored in ticket workflows, and verification that API audit logging is enabled. Detection: query ServiceNow instance audit logs for unauthenticated requests to the affected endpoint; cross-correlate with ServiceNow System Logs → Transactions log for `requires_authentication=false` scripted REST resources; EDR telemetry is not applicable (SaaS incident).
    ch_eu_nexus: "Global; ServiceNow is deployed across Swiss federal administration and EU public sector entities as the primary ITSM/GRC platform. Exposed data commonly includes IT incident reports, PAM workflow tokens, and HR records."
    public_sector_nexus: "direct — ServiceNow is a primary ITSM platform for public sector organisations in Switzerland, Germany, France, and Netherlands"
    sector: "government, finance, healthcare, critical infrastructure"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "new"
    evidence:
      - quote: "A REST endpoint (reportedly `/api/now/related_list_edit/create`) was configured with `requires_authentication=false`, allowing unauthenticated requests to access instance data and query customer tables."
        attribution: "NCSC-CH Security Hub"
        source_url: "https://security-hub.ncsc.admin.ch/#/posts/12621"
      - quote: "ServiceNow is warning about a security incident after attackers exploited an unauthenticated access flaw through a vulnerable API endpoint, allowing them to query data from customer instances."
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/servicenow-discloses-security-incident-exposing-customer-data/"
    extended_notes: |
      The advisory noted that customers on the Australia platform release or earlier releases with certain configuration changes were affected. A community analysis found ~5 API requests per tenant before exploitation was halted. The 4-day gap between patch and disclosure is operationally significant: customers could not detect or respond during that window. Recommended immediate post-incident action: review ServiceNow change history for any API endpoint with `requires_authentication=false` in the Scripted REST Resources table (`sys_ws_operation`); this is a persistent configuration risk independent of the specific June 2026 endpoint.

