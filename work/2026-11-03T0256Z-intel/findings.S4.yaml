    extended_notes: |
      Detection concepts: NAS file-system telemetry showing mass renames to a new extension and a ransom-note file created in every share directory; DSM web and SCGI access logs for unauthenticated requests to the login logic from unfamiliar sources before encryption; outbound connections from the NAS afterwards. Exposure check: read the installed DSM build against the SA-26:13 and SA-24:20 fixed builds, and check whether the DSM management interface or file services are reachable from the internet. Post-patch caveat: patching does not decrypt files already encrypted (Gridinsoft); Synology's checklist is to isolate first, preserve the note, samples, DSM version, package list and logs, and treat same-NAS snapshots as not independent. Hardening per 360: do not map the NAS management port to the internet (use the vendor relay or a VPN), disable the default admin account, strong passwords, two-step verification and automatic IP block.
