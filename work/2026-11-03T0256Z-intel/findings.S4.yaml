    summary: |
      Synology said on 2026-10-29 that it has identified threat actors exploiting a vulnerability patched in December 2024 to target devices on outdated DiskStation Manager (DSM) versions in attacks that encrypt data and extort ransom; the release names no CVE and points to Synology-SA-24:20 (published 2024-11-05: CVE-2024-10441, an unauthenticated CVSS 9.8 code-execution flaw in the system plugin daemon, plus CVE-2024-50629 and CVE-2024-10445; fixed in DSM 7.2.2-72806-1, 7.2.1-69057-6, 7.2-64570-4, 7.1.1-42962-7 and 6.2.4-25556-8). The same day the Chinese vendor 360, whose anti-ransomware service received repeated requests for help in October, published a sample analysis that identifies the ransomware as C3RB3R, a variant of the old Cerber family, and says the initial access was CVE-2026-13639 and CVE-2026-13684, the two unauthenticated CVSS 9.8 DSM flaws of Synology-SA-26:13 (2026-09-18; fixed in DSM 7.4-90075, 7.3.2-86009-4, 7.2.2-72806-9 and 7.2.1-69057-12). The two accounts conflict (Synology: a flaw patched in 2024; 360: flaws disclosed in September 2026); no source reconciles them, and Gridinsoft notes the mismatch is not proof of a new zero-day or of an attack on fully updated DSM. Per 360 the ransomware scans directories recursively, skips 27 system directories and executable and script files, encrypts each file with its own ChaCha8 key and appends RSA-2048-protected key material, renames files to .L0CK3D and leaves read-me3.txt in every encrypted directory pointing to a Tor payment page for a decryptor; large files get selective encryption.
      BleepingComputer (2026-11-02) reports a wave of Synology customers whose data was encrypted, first reports from more than two weeks earlier, and Shadowserver tracking over 380,000 internet-exposed Synology NAS devices; it also notes Synology rarely issues advisories about attacks on its customers. The delta against the store entry, which says no exploitation was confirmed: exploitation for ransomware is now vendor-confirmed for DSM, with the exploited CVE contested between SA-24:20 and SA-26:13, and a NAS that is current on both advisories is not in scope on either account.
