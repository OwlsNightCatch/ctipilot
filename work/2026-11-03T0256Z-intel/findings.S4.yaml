    summary: |
      Overnight into Monday 2026-11-02, supermarkets and shops in Belgium, Luxembourg, the Netherlands, Sweden, Ireland, Estonia and (per The Guardian) Finland reported refrigerators and freezers whose settings had been changed remotely, the same effect as the 11 to 12 October attacks on Danfoss AK-SM/AK-SC and Copeland/Dixell xweb controllers in France. BleepingComputer counts more than 115 affected stores from company statements (Ahold Delhaize about 40 in Belgium and Luxembourg, Carrefour Belgium 15, Intermarche Belgium about 15, Spar/Colruyt 5, SuperValu Ireland 13 of 223, Coop Sweden 7, ICA at least 4, one Selver store in Estonia, at least 17 small Dutch shops, an Ikea store in Mons). Sabcobel, the refrigeration installer behind several Belgian sites, says technicians began disconnecting installations at 01:00 and that the attackers remotely switched the evaporators to defrost mode; the first attacks began around midnight and store alarms fired from about 03:00 (RTL Info). Le Soir and RTL report the mechanism is identical to France; BleepingComputer paraphrases Sabcobel's chief executive as saying the attacker used the same vulnerability, whereas RTL quotes only the same operating method. Setpoints were reportedly raised to +50 C at Swedish ICA shops, while Belgian shops report about 15 C inside freezers and forced defrost air at about 40 C, and CyberInsider cautions that a +50 C setting does not prove every cabinet reached it.
      What is not known: CyberInsider states that the manufacturer, controller models and initial access method of the new wave remain unknown; no ransom demand or data theft has been reported and nobody has claimed the attacks. Danfoss told the press (via NZZ/dpa) that at least 17 Dutch shops were affected, which suggests Danfoss units are again involved, but no source says so for Belgium or Sweden. SentinelOne's Tom Hegel is quoted by The Guardian reading the absence of financial demands as pointing to sabotage; that is his assessment, not an attribution. The Belgian prosecutor has opened an investigation, the head of Sweden's NCSC said it is working on incidents around the country, and the EU agriculture commissioner called it a deliberate attempt to disrupt the food supply chain.
      Swiss nexus: Coop Switzerland told 20 Minuten it registered corresponding attack attempts that were not successful, and declined to name its refrigeration equipment; Migros reports no indications of an attack on refrigeration in its Swiss shops. As of 2026-11-02 the NCSC.ch Security Hub carries no new refrigeration post after its Danfoss advisory of 2026-10-13. Delta against the store entry (last updated 2026-11-02 on the Pentagon commissary reporting): the campaign is no longer France-only, it has recurred three weeks later across at least six more countries, and the controller vendor of the new wave is unconfirmed.
    region_nexus: "Switzerland: Coop Switzerland registered unsuccessful attack attempts (20 Minuten, 2026-11-02); NCSC.ch already rates the Danfoss activity exploited. Europe-wide: BE, LU, NL, SE, IE, EE, FI."
    primary_sector_nexus: "indirect: food retail is the victim set, but the exposed remotely managed refrigeration-controller class also sits in hospital kitchens, canteens and cold stores of public bodies (class-level assessment; no source names a public-sector victim in this wave)"
