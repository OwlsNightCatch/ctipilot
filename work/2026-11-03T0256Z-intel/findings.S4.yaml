      Northflank, a cloud application hosting platform, disclosed a security incident on 2026-10-30 after a Wiz threat alert at 11:43 UTC, and told customers to assume all environment variables had been decrypted and to rotate everything; users then reported unauthorised use of AI API keys stored on the platform. Its status page as of 2026-11-02 says the attack vector was contained within an hour of the first alert, independent forensic auditors began reviewing it over the weekend, running workloads were unaffected with no sign that workload data was accessed, evidence suggests the attack focused on secrets held in its control plane, and customers on forward-deployed or dedicated control planes are unaffected; it recommends rotating AI provider keys, cloud credentials, payment keys, private keys and database credentials first, has revoked access tokens, VCS integrations and cross-account IAM roles where it could, and promises a root-cause analysis. How the attacker got in, how many customers are affected and whether other secrets were abused remain undisclosed; Wiz says similar IP addresses appear in its 'Black October' report on at least nine incidents at AI developer platforms (Railway, OpenCode, Warp, Lightning AI and others) in which attackers hunted stored environment variables for AI credentials, and has traced abuse of enterprise Bedrock keys to one of these vendor breaches, but has not confirmed one actor.
