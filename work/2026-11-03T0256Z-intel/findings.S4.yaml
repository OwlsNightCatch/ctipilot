    extended_notes: |
      Detection and triage concepts the sources support (no IOCs): (1) controller-side configuration audit, not just version checks: defrost schedules, defrost durations and temperature setpoints changed outside a maintenance window, and bursts of high-temperature alarms across many cabinets of one site within minutes of each other in the small hours (Belgian alarms from about 03:00, attack start around midnight per RTL). (2) management-interface access logs and the contractor's remote-access gateway: any session from a source that is not the installer's, and any controller reachable from the internet at all; Sabcobel says most of its customers moved to managing refrigerators over a secure internet connection after France, and BleepingComputer quotes it that a software update alone is not enough because the refrigerators also need physical modifications. (3) Triage discriminator: a legitimate defrost cycle is scheduled, short and staggered per evaporator group; the attack presents as all evaporators in defrost at once, with setpoints that operators cannot restore (ICA Sjoebo staff could not change the +50 C setting back, per CyberInsider/TV4). Belgian operators disconnected installations from the network to stop it.
      Open question for follow-up fires: whether CERT-FR, Belgium's CCB, NCSC-NL, NCSC-SE or NCSC.ch name the controller family and access method of the second wave; the store entry should be revised the day an authority does. The Guardian also reports SuperValu's affected refrigeration is limited to a specific model in 13 of 223 shops (Irish chain statement), and that Kitman Coldtech says Estonian attackers accessed a computer controlling the refrigeration system; both are company statements, neither names a manufacturer.
