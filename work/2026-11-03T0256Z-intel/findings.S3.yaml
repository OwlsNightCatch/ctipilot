  # ------------------------------------------------------------------ 1 (update-of)
  - title: "CVE-2026-58115, Node-RED in Siemens SIMATIC IoT2050 Advanced: VulnCheck's canary records the first in-the-wild exploitation, a one-request flow that runs a shell dropper"
    sources:
      - { url: "https://www.vulncheck.com/blog/exploitation-targeting-node-red", publisher: "VulnCheck", date: "2026-11-02", role: "primary" }
      - { url: "https://www.theregister.com/security/2026/11/02/max-severity-bug-in-widely-used-ot-programming-tool-exploited-to-deliver-linux-malware/5307086", publisher: "The Register", date: "2026-11-02", role: "corroborating" }
    discovery_trace: "first seen at: theregister-security-feed, URL https://www.theregister.com/security/headlines.atom (listing fetched via bridge feed) → pivot: The Register article, URL https://www.theregister.com/security/2026/11/02/max-severity-bug-in-widely-used-ot-programming-tool-exploited-to-deliver-linux-malware/5307086 (WebFetch; extract returned only site chrome) → primary: VulnCheck blog, URL https://www.vulncheck.com/blog/exploitation-targeting-node-red (extract, full body). Store check: CVE-2026-58115 is in cves.ids and entry 2026-08-13/cve-2026-58115-simatic-iot2050-node-red-unauth-root says 'No exploitation is reported'; CISA KEV catalog read via bridge cisa-kev (release 2026-10-30T17:02Z) does not list it."
    summary: |
      The covered entry for CVE-2026-58115 (Siemens ProductCERT, unauthenticated Node-RED HTTP interface on SIMATIC IoT2050 Advanced, CVSS 10.0) states that no exploitation is reported; that is now stale. VulnCheck reports from its own canary telemetry that on 2026-10-30 an attacker sent one complete exploit, a single POST to the Node-RED /flows endpoint deploying a flow in which an inject node (fires once after a one-second delay) is wired to an exec node that runs a base64-wrapped shell pipeline (three encoding layers). The decoded dropper fetches a Linux AMD64 bot with wget and a curl fallback, stores it as a hidden file in the RAM-backed /dev/shm and starts it detached with setsid or nohup. Between 2026-10-30 and 2026-11-01 the same source address produced 16 events against this CVE with several payloads, among them a staged shell script, a second binary written under /tmp, and flows that expose an http-in endpoint wired through a function node to an exec node, a persistent web-shell-style backdoor that survives loss of the memory-resident implant. VulnCheck did not retrieve the binary or the staged scripts, so the implant's function is unknown; it attributes the traffic to indiscriminate scanning (the source logged 125 hits across eight CVEs), not a focused campaign. VulnCheck added the CVE to its own KEV list; CISA's KEV did not list it when this run read the catalog (release 2026-10-30). The Register relays VulnCheck's finding and is not independent. Affected-version detail (Siemens: all versions below V4.3.4.1) comes from the covered entry's Siemens source and was not re-read this run; VulnCheck also notes Emerson documents its use of Node-RED but says it has not validated whether Emerson products are affected.
    region_nexus: "global; embedded Node-RED in OT edge gateways deployed in building automation, water and energy; no Swiss victim reported"
    primary_sector_nexus: "indirect (communal and cantonal infrastructure operators running IoT2050 or other Node-RED based edge gateways)"
    sector: "ot-ics"
    cves: [CVE-2026-58115]
    techniques: [T1190, T1059.004, T1105, T1505.003, T1027]
    affected_products: ["Siemens SIMATIC IoT2050 Advanced", "Node-RED"]
    entity_keys: ["product:siemens-simatic-iot2050-advanced"]
    new_entities:
      - { key: "product:node-red", type: product, name: "Node-RED", aliases: [], summary: "Flow-based low-code automation runtime embedded in industrial gateways such as Siemens SIMATIC IoT2050 Advanced; unauthenticated admin API instances (no adminAuth) are exploited in the wild per VulnCheck (2026-11-02)." }
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    classification: { reliability: B, credibility: 2 }
    novelty: "update-of:2026-08-13/cve-2026-58115-simatic-iot2050-node-red-unauth-root"
    evidence:
      - quote: "On October 30, 2026, one of our canaries caught an attacker exploiting CVE-2026-58115, an unauthenticated Node-RED admin API flaw, to deploy a flow that downloads and runs a Linux bot."
        attribution: "VulnCheck"
        source_url: "https://www.vulncheck.com/blog/exploitation-targeting-node-red"
      - quote: "Wire one to the other and the flow executes a command as soon as it is deployed, with no further interaction."
        attribution: "VulnCheck"
        source_url: "https://www.vulncheck.com/blog/exploitation-targeting-node-red"
      - quote: "it is not in CISA's KEV at the time of writing"
        attribution: "VulnCheck"
        source_url: "https://www.vulncheck.com/blog/exploitation-targeting-node-red"
    extended_notes: |
      Exposure (VulnCheck): Node-RED instances without adminAuth that are reachable over HTTP are found and exploited automatically; a deployment takes one HTTP request. Check from outside the network whether any Node-RED admin interface (including ones embedded in ICS/OT products) is reachable.
      Detection concept (web or reverse-proxy access logs, Node-RED flow store): POST /flows from non-engineering sources, especially bodies that deploy an exec node carrying base64 piped to sh (VulnCheck notes that matching wget or curl strings misses the encoded form); also review deployed flows for exec nodes or http-in endpoints nobody built. Host-side: hidden dot-files launched from /dev/shm and detached processes (setsid or nohup) spawned by the node-red process. Post-patch compromise check: patching does not remove deployed flows, so inspect flows for planted http-in/exec chains.
      Triage (analyst inference from the mechanism, not stated by VulnCheck): legitimate Node-RED engineering deployments also POST /flows, but from engineering workstations and without exec nodes carrying encoded shell; the discriminators are source address, exec-node content and a download-and-execute sequence in the child process tree.
      Hardening lever: VulnCheck names missing adminAuth as the exposed condition but gives no configuration steps; Siemens' interim mitigations (uninstall or harden Node-RED) are in the covered entry. Keeping the admin interface off routable networks is an inference from the mechanism.
      Gap: VulnCheck is the sole telemetry source; the payload was never retrieved; the 'attacker' address sits in a hyperscaler ASN and VulnCheck calls the activity scanning rather than a campaign.

