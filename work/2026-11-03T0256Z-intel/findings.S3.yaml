  - title: "MadApe: Group-IB documents a previously undocumented Microsoft device-code phishing kit with localized PDF lures, German among them, across 155 root domains"
    sources:
      - { url: "https://www.group-ib.com/blog/madape-microsoft-device-code-phishing-kit/", publisher: "Group-IB Threat Intelligence", date: "2026-10-29", role: "primary" }
    discovery_trace: "first seen at: group-ib, URL https://www.group-ib.com/blog/rss.xml (bridge feed, lookback 168 h) → primary (no pivot needed): Group-IB post read in full with extract on https://www.group-ib.com/blog/madape-microsoft-device-code-phishing-kit/. Store check: no entry or registry key for MadApe; earlier device-code entries are Tycoon2FA, Kali365 and Railway."
    lookback: true
    summary: |
      Group-IB describes a multi-stage phishing campaign that abuses Microsoft device-code authentication to reach Microsoft 365 accounts without collecting a password on any phishing page, and assesses the kit it tracks as MadApe to be previously undocumented. The chain: an email with a business-themed PDF (payment notices, invoices, contracts) carries a link to a configurable SharePoint-themed or human-verification intermediary page, which redirects to a page that shows a device code supplied by the backend, copies it to the clipboard on click, reports the interaction to the backend and sends the victim to the legitimate Microsoft device-login portal, where authentication completes on Microsoft's own domain and, Group-IB notes, can satisfy MFA; the kit's server side polls Microsoft's token endpoint for the resulting tokens. Group-IB reports lures localised in nine languages, among them German, French, Polish and Finnish (Hebrew first observed), with German PDF names such as payment report and payment advice, pages impersonating SharePoint, OneDrive, Teams, Adobe Acrobat and DocuSign, 155 root domains with device-code components on 97, anti-inspection scripts, and an operator panel that names itself on its login page. Group-IB treats organisation names in lures and subdomains as intended targets, not confirmed compromises, and publishes no victim sector. Its recommendations are the useful part: inventory legitimate device-code use through Entra sign-in logs (authentication protocol filter, original-transfer-method field), block the device-code flow with a Conditional Access policy (authentication-flows condition) after report-only testing, enable continuous access evaluation, and after a suspected compromise revoke sessions and refresh tokens, check device registrations, inbox rules, MailItemsAccessed and OAuth consent grants.
    region_nexus: "global; German-language lures observed (DACH relevant), Hebrew-language emails first, no victimology published"
    primary_sector_nexus: "indirect (any Microsoft 365 tenant in federal, cantonal or communal administration)"
