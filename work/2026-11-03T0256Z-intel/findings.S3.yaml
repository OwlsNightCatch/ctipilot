    extended_notes: |
      Detection by telemetry class (Group-IB's SOC and hunting guidance): Entra sign-in logs filtered on the device-code authentication protocol outside documented use, unfamiliar application ids, hosting-provider or anonymised source addresses, and the original-transfer-method field for later sessions; correlate with email click telemetry from PDF attachments, then with new device registrations, inbox rules, MailItemsAccessed, OAuth consent grants and bulk SharePoint or OneDrive downloads. Web telemetry: requests to the kit's code-entered and code-status API paths where full URLs are visible. Triage (analyst inference, not stated by Group-IB beyond 'inventory legitimate use'): legitimate device-code sign-ins come from input-constrained devices (consoles, conference-room systems, CLI tools) on known accounts and applications; phishing-driven ones come from a user's normal account with an unexpected application shortly after an email click. Hardening: Conditional Access block of the device-code flow with scoped exceptions, as the post itself recommends.

