    lookback: true
    summary: |
      HMICFRS published on 2026-10-27 the report of a three-phase inspection (January to May 2026) of cybersecurity in police forces and fire and rescue services, based on visits to three police forces and three fire and rescue services, interviews, reality testing and review of more than 260 documents. Findings stated by the inspectorate: assessments under the Cyber Assessment Framework (fire) and a modified Security Assessment for Policing show gradual improvement but recurring weaknesses; all inspected organisations relied on legacy systems, which leaders named their highest strategic cybersecurity risk; all six depended on third-party suppliers without comprehensive processes to assure supplier cybersecurity (little visibility of supplier patching, non-transparent backup and restoration, reliance on supplier self-certification such as Cyber Essentials or ISO 27001 without checking recency); preparedness and resilience arrangements were often underdeveloped; some fire and rescue services could not maintain full operational capability if a third-party supplier suffered a significant outage, with a tested manual mobilisation process as backup that does not remove the underlying risk; and national assurance does not cover the whole police ICT estate. The report makes 13 recommendations, including baseline standards, independent third-party assessment of capabilities, procurement and contract management of ICT suppliers with certification requirements from May 2027 for new or renewed fire-service contracts, national monitoring capability for fire and rescue, and incident-response and restore exercises. It is a governance-level inspection with no incident details, techniques or indicators.
