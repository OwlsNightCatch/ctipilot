    extended_notes: |
      Defender angle for the covered entry's Exposure/Detection lines: the second wave hit stores 'operating outside the central network' (ICA) and independently run installations (Colruyt/Spar, butcher shops), which is the profile of small municipal and institutional cold storage run by an installer rather than by central IT. Installer-managed remote access (the contractor's own VPN or portal) is the question to put to the contractor, as the covered entry already advises for France.
      Open points to track: confirmation of the controller family and entry vector from CCB/CERT-FR/NCSC, any BSI or NCSC-CH statement, and whether setpoint 50 °C (France, Sweden) versus other values indicates different tooling.

  # ------------------------------------------------------------------ 3 (new)
  - title: "CyberStrikeAI: Kaspersky documents an LLM-orchestrated C2 framework driving full Active Directory compromise at education organisations, entered through a compromised SQL Server"
    sources:
      - { url: "https://securelist.com/cyberstrikeai-attacks/121715/", publisher: "Kaspersky Securelist (GReAT / Cyber Threat Intelligence)", date: "2026-11-02", role: "primary" }
    discovery_trace: "first seen at: kaspersky-securelist, URL https://securelist.com/feed/ (feed fetched via bridge; item link https://securelist.com/tr/cyberstrikeai-attacks/121715/) → primary (no pivot needed): Securelist article read in full with extract on https://securelist.com/cyberstrikeai-attacks/121715/. Store check: no entry or registry key mentions CyberStrikeAI; ARTEX (tool:artex) and NIK C2 are separate frameworks."
    summary: |
      Kaspersky's CTI team reports a campaign in which CyberStrikeAI, an open-source Go framework, ran the post-exploitation phase against education-sector organisations in several African and Latin American countries (Kaspersky: confirmed victims). The framework keeps the LLM on the operator's server: the model plans, selects tools through MCP and generates commands, while the implant is an ordinary C2 agent with no AI code, no API keys and no calls to AI services, so nothing on the victim host looks different from a human-driven session. In the reconstructed incident a human operator first entered through a compromised SQL Server (16.0.1000), with the first commands originating from the sqlservr.exe process, spent about a day on host and network discovery and tooling, then paused two weeks; the agent phase then established persistence within two minutes, mapped the domain over five hours, and after a further pause of several days moved laterally over SMB and WMI, dumped credentials and exported databases within about one hour. Observed behaviour is classic: base64-wrapped PowerShell, scripts reassembled from split files and decoded with certutil, persistence by a scheduled task named SystemUpdate (registry Run key, crontab @reboot or .bashrc alternatives on Linux), remote scheduled tasks run as SYSTEM, WMI and Impacket WMIExec, LDAP queries for Kerberoasting and AS-REP roasting, LAPS and Azure checks, registry hive dumps, LSASS dumps through comsvcs.dll MiniDump by PID, DCSync and Golden Ticket with a renamed mimikatz, LLM-generated SQL and LDAP queries, screenshots; Kaspersky puts agent deployment to domain-admin compromise at 3 to 4 days. Kaspersky links the samples into two build groups by Go VCS metadata, cannot tie either to a known actor or to each other, and says only that Chinese-language script comments, Chinese services and UTC+8 business-hours restarts of the control servers suggest a Chinese-speaking operator. Its own assessment is that AI orchestration changes speed and operator skill requirements, not the techniques, and that well-tuned classic correlation rules suffice to detect it.
    region_nexus: "global; confirmed victims in Africa and Latin America; no European or Swiss victim reported"
    primary_sector_nexus: "indirect (education organisations with AD domains and exposed SQL Server, comparable to cantonal schools and universities)"
    sector: "education"
    cves: []
    techniques: [T1190, T1059.001, T1053.005, T1140, T1021.002, T1047, T1087.002, T1558.003, T1558.004, T1003.002, T1003.001, T1003.006, T1558.001, T1113, T1041, T1071.001, T1547.001, T1053.003, T1546.004]
    affected_products: ["Microsoft SQL Server", "Microsoft Active Directory"]
    entity_keys: []
    new_entities:
      - { key: "tool:cyberstrikeai", type: tool, name: "CyberStrikeAI", aliases: [], summary: "Open-source Go penetration-testing and C2 framework in which a server-side LLM orchestrator plans actions, calls tools over MCP and tasks a conventional implant; Kaspersky (2026-11-02) documents its use in post-exploitation against education organisations in Africa and Latin America." }
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    classification: { reliability: B, credibility: 2 }
    novelty: new
    evidence:
      - quote: "Confirmed victims of the campaign included organizations in the education sector in several countries across Africa and Latin America."
        attribution: "Kaspersky Securelist"
        source_url: "https://securelist.com/cyberstrikeai-attacks/121715/"
      - quote: "originated from the sqlservr.exe process, indicating the likely initial access vector"
        attribution: "Kaspersky Securelist"
        source_url: "https://securelist.com/cyberstrikeai-attacks/121715/"
      - quote: "Since the actions performed by an AI agent on the network are indistinguishable from those of a human, classic, well-tuned correlation and behavioral analysis rules are sufficient to detect it."
        attribution: "Kaspersky Securelist"
        source_url: "https://securelist.com/cyberstrikeai-attacks/121715/"
      - quote: "The available data does not allow us to link the activity to any known group of attackers"
        attribution: "Kaspersky Securelist"
        source_url: "https://securelist.com/cyberstrikeai-attacks/121715/"
    extended_notes: |
      Detection concepts by telemetry class (Kaspersky's own rule list maps to these): process-creation events with parent lineage, a command shell or PowerShell with encoded commands spawned by sqlservr.exe; scheduled-task creation (schtasks /s remote creation, task named SystemUpdate, Schedule.Service COM creation) and task actions running as SYSTEM; Windows security events 4688/4104 for PowerShell, 4624/4768/4769 for logons and Kerberos (bursts of TGS requests for Kerberoasting, AS-REP roasting), 4662/4663/4656 object access, 5145 share access; LSASS access and comsvcs.dll MiniDump with a PID argument; registry-hive saves with reg.exe; DCSync replication requests from non-DC hosts; LDAP discovery bursts; certutil decode of .b64 files in C:\Windows\Temp, C:\ProgramData. Network side: the implant polls a server over HTTP/S, TCP or WebSocket and sends a fixed authentication header per C2 server; the control panel generates a self-signed certificate at every start whose issuer and subject carry the framework name, so scan history dates restarts.
      Hardening: Kaspersky gives detection coverage, not hardening steps; it notes the agent checks for LAPS. Mechanism-derived levers (analyst inference, not stated by Kaspersky): keep the database service account and host out of privileged-credential reach so a database server never holds domain-admin credentials, protect LSASS, restrict replication rights to domain controllers.
      Triage (analyst inference from the mechanism, not stated by Kaspersky): administrators and management tools can legitimately start PowerShell from a database host or create scheduled tasks remotely; the discriminators the source's timeline supports are an encoded command or a script reassembled from split files, a task named SystemUpdate that no update tooling owns, and compressed sequencing (discovery, credential dumping and DCSync within hours after a dormant period of days).
      Gap: no victim count, no named actor, no European victim; two-source corroboration of the campaign does not exist yet (trade press will relay Kaspersky).

  # ------------------------------------------------------------------ 4 (new, borderline)
  - title: "LLMJacking: Mandiant and GTIG describe stolen cloud tokens used to enable cloud LLM services and resell the access through 'LLM Mixers', with six-figure daily bills"
    sources:
      - { url: "https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models/", publisher: "Google Threat Intelligence Group / Mandiant", date: "2026-11-02", role: "primary" }
      - { url: "https://threats.wiz.io/all-incidents/threat-actors-targeting-gcp-billing-accounts-for-llm-usage", publisher: "Wiz Threat Center", date: "2026-10-20", role: "corroborating" }
    discovery_trace: "first seen at: mandiant-gtig, URL https://feeds.feedburner.com/threatintelligence/pvexyqv7v0v (feed fetched via bridge) → primary (no pivot needed): GTIG post read in full with extract on https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models/ → corroborating pivot: Wiz threat-center record found via the wiz-blog feed https://www.wiz.io/api/feed/cloud-threat-landscape/rss.xml, URL https://threats.wiz.io/all-incidents/threat-actors-targeting-gcp-billing-accounts-for-llm-usage"
    summary: |
      Mandiant responded to multiple 2026 incidents in which actors hijacked enterprise access to cloud-hosted LLMs; the incident set spans North America, South America and Asia Pacific in financial services, retail, technology and transportation, with charges above USD 100,000 in a single day and up to USD 1 million cumulative before access was cut. GTIG states the dominant initial access vector is exposed or stolen cloud identity tokens (IAM credentials, service-account keys, GitHub personal access tokens, live session tokens, including a page that has users paste a raw access-token JSON to bypass password and MFA); a smaller path is publicly exposed LLM endpoints (Ollama-style) and LLM API keys harvested from public repositories, validated with single-token requests (max_tokens=1) that stay below volume anomaly alerts. After entry the actors enumerate services and secret stores, create IAM or service accounts, attach administrative policies, inject SSH keys into compute metadata, and in one case exploited a LiteLLM gateway flaw (CVE-2026-40217, user-ID rebind on /key/regenerate) to turn a virtual key into proxy-admin. GTIG states that in several incidents LLM services were not enabled at compromise and the actor enabled them with the stolen key, then burned through quotas with 'burn and rotate' service accounts, requested GPU quota, and sold the access through relay gateways (LLM Mixers) built on open-source API proxies; GTIG tracks UNC6993 among the clusters and says it believes a token-routing service's pricing implies stolen keys. Wiz independently describes GCP billing-account hijack via search-ad phishing that harvests credentials and MFA codes, then enables the Gemini API and links external projects to the victim's billing account, so prompts stay invisible to victim logs (Wiz, 2026-10-20). GTIG expects actors to prioritise LLMJacking over cryptojacking.
    region_nexus: "global; GTIG's incident set names no European or Swiss victim"
    primary_sector_nexus: "indirect (public bodies adopting cloud LLM services such as Azure OpenAI, Bedrock or Vertex)"
    sector: "technology"
    cves: [CVE-2026-40217]
    techniques: [T1078.004, T1528, T1552.001, T1213.003, T1136.003, T1098.001, T1098.004, T1496.004, T1190]
    affected_products: ["Amazon Bedrock", "Microsoft Azure AI Foundry / Cognitive Services", "Google Vertex AI / Gemini API", "BerriAI LiteLLM", "Ollama"]
    entity_keys: ["product:berriai-litellm", "product:ollama"]
    new_entities:
      - { key: "trend:llmjacking", type: trend, name: "LLMJacking and LLM Mixers", aliases: ["LLMJacking", "LLM Mixers"], summary: "Abuse of stolen cloud identities and LLM API keys to enable and consume cloud LLM services and resell the access through relay gateways; GTIG and Mandiant (2026-11-02) report charges above USD 100,000 per day." }
      - { key: "actor:unc6993", type: actor, name: "UNC6993", aliases: [], summary: "GTIG-tracked financially motivated cluster in LLMJacking that abused a misconfigured service-account key and a token-capture portal and used open-source relay gateways to aggregate stolen keys (GTIG, 2026-11-02)." }
    relation_suggestions:
      - { subject: "actor:unc6993", object: "trend:llmjacking", basis: "GTIG names UNC6993 as one of the clusters operating in the LLMJacking ecosystem (GTIG, 2026-11-02)" }
    verification: MULTI-SOURCE
    confidence: MEDIUM
    classification: { reliability: B, credibility: 2 }
    novelty: new
    borderline: true
    borderline_reason: "Substantive primary analysis with a concrete cloud control-plane detection set, but the incident set names no European or Swiss victim and the decision only applies where the organisation runs cloud LLM services (relevance depends on Swiss public-sector cloud AI adoption); the store's AI-offence items so far were dropped for want of a constituency decision."
    evidence:
      - quote: "Mandiant responded to multiple incidents in 2026 in which threat actors hijacked enterprise access to Large Language Models (LLMs)"
        attribution: "Google Threat Intelligence Group / Mandiant"
        source_url: "https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models/"
      - quote: "the dominant initial access vector has been exposed or stolen cloud identity tokens"
        attribution: "Google Threat Intelligence Group / Mandiant"
        source_url: "https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models/"
      - quote: "In multiple incidents that Mandiant investigated, LLM services were not enabled at the time of compromise."
        attribution: "Google Threat Intelligence Group / Mandiant"
        source_url: "https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models/"
      - quote: "conducted automated credential validation sweeps using minimal single-token requests"
        attribution: "Google Threat Intelligence Group / Mandiant"
        source_url: "https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models/"
    extended_notes: |
      Detection by telemetry class (cloud control-plane audit logs plus gateway/API access logs): unexpected enablement of generative-AI services in a project or subscription (GCP ServiceUsage EnableService for the AI platform API; Azure Microsoft.CognitiveServices accounts/deployments writes; AWS Bedrock model-access and agreement calls such as PutUseCaseForModelAccess and CreateFoundationModelAgreement); first-time invocation APIs from principals that never used them (Bedrock Converse/InvokeModel, Vertex Predict/GenerateContent); spikes of throttling or validation errors that indicate key spraying; low-volume max_tokens=1 requests; changes or deletions of model-invocation logging or diagnostic settings by non-IaC principals; creation and deletion of short-lived service accounts; new IAM users with admin rights; SSH keys added to instance or project metadata; model-gateway admin-key regeneration (LiteLLM /key/regenerate). GTIG notes GCP data-access logs for inference are off by default.
      Hardening levers: deny access to cloud LLM services to identities that do not need them, granular API-key scopes per model and environment, spend caps and budget alerts, secret scanning of repositories, phishing-resistant MFA on cloud consoles, patching model gateways.
      Reference duty: CVE-2026-40217 (LiteLLM /key/regenerate) is already carried by entry 2026-06-16/obsidian-security-a-three-cve-chain-turns-any-litellm-user-i; any new entry on this item must list it in references[].
      Triage (analyst inference from the mechanism, not stated by GTIG): legitimate first-time Bedrock/Vertex/Azure OpenAI enablement by a platform team shows a change ticket, a known principal and an expected region; abuse shows a long-lived service-account key or federated token as actor, enablement of several services at once, quota increase requests for GPUs and billing spikes within hours.

