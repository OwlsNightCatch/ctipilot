      - { url: "https://isc.sans.edu/diary/rss/33482", publisher: "SANS Internet Storm Center (Johannes Ullrich)", date: "2026-11-02", role: "corroborating" }
    discovery_trace: "first seen at: akamai-sirt feed, URL https://feeds.feedburner.com/akamai/blog (bridge feed) and sans-isc feed, URL https://isc.sans.edu/rssfeed.xml → primary: Akamai post, URL https://www.akamai.com/blog/security-research/2026/nov/cve-2026-98432-remote-uaf-linux-kernels-tcp-stack (WebFetch for the summary, raw body read with the bridge url command for verbatim quotes; extract returned only the author blurb) → SANS ISC diary URL https://isc.sans.edu/diary/rss/33482 (read with extract). Store check: entry 2026-10-31/cve-2026-98432-linux-kernel-tcp-uaf-mptcp-remote-root, updated 2026-11-01."
    summary: |
      The covered entry describes CVE-2026-98432 as a SYN-with-IP-options use-after-free reached on plain IPv4 TCP listeners, with Anthropic's remote root exploit demonstrated on an MPTCP listener, and says no source publishes the kernel mechanics or an exposure check beyond MPTCP. Akamai's write-up adds precise root cause and a second trigger. Since Linux 4.4 request sockets are processed without the listener lock; IP options stored on the request socket are handed to the child socket uncopied and freed with a plain kfree() in inet_sock_destruct() (net/ipv4/af_inet.c) while another CPU building a SYNACK for a retransmitted SYN can still read them through ip_options_build(). Akamai also reports a similar flaw in tcp_v4_reqsk_destructor() when request-socket migration is enabled (net.ipv4.tcp_migrate_req=1 or a BPF_SK_REUSEPORT_SELECT_OR_MIGRATE program); IPv6 is not affected by the first path. Prerequisites in Akamai's list: network access to an IPv4 TCP listener on a kernel from 4.4 on without the fix, no credentials, and a connection request carrying IPv4 options such as Record Route or Timestamp followed by a retransmission; a lost race only aborts the handshake, so the attacker can retry. The fix by Eric Dumazet replaces kfree() with kfree_rcu() in both destructors and ships in stable 5.10.272, 5.15.223, 6.1.190, 6.6.159, 6.12.113, 6.18.56 and 7.2.10. Akamai states it is not aware of a public working exploit and that disabling MPTCP alone does not prevent exploitation; its interim steps are net.mptcp.enabled=0 together with net.ipv4.tcp_migrate_req=0 (reduces, does not remove risk), optional blocking of IPv4-option packets (breaks option-dependent applications), and ss -M -l -n -p -e to find MPTCP listeners. SANS ISC separately explains how to see MPTCP in traffic (TCP option 30, MP_CAPABLE) for tshark, Suricata and Zeek, which locates MPTCP use but, per Akamai, does not bound exposure.
    region_nexus: "global; any internet-facing Linux IPv4 TCP service"
    primary_sector_nexus: "direct (Linux servers across federal, cantonal and communal estates)"
    sector: "technology"
    cves: [CVE-2026-98432]
    techniques: [T1190, T1499.004]
    affected_products: ["Linux kernel"]
    entity_keys: ["product:linux-kernel"]
