        attribution: "Akamai Security Intelligence Group"
        source_url: "https://www.akamai.com/blog/security-research/2026/nov/cve-2026-98432-remote-uaf-linux-kernels-tcp-stack"
      - quote: "Disabling MPTCP alone does not prevent exploitation; it only reduces the likelihood of triggering the race condition."
        attribution: "Akamai Security Intelligence Group"
        source_url: "https://www.akamai.com/blog/security-research/2026/nov/cve-2026-98432-remote-uaf-linux-kernels-tcp-stack"
