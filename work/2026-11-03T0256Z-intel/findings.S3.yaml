  - title: "Refrigeration-controller attacks reach Belgium, Luxembourg, Sweden, the Netherlands, Ireland and Estonia: more than 115 stores hit overnight into 2 November"
    sources:
      - { url: "https://www.heise.de/news/Kuehlschraenke-in-Lebensmittellaeden-weiterer-Laender-geknackt-11507846.html", publisher: "heise online", date: "2026-11-02", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/hackers-disrupt-refrigeration-systems-at-european-supermarkets/", publisher: "BleepingComputer", date: "2026-11-02", role: "corroborating" }
      - { url: "https://www.euronews.com/2026/11/02/cyberattack-hits-belgian-supermarket-fridges-and-freezers", publisher: "Euronews", date: "2026-11-02", role: "corroborating" }
    discovery_trace: "first seen at: heise-sec, URL https://www.heise.de/security/feed.xml (feed fetched via bridge) → pivot: heise article, URL https://www.heise.de/news/Kuehlschraenke-in-Lebensmittellaeden-weiterer-Laender-geknackt-11507846.html → pivot: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/hackers-disrupt-refrigeration-systems-at-european-supermarkets/ (company statements, Sabcobel quote via RTL) → pivot: Euronews, URL https://www.euronews.com/2026/11/02/cyberattack-hits-belgian-supermarket-fridges-and-freezers (CCB and prosecutor statements via Belga). RTL (rtl.be) is cited by BleepingComputer but is http-only and was not reachable on any transport; Reuters, Le Soir and NOS were not fetched. Store check: entry 2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack was last updated 2026-11-02T03:47:57Z, before these reports."
    summary: |
      Overnight from Sunday 1 to Monday 2 November, refrigeration and freezer systems failed or were forced to heat at dozens of supermarkets in several countries, about three weeks after the French attacks on Danfoss AK-SM/AK-SC and Copeland/Dixell xweb controllers that the covered entry tracks. Chains confirmed to BleepingComputer: ICA (Sweden, at least 4 stores, "outside ICA's central network"), Coop Sweden (7 of more than 800), Ahold Delhaize (around 40 stores in Belgium and Luxembourg, "an IT incident"), Carrefour Belgium (15 of 700), Colruyt's independently operated Spar stores (5), Intermarché Belgium (about 15), SuperValu Ireland (13) and Selver Estonia (1); at least 17 butcher shops and neighbourhood stores in the Netherlands; BleepingComputer counts more than 115 stores. Euronews adds IKEA Mons, the Belgian Centre for Cybersecurity's statement that it is aware of the incident and has no further information, and a federal prosecutor's investigation. Reported setpoints differ across outlets (an ICA store manager told TV4 of +50 °C, heise, citing Euronews, says Belgian units were set to 70 °C while Euronews' own text says 17 °C). Whether the cause is the same as in France is a claim, not a finding: the CEO of installer Sabcobel, which services Delhaize's units, told Belga and RTL that the Belgian attack uses exactly the same mechanism as the French one, switching evaporators to defrost, that a software update alone is insufficient and physical changes are required, and that most customers have since moved to managing units over a secure connection; heise states the same-method link is not confirmed, and no source names the controller model, the entry vector or an attributing party. This sits uneasily with ANSSI's earlier statement in the covered entry that the French attacks used exposure and weak passwords rather than a published flaw, which the new sources do not address. No source lists a Swiss store.
    region_nexus: "europe (BE, LU, SE, NL, IE, EE); neighbouring countries to Switzerland not named; no Swiss store in these sources"
    primary_sector_nexus: "indirect (retail cold chain; same controller class sits in hospitals, school kitchens, laboratories and municipal facilities)"
