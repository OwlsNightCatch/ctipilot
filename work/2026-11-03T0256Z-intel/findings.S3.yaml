        attribution: "Akamai Security Intelligence Group"
        source_url: "https://www.akamai.com/blog/security-research/2026/nov/cve-2026-98432-remote-uaf-linux-kernels-tcp-stack"
      - quote: "The best way to detect MPTCP is to look for TCP Option 30."
        attribution: "SANS Internet Storm Center"
        source_url: "https://isc.sans.edu/diary/rss/33482"
    extended_notes: |
      Exposure-check delta for the covered entry: besides the plain-TCP SYN path, check net.ipv4.tcp_migrate_req and any BPF reuseport migration program; both mitigations Akamai lists are partial. Delta is modest: most of the entry's facts (plain TCP reachable, MPTCP-off insufficient, IP-options filter) are already carried; the new content is the kernel-level mechanics, the second path, the exact fixed-version list in one place and the absence of a public exploit as of 2026-11-02 (the entry says no source reports public exploit code or attacks).
      Detection concept: the trigger is repeated option-bearing SYNs plus retransmissions from one source toward a listener (flow or firewall telemetry); Akamai gives no network indicator and neither does ISC.

