  summary: |-
    FACTS (per the ARD Hauptstadtstudio, which has the BSI letter, and the Digital Minister's on-air confirmation): since 29 October 2026 iPhones of Bundestag deputies and members of the federal government received an Apple threat notification stating that an attack with so-called mercenary spyware had been detected. Digital Minister Karsten Wildberger confirmed on ARD's 'Bericht aus Berlin' that there is a message from Apple that certain devices may have been compromised with spyware and that the BSI wrote to everyone affected; he gave no details. The BSI letter says it has no further information on the concrete occasion and recommends that those affected assume as a precaution that the device may be compromised. Tagesschau notes that Apple describes such notifications as very reliable warnings of targeted attack, that the notification does not say whether the attack succeeded, and that Apple does not disclose triggers or attribute attacks.

