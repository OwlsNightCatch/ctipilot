- title: 'Bundestag: mailboxes of Left Party deputies knocked out by a mail-bombing flood of 20,000+ messages each; BSI engaged'
  sources:
  - url: https://www.tagesschau.de/inland/innenpolitik/cyberattacke-linkspartei-mail-postfaecher-100.html
    publisher: Tagesschau (ARD Hauptstadtstudio)
