  discovery_trace: 'first seen at: golem-security, URL https://rss.golem.de/rss.php?tp=sec&feed=RSS2.0 (title ''Remote-Steuerung: Kühltheken in Supermärkten erneut gehackt'', page cookie-walled) -> pivot: heise security feed, URL https://www.heise.de/security/feed.xml -> pivot: heise article, URL https://www.heise.de/news/Kuehlschraenke-in-Lebensmittellaeden-weiterer-Laender-geknackt-11507846.html -> pivot: Euronews, URL https://www.euronews.com/2026/11/02/cyberattack-hits-belgian-supermarket-fridges-and-freezers -> pivot: Guardian, URL https://www.theguardian.com/world/2026/nov/02/supermarket-freezers-across-europe-hit-by-second-suspected-cyber-attack -> pivot: Tagesschau, URL https://www.tagesschau.de/wirtschaft/technologie/cyberangriff-supermaerkte-100.html -> pivot: Netzwoche, URL https://www.netzwoche.ch/news/2026-11-02/update-angriffe-auf-kuehlanlagen-treffen-weitere-supermaerkte-auch-coop-im-visier -> pivot: 20 Minuten, URL https://www.20min.ch/story/seit-mitte-oktober-mysterioese-hacking-welle-trifft-europaeische-supermaerkte-103660687;
    no national-authority or vendor primary for the new wave was reachable (CCB Belgium advisories listing newest 2026-10-30; NCSC.ch advisory 13054 last modified 2026-10-13)'
  summary: |-
    FACTS (reported by the retailers and their refrigeration contractors): overnight on 2 November 2026, supermarkets in Belgium, Luxembourg, Sweden, the Netherlands, Estonia, Finland and Ireland reported refrigerator and freezer temperatures rising to as high as 50 C, the same effect as the 11 to 12 October French incident already tracked in the entry. Belgian refrigeration contractor Sabcobel (which runs Delhaize's refrigeration) says the evaporators were remotely put into defrost mode, that around twenty of its units were hit, and that the mechanism is exactly the same as in France; its CEO adds that a software update alone is not enough, that most customers moved to a secure connection after the French attack, and that the simplest fix is managing the units over a secure connection. Danfoss says at least seventeen Dutch businesses were attacked and that affected customers had not updated their software; a Belgian butcher chain says its hit units run Copeland systems while its Danfoss units seemed unaffected and were disconnected as a precaution; a supermarket and its contractor in Estonia say attackers reached the control computer of an older Danfoss system whose software had not been updated. Sweden's ICA says the affected stores had not connected their refrigeration equipment to the central network and cannot confirm a hack; the head of Sweden's national cybersecurity centre says it is working incidents across the country and that Sweden has quite a lot of exposed operational technology devices. Belgium's CCB says it is aware of an incident; Belgium's federal prosecutor has opened an investigation; the EU agriculture commissioner calls it a deliberate attempt to disrupt the food supply chain. SWISS NEXUS: Coop Switzerland confirmed to 20 Minuten that corresponding attempts were registered and were unsuccessful; Migros reports no indications of an attack on its refrigeration; neither names its equipment.

    CLAIMS AND UNKNOWNS: nobody has claimed the attacks; the 20 Minuten report notes there was no ransom demand and no data theft. Whether the new wave uses the same flaws and access path as France is asserted by Sabcobel but, per heise, not yet confirmed; no source names the initial-access vector for the new wave. A KTH cyber-defence head quoted by Tagesschau assesses a financial motive unlikely and pro-Russian groups possible, which is opinion without attribution evidence. Temperature figures differ between reports (17 C in the early Belgian reports quoted by Euronews, 50 C in Sweden, 70 C per HLN via NOS and heise, which Delhaize could not confirm).

    DELTA vs the existing entry: the entry covers the French wave and CERT-FR/NCSC.ch guidance up to 2026-11-02 03:47Z; it does not mention the second wave, the Copeland hit in Belgium, the Estonian old-software statement, ICA's no-central-network statement, or the Swiss Coop attempts.
  region_nexus: 'Europe (second wave BE/LU/SE/NL/EE/FI/IE); Switzerland: Coop CH registered unsuccessful attempts, Migros no indications'
  primary_sector_nexus: 'indirect: remote-managed refrigeration controllers also exist in public-sector kitchens, canteens, hospital and school catering, civil-protection and municipal cold storage, typically maintained by an external refrigeration contractor'
