  discovery_trace: 'first seen at: golem-security, URL https://rss.golem.de/rss.php?tp=sec&feed=RSS2.0 (title ''Cyberattacke: Postfächer von Linke-Abgeordneten im Bundestag lahmgelegt'', page cookie-walled) -> primary: Tagesschau, URL https://www.tagesschau.de/inland/innenpolitik/cyberattacke-linkspartei-mail-postfaecher-100.html'
  summary: |-
    FACTS (per the Left Party's parliamentary managing director, Ina Latendorf, to ARD, as relayed by Tagesschau): deputies of the Left Party in the Bundestag had their mailboxes flooded with thousands of e-mails within minutes, more than 20,000 per member by the time she spoke, from many different senders, with different subjects and in many languages, which made the mailboxes unusable; the party called it a spam-bombing attack. The Bundestag's mail traffic as a whole saw only delays because the servers have enough capacity; other parliamentary groups reported no affected members; affected deputies received instructions for filtering the flood; the BSI was brought in. The attacker is unknown. Tagesschau reports that, according to the information it cites, the flood has nothing to do with the separate Apple spyware warning for deputies and government members.

    NOT KNOWN: attacker, motive, whether the flood masks a follow-on action (no source suggests one).
