  discovery_trace: 'first seen at: inside-it-ch feed (not in this slice; swept for Swiss items), URL https://www.inside-it.ch/rss.xml -> primary (no pivot needed): Inside IT article, URL https://www.inside-it.ch/cyberangriff-auf-waadtlaender-schulen-20261102 -> corroboration: Netzwoche, URL https://www.netzwoche.ch/news/2026-11-02/daten-von-41500-personen-bei-waadtlaender-schulen-gestohlen -> context: RTS, URL https://www.rts.ch/info/regions/vaud/2026/article/vaud-les-donnees-de-plus-de-40-000-eleves-et-profs-volees-29401382.html and canton press release, URL https://www.vd.ch/actualites/communiques-de-presse-de-letat-de-vaud/detail/communique/la-plateforme-de-support-informatique-des-gymnases-et-des-ecoles-professionnelles-du-canton-victime-dun-vol-de-donnees'
  summary: |-
    The entry (2026-11-01) already carries the canton's 2026-10-31 press release and RTS's report that a pupil is suspected. New on 2 November, from Keystone-SDA via Inside IT: the Vaud cantonal police, contacted by the agency, did not confirm the pupil report and promised a statement in the coming days. Pedro Coelho, deputy director general for post-compulsory education, told Keystone-SDA that the case was passed to the police together with several indications and that, as Inside IT reports his statement, much at present points to an internal matter. That is the first on-record indication from the victim organisation that the access came from inside, which the entry so far attributes only to RTS 'without a further named source'.

    Netzwoche (2 November) restates the canton's data: about 38,000 pupils and 3,500 teachers, names, school e-mail addresses and the content of support requests copied; no passwords on the platform, no grades or pupil files; the platform stays offline; the incident was reported to the BACS and the Vaud data-protection authority and a criminal complaint is to be filed.

    UNKNOWN: access method, which account or privilege was used, and whether anything was published or sold. 'Internal' in the canton's wording is not the same as 'a pupil'; the pupil claim remains RTS's report of the canton's information, unconfirmed by police.
