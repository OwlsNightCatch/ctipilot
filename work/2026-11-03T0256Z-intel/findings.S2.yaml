  - quote: According to this, attackers gained access to the control computer of an older Danfoss refrigeration system whose software had not yet been updated.
    original: Demnach verschafften sich Angreifer Zugang zum Steuercomputer eines älteren Kühlsystems von Danfoss, dessen Software bisher nicht aktualisiert worden war.
    attribution: Tagesschau (ARD)
    source_url: https://www.tagesschau.de/wirtschaft/technologie/cyberangriff-supermaerkte-100.html
  - quote: In Switzerland, too, corresponding attempts were registered at Coop - but without success, a spokeswoman for the retailer confirmed on request.
    original: Auch in der Schweiz wurden bei Coop entsprechende Versuche registriert – allerdings ohne Erfolg, wie eine Sprecherin des Detailhändlers auf Anfrage bestätigt.
    attribution: 20 Minuten
    source_url: https://www.20min.ch/story/seit-mitte-oktober-mysterioese-hacking-welle-trifft-europaeische-supermaerkte-103660687
  - quote: The refrigeration at De Laet & Van Haver runs on Copeland systems, says Muylle.
    original: De koelingen van de De Laet & Van Haver draaien op systemen van Copeland, zegt Muylle.
    attribution: NOS Nieuws
    source_url: https://nos.nl/artikel/2637705-opnieuw-hack-bij-supermarktketens-koelingen-in-belgie-luxemburg-en-zweden-op-tilt
  - quote: The company tells NOS it cannot confirm that this is due to a hack. It is said to concern stores whose refrigeration equipment was not connected to ICA's central network.
    original: Het bedrijf zegt tegen de NOS dat het niet kan bevestigen dat dit door een hack komt. Het zou gaan om winkels die hun koelapparatuur niet hebben aangesloten op het centrale netwerk van Ica.
    attribution: NOS Nieuws (ICA statement)
    source_url: https://nos.nl/artikel/2637705-opnieuw-hack-bij-supermarktketens-koelingen-in-belgie-luxemburg-en-zweden-op-tilt
  - quote: quite a lot of exposed operational technology devices
    attribution: The Guardian (quoting the head of Sweden's national cybersecurity centre)
    source_url: https://www.theguardian.com/world/2026/nov/02/supermarket-freezers-across-europe-hit-by-second-suspected-cyber-attack
  extended_notes: 'Exposure line for the entry: any remote-managed refrigeration or building-services controller (Danfoss AK-SM/AK-SC, Copeland/Dixell xweb) reachable from the internet, including through a contractor''s remote-maintenance path; ask facility and catering contractors of public-sector sites whether such units are internet-reachable. Detection concept (from the mechanism the sources state, not from a published indicator): setpoint or defrost-schedule changes on a controller that nobody scheduled, temperature-alarm bursts across many units in the same night, and controller web-interface logins from non-contractor addresses; the 1 to 2 am onset in Belgium means overnight monitoring and contractor on-call paths matter. Triage: a defrost-driven temperature rise is also what a genuine defrost-termination or sensor fault produces; the discriminator in these reports is simultaneity across many unrelated sites of one chain or one contractor and the remote cause the contractor identified.
    The Swiss relevance bar is met by the NCSC.ch advisory 13054 already in the entry plus the new Coop confirmation; no Swiss victim is reported.'
