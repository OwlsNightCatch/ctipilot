    date: '2026-11-02'
    role: corroborating
  discovery_trace: 'first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/13128 (ncsc-csh recent 15, newest post) -> corroboration: heise online, URL https://www.heise.de/en/news/Progress-WS-FTP-flaws-could-allow-system-compromise-11507793.html -> vendor bulletin https://community.progress.com/s/article/WS-FTP-Server-Critical-Security-Alert-Bulletin-September-2026 is a Salesforce SPA that returned no body on extract or WebFetch, so it is not cited'
  summary: |-
    The store entry for CVE-2026-84295 (2026-10-31) was composed from three ENISA EUVD records and lists three CVEs (CVE-2026-84295, CVE-2026-90865, CVE-2026-90867). heise (2 November, reading the Progress bulletin) lists fifteen WS_FTP Server CVEs fixed in 2024.0.7 and 2025.0.4 (2024.0.6 and 2025.0.3 for a subset), and the NCSC.ch advisory lists six rated 9.0 or higher: CVE-2026-84295 (10.0, improper authentication exposing administrative credentials), CVE-2026-90868 (9.9, OS command injection), CVE-2026-90866 (9.1, path traversal by a delegated Host Administrator, potentially RCE), CVE-2026-90864 (9.1, path traversal), CVE-2026-90863 (9.1, missing authorization in the admin interface leading to privileged command execution) and CVE-2026-90865 (9.0, OS command injection with elevated privileges). Four of those six (90868, 90866, 90864, 90863) are absent from the entry.

    NCSC.ch states the exploitation status as UNKNOWN and says all versions before 2024.0.7 (9.0.7) and 2025.0.4 (10.0.4), both released 2026-10-01, are affected; prerequisites per NCSC.ch: network access to WS_FTP Server or its web interfaces, several flaws need authenticated or delegated Host Administrator access and some need specific configurations. No exploitation is reported by either source.

    Cross-domain note: this is S1 territory; it surfaced in the S2 sweep of the essential NCSC.ch Security Hub and is returned because the Swiss authority now carries it and the entry understates the critical set. The CVSS values are the vendor's as relayed by heise and NCSC.ch; I could not read the Progress bulletin itself.
