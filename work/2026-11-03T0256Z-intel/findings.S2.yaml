  evidence:
  - quote: Dozens of supermarkets in Europe have reported temperatures of their refrigerators and fridges rising overnight, now widely believed to be caused by cyber attacks similar to the one that affected France several weeks ago.
    attribution: Euronews
    source_url: https://www.euronews.com/2026/11/02/cyberattack-hits-belgian-supermarket-fridges-and-freezers
  - quote: The refrigeration executive said a software update alone is not enough to address the vulnerability, with physical modifications required instead.
    attribution: Euronews
    source_url: https://www.euronews.com/2026/11/02/cyberattack-hits-belgian-supermarket-fridges-and-freezers
  - quote: In the Netherlands, the freezing and cooling systems of at least seventeen companies were attacked last night, according to a spokesperson for supplier Danfoss.
    attribution: Euronews
    source_url: https://www.euronews.com/2026/11/02/cyberattack-hits-belgian-supermarket-fridges-and-freezers
  - quote: Danfoss, the company that supplied the software for the refrigeration systems affected in both the latest incident and the one in France in October, said customers who had not updated their software were affected.
    attribution: Euronews
