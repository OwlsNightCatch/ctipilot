    attribution: Netzwoche
    source_url: https://www.netzwoche.ch/news/2026-11-02/daten-von-41500-personen-bei-waadtlaender-schulen-gestohlen
  extended_notes: 'Transferable lesson only as far as the sources go: the stolen data class (names, school e-mail addresses, support-request text) is what the canton itself names as fuel for targeted impersonation of IT support. Triage: an insider or pupil with ticketing-platform access produces export or bulk-view activity from an ordinary user account rather than an external exploit trace; the sources give no log evidence either way, so this is not stated as fact.'
- title: 'Progress WS_FTP Server: the September 2026 bulletin lists 15 CVEs, six rated 9.0 or higher; NCSC Switzerland issues its own advisory'
  sources:
  - url: https://security-hub.ncsc.admin.ch/#/posts/13128
    publisher: NCSC Switzerland (Security Hub advisory 13128)
    date: '2026-11-02'
    role: primary
  - url: https://www.heise.de/en/news/Progress-WS-FTP-flaws-could-allow-system-compromise-11507793.html
