    text: "The canton of Vaud said on 2026-10-31 that its education directorate detected on 2026-10-26 unauthorised access to the IT-support platform of the canton's Gymnases and professional schools, which copied the names and school e-mail addresses of about 3,500 teachers and 38,000 pupils and the content of support requests; passwords are not stored on the platform and no grades or pupil files are affected. The canton names targeted fraudulent messages that pose as the school or IT support as the main risk; RTS reports that a pupil is suspected, which the police have not confirmed, and the education directorate's deputy director says much points to an internal matter. No source gives the access method or the platform product."
