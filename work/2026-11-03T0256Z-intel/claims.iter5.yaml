    text: "Coopérative U, Intermarché and E. Leclerc confirmed to AFP a cyberattack on their refrigeration systems overnight on 11 to 12 October 2026, a remotely forced defrost at hundreds of French stores. On 2026-11-02 BleepingComputer counts more than 115 stores in Belgium, Luxembourg, the Netherlands, Sweden, Ireland and Estonia with refrigeration failures, in some cases remotely changed settings, and says it is unclear whether they were hit in a coordinated attack; Belgian contractor Sabcobel says its sites were hit through the same vulnerability as in France, Euronews names Danfoss as the software supplier in both incidents, CyberInsider says the manufacturer and access method of the new wave remain unknown, and Coop Switzerland says attempts against it failed. CERT-FR reports numerous compromises of Danfoss AK-SM and AK-SC controllers and of Copeland xweb and Dixell xweb, NCSC Switzerland rates the activity actively exploited, and ANSSI says elementary flaws were exploited, controllers directly on the internet and weak passwords, not published vulnerabilities. No actor is named on the record; Reuters and Nextgov report that the Pentagon treats freezer failures at US military commissaries as a suspected hack."
