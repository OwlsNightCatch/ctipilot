  # --- Danfoss (2026-10-13/danfoss-...) ---
  - {claim_id: d7a319bb96, verdict: ok, source_url: "https://www.bleepingcomputer.com/news/security/hackers-disrupt-refrigeration-systems-at-european-supermarkets/", passage: "More than 115 stores in Belgium, the Netherlands, Sweden, Luxembourg, Ireland, and Estonia have been affected."}
