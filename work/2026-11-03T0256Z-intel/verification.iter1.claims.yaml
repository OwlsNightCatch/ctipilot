claims:
  # --- SIMATIC IoT2050 (2026-08-13/cve-2026-58115) ---
  - {claim_id: 4880113c12, verdict: F14, source_url: "https://www.vulncheck.com/blog/exploitation-targeting-node-red", passage: "VulnCheck: 'one of our canaries caught an attacker exploiting CVE-2026-58115'; neither VulnCheck nor The Register says 'first' in-the-wild exploitation"}
  - {claim_id: 2468f44ae0, verdict: F14, source_url: "https://www.vulncheck.com/blog/exploitation-targeting-node-red", passage: "summary: 'caught the first in-the-wild exploitation'; VulnCheck only reports its canary caught an attack on 2026-10-30, never 'first'"}
  - {claim_id: 714061cb88, verdict: ok, source_url: "https://cert-portal.siemens.com/productcert/html/ssa-834709.html", passage: "Update to V4.3.4.1 or later; mitigations: Uninstall Node-RED; Harden the Node-RED installation"}
  - {claim_id: ae95b1ed1c, verdict: ok, source_url: "https://www.vulncheck.com/blog/exploitation-targeting-node-red", passage: "review deployed flows for unexpected exec nodes or HTTP endpoints, since some attackers are leaving webshells"}
  - {claim_id: 1ac3a85286, verdict: ok, source_url: "https://www.vulncheck.com/blog/exploitation-targeting-node-red", passage: "CVSS 10.0, <V4.3.4.1, pre-auth per Siemens; exploited per VulnCheck canary event of 2026-10-30"}
  - {claim_id: c109343693, verdict: ok, source_url: "https://cert-portal.siemens.com/productcert/html/ssa-834709.html", passage: "CVSS 10.0 v3.1 and v4.0; CWE-306; Update to V4.3.4.1; Uninstall Node-RED / Harden (Node-RED User Guide)"}
  - {claim_id: 7177a7e921, verdict: ok, source_url: "https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-1009/", passage: "SIMATIC IoT2050 Advanced ... Bulletin Siemens SSA-834709 du 11 aout 2026; NCSC-2026-0282 lists CVE-2026-58115 and SIMATIC IoT2050 Advanced"}
  - {claim_id: 99d8616eff, verdict: ok, source_url: "https://www.vulncheck.com/blog/exploitation-targeting-node-red", passage: "one POST /flows ... inject + exec node, echo <base64> | base64 -d | sh; saved as /dev/shm/.b; setsid ... nohup"}
  - {claim_id: ed8af93961, verdict: ok, source_url: "https://www.vulncheck.com/blog/exploitation-targeting-node-red", passage: "16 times between October 30 and November 1; http in endpoint wired to exec node; 'better read as opportunistic exploitation infrastructure'"}
  - {claim_id: caed26daa7, verdict: ok, source_url: "https://www.vulncheck.com/blog/exploitation-targeting-node-red", passage: "one of our canaries; 'it is not in CISA's KEV at the time of writing'"}
  - {claim_id: 7a611a2ad2, verdict: ok, source_url: "https://www.theregister.com/security/2026/11/02/max-severity-bug-in-widely-used-ot-programming-tool-exploited-to-deliver-linux-malware/5307086", passage: "Register article of 2026-11-02 relays VulnCheck's canary finding (read via WebFetch)"}
  - {claim_id: f3aed93e0a, verdict: ok, source_url: "https://cert-portal.siemens.com/productcert/html/ssa-834709.html", passage: "All versions < V4.3.4.1 running Industrial OS with Node-RED installed"}
  - {claim_id: 45fa09844e, verdict: ok, source_url: "https://www.vulncheck.com/blog/exploitation-targeting-node-red", passage: "Node-RED instances without adminAuth are being found and exploited automatically; embedded in commercial ICS/OT products"}
  - {claim_id: d39c91121f, verdict: ok, source_url: "https://www.vulncheck.com/blog/exploitation-targeting-node-red", passage: "naive filter looking for wget or curl would not see them; /dev/shm/.b; setsid/nohup; webshell backdoor survives if memory-backed implant lost"}
  - {claim_id: b4792b2cc4, verdict: ok, source_url: "https://cert-portal.siemens.com/productcert/html/ssa-834709.html", passage: "Affected devices do not enforce authentication on the Node-RED HTTP interface, allowing unauthenticated access to programming nodes..."}
  - {claim_id: f6c217c7e3, verdict: ok, source_url: null, passage: "labelled inference; follows from VulnCheck POST /flows mechanism"}
  - {claim_id: 4e8d7ea726, verdict: ok, source_url: null, passage: "derived takeaway; supported by Siemens mitigations and VulnCheck guidance"}
  - {claim_id: 614642a4d3, verdict: ok, source_url: "https://www.vulncheck.com/blog/exploitation-targeting-node-red", passage: "single POST ... 16 events ... persistent http-in webshell ... did not retrieve the binary"}
  - {claim_id: 416465d3a6, verdict: ok, source_url: "https://www.vulncheck.com/blog/exploitation-targeting-node-red", passage: "not in CISA's KEV at the time of writing"}
  - {claim_id: c772723f12, verdict: ok, source_url: "https://www.theregister.com/security/2026/11/02/max-severity-bug-in-widely-used-ot-programming-tool-exploited-to-deliver-linux-malware/5307086", passage: "Register: 'the researchers saw this IP address target the same Node-RED vulnerability 16 times'"}
  - {claim_id: 6e2e03fd88, verdict: ok, source_url: null, passage: "statement about the entry's own earlier text; no source needed (F11 advisory: record-keeping narration)"}
  - {claim_id: e8955a68c6, verdict: F14, source_url: "https://www.vulncheck.com/blog/exploitation-targeting-node-red", passage: "record summary: 'caught the first in-the-wild exploitation'; no cited source says first"}
