    entry: 2026-10-29/php2shell-trend-micro-apex-quest-kace-netapp-ontap
    surface: "summary"
    kind: frontmatter
    text: "Trend Micro's advisory, last updated 2026-11-02, lists Apex Central and the on-premises Apex One server as impacted by the PHP flaws with critical patches due on 2026-11-11 and interim mitigations, shows critical patches for Deep Discovery Inspector and Email Inspector, and adds Mobile Security for Enterprise as impacted with a patch due on 2026-11-17; Quest says all KACE SMA and SDA versions are affected, with SMA 15.0 CU5 and 15.1 CU2 and the SDA 9.3 hotfix out and advice to block ports 80, 443 and 52230 until applied; and NetApp's advisory lists ONTAP 9 as affected only by CVE-2026-109618, with attacker access as the www user restricted to the PHP jail and hotfix builds from 9.12.1P20HF1 to 9.19.1P4. NetApp says it is aware of public discussion of the vulnerability and none of the three vendors reports an exploited case in what was read, although CISA lists both flaws as exploited."
