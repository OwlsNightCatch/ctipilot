  - claim_id: e89f07de5f
    entry: 2026-10-31/cve-2026-98432-linux-kernel-tcp-uaf-mptcp-remote-root
    surface: "summary"
    kind: frontmatter
    text: "The Linux kernel CVE team published CVE-2026-98432 on 2026-10-15, a use-after-free in the IPv4 TCP connection setup path that dates to Linux 4.4 and is reached by a SYN packet carrying IP options; the CNA scores it CVSS 9.8. Anthropic reports that Claude wrote an exploit giving a remote, unauthenticated attacker root on servers with a multipath TCP (MPTCP) listener, which CloudLinux's kernel team could not reproduce; the Go team says the bug is not specific to MPTCP and Akamai that disabling MPTCP does not prevent exploitation. Debian, CIQ and Amazon Linux kernels are fixed, Ubuntu's were in progress on 2026-10-30, and Fortinet lists FortiOS, FortiProxy, FortiManager, FortiAnalyzer, FortiWeb and FortiAuthenticator among the products under investigation with no fixed build; no source reports a public exploit or attacks."
