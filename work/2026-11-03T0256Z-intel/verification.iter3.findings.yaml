- code: F4
  category: hallucinated-fact
  section: 2026-09-22/cve-2026-13684-synology-dsm-unauth-file-read-write (body, paragraph 3; claim fe227efd9a)
  item: "naming no CVE and pointing to Synology-SA-24:20, which is dated 2024-11-05 rather than December"
  url_or_quote: "https://www.synology.com/en-global/security/advisory/Synology_SA_24_20"
  summary: "The clause added in iteration 2 asserts a date mismatch the linked advisory contradicts: SA-24:20's revision table reads '4 | 2024-11-26 | Update for DSM 7.1 is now available', '5 | 2024-12-05 | Added DSM 6.2 to Affected Products', '6 | 2024-12-05 | Update for DSM 6.2 is now available in Affected Products', so a December 2024 patch release (DSM 6.2, 6.2.4-25556-8) exists and fits Synology's 'patched in December 2024'. The iteration-2 F9 finding quoted only revisions 1 to 3 of nine; the remediation rests on that incomplete table. The clause is also cited to Synology's notice, which carries no date for SA-24:20 (adjacency, F3). Delete the clause, or say the advisory was first published 2024-11-05 and revised on 2024-12-05 when the DSM 6.2 fix shipped; the conflict between Synology and 360 rests on which CVEs, not on a date."
