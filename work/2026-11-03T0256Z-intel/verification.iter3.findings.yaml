  summary: "Advisory data reads published_date 2026-10-21 and kb_rev_history 8.0 and 9.0 on 20261026, 10.0 on 20261029, 11.0 on 20261103; the 2026-10-26 label equals neither the publication date nor the latest revision. Iteration 2 flagged this label; the remediation re-dated only the 'public discussion' clause to 2026-10-21 and left the label on the clause listing the hotfix builds (and the two sources[] records dated 2026-10-26). Date it 2026-10-21 or drop it in favour of the 2026-11-03 revision-11.0 citation that already follows."
- code: F5
  category: missing-citation
  section: 2026-09-22/cve-2026-13684-synology-dsm-unauth-file-read-write (Exposure line)
  item: "(low confidence) '... the only fixes the two advisories name for DSM 7.1, 7.2 and 6.2 ([Synology PSIRT, 2024-11-05](...)), with the DSM management interface reachable over the network.'"
  url_or_quote: "https://security-hub.ncsc.admin.ch/#/posts/12960"
  summary: "The trailing prerequisite carries no citation. NCSC post 12960 states 'Prerequisites: Network access to the DSM management interface' for the SA-26:13 flaws only; SA-24:20 says 'remote attackers' and names no interface, and the sentence covers both advisories. Cite NCSC for an SA-26:13-scoped clause and BleepingComputer's 'block access to the management web interface from the Internet' for the SA-24:20 side, or scope the clause."
- code: F9
  category: surface-contradiction
  section: 2026-09-22/cve-2026-13684-synology-dsm-unauth-file-read-write and entities/registry.yaml (malware:c3rb3r-ransomware)
  item: "(low confidence) 'The same day 360 identified the ransomware as C3RB3R, a Cerber variant' and registry summary 'Cerber-family ransomware variant'"
  url_or_quote: "https://www.bleepingcomputer.com/news/security/synology-warns-customers-of-ongoing-c3rb3r-ransomware-attacks/"
  summary: "360 calls C3RB3R 'the old-school ransomware family Cerber's variant'; BleepingComputer, cited in the same entry, says 'The Cerber ransomware (also known as C3RB3R and CerberImposter) ... borrowed its name from a notorious Ransomware-as-a-Service (RaaS) with the same name that emerged in 2016' and dates C3RB3R from December 2021. The entry attributes the variant claim to 360 but never surfaces BleepingComputer's name-borrowing reading, and the registry states 'Cerber-family' in its own voice while carrying BleepingComputer's alias CerberImposter. Add a Contradiction clause (or limit the registry wording to '360 describes it as a Cerber variant')."
