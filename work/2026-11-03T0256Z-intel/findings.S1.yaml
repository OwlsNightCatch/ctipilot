      Exposure lever for AWS tenants: a target behind an NLB TCP listener or Global Accelerator, or reached through PrivateLink or VPC Lattice
      layer 4, sees client IP options, so it needs the kernel fix or the IP-options drop; a target behind an ALB or an NLB TLS listener does
