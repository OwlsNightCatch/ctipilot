  - title: "CVE-2026-111497 Brotli decoder: default WordPress installs reach it unauthenticated through xmlrpc.php pingbacks via libcurl, Patchstack shows a worker crash and says no public code-execution chain targets PHP"
    novelty: "update-of:2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi"
    lookback: true
    sources:
      - { url: "https://patchstack.com/articles/wordpress-doesnt-ship-brotli-its-still-exposed-to-cve-2026-111497/", publisher: "Patchstack", date: "2026-10-30", role: "primary" }
      - { url: "https://www.drweb.de/brotli-sicherheitsluecke-wordpress-pingback/", publisher: "Dr. Web (drweb.de, German; derives from Patchstack)", date: "2026-10-30", role: "corroborating" }
    discovery_trace: "first seen at: patchstack, feed https://patchstack.com/feed/ (item 2026-10-30 'WordPress doesn't ship Brotli. It's still exposed to CVE-2026-111497') -> primary: https://patchstack.com/articles/wordpress-doesnt-ship-brotli-its-still-exposed-to-cve-2026-111497/ (extract) -> WebSearch (\"CVE-2026-111497 WordPress pingback xmlrpc libcurl Brotli denial of service\") -> corroboration: https://www.drweb.de/brotli-sicherheitsluecke-wordpress-pingback/"
    summary: |
      Facts (Patchstack, 2026-10-30). WordPress does not ship Brotli: it links whatever libbrotli the operating system provides through libcurl,
      and its cURL transport sets an empty CURLOPT_ENCODING on every handle, so a reply marked Content-Encoding: br is decoded inside curl_exec()
      before any PHP runs. The unauthenticated route is pingback.ping over xmlrpc.php, which a default install exposes (XML-RPC on, pingbacks
      open, at least one pingable post): the attacker names a source URL on a server they control, WordPress fetches it, and the malformed Brotli
      body makes the decoder write out of bounds in the worker. Plugin or theme code that fetches a visitor-supplied address with
      wp_remote_get() or wp_safe_remote_get() reaches the same decoder (the SSRF filter does not look at Content-Encoding), and oEmbed (Contributor
      or higher) and feed fetches (admin-configured) are further routes. Claims and limits (Patchstack): a lab demonstration of 2026-10-27 killed a
      worker or pinned it at 100% CPU with a payload under 100 bytes and its author says no code execution is included; public tooling for the
      WordPress path stops at the crash; working shells exist against stock Node.js and Bun binaries but no public chain targets PHP behind Apache or
      FPM. Fixing means a patched libbrotli (Brotli 1.0.10, 1.1.1 or 1.2.1, or the distribution package: Debian and Ubuntu backport the fix into
      1.1.0, so check the package revision, for example 1.1.0-2+b7 vulnerable and 1.1.0-2+deb13u1 patched on Debian 13); the official wordpress:latest
      image still installed a vulnerable libbrotli1 when Patchstack wrote, so a container needs the package upgraded in its own layer. Stop-gaps that
      do not fix the bug: a must-use plugin that sets CURLOPT_ENCODING to identity and disables libcurl content decoding on the http_api_curl hook
      (covers every route at once), unsetting the pingback methods through the xmlrpc_methods filter, or blocking xmlrpc.php at the web server; the
      common xmlrpc_enabled filter does not close pingback. A WAF cannot see the payload because it arrives in the response from the attacker's
      server.
      Context already in the store: CISA lists the flaw as exploited since 2026-10-27 (Node.js targets); Microsoft's record for the .NET copy was
      revised to version 5 on 2026-11-01 and still says Exploited: No.
    region_nexus: "global; WordPress sites run by cantonal and communal bodies and their hosting providers (Swiss hosters run official wordpress images and Debian/Ubuntu libbrotli) — no Swiss-specific source"
    primary_sector_nexus: "direct (web hosting of public-sector sites)"
    sector: "public-sector"
    cves: [CVE-2026-111497]
    techniques: [T1190, T1499.004]
    affected_products: ["WordPress Core", "Google Brotli", "libcurl"]
    entity_keys: ["product:wordpress-core", "product:google-brotli"]
    new_entities: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    evidence:
      - quote: "Researchers have working shells against stock Node.js and Bun binaries, and public proofs of concept are going around"
        attribution: "Patchstack"
        source_url: "https://patchstack.com/articles/wordpress-doesnt-ship-brotli-its-still-exposed-to-cve-2026-111497/"
      - quote: "PHP behind Apache or FPM is not that target, and no public chain aims at it yet."
        attribution: "Patchstack"
        source_url: "https://patchstack.com/articles/wordpress-doesnt-ship-brotli-its-still-exposed-to-cve-2026-111497/"
      - quote: "Its author is explicit that no code execution is included and that blind remote RCE is not established."
        attribution: "Patchstack"
        source_url: "https://patchstack.com/articles/wordpress-doesnt-ship-brotli-its-still-exposed-to-cve-2026-111497/"
      - quote: "Pulling the official image again won’t currently help you."
        attribution: "Patchstack"
        source_url: "https://patchstack.com/articles/wordpress-doesnt-ship-brotli-its-still-exposed-to-cve-2026-111497/"
    extended_notes: |
      Telemetry hooks: web access logs for POST requests to xmlrpc.php from outside whose body invokes pingback.ping (WordPress decodes XML
      character references and CDATA before dispatch, so a literal string match can miss variants, per Patchstack); outbound connections from the
      web host to unfamiliar servers right after such a request; web-server worker crash and restart events. Benign lookalike (inference, no
      source states a discriminator): real pingbacks also cause an outbound fetch from the site, so the discriminating signal is the crash of the
      worker that handled the request. Single first-hand source (Patchstack); drweb.de restates it. The Node.js/PyPI entry's own scope is the
      Node2Shell chain, so this is a new exposed surface (PHP applications that fetch remote URLs through a Brotli-enabled libcurl).
    borderline: false

