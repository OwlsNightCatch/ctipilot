    summary: |
      Facts. AWS Security Bulletin 2026-160-AWS (published 2026-10-30, updated 2026-11-02 15:00 PST) states fixed Amazon Linux 2 and 2023 kernel
      packages are available (kernel 4.14, 5.4, 5.10, 5.15, 6.1, 6.12 and 6.18; an AL2023 instance locked to a release needs 2023.12.20261102 or
      later), EKS-optimized AL2023 AMIs v20261031 or later, ECS-optimized AMI 20261031, Fargate tasks and EKS Fargate pods launched after
      2026-11-01 17:00 UTC on the patched platform, Bottlerocket AMIs expected from 2026-11-02, a Redshift OS patch on 2026-11-02, an RDS and
      Aurora OS patch on 2026-11-03 with mitigations already deployed, Storage Gateway expected from 2026-11-03 and GameLift AMIs expected by
      2026-11-04. AWS says services that pass client TCP packets with IP options straight to targets still need target patching: Network Load
      Balancer TCP listeners, Global Accelerator endpoints, PrivateLink endpoint services and VPC Lattice layer-4 targets; ALB, CLB, NLB TLS
      listeners, CloudFront, API Gateway and WAF are being patched by AWS, with the instances behind them to follow within 30 days. Lambda is
      not affected. AWS says it has no evidence the flaw has been leveraged, calls a kernel update and reboot the only complete remediation, and
      lists two interim measures that reduce but do not remove the exposure: disabling MPTCP (net.mptcp.enabled=0, GODEBUG=multipathtcp=0 for
      Go 1.24 or later builds) and dropping IPv4 packets whose header carries IP options (host firewall, or an AWS Network Firewall stateful
      rule that needs strict rule order). Fortinet's FG-IR-26-188 (initial publication 2026-11-02) says it is investigating and lists 59 product
      names as under investigation, among them FortiOS, FortiProxy, FortiManager, FortiAnalyzer, FortiWeb, FortiADC, FortiMail, FortiSIEM,
      FortiNAC, FortiAuthenticator, FortiClient EMS, FortiSandbox and FortiSOAR; no fixed build and no workaround is named. CloudLinux (updated
      2026-11-02 21:10 UTC) says its kernel team could not reproduce Anthropic's remote-root claim, that MPTCP is off by default on CloudLinux 8,
      9 and 10 but the bug sits in ordinary TCP so every affected server needs the fix, and that fixed kernels are in staged rollout for 7h, 8 and
      the LTS lines with KernelCare livepatches on the main feed for 7h, 8 and 9. Ubuntu's tracker, as read 2026-11-03, still shows last updated
      2026-10-30 with fixes in progress for 22.04 to 26.10; Debian trixie security now carries 6.12.115-2.
      Claims. The remote-root exploit remains Anthropic's own claim (no second party has reproduced it; CloudLinux says its team failed to).
      Assessment (mine). The practical delta for a constituency on AWS or on Fortinet gear is the vendor status: no Fortinet fix exists yet.
