items:
  - title: "Rhysida ransomware claims data exfiltration from Landeshauptstadt Stuttgart (German state capital) — 5 BTC demand, city denies incident"
    sources:
      - url: "https://www.heise.de/en/news/Cyber-gang-Rhysida-claims-data-theft-from-Stuttgart-city-11301876.html"
        publisher: "Heise Online (EN)"
        date: "2026-05-21"
        role: "primary"
      - url: "https://www.dexpose.io/rhysida-ransomware-targets-landeshauptstadt-stuttgart/"
        publisher: "DeXpose"
        date: "2026-05-20"
        role: "corroborating"
    discovery_trace: "first seen at: WebSearch ('Germany DACH ransomware government public sector May 23 2026') → primary: Heise Online EN, URL https://www.heise.de/en/news/Cyber-gang-Rhysida-claims-data-theft-from-Stuttgart-city-11301876.html → corroborating: DeXpose, URL https://www.dexpose.io/rhysida-ransomware-targets-landeshauptstadt-stuttgart/"
    summary: |
      On 2026-05-19, the Rhysida ransomware group listed Landeshauptstadt Stuttgart
      (stuttgart.de) — the capital city of Baden-Württemberg, Germany, with ~600,000
      residents — on its dark-web leak site, demanding 5 Bitcoin (~€333,000) for
      exclusive access to allegedly stolen documents. The dark-web listing showed
      heavily downscaled preview images of scanned invoices, photographed documents,
      and faxes attributed to Stuttgart's administrative systems. Stuttgart issued a
      measured response stating the "published information is currently being examined
      together with the responsible authorities" and that it "has no indications of a
      cyber incident at this time," while declining further comment due to ongoing
      investigation. The attack appears to have been data exfiltration only, with no
      evidence of encryption of operational systems — the city's website and communications
      remained functional. No vulnerability or initial access vector was disclosed.
      Rhysida is a financially motivated ransomware-as-a-service (RaaS) operation
      active since May 2023, previously striking the British Library (2023) and German
      charity Welthungerhilfe (2025), and known for implementation errors that enabled
      free decryption tools for some victims. For defenders: hunt for Rhysida TTPs
      including initial access via phishing or VPN exploitation (T1566, T1133), living-off-
      the-land execution using cmd.exe or PowerShell, and data staging in unusual
      directories before exfiltration (T1074.001). No patch action applicable — detection
      focus is on anomalous data movement from file servers and DFS shares.
    ch_eu_nexus: "Germany (EU) — state-capital municipal government victim; direct"
    public_sector_nexus: "direct — Landeshauptstadt Stuttgart is public sector"
    sector: "government, municipal"
    cves: []
    actors_campaigns_malware: ["Rhysida"]
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "Rhysida has demanded 5 Bitcoin for exclusive data ownership. The state capital of Stuttgart has no indications of a cyber incident"
        attribution: "Heise Online (EN)"
        source_url: "https://www.heise.de/en/news/Cyber-gang-Rhysida-claims-data-theft-from-Stuttgart-city-11301876.html"
    extended_notes: |
      Confidence is MEDIUM because Stuttgart denies any confirmed incident and no official
      investigation outcome has been published. The claim is from the ransomware group's
      own leak site, corroborated only by press coverage of the leak-site listing.
      Prior Rhysida note: South Korean researchers released a free decryption tool in 2024
      that exploited a flaw in Rhysida's encryption implementation. No current decryptor
      is known for 2026 variants.

  - title: "Drupal core CVE-2026-9082 actively exploited (KEV-listed 2026-05-22) — PostgreSQL-backend unauthenticated SQL injection reaching privilege escalation / RCE; EU/CH government and university CMS deployments at risk"
    sources:
      - url: "https://www.drupal.org/sa-core-2026-004"
        publisher: "Drupal.org PSIRT"
        date: "2026-05-22"
        role: "primary"
      - url: "https://thehackernews.com/2026/05/highly-critical-drupal-core-flaw.html"
        publisher: "The Hacker News"
        date: "2026-05-20"
        role: "corroborating"
      - url: "https://security-hub.ncsc.admin.ch/#/posts/12584"
        publisher: "NCSC.ch Security Hub"
        date: "2026-05-22"
        role: "corroborating"
    discovery_trace: "first seen at: NCSC.ch Security Hub (bridge ncsc-csh recent 10), URL https://security-hub.ncsc.admin.ch/#/posts/12584 — post 12584 updated 2026-05-22 to add active-exploitation status → primary: Drupal.org SA-CORE-2026-004, URL https://www.drupal.org/sa-core-2026-004 → corroborating: THN URL https://thehackernews.com/2026/05/highly-critical-drupal-core-flaw.html"
    summary: |
      Drupal released SA-CORE-2026-004 on 2026-05-20 for CVE-2026-9082 — a highly critical
      SQL injection in Drupal core's database abstraction API, specifically in the PostgreSQL
      EntityQuery condition handler. On 2026-05-22, Drupal updated the advisory to confirm
      "exploit attempts are now being detected in the wild," and CISA added the CVE to its
      Known Exploited Vulnerabilities (KEV) catalog the same day. The vulnerability is
      reachable without authentication — no login, no role required — by sending specially
      crafted requests that bypass query sanitisation in the PostgreSQL query-building path.
      Scope: sites using MySQL, MariaDB, or SQLite backends are NOT affected. PostgreSQL is
      the preferred database for production Drupal deployments in German federal
      infrastructure (FITKO), Swiss SWITCH-hosted university sites, French gouvernement.fr
      CMS instances, and European Commission Drupal deployments. Successful exploitation
      enables information disclosure and data modification; in some configurations (RPC
      procedures enabled or SUPERUSER grants on schema) it can reach privilege escalation
      and remote code execution. Affected versions: Drupal 8.9.0 through 10.x and 11.x
      below the patched releases (see SA-CORE-2026-004 for exact build numbers). Patch:
      update to Drupal 10.4.5 / 11.1.5 or later. Defender telemetry: web-server access
      logs showing anomalous SQL-like strings in EntityQuery parameters (unusual %{query}
      arguments in GET/POST to node, user, or custom entity endpoints), WAF rules targeting
      PostgreSQL-specific injection patterns (e.g. `$$`, `COPY TO/FROM PROGRAM`,
      `pg_sleep`, UNION SELECT fragments). MITRE: T1190 Exploit Public-Facing Application.
    ch_eu_nexus: "EU-wide and CH; Drupal is the dominant CMS in EU and Swiss government, higher-education, and news portals"
    public_sector_nexus: "direct — EU and CH public-sector websites heavily rely on Drupal with PostgreSQL"
    sector: "government, education, public-sector IT"
    cves: [CVE-2026-9082]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "The risk score has been updated to reflect that exploit attempts are now being detected in the wild"
        attribution: "Drupal.org PSIRT (SA-CORE-2026-004 update, 2026-05-22)"
        source_url: "https://www.drupal.org/sa-core-2026-004"
      - quote: "Current exploitation status: Actively exploited"
        attribution: "NCSC.ch Security Hub post 12584 (updated 2026-05-22)"
        source_url: "https://security-hub.ncsc.admin.ch/#/posts/12584"
    extended_notes: |
      CISA KEV listing triggers BOD 22-01 remediation deadlines for US federal agencies;
      EU NIS2 entities are subject to equivalent national-authority patch-timeline requirements.
      Detection notes: The PostgreSQL driver in Drupal uses parameterised queries for most
      paths, but the EntityQuery condition handler was found to allow injection through
      compound condition grouping — specifically, malformed array-type conditions in the
      condition() or conditionGroup() API. Defenders running Drupal on PostgreSQL should
      enable query logging (log_min_duration_statement) to surface anomalous query shapes.

  - title: "SPIP CMS < 4.4.15: security policy bypass (CERTFR-2026-AVI-0635, 2026-05-22) — French public administration CMS with broad EU government deployment"
    sources:
      - url: "https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-0635/"
        publisher: "ANSSI / CERT-FR"
        date: "2026-05-22"
        role: "primary"
      - url: "https://blog.spip.net/Mise-a-jour-de-securite-sortie-de-SPIP-4-4-15.html"
        publisher: "SPIP blog"
        date: "2026-05-22"
        role: "corroborating"
    discovery_trace: "first seen at: WebSearch ('ANSSI France CERTFR advisory alert May 22 2026') → primary: CERT-FR CERTFR-2026-AVI-0635, URL https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-0635/ → corroborating: SPIP vendor blog, URL https://blog.spip.net/Mise-a-jour-de-securite-sortie-de-SPIP-4-4-15.html"
    summary: |
      ANSSI / CERT-FR published CERTFR-2026-AVI-0635 on 2026-05-22 covering a security
      policy bypass vulnerability in SPIP versions prior to 4.4.15. SPIP (Système de
      Publication pour l'Internet) is a French-origin open-source CMS used by a very large
      fraction of French public administration websites, including préfectures, ministries,
      and research institutions, as well as EU-level French-language portals and Francophone
      government sites in Belgium, Switzerland, and Canada. The fix is in SPIP 4.4.15,
      released 2026-05-22. No CVE identifier or CVSS score was published alongside the
      CERT-FR advisory; the vendor bulletin references the SPIP security blog directly.
      No exploitation in the wild was reported at time of advisory. Attack surface: any
      publicly accessible SPIP installation running < 4.4.15. The "security policy bypass"
      classification in CERT-FR terminology typically covers authentication/authorisation
      control bypasses or access-control-list circumvention without requiring further
      chaining. Defenders running SPIP should patch to 4.4.15 immediately given CERT-FR's
      involvement and SPIP's large footprint in French public administration. Detection:
      review SPIP-generated access logs for unexpected privileged endpoint access.
      MITRE mapping: T1548 Abuse Elevation Control Mechanism or T1078 Valid Accounts
      depending on final CVE analysis (pending NVD record).
    ch_eu_nexus: "France (primary), Belgium, Switzerland (FR-language public sector), broader EU"
    public_sector_nexus: "direct — SPIP is the predominant CMS for French public administration websites"
    sector: "government, education, public-sector IT"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Une vulnérabilité a été découverte dans SPIP. Elle permet à un attaquant de provoquer un contournement de la politique de sécurité. SPIP versions antérieures à 4.4.15 sont affectées."
        attribution: "ANSSI / CERT-FR — CERTFR-2026-AVI-0635 (2026-05-22)"
        source_url: "https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-0635/"
    extended_notes: |
      English gloss: "A vulnerability was discovered in SPIP. It allows an attacker to
      cause a security policy bypass. Versions prior to 4.4.15 are affected."
      SPIP 4.4.14 (released 2026-05-12, CERTFR-2026-AVI-0564) had already addressed
      multiple RCE flaws; this is a separate issue patched in the follow-on 4.4.15 release.
      Swiss cantonal and communal administrations using SPIP for their public portals should
      treat this advisory as urgent given the 24-hour NCSC.ch reporting requirement now in
      force for critical infrastructure operators.

  - title: "Germany proposes \"Cyber-Dome\" active cyber defence law — BSI and BKA to gain hackback / threat-hunting / infrastructure-destruction powers; cabinet push by Interior Minister Dobrindt"
    sources:
      - url: "https://www.thestar.com.my/tech/tech-news/2026/05/13/germany-plans-039active-cyberdefence039-as-online-attacks-rise"
        publisher: "The Star (AFP wire, 2026-05-13)"
        date: "2026-05-13"
        role: "primary"
      - url: "https://www.heise.de/en/news/Cyber-Dome-with-blind-spots-What-the-goverment-s-plans-leaves-open-11206462.html"
        publisher: "Heise Online (EN)"
        date: "2026-05-12"
        role: "corroborating"
    discovery_trace: "first seen at: WebSearch ('Germany active cyberdefence BSI law Dobrindt cabinet 2026') → primary: AFP/The Star, URL https://www.thestar.com.my/tech/tech-news/2026/05/13/germany-plans-039active-cyberdefence039-as-online-attacks-rise (fetched via WebFetch) → corroborating: Heise 'Cyber-Dome with blind spots', URL https://www.heise.de/en/news/Cyber-Dome-with-blind-spots-What-the-goverment-s-plans-leaves-open-11206462.html"
    summary: |
      German Interior Minister Alexander Dobrindt announced on 2026-05-12 that his ministry
      would push a new "Gesetz zur Stärkung der Cybersicherheit" (Cyber-Security Strengthening
      Act) through cabinet "this month" (May 2026). The proposed law would amend the core
      mandates of the Federal Office for Information Security (BSI), Federal Criminal Police
      Office (BKA), and Federal Police (BPol) to enable: (a) BSI "threat hunting" — active
      scanning and infiltration of attacker infrastructure detected inside or targeting
      German networks; (b) hackback capabilities — redirecting attack traffic, shutting down
      foreign servers, and in serious cases deleting or altering data on foreign systems;
      (c) data traffic redirection and selective internet routing control. The initiative is
      explicitly motivated by a "significant increase in activism originating from Russia"
      and ransomware, with 334,000 cybercrime cases registered in Germany in 2025 causing
      >€200B economic damage. Critics note the risk of collateral damage, misattribution,
      and that the law creates significant BSI scope expansion beyond its traditional CERT
      and certification remit. The law would be the most expansive German cyber-offensive
      legislation since the NIS2UmsuCG transposition (already covered). EU-level implications:
      no equivalent EU framework for hackbacks exists; Germany acting unilaterally could
      create legal tension with EU network neutrality rules and establish precedent for
      other member states. Operational signal for defenders: the announcement signals that
      German federal network monitoring posture will intensify — private-sector entities
      in Germany with government contracts should expect heightened scrutiny of network
      egress and potential coordinated response exercises.
    ch_eu_nexus: "Germany (EU) — policy with EU-wide precedent implications"
    public_sector_nexus: "direct — governs BSI, BKA, BPol and critical infrastructure oversight"
    sector: "government, critical infrastructure, telco"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Interior Minister Alexander Dobrindt said he would push a new law through cabinet this month to allow security services to retaliate against servers used in attacks, with the goal to 'disrupt and destroy the attackers' infrastructure'"
        attribution: "AFP wire / The Star (2026-05-13)"
        source_url: "https://www.thestar.com.my/tech/tech-news/2026/05/13/germany-plans-039active-cyberdefence039-as-online-attacks-rise"
    extended_notes: |
      Note on recency: The Dobrindt announcement was made 2026-05-12, which is outside
      the strict 36-hour window for a new item. However, no material legislative update
      (cabinet vote outcome, final text publication) was found in-window that would
      constitute a clean delta. The item is included as a policy-awareness item given
      its direct relevance to BSI's operational posture and NIS2 enforcement context —
      the main agent should consider routing this to § 3 (Policy & Regulation) and
      assessing whether it constitutes a duplicate of prior coverage. Mark as MEDIUM
      confidence if the main agent determines it was already covered.

