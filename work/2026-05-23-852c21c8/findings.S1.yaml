  - title: "Rapid7 Q1 2026 Threat Landscape Report — vulnerability exploitation overtakes social engineering (38% vs 24%); half of exploited vulns zero-click; KEV median time drops to 5 days"
    sources:
      - url: "https://www.rapid7.com/blog/post/tr-q1-2026-threat-landscape-report-geopolitics-ransomware/"
        publisher: "Rapid7 Labs"
        date: "2026-05-21"
        role: "primary"
      - url: "https://www.globenewswire.com/news-release/2026/05/21/3299378/36514/en/Rapid7-Q1-2026-Threat-Landscape-Report-Finds-Vulnerability-Exploitation-Overtakes-Social-Engineering-as-the-Top-Initial-Access-Vector.html"
        publisher: "GlobeNewswire"
        date: "2026-05-21"
        role: "corroborating"
    discovery_trace: "first seen at: WebSearch 'Rapid7 Q1 2026 threat landscape report vulnerability exploitation' → primary https://www.rapid7.com/blog/post/tr-q1-2026-threat-landscape-report-geopolitics-ransomware/ → corroborating press release https://www.globenewswire.com/news-release/2026/05/21/3299378/36514/en/Rapid7-Q1-2026-Threat-Landscape-Report-Finds-Vulnerability-Exploitation-Overtakes-Social-Engineering-as-the-Top-Initial-Access-Vector.html"
    summary: |
      Rapid7 Labs published the Q1 2026 Threat Landscape Report on 2026-05-21, covering incident response data for January–March 2026. Key findings with operational relevance: (1) Vulnerability exploitation accounted for 38% of confirmed initial access vectors — first time it has surpassed social engineering (24%) in Rapid7's dataset; (2) Over 50% of actively exploited vulnerabilities were zero-click, network-facing flaws requiring no authentication or user interaction — validating the prioritisation of perimeter/edge devices; (3) The median time from public vulnerability disclosure to CISA KEV addition fell from 8.5 days to 5.0 days in Q1 2026, reflecting faster attacker operationalisation of N-day exploits likely assisted by AI-driven weaponisation; (4) Exploited vulnerabilities averaged 1.8 million mentions across forums/blogs/social media before operational targeting, suggesting public discussion spikes are a leading indicator for imminent exploitation waves; (5) SQL injection emerged as the most-exploited vulnerability class in Q1; (6) Remote Monitoring and Management (RMM) tool abuse represented 22.9% of observed threat activity (ClickFix: 18.8%); (7) Ransomware fragmentation continues: Qilin led at 357 posts, followed by The Gentlemen (206) and Akira (174); (8) Pure-extortion tactics (data theft without encryption) are increasing, reducing detection time for defenders relying on encryption as a tripwire. Geopolitical component: Iranian state-aligned groups targeted government/financial/industrial infrastructure; Russian and Chinese campaigns focused on persistent access and intelligence collection; cyber activity synchronised with military escalation in the Middle East. Iranian and Russian groups' tools mentioned: BPFDoor (Linux persistent backdoor), ModeloRAT.
    ch_eu_nexus: "The 5-day disclosure-to-exploitation window directly impacts Swiss federal and cantonal IT patch-management SLAs. EU/CH public-sector environments running perimeter appliances (SD-WAN, VPN, firewalls) face the highest risk given the zero-click/network-facing bias in exploited flaws. The ClickFix 18.8% figure (LotL via browser-based social engineering) is particularly relevant for EU environments where browser-based drive-by is constrained by group policy."
