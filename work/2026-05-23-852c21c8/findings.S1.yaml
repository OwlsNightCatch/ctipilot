        date: "2026-05-22"
        role: "corroborating"
    discovery_trace: "first seen at: TheHackersNews RSS feed item published Fri, 22 May 2026 14:20:18 +0530, URL https://thehackernews.com/2026/05/kimwolf-ddos-botnet-operator-arrested.html → pivot: KrebsOnSecurity primary https://krebsonsecurity.com/2026/05/alleged-kimwolf-botmaster-dort-arrested-charged-in-u-s-and-canada/ → corroborating: The Record https://therecord.media/canadian-man-arrested-charged-running-kimwolf-botnet"
    summary: |
      On 2026-05-19, Ontario Provincial Police arrested Jacob Butler, 23, of Ottawa, Canada — alias "Dort" — on a U.S. extradition warrant. The U.S. DoJ announced the arrest on 2026-05-22. Butler is alleged to have developed and operated Kimwolf, a DDoS-for-hire botnet assessed as a variant of AISURU (the IoT botnet behind several record-setting volumetric attacks). Kimwolf infected millions of devices — primarily "firewalled" consumer IoT including digital photo frames and webcams — by exploiting default or weak credentials and known public vulnerabilities. The botnet issued more than 25,000 DDoS commands and peaked at nearly 30–31.4 Terabits per second (Tbps). Targets included U.S. DoD address ranges, causing losses exceeding $1 million in at least one case. The Kimwolf C2 infrastructure was seized 2026-03-19 alongside three competing botnets (AISURU, JackSkid, Mossad) in a coordinated multi-agency operation. Butler additionally conducted swatting attacks against security researcher Ben Brundage (Synthient) who had helped identify a Kimwolf-exploited vulnerability. Butler faces U.S. charges of aiding and abetting computer intrusion (max 10 years), and Canadian charges of unauthorized computer access, possession of unauthorized access devices, and computer mischief. Defender significance: Kimwolf's architecture of exploiting IoT devices as amplification infrastructure is consistent with BPFDoor-style persistent access on compromised routers/cameras as a DDoS pivot. Swiss and EU critical infrastructure operators using internet-facing IoT devices should verify patching and default-credential hygiene; DDoS-for-hire services advertised on criminal forums should be monitored for new operators filling the Kimwolf/AISURU void.
    ch_eu_nexus: "DDoS-for-hire services operating under Kimwolf's CaaS model historically targeted any paying customer's target. Post-arrest market reorganisation may trigger competing services advertising EU/CH targets. The AISURU/Kimwolf infrastructure seizure of 2026-03-19 also involved Germany as a partner nation."
