  - title: "CVE-2026-46333 (ssh-keysign-pwn) — 9-year-old Linux kernel ptrace race enables local root, SSH host key exfiltration on default major distros; public exploits circulating"
    sources:
      - url: "https://blog.qualys.com/vulnerabilities-threat-research/2026/05/20/cve-2026-46333-local-root-privilege-escalation-and-credential-disclosure-in-the-linux-kernel-ptrace-path"
        publisher: "Qualys TRU"
        date: "2026-05-20"
        role: "primary"
      - url: "https://thehackernews.com/2026/05/9-year-old-linux-kernel-flaw-enables.html"
        publisher: "The Hacker News"
        date: "2026-05-21"
        role: "corroborating"
      - url: "https://ubuntu.com/blog/ssh-keysign-pwn-linux-vulnerability-fixes-available"
        publisher: "Canonical / Ubuntu"
        date: "2026-05-15"
        role: "corroborating"
    discovery_trace: "first seen at: TheHackersNews RSS feed item published Thu, 21 May 2026 13:05:53 +0530, URL https://thehackernews.com/2026/05/9-year-old-linux-kernel-flaw-enables.html → pivot: Qualys TRU primary advisory https://blog.qualys.com/vulnerabilities-threat-research/2026/05/20/cve-2026-46333-local-root-privilege-escalation-and-credential-disclosure-in-the-linux-kernel-ptrace-path → corroborating: Ubuntu blog https://ubuntu.com/blog/ssh-keysign-pwn-linux-vulnerability-fixes-available"
    summary: |
      Qualys TRU discovered CVE-2026-46333, a logic error in the Linux kernel's `__ptrace_may_access()` function in `kernel/ptrace.c` present since kernel v4.10-rc1 (November 2016). The flaw arises from a TOCTOU race condition: during the brief window when a privileged process drops credentials (e.g., `setuid` to lower privilege), `__ptrace_may_access()` incorrectly permits ptrace attachment to the process before the dumpable flag is re-evaluated, because credential comparison occurs against the uid/gid at the time of the `ptrace_may_access()` call rather than at the point of the access. By combining this race with `pidfd_getfd()` (available since v5.6-rc1, January 2020), an unprivileged attacker can duplicate file descriptors from privileged processes and reuse them under their own UID. Qualys developed four working proof-of-concept exploits — all public — targeting: `chage` (setuid-root/setgid-shadow) → reads `/etc/shadow`; `ssh-keysign` (setuid-root) → exfiltrates SSH host private keys from `/etc/ssh/`; `pkexec` (setuid-root) → arbitrary root command execution; `accounts-daemon` (root daemon) → arbitrary root command execution. Exploits confirmed working on Debian 13, Ubuntu 24.04/26.04, Fedora 43/44. Prerequisites: local unprivileged shell on a vulnerable host. No network exposure required. MITRE ATT&CK: T1068 (Exploitation for Privilege Escalation), T1552.004 (Private Keys — SSH host key theft). Kernel patches upstream on 2026-05-14; distribution vendor packages available from Debian, Fedora, Red Hat, SUSE, AlmaLinux, CloudLinux. Interim mitigation: `sysctl kernel.yama.ptrace_scope=2` (restricts ptrace to CAP_SYS_PTRACE only, breaks some debuggers). Detection: Qualys QID 387392 for scanner detection; EDR hunt for `pidfd_getfd` syscall paired with `ptrace` calls from non-root processes; anomalous `/etc/shadow` reads from non-root processes; unusual access to `/etc/ssh/ssh_host_*_key` files by non-sshd processes.
    ch_eu_nexus: "Affects all major Linux distributions used in EU/CH public-sector infrastructure: Ubuntu (widely deployed in Swiss federal IT per NCSC-CH guidance), Debian (base for many containers), Red Hat/ALMA (enterprise deployments). Container runtime environments where multi-tenant or lower-privilege workloads run on shared kernel hosts face elevated risk."
    public_sector_nexus: "direct — Linux kernel flaw affecting all Linux servers in public-sector environments"
    sector: "all-sectors, cloud, government, healthcare"
