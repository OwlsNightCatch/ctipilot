    discovery_trace: "first seen at: cisa-kev bridge, catalogVersion 2026.05.22 → CVE-2026-9082 dateAdded=2026-05-22 → BleepingComputer article URL https://www.bleepingcomputer.com/news/security/drupal-critical-sql-injection-flaw-now-targeted-in-attacks/ → NCSC-CH Security Hub post 12584 updated 2026-05-22T13:52 → primary: Drupal SA-CORE-2026-004 https://www.drupal.org/sa-core-2026-004"
    summary: |
      On 2026-05-22, CISA added CVE-2026-9082 to the KEV catalog with a 2026-05-27 federal remediation deadline, citing confirmed in-the-wild exploitation. Drupal simultaneously updated SA-CORE-2026-004 to confirm "exploit attempts are now being detected in the wild." Imperva reported observing more than 15,000 exploitation attempts targeting approximately 6,000 sites across 65 countries within days of disclosure. The vulnerability is a SQL injection (CWE-89) in Drupal's database abstraction API, specifically the `Drupal\Core\Database\Connection::prepareStatement()` path used when PostgreSQL is the database backend. An unauthenticated, remote attacker can send a specially crafted HTTP request that causes the PostgreSQL-specific placeholder-escaping logic to misinterpret SQL metacharacters as query structure, leading to arbitrary SQL execution. Depending on the application and database permissions, impact ranges from information disclosure to full RCE via stacked queries. The flaw was independently discovered by Google/Mandiant researcher Michael Maturi and disclosed via coordinated embargo. Drupal classified the severity at 23/25 (Highly Critical); NIST assigned CVSS 3.1 score 6.5 (the gap reflects Drupal's broader risk framing for CMS-wide impact). Patches shipped 2026-05-20 in Drupal 10.5.x, 10.6.x, and 11.x branches; Drupal 10.4.x and 8.9.x (EOL) also received fixes. Non-PostgreSQL (MySQL/MariaDB/SQLite) deployments are unaffected. Detection focus: Web server access logs for anomalous POST/GET requests to `/?q=user/password` and similar Drupal paths with SQL metacharacter sequences; WAF telemetry for `UNION SELECT`, single-quote injection patterns; Drupal watchdog logs (`\Drupal\Core\Database\DatabaseExceptionWrapper`). Hardening: upgrade to patched branch; if PostgreSQL, verify `pg_connect` string quoting config; enable WAF rules for SQLi patterns. NCSC-CH Security Hub post 12584 updated 2026-05-22 to "Actively exploited" status.
    ch_eu_nexus: "Multiple EU government and education institutions run Drupal (GÉANT, cantonal portals, municipal CMS deployments). NCSC-CH Security Hub flagged this with active-exploitation status on 2026-05-22. PostgreSQL-backed Drupal deployments (common in Swiss federal IT) are the primary target surface."
