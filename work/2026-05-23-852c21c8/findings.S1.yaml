  - title: "Ghostwriter (UAC-0057/FrostyNeighbor) Prometheus phishing deploys OYSTERFRESH/OYSTERBLUES/OYSTERSHUCK against Ukrainian government — new implant chain disclosed by CERT-UA"
    sources:
      - url: "https://thehackernews.com/2026/05/ghostwriter-targets-ukraine-government.html"
        publisher: "The Hacker News"
        date: "2026-05-22"
        role: "primary"
      - url: "https://www.scworld.com/brief/belarus-linked-ghostwriter-group-targets-ukraine-using-prometheus-learning-platform-lures"
        publisher: "SC World"
        date: "2026-05-22"
        role: "corroborating"
    discovery_trace: "first seen at: TheHackersNews RSS feed item published Fri, 22 May 2026 21:50:32 +0530, URL https://thehackernews.com/2026/05/ghostwriter-targets-ukraine-government.html → WebSearch for CERT-UA source advisory → CERT-UA SPA (cert.gov.ua) not machine-readable via bridge; primary narration from THN citing CERT-UA; SC World corroborating https://www.scworld.com/brief/belarus-linked-ghostwriter-group-targets-ukraine-using-prometheus-learning-platform-lures"
    summary: |
      CERT-UA reported (CERT-UA#10340) a spring-2026 phishing campaign by Ghostwriter (aka UAC-0057, UNC1151, FrostyNeighbor, Storm-0257, Umbral Bison) targeting Ukrainian government entities using lures themed around the Prometheus online learning platform. The attack chain: phishing email from compromised account → PDF attachment containing link to ZIP archive → ZIP contains a JavaScript file (OYSTERFRESH). OYSTERFRESH (T1027 — Obfuscated Files/Information) serves a decoy document as distraction while writing obfuscated and RC4-encrypted OYSTERBLUES payload to the Windows Registry (T1547.001 — Registry Run Keys/Startup Folder) and launching OYSTERSHUCK. OYSTERSHUCK decodes OYSTERBLUES (T1059.007 — JavaScript) which collects: computer name, user account name, OS version, last boot time, and running process list; exfiltrates via HTTP POST to C2 servers; and executes dynamically received JavaScript via `eval()` (T1059.007 further). Final payload assessed as Cobalt Strike (T1219 — Remote Access Software). The campaign represents a new implant trio distinct from Ghostwriter's prior PicassoLoader toolset. No CVEs exploited — initial access is purely social-engineering. MITRE ATT&CK: T1566.001 (Spearphishing Attachment), T1059.007 (JavaScript), T1027 (Obfuscated Files), T1547.001 (Registry Persistence), T1082 (System Information Discovery), T1041 (Exfiltration Over C2 Channel). Detection: block `wscript.exe` execution for standard user accounts (recommended by CERT-UA); EDR alert on `wscript.exe` spawning `powershell.exe` or any Base64-encoded command; registry monitoring for new HKCU\Software run-key entries containing binary blobs or script paths; hunt for Cobalt Strike beacon signatures in HTTP POST traffic. This represents a distinct campaign from the W21-weekly-covered FrostyNeighbor/GhostWriter activities through 2026-05-16.
    ch_eu_nexus: "Ghostwriter historically targets NATO/EU member states (Belgium, Germany, Poland, Lithuania, Latvia) alongside Ukraine. EU government entities and think-tanks focusing on Eastern Europe policy are within campaign profile. The new OYSTER* implant chain is an operational toolset change relative to prior PicassoLoader campaigns."
    public_sector_nexus: "direct — Ukrainian government primary target; EU government entities secondary per historical Ghostwriter targeting patterns"
    sector: "government, defense, education"
    cves: []
    actors_campaigns_malware: ["Ghostwriter", "UAC-0057", "UNC1151", "FrostyNeighbor", "OYSTERFRESH", "OYSTERBLUES", "OYSTERSHUCK", "Cobalt Strike"]
    verification: MULTI-SOURCE
