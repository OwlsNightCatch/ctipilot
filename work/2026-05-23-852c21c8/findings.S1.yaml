  - title: "Megalodon mass GitHub CI/CD backdoor — 5,561 repos poisoned in 6 hours via forged GitHub Actions workflows exfiltrating cloud credentials and OIDC tokens"
    sources:
      - url: "https://thehackernews.com/2026/05/megalodon-github-attack-targets-5561.html"
        publisher: "The Hacker News"
        date: "2026-05-22"
        role: "primary"
      - url: "https://safedep.io/megalodon-mass-github-repo-backdooring-ci-workflows/"
        publisher: "SafeDep"
        date: "2026-05-22"
        role: "primary"
      - url: "https://www.ox.security/blog/megalodon-cicd-malware-github/"
        publisher: "OX Security"
        date: "2026-05-21"
        role: "corroborating"
    discovery_trace: "first seen at: TheHackersNews RSS feed item published Fri, 22 May 2026 17:25:24 +0530, URL https://thehackernews.com/2026/05/megalodon-github-attack-targets-5561.html → pivot: SafeDep primary research report https://safedep.io/megalodon-mass-github-repo-backdooring-ci-workflows/ → corroborating: OX Security analysis https://www.ox.security/blog/megalodon-cicd-malware-github/"
    summary: |
      Between 11:36 and 17:48 UTC on 2026-05-18, an automated attacker pushed 5,718 malicious commits to 5,561 distinct GitHub repositories using throwaway accounts with forged committer identities ("build-bot", "auto-ci", "ci-bot", "pipeline-bot") and hardcoded timestamp 2001-09-17. Two GitHub Actions workflow YAML variants were injected: (1) SysDiag — triggered on every push and pull_request event (T1059.004 — Unix Shell via CI Runner), maximising execution frequency in active repos; (2) Optimize-Build — replaced existing workflows with workflow_dispatch triggers, creating dormant backdoors activatable on-demand via the GitHub REST API (T1546 — Event Triggered Execution). Both variants contain a 111-line Base64-encoded bash payload. On execution the payload harvests: all CI environment variables and /proc/*/environ entries; AWS credentials across configured profiles and IMDSv2 metadata endpoint; GCP access tokens via `gcloud auth print-access-token` and IMDS; Azure IMDS tokens; SSH private keys from ~/.ssh/; Docker config files, .npmrc, .netrc, Kubernetes configs, Vault tokens, Terraform credentials; GitHub Actions OIDC tokens (T1552.004 — Private Keys; T1078.004 — Cloud Accounts). The npm package @tiledesk/tiledesk-server versions 2.18.6–2.18.12 carried the Optimize-Build variant after the maintainer's GitHub repo was compromised. Public disclosure by SafeDep on 2026-05-22, OX Security published 2026-05-21. No formal attribution beyond contextual linkage to the broader post-TeamPCP GitHub environment; SafeDep's Malysis engine flagged the tiledesk-server compromise. Detection: audit GitHub Actions YAML files for base64-encoded payload strings matching `Q0I9Imh0dHA6Ly8yMTYu`; hunt for outbound POST to 216.126.225.129:8443 from CI/CD runners; review runner process trees for `aws configure list-profiles`, `gcloud auth print-access-token`, `curl http://169.254.169.254` calls outside expected infra tests. Hardening: enforce `workflow_dispatch` requires approval for untrusted branches (GitHub Actions approvals gate); require CODEOWNERS review for `.github/workflows/`; adopt Trusted Publishing (OIDC) to eliminate long-lived tokens; pin action references to SHA commits not branch tags.
    ch_eu_nexus: "Any GitHub-hosted project using GitHub Actions is affected regardless of geography. EU/CH government and research organisations running internal forks or contributing to open-source repositories are at exposure risk for cloud credential exfiltration."
    public_sector_nexus: "indirect — via CI/CD toolchain compromise of any downstream consumer"
    sector: "technology, software-supply-chain, cloud"
