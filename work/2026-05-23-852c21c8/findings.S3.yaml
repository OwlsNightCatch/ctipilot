      The report is framed as the March-April 2026 instalment of CPR's rolling AI Threat Landscape Digest series. The Mexico government breach is the most technically documented case; the Gambit Security primary report (linked from CPR) includes the full technical narrative. The report also covers stolen AI API key marketplaces and Anthropic/OpenAI/Groq/Mistral key theft as a separate threat category.

  - title: "Kimwolf IoT DDoS botnet operator 'Dort' (Jacob Butler, Ottawa, Canada) arrested; charged in U.S. and Canada; botnet reached 30 Tbps peak, 25,000+ attacks including DoD IP ranges"
    sources:
      - url: "https://krebsonsecurity.com/2026/05/alleged-kimwolf-botmaster-dort-arrested-charged-in-u-s-and-canada/"
        publisher: "KrebsOnSecurity"
        date: "2026-05-21"
        role: "primary"
      - url: "https://therecord.media/canadian-man-arrested-charged-running-kimwolf-botnet"
        publisher: "The Record (Recorded Future News)"
        date: "2026-05-21"
        role: "corroborating"
      - url: "https://www.justice.gov/usao-ak/pr/canadian-man-arrested-international-authorities-charged-administrating-kimwolf-ddos"
        publisher: "U.S. Department of Justice"
        date: "2026-05-21"
        role: "primary (official)"
    discovery_trace: "first seen at: krebsonsecurity feed (https://krebsonsecurity.com/feed/), URL https://krebsonsecurity.com/2026/05/alleged-kimwolf-botmaster-dort-arrested-charged-in-u-s-and-canada/ → primary: Krebs on Security, URL https://krebsonsecurity.com/2026/05/alleged-kimwolf-botmaster-dort-arrested-charged-in-u-s-and-canada/ → corroborating: The Record, URL https://therecord.media/canadian-man-arrested-charged-running-kimwolf-botnet → official: DOJ, URL https://www.justice.gov/usao-ak/pr/canadian-man-arrested-international-authorities-charged-administrating-kimwolf-ddos"
    summary: |
      Canadian authorities (Ontario Provincial Police) arrested Jacob Butler (alias "Dort"), 23, of Ottawa, on 2026-05-21, on U.S. extradition charges of aiding and abetting computer intrusion for operating the Kimwolf IoT DDoS botnet. The DOJ unsealed the criminal complaint (Alaska district court) the same day. Kimwolf infected digital photo frames, webcams, and other internet-exposed IoT devices; at peak it reached approximately 30 Terabits per second — the largest publicly disclosed DDoS volume at the time of the operation — and issued over 25,000 attack commands including against U.S. Department of Defense Information Network IP ranges, causing some victims financial losses exceeding $1 million per incident. The botnet operated as a DDoS-for-hire service; Kimwolf infrastructure was shared or coordinated with three related botnets: Aisuru, JackSkid, and Mossad, collectively infecting over 3 million IoT devices. A prior international takedown in March 2026 seized C2 infrastructure for all four botnets (U.S., Germany, Canada). Butler previously launched DDoS, doxing, and swatting campaigns against KrebsOnSecurity and security researchers who investigated him. He faces up to 10 years on the federal charge. Defender relevance: the arrest confirms that IoT-originated volumetric DDoS at nation-state-scale throughput is available as a commercial service; Kimwolf's 30 Tbps capability is within range of the largest known attacks. For Swiss/EU network operators: ensure DDoS mitigation capacity and ISP-level scrubbing SLAs account for 10–30 Tbps threat models; IoT device inventories should segment frames/cameras/consumer-grade network equipment from critical-path infrastructure.
    ch_eu_nexus: "indirect; DDoS-for-hire infrastructure available to any paying customer including EU-targeting actors; EU network operators within the attack-surface profile"
    public_sector_nexus: "indirect"
    sector: "telco, ISP, any internet-facing organisation"
    cves: []
    actors_campaigns_malware: ["Kimwolf", "Aisuru", "JackSkid", "Mossad", "Dort"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "The botnet issued 'over 25,000 attack commands' and achieved 'nearly 30 Terabits per second' in peak DDoS volume—a record at the time of arrest"
        attribution: "KrebsOnSecurity"
        source_url: "https://krebsonsecurity.com/2026/05/alleged-kimwolf-botmaster-dort-arrested-charged-in-u-s-and-canada/"
      - quote: "In court documents unsealed on Thursday, the Justice Department said Jacob Butler ran KimWolf as a DDoS-for-hire service that infected over a million devices worldwide"
        attribution: "The Record"
        source_url: "https://therecord.media/canadian-man-arrested-charged-running-kimwolf-botnet"
    extended_notes: |
      The March 2026 infrastructure takedown preceded the arrest and was coordinated with German and Canadian partners. The simultaneous existence of four coordinated botnets (Kimwolf, Aisuru, JackSkid, Mossad) under apparent shared management suggests a modular DDoS-as-a-service infrastructure model rather than a single monolithic botnet.

  - title: "UPDATE: Drupal CVE-2026-9082 — active exploitation confirmed in the wild; CISA adds to KEV 2026-05-22; PostgreSQL-backed sites on Drupal 8.9–11.3.9 at immediate risk"
    sources:
      - url: "https://www.drupal.org/sa-core-2026-004"
        publisher: "Drupal Security Team"
        date: "2026-05-22"
        role: "primary (updated advisory)"
      - url: "https://security-hub.ncsc.admin.ch/#/posts/12584"
        publisher: "NCSC Switzerland Security Hub"
        date: "2026-05-22"
        role: "corroborating (national CERT update)"
      - url: "https://slcyber.io/research-center/keys-to-the-kingdom-anonymous-sql-injection-in-drupal-core-cve-2026-9082/"
        publisher: "Searchlight Cyber"
        date: "2026-05-21"
        role: "technical analysis"
    discovery_trace: "first seen at: ncsc-csh bridge (ncsc-csh recent 10), post 12584, URL https://security-hub.ncsc.admin.ch/#/posts/12584 (updated 2026-05-22 13:52 to confirm active exploitation) → pivot: Drupal advisory, URL https://www.drupal.org/sa-core-2026-004 → technical writeup: Searchlight Cyber, URL https://slcyber.io/research-center/keys-to-the-kingdom-anonymous-sql-injection-in-drupal-core-cve-2026-9082/ → WebSearch confirms CISA KEV listing"
    summary: |
      The Drupal Security Team updated SA-CORE-2026-004 on 2026-05-22 to confirm that exploit attempts targeting CVE-2026-9082 are now being detected in the wild. CISA added CVE-2026-9082 to its Known Exploited Vulnerabilities catalog the same day. The vulnerability is an anonymous pre-authentication SQL injection in Drupal core's Entity Query API / Database API layer (`core/lib/Drupal/Core/Entity/Query/Sql/Condition::compile()` / `ConditionAggregate::compile()`): on the case-insensitive `IN` operator path, a JSON-encoded array value survives into the SQL placeholder name without sanitisation, allowing injection when the backend is PostgreSQL. The attack surface is any PostgreSQL-backed Drupal site on versions 8.9.x through 11.3.9 (inclusive), reachable by anonymous unauthenticated users — no prior authentication or session required. Fixed versions: 10.4.10, 10.5.10, 10.6.9, 11.1.10, 11.2.12, 11.3.10; best-effort patches for EOL Drupal 8.9 and 9. Exploitation outcomes include information disclosure, privilege escalation, and potentially remote code execution. Drupal is widely deployed across Swiss federal and cantonal government portals, EU member state government sites, EU institutions (Council, Commission, Parliament), and university research networks (SWITCH-branded deployments). Detection: web server access logs for malformed JSON payloads in POST bodies to Drupal login endpoint or JSON:API endpoints; WAF rule for nested JSON array in `user` field of login POST. Hardening: immediate upgrade to a fixed branch; if upgrade is not immediately possible, switch database backend to MySQL/MariaDB (the injection does not affect MySQL-backed deployments) or disable the JSON:API module until patching is complete.
    ch_eu_nexus: "direct; Drupal is the CMS backbone of many Swiss federal, cantonal, and EU government websites; SWITCH and GÉANT academic hosting includes Drupal deployments"
    public_sector_nexus: "direct"
    sector: "government, education, NGO, public sector"
    cves: ["CVE-2026-9082"]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "update-to-prior:2026-05-21"
