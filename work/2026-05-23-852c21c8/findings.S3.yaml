items:
  - title: "Iranian APT Screening Serpens (UNC1549/Smoke Sandstorm): Six new RAT variants via AppDomainManager hijacking + DLL sideloading in wartime espionage campaign"
    sources:
      - url: "https://unit42.paloaltonetworks.com/tracking-iran-apt-screening-serpens/"
        publisher: "Unit 42 (Palo Alto Networks)"
        date: "2026-05-22"
        role: "primary"
      - url: "https://www.cybersecuritydive.com/news/iran-cyberattacks-espionage-us-israel-uae/820990/"
        publisher: "Cybersecurity Dive"
        date: "2026-05-22"
        role: "corroborating"
    discovery_trace: "first seen at: unit42 feed (https://unit42.paloaltonetworks.com/feed/), URL https://unit42.paloaltonetworks.com/tracking-iran-apt-screening-serpens/ → primary: Unit 42, URL https://unit42.paloaltonetworks.com/tracking-iran-apt-screening-serpens/ → corroborating: Cybersecurity Dive, URL https://www.cybersecuritydive.com/news/iran-cyberattacks-espionage-us-israel-uae/820990/"
    summary: |
      Unit 42 (published 2026-05-22) documents a surge in Screening Serpens (UNC1549 / Smoke Sandstorm / Nimbus Manticore) operations from February through April 2026, timed to the onset of the U.S.-Israeli Middle East conflict that began 2026-02-28. The group deployed six new RAT variants across two malware families: MiniUpdate (three variants, used March–April 2026 in lures impersonating aviation, healthcare, and financial-services firms) and MiniJunk V2 (three variants, deployed February–March 2026 against an IT professional tracked for months via job-hunting activity). The most technically significant evolution is AppDomainManager hijacking (T1574.014) combined with DLL sideloading (T1574.001): the infection chain drops a legitimate Microsoft .NET executable alongside a weaponised `UpdateChecker.dll` / `InitInstall.dll` / `Updater.dll` and a malicious `.runtimeconfig.json` that redirects the CLR's AppDomainManager loading at startup, silently disabling ETW tracing and strong-name validation before the RAT executes — leaving the host's EDR operating in a reduced-telemetry mode. Delivery uses highly personalised lures: fake recruitment PDFs, spoofed video-conference meeting invitations, and ZIP archives containing a legitimate executable as the trigger. Post-compromise persistence is via Windows Task Scheduler scheduled tasks; C2 routes through Azure-hosted domains. Confirmed targets span U.S., Israel, UAE and at least two further Middle Eastern entities; consistent with prior UNC1549 focus on aerospace, defence, and telecommunications sectors. Detection vantage: monitor for `.runtimeconfig.json` writes by non-installer processes, CLR debug-mode initialisation events (ETW `Microsoft-Windows-DotNETRuntime` provider with StrongNameVerification=0), and scheduled-task creation from processes with `.dll` parent images loading via rundll32/svchost. Hardening: enforce code-integrity policy (`UMCI` + trusted-signers allowlist) to block unsigned DLL loads into .NET CLR. CH/EU nexus is indirect but relevant — Swiss aerospace and defence suppliers (RUAG, Pilatus, defence export channels) are within the sector profile; Switzerland and EU-based R&D/tech firms historically targeted by Iranian threat actors.
    ch_eu_nexus: "indirect; sector profile (aerospace, defence, telecom) encompasses CH/EU suppliers and R&D firms"
    public_sector_nexus: "indirect — defence-adjacent; government contractors"
    sector: "aerospace, defence, telco, technology"
    cves: []
    actors_campaigns_malware: ["Screening Serpens", "UNC1549", "Smoke Sandstorm", "Nimbus Manticore", "MiniUpdate", "MiniJunk V2"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "The most critical evolution in the group's recent campaign uses a technique called AppDomainManager hijacking, which manipulates the initialization phase of .NET applications to proactively disable the application's own security mechanisms via a legitimate configuration file"
        attribution: "Unit 42"
        source_url: "https://unit42.paloaltonetworks.com/tracking-iran-apt-screening-serpens/"
      - quote: "Screening Serpens has 'consistently set its sights on high-value sectors,' especially in the aerospace, defense and telecommunications industries"
        attribution: "Cybersecurity Dive"
        source_url: "https://www.cybersecuritydive.com/news/iran-cyberattacks-espionage-us-israel-uae/820990/"
    extended_notes: |
      MiniUpdate RAT family — three variants observed across three separate campaigns (late-March U.S., late-March Israel, mid-April UAE/Middle East). MiniJunk V2 — used in February and March campaigns. The February campaign involved a single IT professional in the Middle East; malware development metadata indicates the operators researched this specific target's job-hunting activity as far back as late 2025. MITRE ATT&CK mapped techniques: T1574.001 (DLL Sideloading), T1574.014 (AppDomainManager Hijacking), T1598 (Social Engineering / Spearphishing), T1053.005 (Scheduled Task/Job).

  - title: "ROADtools open-source framework weaponised by Midnight Blizzard, Curious Serpens (Peach Sandstorm/APT33), and UTA0355 for Entra ID device registration, token theft, and tenant enumeration"
    sources:
      - url: "https://unit42.paloaltonetworks.com/roadtools-cloud-attacks/"
        publisher: "Unit 42 (Palo Alto Networks)"
        date: "2026-05-22"
        role: "primary"
      - url: "https://www.volexity.com/blog/2025/04/22/phishing-for-codes-russian-threat-actors-target-microsoft-365-oauth-workflows/"
        publisher: "Volexity"
        date: "2025-04-22"
        role: "background/historical"
    discovery_trace: "first seen at: unit42 feed (https://unit42.paloaltonetworks.com/feed/), URL https://unit42.paloaltonetworks.com/roadtools-cloud-attacks/ → primary: Unit 42, URL https://unit42.paloaltonetworks.com/roadtools-cloud-attacks/"
    summary: |
      Unit 42 (published 2026-05-22) documents systematic nation-state operationalisation of ROADtools, the open-source Python Entra ID attack/defence framework (github.com/dirkjanm/ROADtools), by three named clusters: Cloaked Ursa/Midnight Blizzard (APT29/NOBELIUM, Russia), Curious Serpens/Peach Sandstorm (APT33, Iran), and UTA0355 (Russian state-affiliated). The attack chain begins with credential compromise (typically via password spray or OAuth device-code phishing), then uses `roadtx` to register attacker-controlled devices in the victim's Entra ID tenant — establishing persistence by obtaining a Primary Refresh Token (PRT) bound to a registered device. The `roadrecon` module performs systematic directory enumeration via legacy Azure AD Graph API calls (now also ported to the msgraph branch) targeting users, groups, service principals, application permissions, and OAuth tokens. Key MITRE ATT&CK techniques: T1098.005 (Account Manipulation — Device Registration), T1550 (Use Alternate Authentication Material), T1087 (Account Discovery via Microsoft Graph API), T1556.006 (Multi-Factor Authentication bypass via device PRT binding). Detection: monitor Entra ID audit logs for `Add device` events from unfamiliar device names or from IPs not in expected employee geographies; sign-in logs for `roadtx` user-agent strings or unexpected `https://login.microsoftonline.com/common/oauth2/token` device-code grant flows; Microsoft Graph Activity Logs for bulk `GET /users`, `GET /groups`, `GET /servicePrincipals` calls clustered by time. Hardening: enforce Conditional Access token-protection policies (token binding); restrict device registration to compliant/hybrid-joined devices only; enforce Privileged Access Workstation policy for admin token issuance; Entra ID `ConditionalAccess: blockLegacyAuthentication` to block Azure AD Graph calls. Swiss and EU public-sector tenants heavily reliant on Microsoft 365 and Entra ID are direct targets; Midnight Blizzard has previously targeted EU diplomatic and government entities.
    ch_eu_nexus: "direct; Midnight Blizzard/APT29 has a documented pattern of targeting EU diplomatic corps and government entities in Microsoft 365 environments"
    public_sector_nexus: "direct — government/diplomatic Microsoft 365 tenants"
    sector: "government, diplomacy, defence, technology"
    cves: []
    actors_campaigns_malware: ["Cloaked Ursa", "Midnight Blizzard", "APT29", "NOBELIUM", "Curious Serpens", "Peach Sandstorm", "APT33", "UTA0355", "Void Blizzard", "ROADtools"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Cloaked Ursa/Midnight Blizzard, Curious Serpens/Peach Sandstorm, and UTA0355 have operationalized ROADtools in targeting high-value organizations"
        attribution: "Unit 42"
        source_url: "https://unit42.paloaltonetworks.com/roadtools-cloud-attacks/"
      - quote: "Nation-state actors leverage two primary modules: roadrecon for account discovery and roadtx for token acquisition and device registration"
        attribution: "Unit 42"
        source_url: "https://unit42.paloaltonetworks.com/roadtools-cloud-attacks/"
    extended_notes: |
      ROADtools has both an official github.com/dirkjanm/ROADtools repo and a community fork (github.com/Tom2Byrne/ROADtools). The tool operates through legitimate Microsoft API endpoints, making network-layer detection difficult; identity-layer telemetry in Entra ID and Microsoft Graph Activity Logs is the primary detection surface. Token binding (Entra Conditional Access token-protection preview) is the most direct hardening control because it renders stolen tokens non-transferable.

  - title: "Cloud Atlas APT — new PowerCloud (Google Sheets credential exfil) and ReverseSocks (Golang tunnel) tools added to VBCloud/PowerShower toolkit; targeting Russian and Belarusian government and diplomatic bodies"
    sources:
      - url: "https://securelist.com/cloud-atlas-2026/119895/"
        publisher: "Kaspersky Securelist"
        date: "2026-05-22"
        role: "primary"
      - url: "https://therecord.media/cyber-espionage-group-cloud-atlas-targets-russia-and-its-supporters"
        publisher: "The Record (Recorded Future News)"
        date: "2026-05-22"
        role: "corroborating"
    discovery_trace: "first seen at: securelist feed (https://securelist.com/feed/), URL https://securelist.com/cloud-atlas-2026/119895/ → primary: Kaspersky Securelist, URL https://securelist.com/cloud-atlas-2026/119895/ → corroborating: The Record, URL https://therecord.media/cyber-espionage-group-cloud-atlas-targets-russia-and-its-supporters"
    summary: |
      Kaspersky GReAT (published 2026-05-22) documents updated Cloud Atlas (also known as Clean Ursa, Inception, Oxygen) toolkit components observed in campaigns targeting Russian and Belarusian government agencies, diplomatic entities, and military-industrial organisations in the second half of 2025 and early 2026. Initial access remains phishing via ZIP archives containing LNK shortcuts executing PowerShell — the `fixed.ps1` loader stage — exploiting the longstanding social-engineering pattern against Windows targets. Two new tools are now deployed in the post-compromise phase: **PowerCloud**, a PowerShell-based credential harvester that encodes stolen credentials in Base64 and exfiltrates them to attacker-controlled Google Sheets (using the Google Sheets API with embedded service account credentials); and **ReverseSocks**, a Golang-based SOCKS5 reverse-tunnel tool used alongside Tor hidden services to create persistent, covert RDP access channels (`termsrv.dll` patched for multi-session). Lateral movement uses Kerberoasting, PsExec/PAExec, and SSH with obfuscated OpenSSH binaries (modified imports for AV evasion). Persistence is layered: Windows Registry Run keys for the PowerShell loader, and scheduled tasks running VBS wrappers for tunnel management. Detection vantage: monitor for Google Sheets API calls (`sheets.googleapis.com`) from non-browser processes with service-account bearer tokens in HTTP headers; detect OpenSSH binary anomalies via PE import hash or `modules.json` deviation from vendor-supplied builds; hunt for `termsrv.dll` modifications via file-integrity monitoring (FIM) and the `T1546` event-class. Hardening: block outbound calls to `sheets.googleapis.com` from server workloads; enforce EDR import-hash allowlisting for SSH binaries; restrict multi-session RDP via GPO `fSingleSessionPerUser`. EU/CH nexus: indirect — Cloud Atlas targets Russia's geopolitical orbit, but the group's infrastructure transits global hosting providers; EU diplomatic missions in Russia and Russian-sphere states are potential lateral targets.
    ch_eu_nexus: "indirect; EU diplomatic missions in Russia/Belarus may be collateral exposure; Cloud Atlas infrastructure observed on global hosting providers"
    public_sector_nexus: "direct (in Russia/Belarus); indirect (EU diplomats)"
    sector: "government, diplomacy, defence, military-industrial"
    cves: []
    actors_campaigns_malware: ["Cloud Atlas", "Clean Ursa", "Inception", "Oxygen", "Head Mare", "PowerCloud", "ReverseSocks", "VBCloud", "PowerShower", "PhantomHeart"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Cloud Atlas attacks the public sector and diplomatic structures of Russia and Belarus, using ReverseSocks, SSH, and Tor for persistence in infected systems and its new tool, PowerCloud"
        attribution: "Kaspersky Securelist"
        source_url: "https://securelist.com/cloud-atlas-2026/119895/"
      - quote: "PowerCloud is a credential collector exfiltrating data to Google Sheets encoded in Base64 format"
        attribution: "Kaspersky Securelist"
        source_url: "https://securelist.com/cloud-atlas-2026/119895/"
    extended_notes: |
      Head Mare is listed as co-observed in the same ecosystem by Kaspersky; Cloud Atlas and Head Mare appear to share some infrastructure or tooling. The Google Sheets exfiltration pattern is novel for this group — prior campaigns used OneDrive and other Microsoft cloud services. The choice of public cloud platforms for C2 (Sheets API) significantly complicates network-layer detection.

  - title: "Check Point Research AI Threat Landscape Digest March-April 2026 — AI-automated exploitation of nine Mexican government agencies; EvilTokens commodity jailbreak-as-a-service packages AI exploitation for cybercriminals"
    sources:
      - url: "https://blog.checkpoint.com/research/ai-attacks-are-no-longer-experimental-key-findings-from-the-march-april-2026-ai-threat-landscape/"
        publisher: "Check Point Research"
        date: "2026-05-22"
        role: "primary"
      - url: "https://gambit.security/blog-post/a-single-operator-two-ai-platforms-nine-government-agencies-the-full-technical-report"
        publisher: "Gambit Security"
        date: "2026-05-22"
        role: "primary (linked from CPR)"
    discovery_trace: "first seen at: checkpoint-research feed (https://blog.checkpoint.com/feed/), URL https://blog.checkpoint.com/research/ai-attacks-are-no-longer-experimental-key-findings-from-the-march-april-2026-ai-threat-landscape/ → primary: Check Point Research, URL https://blog.checkpoint.com/research/ai-attacks-are-no-longer-experimental-key-findings-from-the-march-april-2026-ai-threat-landscape/ → linked primary: Gambit Security, URL https://gambit.security/blog-post/a-single-operator-two-ai-platforms-nine-government-agencies-the-full-technical-report"
    summary: |
      Check Point Research's March-April 2026 AI Threat Landscape Digest (published 2026-05-22) documents AI crossing from experimental to operational in adversarial campaigns. The centrepiece case — researched by Gambit Security — documents a single unidentified operator compromising nine Mexican government agencies (tax records, civil registry data, patient files, electoral infrastructure) between December 2025 and February 2026. The attacker ran two commercial AI platforms in parallel: one managing live exploitation (over 5,000 AI-executed commands), a second processing harvested data and feeding instructions back into the first. The attacker's persistence mechanism for the AI itself was simple but effective: modifying the AI's startup configuration file to embed persistent instructions inherited by every subsequent session. The separate EvilTokens platform represents the commoditisation vector — a jailbreak-as-a-service tool packaging AI-driven phishing generation, financial data extraction, and similar capabilities as a subscription product available to lower-capability threat actors. A structural defensive concern highlighted by CPR is that AI API credentials (Anthropic, OpenAI, Groq, Mistral) are now treated as high-value targets by cybercriminals because stolen keys grant access to powerful AI services without an account. Detection and hunting vantage: monitor for bulk exfiltration events temporally co-located with anomalous API call patterns to commercial AI services from non-standard processes; inspect process trees for AI client libraries spawning data-collection subprocesses; review cloud audit logs for API key issuance followed immediately by large-volume inference calls from unusual source IPs. CH/EU nexus: European government agencies are within the same sector profile; Swiss federal agencies and cantons using commercial AI APIs should audit key rotation policies and access controls. Notably the report documents vulnerability-to-exploit timelines compressing from weeks to hours — outpacing monthly patch cycles.
    ch_eu_nexus: "relevant; European public sector agencies within the same sector profile as the documented victims; Swiss federal agencies using commercial AI APIs"
