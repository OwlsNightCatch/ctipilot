        attribution: "Check Point Research"
        source_url: "https://blog.checkpoint.com/research/ai-attacks-are-no-longer-experimental-key-findings-from-the-march-april-2026-ai-threat-landscape/"
      - quote: "EvilTokens emerged as a commercialized attack platform packaging AI exploitation into an accessible product, including phishing generation and financial data extraction"
        attribution: "Check Point Research"
        source_url: "https://blog.checkpoint.com/research/ai-attacks-are-no-longer-experimental-key-findings-from-the-march-april-2026-ai-threat-landscape/"
