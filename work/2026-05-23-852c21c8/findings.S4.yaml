    discovery_trace: "first seen at: bleepingcomputer (listing page fetch) → primary: FIOD official press release https://www.fiod.nl/fiod-houdt-twee-verdachten-aan-wegens-overtreding-sanctiewetgeving/ → corroborating: DutchNews.nl https://www.dutchnews.nl/2026/05/two-dutch-men-arrested-for-aiding-russian-cyberattacks/ → background: Recorded Future Insikt Group https://www.recordedfuture.com/research/one-step-ahead-stark-industries-solutions-preempts-eu-sanctions"
    summary: |
      The Dutch Fiscal Information and Investigation Service (FIOD) arrested two men on 2026-05-18 — Youssef Z. (57, Enschede), owner of WorkTitans B.V., and Andrey N. (39, Almere), founder of MIRhosting — for violating the Dutch Sanctions Act by continuing to provide bulletproof hosting infrastructure for Stark Industries Solutions Ltd, an entity sanctioned by the EU in May 2025 for facilitating Russian and Belarusian destabilisation operations. FIOD raided five locations including data centres in Dronten and Schiphol-Rijk, seizing 800 servers, laptops, phones, and administrative records. According to Insikt Group analysis (June 2025), Stark Industries pre-empted its EU designation by migrating its ASN (AS44477) to AS209847 (WorkTitans), transferring IP prefix blocks, and rebranding to THE.Hosting under WorkTitans B.V., with all RIPE maintainer objects still under Dmitrii Miasnikov's control — a transparent shell concealing ownership continuity. Danish authorities and infrastructure providers had linked WorkTitans directly to DDoS operations by the pro-Russian hacktivist group NoName057(16), which targets EU and NATO member states including Swiss government and critical-infrastructure websites. The arrests represent the first criminal enforcement of EU sanctions against a bulletproof hoster acting as a proxy for designated Russian entities, with the suspects facing charges under the Dutch Sanctions Act. The seized intelligence generates lead packages for follow-on investigations into ransomware and hybrid-warfare activity the infrastructure enabled.
    ch_eu_nexus: "Direct: Stark Industries / WorkTitans infrastructure enabled NoName057(16) DDoS against EU and Swiss government websites; EU sanctions violation enforced by Dutch FIOD; network-level nexus to Swiss critical-infrastructure targets. Background reporting by Recorded Future notes the EU sanctions designation was Council Decision (CFSP) 2025/966 — a coordinated EU response to Russian hybrid operations."
