        publisher: "CyberScoop"
        date: "2026-05-22"
        role: "corroborating"
    discovery_trace: "first seen at: THN RSS feed — item 'CISA Adds Exploited Langflow and Trend Micro Apex One Vulnerabilities to KEV' with reference to FBI Kali365 → WebSearch 'Kali365 IC3 FBI advisory PSA260521 OAuth device code phishing Microsoft 365' → primary: https://www.ic3.gov/PSA/2026/PSA260521 (403 via bridge) → corroborating: therecord.media https://therecord.media/fbi-warns-of-kali365-phishing-attacks → corroborating: theregister.com https://www.theregister.com/cyber-crime/2026/05/22/fbi-warns-of-kali365-as-device-code-phishing-soars/5245024"
    summary: |
      The FBI issued PSA260521 on 2026-05-21 warning about Kali365, a Telegram-distributed Phishing-as-a-Service platform first observed in April 2026 that exploits Microsoft's OAuth 2.0 device-code authorization flow (RFC 8628) to capture persistent access and refresh tokens for M365 accounts while completely bypassing multi-factor authentication. The attack technique (MITRE ATT&CK T1111 — MFA Interception; T1528 — Steal Application Access Token) differs from traditional credential phishing: victims receive lure emails impersonating Adobe Acrobat Sign, DocuSign, or SharePoint containing a device code and instructions to visit the legitimate Microsoft device-login portal (login.microsoftonline.com/common/oauth2/deviceauth). When the victim enters the code, the attacker's registered device receives an access token + refresh token, granting persistent access to Exchange Online, Teams, OneDrive, and SharePoint without further user interaction. A secondary AiTM (Adversary-in-the-Middle) mode transparently proxies the victim's browser through attacker infrastructure, capturing session cookies during real Microsoft authentication flows. The kit charges affiliates $250/month or $2,000/year per tenant and offers AI-generated phishing lures in 14 languages, automated campaign templates, real-time tracking dashboards, and token storage — lowering the technical barrier for actors without existing M365 attack capability. Abuse scenarios observed include mailbox exfiltration, lateral phishing, BEC fraud, and access for ransomware pre-staging. The IC3 advisory specifically calls out government and critical-infrastructure targets among affected sectors from April 2026 campaigns.
    ch_eu_nexus: "Global. Particularly relevant to Swiss and EU public-sector organisations relying on Microsoft 365 with conditional access policies — device-code flow abuse bypasses FIDO2 / certificate-based MFA where Conditional Access does not block user-interactive device-code authentication."
    public_sector_nexus: "High — FBI advisory explicitly calls out government targets; device-code flows are commonly left open in public-sector M365 tenants for legacy device enrollment"
    sector: "all sectors using Microsoft 365, government, finance, healthcare"
    cves: []
    actors_campaigns_malware:
      - "Kali365 (PhaaS platform, Telegram-distributed)"
      - "EvilTokens (competing device-code PhaaS platform)"
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Kali365 enables cyber threat actors to obtain Microsoft 365 access tokens and bypass multi-factor authentication (MFA) protocols without intercepting the user's credentials."
        attribution: "FBI IC3 (PSA260521, as quoted by Help Net Security)"
        source_url: "https://www.helpnetsecurity.com/2026/05/22/kali365-microsoft-365-phishing-fbi-warning/"
      - quote: "The attack starts with a phishing email that impersonates trusted cloud or document-sharing services and includes a device code with instructions to visit a legitimate Microsoft verification page. When the victim enters the code, the attacker's device registers to the target's M365 account, granting access to email, Teams, and other resources without MFA protection."
        attribution: "The Register"
        source_url: "https://www.theregister.com/cyber-crime/2026/05/22/fbi-warns-of-kali365-as-device-code-phishing-soars/5245024"
    extended_notes: |
      Detection: Microsoft Entra ID sign-in logs generate event type 'DeviceCode' (authentication_method = 'Device Code' in AAD audit logs). Conditional Access policies can block device-code flows entirely for user-interactive authentication by targeting 'Device code flow' in the authentication context — this is the primary hardening lever. Monitor Entra ID sign-in logs for: (1) 'device code' authentication events from unfamiliar device names, (2) new OAuth application consents from unknown tenant IDs, (3) sign-in activity immediately after a device-code event from a geographically different IP than the victim's normal location. Defender for Cloud Apps can alert on 'Impossible travel' for token-based sessions. Hardening: block device code flow via Conditional Access using 'Authentication flows' condition (preview feature in Entra P1/P2); enforce FIDO2 phishing-resistant MFA; review existing OAuth app permissions for recently granted delegated access. The refresh token persistence is the key risk — a stolen token granted before policy change remains valid; revoke all refresh tokens for suspected accounts via PowerShell `Revoke-MgUserSignInSession`.

  - title: "Oncology Institute Inc. (NASDAQ: TOI) — SEC Item 1.05 8-K: vendor breach affecting oncology patient data, Kroll-notified 2026-05-20, multi-provider healthcare supply-chain incident"
    sources:
      - url: "https://www.sec.gov/Archives/edgar/data/1799191/000107997326000721/"
        publisher: "SEC EDGAR"
        date: "2026-05-22"
        role: "primary (filing index — 8-K Item 1.05)"
      - url: "https://www.theglobeandmail.com/investing/markets/stocks/TOI-Q/pressreleases/35995904/oncology-institute-reports-cybersecurity-incident-impact/"
        publisher: "Globe and Mail (press release relay)"
        date: "2026-05-22"
        role: "corroborating"
    discovery_trace: "first seen at: sec-edgar bridge subcommand (sec-edgar 8k 2026-05-21 2026-05-23 1.05) returning Oncology Institute Inc CIK 0001799191 filing_url https://www.sec.gov/Archives/edgar/data/1799191/000107997326000721/ → primary filing index: https://www.sec.gov/Archives/edgar/data/1799191/000107997326000721/ (403 via bridge) → corroborating: SEC search result summary and Globe and Mail relay"
    summary: |
      The Oncology Institute, Inc. (NASDAQ: TOI; CIK 0001799191) filed a Form 8-K under Item 1.05 (Material Cybersecurity Incident) on 2026-05-22, disclosing that on 2026-05-20 Kroll Information Assurance, LLC — acting as the third-party administrator for an unnamed software vendor — notified TOI of unauthorized third-party access to the vendor's information systems that included patient data. TOI is a value-based oncology practice group operating across the western United States treating approximately 8,000 active oncology patients. The Item 1.05 filing indicates TOI's board determined the incident meets SEC materiality thresholds, escalating from a prior voluntary Item 7.01 / 8.01 disclosure filed 2025-11-06 when the same vendor was first identified as having a cybersecurity incident affecting fee-for-service billing operations. The 2026-05-22 filing states "the Company believes that the cybersecurity incident has affected various other healthcare service providers," indicating a multi-victim supply-chain compromise through the unnamed healthcare software vendor. Kroll has established a patient notification portal (nychealthandhospitals-incident.kroll.com analogue). TOI's 8-K states operations have continued in all material respects and that the company will offer credit monitoring to impacted patients. The nature and scope of exfiltrated data categories are not specified in the filing.
    ch_eu_nexus: "Indirect — demonstrates the pattern of healthcare software supply-chain compromises escalating to SEC material disclosure. Analogous to EU/NIS2 significant incident notification obligations. No direct Swiss/EU nexus."
    public_sector_nexus: "Indirect — US-based oncology practice; relevant as healthcare supply-chain SaaS breach pattern"
    sector: "healthcare, oncology, US"
    cves: []
    actors_campaigns_malware: []
    verification: SINGLE-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "On May 20, 2026, Kroll, who is the third-party administrator for the Vendor, notified the Company that the Vendor had detected unauthorized access by a third party to certain information systems of the Company, including systems affecting data of patients."
        attribution: "Oncology Institute 8-K (via SEC EDGAR / Globe and Mail relay)"
        source_url: "https://www.theglobeandmail.com/investing/markets/stocks/TOI-Q/pressreleases/35995904/oncology-institute-reports-cybersecurity-incident-impact/"
    extended_notes: |
      The two-step filing pattern (Item 8.01 in Nov 2025 → Item 1.05 in May 2026) is clinically significant for defenders watching SEC disclosure timelines: the materiality determination came ~6 months after initial disclosure, triggered by the formal notification that patient data (not just operational systems) was affected. This is consistent with healthcare SaaS vendors providing delayed forensic scope — the vendor apparently notified TOI of the patient-data impact only on 2026-05-20. The multi-provider language ("various other healthcare service providers") suggests the vendor is a shared-platform SaaS used across oncology networks; defenders at healthcare orgs using third-party patient-data SaaS should cross-check whether their own vendor received the same Kroll notification.

