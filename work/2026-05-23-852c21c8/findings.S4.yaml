      Defender vantage: Stark Industries / THE.Hosting / WorkTitans IP space (ASN AS44477 and successor AS209847) has been documented in blocklist feeds since mid-2024. The Insikt Group analysis from June 2025 published RIPE maintainer identifiers and ASN transition timeline that allows retrospective hunt for connections to sanctioned entities via BGP peering data. For NOName057(16) DDoS exposure: review ingress rate-limiting and DDoS scrubbing coverage for public-facing Swiss government infrastructure, as the group's tactics include sustained HTTP/HTTPS floods targeting citizen-facing portals. Follow-on investigations from the seized intelligence may surface additional European RaaS affiliate and proxy hosting connections.

  - title: "FBI PSA260521 — Kali365 PhaaS exploits OAuth device-code flow to steal persistent M365 tokens, MFA bypass without credential interception"
    sources:
      - url: "https://www.ic3.gov/PSA/2026/PSA260521"
        publisher: "FBI / IC3"
        date: "2026-05-21"
        role: "primary (403 from bridge — cited from corroborating sources)"
      - url: "https://therecord.media/fbi-warns-of-kali365-phishing-attacks"
        publisher: "The Record (Recorded Future News)"
        date: "2026-05-22"
        role: "primary corroborating"
      - url: "https://www.theregister.com/cyber-crime/2026/05/22/fbi-warns-of-kali365-as-device-code-phishing-soars/5245024"
        publisher: "The Register"
