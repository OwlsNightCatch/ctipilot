      fix: "verification: single-source (sourcing_note already names Talos as sole analyst)."
    - code: F14
      where: "title"
      claim: "the first publicly reported Windows implant that lets a panel of four commercial LLMs vote"
      ground_truth: "(low confidence) Talos hedges: 'CLOSEDQUORUM is, to our knowledge, the first publicly documented Windows implant to apply this model to tactical command and control'; the title states the superlative without the hedge (the body quote also drops 'to our knowledge')."
