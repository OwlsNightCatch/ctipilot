- entry: entries/2026-09-29/push-security-clickfix-h2-2026-detection-review.md
  verdict: imprecision
  defects:
    - code: F5
      where: "body ¶3"
      claim: "Push notes that standard EDR guidance of baselining LOLBin activity and alerting on anomalies suffers a high false-positive rate for this technique class, because legitimate IT automation, MDM tooling and administrator scripts generate similar-looking process-execution telemetry to a ClickFix payload's own binary invocation."
      ground_truth: "The paragraph carries no inline citation. Push: 'The standard EDR guidance for detecting LOLBin abuse is: baseline normal usage in your environment over 30 days, then alert on anomalies ... IT automation, software deployment, MDM tools, and admin scripts all generate legitimate LOLBin activity that looks suspicious out of context. The result is a high false-positive rate that requires significant per-environment tuning.'"
      ground_truth_url: "https://pushsecurity.com/blog/the-state-of-clickfix-by-detection-data"
      fix: "Append ([Push Security, 2026-09-23](https://pushsecurity.com/blog/the-state-of-clickfix-by-detection-data)) to the paragraph."
    - code: F14
      where: "title"
      claim: "ClickFix now drives 52-67% of monthly browser-based-attack detections"
      ground_truth: "Push: 'Through Q2, ClickFix made up an average of 52% of Push's detections ... And in August, this figure reached 67%.' 52% is the Q2 average and 67% is the August figure, both of Push's own detections; the title reads as a monthly range, and 'browser-based-attack detections' is a gloss (Push says 'Push's detections'). The summary states it correctly."
      ground_truth_url: "https://pushsecurity.com/blog/the-state-of-clickfix-by-detection-data"
      fix: "'ClickFix made up an average 52% of Push Security's detections through Q2 2026 and 67% in August ...'."
    - code: F11
      where: "techniques"
      claim: "techniques: [T1204.004, T1059.001, T1218, T1140, T1608]"
      ground_truth: "Push describes delivery through 'compromised sites, malvertising, and SEO poisoning' (drive-by lure delivery, T1189), shell families 'bash, zsh, cmd' (T1059.004, T1059.003) and 'homoglyph substitution', caret-splitting and XOR-decoded URLs as 'obfuscation and detection evasion' (T1027); none is mapped (all active in the pinned dataset)."
      ground_truth_url: "https://pushsecurity.com/blog/the-state-of-clickfix-by-detection-data"
      fix: "Add T1189 and T1027 (and T1059.004 / T1059.003 if a per-shell mapping is wanted)."
    - code: F8
      where: "labelled line (Defender takeaway)"
      claim: "NCSC Switzerland also advises organisations outside fintech to restrict outbound connections to blockchain RPC providers"
      ground_truth: "(low confidence) The same BACS advisory reports that most compromised Swiss sites run WordPress and that 'Cybercriminals are exploiting a combination of these vulnerabilities known as WP2Shell (CVE-2026-63030 and CVE-2026-60137)' with 'not all website operators' having installed the 17 July updates, and recommends website operators keep the CMS and plug-ins updated and enable MFA. For a Swiss public-sector web estate this is the source-supported operator-side action; the entry carries only the endpoint/RPC side."
