- entry: entries/2026-09-22/plugin4shell-ai-coding-agent-sha-pinning-bypass.md
  verdict: imprecision
  defects:
    - code: F5
      where: "body ¶3 (two uncited sentences)"
      claim: "On those exposed hosts auto-update is off by default but can be enabled. Gemini CLI's `FETCH_HEAD`-named-branch variant is not clearly blocked by GitHub's hash-name restriction, so a GitHub-hosted Gemini plugin is not established as safe."
      ground_truth: "Both sentences carry no inline citation. The Hacker News says auto-update 'is on by default only for the agents' own built-in marketplaces ... and is off or optional for outside ones' ('off by default but can be enabled' is a rewording, not the quote) and 'GitHub's rule against hash-shaped names does not clearly block that name. So it is not established that installing a Gemini CLI plugin from GitHub avoids the flaw'."
      ground_truth_url: "https://thehackernews.com/2026/09/plugin4shell-lets-repository-owners.html"
      fix: "Attach the ([The Hacker News, 2026-09-18]) citation to both sentences and use 'off or optional' for the external-marketplace auto-update wording."
    - code: F11
      where: "title / tags (zero-click)"
      claim: "a zero-click design flaw breaks plugin SHA-pinning identically across Claude Code, OpenAI Codex, GitHub Copilot and Gemini CLI"
      ground_truth: "(low confidence) AIR's own claim is zero-click via background auto-update, but THN (cited by the entry) finds auto-update on by default only for the built-in GitHub-hosted marketplaces, 'off or optional for outside ones', and the branch-name trick does not work on GitHub, so the default-configuration path is not exposed; the title states zero-click and 'identically' as fact while the body notes Gemini CLI has 'a distinct ... variant'."
      ground_truth_url: "https://thehackernews.com/2026/09/plugin4shell-lets-repository-owners.html"
      fix: "Qualify the title ('AIR-described zero-click ... on external marketplaces with auto-update enabled') or drop 'identically'."
    - code: F11
      where: "sectors"
      claim: "sectors: [public-sector]"
      ground_truth: "(low confidence) None of the four cited sources (AIR, THN, Help Net Security, heise) names the public sector or any sector as targeted or affected; the flaw is in developer tooling generally."
      ground_truth_url: "https://www.air.security/blog-posts/plugin4shell"
      fix: "Set sectors: [] unless a cited source supports a sector."
    - code: F18
      where: "actions[0]"
      claim: "Consumer Gemini CLI gets no fix: on it, verify `git rev-parse HEAD` against a plugin's marketplace-pinned SHA before trusting any update, or migrate off it as AIR advises."
      ground_truth: "(low confidence) The action bundles four products' upgrade tasks with source-attribution caveats and then restates the body's Detection guidance (resolve HEAD vs pinned SHA); body detection/hardening guidance should not be restated as an action (check 10b b/c)."
      ground_truth_url: "https://www.air.security/blog-posts/plugin4shell"
      fix: "Shorten to the do-now patch task: 'Upgrade Codex to 0.146.0+, Claude Code to 2.1.179+, Copilot CLI to 1.0.87+ / Copilot app to 1.1.23+'."
