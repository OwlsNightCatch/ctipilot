- entry: entries/2026-09-28/storm-3168-jadepuffer-azure-destructive-service-principal.md
  verdict: imprecision
  defects:
    - code: F4
      where: "labelled line (Triage) / Detection"
      claim: "the discriminators are the attempt against recovery-protection locks specifically (a step with no purpose in routine teardown) ... a combination with essentially no legitimate operational counterpart"
      ground_truth: "(low confidence) Microsoft only says 'Multiple unsuccessful deletion attempts were also made against Azure Site Recovery locks and Azure Backup protection locks protecting storage accounts' and that this was 'potentially intending to impair the victim's ability to recover'; it does not say such lock removal never occurs in legitimate teardown, and decommissioning protected Azure resources normally requires removing those locks/protection first. The 'no purpose in routine teardown' discriminator does not follow from the cited mechanism."
      ground_truth_url: "https://www.microsoft.com/en-us/security/blog/2026/09/25/storm-3168-agentic-driven-cloud-attacks-using-compromised-service-principals/"
      fix: "Make the lock-removal attempt a corroborating signal, not a discriminator; lead with the sequencing/principal-history discriminators (hours of read-only enumeration by a paired principal, then a bulk deletion burst under multiple overlapping tokens, then ListKeys), which Microsoft's timeline supports."
    - code: F16
      where: "priority"
      claim: "priority: high"
      ground_truth: "(low confidence) Microsoft reports a single-tenant event in 'early June 2026' (published 2026-09-25, i.e. well over 30 days old), no sector or victim named, no evidence this actor or tenant relates to the constituency, and guidance that is generic (rotate exposed secrets, locks, Defender plans); this matches the high-bar disqualifier 'single-victim event older than 30 days' and the secret-exposure vector is explicitly unconfirmed."
      ground_truth_url: "https://www.microsoft.com/en-us/security/blog/2026/09/25/storm-3168-agentic-driven-cloud-attacks-using-compromised-service-principals/"
      fix: "priority: notable."
    - code: F14
      where: "summary"
      claim: "Microsoft Security Research documents Azure resource-destruction activity by JADEPUFFER (tracked by Microsoft as Storm-3168) ... Two compromised service principals from one tenant enumerated resources for over 15 hours"
      ground_truth: "Microsoft: 'malicious cloud activity associated with JADEPUFFER' (the 2026-09-30 correction already narrowed the body from 'attributes' to 'associates'; the summary still says 'by JADEPUFFER'). And only the first principal enumerated for 'about 15 hours and 30 minutes'; the second 'enumerated virtual machines and resource groups across two subscriptions in five seconds' (then more discovery 16 hours later), so 'two service principals ... enumerated resources for over 15 hours' merges them."
      ground_truth_url: "https://www.microsoft.com/en-us/security/blog/2026/09/25/storm-3168-agentic-driven-cloud-attacks-using-compromised-service-principals/"
      fix: "'activity Microsoft associates with JADEPUFFER (Storm-3168)'; 'one compromised service principal enumerated the tenant for over 15 hours while a second ... carried out the destructive burst'."
    - code: F11
      where: "sectors"
      claim: "sectors: [public-sector, technology]"
      ground_truth: "(low confidence) Microsoft names no sector for the affected organisation or the actor's targets."
      ground_truth_url: "https://www.microsoft.com/en-us/security/blog/2026/09/25/storm-3168-agentic-driven-cloud-attacks-using-compromised-service-principals/"
      fix: "Set sectors: [] unless a source supports a sector."
- entry: entries/2026-09-29/bitget-hot-wallet-theft-north-korea-nexus.md
  verdict: imprecision
  note: "LEAD DECIDED, page edited since publication, noted and left: evidence[0] ('the attacker may have exploited a vulnerability in a third-party security product to potentially obtain high-level internal credentials') is not on the Bitget academy page as fetched in this pass because Bitget has since revised it (page header 'Updated: October 3, 2026'; now reads 'The latest investigation found that the attacker exploited a vulnerability in a third-party security product to obtain high-level internal credentials. The attacker then used those credentials to send fraudulent withdrawal commands...', hedges 'may have'/'potentially' and the phrase 'impersonate authorized activity' removed). The 2026-09-30 audit verifier iterations recorded this exact wording as read verbatim from the page (work/2026-09-30T0639Z-audit/verification.iter7.s3.claims.yaml: 'may have exploited a vulnerability in a third-party security product to potentially obtain high-level internal credentials ... to impersonate authorized activity and send fraudulent withdrawal command'). Not a non-verbatim quote; Wayback could not be read this pass (HTTP 429) to re-confirm the snapshot, so this rests on the earlier verifier record. No fix required; the body/evidence stay accurate as 'as published 2026-09-27'."
  defects:
    - code: F4
      where: "body ¶1, last sentence"
      claim: "Bitget states private-key compromise was ruled out and cold wallets were unaffected; the vulnerable third-party product's vendor was notified and the affected functionality disabled pending a fix."
      ground_truth: "(low confidence) The sentence has no inline citation and attributes 'pending a fix' to Bitget. Bitget's own pages say the opposite: the 2026-09-26 notice 'The vulnerability involved in the incident has been identified and remediated' and the incident page 'The affected systems were isolated and the underlying vulnerability was remediated. The relevant third-party vendor was notified and the affected functionality was disabled.' 'While the vulnerability is addressed' appears only in The Hacker News 2026-09-28 (citing Crypto Briefing), which adds 'Bitget has not said whether the vendor has released a fix'."
      ground_truth_url: "https://www.bitget.com/support/articles/12560603896110"
      fix: "Cite the sentence and state what Bitget says: vendor notified, affected functionality disabled, underlying vulnerability remediated (per Bitget; THN notes it has not said whether the vendor released a fix)."
    - code: F11
      where: "techniques"
      claim: "techniques: [T1078, T1059, T1552, T1505.003, T1570, T1070.004, T1565.001, T1565.002, T1657]"
      ground_truth: "(low confidence) SlowMist: 'A service running on one of Product A's nodes was affected by a zero-day vulnerability' and Bitget: 'the attacker exploited a vulnerability in a third-party security product'; the zero-day exploitation step is the intrusion's start and has no exploitation technique id (T1190 if the service is externally reachable, otherwise T1068/T1210; the sources do not say)."
      ground_truth_url: "https://raw.githubusercontent.com/slowmist/Knowledge-Base/master/open-report-V2/incident-response/SlowMist%20Investigation%20Progress%20Report%20-%20Bitget_en-us.pdf"
      fix: "Add an exploitation technique only if a source states how the Product A service was reached; otherwise leave unmapped."
- entry: entries/2026-09-29/kaspersky-payload-gpo-encryptionless-ransomware.md
  verdict: factual-error
  defects:
    - code: F4
      where: "title / summary / body ¶2"
      claim: "title: while a separate binary hit ESXi and Linux servers | summary: the same incident deployed an actual PAYLOAD ransomware binary against the organization's ESXi/Linux servers | body: a genuine ransomware binary was deployed, but against the organization's ESXi/Linux servers"
      ground_truth: "Kaspersky: 'The only ransomware we found in this incident was PAYLOAD sample targeting ESXi on Linux servers' and 'On the target organization's Linux servers we saw an ESXi PAYLOAD variant'; it also notes 'the reviewed evidence does not indicate that PAYLOAD operators used any of these [ESXi policy-weakening] actions'. The source says a sample was found/seen on the servers; it does not state that the binary was executed, that it encrypted anything, or that it 'hit' the servers."
      ground_truth_url: "https://securelist.com/tr/payload-ransomware-via-group-policy/121335/"
      fix: "Use Kaspersky's wording: 'a PAYLOAD ransomware sample targeting ESXi was found on the organization's Linux servers' (title: 'while a separate PAYLOAD sample was found on its ESXi/Linux servers'); do not claim execution or impact there."
    - code: F14
      where: "body ¶2"
      claim: "a detection program keyed on ransomware executables, encryption behavior, or process-level anomalies would have produced zero alerts until the ransom wallpaper appeared, post-reboot, on every affected desktop simultaneously"
      ground_truth: "(low confidence) Kaspersky says only that 'an organization whose detection strategy depends on catching a ransomware executable would have seen nothing until the first endpoint rebooted and the ransom wallpaper appeared'; 'zero alerts' for encryption-behaviour and process-anomaly programs, and 'every affected desktop simultaneously', are the entry's extension (the same 2026-09-30 improvement removed 'invisible to endpoint tooling' elsewhere). Data exfiltration from file servers on 13 April is also described as 'proceeded unnoticed', which Kaspersky does not state."
      ground_truth_url: "https://securelist.com/tr/payload-ransomware-via-group-policy/121335/"
      fix: "Mirror Kaspersky: 'an organization relying on catching a ransomware executable would have seen nothing until the first endpoint rebooted and the ransom wallpaper appeared'; drop 'zero alerts', 'simultaneously' and 'unnoticed' or attribute them."
