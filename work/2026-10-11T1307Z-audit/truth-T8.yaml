      where: "labelled lines (Detection, Triage, Defender takeaway)"
      claim: "Entra ID / Azure AD self-service-password-reset audit events are the telemetry class ... scope SSPR to a specific security group ... remove alternate-email-OTP and security-question options ... enforce phishing-resistant MFA on every privileged role"
