      ground_truth: "LevelBlue's recommendation says scoping 'reduces the attack surface and makes enumeration harder', but its own analysis says 'Scoped SSPR, counterintuitively, leaks more information about the accounts that are inside the group than a blanket disabled policy does, because those accounts proceed all the way to method enumeration', and every error view (SSPR_0013 included) still confirms account existence, as the entry's own ¶1 states. The entry gives the recommendation without the contradicting caveat."
