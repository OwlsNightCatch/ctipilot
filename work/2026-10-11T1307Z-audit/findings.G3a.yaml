    source_url: https://www.microsoft.com/en-us/security/blog/2026/09/28/needymantis-unpacking-a-post-compromise-malware-family-used-in-targeted-operations/
  extended_notes: 'Single-source (Microsoft first-hand analysis; WebSearch surfaced The Hacker News, SecurityWeek, Dark Reading, Infosecurity Magazine and GridinSoft re-reports, none fetched, none independent). Exposure: the malware needs prior access; what a defender can check is whether signed legitimate software (Poedit, curl/libcurl, Vim, TightVNC, Intel/Broadcom/NVIDIA/Office components) sits in ProgramData or Program Files paths beside an unexpected DLL of the matching name, and whether Impacket-style share copies preceded it. Detection concept (behavioural): image-load telemetry for a signed binary loading an unsigned same-name DLL from a user-writable ProgramData path; a file named like the DLL without extension (the encrypted archive) beside it; process-creation with a mutex pattern <username>-<process>; web-proxy/egress logs for an HTTPS GET to a rare host that then upgrades to WebSockets and carries the stale Firefox/21.0 user-agent and a large Set-Cookie header; Impacket execution lineage on the source host. Microsoft publishes advanced-hunting queries for the file/path pairs, the C2 host and the user-agent. Hardening levers Microsoft lists: EDR in block mode, cloud-delivered protection/block at first sight, network protection, automatic attack disruption, ASR rules. Triage: legitimate Poedit/Vim/TightVNC installs live under their own Program Files folders; the discriminator is the same-name DLL''s signing state and its presence under ProgramData\USOShared, ProgramData\VIM, ProgramData\Intel etc. Rotation note: msft-ti ''standard'' record; the secblog feed returns only the newest 10 items, so a 10+ day lookback on that transport misses posts older than ~09-29; the topic-page WebFetch carries them.'
  classification_hint: reliability B, credibility 2 (single first-hand vendor analysis)
- title: 'Microsoft Defender Experts: phishing delivers a signed MSP360 RMM installer under document and meeting lure names, which then pulls ScreenConnect as a redundant second access channel'
  source_record_id: msft-ti
  published: '2026-09-29'
  sources:
  - url: https://www.microsoft.com/en-us/security/blog/2026/09/29/phishing-abuses-rmm-tools-persistent-access/
    publisher: Microsoft Security Blog (Microsoft Defender Experts)
    date: '2026-09-29'
    role: primary
  discovery_trace: 'first seen at: msft-ti, URL https://www.microsoft.com/en-us/security/blog/feed/ (msft-secblog recent 25, item ''Phishing Abuses RMM Tools for Persistent Access'', 2026-09-29) -> primary: https://www.microsoft.com/en-us/security/blog/2026/09/29/phishing-abuses-rmm-tools-persistent-access/ (extract). WebSearch (''MSP360 RMM phishing ScreenConnect Microsoft Defender Experts masqueraded installer'') returned only re-reports.'
  summary: In July 2026 Microsoft Defender Experts saw phishing campaigns across multiple industries distribute a legitimate, signed MSP360 RMM installer (v2.5.0.67) under deceptive file names (meeting invitations, Zoom/Google Meet/Adobe update prompts, RSVP e-cards, job offers, DHL and a 'SSA.GOV statement' lure), reached through document-sharing and installer-themed landing pages and downloaded from attacker domains, compromised sites and legitimate cloud storage (Amazon S3, Cloudflare R2, Dropbox, GitLab, Supabase). After UAC elevation the installer registers two services (RMM.Agent.exe, RMM.Agent.Launcher.exe), Run-key autostarts and an inbound Windows Firewall allow rule for UDP 48678; the RMM agent then launches PowerShell, downloads ClientSetup.msi and installs ConnectWise ScreenConnect silently via msiexec /qn, giving the operator a second, independent channel. Through ScreenConnect the actor staged credential-theft, data-collection and window/cursor-hiding utilities under the user's Documents\ScreenConnect\Temp folders (including copies on OneDrive-redirected paths). Microsoft attributes the activity to no named actor and states it did not observe exploitation of ScreenConnect itself; where UAC elevation is refused the installation aborts before any persistence is created.
  region_nexus: global multi-industry; the SSA.GOV lure targets US users, the technique is sector-agnostic and applies to Swiss public-sector helpdesk-allowlist gaps
  primary_sector_nexus: indirect
  sector: cross-sector
