  summary: 'Microsoft published its annual Digital Defense Report on 2026-10-01 (reporting period July 2025 to June 2026). Microsoft''s government-facing companion post states that government agencies and services were the sector most impacted by cyber threats, 27% of observed activity (17% in 2025), and are also the most frequently targeted sector for nation-state activity. The report''s incident-response initial-access table (DART findings, report p.33) shows exploitation of public-facing applications rising from 15% to 24% of cases and phishing from 7% to 23%, while valid accounts fell from 17% to 13% and social engineering from 15% to 7%; Microsoft names edge devices (firewalls, VPN gateways, routers) a primary target and, for the next year, open-source supply-chain compromise, edge-device attacks and AI as force multiplier as the biggest threats. Switzerland is named in three data sets: in Microsoft''s leak-site-derived ransomware victim-country table (pp.76-77) Swiss victims rose from 29 to 59 (+103%), Germany from 59 to 222 (+276%), and ''government agencies and services'' from 57 to 133 victims; in the nation-state regional activity map Switzerland shows 20 observed events (UK 76, Germany 45, Ukraine 42, France 28, Italy and Spain 25); and Switzerland holds 2% of Russia-attributed nation-state notifications. Microsoft itself cautions that leak-site data ''may present an incomplete or distorted view''; in its own Defender telemetry Akira was the most active ransomware (22%, up 150%) while on leak sites Qilin listed the most victims (16.4%). The report also says a Russian actor used edge-device access in a coordinated destructive attack on Poland''s energy sector in December 2025 (Microsoft''s claim, no independent source read). A critical-infrastructure and SLED chapter (state and local government and education plus critical infrastructure; pp.85-88) reports that among attacks on those sectors from 1 November 2025 to 30 April 2026 research and academia took 38%, transportation 22%, government 13%, communications 11% and emergency services 1%; that cloud identity abuse was the most observed technique (62% for SLED, 78% for critical infrastructure; password spray 38% for SLED); that OAuth consent abuse with ShinyHunters-overlapping tradecraft re-emerged in research and academia; and that Truebot (39%), information stealers (38%) and AzureHound (12%) lead the tooling seen against critical infrastructure. Its recommendations include whole-of-state shared-service models, phishing-resistant MFA, disabling unmanaged device-code flow and pooled civil cyber defence for small jurisdictions.'
  region_nexus: Switzerland named directly (ransomware leak-site victims 29->59; 20 nation-state observed events; 2% of Russia-attributed notifications); Europe-wide (Germany +276% ransomware victims, Poland energy attack)
