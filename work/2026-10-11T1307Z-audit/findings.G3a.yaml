  - quote: Microsoft did not observe exploitation of ScreenConnect software itself; rather, threat actors abused legitimately obtained remote administration software to establish and maintain access.
    attribution: Microsoft Security Blog
    source_url: https://www.microsoft.com/en-us/security/blog/2026/09/29/phishing-abuses-rmm-tools-persistent-access/
  extended_notes: 'Single-source (Microsoft first-hand; re-reports by The Hacker News, GridinSoft, SOC Prime surfaced by WebSearch, not fetched). The post also describes a separate July 2026 set in which FaronicsDeployAgent.exe, a legitimate deployment and remote-access application, was the initial remote-management platform and was then used to download and install ScreenConnect the same way.Exposure: any environment that lets standard users run unsigned-by-policy installers and has no RMM allowlist; MSP360 and ScreenConnect are both legitimate, signed tools so reputation controls pass them. Detection concept: process-creation with parent RMM.Agent.exe launching powershell.exe with execution-policy change and Invoke-WebRequest to ClientSetup.msi, then msiexec /qn; new services named RMM.Agent*; first appearance of ScreenConnect.ClientService.exe on a host with no helpdesk ticket; Windows Firewall rule creation for RMM.Agent.exe UDP 48678; eventcreate.exe writing ''MSP360 RMM Agent installer'' events; unexpected RMM agent inventory versus the organisation''s sanctioned RMM list. Triage: a sanctioned MSP using MSP360 will show the agent from a managed deployment channel under a known tenant, not from a user''s Downloads folder under a document-style filename. Hardening: RMM application allowlisting (WDAC/AppLocker/Intune), block unapproved RMM download domains, require admin approval for UAC elevation of installers, and Defender ''suspicious remote-management'' alerts.'
  classification_hint: reliability B, credibility 2
- title: 'Proofpoint: China-aligned TA419 runs rapport-building impersonation of AI-policy figures into a Microsoft 365 adversary-in-the-middle page built on Frameless BitB'
  source_record_id: proofpoint
