  summary: Proofpoint reports that TA419, a China-aligned espionage actor it has tracked since April 2025 against US- and Japan-based think tanks, defense contractors, universities and law firms (activity not previously reported publicly), ran July 2026 credential-phishing campaigns that impersonated a former White House OSTP official and a prominent economist to approach AI-policy experts, after a February 2026 campaign that impersonated an Anthropic employee. The opening email is benign (an invitation to join an 'AI Policy Advisory Committee' or contribute to a Senate report); only after the target replies does TA419 send a shortened URL that leads, through a Cloudflare Turnstile gate behind a fake OneDrive loading screen, to a Microsoft 365/Entra adversary-in-the-middle page. The kit is Frameless BitB (open-source browser-in-the-browser overlay with an Evilginx phishlet) targeting the first-party OfficeHome application, extended with a telemetry and automation script that tracks the victim's progress through the sign-in flow, auto-accepts 'Keep me signed in' and auto-submits one-time codes, so MFA passes and the session cookie is captured. Proofpoint's recommendation is phishing-resistant, origin-bound authentication such as passkeys and out-of-band verification of unsolicited subject-matter outreach; it assesses TA419 will keep targeting policy experts on technologies and geographies of interest to the Chinese government.
  region_nexus: US and Japan targets named; no Swiss or EU targeting stated. Transferable technique class for any policy, diplomatic or research staff in Swiss federal bodies
