- title: 'NeedyMantis: Microsoft dissects a modular post-compromise framework used in China-aligned intrusions at telecoms, universities, intergovernmental bodies and government contractors, found through the DAEMON Tools supply-chain compromise'
  source_record_id: msft-ti
  published: '2026-09-28'
  sources:
  - url: https://www.microsoft.com/en-us/security/blog/2026/09/28/needymantis-unpacking-a-post-compromise-malware-family-used-in-targeted-operations/
    publisher: Microsoft Threat Intelligence
    date: '2026-09-28'
    role: primary
  discovery_trace: 'first seen at: msft-ti, URL https://www.microsoft.com/en-us/security/blog/topic/threat-intelligence/ (WebFetch listing, item dated Sept 28; the post was NOT among the 10 items returned by python3 tools/fetch_source.py msft-secblog recent 25, whose feed starts 2026-09-29) -> primary: https://www.microsoft.com/en-us/security/blog/2026/09/28/needymantis-unpacking-a-post-compromise-malware-family-used-in-targeted-operations/ (extract). Secondary coverage seen only as WebSearch result titles (thehackernews.com, securityweek.com, darkreading.com, infosecurity-magazine.com), not fetched.'
  summary: 'Microsoft Threat Intelligence describes NeedyMantis, a modular post-compromise malware family seen in a limited number of targeted operations against telecommunications organisations, universities, medical nonprofits, intergovernmental organisations and government contractors, in use since at least October 2025. Microsoft found it by pivoting from indicators in Kaspersky''s DAEMON Tools supply-chain investigation and names Storm-3069 (its designator for the DAEMON Tools compromise activity) as at least one operator; it assesses the activity originates from China but has not attributed Storm-3069 to a Chinese nation-state actor and says more than one operator may hold the malware. Microsoft has not seen NeedyMantis itself delivered through a supply-chain compromise: it arrives after access exists. In one case the operator used Impacket to copy a legitimate application, the malicious DLL and a custom encrypted archive from a network share and run them. The first-stage loader is a DLL sideloaded when the bundled legitimate program runs (analysed sample: WinSparkle.dll replacing the Poedit update component; other observed pairings include libcurl.dll, vim64.dll, dbghelp.dll, jli.dll, nvml.dll under ProgramData or Program Files paths), it extracts a second-stage x64 shellcode blob stored as ''encryptbase64.ps1'', which unpacks the main component from a custom archive format whose offsets and XOR keys vary per sample. The main component creates a mutex named <username>-<process name>, reads a config file disguised as dnsapi.dll, beacons with an HTTPS GET whose Set-Cookie header carries compressed system information, then upgrades to WebSockets with a custom binary protocol (RC4 after a key exchange that sends a ''google.com'' decoy buffer), and a hard-coded Firefox/21.0 user-agent; its handful of commands only load, unload and dispatch data to additional modules whose functions Microsoft has not confirmed.'
  region_nexus: global; sector set (telecom, universities, intergovernmental organisations, government contractors) overlaps European public-sector suppliers; the DAEMON Tools campaign it grew out of is already in the store as targeting EU governments
  primary_sector_nexus: indirect - government contractors and intergovernmental organisations named as victims
  sector: public-sector, telecom, education
