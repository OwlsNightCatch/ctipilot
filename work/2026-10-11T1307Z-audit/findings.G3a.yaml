  extended_notes: 'Single primary source; media re-reports (letsdatascience, techjuice) surfaced by WebSearch disagree on dates (February vs July start) because the post covers both. Check Point''s 2026-10-05 digest is a pointer, not independent evidence. Exposure: Microsoft 365/Entra tenants whose users can sign in with password plus phishable MFA; the lure targets individuals, not a product flaw. Detection concept: Entra sign-in logs showing the OfficeHome first-party client (client_id 4765445b-32c6-49b0-83e6-1d93765276ca) authenticated from an unfamiliar ASN/proxy within seconds of a mail-click, followed by session-token replay from a different IP/user-agent; mail-flow evidence of a short benign first message, reply, then a URL-shortener link; proxy logs for a Cloudflare Turnstile interstitial that redirects to a second domain serving a OneDrive-styled page. Hardening: passkeys / FIDO2 or certificate-based MFA for policy and diplomatic staff, Conditional Access token protection and sign-in-frequency limits, blocking URL-shortener redirection chains at the mail gateway. Triage: legitimate OneDrive share notifications come from the tenant''s own mail domain and 1drv.ms/sharepoint.com hosts, not a first-hop domain behind a Turnstile gate.'
