  extended_notes: 'Single-source: Microsoft is the first-party author of its own report; the blog, the On-the-Issues post and the PDF are one organisation, not independent. Secondary coverage exists (aiweekly.co, zawya, italiaoggi surfaced by WebSearch) but was not fetched and adds no independent data. Swiss figures were read from tables in the PDF text layer (ToUnicode decode of 103 pages; page numbers approximate): ransomware impacted-country table p.77 (Switzerland 29 -> 59, +103%; Germany 59 -> 222; Italy 48 -> 135; Netherlands 36 -> 56; US 724 -> 1,087), impacted-industry table p.76 (government agencies and services 57 -> 133; total 8,749 -> 8,521 with ~5.8k ''unknown''), regional nation-state map p.38, Russia top-ten country/sector tables p.42-43 (Russia targets: think tanks/NGOs 25%, government 14%), SLED/critical-infrastructure chapter pp.85-88 (Figures 1-4; data windows 2025-11-01 to 2026-04-30 and 2026-03-01 to 2026-06-30). Exposure: any Swiss public-sector body is the report''s most-targeted sector. Detection/hardening levers the report states: phishing-resistant MFA and passkeys, tiered administration, centralised high-fidelity logging on edge devices, rapid edge-device patching, cross-signal correlation, SLED shared-service/federated SOC models. Why a Tier 2/3 reader cares: the shift of IR initial access to phishing (23%) and public-facing exploitation (24%) while ''social engineering'' and ''valid accounts'' shrink is a calibration input for detection-priority; the 15.8% rise in ransom detonations and Akira/Qilin dominance is Microsoft telemetry, not leak-site counts. Report is also flagged ANNUAL REPORT for the audit''s periodic-report check; the store carries no entry for it (grep of entries/ and registry found none). Rotation note: the 2026-10-06 S3 note on msft-ti already says the topic page misses News-type posts such as the DDR; nothing in the store records it.'
