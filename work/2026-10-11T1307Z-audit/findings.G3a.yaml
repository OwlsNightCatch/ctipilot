- title: 'Lab52: second DragonForce backdoor adds an MQTT fallback channel behind the Teams TURN relay, deployed by javaw.exe/jli.dll sideloading with a DPAPI-bound next stage'
  source_record_id: lab52
  published: '2026-10-01'
  sources:
  - url: https://lab52.io/blog/backdoors-in-the-dungeon-turn-mqtt-abused-by-dragonforce/
