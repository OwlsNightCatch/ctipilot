  summary: 'ESET traces the evolution of MATCHBOIL, a C# downloader of the Russia-aligned UAC-0099 group, across samples compiled from April 2024 to April 2026: it moved from a one-shot downloader to a two-minute timer that can pull a refreshed payload, from Unicode-symbol renaming and custom XOR string encryption to the Eziriz .NET Reactor obfuscator, from a Run-key plus scheduled task to Run-key only to scheduled task, and added sandbox checks and a GUI lure. It arrives through spear-phishing links that download an archive with a VBScript the victim must run; it fingerprints the host (CPUID, BIOS serial), makes three HTTPS requests to the C2 (a numeric value for a custom header, an HTML-formatted response carrying a hex-encoded payload, a config string) and usually installs the C# backdoor MATCHWOK. ESET says all victims in its telemetry were in Ukraine (transport and manufacturing in 2025, an energy company in June 2026) and notes UAC-0099 can act as an initial access broker for Sandworm.'
