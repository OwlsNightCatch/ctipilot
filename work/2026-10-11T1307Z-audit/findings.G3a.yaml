  discovery_trace: 'first seen at: lab52, URL https://lab52.io/blog/feed/ (6 dated items; 2026-10-01 13:28 ''Backdoors in the Dungeon - TURN & MQTT Abused by DragonForce'') -> primary: https://lab52.io/blog/backdoors-in-the-dungeon-turn-mqtt-abused-by-dragonforce/ (extract); the post itself links Symantec''s DragonForce Teams report already cited by the store entry'
  summary: 'Lab52 documents two DragonForce backdoors that tunnel through legitimate Microsoft Teams TURN servers. The first (Shell.dll, a Go binary injected directly into memory, first-deployment phase, linked by Lab52 to Symantec''s earlier report) resolves its C2 in memory and keeps an SSH private key for its channel. The second is the resident one: a scheduled task left by an earlier stage runs the legitimate javaw.exe, which sideloads jli.dll; that loader decrypts a DPAPI-protected next-stage file (rvsdiqw.txt) so it only runs on the machine it was prepared for, and jli.dll differs in hash on every host. That backdoor speaks a TURN-carried protocol (TRN1 UUID-prefixed requests, MD5-checked block transfers, XOR-keyed Base64 payloads executed with CreateThread) and a second channel over MQTT used if TURN fails: it registers a session topic, polls a per-UUID task topic, fetches chunked payloads from derived topics and dispatches on a ''cmdnum'' (1 download via URL, 2 run a PowerShell line, 3 run payload, 4 reverse connect to a host/port). On any communication failure it sleeps five minutes and encrypts its own memory region. Lab52 describes DragonForce as a ransomware-as-a-service ''cartel'' that now supplies access, persistence tooling and resilient C2 to affiliates.'
  region_nexus: global; no region or victim stated (Lab52 is Spain-based; its IOC list includes compromised WordPress sites in several countries)
