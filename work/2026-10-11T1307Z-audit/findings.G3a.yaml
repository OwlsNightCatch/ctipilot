  novelty: update-of:2026-06-17/dragonforce-abuses-microsoft-teams-turn-relays-for-c2-and-ch
  delta: 'The store entry (Symantec, 2026-06-16) covers Teams TURN relay C2 and the BYOVD chain; a grep of it finds no MQTT, jli.dll or javaw.exe. New in Lab52: the resident second backdoor, the javaw.exe -> jli.dll sideload, DPAPI-bound next stage, MQTT fallback with cmdnum task set, and the sleep-and-encrypt behaviour.'
  evidence:
  - quote: One of the latest operations uncovered involving DragonForce is the abuse of legitimate TURN (Traversal Using Relays around NAT) servers to encapsulate communications between a malicious implant and the attacker’s infrastructure.
    attribution: Lab52 (S2 Grupo)
    source_url: https://lab52.io/blog/backdoors-in-the-dungeon-turn-mqtt-abused-by-dragonforce/
  - quote: the second type is notable for its use of MQTT as an additional communication channel in the event that communication through TURN fails.
    attribution: Lab52 (S2 Grupo)
    source_url: https://lab52.io/blog/backdoors-in-the-dungeon-turn-mqtt-abused-by-dragonforce/
  extended_notes: 'Single-source for the new technical content (Lab52); the TURN-abuse background is already corroborated by Symantec and BleepingComputer in the store entry. Detection concept: scheduled-task creation that launches javaw.exe from a non-Java install path, javaw.exe image-loading a jli.dll from outside the JRE bin directory, outbound TURN/STUN (UDP/TCP 3478-class) sessions to Microsoft Teams relay addresses from servers or workstations with no Teams use, and MQTT egress (default or custom ports) from hosts that run no MQTT clients; sleep-then-memory-encrypt behaviour is visible only to memory-scanning EDR. Triage: legitimate Java applications load jli.dll from the JRE''s own bin folder; a per-host unique jli.dll beside a copy of javaw.exe elsewhere is the discriminator. Hardening: egress-block TURN/STUN from server segments, restrict MQTT egress, application control on javaw.exe copies.'
  classification_hint: reliability B, credibility 2
