  text: The title and CVE type called the flaw code execution, but Oracle and CISA describe a takeover of Oracle Payments and the observed exploit is a file read. The fix is Oracle's May 2026 Critical Security
    Patch Update, not a quietly shipped Critical Patch Update; the CWE wording comes from CISA's catalog, not Oracle; no source ties ShinyHunters or UNC6240 to EBS; and the European public-sector prevalence
    claim is replaced by Shadowserver's exposure count. The entry gains BleepingComputer and the KEV record as sources, the KEV forensic-triage flag, and a shorter hunt action. The Oracle advisory is dated
    2026-05-21, its own date; 28 May is Help Net Security's compromise-assessment threshold, not a patch date; the patch action names the Critical Security Patch Update, and a hunting action that restated
    the Detection line is dropped.
