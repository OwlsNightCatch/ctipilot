- claim_id: 10227fad09
  entry: 2026-09-24/closedquorum-llm-orchestrated-c2-implant
  surface: body
  kind: uncited
  text: Each provider must respond with a fixed JSON schema naming one of four actions; `interModelDiscussion()` tallies the providers' decisions by plurality vote and executes the winner, discarding any
    malformed or off-schema response.
- claim_id: 326267f8d1
  entry: 2026-09-24/closedquorum-llm-orchestrated-c2-implant
  surface: body
  kind: uncited
  text: The four possible actions are `steal` (simultaneous LSASS memory dumping via `SeDebugPrivilege` and `MiniDumpWriteDump`, Chrome/Edge/Firefox saved-credential harvesting, and MetaMask/Exodus/Ethereum
    wallet data collection), `inject` (Early Bird APC injection into a suspended process by default, or PEB-walk process hollowing when a model selects that exploit type), `persist` (establishes three mechanisms
    — a Windows-Update-themed Registry Run-key value, a scheduled task, and a permanent WMI event subscription that fires a script every 60 seconds), and `move`, which has no handler in the public build.
