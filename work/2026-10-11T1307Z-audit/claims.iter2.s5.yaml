  entry: 2026-05-09/cve-2026-43284-cve-2026-43500-linux-dirty-frag-deterministic
  surface: body
  kind: cited
  text: 'It is two page-cache write flaws: **CVE-2026-43284** in the xfrm-ESP (IPsec) receive path, in the kernel since 2017 and fixed in mainline commit f4c50a4034e6, and **CVE-2026-43500** in RxRPC, in
    the kernel since 2023 and fixed in mainline commit aa54b1d27fe0 ('
  urls:
  - https://github.com/V4bel/dirtyfrag/blob/master/README.md
- claim_id: 393fe4726f
  entry: 2026-05-09/cve-2026-43284-cve-2026-43500-linux-dirty-frag-deterministic
  surface: body
  kind: cited
  text: In both, a page-cache page planted with `splice()` sits in a fragment of a network buffer and the receiving code decrypts it in place, so a 4-byte store lands in the cached copy of a file such as
    a setuid binary; the result is deterministic root without a race window (
  urls:
  - https://github.com/V4bel/dirtyfrag/blob/master/assets/write-up.md
- claim_id: 1d13ae9241
  entry: 2026-05-09/cve-2026-43284-cve-2026-43500-linux-dirty-frag-deterministic
  surface: body
  kind: cited
  text: The ESP variant needs the privilege to create a user namespace, which Ubuntu sometimes blocks through AppArmor; the RxRPC variant needs no namespace but depends on the `rxrpc` module, which most
    distributions do not ship and Ubuntu loads by default (
  urls:
  - https://github.com/V4bel/dirtyfrag/blob/master/README.md
