  - title: "Bricksforge (WordPress) CVE-2026-85097: unauthenticated arbitrary file upload to PHP code execution (CVSS 10.0) under active exploitation since 2026-10-07, fixed in 3.1.8.10"
    source_record: patchstack
    published: "2026-10-08"
    sources:
      - { url: "https://patchstack.com/articles/critical-unauthenticated-arbitrary-file-upload-vulnerability-exploited-in-bricksforge-plugin/", publisher: "Patchstack", date: "2026-10-08", role: "primary" }
    discovery_trace: "first seen at: patchstack record, feed URL https://patchstack.com/feed/ (item dated 2026-10-08) -> extract of https://patchstack.com/articles/critical-unauthenticated-arbitrary-file-upload-vulnerability-exploited-in-bricksforge-plugin/ (primary: Patchstack's own exploitation telemetry; the article links the Bricksforge changelog as the vendor advisory, not fetched). Single source: no independent corroboration found in this run."
    summary: |
      Patchstack reports that CVE-2026-85097 in the Bricksforge plugin for WordPress (an extension for the Bricks Builder theme; the article's card shows 6K, apparently installations) is exploited in the wild: its telemetry saw exploitation attempts from 2026-10-07 21:47 UTC. The flaw is an unauthenticated arbitrary file upload (CVSS 10.0): the plugin validates a file's MIME type at first upload but, when a form is submitted, trusts the client-sent `temporaryFileUploads` metadata and does not validate its `url` field. The sequence is: request a nonce from the unauthenticated `bricksforge_regenerate_nonce` AJAX endpoint, upload a GIF/PHP polyglot that passes the MIME check into the plugin's temporary upload directory, submit a form whose `file` path points at the image but whose `url` ends in a PHP extension, and request the resulting file to execute the code. Affected: versions up to and including 3.1.8.9; fixed in 3.1.8.10. Patchstack observed all but one request on the REST route `/wp-json/bricksforge/v1/form_submit` (the other on `admin-ajax.php` with the `bricksforge_form_submit` action), 63 source addresses on mixed datacenter, proxy and residential infrastructure, evasion attempts with alternative PHP extensions, case changes and URL-encoded extensions, and says the pattern points to automation without attributing an actor. The detection hook is the mismatch between an image-typed server-side path and a PHP-typed destination URL in the submitted parameter, plus unexpected PHP files under the plugin's temporary upload directory or the dated uploads directories. Patchstack states it deployed a mitigation rule for its customers.
