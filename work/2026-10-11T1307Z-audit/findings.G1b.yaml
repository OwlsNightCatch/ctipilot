    summary: |
      Cisco's 2026-10-07 publication clears the pre-auth network CVSS 9.0+ bar on widely deployed enterprise gear in four places; Cisco states in each advisory that its PSIRT is not aware of malicious use, and NCSC Switzerland relayed the NX-OS and License On-Prem items on 2026-10-09 (advisory 13044, exploitation status listed as unknown). (1) NX-API RCE, CVE-2026-76471, CVSS 9.8: insufficient input validation in NX-API lets an unauthenticated remote attacker send a crafted HTTP request and execute code as root or crash the device; affected are Nexus 3000 and Nexus 9000 in standalone NX-OS mode with NX-API enabled (disabled by default; `show feature | include nxapi`) and UCS 6300 Fabric Interconnects, where exploitation needs low-privileged credentials on the UCS Manager XML API (enabled by default) and Cisco lowers the rating to High. Cisco revised the advisory on 2026-10-08 to update the fixed-release table; no workaround, but a Live Protect shield exists for NX-OS 10.6(3). (2) MPLS OAM RCE, CVE-2026-76465, 9.8: a crafted MPLS echo-request to an IP address of the switch gives unauthenticated root code execution when MPLS OAM is enabled (off by default; `show feature | include mpls_oam`; Nexus 9000 with a Silicon One ASIC not affected); `no feature mpls oam` is the mitigation. (3) NGOAM RCE, CVE-2026-76485 / 76486 / 76501, each 9.8: crafted IP packets to a switch with NGOAM enabled; CVE-2026-76485 needs only NGOAM, CVE-2026-76486 additionally SRv6 or NV Overlay with a learned VXLAN EVPN peer, CVE-2026-76501 NGOAM plus SRv6; `no feature ngoam` is the mitigation. (4) License (Smart Software Manager) On-Prem: CVE-2026-20328 (9.1, unauthenticated arbitrary account password reset including administrators) and CVE-2026-76454 (9.1, unauthenticated Smart Licensing Utility API, arbitrary file write or DoS) affect every release regardless of configuration (fixed in 10-202608); a companion hardening release groups internally found flaws by CWE: CVE-2026-76482 (CVSS 10.0, improper verification of cryptographic signature), CVE-2026-76480 (9.8, missing authentication for a critical function), CVE-2026-76483 (9.1, insufficiently protected credentials) and CVE-2026-76484 (8.8, code injection), first fixed in 10-202609, with 9-202601 and earlier requiring migration; Cisco says these were found with existing tests plus frontier AI models. The NX-OS hardening release adds CWE-grouped CVE-2026-76455 (9.8 improper access control), CVE-2026-76459 (9.8 out-of-bounds write) and four 8.6 to 8.8 items that apply regardless of device configuration, and the APIC hardening release adds CVE-2026-76498, 76499 and 76500 (each 9.8); the per-product fixed-release tables are dynamic elements extract did not return (Cisco Software Checker is the vendor's lookup). A Finesse SSRF (CVE-2026-20362, 7.2) in the same bundle has a public announcement but no malicious use; the rest is medium (ACI contract bypass, APIC authenticated flaws, Python sandbox escape, control-plane DoS).
