  - title: "HPE Networking ClearPass Policy Manager (HPESBNW05158): nine CVSS 9.8-9.9 flaws incl. unauthenticated deserialization RCE, authentication bypasses and unauthenticated SQL injection; fixed in CPPM 6.14.1 and 6.11.16"
