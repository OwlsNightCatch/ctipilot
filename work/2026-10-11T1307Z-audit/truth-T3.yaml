      record baseSeverity CRITICAL, 9.8) and the title itself says so. 'Two maximum-severity flaws' overstates S4GET; also
      OVERPASS's HTTP/GUI/RFC routes and S4GET's Message Server route are different ports, not 'the same ports'.
    ground_truth_url: https://cveawg.mitre.org/api/cve/CVE-2026-58240
