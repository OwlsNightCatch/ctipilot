  verdict: imprecision
  defects:
  - code: F8
    where: labelled line **Exposure:**
    claim: '**Exposure:** SAP systems on kernel 9.16, 9.18, 9.19 or 9.20 below the fixed patch levels (PL 100, 32, 17 and
      7 respectively); the kernel decides, not the application on top of it ...'
    ground_truth: 'That scope and those patch levels are S4GET''s (CVE-2026-58240: KERNEL 9.16-9.20, Note 3759472). OVERPASS
      (CVE-2026-44756, the CVSS 10.0 flaw) affects a much wider set: CERT-EU lists KRNL64NUC 7.22/7.22EXT, KRNL64UC 7.22/7.22EXT/7.53/8.04,
      KERNEL 7.22/7.53/7.54/7.77/7.89/7.93/8.04/9.16-9.20 and WEBDISP 9.16-9.20 (the entry''s own cves[] record carries this
      list), and Onapsis says ''SAP Security Note 3747649 is the authoritative source describing which builds are affected''.
      The Exposure line never says it is S4GET-only, so a reader on kernel 7.53 (ECC / classic ABAP) would conclude both flaws
      miss them. The body ¶1 gives no OVERPASS version scope either.'
    ground_truth_url: https://cert.europa.eu/publications/security-advisories/2026-011/
    fix: 'Split the line: OVERPASS affects kernel releases 7.22 through 9.20 (check against Note 3747649); S4GET affects 9.16-9.20
      below PL 100/32/17/7.'
