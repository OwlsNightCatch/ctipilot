- entry: entries/2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen.md
  verdict: factual-error
  defects:
  - code: F3
    where: section 2026-06-17T05:14:33Z, paragraph 2 (and updates[] record summary)
    claim: Arctic Wolf's telemetry documents post-exploitation consistent with Impacket tooling (SMB lateral movement, anonymous
      NTLM logon, share enumeration and domain-user discovery) across insurance, finance, manufacturing, education, engineering
      and healthcare targets in North America and Europe
    ground_truth: Arctic Wolf 2026-06-11 describes the Impacket-consistent activity as 'automated internal SMB reconnaissance',
      'limited internal network scanning, including network share enumeration and domain user discovery', and states 'observed
      follow-on activity remained limited ... did not progress substantially beyond the initial SMB session setup and lightweight
      reconnaissance'; no lateral movement is reported. The sector/region list ('insurance, finance, manufacturing, education,
      engineering, and healthcare ... Europe and North America') describes where exploitation (mostly failed or authentication-only)
      was seen, not where the Impacket subset occurred.
    ground_truth_url: https://arcticwolf.com/resources/blog/arctic-wolf-observes-increase-in-palo-alto-networks-globalprotect-authentication-bypass-exploitation-via-cve-2026-0257/
    fix: Say 'SMB session setup and Impacket-consistent reconnaissance (anonymous NTLM logon, share enumeration, domain-user
      discovery) in a subset of intrusions'; drop 'lateral movement'; attach the sector and region list to the exploitation
      wave as a whole, not to the Impacket subset.
  - code: F3
    where: section 2026-06-10T05:00:16Z, paragraph 2 citation
    claim: patched in 12.1.7+, 11.2.12+, 11.1.15+, 10.2.18-h6+ and corresponding Prisma builds ([Palo Alto Networks, 2026-06-03](https://security.paloaltonetworks.com/CVE-2026-0257))
    ground_truth: (low confidence) The PSIRT page's own dateline is 2026-05-13 (article:published_time 2026-05-13T16:00:00Z,
      'Published 2026-05-13'); no 2026-06-03 revision date appears on the page. The main body cites the same page as 2026-05-13.
      The fixed builds themselves match the solution table.
    ground_truth_url: https://security.paloaltonetworks.com/CVE-2026-0257
    fix: Cite the page as 'Palo Alto Networks PSIRT, 2026-05-13' like the rest of the entry.
  - code: F5
    where: section 2026-06-10 last sentence; section 2026-06-17 last sentence
    claim: Hunt GlobalProtect gateway logs for `auth-method=cookie` from unexpected source IPs. / audit sessions since 17
      May for Impacket-pattern lateral movement (EID 4624 Type 3 from unexpected IPs, SMB enumeration EID 5140/5145)
    ground_truth: Neither the field spelling `auth-method=cookie` nor the Windows event ids 4624/5140/5145 appear in any cited
      source (Rapid7's log shows an authentication-method column value 'Cookie'; Arctic Wolf 2026-06-11 names 'NTLM anonymous
      logon' and 'SMB session setup', no event ids). Unsourced detection specifics.
    ground_truth_url: https://www.rapid7.com/blog/post/etr-rapid7-observed-exploitation-of-pan-os-globalprotect-authentication-bypass-vulnerability-cve-2026-0257/
    fix: Describe the telemetry class without invented field/event ids, or drop the parenthetical (the main-body Detection
      line already carries the sourced hunt).
  - code: F11
    where: techniques
    claim: 'techniques: [T1190, T1133, T1003.001, ... T1490]'
    ground_truth: (low confidence) Rapid7 describes forging authentication-override cookies from the certificate public key
      (the core of the flaw); no Forge Web Credentials id is mapped. T1606.001 'Web Cookies' is active in the pinned dataset
      (v19.2). All 15 listed ids are active and source-supported.
    ground_truth_url: https://www.rapid7.com/blog/post/etr-rapid7-observed-exploitation-of-pan-os-globalprotect-authentication-bypass-vulnerability-cve-2026-0257/
    fix: Optionally add T1606.001.
  - code: F11
    where: sectors
    claim: 'sectors: public-sector, finance, healthcare, education'
    ground_truth: (low confidence) Arctic Wolf 2026-06-11 lists 'insurance, finance, manufacturing, education, engineering,
      and healthcare' as the exploited sectors; no cited source names public-sector victims of CVE-2026-0257 exploitation
      (Arctic Wolf's Qilin report only says Qilin affiliates target 'government' generally). `public-sector` reflects constituency
      relevance rather than a sourced victim sector.
    ground_truth_url: https://arcticwolf.com/resources/blog/arctic-wolf-observes-increase-in-palo-alto-networks-globalprotect-authentication-bypass-exploitation-via-cve-2026-0257/
    fix: Add insurance and manufacturing; drop public-sector unless a source names it.
  notes: CVE/CVSS 7.8 (CVSS-B and BT, v4.0, E:A), CWE-565, fixed builds, Prisma Access builds, KEV dateAdded 2026-05-29 and
    knownRansomwareCampaignUse=Known (KEV catalog 2026.10.08 fetched), NCSC-CH post 12605 edit 2026-06-16, three evidence
    quotes (verbatim), AW Qilin chain (all items) verified. Classification A/1 and priority high consistent.
- entry: entries/2026-05-30/cve-2026-0257-pan-os-globalprotect-pre-auth-vpn-authenticati.md
  verdict: factual-error
  role: same-finding twin of the survivor entries/2026-05-30/cve-2026-0257-palo-alto-pan-os-globalprotect-pre-auth-authen.md
  defects:
  - code: F4
    where: body, Background ¶1
    claim: Palo Alto's own security advisories (AA23-250A, AA24-075A) have repeatedly highlighted GlobalProtect as a target
      surface; this vulnerability is the most directly exploitable advisory in that series.
    ground_truth: AA23-250A is a CISA joint advisory (2023-09-07) titled 'Multiple Nation-State Threat Actors Exploit CVE-2022-47966
      and CVE-2022-42475' (Zoho ManageEngine ServiceDesk Plus and a firewall CVE), not a Palo Alto advisory and not about
      GlobalProtect; https://www.cisa.gov/news-events/cybersecurity-advisories/aa24-075a returns HTTP 404. No cited source
      supports 'most directly exploitable advisory in that series'.
    ground_truth_url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-250a
    fix: Delete the sentence.
  - code: F4
    where: body, Background ¶1
    claim: The authentication override feature, introduced to support certain SSO and clientless configurations, allows a
      GlobalProtect portal or gateway to issue signed cookies that bypass the normal MFA/SAML authentication flow on subsequent
      connections
    ground_truth: 'Rapid7: the feature ''allows a GlobalProtect portal or gateway to issue cookies to an authenticated user''
      who ''can then use an authentication override cookie in future communications ... in lieu of re-authenticating via credentials,
      akin to a bearer token. This is not a feature that is enabled by default.'' No source says it was introduced for SSO/clientless
      configurations, that the cookies are ''signed'', or that it bypasses MFA/SAML; Rapid7''s decompilation shows ''no signature
      verification of any kind''.'
    ground_truth_url: https://www.rapid7.com/blog/post/etr-rapid7-observed-exploitation-of-pan-os-globalprotect-authentication-bypass-vulnerability-cve-2026-0257/
    fix: Use Rapid7's description (bearer-token-like cookie, off by default).
  - code: F4
    where: body, Vulnerability mechanics
    claim: Palo Alto's auth-override cookie uses that same certificate to sign and encrypt session tokens. An attacker who
      extracts the public key can derive the encryption material needed to mint a valid authentication override cookie
    ground_truth: 'Rapid7: the cookie is encrypted with the certificate and ''decrypted using a private key. The decrypted
      content is then trusted implicitly, with no signature verification of any kind occurring after decryption''; anyone
      who knows the public key ''can successfully forge and encrypt an arbitrary authentication override cookie''. ''Sign''
      is wrong; the flaw is the absence of integrity checking (CWE-565).'
    ground_truth_url: https://www.rapid7.com/blog/post/etr-rapid7-observed-exploitation-of-pan-os-globalprotect-authentication-bypass-vulnerability-cve-2026-0257/
    fix: Replace 'sign and encrypt' with 'encrypt and decrypt, with no signature or integrity check after decryption'.
  - code: F4
    where: body, Vulnerability mechanics
    claim: shares an X.509 certificate with another co-hosted service — most commonly the HTTPS management or captive-portal
      service ... a configuration that has historically been documented in Palo Alto's own deployment guides as a shortcut
      for certificate management
    ground_truth: Rapid7 names only 'the HTTPS service of the portal or gateway' as the reused-certificate example; the PSIRT
      says 'a specific certificate configuration exists'. 'Management or captive-portal service', 'most commonly' and the
      claim about Palo Alto deployment guides appear in no cited source.
    ground_truth_url: https://www.rapid7.com/blog/post/etr-rapid7-observed-exploitation-of-pan-os-globalprotect-authentication-bypass-vulnerability-cve-2026-0257/
    fix: Say 'for example the HTTPS service of the portal or gateway' and drop the deployment-guide claim.
  - code: F13
    where: body, Exploitation pattern (last sentence)
    claim: The gap between the exploitation waves (18 and 21 May) and the PoC/KEV date (29 May) implies the actor possessed
      private pre-disclosure knowledge of the vulnerability.
    ground_truth: 'Rapid7: ''On May 13, 2026, Palo Alto Networks published a security advisory for CVE-2026-0257''; the earliest
      observed exploitation was May 17, four days after the public advisory, so the waves followed disclosure. Arctic Wolf:
      ''first publicly disclosed by Palo Alto Networks on May 13, 2026''. No source states private pre-disclosure knowledge.'
    ground_truth_url: https://www.rapid7.com/blog/post/etr-rapid7-observed-exploitation-of-pan-os-globalprotect-authentication-bypass-vulnerability-cve-2026-0257/
    fix: Delete the inference; state that exploitation began 17 May, four days after the 13 May advisory.
  - code: F4
    where: body, Exploitation pattern
    claim: Both used a deliberately spoofed, easily-recognisable MAC address pattern — suggesting deliberate source-normalisation
      to defeat MAC-based network anomaly detection.
    ground_truth: Rapid7 only records the spoofed MAC address 'observed in both waves of successful exploitation' and that
      'Due to the consistent MAC address, Rapid7 believes both waves ... are likely from the same threat actor'; no source
      states a purpose (anomaly-detection evasion). Arctic Wolf 2026-06-11 adds that 'MAC spoofing was not consistently observed
      across all intrusions' in the later wave.
    ground_truth_url: https://www.rapid7.com/blog/post/etr-rapid7-observed-exploitation-of-pan-os-globalprotect-authentication-bypass-vulnerability-cve-2026-0257/
    fix: State the spoofed-MAC observation and Rapid7's same-actor inference; drop the evasion motive.
  - code: F4
    where: body, MITRE ATT&CK mapping
    claim: 'T1036.005 (Masquerading: Match Legitimate Name or Location — spoofed machine name DESKTOP-GP01) ... T1046 (Network
      Service Discovery — attacker-controlled GP-CLIENT enumerating accessible segments)'
    ground_truth: 'Rapid7: ''we did not observe any indication of successful lateral movement from the devices''; Unit 42:
      ''No post-access behavior or lateral movement has been identified''. Nothing in the sources shows segment enumeration
      from GP-CLIENT, and nothing characterises DESKTOP-GP01 as masquerading. T1539 ''Steal Web Session Cookie'' is, by the
      entry''s own admission, not what happens (cookies are forged). T1036.005 is named ''Match Legitimate Resource Name or
      Location'' in the pinned dataset v19.2 and sits under the Stealth tactic.'
    ground_truth_url: https://unit42.paloaltonetworks.com/active-exploitation-of-pan-os-cve-2026-0257/
    fix: Drop T1046 and T1036.005 and the 'expected next step' T1021.001; keep T1133/T1190; if forged-cookie is mapped use
      T1606.001.
  - code: F4
    where: body, Affected and patched versions
    claim: 'Affected: PAN-OS 10.2.x < 10.2.7-h34 (and maintenance tracks), 11.1.x < 11.1.4-h33, 11.2.x < 11.2.4-h17, 12.1.x
      < 12.1.4-h6. Not affected: Panorama, Cloud NGFW, Prisma SD-WAN, PA-Series managed by Panorama with no local GP config,
      PAN-OS < 10.2.x (EOL).'
    ground_truth: 'PSIRT Product Status: affected is ''< 12.1.4-h6 < 12.1.7'', ''< 11.2.4-h17 < 11.2.7-h14 < 11.2.10-h7 <
      11.2.12'', ''< 11.1.4-h33 ... < 11.1.15'', ''< 10.2.7-h34 ... < 10.2.18-h6'' (the twin lists only each train''s lowest
      hotfix floor, which understates exposure of e.g. 11.1.14 or 10.2.17). Only ''Panorama and Cloud NGFW are not impacted'';
      Prisma SD-WAN and ''PA-Series managed by Panorama'' are not mentioned, and the Solution table says ''All older unsupported
      PAN-OS versions: Upgrade to a supported fixed version'', i.e. older versions are not declared unaffected.'
    ground_truth_url: https://security.paloaltonetworks.com/CVE-2026-0257
    fix: Use the PSIRT Product Status table; remove the invented 'not affected' items.
  - code: F4
    where: body, Hardening / mitigation
    claim: disable authentication override cookies entirely in the GlobalProtect gateway and portal settings (`Authentication`
      > `No Cookie Required on Pre-Logon Connections`) ... Verify via `show system info` and `show sslmgr-store` ... If patching
      cannot be completed within 24 hours
    ground_truth: 'PSIRT workaround: ''Disable Authentication Override: Uncheck the Authentication Override options (for generating
      and accepting cookies) in the GlobalProtect portal and gateway configuration'' (portal Agent config > Authentication
      tab, gateway Client Settings > Authentication Override tab). The setting name ''No Cookie Required on Pre-Logon Connections'',
      the two CLI verification commands and the 24-hour threshold appear in no cited source.'
    ground_truth_url: https://security.paloaltonetworks.com/CVE-2026-0257
    fix: Use the PSIRT wording and UI path; drop the unsourced commands and deadline.
  - code: F4
    where: body, Detection
    claim: 'look for authentication events with `auth_method: cookie` ... `globalprotectgateway-config-succ` events authenticated
      via cookie from non-enrolled endpoints ... VPN sessions with a deliberately spoofed MAC address pattern reused across
      geographically-disparate source IPs ... are a strong indicator'
    ground_truth: Rapid7's sample logs show event types 'gateway-auth, login, Cookie' and POSTs to /ssl-vpn/hipreport.esp
      and /ssl-vpn/getconfig.esp; the field name `auth_method`, the event name `globalprotectgateway-config-succ`, 'no prior
      SCEP or Panorama device-cert association' and 'geographically-disparate' source IPs are not in any cited source. Arctic
      Wolf 2026-06-11 reports MAC spoofing 'was not consistently observed across all intrusions', so 'strong indicator' overstates.
    ground_truth_url: https://www.rapid7.com/blog/post/etr-rapid7-observed-exploitation-of-pan-os-globalprotect-authentication-bypass-vulnerability-cve-2026-0257/
    fix: Replace with Rapid7's sourced hunt (cookie auth to the local admin account from hosting-provider space, generic client
      names, HIP report/getconfig POSTs).
  - code: F4
    where: body, Affected and patched versions (last sentence)
    claim: 'Prisma Access 10.2 and 11.2: Palo Alto is rolling fixes; check Prisma Access status portal.'
    ground_truth: 'PSIRT: ''Prisma Access is being actively upgraded for all the customers as per the upgrade schedule shared
      with the customers.'' No ''status portal'' is named; fixed builds are 11.2.7-h13 and 10.2.10-h36.'
    ground_truth_url: https://security.paloaltonetworks.com/CVE-2026-0257
    fix: Quote the PSIRT wording and fixed builds.
  - code: F11
    where: frontmatter (title/headline/summary/evidence/priority/classification/techniques)
    claim: 'summary: "Background. GlobalProtect is Palo Alto Networks'' SSL-VPN solution ..." ; evidence: quote: Background.
      publisher: ctipilot v2 brief (migrated) ; priority: notable ; no classification, no techniques[]'
    ground_truth: 'Migration stub: the summary is a truncated paragraph opener, the single evidence ''quote'' (''Background.'')
      is not a source quotation, there is no classification block and no techniques[] on a kind: vulnerability entry, priority
      notable contradicts the survivor''s high, and the exploited/KEV-listed CVE lacks the ransomware/Qilin delta. Nothing
      to preserve; the survivor supersedes it.'
    ground_truth_url: https://security.paloaltonetworks.com/CVE-2026-0257
    fix: Fold into the survivor.
  unique_material:
  - fact: Rapid7 MDR's first wave used the client machine name GP-CLIENT (Linux client OS) and the second wave (21 May, Dromatics
      Systems) used DESKTOP-GP01 (Windows 10 Pro 64-bit); both are listed by Rapid7 as hunting artifacts (survivor omits the
      machine names and client OS). Unit 42 and Arctic Wolf (2026-06-11) repeat both names, Arctic Wolf adds 'kali'.
    source_url: https://www.rapid7.com/blog/post/etr-rapid7-observed-exploitation-of-pan-os-globalprotect-authentication-bypass-vulnerability-cve-2026-0257/
  - fact: Rapid7 observed the same spoofed MAC address in both exploitation waves and has a dedicated detection for VPN authentication
      via a spoofed MAC; usable as a hunting pivot, with Arctic Wolf's caveat that in the later wave 'MAC spoofing was not
      consistently observed across all intrusions' (survivor keeps only the 'consistent MAC address' quote).
    source_url: https://www.rapid7.com/blog/post/etr-rapid7-observed-exploitation-of-pan-os-globalprotect-authentication-bypass-vulnerability-cve-2026-0257/
  - fact: Rapid7 'did not observe any indication of successful lateral movement from the devices' and Unit 42 states 'No post-access
      behavior or lateral movement has been identified' as of 2026-06-09 (survivor never states the absence of post-access
      activity before the Qilin reporting).
    source_url: https://unit42.paloaltonetworks.com/active-exploitation-of-pan-os-cve-2026-0257/
  - fact: Rapid7 Labs' public proof-of-concept (github.com/sfewer-r7/CVE-2026-0257) was released with Rapid7's 2026-05-29
      post, the same day as the KEV addition; Arctic Wolf 2026-06-11 confirms the same-day sequence (survivor mentions the
      Rapid7 PoC script and the KEV date but not the repository or the same-day PoC/KEV sequence).
    source_url: https://arcticwolf.com/resources/blog/arctic-wolf-observes-increase-in-palo-alto-networks-globalprotect-authentication-bypass-exploitation-via-cve-2026-0257/
  - fact: 'PSIRT note on Prisma Access: it ''is being actively upgraded for all the customers as per the upgrade schedule
      shared with the customers'' (survivor lists only the fixed builds 11.2.7-h13 and 10.2.10-h36).'
    source_url: https://security.paloaltonetworks.com/CVE-2026-0257
- entry: entries/2026-06-18/fortibleed-73-932-internet-facing-fortigate-devices-exposed.md
  verdict: imprecision
  defects:
  - code: F5
    where: section 2026-06-23T04:52:50Z, paragraph 3
    claim: watching for anomalous Kerberos service-ticket requests (event 4769) and new-source Logon Type 3 events (4624)
      against privileged accounts
    ground_truth: Neither cited source (BleepingComputer 2026-06-22, Fortinet PSIRT 2026-06-19) names Windows event ids or
      a domain-wide credential rotation; Fortinet only says to check 'domain controller logs for lateral movement, unusual
      access, suspicious accounts, or unauthorized configuration changes' and to treat an AD/LDAP integration account as compromised.
      The paragraph carries no inline citation for these specifics.
    ground_truth_url: https://www.fortinet.com/blog/psirt-blogs/analysis-of-reported-credential-compromise-of-fortigate-devices
    fix: Drop the event ids (or mark as the entry's own suggestion) and narrow the rotation advice to Fortinet's AD/LDAP service-account
      guidance.
  - code: F3
    where: section 2026-10-08T04:58:53Z, paragraph 3 (last sentence)
    claim: On a FortiGate the matching telemetry is the configuration and administrator audit log (administrator accounts
      created or deleted, passwords changed, new REST API keys); behind the VPN it is the domain controller authentication
      log, for lateral movement ([FBI and U.S. Secret Service, 2026-10-06](https://www.ic3.gov/CSA/2026/261006.pdf))
    ground_truth: (low confidence) The advisory says 'Review firewall, VPN, authentication, and domain controller logs for
      lateral movement, unusual access, suspicious accounts, or unauthorized configuration changes' and separately to review
      REST API keys; it does not name a 'configuration and administrator audit log'. The telemetry mapping is the entry's
      inference carried under the advisory's citation.
    ground_truth_url: https://www.ic3.gov/CSA/2026/261006.pdf
    fix: Phrase as 'the advisory points to firewall, VPN, authentication and domain controller logs' and leave the audit-log
      mapping uncited or remove the attribution.
  - code: F18
    where: actions[0]
    claim: On every internet-facing FortiGate, terminate all administrator and VPN sessions, reset every administrator and
      VPN password, review the local administrator list and the REST API keys for entries nobody created ..., restrict management
      access to trusted hosts or a local-in policy, and enforce PBKDF2 for administrator password storage as Fortinet's guidance
      describes for FortiOS 7.2.11 and later.
    ground_truth: '(low confidence) A five-part restatement of the ''advisory''s measures'' paragraph and Defender takeaway
      in the body (FBI/USSS Mitigations section: terminate sessions, reset, validate configuration, REST API keys, PBKDF2,
      restrict management), rather than one do-now task; fails check 10b(b).'
    ground_truth_url: https://www.ic3.gov/CSA/2026/261006.pdf
    fix: Keep one task, e.g. 'Audit every internet-facing FortiGate for administrator accounts and REST API keys nobody created,
      then reset all administrator and VPN credentials'.
  - code: F9
    where: summary (device count)
    claim: with SOCRadar counting more than 86,644 compromised devices in 194 countries
    ground_truth: (low confidence) The FBI/USSS advisory repeats SOCRadar's 86,644 'verified' figure, but BleepingComputer's
      2026-07-01 report on SOCRadar's follow-up says 'After notifying impacted organizations, the number has fallen to around
      11,000 compromised devices' (and that the operation targeted more than 430,000 FortiGate firewalls). The entry does
      not distinguish the cumulative verified-credential count from devices still compromised; the later article is not among
      the entry's sources.
    ground_truth_url: https://www.bleepingcomputer.com/news/security/fortibleed-credential-theft-campaign-linked-to-lynx-ransomware/
    fix: Word it as 'a verified database of more than 86,644 device credentials (SOCRadar, repeated by the FBI)' and note
      SOCRadar's later lower count of still-compromised devices.
  notes: 'Verified against fetched pages: BC 2026-06-18/06-22/10-07, Fortinet PSIRT 2026-06-19, Arctic Wolf 2026-06-17, SecurityWeek
    06-19/06-22, SOCRadar, FBI/USSS JCSA-20261006-01 PDF, CISA alert (WebFetch; published 2026-06-18, revised 2026-06-22).
    All four evidence quotes verbatim. All 12 techniques[] active in pinned dataset; FBI maps T1190 additionally (not required).
    Counts 73,932/194/21,632/86,644 match sources.'
- entry: entries/2026-08-04/liechtenstein-vwbp-beneficial-ownership-register-breach.md
  verdict: imprecision
  defects:
  - code: F9
    where: section 2026-09-02T04:50:00Z, paragraphs 1 and 3 (stale after the Improvement of 2026-10-07)
    claim: Switzerland's own incoming Transparency Register ... due live 1 October 2026 ... so the 1 October go-live of the
      Swiss register adds a second authoritative identity-verification dataset attackers can draw on
    ground_truth: The Federal Office of Justice's release of 2026-10-01 'Transparenzregister nimmt den Betrieb auf' states
      the Swiss register took up operation on 1 October 2026 (it also says the number of possible queries is limited and access
      is secured by multi-stage authentication). The section and its Defender takeaway (updated) still speak of the launch
      in the future; the 2026-10-07 Improvement does not update this.
    ground_truth_url: https://www.bj.admin.ch/de/newnsb/L0rkU9ZvCFSw
    fix: Reword to past tense ('went live on 1 October 2026') and cite the BJ release.
  - code: F3
    where: section 2026-09-02T04:50:00Z, paragraph 1 and updates[] record summary
    claim: Switzerland's own incoming Transparency Register — covering roughly 500,000 beneficial owners ([Inside Paradeplatz,
      2026-08-31]...)
    ground_truth: '(low confidence) Inside Paradeplatz literally writes ''Namen der 500''000 tatsächlichen Besitzer'', but
      the NZZ article it links for that number is titled ''Rund 500 000 Gesellschaften sollen künftig ihre «wahren» Eigentümer
      in einem nationalen Register offenlegen'' and says ''rund 500 000 Aktiengesellschaften, GmbH, Genossenschaften und Stiftungen
      ... müssten'' register: the 500,000 count is of legal entities, not beneficial owners.'
    ground_truth_url: https://www.nzz.ch/wirtschaft/rund-500-000-gesellschaften-sollen-kuenftig-ihre-wahren-eigentuemer-in-einem-nationalen-register-offen-legen-ld.1888659
    fix: Say 'roughly 500,000 legal entities' (or drop the figure).
  - code: F3
    where: updates[] record 2026-09-01T04:18:40Z summary
    claim: NZZ reporting from the government's own 2026-08-04 press briefing, sourced to Liechtenstein IT-office director
      Fabian Schmid, names the access mechanism
    ground_truth: NZZ attributes only the duration statement to Schmid ('Deshalb dauerte es mehrere Stunden, bis die Angreifer
      alle 31 000 Datensätze heruntergeladen hatten, wie der Leiter des Amts für Informatik in Liechtenstein, Fabian Schmid,
      vor den Medien sagte'); the portal vulnerability and new-user-account mechanism are stated by NZZ without attribution
      to Schmid or to the 08-04 briefing. The body section is worded correctly; the record summary overstates the attribution.
    ground_truth_url: https://www.nzz.ch/wirtschaft/nach-hackerangriff-in-liechtenstein-wie-sicher-sind-heikle-finanzdaten-beim-bund-ld.10018419
    fix: Say 'NZZ reports ... ; the several-hour download duration is attributed to Schmid'.
  - code: F11
    where: evidence[0..7] and body ¶1, ¶3 (untranslated German)
    claim: evidence quotes such as "Dabei wurden Datenkopien von rund 31'000 Rechtsträgern widerrechtlich abgegriffen." and
      body "Weitere Angriffe auf andere Systeme konnten nicht festgestellt werden" ("no further attacks ...")
    ground_truth: The eight government quotes are verbatim German substrings of the cited presseportal pages but carry no
      English translation, no '(translated from German)' marker and no `original:` field; the body also embeds German phrases
      with glosses. Reader-facing text should be English with originals only in evidence[].original.
    ground_truth_url: https://www.presseportal.ch/de/pm/100000148/100941487
    fix: Translate the eight quotes into English, mark '(translated from German)' and move the German into `original:`; translate
      body quotations.
  - code: F11
    where: body, sections 2026-08-05, 2026-09-01, 2026-09-02 (workflow-internal references and stacked takeaways)
