    where: techniques
    claim: 'techniques: [T1566.002, T1219, T1059.001, T1059.003, T1053.005, T1105]'
    ground_truth: (low confidence) Huntress describes the attacker landing page performing 'browser and environment fingerprinting, checking the operating system, browser and version, mobile/desktop status,
      user-agent, automation indicators, screen size, iframe context, and cloud-provider-associated cookies' and calls it 'classic anti-analysis and traffic filtering behavior' that redirects visitors who
      fail the checks; the entry body describes this ('fingerprints the visitor ... redirects visitors who fail its checks') but no technique id covers it. All six listed ids are active in the pin and supported.
    ground_truth_url: https://www.huntress.com/blog/screenconnect-power-bi
    fix: Add T1497.001 (System Checks) or T1480 (Execution Guardrails) to techniques[] if the maintainers accept server-side visitor filtering as an anti-analysis mapping; otherwise leave.
