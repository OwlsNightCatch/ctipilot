- entry: entries/2026-10-07/gentlemen-affiliate-azazel-ci-cd-secrets-mcp-attacks.md
  verdict: imprecision
  defects:
  - code: F9
    where: summary and evidence[0]
    claim: 'summary: "It says every confirmed victim was reached through stolen CI/CD secrets, mainly GitLab variable stores and git history, that one deeper intrusion into an AI platform chained server-side
      request forgery..."; evidence[0]: "Every confirmed victim was reached through stolen CI/CD secrets."'
    ground_truth: '(low confidence) CloudSEK contradicts itself: Key Findings say "Every confirmed victim was reached through stolen CI/CD secrets.", but the Chain A text says "Every victim outside the
      AI sector engagement was reached the same way" and Chain B says the AI platform "Entry was through an AI medical imaging API that fetches user-supplied URLs server-side without validation" (SSRF),
      i.e. not a CI/CD secret. The entry body silently adopts the qualified form ("Every victim outside one deeper intrusion") while the summary and the first evidence quote carry the unqualified sentence,
      and the sourcing_note flags a different CloudSEK inconsistency (victim counts) but not this one.'
    ground_truth_url: https://www.cloudsek.com/blog/caught-in-4k-the-gentlemen-files
    fix: State in the summary that every victim outside the AI-platform intrusion was reached through CI/CD secrets, and add a Contradiction line (sourcing_note) that CloudSEK's key finding says "every
      confirmed victim" while its own Chain B shows an SSRF-based entry.
