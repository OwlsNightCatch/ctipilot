- entry: entries/2026-10-08/cve-2026-102255-sonicwall-sma1000-workplace-ssrf.md
  verdict: imprecision
  defects:
  - code: F4
    where: cves[CVE-2026-102255].status and tags
    claim: 'status: [patch-available]; tags: [vulnerabilities, pre-auth, patch-available]'
    ground_truth: (low confidence) The cited 2026-10-09 BleepingComputer article opens "Attackers are exploiting a maximum-severity vulnerability in SonicWall SMA1000 appliances (CVE-2026-102255) that was
      patched on Tuesday, three days ago."; the Canadian Cyber Centre bulletin (updated 2026-10-09) says "Open source reporting indicates that CVE-2026-102255 is being exploited in the wild."; Previdian
      lists "Active exploitation observed / Confirmed confidence". The entry keeps the careful framing "attempts, vendor has not confirmed" in prose, but the machine-readable status/tags carry no exploitation
      marker, whereas the Atlassian CVE-2026-21589 entry in the same batch moved to [exploited, ...] and actively-exploited on equivalent honeypot evidence (Previdian, SANS ISC, CCCS). SonicWall itself
      still says "There is currently no evidence any of the vulnerabilities addressed in this release are being exploited in the wild."
    ground_truth_url: https://www.bleepingcomputer.com/news/security/max-severity-sonicwall-sma1000-flaw-now-exploited-in-attacks/
    fix: Either add exploited to cves[CVE-2026-102255].status and actively-exploited to tags (keeping the vendor-has-not-confirmed caveat in prose), or keep the current value and say in the sourcing_note
      why honeypot-reported attempts are treated differently here than for CVE-2026-21589.
