  summary: "(low confidence) The detection advice (monitor for libguestfs-tools/qemu-utils/nbd-client installs and CIFS mounts of backup shares on non-backup hosts; treat rclone to cloud storage after such a mount as an exfil signal) and the Triage discriminator assume these commands run on defender-owned hosts. Talos recovered them from the operator's own .bash_history on its attack server; the entry never says so and gives no victim-observable telemetry."
