  ground_truth_url: "https://blog.talosintelligence.com/ransomware-incidents-in-japan-in-the-first-half-of-2026/"
  fix: "State that the commands ran on the operator's own server, and reframe detection on what a victim can see (SMB sessions to backup shares from unexpected or tunnelled sources, bulk reads of VHDX files, anomalous backup-server access, egress) or mark the host-side items as a hypothesis."
