  discovery_trace: 'first seen at: frenchbreaches, WebFetch of https://frenchbreaches.com (entry VACAF, 2026-10-09, flagged public-sector) -> pivot: frenchbreaches alert https://frenchbreaches.com/alertes/vacaf-mv1973gh31stjwpfe8l
    -> pivot: WebSearch (''"Vacaf" fuite de données "Pass Colo" CAF'') -> primary relay of the CNAF statement: Entrevue https://entrevue.fr/cybersecurite/caf-une-fuite-de-donnees-touche-le-dispositif-daide-aux-vacances-jusqua-12/
    (the CNAF communiqué itself could not be fetched; vacaf.org returned HTTP 500 on 2026-10-11, consistent with a suspension)'
  summary: 'Per the reporting on the CNAF announcement of Saturday 2026-10-10: a personal-data leak was detected on VACAF, the national platform (administered by the CAF de l''Hérault for the whole CAF
    network, hosted by an external provider) through which eligible families get holiday-aid; the incident was signalled on Friday evening, the site was suspended at once, a crisis cell was activated, the
    CNIL and ANSSI were informed and a complaint is to be filed. CNAF says bank details and the passwords of CAF personal spaces are not among the compromised data, and that benefit payments run on a separate
    system and are unaffected; it has not confirmed the volume or the data list. Claim (seller ''Syrv4x'' per cyberattaque.org, 1,390,558 lines in three files; FrenchBreaches reviewed 1,500 sample records):
    1,191,967 allocataire dossiers across 58 CAFs, 97,269 Pass Colo records and 101,322 child-stay registration lines, covering 2026 beneficiaries only, with parent and child names, children''s birth dates,
