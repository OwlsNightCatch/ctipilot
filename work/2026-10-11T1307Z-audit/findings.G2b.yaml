    and the Region stays the controller. Detection: no supplier-side telemetry is described; the practical check is whether your contracts give you log access and breach-notification clocks for processor
    platforms. Triage: not an alert-matching item. Defender takeaway: ask each supplier that holds citizen data to show the authentication and exposed-surface controls on its own platform, since the Region''s
