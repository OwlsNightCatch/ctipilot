  extended_notes: 'Exposure: any hospital or health body running a patient-facing ordering or portal module from a supplier, especially one reachable from the internet without staff involvement. Detection:
    web and application logs on the patient-facing module for bulk reads or enumeration of patient identifiers, and sign-ins by professional user accounts from unfamiliar locations (the forum posts claim
    professional accounts). Triage: not an alert-matching item. Defender takeaway: inventory the supplier modules that expose patient identifiers to the internet, even ''non-clinical'' ones such as meal
    ordering, and ask the supplier for the patch status of the module.'
