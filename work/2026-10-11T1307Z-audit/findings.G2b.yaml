- title: 'French police inspectorate IGPN: illicit consultations of police files rose 81% in 2025; insiders ''start very modestly, then quickly move to mass consultations''; log-analytics tools SCAF-PN
    and CITAR flag them'
  source_record: next-ink (2026-10-09, listing found in the feed)
  sources:
  - url: https://next.ink/260711/de-la-consultation-illegale-de-fichiers-policiers-a-l-uberisation-de-la-corruption/
    publisher: Next (reads the IGPN 2025 annual report; paywalled after about a third of the article)
    date: '2026-10-09'
    role: primary
  discovery_trace: 'first seen at: next-ink, URL https://next.ink/feed (item ''De la consultation illégale de fichiers policiers à l''ubérisation de la corruption'', 2026-10-09) -> article https://next.ink/260711/de-la-consultation-illegale-de-fichiers-policiers-a-l-uberisation-de-la-corruption/
    (the IGPN report itself was not located; the linked interieur.gouv.fr page is the gendarmerie inspectorate''s report and was not used)'
  summary: 'Per Next''s reading of the IGPN 2025 annual report: IGPN identified 136 offences of diverting personal-data processing (illicit consultations of files) against 75 the year before (+81%), alongside
    corruption cases up from 66 to 88 and breaches of professional secrecy from 93 to 117. The files most often misused are the criminal-records processing TAJ, the vehicle register SIV and the wanted-persons
    file FPR, which the report calls the main compromise vectors; most illicit consultations were for gain but with petty returns, the rest non-lucrative (favours for acquaintances, vetting a childminder,
    jealousy). Profile: mostly men under 40 in the first third of their career on modest incomes, some in personal difficulty; the report says they ''always start very modestly before quickly moving to
    mass consultations'', facilitated by near-instant access to police files from the NEO mobile terminal, a pattern IGPN calls the ''uberisation of corruption''. Next states that the new algorithms for
    monitoring and checking access to National Police files (SCAF-PN) and for internal control of application and network traces (CITAR) have almost doubled the identification of illicit consultations and
    corruption cases. Only about a third of the article was readable.'
  region_nexus: France (national police and gendarmerie)
  primary_sector_nexus: direct-analogue (police insider misuse of operational databases; transferable to Swiss cantonal and communal police access to national and cantonal police systems)
