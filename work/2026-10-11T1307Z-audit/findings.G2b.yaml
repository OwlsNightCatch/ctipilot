    Deutschland Staatsanwaltschaft BKA Oktober 2026'') -> primary: Land NRW statement notice https://www.land.nrw/node/25664 and dpa report https://www.stuttgarter-zeitung.de/politik/mutmasslicher-qilin-hacker-festgenommen-nrw-gelingt-schlag-gegen-beruechtigte-russische-hackergruppe-79545149.html;
    Japan NPA release https://www.npa.go.jp/news/release/2026/20261008news.pdf'
  summary: 'Facts as stated by the authorities: a 28-year-old Russian national wanted in Germany was detained in Japan in May 2026 (he entered as a tourist) and handed over to German authorities on 2026-10-02
    after a Tokyo High Court decision under Japan''s extradition law, although Japan and Germany have no extradition treaty. NRW Interior Minister Reul and Justice Minister Limbach presented the case on
    2026-10-07: the NRW state criminal police (LKA) and the cybercrime centre ZAC NRW infiltrated the group and watched it for months, followed cryptocurrency flows and read its communications (''Operation
    Albus''). The German warrant concerns an extortion operation against a German company in September 2024 (ZATAZ, citing Yomiuri: a logistics firm, ransom paid about 26 million yen). Reul says Qilin attacked
    almost 4,000 organisations worldwide since 2024, 150 in Germany and 30 in NRW, with ransom demands near USD 3 billion and over USD 140 million paid; the group works with several hundred affiliates.
    Reul calls the suspect one of the leading heads and the arrest the biggest blow German investigators have struck against cybercrime; the suspect is in custody and trial is pending, so his role is an
    allegation. Claims and context: BleepingComputer reports the group continued to list over 450 victims on its leak site since June despite the May detention; it also notes Qilin''s link to Check Point
    VPN zero-day and PAN-OS GlobalProtect n-day exploitation reported earlier. ZATAZ speculates (its own inference) that the suspect worked on Qilin''s technical systems and that the group''s storage servers
    have been down for days. For defenders: one RaaS administrator in custody does not retire the affiliate base, so Qilin intrusion paths already tracked in the store stay live; the German authorities
    now hold the group''s internal communications, which can mean victim notifications.'
  region_nexus: Germany (NRW) and Japan; Qilin is a top RaaS that Reul says hit 150 German victims, and hospitals and municipalities are named by Limbach as typical targets; DACH public bodies are in its
