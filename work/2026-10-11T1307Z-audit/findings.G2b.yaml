    000 personnes'') -> primary relay: AFP via Techniques de l''Ingénieur, URL https://www.techniques-ingenieur.fr/actualite/breves-afp/cyberattaque-dans-les-hauts-de-france-plus-de-500-000-personnes-touchees-selon-la-region-164436/
    and Next, URL https://next.ink/brief-article/fuite-de-donnees-a-la-region-hauts-de-france-avec-potentiellement-des-rib/'
  summary: 'Confirmed by the Region (communiqué of Saturday 2026-10-03, relayed by AFP and Next): two of its suppliers suffered a cyberattack ''ayant permis un accès non autorisé à des données personnelles
    traitées pour son compte''. Atexo ran the portal for regional aid and project-holders; Docaposte (La Poste''s digital subsidiary) ran the Carte Génération#HDF platform that gives lycée pupils and apprentices
    a regional aid. Both platforms were closed; the Region told AFP on the Saturday that the incident was ''désormais résolu'' and that its internal information system was not touched, that it had informed
    ANSSI and filed a complaint, and says the suppliers have identified the flaws and the attacker''s method and begun corrections. On 2026-10-05 Region president Xavier Bertrand told the regional council
    that data of at most 515,000 of the 745,000 people registered on Atexo''s platform leaked (names, first names, emails, type of third party, authorisations; whether bank details (RIB) were consulted
    or extracted was not yet known) and that data of about 30,000 beneficiaries and partners ''auraient fuité'' on the Docaposte-hosted Carte Génération#HDF, essentially apprenticeship contracts and RIB,
    bringing the official total to about 545,000 people. Claim, not confirmed: a forum user ''ChimeraZ'' posted two claims on 2026-10-03 (FrenchBreaches): 782,583 lines for about 708,000 people and 48 GB
    with 90,011 PDF files (contracts d''apprentissage, identity documents, RIB), with some passwords allegedly sitting in phone-number fields; the Region says it cannot confirm that volume or the document
    categories. Neither the Region nor the suppliers have named the vulnerability class.'
  region_nexus: France (Hauts-de-France regional authority)
