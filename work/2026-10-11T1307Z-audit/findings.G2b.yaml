- title: New extortion group ZaWoo runs an automated leak site with anonymised victim IDs; nine of its 14 published victims are in Germany
  source_record: zataz (2026-09-28, feed page 4; inside the coordinator-extended window)
  sources:
  - url: https://www.zataz.com/zawoo-le-groupe-cybercriminel-qui-a-automatise-ses-cyberattaques-jusqua-son-site-de-fuite/
    publisher: ZATAZ (Damien Bancal, own observation of the leak site)
    date: '2026-09-28'
    role: primary
  discovery_trace: 'first seen at: zataz, URL https://www.zataz.com/feed/?paged=4 (item ''ZaWoo : le groupe cybercriminel qui a automatisé ses cyberattaques jusqu''à son site de fuite'', 2026-09-28) ->
    primary: https://www.zataz.com/zawoo-le-groupe-cybercriminel-qui-a-automatise-ses-cyberattaques-jusqua-son-site-de-fuite/'
  summary: 'ZATAZ''s own observation, not a victim disclosure: the leak space attributed to ZaWoo listed 18 targets, 14 of them published with name or domain, country, a short description and a claimed
    data volume; Germany accounts for nine of the 14 published victims, followed by Austria, Canada, Brazil, the Czech Republic and the United States, and France appears through five entries (three anonymous
    ones were later published with data). Unpublished victims appear under a ''Company ID'' so that the victim can recognise itself without being named (one German case claimed 17.4 GB). The site has authenticated
    private areas, victim index and per-victim pages, so the extortion workflow looks automated, and source-code comments such as ''IMPORTANT FIX'' and ''CORRECT ID ASSIGNMENT'' resemble repeated correction
    requests, which ZATAZ reads as a possible sign of AI-assisted development but says does not prove it (ZATAZ''s inference). The article does not state how victims were breached, whether data is encrypted,
    or whether any victim is a public body.'
  region_nexus: Germany and Austria (DACH neighbours) and France as the main published geographies
