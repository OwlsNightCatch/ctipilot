    WebFetch listing (blog ''Après la fuite de données chez VosFactures… l''État suspend les échanges'', 2026-10-01) -> pivot: next-ink, URL https://next.ink/259753/facturation-electronique-fuite-dinformations-chez-vosfactures-a-cause-dun-prestataire/
    -> pivot: WebSearch (''Fakturownia komunikat incydent bezpieczeństwa nieautoryzowany dostęp baza danych 28 września 2026'') -> primary: Fakturownia notice https://fakturownia.pl/incydent and Polish
    Ministry of Finance https://www.podatki.gov.pl/aktualnosci/komunikat-ministerstwa-finansow-30092026'
  summary: 'Victim statement (Fakturownia, 2026-09-29, updated): an unauthorised person accessed its systems between about 03:20 on 2026-09-27 and 17:45 on 2026-09-28 and copied a large part of the database
    to their own servers; the incident touches every account. The provider reported to the Polish data-protection authority, CERT Polska and the cybercrime police, rotated application keys and service passwords,
    moved traffic to servers rebuilt from scratch, and hardened its PDF generator. The Polish Ministry of Finance said on 2026-09-30 the event does not concern data held in KSeF, the national e-invoicing
    system. The French e-invoicing platform VosFactures (operated by FACTUALI SAS, accredited by the State) relies on Fakturownia as a technical subcontractor; VosFactures wrote to its customers that an
    unauthorised person exploited a vulnerability in a PDF-generation mechanism for invoice templates, reached configuration files with application keys and credentials, ran arbitrary commands on several
    application servers and reached a mirror copy of the production database (Next, quoting the customer letter). After being told in the night of 30 September to 1 October of a possible data theft, AIFE
    (the French State financial-IT agency that runs Chorus Pro) suspended exchanges with the VosFactures accredited platform on 2026-10-01 and restored them by the weekend after reviewing the technical
    evidence; AIFE states no invoicing data had been passed to the administration through that platform (Leto, Next quoting the Chorus Pro banner). Claims: the actor ''Fingerprint'' told Zaufana Trzecia
    Strona it took 6 TB of invoices (unverified, as The Record notes) and that it entered via a time-based blind SQL injection that yielded the Ruby on Rails master key, then forged a cookie for remote
    code execution; that is the attacker''s account and differs from the PDF-generator account in VosFactures'' letter. The Record reports Fingerprint also claimed the MyDr and Medyc health-software breaches
    already in the store.'
  region_nexus: Poland and France; State e-invoicing infrastructure on both sides (KSeF in Poland, Chorus Pro/AIFE in France)
  primary_sector_nexus: indirect (supplier chain to State e-invoicing; relevant to public bodies that receive or issue electronic invoices through accredited platforms, including Swiss e-billing flows;
