    2026-10-01 were invalidated, which breaks accounting-software integrations until new keys are generated (Next). Detection: for affected tenants, review use of API tokens and bank-account changes in
    the supplier''s tool, and confirm bank-detail change requests by phone on a known number (Fakturownia''s own advice). Triage: payment-redirect or fake-supplier mails citing real invoices are the expected
    follow-on. Defender takeaway: a State gateway cutting an accredited partner within a day of a second-tier supplier breach is the new precedent; ask invoicing and ticketing suppliers who their subprocessors
