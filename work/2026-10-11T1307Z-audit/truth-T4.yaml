- entry: entries/2026-09-24/shinyhunters-fbi-peoplesoft-breach-claim.md
  verdict: imprecision
  defects:
  - code: F5
    where: section 2026-09-29T04:45:00Z ¶1
    claim: Security researchers Jon DiMaggio (Arkem Cyber) and Cynthia Kaiser (a former FBI official, now at Halcyon) warn
      the exposure creates counterintelligence and physical-safety risk for agents on sensitive cases, and that data already
      shared with journalists as proof samples is irretrievably disseminated regardless of any later takedown.
    ground_truth: 'The statements are in CyberScoop''s 2026-09-28 article (DiMaggio on counterintelligence risk; Kaiser: "once
      data is disseminated, you can''t pull it back and delete all copies") but the sentence carries no inline citation; the
      next sentence in the section, "CyberScoop separately quotes DiMaggio''s independent assessment that ''ShinyHunters''
      today operates as a criminal brand...", also has no link.'
    ground_truth_url: https://cyberscoop.com/fbi-data-breach-shinyhunters-agent-safety-risk/
    fix: Append ([CyberScoop, 2026-09-28](https://cyberscoop.com/fbi-data-breach-shinyhunters-agent-safety-risk/)) to both
      sentences.
  - code: F9
    where: section 2026-09-27T04:36:00Z ¶1 (stale against the newest section)
    claim: The FBI has not confirmed that its systems were breached or that data was stolen ([BleepingComputer, 2026-09-26]),
      and no party has confirmed or denied either technical claim.
    ground_truth: '(low confidence) The 2026-10-07 section and Nextgov/FCW carry FBI cyber chief Leatherman''s statement:
      "the incident occurred as the result of a security failure of a platform managed by a third-party organization — after
      a contractor failed to implement a security patch explicitly issued to secure the platform", which acknowledges the
      incident. The older section states the non-confirmation in the present tense with no ''as of'' qualifier.'
    ground_truth_url: https://www.nextgov.com/cybersecurity/2026/10/fbi-removes-accenture-contractor-after-missed-security-patch-led-breach/416441/
    fix: Qualify as "As of 2026-09-26, the FBI had not confirmed..." (the main analysis already says "did not then confirm").
- entry: entries/2026-09-26/kiteworks-precautionary-shutdown-imminent-zero-day-warning.md
  verdict: imprecision
  defects:
  - code: F5
    where: 'labelled line Defender takeaway (named lead: citation-cve)'
    claim: 'Run 9.5.1 or later on every deployment (Email Protection Gateway at least 9.4.1 for CVE-2026-54154), and put the
      open question to Kiteworks Support in writing: the vendor has not said whether the critical flaw it found during the
      shutdown needs customer-side action beyond its notice to customers with self-hosted Advanced Forms to contact Customer
      Support ([Kiteworks, 2026-09-27](https://www.kiteworks.com/company/press-releases/kiteworks-precautionary-shutdown-advisory/))'
    ground_truth: 'Lead decided: not a mis-bound CVE. CVE-2026-54154 is correctly tied to Email Protection Gateway before
      9.4.1 (fix 9.4.1 or later), CVSS 10.0 vector AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H, per the vendor advisory GHSA-5xhq-9wq3-rvj6,
      which also names the YesWeHack reporters. The cited 2026-09-27 press release does not mention CVE-2026-54154 and does
      not need to: it carries only the terminal clause ("Customers with self-hosted Advanced Forms should contact Customer
      Support for assistance"), which it states. The defect is that the CVE and 9.4.1 clause has no citation of its own in
      this sentence, so the closing citation reads as vouching for it.'
    ground_truth_url: https://github.com/kiteworks/security-advisories/security/advisories/GHSA-5xhq-9wq3-rvj6
    fix: Add ([Kiteworks, 2026-09-30](https://github.com/kiteworks/security-advisories/security/advisories/GHSA-5xhq-9wq3-rvj6))
      after the "9.4.1 for CVE-2026-54154" clause and keep the press-release citation on the Customer Support clause only.
  - code: F3
    where: section 2026-10-02T04:58:16Z ¶1
    claim: BleepingComputer, quoting the advisory, describes input-handling flaws in publicly reachable endpoints that potentially
      allowed unauthenticated code execution and, by chaining local weaknesses, escalation to root
    ground_truth: (low confidence; page possibly edited since BleepingComputer reported) BleepingComputer does print this
      text and attributes it to Kiteworks ("A combination of input-handling flaws in publicly reachable endpoints of the Kiteworks
      Email Protection Gateway potentially allowed an unauthenticated remote attacker to achieve arbitrary code execution
      and, by chaining additional local weaknesses, to escalate to full administrative (root) control"), linking GHSA-5xhq-9wq3-rvj6
      as 'a Wednesday advisory'. The GHSA page as fetched now says only "Multiple issues were addressed with improved input
      validation." and "A remote attacker may be able to execute arbitrary code with root privileges."
    ground_truth_url: https://www.bleepingcomputer.com/news/security/kiteworks-patches-max-severity-email-protection-gateway-code-injection-vulnerability/
    fix: Say "BleepingComputer reports Kiteworks' explanation that..." instead of "quoting the advisory", or cite the GHSA
      only for the sentence it carries.
  - code: F16
    where: priority
    claim: 'priority: high (raised from notable on 2026-10-02 "because the chain is unauthenticated and reaches root")'
    ground_truth: (low confidence) The cited sources state no exploitation of any of the 2026-09-30 advisories ("No advisory
      states exploitation" in the entry itself), no public PoC, and an optional component (Email Protection Gateway); BleepingComputer
      counts about 400 exposed instances. The rationale given is severity (CVSS 10.0), which the high bar says is graded on
      constituency exposure, never size, and 'doubt resolves to notable'. No source shows a Swiss or comparable public-sector
      Kiteworks EPG exposure.
    ground_truth_url: https://github.com/kiteworks/security-advisories/security/advisories/GHSA-5xhq-9wq3-rvj6
    fix: 'Consider priority: notable unless the run can name a concrete constituency exposure or exploitation signal.'
  notes: 'Named lead resolved: the CVE-2026-54154 clause is correctly bound (GHSA-5xhq-9wq3-rvj6: EPG before 9.4.1, CVSS 10.0,
    S:C); see F5. All eight cves[] ids, CVSS scores, affected and fixed versions match their GHSA advisories. BSI WID-SEC-2026-3602
    CSAF confirms the German original and the translation; NCSC-CH post 12985 confirms the 2026-09-28 edit.'
