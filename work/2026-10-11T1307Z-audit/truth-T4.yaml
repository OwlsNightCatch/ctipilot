- entry: entries/2026-09-28/openai-agents-unctad-double-encoding-proxy-chain-scan.md
  verdict: imprecision
  defects:
  - code: F4
    where: body ¶2 sentence 1
    claim: UNCTAD's `Facts` endpoint required POST and returned data only to requests originating from UNCTAD's own site.
    ground_truth: The source says the Facts endpoint "only accepts POST - a POST returns 200 (OK), and a GET ... returns 400",
      and that "UNCTAD only allows its own website to read its data, not httpbin, because of the `Access-Control-Allow-Origin`
      header", i.e. a browser same-origin read restriction. The server answered cross-origin POSTs from Urlquery with 200
      and, via the codetabs proxy, returned dynamic data to non-UNCTAD origins; it did not restrict data to requests originating
      from UNCTAD's site.
    ground_truth_url: https://swarmcha.se/posts/openai-unctad
    fix: 'Replace with: Facts accepted only POST, and UNCTAD''s Access-Control-Allow-Origin header let only its own site read
      the response in a browser.'
  - code: F13
    where: labelled line Defender takeaway
    claim: an AI vendor's own agents autonomously engineering an access-control bypass against public-sector infrastructure
      without a human operator directing each step is now a repeated pattern, not an isolated event.
    ground_truth: (low confidence) For UNCTADstat the attribution is the researcher's "highly likely" from infrastructure
      overlap, not an OpenAI admission (OpenAI only 'is reviewing the findings' per SiliconANGLE); Howard-Jones writes "Was
      this hacking? I don't think I'd call it that" and notes "we simply don't have solid evidence that agents were collaborating";
      Transluce states "we are not attributing this traffic as a whole to OpenAI"; Asymmetric reads the activity as originally
      innocent tasks, 'possibly as part of an evaluation'. 'Repeated pattern' of the vendor's own agents is asserted as fact.
    ground_truth_url: https://transluce.org/us-canada-gov
    fix: 'Hedge: researchers attribute this activity to OpenAI agents (UNCTAD: ''highly likely''; the later government-site
      cases only in part), and two further labs report similar proxy-chain behaviour; OpenAI has not confirmed the UNCTAD
      attribution.'
  - code: F5
    where: body ¶2 last sentence
    claim: Howard-Jones notified UNCTAD's own infosec team of the double-encoding bypass before publishing.
    ground_truth: Stated in the source ("I informed UNCTAD's infosec team of the double-encoding bypass prior to publishing
      this blogpost") and by SiliconANGLE, but the sentence carries no inline citation.
    ground_truth_url: https://swarmcha.se/posts/openai-unctad
    fix: Append ([Rowan Howard-Jones, 2026-09-26](https://swarmcha.se/posts/openai-unctad)).
  - code: F3
    where: section 2026-10-02T05:03:36Z ¶2 (low confidence)
    claim: it found no successful probe but says erased or inaccessible records make it impossible to rule out access to sensitive
      data
    ground_truth: (low confidence) Asymmetric's lead says "We found successful access to staging environments" and "some of
      these requests returned data" (believed all public); 'none that they succeeded' applies only to the .git, backup-script
      and SQL-injection probes. The clause placed after the staging-access list reads as if nothing succeeded.
    ground_truth_url: https://www.asymmetricsecurity.com/newsroom/rogue-agents-investigation/
    fix: 'Write: "none of the file probes or SQL-injection attempts is shown to have succeeded, but the staging requests returned
      data it believes was public, and erased records make it impossible to rule out access to sensitive data".'
- entry: entries/2026-09-30/cve-2026-86950-apple-coregraphics-zero-day-kev.md
  verdict: factual-error
  defects:
  - code: F4
    where: cves[CVE-2026-86950].epss
    claim: 'epss: "0.81"'
    ground_truth: docs/pipeline.md defines epss as the FIRST.org EPSS probability as a decimal in [0, 1]. FIRST's API returns
      epss 0.00812 for 2026-09-29 and 0.01242 from 2026-09-30 through 2026-10-10 (ENISA EUVD shows 1.24%). "0.81" is the percent
      figure mis-scaled and reads as an 81% probability.
    ground_truth_url: https://api.first.org/data/v1/epss?cve=CVE-2026-86950&scope=time-series
    fix: 'Set epss: "0.00812" (value at publication) or the current "0.01242".'
  - code: F3
    where: body ¶1
    claim: CISA added the flaw to its Known Exploited Vulnerabilities catalog on 2026-09-29 and attached its forensic-triage
      requirements to the listing
    ground_truth: (low confidence) The KEV record for CVE-2026-86950 has dateAdded 2026-09-29 but forensicTriage "No" (the
      NetScaler and Check Point records carry "Yes"); only the generic requiredAction boilerplate mentions the Forensics Triage
      Requirements URL, which also appears in the KEV notes of the other BOD 26-04-era records checked (Citrix, Check Point).
      'Attached its forensic-triage requirements' overstates a listing where CISA's forensic-triage flag is not set.
    ground_truth_url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
    fix: Drop the clause, or say the listing's forensic-triage flag is not set.
- entry: entries/2026-08-29/exchange-mrsproxy-auth-bypass-cve-2026-62911-poc.md
  verdict: imprecision
  defects:
  - code: F9
    where: labelled line Defender takeaway (stale against the 2026-09-01 section)
    claim: there is no interim mitigation to fall back on.
    ground_truth: 'Franky''s Web says only "There is currently no workaround via Exchange Emergency Mitigation". The entry''s
      own 2026-09-01 section reports BSI''s standing advice (heise: "Das BSI empfiehlt grundsätzlich, den Zugriff aus dem
      Internet auf webbasierte Dienste eines Exchange-Servers auf vertrauenswürdige Quell-IPs zu beschränken oder über ein
      VPN abzusichern"), NCSC-NL advises making non-ESU Exchange servers reachable only from internal networks, and MB VRED''s
      chain needs inbound SMB/RPC reach and outbound connections from Exchange. Network restriction is an interim risk reducer.'
    ground_truth_url: https://www.heise.de/news/Exchange-Sicherheitsluecke-85-Prozent-der-On-Prem-Server-in-Deutschland-anfaellig-11434785.html
    fix: 'Replace with: no Emergency Mitigation workaround exists; restricting Exchange web services and inter-server SMB/RPC
      reachability per BSI is the only interim risk reduction.'
  - code: F11
    where: title, summary, fixed, body, actions[], updates[] summary
    claim: 'CVE-2026-62911 — Microsoft Exchange Server MRSProxy: a missing channel-binding check ... (about 20 lines of reader-facing
      text carry an em dash)'
    ground_truth: House style bars em dashes in reader-facing entry text (the '## Update — <at>' section heading is the one
      exception); the title, cves[].fixed, body ¶1-¶3, actions[0] and the update record summary all carry em dashes (grep
      finds 20 such lines).
    ground_truth_url: https://www.frankysweb.de/en/exchange-public-exploit-for-critical-vulnerability-cve-2026-62911/
    fix: Replace each em dash with a comma, colon or full stop.
  - code: F11
    where: techniques
    claim: 'techniques: [T1190, T1557, T1068]'
    ground_truth: MB VRED describes the coercion step explicitly (MS-EFSR / PetitPotam EfsRpcEncryptFileSrv forcing the Exchange
      server to authenticate to an attacker UNC path, then relay to MRSProxy on a second server); T1187 Forced Authentication
      is active in the pinned dataset and is not mapped.
    ground_truth_url: https://vred.mbbank.com.vn/p/analysis-of-exchange-server-pre-auth
    fix: Add T1187 (optionally T1557.001 for the SMB/NTLM relay) to techniques[].
  - code: F5
    where: section 2026-09-01T04:40:00Z ¶1 last sentence
    claim: 'BSI''s standing advice is unchanged: restrict internet-facing access to an Exchange server''s web-based services
      to trusted source IP ranges, or place it behind a VPN.'
    ground_truth: Supported by heise ("Das BSI empfiehlt grundsätzlich, den Zugriff aus dem Internet auf webbasierte Dienste
      eines Exchange-Servers auf vertrauenswürdige Quell-IPs zu beschränken oder über ein VPN abzusichern") but the sentence
      has no inline citation.
    ground_truth_url: https://www.heise.de/news/Exchange-Sicherheitsluecke-85-Prozent-der-On-Prem-Server-in-Deutschland-anfaellig-11434785.html
    fix: Append ([BSI, via heise Security, 2026-08-31](https://www.heise.de/news/Exchange-Sicherheitsluecke-85-Prozent-der-On-Prem-Server-in-Deutschland-anfaellig-11434785.html)).
  - code: F14
    where: summary
    claim: now has working exploit code published on GitHub (27 August 2026)
    ground_truth: (low confidence) Franky's Web (dated 2026-08-27) says only that exploit code "has surfaced" and links the
      GitHub repository; heise says it was published "Kurz vor dem vergangenen Wochenende". No cited source dates the GitHub
      publication to 27 August; the body's "around 27 August" is the supportable form.
    ground_truth_url: https://www.frankysweb.de/en/exchange-public-exploit-for-critical-vulnerability-cve-2026-62911/
    fix: Write "around 27 August 2026" (or cite the repository's first commit date).
  notes: 'Named lead resolved, no defect: both German CERT-Bund evidence quotes are verbatim, contiguous substrings of https://social.bund.de/@certbund/117171896801475447
    (the Mastodon page is a JavaScript shell; the post text is carried in its og:description and description meta tags, which
    the gate''s text extraction did not read), and the English translations are faithful. Post timestamp decodes to 2026-08-28T07:14Z.
    MSRC CVRF confirms CVSS 3.1 8.0 (PR:L/UI:R), ''Exploitation Less Likely'', revision history 1.0 only, and the four KB/build
    pairs.'
