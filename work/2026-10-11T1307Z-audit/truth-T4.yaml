- entry: entries/2026-09-28/cve-2019-18935-telerik-godzilla-webshell-virtualpathprovider.md
  verdict: imprecision
  defects:
  - code: F8
    where: cves[CVE-2019-18935].fixed / body ¶1 / Defender takeaway (no Exposure line)
    claim: patched by the vendor since version 2020.1.114 ... patch to 2020.1.114 or later now
    ground_truth: 'Telerik''s own knowledge-base article (the per-CVE vendor authority) states the prerequisites: "An attacker
      can break the RadAsyncUpload encryption (or have prior knowledge of your custom encryption keys) and stage a malicious
      request" and "The type whitelisting feature of RadAsyncUpload is not enabled"; for "R1 2020 (2020.1.114) and later"
      the exploit is "Not possible through RadAsyncUpload, unless the attacker has access to your encryption keys" and the
      recommendation remains "Apply the recommended security settings". 2020.1.114 is a hardened default, not a closed hole:
      a server on 2020.1.114+ with leaked or default encryption keys remains exposed, and the entry gives no Exposure line
      or key and whitelist hardening step. AhnLab itself only says to upgrade to 2020.1.114 or later.'
    ground_truth_url: https://www.telerik.com/products/aspnet-ajax/documentation/knowledge-base/common-allows-javascriptserializer-deserialization
    fix: 'Add an **Exposure:** line (unpatched or key-compromised RadAsyncUpload on IIS; type whitelisting off) and extend
      the takeaway: upgrade to 2020.1.114 or later AND apply Telerik''s recommended RadAsyncUpload security settings (type
      whitelist, non-default keys), citing the Telerik KB.'
  - code: F14
    where: title, headline, body ¶2
    claim: a six-year-old Telerik deserialization bug ... six years after disclosure
    ground_truth: (low confidence) CVE-2019-18935 carries a 2019 identifier (disclosed Dec 2019, about 6.8 years before the
      2026-09-27 AhnLab post); the patch/hardening release 2020.1.114 is six years old. AhnLab states neither 'six-year-old'
      nor 'six years after disclosure'; the sentence 'A vulnerability whose patch has existed for six years' is the accurate
      framing.
    ground_truth_url: https://asec.ahnlab.com/en/95561/
    fix: Use "patched since 2020" in the headline and drop "six years after disclosure".
