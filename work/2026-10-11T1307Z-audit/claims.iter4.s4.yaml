  surface: body
  kind: derived
  text: 'Detection concept: `unbound` crash-loops or repeated resolver-process restarts that correlate with resolution of an unusual or newly registered authoritative zone are the closest available behavioral
    signal in the absence of a public proof-of-concept; no PoC was found at time of writing.'
