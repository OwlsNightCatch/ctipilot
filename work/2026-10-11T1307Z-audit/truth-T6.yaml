- entry: entries/2026-06-30/cve-2026-8037-progress-kemp-loadmaster-pre-auth-rce-via-unin.md
  verdict: factual-error
  defects:
  - code: F3
    where: section 2026-07-02T04:55:25Z ¶2
    claim: eSentire assesses that public PoC availability plus detailed technical write-ups will drive continued and likely
      more successful attacks near-term ([The Hacker News, 2026-07-01](https://thehackernews.com/2026/07/latest-progress-kemp-loadmaster-pre.html))
    ground_truth: 'eSentire: ''the eSentire Threat Intelligence team assesses that it is highly probably exploitation attempts
      targeting CVE-2026-8037 will increase in the immediate future.'' The Hacker News: ''the availability of a proof-of-concept
      (PoC) exploit and detailed technical specifics is expected to drive malicious activity against CVE-2026-8037 in the
      immediate future.'' Neither source says ''likely more successful attacks''; eSentire says the observed attempts failed.'
    ground_truth_url: https://www.esentire.com/security-advisories/progress-kemp-loadmaster-vulnerability-targeted-cve-2026-8037
    fix: eSentire assesses that exploitation attempts will increase in the immediate future (all observed attempts so far
      failed).
  - code: F3
    where: section 2026-08-08T04:45:00Z ¶1
    claim: The catalog record describes the flaw as a command injection that "allows an un-authenticated attacker to execute
      arbitrary commands on the LoadMaster appliance by exploiting unsanitized input in multiple command endpoints," classes
      it CWE-77, and records known ransomware-campaign use as unknown ([CISA, 2026-08-07](https://www.cisa.gov/news-events/alerts/2026/08/07/cisa-adds-one-known-exploited-vulnerability-catalog))
    ground_truth: 'The cited CISA alert (fetched via WebFetch) lists only ''CVE-2026-8037 Progress LoadMaster Command Injection
      Vulnerability'' and ''based on evidence of active exploitation''; it mentions neither CWE nor ransomware-campaign use.
      The quoted description, CWE-77 and knownRansomwareCampaignUse ''Unknown'' are in the KEV JSON record (fetch_source cisa-kev:
      shortDescription as quoted, cwes [''CWE-77''], dateAdded 2026-08-07), which is a different listed source.'
    ground_truth_url: https://www.cisa.gov/news-events/alerts/2026/08/07/cisa-adds-one-known-exploited-vulnerability-catalog
    fix: Re-point the citation for the description, CWE-77 and ransomware-flag clause to ([CISA KEV catalog, 2026-08-07](https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json));
      keep the alert only for 'based on evidence of active exploitation'.
  - code: F5
    where: section 2026-08-08T04:45:00Z ¶4
    claim: 'Detection remains network-side rather than host-side, because the appliance does not normally surface process
      telemetry to defenders: ... and repeated probing of that endpoint from related sources in a short window, are the observable
      shape ([watchTowr Labs, 2026-06-29](...)). **Triage:** legitimate LoadMaster API clients authenticate and send well-formed
      payloads from a small, stable set of management sources.'
    ground_truth: (low confidence) watchTowr's article shows the exploit request (POST /accessv2 with a JSON body whose apiuser
      holds four single quotes plus many sprayed extra keys) and says nothing about detection, repeated probing from related
      sources, process telemetry, or the population of legitimate API clients. The 'no process telemetry' premise and the
      Triage baseline are uncited analyst assertions; the 'repeated probing' clause is attributed to a page that does not
      carry it.
    ground_truth_url: https://labs.watchtowr.com/enterprise-tech-in-shell-out-progress-kemp-loadmaster-uninitialized-heap-to-pre-auth-rce-cve-2026-8037/
    fix: Cite only what watchTowr shows (unauthenticated POST /accessv2 with an oversized JSON body of repeated keys and an
      apiuser value of repeated single quotes); mark the remaining telemetry/Triage statements as inference or drop them.
  - code: F8
    where: main analysis labelled lines
    claim: 'Hardening: patch to GA v7.2.63.2 or LTSF v7.2.54.18; perimeter anomaly detection for unusual character sequences
      in JSON POSTs to `/accessv2`.'
    ground_truth: The entry carries no `**Defender takeaway:**` line (required on every entry) and no `**Exposure:**` / `**Detection:**`
      lines in the main analysis; only a `**Triage:**` line exists, inside the 2026-08-08 section. Sources support Exposure
      (API-enabled LoadMaster GA <= 7.2.63.1 / LTSF <= 7.2.54.17) and the post-patch compromise check.
    ground_truth_url: https://labs.watchtowr.com/enterprise-tech-in-shell-out-progress-kemp-loadmaster-uninitialized-heap-to-pre-auth-rce-cve-2026-8037/
    fix: Add `**Exposure:**`, `**Detection:**` and `**Defender takeaway:**` lines to the main analysis (patch, disable the
      API where unneeded, assess compromise of any appliance that was internet-reachable with the API enabled before patching).
  - code: F11
    where: section 2026-07-02T04:55:25Z ¶1 and updates[1].summary
    claim: CVE-2026-8037 — the Progress Kemp LoadMaster ... (CVSS 9.6–9.8) — began 2026-06-29 / When this pipeline last covered
      it on 2026-07-02
    ground_truth: (low confidence) Em dashes in reader-facing section prose, and workflow-internal wording ('this pipeline
      last covered it') in a changelog record summary that the /changes page and feeds render. The record is append-only;
      the section prose can be fixed.
    ground_truth_url: https://www.esentire.com/security-advisories/progress-kemp-loadmaster-vulnerability-targeted-cve-2026-8037
    fix: Replace the em dashes in the section prose with commas/parentheses; leave the immutable record summary or accept
      as residual.
- entry: entries/2026-07-13/servicenow-ai-platform-sandbox-escape-cve-2026-6875.md
