    where: section 2026-07-21T04:38:00Z ¶2 and headline
    claim: ServiceNow's hosted/SaaS estate is already remediated, so exposure concentrates in on-prem and MSP-run deployments,
      which should be inventoried first. / self-hosted and partner-managed instances are the residual exposure
    ground_truth: 'The sentence carries no citation. ServiceNow''s KB says only ''ServiceNow addressed this vulnerability
      by deploying a security update to hosted instances. Relevant security updates have also been provided to ServiceNow
      self-hosted customers and partners.'' BleepingComputer: ''ServiceNow addressed the flaw across hosted instances starting
      in April'', and the spokesperson ''encourage[s] our self-hosted and ServiceNow-hosted customers to apply the relevant
      patches if they have not already done so''. NCSC-CH lists the affected product as ''ServiceNow AI Platform (hosted and
      self-hosted instances)''. No source says ''MSP-run'' or ''partner-managed'' deployments are the residual exposure, or
      that the hosted estate is fully remediated.'
