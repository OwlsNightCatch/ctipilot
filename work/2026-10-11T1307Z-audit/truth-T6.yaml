    ground_truth: '(low confidence) ''AI Platform'' is only the product name. No cited source describes AI abuse, and the
      flaw is a sandbox escape giving unauthenticated code execution (Searchlight: pre-auth GlideRecord javascript: evaluation
      then gs.include() sandbox escape), not an authentication bypass.'
    ground_truth_url: https://slcyber.io/research-center/smashing-the-servicenow-sandbox-pre-authentication-rce/
