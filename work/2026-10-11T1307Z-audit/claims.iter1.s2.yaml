  entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
  surface: body
  kind: cited
  text: In Visual Studio Code a `folderOpen` task under `tasks.json` runs the dropper when an infected repository is merely opened, and where the stolen credential set includes a GitHub App token the worm
