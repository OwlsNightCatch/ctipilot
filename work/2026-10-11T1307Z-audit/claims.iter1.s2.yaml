  kind: cited
  text: The payload is cross-platform across Linux, macOS and Windows, and is heavily obfuscated at 711 kilobytes using control-flow flattening (
  urls:
  - https://www.elastic.co/security-labs/shai-hulud-chaindrop-npm-supply-chain
