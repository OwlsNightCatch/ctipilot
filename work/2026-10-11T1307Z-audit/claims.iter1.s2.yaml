  entry: 2026-06-10/ncsc-ch-week-23-coordinated-surge-in-job-seeker-targeting-fa
  surface: body
  kind: uncited
  text: In the third, a recruiter on LinkedIn, in one case writing from a compromised but genuine-looking profile, offered a technical position and, as part of a technical interview, asked the candidate
