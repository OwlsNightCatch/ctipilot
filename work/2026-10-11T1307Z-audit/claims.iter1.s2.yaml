  entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
  surface: body
  kind: cited
  text: Elastic frames the wave explicitly as the return of Shai-Hulud rather than a new family, and points to the Dune-derived naming the payload reuses as the similarity to previous Shai-Hulud campaigns
    (
  urls:
  - https://www.elastic.co/security-labs/shai-hulud-chaindrop-npm-supply-chain
