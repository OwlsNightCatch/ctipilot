- claim_id: 28bfcac61e
  entry: 2026-05-09/denic-de-dnssec-outage-faulty-key-rollover-3-5-h-disruption
  surface: body
  kind: cited
  text: 'DENIC''s analysis traces the fault to in-house code around its hardware security modules in the third-generation signing system it put into operation in April 2026: instead of one key pair stored
    on three HSMs, the software generated three different key pairs, one per HSM, and only one of them matched the pre-published DNSKEY ('
  urls:
  - https://blog.denic.de/analyse-des-dns-ausfalls-vom-5-mai-2026/
- claim_id: d0c1ae3bff
  entry: 2026-05-09/denic-de-dnssec-outage-faulty-key-rollover-3-5-h-disruption
  surface: body
  kind: cited
  text: Because signatures over NSEC3 records were also unverifiable, even second-level domains without DNSSEC failed to resolve, and DENIC's three permanent validation tools detected the anomaly but their
    alerts were not processed correctly (
  urls:
  - https://blog.denic.de/analyse-des-dns-ausfalls-vom-5-mai-2026/
- claim_id: 40b987711d
  entry: 2026-05-09/denic-de-dnssec-outage-faulty-key-rollover-3-5-h-disruption
  surface: body
  kind: cited
  text: '**Defender takeaway:** a TLD-side DNSSEC failure looks the same as an attack to a validating resolver; operators of validating resolvers should have a tested way to mark a broken TLD as insecure
    and should rely on serve-stale to absorb the first hours, as Cloudflare did ('
  urls:
  - https://blog.cloudflare.com/de-tld-outage-dnssec/
- claim_id: c457d15bc3
  entry: 2026-05-09/denic-de-dnssec-outage-faulty-key-rollover-3-5-h-disruption
  surface: section 2026-10-11T14:30:46Z
  kind: cited
  text: 'DENIC''s times are local: the incident ran from 21:57 CEST (19:57 UTC) until normal operation returned at 01:15 CEST (23:15 UTC) ('
  urls:
  - https://blog.denic.de/en/technical-issue-with-de-domains-resolved/
- claim_id: ca976c2853
  entry: 2026-05-09/denic-de-dnssec-outage-faulty-key-rollover-3-5-h-disruption
  surface: section 2026-10-11T14:30:46Z
  kind: cited
  text: ), and Cloudflare dates the onset to about 19:30 UTC and its own mitigation, an override rule rather than a native negative trust anchor, to 22:17 UTC (
  urls:
  - https://blog.cloudflare.com/de-tld-outage-dnssec/
- claim_id: dec5a98de1
  entry: 2026-05-09/denic-de-dnssec-outage-faulty-key-rollover-3-5-h-disruption
  surface: section 2026-10-11T14:30:46Z
  kind: cited
  text: DENIC's addendum of 11 May 2026 says no key-tag collision occurred; the software generated one key pair per HSM, and only one matched the published DNSKEY (
  urls:
  - https://blog.denic.de/analyse-des-dns-ausfalls-vom-5-mai-2026/
- claim_id: 2e9b5cfee6
  entry: 2026-05-09/denic-de-dnssec-outage-faulty-key-rollover-3-5-h-disruption
  surface: section 2026-10-11T14:30:46Z
  kind: uncited
  text: No source gives 18 million affected domains, singles out government domains, or mentions `.ch`.
- claim_id: c73e175a77
  entry: 2026-05-09/denic-de-dnssec-outage-faulty-key-rollover-3-5-h-disruption
  surface: record 2026-10-11T14:30:46Z
  kind: record-summary
  text: 'The times were local time labelled UTC: the outage ran from about 19:30 to 19:57 UTC until 23:15 UTC, about three hours. Cloudflare''s mitigation came about 2 hours 45 minutes after onset through
    an override rule, not an RFC 7646 negative trust anchor within 90 minutes; the 18 million domains, the government focus and the statement that .ch was unaffected had no source. DENIC''s addendum of
    11 May replaces the key-tag collision account: one key pair per HSM instead of a shared pair. The signing system went live in April, not March. The entry is recorded as a non-adversarial resilience
    item with a rating and priority routine, and both sections are corrected in place.'
- claim_id: fc191a81ec
  entry: 2026-09-29/microsoft-storm-2570-cross-raas-toolkit
  surface: body
  kind: cited
  text: Microsoft Threat Intelligence profiles Storm-2570, a ransomware affiliate it has tracked since April 2025 that operates across multiple ransomware-as-a-service ecosystems rather than committing
    to one brand, deploying Qilin, DragonForce, Anubis and BERT payloads interchangeably against victims in healthcare, education, government agencies and services, financial services, energy, retail, IT
    and food/agriculture across the US, Canada, UK, Spain, the Netherlands and Puerto Rico (
  urls:
  - https://www.microsoft.com/en-us/security/blog/2026/09/24/beyond-ransomware-tracking-storm-2570-consistent-tradecraft-across-deployments/
- claim_id: ce306bdf22
  entry: 2026-09-29/microsoft-storm-2570-cross-raas-toolkit
  surface: body
  kind: uncited
  text: Post-compromise, the affiliate routinely conducts internal network discovery using NetScan, SoftPerfect Network Scanner Portable and Nmap alongside native discovery commands and file-searching activity,
    to identify reachable hosts and services, map internal networks and locate systems, shares and files of interest ahead of credential access or encryption.
- claim_id: 469a0bbdd9
  entry: 2026-09-29/microsoft-storm-2570-cross-raas-toolkit
  surface: body
  kind: uncited
  text: 'Regardless of the final ransomware brand, Microsoft describes a recurring commodity toolchain across deployments: MeshAgent/MeshCentral, frequently renamed per-victim (for example `meshagent64-[org].exe`)
    and one of the affiliate''s most frequently observed tools, as an operational bridge between initial hands-on-keyboard activity and later-stage actions such as account manipulation, discovery and credential
    access (Microsoft says the initial access method remains unconfirmed); Atera plus Splashtop, ScreenConnect, NinjaRMM, and, in one intrusion, a persistent LocalSystem-service `Cloudflared.exe` tunnel,
    and ngrok exposing RDP for redundant remote access; `ntdsutil`-driven Install-From-Media dumps of `ntds.dit` for offline domain-credential extraction; Mimikatz, LaZagne and pypykatz for credential harvesting;
    systematic Windows Defender tampering (disabling real-time monitoring, adding `C:\PerfLogs` exclusions, direct `WinDefend` registry edits) ahead of deployment; PsExec-driven lateral movement using `@ip.txt`
    host lists, including an `rdp.bat` script that force-enables RDP, alongside Impacket and NetExec over SMB; and s5cmd- or Rclone-based exfiltration to attacker-controlled S3 buckets ahead of double-extortion.'
- claim_id: a311387a2f
  entry: 2026-09-29/microsoft-storm-2570-cross-raas-toolkit
  surface: body
  kind: uncited
  text: Because the toolkit, not the ransomware brand, is what recurs, defenders who alert only on a known ransomware binary or a specific RaaS brand's indicators will miss the affiliate entirely on its
    next engagement under a different payload.
- claim_id: 154fd4c7df
  entry: 2026-09-29/microsoft-storm-2570-cross-raas-toolkit
  surface: body
  kind: uncited
  text: 'The consistent tradecraft gives a detection surface that survives a brand switch: a renamed MeshAgent binary establishing outbound C2, an `ntdsutil` IFM snapshot followed by offline credential
    extraction, a persistent-service `Cloudflared.exe` process, discovery-scanner activity (NetScan/Nmap) ahead of lateral movement, and s5cmd/Rclone processes initiating outbound transfers to cloud object
    storage are the behaviors Microsoft''s reporting keys on across Storm-2570 engagements, independent of which ransomware note appears at the end.'
- claim_id: 2108167784
  entry: 2026-09-29/microsoft-storm-2570-cross-raas-toolkit
  surface: body
  kind: uncited
  text: Microsoft's own post closes with a Defender XDR detection and mitigation mapping tied to each of these behaviors.
- claim_id: f312e575d1
  entry: 2026-09-29/microsoft-storm-2570-cross-raas-toolkit
  surface: body
  kind: derived
  text: '**Triage:** MeshAgent, Atera, ScreenConnect and NinjaRMM are legitimate tools many organizations already run for IT support; the discriminator is not the tool''s presence but its provenance and
    configuration: Microsoft describes a renamed executable (`meshagent64-[org].exe` rather than the vendor''s own binary name) and a `Cloudflared.exe` tunnel registered as a persistent LocalSystem service;
    an RMM agent that appeared outside a change-managed deployment window is a further discriminator a responder can apply.'
- claim_id: d38ceded66
  entry: 2026-09-29/microsoft-storm-2570-cross-raas-toolkit
  surface: body
  kind: derived
  text: '**Defender takeaway:** hunt for the toolkit, not the brand.'
- claim_id: 375f4360d0
  entry: 2026-09-29/microsoft-storm-2570-cross-raas-toolkit
  surface: body
  kind: derived
  text: A government agency estate should specifically watch for `ntdsutil` invoking Install-From-Media snapshots outside a scheduled backup window, unregistered or renamed RMM agents establishing outbound
    connections, and `Cloudflared.exe` or `ngrok` running as a persistent service on a domain-joined host; any one of these on a host with no legitimate business reason to run it is worth a compromise assessment
    regardless of which ransomware family, if any, is ultimately deployed.
