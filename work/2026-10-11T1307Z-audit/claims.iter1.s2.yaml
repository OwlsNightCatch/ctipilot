- claim_id: 2dea04547b
  entry: 2026-07-09/ncsc-ch-rogueplanet-cve-2026-50656-defender-lpe-fixed
  surface: body
  kind: cited
  text: 'NCSC-CH''s running tracker on the "Nightmare Eclipse" (aka Chaotic Eclipse) researcher''s 2026 zero-day PoC series was updated on 2026-07-09 to record that a CVE has been assigned to **RoguePlanet**:
    **CVE-2026-50656**, a local privilege-escalation vulnerability (CWE-59, improper link resolution before file access / "link following") in the Microsoft Malware Protection Engine that underpins Microsoft
    Defender, System Center Endpoint Protection and Microsoft Security Essentials ('
  urls:
  - https://security-hub.ncsc.admin.ch/#/posts/12622
- claim_id: 939f243d55
  entry: 2026-07-09/ncsc-ch-rogueplanet-cve-2026-50656-defender-lpe-fixed
  surface: body
  kind: cited
  text: The researcher first disclosed RoguePlanet as an unpatched zero-day on 2026-06-10, describing a race condition in Defender that lets a local attacker "execute arbitrary code or spawn a command shell
    with SYSTEM-level privileges" (`T1068`), at which point NCSC-CH logged its status as "Proof of Concept Available, no patch available" (
  urls:
  - https://security-hub.ncsc.admin.ch/#/posts/12622
- claim_id: 873946c09c
  entry: 2026-07-09/ncsc-ch-rogueplanet-cve-2026-50656-defender-lpe-fixed
  surface: body
  kind: cited
  text: Microsoft's own record shows the CVE was published 2026-06-16 (CVSS 3.1 7.8, `AV:L/AC:L/PR:L/UI:N`, rated "Exploitation More Likely", exploitation status "No") and remained without a fix for over
    three weeks; a revision dated 2026-07-08 confirms Microsoft has now shipped an engine update that closes it — last vulnerable Malware Protection Engine build **1.1.26050.11**, first fixed build **1.1.26060.3008**
    (
  urls:
  - https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-50656
- claim_id: 761482d774
  entry: 2026-07-09/ncsc-ch-rogueplanet-cve-2026-50656-defender-lpe-fixed
  surface: body
  kind: cited
  text: 'The operational nuance is the exception set: any environment where engine updates are pinned, WSUS-gated, air-gapped, or centrally deferred (System Center Endpoint Protection deployments, offline
    or OT-adjacent Windows hosts) should explicitly verify the installed engine version rather than assume auto-remediation occurred ('
  urls:
  - https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-50656
- claim_id: 1ac4431122
  entry: 2026-07-09/ncsc-ch-rogueplanet-cve-2026-50656-defender-lpe-fixed
  surface: body
  kind: uncited
  text: Because the Malware Protection Engine (`mpengine.dll`) auto-updates multiple times a day by default, most estates will already carry the fixed build — Microsoft's guidance is that no manual action
    is normally required.
- claim_id: c090f4d744
  entry: 2026-07-09/ncsc-ch-rogueplanet-cve-2026-50656-defender-lpe-fixed
  surface: body
  kind: uncited
  text: Microsoft also notes that hosts with Defender disabled are not in an exploitable state even though vulnerability scanners flag the on-disk binaries.
- claim_id: 3f240e031b
  entry: 2026-07-09/ncsc-ch-rogueplanet-cve-2026-50656-defender-lpe-fixed
  surface: body
  kind: uncited
  text: '**Triage:** the exploit abuses a symlink/junction race against files Defender is actively scanning, so the telemetry class is symlink/junction creation targeting Defender scan paths and, on success,
    `MsMpEng.exe` (the engine''s scan host) spawning an unexpected child process with a SYSTEM token outside the normal signature/engine-update cadence — the update-cadence anchoring is the discriminator
    from routine engine activity.'
- claim_id: 4eaeac3979
  entry: 2026-07-09/ncsc-ch-rogueplanet-cve-2026-50656-defender-lpe-fixed
  surface: body
  kind: uncited
  text: This closes RoguePlanet specifically; NCSC-CH continues to track the wider Nightmare Eclipse PoC series as a home-region authority, which is the reason a single-host LPE closure like this one is
    worth surfacing to defenders at all.
