  entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
  surface: body
  kind: cited
  text: The chain starts at a `preinstall` hook in `package.json`, abusing a legitimate npm feature that runs arbitrary commands before a package is installed and therefore needs no interaction from the
    victim beyond the install itself (
  urls:
  - https://www.elastic.co/security-labs/shai-hulud-chaindrop-npm-supply-chain
