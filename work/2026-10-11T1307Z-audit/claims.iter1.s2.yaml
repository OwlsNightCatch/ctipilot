  entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
  surface: body
  kind: cited
  text: It appears under two filenames — one in packages compromised directly from the keyv monorepo, another in packages trojanised during worm propagation — which share the same hash, so the filename
