  entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
  surface: body
  kind: cited
  text: 'Elastic reports over 400 unique npm packages compromised at the time of writing, and quantifies the blast radius through download volume: keyv alone received over 600 million downloads in the preceding
    month, with flat-cache near 580 million, cacheable-request over 137 million, cacheable over 30 million and cache-manager over 16 million ('
  urls:
  - https://www.elastic.co/security-labs/shai-hulud-chaindrop-npm-supply-chain
