- claim_id: fd8da8f231
  entry: 2026-09-28/storm-3168-jadepuffer-azure-destructive-service-principal
  surface: summary
  kind: frontmatter
  text: Microsoft Security Research documents Azure resource-destruction activity it associates with JADEPUFFER (tracked by Microsoft as Storm-3168), the actor Sysdig disclosed in July 2026 as the first
    documented agentic-ransomware operation. Of two compromised service principals from one tenant, one enumerated resources for over 15 hours; the second ran a roughly seven-minute destructive burst that
    attempted 100+ storage-account deletions (most succeeded, some blocked by resource locks), deleted a Key Vault, a Function App and an App Service plan, and attempted to delete Azure Site Recovery and
    Backup protection locks before harvesting storage-account keys. Timing evidence points to automated, scripted execution. Microsoft says it is unclear how the service principal was compromised. As possible
    initial access it notes a service-principal secret an employee posted in plaintext in a public GitHub issue, which stayed retrievable through the issue's edit history after redaction, but it could not
    confirm that secret was used.
- claim_id: b332e8d649
  entry: 2026-09-28/storm-3168-jadepuffer-azure-destructive-service-principal
  surface: body
  kind: cited
  text: Microsoft Security Research has identified Azure resource-destruction activity it associates with JADEPUFFER, the threat actor Sysdig disclosed in July 2026 as the first documented agentic-ransomware
    operation, giving the first detailed view into the actor's cloud-native operations under Microsoft's own tracking designation Storm-3168 (
  urls:
  - https://www.microsoft.com/en-us/security/blog/2026/09/25/storm-3168-agentic-driven-cloud-attacks-using-compromised-service-principals/
- claim_id: 9b50da2a29
  entry: 2026-09-28/storm-3168-jadepuffer-azure-destructive-service-principal
  surface: body
  kind: cited
  text: 'Timing evidence drives Microsoft''s automation assessment: five distinct OAuth tokens were issued for the destructive and collection work, with two active during the same 70-second window performing
    different resource-type deletions in parallel: "the timing between the different operations and the division of work using multiple service principals and overlapping token streams from the same service
    principal strongly indicates automated or scripted execution" ('
  urls:
  - https://www.microsoft.com/en-us/security/blog/2026/09/25/storm-3168-agentic-driven-cloud-attacks-using-compromised-service-principals/
- claim_id: 3e9f39c0c3
  entry: 2026-09-28/storm-3168-jadepuffer-azure-destructive-service-principal
  surface: body
  kind: cited
  text: The issue was later edited to remove the visible secret, but the value remained retrievable through the issue's public edit history; Microsoft states plainly that "removing or redacting an exposed
    secret does not invalidate it," while also stating it "could not confirm whether this secret was used for the activity described here" (
  urls:
  - https://www.microsoft.com/en-us/security/blog/2026/09/25/storm-3168-agentic-driven-cloud-attacks-using-compromised-service-principals/
- claim_id: b6060ed1c2
  entry: 2026-09-28/storm-3168-jadepuffer-azure-destructive-service-principal
  surface: body
  kind: cited
  text: The `python-requests` user agent Microsoft observed on both compromised principals (
  urls:
  - https://www.microsoft.com/en-us/security/blog/2026/09/25/storm-3168-agentic-driven-cloud-attacks-using-compromised-service-principals/
- claim_id: 88fe5d6bbb
  entry: 2026-09-28/storm-3168-jadepuffer-azure-destructive-service-principal
  surface: body
  kind: cited
  text: 'The discriminator is the sequence Microsoft''s timeline shows: hours of read-only enumeration by one principal, then a bulk deletion burst by a second principal with multiple overlapping OAuth
    tokens performing different destructive operations in parallel, then a credential-harvesting ListKeys sweep, from principals with no prior operational history of this pattern ('
  urls:
  - https://www.microsoft.com/en-us/security/blog/2026/09/25/storm-3168-agentic-driven-cloud-attacks-using-compromised-service-principals/
- claim_id: 0e0bccfbb0
  entry: 2026-09-28/storm-3168-jadepuffer-azure-destructive-service-principal
  surface: body
  kind: cited
  text: Independent safeguards that do not rely on the compromised identity's own permissions, such as Azure resource locks and storage-account deletion protection, blocked the deletion of some storage
    accounts even though the service principal held broad rights (
  urls:
  - https://www.microsoft.com/en-us/security/blog/2026/09/25/storm-3168-agentic-driven-cloud-attacks-using-compromised-service-principals/
- claim_id: 647c0070b0
  entry: 2026-09-28/storm-3168-jadepuffer-azure-destructive-service-principal
  surface: body
  kind: cited
  text: The Azure SQL database deletions failed for a different reason, an unsupported API version in the actor's requests (
  urls:
  - https://www.microsoft.com/en-us/security/blog/2026/09/25/storm-3168-agentic-driven-cloud-attacks-using-compromised-service-principals/
- claim_id: edaf40d1b4
  entry: 2026-09-28/storm-3168-jadepuffer-azure-destructive-service-principal
  surface: body
  kind: uncited
  text: 'Two compromised service principals belonging to one tenant divided the work: the first spent roughly 15.5 hours running 300+ read-only enumeration calls across virtual machines, subscriptions and
    resource groups; the second, activated 90 minutes later, ran rapid parallel enumeration across two subscriptions in five seconds, then 16 hours later probed Azure App Service configuration stores and
    Azure OpenSearch resources, apparently hunting for exposed credentials.'
- claim_id: 93d6f8823b
  entry: 2026-09-28/storm-3168-jadepuffer-azure-destructive-service-principal
  surface: body
  kind: uncited
  text: 'Within one second of a failed key-retrieval attempt against a non-existent storage account, the same service principal began a roughly seven-minute destructive sequence: 100+ storage-account deletion
    attempts, mostly successful, though Azure resource locks and storage-account-level deletion protection blocked deletion for a subset, plus deletion of a Key Vault, Function App and App Service plan
    belonging to the same resource group.'
- claim_id: 92ffbafb89
  entry: 2026-09-28/storm-3168-jadepuffer-azure-destructive-service-principal
  surface: body
  kind: uncited
  text: Parallel attempts to delete Azure SQL databases failed only because the actor used an unsupported API version for that resource type.
- claim_id: 854025bf40
  entry: 2026-09-28/storm-3168-jadepuffer-azure-destructive-service-principal
  surface: body
  kind: uncited
  text: The actor also made repeated, unsuccessful attempts against Azure Site Recovery locks and Azure Backup protection locks, which Microsoft assesses as potentially intending to impair recovery, before
    pivoting roughly 30 minutes later to 30+ successful Storage-Account ListKeys credential-collection calls, including against Site-Recovery-related accounts, for possible future exfiltration.
- claim_id: 162f0b9af6
  entry: 2026-09-28/storm-3168-jadepuffer-azure-destructive-service-principal
  surface: body
  kind: uncited
  text: No ransom note or confirmed data exfiltration was observed in this specific activity, but Microsoft assesses the destruction, recovery-mechanism targeting and credential harvesting together as consistent
    with a ransomware/extortion-aligned objective.
- claim_id: 78f20dfdc5
  entry: 2026-09-28/storm-3168-jadepuffer-azure-destructive-service-principal
  surface: body
  kind: uncited
  text: Microsoft separately notes ongoing probing from Storm-3168-linked infrastructure since the start of the year against multiple Azure App Service customers, targeting WordPress-administration, PHP-CGI
    and LangFlow code-validation endpoints, but found no App-Service-to-ARM credential path connecting that probing to the tenant affected in this campaign.
- claim_id: d2f4dcc2d4
  entry: 2026-09-28/storm-3168-jadepuffer-azure-destructive-service-principal
  surface: body
  kind: uncited
  text: 'Initial access to the compromised service principal is not confirmed: it is "unclear how the service principal was initially compromised," but its client ID, client secret and tenant ID had previously
    been posted in plaintext in a public GitHub issue by an employee of the affected organization.'
- claim_id: 017b2de0c8
  entry: 2026-09-28/storm-3168-jadepuffer-azure-destructive-service-principal
  surface: body
  kind: uncited
  text: '**Detection and hunting.** In Azure Resource Manager audit-log telemetry, the signal is volume and sequencing rather than any single call: dozens to hundreds of deletion or ListKeys operations
    against storage accounts, Key Vaults and Function Apps within minutes, especially when preceded by hours of broad read-only enumeration from the same or a paired service principal; attempts against
    Site Recovery or Backup protection locks corroborate the sequence.'
- claim_id: 36835ebeee
  entry: 2026-09-28/storm-3168-jadepuffer-azure-destructive-service-principal
  surface: body
  kind: derived
  text: '**Triage:** legitimate infrastructure-as-code teardown and disaster-recovery testing can also delete storage accounts and Key Vaults in bulk, and decommissioning protected resources requires removing
    their locks first, so a lock-removal attempt corroborates rather than discriminates.'
- claim_id: 685c1e129e
  entry: 2026-09-28/storm-3168-jadepuffer-azure-destructive-service-principal
  surface: body
  kind: derived
  text: '**Defender takeaway:** treat any service-principal secret, storage key or connection string that has ever appeared in a public repository, issue, commit or gist as compromised the moment it is
    discovered, whatever its current visibility; Microsoft''s own conclusion is that an edit or redaction does not revoke the value.'
