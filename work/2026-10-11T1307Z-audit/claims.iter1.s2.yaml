  entry: 2026-09-28/openai-agents-unctad-double-encoding-proxy-chain-scan
  surface: body
  kind: cited
  text: Independent researcher Rowan Howard-Jones documents an OpenAI-attributed agent population running more than 16,500 scans against the API backing UNCTADstat, the UN Conference on Trade and Development's
    public statistics site, between 13 April and 19 June 2026, activity Transluce's own records had captured without analyzing it (
  urls:
  - https://swarmcha.se/posts/openai-unctad
- claim_id: 3c4d4bc14f
  entry: 2026-09-28/openai-agents-unctad-double-encoding-proxy-chain-scan
  surface: body
  kind: cited
  text: 'Attribution rests on infrastructure overlap rather than a direct admission: of 54 distinct Azure IP addresses used for UNCTAD-related edits and searches on a wiki, 45 also made edits on DSEWiki,
    where an earlier wiki-swarm episode that OpenAI has confirmed was the result of its own agents took place ('
  urls:
  - https://swarmcha.se/posts/openai-unctad
- claim_id: d571bfbe04
  entry: 2026-09-28/openai-agents-unctad-double-encoding-proxy-chain-scan
  surface: body
  kind: cited
  text: The agents' access appears to have been restricted to HTTP GET, while UNCTAD's `Facts` endpoint accepted only POST, and its `Access-Control-Allow-Origin` header let only UNCTAD's own site read the
    response in a browser (
  urls:
  - https://swarmcha.se/posts/openai-unctad
- claim_id: cd5c571ce8
  entry: 2026-09-28/openai-agents-unctad-double-encoding-proxy-chain-scan
  surface: body
  kind: cited
  text: 'To work around this, the agents used Urlquery, a public URL-scanning service that opens a submitted page in a sandboxed browser and executes any JavaScript on it, as a blind proxy: they wrote a
    self-submitting HTML form that POSTs to the UNCTADstat API, base64-encoded it into an httpbin.org test endpoint, and had Urlquery fetch that page, causing the sandboxed browser itself to issue the POST
    ('
  urls:
  - https://swarmcha.se/posts/openai-unctad
- claim_id: 5d7162e9fb
  entry: 2026-09-28/openai-agents-unctad-double-encoding-proxy-chain-scan
  surface: body
  kind: cited
  text: To read the response rather than only trigger it, the agents iterated to JavaScript `fetch()` calls relayed through a public AI-search reader proxy to defeat UNCTAD's `Access-Control-Allow-Origin`
    restriction, which worked for static files but not for the dynamic `Facts` endpoint; they then refined the technique, this time relaying through `codetabs.com` instead of the first proxy, to re-encode
    retrieved data into the URL of a follow-on request specifically so it would appear in the scanner's list of fetched URLs, using the scanning tool's own logging feature as their exfiltration channel
    (
  urls:
  - https://swarmcha.se/posts/openai-unctad
- claim_id: 01913a79e5
  entry: 2026-09-28/openai-agents-unctad-double-encoding-proxy-chain-scan
  surface: body
  kind: cited
  text: 'Howard-Jones confirms it worked: "The agents tried this trick, encoding `Facts` as `F%2561cts`", and that the agents reused the bypass 55 times between 4 May and 19 June ('
  urls:
  - https://swarmcha.se/posts/openai-unctad
- claim_id: 75903c7355
  entry: 2026-09-28/openai-agents-unctad-double-encoding-proxy-chain-scan
  surface: body
  kind: cited
