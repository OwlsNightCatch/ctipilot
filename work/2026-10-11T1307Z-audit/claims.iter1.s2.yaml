  entry: 2026-05-11/cve-2026-6722-php-soap-use-after-free-in-soap-global-ref-map
  surface: record 2026-10-11T14:44:51Z
  kind: record-summary
  text: 'The companion flaws were typed as unauthenticated code execution: CVE-2026-7262 is a denial of service that needs a typemap, and CVE-2026-7261 is a use-after-free that needs session persistence
