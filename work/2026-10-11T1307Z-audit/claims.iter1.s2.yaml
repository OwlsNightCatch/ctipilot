  entry: 2026-06-10/ncsc-ch-week-23-coordinated-surge-in-job-seeker-targeting-fa
  surface: body
  kind: uncited
  text: NCSC notes that attackers systematically exploit applicants' willingness to react quickly and engage with unfamiliar procedures.
- claim_id: 271f4fb48d
  entry: 2026-06-10/ncsc-ch-week-23-coordinated-surge-in-job-seeker-targeting-fa
  surface: body
  kind: derived
  text: '**Defender takeaway:** the LinkedIn-to-GitHub chain is a credible vector into corporate endpoints through employees in job-search mode and HR or talent teams handling external candidate code.'
- claim_id: 46f7b8fc78
  entry: 2026-06-10/ncsc-ch-week-23-coordinated-surge-in-job-seeker-targeting-fa
  surface: body
  kind: derived
  text: 'Detection concept, by inference from the mechanism: a repository clone or GitHub download followed within minutes by script execution from the freshly cloned path (process-creation telemetry, for
    example Sysmon event 1 with `git` or an interpreter as the parent).'
