  entry: 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver
  surface: body
  kind: cited
  text: Every subpackage in the keyv repository was backdoored with a dropper that checks whether the Bun JavaScript runtime is present and, if not, detects the host platform and architecture and downloads
    Bun directly from its official release page before using it to execute the payload; the temporary Bun directory is deleted afterwards (
  urls:
  - https://www.elastic.co/security-labs/shai-hulud-chaindrop-npm-supply-chain
