    text: "The summary still said no party reported exploitation, which the entry's own update of 2026-08-16 superseded with Defused's honeypot attempts. The rebuild-and-redeploy requirement for the NGINX-related note comes from Onapsis rather than SAP's patch-day page and now carries that citation, the note is identified as SAP's fix for the upstream NGINX flaw, and the entry links the NGINX entry. The main analysis no longer says no party reports exploitation, and its two statements about where the component sits and where legitimate imports come from are marked as analyst judgement; the NCSC-NL evidence quote is given in English with the Dutch original, and two overlapping Commerce Cloud actions are merged. No cited source calls the vulnerable endpoint an import endpoint, so the title, action and detection lines name the Data Hub Adapter endpoint; the patch-day status follows NCSC-CH's unknown rating, the remaining inferences are marked as analyst judgement, the CVE-2026-58243 sentence gains its citation, and earlier sections no longer refer to the entry itself. CVE-2026-58231 is no longer marked exploited: the reports are Defused's honeypot attempts, which NCSC-NL relays, and no party reports a compromised instance, the same standard the nginx entry applies. Note 3773203 is described in SAP's own words, and the Data Hub Adapter record names the affected releases."
