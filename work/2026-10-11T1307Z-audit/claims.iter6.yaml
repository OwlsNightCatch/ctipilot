    text: "{\"id\": \"CVE-2026-35616\", \"cvss\": \"9.1 (CVSS 3.1 temporal; base 9.8)\", \"status\": [\"exploited\", \"cisa-kev\", \"patch-available\"], \"affected\": \"FortiClient EMS 7.4.5 through 7.4.6\", \"fixed\": \"hotfix for 7.4.5 and 7.4.6; 7.4.7 or above\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
  - claim_id: 76993d1ed0
    entry: 2026-05-29/forticlient-ems-cve-2026-35616-ekz-infostealer-kill-chain
    surface: "body"
    kind: cited
    text: "CVE-2026-35616 is an API authentication bypass in FortiClient EMS 7.4.5 and 7.4.6 that Fortinet has observed exploited in the wild; a hotfix exists for both versions and 7.4.7 includes the fix ("
    urls: ["https://fortiguard.fortinet.com/psirt/FG-IR-26-099"]
  - claim_id: 3385a900a2
    entry: 2026-05-29/forticlient-ems-cve-2026-35616-ekz-infostealer-kill-chain
    surface: "body"
    kind: cited
    text: "CISA added it to its Known Exploited Vulnerabilities catalog on 2026-04-06 ("
    urls: ["https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"]
  - claim_id: 2d870bde55
    entry: 2026-05-29/forticlient-ems-cve-2026-35616-ekz-infostealer-kill-chain
    surface: "body"
    kind: cited
    text: "Bishop Fox traced the bypass to EMS's Django middleware trusting client-supplied `X-SSL-CLIENT-VERIFY` and certificate headers as if Apache had set them, combined with chain validation that matches only subject and issuer names without checking signatures, so a forged certificate chain passes ("
    urls: ["https://bishopfox.com/blog/api-authentication-bypass-in-forticlient-ems-7-4-5-7-4-6-cve-2026-35616"]
  - claim_id: 948b122ccc
    entry: 2026-05-29/forticlient-ems-cve-2026-35616-ekz-infostealer-kill-chain
    surface: "body"
    kind: cited
    text: "Arctic Wolf documented a campaign that used the flaw to reach managed endpoints ("
    urls: ["https://arcticwolf.com/resources/blog/forticlient-ems-exploited-via-cve-2026-35616-to-deliver-ekz-infostealer-disguised-as-a-fortinet-patch/"]
  - claim_id: 420fc5c361
    entry: 2026-05-29/forticlient-ems-cve-2026-35616-ekz-infostealer-kill-chain
    surface: "body"
    kind: cited
    text: "After authenticating as a Fabric device, the actor deferred upgrade reminders and edited the Remote Access Profile and endpoint policy to add scripts that run when FortiClient establishes a VPN tunnel; within seconds of an IPsec tunnel coming up, `fortitray.exe` launched GUID-named `.cmd` files through `cmd.exe`, which ran base64-encoded PowerShell that downloaded and ran a payload, slept 90 seconds and sent the script output out ("
    urls: ["https://arcticwolf.com/resources/blog/forticlient-ems-exploited-via-cve-2026-35616-to-deliver-ekz-infostealer-disguised-as-a-fortinet-patch/"]
  - claim_id: 2f408580c1
    entry: 2026-05-29/forticlient-ems-cve-2026-35616-ekz-infostealer-kill-chain
    surface: "body"
    kind: cited
    text: "The payload, disguised as `FortiEndpoint_Patch.exe`, is EKZ Infostealer, which exports credentials, cookies and autofill data from Chromium and Firefox browsers to a log file; for Chromium it copies itself into the browser's `Application` directory to get past app-bound encryption, and stolen cookies can let attackers reuse sessions without triggering MFA ("
    urls: ["https://arcticwolf.com/resources/blog/forticlient-ems-exploited-via-cve-2026-35616-to-deliver-ekz-infostealer-disguised-as-a-fortinet-patch/"]
  - claim_id: b22d65d370
    entry: 2026-05-29/forticlient-ems-cve-2026-35616-ekz-infostealer-kill-chain
    surface: "body"
    kind: cited
    text: "**Exposure:** FortiClient EMS 7.4.5 or 7.4.6 without the hotfix; every endpoint the EMS manages is reachable through its policies ("
    urls: ["https://fortiguard.fortinet.com/psirt/FG-IR-26-099", "https://arcticwolf.com/resources/blog/forticlient-ems-exploited-via-cve-2026-35616-to-deliver-ekz-infostealer-disguised-as-a-fortinet-patch/"]
  - claim_id: a944cfbd40
    entry: 2026-05-29/forticlient-ems-cve-2026-35616-ekz-infostealer-kill-chain
    surface: "body"
    kind: cited
    text: "**Detection:** in EMS logs, a request rejected with \"Certificate not found in request header\" followed by a Fabric-device certificate update, and unexpected edits to the Remote Access Profile or endpoint policy; on endpoints, `fortitray.exe` or `ipsec.exe` starting `cmd.exe` with a GUID-named script from the FortiClient trace folder, then encoded PowerShell ("
    urls: ["https://arcticwolf.com/resources/blog/forticlient-ems-exploited-via-cve-2026-35616-to-deliver-ekz-infostealer-disguised-as-a-fortinet-patch/"]
  - claim_id: bee561c535
    entry: 2026-05-29/forticlient-ems-cve-2026-35616-ekz-infostealer-kill-chain
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** a compromised EMS turns a trusted management channel into a fleet-wide execution path, so after patching review every Remote Access Profile and policy for added scripts and treat browser sessions on affected endpoints as stolen ("
    urls: ["https://arcticwolf.com/resources/blog/forticlient-ems-exploited-via-cve-2026-35616-to-deliver-ekz-infostealer-disguised-as-a-fortinet-patch/"]
  - claim_id: 11bf6ce05b
    entry: 2026-05-29/forticlient-ems-cve-2026-35616-ekz-infostealer-kill-chain
    surface: "section 2026-10-11T14:47:30Z"
    kind: cited
    text: "Bishop Fox attributes the bypass to EMS's Django middleware accepting client-supplied certificate headers and to chain validation that checks names without signatures ("
    urls: ["https://bishopfox.com/blog/api-authentication-bypass-in-forticlient-ems-7-4-5-7-4-6-cve-2026-35616"]
  - claim_id: 2792c219af
    entry: 2026-05-29/forticlient-ems-cve-2026-35616-ekz-infostealer-kill-chain
    surface: "section 2026-10-11T14:47:30Z"
    kind: cited
    text: "In Arctic Wolf's campaign the endpoints ran attacker scripts through VPN on-connect settings that `fortitray.exe` or `ipsec.exe` launched, and EKZ copies itself into the browser's `Application` directory ("
    urls: ["https://arcticwolf.com/resources/blog/forticlient-ems-exploited-via-cve-2026-35616-to-deliver-ekz-infostealer-disguised-as-a-fortinet-patch/"]
  - claim_id: acb0ff4e66
    entry: 2026-05-29/forticlient-ems-cve-2026-35616-ekz-infostealer-kill-chain
    surface: "record 2026-10-11T14:47:30Z"
    kind: record-summary
    text: "The mechanism was wrong: the bypass rests on EMS's Django middleware trusting client-supplied certificate headers plus name-only chain validation, not a reverse proxy stamping a header, and it bears no relation to the SharePoint CVE-2026-45659. The CVSS 9.1 is the temporal score of a vector with availability impact; the EPSS figure and the push of a signed update task had no source. The campaign ran through VPN on-connect scripts launched by fortitray.exe or ipsec.exe, and EKZ copies itself into the browser's Application directory, not into profile folders. The evidence quotes were not on the Arctic Wolf page and the region and sector tags had no source. The entry is rewritten from Fortinet, Bishop Fox and Arctic Wolf with exposure, detection and takeaway lines, verbatim evidence, a rating and an ATT&CK mapping."
