    kind: cited
    text: "Mandiant dates its zero-day exploitation to April 2026 at a service provider; the late-2025 to March activity was rogue peering, which may or may not have used the earlier bypasses, and the actor cleaned up by deleting its files and reverting configuration rather than wiping history or syslog ("
