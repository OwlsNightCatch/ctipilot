    surface: "body"
    kind: cited
    text: "Splunk's workaround is setting `disabled = true` in the `[postgres]` stanza of `server.conf` and restarting, except on instances using Edge Processor, OpAmp or SPL2 data pipelines, which it would break ("
    urls: ["https://advisory.splunk.com/advisories/SVD-2026-0603"]
