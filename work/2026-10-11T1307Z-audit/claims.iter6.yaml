  - claim_id: 3ce58e4b93
    entry: 2026-05-11/cve-2026-6722-php-soap-use-after-free-in-soap-global-ref-map
    surface: "record 2026-10-11T14:44:51Z"
    kind: record-summary
    text: "The companion flaws were typed as unauthenticated code execution: CVE-2026-7262 is a denial of service that needs a typemap, and CVE-2026-7261 is a use-after-free that needs session persistence and whose memory PHP calls unlikely to be attacker-controlled. The deep dive's refcounting functions, vtable overwrite, claims that the bugs cover all of Apache-map handling and that a SoapServer need not be instantiated, and its web-shell history had no source. PHP rates CVE-2026-6722 High against the CNA's 9.5 with high attack complexity, and the advisory includes a reproducer. The entry is rewritten from the three advisories and the release notes with an exposure line, a rating and an ATT&CK mapping. The priority moves from notable to routine: no source reports exploitation, and the entry's own takeaway calls the fix a patch-cycle upgrade."
  - claim_id: 9a764c2b04
    entry: 2026-05-12/palo-alto-pan-os-cve-2026-0300-first-wave-fixed-builds-now-s
