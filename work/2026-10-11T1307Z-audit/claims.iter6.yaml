    entry: 2026-07-16/cve-2026-46817-oracle-ebs-payments-preauth-rce-kev-listed
    surface: "record 2026-10-11T14:54:11Z"
    kind: record-summary
    text: "The title and CVE type called the flaw code execution, but Oracle and CISA describe a takeover of Oracle Payments and the observed exploit is a file read. The fix is Oracle's May 2026 Critical Security Patch Update, not a quietly shipped Critical Patch Update; the CWE wording comes from CISA's catalog, not Oracle; no source ties ShinyHunters or UNC6240 to EBS; and the European public-sector prevalence claim is replaced by Shadowserver's exposure count. The entry gains BleepingComputer and the KEV record as sources, the KEV forensic-triage flag, and a shorter hunt action. The Oracle advisory is dated 2026-05-21, its own date; 28 May is Help Net Security's compromise-assessment threshold, not a patch date; the patch action names the Critical Security Patch Update, and a hunting action that restated the Detection line is dropped. The sourcing note names the Critical Security Patch Update too, and the KEV listing is described as CISA states it, on evidence of active exploitation, without calling it the first confirmation."
  - claim_id: 1af9c71399
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: cited
    text: "JetBrains' advisory is short on mechanism by design and unambiguous on reach: an unauthenticated attacker with HTTP(S) access to a TeamCity On-Premises server can bypass authentication checks and run arbitrary operating-system commands with the privileges of the TeamCity server process, and every On-Premises version ever shipped is affected ("
    urls: ["https://blog.jetbrains.com/teamcity/2026/07/cve-2026-63077/"]
  - claim_id: 760abce027
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: cited
    text: "JetBrains' own framing is that exploitation of the flaw requires no authentication and that the attacker bypasses authentication checks by way of that protocol, so there is no credential, session, or user interaction standing between a network-reachable server and command execution ("
    urls: ["https://blog.jetbrains.com/teamcity/2026/07/cve-2026-63077/"]
  - claim_id: ec5674c05d
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: cited
    text: "The flaw was reported privately on 2026-07-10 by Antoni Tremblay, and JetBrains stated at publication that it was not aware of any active exploitation ("
    urls: ["https://blog.jetbrains.com/teamcity/2026/07/cve-2026-63077/"]
  - claim_id: 20397a15a2
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: cited
    text: "); on 2026-08-07 it reported \"active exploitation, as well as attempted exploitation, targeting unpatched TeamCity servers\" ("
    urls: ["https://blog.jetbrains.com/teamcity/2026/08/cve-2026-63077-update/"]
  - claim_id: 72c9b8e391
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: cited
    text: "CISA's catalog classifies it as CWE-502, deserialization of untrusted data, reachable through the agent polling protocol ("
    urls: ["https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"]
  - claim_id: 3ebda81273
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: cited
    text: "JetBrains says a successful attack could expose TeamCity data, configurations and stored credentials and compromise the integrity of build artifacts and downstream CI/CD pipelines ("
    urls: ["https://blog.jetbrains.com/teamcity/2026/07/cve-2026-63077/"]
  - claim_id: efa591ffaf
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: cited
    text: "TeamCity Cloud is already mitigated and needs no customer action ("
    urls: ["https://blog.jetbrains.com/teamcity/2026/07/cve-2026-63077/"]
  - claim_id: c7a209d351
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: cited
    text: "**Detection:** JetBrains' own indicators are server-log occurrences of `com.thoughtworks.xstream.converters.ConversionException`, which \"may indicate an attempted or successful exploit\", and unexpected entries in the list of unauthorized build agents; the date shown for such an agent is not the attempt time, so the log timestamps are what date an attempt ("
    urls: ["https://blog.jetbrains.com/teamcity/2026/08/cve-2026-63077-update/"]
  - claim_id: cdaffecf83
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: cited
    text: "**Triage:** on a server that already runs a fixed version or the security-patch plugin, `com.thoughtworks.xstream.security.ForbiddenClassException` in the log marks an exploitation attempt that was blocked, not a compromise ("
    urls: ["https://blog.jetbrains.com/teamcity/2026/08/cve-2026-63077-update/"]
  - claim_id: f08cbc2238
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: uncited
    text: "The reachable surface is the TeamCity agent polling protocol."
  - claim_id: 4b6053be90
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: uncited
    text: "The reason this warrants moving ahead of the ordinary patch queue is what a build server is, not the score."
  - claim_id: ef7a421728
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: uncited
    text: "At disclosure no public exploitation had been observed, and that clock ran out within nine days (see the updates below)."
  - claim_id: f59b75f3da
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: uncited
    text: "JetBrains published no technical detail beyond the agent polling protocol, but \"all versions affected\" plus \"no authentication\" plus a widely deployed, easily fingerprinted product is a combination that, in analyst judgement, tends to close quickly once someone reconstructs the path."
  - claim_id: 8a02778f44
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: derived
    text: "**Exposure:** every TeamCity On-Premises server that an attacker can reach over HTTP(S) and that runs a build older than 2025.11.7 or 2026.1.3 on its branch without the security-patch plugin for 2017.1 and later is affected."
  - claim_id: 45fbba6da6
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: derived
    text: "Beyond those, the observable is in the web-server or reverse-proxy access log in front of TeamCity and in process-creation telemetry on the server host."
  - claim_id: 1b5e869038
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: derived
    text: "Requests to the agent-polling endpoint arriving from addresses that are not your registered build agents are the first signal, and the second, the one that matters if the first was missed, is any child process spawned by the TeamCity server process that is not part of a build it was asked to run: shells, interpreters, or network utilities parented to the server rather than to an agent's build step."
  - claim_id: e2ba4f7951
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: derived
    text: "The agent-polling endpoint legitimately receives continuous check-in traffic from your build fleet, so request volume to it discriminates nothing on its own."
  - claim_id: a6303c8e0d
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: derived
    text: "The source address set is finite and knowable: your registered agents are an inventory, so polling traffic from anything outside it is the anomaly."
  - claim_id: 57c8a756ed
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: derived
    text: "And on the server host, legitimate command execution belongs to agent processes running build steps; the server process itself spawning an interpreter or a network utility is not a quieter version of normal activity but a different thing entirely."
  - claim_id: b31cda4d7d
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: derived
    text: "Hardening: apply 2025.11.7 or 2026.1.3, or the security-patch plugin on 2017.1 and later, and treat the agent-polling interface as an internal service."
  - claim_id: 2c1fc1a453
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: derived
    text: "If the only reason it faces the internet is that some agents live outside the network, a VPN or reverse tunnel for those agents removes the exposure that makes this flaw reachable at all."
  - claim_id: 5e6fc684a3
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** patch every TeamCity On-Premises server to a fixed version, and because CISA records ransomware use, treat any server that was internet-reachable and unpatched after 2026-07-27 as an incident-response case: check it for unenrolled build agents and for the server process spawning shells outside build execution, then rotate the credentials it holds (see the 2026-09-30 update)."
  - claim_id: 454ec951bc
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "section 2026-10-11T14:02:26Z"
    kind: cited
    text: "JetBrains did not say it withheld a gadget chain: its advisory describes exploitation only \"via the TeamCity agent polling protocol\" and publishes no further technical detail ("
    urls: ["https://blog.jetbrains.com/teamcity/2026/07/cve-2026-63077/"]
  - claim_id: 263dd634c4
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "section 2026-10-11T14:02:26Z"
    kind: uncited
    text: "The deserialization class comes from CISA's catalog record, and the exploitation status rests on two independent statements, JetBrains' follow-up and CISA's listing."
  - claim_id: 70785eb62f
    entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
    surface: "record 2026-10-11T14:02:26Z"
    kind: record-summary
    text: "The verification value moves to multi-source (JetBrains' exploitation follow-up and CISA's catalog listing are independent statements), and two sentences are reworded so they describe what JetBrains published rather than claim it withheld a gadget chain, and do not refer to the entry itself. The main analysis gains the current Defender takeaway (patch, then treat exposed unpatched servers as incident cases because of the recorded ransomware use), and the sentence on what a server holds now follows JetBrains' own wording. The sourcing note no longer says JetBrains withholds details."
