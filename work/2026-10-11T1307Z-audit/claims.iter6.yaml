    entry: 2026-07-16/cve-2026-46817-oracle-ebs-payments-preauth-rce-kev-listed
    surface: "summary"
    kind: frontmatter
    text: "CISA added CVE-2026-46817 to its Known Exploited Vulnerabilities catalog on 2026-07-15, on evidence of active exploitation. It is an unauthenticated flaw in the File Transmission component of Oracle Payments (the payment engine inside Oracle E-Business Suite 12.2.3–12.2.15) that Oracle fixed in its May 2026 Critical Security Patch Update. It is reachable over plain HTTP with no authentication (CVSS 9.8); any internet-facing EBS instance not on the May fix should be patched or taken off the public internet now, and treated as potentially compromised if it was exposed after 2026-05-28."
