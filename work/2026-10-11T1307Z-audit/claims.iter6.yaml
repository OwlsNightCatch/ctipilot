    text: "{\"id\": \"CVE-2026-43284\", \"cvss\": \"8.8 (kernel.org CNA; 7.8 CISA-ADP)\", \"status\": [\"poc-public\", \"patch-available\"], \"affected\": \"Linux kernels from 2017 (cac2661c53f3) until the f4c50a4034e6 fix\", \"fixed\": \"mainline f4c50a4034e6; distribution kernels per vendor\", \"auth\": \"post-auth\", \"vector\": \"local\"}"
