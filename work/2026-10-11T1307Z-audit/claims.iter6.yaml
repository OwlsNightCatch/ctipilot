    surface: "summary"
    kind: frontmatter
    text: "NCSC Switzerland issued a pre-event cyber advisory ahead of the G7 Évian summit, scheduled for 15–17 June: the NCSC explicitly anticipated hacktivist DDoS against Swiss organisations (NCSC Switzerland, 2026-06-01). An independent threat map additionally flags state intelligence collection against hotel/telecom infrastructure and mobile-device targeting, echoing the NoName057(16) DDoS waves seen during Bürgenstock 2024 (ZENDATA, 2026-05-03). Most delegations transit Swiss infrastructure (Geneva–Vaud corridor)."
