    kind: frontmatter
    text: "CVE-2026-87886 (CVSS 7.8) is a local privilege-escalation flaw from incorrect default file permissions in the Acronis Backup plugins for cPanel & WHM and DirectAdmin and the extension for Plesk. Acronis reports limited, targeted exploitation against cPanel & WHM deployments, an assessment it says rests on a single report from a potentially affected customer. CISA added the flaw to the KEV catalog on 2026-09-16, and fixed builds are available for all three products."
