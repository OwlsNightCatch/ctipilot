  - claim_id: 9b4a1a5fb6
    entry: 2026-09-12/cve-2026-85706-gitlab-unauth-path-traversal-file-read
    surface: "summary"
    kind: frontmatter
    text: "GitLab shipped 19.3.2, 19.2.6 and 19.1.8 on 2026-09-10, fixing CVE-2026-85706 (CVSS 10.0): improper path confinement and missing authentication enforcement in the repository commits API let an unauthenticated user read arbitrary files from the GitLab server. Every self-managed CE/EE install from 18.7 up to those releases is affected; watchTowr's global honeypot network was recording behavioral probes for the flaw by 2026-09-11, and CISA added it to its Known Exploited Vulnerabilities catalog on 2026-09-11. GitLab backported the fix to 19.0.9 and 18.11.12 on 2026-09-23."
  - claim_id: 6e084d034b
    entry: 2026-09-12/cve-2026-85706-gitlab-unauth-path-traversal-file-read
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade every self-managed GitLab CE/EE instance to 19.3.2 / 19.2.6 / 19.1.8 now, or on the 19.0 and 18.11 trains to the 19.0.9 / 18.11.12 backports, which carry only the CVE-2026-85706 and CVE-2026-87719 fixes and leave GitLab EE exposed to CVE-2026-88765 until 19.1.8 or later; GitLab.com is already patched and GitLab Dedicated needs no action. Assume any files an attacker-scripted request could reach (configuration files, secrets and CI/CD credentials) may have been read, and rotate them if the instance was internet-reachable and unpatched since 2026-09-10."
