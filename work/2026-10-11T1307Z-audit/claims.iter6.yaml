    entry: 2026-09-21/the-gentlemen-open-directory-vhdx-backup-ntds-theft
    surface: "summary"
    kind: frontmatter
    text: "Cisco Talos reconstructed a six-phase Active Directory attack chain used by an operator associated with the ransomware-as-a-service brand The Gentlemen, recovered from an exposed open directory's own command history. The chain tunnels through Chisel/Ligolo-ng, enumerates AD with NetExec (Talos says RustHound/BloodHound-related tools may also have been used), attempts to exploit a public-facing GLPI SQL injection, leaves traces suggesting Zerologon and MS17-010 exploitation while expanding into the network, then extracts ntds.dit and SAM offline from a CIFS-mounted VHDX backup image, and leaves traces indicating it exfiltrated the VHDX backup images themselves in 256MiB chunks to Wasabi cloud storage via rclone."
