  - claim_id: e907591a52
    entry: 2026-05-09/cve-2026-42208-litellm-proxy-pre-authentication-sql-injectio
    surface: "body"
    kind: cited
    text: "Bishop Fox confirmed that versions 1.81.16 through 1.83.6 are exploitable without credentials from any LLM API route, through the `Authorization: Bearer` value reaching `PrismaClient.get_data()`; the response is always the same HTTP 401, so exploitation runs over a time-based blind channel using PostgreSQL's `pg_sleep()` ("
