    surface: "body"
    kind: cited
    text: "CVE-2026-20253 (CVSS 9.8, CWE-306) lets an unauthenticated user create or truncate arbitrary files through a PostgreSQL sidecar service endpoint in Splunk Enterprise 10.0.0 to 10.0.6 and 10.2.0 to 10.2.3; Splunk fixed it in 10.0.7, 10.2.4 and 10.4.0, and 9.4 and earlier are not affected ("
