  - claim_id: 632c8f3126
    entry: 2026-05-29/forticlient-ems-cve-2026-35616-ekz-infostealer-kill-chain
    surface: "summary"
    kind: frontmatter
    text: "CVE-2026-35616, an exploited API authentication bypass in FortiClient EMS 7.4.5 and 7.4.6 (KEV since 2026-04-06), let attackers edit EMS VPN profiles and policies so that managed endpoints ran a script each time a tunnel came up. Arctic Wolf traced the chain to EKZ Infostealer, a browser credential and cookie stealer disguised as a Fortinet patch."
