    text: "Rapid7 showed the mechanism on the Controller: the `vdaemon` DTLS control-plane service on UDP/12346 accepts a CHALLENGE_ACK claiming device type 2 (vHub) from a self-signed peer without verifying it, after which message type 14 (`MSG_VMANAGE_TO_PEER`) appends an attacker SSH key to `/home/vmanage-admin/.ssh/authorized_keys`, giving NETCONF access on TCP/830 as `vmanage-admin` ("
