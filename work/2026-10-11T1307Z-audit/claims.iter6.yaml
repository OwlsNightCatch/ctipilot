    surface: "summary"
    kind: frontmatter
    text: "CVE-2026-42897, an exploited cross-site scripting flaw in Outlook Web Access on Exchange 2016, 2019 and Subscription Edition, is fixed in the June 2026 Security Update, and Microsoft recommends the July 2026 update. Proofpoint saw TA488 (Void Blizzard, LAUNDRY BEAR) exploit it from 2026-07-22 with OWAReaper, whose Owner grant to the Default alias on every mail folder survives password resets and re-imaging and needs deliberate removal from the server."
