    surface: "body"
    kind: cited
    text: "**Detection:** repeated NGINX worker crashes and automatic restarts, correlated with requests whose URI carries characters that expand when escaped (`+`, `%`, `&`), are the observable effect ("
    urls: ["https://securityaffairs.com/192132/hacking/nginx-rift-an-18-year-old-flaw-in-the-worlds-most-deployed-web-server-just-came-to-light.html"]
