  - claim_id: 63d3594c88
    entry: 2026-06-14/cve-2026-20253-splunk-enterprise-unauthenticated-pre-auth-rc
    surface: "summary"
    kind: frontmatter
    text: "CVE-2026-20253 (CVSS 9.8) lets an unauthenticated user create or truncate files through the PostgreSQL sidecar in Splunk Enterprise 10.0.x and 10.2.x, which watchTowr chained to code execution. Splunk fixed it in 10.0.7, 10.2.4 and 10.4.0 on 2026-06-10 and later confirmed limited exploitation; CISA added it to its KEV catalog on 2026-06-18. The sidecar is enabled by default on AWS deployments."
  - claim_id: dd506e7b29
    entry: 2026-06-14/cve-2026-20253-splunk-enterprise-unauthenticated-pre-auth-rc
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade Splunk Enterprise 10.0.x and 10.2.x to 10.0.7, 10.2.4 or 10.4.0; where an immediate upgrade is impossible and Edge Processor, OpAmp and SPL2 pipelines are unused, set disabled = true under [postgres] in server.conf and restart."
  - claim_id: e9eac15f1f
    entry: 2026-06-14/cve-2026-20253-splunk-enterprise-unauthenticated-pre-auth-rc
    surface: "cves[CVE-2026-20253]"
