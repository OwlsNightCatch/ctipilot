    entry: 2026-09-04/cve-2026-20212-cisco-nexus-9000-s1hal-unauth-root-rce
    surface: "summary"
    kind: frontmatter
    text: "Cisco's cisco-sa-n9k-s1-rce-EH8dEtr (2026-09-02) fixes CVE-2026-20212 (CVSS 9.8), a flaw reachable because TCP ports 43210/43211 used by the Silicon One Hardware Abstraction Layer (S1HAL) process are exposed in the default Layer 3 VRF on ten named Nexus 9000 product IDs. An unauthenticated network attacker who reaches either port can execute code as root or crash a process that can reload the device. Found during a Cisco TAC support case; no known exploitation."
  - claim_id: b91537e5e3
    entry: 2026-09-04/cve-2026-20212-cisco-nexus-9000-s1hal-unauth-root-rce
    surface: "body"
    kind: cited
    text: "TCP ports 43210 and 43211, used by the S1HAL (Silicon One Hardware Abstraction Layer) process, are reachable in the default Layer 3 VRF; an unauthenticated remote attacker who can reach either port sends crafted input that executes as root, or crashes the S1HAL process, which could cause the device to reload ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-n9k-s1-rce-EH8dEtr"]
  - claim_id: 20eaa0f577
