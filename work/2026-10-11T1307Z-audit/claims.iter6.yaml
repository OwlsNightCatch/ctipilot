    entry: 2026-05-09/cve-2026-42208-litellm-proxy-pre-authentication-sql-injectio
    surface: "body"
    kind: cited
    text: "LiteLLM's advisory GHSA-r75f-5x8p-qvmc, published on 2026-04-20, describes a SQL injection in the proxy's API-key verification: the caller-supplied value was not passed to the database as a separate parameter, and the flaw is fixed in 1.83.7 ("
