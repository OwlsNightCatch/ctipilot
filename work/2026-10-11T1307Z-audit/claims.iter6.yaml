    text: "CVE-2026-31431 (Copy Fail, CVSS 7.8) lets an unprivileged local user make a controlled 4-byte write into the page cache through the kernel's AF_ALG crypto socket interface and splice(), corrupting a setuid binary to gain root. Xint published a portable exploit on 2026-04-29 that works unchanged on Ubuntu, Amazon Linux, RHEL and SUSE; CISA added the flaw to its KEV catalog on 2026-05-01. Blacklisting the algif_aead module blocks it until a fixed kernel is installed."
