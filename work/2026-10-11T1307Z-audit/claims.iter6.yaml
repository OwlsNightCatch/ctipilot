    entry: 2026-06-14/cve-2026-20253-splunk-enterprise-unauthenticated-pre-auth-rc
    surface: "body"
    kind: cited
    text: "The sidecar is installed and enabled by default on Splunk Enterprise on AWS, and not by default on manually installed Windows systems ("
    urls: ["https://labs.watchtowr.com/why-use-app-level-auth-when-every-database-has-auth-splunk-enterprise-cve-2026-20253-pre-auth-rce/"]
