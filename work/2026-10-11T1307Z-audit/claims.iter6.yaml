    surface: "cves[CVE-2026-43500]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-43500\", \"cvss\": \"7.8\", \"status\": [\"poc-public\", \"patch-available\"], \"affected\": \"Linux kernels from 2023 (2dc334f1a63a) until the aa54b1d27fe0 fix; not Red Hat products\", \"fixed\": \"mainline aa54b1d27fe0; distribution kernels per vendor\", \"auth\": \"post-auth\", \"vector\": \"local\"}"
  - claim_id: ca7ad0bdbf
    entry: 2026-05-09/cve-2026-43284-cve-2026-43500-linux-dirty-frag-deterministic
    surface: "body"
    kind: cited
    text: "Researcher Hyunwoo Kim (V4bel) published \"Dirty Frag\" on 2026-05-07, after the embargo had been broken by external factors and before patches or CVE ids existed ("
    urls: ["https://github.com/V4bel/dirtyfrag/blob/master/README.md"]
  - claim_id: 0a910ef60f
    entry: 2026-05-09/cve-2026-43284-cve-2026-43500-linux-dirty-frag-deterministic
    surface: "body"
    kind: cited
    text: "It is two page-cache write flaws: **CVE-2026-43284** in the xfrm-ESP (IPsec) receive path, in the kernel since 2017 and fixed in mainline commit f4c50a4034e6, and **CVE-2026-43500** in RxRPC, in the kernel since 2023 and fixed in mainline commit aa54b1d27fe0 ("
    urls: ["https://github.com/V4bel/dirtyfrag/blob/master/README.md"]
  - claim_id: 6c4db34c26
    entry: 2026-05-09/cve-2026-43284-cve-2026-43500-linux-dirty-frag-deterministic
    surface: "body"
    kind: cited
    text: "In both, a page-cache page planted with `splice()` sits in a fragment of a network buffer and the receiving code decrypts it in place, writing into the cached copy of a file: the ESP variant stores 4 attacker-chosen bytes per trigger into a setuid binary such as `su`, and the RxRPC variant stores 8 bytes whose value the attacker brute-forces through the session key, aimed at `/etc/passwd`; the result is deterministic root without a race window ("
    urls: ["https://github.com/V4bel/dirtyfrag/blob/master/assets/write-up.md"]
  - claim_id: 1d13ae9241
    entry: 2026-05-09/cve-2026-43284-cve-2026-43500-linux-dirty-frag-deterministic
    surface: "body"
    kind: cited
    text: "The ESP variant needs the privilege to create a user namespace, which Ubuntu sometimes blocks through AppArmor; the RxRPC variant needs no namespace but depends on the `rxrpc` module, which most distributions do not ship and Ubuntu loads by default ("
    urls: ["https://github.com/V4bel/dirtyfrag/blob/master/README.md"]
  - claim_id: 8f518c1ebc
    entry: 2026-05-09/cve-2026-43284-cve-2026-43500-linux-dirty-frag-deterministic
    surface: "body"
    kind: cited
    text: "The kernel.org CNA scores CVE-2026-43284 CVSS 8.8, and NVD and CISA score CVE-2026-43500 7.8 ("
    urls: ["https://ubuntu.com/blog/dirty-frag-linux-vulnerability-fixes-available"]
  - claim_id: fc8bbbfe35
    entry: 2026-05-09/cve-2026-43284-cve-2026-43500-linux-dirty-frag-deterministic
    surface: "body"
    kind: cited
    text: "Microsoft reports limited in-the-wild privilege escalation involving `su` that \"may be indicative of techniques associated with either\" Dirty Frag or Copy Fail: an SSH session ran an ELF binary that escalated through `su`, then edited a GLPI LDAP authentication file and deleted and read web session files ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/05/08/active-attack-dirty-frag-linux-vulnerability-expands-post-compromise-risk/"]
  - claim_id: 70601193f3
