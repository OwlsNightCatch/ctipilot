    text: "Detection concepts are ordinary but specific: in web and reverse-proxy access logs, surface requests to the Data Hub Adapter endpoint from source addresses outside the integration ranges that legitimately feed it, and treat any such request that precedes an unexplained child process under the Commerce Cloud application account as an incident rather than an anomaly."
