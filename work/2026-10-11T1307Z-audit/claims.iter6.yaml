    text: "CVE-2026-48558 (CVSS 10.0) is an authentication bypass in the OpenID Connect login flow of SimpleHelp 5.5.15 and earlier and the 6.0 prerelease; SimpleHelp fixed it in 5.5.16 and 6.0 RC2 ("
