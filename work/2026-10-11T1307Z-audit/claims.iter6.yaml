  - claim_id: 1104a1510e
    entry: 2026-05-09/cve-2026-42208-litellm-proxy-pre-authentication-sql-injectio
    surface: "summary"
    kind: frontmatter
    text: "CVE-2026-42208 (CVSS 4.0 9.3) is a SQL injection in LiteLLM Proxy's API-key verification, reachable without credentials from any LLM API route in versions 1.81.16 to 1.83.6 and fixed in 1.83.7. Sysdig saw the first exploitation 36 hours after the advisory, with queries against the tables holding virtual keys, stored provider credentials and proxy configuration; CISA added it to its KEV catalog on 2026-05-08."
  - claim_id: 0be8c9eaca
    entry: 2026-05-09/cve-2026-42208-litellm-proxy-pre-authentication-sql-injectio
    surface: "actions[0]"
    kind: frontmatter
    text: "On any LiteLLM Proxy that ran 1.81.16 to 1.83.6 reachable from untrusted networks, upgrade to 1.83.7 or later and rotate the upstream provider keys and virtual keys stored in its database."
  - claim_id: b9acbadb7a
