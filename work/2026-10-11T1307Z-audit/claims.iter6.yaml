    text: "{\"id\": \"CVE-2026-20253\", \"cvss\": \"9.8\", \"status\": [\"exploited\", \"cisa-kev\", \"poc-public\", \"patch-available\"], \"affected\": \"Splunk Enterprise 10.0.0 to 10.0.6, 10.2.0 to 10.2.3\", \"fixed\": \"10.0.7 / 10.2.4 / 10.4.0\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
