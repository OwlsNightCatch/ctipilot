    text: "A PAN-OS Captive Portal overflow gives unauthenticated attackers root on exposed firewalls; Unit 42 saw tunnelling and AD enumeration afterwards"
  - claim_id: 400ef5cbb5
    entry: 2026-05-12/palo-alto-pan-os-cve-2026-0300-first-wave-fixed-builds-now-s
    surface: "summary"
    kind: frontmatter
    text: "CVE-2026-0300 (CVSS 4.0 9.3, 8.7 when the portal is restricted to trusted addresses) is a buffer overflow in the PAN-OS User-ID Authentication Portal that gives unauthenticated attackers root on PA-Series and VM-Series firewalls. Unit 42 ties the limited exploitation since April to one likely state-sponsored cluster, CL-STA-1132; CISA lists it as exploited, and fixed builds now exist for every supported branch."
  - claim_id: 575f8f4f67
    entry: 2026-05-12/palo-alto-pan-os-cve-2026-0300-first-wave-fixed-builds-now-s
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade every PA-Series and VM-Series firewall with the User-ID Authentication Portal enabled to the fixed build for its branch (for example 12.1.4-h5, 11.2.10-h6, 11.1.13-h5 or 10.2.18-h6, per the advisory table); until then restrict the portal to trusted zones and disable Response Pages on untrusted L3 interfaces, and check any device that was exposed before patching for the Unit 42 post-exploitation behaviours."
