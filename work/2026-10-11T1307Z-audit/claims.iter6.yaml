    surface: "record 2026-10-11T14:25:20Z"
    kind: record-summary
    text: "Bishop Fox's analysis is dated 2026-05-06, not 2026-04-30, and the three targeted tables come from Sysdig's exploitation observation, which was uncited. Exploitation began about 36 hours after the advisory, not 26; the flaw is a SQL injection, not an authentication bypass; and the evidence record quoted the entry itself. The entry is rewritten with the LiteLLM advisory as primary source, Sysdig's observation, the affected range and the partial workaround, labelled exposure and detection guidance, a rotation action, a rating and an ATT&CK mapping."
