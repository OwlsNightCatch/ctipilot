    surface: "actions[0]"
    kind: frontmatter
    text: "Rebuild and redeploy the fixed release from SAP Security Note 3771065 on every self-managed SAP Commerce Cloud instance, since an installed patch is not sufficient for this component; restrict the vulnerable Data Hub Adapter endpoint with a Commerce Cloud IP filter set until the redeploy, and give any instance that stayed reachable and unredeployed after 2026-08-14 a compromise assessment."
