    entry: 2026-05-08/muddywater-iran-mois-deploys-chaos-ransomware-as-false-flag
    surface: "section 2026-10-11T14:21:21Z"
    kind: cited
    text: "Rapid7, not Deep Instinct, reported this intrusion, and it links it to MuddyWater only \"with moderate confidence\" ("
    urls: ["https://www.rapid7.com/blog/post/tr-muddying-tracks-state-sponsored-shadow-behind-chaos-ransomware/"]
  - claim_id: b63060cc7b
    entry: 2026-05-08/muddywater-iran-mois-deploys-chaos-ransomware-as-false-flag
    surface: "section 2026-10-11T14:21:21Z"
    kind: uncited
    text: "The actor encrypted nothing: it used the Chaos brand to demand ransom by email after stealing data."
  - claim_id: 46a9991959
    entry: 2026-05-08/muddywater-iran-mois-deploys-chaos-ransomware-as-false-flag
    surface: "section 2026-10-11T14:21:21Z"
    kind: uncited
    text: "Rapid7 describes no government or defence victim in this intrusion and describes the prepositioning as \"particularly in the US\"."
  - claim_id: 223443b5b2
    entry: 2026-05-08/muddywater-iran-mois-deploys-chaos-ransomware-as-false-flag
    surface: "section 2026-10-11T14:21:21Z"
    kind: uncited
    text: "The Teams chats with screen sharing were the main intrusion path, not a parallel vector, and Rapid7 describes no certificate theft or forging; the code-signing certificate is attribution evidence."
  - claim_id: e90d79a649
    entry: 2026-05-08/muddywater-iran-mois-deploys-chaos-ransomware-as-false-flag
    surface: "record 2026-10-11T14:21:21Z"
    kind: record-summary
    text: "The cited Deep Instinct source does not exist; the research is Rapid7's report of 2026-05-06. The actor did not deploy encrypting Chaos payloads but used the Chaos brand for extortion without encrypting files, Rapid7 links it to MuddyWater only with moderate confidence, and Rapid7 describes no government or defence victim in this intrusion. The prose ATT&CK ids were wrong (Spearphishing Voice, certificate theft, encryption); the entry is rewritten from Rapid7 with the Teams screen-sharing, MFA and remote-tool chain, a corrected mapping (adding the curl payload downloads as ingress tool transfer), labelled guidance, a rating and medium confidence."
  - claim_id: ccde5e04d9
    entry: 2026-05-08/cert-fr-certfr-2026-act-016-agentic-ai-tools-introduce-promp
    surface: "headline"
    kind: frontmatter
    text: "CERT-FR: keep autonomous desktop AI assistants off production workstations and confine them to isolated sandboxes without sensitive data"
  - claim_id: 373d61a074
    entry: 2026-05-08/cert-fr-certfr-2026-act-016-agentic-ai-tools-introduce-promp
    surface: "summary"
    kind: frontmatter
    text: "CERT-FR's advisory of 2026-04-13 on autonomous personal assistants such as OpenClaw and Claude Cowork, which run commands, drive the browser, handle files and send mail on chat-message triggers, says they must not be deployed on workstations or in production until stabilised and proven, and limits their use to isolated test sandboxes without sensitive data. It names plugins that run as trusted code and prompt injection as the core risks."
  - claim_id: b788d6f8f8
    entry: 2026-05-08/cert-fr-certfr-2026-act-016-agentic-ai-tools-introduce-promp
    surface: "body"
    kind: cited
    text: "Unlike chat assistants, they execute commands, control the browser, read and write files, manage calendars and send mail, triggered by a text message through applications such as Slack, WhatsApp or Discord ("
    urls: ["https://www.cert.ssi.gouv.fr/actualite/CERTFR-2026-ACT-016/"]
  - claim_id: fd4a512de8
    entry: 2026-05-08/cert-fr-certfr-2026-act-016-agentic-ai-tools-introduce-promp
    surface: "body"
    kind: cited
    text: "Plugins can be loaded dynamically and, depending on the integration model, run as trusted code with the application's privileges, which widens the software supply chain; prompt injection is an intrinsic weakness of the underlying language models, and an agent that orchestrates operating-system-level tools raises the risk of unauthorized command execution and data exfiltration through prompt injection or hijacked messages ("
    urls: ["https://www.cert.ssi.gouv.fr/actualite/CERTFR-2026-ACT-016/"]
  - claim_id: 2cab16e9e8
    entry: 2026-05-08/cert-fr-certfr-2026-act-016-agentic-ai-tools-introduce-promp
    surface: "body"
    kind: cited
    text: "CERT-FR's position is that such assistants must not be deployed on workstations and their use should be prohibited until the product is stabilised and proven from a security standpoint; they must in no case be deployed in production, only in isolated test sandboxes holding no sensitive data, and the same applies to mobile deployments ("
    urls: ["https://www.cert.ssi.gouv.fr/actualite/CERTFR-2026-ACT-016/"]
  - claim_id: 245d29e5bd
    entry: 2026-05-08/cert-fr-certfr-2026-act-016-agentic-ai-tools-introduce-promp
    surface: "body"
    kind: cited
    text: "Where they are used, the main lever is configuration hardening: limit the tools and actions available to the strict minimum, require human validation for any system command or action with side effects, run the agent in a sandbox, and allowlist the channels and interlocutors that may trigger it, for example only on an explicit mention of the agent ("
    urls: ["https://www.cert.ssi.gouv.fr/actualite/CERTFR-2026-ACT-016/"]
  - claim_id: 42cbd88d70
    entry: 2026-05-08/cert-fr-certfr-2026-act-016-agentic-ai-tools-introduce-promp
    surface: "body"
    kind: cited
    text: "**Exposure:** any workstation or phone where users have installed an autonomous assistant with access to mail, calendar, files or business applications, typically as unvalidated Shadow IT ("
    urls: ["https://www.cert.ssi.gouv.fr/actualite/CERTFR-2026-ACT-016/"]
  - claim_id: 2fdf6bf690
    entry: 2026-05-08/cert-fr-certfr-2026-act-016-agentic-ai-tools-introduce-promp
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** treat autonomous desktop AI assistants as unapproved software on production workstations: block installations not validated by IT and security, and allow them only in isolated sandboxes without production data, secrets or personal data ("
    urls: ["https://www.cert.ssi.gouv.fr/actualite/CERTFR-2026-ACT-016/"]
  - claim_id: b5826be378
    entry: 2026-05-08/cert-fr-certfr-2026-act-016-agentic-ai-tools-introduce-promp
    surface: "body"
    kind: uncited
    text: "CERT-FR's advisory CERTFR-2026-ACT-016, published on 2026-04-13, addresses autonomous personal assistants such as OpenClaw, Claude Cowork and open-source equivalents, whose adoption has grown strongly since early 2026."
  - claim_id: 489fcfc880
    entry: 2026-05-08/cert-fr-certfr-2026-act-016-agentic-ai-tools-introduce-promp
    surface: "section 2026-10-11T14:16:35Z"
    kind: cited
    text: "CERT-FR's advisory concerns autonomous personal assistants on workstations, not agentic orchestration platforms, and does not mention the Model Context Protocol; its supply-chain concern is plugins that load dynamically and run as trusted code ("
    urls: ["https://www.cert.ssi.gouv.fr/actualite/CERTFR-2026-ACT-016/"]
  - claim_id: 6751c9c605
    entry: 2026-05-08/cert-fr-certfr-2026-act-016-agentic-ai-tools-introduce-promp
    surface: "section 2026-10-11T14:16:35Z"
    kind: uncited
    text: "Its recommendations are to keep these assistants off workstations and out of production, confine them to isolated sandboxes, restrict their tools, require human validation for system commands and allowlist the channels that may trigger them."
  - claim_id: 77ce2af998
    entry: 2026-05-08/cert-fr-certfr-2026-act-016-agentic-ai-tools-introduce-promp
    surface: "section 2026-10-11T14:16:35Z"
    kind: uncited
    text: "The earlier text attributed guardrails, tool-call allowlisting and a rule to treat all agent output as untrusted to CERT-FR, and named products the advisory does not mention."
  - claim_id: dd7f65d2b7
    entry: 2026-05-08/cert-fr-certfr-2026-act-016-agentic-ai-tools-introduce-promp
    surface: "record 2026-10-11T14:16:35Z"
    kind: record-summary
    text: "The earlier text described a different document: CERT-FR's advisory does not mention MCP servers, guardrails or tool-call allowlisting, and names OpenClaw and Claude Cowork rather than Copilot Studio or AutoGen. The entry is rewritten from the advisory around its actual position, no deployment on workstations or in production and sandbox-only use, with its hardening levers, the advisory date, the canonical report entity, a rating and an ATT&CK mapping."
