    surface: "body"
    kind: cited
    text: "The escalated token still shows `token:anonymous` as its actor in logs, and Wiz treats the internal anonymous identity, or any low-privilege identity, minting tokens, enumerating users or touching plugins as the anomaly to hunt ("
    urls: ["https://www.wiz.io/blog/artifactory-under-attack-in-the-wild-exploitation-of-cve-2026-42016-cve-2026-4201"]
  - claim_id: 99b4b7726b
    entry: 2026-09-12/jfrog-artifactory-cve-2026-42016-42018-token-chain-takeover
    surface: "body"
    kind: cited
    text: "Wiz observed actors reach a created administrator account in under five minutes from the first request in some cases ("
    urls: ["https://www.wiz.io/blog/artifactory-under-attack-in-the-wild-exploitation-of-cve-2026-42016-cve-2026-4201"]
  - claim_id: 346bd462ea
