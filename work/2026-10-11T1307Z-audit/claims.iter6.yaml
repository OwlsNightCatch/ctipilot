    entry: 2026-05-09/cve-2026-43284-cve-2026-43500-linux-dirty-frag-deterministic
    surface: "body"
    kind: cited
    text: "), and Red Hat states that fixes are released for all affected products and that CVE-2026-43500 does not affect Red Hat products ("
    urls: ["https://access.redhat.com/security/vulnerabilities/RHSB-2026-003"]
  - claim_id: 8a439ecda8
