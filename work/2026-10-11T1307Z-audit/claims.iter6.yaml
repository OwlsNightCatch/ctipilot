claims:
  - claim_id: 9f0098a4de
    entry: 2026-05-08/muddywater-iran-mois-deploys-chaos-ransomware-as-false-flag
    surface: "headline"
    kind: frontmatter
    text: "An intrusion posing as Chaos ransomware stole data without encrypting it, and Rapid7 ties it to Iran's MuddyWater through a code-signing certificate and C2"
  - claim_id: cb37105e50
    entry: 2026-05-08/muddywater-iran-mois-deploys-chaos-ransomware-as-false-flag
    surface: "summary"
    kind: frontmatter
    text: "Rapid7 assesses with moderate confidence that an early-2026 intrusion presented as a Chaos ransomware attack was MuddyWater activity, based on a code-signing certificate and C2 infrastructure. The actor used external Microsoft Teams chats and screen sharing to have victims type credentials into local text files and add attacker-controlled MFA devices, persisted with DWAgent and AnyDesk, moved over RDP to a domain controller, exfiltrated data and demanded ransom by email without encrypting any files."
  - claim_id: 5f83028f25
    entry: 2026-05-08/muddywater-iran-mois-deploys-chaos-ransomware-as-false-flag
    surface: "body"
    kind: cited
    text: "Rapid7 investigated an early-2026 intrusion that presented as an attack by the Chaos ransomware-as-a-service operation and assesses, \"with moderate confidence\", that it is linked to MuddyWater (Seedworm), the Iranian state-sponsored group, on the strength of a code-signing certificate and command-and-control infrastructure ("
    urls: ["https://www.rapid7.com/blog/post/tr-muddying-tracks-state-sponsored-shadow-behind-chaos-ransomware/"]
  - claim_id: 5f0c8fb19c
    entry: 2026-05-08/muddywater-iran-mois-deploys-chaos-ransomware-as-false-flag
    surface: "body"
    kind: cited
    text: "The actor opened external one-on-one Microsoft Teams chats, moved victims into screen-sharing sessions, had them type credentials into locally created text files and change their MFA configuration to include attacker-controlled devices, then established persistence with the remote management tools DWAgent and AnyDesk ("
    urls: ["https://www.rapid7.com/blog/post/tr-muddying-tracks-state-sponsored-shadow-behind-chaos-ransomware/"]
  - claim_id: ee98a71aa3
    entry: 2026-05-08/muddywater-iran-mois-deploys-chaos-ransomware-as-false-flag
    surface: "body"
    kind: cited
    text: "It authenticated to internal systems, including a domain controller, with several compromised accounts and deployed a downloader for the Darkcomp backdoor that Rapid7 says is firmly attributed to MuddyWater ("
    urls: ["https://www.rapid7.com/blog/post/tr-muddying-tracks-state-sponsored-shadow-behind-chaos-ransomware/"]
  - claim_id: f8683bfb56
    entry: 2026-05-08/muddywater-iran-mois-deploys-chaos-ransomware-as-false-flag
    surface: "body"
    kind: cited
    text: "The actor exfiltrated data and demanded ransom under the Chaos brand by email, but forwent file encryption in favour of data theft and long-term persistence ("
    urls: ["https://www.rapid7.com/blog/post/tr-muddying-tracks-state-sponsored-shadow-behind-chaos-ransomware/"]
  - claim_id: e4f945cb6d
    entry: 2026-05-08/muddywater-iran-mois-deploys-chaos-ransomware-as-false-flag
    surface: "body"
    kind: cited
    text: "Rapid7 reads the false flag as deniability for espionage and prepositioning, particularly in the US; Chaos itself had claimed 36 victims by late March 2026 ("
    urls: ["https://www.rapid7.com/blog/post/tr-muddying-tracks-state-sponsored-shadow-behind-chaos-ransomware/"]
  - claim_id: 26014c9581
    entry: 2026-05-08/muddywater-iran-mois-deploys-chaos-ransomware-as-false-flag
    surface: "body"
    kind: cited
    text: "The Hacker News reported the research the same day ("
    urls: ["https://thehackernews.com/2026/05/muddywater-uses-microsoft-teams-to.html"]
  - claim_id: 925d24b2a4
    entry: 2026-05-08/muddywater-iran-mois-deploys-chaos-ransomware-as-false-flag
    surface: "body"
    kind: cited
    text: "**Detection:** in collaboration-platform audit telemetry, an external-tenant Teams one-on-one chat that moves to screen sharing, followed by a new MFA device registration for the same user, is the chain Rapid7 describes ("
    urls: ["https://www.rapid7.com/blog/post/tr-muddying-tracks-state-sponsored-shadow-behind-chaos-ransomware/"]
  - claim_id: f5e01d68a3
    entry: 2026-05-08/muddywater-iran-mois-deploys-chaos-ransomware-as-false-flag
    surface: "body"
    kind: cited
    text: "On endpoints, DWAgent or AnyDesk installed outside change control and credential text files created during a support session are the follow-on signals ("
    urls: ["https://www.rapid7.com/blog/post/tr-muddying-tracks-state-sponsored-shadow-behind-chaos-ransomware/"]
  - claim_id: 2d6ce98776
    entry: 2026-05-08/muddywater-iran-mois-deploys-chaos-ransomware-as-false-flag
    surface: "body"
    kind: derived
    text: "**Triage:** legitimate external Teams support sessions exist; the discriminator is an MFA method added during or right after a chat with an external tenant, a step a genuine support session has no reason to include."
  - claim_id: 4c9924b5da
    entry: 2026-05-08/muddywater-iran-mois-deploys-chaos-ransomware-as-false-flag
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** an extortion demand with no encryption is not proof of a criminal actor."
  - claim_id: d12c5861b7
    entry: 2026-05-08/muddywater-iran-mois-deploys-chaos-ransomware-as-false-flag
    surface: "body"
    kind: derived
    text: "Restrict external Teams chat and screen sharing to approved tenants, and require out-of-band verification before any MFA change requested in a chat."
