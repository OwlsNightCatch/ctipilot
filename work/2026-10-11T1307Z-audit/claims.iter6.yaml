  - claim_id: d24c0e6641
    entry: 2026-09-10/sap-september-2026-overpass-s4get-preauth-rce
    surface: "headline"
    kind: frontmatter
    text: "Two critical pre-auth SAP kernel flaws (CVSS 10.0 and 9.8) reach through the ports SAP GUI and RFC need; segmentation will not close them"
  - claim_id: 212afad0e3
    entry: 2026-09-10/sap-september-2026-overpass-s4get-preauth-rce
    surface: "body"
    kind: cited
    text: "SAP's 8 September 2026 Security Patch Day fixed CVE-2026-44756 (\"OVERPASS\", CVSS 10.0) and CVE-2026-58240 (\"S4GET\", CVSS 9.8), both discovered and responsibly disclosed by Onapsis Research Labs, both remotely exploitable pre-authentication ("
    urls: ["https://cert.europa.eu/publications/security-advisories/2026-011/"]
  - claim_id: c579f5f4cc
    entry: 2026-09-10/sap-september-2026-overpass-s4get-preauth-rce
    surface: "body"
    kind: cited
    text: "OVERPASS is a memory-corruption flaw in the SAP kernel's processing of the Extended Passport, a tracing structure attached to requests and parsed before session authentication; because the handling code is shared, the flaw is reachable via three independent unauthenticated routes: the Internet Communication Manager/Web Dispatcher (HTTP/HTTPS, Fiori/WebGUI/APIs), the SAP Dispatcher (the SAP GUI logon protocol), and RFC connections between systems, each with a single crafted request corrupting memory to reach arbitrary OS command execution as the account that owns the SAP installation ("
    urls: ["https://onapsis.com/blog/sap-overpass-remediation/", "https://cert.europa.eu/publications/security-advisories/2026-011/"]
  - claim_id: ec8bd5835e
    entry: 2026-09-10/sap-september-2026-overpass-s4get-preauth-rce
    surface: "body"
    kind: cited
    text: "Onapsis's own internet-wide fingerprinting found more than 10,000 unique internet-facing IPs presenting an SAP web interface, a figure it calls conservative since it structurally undercounts the SAP Web Dispatcher, which returns no distinguishing banner ("
    urls: ["https://onapsis.com/blog/sap-overpass-remediation/"]
  - claim_id: 62d75f934a
    entry: 2026-09-10/sap-september-2026-overpass-s4get-preauth-rce
    surface: "body"
    kind: cited
    text: "S4GET is a distinct logic flaw in the SAP NetWeaver Message Server (kernel lines 9.16-9.20, native to S/4HANA and S/4HANA Cloud Private Edition) reachable through the same public port every SAP GUI client connects to: a crafted packet gets an arbitrary IP address accepted as a trusted internal node, and the Message Server propagates that false trust across the cluster so the Gateway admits the attacker as internal and the attacker can invoke RFC-callable programs to reach code execution as `<sid>adm` on every application server: \"exploitation requires no credentials, no certificate, and no pre-existing misconfiguration\" ("
    urls: ["https://onapsis.com/blog/s4get-cve-2026-58240-sap-message-server-threat-advisory/"]
  - claim_id: ec53e3152c
    entry: 2026-09-10/sap-september-2026-overpass-s4get-preauth-rce
    surface: "body"
    kind: cited
    text: "Because the flaw abuses the Gateway's trust-membership decision rather than its ACLs, the standard `secinfo`/`reginfo`/`ms/acl_info` hardening does not intercept it ("
    urls: ["https://onapsis.com/blog/s4get-cve-2026-58240-sap-message-server-threat-advisory/"]
  - claim_id: 35f0b88936
    entry: 2026-09-10/sap-september-2026-overpass-s4get-preauth-rce
    surface: "body"
    kind: cited
    text: "Neither flaw is confirmed exploited as of publication, but Onapsis notes SAP patches have historically been reverse-engineered into working exploits within 72 hours, as happened with the RECON vulnerability (CVE-2020-6287), and that window keeps shrinking with AI-assisted tooling, while a comparable pre-auth SAP disclosure (CVE-2025-31324) became 2025's most-exploited CVE by Mandiant's count ("
    urls: ["https://onapsis.com/blog/sap-overpass-remediation/"]
  - claim_id: 7a4ef66c66
    entry: 2026-09-10/sap-september-2026-overpass-s4get-preauth-rce
    surface: "body"
    kind: cited
    text: "**Exposure:** OVERPASS (CVE-2026-44756) affects a wide set of kernel lines, KERNEL 7.22 through 9.20 including 7.53 and 8.04, plus Web Dispatcher 9.16 to 9.20 ("
    urls: ["https://cert.europa.eu/publications/security-advisories/2026-011/"]
  - claim_id: 43e0100f96
    entry: 2026-09-10/sap-september-2026-overpass-s4get-preauth-rce
    surface: "body"
    kind: cited
    text: "Direct internet exposure of the Message Server is rare, but its public port is reachable by every SAP GUI user by design, so most exposure is on the internal network ("
    urls: ["https://onapsis.com/blog/s4get-cve-2026-58240-sap-message-server-threat-advisory/"]
  - claim_id: cc4fb3bda6
    entry: 2026-09-10/sap-september-2026-overpass-s4get-preauth-rce
    surface: "body"
    kind: cited
    text: "**Triage:** an SAP Gateway admitting a connection as internal from an IP address that is not a known application server, followed by invocations of RFC-callable programs from it, is the S4GET trust-abuse pattern Onapsis describes ("
    urls: ["https://onapsis.com/blog/s4get-cve-2026-58240-sap-message-server-threat-advisory/"]
  - claim_id: d8328722fb
    entry: 2026-09-10/sap-september-2026-overpass-s4get-preauth-rce
    surface: "body"
    kind: uncited
    text: "Fixed via SAP Security Note 3747649 (OVERPASS, a single kernel patch closing all three routes, with an HTTP-only interim workaround in Note 3756304) and Note 3759472 (S4GET, kernel patch levels 9.16 PL100/9.18 PL32/9.19 PL17/9.20 PL7)."
  - claim_id: c6b4041bae
    entry: 2026-09-10/sap-september-2026-overpass-s4get-preauth-rce
    surface: "body"
    kind: derived
    text: "S4GET (CVE-2026-58240) affects kernel 9.16, 9.18, 9.19 or 9.20 below the fixed patch levels (PL 100, 32, 17 and 7 respectively); the kernel decides, not the application on top of it, so ABAP systems other than S/4HANA count, and the release and patch level show in SAP GUI under System, Status, Kernel information or as `<sid>adm` with `disp+work -version`."
  - claim_id: e4ac5bcf6a
    entry: 2026-09-10/sap-september-2026-overpass-s4get-preauth-rce
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** patch now rather than relying on network segmentation — both flaws are reachable through ports every normal SAP GUI/RFC deployment already exposes internally, so a \"not internet-facing\" argument does not close OVERPASS's Dispatcher/RFC routes or S4GET's Message Server port."
  - claim_id: de192b614d
    entry: 2026-09-10/sap-september-2026-overpass-s4get-preauth-rce
    surface: "section 2026-10-11T13:56:20Z"
    kind: cited
    text: "OVERPASS (CVE-2026-44756) is not limited to the 9.16 to 9.20 kernel lines: CERT-EU lists KERNEL 7.22, 7.53, 7.54, 7.77, 7.89, 7.93, 8.04 and 9.16 to 9.20, the 7.22 kernels (unicode and non-unicode), the 7.53 and 8.04 unicode kernels, and Web Dispatcher 9.16 to 9.20 as affected ("
    urls: ["https://cert.europa.eu/publications/security-advisories/2026-011/"]
  - claim_id: d117f174e3
    entry: 2026-09-10/sap-september-2026-overpass-s4get-preauth-rce
    surface: "section 2026-10-11T13:56:20Z"
    kind: uncited
    text: "The earlier Exposure line described only S4GET's scope, so systems on older kernels, classic ABAP and ECC included, need the OVERPASS kernel patch as well."
  - claim_id: 6730f1542a
    entry: 2026-09-10/sap-september-2026-overpass-s4get-preauth-rce
    surface: "record 2026-10-11T13:56:20Z"
    kind: record-summary
    text: "The Exposure line gave only S4GET's kernel scope, so a reader on an older kernel line would have concluded neither flaw applied; OVERPASS, the CVSS 10.0 flaw, affects kernel lines from 7.22 to 9.20. The headline no longer calls both flaws maximum severity (S4GET is 9.8), and the ACL sentence gains its citation."
