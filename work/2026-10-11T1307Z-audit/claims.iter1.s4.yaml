- claim_id: 95cc8d1cdc
  entry: 2026-09-19/cve-2026-81642-cve-2026-82717-unbound-dnssec-rce
  surface: body
  kind: cited
  text: '); found by Yuqi Qiu and Xiang Li of Nankai University''s AOSP Lab) sits in the DNSSEC validator: a DNSKEY record whose owner name carries a compression pointer that references back into its own
    RDATA can overflow the digest buffer during DNSKEY digesting, and NLnet Labs states "remote code execution is possible through attacker controlled data", triggered simply by having a vulnerable Unbound
    query a zone the attacker controls ('
  urls:
  - https://nlnetlabs.nl/downloads/unbound/CVE-2026-81642.txt
- claim_id: 556e032650
  entry: 2026-09-19/cve-2026-81642-cve-2026-82717-unbound-dnssec-rce
  surface: body
  kind: cited
  text: 'CVE-2026-82717 (found by Ben Morris of Anthropic) is a companion bug in CNAME synthesis: when Unbound rewrites a maximum-TTL value into the packet buffer during upstream-response processing, a
    compression pointer that now references the overwritten, invalidated domain name sends the code down an error path that fails to advance the buffer position correctly, producing a heap overflow NLnet
    Labs describes as "heavily reliant on heap memory layout" and capable of remote code execution "under specific systems and compilation options" ('
  urls:
  - https://nlnetlabs.nl/downloads/unbound/CVE-2026-82717.txt
- claim_id: 906696b4bb
  entry: 2026-09-19/cve-2026-81642-cve-2026-82717-unbound-dnssec-rce
  surface: body
  kind: cited
  text: 'NCSC Switzerland''s advisory on CVE-2026-81642 records the exploitation status as unknown and notes the operative precondition plainly: "resolver must have DNSSEC validation active, and query routing
    must allow the attacker''s malicious DNS zone to be parsed" ('
  urls:
  - https://security-hub.ncsc.admin.ch/#/posts/12957
- claim_id: 40f873185e
  entry: 2026-09-19/cve-2026-81642-cve-2026-82717-unbound-dnssec-rce
  surface: body
  kind: uncited
  text: NLnet Labs released Unbound 1.26.1 as a security release on 2026-09-16, fixing nine vulnerabilities in the widely deployed open-source validating and recursive DNS resolver.
- claim_id: 09cc8e5cfc
  entry: 2026-09-19/cve-2026-81642-cve-2026-82717-unbound-dnssec-rce
  surface: body
  kind: derived
  text: '**Defender takeaway:** the prerequisite for CVE-2026-81642 is not exposure to attacker-initiated connections but DNSSEC validation plus the ability to recurse into an attacker-registered domain,
    a condition most validating recursive resolvers meet by design, since resolving arbitrary domains on request is their job.'
- claim_id: 5fdee69372
  entry: 2026-09-19/cve-2026-81642-cve-2026-82717-unbound-dnssec-rce
  surface: body
  kind: derived
  text: CVE-2026-82717 has no DNSSEC precondition and reaches non-validating resolvers too, so patch every Unbound at 1.26.0 or older to 1.26.1 now rather than waiting for confirmed exploitation; CVE-2026-82717's
    outcome is more heap-layout- and build-dependent, so a crash/DoS is the more likely near-term observable even without full RCE, but it shares the same fix and the same urgency.
- claim_id: 008a71b4ca
  entry: 2026-09-19/cve-2026-81642-cve-2026-82717-unbound-dnssec-rce
  surface: body
  kind: derived
  text: 'Detection concept: `unbound`/`named`-style crash-loops or repeated resolver-process restarts that correlate with resolution of an unusual or newly registered authoritative zone are the closest
    available behavioral signal in the absence of a public proof-of-concept; no PoC was found at time of writing.'
- claim_id: 520ccf2a78
  entry: 2026-09-19/cve-2026-81642-cve-2026-82717-unbound-dnssec-rce
  surface: body
  kind: derived
  text: '**Triage:** ordinary DNSSEC validation failures (a misconfigured zone, an expired signature) produce a `SERVFAIL` response and a logged validation error, not a resolver crash; a `named`/`unbound`
    worker process terminating or restarting during or immediately after resolving a specific external zone is the discriminator that separates this from routine DNSSEC validation noise.'
