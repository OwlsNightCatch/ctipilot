  entry: 2026-05-15/cve-2026-20182-cisco-catalyst-sd-wan-controller-manager-pre
  surface: body
  kind: cited
  text: CVE-2026-20182 (CVSS 10.0, CWE-287) is an authentication bypass in the peering authentication of Cisco Catalyst SD-WAN Controller, Manager and, since Cisco's advisory revision of 2026-06-16, Validator,
    affecting all deployment types regardless of configuration (
  urls:
