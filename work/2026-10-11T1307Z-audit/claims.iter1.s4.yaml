  entry: 2026-09-29/kaspersky-payload-gpo-encryptionless-ransomware
  surface: body
  kind: cited
  text: '**Defender takeaway:** review GPO-write/modify permissions at the domain root and any OU covering a meaningful share of the estate, since the Windows-side technique requires only that access, not
    code execution rights on any endpoint; make the directory-service and SYSVOL telemetry in the Detection line a primary detection surface, because on Windows this attack leaves no malicious binary or
    process for endpoint detection to find ('
  urls:
