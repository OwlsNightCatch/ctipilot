  entry: 2026-05-15/cve-2026-20182-cisco-catalyst-sd-wan-controller-manager-pre
  surface: headline
  kind: frontmatter
  text: A forged vHub peer can plant an SSH key on Cisco SD-WAN controllers without credentials; Talos ties exploitation to UAT-8616
- claim_id: 6f49e15f86
  entry: 2026-05-15/cve-2026-20182-cisco-catalyst-sd-wan-controller-manager-pre
  surface: summary
  kind: frontmatter
  text: CVE-2026-20182 (CVSS 10.0) lets an unauthenticated attacker bypass peering authentication on Cisco Catalyst SD-WAN Controller, Manager and Validator and plant an SSH key for NETCONF access. Cisco
    saw limited exploitation in May 2026, which Talos attributes to UAT-8616; CISA added it to its KEV catalog on 2026-05-14 under Emergency Directive 26-03. There is no workaround, and a compromised system
    needs TAC remediation beyond the upgrade.
- claim_id: c843f4b1eb
  entry: 2026-05-15/cve-2026-20182-cisco-catalyst-sd-wan-controller-manager-pre
  surface: immediate_action
  kind: frontmatter
  text: 'Patch Cisco Catalyst SD-WAN Controller, Manager and Validator now (CVE-2026-20182, CVSS 10.0): Run request admin-tech on every control component, then upgrade to a fixed release (for example 20.9.9.1,
    20.12.7.1, 20.15.5.2, 20.18.2.2 or 26.1.1.1); check auth.log and control-connection history for the documented indicators, because on a compromised system the upgrade alone does not remediate.'
