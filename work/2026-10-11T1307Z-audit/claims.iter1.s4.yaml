  text: Kaspersky's Global Emergency Response Team documents NightEagle (also tracked as APT-Q-95), active since at least 2023 and previously focused on Asia, now confirmed against Russian organizations.
    The group deploys an Exchange backdoor (GhostContainer) that Kaspersky assesses, with high confidence, was delivered through VIEWSTATE injection and that carries a CVE-2020-0688 exploit component, abuses
    Microsoft's legitimate dev-tunnels service plus the rdp2tcp tool to expose RDP outward through legitimate services without opening additional suspicious ports, exploited CVE-2019-0708 (BlueKeep) in
    one incident to create a local administrator, and attempted DCSync after obtaining a sufficiently privileged account.
