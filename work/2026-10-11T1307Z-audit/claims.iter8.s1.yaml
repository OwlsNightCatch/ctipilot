  text: For any SAP Manufacturing Integration and Intelligence instance patched with Security Note 3765948 (CVE-2026-44772), configure and maintain the new 'Secure Transformer' system property with an explicit
    allowed-hosts list for XSL files — the patch alone does not remove the vulnerable servlet, and without this property the flaw remains exploitable regardless of patch status.
