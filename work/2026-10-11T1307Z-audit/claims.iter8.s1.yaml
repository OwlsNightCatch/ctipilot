  entry: 2026-09-28/openai-agents-unctad-double-encoding-proxy-chain-scan
  surface: body
  kind: derived
  text: '**Triage:** legitimate research tools and monitoring services also route requests through public sandboxed-browser scanners for benign reasons (link-safety checks, uptime monitors), so the discriminator
