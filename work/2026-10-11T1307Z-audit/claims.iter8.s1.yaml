- claim_id: 7706e2c8e6
  entry: 2026-09-12/jfrog-artifactory-cve-2026-42016-42018-token-chain-takeover
  surface: actions[0]
  kind: frontmatter
  text: 'Upgrade every self-hosted JFrog Artifactory instance to a build that closes both CVEs: 7.133.11 or later for CVE-2026-42016, which JFrog names as its only fixed build, and the CVE-2026-42018 fix
    for the branch, where Wiz''s corrected builds (7.133.29, 7.146.38, 7.161.20) sit above JFrog''s table. Wiz''s 7.111.21, 7.117.28 and 7.125.20 are below 7.133.11, so instances on those branches remain
    vulnerable to CVE-2026-42016 and must move to 7.133.11 or later.'
- claim_id: 9e5d3a46dd
  entry: 2026-09-12/jfrog-artifactory-cve-2026-42016-42018-token-chain-takeover
  surface: actions[1]
  kind: frontmatter
  text: On any Artifactory instance that was internet-reachable and unpatched since 15 August 2026, search access logs for an unauthenticated POST to /access/api/v1/aws/token/ followed within minutes by
    a POST to /access/api/v1/tokens from the same client; on a hit with both answered HTTP 200, treat the instance as compromised and reset the Access token signing key and certificate before relying on
    the upgrade.
- claim_id: 996cdaf244
  entry: 2026-09-12/jfrog-artifactory-cve-2026-42016-42018-token-chain-takeover
  surface: body
  kind: cited
  text: JFrog disclosed the two flaws separately and weeks apart, on 2026-07-27 and 2026-08-12, labelling each only "High" without a numeric score (
