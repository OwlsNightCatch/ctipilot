- claim_id: 09b88d6cc1
  entry: 2026-05-08/instructure-canvas-extortion-330-institutions-across-six-cou
  surface: record 2026-10-11T14:19:55Z
  kind: record-summary
  text: 'Most of the headline figures had no source: 330 was the number of defaced login portals, not institutions; six countries, 16 million records, 44 confirmed Dutch institutions and German or Dutch
    regulator inquiries appear nowhere; the actor is ShinyHunters, not WorldLeaks, and no EUR 3.2 million demand, 3 GB sample or LTI service-account vector was reported. The entry is rewritten from its
    sources, the earlier sections are corrected in place (dates of the second notice and the agreement, Instructure''s statement that the agreement covers all customers, unsupported UK university statements
    and speculation removed), the dead SURF source is dropped, and the entry gains its rating and ATT&CK mapping. Priority moves from high to notable. NL Times is added as the source for the seven Dutch
    universities that disconnected Canvas. The agreement sentence is cited to Inside Higher Ed alone, the Dutch disconnections to NL Times, and the Free-for-Teacher attribution in the 2026-05-09 section
    is marked as a later statement.'
- claim_id: 98c64ac077
  entry: 2026-05-09/daemon-tools-lite-supply-chain-quic-rat-deployed-via-signed
  surface: headline
  kind: frontmatter
  text: Trojanised, validly signed DAEMON Tools installers ran a profiler on thousands of machines and a backdoor on about a dozen machines
- claim_id: 29bc21d8a8
  entry: 2026-05-09/daemon-tools-lite-supply-chain-quic-rat-deployed-via-signed
  surface: summary
  kind: frontmatter
  text: DAEMON Tools Lite versions 12.5.0.2421 to 12.5.0.2434, distributed from the vendor's site from 2026-04-08 and signed with the developer's certificates, carried trojanised helper binaries. Kaspersky
    saw several thousand infection attempts in more than 100 countries, mostly delivering an information collector; a backdoor reached about a dozen machines at government, scientific, manufacturing and
    retail organizations in Russia, Belarus and Thailand, and QUIC RAT one Russian educational institution. Version 12.6.0.2445 is clean.
- claim_id: 9ac1b01c59
  entry: 2026-05-09/daemon-tools-lite-supply-chain-quic-rat-deployed-via-signed
  surface: body
  kind: cited
  text: 'Kaspersky found that DAEMON Tools installers distributed from the product''s legitimate website and signed with the developer''s certificates had been trojanised from 2026-04-08: in versions 12.5.0.2421
    to 12.5.0.2434 the helper binaries `DTHelper.exe`, `DiscSoftBusServiceLite.exe` and `DTShellHlp.exe`, signed by AVB Disc Soft, were compromised, and version 12.6.0.2445 no longer contains the malicious
    behaviour ('
  urls:
  - https://securelist.com/tr/daemon-tools-backdoor/119654/
- claim_id: 23d8f1f7d5
  entry: 2026-05-09/daemon-tools-lite-supply-chain-quic-rat-deployed-via-signed
  surface: body
  kind: cited
  text: At startup the trojanised binaries activate a backdoor that sends GET requests to a domain typosquatting the vendor's download site; when the server replies with a shell command, it runs through
    `cmd.exe`, which in the observed cases ran PowerShell to download an executable into `C:\Windows\Temp` and execute it, the first payload being a .NET information collector (
  urls:
  - https://securelist.com/tr/daemon-tools-backdoor/119654/
- claim_id: b9954e022b
  entry: 2026-05-09/daemon-tools-lite-supply-chain-quic-rat-deployed-via-signed
  surface: body
  kind: cited
  text: Kaspersky saw several thousand infection attempts in more than 100 countries, 10% of the affected systems belonging to organizations, and most received only the information collector (
  urls:
  - https://securelist.com/tr/daemon-tools-backdoor/119654/
- claim_id: 4230d03b1c
  entry: 2026-05-09/daemon-tools-lite-supply-chain-quic-rat-deployed-via-signed
