- claim_id: 42db1dbfe4
  entry: 2026-05-11/cve-2026-6722-php-soap-use-after-free-in-soap-global-ref-map
  surface: body
  kind: cited
  text: 'The serious one, CVE-2026-6722, is a use-after-free: `ext-soap` remembers decoded PHP objects in `SOAP_GLOBAL(ref_map)` for `id`/`href` deduplication without holding a reference, so an `apache:Map`
    with a duplicate key and an empty value frees an object while the map still points to it, and a later `href` reuses the freed memory, which PHP''s advisory says can lead to remote code execution ('
  urls:
  - https://github.com/php/php-src/security/advisories/GHSA-85c2-q967-79q5
