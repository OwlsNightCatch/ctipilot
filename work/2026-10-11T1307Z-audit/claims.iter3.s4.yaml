- claim_id: cb64dc5418
  entry: 2026-05-11/cve-2026-6722-php-soap-use-after-free-in-soap-global-ref-map
  surface: summary
  kind: frontmatter
  text: PHP's 2026-05-07 releases fix CVE-2026-6722, a use-after-free in the SOAP extension's object deduplication that PHP says can lead to remote code execution (PHP's advisory rates it High, while its
    CVE record scores 9.5 under CVSS 4.0, with high attack complexity), along with a session-persistence use-after-free (CVE-2026-7261) and a typemap NULL dereference (CVE-2026-7262). No exploitation is
    reported.
