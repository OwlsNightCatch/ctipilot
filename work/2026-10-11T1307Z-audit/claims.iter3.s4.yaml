- claim_id: 9fe11790e3
  entry: 2026-10-11/needymantis-modular-post-compromise-framework-storm-3069
  surface: headline
  kind: frontmatter
  text: 'Microsoft: a China-aligned implant hides in legitimate software via DLL sideloading and takes modules over WebSockets'
- claim_id: 3ec9d2e5bb
  entry: 2026-10-11/needymantis-modular-post-compromise-framework-storm-3069
  surface: summary
  kind: frontmatter
  text: Microsoft Threat Intelligence describes NeedyMantis, a modular post-compromise malware framework used since at least October 2025 in a limited number of targeted intrusions at telecommunications
    organizations, universities, medical nonprofits, intergovernmental organizations and government contractors. It is deployed after access exists, sideloaded as a DLL beside legitimate software, and loads
    further modules over a WebSocket channel. Storm-3069, Microsoft's designator for the DAEMON Tools supply-chain activity, is one operator; Microsoft assesses the activity originates from China without
    attributing it to a nation-state actor.
- claim_id: cafaf91a07
  entry: 2026-10-11/needymantis-modular-post-compromise-framework-storm-3069
  surface: body
  kind: cited
  text: 'Microsoft Threat Intelligence published its analysis of NeedyMantis on 2026-09-28: a modular post-compromise malware family seen since at least October 2025 in a limited number of targeted operations
    against telecommunications organizations, universities, medical nonprofits, intergovernmental organizations and government contractors ('
  urls:
  - https://www.microsoft.com/en-us/security/blog/2026/09/28/needymantis-unpacking-a-post-compromise-malware-family-used-in-targeted-operations/
- claim_id: e24c2a58b3
  entry: 2026-10-11/needymantis-modular-post-compromise-framework-storm-3069
  surface: body
  kind: cited
  text: Microsoft found it by pivoting from indicators in Kaspersky's investigation of the DAEMON Tools supply-chain compromise and names Storm-3069, its designator for that activity, as at least one operator;
    it has seen further NeedyMantis activity beyond Storm-3069 and assesses the activity originates from China without attributing it to a Chinese nation-state actor (
  urls:
  - https://www.microsoft.com/en-us/security/blog/2026/09/28/needymantis-unpacking-a-post-compromise-malware-family-used-in-targeted-operations/
- claim_id: cbfbea1374
  entry: 2026-10-11/needymantis-modular-post-compromise-framework-storm-3069
  surface: body
  kind: cited
  text: Microsoft has not seen NeedyMantis itself delivered through a supply chain; it is deployed after the operator already has access, and in one intrusion the operator used Impacket to copy the legitimate
    application, the malicious DLL and an encrypted archive from a network share and run them (
  urls:
  - https://www.microsoft.com/en-us/security/blog/2026/09/28/needymantis-unpacking-a-post-compromise-malware-family-used-in-targeted-operations/
- claim_id: 66dd5766ad
  entry: 2026-10-11/needymantis-modular-post-compromise-framework-storm-3069
  surface: body
  kind: cited
  text: The first-stage loader is a DLL sideloaded by the legitimate program it ships with, in the analysed case a fake WinSparkle update component of the Poedit translation tool, with other pairings built
    on curl, Vim and TightVNC and DLLs masquerading as Microsoft Office, Broadcom, Intel and NVIDIA components under ProgramData and Program Files (
  urls:
  - https://www.microsoft.com/en-us/security/blog/2026/09/28/needymantis-unpacking-a-post-compromise-malware-family-used-in-targeted-operations/
- claim_id: 344844a856
  entry: 2026-10-11/needymantis-modular-post-compromise-framework-storm-3069
  surface: body
  kind: cited
  text: It hides its strings and constants, checks for debuggers, and extracts a second-stage shellcode loader from a custom encrypted archive that in turn unpacks the main component (
  urls:
  - https://www.microsoft.com/en-us/security/blog/2026/09/28/needymantis-unpacking-a-post-compromise-malware-family-used-in-targeted-operations/
- claim_id: 92a4f3f1ee
  entry: 2026-10-11/needymantis-modular-post-compromise-framework-storm-3069
  surface: body
  kind: cited
  text: The main component reads its configuration from a file named after a Windows networking library, beacons with an HTTPS GET request whose cookie carries the computer name, user name, process list
    and Program Files listing, then switches to WebSockets with a binary protocol encrypted with RC4 after a key exchange; its handful of commands chiefly load, unload and pass data to further modules,
    whose capabilities Microsoft has not confirmed (
  urls:
  - https://www.microsoft.com/en-us/security/blog/2026/09/28/needymantis-unpacking-a-post-compromise-malware-family-used-in-targeted-operations/
- claim_id: 93bc1dd47c
  entry: 2026-10-11/needymantis-modular-post-compromise-framework-storm-3069
  surface: body
  kind: cited
  text: '**Detection:** in image-load telemetry, a legitimate application such as Poedit, curl, Vim or TightVNC loading a same-named DLL from an unusual ProgramData or Program Files folder, next to an extension-less
    archive with the DLL''s name; in network telemetry, an HTTPS request with an oversized cookie followed by a WebSocket upgrade from that process; and in process telemetry, Impacket-style remote execution
    that stages such a bundle from a network share ('
  urls:
  - https://www.microsoft.com/en-us/security/blog/2026/09/28/needymantis-unpacking-a-post-compromise-malware-family-used-in-targeted-operations/
- claim_id: 9342f9dd54
  entry: 2026-10-11/needymantis-modular-post-compromise-framework-storm-3069
  surface: body
  kind: cited
  text: '**Triage:** these tools legitimately load their own DLLs, and in the analysed case the malicious DLL replaced Poedit''s own WinSparkle update component in its normal install folder, so the location
    alone does not decide it; the discriminator is the companion extension-less archive named like the DLL, which a genuine installation does not carry, together with a DLL that differs from the vendor''s
    original component, and for the ProgramData pairings an application folder the organization never deployed ('
  urls:
  - https://www.microsoft.com/en-us/security/blog/2026/09/28/needymantis-unpacking-a-post-compromise-malware-family-used-in-targeted-operations/
- claim_id: e5400eaa94
  entry: 2026-10-11/needymantis-modular-post-compromise-framework-storm-3069
  surface: body
  kind: derived
  text: '**Defender takeaway:** NeedyMantis is a second-stage foothold, so a hit means an intrusion is already under way; organizations that ran an affected DAEMON Tools Lite build or that support intergovernmental
    bodies as contractors should hunt for the sideloading pattern rather than wait for an initial-access alert.'
