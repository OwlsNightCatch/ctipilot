- claim_id: f5c20cd7fb
  entry: 2026-09-24/microsoft-entra-id-sspr-enumeration-resetspy
  surface: record 2026-10-11T14:10:34Z
  kind: record-summary
  text: The takeaway recommended scoping SSPR to a group without LevelBlue's own caveat that scoped SSPR leaks more about the accounts inside the group; the caveat is added. Microsoft replaced the CAPTCHA
