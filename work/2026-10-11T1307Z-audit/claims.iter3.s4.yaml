- claim_id: 86db4957ea
  entry: 2026-09-24/microsoft-entra-id-sspr-enumeration-resetspy
  surface: body
  kind: cited
  text: 'Every other named view — including the documented error codes for "SSPR not enabled for this user" (SSPR_0011) and "not a member of the scoped access group" (SSPR_0013) — still confirms the account
    exists, because the server only reaches those policy checks after resolving the username in the directory: "The server only reaches those policy checks after successfully resolving the username in the
    directory" ('
  urls:
  - https://www.levelblue.com/blogs/spiderlabs-blog/enumerating-users-and-mfa-via-microsofts-password-reset-portal
- claim_id: da1f15fca4
  entry: 2026-09-24/microsoft-entra-id-sspr-enumeration-resetspy
  surface: body
  kind: cited
  text: 'Microsoft enforces SSPR for admin accounts regardless of the tenant-wide SSPR policy, so in a tenant that has disabled SSPR for standard users, any account that still reaches method selection is
    likely a privileged role account, and its registered factors are exposed the same way: "Admin accounts bypass this check entirely and proceed to method enumeration regardless" ('
  urls:
  - https://www.levelblue.com/blogs/spiderlabs-blog/enumerating-users-and-mfa-via-microsofts-password-reset-portal
- claim_id: 351bfa2e84
  entry: 2026-09-24/microsoft-entra-id-sspr-enumeration-resetspy
  surface: body
  kind: cited
  text: Microsoft removed the portal's visual CAPTCHA in August 2026, replacing it with backend throttling and behavioural abuse detection rather than a challenge the user must solve (
  urls:
  - https://www.levelblue.com/blogs/spiderlabs-blog/enumerating-users-and-mfa-via-microsofts-password-reset-portal
- claim_id: a59d354e31
  entry: 2026-09-24/microsoft-entra-id-sspr-enumeration-resetspy
  surface: body
  kind: cited
  text: '**Detection:** Entra ID / Azure AD self-service-password-reset audit events are the telemetry class — specifically SSPR activity records carrying a named error status (such as the "not a member
    of the password reset group" condition) recurring across many distinct usernames from a limited source population in a short window, with no subsequent completed reset ('
  urls:
  - https://www.levelblue.com/blogs/spiderlabs-blog/enumerating-users-and-mfa-via-microsofts-password-reset-portal
- claim_id: 8fbe4b2880
  entry: 2026-09-24/microsoft-entra-id-sspr-enumeration-resetspy
  surface: body
  kind: cited
  text: '**Triage:** a genuine user forgetting a password generates one SSPR lookup that is normally followed by a completed reset; a burst of lookups against many usernames with no completions is the anomalous
    pattern the volume/velocity discriminator is built on, not the existence of lookups themselves ('
  urls:
  - https://www.levelblue.com/blogs/spiderlabs-blog/enumerating-users-and-mfa-via-microsofts-password-reset-portal
- claim_id: e2c4328926
  entry: 2026-09-24/microsoft-entra-id-sspr-enumeration-resetspy
  surface: body
  kind: cited
  text: '**Defender takeaway:** scope SSPR to a specific security group rather than tenant-wide to shrink the enumerable population, knowing that scoping does not stop existence enumeration and exposes
    the registered methods, or the empty method list, of every in-scope account, remove alternate-email-OTP and security-question options from the permitted SSPR methods, and enforce phishing-resistant
    MFA on every privileged role — since Microsoft cannot let admin accounts opt out of the underlying enumeration, a stronger factor on those accounts is the control that actually removes the value of
    what the technique reveals ('
  urls:
  - https://www.levelblue.com/blogs/spiderlabs-blog/enumerating-users-and-mfa-via-microsofts-password-reset-portal
- claim_id: 56b07a8bd5
  entry: 2026-09-24/microsoft-entra-id-sspr-enumeration-resetspy
  surface: body
  kind: uncited
  text: 'Submitting an email address triggers an ASP.NET UpdatePanel POST, and the server''s reply carries a hidden `CurrentViewName` field that tells an attacker exactly what happened server-side: `ViewMultigateUserControl`
    means the account exists and SSPR advanced to method selection, while a genuine not-found bounces back to `ViewUserIdentifierVerification`.'
- claim_id: 7b63aac8af
  entry: 2026-09-24/microsoft-entra-id-sspr-enumeration-resetspy
  surface: body
  kind: uncited
  text: For an account that reaches the method-selection screen, the response HTML lists every registered second factor as visible radio buttons, with unregistered methods present in the DOM but hidden
    — so an attacker also learns whether a target relies on an authenticator app, SMS, or a more easily phished alternate-email one-time code.
- claim_id: 6d13b17a78
  entry: 2026-09-24/microsoft-entra-id-sspr-enumeration-resetspy
  surface: body
  kind: uncited
  text: The technique's sharpest edge is administrator identification.
- claim_id: e69f196915
  entry: 2026-09-24/microsoft-entra-id-sspr-enumeration-resetspy
  surface: body
  kind: uncited
  text: This turns a list of candidate email addresses harvested from a company website, LinkedIn, or a data breach into a confirmed target list, ranked by which accounts have the weakest second factor,
    before any credential attack begins.
