- code: F4
  entry: 2026-09-19/cve-2026-81642-cve-2026-82717-unbound-dnssec-rce
  where: main analysis paragraph 1, last clause
  summary: '(low confidence) Iteration-4 F4 was fixed in the takeaway and action only. The main analysis still ends: ''"...parsed" ([NCSC Switzerland, 2026-09-18](...)), a normal condition for any DNSSEC-validating
    resolver doing open recursive resolution against the internet, not an edge case.'' It sits after the NCSC citation, is uncited and is not marked as analyst judgement.'
  ground_truth: 'NCSC-CH: "Prerequisites: Resolver must have DNSSEC validation active, and query routing must allow the attacker''s malicious DNS zone to be parsed." NLnet Labs: "An adversary can exploit
    the vulnerability by controlling a malicious zone and querying a vulnerable Unbound." Neither says the precondition is normal or independent of attacker-initiated queries.'
  ground_truth_url: https://security-hub.ncsc.admin.ch/#/posts/12957
  fix: Delete the clause, or prefix it "in analyst judgement" as the takeaway now does.
