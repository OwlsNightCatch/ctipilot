- code: F3
  entry: 2026-05-18/cve-2026-42897-exchange-owa-em-service-auto-mitigation-depen
  where: '## Update — 2026-07-31T04:09:14Z, paragraph 1 and the "Patching." paragraph'
  summary: 'Iteration-3/4 "must" finding remains in the 2026-07-31 section: the remediation fixed the main analysis and the takeaway only. Para 1: "with the mitigation now something that must be actively
    torn down" (cited to the July Exchange Team blog). Patching para: "administrators who used the EM Service must remove the M2.1.0 IIS rules through the documented rollback, and those who ran the downloadable
    mitigation script must run its rollback." (no citation on that sentence).'
  ground_truth: 'July blog: "Installing the July 2026 update does not automatically remove already applied CVE-2026-42897 mitigations. Therefore, once you install July SU, you should: ... Remove the mitigation
    M2.1.0 IIS rules ... Roll back the mitigation." June blog: "We recommend that customers keep CVE-2026-42897 mitigation in place ... if you choose to remove mitigations after installation, you should".
    MSRC: mitigations "can be removed after July 2026 update is installed".'
  ground_truth_url: https://techcommunity.microsoft.com/blog/exchange/released-july-2026-exchange-server-security-updates/4534146
  fix: 'Reword both sentences to Microsoft''s modal strength: the update does not remove the mitigation; Microsoft advises removing it after the July update (EM-service M2.1.0 rules or EOMT rollback). Cite
    the Patching sentence to the July blog.'
