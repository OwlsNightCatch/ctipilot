- entry: entries/2026-09-17/mandiant-ai-risk-resilience-report-2026.md
  verdict: factual-error
  style_advisory: em dashes throughout the body prose (10 lines incl. title) plus the permitted Update/Correction heading
    form; site strips them
  defects:
  - code: F4
    where: summary + body ¶ Case study 7
    claim: a customer-service RAG agent that leaked cross-tenant PII via indirect prompt injection in forum comments  /  an
      attacker embedded hidden instructions inside a public forum post, which the model interpreted as system-level commands
      once retrieved, hijacking its reasoning to exfiltrate other customers' PII from cross-tenant support tickets directly
      into its response stream
    ground_truth: 'Mandiant describes an assessment finding, not an observed leak: "While the customer had strong controls
      around the vector database, they did not consider indirect prompt injection ... When the RAG agent retrieved these entries
      to resolve legitimate user inquiries, the model could interpret the embedded instructions as system-level commands.
      This could potentially hijack the model''s reasoning, causing it to exfiltrate sensitive data from other customers''
      support tickets and expose PII ..." No source says an attacker did this or that PII leaked.'
    ground_truth_url: https://cloud.google.com/security/resources/ai-risk-and-resilience-2026
    fix: Restate as a vulnerability Mandiant identified in a customer's RAG agent (indirect prompt injection via forum comments
      and support tickets could cause cross-tenant PII exposure), not an incident; fix the summary clause ("leaked" -> "was
      assessed as exposed to leaking") and the Case study 7 heading/verb tense.
  - code: F5
    where: 'body: Case study 3, Case study 4, Case study 5, Case study 7, the cross-cutting recommendation paragraph and the
      Defender takeaway'
    claim: (paragraphs carry no inline citation, e.g. "**Case study 4 — just-in-time polymorphic malware.** Malware using
      embedded, lightweight local AI inference fingerprints the active security tools on a host ...")
    ground_truth: Every fact in these paragraphs comes from the Mandiant report, but no link follows any sentence in them
      (only case studies 1, 2, 6 and 8 and the opening paragraph carry the Mandiant link).
    ground_truth_url: https://cloud.google.com/security/resources/ai-risk-and-resilience-2026
    fix: Add the "([Mandiant, 2026-09-15](https://cloud.google.com/security/resources/ai-risk-and-resilience-2026))" citation
      to the factual sentence of each of those paragraphs.
  - code: F4
    where: body ¶ Case study 1 (and headline)
    claim: 'An attacker compromised a SaaS provider by poisoning an external software package that a developer''s active AI
      coding-assistant session then recommended installing  ...  the actor then re-poisoned the organization''s own package
      namespace  /  headline: a poisoned dependency revived the Shai-Hulud worm'
    ground_truth: 'The report says the threat actor "compromised a software-as-a-service (SaaS) provider and hijacked an active
      AI coding assistant session on a developer''s workstation"; the assistant then "recommended the installation of an external
      software package that had been poisoned by the attacker". The poisoned package is a step after the session hijack, not
      how the provider was compromised; the entry omits the hijack. It also says the actor "poisoned a package inside the
      organization''s official namespace" (not "re-poisoned"), and nothing says the worm was "revived" (heading: "Weaponizing
      active developer AI sessions to deploy the ''Shai-Hulud worm''").'
    ground_truth_url: https://cloud.google.com/security/resources/ai-risk-and-resilience-2026
    fix: '"A threat actor compromised a SaaS provider and hijacked a developer''s active AI coding-assistant session; the
      assistant, as a trusted interpreter, recommended a package the attacker had poisoned ... then poisoned a package in
      the organization''s own namespace." Replace "revived" in headline/title with "deployed".'
  - code: F4
    where: body ¶ Case study 2 and Case study 6
    claim: co-debugging a multi-worker credential-harvesting framework to cut its exfiltration cycle to three hours  /  locking
      the production ledger database
    ground_truth: 'Case study 2: the AI helped "construct a multi-worker data-harvesting framework ... to increase data exfiltration
      frequency to a rapid three-hour cycle" (data-harvesting, not credential-harvesting; credentials are the outcome later
      in the text). Case study 6: the agent had "direct read/write access to internal billing databases" and caused "severe
      local database locking that halted active business transactions"; no source says a "production ledger database" was
      locked.'
    ground_truth_url: https://cloud.google.com/security/resources/ai-risk-and-resilience-2026
    fix: '"multi-worker data-harvesting framework"; "causing severe local database locking that halted active business transactions".'
  - code: F4
    where: body ¶ cross-cutting recommendation
    claim: replace static service-account identities with cryptographically bound, lifecycle-integrated agent identities (such
      as SPIFFE-based Workload Identity Federation)
    ground_truth: The report says "transitioning away from traditional service accounts toward dynamic, cryptographically
      bound lifecycle-integrated identities (such as Agent Identity)"; Workload Identity Federation and SPIFFE appear only
      in pillar 1 as controls for decoupling compute identity from data access.
    ground_truth_url: https://cloud.google.com/security/resources/ai-risk-and-resilience-2026
    fix: '"(such as Google''s Agent Identity)", with Workload Identity Federation and SPIFFE kept to the pillar-1 description.'
  - code: F4
    where: summary
    claim: Mandiant's second annual AI Risk and Resilience report
    ground_truth: (low confidence) The report refers only to "the previous AI risk and resilience report (2025 lookback)";
      nothing says this is the second annual edition.
    ground_truth_url: https://cloud.google.com/security/resources/ai-risk-and-resilience-2026
    fix: '"Mandiant''s 2026 AI Risk and Resilience report, the follow-up to its 2025 edition".'
  - code: F4
    where: techniques
    claim: T1554 (Case study 3, tampered CLI hooks)
    ground_truth: (low confidence) T1554 is "Compromise Host Software Binary" (persistence). The report says an attacker "poisoned
      an internal AI repository and tampered with the assistant's underlying CLI hooks ... achieved remote code execution
      (RCE) natively through the AI platform's standard operational workflow"; no binary modification is described.
    ground_truth_url: https://cloud.google.com/security/resources/ai-risk-and-resilience-2026
    fix: Remove T1554 or map the hook/plugin tampering to a technique the source describes (supply-chain/dev-tool compromise
      is already T1195.001).
