- entry: entries/2026-09-19/cisa-kev-linux-kernel-ktls-af-alg-ebtables-snat.md
  verdict: factual-error
  style_advisory: 'no em dashes outside permitted headings. Named lead decided below (F3 record): all three fixed-version
    lists are correct; only the CVE-to-ChangeLog binding is not carried by the cited pages.'
  defects:
  - code: F4
    where: cves[CVE-2026-53266].affected
    claim: 'affected: "≤ 6.18.35; branch-dependent, see body"'
    ground_truth: The kernel CNA's CVE record lists 7.0.13 as the first unaffected 7.0.x ({'version':'7.0.13','lessThanOrEqual':'7.0.*','status':'unaffected'})
      and 7.1 as the mainline fix, so 7.0.0 through 7.0.12 are affected. "≤ 6.18.35" therefore excludes the 7.0 train that
      the entry's own fixed list (7.0.13, added by the 2026-09-30 correction) names. The same record starts the affected range
      at 5.10 (plus 5.4.73-5.4.x, 5.8.17, 5.9.2 test branches), and the body has no branch breakdown for "see body" to point
      at.
    ground_truth_url: https://cveawg.mitre.org/api/cve/CVE-2026-53266
    fix: 'affected: "from 5.10 up to the per-branch fix (5.10.259, 5.15.210, 6.1.176, 6.6.143, 6.12.94, 6.18.36, 7.0.13);
      mainline fixed in 7.1; also requires ebtables SNAT ARP-rewrite rules on a bridge". Drop "see body".'
  - code: F4
    where: cves[CVE-2025-39682].affected
    claim: 'affected: "≤ 6.16.3 on kernels using kernel TLS; branch-dependent, see body"'
    ground_truth: (low confidence) The kernel CNA record gives the introducing commit as 84c61fe1a75b (first affected version
      6.0) and marks everything below 6.0 unaffected ({'version':'0','lessThan':'6.0','status':'unaffected'}); fixed in 6.1.149,
      6.6.103, 6.12.44, 6.16.4 and mainline 6.17. "≤ 6.16.3" with no lower bound makes 5.10/5.15 and RHEL 8/9-class kernels
      look affected although only 6.0+ is.
    ground_truth_url: https://cveawg.mitre.org/api/cve/CVE-2025-39682
    fix: 'affected: "6.0 up to the branch fix (6.1.149, 6.6.103, 6.12.44, 6.16.4; mainline fixed in 6.17), only where kernel
      TLS is in use".'
  - code: F3
    where: body ¶1 (fixed stable kernels sentence) and cves[].fixed
    claim: 'Fixed stable kernels, each confirmed in kernel.org''s release ChangeLog: CVE-2025-39682 in [6.1.149](.../v6.x/ChangeLog-6.1.149),
      [6.6.103], [6.12.44] and [6.16.4]; CVE-2025-39964 in [5.10.245] ... [6.16.9]; CVE-2026-53266 in [5.10.259] ... [7.0.13]'
    ground_truth: 'Named lead decided: the fixed-release claims are CORRECT, not mis-bound. Each ChangeLog carries the branch
      fix commit that CISA''s KEV record (notes field) and the kernel CNA record list for that CVE, e.g. ChangeLog-6.1.149
      has "commit 2902c3ebcca52ca845c03182000e8d71d3a5196f ... tls: fix handling of zero-length records on the rx_list ...
      commit 62708b9452f8eb77513115b17c4f8d1a22ebf843 upstream" (CVE-2025-39682); ChangeLog-6.1.154/6.6.108/... carry "crypto:
      af_alg - Disallow concurrent writes in af_alg_sendmsg" with the KEV SHAs (0f28c4adbc4a, e4c1ec11132e, 1f323a48e9b5,
      7c4491b5644e, 9aee87da5572, 45bcf60fe49b, mainline 1b34cbbf4f01) for CVE-2025-39964; ChangeLog-5.10.259 ... 7.0.13 carry
      "netfilter: bridge: make ebt_snat ARP rewrite writable" with the KEV SHAs (bf84ad7c7a9e, 76280b78cc9f, b7e91939ba9b,
      afd64b59c3de, 153ea96c806a, b18675263db1, c9b5ff59feff, mainline 67ba971ae025) for CVE-2026-53266. All 17 release dates
      equal the sources[] dates. The kernel CNA records list exactly these releases as the first unaffected per branch. The
      ChangeLogs name commits, never CVE ids (0 of 17 pages contain a CVE id), so the page itself does not bind CVE to release;
      the binding comes from the KEV notes / CVE records.'
    ground_truth_url: https://cdn.kernel.org/pub/linux/kernel/v6.x/ChangeLog-6.1.149
    fix: 'Keep the version lists. Make the binding citable: cite CISA''s KEV record (already a source; its notes list the
      per-branch git.kernel.org/stable/c/<sha> fix commits) or the kernel CNA record (https://cveawg.mitre.org/api/cve/CVE-2025-39682
      etc., fetched this pass) for "CVE X is fixed by these commits/releases", and reword to "each release''s ChangeLog contains
      the fix commit" so the ChangeLogs vouch only for the commit, not the CVE id.'
- entry: entries/2026-09-19/cve-2026-81642-cve-2026-82717-unbound-dnssec-rce.md
  verdict: imprecision
  style_advisory: one em dash in actions[0] ('...to 1.26.1 now — normal recursive resolution...'); site strips it at render
  defects:
  - code: F8
    where: summary + actions[0] + body takeaway
    claim: Any DNSSEC-validating resolver that can be made to resolve an attacker-registered zone must patch to 1.26.1 now.  /  Patch
      every DNSSEC-validating Unbound resolver to 1.26.1 now
    ground_truth: 'The DNSSEC-validation prerequisite (NCSC post 12957: "Prerequisites: Resolver must have DNSSEC validation
      active, and query routing must allow the attacker''s malicious DNS zone to be parsed") belongs to CVE-2026-81642 only.
      NLnet Labs lists CVE-2026-82717 (CNAME synthesis during an upstream response, "Unbound up to and including version 1.26.0",
      severity High, impact "Denial of service and possible remote code execution") with no DNSSEC or validation precondition,
      and the NCSC post itself says the secondary flaw CVE-2026-82717 "also allows remote code execution via heap corruption
      during upstream response CNAME synthesis". A non-validating Unbound at <= 1.26.0 is therefore still affected by CVE-2026-82717,
      but the summary and the action tell the reader to patch only validating resolvers.'
    ground_truth_url: https://nlnetlabs.nl/projects/unbound/security-advisories/
    fix: '"Patch every Unbound resolver at <= 1.26.0 to 1.26.1 now; CVE-2026-81642 additionally requires DNSSEC validation,
      CVE-2026-82717 does not."'
  - code: F4
    where: cves[CVE-2026-82717].cvss / correction 2026-09-30
    claim: 'No citable source publishes a CVSS score for CVE-2026-82717, so the 8.4 given for it earlier is withdrawn.  (cves:
      cvss: null)'
    ground_truth: '(low confidence) NLnet Labs'' own security-advisories page publishes a CVSS 4.0 vector for CVE-2026-82717:
      Severity "High" linked to CVSS:4.0/AV:N/AC:H/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:U (and for CVE-2026-81642
      "Critical", CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:U/U:Red). The page gives no numeric score,
      so "no numeric score is published" is right, but "no citable source publishes a CVSS score" misses that the vendor publishes
      the vector.'
    ground_truth_url: https://nlnetlabs.nl/projects/unbound/security-advisories/
    fix: Record the vendor's severity and vector for CVE-2026-82717 in cves[].cvss (e.g. "High (vendor CVSS 4.0 vector AV:N/AC:H/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H/E:U;
      no numeric score published)") and cite the NLnet Labs advisory page.
