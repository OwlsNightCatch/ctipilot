  entry: 2026-10-11/needymantis-modular-post-compromise-framework-storm-3069
  surface: body
  kind: cited
  text: '**Detection:** in image-load telemetry, a legitimate application such as Poedit, curl, Vim or TightVNC loading a same-named DLL from an unusual ProgramData or Program Files folder, next to an extension-less
    archive with the DLL''s name; in network telemetry, an HTTPS request with an oversized cookie followed by a WebSocket upgrade from that process; and in process telemetry, Impacket-style remote execution
    that stages such a bundle from a network share ('
  urls:
  - https://www.microsoft.com/en-us/security/blog/2026/09/28/needymantis-unpacking-a-post-compromise-malware-family-used-in-targeted-operations/
- claim_id: 9342f9dd54
  entry: 2026-10-11/needymantis-modular-post-compromise-framework-storm-3069
  surface: body
  kind: cited
  text: '**Triage:** these tools legitimately load their own DLLs, and in the analysed case the malicious DLL replaced Poedit''s own WinSparkle update component in its normal install folder, so the location
    alone does not decide it; the discriminator is the companion extension-less archive named like the DLL, which a genuine installation does not carry, together with a DLL that differs from the vendor''s
    original component, and for the ProgramData pairings an application folder the organization never deployed ('
  urls:
  - https://www.microsoft.com/en-us/security/blog/2026/09/28/needymantis-unpacking-a-post-compromise-malware-family-used-in-targeted-operations/
