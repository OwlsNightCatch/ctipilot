- claim_id: 37d0498555
  entry: 2026-06-07/hijacked-polyfill-io-domain-reactivates-surfacing-native-bro
  surface: summary
  kind: frontmatter
  text: From late May 2026 the Polyfill CDN domain hijacked in 2024 answered requests with HTTP 401 authentication challenges, so browsers on pages that still loaded its script showed a native sign-in dialog.
