  entry: 2026-10-11/needymantis-modular-post-compromise-framework-storm-3069
  surface: body
  kind: cited
  text: The first-stage loader is a DLL sideloaded by the legitimate program it ships with, in the analysed case a fake WinSparkle update component of the Poedit translation tool, with other pairings built
    on curl, Vim and TightVNC and DLLs masquerading as Microsoft Office, Broadcom, Intel and NVIDIA components under ProgramData and Program Files (
