- claim_id: d03c4d6986
  entry: 2026-05-10/microsoft-semantic-kernel-cve-2026-26030-cve-2026-25592-prom
  surface: body
  kind: cited
  text: '**CVE-2026-26030** (Python `semantic-kernel` before 1.39.4) sits in the In-Memory Vector Store filter behind the Search Plugin: in the default configuration the filter is a Python lambda executed
    with `eval()`, and an AI-controlled value is interpolated into it ('
  urls:
  - https://www.microsoft.com/en-us/security/blog/2026/05/07/prompts-become-shells-rce-vulnerabilities-ai-agent-frameworks/
- claim_id: 1e268340e9
  entry: 2026-05-10/microsoft-semantic-kernel-cve-2026-26030-cve-2026-25592-prom
  surface: body
  kind: cited
  text: Microsoft's exploit prompt escaped the template string, traversed Python's class hierarchy to `BuiltinImporter`, loaded `os` and called `system()`, bypassing the AST-based blocklist; the fix adds
    node-type and function-call allowlists and blocks class-hierarchy attributes (
  urls:
  - https://www.microsoft.com/en-us/security/blog/2026/05/07/prompts-become-shells-rce-vulnerabilities-ai-agent-frameworks/
- claim_id: 94f7da918a
  entry: 2026-05-10/microsoft-semantic-kernel-cve-2026-26030-cve-2026-25592-prom
  surface: body
  kind: cited
  text: The attack needs a prompt-injection vector and the Search Plugin backed by the In-Memory Vector Store in its default configuration (
  urls:
  - https://www.microsoft.com/en-us/security/blog/2026/05/07/prompts-become-shells-rce-vulnerabilities-ai-agent-frameworks/
- claim_id: aacd8771fa
  entry: 2026-05-10/microsoft-semantic-kernel-cve-2026-26030-cve-2026-25592-prom
  surface: body
  kind: cited
  text: ), and the advisory advises against using the In-Memory Vector Store in production (
  urls:
  - https://github.com/microsoft/semantic-kernel/security/advisories/GHSA-xjw9-4gw8-4rqx
- claim_id: 04a821449d
  entry: 2026-05-10/microsoft-semantic-kernel-cve-2026-26030-cve-2026-25592-prom
  surface: body
  kind: cited
  text: '**CVE-2026-25592** (.NET `Microsoft.SemanticKernel.Plugins.Core` before 1.71.0) exposed `DownloadFileAsync` to the model as a kernel function, so a prompt could have the agent write a script created
    inside the Azure Container Apps sandbox into the host''s Windows Startup folder, where it runs at the next sign-in; `upload_file` in both SDKs similarly accepted any local path, allowing host files
    to be read out ('
  urls:
  - https://www.microsoft.com/en-us/security/blog/2026/05/07/prompts-become-shells-rce-vulnerabilities-ai-agent-frameworks/
- claim_id: 990eb875fe
  entry: 2026-05-10/microsoft-semantic-kernel-cve-2026-26030-cve-2026-25592-prom
  surface: body
  kind: cited
  text: The advisory's workaround is a Function Invocation Filter that allow-lists `localFilePath` for the download and upload functions (
  urls:
  - https://github.com/microsoft/semantic-kernel/security/advisories/GHSA-2ww3-72rp-wpp4
- claim_id: 967d85a969
  entry: 2026-05-10/microsoft-semantic-kernel-cve-2026-26030-cve-2026-25592-prom
  surface: body
  kind: cited
  text: '**Exposure:** agents built on Python `semantic-kernel` before 1.39.4 using the In-Memory Vector Store filter, or on the .NET Core plugins before 1.71.0 using the sessions Python plugin ('
  urls:
  - https://www.microsoft.com/en-us/security/blog/2026/05/07/prompts-become-shells-rce-vulnerabilities-ai-agent-frameworks/
- claim_id: 79dc5b0b20
  entry: 2026-05-10/microsoft-semantic-kernel-cve-2026-26030-cve-2026-25592-prom
  surface: body
  kind: cited
  text: '**Detection:** in process telemetry, a Semantic Kernel host process (a Python interpreter or `dotnet.exe`) spawning a shell or download utility is what Microsoft''s hunting queries look for, and
    Microsoft names an agent process dropping scripts into a Startup folder as behaviour endpoint defences should catch ('
  urls:
  - https://www.microsoft.com/en-us/security/blog/2026/05/07/prompts-become-shells-rce-vulnerabilities-ai-agent-frameworks/
- claim_id: ef822ffa7e
  entry: 2026-05-10/microsoft-semantic-kernel-cve-2026-26030-cve-2026-25592-prom
  surface: body
  kind: cited
  text: '**Defender takeaway:** the model is not a security boundary; any agent tool that reaches `eval()` or the host file system needs the same input validation as an internet-facing endpoint, and these
    two fixes have been available since February ('
  urls:
  - https://github.com/microsoft/semantic-kernel/security/advisories/GHSA-2ww3-72rp-wpp4
  - https://github.com/microsoft/semantic-kernel/security/advisories/GHSA-xjw9-4gw8-4rqx
