  entry: 2026-05-09/denic-de-dnssec-outage-faulty-key-rollover-3-5-h-disruption
  surface: headline
  kind: frontmatter
  text: DENIC's new signing system generated one key pair per HSM, so most .de signatures failed validation until DENIC redistributed the zone
- claim_id: d722b10971
  entry: 2026-05-09/denic-de-dnssec-outage-faulty-key-rollover-3-5-h-disruption
  surface: summary
  kind: frontmatter
  text: A routine DNSSEC key rollover on 2026-05-05 left the .de zone with signatures validating resolvers could not verify, from an onset the sources place between about 19:30 and 19:57 UTC until DENIC
    restored normal operation at 23:15 UTC. DENIC's new signing system generated one key pair per HSM instead of one shared pair, so only one matched the published DNSKEY; unverifiable NSEC3 signatures
    broke even unsigned .de domains.
- claim_id: e1e4319a9c
  entry: 2026-05-09/denic-de-dnssec-outage-faulty-key-rollover-3-5-h-disruption
  surface: body
  kind: cited
  text: During a routine, scheduled DNSSEC key rollover on the evening of 2026-05-05, DENIC distributed signatures for the `.de` zone that validating resolvers could not verify, so they treated responses
    for all `.de` domains as bogus (
  urls:
  - https://blog.denic.de/en/technical-issue-with-de-domains-resolved/
- claim_id: 8c7e5ca79e
  entry: 2026-05-09/denic-de-dnssec-outage-faulty-key-rollover-3-5-h-disruption
  surface: body
  kind: cited
  text: DENIC dates the incident from 21:57 local time (19:57 UTC), began distributing a correct zone at 00:08 and had fully restored normal operation by 01:15 on 2026-05-06 (23:15 UTC) (
  urls:
  - https://blog.denic.de/en/technical-issue-with-de-domains-resolved/
- claim_id: 84584a9d63
  entry: 2026-05-09/denic-de-dnssec-outage-faulty-key-rollover-3-5-h-disruption
  surface: body
  kind: cited
  text: ); Cloudflare saw SERVFAILs from about 19:30 UTC and rolled out its own mitigation at 22:17 UTC through an existing override rule, having no native negative trust anchor mechanism (
  urls:
  - https://blog.cloudflare.com/de-tld-outage-dnssec/
- claim_id: c28965c3cc
  entry: 2026-05-09/denic-de-dnssec-outage-faulty-key-rollover-3-5-h-disruption
  surface: body
  kind: cited
  text: ); heise dates the first disruption to 21:43 local time, 19:43 UTC (
  urls:
  - https://www.heise.de/news/DNS-Probleme-mit-de-Domains-DENIC-liefert-erste-Erklaerung-11288197.html
- claim_id: 28bfcac61e
  entry: 2026-05-09/denic-de-dnssec-outage-faulty-key-rollover-3-5-h-disruption
  surface: body
  kind: cited
  text: 'DENIC''s analysis traces the fault to in-house code around its hardware security modules in the third-generation signing system it put into operation in April 2026: instead of one key pair stored
    on three HSMs, the software generated three different key pairs, one per HSM, and only one of them matched the pre-published DNSKEY ('
  urls:
  - https://blog.denic.de/analyse-des-dns-ausfalls-vom-5-mai-2026/
- claim_id: d0c1ae3bff
  entry: 2026-05-09/denic-de-dnssec-outage-faulty-key-rollover-3-5-h-disruption
  surface: body
  kind: cited
  text: Because signatures over NSEC3 records were also unverifiable, even second-level domains without DNSSEC failed to resolve, and DENIC's three permanent validation tools detected the anomaly but their
    alerts were not processed correctly (
  urls:
  - https://blog.denic.de/analyse-des-dns-ausfalls-vom-5-mai-2026/
- claim_id: 40b987711d
  entry: 2026-05-09/denic-de-dnssec-outage-faulty-key-rollover-3-5-h-disruption
  surface: body
  kind: cited
  text: '**Defender takeaway:** a TLD-side DNSSEC failure looks the same as an attack to a validating resolver; operators of validating resolvers should have a tested way to mark a broken TLD as insecure
    and should rely on serve-stale to absorb the first hours, as Cloudflare did ('
  urls:
  - https://blog.cloudflare.com/de-tld-outage-dnssec/
- claim_id: c457d15bc3
  entry: 2026-05-09/denic-de-dnssec-outage-faulty-key-rollover-3-5-h-disruption
  surface: section 2026-10-11T14:30:46Z
  kind: cited
  text: 'DENIC''s times are local: the incident ran from 21:57 CEST (19:57 UTC) until normal operation returned at 01:15 CEST (23:15 UTC) ('
  urls:
  - https://blog.denic.de/en/technical-issue-with-de-domains-resolved/
- claim_id: ca976c2853
  entry: 2026-05-09/denic-de-dnssec-outage-faulty-key-rollover-3-5-h-disruption
  surface: section 2026-10-11T14:30:46Z
  kind: cited
  text: ), and Cloudflare dates the onset to about 19:30 UTC and its own mitigation, an override rule rather than a native negative trust anchor, to 22:17 UTC (
  urls:
  - https://blog.cloudflare.com/de-tld-outage-dnssec/
- claim_id: dec5a98de1
  entry: 2026-05-09/denic-de-dnssec-outage-faulty-key-rollover-3-5-h-disruption
  surface: section 2026-10-11T14:30:46Z
  kind: cited
  text: DENIC's addendum of 11 May 2026 says no key-tag collision occurred; the software generated one key pair per HSM, and only one matched the published DNSKEY (
  urls:
  - https://blog.denic.de/analyse-des-dns-ausfalls-vom-5-mai-2026/
- claim_id: 2e9b5cfee6
  entry: 2026-05-09/denic-de-dnssec-outage-faulty-key-rollover-3-5-h-disruption
  surface: section 2026-10-11T14:30:46Z
  kind: uncited
  text: No source gives 18 million affected domains, singles out government domains, or mentions `.ch`.
- claim_id: 9464ef40f0
  entry: 2026-05-09/denic-de-dnssec-outage-faulty-key-rollover-3-5-h-disruption
  surface: record 2026-10-11T14:30:46Z
  kind: record-summary
  text: 'The times were local time labelled UTC: the outage began between about 19:30 and 19:57 UTC, depending on the source, and ended at 23:15 UTC, about three and a half hours. Cloudflare''s mitigation
    came about 2 hours 45 minutes after onset through an override rule, not an RFC 7646 negative trust anchor within 90 minutes; the 18 million domains, the government focus and the statement that .ch was
    unaffected had no source. DENIC''s addendum of 11 May replaces the key-tag collision account: one key pair per HSM instead of a shared pair. The signing system went live in April, not March. The entry
    is recorded as a non-adversarial resilience item with a rating and priority routine, and both sections are corrected in place.'
