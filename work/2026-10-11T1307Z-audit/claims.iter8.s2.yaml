  entry: 2026-09-12/cve-2026-85706-gitlab-unauth-path-traversal-file-read
  surface: summary
  kind: frontmatter
  text: 'GitLab shipped 19.3.2, 19.2.6 and 19.1.8 on 2026-09-10, fixing CVE-2026-85706 (CVSS 10.0): improper path confinement and missing authentication enforcement in the repository commits API let an
    unauthenticated user read arbitrary files from the GitLab server. Every self-managed CE/EE install from 18.7 up to those releases is affected; watchTowr''s global honeypot network was recording behavioral
    probes for the flaw by 2026-09-11, and CISA added it to its Known Exploited Vulnerabilities catalog on 2026-09-11. GitLab backported the fix to 19.0.9 and 18.11.12 on 2026-09-23.'
