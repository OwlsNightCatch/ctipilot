- claim_id: 2699e87db8
  entry: 2026-05-15/cve-2026-42945-nginx-open-source-plus-f5-waf-products-18-yea
  surface: body
  kind: cited
  text: '**Detection:** repeated NGINX worker crashes and automatic restarts, correlated with requests whose URI carries characters that expand when escaped (`+`, `%`, `&`), are the observable effect ('
  urls:
  - https://securityaffairs.com/192132/hacking/nginx-rift-an-18-year-old-flaw-in-the-worlds-most-deployed-web-server-just-came-to-light.html
- claim_id: f95bc0a599
  entry: 2026-05-15/cve-2026-42945-nginx-open-source-plus-f5-waf-products-18-yea
  surface: body
  kind: uncited
  text: 'The root cause: when a `rewrite` directive combines an unnamed PCRE capture (`$1`, `$2`) with a replacement string containing `?`, followed by another `rewrite`, `if`, or `set` directive in the
    same scope, `ngx_http_script_start_args_code()` sets a flag causing the write phase to URI-encode URI argument characters — expanding `+`, `%`, and `&` by two bytes each — while the length-calculation
    phase computed a shorter buffer without this escaping.'
- claim_id: 8c5b27f5a2
  entry: 2026-05-15/cve-2026-42945-nginx-open-source-plus-f5-waf-products-18-yea
  surface: body
  kind: uncited
  text: The result is a deterministic out-of-bounds write into the adjacent heap allocation.
- claim_id: e044f28915
  entry: 2026-05-15/cve-2026-42945-nginx-open-source-plus-f5-waf-products-18-yea
  surface: body
  kind: uncited
  text: Reliable impact is crash of the NGINX worker process (DoS with automatic master restart); RCE requires ASLR to be disabled on the host.
- claim_id: 410f9b0234
  entry: 2026-05-15/cve-2026-42945-nginx-open-source-plus-f5-waf-products-18-yea
  surface: body
  kind: uncited
  text: 'Temporary workaround: replace all unnamed captures with named captures (e.g., `(?P<foo>...)` → `$foo`) in `rewrite` directives, which eliminates the vulnerable code path without requiring upgrade.'
