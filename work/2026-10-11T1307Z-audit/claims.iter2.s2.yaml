- claim_id: ed52f02081
  entry: 2026-05-15/cve-2026-20182-cisco-catalyst-sd-wan-controller-manager-pre
  surface: record 2026-10-11T14:38:39Z
  kind: record-summary
  text: 'CISA did not issue Emergency Directive 26-03 on 2026-05-14: the directive dates from 2026-02-25, and on 2026-05-14 CISA added the flaw to its KEV catalog under it. The NETCONF and SSH-key path
    Rapid7 demonstrated is on the Controller, not the Manager; Talos names exactly ten other clusters exploiting a separate set of February flaws; the segmentation mitigation had no source; and the flaw
    is an authentication bypass, not code execution. The entry is rewritten with the Validator added, Cisco''s indicators and pre-upgrade evidence step, the UAT-8616 attribution, verbatim evidence, a rating,
    an ATT&CK mapping and a link to the separate CVE-2026-20245 entry. Rapid7''s Metasploit module, submitted to the public framework repository, is now named, and the flaw''s status gains poc-public.'
