- claim_id: a8ca747296
  entry: 2026-09-28/cve-2019-18935-telerik-godzilla-webshell-virtualpathprovider
  surface: headline
  kind: frontmatter
  text: AhnLab documents two attack cases still riding a Telerik deserialization bug, patched since 2020, into unpatched IIS servers
- claim_id: 1b12331e51
  entry: 2026-09-28/cve-2019-18935-telerik-godzilla-webshell-virtualpathprovider
  surface: body
  kind: cited
  text: AhnLab's ASEC documents two separate attack cases in Korea that both exploit CVE-2019-18935, a .NET deserialization vulnerability in the RadAsyncUpload file-upload feature of Telerik UI for ASP.NET
    AJAX, patched by the vendor since version 2020.1.114 but still reachable on unpatched IIS deployments; successful exploitation executes code with the privileges of the `w3wp.exe` worker-process account
    (
  urls:
  - https://asec.ahnlab.com/en/95561/
- claim_id: 356a07bb12
  entry: 2026-09-28/cve-2019-18935-telerik-godzilla-webshell-virtualpathprovider
  surface: body
  kind: cited
  text: 'The intrusion culminated in a memory-resident, file-less web shell: a payload DLL locates the IIS worker thread that has already loaded `Telerik.Web.UI`, loads an embedded module into that process''s
    memory, and registers a malicious request handler directly with ASP.NET''s VirtualPathProvider extensibility point, so the web shell runs entirely in server memory with no `.aspx` file ever written
    to disk ('
  urls:
  - https://asec.ahnlab.com/en/95561/
- claim_id: d5d3a4d8ee
  entry: 2026-09-28/cve-2019-18935-telerik-godzilla-webshell-virtualpathprovider
  surface: body
  kind: cited
  text: 'The second case used the same CVE purely to launch a Rust-based reconnaissance scanner: it pulls a target list from an operator-controlled server, asynchronously probes each target across candidate
    URL paths for exposed WordPress installer/configuration pages, and reports any hit back to the operator over the Telegram Bot API, without dropping a reverse shell or web shell on the compromised Telerik
    host itself ('
  urls:
  - https://asec.ahnlab.com/en/95561/
- claim_id: 002abbe335
  entry: 2026-09-28/cve-2019-18935-telerik-godzilla-webshell-virtualpathprovider
  surface: body
  kind: cited
  text: On 2020.1.114 and later the attack is not possible through RadAsyncUpload unless the attacker has the deployment's encryption keys, and Telerik still recommends its RadAsyncUpload security settings
    (
  urls:
  - https://www.telerik.com/products/aspnet-ajax/documentation/knowledge-base/common-allows-javascriptserializer-deserialization
- claim_id: ce571355ef
  entry: 2026-09-28/cve-2019-18935-telerik-godzilla-webshell-virtualpathprovider
  surface: body
  kind: cited
  text: ASEC says the installed shell tells its actions apart by the request's `Type` header, so a request carrying that header to a Telerik endpoint is worth checking (
  urls:
  - https://asec.ahnlab.com/en/95561/
- claim_id: 8e7f77e639
  entry: 2026-09-28/cve-2019-18935-telerik-godzilla-webshell-virtualpathprovider
  surface: body
  kind: cited
  text: '**Defender takeaway:** patch to 2020.1.114 or later now and apply Telerik''s recommended RadAsyncUpload security settings, since leaked or known encryption keys reopen the path on patched versions
    ('
  urls:
  - https://www.telerik.com/products/aspnet-ajax/documentation/knowledge-base/common-allows-javascriptserializer-deserialization
- claim_id: 5be71a8459
  entry: 2026-09-28/cve-2019-18935-telerik-godzilla-webshell-virtualpathprovider
  surface: body
  kind: uncited
  text: In the first case, the attacker used the flaw to launch a reverse shell, ran basic reconnaissance, and deployed modified Potato-family token-impersonation tools, including a web-shell-adapted build
    of SweetPotato, to escalate to SYSTEM.
- claim_id: 567e6bcab4
  entry: 2026-09-28/cve-2019-18935-telerik-godzilla-webshell-virtualpathprovider
  surface: body
  kind: uncited
  text: 'The installed shell follows the Godzilla web-shell protocol: it distinguishes actions via an HTTP request''s `Type` header, decrypts the request body, caches an attacker-supplied .NET payload in
    a cookie-bound session on first contact, and re-invokes that cached payload on each later request: an arbitrary, extensible in-memory .NET execution primitive that leaves minimal on-disk forensic trace.'
- claim_id: d94cfa04f2
  entry: 2026-09-28/cve-2019-18935-telerik-godzilla-webshell-virtualpathprovider
  surface: body
  kind: uncited
  text: 'ASEC notes this CVE has a long exploitation history: Blue Mockingbird''s 2020 Monero-mining campaign, and a 2023 CISA/FBI/MS-ISAC advisory covering US federal-agency IIS servers, underscoring that
    a legacy, patched-since-2020 vulnerability in a still-deployed enterprise .NET web component remains a live, low-cost initial-access vector years after its fix shipped.'
- claim_id: 12face98da
  entry: 2026-09-28/cve-2019-18935-telerik-godzilla-webshell-virtualpathprovider
  surface: body
  kind: derived
  text: '**Exposure:** Telerik UI for ASP.NET AJAX before 2020.1.114 with the RadAsyncUpload handler reachable.'
- claim_id: c28850bfd3
  entry: 2026-09-28/cve-2019-18935-telerik-godzilla-webshell-virtualpathprovider
  surface: body
  kind: uncited
  text: '**Detection and hunting.** In process-creation telemetry, alert on `w3wp.exe` spawning `cmd.exe` or PowerShell with no corresponding legitimate application feature to explain it; the VirtualPathProvider
    registration technique means no new `.aspx` file appears on disk, so file-integrity monitoring over the web root will miss this shell entirely; in-memory module-loading detection (unusual modules loaded
    into the IIS worker process, or EDR visibility into .NET AppDomain assembly loads) is the telemetry class that catches it.'
- claim_id: 4a754653ed
  entry: 2026-09-28/cve-2019-18935-telerik-godzilla-webshell-virtualpathprovider
  surface: body
  kind: uncited
  text: For the second case, look for outbound connections from an IIS host to `api.telegram.org`, a pattern with no legitimate counterpart on a production Telerik/IIS server.
- claim_id: e15bd8513e
  entry: 2026-09-28/cve-2019-18935-telerik-godzilla-webshell-virtualpathprovider
  surface: body
  kind: derived
  text: '**Triage:** SweetPotato and other Potato-family tools are dual-use privilege-escalation utilities also used in authorized red-team engagements, so the discriminator is context: their invocation
    from a web-shell process rather than an interactive administrative session, and their appearance immediately following exploitation of an unpatched RadAsyncUpload endpoint rather than a scheduled maintenance
    task.'
