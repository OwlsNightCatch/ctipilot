  text: CVE-2026-20253 (CVSS 9.8) lets an unauthenticated user create or truncate files through the PostgreSQL sidecar in Splunk Enterprise 10.0.x and 10.2.x, which watchTowr chained to code execution.
    Splunk fixed it in 10.0.7, 10.2.4 and 10.4.0 on 2026-06-10 and later confirmed limited exploitation; CISA added it to its KEV catalog on 2026-06-18. The sidecar is enabled by default on AWS deployments.
