  kind: frontmatter
  text: Cisco's cisco-sa-n9k-s1-rce-EH8dEtr (2026-09-02) fixes CVE-2026-20212 (CVSS 9.8), a flaw reachable because TCP ports 43210/43211 used by the Silicon One Hardware Abstraction Layer (S1HAL) process
