  entry: 2026-08-04/liechtenstein-vwbp-beneficial-ownership-register-breach
  surface: body
  kind: uncited
  text: 'The Verzeichnis wirtschaftlich berechtigter Personen (VwbP, "register of beneficial owners") exists because Liechtenstein implemented the EU''s 5th Anti-Money-Laundering Directive: the VwbPG has
    been in force since 2021, and the register records the natural persons behind Rechtsträger — companies, foundations and trust arrangements.'
