  entry: 2026-09-28/cve-2019-18935-telerik-godzilla-webshell-virtualpathprovider
  surface: body
  kind: derived
  text: A vulnerability whose patch has existed for six years is not lower priority than a fresh disclosure when active exploitation is confirmed; the normal patch cadence has already had years to close
    this gap on any server still running it.
