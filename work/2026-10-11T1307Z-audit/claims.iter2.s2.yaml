- claim_id: 0725213c81
  entry: 2026-05-13/cve-2026-41089-cve-2026-41096-cve-2026-41103-cve-2026-42898
  surface: summary
  kind: frontmatter
  text: Microsoft's May 2026 updates fixed CVE-2026-41089, an unauthenticated stack overflow in Windows Netlogon that yields SYSTEM on domain controllers (CVSS 9.8), along with a DNS Client heap overflow
    (CVE-2026-41096), an SSO plugin privilege escalation (CVE-2026-41103) and a Dynamics 365 code injection (CVE-2026-42898). Belgium's CCB reported CVE-2026-41089 exploited on 2026-05-29; Microsoft says
    it has no evidence.
