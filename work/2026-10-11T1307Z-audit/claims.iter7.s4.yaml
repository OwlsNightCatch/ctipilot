  entry: 2026-10-07/gentlemen-affiliate-azazel-ci-cd-secrets-mcp-attacks
  surface: summary
  kind: frontmatter
  text: CloudSEK analysed two exposed servers of "Azazel", a Russian-speaking affiliate of the Gentlemen ransomware group who also ran his own leak site, and reports about 6 TB of stolen data from some
    two dozen organisations, among them government-adjacent infrastructure. It says every victim outside one AI-platform intrusion was reached through stolen CI/CD secrets, mainly GitLab variable stores
    and git history, and that the deeper intrusion into an AI platform chained server-side request forgery, a recovered master key that decrypted the configuration and a token recovered from git history,
    and that Azazel drove attack commands through an MCP server on a local port. The report is a single source and names no victim.
