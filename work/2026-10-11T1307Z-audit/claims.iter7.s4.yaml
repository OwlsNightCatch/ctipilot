  entry: 2026-09-10/sap-september-2026-overpass-s4get-preauth-rce
  surface: body
  kind: cited
  text: 'S4GET is a distinct logic flaw in the SAP NetWeaver Message Server (kernel lines 9.16-9.20, native to S/4HANA and S/4HANA Cloud Private Edition) reachable through the same public port every SAP
    GUI client connects to: a crafted packet gets an arbitrary IP address accepted as a trusted internal node, and the Message Server propagates that false trust across the cluster so the Gateway admits
    the attacker as internal and the attacker can invoke RFC-callable programs to reach code execution as `<sid>adm` on every application server: "exploitation requires no credentials, no certificate, and
    no pre-existing misconfiguration" ('
  urls:
  - https://onapsis.com/blog/s4get-cve-2026-58240-sap-message-server-threat-advisory/
- claim_id: 7a4ef66c66
  entry: 2026-09-10/sap-september-2026-overpass-s4get-preauth-rce
  surface: body
  kind: cited
  text: '**Exposure:** OVERPASS (CVE-2026-44756) affects a wide set of kernel lines, KERNEL 7.22 through 9.20 including 7.53 and 8.04, plus Web Dispatcher 9.16 to 9.20 ('
  urls:
  - https://cert.europa.eu/publications/security-advisories/2026-011/
- claim_id: c579f5f4cc
  entry: 2026-09-10/sap-september-2026-overpass-s4get-preauth-rce
  surface: body
  kind: cited
  text: 'OVERPASS is a memory-corruption flaw in the SAP kernel''s processing of the Extended Passport, a tracing structure attached to requests and parsed before session authentication; because the handling
    code is shared, the flaw is reachable via three independent unauthenticated routes: the Internet Communication Manager/Web Dispatcher (HTTP/HTTPS, Fiori/WebGUI/APIs), the SAP Dispatcher (the SAP GUI
    logon protocol), and RFC connections between systems, each with a single crafted request corrupting memory to reach arbitrary OS command execution as the account that owns the SAP installation ('
  urls:
  - https://onapsis.com/blog/sap-overpass-remediation/
  - https://cert.europa.eu/publications/security-advisories/2026-011/
- claim_id: e4ac5bcf6a
  entry: 2026-09-10/sap-september-2026-overpass-s4get-preauth-rce
  surface: body
  kind: derived
  text: '**Defender takeaway:** patch now rather than relying on network segmentation — both flaws are reachable through ports every normal SAP GUI/RFC deployment already exposes internally, so a "not internet-facing"
    argument does not close OVERPASS''s Dispatcher/RFC routes or S4GET''s Message Server port.'
