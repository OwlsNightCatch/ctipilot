# ===== D2-a Microsoft Semantic Kernel CVE-2026-26030 / CVE-2026-25592 =====
- entry: entries/2026-05-10/microsoft-semantic-kernel-cve-2026-26030-cve-2026-25592-prom.md
  group: D2-a
  role: survivor
  verdict: factual-error
  defects:
    - code: F4
      where: "body, CVE-2026-25592 section ¶1"
      claim: "Combined, the LLM can therefore (a) call `UploadFileAsync` to write attacker-chosen bytes to an attacker-chosen path *on the host running the agent process*, escaping the Container Apps Python session entirely; and (b) call `DownloadFileAsync` symmetrically to read host-side files back into the agent context."
      ground_truth: "Inverted. Microsoft: 'DownloadFileAsync was accidentally marked with a [KernelFunction] attribute ... the localFilePath parameter, which dictates exactly where File.WriteAllBytes() saves data on the host device, was now entirely AI controlled' (the arbitrary file WRITE is DownloadFileAsync: sandbox -> host). UploadFile is the read side: 'A similar vulnerability existed in reverse for the upload_file() function across both the Python and .NET SDKs. It accepted any local file path without validation, allowing prompt injections to exfiltrate sensitive host files, like SSH keys or credentials, directly into the sandbox'. GHSA-2ww3-72rp-wpp4 workaround covers both DownloadFileAsync and UploadFileAsync localFilePath."
      ground_truth_url: "https://www.microsoft.com/en-us/security/blog/2026/05/07/prompts-become-shells-rce-vulnerabilities-ai-agent-frameworks/"
      fix: "DownloadFileAsync = arbitrary host file write (attack chain: ExecuteCode creates script in the Container Apps sandbox, DownloadFileAsync drops it in the host Windows Startup folder, runs at next user sign-in); UploadFile(Async)/upload_file = arbitrary host file read/exfiltration into the sandbox, in both Python and .NET SDKs."
    - code: F4
      where: "body, CVE-2026-26030 section ¶1-2 (and brief-item twin)"
      claim: "composes its LINQ-like filter expression by f-string interpolation ... The SDK applies a string-blocklist validator to reject obvious dangerous tokens (e.g. `eval`, `exec`, `os.system`), but the validator is a denylist on the *literal text*, not a sandboxed evaluation ... walking `object`'s subclass list to reach an arbitrary class ... (typically `subprocess.Popen` or a `os` reference reached via reflection)"
      ground_truth: "Microsoft: the default filter 'is implemented as a Python lambda expression executed using eval()'; kwargs[param.name] is AI-model-controlled and not sanitized (string interpolation into a lambda template). The validator 'parses the filter string into an Abstract Syntax Tree (AST)', allows only lambda expressions, scans every AST element for dangerous identifiers/attributes (eval, exec, open, __import__), then runs under eval with emptied __builtins__. The bypass 'traversed Python's class hierarchy to locate BuiltinImporter, and used it to dynamically load os and call system()' (payload started from tuple(); the blocklist missed __name__, load_module, system, BuiltinImporter; no ast.Subscript check). No f-string, no subprocess.Popen, no '__bases__[0].__subclasses__()' literal appears in the post. GHSA-xjw9: only 'RCE ... within the InMemoryVectorStore filter functionality'."
      ground_truth_url: "https://www.microsoft.com/en-us/security/blog/2026/05/07/prompts-become-shells-rce-vulnerabilities-ai-agent-frameworks/"
      fix: "Describe: eval() sink on an AI-model-controlled value interpolated into a lambda filter; AST-based blocklist bypassed via class-hierarchy traversal to BuiltinImporter.load_module('os').system(), exploiting the unchecked names and missing ast.Subscript handling. Drop the f-string / literal-text-denylist / subprocess.Popen wording and the code block."
    - code: F4
      where: "body, Exploitation prerequisites"
      claim: "use the in-memory vector store backing for a Search Plugin or analogous component (default for self-hosted Semantic Kernel agents until a customer wires in a different vector backend)"
      ground_truth: "Microsoft: vulnerable only if the agent 'uses the In-Memory Vector Store and relies on its filter functionality (when acting as the backend for the Search Plugin using default configurations)' on Python semantic-kernel < 1.39.4. GHSA-xjw9-4gw8-4rqx workaround: 'Avoid using InMemoryVectorStore for production scenarios.' Neither says the in-memory store is the default for self-hosted agents."
      ground_truth_url: "https://github.com/microsoft/semantic-kernel/security/advisories/GHSA-xjw9-4gw8-4rqx"
      fix: "Drop the parenthetical; state the three conditions from the Microsoft post (Python package, < 1.39.4, In-Memory Vector Store filter behind the Search Plugin) and the GHSA workaround (do not use InMemoryVectorStore in production)."
    - code: F3
      where: "body, Hardening ¶2"
      claim: "implement a Function Invocation Filter (the SDK-supported hook documented in the Microsoft research post) to allowlist the methods and parameters that may be called. This neutralises the unintended-`[KernelFunction]` exposure on the .NET side and reduces the Python-side blast radius even if the validator is bypassed."
      ground_truth: "The Microsoft post never mentions a Function Invocation Filter. It appears only in GHSA-2ww3-72rp-wpp4 (.NET, CVE-2026-25592): 'create a Function Invocation Filter which checks the arguments being passed to any calls to DownloadFileAsync or UploadFileAsync and ensures the provided localFilePath is allow listed.' Nothing in any cited source applies it to the Python filter flaw."
      ground_truth_url: "https://github.com/microsoft/semantic-kernel/security/advisories/GHSA-2ww3-72rp-wpp4"
      fix: "Attribute the filter workaround to GHSA-2ww3 and scope it to localFilePath allow-listing for DownloadFileAsync/UploadFileAsync; delete the Python-side blast-radius claim; for CVE-2026-26030 cite the GHSA workaround (avoid InMemoryVectorStore in production). Also unsupported: 'The patched releases also include the upstream test additions covering the bypass patterns' (the post describes four layers of fix, no tests)."
    - code: F4
      where: "body, Why this matters ¶1"
      claim: "Semantic Kernel is the open-source orchestration SDK behind Azure AI Foundry, Copilot Studio, and a growing fraction of self-hosted enterprise AI agents in EU government modernisation pilots."
      ground_truth: "Microsoft post: 'Semantic Kernel is Microsoft's open-source framework for building AI agents and integrating AI models into applications. With over 27,000 stars on GitHub ...'. Azure AI Foundry, Copilot Studio and EU government pilots appear in none of the cited sources."
      ground_truth_url: "https://www.microsoft.com/en-us/security/blog/2026/05/07/prompts-become-shells-rce-vulnerabilities-ai-agent-frameworks/"
      fix: "Remove the product and EU-government-pilot attributions (or cite them); keep 'Microsoft's open-source AI-agent framework'."
    - code: F4
      where: "body, 'Why this is a class' ¶2 and 'Detection concepts' bullet 2"
      claim: "The same class of bug is highly likely to exist in **LangChain**, **CrewAI**, **AutoGen**, **Haystack**, **LlamaIndex** ... EDR vendors classify this under hunt-pack categories such as 'interpreter spawning shell' and 'agent framework lateral move'."
      ground_truth: "Microsoft names only 'Semantic Kernel, LangChain, and CrewAI' as example frameworks and announces a follow-up post on 'similar vulnerabilities that we found in other widely used third-party agent frameworks' (unnamed). AutoGen, Haystack, LlamaIndex and the EDR hunt-pack category names are in no cited source. The post's own detection content is a pair of Defender advanced-hunting queries (DeviceProcessEvents: Semantic Kernel host processes spawning cmd/powershell/bash/certutil/curl/etc.; dotnet.exe hosting SK spawning shells) and the guidance 'anomalous behavior, such as an AI agent process suddenly spawning command lines or dropping scripts into Startup folders'."
      ground_truth_url: "https://www.microsoft.com/en-us/security/blog/2026/05/07/prompts-become-shells-rce-vulnerabilities-ai-agent-frameworks/"
      fix: "Limit the framework list to what the post says (LangChain, CrewAI named; more to follow); drop the invented EDR category names; add the Startup-folder drop and the host-process-spawns-shell hunt from the post."
    - code: F3
      where: "sources[1..2].publisher / body citation labels"
      claim: "GitHub Security Advisory GHSA-xjw9-4gw8-4rqx, 2026-05-07 / GitHub Security Advisory GHSA-2ww3-72rp-wpp4, 2026-05-07"
      ground_truth: "GHSA-xjw9-4gw8-4rqx published Feb 19, 2026 (CVE-2026-26030 record published 2026-02-19T16:00Z); GHSA-2ww3-72rp-wpp4 published Feb 6, 2026 (CVE-2026-25592 record published 2026-02-06T20:38Z). The patches (python 1.39.4 / 1.39.3, .NET 1.71.0) therefore predate the 2026-05-07 Microsoft write-up by ~3 months; the entry presents them as a 2026-05-07 disclosure."
      ground_truth_url: "https://github.com/microsoft/semantic-kernel/security/advisories/GHSA-2ww3-72rp-wpp4"
      fix: "Label the advisories with their real dates (2026-02-19, 2026-02-06) and say the CVEs/fixes were public since February; the 2026-05-07 item is Microsoft's technical write-up (event_date should stay 2026-05-07 only as the write-up date)."
    - code: F4
      where: "cves[CVE-2026-26030, CVE-2026-25592]"
      claim: "vector: user-interaction / auth: pre-auth"
      ground_truth: "Both advisories and CVE records: CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H (9.9 on the GHSA page; the CVE.org CNA record lists baseScore 10 for the same vector). Privileges Required Low, User Interaction None - the attacker needs a prompt-injection vector into the agent, not 'pre-auth' by the vector and not user-interaction."
      ground_truth_url: "https://github.com/microsoft/semantic-kernel/security/advisories/GHSA-xjw9-4gw8-4rqx"
      fix: "auth: low-priv (PR:L), vector: network / prompt-injection; keep cvss 9.9 per the GHSA page."
    - code: F8
      where: "body, CVE-2026-25592 / Detection concepts"
      claim: "Detection: File-creation events outside the expected sandbox path ..."
      ground_truth: "Source-supported observables missing: the post's attack chain drops the payload into the host's Windows 'Start Menu\\Programs\\Startup' folder via DownloadFileAsync and it runs 'on the next user sign-in'; upload_file reads SSH keys/credentials from the host (both SDKs); GHSA-2ww3 lists Python 1.39.3 as the patched pip version for CVE-2026-25592 (upload_file side). The labelled lines Exposure / Detection / Triage / Defender takeaway are absent."
      ground_truth_url: "https://www.microsoft.com/en-us/security/blog/2026/05/07/prompts-become-shells-rce-vulnerabilities-ai-agent-frameworks/"
      fix: "Add Exposure (Python semantic-kernel < 1.39.4 with In-Memory Vector Store filter; .NET Microsoft.SemanticKernel.Plugins.Core < 1.71.0 / pip < 1.39.3 for the file-I/O flaw), Detection (agent host process spawning shells; file write to Startup folder by the agent process) and Defender takeaway lines."
    - code: F16
      where: "priority (brief-item twin carries high; survivor carries notable)"
      claim: "priority: high (brief item) / notable (deep dive)"
      ground_truth: "No exploitation reported, the CVEs and fixes date from February 2026, the 'PoC' is Microsoft's educational CTF challenge. Fails the high bar (research with no in-the-wild use). notable (or routine) is correct; survivor must stay notable."
      ground_truth_url: "https://www.microsoft.com/en-us/security/blog/2026/05/07/prompts-become-shells-rce-vulnerabilities-ai-agent-frameworks/"
      fix: "priority: notable"
    - code: F17
      where: "classification"
      claim: "(no classification block in the entry)"
      ground_truth: "Profile requires classification {reliability, credibility} on every entry; legacy migrated entry carries none. Primary is Microsoft's own research post plus the vendor GHSAs and CVE.org records - consistent, so a vendor-tier reliability with credibility 2 fits."
      ground_truth_url: "https://github.com/microsoft/semantic-kernel/security/advisories/GHSA-2ww3-72rp-wpp4"
      fix: "Add classification {reliability: per sources.json tier of Microsoft Security Blog, credibility: 2}."
    - code: F11
      where: "summary / techniques"
      claim: "summary: \"Primary CVEs: CVE-2026-26030 (...) | Status: Patch available; ... no in-the-wild exploitation reported …\"; no techniques[] key; ATT&CK ids only in prose"
      ground_truth: "Summary is a truncated labelled-line dump ending in an ellipsis; frontmatter has no techniques[] although T1059.006, T1190, T1611, T1005 are named in prose (all active in the pinned dataset v19.2). T1565.001 'Stored Data Manipulation' for the Startup-folder file drop is a weak fit (the post describes host code execution on next sign-in; persistence via Startup folder is the closer mapping, T1547.001)."
      ground_truth_url: "https://www.microsoft.com/en-us/security/blog/2026/05/07/prompts-become-shells-rce-vulnerabilities-ai-agent-frameworks/"
      fix: "Rewrite summary as a sentence; move ATT&CK ids into techniques[] (T1190, T1059.006, T1611, T1005, T1547.001 if the Startup-folder chain is kept)."
  unique_material: []

