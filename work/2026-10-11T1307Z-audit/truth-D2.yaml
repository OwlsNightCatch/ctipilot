# ===== D2-k Cisco ISE CVE-2026-20181 / CVE-2026-20190 =====
- entry: entries/2026-06-19/cisco-ise-cve-2026-20181-cve-2026-20190-an-unauthenticated-c.md
  group: D2-k
  role: survivor
  verdict: factual-error
  defects:
    - code: F13
      where: "title, headline, body 'Why the chain matters more than either CVE', 'The two primitives'"
      claim: "an unauthenticated credential-harvest primitive feeding authenticated root code execution ... CVE-2026-20190 removes that barrier: it hands an unauthenticated attacker the hashed admin credentials, which can then be cracked offline (T1110.002) or ... replayed (T1550). With administrator authentication in hand (T1078), the attacker pivots to CVE-2026-20181 ... a network-reachable, no-interactive-credential path from 'can talk to the ISE management plane' to 'root on the identity controller.'"
      ground_truth: "Cisco advisory: 'The vulnerabilities are not dependent on one another. Exploitation of one of the vulnerabilities is not required to exploit the other vulnerability. In addition, a software release that is affected by one of the vulnerabilities may not be affected by the other vulnerability.' CVE-2026-20190: 'gain access to sensitive information, including hashed credentials that could be used in future attacks' (not 'administrator' credentials, nothing about cracking or replay); CVE-2026-20181 needs 'valid administrative credentials'. Neither Cisco, SecurityWeek nor CERT-Bund describes or reports a chain; the affected-release sets differ (20190: only ISE 3.4 and 3.5; 20181: 3.1 through 3.5 and earlier)."
      ground_truth_url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-ise-multi-G5WP8vv"
      fix: "Present two independent flaws; mark the credential-hash to admin-session pivot as the analyst's hypothesis (hash usability is unproven), and drop 'chain' from the title/headline. Do not call the hashes 'administrator' credentials."
    - code: F4
      where: "body 'The two primitives' and cves[]"
      claim: "reads sensitive data — explicitly including hashed administrator credentials ; cves[CVE-2026-20181] auth: pre-auth ; cves[CVE-2026-20190] type: rce"
      ground_truth: "Cisco: 'sensitive information, including hashed credentials' (no 'administrator'); CVE-2026-20181 is authenticated: CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:C/C:H/I:H/A:H, 'the attacker must have valid administrative credentials'; CVE-2026-20190 is an information disclosure (CWE-285 Improper Authorization, CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N = 7.5, SIR High), not an RCE. CVE-2026-20181 SIR Critical."
      ground_truth_url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-ise-multi-G5WP8vv"
      fix: "20181: auth admin (PR:H); 20190: type info-disclosure; remove 'explicitly ... administrator'."
    - code: F4
      where: "body 'Exposure and prerequisites' / 'Hardening'"
      claim: "Affected trains are fixed in ISE 3.3 Patch 11 and 3.4 Patch 6 (both available now). ISE 3.5 is the gap: Patch 3 closes only the unauthenticated read (CVE-2026-20190), and the full fix (Patch 4) is not scheduled until August 2026 — so 3.5 operators carry the authenticated-RCE half for roughly two months"
      ground_truth: "Cisco fixed-releases table (rev 1.2, 2026-07-06): CVE-2026-20181 first fixed: ISE 3.1 -> 3.1 Patch 12 (Sep 2026); 3.2 -> 3.2 Patch 11 (Sep 2026); 3.3 -> 3.3 Patch 11; 3.4 -> 3.4 Patch 6; 3.5 -> 3.5 Patch 4 (Aug 2026) or a hot patch for 3.5 Patch 3, 'available upon request' from TAC; earlier than 3.1: migrate. CVE-2026-20190: 3.4 Patch 6 and 3.5 Patch 3 only (3.1-3.3 not vulnerable). Rev 1.1 (2026-06-19) already 'Clarified hot patch availability'; SecurityWeek 2026-06-18: 'A hotfix for ISE version 3.5 is also available and will be included in version 3.5 Patch 4 in August.' So 3.5 operators were not left unpatched for the RCE half, and 3.1/3.2 are affected trains the entry omits."
      ground_truth_url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-ise-multi-G5WP8vv"
      fix: "State the per-train table above (3.5: request the Patch 3 hot patch via TAC; Patch 4 Aug 2026 - check whether released); add 3.1/3.2 (Patch 12 / Patch 11, Sep 2026) and 'earlier than 3.1: migrate'."
    - code: F3
      where: "body 'The two primitives' (CWE-22 attribution)"
      claim: "CVE-2026-20181 (CVSS 9.1, path traversal / CWE-22) ... ([SecurityWeek, 2026-06-18])"
      ground_truth: "SecurityWeek and the Cisco advisory say 'insufficient validation of user-supplied input'; 'path traversal'/CWE-22 appears only in the CVE.org CNA record (CWE-22), not on the cited page. 'ERS/API request patterns' and 'credential-adjacent API endpoints' in the hunt section are in no source."
      ground_truth_url: "https://www.securityweek.com/critical-command-execution-vulnerability-patched-in-cisco-ise/"
      fix: "Cite the CVE record for CWE-22 or say 'insufficient input validation'."
    - code: F4
      where: "body ¶1 and regions / sectors"
      claim: "it is the policy brain of network access control in most large Swiss and European public-sector estates ... regions: europe, switzerland; sectors: public-sector, education, finance, defense"
      ground_truth: "No cited source (Cisco, SecurityWeek, CERT-Bund WID-SEC-2026-1989) says anything about Swiss/European public-sector deployment share. CERT-Bund lists affected ISE < 3.3 Patch 11, < 3.4 Patch 6, < 3.5 Patch 4, < 3.5 Patch 3."
      ground_truth_url: "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-1989"
      fix: "Drop the prevalence claim or source it."
    - code: F8
      where: "Exposure / Detection"
      claim: "(DoS consequence and acknowledgements missing)"
      ground_truth: "Cisco: on single-node deployments successful exploitation of CVE-2026-20181 'could cause the affected ISE node to become unavailable ... endpoints that have not already authenticated would be unable to access the network until the node is restored'; affects ISE and ISE-PIC 'regardless of device configuration'; ISE-PIC is end-of-sale (3.4 is its last supported release); Cisco PSIRT 'not aware of any public announcements or malicious use'; not in CISA KEV (catalogue 2026.10.08); reporters: TrendAI Research / STAR Labs SG for 20181, TrendAI ZDI for 20190."
      ground_truth_url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-ise-multi-G5WP8vv"
      fix: "Add the single-node DoS consequence (policy-server outage for unauthenticated endpoints) and ISE-PIC scope to the Exposure line."
