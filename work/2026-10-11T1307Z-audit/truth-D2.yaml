      ground_truth: "7262 DoS (typemap precondition); 7261 UAF with unlikely controllable memory and persistence-session precondition"
      url: "https://github.com/php/php-src/security/advisories/GHSA-hmxp-6pc4-f3vv"
    - claim: "Z_TRY_ADDREF_P / zend_objects_store_add_ref; vtable overwrite; companion bugs 'cover the whole apache-map handling surface'; SoapServer need not be instantiated; T1505.003 'observed in prior PHP RCE incidents'; 'sidecar runtime directory'-style specifics"
      ground_truth: "Not in the advisory; 7261 is not an Apache-map bug"
      url: "https://github.com/php/php-src/security/advisories/GHSA-85c2-q967-79q5"
    - claim: "(twin) no public proof-of-concept; NVD CVSS 9.5; all 8.x branches patched; 'PD-11', '§ 5'"
