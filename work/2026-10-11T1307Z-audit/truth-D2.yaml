# ===== D2-b PHP SOAP CVE-2026-6722 (+7261, 7262) =====
- entry: entries/2026-05-11/cve-2026-6722-php-soap-use-after-free-in-soap-global-ref-map.md
  group: D2-b
  role: survivor
  verdict: factual-error
  defects:
    - code: F4
      where: "cves[CVE-2026-7261], cves[CVE-2026-7262]"
      claim: "type: rce / vector: zero-click / auth: pre-auth (both companion CVEs); body: 'CVE-2026-7262 reaches NULL deref rather than UAF'"
      ground_truth: "GHSA-hmxp-6pc4-f3vv (CVE-2026-7262): NULL pointer dereference, 'the process will segfault ... DoS becomes trivial', reachable only 'when the SOAP server has a typemap configured'; CVSS 4.0 VA:L only. GHSA-m33r-qmcv-p97q (CVE-2026-7261): UAF only with SOAP_PERSISTENCE_SESSION when a header handler 'returned false or threw an exception'; 'it's unlikely that the attacker will be able to control the freed memory segment'; impact VC:L/VI:L/VA:L. Neither is an RCE."
      ground_truth_url: "https://github.com/php/php-src/security/advisories/GHSA-hmxp-6pc4-f3vv"
      fix: "CVE-2026-7262: type dos, precondition typemap configured. CVE-2026-7261: memory-corruption UAF, precondition SOAP_PERSISTENCE_SESSION + failing header handler, controlled overwrite 'unlikely'. Neither pre-auth-RCE."
    - code: F4
      where: "cves[CVE-2026-7262].cvss / body ¶2"
      claim: "CVE-2026-7262 ... CVSS 4.0 6.3 Moderate"
      ground_truth: "GHSA-hmxp page shows 'Moderate 6.3' for vector CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:N/VI:N/VA:L/SC:N/SI:N/SA:N; the CVE.org CNA record for CVE-2026-7262 carries the same vector with E:P and baseScore 2.9; Red Hat ADP scores it CVSS 3.1 7.5 (A:H). CVE-2026-7261: GHSA 6.3, CVE record 6.3. CVE-2026-6722: GHSA gives only the label 'High' (no numeric score); the CNA CVE record carries CVSS 4.0 9.5 (AV:N/AC:H/AT:P, all impacts High incl. subsequent system, U:Red) and Red Hat ADP CVSS 3.1 7.7."
      ground_truth_url: "https://cveawg.mitre.org/api/cve/CVE-2026-7262"
      fix: "State scores with their owner: 6722 = 9.5 (CVE-record CNA CVSS 4.0, AC:H); GHSA label High. 7262 = GHSA 6.3 / CVE record 2.9."
    - code: F4
      where: "body, Vulnerability class and primitive"
      claim: "no additional reference (no `Z_TRY_ADDREF_P` / `zend_objects_store_add_ref`) ... the overwrite path frees the original PHP object via `zval_ptr_dtor` ... attacker-controlled overwrite of the freed object's vtable / properties"
      ground_truth: "GHSA-85c2: 'Crucially, the reference count of the PHP object is not increased' in soap_add_xml_ref(); the Apache map overwrites an existing temporary-map entry with NULL for an <item> with an empty <value>, 'releasing the Stale object only strongly referenced by the temporary map'; 'The attacker has high control over this memory segment by subsequently allocating plain strings, leading to Remote Code Execution.' Fix: 'increase the reference count before adding objects to SOAP_GLOBAL(ref_map), and configure a ZVAL_PTR_DTOR deallocator'. The macro names and the vtable claim are not in the advisory."
      ground_truth_url: "https://github.com/php/php-src/security/advisories/GHSA-85c2-q967-79q5"
      fix: "Use the advisory's mechanism only: refcount not incremented in soap_add_xml_ref(); Apache-map duplicate-key overwrite (second item with empty value) frees the object while ref_map keeps a stale pointer; a later href='#id' reuses it; heap reuse via string allocation gives control."
    - code: F4
      where: "body, Vulnerability class ¶2 and Exploitation prerequisites ¶1"
      claim: "suggesting the upstream review pass that produced GHSA-85c2-q967-79q5 covered the whole apache-map handling surface ... The PHP application's own code does not have to call `SoapServer` explicitly for the bug to trigger"
      ground_truth: "CVE-2026-7261 is a SOAP_PERSISTENCE_SESSION header-fault UAF, not Apache-map handling; the changelog lists three separate GHSAs with separate commits. The advisory's trigger is a SoapServer (setClass + handle) processing the envelope; no cited source says the application need not instantiate SoapServer."
      ground_truth_url: "https://github.com/php/php-src/security/advisories/GHSA-m33r-qmcv-p97q"
      fix: "Delete both statements; keep 'a PHP application running SoapServer::handle() on attacker-reachable input'."
    - code: F4
      where: "body, Exploitation prerequisites / summary of twin"
      claim: "(twin) No public proof-of-concept and no in-the-wild exploitation are reported ... No public proof-of-concept has been released"
      ground_truth: "GHSA-85c2-q967-79q5 itself embeds a runnable PHP reproduction (Handler class, apache:Map envelope with duplicate 'somekey', SoapServer->handle, var_dump($result)) that demonstrates the stale pointer; GHSA-m33r and GHSA-hmxp likewise embed reproducers. A trigger exists in the public advisory (not a weaponised RCE exploit). No exploitation claim is made anywhere; KEV does not list the CVE."
      ground_truth_url: "https://github.com/php/php-src/security/advisories/GHSA-85c2-q967-79q5"
      fix: "Say: advisory includes a reproducer for the stale-pointer read; no weaponised exploit or in-the-wild use reported; not in CISA KEV (catalogue 2026.10.08)."
    - code: F4
      where: "body, MITRE ATT&CK / Hardening"
      claim: "T1505.003 Web Shell — likely follow-on persistence path observed in prior PHP RCE incidents."
      ground_truth: "No cited source mentions follow-on web shells or prior PHP RCE incidents. Affected-version text elsewhere in the twin says 'PHP 8.2.0 through 8.5.5'; the advisory/CVE record say affected is < 8.2.31 / < 8.3.31 / < 8.4.21 / < 8.5.6 (8.2.* - 8.5.* ranges); no source speaks to 8.0/8.1 (EOL)."
      ground_truth_url: "https://cveawg.mitre.org/api/cve/CVE-2026-6722"
      fix: "Remove the unsourced 'observed in prior PHP RCE incidents' claim; phrase affected versions as '< 8.2.31, < 8.3.31, < 8.4.21, < 8.5.6'."
    - code: F8
      where: "labelled lines / summary"
      claim: "summary: \"#### Vulnerability class and primitive\" (a heading used as summary); event_date: null; no Exposure/Detection/Defender takeaway labelled lines; no techniques[] key"
      ground_truth: "Sources support an Exposure line (ext-soap in PHP 8.2-8.5 < 8.2.31/8.3.31/8.4.21/8.5.6; only apps running SoapServer; 7262 needs typemap; 7261 needs SOAP_PERSISTENCE_SESSION) and event_date 2026-05-07 (GHSAs, releases)."
      ground_truth_url: "https://github.com/php/php-src/security/advisories/GHSA-85c2-q967-79q5"
      fix: "Set event_date 2026-05-07, write a real summary, add labelled lines and techniques[] (T1190 active; T1059.004 active)."
    - code: F17
      where: "classification"
      claim: "(no classification block)"
      ground_truth: "Required on every entry; legacy migrated entry carries none. PHP project GHSA primary (vendor/project tier) with release changelog corroboration."
      ground_truth_url: "https://github.com/php/php-src/security/advisories/GHSA-85c2-q967-79q5"
      fix: "Add classification {reliability per sources.json tier, credibility 2}."
  unique_material: []

