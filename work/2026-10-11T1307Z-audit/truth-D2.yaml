# ===== D2-f Cisco Unified CM CVE-2026-20230 =====
- entry: entries/2026-06-24/cve-2026-20230-cisco-unified-cm-webdialer-ssrf-to-arbitrary.md
  group: D2-f
  role: survivor
  verdict: factual-error
  defects:
    - code: F4
      where: "body, 'Not KEV-listed as of this run.' / summary / status"
      claim: "Not KEV-listed as of this run."
      ground_truth: "CISA KEV (catalogVersion 2026.10.08) lists CVE-2026-20230 'Cisco Unified Communications Manager Server-Side Request Forgery (SSRF) Vulnerability', dateAdded 2026-06-25, CWE-918, knownRansomwareCampaignUse Unknown. Cisco advisory revision 1.1 (2026-JUL-01): 'In June 2026, the Cisco PSIRT became aware of active exploitation of this vulnerability' - vendor-confirmed, which the entry (Defused via BleepingComputer only) does not carry."
      ground_truth_url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-cucm-ssrf-cXPnHcW"
      fix: "Via a changelog update: KEV-listed 2026-06-25; Cisco confirmed active exploitation (advisory rev 1.1, 2026-07-01). Remove 'Not KEV-listed' from the main text."
    - code: F11
      where: "body ¶1 (marker file)"
      claim: "writing a marker file (`/tmp/cve-2026-20230-test.txt`)"
      ground_truth: "File-path/name indicator (policy: no file-name IOCs). BleepingComputer: the PoC 'appears designed to identify vulnerable devices by attempting to write a text file named ...'."
      ground_truth_url: "https://www.bleepingcomputer.com/news/security/cisco-unified-cm-sme-flaw-cve-2026-20230-now-exploited-in-attacks/"
      fix: "Say 'a benign marker-file write (reconnaissance)' without the path."
    - code: F4
      where: "body ¶1"
      claim: "Defused observed exploitation over the weekend of ~2026-06-21/22 from a single source IP ... a vulnerability-fingerprinting pattern that historically precedes a targeted exploitation wave."
      ground_truth: "BleepingComputer (2026-06-23, a Tuesday): 'Over the weekend we observed exploitation ...' (Defused), 'originating from a single IP address', 'the current exploitation appears to be reconnaissance in nature, now that the flaw has been fully disclosed, we will likely see more threat actors target these servers'. The weekend is 2026-06-20/21; 'historically precedes a targeted exploitation wave' is in no cited source."
      ground_truth_url: "https://www.bleepingcomputer.com/news/security/cisco-unified-cm-sme-flaw-cve-2026-20230-now-exploited-in-attacks/"
      fix: "'weekend of 2026-06-20/21 (per Defused)'; replace the historical claim with BleepingComputer's expectation that more actors will follow now that SSD Secure published a write-up and PoC (2026-06-23)."
    - code: F8
      where: "labelled lines / Detection"
      claim: "hunt WebDialer access logs for `file://` URIs and unexpected file-creation events (Sysmon EID 11 / `auditd`) outside normal WebDialer paths"
      ground_truth: "Unified CM is a Cisco-hardened Linux appliance; Sysmon (Windows) does not apply. Sourced observables: Cisco: exploit needs WebDialer enabled (check: Unified CM Administration > Cisco Unified Serviceability > Tools > Control Center - Feature Services > CTI Services > Cisco WebDialer Web Service = Started); mitigation = disable it under Service Activation. SSD Secure (2026-06-23): unauthenticated /webdialer/Version.jws?wsdl discloses the true hostname, then GET /cmplatform/installClusterStatusExecute?action=clusterNodeInstallStatus with a path-escaped hostname parameter creates files; affected build named: 15.0.1.13901-2."
      ground_truth_url: "https://ssd-disclosure.com/cisco-unified-communications-manager-arbitrary-file-write-to-rce/"
      fix: "Add Exposure (WebDialer Started; releases 14 < 14SU6, 15 < 15SU5 or COP) and a Detection line on web-access logs for requests to the cmplatform installClusterStatusExecute and webdialer endpoints with path-like or file:// values; drop Sysmon."
    - code: F18
      where: "actions[0]"
      claim: "**Remediate Cisco Unified CM CVE-2026-20230** if WebDialer is enabled on an internet-facing instance: apply 14SU6 (Release 14) or the Release-15 COP fix, or disable the Cisco WebDialer Web Service if unused; hunt WebDialer logs for `file://` URIs and stray file-creation events (§ 2)."
      ground_truth: "Mixes a patch task with body hunting guidance (restatement) and carries a workflow section pointer '(§ 2)'; 'internet-facing' is not a Cisco condition (Cisco: WebDialer enabled). Cisco: 'no workarounds ... as a mitigation, administrators may disable the WebDialer service until a patch can be applied.'"
      ground_truth_url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-cucm-ssrf-cXPnHcW"
      fix: "One start-now task: 'Check Unified CM Control Center feature services for WebDialer Started; apply 14SU6 / the Release 15 COP or disable WebDialer until patched.' Drop the hunt clause and '(§ 2)'."
    - code: F17
      where: "classification"
      claim: "(no classification block)"
      ground_truth: "Required on every entry; legacy migrated entry carries none. Cisco PSIRT primary, vendor-confirmed exploitation, BleepingComputer/Defused/SSD corroboration."
      ground_truth_url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-cucm-ssrf-cXPnHcW"
      fix: "Add classification block."
  unique_material: []

- entry: entries/2026-06-04/cve-2026-20230-cisco-unified-communications-manager-unauthen.md
  group: D2-f
