# ===== D2-i Splunk Enterprise CVE-2026-20253 =====
- entry: entries/2026-06-14/cve-2026-20253-splunk-enterprise-unauthenticated-pre-auth-rc.md
  group: D2-i
  role: survivor
  verdict: factual-error
  defects:
    - code: F4
      where: "body, CVE Summary Table row CVE-2026-20253 vs section 2026-06-20T05:12:19Z (supersession, check 4c(h))"
      claim: "| CVE-2026-20253 | Splunk Enterprise 10.0.x / 10.2.x | 9.8 | n/a | No | PoC/analysis public; no ITW reported | 10.4.0 / 10.2.4 / 10.0.7 |"
      ground_truth: "Splunk advisory SVD-2026-0603 last updated 2026-06-18: 'In June 2026, the Splunk Product Security Incident Response Team (PSIRT) became aware of limited exploitation of this vulnerability.' CISA KEV: CVE-2026-20253 'Splunk Enterprise Missing Authentication for Critical Function Vulnerability', dateAdded 2026-06-18, dueDate 2026-06-21, knownRansomwareCampaignUse Unknown. The table (KEV No, no ITW reported) contradicts the newest section and the frontmatter (exploited, cisa-kev)."
      ground_truth_url: "https://advisory.splunk.com/advisories/SVD-2026-0603"
      fix: "Update the row to KEV Yes (2026-06-18) / exploited (limited, vendor-confirmed) or delete the stale table."
    - code: F4
      where: "section 2026-06-20T05:12:19Z; evidence[0]; record summary"
      claim: "Splunk PSIRT and NCSC-NL have confirmed that CVE-2026-20253 (CVSS 9.8) ... is now under limited targeted exploitation in the wild ... fixed in Splunk Enterprise 10.4.0 / 10.2.4 / 10.0.7, available since 2026-06-14."
      ground_truth: "Splunk: 'limited exploitation' (not 'targeted'). SecurityWeek (2026-06-19): 'Exploitation of the vulnerability was confirmed by Splunk on June 18 ... There does not appear to be any publicly available information about the attacks'; Splunk announced the patches on June 10 and the advisory carries Published 2026-06-10, so fixes were not 'available since 2026-06-14'. NCSC-NL is not named in either cited source (and a search for an NCSC-NL advisory returned none)."
      ground_truth_url: "https://www.securityweek.com/splunk-enterprise-vulnerability-exploited-in-attacks-days-after-disclosure/"
      fix: "'Splunk PSIRT confirmed limited exploitation on 2026-06-18 and CISA added it to KEV the same day; fixed releases have been available since 2026-06-10.' Drop NCSC-NL and 'targeted'; evidence[0] is the entry's own sentence (not on any cited page) and should be replaced by a verbatim Splunk sentence."
    - code: F4
      where: "section 2026-06-20T05:12:19Z last sentence and actions[1]"
      claim: "Restrict search-job submission to authorised analyst accounts and verify indexer/search-head network segmentation while patching. ... restrict search-job submission to analyst accounts, verify search-head/indexer segmentation."
      ground_truth: "No cited source offers this as a mitigation, and it would not stop the attack (the exposed endpoint is the PostgreSQL sidecar API proxied through the Splunk web tier at /en-US/splunkd/__raw/v1/postgres/, no search job involved). Splunk's documented workaround: disable the PostgreSQL sidecar via $SPLUNK_HOME/etc/system/local/server.conf '[postgres] disabled = true' and restart; do not apply it if you use Edge Processor, OpAmp or SPL2 data pipelines (disabling breaks them); core search, indexing, dashboards unaffected."
      ground_truth_url: "https://advisory.splunk.com/advisories/SVD-2026-0603"
      fix: "Replace with the Splunk workaround and its Edge Processor/OpAmp/SPL2 caveat."
    - code: F4
      where: "section 2026-06-20T05:12:19Z ¶2 / regions / sectors"
      claim: "Splunk is a standard SIEM platform inside CH/EU public-sector SOC environments ; regions: europe; sectors: public-sector, finance"
      ground_truth: "No cited source (Splunk, watchTowr, SecurityWeek) says anything about Swiss/EU public-sector or financial deployment."
      ground_truth_url: "https://www.securityweek.com/splunk-enterprise-vulnerability-exploited-in-attacks-days-after-disclosure/"
      fix: "Drop or source."
    - code: F8
      where: "main analysis (mechanism, exposure, detection live only in the twin)"
      claim: "This brief's deep dive (§ 5) covers the sidecar-proxy chain, detection and patching in detail"
      ground_truth: "The survivor carries no mechanism or exposure text. Verified material to carry (from watchTowr 2026-06-12 and THN 2026-06-13): the Splunk web tier proxies POST /en-US/splunkd/__raw/v1/postgres/recovery/backup and /restore to the loopback-only splunk-postgres Go API (127.0.0.1:5435) with any Basic-auth credentials (the username is forwarded to pg_dump/pg_restore -U); backupFile accepts path traversal; the `database` argument accepts a libpq connection string, so `hostaddr=` makes Splunk connect to an attacker database and dump it to an arbitrary file; /restore with `passfile=` pointing at Splunk's own .pgpass (user postgres_admin) and dbname=template1 replays attacker SQL (a function using lo_export) into the local PostgreSQL, giving an arbitrary file write as the splunk user; overwriting a Python script Splunk runs regularly (e.g. splunk_secure_gateway/bin/ssg_enable_modular_input.py) yields RCE. Exposure: Splunk Enterprise 10.0.0-10.0.6 and 10.2.0-10.2.3 (10.4 and 9.x not affected); Splunk Cloud not impacted; the sidecar is installed and enabled by default on Splunk Enterprise on AWS, but on Windows on-prem it is either not installed or not enabled by default (watchTowr). Detection signals: requests to the proxied postgres recovery paths with JSON bodies containing hostaddr= or passfile= or ../ in backupFile; outbound PostgreSQL (TCP/5432) connections from the Splunk host to external hosts; modification of Splunk app scripts; watchTowr's check distinguishes vulnerable (400) from patched (401) with any credentials."
      ground_truth_url: "https://labs.watchtowr.com/why-use-app-level-auth-when-every-database-has-auth-splunk-enterprise-cve-2026-20253-pre-auth-rce/"
      fix: "Carry the corrected mechanism/exposure/detection/hardening text from the twin plus the above."
    - code: F18
      where: "actions[0], actions[1]"
      claim: "'**Upgrade Splunk Enterprise to 10.4.0 / 10.2.4 / 10.0.7, AWS-hosted instances first ...' and '**Treat Splunk CVE-2026-20253 (CVSS 9.8, now CISA KEV) as emergency, not routine** ...'"
      ground_truth: "Two actions for one CVE: the second is generic urgency framing plus an unsupported mitigation (see above) and the first mixes the upgrade with network advice and a hunt restated from the body. One start-now task suffices: 'Upgrade Splunk Enterprise 10.0.x/10.2.x to 10.0.7 / 10.2.4 / 10.4.0, or set [postgres] disabled = true until upgraded (not if Edge Processor/OpAmp/SPL2 pipelines are in use).'"
      ground_truth_url: "https://advisory.splunk.com/advisories/SVD-2026-0603"
      fix: "Collapse to the single task above."
    - code: F11
      where: "body / updates[0].summary / table"
      claim: "'This brief's deep dive (§ 5)'; '(CVE-2026-10520 is carried as the § 0 Immediate Action and § 4 UPDATE ... are noted in § 7.)'; update summary '... (§ 4).'; table rows for CVE-2026-10520 (Ivanti Sentry) and CVE-2026-10795 (UpdraftPlus) that are other findings; evidence[0] 'UPDATE (originally covered 2026-06-14): ...'"
      ground_truth: "Workflow-internal section pointers, rows from unrelated brief items, and an evidence quote that is the entry's own update paragraph. Also techniques: [] and affected_products: [] on a vulnerability entry (T1190 Exploit Public-Facing Application and, for the post-write step, T1059.006 Python are supported by watchTowr)."
      ground_truth_url: "https://labs.watchtowr.com/why-use-app-level-auth-when-every-database-has-auth-splunk-enterprise-cve-2026-20253-pre-auth-rce/"
      fix: "Drop the pointers and unrelated rows; set techniques and affected_products (Splunk Enterprise)."
    - code: F17
      where: "classification"
      claim: "classification: null"
      ground_truth: "Profile requires classification on every entry; the field is null. Splunk PSIRT (vendor, primary) + watchTowr (researcher) + SecurityWeek + KEV: corroborated, exploitation vendor-confirmed."
      ground_truth_url: "https://advisory.splunk.com/advisories/SVD-2026-0603"
      fix: "Set classification (vendor-confirmed, multi-source: credibility 1-2)."
  unique_material: []

- entry: entries/2026-06-14/splunk-enterprise-cve-2026-20253-pre-auth-rce-in-the-siem-vi.md
  group: D2-i
  role: duplicate
  duplicate_of: entries/2026-06-14/cve-2026-20253-splunk-enterprise-unauthenticated-pre-auth-rc.md
  verdict: factual-error
  defects:
    - code: F4
      where: "body, last paragraph; cves[].status"
      claim: "There is no reported in-the-wild exploitation at the time of writing"
      ground_truth: "Stale: Splunk PSIRT confirmed limited exploitation on 2026-06-18 (advisory changelog) and CISA added the CVE to KEV on 2026-06-18; status poc-public/patch-available lacks exploited/cisa-kev. True on 2026-06-14, false now."
      ground_truth_url: "https://advisory.splunk.com/advisories/SVD-2026-0603"
      fix: "Fold into the survivor, which already carries the exploited state; do not carry this sentence."
    - code: F4
      where: "body, The mechanism ¶ and Hunt ¶"
      claim: "From there an attacker writes attacker-controlled files into the sidecar's runtime directory and injects SQL into a crafted backup/restore payload ... watch ... for new files appearing under the sidecar's `pkg-run` runtime path."
      ground_truth: "watchTowr: backupFile accepts path traversal, so the file is created at an arbitrary location (e.g. ../../../../../../../../../tmp/backuptest), not only the sidecar runtime directory (pkg-run/pkg-postgres<N>/ is where relative names land); the SQL is not injected into the payload - the `database` field takes a libpq connection string (hostaddr=, passfile=), making Splunk dump an attacker-controlled database to a file and restore it into the local PostgreSQL using the .pgpass credentials of postgres_admin; the restored function (lo_export) writes a Python script Splunk runs, giving RCE as the splunk user."
      ground_truth_url: "https://labs.watchtowr.com/why-use-app-level-auth-when-every-database-has-auth-splunk-enterprise-cve-2026-20253-pre-auth-rce/"
      fix: "Use the sourced chain; anchor detection on hostaddr=/passfile=/../ in the proxied request bodies, external TCP/5432 egress from the Splunk host, and changes to Splunk app scripts."
    - code: F8
      where: "Hardening and remediation"
      claim: "On on-premises installs that do not need the PostgreSQL sidecar, confirm it is disabled and stays disabled after the upgrade. Network-side, no Splunk management or web interface should be exposed to the internet"
      ground_truth: "Splunk's own workaround is missing: set '[postgres] disabled = true' in $SPLUNK_HOME/etc/system/local/server.conf and restart, except where Edge Processor, OpAmp or SPL2 data pipelines are used (disabling breaks them). Splunk Cloud is not impacted (THN, citing Splunk); Splunk Enterprise 9.4 and earlier and 10.4 are not affected."
      ground_truth_url: "https://advisory.splunk.com/advisories/SVD-2026-0603"
      fix: "Carry the workaround and exposure facts into the survivor."
    - code: F11
      where: "summary / sectors"
      claim: "summary: 'The uncomfortable angle on this one is that the vulnerable software is the tool many readers use to find intrusions.' ; sectors: public-sector, technology"
      ground_truth: "Editorial tagline used as the summary; no source ties the flaw to the public sector."
      ground_truth_url: "https://labs.watchtowr.com/why-use-app-level-auth-when-every-database-has-auth-splunk-enterprise-cve-2026-20253-pre-auth-rce/"
      fix: "Do not carry."
    - code: F4
      where: "body ¶3 (analysis)"
      claim: "Because Splunk frequently runs with high privilege and aggregates logs from across the estate, a compromised indexer or search head is both an execution foothold and a route ... an attacker who owns the SIEM can read what defenders see and potentially tamper with it."
      ground_truth: "(low confidence) analysis not in the cited sources; watchTowr shows execution 'as the splunk user' (not stated as high privilege). Acceptable as analysis if marked as such."
      ground_truth_url: "https://labs.watchtowr.com/why-use-app-level-auth-when-every-database-has-auth-splunk-enterprise-cve-2026-20253-pre-auth-rce/"
      fix: "Mark as inference or cite."
  unique_material:
    - fact: "Mechanism chain per watchTowr Labs (2026-06-12) and The Hacker News (2026-06-13) - see survivor defect 'F8 main analysis' for the verified chain; Splunk Cloud not impacted; Splunk 10.4 and 9.x not affected; AWS default-enabled vs Windows on-prem not-default."
      url: "https://thehackernews.com/2026/06/critical-splunk-enterprise-flaw-lets.html"
    - fact: "Splunk workaround: disable the PostgreSQL sidecar with '[postgres] disabled = true' in server.conf (restart); do not use if Edge Processor, OpAmp or SPL2 data pipelines run on the instance."
      url: "https://advisory.splunk.com/advisories/SVD-2026-0603"

# ===== D2-j Cisco Catalyst SD-WAN Manager CVE-2026-20262 =====
- entry: entries/2026-06-16/cisco-catalyst-sd-wan-manager-cve-2026-20262-authenticated-a.md
  group: D2-j
  role: survivor
  verdict: factual-error
  defects:
    - code: F4
      where: "body, Exploitation chain (2) and Hunt / Hardening (Tomcat)"
      claim: "abusing the upload endpoint to write a `.jsp`/`.war` artefact into the Tomcat deployment directory ... newly written files in the Tomcat webapps/deploy directories ... validate the integrity of the Tomcat deploy directory"
      ground_truth: "Cisco's indicators: vmanage-server.log (/var/log/nms) 'SdraAnyConnectFileUploadHandler ... uploaded Remote Access Anyconnect profile file: ../../../../var/lib/wildfly/standalone/deployments/suspicious.war to vManage'; vmanage-appserver.log (/var/log/nms/) 'WFLYSRV0010: Deployed \"suspicious.war\"' (WildFly DeploymentScanner); serviceproxy-access.log (/var/log/nms/containers/service-proxy/) 'POST /suspicious/index.jsp'. The application server is WildFly, not Tomcat."
      ground_truth_url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-sdwan-arbfw-c2rZvQ"
      fix: "Replace Tomcat with the WildFly standalone/deployments directory; name the three log sources and the SdraAnyConnectFileUploadHandler / WFLYSRV0010 / POST /<name>/index.jsp patterns (without the sample file name)."
    - code: F13
      where: "entities[actor:uat-8616] and Exploitation chain last sentences"
      claim: "entities: actor:uat-8616 ... Cisco Talos tracks a highly capable cluster it designates **UAT-8616** behind a 2026 wave of Cisco Catalyst SD-WAN exploitation (notably CVE-2026-20127, with software-downgrade post-compromise tradecraft)"
      ground_truth: "Talos (2026-02-25) clusters the exploitation of CVE-2026-20127 (SD-WAN Controller, formerly vSmart, authentication bypass) and its post-compromise activity as UAT-8616 (software-version downgrade, then CVE-2022-20775 for root, then restore). None of the cited pages ties CVE-2026-20262 (SD-WAN Manager, June 2026) to UAT-8616; BleepingComputer: Cisco 'did not share any details on these attacks'. BleepingComputer lists other 2026 SD-WAN exploited flaws (CVE-2026-20133, -20128, -20122, -20182, -20245) without attributing them to UAT-8616, so 'a 2026 wave' attributed to the cluster overreaches. The entity link states an attribution the sources do not make."
      ground_truth_url: "https://blog.talosintelligence.com/uat-8616-sd-wan/"
      fix: "Remove actor:uat-8616 from entities[] and the 'wave' sentence; at most say Talos separately tracks UAT-8616 for CVE-2026-20127 and no source links it to this flaw."
    - code: F4
      where: "body, Exploitation chain (1)-(3) ('Reporting describes the practical path as')"
      claim: "(1) Initial access with valid low-privilege SD-WAN Manager credentials — obtained through prior phishing, credential reuse, or chaining an earlier auth-affecting SD-WAN bug ... (3) ... because the SD-WAN Manager application services run with high privilege, the web shell yields root-equivalent control"
      ground_truth: "No cited source describes how credentials were obtained, a 3-step chain, or the privilege of the application services. Cisco: 'This file could later be used to elevate to root'; BleepingComputer: 'the company did not share any details on these attacks'; The Register: valid credentials 'with at least a lower-privileged, single-task user account'; Cisco advisory rev 1.1 (2026-JUN-15): 'the attacker must have valid credentials with at least write access'. The chain is inference presented as reporting."
      ground_truth_url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-sdwan-arbfw-c2rZvQ"
      fix: "State the sourced facts (authenticated, at least write access; crafted HTTP request to an API endpoint creates/overwrites any file; file later usable to reach root; Cisco's IOC shows a .war dropped into the WildFly deployments directory via path traversal) and label the rest as inference or delete it."
    - code: F3
      where: "body, Vulnerable component and KEV sentence"
      claim: "[NVD, CVSS 6.5](https://nvd.nist.gov/vuln/detail/CVE-2026-20262) ... CISA added CVE-2026-20262 to the Known Exploited Vulnerabilities catalog on 2026-06-15, confirming exploitation in the wild ([BleepingComputer, 2026-06-15])"
      ground_truth: "NVD per-CVE page is a hard-blocked source pattern; the score is Cisco's base 6.5 (CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:H/A:N; CWE-22 in the CVE.org record). BleepingComputer's text does not state that CISA added CVE-2026-20262 to KEV (it only says CISA tagged 91 Cisco flaws over the years); The Register (2026-06-15) does: 'CISA ... added CVE-2026-20262 to its Known Exploited Vulnerabilities catalog, citing evidence of active exploitation ... two-week deadline'. KEV catalogue (2026.10.08): dateAdded 2026-06-15, dueDate 2026-06-29, ransomware use Unknown."
      ground_truth_url: "https://www.theregister.com/patches/2026/06/15/cisco-sd-wan-make-me-root-bug-under-attack/5255916"
      fix: "Cite the Cisco advisory for the score and The Register for the KEV listing."
    - code: F8
      where: "labelled lines / detection"
      claim: "review the SD-WAN Manager appserver and service-proxy logs for HTTP uploads referencing `index.jsp`, `*.jsp` or `*.war` filenames or path-traversal sequences"
      ground_truth: "Cisco names a third and primary log, vmanage-server.log, with the SdraAnyConnectFileUploadHandler 'uploaded Remote Access Anyconnect profile file: ../../..' line as the initial-compromise indicator, notes these entries 'may occur during standard operations' and must be assessed against normal posture, and asks customers to run 'request admin-tech' on each control component before opening a TAC case. Cisco: exposure is greatest for systems exposed to the internet with ports exposed; no workarounds; finding was from internal security testing; PSIRT aware of limited exploitation in June 2026. Fixed: 20.9.9.2, 20.12.7.2, 20.15.4.5, 20.15.5.3, 20.18.3.1, 26.1.1.2 (fixed-in table: 20.9.9.1 and earlier, 20.12.7.1 and earlier, 20.15.4.4 and earlier, 20.15.5.2 and earlier, 20.18.3, 26.1.1.1 and earlier)."
      ground_truth_url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-sdwan-arbfw-c2rZvQ"
      fix: "Add the vmanage-server.log indicator, the false-positive caveat, admin-tech collection, and an Exposure line (affects On-Prem, Cloud-Pro, Cloud (Cisco-managed), FedRAMP; internet-exposed management ports)."
    - code: F11
      where: "summary / evidence[0] / techniques"
      claim: "summary: 'Vulnerable component. The flaw lives in the web UI ...'; evidence[0].quote: 'Vulnerable component.'; [T1078.004 Valid Accounts: Cloud Accounts] for on-prem SD-WAN Manager accounts"
      ground_truth: "Summary is a body paragraph lead-in; the evidence 'quote' is a heading word, not a page passage; T1078.004 (Cloud Accounts) does not fit management-plane accounts on an on-prem appliance (T1078 / T1190 / T1505.003 are the supported ones)."
      ground_truth_url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-sdwan-arbfw-c2rZvQ"
      fix: "Rewrite summary; replace the evidence quote with a verbatim Cisco sentence; fix the ATT&CK sub-technique."
    - code: F17
      where: "classification"
      claim: "(no classification block)"
      ground_truth: "Required on every entry; legacy migrated entry carries none. Cisco PSIRT (primary, vendor-confirmed exploitation), BleepingComputer, The Register, KEV."
      ground_truth_url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-sdwan-arbfw-c2rZvQ"
      fix: "Add classification block (credibility 1)."
  unique_material: []

