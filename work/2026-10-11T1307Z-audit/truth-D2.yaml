# ===== D2-h SimpleHelp CVE-2026-48558 =====
- entry: entries/2026-06-30/cve-2026-48558-simplehelp-rmm-oidc-sso-authentication-bypass.md
  group: D2-h
  role: survivor
  verdict: factual-error
  defects:
    - code: F4
      where: "body ¶1 (Observed follow-on) and immediate_action.action"
      claim: "deployment of the new cross-platform Djinn infostealer via a \"TaskWeaver\" loader persisting through scheduled tasks (`schtasks.exe`) / launchd plists ([BleepingComputer, 2026-06-29])"
      ground_truth: "Neither BleepingComputer nor Blackpoint's report mentions persistence via scheduled tasks or launchd (searched for plist, launch, schtask, cron, startup, registry, persist). Blackpoint: the operator used the RMM to drop a Node.js runtime and run `node.exe <path>\\jquery.js` fetched from a randomly generated trycloudflare.com address; TaskWeaver (obfuscated Node.js loader, rebuilds `require` at runtime, fingerprints the host, beacons over HTTPS POST encrypted with AES-256-GCM/RSA-OAEP to a lookalike of Microsoft Dev Tunnels, single 'deliver' command) then delivers Djinn Stealer, which collects cloud, developer, package-registry, AI-assistant (MCP) and crypto-wallet credentials on Windows, macOS and Linux."
      ground_truth_url: "https://blackpointcyber.com/blog/a-djinn-in-the-machine-taskweavers-node-js-intrusion-chain"
      fix: "Replace the persistence clause with the sourced chain (technician session -> RMM drops Node.js -> jquery.js from trycloudflare -> TaskWeaver -> Djinn Stealer) and cite Blackpoint."
    - code: F4
      where: "body ¶1 Hunt line"
      claim: "Hunt: Technician logins not correlated with MFA/VPN events; `SimpleHelpServer.exe`/`SimpleHelp.exe` spawning `powershell.exe`/`cmd.exe`/`wscript.exe` (Sysmon EID 1, parent-image filter)."
      ground_truth: "No cited source names these processes. Horizon3 IOCs: in the SimpleHelp admin UI (Administration > Technicians > gear icon > 'Show Group Authenticated Users') look for unfamiliar technician names/emails; in Administration > Server Logs (host: /opt/SimpleHelp/logs/server.log) look for 'Registering technician login for ...' and 'Configuration save requested (Forged Attacker - <email> [(Technicians)] [New Anon])'. Blackpoint: 'Alert when RMM software launches Node.js, PowerShell, Python, Deno, or Bun, particularly from temporary, download, remote-support, or user-writable directories'; block/monitor trycloudflare.com downloads."
      ground_truth_url: "https://horizon3.ai/attack-research/disclosures/cve-2026-48558-simplehelp-authentication-bypass-iocs/"
      fix: "Replace with Horizon3's admin-UI/server-log checks and Blackpoint's RMM-spawns-script-runtime hunt; drop the invented binary names and wscript."
    - code: F3
      where: "body ¶1 and immediate_action citation"
      claim: "The OIDC callback handler accepts an identity token without verifying its cryptographic signature (CWE-347), so an attacker can forge an arbitrary token ... ([Horizon3.ai, 2026-06-12])"
      ground_truth: "Horizon3 says the flaw is 'rooted in the way that SimpleHelp validates the IdP assertions' and 'we will not be releasing any more technical details'; it does not mention signatures, tokens or CWE-347. The signature-verification mechanism is stated in the CVE.org record (VulnCheck CNA, 2026-06-12: 'SimpleHelp Authentication Bypass via Missing OIDC JWT Signature Verification', CWE-347), CCB Belgium and Blackpoint."
      ground_truth_url: "https://cveawg.mitre.org/api/cve/CVE-2026-48558"
      fix: "Attribute the signature mechanism to the CVE record/CCB/Blackpoint; keep Horizon3 for the three configuration conditions, MFA self-registration and exposure counts."
    - code: F4
      where: "evidence[0], evidence[1]"
      claim: "evidence[0]: 'Hackers exploit critical SimpleHelp flaw to deploy new Djinn infostealer and TaskWeaver malware' (BleepingComputer); evidence[1]: 'nearly 14,000 SimpleHelp servers exposed, with roughly 7.2% configured to use the vulnerable OIDC authentication method' (Horizon3.ai)"
      ground_truth: "BleepingComputer's headline is 'Critical SimpleHelp flaw exploited to deploy new stealer malware' (the quoted string is the URL slug). Horizon3's text is two separate sentences: 'that number has increased to nearly 14,000.' and 'A random sampling of these servers indicated that roughly 7.2% of them were configured to use the vulnerable OIDC authentication method.' - the quote is a paraphrase splice."
      ground_truth_url: "https://horizon3.ai/attack-research/disclosures/cve-2026-48558-simplehelp-authentication-bypass-iocs/"
      fix: "evidence[0]: use a verbatim BC sentence ('Hackers are exploiting a recently disclosed critical vulnerability (CVE-2026-48558) in SimpleHelp to deploy Djinn Stealer, a previously undocumented cross-platform information stealer targeting Windows, macOS, and Linux.'); evidence[1]: 'A random sampling of these servers indicated that roughly 7.2% of them were configured to use the vulnerable OIDC authentication method.'"
    - code: F4
      where: "body ¶1 (exposure figures)"
      claim: "Horizon3.ai measured ~14,000 internet-exposed servers, ~7.2% (~1,000) with a vulnerable OIDC configuration."
      ground_truth: "(low confidence) Horizon3: 'nearly 14,000' exposed servers; 'a random sampling ... roughly 7.2% ... configured to use the vulnerable OIDC authentication method' (OIDC enabled, not the full three-condition vulnerable state). The '~1,000' figure is BleepingComputer's 'around 1,000 ... running a vulnerable configuration at the time of the disclosure' (extrapolation from the sample)."
      ground_truth_url: "https://www.bleepingcomputer.com/news/security/hackers-exploit-critical-simplehelp-flaw-deploy-new-djinn-infostealer-taskweaver-malware/"
      fix: "Say: ~14,000 exposed; a random sample put ~7.2% on OIDC (BleepingComputer extrapolates ~1,000 vulnerable)."
    - code: F8
      where: "labelled lines"
      claim: "(no Exposure / Defender takeaway lines; patch versions only as 'v5.5.16 / v6.0 RC2')"
      ground_truth: "SimpleHelp notice: servers running 5.5.15 and earlier (and the 6.0 prerelease before RC2) are affected; 5.5.16 and 6.0 RC2 fix it; 'Not all servers can be exploited'. Horizon3: attacker creates a new Technician user (default privileges: remote into endpoints, execute scripts), MFA bypassed because technicians self-register MFA at first login; if patching is delayed, restrict Technician authentication by IP in Administration > Login Security. Blackpoint/BleepingComputer: invalidate unrecognised technician sessions, rotate credentials and API keys. CVSS: 3.1 10.0 (AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H) and 4.0 9.5 per the VulnCheck CNA record; CCB (updated 2026-06-30) states PoC available and active exploitation. KEV dateAdded 2026-06-29, knownRansomwareCampaignUse Unknown."
      ground_truth_url: "https://simple-help.com/security/simplehelp-security-update-2026-05"
      fix: "Add Exposure (<= 5.5.15 / 6.0 pre-RC2 with OIDC provider + TechnicianGroup + 'Allow group authenticated logins'), the IP-restriction interim mitigation, and the session/credential rotation step."
    - code: F11
      where: "summary / sectors"
      claim: "summary ends 'See the Immediate Action callout below.'; sectors: technology, public-sector"
      ground_truth: "Render pointer inside the summary text; no cited source names the public sector as targeted or affected."
      ground_truth_url: "https://www.bleepingcomputer.com/news/security/hackers-exploit-critical-simplehelp-flaw-deploy-new-djinn-infostealer-taskweaver-malware/"
      fix: "Drop the pointer; drop public-sector or source it."
    - code: F17
      where: "classification"
      claim: "(no classification block)"
      ground_truth: "Required on every entry; legacy migrated entry carries none. Researcher (Horizon3) + CNA record + incident-response firm (Blackpoint) + national CERT (CCB) + KEV: well corroborated."
      ground_truth_url: "https://ccb.belgium.be/advisories/warning-simplehelp-patched-cve-2026-48558-critical-authentication-bypass-vulnerability"
      fix: "Add classification block (credibility 1-2)."
  unique_material: []

