      ground_truth: "Cisco: SSRF through an affected device, 'write files to the underlying operating system that could be used later to elevate to root'; nothing about cron/service directories. BleepingComputer/SSD: unauthenticated attacker uses file:// URIs through the Webdialer/cmplatform path to write attacker-controlled content to a chosen path."
      ground_truth_url: "https://www.bleepingcomputer.com/news/security/cisco-unified-cm-sme-flaw-cve-2026-20230-now-exploited-in-attacks/"
