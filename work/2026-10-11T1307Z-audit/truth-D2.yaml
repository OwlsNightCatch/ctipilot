      where: "summary / body ¶1"
      claim: "Wordfence has logged sustained mass exploitation from 13 April through at least 6 June, with a single-day peak of 17,900 blocked attempts on 16 May ... mass-exploitation campaign"
      ground_truth: "Wordfence: attackers started 13 April; over 29,300 attempts blocked 'since the vulnerability was publicly disclosed'; 'mass exploitation occurring on May 16th, 2026' (over 17,900 in one day). The Hacker News (2026-06-05): '16 attack attempts ... in the last 24 hours'. 'Sustained mass exploitation ... through at least 6 June' is not supported; activity had tapered to low volume by early June."
      ground_truth_url: "https://thehackernews.com/2026/06/hackers-exploit-critical-everest-forms.html"
      fix: "Say: exploitation since 13 April, a spike of 17,900 blocked attempts on 16 May, 29,300+ blocked in total, 16 attempts in the 24 hours before 2026-06-05."
    - code: F4
      where: "body ¶1-2 (exposure and prerequisite)"
      claim: "WordPress underpins a large share of cantonal, municipal and agency web estates, so any public-sector site still running Everest Forms Pro ≤ 1.9.12 is exposed ... The CVE prerequisite is narrow but common: the form must include the Calculation Addon."
      ground_truth: "Wordfence/THN: Everest Forms Pro has 'an estimated 4,000 active installations' (a commercial add-on); the flaw is reachable 'by submitting a crafted value in any string-type form field (text, email, URL, select, radio) when a form uses the Complex Calculation feature' (BleepingComputer: 'Complex Calculation feature'). Not merely having the Calculation Addon installed. No source mentions public-sector or Swiss/EU WordPress estates."
      ground_truth_url: "https://www.wordfence.com/blog/2026/06/attackers-actively-exploiting-critical-vulnerability-in-everest-forms-pro-plugin/"
      fix: "Prerequisite: a form that uses the Complex Calculation feature; exposure: ~4,000 installs, <= 1.9.12; drop the public-sector sentence or source it."
    - code: F4
      where: "body, Observed exploitation chain"
      claim: "from which attackers typically install webshells, SEO-spam injectors or redirect malware"
      ground_truth: "Wordfence: 'uploading webshells, modifying themes or plugins, or installing further backdoors'; THN: 'deploy web shells, and open other ways to burrow deeper'; BC: 'planting backdoors and webshells'. SEO-spam injectors and redirect malware are in no cited source."
      ground_truth_url: "https://www.wordfence.com/blog/2026/06/attackers-actively-exploiting-critical-vulnerability-in-everest-forms-pro-plugin/"
      fix: "Use the sourced list (webshells, theme/plugin modification, backdoors)."
    - code: F8
      where: "Detection concepts"
      claim: "alert on POSTs to the form-handling endpoints (`admin-ajax.php` and the plugin's AJAX actions) whose parameters contain PHP-syntax artefacts"
      ground_truth: "Wordfence shows the observed request: POST /wp-admin/admin-ajax.php, action=everest_forms_ajax_form_submission, everest_forms[form_fields][<id>] value starting with a single quote then a PHP statement calling username_exists()/wp_insert_user() with role administrator, ending in a // comment; the payload echoes ADMINCREATED/ADMINEXISTS. Patch history: vendor fix 1.9.13 on 2026-03-18, Wordfence public disclosure 2026-03-30 (CVE.org record 2026-03-31, CWE-94, CVSS 3.1 9.8 AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H)."
      ground_truth_url: "https://www.wordfence.com/blog/2026/06/attackers-actively-exploiting-critical-vulnerability-in-everest-forms-pro-plugin/"
      fix: "Add the AJAX action name and the parameter shape to the request-layer detection; keep the admin-account-creation hunt (already present)."
    - code: F11
      where: "summary / evidence[0] / actions[0]"
      claim: "summary: 'Why this is the deep dive now. ...'; evidence[0].quote: 'Why this is the deep dive now.'; actions[0]: '**Patch Everest Forms Pro to 1.9.13+ today if you run it** (. Unauthenticated, actively exploited at scale. ...'"
      ground_truth: "Workflow-internal tagline ('the deep dive now') used as summary and as an evidence 'quote' (not a page passage); the action text contains a stray '(.' fragment."
      ground_truth_url: "https://www.wordfence.com/blog/2026/06/attackers-actively-exploiting-critical-vulnerability-in-everest-forms-pro-plugin/"
      fix: "Rewrite the summary; replace the evidence quote with a verbatim Wordfence sentence (e.g. 'The Wordfence Firewall has blocked over 29,300 exploit attempts since the vulnerability was publicly disclosed.')."
    - code: F18
      where: "actions[0]"
      claim: "Patch Everest Forms Pro to 1.9.13+ today if you run it ... If you cannot patch immediately, disable the Calculation Addon and audit the WordPress admin-user list for rogue accounts created since mid-April before re-enabling."
      ground_truth: "A concrete patch task, but it restates the body's hardening and hunt guidance in one item and carries rationale ('Unauthenticated, actively exploited at scale'). One start-now task fits: 'Update Everest Forms Pro to 1.9.13+ and review WordPress administrator accounts created since 2026-04-13.'"
      ground_truth_url: "https://www.wordfence.com/blog/2026/06/attackers-actively-exploiting-critical-vulnerability-in-everest-forms-pro-plugin/"
      fix: "Trim to one task; drop the rationale and the malformed fragment."
    - code: F17
      where: "classification"
      claim: "(no classification block)"
      ground_truth: "Required on every entry; legacy migrated entry carries none. Wordfence (researcher/CNA, primary) with BleepingComputer and THN corroboration; exploitation observed by Wordfence telemetry (not vendor-confirmed by the plugin author)."
      ground_truth_url: "https://www.wordfence.com/blog/2026/06/attackers-actively-exploiting-critical-vulnerability-in-everest-forms-pro-plugin/"
      fix: "Add classification block (credibility 2)."
  unique_material: []

