    - code: F9
      where: "body ¶1 / tags (poc-public)"
      claim: "Cisco reports no confirmed in-the-wild exploitation at disclosure but states that proof-of-concept exploit code is publicly available"
      ground_truth: "(low confidence) BleepingComputer 2026-06-23: SSD Secure 'did not share any technical details at the time' of the 2026-06-03 disclosure and published its technical write-up with a PoC only after the exploitation report; the SSD write-up is dated 2026-06-23. The Cisco advisory as it reads today (rev 1.1, 2026-07-01) says PoC code is available and active exploitation was seen in June 2026, but the revision history shows only the exploitation text was added in 1.1, so the date of the PoC sentence cannot be confirmed from the page."
      ground_truth_url: "https://ssd-disclosure.com/cisco-unified-communications-manager-arbitrary-file-write-to-rce/"
      fix: "Survivor dates the public PoC to the SSD write-up of 2026-06-23."
    - code: F4
      where: "regions / sectors"
      claim: "regions: europe, switzerland; sectors: public-sector, healthcare, telco"
      ground_truth: "The Cisco advisory names no region or sector."
      ground_truth_url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-cucm-ssrf-cXPnHcW"
      fix: "Drop or source."
    - code: F11
      where: "verification / sourcing_note"
      claim: "verification: single-source; sourcing_note: null"
      ground_truth: "Single vendor PSIRT source with no sourcing_note; the folded survivor has a second source (BleepingComputer) plus SSD Secure write-up."
      ground_truth_url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-cucm-ssrf-cXPnHcW"
      fix: "Moot after fold."
  unique_material:
    - fact: "Cisco rates the advisory Critical (SIR) rather than High because exploitation could elevate to root; CVSS 3.1 8.6 (AV:N/AC:L/PR:N/UI:N/S:C/C:N/I:H/A:N); affected Unified CM and Unified CM SME with WebDialer enabled (disabled by default); fixed 14SU6 (Release 14) and 15SU5 (Sep 2026) or a COP for Release 15; no workaround, mitigation is disabling WebDialer; reporter an independent researcher working with SSD Secure Disclosure; advisory first published 2026-06-03."
      url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-cucm-ssrf-cXPnHcW"

