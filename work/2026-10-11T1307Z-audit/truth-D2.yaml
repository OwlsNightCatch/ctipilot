        fixed: "SimpleHelp 5.5.16 and 6.0 RC2 (Security Notice 2026-05; released between 2026-05-22 and 2026-06-09 per Horizon3's timeline)"
        fixed_source_url: "https://simple-help.com/security/simplehelp-security-update-2026-05"
        exploited: true
        exploited_source_url: "https://www.bleepingcomputer.com/news/security/hackers-exploit-critical-simplehelp-flaw-deploy-new-djinn-infostealer-taskweaver-malware/"
        kev: true
    key_facts:
      - fact: "KEV dateAdded 2026-06-29 (CWE-347, ransomware use Unknown; forensicTriage No)."
        url: "https://ccb.belgium.be/advisories/warning-simplehelp-patched-cve-2026-48558-critical-authentication-bypass-vulnerability"
      - fact: "Horizon3 (2026-06-12): discovered 2026-05-21, reported 2026-05-22; attacker creates a new Technician user (default: remote into endpoints, run scripts); MFA bypassed because technicians self-register MFA at first login; ~14,000 exposed servers, random sample ~7.2% on OIDC; IOCs = unfamiliar technicians under Administration > Technicians > Show Group Authenticated Users and server.log lines 'Registering technician login for ...' / 'Configuration save requested (Forged Attacker ...)'; interim mitigation = IP-restrict Technician authentication (Administration > Login Security)."
        url: "https://horizon3.ai/attack-research/disclosures/cve-2026-48558-simplehelp-authentication-bypass-iocs/"
      - fact: "Blackpoint (via BleepingComputer 2026-06-29): technician session via the bypass, RMM drops Node.js and runs jquery.js from a trycloudflare address, TaskWeaver loader (single 'deliver' command, encrypted beacon to a Dev Tunnels lookalike), Djinn Stealer (developer/cloud/AI-assistant/crypto credentials, Windows/macOS/Linux); recommendations: patch, invalidate unrecognised technician sessions, rotate credentials, alert on RMM software launching Node.js/PowerShell/Python."
        url: "https://blackpointcyber.com/blog/a-djinn-in-the-machine-taskweavers-node-js-intrusion-chain"
      - fact: "CCB Belgium (2026-06-19, updated 2026-06-30): PoC available; actively exploited."
        url: "https://ccb.belgium.be/advisories/warning-simplehelp-patched-cve-2026-48558-critical-authentication-bypass-vulnerability"
  wrong_in_survivor:
    - claim: "TaskWeaver persists through scheduled tasks (schtasks.exe) / launchd plists"
      ground_truth: "not in BleepingComputer or Blackpoint"
      url: "https://blackpointcyber.com/blog/a-djinn-in-the-machine-taskweavers-node-js-intrusion-chain"
    - claim: "signature-verification mechanism cited to Horizon3; hunt on SimpleHelpServer.exe/SimpleHelp.exe spawning powershell/cmd/wscript; Technician logins not correlated with MFA/VPN events; evidence[0] title and evidence[1] as quotes"
