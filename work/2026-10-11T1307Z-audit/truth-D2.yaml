# ===== D2-l Oracle E-Business Suite CVE-2026-46817 =====
- entry: entries/2026-07-16/cve-2026-46817-oracle-ebs-payments-preauth-rce-kev-listed.md
  group: D2-l
  role: survivor
  verdict: imprecision
  defects:
    - code: F13
      where: "body ¶2 (last sentence)"
      claim: "This is the same EBS product family already under sustained ShinyHunters/UNC6240 extortion pressure and the latest in a now-annual cadence of critical, remotely exploitable EBS flaws."
      ground_truth: "None of the entry's cited sources (Oracle CSPU advisory, CISA alert, Help Net Security) mentions ShinyHunters or UNC6240. The ShinyHunters/UNC6240 (Mandiant/GTIG) campaign reported by SecurityAffairs concerns Oracle PeopleSoft CVE-2026-35273, a different product line. Help Net Security's EBS precedent is Cl0p (CVE-2025-61882 data-theft extortion) and CVE-2025-61884, i.e. 'repeated critical EBS vulnerabilities exploited by attackers in the last year', not 'now-annual'."
      ground_truth_url: "https://www.helpnetsecurity.com/2026/06/30/oracle-payments-cve-2026-46817-exploitation/"
      fix: "Delete the ShinyHunters/UNC6240 clause (or cite a source that ties it to EBS); write 'EBS has had repeated critical flaws exploited over the past year (Help Net Security)'."
    - code: F4
      where: "title, cves[].type, summary"
      claim: "title: '... unauthenticated RCE now CISA KEV-listed'; cves[CVE-2026-46817].type: rce; summary '... pre-auth takeover'"
      ground_truth: "No source calls it RCE. Oracle: 'allows unauthenticated attacker with network access via HTTP to compromise Oracle Payments. Successful attacks ... can result in takeover of Oracle Payments' (CVSS 3.1 9.8, AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H); KEV: 'improper privilege management ... takeover of Oracle Payments' (CWE-269, CWE-287, CWE-306); the only observed exploitation (Defused via Help Net Security) was an unauthenticated read of /etc/passwd through the ibytransmit endpoint."
      ground_truth_url: "https://www.oracle.com/security-alerts/cspumay2026.html"
      fix: "Title/type: 'unauthenticated takeover of Oracle Payments' (type auth-bypass or equivalent); keep 'RCE' out unless a source states code execution."
    - code: F3
      where: "sources[0].publisher/date, body ¶1, summary, cves[].fixed"
      claim: "Oracle (Critical Patch Update Advisory, May 2026) dated 2026-05-28 ; 'patched quietly in its May 2026 Critical Patch Update' ; 'Oracle characterises it as improper privilege management, improper authentication and missing authentication for a critical function ... ([Oracle CPU, 2026-05-28])'"
      ground_truth: "The cited page is Oracle's 'Critical Security Patch Update Advisory - May 2026' (a CSPU, which 'complements Oracle's existing quarterly cumulative Critical Patch Updates'), page Updated Date 2026-05-21; the CVE.org record for CVE-2026-46817 was published 2026-05-28. Oracle's risk matrix gives: Oracle Payments / File Transmission / HTTP / Remote Exploit without Auth: Yes / 9.8 / Oracle E-Business Suite 12.2.3-12.2.15; the CWE phrasing (improper privilege management, improper authentication, missing authentication for a critical function) comes from Help Net Security and the KEV entry (CWE-269/287/306), not the Oracle page. 'Quietly/without fanfare' is not in any source."
      ground_truth_url: "https://www.oracle.com/security-alerts/cspumay2026.html"
      fix: "Call it the May 2026 Critical Security Patch Update; give its date as 2026-05-21 (page) / CVE record 2026-05-28; attribute the CWE wording to KEV/Help Net Security; drop 'quietly'."
    - code: F5
      where: "Defender takeaway / sectors"
      claim: "EBS is a common finance and public-sector back-office platform across Europe"
      ground_truth: "No cited source states EBS prevalence in Europe or the public sector (Shadowserver, via BleepingComputer 2026-06-29: over 450 EBS instances exposed online, nearly 200 in the United States and Europe)."
      ground_truth_url: "https://www.bleepingcomputer.com/news/security/new-oracle-e-business-suite-flaw-now-exploited-in-attacks/"
      fix: "Replace with the Shadowserver exposure figure, or drop."
    - code: F8
      where: "Exposure / KEV state"
      claim: "(survivor omits the KEV forensic-triage flag, CWEs and exposure count)"
      ground_truth: "CISA KEV (catalogVersion 2026.10.08): CVE-2026-46817 'Oracle E-Business Suite Improper Privilege Management Vulnerability', dateAdded 2026-07-15, forensicTriage: Yes, knownRansomwareCampaignUse: Unknown, CWEs 269/287/306; CISA alert dated 2026-07-15 (adds two KEV entries: CVE-2023-4346 and CVE-2026-46817). Shadowserver (BleepingComputer 2026-06-29): over 450 EBS instances exposed online, nearly 200 in the US and Europe, patch status unknown. Defused (X, via BleepingComputer/Security Affairs): 'no known previous exploitation and no public POC code exists'."
      ground_truth_url: "https://www.cisa.gov/news-events/alerts/2026/07/15/cisa-adds-two-known-exploited-vulnerabilities-catalog"
      fix: "Add the forensic-triage flag (it supports the 'treat as potentially compromised' guidance) and the exposure count."
    - code: F18
      where: "actions[1]"
      claim: "Treat any internet-facing EBS instance left unpatched since 2026-05-28 as potentially compromised — review web-access logs for POST requests to /OA_HTML/ibytransmit and, on any hit, run a forensic review and rotate every credential/key stored on that host."
      ground_truth: "Concrete and sourced (Help Net Security), but it restates the body's Defender takeaway verbatim in substance; with actions[0] the list covers one start-now task twice. Keep actions[0] and fold the log review into it or keep only this one."
      ground_truth_url: "https://www.helpnetsecurity.com/2026/06/30/oracle-payments-cve-2026-46817-exploitation/"
      fix: "Keep two tasks at most (patch; hunt /OA_HTML/ibytransmit POSTs) without restating rationale."
  unique_material: []

