      url: "https://horizon3.ai/attack-research/disclosures/cve-2026-48558-simplehelp-authentication-bypass-iocs/"
    - claim: "(twin 06-13) actor:shinyhunters entity and the CVE-2026-35273 PeopleSoft table row; IdP MFA bypass; poc-public; 'common in European MSP estates'; SAML advice; cvss n/a"
      ground_truth: "other campaign; MFA is SimpleHelp technician MFA self-registered at first login; H3 released no technical details; CVE record has 10.0"
      url: "https://horizon3.ai/attack-research/disclosures/cve-2026-48558-simplehelp-authentication-bypass-iocs/"
  notes: "06-13 is the Horizon3 disclosure brief item, 06-30 the exploitation (KEV, Blackpoint) development of the same flaw: fold. Survivor = 06-30 (current state, critical priority is justified: KEV + ITW + unauthenticated technician takeover of an RMM server), enriched with the disclosure-day facts (affected versions, Horizon3 timeline/IOC checks, IP-restriction mitigation). The 06-13 entry's ShinyHunters entity and PeopleSoft row belong to a different finding and must not be carried."

- group: D2-i
  decision: fold
  survivor: entries/2026-06-14/cve-2026-20253-splunk-enterprise-unauthenticated-pre-auth-rc.md
  current_state:
    cves:
      - id: CVE-2026-20253
        cvss: "9.8 (CVSS 3.1 AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H; CWE-306; SIR Critical)"
        cvss_source_url: "https://advisory.splunk.com/advisories/SVD-2026-0603"
        affected: "Splunk Enterprise 10.0.0-10.0.6 and 10.2.0-10.2.3 (10.4 and 9.x not affected; Splunk Cloud not impacted)"
        fixed: "10.0.7 / 10.2.4 / 10.4.0 (advisory published 2026-06-10)"
        fixed_source_url: "https://advisory.splunk.com/advisories/SVD-2026-0603"
        exploited: true
        exploited_source_url: "https://advisory.splunk.com/advisories/SVD-2026-0603"
        kev: true
    key_facts:
      - fact: "Splunk changelog 2026-06-18: PSIRT 'became aware of limited exploitation'; KEV dateAdded 2026-06-18, due 2026-06-21 (first Splunk KEV entry per SecurityWeek); watchTowr published the full RCE chain on 2026-06-12 (PoC details); public PoC code reported by SecurityWeek."
        url: "https://www.securityweek.com/splunk-enterprise-vulnerability-exploited-in-attacks-days-after-disclosure/"
      - fact: "Splunk workaround: '[postgres] disabled = true' in server.conf and restart, not for instances using Edge Processor, OpAmp or SPL2 data pipelines (breaks them)."
        url: "https://advisory.splunk.com/advisories/SVD-2026-0603"
      - fact: "watchTowr chain: web tier proxies POST /en-US/splunkd/__raw/v1/postgres/recovery/{backup,restore} to the loopback splunk-postgres Go API (127.0.0.1:5435) with any Basic-auth credentials; backupFile path traversal; libpq connection string in `database` (hostaddr=, passfile=) makes Splunk dump an attacker DB to a file then restore it into the local PostgreSQL using .pgpass (postgres_admin); lo_export in the restored SQL writes a file as the splunk user; overwrite of a Python script Splunk runs (ssg_enable_modular_input.py) gives RCE. Default exposure: sidecar installed and enabled by default on Splunk Enterprise on AWS; on Windows on-prem not installed or not enabled by default."
        url: "https://labs.watchtowr.com/why-use-app-level-auth-when-every-database-has-auth-splunk-enterprise-cve-2026-20253-pre-auth-rce/"
  wrong_in_survivor:
    - claim: "table: KEV No / no ITW reported (vs update section and frontmatter)"
      ground_truth: "KEV 2026-06-18; Splunk-confirmed limited exploitation"
      url: "https://advisory.splunk.com/advisories/SVD-2026-0603"
    - claim: "Splunk PSIRT and NCSC-NL confirmed limited targeted exploitation; fixes available since 2026-06-14; restrict search-job submission; Splunk is a standard SIEM in CH/EU public-sector SOCs"
      ground_truth: "Splunk said 'limited exploitation'; patches 2026-06-10; the real workaround is disabling the sidecar; no NCSC-NL or deployment source"
      url: "https://www.securityweek.com/splunk-enterprise-vulnerability-exploited-in-attacks-days-after-disclosure/"
    - claim: "(twin) 'no reported in-the-wild exploitation'; 'writes files into the sidecar's runtime directory and injects SQL'; hunt on pkg-run"
      ground_truth: "stale; arbitrary-path write via traversal and connection-string injection; see mechanism"
      url: "https://labs.watchtowr.com/why-use-app-level-auth-when-every-database-has-auth-splunk-enterprise-cve-2026-20253-pre-auth-rce/"
  notes: "Same-day twins, one already carrying a changelog update (KEV and exploitation of 2026-06-18/20). Survivor = the entry with the changelog (current frontmatter: exploited, KEV) because the deep dive's text is stale on exploitation; but the survivor lacks the mechanism, exposure, detection and hardening depth, which must be moved over from the deep dive after correction (see survivor F8). classification is null and techniques is empty on the survivor."

