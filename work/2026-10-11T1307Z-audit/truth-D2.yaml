# ===== D2-e FortiClient EMS CVE-2026-35616 + EKZ Infostealer =====
- entry: entries/2026-05-29/forticlient-ems-cve-2026-35616-ekz-infostealer-kill-chain.md
  group: D2-e
  role: survivor
  verdict: factual-error
  defects:
    - code: F13
      where: "body, Background ¶1"
      claim: "The vulnerability class — header-spoofing trust against a fronting reverse proxy — is the same shape as Microsoft's [`CVE-2026-45659`](https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-45659) (separate product, same `X-Forwarded-*` trust pattern)"
      ground_truth: "CVE-2026-45659 is a Microsoft SharePoint Server remote code execution vulnerability, CWE-502 Deserialization of Untrusted Data, CVSS 3.1 8.8 (AV:N/AC:L/PR:L), published 2026-05-22, affecting SharePoint Enterprise Server 2016 / Server 2019 / Subscription Edition. It has nothing to do with header trust or X-Forwarded-* headers; the MSRC page itself does not say so either."
      ground_truth_url: "https://cveawg.mitre.org/api/cve/CVE-2026-45659"
      fix: "Delete the sentence (and the MSRC link)."
    - code: F4
      where: "body, Vulnerable component"
      claim: "The intended deployment model is that a fronting reverse proxy or load balancer performs the mutual-TLS handshake and stamps that header into the upstream request ... sends exactly that header with value `SUCCESS` as the entire exploit payload ... The server does not independently confirm that the negotiating peer presented a valid client certificate; it accepts the header as-is."
      ground_truth: "Bishop Fox (root-cause analysis): 'The Django authentication middleware accepts client certificate information from both trusted WSGI environment variables (set by Apache mod_ssl) and user-controllable HTTP request headers, and Apache was never configured to strip the user-controllable variants' (EMS's own Apache mod_ssl + Django, not an external proxy). contains_certificate() checks SSL_CLIENT_VERIFY or HTTP_X_SSL_CLIENT_VERIFY == 'SUCCESS'; validate_cert_chain() reads a user-supplied X-SSL-CLIENT-CERT header first and 'performs only Distinguished Name string matching against embedded Fortinet root CAs with no X.509 cryptographic signature verification', so an attacker also forges a certificate chain. The Nuclei template is a non-intrusive check (POST /api/v1/fabric_device_auth/fortigate/init with and without the spoofed header, comparing 401 vs 500), not 'the entire exploit payload'."
      ground_truth_url: "https://bishopfox.com/blog/api-authentication-bypass-in-forticlient-ems-7-4-5-7-4-6-cve-2026-35616"
      fix: "State the mechanism per Bishop Fox: EMS Django middleware trusts client-supplied X-SSL-CLIENT-VERIFY / X-SSL-CLIENT-CERT headers that Apache does not strip, plus DN-string-only chain validation; cite Bishop Fox as a source. Remove the fronting-proxy deployment-model claim and the 'entire exploit payload' wording."
    - code: F4
      where: "body, Vulnerable component (CVSS)"
      claim: "CVSS:3.1 base 9.1 (`AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N`). EPSS 43.2 % at the 97.6th percentile."
      ground_truth: "Fortinet's CVE.org record carries CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H/E:F/RL:O/RC:C = 9.1; the base vector (A:H) scores 9.8 and 9.1 is the temporal-adjusted score (THN also quotes 9.1). The entry's A:N vector appears in no source. No cited source gives an EPSS figure (the Nuclei template metadata shows epss-score 0.09098 / percentile 0.95195 at its snapshot)."
      ground_truth_url: "https://cveawg.mitre.org/api/cve/CVE-2026-35616"
      fix: "CVSS 9.1 (temporal; vector AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H/E:F/RL:O/RC:C; base 9.8) per the Fortinet CNA record; drop the EPSS claim or cite FIRST EPSS with a date."
    - code: F4
      where: "body, Exploitation chain ¶ (delivery)"
      claim: "attackers modify Remote Access Profile configurations through the now-privileged API endpoint to push an *Update task* to managed FortiClient endpoints — the malicious PowerShell payload is delivered through the EMS update channel under the trusted `fortitray.exe` parent process and is therefore signed in the operational sense ... [T1195.002] ... [T1218 System Binary Proxy Execution via the trusted FortiTray binary]"
      ground_truth: "Arctic Wolf: the actor edited the Remote Access Profile and endpoint policy 'to insert a malicious script for execution on endpoint devices' using the XML on_connect / script directives, which run when an endpoint establishes an SSL/IPsec VPN tunnel. 'Within seconds of affected endpoints establishing an IPsec tunnel ... fortitray.exe was observed launching .cmd script files via cmd.exe' (GUID-named, in FortiClient logs\\Trace\\scripts); the .cmd launches a base64-encoded PowerShell script that downloads and runs the payload, sleeps 90 s, then POSTs output over HTTP. Lineage: fortitray.exe or ipsec.exe > cmd.exe > powershell.exe > FortiEndpoint_Patch.exe. No 'Update task', no 'signed' payload, and no proxy execution of a system binary appear in Arctic Wolf or The Hacker News."
      ground_truth_url: "https://arcticwolf.com/resources/blog/forticlient-ems-exploited-via-cve-2026-35616-to-deliver-ekz-infostealer-disguised-as-a-fortinet-patch/"
      fix: "Describe the on_connect script path and the fortitray.exe/ipsec.exe > cmd.exe > base64 PowerShell lineage; drop 'Update task' and 'signed'; map T1072 (Software Deployment Tools) / T1059.001 / T1059.003 rather than T1218; T1195.002 is not supported by the source (the compromise is of a management server, not a supply-chain build)."
    - code: F4
      where: "body, Exploitation chain and Detection concepts (browser-profile writes)"
      claim: "EKZ copies itself into per-browser profile directories under each user's `AppData\\Local\\Google\\Chrome\\User Data\\<profile>` ... Sysmon EID 11 (`FileCreate`) targeting `AppData\\Local\\Google\\Chrome\\User Data\\<profile>` ... This is the EKZ self-copy primitive."
      ground_truth: "Arctic Wolf: for Chromium-family browsers the stealer 'reads the Local State file for the os_crypt.app_bound_encrypted_key, copies itself into the browser's Application\\ directory, and relaunches from that path to pass Chromium Elevation Service path validation', then 'calls IElevator::DecryptData to obtain the Chromium v20 AES-256 master key'. For Firefox/Gecko-family (also LibreWolf, Waterfox, Pale Moon, Thunderbird) it 'locates nss3.dll, dynamically loads NSS' and reads key4.db, logins.json, cookies.sqlite. The self-copy target is the browser's Application directory, not the user-profile directory; Gecko browsers get no self-copy."
      ground_truth_url: "https://arcticwolf.com/resources/blog/forticlient-ems-exploited-via-cve-2026-35616-to-deliver-ekz-infostealer-disguised-as-a-fortinet-patch/"
      fix: "Detection: unexpected executable written into a browser's installation Application\\ directory and launched from there by a non-browser parent; IElevator/elevation-service use by a non-browser process; nss3.dll loaded by a non-browser process. Remove the User Data profile-directory rule."
    - code: F4
      where: "body, Detection concepts bullets 1, 3, 5"
      claim: "Where the EMS server logs `X-SSL-CLIENT-VERIFY` along with peer-certificate fingerprint ... alert on Sysmon EID 1 where parent process is the FortiClient managed-service binary and child is an unsigned binary with `--silent` install flags ... `fortitray.exe` spawning PowerShell with `-EncodedCommand` / `-enc`"
      ground_truth: "Arctic Wolf's documented signals: EMS log line 'Certificate not found in request header' followed within seconds by 'Certificate user: fortinet-ca2 FortiGate: Fabric device (SN=fortinet-ca2) successfully updated'; new or unexpected EMS accounts; logins from Tor exit nodes/VPS/unfamiliar ASNs within hours of exploitation; edits to remind_upgrade_after; Remote Access Profile gaining unapproved on_connect scripts; endpoint-policy updates immediately before fleet-wide script execution; cmd.exe running scripts from C:\\Program Files\\Fortinet\\FortiClient\\logs\\Trace\\scripts with fortitray.exe/ipsec.exe parent; hidden/base64 PowerShell launching a downloaded binary right after IPsec tunnel establishment; FortiEndpoint executables staged in C:\\ProgramData; log.txt creation in ProgramData, PowerShell reading it, HTTP POST, then deletion of txt and payload. No source mentions an EMS log of X-SSL-CLIENT-VERIFY with a fingerprint, '--silent' flags or a FortiClientSetup_* naming convention; fortitray.exe launches cmd.exe, not PowerShell directly."
      ground_truth_url: "https://arcticwolf.com/resources/blog/forticlient-ems-exploited-via-cve-2026-35616-to-deliver-ekz-infostealer-disguised-as-a-fortinet-patch/"
      fix: "Replace the invented signals with Arctic Wolf's sourced ones above."
    - code: F14
      where: "body, Background ¶1"
      claim: "Arctic Wolf's 2026-05-27 publication being the first public exploitation-chain narrative tying the bypass to a downstream credential-theft payload"
      ground_truth: "No cited source says 'first'. Arctic Wolf's 2026-04-06 post says Defused had 'observed exploitation prior to Fortinet's official disclosure' and Fortinet 'has observed this to be exploited in the wild'; AW's 2026-05-27 post says the stealer is 'previously unreported'. Quantifier unsupported."
      ground_truth_url: "https://arcticwolf.com/resources/blog/cve-2026-35616/"
      fix: "Say Arctic Wolf published the first technical write-up of the EKZ campaign it observed in May 2026, or drop the ordinal."
    - code: F4
      where: "evidence[0], evidence[1]"
      claim: "'Arctic Wolf has observed threat actors actively exploiting CVE-2026-35616 in the FortiClient EMS management API to deliver a novel infostealer payload' / 'Threat actors leveraged this weakness to modify Remote Access Profile configurations and inject malicious PowerShell scripts into managed endpoints. The payload, designated EKZ Infostealer, was disguised as a legitimate Fortinet patch'"
      ground_truth: "Neither string occurs on the cited Arctic Wolf post (extract and raw HTML searched for 'novel infostealer', 'leveraged this weakness', 'designated EKZ') nor on The Hacker News or Bishop Fox pages. Arctic Wolf's closest verbatim sentences: 'Arctic Wolf observed evidence of CVE-2026-35616 being exploited against FortiClient EMS deployments.' and 'Threat actors disguised the credential stealer payload as a Fortinet endpoint update, silently executing the malicious executable through PowerShell.'"
      ground_truth_url: "https://arcticwolf.com/resources/blog/forticlient-ems-exploited-via-cve-2026-35616-to-deliver-ekz-infostealer-disguised-as-a-fortinet-patch/"
      fix: "Replace both with the verbatim Arctic Wolf sentences above."
    - code: F8
      where: "body (omitted source-supported facts)"
      claim: "(absent) EKZ exfil path, data scope, EMS exposure matrix, hotfix"
      ground_truth: "Arctic Wolf/THN: the stealer 'lacks network-based exfiltration'; it writes log.txt to ProgramData and the PowerShell script POSTs it; it also takes cookies (session reuse can circumvent MFA), saved passwords and autofill (cards, addresses, phones); recommended: restrict EMS management port 8013 to trusted IPs. Fortinet PSIRT: FortiClientEMS 7.4.5 through 7.4.6 affected, 7.2 and 8.0 not affected, hotfix available for 7.4.5/7.4.6 ('sufficient to prevent it entirely'), 7.4.7 includes the fix, FortiClient Cloud and FortiSASE already remediated, Fortinet observed exploitation in the wild (advisory dated 2026-04-04; AW says exploitation was observed and reported to Fortinet 2026-03-31)."
      ground_truth_url: "https://fortiguard.fortinet.com/psirt/FG-IR-26-099"
      fix: "Add Exposure (7.4.5-7.4.6 only; hotfix or 7.4.7; port 8013 restriction), the cookie/MFA-bypass consequence and the exfil-via-PowerShell detail."
    - code: F4
      where: "regions / sectors / tags (also brief-item body 'Why it matters to us')"
      claim: "regions: switzerland; sectors: public-sector, finance, energy, telco"
      ground_truth: "None of Arctic Wolf, Fortinet PSIRT, Bishop Fox or THN names a region or sector; the victim population is not described. The brief-item claim 'FortiClient EMS is widely deployed across Swiss federal and cantonal network-security estates' is in no cited source."
      ground_truth_url: "https://arcticwolf.com/resources/blog/forticlient-ems-exploited-via-cve-2026-35616-to-deliver-ekz-infostealer-disguised-as-a-fortinet-patch/"
      fix: "Drop sector/region assertions or source them; relevance can rest on 'FortiClient EMS 7.4.5-7.4.6 is KEV-listed and exploited'."
    - code: F3
      where: "body, Background ¶1 citations"
      claim: "[improper-access-control (CWE-284)](https://nvd.nist.gov/vuln/detail/CVE-2026-35616) ... added to the [CISA KEV catalog](https://www.cisa.gov/known-exploited-vulnerabilities-catalog) on 2026-04-06"
      ground_truth: "Both links are hard-blocked patterns (NVD per-CVE page; KEV catalogue landing). Fact verified on the CISA KEV catalogue (catalogVersion 2026.10.08): CVE-2026-35616 'Fortinet FortiClient EMS Improper Access Control Vulnerability', dateAdded 2026-04-06, knownRansomwareCampaignUse Unknown. CWE-284 is on the Fortinet PSIRT page."
      ground_truth_url: "https://fortiguard.fortinet.com/psirt/FG-IR-26-099"
      fix: "Cite FG-IR-26-099 for CWE-284 and the vendor-confirmed exploitation; state KEV listing without the landing-page link."
    - code: F17
      where: "classification"
      claim: "(no classification block)"
      ground_truth: "Required on every entry; legacy migrated entry carries none. Fortinet PSIRT (vendor) + Arctic Wolf Labs (primary researcher) + Bishop Fox root cause; exploitation vendor-confirmed."
      ground_truth_url: "https://fortiguard.fortinet.com/psirt/FG-IR-26-099"
      fix: "Add classification block (vendor-confirmed exploitation, multi-source: credibility 1-2)."
    - code: F11
      where: "body (file-name indicator) and techniques"
      claim: "The PowerShell payload fetches `FortiEndpoint_Patch.exe`, presented to operators and AV as a legitimate Fortinet patch ... The fake `FortiEndpoint_Patch.exe` name from this campaign deviates from the genuine `FortiClientSetup_*.exe` naming convention."
      ground_truth: "Malware file name used as an indicator (policy: no file-name IOCs; Arctic Wolf itself lists hashes/IPs/URLs in its IOC section, none of which the entry may reproduce). No techniques[] key; ATT&CK ids appear only in prose."
      ground_truth_url: "https://arcticwolf.com/resources/blog/forticlient-ems-exploited-via-cve-2026-35616-to-deliver-ekz-infostealer-disguised-as-a-fortinet-patch/"
      fix: "Describe 'a fake Fortinet endpoint update executable staged in ProgramData' without the file name; add techniques[] (T1190, T1072, T1059.001, T1059.003, T1555.003, T1041)."
  unique_material: []

