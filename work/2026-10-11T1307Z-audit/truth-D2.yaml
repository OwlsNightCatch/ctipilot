      claim: "n8n disclosed five Critical CVEs at CVSS 9.4 each on 2026-05-18, split across two patch trains ... ([n8n GHSA-q5f4-99jv-pgg5, 2026-05-18]; [The Hacker News, 2026-05-18])"
      ground_truth: "GHSA-q5f4-99jv-pgg5 (CVE-2026-42231) and GHSA-hqr4-h3xv-9m3r (CVE-2026-42232) were published Apr 22, 2026 (CVE.org records 2026-05-04); GHSA-c8xv-5998-g76h (44789), GHSA-57g9-58c2-xjg3 (44790) and GHSA-wrwr-h859-xh2r (44791) were published May 13, 2026 (CVE.org records 2026-06-23). 2026-05-18 is only the date of The Hacker News patch roundup."
      ground_truth_url: "https://github.com/n8n-io/n8n/security/advisories/GHSA-q5f4-99jv-pgg5"
      fix: "Date the first pair 2026-04-22 and the second trio 2026-05-13; label the GHSA citation with its own publication date; 2026-05-18 is the THN roundup date (event_date should reflect the roundup only as the coverage date)."
    - code: F4
      where: "body, Exploitation prerequisites and Hardening"
      claim: "Upgrade is the only remediation; no workaround. ... Apply the vendor patch (n8n `1.123.32` / `2.17.4` / `2.18.1`) — that is the only remediation."
      ground_truth: "Every GHSA lists workarounds: 'Limit workflow creation and editing permissions to fully trusted users only'; XML node flaws (CVE-2026-42232, -44791): 'Disable the XML node by adding n8n-nodes-base.xml to the NODES_EXCLUDE environment variable'; CVE-2026-44789: disable the HTTP Request node via n8n-nodes-base.httpRequest; CVE-2026-44790: disable the Git node via n8n-nodes-base.git (each 'do not fully remediate the risk'). The Hardening paragraph also names only the first-train versions, contradicting the earlier 'apply the later train' statement (the full set needs 1.123.43 / 2.20.7 / 2.22.1; CVE.org lists 2.21.0 < 2.21.1 as affected for the 2.21 branch)."
      ground_truth_url: "https://github.com/n8n-io/n8n/security/advisories/GHSA-hqr4-h3xv-9m3r"
      fix: "Replace with the advisory workarounds (restrict workflow create/edit to trusted users; NODES_EXCLUDE for the XML, HTTP Request, Git nodes as short-term mitigation only) and state the later train (1.123.43 / 2.20.7 / 2.22.1; 2.21.1 on the 2.21 branch per the CVE record) as the single patch target."
    - code: F4
      where: "evidence[0], evidence[1]"
      claim: "evidence[0]: 'n8n addresses five critical prototype pollution and injection flaws (CVE-2026-42231/42232/44791/44789/44790, all CVSS 9.4)' (The Hacker News); evidence[1]: '...achieve remote code execution on the n8n host. CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H = 9.4'"
      ground_truth: "THN article text contains no such sentence ('Round off the list is a set of five critical vulnerabilities impacting n8n -', then five bullets each '(CVSS score: 9.4)'); the substring 'addresses five critical' does not occur in the page. evidence[1] splices the GHSA sentence ('...achieve remote code execution on the n8n host.') with the CVSS vector and an appended '= 9.4' that the GHSA page does not contain contiguously (the page shows the vector inside the CVSS panel and 'Critical 9.4' separately)."
      ground_truth_url: "https://thehackernews.com/2026/05/ivanti-fortinet-sap-vmware-n8n-patch.html"
      fix: "evidence[0]: quote 'Round off the list is a set of five critical vulnerabilities impacting n8n' or a CVE bullet verbatim. evidence[1]: end the quote at 'on the n8n host.'"
    - code: F4
      where: "cves[CVE-2026-44790], cves[all five].vector"
      claim: "CVE-2026-44790 type: rce; all five vector: user-interaction"
      ground_truth: "GHSA-57g9-58c2-xjg3 / CVE-2026-44790: 'inject CLI flags on the Git node's Push operation allowing an attacker to read arbitrary files from the n8n server potentially leading to full compromise' (CWE-88); THN: 'enabling an attacker to read arbitrary files'. Not an RCE. All five advisories: AV:N/AC:L/AT:N/PR:L/UI:N - no user interaction; auth is low-privilege workflow editor."
      ground_truth_url: "https://github.com/n8n-io/n8n/security/advisories/GHSA-57g9-58c2-xjg3"
      fix: "CVE-2026-44790 type file-read (info disclosure via CLI-flag injection), vector network; keep auth post-auth (workflow create/modify permission)."
    - code: F4
      where: "body, Vulnerability class ¶1"
      claim: "CVE-2026-44791 ... is 'XML Node Prototype Pollution Patch Bypass' — a regression / bypass of the initial xml2js fix. ... By embedding `__proto__` / `constructor.prototype` payloads into the parsed XML ... the Git node's SSH invocation path consumes attacker-controlled values"
      ground_truth: "GHSA-wrwr-h859-xh2r: 'could bypass the patch for GHSA-hqr4-h3xv-9m3r in the XML node' (CVE-2026-42232, XML Node); THN: 'A bypass for CVE-2026-42232'. It is not a bypass of the xml2js webhook-parser fix (CVE-2026-42231). The advisories say only 'chaining the pollution with the Git node's SSH operations'; the __proto__ / constructor.prototype tokens and 'SSH invocation path consumes attacker-controlled values' are not in any cited source."
      ground_truth_url: "https://github.com/n8n-io/n8n/security/advisories/GHSA-wrwr-h859-xh2r"
      fix: "CVE-2026-44791 = bypass of the CVE-2026-42232 XML Node fix. Keep the webhook xml2js + Git-node SSH chain as the advisory states it; drop the token and SSH-path specifics or mark them as inference."
    - code: F4
      where: "body, intro ¶1 and 'Why this matters' ¶"
      claim: "increasingly deployed by Swiss/EU public-sector teams as a low-code integration bus, by federal data offices for pipeline orchestration, and by university research groups ... Expect downstream national-CERT advisories (ANSSI / BSI / NCSC-CH) to amplify the patch urgency in the coming days."
      ground_truth: "Neither GHSA nor THN says anything about public-sector, federal or university deployment, or about CERT amplification. Constituency relevance is asserted, not sourced; regions/sectors frontmatter (public-sector, education, europe) inherits the same assertion."
      ground_truth_url: "https://thehackernews.com/2026/05/ivanti-fortinet-sap-vmware-n8n-patch.html"
      fix: "Remove the unsourced deployment and CERT-prediction claims; if relevance is kept, frame it as 'self-hosted n8n instances where workflow-editor accounts exist' without attributing adoption."
    - code: F8
      where: "labelled lines"
      claim: "(no Exposure / Triage / Defender takeaway lines; Hunt and Hardening paragraphs unlabelled)"
      ground_truth: "Sources support Exposure: n8n npm package < 1.123.32/2.17.4/2.18.1 (first pair) and < 1.123.43/2.20.7/2.22.1 (second trio); attacker needs an authenticated account with workflow create/modify permission; instance reachability = any authenticated editor. Workarounds listed in the GHSAs are absent."
      ground_truth_url: "https://github.com/n8n-io/n8n/security/advisories/GHSA-q5f4-99jv-pgg5"
      fix: "Add Exposure / Detection / Defender takeaway labelled lines; techniques[] mapping (T1190, T1059.007 are active in the pinned dataset v19.2; T1611 and T1068 are not supported by any cited source)."
    - code: F16
      where: "priority"
      claim: "priority: high (brief item) / notable (deep dive)"
      ground_truth: "Authenticated-only (PR:L) RCE chain, no exploitation reported by either source, not in KEV (catalogue 2026.10.08 has none of the five). Fails the high bar; survivor stays notable."
      ground_truth_url: "https://github.com/n8n-io/n8n/security/advisories/GHSA-q5f4-99jv-pgg5"
      fix: "priority: notable (survivor)."
    - code: F17
      where: "classification"
      claim: "(no classification block)"
      ground_truth: "Required on every entry; legacy migrated entry carries none. Vendor GHSAs (primary, per-CVE) plus one news roundup."
      ground_truth_url: "https://github.com/n8n-io/n8n/security/advisories/GHSA-q5f4-99jv-pgg5"
      fix: "Add classification {reliability per sources.json tier of n8n advisories, credibility 2}."
    - code: F11
      where: "summary / headline"
      claim: "summary ends '... by federal data offices for pipeline …'; headline cut mid-phrase 'stand up as'"
      ground_truth: "Truncated frontmatter text."
      ground_truth_url: "https://github.com/n8n-io/n8n/security/advisories/GHSA-q5f4-99jv-pgg5"
