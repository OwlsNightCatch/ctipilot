      - fact: "CVE-2026-7261 = UAF after header parsing failure with SOAP_PERSISTENCE_SESSION (attacker control of freed memory 'unlikely'); CVE-2026-7262 = NULL dereference / DoS in the apache:Map value check (typemap set). All three published 2026-05-07, fixed in the same releases (php.watch dates for 8.5.6, 8.4.21, 8.3.31, 8.2.31 all 2026-05-07)."
        url: "https://php.watch/versions/8.5/releases/8.5.6"
      - fact: "Not in CISA KEV (catalogVersion 2026.10.08); no exploitation statement in advisory, php.watch or ChangeLog."
        url: "https://www.php.net/ChangeLog-8.php"
  wrong_in_survivor:
