# ===== D2-d Ghost CMS CVE-2026-26980 =====
- entry: entries/2026-05-25/ghost-cms-cve-2026-26980-clickfix-the-cms-compromise-to-endp.md
  group: D2-d
  role: survivor
  verdict: factual-error
  defects:
    - code: F4
      where: "body, Hardening / Ghost bullet"
      claim: "until then block `slug:[` / `slug%3A%5B` at the WAF and restrict the public Content API to trusted origins."
      ground_truth: "Ghost advisory: 'There is no application-level workaround. The Content API key is public by design, so restricting key access does not mitigate this vulnerability. As a temporary mitigation, a reverse proxy or WAF rule can be used to block Content API requests containing `slug%3A%5B` or `slug:[` in the query string filter parameter. Note that this may break legitimate slug filter functionality.'"
      ground_truth_url: "https://github.com/TryGhost/Ghost/security/advisories/GHSA-w52v-v783-gw97"
      fix: "Drop 'restrict the public Content API to trusted origins'; state that only the reverse-proxy/WAF block exists as interim mitigation (may break legitimate slug filters), upgrade to >= 6.19.1 is the fix."
    - code: F4
      where: "body, Kill chain / Initial access"
      claim: "Unauthenticated boolean-based blind SQL injection through the Content API's `slug` filter parameter ... boolean-blind SQL artefacts (`AND`, `CASE`, time-delay primitives)"
      ground_truth: "GHSA: 'SQL injection ... allowed unauthenticated attackers to read arbitrary data from the database' (CWE-89, CVSS 3.1 9.4 AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:L, versions v3.24.0 to v6.19.0). SentinelOne's DB page: injection in the 'Content API slug filter ordering' where user slug values are concatenated into SQL CASE statements. None of GHSA, SentinelOne, BleepingComputer or XLab says 'boolean-based' or 'blind', or lists time-delay primitives."
      ground_truth_url: "https://www.sentinelone.com/vulnerability-database/cve-2026-26980/"
      fix: "Say 'unauthenticated SQL injection in the Content API slug-filter ordering (read primitive)'; drop boolean-blind/time-delay wording (or mark as inference)."
    - code: F9
      where: "body, Background ¶1"
      claim: "CVE-2026-26980 was disclosed and patched in Ghost 6.19.1 on 19 February 2026"
      ground_truth: "BleepingComputer: 'the fix for the issue was released on February 19 in Ghost CMS version 6.19.1' and XLab: 'publicly disclosed as early as February 19'. Primary sources: Ghost advisory GHSA-w52v-v783-gw97 published Feb 16, 2026 (GitHub Advisory DB Feb 18; NVD Feb 20); GitHub release v6.19.1 datetime 2026-02-16T16:54Z."
      ground_truth_url: "https://github.com/TryGhost/Ghost/security/advisories/GHSA-w52v-v783-gw97"
      fix: "Patched/disclosed 2026-02-16 (vendor advisory and release); note that BleepingComputer and XLab give February 19."
    - code: F11
      where: "body, Kill chain / Payload delivery"
      claim: "an Electron-based sample named `UtilifySetup.exe`"
      ground_truth: "File-name indicator (policy: no file-name IOCs). XLab: final payload is an Inno Setup package of an Electron app repackaged from an open-source app, persistence via the Electron setLoginItemSettings API, polls a C2 every 30 seconds to run arbitrary JavaScript or executables."
      ground_truth_url: "https://blog.xlab.qianxin.com/ghost-cms-mass-compromised-via-cve-2026-26980-now-fueling-clickfix-attacks/"
      fix: "Describe the behaviour (Electron app with login-item persistence and 30 s C2 polling) without the file name."
    - code: F8
      where: "Detection concepts"
      claim: "'Sysmon Event ID 1 / Windows 4688 for cmd.exe or powershell.exe (especially with -EncodedCommand, clipboard-paste context, mshta, curl/certutil download cradles)' ... 'In the Ghost admin audit trail, alert on unexpected article or theme modifications'"
      ground_truth: "XLab documents the actual observables: pasted command is `cmd /c` moving a downloaded archive from Downloads to %TEMP%, `tar -xf`, then `start /min` a batch file; the batch runs hidden `powershell -W 1` with `iwr` to fetch a DLL and `Start-Process rundll32 <dll>,Begin` hidden; later stage drops an Electron app with login-item persistence. Site-side: abnormal `PUT /ghost/api/admin/posts/:id/` requests (unfamiliar IPs/UAs, bulk edits), unexpected <script> in Code Injection settings and theme files, unknown or long-unused Admin API keys; keep >= 30 days of Admin API call logs. Remediation: rotate Admin API Key, Content API Key, administrator password and sessions. mshta/certutil/-EncodedCommand are not in the source chain."
      ground_truth_url: "https://blog.xlab.qianxin.com/ghost-cms-mass-compromised-via-cve-2026-26980-now-fueling-clickfix-attacks/"
      fix: "Replace the generic cradle list with the sourced chain (browser/explorer -> cmd /c move+tar+start batch -> hidden powershell iwr + rundll32 export) and add the Admin API PUT /posts anomaly and Code Injection checks; widen key rotation to all keys, password and sessions."
    - code: F8
      where: "body / affected versions / actors"
      claim: "(survivor omits affected range and the two-actor competition)"
      ground_truth: "Affected: Ghost v3.24.0 through v6.19.0 (GHSA); BleepingComputer and XLab: at least two distinct activity clusters re-infecting or cleaning each other's injected scripts, 700+ domains confirmed on 2026-05-17 (156 on 2026-05-10); victim mix mostly personal blogs/SaaS-tech blogs, 21 education, 19 media."
      ground_truth_url: "https://blog.xlab.qianxin.com/ghost-cms-mass-compromised-via-cve-2026-26980-now-fueling-clickfix-attacks/"
      fix: "Add the version range, CVSS 9.4 vector and the two-cluster observation (carry from the brief item and sources)."
    - code: F11
      where: "techniques / tags / regions / evidence"
      claim: "T1204.002 'User Execution: Malicious File'; regions: europe; sectors: public-sector; evidence[0].quote: 'Background.'; summary starts 'Background.'"
      ground_truth: "ATT&CK v19.2 (pinned) has T1204.004 'Malicious Copy and Paste' for ClickFix-style paste-and-run; T1204.002 is active but describes opening a malicious file. XLab victim list shows no public-sector category and the sources do not tie the campaign to Europe. Evidence quote 'Background.' is a one-word fragment, not a supporting quotation."
      ground_truth_url: "https://blog.xlab.qianxin.com/ghost-cms-mass-compromised-via-cve-2026-26980-now-fueling-clickfix-attacks/"
      fix: "Map T1204.004 (and T1059.001/.003, T1105, T1659, T1480, T1190 as in the body); drop europe/public-sector unless sourced; replace the evidence quote with a verbatim sentence from XLab/BC; rewrite summary."
    - code: F5
      where: "body, Background ¶1"
      claim: "ClickFix / FakeCaptcha ... has been a tracked initial-access technique since 2024"
      ground_truth: "No cited source dates ClickFix to 2024."
      ground_truth_url: "https://blog.xlab.qianxin.com/ghost-cms-mass-compromised-via-cve-2026-26980-now-fueling-clickfix-attacks/"
      fix: "Remove or cite."
    - code: F17
      where: "classification"
      claim: "(no classification block)"
      ground_truth: "Required on every entry; legacy migrated entry carries none. Vendor GHSA primary, XLab primary-researcher, BleepingComputer secondary: multi-source, credibility 2 (exploitation reported by researcher, not independently confirmed beyond XLab/SentinelOne via BC)."
      ground_truth_url: "https://github.com/TryGhost/Ghost/security/advisories/GHSA-w52v-v783-gw97"
      fix: "Add classification block."
  unique_material: []

