- code: F4
  entry: 2026-10-11/needymantis-modular-post-compromise-framework-storm-3069
  where: Detection line, "an HTTPS request with an oversized cookie followed by a WebSocket upgrade"; claim 93bc1dd47c
  summary: "(low confidence) Microsoft describes the beacon cookie as carrying Base64-encoded, compressed JSON (computer name, user, parent process, Program Files listing, process list) and never calls it oversized or gives a size. A hunter keying on 'oversized' has no threshold from the source."
  ground_truth: "The Set-Cookie header contains system information. The header value can be Base64-decoded and RtlDecompressBuffer decompressed. Once decompressed it contains a JSON object."
  ground_truth_url: https://www.microsoft.com/en-us/security/blog/2026/09/28/needymantis-unpacking-a-post-compromise-malware-family-used-in-targeted-operations/
  fix: "Describe the cookie as carrying Base64-encoded compressed system information (host, user, process list, Program Files listing) instead of 'oversized'."
- code: F8
  entry: 2026-05-09/cve-2026-31431-copy-fail-cisa-kev-deadline-2026-05-15-approa
  where: "**Detection:** line"
  summary: "(low confidence) Xint's 'Stealthy' paragraph says the corrupted page is never marked dirty and on-disk checksum comparisons miss it. The Detection line omits it, so a responder could lean on file-integrity monitoring or hash checks of su and conclude a host is clean."
  ground_truth: "Standard file integrity tools comparing on-disk checksums will miss it, because the on-disk file is unchanged. Only the in-memory page cache is corrupted."
  ground_truth_url: https://xint.io/blog/copy-fail-linux-distributions
  fix: "Add to Detection, cited to Xint: on-disk integrity checks of setuid binaries do not see the modification; the telemetry signal is the AF_ALG/splice sequence."
