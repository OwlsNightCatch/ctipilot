- code: F4
  entry: 2026-05-08/amazon-ses-weaponised-for-authenticated-phishing-and-bec-kas
  where: "## Correction 2026-10-11T14:15:47Z, last sentence; claim 76ce6fff4a"
  summary: "(low confidence) 'Attackers use leaked IAM access keys, not separate SES API credentials.' is stated flatly. Securelist says 'In most cases' and never discusses separate SES API credentials, so the exclusion and the absolute are the entry's, not the source's."
