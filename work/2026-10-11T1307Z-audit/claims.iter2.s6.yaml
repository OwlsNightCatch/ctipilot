  entry: 2026-06-06/cve-2026-20245-cisco-catalyst-sd-wan-manager-actively-exploi
  surface: record 2026-10-11T14:39:43Z
  kind: record-summary
  text: The title, summary, body and action still said no patch existed, although fixed releases shipped from 2026-06-09 and Cisco added a Live Protect shield. CVE-2026-20245 was typed as an unauthenticated
    bypass with no score; it is an authenticated local netadmin-to-root flaw scored 7.8, and the companion CVE-2026-20182 scores 10.0. Mandiant dates the zero-day exploitation to April 2026 at a service
    provider, not late 2025 to March at a communications provider; it presents the peering-bypass foothold as a possibility, and reports file deletion and configuration rollback rather than history or syslog
    deletion. The entry is rewritten with the Controller and Validator, the KEV listing, Cisco's and Mandiant's indicators, a rating, an ATT&CK mapping and a link to the CVE-2026-20182 entry; both Mandiant
    sections are corrected in place and workflow references removed. The companion CVE-2026-20127 record gains Cisco's 10.0 score and its KEV listing, and the attacker's file and account names are replaced
    with descriptions of the behaviour.
