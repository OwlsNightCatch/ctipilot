    action, a rating and an ATT&CK mapping. A Detection line follows InfoGuard''s CVE-2026-2743 chain, the contradiction line adds the 15.0.3 or 15.0.4 split for CVE-2026-44126, and the 10.0 score for CVE-2026-2743
    is cited to The Hacker News. The Detection line places the traversal in the request body InfoGuard shows, and the CVE-2026-44126 record states both fixed-version readings.'
