  entry: 2026-10-11/needymantis-modular-post-compromise-framework-storm-3069
  surface: summary
  kind: frontmatter
  text: Microsoft Threat Intelligence describes NeedyMantis, a modular post-compromise malware framework used since at least October 2025 in a limited number of targeted intrusions at telecommunications
    organizations, universities, medical nonprofits, intergovernmental organizations and government contractors. It is deployed after access exists, sideloaded as a DLL beside legitimate software, and loads
    further modules over a WebSocket channel. Storm-3069, Microsoft's designator for the DAEMON Tools supply-chain activity, is one operator; Microsoft assesses the activity originates from China without
    attributing it to a nation-state actor.
