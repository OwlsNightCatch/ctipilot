  entry: 2026-09-03/cve-2026-83548-83549-sonicwall-sma1000-ssrf-cmd-injection
  surface: summary
  kind: frontmatter
  text: 'SonicWall confirms active exploitation of two SMA1000 secure-remote-access flaws (SNWLID-2026-0016): CVE-2026-83548 (CVSS 3.0 10.0), a pre-authentication SSRF in the Work Place interface via an
    unintended alternate access path, and CVE-2026-83549 (CVSS 3.0 7.8), a post-authentication OS command injection in the Appliance Management Console. Shadowserver tracks over 400 internet-exposed SMA1000
    appliances. Fixed in hotfix 12.4.3-03526 / 12.5.0-02952; no fix exists short of upgrading, and this is the second SMA1000 zero-day chain reported in seven weeks. The Hacker News reports that SonicWall''s
    advisory of 2026-10-06 lists these hotfix builds as affected by a further Work Place SSRF, CVE-2026-102255, fixed in 12.4.3-03670 and 12.5.0-03082.'
