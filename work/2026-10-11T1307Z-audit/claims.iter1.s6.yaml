  entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
  surface: body
  kind: cited
  text: 'CVE-2026-34265 (CVSS 9.8, Note 3714806) is the one to weigh against internal network exposure rather than internet exposure: "Logical errors in DIAG protocol parsing allow an unauthenticated attacker
    to generate memory corruptions" in the Application Server ABAP kernel, with potential disclosure of sensitive system information or a crash of the instance ('
  urls:
  - https://onapsis.com/blog/sap-security-patch-day-august-2026/
