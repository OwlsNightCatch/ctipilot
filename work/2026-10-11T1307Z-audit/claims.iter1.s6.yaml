- claim_id: b20676b4e4
  entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
  surface: body
  kind: uncited
  text: 'That is the reason none of them carries a `critical` priority here — but the Data Hub Adapter flaw still demands action ahead of the normal SAP patch cadence, because its own mechanics set the
    clock: an unauthenticated, no-interaction path to code execution on a component that is internet-facing by product design, disclosed with a CVSS 10.0 and a documented interim network control, is the
