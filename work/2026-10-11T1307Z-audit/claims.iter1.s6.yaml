  entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
  surface: body
  kind: uncited
  text: 'The one that changes an exposure picture rather than a patch schedule is CVE-2026-58231, carried by SAP Security Note 3771065 at CVSS 10.0: an improper-authorization flaw in the Data Hub Adapter
    of SAP Commerce Cloud.'
- claim_id: d571a028a4
  entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
  surface: body
  kind: uncited
  text: 'The reason this ranks above a routine critical: Commerce Cloud is the platform behind public storefronts, so the vulnerable component sits on the internet side of the estate by design, and the
    score''s pre-auth, no-interaction profile means reaching it takes a crafted request rather than a foothold.'
