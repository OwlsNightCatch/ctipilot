- claim_id: 7cec3f6937
  entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
  surface: summary
  kind: frontmatter
  text: SAP's 2026-08-11 Security Patch Day fixes CVE-2026-58231, an improper-authorization flaw in the SAP Commerce Cloud Data Hub Adapter that Onapsis describes as insufficient authorization checks and
    input validation reachable without authentication, rated CVSS 10.0 and capable of arbitrary code execution. Further notes cover code injection in SAP Manufacturing Integration and Intelligence (CVE-2026-44772,
    9.9; CVE-2026-44758, 9.1) and an unauthenticated memory-corruption flaw in the NetWeaver AS ABAP kernel's DIAG protocol parser (CVE-2026-34265, 9.8). Defused later reported exploitation attempts against
    CVE-2026-58231 at its honeypots; Commerce Cloud fixes require rebuilding and redeploying the release rather than installing a patch, and an IP filter set is the vendor-side interim control.
