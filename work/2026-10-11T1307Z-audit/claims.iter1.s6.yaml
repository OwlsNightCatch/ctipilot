- claim_id: 1971652266
  entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
  surface: body
  kind: uncited
  text: 'Detection concepts are ordinary but specific: in web and reverse-proxy access logs, surface requests to the Data Hub import path from source addresses outside the integration ranges that legitimately
    feed it, and treat any such request that precedes an unexplained child process under the Commerce Cloud application account as an incident rather than an anomaly.'
- claim_id: b91e37e74a
  entry: 2026-08-12/sap-august-2026-cve-2026-58231-commerce-cloud-data-hub-rce
  surface: body
  kind: uncited
  text: Discriminating benign from malicious here is easier than usual — legitimate Data Hub imports arrive from a small, enumerable set of integration sources, so the source address and the calling identity,
    not the request body, are the useful filter.
