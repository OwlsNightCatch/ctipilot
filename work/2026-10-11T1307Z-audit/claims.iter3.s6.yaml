- claim_id: e54412b318
  entry: 2026-05-10/microsoft-semantic-kernel-cve-2026-26030-cve-2026-25592-prom
  surface: record 2026-10-11T14:44:02Z
  kind: record-summary
  text: 'The CVE-2026-25592 mechanism was inverted: DownloadFileAsync is the host-side write that drops a script into the Startup folder, and upload_file is the read path. CVE-2026-26030 is an eval() of
