claims:
- {claim_id: 699a3e4fdb, verdict: ok, source_url: "https://www.elastic.co/security-labs/shai-hulud-chaindrop-npm-supply-chain", passage: "On August 4, 2026, Elastic Security Labs identified a new Shai-Hulud campaign targeting the maintainer of keyv ... trojanized the monorepo and embedded a self-propagating worm called CHAINDROP"}
- {claim_id: 07b3a4ea4f, verdict: ok, source_url: "https://www.elastic.co/security-labs/shai-hulud-chaindrop-npm-supply-chain", passage: "keyv alone received over 600 million downloads last month ... flat-cache near 580 million, cacheable-request at over 137 million, cacheable over 30 million, cache-manager over 16 million; over 400 uni"}
- {claim_id: ceb148a762, verdict: ok, source_url: "https://www.ox.security/blog/a-new-infostealer-worm-hits-npm-affecting-keyv-and-cacheable/", passage: "dated 2026-08-04: A massive Shai-Hulud campaign hit npm, affecting over 2 billion monthly downloads; 444 packages"}
- {claim_id: a5740f68fc, verdict: ok, source_url: "https://www.elastic.co/security-labs/shai-hulud-chaindrop-npm-supply-chain", passage: "Elastic identified the return of Shai-Hulud ... payload contains strings with Dune-themed references and has similarities to previous Shai-Hulud campaigns (Dune strings not stated to BE the similarity"}
- {claim_id: 063cddd912, verdict: ok, source_url: "https://www.elastic.co/security-labs/shai-hulud-chaindrop-npm-supply-chain", passage: "Execution is triggered via a preinstall hook in package.json ... requiring no further interaction from the victim after the installation"}
- {claim_id: 1fbd94bf77, verdict: ok, source_url: "https://www.elastic.co/security-labs/shai-hulud-chaindrop-npm-supply-chain", passage: "dropper checks if bun is installed; if not detects platform/architecture, downloads bun from the official release page, executes the payload; the bun temporary directory is deleted"}
- {claim_id: e29edf8a65, verdict: ok, source_url: "https://www.elastic.co/security-labs/shai-hulud-chaindrop-npm-supply-chain", passage: "cross-platform, targeting Linux, macOS, and Windows; heavily obfuscated at 711 kilobytes, employing control-flow flattening"}
- {claim_id: 409bc93359, verdict: ok, source_url: "https://www.elastic.co/security-labs/shai-hulud-chaindrop-npm-supply-chain", passage: "payload appears under two filenames ... Both files share the same SHA-256 hash, making the filename a reliable indicator of infection generation"}
- {claim_id: bde652b869, verdict: ok, source_url: "https://www.elastic.co/security-labs/shai-hulud-chaindrop-npm-supply-chain", passage: "folderOpen task under tasks.json ... up to 50 branches per accessible repository, injecting .claude/settings.json and .vscode/tasks.json ... developer can still be infected by just opening the reposit"}
- {claim_id: 78cb79cdb5, verdict: ok, source_url: "https://www.elastic.co/security-labs/shai-hulud-chaindrop-npm-supply-chain", passage: "collector ... scanning over 300 unique patterns ... Anthropic, Claude, Codex, Cursor, OpenAI, and Gemini ... AWS, GCP, Azure, Alibaba Cloud ... Vault tokens, SSH keys, Kubernetes service account token"}
- {claim_id: dc61dfa32f, verdict: ok, source_url: "https://www.elastic.co/security-labs/shai-hulud-chaindrop-npm-supply-chain", passage: "gzip-compressed and then encrypted with a randomly generated AES-256-GCM key. That AES key is then RSA-encrypted with the attacker's hardcoded public key"}
- {claim_id: 02a425867d, verdict: ok, source_url: "https://www.elastic.co/security-labs/shai-hulud-chaindrop-npm-supply-chain", passage: "does not hardcode a C2 domain; instead, it queries an Ethereum smart contract ... uses multiple RPC providers as fallbacks ... attacker can rotate C2 infrastructure by updating the smart contract"}
- {claim_id: 3d675a4740, verdict: ok, source_url: "https://www.elastic.co/security-labs/shai-hulud-chaindrop-npm-supply-chain", passage: "If these two previous paths fail, CHAINDROP will exfiltrate the data via a public GitHub repository ... using the compromised victim's account with a description: Shai-Hulud: Here We Go Again."}
- {claim_id: 1e767f8fc3, verdict: ok, source_url: "https://www.ox.security/blog/a-new-infostealer-worm-hits-npm-affecting-keyv-and-cacheable/", passage: "The malware has a dead man's switch trigger, to delete the current machine if the stolen GitHub token is revoked"}
- {claim_id: 34da9d9f1b, verdict: F3, source_url: "https://www.elastic.co/security-labs/shai-hulud-chaindrop-npm-supply-chain", passage: "Elastic: 'Revoke all GitHub tokens ... The wording is an attempt to intimidate developers not to revoke the GitHub token.' Elastic does not say 'rather than a working trigger' (low confidence)"}
- {claim_id: c905b7bffe, verdict: ok, source_url: "https://www.ox.security/blog/a-new-infostealer-worm-hits-npm-affecting-keyv-and-cacheable/", passage: "OX: 'the extortion string telling to the developer not to revoke the GitHub token' and separately 'Setup a dead man's drop triggering when the GitHub token is revoked'"}
- {claim_id: aca2cd37ec, verdict: ok, source_url: "https://www.elastic.co/security-labs/shai-hulud-chaindrop-npm-supply-chain", passage: "Elastic: 'The wording is an attempt to intimidate developers'; page has no mention of dead man's switch (grep 0)"}
- {claim_id: a94f90500f, verdict: ok, source_url: "https://www.socket.dev/blog/tensorlake-compromise", passage: "installation hook and payload filenames match the structure documented in the August ChainDrop compromises ... Remove the token monitor before revoking any tokens"}
- {claim_id: 2312bb3e34, verdict: ok, source_url: "https://www.elastic.co/security-labs/shai-hulud-chaindrop-npm-supply-chain", passage: "activates when the credential sweep turns up an npm token ... package write permissions and the ability to publish without two-factor authentication (bypass_2fa)"}
- {claim_id: d6d16cb0b8, verdict: ok, source_url: "https://www.elastic.co/security-labs/shai-hulud-chaindrop-npm-supply-chain", passage: "enumerates every package the victim has publish rights to ... Downloads the latest published tarball ... Re-packages and publishes back to the npm registry"}
