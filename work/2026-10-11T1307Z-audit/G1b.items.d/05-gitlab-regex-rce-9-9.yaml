  - title: "GitLab CE/EE critical patch release 19.4.1 / 19.3.3 / 19.2.7: two authenticated CI/CD regular-expression memory-corruption RCEs rated CVSS 9.9 (CVE-2026-89078, CVE-2026-93577); AI Gateway sandbox escape CVE-2026-90970 (9.9) on 2026-10-02"
