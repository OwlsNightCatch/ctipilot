      - { url: "https://docs.gitlab.com/releases/patches/other-patches/patch-release-gitlab-ai-gateway-19-4-1-released/", publisher: "GitLab (AI Gateway 19.4.1 patch release)", date: "2026-10-02", role: "corroborating" }
    discovery_trace: "first seen at: coordinator scope addendum (GitLab CVE-2026-89078 and CVE-2026-93577, CVSS 9.9, 2026-09-23); gitlab-security record feed URL https://about.gitlab.com/security-releases.xml listed the 2026-09-23 release -> primary: https://docs.gitlab.com/releases/patches/patch-release-gitlab-19-4-1-released/ -> WebSearch ('CVE-2026-89078 GitLab regular expression double free CI/CD') found only aggregator echoes (stack.watch, opencve) and Japanese trade-press relays, no exploitation reporting"
    summary: |
      GitLab's critical patch release of 2026-09-23 fixes CVE-2026-89078, a double free in the regular-expression parser, and CVE-2026-93577, an integer overflow in the regular-expression compiler. In both, an authenticated user who submits a specially crafted regular expression in a CI/CD configuration can execute arbitrary code on the GitLab server; GitLab rates both CVSS 9.9 (AV:N/AC:L/PR:L/UI:N/S:C, impact C:H/I:H with A:L for 89078 and A:H for 93577). Affected: GitLab CE/EE from 19.2 before 19.2.7, 19.3 before 19.3.3 and 19.4 before 19.4.1; earlier branches are not listed. Both were reported through HackerOne by the same researcher (joaxcar), who also reported CVE-2026-84739 (merge-request diff viewer stored XSS, 8.7). GitLab.com already runs the fix and Dedicated customers need no action; self-managed instances must upgrade. GitLab states no exploitation; the issue tracker details become public 90 days after release; a WebSearch of the CVE id found no PoC or KEV listing as of 2026-10-11 (search-engine summary, not a primary). Separately, GitLab AI Gateway critical patch 19.4.1 / 19.3.2 / 19.2.4 (2026-10-02) fixes CVE-2026-90970, an authenticated Duo Agent Platform user escaping the prompt-template sandbox through a crafted flow configuration to run commands on the AI Gateway (CVSS 9.9; affected 18.1.6 before 19.2.4, 19.3 before 19.3.2, 19.4 before 19.4.1).
