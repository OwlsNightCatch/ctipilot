    summary: |
      HPE Networking's advisory HPESBNW05158 of 2026-10-06 (revision 1, severity Critical, status FINAL) fixes 28 CVEs in ClearPass Policy Manager (CPPM), the network access control and RADIUS/TACACS+ policy server, and its OnGuard agent and client software. Nine are CVSS 9.8 or 9.9. Unauthenticated network-reachable at 9.8: CVE-2026-76750 (deserialization of untrusted data in the web interface, remote code execution), CVE-2026-76752 (authentication bypass in the web management and API interfaces giving administrative access), CVE-2026-79796 (a second authentication bypass), CVE-2026-76753 (format string, memory corruption, code execution), CVE-2026-76754 (unauthenticated SQL injection leading to RCE), CVE-2026-76751 and CVE-2026-79801 (missing integrity verification in the OnGuard agent and client, unauthenticated RCE on the endpoint with the agent's elevated privileges), and CVE-2026-79805 (path traversal rated 9.8 although titled authenticated). CVE-2026-79798 is an authenticated SQL injection at 9.9 (low-privileged account, scope changed). Further high items include authenticated path traversal to RCE (CVE-2026-79800), authenticated command injection in the API (CVE-2026-79803) and an unauthenticated path traversal leading to authorization bypass (CVE-2026-79809, 7.3). Affected: CPPM 6.14.0 and below and 6.11.15 and below; fixed in 6.14.1 and above and 6.11.16 and above (HPE downloads at the networking support portal); end-of-maintenance releases are presumed affected and not covered. HPE says the flaws were found by internal research, that it is not aware of public discussion or exploit code, and urges patching because of the complexity, breadth and impact. The vendor workaround is to restrict the CLI and web-based management interfaces to a dedicated layer 2 segment or VLAN and/or control them with layer 3+ firewall policy. No exploitation, KEV listing or actor is reported.
