    extended_notes: |
      The full CVE table (28 ids, CVSS 5.3 to 9.9; ten rated Critical, the tenth being the 9.1 authenticated SQL injection CVE-2026-79794) is in the advisory's Details section; the remaining ids are CVE-2026-79797/79799/79802 (8.8), 79806/79807/79808 (7.8), 79810/79811 (7.2), 79812-79818 (client and OnGuard local or XSS items). Companion HPE advisories of the same day cover AOS-S (HPESBNW05156) and the 2026-09-29 Instant On release (HPESBNW05150). The earlier ClearPass advisory relayed by the Canadian Centre for Cyber Security (AV26-909, 2026-09-10) covered 6.11.14 and 6.12.8; not fetched here.
