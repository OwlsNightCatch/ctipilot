  - title: "HPE Networking Instant ON access points (HPESBNW05150): two unauthenticated remote 9.8 flaws and three adjacent-network 9.6 RCE/auth-bypass flaws, fixed in Instant ON 3.4.2.0"
    source_record: hpe-networking-psirt
    published: "2026-09-29"
    sources:
      - { url: "https://csaf.arubanetworking.hpe.com/2026/hpe_networking_-_hpesbnw05150.txt", publisher: "HPE Networking PSIRT (HPESBNW05150)", date: "2026-09-29", role: "primary" }
    discovery_trace: "first seen at: coordinator scope addendum (HPE Aruba Instant On CVE-2026-76723/76724/76725, CVSS 9.6, 2026-09-29) -> WebSearch ('HPE Aruba Instant On CVE-2026-76723 CVE-2026-76724 CVE-2026-76725 security advisory') named HPESBNW05150 via secondary coverage -> listing https://csaf.arubanetworking.hpe.com/2026/ -> primary: https://csaf.arubanetworking.hpe.com/2026/hpe_networking_-_hpesbnw05150.txt"
    summary: |
      HPESBNW05150 (2026-09-29, revision 1, Critical) fixes 18 CVEs (CVE-2026-76721 to CVE-2026-76738) in HPE Networking Instant ON access points, versions 3.4.1.0 and below; the fix is Instant ON 3.4.2.0 and above, which the Instant On cloud management portal applies to the APs automatically. The coordinator's three ids are adjacent-network, not internet-reachable: CVE-2026-76723 (unauthenticated adjacent buffer overflows to RCE, CVSS 9.6, vector AV:A/S:C), CVE-2026-76724 (unauthenticated adjacent command injection in the CLI reached over the PAPI protocol, 9.6) and CVE-2026-76725 (authentication bypass in a management protocol leading to RCE with elevated privileges, 9.6). Two further flaws are network-reachable and unauthenticated at 9.8: CVE-2026-76721 (buffer overflow leading to code execution as a privileged user) and CVE-2026-76722 (format-string flaws leading to RCE or DoS); CVE-2026-76726 (authentication bypass in the Instant On API endpoint, 8.1) is high. The vendor workaround is to restrict web-based management to a dedicated layer 2 segment or VLAN and/or firewall it. HPE says the findings are internal and that it knows of no public discussion or exploit code.
