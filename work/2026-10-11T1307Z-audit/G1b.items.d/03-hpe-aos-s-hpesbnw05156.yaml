    discovery_trace: "first seen at: hpe-networking-psirt record, listing URL https://csaf.arubanetworking.hpe.com/2026/ (autoindex, entries modified since 2026-09-25: hpesbnw05150, 05156, 05158) -> primary: https://csaf.arubanetworking.hpe.com/2026/hpe_networking_-_hpesbnw05156.txt"
    summary: |
      HPESBNW05156 (2026-10-06, revision 1, severity Critical) fixes eight CVEs in HPE Networking AOS-Switch (AOS-S, the former ProVision campus and access switch software). Three are CVSS 9.8 unauthenticated and network-reachable: CVE-2026-76742 (authentication bypass in the web management interface), CVE-2026-76743 (authentication bypass in the management interface) and CVE-2026-76744 (unauthenticated buffer overflows leading to remote code execution). Two further items are unauthenticated but adjacent-network: CVE-2026-76745 (CVSS 9.6, memory corruption leading to RCE) and CVE-2026-76746 (9.3, buffer overflow leading to information disclosure). Lower items: authenticated privilege escalation in the API (CVE-2026-76748, 8.8), authenticated buffer-overflow DoS (CVE-2026-76741, 6.5) and unauthenticated sensitive information disclosure (CVE-2026-76749, 6.5). Affected: AOS-S 16.11.0031 and below; fixed in 16.11.0032 and above; end-of-maintenance releases are presumed affected and not assessed. The vendor workaround is to restrict the web-based management interfaces to a dedicated layer 2 segment or VLAN and/or firewall them at layer 3 and above. HPE says the flaws came from internal research and that it knows of no public discussion or exploit code.
