    summary: |
      WatchGuard published about 20 advisories between 2026-09-28 and 2026-10-01 (plus AuthPoint Gateway CVE-2026-95676 on 2026-09-23); each states that WatchGuard is not aware of exploitation in the wild. The highest-severity items: on WatchGuard Access Points, CVE-2026-101891 (CVSS 9.3) is an improper access control in an internal API service that lets an unauthenticated attacker with network access to the AP obtain a valid API session, and CVE-2026-86102 (9.3) is an OS command injection in the AP's internal API service that lets an attacker with network access run shell commands; chained they give unauthenticated command execution on the AP (WatchGuard does not state the chain; AP 3.4.8 fixes both, 1.0 to before 3.4.8 affected), and CVE-2026-87969 (8.6) is an authenticated command injection in the diagnostic CLI. On the Firebox (Fireware OS, fixed in 2026.3.2, 2026.2.3, 12.12.3 and T15/T35 12.5.21): CVE-2026-86131 (9.2) lets an attacker who controls the remote BOVPN-over-TLS server execute commands as root on the connecting Firebox; CVE-2026-81433 (8.7) is a stack overflow in the DHCP-fingerprinting daemon fingerd reachable by an unauthenticated attacker with adjacent network access (code execution or crash; fixed in 2026.3.2, 2026.2.3, 12.12.3, not T15/T35); CVE-2026-18145 (8.6, administrator-authenticated spamd overflow) and CVE-2026-13046 (7.5, deserialization in the SAML samld service for an attacker who can already write files; also fixed in 12.11.10 for EUCC) are code-execution items with preconditions; CVE-2026-86134 (8.7), CVE-2026-86104 (8.7), CVE-2026-86132 and CVE-2026-86133 (8.2) and CVE-2026-86128 (8.2) are remote DoS flaws (pre-auth in the login interface, the IKEv2 daemon and NetFlow IPv6 handling); CVE-2026-86101 (7.2) lets a SAML Access Portal user obtain Mobile VPN with SSL access; CVE-2026-13224 (8.2, administrator path traversal read), CVE-2026-86105, CVE-2026-90441, CVE-2026-86136 and CVE-2026-18105 are authenticated flaws. CVE-2026-13043 (9.3, 2026-10-01) is a local authenticated bypass of the access-control handshake of the PSKMAD kernel memory access driver in WatchGuard Endpoint Security (fixed in 8.00.26.0012), not network-reachable. The earlier Fireware 2026.3.1 batch (iked pre-auth RCEs) was covered separately.
    region_nexus: "global; NCSC Switzerland relayed the AP flaws on 2026-09-29 (advisory 13007); Firebox is a common perimeter firewall in Swiss communal and cantonal networks (profile context, not stated by the vendor)"
