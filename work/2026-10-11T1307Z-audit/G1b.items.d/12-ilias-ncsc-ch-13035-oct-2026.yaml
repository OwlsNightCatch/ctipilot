  - title: "ILIAS learning management system: October 2026 security release fixes several remote code execution flaws (test, CmiXapi and question imports) and an anonymous protected-file download, per NCSC Switzerland"
    source_record: off-slice (found via NCSC-CH `ncsc-csh recent 60`; ILIAS is not in the G1b slice)
    published: "2026-10-07"
    sources:
      - { url: "https://security-hub.ncsc.admin.ch/#/posts/13035", publisher: "NCSC Switzerland (Cyber Security Hub advisory 13035)", date: "2026-10-07", role: "primary" }
    discovery_trace: "first seen at: `python3 tools/fetch_source.py ncsc-csh recent 60` (post 13035, 2026-10-07) -> post body read with `ncsc-csh post 13035`; its primary reference, the ILIAS security blog advisory at docu.ilias.de, is behind a session/captcha wall (extract returned a 404 page and a captcha page) and could not be read. WebSearch ('ILIAS Sicherheitslücken Oktober 2026 ...') surfaced an OpenCVE echo of CVE-2026-107639 (image-map question upload, branches 9.x before 9.24, 10.x before 10.12, 11.x before 11.5) that was not fetched and is not cited."
    summary: |
      NCSC Switzerland's advisory 13035 of 2026-10-07 reports that multiple vulnerabilities were fixed in the open-source learning management system ILIAS, including several remote code execution flaws reachable through test, CmiXapi (xAPI content) and question imports, and a flaw that lets anonymous users download protected file objects when the public area is enabled; further fixes cover stored XSS, broken access control, path traversal file deletion and unauthenticated user enumeration. NCSC-CH states that the RCE flaws generally require an authenticated user while the file disclosure requires the public area feature, lists the exploitation status as unknown and the mitigation as vendor patches; it names no CVE ids, fixed versions or CVSS scores, and the vendor advisory could not be read. The store already tracks ILIAS (two earlier entries: 2026-05-28 nine fixes, 2026-06-23 unpatched PoC SQL injection in 11.0); NCSC-CH's issuing of a dedicated advisory marks it as relevant to the Swiss constituency.
