    extended_notes: |
      Exposure checks the advisories give: `show feature | include nxapi`, `show feature | include mpls_oam`, `show feature | include ngoam` (plus srv6 and nve for CVE-2026-76486 / 76501) on the NX-OS CLI. Attack surface per the advisories: a crafted HTTP request to the NX-API, a crafted MPLS echo-request to an IP address of the switch, crafted IP packets to a switch with NGOAM enabled; process crashes and device reloads are the DoS side effect. Researcher credit on the main SSM On-Prem advisory: Gabriele Paris of NATO Cyber Security Centre (CVE-2026-20328, -76437, -76452) and Trung Nguyen of CyStack (CVE-2026-76454). Press echoes (heise, SecurityWeek) are listed in NCSC-CH's advisory; not fetched. Also consider the pre-window 2026-09-04 store entry on Nexus 9000 Silicon One RCE (CVE-2026-20212) as related context.
