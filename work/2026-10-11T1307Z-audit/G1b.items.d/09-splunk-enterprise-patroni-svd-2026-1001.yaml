  - title: "Splunk Enterprise SVD-2026-1001: unauthenticated OS command execution through the Patroni REST API on search head cluster members (CVE-2026-76268, CVSS 9.8), fixed in 10.4.3 and 10.2.7"
    source_record: splunk-advisories
    published: "2026-10-07"
    sources:
      - { url: "https://advisory.splunk.com/advisories/SVD-2026-1001", publisher: "Splunk Vulnerability Disclosure (SVD-2026-1001)", date: "2026-10-07", role: "primary" }
    discovery_trace: "first seen at: splunk-advisories record, listing URL https://advisory.splunk.com/advisories (extract: SVD-2026-1001 to -1005 dated 2026-10-07, SVD-2026-1001 marked Critical) -> primary: https://advisory.splunk.com/advisories/SVD-2026-1001 (per-CVE table and CVE Details read in full)"
    summary: |
      Splunk's 2026-10-07 release SVD-2026-1001 fixes 17 CVEs in Splunk Enterprise 10.4.3, 10.2.7, 10.0.10 and 9.4.15 (affected: 10.4.0 to 10.4.2, 10.2.0 to 10.2.6, 10.0.0 to 10.0.9, 9.4.0 to 9.4.14). One is critical: CVE-2026-76268 (CWE-306, CVSS 3.1 9.8, AV:N/AC:L/PR:N/UI:N), where an unauthenticated user with network access to the Patroni REST API on a search head cluster member can execute attacker-controlled operating-system commands because the interface requires no authentication for critical configuration operations. Only Splunk Enterprise below 10.4.3 and below 10.2.7 is affected; 10.0.x and 9.4.x are not. Splunk's mitigation is to disable the PostgreSQL sidecar (`disabled = true` in the `[postgres]` stanza of server.conf under $SPLUNK_HOME/etc/system/local, then restart) if Edge Processor, OpAmp or SPL2 data pipelines are not used. Splunk credits an internal finder (Gabriel Nitu) and states no exploitation. The rest of the release is authenticated: local privilege escalation through Linux package upgrades (CVE-2026-76266, 7.7), and medium access-control, injection and SSRF items in the REST API, Secure Gateway and the Observability Cloud apps; four CVEs (CVE-2026-76264, -76265, -76272, -76280) need additional configuration steps after the upgrade (for CVE-2026-76264, `scripted_lookup_raw_write_enforcement = block` in limits.conf under [lookup]). The same day Splunk published third-party package updates for Enterprise and the AWS add-on (SVD-2026-1003, -1005, rated Critical for the bundled components), a hardening release (SVD-2026-1002) and a medium MCP Server flaw (SVD-2026-1004, CVE-2026-76286).
