    discovery_trace: "first seen at: gitlab-security record feed URL https://about.gitlab.com/security-releases.xml (two critical releases dated 2026-09-23) -> primary: https://docs.gitlab.com/releases/patches/patch-release-gitlab-19-0-9-released/ ; store check: entries/2026-09-12/cve-2026-85706-gitlab-unauth-path-traversal-file-read.md lists fixed 19.1.8 / 19.2.6 / 19.3.2 only"
    summary: |
      GitLab's 2026-09-23 critical releases 19.0.9 and 18.11.12 contain exactly the security fixes shipped on 2026-09-10 in 19.1.8, 19.2.6 and 19.3.2, backported for self-managed installations that cannot immediately move to 19.1 or later: CVE-2026-85706 (unauthenticated path traversal in the repository commits API, arbitrary file read, CVSS 10.0, in the CISA KEV catalog since 2026-09-11 per GitLab's post) and CVE-2026-87719 (GraphQL subscription deserialization, EE, CVSS 9.9). GitLab's impacted-versions line for CVE-2026-85706 now reads all versions from 18.7 before 18.11.12, 19.0 before 19.0.9, 19.1 before 19.1.8, 19.2 before 19.2.6 and 19.3 before 19.3.2, so operators on the 18.11 and 19.0 branches finally have a same-branch fixed build. GitLab also publishes three LFI detections for self-managed instances (reads of gitlab.yml, the metadata.path parameter, path enumeration). The covering entry's `fixed` fields name only 19.1.8 / 19.2.6 / 19.3.2.
