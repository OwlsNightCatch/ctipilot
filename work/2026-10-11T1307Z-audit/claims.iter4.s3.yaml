- claim_id: 72e039115c
  entry: 2026-09-24/microsoft-entra-id-sspr-enumeration-resetspy
  surface: body
  kind: cited
  text: '**Detection:** Entra ID / Azure AD self-service-password-reset audit events are the telemetry class — specifically SSPR activity records with status failures such as "user is not member of the
    password reset users group", and bulk enumeration attempts: many requests in a short window across varied usernames with no subsequent completed reset ('
  urls:
  - https://www.levelblue.com/blogs/spiderlabs-blog/enumerating-users-and-mfa-via-microsofts-password-reset-portal
- claim_id: 8fbe4b2880
  entry: 2026-09-24/microsoft-entra-id-sspr-enumeration-resetspy
  surface: body
  kind: cited
  text: '**Triage:** a genuine user forgetting a password generates one SSPR lookup that is normally followed by a completed reset; a burst of lookups against many usernames with no completions is the anomalous
    pattern the volume/velocity discriminator is built on, not the existence of lookups themselves ('
  urls:
  - https://www.levelblue.com/blogs/spiderlabs-blog/enumerating-users-and-mfa-via-microsofts-password-reset-portal
- claim_id: e2c4328926
  entry: 2026-09-24/microsoft-entra-id-sspr-enumeration-resetspy
  surface: body
  kind: cited
  text: '**Defender takeaway:** scope SSPR to a specific security group rather than tenant-wide to shrink the enumerable population, knowing that scoping does not stop existence enumeration and exposes
    the registered methods, or the empty method list, of every in-scope account, remove alternate-email-OTP and security-question options from the permitted SSPR methods, and enforce phishing-resistant
    MFA on every privileged role — since Microsoft cannot let admin accounts opt out of the underlying enumeration, a stronger factor on those accounts is the control that actually removes the value of
    what the technique reveals ('
  urls:
