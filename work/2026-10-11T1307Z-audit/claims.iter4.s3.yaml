- claim_id: d0327e3f54
  entry: 2026-09-24/microsoft-entra-id-sspr-enumeration-resetspy
  surface: summary
  kind: frontmatter
  text: LevelBlue (Trustwave) SpiderLabs documents that Microsoft's public, unauthenticated Self-Service Password Reset (SSPR) portal at passwordreset.microsoftonline.com discloses, via a hidden state field
    in its own response, whether a submitted email address belongs to a real Entra ID account, which second-factor methods that account has registered, and — because Microsoft enforces SSPR for administrators
    regardless of tenant policy — whether the account is likely privileged. The researcher released a public automation tool, ResetSpy, and Microsoft removed the portal's visual CAPTCHA in August 2026 in
    favor of backend throttling and behavior-based abuse detection.
- claim_id: cd6c8a1ca1
  entry: 2026-09-24/microsoft-entra-id-sspr-enumeration-resetspy
