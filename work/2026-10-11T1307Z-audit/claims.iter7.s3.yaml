- claim_id: 0fd094aafb
  entry: 2026-05-08/amazon-ses-weaponised-for-authenticated-phishing-and-bec-kas
  surface: summary
  kind: frontmatter
  text: Kaspersky reports an uptick since January 2026 in phishing sent through legitimate Amazon Simple Email Service (SES) accounts, accessed with leaked AWS IAM keys harvested from public repositories,
    ENV files, Docker images, configuration backups and open S3 buckets. The mail passes SPF, DKIM and DMARC and comes from sender IPs reputation blocklists will not block; lures include fake e-signature
    notices leading to sign-in forms on amazonaws.com and a fabricated invoice thread sent to a finance department.
