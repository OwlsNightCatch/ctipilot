  text: 'Most of the headline figures had no source: 330 was the number of defaced login portals, not institutions; six countries, 16 million records, 44 Dutch institutions confirmed as victims and German
    or Dutch regulator inquiries appear nowhere (the 44 are names on the actor''s own list); the actor is ShinyHunters, not WorldLeaks, and no EUR 3.2 million demand, 3 GB sample or LTI service-account
    vector was reported. The entry is rewritten from its sources, the earlier sections are corrected in place (dates of the second notice and the agreement, Instructure''s statement that the agreement covers
    all customers, unsupported UK university statements and speculation removed), the dead SURF source is dropped, and the entry gains its rating and ATT&CK mapping. Priority moves from high to notable.
    NL Times is added as the source for the seven Dutch universities that disconnected Canvas. The agreement sentence is cited to Inside Higher Ed alone, the Dutch disconnections to NL Times, and the Free-for-Teacher
    attribution in the 2026-05-09 section is marked as a later statement.'
