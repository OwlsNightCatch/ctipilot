- claim_id: ded484603a
  entry: 2026-05-08/instructure-canvas-extortion-330-institutions-across-six-cou
  surface: summary
  kind: frontmatter
  text: ShinyHunters stole names, email addresses, student IDs and messages from Instructure's Canvas through a vulnerability in its Free-for-Teacher system, claiming about 275 million records from about
    8,800 schools, then defaced about 330 school login portals through the same flaw on 2026-05-07. Seven Dutch universities disconnected Canvas. Instructure announced an agreement with the actor on 2026-05-11,
    and a US House committee requested a briefing.
