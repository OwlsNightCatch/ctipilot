  text: 'The headline victimology was wrong: no EU government victim is reported; EU countries appear only among infection attempts, the backdoor reached about a dozen machines in Russia, Belarus and Thailand,
    and QUIC RAT one educational institution in Russia. Kaspersky does not describe keylogging, SOCKS proxying or tunnelling for QUIC RAT, does not attribute the attack, and calls the intent unclear; the
    Linux masquerade and asymmetric-cryptography mappings had no source. The Securelist report becomes the primary source, the detection line leads with the helper-to-PowerShell download chain, the espionage
    and China-nexus tags are removed, and the entry gains a rating and a supported ATT&CK mapping. Priority moves from high to notable. The startup behaviour and the Detection line now lead with the backdoor''s
    beacon to a typosquatted vendor domain, which precedes any cmd.exe execution.'
