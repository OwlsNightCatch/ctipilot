  entry: 2026-09-17/cve-2026-76460-cisco-ise-auth-bypass-root-rce
  surface: summary
  kind: frontmatter
  text: 'Cisco disclosed CVE-2026-76460 (CVSS 10.0) on 2026-09-16: an unauthenticated, remote authentication bypass in a Cisco Identity Services Engine (ISE) and ISE-PIC API endpoint, affecting every release
    regardless of configuration, that Cisco found during the resolution of a Cisco TAC support case and confirms is under active exploitation. A same-day sibling, CVE-2026-76423 (also CVSS 10.0, not yet
    confirmed exploited), removes the same authentication boundary via a separate endpoint. There is no workaround; only infrastructure ACLs mitigate.'
- claim_id: d23bce4cf9
  entry: 2026-09-17/cve-2026-76460-cisco-ise-auth-bypass-root-rce
  surface: immediate_action
  kind: frontmatter
  text: 'Restrict ISE management-plane access now and hunt for exploitation: Apply infrastructure ACLs today to permit only required management/control-plane traffic to every internet- or network-reachable
    Cisco ISE / ISE-PIC node, then upgrade to the fixed release on the fastest available maintenance window — there is no other mitigation. Because successful exploitation reaches root, treat the appliance''s
    own logs as untrustworthy for ruling out compromise: cross-check network and firewall logs outside the ISE node for uploads initiated from the device to external IP addresses or downloads from malicious
    IP addresses, in addition to reviewing access.log for suspicious usernames on the affected API endpoint. Re-image any node where malicious activity is suspected and restore from configuration backup.'
