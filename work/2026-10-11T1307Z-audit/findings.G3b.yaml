    discovery_trace: "first seen at: truesec, URL https://www.truesec.com/hub/blog/feed/ (item dated 2026-09-29) -> https://www.truesec.com/hub/blog/danish-intelligence-services-raises-threat-for-destructive-cyberattacks -> WebSearch (\"SAMSIK trusselsniveau destruktive cyberangreb hævet Forsvarets Efterretningstjeneste september 2026\") -> primary: SAMSIK press release https://via.ritzau.dk/pressemeddelelse/15180895/truslen-fra-destruktive-cyberangreb-haeves-til-hoj?lang=da (dated 2026-09-24 11:47 CEST)"
    summary: |
      Denmark's Styrelsen for Samfundssikkerhed (SAMSIK) announced on 2026-09-24 that it raises the threat level for destructive cyberattacks against Denmark from medium to high, assessing it as likely that Russia will try them. It cites the Defence Intelligence Service (FE), which expects Russia to intensify hybrid warfare against the West and NATO in the coming months, and the Security and Intelligence Service (PET), which has found concrete Russian planning and preparation of sabotage against Denmark. SAMSIK says destructive attacks most often appear as wipers that delete or overwrite data, or as manipulation of operational technology, recalls the late-2024 compromise of a small Danish waterworks' control system that left about 450 households without water, and notes a December 2025 attempted destructive attack on the Polish energy sector that the Polish government attributes to Russia. It urges authorities and critical-infrastructure operators to take measures matching the raised threat and links a threat assessment and OT protection guidance. Truesec (secondary) restates the warning, adds its own assessment that Russian hacktivism and influence operations (DDoS, CCTV compromise, manipulation of small, less protected infrastructure components) are likely to become more frequent and disruptive while cybercrime remains the most common threat for most organizations, and that direct military action against a NATO member remains unlikely but cannot be fully excluded. Primary dated 2026-09-24, three days before the extended window start.
    region_nexus: "Denmark; Europe-wide hybrid-threat context (Poland cited)"
