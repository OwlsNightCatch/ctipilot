    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: "update-of:2026-05-28/crowdstrike-google-and-shadowserver-simultaneously-sever-all"
    exposure_hint: "Developer machines or build images that install VS Code extensions from the Marketplace or Open VSX without an allow-list; theme extensions can contain executable JavaScript and VS Code has no granular permission controls for them (Socket)."
