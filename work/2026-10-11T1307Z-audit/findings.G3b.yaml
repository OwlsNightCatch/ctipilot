    confidence: MEDIUM
    novelty: "update-of:2026-10-04/chatgpt-custom-gpt-clickfix-sideloaded-in-memory-rat"
    novelty_note: "The existing entry (Huntress only) covers the Custom GPT strand; the delta is Push's independent sighting plus the distinct InstallFix cluster and the Adception ad-destination trick. If the main agent prefers a separate entry for InstallFix/Adception, it should reference the 2026-10-04 entry."
    exposure_hint: "Users who install AI command-line tools or desktop clients by following search ads; macOS Terminal one-liners and Windows Run-dialog PowerShell are the two execution surfaces named."
    detection_hint: "Process-creation telemetry: a shell launched from a user paste whose command contains a base64 decode via openssl piped to zsh, or powershell with execution-policy bypass downloading over plain HTTP from a numeric or decimal-encoded host; web-proxy telemetry: sponsored-search landing chains with a bing.com click-tracker hop and a referrer-gated 404 on the final page."
    evidence:
      - { quote: "Instead of presenting the malicious command to the user, the rendered visual is of the real Claude install command, but with the malicious command copied to clipboard.", attribution: "Push Security", source_url: "https://pushsecurity.com/blog/analyzing-the-latest-ai-themed-malware-delivery-attacks" }
