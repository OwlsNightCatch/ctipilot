  - title: "Leaked DarkSword iOS exploit chain served from a fake iPhone Duo preorder page (Malwarebytes): opening the page is enough to attempt the exploit against unpatched iPhones"
    source_record: malwarebytes
    published: "2026-09-29"
    sources:
      - { url: "https://www.malwarebytes.com/blog/threat-intel/2026/09/fake-iphone-duo-preorder-scam-triggers-darksword-attack", publisher: "Malwarebytes", date: "2026-09-29", role: "primary" }
    discovery_trace: "first seen at: malwarebytes, URL https://www.malwarebytes.com/blog/feed/ (working RSS, newest-first 20 items back to 2026-10-01) -> weekly roundup https://www.malwarebytes.com/blog/news/2026/10/a-week-in-security-september-28-october-4-2 (via WebFetch, link list) -> primary: https://www.malwarebytes.com/blog/threat-intel/2026/09/fake-iphone-duo-preorder-scam-triggers-darksword-attack (read with extract)"
    summary: |
      Malwarebytes reports that a fake preorder page for Apple's announced foldable iPhone (preorders not open until 16 October) uses the leaked DarkSword exploit chain, so that merely opening the page in Safari starts an attempt to compromise a vulnerable iPhone; an invisible frame checks the iOS version and selects the code to load, and the page tries to reopen links in Safari. If the exploit succeeds, a payload contacts its server with device information, an app list and Apple Notes content, looks for cryptocurrency wallets (MetaMask, Phantom, Trust Wallet, Coinbase Wallet, Exodus, Tonkeeper), tries to recover keychain credentials, can list and fetch files and photos, run server-supplied JavaScript and delete diagnostic reports; Malwarebytes found no reboot persistence. Malwarebytes says parts of the code match the DarkSword chain Google described in March 2026, that Apple has patched the reported vulnerabilities and that Apple says updated devices are protected; it did not confirm the exact iOS range the page covers (its files also contain code for older iOS versions), and it analyzed the captured code without testing it on an iPhone or observing data leave one. Single vendor source; this is a drive-by delivery of a previously disclosed, patched chain, so exposure is limited to devices that have not taken the earlier fixes.
    region_nexus: "global (scam page; no regional targeting stated)"
    primary_sector_nexus: "indirect (managed and personal iPhones used by staff; fleets on current iOS are protected per Apple)"
    sector: "cross-sector"
    cves: []
    techniques: [T1189, T1203, T1555.001, T1005, T1070]
    affected_products: ["Apple iOS", "Apple Safari"]
