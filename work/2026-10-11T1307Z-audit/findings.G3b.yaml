  - title: "Technical University of Denmark (DTU): intruders used compromised user profiles to reach DTUBasen, the identity and access management system, and downloaded personal data back to 2003 for up to 200,000 current and former users"
    source_record: truesec
    published: "2026-10-02"
    sources:
      - { url: "https://www.dtu.dk/english/NewsArchive/2026/10/Cyberattack-on-DTU_Notification-of-a-personal-data-breach", publisher: "Technical University of Denmark (DTU)", date: "2026-10-02", role: "primary" }
