    discovery_trace: "first seen at: push-security, URL https://pushsecurity.com/blog (raw `url` fetch of the undated listing, slug list newest first) -> extract of https://pushsecurity.com/blog/analyzing-the-latest-ai-themed-malware-delivery-attacks (date 2026-10-09) -> pivot: https://pushsecurity.com/blog/adception-malvertising-another-search-engines-search-results (date 2026-10-09) -> primary (no further pivot; Huntress and Island write-ups it builds on were not fetched)"
    summary: |
      Push Security reports two clusters of AI-themed attacks it tracks, both delivered mainly through search engines (Push says 4 in 5 ClickFix pages it intercepts are reached from search, and AI-themed attacks were about 5 percent of its detections in its last quarterly snapshot). Cluster 1 "InstallFix": a Google sponsored result for "claude mac" displays bing.com as its domain; the click goes through Google's ad redirect to a Bing click-tracking link, which forwards to a compromised retailer page, whose server-side 302 requires a Bing referrer and certain browser headers, and on to a fake "Download Claude" page that sends anything without a Google or Bing referrer to a 404. The page renders the genuine Claude install command but copies a different command to the clipboard. The macOS command first prints the official-looking download line, then fetches a payload from a base64-encoded URL decoded at run time with openssl and pipes it straight into zsh without writing it to disk. Push links the pages to a criminal ClickFix toolkit it tracks as "AcSig" (it requires HMAC-bearing headers to fetch the command). Push calls the Bing-in-a-Google-ad redirect "Adception" and says it found no earlier public reporting of a search-engine result used as a search ad's destination. Cluster 2 "LLMshare": shared ChatGPT Custom GPTs push a fake service-availability error with a link to a ClickFix page on Google Sites; Push assesses this continues the campaign Huntress and Island reported (Push relays their correlation of 850 paid ads, 71 Google Ads campaign IDs and 26 GPT pages) and shows a Windows command that runs PowerShell with execution policy bypass and downloads a script over plain HTTP from a decimal-encoded IP address. Push's own tradecraft assessment: visual obfuscation of the clipboard command defeats checks that read the on-screen text, and Custom GPTs resemble normal use because the instruction or link is only served after the visitor interacts with the GPT. Single vendor source (own browser telemetry); the Custom GPT strand is independently covered by Huntress, already in the store.
    region_nexus: "global"
    primary_sector_nexus: "indirect (staff adopting AI command-line tools such as Claude Code or Codex from search results; applies to administrations with developer and power-user populations)"
    sector: "cross-sector"
