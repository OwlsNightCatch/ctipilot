    discovery_trace: "first seen at: truesec, URL https://www.truesec.com/hub/blog/feed/ (item dated 2026-10-06, which also covers the CPR incident already in the store) -> https://www.truesec.com/hub/blog/recent-danish-pii-exposures-increase-risk-of-targeted-phishing-campaigns -> WebSearch (\"DTU DTUBasen hackerangreb 200.000 personers data\") -> primary: DTU notice https://www.dtu.dk/english/NewsArchive/2026/10/Cyberattack-on-DTU_Notification-of-a-personal-data-breach (dated 2026-10-02)"
    summary: |
      DTU states it identified a serious personal data breach in DTUBasen, its identity and access management system: in a targeted cyberattack unauthorised persons compromised DTU profiles and used them to access the system and download a large amount of data dating back to 2003. DTU says its incident response team has contained the attack, external specialists are investigating, the Danish Data Protection Agency was notified, and it cannot determine precisely what was downloaded or how many people are affected; DTUBasen holds records for about 40,000 active and 160,000 former users. For active users the data may include the Danish civil registration (CPR) number, full name, home address, profile picture, work email, job title, office location and next-of-kin details; for former users addresses, photos and next-of-kin are deleted after six months but CPR numbers and full names remain. DTU warns the data could support identity fraud and more convincing phishing. Truesec (secondary) pairs this with the Danish CPR register incident (already in the store as the Denmark CPR entry) and assesses that both enlarge the pool of Danish personal data available for targeted phishing and impersonation, recommending that service desks validate reports without asking users for authentication secrets. Primary victim statement; initial access beyond "compromised DTU profiles" is not stated.
