    summary: |
      The Record (Recorded Future News) reports on a chat archive posted to a bespoke .onion site in early October 2026 by an unidentified source with no stated motive, containing thousands of messages from August 2025 to September 2026 that it attributes to the Silent Ransom Group (also tracked as Luna Moth and Chatty Spider). Recorded Future News says the archive mixes apparent records of real extortion with brainstorming, abandoned plans, boasting and violent fantasies and could not verify whether the most extreme schemes were attempted; Chainalysis, per The Record, tied some cryptocurrency addresses in the leak to known SRG extortions but could not vouch for the whole archive. Content reported: members track dozens of victims through a sales-pipeline structure, discussed sending paid "agents" into law-firm offices (including a delivery-uniform ruse to pass reception and then pose as IT staff, masks modelled on real lawyers, smart glasses to record an office), recruit them through paid Telegram advertisements disguised as ordinary job listings, estimate roughly one in ten recruits as usable, and in one negotiation a New York law firm said it knew someone had entered its office and copied files to a flash drive. The group's own claimed settlements across the firms marked "gold" total roughly 200 million US dollars, which The Record says it could not verify. Truesec's note (secondary) frames this as criminal groups copying Russian intelligence-service recruitment of disposable agents via Telegram and as a blurring of cyber and physical threats. The store carries the FBI FLASH on SRG physical USB intrusions (2026-05-28) and the Luna Moth vishing-to-physical-access entry (2026-06-06); the leaked archive is a new, unverified insider view of the same tradecraft.
