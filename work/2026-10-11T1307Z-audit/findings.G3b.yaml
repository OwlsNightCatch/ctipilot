    discovery_trace: "first seen at: socket-dev-blog, URL https://socket.dev/blog (Next.js listing cards, and Atom feed https://socket.dev/api/blog/feed.atom) -> primary (no pivot needed): https://socket.dev/blog/glassworm-vscode-themes (read with extract)"
    summary: |
      Socket Threat Research reports a cluster of VS Code theme extensions, four on the Visual Studio Marketplace and six on Open VSX, of which two are confirmed malicious. Git history and source fingerprints tie the live themes to a previously removed, weaponized theme that concealed an obfuscated Windows downloader. Socket analyzed the Marketplace build of "Cosmic Nebula Themes" and confirmed a staged loader that decrypts embedded JavaScript with AES-256-CBC, runs it through eval(), avoids Russian-language and Russian-timezone systems and uses Solana transaction memos as a dead drop to resolve follow-on payload infrastructure; the same Solana address, key and execution model appear in earlier GlassWorm activity, and Socket assesses that build as GlassWorm with high confidence and the wider cluster as GlassWorm-associated. Socket says two other live themes were not weaponized at the time but retain executable code unnecessary for a color theme and had more than 8,000 Marketplace installs, with tens of thousands of downloads across linked Open VSX identities. Socket reports the Marketplace removed the reported extensions shortly after notification. The store carries the May 2026 CrowdStrike/Google/Shadowserver GlassWorm takedown; this is a Socket-reported return of the same loader family in a new lure. Single vendor source.
    region_nexus: "global"
    primary_sector_nexus: "indirect (developer workstations and CI images that install editor extensions)"
    sector: "technology / software development"
