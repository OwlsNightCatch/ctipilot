    techniques: [T1583.008, T1204.004, T1059.004, T1059.001, T1105, T1036]
    affected_products: ["Anthropic Claude (install-page impersonation)", "OpenAI ChatGPT Custom GPTs", "Google Search ads", "Microsoft Bing click-tracking redirect"]
    entity_keys: ["campaign:installfix", "campaign:llmshare-malvertising-chatgpt-share-links-infostealer-google"]
    new_entities:
      - { key: "tool:acsig-clickfix-toolkit", type: tool, name: "AcSig", aliases: [], summary: "Push Security's internal name for a criminal ClickFix toolkit that requires HMAC-bearing request headers to serve the malicious command (Push Security, 2026-10-09)." }
    relation_suggestions:
