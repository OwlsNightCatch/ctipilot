    summary: |
      QUARTERLY REPORT, ReliaQuest "What's Trending: Top Cyber Attacker Techniques, June-August 2026" (reporting period 2026-06-01 to 2026-08-31, ReliaQuest's own investigations). Facts the report states: attackers repeatedly turned phone calls and external Microsoft Teams messages from fake IT support into persistent cloud-account access; in one device-code phishing campaign they registered several devices to compromised Entra ID accounts, each device received a Primary Refresh Token that renewed while the device stayed active, so password resets and session termination left access alive until every unauthorized device registration was removed. ReliaQuest says the extortion group Helix ran SharePoint site-enumeration searches and bulk file-download API calls through the compromised identity, in one case only six minutes after a new MFA method was registered, and that a second, later-compromised account was used only to deliver the Teams extortion message, so looking only at the account that posted the demand misses the theft. ShinyHunters is described as replaying stolen refresh tokens, registering attacker-controlled devices and using legitimate SaaS APIs for bulk collection. On defence evasion, ReliaQuest describes "Gryxa", a financially motivated toolkit that turns legitimate RMM software into persistence spread across at least seven scheduled tasks, a permanent WMI event subscription and a redundant file copy; it checks every five minutes whether it can reach its infrastructure, after two consecutive failures tries to disable Defender and stop EDR products from a hardcoded list, after a third tries to uninstall the security agent, and re-enables Defender afterwards while leaving the exclusions it created; in one environment the visible RMM implant was removed and the toolkit returned within seven days, and a surviving component uploaded logs describing the defenders' response. On lateral movement, an incident ReliaQuest attributes to "Booba" ransomware was staged from an internal virtual machine without an EDR sensor with one compromised local administrator credential and began encrypting within seconds, and a separate intrusion chained external-Teams IT-support impersonation, Quick Assist credential theft, reuse of the credentials on the VPN, then RDP, SMB and Impacket to full domain compromise. The report also states professional, scientific and technical services remained the most named sector on data-leak sites. Assessment note: most identity themes (Helix, ShinyHunters, BlackFile, Teams help-desk impersonation) are already tracked in the store as separate entries; the report's deltas are the Primary-Refresh-Token persistence mechanics, the Gryxa self-rebuilding persistence and EDR-removal sequence, and the no-EDR-VM SMB encryption case. Single vendor source, own telemetry.
