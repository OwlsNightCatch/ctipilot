- claim_id: 753abddf42
  entry: 2026-09-23/virtualizor-billing-hook-unauth-root-rce
  surface: body
  kind: uncited
  text: 'In `enduser/admin.php`, the admin panel (ports 4084/4085) redirects every request to the login page except one: "the redirect that guards the admin panel fires for every action except one.'
- claim_id: 06ded8c14e
  entry: 2026-09-23/virtualizor-billing-hook-unauth-root-rce
  surface: body
  kind: uncited
  text: The `act=login` request that should only reach the login page instead falls through the guard and reaches an unauthenticated `from_billing_module` handler with no session, API key or slave credentials.
- claim_id: b2a553046f
  entry: 2026-09-23/virtualizor-billing-hook-unauth-root-rce
  surface: body
  kind: uncited
  text: 'CVE-2026-43641 (CWE-78 OS command injection) is the flagship: the handler''s `uid` field, taken unvalidated from an unserialized attacker POST body, is concatenated into a shell command inside
    `billing_unsuspend()` → `vexec()` → `proc_open()`, giving remote root command execution.'
- claim_id: 1dcc329294
  entry: 2026-09-23/virtualizor-billing-hook-unauth-root-rce
  surface: body
  kind: uncited
  text: 'Exploitation requires an existing in-house-billing account on the target that is currently suspended and paid up, server state that exists on any install using that billing mode by design, and
    no separate enumeration step is needed because the same request path is a non-destructive timing oracle: injecting a `sleep` payload via the `uid` field hangs the response only for a valid, eligible
    uid.'
- claim_id: 00b380470b
  entry: 2026-09-23/virtualizor-billing-hook-unauth-root-rce
  surface: body
  kind: uncited
  text: The bug additionally needs MySQL's default non-strict `sql_mode`, which VulnCheck confirmed is what Virtualizor's own bundled MySQL 5.5.62 stack ships uncorrected, so this is a default-production
    condition, not a lab artifact.
- claim_id: df8249fc42
  entry: 2026-09-23/virtualizor-billing-hook-unauth-root-rce
  surface: body
  kind: uncited
  text: 'The root-level impact is possible because Virtualizor''s EMPS stack splits PHP execution across separate php-fpm pools by port: the admin-panel `index.php` on ports 4084/4085 runs in a pool that
    executes as root, while the client panel and every other `.php` file run in an unprivileged pool.'
- claim_id: 4221714215
  entry: 2026-09-23/virtualizor-billing-hook-unauth-root-rce
  surface: body
  kind: uncited
  text: The exploit therefore never drops a PHP web shell (which would run unprivileged) and instead relays each command's output to a randomly named static file written into the webroot and served directly
    by nginx.
- claim_id: 30a0f6129f
  entry: 2026-09-23/virtualizor-billing-hook-unauth-root-rce
  surface: body
  kind: uncited
  text: CVE-2026-43642 (CWE-502 PHP object injection) reaches the same unauthenticated handler's native `unserialize()` call on attacker-controlled POST data with no `allowed_classes` restriction; VulnCheck
    demonstrates no working gadget chain in the stock code, but the primitive is live for any add-on or plugin that introduces a class with a `__wakeup` or `__destruct` method.
- claim_id: 14829f9130
  entry: 2026-09-23/virtualizor-billing-hook-unauth-root-rce
  surface: body
  kind: uncited
  text: CVE-2026-43643 (CWE-639 authorization bypass through a user-controlled key) lets an unauthenticated caller zero out or inflate any tenant's account balance through the same handler's `whmcs` branch,
    via a parameterized but unauthenticated balance UPDATE with no ownership check.
