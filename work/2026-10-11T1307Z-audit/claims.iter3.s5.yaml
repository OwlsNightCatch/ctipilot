- claim_id: 75e0aa2417
  entry: 2026-05-09/cve-2026-43284-cve-2026-43500-linux-dirty-frag-deterministic
  surface: summary
  kind: frontmatter
  text: Dirty Frag is two Linux kernel flaws, CVE-2026-43284 in the xfrm-ESP receive path and CVE-2026-43500 in RxRPC, that let a local user write into the page cache of read-only files and gain root deterministically.
    A public exploit appeared on 2026-05-07, mainline and distribution fixes are released, and Microsoft reports limited su-based escalation in the wild that may be Dirty Frag or Copy Fail.
