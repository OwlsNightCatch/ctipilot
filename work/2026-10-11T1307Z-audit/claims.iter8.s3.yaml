  kind: record-summary
  text: 'The six GINA v2 flaws were not all fixed in ''15.0.4 (patch 15.0.4.1)'': CVE-2026-44128 was fixed in 15.0.2.1 and CVE-2026-44126 in 15.0.3, the rest in 15.0.4, and 15.0.4.1 is an unrelated hotfix.
