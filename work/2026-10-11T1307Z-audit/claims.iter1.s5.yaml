- claim_id: b2a553046f
  entry: 2026-09-23/virtualizor-billing-hook-unauth-root-rce
  surface: body
  kind: uncited
  text: 'CVE-2026-43641 (CWE-78 OS command injection) is the flagship: the handler''s `uid` field, taken unvalidated from an unserialized attacker POST body, is concatenated into a shell command inside
    `billing_unsuspend()` → `vexec()` → `proc_open()`, giving remote root command execution.'
- claim_id: 1dcc329294
  entry: 2026-09-23/virtualizor-billing-hook-unauth-root-rce
  surface: body
  kind: uncited
  text: 'Exploitation requires an existing in-house-billing account on the target that is currently suspended and paid up, server state that exists on any install using that billing mode by design, and
    no separate enumeration step is needed because the same request path is a non-destructive timing oracle: injecting a `sleep` payload via the `uid` field hangs the response only for a valid, eligible
    uid.'
- claim_id: 00b380470b
  entry: 2026-09-23/virtualizor-billing-hook-unauth-root-rce
  surface: body
  kind: uncited
  text: The bug additionally needs MySQL's default non-strict `sql_mode`, which VulnCheck confirmed is what Virtualizor's own bundled MySQL 5.5.62 stack ships uncorrected, so this is a default-production
    condition, not a lab artifact.
- claim_id: df8249fc42
  entry: 2026-09-23/virtualizor-billing-hook-unauth-root-rce
  surface: body
  kind: uncited
  text: 'The root-level impact is possible because Virtualizor''s EMPS stack splits PHP execution across separate php-fpm pools by port: the admin-panel `index.php` on ports 4084/4085 runs in a pool that
    executes as root, while the client panel and every other `.php` file run in an unprivileged pool.'
- claim_id: 4221714215
  entry: 2026-09-23/virtualizor-billing-hook-unauth-root-rce
  surface: body
  kind: uncited
  text: The exploit therefore never drops a PHP web shell (which would run unprivileged) and instead relays each command's output to a randomly named static file written into the webroot and served directly
    by nginx.
