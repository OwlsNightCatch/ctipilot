- claim_id: 1b8c1bf425
  entry: 2026-09-21/the-gentlemen-open-directory-vhdx-backup-ntds-theft
  surface: body
  kind: cited
  text: 'The credential-theft step is the chain''s most distinctive detail: the operator mounted a backup share over CIFS, installed `libguestfs-tools`, `qemu-utils` and `nbd-client` to inspect the Windows
    filesystem inside VHDX backup images, copied out `ntds.dit`, `SAM` and `SYSTEM`, and ran Impacket''s `secretsdump.py` offline against the extracted files ('
  urls:
  - https://blog.talosintelligence.com/ransomware-incidents-in-japan-in-the-first-half-of-2026/
- claim_id: fb563ecf53
  entry: 2026-09-21/the-gentlemen-open-directory-vhdx-backup-ntds-theft
  surface: body
  kind: cited
  text: Talos notes that The Gentlemen is suspected to be led by individuals based in Russia, which it says further supports the connection to the group (
  urls:
  - https://blog.talosintelligence.com/ransomware-incidents-in-japan-in-the-first-half-of-2026/
- claim_id: 238951d0b2
  entry: 2026-09-21/the-gentlemen-open-directory-vhdx-backup-ntds-theft
  surface: body
  kind: uncited
  text: The operator first built a pivot platform using VPN software, Chisel and Ligolo, then ran nmap and masscan against externally exposed hosts and internal services once inside, then used NetExec to
    enumerate SMB shares, host information, LDAP and computer information in Active Directory; Talos assesses the operator may also have used RustHound/BloodHound-related tools (a Rust BloodHound collector)
    to collect domain users, groups, computers, administrative privileges and trust relationships for attack-path analysis.
- claim_id: 6aa1b2dda6
  entry: 2026-09-21/the-gentlemen-open-directory-vhdx-backup-ntds-theft
  surface: body
  kind: uncited
  text: Talos also observed traces suggesting exploitation of CVE-2020-1472 (Zerologon) and the MS17-010 vulnerabilities, alongside NTLM-relay tooling via Responder.
- claim_id: a0080a053b
  entry: 2026-09-21/the-gentlemen-open-directory-vhdx-backup-ntds-theft
  surface: body
  kind: uncited
  text: Separately, for lateral movement once inside the network, the operator used NetExec and Impacket to attempt authentication against SMB, LDAP, RDP and WinRM across multiple hosts.
- claim_id: 0c4a192607
  entry: 2026-09-21/the-gentlemen-open-directory-vhdx-backup-ntds-theft
  surface: body
  kind: uncited
  text: The VHDX backup files themselves, not just the small credential-dump output, were compressed with `zstd`, split into 256MiB chunks and uploaded concurrently (up to 16 files at a time) to Wasabi
    cloud storage via `rclone`, with the operator visibly reconfiguring transfer settings mid-exfiltration to improve speed and reliability.
- claim_id: f1f5f57b7b
  entry: 2026-09-21/the-gentlemen-open-directory-vhdx-backup-ntds-theft
  surface: body
  kind: uncited
  text: Command and control ran on the open-source AdaptixC2 post-exploitation framework, and Russian-language script comments plus Cyrillic-keymap mistyping in the operator's own bash history (`whoami`,
    `ls`, `ip a`, `clear`, `exit` typed on a Russian keyboard layout) indicate to Talos the possibility that a Russian-speaking individual was involved.
- claim_id: 6555f624df
  entry: 2026-09-21/the-gentlemen-open-directory-vhdx-backup-ntds-theft
  surface: body
  kind: derived
  text: '**Defender takeaway:** backup infrastructure is a credential-theft target in its own right, not only a ransomware-destruction target — any process that mounts, loop-attaches or NBD-attaches a VHDX/VHD
    backup image and then reads `ntds.dit`, `SAM` or `SYSTEM` out of it is functionally equivalent to a live NTDS dump and should alert identically.'
- claim_id: 55ac8f980b
  entry: 2026-09-21/the-gentlemen-open-directory-vhdx-backup-ntds-theft
  surface: body
  kind: derived
  text: Monitor for `libguestfs-tools`/`qemu-utils`/`nbd-client` installation and CIFS mounts of backup shares on hosts that are not the designated backup-management server, and treat `rclone` (or any bulk-upload
    tool) process creation with a cloud-storage destination immediately following such a mount as a high-confidence exfiltration signal.
- claim_id: 428a5cf1d3
  entry: 2026-09-21/the-gentlemen-open-directory-vhdx-backup-ntds-theft
  surface: body
  kind: derived
  text: GLPI deployments should confirm they are on 10.0.18 or later.
- claim_id: 1e0969254a
  entry: 2026-09-21/the-gentlemen-open-directory-vhdx-backup-ntds-theft
  surface: body
  kind: derived
  text: '**Triage:** legitimate backup-verification and disaster-recovery testing also mount VHDX images and inspect their contents, so the mount event alone is not the signal, the discriminator is the
    immediate follow-on: `secretsdump.py` or an equivalent credential-extraction tool run against files copied from that mount, on a host or account that has no operational reason to be doing backup verification.'
