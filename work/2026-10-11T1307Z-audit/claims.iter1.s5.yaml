- claim_id: de137e3120
  entry: 2026-09-21/the-gentlemen-open-directory-vhdx-backup-ntds-theft
  surface: body
  kind: cited
  text: For initial footholds against public-facing applications, the actor tried to exploit CVE-2025-24799 with a PoC and sqlmap to pull user information from the database, an unauthenticated SQL injection
    in GLPI's inventory endpoint fixed in GLPI 10.0.18 (
  urls:
