- claim_id: 41727b432b
  entry: 2026-09-22/plugin4shell-ai-coding-agent-sha-pinning-bypass
  surface: body
  kind: cited
  text: All four implement plugin-marketplace SHA-pinning, locking each install to a reviewed 40-hex commit hash, but none verifies after checkout that the resolved working tree actually matches that hash
    (
  urls:
  - https://www.air.security/blog-posts/plugin4shell
- claim_id: 0d24af963d
  entry: 2026-09-22/plugin4shell-ai-coding-agent-sha-pinning-bypass
  surface: body
  kind: cited
  text: An attacker who controls or takes over a trusted plugin's upstream repository creates a branch named identically to the pinned SHA and sets it as the repository's default branch; Claude Code, Codex
    and Copilot run a plain `git clone` followed by a checkout of the pinned commit, and because git resolves an ambiguous ref-versus-object-id in favor of the ref, the checkout silently resolves to the
    attacker's branch while the agent reports the pinned commit installed (
  urls:
  - https://www.air.security/blog-posts/plugin4shell
- claim_id: cba5c9a957
  entry: 2026-09-22/plugin4shell-ai-coding-agent-sha-pinning-bypass
  surface: body
  kind: cited
  text: 'Gemini CLI has a distinct but equally exploitable variant: it fetches the pinned commit into `FETCH_HEAD` then checks that out, which an attacker defeats by naming their malicious default branch
    literally "FETCH_HEAD" ('
  urls:
  - https://www.air.security/blog-posts/plugin4shell
- claim_id: 1438a40e39
  entry: 2026-09-22/plugin4shell-ai-coding-agent-sha-pinning-bypass
  surface: body
  kind: cited
  text: 'Because background plugin auto-update is the default in Claude Code and Codex, an already-installed, already-reviewed plugin is silently swapped on the next update with no install step and no prompt:
    full zero-click compromise of the agent and "full access to every asset and every piece of data the agent can reach" ('
  urls:
  - https://www.air.security/blog-posts/plugin4shell
