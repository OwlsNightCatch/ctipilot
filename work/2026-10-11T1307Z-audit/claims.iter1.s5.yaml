  entry: 2026-05-15/cve-2026-42945-nginx-open-source-plus-f5-waf-products-18-yea
  surface: body
  kind: cited
  text: '**Exposure:** a configuration with a `rewrite` that uses an unnamed capture and a `?` in the replacement, followed by another `rewrite`, `if` or `set` in the same scope; without that pattern the
    flaw is not reachable ('
  urls:
