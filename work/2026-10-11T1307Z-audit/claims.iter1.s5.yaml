claims:
- claim_id: 7706e2c8e6
  entry: 2026-09-12/jfrog-artifactory-cve-2026-42016-42018-token-chain-takeover
  surface: actions[0]
  kind: frontmatter
  text: 'Upgrade every self-hosted JFrog Artifactory instance to a build that closes both CVEs: 7.133.11 or later for CVE-2026-42016, which JFrog names as its only fixed build, and the CVE-2026-42018 fix
    for the branch, where Wiz''s corrected builds (7.133.29, 7.146.38, 7.161.20) sit above JFrog''s table. Wiz''s 7.111.21, 7.117.28 and 7.125.20 are below 7.133.11, so instances on those branches remain
    vulnerable to CVE-2026-42016 and must move to 7.133.11 or later.'
- claim_id: 9e5d3a46dd
  entry: 2026-09-12/jfrog-artifactory-cve-2026-42016-42018-token-chain-takeover
  surface: actions[1]
  kind: frontmatter
  text: On any Artifactory instance that was internet-reachable and unpatched since 15 August 2026, search access logs for an unauthenticated POST to /access/api/v1/aws/token/ followed within minutes by
    a POST to /access/api/v1/tokens from the same client; on a hit with both answered HTTP 200, treat the instance as compromised and reset the Access token signing key and certificate before relying on
    the upgrade.
- claim_id: 996cdaf244
  entry: 2026-09-12/jfrog-artifactory-cve-2026-42016-42018-token-chain-takeover
  surface: body
  kind: cited
  text: JFrog disclosed the two flaws separately and weeks apart, on 2026-07-27 and 2026-08-12, labelling each only "High" without a numeric score (
  urls:
  - https://docs.jfrog.com/releases/docs/jfrog-security-advisories#cve-2026-42016---incorrect-user-token-authorization-validation-allows-privilege-escalation
- claim_id: c5d5e97856
  entry: 2026-09-12/jfrog-artifactory-cve-2026-42016-42018-token-chain-takeover
  surface: body
  kind: cited
  text: 'CVE-2026-42016 (CWE-863 Incorrect Authorization), disclosed 27 July 2026, is a privilege-escalation bug in Artifactory''s token handling: the platform validates a token''s signature and issuer
    but not the token''s *scope* ('
  urls:
  - https://docs.jfrog.com/releases/docs/jfrog-security-advisories#cve-2026-42016---incorrect-user-token-authorization-validation-allows-privilege-escalation
- claim_id: 315cc88fde
  entry: 2026-09-12/jfrog-artifactory-cve-2026-42016-42018-token-chain-takeover
  surface: body
  kind: cited
  text: 'Wiz describes the consequence: a low-privileged token can be escalated to admin scope ('
  urls:
  - https://www.wiz.io/blog/artifactory-under-attack-in-the-wild-exploitation-of-cve-2026-42016-cve-2026-4201
- claim_id: 272cc3e3a7
  entry: 2026-09-12/jfrog-artifactory-cve-2026-42016-42018-token-chain-takeover
  surface: body
  kind: cited
  text: 'CVE-2026-42018 (CWE-287 Improper Authentication), disclosed 12–13 August 2026, is narrower but supplies the missing first step: Artifactory returns an internal anonymous-user token to a caller
    who never authenticated, even when anonymous access is disabled ('
  urls:
  - https://docs.jfrog.com/releases/docs/jfrog-security-advisories#cve-2026-42018---anonymous-user-token-generation-exposure
- claim_id: a0355eee59
  entry: 2026-09-12/jfrog-artifactory-cve-2026-42016-42018-token-chain-takeover
  surface: body
  kind: cited
  text: 'Of the anonymous token from CVE-2026-42018 and the scope-validation gap in CVE-2026-42016, Wiz Research writes: "Together, the two can turn an unauthenticated request into an admin-scoped token
    in two steps" ('
  urls:
  - https://www.wiz.io/blog/artifactory-under-attack-in-the-wild-exploitation-of-cve-2026-42016-cve-2026-4201
- claim_id: f9b37bd5ff
  entry: 2026-09-12/jfrog-artifactory-cve-2026-42016-42018-token-chain-takeover
  surface: body
  kind: cited
  text: An unauthenticated `POST /access/api/v1/aws/token/` (with the trailing slash, since the bare path returns 401) returns HTTP 200 with a JWT scoped to Artifactory's internal anonymous identity, exploiting
    CVE-2026-42018 (
  urls:
  - https://www.wiz.io/blog/artifactory-under-attack-in-the-wild-exploitation-of-cve-2026-42016-cve-2026-4201
- claim_id: d65bc14c14
  entry: 2026-09-12/jfrog-artifactory-cve-2026-42016-42018-token-chain-takeover
  surface: body
  kind: cited
  text: The operator then exchanges that JWT for a new one via `POST /access/api/v1/tokens`, which returns HTTP 200 carrying admin authority despite the request originating from the anonymous identity,
    exploiting CVE-2026-42016's missing scope check (**T1550.001**, forging elevated authority onto an application access token) (
  urls:
  - https://www.wiz.io/blog/artifactory-under-attack-in-the-wild-exploitation-of-cve-2026-42016-cve-2026-4201
- claim_id: 95354c0e12
  entry: 2026-09-12/jfrog-artifactory-cve-2026-42016-42018-token-chain-takeover
  surface: body
  kind: cited
  text: The escalated token still shows `token:anonymous` as its actor in logs, and Wiz treats the internal anonymous identity, or any low-privilege identity, minting tokens, enumerating users or touching
    plugins as the anomaly to hunt (
  urls:
  - https://www.wiz.io/blog/artifactory-under-attack-in-the-wild-exploitation-of-cve-2026-42016-cve-2026-4201
- claim_id: 99b4b7726b
