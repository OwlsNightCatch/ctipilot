  entry: 2026-09-12/jfrog-artifactory-cve-2026-42016-42018-token-chain-takeover
  surface: body
  kind: cited
  text: Operators create persistent administrator accounts via `PUT /api/security/users/<username>` or `/access/api/ui/users/<username>` (**T1136.001**); deploy malicious Groovy plugins through Artifactory's
