- claim_id: a8c05523f6
  entry: 2026-09-21/the-gentlemen-open-directory-vhdx-backup-ntds-theft
  surface: headline
  kind: frontmatter
  text: Cisco Talos maps The Gentlemen's AD attack chain, including offline credential theft from a mounted VHDX backup image
- claim_id: dc4b67f5d3
  entry: 2026-09-21/the-gentlemen-open-directory-vhdx-backup-ntds-theft
  surface: summary
  kind: frontmatter
  text: Cisco Talos reconstructed a six-phase Active Directory attack chain used by an operator associated with the ransomware-as-a-service brand The Gentlemen, recovered from an exposed open directory's
    own command history. The chain tunnels through Chisel/Ligolo-ng, enumerates AD with NetExec (Talos says RustHound/BloodHound-related tools may also have been used), attempts to exploit a public-facing
    GLPI SQL injection and attempts Zerologon/MS17-010 for lateral movement, then extracts ntds.dit and SAM offline from a CIFS-mounted VHDX backup image, and exfiltrates the VHDX backup images themselves
    in 256MiB chunks to Wasabi cloud storage via rclone.
- claim_id: b12f43dbd8
  entry: 2026-09-21/the-gentlemen-open-directory-vhdx-backup-ntds-theft
  surface: body
  kind: cited
  text: Cisco Talos recovered an exposed open directory believed to belong to an operator associated with the ransomware-as-a-service brand The Gentlemen, and reconstructed a six-phase attack chain from
    the directory's own shell command history (
  urls:
