- claim_id: 373d61a074
  entry: 2026-05-08/cert-fr-certfr-2026-act-016-agentic-ai-tools-introduce-promp
  surface: summary
  kind: frontmatter
  text: CERT-FR's advisory of 2026-04-13 on autonomous personal assistants such as OpenClaw and Claude Cowork, which run commands, drive the browser, handle files and send mail on chat-message triggers,
    says they must not be deployed on workstations or in production until stabilised and proven, and limits their use to isolated test sandboxes without sensitive data. It names plugins that run as trusted
    code and prompt injection as the core risks.
