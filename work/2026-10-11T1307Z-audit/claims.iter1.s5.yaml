  entry: 2026-05-10/microsoft-semantic-kernel-cve-2026-26030-cve-2026-25592-prom
  surface: record 2026-10-11T14:44:02Z
  kind: record-summary
  text: 'The CVE-2026-25592 mechanism was inverted: DownloadFileAsync is the host-side write that drops a script into the Startup folder, and upload_file is the read path. CVE-2026-26030 is an eval() of
    a lambda with an AST-based blocklist bypassed through BuiltinImporter, not an f-string with a literal-text blocklist. The advisories date from February, not 2026-05-07; the product, EU-pilot and default-store
    claims, the Python-side blast-radius claim and the EDR category names had no source; and the CVEs need a low-privileged attacker with no user interaction. The entry is rewritten from Microsoft''s post
    and the two advisories with exposure, detection and takeaway lines, a rating and an ATT&CK mapping.'
