- code: F3
  category: claim-not-supported
  entry: entries/2026-09-19/waterplum-contagious-interview-joint-advisory-scale.md
  where: "Body, **Triage:** line (claim 66147e28fe)"
  summary: "The Triage sentence says the advisory 'names what BeaverTail, InvisibleFerret and OtterCookie collect (browser authentication data, clipboard contents, keystrokes, screenshots and wallet data)'. The advisory lists those data classes once, as 'Other sensitive data targeted for exfiltration' by the WaterPlum infostealers in general, and ties no collection list to any of the three families (InvisibleFerret is described only as 'a Python-based backdoor', BeaverTail only as 'JavaScript-based malware hidden inside NPM packages'). The same family-level attribution appears in this fire's section ('the data the malware families collect') and record summary. 'freshly cloned repository' is also not in the advisory (it says the folder is 'opened and trusted by the victim')."
  ground_truth: "Advisory: 'Other sensitive data targeted for exfiltration includes: Authentication data stored in web browsers (ID, password, etc.); Clipboard information, key-logs (recorded keystrokes), screenshots; Cryptocurrency-wallet data' and 'The actors use infostealers to exfiltrate the victim's sensitive data'; footnotes 2-4 describe BeaverTail, InvisibleFerret, OtterCookie without data lists."
  ground_truth_url: "https://www.ic3.gov/CSA/2026/260918.pdf"
  fix: "Say the advisory lists the data classes the actors' infostealers target (not per family); drop 'names what BeaverTail, InvisibleFerret and OtterCookie collect' and 'freshly cloned'; align the section and record summary wording."
