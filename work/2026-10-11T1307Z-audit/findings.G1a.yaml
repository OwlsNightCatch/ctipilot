  extended_notes: 'Exposure: on a Nexus run ''show feature | include ngoam'', ''show feature | include mpls_oam'' and ''show feature | include nxapi'' (Cisco''s own checks); enabled OAM features reachable on any IP interface are the exposure, UCS 6300 FIs are exposed through the default-on UCS Manager XML API; License On-Prem is exposed through its web and API listeners regardless of configuration. Detection concept: unexpected NGOAM/MPLS-echo/NX-API traffic to switch management or loopback addresses from non-peer sources (flow records, ACL logs), switch process crashes/reloads and core files, new local users or config changes in switch AAA accounting; on License On-Prem, password-reset requests for administrator accounts and API calls to the Smart Licensing Utility interface without a client registration. Hardening: Cisco states no workaround for NGOAM, but disabling MPLS OAM removes that vector and Live Protect shields exist for CVE-2026-76465 and CVE-2026-76471; upgrade per the Cisco Software Checker. Next Cisco bundle is 2026-10-21 (first/third Wednesday). Bundle disposition for the ''scheduled multi-product release'' duty: pre-auth network CVSS >=9.0 rows are CVE-2026-76485/76486/76501 (NGOAM), 76465, 76471, 76455, 76459, 76480, 76482, 76483, 20328, 76454 and the APIC group; Cisco rates none exploited or publicly disclosed.'
  prior_disposition: 'borderline-drop three times: 2026-10-08T0404Z (line 319, ''flagged for the audit''s calibration check''), 2026-10-09T0255Z (line 320) and 2026-10-10T0255Z (line 303: ''a third look only if exploitation appears''). The earlier rationale that NGOAM is ''feature-gated and off by default'' is not supported by Cisco''s NGOAM advisory, which states the feature must be enabled (''the only requirement'') and gives no default state; only MPLS OAM and NX-API are stated as disabled by default. Live Protect shields exist for CVE-2026-76485/76486/76501 and 76465/76471. Unconditional (''regardless of configuration'') rows exist in the NX-OS, APIC and License On-Prem hardening releases at 9.8-10.0 group maximum.'
