  summary: 'HPE Networking published bulletin HPESBNW05158 on 2026-10-06 covering 28 CVEs in ClearPass Policy Manager (CPPM), its network-access-control server. Per the vendor''s CSAF the affected releases are CPPM 6.14.0 and below and 6.11.15 and below; fixes are CPPM 6.14.1 and 6.11.16. Seven CVEs score CVSS 3.1 9.8 (AV:N/AC:L/PR:N/UI:N): CVE-2026-76750 (deserialization of untrusted data in the web interface leading to unauthenticated code execution), CVE-2026-76752 (authentication bypass in the web-management and API interfaces giving administrative access), CVE-2026-76753 (format string in an unnamed service interface), CVE-2026-76754 (unauthenticated SQL injection leading to code execution), CVE-2026-79796 (authentication bypass), and two flaws in the OnGuard/client agent software (CVE-2026-76751, CVE-2026-79801; missing integrity verification allowing code execution on the endpoint). CVE-2026-79798 is a low-privilege SQL injection scored 9.9 with scope change, and CVE-2026-79805 carries 9.8 with PR:N although HPE titles it an authenticated path traversal (a vendor-side inconsistency; treat as reachable until proven otherwise). HPE says the flaws were found by internal research and that it ''is not aware of any public discussion or exploit code'' as of release; CCB tells organisations to patch with highest priority and warns that patching does not remediate historic compromise. The vendor workaround is to confine the CLI and web-management interfaces to a dedicated layer-2 segment or firewall policy. No exploitation, KEV listing or public PoC was found as of 2026-10-11.'
  region_nexus: global; Belgium's national CERT (CCB) rated it patch-immediately; products are EU public-sector network-access-control infrastructure
