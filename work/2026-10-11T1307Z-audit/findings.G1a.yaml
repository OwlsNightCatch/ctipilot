  summary: 'Veeam KB4934 (published 2026-10-06) resolves CVE-2025-64393: a user holding the low-privilege Backup Viewer role can reach remote code execution on the Veeam Backup Server through insecure deserialization of untrusted data received via the Mount Service (CVSS v4.0 9.4 Critical, AV:N/AC:L/PR:L). Affected is every v12 build up to and including 12.3.2.4854; it is fixed in 12.3.2 P4 (build 12.3.2.4934) and v13 builds are not affected; Veeam reminds that v12 reaches end of support on 2027-02-28. The same KB fixes CVE-2026-93026 (Backup Viewer can alter or delete the Enterprise Manager master key and read or overwrite stored antivirus-update credentials, v4 6.1) and CVE-2025-64392 (reflected XSS in Enterprise Manager, 4.8). Separately KB4902 (modified 2026-10-05) adds CVE-2026-58069, an authenticated Cloud Connect tenant arbitrary-file-read on the service-provider host (v4 8.3 High), affecting v13 builds up to 13.0.2.29 and v12 builds up to 12.3.2.4854; per heise the fixed builds are 13.1.0.411, 13.0.3.63 and 12.3.2.4934. NCSC Switzerland issued an advisory on 2026-10-09 with exploitation status UNKNOWN; no exploitation was found elsewhere. Backup servers are the standard ransomware pivot (the store already carries two earlier Veeam entries), and a Backup Viewer credential is a realistic foothold after a domain compromise, which is the reason to patch outside the monthly cycle.'
