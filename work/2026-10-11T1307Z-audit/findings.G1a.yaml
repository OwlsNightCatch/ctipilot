- title: 'Rejetto HFS CVE-2026-61500: Horizon3 publishes the mechanism on 2026-09-30 (V8 Math.random xorshift128+ state recovery from cookie-exposed values, forged admin session, RCE through administrative custom endpoints)'
  sources:
  - url: https://horizon3.ai/attack-research/disclosures/anthropic-mythos-rejetto-hfs-rce/
    publisher: Horizon3.ai
    date: '2026-09-30'
    role: primary
  source_record: horizon3-ai (Attack Research listing via WebFetch, post dated 2026-09-30)
  published_date: '2026-09-30'
  discovery_trace: 'first seen at: horizon3-ai, URL https://horizon3.ai/attack-research/ (WebFetch listing) -> primary: Horizon3 post, URL https://horizon3.ai/attack-research/disclosures/anthropic-mythos-rejetto-hfs-rce/ (fetched with `extract`).'
  summary: 'The store carries CVE-2026-61500 (Rejetto HFS session forgery via a predictable signing key, 2026-07-13). Horizon3''s post of 2026-09-30 documents how an AI-assisted research harness found it: HFS 3.x seeds its cookie-signing key from Math.random(), the login handshake stores a raw Math.random() output in a client-readable session cookie, and consecutive outputs let an attacker recover the xorshift128+ state, step it back to the three startup draws that built the key, verify the candidate against the HMAC of the attacker''s own cookie and then mint an administrator session; the administrative API''s custom endpoints can run arbitrary JavaScript, giving remote code execution. Horizon3 lists the end-to-end steps (confirm the built-in admin account through a user-enumeration oracle, sample the unauthenticated endpoint that leaks raw Math.random() outputs 12 times, recover the generator state with an SMT solver, rebuild the startup signing key, forge the admin cookie and use built-in HFS functionality to execute code) and says the model produced a working proof of concept. The post notes HFS has appeared in CISA KEV before (CVE-2024-23692) and does not report in-the-wild exploitation of CVE-2026-61500. Returned only as a low-priority mechanism delta; the main finding is already covered.'
