  summary: 'Splunk published two advisories on 2026-10-07. SVD-2026-1001 lists CVE-2026-76268 (CVSS 3.1 9.8, CWE-306): in Splunk Enterprise below 10.4.3 and 10.2.7 an unauthenticated user with network access to the Patroni REST API on a search head cluster member can run attacker-controlled operating-system commands because the interface needs no authentication for critical configuration operations; 10.0.x and 9.4.x are not affected. Splunk''s mitigation is to disable the PostgreSQL sidecar (set disabled = true in the [postgres] stanza of server.conf and restart) where Edge Processor, OpAmp and SPL2 data pipelines are not used. The same advisory fixes 10.4.3, 10.2.7, 10.0.10 and 9.4.15 for a long tail of authenticated flaws (for example CVE-2026-76266 local privilege escalation during Linux package upgrades, 7.7, and REST access-control flaws). SVD-2026-1002 is a ''security hardening'' release grouping internally found issues by CWE, the highest being CVE-2026-76281 (improper access control, 9.8) and CVE-2026-76284 (improper neutralization, 9.0); Splunk states no exploitation. The Patroni interface is an internal cluster-management port rather than the Splunk web listener, so exposure depends on whether it is reachable from user or partner networks; Splunk deployments hold the SOC''s own log pipeline, so a foothold there is high-impact. No exploitation or public PoC found as of 2026-10-11.'
