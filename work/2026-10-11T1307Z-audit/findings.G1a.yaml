candidate_sources_note: 'No new publisher. Four existing candidate records carried the first-party primaries this audit needed and are worth promotion on the evidence: hpe-networking-psirt (CSAF of HPESBNW05150/05156/05158), splunk-advisories (SVD-2026-1001/1002), watchguard-psirt (CVE-2026-101891/86102/86131) and zimbra-security-advisories (10.1.21 release notes and advisory table). The MSRC CVRF for 2026-Oct is titled ''October 2026 Early Security Updates'' (initial release 2026-10-02) and already holds the Exchange out-of-band fix; the 2026-10-13 Patch Tuesday will extend the same document.'
