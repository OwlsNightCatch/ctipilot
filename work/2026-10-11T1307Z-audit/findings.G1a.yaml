  summary: 'WatchGuard PSIRT (2026-09-28) fixes two WatchGuard access-point flaws in AP firmware 3.4.8 (affected: 1.0 up to below 3.4.8): CVE-2026-101891, improper access control in an internal API service that lets an unauthenticated attacker with network access to the AP obtain a valid API session, and CVE-2026-86102, OS command injection in the internal management API that gives command execution to an attacker with network access; WatchGuard does not state a chain, but the pair would give unauthenticated command execution on the AP if both are reachable (inference). On 2026-10-07 NCSC-NL (NCSC-2026-0404) rolled up a WatchGuard Fireware OS wave of 21 CVEs (some entries in that CSAF describe other vendors'' products, and CVE-2026-86102 is the AP flaw above); the standout CVE-2026-86131 (CVSS 9.8 per the NCSC-NL CSAF) is a code injection in the BOVPN-over-TLS client configuration that lets an attacker who controls the remote VPN server run commands as root on the connecting Firebox, fixed in Fireware OS 2026.3.2, 2026.2.3, 12.12.3 and 12.5.21 (T15/T35: 12.5.21). The remaining Fireware items are authenticated or denial-of-service issues. WatchGuard states it ''is not aware of any exploitation of this vulnerability in the wild'' for each page read. The store carries three earlier WatchGuard Fireware items (an IKE pre-auth RCE and its siblings); these are lower-reach: the AP flaws need network access to the AP management API and the VPN flaw needs a hostile VPN peer.'
