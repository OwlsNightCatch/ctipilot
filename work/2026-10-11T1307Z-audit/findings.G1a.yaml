  summary: HPE Networking bulletin HPESBNW05156 (2026-10-06) fixes AOS-Switch (AOS-S, the operating system of the Aruba 2530/2540/2615/2620/2915/2920/2930F/2930M/3800/3810M/5400R access and aggregation switch series) in 16.11.0032; affected is AOS-S 16.11.0031 and below. Per HPE's CSAF, CVE-2026-76742 (authentication bypass in the web-management interface), CVE-2026-76743 (authentication bypass in the management interface under preconditions HPE does not publish) and CVE-2026-76744 (buffer overflows in an unnamed interface reachable without credentials, leading to code execution) are all CVSS 3.1 9.8 (AV:N/AC:L/PR:N/UI:N). CVE-2026-76745 (9.6) and CVE-2026-76746 (9.3) are adjacent-network (AV:A) memory-corruption flaws with scope change; CVE-2026-76747 is 9.1 network-reachable. HPE reports internal discovery and no known public discussion or exploit code; CCB says an attacker with no credentials could take control of an affected switch and change VLAN, routing or access-control configuration. HPE's workaround is to restrict CLI and web management to a dedicated layer-2 segment or firewall policy. Many of the listed series are long-lived campus-edge models, so fleet inventory is the first action. No exploitation reported as of 2026-10-11.
