  extended_notes: 'Exposure: any Aruba switch running AOS-S 16.11.0031 or below; read the version from the switch CLI (''show version'') and check whether the web UI/SSH management plane is reachable from user VLANs. Detection concept: switch syslog/AAA accounting for administrative logins without a preceding RADIUS/TACACS authentication event, unexpected configuration writes, new local users or management-VLAN changes; unexpected reboots/crash dumps on a switch as a possible overflow attempt. Hardening: upgrade to 16.11.0032; confine management to an out-of-band VLAN with ACLs; disable the web UI where unused.'
