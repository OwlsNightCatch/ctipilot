  summary: 'Microsoft shipped an out-of-band Exchange Server fix on 2026-10-02 as part of its ''October 2026 Early Security Updates'', ahead of the 2026-10-13 Patch Tuesday. CVE-2026-96940 is a weak-authentication elevation-of-privilege flaw in Outlook Web Access (CVSS 3.1 8.8, AV:N/AC:L/PR:L/UI:N): per MSRC an attacker who gets a user to click a crafted link (delivered by email or chat) can inject script or content and trick the user into disclosing information; NCSC-NL reads it as an authenticated network attacker escalating to administrative actions. MSRC states publicly disclosed No, exploited No and rates exploitability ''Exploitation More Likely''; Exchange Online needs no action, on-premises Exchange does. CERT-FR names the fixed builds: Exchange 2016 CU23 before 15.01.2507.075, 2019 CU14 before 15.02.1544.048, 2019 CU15 before 15.02.1748.053 and Subscription Edition RTM before 15.02.2562.053. The rest of the Early release holds no exploited or publicly disclosed Microsoft CVE; its other 9.0+ entries (Azure SRE Agent, Azure App Service, Dataverse, Bookings, Partner Center) are cloud-service fixes with no customer action stated. Exchange OWA flaws have been weaponised quickly in the past and the store already tracks an OWA flaw from May, so this is worth a short note, not a priority item.'
