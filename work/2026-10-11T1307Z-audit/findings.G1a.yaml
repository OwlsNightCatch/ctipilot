    attribution: Centre for Cybersecurity Belgium (CCB)
    source_url: https://ccb.belgium.be/advisories/warning-multiple-critical-vulnerabilities-hpe-networking-clearpass-policy-manager-can-be
  extended_notes: 'Exposure: any CPPM publisher/subscriber node on 6.14.0 and below or 6.11.15 and below; read the running version in the CPPM admin UI and check whether the web-management/API listeners are reachable from user, guest or internet segments (HPE''s own workaround is L2/L3 segmentation of management). Detection concept: web-server and API access logs on CPPM for unauthenticated requests to management/API endpoints followed by new administrator sessions or unexpected child processes of the web service (process-creation telemetry); NAC policy or enforcement-profile changes outside change windows (audit log); post-patch, review local admin accounts, API clients and OnGuard agent distribution packages for tampering because patching does not evict a prior intruder (CCB). Hardening: upgrade to 6.14.1 / 6.11.16, restrict CLI and web UI to a management VLAN. Audit note: HPE/CCB/EUVD/CERT-FR all carried it from 2026-10-06 to 2026-10-08, so collection was not the miss; the store never weighed it under PD-11.'
  prior_disposition: 'borderline-drop by 2026-10-08T0404Z-intel (run record line 317: ''seven unauthenticated CVSS 9.8 flaws on an internal network-access-control management plane, no exploitation or PoC ... regular cycle under PD-11 (b)'') and again 2026-10-09T0255Z-intel (line 320). hpe-networking-psirt was added as a candidate source on 2026-10-09. Not a collection miss.'
