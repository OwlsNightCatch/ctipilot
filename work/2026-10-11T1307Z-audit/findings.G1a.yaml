  summary: 'Cisco''s first-and-third-Wednesday risk-based disclosure on 2026-10-07 contains a cluster of critical, internally discovered flaws, none known to be exploited (''The Cisco PSIRT is not aware of any public announcements or malicious use''). Nexus 3000 and standalone-mode Nexus 9000 switches: NGOAM (CVE-2026-76485, 9.8; affected whenever NGOAM is enabled, the only requirement; CVE-2026-76486 and CVE-2026-76501 need NGOAM plus NV Overlay/VXLAN-EVPN or SRv6), MPLS OAM (CVE-2026-76465, 9.8, feature disabled by default; mitigation ''no feature mpls oam''; Live Protect shield available) and NX-API (CVE-2026-76471, 9.8; NX-API disabled by default on Nexus, but on UCS 6300 fabric interconnects the XML API is on by default and the flaw needs only low-privilege credentials) allow an unauthenticated remote attacker to run code as root via crafted packets or requests. Cisco License On-Prem (formerly Smart Software Manager On-Prem), affected regardless of configuration: the hardening release carries CVE-2026-76482 (CVSS 10.0, improper verification of cryptographic signature), CVE-2026-76480 (9.8, missing authentication for a critical function), CVE-2026-76483 (9.1) and CVE-2026-76484 (8.8, code injection); a separate advisory adds unauthenticated arbitrary account password reset (CVE-2026-20328, 9.1) and an unauthenticated API file-write/DoS (CVE-2026-76454, 9.1). Fixed release is 10-202609 (10-202608 for the separate advisory); 9-202601 and earlier must migrate. The NX-OS hardening release groups six CWE-class CVEs (two at 9.8) across Nexus 3000/7000/9000, MDS 9000 and UCS 6300-6600 (fixed e.g. 10.3(10), 10.4(8), 10.5(6), 10.6(4), MDS 9.4(5a), ACI 16.0(9h)/16.1(6g)/16.2(3g)); an APIC hardening release (9.8; 6.0(9h), 6.1(6g), 6.2(3g)) and a Meraki hardening release (9.6, adjacent-network vector; fixes staged from mid-October to mid-November 2026) round out the bundle. A Finesse SSRF (7.2) has fixes only in January/February 2027. NCSC Switzerland published an advisory on 2026-10-09 (exploitation status UNKNOWN), which makes this a home-authority-flagged item the store did not carry.'
