  reason: 'bsi-rss returns the 250-item cap reaching back only to 2026-10-08 12:44Z after the bulk [UPDATE] refresh, so 2026-09-27..2026-10-07 is not covered through BSI; recipe to try: `bsi-csaf WID-SEC-2026-<id>` for specific IDs surfaced elsewhere, or the WID portal through the reader. No working listing recipe for a 271 h horizon.'
- source_id: cccs-alerts
  reason: 'Atom feed capped at 50 items back to 2026-10-01 11:09Z (AV26-978); AV26-9xx items from 2026-09-27..10-01 are unreachable via feed, and the HTML listing exceeds WebFetch''s 10 MB content limit. Recipe fix: feed is fine for a 24-72 h window; for a longer horizon fetch individual advisory pages found through other sources.'
- source_id: jpcert
  reason: 'recipe change: the HTML page https://www.jpcert.or.jp/english/at/ is an empty skeleton on extract and WebFetch; the working transport is `python3 tools/fetch_source.py feed https://www.jpcert.or.jp/english/rss/jpcert-en.rdf 20` (dated items; newest 2026-09-09). Set fetch_method rss and rss_url.'
- source_id: ccb-belgium
  reason: 'recipe change: `python3 tools/fetch_source.py extract https://ccb.belgium.be/advisories` now returns the ten latest warning titles and each warning page reads fully with `extract` (affected software, CVE/CVSS, vendor link, risk text); the 2026-09-10 ''ambiguous'' note is stale. Per-warning URLs are listed in the raw HTML of `url https://ccb.belgium.be/advisories` (href pattern /advisories/warning-...). Set fetch_method bridge/extract and note the href-pattern drill.'
- source_id: ncsc-ch-security-hub
  reason: '`ncsc-csh recent 60` prints JSON followed by trailing text; parse with json.JSONDecoder().raw_decode (json.load fails with ''Extra data''). The ILIAS vendor blog linked from post 13035 sits behind a proof-of-work captcha (docu.ilias.de) and the linked ilias.php URL returns an ilCtrl 404: vendor text unreadable on every transport.'
- source_id: cisa-directives
  reason: WebFetch of the listing returns titles without issue dates; ED/BOD dates require per-directive pages.
- source_id: hpe-networking-psirt (candidate)
  reason: 'support.hpe.com docDisplay is a JS shell on `extract`/`url`/WebFetch; the jina reader works, and the machine-readable CSAF https://csaf.arubanetworking.hpe.com/2026/hpe_networking_-_hpesbnw0NNNN.json reads directly with `url` and carries release dates, affected/fixed versions and the exploitation note. The advisory IDs come from CCB/CERT-FR/EUVD, not from an HPE listing (none located). Candidate note: the 2026-10-09 fire could not locate a listing; the three IDs found here are HPESBNW05150, 05156 and 05158.'
- source_id: jetbrains issues-fixed page
  reason: https://www.jetbrains.com/privacy-security/issues-fixed/ is a JS shell on extract/WebFetch; only the jina reader returned content (TeamCity 2026.2.1 / 2026.1.3 / 2025.11.7 fixes).
- source_id: cccs HTML advisories
  reason: several cyber.gc.ca advisory pages return the raw Angular HTML through `extract` (not markdown); text is recoverable after tag stripping.
audit_observations:
- 'Nearly every item returned as `new` here had already been seen and borderline-dropped by one or more intel fires (see each item''s `prior_disposition`): HPE ClearPass/AOS-S, Splunk, Cisco 2026-10-07 bundle, IBM Verify Access, Veeam, Exchange OOB, Zimbra 10.1.21, ILIAS, WatchGuard AP/Fireware. None is a collection miss; the question for the audit is the PD-11(b) calibration, not rotation or lookback.'
- 'Home-authority pattern: five NCSC-CH Cyber Security Hub posts in the horizon (13044 Cisco, 13043 Veeam, 13035 ILIAS, 13022 Zimbra, 13007 WatchGuard AP) are unexploited vendor-patch advisories that the fires dropped (the 2026-10-10 record calls the Swiss post ''a restatement of the vendor bulletin''). NCSC-CH did not post on HPE ClearPass/AOS-S, Splunk, IBM or Exchange; CCB (Belgium) issued ''patch immediately'' warnings for ClearPass and AOS-S. If the audit wants a rule such as ''an NCSC-CH advisory at CVSS 9+ unauthenticated earns at least a short entry'', it would reverse the fires'' calls for Cisco and the NCSC-CH-flagged items; otherwise the existing drops are defensible because none is exploited.'
- A rationale in the 2026-10-08T0404Z record ('NGOAM ... off by default') is not supported by Cisco's NGOAM advisory (feature must be enabled, 'the only requirement', no default stated); only MPLS OAM and NX-API are stated as disabled by default. The three-time drop of the Cisco bundle rests partly on that premise; the hardening releases also carry rows 'regardless of device configuration' at 9.8-10.0 group maximum (NX-OS, APIC, License On-Prem).
- 'Genuinely new facts relative to the store: (1) Kiteworks NCSC-NL 2026-10-08: 61 CVEs with five unauthenticated CVSS 9.1 SSRFs in Email Protection Gateway not in the entry''s CVE table (update-of, recommended as a changelog record); (2) CCB reports a public PoC for Citrix CVE-2026-88773 on 2026-10-06 (status flag on one CVE; single source); (3) Zimbra 10.1.21 includes a pre-authentication password-recovery code prediction the CVE-2026-73570 entry does not describe; (4) the OpenBao/Vault and GitLab 9.9 leads that earlier fires ''never assessed'' are assessed here and dropped.'
- 'Dispositions that held up on the vendor text: Apache httpd 2.4.69 (ASF rates low/moderate despite CVSS 9.8 in CCB), OpenBao/Vault (CERT-FR''s ''bypass authentication'' is looser than the GHSAs, which need tokens or privileged endpoints), GitLab 9.9 (authenticated), OpenSSL 2026-09-29 (High at most), OpenSSH 10.6, Struts S2-075..078 (Moderate), TeamCity DSL escape (authenticated).'
- 'KEV: 13 additions dated 2026-09-27..2026-10-08, all COVERED; no addition carries knownRansomwareCampaignUse Known; 59 store-covered CVEs carry Known in the catalogue (all older), none flagged RANSOMWARE-UNREFLECTED. The ENISA EUVD exploited feed lists only the 2026-10-08 legacy CVEs.'
- 'Feed caps worth an essential-tier fix: bsi-rss (250 items reaching back only 3 days after bulk updates), CCCS Atom (50 items, 8.5 days), CERT-FR avis feed (40 items), NCSC-NL (25 items), `ncsc-csh recent` emits trailing text after the JSON. A fire that misses a day cannot rebuild it from these feeds alone; the CERT-FR weekly ACT digest and the ncsc-nl CSAF API are the compensating recipes.'
