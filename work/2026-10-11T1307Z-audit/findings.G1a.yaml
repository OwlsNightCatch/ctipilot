    attribution: NCSC Switzerland (Cyber Security Hub)
    source_url: https://security-hub.ncsc.admin.ch/#/posts/13022
  extended_notes: 'Exposure: Zimbra 10.1.x before 10.1.21 with the self-service password-recovery feature enabled and the OnlyOffice integration where deployed; read the version with ''zmcontrol -v''. Detection concept: bursts of password-recovery requests per account in the mailbox/proxy access logs followed by a successful login from a new address; WebDAV logins presenting tokens issued before MFA completion; OnlyOffice document-server file writes outside the document store. Hardening: upgrade to 10.1.21; restrict or disable self-service recovery until patched; require MFA for WebDAV.'
