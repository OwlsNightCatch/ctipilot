  summary: 'Zimbra released Daffodil 10.1.21 on 2026-09-24 and its advisory table lists the security fixes; the Swiss authority NCSC-CH flagged them on 2026-10-01 and heise on 2026-09-29. The most serious entry, per the release notes, is a flaw in the self-service password-recovery mechanism that ''could allow an unauthenticated attacker to predict recovery codes and reset a user''s password'', i.e. pre-authentication account takeover; Zimbra lists no CVE or CVSS for it. Other fixes: an OnlyOffice-integration issue allowing unauthorized file writes and remote code execution under specific conditions, a server-side JavaScript injection in the same integration (authenticated), WebDAV accepting pre-MFA tokens (MFA bypass for WebDAV resources), stored XSS in the Classic and Modern web clients (display names, attachment Content-Location headers, share invitations, calendar counter-proposals; CVE-2026-66912 and CVE-2026-66911 are two of them), an OpenJDK 17.0.19 bump and the SNMP command injection already tracked as CVE-2026-73570 (fixed in 10.1.20). Zimbra gives CVSS ''TBD'' for all of them, and the two named CVE ids were still unpublished when heise and NCSC-CH wrote. No exploitation reported. The store tracks several earlier Zimbra items (webmail zero-days, an exploited SNMP injection), and heise notes state-linked actors repeatedly target Zimbra in government and research settings.'
