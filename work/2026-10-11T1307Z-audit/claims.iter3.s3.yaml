- claim_id: 28bfcac61e
  entry: 2026-05-09/denic-de-dnssec-outage-faulty-key-rollover-3-5-h-disruption
  surface: body
  kind: cited
  text: 'DENIC''s analysis traces the fault to in-house code around its hardware security modules in the third-generation signing system it put into operation in April 2026: instead of one key pair stored
    on three HSMs, the software generated three different key pairs, one per HSM, and only one of them matched the pre-published DNSKEY ('
  urls:
  - https://blog.denic.de/analyse-des-dns-ausfalls-vom-5-mai-2026/
- claim_id: d0c1ae3bff
  entry: 2026-05-09/denic-de-dnssec-outage-faulty-key-rollover-3-5-h-disruption
  surface: body
  kind: cited
  text: Because signatures over NSEC3 records were also unverifiable, even second-level domains without DNSSEC failed to resolve, and DENIC's three permanent validation tools detected the anomaly but their
    alerts were not processed correctly (
  urls:
  - https://blog.denic.de/analyse-des-dns-ausfalls-vom-5-mai-2026/
- claim_id: 40b987711d
  entry: 2026-05-09/denic-de-dnssec-outage-faulty-key-rollover-3-5-h-disruption
  surface: body
  kind: cited
  text: '**Defender takeaway:** a TLD-side DNSSEC failure looks the same as an attack to a validating resolver; operators of validating resolvers should have a tested way to mark a broken TLD as insecure
    and should rely on serve-stale to absorb the first hours, as Cloudflare did ('
  urls:
  - https://blog.cloudflare.com/de-tld-outage-dnssec/
