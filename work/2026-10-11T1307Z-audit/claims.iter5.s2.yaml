- claim_id: d722b10971
  entry: 2026-05-09/denic-de-dnssec-outage-faulty-key-rollover-3-5-h-disruption
  surface: summary
  kind: frontmatter
  text: A routine DNSSEC key rollover on 2026-05-05 left the .de zone with signatures validating resolvers could not verify, from an onset the sources place between about 19:30 and 19:57 UTC until DENIC
    restored normal operation at 23:15 UTC. DENIC's new signing system generated one key pair per HSM instead of one shared pair, so only one matched the published DNSKEY; unverifiable NSEC3 signatures
    broke even unsigned .de domains.
