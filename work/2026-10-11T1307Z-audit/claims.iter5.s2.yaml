- claim_id: d0c1ae3bff
  entry: 2026-05-09/denic-de-dnssec-outage-faulty-key-rollover-3-5-h-disruption
  surface: body
  kind: cited
  text: Because signatures over NSEC3 records were also unverifiable, even second-level domains without DNSSEC failed to resolve, and DENIC's three permanent validation tools detected the anomaly but their
    alerts were not processed correctly (
  urls:
  - https://blog.denic.de/analyse-des-dns-ausfalls-vom-5-mai-2026/
- claim_id: 40b987711d
