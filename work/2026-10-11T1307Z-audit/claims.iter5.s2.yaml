  text: Onapsis's own internet-wide fingerprinting found more than 10,000 unique internet-facing IPs presenting an SAP web interface, a figure it calls conservative since it structurally undercounts the
    SAP Web Dispatcher, which returns no distinguishing banner (
  urls:
  - https://onapsis.com/blog/sap-overpass-remediation/
- claim_id: 62d75f934a
  entry: 2026-09-10/sap-september-2026-overpass-s4get-preauth-rce
  surface: body
  kind: cited
  text: 'S4GET is a distinct logic flaw in the SAP NetWeaver Message Server (kernel lines 9.16-9.20, native to S/4HANA and S/4HANA Cloud Private Edition) reachable through the same public port every SAP
    GUI client connects to: a crafted packet gets an arbitrary IP address accepted as a trusted internal node, and the Message Server propagates that false trust across the cluster so the Gateway admits
    the attacker as internal and the attacker can invoke RFC-callable programs to reach code execution as `<sid>adm` on every application server: "exploitation requires no credentials, no certificate, and
    no pre-existing misconfiguration" ('
  urls:
  - https://onapsis.com/blog/s4get-cve-2026-58240-sap-message-server-threat-advisory/
