  surface: record 2026-10-11T14:45:48Z
  kind: record-summary
  text: 'The five CVEs were not disclosed on 2026-05-18: two advisories date from 2026-04-22 and three from 2026-05-13, and the full fix needs the later 1.123.43, 2.20.7 or 2.22.1 releases. The advisories
    do list workarounds; CVE-2026-44790 is a file read, not code execution; CVE-2026-44791 bypasses the XML node fix, not the xml2js fix; the evidence records were not contiguous on their pages; and the
    Swiss and EU adoption and CERT claims had no source. The entry is rewritten from the five advisories with the per-advisory sources, exposure and takeaway lines, a rating and an ATT&CK mapping. The priority
    moves from notable to routine for authenticated-only flaws with no reported exploitation, and the deep-dive flag is cleared to match the shorter rewritten analysis.'
