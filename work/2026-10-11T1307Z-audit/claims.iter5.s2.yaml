  surface: body
  kind: cited
  text: 'OVERPASS is a memory-corruption flaw in the SAP kernel''s processing of the Extended Passport, a tracing structure attached to requests and parsed before session authentication; because the handling
    code is shared, the flaw is reachable via three independent unauthenticated routes: the Internet Communication Manager/Web Dispatcher (HTTP/HTTPS, Fiori/WebGUI/APIs), the SAP Dispatcher (the SAP GUI
    logon protocol), and RFC connections between systems, each with a single crafted request corrupting memory to reach arbitrary OS command execution as the account that owns the SAP installation ('
  urls:
