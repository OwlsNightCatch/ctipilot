- claim_id: 18a279fa6b
  entry: 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev
  surface: summary
  kind: frontmatter
  text: 'Citrix''s CTX697096 bulletin (2026-09-27) fixes eight NetScaler ADC/Gateway flaws, two of which, CVE-2026-88771 (unauthenticated command execution, every default deployment) and CVE-2026-88772
    (memory overflow to RCE/DoS, reachable wherever DTLS is enabled, the VPN-vServer default), were already being exploited in the wild before any fix existed. CISA added both to KEV the same day; Citrix
    lists no workaround. Google''s Mandiant and GTIG report a campaign running since at least early September that leaves web-server-configuration persistence on compromised appliances, so an appliance
    patched after the bulletin still needs a compromise check. Unit 42 telemetry adds version fingerprinting from 2026-08-21, web shells dropped as .deb packages from 2026-09-04 and a log-poisoning chain
    with concrete log artifacts to hunt. A separate Citrix bulletin of 2026-10-03 adds CVE-2026-88779, a SAML-triggered flaw these builds do not fix: SAML-configured appliances must move to 14.1-73.41 or
    13.1-64.28, and a bulletin of 2026-10-08 adds CVE-2026-107406 for the same SAML configurations, so identity-provider appliances need 14.1-73.46 or 13.1-64.29. Belgium''s CCB reported on 2026-10-06 a
    public proof of concept for CVE-2026-88773, the unauthenticated request-smuggling flaw the September builds fix, with no exploitation seen yet.'
