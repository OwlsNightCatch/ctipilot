  kind: frontmatter
  text: Upgrade every self-managed GitLab CE/EE instance to 19.3.2 / 19.2.6 / 19.1.8 now, or on the 19.0 and 18.11 trains to the 19.0.9 / 18.11.12 backports, which carry only the CVE-2026-85706 and CVE-2026-87719
    fixes and leave GitLab EE exposed to CVE-2026-88765 until 19.1.8 or later; GitLab.com is already patched and GitLab Dedicated needs no action. Assume any files an attacker-scripted request could reach
