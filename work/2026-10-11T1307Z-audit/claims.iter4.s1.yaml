- claim_id: 4d27062d30
  entry: 2026-09-24/closedquorum-llm-orchestrated-c2-implant
  surface: body
  kind: uncited
  text: Instead of a dedicated attacker-operated server, its `ModelOrchestrator` component queries up to four commercial LLM providers — DeepSeek, Qwen, Mistral and Google Gemini — each cycle, with a system
    prompt instructing each model to "provide ONLY executable decisions" alongside host context (hostname, OS version, admin status) and the current target process.
- claim_id: 10227fad09
  entry: 2026-09-24/closedquorum-llm-orchestrated-c2-implant
  surface: body
  kind: uncited
  text: Each provider must respond with a fixed JSON schema naming one of four actions; `interModelDiscussion()` tallies the providers' decisions by plurality vote and executes the winner, discarding any
    malformed or off-schema response.
- claim_id: 326267f8d1
  entry: 2026-09-24/closedquorum-llm-orchestrated-c2-implant
  surface: body
  kind: uncited
  text: The four possible actions are `steal` (simultaneous LSASS memory dumping via `SeDebugPrivilege` and `MiniDumpWriteDump`, Chrome/Edge/Firefox saved-credential harvesting, and MetaMask/Exodus/Ethereum
    wallet data collection), `inject` (Early Bird APC injection into a suspended process by default, or PEB-walk process hollowing when a model selects that exploit type), `persist` (establishes three mechanisms
    — a Windows-Update-themed Registry Run-key value, a scheduled task, and a permanent WMI event subscription that fires a script every 60 seconds), and `move`, which has no handler in the public build.
- claim_id: 0072ce79b0
  entry: 2026-09-24/closedquorum-llm-orchestrated-c2-implant
  surface: body
  kind: uncited
  text: Every model decision, its stated reasoning, and staged or stolen data are relayed to the operator through a Discord webhook, with exfiltrated files AES-256-GCM encrypted, base64-encoded and posted
    in roughly 1,900-byte chunks at one-second intervals.
- claim_id: e35a8aace5
  entry: 2026-09-24/closedquorum-llm-orchestrated-c2-implant
  surface: body
  kind: uncited
  text: Talos found the binary via CAIRN, an open-source research toolkit for tracking AI-integrated malware that it released the same day, and its static analysis is dated 2026-06-17, under a prior alias,
    BALZAK, that was renamed on 2026-07-03.
- claim_id: d9fc5a433d
  entry: 2026-09-24/closedquorum-llm-orchestrated-c2-implant
  surface: body
  kind: uncited
  text: The publicly distributed build ships with placeholder API keys and a dummy Discord webhook, so Talos has not observed a complete end-to-end execution; Talos assesses the actual distribution model
    puts a developer generating a customised binary with an individual operator's credentials injected at compile time, meaning any live deployment would run on infrastructure Talos has not seen.
- claim_id: b9cf8086a6
  entry: 2026-09-24/closedquorum-llm-orchestrated-c2-implant
  surface: body
  kind: uncited
  text: Talos frames the finding as evidence of "effort displacement" — an entire phase of an intrusion handed to a model rather than merely AI-assisted tooling.
- claim_id: ea85c0e495
  entry: 2026-09-24/closedquorum-llm-orchestrated-c2-implant
  surface: body
  kind: uncited
  text: 'The implant''s failure modes are deterministic and, Talos notes, exploitable by defenders: provider refusals and rate limits, a fixed tie-break order, and a sleep-retry response to total provider
    failure rather than a default action.'
- claim_id: 74d31e7b29
  entry: 2026-09-24/closedquorum-llm-orchestrated-c2-implant
  surface: body
  kind: derived
  text: '**Detection:** the actionable signal is not a domain or IP to block, since the "C2 infrastructure" is the same commercial AI-provider endpoints thousands of legitimate applications call daily.'
- claim_id: 0fbd83f77c
  entry: 2026-09-24/closedquorum-llm-orchestrated-c2-implant
  surface: body
  kind: derived
  text: 'The discriminator is co-occurrence: AI-service API traffic from a Windows binary with no legitimate reason to call multiple LLM providers within a short window, correlated with LSASS access, code
    injection into a suspended process, new WMI persistence, or Discord webhook traffic from the same host or process, recurring at a randomised 5-to-15-minute polling cadence chosen to outlast short sandbox
    runs.'
- claim_id: 7b2f0646a2
  entry: 2026-09-24/closedquorum-llm-orchestrated-c2-implant
  surface: body
  kind: derived
  text: Prompt content itself is visible only with TLS inspection or at the provider side; a network-only vantage point sees the fact of repeated multi-provider calls, not their content.
- claim_id: 033f5e1b92
  entry: 2026-09-24/closedquorum-llm-orchestrated-c2-implant
  surface: body
  kind: derived
  text: '**Triage:** legitimate software may independently call one AI-provider API; a single Windows process contacting several distinct commercial LLM providers in the same short window, especially alongside
    credential-access or injection telemetry, is not a pattern ordinary applications produce.'
- claim_id: c978c0cd6e
  entry: 2026-09-24/closedquorum-llm-orchestrated-c2-implant
  surface: body
  kind: derived
  text: '**Defender takeaway:** CLOSEDQUORUM is a capability demonstration with no confirmed live deployment, not an active campaign — but its architecture (commercial AI endpoints as C2, LLM-driven action
    selection) is a detection blind spot worth building hunt logic for now, before a deployed variant with real credentials appears.'
