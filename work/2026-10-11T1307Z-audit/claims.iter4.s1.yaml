  surface: body
  kind: cited
  text: The Hacker News, reporting on the disclosure, draws its own comparison to LAMEHUG, malware Ukraine's CERT-UA reported in July 2025 that asked an AI model to write commands for a task already set
    in its code, contrasting it with CLOSEDQUORUM asking the models to choose the task itself (
