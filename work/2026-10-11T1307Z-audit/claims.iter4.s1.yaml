  entry: 2026-07-09/ncsc-ch-rogueplanet-cve-2026-50656-defender-lpe-fixed
  surface: summary
  kind: frontmatter
  text: NCSC-CH's Nightmare Eclipse tracker was updated on 2026-07-09 to record that a CVE has been assigned to RoguePlanet (CVE-2026-50656), a link-following (CWE-59) local privilege escalation in the
    Microsoft Malware Protection Engine behind Defender that lets a local attacker reach SYSTEM; Microsoft's MSRC record shows the engine fix has now shipped. A public PoC existed from 2026-06-10 and the
    CVE sat without a fix for over three weeks. The engine auto-updates, so most estates are already current, but WSUS-gated, offline or OT-adjacent estates should explicitly verify the installed engine
    build. NCSC-CH later recorded an alleged bypass of the fix, ShieldBreak (CVE-2026-69414), which Microsoft fixed in engine 1.1.26080.3.
