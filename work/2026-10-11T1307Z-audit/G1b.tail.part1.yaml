# One-line dispositions for the coordinator's scope-addendum items (window start extended to 2026-09-27T13:08Z)
addendum_dispositions:
  - { item: "GitLab CVE-2026-89078 and CVE-2026-93577 (CVSS 9.9, 2026-09-23)", disposition: "new item (borderline: true)", fragment: "05-gitlab-regex-rce-9-9", primary: "https://docs.gitlab.com/releases/patches/patch-release-gitlab-19-4-1-released/", source_record: "gitlab-security (feed https://about.gitlab.com/security-releases.xml listed it 2026-09-23)", why: "authenticated (PR:L) RCE through CI/CD regex handling; no exploitation, PoC or KEV found; not pre-auth, so borderline against the duty bar" }
  - { item: "GitLab 2026-09-23 backport releases 19.0.9 / 18.11.12 of the CVE-2026-85706 and CVE-2026-87719 fixes", disposition: "update-of:2026-09-12/cve-2026-85706-gitlab-unauth-path-traversal-file-read", fragment: "06-gitlab-85706-backport-update", primary: "https://docs.gitlab.com/releases/patches/patch-release-gitlab-19-0-9-released/", why: "the entry's affected and fixed fields name only 19.1.8 / 19.2.6 / 19.3.2; GitLab now lists 18.11.12 and 19.0.9 as fixed builds for the 18.7 to 19.0 branches (KEV-listed unauthenticated file read, so material for operators on those branches)" }
  - { item: "GitLab AI Gateway CVE-2026-90970 (2026-10-02, CVSS 9.9)", disposition: "folded into the new GitLab item (05)", primary: "https://docs.gitlab.com/releases/patches/other-patches/patch-release-gitlab-ai-gateway-19-4-1-released/", why: "authenticated Duo Agent Platform user, sandbox escape on the AI Gateway" }
  - { item: "OpenBao / HashiCorp Vault authentication-bypass flaws (2026-09-23)", disposition: "dropped", primary: "https://discuss.hashicorp.com/t/hcsec-2026-43-vault-inconsistent-acl-policy-evaluation-may-allow-bypass-of-deny-restrictions/77815", why: "every flaw needs an authenticated or privileged principal and none is exploited: OpenBao advisories of 2026-09-23 (GHSA-j6wc-jpvg-xfxq CVE-2026-104090 critical RCE via sys/storage/raft/snapshot-force needs a highly privileged operator and Raft storage; GHSA-x8fg-h69x-p28f CVE-2026-104092 ACME SANs; GHSA-mjch-vcw3-hhmf policy-cache namespace traversal, fixed in 2.6.3 and 2.7.0, all 'original to HashiCorp Vault') and the matching Vault bulletins of 2026-10-07 (HCSEC-2026-40 CVE-2026-105818 ACME identities, -41 CVE-2026-105816 plugin catalog RCE via Raft snapshot restore with Shamir seals, -42 CVE-2026-105820 Enterprise cross-namespace policy cache, -43 CVE-2026-89322 ACL deny bypass for delegated users; fixed in Vault 2.1.2, Enterprise 2.1.2 / 1.21.12 / 1.20.17 / 1.19.23). No pre-auth path, CVSS 9+ unauthenticated item or exploitation exists in the set" }
  - { item: "HPE Aruba Instant On CVE-2026-76723 / 76724 / 76725 (CVSS 9.6, 2026-09-29)", disposition: "new item (borderline: true)", fragment: "04-hpe-instant-on-hpesbnw05150", primary: "https://csaf.arubanetworking.hpe.com/2026/hpe_networking_-_hpesbnw05150.txt", source_record: "hpe-networking-psirt", why: "the three ids are adjacent-network (AV:A), not internet-reachable; the same advisory also carries two unauthenticated network 9.8 flaws (CVE-2026-76721/76722); fix is cloud-applied. The same listing also surfaced two larger HPE advisories of 2026-10-06 that the store lacks: ClearPass (item 02, not borderline) and AOS-S (item 03)" }
  - { item: "Zimbra CVE-2026-66912 / CVE-2026-66911 (NCSC-CH advisory 13022, 2026-10-01)", disposition: "covered:2026-08-20/cve-2026-73570-zimbra-snmp-command-injection-exploited", primary: "https://wiki.zimbra.com/wiki/Zimbra_Security_Advisories", why: "the entry's 2026-10-02 update already carries the 10.1.21 release (2026-09-24), the unauthenticated password-recovery code prediction, WebDAV pre-MFA token and OnlyOffice fixes and NCSC-CH's advisory; only the two stored-XSS CVE ids (66911 Content-Location, 66912 sender display name, both CERT.PL reports, no CVSS yet) are not named in its cves[] (they are absent from state/cves_seen.json), a possible metadata-only improvement" }
  - { item: "WatchGuard advisory bundle 2026-09-28 to 2026-10-01 (about 15 CVEs; 20 by the vendor listing)", disposition: "new item (borderline: true)", fragment: "07-watchguard-bundle-0928-1001", primary: "https://psirt.watchguard.com/CVE-2026-101891/", source_record: "watchguard-psirt (candidate record; listing URL https://psirt.watchguard.com/)", why: "none exploited per WatchGuard; the 9.3 unauthenticated AP API session plus AP command injection pair was relayed by NCSC-CH (advisory 13007, 2026-09-29); Firebox items are pre-auth DoS or need preconditions" }

