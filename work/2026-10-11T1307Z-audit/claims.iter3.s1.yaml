  entry: 2026-09-04/cve-2026-20212-cisco-nexus-9000-s1hal-unauth-root-rce
  surface: summary
  kind: frontmatter
  text: Cisco's cisco-sa-n9k-s1-rce-EH8dEtr (2026-09-02) fixes CVE-2026-20212 (CVSS 9.8), a flaw reachable because TCP ports 43210/43211 used by the Silicon One Hardware Abstraction Layer (S1HAL) process
    are exposed in the default Layer 3 VRF on ten named Nexus 9000 product IDs. An unauthenticated network attacker who reaches either port can execute code as root or crash a process that can reload the
    device. Found during a Cisco TAC support case; no known exploitation.
