- claim_id: 51bd30aacb
  entry: 2026-09-21/the-gentlemen-open-directory-vhdx-backup-ntds-theft
  surface: body
  kind: derived
  text: '**Defender takeaway:** backup infrastructure is a credential-theft target in its own right, not only a ransomware-destruction target: any process that mounts, loop-attaches or NBD-attaches a VHDX/VHD
    backup image and then reads `ntds.dit`, `SAM` or `SYSTEM` out of it is functionally equivalent to a live NTDS dump and should alert identically.'
