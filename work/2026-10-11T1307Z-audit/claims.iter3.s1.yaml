- claim_id: 4d27062d30
  entry: 2026-09-24/closedquorum-llm-orchestrated-c2-implant
  surface: body
  kind: uncited
  text: Instead of a dedicated attacker-operated server, its `ModelOrchestrator` component queries up to four commercial LLM providers — DeepSeek, Qwen, Mistral and Google Gemini — each cycle, with a system
    prompt instructing each model to "provide ONLY executable decisions" alongside host context (hostname, OS version, admin status) and the current target process.
- claim_id: 10227fad09
  entry: 2026-09-24/closedquorum-llm-orchestrated-c2-implant
  surface: body
  kind: uncited
  text: Each provider must respond with a fixed JSON schema naming one of four actions; `interModelDiscussion()` tallies the providers' decisions by plurality vote and executes the winner, discarding any
    malformed or off-schema response.
- claim_id: 326267f8d1
  entry: 2026-09-24/closedquorum-llm-orchestrated-c2-implant
  surface: body
  kind: uncited
  text: The four possible actions are `steal` (simultaneous LSASS memory dumping via `SeDebugPrivilege` and `MiniDumpWriteDump`, Chrome/Edge/Firefox saved-credential harvesting, and MetaMask/Exodus/Ethereum
    wallet data collection), `inject` (Early Bird APC injection into a suspended process by default, or PEB-walk process hollowing when a model selects that exploit type), `persist` (establishes three mechanisms
    — a Windows-Update-themed Registry Run-key value, a scheduled task, and a permanent WMI event subscription that fires a script every 60 seconds), and `move`, which has no handler in the public build.
- claim_id: 0072ce79b0
  entry: 2026-09-24/closedquorum-llm-orchestrated-c2-implant
  surface: body
  kind: uncited
  text: Every model decision, its stated reasoning, and staged or stolen data are relayed to the operator through a Discord webhook, with exfiltrated files AES-256-GCM encrypted, base64-encoded and posted
    in roughly 1,900-byte chunks at one-second intervals.
- claim_id: e35a8aace5
  entry: 2026-09-24/closedquorum-llm-orchestrated-c2-implant
  surface: body
  kind: uncited
  text: Talos found the binary via CAIRN, an open-source research toolkit for tracking AI-integrated malware that it released the same day, and its static analysis is dated 2026-06-17, under a prior alias,
