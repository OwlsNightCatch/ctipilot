    ground_truth: The letter (as quoted by The Record and The Register) asks for a briefing on both intrusions, data volume, containment, notification and coordination with law enforcement/CISA, and was sent late Monday at about the time of the agreement; it does not question the shred logs. The 275M / ~8,800-school figure is ShinyHunters' claim about the stolen data; it is Instructure that said the agreement covers all customers.
    ground_truth_url: https://www.theregister.com/cyber-crime/2026/05/12/congress-investigates-canvas-breach-after-instructure-cuts-deal-with-shinyhunters/5238927
