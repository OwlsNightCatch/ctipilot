    ground_truth: Pipeline narration in the reader-facing summary; an incident entry with empty techniques[] though the sources support exploitation of a web flaw (T1190), portal defacement (T1491.002) and extortion; record summary for 2026-05-09 is an empty stub, 2026-05-13 ends in an ellipsis.
