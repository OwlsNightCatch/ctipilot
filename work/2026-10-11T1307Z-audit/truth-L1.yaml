- entry: entries/2026-05-08/kaspersky-q1-2026-exploits-and-vulnerabilities-report-docume.md
  verdict: factual-error
  duplicate_of: null
  ground_truth: 'Mostly unsupported. The cited URL is a 404 and the body''s five substantive findings (PDF-reader share, ''Protected View chains most exploited'', 34% V8 growth, RaaS buying zero-days from brokers, Excel macros via cloud storage) are absent from the real Kaspersky Q1 2026 report (''The vulnerability landscape in Q1 2026'', Alexander Kolesnikov, 2026-05-07, https://securelist.com/vulnerabilities-and-exploits-in-q1-2026/119733/). It is also a vendor statistics report (priority bar: vendor statistics) and should be routine or dropped. Source-supported facts a rewrite can stand on: exploit kits expanded in Q1 2026 with new exploits for Microsoft Office, Windows and Linux; critical-CVE volume (CVSS > 8.9) slightly decreased year on year but the upward trend remains, attributed to React2Shell, mobile exploit frameworks and secondary vulns; AI-assisted discovery expected to raise CVE volume; veteran flaws still dominate detections (CVE-2018-0802, CVE-2017-11882, CVE-2017-0199, CVE-2023-38831,
    CVE-2025-6218, CVE-2025-8088); new chain CVE-2026-21509 + CVE-2026-21514 (Protected View bypass) + CVE-2026-21513 (MSHTML) used together in attacks; Linux detections led by Dirty Pipe CVE-2022-0847 and others; Metasploit back on top of APT C2 frameworks, Sliver and Havoc tied second; notable Q1 vulns: CVE-2026-21519 (DWM), CVE-2026-21533 RegPwn, CVE-2026-25253 OpenClaw, CVE-2026-34070 LangChain, CVE-2026-22812 OpenCode.'
  defects:
  - code: F1
    where: sources[0].url
    claim: https://securelist.com/exploits-vulnerabilities-q1-2026/
    ground_truth: Returns 'Page not found | Securelist'. The real report is at /vulnerabilities-and-exploits-in-q1-2026/119733/ (dated 2026-05-07).
    ground_truth_url: https://securelist.com/vulnerabilities-and-exploits-in-q1-2026/119733/
    fix: Replace with the real URL; title of report is 'The vulnerability landscape in Q1 2026'.
  - code: F4
    where: title / headline / summary / body
    claim: document-based exploits resurge; RaaS acquires zero-days ; with Microsoft Office and PDF readers accounting for the largest share of initial-access exploit deployments
    ground_truth: Report says exploit kits 'expanded once again, incorporating new exploits for the Microsoft Office platform, as well as Windows and Linux'. It never mentions PDF readers, a 'resurgence', or a 'largest share of initial-access deployments'; the share statement it makes is that veteran vulnerabilities (Equation Editor, WinRAR etc.) 'consistently account for the largest share of detections'.
    ground_truth_url: https://securelist.com/vulnerabilities-and-exploits-in-q1-2026/119733/
    fix: Rewrite from the report's actual findings (see ground_truth).
  - code: F4
    where: body ¶1
    claim: The most exploited CVE class involved Office Protected View bypass chains (multiple CVEs published in January 2026 Patch Tuesday).
    ground_truth: 'Report: CVE-2026-21509 and CVE-2026-21514 (Protected View bypass) plus CVE-2026-21513 (MSHTML) ''were utilized together in a single chain''; it says nothing about them being ''most exploited'' (the veterans lead detections) or a January Patch Tuesday.'
    ground_truth_url: https://securelist.com/vulnerabilities-and-exploits-in-q1-2026/119733/
    fix: Name the three CVEs and the chain, drop 'most exploited' and the Patch Tuesday date.
  - code: F14
    where: body ¶1
    claim: Browser exploitation via V8 memory corruption grew 34% quarter-on-quarter.
    ground_truth: No V8, browser-exploit or 34% figure anywhere in the report (full text read).
    ground_truth_url: https://securelist.com/vulnerabilities-and-exploits-in-q1-2026/119733/
    fix: Delete.
  - code: F4
    where: body ¶1
    claim: ransomware-as-a-service operators are increasingly acquiring zero-day exploits directly from private brokers rather than relying on publicly available PoC code, shortening the detection window between disclosure and mass exploitation.
    ground_truth: Not in the report; it covers published-exploit statistics, APT exploitation and C2 frameworks, not RaaS or exploit brokers. Tags 'ransomware' and 'zero-day' are unsupported.
    ground_truth_url: https://securelist.com/vulnerabilities-and-exploits-in-q1-2026/119733/
    fix: Delete; remove ransomware/zero-day tags.
  - code: F4
    where: body ¶1
    claim: The report includes Excel macro delivery via cloud storage abuse as an emerging initial-access technique.
    ground_truth: Not in the report.
    ground_truth_url: https://securelist.com/vulnerabilities-and-exploits-in-q1-2026/119733/
    fix: Delete.
  - code: F16
    where: priority
    claim: 'priority: notable'
    ground_truth: Vendor quarterly statistics report with no defender decision; 'vendor statistics' is a disqualifier for high and the entry is long relative to its value.
    ground_truth_url: https://securelist.com/vulnerabilities-and-exploits-in-q1-2026/119733/
    fix: routine (two sentences) or drop.
  - code: F17
    where: classification
    claim: (no classification block); techniques absent
    ground_truth: Required block missing; research kind should carry techniques where sources support (Protected View/MSHTML chain).
    ground_truth_url: https://securelist.com/vulnerabilities-and-exploits-in-q1-2026/119733/
    fix: 'classification: reliability B, credibility 2 after rewrite.'
- entry: entries/2026-05-08/muddywater-iran-mois-deploys-chaos-ransomware-as-false-flag.md
  verdict: factual-error
  duplicate_of: null
  ground_truth: 'The cited source (Deep Instinct) does not exist (404); the real disclosure is Rapid7''s 2026-05-06 report. The entry''s targeting claim, ransomware-payload claim and ATT&CK ids contradict Rapid7. Source-supported facts for a rewrite (Rapid7 ''Muddying the Tracks: The State-Sponsored Shadow Behind Chaos Ransomware'', 2026-05-06, https://www.rapid7.com/blog/post/tr-muddying-tracks-state-sponsored-shadow-behind-chaos-ransomware/; corroborated by https://thehackernews.com/2026/05/muddywater-uses-microsoft-teams-to.html): an early-2026 intrusion that looked like a Chaos RaaS attack was assessed, with MODERATE confidence, as linked to MuddyWater (MOIS) based on a code-signing certificate and C2 infrastructure; initial access through external Microsoft Teams one-on-one chats with screen sharing, where the actor harvested credentials (typed into local text files) and changed MFA settings to add attacker devices; persistence via DWAgent and AnyDesk, RDP lateral movement incl. a domain
    controller, a custom RAT (Game.exe) delivered by ms_upd.exe; data exfiltrated and the victim emailed for ransom, but NO files were encrypted; Chaos RaaS (active since Feb 2025, ex-BlackSuit/Royal, 36 claimed victims by late March 2026, mostly US construction/manufacturing/business services) is the cover brand; Rapid7 frames MuddyWater as prepositioning ''particularly in the US''.'
  defects:
  - code: F1
    where: sources[0].url
    claim: https://www.deepinstinct.com/blog/muddywater-2026 (Deep Instinct Threat Intelligence — MuddyWater 2026 Campaign)
    ground_truth: Returns 'Page Not Found | Deep Instinct'. The disclosure is by Rapid7, not Deep Instinct.
    ground_truth_url: https://www.rapid7.com/blog/post/tr-muddying-tracks-state-sponsored-shadow-behind-chaos-ransomware/
    fix: Replace with the Rapid7 report URL and publisher; add The Hacker News 2026-05-06 as corroboration.
  - code: F4
    where: body ¶1
    claim: targeting government contractors and defence-adjacent organisations in Europe and the Middle East.
    ground_truth: 'Rapid7 names no government/defence or European/Middle-East targeting; Chaos victims ''predominantly'' in the United States (construction, manufacturing, business services) and MuddyWater activity is described as prepositioning ''particularly in the US''. regions: europe/middle-east are unsupported.'
    ground_truth_url: https://www.rapid7.com/blog/post/tr-muddying-tracks-state-sponsored-shadow-behind-chaos-ransomware/
    fix: 'Delete targeting claim; regions: global/us if kept.'
  - code: F4
    where: title / headline / body ¶1
    claim: deploys Chaos ransomware as false flag ; The campaign deploys **Chaos** ransomware payloads with branding designed to mimic criminal ransomware groups
    ground_truth: 'Rapid7: the actor ''forgo[ed] file encryption in favor of data exfiltration and long-term persistence''; no encryption occurred; the Chaos RaaS banner was used for extortion/negotiation by email and ''Chaos ransomware artifacts'' were present. The actor masqueraded as Chaos; it did not deploy encrypting payloads.'
    ground_truth_url: https://www.rapid7.com/blog/post/tr-muddying-tracks-state-sponsored-shadow-behind-chaos-ransomware/
    fix: '''Operated under the Chaos RaaS brand without encrypting files''.'
  - code: F13
    where: title / body ¶1
    claim: MuddyWater (Iran/MOIS) deploys Chaos ransomware as false flag ; (attributed to Iran's Ministry of Intelligence and Security, MOIS)
    ground_truth: 'Rapid7 attributes only ''with moderate confidence'' (''suggest with moderate confidence that this activity is linked to MuddyWater (Seedworm)'') on a code-signing certificate and C2 infrastructure; the entry states it flatly (confidence: high) and attributes it to ''security researchers'' unnamed.'
    ground_truth_url: https://www.rapid7.com/blog/post/tr-muddying-tracks-state-sponsored-shadow-behind-chaos-ransomware/
    fix: Attribute to Rapid7 and state 'moderate confidence'; set confidence accordingly.
  - code: F4
    where: body ¶1 (technique list) / techniques
    claim: 'Observed ATT&CK techniques: T1566.004 (Spearphishing via Teams), T1649 (Steal or Forge Authentication Certificates), T1486 (Data Encrypted for Impact).'
    ground_truth: 'Pinned ATT&CK v19.2: T1566.004 is ''Spearphishing Voice'' (Teams chat is T1566.003 Spearphishing via Service); T1649 is not supported (the code-signing certificate is attribution evidence, nothing was stolen or forged); T1486 is contradicted (no encryption). Source-supported behaviours: Teams chat + screen sharing credential harvesting, MFA device registration (T1098.005), DWAgent/AnyDesk (T1219), RDP lateral movement (T1021.001), custom RAT, exfiltration, extortion email. frontmatter techniques[] is absent.'
    ground_truth_url: https://www.rapid7.com/blog/post/tr-muddying-tracks-state-sponsored-shadow-behind-chaos-ransomware/
    fix: 'techniques: T1566.003, T1098.005, T1219, T1021.001, T1078 (active ids); drop T1649 and T1486; remove the id list from prose.'
  - code: F4
    where: body ¶1
    claim: A parallel social-engineering vector uses Microsoft Teams external-access invitations to gain remote-assistance sessions under a helpdesk pretext, after which credentials are harvested and used for further access via legitimate cloud services.
    ground_truth: 'Rapid7: Teams external one-on-one chat requests, screen-sharing sessions, victims told to type credentials into local text files and to add attacker-controlled MFA devices; further access via RDP incl. a domain controller and DWAgent/AnyDesk remote tools. It is the main intrusion path, not ''parallel''; ''via legitimate cloud services'' is not stated; IT-helpdesk impersonation is described for Chaos generally (THN) and a Quick Assist-themed phishing page, not clearly this chat.'
    ground_truth_url: https://www.rapid7.com/blog/post/tr-muddying-tracks-state-sponsored-shadow-behind-chaos-ransomware/
    fix: Describe the Teams -> screen share -> credential/MFA harvesting -> DWAgent/AnyDesk/RDP chain.
  - code: F11
    where: body ¶1 last sentence
    claim: This is a single-source threat-intelligence vendor disclosure.
    ground_truth: Pipeline-style provenance commentary in the body; the correct provenance is Rapid7 (named) with THN corroboration.
    ground_truth_url: https://thehackernews.com/2026/05/muddywater-uses-microsoft-teams-to.html
    fix: Delete; put provenance in sourcing_note (two sentences).
  - code: F8
    where: labelled lines
    claim: (no Exposure / Detection / Defender takeaway)
    ground_truth: 'Rapid7 supports a detection/triage set: external-tenant Teams chats that move to screen sharing, remote-management tools (DWAgent, AnyDesk) installed outside change control, MFA device additions after a support chat, RDP to domain controllers from user accounts; ransom email with no encryption as an attribution tell. Absent from entry.'
    ground_truth_url: https://www.rapid7.com/blog/post/tr-muddying-tracks-state-sponsored-shadow-behind-chaos-ransomware/
    fix: Add Exposure/Detection/Defender takeaway lines (e.g. restrict external Teams chat/screen share).
  - code: F17
    where: classification
    claim: (no classification block)
    ground_truth: Required; absent.
    ground_truth_url: https://www.rapid7.com/blog/post/tr-muddying-tracks-state-sponsored-shadow-behind-chaos-ransomware/
    fix: 'classification: reliability B, credibility 3 (single vendor, moderate-confidence attribution; THN is a relay of the same report).'
- entry: entries/2026-05-09/cve-2025-68670-xrdp-pre-authentication-stack-overflow-arbitr.md
  verdict: factual-error
  duplicate_of: null
  ground_truth: 'Technical core (function, 512-byte to 256-byte stack copy, fix 0.10.5 with backports 0.9.27 / 0.10.4.1, reporter timeline) is supported by the Securelist write-up, but the entry presents a flaw that was publicly advisory-disclosed and fixed on 2026-01-27 as a 2026-05-08 disclosure, omits the project''s CVSS 9.1, and ends with an unrelated eight-row CVE table that republishes wrong values from other entries. Source-supported facts: xrdp GHSA-rwvg-gp87-gh6f (published 2026-01-27; critical; CVSS 3.1 9.1 AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:H; CWE-121; affects < 0.10.5; fixed 0.10.5; impact lessened if built with stack-canary protection, a second vulnerability would be needed to leak the canary; check `xrdp -v` for -fstack-protector*/-fhardened) https://github.com/neutrinolabs/xrdp/security/advisories/GHSA-rwvg-gp87-gh6f (read via the GitHub API); Kaspersky Securelist technical analysis dated 2026-05-08 https://securelist.com/cve-2025-68670/119742/ (report 2025-12-05, CVE assigned
    2025-12-24, patch merged 2026-01-27, backports 0.9.27 and 0.10.4.1, crash-only PoC stops at the stack-canary check).'
  defects:
  - code: F4
    where: summary / body ¶1 / event_date
    claim: disclosed by Kaspersky researchers Denis Skvortsov and Dmitry Shmoylov on 2026-05-08 ... public disclosure followed on 2026-05-08
    ground_truth: The xrdp project published its security advisory GHSA-rwvg-gp87-gh6f on 2026-01-27 (patch merged the same day, severity critical, CVSS 9.1); Securelist's 2026-05-08 article is the researchers' technical write-up ~3.5 months later, and credits the maintainers' bulletin. The flaw was not newly disclosed on 2026-05-08, so event_date and 'disclosure' framing misstate its age.
    ground_truth_url: https://securelist.com/cve-2025-68670/119742/
    fix: '''xrdp fixed the flaw on 2026-01-27 (advisory GHSA-rwvg-gp87-gh6f); Kaspersky published its technical analysis on 2026-05-08.'' event_date 2026-01-27 or note both.'
  - code: F4
    where: cves[CVE-2025-68670]
    claim: 'cvss: n/a'
    ground_truth: The project advisory carries CVSS 3.1 base score 9.1 (AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:H), severity critical, CWE-121, vulnerable range '< v0.10.5'.
    ground_truth_url: https://api.github.com/repos/neutrinolabs/xrdp/security-advisories/GHSA-rwvg-gp87-gh6f
    fix: 'cvss: "9.1"; cite the xrdp GHSA as primary (it is the per-CVE authority; only the Kaspersky blog is cited).'
  - code: F4
    where: body ¶1
    claim: Stack canaries are present but bypassable via canary leakage.
    ground_truth: 'Securelist: the vulnerable function is protected by a stack canary on most compilers by default, ''an attacker would first need to obtain the canary value'' and ''could potentially leak or guess'' it; the published PoC ends in ''stack smashing detected''. GHSA: ''a second vulnerability would need to be used to leak the stack canary value''. The entry drops the precondition that makes reliable exploitation depend on a second primitive.'
    ground_truth_url: https://api.github.com/repos/neutrinolabs/xrdp/security-advisories/GHSA-rwvg-gp87-gh6f
    fix: State that canary-protected builds need a separate leak primitive and give the exposure check (`xrdp -v` shows whether -fstack-protector / -fstack-protector-strong / -fhardened was used).
  - code: F5
    where: body ¶1
    claim: xrdp is widely deployed in Linux remote-access and thin-client environments, including public-sector Linux desktops.
    ground_truth: Neither Securelist nor the xrdp advisory says anything about deployment breadth or public-sector use (Securelist only mentions Kaspersky Thin Client / USB Redirector).
    ground_truth_url: https://securelist.com/cve-2025-68670/119742/
    fix: Delete or source.
  - code: F4
    where: body (CVE Summary Table)
    claim: '| CVE-2026-40982 | Spring Cloud Config Server | 9.8 | ... | CVE-2026-42208 | LiteLLM Proxy | 9.3 | ... Yes — ITW ~26 h post-advisory ... | CVE-2026-44128 ... patch 15.0.4.1 | CVE-2025-68670 | xrdp | n/a'
    ground_truth: 'The xrdp entry ends with an eight-row table for seven unrelated findings with values that contradict their primaries: CVE-2026-40982 CNA CVSS 9.1 not 9.8 (cveawg record, HeroDevs page); LiteLLM first exploitation 36 h after advisory (Sysdig/Bishop Fox) not ~26 h; SEPPmail fixes shipped in 15.0.4 on 2026-04-24 (CVE-2026-44128 in 15.0.2.1), 15.0.4.1 is an unrelated hotfix (vendor release notes); CVE-2025-68670 CVSS is 9.1 not n/a; Dirty Frag CVSS 8.8 (CNA)/7.8 not n/a.'
    ground_truth_url: https://cveawg.mitre.org/api/cve/CVE-2026-40982
    fix: Delete the table (it belongs to no single finding and duplicates data held in each CVE's own entry); a rendered digest should never be pasted into one entry's body.
  - code: F18
    where: actions[1]
    claim: If Linux RDP endpoints are internet-accessible, restrict to VPN-only access. RDP on internet-facing Linux hosts is an unnecessary attack surface in virtually all enterprise configurations.
    ground_truth: Generic exposure-reduction advice with an opinion clause, not derived from the cited mechanics (which are fixed by the patch); would be equally true without this entry. Keep only actions[0] (patch to 0.10.5 / distro backport).
    ground_truth_url: https://securelist.com/cve-2025-68670/119742/
    fix: Drop actions[1].
  - code: F16
    where: priority
    claim: 'priority: notable'
    ground_truth: '(low confidence) Pre-auth RCE but patched since 2026-01-27, no exploitation, PoC only crashes at the canary check, canary protection on by default in most builds: a routine patch-cycle item for the vulnerability gate.'
    ground_truth_url: https://api.github.com/repos/neutrinolabs/xrdp/security-advisories/GHSA-rwvg-gp87-gh6f
    fix: routine.
  - code: F17
    where: classification / techniques
    claim: (no classification block; techniques[] absent on a vulnerability entry)
    ground_truth: Required fields missing; the pre-auth network exploit maps to T1190 (and T1210 for the RDP service).
    ground_truth_url: https://securelist.com/cve-2025-68670/119742/
    fix: 'classification: reliability B (Kaspersky research) or A once the project GHSA is primary, credibility 2; techniques [T1190].'
- entry: entries/2026-05-09/cve-2026-0300-palo-alto-pan-os-captive-portal-kev-deadline-t.md
  verdict: factual-error
  duplicate_of: entries/2026-05-12/palo-alto-pan-os-cve-2026-0300-first-wave-fixed-builds-now-s.md
  unique_material: []
  ground_truth: 'Same finding as the 2026-05-08 entry and the 2026-05-12/-14/-18 entries; it contains no verified fact absent from the survivor, and its entire ''post-exploitation detail'' and signature/patch-version content is unsupported by the Unit 42 bulletin and PSIRT it cites. Do not salvage the body. Source-supported facts (https://unit42.paloaltonetworks.com/captive-portal-zero-day/; https://security.paloaltonetworks.com/CVE-2026-0300): Unit 42 tracks CL-STA-1132, ''a cluster of likely state-sponsored threat activity''; failed exploitation attempts from 2026-04-09, RCE a week later with shellcode injected into an nginx worker process; log cleanup (crash kernel messages, nginx crash entries, core dumps); EarthWorm and ReverseSocks5 tunnelling; AD enumeration using the firewall''s service account credentials; ptrace-injection evidence deleted from the audit log and SUID binary deleted; 2026-04-29 SAML flood promoted a second device that was then compromised; Threat ID 510019 (content
    9097-10022, PAN-OS 11.1+) blocks it; mitigations per PSIRT; fixed builds 05/13 and 05/28.'
  defects:
  - code: F4
    where: body ¶3
    claim: 'Unit 42 observed this cluster: creating rogue admin accounts via the GlobalProtect daemon (bypassing normal `admin-role` RBAC), exporting full running configurations including pre-shared keys, installing Python-based tunnelling implants under `/tmp/.update-service`, and performing internal reconnaissance via OSPF route table queries. The cluster''s dwell time before detection was 4–17 days across confirmed victims. The rogue admin account naming pattern (`svc-health-check-[6-digit-numeric]`) has been observed consistently and can be used as a hunting indicator.'
    ground_truth: 'None of this appears in the Unit 42 threat brief (full text read). Unit 42 describes: shellcode injection into an nginx worker, log cleanup, EarthWorm and ReverseSocks5, AD enumeration with the firewall service-account credentials, deletion of ptrace-injection evidence and a SUID binary, and an SAML flood on 2026-04-29. No rogue admin accounts, config export, OSPF queries, /tmp/.update-service, dwell-time range or account-naming pattern. The ''hunting indicator'' is fabricated and would misdirect a hunt.'
    ground_truth_url: https://unit42.paloaltonetworks.com/captive-portal-zero-day/
    fix: Delete; replace with the Unit 42 behaviours above.
  - code: F13
    where: body ¶3
    claim: CL-STA-1132 (a China-nexus cluster it tracks separately from previous PAN-OS attackers) as the primary exploitation actor
    ground_truth: 'Unit 42: ''CL-STA-1132, a cluster of likely state-sponsored threat activity''. No nation is named and nothing about being ''separate from previous PAN-OS attackers''. (BleepingComputer notes EarthWorm has been used by Chinese-speaking groups, which is not an attribution of this cluster.)'
    ground_truth_url: https://unit42.paloaltonetworks.com/captive-portal-zero-day/
    fix: '''likely state-sponsored cluster tracked by Unit 42 as CL-STA-1132''.'
  - code: F4
    where: body ¶1
    claim: the earliest expected maintenance release containing a code fix is **PAN-OS 10.1.14 / 10.2.12 / 11.0.5 / 11.1.4**, expected 2026-05-13.
    ground_truth: 'PSIRT fixed-version table lists hotfix/maintenance builds for 12.1, 11.2, 11.1 and 10.2 only (12.1.4-h5, 12.1.7; 11.2.4-h17, 11.2.7-h13, 11.2.10-h6, 11.2.12; 11.1.4-h33, 11.1.6-h32, 11.1.7-h6, 11.1.10-h25, 11.1.13-h5, 11.1.15; 10.2.7-h34, 10.2.10-h36, 10.2.13-h21, 10.2.16-h7, 10.2.18-h6) with ETAs 05/13 (first wave) and 05/28 (second wave); 10.1.14 and 11.0.5 are not listed (older versions: ''upgrade to a supported fixed version'').'
    ground_truth_url: https://security.paloaltonetworks.com/CVE-2026-0300
    fix: List the actual builds and the two ETA waves, or link the PSIRT table.
  - code: F4
    where: body ¶2
    claim: Threat Prevention signatures 95817/95818/95820 block the known exploitation chain. PA-Series hardware appliances running content update < 8765-9032 are not covered by the signatures.
    ground_truth: 'PSIRT/Unit 42: Threat ID 510019 from Applications and Threats content version 9097-10022 (Unit 42 later updated to 9098), requires PAN-OS 11.1 or later and an (Advanced) Threat Prevention subscription. The three signature ids and the ''8765-9032'' content range appear nowhere.'
    ground_truth_url: https://security.paloaltonetworks.com/CVE-2026-0300
    fix: Threat ID 510019, content 9097-10022, PAN-OS 11.1+.
  - code: F4
    where: body ¶2
    claim: disable Captive Portal (`Device > User Identification > Captive Portal Settings > uncheck Enable Captive Portal`) or disable GlobalProtect and Captive Portal if not operationally needed.
    ground_truth: 'PSIRT mitigation: restrict User-ID Authentication Portal to trusted zones AND disable Response Pages in the Interface Management Profile of every L3 interface where untrusted traffic ingresses, or disable the User-ID Authentication Portal; menu path per BleepingComputer/Rapid7: Device > User Identification > Authentication Portal Settings > Enable Authentication Portal. GlobalProtect is not part of the mitigation.'
    ground_truth_url: https://www.rapid7.com/blog/post/etr-critical-buffer-overflow-in-palo-alto-networks-pan-os-user-id-authentication-portal-cve-2026-0300
    fix: Use the PSIRT wording; drop GlobalProtect.
  - code: F4
    where: body ¶1
    claim: Organisations in US federal scope that cannot meet the KEV deadline through mitigating action face a compliance gap until that release.
    ground_truth: 'KEV catalogue (fetched via cisa-kev): requiredAction ''Apply mitigations per vendor instructions ... Until the vendor releases an official fix, the following workaround should be implemented: Restrict User-ID Authentication Portal access to only trusted zones; Disable User-ID Authentication Portal if not required'' - the workaround satisfies the due date (2026-05-09, added 2026-05-06); no compliance gap. Using a KEV due date as the reason to act is also against house style.'
    ground_truth_url: https://www.cisa.gov/known-exploited-vulnerabilities-catalog
    fix: Delete the compliance sentence and the KEV-deadline headline framing.
  - code: F4
    where: body ¶3
    claim: Palo Alto Unit 42 published a threat bulletin on 2026-05-08
    ground_truth: Unit 42's brief appeared on 2026-05-06/07 (BleepingComputer cites it on 2026-05-07; Rapid7 update 2026-05-07); the 2026-05-08 date is only an update note ('Updated May 8, 2026 ... product protections section, adding Cortex AgentiX and updating the Applications and Threats content version').
    ground_truth_url: https://unit42.paloaltonetworks.com/captive-portal-zero-day/
    fix: 2026-05-06/07 (updated 2026-05-08).
  - code: F2
    where: sources[1].url
    claim: 'https://www.cisa.gov/known-exploited-vulnerabilities-catalog (role: corroborating, ''CISA KEV entry CVE-2026-0300'')'
    ground_truth: A catalogue landing page (hard-blocked pattern), not a per-CVE page.
    ground_truth_url: https://www.cisa.gov/known-exploited-vulnerabilities-catalog
    fix: Drop it; use the PSIRT, Unit 42 and https://www.rapid7.com/blog/post/etr-critical-buffer-overflow-in-palo-alto-networks-pan-os-user-id-authentication-portal-cve-2026-0300 (read this pass) as corroboration.
  - code: F4
    where: cves[] / sectors / classification / techniques
    claim: 'cves: []; sectors: public-sector, defense; (no classification, no techniques)'
    ground_truth: cves[] empty for a CVE-titled entry; no source names victim sectors (Unit 42 gives none); classification and techniques missing.
    ground_truth_url: https://unit42.paloaltonetworks.com/captive-portal-zero-day/
    fix: Fold into the survivor entry; do not keep as a separate record.
- entry: entries/2026-05-09/cve-2026-31431-copy-fail-cisa-kev-deadline-2026-05-15-approa.md
  verdict: factual-error
  duplicate_of: null
  ground_truth: 'A bare ''UPDATE (originally covered 2026-05-06)'' with no base entry in the store: it is the store''s only Copy Fail entry yet never says what the flaw is. Its two substantive paragraphs contain a wrong KEV date, invented distro kernel versions, and a Microsoft attribution the post does not make. Source-supported facts for a rewrite: Copy Fail CVE-2026-31431, local privilege escalation in the kernel''s algif_aead (AF_ALG crypto interface), CVSS 3.1 7.8 (kernel CNA / Red Hat), in-place optimisation introduced 2017 (commit 72548b093ee3), reverted by mainline a664bf3d603d (2026-04-01); AF_ALG + splice() gives a controlled 4-byte page-cache write to a setuid binary such as /usr/bin/su, works on Ubuntu 24.04, Amazon Linux 2023, RHEL 10.1, SUSE 16; disclosed publicly 2026-04-29 by Xint/Theori, public PoC (https://xint.io/blog/copy-fail-linux-distributions); CERT-EU advisory 2026-005 v1.0 dated 2026-04-29 (https://cert.europa.eu/publications/security-advisories/2026-005/); CISA
    KEV dateAdded 2026-05-01, due 2026-05-15 (cisa-kev recipe); Ubuntu fixed kernels: 22.04 5.15.0-179.189, 24.04 6.8.0-117.117 (https://ubuntu.com/security/CVE-2026-31431); mitigation: block AF_ALG or blacklist algif_aead (Xint).'
  defects:
  - code: F4
    where: body ¶1 / title / summary
    claim: CISA added CVE-2026-31431 to KEV on 2026-05-06 with a federal remediation deadline of **2026-05-15**
    ground_truth: 'CISA KEV record (fetched via cisa-kev): dateAdded 2026-05-01, dueDate 2026-05-15. ''Six days from today'' is arithmetic on the due date; the add date is wrong by five days. Framing the entry (title) on the KEV deadline is also a house-style defect.'
    ground_truth_url: https://www.cisa.gov/known-exploited-vulnerabilities-catalog
    fix: '''Added to KEV 2026-05-01''; retitle on the vulnerability and its exploitation, not the deadline.'
  - code: F4
    where: body ¶1
    claim: 'Downstream distribution patches: Ubuntu 22.04/24.04 (linux-image 6.1.98-1ubuntu1); RHEL 8/9 (kernel-5.14.0-503.14.1); Debian 12 (pending as of 2026-05-09 06:00 UTC).'
    ground_truth: Ubuntu's tracker lists jammy (22.04) fixed in 5.15.0-179.189 and noble (24.04) fixed in 6.8.0-117.117; '6.1.98-1ubuntu1' is not an Ubuntu kernel for either release (6.1.x is Debian 12's line). RHEL 8 ships 4.18 kernels, so a single 5.14.0 version cannot cover 'RHEL 8/9', and Red Hat's CVE page gives no such build (low confidence on RHEL); the Debian 'pending as of 06:00 UTC' timestamp has no source.
    ground_truth_url: https://ubuntu.com/security/CVE-2026-31431
    fix: Cite the vendor trackers for fixed versions or drop the version list.
  - code: F13
    where: body ¶2
    claim: Microsoft observes that threat actors are using CVE-2026-31431 and CVE-2026-43284/43500 (Dirty Frag) as **complementary techniques** in post-compromise Linux privilege escalation operations — deploying CVE-2026-31431 on hosts where the `algif_aead` module is available and `rxrpc`/`esp*` are not, and Dirty Frag on hosts where user namespaces are enabled without `algif_aead`. The same initial access vector (SSH-based credential stuffing with exposed management ports) is used across both chains. This operationalises the two LPE vulnerabilities as a "pair"
    ground_truth: 'The Microsoft post says only: ''Microsoft Defender is currently seeing limited in-the-wild activity where privilege escalation involving su is observed, and which may be indicative of techniques associated with either Dirty Frag or Copy Fail'', with an external connection gaining SSH access, an ELF (./update) triggering su escalation, then GLPI LDAP-file edits and PHP session-file deletion/reads. No complementary-use finding, no module-availability logic, no credential stuffing. The only ''complementary'' pairing in the sources is the V4bel write-up''s ESP + RxRPC variants of Dirty Frag covering each other''s blind spots.'
    ground_truth_url: https://www.microsoft.com/en-us/security/blog/2026/05/08/active-attack-dirty-frag-linux-vulnerability-expands-post-compromise-risk/
    fix: State Microsoft's hedged observation (activity may be Dirty Frag or Copy Fail) and drop the pairing/credential-stuffing claims.
  - code: F3
    where: sources[1] / evidence of CERT-EU
    claim: 'publisher: CERT-EUROPA advisory 2026-005 update, 2026-05-08'
    ground_truth: CERT-EU 2026-005 is v1.0 dated 29/04/2026 (page dated 2026-04-30) with no later history; it reports 'no distribution has shipped a fixed kernel package' as of 30 April and contains nothing dated 2026-05-08 or about distribution patches.
    ground_truth_url: https://cert.europa.eu/publications/security-advisories/2026-005/
    fix: Date it 2026-04-29 and cite it only for the disclosure, CVSS 7.8 and interim mitigation.
  - code: F4
    where: body ¶1
    claim: the `algif_aead` module (present by default on most distributions unless FIPS mode is active)
    ground_truth: (low confidence) No fetched source mentions FIPS; Xint says AF_ALG is available to unprivileged users by default and the mitigation is blocking AF_ALG socket creation or blacklisting algif_aead.
    ground_truth_url: https://xint.io/blog/copy-fail-linux-distributions
    fix: Delete the FIPS clause.
  - code: F8
    where: body / cves[] / techniques / primary source
    claim: 'cves: []; (no description of the flaw, no CVSS, no mitigation, no techniques); primary = Microsoft Dirty Frag blog'
    ground_truth: Entry never states what Copy Fail is, that it is a page-cache write via AF_ALG/splice, the CVSS (7.8), affected scope (kernels since 2017), public PoC, or the blacklist mitigation; the first source is a blog about a different vulnerability. The discloser's post (Xint/Theori) and CERT-EU are the primaries.
    ground_truth_url: https://xint.io/blog/copy-fail-linux-distributions
    fix: Rewrite as a stand-alone entry with cves[CVE-2026-31431] (cvss 7.8, exploited/cisa-kev), techniques (T1068, T1611), Exposure/Detection/Defender takeaway lines.
  - code: F11
    where: title / summary / body
    claim: 'summary: "UPDATE (originally covered 2026-05-06):" ; **UPDATE (originally covered 2026-05-06):**'
    ground_truth: Pipeline narration from the migration; there is no 2026-05-06 entry for it to update.
    ground_truth_url: https://cert.europa.eu/publications/security-advisories/2026-005/
    fix: Delete the narration.
  - code: F2
    where: sources[2].url
    claim: https://www.cisa.gov/known-exploited-vulnerabilities-catalog
    ground_truth: Catalogue landing page (hard-blocked pattern).
    ground_truth_url: https://www.cisa.gov/known-exploited-vulnerabilities-catalog
    fix: Drop; cite Ubuntu/Red Hat trackers and the Xint disclosure.
  - code: F17
    where: classification
    claim: (no classification block)
    ground_truth: Required on every entry; absent.
    ground_truth_url: https://cert.europa.eu/publications/security-advisories/2026-005/
    fix: 'classification: reliability A/B, credibility 2 once re-sourced.'
- entry: entries/2026-05-09/cve-2026-40982-spring-cloud-config-server-pre-authentication.md
  verdict: factual-error
  duplicate_of: null
  ground_truth: 'The CVSS (9.8 in title, summary, cves[] and the xrdp-entry table) is wrong against the owning CNA record (9.1), ''all actively-maintained branches'' is wrong (only 4.3.x and 5.0.x have OSS fixes; 3.1/4.1/4.2 are enterprise-only/EOL), and ''rce'' is not what the advisory describes. Supported facts: Spring advisory https://spring.io/security/cve-2026-40982 (2026-05-06): crafted URL causes directory traversal in spring-cloud-config-server; affected 5.0.0-5.0.2, 4.3.0-4.3.2, 4.2.0-4.2.6, 4.1.0-4.1.9, 3.1.13 and earlier; fixed 5.0.3 and 4.3.3 (OSS), 4.2.7, 4.1.10, 3.1.14 (Enterprise Support only); CVE record (CNA VMware): CVSS 3.1 9.1 AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N, CWE-22; CISA-ADP SSVC: exploitation none, automatable yes, technical impact total; companions CVE-2026-40981 (7.5 High, CWE-639, GCP Secret Manager backend), CVE-2026-41002 (7.4 High, CWE-367 TOCTOU on git basedir), CVE-2026-41004 (4.4 Medium, CWE-532 sensitive data in logs); CERT-FR AVI-0543 (2026-05-07); HeroDevs
    analysis (2026-05-08) notes the Config Server resource endpoints are read-only (information disclosure) and 3.1/4.1/4.2 are EOL branches.'
  defects:
  - code: F4
    where: title / summary / cves[CVE-2026-40982].cvss / body ¶1
    claim: CVE-2026-40982 (CWE-22, CVSS 9.8) ... pre-authentication path traversal, CVSS 9.8
    ground_truth: The CNA (VMware/Spring) CVE record gives CVSS 3.1 9.1 (AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N). The HeroDevs page cited inline now reads 'CVSS 9.1' (only its URL slug retains '9.8'). 9.8 is in no authoritative source.
    ground_truth_url: https://cveawg.mitre.org/api/cve/CVE-2026-40982
    fix: cvss "9.1" in title, summary, cves[] (and wherever copied).
  - code: F4
    where: title / body ¶1
    claim: 'all actively-maintained branches affected ; All actively-maintained branches are affected: 3.1.x, 4.1.x, 4.2.x, 4.3.x, and 5.0.x, plus all unsupported versions. Open-source patches: 4.3.3 and 5.0.3'
    ground_truth: Only 4.3.x and 5.0.x have open-source fixes; 4.2.7, 4.1.10 and 3.1.14 are 'Enterprise Support Only' per the Spring advisory, and HeroDevs describes 3.1.x, 4.1.x and 4.2.x as end-of-life (tied to EOL Spring Boot 3.1/3.3/3.4). So 3.1/4.1/4.2 are not 'actively maintained'.
    ground_truth_url: https://spring.io/security/cve-2026-40982
    fix: '''Affects 3.1.x-5.0.x and older; OSS fixes only for 4.3.3 and 5.0.3; 4.2.7/4.1.10/3.1.14 are enterprise-support only.'''
  - code: F4
    where: tags / cves[].type
    claim: 'tags: rce; type: rce; ''read or write arbitrary files accessible to the server process'''
