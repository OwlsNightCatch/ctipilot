- entry: entries/2026-05-09/inditex-zara-shinyhunters-publishes-140-gb-197-400-eu-custom.md
  verdict: factual-error
  duplicate_of: null
  ground_truth: '197,400 emails (HIBP), the Inditex data-categories-out-of-scope list, the ''started notifying the relevant authorities'' quote and the ShinyHunters/Anodot claim are supported, but the headline asserts as confirmed what is only ShinyHunters'' claim and invents ''EU customer records'', and the entry attributes HIBP''s findings to Inditex. Supported facts: Security Affairs (2026-05-08 https://securityaffairs.com/191859/cyber-crime/zara-data-breach-197000-customers-exposed-in-third-party-security-incident.html) and BleepingComputer (2026-05-08 https://www.bleepingcomputer.com/news/security/zara-data-breach-exposed-personal-information-of-197-000-people/): Inditex said a former technology provider''s databases were accessed, no names, phone numbers, addresses, credentials or payment data; HIBP (https://haveibeenpwned.com/Breach/Zara) found 197,400 unique emails with order IDs, product SKUs, support-ticket market and purchase history; ShinyHunters claimed the breach via Anodot
    tokens against BigQuery and published a 140 GB archive (HIBP says ''a terabyte ... 95M support ticket records''); Inditex has not named the provider or an actor.'
  defects:
  - code: F4
    where: title / headline
    claim: Inditex (Zara) — ShinyHunters publishes 140 GB; 197,400 EU customer records confirmed via third-party analytics compromise
    ground_truth: 'HIBP: 197k emails with ''the market the support ticket originated in'' (''international markets''); nothing limits them to EU customers. ''Via third-party analytics compromise'' is ShinyHunters'' claim (''The group claimed the breach was related to a compromise of the Anodot analytics platform''); Inditex only says ''a former technology provider'' and has not named it. The body itself says the claim ''has not been independently verified'', contradicting the headline.'
    ground_truth_url: https://haveibeenpwned.com/Breach/Zara
    fix: '''197,400 Zara customer emails exposed via a former Inditex technology provider; ShinyHunters claims Anodot token abuse and leaked 140 GB''.'
  - code: F3
    where: body ¶1
    claim: Inditex confirmed attackers accessed customer relationship data — email addresses, geographic locations, purchase history (order IDs and product SKUs), and support ticket content — across international markets
    ground_truth: Inditex's statement says the databases held 'information about business relationships with customers in different markets' and that names, phone numbers, addresses, credentials and payment data were not accessed; the email/SKU/order-ID/support-ticket composition comes from Have I Been Pwned's analysis, not from Inditex.
    ground_truth_url: https://www.bleepingcomputer.com/news/security/zara-data-breach-exposed-personal-information-of-197-000-people/
    fix: Attribute the data categories to HIBP.
  - code: F4
    where: summary / body ¶1
    claim: following a breach of a former third-party analytics provider
    ground_truth: Inditex says 'former technology provider'; 'analytics' is ShinyHunters' (and HIBP's repetition of the group's) claim about Anodot.
    ground_truth_url: https://securityaffairs.com/191859/cyber-crime/zara-data-breach-197000-customers-exposed-in-third-party-security-incident.html
    fix: '''former technology provider''.'
  - code: F9
    where: body ¶1
    claim: Data publication (approximately 140 GB) followed after Inditex declined to engage.
    ground_truth: 'Sources disagree on size: Security Affairs / BleepingComputer ''a 140GB archive''; HIBP ''published a terabyte of data allegedly including 95M support ticket records''. ''Declined to engage'' is ShinyHunters'' own claim (''failed to reach an agreement with us despite our incredible patience''), stated as fact. Neither a Contradiction line nor attribution is given.'
    ground_truth_url: https://haveibeenpwned.com/Breach/Zara
    fix: Attribute to ShinyHunters and note the 140 GB vs ~1 TB discrepancy.
  - code: F5
    where: body ¶1
    claim: as a Spanish company the lead supervisory authority is the AEPD
    ground_truth: Legal inference with no cited source (and Inditex's statement names no authority).
    ground_truth_url: https://securityaffairs.com/191859/cyber-crime/zara-data-breach-197000-customers-exposed-in-third-party-security-incident.html
    fix: Delete.
  - code: F7
    where: priority / relevance
    claim: 'priority: notable; kind: incident'
    ground_truth: (low confidence) Spanish retail breach with no Swiss or public-sector nexus; record-count and brand framing in the title. The transferable lesson (OAuth/service tokens of analytics SaaS reaching a cloud data warehouse; ShinyHunters' Anodot campaign) is sound but belongs in two sentences, not a victim-named incident.
    ground_truth_url: https://www.bleepingcomputer.com/news/security/zara-data-breach-exposed-personal-information-of-197-000-people/
    fix: routine, framed on the Anodot token-abuse TTP.
  - code: F17
    where: classification / techniques
    claim: (no classification block; techniques[] absent)
    ground_truth: 'Required; absent (stolen SaaS tokens: T1528 / T1530 are mappable from the ShinyHunters claim).'
    ground_truth_url: https://securityaffairs.com/191859/cyber-crime/zara-data-breach-197000-customers-exposed-in-third-party-security-incident.html
    fix: 'classification: reliability B, credibility 3 (actor claim only partly corroborated by HIBP).'
- entry: entries/2026-05-09/seppmail-secure-email-gateway-cvss-9-3-unauthenticated-rce-c.md
  verdict: factual-error
  duplicate_of: entries/2026-05-09/cve-2026-44128-et-al-seppmail-secure-email-gateway-cvss-9-3.md
  unique_material: []
  ground_truth: 'Duplicate of the CVE-2026-44128 SEPPmail entry (same NCSC-CH 12551 advisory, same six CVEs) and almost entirely unsupported: every technical mechanism, endpoint, file path, product-stack claim and the compliance paragraphs are absent from NCSC-CH 12551, the SEPPmail release notes and InfoGuard, and contradict the CNA records (the GINA UI is Perl on an OpenBSD-based appliance, not Java EE/Tomcat). The CVE/CVSS table values are right (CVSS v4.0), the ''exploitation none confirmed'' framing is right. It carries no verified fact the survivor lacks. Do not salvage the body; fold into the survivor. Source-supported facts for any SEPPmail rewrite: NCSC-CH advisory post 12551 (2026-05-08; https://security-hub.ncsc.admin.ch/api/posts/12551/details via the ncsc-csh recipe) lists CVE-2026-7864 (6.9), -44125 (9.3), -44126 (9.2), -44127 (8.8), -44128 (9.3, ''Fixed in v15.0.2.1''), -44129 (8.3), exploitation status UNKNOWN, ''Vendor patches available since April 24th, 2026''. CNA (NCSC.ch)
    records (https://cveawg.mitre.org/api/cve/CVE-2026-44128 etc., CVSS v4.0): 44128 unauthenticated RCE, an endpoint passes a parameter to Perl eval() in the new GINA UI (affects < 15.0.2.1); 44125 missing authorization on multiple GINA UI endpoints, unauthenticated; 44126 insecure deserialization reachable from the GINA UI, unauthenticated RCE (AT:P); 44127 unauthenticated path traversal in /api.app/attachment/preview identifier parameter (file read, deletion of files in the target directory); 44129 SSTI, attacker-controlled template, unauthenticated (AT:P), potential RCE depending on template plugins; 7864 unauthenticated exposure of environment variables via the new GINA UI; all affect < 15.0.4 except 44128. SEPPmail release notes https://downloads.seppmail.com/extrelnotes/150/ERN15.0.html: 15.0.4 (2026-04-24) closes six ''Vuln:'' tickets (insecure deserialization, missing authorization in GINAv2, SSTI, unauthenticated RCE, LFI/arbitrary file deletion, exposure of sensitive information)
    stemming from test endpoints active in the beta GINAv2; 15.0.4.1 (2026-04-28) is an unrelated hotfix (missing waitpid() PID exhaustion). InfoGuard Labs https://labs.infoguard.ch/posts/seppmail_secure_e-mail_gateway_rce_vulnerabilities_cve-2026-2743_cve-2026-7864_cve-2026-44127_cve-2026-44128/ (2026-05-18): appliance is OpenBSD-based with Perl web apps; GINA v2.x must be explicitly enabled; self-registration enabled by default gives an authenticated session; fix versions 15.0.2.1 (44128), 15.0.3 (44126), 15.0.4 (2743, 44125, 44127, 44129, 7864); CVE-2026-2743 (CVSS 4.0 10.0, published 2026-03-05) is a pre-auth path traversal in LFT /v1/file.app writing as ''nobody'', chained via /etc/syslog.conf + newsyslog to RCE, affects only LFT-licensed instances (404 = not affected). SEPPmail AG is at Industriestrasse 7, 5432 Neuenhof (https://www.seppmail.com/about-us/contact/).'
  defects:
  - code: F4
    where: 'body: ''CVE-2026-44128 - Unauthenticated RCE via Active Test Endpoints'', ''Exploitation path'', ''CVE-2026-44125/44126/44127/44129'' sections'
    claim: GINAv2 is a Java EE–based web application deployed on a Tomcat servlet container ... a test/diagnostic HTTP servlet (`/gina/diag/exec`) ... invoke `Runtime.exec()` as the Tomcat application user ... `gina.properties` ... `/gina/api/v1/admin/` ... `GINA_SESSION=../../uploads/<filename>` ... Apache Commons Collections gadget ... `/admin/logs/view?file=` on port 8443 ... Freemarker ... `${Runtime.exec("id")}`
    ground_truth: 'None of these paths, classes, files, ports, the Tomcat/Java stack, the Commons Collections PoC or the Freemarker engine appears in NCSC-CH 12551, the SEPPmail release notes or InfoGuard. The real components are Perl web apps on an OpenBSD-based appliance: CVE-2026-44128 = unauthenticated Perl eval() of the `upldd` parameter at /api.app/template; CVE-2026-44127 = unauthenticated path traversal in /api.app/attachment/preview (`identifier`); CVE-2026-7864 = unauthenticated env dump at /api.app/hello?op=env; CVE-2026-44125 = missing authorization on multiple GINA UI endpoints; CVE-2026-44126 = insecure deserialization (unauthenticated); CVE-2026-44129 = SSTI via attacker-controlled template. The invented paths would send a hunter to artefacts that do not exist.'
    ground_truth_url: https://labs.infoguard.ch/posts/seppmail_secure_e-mail_gateway_rce_vulnerabilities_cve-2026-2743_cve-2026-7864_cve-2026-44127_cve-2026-44128/
    fix: Delete; rebuild from the CNA records and InfoGuard (see ground_truth).
  - code: F4
    where: 'body: patch statements and ''Hardening and Remediation'''
    claim: all patched in SEPPmail 15.0.4 (patch 15.0.4.1) ... Upgrade to SEPPmail **15.0.4 (patch 15.0.4.1)** — addresses all six CVEs.
    ground_truth: 15.0.4 is the 2026-04-24 release; 15.0.4.1 (2026-04-28) is an unrelated hotfix; CVE-2026-44128 was already fixed in 15.0.2.1 (NCSC-CH, CNA, InfoGuard) and CVE-2026-44126 in 15.0.3 (InfoGuard). 'Available via the standard SEPPmail update mechanism and the downloads portal for accounts under valid support' and 'security@seppmail.com' have no source.
    ground_truth_url: https://downloads.seppmail.com/extrelnotes/150/ERN15.0.html
    fix: As in the survivor entry's corrected fix-version statement.
  - code: F4
    where: vulnerability table 'Auth Required' column
    claim: CVE-2026-44127 ... Low-privilege auth ; CVE-2026-44129 ... Low-privilege auth ; CVE-2026-7864 ... Appliance management | Information disclosure | Low-privilege auth ; CVE-2026-44126 ... None (cookie-supplied)
    ground_truth: 'CNA records: 44127 and 7864 are unauthenticated (PR:N); 44129 is PR:N with AT:P; 44126 reachable by unauthenticated attackers. ''Any valid admin console account'' / ''appliance management on 8443'' is invented. CVSS values themselves (9.3/9.3/9.2/8.8/8.3/6.9) match the CNA records.'
    ground_truth_url: https://cveawg.mitre.org/api/cve/CVE-2026-44127
    fix: Correct the auth column.
  - code: F4
    where: body 'Background and Deployment Context'
    claim: 'SEPPmail AG (Steinach, Canton of St. Gallen, Switzerland) ... SEPPmail is the dominant email encryption gateway in the Swiss public sector: cantonal administrations, Swiss federal bodies (EJPD/DFJP, SECO, cantonal courts), university hospitals'
    ground_truth: SEPPmail AG is at Industriestrasse 7, 5432 Neuenhof (AG). No cited source names SEPPmail's customers or its market share; 'GINA (Gateway Integrated Network Application)' expansion is also unsourced.
    ground_truth_url: https://www.seppmail.com/about-us/contact/
    fix: Neuenhof AG; delete customer/market-share claims.
  - code: F4
    where: body 'Swiss and DACH Deployment Context'
    claim: The Swiss Federal Chancellery's ICT security baseline for federal agencies (Sicherheitsstandard IKT des Bundes, ISBB) classifies email gateway compromise as a Level 3 incident requiring escalation to NCSC-CH within 24 hours. ; BSI IT-Grundschutz includes email encryption gateways in the APP.4.4 component scope; ... qualifies for an extraordinary IT-Grundschutz gap notification under ISMS procedures.
    ground_truth: No cited source contains these regulatory statements (the only cited sources are NCSC-CH 12551 and the SEPPmail release notes). (low confidence on the id) APP.4.4 in IT-Grundschutz is the Kubernetes building block, e-mail servers fall under APP.5.x; 'extraordinary gap notification' is not a BSI procedure the entry sources.
    ground_truth_url: https://security-hub.ncsc.admin.ch/api/posts/12551/details
    fix: Delete the paragraph.
  - code: F4
    where: body 'MITRE ATT&CK Mapping' table
    claim: 'T1078.001 Valid Accounts: Default Accounts (CVE-2026-44125 missing auth); T1059.007 Server-Side Template Injection; T1083 Path Traversal / File and Directory Discovery; T1070.002 Indicator Removal: Clear Linux or Mac System Logs'
    ground_truth: 'Pinned ATT&CK v19.2: T1059.007 is JavaScript (not SSTI); T1078.001 (default accounts) is unsupported for a missing-authorization flaw; T1070.002 is revoked (superseded by T1685.006); T1083 is File and Directory Discovery (no path-traversal technique). techniques[] frontmatter is absent while ids sit in prose.'
    ground_truth_url: https://cveawg.mitre.org/api/cve/CVE-2026-44125
    fix: Remove the table; techniques [T1190] (+ T1552.001/T1114 only if sourced).
  - code: F8
    where: cves[] / kind / classification
    claim: 'cves: []; kind: threat; deep_dive: true; (no classification, no techniques)'
    ground_truth: Six CVEs in a table but cves[] empty; typed `threat` though it is a vulnerability advisory; classification and techniques missing; a 'deep dive' whose depth is fabricated.
    ground_truth_url: https://security-hub.ncsc.admin.ch/api/posts/12551/details
    fix: Fold into the survivor and delete.
