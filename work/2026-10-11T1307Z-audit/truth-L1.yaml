- entry: entries/2026-05-08/amazon-ses-weaponised-for-authenticated-phishing-and-bec-kas.md
  verdict: factual-error
  duplicate_of: null
  ground_truth: 'Core mechanism (leaked IAM keys, SPF/DKIM/DMARC pass, finance-targeted BEC, AWS-hosted phishing pages) is supported by the Kaspersky report, but the cited primary URL is a dead invented link and one targeting claim is not in any source. Entry can be repaired in place. Source-supported facts for a rewrite (https://securelist.com/amazon-ses-phishing-and-bec-attacks/119623/, Kaspersky/Roman Dedenok, 2026-05-04): uptick in SES-abuse phishing since January 2026, steady through Q1; attackers get leaked IAM access keys from public GitHub repos, ENV files, Docker images, config backups and public S3 buckets using TruffleHog-based bots, then verify permissions and sending limits; mail passes SPF/DKIM/DMARC and carries .amazonses.com in Message-ID headers; sender IPs are not on reputation blocklists; early-2026 lure was a fake e-signature (DocuSign-style) notification leading to a sign-in form on amazonaws.com; BEC case was a fabricated invoice email thread to a company''s finance
    department with PDF attachments holding only payment details; mitigations: least-privilege IAM, roles instead of static keys, MFA, IP restrictions, key rotation/audits. Corroboration: https://www.bleepingcomputer.com/news/security/researchers-report-amazon-ses-abused-in-phishing-to-evade-detection/ (2026-05-04) and Kaspersky press release https://me-en.kaspersky.com/about/press-releases/kaspersky-warns-of-phishing-attacks-via-compromised-amazon-simple-email-service-accounts (2026-05-11).'
  defects:
  - code: F1
    where: sources[0].url
    claim: https://securelist.com/amazon-ses-bec-campaign-2026/
    ground_truth: URL returns 'Page not found | Securelist' (fetched this pass). The real Kaspersky report is 'Phishing campaigns and BEC attacks through Amazon SES', author Roman Dedenok, dated 2026-05-04.
    ground_truth_url: https://securelist.com/amazon-ses-phishing-and-bec-attacks/119623/
    fix: Replace the primary URL with https://securelist.com/amazon-ses-phishing-and-bec-attacks/119623/ (and add the BleepingComputer 2026-05-04 article as corroboration).
  - code: F4
    where: 'body ¶1 (and regions: europe)'
    claim: Kaspersky observed targeting of finance departments at European manufacturing firms.
    ground_truth: The report names no sector, country or manufacturing victim; its only targeting statement is that one BEC email was sent 'to the company's finance department, requesting urgent payment'. 'European' and 'manufacturing' appear in neither the Securelist report, BleepingComputer nor the Kaspersky press release.
    ground_truth_url: https://securelist.com/amazon-ses-phishing-and-bec-attacks/119623/
    fix: Delete the sentence; say only that the BEC lure was addressed to a victim organisation's finance department. Drop 'europe' from regions unless a source supports it.
  - code: F4
    where: body ¶1
    claim: Attackers obtain SES API credentials from publicly exposed AWS configuration files (S3 bucket misconfigurations, leaked GitHub repositories).
    ground_truth: 'Report: attackers use leaked IAM access keys found in ''public GitHub repositories, ENV files, Docker images, configuration backups, or even in publicly accessible S3 buckets'', hunted with TruffleHog-based bots; they are IAM keys, not ''SES API credentials'' found in ''AWS configuration files''. Direction is right, wording imprecise.'
    ground_truth_url: https://securelist.com/amazon-ses-phishing-and-bec-attacks/119623/
    fix: '''Attackers abuse leaked AWS IAM access keys harvested from public GitHub repositories, ENV files, Docker images, configuration backups and open S3 buckets, then verify key permissions and SES sending limits.'''
  - code: F11
    where: title / body ¶1
    claim: (Kaspersky, 2026-05-04, ~96 h) ... This report is approximately 96 hours old at publication; first coverage in this brief series.
    ground_truth: Pipeline-internal staleness/series narration, not reader information; the Kaspersky report date (2026-05-04) is correct.
    ground_truth_url: https://securelist.com/amazon-ses-phishing-and-bec-attacks/119623/
    fix: Remove '~96 h' from title/headline and the 'first coverage in this brief series' sentence.
  - code: F17
    where: classification
    claim: (no classification block on the entry)
    ground_truth: Organisation profile requires classification {reliability, credibility} on every entry; none present.
    ground_truth_url: https://securelist.com/amazon-ses-phishing-and-bec-attacks/119623/
    fix: 'Add classification: reliability B (vendor research lab), credibility 2 (primary report corroborated by BleepingComputer''s independent coverage).'
  - code: F8
    where: techniques / labelled lines
    claim: (no techniques[], no Exposure/Detection/Defender takeaway lines)
    ground_truth: 'Report describes mappable behaviour: leaked-key harvesting from public repos, abuse of cloud accounts to send mail, link-based credential phishing, fabricated-thread BEC. Source-supported detection hooks: ''.amazonses.com'' in Message-ID headers, sign-in pages hosted on amazonaws.com; mitigations listed (least privilege, roles, MFA, IP restriction, rotation). None of this reaches the entry.'
    ground_truth_url: https://securelist.com/amazon-ses-phishing-and-bec-attacks/119623/
    fix: Add techniques (e.g. T1552.001, T1078.004, T1566.002, T1684.001 - all active in the pinned dataset) and a Detection / Defender takeaway line built from the report's own indicators and mitigations.
- entry: entries/2026-05-08/cert-fr-certfr-2026-act-016-agentic-ai-tools-introduce-promp.md
  verdict: factual-error
  duplicate_of: null
  ground_truth: 'The advisory is real and the URL resolves, but the entry describes a different document: it invents MCP-server supply-chain risk, ''guardrails'', ''tool-call allowlisting'' and an untrusted-output rule, and names products the advisory does not mention, while omitting the advisory''s actual headline recommendation (do not deploy such assistants on workstations; confine to isolated sandboxes). Rewrite on the following source-supported facts (https://www.cert.ssi.gouv.fr/actualite/CERTFR-2026-ACT-016/, CERT-FR, 2026-04-13, title ''Vulnérabilités et risques des produits d''automatisation par IA agentique sur les postes de travail''): since early 2026 autonomous personal assistants such as OpenClaw and Claude Cowork see strong adoption; they can run commands, control the browser, read/write files, manage calendar and send mail, triggered by chat messages (Slack, WhatsApp, Discord); plugins can be loaded dynamically and run as trusted code with the application''s privileges, widening
    the software supply chain; prompt injection is an intrinsic LLM weakness; ANSSI/CERT-FR says tools like OpenClaw must not be deployed on workstations and use should be prohibited until the product is stabilised and proven; they must not be used in production, only in isolated test sandboxes without sensitive data; hardening levers: limit tools/actions to the strict minimum, mandatory human validation for any system command or side-effect action, sandbox execution, allowlists for the channels and interlocutors permitted to trigger the agent, activation only on explicit @mention; the advisory also applies to mobile.'
  defects:
  - code: F4
    where: body ¶1
    claim: 'warning that deploying agentic AI orchestration platforms (LLM-driven workflows with tool-calling, MCP server integration, or autonomous execution capabilities) introduces novel attack vectors. The advisory identifies three risk classes: ... **MCP server supply-chain compromise** (a malicious or compromised Model Context Protocol server can issue instructions to all connected agents)'
    ground_truth: 'The advisory never mentions MCP / Model Context Protocol (grep of the full text: no match). It addresses autonomous personal-assistant products (OpenClaw, Claude Cowork) on user workstations, with a plugin/extension supply-chain risk (''des greffons (plugins) peuvent être chargés dynamiquement ... exécutés comme du code de confiance''). It is not an ''orchestration platform / MCP'' advisory.'
    ground_truth_url: https://www.cert.ssi.gouv.fr/actualite/CERTFR-2026-ACT-016/
    fix: Replace the MCP risk class with the advisory's plugin-loaded-as-trusted-code supply-chain risk; scope the advisory to autonomous desktop assistants.
  - code: F4
    where: body ¶1
    claim: CERT-FR recommends input/output guardrails, strict allowlisting of permitted tool calls, human-in-the-loop gates for high-impact actions, and treating all AI agent outputs as untrusted until validated.
    ground_truth: Advisory says prompt-level defensive wording can be bypassed by injection; recommends limiting actions/tools to the strict necessary, MANDATORY human validation for any system command or side-effect action, sandbox isolation, and allowlists for the communication channels / interlocutors (DM/groups) that may trigger the agent, activation only on explicit @agent mention. 'Input/output guardrails', 'allowlisting of permitted tool calls' and 'treat all outputs as untrusted' are not stated (only the human-validation point matches).
    ground_truth_url: https://www.cert.ssi.gouv.fr/actualite/CERTFR-2026-ACT-016/
    fix: 'Restate the recommendations as the advisory gives them: restrict tools/actions, mandatory human validation for system/side-effect commands, sandbox, channel/interlocutor allowlists, mention-only activation.'
  - code: F4
    where: body ¶1 (last sentence)
    claim: Relevant for organisations deploying Claude Agents, Microsoft Copilot Studio, AutoGen, or similar agentic frameworks for workflow automation.
    ground_truth: The advisory names OpenClaw and Claude Cowork (and 'other open-source solutions'); Microsoft Copilot Studio and AutoGen do not appear. Its scope is workstation assistants, not workflow frameworks.
    ground_truth_url: https://www.cert.ssi.gouv.fr/actualite/CERTFR-2026-ACT-016/
    fix: Name OpenClaw and Claude Cowork as the advisory does, or drop the product list.
  - code: F8
    where: body (omission)
    claim: (entry omits the advisory's primary directive)
    ground_truth: '''En l''état, les assistants personnels autonomes tels qu''OpenClaw ne doivent pas être déployés sur des postes de travail et leur usage doit être proscrit, tant que le produit n''est pas stabilisé'' and they ''ne doivent en aucun cas être déployés en environnements de production''; use restricted to isolated sandboxes with no sensitive data. This is the decision a defender needs and is missing.'
    ground_truth_url: https://www.cert.ssi.gouv.fr/actualite/CERTFR-2026-ACT-016/
    fix: Lead with the prohibit-on-workstations / sandbox-only position and the Shadow-IT control (block unvalidated installs).
  - code: F11
    where: body / metadata
    claim: 'entities: campaign:certfr-2026-act-016, report:certfr-2026-act-016; event_date: null'
    ground_truth: An advisory is not a campaign. The advisory is dated 2026-04-13 (first and last version), i.e. ~25 days before the entry; entry gives no date, so a reader cannot see it is not new.
    ground_truth_url: https://www.cert.ssi.gouv.fr/actualite/CERTFR-2026-ACT-016/
    fix: 'Drop the campaign: entity, set event_date 2026-04-13, state the advisory date in the body.'
  - code: F17
    where: classification
    claim: (no classification block)
    ground_truth: Required on every entry; absent. Single national-CERT primary read directly.
    ground_truth_url: https://www.cert.ssi.gouv.fr/actualite/CERTFR-2026-ACT-016/
    fix: 'classification: reliability A (CERT-FR is an A-tier national CERT, owns the advisory), credibility 2.'
  - code: F16
    where: priority
    claim: 'priority: notable'
    ground_truth: A 3-week-old general hardening advisory with no vulnerability, exploitation or actor; no concrete decision beyond 'do not deploy' guidance. Closer to routine; borderline relevance gate.
    ground_truth_url: https://www.cert.ssi.gouv.fr/actualite/CERTFR-2026-ACT-016/
    fix: (low confidence) routine, or keep notable only if rewritten around the do-not-deploy-on-workstations decision.
- entry: entries/2026-05-08/cve-2026-0300-pan-os-captive-portal-unauthenticated-root-rce.md
  verdict: factual-error
  duplicate_of: entries/2026-05-12/palo-alto-pan-os-cve-2026-0300-first-wave-fixed-builds-now-s.md
  unique_material:
  - fact: Threat ID 510019 needs PAN-OS 11.1 or later (decoder capability) and Applications and Threats content 9097-10022; the survivor mentions 510019 but not the version prerequisite or content version.
    source: https://security.paloaltonetworks.com/CVE-2026-0300
  - fact: CISA KEV federal due date 2026-05-09 (KEV dateAdded 2026-05-06); survivor already states the 2026-05-09 deadline, so no unique value beyond the add date.
    source: 'https://www.cisa.gov/known-exploited-vulnerabilities-catalog (cisa-kev recipe: dateAdded 2026-05-06, dueDate 2026-05-09)'
  ground_truth: 'Same finding as the later CVE-2026-0300 entries (2026-05-09, 2026-05-12, 2026-05-14, 2026-05-18); it carries nothing the 2026-05-12 survivor lacks except the Threat ID 510019 PAN-OS 11.1+ prerequisite. The ''no patch until 2026-05-13'' framing is a simplification (the PSIRT lists per-build ETAs of 05/13 and 05/28), and the mitigation is mis-scoped to GlobalProtect. Source-supported facts (https://security.paloaltonetworks.com/CVE-2026-0300; https://unit42.paloaltonetworks.com/captive-portal-zero-day/): buffer overflow (CWE-787) in the User-ID Authentication Portal (Captive Portal) on PA-Series and VM-Series; unauthenticated root RCE; CVSS-B/BT 9.3 (CVSS 4.0), 8.7 when portal restricted to trusted internal IPs; Prisma Access, Cloud NGFW and Panorama unaffected; exposure requires Authentication Portal enabled AND an interface management profile with response pages on an L3 interface where untrusted traffic ingresses; limited exploitation in the wild since 2026-04-09 attributed
    by Unit 42 to CL-STA-1132 (likely state-sponsored); CISA KEV 2026-05-06, due 2026-05-09; mitigations: restrict portal to trusted zones and disable response pages on untrusted L3 interfaces, or disable the portal if unused; Threat ID 510019 (content 9097-10022, PAN-OS 11.1+).'
  defects:
  - code: F4
    where: body ¶1
    claim: disable the Captive Portal / Authentication Portal feature on internet-facing GlobalProtect gateway interfaces, or restrict access exclusively to trusted internal management IP ranges.
    ground_truth: 'PSIRT mitigation: ''Restrict User-ID Authentication Portal access to only trusted zones and in addition, disable Response Pages in the Interface Management Profile attached to every L3 interface in any zone where untrusted/internet traffic can ingress'' or ''Disable User-ID Authentication Portal if not required''. GlobalProtect is not mentioned; the portal is a separate service, and the condition is response pages on untrusted-facing L3 interfaces, not ''management IP ranges''.'
    ground_truth_url: https://security.paloaltonetworks.com/CVE-2026-0300
    fix: State the PSIRT mitigation verbatim in substance (trusted zones + response pages disabled on untrusted L3 interfaces, or disable the portal); drop GlobalProtect.
  - code: F4
    where: title / headline / summary / body
    claim: CISA KEV deadline is today (2026-05-09); no patch until 2026-05-13
    ground_truth: 'Entry is dated 2026-05-08 yet says the deadline is ''today (2026-05-09)''. Rapid7''s table of the PSIRT shows fix ETAs per build: first wave 05/13 (e.g. 12.1.4-h5, 11.2.7-h13, 11.2.10-h6, 11.1.4-h33, 11.1.6-h32, 11.1.10-h25, 11.1.13-h5, 10.2.10-h36, 10.2.18-h6) and second wave 05/28 (12.1.7, 11.2.4-h17, 11.2.12, 11.1.7-h6, 11.1.15, 10.2.7-h34, 10.2.13-h21, 10.2.16-h7). ''No patch until 05-13'' is true only for the first wave. Also a KEV due date is used as the reason to act (style rule).'
    ground_truth_url: https://www.rapid7.com/blog/post/etr-critical-buffer-overflow-in-palo-alto-networks-pan-os-user-id-authentication-portal-cve-2026-0300
    fix: Headline the exploited unauthenticated root RCE and the mitigation; state 'first fixed builds 2026-05-13, remaining builds 2026-05-28' and drop the KEV-deadline framing.
  - code: F8
    where: cves[] / body
    claim: 'cves: [] ; sourcing_note: ''migration: CVE fields incomplete in v2 footer (CVE-2026-0300)'''
    ground_truth: Per-CVE authority gives CVE-2026-0300, CVSS 9.3 (4.0), CWE-787, exploited, KEV 2026-05-06. cves[] is empty, no CVSS, no exploitation narrative (body never says it is exploited in the wild, since 2026-04-09, nor names CL-STA-1132) although tags say actively-exploited / cisa-kev; no techniques[].
    ground_truth_url: https://security.paloaltonetworks.com/CVE-2026-0300
    fix: 'Populate cves[CVE-2026-0300] (cvss 9.3, status exploited/cisa-kev/mitigation-only), techniques (T1190 etc.), and state the exploitation; better: fold into the 2026-05-12 survivor.'
  - code: F5
    where: body ¶1
    claim: (whole body has no inline citation)
    ground_truth: KEV deadline, patch ETA, 'permanent patch' and Threat ID claims carry no inline link; only the PSIRT is in sources[] and KEV is uncited.
    ground_truth_url: https://security.paloaltonetworks.com/CVE-2026-0300
    fix: Inline-cite PSIRT for fixes/mitigation/Threat ID and the KEV catalogue entry for the due date.
  - code: F11
    where: body ¶1
    claim: (First covered and deep-dived 2026-05-07.)
    ground_truth: Pipeline-internal narration; no entry for 2026-05-07 exists in the store ('update target unresolved').
    ground_truth_url: https://security.paloaltonetworks.com/CVE-2026-0300
    fix: Delete; also 'P0 action today before business opens' is non-factual urgency text.
  - code: F17
    where: classification
    claim: (no classification block)
    ground_truth: Required for every entry including kind vulnerability (no triage scheme configured); absent.
    ground_truth_url: https://security.paloaltonetworks.com/CVE-2026-0300
    fix: 'classification: reliability A (vendor PSIRT), credibility 2 (vendor-confirmed exploitation, corroborated by Unit 42/KEV).'
- entry: entries/2026-05-08/glpi-certfr-2026-avi-0551-seven-cves-including-ssrf-and-xss.md
  verdict: factual-error
  duplicate_of: null
  ground_truth: 'The CVE ids, the fix versions (10.0.25 / 11.0.7) and the ''no CVSS in the CERT-FR advisory'' statement are right, but five of the seven per-CVE vulnerability classes in the body are wrong against GLPI''s own release notes and GitHub advisories, the advisory date is mis-attributed, and the entry is a routine patch-cycle item. Source-supported facts for a rewrite (GLPI releases https://github.com/glpi-project/glpi/releases/tag/11.0.7 and https://github.com/glpi-project/glpi/releases/tag/10.0.25, both 2026-04-29; GHSA via https://api.github.com/repos/glpi-project/glpi/security-advisories): CVE-2026-32312 unauthorized export of form structure (Medium, CWE-862, 11.x only); CVE-2026-42320 arbitrary files access (Medium, <10.0.25 / <11.0.7); CVE-2026-42317 arbitrary files deletion by a technician (High, fixed 10.0.25/11.0.7); CVE-2026-42318 arbitrary item deletion via planning (High, CWE-862, fixed 10.0.25/11.0.7); CVE-2026-42321 stored XSS in asset locks (High, CWE-79, 10.x only,
    fixed 10.0.25); CVE-2026-5385 stored XSS in knowledge base (High, CWE-79); CVE-2026-40108 stored XSS in ITIL Costs (High, CWE-79, 11.x only, fixed 11.0.7). CERT-FR AVI-0551 (https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-0551/) was published 2026-05-07 and cites the vendor bulletin of 2026-04-29; affected: GLPI < 10.0.25 and < 11.0.7.'
  defects:
  - code: F4
    where: body ¶1
    claim: Vulnerability types include SSRF (CVE-2026-32312), stored and reflected XSS (CVE-2026-42317, CVE-2026-42318, CVE-2026-42320, CVE-2026-42321), security policy bypass (CVE-2026-5385), and data integrity compromise (CVE-2026-40108).
    ground_truth: 'GLPI 11.0.7 / 10.0.25 release notes and GHSA: CVE-2026-32312 = ''Unauthorized export of form structure'' (Medium, CWE-862), not SSRF; CVE-2026-42317 = ''Arbitrary files deletion by technician'' (High); CVE-2026-42318 = ''Arbitrary item deletion via planning'' (High, CWE-862); CVE-2026-42320 = ''Arbitrary files access'' (Medium); only CVE-2026-42321 = ''Stored XSS in asset locks'' (High, CWE-79) is XSS of that group; CVE-2026-5385 = ''Stored XSS in knowledge base'' (High), not a policy bypass; CVE-2026-40108 = ''Stored XSS in ITIL Costs'' (High), not data integrity. No reflected XSS is in this set. (The SSRF in the 11.0.7 notes is ''Unauthorized Webhook CRA Validation SSRF'', Low, with no CVE id listed.) The classes were mapped from CERT-FR''s generic risk list onto CVE ids without a source for the mapping.'
    ground_truth_url: https://github.com/glpi-project/glpi/releases/tag/11.0.7
    fix: 'Rewrite per-CVE: 32312 missing authorization/form-structure export (Medium); 42320 arbitrary file access (Medium); 42317 arbitrary file deletion by technician (High); 42318 arbitrary item deletion via planning (High); 42321, 5385, 40108 stored XSS (High); fix 10.0.25 / 11.0.7.'
  - code: F4
    where: title / summary / body ¶1
    claim: GLPI CERTFR-2026-AVI-0551 — Seven CVEs ... (advisory 2026-04-29) ; France's CERT-FR published CERTFR-2026-AVI-0551 (April 29, 2026)
    ground_truth: CERT-FR AVI-0551 is dated 'Paris, le 07 mai 2026' (first and last version 07 mai 2026); 29 avril 2026 is the date of the GLPI vendor security bulletin/releases it references.
    ground_truth_url: https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-0551/
    fix: '''GLPI released 10.0.25 and 11.0.7 on 2026-04-29; CERT-FR relayed them in CERTFR-2026-AVI-0551 on 2026-05-07.'''
  - code: F4
    where: cves[] (all seven)
    claim: 'vector: user-interaction, auth: post-auth, type: null, cvss: n/a on every record'
    ground_truth: 'Uniform template values, not per-CVE facts: the arbitrary file/item deletion and file-access flaws (42317, 42318, 42320) and the form-structure export (32312) are missing-authorization bugs, not user-interaction vectors; only the three stored-XSS CVEs (42321, 5385, 40108) need a victim to view content. Branch scope differs per CVE: CVE-2026-40108 is 11.x only (GHSA >= 11.0.0, patched 11.0.7; absent from the 10.0.25 notes), CVE-2026-42321 is 10.x only (>= 10.0.4 < 11.0.0, patched 10.0.25), CVE-2026-32312 is 11.x only (GHSA >= 11.0.0); CVE-2026-5385 is listed in both the 10.0.25 and 11.0.7 notes (GHSA range >= 11.0.0). Vendor severity (Medium/High) is published and omitted.'
    ground_truth_url: https://api.github.com/repos/glpi-project/glpi/security-advisories?per_page=100
    fix: (low confidence on vector) Set type per CVE (xss / authz-bypass / file-deletion), vector user-interaction only for XSS, record affected branches and vendor severity.
  - code: F5
    where: body ¶1
    claim: the open-source IT Service Management platform widely deployed in European public-sector organisations and healthcare networks
    ground_truth: Neither CERT-FR nor the GLPI notes state deployment breadth or sector; no source cited for it.
    ground_truth_url: https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-0551/
    fix: Delete or source it.
  - code: F6
    where: sources[]
    claim: 'url: https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-0551/ (only source, role primary)'
    ground_truth: 'Only a national-CERT relay is cited; the vendor primary exists: GLPI release pages 11.0.7 and 10.0.25 (2026-04-29) list each CVE with title and severity, and are the per-CVE authority.'
    ground_truth_url: https://github.com/glpi-project/glpi/releases/tag/11.0.7
    fix: Make the GLPI release notes the primary source and CERT-FR corroborating.
  - code: F16
    where: priority
    claim: 'priority: notable; ''advised to schedule patching within the standard change window'''
    ground_truth: No exploitation, no pre-auth RCE, no exposure-driven urgency (the body itself says standard change window); a routine patch-cycle item for the vulnerability inclusion gate.
    ground_truth_url: https://github.com/glpi-project/glpi/releases/tag/11.0.7
    fix: routine, or drop.
  - code: F17
    where: classification
    claim: (no classification block)
    ground_truth: Required on every entry; absent. techniques[] also absent on a vulnerability entry.
    ground_truth_url: https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-0551/
    fix: 'classification: reliability A once the GLPI primary is cited (B if left on CERT-FR relay only), credibility 2; add techniques (e.g. T1190 / T1059.007 as supported).'
- entry: entries/2026-05-08/instructure-canvas-extortion-330-institutions-across-six-cou.md
  verdict: factual-error
  duplicate_of: null
  ground_truth: 'Headline numbers and the whole 2026-05-09 update contain claims no fetched source supports (330 institutions / six countries / 16 million records; SURF-confirmed 44 Dutch institutions; ''WorldLeaks'', EUR 3.2M, 3 GB sample, LTI service-account vector; German DPA inquiry), the cited primary (SURF) is a 404, and the main analysis is superseded by the later sections. The 2026-05-10, 2026-05-12 and 2026-05-13 sections are largely supported with the fixes listed. Source-supported facts for a rewrite: Instructure disclosed an incident on 2026-05-01 (status page), detected unauthorised activity 2026-04-29, exploited via a vulnerability in Free-for-Teacher; stolen: names, emails, student IDs, messages; no evidence of passwords/DOB/gov IDs/financial data (BleepingComputer 2026-05-03 https://www.bleepingcomputer.com/news/security/instructure-confirms-data-breach-shinyhunters-claims-attack/); ShinyHunters claims ~9,000 schools / 275M individuals / 3.65 TB (BleepingComputer; The Register
    https://www.theregister.com/security/2026/05/12/double-canvas-intrusion-confirmed-as-shinyhunters-resets-leak-deadline/5238361); second intrusion 2026-05-07: ~330 school login portals defaced with an extortion note via the same Free-for-Teacher flaw, Canvas taken into maintenance mode (Register; Infosecurity https://www.infosecurity-magazine.com/news/shinyhunters-escalates-canvas/); seven Dutch universities named by UNL (VU, UvA, Erasmus, Tilburg, TU/e, Maastricht, Twente) disconnected Canvas and notified the Dutch AP (Techzine https://www.techzine.eu/news/security/141149/dutch-university-disconnects-canvas-systems-after-instructure-hack/; UNL https://www.universiteitenvannederland.nl/actueel/nieuws/update-19-mei-stand-van-zaken-hack-leverancier-onderwijsplatform-canvas); deadline 2026-05-12; Instructure announced an agreement with the actor on Monday 2026-05-11 with ''shred logs'' and said no customers will be extorted (Inside Higher Ed https://www.insidehighered.com/news/tech-innovation/administrative-tech/2026/05/11/instructure-pays-ransom-canvas-hackers;
    The Record https://therecord.media/instructure-pays-ransom-canvas-incident-congress-investigation); House Homeland Security Committee chairman Garbarino letter late 2026-05-11 requesting a briefing before 2026-05-21 (The Record; Register https://www.theregister.com/cyber-crime/2026/05/12/congress-investigates-canvas-breach-after-instructure-cuts-deal-with-shinyhunters/5238927); CrowdStrike retained.'
  defects:
  - code: F1
    where: sources[0].url
    claim: 'https://www.surf.nl/actualiteiten/2026/canvas-security-update (role: primary, ''SURF Security Advisory — Canvas Extortion Update'')'
    ground_truth: Returns 'Pagina niet gevonden | SURF.nl' (HTTP 404). The SURF advisory the entry attributes the '44 Dutch institutions' to does not exist at this URL.
    ground_truth_url: https://www.surf.nl/actualiteiten/2026/canvas-security-update
    fix: Remove the source; cite UNL / VU / UvA pages instead.
  - code: F4
    where: title / headline / body ¶1
    claim: 'Instructure/Canvas extortion: 330 institutions across six countries; ... The threat actor now claims access affecting **330 institutions** across six countries, threatening to publish 16 million student and staff records.'
    ground_truth: ShinyHunters' claims are 'nearly 9,000 schools worldwide' / '275 million individuals' (BleepingComputer 2026-05-03), 8,800 schools / 3.65 TB (Register). 'About 330' is the number of login portals defaced on 2026-05-07 (Register, Infosecurity), not institutions with stolen data. 'Six countries' and '16 million records' appear in no fetched source.
    ground_truth_url: https://www.bleepingcomputer.com/news/security/instructure-confirms-data-breach-shinyhunters-claims-attack/
    fix: '''ShinyHunters claims ~275M individuals at ~8,800-9,000 institutions; a second intrusion on 2026-05-07 defaced ~330 school login portals.'''
  - code: F4
    where: title / body ¶1 / update 2026-05-09
    claim: 44 Dutch institutions confirmed ; **SURF** (the Dutch National Research and Education Network) has confirmed **44 Dutch institutions** among the victims ; **Universiteiten van Nederland (UNL)** confirmed that 44 member institutions are potentially affected, representing all Dutch research universities and applied science universities
    ground_truth: The 44 figure is a BNR report ('may have been affected'), which TU/e's Cursor says 'appears inaccurate, as some listed institutions do not use Canvas'. UNL named seven universities (VU, UvA, Erasmus, Tilburg, TU/e, Maastricht, Twente) and UNL's 2026-05-19 update refers to 'de zeven universiteiten'. No SURF or UNL confirmation of 44 exists in any fetched source.
    ground_truth_url: https://www.cursor.tue.nl/en/news/2026/mei/week-1/student-data-of-millions-stolen-in-canvas-hack
    fix: '''Seven Dutch universities (named by UNL) disconnected Canvas; a press report of 44 Dutch institutions was disputed.'''
  - code: F4
    where: body ¶1
    claim: European DPAs in the Netherlands and Germany have opened preliminary inquiries into notification timing.
    ground_truth: 'Sources show only that Dutch universities filed (preliminary) breach notifications with the Dutch Autoriteit Persoonsgegevens (VU: Techzine; UvA/UNL: ''a preliminary notification has already been submitted to the AP''). No DPA inquiry into notification timing and nothing about a German DPA appears in any source.'
    ground_truth_url: https://www.uva.nl/shared-content/uva/en/news/news/2026/05/update-on-the-data-breach-at-the-canvas-provider.html
    fix: '''Dutch universities filed preliminary notifications with the Dutch AP.'' Delete the German claim.'
  - code: F4
    where: update 2026-05-09 ¶2
    claim: The threat actor (WorldLeaks) set a **2026-05-12 payment deadline**; the extortion amount was stated as €3.2 million. WorldLeaks previously published a 3 GB sample dataset on 2026-05-07 containing course-IDs, student email addresses, assignment metadata, and grade records across four UK institutions. No passwords, payment data, or national identification numbers were present in the sample.
    ground_truth: Every fetched source names ShinyHunters (also this entry's own entities and later sections); none mentions WorldLeaks, a EUR 3.2 million demand, a 3 GB sample or a four-UK-institution sample. The only published deadline is 2026-05-12 set by ShinyHunters; the Instructure payment amount was never disclosed.
    ground_truth_url: https://www.insidehighered.com/news/tech-innovation/administrative-tech/2026/05/11/instructure-pays-ransom-canvas-hackers
    fix: Delete the paragraph; actor is ShinyHunters.
  - code: F4
    where: update 2026-05-09 ¶2
    claim: Instructure issued a public statement on 2026-05-08 confirming the breach vector was a compromised integration service account for a third-party LTI tool provider (not Canvas core infrastructure), and that the issue was isolated. Instructure stated it notified affected institutions on 2026-05-01
    ground_truth: 'Instructure''s disclosed vector is a vulnerability in its Free-for-Teacher offering (Register: ''criminals exploited a security vulnerability in its Free-for-Teacher learning system''; Infosecurity: ''exploiting a vulnerability in the Free-For-Teacher version of Canvas''); the Register also says core learning data was not compromised. No LTI service-account vector is stated; it also contradicts the entry''s own 2026-05-12 section. Instructure detected activity on 2026-04-29 and disclosed on 2026-05-01 on its status page; ''notified affected institutions on 2026-05-01'' is unsourced.'
    ground_truth_url: https://www.theregister.com/security/2026/05/12/double-canvas-intrusion-confirmed-as-shinyhunters-resets-leak-deadline/5238361
    fix: Replace with the Free-for-Teacher vulnerability root cause; delete the LTI service-account claim.
  - code: F4
    where: update 2026-05-09 ¶1
    claim: '**University of Oxford** confirmed it is working with Instructure and the NCSC-UK; **University of Cambridge** issued a statement ... ; **University of Liverpool** confirmed it had notified the Information Commissioner''s Office under Article 33 GDPR and is conducting a forensic investigation.'
    ground_truth: (low confidence) Oxford's own statement (Cherwell 2026-05-08) says it suspended Canvas access and is 'working closely with the supplier'; no NCSC-UK mention found. Cambridge and Liverpool statements/ICO notification were not found in any fetched source and the entry cites none.
    ground_truth_url: https://www.cherwell.org/2026/05/08/canvas-suspended-following-cyberattack/
    fix: Source each statement or delete; keep Oxford's suspension of Canvas access.
  - code: F4
    where: update 2026-05-10 ¶1
    claim: Instructure confirmed the second breach, rotated application keys, increased monitoring, and required API-client re-authorisation across its customer base. ; ShinyHunters posted a second intrusion notice around 2026-05-08
    ground_truth: Patches, monitoring, application-key rotation and API re-authorisation were Instructure's response to the FIRST incident (BleepingComputer 2026-05-03). The defacement message appeared on Thursday evening 2026-05-07 (Techzine, DutchNews), not 2026-05-08.
    ground_truth_url: https://www.bleepingcomputer.com/news/security/instructure-confirms-data-breach-shinyhunters-claims-attack/
    fix: Attribute key rotation/re-authorisation to the first incident response; date the second notice 2026-05-07.
  - code: F4
    where: update 2026-05-12 ¶2 (b)
    claim: ShinyHunters has now **reset a per-institution payment deadline to end-of-day 2026-05-12** (today), positioning the central settlement as covering only the bulk dataset while leaving individual institutions exposed to targeted publication
    ground_truth: The Register reports the final end-of-day 05-12 deadline for individual institutions but no 'bulk-only' positioning; Instructure's statement, relayed by Inside Higher Ed and The Record, is that the agreement 'covers all impacted Instructure customers' and 'no Instructure customers will be extorted'. The entry's reading is unsourced and inverts the vendor statement.
    ground_truth_url: https://therecord.media/instructure-pays-ransom-canvas-incident-congress-investigation
    fix: Report the per-institution deadline and Instructure's statement that the agreement covers all customers; drop the 'exposed to targeted publication' inference or mark it as the entry's analysis.
  - code: F5
    where: update 2026-05-12 ¶3
    claim: by ransomware-actor practice, the artefact provided is typically a hash list or a video, not a forensically meaningful proof of deletion
    ground_truth: No cited source says what 'shred logs' consist of; Inside Higher Ed quotes an expert only that there is 'no reliable way to verify' deletion claims.
    ground_truth_url: https://www.insidehighered.com/news/tech-innovation/administrative-tech/2026/05/11/instructure-pays-ransom-canvas-hackers
    fix: Delete the hash-list/video assertion or attribute it to a source.
  - code: F4
    where: update 2026-05-13 ¶2
    claim: On 2026-05-12 — before the deadline expired — Instructure confirmed it had 'reached an agreement with the unauthorized actor'
    ground_truth: 'Instructure''s update was published Monday 2026-05-11 (Inside Higher Ed: ''update published ... Monday night''; The Record: ''Late on Monday evening''); the entry''s own 2026-05-12 section dates it 2026-05-11, so the sections contradict each other.'
    ground_truth_url: https://www.insidehighered.com/news/tech-innovation/administrative-tech/2026/05/11/instructure-pays-ransom-canvas-hackers
