- entry: entries/2026-05-09/cve-2026-42208-litellm-proxy-pre-authentication-sql-injectio.md
  verdict: factual-error
  duplicate_of: null
  ground_truth: 'Core facts verified: pre-auth SQL injection in LiteLLM proxy key verification, 1.81.16-1.83.6 affected, fixed in 1.83.7, GHSA GHSA-r75f-5x8p-qvmc CVSS 4.0 9.3 (CWE-89), CISA KEV added 2026-05-08 due 2026-05-11, exploitation observed ~36 h after advisory. Defects are source-adjacency and dating errors, a self-quoted evidence record, a mislabelled vulnerability type, and missing exposure/detection detail. Supported facts: Bishop Fox post dated 2026-05-06 https://bishopfox.com/blog/cve-2026-42208-pre-authentication-sql-injection-in-litellm-proxy (versions 1.81.16-1.83.6, time-based blind via pg_sleep through two paths, workaround disable_error_logs covers only the error-callback path, patch 1.83.7); LiteLLM advisory 2026-04-29 https://docs.litellm.ai/blog/cve-2026-42208-litellm-proxy-sql-injection (recommends v1.83.10-stable; Postgres query-history review helper); Sysdig 2026-04-27 https://www.sysdig.com/blog/cve-2026-42208-targeted-sql-injection-against-litellms-authentication-path-discovered-36-hours-following-vulnerability-disclosure
    (first exploitation 36 h 7 min after advisory, UNION queries against LiteLLM_VerificationToken, litellm_credentials and litellm_config, no follow-through observed); GHSA via https://api.github.com/repos/BerriAI/litellm/security-advisories/GHSA-r75f-5x8p-qvmc (published 2026-04-20, CVSS v4 9.3).'
  defects:
  - code: F3
    where: sources[0].publisher / event_date
    claim: 'Bishop Fox — CVE-2026-42208 technical analysis, 2026-04-30 ; event_date: 2026-04-30'
    ground_truth: The Bishop Fox post is dated 2026-05-06 (page metadata). 2026-04-30 matches no cited source (LiteLLM blog 2026-04-29; GHSA published 2026-04-20; Sysdig 2026-04-27).
    ground_truth_url: https://bishopfox.com/blog/cve-2026-42208-pre-authentication-sql-injection-in-litellm-proxy
    fix: Correct to 2026-05-06; event_date should follow the vendor GHSA (2026-04-20) or the LiteLLM blog (2026-04-29).
  - code: F3
    where: body ¶1
    claim: targeting `LiteLLM_VerificationToken`, `litellm_credentials`, and `litellm_config` tables — which collectively hold every virtual API key, upstream provider credential, team binding, and rate-limit configuration in the proxy ([Bishop Fox, 2026-04-30] · [LiteLLM vendor advisory, 2026-04-29])
    ground_truth: 'Neither cited page names litellm_credentials or litellm_config: Bishop Fox names the LiteLLM_VerificationToken lookup (virtual keys are stored as SHA-256 hashes) and the joined team/budget/organization tables; the LiteLLM advisory names no tables. The three tables are the ones Sysdig observed attackers querying, which the entry does not cite.'
    ground_truth_url: https://www.sysdig.com/blog/cve-2026-42208-targeted-sql-injection-against-litellms-authentication-path-discovered-36-hours-following-vulnerability-disclosure
    fix: Cite Sysdig for the three observed target tables and say virtual keys are stored hashed.
  - code: F14
    where: body ¶1
    claim: In-the-wild exploitation began within approximately 26–36 hours of the GitHub Security Advisory (GHSA-r75f-5x8p-qvmc) publication.
    ground_truth: 'Sources give 36 h: Sysdig ''first exploitation attempt 36 hours and seven minutes after the advisory was published to the global database''; Bishop Fox ''roughly 36 hours after the GitHub advisory was published''. No source supports 26 h (the same wrong ''~26 h'' is copied into the table appended to the xrdp entry).'
    ground_truth_url: https://www.sysdig.com/blog/cve-2026-42208-targeted-sql-injection-against-litellms-authentication-path-discovered-36-hours-following-vulnerability-disclosure
    fix: '''about 36 hours''; cite Sysdig; note no follow-through (key reuse) was observed.'
  - code: F4
    where: cves[CVE-2026-42208].type / tags
    claim: 'type: auth-bypass ; tags: auth-bypass'
    ground_truth: The flaw is SQL injection (CWE-89) in the API-key lookup query; GHSA title 'SQL injection in Proxy API key verification'. The taxonomy has an `sqli` CVE type.
    ground_truth_url: https://api.github.com/repos/BerriAI/litellm/security-advisories/GHSA-r75f-5x8p-qvmc
    fix: 'type: sqli; drop auth-bypass tag.'
  - code: F4
    where: evidence[0]
    claim: 'quote: "CVE-2026-42208 (CWE-89, CVSS 9.3) is a pre-authentication f-string SQL injection in the PrismaClient.get_data() method of LiteLLM Proxy..." publisher: ctipilot v2 brief (migrated)'
    ground_truth: The 'evidence' is the entry's own opening sentence attributed to the pipeline, not a source. It is not a substring of the Bishop Fox or LiteLLM pages (Bishop Fox gives no CVSS 9.3; GHSA gives CVSS v4 9.3 and CWE-89 in structured fields).
    ground_truth_url: https://bishopfox.com/blog/cve-2026-42208-pre-authentication-sql-injection-in-litellm-proxy
    fix: Replace with a verbatim sentence from the GHSA or Bishop Fox post, or delete evidence[].
  - code: F5
    where: body ¶1
    claim: CISA added the CVE to KEV on 2026-05-08 with a federal remediation deadline of **2026-05-11**. Fixed in LiteLLM v1.83.7+. Patching does not remediate credential compromise ...
    ground_truth: KEV membership is true (dateAdded 2026-05-08, dueDate 2026-05-11, per cisa-kev) but no KEV source is cited (the hard-blocked catalogue page is correctly absent); the rotate-credentials advice follows Sysdig ('treat any internet-facing instance during the exposure window as compromised') which is uncited. KEV deadline is also not a reason to act.
    ground_truth_url: https://www.cisa.gov/known-exploited-vulnerabilities-catalog
    fix: Cite Sysdig for exploitation and rotation; mention KEV membership without the deadline framing.
  - code: F8
    where: labelled lines (Exposure / Detection)
    claim: (no Exposure or Detection line; affected range and workaround omitted)
    ground_truth: 'Supported content missing: affected 1.81.16 through 1.83.6, PostgreSQL backend (default) with `disable_error_logs` at default false, LiteLLM-recommended 1.83.10-stable; workaround `general_settings.disable_error_logs: true` (covers only the failure-callback path, not -O/assert-stripped builds); detection: 401 responses with multi-second latency on non-`sk-` bearers, ''expected to start with sk-'' assertion stack traces in proxy logs (Bishop Fox) and the LiteLLM Postgres query-history review helper; Sysdig''s observed UNION enumeration pattern.'
    ground_truth_url: https://bishopfox.com/blog/cve-2026-42208-pre-authentication-sql-injection-in-litellm-proxy
    fix: Add Exposure/Detection lines from these facts.
  - code: F6
    where: sources[0]
    claim: 'role: primary = Bishop Fox blog'
    ground_truth: Per-CVE authority is the LiteLLM GitHub Security Advisory GHSA-r75f-5x8p-qvmc (published 2026-04-20, CVSS v4 9.3, CWE-89, patched >=1.83.7); a pentest-vendor write-up is not the primary.
    ground_truth_url: https://github.com/BerriAI/litellm/security/advisories/GHSA-r75f-5x8p-qvmc
    fix: Cite the GHSA as primary, Bishop Fox/Sysdig/LiteLLM blog as corroborating.
  - code: F17
    where: classification / techniques
    claim: (no classification block; techniques[] absent)
    ground_truth: Required; absent.
    ground_truth_url: https://bishopfox.com/blog/cve-2026-42208-pre-authentication-sql-injection-in-litellm-proxy
    fix: 'classification: reliability A (vendor GHSA + KEV), credibility 1/2; techniques [T1190, T1552].'
- entry: entries/2026-05-09/cve-2026-43284-cve-2026-43500-linux-dirty-frag-deterministic.md
  verdict: factual-error
  duplicate_of: null
  ground_truth: 'CVE ids, EPSS (0.9324 / 0.9286 on 2026-09-04, FIRST API), the Sept-2026 Fragnesia update, Red Hat''s applicability split and the technique ids are supported. The migrated main analysis and 2026-05-11 section contain several wrong or over-claimed items: exploitation ''confirmed'' for Dirty Frag (Microsoft hedges between Dirty Frag and Copy Fail), a wrong root-cause mechanism (''DMA remapping''), a detection suggestion that cannot fire, a wrong Red Hat sysctl, a wrong ''covering both CVEs'' Red Hat claim, and stale patch status in the summary. Supported facts: V4bel write-up/README (https://github.com/V4bel/dirtyfrag/blob/master/assets/write-up.md; README): splice()-planted page-cache page in an skb frag + in-place crypto STORE (esp_input skip_cow path; rxkad_verify_packet_1), ESP variant needs the ability to create a user namespace (CAP_NET_ADMIN via unshare(CLONE_NEWUSER)), RxRPC variant needs none but rxrpc.ko is absent from most distros (loaded by default on Ubuntu), mainline
    fixes f4c50a4034e6 (ESP, 2026-05-05) and aa54b1d27fe0 (RxRPC, 2026-05-10), embargo broken 2026-05-07 by an unrelated third party; Red Hat RHSB-2026-003 (https://access.redhat.com/security/vulnerabilities/RHSB-2026-003): three CVEs, CVE-2026-43500 does not affect Red Hat products, mitigation user.max_user_namespaces=0 or blocking esp4/esp6; Ubuntu fixes table (https://ubuntu.com/blog/dirty-frag-linux-vulnerability-fixes-available); CNA CVSS 3.1 8.8 for CVE-2026-43284, 7.8 for CVE-2026-43500.'
  defects:
  - code: F4
    where: title / headline / summary / body ¶1 / cves[].status
    claim: active exploitation confirmed ; Microsoft Defender telemetry confirms limited active campaigns in which threat actors escalated from SSH-compromised user accounts, modified LDAP authentication files, exfiltrated PHP session contents, and disrupted active sessions
    ground_truth: 'Microsoft: ''limited in-the-wild activity where privilege escalation involving su is observed, and which may be indicative of techniques associated with either Dirty Frag or Copy Fail''; the actor then ''modifies a GLPI LDAP authentication file'', and ''deleting multiple session files and then forcefully wiping additional ones — before reading remaining session data''. Exploitation of Dirty Frag specifically is not confirmed, and nothing is ''exfiltrated''. Aikido repeats the hedge. cves[].status ''exploited'' on both CVEs and the actively-exploited tag/title rest on this.'
    ground_truth_url: https://www.microsoft.com/en-us/security/blog/2026/05/08/active-attack-dirty-frag-linux-vulnerability-expands-post-compromise-risk/
    fix: '''Microsoft reports limited in-the-wild su-based privilege escalation that may be Dirty Frag or Copy Fail''; downgrade exploited status or qualify it.'
  - code: F4
    where: update 2026-05-11 ¶1 and evidence[1]
    claim: 'reporting "limited in-the-wild activity where privilege escalation involving `su` is observed." The attack chain observed: SSH initial access → shell spawn → execution of an ELF binary that triggers the LPE primitive in either CVE-2026-43284 (xfrm-ESP page-cache write) or CVE-2026-43500 (RxRPC page-cache write).'
    ground_truth: The quoted sentence is truncated before its hedge ('and which may be indicative of techniques associated with either "Dirty Frag" or "Copy Fail"'). Microsoft does not say which CVE the ELF triggers, nor that it is xfrm-ESP or RxRPC. evidence[1] is likewise an ellipsised self-quote ('ctipilot v2 brief (migrated)'), not a verbatim page substring; evidence[0] ('Researcher Hyunwoo Kim disclosed ... on 2026-05-07/08 after a third party inadvertently broke embargo') also appears on no fetched page in those words.
    ground_truth_url: https://www.microsoft.com/en-us/security/blog/2026/05/08/active-attack-dirty-frag-linux-vulnerability-expands-post-compromise-risk/
    fix: Quote the full sentence; replace evidence[] with verbatim substrings or delete.
  - code: F4
    where: body ¶1
    claim: both primitives allow userland code to write arbitrary values into read-only page-cache pages ... via memory aliasing caused by DMA remapping.
    ground_truth: 'Root cause per the discoverer: a splice()-planted page-cache page sits in the frag slot of an skb and the receiving code (esp_input skipping skb_cow_data; rxkad_verify_packet_1 doing in-place pcbc(fcrypt)) performs in-place crypto on it, so a 4-byte STORE lands in the page cache. DMA remapping is not part of it.'
    ground_truth_url: https://github.com/V4bel/dirtyfrag/blob/master/assets/write-up.md
    fix: Replace with the splice-to-skb-frag / in-place-crypto explanation.
  - code: F4
    where: body ¶1
    claim: Exploitation requires `CAP_NET_ADMIN` — available by default in Linux user namespaces on Ubuntu, Fedora, and most Arch-based distributions; restricted on RHEL 8/9 and some hardened configs.
    ground_truth: Only the xfrm-ESP variant needs the privilege to create a user namespace (CAP_NET_ADMIN via unshare(CLONE_NEWUSER)); Ubuntu 'sometimes blocks' that through AppArmor. The RxRPC variant needs no namespace but rxrpc.ko is absent from most distributions (not shipped in RHEL 10.1) and loaded by default on Ubuntu. Nothing says Arch/Fedora allow it or that RHEL 8/9 restrict it; Red Hat's own targeted mitigation is to set user.max_user_namespaces=0, i.e. RHEL permits unprivileged userns by default.
    ground_truth_url: https://github.com/V4bel/dirtyfrag/blob/master/README.md
    fix: Per-variant prerequisites as above; drop the distro-by-distro claims.
  - code: F4
    where: body ¶2
    claim: 'Affected distributions with confirmed exposure: Ubuntu 22.04/24.04/24.10, RHEL 8/9/10, Fedora, CentOS Stream, AlmaLinux, openSUSE Tumbleweed.'
    ground_truth: 'Discoverer''s tested list: Ubuntu 24.04.4, RHEL 10.1, openSUSE Tumbleweed, CentOS Stream 10, AlmaLinux 10, Fedora 44. Ubuntu''s own table covers 18.04, 20.04, 22.04, 24.04, 25.10 and 26.04 (24.10 is not a listed release); Red Hat lists RHEL 8/9/10 for CVE-2026-43284/46300 only.'
    ground_truth_url: https://ubuntu.com/blog/dirty-frag-linux-vulnerability-fixes-available
    fix: Cite the vendor tables; drop 24.10.
  - code: F4
    where: update 2026-05-11 ¶2 and ¶4
    claim: Red Hat published RHSB-2026-003 covering both CVEs on 2026-05-07 ..., with backported errata rolling out to RHEL 8/9/10 and OpenShift 4 ; Where IPsec is in use, Red Hat suggests `kernel.unprivileged_userns_clone=0` (sysctl) as a less disruptive mitigation
    ground_truth: RHSB-2026-003 covers three CVEs and states CVE-2026-43500 (rxrpc) 'does not affect Red Hat products and requires no mitigation'. Red Hat's targeted mitigation is `user.max_user_namespaces=0` (the unprivileged_userns_clone sysctl is a Debian/Ubuntu knob); the entry's own actions[] gives both correctly, so the section contradicts it.
    ground_truth_url: https://access.redhat.com/security/vulnerabilities/RHSB-2026-003
    fix: '''RHSB-2026-003 covers CVE-2026-43284 and CVE-2026-46300 for RHEL; CVE-2026-43500 does not affect Red Hat''; sysctl user.max_user_namespaces=0.'
  - code: F4
    where: labelled line Detection
    claim: unexpected writes to `/etc/passwd` or `/etc/shadow` detected via `auditctl -w /etc/passwd -p w`.
    ground_truth: The primitive modifies the file's page cache in RAM; 'the file on disk never changes' (Aikido), 'every subsequent read sees the modified copy' (write-up), so an auditd write watch on the file will not fire. The entry's own 2026-05-11 section says the primitive bypasses auditd watch rules.
    ground_truth_url: https://github.com/V4bel/dirtyfrag/blob/master/assets/write-up.md
    fix: Detect the setuid-binary execve/anomalous su chain, esp4/esp6/rxrpc module load and splice+AF_XFRM/UDP-encap activity; verify with in-memory vs on-disk checks (drop_caches / re-read from disk).
  - code: F3
    where: update 2026-05-11 ¶3
    claim: The Microsoft post emphasises that the page-cache write primitive bypasses on-disk file integrity monitoring (AIDE / IMA-EVM / auditd watch rules) — post-incident forensics must compare in-memory page contents against on-disk checksums, not just `md5sum` of the file.
    ground_truth: The Microsoft post says only that modifications 'may persist in memory or cached file content even after vulnerable modules are disabled', advising integrity validation of critical files and considering `echo 3 > /proc/sys/vm/drop_caches`. It does not mention AIDE, IMA-EVM, auditd or md5sum.
    ground_truth_url: https://www.microsoft.com/en-us/security/blog/2026/05/08/active-attack-dirty-frag-linux-vulnerability-expands-post-compromise-risk/
    fix: Attribute only the persistence/drop_caches statement to Microsoft.
  - code: F9
    where: summary / body ¶1 / update 2026-05-11 ¶3 (supersession)
    claim: kernel patch for the rxrpc component still pending on all major distros ; kernel mainline patch merged 2026-05-08 ; The upstream xfrm-ESP fix merged on 2026-05-07 ... the RxRPC fix was still pending
    ground_truth: 'Current state: the discoverer''s README lists mainline fixes f4c50a4034e6 (ESP, 2026-05-05) and aa54b1d27fe0 (RxRPC, 2026-05-10); Ubuntu publishes fixed kernels for all affected releases; Red Hat: ''Fixes have been released for all affected products'' (CVE-2026-43500 does not affect it). The frontmatter summary and status ''mitigation-only'' are superseded, and the entry gives two different ESP merge dates (05-08 vs 05-07).'
    ground_truth_url: https://github.com/V4bel/dirtyfrag/blob/master/README.md
    fix: Update summary/status to patches available; reconcile the ESP fix date.
  - code: F4
    where: cves[CVE-2026-43284].cvss
    claim: 'cvss: "7.8" (both CVEs)'
    ground_truth: (low confidence) The kernel CNA record for CVE-2026-43284 gives CVSS 3.1 8.8 (AV:L/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H); 7.8 is the CISA-ADP/Red Hat score. CVE-2026-43500 CNA = 7.8. Ubuntu states 8.8 (kernel.org CNA) vs 7.8 (NVD/CISA) for the two.
    ground_truth_url: https://cveawg.mitre.org/api/cve/CVE-2026-43284
    fix: cvss 8.8 for CVE-2026-43284 (note 7.8 CISA-ADP) and 7.8 for CVE-2026-43500.
  - code: F11
    where: sources[] / evidence[]
    claim: RHSB-2026-003 listed twice (updated 2026-05-09 and 2026-07-03); evidence publisher 'ctipilot v2 brief (migrated)'
    ground_truth: Duplicate source record for one URL; pipeline self-quotes are not evidence.
    ground_truth_url: https://access.redhat.com/security/vulnerabilities/RHSB-2026-003
    fix: Merge the duplicate source; remove self-quotes.
- entry: entries/2026-05-09/cve-2026-44128-et-al-seppmail-secure-email-gateway-cvss-9-3.md
  verdict: factual-error
  duplicate_of: null
  ground_truth: 'CVSS values (CVSS v4.0 from the NCSC.ch CNA records), CVE ids and the InfoGuard CVE-2026-2743 mechanics are supported. Errors: the fix version label (''patch 15.0.4.1''), company location, CVE-2026-2743 presented as ''new'' in May, wrong per-CVE type fields, and unsourced customer-base claims. Source-supported facts for any SEPPmail rewrite: NCSC-CH advisory post 12551 (2026-05-08; https://security-hub.ncsc.admin.ch/api/posts/12551/details via the ncsc-csh recipe) lists CVE-2026-7864 (6.9), -44125 (9.3), -44126 (9.2), -44127 (8.8), -44128 (9.3, ''Fixed in v15.0.2.1''), -44129 (8.3), exploitation status UNKNOWN, ''Vendor patches available since April 24th, 2026''. CNA (NCSC.ch) records (https://cveawg.mitre.org/api/cve/CVE-2026-44128 etc., CVSS v4.0): 44128 unauthenticated RCE, an endpoint passes a parameter to Perl eval() in the new GINA UI (affects < 15.0.2.1); 44125 missing authorization on multiple GINA UI endpoints, unauthenticated; 44126 insecure deserialization reachable
    from the GINA UI, unauthenticated RCE (AT:P); 44127 unauthenticated path traversal in /api.app/attachment/preview identifier parameter (file read, deletion of files in the target directory); 44129 SSTI, attacker-controlled template, unauthenticated (AT:P), potential RCE depending on template plugins; 7864 unauthenticated exposure of environment variables via the new GINA UI; all affect < 15.0.4 except 44128. SEPPmail release notes https://downloads.seppmail.com/extrelnotes/150/ERN15.0.html: 15.0.4 (2026-04-24) closes six ''Vuln:'' tickets (insecure deserialization, missing authorization in GINAv2, SSTI, unauthenticated RCE, LFI/arbitrary file deletion, exposure of sensitive information) stemming from test endpoints active in the beta GINAv2; 15.0.4.1 (2026-04-28) is an unrelated hotfix (missing waitpid() PID exhaustion). InfoGuard Labs https://labs.infoguard.ch/posts/seppmail_secure_e-mail_gateway_rce_vulnerabilities_cve-2026-2743_cve-2026-7864_cve-2026-44127_cve-2026-44128/ (2026-05-18):
    appliance is OpenBSD-based with Perl web apps; GINA v2.x must be explicitly enabled; self-registration enabled by default gives an authenticated session; fix versions 15.0.2.1 (44128), 15.0.3 (44126), 15.0.4 (2743, 44125, 44127, 44129, 7864); CVE-2026-2743 (CVSS 4.0 10.0, published 2026-03-05) is a pre-auth path traversal in LFT /v1/file.app writing as ''nobody'', chained via /etc/syslog.conf + newsyslog to RCE, affects only LFT-licensed instances (404 = not affected). SEPPmail AG is at Industriestrasse 7, 5432 Neuenhof (https://www.seppmail.com/about-us/contact/).'
  defects:
  - code: F4
    where: body ¶1
    claim: six CVEs in SEPPmail Secure Email Gateway patched in version 15.0.4 (patch 15.0.4.1).
    ground_truth: 'Vendor release notes: 15.0.4 (2026-04-24) closes the six ''Vuln:'' tickets; 15.0.4.1 (2026-04-28) is a hotfix for an unrelated waitpid()/PID-exhaustion bug. NCSC-CH''s post says ''CVE-2026-44128 ... Fixed in v15.0.2.1''; InfoGuard''s overview maps 44128 to 15.0.2.1 and 44126 to 15.0.3. The label ''15.0.4.1'' is wrong (and is copied into the xrdp entry''s table).'
    ground_truth_url: https://downloads.seppmail.com/extrelnotes/150/ERN15.0.html
    fix: '''Fixed in 15.0.4 (2026-04-24); CVE-2026-44128 already in 15.0.2.1 and CVE-2026-44126 in 15.0.3.'''
  - code: F4
    where: body ¶1
    claim: SEPPmail is a Swiss company (Steinach SG)
    ground_truth: 'SEPPmail''s contact page: SEPPmail AG, Industriestrasse 7, 5432 Neuenhof, Switzerland (canton Aargau). Steinach appears in no source.'
    ground_truth_url: https://www.seppmail.com/about-us/contact/
    fix: Neuenhof AG.
  - code: F5
    where: body ¶1
    claim: whose gateway handles S/MIME, PGP, and TLS email encryption for Swiss federal agencies, cantonal administrations, healthcare providers, and DACH-region enterprises
    ground_truth: No cited source names SEPPmail customers. InfoGuard says only that it is 'widely used ... in the DACH region' with 'several thousand public instances on Censys'.
    ground_truth_url: https://labs.infoguard.ch/posts/seppmail_secure_e-mail_gateway_rce_vulnerabilities_cve-2026-2743_cve-2026-7864_cve-2026-44127_cve-2026-44128/
    fix: Use InfoGuard's wording or delete.
  - code: F4
    where: body ¶1 / cves[]
    claim: 'CVE-2026-44128 ... unauthenticated RCE via test/development HTTP endpoints left active in the GINAv2 component; CVE-2026-44125 ... enabling unauthenticated administrative access and file manipulation ; cves[CVE-2026-7864] and cves[CVE-2026-44127] type: rce, vector: zero-click'
    ground_truth: 'CNA/InfoGuard: 44128 is Perl eval() injection of the upldd parameter at /api.app/template in the new GINA UI; 44125 is missing authorization on multiple GINA UI endpoints (no ''administrative access / file manipulation'' wording); CVE-2026-7864 is an unauthenticated environment-variable disclosure (/api.app/hello?op=env), CVE-2026-44127 an unauthenticated file read/delete via /api.app/attachment/preview - neither is RCE.'
    ground_truth_url: https://cveawg.mitre.org/api/cve/CVE-2026-7864
    fix: 'type: info-disclosure for 7864, lfi/file-delete for 44127; reword 44125/44128 per the CNA text.'
  - code: F4
    where: section 2026-05-20 ¶1-2 / summary of update
    claim: The principal new finding is **CVE-2026-2743 (CVSS 10.0)** ... **CVE-2026-2743 is also addressed by v15.0.4**
    ground_truth: 'CVE-2026-2743 was published by NCSC.ch on 2026-03-05 (affects 15.0.2.1 and before) and SEPPmail''s 15.0.3 notes (2026-03-03) already say ''we are closing a security vulnerability CVE-2026-2743 found by Infoguard''; it is not new in May - InfoGuard''s technical write-up (2026-05-18) is. Fix version is 15.0.3 per the vendor and CNA scope (InfoGuard''s own table says 15.0.4: sources disagree).'
    ground_truth_url: https://cveawg.mitre.org/api/cve/CVE-2026-2743
    fix: '''InfoGuard''s write-up details CVE-2026-2743 (published March 2026, fixed in 15.0.3 per SEPPmail)''; surface the 15.0.3 vs 15.0.4 discrepancy.'
  - code: F9
    where: section 2026-05-20 / body ¶1
    claim: all patched in v15.0.4 ; CVE-2026-2743 is also addressed by v15.0.4
    ground_truth: 'Fix-version contradictions between sources: NCSC-CH (44128 ''Fixed in v15.0.2.1''), vendor notes (2743 in 15.0.3; six GINAv2 tickets in 15.0.4), InfoGuard table (44128 15.0.2.1, 44126 15.0.3, 2743 and the rest 15.0.4). The entry picks ''15.0.4'' for all without a Contradiction line.'
    ground_truth_url: https://labs.infoguard.ch/posts/seppmail_secure_e-mail_gateway_rce_vulnerabilities_cve-2026-2743_cve-2026-7864_cve-2026-44127_cve-2026-44128/
    fix: Add a Contradiction line listing the per-CVE fix versions.
  - code: F4
    where: section 2026-05-20 ¶1
    claim: InfoGuard Labs — the Baar-based Swiss security firm that performed the original SEPPmail review
    ground_truth: (low confidence) SEPPmail's notes credit the earlier 'very comprehensive security review' (CVE-2026-27441 ff.) to ETH Zurich researchers; InfoGuard says an ETH research project prompted its own audit. InfoGuard found CVE-2026-2743 and the GINA V2 flaws but did not perform 'the original review'.
    ground_truth_url: https://downloads.seppmail.com/extrelnotes/150/ERN15.0.html
    fix: '''InfoGuard Labs, which found CVE-2026-2743 and the GINA V2 flaws''.'
  - code: F11
    where: summary
    claim: Full technical breakdown in § 6.
    ground_truth: Dangling reference to a section of the original v2 brief that does not exist in this entry.
    ground_truth_url: https://security-hub.ncsc.admin.ch/api/posts/12551/details
    fix: Delete.
  - code: F18
    where: actions[0]
    claim: Apply SEPPmail v15.0.4 to any DACH-region deployment still on an earlier build. CVE-2026-2743 (CVSS 10.0 ...) is also addressed by v15.0.4 — but if you delayed updating on the assumption disabled LFT limited exposure, re-evaluate now (InfoGuard's scan finds the majority of customer instances have LFT enabled)
    ground_truth: Hedged ('if you delayed ... re-evaluate'), restates the body, and mixes a patch task with commentary; SEPPmail has since shipped 15.0.4.x-15.0.7 with further security fixes (release notes), so 'apply 15.0.4' is not the end state.
    ground_truth_url: https://downloads.seppmail.com/extrelnotes/150/ERN15.0.html
    fix: '''Upgrade every SEPPmail appliance to the current 15.0.x release; where LFT is licensed confirm /v1/file.app is patched.'''
  - code: F12
    where: verification
    claim: 'verification: single-source-national-cert'
    ground_truth: Five sources are listed (NCSC-CH, SEPPmail release notes, InfoGuard, The Hacker News, CybersecurityNews); the single-source value understates the corroboration and conflicts with sources[].
    ground_truth_url: https://thehackernews.com/2026/05/seppmail-secure-e-mail-gateway.html
    fix: 'verification: multi-source.'
  - code: F17
    where: classification / techniques
    claim: 'classification: null; techniques: []'
    ground_truth: Key present but null; techniques[] empty on a vulnerability entry although pre-auth exploitation of an internet-facing service is described (T1190).
    ground_truth_url: https://labs.infoguard.ch/posts/seppmail_secure_e-mail_gateway_rce_vulnerabilities_cve-2026-2743_cve-2026-7864_cve-2026-44127_cve-2026-44128/
    fix: 'classification: reliability A (NCSC.ch is the CNA/national CERT; vendor notes corroborate), credibility 2; techniques [T1190, T1059, T1005].'
- entry: entries/2026-05-09/daemon-tools-lite-supply-chain-quic-rat-deployed-via-signed.md
  verdict: factual-error
  duplicate_of: null
  ground_truth: 'The supply-chain facts (versions 12.5.0.2421-12.5.0.2434 from 2026-04-08, signed with AVB Disc Soft certificates, info collector envchk.exe, QUIC RAT injects notepad.exe/conhost.exe, clean 12.6.0.2445, Chinese-speaking artefacts, no attribution) are supported. The headline victimology and the QUIC RAT description are not. Source-supported facts: Kaspersky Securelist 2026-05-05 https://securelist.com/tr/daemon-tools-backdoor/119654/ and blog https://www.kaspersky.com/blog/daemon-tools-supply-chain-attack/55691/: several thousand infection attempts in 100+ countries (most victims Russia, Brazil, Turkey, Spain, Germany, France, Italy, China); 10% of affected systems belong to organisations; most got only the information collector; the minimalistic backdoor reached about a dozen machines of government, scientific, manufacturing and retail organisations in Russia, Belarus and Thailand; QUIC RAT was seen against one organisation, an educational institution in Russia; QUIC RAT
    (C++, WolfSSL, embedded msquic.dll) supports HTTP, UDP, TCP, WSS, QUIC, DNS and HTTP/3 C2 and injects into notepad.exe and conhost.exe; the trojanised files are DTHelper.exe, DiscSoftBusServiceLite.exe, DTShellHlp.exe, which at startup beacon to a typosquatted domain and then run cmd.exe -> powershell WebClient.DownloadFile into C:\Windows\Temp; intent (espionage vs big-game hunting) is ''currently unclear''; Disc Soft says only the free Lite edition was affected (https://therecord.media/hackers-compromise-daemon-tools-global-supply-chain-attack).'
  defects:
  - code: F4
    where: title / summary / body ¶1
    claim: EU governments among targeted victims ; Germany, France, Spain, and Italy among top victim countries; ~10% of infections on enterprise systems with government/scientific sector specifically targeted ; Targeted QUIC RAT deployment was limited to approximately a dozen machines in government, scientific, manufacturing, and retail sectors
    ground_truth: 'Kaspersky: the ~dozen machines that received further payloads (the minimalistic backdoor, not QUIC RAT) were organisations ''located in Russia, Belarus, and Thailand''; QUIC RAT ''against only one organization, an educational institution located in Russia''. EU countries appear only in the list of countries with infection attempts (mostly information-collector only); no EU government victim is reported.'
    ground_truth_url: https://securelist.com/tr/daemon-tools-backdoor/119654/
    fix: 'Retitle: ''DAEMON Tools Lite trojanised installers deliver profiler, backdoor and QUIC RAT; targeted payloads seen in Russia, Belarus, Thailand''; correct the QUIC RAT scope.'
  - code: F4
    where: body ¶1
    claim: QUIC RAT, an advanced implant that injects into `notepad.exe` and `conhost.exe`, supports C2 over QUIC (evading proxy inspection), and implements shell execution, file management, process injection, keylogging, SOCKS proxy, and TCP tunnelling
    ground_truth: 'Securelist (analysis ''still ongoing'') states only: supports HTTP, UDP, TCP, WSS, QUIC, DNS and HTTP/3 C2 and can inject payloads into notepad.exe and conhost.exe. Shell execution is a capability of the earlier minimalistic backdoor. Keylogging, SOCKS proxy, TCP tunnelling and ''evading proxy inspection'' are not in Securelist, the Kaspersky blog, Help Net Security or The Record.'
    ground_truth_url: https://securelist.com/tr/daemon-tools-backdoor/119654/
    fix: Limit to the sourced capabilities.
  - code: F4
    where: body ¶2 (technique list)
    claim: T1036.004 Masquerade Task or Service (kworker/ksoftirqd masquerade); T1573.002 Asymmetric Cryptography / QUIC
    ground_truth: kworker/ksoftirqd are Linux kernel threads; DAEMON Tools Lite is a Windows product and no source mentions a Linux masquerade. QUIC is not 'Asymmetric Cryptography' (T1573.002); the report cites no encryption detail.
    ground_truth_url: https://securelist.com/tr/daemon-tools-backdoor/119654/
    fix: Delete the masquerade mapping; map only supported behaviour (T1195.002, T1055 process injection, T1071/T1095 for the C2 protocols) in techniques[].
  - code: F4
    where: body ¶1 / tags
    claim: 'selective activation consistent with intelligence-collection objectives ; tags: espionage, china-nexus'
    ground_truth: 'Kaspersky: ''their intent — whether it is cyberespionage or big game hunting — is currently unclear''; artefacts only ''suggest'' a Chinese-speaking actor and ''we do not currently attribute the DAEMON Tools compromise to any particular actor''.'
    ground_truth_url: https://securelist.com/tr/daemon-tools-backdoor/119654/
    fix: Remove the intelligence-collection inference and the espionage/china-nexus tags (or qualify as 'Chinese-speaking artefacts').
  - code: F6
    where: sources[0]
    claim: Kaspersky blog — DAEMON Tools supply chain attack, 2026-05-05/08 (cited as 'Kaspersky Securelist' inline)
    ground_truth: The URL is Kaspersky's consumer blog summary, mislabelled 'Securelist' inline; the technical primary is the Securelist Threat Response report (2026-05-05, updated 5/6 and 5/8).
    ground_truth_url: https://securelist.com/tr/daemon-tools-backdoor/119654/
    fix: Add the Securelist URL as primary and fix the inline label.
  - code: F8
    where: labelled line Detection
    claim: check for `envchk.exe`, unsigned processes injected into `notepad.exe` or `conhost.exe`, and outbound QUIC (UDP 443)
    ground_truth: 'The earliest, most reliable behaviour is omitted: the trojanised DTHelper.exe / DiscSoftBusServiceLite.exe / DTShellHlp.exe (validly signed) make HTTPS GET beacons at startup and spawn cmd.exe /c powershell WebClient.DownloadFile to C:\Windows\Temp followed by execution and self-deletion; the information collector posts host name, MAC, process and software lists. Also: backdoor shellcode loader run via rundll32/ cdg.exe with RC4-decrypted shellcode. ''Unsigned processes injected'' is not source-based (injected host processes notepad.exe/conhost.exe are Microsoft-signed).'
    ground_truth_url: https://securelist.com/tr/daemon-tools-backdoor/119654/
    fix: Add the DAEMON Tools helper -> cmd.exe -> powershell DownloadFile -> %TEMP% exe chain as the primary hunt.
  - code: F17
    where: classification / techniques
    claim: (no classification block; techniques[] absent on a threat entry)
    ground_truth: Required; absent.
    ground_truth_url: https://securelist.com/tr/daemon-tools-backdoor/119654/
    fix: 'classification: reliability B, credibility 2 (Kaspersky primary + independent press relays, vendor acknowledgement); techniques T1195.002, T1055, T1071, T1059.001 (PowerShell).'
  - code: F16
    where: priority
    claim: 'priority: high'
    ground_truth: (low confidence) Kaspersky's own data show targeted payloads outside the constituency's regions; exposure for Swiss public sector is generic (a consumer disk-image tool on endpoints). Hunt/uninstall decision within 7 days is plausible, so only a mild downgrade question.
    ground_truth_url: https://securelist.com/tr/daemon-tools-backdoor/119654/
    fix: notable unless Swiss endpoint exposure is sourced.
- entry: entries/2026-05-09/denic-de-dnssec-outage-faulty-key-rollover-3-5-h-disruption.md
  verdict: factual-error
  duplicate_of: null
  ground_truth: 'Mostly supported but with wrong time-zone labels, a wrong Cloudflare mitigation claim, uncited ''18 million''/''.ch unaffected'', and a root-cause description that DENIC itself corrected on 2026-05-11. Supported facts: DENIC 2026-05-06 https://blog.denic.de/en/technical-issue-with-de-domains-resolved/ (incident from 21:57 local time on 5 May, correct zone distributed 00:08, full restoration 01:15, tied to a routine scheduled key rollover); DENIC analysis 2026-05-08 (updated 11 May) https://blog.denic.de/analyse-des-dns-ausfalls-vom-5-mai-2026/ (third-generation signing system commissioned April 2026 with Knot plus in-house code and HSMs; faulty code generated three different key pairs under one key tag, only one public key published; NSEC3 signatures also non-validatable so even non-DNSSEC .de domains failed; the three validation tools detected it but the messages were not processed correctly; 11 May addendum: no key-tag collision - the software generated one key pair per
    HSM instead of one pair stored on three HSMs); Cloudflare https://blog.cloudflare.com/de-tld-outage-dnssec/ (started ~19:30 UTC, mitigation 22:17 UTC via an override equivalent to a negative trust anchor, serve-stale cushioned impact); heise 2026-05-08 (times in local time, 21:43, fixed after 01:00).'
  defects:
  - code: F4
    where: summary / body ¶1
    claim: On 2026-05-05 at 21:43 UTC, DENIC ... began distributing invalid DNSSEC signatures ... DENIC restored service by 01:15 UTC on 2026-05-06.
    ground_truth: The 21:43 / 21:57 and 01:15 times in DENIC and heise are local (CEST) times; Cloudflare puts the start at ~19:30 UTC and its own mitigation at 22:17 UTC. Labelled 'UTC' the entry's window is two hours off (21:43 CEST = 19:43 UTC; 01:15 CEST = 23:15 UTC). DENIC's own start time is 21:57, heise's 21:43; DENIC says the impact lasted 'ca. drei Stunden'.
    ground_truth_url: https://blog.cloudflare.com/de-tld-outage-dnssec/
    fix: '''from about 19:30-19:57 UTC (21:43-21:57 CEST) on 2026-05-05 until 23:15 UTC (01:15 CEST); roughly three hours''.'
  - code: F4
    where: body ¶1
    claim: Cloudflare deployed a Negative Trust Anchor under RFC 7646 for its resolvers within ~90 minutes
    ground_truth: 'Cloudflare: impact began ~19:30 UTC and the mitigation rolled out at 22:17 UTC (about 2 h 47 min); it ''has not implemented a native NTA mechanism'' and used an existing override rule marking .de insecure, ''functionally equivalent to an NTA, though not formally defined in any RFC''.'
    ground_truth_url: https://blog.cloudflare.com/de-tld-outage-dnssec/
    fix: '''about 2 h 45 min after onset, via an override equivalent to an NTA''.'
  - code: F3
    where: summary / body ¶1 / sources
    claim: approximately 18 million .de domains ; Crucially, .ch was unaffected ([heise online, 2026-05-08] · [Cloudflare blog])
    ground_truth: 'Neither the cited DENIC pages, heise nor Cloudflare gives an ''18 million'' figure (Cloudflare: ''millions of domains'') or says anything about .ch.'
    ground_truth_url: https://www.heise.de/news/DNS-Probleme-mit-de-Domains-DENIC-liefert-erste-Erklaerung-11288197.html
    fix: Delete or source both; .ch independence is the entry's inference.
  - code: F4
    where: body ¶1 / update 2026-05-10 ¶2
    claim: a software defect in DENIC's HSM integration code introduced during a March 2026 migration to Knot DNS generated three key pairs sharing keytag 33834 ; the code generated **three private key pairs all assigned the same Key Tag (33834)** rather than a unique tag per key
    ground_truth: 'DENIC: third-generation system commissioned in April 2026 (Knot is existing standard software; the defect is in in-house code around the HSMs; no ''migration to Knot''); DENIC''s addendum of 11 May 2026 corrects the mechanism: ''A key-tag collision did not occur. Rather, the software generated three different key pairs - one per HSM - instead of one key pair stored on three HSMs; all three HSMs were used for signing but only one matched the pre-published DNSKEY.'' The entry''s own two sections also disagree (March vs April).'
    ground_truth_url: https://blog.denic.de/analyse-des-dns-ausfalls-vom-5-mai-2026/
    fix: Rewrite per DENIC's corrected account (one key pair per HSM, only one matching the published DNSKEY) and add an improvement/correction record.
  - code: F4
    where: title
    claim: 3.5 h disruption for German government and public-sector .de domains
    ground_truth: DENIC and Cloudflare describe all .de domains (for validating resolvers); no source singles out government or public-sector domains.
    ground_truth_url: https://blog.denic.de/en/technical-issue-with-de-domains-resolved/
    fix: '''all .de domains behind validating resolvers''.'
  - code: F11
    where: kind / tags / techniques
    claim: 'kind: threat; tags: vulnerabilities, eu-nexus; techniques: []; classification: null; ''(the SIEM-rule equivalent of a fire-but-don''t-page failure)'''
    ground_truth: An operational registry outage with no adversary is typed `threat` and tagged `vulnerabilities`; classification key present but null; editorial aside in the 05-10 section. DENIC says the three validation tools detected the anomaly but their messages were not processed correctly (not 'resolver behaviour' monitoring).
    ground_truth_url: https://blog.denic.de/analyse-des-dns-ausfalls-vom-5-mai-2026/
    fix: 'kind incident, drop vulnerabilities tag, set classification (reliability A, credibility 1/2: registry primary + Cloudflare).'
  - code: F7
    where: priority / relevance
    claim: 'priority: notable'
    ground_truth: (low confidence) German registry outage that ended 2026-05-06 with no Swiss exposure (entry itself says .ch unaffected); the transferable point (keep an NTA/serve-stale procedure for TLD DNSSEC failures) is a two-sentence takeaway.
    ground_truth_url: https://blog.cloudflare.com/de-tld-outage-dnssec/
    fix: routine.
- entry: entries/2026-05-09/enisa-expands-cve-root-four-new-european-organisations-onboa.md
  verdict: factual-error
  duplicate_of: null
  ground_truth: 'The counts are right (four new CNAs plus seven moved from MITRE Root = eleven; over 90 European CNAs can transfer), but the entry invents a CRA causal link and a speculative defender consequence, and has no defender action. ENISA page (2026-05-06, https://www.enisa.europa.eu/news/new-cve-numbering-authorities-under-enisa-root): four organisations newly joined as CNAs under ENISA Root, seven CNAs have moved from MITRE Root in addition; ENISA became CVE Root for European entities in November 2025; over 90 European CNAs can transfer voluntarily out of 510 CNAs from 42 countries; ENISA cites frontier-AI-accelerated vulnerability discovery and the proposed Cybersecurity Act 2 for added capacity. No CRA mention.'
  defects:
  - code: F13
    where: body ¶1 / entities
    claim: 'This is part of the EU Cyber Resilience Act (CRA) implementation framework: the CRA designates ENISA as the EU-level coordination body for harmonised vulnerability reporting, and the CVE Root transfer is the operational mechanism. ; entities: campaign:eu-cyber-resilience-act'
    ground_truth: The ENISA press release never mentions the Cyber Resilience Act; it states ENISA became CVE Root in November 2025 and links added capacity to the proposed Cybersecurity Act 2. The CRA / CVE-Root 'operational mechanism' link is asserted without a source, and a regulation is registered as a campaign entity.
    ground_truth_url: https://www.enisa.europa.eu/news/new-cve-numbering-authorities-under-enisa-root
    fix: Delete the CRA sentence and the entity.
  - code: F5
    where: body ¶1
    claim: 'For defenders: an increasing proportion of EU-discovered CVEs will be assigned and initially coordinated through ENISA-supervised channels, which may affect advisory publication timing and format compared to MITRE Root coordination — particularly for products made by EU software vendors.'
    ground_truth: Speculation; ENISA states the opposite aim ('more consistent, timely, and coordinated vulnerability identification') and no source discusses advisory timing/format effects.
    ground_truth_url: https://www.enisa.europa.eu/news/new-cve-numbering-authorities-under-enisa-root
    fix: Delete.
  - code: F7
    where: priority / relevance
    claim: 'priority: notable; kind: research'
    ground_truth: Programme-administration news (which root a CNA sits under) with no vulnerability, exploitation, actor or defender decision; Switzerland is not an EU/ENISA-Root member state. Fails the relevance/actionability gate for a Tier 2/3 SOC.
    ground_truth_url: https://www.enisa.europa.eu/news/new-cve-numbering-authorities-under-enisa-root
    fix: Drop (or routine, two sentences).
  - code: F17
    where: classification
    claim: (no classification block)
    ground_truth: Required; absent.
    ground_truth_url: https://www.enisa.europa.eu/news/new-cve-numbering-authorities-under-enisa-root
    fix: 'If kept: reliability A (ENISA owns the announcement), credibility 2.'
- entry: entries/2026-05-09/german-court-finds-bank-liable-for-sophisticated-phishing-lo.md
  verdict: factual-error
  duplicate_of: null
  ground_truth: 'Court, case number, date, EUR 218,000 and the log-discrepancy remark are supported, but the entry converts an obiter remark into a PSD2/SCA ''obligation'' and the legal basis is misstated; relevance to a Swiss public-sector SOC is thin. Supported facts: LG Berlin II, Zivilkammer 38, Az. 38 O 293/25, judgment 2026-04-22, Apobank must reimburse about EUR 218,000 (customer bears EUR 50) because the customer was not grossly negligent in a staged fraud (bank-branded letter with QR code to a manipulated site, a call from a purported bank employee from the bank''s official number, customer photographed a QR code allowing the attackers to register their own device); basis § 675u BGB (bank carries the burden of proof for gross negligence); not yet final (https://borncity.com/news/landgericht-berlin-ii-verurteilt-apobank-zu-218-000-euro-rueckzahlung/); heise (https://www.heise.de/news/Urteil-gegen-die-Apobank-Finanzinstitut-haftet-fuer-Phishing-Schaden-11288231.html): the chamber
    remarked beyond the holding that the login and the new-device registration came from entirely different IP addresses/providers and the bank did not block it; the claimant''s lawyer calls the court''s technical assessment ''still amateurish''.'
  defects:
  - code: F4
    where: body ¶1
    claim: The court treated this as an obligation under Germany's PSD2 implementation — specifically, a duty to apply IP-based behavioural analytics and trigger a strong-customer-authentication challenge when registration and first-use IPs diverge.
    ground_truth: 'heise: the chamber ''deutet ... Ansätze für notwendige Früherkennungssysteme an'' in remarks ''über die Entscheidung hinaus'' (beyond the holding); the claimant''s lawyer calls them technically ''laienhaft''. Neither heise nor Borncity mentions PSD2, SCA or a duty; the liability rests on the customer not being grossly negligent (§ 675u BGB).'
    ground_truth_url: https://www.heise.de/news/Urteil-gegen-die-Apobank-Finanzinstitut-haftet-fuer-Phishing-Schaden-11288231.html
    fix: '''The court held the customer not grossly negligent; in passing it noted the bank could have blocked the new-device registration given the IP/provider mismatch.'''
  - code: F4
    where: body ¶1
    claim: 'not yet final pending appeal ... For EU/Swiss financial-sector and public-sector digital-service providers: this reinforces the trend of courts placing authentication-failure liability on service providers'
    ground_truth: 'Borncity: ''noch nicht rechtskräftig'' (no appeal reported). The Swiss extrapolation is unsourced: PSD2/§ 675u BGB are German/EU payment-services law; nothing cited concerns Swiss law or public-sector providers.'
    ground_truth_url: https://borncity.com/news/landgericht-berlin-ii-verurteilt-apobank-zu-218-000-euro-rueckzahlung/
    fix: '''not yet final''; delete the Swiss/public-sector generalisation.'
  - code: F3
    where: sources[1] / inline cite
    claim: '[ilex Rechtsanwälte — case summary, 2026-05](https://www.anwalt.de/rechtstipps/phishing-ilex-rechtsanwaelte-erwirkt-haftung-der-apobank-269786.html)'
    ground_truth: 'unreadable: every rung (extract, WebFetch, jina) hit a 403/anti-bot block for this URL, so claims attributed to it (EUR 218,000+, details) could not be confirmed from it; the figure 218,000 is confirmed from Borncity instead.'
    ground_truth_url: https://borncity.com/news/landgericht-berlin-ii-verurteilt-apobank-zu-218-000-euro-rueckzahlung/
    fix: Cite Borncity for the amount and the 'not final' status or keep heise only.
  - code: F8
    where: body ¶1 (attack description)
    claim: forged physical bank letters, manipulated online banking interfaces, and spoofed-number phone calls
    ground_truth: 'Borncity adds the observable mechanism: the letter''s QR code led to a manipulated look-alike portal (''Quishing''), the caller walked the victim through the process, and the victim photographed a QR code that let the attackers enrol their own device. The device-registration step is the defender-relevant TTP and is missing.'
    ground_truth_url: https://borncity.com/news/landgericht-berlin-ii-verurteilt-apobank-zu-218-000-euro-rueckzahlung/
    fix: State the QR-code device-enrolment step.
  - code: F7
    where: priority / relevance
    claim: 'priority: notable; tags: law-enforcement'
    ground_truth: Single non-final German civil judgment against a private bank with no Swiss or public-sector nexus and no new TTP beyond known vishing/quishing; it is a civil, not law-enforcement, matter. Fails the incident/research relevance bar.
    ground_truth_url: https://www.heise.de/news/Urteil-gegen-die-Apobank-Finanzinstitut-haftet-fuer-Phishing-Schaden-11288231.html
    fix: Drop (or routine, two sentences); remove law-enforcement tag.
  - code: F17
    where: classification / techniques
    claim: (no classification block; techniques[] absent)
