  entry: 2026-09-29/push-security-clickfix-h2-2026-detection-review
  surface: body
  kind: derived
  text: '**Defender takeaway:** because delivery is overwhelmingly search-driven rather than email-driven, browser and endpoint telemetry, not mail-gateway controls, are where this technique surfaces; monitor
