- claim_id: abcf44d0a0
  entry: 2026-09-29/push-security-clickfix-h2-2026-detection-review
  surface: body
  kind: uncited
  text: Push observed 84 distinct ClickFix command forms spanning more than 20 trusted system binaries (PowerShell, cmd, bash/zsh, mshta, rundll32, msiexec, pcalua, wmic, certutil, schtasks among others),
    a deliberate LOLBin-rotation strategy intended to outpace endpoint-detection rules keyed on any single binary; Push reports the main kits now read their configuration from a smart contract on a public
    blockchain (an "EtherHiding" technique observed across BNB Smart Chain testnet, Polygon, Base and Ethereum Sepolia, with most of the observed traffic on testnets) rather than from the page itself, so
    payload and lure are fetched at load time, can be rotated with a single blockchain transaction, and leave no hosting infrastructure for defenders to take down or block.
- claim_id: bf0e9a36ec
  entry: 2026-09-29/push-security-clickfix-h2-2026-detection-review
  surface: body
  kind: derived
  text: '**Triage:** the discriminator is not which binary runs but its parent-process lineage and trigger context: a LOLBin (PowerShell, mshta, rundll32, certutil, or any of the 20+ Push documents) launched
    with a paste-derived command line from `explorer.exe` or a browser process, following a user interaction with a fake CAPTCHA or verification prompt on a webpage, is the ClickFix pattern; the same binary
    launched from a scheduled task, an MDM agent, or an IT-administration parent process in the course of routine automation is the benign lookalike.'
- claim_id: 8a2e61e59a
  entry: 2026-09-29/push-security-clickfix-h2-2026-detection-review
  surface: body
  kind: derived
  text: Sequence and parentage separate the two; the binary alone does not.
