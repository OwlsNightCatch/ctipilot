- claim_id: ffd78e449e
  entry: 2026-09-17/mandiant-ai-risk-resilience-report-2026
  surface: body
  kind: uncited
  text: '**Hardening:** require all local AI-assistant binaries, CLI helpers, plugins and MCP servers to be signed and verified before execution; enforce multi-party approval and continuous monitoring on
    internal AI repositories; and sandbox AI-assistant execution engines in micro-segmented, containerized runtimes (gVisor or microVMs) so a subverted hook cannot reach the host, with human-in-the-loop
    approval required before shell execution, configuration changes or outbound network calls.'
- claim_id: d328164b7f
  entry: 2026-09-17/mandiant-ai-risk-resilience-report-2026
  surface: body
  kind: uncited
  text: '**Hunt/detection:** tune EDR and SIEM for in-memory compilation — unexpected native-compiler process spawns from non-developer parent processes and rapid file-create-execute-delete cycles in temp
    directories — and baseline endpoint CPU/GPU consumption to catch sudden, unexplained spikes from otherwise-lightweight background processes; response playbooks should suspend the entire parent execution
    tree (not just the worker thread) and capture a memory snapshot before network isolation.'
- claim_id: a5dbce2915
  entry: 2026-09-17/mandiant-ai-risk-resilience-report-2026
  surface: body
  kind: uncited
  text: '**Hunt/detection:** cross-correlate application logs with network egress telemetry, and alert when an internal-facing AI service account initiates unauthorized outbound transfers or opens anomalous
    external API connections; on detection, invalidate the agent''s active OAuth tokens and downgrade its container''s egress privileges while keeping the instance alive for prompt-history forensics.'
