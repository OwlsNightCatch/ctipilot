  entry: 2026-09-10/sap-september-2026-overpass-s4get-preauth-rce
  surface: body
  kind: cited
  text: SAP's 8 September 2026 Security Patch Day fixed CVE-2026-44756 ("OVERPASS", CVSS 10.0) and CVE-2026-58240 ("S4GET", CVSS 9.8), both discovered and responsibly disclosed by Onapsis Research Labs,
