  entry: 2026-07-29/cve-2026-63077-teamcity-onprem-unauth-deserialization-rce
  surface: body
  kind: derived
  text: 'Requests to the agent-polling endpoint arriving from addresses that are not your registered build agents are the first signal, and the second, the one that matters if the first was missed, is any
