  entry: 2026-08-29/exchange-mrsproxy-auth-bypass-cve-2026-62911-poc
  surface: summary
  kind: frontmatter
  text: CVE-2026-62911 (CVSS3.1 8.0), patched in Microsoft's 11 August 2026 Exchange Server security release and originally rated "Exploitation Less Likely," now has working exploit code published on GitHub
    (around 27 August 2026). The flaw is a missing channel-binding check on the MRSProxy mailbox-move endpoint that lets a relayed Negotiate/NTLM authentication exchange be treated as the relayed account,
    giving an attacker who can capture or coerce that exchange full mailbox access across the organization. No in-the-wild exploitation is reported.
