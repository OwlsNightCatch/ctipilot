- claim_id: edc637e166
  entry: 2026-09-17/cve-2026-76460-cisco-ise-auth-bypass-root-rce
  surface: body
  kind: derived
  text: '**Triage:** a legitimate administrative session against the ISE API originates from an authenticated, known management source; the discriminator here is that exploitation reaches the API without
    any authentication at all, so any successful request against the affected endpoint from outside expected management-plane sources is itself the signal — and because a root-level attacker can edit or
    delete `access.log` entries, an apparently clean on-box log is not evidence of an intact device.'
