- code: F8
  entry: 2026-05-13/cve-2026-41089-cve-2026-41096-cve-2026-41103-cve-2026-42898
  where: 'body: no **Defender takeaway:** line (Exposure, Detection, Contradiction only)'
  summary: '(low confidence) The actionability contract requires a Defender takeaway on every entry; this high-priority exploited-CVE entry has Exposure, Detection and Contradiction lines but no takeaway
    (the decision: patch DCs first, treat disputed exploitation as a reason to prioritise, check for compromise because patching does not evict). The decision lives only in actions[0].'
  ground_truth: 'CCB: while patching ... may provide safety from future exploitation, it does not remediate historic compromise; MSRC/CERT-EU: patch DCs'
  ground_truth_url: https://ccb.belgium.be/advisories/warning-microsoft-patch-tuesday-may-2026-patches-118-vulnerabilities-16-critical-102
  fix: Add one **Defender takeaway:** line, cited.
- code: F8
  entry: 2026-06-09/cve-2026-42271-berriai-litellm-low-privilege-command-injecti
  where: body (no **Exposure:**, **Detection:**, **Defender takeaway:** lines); actions[0] trimmed to the upgrade task this fire
  summary: 'A KEV-listed, priority-high LiteLLM RCE entry carries none of the labelled lines and no interim mitigation. Both cited sources clearly support them and the trimmed action no longer carries them:
    GHSA states a workaround (''block POST /mcp-rest/test/connection and POST /mcp-rest/test/tools/list at their reverse proxy or API gateway''), and Horizon3 lists the Starlette 1.0.1 upgrade, rotating
    credentials the proxy stores, and the behaviours to hunt (unexpected subprocess execution spawned through the MCP test endpoints, requests to /mcp-rest/test/*, unusual Host header values). Iteration
    3 asked to drop the interim clause from the action on the premise that the body carries it; the body does not.'
  ground_truth: 'GHSA ''Workarounds: If upgrading is not immediately possible, developers should block POST /mcp-rest/test/connection and POST /mcp-rest/test/tools/list at their reverse proxy or API gateway.'';
    Horizon3 ''If immediate patching is not possible: Block access to the affected MCP test endpoints; Rotate credentials stored by the proxy; Review logs for unusual Host header activity and subprocess
    execution events'''
  ground_truth_url: https://horizon3.ai/attack-research/vulnerabilities/cve-2026-42271-chained-with-cve-2026-48710/
  fix: 'Add cited Exposure (versions 1.74.2 to 1.83.6, Starlette <= 1.0.0 for the unauthenticated chain), Detection (telemetry class: subprocess spawn from the proxy, requests to the two endpoints, anomalous
    Host headers) and Defender takeaway (upgrade plus Starlette 1.0.1, block the two endpoints meanwhile, rotate stored provider keys).'
