- code: F5
  entry: 2026-09-29/microsoft-storm-2570-cross-raas-toolkit
  where: body paragraph 1, sentences after the first citation ('Post-compromise, the affiliate routinely conducts internal network discovery ... Regardless of the final ransomware brand, Microsoft describes
    a recurring commodity toolchain ...') and paragraph 2 ('Microsoft's own post closes with a Defender XDR detection and mitigation mapping') (claims 469a0bbdd9, 2108167784)
  summary: '(low confidence) About twenty named tools and behaviours (NetScan/SoftPerfect/Nmap, MeshAgent renaming, Atera/Splashtop/ScreenConnect/NinjaRMM, Cloudflared service, ngrok, ntdsutil IFM, Mimikatz/LaZagne/pypykatz,
    PerfLogs exclusions, PsExec @ip.txt, rdp.bat, Impacket/NetExec, s5cmd/Rclone) sit in two uncited sentences, attributed in prose to Microsoft but with no inline link; the same applies to the Defender
    XDR sentence. All are on the Microsoft post (verified), so this is a missing-link defect, not a truth defect. One gloss is not Microsoft''s: ''ngrok exposing RDP for redundant remote access'' (Microsoft:
    ngrok exposes TCP 3389 and Cloudflared creates ''resilient outbound access paths'').'
  ground_truth: 'Microsoft: ''the threat actor uses ngrok to expose TCP 3389 (default port for RDP), after which PsExec-related activity and security tampering appears.'''
  ground_truth_url: https://www.microsoft.com/en-us/security/blog/2026/09/24/beyond-ransomware-tracking-storm-2570-consistent-tradecraft-across-deployments/
