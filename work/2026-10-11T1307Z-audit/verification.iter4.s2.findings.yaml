  ground_truth_url: https://blog.talosintelligence.com/ransomware-incidents-in-japan-in-the-first-half-of-2026/
  fix: Say 'traces indicate' / 'Talos found command-history traces of' for the chunked rclone upload, in the summary and the body.
- code: F4
  entry: 2026-09-22/plugin4shell-ai-coding-agent-sha-pinning-bypass
  where: 'body paragraph 1: ''Gemini CLI has a distinct but equally exploitable variant ... ([AIR Security, 2026-09-17])'' (claim cba5c9a957)'
  summary: (low confidence) 'Equally exploitable' is the entry's comparison, not AIR's. AIR says only that 'git gives an attacker two ways to exploit it' and calls the result zero-click across all four.
    The Hacker News, which this fire's correction relies on to drop 'identically' from the title, says GitHub's rule 'does not clearly block' the Gemini name, i.e. the two variants' reach is not established
    as equal. The body sentence still carries the comparative the title correction removed.
  ground_truth: 'AIR: ''git gives an attacker two ways to exploit it.'' THN: ''GitHub''s rule against hash-shaped names does not clearly block that name. So it is not established that installing a Gemini
    CLI plugin from GitHub avoids the flaw.'''
  ground_truth_url: https://www.air.security/blog-posts/plugin4shell
  fix: Say 'a distinct variant' and drop 'equally exploitable'.
