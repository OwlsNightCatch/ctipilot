  entry: 2026-09-21/the-gentlemen-open-directory-vhdx-backup-ntds-theft
  where: 'body: ''The VHDX backup files themselves ... were compressed with `zstd`, split into 256MiB chunks and uploaded concurrently (up to 16 files at a time) to Wasabi cloud storage via `rclone`'';
    summary: ''exfiltrates the VHDX backup images themselves in 256MiB chunks to Wasabi cloud storage'' (claim 0c4a192607)'
  summary: '(low confidence) Talos hedges this phase: ''We also identified traces indicating that the VHDX files were compressed with zstd and transferred to cloud storage services such as Wasabi using
    rclone ... This suggests that the attackers were deliberately focused on exfiltrating large volumes of data and intended to maintain and monitor the transfer process.'' The entry states the upload as
    completed fact with no hedge, the same hedge-dropping pattern iteration 3 fixed for AdaptixC2 in this entry.'
