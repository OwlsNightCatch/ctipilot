    text: "Adds references to the earlier entry that shares this CVE and to the ShieldBreak entry on the alleged bypass of this fix, and a source rating. The Triage line described a scan race and an engine process lineage that neither source gives and is removed, and the second evidence quote is replaced with Microsoft's own description of the flaw. The summary and analysis record NCSC-CH's note of the ShieldBreak bypass (CVE-2026-69414), the engine and product details are cited to Microsoft, the estate examples are marked as the entry's own reading, a tracking action that called the flaw fixed is dropped, and the priority moves from notable to routine for a local flaw whose engine fix installs automatically. The action's engine floor rises to 1.1.26080.3, the build Microsoft lists as fixing the ShieldBreak bypass, and the auto-update cadence follows Microsoft's wording. The disclosure and public-PoC date is 2026-06-09, Patch Tuesday."
