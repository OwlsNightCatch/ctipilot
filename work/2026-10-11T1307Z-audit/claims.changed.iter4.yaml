    surface: "summary"
    kind: frontmatter
    text: "NCSC-CH's advisory of 2026-05-08 lists six CVEs in the SEPPmail Secure E-Mail Gateway: unauthenticated code execution through Perl eval() (CVE-2026-44128, CVSS 9.3, fixed in 15.0.2.1), insecure deserialization (fixed in 15.0.3) and four flaws fixed in 15.0.4, the release that removed development test endpoints left active in the beta GINA v2 interface. InfoGuard's write-up adds the LFT path traversal CVE-2026-2743 (10.0 per The Hacker News). No exploitation is reported."
