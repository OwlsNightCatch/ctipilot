    surface: "record 2026-10-11T14:28:08Z"
    kind: record-summary
    text: "The six GINA v2 flaws were not all fixed in '15.0.4 (patch 15.0.4.1)': CVE-2026-44128 was fixed in 15.0.2.1 and CVE-2026-44126 in 15.0.3, the rest in 15.0.4, and 15.0.4.1 is an unrelated hotfix. SEPPmail is based in Neuenhof, not Steinach, and the customer claims had no source. Four CVEs were mistyped as code execution. CVE-2026-2743 was already fixed in March, not new in May; the vendor and InfoGuard disagree on its fix version; and InfoGuard found it rather than performing an earlier review. The entry is rewritten with per-CVE types and fix versions, a contradiction line, a current-release action, a rating and an ATT&CK mapping. A Detection line follows InfoGuard's CVE-2026-2743 chain, the contradiction line adds the 15.0.3 or 15.0.4 split for CVE-2026-44126, and the 10.0 score for CVE-2026-2743 is cited to The Hacker News. The Detection line places the traversal in the request body InfoGuard shows, and the CVE-2026-44126 record states both fixed-version readings."
