  - claim_id: a1501bf132
    entry: 2026-05-18/cve-2026-42897-exchange-owa-em-service-auto-mitigation-depen
    surface: "summary"
    kind: frontmatter
    text: "CVE-2026-42897, an exploited cross-site scripting flaw in Outlook Web Access on Exchange 2016, 2019 and Subscription Edition, is fixed in the June 2026 Security Update, and Microsoft recommends the July 2026 update. Proofpoint saw TA488 (Void Blizzard, LAUNDRY BEAR) exploit it from 2026-07-22 with OWAReaper, whose Owner grant to the Default alias on every mail folder survives password resets and re-imaging and needs deliberate removal from the server."
  - claim_id: 2f88ad0a7c
    entry: 2026-05-18/cve-2026-42897-exchange-owa-em-service-auto-mitigation-depen
    surface: "record 2026-10-11T14:36:06Z"
    kind: record-summary
    text: "The title, summary, immediate action and first action named the wrong mitigation host (the EM service needs officeclient.microsoft.com), attributed the connectivity requirement to a blog note that only added a known issue, gave an undocumented verification cmdlet on the Edge Transport role where the EM service is not installed, and still said no fix existed. The fix first shipped in the June 2026 Security Update; Microsoft recommends the July update. The main analysis is rewritten to the current state with the EM-service mechanics from Microsoft Learn; the July section is corrected in place (June fix, the joint Proofpoint and NSA release instead of an uncited 16-nation advisory, no workflow vocabulary); an evidence quote is re-attributed to MSRC and one no longer on any cited page is removed; the mitigation-era immediate action and action are removed; priority moves from critical to high now that a fix has existed since June. The flaw is described as cross-site scripting, as Microsoft and Proofpoint describe it, not as stored XSS, and the 2026-07-31 takeaway now dates the fix to June. Exchange Online's exemption is cited to Microsoft's May blog, the 2026-07-31 section calls TA488 Russia-aligned as Proofpoint does, and event_date is the May advisory's date. The 2026-08-30 section is restated in plain language without rating codes. The title, headline and summary no longer say the mitigation must be removed by hand or that the foothold outlives patching: Microsoft says the update does not remove the mitigation, and Proofpoint says the mailbox grant needs deliberate removal."
