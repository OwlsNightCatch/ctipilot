    entry: 2026-09-17/mandiant-ai-risk-resilience-report-2026
    surface: "summary"
    kind: frontmatter
    text: "Mandiant's 2026 AI Risk and Resilience report, the follow-up to its 2025 edition, synthesizes eight 2026 case studies of AI-related attacks, failures and assessments: an AI coding assistant recommending a poisoned dependency in a hijacked session, which led to the self-propagating Shai-Hulud worm across roughly 100 repositories; a stolen CI/CD credential turned into a live, in-session AI co-debugging offensive hub; tampered AI-assistant CLI hooks used for native remote code execution; malware that rewrites its own command strings at runtime using embedded AI inference to evade EDR signatures; a prompt-injection \"Confused Deputy\" that exfiltrated internal repositories through an allowlisted external domain; a runaway agent reasoning loop that generated a $50,000 cloud-billing spike; a customer-service RAG agent Mandiant assessed as open to leaking cross-tenant PII through indirect prompt injection in forum comments; and a DARK CASTLE (ex-UNC2814) espionage campaign against telecoms and government bodies caught when an agentic SOC triage pipeline escalated a single low-severity command execution a human analyst would routinely have deprioritized."
