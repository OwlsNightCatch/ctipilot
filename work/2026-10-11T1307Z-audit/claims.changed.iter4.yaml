    text: "The entry tied the Pwn2Own chain to CVE-2026-42897 in its title and CVE record and tagged it exploited, KEV-listed and unpatched, although the chain is a separate set of then-undisclosed bugs. No source says the chain was unauthenticated, the ZDI quotation was a paraphrase, and the body narrated fetch failures and internal section references. The entry is rewritten around the contest result with ZDI's exact wording, the CVE record and generic action removed, references to the CVE-2026-42897 entry and the Pwn2Own roundup, a rating and the initial-access mapping. The separation from CVE-2026-42897 and the contest's disclosure terms now carry citations, and the priority moves from notable to routine, since the result leaves nothing to apply beyond keeping Exchange current. One of the chain's bugs, CVE-2026-62911, was fixed in the August 2026 Exchange update and has public exploit code, so the takeaway now points at that update and the entry links the CVE-2026-62911 entry; the rating follows the B-rated contest reporting."
