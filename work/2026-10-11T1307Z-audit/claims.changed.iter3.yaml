    text: "**Patch every Oracle PeopleSoft instance to a supported PeopleTools release or disable/remove PSEMHUB now (CVE-2026-35273); a WAF rule alone no longer stops this.** UNC6240 (ShinyHunters) bypasses literal-string `/PSEMHUB/` WAF blocks with the URL-encoded `/%50SEMHUB/` path, so a perimeter block that has not been reconfigured to match on the normalized path is not a control. Treat any instance that was internet-reachable and unpatched at any point since 27 May 2026 as compromised until proven clean, and rotate every credential reachable from the PeopleSoft tier."
