    text: "The vulnerability classes were wrong for six of the seven CVEs: none is an SSRF, a policy bypass or a data-integrity flaw, and none is a reflected XSS. GLPI's release notes give three stored XSS flaws, file and item deletion, file access and a form-structure export. CERT-FR's advisory is dated 2026-05-07, not 2026-04-29, which is the vendor release date. The GLPI release notes become the primary sources, each CVE gets its own class, branch and severity, an unsourced deployment claim is removed, and the priority moves to routine. GLPI's per-CVE advisories do carry CVSS 4.0 scores, from 5.1 to 8.4, which replace the statement that none were published; the takeaway scopes the stored XSS risk to the privileged accounts the advisories require. All seven per-CVE advisories are cited for the scores."
  - claim_id: 09b88d6cc1
