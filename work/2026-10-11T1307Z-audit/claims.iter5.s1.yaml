  entry: 2026-09-19/cve-2026-81642-cve-2026-82717-unbound-dnssec-rce
  surface: body
  kind: derived
  text: '**Triage:** ordinary DNSSEC validation failures (a misconfigured zone, an expired signature) produce a `SERVFAIL` response and a logged validation error, not a resolver crash; an `unbound` worker
    process terminating or restarting during or immediately after resolving a specific external zone is the discriminator that separates this from routine DNSSEC validation noise.'
