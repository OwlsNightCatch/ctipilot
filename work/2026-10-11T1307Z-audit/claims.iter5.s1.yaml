  kind: frontmatter
  text: On WSUS-gated, air-gapped, offline or OT-adjacent Windows estates where Defender engine updates are deferred or pinned, verify the installed Malware Protection Engine build is ≥ 1.1.26080.3, which
    also closes the ShieldBreak bypass (CVE-2026-69414) of this fix, rather than assuming auto-update reached it.
