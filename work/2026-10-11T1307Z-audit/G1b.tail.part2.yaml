coverage_gaps:
  - { source_id: chrome-releases, reason: "recipe change: the record's note says no working command found for desktop stable posts. Working: `python3 tools/fetch_source.py feed \"https://chromereleases.googleblog.com/feeds/posts/default/-/Stable%20updates?alt=rss&max-results=20\" 30` (direct, returns Desktop, Android, iOS and ChromeOS posts with dates), then `extract` per post. The plain /feeds/posts/default, /atom.xml and /rss.xml URLs answer 302 and fail." }
  - { source_id: hpe-networking-psirt, reason: "recipe change: listing URL located. `python3 tools/fetch_source.py url --direct https://csaf.arubanetworking.hpe.com/2026/` returns an nginx autoindex with file modification times; filter .txt entries by date, then `url --direct https://csaf.arubanetworking.hpe.com/2026/hpe_networking_-_hpesbnw<NNNNN>.txt` (signed advisory text; older Aruba-era files are named hpe_aruba_networking_-_hpesbnw<NNNNN>.txt; matching .json CSAF files exist). `extract` works only on the .txt and returns the raw signed text. Hard line breaks in the text mean multi-line quotes do not verify. Three advisories since 2026-09-25: hpesbnw05150 (2026-09-29), 05156 and 05158 (2026-10-06)." }
  - { source_id: cisco-psirt, reason: "recipe notes: (1) the advisory page extract omits CVE ids; the CSAF is at /security/center/content/CiscoSecurityAdvisory/<id>/csaf/<id>.json (the /contentxml/ path guess returns an HTML 404 page) via `url --direct`, with CVE, CVSS vector, workaround and 'Exploitation and Public Announcements' notes; (2) the feed carries 'Security Hardening Release' advisories (cisco-sa-hardening-*) that group internally found flaws by CWE with CVSS up to 10.0 and are easy to skip (NX-OS, APIC and License On-Prem ones of 2026-10-07 hold 9.8 and 10.0 CVEs; the same applies to NCSC-CH advisory 13044); (3) the per-product fixed-release tables are dynamic and absent from extract." }
  - { source_id: checkpoint-support, reason: "no listing recipe: the SK pages return a Next.js shell via extract (direct-raw); `url https://support.checkpoint.com/results/sk/<id>` returns the shell whose `__NEXT_DATA__` JSON (props.pageProps.data: title, symptoms HTML, solution HTML, dateCreated, lastModified, versions) holds the full advisory. There is no feed or index to enumerate new SK advisories in a window; coverage came only from the store's known ids (sk1000171, sk185222) and a WebSearch that found nothing newer than 2026-09-22. The 504 outage noted 2026-10-07 did not recur." }
  - { source_id: mozilla-mfsa, reason: "`extract` of a single advisory page returns CVE ids but drops the Impact ratings and titles; `WebFetch` of the advisory URL returns the per-CVE impact table (used here). The index page via WebFetch lists title and date only." }
  - { source_id: watchguard-psirt, reason: "recipe confirmed and extended: `extract https://psirt.watchguard.com/` lists every advisory with severity, summary and affected/fixed ranges but no dates; `extract https://psirt.watchguard.com/<CVE-ID>/` returns the page with `date:` metadata, Summary, Product status, Exploitation Status and Solution sections (used for dating the 2026-09-28 to 2026-10-01 batch). The `cvss` shown in the listing is the CVSS 4.0 value for most rows." }
  - { source_id: msrc-update-guide, reason: "`msrc recent N` returned the 200 newest records, all in the 2026-Oct release (initial 2026-10-02, titled 'October 2026 Early Security Updates', revised to 2026-10-11); `msrc cvrf 2026-Oct` (950 KB JSON) holds 312 vulnerabilities including third-party Linux kernel, CUPS and Apache records; exploitation status is in Threats Type 1 text ('Publicly Disclosed:No;Exploited:No;Latest Software Release:<exploitability>') and customer action in the Notes entry titled 'Customer Action Required'. Patch Tuesday of October is 2026-10-13." }
  - { source_id: msrc-blog, reason: "no recipe works for in-window posts: the listing is a SPA shell and no MSRC blog post surfaced through `msft-secblog recent` (Microsoft security blog, not MSRC) or WebSearch; no out-of-band Exchange or SharePoint advisory was found. Not logged as a transport failure." }
  - { source_id: ibm-support-security-bulletins, reason: "the record has no listing; in-window IBM bulletins are findable only by WebSearch. `url https://ibm.com/support/pages/node/<id>` returns the full bulletin (HTML, strip tags); found 7291628 (2026-10-07 Verify Access, CVSS 9.8). The record's example URL is the 2026-09-14 IBM MQ bulletin." }
  - { source_id: adobe-psirt, reason: "the chimera-api JSON `modifiedDate` was bulk-touched on 2026-09-30 for every card; use `cardDate`/`createdDate` for the publication date. Newest bulletin by cardDate is 2026-09-22, so there was no new Adobe bulletin in the window." }
  - { source_id: wordfence, reason: "the weekly vulnerability report's per-vulnerability table (affected software, installs) is dropped by `extract` (only CVSS rating, patch status and publication date survive), so the weekly reports cannot be triaged for widely installed components; use the Wordfence Intelligence database or WebFetch if per-plugin detail is needed." }
  - { source_id: sonicwall-psirt, reason: "`extract https://psirt.global.sonicwall.com/vuln-list` was served by the jina reader (metered credit) and returned the listing with advisory ids, CVEs and dates; the record already pins fetch_method jina, so no change needed." }
  - { source_id: ncsc-csh, reason: "audit cross-check worth institutionalising (not in this slice): `python3 tools/fetch_source.py ncsc-csh recent 100` returns JSON under the key `posts` (not `items`); of the 12 NCSC-CH advisories published 2026-09-26 to 2026-10-09, four were missing from the store at 2026-10-11 (Cisco Nexus/License On-Prem 13044, Veeam 13043, ILIAS 13035, WatchGuard AP 13007) and are returned here." }
  - { source_id: docu.ilias.de, reason: "off-slice: ILIAS security blog advisories (NCSC-CH 13035 links ilias.php ... blpg=951 and docu.ilias.de/go/blog/...) return a captcha or an ilCtrl 404 to extract, url and the reader; the vendor primary for the ILIAS October release is unreadable, so the item rests on NCSC-CH alone." }

