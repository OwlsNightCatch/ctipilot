  # 8. Swiss-communes e-mail posture study (hardening measurement, borderline)
  # ---------------------------------------------------------------------------------------------
  - title: "Peer-reviewed measurement of 2,109 Swiss communes' mail domains: SPF nearly universal, but only 13.4% enforce DMARC and about 52% run on Microsoft 365"
    novelty: new
    borderline: true
    borderline_reason: "Constituency-specific hardening data (Swiss communal administrations) rather than a threat; no incident, no exploitation. Clears PD-11(a) only weakly: the decision it informs is enforcing DMARC on communal domains in the face of the tax-authority phishing the press describes as 'almost daily'. Return for the main agent's call; drop if the brief stays threat-only."
    source_record: "swisscybersecurity-net (2026-10-06); also inside-it-ch (2026-10-05/07) and ictjournal-ch (2026-10-07)"
    sources:
      - { url: "https://papers.mxmap-project.org/secassure2026.pdf", publisher: "Bischof, Huser, Ochsner, Petrlic, Portmann (Univ. Fribourg, HSLU, TH Ingolstadt, TH Nürnberg), ESORICS 2026 workshop accepted manuscript", date: "2026-10-06", role: "primary" }
      - { url: "https://www.swisscybersecurity.net/news/2026-10-06/bei-schweizer-gemeinden-hapert-es-am-schutz-vor-e-mail-spoofing", publisher: "SwissCybersecurity.net", date: "2026-10-06", role: "corroborating" }
      - { url: "https://www.inside-it.ch/schweizer-gemeinden-gut-geschuetzt-vor-e-mail-betrug-20261005", publisher: "Inside IT", date: "2026-10-05", role: "corroborating" }
    discovery_trace: "first seen at: swisscybersecurity-net listing (WebFetch https://www.swisscybersecurity.net/news?page=1, item 'Bei Schweizer Gemeinden hapert es am Schutz vor E-Mail-Spoofing') → extract https://www.swisscybersecurity.net/news/2026-10-06/bei-schweizer-gemeinden-hapert-es-am-schutz-vor-e-mail-spoofing → primary PDF https://papers.mxmap-project.org/secassure2026.pdf (fetch_source.py pdf) → inside-it https://www.inside-it.ch/schweizer-gemeinden-gut-geschuetzt-vor-e-mail-betrug-20261005 (note: inside-it misreads '2110 communes analysed' as '2110 on Microsoft 365')"
    summary: |
      A study by researchers at the University of Fribourg, the Lucerne University of Applied Sciences and Arts and two German universities of applied sciences measured e-mail provider and authentication posture of 15,306 municipal domains in Germany, Austria and Switzerland (DNS data of April 2026). For Switzerland (n = 2,109): SPF is present on 99.2% of communes with 79.9% well configured, DMARC is published by 55.5% but with an enforcement policy by only 13.4% (Germany 16.9%, Austria 3.3%), and DANE reaches 7.3% (a few cantons far higher, driven by shared providers). Microsoft 365 serves about 52% of the 2,110 communes in the provider analysis and US clouds about 53% in total; the paper finds, pooled across the three countries, that only 17% of Microsoft-365 communes publishing DMARC reach a reject policy and that domestic providers reach about twice the strict-DMARC coverage of US clouds (17.1% vs 7.9%), while 74% of Swiss Microsoft-365 communes publish a strict (-all) SPF record authorising Microsoft; the swisscybersecurity report puts the share of Swiss Microsoft-365 communes without a strict DMARC rule at 87%. The result: most Swiss communal domains can still be spoofed in front of recipients that honour DMARC enforcement, in a period in which spoofed tax-authority mails are a standing phishing theme. Trade-press discrepancy: inside-it states '2110 communes run on Microsoft 365', which is the sample size, not the M365 count.
    region_nexus: "switzerland (communal level), also DE/AT"
    primary_sector_nexus: "direct (Swiss communal administrations)"
    sector: "public-sector"
    cves: []
    techniques: [T1566]
    technique_note: "T1566 (phishing) only as the abuse case of spoofable sender domains; the study measures configuration, it does not report an attack"
    affected_products: ["Microsoft 365"]
    entity_keys: []
    verification: MULTI-SOURCE
    confidence: HIGH
    classification_hint: { reliability: B, credibility: 2 }
    evidence:
      - quote: "Zwar haben knapp 56 Prozent der Schweizer Gemeinden DMARC eingerichtet, doch nur gut 13 Prozent verlangen die strengste Konsequenz und lassen solche Nachrichten abweisen."
        attribution: "SwissCybersecurity.net"
        source_url: "https://www.swisscybersecurity.net/news/2026-10-06/bei-schweizer-gemeinden-hapert-es-am-schutz-vor-e-mail-spoofing"
      - quote: "Auch bei Microsoft 365 bleibt diese Lücke gross: 87 Prozent der Schweizer Gemeinden, die den Dienst nutzen, haben keine strikte DMARC-Regel aktiviert."
        attribution: "SwissCybersecurity.net"
        source_url: "https://www.swisscybersecurity.net/news/2026-10-06/bei-schweizer-gemeinden-hapert-es-am-schutz-vor-e-mail-spoofing"
    extended_notes: |
      Exposure/detection angle only if the main agent keeps it: a commune's own DMARC policy is readable from its _dmarc DNS TXT record (study method: DNS fingerprinting); inbound telemetry for spoofing of communal domains is the DMARC aggregate (rua) reports the domain owner receives once a policy is published.

