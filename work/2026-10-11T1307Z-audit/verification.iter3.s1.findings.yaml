- code: F13
  category: analytical-link-as-fact
  entry: entries/2026-06-03/ncsc-switzerland-warns-of-cyber-operations-around-the-g7-via.md
  where: body Defender takeaway; Correction 2026-10-11T14:02:54Z; record summary
  summary: 'The iteration-2 rewrite attributes to the NCSC warning a preparation list it never asked for. Takeaway: "the warning''s lasting lesson is the preparation it asked for ahead of a large international
    event hosted nearby: DDoS mitigation playbooks staged in advance, MFA reviewed on customer-facing identity providers, administrative credentials rotated before the event window, and travelling staff
    briefed on mobile-device physical security." The correction section adds "the pre-event preparations this warning recommended have lapsed" and the record says "the preparation it asked for".'
  ground_truth: 'NCSC''s two-page measures PDF (linked from the cited page) asks for: 2FA/passkey on remote access, prompt patching (24 h for exposed criticals), offline backups, security.txt, business-continuity
    upkeep, an anti-DDoS solution, EDR/XDR, restricting access to exposed systems, log review. It says to apply them "at all times - regardless of the current threat level". No credential rotation, no MFA
    review of customer-facing identity providers, no mobile-device staff briefing, no DDoS playbook. Rotation before 1 June, customer-facing-IdP MFA review (transport/hospitality operators) and the mobile/travel
    advice are ZENDATA''s recommendations to hotels, venues, transport and executives.'
  ground_truth_url: https://www.bacs.admin.ch/dam/en/sd-web/-wzJ1QS9mdil/massnahmen-grossanlaesse_internat-veranstaltungen-en.pdf
  fix: 'Attribute the list to the analyst/ZENDATA (or restate as what the NCSC measures document asks: remote-access 2FA, patching, offline backups, anti-DDoS), and do not say the NCSC''s recommendations
    "lapsed" with the event, since NCSC applies them at all times.'
