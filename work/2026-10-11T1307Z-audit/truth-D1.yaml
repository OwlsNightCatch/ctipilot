    claim: >-
      Mitigation M2, which rewrites the specific request format the in-the-wild exploit uses to deliver the XSS payload
    ground_truth: >-
      Microsoft Learn: M2 is an IIS URL Rewrite outbound rule ("EEMS M2.1 OWA CSP - outbound") with an "OWA SPA HTML shell" precondition; the MSRC FAQ states Internet Explorer / Edge IE mode are not protected because they do not support Content Security Policy. It is a CSP response rewrite, not an inbound request-format filter.
    ground_truth_url: >-
      https://learn.microsoft.com/en-us/exchange/plan-and-deploy/post-installation-tasks/security-best-practices/exchange-emergency-mitigation-service
    fix: Describe M2.1 as a CSP outbound-rule mitigation that does not cover IE / IE-mode clients.
  - code: F4
    where: body "EEMS — what it does" (a)-(d)
    claim: >-
      `Set-Server -MitigationsEnabled $false`, or via Group Policy ... (d) Exchange servers that have been hardened with custom IIS rewrite rules that conflict with the EEMS rule placement ... on Exchange 2016 SP1 ... Exchange Server 2013
    ground_truth: >-
      Learn: the parameters are Set-OrganizationConfig -MitigationsEnabled and Set-ExchangeServer -MitigationsEnabled (Set-Server is not a cmdlet); no Group Policy control, no custom-rewrite-conflict case and no Exchange 2013 mention appears; Learn gives the September 2021 CU as the EM service baseline.
    ground_truth_url: >-
      https://learn.microsoft.com/en-us/exchange/plan-and-deploy/post-installation-tasks/security-best-practices/exchange-emergency-mitigation-service
    fix: Use the documented cmdlets; delete (c) Group Policy and (d).
  - code: F4
    where: body "EEMS verification" and "Hunt and detection"
    claim: >-
      `Get-ExchangeDiagnosticInfo ... -Component EemsMitigation`; `Get-Server <server> | Select-Object MitigationsEnabled`; Exchange Application Event Log EID 4 (`MSExchange Management`); look back to 2026-05-09
    ground_truth: >-
      Not documented by any cited source; Learn documents Get-ExchangeServer ... MitigationsApplied and events 1005/1006/1008 (source "MSExchange Mitigation Service"); the look-back date has no source.
    ground_truth_url: >-
      https://learn.microsoft.com/en-us/exchange/plan-and-deploy/post-installation-tasks/security-best-practices/exchange-emergency-mitigation-service
    fix: Replace with the documented checks.
  - code: F4
    where: body "Attack chain" 1.
    claim: '[T1566.001] Phishing: Spearphishing Attachment — attacker delivers a specifically crafted email'
    ground_truth: >-
      Mechanism is script in the HTML body of the message rendered by OWA; Proofpoint observed "no suspicious URLs or attachments present". Attachment is wrong (T1566 parent / T1203 fit); steps 2-5 are labelled "operationally credible" speculation, superseded by Proofpoint's observed chain (OWAReaper: autofill credential theft, add-in OAuth token theft, Default-alias Owner permission, GitHub/DNS C2).
    ground_truth_url: >-
      https://www.proofpoint.com/us/blog/threat-insight/cleaning-out-inboxes-ta488-comes-outlook-another-half-click-exploit
    fix: Replace with the observed chain from the survivor; drop T1566.001.
  - code: F4
    where: body "Exploitation status and attribution"
    claim: No named threat-actor attribution has been published
    ground_truth: >-
      Superseded: Proofpoint (2026-07-28/29) attributes a campaign from 2026-07-22 exploiting CVE-2026-42897 to TA488 (aka Void Blizzard / Laundry Bear), delivering the OWAReaper implant.
    ground_truth_url: >-
      https://www.proofpoint.com/us/blog/threat-insight/cleaning-out-inboxes-ta488-comes-outlook-another-half-click-exploit
    fix: State the TA488 attribution via the survivor.
  - code: F13
    where: body "Vulnerability mechanics"
    claim: >-
      consistent with `Exploitation Detected` status, the team is withholding payload format pending the permanent SU — but the MSRC FAQ confirms the chain shape: crafted email → OWA render → script execution → spoofing actions taken under the victim's authenticated OWA context
    ground_truth: >-
      MSRC FAQ says only that opening the email in OWA with certain interaction conditions lets arbitrary JavaScript execute in the browser context; it states no motive for withholding detail and no "spoofing actions under the victim's authenticated context" chain.
    ground_truth_url: >-
      https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-42897 (read as per-CVE JSON via tools/fetch_source.py msrc cve CVE-2026-42897 and the rendered page)
    fix: Delete the motive and the chain sentence.
  - code: F14
    where: body "Background" / "Hardening"
    claim: >-
      CVE-2026-42897 is the first 2026 case where EEMS ... is the line of defence; repeated EEMS-only mitigations across the 2021–2026 Exchange CVE history
    ground_truth: >-
      The Learn mitigation table lists only M1 (CVE-2022-41040, 2022) and M2 (CVE-2026-42897); no source supports "first 2026 case" or "repeated EEMS-only mitigations across 2021-2026".
    ground_truth_url: >-
      https://learn.microsoft.com/en-us/exchange/plan-and-deploy/post-installation-tasks/security-best-practices/exchange-emergency-mitigation-service
    fix: Delete both quantifiers.
  - code: F11
    where: summary | body
    claim: >-
      summary: "Background. On-premises Microsoft Exchange has been a sustained, high-value target..." ; per PD-13 in this brief series
    ground_truth: >-
      Summary is the first sentence of the background, not a summary; workflow-internal "PD-13 ... this brief series"; no techniques[] and no classification although T-ids appear in prose.
    ground_truth_url: >-
      https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-42897 (read as per-CVE JSON via tools/fetch_source.py msrc cve CVE-2026-42897 and the rendered page)
    fix: Fold; nothing carries over.
