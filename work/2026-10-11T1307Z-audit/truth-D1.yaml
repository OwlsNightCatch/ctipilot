- entry: entries/2026-05-12/palo-alto-pan-os-cve-2026-0300-first-wave-fixed-builds-now-s.md
  verdict: factual-error
  defects:
  - code: F4
    where: title | headline | summary | body ¶1-2 (main analysis) vs section 2026-05-13T05:00:13Z
    claim: >-
      first-wave fixed builds now scheduled for 2026-05-13; until then interim mitigation remains the only option ... no patched build is yet shipped
    ground_truth: >-
      Superseded by the entry's own 2026-05-13 section and by the live advisory: every supported branch now has a fixed build (PAN-OS 12.1: 12.1.4-h5, 12.1.7; 11.2: 11.2.4-h17, 11.2.7-h13, 11.2.10-h6, 11.2.12; 11.1: 11.1.4-h33, 11.1.6-h32, 11.1.7-h6, 11.1.10-h25, 11.1.13-h5, 11.1.15; 10.2: 10.2.7-h34, 10.2.10-h36, 10.2.13-h21, 10.2.16-h7, 10.2.18-h6); the PSIRT timeline shows revisions on 05-13, 05-14, 05-16 and 05-28. Title, headline, summary and body ¶1-2 still assert "no patched build is yet shipped" (4c(h) supersession; the entry contradicts itself).
    ground_truth_url: https://security.paloaltonetworks.com/CVE-2026-0300
    fix: >-
      Rewrite title/headline/summary/main analysis to the current state (fixed builds per branch, mitigation still valid for unpatched devices); keep the 05-13 section as history.
  - code: F8
    where: body (missing Exposure discriminator)
    claim: >-
      unauthenticated root RCE in the User-ID Authentication Portal / Captive Portal service ... PA-Series and VM-Series operators with User-ID Authentication Portal or Captive Portal exposed
    ground_truth: >-
      PSIRT "Required Configuration for Exposure": customers are impacted only if BOTH (1) User-ID Authentication Portal is configured (Device > User Identification > Authentication Portal Settings > Enable Authentication Portal) AND (2) an interface management profile with response pages enabled is attached to an L3 interface in a zone where untrusted/internet traffic can ingress. Severity: CVSS-B/BT 9.3 (CVSS 4.0) when reachable from untrusted networks; 8.7 when restricted to trusted internal IPs. Prisma Access, Cloud NGFW and Panorama are not affected.
    ground_truth_url: https://security.paloaltonetworks.com/CVE-2026-0300
    fix: >-
      Add an **Exposure:** line with the two-condition test and the 9.3 vs 8.7 distinction; label the score as CVSS 4.0.
  - code: F8
    where: body (missing Detection from Unit 42)
    claim: no Detection line
    ground_truth: >-
      Unit 42 describes observable behavior: unsuccessful exploitation attempts from 2026-04-09, RCE a week later with shellcode injected into an nginx worker process, log/crash-record/core-dump deletion, tunnelling tools (EarthWorm, ReverseSocks5) deployed with root privileges, AD enumeration with the firewall service account credentials, ptrace-injection evidence and a SUID binary deleted, and on 2026-04-29 a SAML flood that promoted the HA peer which was then also compromised.
    ground_truth_url: https://unit42.paloaltonetworks.com/captive-portal-zero-day/
    fix: >-
      Carry a Detection line (telemetry class first: nginx worker crashes/crash-record gaps, outbound tunnelling from the firewall, firewall service-account AD queries, HA failover correlated with SAML floods) and note the post-patch compromise check (patching does not evict).
  - code: F4
    where: body ¶1
    claim: the ~2026-04-09 first-observed-exploitation date come from Unit 42
    ground_truth: >-
      Unit 42: "Starting April 9, 2026, there were unsuccessful exploitation attempts against a PAN-OS device. A week later, the attackers successfully achieved RCE". April 9 is the first (failed) attempt, not first successful exploitation.
    ground_truth_url: https://unit42.paloaltonetworks.com/captive-portal-zero-day/
    fix: '"first (unsuccessful) exploitation attempts from ~2026-04-09; first successful RCE a week later".'
  - code: F14
    where: summary
    claim: the unauthenticated root RCE that exploitation clusters have been actively abusing
    ground_truth: >-
      PSIRT: "Limited exploitation has been observed"; Unit 42: "only limited exploitation" and a single cluster (CL-STA-1132). No source reports multiple clusters.
    ground_truth_url: https://unit42.paloaltonetworks.com/captive-portal-zero-day/
    fix: '"that Unit 42 ties to one likely state-sponsored cluster (CL-STA-1132); exploitation is limited".'
  - code: F11
    where: body ¶2 and section 2026-05-13
    claim: >-
      per PD-13 does not drive Swiss/EU action framing on its own ... per the audience-applicability rule in the daily prompt
    ground_truth: >-
      Workflow-internal language (PD number, "daily prompt") in reader-facing text; also uses the KEV deadline as framing.
    ground_truth_url: >-
      https://www.cisa.gov/known-exploited-vulnerabilities-catalog (catalogVersion 2026.10.08, read via tools/fetch_source.py cisa-kev)
    fix: Delete both clauses; state only that CISA KEV lists the CVE (added 2026-05-06, due 2026-05-09).
  - code: F11
    where: evidence[] / sourcing_note / techniques / affected_products
    claim: >-
      publisher: ctipilot v2 brief (migrated); sourcing_note: migration: evidence backfilled ...; techniques: []; affected_products: []
    ground_truth: >-
      Evidence quotes are the pipeline quoting itself, not the cited pages; vulnerability entry with empty techniques[] and affected_products[]. Unit 42 supports T1190, T1055 (shellcode injected into an nginx worker), T1090/T1572 (EarthWorm, ReverseSocks5), T1070 (log and artefact deletion). Affected product: PAN-OS on PA-Series and VM-Series.
    ground_truth_url: https://unit42.paloaltonetworks.com/captive-portal-zero-day/
    fix: >-
      Replace evidence with verbatim PSIRT/Unit 42 passages, drop migration jargon, populate techniques[] (active ids only) and affected_products[].
  - code: F17
    where: classification
    claim: 'classification: null'
    ground_truth: >-
      Every entry must carry classification {reliability, credibility}. Sourcing: vendor PSIRT (owning party) + Unit 42 + independent CISA KEV listing.
    ground_truth_url: https://security.paloaltonetworks.com/CVE-2026-0300
    fix: >-
      classification: {reliability: A, credibility: 1} (vendor advisory with independent CISA KEV corroboration of exploitation).
  - code: F18
    where: actions[0]
    claim: >-
      Apply PAN-OS 12.1.4-h5 / 12.1.7 / 11.2 / 11.1 / 10.2 hot-fix branches on every PA-Series and VM-Series instance running User-ID Captive Portal.
    ground_truth: >-
      Not executable without re-reading: no fixed versions for 11.2/11.1/10.2 are named. The advisory table gives them per branch (see current state). The action also says "released 2026-05-13" while 12.1.7, 11.1.15, 11.1.7-h6, 11.2.4-h17, 11.2.12 carried ETA 05/28.
    ground_truth_url: https://security.paloaltonetworks.com/CVE-2026-0300
    fix: >-
      Name the fixed build per branch (or the minimum per train) and scope to devices where both exposure conditions hold; keep Threat ID 510019 (content 9097-10022, needs PAN-OS 11.1+) as the interim control.
  group: D1-a
  role: survivor
