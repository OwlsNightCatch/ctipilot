- entry: entries/2026-05-17/exchange-cve-2026-42897-pwn2own-devcore-three-bug-system-rce.md
  verdict: factual-error
  defects:
  - code: F4
    where: body ¶1 (quotation)
    claim: >-
      ZDI verbatim: *"Orange Tsai (DEVCORE Research Team) earned $200,000 after chaining three bugs to gain remote code execution with SYSTEM privileges on Microsoft Exchange."*
    ground_truth: >-
      ZDI Day Two page reads: "Orange Tsai (@orange_8361) of DEVCORE Research Team chained 3 bugs to achieve Remote Code Execution as SYSTEM on Microsoft Exchange, earning $200,000 and 20 Master of Pwn points." The quoted sentence is a paraphrase close to BleepingComputer's wording, not ZDI's.
    ground_truth_url: https://www.zerodayinitiative.com/blog/2026/5/15/pwn2own-berlin-2026-day-two-results
    fix: Quote the ZDI sentence exactly or paraphrase without quotation marks.
  - code: F4
    where: title | summary | body | actions[0]
    claim: >-
      achieve unauthenticated remote code execution at SYSTEM privilege level ... a fresh unauthenticated SYSTEM RCE class ... a direct service-account SYSTEM RCE chain
    ground_truth: >-
      Neither ZDI nor BleepingComputer says "unauthenticated"; both say remote code execution with SYSTEM privileges. MSRC's August 2026 Exchange EoP CVE-2026-62911, credited to Orange Tsai working with ZDI, is scored PR:L (authorized attacker, "capture-replay") with exploited: No.
    ground_truth_url: https://www.zerodayinitiative.com/blog/2026/5/15/pwn2own-berlin-2026-day-two-results
    fix: Delete "unauthenticated" and "service-account".
  - code: F4
    where: cves[CVE-2026-42897] | tags | title
    claim: >-
      cves: CVE-2026-42897 type rce, status exploited/cisa-kev/mitigation-only; tags actively-exploited, cisa-kev, no-patch; title "Exchange CVE-2026-42897 — Pwn2Own DEVCORE three-bug SYSTEM RCE chain emerges alongside active OWA-XSS exploitation"
    ground_truth: >-
      The body itself says "This chain is separate from the actively-exploited CVE-2026-42897". The three Pwn2Own bugs were undisclosed with no CVE at the time; neither ZDI nor BleepingComputer links them to CVE-2026-42897 and nothing reports the chain exploited in the wild. The frontmatter types the XSS CVE as rce and applies exploited/KEV/no-patch tags to an unexploited research chain.
    ground_truth_url: https://www.zerodayinitiative.com/blog/2026/5/15/pwn2own-berlin-2026-day-two-results
    fix: >-
      Remove CVE-2026-42897 from cves[] (declare it in references[] instead), drop actively-exploited/cisa-kev/no-patch tags, retitle without the CVE.
  - code: F11
    where: body ¶2
    claim: >-
      the Microsoft Exchange blog post `addressing-exchange-server-may-2026-vulnerability-cve-2026-42897` linked from the MSRC advisory returns 502 on direct fetch; Reference: § 4 UPDATE on Exchange
    ground_truth: >-
      Fetch-failure narration and an internal section pointer in reader-facing text; the blog reads normally (HTTP 200, last updated 2026-07-14).
    ground_truth_url: >-
      https://techcommunity.microsoft.com/blog/exchange/addressing-exchange-server-may-2026-vulnerability-cve-2026-42897/4518498
    fix: Delete both.
  - code: F18
    where: actions[0]
    claim: >-
      Treat on-premises Microsoft Exchange as severely threatened through August Patch Tuesday 2026. Verify EEMS ... restrict ECP / EWS / OWA reachability from the internet ... accelerate any in-progress Exchange Online migration.
    ground_truth: >-
      Generic hardening that would be equally true without the Pwn2Own news; restates the EEMS check from the sibling entry; no task derived from this finding (the bugs are undisclosed).
    ground_truth_url: https://www.zerodayinitiative.com/blog/2026/5/15/pwn2own-berlin-2026-day-two-results
    fix: Drop the action (empty actions[] is fine).
  - code: F17
    where: classification | techniques
    claim: (classification absent; techniques [])
    ground_truth: >-
      vulnerability entry with no classification and no techniques; sourcing is ZDI (vendor-neutral program, A) + BleepingComputer corroboration.
    ground_truth_url: https://www.zerodayinitiative.com/blog/2026/5/15/pwn2own-berlin-2026-day-two-results
    fix: >-
      classification A/2 or B/2 per the audit's scale; techniques cannot be mapped from undisclosed bugs, so the entry may be better as a short note.
  - code: F7
    where: relevance / overlap
    claim: entry as a whole
    ground_truth: >-
      The DEVCORE chain is already covered by 2026-05-17/pwn2own-berlin-2026-master-of-pwn-outcomes-the-new-ai-agents (same claims) and its patched component is the subject of 2026-08-29/exchange-mrsproxy-auth-bypass-cve-2026-62911-poc. MSRC CVRF 2026-Aug credits Orange Tsai working with ZDI for CVE-2026-62911 (Exchange EoP, CVSS 8.0, released 2026-08-11, exploited: No); that the other two chain bugs were patched is not established.
    ground_truth_url: >-
      https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-62911 (per-CVE JSON and 2026-Aug CVRF acknowledgments)
    fix: Keep as a distinct, linked finding or fold into the CVE-2026-62911 entry; it must not carry CVE-2026-42897.
  group: D1-b
  role: distinct
- entry: entries/2026-05-18/cve-2026-42897-exchange-owa-em-service-auto-mitigation-depen.md
  verdict: factual-error
  defects:
  - code: F4
    where: title | headline | summary | immediate_action | body ¶1 | actions[0]
    claim: EM Service auto-mitigation depends on outbound connectivity to officemitigations.microsoft.com
    ground_truth: >-
      Microsoft Learn (EEMS page): required endpoint is "Office Config Service | officeclient.microsoft.com/* | 443". The host officemitigations.microsoft.com appears in no source read.
    ground_truth_url: >-
      https://learn.microsoft.com/en-us/exchange/plan-and-deploy/post-installation-tasks/security-best-practices/exchange-emergency-mitigation-service
    fix: Replace with officeclient.microsoft.com (port 443) everywhere.
  - code: F3
    where: summary | body ¶1
    claim: >-
      Exchange Team Blog update confirms the EM Service auto-mitigation requires outbound HTTPS connectivity ... (Microsoft Exchange Team Blog, 2026-05-17)
    ground_truth: >-
      The Exchange Team blog's 5/17 revision note is "Added a known issue with OWACalendar.Proxy healthset showing unhelathy"; the blog never states a connectivity requirement or a hostname. The connectivity requirement is documented on the Microsoft Learn EEMS page.
    ground_truth_url: >-
      https://techcommunity.microsoft.com/blog/exchange/addressing-exchange-server-may-2026-vulnerability-cve-2026-42897/4518498
    fix: >-
      Cite the Learn page for the connectivity requirement; the 05-17 blog change was the OWACalendar.Proxy known issue.
  - code: F4
    where: actions[0]
    claim: >-
      Run `Get-ExchangeDiagnosticInfo -Server <server> -Process EdgeTransport -Component EmergencyMitigation` ... confirm `Status: Active` and rule M2.1.x is applied
    ground_truth: >-
      Learn: the EM service is not installed on Edge Transport servers and the documented check is Get-ExchangeServer | Format-List Name,MitigationsApplied (also Get-Mitigations.ps1 and the Health Checker EEMS check); no source documents the quoted cmdlet form or a "Status: Active" output.
    ground_truth_url: >-
      https://learn.microsoft.com/en-us/exchange/plan-and-deploy/post-installation-tasks/security-best-practices/exchange-emergency-mitigation-service
    fix: Use the documented check.
  - code: F4
    where: cves[CVE-2026-42897].affected / fixed | section 2026-07-31 "Patching"
    claim: >-
      all update levels prior to the July 2026 Security Update ... The permanent fix is the July 2026 Security Update
    ground_truth: >-
      The fix first shipped in the June 2026 SU (released 2026-06-09): MSRC revision 2.0 (2026-06-09) "Added links to June 2026 Exchange Server security updates"; June SU blog "The June 2026 SUs address ... CVE-2026-42897" and FAQ "CVE-2026-42897 fix (June 2026 SU)"; Learn EEMS table lists M2 "Highest version applicable: June 2026 SU". Microsoft kept recommending the mitigation through June and from 2026-07-14 recommends the July SU "to be protected from this vulnerability and related CVE-2026-55008" and says mitigations can then be removed.
    ground_truth_url: https://techcommunity.microsoft.com/blog/exchange/released-june-2026-exchange-server-security-updates/4524491
    fix: >-
      affected: Exchange 2016/2019/SE below the June 2026 SU; fixed: June 2026 SU (SE RTM; 2019 CU14/CU15, 2016 CU23 via Period 2 ESU), July 2026 SU recommended and also covers CVE-2026-55008.
  - code: F4
    where: title | headline | summary | immediate_action | actions[0] | priority
    claim: >-
      no permanent patch is available yet ... No permanent patch yet; CISA KEV-listed and actively exploited ... priority critical / immediate_action "Verify Exchange Emergency Mitigation Service health ..."
    ground_truth: >-
      4c(h) supersession: the entry's own cves[].status carries patch-available, actions[1] says "Install the July 2026 Exchange Security Update", and the newest section says the mitigation "is no longer the remediation". The headline fields and actions[0] still describe the May no-patch state; the immediate action is the mitigation-era instruction.
    ground_truth_url: https://techcommunity.microsoft.com/blog/exchange/released-july-2026-exchange-server-security-updates/4534146
    fix: >-
      Rewrite title/headline/summary/immediate_action/actions to the patched-but-mitigation-teardown state; re-evaluate priority.
  - code: F3
    where: evidence[0] and evidence[1]
    claim: >-
      "The Exchange Emergency Mitigation Service will provide mitigation automatically, and is on by default. ..." (publisher Microsoft Exchange Team Blog); "We are working on developing and testing a more permanent fix which we will provide when it meets our quality standards."
    ground_truth: >-
      Neither sentence is on the current Exchange Team blog (it now reads "Microsoft is working on and will release and announce a security update ..."); the first is MSRC FAQ text ("The Exchange Emergency Mitigation Service will provide mitigation automatically, and is on by default.") and the second is not on the current MSRC page, which was revised 05-18 and 07-14. (low confidence on the second: it may have been on an earlier MSRC revision).
    ground_truth_url: >-
      https://techcommunity.microsoft.com/blog/exchange/addressing-exchange-server-may-2026-vulnerability-cve-2026-42897/4518498
    fix: Attribute the first to MSRC; replace the second with a sentence present on the cited page.
  - code: F5
    where: section 2026-07-31T04:09:14Z ¶2 and update summary
    claim: >-
      a 16-nation joint advisory exposed on 2026-07-23 for its Zimbra campaign ... which this pipeline registers as LAUNDRY BEAR
    ground_truth: >-
      The cited Proofpoint page says the actor (TA488, "Void Blizzard, Laundry Bear") was the subject of a "joint release with the NSA" on 2026-07-23 (it links an NSA PDF uploaded under .../2026/Jul/22/); it does not say "16 nations" and the sentence carries no inline citation. "this pipeline registers" is workflow vocabulary (F11). (low confidence: the claim may be sourced in the referenced laundry-bear entry).
    ground_truth_url: >-
      https://www.proofpoint.com/us/blog/threat-insight/cleaning-out-inboxes-ta488-comes-outlook-another-half-click-exploit
    fix: >-
      Cite the advisory source inline or reduce to "a joint Proofpoint/NSA release"; remove "this pipeline registers".
  - code: F11
    where: body ¶1 | section 2026-07-31 ¶1 | evidence
    claim: >-
      UPDATE (originally covered 2026-05-15 / deep-dive 2026-05-16) ... The May entry tracked CVE-2026-42897 ... Today's deep dive
    ground_truth: Legacy v2 framing and self-referential narration in reader-facing text.
    ground_truth_url: https://techcommunity.microsoft.com/blog/exchange/released-july-2026-exchange-server-security-updates/4534146
    fix: Rewrite the main analysis as the current state; keep sections as history.
  - code: F16
    where: priority / immediate_action
    claim: 'priority: critical'
    ground_truth: >-
      (low confidence) A fix has existed since 2026-06-09; Proofpoint documents exploitation of unpatched on-prem servers from 2026-07-22, so a high-priority decision remains (patch to June/July SU, tear down M2.1.0 mitigation, audit Default-alias Owner grants), but the stop-and-act framing of immediate_action is the May mitigation instruction.
    ground_truth_url: >-
      https://www.proofpoint.com/us/blog/threat-insight/cleaning-out-inboxes-ta488-comes-outlook-another-half-click-exploit
    fix: >-
      Keep critical only if the audit judges the July campaign against European government targets still warrants it; otherwise high.
  group: D1-b
  role: survivor
- entry: entries/2026-05-15/cisco-catalyst-sd-wan-cve-2026-20182-authentication-bypass-a.md
  verdict: factual-error
  defects:
  - code: F13
