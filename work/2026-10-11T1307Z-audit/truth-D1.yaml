      CISA KEV added CVE-2026-0300 on 2026-05-06 with due date 2026-05-09; required action cites the same workaround (restrict User-ID Authentication Portal to trusted zones; disable it if not required).
    url: https://www.cisa.gov/known-exploited-vulnerabilities-catalog
- entry: entries/2026-05-09/cve-2026-0300-palo-alto-pan-os-captive-portal-kev-deadline-t.md
  verdict: factual-error
  defects:
  - code: F4
    where: body ¶1
    claim: >-
      the earliest expected maintenance release containing a code fix is **PAN-OS 10.1.14 / 10.2.12 / 11.0.5 / 11.1.4**, expected 2026-05-13
    ground_truth: >-
      The PSIRT product-status/solution tables list fixes only as 12.1.4-h5, 12.1.7; 11.2.4-h17, 11.2.7-h13, 11.2.10-h6, 11.2.12; 11.1.4-h33, 11.1.6-h32, 11.1.7-h6, 11.1.10-h25, 11.1.13-h5, 11.1.15; 10.2.7-h34, 10.2.10-h36, 10.2.13-h21, 10.2.16-h7, 10.2.18-h6. There is no 10.1.14, 10.2.12, 11.0.5 or plain 11.1.4 fix, and 10.1/11.0 are only "older unsupported PAN-OS versions: upgrade to a supported fixed version".
    ground_truth_url: https://security.paloaltonetworks.com/CVE-2026-0300
    fix: Delete the version list.
  - code: F4
    where: body ¶2
    claim: >-
      Threat Prevention signatures 95817/95818/95820 block the known exploitation chain. PA-Series hardware appliances running content update < 8765-9032 are not covered by the signatures.
    ground_truth: >-
      Both the PSIRT and Unit 42 name a single signature: Threat ID 510019 (Applications and Threats content 9097-10022; Unit 42 product-protection note says content version 9098), with decoder support requiring PAN-OS 11.1 or later. No 95817/95818/95820, no "8765-9032" content gate, no hardware-appliance carve-out appears.
    ground_truth_url: https://security.paloaltonetworks.com/CVE-2026-0300
    fix: '"Threat ID 510019 from Applications and Threats content 9097-10022; needs PAN-OS 11.1 or later".'
  - code: F4
    where: body ¶2
    claim: >-
      disable Captive Portal (`Device > User Identification > Captive Portal Settings > uncheck Enable Captive Portal`) or disable GlobalProtect and Captive Portal
    ground_truth: >-
      PSIRT menu path: Device > User Identification > Authentication Portal Settings -> Enable Authentication Portal; no instruction to disable GlobalProtect.
    ground_truth_url: https://security.paloaltonetworks.com/CVE-2026-0300
    fix: Use "Authentication Portal Settings" and drop GlobalProtect.
  - code: F4
    where: body ¶3
    claim: >-
      creating rogue admin accounts via the GlobalProtect daemon (bypassing normal `admin-role` RBAC), exporting full running configurations including pre-shared keys, installing Python-based tunnelling implants under `/tmp/.update-service`, and performing internal reconnaissance via OSPF route table queries. The cluster's dwell time before detection was 4–17 days ... `svc-health-check-[6-digit-numeric]`
    ground_truth: >-
      None of this is in the Unit 42 bulletin. Unit 42 reports: shellcode injected into an nginx worker process; deletion of crash records/core dumps; EarthWorm and ReverseSocks5 tunnelling tools; AD enumeration using the firewall service account; ptrace-injection evidence and SUID binary deleted; SAML flood on 2026-04-29 promoting the second HA device. No rogue admin account naming pattern, OSPF queries, /tmp/.update-service, pre-shared-key export or "4-17 days" dwell time.
    ground_truth_url: https://unit42.paloaltonetworks.com/captive-portal-zero-day/
    fix: Delete the paragraph; the verified tradecraft is in the survivor.
  - code: F3
    where: body ¶3 / sources[0] publisher
    claim: >-
      Palo Alto Unit 42 published a threat bulletin on 2026-05-08; publisher "Palo Alto Security Advisory — CVE-2026-0300 update, 2026-05-08"
    ground_truth: >-
      The bulletin is dated 2026-05-07 (updated 2026-05-08 for product protections only); the PSIRT timeline has no 2026-05-08 revision (05-07 acknowledgments, 05-13 table).
    ground_truth_url: https://unit42.paloaltonetworks.com/captive-portal-zero-day/
    fix: Drop the 05-08 dating.
  - code: F2
    where: sources[1]
    claim: https://www.cisa.gov/known-exploited-vulnerabilities-catalog
    ground_truth: >-
      KEV catalog landing page, a hard-blocked generic URL; the per-CVE KEV facts (added 2026-05-06, due 2026-05-09) are in the catalog JSON.
    ground_truth_url: https://www.cisa.gov/known-exploited-vulnerabilities-catalog
    fix: Cite the PSIRT advisory (already primary) instead.
  - code: F11
    where: summary / cves / evidence / classification
    claim: 'summary: "UPDATE (originally covered 2026-05-07):"; cves: []; evidence: []; verification multi-source'
    ground_truth: Empty summary, empty cves[]/evidence[], no classification, no techniques.
    ground_truth_url: https://security.paloaltonetworks.com/CVE-2026-0300
    fix: Fold; nothing carries over except the KEV dates.
  group: D1-a
  role: duplicate
  duplicate_of: 2026-05-12/palo-alto-pan-os-cve-2026-0300-first-wave-fixed-builds-now-s
  unique_material: []
- entry: entries/2026-05-16/cve-2026-42897-microsoft-exchange-server-2016-2019-se-stored.md
  verdict: factual-error
  defects:
  - code: F4
    where: title | headline | summary | immediate_action | actions[0..1] | tags no-patch | priority
    claim: >-
      actively exploited, no permanent patch ... only EEMS auto-mitigation ... Exchange 2016/2019 permanent fix gated behind Period 2 ESU enrolment
    ground_truth: >-
      Superseded: Microsoft released the fix in the June 2026 Exchange SUs on 2026-06-09 (MSRC revision 2.0 of 2026-06-09: "Added links to June 2026 Exchange Server security updates. Microsoft recommends installing this updates as soon as possible."; June SU blog: "The June 2026 SUs address ... CVE-2026-42897"; Learn EEMS table: M2 highest applicable version "June 2026 SU"). On 2026-07-14 MSRC recommends the July 2026 SU "to be protected from this vulnerability and related CVE-2026-55008" and Microsoft says mitigations can then be removed. Exploitation, KEV and the ESU constraint remain true.
    ground_truth_url: >-
      https://techcommunity.microsoft.com/blog/exchange/released-june-2026-exchange-server-security-updates/4524491 ; https://techcommunity.microsoft.com/blog/exchange/released-july-2026-exchange-server-security-updates/4534146
    fix: Fold into the survivor; do not keep "no permanent patch" anywhere.
  - code: F4
    where: body ¶1
    claim: disclosed by Microsoft on 2026-05-14 alongside the May 2026 Patch Tuesday cycle
    ground_truth: >-
      May 2026 Patch Tuesday was 2026-05-12 (e.g. CVE-2026-41089 released 2026-05-12). CVE-2026-42897 was published 2026-05-14 (MSRC "Released: May 14, 2026"; THN: "Thursday advisory"), outside the Patch Tuesday release.
    ground_truth_url: >-
      https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-42897 (read as per-CVE JSON via tools/fetch_source.py msrc cve CVE-2026-42897 and the rendered page)
    fix: '"disclosed on 2026-05-14, two days after May Patch Tuesday, with only an EEMS mitigation".'
  - code: F4
    where: title | body ¶1
    claim: stored XSS in OWA ... stored / reflected cross-site scripting flaw
    ground_truth: >-
      MSRC, NCSC-CH, NCSC-NL and Microsoft's blog describe an XSS (CWE-79) triggered by opening a crafted email in OWA; none classifies it as stored or reflected. cves[].type is null.
    ground_truth_url: >-
      https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-42897 (read as per-CVE JSON via tools/fetch_source.py msrc cve CVE-2026-42897 and the rendered page)
    fix: Say "cross-site scripting (CWE-79) in OWA triggered by a crafted email"; set type to xss.
  - code: F4
    where: body ¶1
    claim: enabled by default on Exchange 2016 SP1 and later
    ground_truth: >-
      Microsoft Learn: the EM service is installed automatically when the September 2021 CU (or later) is installed on Exchange 2016/2019, on servers with the Mailbox role, not on Edge Transport; the May blog adds that EM service cannot fetch new mitigations on builds older than March 2023.
    ground_truth_url: >-
      https://learn.microsoft.com/en-us/exchange/plan-and-deploy/post-installation-tasks/security-best-practices/exchange-emergency-mitigation-service
    fix: >-
      "installed by the September 2021 CU or later on Mailbox servers; builds older than March 2023 cannot fetch new mitigations".
  - code: F4
    where: body ¶1 (detection)
    claim: >-
      Exchange Application Event Log EID 4 (`MSExchange Management`) for EEMS mitigation-state changes; `Get-ExchangeDiagnosticInfo -Server <name> -Process MSExchangeHMWorker -Component EemsMitigation -SettingName MitigationsApplied`
    ground_truth: >-
      Microsoft Learn: EM service events are 1005/1006 (applied) and 1008 (errors such as OCS unreachable) with source "MSExchange Mitigation Service"; the documented check is Get-ExchangeServer | Format-List Name,MitigationsApplied (or Get-Mitigations.ps1 / Health Checker). No cited source documents the Get-ExchangeDiagnosticInfo form (low confidence that the cmdlet form is invalid; it is unsupported).
    ground_truth_url: >-
      https://learn.microsoft.com/en-us/exchange/plan-and-deploy/post-installation-tasks/security-best-practices/exchange-emergency-mitigation-service
    fix: Use the documented checks and event IDs.
  - code: F14
    where: body ¶1
    claim: Microsoft has confirmed `Exploitation Detected` (the highest of its three exploitation-status tiers)
    ground_truth: >-
      MSRC assessments seen on the May 2026 CVEs include "Exploitation Detected", "More Likely", "Less Likely" and "Unlikely" (CVE-2026-42897, -41103, -41089, -41096), i.e. at least four values; no source says three tiers.
    ground_truth_url: https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-41089 (MSRC per-CVE JSON)
    fix: Delete the parenthetical.
  - code: F4
    where: actions[0]
    claim: Then look back to 2026-05-09 in IIS access logs on the front-end Exchange role
    ground_truth: >-
      No source gives 2026-05-09 as an exploitation start; Proofpoint later reports infrastructure created in March 2026 and a campaign from 2026-07-22. The look-back date is invented.
    ground_truth_url: >-
      https://www.proofpoint.com/us/blog/threat-insight/cleaning-out-inboxes-ta488-comes-outlook-another-half-click-exploit
    fix: Drop the date or state "to the start of the retained logs".
  - code: F11
    where: body / actions / techniques / classification
    claim: techniques absent; classification absent; actions[] two long items restating the body
    ground_truth: >-
      Vulnerability entry with no techniques[], no classification; actions restate detection text (F18 b, c) and "this week" hedging.
    ground_truth_url: https://techcommunity.microsoft.com/blog/exchange/released-july-2026-exchange-server-security-updates/4534146
    fix: Fold into survivor; none carries over.
  group: D1-b
  role: duplicate
  duplicate_of: 2026-05-18/cve-2026-42897-exchange-owa-em-service-auto-mitigation-depen
  unique_material:
  - fact: >-
      EEMS prerequisites: the EM service is installed automatically with the September 2021 CU or later on Exchange 2016/2019 Mailbox role servers (not on Edge Transport), polls the Office Config Service hourly, and needs outbound HTTPS 443 to officeclient.microsoft.com; with MitigationsEnabled $false (Set-OrganizationConfig / Set-ExchangeServer) it checks but does not apply. Documented verification: Get-ExchangeServer | Format-List Name,MitigationsApplied, Get-Mitigations.ps1, or the Exchange Health Checker EEMS check. Events 1005/1006 (source "MSExchange Mitigation Service") on apply, 1008 on errors such as the OCS being unreachable.
    url: >-
      https://learn.microsoft.com/en-us/exchange/plan-and-deploy/post-installation-tasks/security-best-practices/exchange-emergency-mitigation-service
  - fact: >-
      The M2 mitigation is an IIS URL Rewrite OUTBOUND rule ("EEMS M2.1 OWA CSP - outbound", precondition "EEMS M2.1 OWA SPA HTML shell") on the OWA vdir, i.e. a Content Security Policy rewrite; it therefore does not protect clients using Internet Explorer or Edge in IE mode (MSRC FAQ, blog 2026-05-18 note). Mitigation ID shown in EEMS is M2.1.x; EOMT (aka.ms/UnifiedEOMT) applies it on disconnected servers.
    url: >-
      https://techcommunity.microsoft.com/blog/exchange/addressing-exchange-server-may-2026-vulnerability-cve-2026-42897/4518498
  - fact: >-
      Known issues once mitigated: OWA Print Calendar, inline images in the reading pane, OWA light, OWACalendar.Proxy healthset unhealthy (monitoring alerts), published calendars returning error 500; "Mitigation invalid for this exchange version" description is cosmetic if status is Applied.
    url: >-
      https://techcommunity.microsoft.com/blog/exchange/addressing-exchange-server-may-2026-vulnerability-cve-2026-42897/4518498
  - fact: >-
      MSRC credits an anonymous researcher; CISA KEV added 2026-05-15 (due 2026-05-29), ransomware use Unknown; MSRC severity Critical, Exploitation Detected.
    url: https://thehackernews.com/2026/05/on-prem-microsoft-exchange-server-cve.html
- entry: entries/2026-05-16/microsoft-exchange-cve-2026-42897-active-exploitation-withou.md
  verdict: factual-error
  defects:
