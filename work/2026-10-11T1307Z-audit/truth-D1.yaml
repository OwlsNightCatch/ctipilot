    ground_truth_url: https://www.tenable.com/blog/microsofts-may-2026-patch-tuesday-addresses-118-cves-cve-2026-41103
    fix: Delete the sentence (or replace with "16 rated Critical").
  - code: F4
    where: body ¶1 (CVE-2026-41096)
    claim: >-
      heap overflow in `dnsapi.dll`: a crafted DNS response from a MitM or rogue resolver yields code execution as `NetworkService` on every Windows host
    ground_truth: >-
      ZDI: heap-based buffer overflow in the DNS Client triggered by a malicious DNS response, attacker positioned to influence responses (MitM, rogue server); MSRC: "Heap-based buffer overflow in Microsoft Windows DNS ... execute code over a network", assessment "Exploitation Unlikely". No source names dnsapi.dll or the NetworkService context.
    ground_truth_url: https://www.thezdi.com/blog/2026/5/12/the-may-2026-security-update-review
    fix: Remove dnsapi.dll and NetworkService; add "Exploitation Unlikely" per MSRC.
  - code: F4
    where: cves[CVE-2026-42898] and cves[CVE-2026-41103]
    claim: 'CVE-2026-42898: auth: pre-auth ; CVE-2026-41103: type: rce'
    ground_truth: >-
      MSRC: CVE-2026-42898 "allows an authorized attacker to execute code over a network" (CVSS 3.1 9.9, PR:L, S:C); ZDI: "any authenticated user". CVE-2026-41103 is an Elevation of Privilege (identity forgery bypassing Entra ID, "Exploitation More Likely") per MSRC and Tenable, not RCE. The body states "authenticated" for 42898 correctly.
    ground_truth_url: >-
      https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-41089 (per-CVE JSON via tools/fetch_source.py msrc cve; May 2026 CVRF for fixed builds)
    fix: '42898: auth post-auth; 41103: type priv-esc.'
  - code: F4
    where: body ¶1 "Detection concepts"
    claim: >-
      monitor Netlogon authentication-pattern anomalies (`4624 Logon Type 3` to DCs from unexpected internal sources, paired with `4769` ticket-request anomalies); alert on outbound DNS to non-corporate resolvers
    ground_truth: >-
      (low confidence) No cited source gives these detections. Help Net Security (Automox) lists: Netlogon service unexpectedly crashing or restarting, anomalous Netlogon traffic from non-DC source addresses, authentication failures or domain trust errors right after suspicious activity at a DC. EID 4769 (Kerberos service tickets) is unrelated to a Netlogon RPC overflow.
    ground_truth_url: https://www.helpnetsecurity.com/2026/06/01/windows-netlogon-rce-exploited-cve-2026-41089/
    fix: Use the Automox-sourced indicators.
