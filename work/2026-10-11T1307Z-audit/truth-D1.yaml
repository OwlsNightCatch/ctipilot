  role: duplicate
  duplicate_of: 2026-05-15/cve-2026-20182-cisco-catalyst-sd-wan-controller-manager-pre
  unique_material:
  - fact: >-
      Mechanics (Rapid7): vdaemon DTLS control plane on UDP/12346; after a DTLS handshake that accepts any client certificate and a CHALLENGE, a CHALLENGE_ACK claiming device type 2 (vHub) is never verified, setting peer->authenticated; after a Hello the peer is UP; message type 14 (MSG_VMANAGE_TO_PEER) appends an attacker SSH public key to /home/vmanage-admin/.ssh/authorized_keys; the attacker then logs in to NETCONF on TCP/830 as vmanage-admin. Rapid7 notes it is a different flaw from CVE-2026-20127 in the same vdaemon stack and that any authenticated peer, whatever device type, can inject the key.
    url: >-
      https://www.rapid7.com/blog/post/ve-cve-2026-20182-critical-authentication-bypass-cisco-catalyst-sd-wan-controller-fixed/
  - fact: >-
      Talos attributes the in-the-wild exploitation of CVE-2026-20182 to UAT-8616 with high confidence (limited exploitation), with ORB-network infrastructure overlap; UAT-8616 attempted to add SSH keys, modify NETCONF configurations and escalate to root. UAT-8616's earlier CVE-2026-20127 activity (Feb 2026): activity back to at least 2023, likely root via software version downgrade exploiting CVE-2022-20775 then restoring the version; indicators include unaccounted vmanage-admin authorized_keys, root sessions, abnormally small or cleared logs (syslog, wtmp, lastlog, cli-history, bash_history), version downgrade/upgrade with reboot.
    url: >-
      https://blog.talosintelligence.com/sd-wan-ongoing-exploitation/ ; https://blog.talosintelligence.com/uat-8616-sd-wan/
  - fact: >-
      Cisco IOC guidance: audit /var/log/auth.log for "Accepted publickey for vmanage-admin" from unknown IPs; `show control connections detail` / `show control connections-history detail` (Validator: `show orchestrator connections ...`) with state up and challenge-ack 0; run `request admin-tech` on every control component BEFORE upgrading; if compromised, upgrading alone does not remediate, open a TAC case (Severity 3, CVE id in the title).
    url: https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-sdwan-rpa2-v69WY2SW
  - fact: >-
      Talos Snort SIDs: 66482-66483 (CVE-2026-20182); 66468-66469 (CVE-2026-20133 and -20128); 66461-66462 (CVE-2026-20122).
    url: https://blog.talosintelligence.com/sd-wan-ongoing-exploitation/
