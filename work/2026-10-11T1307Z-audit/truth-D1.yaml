  - code: F9
    where: immediate_action | section 2026-06-02 | cves[CVE-2026-41089].status
    claim: 'now actively exploited / confirmed active exploitation ... status: exploited'
    ground_truth: >-
      BleepingComputer (updated 2026-06-02): CCB gave no details and told the outlet the information came from "trusted partners"; "A Microsoft spokesperson also told BleepingComputer that the company does not currently have any evidence to support the CBC's claims". MSRC still shows Exploited: No, "Exploitation Less Likely", last revised 2026-05-12; CVE-2026-41089 is not in CISA KEV (catalog 2026.10.08). The entry mentions only that Microsoft had not updated its advisory and calls the CCB claim "confirmed".
