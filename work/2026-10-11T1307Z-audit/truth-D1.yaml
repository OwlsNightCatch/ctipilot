    where: techniques | body ATT&CK ids | actions | evidence
    claim: >-
      techniques: [] ; `T1210`, `T1071.004 Application Layer Protocol: DNS` (DNS Client), `T1078.004 Cloud Accounts`; actions[0] "... Disable Outlook Preview Pane fleet-wide ... See § 2"; actions[1] "(."
