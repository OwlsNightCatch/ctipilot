- entry: entries/2026-05-08/cve-2026-0300-pan-os-captive-portal-unauthenticated-root-rce.md
  verdict: factual-error
  defects:
  - code: F4
    where: body
    claim: >-
      disable the Captive Portal / Authentication Portal feature on internet-facing GlobalProtect gateway interfaces, or restrict access exclusively to trusted internal management IP ranges
    ground_truth: >-
      PSIRT workaround: restrict User-ID Authentication Portal access to trusted zones AND disable Response Pages in the Interface Management Profile attached to every L3 interface where untrusted/internet traffic can ingress, or disable the User-ID Authentication Portal if not required. GlobalProtect gateways and "management IP ranges" are not mentioned; the portal is not a management interface.
    ground_truth_url: https://security.paloaltonetworks.com/CVE-2026-0300
    fix: Use the PSIRT wording.
  - code: F11
    where: title | headline | summary | body
    claim: CISA KEV deadline is today (2026-05-09) ... treat this as a P0 action today before business opens
    ground_truth: >-
      The KEV deadline is the headline driver of a Swiss-constituency entry (style rule: no KEV deadline as the reason to act) and "P0" is workflow vocabulary; the finding itself (exploited pre-auth root RCE, no fix yet) is what matters.
    ground_truth_url: >-
      https://www.cisa.gov/known-exploited-vulnerabilities-catalog (catalogVersion 2026.10.08, read via tools/fetch_source.py cisa-kev)
    fix: Fold into the survivor; do not carry the KEV-deadline framing.
  - code: F11
    where: cves / evidence / techniques / classification
    claim: 'cves: []; evidence: []; sourcing_note "CVE fields incomplete"; no techniques; no classification'
    ground_truth: Vulnerability entry with empty cves[]/evidence[]/techniques[] and no classification.
    ground_truth_url: https://security.paloaltonetworks.com/CVE-2026-0300
    fix: Fold into survivor.
