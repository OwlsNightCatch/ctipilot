      Active Exploitation Without a Patch ... organisations that are not enrolled face a structural constraint where EEMS Mitigation M2 is the permanent operational mitigation
    ground_truth: >-
      Superseded by the June 2026 SU (2026-06-09) and July 2026 SU (2026-07-14); see MSRC revisions and Exchange Team blogs. Non-ESU Exchange 2016/2019 organisations still cannot get the SU (Period 2 ESU only), which is the part that stays true.
    ground_truth_url: https://techcommunity.microsoft.com/blog/exchange/released-june-2026-exchange-server-security-updates/4524491
    fix: Rewrite via the survivor.
