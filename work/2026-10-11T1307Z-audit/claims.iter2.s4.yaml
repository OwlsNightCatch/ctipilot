  entry: 2026-09-21/tradertraitor-terraform-lockfile-nostr-dead-drop
  surface: body
  kind: cited
  text: Any macOS fleet should alert on `xattr -rd com.apple.quarantine` combined with a `chmod +x` on the same file in immediate succession, and on outbound connections to Nostr relay infrastructure from
    a host with no legitimate reason to run a Nostr client (
  urls:
