- claim_id: a3ed402890
  entry: 2026-09-29/kaspersky-payload-gpo-encryptionless-ransomware
  surface: body
  kind: uncited
  text: 'On every Windows workstation, the GPO used only native client-side extensions (CSEs) to achieve the operation''s whole visible impact, with no encryptor of any kind: the Files CSE dropped a read-only
    ransom note to the desktop and the C: and D: drive roots; the Registry CSE rewrote the Windows logon legal-notice banner to ransom text; the Personalization/Desktop policy set a SYSVOL-hosted ransom
    image as every machine''s lock screen and wallpaper; and Security Settings CSE (`GptTmpl.inf`) disabled the local Administrator account fleet-wide, alongside a second GPO disabling Windows Firewall
    domain-wide.'
- claim_id: 5013553b6c
  entry: 2026-09-29/kaspersky-payload-gpo-encryptionless-ransomware
  surface: body
  kind: uncited
  text: Because computer-configuration GPO settings apply only on reboot or a policy refresh cycle, the malicious policy sat cached and dormant for a full day between authoring (13 April) and mass visible
    impact (14 April); Kaspersky also observed data exfiltration from file servers and several additional systems.
