  entry: 2026-09-21/tradertraitor-terraform-lockfile-nostr-dead-drop
  surface: summary
  kind: frontmatter
  text: 'SentinelLabs found the FLATROOF and ROOFDECK macOS backdoors, first documented in April 2026''s USD 292 million LayerZero/KelpDAO cryptocurrency theft, on an unrelated victim: a small India-based
    IT-services provider with no cryptocurrency ties. The campaign''s fake job-interview GitHub repositories carry weaponized Terraform provider lockfiles that redirect `terraform init` to attacker-controlled
    provider registries, though SentinelLabs cannot prove how this victim''s backdoors were delivered. Zscaler ThreatLabz independently reports a July 2026 trojanized Terraform provider binary that runs
    malicious code as soon as Terraform loads it and delivers FLATROOF on macOS, Linux and Windows, which drops ROOFDECK (Windows and macOS variants identified), in a campaign it suspects is TraderTraitor.
    The second-stage backdoor resolves its command-and-control address by reading an operator profile''s public "website" field from the Nostr decentralized relay network.'
- claim_id: 8f88e6cbc3
  entry: 2026-09-21/tradertraitor-terraform-lockfile-nostr-dead-drop
  surface: body
  kind: cited
  text: 'SentinelLabs hunted its telemetry for the FLATROOF (also known as macOS.Gaslight) and ROOFDECK macOS backdoors first disclosed in April 2026''s USD 292 million LayerZero/KelpDAO cryptocurrency
    theft, and found an unrelated victim carrying the same implants: a small India-based IT-services provider with no cryptocurrency exposure, compromised through a single Apple Silicon MacBook belonging
    to a DevOps engineer ('
  urls:
