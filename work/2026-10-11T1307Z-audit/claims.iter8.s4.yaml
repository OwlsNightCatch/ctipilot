  entry: 2026-06-11/shinyhunters-oracle-peoplesoft-campaign-gadget-chain-access
  surface: summary
  kind: frontmatter
  text: ShinyHunters (UNC6240) exploited CVE-2026-35273, an unauthenticated flaw in Oracle PeopleSoft's Environment Management Hub, as a zero-day from 27 May 2026, and Mandiant notified more than 100 organisations,
    mostly in higher education; Oracle fixed it out of band on 2026-06-10 and CISA listed it in KEV on 12 June. Have I Been Pwned's analysis of the leaked data counts about 455,000 University of Nottingham
    students and alumni. A second wave from September reaches the hub past WAF path rules with a URL-encoded path.
- claim_id: 8f5420317c
  entry: 2026-06-11/shinyhunters-oracle-peoplesoft-campaign-gadget-chain-access
  surface: actions[0]
  kind: frontmatter
  text: '**Patch every Oracle PeopleSoft instance to a supported PeopleTools release or disable/remove PSEMHUB now (CVE-2026-35273); a WAF rule alone no longer stops this.** UNC6240 (ShinyHunters) bypasses
    literal-string `/PSEMHUB/` WAF blocks with the URL-encoded `/%50SEMHUB/` path, so a perimeter block that has not been reconfigured to match on the normalized path is not a control. Investigate any instance
    that was internet-reachable and unpatched at any point since 27 May 2026 for compromise, and treat any host where a web shell is found as compromised, and rotate every credential reachable from the
    PeopleSoft tier.'
