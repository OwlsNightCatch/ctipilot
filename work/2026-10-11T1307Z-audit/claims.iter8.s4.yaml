  surface: summary
  kind: frontmatter
  text: CVE-2026-42208 (CVSS 4.0 9.3) is a SQL injection in LiteLLM Proxy's API-key verification, reachable without credentials from any LLM API route in versions 1.81.16 to 1.83.6 and fixed in 1.83.7.
