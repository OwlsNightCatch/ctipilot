  - claim_id: f15aeb1739
    entry: 2026-05-09/cve-2026-43284-cve-2026-43500-linux-dirty-frag-deterministic
    surface: "record 2026-10-11T14:26:34Z"
    kind: record-summary
    text: "Exploitation of Dirty Frag is not confirmed: Microsoft's observation may be Dirty Frag or Copy Fail, and Microsoft does not report exfiltration, so the exploited status is removed. The root cause is in-place decryption of a spliced page-cache page, not DMA remapping; only the ESP variant needs a user namespace; the tested distributions and Ubuntu releases were wrong; Red Hat's bulletin does not cover CVE-2026-43500, which does not affect Red Hat, and its targeted sysctl is user.max_user_namespaces; a file-write watch cannot see the page-cache write; and Microsoft does not mention AIDE, IMA or auditd. The summary's pending-patch state is superseded: both mainline fixes and distribution kernels are released. CVSS for CVE-2026-43284 is the CNA's 8.8, the duplicate Red Hat source and self-quoted evidence are removed, and the earlier sections are corrected in place."
