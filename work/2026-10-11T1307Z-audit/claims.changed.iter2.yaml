    entry: 2026-05-08/instructure-canvas-extortion-330-institutions-across-six-cou
    surface: "record 2026-10-11T14:19:55Z"
    kind: record-summary
    text: "Most of the headline figures had no source: 330 was the number of defaced login portals, not institutions; six countries, 16 million records, 44 confirmed Dutch institutions and German or Dutch regulator inquiries appear nowhere; the actor is ShinyHunters, not WorldLeaks, and no EUR 3.2 million demand, 3 GB sample or LTI service-account vector was reported. The entry is rewritten from its sources, the earlier sections are corrected in place (dates of the second notice and the agreement, Instructure's statement that the agreement covers all customers, unsupported UK university statements and speculation removed), the dead SURF source is dropped, and the entry gains its rating and ATT&CK mapping. Priority moves from high to notable. NL Times is added as the source for the seven Dutch universities that disconnected Canvas."
