  - claim_id: d722b10971
    entry: 2026-05-09/denic-de-dnssec-outage-faulty-key-rollover-3-5-h-disruption
    surface: "summary"
    kind: frontmatter
    text: "A routine DNSSEC key rollover on 2026-05-05 left the .de zone with signatures validating resolvers could not verify, from an onset the sources place between about 19:30 and 19:57 UTC until DENIC restored normal operation at 23:15 UTC. DENIC's new signing system generated one key pair per HSM instead of one shared pair, so only one matched the published DNSKEY; unverifiable NSEC3 signatures broke even unsigned .de domains."
  - claim_id: c28965c3cc
    entry: 2026-05-09/denic-de-dnssec-outage-faulty-key-rollover-3-5-h-disruption
    surface: "body"
    kind: cited
    text: "); heise dates the first disruption to 21:43 local time, 19:43 UTC ("
    urls: ["https://www.heise.de/news/DNS-Probleme-mit-de-Domains-DENIC-liefert-erste-Erklaerung-11288197.html"]
  - claim_id: 9464ef40f0
    entry: 2026-05-09/denic-de-dnssec-outage-faulty-key-rollover-3-5-h-disruption
    surface: "record 2026-10-11T14:30:46Z"
    kind: record-summary
    text: "The times were local time labelled UTC: the outage began between about 19:30 and 19:57 UTC, depending on the source, and ended at 23:15 UTC, about three and a half hours. Cloudflare's mitigation came about 2 hours 45 minutes after onset through an override rule, not an RFC 7646 negative trust anchor within 90 minutes; the 18 million domains, the government focus and the statement that .ch was unaffected had no source. DENIC's addendum of 11 May replaces the key-tag collision account: one key pair per HSM instead of a shared pair. The signing system went live in April, not March. The entry is recorded as a non-adversarial resilience item with a rating and priority routine, and both sections are corrected in place."
