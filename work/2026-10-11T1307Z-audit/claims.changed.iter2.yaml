  - claim_id: 29bc21d8a8
    entry: 2026-05-09/daemon-tools-lite-supply-chain-quic-rat-deployed-via-signed
    surface: "summary"
    kind: frontmatter
    text: "DAEMON Tools Lite versions 12.5.0.2421 to 12.5.0.2434, distributed from the vendor's site from 2026-04-08 and signed with the developer's certificates, carried trojanised helper binaries. Kaspersky saw several thousand infection attempts in more than 100 countries, mostly delivering an information collector; a backdoor reached about a dozen machines at government, scientific, manufacturing and retail organizations in Russia, Belarus and Thailand, and QUIC RAT one Russian educational institution. Version 12.6.0.2445 is clean."
