  entry: 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev
  surface: body
  kind: uncited
  text: CVE-2026-88771 (CWE-20, improper input validation, CVSS 4.0 9.5) lets an unauthenticated remote attacker execute arbitrary commands on every NetScaler ADC/Gateway deployment in its default configuration;
