  entry: 2026-05-18/cve-2026-42897-exchange-owa-em-service-auto-mitigation-depen
  surface: record 2026-10-11T14:36:06Z
  kind: record-summary
  text: 'The title, summary, immediate action and first action named the wrong mitigation host (the EM service needs officeclient.microsoft.com), attributed the connectivity requirement to a blog note that
    only added a known issue, gave an undocumented verification cmdlet on the Edge Transport role where the EM service is not installed, and still said no fix existed. The fix first shipped in the June
    2026 Security Update; Microsoft recommends the July update. The main analysis is rewritten to the current state with the EM-service mechanics from Microsoft Learn; the July section is corrected in place
    (June fix, the joint Proofpoint and NSA release instead of an uncited 16-nation advisory, no workflow vocabulary); an evidence quote is re-attributed to MSRC and one no longer on any cited page is removed;
    the mitigation-era immediate action and action are removed; priority moves from critical to high now that a fix has existed since June. The flaw is described as cross-site scripting, as Microsoft and
    Proofpoint describe it, not as stored XSS, and the 2026-07-31 takeaway now dates the fix to June. Exchange Online''s exemption is cited to Microsoft''s May blog, the 2026-07-31 section calls TA488 Russia-aligned
    as Proofpoint does, and event_date is the May advisory''s date. The 2026-08-30 section is restated in plain language without rating codes. The title, headline and summary no longer say the mitigation
    must be removed by hand or that the foothold outlives patching: Microsoft says the update does not remove the mitigation, and Proofpoint says the mailbox grant needs deliberate removal. The body no
    longer says the mitigation must be rolled back or that the foothold outlives patching, the Period 1 end date is cited to the May blog, the 2026-07-31 mechanism paragraphs carry their Proofpoint citation,
    and the sector tags follow Proofpoint''s targets.'
