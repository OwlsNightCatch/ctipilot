  entry: 2026-09-28/cve-2019-18935-telerik-godzilla-webshell-virtualpathprovider
  surface: body
  kind: uncited
  text: '**Detection and hunting.** In process-creation telemetry, alert on `w3wp.exe` spawning `cmd.exe` or PowerShell with no corresponding legitimate application feature to explain it; the VirtualPathProvider
    registration technique means no new `.aspx` file appears on disk, so file-integrity monitoring over the web root will miss this shell entirely; in-memory module-loading detection (unusual modules loaded
    into the IIS worker process, or EDR visibility into .NET AppDomain assembly loads) is the telemetry class that catches it.'
- claim_id: 567e6bcab4
  entry: 2026-09-28/cve-2019-18935-telerik-godzilla-webshell-virtualpathprovider
  surface: body
  kind: uncited
  text: 'The installed shell follows the Godzilla web-shell protocol: it distinguishes actions via an HTTP request''s `Type` header, decrypts the request body, caches an attacker-supplied .NET payload in
    a cookie-bound session on first contact, and re-invokes that cached payload on each later request: an arbitrary, extensible in-memory .NET execution primitive that leaves minimal on-disk forensic trace.'
