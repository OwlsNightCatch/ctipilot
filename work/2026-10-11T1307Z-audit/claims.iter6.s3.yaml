- claim_id: 77f9e19a56
  entry: 2026-05-09/denic-de-dnssec-outage-faulty-key-rollover-3-5-h-disruption
  surface: record 2026-10-11T14:30:46Z
  kind: record-summary
  text: 'The times were local time labelled UTC: the outage began between about 19:30 and 19:57 UTC, depending on the source, and ended at 23:15 UTC, about three and a half hours. Cloudflare''s mitigation
    came about 2 hours 45 minutes after onset through an override rule, not an RFC 7646 negative trust anchor within 90 minutes; the 18 million domains, the government focus and the statement that .ch was
    unaffected had no source. DENIC''s later addendum of 11 May replaces the key-tag collision account: one key pair per HSM instead of a shared pair. The signing system went live in April, not March. The
    entry is recorded as a non-adversarial resilience item with a rating and priority routine, and both sections are corrected in place.'
