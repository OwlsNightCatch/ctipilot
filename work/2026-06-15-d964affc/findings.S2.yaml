items:
  - title: "Microsoft Exchange Server OWA stored XSS (CVE-2026-42897) — permanent patch released June 9, actively exploited since May"
    sources:
      - url: "https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-42897"
        publisher: "Microsoft MSRC"
        date: "2026-06-09"
        role: "primary"
      - url: "https://www.cert.ssi.gouv.fr/alerte/CERTFR-2026-ALE-005/"
        publisher: "CERT-FR / ANSSI"
        date: "2026-06-11"
        role: "corroborating"
      - url: "https://thehackernews.com/2026/06/microsoft-june-2026-patch-tuesday.html"
        publisher: "The Hacker News"
        date: "2026-06-09"
        role: "corroborating"
    discovery_trace: "first seen at: cert-fr avis-recent, URL https://www.cert.ssi.gouv.fr/alerte/CERTFR-2026-ALE-005/ → pivot: MSRC API (bridge msrc cve CVE-2026-42897) → primary: https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-42897 → corroborating: https://thehackernews.com/2026/06/microsoft-june-2026-patch-tuesday.html"
    summary: |
      CVE-2026-42897 is a stored cross-site scripting (CWE-79) vulnerability in Microsoft Exchange Server's Outlook Web Access (OWA) component. An unauthenticated remote attacker sends a crafted email message; when the victim opens it in OWA, attacker-controlled JavaScript executes in the victim's browser session. MSRC rates this CVSS 8.1 (AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:N). The vulnerability was added to CISA's KEV catalog on May 15, 2026, and Microsoft confirmed active exploitation in the wild.

      Affected on-premises deployments: Exchange Server 2016 CU23, Exchange Server 2019 CU14 and CU15, and Exchange Server SE RTM. Exchange Online is NOT affected. The permanent fix was shipped in the June 2026 Security Update (released June 9, 2026). The Exchange Emergency Mitigation Service (EEMS) applied an interim mitigation automatically to eligible on-premises servers prior to the full patch, but EEMS mitigation is not a substitute for patching.

      Detection approach (behavioural): Monitor IIS logs on Exchange servers for anomalous POST requests to OWA endpoint paths (`/owa/`, `/EWS/`) with unusually large or script-containing body content. Sysmon Event ID 1 with parent process `w3wp.exe` (IIS worker) spawning unexpected child processes is a strong indicator. MITRE ATT&CK: T1189 Drive-by Compromise (email-delivered XSS), T1566.002 Spearphishing Link. Hardening: Apply June 2026 Exchange Security Update immediately; verify EEMS is enabled as defense-in-depth; for EU/CH public-sector environments with isolated OWA, consider restricting OWA access to internal networks pending patching.
    ch_eu_nexus: "On-premises Exchange Server is widely deployed across EU and Swiss public-sector, cantonal government, and cantonal police environments; Exchange Online migration is incomplete across the sector. Active exploitation confirmed."
    public_sector_nexus: "direct"
    sector: "government, public-sector, education"
    cves: ["CVE-2026-42897"]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "update-to-prior:2026-06-09 (KEV listing was prior coverage; permanent patch release and CERT-FR alert update on June 9-11 is the in-window delta)"
    evidence:
      - quote: "An unauthenticated attacker who successfully exploits this vulnerability could perform a cross-site scripting attack and execute arbitrary code in the context of the signed-in user."
        attribution: "Microsoft MSRC"
        source_url: "https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-42897"
      - quote: "Microsoft indique que la vulnérabilité CVE-2026-42897 est activement exploitée et recommande l'application immédiate du correctif"
        attribution: "CERT-FR / ANSSI"
        source_url: "https://www.cert.ssi.gouv.fr/alerte/CERTFR-2026-ALE-005/"
    extended_notes: |
      Defender hunting note: OWA XSS exploits commonly lead to session-token theft enabling subsequent mailbox access without credentials. Monitor Azure AD / on-premises AD logs for OAuth token requests from unexpected IP addresses or user agents following OWA access, cross-correlated with EWS API calls exfiltrating mail items. EEMS auto-mitigation telemetry is available in the Exchange admin center under Server > Mitigations.

  - title: "GitLab CE/EE 19.0.2 / 18.11.5 / 18.10.8 patch — SAML account takeover (CVSS 8.7) and 11 additional CVEs, June 10"
    sources:
      - url: "https://docs.gitlab.com/releases/patches/patch-release-gitlab-19-0-2-released/"
        publisher: "GitLab"
        date: "2026-06-10"
        role: "primary"
      - url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0196"
        publisher: "NCSC-NL"
        date: "2026-06-11"
        role: "corroborating"
      - url: "https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-0733/"
        publisher: "CERT-FR / ANSSI"
        date: "2026-06-10"
        role: "corroborating"
    discovery_trace: "first seen at: ncsc-nl recent (bridge ncsc-nl recent 20), NCSC-2026-0196 → primary: GitLab patch release notes https://docs.gitlab.com/releases/patches/patch-release-gitlab-19-0-2-released/ → corroborating: cert-fr avis-recent CERTFR-2026-AVI-0733 https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-0733/"
    summary: |
      GitLab released patch versions 19.0.2, 18.11.5, and 18.10.8 on June 10, 2026, addressing 12 CVEs. The most critical is CVE-2026-6552 (CVSS 8.7, CWE-639 Insecure Direct Object Reference): a Group SAML Identity Provider API flaw where a group Owner role can take over any member's GitLab account by abusing the SAML identity-linking endpoint, bypassing GitLab's SSO session controls. Affects all GitLab EE instances with Group SAML enabled, versions 15.5 through 18.10.7, 18.11 through 18.11.4, and 19.0 through 19.0.1. The fix is in 18.10.8, 18.11.5, 19.0.2 (EE only).

      Additional high-severity CVEs: CVE-2026-10087 (CVSS 8.7, CWE-79): stored XSS in Analytics Dashboard — Developer-role user can execute JS against higher-privileged users including instance admins; CVE-2026-7250 (CVSS 7.5, CWE-20): unauthenticated DoS via malformed JSON in Grape API endpoint; CVE-2026-9204 (CVSS 5.3, CWE-918): SSRF in Gitaly repository import allows reading arbitrary files from the Gitaly server filesystem.

      Attack flow for CVE-2026-6552: prerequisite is Group Owner role on a GitLab EE group with SAML SSO configured. Attacker crafts a SAML assertion for an existing member's UID and calls the SAML identity link API, overriding the victim's linked identity. Upon victim's next SAML login, session control transfers. MITRE ATT&CK: T1078.004 Cloud Accounts (identity takeover via SAML abuse), T1550.001 Application Access Token. Detection: monitor GitLab application logs (`production.log`) for repeated SAML identity link calls from a single source_ip across multiple user accounts; alert on Group Owner API calls that touch `saml_identities` table outside of normal SSO flows; GitLab Audit Event `sso_identity_updated` is the key event to alert on.

      Hardening: Update immediately to patched versions. Until patched, disable Group SAML SSO on sensitive groups or restrict group_owners role assignment. For CVE-2026-10087 (Analytics Dashboard XSS): tighten Trusted Proxies configuration and ensure `content_security_policy_report_only` is disabled in favour of enforced CSP.
    ch_eu_nexus: "GitLab CE/EE is widely used for source code management and CI/CD pipeline in EU and Swiss government digital transformation projects, including cantonal IT services, federal agencies, and public-sector software contractors."
    public_sector_nexus: "direct"
    sector: "government, public-sector, software-supply-chain, education"
    cves: ["CVE-2026-6552", "CVE-2026-10087", "CVE-2026-7250", "CVE-2026-9204"]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "new"
    evidence:
      - quote: "CVE-2026-6552 — CVSS Score 8.7 — Group SAML Identity Provider allows group owners to take over account of SAML users — Affects: GitLab EE 15.5 to 18.10.7, 18.11.0 to 18.11.4, 19.0.0 to 19.0.1 — Fixed in: 18.10.8, 18.11.5, 19.0.2"
        attribution: "GitLab"
        source_url: "https://docs.gitlab.com/releases/patches/patch-release-gitlab-19-0-2-released/"
      - quote: "De kwetsbaarheden stellen aanvallers mogelijk in staat om beveiligingsmaatregelen te omzeilen, een Cross-Site Scripting aanval uit te voeren of een denial-of-service conditie te veroorzaken."
        attribution: "NCSC-NL"
        source_url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0196"
    extended_notes: |
      CVE-2026-9204 (Gitaly SSRF) has a particularly high exploitability surface in self-managed GitLab instances with CI/CD runners, since Gitaly often runs co-located with the GitLab application server. An attacker with Project Maintainer or higher privileges could abuse repository import to probe internal network services or read Gitaly server files including Git hooks and configuration. This is a privilege escalation primitive in complex GitLab deployments.

  - title: "OpenSSL CVE-2026-45447 — heap use-after-free in PKCS7_verify(), RCE potential, patch June 9"
    sources:
      - url: "https://openssl.org/news/secadv/20260609.txt"
        publisher: "OpenSSL Project"
        date: "2026-06-09"
        role: "primary"
      - url: "https://www.securityweek.com/openssl-patches-high-severity-vulnerabilities/"
        publisher: "SecurityWeek"
        date: "2026-06-09"
        role: "corroborating"
      - url: "https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-0717/"
        publisher: "CERT-FR / ANSSI"
        date: "2026-06-10"
        role: "corroborating"
    discovery_trace: "first seen at: cert-fr avis-recent (bridge cert-fr avis-recent 20), CERTFR-2026-AVI-0717 https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-0717/ → primary: OpenSSL security advisory https://openssl.org/news/secadv/20260609.txt → corroborating: https://www.securityweek.com/openssl-patches-high-severity-vulnerabilities/"
    summary: |
      OpenSSL released a security advisory on June 9, 2026 patching 18 vulnerabilities, most critically CVE-2026-45447 (severity: High), a heap use-after-free in the `PKCS7_verify()` function. The vulnerability arises when `SignedData.digestAlgorithms` is an empty ASN.1 SET: the function incorrectly frees a caller-owned BIO object, resulting in a use-after-free condition. Successful exploitation may result in arbitrary code execution, heap corruption, or process crash depending on heap layout. No exploitation in the wild has been reported.

      Affected versions: OpenSSL 4.0 (before 4.0.1), 3.6 (before 3.6.3), 3.5 (before 3.5.7), 3.4 (before 3.4.6), 3.0 LTS (before 3.0.21), 1.1.1 (before 1.1.1zh — premium support only), 1.0.2 (before 1.0.2zq — premium support only). The OpenSSL CMS APIs are NOT affected; the vulnerability is specific to the PKCS#7 legacy API path. Applications that call `PKCS7_verify()` directly or indirectly (e.g., some email signing/encryption libraries, PKCS#7-based certificate validation paths) are at risk.

      Also patched in this release: CVE-2026-34182 (Medium), a forged-message vulnerability in CMS AuthEnvelopedData where a malicious sender can forge GCM authentication tag computation, affecting content integrity guarantees in encrypted CMS messages.

      Defender prioritisation for EU/CH public sector: prioritise patching on (1) VPN gateways and TLS terminators that call PKCS7_verify() for mutual-TLS client certificate chains, (2) email gateway appliances with S/MIME verification enabled, (3) LDAPS-based identity infrastructure that uses PKCS#7 for PKI operations, (4) any internally-developed service calling the OpenSSL PKCS7 API directly. MITRE ATT&CK: T1190 Exploit Public-Facing Application. Detection (pre-patch): monitor for process crashes in services linking against libssl/libcrypto with `PKCS7_verify` in the call stack (core dumps, SIGABRT in application logs); enable heap-corruption detection via ASan in non-production environments to characterise exploitability.
    ch_eu_nexus: "OpenSSL underlies the majority of TLS, VPN, S/MIME, and PKI infrastructure across EU and Swiss government networks. EU FIPS 140-2/3 certified environments using OpenSSL FIPS provider retain partial protection for FIPS-mode code paths, but non-FIPS PKCS7 call paths remain exposed."
    public_sector_nexus: "indirect"
    sector: "cross-sector, government, telco, healthcare, energy"
    cves: ["CVE-2026-45447", "CVE-2026-34182"]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "new"
    evidence:
      - quote: "CVE-2026-45447: Heap use-after-free in PKCS7_verify() — Severity: High — When PKCS7_verify() is called on a SignedData structure whose digestAlgorithms field is an empty SET, the function incorrectly frees a BIO supplied by the caller. This can lead to a use-after-free condition with potential for heap corruption or code execution."
        attribution: "OpenSSL Project"
        source_url: "https://openssl.org/news/secadv/20260609.txt"
      - quote: "The OpenSSL Project this week released patches for 18 vulnerabilities, including a high-severity heap use-after-free bug that could lead to remote code execution."
        attribution: "SecurityWeek"
        source_url: "https://www.securityweek.com/openssl-patches-high-severity-vulnerabilities/"
    extended_notes: |
      The 1.1.1 and 1.0.2 branches are end-of-life for public support. Organisations still running these versions in EU/CH government environments should treat this patch as a migration forcing-function: 1.1.1zh and 1.0.2zq are premium-support only, meaning non-premium users have no vendor-supported patch path. Migration to OpenSSL 3.0 LTS or 3.4+ is the supported remediation for EOL deployments.

  - title: "Traefik proxy security-policy bypass CVE-2026-47124 / GHSA-3g6v-2r68-prfc — patch v3.6.20 / v3.7.4, June 11"
    sources:
      - url: "https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-0738/"
        publisher: "CERT-FR / ANSSI"
        date: "2026-06-11"
        role: "primary"
      - url: "https://github.com/traefik/traefik/security/advisories/GHSA-3g6v-2r68-prfc"
        publisher: "Traefik GitHub Security Advisory"
        date: "2026-06-11"
        role: "corroborating"
    discovery_trace: "first seen at: cert-fr avis-recent (bridge cert-fr avis-recent 20), CERTFR-2026-AVI-0738 https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-0738/ → primary confirmed at CERT-FR; GitHub advisory GHSA-3g6v-2r68-prfc as corroborating"
    summary: |
      Traefik, the widely-used cloud-native reverse proxy / ingress controller, patched a security-policy bypass vulnerability (GHSA-3g6v-2r68-prfc, CVE-2026-47124) in versions 3.6.20 (stable) and 3.7.4 (experimental), released June 11, 2026. The vulnerability allows an attacker to bypass configured security policies (IP allowlists, rate-limiting middleware, authentication middleware chains) under specific routing configurations. Traefik's router rule-matching engine, when handling requests that match multiple rule sets of equal priority, may evaluate middleware in an order that skips a configured security middleware, effectively granting unauthenticated or unauthorised access to protected backend services.

      Affected versions: Traefik v3.x before 3.6.20 (stable track) and v3.7.x before 3.7.4 (experimental track). The v2.x branch is EOL and has no patch; operators on v2.x should migrate. The issue is not exploitable in v3 default configurations where a single catch-all router is used; only configurations with multiple overlapping router rules at the same priority are affected.

      Prerequisites: attacker must be able to send HTTP requests to the Traefik ingress; no authentication required. In Kubernetes environments, this means any network-accessible pod or external attacker who can reach the ingress controller can potentially bypass middleware policies on overlapping routes. MITRE ATT&CK: T1190 Exploit Public-Facing Application, T1078 Valid Accounts (bypassing auth enforcement). Detection: audit Traefik access logs for requests to backend paths that should be protected, particularly from sources outside expected allowlisted IP ranges; monitor for 200-series responses on paths that should return 401/403 for unauthenticated requests. Hardening: upgrade to 3.6.20+ or 3.7.4+; audit router rule priority assignments for overlapping patterns; implement defence-in-depth authentication at the backend application layer.
    ch_eu_nexus: "Traefik is a primary ingress controller for cloud-native and Kubernetes-based deployments in EU public-sector cloud environments; widely used in DevSecOps stacks at cantonal and federal digital services."
    public_sector_nexus: "indirect"
    sector: "government, public-sector, software-supply-chain"
    cves: ["CVE-2026-47124"]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: "new"
    evidence:
      - quote: "Une vulnérabilité a été découverte dans Traefik. Elle permet à un attaquant de provoquer un contournement de la politique de sécurité."
        attribution: "CERT-FR / ANSSI"
        source_url: "https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-0738/"
      - quote: "Security policy bypass in Traefik when multiple routers with identical priorities are configured — fixed in v3.6.20 and v3.7.4"
        attribution: "Traefik GitHub Security Advisory"
        source_url: "https://github.com/traefik/traefik/security/advisories/GHSA-3g6v-2r68-prfc"
    extended_notes: |
      For Swiss cantonal and federal environments running Kubernetes workloads on platforms like Rancher, OpenShift, or bare-metal K8s clusters, Traefik is commonly deployed as the default ingress controller. The multi-router bypass scenario is particularly relevant for microservices architectures where different teams configure router rules independently, creating accidental overlap.

