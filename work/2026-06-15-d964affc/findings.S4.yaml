  - title: "UPDATE: FBI 'Operation Ghost Hook' seizes Outsider Enterprise phishing infrastructure — domain takedowns, $100K USDT seized, Operation Riptide context"
    sources:
      - { url: "https://www.bleepingcomputer.com/news/security/fbi-disrupts-massive-ai-powered-phishing-service-using-a-million-urls/", publisher: "BleepingComputer", date: "2026-06-14", role: "primary" }
      - { url: "https://cyberscoop.com/outsider-cybercrime-network-takedown-china-fbi-google-lumen/", publisher: "CyberScoop", date: "2026-06-12", role: "corroborating" }
    discovery_trace: >
      first seen at: bleepingcomputer RSS feed, URL https://www.bleepingcomputer.com/feed/ (June 14 item) →
      primary: BleepingComputer article URL https://www.bleepingcomputer.com/news/security/fbi-disrupts-massive-ai-powered-phishing-service-using-a-million-urls/ →
      corroborating: CyberScoop URL https://cyberscoop.com/outsider-cybercrime-network-takedown-china-fbi-google-lumen/ (June 12 original, then FBI action reported June 14)
    summary: |
      The FBI, working in coordination with Google and Lumen Technologies (Black Lotus Labs), executed the operational phase of "Operation Ghost Hook" on 14 June 2026 against Outsider Enterprise — a China-based phishing-as-a-service (PhaaS) operation active since July 2023 across 55 countries.
      FBI seized thousands of Outsider-registered domains (now redirected to an FBI splash page), core admin servers, a Shopify storefront, and approximately $100,000 USDT from payment wallets. Agents also accessed an Outsider Telegram bot to enumerate the network's criminal customers. The FBI estimates the platform facilitated theft of 3.87 million credit cards and approximately $1.9 billion in losses.
      Outsider sold phishing kits as-a-service for $88/week or $200/month, targeting victims in the US and 54 other countries using fake package-delivery, toll, parking, and brokerage-account lures. The operation weaponised Gemini and other AI tools to generate custom phishing site code — AI-generated lures were documented in the Manhattan federal complaint Google filed on 13 June 2026.
      The enforcement action is part of the FBI's broader "Operation Riptide" targeting cybercrime infrastructure. Google coordinated the civil complaint (filed 13 June) with the FBI's criminal enforcement to form a parallel-track legal and operational takedown.
      Defenders: monitor for fake package/toll/parking credential-harvest phishing using AI-generated pages; the FBI domain seizure redirects ~1 million URLs to a splash page, reducing active infrastructure, but copycat Outsider-derived kits are in the wild. The Outsider toolkit's AI-generation capability (prompt-to-phishing-page) lowers the barrier for affiliates who can port the capability to new domains.
    ch_eu_nexus: "Outsider operated in 55 countries including EU member states; Swiss and EU public-sector staff are within the targeting aperture for smishing/phishing credential harvest"
    public_sector_nexus: "indirect — generic credential-harvest campaigns target government employees alongside consumers"
