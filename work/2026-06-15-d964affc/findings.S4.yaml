  - title: "[DARK-WEB CLAIM — NOT CONFIRMED BY VICTIM] ShinyHunters lists Council of Europe (coe.int) on extortion site — 297 GB HR/payroll data claimed, deadline 16 June"
    sources:
      - { url: "https://www.dexpose.io/shinyhunters-breaches-council-of-europe-exposing-sensitive-data/", publisher: "DeXpose", date: "2026-06-14", role: "primary" }
      - { url: "https://www.hendryadrian.com/ransom-coe-int-jun-2026/", publisher: "Cybersecurity News Everyday (ransomware monitor)", date: "2026-06-14", role: "corroborating" }
    discovery_trace: >
      first seen at: WebSearch query "breach ransomware cyberattack company statement 'June 14' OR 'June 15' 2026 disclosed victim" → Ransomware.live surfaced as source →
      WebSearch query "Council of Europe 'coe.int' ShinyHunters breach ransomware June 14 2026" →
      pivot: DeXpose article URL https://www.dexpose.io/shinyhunters-breaches-council-of-europe-exposing-sensitive-data/ (June 14) →
      corroborating: Ransomware monitor URL https://www.hendryadrian.com/ransom-coe-int-jun-2026/ (June 14) →
      NO victim statement or high-reliability journalism (BleepingComputer, The Record, SecurityWeek) found as of 2026-06-15T04:40Z
    summary: |
      On 14 June 2026, the financially motivated extortion group ShinyHunters (UNC6240, also attributed the Oracle PeopleSoft campaign) listed the Council of Europe (coe.int) on its leak site, claiming to have exfiltrated approximately 297 GB of internal HR and payroll data.
      The claimed data scope includes payroll records for approximately 10,000 staff spanning 2011–2026 (~409,000 payslips), more than 14,000 CVs, 3,700+ in-house personnel files, 10,700+ per-employee document stores, and records containing full names, employee IDs, home addresses, phone numbers, dates of birth, salaries, bank details, tax and social security information, and medical/absence records. ShinyHunters issued a "final warning" dated 14 June with a deadline of 16 June 2026 to make contact or face public data publication.
      The Council of Europe is a Strasbourg-based intergovernmental organisation of 47 member states (distinct from the EU's institutions) — its staff data would cover nationals across all member states including Switzerland. As of 2026-06-15T04:40Z, no victim statement or confirmation from the Council of Europe has been found, and no major cybersecurity outlet (BleepingComputer, The Record, SecurityWeek) has published a story. This item must be treated as an unconfirmed dark-web extortion claim.
      ShinyHunters / UNC6240 is a prolific financially motivated group confirmed active against European targets in June 2026 (Oracle PeopleSoft campaign, covered 2026-06-12 and 06-13 briefs). The group's Gentlemen campaign had 478 prior victims. The same actor also hit the European Commission (europa.eu) in March 2026 via a Trivy supply-chain compromise.
      Defenders at organisations with staff that interact with the Council of Europe ecosystem should monitor for credential-stuffing using leaked email/address combinations if the data is published.
