      Note on ShinyHunters identity: The "ShinyHunters" claiming the CoE breach appears to be the same group UNC6240 that ran the Oracle PeopleSoft campaign and was covered in the 2026-06-12 and 2026-06-13 briefs. The Council of Europe claim follows the same pattern: data exfiltration + extortion deadline.

  - title: "Handala (Iran / Void Manticore) breaches California Water Service via exposed RTKBase GNSS platform — billing PII for 2M customers leaked, no OT/ICS access confirmed"
    sources:
      - { url: "https://www.securityweek.com/iranian-cyber-group-handala-claims-cal-water-hack/", publisher: "SecurityWeek", date: "2026-06-12", role: "primary" }
      - { url: "https://securityaffairs.com/193565/uncategorized/iran-linked-handala-breached-a-california-water-utility-it-could-have-done-worse-and-it-knows-that.html", publisher: "Security Affairs", date: "2026-06-12", role: "corroborating" }
      - { url: "https://www.dataminr.com/resources/intel-brief/cyber-intel-brief-handala-claims-breach-of-california-water-service/", publisher: "Dataminr", date: "2026-06-11", role: "corroborating" }
      - { url: "https://www.securitymagazine.com/articles/102368-security-experts-discuss-validity-of-handalas-cal-water-hacking-claim", publisher: "Security Magazine", date: "2026-06-12", role: "corroborating" }
    discovery_trace: >
      first seen at: SecurityAffairs RSS feed https://securityaffairs.com/feed/ (June 12 entry) →
      primary: SecurityWeek URL https://www.securityweek.com/iranian-cyber-group-handala-claims-cal-water-hack/ (published 2026-06-12, updated 2026-06-13T06:28Z) →
      corroborating: SecurityAffairs URL https://securityaffairs.com/193565/... (June 12) →
      corroborating: Dataminr intel brief (June 11) →
      corroborating: Security Magazine (June 12) with vendor expert analysis
    summary: |
      On approximately 11 June 2026, Iran-aligned hacktivist group Handala (widely assessed as a front for Void Manticore / IRISL-affiliated actors) claimed on its Telegram blog to have compromised California Water Service (Cal Water), one of the US's largest investor-owned water utilities serving ~2 million customers across multiple California districts.
      Handala published a 5 GB proof-of-concept dump comprising: (1) customer billing PII (names, addresses, payment histories) for accounts across at least seven service districts — Bakersfield, Chico, Salinas, Stockton, Visalia, San Mateo, and a regional engineering segment; and (2) administrative credentials for Cal Water's internal RTKBase NTRIP caster network — a GNSS base-station platform used by field crews for precision GPS corrections.
      The access path: Handala exploited an internet-exposed RTKBase instance (reportedly online for 783+ hours without rotation) to harvest NTRIP credentials, then pivoted laterally to the customer billing database. No access to water treatment controls, PLCs, SCADA systems, or OT networks has been confirmed. Cal Water's own preliminary scan found no compromise within its IT or water-production/delivery systems. Dataminr confirmed independently: "OT or ICS disruption is not confirmed in this incident."
      Handala explicitly claimed it chose not to disrupt water supply — BeyondTrust's threat advisory ("Operation Epic Fury") characterises this as the psychological operation itself, noting Handala "operates at wartime tempo" in the context of Iran-US tensions. The claimed motivation was retaliation for US military action targeting Iranian water infrastructure.
      Defender takeaways: (1) Any internet-facing GNSS/RTKBase, industrial IoT, or OT-adjacent platform with default or stale credentials is an active Handala target; (2) RTKBase instances run by water utilities, energy companies, and construction/survey contractors should be placed behind MFA-enforced VPN/ZTNA immediately; (3) Credential hygiene across NTRIP mountpoints is critical — Handala published the mountpoint-level source password; (4) Network segmentation between GNSS/billing/OT layers must be validated; pivot from a GPS correction server to a customer-data system indicates segmentation failure. No OT impact here, but BeyondTrust and Security Magazine experts note Handala has demonstrated capability in past campaigns to escalate to MBR-wiping data destruction.
      RECENCY NOTE: The primary sources (SecurityWeek, SecurityAffairs) were published June 12, 2026 — outside the 36-hour window (window start: ~June 13 16:09 UTC). The SecurityWeek article was updated June 13 at 06:28 UTC — still before the window. This item is included because it is geopolitically significant (Iran-US tension, critical infrastructure), technically rich (novel access vector via RTKBase), and multi-source verified. The main agent should apply recency policy and may elect to carry as context/background or drop per strict window enforcement.
    ch_eu_nexus: "Limited direct — Cal Water is a US utility; however, European water utilities operate similar RTKBase GNSS platforms and the access vector (exposed internet-facing NTRIP caster) is generic. Swiss and EU water utilities should audit for exposed RTKBase instances."
    public_sector_nexus: "indirect — private water utility; critical infrastructure sector"
    sector: "water / critical infrastructure"
    cves: []
    actors_campaigns_malware: ["Handala", "Void Manticore", "Operation Epic Fury (BeyondTrust designation)"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Iran-linked hacking group Handala has leaked 5GB of data allegedly stolen from Cal Water, including PII and administrative credentials."
        attribution: "SecurityWeek"
        source_url: "https://www.securityweek.com/iranian-cyber-group-handala-claims-cal-water-hack/"
      - quote: "Nothing in the published evidence supports Handala's claim that it can shut off water in U.S. cities. Dataminr assesses that the group reached a GPS correction server and a customer billing database. Neither system controls water treatment or distribution, and Dataminr states that OT or ICS disruption is not confirmed in this incident."
        attribution: "Security Magazine (citing Dataminr / BeyondTrust CISO Sean Malone)"
        source_url: "https://www.securitymagazine.com/articles/102368-security-experts-discuss-validity-of-handalas-cal-water-hacking-claim"
      - quote: "The attackers were able to enumerate IP addresses and target an active RTKBase instance that had been continuously online for 783 hours. Organizations should conduct an immediate external attack surface audit to identify any internet-facing OT, GNSS, or industrial IoT applications."
        attribution: "Security Magazine (citing John Gallagher, VP, Viakoo)"
        source_url: "https://www.securitymagazine.com/articles/102368-security-experts-discuss-validity-of-handalas-cal-water-hacking-claim"
    extended_notes: |
      RTKBase is open-source GNSS base-station software widely deployed in infrastructure, surveying, and utility environments globally — including by water utilities, telecoms, and public-works departments across Europe. The attack pattern (internet-exposed NTRIP caster → credential harvest → lateral pivot to billing/IT) is likely replicable across any organisation running an unpatched, internet-facing RTKBase instance. Swiss cantonal utilities and EU municipal water operators should check their external attack surface.

