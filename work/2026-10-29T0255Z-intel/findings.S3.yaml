    role: primary
  discovery_trace: 'first seen at: socket-dev-blog, feed URL https://socket.dev/api/blog/feed.atom (item ''Searchjacked: Hidden Browser Extensions Hijack Searches for 13 Million Users'', 2026-10-29T02:01:54Z) -> primary: Socket post read with WebFetch (extract returns only the first paragraph of this client-rendered page), URL https://socket.dev/blog/searchjacked'
  summary: Socket reports (2026-10-29) 319 distinct browser extensions, installed by roughly 13.4 million users over about a decade, whose only function is to change the browser's default search provider to an operator-run proxy; the behaviour sits entirely in a manifest search-provider override, so a sample extension requests no permissions and has no background worker, content script or interface. Each query passes through the proxy, which can log the search history against a persistent identifier and forwards it to Yahoo or Bing with affiliate tags; in one test six identical searches through one proxy ended in four different destinations, which Socket reads as the ability to swap results for lures later. Most of the extensions are unlisted in the Chrome Web Store, are promoted through paid advertising pop-overs and pop-unders on low-quality sites under generic names, and Socket names about two dozen companies as operators. Socket argues an extension whose only function is intercepting searches should be treated as malicious by definition. No attack on organisations, credential theft or code execution is reported; the risk is exposure of search terms and a ready-made redirection point.
