  summary: 'ThreatLabz adds telemetry to the Node2Shell story that the entry lacks: within the first 24 hours after the 2026-10-21 disclosure, Zscaler Deception''s global decoy mesh recorded activity from 20 source addresses against 12 customers across 402 events, 40% reconnaissance and 60% exploitation attempts, with seven payload families that include malformed-stream probes, short block-switch out-of-bounds-write seeds, a decompression-bomb probe and a three-stage Node2Shell chain with a Strapi probe. These are decoy sensors, so the counts show attacker interest rather than compromise; the entry already carries CISA''s KEV listing and ELLIO''s exploit traffic, and ThreatLabz reports no successful intrusion. ThreatLabz also names both reachability paths (a crafted request body with Content-Encoding: br to a server-side decoder, or a crafted response consumed through fetch(), webhooks, URL previews, crawlers or API integrations) and adds fixed versions the entry does not list: Java brotli4j 1.24.0 and Debian libbrotli 1.1.0-2+deb13u1, besides Bun 1.4.4, .NET 8.0.33, 9.0.22 and 10.0.14.'
