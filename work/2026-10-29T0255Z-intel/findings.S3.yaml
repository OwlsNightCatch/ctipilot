  discovery_trace: 'first seen at: talos, RSS feed URL https://blog.talosintelligence.com/rss/ (newest item Wed 28 Oct 2026 21:32 GMT) -> primary: Talos post, URL https://blog.talosintelligence.com/uat-11473-keydrift/ -> pivot: Cisco PSIRT advisory linked in the post, URL https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-sdwan-rpa-EHchtZk (revision 2.1 of 2026-OCT-28 adds the Talos link under Exploitation) -> pivot: Lumen Black Lotus Labs ''Silent Train'' post linked by Talos, URL https://www.lumen.com/blog/en-us/silent-train-volt-typhoon-operational-framework'
  summary: Cisco Talos reports (2026-10-28) a cluster it designates UAT-11473, which exploited CVE-2026-20127, the peering-authentication bypass in Cisco Catalyst SD-WAN Controller, Manager and Validator (CVSS 10.0, Cisco advisory first published 2026-02-25, no workaround), and then installed KeyDrift, a custom framework that lives inside the SD-WAN control-plane processes. PolyFlame, its main module, is a memory-resident library that a ptrace-based injector places into the running vdaemon processes from modified runit service launchers (the sshd service and a look-alike aaamgr service); it hooks recvfrom, sendto, dlopen and dlsym, receives tasking in-band over the control-plane DTLS traffic rather than from a fixed beacon address, offers a TinyShell-style command, file-write and file-read backdoor, and can act as a one-to-many intermediate C2 relay to peers. LittleFilch hooks SSL_read in vdaemon, parses decrypted control messages for peer system IPs and what Talos assesses to be OMP-distributed AES-256 IPsec data-plane key material for a predefined list of edge nodes, RSA-encrypts the result in a staging file and can send it out over UDP in DTLS-like records. Talos states the observed targeting spans space and satellite services, defense and aerospace technology, and policy research, and assesses with high confidence that the operating infrastructure overlaps considerably with Volt Typhoon's Silent Train covert access network; Lumen's Black Lotus Labs, from its own network telemetry, separately says Volt Typhoon exploited CVE-2026-20127 from late 2025. Cisco PSIRT revised its advisory on 2026-10-28 to cite the Talos post and says it is aware of limited exploitation. Talos recovered no fixed callback address or domain from the PolyFlame samples, calls the activity historical, and does not say how many controllers were affected.
  region_nexus: global; any Swiss public-sector WAN that runs Cisco Catalyst SD-WAN controllers (reported victim sectors are space, defense and policy research, not public administration)
  primary_sector_nexus: 'indirect to direct: direct for administrations operating SD-WAN controllers, targeting reported by Talos is not public-sector'
