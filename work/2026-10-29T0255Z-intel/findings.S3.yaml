    summary: npm worm campaign (19 packages, 19-27 October 2026) that SafeDep calls a Miasma-family build with the Mini Shai-Hulud wiper; JFrog links 42 armed GitHub repositories and cPanel exploitation artifacts to it; latest build starts at package import so --ignore-scripts does not protect (SafeDep, JFrog, 2026-10-26/27).
  relation_suggestions:
  - subject: campaign:testmetest-npm-worm-2026-10
