  summary: Check Point Research describes a campaign it calls Yoba, tracked for two months, in which fake GitHub projects and GitHub.io pages impersonate AI desktop apps (named like unreleased GPT and Claude models) and rank in Google results, probably through SEO poisoning. The ZIP release places a malicious winmm.dll next to a legitimate signed Setup.exe from OpenAI or Anthropic, which sideloads it; the dropper needs administrator rights, skips CIS keyboard locales, copies a legitimate Windows Media Player executable into a ProgramData folder with a payload DLL and persists through a scheduled task that carries a Microsoft-themed author and description. The loader reads a Telegram channel, derives a domain from the channel's image through a generator, queries Google's DNS-over-HTTPS API for an encrypted TXT command and downloads the payload from a file-hosting site, then injects it into svchost.exe, runs it from a temp folder after removing the Zone.Identifier stream, or runs it as a hidden PowerShell script; the payload seen was an XMRig miner that reaches its pool through Tor, but Check Point stresses the loader is generic and can deliver any PE or PowerShell payload. The actor shows indicators suggesting Russian origin and mostly operates in UTC-4; an earlier dropper from early June 2026 was sideloaded by a process named Cursor.exe. Single-vendor report; no victim sector or count is given.
