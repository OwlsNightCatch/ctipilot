  extended_notes: 'EXPOSURE (Cisco advisory as read 2026-10-29, revision 2.1): first fixed releases by train are 20.9 -> 20.9.8.2; 20.12 -> 20.12.5.3 (20.12.6.1 for the 20.12.6 train); 20.15 -> 20.15.4.2; 20.18 -> 20.18.2.1; 20.11 -> 20.12.6.1; 20.13 and 20.14 -> 20.15.4.2; 20.16 -> 20.18.2.1; releases earlier than 20.9 must migrate; Cisco marks 20.11, 20.13, 20.14, 20.16 and earlier-than-20.9 as past End of Software Maintenance. The table was revised on 2026-02-27 and again with the 2026-06-16 Validator addition, so re-read the live page. Cisco''s only interim mitigation is restricting reachability of the control components per its ''Firewall Ports for Cisco Catalyst SD-WAN Deployments'' guidance.

    POST-PATCH CHECK: the fix closes the entry path but does not remove a resident implant. Talos describes persistent controller residence, so a controller that was reachable on a vulnerable release at any time since late 2025 (Lumen) should be checked, not only patched. Talos names the hunt surface in behavioural terms: runit service run scripts for the sshd and aaamgr services carrying extra lines that remount the writable overlay root executable and start a background script; an aaamgr service that runs a compiled, packed ELF where the legitimate component is a Python package; extra libraries mapped into vdaemon processes and ptrace activity against them; encrypted staging files under /var/tmp; timestomping with reference-file touch/chmod commands. Talos lists Snort SIDs (v2 67387-67416, v3 7:44-7:73; CVE-2026-20127 SIDs 65938, 65958) and tells operators to open a Cisco TAC case on any sign of compromise.

    REGISTRY NOTE: the registry already holds actor:uat-8616 (Talos-named SD-WAN exploiter). This Talos post does not state whether UAT-11473 and UAT-8616 are related; do not link them without a source. ''historical'' in the Talos title refers to the observed activity; the post does not say whether it is ongoing.

    Dropped from the summary on purpose: file hashes, recovered file names and network indicators (no-IOC policy).'
- title: 'Dream Research: a custom PHP2Shell build chained with the Fragnesia kernel flaw rooted 24 firewalls and an internal management server at a US government-affiliated organisation'
  sources:
  - url: https://dreamgroup.com/blog/chained-php2shell-exploit-roots-25-servers
    publisher: Dream Research
    date: '2026-10-27'
    role: primary
  - url: https://www.wordfence.com/blog/2026/10/php2shell-update-still-no-confirmed-wordpress-compromises-and-answers-to-the-questions-were-hearing-most/
    publisher: Wordfence
    date: '2026-10-28'
    role: corroborating
  - url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
    publisher: CISA KEV catalog
    date: '2026-10-28'
    role: corroborating
  discovery_trace: 'first seen at: wordfence, feed URL https://www.wordfence.com/feed/ (item PHP2Shell Update: Still No Confirmed WordPress Compromises, 2026-10-28 18:26 UTC) -> pivot: Wordfence post, URL https://www.wordfence.com/blog/2026/10/php2shell-update-still-no-confirmed-wordpress-compromises-and-answers-to-the-questions-were-hearing-most/ (its sources list names the Dream report) -> primary: Dream Research report, URL https://dreamgroup.com/blog/chained-php2shell-exploit-roots-25-servers -> corroboration of the chain: CISA KEV entry for CVE-2026-46300 (bridge cisa-kev, catalogVersion 2026.10.28), URL https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json'
  summary: Dream Research reports (page metadata 2026-10-27; Wordfence dates the report 2026-10-26) artifacts it found on 2026-10-25 of a campaign that paired a custom, non-public PHP2Shell exploit (CVE-2026-109618 and CVE-2026-109619) with the Fragnesia kernel privilege escalation (CVE-2026-46300) against the management web interface of an unnamed vendor's firewall software, which Dream says embeds PHP 8.0.30 behind appweb; the chain needs one unauthenticated HTTPS request, runs the PHP stage as the unprivileged web user and uses a page-cache write to swap the su PAM rules for an accept-all module, so root follows in under 15 minutes (Dream's figures). From about 19,000 internet-facing devices found through the FOFA search engine, about 5,000 answered a version probe, 240 matched the targeted countries (US, Japan, Taiwan, South Korea) and the exploit's per-version memory profiles, and 24 firewalls were rooted; for 22 of them the operator only planted a root webshell and left. At a US government-affiliated organisation the operator, between 2026-10-23 and 2026-10-24, rooted two firewalls, built an eight-port reverse SSH tunnel and a SOCKS proxy that survive reboots (systemd service plus rc.local), ran the same chain against the internal firewall-management server that manages all the organisation's firewalls, decrypted the stored LDAP service-account password, enumerated the Active Directory and then, in scripts Dream recovered, sprayed passwords (the domain has no lockout threshold), tried to create user and machine accounts and probed the Keycloak SSO; the outcomes of those steps were not among the recovered artifacts. Dream does not name an actor and says several indicators point to a China-nexus operation (target countries, a Chinese reconnaissance platform and tunnelling utility, Chinese language models and Chinese-language prompts in an AI scanning platform, and a UTC+8 infrastructure clock), found Claude Code installed on the infrastructure, and has no direct evidence that AI wrote the exploit. The vendor is undisclosed and was notified, no victim is named, and Wordfence, which relays the report, says it has not verified the incident. CISA's KEV entry for CVE-2026-46300, added 2026-10-28, independently states that the kernel flaw 'can be chained with CVE-2026-109618 and CVE-2026-109619 to implant PHP webshells and run commands as root'. This is the first source in the store that ties the PHP flaws to a production compromise of named CVEs through a chain; the existing entry says no source does.
  region_nexus: global; targeted countries US, Japan, Taiwan, South Korea; victim is a US government-affiliated organisation; no Swiss victim reported
