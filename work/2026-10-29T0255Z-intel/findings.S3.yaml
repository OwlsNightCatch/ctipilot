  evidence:
  - quote: On October 25, Dream researchers uncovered artifacts of what appeared to be a Chinese AI-assisted campaign that rooted 25 servers, including systems in a US government-affiliated environment.
    attribution: Dream Research
    source_url: https://dreamgroup.com/blog/chained-php2shell-exploit-roots-25-servers
  - quote: The total chain — from unauthenticated HTTPS connection to persistent root webshell — completes in under 15 minutes.
    attribution: Dream Research
    source_url: https://dreamgroup.com/blog/chained-php2shell-exploit-roots-25-servers
  - quote: We do not attribute this activity to a named threat actor.
    attribution: Dream Research
    source_url: https://dreamgroup.com/blog/chained-php2shell-exploit-roots-25-servers
  - quote: The public report does not identify the affected vendor or publish the recovered artifacts, and we have not independently verified the incident.
    attribution: Wordfence
    source_url: https://www.wordfence.com/blog/2026/10/php2shell-update-still-no-confirmed-wordpress-compromises-and-answers-to-the-questions-were-hearing-most/
  - quote: This vulnerability can be chained with CVE-2026-109618 and CVE-2026-109619 to implant PHP webshells and run commands as root.
    attribution: CISA KEV catalog
    source_url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
  extended_notes: 'DATE CONFLICT: Dream''s page metadata gives 2026-10-27 (17:02 UTC in its structured data) while Wordfence lists the report under 2026-10-26; both are stated, the exact first posting time is unknown.

    OVERLAP: S1 carries the KEV row for CVE-2026-46300 (kev-duty lead ''PHP2Shell chain per KEV shortDescription''); this item is the research source behind that row. The Fragnesia entry is 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x (KEV listing = exploitation-status change, its cves[] record is COVERED-STALE).

    FACT / CLAIM / INFERENCE: facts = the KEV text; claims = everything about the incident (single vendor, vendor and victim unnamed, recovered artifacts not published, outcomes of the AD steps unknown); inference = Dream''s China-nexus reading rests on target countries and tooling, and Dream itself declines to name an actor.

    DETECTION (telemetry classes, from the Dream chain description): web access logs on the appliance management interface showing a burst of very large multipart POST requests with oversized filenames and session-progress fields, then an out-of-bounds-read style request whose response Set-Cookie header carries a pointer value (stages A1/B1); worker crashes and memory-exhaustion errors in PHP logs (''in Unknown on line 0''); a shell spawned directly by the web worker running as the unprivileged web user; integrity change to the su PAM rule file (replaced with an accept-all module); a new small PHP file in a publicly served directory; a new systemd unit or rc.local line on an appliance and a long-lived outbound SSH session from a firewall to an unfamiliar host; on the management server, LDAP binds from the stored service account outside normal VPN-authentication patterns; in the directory, a password spray against all accounts where lockoutThreshold is 0 and machine-account creation under the default MachineAccountQuota.

    POST-PATCH: parked webshells, tunnels and harvested keys (HA replication, TLS and device-authentication keys) survive a patch; Dream says the tunnel at the government victim was likely still active. Rotating the LDAP service-account password and re-keying certificates is part of eviction.

    HARDENING LEVERS named or implied by the source: management interfaces must not be internet-reachable (''should never have been exposed''); set an account lockout threshold; reduce MachineAccountQuota; embedded PHP 8.0.30 is end-of-life and only the vendor can fix it; kernel fix for CVE-2026-46300.

    Not carried: the vendor-specific version profiles, hashes and any addresses (no-IOC policy).'
- title: CVE-2026-41709 (ESX command-logging bypass) is on CISA KEV after CrowdStrike names WARP PANDA as exploiting it as a zero-day in vCenter environments
