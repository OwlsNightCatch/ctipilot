    attribution: Huntress
    source_url: https://www.huntress.com/blog/attackers-turn-mdm-into-remote-access
  - quote: removing it does not remove the unauthorized management architecture that delivered it.
    attribution: Huntress
    source_url: https://www.huntress.com/blog/attackers-turn-mdm-into-remote-access
  - quote: The sequence of events observed makes for a stronger signal—social engineering -> a new MDM enrollment -> RMM installation -> outbound communication with an unfamiliar relay.
    attribution: Huntress
    source_url: https://www.huntress.com/blog/attackers-turn-mdm-into-remote-access
  extended_notes: 'EXPOSURE: any managed Windows endpoint whose users can run an MSI or follow an enrollment link and whose organisation has no inventory of authorised MDM tenants, agents and RMM instances; Huntress names Hexnode and Rippling as the two MDMs seen and says the list is not definitive.

    DETECTION (telemetry classes): process creation of msiexec from a browser temp-download path installing an MDM agent not in the approved inventory; registry keys that mark MDM enrollment appearing on a device nobody enrolled; a new SYSTEM-level agent daemon in a vendor directory shortly after a click; an RMM install (ScreenConnect) launched by the MDM agent, followed by outbound connections to an unfamiliar relay on port 8041; and recurrence of the same RMM relay after the RMM was removed. Huntress''s best signal is the chain social engineering, new enrollment, RMM install, unfamiliar relay, correlated across identity, MDM, endpoint and network telemetry.

    POST-REMOVAL CHECK: removing the RMM is not eviction; unenroll the endpoint from the unauthorised MDM tenant, disable attacker-created accounts, revoke sessions and tokens, reset credentials, and reimage if integrity cannot be confirmed (Huntress mitigation list).

    TRIAGE: a corporate MDM enrolment run by IT looks similar in process telemetry; the discriminators the source supports are the tenant (not in the authorised inventory), the trigger (an emailed link or a user-run installer rather than the IT enrolment workflow) and the RMM install plus unfamiliar relay that follow within minutes. Dropped: domains, URLs and file names (no-IOC policy).'
- title: 'Acronis TRU: Qilin''s Rust encryptor drives ESXi through a PowerCLI script that resets host passwords and enables SSH; Securotrop and The Gentlemen trace back to Qilin operators'
  sources:
  - url: https://www.acronis.com/en/tru/posts/inside-qilin-ransomware-esxi-attacks-affiliate-networks-and-double-extortion/
    publisher: Acronis Threat Research Unit
    date: '2026-10-28'
    role: primary
  discovery_trace: 'first seen at: acronis-tru, feed URL https://www.acronis.com/en-us/tru/feed.xml (item ''Inside Qilin ransomware: ESXi attacks, affiliate networks and double extortion'', 2026-10-28 03:08 UTC) -> primary (no pivot needed): URL https://www.acronis.com/en/tru/posts/inside-qilin-ransomware-esxi-attacks-affiliate-networks-and-double-extortion/'
  summary: Acronis TRU's analysis of a Windows Qilin (Agenda) sample, published 2026-10-28, describes a 4.69 MB Rust executable that refuses to run without a '-password' argument (checked by SHA-256; the same value is the mutex name), can duplicate and impersonate another process's token ('-impersonate') and carries a JSON configuration with an RSA key, directory, file and extension exclusions, process and service lists that name virtualisation, backup, SQL, Exchange, SAP, Veeam and Acronis components (Acronis calls them blacklists), and a per-victim company ID that becomes the file extension. On a hypervisor guest (CPUID bit check) with VM targeting configured, it runs a stored PowerShell script that installs .NET and NuGet if missing, changes PowerCLI settings, disables cluster services, lists ESXi hosts, changes ESXi passwords, enables ESXi SSH, alters host configuration and uploads and executes payloads on the hosts. Before encrypting it creates a Run-key value with a random six-letter name, enables remote-to-local and remote-to-remote symbolic-link evaluation with fsutil, sets EnableLinkedConnections, enumerates mapped drives with 'net use', deletes all volume shadow copies with vssadmin and starts a thread that enumerates processes and services and stops services, checking names against its embedded lists; it encrypts with AES in counter mode when AES-NI is present and otherwise ChaCha20, wraps a per-file 32-byte key with RSA-4096, drops README-RECOVER-<company id>.txt notes and writes per-thread logs to a QLOG folder that it zips into QLOGS.zip, which Acronis says the operator can exfiltrate. Acronis counts more than 1,000 claimed victims in 2025 and more than 900 in 2026, about 13.3% in health care, says affiliates get in through phishing, stolen VPN and RDP credentials, vulnerable internet-facing applications and remote-management tools, and links Qilin to Moonstone Sleet and, as an alleged partnership, to Scattered Spider. It also says Qilin operators founded The Gentlemen and Securotrop, and that Securotrop stays in the Qilin affiliate network with its own leak site; Qilin additionally publishes through the WikiLeaksV2 clearnet site. Single-vendor analysis of one sample; no initial-access evidence of its own.
  region_nexus: global; Qilin targets US, Canada and Europe and excludes CIS countries per Acronis
  primary_sector_nexus: 'indirect to direct: health care is about 13.3% of victims; any administration with ESXi estates is within the technique'
