  summary: 'The existing entry covers the public local root exploit for ZDI-CAN-33367, an skb_zerocopy() page-cache write that gets past the Dirty Frag fix, with no CVE and no merged fix. Since then AlmaLinux updated its post on 2026-10-28: the fix is now in the production repositories, from kernel-4.18.0-553.178.1.el8_10 (AlmaLinux 8), kernel-5.14.0-687.60.1.el9_8 (AlmaLinux 9) and kernel-6.12.0-211.69.1.el10_2 (AlmaLinux 10), and no longer needs the testing repository. TuxCare reports (status of 2026-10-27) KernelCare rebootless patches for EL10 (shipped 2026-10-23) and EL9 (2026-10-26) across AlmaLinux, CloudLinux, RHEL, Oracle Linux and Rocky Linux, EL8 ready for release, CloudLinux 7h and 8 kernels in beta, Debian and Ubuntu work in progress with no date, and that EL6 and EL7 kernels are not vulnerable; Sysdig repeats on 2026-10-28 that the upstream fix has been accepted in the networking tree but has not reached mainline, that there is still no CVE and that no exploitation in the wild has been reported, and notes that The Hacker News rates ZDI-CAN-34076 at CVSS 8.6, which Sysdig had not rated. Until a kernel update is available, TuxCare names disabling unprivileged user namespaces (user.max_user_namespaces=0) as the main stop-gap and says Ubuntu 24.04''s AppArmor restriction does not stop the public exploit; on hosts that need namespaces it points to blocking the two modules the exploit needs.'
