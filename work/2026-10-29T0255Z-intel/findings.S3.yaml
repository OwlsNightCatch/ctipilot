  summary: 'Four 2026-10-27/28 sources add measurement and one contested claim to the PHP2Shell story. Wiz reports that its telemetry shows a roughly 67% fall in the daily number of distinct internet-exposed machines vulnerable to PHP2Shell since disclosure, a 47.9% fall in organisations with at least one exposed vulnerable instance, and a drop in the share of exposed vulnerable hosts on PHP 7.3 or earlier, which received no official backport, from 8.3% to 5.7% over five days; it adds that the exploitation attempts it captured, from two open-source exploit-kit variants, had not succeeded (one ran into request-size limits, the other exhausted memory but never obtained the addresses it needs), and that partners have privately shown it working exploits. Qualys, from anonymised data on more than 10,000 customers, counts 167 million PHP installations of which 110 million (71%) run end-of-life branches from 5.4 to 8.1 that will not get an official patch. OX Security''s day-five figure that 93.6% of 2.2 million internet-facing PHP instances on Shodan still ran vulnerable versions is relayed by Morphisec; the OX page returned 403 on every transport, so that number is second-hand and measures a different population than Wiz''s trend. Wordfence says that between 2026-10-23 and 2026-10-27 its rule recorded about 77,600 related requests from more than 2,000 addresses and that, as of 2026-10-28, it knows of no WordPress site compromised through PHP2Shell. Morphisec claims the first Windows case: on a customer''s IIS server the IIS worker process started the PHP-CGI handler, which ran a command shell and then a packed binary that tried to open a reverse shell, which its memory-randomisation product blocked; Wordfence notes Morphisec does not tie it to WordPress and gives too little detail to verify that PHP2Shell was the cause, and Morphisec says it did not detect the PHP flaw itself.'
