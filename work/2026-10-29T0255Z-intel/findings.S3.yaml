  - quote: Securotrop remains part of the Qilin affiliate network while operating a separate data leak site.
    attribution: Acronis TRU
    source_url: https://www.acronis.com/en/tru/posts/inside-qilin-ransomware-esxi-attacks-affiliate-networks-and-double-extortion/
  - quote: Before encryption, Qilin deletes all available Volume Shadow Copies using
    attribution: Acronis TRU
    source_url: https://www.acronis.com/en/tru/posts/inside-qilin-ransomware-esxi-attacks-affiliate-networks-and-double-extortion/
  - quote: Obtain a list of ESXi hosts
    attribution: Acronis TRU
    source_url: https://www.acronis.com/en/tru/posts/inside-qilin-ransomware-esxi-attacks-affiliate-networks-and-double-extortion/
  extended_notes: 'DETECTION (telemetry classes): process-creation command lines for fsutil behavior set SymlinkEvaluation R2R:1 and R2L:1 and a write to the EnableLinkedConnections policy value, close in time to ''vssadmin delete shadows /all /quiet''; a Run-key value with a random six-letter name that points to an executable with arguments; PowerShell or PowerCLI module installation on a Windows host that has network reach to vCenter or ESXi, followed by ESXi-side events for SSH enablement, root password change and file upload; a QLOG directory under the user''s temp path and a QLOGS.zip; README-RECOVER-<id>.txt notes. Acronis''s own recommendations are generic (EDR, phishing-resistant MFA on remote access, patching, PowerShell/admin-tool monitoring, isolated backups).

    TRIAGE: fsutil symlink evaluation changes, EnableLinkedConnections and shadow-copy deletion each occur in legitimate admin and backup work; the combination in one process lineage, from a user-writable path and followed within minutes by hypervisor administration changes, is the discriminating pattern (my reading of the described sequence, not a source claim).

    HARDENING that follows mechanically from the script: treat ESXi SSH enablement and root password changes as alert-worthy events, restrict which hosts can reach vCenter/ESXi management, and keep backups off the domain. The sample''s exclusion lists and hashes are not carried (no-IOC policy).'
- title: 'ZDI-CAN-33367: first fixed kernels ship (AlmaLinux 8/9/10 production, KernelCare EL9/EL10 rebootless); upstream fix still not in mainline, Debian and Ubuntu undated'
