- title: 'Eclipse Vert.x CVE-2026-102479: a mistyped Content-Xength header is read as Content-Length, enabling request smuggling and response poisoning behind real reverse proxies (vertx-core 5.0.0-5.0.12, 5.1.0-5.1.9, 5.2.0)'
  sources:
  - url: https://research.jfrog.com/post/byte-debt-vertx-header-typo-session-fixation/
    publisher: JFrog Security Research
    date: '2026-10-28'
    role: primary
  - url: https://github.com/eclipse-vertx/vert.x/commit/317c778d7fdd92a2fb0757dabc68a31f8c98edb0
    publisher: Eclipse Vert.x (fix commit)
    date: '2026-09-23'
    role: corroborating
  discovery_trace: 'first seen at: jfrog-security-research, feed URL https://research.jfrog.com/rss.xml (item ''Byte Debt (CVE-2026-102479): From an HTTP Header Typo to Cross-User Session Fixation'', 2026-10-28) -> primary: JFrog post, URL https://research.jfrog.com/post/byte-debt-vertx-header-typo-session-fixation/ -> pivot: fix commit linked from the post, URL https://github.com/eclipse-vertx/vert.x/commit/317c778d7fdd92a2fb0757dabc68a31f8c98edb0'
  summary: 'JFrog describes (2026-10-28) a flaw in the HTTP/1 request decoder of Eclipse Vert.x: to avoid string allocations the decoder recognises well-known header names by length and by sampling some byte offsets, and for a 14-byte name it never checks the letter at offset 8, so Content-Xength is parsed as Content-Length while a front-end proxy ignores it as an unknown header. That framing disagreement lets one request leave the backend waiting for body bytes the proxy never saw, which JFrog turns into a connection hang that starves the next request and, with a one-byte ''dangling'' trailer that keeps proxies from discarding the dirty connection, into delivery of an attacker-chosen response to the next visitor; in its lab with a Quarkus backend it reproduced cross-user session fixation behind Nginx, HAProxy, Envoy, Traefik, Caddy, Apache httpd and nghttpx, poisoning roughly a quarter to a third of later traffic with a 16-connection pool. The affected vertx-core builds are 5.0.0 to 5.0.12, 5.1.0 to 5.1.9 and 5.2.0; JFrog names 5.1.10 and 5.2.1 as the patched releases and does not list a fix for the 5.0 line. It proved the issue against strimzi-kafka-bridge, camel-quarkus and the TechEmpower benchmark suite in certain proxy setups and says all were notified. The fix commit is public in the project repository; no exploitation in the wild is reported by JFrog.'
  region_nexus: global; Java services built on Vert.x 5.x (including Quarkus apps) behind reverse proxies
  primary_sector_nexus: 'indirect: custom Java applications in administrations or at suppliers'
