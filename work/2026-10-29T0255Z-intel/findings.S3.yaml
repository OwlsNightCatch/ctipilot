  discovery_trace: 'first seen at: cisa-kev bridge (python3 tools/fetch_source.py cisa-kev, catalogVersion 2026.10.28, CVE-2026-41709 dateAdded 2026-10-28) and work/2026-10-29T0255Z-intel/kev-window.txt (COVERED-STALE) -> pivot: CrowdStrike blog post on its Legal Threat Landscape Report, URL https://www.crowdstrike.com/en-us/blog/crowdstrike-2026-legal-threat-landscape-report/ (found through the crowdstrike blog feed sweep) -> primary for exploitation: same CrowdStrike post'
  summary: 'CISA added CVE-2026-41709 (Broadcom VMware ESX ''insufficient logging'', CWE-778) to the Known Exploited Vulnerabilities catalog on 2026-10-28 with a federal due date of 2026-11-11; the KEV record lists ransomware use as unknown and describes the flaw as letting a malicious actor with admin access perform certain operations without being logged. CrowdStrike''s 2026 Legal Threat Landscape Report post of the same day is the first source in the store that says who used it: CrowdStrike states WARP PANDA, a China-nexus cluster, deployed several forms of malware in victims'' VMware vCenter environments and, in several of these cases and as late as early 2026, exploited the ESXi command-logging bypass CVE-2026-41709 as a zero-day. Broadcom fixed it in VMSA-2026-0006 on 2026-07-29, which the existing entry rates as a minor flaw for anyone who treats ESX audit logs as a complete record; the new reporting changes that to a flaw an intrusion set used to hide administrator actions on ESXi hosts, from before the fix existed. CrowdStrike gives no victim names, no count and no detail on the malware or on how administrator access was first obtained. Broadcom''s advisory, as read in its revision VMSA-2026-0006.2 of 2026-08-19, still rates CVE-2026-41709 Low (CVSS 3.1 2.7, administrator privileges required), says only that a malicious administrator could act without the operation being logged and carries no exploitation statement; the fixed builds it lists are ESXi80U3j-25429389 for ESX 8.0, ESXi-9.0.2.0100-25595025 for ESX 9.0, ESXi-9.1.0.0-25370933 for ESX 9.1 and VCF 5.2.4 for VCF 5.x.'
