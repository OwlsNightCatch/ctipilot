  summary: 'Causal Security says its autonomous system Cipher found four memory-safety flaws in EPICS Base, the open-source control-system framework used for accelerators, light sources, telescopes and fusion experiments, in 3 hours 49 minutes with one human approval step, and CISA published them on 2026-10-27 as ICSA-26-300-01. CVE-2026-114595 (CVSS 3.1 9.8) is an integer overflow in sizing a Channel Access write request that lets the server allocate too little memory and then write attacker-influenced bytes past it; CVE-2026-114596 (8.2) is a wrapped extended-header length check in Channel Access that gives a constrained out-of-bounds write and a crash; CVE-2026-114597 (7.5) is an unchecked element count that causes an out-of-bounds read and crash; CVE-2026-114598 (7.5) is a type confusion in pvAccess deserialization reached during connection validation, before it completes. All affect release 7.0.10 and earlier and are fixed in 7.0.11. Causal says the Channel Access flaws need only a normal TCP connection (and a channel for the write paths), no privileged account was needed in its test configuration, access-security rules and network segmentation do not make a malformed message safe, and it did not build a remote-code-execution exploit or test reliability on production builds. Defaults it names: Channel Access on TCP 5064, pvAccess on TCP 5075, discovery on UDP 5064 and 5076. No exploitation in the wild is reported by either source. Swiss link (indirect, from older sources): authors at the Paul Scherrer Institute wrote in 2013 that the SwissFEL Injector Test Facility control system is based on EPICS, so research institutes in the federal ETH domain may run EPICS IOCs; the paper is old and current deployments were not checked.'
