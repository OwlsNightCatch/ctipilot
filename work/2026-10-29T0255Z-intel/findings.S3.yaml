  discovery_trace: 'first seen at: eset, record URL https://www.welivesecurity.com/en/rss/feed/ lagged (newest item 2026-10-26); `extract https://www.welivesecurity.com/en/eset-research/` (the recipe in the eset record''s notes) returned the dated research listing with ''ESET APT Activity Report Q2 2026-Q3 2026, 28 Oct 2026'' -> primary: report page, URL https://www.welivesecurity.com/en/eset-research/eset-apt-activity-report-q2-2026-q3-2026/ -> primary: full PDF read with the pdf recipe, URL https://web-assets.esetstatic.com/wls/en/papers/threat-reports/eset-apt-activity-report-q2-2026-q3-2026.pdf'
  summary: 'ESET published its semi-annual APT Activity Report for April to September 2026 on 2026-10-28, a successor to the Q4 2025-Q1 2026 report already in the store. Its main statements: China-aligned groups focused on governmental targets, with FamousSparrow still active in South America, campaigns that appear to support Chinese law-enforcement action against Southeast Asian scam networks (hotels in Palau, DarkVigil in Sri Lanka) and several clusters against Taiwan''s semiconductor sector; Iran-aligned activity rose again after the outbreak of the US/Israel war on Iran, with OilRig''s FilthyFeline and MuddyWater active mainly against Israel and new or updated malware from BladedFeline and TortoiseShell; Arid Viper was found against what looks like the Palestinian Authority''s foreign ministry. North Korea-aligned actors kept to technology, crypto and developer targets, Ukraine rose in prominence, Lazarus resumed Operation DreamJob against the drone sector, and DeceptiveDevelopment moved from fake job interviews into the wider software supply chain: after a developer falls for a lure, the malware harvests Git credentials, SSH keys and tokens that are used later to inject code into the victim''s repositories, often rewriting commit history, with affected artifacts distributed through npm, the Go module mirror, Packagist, PyPI and browser-extension marketplaces; ESET assesses most affected projects are small utilities, which points to automated propagation. Russia-aligned groups kept targeting governments, defence and military entities in Europe with far more targets in Ukraine; Gamaredon''s activity fell markedly; ESET describes an active campaign in Ukraine that exploited MDaemon mail servers (returned as a separate item). ESET documents what it believes is the first destructive attack by a Belarus-aligned actor: FrostyNeighbor deployed Chisel, UltraVNC, Cobalt Strike and finally a VBScript wiper through Group Policy against a Ukrainian manufacturing company important to transport, and ESET reads the targeting as closer to Moscow''s priorities than Minsk''s, i.e. a possible proxy role; its chart puts 87.4% of Belarus-aligned initial access on exploitation of public-facing applications and 56.5% of their targets in government and the public sector. On AI, ESET says APT groups use it like mainstream developers (malware and decoy-site development, phishing images, analysis of large data) and that it has not seen AI substantially reshape the APT landscape; it repeats the UAC-0099 trick of planting a nuclear-weapon request in a script comment to trip LLM-based analysis. Chart-derived figures (read from chart text in the PDF; label and value order matched but not visually checked): attack sources China 29.2%, Russia 28.6%, North Korea 21.1%, Belarus 8.1%, Iran 5.4%; targeted sectors in Europe government and public sector 41.1% and defence and aerospace 24.5%, with the report stressing that European activity is concentrated on Ukraine.'
  region_nexus: Europe (concentrated on Ukraine), Asia-Pacific, Middle East, South America; no Swiss-specific content; Europe chart shows government and public sector as the largest targeted sector
  primary_sector_nexus: 'direct as context: government and public sector is the top-targeted sector in ESET''s Europe and Americas charts'
