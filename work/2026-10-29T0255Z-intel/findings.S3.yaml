  evidence:
  - quote: A front-end reverse proxy ignores the typo as an arbitrary custom header, Vert.x parses it as request framing, and the HTTP request boundary instantly desyncs.
    attribution: JFrog Security Research
    source_url: https://research.jfrog.com/post/byte-debt-vertx-header-typo-session-fixation/
  - quote: The takeaway isn't that Vert.x as a whole is broken, it is that if you deployed the modern 5.x line during that window, you are potentially vulnerable.
    attribution: JFrog Security Research
    source_url: https://research.jfrog.com/post/byte-debt-vertx-header-typo-session-fixation/
  extended_notes: 'EXPOSURE: read the vertx-core version from the dependency tree (Maven/Gradle) or the Quarkus BOM; the exposure requires a connection-pooling reverse proxy in front. DETECTION: unusual request headers whose names differ from Content-Length by one character in proxy or backend logs, backend connections that stall waiting for body bytes, and responses (such as a login redirect with a session cookie) delivered to the wrong client. Vendor advisory text was not found; the CVE record and OpenCVE were the only other pages seen (aggregator-only for severity; OpenCVE lists 8.7 High, not used).'
  borderline: true
  borderline_reason: narrow exposure window (three 5.x branches), requires a front-end proxy and an application with session or redirect behaviour, no exploitation reported; return for Java-team awareness only
- title: 'Tailworm: Tailscale SSH privilege-boundary flaws disclosed before a fix, patched in Tailscale 1.104.4 on 2026-10-27; headscale exhaustion and a conn25 flaw still open'
  sources:
  - url: https://tailscale.com/blog/tailscale-ssh-findings-fixes
    publisher: Tailscale
    date: '2026-10-28'
    role: primary
  - url: https://tailworm.com/
    publisher: Tailworm report (Erica Windisch, Cyberdione Labs)
    date: '2026-10-27'
    role: primary
  - url: https://www.heise.de/news/Tailscale-SSH-Update-stopft-Tailworm-Sicherheitsluecken-11502847.html
    publisher: heise online
    date: '2026-10-28'
    role: corroborating
  discovery_trace: 'first seen at: heise-sec, feed URL https://www.heise.de/security/feed.xml (item ''Tailscale SSH: Tailworm-Luecke fuehrt zu Root-Rechten und Kompromittierung'', 2026-10-28 11:35 UTC) -> pivot: heise article, URL https://www.heise.de/news/Tailscale-SSH-Update-stopft-Tailworm-Sicherheitsluecken-11502847.html -> primary: Tailscale findings-and-fixes post, URL https://tailscale.com/blog/tailscale-ssh-findings-fixes -> primary: researcher report, URL https://tailworm.com/'
  summary: 'A researcher, Erica Windisch of Cyberdione Labs, published the Tailworm audit report on 2026-10-24, two hours after sending it to Tailscale (Tailscale''s account); it covers Tailscale 1.104.2, the headscale 0.29.5 control server and the experimental conn25 app connector, tested 2026-10-22 to 2026-10-24. The headline findings are in the root-run Tailscale SSH server: unix-socket forwarding (ssh -L and -R) performed path checks and file operations as root, and a race defeated the path allowlist, so a session that is already allowed by the tailnet policy could reach root-only sockets, replace root-owned sockets or delete root files; the report demonstrates root through a forwarded Docker socket and rates three such findings High. Tailscale says the flaws concern permissions after a connection was authorised, not who may connect, that exploitation needs an existing foothold on an authorised peer with SSH permitted in the policy file, that they do not make an unauthenticated attacker able to reach arbitrary SSH servers and are not a self-propagating worm, and that fixes, four bulletins (TS-2026-014 to TS-2026-017) and architectural safeguards ship in Tailscale 1.104.4 (tagged 2026-10-27). The report also lists a root tailscaled memory exhaustion through a session, two tailscale serve flaws that expose the local admin API (fixed in 1.104.4), unauthenticated memory exhaustion of headscale that was still pending a headscale-side fix on 2026-10-28, a DERP client memory exhaustion (client fix shipped) and a conn25 egress-selection flaw (open pull request); Tailscale says conn25 is pre-production and the stable app connectors are not affected. Exploitation in the wild is not reported.'
  region_nexus: global; relevant only to administrations and suppliers that run Tailscale or headscale
  primary_sector_nexus: 'indirect: remote-administration and mesh-VPN tooling'
  sector: cross-sector
  cves: []
  techniques:
  - T1068
  - T1021.004
  - T1499
  affected_products:
  - Tailscale
  - Tailscale SSH
  - headscale
  entity_keys: []
  new_entities:
  - key: product:tailscale
    type: product
    name: Tailscale
    aliases:
    - Tailscale SSH
    summary: Mesh VPN and identity-based SSH product; the Tailworm report's SSH unix-socket forwarding findings are fixed in Tailscale 1.104.4 (Tailscale, 2026-10-28).
  verification: MULTI-SOURCE
  confidence: MEDIUM
  novelty: new
  priority_hint: routine
  classification_hint: B2
  evidence:
  - quote: We received the researcher’s report on the morning of Saturday, October 24, and the researcher published it two hours later.
    attribution: Tailscale
    source_url: https://tailscale.com/blog/tailscale-ssh-findings-fixes
  - quote: the vulnerabilities don’t allow an unauthenticated attacker to connect to arbitrary Tailscale SSH servers
    attribution: Tailscale
    source_url: https://tailscale.com/blog/tailscale-ssh-findings-fixes
  - quote: Delete the device at the control plane — reimaging alone is not containment.
    attribution: Tailworm report
    source_url: https://tailworm.com/
  extended_notes: 'FACT / CLAIM SPLIT: the severity ratings, the root demonstrations and the ''fleet-wide privileged access'' framing are the researcher''s; Tailscale disputes the worm framing and bounds exploitation to tailnet-policy-permitted peers. Both are carried.

    EXPOSURE: hosts running tailscaled below 1.104.4 with Tailscale SSH enabled (opt-in per node) and policy rules that allow forwarding; headscale operators whose control server is internet-reachable are exposed to the pending exhaustion issue.

    HARDENING (report and Tailscale): per-pair SSH grants instead of identity- or tag-wide accept rules, forwarding denied unless needed, SSH check mode for sensitive systems, restrict app-connector entitlements.

    DETECTION (report): auditd on unix-socket unlink, bind and chmod in the forwarding-allowed directories (tmp, homes, run/user), a socket with mode 0755 where 0600 is expected as a race signature, alerts on sustained directory rename loops, on authkey issuance outside change windows and on a node key appearing from a new network. CONTAINMENT: delete the device at the control plane because node identity is key material in a state file that root can copy off-box.'
  borderline: true
  borderline_reason: adoption in the Swiss public sector is unknown; privilege escalation requires an existing foothold and an SSH policy rule; uncoordinated disclosure with a fix already shipped
