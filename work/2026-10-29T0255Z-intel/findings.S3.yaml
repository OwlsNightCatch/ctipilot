    attribution: ESET Research
    source_url: https://www.welivesecurity.com/en/eset-research/eset-apt-activity-report-q2-2026-q3-2026/
  - quote: Most notably, we identified the first destructive cyberattack by a Belarus-aligned threat actor that we have documented in the European theater, marking a significant development in this threat nexus.
    attribution: ESET Research
    source_url: https://www.welivesecurity.com/en/eset-research/eset-apt-activity-report-q2-2026-q3-2026/
  - quote: Despite these developments, we have not noticed AI substantially reshaping the APT landscape over the past six months.
    attribution: ESET Research
    source_url: https://www.welivesecurity.com/en/eset-research/eset-apt-activity-report-q2-2026-q3-2026/
  extended_notes: 'ANNUAL REPORT flag per the spawn note: this is ESET''s periodic (half-year) report. The report is the successor of entries/2026-05-30/eset-apt-activity-report-q4-2025-q1-2026-sandworm-strikes-na.md; registry already holds report:eset-apt-activity-report-q4-2025-q1-2026-sandworm-lazarus.

    REGISTRY: FrostyNeighbor (actor:frostyneighbor), UAC-0099 (actor:uac-0099, GuardBreaker technique already recorded from ESET''s 2026-09-10 work) and DeceptiveDevelopment (campaign:contagious-interview carries the alias) exist; PhantomCaptcha, FilthyFeline, BladedFeline, TortoiseShell, Arid Viper, SlippyNunchucks, APT-C-60 and the DEV#POPPER/OmniStealer tooling were not checked against the registry.

    TRANSFERABLE DETECTION CONTENT in the report: DeceptiveDevelopment''s developer-workstation chain (VS Code task, Cursor and Discord persistence for its Node.js RAT, blockchain-transaction C2 resolution, payloads on Gitea, JSON-hosting services and IPFS gateways) relates to the supply-chain items returned this run (testmetest worm); the FrostyNeighbor wiper is delivered through Group Policy, so changes to GPO scripts and scheduled tasks on domain controllers are the telemetry class.

    CAVEATS: ESET''s telemetry is vendor-customer telemetry; the percentages above come from charts whose text was extracted by the pdf recipe without OCR, so treat them as indicative.'
- title: 'MDaemon below 26.0.4: an emailed RAR is enough for code execution because the product shipped a ClamAV UnRAR library with CVE-2025-8088; used against Ukrainian servers with HELLAGE and HELLTAG'
  sources:
  - url: https://web-assets.esetstatic.com/wls/en/papers/threat-reports/eset-apt-activity-report-q2-2026-q3-2026.pdf
    publisher: ESET Research (APT Activity Report, MDaemon section)
    date: '2026-10-28'
