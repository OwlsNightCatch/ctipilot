    basis: 'SafeDep: the worm shares code with Miasma ''Phantom Gyp'' of June 2026 but SafeDep has not confirmed the lineage (SafeDep, 2026-10-22); an overlap claim, not attribution'
  - subject: campaign:testmetest-npm-worm-2026-10
    object: campaign:mini-shai-hulud
    basis: 'SafeDep: the worm adds the token-revocation wiper from Mini Shai-Hulud (SafeDep, 2026-10-22)'
  verification: MULTI-SOURCE
  confidence: HIGH
  novelty: new
  priority_hint: notable
  classification_hint: B1
  lookback: true
  evidence:
  - quote: Any application that imports the package starts the worm. `npm install --ignore-scripts` does not stop it.
    attribution: SafeDep
    source_url: https://safedep.io/testmetest-npm-worm-miasma-variant/
  - quote: The malicious versions steal credentials, spread to other packages and repositories, and install a wiper that deletes the home directory when the victim revokes the stolen GitHub token.
    attribution: SafeDep
    source_url: https://safedep.io/testmetest-npm-worm-miasma-variant/
  - quote: The repositories contain execution hooks for AI coding assistants and IDEs, plus 12.9 to 13.7 MB polymorphic wrappers that all decode to the same hidden CI-publisher payload.
    attribution: JFrog Security Research
    source_url: https://research.jfrog.com/post/beyond-testmetest-42-hijacked-github-repos/
  - quote: The payload blobs were large enough to evade the GitHub search and API paths normally used to find this kind of compromise.
    attribution: JFrog Security Research
    source_url: https://research.jfrog.com/post/beyond-testmetest-42-hijacked-github-repos/
  extended_notes: 'DETECTION (telemetry classes): in package metadata and registries, SafeDep''s rules: a binding.gyp whose sources field runs node in a package with no C/C++ sources; a postinstall that require()s a .node file and swallows errors beside a large high-entropy file; prebuilt addons under prebuilds/<platform>/ with no native source; a package that keeps the staged-publishing stub description in a version other than 0.0.0-stage. On endpoints and CI: a node process that downloads and runs the Bun runtime, a child node process started from a temp path named after its PID, tampering with the Docker socket or the hosts file on a runner (Harden-Runner), and a runner process whose memory is read for secrets. In GitHub and GitLab audit logs: creation of a public repository in a developer''s own account with a generic ''project-utils'' description, pushes whose commit message begins ''AutoSyncComplete:'', unexpected commits adding .claude, .cursor, .gemini, .vscode/tasks.json, CLAUDE.md, AGENTS.md or a fake CodeQL workflow, a GitLab CI job named cache_sync, and unexpected patch releases of your own npm packages.

    POST-COMPROMISE: SafeDep''s remediation is to disconnect the host, remove persistence first, rotate all credentials and reinstall the operating system; the wiper fires when the stolen GitHub token is revoked, so isolate and image the host before revoking (my reading of SafeDep''s description).

    HARDENING NOTE: the npm v12 change that disables install scripts by default (registry policy:npm-v12-install-scripts-default-off-2026) would not stop the load-time trigger; pinning and lockfile review, trusted-publishing scoping and CI egress controls remain the levers named by the sources.

    CAUTIONS: neither lab names an actor or a victim organisation; the cPanel link (CVE-2026-41940, JFrog) is operational overlap, not a proven chain. Account names, repository names, hashes and domains are deliberately not carried (no-IOC policy).'
  borderline: true
  borderline_reason: 'recency: SafeDep''s latest update is 2026-10-27 and JFrog/The Register are 2026-10-26, outside the 26 h window but inside the 72 h developing-story window; never covered in the store; recommend inclusion because the campaign is still evolving and the --ignore-scripts bypass changes a common hardening assumption'
- title: 'Enclave ''AuthMask'': any Android app with no permissions could pose as Teams to Microsoft Authenticator and receive Graph tokens in plaintext (CVE-2026-80097, fixed in 6.2606.4246)'
  sources:
  - url: https://enclave.ai/blog/authmask-we-made-microsoft-authenticator-hand-over-tokens
    publisher: Enclave
    date: '2026-10-25'
    role: primary
  - url: https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-80097
    publisher: Microsoft MSRC
    date: '2026-09-08'
    role: primary
  - url: https://www.heise.de/news/Microsoft-Authenticator-Boesartige-Apps-konnten-Zugangstoken-abgreifen-11503334.html
    publisher: heise online
    date: '2026-10-28'
    role: corroborating
  discovery_trace: 'first seen at: heise-sec, feed URL https://www.heise.de/security/feed.xml (item ''Microsoft Authenticator: Boesartige Apps konnten Zugangstoken abgreifen'', 2026-10-28 13:13 UTC) -> pivot: heise article, URL https://www.heise.de/news/Microsoft-Authenticator-Boesartige-Apps-konnten-Zugangstoken-abgreifen-11503334.html -> primary: Enclave write-up linked by heise, URL https://enclave.ai/blog/authmask-we-made-microsoft-authenticator-hand-over-tokens -> primary: Microsoft MSRC record read through the msrc cve recipe (api.msrc.microsoft.com), human page URL https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-80097'
  summary: 'Enclave''s write-up (page dated 2026-10-25, picked up by heise on 2026-10-28) shows how Microsoft Authenticator for Android handed work-account tokens to an app with no permissions. Authenticator exports an activity, AccountChooserActivity, in its :auth process; the only gate was that a calling activity exists, and every field of the broker request (claimed app name and package, client ID, redirect URI, scopes and the caller UID) came from the caller. The ''valid calling app'' check looked up the signature of the package the caller claimed to be and compared its derived redirect URI with the one in the request, so an app claiming to be Teams could simply send Teams'' own redirect URI, although Authenticator had the real caller''s package name available and did not use it. Tokens came back to the caller in the activity result: access, refresh and ID tokens in plaintext. Enclave obtained delegated Graph access to mail (read, write, send), files, calendars, Teams chat and SharePoint while posing as Teams, a Skype-chat-backend token, and scopes to manage authentication methods and create or delete passkeys while posing as Authenticator itself. Microsoft published CVE-2026-80097 on 2026-09-08 (CVSS 8.6, ''Important'', ''Exploitation Less Likely'', exploited: No in its record as revised 2026-09-15) and fixed it in Authenticator for Android; versions before 6.2606.4246 are affected. The two accounts of the precondition differ: Enclave says no user interaction was needed beyond the broker being present with a signed-in work account, whereas Microsoft''s FAQ says the attacker must convince the user to complete an authentication flow. No in-the-wild exploitation is reported.'
  region_nexus: global; any organisation whose staff use Microsoft Authenticator on Android with a work or school account
  primary_sector_nexus: direct for Microsoft 365 tenants with Android users; fix is a client update, not a tenant setting
  sector: cross-sector
  cves:
  - CVE-2026-80097
  techniques:
  - T1528
  - T1550.001
  affected_products:
  - Microsoft Authenticator for Android
  entity_keys: []
  new_entities:
  - key: product:microsoft-authenticator-android
    type: product
    name: Microsoft Authenticator for Android
    aliases:
    - Microsoft Authenticator
    summary: Microsoft's authenticator and token broker app for Android; versions before 6.2606.4246 carry CVE-2026-80097, a caller-validation flaw that let an unprivileged app obtain tokens (MSRC, 2026-09-08; Enclave, 2026-10-25).
  verification: MULTI-SOURCE
  confidence: HIGH
  novelty: new
  priority_hint: notable
  classification_hint: B1
  evidence:
  - quote: We found that an unprivileged Android app with zero permissions could impersonate any installed Microsoft first-party app and have the Microsoft Authenticator broker hand it that app's tokens.
    attribution: Enclave
    source_url: https://enclave.ai/blog/authmask-we-made-microsoft-authenticator-hand-over-tokens
  - quote: Versions before 6.2606.4246 are affected.
    attribution: Enclave
    source_url: https://enclave.ai/blog/authmask-we-made-microsoft-authenticator-hand-over-tokens
  - quote: An attacker could exploit this vulnerability by installing and running a malicious application on an affected Android device and convincing the user to complete an authentication flow in Microsoft Authenticator.
    attribution: Microsoft MSRC
    source_url: https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-80097
  extended_notes: 'EXPOSURE: Android devices (corporate or personal) with Microsoft Authenticator below 6.2606.4246 and a work or school account signed in; read the installed version from the device or from MDM app inventory. The attacker needs a malicious app already installed on the device.

    DETECTION: neither source offers a detection. Token theft through the broker looks like ordinary broker token issuance, so hunting would start from Entra sign-in logs for first-party client IDs (such as Teams) from unexpected devices or user agents and from Graph activity logs for mailbox, file or calendar access that the user did not perform (my inference; refresh tokens stolen this way stay valid until revoked, so revoke sessions for any user on an affected build who installed an untrusted app).

    NO MDM bypass is claimed; Enclave''s research was part of its Fellowship Program.'
  borderline: true
  borderline_reason: 'recency: Microsoft fixed it on 2026-09-08 and Enclave''s page is dated 2026-10-25, with heise''s pick-up on 2026-10-28 as the in-window source; but the technical detail only became public in the last four days and the fix is a client version check that administrators can verify'
