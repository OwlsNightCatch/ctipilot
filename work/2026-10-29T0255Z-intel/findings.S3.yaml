    publisher: ESET Research
    date: '2026-10-28'
    role: primary
  - url: https://blog.clamav.net/2026/08/clamav-154-and-146-security-patch.html
    publisher: ClamAV (Cisco Talos) release notes
    date: '2026-08-07'
    role: corroborating
  discovery_trace: 'first seen at: eset, `extract https://www.welivesecurity.com/en/eset-research/` dated listing (ESET APT Activity Report Q2 2026-Q3 2026, 28 Oct 2026) -> primary: report page, URL https://www.welivesecurity.com/en/eset-research/eset-apt-activity-report-q2-2026-q3-2026/ (one sentence on MDaemon) -> primary: full PDF read with the pdf recipe, URL https://web-assets.esetstatic.com/wls/en/papers/threat-reports/eset-apt-activity-report-q2-2026-q3-2026.pdf (MDaemon section, p.23) -> pivot: ClamAV advisory found through WebSearch ("MDaemon 26.0.4 release notes libclamunrar ClamAV CVE-2025-8088 fix") and its blog index https://blog.clamav.net/2026/08/, URL https://blog.clamav.net/2026/08/clamav-154-and-146-security-patch.html'
  summary: 'ESET reports an active campaign in Ukraine in which Russia-aligned actors exploited MDaemon mail server software for code execution on the server with no user interaction. MDaemon uses ClamAV to scan attachments; old ClamAV releases carried the WinRAR path-traversal flaw CVE-2025-8088, which ClamAV''s own notes describe as an NTFS alternate-data-stream name with path separators letting extraction escape ClamAV''s temporary scan directory on Windows; ESET says ClamAV fixed it in July 2025 but MDaemon kept shipping an old libclamunrar.dll until MDaemon 26.0.4 on 2026-08-25. The chain ESET describes: a crafted RAR is mailed to any address at a vulnerable server, MDaemon invokes ClamAV to scan it, and the exploit writes a malicious DLL to the server''s file system; because no user interaction is needed the messages carried no lure. The campaign deployed two backdoor families that CERT-UA named: HELLAGE, which steals email and other data, talks to a hardcoded C2 server and can deploy more malware, and HELLTAG, a Telegram-bot-based backdoor for command execution, file transfer and reconnaissance. ESET could not attribute it to a known Russia-aligned actor. ClamAV''s release notes of 2026-08-07 independently confirm the library flaw and widen the exposure: ClamAV 0.101.0 through 1.5.3 is affected on Windows and the fix is in 1.4.6 and 1.5.4, so any Windows host that scans mail or files with ClamAV, not only MDaemon, is in scope. No CVE for the MDaemon packaging issue and no MDaemon advisory were found; CVE-2025-8088 itself has been on CISA''s KEV catalogue since 2025-08-12.'
  region_nexus: Ukraine (observed); any Swiss organisation running MDaemon or Windows-hosted ClamAV scanning
  primary_sector_nexus: 'indirect to direct: MDaemon is a small and mid-size organisation mail server; exposure depends on whether administrations run it'
