  discovery_trace: 'first seen at: crowdstrike, blog feed URL https://www.crowdstrike.com/en-us/blog/feed (item ''CrowdStrike 2026 Legal Threat Landscape Report: eCrime Leads Attacks, China Activity Intensifies'', Oct 28, 2026) -> primary: blog post URL https://www.crowdstrike.com/en-us/blog/crowdstrike-2026-legal-threat-landscape-report/ -> pivot: report landing page URL https://www.crowdstrike.com/en-us/resources/reports/2026-legal-threat-landscape-report/ (gated; summary only)'
  summary: 'CrowdStrike published its 2026 Legal Threat Landscape Report on 2026-10-28, covering 2025-09-01 to 2026-08-31 (full report gated; the blog post and landing page carry the summary). CrowdStrike says intrusions against legal entities nearly doubled between 2023 and 2026, that financially motivated adversaries account for 82% of the activity, and that big-game-hunting groups named 455 legal entities on leak sites, 39% more than the prior period. Three eCrime clusters are profiled: CHATTY SPIDER (activity up 129% in the first eight months of 2026 against all of 2024, mainly US law firms) impersonates IT staff to open remote-access sessions, uses trusted enterprise and RMM tools and, per CrowdStrike, hired people to enter a US law firm in person; SNARKY SPIDER and CORDIAL SPIDER share near-identical tradecraft of vishing calls that impersonate IT personnel and steer staff to single sign-on themed phishing pages. Four China-nexus clusters are named: WARP PANDA (malware in victims'' VMware vCenter environments; ESXi command-logging bypass CVE-2026-41709 exploited as a zero-day as late as early 2026), TITAN PANDA (April 2026, a hardcoded IIS machine key in Intapp Time Server), MURKY PANDA (the ORB28 password-spray campaign, more than 340 mostly US entities, one law firm saw about 500 failed logins from about 300 addresses in 30 days) and OVERCAST PANDA (executive-level targets at a UK firm). Direct relevance to Swiss public bodies is limited (sector is legal, victims mostly US); the transferable material is the help-desk vishing plus SSO-lookalike pattern and the vCenter/ESXi tradecraft.'
