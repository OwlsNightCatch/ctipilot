- title: 'Huntress: phished MDM enrolments (Hexnode, Rippling) give attackers a SYSTEM-level channel that reinstalls ScreenConnect after it is removed'
  sources:
  - url: https://www.huntress.com/blog/attackers-turn-mdm-into-remote-access
    publisher: Huntress
    date: '2026-10-28'
    role: primary
  discovery_trace: 'first seen at: huntress, feed URL https://www.huntress.com/blog/rss.xml (item ''Managed for Malice: How Attackers Turn MDM into Remote Access'', 2026-10-28 16:00 UTC) -> primary (no pivot needed): URL https://www.huntress.com/blog/attackers-turn-mdm-into-remote-access'
  summary: 'Huntress reports (2026-10-28) several recent incidents in which attackers used legitimate mobile-device-management platforms, not flaws in them, as a trusted management path: in the two cases it describes, a phishing victim ended up enrolled in an attacker-controlled MDM tenant and the attacker then pushed an unauthorised ScreenConnect (RMM) agent. In the Hexnode case, proposal-themed emails led to a download, saved in the Edge temporary downloads folder, of an MSI named like a DocuSign installer that actually installed Hexnode MDM components (gateway, agent and a PostgreSQL service); ScreenConnect followed shortly after and connected to an attacker relay on port 8041. The managed-service provider removed ScreenConnect, which came back several hours later to the same relay, because the MDM client that had delivered it was still installed. In the Rippling case a receptionist opened an email about tax-planning with a link to a fake Teams ''Calendar'' page; about a minute after the click a Rippling enrollment registry key appeared, the agent MSI was downloaded into a SYSTEM profile path and installed as a SYSTEM-privileged daemon, and about 35 minutes later the attacker used the MDM to stage and run a ScreenConnect installer as SYSTEM, again to an attacker relay on port 8041. Huntress infers from the online Rippling agent that the actor had already created its own tenant. It names no actor, victim sector or count beyond ''several'' incidents, and the products involved are not at fault.'
  region_nexus: global; no region stated; SMB and MSP-managed endpoints
  primary_sector_nexus: 'indirect: applies to any administration that uses an MDM and an MSP or its own RMM tooling'
