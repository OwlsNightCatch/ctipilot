    ASSESSMENT (mine, from the mechanism, not a source statement): the flaw lets an admin-level actor act without log entries, and the zero-day use predates the 2026-07-29 fix, so ESX-side command logs for the period before patching cannot be treated as complete; vCenter-side records, host configuration state and network telemetry are the cross-check. Patching removes the logging bypass, not malware already planted.

