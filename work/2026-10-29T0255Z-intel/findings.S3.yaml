- title: 'ANNUAL REPORT - ESET APT Activity Report Q2 2026-Q3 2026: first Belarus-aligned wiper, DeceptiveDevelopment moves into the software supply chain, AI used like ordinary developer tooling'
  sources:
  - url: https://www.welivesecurity.com/en/eset-research/eset-apt-activity-report-q2-2026-q3-2026/
