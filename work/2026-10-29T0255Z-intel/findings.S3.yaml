    attribution: ClamAV (Cisco Talos)
    source_url: https://blog.clamav.net/2026/08/clamav-154-and-146-security-patch.html
  extended_notes: 'EXPOSURE: MDaemon Email Server on Windows before 26.0.4 (fixed 2026-08-25 per ESET) that accepts inbound mail, and any other Windows ClamAV 0.101.0-1.5.3 install that scans archives; read the MDaemon version in its About dialog or installed files and the bundled libclamunrar.dll build, and the ClamAV version from clamscan --version. ESET gives no CVE for the MDaemon side and I found no MDaemon advisory (the MDaemon 26.0 release notes page read did not mention it), so the fixed-version statement rests on ESET alone.

    DETECTION (telemetry classes, from the described chain): file creation of a DLL by the ClamAV or MDaemon scanning process outside ClamAV''s temporary scan directory, especially in a program or system directory that the mail service later loads; inbound mail with RAR attachments whose member names contain NTFS alternate-data-stream syntax with path separators; the mail service process spawning unexpected children or making outbound connections to Telegram''s bot API; mail-server hosts reaching out to an unfamiliar hardcoded address after a scan. Because the attack needs no lure, mail logs show an ordinary-looking message with an archive and no user action.

    POST-PATCH: updating does not remove a DLL or backdoor already written; check the mail server for unexpected DLLs and persistence after the update, and treat stored mail as potentially read (HELLAGE steals email).

    FACT / CLAIM: the MDaemon exploitation and version facts are ESET''s; the ClamAV library flaw and version range are ClamAV''s own; the CERT-UA naming of the backdoors is relayed by ESET and not independently read.'
- title: testmetest npm worm (Miasma family with the Mini Shai-Hulud wiper) now starts when a package is imported, so --ignore-scripts no longer protects; 42 real GitHub repositories already armed
  sources:
  - url: https://safedep.io/testmetest-npm-worm-miasma-variant/
    publisher: SafeDep
    date: '2026-10-27'
    role: primary
  - url: https://research.jfrog.com/post/beyond-testmetest-42-hijacked-github-repos/
    publisher: JFrog Security Research
    date: '2026-10-26'
    role: primary
  - url: https://www.theregister.com/security/2026/10/26/worm-armed-42-github-repos-by-hiding-a-payload-too-big-to-fail/5305570
    publisher: The Register
    date: '2026-10-26'
    role: corroborating
  discovery_trace: 'first seen at: theregister-security-feed, URL https://www.theregister.com/security/headlines.atom (item ''Worm armed 42 GitHub repos by hiding a payload too big to fail'', 2026-10-26 23:29 +0100, inside the 145 h lookback) -> pivot: The Register article, URL https://www.theregister.com/security/2026/10/26/worm-armed-42-github-repos-by-hiding-a-payload-too-big-to-fail/5305570 -> primary: JFrog post, URL https://research.jfrog.com/post/beyond-testmetest-42-hijacked-github-repos/ (also surfaced independently by the JFrog feed https://research.jfrog.com/rss.xml) -> primary: SafeDep post, URL https://safedep.io/testmetest-npm-worm-miasma-variant/ (updated 2026-10-26 and 2026-10-27)'
  summary: 'SafeDep and JFrog independently describe a npm worm, which SafeDep calls a Miasma-family build with the token-revocation wiper of Mini Shai-Hulud; neither confirms the lineage and JFrog says the evidence does not establish that the original Miasma operators are behind it. SafeDep counts 19 packages attributed to one operator between 2026-10-19 and 2026-10-27, published through at least four npm accounts, and has tracked three triggers: command expansion in a binding.gyp (no install script), a postinstall script that loads a native addon which XOR-decodes a hidden file and runs it, and, since its update of 2026-10-27, an addon that starts the worm when an application imports the package, so ''npm install --ignore-scripts'' does not stop it. The payload steals SSH keys, npm, PyPI and Git credentials, .env files, browser logins, credentials of AI coding tools, cloud, Vault and Kubernetes secrets and GitHub Actions secrets read from the runner process memory; it exits on CIS locales and sandboxes, and inside GitHub Actions it kills StepSecurity Harden-Runner through the Docker socket and points that vendor''s domains to localhost. It exfiltrates by committing encrypted data, including the victim''s encrypted GitHub token, to a new public repository in the victim''s own account, injects a GitLab CI job that requests npm and PyPI OIDC tokens, publishes new patch versions of the victim''s npm packages and republishes to PyPI and RubyGems, adds AI-agent configuration files that re-infect the host, and wipes the home directory when the stolen GitHub token is revoked. JFrog adds that the operator had already armed 42 third-party GitHub repositories across 11 legitimate owners with hooks for AI coding assistants and editors and 12.9 to 13.7 MB wrapper files that decode to a CI publisher and that evade GitHub''s search and API paths, and that shellpanel artifacts in the same hijacked accounts tie the cluster to earlier GitHub Actions exploitation of cPanel/WHM through CVE-2026-41940, though not as a proven single chain. SafeDep said on 2026-10-22 it had found no compromised third-party packages or victims; JFrog''s later repository finding differs from that, and both views are reported as stated.'
  region_nexus: global; no region stated; affects developers and CI pipelines that install npm packages
  primary_sector_nexus: 'indirect: any administration or supplier building JavaScript software or running GitHub/GitLab CI'
  sector: software-supply-chain
  cves:
