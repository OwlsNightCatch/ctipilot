  - claim_id: eff3d8e0f3
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "record 2026-10-29T07:03:00Z"
    kind: record-summary
    text: "Dream Research reports a production chain of a custom PHP2Shell build with the Linux kernel flaw CVE-2026-46300 that gave unauthenticated root on 24 firewalls of one unnamed vendor and led to an attack on the Active Directory of a US government-affiliated organization; CISA's catalog entry for the kernel flaw of 2026-10-28 says the same chaining. The earlier statement that no source ties a named CVE to a production compromise is replaced, an action for appliances that embed PHP is added, the URWB fix date in the vendor list is corrected from March 2027 to November 2026 (advisory version 1.9), and the PAN-OS hotfix status is updated to nineteen of twenty released (advisory of 2026-10-29). Removed from the text: the sentence on the release time, Karimi's two-source-address-clusters and PHPSESSID remarks in the main text (the 2026-10-27 section keeps his reliability caveat), VulnCheck's failed web-shell attempt in the main text (the Detection line keeps it), the lab log-path remark and most of Sansec's note on its CVE attribution (kept as a short clause); the 'no source ties a named CVE' statement of 2026-10-27 is dated, and the evidence record for Karimi's clusters remark is dropped."
