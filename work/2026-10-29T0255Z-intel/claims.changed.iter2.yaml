claims:
  - claim_id: 38c3de3267
    entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
    surface: "section 2026-10-29T04:52:00Z"
    kind: cited
    text: "CISA added CVE-2026-46300 to its Known Exploited Vulnerabilities catalog on 2026-10-28 and says in the entry that the flaw can be chained with CVE-2026-109618 and CVE-2026-109619 to implant PHP webshells and run commands as root, naming no actor or victim ("
    urls: ["https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"]
  - claim_id: 8aa54c96dc
    entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
    surface: "section 2026-10-29T04:52:00Z"
    kind: cited
    text: "Dream Research describes a chain of this kind from artifacts its tooling recovered: a custom, non-public PHP2Shell build, tailored to the management web server of one large vendor's firewall software that runs PHP 8.0.30, gives code execution as the nobody user, and the Fragnesia exploit then overwrites /etc/pam.d/su in the page cache so that su root succeeds without a password; Dream says SELinux confines the web server's domain from modifying system files and that the whole chain runs in one HTTP request in under 15 minutes ("
    urls: ["https://dreamgroup.com/blog/chained-php2shell-exploit-roots-25-servers"]
  - claim_id: 678e46fe90
    entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
    surface: "section 2026-10-29T04:52:00Z"
    kind: cited
    text: "From about 19,000 internet-facing firewalls of that vendor that it found through a search engine, the attacker narrowed to 240 in the United States, Japan, Taiwan and South Korea, rooted 24 and planted a PHP webshell on each; on two firewalls of a US government-affiliated organization it set up an outbound SSH tunnel kept up by a systemd service and an rc.local entry, rooted the organization's firewall management server through the tunnel, decrypted the LDAP service-account password with root access and sprayed passwords against a domain that had no lockout threshold ("
    urls: ["https://dreamgroup.com/blog/chained-php2shell-exploit-roots-25-servers"]
  - claim_id: 7b63950337
    entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
    surface: "section 2026-10-29T04:52:00Z"
    kind: cited
    text: "Dream could not tell whether any of the Active Directory attacks succeeded, does not name the vendor, calls the campaign apparently Chinese and AI-assisted and does not attribute it to a named actor ("
    urls: ["https://dreamgroup.com/blog/chained-php2shell-exploit-roots-25-servers"]
  - claim_id: f90221692a
    entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
    surface: "record 2026-10-29T04:52:00Z"
    kind: record-summary
    text: "CISA added CVE-2026-46300 to its Known Exploited Vulnerabilities catalog on 2026-10-28 and says it can be chained with the PHP2Shell flaws to implant PHP webshells and run commands as root; Dream Research describes such a chain used against 24 firewalls of one unnamed vendor and a US government-affiliated network. The CVE record moves to exploited, the priority from notable to high, and the earlier statement that no source reports exploitation of this CVE is replaced. The main analysis is shortened to stay within its length limit (the sentence that an attacker can modify any file the user can read is removed; the Detection line still carries it)."
