    surface: "section 2026-10-29T04:53:00Z"
    kind: cited
    text: "CrowdStrike says WARP PANDA deployed several forms of malware in victims' VMware vCenter environments and that in several of these cases, as late as early 2026, the adversary exploited the ESXi command logging bypass CVE-2026-41709 as a zero-day; it describes intrusions at U.S.-based entities that included the legal sector, and gives no indicators, no account of what goes unlogged and no date of first exploitation ("
