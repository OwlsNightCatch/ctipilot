    text: "Check Point's advisory sk1000302, last modified 2026-10-28, says the PHP flaws CVE-2026-109618 and CVE-2026-109619 (CVSS 9.2 each) can give remote code execution through the web interfaces of Force, Spark and Cloud firewalls that use Mobile Access, SSL Network Extender VPN, SAML-realm VPN authentication, the Identity Awareness captive portal, the UserCheck portal or Zero Phishing. Hotfixes exist for R81.20, R82, R82.10 and R82.20 and for Spark R82.00 and R81.10; the R81.20 package was reissued on 2026-10-28 for gateways that use Mobile Access. The sk makes no statement on exploitation of Check Point products, and CISA lists both flaws as exploited."
