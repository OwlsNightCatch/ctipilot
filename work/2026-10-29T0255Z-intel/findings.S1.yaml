      FACTS (WatchGuard PSIRT, all 18 advisories dated 2026-10-27; the listing's severity figures are WatchGuard's scores, CVSS version not shown on the listing). Fixed in Fireware OS 2026.4, 12.12.4 and, for T15/T35 models, 12.5.22; every Fireware advisory reads "WatchGuard is not aware of any exploitation of this vulnerability in the wild". Affected ranges for most rows: Fireware OS Default >= 2025.1 and < 2026.4, and >= 12.0 and < 12.12.4; T15/T35 >= 12.0 and < 12.5.22. The Canadian Cyber Centre's AV26-1094 (2026-10-28) independently lists Fireware OS (multiple versions) and Mobile VPN with SSL Client (before 2026.4 and before 12.0) as affected.
