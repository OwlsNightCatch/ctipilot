  # ------------------------------------------------------------------ 14. F5 BIG-IP PHP2Shell (borderline: store gap, primary unreadable)
  - title: "F5 BIG-IP and PHP2Shell: K000163821 says the Configuration utility (all modules) and APM access profiles are affected; fixes 17.1.3.7, 17.5.1.11 and 21.1.0.4 (updated 2026-10-24); not in the store"
    sources:
      - { url: "https://raw.githubusercontent.com/NCSC-NL/php2shell/main/software/changelog_software_list.md", publisher: "NCSC-NL PHP2Shell software status list (changelog)", date: "2026-10-26", role: "primary" }
      - { url: "https://github.com/NCSC-NL/php2shell/wiki", publisher: "NCSC-NL PHP2Shell repository (operational information, updated 2026-10-28)", date: "2026-10-28", role: "corroborating" }
    discovery_trace: "first seen at: NCSC-NL PHP2Shell repository wiki, URL https://github.com/NCSC-NL/php2shell/wiki (WebFetch, developing-story check for vendor advisories) -> pivot: software status changelog, URL https://raw.githubusercontent.com/NCSC-NL/php2shell/main/software/changelog_software_list.md (bridge url) -> F5 primary https://my.f5.com/manage/s/article/K000163821 is a JS-only portal page: extract returned the portal shell and WebFetch returned a loading placeholder, so F5's own wording was NOT read"
    summary: |
      FACTS as recorded by NCSC-NL (a national authority compiling vendor statements; F5's page itself was unreadable here): F5 K000163821, first recorded 2026-10-23, says BIG-IP releases 17.1.0 to 17.1.3, 17.5.0 to 17.5.1 and 21.1.0 are vulnerable to both PHP2Shell CVEs through the BIG-IP Configuration utility control plane (all modules) and, for APM and SSLO, through the data-plane access profiles ("APM/SSLO access-profile data-plane exposure"); F5 "lists fixes in 17.1.3.7, 17.5.1.11 and 21.1.0.4 for both CVEs" as of 2026-10-24, and earlier affected releases remain vulnerable. NCSC-NL's rows are dated 2026-10-23 (vulnerable, no fix) and 2026-10-26 (fix).
      The store's PHP2Shell entries cover PAN-OS, NetScaler, Cisco, HPE ClearPass, QNAP and OT vendors but not F5 BIG-IP (a grep of entries for BIG-IP and K000163821 in October finds nothing). Whether the APM data-plane exposure is reachable pre-authentication from the internet is not stated in what was read, and F5's mitigations (access restriction for the Configuration utility, APM-specific guidance) were not read. No source reports exploitation of BIG-IP through PHP2Shell.
    region_nexus: "global; BIG-IP is a core ADC and access gateway in many Swiss public-sector estates (no Swiss-specific reporting)"
    primary_sector_nexus: "direct technology class (load balancer and remote-access gateway)"
    sector: "public-sector"
    cves: [CVE-2026-109618, CVE-2026-109619]
    techniques: [T1190]
    affected_products: ["F5 BIG-IP TMOS", "F5 BIG-IP APM", "F5 BIG-IP SSLO"]
    entity_keys: ["tool:php2shell", "product:php"]
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE-NATIONAL-CERT
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "F5 K000163821, updated 2026-10-24, lists fixes in 17.1.3.7, 17.5.1.11 and 21.1.0.4 for both CVEs."
        attribution: "NCSC-NL"
        source_url: "https://raw.githubusercontent.com/NCSC-NL/php2shell/main/software/changelog_software_list.md"
      - quote: "F5 confirms the BIG-IP Configuration utility control plane is affected across all modules in the listed releases."
        attribution: "NCSC-NL"
        source_url: "https://raw.githubusercontent.com/NCSC-NL/php2shell/main/software/changelog_software_list.md"
    extended_notes: |
      Gap, not a delta of this run: F5's advisory is five days old and the fix is dated 2026-10-24, so under the recency rule this is outside the window; it is raised because BIG-IP is a core edge product and the PHP2Shell pair is KEV-listed. Needs the F5 primary read through a browser or a vendor feed before an entry is written (the NCSC-NL repository's per-vendor rows carry the same text as secondary evidence). The same NCSC-NL list also records, among others: Juniper JSA112681 (Junos J-Web on EX vulnerable to CVE-2026-109618 but 'not exploitable' per Juniper, SRX no longer uses PHP from 25.2R1), NetApp ONTAP 9 fixes (NTAP-20261021-0021; CVE-2026-109618 only), Broadcom ESG advisory 39404 (CloudSOC SpanVA Appliance vulnerable), TerraMaster TOS 6 (vulnerable, migration to TOS 7 required) and Synology PHP 7.3 (end of life, no fix).
    borderline: true
    borderline_reason: "Store gap on a core edge product, but the vendor primary is outside the window and unreadable here, and exploitation is not reported; the main agent can either fold a short note into the PHP2Shell entry once the F5 page is read or drop it."

