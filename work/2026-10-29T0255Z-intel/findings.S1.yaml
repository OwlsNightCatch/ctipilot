    discovery_trace: "first seen at: same chain as the CVE-2026-46300 item (cisa-kev bridge row for CVE-2026-46300 naming the PHP2Shell chain -> WebSearch -> SecurityWeek URL https://www.securityweek.com/china-linked-hackers-exploit-php2shell-to-root-firewalls/ -> The Hacker News URL https://thehackernews.com/2026/10/php2shell-attack-roots-25-servers.html -> primary: Dream Research URL https://dreamgroup.com/blog/chained-php2shell-exploit-roots-25-servers)"
    summary: |
      PAIRS WITH the CVE-2026-46300 item; one finding, two covered entries. This record is the delta for the PHP2Shell entry, whose text does not mention it (grep of the store for Dream or Fragnesia finds nothing).
      CLAIM (Dream Research, 2026-10-27, first-hand artifacts): the first publicly described attack that turns PHP2Shell (CVE-2026-109618/109619) into root on appliances rather than a web-worker shell. The attacker's PHP stage is a custom build tailored to an unnamed vendor's firewall management web server, which Dream says runs PHP 8.0.30 with a high memory limit that enables the memory-corruption stages; Dream describes four stages (memory exhaustion, a leak through the Set-Cookie response header that reveals the libphp.so base, a second out-of-memory round that leaves a stale session reference, then a forged hash-table destructor that calls zif_system), each tuned per firmware build with offsets taken from the vendor's own libphp.so. Eleven per-version profiles were found; nine firmware versions were exploitable. Code runs as the `nobody` user and the Fragnesia stage (see the CVE-2026-46300 item) lifts it to root. The unauthenticated request must reach the management web server, which Dream calls "an exposed management interface" that "should never have been exposed to the internet".
      The campaign funnel and post-exploitation (24 of 240 targets rooted, 22 parked, a US government-affiliated organization's two firewalls and its firewall management server rooted, reverse SSH tunnel, LDAP service-account password decrypted, password spray, attempted account creation) are in the CVE-2026-46300 item. Dream does not name the vendor, versions or an actor, and cannot say whether the Active Directory attacks succeeded.
      WHY IT MATTERS FOR THE COVERED ENTRY: it contradicts the notion, voiced by an underground forum member quoted in The Hacker News, that PHP2Shell is "unexploitable" against real targets because libphp offsets differ per build; this attacker obtained the vendor firmware, extracted libphp and built per-build profiles. It also shows the PHP flaw reached an appliance image that carries PHP 8.0.30 (outside the upstream-fixed 8.2 to 8.5 lines; PHP 8.1 and older have no upstream fix), so appliance vendors' own advisories, not distribution PHP packages, are the patch path.
    region_nexus: "global; target set US, Japan, Taiwan, South Korea; Swiss exposure depends on whether management interfaces of firewall or network appliances with embedded PHP face the internet"
