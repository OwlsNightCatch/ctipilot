      Exposure: read the Backup & Replication build in the console (Help, About) or on the appliance; 13.x only (12.x unaffected). The CDP Coordinator Service is part of Veeam's vSphere continuous-data-protection feature; Veeam does not say whether it is reachable only from the backup network, so treat the backup server's management and CDP ports as in scope for segmentation. Backup servers should never be internet-facing; where one is, patch first.
      Detection: authentication and process-creation logs on the backup server (Windows event logs or the appliance's logs) for unexpected sessions or service-account use around the CDP Coordinator Service; for VB365, PostgreSQL service-account process creation on the VB365 server and tenant-transfer (organization-transfer) activity from an unexpected peer; for Veeam ONE, an MFA setting changed to disabled followed by an Administrator sign-in. Post-patch compromise check: an authorization bypass leaves no persistence by itself, so review new backup jobs, repositories, credentials and restore operators, and Veeam's configuration backups, for changes you did not make.
