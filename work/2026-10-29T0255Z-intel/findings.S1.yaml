    extended_notes: "Fixed-release table and CVSS values were read from the Cisco page via extract; the per-CVE scores are group maxima, not per-flaw scores. A 2026-09-20 audit worked this bundle (work/2026-09-20T1308Z-audit/findings.G1.yaml) but no store entry carries CVE-2026-20329 to -20336 or the advisory URL; entries exist for the same bundle's ISE and Secure Email Gateway advisories (2026-09-15, 2026-09-17) and for the two exploited FMC flaws the hardening advisory points to (2026-07-30, 2026-08-04)."
