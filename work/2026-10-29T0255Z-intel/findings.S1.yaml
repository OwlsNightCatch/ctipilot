      Exposure: read the running Fireware version in the Firebox web UI or WatchGuard System Manager and compare with the ranges above; then check each required configuration (Access Portal enabled, SIP proxy policy present, FireCluster membership, Active Directory authentication server, FireCloud Gateway role, FIPS mode with external log server, management SSH reachable). Rows that need a man-in-the-middle position (CVE-2026-112709/112710, 103594, 103593) are lower practical risk than the Access Portal, SIP and FireCluster rows, which are reachable by any host that can reach those listeners.
      Detection (no indicators in the sources): perimeter-appliance logs and process-crash records on the Firebox (daemon restarts of the authentication, SIP-proxy or portal services are what failed exploitation of memory-corruption flaws typically leaves); inbound connections to the FireCluster management IP from addresses that are not cluster members; WebSocket upgrade requests to the Access Portal from unexpected sources; outbound connections from the Firebox to hosts that are not WatchGuard Cloud, the AD server or the log server. These are derived from the stated mechanisms, not from a vendor hunt guide.
