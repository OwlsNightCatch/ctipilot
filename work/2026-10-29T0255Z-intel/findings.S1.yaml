  # ------------------------------------------------------------------ 10. Tailscale (borderline)
  - title: "Tailscale 1.104.4 fixes the Tailworm SSH findings (root-socket access through SSH forwarding, serve-to-privileged-socket); details were public before the fix and researchers call the SSH chain wormable; no exploitation reported"
    sources:
      - { url: "https://tailscale.com/security-bulletins", publisher: "Tailscale security bulletins (TS-2026-014 to TS-2026-017)", date: "2026-10-27", role: "primary" }
      - { url: "https://tailscale.com/ssh-investigation-update", publisher: "Tailscale (SSH investigation update, revised 2026-10-27)", date: "2026-10-27", role: "primary" }
      - { url: "https://tailworm.com/", publisher: "Cyberdione Labs (Tailworm report, updated 2026-10-27)", date: "2026-10-27", role: "primary" }
      - { url: "https://www.securityweek.com/tailscale-rushes-patches-after-uncoordinated-disclosure-of-tailworm-flaws/", publisher: "SecurityWeek", date: "2026-10-27", role: "corroborating" }
    discovery_trace: "first seen at: SecurityWeek related-link on https://www.securityweek.com/china-linked-hackers-exploit-php2shell-to-root-firewalls/ (item 'Tailscale Rushes Patches After Uncoordinated Disclosure of Tailworm Flaws') -> primary: Tailscale bulletins, URL https://tailscale.com/security-bulletins, Tailscale investigation page URL https://tailscale.com/ssh-investigation-update, researchers' report URL https://tailworm.com/"
    summary: |
      FACTS (Tailscale bulletins, version 1.104.4 tagged 2026-10-27): TS-2026-014: Tailscale SSH performs Unix-socket forwarding as root and validated paths only lexically, so authenticated peers with forwarding access to a node can reach root-only sockets such as the Docker socket or the tailscaled local API; affects nodes with Tailscale SSH enabled and local or remote forwarding allowed in the access policy; mitigation: set TS_SSH_DISABLE_FORWARDING=1 in the tailscaled environment and restart. TS-2026-015: memory exhaustion denial of service in the SSH server by an authenticated peer. TS-2026-016: `tailscale serve` Unix backends could reach privileged sockets including the tailscaled local API, "full node takeover", where a local operator can write serve configurations. TS-2026-017: HTTP/2 shared serve context could leak capability headers across mounts. All fixed in 1.104.4 or newer. Tailscale says it does not recommend that everyone disable Tailscale SSH.
      CLAIMS (Cyberdione Labs, report published before any patch, lab-tested on Tailscale 1.104.2 and headscale 0.29.5, 11 findings, six high): the Tailscale SSH flaws are wormable, chaining from node to node at under a second per hop with no user interaction wherever the access rule allows forwarding, giving root and theft of keys that add rogue devices. Tailscale's own assessment: most issues concern what happens after someone is authorized to connect; not an unauthenticated attacker reaching arbitrary machines. No exploitation in the wild is reported by any source. The report's findings on the self-hosted control server headscale (0.29.5) and on an experimental app-connector feature are not covered by Tailscale's bulletins.
    region_nexus: "global; mesh-VPN use in Swiss public-sector networks is not documented in the sources"
    primary_sector_nexus: "indirect; VPN and remote-access class"
    sector: "public-sector"
    cves: []
    techniques: [T1021.004, T1068, T1570]
    affected_products: ["Tailscale client", "Tailscale SSH", "headscale"]
    entity_keys: []
    new_entities:
      - { key: "product:tailscale", type: product, name: "Tailscale", aliases: ["tailscaled", "Tailscale SSH"], summary: "Mesh VPN built on WireGuard; client 1.104.4 (2026-10-27) fixes the Tailscale SSH and serve flaws published as Tailworm (Tailscale, 2026-10-27)." }
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "This vulnerability is fixed in Tailscale version 1.104.4 or newer."
        attribution: "Tailscale"
        source_url: "https://tailscale.com/security-bulletins"
      - quote: "you can disable SSH forwarding by setting `TS_SSH_DISABLE_FORWARDING=1` in the `tailscaled` service environment and restarting the service."
        attribution: "Tailscale"
        source_url: "https://tailscale.com/security-bulletins"
    extended_notes: |
      Detection: Linux process and socket-access telemetry on Tailscale SSH hosts: tailscaled (root) opening the Docker socket or its own local-API socket on behalf of an SSH session; new devices appearing in the tailnet admin log. Hardening: update to 1.104.4, disable SSH forwarding where not needed, narrow SSH access rules.
    borderline: true
    borderline_reason: "Details public before the fix and a 'wormable' claim, but exploitation needs an authorized peer or a compromised tailnet node, no CVE ids are published in the bulletins read, and use in Swiss public-sector networks is not evidenced; relevance gate (PD-11) leaves it to the main agent."

