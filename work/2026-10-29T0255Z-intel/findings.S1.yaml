  # ------------------------------------------------------------------ 3. PHP entry update (Dream chain on appliances)
  - title: "PHP2Shell on a firewall management plane: Dream recovered a custom, non-public build that gave unauthenticated root on 24 appliances of one unnamed vendor and an Active Directory attack from a US government-affiliated management server"
    sources:
      - { url: "https://dreamgroup.com/blog/chained-php2shell-exploit-roots-25-servers", publisher: "Dream Research", date: "2026-10-27", role: "primary" }
      - { url: "https://www.securityweek.com/china-linked-hackers-exploit-php2shell-to-root-firewalls/", publisher: "SecurityWeek", date: "2026-10-28", role: "corroborating" }
