    extended_notes: |
      Single first-hand source (Dream) for everything beyond the KEV statement; SecurityWeek and The Hacker News rewrite Dream. The KEV row for CVE-2026-46300 (CISA) independently states the chaining but gives no victim or date. The Hacker News says 'observed on October 25'; Dream dates the rootings 2026-10-23 18:14 UTC and 2026-10-24 10:09 UTC and its discovery of the artifacts 2026-10-25; SecurityWeek says two government servers, Dream and The Hacker News say three (two firewalls plus the internal management server).
      Defender takeaway for the entry: inventory appliances (firewalls, NAC, wireless controllers, backup and management consoles) whose management web server is PHP-based and check each vendor's PHP2Shell advisory; the management plane must not face the internet; after patching, look for webshells in web-reachable directories, long-lived outbound SSH from the appliance and its management server, and password-spray bursts against Active Directory from the management server's address.
    borderline: false

