    extended_notes: |
      Detection and hunt concepts (all derived from the sources' stated mechanics, no indicators):
      - Telemetry class: Linux process, syscall and file-event telemetry (auditd or an EDR Linux sensor). A web-server worker (nobody, www-data, apache) that spawns a shell and then runs `su` with success and no authentication step; an unprivileged process that creates user and network namespaces (unshare CLONE_NEWUSER|CLONE_NEWNET), installs an ESP security association over NETLINK_XFRM, splices file data into a TCP socket and enables the espintcp upper-layer protocol (Qualys ThreatPROTECT, 2026-05-15, describes this sequence for the public exploit).
      - The overwrite is page-cache only, so the on-disk /etc/pam.d/su and /usr/bin/su never change and a file-integrity check on disk stays clean; dropping the page cache (or comparing in-memory reads with disk) reveals it. A new small PHP file in a web-reachable directory on an appliance or web host, and an outbound SSH session from a firewall or management server to an external host kept up by a systemd unit or an rc.local entry, are the persistence artifacts Dream describes.
      - Post-patch compromise check (kernel and PHP patching do not evict an attacker already in): webshell files, tunnel units and boot hooks, rooted-device credentials (private keys, HA replication keys, LDAP service-account password, SAML IdP configuration) treated as exposed and rotated; domain controllers checked for password-spray bursts across all users and for new user or machine accounts.
      - Benign lookalikes: user namespaces and IPsec are routine on rootless-container and VPN hosts (the covered entry's Triage line); the discriminator is a web-worker uid doing the namespace and XFRM work, or su succeeding for a web-worker lineage.
      Fixed kernel versions per the CNA (kernel.org) CVE record, read but not cited because the NVD/MITRE/cve.org record is a blocked citation class: vulnerable since 3.9; fixed in stable 5.10.257, 5.15.208, 6.1.174, 6.6.141, 6.12.91, 6.18.33, 7.0.10 and mainline 7.1; distributions backport, so compare the vendor package version, not uname -r.
      The Fragnesia code path is still 'local only'; what changed is the observed pairing. Vendor of the firewall appliances is undisclosed; do not infer one. This item pairs with the PHP entry update below (same finding, two covered entries).
      Suggested classification: reliability B (Dream first-hand artifacts) for the chain details, credibility 2; the KEV status itself is A1.
    borderline: false

