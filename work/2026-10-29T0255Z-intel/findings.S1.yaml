      Context: WatchGuard fixed a pre-authentication IKE RCE in July and August (store entries 2026-07-03 and 2026-08-31) and a batch on 2026-09-29 (Fireware 2026.3.2 and 12.12.3, including spamd and samld RCE rows); this is the third monthly batch. Credits to a vendor-run "AI Security Research" team mean many rows are found by the vendor, so public patch-diffing is the main route to exploits.
