      - CVE-2026-103594 (9.5): stack buffer overflow in WireGuard configuration processing, code execution by a man-in-the-middle with TLS-decrypted access between the Firebox and WatchGuard Cloud who tampers with a FireCloud Gateway configuration payload; only Firebox configured as a FireCloud Gateway; affected >= 2026.2 and < 2026.4, >= 12.12 and < 12.12.4 (not T15/T35).
      - CVE-2026-93866 (9.2): pre-authentication integer overflow in the WebSocket connection handling of the Access Portal, out-of-bounds heap write by a remote unauthenticated attacker; only with the Access Portal enabled.
      - CVE-2026-93857 (9.2): pre-authentication stack buffer overflow in the SIP proxy, remote code execution by a request sent through a policy that uses the SIP proxy; only with a SIP proxy configured.
      - CVE-2026-93865 (9.2): missing authentication in the FireCluster synchronization daemon, a remote unauthenticated attacker invokes privileged system-level administrative actions through a crafted request to the FireCluster management IP; only Firebox appliances that are FireCluster members. Sibling rows: CVE-2026-90465 (8.7, privilege escalation), CVE-2026-93862 (7.2, denial of service), CVE-2026-104381 (6.0, BOVPN tunnel denial of service).
      - CVE-2026-112709 and CVE-2026-112710 (9.2 each): heap buffer overflows in the authentication service, denial of service and potential code execution by an attacker who controls or intercepts traffic to the configured Active Directory server and returns a crafted response; only Firebox with an Active Directory authentication server.
      - CVE-2026-103593 (9.1): stack buffer overflow in the logging service, root code execution by a network-adjacent attacker who impersonates or intercepts traffic to the log server with a crafted certificate; only Firebox in FIPS mode with an external log server.
      Other rows worth knowing: CVE-2026-93434 (8.7) XPath injection in SSH authentication allows blind extraction of configuration secrets (needs network access to the management SSH interface); CVE-2026-90442 (8.6) authenticated certd stack overflow (denial of service); CVE-2026-111107 (8.7) unauthenticated management-interface denial of service; CVE-2026-90464 (7.2) authenticated file modification as root; CVE-2026-93864 (7.1) local link-following file overwrite as root; CVE-2026-82332 (5.6) AuthPoint MFA verification session hijacking; CVE-2026-113881 (6.1) VPN network-access-enforcement stack overflow; CVE-2026-115495 (5.7) Mobile VPN with SSL Client for Windows sends VPN credentials in cleartext over a local management socket (fixed in Mobile VPN with SSL Client 2026.4).
