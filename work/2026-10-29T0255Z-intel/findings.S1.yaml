    extended_notes: |
      Exposure: ESX 9.1.x, 9.0.x, 8.0 and VCF 5.x hosts below the fixed builds; it needs administrator rights on the host, so it is an anti-forensics and defence-evasion primitive after a vCenter or host compromise, not an entry point (CVSS vector AV:N/AC:L/PR:H). CrowdStrike does not say how WARP PANDA reached administrator level or whether the same advisory's vCenter flaws (CVE-2026-59309/59310, covered as exploited since August) were involved, so do not link them.
      Detection (telemetry class first): rely on records an administrator on the host cannot suppress: vCenter task and event logs, authentication records on the identity provider, ESX syslog already forwarded off-host before the compromise, and network telemetry for outbound connections from ESX management interfaces and the vCenter appliance. A gap or oddity in ESX shell/hostd logs during a period of known administrator access is not reassuring. Post-patch compromise check: patching closes the logging bypass but does not reveal what was done while it was open; review administrator sessions and changes (accounts, SSH enablement, scheduled tasks, VIB/ configuration changes) through vCenter and off-host copies.
      Hardening: patch to the fixed builds; forward ESX and vCenter syslog off-host; keep the management plane on a segmented network (NCSC-NL's guidance in the covered entry).
