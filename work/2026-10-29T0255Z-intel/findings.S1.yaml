      FACTS (Veeam KBs, published 2026-10-27; scores are CVSS 4.0; Veeam gives no exploitation statement, NCSC.ch lists status UNKNOWN and "the vendor reports no evidence of active exploitation").
      Backup & Replication (KB4948): CVE-2026-108142 (9.1, Critical) lets an unauthenticated attacker bypass authorization on the CDP Coordinator Service of Windows-based Veeam Backup & Replication and the Veeam Software Appliance (vector AV:N/AC:L/AT:P/PR:N, so exploitation needs a precondition Veeam does not describe). Affected: 13.1.1.18 and all earlier 13.1 builds, 13.0.2.29 and all earlier 13.0 builds; "Older versions (e.g., 12.x) are not affected". Fixed in 13.1.2 (build 13.1.2.57) and 13.0.3 (build 13.0.3.63). Siblings: CVE-2026-108140 and CVE-2026-108141 (5.9 each, path traversal arbitrary file write by a Restore Operator who controls a backed-up NAS share's contents); CVE-2026-105477 (7.3, local privilege escalation in Veeam Agent for Linux managed by a Backup & Replication server, fixed in 13.1.2 build 13.1.2.11).
      Backup for Microsoft 365 (KB4957): CVE-2026-106076 (9.0, Critical): an authenticated organization-transfer peer injects SQL into the source server's configuration database, with cross-tenant read and write of configuration data and remote code execution as the PostgreSQL service account; fixed in 8.6 (build 8.6.0.1102), affected 8.5.0.1014 and earlier version 8 builds. CVE-2026-106077 (8.3, Administrator role reads arbitrary files as LocalSystem) fixed in 8.6; CVE-2026-106078 (6.9, unauthenticated REST API authentication bypass with a forged federation token, reaches only endpoints that do not call the backup service) and CVE-2025-64394 (4.3, installer local file write as SYSTEM) fixed in 8.6 Patch 1 (build 8.6.0.5011); these two affect 8.6.0.1102 too.
      Veeam ONE (KB4951): CVE-2026-107671 (8.5, High): an attacker with valid Administrator credentials disables MFA globally before completing MFA verification; affects 13.1.0.7233 and earlier 13.1 builds, fixed in 13.1 P1 (build 13.1.0.7940); 13.0.x and 12.x not affected.
