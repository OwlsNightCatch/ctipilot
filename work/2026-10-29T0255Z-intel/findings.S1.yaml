    discovery_trace: "first seen at: cisa-kev bridge (https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json) row CVE-2026-41709, added 2026-10-28, notes link Broadcom VMSA-2026-0006 -> Broadcom advisory, URL https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/SecurityAdvisories/0/38017 (no exploitation statement; reporter credited as Ian Barton of CrowdStrike) -> WebSearch (\"CISA KEV Fragnesia VMware ESX CVE-2026-41709 added catalog federal agencies November 11 deadline\", extended) -> pivot: hol.org campaign page, URL https://hol.org/guard/security/campaigns/cve-2026-41709-vmware-esxi-logging-bypass-cisa-kev (aggregator, lead only, not cited) -> primary: CrowdStrike, URL https://www.crowdstrike.com/en-us/blog/crowdstrike-2026-legal-threat-landscape-report/"
    summary: |
      FACTS. Broadcom's VMSA-2026-0006 (2026-07-29, revised to .2 on 2026-08-19) lists CVE-2026-41709 as an ESX "insufficient logging vulnerability": "A malicious administrator could exploit this issue to perform certain operations without them being logged" (CVSS 3.1 2.7, Low; no workaround; reporter credited as Ian Barton of CrowdStrike). Fixed builds: ESXi-9.1.0.0-25370933, ESXi-9.0.2.0100-25595025, ESXi80U3j-25429389, VMware Cloud Foundation 5.x ESX 5.2.4, and per KB449886 for Telco Cloud Platform 5.0.x and 5.1.x; vSphere 7.0 is not in this CVE's matrix. CISA added it to the KEV catalogue on 2026-10-28 (due 2026-11-11, forensic-triage field No, ransomware use Unknown) on "evidence of active exploitation" and names no actor. ENISA EUVD shows exploitedSince 2026-10-28; EPSS is 0.0030 (percentile 0.22).
      CLAIM (CrowdStrike Intelligence, 2026-10-28, in its 2026 Legal Threat Landscape Report post): "WARP PANDA deployed several forms of malware in victims' VMware vCenter environments. In several of these cases, and as late as early 2026, the adversary exploited ESXi command logging bypass vulnerability CVE-2026-41709 as a zero-day." The intrusions were at US-based entities including the legal sector. CrowdStrike is both the original reporter of the flaw and the holder of the intrusion telemetry. It gives no indicators, no description of what goes unlogged, and no first-exploitation date beyond "as late as early 2026".
      INFERENCE. No source explains the mechanism. Broadcom, CrowdStrike and CISA all leave open which ESX operations escape logging; treat local ESX logs from any period before the patch as possibly incomplete on hosts an attacker reached with administrator rights.
      VENDOR LAG. Broadcom's VMSA-2026-0006 FAQ, as read on 2026-10-29, still says "Broadcom has no information to suggest that exploitation of these issues has occurred in the wild", although CVE-2026-59310 (same advisory) has been KEV-listed since 2026-08-18 and this CVE since 2026-10-28; do not take the vendor FAQ as current.
      DO NOT CONFLATE. CrowdStrike's separate ESX research on shell-command obfuscation (21 techniques on ESX 7.0.3; the shell log records a command "during the parsing stage, before expansions occur") describes a logging gap too, but it names no CVE, says nothing about this flaw and describes lab research ("before adversaries make it necessary"); no source ties it to CVE-2026-41709.
      DELTA FOR THE COVERED ENTRY (2026-07-30/vmware-vmsa-2026-0006-...): the CVE-2026-41709 record moves from patch-available to exploited and KEV-listed; the entry's sourcing note ("none of the three national CERTs reported any") predates this; the logging implication belongs in its Detection line.
