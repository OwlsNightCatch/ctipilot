    discovery_trace: "first seen at: cisa-kev bridge (python3 tools/fetch_source.py cisa-kev, feed https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json): the CVE-2026-46300 row's shortDescription says it 'can be chained with CVE-2026-109618 and CVE-2026-109619 to implant PHP webshells and run commands as root' -> WebSearch (\"CISA warns Linux kernel flaw exploited chained PHP2Shell root webshells KEV CVE-2026-46300\") -> pivot: SecurityWeek, URL https://www.securityweek.com/china-linked-hackers-exploit-php2shell-to-root-firewalls/ -> pivot: The Hacker News, URL https://thehackernews.com/2026/10/php2shell-attack-roots-25-servers.html -> primary: Dream Research, URL https://dreamgroup.com/blog/chained-php2shell-exploit-roots-25-servers; CISA alert fetched via WebFetch, URL https://www.cisa.gov/news-events/alerts/2026/10/28/cisa-adds-two-known-exploited-vulnerabilities-catalog"
    summary: |
      FACTS. CISA added CVE-2026-46300 to the KEV catalogue on 2026-10-28 (federal due date 2026-10-31, three days; the KEV row's forensic-triage field is Yes, known-ransomware use Unknown) "based on evidence of active exploitation" and its KEV description states that the flaw "can be chained with CVE-2026-109618 and CVE-2026-109619 to implant PHP webshells and run commands as root", i.e. with the two PHP2Shell flaws. The CISA alert names no actor and no victim. ENISA's EUVD carries exploitedSince 2026-10-28; FIRST EPSS is 0.1019 (percentile 0.957) as of 2026-10-28 and the CVSS 3.1 score is 7.8.
      CLAIM (Dream Research, 2026-10-27, first-hand artifacts recovered by its threat-hunting product): an attacker used a custom, non-public PHP2Shell build, written for one large vendor's firewall management web server (which runs PHP 8.0.30 with a high memory limit), chained in the same single HTTP request with a Fragnesia exploit. The PHP stage gives command execution as the unprivileged web account; Dream says SELinux confines the web domain from touching system files, so the Fragnesia stage uses a page-cache write to replace the authentication rules in /etc/pam.d/su with pam_permit.so, after which `su root` succeeds without a password. This is a variant of the public exploit, which overwrites /usr/bin/su in the page cache. The chain, from one unauthenticated HTTPS connection to a persistent root webshell, took under 15 minutes in Dream's data. The attacker found about 19,000 internet-facing firewalls with exposed management interfaces through the FOFA search engine, fingerprinted about 5,000 live ones, filtered to 240 in the US, Japan, Taiwan and South Korea on PHP 8.0.30 builds, and rooted 24 (plus one internal management server later, 25 in total), planting a 103-byte PHP root webshell in a publicly reachable directory and checking root with `id`. Twenty-two stayed parked with webshells and no further activity. On two firewalls of a US government-affiliated organization the attacker set up an 8-port reverse SSH tunnel (systemd service plus an rc.local boot hook) into the internal network, rooted the organization's internal firewall management server with the same chain through the tunnel, decrypted the LDAP service-account password with the root-held master key, enumerated users and groups, sprayed organization-themed passwords against every account (the domain had no lockout threshold), tried to create user and machine accounts, and tried to extract SAML signing keys from the Keycloak configuration. Whether any of that succeeded is unknown to Dream. The vendor is not named ("the vendor has been notified").
      INFERENCE (Dream, not attributed to a named actor): "multiple indicators point to a Chinese-nexus operation" (FOFA keys, Chinese LLM keys, target countries); AI-assisted development is suggested by Claude Code being installed, an offensive platform configured with DeepSeek and Kimi, and the code style, but Dream has "no direct evidence" the tools wrote the exploit.
      DELTA FOR THE COVERED ENTRY. The entry's sourcing note says EPSS was consistent with no confirmed in-the-wild exploitation; that is superseded (KEV 2026-10-28). Its CVE record must move to exploited and KEV-listed. Its analysis ("a post-compromise root primitive rather than an entry point", `su` overwrite) stays correct but gains the observed pairing with a pre-auth web RCE, and the overwritten file can be /etc/pam.d/su rather than the su binary.
    region_nexus: "global; Dream's target set was US, Japan, Taiwan and South Korea; any Swiss internet-facing management interface or Linux web host on an unpatched PHP and kernel is the same shape"
