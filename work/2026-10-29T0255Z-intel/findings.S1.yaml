      - { url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-hardening-asaftdfmc-uvpPROhN", publisher: "Cisco PSIRT (cisco-sa-hardening-asaftdfmc-uvpPROhN, version 1.1)", date: "2026-09-18", role: "primary" }
    discovery_trace: "first seen at: advisories-ncsc-nl, ncsc-nl recent 20 (NCSC-2026-0458, 2026-10-28T10:28Z), URL https://advisories.ncsc.nl/advisory?id=NCSC-2026-0458 -> primary: Cisco PSIRT, URL https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-hardening-asaftdfmc-uvpPROhN (revision history: 1.0 on 2026-09-16, 1.1 on 2026-09-18, nothing newer)"
    summary: |
      FACTS (Cisco PSIRT, published 2026-09-16, v1.1 2026-09-18): software hardening releases for Secure Firewall ASA, Secure FTD and Secure FMC fix internally found vulnerabilities (found with "frontier AI models"), grouped by weakness class into eight CVEs with the maximum CVSS 3.1 of the worst underlying issue per group: CVE-2026-20329 9.9 (CWE-703 exceptional conditions), CVE-2026-20330 9.9 (CWE-707), CVE-2026-20331 9.6 (CWE-693), CVE-2026-20332 9.0 (CWE-284 access control), CVE-2026-20333 8.8, CVE-2026-20334 8.4, CVE-2026-20335 8.1, CVE-2026-20336 7.5; no workarounds. Two flaws in the access-control group are "known to be actively exploited": the already-published FMC static-credential and FMC authentication-bypass flaws (store entries 2026-07-30 and 2026-08-04). First fixed releases: ASA 9.16.4.103, 9.18.4.94, 9.20.4.49, 9.22.3.26, 9.23.1.47, 9.24.1.26; FTD and FMC 7.0.10, 7.2.12, 7.4.8, 7.6.6, 7.7.13, 10.0.2, 10.1.0 (hot-fix trains must move to the first fixed release). The group's worst score has PR:L (low-privilege authentication), so these are not stated as pre-authentication.
      NCSC-NL (advisory 0458, 2026-10-28) relays the release with priority normal; its prose says CVE-2026-20332 is 9.0 while its CVE list shows 9.9, a discrepancy inside NCSC-NL's page. Why NCSC-NL published six weeks late is not stated.
    region_nexus: "global; ASA and FTD are the edge firewalls of many administrations"
    primary_sector_nexus: "direct technology class (perimeter firewalls and their management centre)"
    sector: "public-sector"
    cves: [CVE-2026-20329, CVE-2026-20330, CVE-2026-20331, CVE-2026-20332, CVE-2026-20333, CVE-2026-20334, CVE-2026-20335, CVE-2026-20336]
    techniques: [T1190]
