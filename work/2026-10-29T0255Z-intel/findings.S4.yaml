  summary: 'The Register reports, from 123 Reg''s notification to customers, that the UK domain registrar and hosting company, owned by GoDaddy,
    disclosed an intrusion dated 2026-09-18 in which an attacker read contact and customer-relationship data, company VAT numbers and product
    information through an API: names, telephone numbers, country, language and currency settings, account creation dates, products on the account
    and marketing preferences. 123 Reg says activity was limited to reading, that copies may have been made, that it notified law enforcement,
    the US Federal Trade Commission and UK and EU data-protection authorities and had attacker servers in Singapore taken down with local ISPs;
    the number of customers and the initial access are not stated. The company calls it its first known AI-driven attack, says the attacker''s
    core infrastructure was in China and Singapore and found ''AI cyberattack skills'' on it, including copies of skills open-sourced by Anthropic,
    and suspects a Chinese state-sponsored group, specifically the actor that used ARTEX against South Korean financial institutions in CrowdStrike
    advisory CSA-261162 of 2026-10-07; this is the company''s suspicion, not an attribution by a telemetry-holding lab, and The Register notes
    the September intrusion date and the late-September start of the CrowdStrike activity are not reconciled.'
