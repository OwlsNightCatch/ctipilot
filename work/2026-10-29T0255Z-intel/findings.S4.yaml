    attribution: The Record (Recorded Future News)
    source_url: https://therecord.media/moldova-investigates-possible-foreign-involvement-cyberattacks
  extended_notes: 'Suggested Admiralty rating: reliability A (first-party government disclosure of its own incident; AGE is not on the national-CERT
    carve-out list, so it is rated as the owning authority), credibility 2 (preliminary counts, the AI statement is the Prime Minister''s own
    and hedged with ''allegedly'').

    Exposure: any public e-service that returns person data by identifier without authentication, or whose output feeds other registers; Swiss
    analogue already in the store: 2026-08-29/swiss-cantons-eautoindex-vehicle-registry-data-harvesting.

    Detection: the abuse surfaced to citizens through the data-access history in the EVO app (processing-basis entries naming civil-status and
    driving-licence services) - a data-subject-visible access log is a detection channel; on the server side the telemetry class is per-service
    request volume and identifier-enumeration patterns (about 11 million requests against about one million identifiers), which the sources do
    not break down further.

    Takeaway (from the sources): AGE inspected 82 services and disconnected the exposed ones plus more than 30 systems and admin panels; the fix
    path was service-by-service retest with the national cybersecurity agency before restoring, plus a planned national SOC.

    Context AGE cites (not verified here): ENISA''s report of 2026-09-22 counting over 8,200 EU incidents, about 2,600 against public administration.'
- title: 'FortiBleed 2.0: Hudson Rock analyses 1,703 stolen FortiGate configuration reports with 40,573 cleartext secrets, 975 domain labels absent
    from the first leak, and administrator accounts coexisting with those of the first leak'
  sources:
  - url: https://www.infostealers.com/article/fortibleed-2-0-975-new-domains-40573-exposed-secrets-claim-your-ethical-disclosure/
    publisher: Hudson Rock (InfoStealers)
