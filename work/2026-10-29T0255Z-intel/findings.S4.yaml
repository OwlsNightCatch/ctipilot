  summary: Inside IT reported on 2026-10-28 that the ransomware group The Gentlemen claims to have stolen data from the software and cloud services
    group SoftwareOne, and that, according to SoftwareOne, the affected environment is an isolated test environment. The article is paywalled;
    the readable lede gives no data volume, sample or intrusion detail, and no listing for SoftwareOne was found through the ransomware.live API
