    role: corroborating
  discovery_trace: 'first seen at: hacksnack.ch feed, URL https://hacksnack.ch/feed/ → article, URL https://hacksnack.ch/fortinet-leak-tausende-vpn-zugaenge-im-klartext/
    → pivot: WebSearch ("Hudson Rock FortiGate configuration files 40,573 credentials plaintext FortiBleed 2.0") → primary: Hudson Rock, URL https://www.infostealers.com/article/fortibleed-2-0-975-new-domains-40573-exposed-secrets-claim-your-ethical-disclosure/
    → vendor guidance: Fortinet PSIRT, URL https://www.fortinet.com/blog/psirt-blogs/analysis-of-reported-credential-compromise-of-fortigate-devices'
  summary: 'Hudson Rock published on 2026-10-27 a follow-up to its June FortiBleed investigation, based on newly obtained FortiGate configuration
    reports: 1,703 files for 1,689 host identifiers holding 101,419 credential and account records, 40,573 of them with cleartext secrets, among
    them 37,076 local-user records and 1,576 Active Directory LDAP bind records, plus 1,672 administrator logins labelled verified, 144 high-availability
    cluster secrets and 105 SMTP secrets. Hudson Rock says 924 of the 1,689 host identifiers and 975 of 1,453 domain labels are absent from the
    first FortiBleed list, so part of this material names devices and organizations not previously listed; for the 765 hosts that appear in both
    datasets, 524 of 766 administrator-login rows carry the same username and password as the first leak, and 242 rows show a different administrator
    name, which in 216 cases coexisted with the first-leak name in the earlier configuration''s admin table. Most report timestamps are 2026-02-20
    (31 undated), which Hudson Rock stresses are report dates, not independently established dates of compromise or configuration theft, and it
    says the material does not establish one initial-access mechanism. Some stored secrets can be recovered offline when a configuration uses
    the FortiOS system-default encryption key; 7,437 of the cleartext local-user records are marked disabled, and the counts are records, not
    unique people or working credentials. Hudson Rock credits NyxLab for the underlying research on the actor k0t and its extraction tooling,
    and notes Group-IB and NyxLab describe victim overlap with Qilin and The Gentlemen, a direct affiliation being unconfirmed. Fortinet''s June
    position, which this analysis cites, is that FortiBleed is not a new vulnerability but reuse of credentials from earlier incidents plus brute
    force against devices with weak passwords and no MFA, and it asks customers to end admin and VPN sessions, reset credentials, enforce MFA,
    review the configuration for unrecognised accounts and treat any configured AD/LDAP account as compromised.'
  region_nexus: global; FortiGate is widely deployed, no Swiss victim is named in the sources (Hudson Rock offers a free domain lookup)
  primary_sector_nexus: direct for any public body running an internet-reachable FortiGate (SSL VPN or management plane); no sector-specific victim
    data given
  sector: cross-sector
