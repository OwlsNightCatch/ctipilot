    → primary: AGE, URL https://egov.md/ro/node/41145 → primary: MOLDPRES, URLs https://www.moldpres.md/eng/society/prime-minister-on-cyberattack-targeting-public-digital-services-authorities-are-investigating-the-possible-involvement-of-foreign-state-actors-as-well
    and https://www.moldpres.md/eng/society/cyberattack-on-digital-public-services-authorities-block-about-11-million-access-requests'
  summary: Moldova's Electronic Governance Agency says that between 2026-10-19 and 2026-10-23 attackers queried about one million national identification
    numbers (IDNPs) through state digital services and, on preliminary estimates, extracted data sets for about 750,000 of them; MOLDPRES puts
    the access requests at about 11 million. AGE's technical explanation is that the attackers exploited vulnerabilities in services reachable
    without authentication and then used the data obtained to extract more; the first attacks hit an electronic service that logged the legal
    basis of data processing incorrectly, which is why citizens saw entries in the data-access history of the EVO app naming the services 'civil-status
    document request' or 'driving-licence issue' as the processing purpose. Data that may be affected, not all categories for every person, includes
    name, date and place of birth, first-degree relatives, insured status and family doctor, social benefits, pensions, disability, driving licence,
    photograph, vehicles and companies owned or run, IBAN, tax debts and payment history; the agency says card data is not held on the platform
    and found no unauthorised change to state registers. The unauthorized extraction was stopped on 2026-10-23 at 11:30, 82 digital services were
    checked and the exposed services plus more than 30 information systems and admin panels were disconnected (the Prime Minister speaks of 30
    of the 82 disconnected, so the sources differ on the count), and further attempts on 25 and 27 October were blocked. Prime Minister Tofan
    said on 2026-10-28 that this is not an isolated incident, that the possible involvement of foreign state actors is being investigated, and
    that the use of artificial intelligence allegedly helped find and exploit vulnerabilities that might otherwise have gone undetected; The Record
    notes that Moldova has not publicly attributed the attack to any country or group. The disclosed mechanism, automated mass extraction through
    unauthenticated public-service endpoints that then chain into interconnected registers, resembles the systematic harvesting of Swiss cantonal
    vehicle-holder data already covered.
  region_nexus: Moldova (Eastern Europe, not Switzerland); mechanism transferable to Swiss federal, cantonal and communal e-government portals
    and registers
  primary_sector_nexus: direct (national government digital services); transferable lesson for public-sector defenders
