  summary: 'Three airlines have now disclosed that reservation data held in systems run by Amadeus IT Group, the travel-IT supplier behind their
    passenger-service systems, was reached through unauthorized access. Korean Air and Asiana, notified by Amadeus on 2026-10-20, say the incident
    came from unauthorized access using login credentials assigned to an account in Amadeus''s system, estimate the window as August 2023 to September
    2026 with the exact time still under investigation, and confirm booking reference numbers among the exposed data; both report no sign of a
    breach of their own systems or databases, and Asiana says payment data was not included. Japan Airlines and Japan Transocean Air, notified
    on 2026-10-23, said on 2026-10-28 that reservation records of about 92,000 customers show signs of external viewing: about 90,000 with reservation
    number, name, boarding date, segment and class, and about 2,000 also with e-mail address, telephone number, passport number, nationality,
    mileage number, airline, flight, ticket number and seat; they report no card numbers or passwords and no use of the data so far, and say Amadeus
    has completed the necessary security measures. Aviation Wire notes that JAL''s span of 2023-08-10 to 2026-09-23 is the period in which the
    records existed on Amadeus''s system, not booking or boarding dates, and that the date of the actual intrusion is not disclosed. ANA told
    Asahi it also received a notice from Amadeus and is checking its impact. No public Amadeus statement on this credential case was found in
    this run; the airlines are the only first-hand sources, and how the credentials were obtained is not public. Separately, heise online reported
    on 2026-10-13 that a Spring Boot application''s heap dump at Amadeus was reachable through an endpoint without authentication; it held access
    credentials and tokens, the administrator passwords in it allowed read and write access to what heise calls the global system, and heise could
    search live bookings by surname with names, dates of birth, booking codes and ID and passport data visible in plain text, a large share concerning
    Lufthansa and Condor flights. Amadeus told heise it was alerted on 2026-09-21 to a potential vulnerability affecting a display environment
    for travel bookings, that payment or financial data could not be accessed, that it fixed the flaw and strengthened monitoring, and that whether
    unauthorised parties accessed data is open; the BSI says it passed the report to the vendor through its coordinated-disclosure process. No
    source links the two events, and no source names a Swiss airline, agency or traveller.'
  region_nexus: global; the credential-case disclosures come from Japan and South Korea, the separate heap-dump exposure involved German travel
    data (Lufthansa, Condor, German travel-agency office IDs); no Swiss entity is named by any source
  primary_sector_nexus: indirect (shared travel-IT supplier whose reservation records carry passport data; no source says Swiss government travel
    is in scope)
