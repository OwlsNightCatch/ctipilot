  summary: HM Inspectorate of Constabulary and Fire & Rescue Services published on 2026-10-27 a report on cybersecurity in police forces and fire
    and rescue services. Its release says inspectors raised concerns about third-party ICT suppliers, particularly where suppliers store or manage
    sensitive police data, found that all inspected organizations rely on legacy systems they rate as their highest cybersecurity risk, and found
    weak backup and restore arrangements and incomplete monitoring coverage; it makes 13 recommendations, including better procurement and contract
    management of ICT suppliers. The Record, reading the full report, says the Police Digital Service and the National Police Chiefs' Council
    shared information on multiple cyberattacks on third-party ICT supply chains that held police information since 2021, that the report gives
    no number, supplier, force or data-theft status for them, that the Police Digital Service recorded 252 incidents and 796 near misses in the
    first quarter of 2026, that most supplier contracts included no ongoing cybersecurity assurance, that staff could not always say whether suppliers
    must report incidents promptly, and that in several organizations supplier-held system logs were not routinely visible to in-house teams.
    The same pattern, sensitive data held at a supplier outside the customer's monitoring, is the core of the PK Softech and Publica incident
    already in the store.
