    attribution: Fortinet PSIRT
    source_url: https://www.fortinet.com/blog/psirt-blogs/analysis-of-reported-credential-compromise-of-fortigate-devices
  - quote: If AD/LDAP integration is configured, it is important to treat this account as compromised
    attribution: Fortinet PSIRT
    source_url: https://www.fortinet.com/blog/psirt-blogs/analysis-of-reported-credential-compromise-of-fortigate-devices
  extended_notes: 'Update-of target: 2026-06-18/fortibleed-73-932-internet-facing-fortigate-devices-exposed (last updated 2026-10-08; not in the
    14-day prior-coverage file). Hudson Rock also lists CVE-2026-24858 (FortiCloud SSO abuse, Fortinet advisory of 2026-01-27) as campaign context,
    not as the mechanism for every host. Related entry, a different finding: 2026-10-22/k0t-fortiweb-fortigate-globalprotect-edge-device-campaign
    (Group-IB and NyxLab on k0t).

    Single-source because the counts rest on Hudson Rock''s own analysis of files it obtained; aggregator copies seen in search results (CyberSecurityNews,
    GBHackers, CyberPress) were not read and are not cited, and hacksnack.ch is a Swiss relay. The provenance of the configuration files is not
    stated by any source.

    Post-compromise checks the sources support (config sections as named by Hudson Rock): compare config system admin with approved owners and
    change history, with attention to recurring names fgtsecure, fgtsec, Technical_support, forticloud-sync and forti-auth-tech (Hudson Rock says
    a name is an investigation lead, not proof; Fortinet names forticloud, fortiuser, fortinet-support and fortinet-tech-support); review config
    user ldap bind secrets, rotate any still-relevant exposed values and watch AD for their use elsewhere; review config user local and VPN policies
    and verify effective MFA; review config system ha, RADIUS and config system email-server secrets. Hardening lever: Hudson Rock links Fortinet
    documentation (for 7.6.1) on per-device generated private-data-encryption keys as the alternative to the system default key, and trusted-host
    or local-in restriction of management access.

    Suggested Admiralty rating: reliability B (Hudson Rock, a lab with a track record on this data), credibility 3 until a second telemetry holder
    confirms the dataset.'
