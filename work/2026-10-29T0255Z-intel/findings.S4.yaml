  summary: 'The Belgian municipality of Machelen published a full timeline of its incident: on 2026-08-20 attackers gained access to an internal
    laptop through misleading instructions on an external website, explored the laptop extensively from 24 August to 1 September, and on 10 September
    gained access to a user with high privileges and other internal IT systems; the municipality found the incident on 11 September, isolated
    all systems and reported to the Belgian CCB-CERT, restarted part of its systems from a safe-date backup on 14 September, filed a police complaint
    on 15 September and recorded the first evidence that data had leaked on 17 September. The municipality confirms that personal data was leaked
    and says the scope is still being established; ITdaily reports the mayor''s first statement that no personal data appeared affected was therefore
    wrong. On 2026-10-27 the Rhysida group listed Machelen on its leak site, which Ransomware.live records as a claim of the municipal and social-welfare
    (OCMW) file servers, 1.3 million files and about 2.9 TB, with social-welfare and migration client files including passports and ID cards,
    nursing-home medical and staff files, civil-status records with national register numbers and payslips; the content and volume are the group''s
    own claims and the municipality has not confirmed them. The same group''s earlier municipal and state-administration extortions (Stuttgart,
    Berlin) are already in the store.'
