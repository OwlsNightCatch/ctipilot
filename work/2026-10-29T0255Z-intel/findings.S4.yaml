  extended_notes: 'Suggested Admiralty rating: reliability A for the airlines'' own notices (first-party), credibility 2 (cause not confirmed
    by Amadeus; Amadeus silent on the credential case). Suggested priority: notable, not critical.

    Exposure (from sources): any airline or travel buyer whose reservations sit in Amadeus-run systems; JAL says the exposed records are those
    present on Amadeus''s system between 2023-08-10 and 2026-09-23. No vendor check exists in the sources; the practical test is to ask the airline
    or travel-management provider in writing whether staff bookings, passport data included, were in scope.

    Detection / after-the-fact: JAL warns of mails, calls and fake sites impersonating the airline; the BSI (via heise) says there can be a long
    delay between a data leak and a phishing campaign and advises particular suspicion of mails about outstanding payments and early check-in
    as the travel date approaches. Nothing in the sources gives a telemetry hook for the intrusion itself.

    Supplier-side lesson (analyst reading, flagged as inference): valid-account access to customer-record systems at a supplier lasted, on the
    airlines'' estimate, up to about three years; supplier reviews should ask about service-account inventory, MFA and anomalous-access monitoring
    on accounts that can read customer records.

    Related Amadeus items in the sources, none linked to the above by any source: heise (2026-10-13) mentions a hotel-booking incident at Amadeus''s
    iHotelier service reported by Hotel vor9 (Maritim emailed 8,716 guests on 2026-09-17); it is a different product and the cause is unclear.

    Lead only (not cited): Safeguard.sh (2026-10-26) and Rescana (2026-10-26) are aggregator analyses of the Korean Air and Asiana notices; they
    add nothing first-hand.'
