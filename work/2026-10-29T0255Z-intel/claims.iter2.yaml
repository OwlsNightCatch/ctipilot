    surface: "section 2026-10-29T04:53:00Z"
    kind: uncited
    text: "Until the fix is installed, ESX logs from a period of administrator access are not reliable evidence of what was done; vCenter task and event records and syslog forwarded off the host are the sources to review."
  - claim_id: 06f259c467
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "record 2026-10-29T04:53:00Z"
    kind: record-summary
    text: "CISA added the ESX insufficient-logging flaw CVE-2026-41709 to its Known Exploited Vulnerabilities catalog on 2026-10-28, and CrowdStrike says the actor WARP PANDA exploited it as a zero-day in vCenter-environment intrusions as late as early 2026; Broadcom's advisory still carries no exploitation statement. The CVE record moves to exploited and KEV-listed, and ESX audit logs can no longer be treated as a complete record of administrator activity."
