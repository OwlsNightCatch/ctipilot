  - claim_id: 77585fbe8a
    entry: 2026-10-25/zdi-linux-kernel-reports-public-skb-zerocopy-root-exploit
    surface: "summary"
    kind: frontmatter
    text: "Trend Micro's Zero Day Initiative copied public Linux kernel lists on five kernel reports on 2026-10-21 before any fix was merged, and Sysdig ranks ZDI-CAN-33367 as the one to act on: a local privilege escalation through skb_zerocopy() that gets past the Dirty Frag fix, with a public exploit that TuxCare reproduced as root on AlmaLinux 8 to 10, CloudLinux 9 and 10, Debian 12 and 13 and Ubuntu 24.04 and 26.04. A reviewed patch is in the kernel's networking tree but not in mainline, AlmaLinux 8, 9 and 10 shipped fixed production kernels on 2026-10-28, none of the six reports has a CVE, and two ksmbd reports that ZDI scores CVSS 9.0 matter only where the in-kernel SMB server runs; no exploitation in the wild is reported."
  - claim_id: 2e190d9b4c
    entry: 2026-10-25/zdi-linux-kernel-reports-public-skb-zerocopy-root-exploit
    surface: "actions[0]"
    kind: frontmatter
    text: "On every AlmaLinux host where untrusted users or workloads run code, install kernel-4.18.0-553.178.1.el8_10, kernel-5.14.0-687.60.1.el9_8 or kernel-6.12.0-211.69.1.el10_2 or later and reboot, or apply TuxCare's KernelCare patch on EL9 and EL10; the sources read show no fixed kernel yet for other distributions."
  - claim_id: 974344ea57
    entry: 2026-10-25/zdi-linux-kernel-reports-public-skb-zerocopy-root-exploit
    surface: "body"
    kind: cited
    text: "On 2026-10-21 Trend Micro's Zero Day Initiative sent five Linux kernel reports and copied public mailing lists on every one, several with no fix in any released kernel; none of the six reports has a CVE ("
    urls: ["https://www.sysdig.com/blog/detecting-and-mitigating-zdi-can-33367-and-five-other-linux-flaws"]
  - claim_id: fbeaabd1ad
    entry: 2026-10-25/zdi-linux-kernel-reports-public-skb-zerocopy-root-exploit
    surface: "body"
    kind: cited
    text: "ZDI-CAN-33367 matters most: skb_zerocopy() moves shared page-cache pages into a new socket buffer without the marker the Dirty Frag fix added, so IPsec ESP decrypts in place and an unprivileged local user writes attacker bytes into the cached copy of a read-only file, which gives root through a setuid binary or /etc/passwd; the public exploit needs unprivileged user namespaces and networking modules such as nlmon and act_pedit ("
    urls: ["https://www.sysdig.com/blog/detecting-and-mitigating-zdi-can-33367-and-five-other-linux-flaws"]
  - claim_id: 5f430738ec
    entry: 2026-10-25/zdi-linux-kernel-reports-public-skb-zerocopy-root-exploit
    surface: "body"
    kind: cited
    text: "TuxCare reproduced a root shell on AlmaLinux 8 to 10 (Dirty Frag fix installed), CloudLinux 9 and 10, Debian 12 and 13 and Ubuntu 24.04 and 26.04 (AppArmor user-namespace restriction bypassed) ("
    urls: ["https://www.sysdig.com/blog/detecting-and-mitigating-zdi-can-33367-and-five-other-linux-flaws"]
  - claim_id: 978d35d469
    entry: 2026-10-25/zdi-linux-kernel-reports-public-skb-zerocopy-root-exploit
    surface: "body"
    kind: cited
    text: "A reviewed patch from the netdev list is now in the kernel's networking tree but not in mainline, and a kernel with only the fix for CVE-2026-90049, a bug in the same function, is not covered ("
    urls: ["https://www.sysdig.com/blog/detecting-and-mitigating-zdi-can-33367-and-five-other-linux-flaws", "https://tuxcare.com/blog/zdi-ksmbd-bugs-cve/"]
  - claim_id: 1e5730383a
    entry: 2026-10-25/zdi-linux-kernel-reports-public-skb-zerocopy-root-exploit
    surface: "body"
    kind: cited
    text: "AlmaLinux has put fixed kernels into production (4.18.0-553.178.1.el8_10, 5.14.0-687.60.1.el9_8, 6.12.0-211.69.1.el10_2), and TuxCare's rebootless patch is out for EL9 and EL10, with EL8 ready and Debian and Ubuntu in progress ("
    urls: ["https://almalinux.org/blog/2026-10-23-zdi-can-33367/", "https://tuxcare.com/blog/zdi-ksmbd-bugs-cve/"]
  - claim_id: 0fc27842b3
    entry: 2026-10-25/zdi-linux-kernel-reports-public-skb-zerocopy-root-exploit
    surface: "body"
    kind: cited
    text: "ZDI-CAN-33774 is a pre-authentication race in the SMB1 or SMB2 handler choice: its public proof of concept leaks 28 bytes of kernel heap per attempt and can crash the kernel, ZDI labels it remote code execution, nothing public shows code execution, and a fix is queued in ksmbd-for-next ("
    urls: ["https://www.sysdig.com/blog/detecting-and-mitigating-zdi-can-33367-and-five-other-linux-flaws", "https://www.phoronix.com/news/LKML-New-Trend-Vulnerabilities"]
  - claim_id: f21d724ea7
    entry: 2026-10-25/zdi-linux-kernel-reports-public-skb-zerocopy-root-exploit
    surface: "body"
    kind: cited
    text: "ZDI-CAN-33549 is an SMB Direct integer underflow that needs an RDMA interface, a writable share and an SMB Direct client, and its proof of concept crashes the kernel ("
    urls: ["https://www.sysdig.com/blog/detecting-and-mitigating-zdi-can-33367-and-five-other-linux-flaws"]
  - claim_id: 6ec3c01a0c
    entry: 2026-10-25/zdi-linux-kernel-reports-public-skb-zerocopy-root-exploit
    surface: "body"
    kind: cited
    text: "ZDI scores both 9.0, and Red Hat Enterprise Linux does not include ksmbd by default ("
    urls: ["https://thehackernews.com/2026/10/two-cvss-90-linux-ksmbd-rce-flaws.html"]
  - claim_id: 7690f8da85
    entry: 2026-10-25/zdi-linux-kernel-reports-public-skb-zerocopy-root-exploit
    surface: "body"
    kind: cited
    text: "For ksmbd, look for the ksmbd module, the ksmbd.mountd daemon and a kernel-owned listener on TCP 445 ("
    urls: ["https://www.sysdig.com/blog/detecting-and-mitigating-zdi-can-33367-and-five-other-linux-flaws"]
  - claim_id: 01fedf99f6
    entry: 2026-10-25/zdi-linux-kernel-reports-public-skb-zerocopy-root-exploit
    surface: "body"
    kind: cited
    text: "**Detection:** the exploit is one unprivileged process that unshares into new user and network namespaces and writes sysctls, brings up an nlmon interface, installs XFRM state over netlink, adds an nftables NFQUEUE rule, attaches a tc pedit action with a redirect and then calls splice() into a socket on the loopback address; Sysdig says nothing legitimate does all of that from one unprivileged process, so syscall-level runtime telemetry sees it ("
    urls: ["https://www.sysdig.com/blog/detecting-and-mitigating-zdi-can-33367-and-five-other-linux-flaws"]
  - claim_id: a7fa38de28
    entry: 2026-10-25/zdi-linux-kernel-reports-public-skb-zerocopy-root-exploit
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** restrict unprivileged user namespaces where nothing depends on them (Sysdig says user.max_user_namespaces=0 should block the public exploit, untested by TuxCare, and breaks rootless containers and some build tooling), do not rely on Ubuntu's AppArmor restriction, set seccomp RuntimeDefault on Kubernetes pods and install the fixed kernel where your distribution has shipped it; unload ksmbd where unused and keep TCP 445 to trusted networks where it must stay ("
    urls: ["https://www.sysdig.com/blog/detecting-and-mitigating-zdi-can-33367-and-five-other-linux-flaws"]
  - claim_id: 4c510d79bc
    entry: 2026-10-25/zdi-linux-kernel-reports-public-skb-zerocopy-root-exploit
    surface: "body"
    kind: uncited
    text: "Two reports concern ksmbd, the kernel's own SMB server, not Samba."
