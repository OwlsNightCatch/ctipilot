claims:
  - claim_id: 3f509d9e3e
    entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
    surface: "headline"
    kind: frontmatter
    text: "CVE-2026-46300 (Fragnesia): CISA lists the Linux kernel root flaw as exploited, chained with PHP2Shell"
  - claim_id: 387b194f30
    entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
    surface: "summary"
    kind: frontmatter
    text: "CVE-2026-46300 (\"Fragnesia\", CVSS 7.8) is a local privilege escalation in the Linux kernel's xfrm ESP-in-TCP path, one of three CVEs Red Hat groups as \"Dirty Frag\"; CISA added it to its Known Exploited Vulnerabilities catalog on 2026-10-28 and says it can be chained with the PHP2Shell flaws CVE-2026-109618 and CVE-2026-109619 to implant PHP webshells and run commands as root, and Dream Research reports such a chain against 24 firewalls of one unnamed vendor and a US government-affiliated network. Its public exploit overwrites /usr/bin/su in the page cache, and Red Hat confirms RHEL kernels are affected (CISA KEV, 2026-10-28 · Dream Research, 2026-10-27 · Red Hat RHSB-2026-003)."
  - claim_id: 3441b2d275
    entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
    surface: "actions[0]"
    kind: frontmatter
    text: "Patch CVE-2026-46300 on every Linux host that runs PHP or other internet-facing code, then on multi-tenant hosts, container nodes and CI runners: apply the distribution kernel update and reboot; until then, where IPsec is not in use, block and unload the `esp4`, `esp6` and `rxrpc` modules (this breaks IPsec), and drop the page cache so a file already modified in memory reloads from disk."
  - claim_id: b89f94f8a8
    entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
    surface: "actions[1]"
    kind: frontmatter
    text: "On any PHP web host, appliance or management server that was reachable and unpatched for the PHP2Shell flaws, look for PHP files in web-reachable directories that nobody deployed, an outbound SSH session from the host that a systemd service or an rc.local entry keeps up, and password-spray bursts against Active Directory from the host's address, because Dream Research reports a chain of the two flaws that did exactly that."
  - claim_id: fa86589329
    entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
    surface: "cves[CVE-2026-46300]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-46300\", \"cvss\": \"7.8\", \"status\": [\"exploited\", \"cisa-kev\", \"poc-public\", \"patch-available\"], \"affected\": null, \"fixed\": null, \"auth\": \"post-auth\", \"vector\": \"local\"}"
  - claim_id: b8864cabad
    entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
    surface: "body"
    kind: cited
    text: "Improper handling of shared page fragments during skb coalescing lets an unprivileged local user modify read-only file contents in the kernel page cache and gain root ("
    urls: ["https://www.wiz.io/blog/fragnesia-linux-kernel-local-privilege-escalation-via-esp-in-tcp"]
  - claim_id: 4edbe191a7
    entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
    surface: "body"
    kind: cited
    text: "The public exploit uses user and network namespaces to obtain CAP_NET_ADMIN inside an isolated namespace, installs a crafted ESP security association over NETLINK_XFRM and overwrites the start of `/usr/bin/su` in the page cache only, so the on-disk binary never changes ("
    urls: ["https://www.wiz.io/blog/fragnesia-linux-kernel-local-privilege-escalation-via-esp-in-tcp"]
  - claim_id: 25c6b38d25
    entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
    surface: "body"
    kind: cited
    text: "Dirty Frag discoverer Hyunwoo Kim says the flaw was accidentally activated by the patch for CVE-2026-43284 ("
    urls: ["https://www.helpnetsecurity.com/2026/05/14/fragnesia-cve-2026-46300-linux-lpe-vulnerability/"]
  - claim_id: f5ba0f40b2
    entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
    surface: "body"
    kind: cited
    text: "William Bowling of Zellic.io found it with the company's AI-agentic auditing tool, and a technical explainer and proof-of-concept exploit are public ("
    urls: ["https://www.helpnetsecurity.com/2026/05/14/fragnesia-cve-2026-46300-linux-lpe-vulnerability/"]
  - claim_id: d94253c62b
    entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
    surface: "body"
    kind: cited
