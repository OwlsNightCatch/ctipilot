    kind: cited
    text: "**Detection:** in package metadata, a binding.gyp whose sources field runs node in a package with no C or C++ sources, a postinstall that requires a .node file and discards errors beside a large high-entropy file, and prebuilt addons with no native source; on endpoints and CI runners, a node process that downloads or finds and runs the Bun runtime and a child node process started from a temporary path named after its process ID; in GitHub and GitLab audit logs, a new public repository in a developer's own account with a generic project description, commits with a fixed automated-sync message, commits that add AI-assistant configuration files (.claude, .cursor, .gemini, .vscode tasks, CLAUDE.md or AGENTS.md), an injected CI job that requests OIDC tokens, and unexpected patch releases of your own packages ("
    urls: ["https://safedep.io/testmetest-npm-worm-miasma-variant"]
  - claim_id: 189339fbc8
    entry: 2026-10-29/testmetest-npm-worm-runs-on-import-ignore-scripts
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** an install that ran with scripts disabled is not clean once the package has been imported; for an affected host SafeDep's order is to disconnect it, remove persistence first, rotate all credentials, check the accounts for the repositories and commits above and reinstall the operating system ("
    urls: ["https://safedep.io/testmetest-npm-worm-miasma-variant"]
