    surface: "body"
    kind: cited
    text: "In the first case, proposal-themed emails led a user to download an MSI named like a DocuSign installer that installed Hexnode components (gateway, agent and a PostgreSQL service); ScreenConnect followed shortly after and connected to an attacker relay, the managed-service provider removed it, and it came back several hours later to the same relay while the Hexnode client was still installed ("
    urls: ["https://www.huntress.com/blog/attackers-turn-mdm-into-remote-access"]
