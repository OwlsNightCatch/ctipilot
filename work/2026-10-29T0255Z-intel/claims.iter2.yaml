    entry: 2026-10-29/mdaemon-clamav-unrar-cve-2025-8088-exploited-in-ukraine
    surface: "summary"
    kind: frontmatter
    text: "ESET reports an active campaign in Ukraine in which Russia-aligned attackers exploited MDaemon mail servers: a crafted RAR archive mailed to any address makes MDaemon invoke ClamAV, whose old bundled UnRAR library carries the path-traversal flaw CVE-2025-8088, and the exploit writes a malicious DLL to the server with no user interaction. MDaemon fixed it in 26.0.4 on 2026-08-25, and ClamAV's own notes show that every Windows ClamAV from 0.101.0 to 1.5.3 is affected, fixed in 1.4.6 and 1.5.4. The attackers deployed the HELLAGE mail-stealing backdoor and the Telegram-controlled HELLTAG backdoor."
