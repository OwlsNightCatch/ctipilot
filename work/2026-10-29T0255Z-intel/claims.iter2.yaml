    entry: 2026-10-29/testmetest-npm-worm-runs-on-import-ignore-scripts
    surface: "headline"
    kind: frontmatter
    text: "SafeDep and JFrog: the testmetest npm worm now runs on import, so --ignore-scripts does not stop it; 42 repos armed"
  - claim_id: 360606ed5b
    entry: 2026-10-29/testmetest-npm-worm-runs-on-import-ignore-scripts
    surface: "summary"
    kind: frontmatter
    text: "SafeDep and JFrog describe an npm worm, tracked as testmetest, whose newest builds start when an application imports the package, so installing with --ignore-scripts does not stop it. It steals SSH, registry, cloud, CI and AI-tool credentials, publishes new patch versions of the victim's own packages, and wipes the home directory when the stolen GitHub token is revoked. SafeDep counts 19 packages from one operator between 2026-10-19 and 2026-10-27; JFrog found 42 armed GitHub repositories of 11 legitimate owners; neither lab names an actor."
  - claim_id: 1d40c6a590
    entry: 2026-10-29/testmetest-npm-worm-runs-on-import-ignore-scripts
    surface: "actions[0]"
    kind: frontmatter
    text: "Compare every lockfile and CI cache against the package list in SafeDep's post; on each host that installed or imported a listed package, disconnect it, remove persistence first and only then rotate the GitHub, npm, cloud and SSH credentials it could read, because the worm wipes the home directory when the stolen GitHub token is revoked."
  - claim_id: 2b6a043978
    entry: 2026-10-29/testmetest-npm-worm-runs-on-import-ignore-scripts
    surface: "body"
    kind: cited
    text: "SafeDep counts 19 npm packages from the same operator between 2026-10-19 and 2026-10-27, eight of them published through four npm accounts, that carry a worm sharing code with the June Miasma worm and adding the token-revocation wiper of Mini Shai-Hulud; SafeDep has not confirmed the lineage, and JFrog says its evidence does not establish that the original Miasma operators are responsible ("
    urls: ["https://safedep.io/testmetest-npm-worm-miasma-variant", "https://research.jfrog.com/post/beyond-testmetest-42-hijacked-github-repos/"]
