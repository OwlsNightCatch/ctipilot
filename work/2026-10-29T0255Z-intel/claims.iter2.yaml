    text: "List every appliance and management server whose web interface embeds PHP (firewalls, network access control, wireless controllers, backup, storage and security consoles), take each interface off the internet and install its vendor's PHP2Shell fix, because Dream Research reports one appliance vendor's firewalls rooted through an exposed management interface."
