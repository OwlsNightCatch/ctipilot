    text: "F5's release notes for BIG-IP 17.1.3.7, 17.5.1.11 and 21.1.0.4, each updated on 2026-10-24, list K000163821 as the fix for the PHP flaws CVE-2026-109618 and CVE-2026-109619 and call each a critical release whose only new changes are PHP fixes. NCSC-NL's record of K000163821 puts BIG-IP 17.1.0 to 17.1.3, 17.5.0 to 17.5.1 and 21.1.0 in scope, through the Configuration utility of all modules and through the access-profile data plane of APM and SSL Orchestrator; F5's article itself could not be read, and nothing found reports an attack on BIG-IP, although CISA lists both flaws as exploited."
