  - claim_id: cd4bc6eaea
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "body"
    kind: cited
    text: "Dream Research describes the chain it recovered: a custom PHP2Shell build tailored to the management web server of one unnamed vendor's firewall software (PHP 8.0.30), combined with the Linux kernel flaw CVE-2026-46300, gave unauthenticated root on 24 internet-facing firewalls and led, through the second of two firewalls of a US government-affiliated organization (the first crashed), to an outbound SSH tunnel, the rooting of the organization's firewall management server and a password-spraying attack on its Active Directory, and CISA's entry for the kernel flaw says the same chaining ("
