claims:
  - claim_id: bd4b59db16
    entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
    surface: "section 2026-10-29T04:52:00Z"
    kind: cited
    text: "From about 19,000 internet-facing firewalls of that vendor that it found through a search engine, the attacker narrowed to 240 in the United States, Japan, Taiwan and South Korea, rooted 24 and planted a PHP webshell on each; on the second of two firewalls of a US government-affiliated organization (the first crashed) it set up an outbound SSH tunnel kept up by a systemd service and an rc.local entry, rooted the organization's firewall management server through the tunnel, decrypted the LDAP service-account password with root access and sprayed passwords against a domain that had no lockout threshold ("
    urls: ["https://dreamgroup.com/blog/chained-php2shell-exploit-roots-25-servers"]
  - claim_id: fa120c15ac
    entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
    surface: "record 2026-10-29T04:52:00Z"
    kind: record-summary
    text: "CISA added CVE-2026-46300 to its Known Exploited Vulnerabilities catalog on 2026-10-28 and says it can be chained with the PHP2Shell flaws to implant PHP webshells and run commands as root; Dream Research describes such a chain used against 24 firewalls of one unnamed vendor and a US government-affiliated network. The CVE record moves to exploited, the priority from notable to high, and the earlier statement that no source reports exploitation of this CVE is replaced. Removed from the text: the sentence that an attacker can modify any file the user can read (the Detection line still carries it)."
