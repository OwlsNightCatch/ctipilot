  summary: 'NCSC-NL (initial release 2026-10-28, version 1.0.0) summarises Cisco''s Secure Firewall ASA, Secure Firewall Threat Defense and Secure Firewall Management Center hardening release: Cisco grouped internally found flaws into eight CWE classes with one CVE each, four of them at CVSS 9.0 or higher. Cisco''s own advisory (initial release 2026-09-16, version 1.1 of 2026-09-18) lists CVE-2026-20329 (9.9, improper handling of exceptional conditions), CVE-2026-20330 (9.9, malformed structured data), CVE-2026-20331 (9.6, protection-mechanism failure), CVE-2026-20332 (9.0 in Cisco''s table, improper access control), then 20333 (8.8), 20334 (8.4), 20335 (8.1) and 20336 (7.5). NCSC-NL reads the two 9.9 classes as network-reachable with limited user rights and no user interaction. Cisco says there are no workarounds, the products are affected regardless of configuration, and the flaws were found in internal testing with existing processes and frontier AI models. Two vulnerabilities in the access-control class are known to be exploited: the Secure FMC static-credential flaw (CVE-2026-20316) and the FMC authentication bypass (CVE-2026-20079), both already carried by the store; Cisco''s PSIRT knows of no malicious use of the other rows. Fixed ASA releases include 9.16.4.103, 9.18.4.94, 9.20.4.49, 9.22.3.26, 9.23.1.47 and 9.24.1.26 (hot-fix trains must move to those first-fixed builds), and FTD/FMC first-fixed releases are 7.0.10, 7.2.12, 7.4.8, 7.6.6, 7.7.13, 10.0.2 and 10.1.0. The vendor advisory is six weeks old; the in-window event is NCSC-NL''s first publication of it, and no source explains the lag. NCSC-NL''s structured scores differ from Cisco''s table for CVE-2026-20332 (9.9 against 9.0) and CVE-2026-20336 (8.8 against 7.5); four rows are at 9.0 or above on either reading.'
