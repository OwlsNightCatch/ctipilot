  extended_notes: 'S1 OVERLAP: this is a vulnerability item that S1 may also return from the NCSC-CH hub or CERT-FR AVI-1399; dedup on CVE-2026-108142. Exposure check per the vendor: compare the installed build with the fixed builds (13.1.2.57 / 13.0.3.63 for Backup & Replication, 13.1.2.11 for the Linux agent, 13.1.0.7940 for Veeam ONE; the KB links the vendor''s build lists KB2680 and KB2681); 12.x is out of scope for the Backup & Replication rows. The CDP Coordinator Service on the backup server is the stated attack surface (NCSC.ch prerequisite: network access to it). No source states a post-patch compromise indicator or a detection; the following are inferred from the stated mechanisms, not from a source: authorization and audit events on the CDP service, file writes by the backup service outside configured repository paths for the NAS path-traversal rows, and Veeam ONE audit entries showing MFA switched off.'
