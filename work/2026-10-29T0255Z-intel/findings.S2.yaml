- title: 'BACS weekly review, week 43: new wave of WhatsApp account takeovers through fake "vote for my friend''s daughter" sites (verification-code and linked-device QR abuse), over 50 reports in October 2026'
  sources:
  - url: https://www.bacs.admin.ch/de/26w43-de
    publisher: BACS / NCSC Switzerland
    date: '2026-10-27'
    role: primary
  discovery_trace: 'first seen at: ncsc-ch-focus, `url https://www.bacs.admin.ch/de/im-fokus` (card of 2026-10-27, href /de/26w43-de) -> primary (no pivot needed): BACS, URL https://www.bacs.admin.ch/de/26w43-de'
  summary: 'BACS reports a renewed, larger wave of reports about stolen or manipulated WhatsApp accounts: over 50 reports in October 2026 alone, many of them successful (the page''s description line says over 40, the body text says over 50). The lure is a message from an already compromised contact in the victim''s address book asking for a vote in a school or dance competition. The linked, professionally faked site then either asks for the phone number and the six-digit WhatsApp registration code that arrives by SMS (which activates the account on the attacker''s device) or shows a QR code to be scanned through WhatsApp''s ''Linked devices'' function (which silently links the attacker''s device, so the victim may not notice). The attackers then read chats, groups and photos and send the same lure to the whole address book; BACS says the links use many constantly changing domains to get past filters, and that it reported the method already in spring 2026. BACS recommends never entering the WhatsApp verification code on a website, using ''Linked devices'' only for one''s own devices, enabling two-step verification with a PIN, and, if hijacked, unlinking unknown devices or re-registering the number (a PIN set by the attacker forces a seven-day wait).'
  region_nexus: Switzerland (BACS reporting-office data)
  primary_sector_nexus: indirect (staff private and work-adjacent messaging accounts; no public-sector victim stated)
