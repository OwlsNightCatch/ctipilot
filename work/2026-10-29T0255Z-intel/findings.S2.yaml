  summary: 'Veeam published two knowledge-base advisories on 2026-10-27 and NCSC Switzerland relayed them on its Cyber Security Hub on 2026-10-28 (post 13109, vendor reports no evidence of exploitation). The critical row is CVE-2026-108142, CVSS 4.0 9.1 (AV:N/AC:L/AT:P/PR:N, high integrity and availability impact on the backup server): an unauthenticated attacker with network access to the CDP Coordinator Service of the Windows-based Veeam Backup & Replication or the Veeam Software Appliance can bypass authorization on that service. Affected are Veeam Backup & Replication 13.1.1.18 and all earlier 13.1 builds and 13.0.2.29 and all earlier 13.0 builds; Veeam states 12.x is not affected. Fixed builds are 13.1.2 (13.1.2.57) and 13.0.3 (13.0.3.63). Two medium rows (CVE-2026-108140 and CVE-2026-108141, CVSS 4.0 5.9) need the Restore Operator role plus control over the contents of a backed-up NAS share and allow a relative path-traversal write of attacker-controlled files to an arbitrary path on the backup server; CVE-2026-105477 (CVSS 4.0 7.3) is a local privilege escalation in Veeam Agent for Linux 13.1.1.4 and earlier 13.1 builds when the agent is managed by a Backup & Replication instance (fixed in 13.1.2.11). Separately, Veeam ONE 13.1.0.7233 and earlier 13.1 builds let an attacker with valid Administrator credentials disable MFA globally before completing MFA verification (CVE-2026-107671, CVSS 4.0 8.5; fixed in Veeam ONE 13.1 P1, build 13.1.0.7940; 13.0.x and 12.x not affected). heise adds that backup servers are a favourite ransomware target; none of the five is reported exploited, and no source states whether the CDP service is enabled by default or what the ''attack requirements present'' qualifier in the vector means in practice.'
  region_nexus: global product; the NCSC.ch hub post makes it a home-region authority advisory; Veeam Backup & Replication is a common backup platform in public administrations (not verified here for any named Swiss body)
