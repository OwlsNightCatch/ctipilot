  discovery_trace: 'first seen at: inside-it-ch, `feed https://www.inside-it.ch/rss.xml 30` (item of 2026-10-27 12:23 UTC, URL https://www.inside-it.ch/schweizer-eishockeyverband-erleidet-datenleck-20261027) -> Netzwoche (2026-10-28, URL https://www.netzwoche.ch/news/2026-10-28/tor-fuer-cyberkriminelle-hacker-klauen-daten-des-schweizer-eishockeyverbands) -> primary: SRF, URL https://www.srf.ch/news/schweiz/diebstahl-persoenlicher-daten-schweizer-eishockeyverband-wird-opfer-eines-cyberangriffs (relaying the SIHF notice to affected persons)'
  summary: SRF reports, relaying the federation's notice to potentially affected people, that an unauthorised person used a user's credentials between 2026-10-17 and 2026-10-19 to reach the central administration and game-operations portal MySIHF and took personal data, which was then offered for sale in an internet forum; SIHF noticed the offer on Monday 2026-10-26, blocked the misused access, fixed the weakness, informed the Federal Data Protection Commissioner and announced a criminal complaint. Possibly affected data are names, dates of birth, postal and e-mail addresses, telephone numbers, profile pictures and club and team affiliation, not passwords. Inside IT, reading the seller's sample files (titles such as referees, players and coaches), reports the forum claim as over 540,000 records on about 87,000 people including about 37,000 e-mail addresses, 6,500 telephone numbers and 656 IBANs, and says the data may include non-members; SIHF told Inside IT the offered data appear genuine and that the systems were not attacked directly but data may have been taken through a compromised user account. The transferable point is the single-credential path into a central portal that exposes bulk personal data of tens of thousands of people; the federation is a private association, so there is no public-sector nexus.
