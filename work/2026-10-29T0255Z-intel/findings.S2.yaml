  discovery_trace: 'first seen at: inside-it-ch, `feed https://www.inside-it.ch/rss.xml 30` (item of 2026-10-28 13:55 UTC, URL https://www.inside-it.ch/so-will-der-bund-den-umgang-mit-ki-regeln-20261028) -> corroboration: ICTkommunikation, URL https://ictk.ch/inhalt/bundesrat-nimmt-zwischenstand-der-ki-regulierung-zur-kenntnis; the federal press release itself was not reachable (the news.admin.ch listing returns only the 12 newest cards and omitted it)'
  summary: 'At its meeting of 2026-10-28 the Federal Council took note of the state of work and first results on implementing the Council of Europe AI Convention (ratification decided 2025-02-12): a BAKOM report on sector measures across the federal administration (76 of 93 offices answered), a handout for voluntary industry AI codes, and a mandate for the UVEK to build an internal knowledge exchange on self-regulation by end of March 2028. Binding measures are prepared by the EJPD with other departments; Inside IT reports a consultation draft planned for spring 2027. Of relevance to defenders, the report says BACS treats AI as a priority topic in the review of the National Cyber Strategy, with the steering committee to propose whether AI stays integrated or becomes its own field, and that the BIT runs an in-house AI assistant (''Koby'') on its own infrastructure, requires AI projects to be reported to the Chief Security Officer and plans an internal AI-governance directive. Nothing in the reporting creates an obligation or deadline for cantons, communes or SOCs.'
