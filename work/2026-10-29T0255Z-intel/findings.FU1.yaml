candidate_sources:
  - id: checkpoint-support
    publisher: "Check Point support sk articles"
    url: "https://support.checkpoint.com/results/sk/sk1000302"
    category: vendor-psirt
    why: "Already a tracked source (checkpoint-support); recipe re-confirmed 2026-10-29: the buildId rotated to jyeWtlX3-gkWYUXATNR8Q and the data route https://support.checkpoint.com/_next/data/<buildId>/results/sk/<skid>.json returned the full sk1000302 body (symptoms, solution, dates). Not a new candidate; listed so the main agent can append the dated note."
  - id: netapp-security-advisories
    publisher: "NetApp Product Security advisories (security.netapp.com)"
    url: "https://security.netapp.com/advisory"
    category: vendor-psirt
    why: "First-party advisories for storage; the site is a React SPA whose data route https://security.netapp.com/adv_api/advisory/<NTAP-id> (bridge url --direct) returns fix tables, affected and unaffected lists, exploitation field and revision history as JSON; extract alone returns only the summary text."
  - id: juniper-cna-records
    publisher: "Juniper SIRT CVE records (CVE Services API)"
    url: "https://cveawg.mitre.org/api/cve/CVE-2026-103409"
    category: vendor-psirt
    why: "Juniper's support-portal bulletins (supportportal.juniper.net) are Salesforce JavaScript shells on every transport; Juniper SIRT's own CVE records carry affected, fixed, workaround, exploitation and CVSS fields. Pivot: NVD API keywordSearch with a publication window lists the sirt@juniper.net records, then cveawg.mitre.org/api/cve/<id> gives the vendor text."

coverage_gaps:
  - { source_id: "f5-my-f5-com", reason: "K000163821 (my.f5.com/manage/s/article/...) is a Salesforce-style JavaScript portal: extract returns a 722 kB shell with only the title 'myF5', WebFetch and jina return a 'Loading' placeholder, Vulners aggregator answers 403 on extract and WebFetch. Working substitute for fixed versions: F5 techdocs release-note supplements https://techdocs.f5.com/kb/en-us/products/big-ip_ltm/releasenotes/related/relnote-supplement-bigip-<version>.html via extract (list K000163821 per fixed build). F5's exposure, mitigation and exploitation wording remains unread." }
  - { source_id: "juniper-supportportal", reason: "supportportal.juniper.net articles (JSA112681 PHP2Shell reference advisory, JSA112183 Session Smart bulletin) are JavaScript shells on extract, WebFetch and jina. Substitute: Juniper SIRT CVE records via cveawg.mitre.org/api/cve/<id>; for JSA112681 (no CVE record of its own) only NCSC-NL's rows are available." }
  - { source_id: "broadcom-support-portal", reason: "Umbrella PHP2Shell advisory 39404 reads with extract (affected: Carbon Black App Control Server, Symantec Endpoint Protection Manager, CloudSOC SpanVA Appliance; under investigation: CASMA). The product pages 39411, 39421 and 39429 return the Broadcom sign-in page (login required), so SEPM and App Control fixed builds are known only through NCSC-NL (SEPM 14.3.27716.10000 and 14.4.494.0000 reported by a community issue and not independently verified)." }
  - { source_id: "trendmicro-success", reason: "extract of KA-0024802 returns the prose but drops the product status table (the part that carries the ETAs); the table is in the raw HTML returned by the bridge url subcommand. Recipe: url <URL>, then strip tags around 'TrendAI Products/Services Impacted'." }

dispositions:
  # ----------------------------------------------------------------- Task A, vendors without an item
  - { task: A, lead: "Juniper JSA112681 (Junos J-Web on EX and SRX, PHP2Shell)", disposition: "no item: vendor page unreadable on every rung (Salesforce shell). Best secondary: NCSC-NL list row of 2026-10-28, which records that Juniper JSA112681, updated 2026-10-27, states Junos OS is vulnerable to CVE-2026-109618 but not exploitable (reachable out-of-memory issue described as harmless), is not affected by CVE-2026-109619, and that SRX no longer uses PHP from 25.2R1 (the EX boundary is not given). Role: national-authority compile of a vendor statement, not a primary. Not exploited, not an exploitable critical per Juniper." }
  - { task: A, lead: "Broadcom: Symantec Endpoint Protection Manager, Carbon Black App Control Server, CloudSOC SpanVA Appliance, CASMA (advisory 39404)", disposition: "no item: umbrella advisory 39404 read (affected: App Control Server, SEPM, SpanVA; under investigation: CASMA; not vulnerable: about 30 products including CAS, ASG, CloudSOC CASB, DLP, SES agent); the per-product pages with versions and fixes are login-gated, so fixed builds are secondary only (NCSC-NL: SEPM 14.3.27716.10000 and 14.4.494.0000 from a community report, not verified). Re-check when Broadcom's pages are readable." }
  - { task: A, lead: "Splunk (SVD-2026-1013, PHP2Shell on Splunk products, last updated 2026-10-26)", disposition: "no item: Splunk Enterprise, Enterprise Security, ITSI, SOAR, UBA, Universal Forwarder, Cloud Platform and the Cisco products listed are Unaffected; only Smartlook was affected and is remedied with no evidence of exploitation." }
  - { task: A, lead: "Sophos (sophos-sa-20261021-php2shell, version 4, updated 2026-10-22)", disposition: "no item: 'No Sophos products are affected'; only the hosted MyUTM licensing portal for end-of-life SG UTM ran affected PHP, was taken offline on 2026-10-21 and is being updated; no evidence of exploitation found so far; Sophos Firewall and Endpoint IPS signatures of 2026-10-22 detect attempts. No customer action." }
  - { task: A, lead: "N-able (N-sight, Passportal, Mail Assure, Take Control session routing)", disposition: "no item: vendor-hosted; N-able states all relevant products were secured at 2026-10-22 18:30 EDT and it has detected no exploitation in its suite (Take Control standalone patching was 'nearly complete')." }
  - { task: A, lead: "Securepoint Resellerportal, Cleo Streem Print, Checkmk Appliance 1.7.25, Ubiquiti UISP CRM 3.1.70, TerraMaster TOS 6, Synology PHP 7.3, Tenable Security Center and Enclave, Siemens RUGGEDCOM APE1808, Fortinet FG-IR-26-186 products", disposition: "no item: Securepoint (reseller portal, patched before 2026-10-22, no public build), Cleo (fix by mail, niche print module), Checkmk (fixed by bundled PHP 8.2.35 in appliance 1.7.25), Ubiquiti (fixed in UISP Application 3.1.70) and TerraMaster (TOS 5/6 affected, migrate to TOS 7; NAS class already covered by the QNAP/Synology entry) are niche or low-exposure; Tenable, Siemens and Fortinet are already in the PHP2Shell entry of 2026-10-21. Read only through NCSC-NL rows." }
  - { task: A, lead: "SonicWall, Ivanti, Dell, Veeam, Zyxel, VMware (named in the task)", disposition: "no item: none of them has a row in the NCSC-NL list, and two targeted WebSearch passes found no vendor statement naming them for PHP2Shell. Not read further." }
  - { task: A, lead: "Fortinet FG-IR-26-186", disposition: "no item: store entry already carries it; the NCSC-NL list shows FortiDDoS, FortiSOAR and FortiSOAR PaaS still under investigation (2026-10-22) and FortiClient Cloud forensics endpoints remediated; S1 re-read the advisory on 2026-10-29 and found no newer revision." }
  # ----------------------------------------------------------------- Task B
  - { task: B, lead: "CERT-PL Wing FTP Server CVE-2026-105420", disposition: "no item: Wing FTP Server before 8.2.6; CVSS 4.0 9.4 but the attack needs administrator privileges (PR:H): an admin can add user directories through scripts that escape the base folder and write files, giving code execution as the process owner, root if installed with sudo as the install guide says. Fixed in 8.2.6. Not in KEV (kev-window.txt lists only CVE-2026-41709 and CVE-2026-46300); no exploitation stated by CERT Polska." }
  - { task: B, lead: "CERT-FR AVI-1397 CPython (PSF-2026-47, CVE-2026-103995)", disposition: "no item: security-policy bypass in CPython, no score or exploitation read; developer runtime." }
  - { task: B, lead: "CERT-FR AVI-1398 Google Chrome 156.0.8078.73/.74 (2026-10-27)", disposition: "no item: 52 fixes, four rated Critical (CVE-2026-118306, -118331, -118348, -118344: memory corruption, input validation, use after free); the release post carries no in-the-wild statement; browser, not edge or identity infrastructure." }
  - { task: B, lead: "CERT-FR AVI-1400 Samba CVE-2026-109411", disposition: "no item: Samba before 4.25.1; access-control bypass limited to shares using the vfs_ceph_rgw module (S1 read the vendor page); no exploitation." }
  - { task: B, lead: "CERT-FR AVI-1401 Docker Desktop before 4.97.0 (CVE-2026-114409, CVE-2026-99999)", disposition: "no item: Docker's announcement for 4.97.0 describes credential-bearing logs and a second issue on developer workstations; no pre-auth critical, no exploitation." }
  - { task: B, lead: "CERT-FR AVI-1402 Palo Alto Networks PAN-OS (CVE-2026-109618, -109619, -115560)", disposition: "no item: covered by store entry 2026-10-22/pan-os-panorama-php2shell-mgmt-interface-no-fixed-release; the bulletin repeats Palo Alto's active-exploitation statement and the six builds still awaiting hotfixes (12.1.4-h13, 12.1.10-h3, 11.2.4-h23, 11.1.7-h12, 10.2.7-h39, 10.2.10-h42), the same state S1 read at 03:36Z." }
  - { task: B, lead: "CERT-FR AVI-1403 Metabase (GHSA-v44v-x8x4-mvcw)", disposition: "no item: 'Metabase 64 security update', a hardening and LTS release with a batch of fixes, no CVE or score published; self-hosted Metabase before 0.64.3.4 (OSS) or 1.64.3.4 (Pro and Enterprise) should upgrade; no pre-auth critical or exploitation stated." }
  - { task: B, lead: "CERT-FR AVI-1404 Mitel OpenScape Endpoint Management (MISA-2026-0009)", disposition: "no item: V1 R2.4.0 and earlier; MTLVULN-1788 Node-RED authentication bypass needs user interaction (CVSS 3.1 8.8, PR:N/UI:R), MTLVULN-1789 admin-only privilege escalation 7.2; fixed in V1R2.5.1; no CVE assigned yet, no exploitation stated." }
  - { task: B, lead: "CERT-FR AVI-1405 Microsoft Edge, AVI-1406 Mozilla (mfsa2026-118 to -121)", disposition: "no item: routine Chromium and Firefox/Thunderbird release advisories (Edge before 149.0.4022.62; Firefox before 159, ESR 153.6 and 115.44); no exploitation statement in the Mozilla advisory read." }
  - { task: B, lead: "CERT-FR AVI-1407 Belden (PSIRT-9, ICX35-HWC)", disposition: "no item: login-lockout bypass by deleting cookies, CVSS 3.1 5.2, fixed in 1.14.158." }
  - { task: B, lead: "CERT-FR AVI-1408 Axis Camera Station Pro (CVE-2026-63286)", disposition: "no item: database backups open to offline attack, CVSS 3.1 7.1, fixed in Camera Station Pro 6.20; Axis is not aware of exploitation; old backups stay vulnerable and credentials stored in the product should be changed (vendor advice)." }
  - { task: B, lead: "NCSC-NL NCSC-2026-0455 Apple macOS (Golden Gate 27.2, Tahoe 26.7.2, Sequoia 15.8.2, Monterey 12.7.6)", disposition: "no item: about 299 CVE rows, the only 9.8 in the CSAF (CVE-2026-64767) is the Sequoia-only afpfs buffer overflow, which Apple describes as a remote attacker able to cause system termination or corrupt kernel memory (an AFP client path, not server infrastructure); none of the three macOS notes read (149521 to 149523) carries an exploitation statement." }
  - { task: B, lead: "NCSC-NL NCSC-2026-0457 Splunk Enterprise (SVD-2026-1007, -1008 of 2026-10-21)", disposition: "no item (borderline mention only): fixed in 10.4.4, 10.2.8, 10.0.11 and 9.4.16. SVD-2026-1007 tops out at 8.8 with authentication; the unauthenticated rows are denial of service at 7.5 (CVE-2026-76288 JavaScript logger, CVE-2026-76290 Edge Processor download). SVD-2026-1008 is a 'security hardening' release of internally found issues grouped by CWE with Splunk scores up to 9.9 (CVE-2026-76299, -76302; low-privilege network attacker in NCSC-NL's CSAF vectors); Splunk scores CVE-2026-76301 at 7.6 while the CISA-ADP record scores that aggregate 9.8 PR:N, a scoring artefact of the grouped CVE. No exploitation statement. Published 2026-10-21, NCSC-NL relayed it 2026-10-28; a PHP2Shell check in SVD-2026-1013 shows Splunk Enterprise unaffected." }
  # ----------------------------------------------------------------- Task C
  - { task: C, lead: "Oracle PeopleSoft CVE-2026-35273 (The Register 2026-10-28, ZDI 2026-10-20, THN 2026-10-28)", disposition: "no update-of item. The 'renewed mass exploitation' note is Mandiant's report of 2026-09-25, which the store already carries (entry 2026-06-11/shinyhunters-oracle-peoplesoft-campaign-gadget-chain-access, Mandiant/GTIG 2026-09-25), and The Register and The Hacker News only relay it. ZDI's blog of 2026-10-20 (outside the window) adds technical decomposition and no exploitation, victim, fix or status change: ZDI reported three distinct bugs across two components (PSIGW HttpListeningConnector SSRF, ZDI-CAN-31816, with the HttpTargetConnector forwarding to a caller-chosen URL and body; PSEMHUB validateClient trusts the loopback entry that ships in /envmetadata/config/allowedhosts.properties; PSEMHUB ExecuteProcessActivityCommand log-write with attacker-chosen path and contents, and an XMLDecoder deserialization of a malicious XML file read at the next service start that needs no web shell), Oracle patched all under the single CVE-2026-35273, and ZDI is coordinating separate CVE ids per bug (none assigned as of 2026-10-28 per THN). Not in the store (grep for allowedhosts, XMLDecoder, HttpListeningConnector, PSIGW finds nothing). Candidate for an `improvement` record on the 2026-06-11 entry (detection-relevant: loopback-trusted internal hub, restart-triggered XML payload leaves no web shell); watch for the new CVE ids." }
  # ----------------------------------------------------------------- Task D
  - { task: D, lead: "Juniper Session Smart Router / Conductor, CCCS AV26-1101", disposition: "returned as item 3: Juniper's advisory is JSA112183 (bulletin 'On-Demand Security Bulletin: Session Smart Router and Session Smart Conductor: Multiple internally discovered vulnerabilities resolved'); at least 18 CVEs, two unauthenticated 9.8, fixed in 7.0.5, 7.1.7, 7.2.3, no known exploitation, no workaround." }

