    discovery_trace: "first seen at: NCSC-NL PHP2Shell software status list, URL https://raw.githubusercontent.com/NCSC-NL/php2shell/main/software/changelog_software_list.md (bridge url; NetApp ONTAP 9 rows citing NTAP-20261021-0021) -> primary: NetApp advisory page https://security.netapp.com/advisory/NTAP-20261021-0021 (React SPA; extract fell to the jina reader and returned the summary, impact, scoring and exploitation text but not the tabs) -> the site's own data route https://security.netapp.com/adv_api/advisory/NTAP-20261021-0021 (path read from the SPA bundle main.de335e73.js: '/adv_api/advisory/<id>'; bridge url --direct) returned the fix table, 158-entry unaffected list and revision history -> NetApp KB article (extract) for the affected ONTAP web services."
    summary: |
      FACTS (NetApp advisory NTAP-20261021-0021, version 9.0 of 2026-10-26, status Interim): ONTAP 9 is the only affected product and is "Affected only by CVE-2026-109618"; CVE-2026-109619 does not apply. NetApp's impact text: an unauthenticated attacker could potentially gain access as the www user but would be restricted to the PHP jail, limiting the scope. Both CVEs are scored CVSS 4.0 9.2 (AV:N/AC:H/AT:P/PR:N). Exploitation statement: "NetApp is aware of public discussion of this vulnerability" (the advisory's exploitation field reads Public); no exploitation is stated. Fixed builds listed: 9.14.1P18HF1 (added 2026-10-26), 9.15.1P20HF1, 9.16.1P16HF1, 9.17.1P11HF1, 9.18.1P8HF1 and 9.19.1P3HF1; revision history shows the first builds on 2026-10-24 and the rest on 2026-10-25 and 2026-10-26, and 2026-10-26 replaced the workaround text with a link to a KB article. About 158 other NetApp products are listed as not affected.
