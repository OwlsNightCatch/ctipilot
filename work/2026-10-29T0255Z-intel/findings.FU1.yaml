  - title: "Check Point firewalls and PHP2Shell: sk1000302 names Force, Spark and Cloud firewalls with a VPN or captive-portal feature enabled as affected; hotfixes exist since 2026-10-23 and the R81.20 hotfix was reissued on 2026-10-28"
    sources:
      - { url: "https://support.checkpoint.com/results/sk/sk1000302", publisher: "Check Point (sk1000302, created 2026-10-21, lastModified 2026-10-28)", date: "2026-10-28", role: "primary" }
      - { url: "https://raw.githubusercontent.com/NCSC-NL/php2shell/main/software/changelog_software_list.md", publisher: "NCSC-NL PHP2Shell software status list (row of 2026-10-22, stale on the fix)", date: "2026-10-22", role: "corroborating" }
    discovery_trace: "first seen at: NCSC-NL PHP2Shell software status list, URL https://raw.githubusercontent.com/NCSC-NL/php2shell/main/software/changelog_software_list.md (bridge url; row 'Check Point firewall web interfaces', 2026-10-22, listed as an index only) -> primary: Check Point sk1000302, URL https://support.checkpoint.com/results/sk/sk1000302 (a Next.js shell to a direct GET; body read from the site's data route https://support.checkpoint.com/_next/data/jyeWtlX3-gkWYUXATNR8Q/results/sk/sk1000302.json with the buildId read from the shell's _buildManifest.js reference, per the checkpoint-support source note). The store has no Check Point PHP2Shell entry (prior_coverage grep for Check Point returns nothing)."
    summary: |
      FACTS (Check Point sk1000302, vendor primary, lastModified 2026-10-28): under certain circumstances the PHP flaws CVE-2026-109618 and CVE-2026-109619 (CVSS 9.2 each) allow remote code execution through firewall web interfaces. Affected are Check Point Force Firewalls, Spark Firewalls and Cloud Firewalls that use one or more of: Mobile Access Portal (not Spark), Remote Access VPN with SSL Network Extender (not Spark), Remote Access VPN with SAML Realm authentication enabled, Identity Awareness Captive Portal, UserCheck Portal, Zero Phishing. Affected versions are R81.20, R82, R82.10 and R82.20 (R80 to R81.10 end of support, also affected), Spark R81.10.x and R82.00.x (Spark R77.20.x and R80.20.x end of support). Check Point Portal and SaaS services are already patched; Security Management and Log Servers are not impacted; Check Point products are not vulnerable to the third PHP issue CVE-2026-115560.
      FIX: hotfix packages for R82.20 (also a 3900-appliance package), R82.10 (also 3900), R82 and R81.20, and Spark builds R82.00.11 (build 998002823) and R81.10.17 (build 996004992). Check Point states the hotfix "implements the PHP 7.4 published fix", is compatible with every Jumbo Hotfix Accumulator take, must be installed on each gateway, cluster member, security group member or standalone server, and needs a reboot. Revisions: 2026-10-23 18:30 GMT first hotfix; 2026-10-26 08:40 GMT R82, R82.10 and R82.20 packages reissued to allow standalone deployments (firewall and management on one appliance); 2026-10-28 11:50 GMT the R81.20 package reissued to fix a Mobile Access problem, it must sit on Jumbo Hotfix Accumulator take 166 or higher and is required where the Mobile Access Portal is used (without Mobile Access an installed earlier build needs no update). The fix is also planned for the Jumbo Hotfix Accumulators of 2026-11-11. NCSC-NL's row of 2026-10-22 still says the Jumbo fix is planned for 2026-11-11 and is stale.
      INTERIM MITIGATION (Check Point, before the hotfix): append a "Require all denied" block to the gateway's cp-httpd.conf under $CPDIR/web/Apache/conf and restart the portals (mpclient commands differ per release; Spark has its own procedure); the hotfix procedure says to remove those lines before installing it. R82.20 gateways protect themselves through the "PHP Remote Code Execution" IPS signature even when IPS is not enabled and HTTPS Inspection is off.
      ABSENCES: the sk text read carries no exploitation statement and no post-compromise check. CISA lists both CVEs as exploited (store entry 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619); nothing read ties an exploitation case to Check Point gateways.
