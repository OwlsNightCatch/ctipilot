      Exposure check per the vendor: the feature list is the discriminator; a gateway with none of the listed portals or VPN features enabled is outside the stated scope. Detection concept (class first): gateway web-daemon (cp-httpd) access logs for the portal paths, process-creation events on the gateway for the web daemon spawning shells, and outbound connections initiated by the gateway; the sk gives no indicator guidance, so none is claimed. Defender takeaway: install the hotfix for the release in use (R81.20 hosts that use Mobile Access need the 2026-10-28 package on top of take 166 or higher), remove the manual cp-httpd.conf mitigation first, reboot, and treat portals that faced the internet before the fix as needing a compromise check because the sk is silent on whether patching evicts an attacker.

