  # ------------------------------------------------------------------ 3. Juniper SSR (task D)
  - title: "Juniper Session Smart Router and Conductor: JSA112183 fixes at least 18 CVEs including two unauthenticated critical flaws (CVSS 9.8), root command execution through a crafted salt minion ID on the Conductor (CVE-2026-103406) and admin takeover of a Router before onboarding (CVE-2026-103409); fixed in 7.0.5, 7.1.7 and 7.2.3, no exploitation known"
    sources:
      - { url: "https://cyber.gc.ca/en/alerts-advisories/juniper-networks-security-advisory-av26-1101", publisher: "Canadian Centre for Cyber Security (AV26-1101)", date: "2026-10-28", role: "corroborating" }
