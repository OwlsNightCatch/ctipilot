    discovery_trace: "first seen at: cccs-alerts Atom feed, URL https://www.cyber.gc.ca/api/cccs/atom/v1/get?feed=alerts_advisories&lang=en (item 'Juniper Networks security advisory (AV26-1101)', 2026-10-28T19:30Z, bridge feed) -> CCCS advisory page https://cyber.gc.ca/en/alerts-advisories/juniper-networks-security-advisory-av26-1101 (extract lists Session Smart Conductor and Router before 7.0.5, 7.1.7, 7.2.3; the raw HTML (bridge url --direct) carries the link to Juniper's bulletin 'https://supportportal.juniper.net/s/article/2026-10-On-Demand-Security-Bulletin-Session-Smart-Router-and-Session-Smart-Conductor-Multiple-internally-discovered-vulnerabilities-resolved') -> Juniper bulletin page unreadable on every rung (extract returns the Salesforce shell, WebFetch returns a loading placeholder, jina returns nothing) -> pivot: NVD CVE API keyword search 'Session Smart' (publication window 2026-10-20 to 2026-10-29) returned 17 records with source sirt@juniper.net, all referencing https://supportportal.juniper.net/JSA112183; a check of the neighbouring ids in the CVE Services API added CVE-2026-103404 (Juniper, same advisory) -> primary: Juniper's own CVE records read from the CVE Services API for CVE-2026-103409 and CVE-2026-103406 (fields exploits, solutions, workarounds, metrics, source.advisory)."
    summary: |
      FACTS (Juniper SIRT CVE records, published 2026-10-28; advisory JSA112183, discovery marked INTERNAL, bulletin title per the CCCS link 'On-Demand Security Bulletin: Session Smart Router and Session Smart Conductor: Multiple internally discovered vulnerabilities resolved'): at least 18 CVEs: CVE-2026-103390 to -103394, -103400 to -103411 and -106079 (the bulletin page itself could not be read, so the list may be longer; the ids -103395 to -103399 belong to other vendors). Affected: Session Smart Router and Session Smart Conductor before 7.0.5, before 7.1.7 (7.1.0 to 7.1.6) and before 7.2.3 (7.2.0 to 7.2.2); fixed in 7.0.5, 7.1.7 and 7.2.3 "and all subsequent releases"; "There are no known workarounds" for CVE-2026-103409 and none for CVE-2026-103406. For both critical records Juniper's exploitation field says "Juniper SIRT is not aware of any malicious exploitation of this vulnerability."
      The two unauthenticated criticals (CVSS 3.1 9.8, AV:N/AC:L/PR:N/UI:N): CVE-2026-103409, Session Smart Router, missing authentication for a critical function: an unauthenticated network attacker obtains administrative privileges by passing crafted URL parameters to an insecure endpoint running as root; it can only be exploited before the device is onboarded to Mist or a Conductor and no longer once onboarded. CVE-2026-103406, Session Smart Conductor only, OS command injection in the AutomatedProvisioner: a remote attacker executes arbitrary commands as root through a specially crafted salt minion ID (the record title says the attack happens during key management; the sources read give no listener or port).
      Other high rows (CVSS 3.1): CVE-2026-103401 (8.8) link following in the unauthenticated web-server handlers lets a local unprivileged user overwrite arbitrary files as root through unauthenticated API endpoints, exploitable on Mist-managed routers and on unmanaged routers not yet onboarded to a Conductor (Conductor-managed routers are not affected); CVE-2026-103402 (8.8) unverified cache files in PCLI; CVE-2026-103403 and CVE-2026-106079 (8.8) OS command injection in AccessManager for an authenticated or config-write user; CVE-2026-103407 (8.8) path traversal in ConfigDirector's certificate and private-key REST API for an authenticated REST user; CVE-2026-103408 (8.8) stack buffer overflow in the DHCP client giving remote code execution to an unauthenticated attacker on the local network through a malicious DHCP reply (adjacent); CVE-2026-103410 (7.5) integer overflow in the DPI certificate scanner, unauthenticated remote denial of service through a crafted TLS server certificate; CVE-2026-103411 (7.1) DHCP decoder underflow. CVE-2026-103404 (6.8) lets a local user read routing credentials on the Conductor through files that processes write to /tmp. The remainder are medium or low.
      GAPS: the Juniper bulletin page itself could not be read, so its workaround and exposure text for the other 16 CVEs is not confirmed; scores for the others come from the CNA records via the NVD API and the CVE Services API (statuses 'Awaiting Analysis').
