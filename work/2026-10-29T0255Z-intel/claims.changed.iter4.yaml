  - claim_id: 73ba63917d
    entry: 2026-10-22/pan-os-panorama-php2shell-mgmt-interface-no-fixed-release
    surface: "summary"
    kind: frontmatter
    text: "Palo Alto Networks' advisory of 2026-10-21 now says, as read on 2026-10-28, that active exploitation has been observed targeting the PAN-OS management interface exposed to the internet, after a copy of 2026-10-27 said very limited exploitation, rates the flaw Critical with urgency Highest (CVSS-B 9.2) and lists every release of PAN-OS 12.2, 12.1, 11.2, 11.1 and 10.2 and of Panorama as affected by the PHP flaws CVE-2026-109618 and CVE-2026-109619 through the management web interface (the HTTPS web UI and the XML API service). Nineteen of twenty hotfixes are released (one for each maintenance line from 10.2.7 to 12.2.4, as read on 2026-10-29) and 11.1.7-h12 carries an estimated date of 2026-10-30; the advisory names no actor or victim, and GlobalProtect and the captive portal are not affected. CISA added both PHP flaws to its Known Exploited Vulnerabilities catalog on 2026-10-26."
  - claim_id: 836f5562b4
    entry: 2026-10-22/pan-os-panorama-php2shell-mgmt-interface-no-fixed-release
    surface: "actions[0]"
    kind: frontmatter
    text: "Take the management interface of every PA-Series and VM-Series firewall and Panorama off the internet now by restricting it to a jump box or trusted internal addresses, because Palo Alto reports active exploitation against internet-exposed management interfaces, and install the hotfix for your maintenance release, which Palo Alto's table lists for every line from 10.2.7 to 12.2.4 (11.1.7-h12 is due 2026-10-30, and 11.2.10-h17 adds the Brotli fix)."
