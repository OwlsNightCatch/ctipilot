    surface: "section 2026-10-29T07:03:00Z"
    kind: cited
    text: "CISA's catalog entry of 2026-10-28 for the Linux kernel flaw CVE-2026-46300 says it can be chained with CVE-2026-109618 and CVE-2026-109619 to implant PHP webshells and run commands as root ("
    urls: ["https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"]
  - claim_id: 328f9221df
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "section 2026-10-29T07:03:00Z"
    kind: cited
    text: "Dream Research reports a chain that takes these flaws to root on appliances: a custom, non-public PHP2Shell build for the management web server of one large vendor's firewall software, which runs PHP 8.0.30 with a high memory limit, gave code execution as the nobody user, and the kernel flaw lifted it to root in one HTTP request in under 15 minutes ("
    urls: ["https://dreamgroup.com/blog/chained-php2shell-exploit-roots-25-servers"]
  - claim_id: 6ea9efbf1b
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "section 2026-10-29T07:03:00Z"
    kind: cited
    text: "Dream found the build tuned to eleven firmware versions, nine exploitable, with offsets from the vendor's own PHP library, the deployment-specific calibration CrowdStrike expects a reliable exploit to need (an inference) ("
    urls: ["https://dreamgroup.com/blog/chained-php2shell-exploit-roots-25-servers", "https://www.crowdstrike.com/en-us/blog/obstacles-to-weaponizing-php2shell-likely-constrain-exploitation/"]
  - claim_id: d24dfc8bfc
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "section 2026-10-29T07:03:00Z"
    kind: cited
    text: "From about 19,000 internet-facing firewalls of that vendor it narrowed to 240, rooted 24 and left a PHP webshell on each, and from the second of two firewalls of a US government-affiliated organization (the first crashed) built a persistent outbound SSH tunnel, rooted the organization's firewall management server through it and began an attack on its Active Directory; Dream could not tell whether that attack succeeded, does not name the vendor, calls the campaign apparently Chinese and AI-assisted and does not attribute it to a named actor ("
    urls: ["https://dreamgroup.com/blog/chained-php2shell-exploit-roots-25-servers"]
  - claim_id: 12d82217b3
    entry: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
    surface: "section 2026-10-29T07:03:00Z"
    kind: cited
    text: "The targets were firewalls whose management interfaces were reachable from the internet ("
    urls: ["https://dreamgroup.com/blog/chained-php2shell-exploit-roots-25-servers"]
