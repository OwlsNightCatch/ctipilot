  - title: "CVE-2026-45659 — Microsoft SharePoint Server deserialization RCE: authenticated attacker with Site Member permissions executes arbitrary code network-side, patched inadvertently omitted from May 2026 release notes"
    sources:
      - url: "https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-45659"
        publisher: "Microsoft PSIRT (MSRC)"
        date: "2026-05-21"
        role: "primary"
      - url: "https://security-hub.ncsc.admin.ch/#/posts/12594"
        publisher: "NCSC Switzerland (GovCERT.ch CSH)"
        date: "2026-05-26"
        role: "corroborating"
      - url: "https://www.helpnetsecurity.com/2026/05/26/sharepoint-vulnerability-cve-2026-45659/"
        publisher: "Help Net Security"
        date: "2026-05-26"
        role: "corroborating"
    discovery_trace: "first seen at: ncsc-ch-security-hub bridge (ncsc-csh recent 15), post 12594 dated 2026-05-26T14:32 → primary: MSRC advisory, URL https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-45659 (fetched via bridge msrc cve subcommand) → corroborating: NCSC.ch CSH post 12594 and Help Net Security article"
    summary: |
      CVE-2026-45659 is a high-severity remote code execution flaw (CVSS 3.1: 8.8, temporal 7.7; CWE-502 Deserialization of Untrusted Data) in Microsoft SharePoint Server. Exploitation requires network access and authentication at Site Member level (PR:L) — the lowest non-anonymous SharePoint role — making this accessible to any domain-joined user or compromised service account in an on-premises SharePoint environment. Microsoft's attack-complexity rating is Low (AC:L) because the payload is repeatable without prior knowledge of the target environment's configuration. The vulnerability stems from SharePoint deserializing untrusted data from attacker-controlled content submitted over the network without adequate type-checking. A notable administrative detail: the patch was included in the May 2026 Patch Tuesday update set (released 2026-05-12) but the CVE was inadvertently omitted from Microsoft's May 2026 Security Update release notes; it was disclosed out-of-band on 2026-05-21 and updated 2026-05-26. Affected builds requiring patching: SharePoint Server Subscription Edition before 16.0.19725.20280, SharePoint Server 2019 before 16.0.10417.20128, SharePoint Enterprise Server 2016 before 16.0.5552.1002. No public PoC, no exploitation confirmed as of 2026-05-28. SharePoint has been targeted by nation-state actors and ransomware operators historically, and public-sector on-prem SharePoint deployments should treat this as a priority patch. Detection: SharePoint ULS (Unified Logging Service) logs anomalous deserialization errors; monitor for suspicious child-process spawns from w3wp.exe (IIS worker) via Sysmon EID 1. Hardening: patch to stated build numbers; apply principle of least privilege for SharePoint site membership to limit the pre-auth surface.
    ch_eu_nexus: "Global with EU public-sector nexus — on-premises SharePoint is heavily deployed in CH/EU government and large public-sector organizations; NCSC.ch flagged it specifically"
    public_sector_nexus: "direct — on-prem SharePoint deployments in government, defense, and public-sector enterprises"
    sector: "government, critical infrastructure, enterprise"
