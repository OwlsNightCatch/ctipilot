  - title: "Germany's Cabinet approves Cybersicherheitsstärkungsgesetz — BKA, BSI, and Federal Police gain authority to redirect traffic and disable attacker infrastructure"
    sources:
      - url: "https://www.heise.de/news/Hackback-Erlaubnis-Kabinett-macht-Weg-frei-11308323.html"
        publisher: "Heise Security (DE)"
        date: "2026-05-27"
        role: "primary"
      - url: "https://www.onvista.de/news/2026/05-27-kabinett-billigt-gesetz-fuer-offensive-cyberabwehr-0-20-26515861"
        publisher: "onvista / dpa"
        date: "2026-05-27"
        role: "corroborating"
      - url: "https://www.t-online.de/nachrichten/deutschland/id_101271406/kabinett-gibt-bsi-und-polizei-befugnisse-zur-cyberabwehr.html"
        publisher: "t-online (DE)"
        date: "2026-05-27"
        role: "corroborating"
    discovery_trace: "first seen at: heise-sec feed, URL https://www.heise.de/security/feed.xml (item dated 2026-05-27T12:23) → primary: Heise Security article, URL https://www.heise.de/news/Hackback-Erlaubnis-Kabinett-macht-Weg-frei-11308323.html → corroborating: onvista/dpa (https://www.onvista.de/news/2026/05-27-kabinett-billigt-gesetz-fuer-offensive-cyberabwehr-0-20-26515861) and t-online (https://www.t-online.de/nachrichten/deutschland/id_101271406/kabinett-gibt-bsi-und-polizei-befugnisse-zur-cyberabwehr.html)"
    summary: |
      On 2026-05-27 the German federal cabinet approved the Cybersicherheitsstärkungsgesetz (Law to Strengthen Cybersecurity), granting three German federal agencies — the Bundeskriminalamt (BKA), the Bundesamt für Sicherheit in der Informationstechnik (BSI), and the Federal Police (Bundespolizei) — new authority to conduct what the government frames as active cyber defence rather than hackbacks. Under the law, the agencies may redirect attacker-controlled data traffic, selectively intervene in IT systems from which attacks originate, delete or modify data on attacker servers, and shut down dangerous C2 nodes — including on foreign infrastructure. Interior Minister Alexander Dobrindt (CSU) positioned the measure as enabling authorities to "act when a threat is concrete." The government explicitly distinguishes this from offensive retaliation, limiting powers to disrupting infrastructure that is actively being used to attack Germany. The internet industry association Bitkom and civil-society groups (notably netzpolitik.org) warned that the new powers for BKA and Federal Police functionally enable hackbacks, pose collateral-damage risks due to shared hosting and VPN servers, and may require constitutional scrutiny. The law also mandates roughly 350 new positions across the three agencies and an additional ~€50 million per year in personnel and material. The bill next proceeds to Bundestag for legislative passage; it does not yet have force of law. For defenders: the law signals that Germany intends to adopt a more aggressive posture against C2 infrastructure — relevant context for threat-intel teams tracking takedown patterns and anticipating future coordinated EU/DE law-enforcement actions against bulletproof hosters.
    ch_eu_nexus: "Direct EU nexus — Germany is a primary EU member state; law aligns with NIS2 active-defence push and directly affects cyber-law context for all EU public-sector defenders"
    public_sector_nexus: "direct — law governs powers of federal public-sector security agencies"
    sector: "government, law enforcement, critical infrastructure"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
