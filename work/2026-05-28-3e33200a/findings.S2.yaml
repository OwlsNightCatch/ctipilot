        attribution: "onvista / dpa"
        source_url: "https://www.onvista.de/news/2026/05-27-kabinett-billigt-gesetz-fuer-offensive-cyberabwehr-0-20-26515861"
      - quote: "BKA erhält Zugriff auf Angreifer-Infrastruktur"
        attribution: "Heise Security"
        source_url: "https://www.heise.de/news/Hackback-Erlaubnis-Kabinett-macht-Weg-frei-11308323.html"
    extended_notes: |
      Defender angle: German authorities gaining legal authority to sinkhole, redirect, or shut down attack infrastructure will affect global defenders' threat-intel picture when German law enforcement acts against shared bulletproof infrastructure — servers hosting ransomware C2, stealers, or DDoS botnets used against multiple countries simultaneously may be disrupted as a by-product. SOC managers should be aware that unexplained C2 outages involving Germany-adjacent hosting could be law-enforcement action, not malware infrastructure rotation. The law also establishes new BSI authority to demand security improvements from critical-infrastructure operators in real time during incidents.

  - title: "Roundcube Webmail 1.6.16 / 1.7.1 — unauthenticated SQL injection (CVE-2026-48842) in virtuser_query plugin plus three further high-severity flaws; NCSC.ch flags active attack potential"
    sources:
      - url: "https://roundcube.net/news/2026/05/24/security-updates-1.6.16-and-1.7.1"
        publisher: "Roundcube Project"
        date: "2026-05-24"
        role: "primary"
      - url: "https://security-hub.ncsc.admin.ch/#/posts/12596"
        publisher: "NCSC Switzerland (GovCERT.ch CSH)"
        date: "2026-05-27"
        role: "corroborating"
      - url: "https://www.heise.de/news/Roundcube-Webmail-Instanzen-mit-Schadcode-attackierbar-11307545.html"
        publisher: "Heise Security (DE)"
        date: "2026-05-27"
        role: "corroborating"
    discovery_trace: "first seen at: ncsc-ch-security-hub bridge (ncsc-csh recent 15), post 12596 dated 2026-05-27T09:13 → primary: Roundcube project news, URL https://roundcube.net/news/2026/05/24/security-updates-1.6.16-and-1.7.1 → corroborating: NCSC.ch CSH post 12596 (https://security-hub.ncsc.admin.ch/#/posts/12596) and Heise article (https://www.heise.de/news/Roundcube-Webmail-Instanzen-mit-Schadcode-attackierbar-11307545.html)"
    summary: |
      Roundcube Webmail patched four vulnerabilities on 2026-05-24 across its supported branches; NCSC Switzerland published a CSH advisory on 2026-05-27 flagging the cluster as requiring prompt action. The most critical flaw is CVE-2026-48842 (CVSS 3.1: 8.1, CWE-89): a pre-authentication SQL injection in the virtuser_query plugin, introduced by a preg_replace() backslash-escape bypass. An unauthenticated network attacker can inject arbitrary SQL via the login username field when the virtuser_query plugin is enabled. The companion flaws are CVE-2026-48843 (CVSS HIGH: CSS sanitisation failure in HTML email messages that may leak data via SSRF or disclose server-side information through a crafted SVG animate attributeName="style" bypass), CVE-2026-48844 (CVSS HIGH: code-injection via the LDAP autovalues option — evaluation of arbitrary PHP code when the option is configured), and CVE-2026-48848 (CVSS HIGH: HTML sanitisation bypass via SVG document permitting CSS injection). Roundcube is the dominant self-hosted webmail platform across European public administrations, educational institutions, and ISPs — deployments without the virtuser_query plugin are unaffected by CVE-2026-48842 but remain exposed to the three other high-severity flaws. Patched versions: 1.6.16 LTS (for 1.6.x deployments) and 1.7.1 (for 1.7.x). Prior branches (1.5.x and earlier) are EOL and do not receive patches. Detection: scan webserver access logs for POST requests to index.php or ?_task=login with SQLi-pattern payloads in the _user parameter; CVE-2026-48844 exploitation would manifest as PHP execution from the LDAP autovalues handler — monitor for unexpected process spawns from the Roundcube process tree (e.g., Sysmon EID 1 with parent image roundcube/PHP-FPM).
    ch_eu_nexus: "Direct — Roundcube is the dominant open-source webmail across CH/EU public sector and academic institutions; NCSC Switzerland issued an advisory"
    public_sector_nexus: "direct — government, academic, and public ISP Roundcube deployments"
