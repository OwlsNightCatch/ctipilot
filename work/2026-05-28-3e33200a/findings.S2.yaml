  - title: "Slican PBX triple authentication bypass cluster (CVE-2026-35087 / -35089 / -35090) — CERT-PL discloses unauthenticated admin access to Polish/EU enterprise telephone exchanges"
    sources:
      - url: "https://cert.pl/en/posts/2026/05/CVE-2026-35087/"
        publisher: "CERT Polska"
        date: "2026-05-27"
        role: "primary"
      - url: "https://euvd.enisa.europa.eu/enisa/eu_vulnerability_database/EUVD-2026-32276"
        publisher: "ENISA EUVD"
        date: "2026-05-27"
        role: "corroborating"
    discovery_trace: "first seen at: enisa-euvd bridge (enisa-euvd recent lastvulnerabilities), EUVD entries EUVD-2026-32276, EUVD-2026-32277, EUVD-2026-32278 dated 2026-05-27 → primary: CERT Polska advisory, URL https://cert.pl/en/posts/2026/05/CVE-2026-35087/ (fetched)"
    summary: |
      CERT Polska disclosed three vulnerabilities in Slican PBX telephone exchange firmware on 2026-05-27. Slican is a Polish manufacturer of PBX and IP telephony equipment with broad deployment in Polish government, public administration, healthcare, and enterprise environments; the equipment is also sold across Central and Eastern Europe. CVE-2026-35087 (CVSS 4.0: 9.3, CRITICAL): the administrative protocol allows command-based authentication bypass — an attacker with network access to the admin port can bypass credential checks entirely by issuing a specific command, obtaining admin shell access without credentials. CVE-2026-35089 (CVSS 4.0: 8.7): the secure key protecting the admin service is generated deterministically from system properties that are publicly obtainable without authentication; an attacker can compute the key and extract admin credentials. CVE-2026-35090 (CVSS 4.0: 9.3, CRITICAL): the remote management modem interface accepts a specific hardcoded caller-ID to bypass admin authentication, granting full service-protocol access regardless of remote-access configuration — if remote access is disabled, the call temporarily re-enables it. All three are unauthenticated remote vulnerabilities. Affected product/version pairs requiring update: IPx series (all before 6.61.0040), CCT-1668 / MAC-6400 (all before 6.56.0430), CXS-0424 (all before 6.30.0510), NCP (all before 1.24.0250). EOL hardware (versions 4.xx and below — CCT-1668 CCT1CPU, MAC-6400, CXS-0424 discontinued 2011/2012) will not receive patches; vendor recommends hardware upgrade. Detection: log all admin-service connections; alert on admin sessions without preceding successful credential exchange; monitor PSTN modem interface for unexpected incoming calls from unknown caller-IDs targeting the exchange admin function.
    ch_eu_nexus: "Direct EU nexus — CERT-PL primary disclosure; Slican equipment widely deployed in Polish public sector and Central/Eastern European government and enterprise environments"
    public_sector_nexus: "direct — government, health, and public-sector PBX deployments"
    sector: "government, healthcare, telco"
    cves: [CVE-2026-35087, CVE-2026-35089, CVE-2026-35090]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "CVE-2026-35087: Slican telephone exchanges allow administrative protocol authentication bypass. An attacker can bypass the need to enter login credentials by executing the appropriate command."
        attribution: "CERT Polska"
        source_url: "https://cert.pl/en/posts/2026/05/CVE-2026-35087/"
      - quote: "CVE-2026-35090: In Slican telephone exchanges it is possible to manage the control panel remotely. An unauthenticated attacker can connect to the modem via a telephone with a specific caller ID. This allows them to bypass admin authentication and gain full access to the service protocol and configuration panel."
        attribution: "CERT Polska"
        source_url: "https://cert.pl/en/posts/2026/05/CVE-2026-35087/"

