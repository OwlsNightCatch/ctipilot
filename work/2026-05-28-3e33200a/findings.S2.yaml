  - title: "ILIAS LMS — multiple critical vulnerabilities including unauthenticated SOAP access-bypass, SQL injection in MyStaff and SCORM2004 modules, and missing access-control in upload handler"
    sources:
      - url: "https://docu.ilias.de/go/blog/15821"
        publisher: "ILIAS Security Blog (docu.ilias.de)"
        date: "2026-05-27"
        role: "primary"
      - url: "https://security-hub.ncsc.admin.ch/#/posts/12599"
        publisher: "NCSC Switzerland (GovCERT.ch CSH)"
        date: "2026-05-27"
        role: "corroborating"
    discovery_trace: "first seen at: ncsc-ch-security-hub bridge (ncsc-csh recent 15), post 12599 dated 2026-05-27T15:23 → primary: ILIAS Security Blog, URL https://docu.ilias.de/go/blog/15821 (fetched) → corroborating: NCSC.ch CSH post 12599 (https://security-hub.ncsc.admin.ch/#/posts/12599)"
    summary: |
      The ILIAS Security Group disclosed nine security fixes on 2026-05-27, affecting the open-source Learning Management System used extensively by Swiss and German universities, federal training portals (including NATO DEEP ADL), and public-sector e-learning platforms. The two most severe issues do not have assigned CVE identifiers as of reporting: (a) MantisBT ID 0047787 (CVSS 4.0: 9.8, CRITICAL) — missing access-control check in TileImageUploadHandler; an attacker with network access to the upload endpoint can write arbitrary files, bypassing authentication entirely; (b) MantisBT ID 0047691 (CVSS 4.0: 9.3, CRITICAL) — SQL injection in the ILIAS MyStaff module, exploitable by an authenticated user. Further high-severity findings include ID 0047581 (CVSS 8.7 — broken access-control in the SOAP interface permitting unauthenticated SOAP calls), ID 0047472 (CVSS 7.1 — SQL injection reachable via the SOAP API), ID 0047258 (CVSS 6.9 — unauthorized function calls via SOAP), ID 0047770 (CVSS 8.5 — missing sort-field validation in LP tracking tables), and ID 0047778 (CVSS 8.1 — authenticated SQLi in the SCORM2004 module). NCSC Switzerland notes: disable the SOAP interface if not required for business operations as the most effective interim mitigation. The SOAP interface (disabled by default in many deployments but commonly enabled in enterprise integrations with HR and student-information systems) is the primary unauthenticated attack surface. Affected versions: check the ILIAS Security Blog for per-version mapping; patches are available from the vendor. Detection: review Sysmon/EDR for unexpected outbound connections from ILIAS process; monitor web-server access logs for requests to /ilias.php?baseClass=ilSOAPExplorer or the SOAP WSDL endpoint; flag POST requests to TileImageUploadHandler without a valid session cookie.
    ch_eu_nexus: "Direct — ILIAS is the dominant open-source LMS in Swiss and German public universities, federal training portals, and government e-learning environments; NCSC.ch issued an advisory"
    public_sector_nexus: "direct — universities, government training, defense/NATO academic portals"
    sector: "education, government, defense"
