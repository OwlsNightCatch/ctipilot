    discovery_trace: "first seen at: THN feed (feeds.feedburner.com/TheHackersNews), URL https://feeds.feedburner.com/TheHackersNews → pivoted to WatchGuard primary, URL https://www.watchguard.com/wgrd-security-hub/secplicity-blog/grandoreiro-malware-campaign-targets-europe-and-latin-america → ESET primary, URL https://www.welivesecurity.com/en/malware/btmob-stealthy-rat-burrowing-deep-android-devices/"
    summary: |
      WatchGuard's Threat Lab documented (2026-05-26) a new Grandoreiro campaign exploiting DLL sideloading across four distinct software binaries to deliver Delphi 11-compiled payloads targeting Portuguese and Spanish financial institutions. The four DLL pairs split across two P2P protocols: mingwm10.dll and libwebp.dll use STUN (Session Traversal Utilities for NAT) for peer-to-peer C2 communications; libffi-6.dll and libpng15.dll use ICE (Interactive Connectivity Establishment). Both protocols enable the implant to discover attacker-controlled public IP and port for covert P2P C2 — a NAT-traversal approach that bypasses simple firewall rules. The targeted banks include Abanca, Banco de Portugal, BBVA PT, Caixa Geral Depositos, Santander PT, Revolut, and Wise. The delivery in a parallel campaign uses a phishing ZIP hosted on Mediafire containing an obfuscated VBScript that spoofs an Adobe Reader update request as a social-engineering trigger. Concurrently, ESET published (2026-05-26) on BTMOB Android RAT — the successor to CraxsRAT, CypherRAT, and SpySolr families. BTMOB v4.5.5 (current as of May 2026) provides: device unlock, screenshot capture, keylogging, HTML overlay injections when targeted banking apps launch for credential theft, remote control, and Alipay PIN capture. The RAT operates under a MaaS model with an APK builder interface enabling campaign configuration without coding. Leaked developer toolkits (D3Lab, December 2025) show the full ecosystem: Android payload source, dropper, builder UI, Windows operator panel, C2 backend, and dependencies. BTMOB targets mobile users in Brazil (primary) and Europe (secondary). The MaaS model with leaked source code poses a copy-cat amplification risk.
