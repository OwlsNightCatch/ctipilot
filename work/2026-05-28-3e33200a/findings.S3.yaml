        attribution: "Symantec / Broadcom Threat Intelligence"
        source_url: "https://www.security.com/threat-intelligence/iran-seedworm-electronics"
      - quote: "Both malicious DLLs contain ChromElevator, a publicly available post-exploitation tool capable of covertly stealing and exfiltrating data such as passwords, cookies, and payment card data from Chromium-based browsers"
        attribution: "Symantec / Broadcom Threat Intelligence"
        source_url: "https://www.security.com/threat-intelligence/iran-seedworm-electronics"
      - quote: "In both cases the parent process at the moment of execution was node.exe, suggesting that the sideloading was orchestrated by a Node.js script rather than by the user"
        attribution: "Symantec / Broadcom Threat Intelligence"
        source_url: "https://www.security.com/threat-intelligence/iran-seedworm-electronics"
    extended_notes: |
      Detection angles: (1) EID 4688 process creation with parent-image node.exe spawning cmd.exe or powershell.exe — abnormal ancestor chain for user-initiated sessions; (2) DLL-load events (Sysmon EID 7) for fmapp.dll loaded from fmapp.exe or a DLL named sentinelagentcore.dll loaded from sentinelmemoryscanner.exe — both paths are anomalous; (3) CredUIPromptForWindowsCredentialsW call from non-standard parent processes; (4) Network connections to sendit.sh from endpoints without user-initiated file-transfer workflows. Hardening: disable execution of Node.js in non-developer environments via AppLocker or WDAC; monitor signed-binary DLL-load events for mismatches between expected and observed DLL paths; alert on sideloading from known security-product signed binaries.

  - title: "CrowdStrike/Google/Shadowserver simultaneously neutralise all four C2 channels of the GlassWorm developer-targeting supply-chain botnet; Russia-attributed operators convert infected developer hosts to SOCKS proxies and HVNC nodes"
    sources:
      - url: "https://www.crowdstrike.com/en-us/blog/inside-crowdstrike-takedown-of-a-developer-targeting-botnet/"
        publisher: "CrowdStrike Counter Adversary Operations"
        date: "2026-05-27"
        role: "primary"
