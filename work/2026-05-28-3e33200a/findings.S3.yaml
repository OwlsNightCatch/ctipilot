      Detection: (1) Sysmon EID 7 DLL loads of autorun.dll from non-standard paths — any DLL named autorun.dll loaded by a utility executable is anomalous; (2) msiexec.exe spawned as a child of a user-facing utility without admin intent; (3) ScreenConnect (ConnectWise Control) service installation from an unexpected parent process chain; (4) Registry Run key or scheduled-task creation by SimpleRunPE.exe or hollowed Microsoft-signed process; (5) Network connections from a Microsoft-signed binary to mining pool endpoints; (6) Microsoft Defender exclusion modifications via command-line. Hardening: block unsigned DLLs via WDAC or constrained language mode; restrict msiexec.exe to admin context via AppLocker; monitor ScreenConnect installations outside approved change windows; enable Defender Tamper Protection to block exclusion modification.

  - title: "Grandoreiro banking trojan: WatchGuard documents new DLL-sideloading quartet (fmapp.dll, libwebp.dll, libffi-6.dll, libpng15.dll) with Delphi 11 payloads using STUN/ICE P2P C2 to target Portugal/Spain banks; ESET details BTMOB Android RAT v4.5.5 MaaS successor to CraxsRAT reaching Brazil/Europe"
    sources:
      - url: "https://www.watchguard.com/wgrd-security-hub/secplicity-blog/grandoreiro-malware-campaign-targets-europe-and-latin-america"
