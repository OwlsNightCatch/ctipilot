        publisher: "The Hacker News"
        date: "2026-05-27"
        role: "corroborating"
      - url: "https://techcrunch.com/2026/05/27/crowdstrike-and-google-take-down-botnet-used-by-hackers-to-target-software-developers-in-supply-chain-attacks/"
        publisher: "TechCrunch"
        date: "2026-05-27"
        role: "corroborating"
    discovery_trace: "first seen at: THN feed (feeds.feedburner.com/TheHackersNews), URL https://feeds.feedburner.com/TheHackersNews → primary: CrowdStrike blog, URL https://www.crowdstrike.com/en-us/blog/inside-crowdstrike-takedown-of-a-developer-targeting-botnet/"
    summary: |
      On 2026-05-26 at 14:00 UTC, CrowdStrike Counter Adversary Operations, Google, and the Shadowserver Foundation executed a simultaneous takedown of all four C2 channels operated by GlassWorm — a developer-targeting supply-chain campaign active since at least early 2025. GlassWorm's C2 architecture was designed for resilience: (1) Solana blockchain — C2 server addresses encoded in transaction memo fields, creating an immutable public dead-drop; (2) BitTorrent DHT — GlasswormRAT queries the BitTorrent peer-to-peer network for configuration data stored against hardcoded public keys; (3) Google Calendar — event titles used as Base64-encoded C2 path dead-drops; (4) traditional VPS-hosted C2 servers as final payload delivery. Taking down any subset would have left the remainder operational. The takedown required simultaneous action across all four channels. GlassWorm's attack surface spanned VSCode extensions (both VS Code Marketplace and Open VSX — reaching Forgejo/Gitea-based VSCode forks), npm packages, PyPI packages, and direct GitHub repository poisoning via stolen developer credentials. Infected hosts were converted into covert infrastructure: SOCKS proxies, hidden VNC (HVNC) servers, and Node.js-based remote execution nodes via WebRTC. Over 300 GitHub repositories were poisoned using stolen developer credentials across the campaign. The operators evolved through JavaScript → Rust → Zig across the campaign's lifetime, expanding across package ecosystems and building redundant C2. Russia attribution is based on CIS-country locale/language/timezone exit check in the malware. Post-takedown, all Glassworm-infected machines beacon to a CrowdStrike-operated sinkhole at 164.92.88[.]210 — organisations can review network logs for beacons to this IP to identify infected developer hosts.
    ch_eu_nexus: "global; developer environments across EU are in scope — Open VSX marketplace users include Forgejo/Gitea-based installs common in EU public sector and academic networks"
    public_sector_nexus: "indirect — developer workstation compromise is a supply-chain vector into any downstream consumer"
    sector: "technology, software-development, all sectors (supply chain)"
    cves: []
    actors_campaigns_malware:
      - "GlassWorm"
      - "GlasswormRAT"
      - "Russia-attributed (CIS locale exit check)"
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "new"
    evidence:
      - quote: "Since at least early 2025, GlassWorm operators have systematically targeted software developers, a population with access to source code repositories, cloud platforms, CI/CD pipelines, and package registries"
        attribution: "CrowdStrike Counter Adversary Operations"
        source_url: "https://www.crowdstrike.com/en-us/blog/inside-crowdstrike-takedown-of-a-developer-targeting-botnet/"
      - quote: "All Glassworm-infected machines now beacon to the benign CrowdStrike-operated IP address 164.92.88[.]210. Organizations should review network logs and endpoint telemetry for connections to this address"
        attribution: "CrowdStrike Counter Adversary Operations"
        source_url: "https://www.crowdstrike.com/en-us/blog/inside-crowdstrike-takedown-of-a-developer-targeting-botnet/"
      - quote: "The criminals are likely based in Russia. The evidence is a classic: The malware checks the victim's locale, language settings, and timezone at runtime, and quietly exits if it determines the machine is in a CIS country"
        attribution: "CrowdStrike Counter Adversary Operations"
        source_url: "https://www.crowdstrike.com/en-us/blog/inside-crowdstrike-takedown-of-a-developer-targeting-botnet/"
    extended_notes: |
      Detection: (1) Network connections from developer workstations to 164.92.88.210 (CrowdStrike sinkhole) — beacon pattern indicates prior GlassWorm infection; (2) VSCode extension telemetry for newly-installed extensions not matching the approved extension allowlist; (3) node.exe spawning WebRTC or SOCKS-related processes; (4) npm/pip install logs for packages not in an approved BOM; (5) Sysmon EID 22 DNS queries or network connections from npm/node processes to Solana RPC endpoints, Google Calendar API, or BitTorrent DHT bootstrap nodes. Hardening: enforce an extension allowlist for VS Code/Cursor/Windsurf — Open VSX and VS Code Marketplace both lack mandatory code-signing; pin package SHAs in CI/CD; monitor GitHub repository-level permission grants for unexpected write-access tokens.

  - title: "Microsoft Defender Experts document AI-chatbot-assisted cryptojacking: DLL-sideloading via GPU-utility lookalikes, ScreenConnect for persistent access, process-hollowing to host mining under signed Microsoft binary — 150+ domains active since March 2026"
