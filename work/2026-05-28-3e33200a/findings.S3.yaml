    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "new"
    evidence:
      - quote: "Gitea's container registry has allowed any person on the internet, with no account, no password, and no prior access, to pull what would be considered private container images at first glance from affected instances as if they were public"
        attribution: "NoScope"
        source_url: "https://www.noscope.com/blog/gitea-instances-exposing-private-container"
      - quote: "The U.K.-based security company also pointed out any fork of Gitea should be treated as potentially impacted by the vulnerability until it's been independently verified by the respective maintainers. In its own testing, Forgejo has been confirmed to be impacted"
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/05/gitea-vulnerability-exposes-private.html"
