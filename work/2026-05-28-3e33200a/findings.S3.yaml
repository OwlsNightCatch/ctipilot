  - title: "MuddyWater (Seedworm/MOIS) — Symantec and Carbon Black document new DLL-sideloading pair (fmapp.exe + sentinelmemoryscanner.exe), ChromElevator for App-Bound Encryption bypass, Node.js-orchestrated PowerShell implant chain against 9 organisations across 4 continents"
