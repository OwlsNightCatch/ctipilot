    discovery_trace: "first seen at: THN feed (feeds.feedburner.com/TheHackersNews), URL https://feeds.feedburner.com/TheHackersNews → primary: Microsoft Security Blog, URL https://www.microsoft.com/en-us/security/blog/2026/05/26/poisoned-search-results-gpu-mining-cryptojacking-campaign-abusing-screenconnect-microsoft-net-utilities/"
    summary: |
      Microsoft Defender Experts documented an active cryptojacking campaign dating from March 2026 that uses GPU-utility brand impersonation (CrystalDiskInfo, HWMonitor, Display Driver Uninstaller, FurMark, K-Lite Codec Pack, PDFgear) as initial delivery lure via SEO poisoning. The operationally novel aspect is the April 2026 evolution: users querying AI chatbots (LLM-based tools) for software download recommendations were directed to attacker-controlled domains in generated responses — an extension of SEO poisoning into AI search result poisoning. Delivery chain: (1) fake utility site hosts a ZIP on a gleeze.com subdomain (DDNS via Dynu); (2) ZIP contains the legitimate executable alongside autorun.dll; (3) DLL sideloading by the launched executable silently installs vcredist_x64.dll via msiexec.exe — a ScreenConnect packaged installer named to mimic the Visual C++ Redistributable; (4) ScreenConnect establishes persistent remote access to attacker-controlled server at 193.42.11.[.]108; (5) ScreenConnect session delivers SimpleRunPE.exe; (6) SimpleRunPE establishes persistence via Registry Run keys and scheduled tasks, configures Microsoft Defender exclusions, and uses process hollowing to inject miner code into a Microsoft-signed binary. Three miners supported: gminer, lolMiner, SRBMiner-MULTI. The campaign's targeting logic focuses on high-performance GPU endpoints (PC enthusiast software) to maximise GPU mining yield per infected host. Beyond mining, the ScreenConnect foothold is explicitly noted as enabling follow-on data theft, lateral movement, and ransomware activity. 150+ malicious domains identified since March 2026.
