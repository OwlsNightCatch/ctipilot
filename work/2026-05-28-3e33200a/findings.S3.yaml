      Detection (Grandoreiro DLL sideloading): Sysmon EID 7 for DLL loads of mingwm10.dll, libwebp.dll, libffi-6.dll, or libpng15.dll from unexpected parent executables — these names are used by legitimate MinGW/libpng but should only appear alongside known developer toolchains. STUN traffic (UDP to ports 3478/5349) from user endpoints without VoIP/WebRTC applications is anomalous. Detection (BTMOB): Accessibility Service grants in Android MDM telemetry from unknown APK sources; unexpected HTML overlay events in banking apps; device unlock without user interaction. Hardening (BTMOB): enforce mobile device management policies preventing side-loading of APKs outside approved stores; use Play Protect; train users to verify download URLs for any financial application. Both campaigns use Mediafire/cloud hosting for staged delivery — block employee access to anonymous file-sharing services where possible.

  - title: "CVE-2026-27771 — Gitea self-hosted container registry: unauthenticated pull of private container images; 30,000+ deployments exposed for 4 years; Forgejo confirmed affected; patch: v1.26.2"
    sources:
      - url: "https://www.noscope.com/blog/gitea-instances-exposing-private-container"
        publisher: "NoScope (UK security firm)"
        date: "2026-05-25"
        role: "primary"
      - url: "https://thehackernews.com/2026/05/gitea-vulnerability-exposes-private.html"
        publisher: "The Hacker News"
        date: "2026-05-27"
        role: "corroborating"
    discovery_trace: "first seen at: THN feed (feeds.feedburner.com/TheHackersNews), URL https://feeds.feedburner.com/TheHackersNews → primary: NoScope advisory, URL https://www.noscope.com/blog/gitea-instances-exposing-private-container"
    summary: |
      UK-based security firm NoScope disclosed (2026-05-25) CVE-2026-27771, an access-control flaw in the Gitea built-in OCI-compatible container registry. The `private` designation on a Gitea container repository did not enforce authentication — any unauthenticated remote actor could pull container images from any `private` repository on affected Gitea instances using standard Docker pull operations, with no account, no password, and no OAuth token required. The flaw predates any known CVE and was present for approximately four years. NoScope estimates 30,000+ Gitea deployments across 30+ countries are affected; the majority of exposures are in China, the US, Germany, France, and the UK. Named affected sectors include healthcare providers, aerospace manufacturers, retail infrastructure, and ISPs. The vulnerability was privately reported; Gitea maintainers patched the issue and released v1.26.2 on 2026-05-20, crediting NoScope. CVE-2026-27771 has no CVSS score assigned yet. Forgejo — the primary Gitea fork used by Codeberg and many EU academic self-hosted instances — has been independently confirmed by NoScope testing to be affected. Any other Gitea forks should be treated as potentially affected until their maintainers verify otherwise. The workaround for organisations that cannot immediately patch is to set `[service].REQUIRE_SIGNIN_VIEW=true` in the Gitea configuration file (note: this breaks intentionally public containers). No exploitation has been reported yet; the window between disclosure (May 25) and patch (May 20 — patch actually shipped 5 days before public disclosure) means instances running v1.26.2 are already protected.
    ch_eu_nexus: "direct — Germany and France among the top exposed countries; Forgejo/Codeberg used by EU academic and public-sector DevOps environments; Swiss public sector uses self-hosted Gitea/Forgejo instances"
    public_sector_nexus: "direct — Gitea/Forgejo are the dominant open-source self-hosted git platforms in EU public-sector DevOps and academic institutions"
    sector: "technology, public-sector, healthcare, aerospace, education"
