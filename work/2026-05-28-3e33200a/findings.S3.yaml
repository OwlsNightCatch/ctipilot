      Detection: Gitea server HTTP access logs showing unauthenticated GET /v2/<namespace>/<repo>/blobs/<digest> or GET /v2/<namespace>/<repo>/manifests/<reference> requests from external IPs to repositories designated as private — these requests should require a 401 challenge and token exchange on patched instances. Retrospective log review is warranted for any Gitea instance running before v1.26.2 to identify unauthorised image pulls. Hunt: enumerate your Gitea instance's private repositories and check registry access logs for unexpected external pull events in the past 4 years. Patch priority: high — self-hosted instances running Gitea < 1.26.2 should patch or apply the workaround before business day opens.

  - title: "SANS ISC diary: Akira ransomware kill chain reconstructed from SSLVPN syslog + Windows EVTX — credential-stuffed VPN account (deprovisioned in AD, retained in firewall), Kerberoasting via RC4 EID 4769, vssadmin shadow deletion; no EDR required for full reconstruction"
    sources:
      - url: "https://isc.sans.edu/diary/rss/33024"
        publisher: "SANS Internet Storm Center"
        date: "2026-05-27"
        role: "primary"
    discovery_trace: "first seen at: SANS ISC RSS feed (isc.sans.edu/rssfeed.xml), URL https://isc.sans.edu/rssfeed.xml → primary (no pivot needed)"
    summary: |
      SANS ISC handler Manuel Humberto Santander Pelaez published (2026-05-27) a detailed walk-through of an Akira ransomware kill-chain reconstruction using only SSLVPN syslog and Windows EVTX exports from a mid-sized organisation — no EDR, no PCAP, no proxy logs. The intrusion demonstrates that the full attack lifecycle is visible in two widely-available log sources when they are joined by source IP and normalised time. Initial access (T1078.001 / T1133): brute force — not distributed — against a single local SSLVPN account from a single hosting-provider IP; the account had been deprovisioned in Active Directory but remained provisioned as a local firewall user with no MFA. Discovery (T1087, T1482): EID 4688 shows nltest.exe /dclist:, net.exe group "Domain Admins" /domain, net.exe group "Enterprise Admins" /domain, whoami.exe /all, and a renamed AdFind.exe variant, all parented from explorer.exe → cmd.exe. Credential access (T1558.003 Kerberoasting): cluster of EID 4769 RC4-encrypted Kerberos ticket requests for multiple SPNs from a single workstation within a 90-second window. Lateral movement (T1021.001): EID 4624 Logon Type 10 (RDP) chain from jump host to file server, domain controllers, backup server; EID 4672 special-logon privileges on DC. Defense evasion + impact: EID 1102 security log cleared; sc.exe and net stop stopping endpoint protection services (System EID 7036); vssadmin delete shadows /all /quiet. The attacker created a new AD account in a non-default OU and added it to a built-in group using its Well-Known SID — a scripting-for-portability indicator suggesting the operator was not working interactively in the local language. The diary includes concrete detection and hardening guidance derived directly from each stage.
    ch_eu_nexus: "global; SME and public-sector organisations without EDR will recognise this scenario; the deprovisioning-gap finding is endemic in organisations with mixed AD + local firewall user directories"
    public_sector_nexus: "indirect — smaller public-sector bodies without EDR are the primary audience for this analysis"
    sector: "all sectors (SME / organisation without EDR coverage)"
    cves: []
    actors_campaigns_malware:
      - "Akira ransomware"
    verification: SINGLE-SOURCE
    confidence: HIGH
    novelty: "new"
    evidence:
      - quote: "Most Akira write-ups focus on the ransom note or the encryption routine. By the time those show up the interesting forensic work is over. The questions that matter to defenders sit earlier. How did they get in. When did they get domain admin. What did they touch before the binary fired."
        attribution: "SANS Internet Storm Center"
        source_url: "https://isc.sans.edu/diary/rss/33024"
      - quote: "EID 4688 parent: cmd.exe child: <renamed>.exe (AdFind.exe behavior) … About 24 hours later a cluster of EID 4769 events appeared against three service accounts. All RC4-encrypted. All from the jump host. All inside a 90-second window. That combination is the signature pattern for Kerberoasting."
        attribution: "SANS Internet Storm Center"
        source_url: "https://isc.sans.edu/diary/rss/33024"
    extended_notes: |
      Key hunter/defender takeaways from the diary (direct, not paraphrased): (1) Inventory local SSLVPN accounts; enforce MFA; reconcile against the directory of record — deprovisioned-in-AD-but-retained-in-firewall is the most common initial-access pathway in this class. (2) Alert on >50 failed SSLVPN authentications from a single source in any 1-hour window. (3) Enable EID 4688 process auditing on every Windows host; set Security log size to at least 1 GB — default sizes cause discovery-phase evidence to roll off before responders arrive. (4) Alert on RC4 TGS-REP (EID 4769 EncryptionType=0x17) for multiple SPNs from one workstation in a short window. (5) EID 1102 security log cleared — any occurrence is incident-grade; forward off-host first. (6) Alert on vssadmin.exe or wmic.exe with shadow-copy deletion arguments. (7) Time-sync every host including the firewall to the same NTP source — misaligned timestamps make perimeter-to-endpoint joins unreliable.

