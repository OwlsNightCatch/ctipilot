    discovery_trace: "first seen at: THN feed (feeds.feedburner.com/TheHackersNews), URL https://feeds.feedburner.com/TheHackersNews → primary: Symantec security.com, URL https://www.security.com/threat-intelligence/iran-seedworm-electronics"
    summary: |
      Symantec's Threat Hunter Team and Broadcom's Carbon Black published findings on 2026-05-26 documenting a Q1 2026 MuddyWater (Seedworm, MOIS-attributed) espionage campaign against nine organisations across nine countries on four continents. The campaign's differentiating TTPs from prior coverage are twofold. First, the attackers deployed a consistent DLL-sideloading strategy using two pairs of legitimately-signed third-party binaries: (1) Fortemedia audio-driver binary fmapp.exe loading a malicious fmapp.dll that connects to an attacker-controlled IP address; (2) SentinelOne's sentinelmemoryscanner.exe loading a rogue sentinelagentcore.dll — abuse of a signed security-product binary specifically chosen to bypass signature-based detection. Both malicious DLLs embed ChromElevator, an open-source post-exploitation tool that bypasses Chromium App-Bound Encryption to extract passwords, cookies, and payment card data without triggering AV. Second, orchestration moved to Node.js: node.exe appears as a parent-process ancestor of cmd.exe before any operator commands, meaning a Node.js script — not a human operator — drives the kill chain. PowerShell scripts pulled from a staging server performed discovery, screenshot capture, SAM hive theft, and SOCKS5 reverse-proxy tunnelling. A credential harvester calling CredUIPromptForWindowsCredentialsW displayed a Windows security dialogue to trick targets into entering credentials. A Kerberos TGT extractor via GSS-API was also observed. Exfiltration in at least one intrusion used sendit.sh, a legitimate public file-transfer service. Targeted sectors include manufacturing, education, public-sector bodies, financial services, and professional services; victims include a major South Korean electronics manufacturer, an international airport in the Middle East, and Southeast Asian industrial manufacturers. The prior MuddyWater coverage (campaign:muddywater-chaos-2026 from 2026-05-08) focused on Chaos ransomware false-flag and Teams-based credential harvesting — these Symantec TTPs are materially new: different tooling, signed-binary sideloading chain, Node.js orchestration, ChromElevator ABE bypass.
    ch_eu_nexus: "global; education and public-sector bodies are named victim categories directly relevant to EU public administration; MOIS attribution confirmed"
    public_sector_nexus: "direct — education and public-sector bodies listed as targeted sectors"
    sector: "manufacturing, education, public-sector, financial-services, professional-services"
