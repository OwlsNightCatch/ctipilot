    discovery_trace: "first seen at: cisa-kev bridge → three new KEV entries dated 2026-05-27 → Nx GHSA advisory → Nx vendor postmortem primary → Help Net Security corroborating; TanStack KEV → GHSA primary; DAEMON Tools KEV → vendor blog primary → Kaspersky corroborating"
    summary: |
      CISA added three supply-chain CVEs to KEV on 2026-05-27, all exploited. CVE-2026-48027 covers the Nx Console (VS Code extension, 2.2M installs) v18.95.0 compromise on 2026-05-18. The attack traced to a TanStack npm supply-chain compromise (CVE-2026-45321) seven days earlier that silently exfiltrated a Nx contributor's GitHub CLI OAuth token via a credential-stealing payload. Using that token, threat actors published the malicious Nx Console build — live on VS Marketplace 12:30–12:48 UTC and OpenVSX 12:33–13:09 UTC — which harvested secrets from 1Password vaults, Claude Code configs, npm, GitHub, and AWS credentials. GitHub CISO Alexis Wales confirmed roughly 3,800 internal repositories were exfiltrated; Grafana Labs also reported a breach. Separately, CVE-2026-8398 covers DAEMON Tools Lite v12.5.0.2421–12.5.0.2434, trojanized via the official vendor's build infrastructure from 2026-04-08 through 2026-05-05; compromised binaries (DTHelper.exe, DiscSoftBusServiceLite.exe, DTShellHlp.exe) were signed with a valid AVB Disc Soft certificate and beaconed to env-check.daemontools.cc. Kaspersky attributed the detection, identifying thousands of attempted secondary-payload installs. Safe versions: Nx Console 18.100.0+; DAEMON Tools Lite 12.6.0+.
    ch_eu_nexus: "Broadly applicable; GitHub internal breach affects users worldwide including EU DevSecOps toolchains; DAEMON Tools commonly used across European developer and enterprise workstations"
    public_sector_nexus: "direct — developer tools used in EU public-sector software development environments"
    sector: "IT / DevSecOps / all industries"
    cves:
      - CVE-2026-48027
      - CVE-2026-45321
