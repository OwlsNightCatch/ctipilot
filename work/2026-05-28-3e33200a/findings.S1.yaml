    discovery_trace: "first seen at: hackernews feed → THN article 2026-05-26 → MSRC OData API via bridge msrc cve CVE-2026-45659 → Help Net Security corroborating"
    summary: |
      CVE-2026-45659 is a CWE-502 (Deserialization of Untrusted Data) remote code execution vulnerability in Microsoft SharePoint Server patched in May 2026 Patch Tuesday (inadvertently omitted from initial release notes; advisory revised 2026-05-26). CVSS v3.1 base score 8.8 (AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H). Affected: SharePoint Server Subscription Edition (fix: build 16.0.19725.20280), SharePoint Server 2019 (fix: build 16.0.10417.20128), SharePoint Enterprise Server 2016 (fix: build 16.0.5552.1002). Exploitation requires only Site Member–level authentication (PR:L); no user interaction needed; attack complexity is Low; no PoC or active exploitation observed at publication. Microsoft rates exploitation likelihood as "Less Likely." Given the history of rapid weaponisation of SharePoint deserialization flaws by nation-state actors and ransomware operators, on-prem deployments should prioritise applying the May 2026 updates.
    ch_eu_nexus: "SharePoint Server widely deployed across EU public administrations — on-prem deployments in Swiss Federal IT environments and EU institutions are at scope"
    public_sector_nexus: "direct — SharePoint is a core collaboration platform for public administration"
    sector: "all — government, finance, healthcare, enterprise"
    cves:
      - CVE-2026-45659
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Deserialization of untrusted data in Microsoft Office SharePoint allows an authorized attacker to execute code over a network."
        attribution: "Microsoft MSRC"
        source_url: "https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-45659"
      - quote: "In a network-based attack, an authenticated attacker, who has a minimum of Site Member permissions (PR:L), could execute code remotely on the SharePoint Server."
        attribution: "Microsoft MSRC (FAQ)"
        source_url: "https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-45659"
    extended_notes: |
      MITRE ATT&CK: T1190 (Exploit Public-Facing Application), T1059.001 (PowerShell — common post-deserialization payload). Detection: SharePoint ULS logs for unusual deserialization events; Windows Security EID 4688 or Sysmon EID 1 for w3wp.exe spawning unexpected child processes (powershell.exe, cmd.exe, net.exe); network: monitor for unexpected outbound connections from SharePoint servers. Hardening: apply KB updates for respective build numbers; restrict SharePoint external access; enforce conditional access for SharePoint authentication; consider disabling ViewState if not required (reduces deserialization attack surface).

  - title: "Gitea CVE-2026-27771 — private container registry images exposed unauthenticated across 30,000+ deployments for 4 years; patch to 1.26.2"
    sources:
      - url: "https://www.noscope.com/blog/gitea-instances-exposing-private-container"
        publisher: "Noscope (researcher disclosure)"
        date: "2026-05-27"
        role: "primary"
      - url: "https://thehackernews.com/2026/05/gitea-vulnerability-exposes-private.html"
        publisher: "The Hacker News"
        date: "2026-05-27"
        role: "corroborating"
    discovery_trace: "first seen at: hackernews feed 2026-05-27 → THN article → Noscope researcher blog primary"
    summary: |
      CVE-2026-27771 is an access control failure in Gitea's container registry, present in all versions prior to 1.26.2 (undetected for approximately four years). Despite a repository being marked as private, the container registry treated images as publicly accessible, allowing any unauthenticated attacker to directly pull private container images without an account, password, or session token. Noscope's research estimates more than 30,000 self-hosted Gitea deployments across 30+ countries are affected, with primary concentration in China, the US, Germany, France, and the UK. Affected sectors include healthcare providers, aerospace manufacturers, retail infrastructure, and ISPs. Gitea maintainers assigned CVE-2026-27771 and released version 1.26.2 as a fix on 2026-05-20. The vulnerability is particularly sensitive in CI/CD and DevSecOps environments where container images may embed application secrets, configuration files, or proprietary code. No authentication bypass or additional exploitation needed — the images are passively exposed.
    ch_eu_nexus: "Germany and France among top exposed countries; affects EU public-sector self-hosted DevOps pipelines"
    public_sector_nexus: "indirect — self-hosted DevOps platforms in public-sector software delivery"
    sector: "IT / DevSecOps / all industries using self-hosted Gitea"
    cves:
      - CVE-2026-27771
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "CVE-2026-27771 affects all versions of Gitea prior to 1.26.2, which addresses the issue. According to Noscope, the security defect likely impacts more than 30,000 deployments across over 30 countries."
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/05/gitea-vulnerability-exposes-private.html"
      - quote: "On affected versions, the private designation on a container repository did not deliver the protection operators reasonably expected it to."
        attribution: "Noscope research blog"
        source_url: "https://www.noscope.com/blog/gitea-instances-exposing-private-container"
    extended_notes: |
      MITRE ATT&CK: T1213 (Data from Information Repositories), T1530 (Data from Cloud Storage). Detection: audit Gitea access logs for unauthenticated GET requests to /v2/<namespace>/<repository>/manifests/ or /blobs/ endpoints; correlate with external IP ranges not in approved developer CIDR. Hardening: upgrade to Gitea 1.26.2 immediately; audit container registry visibility settings post-upgrade; rotate any secrets embedded in container images; review registry event logs for previous unauthorised pull attempts (potential data exfiltration already occurred for exposed deployments).

  - title: "BSI/WID-SEC-2026-1689 — ILIAS e-learning platform multiple vulns (versions < 9.20, < 10.8, < 11.1) including file manipulation and security bypass"
