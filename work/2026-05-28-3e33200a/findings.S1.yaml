    evidence:
      - quote: "Nx Console contains an embedded malicious code vulnerability that allowed a malicious version of Nx Console to be published. The compromised extension fetched an obfuscated payload that could harvested credentials from multiple sources on disk and in memory."
        attribution: "CISA KEV catalog"
        source_url: "https://www.cisa.gov/known-exploited-vulnerabilities-catalog"
      - quote: "GitHub CISO Alexis Wales has named the malicious VS Code extension behind the recent breach: Nx Console, a popular developer tool."
        attribution: "Help Net Security"
        source_url: "https://www.helpnetsecurity.com/2026/05/21/github-grafana-breach-root-cause-nx-console/"
      - quote: "Full postmortem of the malicious Nx Console v18.95.0 published to Visual Studio Marketplace and Open VSX on 2026-05-18, originating from the TanStack npm supply-chain compromise that exfiltrated a contributor's gh CLI OAuth token seven days earlier."
        attribution: "Nx (vendor postmortem)"
        source_url: "https://nx.dev/blog/nx-console-v18-95-0-postmortem"
    extended_notes: |
      The MITRE ATT&CK mapping for this chain is T1195.002 (Compromise Software Supply Chain) → T1552.001 (Unsecured Credentials: Credentials in Files) → T1530 (Data from Cloud Storage). Detection: EDR parent-process chain vscode.exe / cursor.exe spawning node.exe with network egress to non-standard hosts; audit VS Code extension marketplace installs against known-good manifest. Defender hunting: process lineage from Extension Host Worker spawning credential-harvesting subprocesses. Harden: organisation policy controls for VS Code extension allowlisting; Developer Sandbox with outbound network restrictions for CI/CD runners.

  - title: "GlassWorm developer-targeting botnet C2 infrastructure dismantled by CrowdStrike, Google, Shadowserver"
    sources:
      - url: "https://www.crowdstrike.com/en-us/blog/inside-crowdstrike-takedown-of-a-developer-targeting-botnet/"
        publisher: "CrowdStrike Counter Adversary Operations"
        date: "2026-05-27"
        role: "primary"
      - url: "https://securityaffairs.com/192749/cyber-crime/how-cybersecurity-firms-took-down-glassworm-botnet-in-one-shot.html"
        publisher: "Security Affairs"
        date: "2026-05-27"
        role: "corroborating"
      - url: "https://thehackernews.com/2026/05/glassworm-malware-takedown-disrupts.html"
        publisher: "The Hacker News"
        date: "2026-05-27"
        role: "corroborating"
    discovery_trace: "first seen at: hackernews feed (https://feeds.feedburner.com/TheHackersNews) → THN article 2026-05-27 → CrowdStrike primary blog → Security Affairs corroborating"
    summary: |
      On 2026-05-26T14:00Z CrowdStrike Counter Adversary Operations, together with Google and the Shadowserver Foundation, simultaneously severed all four C2 channels of the GlassWorm botnet, a persistent developer-targeting supply-chain campaign active since at least early 2025. GlassWorm (attributed by CrowdStrike to likely Russia-based cybercriminals — the malware terminates on CIS-region hosts and contains Russian-language source comments) had compromised 72 VS Code extensions on OpenVSX Marketplace, 88 npm packages, and 151+ GitHub repositories. Attack vectors: trojanised extensions disguised as time trackers and code formatters; malicious postinstall hooks and setup.py scripts; invisible Unicode variation-selector and private-use-area characters embedded in source files to hide payloads from human review. Deployed payload: a Websocket-based JavaScript RAT (GlassWormRAT) capable of browser credential theft, arbitrary code execution, cloud credential exfiltration, and cryptocurrency wallet theft; subsequent iterations installed a rogue Chrome extension for persistent cookie/password harvesting. The extensions targeted not only VS Code but also Cursor, Positron, Windsurf, and VSCodium — broadening the developer tool footprint. After the takedown, existing infections on developer endpoints remain and post-compromise credential rotation is required.
    ch_eu_nexus: "Affects EU developer communities; OpenVSX extensions are commonly consumed in European public-sector DevSecOps teams; any organisation using affected editors or npm packages is at risk"
    public_sector_nexus: "indirect — developers maintaining public-sector digital infrastructure"
    sector: "IT / software development / DevSecOps"
    cves: []
    actors_campaigns_malware: ["GlassWorm", "GlassWormRAT"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "CrowdStrike, in partnership with Google and the Shadowserver Foundation, has announced the simultaneous disruption of all command-and-control (C2) channels associated with GlassWorm."
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/05/glassworm-malware-takedown-disrupts.html"
      - quote: "Glassworm infected developers through poisoned tools and packages until a coordinated takedown killed all four of its C2 channels at once."
        attribution: "Security Affairs"
        source_url: "https://securityaffairs.com/192749/cyber-crime/how-cybersecurity-firms-took-down-glassworm-botnet-in-one-shot.html"
    extended_notes: |
      MITRE ATT&CK: T1195.002 (Compromise Software Supply Chain), T1059.007 (JavaScript), T1185 (Browser Session Hijacking), T1552 (Unsecured Credentials), T1555.003 (Credentials from Password Stores: Web Browsers). Detection: alert on extension installs from OpenVSX for packages outside org-approved list; EDR: node.js child process spawned by editor host with outbound WebSocket C2 connections; look for npm postinstall hooks invoking curl/wget or executing base64-encoded payloads (process lineage: npm.cmd → sh/bash → curl). Hunting: scan extension manifests for invisible Unicode (U+FE00–FE0F range, U+E000–F8FF) embedded in source. Remediation for GlassWorm victims: audit all extensions installed between early 2025 and 2026-05-26; rotate all CI/CD secrets, cloud credentials, and GitHub tokens accessible from affected machines.

  - title: "NGINX double rewrite-module buffer overflow: CVE-2026-9256 (actively exploited) and CVE-2026-42945 — patch to 1.31.1+ or 1.30.2+"
    sources:
      - url: "https://nginx.org/en/security_advisories.html"
        publisher: "NGINX / F5 (vendor advisory)"
        date: "2026-05-22"
        role: "primary"
      - url: "https://www.openwall.com/lists/oss-security/2026/05/22/14"
        publisher: "oss-security mailing list (CVE-2026-9256)"
        date: "2026-05-22"
        role: "corroborating"
      - url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0164"
        publisher: "NCSC-NL (advisory for CVE-2026-42945)"
        date: "2026-05-18"
        role: "corroborating"
    discovery_trace: "first seen at: ncsc-nl recent → NCSC-2026-0164 for CVE-2026-42945 → NCSC-NL CSAF → nginx.org primary advisory page → oss-security list for CVE-2026-9256 corroborating; WebSearch confirmed active exploitation"
    summary: |
      NGINX shipped two separate heap buffer overflows in the ngx_http_rewrite_module within nine days of each other. CVE-2026-42945 (medium, confirmed exploitation attempts per NCSC-NL) affects NGINX 0.6.27–1.30.0 and NGINX Plus R32–R36; patched in 1.31.0/1.30.1. CVE-2026-9256, disclosed on 2026-05-22 via oss-security (CVSS v3.1 8.1 / CVSS v4.0 9.2), affects NGINX 0.1.17–1.31.0 and NGINX Plus R32–R37.x; environments that upgraded to address CVE-2026-42945 remain vulnerable. The flaw is in the ngx_http_rewrite_module URI rewrite logic: when a rewrite directive uses regex captures with overlapping Perl-Compatible groups (e.g. ^/((.*))$) and a replacement referencing multiple captures ($1$2), NGINX underestimates the output size after URI escaping, producing an out-of-bounds write in the worker process memory pool. Unauthenticated attackers can trigger DoS via worker process restart; on systems with ASLR disabled or bypassable, code execution is achievable. NGINX is awareness of exploitation attempts (NCSC-NL CSAF cites "NGINX meldt bekend te zijn met (pogingen tot) misbruik"). Patched versions: 1.31.1 and 1.30.2 (both CVEs).
    ch_eu_nexus: "Extremely broad — NGINX is the most widely deployed web server/reverse proxy in European public-sector infrastructure"
    public_sector_nexus: "direct"
    sector: "all — web/application infrastructure"
    cves:
      - CVE-2026-9256
      - CVE-2026-42945
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Buffer overflow in the ngx_http_rewrite_module. Not vulnerable: 1.31.1+, 1.30.2+. Vulnerable: 0.1.17-1.31.0"
        attribution: "NGINX security advisories page (nginx.org)"
        source_url: "https://nginx.org/en/security_advisories.html"
      - quote: "NGINX meldt bekend te zijn met (pogingen tot) misbruik van deze kwetsbaarheid."
        attribution: "NCSC-NL CSAF NCSC-2026-0164"
        source_url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0164"
    extended_notes: |
      MITRE ATT&CK: T1190 (Exploit Public-Facing Application). Detection: monitor for unusual NGINX worker process restarts (Sysmon EID 1: parent=nginx.exe spawning new worker child, or system service restarts in rapid succession); WAF/IDS: crafted HTTP requests containing rewrite-triggering URL patterns with excessive nested capture references. Hardening: upgrade to NGINX 1.31.1+ or 1.30.2+; audit all rewrite directives for nested/overlapping capture groups; ensure ASLR is enabled on all NGINX hosts (systemctl show nginx | grep 'ExecStart' and verify kernel.randomize_va_space=2). Relevant F5 advisory: https://my.f5.com/manage/s/article/K000161377

  - title: "MuddyWater/Seedworm DLL side-loading espionage campaign via signed Fortemedia and SentinelOne binaries targeting 9 countries including public-sector and education"
    sources:
      - url: "https://www.security.com/threat-intelligence/iran-seedworm-electronics"
        publisher: "Symantec Threat Hunter Team (Broadcom)"
        date: "2026-05-22"
        role: "primary"
      - url: "https://industrialcyber.co/threats-attacks/symantec-uncovers-iran-linked-seedworm-espionage-campaign-targeting-airport-government-manufacturing-sectors/"
        publisher: "Industrial Cyber"
        date: "2026-05-26"
        role: "corroborating"
      - url: "https://thehackernews.com/2026/05/muddywater-uses-dll-side-loading-in.html"
        publisher: "The Hacker News"
        date: "2026-05-26"
        role: "corroborating"
    discovery_trace: "first seen at: hackernews feed → THN article 2026-05-26 → Symantec/security.com primary report → Industrial Cyber corroborating"
    summary: |
      Broadcom's Symantec Threat Hunter Team and Carbon Black disclosed a broad MuddyWater (a.k.a. Seedworm, Static Kitten, MERCURY, TEMP.Zagros — attributed to Iran's IRGC-CEC, also known as Shahid Shushtari) espionage campaign targeting at least nine organisations across nine countries in Q1 2026. Targets span industrial and electronics manufacturing, education and public-sector bodies, financial services, and an international airport in the Middle East. A major South Korean electronics manufacturer was compromised for a full week in February 2026. The campaign's defining technique is DLL side-loading using legitimately signed, unmodified binaries: fmapp.exe (Fortemedia) side-loads malicious fmapp.dll; sentinelmemoryscanner.exe (SentinelOne) side-loads malicious sentinelagentcore.dll. Both binaries carry valid vendor code-signing certificates, defeating signature-based first-line detections. Initial access is via spear-phishing; a node.exe-based implant chain drops PowerShell scripts performing reconnaissance (screenshot capture, SAM hive theft via Volume Shadow Copy), privilege escalation, lateral movement, and SOCKS5 reverse-proxy tunnelling. Final payload delivers ChromElevator for browser-credential theft (passwords, cookies, payment data) across all major Chromium-based browsers.
    ch_eu_nexus: "Education and public-sector verticals included in campaign scope; patterns consistent with EU public administration targeting by IRGC-affiliated actors"
    public_sector_nexus: "direct — education bodies and government agencies among confirmed targets"
    sector: "education, public-sector, manufacturing, financial services, transport"
    cves: []
    actors_campaigns_malware: ["MuddyWater", "Seedworm", "MANGO SANDSTORM", "ChromElevator", "IRGC-CEC"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "The attackers relied heavily on DLL side-loading using legitimately signed Fortemedia (fmapp.exe) and SentinelOne (sentinelmemoryscanner.exe) binaries to execute malicious DLLs while masquerading as benign software."
        attribution: "The Hacker News (citing Symantec)"
        source_url: "https://thehackernews.com/2026/05/muddywater-uses-dll-side-loading-in.html"
      - quote: "A node.exe-based implant chain was used to drop PowerShell scripts that performed reconnaissance, screenshot capture, SAM hive theft, privilege escalation, and SOCKS5 reverse-proxy tunnelling."
        attribution: "Industrial Cyber (citing Symantec)"
        source_url: "https://industrialcyber.co/threats-attacks/symantec-uncovers-iran-linked-seedworm-espionage-campaign-targeting-airport-government-manufacturing-sectors/"
    extended_notes: |
      MITRE ATT&CK: T1574.002 (Hijack Execution Flow: DLL Side-Loading), T1059.001 (PowerShell), T1003.002 (OS Credential Dumping: SAM), T1555.003 (Credentials from Web Browsers), T1090.003 (Proxy: Multi-hop Proxy / SOCKS5), T1078 (Valid Accounts). Detection: Sysmon EID 7 (DLL image-load) — alert when fmapp.exe or sentinelmemoryscanner.exe loads DLLs from non-standard directories; EDR parent-process alert: node.exe spawned by non-standard parent invoking powershell.exe -enc; Windows Security EID 4663 — SAM hive access outside Windows system accounts. Hardening: verify DLL search order (SafeDllSearchMode), apply AppLocker/WDAC rules requiring signed DLLs; monitor for VSSAdmin calls from non-admin processes. Hunt: scan for fmapp.exe and sentinelmemoryscanner.exe outside their expected installation paths; check for unusual SOCKS5 outbound connections from workstations.

  - title: "Microsoft SharePoint RCE CVE-2026-45659 — CWE-502 deserialization, auth-required but low privilege, all on-prem versions, May 2026 Patch Tuesday"
    sources:
      - url: "https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-45659"
        publisher: "Microsoft MSRC"
        date: "2026-05-26"
        role: "primary"
