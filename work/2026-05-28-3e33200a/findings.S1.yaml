      BSI/CERT-Bund issued WID-SEC-2026-1689 on 2026-05-27 (severity: hoch/high) covering multiple vulnerabilities in ILIAS, the open-source e-learning platform widely used by Swiss and German universities, schools, and public training institutions. Affected versions: ILIAS prior to 9.20, prior to 10.8, and prior to 11.1. The advisory describes three distinct weakness categories: file manipulation (an attacker can create, modify, or delete files within the application context), security policy bypass (authentication or access control constraints can be circumvented), and an unspecified attack vector that could lead to further exploitation. The vendor released patches on 2026-05-26 across all three supported branches simultaneously (ILIAS 9.20, 10.8, 11.1). No CVE IDs are assigned in the BSI CSAF document; no public exploitation evidence cited. ILIAS is mission-critical for higher education and vocational training in the DACH region, making timely patching operationally important despite the absence of active exploitation.
