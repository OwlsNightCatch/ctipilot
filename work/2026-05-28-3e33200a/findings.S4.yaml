        attribution: "The Record"
        source_url: "https://therecord.media/iranian-intelligence-behind-hack-of-la-transit-system"
      - quote: "Gambit's assessment 'is based on forensic evidence that ties the group to a previous Iran-linked campaign, as well as activity attributed to the MOIS by Israel National Cyber Directorate'"
        attribution: "TechCrunch"
        source_url: "https://techcrunch.com/2026/05/26/iranian-hackers-blamed-for-breach-of-los-angeles-transit-system-that-took-weeks-to-recover/"
    extended_notes: |
      The Gambit report PDF (https://cdn.prod.website-files.com/69944dd945f20ca4a27a7c47/6a155deeaffba9a1bf3c5b63_Ababil_of_Minab_Tech_Report.pdf) contains the full technical IOC set and MITRE mapping, which defenders may use for hunt purposes. The broader geopolitical context: US/Israel military operations against Iran in late February 2026 preceded a surge in MOIS-linked hacktivist front-group activity. Stryker (US medtech company) was separately attributed to Handala — another Iran-linked group — in March 2026.

  - title: "Catalin Dragomir ('inthematrixl') sentenced to 56 months — access-broker sold admin credentials to Oregon's Office of Emergency Management for $3,000 BTC; 10 additional US companies compromised"
    sources:
      - url: "https://therecord.media/romanian-national-sentenced-to-over-4-years-oregon-hack"
        publisher: "The Record (Recorded Future News)"
        date: "2026-05-27"
        role: "primary"
      - url: "https://securityaffairs.com/192770/cyber-crime/romanian-hacker-gets-nearly-5-years-in-us-prison-over-network-intrusion.html"
        publisher: "Security Affairs"
        date: "2026-05-27"
        role: "corroborating"
    discovery_trace: "first seen at: TheRecord RSS feed https://therecord.media/feed (item: https://therecord.media/romanian-national-sentenced-to-over-4-years-oregon-hack, published 2026-05-27) → TheRecord article fetched via bridge → DoJ press release cited (401 on direct fetch; TheRecord provided full detail) → SecurityAffairs corroboration https://securityaffairs.com/192770/cyber-crime/romanian-hacker-gets-nearly-5-years-in-us-prison-over-network-intrusion.html"
    summary: |
      Catalin Dragomir, 46, a Romanian national operating as the access broker "inthematrixl", was sentenced on 2026-05-27 to 56 months (4 years 8 months) in federal prison, following a February 2026 guilty plea to aggravated identity theft (18 U.S.C. § 1028A) and obtaining information from a protected computer (18 U.S.C. § 1030). In June 2021, Dragomir placed advertisements on dark-web cybercriminal forums offering administrative credentials for Oregon's Office of Emergency Management (OEM) network, acquired through unauthorised access to the OEM environment. He sold the Oregon network access for $3,000 in Bitcoin. In addition to the OEM breach, Dragomir compromised 10 other US companies, causing documented losses of at least $250,000. He was arrested in Romania in November 2024 on a US extradition request, brought to the US in 2025, and sentenced in the District of Oregon. The case is operationally instructive for public-sector defenders: OEM and emergency-management networks are high-value access-broker targets because they often hold inter-agency trust relationships, have elevated firewall bypass permissions for emergency communications, and may not receive the same security hardening attention as core government IT systems. Hunt hypothesis: scan for dark-web access-broker advertisements referencing emergency management or COOP infrastructure; monitor for credential stuffing or brute-force against OEM VPN or RDP endpoints specifically; review admin account authentication from off-hours Romanian/Eastern European IP prefixes (proxy-aware hunts on identity-provider logs).
    ch_eu_nexus: "US government breach and sentencing. Directly relevant as a pattern-of-practice: EU/Swiss emergency management, civil protection, and OEM-equivalent agencies are target-class peers."
    public_sector_nexus: "direct — US state-level Office of Emergency Management (government)"
    sector: "government, emergency management, public sector"
