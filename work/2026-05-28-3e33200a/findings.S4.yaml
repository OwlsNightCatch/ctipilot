    discovery_trace: "first seen at: BleepingComputer RSS feed, URL https://www.bleepingcomputer.com/feed/ (article link https://www.bleepingcomputer.com/news/security/dutch-police-arrests-suspect-linked-to-ajax-football-club-hack/) → article body surfaced Dutch police press release link and victim disclosure https://english.ajax.nl/articles/information-about-data-breach-at-ajax/ → TheRecord corroboration https://therecord.media/dutch-police-arrest-man-over-cyber-breach-ajax-football → NLTimes Dutch-language source https://nltimes.nl/2026/05/26/man-35-arrested-hack-targeting-ajax-app-fan-data"
    summary: |
      Dutch National Police arrested a 35-year-old man from the municipality of Buren on the morning of 2026-05-26 on suspicion of computer trespass (computervredebreuk) against AFC Ajax Amsterdam, following a criminal investigation triggered by Ajax's disclosure in late March 2026. Investigators searched the suspect's residence and seized multiple digital storage devices. AFC Ajax's own victim statement (English, 2026-03-25) confirmed a data breach in early 2026 after the suspect "granted himself access to the football club's computer systems several times." The vulnerability the attacker exploited also exposed APIs and shared keys that gave access to fan account data for more than 300,000 accounts and more than 42,000 season-ticket holders; according to RTL reporting, the attacker demonstrated the ability to reassign a VIP season ticket in seconds and modify stadium-ban records. Ajax notified the Dutch Autoriteit Persoonsgegevens (AP — the Dutch DPA) and filed a criminal complaint; the security gap has since been patched. The case is relevant for EU defenders because it illustrates that sports/entertainment organisations hold fan PII at the same privilege level as commercial customers, and that misconfigured API access-control and shared credential patterns in mobile-app backends are recurring attack surfaces. Technique class: T1190 Exploit Public-Facing Application (API vulnerability), T1078 Valid Accounts (shared keys). Detection: WAF alert on out-of-character API parameter manipulation (ticket reassignment requests from a non-privileged account), spike in account-admin operations in application logs outside business hours.
    ch_eu_nexus: "Netherlands-based victim; EU public (GDPR article 33/34 notification to Dutch DPA filed). Directly relevant to EU public-sector organisations running fan/citizen portals with REST/mobile API backends."
    public_sector_nexus: "indirect — sports club; Dutch DPA (public authority) involved"
