  - title: "Ababil of Minab MOIS-linked campaign: Iran's Ministry of Intelligence attributed to LA Metro (LACMTA) breach — 700 GB exfiltrated, backups and VMs destroyed, multi-site campaign across US/Israel/Turkey"
    sources:
      - url: "https://techcrunch.com/2026/05/26/iranian-hackers-blamed-for-breach-of-los-angeles-transit-system-that-took-weeks-to-recover/"
        publisher: "TechCrunch"
        date: "2026-05-26"
        role: "primary"
      - url: "https://gambit.security/blog-posts/babil-of-minab-iran-mois-destruction-campaign"
        publisher: "Gambit Security (Israeli cybersecurity firm)"
        date: "2026-05-26"
        role: "primary research"
      - url: "https://therecord.media/iranian-intelligence-behind-hack-of-la-transit-system"
        publisher: "The Record (Recorded Future News)"
        date: "2026-05-27"
        role: "corroborating"
    discovery_trace: "first seen at: TheRecord RSS feed https://therecord.media/feed (item: https://therecord.media/iranian-intelligence-behind-hack-of-la-transit-system, published 2026-05-27) → WebSearch for 'Iranian intelligence MOIS LA transit system hack Gambit Security May 2026' → TechCrunch primary https://techcrunch.com/2026/05/26/iranian-hackers-blamed-for-breach-of-los-angeles-transit-system-that-took-weeks-to-recover/ → Gambit Security primary report https://gambit.security/blog-posts/babil-of-minab-iran-mois-destruction-campaign"
    summary: |
      Gambit Security (Israeli threat intelligence) published a technical report on 2026-05-26 attributing the March 2026 breach of Los Angeles County Metropolitan Transportation Authority (LACMTA/LA Metro) to an Iran-MOIS-linked cluster operating under the hacktivist persona "Ababil of Minab." The group claimed to be a standalone hacktivist crew surfacing in late March/early April 2026, but Gambit's forensic evidence ties the cluster's infrastructure and techniques to the Iran-MOIS-attributed "Black Shadow" group, a designation the Israel National Cyber Directorate (INCD) previously applied to MOIS-linked campaigns. The campaign exfiltrated approximately 700 GB of emails, backups and other files from LACMTA, then deliberately targeted the recovery layer: virtual machines and storage volumes were deleted, backup infrastructure was destroyed, and multiple destructive techniques were employed simultaneously to force parallel remediation processes and maximise downtime. LA Metro required weeks to recover. The campaign also affected named and unnamed organisations in Israel, Saudi Arabia and Turkey. TechCrunch published the attribution story on 2026-05-26; TheRecord published corroboration on 2026-05-27. MOIS-linked attacks of this type — claiming hacktivist cover while executing state-level destructive objectives — mirror prior MOIS patterns (including Black Shadow attacks on Israeli companies). MITRE: T1485 Data Destruction (VM/backup deletion), T1048 Exfiltration Over Alternative Protocol, T1531 Account Access Removal. Detection: EDR / hypervisor-level VM lifecycle events (mass-delete, power-off-all); backup system event log purge or backup job cancellation by unexpected account; network-flow anomaly to non-managed IP during bulk exfil window. Defenders running transit/OT control-room IT should assume MOIS tooling targets recovery infrastructure first to prolong impact.
    ch_eu_nexus: "Attribution is US/Israel-primary; MOIS campaigns have targeted EU transportation and critical infrastructure orgs previously. Swiss public transit (SBB, PostBus, cantonal networks) and EU equivalents should review exposure."
    public_sector_nexus: "direct — public transit authority (LACMTA)"
    sector: "transportation, critical infrastructure, public sector"
    cves: []
    actors_campaigns_malware: ["Ababil of Minab", "Black Shadow", "MOIS"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Attackers now target the recovery layer: backups, virtualization, storage. Inside an Iran-MOIS campaign and what defenders should verify."
        attribution: "Gambit Security"
        source_url: "https://gambit.security/blog-posts/babil-of-minab-iran-mois-destruction-campaign"
