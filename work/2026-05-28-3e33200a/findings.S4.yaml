  - title: "FBI FLASH CSA 260526 — Silent Ransom Group sends operatives into law firm offices to physically insert USB exfiltration devices after social engineering fails remotely; 100+ attacks confirmed"
    sources:
      - url: "https://cyberscoop.com/fbi-warning-silent-ransom-group-law-firms/"
        publisher: "CyberScoop"
        date: "2026-05-27"
        role: "primary"
      - url: "https://therecord.media/fbi-warns-hackers-visit-law-firms-to-steal-data"
        publisher: "The Record (Recorded Future News)"
        date: "2026-05-27"
        role: "corroborating"
      - url: "https://www.helpnetsecurity.com/2026/05/27/fbi-silent-ransom-group-law-firms-social-engineering/"
        publisher: "Help Net Security"
        date: "2026-05-27"
        role: "corroborating"
      - url: "https://www.ic3.gov/CSA/2026/260526.pdf"
        publisher: "FBI IC3 / CSA"
        date: "2026-05-26"
        role: "primary-advisory"
    discovery_trace: "first seen at: BleepingComputer RSS feed, URL https://www.bleepingcomputer.com/feed/ (article link: https://www.bleepingcomputer.com/news/security/fbi-warns-of-silent-ransom-group-in-person-data-theft-attacks/) → pivot: CyberScoop article URL https://cyberscoop.com/fbi-warning-silent-ransom-group-law-firms/ → FBI IC3 CSA PDF link https://www.ic3.gov/CSA/2026/260526.pdf (primary advisory); corroborated at TheRecord https://therecord.media/fbi-warns-hackers-visit-law-firms-to-steal-data and HelpNetSecurity https://www.helpnetsecurity.com/2026/05/27/fbi-silent-ransom-group-law-firms-social-engineering/"
    summary: |
      The FBI issued CSA 260526 on 2026-05-26 warning that Silent Ransom Group (SRG, also tracked as Luna Moth, Chatty Spider, UNC3753, Storm-0252) — a Russia-linked extortion-only gang that does not deploy ransomware — has escalated its campaign against U.S. law firms by physically sending operatives into victim offices impersonating IT support staff when remote access attempts fail. The kill chain begins with callback phishing: SRG calls or phishes employees with a pretext urging them to dial a support number; on the call, the actor attempts to establish a remote desktop session. If the target resists granting remote access, an associate physically visits the office and attempts to insert a USB storage device directly into a workstation. The group has claimed more than 100 attacks across legal sector targets, with data from more than 38 firms already published on SRG's public leak site. Recorded Future reports activity surging sharply in early 2026; CrowdStrike tracking puts Q1 2026 at 134 ransomware incidents in the legal sector (fourth-most targeted industry). The extortion lever is reputational: law firms hold attorney-client privileged communications, M&A documentation, IP litigation records and client financial data — material that cannot easily be neutralised even after payment. Detection surface: suspicious callback phishing telemetry (inbound call from unknown number following an unusual IT-themed email), remote-desktop session initiation by non-IT accounts (Windows Event 4624 Logon Type 10 / RDP, or Sysmon EID 1 for mstsc.exe launched from a non-admin parent), USB insertion events (Windows Security EID 6416 / Sysmon EID 6 RawDiskRead, device vendor/product field, correlation with arrival of unfamiliar visitor in access logs). Hardening: enforce Conditional Access requiring compliant / managed device for all remote-desktop; train reception to require badge for any visitor claiming IT support; disable USB mass-storage on user endpoints via policy (Device Installation policy or EDR enforcement); require second-person authorisation for emergency IT access requests.
    ch_eu_nexus: "US-centric campaign; European law firms with US counterpart offices or US client matters should assume they are in scope. No confirmed EU victim named."
    public_sector_nexus: "indirect — legal counsel and law firms serving public-sector bodies at risk"
    sector: "legal, professional services"
    cves: []
    actors_campaigns_malware: ["Silent Ransom Group", "SRG", "Luna Moth", "Chatty Spider", "UNC3753", "Storm-0252"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Silent Ransom Group — a Russia-linked extortion gang that has targeted U.S. law firms since 2023 — has escalated to physically walking operatives into law firm offices under the guise of IT support"
        attribution: "CyberScoop"
        source_url: "https://cyberscoop.com/fbi-warning-silent-ransom-group-law-firms/"
      - quote: "The group has 'claimed responsibility for more than 100 attacks with activity surging during the past few months'"
        attribution: "CyberScoop"
        source_url: "https://cyberscoop.com/fbi-warning-silent-ransom-group-law-firms/"
      - quote: "If that attempt fails, SRG sends a threat actor to the victim's location to gain access to insert a storage device into the victim's computer"
        attribution: "CyberScoop (quoting FBI CSA)"
        source_url: "https://cyberscoop.com/fbi-warning-silent-ransom-group-law-firms/"
    extended_notes: |
      The in-person USB insertion tactic is operationally unusual — it requires geographic proximity to the victim and a credible IT impersonation persona, implying the group maintains a roster of field operatives willing to physically attend victim premises in US cities. Orrick, Herrington & Sutcliffe; Jones Day; and Wood Smith Henning & Berman all had data published in Q1 2026 after refusing demands; Ropers Majeski was claimed on May 6. CyberScoop cites FBI CSA 260526 (released 2026-05-26) as the primary; prior alert was IC3 CSA 250523 (2025-05-23). The FBI has been tracking SRG under multiple aliases; CrowdStrike / Recorded Future / Flashpoint / Halcyon all confirm the cluster identity.

  - title: "Netherlands: 35-year-old arrested in AFC Ajax football club hack — 300,000+ fan account records and season-ticket management APIs exposed; Dutch DPA notified"
