  item: "CVE-2026-48842 — Roundcube Webmail pre-authentication SQL injection"
  url_or_quote: "a `preg_replace()` backslash-escape bypass in the login flow allows an unauthenticated network attacker to inject arbitrary SQL via the `_user` parameter when the plugin is enabled"
