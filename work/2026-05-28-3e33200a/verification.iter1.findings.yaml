- code: F4
  category: hallucinated-fact
  section: deep-dive
  item: "Deep Dive § 5 — Nx Console / TanStack / DAEMON Tools cascade"
  url_or_quote: "the chain begins on or before 2026-05-11 with [GHSA-g7cv-rxg3-hmpx](...) (CVE-2026-45321): a TanStack Router npm package version was published with a credential-stealing payload"
  summary: "The GHSA-g7cv-rxg3-hmpx and the Nx postmortem both make clear the upstream compromise was the @tanstack/* package family (42 packages); the Nx postmortem specifically names @tanstack/zod-adapter@1.166.15 as the resolved malicious dependency on the compromised contributor's machine. 'TanStack Router' is incorrect/narrowed — it should read '@tanstack/* npm packages (42 packages affected; specifically @tanstack/zod-adapter@1.166.15 on the compromised contributor's machine)'."

