      - quote: "Ransomware families like Snatch and AvosLocker have abused Safe Mode for years, but this is the first reported tie to Akira that Huntress has observed."
        attribution: "Huntress"
        source_url: "https://www.huntress.com/blog/akira-hits-safe-mode-ransomware-rebooting-around-edr"
      - quote: "\"C:\\Windows\\system32\\reg.exe\" add HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Control\\SafeBoot\\Network\\AnyDesk /ve /d Service"
        attribution: "Huntress"
        source_url: "https://www.huntress.com/blog/akira-hits-safe-mode-ransomware-rebooting-around-edr"
      - quote: "akira.exe executed at 06:34:29 UTC and spawned its child-process burst at 06:36:21 UTC. About 13 seconds later, the host started throwing memory errors: 06:36:16 - System EID 26: \"Windows — Virtual Memory Minimum Too Low\" 06:36:33 - System EID 26: \"Windows — Out of Virtual Memory\""
        attribution: "Huntress"
        source_url: "https://www.huntress.com/blog/akira-hits-safe-mode-ransomware-rebooting-around-edr"
      - quote: "Alert on boot-configuration changes and Safe Mode boots: msconfig.exe / bcdedit activity, Kernel-Boot EID 27 with a SAFEBOOT load option, Kernel-General EID 12 BootMode=2, and third-party security services stopping (System EID 7036). Watch for tooling being added to the Safe Mode minimal-service registry list."
        attribution: "Huntress"
        source_url: "https://www.huntress.com/blog/akira-hits-safe-mode-ransomware-rebooting-around-edr"
    extended_notes: |
      Triage/benign-lookalike discriminator (source-supported, not invented): Safe Mode with Networking reboots do occur legitimately (driver-conflict troubleshooting, IT support), so the discriminating signal is the co-occurrence pattern Huntress lays out — a SafeBoot registry write adding a non-standard remote-access tool (AnyDesk/ScreenConnect/AnyViewer-class binaries, not core OS drivers) to the Minimal/Network keys, immediately preceded by an external VPN/RDP logon and a burst of failed logins from the same source, and followed within minutes by third-party security-service stop events (System EID 7036) and Defender RTP going dark. A routine IT-driven Safe Mode boot does not carry that anomalous-remote-logon-plus-tool-registration signature. Hardening: require MFA on every VPN account (this intrusion had none), IP-allowlist or disable SSL VPN during active-attack windows, deploy EDR to 100% of hosts (the affiliate enumerated more hosts than had an agent installed — unmonitored hosts are where the Safe Mode prep happened undetected), and ingest VPN + Windows Event Logs to SIEM so the multi-hour gap between credential spray and detonation is visible before impact. Huntress frames Akira's broader 2025-2026 playbook (exposed VPN, most often SonicWall, → domain-controller pivot → AD enumeration → WinRAR-to-cloud exfil → detonation, all within a few hours) as well-worn; this incident followed that chain almost exactly, with the Safe Mode step as the one new element.

  - title: "Acronis TRU: PATCHCORD/SHEETCORD malware cluster abuses the Google Sheets API as C2 against Afghan telecom and South Asian critical infrastructure — moderate-confidence APT36 overlap"
    sources:
      - { url: "https://www.acronis.com/en/tru/posts/patchcord-new-malware-cluster-targets-afghan-telecom-and-south-asian-critical-infrastructure/", publisher: "Acronis Threat Research Unit (TRU)", date: "2026-08-13", role: "primary" }
