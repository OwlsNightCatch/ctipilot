    extended_notes: |
      Detection-relevant telemetry classes (source-supported): process-creation events for reg-free in-memory shellcode execution are hard to catch by file scanning (no dropped payload), so the actionable hook is API-call telemetry (VirtualAlloc→VirtualProtect(PAGE_EXECUTE_READ)→CreateThread sequences originating from a process matching the PATCHCORD/SHEETCORD loader) plus network egress to sheets.googleapis.com / docs.google.com from a host with no legitimate business reason to script-drive Sheets, and Startup-folder writes of unsigned VBScript. Persistence hardening: audit %APPDATA%\Microsoft\Windows\Start Menu\Programs\Startup\ for unexpected VBScript/LNK entries and monitor default-browser shortcut target/argument changes (T1547.009 is somewhat under-detected by traditional AV since it modifies a shortcut rather than a binary). Acronis's own confidence-qualified attribution language is preserved verbatim above per the task's specific instruction to verify whether Acronis makes the APT36 claim itself (it does, at "moderate confidence," with an explicit alternate-hypothesis carve-out for the SilverFox infrastructure overlap that it declines to elevate to attribution) — this is a textbook example of the source doing its own competing-hypotheses treatment, which the entry should carry through rather than flattening to "attributed to APT36."

