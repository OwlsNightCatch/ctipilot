items:
  - title: "Huntress: Akira affiliate reboots a SonicWall-VPN victim into Safe Mode with Networking to blind EDR — and breaks its own encryptor in the process"
    sources:
      - { url: "https://www.huntress.com/blog/akira-hits-safe-mode-ransomware-rebooting-around-edr", publisher: "Huntress", date: "2026-08-12", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/akira-hackers-disable-edr-with-safe-mode-steal-data-but-fail-to-encrypt/", publisher: "BleepingComputer", date: "2026-08-13", role: "corroborating" }
      - { url: "https://www.theregister.com/research/2026/08/12/akira-ransomware-scum-blocked-victims-security-tools-and-broke-their-own-encryptor/5286515", publisher: "The Register", date: "2026-08-12", role: "corroborating" }
    discovery_trace: "first seen at: spawn-tasked backlog item (BleepingComputer discovery article, URL https://www.bleepingcomputer.com/news/security/akira-hackers-disable-edr-with-safe-mode-steal-data-but-fail-to-encrypt/, 2026-08-13) → primary: Huntress, URL https://www.huntress.com/blog/akira-hits-safe-mode-ransomware-rebooting-around-edr (fetched via WebFetch and cross-checked against the raw HTML body pulled with tools/fetch_source.py url to confirm every quoted log line/registry command is genuine, not summariser paraphrase) → corroboration: The Register, URL https://www.theregister.com/research/2026/08/12/akira-ransomware-scum-blocked-victims-security-tools-and-broke-their-own-encryptor/5286515"
    summary: |
      Huntress documents an Akira affiliate intrusion (early August 2026) that is the first time Huntress has observed Akira itself use a Safe-Mode EDR-evasion play previously seen from Snatch and AvosLocker (MITRE ATT&CK T1688 — Impair Defenses: Safe Mode Boot). Initial access was a credential-spray (T1110.003) against an internet-exposed SonicWall SSL VPN with no MFA in front of it (T1133/T1078): a burst of "Unknown User Login Attempt" failures from ~03:45 UTC resolved into a successful login at 03:52:42 UTC on 2026-08-04. The operator RDP'd to the domain controller, ran full-property Get-ADUser/Get-ADComputer dumps with $formatenumerationlimit=-1 to defeat PowerShell's default 4-item truncation (T1087.002/T1018), then staged data with WinRAR and exfiltrated to cloud storage (T1560.001/T1567.002). Before rebooting, the attacker installed AnyDesk as a service and added it to the Safe Mode driver/service allow-list with `"C:\Windows\system32\reg.exe" add HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\SafeBoot\Network\AnyDesk /ve /d Service` (T1112/T1219), then forced the reboot via msconfig (Kernel-Boot EID 27, LoadOptions="...SAFEBOOT:NETWORK"; Kernel-General EID 12, BootMode=2). The reboot stopped the Huntress agent and killed Windows Defender real-time protection (Defender itself logged EID 3002, error 0x8007043c, "This service cannot be started in Safe Mode" — confirming its own RTP was down), leaving the host with no working EDR/AV for the whole Safe Mode window. akira.exe executed at 06:34:29 UTC, but Safe Mode's constrained virtual memory starved the process tree: System EID 26 logged "Virtual Memory Minimum Too Low" (06:36:16) then "Out of Virtual Memory" (06:36:33), and the encryptor never detonated. A scheduled Defender scan flagged the binary as Ransom:Win32/Akira.B!ibt at 07:43:50 UTC but couldn't quarantine it while RTP was still down (RoutineClean failed, 0x80004005); the file was only removed at 08:12:28 UTC, after the attacker rebooted the host back to normal mode at 08:10:38 UTC and restored Defender. Total elapsed time from the successful VPN logon to the final quarantine was under five hours. Huntress notes the failure was a lucky side effect of the attacker's own memory-budget mistake, not a defense to plan around — a host with more RAM/pagefile, or a retooled encryptor with a lighter memory footprint, could succeed in a future intrusion. Credentials and file shares were still exfiltrated, so the intrusion remains extortion-viable even without encryption.
    region_nexus: "global; SonicWall SSL VPN and Akira RaaS affiliates are a standing exposure class for any EU/CH organisation running exposed remote-access appliances without MFA"
