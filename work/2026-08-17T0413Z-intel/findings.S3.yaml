      - { url: "https://thehackernews.com/2026/08/new-patchcord-backdoor-targets-afghan.html", publisher: "The Hacker News", date: "2026-08-14", role: "corroborating" }
      - { url: "https://www.zscaler.com/blogs/security-research/apt-attacks-target-indian-government-using-sheetcreep-firepower-and", publisher: "Zscaler ThreatLabz", date: "n/a (cited by Acronis as prior SHEETCREEP documentation)", role: "background" }
      - { url: "https://www.bitdefender.com/en-us/blog/businessinsights/apt36-nightmare-vibeware", publisher: "Bitdefender", date: "n/a (cited by Acronis re: APT36's AI-assisted/vibecoded tooling shift)", role: "background" }
    discovery_trace: "first seen at: spawn-tasked backlog item (Security Affairs discovery article, URL https://securityaffairs.com/197266/intelligence/apt36-suspected-in-patchcord-espionage-campaign-using-google-sheets-c2.html) → primary: Acronis TRU, URL https://www.acronis.com/en/tru/posts/patchcord-new-malware-cluster-targets-afghan-telecom-and-south-asian-critical-infrastructure/ (WebFetch 403'd; fetched raw HTML directly via tools/fetch_source.py url and grepped the full body for the exact attribution wording and technical quotes) → background pivots to Acronis's own cited references: Zscaler SHEETCREEP write-up and Bitdefender APT36-vibeware post, both linked in the Acronis post's own text"
    summary: |
      Acronis TRU documents an ongoing campaign delivering a previously undocumented C/C++ backdoor, PATCHCORD, against Afghan telecom providers and South Asian critical-infrastructure organisations, delivered via sector-specific lures — fake VPN installers impersonating Afghan Telecom (AFTEL), a Salaam Telecom-themed archive (Bonus_Salaam_telecom.zip), and an Afghan Ministry of Communications and IT-themed MSI installer with an accompanying MCIT.pdf decoy. PATCHCORD can adjust its beacon interval, enumerate processes, execute arbitrary commands via `cmd.exe /c` with a 60-second timeout, and — its most notable capability — decode/decrypt an operator-supplied shellcode payload, allocate executable memory with VirtualAlloc, flip protection to PAGE_EXECUTE_READ via VirtualProtect, and execute it via CreateThread, entirely in memory with the shellcode never written to disk (T1620 Reflective Code Loading). Infrastructure pivoting from a purpose-registered domain (afghantelecom[.]site) surfaced SHEETCORD, a Go-based implant that reuses PATCHCORD's command set but replaces the C2 channel: it authenticates to the Google Sheets API v4 with a hard-coded GCP service-account credential and creates a dedicated per-victim tab in the operator's spreadsheet for bidirectional tasking/response (T1102.002/T1071.001), which Acronis assesses shares significant code and functionality with the previously documented SHEETCREEP RAT (Zscaler ThreatLabz). SHEETCORD adds a persistence mechanism PATCHCORD lacks — a `StartupEntry` function drops a VBScript (`%APPDATA%\Microsoft\Windows\Start Menu\Programs\Startup\SystemHelper...`) that silently launches the implant via WScript on every logon (T1547.001) — and independently hijacks the target's default browser shortcuts across six browsers to load a malicious component, verifying via IPersistFile that the target is a genuine browser executable before rehijacking (T1547.009). A second campaign wave from March 2026 targeting India's energy sector delivered a different PATCHCORD variant via an NHPC Fuel Conservation Client-themed lure, adding basic anti-analysis techniques not present in the earlier sample. On the CVE-2024-6387 (regreSSHion) angle: Acronis found exploit tooling for that OpenSSH flaw on the same operator server, suggesting network-level as well as endpoint-level access attempts against Afghan telecom infrastructure. **On attribution, Acronis itself states**: "TRU assesses with moderate confidence that the activity overlaps with the broader APT36 (Transparent Tribe) cluster or a closely related Pakistan-linked threat actor based on targeting, malware similarities, infrastructure and operational tradecraft" — citing sustained Afghan telecom/government targeting (previously documented against APT36), the presence of HackBrowserData (previously seen in APT36 operations against Indian Air Force officials, per a public write-up Acronis cites), and code-comment/structural evidence consistent with AI-assisted development that Acronis says echoes APT36's documented shift toward AI-vibecoded malware. Acronis explicitly distinguishes this from a separate, lower-confidence lead: infrastructure overlap with SilverFox tooling exists but "these observations alone are insufficient to support an attribution," so the SilverFox link is not carried forward as an attribution claim. This is a genuine confidence-qualified assessment made by the discovering lab itself, not a press-only claim — the "APT36 suspected" headline framing in Security Affairs/Hacker News tracks Acronis's own wording.
    region_nexus: "South Asia (Afghanistan telecom/government, India energy sector); technique class (cloud-API-as-C2, in-memory shellcode execution, no-disk-write persistence) is globally transferable and relevant to any organisation's cloud-service-abuse detection posture"
