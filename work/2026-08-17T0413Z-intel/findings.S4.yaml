    discovery_trace: "first seen at: WebSearch (\"BlgCloud compromise ChimeraZ cyberattaque fuite données entreprises\") → pivot: Cyberattaque.org RSS feed (https://www.cyberattaque.org/feed/), URL https://www.cyberattaque.org/lenormant-206-go-de-donnees-et-pres-de-39-000-fichiers-internes-diffuses-apres-une-cyberattaque/ (fresh in-window Leak #9 drop, published 2026-08-16T18:56Z) → primary: Cyberattaque.org root-cause writeup, URL https://www.cyberattaque.org/blgcloud-les-donnees-de-159-entreprises-pirate-des-millions-de-documents-en-fuite/ → corroboration: ZATAZ.COM, URL https://www.zataz.com/deux-pirates-revendiquent-le-piratage-de-pro-du-cloud/ → corroboration: FrenchBreaches (quotes BlgCloud's own statement), URL https://frenchbreaches.com/alertes/blgcloud-mskjo8rlb7gngvnvb4k → continuation confirmed via https://www.cyberattaque.org/motoculture-cravero-49-168-fichiers-et-les-donnees-de-plus-de-8-500-personnes-diffuses/ (published 2026-08-16T04:19Z)"
    summary: |
      BlgCloud, a French SaaS ERP/CRM editor serving dealers, renters, repairers and wholesalers of
      agricultural machinery, material-handling, and public-works equipment (~230 customer instances),
      confirmed a cyberattack at the end of July 2026 after actors using the handles "Misere" and
      "ChimeraZ" claimed on a criminal forum to have accessed roughly 159 of its ~230 customer
      environments and extracted "several terabytes" of CRM records, emails and internal documents.
      BlgCloud disputes the attacker's scope, confirming exfiltration on only 13 customer instances (5
      of which also lost significant document sets) plus a separate account-takeover affecting 3
      further instances. BlgCloud's own disclosure names the root cause precisely: a specific request
      that allowed creation of a restricted extranet account, exploitable only while the old and new
      versions of the customer extranet were running in parallel during a platform migration; a
      misconfiguration of the rights assigned to that account then enabled unauthorized data access.
      BlgCloud states this configuration had not been caught by its own prior penetration tests. The
      separate 3-instance compromise is attributed to reuse of previously breached (stuffed)
      credentials. Attackers are extorting BlgCloud directly, selling both the intrusion method/flaw
      and individual companies' stolen data, and have been publishing one victim's data per day since
      early August; in-window drops on 2026-08-16 named Lenormant ("Leak #9", 20.6 GB / ~39,000 files)
      and Motoculture Cravero (49,168 files, data on 8,500+ people), continuing a campaign whose
      claimed target list includes larger French groups (Renault Retail Group, SPIE Batignolles,
      Novelis, Manitowoc). BlgCloud states no payment-card data is held on its platform and that only
      each customer's own single business IBAN (already public on the extranet for invoicing) could
      have been exposed, not their clients' banking data; it has notified the CNIL. Leaked CRM
      free-text fields reportedly also contained what appear to be plaintext credentials/passwords
      users had stored themselves — a secondary data-hygiene lesson distinct from the platform flaw.
