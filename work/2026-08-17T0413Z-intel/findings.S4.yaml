    extended_notes: |
      Framed around the transferable lesson, not the victim list: a SaaS/ERP vendor's authorization
      logic broke specifically during a dual-version migration window (old + new extranet code paths
      coexisting) — a condition many SaaS platforms pass through during upgrades — plus a separate,
      unrelated credential-stuffing exposure on 3 instances. Detection angle: for any SaaS/ERP/CRM
      vendor or its customers, treat account-creation events tied to a customer-facing self-service
      portal as a monitored telemetry class in itself (not just authentication), with particular
      attention during platform version cutovers when both old and new account-provisioning code
      paths may be reachable simultaneously; flag account-creation requests that grant scope broader
      than the standard "restricted extranet" role. Separately, monitor SaaS-portal authentication for
      credential-stuffing indicators (logins matching known-breached credential pairs, impossible
      travel, atypical device fingerprints) given BlgCloud's own account-takeover exposure came from
      reused passwords. Hardening: retire legacy account-provisioning endpoints before/instead of
      running them in parallel with a new version; require MFA on customer-facing SaaS logins; audit
      free-text CRM/ERP fields for plaintext secrets before they become part of a data-exfiltration
      blast radius. Not on the "already covered" list for this run; the underlying flaw was first
      confirmed ~2026-08-08 but the campaign is still actively producing fresh in-window victim
      disclosures (2026-08-16), which is why this is being surfaced now rather than as a stale
      week-old story. Reliability of the two French breach-tracking publishers (Cyberattaque.org,
      FrenchBreaches) is admiralty C (aggregators of a criminal-forum claim), but both independently
      quote BlgCloud's own confirming statement verbatim, and ZATAZ.COM (admiralty B) corroborates the
      extortion/vulnerability-sale mechanics — hence MULTI-SOURCE, MEDIUM confidence (attacker's 159-
      instance claim is unconfirmed; BlgCloud's own count of 13 confirmed + 3 account-takeover is the
      only company-attested figure).
    borderline: true
    borderline_reason: "no European CI/government victim confirmed by name; inclusion rests on the transferable SaaS/ERP authorization-flaw TTP and campaign scale (159 claimed / at least 16 company-confirmed customer environments across France), not on any single victim's sector"

