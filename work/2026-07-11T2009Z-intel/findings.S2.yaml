notes: |
  Exhaustive sweep for the 24h window 2026-07-10T20:09Z .. 2026-07-11T20:09Z
  turned up no genuinely new, non-duplicate home-region/sector item. Two
  structural reasons converge this run:
  (1) Nearly every essential CERT/regulator source's freshest content
      clusters in the morning of 2026-07-10 (BSI ~10:30-11:06 GMT, NCSC-NL
      ~05:54 UTC, CERT-FR "10 juillet" batch, NCSC-CH CSH Zimbra post at
      12:45 UTC) — all several hours before the strict 24h floor
      (2026-07-10T20:09Z), even though some of that same 07-10 batch (e.g.
      CERT-FR AVI-0856 MOVEit) was accepted as fresh by an earlier run today
      whose window start differed. This run holds the stated floor strictly
      per PD on recency and does not re-litigate that earlier admission.
  (2) Everything genuinely fresh in-window that touches the home region or
      sector was already captured by today's earlier fires and appears in
      prior_coverage.json: Gitea CVE-2026-20896 (NCSC-CH escalation,
      2026-07-10), CERT.LV/LVM ransomware, PDAG Aargau phishing, HTTP.sys
      CVE-2026-47291 update, NHS England insider-access controls, Joomla
      RSFiles!/Phoca RCE wave, MOVEit Transfer CERT-FR advisory, Armored
      Likho APT (government/electric-power targeting, Kaspersky) — all
      already in the dedup index and not re-surfaced.
  Extensive WebSearch coverage in German, French, Italian and Polish
  (Swiss cantonal/communal breaches, hospital/health-sector ransomware,
  telecom, banking/insurance, energy-grid, municipal "Rathaus"/"Kommune"
  attacks) surfaced only stale (June 2026 or earlier, some mis-dated by
  search synthesis — e.g. a Nuremberg NoName057(16) DDoS story that search
  summarised as "July 2026" was verified on-page to be an August 2025
  article about a July 2025 incident — dropped as recycled news) or
  already-covered stories. No qualifying item is being suppressed; this is
  an honest quiet window for the S2 domain specifically, not a coverage
  failure.

  Self-evolution note: CERT-FR's RSS `published` field for both the avis
  and actualite feeds renders a flat "00:00:00 +0000" for every item
  regardless of true intraday publish time, which makes the 24h-floor
  boundary genuinely ambiguous for same/previous-day CERT-FR items (see
  the AVI-0856..0861 batch above). Recommend the source record's notes
  be updated to flag this known granularity limit so future runs treat
  CERT-FR "yesterday-dated" items consistently (either always-in or
  always-out) rather than per-run judgement calls.
