items:
  - title: "[BORDERLINE, NOT SHIPPED AS CONFIRMED] Qilin leak-site claims Italian telecom infrastructure operator Retelit SpA — uncorroborated"
    sources:
      - { url: "https://api.ransomware.live/v2/recentvictims", publisher: "Ransomware.live (leak-site observatory)", date: "2026-07-11", role: "primary" }
    discovery_trace: "first seen at: ransomware-live, URL https://api.ransomware.live/v2/recentvictims (claim posted/discovered 2026-07-11T13:34Z, group=qilin, victim=Retelit SpA PIVA, domain=www.retelit.it, country=IT, activity=Telecommunication) → attempted pivot: WebSearch (\"Retelit Qilin ransomware attack\"), WebSearch (\"Retelit attacco informatico luglio 2026\"), WebSearch (\"\\\"Retelit\\\" ransomware OR cyberattack OR breach\") → no victim statement, no regulator filing, no journalism (EN or IT) found as of run time → primary: none reachable beyond the leak-site claim itself."
    summary: |
      The Qilin ransomware/extortion operation posted a claim on 2026-07-11 (13:34 UTC, per Ransomware.live's
      leak-site observatory) naming Retelit SpA — an Italian B2B fiber/dark-fiber and cloud infrastructure
      operator serving over 65,000 businesses — as a victim. No data-size, ransom demand, or sample was listed
      on the tracker record beyond the group name and a screenshot link. Extensive search (English and Italian)
      found no victim statement from Retelit, no Italian data-protection authority (Garante) filing, and no
      journalism (Italian trade press, security press, or English-language outlets) reporting or corroborating
      the claim as of this run. Retelit's own press channel shows no acknowledgement. This fails the standing
      two-source / victim-confirmation bar for ransomware leak-site claims and is NOT shipped as a confirmed
      incident. Surfaced here per the domain mission's explicit "which extortion-site claims remain
      claims" question — Qilin is a high-volume RaaS operation (700+ claimed 2025 victims) already tracked
      in the registry (actor:qilin), and Italian telecom/fiber infrastructure is an adjacent-sector,
      adjacent-region target class relevant to Swiss/EU critical-infrastructure defenders if the claim is
      later corroborated.
