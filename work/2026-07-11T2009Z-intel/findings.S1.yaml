    extended_notes: |
      Detection (telemetry class first, platform anchor second):
      - Process-creation telemetry with parent-image lineage: any child process (python, bash, sh, or
        subprocess-spawned interpreters) whose PARENT is the PraisonAI/praisonaiagents Python process,
        especially where the child subsequently opens outbound network connections or reads
        credential-adjacent environment variables — Sysmon EID 1 / EDR process-creation events filtered on
        parent image = the agent-hosting Python interpreter is the concrete anchor.
      - Egress/DNS telemetry: outbound HTTP(S)/DNS requests issued by the agent-hosting process shortly after
        it processes untrusted/ingested content (tool results, uploaded documents, chat input) — a plausible
        exfiltration-shaped sequence for the CodeAgent secrets-leak path.
      - Application/tool-call audit log: PraisonAI's own tool-call log (if enabled) for `execute_command` /
        `write_to_file` invocations whose arguments reference paths outside the intended working directory
        (e.g. /etc/, ~/.ssh/, cron directories) — this is the AICoder-specific discriminator the vendor
        advisory itself calls out.
      - Database audit logging: PGVector/Cassandra DDL statements generated by the knowledge-store
        `create_collection()` call path containing non-numeric tokens in the dimension position (SQL/CQL
        tokens, semicolons, comment sequences) — anomalous relative to the expected integer-only value.
      Hardening:
      - Upgrade praisonaiagents to >= 1.6.78 and praisonai to >= 4.6.78 (all three fixed in the same release
        line).
      - Do not rely on `CodeConfig(sandbox=True)` alone even post-patch — verify the fixed version actually
        enforces sandboxing rather than exposing the same dead-code flag; independently constrain LLM code
        execution via OS-level sandboxing (gVisor/nsjail/seccomp), a scoped/empty environment for the
        execution subprocess rather than `os.environ.copy()`, and import/module allowlisting.
      - Run any AICoder-enabled deployment as a non-root container user with a read-only root filesystem and
        no bind-mounted host paths, to blunt the impact even if the tool-call abuse succeeds.
      - Validate and parameterize the `dimension` argument server-side (enforce integer type and bounds)
        before any DDL generation in PGVector/Cassandra knowledge-store integrations; do not string-interpolate
        caller-supplied values into DDL.
      Triage / benign-lookalike: legitimate CodeAgent use also spawns python subprocesses performing real
      data-processing work, so parent-child process lineage alone is not the discriminator — the source-stated
      signal is the CHILD PROCESS'S BEHAVIOUR: unexpected imports (socket, urllib.request, subprocess spawning
      a shell) not required for the agent's declared task, or outbound network calls carrying
      environment-variable-shaped data. For AICoder, legitimate file writes stay within the declared
      workspace/project directory; the vendor-cited PoC targets (/etc/crontab, SSH keys) are outside any
      normal workspace scope and are the discriminating signal.
