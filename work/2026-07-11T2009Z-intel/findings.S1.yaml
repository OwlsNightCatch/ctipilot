    discovery_trace: "first seen at: enisa-euvd bridge (`enisa-euvd recent criticals`), human detail page https://euvd.enisa.europa.eu/enisa/eu_vulnerability_database/EUVD-2026-43182 → primary: GitHub Security Advisory (vendor), https://github.com/MervinPraison/PraisonAI/security/advisories/GHSA-2xv2-w8cq-5gxw (read in full via jina reader after WebFetch also returned the body) → cross-checked: NVD, https://nvd.nist.gov/vuln/detail/CVE-2026-61447 → corroborating: TheHackerWire, https://www.thehackerwire.com/praisonai-rce-cve-2026-61447/ ; companion CVEs found in the same EUVD criticals sweep: EUVD-2026-43181 → https://github.com/MervinPraison/PraisonAI/security/advisories/GHSA-9mp3-24cc-77mg ; EUVD-2026-43175 → https://github.com/MervinPraison/PraisonAI/security/advisories/GHSA-wf65-4jjx-q444"
    summary: |
      Three CVEs affecting PraisonAI, an open-source multi-agent LLM orchestration framework (pip packages
      praisonaiagents / praisonai), were published together on 2026-07-11 (NVD/EUVD datePublished ~13:01 UTC),
      assigned by VulnCheck. All three are reachable through prompt injection into the framework's LLM-facing
      tool-call surface rather than through a classic network listener, illustrating a technique class specific
      to agentic-AI deployments: the LLM's own output is the code path to RCE.

      CVE-2026-61447 (CVSS 10.0 v4.0, CWE-94) is in `CodeAgent._execute_python()`
      (src/praisonai-agents/praisonaiagents/agent/code_agent.py, lines 253-308): LLM-generated Python is written
      to a temp file and run via `subprocess.run(["python", temp_file], env=os.environ.copy())` with zero AST
      validation, zero import restriction, and no sandbox enforcement — even though `CodeConfig` declares
      `sandbox: bool = True` by default; `_execute_python()` never reads that field, so the sandbox flag is dead
      code. Passing the full parent environment to the subprocess exposes every credential in-process
      (OPENAI_API_KEY, DATABASE_URL, cloud tokens) to any code the LLM can be induced to emit. Fixed in
      praisonaiagents >= 1.6.78.

      CVE-2026-61445 (CVSS 9.4) is in the AICoder chat-UI component, which exposes `write_to_file` and
      `execute_command` tool calls to the model without path validation or command sanitization — an attacker
      who can influence the LLM's tool-call arguments via prompt injection can write to arbitrary filesystem
      paths (e.g. /etc/crontab, SSH authorized_keys) and run arbitrary shell commands; the vendor advisory notes
      Docker deployments of PraisonAI commonly run as root (no USER directive), turning tool-call abuse into
      full host compromise inside the container. Fixed in praisonai >= 4.6.78.

      CVE-2026-60090 (CVSS 9.3) is a SQL/CQL injection in the PGVector and Cassandra knowledge-store backends'
      `create_collection()`: the numeric `dimension` argument is declared as `int` but never validated at
      runtime and is interpolated directly into the generated `CREATE TABLE`/CQL DDL, so a caller who can
      influence collection-creation parameters (e.g. via a RAG ingestion API) can append tokens such as
      `3); DROP TABLE tenant_secrets; --`. A prior, narrower collection-name injection in the same code path had
      already been patched; this dimension-parameter vector was missed. Conservative affected range per the
      vendor: praisonai >= 3.10.0, <= 4.6.64, plus current main at disclosure time for PGVector/Cassandra
      knowledge-store users. Fixed in praisonai >= 4.6.78.

      No public PoC or confirmed in-the-wild exploitation had been reported for any of the three as of this
      writing (TheHackerWire, 2026-07-11). Context for defenders: an earlier, unrelated PraisonAI flaw
      (CVE-2026-44338, a hardcoded-disabled-auth issue disclosed 2026-05-11) was scanned and targeted within
      under 4 hours of disclosure per multiple outlets (SecurityWeek, CSO Online, Sysdig) — PraisonAI-class
      agentic frameworks are demonstrably watched by opportunistic scanners the moment an advisory drops, so
      the absence of a PoC today should not be read as low urgency.
