    discovery_trace: "first seen at: WebSearch (\"NHS hospital cyberattack July 20 2026\") -> pivot: TechCrunch, URL https://techcrunch.com/2026/07/20/hackers-stole-significant-amount-of-data-from-tech-firm-relied-on-by-thousands-of-us-hospitals-and-pharmacies/ -> primary: Craneware plc RNS regulatory filing, URL https://www.investegate.co.uk/announcement/rns/craneware--crw/notice-of-cyber-security-incident/9675808 -> corroboration: Reuters via TradingView, URL https://www.tradingview.com/news/reuters.com,2026-07-20:newsml_RST9768Ma:0-reg-craneware-plc-notice-of-cyber-security-incident/"
    summary: |
      Craneware plc (AIM: CRW.L), an Edinburgh-headquartered healthcare revenue-cycle-management
      (RCM)/billing software vendor whose products (Trisus, InSight, and the Sentry pharmacy platform
      acquired 2021) are used by a large share of the US hospital and pharmacy market, disclosed via
      UK regulatory (RNS) announcement on 2026-07-20 that it identified and responded to a cyber
      security incident involving unauthorised access to a subset of its data environment. Craneware
      states a significant volume of file names were viewed and exfiltrated, with "employee data and
      some customer and partner records" accessed; the company characterises a large element of the
      affected data as non-sensitive or already-public regulatory data. The company's incident-response
      plan was activated including external forensic/cyber specialists; per the disclosure, the incident
      is contained, there are no residual indicators of compromise, and customer services/operations
      were not disrupted. Craneware notified the UK Information Commissioner's Office and the US FBI.
      No initial-access vector, no threat-actor attribution, and no extortion/leak-site claim have been
      disclosed as of this writing — the RNS filing is silent on mechanism. Transferable lesson for this
      constituency: Craneware is a UK/European-domiciled, exchange-listed healthcare-software supply
      chain vendor (comparable in kind to the previously tracked Netherlands-based ChipSoft/Embargo
      incident) — any Swiss/EU healthcare provider or public-health body relying on a similarly
      positioned RCM/billing SaaS vendor should treat vendor-side employee/partner-record exposure as
      a credential-stuffing and targeted-phishing enabler even where "customer services" were not
      disrupted.
    region_nexus: "UK (Edinburgh HQ, AIM/LSE-listed); customer base described in press coverage as predominantly US hospitals/pharmacies — no EU/CH victim impact confirmed"
