    extended_notes: |
      No ATT&CK technique mapped: neither the Craneware RNS filing nor the corroborating press
      coverage discloses an initial-access vector, exploited vulnerability, or attacker tooling —
      only that "unauthorised access" occurred and file names were viewed/exfiltrated. Flagging this
      gap explicitly per PD-1 rather than guessing a technique. Not the same vendor/incident as the
      previously tracked Netherlands ChipSoft/Embargo healthcare-software-vendor attack
      (entities/registry.yaml actor:embargo) — noted only as a comparable pattern, not a relation.
      Borderline call: victim/customer-impact description in press coverage skews to the US hospital
      /pharmacy market rather than confirmed Swiss/EU healthcare exposure; nexus here rests on the
      vendor's UK domicile, AIM/LSE listing and ICO notification, plus the general transferable
      healthcare-SaaS-vendor lesson for this constituency's additional "healthcare" sector.
    borderline: true
