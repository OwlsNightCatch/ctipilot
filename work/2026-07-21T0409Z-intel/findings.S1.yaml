borderline_dropped_note: |
  Two items were assessed and NOT included after review: (1) BSI WID-SEC-2026-2411 / CERT-FR
  CERTFR-2026-AVI-0902 — a 10-bulletin Mattermost Server vulnerability bundle (published/updated
  2026-07-19/20 by both German and French national CERTs) carries NO CVE ids and NO CVSS scores
  (Mattermost's own policy withholds bulletin technical detail for 30 days after release; both CERTs
  rate it "mittel"/medium and describe only "a non-specified security issue"). Given the audience's
  actionability bar (component/CVE/CVSS/prerequisites), this lacked enough substance for a standalone
  entry; only the affected-version ranges were extractable (Server <11.9.0, <11.7.7, <11.8.4, <10.11.22,
  fixed 11.9.0/11.7.7/11.8.4/10.11.22 respectively per BSI's CSAF product tree). (2) CERT Polska's
  CVE-2026-57309/-57310/-57311 (Windu CMS, unauthenticated blind SQLi CVSS 9.3 + weak password hashing +
  authenticated file-upload RCE, published 2026-07-20) — Windu is a ~10,000-site Polish small-business
  "business card website" CMS with no confirmed public-sector/critical-infrastructure adoption, no vendor
  patch available (vendor contact attempts by CERT Polska were unsuccessful), and no confirmed exploitation;
  judged below the relevance bar for this constituency and dropped rather than marked borderline.
