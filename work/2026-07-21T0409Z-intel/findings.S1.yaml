    extended_notes: |
      Defender vantage: hunt for anomalous outbound requests to /assessment_thanks.do with a
      sysparm_assessable_type value containing JavaScript-object-property syntax
      (Object.defineProperty / prototype-chain tokens), and for gs.include() script-include
      evaluations triggered outside normal admin workflows in ServiceNow application logs.
      NVD has not yet published its own CVSS assessment for this CVE ("NVD assessment not yet
      provided" as of this run) — the 9.5 figure is the vendor/NCSC-CH-cited score, not an
      NVD-computed one; note this provenance if citing CVSS precision downstream.
