  - title: "CVE-2026-2291 — Exodus Intelligence publishes a working heap-overflow-to-RCE exploit chain against dnsmasq's DNS cache (OpenWrt target), two months after the silent fix"
    sources:
      - { url: "https://blog.exodusintel.com/2026/07/20/dnsmasq-dns-remote-heap-buffer-overflow/", publisher: "Exodus Intelligence", date: "2026-07-20", role: "primary" }
      - { url: "https://nvd.nist.gov/vuln/detail/CVE-2026-2291", publisher: "NVD", date: "2026-05-11", role: "corroborating" }
    discovery_trace: "first seen at: exodus-intelligence, URL https://blog.exodusintel.com/feed/ (RSS listing, item dated 2026-07-20T15:15:06Z) → primary: Exodus Intelligence full write-up, URL https://blog.exodusintel.com/2026/07/20/dnsmasq-dns-remote-heap-buffer-overflow/ → corroboration: NVD, URL https://nvd.nist.gov/vuln/detail/CVE-2026-2291"
    summary: |
      Exodus Intelligence published a full exploit-development write-up for CVE-2026-2291, a heap buffer
      overflow in dnsmasq's DNS-reply caching function `really_insert()` (src/cache.c). When dnsmasq converts
      a domain name from DNS wire-format to an escaped C string for caching, the escaping can double the
      string's length, but the destination `bigname` buffer (fixed at 1,025 bytes) is never resized —
      an unchecked `strcpy()` then overflows it. The published exploit chain sends three attacker-controlled
      DNS names in sequence (`alloc.me`, `overflow.me`, `overwrite.me`) resolved via a malicious/attacker-authoritative
      upstream DNS response to groom the heap, overflow into an adjacent `bigname` chunk's `next` pointer, mount
      a write-what-where primitive against `ld.so` function pointers, and achieve EIP control — full remote code
      execution on the OpenWrt target used for the demonstration (musl libc, x86). The bug requires no local
      access: the attacker only needs a client behind the vulnerable dnsmasq instance to resolve an
      attacker-controlled or attacker-influenced domain name. NVD's own CVSS (7.3, AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:L)
      frames the flaw as DNS-cache poisoning/DoS; Exodus's chain demonstrates the practical impact is materially
      worse — full code execution — which is the gap defenders should weigh when triaging by CVSS alone.
      Already fixed upstream in dnsmasq 2.92rel2 / 2.93 (11 May 2026); this write-up is a two-month-later
      technical deep dive, not a new zero-day, but dnsmasq is the default DNS/DHCP forwarder on OpenWrt and
      countless consumer/SME routers, embedded Linux and OT-adjacent gateways, and many enterprise Linux
      distributions' NetworkManager DNS backend — patch-verification exposure is broad.
    region_nexus: "global; dnsmasq is the default DNS/DHCP forwarder embedded in OpenWrt and widely deployed on consumer/SME routers and embedded-Linux gateways across CH/EU networks, including OT-adjacent estates in energy, water and transport"
    primary_sector_nexus: "indirect"
    sector: "energy, water, transport, telco (embedded network infrastructure); public-sector networks using OpenWrt-based or dnsmasq-based CPE"
    cves: ["CVE-2026-2291"]
    techniques: ["T1190"]
    affected_products: ["dnsmasq"]
