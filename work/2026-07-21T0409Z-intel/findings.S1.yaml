items:
  - title: "CVE-2026-6875 — ServiceNow AI Platform sandbox-escape RCE now confirmed under active exploitation (CVSS 9.5)"
    sources:
      - { url: "https://security-hub.ncsc.admin.ch/#/posts/12778", publisher: "NCSC-CH Cyber Security Hub", date: "2026-07-20", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/critical-servicenow-code-execution-flaw-now-exploited-in-attacks/", publisher: "BleepingComputer", date: "2026-07-20", role: "corroborating" }
      - { url: "https://slcyber.io/research-center/smashing-the-servicenow-sandbox-pre-authentication-rce/", publisher: "Searchlight Cyber", date: "2026-07-14", role: "corroborating" }
      - { url: "https://support.servicenow.com/kb?id=kb_article_view&sysparm_article=KB3137947", publisher: "ServiceNow (vendor KB)", date: "2026-07-13", role: "corroborating" }
    discovery_trace: "first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/12778 (fetched via `ncsc-csh recent 10`, post created 2026-07-20T12:04:27Z) → primary corroboration: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/critical-servicenow-code-execution-flaw-now-exploited-in-attacks/ → pivot: Searchlight Cyber (original discoverer/technical write-up), URL https://slcyber.io/research-center/smashing-the-servicenow-sandbox-pre-authentication-rce/ → vendor reference: ServiceNow KB3137947, URL https://support.servicenow.com/kb?id=kb_article_view&sysparm_article=KB3137947 (JS-gated, content not independently readable but cited by both NCSC-CH and Searchlight Cyber as the vendor advisory)"
    summary: |
      CVE-2026-6875 is a pre-authentication sandbox escape in ServiceNow AI Platform's GlideRecord query API
      (disclosed by Searchlight Cyber on 2026-07-14) that lets an unauthenticated caller reach unrestricted
      JavaScript execution: the attacker submits an unsanitized `sysparm_assessable_type` parameter to the
      `/assessment_thanks.do` endpoint, then uses `Object.defineProperty` to override `Object.clone` with the
      `Function` constructor, and triggers `gs.include()` script-include evaluation to run arbitrary server-side
      code once sandbox restrictions are lifted. ServiceNow shipped an emergency mitigation within 24 hours of
      disclosure and later introduced "Guarded Script" (restricting sandboxed code to single, simple expressions —
      no variable declarations, control flow, or multi-statement blocks) as the durable fix.
      NCSC-CH's 2026-07-20 advisory update (post 12778) changed the exploitation-status field from "no known
      exploitation" (as reported when this vulnerability was first covered on 2026-07-13) to "actively exploited."
      Threat-intelligence firm Defused, cited by BleepingComputer, confirmed in-the-wild exploitation starting
      2026-07-18. Self-hosted and partner-managed ServiceNow instances that have not applied the vendor's KB3137947
      hotfix are the residual exposure — ServiceNow's own hosted/SaaS instances were already patched.
    region_nexus: "global; ServiceNow AI Platform (Now Assist/Virtual Agent-class tooling) is widely deployed for ITSM/case-management in Swiss and EU public-sector back offices — self-hosted and partner-managed instances are the exposure that persists after ServiceNow's own hosted-instance fix"
    primary_sector_nexus: "direct"
    sector: "public-sector, finance, telco, healthcare (any org running self-hosted/partner-managed ServiceNow AI Platform)"
    cves: ["CVE-2026-6875"]
    techniques: ["T1190"]
    affected_products: ["ServiceNow AI Platform"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "update-of:2026-07-13/servicenow-ai-platform-sandbox-escape-cve-2026-6875"
    evidence:
      - quote: "Current exploitation status: Actively exploited"
        attribution: "NCSC-CH Cyber Security Hub (post 12778, 2026-07-20)"
        source_url: "https://security-hub.ncsc.admin.ch/#/posts/12778"
      - quote: "We are observing in-the-wild exploitation of the ServiceNow pre-auth sandbox-escape RCE (CVE-2026-6875)"
        attribution: "Defused, cited by BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/critical-servicenow-code-execution-flaw-now-exploited-in-attacks/"
      - quote: "Running any code via eval or new Function will run free from the constraints of the additional sandbox."
