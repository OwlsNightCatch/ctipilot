    evidence:
      - quote: "The root cause of the vulnerability is an unsafe strcpy() when a domain name is cached...The length of the string is not checked to ensure it does not exceed the size of the bigname buffer."
        attribution: "Exodus Intelligence"
        source_url: "https://blog.exodusintel.com/2026/07/20/dnsmasq-dns-remote-heap-buffer-overflow/"
      - quote: "To exploit the vulnerability a client makes a series of DNS requests to the target: alloc.me, overflow.me, and overwrite.me."
        attribution: "Exodus Intelligence"
        source_url: "https://blog.exodusintel.com/2026/07/20/dnsmasq-dns-remote-heap-buffer-overflow/"
      - quote: "dnsmasqs extract_name() function can be abused to cause a heap buffer overflow, allowing an attacker to inject false DNS cache entries, which could result in DNS lookups to redirect to an attacker-controlled IP address, or to cause a DoS."
        attribution: "NVD (CVE-2026-2291 description)"
        source_url: "https://nvd.nist.gov/vuln/detail/CVE-2026-2291"
    extended_notes: |
      Defender vantage: verify dnsmasq >= 2.92rel2/2.93 on any OpenWrt/embedded-Linux gateway,
      router or NetworkManager-DNS host; hunt for anomalous long/malformed DNS-response domain
      names (escaped-character-heavy) in DNS resolver logs, and for unexpected dnsmasq process
      crashes/restarts (a heap-corruption exploit attempt failing partway is a plausible precursor
      signal even where full RCE isn't achieved). No confirmed in-the-wild exploitation of this
      specific write-up's chain — this is researcher-published offense, not observed attack activity.
    watchlist: []

