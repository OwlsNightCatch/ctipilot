  - title: "Estée Lauder notifies employees of a data breach tied to the year-old Clop/Oracle E-Business Suite mass-exploitation campaign (CVE-2025-61882) — SSNs, passports, bank and health data exposed"
    sources:
      - { url: "https://oag.ca.gov/system/files/ELC%20-%20U.S.%20Individual%20Notification%20Letter.pdf", publisher: "The Estée Lauder Companies (breach notification letter, filed with California AG)", date: "2026-07-17", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/est-e-lauder-discloses-data-breach-via-oracle-e-business-flaw/", publisher: "BleepingComputer", date: "2026-07-20", role: "corroborating" }
      - { url: "https://cyberinsider.com/estee-lauder-discloses-data-breach-tied-to-oracle-e-business-suite-attacks/", publisher: "CyberInsider", date: "2026-07-20", role: "corroborating" }
    discovery_trace: "first seen at: bleepingcomputer (source-slice id bleepingcomputer), URL https://www.bleepingcomputer.com/news/security/news/security/ (listing) → drilled article, URL https://www.bleepingcomputer.com/news/security/est-e-lauder-discloses-data-breach-via-oracle-e-business-flaw/ → pivot: CyberInsider, URL https://cyberinsider.com/estee-lauder-discloses-data-breach-tied-to-oracle-e-business-suite-attacks/ (surfaced the primary notification-letter link) → primary: Estée Lauder's own California AG breach notification letter, URL https://oag.ca.gov/system/files/ELC%20-%20U.S.%20Individual%20Notification%20Letter.pdf"
    summary: |
      The Estée Lauder Companies is notifying current and former employees (letter dated
      2026-07-17, filed with the California Attorney General) that an unauthorized third
      party gained access to its Oracle E-Business Suite (EBS) human-resources system on or
      around 2026-08-09 (i.e. August 2025) and obtained personal information: names, postal
      and email addresses, dates of birth, US Social Security numbers, passport numbers, bank
      account numbers, health information, and employment records (performance evaluations,
      payroll). Estée Lauder determined the scope on 2026-06-19 through an investigation
      launched after learning of the underlying EBS vulnerability. The intrusion is linked
      (per BleepingComputer, citing CrowdStrike) to the wider Clop ransomware/extortion
      gang's Oracle EBS exploitation campaign, which exploited CVE-2025-61882 — an
      authentication-bypass-to-remote-code-execution flaw in the BI Publisher Integration
      component, affecting EBS versions 12.2.3-12.2.14 — since early August 2025; that
      campaign has already produced dozens of confirmed victim disclosures (Harvard, UPenn,
      Dartmouth, Washington Post, Logitech, Cox Enterprises, others). Estée Lauder is offering
      24 months of complimentary identity monitoring via Kroll (enrollment deadline
      2026-10-31). Estée Lauder was separately breached by Clop in 2023 via the MOVEit
      Transfer zero-day — its second confirmed Clop compromise.
    region_nexus: "global US multinational with EU retail/customer footprint — no direct Swiss/EU CI or government nexus; included via gates (a) and (c)"
    primary_sector_nexus: "none direct — retail/consumer goods; included via gates (a) genuinely global scale (SSN+passport+bank+health PII) and (c) Clop's demonstrated history of targeting European organisations (2023 MOVEit campaign hit UK/EU entities including British Airways, BBC, Ofcom)"
    sector: "retail, consumer goods"
    cves: ["CVE-2025-61882"]
    techniques: [T1190]
    affected_products: ["Oracle E-Business Suite (BI Publisher Integration component)"]
    entity_keys: []
