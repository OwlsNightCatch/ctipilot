      - { key: "actor:clop", type: actor, name: "Clop", aliases: ["Cl0p", "TA505", "FIN11"],
          summary: "Financially motivated data-theft/extortion group behind repeated mass-exploitation-then-extortion campaigns against enterprise file-transfer and ERP software (MOVEit Transfer 2023, GoAnywhere MFT 2023, Oracle E-Business Suite 2025-2026); attributed by CrowdStrike as exploiting CVE-2025-61882 since early August 2025 (BleepingComputer, 2026-07-20, citing CrowdStrike)." }
    relation_suggestions:
