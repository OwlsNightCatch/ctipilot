  - title: "Craneware plc (Edinburgh) discloses a cyber security incident — employee, customer and partner data exfiltrated from a UK/US healthcare billing-software supplier"
    sources:
      - { url: "https://www.investegate.co.uk/announcement/rns/craneware--crw/notice-of-cyber-security-incident/9675808", publisher: "Craneware plc (RNS regulatory announcement via Investegate)", date: "2026-07-20", role: "primary" }
      - { url: "https://techcrunch.com/2026/07/20/hackers-stole-significant-amount-of-data-from-tech-firm-relied-on-by-thousands-of-us-hospitals-and-pharmacies/", publisher: "TechCrunch", date: "2026-07-20", role: "corroborating" }
      - { url: "https://thecyberexpress.com/craneware-data-breach/", publisher: "The Cyber Express", date: "2026-07-20", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"Swiss company cyberattack data breach disclosure July 2026\") surfaced TechCrunch's Craneware coverage → primary: Craneware plc's own RNS regulatory announcement, URL https://www.investegate.co.uk/announcement/rns/craneware--crw/notice-of-cyber-security-incident/9675808 → corroboration: TechCrunch, URL https://techcrunch.com/2026/07/20/hackers-stole-significant-amount-of-data-from-tech-firm-relied-on-by-thousands-of-us-hospitals-and-pharmacies/ and The Cyber Express, URL https://thecyberexpress.com/craneware-data-breach/"
    summary: |
      Craneware plc (AIM: CRW), an Edinburgh, Scotland-headquartered supplier of healthcare
      revenue-cycle and billing software (the Trisus cloud ecosystem) used by thousands of US
      hospitals, clinics and pharmacies, disclosed via UK regulatory (RNS) announcement on
      2026-07-20 that it identified unauthorised access to a subset of its data environment.
      Attackers viewed and exfiltrated a significant volume of file names, including a
      percentage of Craneware employee data and a subset of customer and partner records,
      alongside what the company characterises as non-sensitive or already-public regulatory
      data. The vendor's own RNS filing does not disclose the initial access vector, exploited
      component, or exfiltration channel. External forensic specialists confirmed no residual
      indicators of compromise remain and reported no disruption to customer services or
      operations; Craneware notified the UK Information Commissioner's Office and the US FBI.
      TechCrunch flags the broader exposure risk given Craneware's software processes billing
      and, via its 2021 acquisition of pharmacy-software maker Sentry, holds an aggregate 147
      million patient records across its customer base — though the company's own assessment
      states the specific data taken in this incident is largely non-sensitive.
    region_nexus: "UK/Europe (Edinburgh-headquartered, AIM-listed; ICO notified) — home-region/sector nexus"
    primary_sector_nexus: "indirect — healthcare-software supplier (additional sector), public-sector-adjacent via NHS/health-system customers in the UK/EU"
    sector: "healthcare, technology (software supplier)"
