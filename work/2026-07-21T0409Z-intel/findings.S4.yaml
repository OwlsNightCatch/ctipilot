    extended_notes: |
      Vendor's own disclosure does not name an access vector, exploited component, or
      exfiltration mechanism — this is a high-level RNS regulatory statement, not a forensic
      report; ATT&CK mapping is therefore limited to the confirmed collection/exfiltration
      behaviour (T1213 Data from Information Repositories) rather than an initial-access
      technique. A fuller technical post-mortem may follow; worth a hunt-forward watch item
      for any Trisus/healthcare-billing-platform customers in the Swiss/EU health sector.

  - title: "Coca-Cola's fairlife dairy subsidiary: US production halted by a ransomware event; extortion group Anubis now claims responsibility (unconfirmed by Coca-Cola)"
