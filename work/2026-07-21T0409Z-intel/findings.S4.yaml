      - { url: "https://cyberinsider.com/coca-cola-discloses-ransomware-attack-disrupting-fairlife-production-in-the-us/", publisher: "CyberInsider", date: "2026-07-17", role: "corroborating" }
      - { url: "https://api.ransomware.live/v2/recentvictims", publisher: "Ransomware.live (leak-site claim aggregator)", date: "2026-07-20", role: "claim, unverified" }
    discovery_trace: "first seen at: WebFetch drill of bleepingcomputer.com/news/security/ listing → Estée Lauder article's outbound links surfaced a related Hugging Face piece, and separately ransomware.live's /v2/recentvictims API (fetched directly, URL https://api.ransomware.live/v2/recentvictims) listed 'Fairlife / Coca-Cola' claimed by group 'anubis' (attackdate 2026-07-20) → pivot to CyberInsider, URL https://cyberinsider.com/coca-cola-discloses-ransomware-attack-disrupting-fairlife-production-in-the-us/ (which cites Coca-Cola's own primaries) → primary: Coca-Cola's own SEC 8-K, URL https://www.sec.gov/Archives/edgar/data/21344/000162828026048466/ko-20260716.htm, and investor press release, URL https://investors.coca-colacompany.com/news-events/press-releases/detail/1166/the-coca-cola-company-announces-technology-disruption-involving-fairlife-operations"
    summary: |
      The Coca-Cola Company disclosed via SEC Form 8-K (Item 8.01) and an investor press
      release on 2026-07-16 that its wholly owned dairy subsidiary fairlife, LLC identified
      unauthorised third-party access to a portion of its systems, including
      production-related systems, in connection with a ransomware event. US fairlife
      production was temporarily suspended as a precaution (Canadian operations continued
      normally); the company states product quality and safety were not affected, has engaged
      external cybersecurity experts, notified law enforcement, and — as of the 8-K — had not
      yet determined whether the incident is reasonably likely to be material, nor whether
      customer data was exposed. As of 2026-07-20, the extortion group "Anubis" has posted a
      leak-site claim listing "Fairlife / Coca-Cola" (description: "Employee data breach at a
      major manufacturing company"), which is unconfirmed by Coca-Cola and unaccompanied by
      independent journalism at time of writing — no ransom demand or actor claim had
      surfaced as of the 2026-07-17 CyberInsider coverage. Genuinely global-scale incident (a
      Fortune-500 multinational's manufacturing operations disrupted by ransomware) with a
      transferable OT/production-line-disruption lesson for any manufacturing-adjacent CI
      operator.
