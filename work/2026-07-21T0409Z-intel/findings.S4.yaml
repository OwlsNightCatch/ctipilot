          basis: "BleepingComputer, citing CrowdStrike: \"CrowdStrike confirmed that Clop had been exploiting the flaw since early August, 2025\" — the flaw being CVE-2025-61882 in Oracle EBS, the vector named in Estée Lauder's own breach notification" }
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "On June 19, 2026, we determined through our investigation that, on or around August 9, 2025, an unauthorized third party gained access to the Oracle E-Business Suite system and obtained personal information of certain individuals."
        attribution: "The Estée Lauder Companies (breach notification letter)"
        source_url: "https://oag.ca.gov/system/files/ELC%20-%20U.S.%20Individual%20Notification%20Letter.pdf"
      - quote: "The affected information included names, postal and email addresses, dates of birth, Social Security numbers, passport numbers, financial account information (bank account numbers), health information, and employment-related information (such as performance evaluation and payroll information)."
        attribution: "The Estée Lauder Companies (breach notification letter)"
        source_url: "https://oag.ca.gov/system/files/ELC%20-%20U.S.%20Individual%20Notification%20Letter.pdf"
      - quote: "CrowdStrike confirmed that Clop had been exploiting the flaw since early August, 2025."
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/est-e-lauder-discloses-data-breach-via-oracle-e-business-flaw/"
    extended_notes: |
      Note the WebFetch tool initially hallucinated the notification-letter PDF as belonging
      to an unrelated company ("Sprinklr, Inc.", dated January 2024) when summarised via the
      standard WebFetch prompt — the raw PDF content, read directly, confirms it is in fact
      Estée Lauder's own letter dated 2026-07-17. Flagging this as an empirical WebFetch
      reliability finding for self-evolution: PDF summarisation via WebFetch should be
      spot-checked against the raw document for any load-bearing claim, not trusted blind.
      CVE-2025-61882 and the Clop Oracle EBS campaign are long-since patched/known (Oracle
      patched EBS in October 2025); this item is a new VICTIM DISCLOSURE surfacing ~11 months
      after initial exploitation, illustrating how long mass-exploitation campaigns keep
      producing fresh victim notifications — a reason to keep hunting/patch-verifying old
      EBS CVEs even long after initial disclosure.

  - title: "Hugging Face: a fully autonomous AI agent breached production infrastructure and executed 17,000+ logged actions before detection — a second real-world case (after Sygnia's AI-orchestrated AWS intrusion) of AI-driven offensive tooling in production"
    sources:
      - { url: "https://huggingface.co/blog/security-incident-july-2026", publisher: "Hugging Face (official security-incident disclosure)", date: "2026-07-16", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/hugging-face-breach-autonomous-ai-agent-system-internal-datasets-credentials/", publisher: "BleepingComputer", date: "2026-07-20", role: "corroborating" }
      - { url: "https://www.securityweek.com/hugging-face-hacked-in-autonomous-ai-attack/", publisher: "SecurityWeek", date: "2026-07-20", role: "corroborating" }
    discovery_trace: "first seen at: bleepingcomputer (source-slice id bleepingcomputer), URL https://www.bleepingcomputer.com/news/security/ (listing) → drilled article, URL https://www.bleepingcomputer.com/news/security/hugging-face-breach-autonomous-ai-agent-system-internal-datasets-credentials/ → primary: Hugging Face's own blog post, URL https://huggingface.co/blog/security-incident-july-2026 → corroboration: SecurityWeek, URL https://www.securityweek.com/hugging-face-hacked-in-autonomous-ai-attack/"
    summary: |
      Hugging Face disclosed (blog post dated 2026-07-16; broad security-press pickup on
      2026-07-20) a production intrusion driven end-to-end by an autonomous AI agent
      framework. A malicious dataset abused two code-execution vulnerabilities in Hugging
      Face's data-processing pipeline — a remote-code dataset loader and a configuration
      template-injection flaw — to execute code on a processing worker. From that foothold
      the agent escalated to node-level access, harvested cloud and cluster credentials, and
      moved laterally across internal clusters using a "swarm of short-lived sandboxes with
      self-migrating command-and-control" staged on public services, executing more than
      17,000 individually logged actions over a weekend before Hugging Face detected and
      contained it. Hugging Face found no evidence of tampering with public-facing models,
      datasets, or Spaces, and verified its software supply chain (container images,
      published packages) was clean; it does not know which model powered the attacker's
      agents. Detection relied on LLM-assisted forensic analysis (the company used GLM 5.2 to
      reconstruct the 17,000-event timeline) and surfaced what Hugging Face calls a
      "guardrail asymmetry" — commercial-model safety filters that would slow a defender's
      own analysis do not constrain an attacker's unrestricted or jailbroken agent. This is
      the second concrete, telemetry-backed case in July 2026 of AI-agent-orchestrated
      intrusion (after Sygnia's AI-assisted AWS intrusion research, already covered
      2026-07-09), reinforcing that autonomous offensive tooling is now operational, not
      theoretical.
    region_nexus: "global — Hugging Face Hub is widely used by EU/Swiss universities, research institutes and AI-development teams (education/research sector)"
    primary_sector_nexus: "indirect — public research/education sector relevance (Hugging Face Hub widely used by academic and public-sector AI/ML work), plus general technology-supplier exposure"
    sector: "technology, research and education"
    cves: []
    techniques: [T1190, T1078.004, T1102]
    affected_products: ["Hugging Face Hub dataset-processing pipeline"]
    entity_keys: []
    new_entities:
      - { key: "incident:hugging-face-autonomous-ai-agent-breach-2026-07", type: incident, name: "Hugging Face autonomous AI agent breach", aliases: [],
          summary: "An attacker used a fully autonomous AI-agent framework to exploit two code-execution vulnerabilities in Hugging Face's dataset-processing pipeline, escalating to node-level access and harvesting cloud/cluster credentials across a weekend-long, 17,000+-action campaign before detection and containment (Hugging Face official disclosure, 2026-07-16)." }
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "A malicious dataset abused two code-execution paths in our dataset processing to run code on a processing worker."
        attribution: "Hugging Face"
        source_url: "https://huggingface.co/blog/security-incident-july-2026"
      - quote: "The campaign was run by an autonomous agent framework executing many thousands of individual actions across a swarm of short-lived sandboxes, with self-migrating command-and-control."
        attribution: "Hugging Face"
        source_url: "https://huggingface.co/blog/security-incident-july-2026"
      - quote: "We do not know which model powered the attacker's agents, whether a jailbroken hosted model or an unrestricted open-weight one."
        attribution: "Hugging Face"
        source_url: "https://huggingface.co/blog/security-incident-july-2026"
      - quote: "Autonomous, AI-driven offensive tooling is no longer theoretical. It lowers the cost of running a broad, patient, multi-stage campaign."
        attribution: "Hugging Face"
        source_url: "https://huggingface.co/blog/security-incident-july-2026"
    extended_notes: |
      Included primarily on gate (b) — a materially new, evolving TTP class (fully
      autonomous, self-migrating agentic post-exploitation at machine speed/scale) directly
      transferable to how defenders should reason about detection dwell-time and
      containment-speed requirements; ties thematically to the Sygnia AI-orchestrated AWS
      intrusion (2026-07-09, already covered) and Wiz's GhostApproval AI-coding-assistant
      research (2026-07-09, already covered) — worth a cross-reference in composition if the
      brief carries a running "AI-driven offensive tooling" thread. Hugging Face's own primary
      disclosure is dated 2026-07-16 (5 days before this run's window edge), but multiple
      independent Admiralty-B outlets (BleepingComputer, SecurityWeek, Help Net Security, The
      Hacker News) only picked the story up broadly on 2026-07-20 (in-window) — treated as a
      legitimate first-appearance-in-brief case per the recency framework's "freshest
      available source" rule, not a stale rehash; no prior coverage of this incident exists
      in prior_coverage.json.

  - title: "Ostium DeFi platform loses $23.7M to off-chain price-oracle manipulation (borderline — crypto/DeFi, no CI/government nexus)"
    sources:
      - { url: "https://www.bleepingcomputer.com/news/security/hackers-steal-237-million-in-crypto-from-ostium-in-off-chain-attack/", publisher: "BleepingComputer", date: "2026-07-20", role: "primary" }
    discovery_trace: "first seen at: bleepingcomputer (source-slice id bleepingcomputer), URL https://www.bleepingcomputer.com/news/security/ (listing) → drilled article, URL https://www.bleepingcomputer.com/news/security/hackers-steal-237-million-in-crypto-from-ostium-in-off-chain-attack/ (no further pivot performed — borderline item, not chased further)"
    summary: |
      Attackers compromised off-chain infrastructure feeding price data to the Ostium
      decentralized perpetuals-trading platform on Arbitrum, submitting fraudulent price
      reports to rapidly open and close large positions and drain roughly $23.75M from the
      platform's liquidity-provider vault; trader collateral, held in a separate contract,
      was unaffected. The stolen USDC was swapped for ~12,080 ETH, with 10,540 ETH
      subsequently laundered through the Tornado Cash mixer; trading was paused within 60
      minutes of detection.
    region_nexus: "global crypto/DeFi — no Swiss/EU CI or government nexus identified"
    primary_sector_nexus: "none — DeFi/crypto trading platform, not traditional finance-sector infrastructure"
    sector: "finance (crypto/DeFi)"
    cves: []
    techniques: []
    affected_products: []
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    evidence: []
    extended_notes: |
      Off-chain price-oracle manipulation is a well-established DeFi attack class, not a
      materially new TTP; the platform is a crypto-native DeFi protocol rather than
      traditional finance-sector CI. Surfaced as borderline per calibration guidance rather
      than silently dropped — main agent's call on whether the finance-sector lens or a
      general-threat-landscape angle (oracle/off-chain-feed integrity as a transferable
      concept for any organisation relying on external price/data feeds for automated
      decisions) justifies inclusion.
    borderline: true
    borderline_reason: "Crypto/DeFi platform hack with no Swiss/EU CI or government nexus; known attack class (oracle manipulation), not a novel TTP; moderate scale ($23.7M); single-sourced (BleepingComputer only, no independent second source chased given borderline status)."

