          summary: "NativeAOT-compiled .NET DLL that Group-IB links with high confidence to the Cavern C2 framework; abuses the Microsoft Graph API to turn a compromised M365 mailbox calendar into a two-way dead-drop for tasking/exfiltration, with DNS-tunneled Entra ID credential refresh. Narrowly targets Israeli entities; observed June-July 2026 (Group-IB, 2026-07-20)." }
    relation_suggestions:
