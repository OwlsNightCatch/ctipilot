  - title: "Fake game downloads abuse the Ren'Py engine and MSBuild.exe to stage Amatera Stealer, resolving C2 via an EtherHiding blockchain lookup"
    sources:
      - { url: "https://www.malwarebytes.com/blog/threat-intel/2026/07/fake-games-spread-stealers-with-renpy-loader-msbuild-and-etherhiding", publisher: "Malwarebytes Labs", date: "2026-07-20", role: "primary" }
    discovery_trace: "first seen at: malwarebytes, URL https://www.malwarebytes.com/blog (listing) → primary: Malwarebytes Labs, URL https://www.malwarebytes.com/blog/threat-intel/2026/07/fake-games-spread-stealers-with-renpy-loader-msbuild-and-etherhiding"
    summary: |
      Malwarebytes documents a distribution vector for Amatera Stealer distinct from this pipeline's already-covered ClickFix-rooted Amatera/ACR Stealer chains: fake game downloads hosted on lookalike sites, itch.io pages and file-sharing services. The loader ("RenPy Loader" / "RenEngine Loader") abuses Ren'Py, a legitimate open-source visual-novel engine, to decrypt a bundled ZIP containing a batch script and MSBuild project files; execution proceeds via MSBuild.exe (T1127.001, a signed Microsoft build tool) loading a trojanized copy of the legitimate Nancy .NET library, which runs a custom 23-opcode bytecode interpreter to decrypt further stages (multi-key XOR, Base64/hex chains). The chain manipulates Zone.Identifier NTFS alternate-data-stream attributes to suppress SmartScreen warnings and disables TLS certificate validation via registry modification. For C2 resolution the malware performs an Ethereum JSON-RPC eth_call against a Binance Smart Chain public node, reading an encrypted C2 address from smart-contract storage (EtherHiding) — a dead-drop-resolver technique this pipeline has already documented in the Amatera/ACR-Stealer and Sandworm/UAC-0145 ClickFix chains, here reused for a completely different (game-piracy) delivery front. Final payload is Amatera Stealer, harvesting browser credentials, cryptocurrency wallets and messaging-app data.
    region_nexus: "global; opportunistic, not region-targeted"
    primary_sector_nexus: "indirect"
    sector: "general"
    cves: []
    techniques: ["T1189", "T1127.001", "T1027", "T1102.001"]
    affected_products: []
    entity_keys: ["tool:amatera"]
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "RenPy Loader, also known as RenEngine Loader, is particularly interesting because it abuses Ren'Py, a legitimate engine used to create visual novels."
        attribution: "Malwarebytes Labs"
