      Detection concept (Graph API audit telemetry, not IOCs): alert on Microsoft 365 mailbox audit / Graph API activity showing calendar-event creation, attachment upload and subject-rename performed by an application/service-principal identity rather than the interactive mailbox owner, especially where the event's scheduled date is anomalously far in the future. This is the second independent-lab report in under two weeks building out the Cavern-framework picture (Check Point 2026-07-06 named the actor Cavern Manticore and profiled the C2 itself; Group-IB 2026-07-20 profiles a new component without confirming the same actor) — worth flagging to the composer as a fast-evolving cluster to keep threading together across entries.

  - title: "Researcher chains a WordPress pre-auth RCE end-to-end using GPT5.6 in ~10 hours for ~$25 — a capability marker for AI-accelerated exploit development"
    sources:
      - { url: "https://slcyber.io/research-center/exploit-brokers-pay-500000-for-a-wordpress-rce-i-found-one-with-gpt5-6/", publisher: "Searchlight Cyber", date: "2026-07-20", role: "primary" }
      - { url: "https://www.infosecurity-magazine.com/news/researchers-wordpress-exploit/", publisher: "Infosecurity Magazine", date: "2026-07-20", role: "corroborating" }
    discovery_trace: "first seen at: infosec-magazine, URL https://www.infosecurity-magazine.com/rss/news/ (RSS listing) → primary: Searchlight Cyber, URL https://slcyber.io/research-center/exploit-brokers-pay-500000-for-a-wordpress-rce-i-found-one-with-gpt5-6/"
    summary: |
      Searchlight Cyber researcher Adam Kues tasked OpenAI's GPT5.6 "Sol Ultra" model — running autonomously for up to 10 hours per session — to independently rediscover and weaponize the already-disclosed WordPress core pre-authentication RCE chain "WP2Shell" (CVE-2026-63030, a REST API batch-endpoint route-confusion/validation-desync bug, CVSS 9.8, chained with CVE-2026-60137, a SQL injection in WP_Query's author__not_in parameter, CVSS 5.9 — both already patched out-of-band in WordPress 7.0.2 on 2026-07-17 and already tracked by this pipeline as a public-PoC item pending exploitation). Without human guidance beyond the initial task, the model recursively chained batch API requests to bypass method validation, poisoned the request cache with fabricated posts, abused the oEmbed subsystem to create arbitrary database rows, exploited cycle-detection logic in WordPress's changeset handling, and weaponized the parse_request hook to replay a request with elevated administrator context — ultimately creating an unauthorized admin account on a stock install with no plugins. Total cost: roughly $25 (about half of one weekly $200 subscription allotment), against a stated underground/broker market rate near $500,000 for a WordPress-core RCE of this class. The technical substance (the CVEs, patch state, PoC availability) is unchanged from this pipeline's 2026-07-18 coverage; the new fact is the capability demonstration itself — full pre-auth exploit-chain discovery and weaponization completed autonomously in hours rather than the weeks-to-months a skilled human researcher would need.
    region_nexus: "global; WordPress core is deployed across CH/EU public-sector and SME web estates"
    primary_sector_nexus: "indirect"
