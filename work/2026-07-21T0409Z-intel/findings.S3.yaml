  - title: "Cruciferra: a $450-$2,000/month crypter-as-a-service using kernel-patched process ghosting and BYOVD EDR termination, tied to China-nexus TA4922"
    sources:
      - { url: "https://www.proofpoint.com/us/blog/threat-insight/unpacking-cruciferra-analysis-sophisticated-crypter-service", publisher: "Proofpoint Threat Insight", date: "2026-07-20", role: "primary" }
      - { url: "https://www.infosecurity-magazine.com/news/cruciferra-crypter-process-ghosting/", publisher: "Infosecurity Magazine", date: "2026-07-20", role: "corroborating" }
    discovery_trace: "first seen at: infosec-magazine, URL https://www.infosecurity-magazine.com/rss/news/ (RSS listing) → primary: Proofpoint Threat Insight, URL https://www.proofpoint.com/us/blog/threat-insight/unpacking-cruciferra-analysis-sophisticated-crypter-service"
    summary: |
      Proofpoint documented Cruciferra, a Mono/.NET-based crypter-as-a-service advertised on underground forums since fall 2025 at $450-$2,000/month, used across multiple unrelated cybercriminal groups to pack commodity RATs and infostealers (AsyncRAT/DCRAT, Agent Tesla, XWorm, zgRAT, Formbook/XLoader, PhantomStealer, Remcos, Snake Keylogger). Payloads are encrypted with 90+ polymorphic cipher routines dynamically assembled from Keccak, Feistel, SPECK and Threefish primitives and stored Base16-encoded in the PE's .reloc section — no two samples share an identical routine. Execution uses a modified process-ghosting technique: a temporary file is marked for deletion via NtSetInformationFile, mapped as a PE image section (SEC_IMAGE) before the delete completes via NtCreateSection/NtMapViewOfSection, leaving a running process whose backing image is never scannable on disk; Cruciferra additionally patches ZwQueryVirtualMemory to sanitize what EDR memory queries see and neuters NtManageHotPatch to defeat kernel image-integrity validation. For EDR/AV termination it loads a legitimate-but-vulnerable signed driver (GoFlyDrv.sys, among several alternates) and issues DeviceIOControl IOCTLs to kill security processes (BYOVD). Additional evasion: IAT patching plus indirect syscalls sourced from a clean ntdll.dll copy, hundreds of decoy DLL exports, and background EnumWindows polling to suppress console-window visibility. Proofpoint attributes dozens of April-June 2026 campaigns to TA4922 (a China-nexus financially motivated cluster already tracked by this pipeline), using tax-authority and SSA-themed lures against financial services (34%), healthcare (25%) and government (10%) targets.
    region_nexus: "global; sector mix (finance/healthcare/government) is directly relevant to CH/EU public-sector and CI targeting"
    primary_sector_nexus: "direct"
    sector: "finance, healthcare, public-sector"
    cves: []
    techniques: ["T1055", "T1685", "T1027"]
    affected_products: []
    entity_keys: ["actor:ta4922"]
    new_entities:
