    extended_notes: |
      Detection angle for hunt teams: query for processes whose backing PE section maps to a since-deleted temp file (classic ghosting signature), unusual EnumWindows-polling threads targeting "ConsoleWindowClass", and driver-load events for GoFlyDrv.sys / Core64.sys / HwOs2Ec.sys / LnvMSRIO.sys / MemoryInformer.sys / NTIOLib_X64.sys / ProcessMonitorDriver.sys / selfprot.sys outside expected vendor contexts (BYOVD hunt list, not full IOCs).

  - title: "HOLLOWGRAPH: a new Cavern-framework component turns a compromised Microsoft 365 calendar into a two-way dead-drop C2 channel via the Graph API"
    sources:
      - { url: "https://www.group-ib.com/blog/hollowgraph-microsoft-365/", publisher: "Group-IB Threat Intelligence", date: "2026-07-20", role: "primary" }
      - { url: "https://www.infosecurity-magazine.com/news/hollowgraph-microsoft-calendars/", publisher: "Infosecurity Magazine", date: "2026-07-20", role: "corroborating" }
    discovery_trace: "first seen at: infosec-magazine, URL https://www.infosecurity-magazine.com/rss/news/ (RSS listing) → primary: Group-IB Threat Intelligence, URL https://www.group-ib.com/blog/hollowgraph-microsoft-365/"
    summary: |
      Group-IB identified HOLLOWGRAPH, a .NET NativeAOT-compiled DLL that Group-IB links "with high confidence" to the modular Cavern C2 framework previously profiled by Check Point Research as used by the Iran-MOIS-linked Cavern Manticore APT (2026-07-06). HOLLOWGRAPH implements only two commands (get/send) and never contacts attacker-owned infrastructure directly: instead it treats a compromised Microsoft 365 mailbox's calendar as a two-way dead-drop over the Microsoft Graph API. The "send" command encrypts stolen files (hybrid RSA-OAEP + AES-256-GCM, separate key pairs per direction) and uploads them as attachments to a newly created calendar event dated far in the future (13 May 2050) to avoid the mailbox owner's notice, then renames the event subject to an operator-recognizable tag; "get" queries the same calendarView window for operator-planted tasking events and decrypts the attached instructions. A second, unencrypted channel refreshes the four Microsoft Entra ID (Azure AD) credentials the implant needs (tenant ID, client ID, client secret, mailbox) via DNS tunneling: length- and data-encoded queries against an attacker domain resolved as IPv6 AAAA records, reassembled into 14-usable-bytes-per-query chunks. The attribution to Cavern rests on matching invocation syntax (<command>_;;_<arg0>_,_<arg1>_,_<arg2>), a matching self-command code (Base64 "MzU=" decoding to "003", a documented Cavern debug-toggle instruction) and identical C2 tasking JSON structure. Group-IB explicitly states it cannot confidently attribute HOLLOWGRAPH to any previously named actor, but assesses — at low confidence — technical overlap with the Iranian-nexus Lyceum sub-group of OilRig (matching modular-plugin architecture and plugin-naming convention against a 2025 Lyceum .NET backdoor sample). Victimology is narrowly scoped: 12 infected systems identified, only ~3 actively communicating, all evidence (compromised exfil mailbox, malware upload origin) pointing to Israeli organizations, active since at least 3 June 2026.
    region_nexus: "Israel-focused per current telemetry; the Cavern-framework and Graph-API-as-C2 technique is directly transferable to any Microsoft 365 tenant, including CH/EU public-sector"
    primary_sector_nexus: "indirect"
    sector: "public-sector, IT-services"
    cves: []
    techniques: ["T1102.002", "T1071.004", "T1027"]
    affected_products: ["Microsoft 365", "Microsoft Graph API", "Microsoft Entra ID"]
