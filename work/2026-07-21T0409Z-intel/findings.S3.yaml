  - title: "JADEPUFFER returns with ENCFORGE, a purpose-built ransomware that destroys AI/ML model artifacts instead of just extorting data"
    sources:
      - { url: "https://www.sysdig.com/blog/jadepuffer-evolves-the-agentic-threat-actor-deploys-ransomware-built-to-destroy-ai-models", publisher: "Sysdig Threat Research Team", date: "2026-07-20", role: "primary" }
      - { url: "https://www.infosecurity-magazine.com/news/jadepuffer-ai-model-ransomware/", publisher: "Infosecurity Magazine", date: "2026-07-20", role: "corroborating" }
    discovery_trace: "first seen at: infosec-magazine, URL https://www.infosecurity-magazine.com/rss/news/ (RSS listing) → primary: Sysdig Threat Research Team, URL https://www.sysdig.com/blog/jadepuffer-evolves-the-agentic-threat-actor-deploys-ransomware-built-to-destroy-ai-models"
    summary: |
      Sysdig's Threat Research Team reports that JADEPUFFER — the agentic-LLM ransomware operator it first documented on 2026-07-01 exploiting Langflow's missing-authentication flaw CVE-2025-3248 (/api/v1/validate/code, unauthenticated arbitrary Python execution) — returned to the same Langflow instance with a materially upgraded payload. Where the original campaign used improvised Python and MySQL's AES_ENCRYPT() to extort a downstream database, the new intrusion stages ENCFORGE (deployed to disk as "lockd"), a compiled, UPX-packed Go ransomware purpose-built for AI/ML infrastructure. ENCFORGE targets roughly 180 file extensions spanning the modern ML stack: model checkpoints (PyTorch, TensorFlow), HuggingFace SafeTensors weights, llama.cpp GGUF quantized models, FAISS vector indices, Apache Parquet/TFRecord training datasets, NumPy arrays and LoRA adapters, encrypting with AES-256-CTR/RSA-2048. Sysdig notes the extortion contact embedded in ENCFORGE matches the address disclosed in the July 1 report, confirming continuity of the same operator rather than a copycat. The operational significance for defenders: unlike conventional ransomware, encrypted model checkpoints and their training data cannot simply be restored from a vendor patch or decryptor — rebuilding a production fine-tuned model requires re-running weeks-to-months of training at $75,000–$500,000 in compute/engineering cost per model, and if the training data sits on the same compromised host, recovery is blocked until the data itself is reconstructed. Sysdig's post-exploitation reconstruction (Phase 1: credential sweep via cloud keys, DB connection strings, API tokens; internal-service probing via /dev/tcp) documents continued autonomous chaining behaviour consistent with the original agentic-operation assessment.
    region_nexus: "global; any organization self-hosting Langflow (incl. EU/CH public-sector and research AI pipelines) is at risk"
    primary_sector_nexus: "indirect"
