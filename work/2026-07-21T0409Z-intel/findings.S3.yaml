          summary: "Mono/.NET-based commercial crypter-as-a-service ($450-$2,000/month) using 90+ polymorphic cipher routines, modified process ghosting, IAT/syscall unhooking and BYOVD (GoFlyDrv.sys and alternates) to pack commodity RATs/infostealers; Proofpoint attributes multiple April-June 2026 campaigns to China-nexus TA4922 (Proofpoint, 2026-07-20)." }
    relation_suggestions:
