  - title: "Anubis ransomware intrusion with a new custom backdoor (Backdoor.Lindnor) on two SQL Servers, 13 security-killer executables and five vulnerable drivers in an hour, and AnyDesk set to start in Safe Mode; encryption was blocked (Symantec)"
    sources:
      - { url: "https://www.security.com/threat-intelligence/lindnor-new-backdoor-anubis-ransomware", publisher: "Symantec / Carbon Black Threat Hunter Team", date: "2026-11-05", role: "primary" }
    discovery_trace: "first seen at: symantec-security-com, URL https://www.security.com/threat-intelligence (listing fetched on the bridge: five links; drilled each with extract, then WebFetch of the listing confirmed the newest post is dated 5 Nov 2026) → primary (no pivot needed): https://www.security.com/threat-intelligence/lindnor-new-backdoor-anubis-ransomware; WebSearch (\"Lindnor backdoor Anubis ransomware Symantec BYOVD AnyDesk Safe Mode\") found only a Russian-language rewrite (securitylab.ru), not an independent source, so it is not cited."
    summary: |
      Symantec's Threat Hunter Team describes an October 2026 intrusion at a U.S. organisation in which affiliates of the Anubis ransomware-as-a-service (developed by a group Symantec tracks as Hawkmoth, a rebrand of Sphinx since December 2024) used a previously undocumented custom backdoor, Backdoor.Lindnor, found only on the two Microsoft SQL Server machines among the affected hosts; it masqueraded as a Chrome component unpacker folder on one and a VMware folder on the other, apparently ran as a service, beaconed host, user, domain and logon-server details over port 443 to a primary and a fallback server, and was also seen at two unrelated organisations where no ransomware activity followed. Within roughly an hour the attackers dropped at least 13 executables to kill security services, eleven of them previously unpublished, plus five publicly known signed vulnerable drivers (bring-your-own-vulnerable-driver); two executables posing as Symantec software could list kernel callbacks through a loaded vulnerable driver and list-and-remove them, and the removal switch was used. They installed AnyDesk, created a local user and added it to a local group, and ran a tool that registers AnyDesk under the SafeBoot Network registry key so it keeps working in Safe Mode with Networking, where security software generally does not fully run. Symantec did not identify initial access; the Anubis encryption payload (optional wiper mode that empties files) was blocked and there is no evidence any file was encrypted. Symantec assesses that few ransomware operators build their own backdoors and that the volume of security-disabling tools in a single hour is unusual, and notes Anubis has claimed about 96 victims in 12 months, 52 percent in the U.S.
    region_nexus: "U.S.-centred targeting; no Swiss or European nexus reported; tradecraft transferable to any Windows server estate"
