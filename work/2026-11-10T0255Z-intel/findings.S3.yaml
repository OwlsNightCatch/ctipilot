  - title: "AhsayCBS intrusions after exploitation: Huntress dissects five webshell families (including a PNG-steganography in-memory loader and a signed-API shell with 4 GB chunked download), a second miner, an environment-keyed Python implant and a Veeam credential query on servers exploited 8 to 11 October"
    sources:
      - { url: "https://www.huntress.com/blog/ahsaycbs-webshells", publisher: "Huntress", date: "2026-11-09", role: "primary" }
    discovery_trace: "first seen at: huntress, URL https://www.huntress.com/blog/rss.xml (feed item 2026-11-09T14:00Z) → primary (no pivot needed): https://www.huntress.com/blog/ahsaycbs-webshells; prior coverage match: entries/2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig.md (last updated 2026-10-16), which cites only Huntress's first post (https://www.huntress.com/blog/ahsaycbs-flaws-exploit); WebSearch (\"Huntress AhsayCBS webshells steganography PNG JSP implant backup server follow-up\") found no independent second source for the follow-up."
    summary: |
      Huntress's follow-up on the AhsayCBS exploitation covers an intrusion at one organisation whose servers were exploited between 8 and 11 October 2026, before Ahsay shipped its hotfixes (Huntress verified that 10.3.4.45 blocks the entry point it saw), and ties it to the first campaign by webshell location inside AhsayCBS web directories, an exploit source address matching the first post and files matching its indicators. The operator planted five JSP webshell families under the console's web application directories (cbs and rps) and, because the exploit tried every likely install path, also in Linux-style and decoy directories; one family hides an AES-encrypted Java class in the least-significant bits of an uploaded PNG's pixels, loads it in memory through a custom class loader and answers with image-looking traffic, so no command parameter appears in access logs; another is a signed-API shell (token, timestamp, nonce, HMAC) with command execution and chunked upload and download up to 4 GB per file, a ready exfiltration channel on a backup host; a third family can delete itself and any path it is given, so a missing file does not prove absence. Other findings: a second XMRig miner kept alive by a SYSTEM scheduled task with a backdated start time that relaunches it every minute; an embedded Python install under the SYSTEM profile started from a Run key, whose wrapper only runs if a marker file named for the SHA-256 of the host's MachineGuid exists, then reflectively loads an unidentified C++ DLL whose strings are consistent with DNS-over-HTTPS lookups through public resolvers; tunnelling tools (gost, chisel), three remote-access tools (AnyDesk, Atera, Splashtop), a rogue local account, Mimikatz on disk and Microsoft Defender exclusions that include the AhsayCBS service process; and, on a Veeam server in the same environment, a WMI-launched PowerShell command Huntress calls consistent with NetExec's Veeam credential-theft module (query of the VeeamBackup PostgreSQL database and DPAPI decryption). Huntress says it did not see download actions used and cannot say what was taken, has not identified the implant family, and recommends, for any server exposed before the hotfix, a full re-image from a trusted backup and rotation of credentials stored on or reachable from the server, including those held in AhsayCBS and other backup software on the network.
    region_nexus: "global"
    primary_sector_nexus: "indirect: backup-management console used by managed service providers and system integrators; relevant to public-sector entities whose backup or IT provider runs AhsayCBS"
    sector: "technology"
    cves: [CVE-2026-105133, CVE-2026-105134]
    techniques: [T1190, T1505.003, T1059.003, T1059.006, T1053.005, T1547.001, T1685, T1027.003, T1620, T1480.001, T1555, T1071.001, T1572, T1219, T1496.001, T1136.001]
    affected_products: ["Ahsay AhsayCBS", "Veeam Backup & Replication"]
    entity_keys: ["product:ahsay-ahsaycbs"]
    new_entities: []
    verification: SINGLE-SOURCE-OTHER
    confidence: HIGH
    novelty: "update-of:2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig"
    classification_suggestion: { reliability: B, credibility: 2 }
    note_on_atlas: "Huntress's own ATT&CK table cites T1562.001, which is revoked in the pinned ATT&CK v20.1; the active successor used above is T1685. Veeam point is a Huntress-assessed 'consistent with' reading, not a confirmed tool."
    evidence:
      - quote: "The impacted organization's servers in this post were exploited between October 8 and October 11, 2026, which was before Ahsay released its hotfixes."
        attribution: "Huntress"
        source_url: "https://www.huntress.com/blog/ahsaycbs-webshells"
      - quote: "When organizations apply hotfixes, it mitigates the issue moving forward, but if a compromise has already happened it does not remove files an actor has already planted."
        attribution: "Huntress"
        source_url: "https://www.huntress.com/blog/ahsaycbs-webshells"
      - quote: "the shell can delete itself after use, so not finding the file on disk does not prove it was never present."
        attribution: "Huntress"
        source_url: "https://www.huntress.com/blog/ahsaycbs-webshells"
      - quote: "we recommend a full re-image from a trusted backup and rotating credentials stored on or reachable from the server"
        attribution: "Huntress"
        source_url: "https://www.huntress.com/blog/ahsaycbs-webshells"
    extended_notes: |
      Delta over the existing entry (which stops at the first Huntress wave: webshells, an Edge-themed miner, Defender-hiding script): five webshell families incl. the steganographic loader and signed-API shell; second miner with minute-by-minute SYSTEM task; environment-keyed Python implant with reflective DLL and DoH; Veeam credential query = backup infrastructure targeted on purpose; self-deleting shell caveat; re-image-and-rotate recommendation.
      Detection (Huntress): new .jsp files created under the AhsayCBS web directories; requests to the UpdateReceivers.do endpoint in AhsayCBS access logs; the cbssvcX64.exe -> command-shell parent-child pattern; python.exe/pythonw.exe running from a path under the SYSTEM profile; outbound requests to public DNS-over-HTTPS resolvers from a non-browser process; SYSTEM scheduled task with a one-minute repeat that tests for a process with tasklist; Defender exclusions nobody added (system paths and the AhsayCBS service process); folders named ahsay_*, or home/opt/srv/usr at a drive root on a Windows host. Behavioural only, no indicators carried.
      Exposure: only servers reachable before the hotfix; Huntress verified 10.3.4.45 blocks the entry point it saw; the original entry notes the hotfixes are partner-portal only.
      Not in the entry's current text: hardening angle that backup consoles must not be internet-reachable is implied but not stated by Huntress; do not add it as a source claim.

