  - title: "BluePhishing: Proofpoint's proof of concept turns a consent link for a third-party Entra agent blueprint into tenant initial access, with an unrevocable agent-creation permission and inherited permissions that the portal and Graph do not show"
    sources:
      - { url: "https://www.proofpoint.com/us/blog/threat-insight/BluePhishing-Initial-Access-via-Third-Party-Agent-Blueprint-Consent", publisher: "Proofpoint", date: "2026-11-09", role: "primary" }
      - { url: "https://securitylabs.datadoghq.com/articles/agent-id-inside-agent-compromise/", publisher: "Datadog Security Labs", date: "2026-06-18", role: "background" }
    discovery_trace: "first seen at: proofpoint, URL https://www.proofpoint.com/us/threat-insight-blog.xml (feed item 2026-11-09T17:39Z; extract metadata shows 2026-11-07, WebFetch of the page shows byline date 'November 09, 2026') → primary (no pivot needed): https://www.proofpoint.com/us/blog/threat-insight/BluePhishing-Initial-Access-via-Third-Party-Agent-Blueprint-Consent → WebSearch (\"security researchers disclose attack technique government agencies Microsoft 365 OAuth consent Entra agent identity blueprint phishing\") → related, different attack path: Datadog Security Labs, URL https://securitylabs.datadoghq.com/articles/agent-id-inside-agent-compromise/. The store already carries Red Canary's Entra Agent ID items (2026-05-30/red-canary-detecting-entra-agent-id-privilege-escalation-cre, 2026-06-10/red-canary-microsoft-entra-agent-id-abuse-obo-oauth-flow-tur)."
    summary: |
      Proofpoint researcher Rachel Rabin presents BluePhishing, a research proof of concept that extends OAuth consent phishing to Microsoft Entra Agent ID: the attacker builds an agent blueprint (the agent analogue of an app registration) in their own tenant with a client secret, requiredResourceAccess and inheritable permissions, sets its sign-in audience to multi-tenant (a setting the Entra portal does not expose; it needs Graph, PowerShell or a manifest edit), and sends a one-time consent link of the form login.microsoftonline.com/{tenant}/v2.0/adminconsent with the .default scope. When the victim consents, a blueprint principal appears in the victim tenant and is automatically given the AgentIdentity.CreateAsManager application permission, which Proofpoint says cannot be revoked from the principal; the attacker then requests a client-credentials Graph token against the victim tenant, creates agent identities (up to 250 per blueprint) that inherit the consented permissions, and obtains tokens for them using only the blueprint credential held in the attacker's tenant, so there is no interactive sign-in and no MFA step. Creation needs two non-secret values, the victim tenant ID and the object ID of a sponsor user, both obtainable with documented unauthenticated lookups (the OpenID configuration endpoint and the GetCredentialType user-enumeration endpoint). Proofpoint's tests used User.Read.All and Group.Read.All with GraphRunner; admin consent lets application permissions apply tenant-wide, while user consent yields delegated permissions, which inherit silently. Proofpoint stresses that it has not identified any in-the-wild activity, that inherited permissions are not visible in the Entra portal or Microsoft Graph (only in token contents at runtime), that agent consent controls are less mature than app-consent controls, and that Microsoft 365 Message Center item MC1506733 says default Entra users will be able to create agent blueprints by default from November 2026; Microsoft was notified before publication and the post gives no fix status. Datadog Security Labs showed in June 2026 a related cross-tenant path in which a compromised third-party blueprint credential gives control of agents built from it in other tenants.
    region_nexus: "global; Microsoft 365 / Entra tenants, including Swiss public-sector tenants"
    primary_sector_nexus: "direct technology exposure: Entra ID/Microsoft 365 is the identity platform of the public sector; no targeting of the sector reported"
    sector: "technology"
    cves: []
    techniques: [T1566.002, T1528, T1550.001, T1078.004, T1136.003, T1087.004]
    affected_products: ["Microsoft Entra ID", "Microsoft Entra Agent ID"]
    entity_keys: ["product:microsoft-entra-id"]
    new_entities:
      - { key: "trend:entra-agent-blueprint-consent-phishing-bluephishing", type: trend, name: "BluePhishing: Entra agent-blueprint consent phishing", aliases: ["BluePhishing"], summary: "Proofpoint's 2026-11-09 proof of concept for initial access to an Entra tenant by phishing consent to a third-party agent blueprint; no in-the-wild activity identified (Proofpoint)." }
      - { key: "product:microsoft-entra-agent-id", type: product, name: "Microsoft Entra Agent ID", aliases: ["Entra Agent Identity"], summary: "Microsoft Entra framework that extends Entra to AI agents via agent blueprints, blueprint principals and agent identities (Proofpoint, Datadog Security Labs)." }
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    classification_suggestion: { reliability: B, credibility: 2 }
    priority_suggestion: "notable; research PoC with no ITW; becomes actionable with the November 2026 default-create change. Related prior entries to reference: 2026-05-30/red-canary-detecting-entra-agent-id-privilege-escalation-cre and 2026-06-10/red-canary-microsoft-entra-agent-id-abuse-obo-oauth-flow-tur."
    evidence:
      - quote: "Proofpoint has not as of yet identified any in-the-wild activity"
        attribution: "Proofpoint"
        source_url: "https://www.proofpoint.com/us/blog/threat-insight/BluePhishing-Initial-Access-via-Third-Party-Agent-Blueprint-Consent"
      - quote: "The blueprint principal is automatically assigned the AgentIdentity.CreateAsManager application permission."
        attribution: "Proofpoint"
        source_url: "https://www.proofpoint.com/us/blog/threat-insight/BluePhishing-Initial-Access-via-Third-Party-Agent-Blueprint-Consent"
      - quote: "default Microsoft Entra users will be able to create agent blueprints by default from November 2026"
        attribution: "Proofpoint"
        source_url: "https://www.proofpoint.com/us/blog/threat-insight/BluePhishing-Initial-Access-via-Third-Party-Agent-Blueprint-Consent"
      - quote: "The agent blueprint ID is consistent across all tenants that consent to it, providing a common indicator to detect or remove known malicious agents."
        attribution: "Proofpoint"
        source_url: "https://www.proofpoint.com/us/blog/threat-insight/BluePhishing-Initial-Access-via-Third-Party-Agent-Blueprint-Consent"
    extended_notes: |
      Exposure: any Entra tenant that lets users or admins consent to third-party applications and agents; Proofpoint says user-consent settings and permission classifications extend to agent blueprints and agent identities, so the existing user-consent policy is the first thing to check (Entra admin centre: Enterprise applications > Consent and permissions).
      Detection (Proofpoint): Entra audit-log operations for blueprint and agent events, the same way app-consent operations are watched: "Create an agent identity blueprint -> Add application" and "Create an agent identity -> Add service principal"; the blueprint ID is identical in every tenant that consents, so a known-bad blueprint ID is a tenant-wide hunt or removal key; also Conditional Access policies for agents and Entra ID Protection for agents (Microsoft documentation linked by Proofpoint). Token-level inspection is needed because inherited permissions are not shown in the portal or Graph.
      Triage hint (mechanical from the mechanism): a legitimate first-party or in-house agent blueprint is created in the organisation's own tenant, whereas BluePhishing produces a blueprint principal for a blueprint homed in another tenant, with a sponsor chosen from the victim's users and permissions arriving through a consent event; an agent identity created by a service principal rather than by an administrator or a registered creation channel deserves review. This is inference from the stated mechanism, not a Proofpoint statement.
      Post-compromise check: consent to the blueprint creates a principal whose creation permission cannot be revoked from that principal (Proofpoint); removal means deleting the blueprint principal and the agent identities created from it, then reviewing what the inherited permissions allowed (User.Read.All / Group.Read.All in the PoC, plus whatever the consent granted).
      Date note: the extract metadata of the Proofpoint page shows 2026-11-07, the RSS item and the page byline show 2026-11-09; the 2026-11-09 byline is used.

