        attribution: "Field Effect"
        source_url: "https://fieldeffect.com/blog/n-central-offline-alleged-zero-days"
    extended_notes: |
      Exposure: N-central hosted and on-premises, all three N-able regions per N-able's notice (via Censys). Censys's platform query for N-central web consoles returned 1,728 hosts on 2026-11-09 (Censys advisory). Field Effect: several published proofs of concept describe unauthenticated paths, so network reachability of the management interface is the prerequisite to remove; restrict the console to dedicated administration networks.
      Detection (telemetry classes, from Huntress/Field Effect): N-central authentication and audit logs (new technician/administrator accounts, privilege and configuration changes, credential or API-integration changes); downstream process-creation and script-execution events on managed endpoints whose parent is the RMM agent (software deployments, scripts, remote-control sessions, automation-policy changes) in the period before the servers went offline; Huntress's post-exploitation lesson from the September zero-day was unauthorised scripts and tools "sprayed" into customer environments.
      Post-patch compromise check: a hotfix will not remove accounts, scripts or changed automation policies planted before it; rotate N-central administrator, service and integration credentials where activity looks unauthorised (Field Effect); review which privileged credentials N-central stores.
      Caveats to carry: count (33) is the researcher's; Cyber Security News/Censys stress it is not a vendor-validated list; BleepingComputer (per a search snippet, not fetched) also said it had not verified every claim. Do not conflate with the August/September hotfixes (different CVEs). The entry should state that N-able's own incident notice could not be read (JS-only status page) and rests on three independent secondary readings.
