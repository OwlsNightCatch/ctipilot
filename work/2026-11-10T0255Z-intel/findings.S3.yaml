      - quote: "Within roughly an hour, the attackers dropped at least 13 executables to help terminate security services, along with five publicly known vulnerable drivers."
        attribution: "Symantec"
        source_url: "https://www.security.com/threat-intelligence/lindnor-new-backdoor-anubis-ransomware"
      - quote: "We did not identify how the attackers gained initial access."
        attribution: "Symantec"
        source_url: "https://www.security.com/threat-intelligence/lindnor-new-backdoor-anubis-ransomware"
      - quote: "The file encryption payload was blocked from execution"
        attribution: "Symantec"
        source_url: "https://www.security.com/threat-intelligence/lindnor-new-backdoor-anubis-ransomware"
    extended_notes: |
      Detection (telemetry classes): process-creation and service-installation events for new services whose binary sits in a folder imitating a browser-component or hypervisor-tools directory on a database server; driver-load events for signed but known-vulnerable drivers followed by security-process termination; registry-modification events under HKLM\SYSTEM\CurrentControlSet\Control\SafeBoot\Network for a remote-access tool registered as a service (Symantec quotes the reg.exe add command); creation of a local user added to a local group alongside a new remote-access tool; EDR tamper alerts on kernel-callback removal.
      Triage: AnyDesk is legitimate software in many estates; the discriminators Symantec's description supports are an installation on a server that is not an IT-managed AnyDesk host, a Safe Mode with Networking registration (rarely legitimate), and the same host showing security-tool termination in the same hour.
      Defender takeaway candidate: driver blocklist enforcement (Microsoft vulnerable driver blocklist / HVCI) removes the BYOVD step; Symantec points to its June 2026 whitepaper "Lights Out: Defense Evasion in the Age of BYOVD" for the trend (not fetched). The HVCI/blocklist lever is general knowledge, not a Symantec statement in this post; do not attribute it to Symantec.
      Registry note: actor:anubis-raas exists (GuidePoint and Microsoft Storm-2570 entries); Anubis here is the ransomware family, not the unrelated Android banking trojan or FIN7's Python backdoor of the same name.

  # ------------------------------------------------------------------ 5
  - title: "Residential-proxy exit nodes inside the White House network: Layer3 Intel's observatory and Krebs show how proxy SDKs on staff devices rent out government egress, with 28 public services exiting through one agency network in 30 days"
    sources:
      - { url: "https://layer3intel.com/blog/residential-proxies-white-house-network", publisher: "Layer3 Intel", date: "2026-11-04", role: "primary" }
      - { url: "https://krebsonsecurity.com/2026/11/want-to-rent-an-internet-address-at-the-white-house/", publisher: "Krebs on Security", date: "2026-11-05", role: "corroborating" }
    discovery_trace: "first seen at: krebs, URL https://krebsonsecurity.com/feed/ (feed item 2026-11-05T04:36Z; extract metadata date 2026-11-04) → primary: Layer3 Intel, URL https://layer3intel.com/blog/residential-proxies-white-house-network (linked from the Krebs article)"
    summary: |
      Layer3 Intel reports that its new Residential Proxy Observatory, which enumerates exit addresses by buying access to public residential-proxy services, saw its probes exit through the Executive Office of the President network (AS2650) 236 times between 5 October and 3 November 2026, from six addresses on 26 of 30 days, and that 28 separate residential-proxy services could exit through it; Spur and Synthient independently list the addresses as proxy exits. Layer3 notes the exits cluster in the evening Eastern time, which it reads as a person's device carrying a proxy SDK rather than guest Wi-Fi, while stating that its data shows exits, not the device or person. Synthient told Krebs on Security that the activity was tied to multiple Windows 11 installations of the Infatica proxy service, which Krebs reports was founded by a Russian whose hosting firm King Servers hosted six of the eight addresses used by Russia's state security services to compromise election-system databases in Arizona and Illinois in 2016. Krebs adds context relevant to any public-sector network: such SDKs ship inside free desktop and mobile applications, Spur found residential proxies in nearly 300 government-owned and operated networks (January 2026 webinar), Infoblox found 65 percent of its customers query one or more proxy-related domains, and in January 2026 dozens of proxy services had to patch after Synthient showed criminals abusing a flaw in them to reach devices inside the local networks of the users hosting the proxy; Layer3 draws the conclusion that if an SDK on a government network had such a flaw, anyone buying proxy access could reach internal systems. The White House had not responded to Krebs at publication.
    region_nexus: "U.S. federal government as the example; the exposure class (proxy SDKs on staff devices) is global"
    primary_sector_nexus: "direct awareness for public-sector networks: government endpoints and BYOD acting as proxy exits"
    sector: "government"
    cves: []
    techniques: [T1090]
    affected_products: []
    entity_keys: []
    new_entities:
      - { key: "trend:residential-proxy-exits-in-government-networks-2026", type: trend, name: "Residential-proxy exits in government networks", aliases: [], summary: "Layer3 Intel (2026-11-04) and Krebs on Security (2026-11-05): residential-proxy services exiting through the Executive Office of the President network; Spur counts proxies in nearly 300 government networks." }
      - { key: "tool:infatica", type: tool, name: "Infatica (residential proxy service)", aliases: [], summary: "Residential-proxy provider that Synthient, per Krebs on Security (2026-11-05), tied to Windows 11 installations exiting through White House address space; commonly bundled as an SDK in free applications." }
    relation_suggestions:
      - { subject: "tool:infatica", object: "trend:residential-proxy-exits-in-government-networks-2026", basis: "Synthient (via Krebs, 2026-11-05): the AS2650 activity related to multiple Windows 11 installations of Infatica" }
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    lookback: true
    classification_suggestion: { reliability: B, credibility: 2 }
    borderline: true
    borderline_reason: "awareness-level: no exploitation, no Swiss data point; relevant because it quantifies a shared exposure (proxy SDK traffic and inbound reachability on government endpoints) rather than a threat actor. Keep to two sentences or drop if the brief is tight."
    evidence:
      - quote: "Layer3 said the proxy activity was relatively persistent between October 5 to November 3"
        attribution: "Krebs on Security"
        source_url: "https://krebsonsecurity.com/2026/11/want-to-rent-an-internet-address-at-the-white-house/"
      - quote: "found residential proxies in nearly 300 government owned and operated networks"
        attribution: "Krebs on Security"
        source_url: "https://krebsonsecurity.com/2026/11/want-to-rent-an-internet-address-at-the-white-house/"
      - quote: "Our data shows the exits, not the device or the person behind them."
        attribution: "Layer3 Intel"
        source_url: "https://layer3intel.com/blog/residential-proxies-white-house-network"
    extended_notes: |
      Detection (concept; sources state the problem, not a rule): DNS and web-proxy logs for lookups of residential-proxy SDK and provider domains from managed endpoints (Infoblox's 65 percent figure is that exact query on customer DNS); unexpected long-lived outbound connections from a workstation to proxy-provider infrastructure; application inventory for free software bundling proxy SDKs. Hardening lever the sources imply: application allow-listing and restricting administrative rights; Krebs's commenters, not the sources, speculate about staff admin rights, so do not carry that as fact.
      Limitation: the Infatica attribution of the White House exits is Synthient's claim, published on X and relayed by Krebs (not independently fetched).

