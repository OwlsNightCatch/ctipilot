  - claim_id: c1d4846986
    entry: 2026-11-06/cve-2026-123158-openssh-musl-no-pam-password-bypass-sshole
    surface: "body"
    kind: cited
    text: "**Detection:** Alpine advises looking in /var/log/messages for sshd lines reading `Accepted password for` an account that has no password (alpine, root or any key-only user) and treating the machine as compromised if a login cannot be ruled out ("
