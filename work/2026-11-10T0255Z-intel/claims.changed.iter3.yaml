    entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
    surface: "body"
    kind: cited
    text: "Follow-on activity, per Huntress: commands spawned by the AhsayCBS service process fetch payloads over HTTP from cloud object storage into a Temp folder with curl and certutil; an XMRig Monero miner renamed to look like a Microsoft Edge binary runs as SYSTEM through a service that mimics the Edge updater and a renamed copy of the NSSM service manager; and a PowerShell script hides the miner while Task Manager is open ("
