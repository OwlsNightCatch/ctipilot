    text: "GreyNoise's gridpoint sessions show what follows a successful login: sshd-session spawning `sh -c` that runs id, uname and reads /etc/os-release, requests to the AWS, Azure and Alibaba Cloud metadata services, attempts to read root's SSH keys and /etc/shadow through `doas`, a new key written into the default alpine user's authorized_keys ("
    urls: ["https://sshole.events.greynoise.io/"]
