  - claim_id: 921f9980ee
    entry: 2026-11-06/cve-2026-123158-openssh-musl-no-pam-password-bypass-sshole
    surface: "summary"
    kind: frontmatter
    text: "OpenSSH Portable 10.6p2 of 2026-11-05 works around CVE-2026-123158, a password-authentication bypass on Linux systems that use musl libc and run sshd without PAM, Alpine's default OpenSSH server and OpenWrt among them: a password of 257 to 1,024 bytes logs in to an account whose password field is *. NCSC Switzerland published an advisory the same day and rates exploitation unknown; Alpine shipped fixed packages for every branch back to 3.16. CISA added the flaw to its Known Exploited Vulnerabilities catalog on 2026-11-09, and GreyNoise records hands-on logins on its gridpoints from 2026-11-07 that ended in a dropped Python implant; Previdian counts 22 attempts from 14 addresses as of 2026-11-10 and SANS ISC's honeypots saw attempts from 2026-11-05, and no source reports a compromised production host."
  - claim_id: 0b046da012
    entry: 2026-11-06/cve-2026-123158-openssh-musl-no-pam-password-bypass-sshole
    surface: "cves[CVE-2026-123158]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-123158\", \"cvss\": \"8.1\", \"status\": [\"exploited\", \"cisa-kev\", \"poc-public\", \"patch-available\"], \"affected\": \"OpenSSH Portable before 10.6p2 on Linux with musl libc and no PAM; needs an account whose password field is * and at least one other account with a real password\", \"fixed\": \"OpenSSH Portable 10.6p2; Alpine edge 10.6_p2-r0, 3.24 10.3_p1-r2, 3.23 10.2_p1-r1, 3.22 10.0_p1-r11, 3.21 9.9_p2-r1, 3.20 9.7_p1-r6, 3.19 9.6_p1-r3, 3.18 9.3_p2-r4, 3.17 9.1_p1-r7, 3.16 9.0_p1-r6 per Alpine's advisory; temporary mitigation PasswordAuthentication no\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
  - claim_id: ba78a42056
    entry: 2026-11-06/cve-2026-123158-openssh-musl-no-pam-password-bypass-sshole
    surface: "body"
    kind: cited
    text: "OX Security explains the mechanism: musl's crypt() refuses inputs over 256 bytes and returns the string `*`, `*` is also what /etc/shadow holds for an account with no valid password, and OpenSSH reads the two matching values as a successful login; the conditions are sshd on musl without PAM, password logins enabled, an account whose password field is `*` and at least one other account with a real password ("
    urls: ["https://www.ox.security/blog/openssh-authentication-bypass-cve-2026-123158/"]
  - claim_id: e8221265fa
    entry: 2026-11-06/cve-2026-123158-openssh-musl-no-pam-password-bypass-sshole
    surface: "body"
    kind: cited
    text: "); NVD scores the flaw CVSS 3.1 8.1 ("
    urls: ["https://sshole.events.greynoise.io/"]
  - claim_id: 3e16051194
    entry: 2026-11-06/cve-2026-123158-openssh-musl-no-pam-password-bypass-sshole
    surface: "body"
    kind: cited
    text: "On Alpine's tiny-cloud images the passwordless alpine user can run doas without a password, so the bypass chains to root ("
    urls: ["https://www.ox.security/blog/openssh-authentication-bypass-cve-2026-123158/"]
