  - claim_id: f6e90deae5
    entry: 2026-11-06/cve-2026-116779-freeswitch-sip-message-api-command-execution
    surface: "body"
    kind: cited
    text: "The default posture is exposed: chat handling is on unless a profile sets `enable-chat=false`, the stock vanilla configuration leaves it on for the internal and external profiles, and the inbound ACL does not cover MESSAGE; where MESSAGE authentication is enforced (the default from 1.10.7) any one account on the profile is enough, and installations that still carry the sample directory user `default`, which has no password, need no account of their own ("
    urls: ["https://github.com/signalwire/freeswitch/security/advisories/GHSA-mg63-h38w-8p9p"]
  - claim_id: d1c327f6fe
    entry: 2026-11-06/cve-2026-116779-freeswitch-sip-message-api-command-execution
    surface: "body"
    kind: cited
    text: "The fix is a per-profile `enable-chat-api-proto` parameter that is off unless set, so the route is closed by default and a MESSAGE that selects the proto is answered with 403 and logged with the source and the requested command ("
    urls: ["https://github.com/signalwire/freeswitch/security/advisories/GHSA-mg63-h38w-8p9p"]
  - claim_id: 9e03b495e1
    entry: 2026-11-06/cve-2026-116779-freeswitch-sip-message-api-command-execution
    surface: "body"
    kind: cited
    text: "`auth-messages` alone does not close the path, and `disable_system_api_commands=true` removes the system API but leaves the route to every other registered API, module loading and call origination included ("
    urls: ["https://github.com/signalwire/freeswitch/security/advisories/GHSA-mg63-h38w-8p9p"]
  - claim_id: f9aad377a7
    entry: 2026-11-06/cve-2026-116779-freeswitch-sip-message-api-command-execution
    surface: "body"
    kind: cited
    text: "**Exposure:** a FreeSWITCH of version 1.11.2 or earlier with a SIP profile that accepts inbound MESSAGE from a peer that can reach it, which is the default configuration ("
