    text: "Proofpoint describes BluePhishing, a research proof of concept that extends OAuth consent phishing to Microsoft Entra Agent ID: a victim who consents to an attacker's multi-tenant agent blueprint gets a blueprint principal with an agent-creation permission that Proofpoint says cannot be revoked, and the attacker then creates agent identities, up to 250 per blueprint, that inherit the consented permissions, which Microsoft's documentation says neither the Entra portal nor Microsoft Graph shows. Proofpoint has identified no in-the-wild activity, and Microsoft 365 message MC1506733 says default Entra users will be able to create agent blueprints from November 2026."
