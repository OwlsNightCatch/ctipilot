    entry: 2026-11-06/cve-2026-116779-freeswitch-sip-message-api-command-execution
    surface: "body"
    kind: cited
    text: "**Detection:** SIP signalling logs, or packet capture at the session border controller, for MESSAGE requests whose To user carries a `+` with `api` as the left half, in any letter case; after the upgrade the 403 and the log line with the source and the requested command mark attempts ("
