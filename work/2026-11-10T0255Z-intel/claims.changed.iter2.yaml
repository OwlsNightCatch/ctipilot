    entry: 2026-11-06/cve-2026-116779-freeswitch-sip-message-api-command-execution
    surface: "body"
    kind: cited
    text: "BSI CERT-Bund rated its advisory on the flaw critical and lists versions before 1.11.3 as affected ("
