    kind: cited
    text: "The advisory scores it CVSS 3.1 9.8, lists 1.11.2 and earlier as affected and 1.11.3 as patched, and states that exploitation of this path has been observed in the wild without naming an actor or a victim ("
    urls: ["https://github.com/signalwire/freeswitch/security/advisories/GHSA-mg63-h38w-8p9p"]
