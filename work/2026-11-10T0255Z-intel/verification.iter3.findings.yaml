  item: "SonicOS 7.3.3-7015 and older (Gen7 hardware firewalls and NSv 270, 470, 870) and 8.2.2-8015 and older (Gen8 hardware firewalls and NSv XS, S, M, L)"
  url_or_quote: "https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2026-0014"
  summary: "(low confidence, unreadable, carried from iterations 1 and 2) The PSIRT build table is script-built and no transport returned it this pass (extract, jina and WebFetch all return the advisory text without the table). SecurityWeek (https://securityweek.com/sonicwall-patches-exploited-sonicos-bug-that-weakens-vpn-logins) confirms the families and builds ('Gen7 TZ, NSa, NSsp and NSv firewalls with SonicOS 7.3.3-7015 or older. Gen8 TZ, NSa and NSv firewalls with SonicOS 8.2.2-8015 or older', fixes 7.3.4-7013 and 8.2.3-8015) but not the NSv model numbers 270/470/870 and XS/S/M/L. Cheapest fix: write 'Gen7 and Gen8 NSv' in cves[].affected, which SecurityWeek supports; otherwise log it as a residual."
