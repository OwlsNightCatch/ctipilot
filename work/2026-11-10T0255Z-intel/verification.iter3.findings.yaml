- code: F3
  category: claim-not-supported
  section: 2026-11-06/cve-2026-123158-openssh-musl-no-pam-password-bypass-sshole (body, Defender takeaway; claim 11e6b01161)
  item: "**Defender takeaway:** install OpenSSH 10.6p2 ... and rebuild container and cloud images from a fixed base ([Alpine Linux, 2026-11-05](https://alpinelinux.org/posts/2026-11-05-openssh-password-authentication-bypass/))"
  url_or_quote: "https://alpinelinux.org/posts/2026-11-05-openssh-password-authentication-bypass/"
  summary: "Alpine's advisory says to update openssh and restart sshd, that images built from 3.21.10, 3.22.8, 3.23.8 and 3.24.4 and later carry the fix and that 'Images from earlier point releases do not, so on every running instance, update openssh or disable password authentication'; it contains no instruction to rebuild container or cloud images. That advice is OX Security's 'Rebuild your images ... Rebuild them from a fixed base and redeploy' (page https://www.ox.security/blog/openssh-authentication-bypass-cve-2026-123158/ reads via extract, which falls back to jina). Cite OX for the rebuild clause or reword it to Alpine's image statement."
