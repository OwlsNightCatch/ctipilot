- code: F14
  category: quantifier-without-source
  section: 2026-11-06/cve-2026-123158-openssh-musl-no-pam-password-bypass-sshole (Update section 2026-11-10T03:36:55Z, last sentence; claim f6bf35becc)
  item: "Every success described so far is on a GreyNoise gridpoint or a honeypot, and no source reports a compromised production host."
  url_or_quote: "https://www.bleepingcomputer.com/news/security/hackers-exploit-sshole-openssh-flaw-to-breach-linux-systems/"
  summary: "(low confidence) BleepingComputer says watchTowr 'observed SSHole being exploited in attacks associated with botnets and cryptomining activity' and that Previdian sensors 'confirmed successful SSHole exploitation'; SecurityWeek says 'only botnets and crypto miners have picked it up so far'. None of these says the hosts were gridpoints or honeypots, and the entry's own body cites watchTowr's botnet and cryptomining use. The universal 'Every' is unsupported; scope it ('every success described in detail') or state only the absence claim."
- code: F3
  category: claim-not-supported
  section: 2026-11-10/n-able-n-central-33-unpatched-flaws-public-pocs-offline (body paragraph 1; claim 91fa3c4baa)
  item: "No source has validated the individual claims, but N-able took its hosted environments offline on 2026-11-09 and told customers who run N-central themselves to keep their servers offline until it confirms they are safe ([Huntress, 2026-11-09](...); [BleepingComputer, 2026-11-09](...))"
  url_or_quote: "https://censys.com/advisory/n-able-n-central/"
  summary: "(low confidence) The first clause is Censys's ('no source has validated the proof-of-concept code'), and Censys is not cited on it; Huntress and BleepingComputer carry only the offline action. BleepingComputer adds that it 'has not independently verified all the reported vulnerabilities' while N-able's hotfix lends 'credence to the researcher's claims that at least some of the flaws are legitimate zero-days', a nuance the sentence leaves out. Add Censys to the citation and the BleepingComputer qualifier."
