  discovery_trace: 'first seen at: cyberdaily-au, URL https://www.cyberdaily.au/security (extract; headline ''The Big Melt: France pins supermarket fridge cyber attacks on Iran'') → pivot: https://www.cyberdaily.au/security/14422-the-big-melt-france-pins-supermarket-fridge-cyber-attacks-on-iran → WebSearch ("Iran Gardiens de la révolution attaque frigos supermarchés Barrot G7 Paris parquet Beccuau", extended) → pivot: https://www.franceinfo.fr/internet/securite-sur-internet/cyberattaques/cyberattaque-contre-des-frigos-de-supermarches-le-parquet-de-paris-ouvre-une-enquete-visant-une-unite-des-gardiens-de-la-revolution-iraniens_8274806.html → pivot: https://www.bleepingcomputer.com/news/security/france-blames-iranian-hackers-for-supermarket-attacks-that-sparked-fires/ (links the MFA statement and the CERT-FR report) → primary: https://www.diplomatie.gouv.fr/fr/presse-et-ressources/decouvrir-et-informer/actualites/declaration-d-attribution-a-l-iran-de-cyberattaques-visant-la-france and primary:
    https://www.cert.ssi.gouv.fr/cti/CERTFR-2026-CTI-009/ → PDF https://www.cert.ssi.gouv.fr/uploads/CERTFR-2026-CTI-009.pdf'
  summary: 'FACTS (French authorities, 2026-11-09). The French foreign ministry published an attribution statement saying France ''is able to attribute to Iran'' the destructive actions of the night of 11 to 12 October, carried out by the cyber-offensive unit SHAHID KAVEH, affiliated with the electronic and cyber centre of the Islamic Revolutionary Guard Corps (IRGC-CEC). In parallel the C4 crisis cell (ANSSI, COMCYBER, DGA, DGSE, DGSI) published CERTFR-2026-CTI-009, which describes a ''faisceau d''indices'' (bundle of indicators) naming the IRGC as sponsor and Shahid Kaveh as executing unit. Evidence the C4 lists: the infrastructure used for the attack was also used in the same period for reconnaissance of Schneider Electric equipment at small and medium energy and water producers, with techniques known for Shahid Kaveh since at least April 2026 (Modbus/TCP on port 502); the operators used the FOFA internet-scan platform, which the report says this operating mode habitually uses; the attack
    was relayed on the CyberbanNews propaganda outlet, associated with the unit, from 13 October; traces of Farsi were found in the attack infrastructure. The report adds that the C4 saw concurrent targeting of Schneider Electric equipment at small French hydroelectric installations, tied to the same attack with moderate effects on the equipment. Impact stated by the authorities: about 700 supermarket and food-trade sites, defrost parameters set to high temperatures, at least 15 fires (C4; the prosecutor says about twenty), losses ''estimated at several tens of millions of euros'' (foreign ministry); named victims Casino, Leclerc, Coopérative U, Metro, Carrefour and Intermarché plus small butchers, a slaughterhouse and cooperative food factories. The Paris prosecutor (national-competence cybercrime section, investigation led by OFAC and DGSI) opened a judicial investigation against the head of the Shahid Kaveh group, two deputies and anyone else identified, aggravated by acting for a foreign
    power, and requested international arrest warrants; per the prosecutor the attackers took control through web interfaces, launched unlimited abnormal defrost cycles and disabled the probes'' safety alerts. France summoned Iran''s ambassador and will propose EU sanctions; Kaja Kallas said the EU Foreign Affairs Council meets ''next Monday'' (by our reading 2026-11-16) and that attributed incidents call for a strong response. The report also names the IRGC-CEC unit Shahid Shoostari (Emennet Pasargad, Iliyanet) for earlier French targets (Charlie Hebdo 2020/2023, a French video-display operator in 2024); the foreign ministry notes the EU sanctioned Emennet Pasargad in March 2026. SCOPE LIMITS (the claim is narrower than the headlines). The attribution covers only the 11-12 October French campaign. BleepingComputer and franceinfo both state the later waves were not attributed; ANSSI''s director general said on the blood-service (EFS) incident that ''nothing at this stage allows saying it
    is the same attacker''. Competing public claims for the early-November wave stay unresolved: a claim video in the name of Z-Pentest and NoName057(16) was reportedly deleted (Watson, via Netzwoche), Sekoia sees features of Russian hybrid warfare (Netzwoche relaying), and the Russian government denies involvement. BACS declined to comment on perpetrators or state involvement in the Köniz case (20 Minuten, 2026-11-09); the Swiss cases of 5 November (Köniz butcher, Volg) are therefore not covered by the French attribution. ASSESSMENT (French government, not independently confirmed by a second state or lab): the C4 frames its evidence as a bundle of indicators, not proof; no outside lab has published a matching reading in the sources fetched.'
  region_nexus: Europe-wide campaign incl. Switzerland (first Swiss cases 2026-11-05, unattributed); first government attribution of the refrigeration-sabotage campaign, by France, for the French wave only
