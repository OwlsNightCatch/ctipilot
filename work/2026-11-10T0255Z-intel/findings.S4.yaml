- title: N-able takes hosted N-central offline and tells on-premises customers to shut servers down after a researcher publishes 30-plus unpatched exploits (Able2Shell)
  sources:
  - url: https://www.bleepingcomputer.com/news/security/n-able-takes-cloud-platform-offline-after-30-plus-zero-days-published/
    publisher: BleepingComputer
