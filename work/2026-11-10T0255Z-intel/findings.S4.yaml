  extended_notes: 'Suggested Admiralty: A2 (French MFA, CERT-FR and the Paris prosecutor are first-party for their own attribution; the attribution is the French government''s assessment). Fields the update record will need to move: title and headline (they say ''no actor established'' / ''responsibility not established'' for the French wave, now stale for the 11-12 October campaign only; SentinelLABS'' ''not publicly established'' quote is superseded for that wave only), summary, entities (add actor:shahid-kaveh, actor:irgc-cec), techniques (add T1596.005 for FOFA use, T1595.001 for the Modbus/502 mass reconnaissance), sources, evidence, sourcing_note, body. Defender reading that follows mechanically from the sources: the C4 names FOFA-indexed exposure and Modbus/TCP port 502 reconnaissance of Schneider Electric systems as the unit''s observed targeting method, so an operator can check what its own refrigeration supervisors, building-management web interfaces and Schneider/Modbus devices
    expose on internet scan engines; the parquet says the attackers also disabled the probes'' safety alerts, so alarm-threshold and defrost-schedule changes made through the web interface are the telemetry to watch, and independent temperature alarms that do not run through the same controller are the hardening lever (CERT-FR''s existing remediation text in the entry already covers config checks and reset). Swiss reading: the French attribution does not cover the Köniz butcher or the three Volg stores; BACS declined to comment. The C4 sentence on small hydroelectric Schneider sites is the part with the closest communal-utility analogue; no source says Swiss hydro operators were targeted. Source notes: the foreign-ministry page and the CERT-FR PDF were read in full (the PDF through the bridge pdf command; the page itself shows only the introduction); the ANSSI director general''s remark is his LinkedIn post as franceinfo relays it (LinkedIn not fetched); Cyber Daily is a C-grade lead, every
    claim in this item rests on the French primaries.'
