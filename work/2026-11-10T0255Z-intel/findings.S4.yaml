  summary: 'FACTS (the fund''s statement of Monday 2026-11-09 as Keystone-SDA and Inside IT relay it). The Pensionskasse der Stadt Zug, the City of Zug''s pension fund, has its administration outsourced to the consultancy Libera AG, which uses PK Softech software; PK Softech reported the cyberattack of late September that already drove the Publica, PKZH, BPK and Pensionskasse Post notices. The fund says it was first informed in mid-October, then believed it was not affected, and received only last week the information that there is an ''increased risk'' that insured persons'' data left the supplier; this is not confirmed. Data at PK Softech were names, AHV numbers, dates of birth, addresses and salary details, partly telephone numbers and e-mail addresses; the fund says retirement assets are safe and that particularly sensitive data such as incapacity and disability files are not affected. It informed its active insured persons and the Federal Data Protection and Information Commissioner
    (EDÖB). WHAT IS NEW AGAINST THE STORE: another public-law fund (a municipal one) and a second administrator layer (Libera, already named in the store as confirming it works with PK Softech) now carry a ''possibly affected'' notice; the store''s entry names Publica, PKZH, BPK, BLVK, Pensionskasse Post, IPCT and Libera but not this fund. No source in the window adds confirmation of exfiltration for any further fund, a new actor statement or a date for the EDÖB investigation''s result.'
