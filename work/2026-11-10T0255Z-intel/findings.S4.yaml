    publisher: Bank Info Security (ISMG)
    date: '2026-11-10'
    role: corroborating
  discovery_trace: 'first seen at: BleepingComputer security listing, URL https://www.bleepingcomputer.com/news/security/ (fetched with extract while drilling the Vanderbilt BYOD story; headline ''N-able takes cloud platform offline after 30+ "zero-days" published'', 2026-11-09 16:26) → primary-ish: https://www.bleepingcomputer.com/news/security/n-able-takes-cloud-platform-offline-after-30-plus-zero-days-published/ (quotes N-able''s statement) → WebSearch ("\"N-able\" \"Sean Bales\" N-central zero-days offline", extended) → corroborating: https://www.bankinfosecurity.com/n-able-takes-platform-offline-after-33-zero-days-drop-a-33337. N-able''s status page (uptime.n-able.com) is a JS dashboard and returned no readable text; the GitHub repository and the researcher''s LinkedIn post were not fetched (PoC material).'
  summary: 'FACTS. On the evening of 2026-11-08 security consultant Sean Bales published a GitHub repository called Able2Shell with proof-of-concept exploits for more than 30 alleged zero-days in N-able N-central, the remote monitoring and management (RMM) platform managed service providers use to administer customer endpoints; Bank Info Security counts 33. He says the exploits were tested against N-central Appliance 2026.4.0.31, a pre-release build, and that most if not all also work on earlier releases (BleepingComputer). The classes named: authentication bypasses, credential disclosure, arbitrary file write, traversal, XSS, XXE and RCE; the chain BleepingComputer calls most critical abuses an unauthenticated XXE in the service-import function to steal a trusted local session, reset an account password and run commands as the ''nable'' user, and the same exploit can create an enabled Default Administrator account; other items run commands as root through stored XSS in patch metadata or
    a local privilege escalation. Bales told BleepingComputer the discovery was AI-assisted and that he skipped coordinated disclosure because earlier reports on a different N-able product went unpatched for five to six months, which N-able did not address. N-able''s response (its own statement as BleepingComputer quotes it): it took the hosted N-central environment offline on 2026-11-09 across the Americas, Europe and Asia-Pacific, advised on-premises customers to take their N-central servers offline ''until further notice'', is building a hotfix, and ''has not observed active exploitation''; no restoration time was given and updates were promised every four hours. Bank Info Security counts this as the fifth emergency N-central hotfix since 1 August. BleepingComputer has not independently verified every flaw but notes N-able''s hotfix work supports at least some being real. WHY IT MATTERS HERE: an RMM server is a single point of control over every customer endpoint it manages, and the store
    already carries the August and September exploited N-central chains and Lumen''s Silent Train reading of N-central zero-days; PoCs are now public for an internet-reachable management plane. This is a vulnerability disclosure and a vendor outage, not a confirmed intrusion.'
  region_nexus: global; N-central is used by managed service providers serving European public bodies; no Swiss victim reported
  primary_sector_nexus: 'indirect: Swiss communal and cantonal IT is often run by MSPs; exposure depends on whether a supplier uses N-central'
