- title: 'CNIL fines ten French local authorities and one public body for cybersecurity failings: admin accounts without MFA, permanent and shared supplier access, unread logs, flat networks, unsupported servers'
  sources:
  - url: https://www.cnil.fr/fr/sanctions-cybersecurite-collectivites-territoriales
    publisher: CNIL
    date: '2026-11-09'
    role: primary
  discovery_trace: 'first seen at: cnil-fr, URL https://www.cnil.fr/fr/actualites (extract; item dated 2026-11-09) → primary (no pivot needed): https://www.cnil.fr/fr/sanctions-cybersecurite-collectivites-territoriales'
  summary: 'FACTS (CNIL, 2026-11-09). In November 2026 the French data-protection authority issued ten simplified-procedure fines, from EUR 3,000 to EUR 20,000 (the legal maximum for that procedure), against local authorities and one public establishment for security failings under GDPR Article 32, after inspections that were one of its annual control themes for 2025 and covered local authorities and their suppliers. The findings it lists: remote-access authentication for staff, administrators with elevated privileges included, was not robust enough and had no multifactor authentication; external suppliers such as software publishers had permanent network access, not authorised case by case, or through accounts shared among several employees; detection of abnormal behaviour was ineffective (incomplete logging or no real-time or short-term review of logs); network segmentation was insufficient so a breach could spread across segments; some servers ran unsupported operating systems without
    security patches; some passwords were weak, sent in clear to users or stored without confidentiality. Several decisions also fault the lack of a security approval (homologation) required by the RGS before putting online services into use, and several fault the missing data-protection impact assessment for school and after-school parent portals and for public-space video surveillance. The CNIL says some of the inspected authorities had already suffered one or more data breaches that these measures could have prevented, that more procedures are open, and that the work also prepares the application of NIS2, which names local authorities among the new obligations. No Swiss obligation follows from a CNIL decision; the item is a regulator''s list of what it finds in communal systems.'
  region_nexus: France (neighbour); Swiss communal bodies face the same supplier-access and admin-MFA weaknesses; no Swiss authority named
  primary_sector_nexus: 'indirect: communal administrations and their IT suppliers'
