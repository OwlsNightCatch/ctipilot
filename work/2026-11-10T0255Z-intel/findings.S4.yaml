  summary: 'FACTS. Vanderbilt University confirmed on 2026-11-09 an ''active cybersecurity incident'' affecting devices, systems and cloud services and told staff and students to shut down university devices and disconnect from university Wi-Fi; BleepingComputer confirmed that the link in a ransom note shown to it points to the leak site operated by BYOD, a new ransomware group, though Vanderbilt has not confirmed the group''s involvement, encryption or data theft. CLAIMS by BYOD (leak-site text): encrypted databases, over one million SSNs and full takeover of the domain controller at Vanderbilt; for Texas HHSC, 2 million Texans'' Medicaid, banking, SNAP, TANF and disaster-assistance data (Ransomware.live listing of 2026-11-09; no confirmation or reply from the agency in any source found). Earlier case: UNM Health (University of New Mexico) confirmed a ''cybersecurity event'' on 2026-10-26, diverted ambulances and cancelled surgeries and classes; BYOD claimed 36,000 systems including Active
