    summary: |
      The Pensionskasse der Stadt Zug said on 2026-11-09 that its administration is outsourced to Libera AG, which uses software from PK Softech, the Reinach supplier attacked at the end of September. The fund says it was first told of the incident in mid-October and believed it unaffected; only last week did it receive information that there is an elevated risk that insured persons' data left the supplier, which is not yet confirmed. The data that may be affected: names, AHV numbers, birth dates, addresses and salary details, in part also phone numbers and e-mail addresses; the fund says retirement assets are safe and particularly sensitive data such as documents on incapacity to work or disability are not affected. It informed its active insured persons and the Federal Data Protection and Information Commissioner. This adds a communal fund reached through a second-tier supplier chain (employer fund, administrator Libera AG, software vendor PK Softech) to the funds already naming themselves (Publica, the Bernese funds, Pensionskasse Post, Pensionskasse Stadt Zürich, IPCT); Libera AG had already confirmed it works with PK Softech. Inside IT lists the same group of funds as using PK Softech software, adding the Migros and Syngenta funds.
