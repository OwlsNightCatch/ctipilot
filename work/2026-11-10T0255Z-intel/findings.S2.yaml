    summary: |
      On 2026-11-09 France attributed the 11-12 October campaign against refrigeration controllers at about 700 retail sites to Iran. The foreign ministry says France can attribute the destructive actions to the cyber-offensive unit Shahid Kaveh, affiliated with the Cyber-Electronic Command of the IRGC (CGRI-CEC), and calls it the first cyber-offensive campaign run purely for sabotage on French soil; the C4 (ANSSI, COMCYBER, DGA, DGSE, DGSI) report CTI-009 words it as a "faisceau d'indices" (a bundle of indicators) naming the IRGC as sponsor and Shahid Kaveh as executor. The evidence classes CERT-FR lists are: attack infrastructure also used in the same period to reconnoitre Schneider Electric equipment at small and medium energy and water production units, use of the FOFA scan tool (which CERT-FR says is habitual for this intrusion set), relay of the attack on the CyberbanNews propaganda outlet linked to the unit from 2026-10-13, and traces of Farsi in the attack infrastructure. CERT-FR says defrost parameters were set to high temperatures, causing losses and fires in at least 15 cases; victims are mostly retail (Casino, Leclerc, Coopérative U, Metro, Carrefour, Intermarché) plus agri-food (small butcher shops, an abattoir, cooperative food plants). It also ties to the same attack the concurrent targeting of Schneider Electric equipment at small hydroelectric installations in France, with moderate effects. CERT-FR describes Shahid Kaveh as known mainly through hacktivist personas (CyberAveng3rs, Soldiers of Solomon, Mr. Soul, Cyber Isnaad Front) and the CyberbanNews outlet, holding scripts since at least June 2024 to scan, access and control Schneider Electric, Siemens and Rockwell industrial equipment, and seen in April 2026 using Modbus on port 502 for mass reconnaissance of Schneider Electric systems, including in France. Reuters reports the Paris prosecutor's office requested international arrest warrants against the unit's leader and his two deputies, the Iranian ambassador was summoned and France will propose EU sanctions; Reuters says it could not establish exactly how the French reached the determination, and Iran routinely denies such operations. Scope caveat: the French documents cover the 11-12 October French campaign; they do not state that the later incidents (the 1-2 November wave, and the Swiss cases reported on 2026-11-05, whose dates the sources I read do not give) were the same operator. Sekoia says the October and November waves show similarities in timing, infrastructure, targeting and tradecraft that suggest, but do not establish, one actor, calls the French attribution consistent with its own Iran-nexus hypothesis (its write-up of that hypothesis says 'no technical indicators currently link this incident to that cluster'), and assesses the NoName057(16) / Z-Pentest claim as unsubstantiated. This supersedes the entry's 'no actor named on the record' status; NCSC Switzerland's advisory 13054 (last edited 2026-11-06) still says public information does not establish a common attack method.
