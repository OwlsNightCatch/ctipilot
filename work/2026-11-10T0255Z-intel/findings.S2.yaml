    extended_notes: |
      DEFENDER DETAIL (only what the sources state).
      Exposure and hunt for Swiss constituency: the unit's documented tooling is internet-wide discovery (FOFA) plus Modbus/TCP 502 mass reconnaissance and vendor-specific scripts for Schneider Electric, Siemens and Rockwell controllers; the French concurrent targeting of Schneider equipment at small hydroelectric installations had moderate effects. Swiss small hydropower, communal water and energy utilities and building-automation contractors are the same device class. Telemetry classes: firewall/NetFlow inbound TCP 502 (and other ICS ports) from non-allow-listed internet sources to any OT segment; self-check of exposure on public device-search indexes (FOFA, Censys-type); configuration-change audit on controllers and supervisors (setpoints, defrost cycles and durations, alarm thresholds and delay, notification recipients); independent temperature sensing with alarm delivery tests (the French blood service's own alarms caught the 2 Nov change; Le Monde reported the actor lengthened the defrost operation from one hour to eight so alarms trigger late).
      SEKOIA HONEYPOT OBSERVATIONS (Sekoia's own telemetry, 2026-10-12 to 2026-11-01, four Danfoss 800A web-interface honeypots in France and the Netherlands): unauthenticated HTTP requests to the xml.cgi endpoint with the read_units and read_date_time actions from 26 unique addresses (enumeration of System Manager units and their stored store identity and location; read_date_time is the prelude Sekoia says CVE-2025-41450 'code of the day' would need), password spraying of the Supervisor and admin accounts with the password 12345, and on 2026-11-01 (22:00-22:30 in Sekoia's stated time, inside the second wave) an exploitation attempt against four honeypots using a non-public unauthenticated flaw that renames an account by numeric identifier (target user ID 1, administrative), reasoned by Sekoia to be the first step of a rename-then-reset chain; Sekoia used an LLM plus the vendor's public firmware images to reproduce the flaw and warns that LLM-assisted exploit development lowers the bar for attacks on small ICS and building automation. Sekoia says it could not confirm CVE-2025-41450 was exploited in the first campaign, saw about 2,700 exposed Danfoss systems worldwide on 2026-10-11 (about 1,700 in France) and half of the French ones offline by the afternoon of 2026-10-12, and was told through closed intelligence that only parameters, not file systems, were modified. Attacker addresses are in the source and deliberately omitted here.
      TRIAGE (mechanical from the stated behavior): legitimate contractor remote maintenance also writes controller parameters; discriminators are a source outside the contractor allow-list, many units changed in one burst, and the combination of defrost, alarm-threshold, alarm-delay and recipient changes together (benign maintenance rarely touches all four).
      SOURCING NOTES: CERT-FR page `date` metadata in the trafilatura extract reads 2024-04-08 (template artifact); the CTI page itself says first and last version 9 November 2026. The foreign-ministry URL as linked from the CTI page redirects to .../declaration-d-attribution-a-l-iran-de-cyberattaques-visant-la-france (same content). The CTI PDF extraction is partial (8 of 30 streams decoded) but carries the sections cited here; nothing was inferred from missing text. heise's framing (France blames Iran for 'the recent attacks in several countries') is broader than the primaries, which cover the 11-12 October campaign; heise also garbles the unit name as a person (Shahid Kaveh) in the arrest-warrant sentence, so rely on Reuters/Al Jazeera for the warrants. Netzwoche (2026-11-09 update, relaying Watson) said Sekoia saw marks of Russian hybrid warfare; Sekoia's own 2026-11-10 post instead calls the French attribution consistent with its Iran-nexus hypothesis and rejects the NoName057(16)/Z-Pentest claim.
      OTHER ATTRIBUTION HYPOTHESES held: Z-Pentest Alliance / NoName057(16) claim video (deleted, per Watson via Netzwoche; Sekoia: unsubstantiated); Forescout counts 20+ hacktivist-claimed refrigeration attacks since Jan 2026 (already in the entry).

