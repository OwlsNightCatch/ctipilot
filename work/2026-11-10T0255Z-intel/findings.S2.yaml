  - title: "Vaud Grand Conseil agenda of 2026-11-10 carries interpellation 26_INT_155 on the school IT-support platform breach: platform governance outside the central IT directorate questioned"
    borderline: true
    borderline_reason: "oversight text states a deputy's questions and observations, not findings; the only new facts are the five-day gap between detection and the official release, the parallel identity providers observation and the combined figure of about 41,500 names; the Conseil d'Etat answer (due within about three months) is the item worth waiting for"
