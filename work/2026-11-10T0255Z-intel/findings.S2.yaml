    discovery_trace: "first seen at: vd-grand-conseil, URL https://www.vd.ch/gc/seances-du-grand-conseil/detail-seance/seance-gc/1033714 (3 Nov session, interpellation filed) -> WebSearch ('Vaud DGNSI plateforme DGEP cyberattaque Conseil d'Etat reponse interpellation Lohri donnees eleves enseignants') surfaced meeting 1033715 -> primary (no pivot needed): https://www.vd.ch/gc/seances-du-grand-conseil/point-seance/point/c8d4c90b-d8f0-4fc7-9190-c5d65d6a2a3e/meeting/1033715 (session of 2026-11-10, point 6)"
    summary: |
      The Vaud Grand Conseil agenda for 2026-11-10 lists, as point 6 for development, interpellation 26_INT_155 by Didier Lohri on the cyberattack against the IT-support platform of the post-compulsory education directorate (DGEP). The text, dated 2026-11-01, says the State detected unauthorised access on 2026-10-26, that names, first names and school e-mail addresses of about 41,500 pupils and teachers were copied together with the content of support requests, and that the official communiqué came five days later, on Saturday 2026-10-31. The interpellant then asks the Conseil d'Etat six questions: whether the platform was run autonomously by the DGEP behind its own firewall or fell under the central DGNSI; why the State keeps three identity sources (cantonal authentication, edu-vd for the compulsory-education directorate DGEO, and eduvaud for the DGEP, the last open on the cantonal IAM portal only to teachers of six establishments); whether DGEP and DGEO environments meet DGNSI's multifactor-authentication, connection-monitoring and audit requirements; DGEP and DGEO IT spending without DGNSI validation in 2023-2025; the number of software and cloud services outside the DGNSI-validated catalogue; and whether to place all acquisitions, infrastructure and directories under DGNSI authority. These are questions and observations in a parliamentary text, not established findings; no access method is stated. The entry already carries the 3,500 teachers and 38,000 pupils figure, the platform and the arrest of a 16-year-old pupil.
