  - title: "BACS warning: phishing in the name of the Federal Tax Administration (ESTV) asks for personal data under a refund pretext"
    borderline: true
    borderline_reason: "citizen-facing fraud notice on a lure BACS and ESTV have warned about repeatedly in 2025 and 2026, no technical detail and a report-and-delete instruction only; recommended drop, kept only because it is an in-window BACS notice impersonating a federal agency that helpdesks of public bodies may want to recognise"
    sources:
      - { url: "https://www.bacs.admin.ch/de/warnung-estv-de", publisher: "BACS (NCSC Switzerland), Aktuelle Vorfaelle", date: "2026-11-09", role: "primary" }
    discovery_trace: "first seen at: ncsc-ch-incidents, URL https://www.bacs.admin.ch/de/aktuelle-vorfaelle (also top card of https://www.bacs.admin.ch/de/im-fokus) -> primary (no pivot needed): https://www.bacs.admin.ch/de/warnung-estv-de"
    summary: |
      On 2026-11-09 BACS said it is currently receiving many reports of phishing in the name of the Federal Tax Administration (ESTV) about an alleged refund. Instead of the usual passwords or credit-card details the messages ask for personal data such as date of birth, phone number and bank account; BACS assumes the data is collected for later fraud attempts. It tells recipients not to engage, to report the message to BACS and to delete it. The page names no sender infrastructure, channel or volume.
