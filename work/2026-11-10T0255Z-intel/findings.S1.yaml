  # ------------------------------------------------------------------ 3. N-able N-central Able2Shell (NEW)
  - title: "N-able N-central: a researcher published proof-of-concept exploits for more than 30 unpatched flaws on 2026-11-08, including an unauthenticated XXE-to-RCE chain; N-able took Hosted N-central offline and tells on-premises customers to keep servers offline until a hotfix (ETA mid-day 2026-11-10 EST)"
    sources:
      - { url: "https://uptime.n-able.com/", publisher: "N-able (N-central critical security incident status page)", date: "2026-11-10", role: "primary" }
      - { url: "https://github.com/Oracle-Security/CVEs/tree/main/0-Days/N-Central%20N-Able", publisher: "Sean Bales (Oracle-Security/CVEs repository, N-central disclosures)", date: "2026-11-08", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/n-able-takes-cloud-platform-offline-after-30-plus-zero-days-published/", publisher: "BleepingComputer", date: "2026-11-09", role: "corroborating" }
    discovery_trace: "first seen at: bleepingcomputer feed https://www.bleepingcomputer.com/feed/ (item 'N-able takes cloud platform offline after 30+ zero-days published', 2026-11-09 21:26Z) -> pivot: article https://www.bleepingcomputer.com/news/security/n-able-takes-cloud-platform-offline-after-30-plus-zero-days-published/ -> pivot: researcher repository https://github.com/Oracle-Security/CVEs/tree/main/0-Days/N-Central%20N-Able -> primary: N-able status page https://uptime.n-able.com/ (JS single-page app; WebFetch returned an empty shell, read through `jina`, the only transport that rendered it)"
    summary: |
      FACTS (N-able, status page, read 2026-11-10). N-able opened a "N-central Critical Security Incident" on 2026-11-09 after a "public disclosure and non-responsible communication of critical vulnerabilities in N-central found by an independent researcher". It took Hosted N-central offline in the Americas, Europe and APAC and "strongly advises" on-premises customers to "take appropriate steps to secure their environments and temporarily take their N-central servers offline until further notice". Updates at 2026-11-09 19:59 UTC and 2026-11-10 00:02 UTC say the hotfix is still being built and validated, ETA "Mid-day on Nov. 10th (EST)", that N-able has "no evidence of active exploitation or unauthorized data access", and that "we have seen no indication that your environment has been impacted or compromised". Ecoverse services through N-able Login (n-able.app) stay up, including Asset View, patching, vulnerability management, scripting, and Take Control natively for Windows and Linux. N-able's last published hotfix, N-central 2026.4 HF1 of 2026-11-02, fixes the Linux, Brotli and one further CVE and is unrelated.
      CLAIMS (researcher, GitHub README). More than 30 alleged zero-days with working PoCs, tested on "N-able N-central Appliance 2026.4.0.31", a pre-release build; the author believes most or all affect earlier builds and writes "At the time of posting all vulnerabilities work on the latest pre-release version and are unpatched." Chains named in the README: an anonymous service-import XXE chain (anonymous MMS2 write primitive, pre-authentication external-entity resolution, NCI local-session trust confusion, password reset, authenticated JSP execution) giving command execution as the `nable` user and able to create an enabled Default Administrator account; an anonymous stored-XSS chain through forged patch metadata that reaches an OGNL command sink when a ProductAdmin opens the patch detail view; the same XSS entry used with the administrator's session to inject syslog-ng grammar through Audit Export and obtain root; an SIS GenericFiles path traversal that places an executable JSP in Jetty, followed by a passwordless syslog installer helper that runs a `nable`-writable configuration as root; and a constrained, ProductAdmin-authenticated heap overwrite in the GenericTCP task scanner. BleepingComputer reports the researcher confirmed the discovery was AI-assisted and calls the unauthenticated XXE-to-RCE chain the most critical; BleepingComputer has not independently verified all the flaws, and N-able's hotfix work is the only independent signal that at least some are genuine.
      GAPS. No CVE identifiers, CVSS scores, exact affected build ranges or fixed builds exist yet; the hotfix is unreleased; N-able has not said which released builds are affected. N-central is a repeat KEV product: CISA listed CVE-2026-18577 and CVE-2026-18556 in August 2026 and CVE-2026-86218 on 2026-09-08.
    region_nexus: "global, N-able Europe hosted region offline; N-central is the RMM platform of many managed service providers that serve communal and cantonal administrations (supplier exposure)"
