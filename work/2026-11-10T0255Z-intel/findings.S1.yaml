# -------------------------------------------------------------------- candidate sources, recipe news, gaps
candidate_sources:
  - id: n-able-status
    publisher: "N-able status dashboard and security blog (uptime.n-able.com, status.n-able.com release notes, n-able.com/blog)"
    url: "https://uptime.n-able.com/"
    category: vendor-psirt
    why: "First-party channel for N-central incidents and hotfixes (the product has been KEV-listed three times in 2026 and is the RMM of many MSPs). uptime.n-able.com is a script-rendered SPA: only `jina` rendered it; WebFetch got an empty shell; n-able.com/blog reads through the `extract` reader fallback."
  - id: cert-fr-cti
    publisher: "CERT-FR threat and incident reports (CTI series)"
    url: "https://cert.cyber.gouv.fr/cti/"
    category: gov
    why: "Primary for French C4 attributions and threat reports (CERTFR-2026-CTI-009 of 2026-11-09 carried the IRGC attribution). The report page gives a summary; the full text is a PDF at cert.cyber.gouv.fr/uploads/<id>.pdf readable with `fetch_source.py pdf`. The existing anssi-fr record covers the avis/alerte series on the old cert.ssi.gouv.fr host."

recipe_notes:
  - { source_id: enisa-euvd, note: "`url --direct 'https://euvdservices.enisa.europa.eu/api/search?fromDate=YYYY-MM-DD&toDate=YYYY-MM-DD&assigner=sap&size=100'` returns {items,total}; it exposed SAP's 40 Patch Day CNA records at 00:17-01:04 UTC before any SAP page was live; page=1 returns empty. The per-record URL https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-<id> is fetchable. exploitedvulnerabilities held only 4 rows today." }
  - { source_id: sap-security-notes, note: "november-2026.html returned 404 at about 03:10 UTC on Patch Day; read the CNA records through EUVD/MITRE CVE Services (https://cveawg.mitre.org/api/cve/<CVE>) until the page is live." }
  - { source_id: msrc-update-guide, note: "revised-CVE sweep works: `url --direct 'https://api.msrc.microsoft.com/sug/v2.0/en-US/vulnerability?$filter=latestRevisionDate%20ge%20<ISO>&$orderby=latestRevisionDate%20desc&$top=200'` (returned 3 Mariner rows since 2026-11-08); `msrc release 2026-Nov 300` lists the early-release rows (134)." }
  - { source_id: paloalto-psirt, note: "`url --direct https://security.paloaltonetworks.com/json/CVE-<id>` gives CVE JSON with timeline and exploits; the RSS item for a revised advisory carries the original title with the revision date." }
  - { source_id: cisa-advisories, note: "WebFetch of the listing returns 10 items with dates and hrefs (newest 2026-11-09 KEV alert); `cisa csaf-recent` newest ICS advisory icsa-26-211-07 (2026-11-05). WebFetch of the alert page returns the CVE list and a paraphrase, not the full body." }
  - { source_id: connectwise-trust-center, note: "no transport reads it this run: `url --direct` 403, `extract` (trafilatura and jina relay both blocked), WebFetch 403, security-bulletins listing path also 403; WebSearch found no November 2026 bulletin (latest: ScreenConnect 26.6.5 of 2026-09-08). Keep fetch_method blocked." }
  - { source_id: watchtowr, note: "labs RSS newest item 2026-11-05 (Barracuda); `extract https://watchtowr.com/intelligence/` returned a snapshot dated 2026-09-27 with no new FAQ, so it is not a usable freshness signal today." }
  - { source_id: citrix-netscaler-security-bulletins, note: "article pages return 403 on every transport; the RSS item `summary` field carries the full post text (verified for the 2026-11-09 pre-announcement), so read posts from the feed." }
  - { source_id: watchguard-psirt, note: "`extract https://psirt.watchguard.com/` lists CVE rows with CVSS and affected ranges but no dates; each advisory page carries its date in the metadata (the AuthPoint pages date 2026-11-04, WGSA-2026-0033 2026-11-03)." }
  - { source_id: sonicwall-psirt (not in slice), note: "psirt.global.sonicwall.com vuln-detail pages are script-rendered: `extract` serves them through jina (metadata block and workaround text, no affected/fixed table); WebFetch returns the title only. The revision date ('Last Updated') is the signal for update-of checks." }
  - { source_id: uptime.n-able.com, note: "script-rendered status SPA: only `jina https://uptime.n-able.com/` renders the timeline; WebFetch/extract return an empty shell." }

coverage_gaps:
  - { source_id: connectwise-trust-center, reason: "every transport blocked (see fetch_failures); only WebSearch, no November bulletin found" }
  - { source_id: sap-security-notes, reason: "Patch Day page not live before about 17:00 UTC; SAP notes are login-gated, so priorities (Hot News) and fixed support packages are not visible; item 4 rests on SAP's CNA records" }
  - { source_id: cisa-advisories, reason: "RSS blocked; listing read through WebFetch: 10 rows, only the 2026-11-09 KEV alert in window; no AA-series or ICS advisory in window" }
  - { source_id: watchtowr, reason: "labs RSS under-collects (vulnerability FAQs live at watchtowr.com/intelligence, whose extract is a stale snapshot); nothing new for 2026-11-09/10" }
  - { source_id: citrix-netscaler-security-bulletins, reason: "article page 403; body read from the feed (covered)" }

