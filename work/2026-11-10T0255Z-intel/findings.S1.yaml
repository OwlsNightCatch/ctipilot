    discovery_trace: "first seen at: store review of high-priority entries (entries/2026-11-07/cve-2026-19868-sonicwall-sonicos-sslvpn-saml-mfa-bypass-kev.md, primary SNWLID-2026-0014) -> re-read the vendor page https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2026-0014 (metadata 'Last Updated 2026-11-09', 'Workaround true', new workaround section) -> corroborating context: THN 2026-11-09 https://thehackernews.com/2026/11/cisa-flags-sonicwall-sonicos-mfa-bypass.html (does not mention the workaround)"
    summary: |
      FACTS. SonicWall's advisory SNWLID-2026-0014, first published 2026-11-06, now shows "Last Updated 2026-11-09" and "Workaround true", with a workaround section for CVE-2026-19868 that did not exist when the entry was written: "If SAML authentication is in use and upgrading the firmware is not possible, disable or delete any active LDAP, RADIUS, and TACACS+ authentication server configured on the firewall", with the menu paths Device, Users, Settings, Authentication, Configure RADIUS / LDAP / TACACS+, Settings, then disable or delete the active servers. The advisory's other text is unchanged as far as read: the flaw lets a user with valid credentials for an alternate authentication method bypass SAML controls and SAML-enforced MFA, "ONLY" when SAML is enabled for SSLVPN logins, and SonicWall "investigated a report indicating potential exploitation". The stored entry says in several places that there is no workaround; that is now wrong. The reader capture does not include the advisory's affected/fixed-build table (script-rendered), so whether the fixed builds changed (the entry has Gen7 7.3.4-7013 and Gen8 8.2.3-8015) could not be re-checked.
      INFERENCE (not stated by SonicWall). Removing the LDAP, RADIUS and TACACS+ servers removes the alternate authentication methods through which the bypass works; any administrator or VPN login that relies on those servers will stop working until SAML is the only method, so the workaround is an interim measure with an operational price. THN's 2026-11-09 article reports CISA's KEV listing (due 2026-11-20 for federal agencies) and does not mention the workaround.
      READ NOTE. The SonicWall PSIRT page is a script-rendered application: `extract` served it through the jina reader and WebFetch returned only the page title; the quoted text and the metadata come from that single reader capture of the vendor page.
