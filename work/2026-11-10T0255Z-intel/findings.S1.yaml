    discovery_trace: "first seen at: cisa-kev bridge (https://www.cisa.gov/known-exploited-vulnerabilities-catalog) -> CVE-2026-123158 dateAdded 2026-11-09 -> pivot: cccs-alerts feed https://www.cyber.gc.ca/api/cccs/atom/v1/get?feed=alerts_advisories&lang=en -> AV26-1130 Update 1 https://cyber.gc.ca/en/alerts-advisories/openbsd-security-advisory-av26-1130 -> pivot: SecurityWeek https://www.securityweek.com/hackers-exploiting-sshole-authentication-bypass-in-openssh/ (names WatchTowr, GreyNoise, Defused) -> pivot: BleepingComputer https://www.bleepingcomputer.com/news/security/hackers-exploit-sshole-openssh-flaw-to-breach-linux-systems/ -> primary: GreyNoise tracker https://sshole.events.greynoise.io/ ; EUVD exploited list https://euvdservices.enisa.europa.eu/api/exploitedvulnerabilities (exploitedSince 2026-11-09)"
    summary: |
      FACTS. CISA added CVE-2026-123158 to the KEV catalog on 2026-11-09 (due date 2026-11-12, forensicTriage flag "Yes"); the catalog row cites the OpenSSH release notes, Alpine's advisory and the upstream commit, and ENISA's EUVD lists it as exploited since 2026-11-09. The Canadian Cyber Centre's AV26-1130 Update 1 of 2026-11-09 repeats the KEV listing. NCSC Switzerland's advisory 13155 (last edited 2026-11-06) still reads "Current exploitation status: UNKNOWN", so the Swiss authority text now lags the CISA listing.
      CLAIMS (GreyNoise, telemetry-holding sensor operator). GreyNoise's event tracker, read 2026-11-10, says its first successful exploitation came on 2026-11-07 at 00:46 UTC, 1 day 8 h 29 min after the CVE reached NVD and about 40 h after the OpenSSH 10.6p2 release, against "a vulnerable GreyNoise gridpoint", that is, GreyNoise's own deliberately exposed sensor hosts, not customer or production systems; BleepingComputer's wording "networks protected by GreyNoise" and its count of 16 successful chains from six source addresses should be read in that light. Observed hands-on behaviour, in order: the login arrives as an sshd-session process that spawns `sh -c` running id, uname and a read of /etc/os-release; a container check; queries to the AWS, Azure and Alibaba Cloud metadata services; attempts to read root's SSH keys and the password hashes in /etc/shadow through doas without a password prompt; dropping of a Python runtime (the command history shows apk package-manager activity); writes to the authorized_keys files of root and of the default alpine user (one actor tagged its key with a marker comment); and, in one case, a single-file Python implant that GreyNoise names TAC Agent, started as an init-script startup service, which polls an HTTPS C2 that its code describes as a Cloudflare Worker every 150 s and supports shell execution, file listing/preview/download/upload and self-update. On the victim host the implant never enrolled and never received a task. GreyNoise reports the implant's comments and errors are in Chinese and that a missing-tool pre-check which replies with feedback looks like input for an automated planner; GreyNoise itself labels that last point an inference.
      CLAIMS (others). watchTowr said on X (dated 2026-11-06 by BleepingComputer, "over the weekend" per SecurityWeek) that only botnets and crypto miners had picked the flaw up so far; Previdian counts 20 attempts from 13 addresses in 9 countries; Defused saw a small number of actors. The THN weekly recap of 2026-11-09 repeats Previdian's list and names Switzerland among the source countries (an attempt origin, not a victim).
      ASSESSMENT / GAP. Still no source reports a compromised production host: every confirmed success is on honeypot or sensor infrastructure. That is the honest limit of the evidence, but a KEV listing means CISA holds evidence of exploitation it has not described.
