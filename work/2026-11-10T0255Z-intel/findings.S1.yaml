      Existing entry carries cves[].status [poc-public, patch-available] and says "CISA does not list the flaw": needs the exploited and cisa-kev statuses and the KEV wording (an `update` record, PD-13 exploitation-status change). Its sourcing_note and the "no production host" sentence stay true.
      Triage material for the entry's Detection and Triage lines (behavioural, no IOCs): (1) sshd authentication log: an "Accepted password" event for an account whose shadow password field is `*` (root, alpine, key-only users) has no benign explanation; (2) process creation with sshd-session as parent of `sh -c` running id/uname/os-release within seconds of the login, then `doas -n` invocations without a password; (3) a host that never ran Python suddenly installing it through apk from an interactive SSH session; (4) new or changed authorized_keys for root and the default alpine user, or a new init script for an unknown service; (5) a container or VM host that begins querying cloud instance-metadata endpoints from an SSH session; (6) outbound HTTPS from a server to a newly seen workers-style hostname with a fixed 150-second beacon. Benign lookalike: an administrator who logs in with a real password and runs id/uname; the discriminator is the account class (password field `*`) and the login method (password where only keys are expected). Hardening levers named by the sources: OpenSSH 10.6p2 or the distribution package plus sshd restart, `PasswordAuthentication no`, and, per Alpine's advisory already in the entry, reviewing doas use and recently created users, files and authorized keys on exposed machines. Suggested priority change: stays notable-to-high for musl hosts.
      The Hacker News (2026-11-09) and Previdian are already cited by the entry; SecurityWeek and BleepingComputer are new reading of the same telemetry (not independent first-hand observations); GreyNoise and watchTowr are.

