    summary: |
      FACTS (GPUStack maintainers' advisory). In GPUStack before v2.2.0, `get_current_user` in `gpustack/api/auth.py` promotes any request whose source is considered loopback to the built-in administrator when `force_auth_localhost` is False, the default. `client_ip_getter` can be made to report 127.0.0.1 without credentials in two ways: a same-host reverse proxy (`proxy_pass http://127.0.0.1:<port>` makes every remote request arrive from the loopback peer), or a forged `X-GPUStack-Real-IP: 127.0.0.1` header. Either gives full unauthenticated administrative access: enumerate and change users, models, workers and configuration, mint persistent admin API keys (scope `["*"]`, valid from any source address afterwards), read worker credentials and cloud/provider secrets, and, through admin-only `POST /v2/inference-backends/from-yaml`, run code on worker hosts. The advisory says the flaw "has been observed exploited in the wild against a v2.1.1 deployment (attacker-created custom backends running reverse shells)", credits Javier Sixto (ulex.fr) for that report, and fixes it in 2.2.0 by removing the loopback auto-admin path and hardening client-IP/forwarding-header handling. Workarounds: set `force_auth_localhost=true`, strip any client-supplied `X-GPUStack-Real-IP` at the edge, keep the API off untrusted networks.
      CISA added the flaw to the KEV catalog on 2026-11-09 (due 2026-11-12) and ENISA lists it as exploited since the same day; EPSS 0.0033 (FIRST, 2026-11-09). Daily Security Review (2026-11-05) adds that the date of first attacks, the number of compromised servers and the route used are unstated, and that a second critical flaw, CVE-2026-102894 (CVSS 9.1; the `/auth/saml/callback` route trusts an unverified SAMLResponse, active by default even without SAML configured; affects 0.7.1 up to before 2.2.2), is fixed only in 2.2.2; ENISA's EUVD record confirms the affected range, and the same source reports no exploitation of it. The project's repository lists at least eight further advisories published 2026-10-26 (six rated High, two Moderate; cross-tenant and authorization flaws), so staying on current 2.x is the broader lever; its releases page lists v2.3.0.
      GAPS. One exploitation observation by one researcher on one deployment, relayed by the maintainers; CISA's KEV evidence is not described; no hunt indicators published.
