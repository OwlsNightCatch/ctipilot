  - claim_id: f5128c8892
    entry: 2026-11-06/cve-2026-116779-freeswitch-sip-message-api-command-execution
    surface: "summary"
    kind: frontmatter
    text: "SignalWire's advisory of 2026-10-28 describes CVE-2026-116779 (CVSS 3.1 9.8): an inbound SIP MESSAGE to a FreeSWITCH SIP profile selects the api chat proto and runs FreeSWITCH API commands with the privileges of the FreeSWITCH process, in the default configuration of 1.11.2 and earlier, and the advisory states that exploitation of this path has been observed in the wild. BSI CERT-Bund relayed it as a critical advisory on 2026-11-04, and CISA added it to its Known Exploited Vulnerabilities catalog on 2026-11-09 on evidence of active exploitation that it does not describe; no source names an actor or victim."
  - claim_id: 058964f5b9
    entry: 2026-11-06/cve-2026-116779-freeswitch-sip-message-api-command-execution
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade every FreeSWITCH to 1.11.3, or until then set enable-chat=false on every SIP profile that does not need inbound SIP chat and remove directory users that have no password; on an instance that SIP peers could reach, rotate the SIP trunk and directory credentials stored in its configuration, because the advisory lists disclosure of configuration and credentials as an impact, the vendor says exploitation has been observed and CISA lists the flaw as exploited."
  - claim_id: a1352a6abd
    entry: 2026-11-06/cve-2026-116779-freeswitch-sip-message-api-command-execution
    surface: "cves[CVE-2026-116779]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-116779\", \"cvss\": \"9.8\", \"status\": [\"exploited\", \"cisa-kev\", \"patch-available\"], \"affected\": \"FreeSWITCH 1.11.2 and earlier; any SIP profile that accepts inbound MESSAGE, which stock conf/vanilla enables on the internal and external profiles\", \"fixed\": \"FreeSWITCH 1.11.3, which adds a per-profile enable-chat-api-proto parameter that is off unless set\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
  - claim_id: cc01ef5333
    entry: 2026-11-06/cve-2026-116779-freeswitch-sip-message-api-command-execution
    surface: "body"
    kind: cited
    text: "SignalWire's advisory GHSA-mg63-h38w-8p9p describes CVE-2026-116779: FreeSWITCH's sofia_presence_handle_sip_i_message() splits the To user of an inbound SIP MESSAGE on `+` and treats the left half as a chat proto name, the mod_dptools module registers an `api` chat interface that hands its address to switch_api_execute(), and a peer that can deliver a MESSAGE to a profile therefore selects which FreeSWITCH API command the server runs ("
    urls: ["https://github.com/signalwire/freeswitch/security/advisories/GHSA-mg63-h38w-8p9p"]
  - claim_id: 5fe10760e5
    entry: 2026-11-06/cve-2026-116779-freeswitch-sip-message-api-command-execution
    surface: "body"
    kind: cited
    text: "The impact is command execution with the privileges of the FreeSWITCH process, including arbitrary operating-system commands, disclosure of configuration and credentials and full call control, and where mod_lua is loaded, as the stock configuration does, inline Lua is a second route ("
    urls: ["https://github.com/signalwire/freeswitch/security/advisories/GHSA-mg63-h38w-8p9p"]
  - claim_id: 5099fec044
    entry: 2026-11-06/cve-2026-116779-freeswitch-sip-message-api-command-execution
    surface: "body"
    kind: cited
    text: "The advisory scores it CVSS 3.1 9.8, lists 1.11.2 and earlier as affected and 1.11.3 as patched, and states that exploitation of this path has been observed in the wild without naming an actor or a victim ("
    urls: ["https://github.com/signalwire/freeswitch/security/advisories/GHSA-mg63-h38w-8p9p"]
  - claim_id: ead2f479db
    entry: 2026-11-06/cve-2026-116779-freeswitch-sip-message-api-command-execution
    surface: "body"
    kind: cited
    text: "); CISA added the flaw to its Known Exploited Vulnerabilities catalog on 2026-11-09 ("
    urls: ["https://www.cisa.gov/news-events/alerts/2026/11/09/cisa-adds-four-known-exploited-vulnerabilities-catalog"]
  - claim_id: d8b80c69df
    entry: 2026-11-06/cve-2026-116779-freeswitch-sip-message-api-command-execution
    surface: "body"
    kind: cited
    text: "BSI CERT-Bund rated its advisory on the flaw critical and lists versions before 1.11.3 as affected ("
    urls: ["https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-4364"]
  - claim_id: f6e90deae5
    entry: 2026-11-06/cve-2026-116779-freeswitch-sip-message-api-command-execution
    surface: "body"
    kind: cited
    text: "The default posture is exposed: chat handling is on unless a profile sets `enable-chat=false`, the stock vanilla configuration leaves it on for the internal and external profiles, and the inbound ACL does not cover MESSAGE; where MESSAGE authentication is enforced (the default from 1.10.7) any one account on the profile is enough, and installations that still carry the sample directory user `default`, which has no password, need no account of their own ("
    urls: ["https://github.com/signalwire/freeswitch/security/advisories/GHSA-mg63-h38w-8p9p"]
  - claim_id: d1c327f6fe
    entry: 2026-11-06/cve-2026-116779-freeswitch-sip-message-api-command-execution
    surface: "body"
    kind: cited
    text: "The fix is a per-profile `enable-chat-api-proto` parameter that is off unless set, so the route is closed by default and a MESSAGE that selects the proto is answered with 403 and logged with the source and the requested command ("
    urls: ["https://github.com/signalwire/freeswitch/security/advisories/GHSA-mg63-h38w-8p9p"]
  - claim_id: 9e03b495e1
    entry: 2026-11-06/cve-2026-116779-freeswitch-sip-message-api-command-execution
    surface: "body"
    kind: cited
    text: "`auth-messages` alone does not close the path, and `disable_system_api_commands=true` removes the system API but leaves the route to every other registered API, module loading and call origination included ("
    urls: ["https://github.com/signalwire/freeswitch/security/advisories/GHSA-mg63-h38w-8p9p"]
  - claim_id: f9aad377a7
    entry: 2026-11-06/cve-2026-116779-freeswitch-sip-message-api-command-execution
    surface: "body"
    kind: cited
    text: "**Exposure:** a FreeSWITCH of version 1.11.2 or earlier with a SIP profile that accepts inbound MESSAGE from a peer that can reach it, which is the default configuration ("
    urls: ["https://github.com/signalwire/freeswitch/security/advisories/GHSA-mg63-h38w-8p9p"]
  - claim_id: 6885958c86
    entry: 2026-11-06/cve-2026-116779-freeswitch-sip-message-api-command-execution
    surface: "body"
    kind: cited
    text: "**Detection:** SIP signalling logs, or packet capture at the session border controller, for MESSAGE requests whose To user carries a `+` with `api` as the left half, in any letter case; after the upgrade the 403 and the log line with the source and the requested command mark attempts ("
    urls: ["https://github.com/signalwire/freeswitch/security/advisories/GHSA-mg63-h38w-8p9p"]
  - claim_id: a8f531c874
    entry: 2026-11-06/cve-2026-116779-freeswitch-sip-message-api-command-execution
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** upgrade to 1.11.3, or until then set `enable-chat=false` on every profile that does not need inbound SIP chat and remove directory users that have no password; on an instance that was reachable by SIP peers, treat its configuration and the credentials it holds as disclosed, because the vendor says exploitation has been observed and CISA lists the flaw as exploited ("
    urls: ["https://github.com/signalwire/freeswitch/security/advisories/GHSA-mg63-h38w-8p9p", "https://www.cisa.gov/news-events/alerts/2026/11/09/cisa-adds-four-known-exploited-vulnerabilities-catalog"]
  - claim_id: fbfe6fb405
    entry: 2026-11-06/cve-2026-116779-freeswitch-sip-message-api-command-execution
    surface: "body"
    kind: derived
    text: "The mechanism also implies child processes such as a shell or a downloader started by the FreeSWITCH process, and, where an instance was reachable before the fix, changes to its Lua scripts, dialplan or loaded modules."
  - claim_id: 94fc34f9e6
