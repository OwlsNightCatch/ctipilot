    text: "The fix is Faspex 5.0.19 PL1 on Linux, applied by patching the container images and checking that the faspex-core container image is 5.0.19 (1ce4b13, Fix Pack 1); IBM lists no workaround or mitigation ("
    urls: ["https://www.ibm.com/support/pages/security-bulletin-ibm-aspera-faspex-has-addressed-vulnerability-could-allow-authorization-bypass"]
