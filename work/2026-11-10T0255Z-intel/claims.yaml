    surface: "cves[CVE-2026-107154]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-107154\", \"cvss\": \"8.8\", \"status\": [\"patch-available\"], \"affected\": \"SonicOS management interface, same Gen7 and Gen8 builds; session validation flaw that in specific conditions could potentially let a remote unauthenticated attacker perform unauthorized operations (not reported exploited)\", \"fixed\": \"7.3.4-7013 and higher (Gen7); 8.2.3-8015 and higher (Gen8)\", \"auth\": \"pre-auth\", \"vector\": \"user-interaction\"}"
