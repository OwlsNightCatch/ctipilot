    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade every SonicWall Gen7 firewall and NSv that serves SAML SSLVPN logins to SonicOS 7.3.4-7013 or later and every Gen8 firewall and NSv to 8.2.3-8015 or later now, because CISA lists the flaw as exploited; where a firewall cannot be upgraded today, disable or delete its LDAP, RADIUS and TACACS+ authentication servers, the interim workaround SonicWall added on 2026-11-09."
