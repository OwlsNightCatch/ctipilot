  - claim_id: 2716d80919
    entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
    surface: "actions[0]"
    kind: frontmatter
    text: "Find every AhsayCBS server your organisation or your managed-service suppliers run, including those already on v10.3.4.0 or v9.15.2.59, and apply the hotfix v10.3.4.45 (v10) or v9.15.2.70 (v7, v8, v9) now, then reboot it; the hotfixes sit behind Ahsay's partner portal, so ask the integrator or Ahsay for the build, and until it is applied keep the management web interface behind a VPN or an allowlist of trusted addresses."
  - claim_id: 717de89708
    entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
    surface: "actions[1]"
    kind: frontmatter
    text: "Compromise-check every AhsayCBS server that was internet-reachable since 2026-10-04 against the indicators Huntress and Bitdefender publish, an OpenSSH service nobody installed included, and against Horizon3's server-side checks (new .jsp files in served application directories, replication receivers created outside a change window, unexpected system administrator accounts), and re-image any host with a confirmed compromise from a trusted backup, because the hotfix does not remove a webshell or a persistence mechanism that is already there; a missing webshell file does not show a clean host because one family deletes itself, and the credentials stored on or reachable from the server, those held in AhsayCBS and in other backup software on the same network included, must be rotated."
