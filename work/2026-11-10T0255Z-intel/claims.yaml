    entry: 2026-11-04/cve-2026-116606-barracuda-esg-auth-bypass-root-rce
    surface: "summary"
    kind: frontmatter
    text: "Barracuda's advisory of 2026-11-02 covers CVE-2026-116606, a pre-authentication authorization bypass in the Email Security Gateway (CVSS 9.3) that lets an unauthenticated remote attacker restore a crafted backup archive through the configuration-import function, and CVE-2026-111560, a command injection in the timezone field (8.6) that also affects the Load Balancer ADC, Message Archiver, WAF Control Center, Web Application Firewall and Web Security Gateway; chained, they give root. watchTowr Labs showed on 2026-11-05 that the chain needs no account, one unauthenticated request to the login handler reaching the restore function, and Barracuda changed its advisory the same day to say authentication is not required for CVE-2026-116606, only that the administrative interface must be reachable; watchTowr published a detection tool. Barracuda added on 2026-11-09 that it has identified exploitation activity affecting a small number of organizations, without naming the flaw, and the Canadian Cyber Centre says open-source reporting indicates CVE-2026-116606 is exploited in the wild. Barracuda names firmware 9.4.0.029 as the fixed build while the CVE record lists builds before 9.4.0.030 as affected."
