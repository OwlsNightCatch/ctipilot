  - claim_id: 921f9980ee
    entry: 2026-11-06/cve-2026-123158-openssh-musl-no-pam-password-bypass-sshole
    surface: "summary"
    kind: frontmatter
    text: "OpenSSH Portable 10.6p2 of 2026-11-05 works around CVE-2026-123158, a password-authentication bypass on Linux systems that use musl libc and run sshd without PAM, Alpine's default OpenSSH server and OpenWrt among them: a password of 257 to 1,024 bytes logs in to an account whose password field is *. NCSC Switzerland published an advisory the same day and rates exploitation unknown; Alpine shipped fixed packages for every branch back to 3.16. CISA added the flaw to its Known Exploited Vulnerabilities catalog on 2026-11-09, and GreyNoise records hands-on logins on its gridpoints from 2026-11-07 that ended in a dropped Python implant; Previdian counts 22 attempts from 14 addresses as of 2026-11-10 and SANS ISC's honeypots saw attempts from 2026-11-05, and no source reports a compromised production host."
  - claim_id: 5fd9f58a68
    entry: 2026-11-06/cve-2026-123158-openssh-musl-no-pam-password-bypass-sshole
    surface: "actions[0]"
    kind: frontmatter
    text: "On every musl-based Linux host that runs sshd (Alpine, OpenWrt, Buildroot, Yocto), install OpenSSH 10.6p2 or the distribution's fixed openssh package and restart sshd, because updating the package does not replace the running server, and rebuild container and cloud images from a fixed base; until then set PasswordAuthentication no in sshd_config and restart sshd."
  - claim_id: 3e9706b9b7
    entry: 2026-11-06/cve-2026-123158-openssh-musl-no-pam-password-bypass-sshole
    surface: "actions[1]"
    kind: frontmatter
    text: "On each such host that allowed password logins while reachable, search the sshd log for an accepted password on an account whose password field is *, and check root's and the default alpine user's authorized_keys for keys nobody added and the init scripts for a service nobody installed, because CISA lists the flaw as exploited and GreyNoise saw both persistence steps."
