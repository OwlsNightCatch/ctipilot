    entry: 2026-11-10/ibm-aspera-faspex-cve-2026-123218-admin-takeover-kev
    surface: "headline"
    kind: frontmatter
    text: "CISA lists IBM Aspera Faspex 5 admin takeover as exploited; patch to 5.0.19 PL1, IBM names no workaround"
  - claim_id: 0a5b0047b9
    entry: 2026-11-10/ibm-aspera-faspex-cve-2026-123218-admin-takeover-kev
    surface: "summary"
    kind: frontmatter
    text: "IBM's bulletin of 2026-11-07 fixes CVE-2026-123218 in Aspera Faspex 5.0.0 through 5.0.19, an incorrect-authorization flaw that lets a user craft a specific message to bypass authorization and gain full administrative privileges (CVSS 3.1 9.8); the fix is 5.0.19 PL1 on Linux, applied by patching the container images, and IBM lists no workaround. CISA added the flaw to its Known Exploited Vulnerabilities catalog on 2026-11-09 on evidence of active exploitation that it does not describe; IBM's bulletin does not mention exploitation."
  - claim_id: 0f376f7b45
    entry: 2026-11-10/ibm-aspera-faspex-cve-2026-123218-admin-takeover-kev
    surface: "actions[0]"
    kind: frontmatter
    text: "Patch every IBM Aspera Faspex 5 server on Linux to 5.0.19 PL1 by patching its container images (the faspex-core image must read 5.0.19, Fix Pack 1), portals reachable from the internet first, then review the administrator accounts, API keys and shares created since the server was reachable, because IBM lists no workaround and the fix does not undo an administrator takeover."
  - claim_id: 9c4f5f9822
    entry: 2026-11-10/ibm-aspera-faspex-cve-2026-123218-admin-takeover-kev
    surface: "cves[CVE-2026-123218]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-123218\", \"cvss\": \"9.8\", \"status\": [\"exploited\", \"cisa-kev\", \"patch-available\"], \"affected\": \"IBM Aspera Faspex 5.0.0 through 5.0.19; IBM's description says an authorized user is needed, while its CVSS vector says no privileges are required\", \"fixed\": \"5.0.19 PL1 (Fix Pack 1) on Linux, applied by patching the container images; no workaround\", \"auth\": \"post-auth\", \"vector\": \"zero-click\"}"
