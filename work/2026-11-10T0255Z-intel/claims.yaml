    text: "Pull SAP Security Notes 3849308, 3778556, 3778530 and 3798345 as soon as SAP's Patch Day page lists them and apply the kernel or support-package fix each names, starting with systems whose Web Dispatcher, Internet Communication Manager or Gateway ports are reachable from untrusted networks."
