    surface: "cves[CVE-2026-82308]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-82308\", \"cvss\": \"7.5\", \"status\": [\"patch-available\"], \"affected\": \"SonicOS SSL-VPN service, same Gen7 and Gen8 builds; pre-authentication heap buffer overflow that could potentially cause an application-level denial of service (not reported exploited)\", \"fixed\": \"7.3.4-7013 and higher (Gen7); 8.2.3-8015 and higher (Gen8)\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
  - claim_id: 920e5f5e0f
    entry: 2026-11-07/cve-2026-19868-sonicwall-sonicos-sslvpn-saml-mfa-bypass-kev
    surface: "body"
    kind: cited
    text: "SonicWall's advisory SNWLID-2026-0014 of 2026-11-06 fixes seven SonicOS flaws on Gen7 and Gen8 firewalls, and one of them, CVE-2026-19868, is an authentication enforcement weakness in the SSLVPN service: a user with valid credentials for an alternate authentication method may bypass the SAML authentication controls, and successful exploitation may also bypass SAML-enforced multi-factor authentication ("
    urls: ["https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2026-0014"]
  - claim_id: 648b1e47c3
    entry: 2026-11-07/cve-2026-19868-sonicwall-sonicos-sslvpn-saml-mfa-bypass-kev
    surface: "body"
    kind: cited
    text: "SonicWall says the flaw only affects SSLVPN when SAML is enabled for SSLVPN logins, and scores it CVSS 3.1 7.1 as a use of single-factor authentication (CWE-308) ("
    urls: ["https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2026-0014"]
  - claim_id: 993e62b5f8
    entry: 2026-11-07/cve-2026-19868-sonicwall-sonicos-sslvpn-saml-mfa-bypass-kev
    surface: "body"
    kind: cited
    text: "The advisory says SonicWall PSIRT \"has investigated a report indicating potential exploitation\" and urges customers to upgrade ("
    urls: ["https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2026-0014"]
  - claim_id: a70359e013
    entry: 2026-11-07/cve-2026-19868-sonicwall-sonicos-sslvpn-saml-mfa-bypass-kev
    surface: "body"
    kind: cited
    text: "); its revision of 2026-11-09 adds an interim workaround for SAML deployments that cannot upgrade, to disable or delete every active LDAP, RADIUS and TACACS+ authentication server on the firewall ("
    urls: ["https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2026-0014"]
  - claim_id: 341745c89b
    entry: 2026-11-07/cve-2026-19868-sonicwall-sonicos-sslvpn-saml-mfa-bypass-kev
    surface: "body"
    kind: cited
    text: "); CISA added the flaw to its Known Exploited Vulnerabilities catalog on 2026-11-06 \"based on evidence of active exploitation\" ("
    urls: ["https://www.cisa.gov/news-events/alerts/2026/11/06/cisa-adds-one-known-exploited-vulnerability-catalog"]
  - claim_id: ebb6fa87bc
    entry: 2026-11-07/cve-2026-19868-sonicwall-sonicos-sslvpn-saml-mfa-bypass-kev
    surface: "body"
    kind: cited
    text: "SonicWall has not shared details about the reported exploitation ("
    urls: ["https://www.bleepingcomputer.com/news/security/sonicwall-warns-of-new-ssl-vpn-mfa-bypass-flaw-exploited-in-attacks/"]
  - claim_id: bbf572dd6a
    entry: 2026-11-07/cve-2026-19868-sonicwall-sonicos-sslvpn-saml-mfa-bypass-kev
    surface: "body"
    kind: cited
    text: "The advisory applies one table to all seven flaws: Gen7 hardware firewalls (TZ, NSa and NSsp) and Gen7 NSv up to and including 7.3.3-7015 are fixed in 7.3.4-7013 and higher, and Gen8 hardware firewalls (TZ and NSa) and Gen8 NSv up to and including 8.2.2-8015 are fixed in 8.2.3-8015 and higher ("
    urls: ["https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2026-0014"]
  - claim_id: e8483ad828
    entry: 2026-11-07/cve-2026-19868-sonicwall-sonicos-sslvpn-saml-mfa-bypass-kev
    surface: "body"
    kind: cited
    text: "It also fixes two management-interface flaws scored 8.8 that in specific conditions could potentially let a remote unauthenticated attacker perform unauthorized operations, and that need user interaction, a pre-authentication heap overflow in the SSL-VPN service that could cause a denial of service, and three lower-severity flaws; no source reports them exploited ("
    urls: ["https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2026-0014"]
  - claim_id: 7a1ad83601
    entry: 2026-11-07/cve-2026-19868-sonicwall-sonicos-sslvpn-saml-mfa-bypass-kev
    surface: "body"
    kind: cited
    text: "**Exposure:** a Gen7 or Gen8 SonicWall firewall or NSv at or below the builds above with the SSL VPN enabled and SAML configured as a login method for SSLVPN; the running SonicOS build is the first check and the SAML setting for SSLVPN the second, the vendor's stated precondition ("
    urls: ["https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2026-0014"]
  - claim_id: 2955e3f009
    entry: 2026-11-07/cve-2026-19868-sonicwall-sonicos-sslvpn-saml-mfa-bypass-kev
    surface: "body"
    kind: derived
    text: "**Detection:** the advisory gives no indicators."
  - claim_id: d9774ce26f
    entry: 2026-11-07/cve-2026-19868-sonicwall-sonicos-sslvpn-saml-mfa-bypass-kev
    surface: "body"
    kind: derived
    text: "From the stated mechanism, compare successful SSLVPN logins on the firewall with the identity provider's sign-in log: a VPN session with no matching SAML sign-in or MFA event, or a SAML-enrolled user who authenticated through another authentication method, is the signal."
  - claim_id: adcaca0172
    entry: 2026-11-07/cve-2026-19868-sonicwall-sonicos-sslvpn-saml-mfa-bypass-kev
    surface: "body"
    kind: derived
    text: "Patching does not evict an attacker who already holds a session or reuses the credentials, so review VPN sessions since SAML was enabled and reset the credentials of accounts that work through both authentication methods; once the workaround is applied, logins through the removed authentication methods should stop, and any that continue show the change did not take effect or that the session predates it."
  - claim_id: 6e3244548a
    entry: 2026-11-07/cve-2026-19868-sonicwall-sonicos-sslvpn-saml-mfa-bypass-kev
    surface: "body"
    kind: derived
    text: "**Triage:** a legitimate SAML sign-in leaves an event at the identity provider; a login through the alternate path does not, which follows from the stated mechanism."
  - claim_id: 8124a870f7
    entry: 2026-11-07/cve-2026-19868-sonicwall-sonicos-sslvpn-saml-mfa-bypass-kev
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** upgrade every Gen7 and Gen8 firewall that serves SAML SSLVPN logins to 7.3.4-7013 or 8.2.3-8015 or later now, because the exploitation evidence is a vendor-investigated report plus CISA's listing; where a firewall cannot be upgraded today, disable or delete its LDAP, RADIUS and TACACS+ authentication servers as the advisory now says, and expect logins that rely on those servers to stop; then review VPN sessions for logins that skipped the identity provider."
  - claim_id: 14134ac26a
    entry: 2026-11-07/cve-2026-19868-sonicwall-sonicos-sslvpn-saml-mfa-bypass-kev
    surface: "section 2026-11-10T03:39:01Z"
    kind: cited
    text: "SonicWall revised advisory SNWLID-2026-0014 on 2026-11-09 and added a workaround for CVE-2026-19868: if SAML authentication is in use and upgrading the firmware is not possible, disable or delete any active LDAP, RADIUS and TACACS+ authentication server configured on the firewall, through Device, Users, Settings, Authentication and the Configure page of each of the three methods ("
    urls: ["https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2026-0014"]
  - claim_id: 36536c2fce
    entry: 2026-11-07/cve-2026-19868-sonicwall-sonicos-sslvpn-saml-mfa-bypass-kev
    surface: "section 2026-11-10T03:39:01Z"
    kind: cited
    text: "The advisory's first version named no workaround ("
    urls: ["https://www.bleepingcomputer.com/news/security/sonicwall-warns-of-new-ssl-vpn-mfa-bypass-flaw-exploited-in-attacks/"]
  - claim_id: 3d1baf3a9b
    entry: 2026-11-07/cve-2026-19868-sonicwall-sonicos-sslvpn-saml-mfa-bypass-kev
    surface: "section 2026-11-10T03:39:01Z"
    kind: uncited
    text: "It still urges upgrading; the workaround removes the alternate authentication methods through which the bypass works, which means any administrator or VPN login that relies on those servers stops working until SAML is the only method (an inference from the mechanism, not a SonicWall statement)."
  - claim_id: d66224a1d9
    entry: 2026-11-07/cve-2026-19868-sonicwall-sonicos-sslvpn-saml-mfa-bypass-kev
    surface: "record 2026-11-10T03:39:01Z"
    kind: record-summary
    text: "SonicWall revised advisory SNWLID-2026-0014 on 2026-11-09 to add an interim workaround for SAML deployments that cannot upgrade: disable or delete every active LDAP, RADIUS and TACACS+ authentication server. The entry's statements that there is no workaround are corrected and the upgrade stays the primary action."
