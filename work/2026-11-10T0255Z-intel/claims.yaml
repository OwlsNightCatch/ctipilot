    entry: 2026-11-10/sap-november-2026-cna-records-four-unauth-cvss-10-rows
    surface: "headline"
    kind: frontmatter
    text: "SAP's CVE records list four unauthenticated CVSS 10.0 flaws in Web Dispatcher, ICM, Gateway and the ABAP SAML2 service"
  - claim_id: 0aaaa4d7d5
    entry: 2026-11-10/sap-november-2026-cna-records-four-unauth-cvss-10-rows
    surface: "summary"
    kind: frontmatter
    text: "SAP, acting as CNA, published CVE records on 2026-11-10 for four flaws it scores CVSS 3.1 10.0, reachable over the network with no privileges or user interaction: an authentication bypass in the SAML2 service provider of NetWeaver AS ABAP and the ABAP Platform that lets an attacker impersonate any user, privileged accounts included, under certain configurations, memory corruption in SAP Web Dispatcher and in the NetWeaver ABAP Internet Communication Manager that could allow arbitrary code execution, and a default access control list in SAP Gateway that treats an external attacker as an internal application server. The fixes are SAP Security Notes 3849308, 3778556, 3778530 and 3798345, which need an SAP login, and SAP's November Patch Day page was not yet published when the records were read; no record names exploitation or a public proof of concept."
