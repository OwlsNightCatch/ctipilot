    entry: 2026-11-07/cve-2026-19868-sonicwall-sonicos-sslvpn-saml-mfa-bypass-kev
    surface: "summary"
    kind: frontmatter
    text: "SonicWall's advisory SNWLID-2026-0014 of 2026-11-06 fixes CVE-2026-19868, an SSLVPN authentication enforcement flaw (CVSS 3.1 7.1) that lets a user with valid credentials for an alternate authentication method bypass SAML, MFA enforced through SAML included, on Gen7 firewalls up to 7.3.3-7015 and Gen8 up to 8.2.2-8015 when SAML is enabled for SSLVPN logins. SonicWall says it investigated a report indicating potential exploitation and CISA lists the flaw as exploited; 7.3.4-7013 and 8.2.3-8015 fix it, and since 2026-11-09 the advisory also names an interim workaround for firewalls that cannot upgrade: disable or delete every active LDAP, RADIUS and TACACS+ authentication server."
  - claim_id: e5dc7aa273
