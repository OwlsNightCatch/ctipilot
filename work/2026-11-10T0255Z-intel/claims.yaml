    entry: 2026-11-10/bluephishing-entra-agent-blueprint-consent-phishing-poc
    surface: "headline"
    kind: frontmatter
    text: "BluePhishing: consent to a rogue Entra agent blueprint gives tenant access, and default users can soon create blueprints"
  - claim_id: 41df7af655
    entry: 2026-11-10/bluephishing-entra-agent-blueprint-consent-phishing-poc
    surface: "summary"
    kind: frontmatter
    text: "Proofpoint describes BluePhishing, a research proof of concept that extends OAuth consent phishing to Microsoft Entra Agent ID: a victim who consents to an attacker's multi-tenant agent blueprint gets a blueprint principal with an agent-creation permission that Proofpoint says cannot be revoked, and the attacker then creates agent identities, up to 250 per blueprint, that inherit the consented permissions, which Microsoft's documentation says neither the Entra portal nor Microsoft Graph shows. Proofpoint has identified no in-the-wild activity, and Microsoft 365 message MC1506733 says default Entra users will be able to create agent blueprints from November 2026."
  - claim_id: 3334eb8806
    entry: 2026-11-10/bluephishing-entra-agent-blueprint-consent-phishing-poc
    surface: "body"
    kind: cited
    text: "The attacker builds an agent blueprint, the agent analogue of an app registration, in their own tenant with a client secret and permissions set to be inherited, sets its sign-in audience to work across tenants (a setting the Entra portal does not expose, so it takes Microsoft Graph, PowerShell or a manifest edit), and sends the victim a one-time consent link ("
    urls: ["https://www.proofpoint.com/us/blog/threat-insight/BluePhishing-Initial-Access-via-Third-Party-Agent-Blueprint-Consent"]
  - claim_id: e9e0ecd544
    entry: 2026-11-10/bluephishing-entra-agent-blueprint-consent-phishing-poc
    surface: "body"
    kind: cited
    text: "When a victim consents, a blueprint principal appears in the victim tenant with the AgentIdentity.CreateAsManager permission, which Proofpoint says cannot be revoked from the principal; the attacker then obtains an app-only Graph token for the victim tenant and creates agent identities, up to 250 per blueprint, that inherit the consented permissions ("
    urls: ["https://www.proofpoint.com/us/blog/threat-insight/BluePhishing-Initial-Access-via-Third-Party-Agent-Blueprint-Consent"]
  - claim_id: 0c08e02c19
    entry: 2026-11-10/bluephishing-entra-agent-blueprint-consent-phishing-poc
    surface: "body"
    kind: cited
    text: "Creating one needs the victim's tenant ID and the object ID of a sponsor user, both obtainable through documented unauthenticated lookups, and Proofpoint's tests used the Graph permissions User.Read.All and Group.Read.All ("
    urls: ["https://www.proofpoint.com/us/blog/threat-insight/BluePhishing-Initial-Access-via-Third-Party-Agent-Blueprint-Consent"]
  - claim_id: 9e45aebac9
    entry: 2026-11-10/bluephishing-entra-agent-blueprint-consent-phishing-poc
    surface: "body"
    kind: cited
    text: "Proofpoint, citing Microsoft's documentation, says inherited permissions are not visible in the Entra portal or in Microsoft Graph, which limits auditing what an agent identity can do; in its tests silent inheritance appeared only for delegated permissions, those granted through user consent ("
    urls: ["https://www.proofpoint.com/us/blog/threat-insight/BluePhishing-Initial-Access-via-Third-Party-Agent-Blueprint-Consent"]
  - claim_id: 298715da0e
    entry: 2026-11-10/bluephishing-entra-agent-blueprint-consent-phishing-poc
    surface: "body"
    kind: cited
    text: "Proofpoint has identified no in-the-wild activity and says agent consent controls are less mature and less widely deployed than app consent controls; it adds that Microsoft 365 Message Center item MC1506733 says default Entra users will be able to create agent blueprints from November 2026 ("
    urls: ["https://www.proofpoint.com/us/blog/threat-insight/BluePhishing-Initial-Access-via-Third-Party-Agent-Blueprint-Consent"]
  - claim_id: 0b4ae8482a
    entry: 2026-11-10/bluephishing-entra-agent-blueprint-consent-phishing-poc
    surface: "body"
    kind: cited
    text: "**Exposure:** a Microsoft Entra tenant whose users or administrators can be led to approve a consent link; Proofpoint says the user consent settings that limit third-party app consent also extend to agent blueprints and their agent identities ("
    urls: ["https://www.proofpoint.com/us/blog/threat-insight/BluePhishing-Initial-Access-via-Third-Party-Agent-Blueprint-Consent"]
  - claim_id: 92d22b8203
    entry: 2026-11-10/bluephishing-entra-agent-blueprint-consent-phishing-poc
    surface: "body"
    kind: cited
    text: "**Detection:** Proofpoint says agent and blueprint events surface in the Entra audit log as app consent operations do, the creation of an agent identity blueprint as \"Add application\" and the creation of an agent identity as \"Add service principal\", and that the blueprint ID is the same in every tenant that consents to it, so a known malicious blueprint can be searched for across tenants ("
    urls: ["https://www.proofpoint.com/us/blog/threat-insight/BluePhishing-Initial-Access-via-Third-Party-Agent-Blueprint-Consent"]
  - claim_id: e9237b9459
    entry: 2026-11-10/bluephishing-entra-agent-blueprint-consent-phishing-poc
    surface: "body"
    kind: uncited
    text: "Proofpoint presents BluePhishing, a proof of concept that extends OAuth consent phishing to Microsoft Entra Agent ID."
  - claim_id: 641bee269c
    entry: 2026-11-10/bluephishing-entra-agent-blueprint-consent-phishing-poc
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** review the tenant's user consent settings and permission classifications before the November 2026 default lets default Entra users create agent blueprints, and look in the audit log for blueprint and agent-identity creations that nobody in IT made; no attacks have been reported, so this is a hardening decision, not an incident response."
