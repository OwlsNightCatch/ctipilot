    entry: 2026-11-06/cve-2026-123158-openssh-musl-no-pam-password-bypass-sshole
    surface: "body"
    kind: cited
    text: "OX Security explains the mechanism: musl's crypt() refuses inputs over 256 bytes and returns the string `*`, `*` is also what /etc/shadow holds for an account with no valid password, and OpenSSH reads the two matching values as a successful login; the conditions are sshd on musl without PAM, password logins enabled, an account whose password field is `*` and at least one other account with a real password, and OX scores the flaw CVSS 3.1 8.1 ("
    urls: ["https://www.ox.security/blog/openssh-authentication-bypass-cve-2026-123158/"]
