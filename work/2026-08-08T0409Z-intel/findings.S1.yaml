      Detection concept: Screen Sharing (VNC, TCP/5900 and the macOS-specific negotiation on TCP/5988/mDNS discovery) exposed to any untrusted network segment is the exposure to hunt for; there is no known persistent artefact for CVE-2026-65400 specifically since Apple frames it as an auth-state bug rather than a post-exploitation primitive. Hardening: disable Screen Sharing (System Settings → General → Sharing) wherever not required; where required, restrict to a defined allow-list of client IPs / VPN-only access; do not treat SIP as a compensating control — per fG!'s independent research on the related screensharingd bug, SIP does not block the pre-auth network access path, only some post-access code-execution routes.
