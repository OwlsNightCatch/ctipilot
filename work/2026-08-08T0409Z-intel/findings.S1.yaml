  - title: "CVE-2026-8037 — Progress Kemp LoadMaster unauthenticated command injection moves to CISA KEV, five weeks after PoC and first exploitation attempts"
    sources:
      - { url: "https://www.cisa.gov/news-events/alerts/2026/08/07/cisa-adds-one-known-exploited-vulnerability-catalog", publisher: "CISA", date: "2026-08-07", role: "primary" }
      - { url: "https://labs.watchtowr.com/enterprise-tech-in-shell-out-progress-kemp-loadmaster-uninitialized-heap-to-pre-auth-rce-cve-2026-8037/", publisher: "watchTowr Labs", date: "2026-06-29", role: "primary" }
      - { url: "https://www.esentire.com/security-advisories/progress-kemp-loadmaster-vulnerability-targeted-cve-2026-8037", publisher: "eSentire TRU", date: "2026-06-30", role: "corroborating" }
      - { url: "https://community.progress.com/s/article/LoadMaster-Critical-Security-Bulletin-June-2026-CVE-2026-8037-CVE-2026-33691", publisher: "Progress Software", date: "2026-06-04", role: "corroborating" }
    discovery_trace: "first seen at: cisa-kev bridge, URL https://www.cisa.gov/known-exploited-vulnerabilities-catalog (dateAdded 2026-08-07) → primary: CISA KEV addition alert, URL https://www.cisa.gov/news-events/alerts/2026/08/07/cisa-adds-one-known-exploited-vulnerability-catalog → pivot: enisa-euvd bridge confirming CVSS/EPSS (EUVD-2026-34260) → primary root-cause: watchTowr Labs, URL https://labs.watchtowr.com/enterprise-tech-in-shell-out-progress-kemp-loadmaster-uninitialized-heap-to-pre-auth-rce-cve-2026-8037/ → corroborating: eSentire TRU advisory"
    summary: |
      CISA added CVE-2026-8037 to its Known Exploited Vulnerabilities catalog on 2026-08-07 "based on evidence of active exploitation," five weeks after a working exploit and the first observed attempts. The flaw sits in escape_quotes(), a helper in Progress Kemp LoadMaster's access binary that sanitises the apiuser/apipass JSON fields on the unauthenticated /accessv2 endpoint (reachable whenever the LoadMaster API is enabled). The pre-patch function allocates its output with malloc() and never null-terminates it; an attacker sends apiuser containing four single quotes (each quote expands to 4 escaped bytes, letting the attacker overwrite the first 0x10 bytes of an adjacent freed heap chunk and erase its allocator metadata) while spraying the request body with extra JSON key/value pairs via json_fill_param() so a second, attacker-controlled command-injection payload lands in the chunk immediately following the escaped buffer. Because that buffer is never null-terminated, sprintf_chk() reads straight past it into the sprayed payload, and the resulting shell command runs as root — no credentials, no user interaction. Vulnerable: Kemp LoadMaster GA ≤7.2.63.1 and LTSF ≤7.2.54.17 with the API enabled; fixed in GA 7.2.63.2 / LTSF 7.2.54.18 (Progress bulletin, 2026-06-04). Public PoC landed 2026-06-29 (discoverer: Syed Ibrahim Ahmed of TrendAI Research, ZDI-26-342); eSentire's initial telemetry the same day showed exploitation attempts that had not yet produced successful post-compromise activity. The KEV addition confirms that has since changed. CISA set an unusually short remediation due date of 2026-08-10.
    region_nexus: "global; LoadMaster is an edge load-balancer/ADC commonly deployed in front of internal services, including in CH/EU public-sector and CI environments"
