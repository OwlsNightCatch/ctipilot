      - { url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0280", publisher: "NCSC-NL", date: "2026-08-07", role: "corroborating" }
      - { url: "https://reverse.put.as/2026/07/29/its-a-pre-auth-stupid/", publisher: "fG! (reverse.put.as)", date: "2026-07-29", role: "background" }
    discovery_trace: "first seen at: advisories-ncsc-nl RSS, URL https://advisories.ncsc.nl/rss/advisories (NCSC-2026-0280, published 2026-08-07T11:39:25Z) → primary: Apple security-content page, URL https://support.apple.com/en-us/148170 → pivot: WebSearch (\"Alfredo Pesoli macOS Screen Sharing vulnerability writeup CVE-2026-65400\") → background context: fG! / reverse.put.as, URL https://reverse.put.as/2026/07/29/its-a-pre-auth-stupid/"
    summary: |
      Apple's macOS Tahoe 26.6.1 (with matching Sequoia 15.7.9 and Sonoma 14.8.9) update, released 2026-08-06, fixes CVE-2026-65400 in Screen Sharing — the daemon behind macOS's built-in VNC-based remote-desktop feature. Apple's own advisory describes it plainly: "An attacker on the network may be able to authenticate to Screen Sharing without valid credentials," caused by "an authentication issue... addressed with improved state management" (CWE-287, per NCSC-NL's corroborating advisory). Credited to Alfredo Pesoli (@__rev) via the Bynario Atlas (bynar.io) research program; secondary reporting states the bug was surfaced through an automated, GPT-5.5-assisted vulnerability-discovery workflow. No in-the-wild exploitation has been reported. Context worth flagging for defenders: this fix lands exactly one week after a separate, contested pre-auth vulnerability in the same screensharingd daemon — publicly described (2026-07-29) by veteran macOS reverse-engineer fG!, who says he found an unrelated bug allowing pre-auth arbitrary file read/write as root (demonstrated by downloading /etc/sudoers with no credentials) that Apple's 26.6 release (2026-07-27) patched but mis-categorised in its bulletin as a mere denial-of-service fix, understating its true severity; fG! explicitly states the Bynario Atlas team "didn't hit the same bug." Because two distinct severe authentication/state-handling defects have now surfaced in screensharingd within two release cycles, defenders should treat both 26.6 and 26.6.1 as required, and should disable Screen Sharing on any Mac where it is not actively needed rather than relying on patch level alone.
