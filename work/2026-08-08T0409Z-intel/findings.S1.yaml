        attribution: "CISA (Acknowledgments)"
        source_url: "https://www.cisa.gov/news-events/ics-advisories/icsa-26-219-01"
    extended_notes: |
      No detection concept is available at the network layer defenders normally control — CPDLC exposure is a physical/RF-domain issue for air navigation service providers and airlines, not an enterprise IT control. Included for CH/EU transport-sector situational awareness and because the discovering researcher is Swiss; flagging to sector defenders (airlines, ANSPs, aviation regulators) that ATN-B1 CPDLC message integrity cannot currently be trusted and that a reversion-to-voice contingency plan is the only available mitigation. Only one primary source (CISA, acting as the coordinating/publishing national authority for this multi-vendor/standards-level advisory) was available — no independent second source corroborating the same claims was found in this run, hence SINGLE-SOURCE-NATIONAL-CERT rather than MULTI-SOURCE.
    borderline: true
    borderline_reason: "CVSS tops out at 7.1 (HIGH, not CRITICAL) and there is no enterprise-IT mitigation lever; included primarily for sector/region relevance (transport, Swiss discoverer) rather than conventional exploitability severity."
