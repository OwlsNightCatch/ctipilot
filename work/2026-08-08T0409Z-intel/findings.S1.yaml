      - quote: "The vulnerability affects the following versions, when the API is enabled: Kemp LoadMaster: GA v7.2.63.1 and older; Kemp LoadMaster: LTSF v7.2.54.17 and older"
        attribution: "watchTowr Labs"
        source_url: "https://labs.watchtowr.com/enterprise-tech-in-shell-out-progress-kemp-loadmaster-uninitialized-heap-to-pre-auth-rce-cve-2026-8037/"
