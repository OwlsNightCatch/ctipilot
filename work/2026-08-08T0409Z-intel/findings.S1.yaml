  - title: "Three new Flowise CVEs land as the vendor company winds down — auth-bypass, IDOR and missing-authorization flaws with no company-backed fix on the horizon"
    sources:
      - { url: "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-2703", publisher: "BSI (CERT-Bund WID)", date: "2026-08-06", role: "primary" }
      - { url: "https://cve.threatint.com/CVE/CVE-2026-70636", publisher: "THREATINT (CVE record aggregator)", date: "2026-08-06", role: "corroborating" }
      - { url: "https://www.vulncheck.com/advisories/flowise-authentication-bypass-via-oauth2-credential-refresh-endpoint", publisher: "VulnCheck", date: "2026-08-06", role: "corroborating" }
      - { url: "https://flowiseai.com/sunset", publisher: "FlowiseAI", date: "2026", role: "corroborating" }
    discovery_trace: "first seen at: bsi-rss feed, URL https://wid.cert-bund.de/content/public/securityAdvisory/rss (WID-SEC-2026-2703, published 2026-08-07T10:36Z) → primary: BSI CSAF record WID-SEC-2026-2703, URL https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-2703 → pivot: WebSearch (\"CVE-2026-70636 Flowise vulnerability\") → corroborating: THREATINT CVE record, URL https://cve.threatint.com/CVE/CVE-2026-70636 → corroborating: VulnCheck advisory, URL https://www.vulncheck.com/advisories/flowise-authentication-bypass-via-oauth2-credential-refresh-endpoint → context: FlowiseAI sunset announcement, URL https://flowiseai.com/sunset"
    summary: |
      BSI's CERT-Bund flagged three new CVEs in Flowise (an open-source visual builder for LLM/AI-agent workflows) on 2026-08-06/07, marking the advisory UNGEPATCHT (unpatched) — all affect versions ≤3.1.4 with no fixed release listed. CVE-2026-67622 is the most severe (CVSS 9.9 critical): an IDOR in Flowise's OpenAI Assistants integration resolves a supplied credential UUID without checking it belongs to the caller's workspace, so any authenticated user who learns another workspace's OpenAI credential UUID can make the Flowise server decrypt and use that victim's API key — a confused-deputy that lets an attacker enumerate assistants, read vector-store contents and uploaded files, upload new files into the victim's OpenAI account, and burn the victim's API quota. CVE-2026-70636 (CVSS3.1 7.5 / CVSS4.0 8.7) is an authentication-bypass that reaches the OAuth2-credential-refresh endpoint entirely unauthenticated: the auth middleware (packages/server/src/utils/constants.ts) does prefix-based whitelist matching, so appending a trailing credential identifier to the allow-listed route path defeats the check and triggers unauthorized OAuth token rotation against any workspace's credentials — this is itself a bypass of an earlier fix, CVE-2026-41273. CVE-2026-67621 (CVSS3.1 7.6) is a missing-authorization flaw letting a view-only workspace member hit unprotected document-store upsert/refresh mutation endpoints directly, triggering ingestion, burning embedding-API credits, and modifying chatflow knowledge bases. These land days after FlowiseAI announced on flowiseai.com/sunset that the company is winding down commercial operations — the codebase stays on GitHub under Apache 2.0 for community forks, but there is no vendor left to ship an official fix, so any organisation still running Flowise should not expect a patched release for these three CVEs and needs its own compensating controls (workspace credential isolation review, network restriction of the OAuth2 refresh route, disabling document-store mutation endpoints for non-admin roles).
    region_nexus: "global; self-hosted open-source AI-agent tooling increasingly deployed inside CH/EU public-sector and enterprise environments"
