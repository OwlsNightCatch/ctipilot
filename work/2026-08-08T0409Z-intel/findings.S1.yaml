    evidence:
      - quote: "ATN-B1 CPDLC relies on legacy clear text unauthenticated radio frequency links. Research demonstrates that these characteristics allow unauthorized message injection, denial-of-service conditions, and forced session resets."
        attribution: "CISA"
        source_url: "https://www.cisa.gov/news-events/ics-advisories/icsa-26-219-01"
      - quote: "These vulnerabilities do not constitute an unsafe aircraft condition but can degrade operational safety margins by increasing workload, delaying safety-critical instructions, and reducing situational awareness."
        attribution: "CISA"
        source_url: "https://www.cisa.gov/news-events/ics-advisories/icsa-26-219-01"
