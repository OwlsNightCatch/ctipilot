        attribution: "eSentire TRU"
        source_url: "https://www.esentire.com/security-advisories/progress-kemp-loadmaster-vulnerability-targeted-cve-2026-8037"
    extended_notes: |
      Detection concept: unauthenticated POST requests to /accessv2 carrying an apiuser value with multiple single-quote characters and an unusually large JSON body (many repeated keys) is the network-visible shape of the heap-spray; process-creation telemetry on the LoadMaster appliance itself is not typically available to defenders, so web-application-firewall / reverse-proxy logging in front of the LoadMaster management API is the practical hook. Hardening: disable the LoadMaster API where not required; place the management interface behind a separate out-of-band network, never expose /accessv2 to the internet.
  - title: "CPDLC over ATN-B1 — five protocol-level vulnerabilities in the worldwide air-traffic data-link standard, reported by a Swiss (armasuisse) researcher, no vendor patch possible"
    sources:
      - { url: "https://www.cisa.gov/news-events/ics-advisories/icsa-26-219-01", publisher: "CISA (ICS Advisory)", date: "2026-08-07", role: "primary" }
    discovery_trace: "first seen at: cisa-advisories bridge, URL https://www.cisa.gov/cybersecurity-advisories/all.xml (feed) → primary (no pivot needed): CISA ICS advisory icsa-26-219-01, URL https://www.cisa.gov/news-events/ics-advisories/icsa-26-219-01"
    summary: |
      CISA published ICS advisory icsa-26-219-01 on 2026-08-07 for five vulnerabilities in Controller-Pilot Data Link Communications (CPDLC) as implemented over the ATN-B1 aviation data-link standard (Advisory Circular 90-117), used worldwide for controller-to-cockpit text instructions over VHF radio. All five (CVE-2025-71409 through CVE-2025-71413, affecting "vers:all" of the standard — this is a protocol design flaw, not a single vendor's bug) trace to CWE-306 (missing authentication for a critical function): ATN-B1 CPDLC relies on clear-text, unauthenticated VHF Data Link radio frequency links, so any actor able to transmit on the relevant frequency can act as a rogue ground station. CVE-2025-71409 (CVSS3.1 7.1) and CVE-2025-71412 (7.1) let an attacker inject fabricated CPDLC clearances or false emergency/status messages that look legitimate to flight crew and controllers; CVE-2025-71410 and CVE-2025-71411 (5.3 each) let an attacker send Unnumbered Disconnect / malformed Link Control frames or broadcast control frames to terminate CPDLC sessions for one or many aircraft simultaneously, forcing reversion to voice communications and controller overload; CVE-2025-71413 forces repeated resets via malformed/out-of-sequence X.25-layer frames. CISA states these "do not constitute an unsafe aircraft condition" but can "degrade operational safety margins by increasing workload, delaying safety-critical instructions, and reducing situational awareness." Because the flaw is in the standard itself, the advisory lists no vendor patch and no workaround. The vulnerabilities were reported to CISA by Martin Strohmeier of armasuisse — the Swiss Federal Office for Defence Procurement's science-and-technology arm — giving this a direct Swiss-research nexus even though the exposure is global.
    region_nexus: "global (worldwide aviation infrastructure); discovering researcher is Swiss (armasuisse)"
    primary_sector_nexus: "direct"
    sector: "transport"
    cves: [CVE-2025-71409, CVE-2025-71410, CVE-2025-71411, CVE-2025-71412, CVE-2025-71413]
    techniques: [T1499, T1565.002]
    affected_products: ["ATN-B1 CPDLC (Advisory Circular 90-117 Data Link Communications)"]
