    extended_notes: |
      Two of three CVEs require an existing authenticated (even low-privilege) account, which lowers urgency relative to a pure pre-auth RCE; CVE-2026-70636 is the pre-auth-reachable one. No confirmed in-the-wild exploitation reported by any source found this run — included as a trending/notable disclosure given severity (one CVSS 9.9), the no-patch-coming context, and the tie-in to the already-tracked pattern of AI-agent-orchestration platforms (Langflow, this pipeline's ongoing KEV coverage) becoming a recurring vulnerability class. Detection concept: monitor for anomalous POST traffic to Flowise's /api/v1/oauth2-credential/* and document-store upsert/refresh routes from non-admin session tokens; the trailing-identifier auth-bypass pattern (extra path segment appended past an otherwise-matching allow-listed prefix) is the specific telemetry signature for CVE-2026-70636.
