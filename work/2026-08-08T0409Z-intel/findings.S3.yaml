  - title: "A file-integrity monitoring blind spot with reach beyond npm: log-tailing tools cannot see a supply-chain protection being silently removed"
    sources:
      - { url: "https://www.elastic.co/security-labs/npm-cooldown-removal-detection-elastic-agent", publisher: "Elastic Security Labs", date: "2026-08-07", role: "primary" }
    discovery_trace: "first seen at: elastic-seclabs, URL https://www.elastic.co/security-labs (listing) → primary: Elastic Security Labs, URL https://www.elastic.co/security-labs/npm-cooldown-removal-detection-elastic-agent (no pivot needed)"
    summary: |
      npm's min-release-age config setting delays installation of a just-published package specifically to give the community a window to catch a compromised release before it reaches developer workstations — a defensive control directly relevant given this week's active npm-worm waves. Elastic Security Labs shows that standard log-tailing telemetry (filestream-style ingestion, which only emits events when new bytes are appended to a file) cannot detect the setting's removal from a .npmrc file, because npm rewrites or deletes the line in place rather than appending anything: "filestream sees a modification, but every resulting line is dropped." Elastic's remediation is a small CEL (Common Expression Language) integration that snapshots the full file body on a periodic heartbeat and explicitly flags the protective setting's absence the moment it disappears from the current state, with agent-side filtering to keep npm registry auth tokens — also stored in .npmrc — from transiting the network in the snapshot payload. The lesson generalizes past npm: any security-relevant configuration whose *absence* (not appearance) constitutes the event of interest — a removed audit flag, a deleted allow-list entry, a disabled cooldown or lock file — needs snapshot/heartbeat-based file-integrity monitoring, because append-only log tailing is structurally blind to a value disappearing.
    region_nexus: "global; applies to any organization's developer/CI estate, including CH/EU public-sector software supply chains"
    primary_sector_nexus: "indirect"
    sector: "public-sector"
    cves: []
    techniques: [T1195.001, T1685]
    affected_products: ["npm"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: "SINGLE-SOURCE-OTHER (Elastic Security Labs)"
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "filestream is designed for log tailing: when bytes arrive at the end of a file, an event is emitted. When content disappears... filestream sees a modification, but every resulting line is dropped."
        attribution: "Elastic Security Labs"
        source_url: "https://www.elastic.co/security-labs/npm-cooldown-removal-detection-elastic-agent"
      - quote: "The question the telemetry needs to answer, 'what is the cooldown state of this host right now, and when did it change,' is a question about the current contents of a file. Tail offsets can't answer it."
        attribution: "Elastic Security Labs"
        source_url: "https://www.elastic.co/security-labs/npm-cooldown-removal-detection-elastic-agent"
    extended_notes: |
      Narrower and more product-specific (built as an Elastic Agent CEL integration) than the other items in this return, but the detection-engineering insight — negative-space / disappearance events are invisible to append-only log tailing — is genuinely vendor-neutral and transferable to any FIM tooling. Flagged borderline for the main agent's relevance call.
    borderline: true
    borderline_reason: "Genuinely transferable detection-engineering lesson but framed narrowly around Elastic's own product integration rather than a broader campaign or actor finding."

