    techniques: [T1195.001, T1552, T1102.001, T1027]
    affected_products: ["npm packages (keyv, cacheable-request, @opensearch-project/opensearch and 400+ others in the CHAINDROP wave)"]
    entity_keys: ["campaign:shai-hulud-chaindrop-2026-08"]
    new_entities: []
