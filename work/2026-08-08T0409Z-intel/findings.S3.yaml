  - title: "Unit 42 fills in ChainDrop's missing mechanics: GitHub Actions runner-memory credential theft and forged Sigstore/SLSA provenance"
    sources:
      - { url: "https://unit42.paloaltonetworks.com/chaindrop-npm-worm-analysis/", publisher: "Palo Alto Networks Unit 42", date: "2026-08-06", role: "primary" }
    discovery_trace: "first seen at: unit42, URL https://unit42.paloaltonetworks.com/feed/ (RSS listing) → primary: Unit 42, URL https://unit42.paloaltonetworks.com/chaindrop-npm-worm-analysis/ (delta on prior entry 2026-08-06/chaindrop-shai-hulud-npm-worm-onchain-c2-resolver, primary source https://www.elastic.co/security-labs/shai-hulud-chaindrop-npm-supply-chain, not re-fetched this run)"
    summary: |
      Unit 42's independent analysis of the CHAINDROP wave of the Shai-Hulud npm worm (first disclosed by Elastic Security Labs on 2026-08-04, covered in this pipeline on 2026-08-06) adds technical mechanics the original disclosure did not cover. An embedded Python helper hidden inside an encrypted blob locates the GitHub Actions Runner.Worker process and reads /proc/<pid>/maps and /proc/<pid>/mem directly, searching live process memory for ephemeral OpenID Connect (OIDC) tokens and CI runner secrets rather than relying on filesystem artifacts — defeating secret-scanning approaches that only inspect files or environment variables at rest. In at least one gated repository workflow (opensearch-js's release-drafter.yml), the worm requests an npm trusted-publishing OIDC token and mints a valid Sigstore/SLSA provenance attestation for its own malicious package release, so a consumer verifying package provenance as a supply-chain control sees a cryptographically valid attestation on a backdoored build. Persistence is cross-linked between .vscode/tasks.json and .claude/settings.json, each configured to re-invoke the other's dropper directory, so removing one alone does not stop re-infection. Exfiltration runs over two channels: an AES-256-GCM/RSA-OAEP encrypted domain channel — the operator rotated the C2 domain on 2026-08-04 via an on-chain write to the same Ethereum smart contract's StringListStore already covered in the prior entry — and a fallback channel that Base64-double-encodes stolen tokens into public GitHub commit messages, retrievable later via the GitHub search API. The worm exits without executing if it detects a Russian-language host locale. No CVE applies; this is a supply-chain worm rather than a single vulnerability.
    region_nexus: "global; npm/Node.js dependency trees are ubiquitous in CH/EU public-sector and enterprise CI pipelines"
    primary_sector_nexus: "indirect"
    sector: "public-sector"
