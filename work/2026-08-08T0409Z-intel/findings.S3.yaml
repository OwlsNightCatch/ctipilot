  - title: "Check Point finds five memory-corruption bugs in Cloudflare's workerd runtime, including a Code-Mode sandbox escape to native host code"
    sources:
      - { url: "https://research.checkpoint.com/2026/when-agentic-glue-melts/", publisher: "Check Point Research", date: "2026-08-06", role: "primary" }
    discovery_trace: "first seen at: checkpoint-research, URL https://research.checkpoint.com/feed/ (RSS listing) → primary: Check Point Research, URL https://research.checkpoint.com/2026/when-agentic-glue-melts/ (no independent second-lab replication found; Cloudflare's own GitHub security-advisories page at https://github.com/cloudflare/workerd/security/advisories returned only a sign-in gated navigation shell on fetch, not the advisory list, so Cloudflare's confirmation is only available as quoted within the Check Point article, not independently verified this run)"
    summary: |
      Check Point Research disclosed five memory-corruption vulnerabilities in workerd, the open-source C++/V8 runtime underlying both Cloudflare Workers (the serverless platform, which Check Point states carries over 10% of all traffic on Cloudflare's network) and Cloudflare Code Mode (an LLM tool-use feature). The bugs sit in workerd's native "glue" layer that marshals data between JavaScript and native code: an out-of-bounds read in the URLPattern implementation caused by a capture-group-count mismatch between workerd's own parser and V8's regex engine; use-after-free bugs in node:zlib's deflateParams() and in HTMLRewriter's AttributesIterator from improper native-object lifetime management; and a separate SQL authorization-bypass path enabling arbitrary deserialization. Two exploit chains were demonstrated: a cross-tenant heap read that lets one Worker reach across the shared process heap to read another co-located tenant's secrets, and — starting from a prompt injection into Code Mode — a sandbox escape via the zlib use-after-free that breaks out of the V8 isolate to execute native code on the host. Exploitation requires the attacker to get arbitrary JavaScript running inside a Worker (tenant-controlled code, or in the Code Mode case, model-controlled code steered by prompt injection). Cloudflare has fixed its managed Workers environment in production and shipped workerd v1.20260619.1 for self-hosted deployments; no CVE has been assigned to any of the five bugs. Check Point released proof-of-concept code as part of its Black Hat USA 2026 presentation.
    region_nexus: "global; Cloudflare Workers is widely used by CH/EU public-sector and enterprise web front-ends and increasingly by AI-agent tool-use features"
    primary_sector_nexus: "indirect"
    sector: "telco, public-sector, finance"
