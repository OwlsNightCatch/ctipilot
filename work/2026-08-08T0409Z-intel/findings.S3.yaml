    techniques: [T1611]
    affected_products: ["Cloudflare Workers", "Cloudflare Code Mode", "workerd (self-hosted, patched in v1.20260619.1)"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER (Check Point Research; Cloudflare's patch confirmation is quoted inside the Check Point article rather than independently fetched)
    confidence: HIGH
