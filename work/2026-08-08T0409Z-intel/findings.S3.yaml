  - title: "SSD Disclosure: use-after-free in the Linux kernel bridge STP timer teardown gives a local-privilege-escalation control-flow hijack primitive"
    sources:
      - { url: "https://ssd-disclosure.com/linux-bridge-stp-timer-use-after-free/", publisher: "SSD Secure Disclosure", date: "2026-08-05", role: "primary" }
    discovery_trace: "first seen at: ssd-disclosure, URL https://ssd-disclosure.com/ (landing, via jina reader) → primary: SSD Secure Disclosure, URL https://ssd-disclosure.com/linux-bridge-stp-timer-use-after-free/ (fetched via bridge/jina fallback) — rotation-priority source catch-up; no in-window run had checked this source in the preceding cycle(s)"
    summary: |
      SSD Disclosure published full root-cause and exploitation analysis — credited to TyphoonPWN 2026 second-place submissions by researchers n132 and sven sze — for a use-after-free in the Linux kernel's software bridge (net/bridge) Spanning Tree Protocol implementation. The bug is a teardown-path asymmetry: STP periodic timers (hello_timer, tcn_timer, topology_change_timer and per-port timers) are armed when a port transitions to the LEARNING state with no IFF_UP guard, so they can be armed on a bridge that is administratively down; the only path that synchronously cancels them (br_stp_disable_bridge(), reached from br_dev_stop() on an UP-to-DOWN transition via ndo_stop) is never reached when the bridge link is deleted directly via the netlink dellink path, and unregister_netdevice_many() skips ndo_stop entirely for a device that is already down. The net_device backing the bridge — which embeds the net_bridge structure holding the timer lists as private data — is then freed while a timer remains queued on a per-CPU timer base; when that timer base next runs, it dereferences and calls a function pointer inside freed slab memory (the kmalloc-cg-8k cache), giving an attacker who can refill the freed slot a control-flow-hijack primitive from what is nominally just local bridge/network configuration access. The fix is now upstream in the Linux kernel (patch commit 2a00517db8de4be7df3d483b215c5544fb30a191); no CVE identifier has been assigned and no in-the-wild exploitation is reported. The precondition — creating or administering a network bridge with kernel STP enabled and then deleting it while down — is most reachable where unprivileged or semi-privileged code can perform bridge/network configuration, such as via user/network namespaces in container and CI-runner environments.
    region_nexus: "global; affects any Linux estate running kernel STP-enabled bridges, including container/CI infrastructure common in CH/EU public-sector and critical-infrastructure operators"
    primary_sector_nexus: "indirect"
    sector: "public-sector"
    cves: []
    techniques: [T1068]
    affected_products: ["Linux kernel (net/bridge, prior to commit 2a00517db8de4be7df3d483b215c5544fb30a191)"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: "SINGLE-SOURCE-OTHER (SSD Secure Disclosure); technically corroborated by the referenced upstream Linux kernel patch commit itself, not by a second reporting outlet"
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "A bridge that is administratively down while kernel STP is enabled, together with a port driven into the LEARNING state, arms periodic STP timers without an IFF_UP guard."
        attribution: "SSD Secure Disclosure"
        source_url: "https://ssd-disclosure.com/linux-bridge-stp-timer-use-after-free/"
      - quote: "The next time that timer base runs (__run_timers() in softirq context), it dereferences and fires a timer that points into freed slab memory."
