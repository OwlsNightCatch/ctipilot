    confidence: HIGH
    novelty: "update-of:2026-07-26/wp2shell-cve-2026-63030-60137-confirmed-exploited-kev"
    evidence:
      - quote: "Cyberkriminelle versuchen, über gefälschte CAPTCHAs oder mit angeblichen Fehlermeldungen auf Webseiten die Besuchenden dazu zu animieren, einen schädlichen Computerbefehl auszuführen, um den Computer mit Schadsoftware (sogenannter «Malware») zu infizieren."
        attribution: "NCSC Switzerland (BACS)"
        source_url: "https://www.ncsc.admin.ch/ncsc/de/home/aktuell/im-fokus/2026/clickfix.html"
      - quote: "Dabei verwenden Cyberkriminelle eine Kombination aus zwei Schwachstellen in WordPress, die als «WP2Shell» bekannt sind (CVE-2026-63030 und CVE-2026-60137)."
        attribution: "NCSC Switzerland (BACS)"
        source_url: "https://www.ncsc.admin.ch/ncsc/de/home/aktuell/im-fokus/2026/clickfix.html"
      - quote: "Unternehmen und Betreiberinnen kritischer Infrastrukturen, welche nicht im Fintech-Bereich tätig sind, sollten ausgehende Verbindungen zu RPC-Anbietern einschränken."
        attribution: "NCSC Switzerland (BACS)"
        source_url: "https://www.ncsc.admin.ch/ncsc/de/home/aktuell/im-fokus/2026/clickfix.html"
    extended_notes: |
      English glosses of the German quotes above, in order: (1) "Criminals use fake CAPTCHAs or
      supposed error messages on websites to induce visitors to execute a malicious computer
      command, in order to infect the computer with malware ('malware')." (2) "Criminals use a
      combination of two vulnerabilities in WordPress known as 'WP2Shell' (CVE-2026-63030 and
      CVE-2026-60137)." (3) "Companies and operators of critical infrastructure that are not active
      in the fintech sector should restrict outgoing connections to RPC providers."

      Cross-referencing note (not source-stated): the delivery mechanics described (ClickFix +
      WordPress targeting + EtherHiding/blockchain payload resolution) closely match the pattern
      this pipeline previously tracked as campaign:sekoia-errtraffic-clickfix-maas-polygon-c2
      (first_seen 2026-06-17, EU WordPress targeting). NCSC-CH's advisory does not name that
      tracking codename or any other campaign name, so this is offered only as a plausible
      cross-reference for the main agent's registry work, not a claimed attribution.

      Because the underlying exploited CVEs (CVE-2026-63030 / CVE-2026-60137) were already tracked
      by this pipeline as confirmed-exploited and KEV-listed (2026-07-26 entry), this item is
      returned as an update_of that entry. Its material delta: the NCSC-CH-documented downstream
      ClickFix/EtherHiding/Vidar delivery chain, the Swiss-specific rising-compromise trend, the
      cross-tenant compromise pivot on shared hosting (mechanism not yet understood per BACS), and
      the dedicated critical-infrastructure hardening recommendation (block outbound RPC-provider
      traffic; GovCERT.ch blocklist at https://github.com/govcert-ch/website/).

      Detection angle: web-server access logs showing the WP2Shell REST batch-endpoint request
      pattern followed shortly after by unexplained admin-account or plugin/theme file changes are
      the compromise signature; on the client side, unusual outbound DNS/HTTP to RPC-provider
      endpoints from a browser-spawned PowerShell or shell process (parent-process lineage:
      browser → cmd/powershell.exe or Terminal) is the ClickFix execution signature, distinct from
      legitimate admin scripting which is not typically launched from a browser process tree.
    borderline: false

  - title: "Two 16-year-old Linux KVM shadow-MMU use-after-free bugs enable guest-to-host VM escape on Intel and AMD — CCB Belgium 'Patch Immediately' advisory (CVE-2026-64561 'Zapscape', CVE-2026-53359 'Januscape')"
    sources:
      - { url: "https://ccb.belgium.be/advisories/warning-vm-escape-vulnerabilities-kvm-patch-immediately", publisher: "Centre for Cybersecurity Belgium (CCB)", date: "2026-08-07", role: "primary" }
      - { url: "https://github.com/V4bel/Zapscape/blob/main/assets/write-up.md", publisher: "V4bel (independent researcher — GitHub write-up)", date: "2026-08-06", role: "primary" }
      - { url: "https://thehackernews.com/2026/08/new-zapscape-kvm-flaw-could-let.html", publisher: "The Hacker News", date: "2026-08-06", role: "corroborating" }
      - { url: "https://thehackernews.com/2026/07/16-year-old-linux-kvm-flaw-lets-guest.html", publisher: "The Hacker News", date: "2026-07-06", role: "corroborating" }
    discovery_trace: "first seen at: ccb-belgium, URL https://ccb.belgium.be/advisories → primary: CCB Belgium advisory, URL https://ccb.belgium.be/advisories/warning-vm-escape-vulnerabilities-kvm-patch-immediately → pivot: researcher write-up, URL https://github.com/V4bel/Zapscape/blob/main/assets/write-up.md → corroborating: The Hacker News (Zapscape), URL https://thehackernews.com/2026/08/new-zapscape-kvm-flaw-could-let.html → corroborating: The Hacker News (Januscape background), URL https://thehackernews.com/2026/07/16-year-old-linux-kvm-flaw-lets-guest.html"
    summary: |
      The Centre for Cybersecurity Belgium (CCB) issued a "Patch Immediately" advisory on
      2026-08-07 covering two Linux KVM/x86 shadow-MMU use-after-free vulnerabilities that enable
      guest-to-host virtual-machine escape (T1611 Escape to Host): CVE-2026-64561 ("Zapscape",
      CVSS 3.1 8.8) and CVE-2026-53359 ("Januscape", CVSS 3.1 8.8). Januscape has existed in the
      shadow-MMU code since kernel commit 2032a93d66fa (2010, kernel 2.6.36 era) and went
      undiscovered for roughly 16 years until researcher Hyunwoo Kim reported it through Google's
      kvmCTF bug-bounty programme; Zapscape is a closely related bug in the same recursive
      shadow-page "zap" path that runs during MMU-page-quota reclaim. Both corrupt the host
      kernel's shadow-page tracking list during nested-virtualization page-fault handling, letting
      a root user inside a guest VM execute code on the host with kernel privileges. Januscape
      requires only guest-side root plus nested virtualization enabled on the host, and is
      triggerable on both Intel and AMD with no further constraint; Zapscape needs the same guest
      root plus nested virtualization, and on Intel additionally requires EPT page-walk lengths 4
      and 5 to be exposed to the L1 guest (AMD has no such extra constraint). Fixes: Januscape
      landed in 5.10.260, 5.15.211, 6.1.177, 6.6.144, 6.12.95, 6.18.38 and 7.1.3 (merged
      2026-06-19); Zapscape in 6.6.148, 6.12.101, 6.18.42, 7.1.6 and 7.2-rc5. Public
      proof-of-concept code exists for both (V4bel's GitHub repos, including KASLR-derivation and a
      cross-cache exploitation chain for Zapscape); no in-the-wild exploitation has been reported
      for either. CCB flags public-cloud and hosting environments using KVM as the highest-risk
      exposure, since they routinely expose nested virtualization to paying tenants, and notes that
      RHEL-class distributions can let an unprivileged guest user escalate straight to host root
      once inside a vulnerable nested-virtualization guest.
    region_nexus: "EU (CCB Belgium primary advisory); global impact on KVM-based public cloud/hosting infrastructure"
    primary_sector_nexus: "indirect"
    sector: "telco, finance, energy, public-sector (cloud/hosting infrastructure operators)"
    cves: ["CVE-2026-64561", "CVE-2026-53359"]
    techniques: ["T1611"]
    affected_products: ["Linux Kernel (KVM hypervisor, x86)"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "These two vulnerabilities can let an attacker run commands on the host by escaping the guest virtual machine, this can lead to a full system compromise since the attacker can escape the virtual environment."
        attribution: "Centre for Cybersecurity Belgium (CCB)"
        source_url: "https://ccb.belgium.be/advisories/warning-vm-escape-vulnerabilities-kvm-patch-immediately"
      - quote: "Zapscape (CVE-2026-64561) is a use-after-free vulnerability that occurs in the shadow MMU of KVM/x86."
        attribution: "V4bel (researcher write-up)"
        source_url: "https://github.com/V4bel/Zapscape/blob/main/assets/write-up.md"
      - quote: "The attack requires two things from the guest side: root inside the VM, a common condition on rented cloud instances, and nested virtualization exposed by the host."
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/07/16-year-old-linux-kvm-flaw-lets-guest.html"
    extended_notes: |
      Neither CVE-2026-64561 nor CVE-2026-53359 appears in this pipeline's prior 14-day coverage
      index; Januscape's original disclosure (2026-07-06) apparently did not clear a prior run's
      inclusion bar on its own, but CCB Belgium's fresh 2026-08-07 advisory treats both CVEs as one
      actionable "patch immediately" warning, which is the trigger for including them together now.

      Detection angle for defenders operating multi-tenant KVM/x86 hosts with nested virtualization
      enabled: an unexpected host-kernel panic or crash correlated with a specific guest VM's
      page-fault/MMU activity, or an unexplained root-owned file appearing on the host outside
      normal orchestration/config-management tooling, is the observable signature of a shadow-MMU
      UAF exploitation attempt (the public Zapscape PoC creates a marker file as its proof step).
      Hardening lever: disable nested virtualization for any tenant/workload that does not require
      it; where nested virtualization must stay enabled, prioritise the patched kernel versions
      above and, on Intel, consider that EPT page-walk-length-5 exposure to L1 guests is an
      additional Zapscape-specific precondition that can be selectively restricted.
