items:
  - title: "NCSC Switzerland: fake-CAPTCHA 'ClickFix' campaigns rising against Swiss websites, chained from the already-exploited WP2Shell WordPress flaw to blockchain-resolved EtherHiding payloads and Vidar theft"
    sources:
      - { url: "https://www.ncsc.admin.ch/ncsc/de/home/aktuell/im-fokus/2026/clickfix.html", publisher: "NCSC Switzerland (BACS) — Im Fokus", date: "2026-08-07", role: "primary" }
      - { url: "https://www.inside-it.ch/klick-auf-gefaelschtes-captcha-fuehrt-zu-malware-download-20260807", publisher: "inside-it.ch", date: "2026-08-07", role: "corroborating" }
    discovery_trace: "first seen at: ncsc-ch-focus, URL https://www.ncsc.admin.ch/ncsc/de/home/aktuell/im-fokus.html → primary: NCSC Switzerland dedicated advisory, URL https://www.ncsc.admin.ch/ncsc/de/home/aktuell/im-fokus/2026/clickfix.html → corroborating: inside-it.ch (Swiss IT press relaying the same NCSC-CH advisory), URL https://www.inside-it.ch/klick-auf-gefaelschtes-captcha-fuehrt-zu-malware-download-20260807"
    summary: |
      NCSC Switzerland (BACS) published an advisory on 2026-08-07 documenting a rising wave of
      compromised Swiss websites serving fake Cloudflare-style CAPTCHAs that instruct visitors to
      manually paste and run a malicious command — a PowerShell one-liner on Windows, an
      equivalent command on macOS (ClickFix, T1204.004 Malicious Copy and Paste) — to infect the
      visitor's machine. BACS is currently tracking seven concurrent criminal campaigns using this
      technique; more than 100,000 compromised websites exist worldwide (most running WordPress),
      and BACS states the count of affected Swiss websites is rising. The dominant infection vector
      for the compromised WordPress sites is the "WP2Shell" chain (CVE-2026-63030 route confusion
      in the unauthenticated REST batch endpoint, chained with the CVE-2026-60137 SQL injection;
      WordPress patched both on 2026-07-17) — the same chain this pipeline already tracked moving
      to confirmed exploitation and CISA KEV listing. BACS additionally has cases where exploiting
      WP2Shell on one WordPress site let attackers also compromise other, unrelated tenant websites
      sharing the same hosting server, via a pivot mechanism BACS states is not yet understood.
      Once a visitor runs the pasted command, it fetches further malicious code whose location is
      stored on a public blockchain and resolved through RPC-provider web interfaces (EtherHiding,
      T1102.001 Dead Drop Resolver) — a takedown-resistant distribution channel — most often
      delivering the Vidar infostealer to harvest credentials, payment-card data and cryptocurrency
      wallets (T1555.003 Credentials from Web Browsers). The advisory carries a dedicated
      recommendation section for companies and critical-infrastructure operators outside the
      fintech sector: restrict outbound connections to RPC providers (using GovCERT.ch's published
      blocklist on GitHub) and brief staff on the ClickFix pretext specifically.
    region_nexus: "Switzerland (NCSC-CH primary advisory, rising Swiss victim count); global campaign footprint (100,000+ compromised websites)"
    primary_sector_nexus: "direct"
    sector: "public-sector, energy, water, transport, healthcare, finance, telco"
    cves: ["CVE-2026-63030", "CVE-2026-60137"]
    techniques: ["T1190", "T1204.004", "T1102.001", "T1555.003"]
    affected_products: ["WordPress Core"]
