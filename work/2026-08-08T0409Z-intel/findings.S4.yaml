  - title: "North Korean fake-job-interview operation breached 1,640 companies in 57 countries — Belgium's Flemish government confirms compromise via a contractor's device"
    sources:
      - { url: "https://www.wired.com/story/a-security-pro-hacked-north-korean-hackers-he-found-theyd-breached-hundreds-of-networks-worldwide/", publisher: "WIRED", date: "2026-08-05", role: "primary" }
      - { url: "https://databreaches.net/2026/08/07/boston-childrens-hospital-named-in-north-korean-hacking-operation/", publisher: "DataBreaches.net", date: "2026-08-07", role: "corroborating" }
    discovery_trace: "first seen at: databreaches.net, URL https://databreaches.net/2026/08/07/boston-childrens-hospital-named-in-north-korean-hacking-operation/ → primary: WIRED, URL https://www.wired.com/story/a-security-pro-hacked-north-korean-hackers-he-found-theyd-breached-hundreds-of-networks-worldwide/"
    summary: |
      Greece-based researcher Vangelis Stykas (CTO, Kumio) disclosed at Black Hat USA 2026 (2026-08-05) that after 22 months of maintained access to North Korean threat-actor command-and-control servers — including, in some cases, the operators' own infected workstations, Slack and Discord — he identified 1,640 companies across 57 countries impacted by DPRK hacking operations, of which 700-800 suffered intrusions he characterises as "really damaging" (root/AWS access, crypto-wallet keys, blockchain access). The overwhelmingly dominant initial-access vector across nearly all victims is the long-tracked "fake job interview" lure (Microsoft's Contagious Interview campaign, active since 2022): targeted developers/contractors are offered a coding-test download that silently installs malware, and compromised contractors who held access to multiple client organisations (one contractor had access to up to 30 companies) multiplied the blast radius via trusted third-party relationships. Stykas named a small set of organisations that handled disclosure well, including Digitaal Vlaanderen (the Flemish Government's digital agency in Belgium), which confirmed to WIRED that Belgium's Centre for Cybersecurity (CCB) notified it on 2026-03-03 following Stykas's disclosure, that the affected workstation was isolated and exposed credentials/access rotated, and that the incident is contained and remediated. Also named: Boston Children's Hospital (which disputes the incident touched its own systems, attributing it to a former contractor's personal device), Japan's AEON Smart Technology (confirmed and remediated with JPCERT support), Coinbase, Uniswap Labs, Italy's Supreme Judicial Council, and a subsidiary of Saudi Arabia's Al Rajhi Bank. Stykas states the actors overwhelmingly focused on cryptocurrency-wallet access even where far more sensitive data (health records, criminal-history databases) was reachable, and that hundreds of further organisations he has warned have not responded.
    region_nexus: "Direct EU government nexus (Belgium — Digitaal Vlaanderen / Flemish Government, confirmed via Centre for Cybersecurity Belgium); global scale (1,640 companies, 57 countries)"
