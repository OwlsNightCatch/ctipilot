  - title: "Beacon CRM breach exposes donor/beneficiary data across ~1,500 UK charities, including hospices, NHS-linked charities and Victim Support"
    sources:
      - { url: "https://www.infosecurity-magazine.com/news/healthcare-victim-charities-beacon/", publisher: "Infosecurity Magazine", date: "2026-08-07", role: "primary" }
