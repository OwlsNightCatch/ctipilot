    summary: |
      Beacon, a UK CRM platform used by roughly 1,500 voluntary-sector organisations (its customer segments explicitly include NHS-linked charities, hospices, animal-rescue and education charities), disclosed a cyber-security incident (last updated 2026-08-04) in which an unauthorised actor gained access via a compromised access key — Beacon describes this as "more sophisticated than a simple compromised username and password" — and copied and likely exfiltrated customer-account data: donor/supporter names, email addresses, phone numbers, donation records and attachments, held in an encrypted state that Beacon assesses the actor could plausibly decrypt. Beacon states payment-card data, bank details and highly sensitive case-management/patient data were not included, and that no ongoing unauthorised access has been observed since containment (performed with an external cybersecurity firm). Multiple named charities have independently confirmed and published their own statements, including Victim Support (which reported the incident to the UK Information Commissioner's Office and the Charity Commission, describing evidence that "copies of database back-ups were made and likely downloaded by an unauthorised third party"), plus Myton Hospices, Sheffield Hospital Charity, Priscilla Bacon Hospice Charity, Rowcroft Hospice and The Clock Tower Sanctuary (homelessness charity). Affected charities were instructed to notify the ICO individually.
