  - title: "Belarusian Ransom Cartel creator Maksim Silnikau sentenced to 16 years — EU arrests (Spain, Germany) in the wider Angler-EK malvertising case"
    sources:
      - { url: "https://www.securityweek.com/belarusian-ransom-cartel-mastermind-gets-16-years-in-prison/", publisher: "SecurityWeek", date: "2026-08-06", role: "primary" }
