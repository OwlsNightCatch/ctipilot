    summary: |
      Maksim Silnikau, a Belarusian national extradited from Poland to the US in August 2024, was sentenced on 2026-08-05 to 16 years in prison for conspiracy, wire-fraud conspiracy and aggravated identity theft, for creating and administering the Ransom Cartel ransomware operation (targeted at least 18 organisations in the US and abroad between 2021 and disruption at his 2023 arrest) and for a separate, longer-running role (2013-2022, with co-conspirators Volodymyr Kadariya and Russian national Andrei Tarasov) distributing malware via the Angler exploit kit and other malvertising. Silnikau was arrested in Spain; Tarasov was separately arrested in Germany and later released, returning to Russia; a $2.5M reward remains outstanding for Kadariya.
