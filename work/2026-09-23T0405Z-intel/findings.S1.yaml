      This run's existing entry (2026-09-10/checkpoint-quantum-vpn-cert-preauth-rce-cvss98) covers CVE-2026-85103 and CVE-2026-85102, two Check Point Security Gateway/Spark Firewall VPN-certificate-processing flaws disclosed 2026-09-09 with "no exploitation is reported" at the time. That is now superseded for CVE-2026-85102: CISA added it to KEV on 2026-09-22, and Check Point's own advisory confirms a wave of exploitation attempts against Check Point Spark customers globally beginning 2026-09-12 — three days after the patch shipped. Check Point states the attempts originated from anonymization infrastructure (VPN services and proxies) and used certificate-based Mobile Access logins with observed (non-exhaustive) certificate subjects; Check Point's recommended hunting step is to review logs for anomalous certificate-based Mobile Access logins broadly, not limited to the observed subjects, and to look for follow-on internal port/service scanning from suspicious logged-in Mobile Access sessions. Check Point states customers who applied the 2026-09-09 fix are protected, but does not confirm whether any exploitation attempt against an unpatched system succeeded. CVE-2026-85103 (the companion heap-overflow certificate-decoding flaw in the original entry) is not reported exploited and is unaffected by this update.
