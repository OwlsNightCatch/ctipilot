        states skimmer scripts were installed "on the websites of five" companies, while the dedicated
        later section states "Skimmers were ordered against at least 27 named victims and confirmed in
        place on 19 of them during the span of this campaign" (plus 100+ further sites found via
        researcher Varys). These are not necessarily contradictory — the "five" appears to be a subset
        referenced in the same sentence as four other illustrative victim types — but the entry should
        use the LARGER, more precise, dedicated-section figure (confirmed on 19 of 27 named victims,
        100+ further sites via Varys) as the authoritative skimmer count, not the "five" from the
        opening paragraph. cybersecuritynews.com's independent paraphrase also uses "19" and "100+",
        corroborating the dedicated-section figure as the correct one.
      - >
        cybersecuritynews.com ADDS a claim NOT found anywhere in Gambit's primary page (checked against
        both the trafilatura extraction AND the raw HTML): that heaviest AI workload was "routed through
        Chinese models DeepSeek and Kimi." Gambit's own text names only GLM 5.2 and DeepSeek v4 Pro
        (Strix), DeepSeek v4.1 Flash (Cairn), and Anthropic Opus 4.6 (Hermes) — no mention of "Kimi"
        anywhere in the primary. RECOMMEND: do NOT include "Kimi" as a model used in this campaign
        unless corroborated elsewhere; it looks like an unverified addition/possible error by the
        secondary source.
      - >
        cybersecuritynews.com also states a "payment processor later confirmed that at least 60 percent
        of a sampled batch had not previously been flagged for fraud" — this sentence does NOT appear
        anywhere in Gambit's primary page (checked both extraction and raw HTML). Treat as a
        cybersecuritynews.com-only claim if used at all; do not attribute it to Gambit directly.
      - >
        cybersecuritynews.com's phrasing loosely implies the four named victim-type examples (Fortune
        500 hospitality company / major US airline / large industrial supplies distributor / US fashion
        retailer) are the victims of "one fully documented chain" (the SQLi-to-Blowfish-decryption kill
        chain quoted below). Gambit's own primary text presents these as TWO SEPARATE items: the kill
        chain is given anonymously ("the chain below was documented in one completed Cairn project")
        and the four company types are named separately, earlier, as general examples of "some level of
        access" victims. Do not conflate the two in the entry — describe the chain as an illustrative,
        unnamed example, and the four company types as separately-stated categories of accessed victims.
      - >
        VERIFIED (not a contradiction): the "$25.46 mean cost" and "600,000+ card records / two victims"
        figures are corroborated in both sources. The US-card-share figure (488,372 cards / 79.0%) that
        cybersecuritynews.com states in prose IS independently confirmed: recovered directly from an
        HTML data table embedded in Gambit's primary page (not visible in the markdown/trafilatura
        extraction — the table renders via a custom CSS/JS embed that trafilatura's markdown pass
        dropped, but the raw HTML source contains the literal table rows). Top entries from that table:
        United States 488,372 (79.0%), United Arab Emirates 13,559 (2.2%), Saudi Arabia 6,785 (1.1%),
        United Kingdom 6,522 (1.0%), New Zealand 5,710 (0.9%), Ireland 5,483 (0.9%), Singapore 5,305
        (0.9%), Kuwait 4,676 (0.8%), Australia 4,672 (0.7%), Hong Kong 4,459 (0.7%), France 4,295 (0.7%).
        No Switzerland entry visible in the portion of the table recovered (top ~11 rows) — no direct
        Swiss-cardholder nexus evidenced by this table.
    enrichment_full_kill_chain_verbatim_from_primary: |
      Unauthenticated SQLi (login email param, error-based EXTRACTVALUE)
       -> OTP plaintext read from the OTP table (MFA bypass)
        -> admin panel access
         -> Arbitrary file upload (image field, no extension check)
          -> host RCE (uid=1001, gid=root)
           -> sudo NOPASSWD python3.12 -> root
            -> NFS mount (internal address, no_root_squash)
             -> WP blog DB credentials from wp-config.php on NFS
              -> WP admin write (new user via DB)
               -> WP plugin upload -> blog host RCE
                -> AWS Secrets Manager full dump (46 secrets, 102KB)
                 -> Main Magento DB access (Aurora)
                  -> Magento encryption key extraction
                   -> cc_number_enc Blowfish-ECB decryption verified
      (Gambit states this is ONE illustrative, fully-documented Cairn project chain out of 105 launched
      between 10-15 Sept; each victim's actual path was chosen dynamically by the harness through
      real-time probing, so most chains differed victim to victim — this specific chain should be
      presented as illustrative, not universal.)
    enrichment_attck_mapping_suggestions_for_composer:
      - "T1190 Exploit Public-Facing Application — unauthenticated SQLi entry point (login email parameter, error-based EXTRACTVALUE technique)"
      - "T1552 Unsecured Credentials — plaintext OTP readable directly from an application DB table, used to bypass MFA (no exact ATT&CK sub-technique for 'MFA-bypass-via-insecure-OTP-storage'; describe the mechanism in prose)"
      - "T1505.003 Server Software Component: Web Shell / T1190 — arbitrary image-field file upload with no extension check reaching host RCE"
      - "T1548.003 Abuse Elevation Control Mechanism: Sudo and Sudo Caching — sudo NOPASSWD python3.12 misconfiguration escalating to root"
      - "Lateral movement via an NFS export misconfigured with no_root_squash, mounted to read another host's wp-config.php in plaintext — no exact ATT&CK sub-technique; closest generic parents are T1210 Exploitation of Remote Services / T1552.001 Unsecured Credentials: Credentials In Files"
      - "T1136.001 Create Account: Local Account — new WordPress admin user created via direct DB write"
      - "T1505.003 Server Software Component: Web Shell — malicious WordPress plugin upload for blog-host RCE"
      - "T1555.006 Credentials from Password Stores: Cloud Secrets Management Stores — full AWS Secrets Manager dump (46 secrets, 102KB)"
      - "T1213 Data from Information Repositories / T1530 Data from Cloud Storage — access to the main Magento database on Aurora"
      - "T1552 Unsecured Credentials — Magento encryption-key extraction (Magento's known app/etc/env.php key storage) enabling offline Blowfish-ECB decryption of the cc_number_enc field"
      - "T1659 Content Injection — the various web-skimmer injection techniques (JS-file append, hidden script tag, GTM-block injection, S3 poisoning, DB-field injection, K8s initContainer injection, page-cache poisoning)"
      - "T1053.003 Scheduled Task/Job: Cron — self-healing skimmer persistence via a 2-minute cron job in a JBoss log directory that re-appends the skimmer whenever a redeploy reverts it"
      - "T1485 Data Destruction — Hermes 'Database Wipe After Extraction' skill wiping stolen-field DB columns post-exfiltration, and the over-broad table-drop cleanup that destroyed 180 tables (including administrator-made backups) at the bicycle-retailer victim"
    enrichment_ai_tooling_detail:
      harnesses:
        - "Strix — open-source AI penetration-testing tool for vulnerability discovery. 23-31 Aug 2026: 146 runs in 'deep mode' against 138 hosts, 633 scanner-hours within 195 clock-hours. Model: OpenRouter GLM 5.2, later switched to DeepSeek v4 Pro."
        - "Cairn — autonomous end-to-end exploitation engine; given a target domain + objective (shell/admin), runs until success/timeout/stop. Model: DeepSeek v4.1 Flash. Launched 105 attack projects 10-15 Sept 2026 (48 of 105 recoverable for analysis; 57 deleted)."
        - "Hermes — orchestration agent with persistent memory, self-written/edited skills (121 total, 78 offensive), session archive, scheduled jobs, web console. Loaded a persona titled 'SOUL - Red Team Operator'. Operator added a custom skill to strip Hermes's own content-safety filters. Model: Anthropic Opus 4.6 — explicitly stated as adopted 'after newer models refused its requests' (notable operational-security data point re: model refusal behavior driving attacker model choice). 1,951 human-typed prompts (short Chinese-language instructions) across 260 sessions."
      cost: "OpenRouter account balance snapshot on 25 Aug 2026: $7,005.71 spent over 4 weeks; ran ~3 further weeks at ~2x daily call volume => Gambit's own estimate of total spend $12,000-$18,000 across the full campaign. Operator's own per-target cost review: mean $25.46 over 101 completed scans, range $3.13-$79.31."
      targeting_method: "Primary method: website-traffic ranking service, filtered to the shopping category, EXCLUDING shops on major hosted/open-source commerce platforms (custom-code shops assumed more likely vulnerable) — operator pasted 301 candidate results into the Hermes console with the instruction '跑这些 用代理 只扫高危' ('run these, use the proxy, high severity only'). Secondary method: hand-picked targets, e.g. a New Zealand retailer and a US photo-printing company handed to the agent with an ALREADY-COMPROMISED admin password and the instruction '开干' ('get to work') — i.e. some targets were pre-compromised by the human operator before agent handoff, not discovered by the agent itself."
      bicycle_retailer_incident_detail: "Second data-loss victim (bicycle retailer): the agent created 'ZQ'-prefixed staging tables to hold exfiltrated data; its cleanup routine then dropped 180 tables matching the name patterns ZQ or Backup — this over-broad name-matching also destroyed backup tables the victim's OWN administrators had separately created (i.e. collateral destruction of legitimate backups, not just attacker-created staging data)."
      skimmer_injection_methods_all_seven: "1) Appended to a legitimate already-served JS file (most common — e.g. end of a jQuery/Bootstrap bundle, original file timestamp restored to avoid detection by mtime). 2) Foreign <script> tag added directly to the checkout page (three named-by-sector examples). 3) Inserted inside a site's Google Tag Manager/gtag block, padded with ~100 tab characters to push it off the right edge of a typical source-code view (anti-review evasion). 4) 'S3 poisoning' — a found AWS access key granted write access to the bucket behind the store's own CDN, so the skimmer loaded from the victim's OWN trusted CDN host rather than a third-party domain (defeats domain-reputation/blocklist controls). 5) Injected into database content fields (e.g. product-description columns) via an admin panel, then relocated to a file on the victim's own domain. 6) Added as a Kubernetes initContainer in a production front-end deployment manifest. 7) Written directly into a server-side page-cache model for the checkout page (bypasses source-code review entirely since the served HTML differs from the template). 8) Self-healing persistence: a cron job placed in a JBoss LOG DIRECTORY checks file size every two minutes and re-appends the skimmer whenever an app redeploy reverts the injection."
    ioc_note: "The base64-decoded loader payload and specific attacker domains (static-js[.]com, cdn[.]netlfjs[.]com and associated .js filenames) appear in Gambit's post, already defanged by the source. Per pipeline no-IOC policy these domains must NOT be reproduced in the entry — describe the injection TECHNIQUE (e.g. 'a base64-encoded loader appended to a legitimate JS file that injects a remote <script> tag') without the domain/filename."

  - id: 8
    title: "VulnCheck Virtualizor RCE chain"
    urls_fetched:
      - url: "https://www.vulncheck.com/blog/virtualizor-billing-hook-unauthenticated-root-rce"
        saved_to: "work/2026-09-23T0405Z-intel/deepread-vulncheck-virtualizor.txt"
        fetch_method: "extract (trafilatura-direct)"
        status: 200
    quotes:
      - quote: "the pre-auth billing-module hook is guarded only against requests whose act is not 'login', so act=login walks straight into it"
        verdict: PASS
        found_in: "page meta-description (verbatim substring), which mirrors the post's own technical framing"
      - quote: "Verified on the lab: /tmp/x reads uid=0(root) gid=0(root) groups=0(root)."
        verdict: PASS
      - quote: "Softaculous patched all three in 3.2.9 patch 9 (2026-09-01), and the fix carries into 3.3.0 (2026-09-09), the current build. Patch 7, the build audited above, and patch 8 are both still vulnerable"
        verdict: PASS
    contradictions: none
    enrichment:
      explicit_cve_to_flaw_mapping_CONFIRMED_NOT_GUESSED: >
        Table explicitly given in the post: CVE-2026-43641 = Unauthenticated OS command injection to
        root (CWE-78, +306 Missing Authentication) via billing_unsuspend() -> vexec -> proc_open, uid
        spliced in -> uid=0(root); CVE-2026-43642 = Unauthenticated PHP object injection (CWE-502, +306)
        via _unserialize($_POST['billing_data']), native unserialize -> untrusted deserialization, no
        stock gadget chain demonstrated; CVE-2026-43643 = Unauthenticated cross-tenant balance write
        (CWE-639 Authorization Bypass Through User-Controlled Key, +306) via
        'UPDATE users SET cur_bal WHERE uid=:uid' with no ownership check -> arbitrary balance
        overwrite (777.00 -> 0.00 demonstrated). This matches the item's proposed mapping exactly.
      cvss_scores_NOW_PUBLISHED_ON_NVD: >
        Checked NVD directly (not stated in the VulnCheck post itself): CVE-2026-43641 CVSSv3.1 9.8
        (AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H) and CVSSv4.0 9.3; CVE-2026-43642 CVSSv3.1 8.1 and CVSSv4.0
        9.2; CVE-2026-43643 CVSSv3.1 7.5 and CVSSv4.0 8.7. NVD's own descriptions independently
        corroborate the affected-version boundary stated by VulnCheck ("before 3.2.9 (Patch 9)").
      other_technical_detail:
        - "Root cause of privilege (why RCE lands as root, not www-data/emps): EMPS splits PHP execution across separate php-fpm pools by port/path — admin panel index.php on ports 4084/4085 runs in pool virt9178 AS ROOT; the client panel and every other .php file run in pools virt9179/virt9180 as user 'emps'. Dropping a webshell (e.g. vshell.php) would be served by the non-root pool — the exploit therefore avoids ever dropping a PHP file and instead relays commands through the same admin-panel billing-hook request, writing output to a random static .txt file in the webroot that nginx serves directly (no php-fpm involved), preserving root execution."
        - "Precondition for CVE-2026-43641 (stated honestly by the researcher): requires an existing account that is type=2, in-house-billing enabled, currently SUSPENDED, with cur_bal >= usage (a freshly-suspended, zero-usage account satisfies 0>=0) — this is server state that exists on any install using in-house billing, since suspended accounts are the normal product of that billing mode. No enumeration endpoint is needed because a non-destructive TIMING ORACLE exists: injecting 'sleep N' via the uid field causes a 3-second delay ONLY for an eligible uid, with identical status code/body otherwise — attacker sprays uid=1..N and watches for the hang."
        - "Environmental dependency: the exploit requires MySQL non-strict sql_mode (a lossy string-to-int cast is what lets the injected command string still satisfy an INT-typed WHERE clause). Researcher verified production Virtualizor ships with non-strict mode by default (bundled EMPS stack uses MySQL 5.5.62 with an empty default sql_mode, not overridden by the bundled my.cnf) — i.e. this is NOT a lab-only artifact, default production installs are exploitable out of the box."
        - "Fix mechanics (patch 9 / 3.3.0): (1) the shared pre-auth entry point now requires apicall_validate() to return a validated call (HMAC apikey or admin API credentials) before the billing hook is reachable at all — this alone removes 'unauthenticated' from all three CVEs; (2) the uid value is now explicitly (int)-cast before reaching vexec(), closing the command-injection sink directly; (3) the object-injection sink now calls unserialize() with ['allowed_classes' => false]; (4) the balance-write sink now requires the submitted email to exist and the submitted uid to be that email's real owner before writing."
        - "Distribution note: the vulnerable panel package is a straight unauthenticated download at http://api.virtualizor.com/updates.php?give=3.2.9.7 (91 MB ZIP, no license required) — i.e. the exact vulnerable build any operator would fetch and run was directly verifiable/reproducible by the researcher without a paid license."
        - "Disclosure timeline: reported 2026-08-22; CVEs assigned 2026-08-26 (120-day disclosure deadline 2026-12-24); vendor fix released 2026-09-01 (patch 9, and 3.3.0 already fixed); vendor requested re-test 2026-09-17; re-test confirmed fixed-in-9/3.3.0 and vulnerable-in-7/8 on 2026-09-20; public disclosure 2026-09-22."
        - "Operational guidance from the researcher directly: keep Virtualizor admin-panel ports 4084/4085 off the public internet or behind an allowlist REGARDLESS of patch level."

