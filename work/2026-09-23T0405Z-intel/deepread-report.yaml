  - id: 6
    title: "NCSC Switzerland Google recovery-phishing advisory"
    urls_fetched:
      - url: "https://www.bacs.admin.ch/de/26w38-de"
        saved_to: "work/2026-09-23T0405Z-intel/deepread-ncsc-google-phishing.txt"
        fetch_method: "extract (trafilatura-direct)"
        status: 200
    quotes:
      - quote_de: "Anschliessend generierten sie in ihrem eigenen Konto ein App-Passwort und benannten dieses im Textfeld mit: «Kevin W. Case-ID: 834333 To view your case…». Googles automatisches System verschickte daraufhin eine offizielle, technisch völlig einwandfreie Sicherheitswarnung an das Opfer."
        verdict: PASS
      - quote_de: "Dadurch behielten die Täter selbst nach einer Passwortänderung weiterhin Zugriff auf das Konto. Im gemeldeten Fall wurden noch längere Zeit nach dem Angriff unbemerkt E-Mails und Kontakte auf ein Gerät im Ausland synchronisiert."
        verdict: PASS
    contradictions: none
    enrichment:
      full_mechanism_ordered:
        - "1. Attackers create their OWN new Google account and set the VICTIM's email address as that account's recovery address."
        - "2. In their own account, attackers generate an App Password and name it in the free-text label field with social-engineering text mimicking a support case: '«Kevin W. Case-ID: 834333 To view your case…»'."
        - "3. Google's own automated system sends a genuine, technically legitimate security notification email to the victim (as the registered recovery address) — the free-text label is echoed verbatim into that legitimate email, making it look like an active, numbered Google support case."
        - "4. Shortly after, victim receives a phone call from a spoofed number that displays as a trusted-looking Swiss Google landline number; caller impersonates Google Security Support, applies urgency/pressure (imminent account loss); a victim's mention of hardware-key 2FA protection did not deter the caller."
        - "5. Caller redirects victim to a phishing page hosted on the legitimate Google Sites platform (sites.google.com) — genuine google.com-family domain shown in the browser address bar reduces victim suspicion — with an embedded malicious login form that exfiltrates entered credentials directly to the attackers."
        - "6. Once attackers have the harvested credentials, they log into the real account within minutes and create an App Password on the VICTIM's real account — App Passwords are legacy access tokens for older applications that work WITHOUT further 2FA/MFA confirmation, so this becomes a persistent backdoor that survives a subsequent password change by the victim."
        - "7. Observed impact in the reported case: emails and contacts silently synced to a foreign device for an extended period after the initial attack, undetected."
      telecom_spoofing_context: "Since mid-2026, Swiss telecom carriers enforce tightened rules to block or mark as 'unknown' spoofed Swiss landline/mobile numbers originating abroad — this measurably reduced fake-authority calls, but NCSC-CH stresses a Swiss-looking caller ID/number is STILL not proof of call authenticity, since attackers keep finding new spoofing paths."
      defender_recommendations_from_source:
        - "Legitimate platform operators never cold-call users about security incidents — hang up immediately on such calls."
        - "Never give passwords, SMS codes or confirmation prompts over the phone, and never type them into a site while being pressured on a call."
        - "Official Google login pages exist ONLY at accounts.google.com — NEVER at sites.google.com."
        - "Post-incident remediation checklist (source-stated): change account password immediately; sign out of all active sessions/foreign devices in account settings; check Google Account Security > App Passwords and delete ALL entries there without exception; review configured recovery email addresses and any automatic mail-forwarding rules."
      attack_technique_notes_for_composer: >
        Good ATT&CK-mappable angles: T1598/T1656-style impersonation + vishing (phone-based social
        engineering) as the initial vector, T1114 (Email Collection - ongoing sync of mail/contacts to
        a foreign device), and an MFA-bypass persistence mechanism via a legitimate-but-abusable
        'App Password' feature (closest fit is the generic T1556 Modify Authentication
        Process family, though App-Passwords-as-backdoor is a fairly distinct sub-pattern worth
        describing in prose rather than forcing a sub-technique id).

