  - title: "EU Court of Auditors: cybersecurity incident cooperation framework only partially effective, member states failed to report the September 2025 airport ransomware disruption as cross-border"
    sources:
      - { url: "https://www.eca.europa.eu/en/publications/SR-2026-19", publisher: "European Court of Auditors", date: "2026-09-22", role: "primary" }
      - { url: "https://www.heise.de/news/Rechnungshof-EU-nicht-genug-gegen-Cyberangriffe-gewappnet-11460919.html", publisher: "heise online", date: "2026-09-22", role: "corroborating" }
    discovery_trace: "first seen at: heise-sec, URL https://www.heise.de/security/feed.xml (RSS item 'Rechnungshof: EU nicht genug gegen Cyberangriffe gewappnet') -> primary: European Court of Auditors Special Report 19/2026, URL https://www.eca.europa.eu/en/publications/SR-2026-19"
    summary: |
      The European Court of Auditors published Special Report 19/2026 on 2026-09-22, concluding that the EU's cooperation framework for detecting and responding to cybersecurity incidents (CSIRTs network, EU-CyCLONe, the Cyber Blueprint, the European Cybersecurity Alert System, the EU Cybersecurity Reserve) is only partially effective, hampered by NIS2 transposition delays (only two member states met the October 2024 deadline), national-security legislation that lets member states withhold incident information without obligation, and no EU-wide platform to correlate cross-border incidents in real time. As a case study, the report documents that the September 2025 Collins Aerospace ransomware attack on airport passenger-processing systems (severe manual-fallback disruption at London Heathrow, Brussels, Berlin Brandenburg and Dublin) was never classified by Germany, Belgium or Ireland as "significant" or "large-scale cross-border" under NIS2, so none of them formally notified ENISA or other member states, and the CSIRTs network never briefed EU-CyCLONe. In 2025 only 14 significant cross-border incidents were reported EU-wide, by seven member states, and no incident has ever been designated "large-scale" since 2016 despite events like WannaCry and NotPetya. The Court's four recommendations (target dates 2026-2028) include a Commission/ENISA-led review of national-security restrictions on information sharing and work toward real-time incident reporting to ENISA.
    region_nexus: "EU-wide; directly frames the cross-border early-warning gap Swiss public-sector defenders rely on via European CERTs and supply-chain partners"
    primary_sector_nexus: "indirect"
    sector: "public-sector"
    cves: []
    techniques: []
    affected_products: []
    entity_keys:
      - policy:eu-cyber-resilience-act
    new_entities:
      - { key: "policy:eu-nis2-directive", type: policy, name: "EU NIS2 Directive (Directive on measures for a high common level of cybersecurity across the Union)", aliases: ["NIS 2", "Directive (EU) 2022/2555"], summary: "EU directive requiring member-state transposition and mandatory incident reporting by essential/important entities; ECA's Special Report 19/2026 finds implementation delayed and cross-border information sharing under it still limited (ECA, 2026-09-22)." }
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Yet, no member state treated this incident as being either significant or large-scale cross-border. Therefore, none of the affected member states formally notified ENISA or other member states of the incident. The CSIRTs network did not advise EU-CyCLONe, which therefore did not support the coordinated management of the incident."
        attribution: "European Court of Auditors, Special Report 19/2026"
        source_url: "https://www.eca.europa.eu/en/publications/SR-2026-19"
      - quote: "Member states had until October 2024 to transpose the NIS 2 Directive into national law, but only two met the deadline."
        attribution: "European Court of Auditors, Special Report 19/2026"
        source_url: "https://www.eca.europa.eu/en/publications/SR-2026-19"
      - quote: "In 2025, only 14 significant cross-border incidents were reported, by seven member states."
        attribution: "European Court of Auditors, Special Report 19/2026"
        source_url: "https://www.eca.europa.eu/en/publications/SR-2026-19"
    extended_notes: |
      Audit scope 2022-2025, visits to Ireland, Greece, Italy. Recommendation 1 targets the Commission/ENISA to analyse national-security restrictions on information sharing and pursue real-time incident reporting (2027/2028). Switzerland is outside the EU/NIS2 scope but is embedded in the same cross-border supply chains (aviation, finance, cloud) the report's case study concerns; the finding that formal EU cross-notification cannot be relied on for early warning is directly relevant to how Swiss public-sector CERTs/GovCERT.ch should weight direct primary-source monitoring over EU cross-notification channels.
    priority: notable

  - title: "Austria transposes NIS2: new Bundesamt für Cybersicherheit (BCS) takes over GovCERT/CERT.at oversight, 24h/72h incident-reporting clock goes live 1 October 2026"
    sources:
      - { url: "https://www.heise.de/news/Ab-1-10-Meldepflicht-fuer-IT-Vorfaelle-in-Oesterreich-11462442.html", publisher: "heise online", date: "2026-09-22", role: "corroborating" }
      - { url: "https://www.ots.at/presseaussendung/OTS_20260922_OTS0129/bundesamt-fuer-cybersicherheit-oesterreich-buendelt-schutz-vor-digitalen-bedrohungen", publisher: "Austrian Federal Ministry of the Interior (BMI), via OTS", date: "2026-09-22", role: "primary" }
    discovery_trace: "first seen at: heise-sec, URL https://www.heise.de/security/feed.xml (RSS item on NISG 2026) -> primary: Austrian Federal Ministry of the Interior press release, URL https://www.ots.at/presseaussendung/OTS_20260922_OTS0129/bundesamt-fuer-cybersicherheit-oesterreich-buendelt-schutz-vor-digitalen-bedrohungen"
    summary: |
      Austria's Netz- und Informationssystemsicherheitsgesetz 2026 (NISG 2026), the country's NIS2 transposition (two years late), enters into force on 1 October 2026, creating a new Bundesamt für Cybersicherheit (BCS) under the Interior Ministry, led by former Austrian Power Grid CIO Markus Kasinger. The BCS becomes the central registration/supervision authority for "essential" and "important" entities across energy, transport, health, water, digital infrastructure, industry and food supply (municipalities excluded), takes over operation of the civilian-administration GovCERT and gains oversight of sectoral CERTs (e.g. Austrian HealthCERT) and the general-economy CERT.at. Covered entities face a graduated reporting clock — an immediate/24-hour early warning, then a detailed notification within 72 hours, with further reports and a final report as the incident develops — mandatory security-awareness training for management, and new powers for the BCS to run active vulnerability scans against internet-facing systems of essential entities, with obstruction of such scans a criminal offence from 1 October. Enforcement/fines run through the competent district administrative authority rather than the BCS itself.
    region_nexus: "Austria (DACH neighbour); direct comparator for Switzerland's own cantonal/federal cybersecurity-law rollouts (e.g. Canton Bern's ICSG, also entering force 1 November 2026)"
    primary_sector_nexus: "direct"
