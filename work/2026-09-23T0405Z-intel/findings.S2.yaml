  - title: "NCSC Switzerland (BACS): attackers weaponise Google's own recovery-address notification plus a Google Sites-hosted phishing page to plant an OAuth app-password backdoor that survives a password reset"
    sources:
      - { url: "https://www.bacs.admin.ch/de/26w38-de", publisher: "Bundesamt für Cybersicherheit (BACS) / NCSC Switzerland", date: "2026-09-22", role: "primary" }
    discovery_trace: "first seen at: ncsc-ch-focus, URL https://www.bacs.admin.ch/de/im-fokus -> primary (no pivot needed): https://www.bacs.admin.ch/de/26w38-de"
    summary: |
      Switzerland's national cybersecurity authority (BACS/NCSC-CH) reports a fraud chain combining abuse of a legitimate Google account-security feature with vishing and app-password persistence. Attackers create their own Google account, register the victim's address as its "recovery address," then generate an app password inside their own account and name it with social-engineering text impersonating a support case ("Kevin W. Case-ID: 834333 To view your case…"). Google's automatic recovery-notification email is technically genuine and unmodifiable by the attacker except for that free-text label, so the victim receives an authentic Google security alert that reads like an active support ticket. A follow-up vishing call from a spoofed Swiss-looking number (surviving Switzerland's mid-2026 anti-spoofing rules for foreign-originated calls) pressures the victim to resolve the "compromise" via a phishing page hosted on the legitimate sites.google.com domain (not accounts.google.com), which relays entered credentials to the attacker in real time. Once inside the real account, the attacker immediately provisions an app password of their own — a legacy credential type that bypasses two-factor authentication — giving persistent access that survives a subsequent password change; BACS records a case where email and contacts kept synchronizing to a foreign device unnoticed for an extended period after the initial compromise.
    region_nexus: "Switzerland (NCSC-CH/BACS national advisory)"
    primary_sector_nexus: "indirect"
    sector: "public-sector"
    cves: []
    techniques: [T1566.004, T1656, T1098.001]
    affected_products: ["Google Workspace", "Google Account"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE-NATIONAL-CERT
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "Anschliessend generierten sie in ihrem eigenen Konto ein App-Passwort und benannten dieses im Textfeld mit: «Kevin W. Case-ID: 834333 To view your case…». Googles automatisches System verschickte daraufhin eine offizielle, technisch völlig einwandfreie Sicherheitswarnung an das Opfer."
        attribution: "Bundesamt für Cybersicherheit (BACS) / NCSC Switzerland"
        source_url: "https://www.bacs.admin.ch/de/26w38-de"
      - quote: "Dadurch behielten die Täter selbst nach einer Passwortänderung weiterhin Zugriff auf das Konto. Im gemeldeten Fall wurden noch längere Zeit nach dem Angriff unbemerkt E-Mails und Kontakte auf ein Gerät im Ausland synchronisiert."
        attribution: "Bundesamt für Cybersicherheit (BACS) / NCSC Switzerland"
        source_url: "https://www.bacs.admin.ch/de/26w38-de"
    extended_notes: |
      Triage: legitimate Google/Workspace admins and helpdesks never call account holders unprompted about a security case; the giveaway is the free-text "case ID" riding inside an otherwise-genuine Google recovery-address notification, and any login page under sites.google.com rather than accounts.google.com. Detection/hardening for any org using Google Workspace: audit and restrict app-password issuance (Workspace admin console can disable legacy app passwords org-wide), and treat an app-password creation event as equivalent in sensitivity to a new OAuth grant for incident-response purposes since it is a durable, MFA-bypassing credential a full password rotation does not revoke.
    priority: routine
    borderline: true
    borderline_reason: "consumer/staff-facing social-engineering advisory rather than an organizational compromise or systemic vulnerability, but carries a detection-relevant identity-persistence technique (app-password backdoor surviving password reset) from the authoritative Swiss national CERT within the window."

  - title: "CERT Polska's own MikroTrick technical write-up corrects the chain's entry-point CVE and discloses that GPT-5.5-cyber/GPT-5.6-sol LLM agents ran the autonomous vulnerability-research lab that found it"
    sources:
      - { url: "https://cert.pl/en/posts/2026/09/mikrotrick-technical-analysis/", publisher: "CERT Polska / NASK", date: "2026-09-22", role: "primary" }
    discovery_trace: "first seen at: cert-pl, URL https://cert.pl/en/rss.xml -> primary (no pivot needed): https://cert.pl/en/posts/2026/09/mikrotrick-technical-analysis/"
    summary: |
      CERT Polska published a full technical write-up of the MikroTrick RouterOS chain (already covered in this store as CVE-2026-67276/CVE-2026-86060, entry dated 2026-09-06) that corrects a material fact from the original disclosure: CVE-2026-67276, previously reported as the chain's forged-signature entry point, is "a separate vulnerability that allows an attacker to impersonate a user authenticated with an RSA key," requiring the target account name and RSA modulus in advance -- "significantly less suitable for a mass attack that works regardless of device configuration." CERT Polska states plainly that "some publications incorrectly associated CVE-2026-67276 with the MikroTrick chain." The real entry point is CVE-2026-67279: RouterOS's SSH server, when a client initiates a key re-exchange ("rekey") mid-authentication, "unconditionally moved from the temporary rekey state to channel handling instead of resuming the interrupted authentication," accepting a session channel despite never sending SSH_MSG_USERAUTH_SUCCESS. CVE-2026-86060 then exploits that a username of "-2" is parsed by the /nova/bin/login helper as the `-N` file-descriptor option rather than a literal username, so login reads an attacker-controlled username and effective policy mask from file descriptor 2 -- the shared pseudoterminal -- yielding full unauthenticated administrative access with no password, key, or completed auth exchange. Public attack logs (source IP 82.192.72.4, a failed login for user "-2" followed by creation of a privileged "ops" account, then RIF diagnostic-file exfiltration via the `fetch` command) date to 2 September, a day before MikroTik's 3 September patch. Separately, CERT Polska discloses that the underlying research -- virtual-machine snapshotting via libvirt across 40 CHR VMs and 24 RouterOS releases, binary diffing with radare2/Ghidra, and systematic SSH protocol-state-machine fuzzing that surfaced the rekey bug -- was performed by LLM agents (GPT-5.5-cyber and GPT-5.6-sol via OpenAI's GTAC program, plus locally hosted GLM/DeepSeek/Qwen/PLLuM models) operating with reduced refusal thresholds, with human researchers focused on scoping experiments and validating results against repeatable, negative-tested findings.
    region_nexus: "Poland (CERT Polska); the underlying RouterOS chain already carries an NCSC-CH exploitation flag for Swiss deployments"
    primary_sector_nexus: "indirect"
    sector: "public-sector"
    cves: [CVE-2026-67279, CVE-2026-86060, CVE-2026-67276]
    techniques: [T1190]
    affected_products: ["MikroTik RouterOS"]
    entity_keys:
      - trend:mikrotik-routeros-mikrotrick-2026-09
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE-NATIONAL-CERT
    confidence: HIGH
    novelty: "update-of:2026-09-06/mikrotik-routeros-mikrotrick-ssh-auth-bypass-privesc-chain"
    evidence:
      - quote: "Some publications incorrectly associated CVE-2026-67276 with the MikroTrick chain. It is a separate vulnerability that allows an attacker to impersonate a user authenticated with an RSA key. Exploitation requires the account name and the modulus of the public key assigned to it, while a successful attack provides access only to that account."
        attribution: "CERT Polska"
        source_url: "https://cert.pl/en/posts/2026/09/mikrotrick-technical-analysis/"
      - quote: "Vulnerable versions of the RouterOS SSH server handled a rekey initiated during user authentication incorrectly. When the rekey finished, the server unconditionally moved from the temporary rekey state to channel handling instead of resuming the interrupted authentication."
        attribution: "CERT Polska"
        source_url: "https://cert.pl/en/posts/2026/09/mikrotrick-technical-analysis/"
      - quote: "We conducted the RouterOS research using GPT-5.5-cyber and GPT-5.6-sol models with reduced refusal thresholds through our access to the OpenAI GTAC program."
        attribution: "CERT Polska"
        source_url: "https://cert.pl/en/posts/2026/09/mikrotrick-technical-analysis/"
      - quote: "By the end of the research, the lab contained 40 CHR virtual machines, 39 snapshots, and 24 RouterOS releases ranging from 6.43.11 to 7.25beta3."
        attribution: "CERT Polska"
        source_url: "https://cert.pl/en/posts/2026/09/mikrotrick-technical-analysis/"
    extended_notes: |
      This corrects a load-bearing fact carried in the store's existing MikroTrick entry (2026-09-06), whose title and headline named CVE-2026-67276 as the "forged-signature SSH authentication bypass" half of the chain -- per CERT Polska's own account that attribution is wrong, and the real entry-point flaw is CVE-2026-67279 (SSH rekey-during-auth state confusion), which was already listed among the entry's CVEs but not credited as the chain's actual first stage. Detection angle CERT Polska supplies directly: the tell-tale log signature is a failed SSH login for username "-2" immediately followed by creation of an unexpected fully-privileged account (their case: "ops") -- this pairing, not either event alone, is the discriminator, and RouterOS's own post-patch Flagged/IoC mechanism now auto-disables an "ops" account in the "full" privilege group at startup as a compromise indicator. Separately of clear standing-interest value: this is a national CERT publicly disclosing its own production use of jailbroken/reduced-refusal frontier LLM agents (via a formal OpenAI government-research-access program) for autonomous offensive vulnerability discovery against network infrastructure -- vendor-neutral evidence that state-affiliated defensive research bodies now run the same class of AI-assisted binary-diffing and protocol-fuzzing pipeline increasingly reported on the attacker side elsewhere in this window (Talos's AI-generated Qilin wiper scripts, CrowdStrike's PhantomRaven).
    priority: notable
