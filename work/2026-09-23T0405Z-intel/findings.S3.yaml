  - title: "Virtualizor VPS/hypervisor control panel: a login-page guard's own exemption for act=login lets an unauthenticated attacker reach root on the host node (three CVEs, one unauthenticated remote root RCE)"
    sources:
      - { url: "https://www.vulncheck.com/blog/virtualizor-billing-hook-unauthenticated-root-rce", publisher: "VulnCheck", date: "2026-09-22", role: "primary" }
    discovery_trace: "first seen at: vulncheck (rotation source), URL https://www.vulncheck.com/blog → primary: VulnCheck's own disclosure post, URL https://www.vulncheck.com/blog/virtualizor-billing-hook-unauthenticated-root-rce (no pivot needed -- VulnCheck is both the discovering researcher and the CVE Numbering Authority for the assigned CVEs; corroboration attempted via WebSearch, only CVE-database mirrors of VulnCheck's own record found, no independent second analysis surfaced)"
    summary: |
      VulnCheck's Initial Access Intelligence team discloses three unauthenticated vulnerabilities in Virtualizor, Softaculous' commercial VPS/hypervisor control panel (KVM/OpenVZ/LXC), all reached through a single mis-scoped pre-authentication guard. In enduser/index.php, the admin panel (ports 4084/4085) walks a pre-auth block that redirects every request to the login page except one: when the act GET parameter equals 'login', the redirect's inequality check is false and control falls through to an unauthenticated from_billing_module handler with no session, API key or slave credentials. CVE-2026-43641 (the flagship, CWE-78 OS command injection, CVSS not stated by source but described as reaching uid=0): the handler's uid field, taken unvalidated from an unserialized attacker POST body, is concatenated into a shell command inside billing_unsuspend() -> vexec() -> proc_open(), giving remote root command execution. Exploitation requires a paid, currently-suspended in-house-billing account to exist on the target (any real deployment has these by design) -- no separate enumeration step is needed because the same request path is a non-destructive timing oracle (a sleep-payload probe hangs only for a valid, eligible uid). The bug needs MySQL's default non-strict sql_mode (confirmed present in Virtualizor's own bundled MySQL 5.5.62 EMPS stack) because a stricter mode's truncation error would otherwise abort the query chain before the shell executes. Because the vulnerable index.php request is served by the root-privileged php-fpm pool reserved for the admin panel (distinct from the unprivileged pool serving every other .php file), the exploit avoids dropping a PHP webshell (which would run unprivileged) and instead relays each command's output to a random static file written directly into the webroot and fetched over plain HTTP. CVE-2026-43642 (CWE-502, PHP object injection): the same handler runs native unserialize() with no allowed_classes restriction on attacker-controlled POST data; no working POP gadget chain exists in the stock code today, but the primitive is unauthenticated and remains live for any addon/plugin that introduces a class with __wakeup/__destruct. CVE-2026-43643 (CWE-639, missing authorization): the same handler's 'whmcs' branch lets an unauthenticated caller zero out or inflate any tenant's account balance via a parameterized-but-unauthenticated UPDATE, independent of sql_mode. All three were confirmed exploitable on Virtualizor 3.2.9 patch 7 and patch 8; Softaculous fixed all three in 3.2.9 patch 9 (2026-09-01, carried into 3.3.0) by requiring apicall_validate() (a valid HMAC-based API key or admin credentials) before the handler is reached at all, casting uid to (int) before it reaches the shell, adding allowed_classes => false to the deserialization call, and adding an email/uid ownership check to the balance-write branch. No exploitation in the wild is reported by VulnCheck; this is vendor-fixed vulnerability research, not an active-exploitation alert.
    region_nexus: "global; any organization or hosting provider (including those serving Swiss public-sector cloud/VPS workloads) running a self-managed Virtualizor control panel on 3.2.9 patch 8 or earlier"
    primary_sector_nexus: "indirect"
    sector: "hosting / infrastructure (VPS and hypervisor management)"
    cves: [CVE-2026-43641, CVE-2026-43642, CVE-2026-43643]
    techniques: [T1190, T1068]
    affected_products: ["Softaculous Virtualizor"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "the pre-auth billing-module hook is guarded only against requests whose act is not 'login', so act=login walks straight into it"
        attribution: "VulnCheck"
        source_url: "https://www.vulncheck.com/blog/virtualizor-billing-hook-unauthenticated-root-rce"
      - quote: "Verified on the lab: /tmp/x reads uid=0(root) gid=0(root) groups=0(root)."
        attribution: "VulnCheck"
        source_url: "https://www.vulncheck.com/blog/virtualizor-billing-hook-unauthenticated-root-rce"
      - quote: "Softaculous patched all three in 3.2.9 patch 9 (2026-09-01), and the fix carries into 3.3.0 (2026-09-09), the current build. Patch 7, the build audited above, and patch 8 are both still vulnerable"
        attribution: "VulnCheck"
        source_url: "https://www.vulncheck.com/blog/virtualizor-billing-hook-unauthenticated-root-rce"
    extended_notes: |
      No CVSS score was stated in the VulnCheck post itself; NVD had not yet published a scored record for these three CVE ids at fetch time (disclosure was same-day). VulnCheck is the assigning CNA and the discovering researcher, so this is treated as an authoritative single primary (equivalent standing to a vendor advisory) rather than an unverified claim, but no second independent technical analysis has surfaced yet -- flagged SINGLE-SOURCE-OTHER per the verification gate. Worth a hunt note: the parameterized-query bypass mechanism here (MySQL casting an injected string back to the leading integer it needs, defeating a bound-parameter "fix" that was never a trust boundary in the first place) is a reusable lesson for any code review that treats "uses parameterized queries" as sufficient when the same tainted value is later also used in a shell command or file path.
