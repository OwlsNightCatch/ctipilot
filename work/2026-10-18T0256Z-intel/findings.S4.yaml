items:
- title: 'ConnectWise Cloud Backup (formerly SkyKick): the vendor''s own app credential is used to sign in to customer Microsoft 365 tenants and, in some, to self-assign admin roles and plant credentials on other apps'
  sources:
  - url: https://www.connectwise.com/company/trust/advisories
    publisher: ConnectWise
    date: '2026-10-18'
    role: primary
  - url: https://www.huntress.com/blog/vendor-credential-enables-unauthorized-access
    publisher: Huntress
    date: '2026-10-17'
    role: primary
  - url: https://www.todyl.com/blog/investigation-unauthorized-access-through-the-connectwise-cloud-backup-microsoft-365-app
    publisher: Todyl
    date: '2026-10-15'
    role: primary
  - url: https://www.bleepingcomputer.com/news/security/hackers-breach-microsoft-365-tenants-via-connectwise-supply-chain-attack/
    publisher: BleepingComputer
    date: '2026-10-17'
    role: corroborating
  discovery_trace: 'first seen at: bleepingcomputer, URL https://www.bleepingcomputer.com/feed/ (feed item ''Hackers breach Microsoft 365 tenants via ConnectWise supply-chain attack'', 2026-10-17) -> extract of the article URL https://www.bleepingcomputer.com/news/security/hackers-breach-microsoft-365-tenants-via-connectwise-supply-chain-attack/ -> pivot: Huntress, URL https://www.huntress.com/blog/vendor-credential-enables-unauthorized-access -> pivot: Todyl, URL https://www.todyl.com/blog/investigation-unauthorized-access-through-the-connectwise-cloud-backup-microsoft-365-app -> primary: ConnectWise Trust Center advisory, URL https://www.connectwise.com/company/trust/advisories (Microsoft''s own statement is an X post only; Microsoft Security Blog feed and CERT-FR/CERT-EU/NCSC-NL/NCSC.ch hub checked, no post or advisory yet)'
  summary: 'ConnectWise says it identified unauthorized access to application identities in its Cloud Backup (formerly SkyKick) environment. Huntress and Todyl, both reading Microsoft Entra sign-in logs, report that the app''s vendor-held credential was presented from 15 October to obtain app-only Microsoft Graph tokens in customer tenants; Huntress had confirmed unauthorized sign-ins in 162 monitored tenants by 16 October. The credential lives in the vendor''s tenant and is used through the OAuth client-credentials flow, so no user sign-in, MFA prompt or user Conditional Access applies, and the app''s existing consent already covers read/write on mail, OneDrive/SharePoint and Teams plus restore. Huntress also saw ConnectWise Cloud Management service principals assign themselves directory roles (mostly Exchange Administrator) in about 50 tenants and, in one tenant, add the Teams app to Global Administrator and add client secrets to an MSP management application and to a security vendor''s
    own application within about five minutes; it reports a second, targeted wave on 15 October against 16 tenants in policy, national-security, trade and critical-mineral sectors, mostly without ConnectWise products, that failed where the service principal was absent. ConnectWise disabled seven application identities at 07:00 UTC on 17 October, suspended Cloud Backup by revoking the certificates behind the shared credentials and took SaaS Security and Cloud Management offline; it states that disabling does not reverse changes already made in a tenant and that issued tokens may stay usable until they expire. Microsoft, as relayed by BleepingComputer, confirmed malicious activity and called it an active supply-chain attack. Not public: how the vendor credential was obtained, the actor, the victim count and what data was actually read (Todyl and Huntress both note that Graph reads leave no audit trail unless Graph activity logging was on). No source names a Swiss victim.'
  region_nexus: global; Swiss exposure is structural (Microsoft 365 tenants of administrations and their MSPs that ever consented a ConnectWise or SkyKick app), no Swiss victim named by any source
  primary_sector_nexus: indirect (MSP and managed-service supply chain into Microsoft 365 tenants; Huntress's targeted wave listed policy and national-security tenants)
  sector: public-sector, technology
  cves: []
  techniques:
  - T1199
  - T1078.004
  - T1098.003
  - T1098.001
  - T1110.003
  affected_products:
  - ConnectWise Cloud Backup
  - ConnectWise Cloud Management
  - Microsoft Entra ID
  - Microsoft 365
  entity_keys: []
  new_entities:
  - key: incident:connectwise-cloud-backup-skykick-app-credential-abuse-2026-10
    type: incident
    name: ConnectWise Cloud Backup (SkyKick) app-credential abuse against Microsoft 365 tenants, October 2026
    aliases:
    - SkyKick/CW breach
    summary: From 2026-10-15 an unauthorized party used credentials of ConnectWise Cloud Backup (formerly SkyKick) and Cloud Management application identities to sign in to customer Microsoft 365 tenants; ConnectWise disabled seven application identities on 2026-10-17 (ConnectWise advisory, Huntress, Todyl, 2026-10-15 to 2026-10-18).
  - key: product:connectwise-cloud-backup
    type: product
    name: ConnectWise Cloud Backup (formerly SkyKick Cloud Backup)
    aliases:
    - SkyKick Backup
    - SkyKick Cloud Backup
    - ConnectWise Cloud Management (SkyKick Cloud Manager)
    summary: Multi-tenant Microsoft 365 cloud-to-cloud backup and tenant-management service for MSPs, consented into customer Entra tenants as a service principal with broad application permissions (ConnectWise advisory, Huntress).
  relation_suggestions:
  - subject: incident:connectwise-cloud-backup-skykick-app-credential-abuse-2026-10
    object: product:connectwise-cloud-backup
    basis: 'ConnectWise advisory: unauthorized access to application identities associated with ConnectWise Cloud Backup, formerly SkyKick (ConnectWise, 2026-10-18)'
  verification: MULTI-SOURCE
  confidence: HIGH
  novelty: new
  evidence:
  - quote: unauthorized access to application identities associated with ConnectWise Cloud Backup
    attribution: ConnectWise
    source_url: https://www.connectwise.com/company/trust/advisories
  - quote: Disabling the affected connections prevents new authentication through those connections; it does not reverse changes previously made inside a tenant.
    attribution: ConnectWise
    source_url: https://www.connectwise.com/company/trust/advisories
  - quote: Whether a product vulnerability contributed has not been established. The original credential-exposure mechanism remains under investigation.
    attribution: ConnectWise
    source_url: https://www.connectwise.com/company/trust/advisories
  - quote: As of 19:00 UTC on October 16, Huntress has confirmed unauthorized sign-ins in 162 tenants.
    attribution: Huntress
    source_url: https://www.huntress.com/blog/vendor-credential-enables-unauthorized-access
  - quote: The credential type was a client assertion, which means the credential lives in the vendor's own tenant.
    attribution: Huntress
    source_url: https://www.huntress.com/blog/vendor-credential-enables-unauthorized-access
  - quote: These tenants are in the policy, national security, trade, and critical mineral sectors.
    attribution: Huntress
    source_url: https://www.huntress.com/blog/vendor-credential-enables-unauthorized-access
  - quote: Because the application already held broad, previously granted permissions in each tenant, those sign-ins gave the attacker the technical ability to read and write mail and attachments, OneDrive and SharePoint files, and Teams chats.
    attribution: Todyl
    source_url: https://www.todyl.com/blog/investigation-unauthorized-access-through-the-connectwise-cloud-backup-microsoft-365-app
  - quote: tokens already issued stay valid for up to 90 minutes
    attribution: Todyl
    source_url: https://www.todyl.com/blog/investigation-unauthorized-access-through-the-connectwise-cloud-backup-microsoft-365-app
  - quote: Microsoft Threat Intelligence characterized the incident as an active supply-chain attack, assessing that the attacker likely abused existing permissions, including Directory.ReadWrite.All.
    attribution: BleepingComputer
    source_url: https://www.bleepingcomputer.com/news/security/hackers-breach-microsoft-365-tenants-via-connectwise-supply-chain-attack/
  - quote: At the time of publishing the victim count and the extent of data theft remains unclear, as well as the method the attacker used to obtain vendor credentials.
    attribution: BleepingComputer
    source_url: https://www.bleepingcomputer.com/news/security/hackers-breach-microsoft-365-tenants-via-connectwise-supply-chain-attack/
  extended_notes: 'FACTS vs CLAIMS. Facts (vendor, first-hand): ConnectWise advisory first published 2026-10-16 17:47 UTC, last updated 2026-10-18 01:00 UTC; it disabled seven ConnectWise application identities (Cloud Backup plus six Cloud Management apps: Cloud Management itself and its Teams, Exchange Online, Graph, Partner Center and SharePoint Online variants; client IDs are in the advisory) at 07:00 UTC on 2026-10-17 and revoked the certificates behind the shared Cloud Backup credentials; Cloud Backup, SaaS Security and Cloud Management stay offline with no restoration time; it says it has no evidence the encrypted backup archives were accessed and that it cannot see downstream tenant activity. Claims (telemetry holders): Huntress 162 tenants confirmed, nearly 1,000 Entra tenants with sign-in activity from the one source address and over 300 successful (Huntress, 2026-10-17 update); Todyl assesses all tenants with the app consented should be treated as compromised and found no directory
    changes in the nine tenants it analysed (Todyl). Microsoft''s position is relayed by BleepingComputer from a Microsoft Threat Intelligence post on X (not citable directly): confirmed malicious activity, persistence via a backdoor after service-principal authentication, then Graph reconnaissance and attempts to add credentials. Inference by Huntress: the 03:44-03:49 UTC role-and-credential changes in one tenant came from a Python user agent unlike the vendor apps'' .NET SDK agent, and Huntress has not tied that phase to the later hosting-IP sign-ins (no source address for it). TIMELINE (UTC, all Huntress/Todyl telemetry): password spraying against four law-firm tenants 13-14 Oct from one hosting address (no successful user sign-ins seen); 15 Oct 01:58 onward service principals self-assign directory roles in ~50 tenants; 15 Oct 03:44-03:49 Global Administrator self-assignment and client secrets (expiring 2028) added to an MSP management app and a security-vendor app in one tenant; 15 Oct
    06:13-08:47 scripted Graph-token requests across tenants in ascending tenant-GUID order, one token per tenant, a few seconds to minutes apart, including nine Todyl tenants with no active backup subscription; 15 Oct 09:25-14:20 second wave on 16 Huntress-protected tenants (first sweep scripted Graph tokens, second sweep manual against Exchange Online, SharePoint Online, Teams, Azure Resource Manager, Entra and Office 365 Management APIs). DEFENDER VANTAGE (all from the three primaries). Exposure: any Entra tenant (an organisation''s own and each MSP-managed customer tenant, including dormant SkyKick connections) where a ConnectWise or SkyKick enterprise application was ever consented; check Enterprise applications by application client ID, not display name (older tenants show ''SkyKick Cloud Manager''). The legitimate service signs in from Azure/Microsoft-internal IPv6 egress on a recurring job pattern with a .NET SDK (''kiota-dotnet'') user agent. Detection (telemetry class first): Entra
    service-principal sign-in logs (a separate tab from the default user sign-ins) for these apps from any non-Microsoft address; Entra directory audit events ''Add member to role'', ''Update application'' and ''Add service principal credentials'' where the initiator is a ConnectWise/SkyKick service principal (a service principal assigning itself a role or modifying other apps is unusual on its own); Microsoft Graph activity logs (Entra ID P1/P2, not retroactive) for per-request source addresses; unified audit log mail/file/Teams read events by the app. Entra retains audit and sign-in records 7 days on Free and 30 days on P1/P2, so export now. Post-containment check (the step most readers miss): disabling the vendor apps does not remove credentials, roles, consents, mailbox forwarding or delegations already planted through them; review client secrets, certificates and federated credentials on every enterprise app and app registration (especially MSP management and security tools) for entries
    added since 13 October, directory roles held by service principals, Conditional Access exclusions for the app, and Exchange forwarding/transport rules; revoking user sessions does not end app-based access and issued tokens can live up to 90 minutes. Triage / benign lookalike: Python or curl user agents are low-fidelity on their own and the vendor apps legitimately call Graph; the discriminators Huntress and Todyl give are a single commercial hosting source address instead of Azure egress, a service principal acting on directory roles or other apps, one token per tenant in ascending GUID order, and sign-ins in tenants that have no active backup subscription. Hardening levers named by the sources: application management policies restricting client secrets, workload-identity Conditional Access (extra licensing), Entra ID Protection risky-service-principal flags, least-privilege consent and removal of unused multi-tenant apps (Conditional Access cannot be applied to third-party multi-tenant
    apps). SUGGESTED ACTION (do-now only for organisations or MSPs that run these apps): in every Entra tenant they administer, find and disable (not delete, to keep the consent) the seven ConnectWise application identities listed in ConnectWise''s advisory, keep them disabled until the vendor confirms a credential reset, then review credentials added to any app since 13 October. Suggested classification: reliability A for the vendor''s statements about its own incident, credibility 1 for the core facts (vendor plus two independent telemetry holders); attribution and root cause 3 or lower. Suggested priority: high; not critical for an organisation with none of these apps consented. Overlap: S3 also surfaced this item in this run (S3.progress), merge on the incident key.'
- title: 'IDC Frontier sixth report (2026-10-18): IDCF Cloud Backup service resumes after safety confirmation, snapshot function stays suspended'
  sources:
  - url: https://www.idcf.jp/news/topics/20261018001
    publisher: IDC Frontier (sixth report, Japanese)
    date: '2026-10-18'
    role: primary
  discovery_trace: 'first seen at: WebFetch of https://www.idcf.jp/news/topics/ (listing; dated newest item 2026/10/18) -> primary (no pivot needed): extract of https://www.idcf.jp/news/topics/20261018001'
  summary: IDC Frontier's sixth report, dated 2026-10-18, says it has finished its safety verification and is resuming the IDCF Cloud Backup service that it had stopped after the third-party unauthorized access. Customers still running virtual servers in East Japan Region 1 (radian and newton zones), East Japan Regions 2 and 3 and West Japan Region 1, who had been asked to take their own data backups as a precaution, can now fetch backup data quickly and restore it to clouds other than IDCF Cloud or to on-premises environments. The snapshot function, which the fifth report tied to backup retrieval for 194 customers, remains suspended for safety verification. IDCF Cloud TypeS and the IDCF private cloud are stated to be outside the incident. The report adds no cause, intrusion route or actor.
  region_nexus: 'apac (Japan); transferable lesson only: backup data held inside the compromised cloud platform was unavailable until the provider verified it'
  primary_sector_nexus: indirect (cloud provider serving local governments, Japan)
  sector: technology, public-sector
  cves: []
  techniques:
  - T1486
  affected_products:
  - IDC Frontier IDCF Cloud
  entity_keys:
  - incident:idc-frontier-idcf-cloud-ransomware-2026-10
  new_entities: []
  verification: SINGLE-SOURCE-OTHER
  confidence: HIGH
  novelty: update-of:2026-10-11/idc-frontier-idcf-cloud-ransomware-495-customers-backups
  borderline: true
  borderline_reason: service-status delta only on a routine-priority, out-of-region entry; no new cause, route, actor or data-loss fact; the main agent may fold it as an update record or drop it
  evidence:
  - quote: 「IDCFクラウド バックアップ」の提供再開によって、お客さまはバックアップデータを速やかに取得できるようになる他、IDCFクラウド以外のクラウド環境やオンプレミス環境などにデータを復元することができます。
    translation: With the resumption of IDCF Cloud Backup, customers will be able to retrieve backup data quickly and can also restore the data to cloud environments other than IDCF Cloud and to on-premises environments.
    attribution: IDC Frontier (sixth report, Japanese)
    source_url: https://www.idcf.jp/news/topics/20261018001
  - quote: なお、「スナップショット機能」※2は、安全性の確認のために現在も提供を停止しています。
    translation: The snapshot function remains suspended for safety verification.
    attribution: IDC Frontier (sixth report, Japanese)
    source_url: https://www.idcf.jp/news/topics/20261018001
  extended_notes: 'Single vendor primary, acceptable for the vendor''s own incident status. The fourth report (2026-10-09, https://www.idcf.jp/news/topics/20261009001, fetched) adds only the response structure: an emergency task force set up 2026-10-07 09:00 with parent SoftBank, SoftBank''s corporate sales unit as the customer window, and IDCF staff starting or stopping customers'' virtual servers on request.'
