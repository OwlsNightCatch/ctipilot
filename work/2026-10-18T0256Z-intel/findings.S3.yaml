  - title: "Zscaler ThreatLabz on CVE-2026-88771 exploitation: an access-log payload staged in the User-Agent across four login paths, web-shell and CGI enablement, and a FreeBSD x64 implant fetched from infrastructure also seen in StyleSmuggler (Magento) exploitation"
    sources:
      - { url: "https://www.zscaler.com/blogs/security-research/cve-2026-88771-inside-exploitation-critical-netscaler-rce-vulnerability", publisher: "Zscaler ThreatLabz", date: "2026-10-16", role: "primary" }
    discovery_trace: "first seen at: zscaler-threatlabz feed https://www.zscaler.com/blogs/security-research (feed https://www.zscaler.com/blogs/feeds/security-research, item 2026-10-16T21:28Z, gap sweep) → primary (no pivot needed): Zscaler article, URL https://www.zscaler.com/blogs/security-research/cve-2026-88771-inside-exploitation-critical-netscaler-rce-vulnerability (extract). Checked against the existing entry 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev, which does not cite Zscaler."
    summary: |
      Zscaler ThreatLabz reports first-party telemetry of CVE-2026-88771 exploitation on NetScaler ADC and Gateway: GET requests to four default logon and VPN paths carry a User-Agent beginning with an INDEX marker followed by a Base64
      command string, so the payload sits in the HTTP access log without executing; POST requests to the authentication endpoints then send a login value that imitates a Pitboss PPE failure record ("PPE missed too many heartbeats" or
      "PPE unexpectedly died") with shell syntax that greps the access logs for the marker, decodes and executes it when the vendor's crash-log Perl script later selects the forged record (ThreatLabz follows public analysis for the trigger and notes
      CERT-EU's observation that the script takes the last matching record, which may explain repeated submissions). The staged payload fingerprints the appliance (id, uname, hostname, release), writes PHP and Perl CGI web shells into six web-served
      directories, switches php_engine on in /etc/httpd.conf, adds a .pl CGI handler and signals the web server to reload. A shorter inline variant uses ${IFS} for spaces; a second inline variant makes the appliance fetch and run a Rust-built 64-bit FreeBSD binary.
      ThreatLabz saw at least 26 source addresses send the forged-record-plus-downloader sequence within about six to seven minutes, and says the download server also appeared in its earlier StyleSmuggler (CVE-2026-75650, Adobe Commerce and Magento) exploitation data.
      ThreatLabz itself says this overlap is an investigative lead and does not establish attribution; shared hosting, a malware-distribution service or payload reuse could explain it. What is new against the existing entry: the FreeBSD implant delivery,
      the cross-platform infrastructure overlap, the burst pattern and the web-server-configuration change set; the log-poisoning chain itself is already carried from watchTowr and Unit 42.
    region_nexus: "global; NetScaler Gateway and ADC are widely deployed in European public-sector remote-access estates (existing entry carries the sector statements)"
    primary_sector_nexus: "direct for operators of internet-facing NetScaler ADC/Gateway; no new sector statement in this source"
    sector: "public-sector (existing entry); cross-sector"
