  - title: "October 2026 Windows security updates switch the NTLMv1-derived single sign-on block to Enforce by default on Windows 11 24H2/25H2/26H2 and Windows Server 2025 without Credential Guard, which breaks MS-CHAPv2 sign-on for Wi-Fi, Ethernet and VPN"
    sources:
      - { url: "https://support.microsoft.com/en-gb/servicing/os/windows/docs/2025/08/upcoming-changes-to-ntlmv1-in-windows-11-version-24h2-and-windows-server-2025", publisher: "Microsoft Support (KB5066470)", date: "2026-10-14", role: "primary" }
      - { url: "https://www.theregister.com/security/2026/10/16/networking-problems-after-the-october-2026-windows-update-ntlm-might-be-to-blame/5303503", publisher: "The Register", date: "2026-10-16", role: "corroborating" }
    discovery_trace: "first seen at: theregister-security-feed atom https://www.theregister.com/security/headlines.atom (item 2026-10-16, gap sweep; extract returns navigation only, read through WebFetch) → primary: Microsoft Support article KB5066470, URL https://support.microsoft.com/en-gb/servicing/os/windows/docs/2025/08/upcoming-changes-to-ntlmv1-in-windows-11-version-24h2-and-windows-server-2025 (extract; page history shows edits on 2026-10-14). The Register spells the registry value BlockNtlmSSO; Microsoft's page spells it BlockNtlmv1SSO."
    summary: |
      Microsoft's KB5066470 states that, beginning with the security update released 2026-10-13, Windows 11 24H2, 25H2 and 26H2 and Windows Server 2025 use Enforce mode (1) instead of Audit mode (0) for the BlockNtlmv1SSO registry value when
      it is not set, on devices where Credential Guard is disabled; requests to use NTLMv1-derived credentials for single sign-on are then blocked, the update does not create the value, and manually entered credentials still work. Microsoft says the change might
      affect Wi-Fi, Ethernet and VPN connections that use MS-CHAPv2-based authentication (PEAP-MSCHAPv2, EAP-MSCHAPv2) in domain-joined environments, because NTLMv1 as a protocol is already removed while its cryptography remains in those flows. Audit mode logs event 4024
      (warning) and Enforce mode logs event 4025 (error) in the Microsoft-Windows-NTLM/Operational log, with the target server, supplied user, client process and its identity. Setting the value to 0 is described as a scoped, temporary security exception that lowers protection;
      Microsoft recommends enabling Credential Guard, which provides complete protection against NTLMv1 legacy cryptography. The Register (2026-10-16) reports connectivity failures after the update and quotes Microsoft saying the disruption is by design.
    region_nexus: "global; any Windows 11 24H2 or later and Server 2025 fleet using 802.1X PEAP-MSCHAPv2 or MS-CHAPv2 VPN single sign-on"
    primary_sector_nexus: "indirect: public-sector Windows estates (wireless and VPN single sign-on) are in scope; no source names a public-sector impact"
    sector: "cross-sector"
    cves: []
    techniques: []
    affected_products: ["Microsoft Windows 11", "Microsoft Windows Server 2025"]
    entity_keys: ["product:microsoft-windows", "product:microsoft-windows-server"]
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "This article details changes in Windows 11, versions 26H2, 25H2, and 24H2 and Windows Server 2025, focusing on the auditing and enforcement of blocking NTLMv1-derived cryptography."
        attribution: "Microsoft Support (KB5066470)"
        source_url: "https://support.microsoft.com/en-gb/servicing/os/windows/docs/2025/08/upcoming-changes-to-ntlmv1-in-windows-11-version-24h2-and-windows-server-2025"
      - quote: "Note that the default behavior change does not create or modify the registry value, which itself remains absent."
        attribution: "Microsoft Support (KB5066470)"
        source_url: "https://support.microsoft.com/en-gb/servicing/os/windows/docs/2025/08/upcoming-changes-to-ntlmv1-in-windows-11-version-24h2-and-windows-server-2025"
      - quote: "NTLMv1-derived credentials are used by certain higher-level protocols for Single Sign-On purposes; examples include Wi-Fi, Ethernet, and VPN deployments using MS-CHAPv2 based authentication, including PEAP-MSCHAPv2 and EAP-MSCHAPv2."
        attribution: "Microsoft Support (KB5066470)"
        source_url: "https://support.microsoft.com/en-gb/servicing/os/windows/docs/2025/08/upcoming-changes-to-ntlmv1-in-windows-11-version-24h2-and-windows-server-2025"
      - quote: "After the update, requests to use NTLMv1-derived credentials are blocked."
        attribution: "The Register"
        source_url: "https://www.theregister.com/security/2026/10/16/networking-problems-after-the-october-2026-windows-update-ntlm-might-be-to-blame/5303503"
    borderline: true
    borderline_reason: "vendor hardening default with outage potential rather than a threat, no attacker behaviour to map; first-party text last edited 2026-10-14 and The Register item is 2026-10-16 15:30Z (about 9.5 h before the window floor), but no earlier run or entry carries it. Possibly also an S1 Patch Tuesday companion; high practical value for AD / 802.1X estates"
    extended_notes: |
      Composer hints. Suggested kind: research or guidance (hardening change), not threat; techniques left empty because no source describes attacker behaviour here (if the composer wants a mapping, NTLM capture and cracking would be T1557 / T1110.002,
      but Microsoft's page does not state it). Suggested priority: routine to notable; reliability A (Microsoft first-party), credibility 1.
      Exposure: Windows 11 24H2, 25H2, 26H2 and Windows Server 2025 devices with Credential Guard disabled and no BlockNtlmv1SSO value set that were updated with the 2026-10-13 cumulative update (Windows 11 KB5127648, Server 2025 KB5126646 per the page's links).
      Detection (telemetry class first): Microsoft-Windows-NTLM/Operational warning 4024 (earlier Audit-mode installs show who still depends on NTLMv1-derived SSO) and error 4025 after the change, joined to wireless or VPN authentication failures; RADIUS / NPS logs for MS-CHAPv2 sessions.
      Hardening levers: enable Credential Guard where hardware requirements are met; migrate 802.1X and VPN profiles away from MS-CHAPv2-based methods; use the temporary value 0 only scoped and time-boxed. Microsoft page history: edited 2026-10-14 to reflect the enforcement.
