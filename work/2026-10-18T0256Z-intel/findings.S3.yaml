    extended_notes: |
      Composer hints. Suggested kind: incident (third-party / supply-chain compromise of a multi-tenant Microsoft 365 application); suggested priority: high
      (active, no patch, mitigation is a tenant-side disable plus a credential review; exposure is any tenant that consented to the app, including dormant SkyKick connections).
      Suggested classification: reliability A (vendor advisory plus first-hand telemetry from two labs), credibility 1.
      Exposure: Entra admin center, Enterprise applications, search by application ID or by "SkyKick" / "ConnectWise". ConnectWise-published application client IDs
      (product identifiers, not attacker IOCs): Cloud Backup 506e08f9-6e9a-4da4-942b-a099a03644ae; Cloud Management 2399d300-6fca-4e6a-a686-399fefe75b83; Teams
      24205314-2b89-4e07-a2a4-579e898a5640; Exchange Online b78f6a77-d4e5-46fb-87e5-d1648bd02519; Graph 0de14c77-b9b0-4137-9360-34878a929827; Partner Center
      412dcf96-176d-4b3a-a1b0-4981ad66971e; SharePoint Online b2b55f5b-7758-4719-8d8f-88ae172e6bdb. Todyl and SpecterOps give the publisher tenant 3f9cd7a0-127a-4ed4-bf06-2f830d5616b7
      ("ConnectWise S-K LLC") for finding every SkyKick-published app, including inherited ones. The attacker's source IP and user agents are published by ConnectWise; keep them out of the entry (no IOCs).
      Detection (telemetry class first): Entra service-principal sign-in logs (the Service principal sign-ins tab, not user sign-ins) filtered by application ID - expected egress is Azure
      private IPv6 with the .NET SDK user agent kiota-dotnet; hunt any non-Microsoft source address and scripted user agents; Entra audit log - ApplicationManagement events
      ("Update application - Certificates and secrets management", "Add service principal credentials", owner and app-role-assignment adds), RoleManagement events where the
      initiating principal is one of the vendor apps (self-adding to Global Administrator or Exchange Administrator), Conditional Access policy and named-location changes; enable
      MicrosoftGraphActivityLogs (Entra P1/P2, not retroactive) so per-request source IPs exist; Purview audit for mailbox forwarding, inbox/transport rules and delegation changes
      (New-InboxRule, Set-Mailbox, Add-MailboxPermission, New-TransportRule) and MailItemsAccessed where licensed. Entra keeps audit and sign-in records 7 days on Free and 30 days on P1/P2, so export now.
      Post-disable compromise check (the step readers miss): disabling the vendor apps stops new tokens but does not remove attacker-added client secrets, certificates, federated credentials,
      directory roles, owners or consent grants on other applications (Huntress and ConnectWise both say so); review credentials on every enterprise application and app registration, especially MSP management and
      security tools, added since 2026-10-13 (extend to 2026-10-01); tokens already issued stay valid for up to about 90 minutes after disabling (Todyl).
      Triage discriminators: the vendor's own traffic comes from Azure private IPv6 with kiota-dotnet and recurring backup-job timing; the abuse came from a single commercial VPS IPv4 with Python user agents, one token
      per tenant, tenants with no active backup subscription (Todyl: nine such tenants), and an ascending tenant-GUID sequence. Python and curl user agents are also used by administrators (ConnectWise), so combine actor,
      operation and user agent. Where a tenant does run an active subscription, attacker and vendor reads share one application identity and the M365 audit shows Microsoft addresses (Todyl).
      Hardening levers: remove unused multi-tenant application consents (Conditional Access for workload identities covers supported single-tenant service principals, not third-party multi-tenant apps, per ConnectWise and Todyl);
      least-privilege consent review; enable Graph activity logs; for publishers, Huntress enabled App Instance Property Lock on its own applications. Operational: backups paused, no restore ETA, check the last recovery point.
      Count discrepancy to surface: Huntress page text says 162 (as of 2026-10-16 19:00 UTC); THN reports Huntress at 173. The Register nav shows an unrelated 2025 SharePoint headline; ignore.
      Watch: ConnectWise says it will keep updating the Trust Center page (no per-advisory permalink exists; the advisories page itself carries the text), Huntress and Todyl run living posts.
  - title: "Rank Math SEO PRO 3.0.123: plugin packages served by the vendor for about eleven hours carry a hidden backdoor, rogue administrators and cron persistence that survive the update to 3.0.124"
    sources:
