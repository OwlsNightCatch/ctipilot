    extended_notes: |
      Verification note: the vendor is the only first-hand source; Wordfence relays it and is the CNA for CVE-2026-111862 (CVSS 9.8, "Embedded Malicious Code"). NVD returned 0 results for
      CVE-2026-111862 and the MITRE CVE API returned 404 when fetched at 2026-10-18T03:14Z, so the id rests on the Wordfence Intelligence record alone. Wordfence Intelligence's references list a
      urlscan result and a Verisign RDAP lookup for the vendor-named host (attacker infrastructure, not carried here).
      Composer hints. Suggested kind: threat or incident (supply-chain compromise of a paid plugin); suggested priority: notable; reliability A (vendor first-party), credibility 2.
      Exposure: a site is in scope only if it downloaded or updated to 3.0.123 inside the window; check plugin version and install time, and any notice from Rank Math (it says it has per-download records). 3.0.123 outside
      the window is not evidence of compromise (vendor). A never-activated copy: delete and reinstall 3.0.124 (vendor).
      Detection (telemetry class first): web-server-user crontab and WordPress cron events; file-integrity of core (wp core verify-checksums; premium plugin checksums are not available, compare with a clean vendor copy);
      WordPress user creation events and a list of administrator accounts; web-server access logs for requests to .cache files and for new PHP in uploads, mu-plugins and other plugin or theme folders; egress or DNS from the
      web server to the vendor-named host; database options table entries; SSH authorized_keys and other users' crontabs (vendor names these as places the attacker may have written). Post-patch compromise check: this is the
      whole story - the update replaces the plugin only.
      Related store context: entries 'shapedplugin-build-pipeline-compromised-three-pro-wordpress' (campaign:shapedplugin-supply-chain-2026), the Awesome Motive CDN entry (incident:awesome-motive-cdn-supply-chain-2026) and
