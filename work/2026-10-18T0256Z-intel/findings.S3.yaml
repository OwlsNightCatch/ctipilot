    discovery_trace: "first seen at: wordfence feed https://www.wordfence.com/feed/ (item 2026-10-17T03:41Z, gap sweep) → pivot: Wordfence PSA, URL https://www.wordfence.com/blog/2026/10/rank-math-seo-pro-3-0-123-malware/ → primary: Rank Math security notice, URL https://rankmath.com/kb/pro-3-0-123-security-incident/ → Wordfence Intelligence record, URL https://www.wordfence.com/threat-intel/vulnerabilities/id/81cd7a2c-ad0c-4dbc-b5dc-07ec866d5c1f. WebSearch ('Rank Math SEO PRO 3.0.123 malware supply chain compromise rank1cdn', standard mode) returned nothing on the incident, so no independent third-party analysis was found."
    summary: |
      Rank Math says some copies of its paid WordPress plugin Rank Math SEO PRO 3.0.123, downloaded or updated between 2026-10-15 20:02 UTC and 2026-10-16 07:12 UTC, contained malware that compromises a
      site once the plugin is activated; it removed the files and released 3.0.124, calls the affected population "a limited number of users" and says it holds records of who downloaded an affected copy. Wordfence,
      the CNA for the record, relays the vendor's facts: the malware may establish persistent access, contact a remote host, recreate hidden backdoors on page visits and expose WordPress, database and API credentials
      reachable by the web server. Per the vendor, signs of compromise are three malicious wp_options entries, hidden PHP backdoors in mu-plugins and other plugin or theme folders (base64 plus XOR loops, proc_open, PHP-FPM
      socket code), unknown administrator accounts with a wpsupport_ prefix, a fake core file under wp-includes, .htaccess rules that let .cache files execute as PHP, PHP files in uploads and a web-user cron entry carrying a marker
      comment. Wordfence states that updating to 3.0.124 is not enough: files, administrator accounts or scheduled tasks created by the malware remain. The remediation order matters because the backdoor is rebuilt on page visits: delete the
      whole plugin folder and the three options and block the vendor-named host first, then clean the rest, restore from a pre-2026-10-15-20:02 backup where possible and rotate every credential the site could reach. How the vendor's distribution
      was compromised is not disclosed and no actor is named; the vendor says it will not email login or download links.
    region_nexus: "global; WordPress sites running the paid Rank Math SEO PRO plugin. No Swiss victim named"
    primary_sector_nexus: "indirect: municipal, cantonal and agency WordPress sites (and their web agencies) that run Rank Math SEO PRO; no public-sector victim named"
    sector: "public-sector (indirect); web hosting and agencies"
    cves: [CVE-2026-111862]
    techniques: [T1195.002, T1505.003, T1136.001, T1053.003, T1552.001]
