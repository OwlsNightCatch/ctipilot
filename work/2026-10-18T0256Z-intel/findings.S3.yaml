    discovery_trace: "first seen at: huntress feed https://www.huntress.com/blog/rss.xml (item 2026-10-16T23:00Z, majors sweep) → primary: Huntress article, URL https://www.huntress.com/blog/vendor-credential-enables-unauthorized-access (extract; carries 2026-10-17 10:30 ET and 17:15 ET updates) → pivot: ConnectWise Trust Center advisory, URL https://www.connectwise.com/company/trust/advisories (extract via jina; updates 2026-10-16 17:47 UTC, 10-17 05:01, 10-17 17:00, 10-18 01:00) → pivot: Todyl, URL https://www.todyl.com/blog/investigation-unauthorized-access-through-the-connectwise-cloud-backup-microsoft-365-app → corroboration: THN feed https://feeds.feedburner.com/TheHackersNews item https://thehackernews.com/2026/10/hackers-use-compromised-connectwise.html, BleepingComputer feed https://www.bleepingcomputer.com/feed/ item https://www.bleepingcomputer.com/news/security/hackers-breach-microsoft-365-tenants-via-connectwise-supply-chain-attack/, WebSearch (extended) 'ConnectWise SkyKick breach Microsoft 365 tenants Huntress' → SpecterOps https://specterops.io/blog/2026/10/17/connectwise-skykick-breach-microsoft-365/. Microsoft Threat Intelligence's own statement is an X post relayed by BleepingComputer; the X post was not fetched and is not cited."
    summary: |
      ConnectWise says it identified unauthorized access to application identities in its Cloud Backup (formerly SkyKick) environment on
      2026-10-14, suspended Cloud Backup on 2026-10-17 by revoking the certificates behind the affected app connections, disabled seven
      ConnectWise application identities in Microsoft Entra at 07:00 UTC the same day (Cloud Backup plus six Cloud Management apps; older
      tenants show SkyKick names), and has since taken SaaS Security and Cloud Management offline as a precaution, with no restoration time given
      as of 2026-10-18 01:00 UTC. Huntress and Todyl, each from their own monitored tenants, describe the mechanism: an attacker holding the
      multi-tenant Cloud Backup app's credential authenticated as the application (app-only OAuth client credentials, Huntress saw a client assertion)
      and received Microsoft Graph tokens from a single hosting-provider IPv4 address on 2026-10-15 (06:13 to 08:34 UTC per Huntress, 07:11 to 08:47 UTC
      per Todyl), moving through tenants in ascending tenant-GUID order a few seconds apart, which both read as a script working a target list.
      No user, device or MFA prompt is involved, so user-focused controls did not apply, and the app's existing consent covered mail, files, Teams and
      (per Microsoft as relayed by BleepingComputer) Directory.ReadWrite.All. Huntress reports confirmed unauthorized sign-ins in 162 tenants as of
      2026-10-16 19:00 UTC (The Hacker News reports Huntress at 173) and, in a later update, sign-in activity from the same address in almost 1,000 Entra
      tenants of which over 300 succeeded; many failed only because the app was not present. Beyond token issuance Huntress saw, in about 50 tenants, ConnectWise
      Cloud Management service principals assign themselves directory roles (mostly Exchange Administrator) from 2026-10-15 01:58 UTC, and in one tenant the Cloud
      Management Teams app add itself to Global Administrator and add new client secrets to an MSP management application and to Huntress's own application
      within about five minutes; a separate, unsuccessful second wave on 2026-10-15 targeted 16 Huntress-protected tenants in the policy, national security,
      trade and critical-mineral sectors. Todyl, in the tenants it examined, found token issuance only and no directory changes, so post-access behaviour differs by tenant.
      Not known: how the credential was obtained, whether a product vulnerability contributed (ConnectWise: not established), what data was read (Huntress notes Microsoft
      logs no directory reads or Graph reads by an application in the audit log; Todyl notes it cannot separate attacker reads from vendor backup reads in tenants with an
      active subscription because both use the same application identity), and who the actor is: no source attributes the activity.
    region_nexus: "global; MSP-managed Microsoft 365 tenants. No Swiss victim or Swiss tenant is named in any source; Huntress's targeted second wave hit policy / national-security / trade / critical-mineral tenants (countries not stated)"
    primary_sector_nexus: "indirect: public-sector Microsoft 365 tenants managed by MSPs or IT providers that consented to SkyKick / ConnectWise Cloud Backup or Cloud Management would be exposed; no source names a public-sector victim"
    sector: "managed-service-providers; public-sector (indirect)"
