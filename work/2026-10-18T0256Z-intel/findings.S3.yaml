  - title: "ConnectWise Cloud Backup (formerly SkyKick): a vendor-held Microsoft 365 application credential is used to sign in to customer tenants as the app itself, a second ConnectWise app grants itself Global Administrator in at least one tenant, and the vendor has suspended the service"
    sources:
      - { url: "https://www.connectwise.com/company/trust/advisories", publisher: "ConnectWise Trust Center (advisory, last updated 2026-10-18 01:00 UTC)", date: "2026-10-18", role: "primary" }
