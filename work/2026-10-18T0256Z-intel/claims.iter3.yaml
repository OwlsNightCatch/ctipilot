claims:
  - claim_id: 461650bb8d
    entry: 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade every internet-facing NetScaler ADC/Gateway to 14.1-73.37+ (14.1-FIPS 14.1-73.37 FIPS+) or 13.1-64.23+ (13.1-FIPS/NDcPP 13.1-37.279+) now (a SAML-configured appliance needs the later builds named for CVE-2026-88779, and an identity provider 14.1-73.46 or 13.1-64.29); on a 13.1-branch appliance run `show ns variable` first; if it returns any variables, install 13.1-64.24 instead to avoid a known reboot loop. Capture logs, an instance snapshot where the appliance is virtual, a support bundle and a core dump from each exposed appliance BEFORE patching, since the upgrade can remove forensic evidence of prior exploitation."
  - claim_id: ae5cf8c705
    entry: 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev
    surface: "actions[1]"
    kind: frontmatter
    text: "Run Mandiant's compromise checks, extended by the Unit 42 artifacts described in the update below and Zscaler's (appliance-initiated downloads to unfamiliar addresses, an unexpected executable under /var, a Perl CGI handler added to the web server configuration), on every NetScaler that was internet-facing and unpatched at any time since early September, patched or not; isolate any hit and halt HA configuration sync until both nodes are validated."
  - claim_id: 5e4c8a48ee
    entry: 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev
    surface: "actions[2]"
    kind: frontmatter
    text: "Find any NetScaler ADC or Gateway still on the end-of-life 12.1 or 13.0 branches and decide isolation or replacement now: they receive no security updates and Citrix has not said whether they are affected."
  - claim_id: cdf94dcdfa
    entry: 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev
    surface: "body"
    kind: cited
    text: "Citrix's security bulletin CTX697096, published 2026-09-27, fixes eight NetScaler ADC / NetScaler Gateway vulnerabilities, two of which Citrix says have been exploited ("
    urls: ["https://support.citrix.com/external/article/CTX697096/citrix-netscaler-adc-and-citrix-netscale.html"]
  - claim_id: 93af5e1d89
    entry: 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev
    surface: "body"
    kind: cited
    text: "); watchTowr notes they were exploited as zero-days, \"before any fix existed\" ("
    urls: ["https://watchtowr.com/intelligence/citrix-netscaler-zero-day-vulnerabilities-faq/"]
  - claim_id: 69be7f2e4c
    entry: 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev
    surface: "body"
    kind: cited
    text: "Citrix's own bulletin states plainly: \"Exploits of CVE-2026-88771 and CVE-2026-88772 on unmitigated NetScaler deployments have been observed\" ("
    urls: ["https://support.citrix.com/external/article/CTX697096/citrix-netscaler-adc-and-citrix-netscale.html"]
  - claim_id: 157fd41c4e
    entry: 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev
    surface: "body"
    kind: cited
    text: "CISA added both to its Known Exploited Vulnerabilities catalog on 2026-09-27 and flags them for forensic triage ("
    urls: ["https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"]
  - claim_id: ff0f929be7
    entry: 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev
    surface: "body"
    kind: cited
    text: "), and CERT-EU's advisory the same day states \"Citrix has confirmed active exploitation of these 2 critical vulnerabilities in the wild\" and recommends a compromise assessment on every internet-facing appliance ("
    urls: ["https://cert.europa.eu/publications/security-advisories/2026-014/"]
  - claim_id: cb05e92189
    entry: 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev
    surface: "body"
    kind: cited
    text: "NetScaler administrators reported being told by IT suppliers and security teams to shut appliances down over the weekend of 26-27 September, before any CVE identifier or vendor advisory existed; BleepingComputer reports that NCSC-NL reportedly sent a pre-notification to its constituency and that NCSC-NL declined to confirm the leaked notice's contents ("
    urls: ["https://www.bleepingcomputer.com/news/security/citrix-admins-warned-to-shut-down-netscalers-over-2-exploited-zero-days/"]
  - claim_id: f78239f07d
    entry: 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev
    surface: "body"
    kind: cited
    text: ") but published its own public advisory NCSC-2026-0394 the same day once Citrix's bulletin shipped ("
    urls: ["https://advisories.ncsc.nl/advisory?id=NCSC-2026-0394"]
  - claim_id: 375d1894db
    entry: 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev
    surface: "body"
    kind: cited
    text: "No public attribution of the exploiting activity exists; watchTowr's FAQ states \"No attribution has been made public,\" while noting NetScaler perimeter appliances have historically been targeted by both state-sponsored and ransomware-affiliated actors, consistent with the CitrixBleed (CVE-2023-4966) and CitrixBleed 2 (CVE-2025-5777) history on the same product line ("
    urls: ["https://watchtowr.com/intelligence/citrix-netscaler-zero-day-vulnerabilities-faq/"]
  - claim_id: 8f9351d61d
    entry: 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev
    surface: "body"
    kind: cited
    text: "This is a distinct CVE family from CVE-2026-19490 and from the CitrixBleed/CitrixBleed 2 lineage named above; watchTowr states directly that appliances already patched for CVE-2026-19490 remain vulnerable to CVE-2026-88771/88772 unless running one of the new fixed builds ("
    urls: ["https://watchtowr.com/intelligence/citrix-netscaler-zero-day-vulnerabilities-faq/"]
  - claim_id: 648420dd0b
    entry: 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev
    surface: "body"
    kind: cited
    text: "Citrix has published no workaround for either exploited flaw ("
    urls: ["https://watchtowr.com/intelligence/citrix-netscaler-zero-day-vulnerabilities-faq/"]
  - claim_id: bd5077c6f6
    entry: 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev
    surface: "body"
    kind: cited
    text: "Before patching, capture logs, an instance snapshot where the appliance is virtual, a support bundle and a core dump from every appliance that has been internet-facing, since the upgrade can overwrite forensic evidence of prior compromise ("
    urls: ["https://watchtowr.com/intelligence/citrix-netscaler-zero-day-vulnerabilities-faq/", "https://unit42.paloaltonetworks.com/netscaler-zero-days-exploited/"]
  - claim_id: fca670b72b
    entry: 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev
    surface: "body"
    kind: cited
    text: "A limited IOC scan is available from 14.1-73.36+ with telemetry enabled via the NetScaler Console Security Advisory page or through Citrix Support, but Citrix itself cautions the indicators do not cover every exploitation technique ("
    urls: ["https://watchtowr.com/intelligence/citrix-netscaler-zero-day-vulnerabilities-faq/"]
  - claim_id: db38b48ca3
    entry: 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev
    surface: "body"
    kind: cited
    text: "), so a clean scan is not proof an appliance was not already compromised before patching, and CERT-EU recommends a compromise assessment on every internet-facing appliance ("
    urls: ["https://cert.europa.eu/publications/security-advisories/2026-014/"]
  - claim_id: 027d13d99e
    entry: 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev
    surface: "body"
    kind: cited
    text: "Zscaler's telemetry adds appliance-initiated downloads to unfamiliar addresses, an unexpected executable under /var and a Perl CGI handler in the web server configuration to the post-exploitation checks ("
    urls: ["https://www.zscaler.com/blogs/security-research/cve-2026-88771-inside-exploitation-critical-netscaler-rce-vulnerability"]
  - claim_id: 322cc94494
    entry: 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev
    surface: "body"
    kind: cited
    text: "**Triage:** for CVE-2026-88771 the precursor sits in the appliance's own logs: header, username or other request values carrying shell metacharacters (semicolons, backticks) together with Pitboss crash-message text such as \"PPE unexpectedly died\", which the crash-log monitor script later parses as root ("
    urls: ["https://labs.watchtowr.com/oh-look-the-foot-gun-went-off-again-citrix-netscaler-preauth-command-injection-cve-2026-88771/"]
  - claim_id: 226cf67bcf
    entry: 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev
    surface: "body"
    kind: cited
    text: "A handshake failure followed within minutes by a packet-engine termination on the same appliance is a strong exploitation signal, but GTIG advises alerting on the watchdog messages and terminations independently rather than requiring both ("
    urls: ["https://cloud.google.com/blog/topics/threat-intelligence/defending-against-active-exploitation-of-citrix-netscaler-adc-and-gateway-appliances"]
  - claim_id: 1f06f3c4f4
    entry: 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev
    surface: "body"
    kind: cited
    text: "NetScaler Gateway is a perimeter VPN and remote-access layer ("
    urls: ["https://watchtowr.com/intelligence/citrix-netscaler-zero-day-vulnerabilities-faq/"]
  - claim_id: 1ef172e8ca
    entry: 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev
    surface: "body"
    kind: cited
    text: "), and CERT-EU, NCSC-NL and CERT.at each issued same-day advisories ("
    urls: ["https://cert.europa.eu/publications/security-advisories/2026-014/", "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0394", "https://www.cert.at/de/warnungen/2026/9/kritische-sicherheitslucken-in-citrix-netscaler-adc-und-netscaler-gateway-aktiv-ausgenutzt-updates-verfugbar"]
  - claim_id: d31e164167
    entry: 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev
    surface: "body"
    kind: cited
    text: "), with NCSC-CH's Cyber Security Hub following on 2026-09-28 ("
    urls: ["https://security-hub.ncsc.admin.ch/#/posts/13005"]
  - claim_id: f09bcf4466
    entry: 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev
    surface: "body"
    kind: cited
    text: "GTIG lists government among the sectors likely impacted in North America and Europe ("
    urls: ["https://cloud.google.com/blog/topics/threat-intelligence/defending-against-active-exploitation-of-citrix-netscaler-adc-and-gateway-appliances"]
  - claim_id: ffff8517f1
    entry: 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev
    surface: "body"
    kind: uncited
    text: "CVE-2026-88771 (CWE-20, improper input validation, CVSS 4.0 9.5) lets an unauthenticated remote attacker execute arbitrary commands on every NetScaler ADC/Gateway deployment in its default configuration; no feature needs to be enabled first."
  - claim_id: c243414a20
    entry: 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev
    surface: "body"
    kind: uncited
    text: "CVE-2026-88772 (CWE-119, memory overflow to RCE or DoS, CVSS 4.0 9.5) is reachable wherever DTLS is enabled, which Citrix states is the default on any VPN virtual server, so most VPN-fronting Gateway deployments meet the precondition unless DTLS was explicitly disabled."
  - claim_id: ef28f1a35c
    entry: 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev
    surface: "body"
    kind: uncited
    text: "The disclosure path itself is a defender-relevant data point."
  - claim_id: 1828124b39
    entry: 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev
    surface: "body"
    kind: uncited
    text: "The same bulletin fixes six configuration-dependent companion flaws not reported exploited: an HTTP request-smuggling flaw (CVE-2026-88773, CVSS 9.3), a policy-bypass flaw via HTTP URL-based expressions (CVE-2026-88774, CVSS 7.0), three further memory-overflow conditions gated respectively on a Gateway/AAA virtual server, an Oracle-type load-balancing virtual server, or a non-HTTP Layer-7 protocol on an LB/CS/CGNAT-LSN/NAT64 device (CVE-2026-88775/88776/88777, each CVSS 8.8), and a predictable-TCP-ISN weakness (CVE-2026-88778, CVSS 8.8) whose remediation is not covered by the version upgrade alone: it additionally requires enabling Enhanced ISN Generation."
  - claim_id: c2261fa5ca
    entry: 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev
    surface: "body"
    kind: uncited
    text: "Fixed builds are 14.1-73.37, 13.1-64.23, 14.1-73.37 FIPS and 13.1-37.279 (FIPS/NDcPP); watchTowr flags an upgrade caveat on the 13.1 branch: run `show ns variable` first, and if it returns any variables, install 13.1-64.24 instead to avoid a known reboot loop during the upgrade."
  - claim_id: 4b4f4ff745
    entry: 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev
    surface: "body"
    kind: uncited
    text: "A separate bulletin of 2026-10-03 adds CVE-2026-88779 for SAML-configured appliances, which these builds do not fix (see the 2026-10-04 update below)."
  - claim_id: 7a2310bc7b
    entry: 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev
    surface: "body"
    kind: derived
    text: "Legitimate clients have no reason to send crash-message text in a request field, so such a log line is the signal rather than a benign lookalike."
  - claim_id: 875ac9b25e
    entry: 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev
    surface: "body"
    kind: derived
    text: "For CVE-2026-88772, GTIG names a DTLS handshake-failure \"Internal Error\" line in the syslog, which successful exploitation produced, and packet-engine termination or watchdog \"NOT restarting\" lines in the FreeBSD system log, which NetScaler does not forward to a SIEM by default."
  - claim_id: 4619991d33
    entry: 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev
    surface: "body"
    kind: derived
    text: "Check each alongside configuration drift."
  - claim_id: 4a1248e2c5
    entry: 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** every internet-facing NetScaler ADC/Gateway deployment needs the patch now regardless of whether DTLS is knowingly enabled: Citrix states it is the VPN vServer default, so an administrator who never explicitly configured DTLS may still be exposed to CVE-2026-88772."
  - claim_id: 34d4f8523e
    entry: 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev
    surface: "section 2026-10-18T03:35:00Z"
    kind: cited
    text: "Zscaler ThreatLabz published first-party telemetry of exploitation of CVE-2026-88771 on 2026-10-16 ("
    urls: ["https://www.zscaler.com/blogs/security-research/cve-2026-88771-inside-exploitation-critical-netscaler-rce-vulnerability"]
  - claim_id: 606e834523
    entry: 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev
    surface: "section 2026-10-18T03:35:00Z"
    kind: cited
    text: "The chain it captured matches the log-poisoning sequence in the sections above: a payload stored in the User-Agent of GET requests to four default logon and VPN paths, a forged packet-engine failure record in the authentication request that searches the access log for the marker, decodes the payload and runs it when the vendor's crash-log script selects that record ("
    urls: ["https://www.zscaler.com/blogs/security-research/cve-2026-88771-inside-exploitation-critical-netscaler-rce-vulnerability"]
  - claim_id: b1ed220511
    entry: 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev
    surface: "section 2026-10-18T03:35:00Z"
    kind: cited
    text: "Two post-exploitation behaviours are not described above: the payload writes PHP and Perl CGI web shells into six web-served directories and adds a handler that runs .pl files as CGI, besides switching PHP on in the web server configuration, and a shorter variant makes the appliance download a Rust-built 64-bit FreeBSD binary and run it from /var ("
    urls: ["https://www.zscaler.com/blogs/security-research/cve-2026-88771-inside-exploitation-critical-netscaler-rce-vulnerability"]
  - claim_id: 46b54b6115
    entry: 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev
    surface: "section 2026-10-18T03:35:00Z"
    kind: cited
    text: "ThreatLabz saw at least 26 source addresses send the forged record together with that downloader within about six to seven minutes ("
    urls: ["https://www.zscaler.com/blogs/security-research/cve-2026-88771-inside-exploitation-critical-netscaler-rce-vulnerability"]
  - claim_id: 70989a8d50
    entry: 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev
    surface: "section 2026-10-18T03:35:00Z"
    kind: cited
    text: "It says the download server also appeared in its earlier exploitation data for CVE-2026-75650, the Adobe Commerce and Magento flaw it tracks as StyleSmuggler, and calls the overlap an investigative lead that does not establish attribution, because shared hosting, a malware-distribution service or payload reuse by unrelated operators could explain it ("
    urls: ["https://www.zscaler.com/blogs/security-research/cve-2026-88771-inside-exploitation-critical-netscaler-rce-vulnerability"]
  - claim_id: 7dd6521de2
    entry: 2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev
    surface: "record 2026-10-18T03:35:00Z"
    kind: record-summary
    text: "Zscaler ThreatLabz's first-party exploitation telemetry (2026-10-16) adds post-exploitation behaviour to the compromise check: a Perl CGI handler enabled in the web server configuration besides PHP, and a variant that makes the appliance download and run a 64-bit FreeBSD binary, seen in a burst from at least 26 source addresses; the download server also appeared in its earlier Magento exploitation data, which ThreatLabz calls a lead and not attribution."
  - claim_id: 2716d80919
    entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
    surface: "actions[0]"
    kind: frontmatter
    text: "Find every AhsayCBS server your organisation or your managed-service suppliers run, including those already on v10.3.4.0 or v9.15.2.59, and apply the hotfix v10.3.4.45 (v10) or v9.15.2.70 (v7, v8, v9) now, then reboot it; the hotfixes sit behind Ahsay's partner portal, so ask the integrator or Ahsay for the build, and until it is applied keep the management web interface behind a VPN or an allowlist of trusted addresses."
  - claim_id: 1244639107
    entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
    surface: "actions[1]"
    kind: frontmatter
    text: "Compromise-check every AhsayCBS server that was internet-reachable since 2026-10-04 against the indicators Huntress and Bitdefender publish, an OpenSSH service nobody installed included, and against Horizon3's server-side checks (new .jsp files in served application directories, replication receivers created outside a change window, unexpected system administrator accounts), and re-image any host with a confirmed compromise from a trusted backup, because the hotfix does not remove a webshell or a persistence mechanism that is already there."
  - claim_id: e371fe0130
    entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
    surface: "body"
    kind: cited
    text: "Huntress reports that from 2026-10-07 23:20 UTC attackers exploited two flaws in AhsayCBS, the management console of Ahsay's backup software that managed service providers and system integrators mainly use, to gain unauthenticated remote code execution and deploy webshells on exposed servers ("
    urls: ["https://www.huntress.com/blog/ahsaycbs-flaws-exploit"]
  - claim_id: 31a43ee87e
    entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
    surface: "body"
    kind: cited
    text: "CVE-2026-105133, an improper-authentication flaw in the checkSysPwd function of the API, is used first to bypass authentication; CVE-2026-105134, in the /rps/api/json/UpdateReceivers.do endpoint of the Replication Receiver component, then gives code execution as NT AUTHORITY\\SYSTEM, after which the attacker configured a malicious receiver and dropped a JSP webshell into the directory the application serves ("
    urls: ["https://www.huntress.com/blog/ahsaycbs-flaws-exploit"]
  - claim_id: e117146678
    entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
    surface: "body"
    kind: cited
    text: "Horizon3's later source-level analysis traces the file write itself to the receiver's upload path, which a receiver created through that endpoint exposes ("
    urls: ["https://horizon3.ai/attack-research/attack-blogs/ahsaycbs-cve-2026-105133-cve-2026-105134-technical-analysis/"]
  - claim_id: cd5bd10fd0
    entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
    surface: "body"
    kind: cited
    text: "BleepingComputer reports that the activity targeted at least five organizations on 7 October and that CVE-2026-105133 has a public exploit ("
    urls: ["https://www.bleepingcomputer.com/news/security/unpatched-ahsaycbs-flaws-exploited-to-deploy-webshells-mine-crypto/"]
  - claim_id: 1b03fdf8aa
    entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
    surface: "body"
    kind: cited
    text: "Follow-on activity, per Huntress: commands spawned by the AhsayCBS service process fetch payloads over HTTP from cloud object storage into a Temp folder with curl and certutil; an XMRig Monero miner renamed to look like a Microsoft Edge binary runs as SYSTEM through a service that mimics the Edge updater and a renamed copy of the NSSM service manager, and reaches its mining pool on a non-standard port; and a PowerShell script that Huntress assesses as AI-assisted checks whether Task Manager is running, uses the host's local time to decide when to close it, and stops the miner while it is open ("
    urls: ["https://www.huntress.com/blog/ahsaycbs-flaws-exploit"]
  - claim_id: 7297bc0129
    entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
    surface: "body"
    kind: cited
    text: "The earlier patches did not close the flaws: public records had listed AhsayCBS up to 10.3.2 as affected ("
    urls: ["https://www.securityweek.com/unpatched-ahsaycbs-vulnerabilities-exploited-in-the-wild/"]
  - claim_id: 903a7b2f84
    entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
