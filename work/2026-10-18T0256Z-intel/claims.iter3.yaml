    surface: "section 2026-10-18T03:34:00Z"
    kind: cited
    text: "For CVE-2026-105134, an authentication-bypassed call creates a replication receiver whose home directory the attacker chooses; the system-folder denylist that screens that directory at creation is not applied to the upload path later built from two attacker-supplied headers, in which only the percent and colon characters are escaped, so a traversal sequence walks the write location into a served web application, and one upload of a .jsp file then runs as LocalSystem on Windows and as root on Linux ("
