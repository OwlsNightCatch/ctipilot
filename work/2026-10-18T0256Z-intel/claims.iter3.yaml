    surface: "section 2026-10-18T03:33:00Z"
    kind: cited
    text: "Second, XWEB PRO and EVO ship with the same factory account, Admin with the password Admin, so any unit whose password was never changed or is simple must be corrected, with one account per technician and an expiry date on external-contractor accounts ("
    urls: ["https://dixell.fr/wp-content/uploads/2026/10/Recommandations-pour-une-utilisation-securisee-des-superviseurs-XWEB-v1.0.pdf"]
