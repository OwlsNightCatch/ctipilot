    kind: cited
    text: "Third, remote access must go through an encrypted VPN tunnel, with a port forward limited to one trusted source address only a temporary, degraded stop-gap, no DMZ or port forward open to all addresses, and no remote-control software such as AnyDesk or TeamViewer on a site PC that stays on ("
    urls: ["https://dixell.fr/wp-content/uploads/2026/10/Recommandations-pour-une-utilisation-securisee-des-superviseurs-XWEB-v1.0.pdf"]
