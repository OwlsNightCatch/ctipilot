    surface: "section 2026-10-18T03:33:00Z"
    kind: cited
    text: "First, any XWEB PRO on firmware 1.12.1 or earlier must be updated without delay; the guide cites CISA's February 2026 advisory ICSA-26-057-10 on several critical XWEB PRO vulnerabilities up to that version, says Copeland has published a fix and advises backing up the configuration first ("
