    kind: cited
    text: "For CVE-2026-105133, every action of the JSON API extends a base class whose administrator password check is skipped when the request body carries a FromServlet flag that the caller sets, so the JSON API is reachable without credentials, and the AddSysUser action, which creates a system administrator, never consults the caller ("
