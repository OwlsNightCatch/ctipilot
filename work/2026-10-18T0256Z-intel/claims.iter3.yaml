  - claim_id: 239fb85db9
    entry: 2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack
    surface: "record 2026-10-18T03:33:00Z"
    kind: record-summary
    text: "CERT-FR's alert has a third version dated 2026-10-16 whose guidance differs for compromised and uncompromised units: the whole configuration, defrost ranges included, is to be checked, and a compromised Danfoss unit is to be restarted or otherwise factory-reset and reconfigured, with a caution to check insurance conditions before cutting the contractor's data uplink. The Dixell France operator guide that the alert links says any XWEB PRO on firmware 1.12.1 or earlier must be updated without delay, that XWEB units ship with a factory Admin account, and that remote access must go through an encrypted VPN; neither document names an entry vector."
  - claim_id: 3c3a93d53c
    entry: 2026-10-18/connectwise-cloud-backup-skykick-m365-app-credential-abuse
    surface: "headline"
    kind: frontmatter
    text: "ConnectWise SkyKick app credential used in 162+ Microsoft 365 tenants; disabling it does not undo planted access"
  - claim_id: 6021f08afd
    entry: 2026-10-18/connectwise-cloud-backup-skykick-m365-app-credential-abuse
    surface: "summary"
    kind: frontmatter
    text: "ConnectWise says it identified unauthorized access to application identities of its Cloud Backup (formerly SkyKick) service; Huntress and Todyl report that from 15 October the app's credential was used to obtain app-only Microsoft Graph tokens in customer Microsoft 365 tenants; Huntress alone confirmed unauthorized sign-ins in 162 tenants by 16 October and saw ConnectWise Cloud Management apps assign themselves directory roles in about 50 tenants and, in one, new client secrets added to other applications. ConnectWise disabled seven application identities and suspended the service on 17 October, but says disabling does not reverse changes already made in a tenant, so every tenant that ever consented a ConnectWise or SkyKick app needs the apps disabled and its application credentials, directory roles and consents reviewed. How the credential was obtained, who is behind it and what data was read are not public."
  - claim_id: 1fb8fcc313
    entry: 2026-10-18/connectwise-cloud-backup-skykick-m365-app-credential-abuse
    surface: "actions[0]"
    kind: frontmatter
    text: "In every Entra tenant you or your MSP administer, find the seven ConnectWise application identities by client ID (Cloud Backup is 506e08f9-6e9a-4da4-942b-a099a03644ae; the other six are in ConnectWise's advisory), dormant SkyKick connections included, and disable them without deleting, then keep them disabled until ConnectWise gives restoration instructions; on a tenant licensed for Entra ID Free, export the sign-in and audit logs first, because it keeps 7 days."
  - claim_id: 4a2751945d
    entry: 2026-10-18/connectwise-cloud-backup-skykick-m365-app-credential-abuse
    surface: "actions[1]"
    kind: frontmatter
    text: "In the same tenants review every enterprise application and app registration, MSP management and security tools first, for client secrets, certificates and federated credentials added since 2026-10-13 and remove any you did not create; also check the directory roles, owners and consent grants held by ConnectWise and SkyKick service principals, Conditional Access exclusions for them, and mailbox forwarding, inbox and transport rules and delegated access, because disabling the vendor applications does not remove access planted through them."
