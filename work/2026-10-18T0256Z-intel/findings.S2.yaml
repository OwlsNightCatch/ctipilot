items:
- title: 'CERT-FR revised its refrigeration-controller alert on 2026-10-16 and links Dixell France''s XWEB hardening guide: firmware 1.12.1 or earlier must be updated, factory Admin/Admin account, VPN-only remote access'
  sources:
  - url: https://www.cert.ssi.gouv.fr/alerte/CERTFR-2026-ALE-012/
    publisher: CERT-FR (alert CERTFR-2026-ALE-012)
    date: '2026-10-16'
    role: primary
  - url: https://dixell.fr/wp-content/uploads/2026/10/Recommandations-pour-une-utilisation-securisee-des-superviseurs-XWEB-v1.0.pdf
    publisher: Dixell France (Copeland)
    date: '2026-10-16'
    role: primary
    date_basis: 'UPPER BOUND, not a stated date: the PDF is undated (URL path 2026/10) and is listed under Documentation on the CERT-FR page whose latest revision is 2026-10-16; use the date with a sourcing note or the month only'
  discovery_trace: 'first seen at: anssi-fr slice record, CERT-FR alert feed https://www.cert.ssi.gouv.fr/alerte/feed/ (ALE-012 listed 2026-10-12; the feed shows no revision date) -> pivot: live alert page https://www.cert.ssi.gouv.fr/alerte/CERTFR-2026-ALE-012/ re-read with extract and with url --direct (the version table ''Gestion détaillée du document'' lists a third version dated 16 octobre 2026, ''Mise à jour des recommandations''; extract drops the table) -> Documentation link -> primary: Dixell France PDF https://dixell.fr/wp-content/uploads/2026/10/Recommandations-pour-une-utilisation-securisee-des-superviseurs-XWEB-v1.0.pdf (fetch_source.py pdf, 4 pages, per-font ToUnicode decode). Prompted by the open-story check of the covered Danfoss entry (spawn message) and WebSearch ("Danfoss AK-SM AK-SC attaque supermarchés réfrigération CERT-FR mise à jour"); Danfoss''s advisory listing https://danfoss.com/en/service-and-support/coordinated-vulnerability-disclosure/danfoss-security-advisories
    fetched 2026-10-18 shows no advisory for the attacks (newest 2026 entry DSA-2026-08-01, iC7 debug interfaces, 2026-09-18) - a listing, not citable.'
  summary: 'CERT-FR''s alert CERTFR-2026-ALE-012 now has three versions: the initial one of 2026-10-12, 2026-10-13 (more targeted equipment added) and 2026-10-16, listed on the page as an update of the recommendations. The page does not show which sentences the 2026-10-16 revision changed. The current text splits the guidance by state. For every unit it asks to remove the internet exposure of the affected units and of any unit on a public IP address, and to check the insurance contract conditions before cutting the data uplink to the refrigeration contractor. For a unit not known to be compromised it then asks to verify the whole configuration, notably the defrost ranges; for a compromised Danfoss unit it says to restart the device or otherwise restore it (factory reset) and then reconfigure it. In both branches it asks to restore access only through a secure VPN or protected network (filtering to the contractors'' source addresses is an emergency measure and not durable) and to apply the
    maker''s practices, which for Danfoss means updating the firmware, setting the security level to Strict and confirming that default passwords were changed. It still says attack campaigns are probably ongoing and that a factory reset alone on an unpatched end-of-life unit leaves it vulnerable. It still names no flaw or entry vector, and its risk field reads ''not specified by the vendor''. The page''s Documentation section links Dixell France''s ''Recommandations pour une utilisation sécurisée des superviseurs XWEB'' v1.0, an operator guide for the Copeland and Dixell XWEB supervisors that CERT-FR had named without models or flaws. The guide repeats Copeland''s March 2024 bulletin (never expose the XWEB to the public internet; restrict administration protocols such as SSH at the firewall; restrict inbound and outbound communication; change default account passwords; enable HTTPS but do not expose the web interface) and adds three operational recommendations. (1) Any XWEB PRO on firmware
    1.12.1 or earlier must be updated without delay; the guide cites CISA''s February 2026 advisory ICSA-26-057-10 on several critical XWEB PRO vulnerabilities up to that version and says Copeland has published a fix; back up the configuration first. (2) Both XWEB PRO and EVO ship with the factory account Admin with password Admin (the unit demands a new password at first login), so any unit whose password was never changed or is simple must be corrected; one named account per contractor, an expiry date on external-contractor accounts, passwords changed after any outside intervention that used a privileged account; the configurable password policy exists on the PRO only. (3) Remote access only through an encrypted VPN tunnel (a dedicated 4G VPN router, a VPN server on a dedicated ISP box, or a dedicated VPN server run by the client''s network team); a port forward restricted to one trusted source IP and the HTTPS port only is a temporary, degraded stop-gap; no DMZ and no port forward open
    to all addresses; no remote-control software such as AnyDesk or TeamViewer installed on a site PC that stays switched on. Neither document says how the attackers got in, and neither ties the French attacks to the XWEB PRO flaws that Claroty Team82 disclosed (covered in 2026-08-28/claroty-copeland-xweb-pro-refrigeration-unauth-root-rce, affected XWEB300D/500D/500B PRO firmware 1.12.1 and earlier); the matching firmware boundary is the only link and is the guide''s, not an attribution.'
  region_nexus: Europe-wide controller exposure; the French ISP-box examples in the Dixell guide (Free, Free Pro, Orange Pro) do not apply to Swiss operators, but the controller families do; NCSC.ch advisory 13054 already covers the Danfoss units; no Swiss victim reported in any fetched source
  primary_sector_nexus: 'indirect: building and cold-chain controllers in hospital kitchens and pharmacies, school and municipal canteens, cantonal facilities and the contractors that run them'
  sector: retail; public-sector (as asset owner)
  cves: []
  techniques:
  - T1190
  affected_products:
  - Copeland xweb
  - Dixell xweb
  - Copeland XWEB300D PRO
  - Copeland XWEB500D PRO
  - Copeland XWEB500B PRO
  - Danfoss AK-SM
  - Danfoss AK-SC
  entity_keys:
  - incident:danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack-2026-10
  - product:copeland-xweb
  - product:dixell-xweb
  - product:copeland-xweb300d-pro
  - product:copeland-xweb500d-pro
  - product:copeland-xweb500b-pro
  new_entities: []
  relation_suggestions: []
  verification: MULTI-SOURCE
  confidence: HIGH
  novelty: update-of:2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack
  evidence:
  - quote: Vérifier les conditions contractuelles d’assurance avant de couper la remontée des données Internet vers le prestataire frigoriste.
    attribution: CERT-FR (alert CERTFR-2026-ALE-012)
    source_url: https://www.cert.ssi.gouv.fr/alerte/CERTFR-2026-ALE-012/
  - quote: Vérifier l’intégralité de la configuration, notamment les plages de dégivrage.
    attribution: CERT-FR (alert CERTFR-2026-ALE-012)
    source_url: https://www.cert.ssi.gouv.fr/alerte/CERTFR-2026-ALE-012/
  - quote: Redémarrer l'équipement Danfoss, sinon restaurer l'équipement (Reset Factory).
    attribution: CERT-FR (alert CERTFR-2026-ALE-012)
    source_url: https://www.cert.ssi.gouv.fr/alerte/CERTFR-2026-ALE-012/
  - quote: Mise à jour des recommandations
    attribution: CERT-FR (alert CERTFR-2026-ALE-012)
    source_url: https://www.cert.ssi.gouv.fr/alerte/CERTFR-2026-ALE-012/
    note: version-table cell, present in the raw HTML (url --direct) next to '16 octobre 2026'; absent from the extract view
  - quote: Tout XWEB PRO dont le firmware est en version 1.12.1 ou antérieure doit être mis à jour sans délai.
    attribution: Dixell France (Copeland)
    source_url: https://dixell.fr/wp-content/uploads/2026/10/Recommandations-pour-une-utilisation-securisee-des-superviseurs-XWEB-v1.0.pdf
    note: PDF text extraction breaks lines inside this sentence; matches after whitespace normalisation
  - quote: identifiant « Admin », mot de passe « Admin »
    attribution: Dixell France (Copeland)
    source_url: https://dixell.fr/wp-content/uploads/2026/10/Recommandations-pour-une-utilisation-securisee-des-superviseurs-XWEB-v1.0.pdf
  - quote: l'accès doit passer par un tunnel VPN chiffré
    attribution: Dixell France (Copeland)
    source_url: https://dixell.fr/wp-content/uploads/2026/10/Recommandations-pour-une-utilisation-securisee-des-superviseurs-XWEB-v1.0.pdf
  extended_notes: 'Exposure check for an asset owner (as the two documents give it): the XWEB PRO firmware version against 1.12.1 (SYSTEM, Updates; the guide names the menu); the System, Users list for the factory Admin account still on its default, shared accounts and contractor accounts without an expiry date; the building router or ISP box for a DMZ or a port forward to the XWEB that is open to all source addresses; a site PC left on with AnyDesk, TeamViewer or similar. Detection concept grounded in CERT-FR''s wording: on the controller, defrost ranges, setpoints and account changes outside a maintenance window; in router, firewall or VPN logs, inbound connections to the management interface from anywhere other than the contractor''s source address. Both are already in the covered entry''s Detection line; the new material is the configuration-state checks. Absences worth carrying: no source names the entry vector; the Dixell guide does not say any attack used the factory account or the
    PRO flaws; Danfoss''s own advisory listing carried no advisory for the attacks on 2026-10-18. Whether the insurance-conditions caution and the defrost-range check are new in the 2026-10-16 revision cannot be shown from the page; the covered entry cites the 2026-10-13 text and already carries the Strict-level and default-password guidance. Suggested record type: update (an authority revision plus a vendor primary on the Copeland and Dixell units). The jina reader was NOT needed for this item; the usine-digitale article that came up in search fell to the reader and returned only a 430-character shell, so it is not cited.'
- title: 'FBI PSA of 2026-10-13: North Korean IT workers broaden recruitment of facilitators and lay out an ''identity in depth'' detection list (remote-desktop and KVM-over-IP hardware, job-unrelated apps)'
  sources:
  - url: https://www.ic3.gov/PSA/2026/PSA261013
    publisher: FBI (IC3, PSA I-101326-PSA)
    date: '2026-10-13'
    role: primary
  discovery_trace: 'first seen at: fbi-cyber-alerts slice record, WebFetch of https://www.ic3.gov/PSA (dated PSA list; lookback 121 h reaches 2026-10-13) -> primary (no pivot needed): https://www.ic3.gov/PSA/2026/PSA261013 read with WebFetch and re-read with url --direct to check the quotes against the page text.'
  summary: 'The FBI says North Korean IT workers are increasingly using paid facilitators, who host company laptops, lend their identities or take interviews, to get and keep remote jobs at Western firms. The workers use stolen personal data, purchased identity-verification accounts and forged documents to clear background checks and then control the issued laptop from elsewhere through remote-desktop software (the PSA names AnyDesk, TeamViewer, RustDesk, Chrome Remote Desktop and Splashtop Streamer), KVM-over-IP hardware (TinyPilot, PiKVM, GL.iNet) or a second machine. The PSA adds that ''laptop farms'' are spreading across more residences with fewer devices each, that workers escalated to data-theft extortion and threats against former managers after termination, and that they seek identities with clearances for government-contractor roles. Its detection advice is layered across hiring and employment (''identity in depth'') because no single indicator is reliable: flag remote-access or
    remote-management software and KVM-over-IP devices or a second laptop on company devices, job-unrelated applications such as OBS Studio with the VDO.Ninja plugin or Homebrew, screen recordings or data flows to devices outside company control, and unusually frequent changes of bank accounts, addresses and social-media identifiers, and aggregate weak signals across IT, HR and security. The PSA names no Swiss or European victim and is written for US employers.'
  region_nexus: US-written; no Swiss or European victim named
  primary_sector_nexus: 'indirect: remote developers at suppliers to federal, cantonal and communal bodies'
  sector: technology; government contractors
  cves: []
  techniques:
  - T1219.002
  - T1078
  - T1657
  affected_products:
  - AnyDesk
  - TeamViewer
  - RustDesk
  - Chrome Remote Desktop
  - Splashtop Streamer
  - TinyPilot
  - PiKVM
  - GL.iNet
  - OBS Studio
  entity_keys: []
  new_entities: []
  relation_suggestions: []
  verification: SINGLE-SOURCE-OTHER
  confidence: MEDIUM
  novelty: update-of:2026-08-19/purpledelta-dprk-it-worker-facilitator-rmm-detection
  borderline: true
  borderline_reason: A first-party US authority primary that extends the covered Huntress/PurpleDelta detection material (the covered entry already carries the PiKVM and RMM hunt), but it is US-oriented with no Swiss nexus and no new decision beyond the covered one; I judge it a marginal improvement record at best and a drop at worst. The FBI is not on the national-CERT carve-out list, so it is single-source other.
  evidence:
  - quote: North Korean ITWs cannot be identified reliably with a single indicator or detection
    attribution: FBI (IC3, PSA I-101326-PSA)
    source_url: https://www.ic3.gov/PSA/2026/PSA261013
  - quote: detection requires an "identity in depth" approach
    attribution: FBI (IC3, PSA I-101326-PSA)
    source_url: https://www.ic3.gov/PSA/2026/PSA261013
  - quote: Following termination, ITWs have made death threats against former managers and their families
    attribution: FBI (IC3, PSA I-101326-PSA)
    source_url: https://www.ic3.gov/PSA/2026/PSA261013
  extended_notes: Quotes were checked against the raw page text (url --direct) after WebFetch, with the typographic apostrophe in 'North Korea's' normalised in the PSA text. The covered entries already map the scheme (purpledelta 2026-08-19, kudelski-bismarck 2026-08-28, waterplum 2026-09-19).
