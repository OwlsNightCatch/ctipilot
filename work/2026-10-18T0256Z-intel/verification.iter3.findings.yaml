- code: F11
  category: editorial-advisory
  section: body
  item: "2026-10-18/connectwise-cloud-backup-skykick-m365-app-credential-abuse (main analysis)"
  url_or_quote: "later counted over 300 successful sign-ins from that address across almost 1,000 tenants"
  summary: "(low confidence) Huntress (https://www.huntress.com/blog/vendor-credential-enables-unauthorized-access, 10/17 update) says 'Huntress has identified almost 1,000 Entra tenants with sign-in activity from the IP address associated with the unauthorized activity. Over 300 of those succeeded.' The antecedent of 'those' is tenants, so the unit is probably tenants with a successful sign-in, not 300 sign-ins; the next bullet ('many of these sign-ins were successful') is ambiguous. Optional rewording: 'over 300 of almost 1,000 tenants with sign-in activity from that address succeeded'. May be left."
- code: F11
  category: editorial-advisory
  section: actions
  item: "2026-10-18/connectwise-cloud-backup-skykick-m365-app-credential-abuse (actions[0])"
  url_or_quote: "on a tenant licensed for Entra ID Free, export the sign-in and audit logs first, because it keeps 7 days"
  summary: "(low confidence) ConnectWise's advisory says 'Preserve evidence promptly, but do not delay urgent containment while waiting for exports.' The action puts the export 'first' on a Free tenant while the rest of the action is disable-now; the 7-day retention fact is right (ConnectWise: 'seven days on Free'; Todyl: 'Export logs now if you're on Entra ID Free'). Optional: say 'in parallel' or 'without delaying the disablement'. May be left."
- code: F11
  category: editorial-advisory
  section: defender-takeaway
  item: "2026-10-18/rank-math-seo-pro-3-0-123-malware-supply-chain (Defender takeaway, actions[0])"
  url_or_quote: "delete the whole plugin folder (deactivating is not enough), remove the malicious options and block the vendor-named host before anything else, then restore from a backup older than 2026-10-15 20:02 UTC or clean the rest by hand"
  summary: "(low confidence) Rank Math's delete-first Step 1 (folder, wp_options entries, host block, 'complete all the following actions before proceeding to Step 2') belongs to Option 2 (manual cleaning). Option 1 (restore from a clean backup) lists restore, scan, change credentials, install 3.0.124 with no delete-first step (https://rankmath.com/kb/pro-3-0-123-security-incident/). The takeaway and the action present delete-first as the order for both paths. Harmless, but a vendor ordering is generalised; optional: say 'on the manual-cleanup path'. May be left."
