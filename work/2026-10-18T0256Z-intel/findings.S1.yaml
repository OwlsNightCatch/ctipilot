    evidence:
      - quote: "2FA setup enforcement bypass via /realms/{realm}/login-actions/restart"
        attribution: "Keycloak Project"
        source_url: "https://www.keycloak.org/2026/10/keycloak-2681-released"
      - quote: "SAML broker HTTP-Redirect binding: query-string signature is verified over a different SAMLResponse than the one processed"
        attribution: "Keycloak Project (GitHub issue 53354)"
        source_url: "https://github.com/keycloak/keycloak/issues/53354"
      - quote: "Quarkus 4 disables semicolon query parameter delimiters by default"
        attribution: "Keycloak Project (GitHub issue 53354)"
        source_url: "https://github.com/keycloak/keycloak/issues/53354"
      - quote: "This allows an attacker on the same network to spoof the KDC and bypass the authentication process, potentially gaining unauthorized access to user accounts."
        attribution: "GitHub Advisory Database (CVE-2026-95503)"
        source_url: "https://github.com/advisories/GHSA-35j3-ccrv-pgvj"
    extended_notes: |
      Exposure: Keycloak servers on releases before 26.8.1 (read the running version from the admin console server-info
      page or the container image tag); the SAML weakness applies only to realms with a SAML identity-provider broker
      configured for signature validation without signed assertions; the 2FA, Conditional OTP and KDC items need the
      corresponding authenticator or federation provider in use. Detection (concept derived from the stated mechanisms, not
      vendor-published rules): web/reverse-proxy access logs for GET requests to the broker endpoint
      /realms/{realm}/broker/{alias}/endpoint whose query string contains a semicolon; Keycloak login events where a
      session reaches a successful LOGIN after a request to login-actions/restart without the configure-2FA required action
      completing; admin events for group-membership and role-mapping changes made by delegated admins holding only manage-users.
      Hardening named by the project: set wantAssertionsSigned on SAML IdP brokers; the Quarkus semicolon delimiter option.
      Suggested handling: the batch is all Low/Moderate with EPSS under 0.5 percent and no exploitation, so on the
      sound-throughout bar it is a hold-or-drop unless the main agent wants an identity-infrastructure awareness line;
      the SAML weakness has no CVE and may receive one later (watch for an update).
    borderline: true
    borderline_reason: "in lookback (2026-10-13, outside the 26 h window); no exploitation, no KEV, EPSS under 0.5 percent, Low/Moderate ratings; kept because Keycloak is identity infrastructure with prior store coverage (CVE-2026-16443 batch, rated high) and the SAML parser differential is described by the project as unauthenticated login as an arbitrary user under a non-default-but-plausible configuration"

  - title: "AhsayCBS CVE-2026-105133 / CVE-2026-105134: Horizon3.ai source-level analysis adds the root cause of both flaws, a public proof of concept and server-side hunt artifacts"
    sources:
      - { url: "https://horizon3.ai/attack-research/attack-blogs/ahsaycbs-cve-2026-105133-cve-2026-105134-technical-analysis/", publisher: "Horizon3.ai", date: "2026-10-14", role: "primary" }
    discovery_trace: "first seen at: horizon3-ai, URL https://horizon3.ai/attack-research/ (listing, 'AhsayCBS Deep-Dive: Auth Bypass to RCE', October 14, 2026) → primary: https://horizon3.ai/attack-research/attack-blogs/ahsaycbs-cve-2026-105133-cve-2026-105134-technical-analysis/ (no pivot needed; the post cites the Huntress report already carried by the covered entry)"
    summary: |
      Horizon3.ai published a source-level analysis of the two AhsayCBS flaws on 2026-10-14, the covered
      2026-10-10 entry's CVE-2026-105133 and CVE-2026-105134. Its findings, stated by Horizon3 from reading the Linux
      installer: the JSON API base class skips the system-administrator password check when an attacker-controlled
      "FromServlet" flag in the request body is set, so the whole /rps and /obs JSON API is reachable without credentials,
      and the AddSysUser action creates an administrator without consulting the caller; the second flaw sits in the
      Replication Receiver upload service, where two attacker-supplied headers are concatenated onto the receiver's write
      root with only the percent and colon characters escaped, and the system-folder denylist that is applied when a receiver
      is created is not applied to the computed upload path, so a file lands in a served web application and a JSP then runs
      as LocalSystem on Windows or root on Linux. Horizon3 says its proof of concept is on its GitHub and lists server-side
      hunt artifacts: command interpreters, curl, certutil or miners spawned from the CBS service process or JVM, new .jsp
      files under webapps/rps or webapps/cbs (especially ones that answer 404 unless a parameter is supplied), new replication
      receivers whose SystemHome sits under the install directory created outside a change window ("Created new receiver" in
      the system log), unexpected system administrator accounts, API logon entries for accounts nobody provisioned, and
      requests to the JSON .do endpoints or the receiver upload path carrying a FromServlet field or X-RSW-Request headers
      from untrusted sources. The covered entry already tags poc-public and carries the Huntress webshell artifacts; the
      delta is the root cause plus the account, receiver and request-field checks, which matter for the compromise check
      after the partner-only hotfix. FIRST.org EPSS (2026-10-16): CVE-2026-105134 0.0478 (percentile 0.918), CVE-2026-105133 0.0085.
    region_nexus: "global"
    primary_sector_nexus: "indirect"
