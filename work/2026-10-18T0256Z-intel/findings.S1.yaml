  - title: "Zimbra Collaboration 10.1.21: unauthenticated password-recovery code prediction, WebDAV pre-MFA token acceptance and OnlyOffice file-write code execution fixed, most without a CVE"
    sources:
      - { url: "https://wiki.zimbra.com/wiki/Zimbra_Security_Advisories", publisher: "Zimbra (Security Advisories wiki)", date: "2026-10-01", role: "primary" }
      - { url: "https://wiki.zimbra.com/wiki/Zimbra_Releases/10.1.21", publisher: "Zimbra (10.1.21 release notes)", date: "2026-10-01", role: "primary" }
      - { url: "https://www.heise.de/news/Groupware-Zimbra-Update-schliesst-zahlreiche-Sicherheitsluecken-11468996.html", publisher: "heise online (Dirk Knop)", date: "2026-09-29", role: "corroborating" }
      - { url: "https://www.rapid7.com/blog/post/ve-breaking-zimbra-identity-boundaries-part-1", publisher: "Rapid7 (Jonah Burgess)", date: "2026-10-13", role: "context" }
    discovery_trace: "first seen at: the 2026-10-14 run record's borderline-drop line naming NCSC.ch hub advisory 13022 (Zimbra, read on hub text only) → pivot: NCSC.ch security hub advisory 13022 via the bridge (`ncsc-csh post 13022`, API JSON, no page URL fetched), whose references name the vendor wiki and heise → primary: https://wiki.zimbra.com/wiki/Zimbra_Security_Advisories and https://wiki.zimbra.com/wiki/Zimbra_Releases/10.1.21 → corroborating: https://www.heise.de/news/Groupware-Zimbra-Update-schliesst-zahlreiche-Sicherheitsluecken-11468996.html → context: WebSearch (\"Zimbra CVE-2026-66911 CVE-2026-66912 unauthenticated account takeover exploited\") → https://www.rapid7.com/blog/post/ve-breaking-zimbra-identity-boundaries-part-1"
    summary: |
      Zimbra's 10.1.21 release (heise, 2026-09-29, says it had been available since the end of the previous week; the NCSC.ch
      hub advisory is dated 2026-10-01) lists, in the vendor's own advisory table, a fix for "a security vulnerability in the self-service
      password recovery mechanism that could allow an unauthenticated attacker to predict recovery codes and reset a user's
      password", WebDAV authentication that now rejects pre-MFA tokens, an OnlyOffice integration flaw that "could allow
      unauthorized file writes and remote code execution under specific conditions" (reported by Rapid7), a server-side
      JavaScript injection in the OnlyOffice integration reachable by an authenticated user, and eight stored XSS fixes in the
      Classic and Modern web clients; only two stored-XSS items carry CVE ids (CVE-2026-66911 and CVE-2026-66912), the CVE and
      CVSS columns for the password-recovery, WebDAV and OnlyOffice rows read TBD, the ENISA EUVD search returns no record
      for the two CVE ids, and no source read states any exploitation. The vendor gives no mechanism, preconditions or severity for the password-recovery
      flaw, so exposure cannot be narrowed beyond ZCS 10.1.x before 10.1.21. Rapid7 published the first part of a staged
      series on 2026-10-13 saying it reported more than 80 Zimbra vulnerabilities, with a GitHub tracker holding write-ups and
      proof-of-concept code and further parts promised on stored XSS, document-service SSRF to code execution and
      zimbra-to-root chains; its part 1 covers five other, mostly authenticated issues fixed in 10.1.17 and 10.1.20 or still
      without a public fix. heise adds that Zimbra flaws are often targeted because the software commonly runs in
      government and research institutions; the store already covers the exploited SNMP command injection CVE-2026-73570 (fixed in 10.1.20).
    region_nexus: "europe; heise states Zimbra commonly runs in government and research institutions; Swiss deployment footprint not established by the sources"
    primary_sector_nexus: "indirect: groupware used by public administrations"
    sector: "public-sector"
    cves: [CVE-2026-66911, CVE-2026-66912]
    techniques: [T1190, T1556.006, T1059.007, T1078]
    affected_products: ["Zimbra Collaboration"]
    entity_keys: ["product:zimbra-collaboration", "product:onlyoffice-docs"]
    new_entities: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "Fixed a security vulnerability in the self-service password recovery mechanism that could allow an unauthenticated attacker to predict recovery codes and reset a user's password."
        attribution: "Zimbra (Security Advisories wiki)"
        source_url: "https://wiki.zimbra.com/wiki/Zimbra_Security_Advisories"
      - quote: "Fixed a security issue in the OnlyOffice document editing integration that could allow unauthorized file writes and remote code execution under specific conditions."
        attribution: "Zimbra (Security Advisories wiki)"
        source_url: "https://wiki.zimbra.com/wiki/Zimbra_Security_Advisories"
      - quote: "Pre-MFA tokens are now rejected with an HTTP status, requiring users to fully complete Multi-Factor Authentication before accessing WebDAV resources."
        attribution: "Zimbra (Security Advisories wiki)"
        source_url: "https://wiki.zimbra.com/wiki/Zimbra_Security_Advisories"
      - quote: "Rapid7 reported more than 80 vulnerabilities spanning authentication, mailbox authorization, calendar processing, web clients, document services, and the host operating system."
        attribution: "Rapid7"
        source_url: "https://www.rapid7.com/blog/post/ve-breaking-zimbra-identity-boundaries-part-1"
    extended_notes: |
      Why it is returned despite the age: it is an unauthenticated account-takeover class flaw on an internet-facing
      groupware the 2026-10-14 fire dropped on the NCSC.ch hub text alone ("vendor pages not read this fire") and that no
      later run read; this return is the first read of the vendor's own advisory table. The hub advisory pairs the two CVE
      ids with the account-takeover text, but the vendor table assigns CVE-2026-66911 and CVE-2026-66912 to two stored-XSS
      rows and leaves the password-recovery row at TBD, so an entry must not attach those CVEs to the takeover flaw.
      Exposure: ZCS 10.1.x before 10.1.21 (the vendor table lists only 10.1.21 as the fix release; read the version with
      zmcontrol -v on the server); password recovery is a public web endpoint, so it is internet-exposed wherever self-service
      password reset is enabled (not stated by the vendor). Detection concept (derived from the stated mechanism): web access
      logs for bursts of password-recovery code submissions against one account, followed by a password change and a login
      from a new source; mailbox audit for new forwarding or Sieve rules after such a sequence. Suggested priority: notable
      to high only if the main agent applies the critical/high completeness duty; otherwise a hold until Rapid7 part 2 or a CVE
      with severity lands (an update is likely within days).
    borderline: true
    borderline_reason: "freshest vendor source 2026-10-01 and heise 2026-09-29 are outside the window, and no exploitation is reported; returned as a coverage-hole flag on an unauthenticated account-takeover class flaw in groupware common in government, with Rapid7's 2026-10-13 staged disclosure series (PoC tracker) as a fresh hook"

