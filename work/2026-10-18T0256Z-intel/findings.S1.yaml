      - { url: "https://github.com/advisories/GHSA-35j3-ccrv-pgvj", publisher: "GitHub Advisory Database (CVE-2026-95503)", date: "2026-09-22", role: "corroborating" }
      - { url: "https://github.com/advisories/GHSA-3g7j-6fqv-v2q4", publisher: "GitHub Advisory Database (CVE-2026-94000)", date: "2026-09-19", role: "corroborating" }
      - { url: "https://github.com/advisories/GHSA-f7cv-8449-mr73", publisher: "GitHub Advisory Database (CVE-2026-97846)", date: "2026-09-25", role: "corroborating" }
    discovery_trace: "first seen at: keycloak, URL https://www.keycloak.org/rss.xml (feed, newest item 'Keycloak 26.8.1 released', 2026-10-13) → primary: https://www.keycloak.org/2026/10/keycloak-2681-released → pivot: https://github.com/keycloak/keycloak/releases/tag/26.8.1 (links each CVE to its GHSA) → pivot: GHSA pages above and https://github.com/keycloak/keycloak/issues/53354 for the weakness"
    summary: |
      Keycloak 26.8.1, released 2026-10-13, lists 19 individually named CVEs under "Security fixes" plus two multi-CVE
      dependency bumps (jackson-databind, simple-git). The authentication-relevant ones: CVE-2026-94218 (a user can skip a
      mandated 2FA setup by manually visiting the login-actions restart link, which clears the markers that track required
      steps; the GitHub advisory rates it Low), CVE-2026-96445 (Conditional OTP honours skip headers that arrive over
      untrusted proxy paths), CVE-2026-95503 (Kerberos password authentication without SPNEGO does not verify the KDC
      identity, so an attacker on the same network can spoof the KDC), CVE-2026-97846 (Standard Token Exchange issues an
      unrestricted bearer token when the required mTLS certificate binding is not presented), CVE-2026-94000 / CVE-2026-94001 /
      CVE-2026-97177 (delegated-admin paths to realm-admin or around a denied reset-password permission), CVE-2026-94215
      (a limited admin reads or modifies master-realm client configuration through a realm they control), CVE-2026-103884
      (X.509 CRL distribution-point path traversal that reads local files or exhausts memory) and CVE-2026-82968 (persistent
      wrong-account linking through a social identity provider). The GitHub advisory pages read rate these Low or Moderate;
      FIRST.org EPSS (scores dated 2026-10-16) for the 18 Keycloak CVEs checked is at or below 0.0044, none is in CISA KEV,
      and no source reports exploitation. Separately, the release lists under "Weaknesses" (no CVE) issue 53354: the SAML
      broker HTTP-Redirect endpoint verifies the signature over a different query-parameter set than the one it processes
      because the two parsers disagree on the semicolon separator, which the issue title describes as unauthenticated login
      as an arbitrary user; the issue states it needs an IdP configured with signature validation on and "want assertions
      signed" off, lists the version as 26.7.3 and earlier, and names two mitigations (enable Want Assertions Signed, or
      disable semicolon query-parameter delimiters in Quarkus). The Keycloak post gives the fix version only and states no
      per-CVE affected range. The store has no Keycloak entry after 2026-08-19; releases 26.7.3, 26.7.4, 26.7.5 and 26.8.0
      (2026-08-31 to 2026-10-01) were neither covered nor examined in this return.
    region_nexus: "global; Keycloak is a common open-source SSO/IAM component in European public-sector deployments (source-list note); Swiss deployment footprint not established by the sources"
    primary_sector_nexus: "indirect: identity infrastructure behind e-government portals where deployed"
    sector: "public-sector"
    cves: [CVE-2026-94218, CVE-2026-96445, CVE-2026-95503, CVE-2026-97846, CVE-2026-94000, CVE-2026-94001, CVE-2026-97177, CVE-2026-94215, CVE-2026-103884, CVE-2026-82968, CVE-2026-96446, CVE-2026-15943, CVE-2026-18569, CVE-2026-94213, CVE-2026-94217, CVE-2026-97311, CVE-2026-101333, CVE-2026-107121, CVE-2026-91777]
