items:
  - title: "Keycloak 26.8.1: 19 CVEs fixed including a 2FA setup enforcement bypass, Kerberos KDC spoofing and a standard-token-exchange mTLS bypass, plus a SAML HTTP-Redirect signature parser differential tracked as a weakness without a CVE"
    sources:
      - { url: "https://www.keycloak.org/2026/10/keycloak-2681-released", publisher: "Keycloak Project", date: "2026-10-13", role: "primary" }
      - { url: "https://github.com/keycloak/keycloak/releases/tag/26.8.1", publisher: "Keycloak Project (GitHub release notes)", date: "2026-10-13", role: "primary" }
      - { url: "https://github.com/keycloak/keycloak/issues/53354", publisher: "Keycloak Project (GitHub issue 53354)", date: "2026-09-30", role: "primary" }
