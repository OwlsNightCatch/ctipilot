- code: F11
  category: editorial-advisory
  section: update section 2026-10-18T03:33:00Z
  item: "2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack (last sentence of the update section)"
  url_or_quote: "Neither document says how the attackers got in or that they used the XWEB PRO flaws the guide cites; the only link is that the guide's firmware boundary matches the flaws in the advisory it cites."
  summary: "Truth holds (the guide ties 1.12.1 to ICSA-26-057-10, 'XWEB Pro version 1.12.1 and prior' per CISA's CSAF) but 'the only link' is ambiguous and reads as a link between the attacks and the XWEB PRO flaws. Iteration 1 suggested 'no source ties the attacks to the XWEB PRO flaws the guide cites'; the reword did not make that plain."
