- code: F3
  category: claim-not-supported
  section: summary
  item: "2026-10-18/connectwise-cloud-backup-skykick-m365-app-credential-abuse (frontmatter summary)"
  url_or_quote: "Huntress and Todyl report that from 15 October the app's credential was used to obtain app-only Microsoft Graph tokens in customer Microsoft 365 tenants, with unauthorized sign-ins confirmed in 162 tenants by 16 October, ConnectWise Cloud Management apps assigning themselves directory roles in about 50 tenants and, in one, new client secrets added to other applications."
  summary: "The iteration-1 re-attribution left the whole chain under 'Huntress and Todyl report'. The 162-tenant count, the ~50-tenant role self-assignments and the secrets added in one tenant are Huntress's alone (https://www.huntress.com/blog/vendor-credential-enables-unauthorized-access); Todyl (https://www.todyl.com/blog/investigation-unauthorized-access-through-the-connectwise-cloud-backup-microsoft-365-app) says 'We found no directory changes tied to the activity in any tenant: no new secrets, applications, consents, or role assignments by the backup app.' Fix: name Huntress alone for the 162 / 50 / one-tenant clauses (Huntress and Todyl for the token issuance only)."
- code: F3
  category: claim-not-supported
  section: body (Exposure)
  item: "2026-10-18/rank-math-seo-pro-3-0-123-malware-supply-chain (Exposure, first sentence)"
  url_or_quote: "Rank Math says the installed version shows under Plugins, and Wordfence stresses that 3.0.123 alone does not establish compromise ([Wordfence, 2026-10-17](https://www.wordfence.com/blog/2026/10/rank-math-seo-pro-3-0-123-malware/))"
  summary: "The sentence chains a Rank Math fact and a Wordfence fact and ends on the Wordfence link only. Wordfence never mentions the Plugins screen (it says 'Website owners should check when version 3.0.123 was downloaded or installed'); the Plugins clause is Rank Math's ('navigate to Plugins to check your installed Rank Math PRO version', https://rankmath.com/kb/pro-3-0-123-security-incident/). Fix: add the Rank Math link to the Plugins clause (the iteration-1 remediation changed the attribution but not the citation)."
- code: F4
  category: hallucinated-fact
  section: body (Detection)
  item: "2026-10-18/connectwise-cloud-backup-skykick-m365-app-credential-abuse (Detection, first clause) (low confidence)"
  url_or_quote: "Entra service-principal sign-in logs for these apps from any address outside Microsoft and Azure ranges, which misses the role and credential changes made from private Azure space"
  summary: "(low confidence) Huntress's 10/17 update places only 'the access that led to the credential being added to Huntress and another app' in private Azure IPv6 space; for the role self-assignments it gives no source and states that 'for app-only actions it carries no source IP' (audit log). The clause extends the private-Azure-space statement to the role changes in ~50 tenants. Fix: say 'the credential additions' (or 'the access behind the credential additions') instead of 'the role and credential changes'."
