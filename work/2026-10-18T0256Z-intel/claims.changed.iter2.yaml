    text: "Horizon3's source-level analysis adds checks on the server itself, where the service process is the CBS JVM on Linux: new .jsp files under webapps/rps, webapps/cbs or any served application directory, especially ones that answer 404 unless a specific parameter is supplied; replication receivers whose home directory sits under the install directory and that were created outside a change window (a \"Created new receiver\" entry in the system log); unexpected system administrator accounts and API logon entries for accounts nobody provisioned; and requests to the JSON .do endpoints or the receiver upload path that carry a FromServlet field or X-RSW-Request headers from untrusted sources ("
