  - claim_id: 6e882722c6
    entry: 2026-10-18/connectwise-cloud-backup-skykick-m365-app-credential-abuse
    surface: "summary"
    kind: frontmatter
    text: "ConnectWise says it identified unauthorized access to application identities of its Cloud Backup (formerly SkyKick) service; Huntress and Todyl report that from 15 October the app's credential was used to obtain app-only Microsoft Graph tokens in customer Microsoft 365 tenants, with unauthorized sign-ins confirmed in 162 tenants by 16 October, ConnectWise Cloud Management apps assigning themselves directory roles in about 50 tenants and, in one, new client secrets added to other applications. ConnectWise disabled seven application identities and suspended the service on 17 October, but says disabling does not reverse changes already made in a tenant, so every tenant that ever consented a ConnectWise or SkyKick app needs the apps disabled and its application credentials, directory roles and consents reviewed. How the credential was obtained, who is behind it and what data was read are not public."
  - claim_id: 1fb8fcc313
    entry: 2026-10-18/connectwise-cloud-backup-skykick-m365-app-credential-abuse
    surface: "actions[0]"
    kind: frontmatter
    text: "In every Entra tenant you or your MSP administer, find the seven ConnectWise application identities by client ID (Cloud Backup is 506e08f9-6e9a-4da4-942b-a099a03644ae; the other six are in ConnectWise's advisory), dormant SkyKick connections included, and disable them without deleting, then keep them disabled until ConnectWise gives restoration instructions; on a tenant licensed for Entra ID Free, export the sign-in and audit logs first, because it keeps 7 days."
