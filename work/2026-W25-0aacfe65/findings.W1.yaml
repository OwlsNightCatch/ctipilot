    discovery_trace: "first seen at: WebSearch 'Velvet Ant Operation Highland VerdantBamboo BRICKSTORM June 2026' → Volexity blog primary → corroborating news article"
    summary: |
      Volexity published on 4 June (in-window for this W25 weekly window at 8 days) a new BRICKSTORM investigation into VerdantBamboo (WARP PANDA, UNC5221) — a China-nexus actor distinct from Velvet Ant. Key new findings vs. prior BRICKSTORM reports: (1) A FreeBSD-compatible BRICKSTORM variant deployed on a pfSense firewall at a compromised MSP — the first non-Linux variant; (2) A Rust-based BRICKSTORM variant with `gobfuscate` obfuscation; (3) Two new companion backdoors: PLENET/GRIMBOLT (.NET Native AOT compiled — harder to decompile than standard .NET; interactive shell, remote execution, file manipulation, C2 switching) and AGENTPSD (Python/PyInstaller reverse shell as fallback). Initial access via MSP firewall compromise then lateral movement to victim via stolen Egnyte Storage Sync credentials (SSH as `egnyteservice`). Victim's Microsoft 365 environment reached via BRICKSTORM SOCKS5 proxy on the Storage Sync VM. Vulnerability in Egnyte Storage Sync v13.13 (sudo misconfiguration via `tee`) allowed privilege escalation.

      **Background:** VerdantBamboo/UNC5221 was first documented by NVISO in April 2025 targeting Ivanti appliances with BRICKSTORM. The new variants show accelerated tooling development and an MSP supply-chain vector for the first time.

      **Defender posture:** Monitor firewall and pfSense syslog for unexpected process execution; inspect NAS and storage-sync VMs for BRICKSTORM WebSocket C2 patterns; audit `sudoers` entries for `tee`-enabled escalation paths; look for `.NET Native AOT` compiled binaries (large single-file executables with no managed IL visible to standard .NET decompilers); detect PyInstaller-compiled Python payloads in unusual paths. MSP defenders: treat all downstream customer environments as potentially exposed when an MSP edge device is compromised.
