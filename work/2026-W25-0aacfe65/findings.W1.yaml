  - title: "FishMonger (I-SOON / Earth Lusca) ports SprySOCKS to Windows with RawWNPF kernel rootkit and possible UEFI bootkit component (CVE-2023-24932)"
    sources:
      - { url: "https://www.welivesecurity.com/en/eset-research/fishmongers-arsenal-upgraded-sprysocks-windows/", publisher: "ESET WeLiveSecurity", date: "2026-06-16", role: "primary" }
      - { url: "https://thehackernews.com/2026/06/china-linked-sprysocks-backdoor-expands.html", publisher: "The Hacker News", date: "2026-06-17", role: "corroborating" }
    discovery_trace: "first seen at: prior_coverage item:fishmongerports-its-sprysocks (2026-06-17 daily) → in-window delta: ESET full technical paper with kernel-driver detail, UEFI bootkit indicator, new victim regions"
    summary: |
      ESET's full research paper (16 June) on FishMonger (Earth Lusca, TAG-22, Aquatic Panda — the Winnti Group contractor tracked as I-SOON) reveals two undocumented Windows SprySOCKS variants active between 2023–2024. WIN_DRV deploys the `RawWNPF.sys` kernel driver as a rootkit that: (1) hooks `NtQuerySystemInformation` to hide processes; (2) intercepts `IoCompletionRoutine` for IOCTL `0x12001B` in `nsiproxy.sys` to hide network connections; (3) registers minifilter callbacks (`IRP_MJ_CREATE`, `IRP_MJ_DIRECTORY_CONTROL`) to conceal files; (4) uses `CmRegisterCallbackEx` to hide persistence registry keys; (5) employs Windows Filtering Platform (WFP) to redirect specially crafted TCP packets to the hidden backdoor port. WIN_PLUS is a simplified variant without the driver. Communication protocols: TCP, UDP, WebSocket; 30+ supported commands. Limited telemetry also indicates a possible UEFI bootkit component exploiting CVE-2023-24932 (BlackLotus Secure Boot bypass, now patched). Victims: government organisations in Honduras, Taiwan, Thailand, Pakistan. EU nexus is indirect but concerning given I-SOON's broad targeting of government and defence.

      **Defender posture:** Hunt for `RawWNPF.sys` and variants; monitor for DLL side-loading via MFC Satellite DLLs; detect `svchost.exe` process-doppelgänging injections; alert on `netsh.exe`-based firewall rule modifications; FIM on `%SystemRoot%\Fonts` and spool directories for encrypted `.dat` persistence. For the UEFI angle: verify Secure Boot policy is on current patch level and enable Vulnerable Driver Blocklist.
    ch_eu_nexus: "indirect — I-SOON targets government/defence sectors globally; EU government networks are in the assessed targeting scope"
