  # ========== DELIVERABLE 3: RESEARCH FINDINGS ==========

  - title: "AutoJack: AI browsing agent hijack to host RCE via MCP WebSocket localhost trust bypass — AutoGen Studio pre-release builds affected (no CVE assigned yet)"
    sources:
      - { url: "https://www.microsoft.com/en-us/security/blog/2026/06/18/autojack-single-page-rce-host-running-ai-agent/", publisher: "Microsoft Security Blog", date: "2026-06-18", role: "primary" }
      - { url: "https://thehackernews.com/2026/06/autojack-attack-lets-one-web-page.html", publisher: "The Hacker News", date: "2026-06-19", role: "corroborating" }
    discovery_trace: "first seen at: THN feed item (2026-06-19) → Microsoft Security Blog primary → corroborated via THN detailed article"
    summary: |
      Microsoft's Defender Security Research Team published AutoJack (18 June), a three-flaw chain in AutoGen Studio's Model Context Protocol (MCP) WebSocket implementation that converts a browsing AI agent into a host-level RCE delivery mechanism. Chain: (1) CWE-1385 Origin allowlist bypass — the browsing agent (MultimodalWebSurfer) runs as a localhost process and passes origin checks on the MCP WebSocket at `ws://localhost:8081/api/mcp/ws/?server_params=`; (2) CWE-306 Missing authentication — the `/api/mcp/*` path family skips the normal auth middleware; (3) CWE-78 OS command injection — StdioServerParams decodes the base64 `server_params` URL argument and passes attacker-controlled binary path directly to `subprocess.run`. A malicious webpage steers the agent, reaching the privileged local socket and executing arbitrary host processes under the AutoGen Studio process account. No CVE identifiers assigned in the initial disclosure. Only pre-release PyPI builds 0.4.3.dev1 and 0.4.3.dev2 are affected; the stable 0.4.2.2 release lacks the MCP route entirely. Fix committed at GitHub `b047730` — no stable-release patch yet. No in-the-wild exploitation observed. The same week Microsoft disclosed CVE-2026-26030 and CVE-2026-25592 (Semantic Kernel RCE), and the Sophos underground-AI report (daily 2026-06-19) showed criminal interest in agent frameworks — collectively this week established the AI agent control plane as a concrete attack surface class.

      **Defender posture:** T1059 (Command and Scripting Interpreter via agent-spawned process) + T1566 (social engineering / prompt injection driving agent to attacker URL). Detection: Sysmon EID 1 `autogenstudio.exe` spawning unexpected child processes; network detection rule on WebSocket connections to `ws://localhost:*/api/mcp/ws/`; EDR parent-child relationship anomaly (browser process → local WebSocket → unexpected OS binary). Hardening: bind MCP socket to loopback with host firewall; run AutoGen Studio under low-privilege accounts in isolated developer containers; never deploy on shared or production systems.
