  - title: "VerdantBamboo/UNC5221 deploys FreeBSD-compatible and Rust-based BRICKSTORM variants with new .NET AOT backdoor (PLENET/GRIMBOLT) via compromised MSP firewall"
    sources:
      - { url: "https://www.volexity.com/blog/2026/06/04/verdantbamboo-just-another-brickstorm-in-the-firewall/", publisher: "Volexity", date: "2026-06-04", role: "primary" }
