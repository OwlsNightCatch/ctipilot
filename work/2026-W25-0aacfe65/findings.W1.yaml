  - title: "Sapphire Sleet (DPRK / BlueNoroff) escalates npm supply chain attacks: Mastra AI ecosystem poisoned in 88 minutes — second major npm strike after April 2026 Axios attack"
    sources:
      - { url: "https://www.microsoft.com/en-us/security/blog/2026/06/17/postinstall-payload-inside-mastra-npm-supply-chain-compromise/", publisher: "Microsoft Security Blog", date: "2026-06-17", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/microsoft-links-mastra-ai-supply-chain-attack-to-north-korean-hackers/", publisher: "BleepingComputer", date: "2026-06-18", role: "corroborating" }
    discovery_trace: "first seen at: msft-secblog feed entry (2026-06-17) → Microsoft Security Blog primary → BleepingComputer corroborating; note UNK_DeadDrop daily coverage (2026-06-16) is distinct cluster, this is a separate Sapphire Sleet operation"
    summary: |
      Microsoft attributes a second 2026 npm supply chain attack to Sapphire Sleet (UNC1069, STARDUST CHOLLIMA, BlueNoroff): attackers compromised the `ehindero` maintainer account (whose scope access was never revoked) and published 140+ malicious packages across the `@mastra` scope in 88 minutes on 13 June. The weaponised dependency `easy-day-js@1.11.22` (typosquatting the legitimate `dayjs` with 57M+ weekly downloads) ran an obfuscated 4,572-byte dropper (`setup.cjs`) via npm's `postinstall` hook: (1) TLS verification disabled via `NODE_TLS_REJECT_UNAUTHORIZED=0`; (2) marker files dropped in temp dirs; (3) ~41 KB second-stage fetched from C2 (`23.254.164.92:8000`); (4) detached, hidden Node.js process spawned. Persistence cross-platform: Windows Registry Run key (`protocal.cjs`), macOS LaunchAgent (`com.nvm.protocal.plist`), Linux systemd user unit (`nvmconf.service`). Exfiltrated: 166 browser extension IDs (MetaMask, Phantom, Coinbase), browser history SQLite DBs, cloud provider credentials (AWS, Azure, GCP), LLM API keys (OpenAI, Anthropic, Google), CI/CD tokens, SSH keys. This is the second Sapphire Sleet npm attack in 2026 (first: Axios HTTP client, ~70M weekly downloads, March/April 2026), establishing a pattern of targeting AI developer toolchain supply chains for maximum credential coverage. Microsoft Defender detects as `Trojan:JS/NpmStealz.Z!MTB`.

      **Defender posture:** Run `npm install --ignore-scripts` in CI/CD pipelines to prevent postinstall execution; pin package versions in lock files; monitor for `setup.cjs` or `easy-day-js` in `node_modules`; hunt for `protocal.cjs` in Registry Run keys or LaunchAgent plists; rotate all API keys and cloud credentials on affected systems; Sysmon: alert on `node.exe` spawning detached child processes from within `node_modules` directories (EID 1 parent-image filter).
