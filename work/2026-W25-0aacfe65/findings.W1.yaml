    summary: |
      Since the June 19 ESET coverage, The Gentlemen claimed the Mackay Sugar attack (Australia's second-largest raw sugar producer) on 15 June: mills were shut down, with IT systems supporting "cane supply, harvesting and mill operations" compromised. Whether industrial control systems (ICS/OT) were directly reached remains unconfirmed; the company resumed limited manual crushing on 12 June. No data leaked as of 20 June. The group now has 483+ victims on its dark-web leak site, 380 in 2026 alone (second-most prolific group in 2026 by published victim count, behind Qilin). Microsoft's 28 May analysis details the technical underpinning: a Go-based encryptor using per-file ephemeral Curve25519 + XChaCha20 encryption with aggressive self-propagation — when deployed with `--spread`, it functions as a self-replicating worm that enumerates SMB shares and deploys via WMI/PsExec without further operator interaction. EDR-killer framework GentleKiller centrally maintained by Storm-2697 operators and distributed to affiliates targets 400+ security processes. Fox Tempest (Microsoft-disrupted malware-signing-as-a-service) provided the signed dropper chain used by some affiliates. Check Point Q1 2026 data shows the group avoids US targets (only 13.3%), concentrating on Australia, Thailand, and Brazil — OT/manufacturing-heavy economies.

      **Defender posture:** Hunt for `--spread` argument in process command lines of Go-compiled binaries; block WMI lateral movement from unexpected source hosts (`Win32_Process.Create` via WMI); enforce tiered SMB ACLs to prevent worm propagation; deploy EDR with kernel-level self-protection to resist GentleKiller process-termination; monitor for unsigned or Fox-Tempest-signed binaries (Authenticode certificate chain from short-lived issuing CAs).
