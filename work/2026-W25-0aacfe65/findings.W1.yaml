    summary: |
      INC ransomware has surpassed 830 victims since August 2023 and ranked 4th in Q1 2026 (120+ incidents per ZeroFox, behind Qilin, Akira, and The Gentlemen). Key technical evolution per Acronis: (1) Rust-based rewrite of Windows and Linux/ESXi encryptors for cross-platform deployment and reverse-engineering resistance; (2) BYOVD deployment using drivers `filwfp.sys`, `filnk.sys`, and `fildds.sys` for EDR termination — these are the same three drivers as used in earlier Vanilla Tempest campaigns, suggesting a driver supply relationship; (3) lateral movement via LOLBins (RDP, PsExec), commercial RMM tools (AnyDesk, ScreenConnect, TeamViewer), and Cobalt Strike; (4) Veeam credential dumper for backup infrastructure targeting. The May 2024 source-code sale to an unidentified party spawned two code-overlap variants: Lynx (still active, declining 42%) and Sinobi. INC avoids the US (65%+ of victims historically), with heavy European exposure: NHS Dumfries & Galloway and Alder Hey Children's Hospital (UK) among confirmed victims; Germany is the #2 ransomware target country in Q1 2026 (Emsisoft, 5.9% of global victims).

      **Defender posture:** Detect the three BYOVD drivers (`filwfp.sys`, `filnk.sys`, `fildds.sys`) via Sysmon EID 6 (driver load) with hash-based blocklist; alert on Veeam process memory access from unexpected parents (credential dumping); monitor for Cobalt Strike Beacon patterns in network traffic; restrict LOLBin (PsExec, RDP from management jump hosts only) via WDAC; ensure backup systems have MFA and are network-isolated.
