    discovery_trace: "first seen at: WebSearch 'Velvet Ant Operation Highland VerdantBamboo BRICKSTORM June 2026' → Sygnia blog primary → GBHackers corroborating"
    summary: |
      Sygnia disclosed on 11 June an investigation into Velvet Ant (a China-nexus APT tracked separately from VerdantBamboo/UNC5221) that maintained undetected access in a segregated critical infrastructure network for approximately a decade (first artifacts: ~2016). The attack chain: internet-facing servers compromised via modified `auditdb` reverse shell (GS-Netcat derivative, masquerades as kernel thread) and custom SOCKS5 Perl proxy → HTTP command execution via Nginx + FastCGI wrapper chains → custom `uptime` binary establishing SSH connections from internal targets based on HTTP parameters — bridging a network with no direct internet connectivity. Nine variants of backdoored `pam_unix.so` with hardcoded passwords and credential harvesting, plus modified `ssh`, `sshd`, `scp`, `ssh-keygen` binaries with keylogging. Persistence via systemd or modified SysVinit scripts. No direct EU/Swiss victim named, but Velvet Ant previously targeted Cisco NX-OS zero-days (CVE-2024-20399) and F5 BIG-IP appliances (Sygnia prior reports); the OT/critical-infrastructure TTPs are directly relevant to European network operators.

      **Background:** Velvet Ant has been tracked since Sygnia's 2024 disclosures on F5 BIG-IP abuse and Cisco NX-OS zero-day deployment. This 2026 investigation reveals the full depth of their long-dwell infrastructure compromise methodology — prior reporting covered the exploit entry points; this report covers the persistence layer that survived those initial mitigations.

      **Defender posture:** FIM on PAM modules and OpenSSH binaries as highest-priority security controls; monitor for processes masquerading as kernel threads (Sysmon EID 1: low-privilege process with kernel-like name); detect Nginx + FastCGI CGI execution patterns on bastion hosts; enforce MFA before critical-host SSH access; post-compromise credential rotation must precede persistence removal. On isolated networks: deploy EDR with offline telemetry collection; audit for unauthorised systemd/SysVinit service installations.
