  - title: "Velvet Ant Operation Highland: China-nexus actor maintained decade-long (2016–2026) undetected presence in air-gapped critical infrastructure via multi-hop HTTP proxy chain and backdoored PAM/OpenSSH"
    sources:
      - { url: "https://www.sygnia.co/blog/operation-highland-velvet-ant/", publisher: "Sygnia", date: "2026-06-11", role: "primary" }
