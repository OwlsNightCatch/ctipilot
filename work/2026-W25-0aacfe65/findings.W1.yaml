    discovery_trace: "first seen at: prior_coverage item:nightmare-chaotic-eclipse (2026-06-19 update) → in-window delta: patch still absent as of June 21, PoC validated on June-2026 Patch Tuesday builds"
    summary: |
      As of 21 June, CVE-2026-50656 (RoguePlanet, CVSS 7.8) remains unpatched. The exploit published by researcher Nightmare Eclipse (Chaotic Eclipse) on 10 June — hours after June Patch Tuesday — abuses a Time-of-Check to Time-of-Use (TOCTOU) race condition in Microsoft Defender's file-processing workflow: Defender checks a file path under the SYSTEM account, then reopens it for analysis; the exploit replaces the original file in the gap between those two operations to achieve SYSTEM-level command execution. CWE-59 (Improper Link Resolution Before File Access). The PoC is validated against fully-patched Windows 10 and Windows 11, including the June 2026 Patch Tuesday build KB5094126. Real-Time Protection status does not affect exploitability. The researcher warns that "small changes in the PoC can completely bypass mitigations — the only thing you can realistically do is wait for a patch." Microsoft confirmed the vulnerability and stated a fix is "in development" with no release timeline given.

      **Defender posture:** No direct user-space mitigation is available. Attack requires local authenticated access (T1068 Exploitation for Privilege Escalation), making it a post-initial-access concern. Detection angle: monitor for `MsMpEng.exe` spawning unexpected child processes or for symbolic link manipulation in temp directories timed to Defender scan activity (Sysmon EID 11 file creation + EID 1 child process of MsMpEng.exe). Enforce application whitelisting to limit post-exploitation lateral movement.
