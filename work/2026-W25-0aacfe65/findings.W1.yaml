    discovery_trace: "first seen at: prior_coverage item:fortibleed (2026-06-18) → in-window delta from SecurityWeek/CISA expanding scope → Fortinet PSIRT confirmation → Security Affairs follow-up"
    summary: |
      The FortiBleed credential-harvesting campaign has grown from the 73,932 figure in the 18 June daily brief to a confirmed 86,644 FortiGate management URLs across 194 countries and 21,632 domains — roughly 50% of all internet-facing Fortinet devices. A Russian-speaking multi-operator group ran approximately 1.16 billion credential attempts against 320,000+ FortiGate targets using a 45-GPU Hashtopolis cluster. Credential types break down as generic admin accounts (35%), built-in Fortinet system accounts (28.3%), and organisation-specific accounts (36.7%). Fortinet confirmed on 19 June that the campaign ties to previously disclosed incidents FG-IR-26-060 and FG-IR-25-647, and that credentials originated from exported device configurations — consistent with earlier FortiOS credential-exposure CVEs (CVE-2022-40684, CVE-2023-27997, CVE-2024-21762 have historical precedent here), rather than a new vulnerability. CISA's 18 June alert confirmed at least four organisations were "fully compromised" with AD domain takeover and lateral movement, and Huntress observed 845 partner organisations affected. Named organisations in the leaked dataset include Foxconn, Samsung, Comcast, Siemens, Lenovo, PwC, Accenture, Oracle, and a Turkish NATO defence contractor claimed as fully compromised with classified document exfiltration.

      **Defender posture:** CISA mandates migrating all FortiGate SSL VPN deployments to certificate-based authentication or FIDO2; Fortinet recommends upgrading to 7.4, 7.6, or 8.0 for PBKDF2 credential storage. Immediate actions: terminate all admin/VPN sessions, reset credentials, review logs for accounts with "admin" or built-in names, block external management interfaces, and audit for post-compromise AD persistence (unexpected admin accounts, new GPOs, lateral movement from VPN-adjacent subnets).
