  item: "DORA Year 1 — the ESAs' first annual ICT-incident report (§ 7)"
  url_or_quote: "https://www.eba.europa.eu/publications-and-media/press-releases/esas-publish-first-report-dora-major-ict-related-incidents"
  summary: "Brief: 'roughly one-third traced back to third-party ICT providers'. Both EBA and EIOPA primaries state the one-third figure is CROSS-BORDER IMPACT ('around one third of the 3,383 major incidents ... had a cross-border impact'), not third-party-provider-driven. The misread also propagates to the § 0 bullet ('a third third-party-driven') and is the load-bearing 'echo of this week's third-party theme' analysis."
