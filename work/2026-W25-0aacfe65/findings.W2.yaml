      For FINMA-supervised entities, the ESA report benchmarks EU peers but does not directly bind Swiss firms.
      The third-party concentration finding aligns with DORA's ICT third-party risk framework (Articles 28-44).

  - title: "CRA reporting deadline T-82 days: ENISA Single Reporting Platform access manual due June 2026, dry-run testing before 11 September milestone"
    sources:
      - { url: "https://www.enisa.europa.eu/topics/product-security-and-certification/single-reporting-platform-srp", publisher: "ENISA", date: "2026-06-01", role: "primary" }
      - { url: "https://digital-strategy.ec.europa.eu/en/policies/cra-reporting", publisher: "European Commission Digital Strategy", date: "2026-06-01", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch ('EU Cyber Resilience Act CRA September 2026 reporting platform milestone development') → pivot: Crowell & Moring alert (403, bridge failed) → ENISA SRP page https://www.enisa.europa.eu/topics/product-security-and-certification/single-reporting-platform-srp → EC Digital Strategy page https://digital-strategy.ec.europa.eu/en/policies/cra-reporting"
    summary: |
      From 11 September 2026, manufacturers of products with digital elements must use ENISA's Single
      Reporting Platform (SRP) to report actively exploited vulnerabilities (24-hour early warning + 72-hour
      notification + final report ≤14 days after corrective measure) and severe incidents (24 h + 72 h + 30
      days). As of June 2026, ENISA had publicly committed to publishing access manuals and registration
      instructions during June 2026, with a testing / dry-run period before the September go-live. The SRP
      enables simultaneous notification to ENISA and the relevant national CSIRT (for Swiss-nexus product
      manufacturers, the NCSC/GovCERT.ch is the designated national CSIRT). ENISA procured a development
      contractor for the SRP under a public tender; the platform architecture centralises what would otherwise
      be bilateral flows between manufacturer and each Member State CSIRT. The December 2027 date applies to
      the full set of essential-requirements obligations; the September 2026 reporting obligation applies
      specifically to vulnerability and incident notification and is the first CRA obligation to land. Swiss
      companies that export products with digital elements to EU markets are directly in scope and should begin
      SRP registration preparation.
    ch_eu_nexus: "directly affects Swiss product manufacturers exporting to EU; NCSC/GovCERT.ch is national CSIRT counterpart"
    public_sector_nexus: "indirect — Swiss public-sector entities that procure in-scope products from manufacturers subject to SRP reporting"
    sector: "technology, manufacturing, public-sector procurement"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "As of 11 September 2026, manufacturers are required to report actively exploited vulnerabilities and severe incidents impacting the security of products with digital elements"
        attribution: "EC Digital Strategy — CRA Reporting page"
        source_url: "https://digital-strategy.ec.europa.eu/en/policies/cra-reporting"
    extended_notes: |
