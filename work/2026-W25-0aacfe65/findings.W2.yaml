  - title: "NCSC-CH Week 24 Wochenrückblick: QR-code phishing on fake Swiss Post collection notices — hybrid physical+digital attack targeting credit-card data in French-speaking Switzerland"
    sources:
      - { url: "https://www.ncsc.admin.ch/ncsc/en/home/aktuell/im-fokus/2026/wochenrueckblick_24.html", publisher: "NCSC-CH", date: "2026-06-16", role: "primary" }
