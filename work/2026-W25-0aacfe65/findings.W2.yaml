      monitor https://www.enisa.europa.eu/topics/product-security-and-certification/single-reporting-platform-srp
      for the manual publication.

  - title: "NIS2 enforcement escalates: seven Member States referred to CJEU for CER Directive failure; France and Spain lag NIS2 transposition with no legislative agenda slot"
    sources:
      - { url: "https://digital-strategy.ec.europa.eu/en/policies/nis-transposition", publisher: "European Commission Digital Strategy", date: "2026-05-01", role: "primary" }
      - { url: "https://viktoria-compliance.eu/en/blog/nis2-transposition-status-eu-2026", publisher: "Viktoria Compliance (aggregator)", date: "2026-05-01", role: "corroborating" }
    discovery_trace: "first seen at: W24 weekly task note (France and Spain CJEU referral) → WebSearch ('NIS2 transposition France Spain CJEU referral 2026 follow-up') → EC Digital Strategy transposition tracker https://digital-strategy.ec.europa.eu/en/policies/nis-transposition → WebSearch ('NIS2 CJEU referral France Spain Luxembourg Netherlands Poland Sweden April 2026') → corroborating: Viktoria Compliance tracker"
    summary: |
      The W24 weekly noted the Commission had referred France and Spain to the CJEU over NIS2. The in-window
      delta corrects and enriches that item: the 29 April 2026 Commission action was a CJEU referral for
      failure to transpose the companion CER Directive (EU 2022/2557 — Critical Entities Resilience), not
      NIS2 itself. Nonetheless, the seven Member States referred (Bulgaria, France, Luxembourg, the Netherlands,
      Poland, Spain and Sweden) substantially overlap the NIS2 laggards. Bulgaria has since passed its NIS2
      transposition (February 2026). France is the most materially delayed for cybersecurity practitioners:
      as of June 2026 the NIS2 vehicle (projet de loi Résilience, operationalised through Article 14) did
      not appear on the agenda for the extraordinary parliamentary session opening 1 July 2026 — ANSSI
      confirmed the delay is expected to extend into late-2026 at the earliest, now approximately 20 months
      past the October 2024 transposition deadline. ANSSI has published the Référentiel Cybersécurité Français
      (ReCyF) since March 2026 as a preparatory compliance framework, but without enacted legislation
      ANSSI cannot formally designate entities or apply sanctions. For Swiss organisations with French
      supply-chain or data-processing counterparts, this means NIS2-derived incident-notification flows
      from French-entity partners remain unenforceable until transposition completes.
    ch_eu_nexus: "Swiss organisations with EU operations or suppliers in France/Spain/Netherlands/Sweden face continued regulatory uncertainty for NIS2 obligations in those jurisdictions"
    public_sector_nexus: "direct — Swiss public-sector entities with cross-border EU NIS2-scope dependencies"
    sector: "cross-sector, government"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "update-to-prior:2026-W24"
    evidence:
      - quote: "The French bill transposing the NIS2 directive does not appear on the parliamentary agenda for the extraordinary session opening July 1, 2026"
        attribution: "Viktoria Compliance NIS2 tracker"
        source_url: "https://viktoria-compliance.eu/en/blog/nis2-transposition-status-eu-2026"
    extended_notes: |
      The ANSSI ReCyF framework (https://cyber.gouv.fr) provides a working compliance document. Belgium,
      Croatia, Czech Republic, Estonia and others have fully transposed; 22 of 27 MS are now compliant.

  - title: "G7 Évian cybersecurity declaration: post-quantum cryptography transition declared 'urgent priority'; AI-cyber dual-use and SME resilience added as standing agenda items"
    sources:
      - { url: "https://cyber.gouv.fr/en/publications/jointly-led-international-publications/declaration-of-the-g7-cybersecurity-working-group/", publisher: "ANSSI (G7 CWG Declaration host)", date: "2026-05-27", role: "primary" }
      - { url: "https://digital-strategy.ec.europa.eu/en/news/european-commission-welcomes-g7-cybersecurity-declaration-strengthen-global-digital-resilience", publisher: "European Commission", date: "2026-06-17", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch ('ANSSI cybersecurity G7 Evian summit report June 2026') → pivot: ANSSI G7 CWG declaration page https://cyber.gouv.fr/en/publications/jointly-led-international-publications/declaration-of-the-g7-cybersecurity-working-group/ → corroborating: EC Digital Strategy welcome statement https://digital-strategy.ec.europa.eu/en/news/european-commission-welcomes-g7-cybersecurity-declaration-strengthen-global-digital-resilience"
    summary: |
      France hosted the G7 Cybersecurity Working Group plenary in Paris on 27 May 2026 under its G7 presidency,
      and the resulting declaration was formally adopted at the Évian summit (15–17 June 2026). The declaration
      identifies four operational domains: (1) post-quantum cryptography, explicitly labelled an "urgent
      priority" with a call for coordinated industry-government action on migration timelines; (2) AI-related
      cybersecurity risks, framed as a dual-use concern where adversaries leverage LLMs while defenders adopt
      AI-assisted tooling; (3) telecommunications infrastructure resilience; (4) SME cybersecurity. The
      European Commission issued a welcome statement on 17 June 2026, explicitly linking the G7 CWG
      declaration to the EU's own NIS2 / CRA regulatory stack. Switzerland, while not a G7 member, sits
      adjacent to the Évian location and NCSC-CH participates in related multilateral cybersecurity formats;
      the PQC urgency framing is directly relevant to Swiss federal agencies currently planning cryptographic
      migration under the BBl 2025 recommendation timeline. The ANSSI prepared cybersecurity operational
      support for the Évian summit organisation, including DDOS-hardening guidance distributed pre-event.
    ch_eu_nexus: "directly relevant to Swiss federal and cantonal public-sector PQC planning; NCSC-CH aligned on multilateral formats"
    public_sector_nexus: "direct — federal PQC migration, public telecom infrastructure"
    sector: "government, telco, cross-sector"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "The G7 calls for coordinated action across industry and government to mitigate risks and enable secure adoption of PQC, and considers the transition to PQC an urgent priority"
        attribution: "ANSSI G7 CWG Declaration"
        source_url: "https://cyber.gouv.fr/en/publications/jointly-led-international-publications/declaration-of-the-g7-cybersecurity-working-group/"
      - quote: "The European Commission welcomes the adoption of the G7 Cybersecurity Working Group Declaration, an important step towards fortifying collective cyber defences against evolving digital threats"
        attribution: "European Commission"
        source_url: "https://digital-strategy.ec.europa.eu/en/news/european-commission-welcomes-g7-cybersecurity-declaration-strengthen-global-digital-resilience"
    extended_notes: |
      The declaration addresses critical infrastructure protection as an implicit fourth area. For Swiss
      public-sector defenders: the PQC urgency framing aligns with NIST's final PQC standards (ML-KEM,
      ML-DSA) from August 2024; the NCSC-CH has published guidance. The financial sector sub-item on
      AI-cyber coordination links to the DORA ESA report above.

  - title: "NoName057(16) DDoS campaign against French/Swiss-border public sites materialised on G7 day one — temporary outages, no data compromise, symbolic impact confirmed"
    sources:
      - { url: "https://www.cyberattaque.org/g7-devian-plusieurs-sites-publics-de-haute-savoie-cibles-par-des-cyberattaques/", publisher: "Cyberattaque.org (French cybersecurity news)", date: "2026-06-16", role: "primary" }
      - { url: "https://www.ncsc.admin.ch/ncsc/en/home/aktuell/im-fokus/2026/massnahmen-grossanlaesse-konferenzen-g7.html", publisher: "NCSC-CH", date: "2026-06-01", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch ('G7 Evian summit June 2026 NoName057 DDoS hacktivist Switzerland') → pivot: Cyberattaque.org article https://www.cyberattaque.org/g7-devian-plusieurs-sites-publics-de-haute-savoie-cibles-par-des-cyberattaques/ → NCSC-CH pre-event advisory https://www.ncsc.admin.ch/ncsc/en/home/aktuell/im-fokus/2026/massnahmen-grossanlaesse-konferenzen-g7.html"
    summary: |
      NoName057(16) ran DDoS attacks on 15 June 2026 — the opening day of the G7 Évian summit — against
      public-sector and tourism-sector web properties in the Haute-Savoie department (bordering Switzerland
      near Geneva). Confirmed targeted sites included: municipalities of Évian-les-Bains, Thonon-les-Bains,
      and Saint-Gingolph; the Lake Annecy tourism office; and the EVA'D public transport network portal.
      The group's Telegram channel published screenshots showing HTTP 500 and 503 error pages, consistent
      with volumetric layer-7 saturation. Impact was limited to temporary service unavailability; no data
      was exfiltrated or compromised. This matches the NCSC-CH's pre-event prediction (published 29 May 2026)
      that hacktivist DDoS was the primary risk vector for G7-adjacent Swiss and French organisations.
      The NCSC-CH distributed DDoS mitigation guidance to Swiss organisations in advance. The attack pattern
      parallels NoName057(16)'s Bürgenstock 2024 campaign against Swiss federal sites during the Ukraine
      peace summit. Technique class: T1498 Network Denial of Service (MITRE ATT&CK). Attribution: NoName057(16)
      self-claimed via Telegram; no independent technical confirmation was reported in-window.
    ch_eu_nexus: "directly relevant to Swiss organisations near Lake Geneva and public-sector sites adjacent to G7 security perimeter; NCSC-CH issued pre-event guidance"
    public_sector_nexus: "direct — Swiss and French public-sector websites and transport infrastructure"
    sector: "government, transport, tourism"
    cves: []
    actors_campaigns_malware: ["NoName057(16)"]
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "Plusieurs sites internet de collectivités et de services publics de Haute-Savoie ont été visés par une série de cyberattaques le 15 juin 2026, à quelques heures de l'ouverture du G7 à Évian-les-Bains"
        attribution: "Cyberattaque.org (Thomas Lazzaroni)"
        source_url: "https://www.cyberattaque.org/g7-devian-plusieurs-sites-publics-de-haute-savoie-cibles-par-des-cyberattaques/"
    extended_notes: |
      English translation of the evidence quote: "Several websites of local authorities and public services
      in Haute-Savoie were targeted by a series of cyberattacks on 15 June 2026, hours before the opening
      of the G7 in Évian-les-Bains." Confidence MEDIUM not HIGH because attribution rests on NoName057(16)
      self-claim via Telegram with no independent technical corroboration confirmed in-window. The NCSC-CH
      pre-event advisory is not a post-event incident report. However, the pattern is entirely consistent
      with the group's documented MO. No Swiss federal sites appear to have been affected in-window — the
      campaign focused on French local authorities.

  - title: "UK ICO leadership vacuum: Commissioner Edwards resigns with immediate effect after HR investigation finds 'case to answer'; regulatory continuity under Chief Executive Paul Arnold"
    sources:
      - { url: "https://ico.org.uk/about-the-ico/media-centre/news-and-blogs/2026/06/ico-confirms-john-edwards-resignation/", publisher: "ICO", date: "2026-06-19", role: "primary" }
      - { url: "https://ico.org.uk/about-the-ico/media-centre/news-and-blogs/2026/06/temporary-governance-changes-at-the-ico/", publisher: "ICO", date: "2026-06-10", role: "corroborating" }
      - { url: "https://www.computerweekly.com/news/366644976/UK-information-commissioner-John-Edwards-resigns-after-HR-investigation", publisher: "Computer Weekly", date: "2026-06-19", role: "corroborating" }
    discovery_trace: "first seen at: prior_coverage.json key 'item:uk-information-commissioner-resigns-with-immediate-effect-re' (2026-06-21 brief) → checking for in-window regulatory-capacity delta → ICO confirmation page https://ico.org.uk/about-the-ico/media-centre/news-and-blogs/2026/06/ico-confirms-john-edwards-resignation/ → governance changes page https://ico.org.uk/about-the-ico/media-centre/news-and-blogs/2026/06/temporary-governance-changes-at-the-ico/ → Computer Weekly article https://www.computerweekly.com/news/366644976/UK-information-commissioner-John-Edwards-resigns-after-HR-investigation"
    summary: |
      John Edwards, UK Information Commissioner since January 2022, resigned with immediate effect on 19 June
      2026 after an independent workplace investigation found there was 'a case to answer' regarding his conduct
      — Edwards acknowledged exercising 'poor judgement' and making 'inappropriate attempts at humour'. He had
      voluntarily stepped back from duties since 26 February 2026 while continuing to receive his £200,000
      annual salary; the ICO made formal interim governance changes on 10 June 2026, delegating Commissioner
      responsibilities to the board. As of the resignation date, Chief Executive Paul Arnold holds Commissioner
      responsibilities under a scheme of delegation. The ICO board and executive team continue routine
      regulatory work. This is a regulatory-capacity story for Swiss and EU organisations with UK operations:
      the ICO's high-profile enforcement actions (including a £14M fine against Reddit in early 2026 for
      children's-data age-assurance failures) were driven under Edwards' tenure; continuity of that
      enforcement posture under Arnold is not guaranteed. The appointment process for a new Commissioner
      under DSIT and parliament is expected to take several months. During the interregnum the ICO lacks
      its top accountability anchor at a time when it is also mid-restructure.
    ch_eu_nexus: "relevant to Swiss and EU organisations with UK-resident data subjects or UK processing activities subject to UK GDPR enforcement"
    public_sector_nexus: "indirect — Swiss public-sector entities operating in UK data-protection regulatory space"
    sector: "cross-sector, government, health"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "update-to-prior:2026-06-21"
    evidence:
      - quote: "The investigation concluded that there was a case to answer and made clear that his behaviour fell short of the conduct expected from a public official"
        attribution: "ICO confirmation statement"
        source_url: "https://ico.org.uk/about-the-ico/media-centre/news-and-blogs/2026/06/ico-confirms-john-edwards-resignation/"
    extended_notes: |
      This item was first covered as a daily item in the 2026-06-21 brief under active-threats as a regulatory
      development. The weekly lens adds the policy-horizon framing: enforcement trajectory, succession
      process, and implications for ongoing GDPR Article 83 penalty pipeline under the interregnum.

  - title: "ICO criminal caution for Princess of Wales medical-record access — s.170(5) DPA 2018 applied; no organisational enforcement against London Clinic"
    sources:
      - { url: "https://ico.org.uk/about-the-ico/media-centre/news-and-blogs/2026/06/ico-statement-conclusion-of-criminal-investigation/", publisher: "ICO", date: "2026-06-17", role: "primary" }
      - { url: "https://www.infosecurity-magazine.com/news/ico-cautions-healthcare-worker/", publisher: "Infosecurity Magazine", date: "2026-06-18", role: "corroborating" }
    discovery_trace: "first seen at: prior_coverage.json key 'item:uk-ico-issues-criminal-caution-to-london-clinic-insider-over' (2026-06-19 brief) → checking for in-window policy/enforcement delta → ICO primary statement https://ico.org.uk/about-the-ico/media-centre/news-and-blogs/2026/06/ico-statement-conclusion-of-criminal-investigation/ → Infosecurity Magazine https://www.infosecurity-magazine.com/news/ico-cautions-healthcare-worker/"
    summary: |
      The ICO concluded its two-year criminal investigation into unlawful access to Catherine, Princess of
      Wales's medical records at The London Clinic by issuing a formal caution under section 170(5) of the
      Data Protection Act 2018 to the former healthcare professional involved (the individual — a nurse —
      was already struck off). Section 170(5) DPA 2018 criminalises obtaining, disclosing, or procuring the
      disclosure of personal data without the controller's consent, including obtaining it for subsequent
      sale or disclosure. The ICO found the conduct constituted 'deliberate misuse of highly sensitive
      personal information and an offer to disclose it for financial gain' — a clear insider threat pattern
      (T1078 Valid Accounts + T1213 Data from Information Repositories in MITRE terms, though the vector
      here was legitimate role-based access misused). The ICO assessed whether the London Clinic had
      organisational failings meeting enforcement threshold but found they did not. This outcome reinforces
      a caution-first-for-individuals posture for UK healthcare; for EU healthcare bodies the equivalent
      pathway runs through Article 83(4)/(5) GDPR administrative fines which can reach €10M or 2% global
      turnover. The insider-access angle is the operationally relevant one: EHR audit-log coverage gaps
      that allow role-based access to high-profile patient records without anomaly detection.
    ch_eu_nexus: "relevant to Swiss healthcare institutions operating EHR systems; insider-access controls and audit-log completeness are the technical takeaway"
    public_sector_nexus: "direct — Swiss and EU public-sector healthcare bodies"
    sector: "healthcare"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "update-to-prior:2026-06-19"
    evidence:
      - quote: "The conduct involved deliberate misuse of highly sensitive personal information and an offer to disclose it for financial gain, representing a clear breach of trust"
        attribution: "ICO (via Infosecurity Magazine)"
