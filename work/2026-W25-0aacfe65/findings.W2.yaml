  - title: "EDPB adopts harmonised Art. 33 GDPR breach-notification template — 120-field structured form, consultation open to 5 August 2026"
    sources:
      - { url: "https://www.edpb.europa.eu/news/news/2026/edpb-meets-eu-commissioner-mcgrath-and-adopts-common-data-breach-notification_en", publisher: "EDPB", date: "2026-06-10", role: "primary" }
      - { url: "https://privacymatters.dlapiper.com/2026/06/eu-edpb-common-template-for-breach-notifications-welcome-alignment-or-further-complexity/", publisher: "DLA Piper Privacy Matters", date: "2026-06-10", role: "corroborating" }
      - { url: "https://www.lexisnexis.com/en-gb/legal/news/edpb-adopts-standardised-data-breach-notification-template", publisher: "LexisNexis", date: "2026-06-10", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch ('EDPB Article 33 breach notification template consultation June 2026') → primary: EDPB news item, URL https://www.edpb.europa.eu/news/news/2026/edpb-meets-eu-commissioner-mcgrath-and-adopts-common-data-breach-notification_en → corroborating: DLA Piper / LexisNexis analysis"
    summary: |
      The EDPB adopted a draft common personal data breach notification template during its June 2026 plenary
      (announced 10 June 2026) and opened a public consultation running until 5 August 2026. The template
      is a structured form of approximately 120 numbered fields across seven sections with predefined answer
      sets, conditional logic, and tooltips, designed to implement Article 33 GDPR notification requirements
      in a machine-readable, consistent format across all EU DPAs. Its purpose is to reduce the current
      patchwork where each national DPA has its own notification form — organisations currently operating
      multi-jurisdiction programmes must navigate at least 27 different formats. After 5 August 2026 the
      EDPB will publish a timeline for mandatory adoption by all DPAs; that is the date at which the template
      transitions from a consultation artefact to the mandatory channel. Swiss organisations covered by the
      nFADP face no formal EDPB obligation but will need aligned notification preparation for any EU-nexus
      incidents notifiable to EU DPAs. The EDPB meeting also included discussions with EU Commissioner
      McGrath on the broader data-governance landscape.
    ch_eu_nexus: "EU-wide mandatory once adopted; Swiss organisations with EU data-processing nexus affected"
    public_sector_nexus: "direct — all public bodies processing personal data are Article 33 obligors"
    sector: "cross-sector, government, healthcare, finance"
    cves: []
    actors_campaigns_malware: []
    verification: SINGLE-SOURCE-NATIONAL-CERT
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "The template will help ensure that notifications contain the information required by Art. 33 GDPR, making it easier for organisations to submit a timely notification and facilitating the assessment of the case by the responsible DPAs"
        attribution: "EDPB"
        source_url: "https://www.edpb.europa.eu/news/news/2026/edpb-meets-eu-commissioner-mcgrath-and-adopts-common-data-breach-notification_en"
    extended_notes: |
      Consultation closes 5 August 2026. Once final and adopted by all 27 DPAs, organisations with
      cross-border incidents will be able to notify through a single standardised process. Detection-engineering
      relevance: teams that currently maintain incident-response playbooks with per-country DPA reporting paths
      should begin modelling consolidation around this template's seven sections.

  - title: "DORA Year 1: ESAs publish first annual ICT-incidents report — 3,383 major incidents, one-third cross-border, 90% non-cybersecurity root cause"
    sources:
      - { url: "https://www.eba.europa.eu/publications-and-media/press-releases/esas-publish-first-report-dora-major-ict-related-incidents", publisher: "EBA (joint ESA press release)", date: "2026-06-03", role: "primary" }
      - { url: "https://www.eiopa.europa.eu/esas-publish-first-report-dora-major-ict-related-incidents-2026-06-03_en", publisher: "EIOPA", date: "2026-06-03", role: "primary" }
    discovery_trace: "first seen at: WebSearch ('DORA financial sector ICT incident reporting deadline June 2026 EBA EIOPA ESMA') → primary: EIOPA press-release URL https://www.eiopa.europa.eu/esas-publish-first-report-dora-major-ict-related-incidents-2026-06-03_en + EBA mirror URL https://www.eba.europa.eu/publications-and-media/press-releases/esas-publish-first-report-dora-major-ict-related-incidents"
    summary: |
      EBA, EIOPA and ESMA jointly published their first annual overview of major ICT-related incidents
      reported under DORA, based on incidents from calendar year 2025 (published 3 June 2026). The headline
      figures: 3,383 major ICT incidents across all EU financial sectors, averaging 0.18 incidents per entity
      subject to DORA; the credit and payments sectors dominate volume. Two-thirds of incidents caused no
      or minor client disruption, indicating generally effective detection and response. Approximately one-third
      of major incidents traced back to third-party ICT providers or other financial entities — underlining
      the supply-chain and concentration-risk lens DORA was designed to address. Cybersecurity incidents
      constitute only 10% of the total; system failures and external operational events dominate, though the
      ESAs specifically flag AI-driven attack tooling as an emerging multiplier that could shift this baseline
      rapidly. The ESAs recommend that financial entities strengthen cybersecurity measures in response to
      the evolution of highly capable AI-driven tools. For Swiss financial institutions under FINMA's supervisory
      ambit, the ESA report provides a benchmark for what constitutes a European peer's incident profile
      under comparable operational-resilience requirements.
    ch_eu_nexus: "EU financial sector; directly relevant to Swiss financial entities with EU-passporting operations under FINMA supervision"
    public_sector_nexus: "indirect — cantonal and federal financial entities / payment infrastructure"
    sector: "finance, insurance, capital markets"
