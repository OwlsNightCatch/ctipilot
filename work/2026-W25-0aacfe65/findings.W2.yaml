    summary: |
      NCSC-CH's Week 24 Wochenrückblick (published 16 June 2026) highlighted a novel hybrid social-engineering
      variant active in French-speaking Switzerland: attackers distribute fake Swiss Post 'Avis de passage'
      (collection notice) physical letters in postal boxes, printed to closely mimic official Swiss Post
      branding, containing a QR code. Scanning the QR code leads to a phishing site collecting personal
      identity data and credit-card credentials — blending physical-layer delivery with digital credential
      harvesting. The NCSC also noted parallel phishing targeting the Swiss e-vignette motorway scheme via
      email. Both campaigns target credentials and payment card data rather than enterprise network access.
      From a defender and SOC vantage, this is a T1598.003 Phishing for Information / T1192 Spearphishing
      Link variant with unusual physical-layer delivery; the Swiss Post brand is frequently abused and
      organisations in French-speaking cantons should brief staff on the physical-QR vector. The second
      phishing variant (e-vignette deactivation email) is a classic credential-phish targeting FEDRO-adjacent
      infrastructure that could also target organisational vehicles/fleet managers.
