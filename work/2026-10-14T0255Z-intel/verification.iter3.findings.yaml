- code: F4
  category: hallucinated-fact
  section: run-record
  item: "runs/2026-10-14/2026-10-14T0255Z-intel.md (Published bullet for the Ivanti entry, and 'Contradictions and discrepancies carried in the entries' item 1)"
  url_or_quote: "\"the Canadian bulletin's different 25.x line label is carried as a stated discrepancy\" and \"(1) Ivanti: the Canadian Centre for Cyber Security lists the 25.x affected line as 25.2.2 and prior, Rapid7's table of Ivanti's advisory says 25.1.2.2 and prior\""
  summary: "The run notes say the Ivanti entry carries the CCCS-versus-Rapid7 affected-line discrepancy, but the iteration-2 remediation dropped that clause from the sourcing note and the entry now contains no 'Canadian', 'CCCS' or '25.2.2' anywhere (grep of the entry returns nothing). CCCS AV26-1035 does list 'Version 25.2.2 and prior' next to 'Version 25.1.1.1 and prior' and 'Version 22.8R2.4 and prior'. Same defect class as iteration 2's run-note finding. Fix: either restore the discrepancy in the entry (add the CCCS bulletin to sources[] with a one-sentence sourcing_note stating that CCCS lists 25.2.2 where Rapid7's table of Ivanti's advisory lists 25.1.2.2, and that Ivanti's own advisory could not be read) or correct both run-note sentences. Restoring it is preferable, because the affected-build table is the fact a defender acts on."
- code: F14
  category: quantifier-without-source
  section: incident
  item: "2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack (Update section 2026-10-14T03:44:00Z; same claim in the Exposure line)"
  url_or_quote: "Update section: \"No source reports a Swiss deployment.\"  Exposure line: \"no source names a Swiss deployment, so ask whoever manages your refrigeration and building services whether a controller sits in your estate.\""
  summary: "Blick (Swiss daily, 2026-10-13, https://www.blick.ch/fr/suisse/cyberattaque-les-frigos-de-migros-et-coop-sont-ils-proteges/79vpc6q) reports: 'L'entreprise [Migros] confirme toutefois utiliser, «dans un nombre limité de magasins», les mêmes systèmes de réfrigération Danfoss que ceux ciblés par l'attaque', while saying nothing indicates Swiss stores were targeted; Coop says it was not affected and will not say whether it uses Danfoss; Aldi and Lidl say they are not concerned (German Blick piece 2026-10-13: Migros, Coop, Denner, Lidl say not affected). So a source does report a Swiss deployment of the targeted Danfoss systems, and the run itself added blick-ch as a source for exactly this Swiss-retailer response. The absolute 'No source' is false for a Swiss-focused brief. Fix: replace both sentences with what Blick says (Migros uses the same Danfoss systems in a limited number of stores and sees no sign Swiss stores were targeted; Coop, Aldi and Lidl say not affected; no source reports a Swiss victim) and cite Blick; keep the ask-your-contractor advice."
- code: F4
  category: hallucinated-fact
  section: incident
  item: "2026-10-14/tangerhuette-digitales-rathaus-zero-day-municipal-portal (summary; same wording in the registry summary of incident:tangerhuette-digitales-rathaus-zero-day-2026-09)"
  url_or_quote: "\"Innocon, the Tangermünde developer of the \\\"digitales Rathaus\\\" citizen portal, told MDR on 2026-10-13 that attackers found and exploited a vulnerability it did not know of\""
  summary: "(low confidence) The MDR AKTUELL article (datePublished 2026-10-13T03:00Z, i.e. 05:00 local) dates only its own publication; it does not say when Hagen Woecht spoke to MDR, so the day of the statement is not in the source and, given the 05:00 publication time, is probably earlier. Same class as iteration 2's GitLab finding ('reproduced it on 2026-10-13'). Fix: 'MDR reported on 2026-10-13 that Innocon says ...' (the body already words it this way: 'MDR AKTUELL reports on 2026-10-13 that the vendor ... says'); apply the same wording to the registry summary."
- code: F3
  category: claim-not-supported
  section: vulnerability
  item: "2026-10-13/cve-2026-97229-gitlab-ci-regex-compiler-unauthenticated-rce (body, Defender takeaway)"
  url_or_quote: "\"GitLab's release page lists no workaround as of 2026-10-13, Rapid7's interim controls (restrict anonymous access to public projects and stop untrusted users creating or writing to public projects) close only the delivery path it demonstrated ([Rapid7, 2026-10-13](https://www.rapid7.com/blog/post/etr-cve-2026-97229-critical-unauthenticated-remote-code-execution-in-gitlab))\""
  summary: "(low confidence) The citation terminates a clause that opens with a statement about GitLab's release page. The Rapid7 post carries the second half ('These controls address only the demonstrated delivery path and do not remediate the vulnerable regular expression compiler') but says nothing about GitLab's page listing no workaround; it only says 'For the latest mitigation guidance, please refer to GitLab's security advisory.' The absence itself is true (the GitLab 19.4.2 page has no workaround text, read this pass), and in the committed version the claim was closed by a GitLab citation; this run's restructuring of the sentence moved it under the Rapid7 link. Fix: cite the GitLab 19.4.2 page directly after 'no workaround as of 2026-10-13'."
