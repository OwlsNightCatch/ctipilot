  item: "2026-10-13/cve-2026-97229-gitlab-ci-regex-compiler-unauthenticated-rce (low confidence)"
  url_or_quote: "cves[CVE-2026-97229]: auth: pre-auth, vector: zero-click; tags: [..., pre-auth, ...]"
