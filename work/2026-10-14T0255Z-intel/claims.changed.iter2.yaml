  - claim_id: 02c6693bee
    entry: 2026-10-14/cve-2026-96951-windows-shell-motw-bypass-zero-day-kev
    surface: "summary"
    kind: frontmatter
    text: "Microsoft's 2026-10-13 updates fix CVE-2026-96951, a Windows Shell flaw that lets an attacker evade Mark of the Web defenses once a user opens a crafted file or link sent by email or instant message, so the SmartScreen and warning dialogs the tag triggers do not appear. Microsoft marks it exploited and CISA added it to KEV the same day; no source names the actor, the payload or the victims. Rapid7 says Windows Server 2012 gets no patch, while Server 2012 R2 and every later supported release does."
  - claim_id: c67806ea73
    entry: 2026-10-14/cve-2026-96951-windows-shell-motw-bypass-zero-day-kev
    surface: "actions[0]"
    kind: frontmatter
    text: "Deploy the 2026-10-13 cumulative update for each release (KB5127648 for Windows 11 24H2 to 26H2, KB5126657 for Windows 10 21H2 and 22H2, KB5126655 for Server 2022, KB5126646 for Server 2025, and the others listed in the CVE record) to every Windows endpoint and server, starting with the systems whose users open mail and chat attachments or download files; Rapid7 says Windows Server 2012 receives no patch."
