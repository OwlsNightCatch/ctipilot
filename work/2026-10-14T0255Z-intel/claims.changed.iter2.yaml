    text: "Adobe's 2026-10-13 bulletins fix five unauthenticated network flaws at CVSS 9.0 to 10.0 in ColdFusion 2025 and 2023 (fixed in 2025.0.14 and 2023.0.26), three unauthenticated CVSS 10.0 code-execution flaws in Experience Manager (Cloud Service 2026.9.28386 or per-issue hotfixes) and two code-execution flaws (CVSS 10.0 and 9.8) in Adobe Commerce and Magento Open Source (2026-oct builds). Adobe says it knows of no exploitation of any of them; each needs no account, so exposure rather than exploitation status decides the order."
