  - claim_id: 54b88c08e3
    entry: 2026-10-14/cve-2026-104935-ivanti-connect-secure-zero-day-chain-kev
    surface: "summary"
    kind: frontmatter
    text: "Ivanti disclosed CVE-2026-104935 on 2026-10-13, an authentication bypass in Connect Secure that lets a remote unauthenticated attacker run commands, and says it is aware of limited exploitation; CISA listed it in KEV the same day. Volexity found a cluster it calls UTA0576 chaining it with a root escalation that Ivanti has not yet fixed, patching library code in memory only so Ivanti's Integrity Checker Tool sees no file change, and going after the appliance's Active Directory service account, LAPS passwords and BitLocker recovery keys. Fixed builds are 25.1.1.2, 25.1.3.0 and 25.1.3.1, and 22.8R2.5; a patched appliance that was exposed still needs a compromise check."
  - claim_id: 2f60c162f6
    entry: 2026-10-14/cve-2026-104935-ivanti-connect-secure-zero-day-chain-kev
    surface: "actions[1]"
    kind: frontmatter
    text: "Run a compromise check on every appliance that was reachable on an affected build, starting with proxy, load balancer or WAF logs back to at least 2026-10-03 for welcome.cgi requests that carry an X-DSCGI-PATH header; where compromise cannot be excluded, follow Ivanti's recovery steps and then reset the domain service account, LAPS and local passwords, certificates and API keys the appliance held."
  - claim_id: db17788cef
    entry: 2026-10-14/cve-2026-104935-ivanti-connect-secure-zero-day-chain-kev
    surface: "body"
    kind: cited
    text: "CISA says version 22.8 reaches end of life on 2027-01-31, so plan the move off it ("
    urls: ["https://www.cisa.gov/news-events/alerts/2026/10/13/cisa-urges-patching-newly-exploited-vulnerability-ivanti-connect-secure"]
  - claim_id: 10072cc448
    entry: 2026-10-14/cve-2026-104935-ivanti-connect-secure-zero-day-chain-kev
    surface: "body"
    kind: derived
    text: "Volexity names a hidden directory under the appliance's `/data` partition holding a renamed capture binary, and post-exploitation files in `/tmp`, says a clean Integrity Checker result does not show the appliance is safe, and advises network and memory forensics; patching does not evict an attacker who is already in."
  - claim_id: 61294089cd
