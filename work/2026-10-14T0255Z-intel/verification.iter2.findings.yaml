  item: "2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack"
  url_or_quote: "CERT-FR's sequence is to remove the internet exposure, factory-reset the unit, restore access only through a secure VPN or protected network, reconfigure it ..."
  summary: "two cited sources disagree on what CERT-FR advises and the entry silently follows one. NCSC advisory 13054 (cited, 2026-10-13) lists under Temporary: 'Disconnect controllers from the internet or tightly filter access to trusted IPs or a VPN' and 'CERT-FR advises these steps in order: 1. Limit access to trusted IP and service providers only. 2. Perform a factory reset. 3. Apply all available fixes. 4. Rotate passwords and other secrets. 5. Review existing accounts. 6. Fully reconfigure the device.' The revised CERT-FR page (revision history '13 octobre 2026 Ajout d'autres equipements cibles') puts removal of internet exposure first, treats source-IP filtering as 'Dans l'urgence ... pas perenne', and has no rotate-secrets or review-accounts step. The sourcing_note's 'NCSC Switzerland's advisory relays it' is therefore inaccurate for the revised text. A Swiss reader following NCSC.ch gets different first steps; add a 'Contradiction:' line naming both."
