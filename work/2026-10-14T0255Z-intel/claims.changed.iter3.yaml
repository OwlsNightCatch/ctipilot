  - claim_id: cea7828dd1
    entry: 2026-10-13/cve-2026-97229-gitlab-ci-regex-compiler-unauthenticated-rce
    surface: "summary"
    kind: frontmatter
    text: "GitLab's critical patch release of 2026-10-12 fixes CVE-2026-97229 (CVSS 3.1 10.0), an integer overflow in the CI/CD regular-expression compiler that lets code run on the server as the git user through a crafted expression in a CI/CD configuration; Rapid7 reported on 2026-10-13 that it reproduced it on 19.4.1 and published a proof of concept, and reports no confirmed exploitation in the wild. The demonstrated path needs push access to a public project (an ordinary account where users may create public projects), followed by a request to the CI lint API that carries no credentials. Self-managed CE and EE from 19.2 before 19.2.8, 19.3 before 19.3.5 and 19.4 before 19.4.2 are affected, and NCSC Switzerland and CERT-EU both published advisories on 2026-10-12."
  - claim_id: baa6c7a4a9
    entry: 2026-10-13/cve-2026-97229-gitlab-ci-regex-compiler-unauthenticated-rce
    surface: "record 2026-10-14T03:43:00Z"
    kind: record-summary
    text: "Rapid7 reported on 2026-10-13 that it reproduced arbitrary code execution on GitLab CE 19.4.1, published a proof of concept, and found no confirmed exploitation in the wild. The demonstrated path needs push access to a public project and then an unauthenticated CI lint request, so instances with open sign-up or public projects that untrusted users can write to are the exposed case."
  - claim_id: 6d5820cc4e
    entry: 2026-10-14/cve-2026-96951-windows-shell-motw-bypass-zero-day-kev
    surface: "summary"
    kind: frontmatter
    text: "Microsoft's 2026-10-13 updates fix CVE-2026-96951, a Windows Shell flaw that lets an attacker evade Mark of the Web defenses once a user opens a crafted file or link sent by email or instant message, so Windows does not show the dialog the tag normally triggers. Microsoft marks it exploited and CISA added it to KEV the same day; no source names the actor, the payload or the victims. Rapid7 says Windows Server 2012 gets no patch, while Microsoft lists fixes for Server 2012 R2 and every later supported release."
  - claim_id: 6c77039ac2
    entry: 2026-10-14/cve-2026-96951-windows-shell-motw-bypass-zero-day-kev
