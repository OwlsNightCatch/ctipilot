  - claim_id: 90f33a1eb5
    entry: 2026-10-13/cve-2026-97229-gitlab-ci-regex-compiler-unauthenticated-rce
    surface: "summary"
    kind: frontmatter
    text: "GitLab's critical patch release of 2026-10-12 fixes CVE-2026-97229 (CVSS 3.1 10.0), an integer overflow in the CI/CD regular-expression compiler that lets code run on the server as the git user through a crafted expression in a CI/CD configuration; Rapid7 reproduced it on 19.4.1 on 2026-10-13, published a proof of concept, and reports no confirmed exploitation in the wild. The demonstrated path needs push access to a public project (an ordinary account where users may create public projects), followed by a request to the CI lint API that carries no credentials. Self-managed CE and EE from 19.2 before 19.2.8, 19.3 before 19.3.5 and 19.4 before 19.4.2 are affected, and NCSC Switzerland and CERT-EU both published advisories on 2026-10-12."
