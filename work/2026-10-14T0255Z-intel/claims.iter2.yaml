  - claim_id: 02426329cf
    entry: 2026-10-14/tangerhuette-digitales-rathaus-zero-day-municipal-portal
    surface: "headline"
    kind: frontmatter
    text: "German portal vendor reports an exploited zero-day with no patch; it calls the intrusion AI-driven, police are undecided"
  - claim_id: f07cb18881
    entry: 2026-10-14/tangerhuette-digitales-rathaus-zero-day-municipal-portal
    surface: "summary"
    kind: frontmatter
    text: "Innocon, the Tangermünde developer of the \"digitales Rathaus\" citizen portal, told MDR on 2026-10-13 that attackers found and exploited a vulnerability it did not know of in its software, run for Tangerhütte on systems of the state municipal IT provider KID; the portal was taken offline in September and four more communes pulled theirs as a precaution. Innocon says the attackers reached only test accounts and took no real data, and classifies the intrusion as AI-driven because of command speed and on-host tool development, which is the vendor's reading: the state criminal police can neither confirm nor deny it. No CVE, product version or fix is named."
  - claim_id: 9b2b64fbea
    entry: 2026-10-14/tangerhuette-digitales-rathaus-zero-day-municipal-portal
    surface: "body"
    kind: cited
    text: "MDR AKTUELL reports on 2026-10-13 that the vendor of Tangerhütte's \"digitales Rathaus\" citizen portal says attackers found and exploited a vulnerability in its software that the vendor did not know of and for which no security update existed ("
    urls: ["https://www.mdr.de/nachrichten/deutschland/politik/hacker-in-sachsen-anhalt-offenbar-erster,ki-angriff-100.html"]
  - claim_id: 3f9f6d60c1
    entry: 2026-10-14/tangerhuette-digitales-rathaus-zero-day-municipal-portal
    surface: "body"
    kind: cited
    text: "The portal, an app-based service that went online in 2020, was taken offline in September, and the municipality said on 2026-09-16 that it had repelled an attack and gave no technical detail ("
    urls: ["https://www.mdr.de/nachrichten/sachsen-anhalt/stendal/stendal/digitales-rathaus-cyber-sicherheit-hacker-,tangerhuette-it-angriff-100.html"]
  - claim_id: 5d1c66cd58
    entry: 2026-10-14/tangerhuette-digitales-rathaus-zero-day-municipal-portal
    surface: "body"
    kind: cited
    text: "The software runs on systems that the state municipal IT provider KID operates for Tangerhütte; an IT employee noticed irregularities in the morning after the attack began at night, the server was isolated and cut from the internet, and the vendor analysed the secured logs on an offline notebook ("
    urls: ["https://www.mdr.de/nachrichten/deutschland/politik/hacker-in-sachsen-anhalt-offenbar-erster,ki-angriff-100.html"]
  - claim_id: 1f98d3be0c
    entry: 2026-10-14/tangerhuette-digitales-rathaus-zero-day-municipal-portal
    surface: "body"
    kind: cited
    text: "Innocon told other affected communes, four of which also took their portals offline as a precaution although there was no sign of an attack on them, and says the attackers reached only test accounts and took no real data ("
    urls: ["https://www.mdr.de/nachrichten/deutschland/politik/hacker-in-sachsen-anhalt-offenbar-erster,ki-angriff-100.html"]
  - claim_id: 9c02235d3f
    entry: 2026-10-14/tangerhuette-digitales-rathaus-zero-day-municipal-portal
    surface: "body"
    kind: cited
    text: "Citizens could use the services only on paper for weeks ("
    urls: ["https://www.mdr.de/nachrichten/deutschland/politik/hacker-in-sachsen-anhalt-offenbar-erster,ki-angriff-100.html"]
  - claim_id: fd8cc60ae5
    entry: 2026-10-14/tangerhuette-digitales-rathaus-zero-day-municipal-portal
    surface: "body"
    kind: cited
    text: "The vendor classifies the intrusion as AI-driven for two reasons: commands were executed faster than copy-and-paste would allow, and the follow-on steps were not prepared in advance but developed on the city's server during the attack, whereas human attackers normally upload their own code and do not change it ("
    urls: ["https://www.mdr.de/nachrichten/deutschland/politik/hacker-in-sachsen-anhalt-offenbar-erster,ki-angriff-100.html"]
  - claim_id: 361e57d49d
    entry: 2026-10-14/tangerhuette-digitales-rathaus-zero-day-municipal-portal
    surface: "body"
    kind: cited
    text: "The state criminal police are investigating data espionage and can neither confirm nor deny an AI attack, and two professors told MDR the reading is plausible without having seen the logs ("
    urls: ["https://www.mdr.de/nachrichten/deutschland/politik/hacker-in-sachsen-anhalt-offenbar-erster,ki-angriff-100.html"]
  - claim_id: 08d0efb409
    entry: 2026-10-14/tangerhuette-digitales-rathaus-zero-day-municipal-portal
    surface: "body"
    kind: uncited
    text: "That is the vendor's reading of its own logs."
  - claim_id: 3c299567a9
    entry: 2026-10-14/tangerhuette-digitales-rathaus-zero-day-municipal-portal
    surface: "body"
    kind: uncited
    text: "No CVE, product version, fixed release or entry vector is named."
  - claim_id: 9da85482c3
    entry: 2026-10-14/tangerhuette-digitales-rathaus-zero-day-municipal-portal
    surface: "body"
    kind: derived
    text: "**Exposure:** municipalities running Innocon's digitales Rathaus, which is used for Tangerhütte and at least four further communes that Innocon informed; whether any Swiss body runs it is not reported."
  - claim_id: 17fcdc3cfe
    entry: 2026-10-14/tangerhuette-digitales-rathaus-zero-day-municipal-portal
    surface: "body"
    kind: derived
    text: "The case matters to communal administrations as a supplier-built citizen portal hosted by a shared municipal IT provider, where the customer cannot patch an unknown flaw itself."
  - claim_id: 77b76fffeb
    entry: 2026-10-14/tangerhuette-digitales-rathaus-zero-day-municipal-portal
    surface: "body"
    kind: derived
    text: "**Detection:** the vendor's two observations are the pattern to look for in a portal host's logs: commands issued faster than a person could type them, and follow-on scripts written and run on the host within the same session rather than uploaded once."
  - claim_id: 6e85c9b0bd
    entry: 2026-10-14/tangerhuette-digitales-rathaus-zero-day-municipal-portal
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** for a citizen portal built on a supplier's software, an exploited unknown flaw leaves isolation as the only lever, and this case shows what worked: isolate the server, copy the logs and analyse them offline, and have the supplier warn its other customers, four of which pulled their portals as a precaution."
