    entry: 2026-08-28/claroty-copeland-xweb-pro-refrigeration-unauth-root-rce
    surface: "body"
    kind: cited
    text: "); no source read reports exploitation of these flaws in the wild, but CERT-FR's alert of 2026-10-13 reports numerous compromises of Copeland xweb controllers without naming models, flaws or the entry vector ("
    urls: ["https://www.cert.ssi.gouv.fr/alerte/CERTFR-2026-ALE-012/"]
  - claim_id: 7da5a365a8
    entry: 2026-08-28/claroty-copeland-xweb-pro-refrigeration-unauth-root-rce
    surface: "body"
    kind: uncited
    text: "Claroty Team82 disclosed 23 vulnerabilities (21 rated high) in Copeland XWEB300D/500D/500B PRO supervisory refrigeration controllers (firmware ≤1.12.1), which manage field devices such as the XR60CX controller over Modbus RS-485 and Ethernet in commercial refrigeration and cold-chain deployments."
  - claim_id: a7486468ac
    entry: 2026-08-28/claroty-copeland-xweb-pro-refrigeration-unauth-root-rce
    surface: "body"
    kind: uncited
    text: "Two named flaws chain to unauthenticated root RCE."
  - claim_id: 40bb861dc1
    entry: 2026-08-28/claroty-copeland-xweb-pro-refrigeration-unauth-root-rce
    surface: "body"
    kind: uncited
    text: "CVE-2026-25085 is a logic flaw in the Lua `user_authenticate` handler: when an attacker supplies an unrecognized `auth_mode` value in the HTTP `Authorization: Basic` header, the function does not return `nil`/`false` but an unpopulated yet \"truthy\" table — \"if an attacker supplied an unrecognized auth_mode, the user_authenticate function did not explicitly reject the request by returning nil or false."
  - claim_id: 5eb0030181
    entry: 2026-08-28/claroty-copeland-xweb-pro-refrigeration-unauth-root-rce
    surface: "body"
    kind: uncited
    text: "A third pre-auth path, CVE-2026-24663 (CVSS 9.0), is an unauthenticated OS command injection reachable by sending a crafted request to the libraries installation route, with no authentication step to bypass at all."
  - claim_id: 2a5d2c8728
    entry: 2026-08-28/claroty-copeland-xweb-pro-refrigeration-unauth-root-rce
    surface: "body"
    kind: uncited
    text: "The 17 further CVEs (all listed above) are individually documented OS command-injection flaws across API/CGI endpoints (contacts import, firmware update, device templates, network/Wi-Fi configuration, the Modbus debug tool, and others), each requiring prior authentication and each scored CVSS 8.0."
  - claim_id: 21fd92705e
    entry: 2026-08-28/claroty-copeland-xweb-pro-refrigeration-unauth-root-rce
    surface: "body"
    kind: uncited
    text: "Claroty built a live physical demonstration: from an internet-exposed XWEB controller, an attacker reverse-engineers the connected field controller's undocumented Modbus register map and can set the temperature shown on the XR60CX display to any value while silently disabling cooling — spoiled food, or compromised temperature-sensitive medical supplies for pharmaceutical cold-chain."
  - claim_id: cc088b326b
    entry: 2026-08-28/claroty-copeland-xweb-pro-refrigeration-unauth-root-rce
    surface: "body"
    kind: uncited
    text: "Copeland shipped firmware v1.13 through coordinated disclosure, fixing all 23 issues: \"Copeland worked closely and collaboratively with us to develop a comprehensive remediation strategy."
  - claim_id: 220cce0506
    entry: 2026-08-28/claroty-copeland-xweb-pro-refrigeration-unauth-root-rce
    surface: "body"
    kind: uncited
    text: "An anonymous, single-request path to full administrative control of internet-exposed cold-chain infrastructure demands action beyond a routine patch cycle, independent of confirmed exploitation: absence of exploitation is not evidence of safety when the exploit is a MAC address."
  - claim_id: 1ccb1083cc
    entry: 2026-08-28/claroty-copeland-xweb-pro-refrigeration-unauth-root-rce
    surface: "body"
    kind: uncited
    text: "Internet-exposed commercial refrigeration and cold-storage deployments are directly relevant to healthcare and food-safety cold-chain operations."
  - claim_id: 353b363945
    entry: 2026-08-28/claroty-copeland-xweb-pro-refrigeration-unauth-root-rce
    surface: "body"
    kind: uncited
    text: "**Triage:** the falsified display is itself the detection challenge: Claroty shows the temperature on the XR60CX field controller's display can be set to any value, so a normal reading on the display does not show that cooling is running; any authentication attempt using an `auth_mode` value the deployment does not use is a probe worth alerting on."
  - claim_id: 969a545971
