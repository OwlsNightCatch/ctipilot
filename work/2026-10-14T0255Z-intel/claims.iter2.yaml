    surface: "body"
    kind: derived
    text: "**Exposure:** Windows 10, Windows 11 and Windows Server 2012 R2 through 2025 where users open files or links from mail, chat or the web; the fixed build per release is in the CVE record, and Rapid7 reports no patch for Windows Server 2012."
  - claim_id: 2038af7c1e
    entry: 2026-10-14/cve-2026-96951-windows-shell-motw-bypass-zero-day-kev
    surface: "body"
    kind: derived
    text: "**Detection:** Microsoft, CISA and Rapid7 name no actor, payload or victims and no source describes the exploit's behavior, so this is a hunt hypothesis that follows from the mechanism: the failed control is the Mark of the Web tag, so there is no warning dialog for a user to report."
  - claim_id: f2f1ea2b85
    entry: 2026-10-14/cve-2026-96951-windows-shell-motw-bypass-zero-day-kev
    surface: "body"
    kind: derived
    text: "Look at mail gateway, chat and endpoint file-origin telemetry for internet-origin files, archives and shortcuts that execute without the usual SmartScreen evaluation, and at process lineage from `explorer.exe` into scripting interpreters and living-off-the-land binaries shortly after a mail or browser download."
  - claim_id: 7101ecf5c5
    entry: 2026-10-14/cve-2026-96951-windows-shell-motw-bypass-zero-day-kev
    surface: "body"
    kind: derived
    text: "**Triage:** a file a user created or received from a trusted local source also carries no tag; the discriminator is an internet origin (mail, chat or web download) together with the absence of the tag on the opened item."
  - claim_id: 593969417f
    entry: 2026-10-14/cve-2026-96951-windows-shell-motw-bypass-zero-day-kev
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** install the October cumulative update now, ahead of the monthly cycle, on endpoints that open mail and web downloads first; because the tag is the control that failed, attachment blocking and mail-gateway detonation remain the compensating layer until the update is deployed, and Rapid7 reports no patch for Windows Server 2012."
  - claim_id: de239e471f
