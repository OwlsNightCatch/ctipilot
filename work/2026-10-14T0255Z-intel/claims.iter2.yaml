    entry: 2026-10-14/exchange-oct-2026-su-cve-2026-70571-last-2016-2019-update
    surface: "summary"
    kind: frontmatter
    text: "Microsoft's 2026-10-13 Exchange security updates fix CVE-2026-70571, a stack-based buffer overflow that an unauthenticated attacker can trigger with a crafted email (Critical, CVSS 8.1 with high attack complexity, Exploitation More Likely, not exploited), and CVE-2026-70279, a 9.3 cross-site scripting flaw that lets an attacker act as an administrator who clicks a crafted link. October is the last month Exchange 2016 and 2019 customers enrolled in the Period 2 ESU receive newly released updates, and organisations without ESU have no 2016 or 2019 update at all."
