  - claim_id: 1f93d4e994
    entry: 2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack
    surface: "summary"
    kind: frontmatter
    text: "Coopérative U, Intermarché and E. Leclerc confirmed to AFP a cyberattack on their refrigeration systems overnight on 11 to 12 October 2026, which BFMTV reports as a remotely forced defrost at hundreds of stores. CERT-FR's alert, revised on 2026-10-13, reports numerous compromises of Danfoss AK-SM and AK-SC controllers and now also of Copeland xweb and Dixell xweb, says campaigns are probably still running and that a factory reset alone does not protect an unpatched end-of-life unit, and NCSC Switzerland rates the activity actively exploited. Danfoss says most affected units are legacy products or current AK-SM800A units on outdated firmware; no source names an actor, the flaw or how the attackers got in, and the Paris prosecutor is investigating."
  - claim_id: b9bb8b4571
    entry: 2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack
    surface: "actions[0]"
    kind: frontmatter
    text: "Find every Danfoss AK-SM and AK-SC, Copeland xweb and Dixell xweb refrigeration controller in facilities you own or that a contractor manages for you and take its management interface off the internet now, restoring access only through a secure VPN or protected network (filtering to the contractor's source addresses is an emergency stop-gap); an end-of-life unit that gets no fixes needs replacing, because a factory reset leaves it vulnerable and probably compromised again."
