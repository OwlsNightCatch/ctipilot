    text: "The upload script `wu.cgi` writes a file to disk before checking that it is a ZIP, and parallel requests run a Perl script before it is deleted."
  - claim_id: a04bd97921
    entry: 2026-10-14/cve-2026-104935-ivanti-connect-secure-zero-day-chain-kev
    surface: "body"
    kind: derived
    text: "**Detection:** The appliance's own logs were tampered with, so start upstream: web proxy, load balancer or WAF logs for many requests to `welcome.cgi`, above all with an `X-DSCGI-PATH` header, since the login page itself is ordinary and the signal is that header, or one whose script differs from the URL path."
  - claim_id: 6d0c86aa1d
    entry: 2026-10-14/cve-2026-104935-ivanti-connect-secure-zero-day-chain-kev
    surface: "body"
    kind: derived
    text: "On domain controllers, look for LDAP queries from the appliance's service account for LAPS, BitLocker recovery and password-bearing attributes, Kerberos activity and spraying from the appliance's address."
  - claim_id: 10072cc448
    entry: 2026-10-14/cve-2026-104935-ivanti-connect-secure-zero-day-chain-kev
    surface: "body"
    kind: derived
    text: "Volexity names a hidden directory under the appliance's `/data` partition holding a renamed capture binary, and post-exploitation files in `/tmp`, says a clean Integrity Checker result does not show the appliance is safe, and advises network and memory forensics; patching does not evict an attacker who is already in."
  - claim_id: a5679ae91d
    entry: 2026-10-14/cve-2026-104935-ivanti-connect-secure-zero-day-chain-kev
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** Upgrade now rather than in the next cycle, then treat every appliance that was exposed on an affected build as a compromise-assessment target and rotate what it could reach, because the root-escalation step stays unfixed and the Integrity Checker cannot clear it."
  - claim_id: 61294089cd
    entry: 2026-10-14/cve-2026-96951-windows-shell-motw-bypass-zero-day-kev
    surface: "headline"
    kind: frontmatter
    text: "Microsoft patches an exploited Windows Shell zero-day that evades Mark of the Web protections on files and links"
  - claim_id: 02c6693bee
    entry: 2026-10-14/cve-2026-96951-windows-shell-motw-bypass-zero-day-kev
    surface: "summary"
    kind: frontmatter
    text: "Microsoft's 2026-10-13 updates fix CVE-2026-96951, a Windows Shell flaw that lets an attacker evade Mark of the Web defenses once a user opens a crafted file or link sent by email or instant message, so the SmartScreen and warning dialogs the tag triggers do not appear. Microsoft marks it exploited and CISA added it to KEV the same day; no source names the actor, the payload or the victims. Rapid7 says Windows Server 2012 gets no patch, while Server 2012 R2 and every later supported release does."
  - claim_id: c67806ea73
    entry: 2026-10-14/cve-2026-96951-windows-shell-motw-bypass-zero-day-kev
    surface: "actions[0]"
    kind: frontmatter
    text: "Deploy the 2026-10-13 cumulative update for each release (KB5127648 for Windows 11 24H2 to 26H2, KB5126657 for Windows 10 21H2 and 22H2, KB5126655 for Server 2022, KB5126646 for Server 2025, and the others listed in the CVE record) to every Windows endpoint and server, starting with the systems whose users open mail and chat attachments or download files; Rapid7 says Windows Server 2012 receives no patch."
