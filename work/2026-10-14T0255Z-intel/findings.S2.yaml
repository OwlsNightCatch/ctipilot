  - title: "Stadt Olten (SO) warns of forged QR-code stickers on municipal parking meters that redirect to payment-data phishing sites; city has started criminal proceedings"
    sources:
      - { url: "https://www.olten.ch/aktuellesinformationen/3010357", publisher: "Stadt Olten (Medienmitteilung)", date: "2026-10-13", role: "primary" }
      - { url: "https://www.swissinfo.ch/ger/olten-warnt-vor-falschen-qr-codes-an-parkuhren/92210843", publisher: "SWI swissinfo.ch (Keystone-SDA)", date: "2026-10-13", role: "corroborating" }
    discovery_trace: "first seen at: swissinfo-ger, `url https://www.swissinfo.ch/ger/` homepage article list -> https://www.swissinfo.ch/ger/olten-warnt-vor-falschen-qr-codes-an-parkuhren/92210843 (Keystone-SDA) -> WebFetch https://www.olten.ch (news list) -> primary: https://www.olten.ch/aktuellesinformationen/3010357"
    summary: |
      The City of Olten (canton Solothurn) states that in recent days forged QR-code stickers were found on several parking meters in the urban area; the manipulated codes redirect users to fraudulent websites, creating a risk that payment data is misused.
      The city tells users to pay only with cash or card at the meter or through the contracted apps Parkingpay, EasyPark or PrestoPark, to scan TWINT payment QR codes only inside the TWINT app and never with the phone camera,
      and to report suspicious codes to the city's Ordnung und Sicherheit unit; the administration has started legal steps for criminal prosecution. Keystone-SDA relays the same facts. No source names an actor, the phishing domains,
      the number of stickers or any loss.
      Assessment (mine, not the city's): the item matters to communal defenders only as a reminder that physical tampering with a municipally operated payment asset is a facilities and citizen-communication problem rather than an IT one;
      the city itself names no discriminator beyond using the official payment channels.
