    summary: |
      Delta on the existing Danfoss entry (facts, claims and assessments separated).
      FACTS from authorities. NCSC Switzerland published advisory 13054 on 2026-10-13 (14:04 UTC), exploitation status
      "Actively Exploited": affected are Danfoss AK-SM 800 (end of life) and AK-SC 355 (phased out), neither of which receives fixes,
      and, per NCSC.ch, also current-generation AK-SM 800A / 8xxA units running outdated firmware ("allegedly compromised"); NCSC.ch states the
      attack "could affect other sectors, such as healthcare for specialized cooling equipment" and asks organisations to review whether the devices are in use.
      It lists CVE-2025-41450 (auth bypass), CVE-2025-41451 (post-auth command injection) and CVE-2025-41452 (post-auth nginx config injection) only as "alleged as potentially related";
      Danfoss's own advisories fix the first in AK-SM 8xxA 4.2 and the other two in 4.3.1 (DSA-2025-03-01, DSA-2025-08-01).
      CERT-FR revised its alert on 2026-10-13: it now says it knows of numerous compromises of Danfoss AK-SM and AK-SC controllers "ainsi que Copeland xweb et Dixell xweb"
      (the 12 October version named only Danfoss), warns that attack campaigns are probably still ongoing, and that on an unpatched end-of-life unit a factory reset alone is insufficient
      because the device stays vulnerable and will very likely be compromised again; for unaffected units it adds checking the full configuration including defrost windows and
      checking insurance conditions before cutting the data uplink to the refrigeration contractor.
      Danfoss told Cooling Post (2026-10-12) that the majority of affected units were legacy products or current products running outdated firmware (AK-SM800 EOL 2021, AK-SC355 phased out 2016, AK-SM800A on outdated firmware).
      Danfoss's security-advisories page lists no advisory about the attack as of this fetch.
      Italy's ACN bulletin BL01/261013/CSIRT-ITA (2026-10-13) asserts, without evidence cited, that the attack exploited obsolete installations, internet-exposed management interfaces and weak
      authentication; its action list (inventory incl. vendor-installed cellular routers, remote support links, setpoint/defrost/alarm-threshold comparison against the authorised baseline,
      independent temperature measurement, log review back 90 days, MFA on or in front of remote access) is, in my assessment, the most operational guidance published so far.
      BSI-CS 154 (published 2026-10-13, "Gefährdung durch internet-verbundene OT-Systeme") targets operators of small installations (food cooling, power generation, water treatment) and puts disconnecting from the internet first, VPN second.
      CLAIMS / DISCREPANCIES. Countries hit: Blick (and the existing entry's Infosecurity source) name France, Belgium and the Netherlands; SecurityWeek adds Germany, Poland, Portugal and Spain; the German retail
      federation told heise it knows of no case in Germany and heise found few exposed systems there. Swiss retailers Migros, Coop, Denner and Lidl told Blick they are not affected after current knowledge, and Aldi Suisse attributes a
      Wattwil branch cooling outage to a technical defect; no Swiss deployment of an affected controller is reported by any source. THN (reporting Paris prosecutor via AFP) says the inquiry will establish the link to damage that
      includes equipment that began to catch fire. NCSC.ch's "alleged potentially related" CVEs and ACN's mechanism are unconfirmed by CERT-FR/Danfoss; nobody has named the entry vector.
    region_nexus: "switzerland (NCSC.ch advisory 13054; Swiss retailers state not affected; no Swiss deployment reported), europe-wide (FR/BE/NL confirmed or reported; DE/PL/PT/ES disputed)"
