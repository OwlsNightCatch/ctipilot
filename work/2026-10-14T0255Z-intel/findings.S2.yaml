    summary: |
      CERT-FR's alert CERTFR-2026-ALE-012 was revised on 2026-10-13 ("Ajout d'autres équipements ciblés"). Its affected-systems list is now Copeland xweb, Danfoss AK-SC, Danfoss AK-SM and Dixell xweb,
      and its summary says CERT-FR knows of numerous compromises of the remote refrigeration-installation controllers Danfoss AK-SM and AK-SC as well as Copeland xweb and Dixell xweb.
      The alert names no models, no vulnerability, no firmware and no entry vector for the Copeland/Dixell units, and does not tie the compromises to Claroty Team82's August 2026 findings
      (23 flaws in Copeland XWEB300D/500B/500D PRO including unauthenticated root RCE, fixed in firmware v1.13); the store entry on that research says "no exploitation reported", which CERT-FR's wording now contradicts for the product family.
      NCSC.ch's advisory 13054 relays CERT-FR but lists only the Danfoss models. CERT-FR also states that attack campaigns are probably still ongoing against these devices and that a factory reset alone does not fix an unpatched end-of-life unit.
