    extended_notes: |
      Detection / hardening concepts the sources support (telemetry class first):
      - controller configuration audit trail and the supervisory platform: changes to setpoints, defrost schedules/durations, alarm thresholds and alarm notification recipients, new or changed accounts, outside the contractor's maintenance window (ACN, CERT-FR);
      - independent temperature loggers that do not depend on the controller or its supervision platform, because compromise can alter displayed values and disable alarms (ACN);
      - firewall/VPN/ISP logs: inbound connections to the controller management interface from anything other than the refrigeration contractor's addresses; inventory of cellular routers and vendor-installed remote-support links (ACN);
      - post-compromise: CERT-FR order of steps (restrict access, factory reset, apply fixes, rotate secrets, review accounts, full reconfiguration); NOT sufficient for an EOL/unpatched unit, which must be taken off the internet or replaced (CERT-FR);
      - hardening: remove internet exposure; VPN + MFA to a single managed entry point; Strict Session Control (mandatory HTTPS) is default from AK-SM 8xxA firmware 4.0 per THN/NCSC.ch; set default passwords; check the insurance/contract condition before cutting the contractor uplink (CERT-FR).
      Open: nobody names the entry vector; the AK-SM 800A firmware ladder is reported inconsistently (THN: package 5.3.x latest, no downgrade once on 5.3.x; Netzwoche: 5.0.19) so cite only the 4.2 / 4.3.1 patched versions from Danfoss's own advisories.
      Cross-links: 2026-08-28/claroty-danfoss-ak-sm-800a-code-of-the-day-rce (the three CVEs NCSC.ch calls potentially related), 2026-08-28/claroty-copeland-xweb-pro-refrigeration-unauth-root-rce (see the separate update-of item).
      Suggested priority view: high stays; the new Swiss-authority advisory + healthcare note justify a sector-relevance line, not a priority raise by itself. Admiralty: A2 (several independent national authorities; entry vector unconfirmed).
