    text: "**Detection:** The appliance's own logs were tampered with, so start upstream: web proxy, load balancer or WAF logs for many requests to `welcome.cgi`, above all with an `X-DSCGI-PATH` header (the login page itself is ordinary) or one whose script differs from the URL path."
