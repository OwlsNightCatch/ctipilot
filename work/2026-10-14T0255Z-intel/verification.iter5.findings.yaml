  item: "2026-10-14/cve-2026-96951-windows-shell-motw-bypass-zero-day-kev: actions[0]"
  url_or_quote: "KB5127648 for Windows 11 24H2 to 26H2"
  summary: "(low confidence) Microsoft's CVRF for CVE-2026-96951 (python parse of work/2026-10-14T0255Z-intel/bodies/msrc-cvrf-full.json, re-checked via `msrc cve`) maps Windows 11 24H2, 25H2 and 26H2 to KB5127648 but Windows 11 26H1 (x64 and ARM64) to KB5127646, and the entry's own cves[].fixed says so (\"KB5127646 (26H1)\"). In release order 24H2, 25H2, 26H1, 26H2 the range \"24H2 to 26H2\" spans 26H1, so a reader would apply the wrong KB to 26H1 devices. Fix: \"KB5127648 for Windows 11 24H2, 25H2 and 26H2, KB5127646 for 26H1\"."
- code: F3
  category: claim-not-supported
  section: trending-vulnerabilities
  item: "2026-10-14/adobe-october-2026-coldfusion-aem-commerce-unauth-critical: cves[CVE-2026-92909].affected and .fixed"
  url_or_quote: "https://www.adobe.com/trust/security/products/commerce/apsb26-153"
  summary: "(low confidence) The CVE record still binds CVE-2026-92909 to \"Adobe Commerce 2.4.4 to 2.4.9 and Magento Open Source 2.4.6 to 2.4.9, builds up to the 2026-sep release\" and to \"Magento Open Source: 2.4.9, 2.4.8 and 2.4.7 only\". The raw HTML of APSB26-153 carries the row \"CVE-2026-92909 ... Authentication required to exploit? No ... CVSS base score: 9.8 ... Notes: B2B\" and lists affected and updated versions per product only at bulletin level, with no per-CVE product mapping; the B2B note points at the Adobe Commerce B2B module (which Magento Open Source does not include). The iteration-4 remediation added the B2B builds but kept the core Commerce and Magento Open Source binding, which no page states for this CVE. Fix: say that the bulletin tags this CVE B2B and gives no per-CVE product mapping, and drop (or hedge as bulletin-level) the core Commerce and Magento Open Source binding in affected and fixed."
