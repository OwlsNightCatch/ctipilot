    discovery_trace: "first seen at: malware.news latest.rss?page=0, URL https://malware.news/t/u-s-government-disrupts-famous-chollima-operation-with-crowdstrike-assistance/126371 (aggregator topic; lead only) → primary: CrowdStrike, URL https://www.crowdstrike.com/en-us/blog/fbi-disrupts-famous-chollima-operation-with-crowdstrike-assistance/ → pivot: https://malware.news/t/north-korean-it-workers-expanding-use-of-facilitators-broadening-recruitment/126358 → primary: FBI IC3 PSA, URL https://www.ic3.gov/PSA/2026/PSA261013 → corroboration: https://malware.news/t/fbi-disrupts-north-korean-laptop-farm-used-to-infiltrate-us-companies/126367 → Nextgov, URL https://www.nextgov.com/cybersecurity/2026/10/fbi-disrupts-north-korean-laptop-farm-used-infiltrate-us-companies/416570/. The DOJ N.D. Texas release (Operation Lonestar Roundup) was unreachable (Akamai interstitial on the bridge, HTTP 401 on WebFetch) and is not cited; its figures appear only through Nextgov."
    summary: |
      On 2026-10-13 the FBI published PSA261013 updating its guidance on North Korean remote IT workers and CrowdStrike published its part in a late-September 2026 disruption of several
      U.S. laptop farms run for the cluster it tracks as FAMOUS CHOLLIMA (the registry's PurpleDelta / Jasper Sleet family). The FBI says the workers cannot be identified
      reliably with a single indicator and calls for an "identity in depth" approach across the employment lifecycle; it describes dozens of teams paying facilitators for a widening range of tasks
      (appearing on camera, interviews, shipping, fingerprint and drug-test submissions, keeping devices online from residences), shifting to more laptop farms with fewer laptops each, subcontracting entire jobs to freelancers in South Asia and West Africa,
      use of stolen identities and purchased identity-verification accounts to pass checks, threats of violence and data release to extort employers after termination, and targeting of clearance-holder roles and U.S. government contractors.
      Technical behaviour the FBI names on employer devices: remote-desktop and RMM tools (AnyDesk, TeamViewer, RustDesk, Chrome Remote Desktop, Splashtop, RMM), KVM-over-IP hardware (TinyPilot, PiKVM, GL.iNet), OBS Studio with a VDO.Ninja plugin, Homebrew, screen recordings exfiltrated from the work device, and unusually fast rotation of bank accounts, addresses and social accounts.
      CrowdStrike adds tradecraft: operatives file false stolen-laptop police reports or claim last-minute moves to redirect replacement hardware to farm addresses, or ride IT staffing firms so the end client's device is diverted without the staffing firm knowing; since May 2026 they spoof device hashes (for example making a video-capture card present as a webcam)
      and CrowdStrike OverWatch saw the same disguised device used across multiple victim organisations; farm network infrastructure shared identifiers across several concurrent personas. CrowdStrike lists victim sectors that include government technology; Nextgov, citing the DOJ, reports 40+ Texas residences searched and 187 devices seized, and CrowdStrike says the broader operation affected a campaign aimed at more than 70 U.S. companies.
      Both documents say the takedowns will only slow the actor locally and that operations continue. No Swiss or European victim is named.
    region_nexus: "United States (disruptions); global employer exposure. No Swiss or European victim named. Remote-hiring and staffing-firm exposure is transferable to Swiss public bodies and their IT suppliers."
    primary_sector_nexus: "indirect (public-sector IT suppliers and government-technology firms named among victim sectors; insider-access via fraudulent hires)"
