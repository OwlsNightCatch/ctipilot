    extended_notes: |
      EXPOSURE / VERSIONS (second-hand: hub.ivanti.com returned only a JS shell on every transport, so the vendor table is read through Rapid7).
      Rapid7's rendering of Ivanti's table: affected 25.1.1.1 and prior -> resolved 25.1.1.2; 25.1.2.2 and prior -> resolved 25.1.3.0 / 25.1.3.1; 22.8R2.4 and prior -> resolved 22.8R2.5;
      the advisory states 22.7.x and below are unaffected. The three sources do not agree on the line labels: Volexity says upgrade 25.1.1 and prior, 25.1.2 and 22.8R2.4;
      the Canadian Cyber Centre lists 25.1.1.1, 25.2.2 and 22.8R2.4 and prior (and also Ivanti Neurons Patch for Intune before 2026-09-16 and Ivanti Xtraction 2026.2.1 and prior, which are other bulletin items, not this chain);
      NVD says "before version 25.1.3.0". Main agent: reconcile against the Ivanti advisory before printing a version table, or print only the branch-level statement and cite Rapid7 as the reader of the vendor table.
      NVD CVSS 3.1 for CVE-2026-104935 is 8.6 (AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:L/A:L), CWE-290. The privilege-escalation link has no CVE yet.
      DETECTION (Volexity-stated vs. derived). Stated: monitor for large numbers of requests to /dana-na/auth/url_default/welcome.cgi, whose malicious form carries an X-DSCGI-PATH header
      (naming a /home/webserver/htdocs/... script or the /home/runtime/tmp/<MD5(filename)> upload); watch for a mismatch between the URL path and X-DSCGI-PATH; check the appliance /tmp for post-exploitation artefacts; use memory and disk forensics, because the Integrity Checker cannot see this.
      Appliance logs are tampered, so compare with upstream web-proxy / load-balancer / WAF / NetFlow records and take a memory image before reboot. Derived from the stated post-exploitation (inference, not vendor-stated): on the domain-controller side look at LDAP queries from the appliance's service account
      for LAPS, BitLocker-recovery and userPassword-type attributes, Kerberos TGS-request bursts (Kerberoast) and failed/successful logon spray patterns originating from the appliance address; on the appliance look for a hidden directory under /data holding a renamed packet-capture binary and rotating capture files.
      TRIAGE: the appliance's LDAP service account authenticating to domain controllers is normal; the discriminator is which attributes it requests (LAPS, BitLocker, password-bearing) and the appearance of Kerberos/spray activity from the appliance address.
      POST-PATCH CHECK: patching does not evict anyone already in. Volexity: "forensic investigation is required to identify evidence of exploitation". Treat the LDAP bind credential stored on the appliance, the AD service account, LAPS passwords and BitLocker recovery keys reachable by that account as exposed if compromise cannot be ruled out; the privilege escalation stays unpatched until a later release, so a device that was only patched for CVE-2026-104935 can still be escalated by someone with code execution.
      RELATED (mention only, no relation suggested): Volexity notes the LDAP packet-capture credential-harvest technique was also used by UTA0533 on SonicWall SMA appliances (registry actor:uta0533, covered in the SonicWall SMA entries); the registry has Ivanti Connect Secure only as product:ivanti-pulse-connect-secure (the rebranded product line), so the main agent may add "Ivanti Connect Secure" as an alias rather than a second key.
      CROSS-DOMAIN: S1 will also see this (KEV row CVE-2026-104935, Ivanti AV26-1035); Volexity is the primary and the richest source.
      VOLEXITY INDICATOR FILES are published on Volexity's GitHub (threat-intel/2026/2026-10-13 Ivanti); not reproduced here per the no-IOC rule.

  - title: "North Korean IT workers (FAMOUS CHOLLIMA): FBI updates its 'identity in depth' guidance for employers while CrowdStrike and the FBI take down U.S. laptop farms; operatives now spoof device identifiers and reuse disguised capture hardware across victims"
    suggested_priority: notable
    sources:
