  - title: "Fox-IT publishes eight years of Cobalt Strike beacons (56,843 payloads, 190,182 sightings): Team Servers live a median 14 days, DNS beacons fade far more slowly than HTTP(S), and operators now reshuffle beacon configuration layouts to break parsers"
    suggested_priority: low
    sources:
      - { url: "https://blog.fox-it.com/2026/10/13/releasing-the-cobalt-strike-beacon-corpus/", publisher: "Fox-IT (NCC Group)", date: "2026-10-13", role: "primary" }
    discovery_trace: "first seen at: malware.news latest.rss, URL https://malware.news/t/releasing-the-cobalt-strike-beacon-corpus/126352 (aggregator topic; lead only) → primary: Fox-IT International blog, URL https://blog.fox-it.com/2026/10/13/releasing-the-cobalt-strike-beacon-corpus/ (no pivot needed beyond the lead; the dataset itself lives on Hugging Face and was not fetched)"
    summary: |
      Fox-IT released its full Cobalt Strike Beacon Corpus on Hugging Face on 2026-10-13: 56,843 raw beacons and their parsed configurations from 190,182 sightings on 30,604 unique Team Server IP addresses between 2018-07-04 and 2026-09-29,
      collected by fingerprinting Team Servers and requesting the staged beacon, parsed with dissect.cobaltstrike (v1.3.0 now parses configuration blocks independently of their layout, because operators had started shuffling setting order and type values to break parsers).
      Fox-IT's findings: the median Team Server was reachable for 14 days (35% seen on a single day, 14% still serving after three months, 2% after a year); only about 32% of fingerprinted Team Servers hand out a beacon, falling from around 40% in 2023 to 20-25% in 2026 as operators turn off staging (the host_stage option),
      so staged-beacon scanning sees a shrinking part of the landscape; DNS beacons have declined much less steeply than HTTP(S) ones (about 100 a month since 2024); 128 beacons (0.23%) do not parse, mostly custom modifications. Cobalt Strike 4.9 and 4.5-4.8 share the lead since 2024 and 4.10+ remains small.
      The value to a hunter is a labelled research corpus for clustering operators (watermark, spawn-to and injection hashes, malleable C2 profile, certificate reuse), benchmarking config extractors and separating red-team from criminal infrastructure; it is a dataset release, not a new campaign.
