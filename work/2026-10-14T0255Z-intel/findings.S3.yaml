    extended_notes: |
      DELTA vs the store: entries 2026-08-19/purpledelta-dprk-it-worker-facilitator-rmm-detection, 2026-08-28/kudelski-bismarck-dprk-it-worker-gambling-fakecalls-overlap and 2026-09-19/waterplum-contagious-interview-joint-advisory-scale cover the cluster; this item is the 2026-10-13 law-enforcement disruption plus the FBI's first update of employer guidance, and the new tradecraft (device-hash spoofing, farm fragmentation, subcontracting to freelancers, extortion on termination). Main agent may prefer an update-of on the PurpleDelta entry; the entry id to extend is 2026-08-19/purpledelta-dprk-it-worker-facilitator-rmm-detection.
      DETECTION (telemetry class first). Endpoint/MDM inventory: HID/video-class devices that disagree with the model's hardware list, KVM-over-IP or capture-card descriptors, RMM / remote-desktop / OBS+VDO.Ninja / Homebrew installed outside the IT baseline on a corporate laptop; identity-provider sign-in logs: sessions for a worker whose time zone, ISP class (residential vs the declared city) or concurrent locations do not match the declared home address; HR/IT: shipping-address versus residential-address mismatch, replacement-laptop requests citing theft, reuse of phone numbers, e-mail, bank accounts or CV text across candidate profiles (CrowdStrike list).
      TRIAGE: remote workers legitimately use remote-desktop tools and VPNs; the FBI warns aggressive single-signal filtering harms legitimate staff and identity-theft victims; the discriminator is compounding behaviours (RMM/KVM plus location mismatch plus device-address mismatch plus identity reuse), which is exactly the FBI's "identity in depth" framing.
      HARDENING: live identity verification and multiple ID forms at onboarding; ship devices only to the verified residential address; treat staffing-firm hardware redirection as a control gap; application allow-listing for remote-access software; the FBI says it is the only nation to devote state-level organisational resources to this fraud.
      ATTRIBUTION NOTE: the FBI's 85-90% revenue-share estimate, the "dozens of teams" count and "the only country" statement are FBI assessments; CrowdStrike's "sector-agnostic" victim list is CrowdStrike's reading of its own telemetry.

