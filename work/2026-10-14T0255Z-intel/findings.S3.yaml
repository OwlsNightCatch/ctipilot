    discovery_trace: "first seen at: volexity, RSS feed https://www.volexity.com/feed/ (majors sweep, item dated 2026-10-13) → primary (no pivot needed):https://www.volexity.com/blog/2026/10/13/a-series-of-unauthenticated-events-chained-exploitation-of-ivanti-connect-secure-zero-days/ → pivot: Rapid7 rapid7-research feed https://www.rapid7.com/rss.xml → https://www.rapid7.com/blog/post/etr-ivanti-connect-secure-zero-day-exploited-in-the-wild-cve-2026-104935/ (relays Ivanti's version table and exploitation statement; hub.ivanti.com advisory itself is a JS/SPA shell that returned no content on extract and WebFetch) → https://malware.news/t/ivanti-security-advisory-av26-1035/126361 → https://cyber.gc.ca/en/alerts-advisories/ivanti-security-advisory-av26-1035 (KEV note). CISA KEV row for CVE-2026-104935 read through the cisa-kev bridge (dateAdded 2026-10-13, dueDate 2026-10-16, forensicTriage Yes, knownRansomwareCampaignUse Unknown)."
    summary: |
      Volexity reports that an actor it tracks as UTA0576 compromised a fully patched Ivanti Connect Secure (ICS) 22.8R2.4 (Build 19097)
      appliance at a Volexity network-monitoring customer, exploiting from 2026-10-03; Volexity began investigating on 2026-10-05.
      The chain has three links. (1) An authentication bypass in welcome.cgi: the public login-page script is reachable without authentication,
      the request URL decides whether the request is allowed, but an X-DSCGI-PATH request header decides which CGI script actually runs, so
      protected CGI files become reachable. (2) A file-write race in the wu.cgi upload handler: a Perl script sent with a .zip extension is
      written to /home/runtime/tmp/<MD5(filename)> before the ZIP check fails and the file is deleted, and parallel requests whose X-DSCGI-PATH
      points at that path execute it inside the window. (3) A privilege escalation: the root-run dsinvoked maintenance broker trusts DSCache
      configuration data, and the exploit patches libdsplibs.so in the cgi-server process memory, rewrites an existing maintenance task so it launches
      the Perl interpreter as root, then restores both. Ivanti tracks the authentication bypass and RCE as CVE-2026-104935 (fixed 2026-10-13);
      the privilege escalation has no fix yet, which Volexity says will ship "in the coming weeks". Every command re-runs the whole chain and its
      output returns in the HTTP response, so there is no web shell, backdoor or separate C2; the Python stage is Base64/zlib-encoded and runs via exec(), and the
      exploit rewrites /home/runtime/dlogs/debuglog and /var/log/audit/audit.log to drop its own time window. Because the attack patches library code in memory only and restores the
      configuration store, Ivanti's Integrity Checker Tool sees nothing. After access UTA0576 took credentials stored on the appliance (including LDAP domain credentials),
      used the appliance's Active Directory service account to search for LAPS passwords, BitLocker recovery information and userPassword/unixUserPassword
      attributes, ran a custom Kerberos tool with Kerberoast capability, sprayed passwords against AD accounts, and ran a renamed tcpdump from a hidden directory with
      a BPF filter on cleartext ports (LDAP, HTTP, FTP, telnet) to harvest plaintext LDAP bind credentials, HTTP Basic credentials and NTLM challenge-response material.
      Volexity assesses with high confidence that an operator was interacting with results (not running a script), with low confidence that the motive is criminal
      rather than espionage, and with medium confidence that LLMs were used for exploit development and post-exploitation. Per Rapid7's reading of Ivanti's advisory, exploitation preceded disclosure
      against a limited number of customers, and part of the flaw had been fixed in ICS 25.1.3.0 (July 2026) while Ivanti was still backporting to older lines;
      CISA added CVE-2026-104935 to KEV on 2026-10-13 (due 2026-10-16).
    region_nexus: "global; internet-facing remote-access VPN tier commonly run by public administrations. No Swiss victim reported; NCSC.ch had not yet published an Ivanti advisory when checked (2026-10-14 ~03:00Z)."
