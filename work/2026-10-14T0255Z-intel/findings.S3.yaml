    confidence: MEDIUM
    novelty: new
    admiralty_suggestion: "reliability B (Check Point Research, discoverer); credibility 2 (CVE descriptions in NVD match the described flaws)"
    evidence:
      - quote: "a missing authorization check on the /config/update endpoint, which allowed any authenticated user (including low-privileged accounts)"
        attribution: "Check Point Research"
        source_url: "https://research.checkpoint.com/2026/when-llm-gateways-go-wrong-findings-from-litellm/"
      - quote: "which have been resolved as of LiteLLM version 1.83.9"
        attribution: "Check Point Research"
        source_url: "https://research.checkpoint.com/2026/when-llm-gateways-go-wrong-findings-from-litellm/"
    extended_notes: |
      VERSIONS: Check Point tested 1.77.7 and says both CVEs are resolved as of 1.83.9. NVD's descriptions (read via API, not cited) say CVE-2026-35029 affects versions prior to 1.83.0 (CVSS 3.1 8.8) and CVE-2026-59823 prior to 1.83.9 (CVSS 4.0 5.3), so the safe floor is 1.83.9. CVE-2026-35029 has been public since 2026-04-06.
      DETECTION (telemetry class first): web/application access logs on the LiteLLM proxy for POST /config/update from non-admin sessions, GET /get_image after a config change, config-store changes that introduce s3:// or gcs:// pass-through targets or change UI_USERNAME/UI_PASSWORD/UI_LOGO_PATH, and outbound calls from the proxy to unexpected api_base hosts; cloud audit logs for reads of the bucket object a rogue pass-through target names.
      HARDENING: upgrade to 1.83.9 or later; do not expose the proxy or its UI to the internet; rotate provider API keys held by any instance that ran an affected build with untrusted internal users; restrict who can obtain UI sessions.
