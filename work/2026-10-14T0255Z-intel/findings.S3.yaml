  - title: "Check Point Research on LiteLLM: a missing role check on /config/update lets any authenticated user take over the gateway (arbitrary file read, admin takeover, code execution via modules loaded from cloud storage), and a user_config SSRF leaks provider API keys; fixed in 1.83.x"
    suggested_priority: low
    sources:
      - { url: "https://research.checkpoint.com/2026/when-llm-gateways-go-wrong-findings-from-litellm/", publisher: "Check Point Research", date: "2026-10-13", role: "primary" }
    discovery_trace: "first seen at: checkpoint-research, RSS feed https://research.checkpoint.com/feed/ (majors sweep, item dated 2026-10-13) → primary (no pivot needed): https://research.checkpoint.com/2026/when-llm-gateways-go-wrong-findings-from-litellm/. CVE ids and fixed-in versions cross-read against the NVD API (verification only, not cited)."
    summary: |
      Check Point Research assessed LiteLLM 1.77.7, a widely used open-source LLM gateway that holds provider credentials and routes model traffic, and reports two CVEs resolved as of LiteLLM 1.83.9.
      CVE-2026-35029: POST /config/update has no PROXY_ADMIN check, and a route allow-list for UI sessions matches by startswith("/config"), so any UI session token (any role, including a baseline internal user) can modify runtime configuration.
      Chains: injecting environment variables (UI_LOGO_PATH then GET /get_image) reads arbitrary files; overwriting UI_USERNAME and UI_PASSWORD yields the proxy-admin account; defining a pass-through endpoint whose target is an s3:// or gcs:// Python module makes the proxy download and exec_module() it, giving code execution.
      CVE-2026-59823: the documented "Clientside LLM Credentials" path accepts a user_config body whose api_base bypasses the top-level api_base/base_url block, so an authenticated caller redirects LiteLLM's outbound call and receives the provider API key the proxy attaches. Password hashes are readable by low-privilege users and unsalted single-iteration (tracked as a duplicate GHSA).
      No in-the-wild exploitation of these two CVEs is reported in the post. The store already covers LiteLLM under mass exploitation by the PoeLLM botnet through a different CVE (CVE-2026-42271, command injection in the MCP test-connection path), so this is a second, independent attack surface on the same product.
    region_nexus: "global; internal AI-gateway deployments in public administrations"
    primary_sector_nexus: "indirect (AI infrastructure being adopted by public bodies; holds provider credentials)"
    sector: "public-sector"
    cves: [CVE-2026-35029, CVE-2026-59823]
    techniques: [T1190, T1059.006]
