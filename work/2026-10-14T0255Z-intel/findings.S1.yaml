    discovery_trace: "first seen at: rapid7-research feed https://www.rapid7.com/rss.xml (item https://www.rapid7.com/blog/post/etr-cve-2026-97229-critical-unauthenticated-remote-code-execution-in-gitlab, 2026-10-13 11:29 UTC) → pivot: Rapid7 article's link to https://github.com/jburgess-r7/CVE-2026-97229-PoC → vendor advisory re-check at https://docs.gitlab.com/releases/patches/patch-release-gitlab-19-4-2-released/ (unchanged; fixed 19.4.2, 19.3.5, 19.2.8)"
    summary: |
      Rapid7 states on 2026-10-13 that it independently reproduced arbitrary code execution for CVE-2026-97229 on an unpatched official GitLab CE 19.4.1 image
      with ASLR enabled, saw the same input fail on the 19.4.2 image, and found no confirmed exploitation in the wild. The prerequisites are narrower than "unauthenticated":
      Rapid7 says an attacker must first commit a malicious .gitlab-ci.yml and a repository path containing UTF-8 characters to a branch in a public project, which an
      ordinary account can do by creating a public project where that is permitted; a crafted expression passes GitLab's validation as US-ASCII, then Ruby's Onigmo engine recompiles it
      for the UTF-8 path after the checks, an integer overflow in the program-size calculation yields invalid instructions, and an OS command runs as the git user.
      A proof-of-concept repository went up the same day, whose README says the delivery step is a credential-less request to the public CI lint API of the project after the push, that the included
      offsets were only tested against the 19.4.1 CE amd64 image (other builds need adjusted offsets) and that the generated payload is slightly larger than 2 GiB, needing about 9 GiB of available memory on the test host.
      Rapid7's interim mitigation: restrict anonymous access to public projects and stop untrusted users creating or writing to public projects; this only closes the demonstrated delivery path.
      GitLab's advisory is unchanged: fixed in 19.4.2, 19.3.5 and 19.2.8.
