      EXPOSURE: run Microsoft's Exchange Health Checker script to read current CU/SU build and ESU status; internet-reachable SMTP on the Exchange transport role is the path for CVE-2026-70571 (no authentication, crafted message); OWA/ECP users with administrator roles are the target of CVE-2026-70279. Install the SU on every Exchange server and every machine with Exchange Management Tools, including hybrid-only management servers (Exchange team FAQ).
      DETECTION (class, mechanism-derived, no source publishes exploit behaviour): inbound message-handling anomalies on the transport role (crashes and Windows Error Reporting events in the content-conversion path, unexpected child processes of Exchange transport worker processes, Application-log faults), mail flow logs correlating a single malformed message with such events; for CVE-2026-96940, mailbox-access audit logs showing one account opening other users' mailboxes. Post-patch compromise check: if the server was unpatched while internet-facing, review for web shells and new transport rules/mailbox permissions as for any Exchange compromise.
      TRIAGE: AC:H and Microsoft's "not guaranteed to succeed" mean failed attempts will look like crashes, not shells; a crash in the transport path after receiving external mail is the signal to escalate.
      HARDENING: install the October SU (cumulative, no need for earlier SUs if on a supported CU), plan Exchange SE migration for any 2016/2019 server, restrict ECP/OWA admin exposure.
