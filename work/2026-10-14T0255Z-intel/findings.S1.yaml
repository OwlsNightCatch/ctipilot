    summary: |
      Ivanti disclosed CVE-2026-104935 on 2026-10-13, an authentication bypass by spoofing (CWE-290) in Ivanti Connect Secure that allows a remote
      unauthenticated attacker to execute arbitrary commands (CVSS 3.1 8.6, AV:N/AC:L/PR:N/UI:N), and states it is aware of limited exploitation in the
      wild; CISA added it to KEV the same day with a 2026-10-16 due date. Volexity, which found the activity on 2026-10-05, attributes it to a previously
      unknown cluster it tracks as UTA0576 (low confidence criminal motivation, medium confidence LLM-assisted tooling) and reports exploitation from
      2026-10-03 against a fully patched 22.8R2.4 appliance. Volexity describes a three-stage chain: a routing flaw where a request to the public login
      CGI (/dana-na/auth/url_default/welcome.cgi) carries an X-DSCGI-PATH header naming a protected CGI, so the URL passes the authentication check while the header decides the destination;
      a file-write and race in the wu.cgi upload handler, which writes the upload to disk before validating it as a ZIP, so a Perl script can run in the
      window before deletion; and a root escalation through the dsinvoked broker's trust in DSCache configuration, which Ivanti has not yet patched
      (fix "in the coming weeks"). Volexity found no web shell or backdoor: every command re-runs the whole chain over HTTPS, the library patch is made only in
      memory and DSCache is restored, and debug and audit logs are trimmed, so Ivanti's Integrity Checker Tool sees no file change. Post-exploitation targeted
      the Active Directory service account stored on the appliance: LDAP queries for LAPS passwords and BitLocker recovery keys, a Kerberos test tool with
      Kerberoast capability, password spraying, and packet capture of plaintext LDAP, HTTP Basic and NTLM traffic through a renamed tcpdump. Per Rapid7 reading
      Ivanti's advisory, affected are 25.1.1.1 and prior (fixed 25.1.1.2), 25.1.2.2 and prior (fixed 25.1.3.0 and 25.1.3.1) and 22.8R2.4 and prior (fixed
      22.8R2.5); 22.7.x and below are not affected, and Ivanti says the 22.x code lines reach end of life on 2027-01-31.
