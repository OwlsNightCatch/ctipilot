    sources:
      - { url: "https://www.rapid7.com/blog/post/etr-cve-2026-97229-critical-unauthenticated-remote-code-execution-in-gitlab", publisher: "Rapid7", date: "2026-10-13", role: "primary" }
      - { url: "https://github.com/jburgess-r7/CVE-2026-97229-PoC", publisher: "Rapid7 researcher repository (proof of concept README)", date: "2026-10-13", role: "primary" }
