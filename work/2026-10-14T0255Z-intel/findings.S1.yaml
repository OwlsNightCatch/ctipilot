        attribution: "Rapid7"
        source_url: "https://www.rapid7.com/blog/post/etr-cve-2026-97229-critical-unauthenticated-remote-code-execution-in-gitlab"
      - quote: "An attacker with permission to push to a public project supplies a CI regular expression and a specially named path."
        attribution: "Rapid7 researcher repository"
        source_url: "https://github.com/jburgess-r7/CVE-2026-97229-PoC"
    extended_notes: |
      DELTA vs the published entry (2026-10-13, no updates yet): the entry says NCSC lists exploitation status unknown and does not mention the reproduction, the public proof of concept or the push-to-public-project precondition. A changelog update should move the status from patch-available to public-PoC and refine the "unauthenticated" label: the final trigger is unauthenticated, the setup needs a write-capable account on a public project (open self-registration or any user allowed to create public projects makes that trivial).
      DETECTION (class, from the PoC README and Rapid7's mechanism): GitLab application and API logs for GET /api/v4/projects/:id/ci/lint without credentials against a project that has a recent push of a .gitlab-ci.yml whose regular expressions are unusually large or whose repository path contains non-ASCII characters; memory spikes and crashes in the GitLab application worker around CI lint (the README says the payload needs several GiB); child processes spawned by the GitLab Ruby worker as the git user. Also audit new public projects created by recently registered accounts.
      TRIAGE: benign CI lint calls are routine; the discriminating features are an anonymous lint request against a freshly created public project plus a UTF-8 repository path and an oversized regular expression.
      HARDENING: upgrade to 19.4.2, 19.3.5 or 19.2.8 (19.4.1 is not enough); until then disable open sign-up and the right of untrusted users to create public projects, and restrict anonymous access to public projects.
