      (incorrect authorization, 7.4) and CVE-2026-95696 (uncaught exception denial of service, 6.5). IBM lists no workaround; the fix is an interim fix (APARs DT502359 for SAML and DT502929 for gRPC, after raising the install to the interim fix's minimum fix pack level) or Liberty fix pack 26.0.0.11, targeted for the
      fourth quarter of 2026. IBM does not state exploitation, and no other source was found reporting it.
    region_nexus: "global; Liberty runs many Java applications of administrations, SAML single sign-on is a common integration (use in Swiss bodies not confirmed from sources)"
    primary_sector_nexus: "indirect: application server under citizen and staff portals"
    sector: "public-sector"
    cves: [CVE-2026-93909, CVE-2026-93895, CVE-2026-95695, CVE-2026-95696]
    techniques: [T1190]
    affected_products: ["IBM WebSphere Application Server Liberty"]
    entity_keys: []
    new_entities: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    borderline: true
    borderline_reason: "vendor bulletin only, not exploited, exposure limited to Liberty servers with the samlWeb-2.0 or grpc-1.0 feature enabled, no workaround and no fix pack until 4Q2026"
    evidence:
      - quote: "IBM WebSphere Application Server Liberty is vulnerable by an authentication bypass vulnerability when samlWeb-2.0 feature is enabled."
        attribution: "IBM Security Bulletin"
        source_url: "https://www.ibm.com/support/pages/node/7292236"
      - quote: "Apply Liberty Fix Pack 26.0.0.11 or later (targeted availability 4Q2026)."
        attribution: "IBM Security Bulletin"
        source_url: "https://www.ibm.com/support/pages/node/7292236"
    extended_notes: |
      EXPOSURE: IBM's own page "How to determine if Liberty is using a specific feature" (linked in both bulletins) tells whether samlWeb-2.0 or grpc-1.0 is enabled; only servers with those features are affected.
      DETECTION (class): authentication and access logs of the Liberty server for sessions that gain authenticated state without a completed SAML assertion exchange, and gRPC method invocations by unauthenticated clients on protected services.
      HARDENING: apply the interim fix now (IBM strongly recommends it); IBM lists no workaround.
