    summary: |
      The OTRS Community Edition's HTTP Basic Authentication modules, for agents and customers, take the username not only from REMOTE_USER (set by the web server after a successful login) but also from HTTP_REMOTE_USER, which
      in CGI and mod_perl deployments is filled from an attacker-controllable Remote-User request header. Where HTTPBasicAuth is the configured authentication backend, an unauthenticated remote attacker can therefore authenticate as any existing agent or customer user, through
      the Generic Interface among others, without a password and with the impersonated user's privileges (OTRS GmbH advisory OSA-2026-18, 2026-10-12, CVE-2026-93582, CVSS 3.1 9.4, CVSS 4.0 9.2).
      OTRS 7 and later are not affected (Mojolicious/Hypnotoad does not expose arbitrary headers through the environment) and the advisory's solution is OTRS 2026.7.1 or later; ((OTRS)) Community Edition 6.x and earlier are affected and the advisory says products based on that code base are
      "also very likely to be affected". Znuny, the maintained fork, published the same flaw as ZSA-2026-14 on 2026-09-16 (high severity, CVE then still requested) with fixes in Znuny LTS 6.5.25 and Znuny 7.3.7; the same releases fix ZSA-2026-13 (SQL injection in the agent login,
      Kernel::System::Auth::DB, CVE-2026-48188, high) and ZSA-2026-15 (SQL injection through the ContentSearch ticket-search parameter). No exploitation is reported. The reporter is the same for the OTRS and Znuny advisories (Ghent University coordinated disclosure programme).
