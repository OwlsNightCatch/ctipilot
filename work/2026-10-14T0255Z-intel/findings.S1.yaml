    summary: |
      Microsoft's 2026-10-13 release fixes CVE-2026-96951, a Windows Shell security feature bypass (CWE-77 command injection per CISA's KEV name; CVSS 3.1
      8.8, AV:N/AC:L/PR:N/UI:R) that Microsoft marks Exploited: Yes, Publicly Disclosed: No, Exploitation Detected. Microsoft's FAQ says a successful attacker
      "could evade Mark of the Web (MOTW) defenses" after convincing a user to click a link or open a crafted attachment sent by email or instant message,
      so the file or content opens without the SmartScreen and warning dialogs the MOTW tag normally triggers. Rapid7 notes this is the second exploited Windows Shell zero-day this year and
      that Windows Server 2012 receives no patch while Server 2012 R2 does; the flaw also affected Outlook.com, which MSRC's CVRF lists as fixed in a service build dated 2026-09-25. No
      source names the exploiting actor, the delivered payload or the victims; CISA lists the ransomware-campaign use as Unknown and sets a three-day remediation
      due date. Fixed builds per MSRC: Windows 11 24H2/25H2/26H2 KB5127648 (10.0.26100.9711 / 26200.9711 / 26300.9711), Windows 11 26H1 KB5127646, Windows 11 23H2
      KB5126653, Windows 10 21H2/22H2 KB5126657 (10.0.19044.7807), Windows 10 1809 and Server 2019 KB5126651, Windows 10 1607 and Server 2016 KB5126868, Server 2022
      KB5126655, Server 2025 KB5126646, Server 2012 R2 KB5126836.
