    extended_notes: |
      Detection angle for web owners (no IOCs; behaviour only): access tokens or API keys shipped in a client-side settings file and then used
      directly against the backend from non-browser clients; injection payloads against file-serving scripts on public tools; anonymous, contact-less submissions to
      public forms. Hardening levers named by the cases: do not issue tokens to every visitor for data that is meant to be gated; do not expose scripts that return arbitrary
      files; rate-limit and review automated form submissions, as the Philadelphia department says it already does.
