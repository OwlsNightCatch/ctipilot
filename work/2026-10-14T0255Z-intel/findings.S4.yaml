    extended_notes: |
      Transferable lessons for Swiss cantonal/communal defenders: (1) a mass-notification SaaS concentrates the authority's citizen contact lists and
      its staff call-out lists (Kagawa's safety-confirmation roster, dam-release recipients) in one supplier tenant, and those lists are ready-made
      targeting data for messages that impersonate the authority; Yokosuka already reports suspicious mail reaching registrants, though no source ties
      it to this breach. (2) The alert path itself went dark at several customers, who fell back to the official website, social media and the
      disaster-radio network (Yokosuka, Ayase per Piyolog). (3) The vendor's own wording "intrusion route" for the two services it switched off
      implies an internet-facing front end, but no vulnerability class is given. Context only: Japanese media and security vendors have suggested
      since early October that AI agents are accelerating a wave of Japanese breaches (NHK 2026-10-06, ITmedia 2026-10-11); no source links that
      thesis to Arcadia. Detection angle for a tenant of a comparable service: authentication and export logs on the supplier portal, unusual
      inbound mail or SMS referencing a registration to the authority, and vendor notification clauses.
