  - title: "CERT-FR revises its refrigeration-controller alert: Copeland xweb and Dixell xweb are added to the Danfoss AK-SM and AK-SC compromises, and a factory reset alone no longer counts as a fix for end-of-life units"
    sources:
      - { url: "https://www.cert.ssi.gouv.fr/alerte/CERTFR-2026-ALE-012/", publisher: "CERT-FR (alert CERTFR-2026-ALE-012, version of 2026-10-13)", date: "2026-10-13", role: "primary" }
