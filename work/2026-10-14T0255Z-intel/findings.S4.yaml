    discovery_trace: "first seen at: heise-sec feed (https://www.heise.de/security/feed.xml), item 'Cyberkriminelle behaupten Datenleck bei Confluent, Deloitte, KFC und MoneyGram' -> primary: https://www.heise.de/news/Cyberkriminelle-behaupten-Datenleck-bei-Confluent-Deloitte-KFC-und-MoneyGram-11484301.html -> context: https://www.heise.de/news/Cyberangriff-auf-Datenaustauschdienst-FTAPI-11469629.html (WebSearch for an FTAPI statement found nothing newer)"
    summary: |
      heise reports on 2026-10-12 that The Gentlemen's leak-site entry for FTAPI, which showed only a countdown when the earlier entry was
      written, now offers the data: the countdown has been replaced by a button that shows the files. Heise's first-glance reading is that the
      set mainly holds advertising and marketing material but also appears to include a customer list (existing customers), and it saw no trace of
      platform data in it. FTAPI had told heise on 2026-09-29 that unauthorised parties placed ransomware on a single locally run internal server
      detected on 2026-09-14, that the FTAPI platform, customer systems and customers' exchanged data were not affected, and that forensics
      continue; the question the existing entry leaves open is which data categories sat on that server, and heise's reading is a first partial
      answer (a customer list), not an FTAPI statement. In the same article heise says the group's leak site also lists Confluent, Deloitte, KFC and
      MoneyGram without showing data or details (none had responded publicly) and has published what look like OneDrive extracts of Air Canada
      (Air Canada has not confirmed). The Gentlemen are the actor in the store's Ixa Systems (Vaud) entry and have listed several Swiss firms, so
      Swiss authorities that use FTAPI SecuTransfer (the existing entry cites the Canton of Lucerne) should assume their contact or customer
      records may now be public.
