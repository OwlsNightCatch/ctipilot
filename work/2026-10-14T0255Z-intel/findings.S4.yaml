    summary: |
      MDR reported on 2026-09-16 that Tangerhütte's 'digital town hall' (citizen app and portal, online since 2020, linked to the state's
      digital services) was taken offline after an attack on the night of 2026-09-15 to 16, with the municipality saying it was repelled and giving no
      technical detail. On 2026-10-13 MDR adds the software vendor's account. Innocon of Tangermünde, which develops the software, says attackers found
      and exploited a vulnerability it did not know of (a zero-day, no patch existed). The software runs on systems operated for the municipality
      by the state municipal IT provider KID; an IT employee noticed irregularities in the morning, the server was isolated and disconnected, and
      Innocon analysed the secured logs on an offline notebook. Innocon told four further communes, which also took their digital town halls offline
      as a precaution although it saw no sign of attack on them. Innocon's chief executive says the attackers reached only test accounts and took no
      real data, and classifies the intrusion as an AI attack on two grounds: commands were executed faster than copy-and-paste would allow, and
      the follow-on steps were not prepared in advance but developed on the city's server during the attack, whereas human attackers normally upload
      their own code and do not change it. That is the vendor's assessment from its own logs: the State Criminal Police Office (LKA) told MDR it can
      neither confirm nor deny an AI attack and is investigating data espionage, two professors consider the reading plausible without having seen the
      logs, and the BSI vice-president told MDR that AI lets attackers hit hundreds or thousands of systems at once. Citizens could use the services
      only on paper for weeks. No CVE, product version or fix is named.
