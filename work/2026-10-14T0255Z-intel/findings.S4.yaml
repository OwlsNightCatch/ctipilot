    discovery_trace: "first seen at: piyolog, URL https://piyolog.hatenadiary.jp/entry/2026/10/14/014350 (entry listed on https://piyolog.hatenadiary.jp/ homepage, fetched via bridge url) -> primary: Arcadia official blog https://raiden.site.ktaiwork.jp/archives/4597 and https://raiden.site.ktaiwork.jp/archives/4601, corporate notice https://www.arcadia.co.jp/info/4076 -> corroboration: Okayama https://www.city.okayama.jp/kurashi/0000086126.html, Kagawa https://www.pref.kagawa.lg.jp/kikikanri/sogo/bosaijoho/bousaijouhoume-ru_ryuusyutu.html, Yokosuka https://www.city.yokosuka.kanagawa.jp/0525/nagekomi/20261013_roueinoosore.html, Tokyo Shimbun https://www.tokyo-np.co.jp/article/521381, NHK https://news.web.nhk/newsweb/na/nd-20261013de58789 (WebSearch for English/Japanese coverage returned nothing newer)"
    summary: |
      Arcadia (Minoh, Osaka) disclosed on 2026-10-13 that a third party gained unauthorised access to SpeeCAN RAIDEN, its browser-based
      mass-notification service that municipalities use to push disaster and crime-prevention messages by e-mail, voice call and fax, and
      to call staff out. By Arcadia's account it noticed suspicious behaviour on 2026-10-11 16:30 JST, applied an interim block of the
      intrusion path around 03:00 JST on 2026-10-12, and on 2026-10-13 at 11:00 JST shut down the two services that had been the
      intrusion route (SpeeCAN RAIDEN for customers on raiden3.ktaiwork.jp, and the school edition on s2.ktaiwork.jp), blocked the
      attacking IP address, and reports finding no malicious programs on the services it left running. Six service domains are in scope.
      The data at risk is contact names, e-mail addresses, phone and fax numbers, administrator and contract data, and the message bodies
      kept in delivery history; Arcadia's own estimate of the maximum is about 3,136,000 e-mail addresses, 105,000 phone numbers and
      15,000 fax numbers, with the investigation continuing. Arcadia names no vulnerability class and no actor. The customers' own notices
      show the downstream effect: Okayama City can no longer send disaster e-mail or phone dam-release notices; Kagawa Prefecture says
      about 25,566 registered disaster-mail addresses plus the prefecture-and-municipality staff-assembly and safety-confirmation system
      data (staff names, e-mail addresses, staff numbers, affiliations) may be exposed and suspended delivery; Yokosuka City (47,065
      e-mail addresses plus fax and phone registrants) suspended four services after registrants asked about suspicious e-mail and says it
      has reported to the Personal Information Protection Commission. Kyodo, in Tokyo Shimbun, names Tomiya, Shisō, Okayama and Oita among
      the customers that stopped delivery and says the Ministry of Internal Affairs is confirming reports from some municipalities; Piyolog,
      summarising NHK, puts the number of municipalities and bodies using the service at close to 800 (not independently verified here).
      On 2026-10-14 10:40 JST Arcadia asked administrators to warn registrants about secondary harm from suspicious mail and messages.
