    discovery_trace: "first seen at: ransomware-live, URL https://api.ransomware.live/v2/countrycyberattacks/DE (record 'Ville d'Eichstätt', added 2026-10-13, press link to Merkur) -> corroboration: https://www.merkur.de/bayern/cyberangriff-legt-stadtverwaltung-lahm-notfallhotline-eingerichtet-94538064.html -> primary: city notice https://www.eichstaett.de/aktuelles/cyber-attacke_krisenstab_faehr-2843/ (found via the city homepage https://www.eichstaett.de/)"
    summary: |
      Eichstätt (about 14,000 inhabitants, administrative seat of the northernmost Upper Bavarian district) noticed a criminal cyberattack on
      Monday 2026-10-12, took all servers off the network, and lost e-mail and most telephone service. On Tuesday 2026-10-13 the city
      confirmed, after working with police and the State Criminal Police Office, that the attackers managed to copy a large part of the
      administration's data; the data backup worked, so the data can be restored, and no extortion demand had reached the administration. The
      investigators' working assumption, reported by dpa, is a ransomware attack; the Bavarian Cybercrime Central Office (Generalstaatsanwaltschaft
      Bamberg) is leading the inquiry and says it is at the very beginning. Who is behind it is unknown. The city runs an emergency hotline and
      an info point, restarts services from Wednesday 2026-10-14 with printable forms handed in on paper, the municipal utility is not affected,
      emergency ID documents go through the neighbouring administrative community, and citizens are told to check invoices apparently issued by
      the town hall because forgeries are possible. No vector, malware family or group is public.
