    sources:
      - { url: "https://www.eichstaett.de/aktuelles/cyber-attacke_krisenstab_faehr-2843/", publisher: "Stadt Eichstätt (official notice, 2026-10-13 17:19)", date: "2026-10-13", role: "primary" }
