    summary: |
      Readers alerted heise to a weakness in an Amadeus travel-booking display environment. heise found current booking data searchable by surname,
      with full names, dates of birth, booking codes (PNR), contact data and ID or passport data in plaintext, largely for Lufthansa, Condor and other
      airlines and partner airlines. By heise's initial analysis the leak was not limited to single sites: the heap dump of a Spring Boot application
      was reachable on an endpoint without authentication and contained credentials and authentication tokens, and the administrator passwords in it
      gave read and write access to the global system; hundreds of travel-agency office IDs in Germany were in the data. Amadeus told heise it was
      made aware of a potential vulnerability on 2026-09-21, that payment or financial data could not be retrieved, that the issue is fixed and
      monitoring strengthened, and that the investigation continues; whether unauthorised parties accessed data is open, and no victim count is given.
      heise's request to the BSI is unanswered. heise also notes an earlier Amadeus iHotelier incident affecting Maritim hotel guests.
