      - { url: "https://www.netzwoche.ch/news/2026-10-13/kuehlschraenke-von-supermarktketten-gehackt-und-abgetaut", publisher: "Netzwoche (Swiss relay of La Dépêche)", date: "2026-10-13", role: "context" }
    discovery_trace: "first seen at: WebSearch (\"Danfoss Kühlanlagen Cyberangriff Supermärkte Frankreich CERT-FR Intermarché Leclerc Ermittlungen\") -> re-read of the already-cited primary https://www.cert.ssi.gouv.fr/alerte/CERTFR-2026-ALE-012/ (extract and raw url fetch), whose version table now reads 12 October 'Version initiale' and 13 October 'Ajout d'autres équipements ciblés' -> context: https://itwire.com/guest-articles/guest-research/chilling-discoveries-claroty-finds-multiple-security-vulnerabilities-in-danfoss-and-copeland-refrigeration-controllers"
    summary: |
      The store entry on the French supermarket refrigeration attack cites CERT-FR's alert of 2026-10-12, which named Danfoss AK-SM and AK-SC
      controllers. CERT-FR's own version table now records a second version on 2026-10-13, "Ajout d'autres équipements ciblés": the affected-systems
      list reads Copeland xweb, Danfoss AK-SC series, Danfoss AK-SM series and Dixell xweb, and the summary says CERT-FR knows of numerous
      compromises of remote controllers for refrigeration installations of all four. The guidance is rewritten as two paths. Not compromised:
      remove internet exposure from the affected units and from every unit reachable on a public IP; check the whole configuration, defrost windows
      in particular; check insurance terms before cutting the data feed to the refrigeration contractor; restore access only through a secure VPN or
      protected network (filtering to the contractors' source IPs is accepted only as an emergency stop-gap); apply the maker's good practice, for
      Danfoss updating firmware, setting security level Strict and confirming default passwords were changed. Compromised: remove exposure, factory
      reset, reconfigure, restore access by the same rules. CERT-FR adds that attack campaigns are probably still running, that keeping an
      unpatched end-of-life unit on the internet makes compromise very probable, and that a factory reset alone is insufficient there, because it
      removes the persistence but leaves the device vulnerable and almost certainly to be compromised again. Context: Claroty Team82 published
      research in August 2026 on the Danfoss AK-SM 800A and the Copeland XWEB Pro (the store already holds both entries); CERT-FR does not say which
      flaws or which Dixell/Copeland products were used, and the CERT-FR page gives no vendor-side fix for the added products.
    region_nexus: "France (CERT-FR); Europe-wide exposure of internet-reachable refrigeration supervisors, Swiss deployment unconfirmed"
