    extended_notes: |
      EXPOSURE: ColdFusion version via the ColdFusion Administrator/update level (2025 Update 13 or earlier, 2023 Update 25 or earlier); AEM via Cloud Service build, 6.5 service pack and installed hotfix list; Commerce/Magento via the 2.4.x-2026-sep or earlier release. Internet-facing author or publish instances and storefronts are the exposed assets. The AEM CVEs are scored AV:N/AC:L/PR:N/UI:N/S:C.
      DETECTION (class): web access logs for unexpected requests to upload or administrative endpoints followed by new executable files in web roots (ColdFusion upload path), new JSP/CFM files, or outbound requests from the application server to internal metadata or management addresses (SSRF); no exploit behaviour is published. Per Adobe, no exploitation is known, so there is no compromise to look for beyond routine webshell checks.
      CONTEXT: watchTowr Labs published an analysis of the earlier ColdFusion bulletin APSB26-68 on 2026-07-02 (labs.watchtowr.com feed); public root-cause write-ups of ColdFusion bulletins exist, which is context for patch urgency, not a claim about this bulletin.
      Other Adobe October bulletins (Photoshop, Content Credentials SDK, Substance 3D Stager, FrameMaker, Substance 3D Designer, Dimension, Bridge, Substance 3D Sampler) are Priority 3 and hold no critical fixes (Ivanti).
