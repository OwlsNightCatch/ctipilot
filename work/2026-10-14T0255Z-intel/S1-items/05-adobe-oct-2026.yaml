    summary: |
      Adobe's 2026-10-13 release (10 bulletins, 141 CVEs per Ivanti) puts its critical fixes into three server products, all with the statement "Adobe is not aware of any exploits in
      the wild". ColdFusion APSB26-144 (2025 up to 2025.0.13 and 2023 up to 2023.0.25 affected; fixed in 2025.0.14 and 2023.0.26) lists four network-reachable,
      unauthenticated flaws at CVSS 9.0 or more: CVE-2026-105899 (unrestricted file upload leading to code execution, 10.0), CVE-2026-106622 (server-side request forgery
      with privilege escalation, 10.0), CVE-2026-106624 (improper input validation leading to code execution, 9.8) and CVE-2026-106619 (code execution, 9.0, high complexity),
      plus authenticated code-execution flaws at 9.9 and 9.6. Experience Manager APSB26-152 (AEM Cloud Service 2026.9.28187 and earlier, 6.5 up to Service Pack 25, 6.5 LTS up to Service Pack 3) has three
      incorrect-authorization flaws leading to arbitrary code execution, scored 10.0 with no privileges or interaction (CVE-2026-90532, CVE-2026-48383, CVE-2026-48382), fixed by Cloud Service 2026.9.28386 and
      per-issue hotfixes on 6.5 and 6.5 LTS. Commerce and Magento Open Source APSB26-153 (2.4.x builds up to 2026-sep) carries a template-engine injection leading to code
      execution (CVE-2026-103849, 10.0) and an incorrect-authorization code-execution flaw (CVE-2026-92909, 9.8), both unauthenticated, fixed in the 2026-oct builds; customers also need the CVE-2026-75650 hotfix from the
      2026-09-07 APSB26-146 update. The ColdFusion solution table rates both fixes priority 1 while the bulletin summary and Adobe's listing say priority 2.
