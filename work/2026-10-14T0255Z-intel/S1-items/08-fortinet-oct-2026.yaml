    summary: |
      Fortinet's 2026-10-13 advisories contain one network-reachable, unauthenticated flaw at CVSS 9.0 or more: FG-IR-26-180 (CVE-2026-106173, CVSS 3.1 9.4 per ENISA EUVD), a path traversal in the
      FortiSIEM phQueryMaster gRPC service that an unauthenticated attacker can use with crafted packets to execute code or commands. Only FortiSIEM 7.5.0 is affected (fixed in 7.5.1; 7.6 not
      affected, FortiSIEM Cloud not affected) and Fortinet's workaround is restricting access to TCP port 27918. A second class is FortiSandbox: FG-IR-26-185 is a remote unauthenticated
      GUI authentication bypass through an alternate path or channel (CWE-288; 5.0.0 to 5.0.6 fixed in 5.0.7, 4.4.0 to 4.4.9 fixed in 4.4.10, 5.2 not affected), and FG-IR-26-179, reported by watchTowr, is a hard-coded cryptographic
      key in the FortiSandbox and FortiSandbox Cloud API that lets an unauthenticated attacker reach some endpoints (CVE-2026-106172, 4.9; fixed in 5.0.7 and an upcoming 5.2.2). Other items need privileges or a cluster-node certificate:
      FortiManager fgfmsd command injection requires the cluster node's certificate and key (FG-IR-26-177, CVE-2026-106171, 5.3, fixed in 7.6.7 and 8.0.1), FortiAnalyzer/FortiManager SQL injection by a low-privileged user (FG-IR-26-178), FortiMail webmail SQL
      injection by an authenticated user (FG-IR-26-184), a FortiOS GUI denial of service (FG-IR-26-181, 7.6.4 to 7.6.6 and 8.0.0) and a FortiSIEM broken-authorization flaw needing authentication (FG-IR-26-183). No advisory states exploitation. The FortiMail zero-day (FG-IR-26-175) was last revised on 2026-10-07, so there is no new development on it.
