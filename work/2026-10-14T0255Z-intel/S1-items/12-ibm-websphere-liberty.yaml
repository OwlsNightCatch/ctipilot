  - title: "IBM WebSphere Liberty 17.0.0.3 to 26.0.0.10: unauthenticated SAML session-fixation authentication bypass (CVE-2026-93909) and gRPC access-control bypass (CVE-2026-93895), both CVSS 9.1, fixed only by interim fixes until fix pack 26.0.0.11"
    sources:
      - { url: "https://www.ibm.com/support/pages/node/7292236", publisher: "IBM Security Bulletin (CVE-2026-93909, samlWeb-2.0)", date: "2026-10-13", role: "primary" }
      - { url: "https://www.ibm.com/support/pages/node/7292228", publisher: "IBM Security Bulletin (CVE-2026-93895, CVE-2026-95695, CVE-2026-95696, grpc-1.0)", date: "2026-10-13", role: "primary" }
    discovery_trace: "first seen at: enisa-euvd bridge https://euvdservices.enisa.europa.eu/api/search?fromDate=2026-10-12&toDate=2026-10-14&fromScore=9&toScore=10&page=0&size=100 (EUVD-2026-100498 CVE-2026-93909 and EUVD-2026-100497 CVE-2026-93895, both 9.1, published 2026-10-13) → primary: IBM bulletins https://www.ibm.com/support/pages/node/7292236 and https://www.ibm.com/support/pages/node/7292228 (EUVD references)"
    summary: |
      IBM published two Liberty bulletins on 2026-10-13. CVE-2026-93909 (CWE-384 session fixation, CVSS 3.1 9.1, AV:N/AC:L/PR:N/UI:N) is an authentication bypass in WebSphere Application Server Liberty 17.0.0.3 through 26.0.0.10 when the samlWeb-2.0 feature
      is enabled; CVE-2026-93895 (CWE-284, 9.1) lets an unauthenticated remote attacker bypass the access controls configured on gRPC service methods in 20.0.0.12 through 26.0.0.10 when the grpc-1.0 feature is enabled, and the same bulletin lists CVE-2026-95695
      (incorrect authorization, 7.4) and CVE-2026-95696 (uncaught exception denial of service, 6.5). IBM lists no workaround; the fix is an interim fix (APARs DT502359 for SAML and DT502929 for gRPC, after raising the install to the interim fix's minimum fix pack level) or Liberty fix pack 26.0.0.11, targeted for the
      fourth quarter of 2026. IBM does not state exploitation, and no other source was found reporting it.
    region_nexus: "global; Liberty runs many Java applications of administrations, SAML single sign-on is a common integration (use in Swiss bodies not confirmed from sources)"
