    summary: |
      Microsoft's October 2026 Exchange security updates, released 2026-10-13, fix CVE-2026-70571, a stack-based buffer overflow in Exchange Server that an
      unauthenticated attacker can trigger by sending a specially crafted email that reaches an internal content-conversion process (CVSS 3.1 8.1, AC:H, no user
      interaction; Microsoft marks it Critical and Exploitation More Likely, not exploited or publicly disclosed), and CVE-2026-70279, a cross-site scripting
      spoofing flaw (9.3, UI:R) where an administrator who clicks a crafted link lets the attacker act with that administrator's privileges, also rated Exploitation More Likely.
      Four further Exchange elevation-of-privilege flaws (CVE-2026-77910, CVE-2026-87692, CVE-2026-87695, CVE-2026-87696) are rated Exploitation Less Likely.
      Fixed builds per MSRC: Exchange SE RTM 15.02.2562.056 (KB5128895), 2019 CU15 15.02.1748.055 (KB5128896), 2019 CU14 15.02.1544.050 (KB5128897) and 2016
      CU23 15.01.2507.077 (KB5128898). The Exchange team states October 2026 is the last month Period 2 ESU customers receive newly released updates for Exchange
      2016 and 2019: afterwards updates ship for Exchange SE only, MSRC will stop listing 2016 and 2019 in CVEs, and Microsoft will stop testing them, which it
      says does not mean they are not vulnerable. An earlier security update of 2026-10-02 fixed CVE-2026-96940, a weak-authentication flaw (8.8, authenticated, also Exploitation
      More Likely) that lets a user read other users' mailboxes and attachments in the same organisation (builds ending .075 / .048 / .053); CERT-FR issued an
      advisory for it on 2026-10-05. Exchange Online already carries the fixes. No source reports exploitation of any of these flaws.
