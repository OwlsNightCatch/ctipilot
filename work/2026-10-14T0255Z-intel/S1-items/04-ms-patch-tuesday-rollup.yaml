    extended_notes: |
      Disposition table, read from the CVRF (Threats type 1 string, CVSS vector, Remediations), 1,759 CVRF records in total of which about 350 are imported third-party and Linux kernel CVEs:
      - Exploited: CVE-2026-96951 only (own item). Publicly disclosed: CVE-2026-108398 (.NET Framework 3.5, 4.6.2 to 4.8.1 per Ivanti) and CVE-2026-92707 (MessagePack-CSharp).
      - Zero-interaction Outlook RCEs (Exploitation Less Likely): update Outlook through the October Office updates; Mac LTSC fixes were announced as not yet available at release for some of these (MSRC FAQ), so check for the CVE revision.
      - Unauthenticated network CVSS 9.0+ not exploited, by component (all Exploitation Less Likely or Unlikely): see summary; additionally Text Shaping (CVE-2026-102210, CVE-2026-83770, CVE-2026-97814), Windows Error Reporting (CVE-2026-83519, CVE-2026-83693, CVE-2026-83748, CVE-2026-97815), Media Foundation (CVE-2026-83517, CVE-2026-85814), PostScript printer driver (CVE-2026-70147, CVE-2026-70153), Windows Imaging Component (CVE-2026-69886), Windows Media Player (CVE-2026-96096), Windows Shell (CVE-2026-83782), OLE (CVE-2026-96924), BitLocker (CVE-2026-96909), Schannel spoofing 9.0 with AC:H (CVE-2026-105008, CVE-2026-85818), AD FS spoofing 9.1 (CVE-2026-96252), ASP.NET Core 9.1 and 9.4 request smuggling (CVE-2026-70188, CVE-2026-88092), Visual Studio Code 9.6 with user interaction (CVE-2026-102238), Windows Search component 9.8 (CVE-2026-105010), and cloud-service CVEs with no customer action (Azure App Service CVE-2026-77900, Dataverse CVE-2026-88131, Partner Center CVE-2026-96207 at 10.0, Bookings CVE-2026-94510, Azure SRE Agent CVE-2026-69435).
      - Remote Desktop: no CVSS 9+ flaw; the unauthenticated RDS and Gateway RCEs score 8.1 with AC:H (CVE-2026-70187, CVE-2026-84012, CVE-2026-100218); Ivanti names Remote Desktop Services among the network-facing Critical hits.
      - Lifecycle (Rapid7, Ivanti): Windows Server 2012 and 2012 R2 ESU year 3 ends 2026-10-14 with no further year; Office 2021 and Office LTSC 2021 reach end of support 2026-10-14; Windows 11 24H2 Home and Pro reach end of servicing 2026-10-13; Windows 10 commercial ESU year 1 ends 2026-10-13.
      - Edge: Rapid7 reports Microsoft's Security Update Guide listed zero Edge CVEs for the first 13 days of October ("CVE's will be added as soon as available"), so Chromium-based fixes in Edge cannot be mapped to CVEs yet.
      Hunt/hardening focus: apply the Outlook and Windows server-role updates in that order of exposure (mail clients, DNS/DHCP/IIS/RRAS/NPS hosts reachable from untrusted segments); there is no exploitation evidence to key detection on.
