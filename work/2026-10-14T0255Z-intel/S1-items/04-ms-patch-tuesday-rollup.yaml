    summary: |
      Microsoft's 2026-10-13 release (the largest yet; Rapid7 counts 1,413 own-product CVEs, 1,102 of them Windows; Ivanti counts 1,407 with 78 Critical) contains
      exactly one flaw marked exploited, CVE-2026-96951 (Windows Shell MOTW bypass, covered separately), and two marked publicly disclosed: CVE-2026-108398, a
      .NET Framework security feature bypass (8.8, local, needs an existing foothold to register a malicious assembly for a protected process and defeat WDAC /
      App Control; Exploitation Less Likely) and CVE-2026-92707, a MessagePack-CSharp denial of service (5.3). The urgent unauthenticated class is client-side:
      five Outlook RCEs (CVE-2026-70242, CVE-2026-97749, CVE-2026-97016, CVE-2026-88156, CVE-2026-70291; CVSS 9.8, no interaction), where Rapid7 says the preview pane is a
      vector for all five and MSRC says so explicitly for CVE-2026-70291 and CVE-2026-88156; further Word (CVE-2026-70300), PowerPoint (CVE-2026-88178) and Raw Image
      Extension (CVE-2026-21413) RCEs at 9.8. Network services with unauthenticated 9.8 RCEs, all rated Exploitation Less Likely or Unlikely and none exploited:
      DNS Server (CVE-2026-96113, CVE-2026-83869), DHCP Server (CVE-2026-96320, CVE-2026-96934), IIS (CVE-2026-70024), RRAS (CVE-2026-85792, CVE-2026-85809), Network
      Policy Server (CVE-2026-100222, CVE-2026-85806), Message Queuing (CVE-2026-100202), QUIC (CVE-2026-100219, CVE-2026-105016), LSASS (CVE-2026-96219), RPC Runtime
      (CVE-2026-83910), iSCSI (CVE-2026-69634, CVE-2026-69705, CVE-2026-69883), Failover Cluster (CVE-2026-88102, CVE-2026-96864), OpenSSH for Windows (CVE-2026-97816)
      and PowerShell (CVE-2026-83578). Microsoft's own Exploitation More Likely marker sits mostly on local privilege escalations (Win32k, Windows Update, DWM,
      CLFS, kernel) plus Windows Active Directory Domain Services RCE CVE-2026-70229 (Critical, 8.1, AC:H, unauthenticated crafted packet).
