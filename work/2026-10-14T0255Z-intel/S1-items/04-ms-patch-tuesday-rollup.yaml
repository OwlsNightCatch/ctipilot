  - title: "Microsoft October 2026 Patch Tuesday (about 1,400 CVEs): one exploited zero-day, two publicly disclosed flaws, five zero-interaction Outlook preview-pane RCEs and some 60 unauthenticated network CVSS 9+ Windows and Office flaws, none flagged exploited"
