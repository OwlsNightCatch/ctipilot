    extended_notes: |
      EXPOSURE: check whether the agent and customer authentication settings use the Kernel::System::Auth::HTTPBasicAuth / Kernel::System::CustomerAuth::HTTPBasicAuth modules named in ZSA-2026-14, and the web server mode (CGI or mod_perl exposes HTTP_* request headers as environment variables); installations authenticating through the database, LDAP or SSO modules without HTTP Basic are not in scope of this specific flaw. Znuny version from the admin interface (fixed: LTS 6.5.25, 7.3.7).
      DETECTION (class): web server access logs for requests carrying a Remote-User header from clients (a reverse proxy normally strips or overwrites it), successful agent or customer logins whose session has no Authorization header, and logins for privileged users from unusual addresses; Generic Interface (webservice) calls authenticating without credentials.
      HARDENING: upgrade Znuny to LTS 6.5.25 or 7.3.7, migrate OTRS CE 6 to OTRS 2026.7.1 or Znuny, strip the Remote-User and HTTP_REMOTE_USER headers at the reverse proxy until patched; the related OTRS flaw CVE-2026-78357 (JWT stays valid after a password change, up to about 16 hours, OSA-2026-14) is a smaller issue.
