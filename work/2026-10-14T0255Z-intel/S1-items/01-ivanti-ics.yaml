    extended_notes: |
      CISA's alert of 2026-10-13 (read through WebFetch, so its wording is a summariser's) confirms threat actors are exploiting the flaw for credential theft and data exfiltration, repeats the affected lines 25.1.1.1 and earlier, 25.1.2.2 and earlier and 22.8R2.4 and earlier, states that determining compromise needs network and memory forensics because the Integrity Checker Tool may miss in-memory activity, and gives the recovery sequence for a suspected compromise: back up the configuration, factory-reset and upgrade (rebuild cloud and virtual appliances), restore the configuration, then reset all domain, administrator and local account passwords, revoke and reissue stored certificates and reset stored API keys and licence-server credentials. CISA says version 22.8 reaches end of life on 2027-01-31; the KEV entry carries a 2026-10-16 due date and the forensic-triage flag.
      EXPOSURE: compare the running Connect Secure build with these lines; affected are 25.1.1.1 and prior, 25.1.2.2 and prior, 22.8R2.4 and prior (Rapid7 table from Ivanti's advisory). The CVE record (Ivanti CNA, fetched via cveawg) lists 25.1.3.0, 25.1.3.1, 22.8R2.5 and 22.7R2.14 as unaffected and says "This does not impact ICS version 22.7R2.14 or prior"; Ivanti's roundup blog adds 25.1.1.2 as a fixed build. Rapid7 says a portion of the flaw was found through Ivanti's own program and patched in 25.1.3.0 in July 2026 and that exploitation occurred while the fix was backported.
      DETECTION (Volexity, behavioural): web/reverse-proxy or appliance request logs for high volumes of requests to the welcome.cgi login CGI whose X-DSCGI-PATH header names a different script (mismatch between URL path and header target; the header path under /home/webserver/htdocs/dana/fb/smb/wu.cgi or /home/runtime/tmp/<hash> in observed cases); appliance egress/lateral traffic originating from the VPN device toward domain controllers (LDAP service-account binds querying LAPS and BitLocker attributes, Kerberos credential-testing and Kerberoast-capable activity, password-spray bursts); a hidden .icscap capture directory and a renamed capture binary; unexpected /tmp scripts. Because the chain is memory-resident, a clean Integrity Checker Tool result is NOT evidence of no compromise; Volexity advises network and memory forensics (Ivanti publishes recovery steps for 22.8x and 25x). Volexity states debug and audit logs on the device were trimmed, so absence of log entries is not reassuring.
      TRIAGE: the legitimate welcome.cgi login traffic is ordinary; the discriminator is a request to it carrying an X-DSCGI-PATH header at all, or one whose value differs from the URL path.
      HARDENING/ACTION: upgrade to a fixed build now, then rotate the AD service account the appliance uses for LDAP, the LAPS/BitLocker-exposed secrets reachable from it, and any credentials in the appliance configuration; restrict the management plane; plan the move off 22.x (end of life per Ivanti 2027-01-31). Ivanti's privilege escalation component remains unpatched, so a patched build still has an unfixed local root path for an actor with code execution.
      Registry: Ivanti Connect Secure is the renamed Pulse Connect Secure; the registry key product:ivanti-pulse-connect-secure exists (first_seen 2026-10-09, no aliases): suggest adding aliases "Ivanti Connect Secure", "ICS".
