    extended_notes: |
      EXPOSURE: on a switch, show feature | include ngoam (and mpls oam) tells whether the feature is enabled; for CVE-2026-76486 also show nve vni and show nve peers (Cisco's own checks). Fixed releases come from Cisco's Software Checker (first fixed release per advisory); Cisco Nexus 9000 in ACI mode is not listed as affected by the NGOAM advisory (standalone NX-OS mode only).
      DETECTION (class): unexpected process crashes and reloads of NX-OS OAM processes and unsolicited OAM/ping traffic to management or data-plane interfaces from untrusted networks; Cisco publishes no exploit behaviour. For License On-Prem: web access logs of password-reset requests for administrative accounts and API writes by unauthenticated clients.
      HARDENING: disable NGOAM and MPLS OAM where unused, apply Live Protect shields or upgrade, keep License On-Prem off untrusted networks.
