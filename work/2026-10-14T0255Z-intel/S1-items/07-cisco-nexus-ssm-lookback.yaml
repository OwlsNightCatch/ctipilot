    discovery_trace: "first seen at: ncsc-csh bridge (python3 tools/fetch_source.py ncsc-csh recent 25; post 13044 '[Advisory] Cisco Nexus Switches and License On-Prem: Multiple Critical RCE Vulnerabilities', created 2026-10-09T09:21Z, not covered by prior_coverage.json) → pivot: Cisco PSIRT feed https://sec.cloudapps.cisco.com/security/center/psirtrss20/CiscoSecurityAdvisory.xml (bundle of 2026-10-07) → primary: the three Cisco advisories above (extract)"
    summary: |
      Cisco published a bundle on 2026-10-07 (NCSC Switzerland's advisory followed on 2026-10-09) whose critical items are not yet in the store. Cisco Nexus 3000 and 9000 Series
      switches in standalone NX-OS mode are affected by unauthenticated, remote code execution with root privileges and denial of service through the Next Generation OAM (NGOAM)
      feature (CVE-2026-76485 needs only NGOAM enabled; CVE-2026-76486 additionally SRv6 or NV Overlay with an EVPN VNI and a learned VTEP peer; CVE-2026-76501 needs NGOAM and SRv6; CVSS 9.8) and, separately, through the MPLS OAM feature
      (CVE-2026-76465, CVSS 9.8), all triggered by crafted IP packets sent to an interface of the switch. Cisco says there is no workaround, but disabling the feature removes the attack vector (no feature ngoam; no feature mpls oam) and Live Protect
      shields exist for these CVEs on 10.6(3). Separately, Cisco License On-Prem (formerly Smart Software Manager On-Prem), regardless of configuration, has an unauthenticated arbitrary account password reset
      in the web management interface (CVE-2026-20328, 9.1) and an unauthenticated Smart Licensing Utility API flaw that writes arbitrary files or causes denial of service (CVE-2026-76454, 9.1); no workaround.
      Cisco's PSIRT says it is not aware of public announcements or malicious use of the NX-OS vulnerabilities, which were found in internal testing. NCSC's post lists a different License On-Prem CVE set (including a 10.0 score) than the Cisco advisory
      that was read here, so the Cisco advisory identifiers are used.
