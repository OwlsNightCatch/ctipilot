    discovery_trace: "first seen at: enisa-euvd bridge https://euvdservices.enisa.europa.eu/api/search?fromDate=2026-10-12&toDate=2026-10-14&fromScore=9&toScore=10&page=0&size=100 (EUVD-2026-98842 CVE-2026-69227, 9.8, published 2026-10-13 16:03 UTC) → primary: the EUVD reference https://www.esri.com/arcgis-blog/products/trust-arcgis/administration/september-2026-arcgis-security-bulletin (dated 2026-09-24)"
    summary: |
      Esri's Portal for ArcGIS 2026 Security Update 4 patch, released 2026-09-24, fixes one critical and two medium flaws in Portal for ArcGIS 12.1 and earlier; the CVE identifiers were reserved at the time and the
      critical one, CVE-2026-69227, reached the CVE and ENISA EUVD records on 2026-10-13. Per Esri it is a missing authentication check (CWE-306) that lets an unauthenticated attacker reach administrative
      functionality on /portaladmin/local API endpoints under specific conditions (CVSS 3.1 9.8, temporal 9.4; Esri's vector carries E:H, exploit-code maturity High, on all three issues); all Portal for ArcGIS 12.1 and earlier versions are affected and the cumulative patch fixes all three issues.
      Esri's mitigation for CVE-2026-69227 is to temporarily remove any configured New Member default user type and role (the organisation's self/userDefaultSettings resource), because without it account-creation
      restrictions cannot be bypassed; a web application firewall and the basic profile of the ArcGIS hardening guide reduce exposure. Esri does not state exploitation and no other source was found reporting it.
