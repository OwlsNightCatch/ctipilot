    extended_notes: |
      EXPOSURE: Portal for ArcGIS version 12.1 or earlier without "Portal for ArcGIS 2026 Security Update 4"; the Esri mitigation note says the CVE-2026-69227 condition depends on a configured New Member default user type and role (check the organisation's self/userDefaultSettings).
      DETECTION (class): web/reverse-proxy logs for unauthenticated requests to /portaladmin/ paths; new accounts or role changes created without a normal sign-up flow; portal admin API audit entries without an authenticated principal.
