    extended_notes: |
      MSRC title is "Windows Shell Security Feature Bypass Vulnerability"; CISA's KEV name is "Microsoft Windows Command Injection Vulnerability" (CWE-77); the three-day KEV due date and "forensicTriage: Yes" flag come from the KEV record. CVSS vector CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H/E:F/RL:O/RC:C (temporal 8.2). The MSRC advisory lists reporters from multiple organisations, none from Microsoft (Rapid7).
      EXPOSURE: any supported Windows client or server where a user opens files or links from mail, chat or the web; patched build is the October 2026 cumulative update for the release in use (builds above).
      DETECTION (class): the bypass removes the MOTW-driven prompt, so there is no user-visible warning to rely on. Hunt for execution of freshly delivered content (archives, shortcuts, documents) from mail and download paths where the usual SmartScreen/Protected View evaluation events are missing, process-creation lineage from explorer.exe into scripting and LOLBin children shortly after a mail or browser download event, and download-to-execute timing; mail gateway and EDR file-origin telemetry are the control points. Treat this as a hunt hypothesis: no source publishes the exploit's behaviour.
      TRIAGE: benign lookalike is normal user opening of local or trusted-zone files, which also lacks MOTW; the discriminator is origin (mail or web download, internet-zone) together with absent MOTW evidence on the opened item.
      HARDENING: deploy the cumulative update; attachment blocking and mail-gateway detonation compensate for a MOTW bypass because the tag is the control that failed.
      Gap: no source describes the exploitation campaign; revisit when Microsoft, CISA or a lab publishes it.
