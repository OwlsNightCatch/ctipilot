coverage_gaps:
  - { source_id: "ivanti-psirt", reason: "NOT IN SLICE but the only readable first-party route for CVE-2026-104935: RSS https://www.ivanti.com/blog/topics/security-advisory/rss (direct) then `extract https://www.ivanti.com/blog/october-2026-security-update` works; the advisory pages on hub.ivanti.com (301 from forums.ivanti.com) are JS-only and return a loading shell on url, extract, WebFetch and jina (jina returned an empty body). Suggest promoting ivanti-psirt to essential for S1 on every second Tuesday and keeping the hub page marked unreadable." }
  - { source_id: "adobe-psirt", reason: "not in slice; readable: bridge url on the Chimera collection API (size=400, newest cards at the end of the result) lists bulletins; per-bulletin pages at https://www.adobe.com/trust/security/products/<product>/<apsb-id> read raw with `url`, whose CVE blocks (category, impact, severity, CVSS) are in <div><strong>CVE-…</strong></div> accordions, NOT tables, so `extract` drops them and only raw HTML parsing recovers the per-CVE table. helpx.adobe.com/security/security-bulletin.html now 403s on WebFetch and is a stub." }
  - { source_id: "cisco-psirt", reason: "not in slice and last_successful_fetch 2026-10-03: the PSIRT RSS https://sec.cloudapps.cisco.com/security/center/psirtrss20/CiscoSecurityAdvisory.xml reads direct (dated items) and the per-advisory pages read with extract, but the 2026-10-07 Nexus/License On-Prem critical bundle reached the store zero times (found only through NCSC.ch post 13044). Suggest rotating cisco-psirt into S1 on the first Wednesday after a bundle." }
  - { source_id: "sap-security-notes", reason: "not in slice: SAP's own Patch Day page is readable with `extract https://support.sap.com/en/my-support/knowledge-base/security-notes-news/<month>-<year>.html` (full table of notes, CVE ids, CVSS vectors, affected components), so the SAP primary needs no login or aggregator." }
  - { source_id: "siemens-productcert", reason: "not in slice, last_successful_fetch null: `feed https://cert-portal.siemens.com/productcert/rss/advisories.atom 80` works direct (items dated, titles with SSA ids); per-SSA pages read with extract." }
  - { source_id: "msrc-update-guide", reason: "recipe note for sources.json: `msrc cvrf 2026-Oct` returns 45 MB JSON with 1,759 vulnerabilities; per CVE the exploitability string sits in Threats type 1, severity in Threats type 3, impact type 0; Remediations (SubType 'Security Update') carry KB number in Description.Value and FixedBuild; Notes hold the FAQ text; `msrc cve <id>` gives the same FAQ text with publiclyDisclosed/exploited flags. A short parser over the CVRF reproduces the 'exploited / publicly disclosed / critical network pre-auth' enumeration in one pass." }
  - { source_id: "tenable-research", reason: "feed items carry no published date (empty field), so a window check on the feed alone is impossible; only titles are usable" }
  - { source_id: "bsi-de", reason: "`bsi-rss` returned 250 items reaching back to about 2026-10-13 12:00 UTC only for the [NEU] items (feed generated before the later Patch Tuesday advisories); per-advisory `bsi-csaf WID-SEC-…` works. A BSI WID advisory for the Ivanti zero-day did not exist yet at fetch time." }

