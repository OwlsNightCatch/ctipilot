items:
  - title: "Group-IB names WindRelay: a purpose-built NFC-relay Android malware paired with a personalized SpyNote RAT for live-call, dual-channel bank fraud"
    sources:
      - { url: "https://www.group-ib.com/blog/windrelay-nfc-spynote-rat-combo-fraud/", publisher: "Group-IB", date: "2026-08-12", role: "primary" }
      - { url: "https://www.group-ib.com/blog/rss.xml", publisher: "Group-IB (blog feed)", date: "2026-08-12", role: "corroborating" }
    discovery_trace: "first seen at: group-ib (source-list slice, rotation), URL https://www.group-ib.com/blog/rss.xml → primary: Group-IB, URL https://www.group-ib.com/blog/windrelay-nfc-spynote-rat-combo-fraud/ (no pivot needed — Group-IB is the originating research lab and the RSS entry links straight to its own full write-up)"
    summary: |
      Group-IB's Fraud Protection team documents a previously unseen Android NFC-relay malware
      family it tracks as WindRelay, deployed together with a personalized build of the
      commodity SpyNote RAT inside a live vishing call. The caller poses as a bank employee
      reporting a card problem and keeps the victim on the phone for the entire intrusion rather
      than relying on a one-time phishing link or SMS code. The victim is talked into sideloading
      a SpyNote APK whose app label and package are compiled per-target with the victim's own
      name — SpyNote's builder toolkit supports this personalization natively — which removes the
      "unfamiliar app name" cue victims are trained to check. Once SpyNote's Accessibility Service
      access is active, the operator uses it to silently sideload a second APK, WindRelay, without
      any further victim interaction and without ever triggering screen-share detection. WindRelay
      requests NFC (card-data capture at the moment of tap), INTERNET/ACCESS_NETWORK_STATE (live
      exfiltration of the captured EMV exchange, including the transaction's one-time
      authentication cryptogram, to a second device the fraudster controls that presents itself as
      the card to a real POS terminal or ATM), READ_CONTACTS (further-victim discovery), an
      unusual DUMP permission (device/security-tooling inspection), and custom self-defined
      permissions to hinder security-tool interop. In the documented case the operator combined
      two payout channels in one 13-minute call: a digital loan taken out through the RAT's
      banking-app access, and a card-present cash-out via the NFC relay — a deliberate
      dual-monetization pattern. Group-IB correlated 23 WindRelay samples uploaded to VirusTotal
      between November 2025 and July 2026, using localized text and impersonated institutions
      across Czechia, Slovakia and Slovenia, indicating a toolkit capable of dynamically compiling
      per-victim builds rather than a single incident. This is a distinct technique/malware family
      from the previously reported NFCGate/NGate and "Ghost Tap" NFC-relay tooling that has
      circulated in Central/Eastern Europe since late 2023 — WindRelay is purpose-built rather than
      a modified open-source relay tool, and its pairing with a RAT for silent, screen-share-free
      installation is the novel element Group-IB highlights.
    region_nexus: "Czechia, Slovakia, Slovenia (EU member states) — directly within the coverage focus's European remit; the same NFC-relay technique class has already spread across the wider Central/Eastern European region per cited ESET/Zimperium/Kaspersky telemetry, so it is a plausible near-term risk for Swiss and other European retail-banking constituents"
    primary_sector_nexus: "indirect"
    sector: "finance"
    cves: []
    techniques: [T1566.004, T1204.002, T1219, T1041]
    affected_products: ["Android (sideloaded APK ecosystem)"]
    entity_keys: []
