          basis: "Group-IB: SpyNote's Accessibility Service access is used by the operator to silently sideload WindRelay onto the same device mid-call, with no further victim action and no screen-sharing (Group-IB, 2026-08-12)" }
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    evidence:
