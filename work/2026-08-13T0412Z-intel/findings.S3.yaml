      - quote: "This NFC malware is deployed together with SpyNote, a known RAT. SpyNote's Accessibility Service access lets the fraudster sideload and activate the NFC app silently, with no screen sharing ever triggered."
        attribution: "Group-IB"
        source_url: "https://www.group-ib.com/blog/windrelay-nfc-spynote-rat-combo-fraud/"
      - quote: "We identified 23 samples uploaded to VirusTotal between November 2025 and July 2026."
        attribution: "Group-IB"
        source_url: "https://www.group-ib.com/blog/windrelay-nfc-spynote-rat-combo-fraud/"
    extended_notes: |
      Single-source (Group-IB only; Admiralty-equivalent reliability B per sources.json, own
      first-hand fraud-protection engagement plus VirusTotal-corroborated sample correlation —
      no second independent lab has yet written this up, hence MEDIUM confidence / SINGLE-SOURCE-OTHER
      rather than a national-CERT carve-out). Distinguish clearly in composition from the
      well-covered NFCGate/NGate/"Ghost Tap" NFC-relay lineage (Kaspersky, ESET, Zimperium,
      Group-IB's own prior "Ghost Tapped" Chinese-language report) — those are cited by Group-IB
      itself only as background/context for the growth of the NFC-relay fraud category; WindRelay
      is presented as a distinct, purpose-built family and the RAT-pairing/personalization/silent-
      install chain is the actual finding. Detection angle for defenders: flag package-installer
      (sideload) events during an active voice call session, Accessibility-Service grants followed
      within minutes by a second sideload event with no user-visible screen-share, and NFC +
      DUMP + custom self-defined permission combinations on a freshly sideloaded APK — each is
      stated explicitly by Group-IB as a detection lever. No CVE (social-engineering + legitimate
      Android sideload/Accessibility APIs abused, not a software vulnerability).

