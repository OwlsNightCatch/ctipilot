        attribution: "John Strand, owner, Black Hills Information Security"
        source_url: "https://www.bankinfosecurity.com/ransomware-attack-disables-canadian-hospitals-doors-hvac-a-32535"
    extended_notes: |
      No CVE or specific initial-access vector disclosed by Shared Health as of publication; the entry's value is
      the OT/BAS-targeting pattern and its concrete hardening prescriptions, not attribution or a specific exploit.
