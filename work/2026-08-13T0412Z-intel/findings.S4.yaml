      source code, and states it turned down interest from buyers in China before choosing to release the data
      openly. This is an unverified motive claim from the extorting group itself, attributed accordingly. The
      technique class is the same as previously reported (T1213 Data from Information Repositories / internal
      ML platform, prior T1567 exfiltration) — the new fact is the specific target class: an internal enterprise
      HuggingFace deployment holding proprietary training data and models, illustrating that breach fallout now
      routinely extends into internal AI/ML tooling and datasets, not just conventional file shares and source
      control. Novo Nordisk had not responded to DataBreaches.net's query on the operational impact of this
      release as of publication.
