  - title: "Ransomware disables doors and HVAC at a major Canadian hospital — facility-management/OT systems as the new extortion lever in healthcare"
    sources:
      - { url: "https://www.bankinfosecurity.com/ransomware-attack-disables-canadian-hospitals-doors-hvac-a-32535", publisher: "BankInfoSecurity (ISMG)", date: "2026-08-12", role: "primary" }
      - { url: "https://databreaches.net/2026/08/12/ransomware-attack-disables-canadian-hospitals-doors-hvac/", publisher: "DataBreaches.net", date: "2026-08-12", role: "corroborating" }
    discovery_trace: "first seen at: databreaches-net, URL https://databreaches.net/2026/08/12/ransomware-attack-disables-canadian-hospitals-doors-hvac/ → primary: BankInfoSecurity, URL https://www.bankinfosecurity.com/ransomware-attack-disables-canadian-hospitals-doors-hvac-a-32535"
    summary: |
      A ransomware attack this week against Winnipeg's Health Sciences Centre (Manitoba's provincial tertiary
      trauma/transplant/burns/pediatric hospital, 570,000+ patients/year, operated by Shared Health) disabled
      building doors and HVAC by hitting facility-management/building-automation systems rather than clinical
      IT — Shared Health confirms "the incident appears to have only impacted certain facility maintenance
      systems," with no indication yet that patient data or clinical systems were affected (T1486 Data Encrypted
      for Impact against OT/building-automation infrastructure; initial access vector not disclosed). No
      ransomware group has claimed the attack as of publication. This is a Canadian incident with no direct
      Swiss/EU nexus, included here because it is a materially evolving, directly transferable technique class
      for this constituency's healthcare and critical-infrastructure defenders: attackers pivoting from
      encrypting clinical/data systems (now harder to monetize as healthcare orgs improve backup/recovery) to
      encrypting the buildings' own facility-management/BAS layer — doors, HVAC, likely elevators and access
      control — to create physical-safety pressure that forces a ransom decision faster than data encryption
      alone. Security experts quoted (MultiCare Health System CISO Jason Elrod; Black Hills InfoSec's John
      Strand; Token's Kevin Surace) converge on the same hardening prescription: apply the same security rigor
      to facility/OT systems as to clinical-data systems — segment and isolate BAS/OT networks from corporate
      IT, maintain accurate OT asset inventories, tightly control remote/vendor access to facility systems with
      phishing-resistant (hardware-bound, biometric) authentication rather than SMS/password fallback, monitor
      OT for abnormal activity, and test recovery plans for OT specifically (not just clinical IT). A Manitoba
      Nurses Union official separately noted the hospital's doors were already flagged as a safety concern
      (unsecured, allowing unauthorized physical entry) before this incident, illustrating how a ransomware-driven
      access-control failure compounds an existing physical-security gap.
    region_nexus: "Canada — included under criterion (b): a materially evolving TTP (ransomware targeting hospital facility-management/BAS/OT systems for physical-disruption leverage) directly transferable to Swiss/European hospital OT environments"
    primary_sector_nexus: "transferable — healthcare OT/BAS security lesson"
    sector: "healthcare"
    cves: []
    techniques: [T1486]
    affected_products: []
    entity_keys: []
    new_entities:
      - { key: "incident:winnipeg-health-sciences-centre-ransomware-ot-2026", type: incident, name: "Winnipeg Health Sciences Centre ransomware (facility/OT)",
          aliases: [],
          summary: "Ransomware attack on Manitoba's Health Sciences Centre (Shared Health) disabled facility-management systems including doors and HVAC; no group has claimed responsibility as of 2026-08-12 (BankInfoSecurity/ISMG)." }
    relation_suggestions: []
