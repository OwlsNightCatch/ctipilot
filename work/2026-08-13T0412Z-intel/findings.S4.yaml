  - title: "MyDr (Poland) confirms criminal intrusion after attackers claim 18.8M PESEL numbers stolen via XXE-to-RCE chain in PKCS#12 certificate handling"
    sources:
      - { url: "https://pro.mydr.pl/portal-info", publisher: "MyDr (official incident statement)", date: "2026-08-12", role: "primary" }
      - { url: "https://zaufanatrzeciastrona.pl/post/hakerzy-twierdza-ze-ukradli-dane-ponad-18-milionow-polek-i-polakow-z-firmy-mydr/", publisher: "Zaufana Trzecia Strona (Adam Haertle)", date: "2026-08-10", role: "primary" }
      - { url: "https://databreaches.net/2026/08/12/a-serious-incident-occurred-at-mydr-a-polish-healthcare-system-provider/", publisher: "DataBreaches.net", date: "2026-08-12", role: "corroborating" }
    discovery_trace: "first seen at: databreaches-net, URL https://databreaches.net/2026/08/12/a-serious-incident-occurred-at-mydr-a-polish-healthcare-system-provider/ → primary: Zaufana Trzecia Strona (original investigation), URL https://zaufanatrzeciastrona.pl/post/hakerzy-twierdza-ze-ukradli-dane-ponad-18-milionow-polek-i-polakow-z-firmy-mydr/ → primary: MyDr's own incident statement, URL https://pro.mydr.pl/portal-info"
    summary: |
      MyDr, one of Poland's largest Electronic Medical Record (EMR/EHR) platforms used by thousands of clinics
      (3M appointments/month, 2.7M prescriptions/month), issued an updated statement on 2026-08-12 (18:35 CET)
      confirming it was the target of a deliberate external criminal act affecting part of its data — its first
      official confirmation after two days of unconfirmed attacker claims. Attackers who contacted Polish
      security journalist Adam Haertle (Zaufana Trzecia Strona) on 2026-08-08 claim to hold 18,814,422 unique
      Polish PESEL (national ID) numbers plus ~2.5TB of exfiltrated data, including a database record for a
      senior Polish politician (PESEL, phone numbers, a prescription) that partially checked out, plus
      screenshots of internal Jira, HubSpot CRM and an SMSApi account. The attackers describe their entry
      vector as remote code execution via an XXE (XML External Entity) flaw in the platform's handling of
      PKCS#12 certificates, which they say yielded a GitHub API key, then the platform's source code, then a
      pivot into AWS-hosted infrastructure (T1190 Exploit Public-Facing Application → T1552.001 Credentials In
      Files for the harvested API key/cloud credentials → T1078.004 Valid Accounts: Cloud Accounts for the AWS
      pivot → T1213 Data from Information Repositories for the GitHub source-code access). MyDr's own statement
      says the affected data is likely historical (2024 and earlier), may not cover all client clinics or
      patients, and that its dark-web monitoring partners have found no evidence yet of public
      publication/sale. Polish PM Gawkowski separately said publicly that "much suggests an unauthorized person
      may have gained access" to the data — an indirect government acknowledgement short of full confirmation.
      Because MyDr is a data processor (not the GDPR controller) for thousands of individual clinics, it says it
      cannot itself notify CERT Polska's breach portal; affected individuals must wait for their own clinic to
      be notified downstream, which the reporting flags as a multi-day-to-weeks lag risk.
    region_nexus: "Poland (EU) — MyDr serves thousands of Polish healthcare facilities"
    primary_sector_nexus: "direct"
    sector: "healthcare"
    cves: []
    techniques: [T1190, T1552.001, T1078.004, T1213]
    affected_products: ["MyDr Electronic Medical Records platform"]
    entity_keys: []
    new_entities:
