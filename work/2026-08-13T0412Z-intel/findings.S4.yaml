  - title: "UK ICO reprimands ACRO Criminal Records Office over a 7-month undetected CMS compromise — patch-ownership gap the root cause, segmentation the save"
    sources:
      - { url: "https://ico.org.uk/action-weve-taken/enforcement/2026/08/acro-criminal-records-office/", publisher: "UK Information Commissioner's Office (formal reprimand)", date: "2026-08-12", role: "primary" }
      - { url: "https://ico.org.uk/about-the-ico/media-centre/news-and-blogs/2026/08/acro-reprimanded-following-cyber-security-failings/", publisher: "UK ICO (press release)", date: "2026-08-12", role: "primary" }
    discovery_trace: "first seen at: ico-uk, URL https://ico.org.uk/action-weve-taken/enforcement/2026/08/acro-criminal-records-office/ (found via ico-uk enforcement sitemap sweep) → primary: ICO press release, URL https://ico.org.uk/about-the-ico/media-centre/news-and-blogs/2026/08/acro-reprimanded-following-cyber-security-failings/"
    summary: |
      The UK Information Commissioner's Office issued a formal reprimand to ACRO Criminal Records Office — the
      UK national policing body that runs criminal-record-check services — for infringing UK GDPR Article
      32(1), 32(1)(b) and 32(1)(d) (security of processing). The ICO's investigation found that between August
      2022 and March 2023 a hacker gained unauthorised access to ACRO's public website and content management
      system (CMS) and staged personal data — of approximately 10,000 UK data subjects, including some
      individuals' sensitive data — for exfiltration; ACRO could not conclusively determine whether the staged
      data was actually removed. Root cause per the ICO: ACRO had engaged third-party providers for patch
      management but failed to establish clear internal accountability for identifying and monitoring critical
      CMS security updates, ran an ineffective patch-management process overall, and did not adequately
      investigate security alerts that could have caught the intrusion earlier (T1190 Exploit Public-Facing
      Application against an unpatched CMS). The mitigating factor the ICO credits: network segmentation
      confined the attacker to the compromised website environment and prevented lateral movement into ACRO's
      core systems, capping the scale of harm. ACRO's remedial steps (credited by the ICO) included
      decommissioning the compromised infrastructure, migrating services, standing up security monitoring, and
      further strengthening segmentation. The ICO's public messaging explicitly frames the two actionable
      lessons for other organisations as (1) act on warning signs — actively monitor, investigate and escalate
      security alerts before they become major incidents, and (2) get the basics right — patch management,
      vulnerability management and regular security testing.
    region_nexus: "United Kingdom — national criminal-records/policing body"
    primary_sector_nexus: "direct"
    sector: "public-sector"
    cves: []
    techniques: [T1190]
    affected_products: []
    entity_keys: []
    new_entities:
      - { key: "incident:acro-criminal-records-office-cms-breach-2022", type: incident, name: "ACRO Criminal Records Office CMS breach",
          aliases: [],
          summary: "Unauthorised access to ACRO Criminal Records Office's website/CMS between August 2022 and March 2023, exposing ~10,000 UK data subjects' personal data; ICO reprimand issued 2026-08-12 citing patch-management accountability gaps as root cause." }
    relation_suggestions: []
    verification: SINGLE-SOURCE-NATIONAL-CERT
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "The ICO's investigation found that between August 2022 and March 2023, a hacker gained unauthorised access to ACRO's website and content management system (CMS). The attacker was able to stage personal information to be stolen, although ACRO could not conclusively determine whether the information was removed from its systems."
        attribution: "UK Information Commissioner's Office"
        source_url: "https://ico.org.uk/about-the-ico/media-centre/news-and-blogs/2026/08/acro-reprimanded-following-cyber-security-failings/"
      - quote: "ACRO did not ensure clear responsibility for identifying and monitoring critical CMS security updates, failed to maintain an effective patch management process, and did not adequately investigate security alerts that could have identified the hacker's activity earlier."
        attribution: "UK Information Commissioner's Office"
        source_url: "https://ico.org.uk/about-the-ico/media-centre/news-and-blogs/2026/08/acro-reprimanded-following-cyber-security-failings/"
      - quote: "Network segmentation prevented the hacker from moving beyond the compromised website environment into core systems, reducing the potential scale of harm."
        attribution: "UK Information Commissioner's Office"
        source_url: "https://ico.org.uk/about-the-ico/media-centre/news-and-blogs/2026/08/acro-reprimanded-following-cyber-security-failings/"
    extended_notes: |
      Underlying intrusion is historical (2022-2023); the reprimand and its accompanying case-study writeup are
      the fresh, in-window artefact and the source of the actionable patch-accountability/segmentation lesson.
      Single-source acceptable under the national-CERT/DPA carve-out (ICO is UK's data-protection authority
      acting as primary disclosing party for its own enforcement decision).
