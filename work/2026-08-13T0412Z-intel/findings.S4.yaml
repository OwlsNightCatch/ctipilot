  - title: "Cl0p's PTC Windchill / FlexPLM extortion campaign (CVE-2026-12569) moves to public leak-site listing — Swiss and Dutch victims now named, including medtech giant Philips"
    sources:
      - { url: "https://foresiet.com/blog/cl0p-windchill-flexplm-cve-2026-12569/", publisher: "Foresiet", date: "2026-08-10", role: "corroborating" }
