    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "At this time, the incident appears to have only impacted certain facility maintenance systems."
        attribution: "Shared Health spokesperson, via BankInfoSecurity/ISMG"
        source_url: "https://www.bankinfosecurity.com/ransomware-attack-disables-canadian-hospitals-doors-hvac-a-32535"
      - quote: "If it becomes harder to monetize stolen data or encrypt traditional IT systems, attackers will look for the next lever that creates urgency and pressure. In healthcare, disrupting the physical environment can create enormous pressure very quickly."
        attribution: "Jason Elrod, CISO, MultiCare Health System"
        source_url: "https://www.bankinfosecurity.com/ransomware-attack-disables-canadian-hospitals-doors-hvac-a-32535"
