      The cloud data-extortion group FulcrumSec, which claimed the Novo Nordisk breach first disclosed
      2026-06-11/13 (already tracked as incident:novo-nordisk-clinical-trial-breach-2026, most recently updated
      2026-06-17), released a second-stage data dump on 2026-08-12: the pharma company's "complete enterprise
      HuggingFace AI/ML ecosystem" — 30 models, 70 datasets, and roughly 500GB of proprietary Cell Painting
      microscopy imaging (drug-discovery phenotypic-screening data), 1.05TB in total, distributed via torrent.
