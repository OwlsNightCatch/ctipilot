  - title: "Hacktivist trio claims Santé publique France breach via unvalidated client-side role parameter — unconfirmed, and the lead claimant has a prior record of recycled/exaggerated leaks"
    sources:
      - { url: "https://www.zataz.com/sante-publique-france-visee-par-une-cyberattaque/", publisher: "ZATAZ.COM", date: "2026-08-12", role: "primary" }
    discovery_trace: "first seen at: WebSearch (\"cyberattaque administration France août 2026 données volées\") → primary: ZATAZ.COM, URL https://www.zataz.com/sante-publique-france-visee-par-une-cyberattaque/ (cross-checked against entities/registry.yaml actor:cybernox, previously registered from a 2026-07-25 ZATAZ/Cyberattaque.org report)"
    summary: |
      A message posted 2026-08-11 on a hacker forum, attributed to three handles ("cybernox", "artemis" and
      "d'ont call me"), claims an intrusion against a platform associated with Santé publique France (the French
      national public-health agency). The claimed technique is a client-side authorization/mass-assignment
      flaw: per the attackers' own account, the platform's profile-edit page sent the account's role as a
      user-editable field to the server with no server-side validation of the submitted value, and the set of
      valid role values was discoverable in client-loaded JavaScript — allowing the attacker to intercept the
      request and substitute an administrator ("Back Office admin") role value with no re-authentication check.
      This maps to T1190 Exploit Public-Facing Application; the specific defect class is broken access control /
      insecure direct object reference via unvalidated client-supplied authorization state (OWASP A01), a
      pattern worth hunting for in any web application that trusts a client-submitted role/permission field.
      The attackers' screenshots reportedly show an administrator panel, front-office accounts, an image library
      and an email template, and claim exfiltrated data for roughly 80,000 accounts covering healthcare, social
      and prevention-sector professionals, organisations and structures (names, postal addresses, phone numbers,
      emails, professional categories, structure names/types) — resembling a professional directory rather than
