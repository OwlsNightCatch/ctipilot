          aliases: ["MyDr PESEL breach"],
          summary: "Attackers claim theft of 18.8M unique Polish PESEL numbers and ~2.5TB of data from MyDr, one of Poland's largest EMR platforms, via an alleged XXE-to-RCE chain in PKCS#12 certificate handling; MyDr confirmed a criminal intrusion on 2026-08-12 (Zaufana Trzecia Strona, DataBreaches.net)." }
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "Na tym etapie trwającego dochodzenia potwierdzamy, że staliśmy się celem zewnętrznego, celowego działania o charakterze przestępczym, którym objęta była część danych."
        attribution: "MyDr official incident statement (Polish; MT: 'At this stage of the ongoing investigation we confirm we were the target of a deliberate external act of a criminal nature affecting part of the data')"
        source_url: "https://pro.mydr.pl/portal-info"
      - quote: "According to the hackers, they had access to 18,814,422 unique PESEL numbers."
        attribution: "DataBreaches.net, relaying Zaufana Trzecia Strona (Adam Haertle)"
        source_url: "https://databreaches.net/2026/08/12/a-serious-incident-occurred-at-mydr-a-polish-healthcare-system-provider/"
      - quote: "Według tego, co usłyszeliśmy od sprawców, najpierw udało im się uzyskać zdalne wykonanie kodu przez podatność typu XXE przy obsłudze certyfikatów PKCS#12."
        attribution: "Zaufana Trzecia Strona (Adam Haertle), relaying the attackers' own account, unverified by the outlet"
        source_url: "https://zaufanatrzeciastrona.pl/post/hakerzy-twierdza-ze-ukradli-dane-ponad-18-milionow-polek-i-polakow-z-firmy-mydr/"
    extended_notes: |
      The exploitation chain (XXE, then a leaked GitHub API key, then AWS pivot) is entirely the attackers' own
      unverified account, relayed by the journalist without independent technical confirmation — treat the
      vulnerability-class claim as a lead, not a confirmed CVE. Adam Haertle cross-checked identity records for
      five volunteers against the claimed dataset (3 of 5 matched) as a scope-plausibility check, and noted the
      attackers' English writing style looks machine-translated/deliberately misleading as to origin. No named
      threat-actor cluster.
    borderline: false

