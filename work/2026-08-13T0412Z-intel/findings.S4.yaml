    discovery_trace: "first seen at: WebSearch (\"Mammut Clop ransomware Cyberangriff August 2026\"), pivoting off a Ransomware.live API sweep (https://api.ransomware.live/v2/recentvictims, tier: standard/api, fetched 2026-08-13) that surfaced fresh 2026-08-12 Clop leak-site listings for MAMMUT.COM (CH), PHILIPS.COM (NL, healthcare), and STNET.IT (IT) among ~11 European listings in one ~25-minute posting window → corroboration: Foresiet, URL https://foresiet.com/blog/cl0p-windchill-flexplm-cve-2026-12569/ → corroboration: DeXpose, URL https://www.dexpose.io/clop-ransomware-strikes-health-technology-leader-philips/"
    summary: |
      Cl0p's already-tracked mass-extortion campaign against internet-exposed PTC Windchill and FlexPLM
      deployments (CVE-2026-12569, an unauthenticated Windchill login-servlet deserialization RCE chained with
      a pre-auth FlexPLM WSDL information-disclosure endpoint; campaign:clop-windchill-flexplm-extortion-2026,
      first tracked here 2026-07-27 when "no victims had been listed on Cl0p's leak site") has now entered its
      public-listing phase. Ransomware.live's tracker recorded a burst of roughly a dozen new European victims
      named on Cl0p's leak site within a single ~25-minute window on 2026-08-12 (15:28–15:51 UTC), including
      MAMMUT.COM — a Swiss outdoor-sports brand headquartered in Seon — and PHILIPS.COM, the Dutch health-
      technology multinational (medical imaging/patient monitoring), alongside victims in Italy, Slovakia,
      Hungary, Finland and the UK. Foresiet's independent review (2026-08-10) of an earlier batch described 42
      then-masked Cl0p victim listings referencing project repositories, CAD files, engineering drawings, and
      Windchill-related file paths, consistent with the campaign's PLM/engineering-data targeting; the named
      listings now surfacing are consistent with a deanonymization/pressure phase for victims who have not
      settled. **This is an extortion-site claim, not a confirmed breach for either named company** — neither
      Mammut nor Philips has (per available reporting) issued a public statement confirming compromise, and
      claim volume/timing is the leak site's own presentation. Organisations running internet-exposed PTC
      Windchill or FlexPLM instances that were not patched or isolated by late June/July should assume
      exfiltration already occurred and treat this listing wave as the ransom-negotiation deadline having passed
      for the named victims (T1190 Exploit Public-Facing Application via CVE-2026-12569, T1505.003 Web Shell for
      the JSP-webshell post-exploitation step reported in the original campaign).
    region_nexus: "Switzerland (Mammut) and Netherlands (Philips) among the named victims — direct home-region and EU healthcare-adjacent nexus"
