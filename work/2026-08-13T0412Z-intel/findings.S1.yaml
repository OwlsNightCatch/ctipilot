        attribution: "Microsoft MSRC (CVE-2026-55040 record)"
        source_url: "http://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-55040"
    extended_notes: |
      Triage note: MSRC's own exploited flag had not yet flipped to "Exploitation Detected" at time of this check — the honeypot-attack claim currently rests on Rapid7/Defused/BleepingComputer, not yet an MSRC or CISA KEV confirmation. Given the Swiss federal and cantonal precedent, this is worth flagging even ahead of a formal KEV addition. Detection: session/auth logs showing successful authenticated actions (e.g. site-collection admin operations, file reads) with no corresponding valid interactive sign-in event or MFA challenge in identity logs; anomalous JWT bearer tokens presented to SharePoint API endpoints without a preceding ADFS/Entra ID token-issuance event.
