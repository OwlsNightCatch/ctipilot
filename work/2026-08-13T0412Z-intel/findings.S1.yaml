items:
  - title: "VMware vCenter directory-traversal RCE (CVE-2026-59310) now under confirmed active exploitation — 361 victim IPs across 47 countries, reverse_ssh persistence"
    sources:
      - { url: "https://medium.com/@quirso_de/active-exploitation-of-cve-2026-59310-361-victim-ips-across-47-countries-9783187cc6ff", publisher: "QUIRSO GmbH", date: "2026-08-12", role: "primary" }
      - { url: "https://thehackernews.com/2026/08/attackers-exploit-vmware-vcenter.html", publisher: "The Hacker News", date: "2026-08-12", role: "corroborating" }
      - { url: "https://www.rapid7.com/blog/post/etr-critical-vmware-vcenter-vulnerabilities-allow-authentication-bypass-and-remote-code-execution-cve-2026-59309-cve-2026-59310/", publisher: "Rapid7", date: "2026-07-30 (orig.), referenced 2026-08-12", role: "corroborating" }
      - { url: "https://security-hub.ncsc.admin.ch/#/posts/12814", publisher: "NCSC Switzerland / GovCERT.ch (Cyber Security Hub)", date: "2026-08-12 (update)", role: "corroborating" }
      - { url: "https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/SecurityAdvisories/0/38017", publisher: "Broadcom (VMSA-2026-0006)", date: "2026-07-29", role: "corroborating" }
    discovery_trace: "first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/12814 (12.08.2026 update note: 'Active exploitation of CVE-2026-59310 has been reported by Cyber Security company QUIRSO') -> primary: QUIRSO GmbH Medium post, URL https://medium.com/@quirso_de/active-exploitation-of-cve-2026-59310-361-victim-ips-across-47-countries-9783187cc6ff -> corroboration: The Hacker News, URL https://thehackernews.com/2026/08/attackers-exploit-vmware-vcenter.html -> corroboration: Rapid7 vendor analysis, URL https://www.rapid7.com/blog/post/etr-critical-vmware-vcenter-vulnerabilities-allow-authentication-bypass-and-remote-code-execution-cve-2026-59309-cve-2026-59310/"
    summary: |
      CVE-2026-59310, the CVSS 9.8 directory-traversal-to-RCE flaw in the vCenter Syslog server that Broadcom patched in VMSA-2026-0006 on 2026-07-29 (covered here 2026-07-30 as unexploited-at-publication), is now under confirmed active exploitation. German security firm QUIRSO GmbH, engaged on an incident-response case, identified 361 distinct victim IPs across 47 countries (Germany, US, Turkey, Iran and France most affected) that first beaconed to attacker infrastructure on 2026-08-03 — five calendar days after public disclosure. No authentication is required: an attacker with network access to vCenter sends path-traversal input to the Syslog server component to achieve arbitrary code execution. Post-compromise, the attack chain installs a malicious cron job that launches reverse_ssh, an open-source SSH-based reverse-shell framework, to establish a persistent outbound channel to attacker-controlled infrastructure — chosen because outbound SSH from a vCenter appliance is rarely alerted on and blends with legitimate administrative traffic. Broadcom confirms no workaround exists; the only remediation is updating to vCenter 9.1.0.0300, 9.0.2.0100, or 8.0 U3k/U2f. NCSC Switzerland updated its VMSA-2026-0006 advisory on 2026-08-12 to reflect "Actively Exploited" status, citing QUIRSO's report.
    region_nexus: "Global — 47 countries affected per QUIRSO telemetry (Germany, US, Turkey, Iran, France highest-hit); vCenter is a near-ubiquitous virtualization management plane across Swiss/EU enterprise and public-sector data centres, so unpatched exposure is plausible in-region even without a named CH/EU victim yet."
    primary_sector_nexus: "indirect"
    sector: "public-sector, energy, water, transport, healthcare, finance, telco"
    cves: ["CVE-2026-59310"]
    techniques: ["T1190", "T1053.003", "T1572"]
    affected_products: ["VMware vCenter Server", "VMware Cloud Foundation", "VMware vSphere Foundation", "VMware Telco Cloud Platform"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "update-of:2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape"
    evidence:
      - quote: "Compromised systems identified by QUIRSO were found to first establish contact with the attacker's domains on August 3, five days after Broadcom publicly disclosed the flaw."
        attribution: "The Hacker News, citing QUIRSO"
        source_url: "https://thehackernews.com/2026/08/attackers-exploit-vmware-vcenter.html"
      - quote: "The attack chain is said to have exhibited path traversal activity consistent with the flaw, followed by the deployment of a malicious cron job to establish persistence on the host using reverse_ssh"
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/08/attackers-exploit-vmware-vcenter.html"
      - quote: "Fixed vCenter releases include: VMware vCenter 9.1: 9.1.0.0300; 9.0: 9.0.2.0100; 8.0: 8.0 U3k or 8.0 U2f"
        attribution: "QUIRSO GmbH"
        source_url: "https://medium.com/@quirso_de/active-exploitation-of-cve-2026-59310-361-victim-ips-across-47-countries-9783187cc6ff"
      - quote: "Broadcom states that no workaround is available for CVE-2026-59310"
        attribution: "QUIRSO GmbH"
        source_url: "https://medium.com/@quirso_de/active-exploitation-of-cve-2026-59310-361-victim-ips-across-47-countries-9783187cc6ff"
    extended_notes: |
      Detection: hunt for outbound SSH-protocol connections initiated FROM vCenter appliances (not the normal direction of vCenter network traffic), unexpected cron/at entries on the vCenter Server Appliance (vCSA) photon OS, and Syslog-service worker-process children spawning shells. QUIRSO published a generic YARA rule for reverse_ssh binaries (github.com/QUIRSO/QTRDetectionContent) — not reproduced here per no-IOC policy, but the detection concept (SSH client/binary presence combined with unexpected outbound connections or execution on a vCenter appliance) is the actionable takeaway per QUIRSO's own framing: presence of reverse_ssh alone is not proof of compromise, but on a vCenter appliance it is a high-priority investigative trigger.
    watchlist: []
    borderline: false

  - title: "SharePoint auth-bypass CVE-2026-55040 moves from PoC to active exploitation attempts within hours of Rapid7's public proof-of-concept — ~8,500 servers exposed globally"
    sources:
      - { url: "https://www.bleepingcomputer.com/news/microsoft/hackers-leverage-new-microsoft-sharepoint-exploit-in-attacks/", publisher: "BleepingComputer", date: "2026-08-12", role: "primary" }
      - { url: "https://www.rapid7.com/blog/post/ra-microsoft-sharepoint-jwt-token-authentication-bypass-cve-2026-55040/", publisher: "Rapid7", date: "2026-08-11/12", role: "primary" }
      - { url: "https://security-hub.ncsc.admin.ch/#/posts/12764", publisher: "NCSC Switzerland / GovCERT.ch (Cyber Security Hub)", date: "2026-08-12 (update)", role: "corroborating" }
    discovery_trace: "first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/12764 (12.08.2026 update note: 'Claims of exploitation attempts of cve-2026-55040', linking BleepingComputer) -> primary: BleepingComputer, URL https://www.bleepingcomputer.com/news/microsoft/hackers-leverage-new-microsoft-sharepoint-exploit-in-attacks/ -> corroboration: Rapid7 PoC writeup, URL https://www.rapid7.com/blog/post/ra-microsoft-sharepoint-jwt-token-authentication-bypass-cve-2026-55040/ -> corroboration: MSRC CVE record (fetched via tools/fetch_source.py msrc cve CVE-2026-55040)"
    summary: |
      CVE-2026-55040 (CVSS 9.1, CWE-1390 Weak Authentication) is the JWT-token-validation authentication-bypass half of the SharePoint chain this pipeline has tracked since 14 July 2026 (Microsoft patched it that Patch Tuesday; the second link, CVE-2026-63520, shipped 11 August). MSRC's own record still lists "exploited: No" as of this check, but Rapid7 published a detailed technical analysis and working proof-of-concept for the bypass on 2026-08-11/12, and within hours a threat-intel account (Defused Cyber) reported the Rapid7 PoC being run against SharePoint honeypots ("Attackers are now using the @rapid7 POC for CVE-2026-55040 against our SharePoint honeypots"). The flaw allows an unauthenticated attacker to forge/bypass JWT-based session validation and impersonate any user, including administrators, on SharePoint Enterprise Server 2016 and Server 2019 (subscription-edition and 2016/2019 on-prem all receive the July fix); impact is confidentiality/integrity (file disclosure, data modification) with no availability impact. Shadowserver's internet-exposure tracker counts over 8,500 Microsoft SharePoint servers still reachable from the internet. This directly concerns Swiss constituents: BIT/FOITT (federal, 2026-08-04) and Canton Graubünden (2026-08-05) both disclosed on-premises SharePoint intrusions attributed to this same July disclosure wave, making renewed honeypot-confirmed exploitation attempts on the auth-bypass link a live re-compromise risk for any SharePoint estate that has not fully patched and rotated credentials.
    region_nexus: "Direct Swiss precedent — BIT/FOITT (federal) and Canton Graubünden both disclosed on-premises SharePoint breaches in early August 2026 tied to the same disclosure wave this CVE belongs to; ~8,500 SharePoint servers remain internet-exposed globally per Shadowserver."
    primary_sector_nexus: "direct"
    sector: "public-sector"
