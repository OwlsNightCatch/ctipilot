  - title: "Siemens SIMATIC IoT2050 Advanced: unauthenticated Node-RED HTTP interface allows CVSS 10.0 remote code execution as root (SSA-834709, CVE-2026-58115)"
    sources:
      - { url: "https://cert-portal.siemens.com/productcert/html/ssa-834709.html", publisher: "Siemens ProductCERT", date: "2026-08-11", role: "primary" }
      - { url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0282", publisher: "NCSC-NL", date: "2026-08-11", role: "corroborating" }
      - { url: "https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-1009/", publisher: "ANSSI / CERT-FR (CERTFR-2026-AVI-1009)", date: "2026-08-12", role: "corroborating" }
      - { url: "https://nki.gov.hu/figyelmeztetesek/serulekenysegek/cve-2026-58115/", publisher: "Nemzeti Kiberbiztonsági Intézet (Hungary)", date: "2026-08-11/12", role: "corroborating" }
    discovery_trace: "first seen at: advisories-ncsc-nl (bridge: ncsc-nl csaf NCSC-2026-0282), URL https://advisories.ncsc.nl/advisory?id=NCSC-2026-0282 -> pivot: Nemzeti Kiberbiztonsági Intézet per-CVE page, URL https://nki.gov.hu/figyelmeztetesek/serulekenysegek/cve-2026-58115/ (identified exact Siemens SSA id and affected product) -> primary: Siemens ProductCERT advisory SSA-834709, URL https://cert-portal.siemens.com/productcert/html/ssa-834709.html -> corroboration: ANSSI/CERT-FR CERTFR-2026-AVI-1009, URL https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-1009/ (CVE-2026-58115 confirmed present in the advisory's CVE list)"
    summary: |
      Siemens ProductCERT published SSA-834709 on 2026-08-11 (part of the monthly Siemens Patch Tuesday roundup that NCSC-NL, CERT-FR and BSI all relayed the same day) disclosing CVE-2026-58115 (CVSS v3.1 10.0, CVSS v4.0 10.0, CWE-306 Missing Authentication for Critical Function) in SIMATIC IoT2050 Advanced (6ES7647-0BA00-1YA2) devices running Industrial OS with Node-RED installed. Affected devices do not enforce authentication on the Node-RED HTTP interface, which exposes programming nodes capable of executing OS-level commands. An unauthenticated remote attacker can submit a crafted flow through this HTTP interface to have Node-RED execute arbitrary code on the underlying server with maximum (root-equivalent) privileges — no prior foothold, credentials or user interaction required, network access to the interface is sufficient. All versions prior to V4.3.4.1 are affected; Siemens has released V4.3.4.1 as the fix and, as an interim mitigation, recommends uninstalling Node-RED entirely or hardening the Node-RED installation (per the Node-RED User Guide) where update is not immediately possible. SIMATIC IoT2050 is Siemens' compact SIMATIC IPC-family edge/IoT gateway line, commonly deployed at the OT/IT boundary in industrial automation and building/process-control environments — a device class directly relevant to energy, water and transport-sector operators in the Swiss/EU constituency.
    region_nexus: "Global Siemens OT/ICS install base; SIMATIC IoT2050 is an edge-gateway product deployed across European industrial-automation and utility environments — no confirmed CH/EU victim yet, but the device class is directly relevant to energy/water/transport operators in scope."
    primary_sector_nexus: "indirect"
    sector: "energy, water, transport"
    cves: ["CVE-2026-58115"]
    techniques: ["T1190", "T1059"]
    affected_products: ["Siemens SIMATIC IoT2050 Advanced (6ES7647-0BA00-1YA2)"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Affected devices do not enforce authentication on the Node-RED HTTP interface, allowing unauthenticated access to programming nodes that are capable of executing system commands on the server."
        attribution: "Siemens ProductCERT (SSA-834709)"
        source_url: "https://cert-portal.siemens.com/productcert/html/ssa-834709.html"
      - quote: "SIMATIC IoT2050 Advanced (6ES7647-0BA00-1YA2) All versions < V4.3.4.1 running Industrial OS with Node-RED installed affected by CVE-2026-58115"
        attribution: "Siemens ProductCERT (SSA-834709)"
        source_url: "https://cert-portal.siemens.com/productcert/html/ssa-834709.html"
      - quote: "This could allow an unauthenticated remote attacker to create malicious flows through the HTTP interface in order to execute arbitrary code on the underlying server with maximum privileges."
        attribution: "Siemens ProductCERT (SSA-834709)"
        source_url: "https://cert-portal.siemens.com/productcert/html/ssa-834709.html"
    extended_notes: |
      No public exploitation reported at time of writing. Node-RED is a widely embedded low-code automation/flow engine — the vulnerability is specific to Siemens' bundling on SIMATIC IoT2050 Advanced running Industrial OS, not the upstream Node-RED project itself (no authentication was enforced on the vendor's deployment). Hunt/detection concept: unexpected new or modified Node-RED flow deployments via the HTTP admin/flow API without a corresponding authenticated engineering-workstation session; outbound or lateral command execution originating from the IoT2050's Node-RED runtime process. Hardening: disable/uninstall Node-RED where unused; if required, restrict network reachability of the Node-RED HTTP interface to the local engineering VLAN and enable Node-RED's own authentication/adminAuth configuration per Siemens' referenced User Guide.
    watchlist: []
    borderline: false

