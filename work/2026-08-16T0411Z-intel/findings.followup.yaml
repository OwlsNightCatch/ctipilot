    disposition: dropped-stale
    freshest_source_date: "2026-08-13 (securityaffairs.com/197149)"
    reason: >
      CVE-2026-71362 is a real, verified vulnerability (Adobe Commerce/Magento Open Source/Commerce B2B,
      CVSS 9.1, CWE-863 Incorrect Authorization — unauthenticated customer-session-switching account takeover,
      no prior account, admin rights or user interaction required; affected versions 2.4.4 through
      2.4.9-2026-jul and equivalents; fixed in Adobe's isolated APSB26-92 patch). Adobe's own PSIRT bulletin
      (helpx.adobe.com/security/products/magento/apsb26-92.html) is dated 2026-08-11 and states Adobe is "not
      aware of any exploits in the wild for any of the issues addressed in these updates." Sansec's own
      research post (sansec.io/research/adobe-commerce-account-takeover-apsb26-92) and BleepingComputer's
      first report (2026-08-12 16:54) both carry Sansec's claim that its Shield WAF is already blocking
      exploitation attempts against CVE-2026-71362 — this is a genuine, real exploitation-attempt claim, but
      every source for it (Adobe 08-11, BleepingComputer 08-12, SecurityAffairs 08-13) is 3-5 days older than
      this run's 26h floor (2026-08-15T02:11Z), and this CVE is not previously tracked ground in this store, so
      the 72h developing-window tracked-ground carve-out does not apply either (the developing-window floor is
      2026-08-13T04:11Z; the freshest primary, SecurityAffairs, published 2026-08-13 without a confirmable exact
      timestamp inside that floor, and no fresher primary reporting continued/escalated exploitation could be
      found via targeted WebSearch for 2026-08-15/16 coverage). Verdict: recycled news relative to this run;
      the reader has already had every chance to see it in a prior daily fire. Recommend a future run only
      revisit this if a fresh source reports a materially new development (e.g. confirmed victim compromise,
      a broader campaign, or a named actor).
