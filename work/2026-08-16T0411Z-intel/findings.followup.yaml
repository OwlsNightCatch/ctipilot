    extended_notes: |
      Revision history on the NCSC-NL page is itself useful chronology for the entry: v1.0.0 published 2026-08-07
      11:39 (Europe/Amsterdam) carried only "Initiele versie" (initial version, Apple's advisory framing, no
      exploitation mentioned); v1.0.1 published 2026-08-12 carries the revision note "Publieke PoC code beschikbaar
      en actief misbruik bekend" ("Public PoC code available and active exploitation known"). That revision note
      itself is a useful line for the entry: it explicitly ties the escalation to public PoC availability, consistent
      with Huntress/Calif's independent exploit-reconstruction work already on file.
      Caution on CVSS: NCSC-NL's own advisory lists CVSS v3 7.1 for CVE-2026-65400, matching the figure already in
      this store's two prior entries. A search-result snippet for one press outlet's headline referenced "CVSS 9.8"
      — that figure could not be confirmed against NCSC-NL, Apple, Huntress or Calif and looks like a
      confusion/conflation; recommend keeping 7.1 per the CERT primary and the two research primaries already cited.
      Given this is now a nationally-confirmed, in-the-wild root-compromise-plus-cryptomining outcome against a
      pre-auth remote-root bug in a widely deployed OS daemon (macOS Screen Sharing, ~40,000 internet-exposed hosts
      per Calif's scan already on file), this plausibly justifies raising this update's priority from the prior
      entries' "high" to "critical" when composed — that determination is left to the composing agent.
      No hunting detail beyond "root access obtained, Monero miner placed" was given by NCSC-NL or BleepingComputer —
      no process name, no mining-pool infrastructure, no persistence mechanism for the miner itself was disclosed by
      either source, so this entry should not invent those specifics. The existing Aug-11 entry's telemetry
      discriminator (successful Screen Sharing attach whose ATTACK auth type is the unencrypted `SRP` value rather
      than `RSA-SRP`, or whose session username is `root` or null) remains the load-bearing, sourced detection
      concept and is now validated by a confirmed real-world outcome rather than a PoC concern only.
