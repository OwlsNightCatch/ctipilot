items:
  - title: "UPDATE — CVE-2026-65400 (macOS Screen Sharing pre-auth remote root) is now confirmed under active exploitation: NCSC-NL reports root access obtained and Monero miners planted on internet-exposed hosts"
    sources:
      - { url: "https://advisories.ncsc.nl/2026/ncsc-2026-0280.html", publisher: "NCSC-NL (Nationaal Cyber Security Centrum)", date: "2026-08-12", role: primary }
      - { url: "https://www.bleepingcomputer.com/news/security/hackers-exploit-macos-screen-sharing-flaw-to-deploy-monero-miner/", publisher: "BleepingComputer", date: "2026-08-14", role: corroborating }
      - { url: "https://securityaffairs.com/197234/uncategorized/macos-screen-sharing-flaw-exploited-to-deploy-monero-miners.html", publisher: "Security Affairs", date: "2026-08-15", role: corroborating }
    discovery_trace: "first seen at: completeness-sweep candidate (securityaffairs.com sidebar), URL https://securityaffairs.com/197234/uncategorized/macos-screen-sharing-flaw-exploited-to-deploy-monero-miners.html (published 2026-08-15T08:34:46Z, inside the 26h window) → pivot: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/hackers-exploit-macos-screen-sharing-flaw-to-deploy-monero-miner/ (2026-08-14) → primary: NCSC-NL advisory NCSC-2026-0280 revision 1.0.1, URL https://advisories.ncsc.nl/2026/ncsc-2026-0280.html (fetched via bridge tool, raw CSAF-style HTML; revision dated 12-08-2026)"
    summary: |
      This is a confirmed exploitation-status delta on ground this store already tracks twice: the 2026-08-08 entry
      (Apple's advisory line only, no exploitation reported) and the 2026-08-11 update (pre-auth remote root confirmed
      by independent researcher exploit-reconstruction, still "poc-public" with no confirmed in-the-wild exploitation).
      NCSC-NL's advisory NCSC-2026-0280 for CVE-2026-65400 (CVSS v3 7.1, Improper Authentication in macOS Screen
      Sharing/screensharingd) was first published 2026-08-07 with Apple's own framing ("an attacker on the network may
      be able to authenticate to Screen Sharing without valid credentials"). NCSC-NL issued revision 1.0.1 on
      2026-08-12, adding: "The NCSC has received a notification indicating that active abuse of this vulnerability has
      been observed on multiple systems on which port 5900 was accessible from the Internet. In all these cases root
      access was obtained on the affected system and a Monero crypto miner was placed." No victim count, sector, or
      geography is given beyond "multiple systems" with port 5900 (the VNC/Screen Sharing listener) reachable from the
      internet. BleepingComputer and Security Affairs surfaced this update in fresh reporting on 2026-08-14 and
      2026-08-15 respectively — the Security Affairs piece falls inside this run's 26h window on its own publication
      timestamp. No new CVE, no version change: the fixed versions remain macOS Tahoe 26.6.1, Sequoia 15.7.9, Sonoma
      14.8.9, unchanged from the entries already on file. The chronology is coherent with the store's existing
      timeline: Huntress (2026-08-07) and Calif (2026-08-10) independently rebuilt working exploits from the patch
      diff and estimated roughly 40,000 internet-reachable Screen Sharing listeners; NCSC-NL's report of confirmed
      abuse (dated 2026-08-12, disclosed via press 2026-08-14/15) is the first ground-truth exploitation confirmation
      against that exposed population, closing the "poc-public, no confirmed exploitation" gap the prior entry
      explicitly flagged.
    region_nexus: "global exposure; the confirming authority is NCSC-NL (Netherlands), giving this a direct EU-CERT nexus relevant to Swiss/EU public-sector Mac fleets"
