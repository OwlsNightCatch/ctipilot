    evidence:
      - quote: "Beveiligingsbedrijf Defused meldt dat kwaadwillenden actief scannen en op zoek zijn naar kwetsbare Data Hub Adapter-systemen."
        attribution: "NCSC-NL (advisory NCSC-2026-0302, quoting Defused)"
        source_url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0302"
      - quote: "First exploitation attempts against CVE-2026-58231 (unauth RCE in SAP Commerce Cloud, CVSS 10.0) is now hitting our honeypots - 3 days after patch day."
        attribution: "Defused, quoted by BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/max-severity-sap-commerce-cloud-flaw-now-targeted-in-attacks/"
      - quote: "Successful exploitation could enable arbitrary code execution and compromise internal components, resulting in high impact on confidentiality, integrity, and availability of the application."
        attribution: "ENISA EUVD (EUVD-2026-55999, assigner: SAP)"
        source_url: "https://euvd.enisa.europa.eu/enisa/CVE-2026-58231"
    extended_notes: |
      Detection/hunt: prioritise egress/access-log review on internet-reachable Data Hub Adapter endpoints for
      unauthenticated POST/import requests using the default authentication client credential rather than a
      customer-configured one, and for anomalous import-job invocations that do not correlate with a scheduled
      ETL/integration job. Hardening: complete the vendor-mandated rebuild-and-redeploy (a config-only patch is
      not sufficient), and apply the vendor's interim IP-allowlist/network-filter control on the Data Hub Adapter
      endpoint in the interim. Because exploitation began within 72 hours of patch release with no public PoC,
      this is a case study in n-day patch-diffing outpacing organisational patch cycles — the same dynamic already
      flagged in the store for CVE-2026-66066 (Rails) and CVE-2026-63077 (TeamCity). Not yet CISA KEV-listed as of
      this run; EPSS 0.73 (ENISA EUVD, 2026-08-11 baseline) is likely to rise given confirmed ITW activity.
    borderline: false

