items:
  - title: "CVE-2026-58231 (SAP Commerce Cloud Data Hub Adapter) — mass scanning and exploitation attempts confirmed three days after patch, NCSC-NL issues national advisory"
    sources:
      - { url: "https://advisories.ncsc.nl/advisory?id=NCSC-2026-0302", publisher: "NCSC-NL (Nationaal Cyber Security Centrum)", date: "2026-08-15", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/max-severity-sap-commerce-cloud-flaw-now-targeted-in-attacks/", publisher: "BleepingComputer", date: "2026-08-14", role: "corroborating" }
      - { url: "https://euvd.enisa.europa.eu/enisa/CVE-2026-58231", publisher: "ENISA EUVD (assigner: SAP)", date: "2026-08-11", role: "corroborating" }
    discovery_trace: "first seen at: advisories-ncsc-nl, URL https://advisories.ncsc.nl/rss/advisories → primary: NCSC-NL advisory NCSC-2026-0302, URL https://advisories.ncsc.nl/advisory?id=NCSC-2026-0302 → corroboration: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/max-severity-sap-commerce-cloud-flaw-now-targeted-in-attacks/ → enrichment: ENISA EUVD record EUVD-2026-55999, URL https://euvd.enisa.europa.eu/enisa/CVE-2026-58231"
    summary: |
      CVE-2026-58231, the CVSS 10.0 unauthenticated remote-code-execution flaw in the SAP Commerce Cloud
      Data Hub Adapter fixed on SAP's 2026-08-11 Security Patch Day, is now under confirmed opportunistic
      exploitation — a material escalation from the store's 2026-08-12 coverage, which reported no exploitation
      at the time. The flaw stems from an unauthenticated attacker abusing a default authentication client and
      submitting crafted input to Data Hub Adapter import functions that lack sufficient validation, reaching
      arbitrary code execution (CWE-94, improper control of code generation). Threat-intelligence firm Defused
      told BleepingComputer its honeypot sensors recorded the first exploitation attempts against internet-exposed
      instances on 2026-08-14, three days after patch release and with no public PoC in circulation — indicating
      the attacking party reverse-engineered SAP's fix directly from the patch diff. Defused's telemetry describes
      the initial bursts as automated mass scanning consistent with opportunistic actors systematically probing
      internet-facing SAP deployments rather than a targeted campaign. On 2026-08-15 NCSC-NL (the Dutch national
      CERT) published advisory NCSC-2026-0302 citing Defused's findings and formally warning that malicious actors
      are actively scanning for vulnerable Data Hub Adapter systems — elevating this from vendor-patch-day news to
      a government-confirmed active-exploitation event. Shadowserver-class internet-exposure scanning cited by
      BleepingComputer puts over 4,200 SAP Commerce Cloud instances reachable from the internet, concentrated in
      Europe and North America, and the vulnerability is not yet listed in CISA KEV. Commerce Cloud's fix requires
      a full application rebuild and redeploy rather than a hotfix, so exposed instances that have not completed
      that redeploy remain vulnerable regardless of how much time has passed since the advisory.
    region_nexus: "Europe and North America carry the largest share of the ~4,200 internet-exposed SAP Commerce Cloud instances (BleepingComputer, citing Shadowserver-class exposure data); NCSC-NL's advisory is a direct EU/Dutch public-sector nexus."
    primary_sector_nexus: "indirect — SAP Commerce Cloud is deployed by public-sector and enterprise e-commerce/procurement platforms across the EU; NCSC-NL treats it as constituency-relevant enough for a national advisory"
    sector: "public-sector, finance, telco"
