  - title: "FINMA: cyberattacks on Swiss-supervised banks and insurers up roughly a third; chair names frontier AI models a sector-wide systemic risk"
    sources:
      - { url: "https://www.swissinfo.ch/eng/swiss-politics/finma-sounds-the-alarm-cyberattacks-on-the-rise-ai-poses-a-risk/91902846", publisher: "swissinfo.ch (Swiss Broadcasting Corporation)", date: "2026-08-15", role: "primary" }
      - { url: "https://www.cash.ch/news/finma-chefin-cyber-attacken-auf-finanzinstitute-haben-deutlich-zugenommen-961165", publisher: "cash.ch (citing Finanz und Wirtschaft interview)", date: "2026-08-14", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"Swiss financial sector FINMA cyber incident August 2026\") → https://www.swissinfo.ch/eng/swiss-politics/finma-sounds-the-alarm-cyberattacks-on-the-rise-ai-poses-a-risk/91902846 → corroboration pivot via WebSearch (\"Marlene Amstad FINMA Interview Cyberangriffe Drittel Zunahme\") → cash.ch rendering of the originating Finanz und Wirtschaft interview, URL https://www.cash.ch/news/finma-chefin-cyber-attacken-auf-finanzinstitute-haben-deutlich-zugenommen-961165 (fuw.ch itself unreachable — too-many-redirects on WebFetch, not retried)"
    summary: |
      FINMA chair Marlene Amstad, in an interview with Finanz und Wirtschaft published 2026-08-14 and picked up in English by swissinfo.ch on 2026-08-15, said cyberattacks against FINMA-supervised institutions (banks and insurers) have risen by roughly a third. Amstad named frontier AI models from OpenAI and Anthropic as a threat that "affects the entire sector" rather than any single institution — the first time FINMA has framed foundation-model capability growth itself (not just AI-enabled phishing/deepfakes) as a systemic supervisory concern, on the reasoning that model capability lowers the skill floor for complex intrusion chains and compresses defender response time. She reiterated that supervised institutions retain direct responsibility for operational risk from third-party/outsourcing relationships — a live theme in Switzerland following the BIT federal-IT-office and Kanton Graubünden SharePoint compromises earlier in August (both previously reported). FINMA is expanding its own AI-assisted supervisory technology (SupTech) and deepening coordination with IOSCO, FSB and BIS. The statement builds on FINMA's July 2026 Supervisory Notice 05/2026, which already required supervised institutions to build governance for "harvest-now-decrypt-later" quantum-computing risk to RSA/ECC-protected data; a FINMA survey of 60 institutions found roughly two-thirds expect direct quantum-related cyber exposure within seven years and roughly two-thirds expect a quantum computer capable of breaking RSA-2048 within ten years.
    region_nexus: "Switzerland (home jurisdiction; statement covers all FINMA-supervised banks and insurers)"
