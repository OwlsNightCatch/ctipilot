  - title: "Check Point's July 2026 telemetry: The Gentlemen, Qilin and newcomer DeadLock lead ransomware activity named as hitting Swiss authorities, hospitals and medical-device firms"
    sources:
      - { url: "https://www.swisscybersecurity.net/news/2026-08-14/cyberangriffe-in-der-schweiz-steigen-im-juli-um-35-prozent", publisher: "SwissCybersecurity.net", date: "2026-08-14", role: "primary" }
      - { url: "https://blog.checkpoint.com/security/july-2026-cyber-threats-surge-ransomware-attacks-double-year-over-year-as-genai-data-exposure-widens/", publisher: "Check Point Research (global blog, corroborates group shares/victim counts; no Switzerland-specific breakdown in this global post)", date: "2026-08-12", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"swisscybersecurity.net Cyberangriff\") → https://www.swisscybersecurity.net/news/2026-08-14/cyberangriffe-in-der-schweiz-steigen-im-juli-um-35-prozent → pivot to Check Point's own global July 2026 report, URL https://blog.checkpoint.com/security/july-2026-cyber-threats-surge-ransomware-attacks-double-year-over-year-as-genai-data-exposure-widens/ (global post corroborates the named-group victim shares; it carries no Switzerland-specific sector breakdown, which appears to derive from a separate CH-localized data cut Check Point supplied to the Swiss trade press)"
    summary: |
      SwissCybersecurity.net reported 2026-08-14 that Check Point recorded a 35% year-over-year rise in cyberattacks on Swiss organisations in July 2026 (1,489 attacks/week/organisation average), with Swiss-specific targeting of "authorities, hospitals, medical device and retail companies." Check Point's own global July 2026 report (published 2026-08-12) gives the underlying ransomware-group breakdown behind this trend: 964 reported ransomware attacks globally, up 87% YoY and 49% MoM, led by The Gentlemen (14% of published attacks; RaaS launched mid-2025, combines encryption with initial-access brokering — tracked in this pipeline's registry as actor:thegentlemen, previously assessed to overlap with Qilin/ArmCorp), Qilin (14%; mature RaaS since 2022, tracked as actor:qilin) and the newer DeadLock group (10%, 97 reported victims, described as using blockchain-based C2 rotation for infrastructure resilience — not yet in this pipeline's entity registry). The same report separately quantifies a GenAI data-exposure trend relevant to any organisation running enterprise LLM tooling: 1 in 36 enterprise-network prompts carried high risk of sensitive-data leakage, 88% of organisations regularly using GenAI saw high-risk prompt activity, and the top exposed data categories were personal data (70%), financial data (68%) and network/IT-infrastructure data (68%). For Swiss defenders in the public-sector, healthcare and finance verticals the report's Switzerland-specific line is the single directly actionable claim: it is treated here as vendor-telemetry-derived and not independently corroborated beyond the one Swiss trade-press pickup of Check Point's country cut.
    region_nexus: "Switzerland (Check Point's Switzerland-specific attack-volume and targeted-sector breakdown for July 2026)"
