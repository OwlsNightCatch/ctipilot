      This item is statistics/telemetry-heavy rather than TTP-specific, which is why it is flagged borderline. What earns it inclusion for a sector-lens duty: it names three currently active ransomware brands with a stated Swiss/European footprint against the constituency's own core verticals (public-sector authorities, hospitals), which is directly useful triage/prioritisation signal for a Swiss SOC deciding which leak-site claims against Swiss victims to treat as credible (actor:thegentlemen and actor:qilin are both already tracked in this pipeline's registry; DeadLock is proposed new). No specific intrusion technique beyond "ransomware" (T1486) and generic phishing/ransomware framing is stated for the Swiss cases specifically — the country-level "authorities, hospitals, medical device and retail" targeting line is not broken out by named actor.
