      Background (not itself in-window, cited for context only): FINMA's Supervisory Notice 05/2026 (July 2026) already set governance/risk-management expectations for quantum-computing cyber risk (HNDL — harvest-now-decrypt-later — against RSA/ECC); a 60-institution FINMA survey found most have taken only isolated concrete PQC-migration steps so far. Also background: the BIT (Swiss federal IT office) and Kanton Graubünden on-prem SharePoint compromises disclosed 2026-08-04/05 (already covered by this pipeline) are the live example behind Amstad's third-party-risk remark. No new CVE or specific intrusion technique is described in this item — it is a regulator's risk statement, not an incident disclosure.
