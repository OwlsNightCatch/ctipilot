      - quote: "when the Anonymous Users web role is assigned to a table permission, the table's data can be read by anyone visiting the site."
        attribution: "Infosecurity Magazine, quoting Fortra's technical explanation"
        source_url: "https://www.infosecurity-magazine.com/news/exfilsquads-13-organizations/"
      - quote: "The leaked data appears to be related to misconfigured Microsoft Power Page portals, a software-as-a-service platform that is used to create public-facing business websites."
        attribution: "Cybersecurity Dive"
        source_url: "https://www.cybersecuritydive.com/news/researchers-confirm-breach-claims-data-extortion/827926/"
    extended_notes: |
      Publication date 2026-08-14 (~38-40h before run start) — inside developing_window_hours (72h). Detection
      concept for Swiss/EU public-sector Power Pages deployments: audit every table permission granted to the
      "Anonymous Users" web role in Power Pages Studio / the Dataverse table-permissions blade; any table whose
      Anonymous role has a Global read scope is directly enumerable via the portal's public API with no
      authentication artifact to hunt for (no anomalous logon, no failed-auth spike) — this is a config-review
      task, not a log-hunting one. NCSC-CH's 2026-08-04/05 advisory already made this a standing check for
      federal/cantonal portal estates; this update is evidence the exposure class continues to be actively
      abused at scale two weeks later.
