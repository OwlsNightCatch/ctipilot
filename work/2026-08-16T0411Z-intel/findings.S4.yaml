    discovery_trace: "first seen at: darkreading (RSS feed), URL https://www.darkreading.com/rss.xml -> item 'Scottish Govt Suffers Potentially Widening Data Breach at Prosecutor's Office' (article body not retrievable, WebFetch 403 on https://www.darkreading.com/cyberattacks-data-breaches/scottish-govt-data-breach-prosecutors-office) -> pivot: WebSearch(\"Scottish government data breach prosecutor's office August 2026 COPFS\") -> pivot: FutureScot, URL https://futurescot.com/around-300-staff-at-scotlands-prosecution-service-caught-in-third-party-data-breach/ -> pivot: Digit.fyi, URL https://www.digit.fyi/scotlands-prosecution-service-suffers-third-party-data-breach/ (surfaced the primary link) -> primary: COPFS official statement, URL https://www.copfs.gov.uk/about-copfs/news/third-party-data-breach/"
    summary: |
      Scotland's Crown Office and Procurator Fiscal Service (COPFS) disclosed on 2026-08-13 that an unnamed
      third-party supplier running an online "data maturity assessment" for Scottish Government detected
      suspicious activity on 2026-08-05 and began remediation. The exposed data is limited to employment-related
      survey-participant information — names, professional roles and work email addresses — for around 300
      COPFS staff; COPFS's own systems were not breached and no casework, victim, witness or public data was
      affected, per the agency's own statement. The assessment was organised centrally by Scottish Government
      and run by the same external supplier for multiple public bodies, so other departments that took part in
      the same survey round are a plausible additional exposure the supplier's still-ongoing investigation has
      not yet scoped. This is a supply-chain/third-party-SaaS access pattern (T1199) rather than an intrusion
      into COPFS's own network: the exposed personnel roster (names + roles + work emails) is precisely the
      seed data a follow-on spear-phishing or business-email-compromise campaign against justice-sector staff
      would want. No ransomware, extortion-site listing or actor attribution has surfaced for this incident.
