  - title: "UPDATE — Fortra confirms ExfilSquad's data theft from 13 organizations (govt/education/finance/manufacturing); root cause pinned to Power Pages 'Anonymous Users' table-permission misconfiguration"
    sources:
      - { url: "https://www.infosecurity-magazine.com/news/exfilsquads-13-organizations/", publisher: "Infosecurity Magazine", date: "2026-08-14", role: "primary" }
      - { url: "https://www.cybersecuritydive.com/news/researchers-confirm-breach-claims-data-extortion/827926/", publisher: "Cybersecurity Dive", date: "2026-08-14", role: "corroborating" }
    discovery_trace: "first seen at: infosec-magazine (RSS feed), URL https://www.infosecurity-magazine.com/rss/news/ -> item 'Researchers Confirm ExfilSquad's Access to Sensitive Data Across 13 Organizations' -> fetched: Infosecurity Magazine, URL https://www.infosecurity-magazine.com/news/exfilsquads-13-organizations/ -> pivot: WebSearch(\"Fortra ExfilSquad 13 organizations Power Pages Dataverse confirmed\") -> pivot: Cybersecurity Dive, URL https://www.cybersecuritydive.com/news/researchers-confirm-breach-claims-data-extortion/827926/ -> primary (Fortra's own blog, https://www.fortra.com/blog/exfilsquad-data-extortion-group-ransoming-microsoft-d365-data, could NOT be independently fetched this run — direct GET returned HTTP 403 and every jina-reader credential returned HTTP 402 'balance exhausted'; both cited news outlets quote Fortra directly and are treated as the operative sources)"
    summary: |
      Update to the pipeline's ExfilSquad coverage (root entry 2026-07-31, most recent prior update 2026-08-12
      Wesco). Fortra's threat-intelligence team (FIRE) reviewed data samples the extortion group published via
      torrent on 2026-08-07 — 382.64 GB across roughly 27 million records — and confirmed the group's access
      claims are genuine for at least 13 named victims spanning city government, education, financial services
      and manufacturing, including the City of Atlanta and District of Columbia Public Schools (roughly 60,000
      student records) alongside the previously-covered UK Department for Education and Police National Legal
      Database. Per the reporting, Fortra found no evidence of a disclosed vulnerability being exploited or of
      ransomware deployment; the mechanism is a Microsoft Power Pages configuration flaw in which a portal's
      "Anonymous Users" web role is assigned read permission on a Dataverse table, letting anyone visiting the
      site pull the table's contents through the portal API without authentication — the same misconfiguration
      class NCSC-CH already flagged to its own constituency on 2026-08-04/05. The new information over the prior
      entries is the confirmed multi-sector victim total (13, of 15 originally claimed) and the specific
      mechanism (anonymous web role -> table permission) rather than a general "Power Pages/Dataverse exposure"
      description.
    region_nexus: "UK/EU + US (Atlanta, DC Public Schools) — global exposure of Power Pages/Dataverse misconfiguration"
