    extended_notes: |
      Publication date 2026-08-14 (~38-40h before this run's start) — inside developing_window_hours (72h),
      outside the strict 26h window; flagging for the composer's recency call. Transferable lesson: the root
      cause is not "a bank was hacked" but "a payment-provider software update introduced a booking-logic flaw
      that a third party could abuse to trigger unauthorized withdrawals" — relevant to any Swiss/European
      financial institution or public-sector payment intermediary that outsources direct-debit / SEPA-style
      booking processing to a shared provider. Detection concept: anomalous spikes in reversed/duplicated
      booking entries or withdrawal volume immediately following a payment-provider software deployment window;
      hardening lever: change-management/regression testing on payment-provider booking-logic updates before
      production rollout, and post-deployment reconciliation monitoring.
