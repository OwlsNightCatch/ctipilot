    sources:
      - { url: "https://www.bka.de/DE/Presse/Listenseite_Pressemitteilungen/2026/Presse2026/260814_PM_Ermittlungserfolge_Computerbetrug.html", publisher: "Bundeskriminalamt (BKA) — official press release", date: "2026-08-14", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/hackers-arrested-over-30m-bank-fraud-exploiting-service-provider-flaw/", publisher: "BleepingComputer", date: "2026-08-14", role: "corroborating" }
      - { url: "https://therecord.media/investigation-into-banking-hack-leads-to-arrests-germany-brazil", publisher: "The Record (Recorded Future News)", date: "2026-08-14", role: "corroborating" }
    discovery_trace: "first seen at: therecord (homepage fetch), URL https://therecord.media/ -> item 'Investigation of banking hack leads to arrests in Europe, Brazil' (2026-08-13/14) -> pivot: WebSearch(\"banking hack arrests Europe Brazil investigation August 2026 therecord\") -> pivot: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/hackers-arrested-over-30m-bank-fraud-exploiting-service-provider-flaw/ -> pivot: The Record full article, URL https://therecord.media/investigation-into-banking-hack-leads-to-arrests-germany-brazil (surfaced the BKA outbound link) -> primary: BKA press release, URL https://www.bka.de/DE/Presse/Listenseite_Pressemitteilungen/2026/Presse2026/260814_PM_Ermittlungserfolge_Computerbetrug.html"
    summary: |
      Germany's Bundeskriminalamt (BKA) and Brazil's Federal Police announced coordinated arrests on 2026-08-14
      following an investigation into a November 2023 fraud that drained roughly EUR 30M from Commerzbank online-
      banking customer accounts. Per the BKA's own statement, the perpetrators exploited a vulnerability
      introduced by a faulty software update in the booking/transaction-processing logic of a payment service
      provider, opening a four-day window in which numerous unauthorized withdrawals/direct debits were executed
      against German online-banking accounts. Proceeds were laundered through pass-through accounts, shell
      companies, payment institutions, virtual-asset (crypto) platforms and payment cards, routed through Brazil
      and four other European countries. Brazil's "Operação Klonen" executed 21 search-and-seizure warrants
      across seven cities, arresting four suspects and seizing assets (real estate, vehicles) worth over roughly
      $20M; three further suspects identified in Europe face prosecution in Spain and Bulgaria with Frankfurt
      prosecutors' assistance. No CVE was assigned — this is a proprietary payment-provider application/business-
      logic flaw, not a disclosed public vulnerability, and the provider itself has not been named in any source
      fetched this run.
    region_nexus: "Germany, Spain, Bulgaria (EU) — money-laundering nexus to Brazil"
