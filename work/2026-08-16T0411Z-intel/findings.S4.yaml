      the supplier's investigation remains open per COPFS's own statement. Falls inside the run's
      developing_window_hours (72h) rather than the strict 26h window; flagging the timeline explicitly for the
      composer's recency judgment. Transferable lesson for the constituency: any federal/cantonal body that
      outsources a staff survey, maturity assessment or similar HR-adjacent SaaS tool to a shared external
      vendor should inventory which other public bodies use the same vendor instance and pre-agree a joint
      notification/scoping process, since a single compromised vendor tenant can expose several unrelated public
      bodies simultaneously.
