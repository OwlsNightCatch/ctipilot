    summary: |
      FortiGuard Labs (Fortinet, researcher Cara Lin) documented a previously
      undocumented Mirai-derived Linux botnet it names "Evooo1Bot" after a
      hardcoded string found in every sample, active since at least July 2026
      per FortiGuard IPS telemetry. It reuses Mirai's leaked DDoS engine (16
      flood methods: UDP/SYN/ACK/DNS/GRE/STOMP/Xmas variants etc., T1498
      Network Denial of Service) but layers on capabilities well beyond the
      typical Mirai-derivative baseline. An integrated exploit module chains
      at least 19 named CVEs, most against consumer/SOHO gateway gear and one
      OT device (Alcatel-Lucent OmniPCX Enterprise CVE-2007-3010; NETGEAR
      routers CVE-2016-6277; Tenda AC7/AC9/AC10/AC1900-AC15 CVE-2018-14558 and
      CVE-2020-10987; Mitsubishi Electric/INEA ME-RTU CVE-2019-14931; Hikvision
      IP cameras CVE-2021-36260; Telesquare SDT-CW3B1/TLR-2005KSH
      CVE-2021-46422 and CVE-2024-29269; D-Link DIR-823X/DIR-868L
      B1/go-rt-ac750/NAS devices CVE-2022-37055, CVE-2024-10914,
      CVE-2025-10123, CVE-2025-55583; TP-Link Archer AX21 CVE-2023-1389) —
      but the same module also carries functional exploits against three
      genuinely enterprise-class, internet-facing systems: Atlassian
      Confluence Server/Data Center OGNL injection (CVE-2022-26134), WSO2
      products' unrestricted file-upload RCE (CVE-2022-29464, /fileupload
      endpoint), and the Kubernetes ingress-nginx admission-controller RCE
      ("IngressNightmare", CVE-2025-1974), plus PHP-CGI argument injection on
      Windows (CVE-2024-4577) and a Zyxel firewall command-injection flaw
      (CVE-2022-30525, /ztp/cgi-bin/handler). A Progress MOVEit Transfer
      module (CVE-2023-34362) is present but FortiGuard states it "doesn't
      execute the file upload procedure" and is "non-exploitable as shipped"
      — an incomplete/decoy implementation, not a working exploit. Beyond the
      CVE arsenal, the bot ships a SOCKS5 relay (direct-listen on TCP/1080,
      plus a reverse-relay mode that separates a persistent encrypted control
      channel from per-session proxy-data channels via RELAY_NEW/RELAY_DATA
      framing), an HTTP credential sniffer that parses /proc/net/tcp to lift
      Basic-Auth and Cookie headers to a local log file, and an SSH
      brute-forcer whose 150+-entry credential dictionary mixes default IoT
      creds with named enterprise/OT service accounts (jenkins, postgres,
      oracle, nagios, deploy) — FortiGuard states this combination is "more
      common in enterprise and operations-technology environments than on
      consumer routers." The SSH module performs two-stage honeypot
      detection: banner comparison against a hardcoded list of research
      frameworks (Cowrie, Kippo, HonSSH, libssh, Twisted, Glutton, OpenCanary,
      russh, MocanaSSH, etc.) before brute-forcing, then a post-login command
      probe (`cat /proc/version; cat /proc/1/cmdline; ls
      /opt/cowrie /home/cowrie /home/kippo`) that aborts the session if no
      real kernel version string is returned or a Cowrie/Kippo path exists.
      C2 uses AES-256-CTR and ChaCha20 (split key halves XOR-combined at
      runtime) over TCP/443 to blend with HTTPS. Persistence is multi-layered:
      a systemd unit disguised as "Apache HTTPD Cache Manager"
      (Restart=always), a SysV init script, a cron entry re-fetching the
      loader every 5 minutes, /etc/profile.d injection, and an rc.local
      append; the process also raises its own oom_score_adj and holds
      /dev/watchdog open to resist OOM-killer and reboot-triggered
      interruption. An extensive anti-analysis layer checks for debuggers,
      disassemblers, packet capture, forensic and AV tooling (strace, gdb,
      ida, ghidra, wireshark, volatility, yara, rkhunter, etc.), sandbox/VM
      artifacts (cuckoo, joesandbox, any.run, vmware, qemu, gvisor, kata,
      firejail), and protects embedded strings behind a compile-time
      AES/ChaCha20 obfuscation pipeline. FortiGuard's own text states only
      that targeting spans "multiple known vulnerabilities across diverse
      regions" without naming countries; The Record's independent coverage of
      the same research additionally states telemetry activity is
      "concentrated in North America, South America, Europe, India, China and
      Japan" — this breakdown could not be independently confirmed in the
      Fortinet blog's extractable text (most likely sourced from a chart or
      graphic the fetch tooling did not render) and no source names a
      Switzerland-specific victim or targeting pattern. No victim count or
      infected-device scale figure is disclosed by any source.
