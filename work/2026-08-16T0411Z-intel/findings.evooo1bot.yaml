    extended_notes: |
      Relevance framing for the gate: the honest read is NOT "commodity
      consumer-router botnet, no enterprise reach" — the exploit module
      demonstrably carries functional, unauthenticated pre-auth RCE chains
      against three enterprise-class, internet-facing systems that are
      plausibly present in Swiss/European public-sector and CI estates:
      Atlassian Confluence (CVE-2022-26134, patched since June 2022),
      WSO2 products (CVE-2022-29464, patched since April 2022), and
      Kubernetes ingress-nginx admission controllers (CVE-2025-1974
      "IngressNightmare", patched in ingress-nginx 1.12.1 / 1.11.5, disclosed
      March 2025 with independent research at the time estimating ~6,500
      publicly exposed vulnerable clusters). All three CVEs are old enough
      that any unpatched instance has had a multi-year (Confluence, WSO2) or
      multi-month (ingress-nginx) patch window — meaning an org still
      unpatched today is now exposed not only to targeted actors but to
      commodity IoT-botnet mass-scanning that will fold a compromised
      instance into DDoS, SOCKS5 relay/pivot, and credential-harvesting
      infrastructure. The MOVEit Transfer module is explicitly non-functional
      as shipped (payload wiring is broken), so CVE-2023-34362 should NOT be
      read as actively exploited by this botnet — flagged here only because
      Fortinet's own text raises and then debunks it; worth carrying so a
      reader doesn't independently discover the module string and assume
      MOVEit is newly at risk.

      Detection/hunt concepts supported by the source (telemetry class first,
      platform anchor second — no IOCs):
      - Process/network: unexpected outbound TCP/443 connections from
        embedded/edge devices, self-hosted Confluence/WSO2 app servers, or
        Kubernetes ingress-nginx pods that do not correspond to expected
        HTTPS egress (application server initiating C2-pattern outbound
        connections is the discriminator vs. normal inbound-only web-server
        traffic).
      - Host/config artifact: unexplained systemd units named to impersonate
        legitiate services (e.g. an "Apache HTTPD Cache Manager"-style unit
        with Restart=always on a device/appliance that should not run such a
        service), unexpected /etc/profile.d entries, appended /etc/rc.local
        content, or a cron entry re-fetching a remote script every 5 minutes
        — cron/systemd/profile.d/rc.local persistence stacked simultaneously
        is itself an anomaly on embedded Linux appliances that normally carry
        none of these.
      - Authentication logs: SSH login attempts cycling through enterprise
        service-account names (jenkins, postgres, oracle, nagios, deploy)
        from a single low-reputation source in rapid succession is a
        discriminator vs. legitimate automation, which authenticates as a
        single expected account, not many.
      - Benign lookalike / triage note: a device answering a probing SSH
        session with an OpenSSH 9.7p1-style banner and passing a
        Cowrie/Kippo-signature check before further compromise activity
        indicates the attacker actively distinguishes honeypots from real
        hosts — a defender running SSH honeypot/deception infrastructure
        should not expect to observe post-authentication behavior from this
        actor's automated component; absence of follow-on activity against a
        deception asset is not evidence the scanning stopped.
      - Hardening: patch Confluence/WSO2/ingress-nginx to the versions
        referenced above; do not expose Kubernetes admission-controller
        webhook endpoints to the public internet; disable or firewall
        PHP-CGI on Windows IIS deployments per the CVE-2024-4577 advisory
        guidance; rotate/replace default and weak SSH credentials on any
        internet-facing Linux appliance, including OT/ICS gateway devices
        (Mitsubishi Electric ME-RTU).

