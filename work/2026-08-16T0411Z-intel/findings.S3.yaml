    extended_notes: |
      Triage / benign-lookalike guidance (mechanically derived, not source-stated): a native-messaging host registered under HKCU\SOFTWARE\<Browser>\NativeMessagingHosts\<reverse-domain-name> is itself normal — legitimate password managers, ad blockers and PDF/document tools use this exact mechanism. The discriminators here are (1) a host name masquerading as a Microsoft component (`com.microsoft.*`) while being registered per-user under HKCU by a browser-extension-delivered dropper rather than an enterprise MSI/GPO-deployed, code-signed Microsoft installer under HKLM; (2) cmd.exe spawned with a native-messaging host executable (rather than the browser's own renderer/broker) as parent, an unusual process-lineage pairing worth a process-creation-with-parent-lineage hunt; (3) a browser extension requesting `nativeMessaging` + `webRequest` + `debugger` + all-URLs `cookies` together is a high-privilege permission combination rare in legitimate document-viewer extensions and worth an extension-manifest/permission-audit rule. Classification: reliability B (Symantec/Broadcom — established vendor threat-research lab, first-hand telemetry and whitepaper-backed investigation), credibility 2 (single technical source; not yet independently re-derived by a second telemetry-holding lab, though extensively and consistently reproduced by press with no contradicting reporting found). This item was queued by the 2026-08-15 fire (per spawn-message note) but not published then; verified in full against the raw Symantec page in this run (native-messaging host name, registry key, watering-hole mechanism and victim-labelling logic all confirmed against the primary text, not just the WebFetch summary).

      Also checked and dropped for recency: Acronis TRU's "PATCHCORD"/"SHEETCORD" report (new C/C++ backdoor + Go-based Google-Sheets-C2 backdoor against Afghan telecom/South Asian critical infrastructure, attributed by press coverage to APT36) — Acronis published 2026-08-13T07:45Z, outside this run's 26h window and not a fresh delta on any tracked entry; flagging for a future run's attention since it targets critical-infrastructure telecom and uses a notable living-off-cloud-services C2 technique (Google Sheets API as C2 transport), URL https://www.acronis.com/en/tru/posts/patchcord-new-malware-cluster-targets-afghan-telecom-and-south-asian-critical-infrastructure/ (fetched via bridge, HTTP 200, datePublished confirmed in page metadata).

