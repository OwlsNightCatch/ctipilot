    discovery_trace: "backlog assignment → primary: Symantec/Carbon Black Threat Hunter Team, URL https://www.security.com/threat-intelligence/jewelbug-crypto-fraud-espionage (no pivot needed — this is the discovering lab's own write-up; body verified in full against the raw page, including the References/whitepaper link https://sed-cms.broadcom.com/sites/default/files/2026-08/Jewelbug%20Dossier.pdf) → corroboration: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/hackers-breach-govt-webmail-while-running-parallel-crypto-fraud/ (independent journalism reproducing the same facts, no contradictions found; also cross-checked against cybersecuritynews.com, TheHackerNews, DarkReading, Infosecurity Magazine coverage of the same Symantec report via WebSearch, all consistent)"
    summary: |
      Symantec's Threat Hunter Team documents Jewelbug (aka Earth Alux/Trend Micro, REF7707/Elastic, CL-STA-0049/Unit 42), a China-based hack-for-hire group running government espionage and a commodity cryptocurrency-fraud business from one shared control panel (XG-Web, a React/Node.js/MySQL browser-centric RAT-and-stealer platform the developers themselves mislabel a "penetration-testing platform"). The primary implant is a malicious Chrome/Firefox extension named "PDF Viewer" requesting cookies, scripting, debugger, web-request-interception and native-messaging permissions; a background service worker gives the operator a full remote bridge to the browser API (arbitrary JS injection, any browser function invocable by name). To escape the browser sandbox onto the host OS, the extension talks to a native-messaging host registered under the deliberately misleading name `com.microsoft.runedge` (HKCU\SOFTWARE\Google\Chrome\NativeMessagingHosts\com.microsoft.runedge), which executes operator commands through cmd.exe and returns output to the panel. The extension is not installed via the extension store: it is side-loaded directly into the browser profile by the group's Windows backdoor Antino (delivered as a fake Adobe Flash/Adobe-installer executable), which also drops the native-messaging helper and writes the registry value. Antino itself uses the Microsoft Graph API as its C2 channel to blend into legitimate Microsoft cloud traffic. In its largest documented operation, Jewelbug obtained write access to a Middle Eastern state telecom/national network-services provider's shared web-hosting platform and inserted a single script tag into the common webmail template — planting the watering hole simultaneously across more than 15 government-ministry tenants, firing on every login page and mailbox view. The hook opens a WebSocket to C2 on login, exfiltrates the session cookie jar, labels the victim by the government email address read from the webmail UI, filters for nine targeted government domains and a non-compromised, Windows host, then overlays the fake Flash-update lure that drops Antino and side-loads PDF Viewer. Victims span government ministries and militaries across the Middle East, Southeast Asia and South Asia (one campaign list alone named 90+ South Asian police/government email addresses); the group's own victim database recorded 1M+ implant check-ins and 580,000+ stolen cookies in under three months, and for at least one victim the extension's native-messaging bridge was used to reach an internal virtualization-management interface. A dormant clipboard-hijacking module capable of swapping copied cryptocurrency addresses exists in the same codebase but was not activated during the observed campaign window. Symantec assesses with high confidence, from government-issued identity documents and a signed authorization letter, that the crypto-fraud/SEO arm is run by a named individual tied to a registered Changsha, Hunan-province company — the same infrastructure, control panel and credentials serve both the espionage and the for-profit crime, the signature of a hack-for-hire entity monetizing state and criminal access from the same shop.
    region_nexus: "Primary victims are government ministries/militaries in the Middle East, Southeast Asia and South Asia (no direct CH/EU victim named); the shared-hosting watering-hole technique and the browser-extension native-messaging sandbox-escape are directly transferable to any government's shared webmail/portal infrastructure, including Swiss cantonal/communal shared e-government hosting."
    primary_sector_nexus: "indirect — technique-transferable to public-sector shared webmail/portal infrastructure; one implant variant separately configured to beacon through the internal corporate proxy of a major U.S. aerospace/industrial manufacturer, showing the tooling also reaches commercial critical-infrastructure-adjacent targets"
