  item: "weekly-w28-vuln-status-rollup"
  url_or_quote: "Confirmed exploited / KEV this week: ... and the Joomla extension file-upload wave (CVE-2026-48908/56290/56291/48939/57827)"
  summary: "The summary frontmatter lists CVE-2026-57827 (RSFiles!) inside the 'Confirmed exploited / KEV this week' wave parenthetical, but the same entry's body states 'CVE-2026-57827/57828 patched without confirmed exploitation yet', and the Joomla top-story confirms 'no confirmed exploitation of that pair yet'. Summary overstates the body/source. Fix: drop 57827 from the confirmed-exploited parenthetical (keep 48908/56290/56291/48939)."
