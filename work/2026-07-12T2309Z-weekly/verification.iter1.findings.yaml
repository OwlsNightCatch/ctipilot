  item: "weekly-w28-government-public-admin-targeting"
  url_or_quote: "three of the five strands carry a direct home-region or EU-critical-operator nexus (a Swiss cantonal authority, a Latvian state operator, an EU-facing espionage watering-hole)"
  summary: "The e-government watering-hole strand is characterised as 'EU-facing', but the cited SentinelLabs source and the referenced operational entry (2026-07-10/e-government-portal-watering-hole-cms-implant-espionage) both describe a PAKISTANI law-enforcement victim in an EU-*supported* (funded) programme; the operational entry states verbatim 'the victim class carries no direct European nexus' and 'Out-of-nexus by victim (Pakistani law enforcement)'. The strand is a transferable-technique inclusion, not an EU-nexus strand. This inflates the 'three of the five' direct-nexus count to what is really two (Swiss PDAG + Latvian LVM). Recharacterise as EU-supported-programme / transferable technique and correct the count; entry itself stays."
