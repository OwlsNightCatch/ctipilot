  - title: "Group-IB reframes Scattered Spider as a decentralised TTP-defined collective (not a single group) — 0ktapus is a subcluster, not a synonym"
    sources:
      - { url: "https://www.group-ib.com/blog/connecting-scattered-spider/", publisher: "Group-IB", date: "2026-07-07", role: "primary" }
    discovery_trace: "first seen at: group-ib (source-list slice, majors-priority), URL https://www.group-ib.com/blog/ (listing) → primary: Group-IB full report, URL https://www.group-ib.com/blog/connecting-scattered-spider/ → corroboration attempt: WebSearch (\"Group-IB Connecting Scattered Spider 0ktapus subcluster report coverage\") found no independent second-source article yet (search dominated by unrelated astrophysics \"spiderweb\" results)"
    summary: |
      Group-IB published (2026-07-07) an actor-definition piece that reframes how defenders should model Scattered Spider: not a single organised group with a hierarchy, but a decentralised cybercrime "movement" or culture — comparable structurally to Anonymous — made up of independent subclusters, typically no larger than 3-5 individuals, unified by shared TTPs and shared online-community learning rather than command structure. Group-IB explicitly states 0ktapus (its own prior designation) is a subcluster of Scattered Spider, not synonymous with it, and maps the other vendor designations (Muddled Libra/Palo Alto, Octo Tempest/Microsoft, UNC3944/Mandiant) as overlapping subcluster labels for the same broader collective rather than distinct groups. Tradecraft documented: vishing/smishing with Okta/Microsoft/Citrix/Google SSO-lookalike pages staged minutes before the phone call; SIM-swap attacks via physical coercion or social engineering of mobile-carrier retail staff; help-desk impersonation using OSINT harvested from already-compromised internal systems; and monetisation/tooling via Google Voice numbers acquired over Telegram, commercial RATs (AnyDesk), automated call-routing ("P1") bots, crypto drainers, and people-search/leak-lookup services (Snusbase, Apollo, RocketReach). Ransomware deployment continues via BlackCat/ALPHV and DragonForce affiliate relationships. The practical takeaway for defenders: treat any Scattered Spider-attributed intrusion as one data point about a small, ad-hoc, English-fluent (PST/EDT-consistent) crew rather than evidence of a persistent, centrally-run adversary — subcluster resilience through decentralisation is explicitly why takedowns of individual members (the group has seen a steady cadence of US arrests/guilty pleas through 2026) have not degraded the broader collective's activity.
    region_nexus: "global; help-desk/SSO social-engineering vishing and SIM-swap techniques are directly transferable to any Swiss/EU enterprise or public-sector help-desk operation"
    primary_sector_nexus: "indirect — no specific public-sector victim named in this report, but the initial-access playbook (help-desk vishing into SSO) is the same class of technique already flagged this week in the Huntress Railway/LSHIY device-code and ROPC research and in the MSG/Odido ShinyHunters vishing incidents this store already tracks"
