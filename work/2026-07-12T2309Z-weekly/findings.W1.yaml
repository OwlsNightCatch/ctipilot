  - title: "jscrambler npm package compromised (v8.14.0-8.20.0): stolen publishing credentials push a Rust infostealer via a preinstall hook, later relocated into a self-executing index.js function to evade scanners"
    sources:
      - { url: "https://socket.dev/blog/jscrambler-supply-chain-attack", publisher: "Socket", date: "2026-07-11", role: "primary" }
      - { url: "https://thehackernews.com/2026/07/compromised-jscrambler-8140-npm-release.html", publisher: "The Hacker News", date: "2026-07-11", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"npm supply chain attack July 2026 new wormable package compromise\") → primary: Socket.dev, URL https://socket.dev/blog/jscrambler-supply-chain-attack → corroboration: WebSearch (\"jscrambler npm package compromise July 2026 socket.dev\") → The Hacker News, URL https://thehackernews.com/2026/07/compromised-jscrambler-8140-npm-release.html"
    summary: |
      On 2026-07-11 the jscrambler npm package (a code-protection/obfuscation build tool) was compromised via what Socket assesses is a stolen publishing credential or compromised build pipeline — the malicious v8.14.0 was pushed directly to npm bypassing the project's normal release flow. The release added an undocumented preinstall hook invoking dist/setup.js, which unpacks an obfuscated 7.8 MB container (dist/intro.js) holding three platform-specific Rust-compiled native binaries (Linux ELF, Windows PE32+, macOS Mach-O), decompresses the matching one to a hidden temp file, marks it executable and spawns it detached with output suppressed — triggered by the mere act of `npm install`, with no need to import or invoke the package. The infostealer targets AWS/GCP/Azure metadata-endpoint credentials and API tokens, Kubernetes configs, browser cookies/autofill, crypto-wallet seed phrases (MetaMask, Phantom, Exodus, Trust Wallet, Coinbase Wallet), AI coding-tool configs (Claude Desktop, Cursor, Windsurf, Zed, VS Code), Discord/Slack/Telegram tokens, Steam sessions and OS keyrings, encrypting ~2,400 recovered configuration strings with ChaCha20-Poly1305 before exfiltration. Socket detected the compromise 6 minutes after publication; the same actor then pushed four more malicious releases (8.16.0, 8.17.0, 8.18.0, 8.20.0) over roughly three hours, and from 8.18.0 onward moved the dropper out of the preinstall hook entirely into a self-executing function at the top of dist/index.js specifically to evade install-script scanners. Version 8.22.0 is confirmed clean. This is a distinct incident from — but the same broader "trusted-build-pipeline" attack-surface theme as — the mini-shai-hulud/TeamPCP worm wave this pipeline already tracks: unlike Shai-Hulud, jscrambler's compromise has not (yet) been shown to self-propagate to other maintainers' packages.
    region_nexus: "global; any organisation with jscrambler in a CI/CD build dependency tree, including Swiss/EU public-sector or CI dev teams using it for JS obfuscation, should treat any install between 2026-07-11 and the confirmed-clean 8.22.0 as a compromise event, not merely a risk"
    primary_sector_nexus: "indirect — generic software-supply-chain/CI exposure relevant to any public-sector development team"
    sector: "technology, cross-sector (software supply chain)"
    cves: []
    techniques: [T1195.002, T1552.001, T1555, T1027]
