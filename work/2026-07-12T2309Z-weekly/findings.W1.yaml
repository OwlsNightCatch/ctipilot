  - title: "Mandiant/GTIG: 'Ghost' ADFS certificates left behind by manual certificate rotation let an attacker with SYSTEM access recover live token-signing keys from Machine DPAPI and forge SAML assertions for any federated user"
    sources:
      - { url: "https://cloud.google.com/blog/topics/threat-intelligence/recovering-active-adfs-signing-keys-machine-dpapi", publisher: "Google Cloud / Mandiant (GTIG)", date: "2026-07-07", role: "primary" }
      - { url: "https://securitybrief.com.au/story/mandiant-finds-way-to-recover-active-adfs-signing-keys", publisher: "SecurityBrief Australia", date: "2026-07-08", role: "corroborating" }
    discovery_trace: "first seen at: mandiant-gtig (source-list slice, majors-priority), URL https://cloud.google.com/blog/topics/threat-intelligence (listing) → primary: Mandiant full report, URL https://cloud.google.com/blog/topics/threat-intelligence/recovering-active-adfs-signing-keys-machine-dpapi → corroboration: WebSearch (\"Mandiant ADFS Machine DPAPI signing keys ghost database recovery\") → SecurityBrief Australia, URL https://securitybrief.com.au/story/mandiant-finds-way-to-recover-active-adfs-signing-keys"
    summary: |
      Mandiant (GTIG) documented, from red-team engagement findings, a Golden-SAML-adjacent technique that exploits configuration drift during manual ADFS token-signing-certificate rotation. ADFS persists the RSA private-key material for its certificates under C:\ProgramData\Microsoft\Crypto\RSA\MachineKeys\, protected by Machine DPAPI (DPAPI_SYSTEM LSA secret + machine masterkey) rather than a user-scoped DPAPI context — meaning any SYSTEM-level process on the ADFS host can recover the key independently of the live ADFS service or LSASS. The specific gap: when AutoCertificateRollover is disabled and admins manually rotate signing certificates without a corresponding WID (Windows Internal Database) update, the WID retains a "ghost" record — it still decrypts successfully but no longer references the certificate ADFS is actually using to sign tokens, which stays live in the machine key store. Detectable side-effect: Event ID 385 marks the certificate-rollover mismatch. With the recovered active signing key, an attacker forges arbitrary SAML assertions to impersonate any federated user — including Global Administrators — against every SAML-federated application, including Microsoft 365 and Entra ID, without needing credentials, bypassing MFA and Conditional Access entirely. The technique deliberately avoids LSASS access and the live ADFS process, both commonly monitored, so it evades much of the tooling enterprises already point at ADFS/Golden SAML abuse. Mandiant's hardening guidance: treat ADFS as Tier-0 infrastructure equivalent to Domain Controllers; move to HSM-backed key protection; use gMSA service identities; validate certificate rotations with Set-AdfsCertificate (not manual file swaps); and monitor the MachineKeys directory with SACL auditing (Event ID 4663) as well as 385.
    region_nexus: "global; ADFS remains widely deployed for federated SSO across Swiss/EU public-sector and enterprise environments — directly relevant follow-on to last week's Keycloak JWT-forgery deep dive for the same identity-infrastructure attack class"
    primary_sector_nexus: "direct — ADFS is a common on-premises federation front-end for Swiss/EU public-sector Microsoft 365/Entra ID tenants"
    sector: "public-sector, cross-sector (identity infrastructure)"
    cves: []
    techniques: [T1552.004, T1606.002, T1078.004]
    affected_products: ["Microsoft Active Directory Federation Services (ADFS)", "Microsoft Entra ID", "Microsoft 365"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "By obtaining the private key of an ADFS token-signing certificate, an attacker can authenticate as any user to any SAML-federated application, bypassing multifactor authentication (MFA), conditional access, and all identity-based controls."
        attribution: "Mandiant (GTIG)"
        source_url: "https://cloud.google.com/blog/topics/threat-intelligence/recovering-active-adfs-signing-keys-machine-dpapi"
      - quote: "ADFS infrastructure should be treated as Tier 0 identity infrastructure, equivalent in criticality to Domain Controllers. If SYSTEM access is achieved on an ADFS host, the signing key must be considered compromised."
        attribution: "Mandiant (GTIG)"
        source_url: "https://cloud.google.com/blog/topics/threat-intelligence/recovering-active-adfs-signing-keys-machine-dpapi"
      - quote: "If an attacker reaches SYSTEM level on an ADFS server, the token-signing key should be treated as compromised."
        attribution: "SecurityBrief Australia"
        source_url: "https://securitybrief.com.au/story/mandiant-finds-way-to-recover-active-adfs-signing-keys"
    extended_notes: |
      Strong deep-dive candidate: pairs directly with last week's Keycloak JWT algorithm-confusion deep dive (both are federated-identity trust-forgery classes hitting the EU public sector's dominant IdPs) and gives a Tier 2/3-actionable detection surface (Event ID 385 + SACL 4663 on the MachineKeys directory) that the Keycloak entry did not have an on-prem-AD equivalent for. No CVE — this is a configuration-drift/architecture finding, not a patchable vulnerability.

  - title: "Sygnia: a lone actor used AI-assisted tooling to go from AWS initial access to broad cloud/CI/CD compromise in ~72 hours using only known techniques, chained faster and in parallel"
    sources:
      - { url: "https://www.sygnia.co/blog/inside-an-ai-assisted-cloud-attack/", publisher: "Sygnia", date: "2026-07-08", role: "primary" }
      - { url: "https://www.infosecurity-magazine.com/news/threat-actor-agentic-ai-cloud/", publisher: "Infosecurity Magazine", date: "2026-07-08", role: "corroborating" }
    discovery_trace: "first seen at: sygnia (source-list slice, rotation-priority), URL https://www.sygnia.co/blog/ (listing) → primary: Sygnia full incident report, URL https://www.sygnia.co/blog/inside-an-ai-assisted-cloud-attack/ → corroboration: WebSearch (\"Sygnia AI-assisted cloud attack 72 hours AWS report coverage\") → Infosecurity Magazine, URL https://www.infosecurity-magazine.com/news/threat-actor-agentic-ai-cloud/"
    summary: |
      Sygnia's incident-response team documented a single threat actor compromising an AWS environment — initial access via weaknesses in an internet-facing application — and progressing to broad compromise of cloud infrastructure, CI/CD pipelines and source-control systems (GitHub/Bitbucket) in approximately 72 hours, using no novel malware and no zero-day. Every individual technique is one defenders have tracked for years: credential harvesting from ECS containers, EC2 instances, CI/CD runners, S3 buckets, Secrets Manager and Systems Manager Parameter Store; persistence via newly created IAM users and access keys; database exfiltration through direct RDS queries; and reversible impact actions (S3 bucket-policy denials, ECS capacity-limit changes, ACL modifications) apparently used to demonstrate capability during extortion. What Sygnia attributes to AI/agentic assistance is the operational tempo and pattern, not a new technique: four distinct IAM access keys used simultaneously from the same source IP/user-agent in a single observed second; hundreds of unique, environment-specific SQL queries generated and run across multiple databases; attacker-authored scripts and HTML artifacts carrying LLM-characteristic phrasing and "pentest"/"red team" framing in commit messages; and rapid, repeated execution of what reads as a checklist-style playbook against each newly obtained credential — consistent with an LLM or agent understanding and adapting to an unfamiliar environment far faster than a human operator would. Sygnia's guidance: detection must shift from "wait for full visibility" to acting on partial signal fast, because AI-assisted operators convert access to impact before conventional cloud-native alerting and manual triage can catch up; hunt for simultaneous multi-key usage from one source, anomalous IAM-user/access-key creation velocity, and RDS query-volume spikes across many databases in a short window.
    region_nexus: "global; directly applicable hunt guidance for any Swiss/EU public-sector or CI organisation running AWS"
    primary_sector_nexus: "indirect — generic cloud-infrastructure exposure, not sector-specific in this report"
