    discovery_trace: "first seen at: unit42 (source-list slice, majors-priority), URL https://unit42.paloaltonetworks.com/ (listing) → primary: Unit 42 full report, URL https://unit42.paloaltonetworks.com/the-gentlemen-ransomware/ → corroboration attempt: WebSearch (\"The Gentlemen ransomware Unit 42 580 victims Storm-2697 report July 10\") found only aggregator re-publishes of the same Unit42 content (no independent second-source article yet)"
    summary: |
      Palo Alto Unit 42 published (2026-07-10) the first full technical profile of The Gentlemen (Microsoft: Storm-2697; also tracked as Phantom Mantis), the RaaS this pipeline has tracked since May via ESET's GentleKiller EDR-killer research and the FortiBleed nexus. Unit 42 counts 580 victims across 77 countries through 3 July 2026 (103 in manufacturing), a 6x increase in claimed victims comparing H2 2025 to H1 2026, and assesses with public-reporting support that the ~20 operators were previously active as "ArmCorp," an affiliate of Qilin RaaS (Unit 42 tracks Qilin as Spikey Scorpius) before rebranding to a RaaS model around September 2025. The group offers affiliates a 90% payout (versus the typical 70-80%) and announced a BreachForums recruitment partnership in May 2026. New technical detail beyond what this pipeline previously carried: initial-access vectors now explicitly include exploitation of Erlang/OTP SSH server flaws and Windows SMB client bugs alongside the already-tracked FortiOS/FortiProxy edge-device path, and a third-party researcher (Expel) is cited describing a suspected zero-day exploit the group uses specifically to disable target EDR agents (distinct from the BYOVD-based GentleKiller framework ESET profiled). The Go/C dual-language encryptor and Curve25519/XChaCha20 per-file ephemeral-key scheme are unchanged from prior reporting.
    region_nexus: "global; prior ESET reporting already places Switzerland as the second-most-targeted European country for this actor"
