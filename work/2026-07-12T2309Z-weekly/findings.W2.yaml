    discovery_trace: "first seen at: WebSearch (\"Cyberbeveiligingswet Eerste Kamer stemming 7 juli 2026 NIS2\") → primary: Rijksoverheid.nl, URL https://www.rijksoverheid.nl/actueel/nieuws/2026/07/07/cyberbeveiligingswet-en-wet-weerbaarheid-kritieke-entiteiten-vanaf-15-augustus-2026-van-kracht → corroborating: Eerste Kamer official vote record, URL https://www.eerstekamer.nl/wetsvoorstel/36764_cyberbeveiligingswet → corroborating (obligations detail, pre-vote): NCSC-NL, URL https://www.ncsc.nl/nieuws/de-cyberbeveiligingswet-in-laatste-fase-van-vaststelling"
    summary: |
      The Dutch First Chamber (Eerste Kamer) passed the Cyberbeveiligingswet (Cbw, the Dutch NIS2 transposition)
      and the companion Wet weerbaarheid kritieke entiteiten (Wwke, the CER-directive transposition) on
      7 July 2026 via a sitting/standing vote ("bij zitten en opstaan"), with only Forum voor Democratie (FVD)
      voting against and DENK not voting; the Tweede Kamer had already passed it 15 April 2026. Both laws now
      enter into force on 15 August 2026 — this closes the "slip past 1 July" status this deployment's prior
      weeklies tracked (W27, 2026-07-05) and fixes a hard date. The Cbw covers ~8,000 organisations across 18
      NIS2-designated essential/important sectors (energy, water, healthcare, transport, government, digital
      infrastructure among them); covered entities must self-assess applicability, register in the NCSC entity
      register, meet a cybersecurity duty of care (zorgplicht) including supply-chain risk management, report
      significant incidents to their CSIRT (meldplicht), and ensure board-level cybersecurity accountability
      with mandatory director training. The Wwke separately designates ~500 critical entities for physical/
      operational resilience obligations against sabotage, terrorism and natural disaster. For Swiss-domiciled
      organisations with Dutch subsidiaries, NL-incorporated critical suppliers, or cross-border NIS2-equivalent
      reporting relationships, 15 August 2026 is now the operative compliance clock — five weeks out from this
      brief.
    region_nexus: "Netherlands (EU); direct relevance to any Swiss/EU public-sector or CI entity with a Dutch subsidiary, Dutch critical-infrastructure supplier, or cross-border NIS2 reporting relationship — and a concrete precedent/timeline datapoint for the deployment's standing EU NIS2/CRA transposition watch"
