      Fixes the exact hard date the prior weekly (2026-07-05, W27) flagged as pending a Senate vote "set for
      7 July." The vote happened and passed with broad cross-party support (only FVD opposed); no delay risk
      remains for the 15 August 2026 date barring a last-minute reversal, which the sources give no indication
      of. Next natural checkpoint for this recurring watch item: confirmation the NCSC-NL entity register
      (mijn.ncsc.nl) is live and accepting registrations ahead of 15 August, and any early enforcement/guidance
      NCSC-NL issues in the run-up.
