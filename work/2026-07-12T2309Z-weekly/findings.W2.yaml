  - title: "FINMA Aufsichtsmitteilung 05/2026: survey of 60 Swiss financial institutions finds no clear post-quantum migration roadmap; FINMA flags 'harvest now, decrypt later' risk and sets crypto-agility/crypto-inventory expectations under operational-risk rules"
    sources:
      - { url: "https://www.finma.ch/news/2026/07/20260709-mm-am-05-26/", publisher: "FINMA (Swiss Financial Market Supervisory Authority)", date: "2026-07-09", role: "primary" }
      - { url: "https://www.swissinfo.ch/eng/various/finma-to-banks-further-measures-are-needed-to-tackle-quantum-computers/91726878", publisher: "SWI swissinfo.ch", date: "2026-07-10", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"FINMA Rundschreiben Cyber 2026\") → pivot: WebSearch (\"FINMA Aufsichtsmitteilung 05/2026 Quantum Computing PDF\") → primary: FINMA, URL https://www.finma.ch/news/2026/07/20260709-mm-am-05-26/ → corroborating: swissinfo.ch, URL https://www.swissinfo.ch/eng/various/finma-to-banks-further-measures-are-needed-to-tackle-quantum-computers/91726878"
    summary: |
      FINMA published Aufsichtsmitteilung (supervisory communication) 05/2026 on 9 July 2026, presenting the
      results of a survey run November 2025-January 2026 across 60 Swiss financial institutions on
      cryptographically-relevant quantum computing (CRQC) risk. Institutions are aware of the threat but, per
      FINMA, "mostly lack a clear roadmap and sufficiently forward-looking planning for the migration to
      quantum-safe encryption" — two-thirds of respondents expect direct CRQC-driven cyber risk exposure within
      seven years (per swissinfo.ch's reporting on the same communication). FINMA explicitly names "harvest
      now, decrypt later" (HNDL) interception-and-store-for-future-decryption as the operative near-term threat
      model — i.e. TLS/VPN/at-rest-encrypted traffic and data captured today by an adversary remains at risk
      once a CRQC is available, regardless of when that arrives. FINMA sets this under existing operational-risk-
      and-resilience supervisory expectations (not a new binding circular): institutions are expected to produce
      a migration strategy/roadmap to post-quantum cryptography, run an institution-specific risk analysis,
      build and maintain a cryptographic inventory (which systems/protocols use which algorithms and key
      lengths), adopt crypto-agility (ability to swap cryptographic primitives without re-architecting), and
      extend this planning to external/outsourced service providers. No new mandatory deadline is set; this is
      supervisory expectation-setting ahead of a future circular, not an enforceable circular itself.
    region_nexus: "Switzerland — direct, home financial-sector regulator; a template other national regulators may follow, relevant background for Swiss federal SOC's finance-sector constituency"
