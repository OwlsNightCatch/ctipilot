    extended_notes: |
      Genuinely new topic for this deployment's tracked policy horizon — no prior coverage of PQC/quantum-risk
      regulatory guidance found in the 14-day prior-coverage index or the entity registry. Actionable framing
      for a technical reader: this is a crypto-inventory and crypto-agility mandate-in-waiting, not a today
      deadline — the defensible near-term action is starting a TLS/VPN/at-rest cryptographic algorithm and
      key-length inventory now, since HNDL risk accrues from today's traffic regardless of migration timeline.
      Worth a follow-up watch for whether FINMA converts this into a binding circular (Rundschreiben) revision,
      and whether NCSC-CH or ENISA issue parallel PQC-migration guidance for the broader public sector.
