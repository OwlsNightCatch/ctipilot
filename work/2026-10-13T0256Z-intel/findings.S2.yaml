    discovery_trace: "first seen at: cert-at daily digest, URL https://www.cert.at/de/tagesberichte/2026/10/tagesberichte-12102026 (links BleepingComputer) and it-connect feed item, URL https://www.it-connect.fr/cyberattaque-supermarches-froid-danfoss/ → pivot: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/cyberattack-shuts-down-refrigerators-at-french-supermarkets/ → pivot: BFMTV (originating report, with the Intermarché internal note), URL https://www.bfmtv.com/economie/consommation/la-temperature-est-montee-jusqu-a-50-degres-une-cyberattaque-contre-les-systemes-frigorifiques-provoque-la-destruction-de-produits-frais-dans-des-centaines-d-intermarche-et-de-super-u_AN-202610120327.html → corroboration: The Record (ANSSI statement) URL https://therecord.media/cyberattack-disrupts-refridgeration-in-france, AFP (Danfoss statement, Paris prosecutor) URL https://www.afp.com/en/french-supermarket-chains-say-cyberattack-forced-refrigerator-shutdown, SRF URL https://www.srf.ch/news/international/hintergruende-unklar-cyberangriff-stoert-kuehlanlagen-franzoesischer-handelsketten → context: Claroty Team82 URL https://claroty.com/team82/research/freeze-the-controller-defrost-the-food-uncovering-vulnerabilities-in-danfoss-refrigeration-controllers and Danfoss DSA-2025-08-01 URL https://www.danfoss.com/en/service-and-support/coordinated-vulnerability-disclosure/danfoss-security-advisories/dsa-2025-08-01/ (also surfaced via WebSearch 'Danfoss AK-SM cyberattack supermarkets France exposed controllers CISA Danfoss statement')"
    summary: |
      FACTS (as attributed). Overnight from Sunday 2026-10-11 to Monday 2026-10-12, the refrigeration of several hundred French supermarkets was
      attacked remotely. Les Mousquetaires (Intermarche, Netto) told BFMTV that 300 of its stores were hit, up from a first estimate of 150, and its spokesperson told SRF
      that the attack targeted a Danish software service provider that several food retailers work with; Cooperative U puts it at fewer than 100 stores (BFMTV) or over 100 (AFP);
      E. Leclerc confirmed to AFP that a refrigeration-equipment supplier was hit. BFMTV, citing sector sources, reports that the attackers forced a continuous
      defrost cycle with a 50 degree setpoint on controllers running older Danfoss regulation software ("anterieures a la version 4"), so cold stock was destroyed; Cooperative U's chief called
      it unprecedented. The Paris prosecutor's cybercrime unit opened an investigation and said fires were reported (AFP, SRF); ANSSI told The Record it was
      mobilised nationally and at EU level. Danfoss told AFP that most of the affected equipment was legacy product that no longer receives software or
      security updates (The Record, earlier the same day, had said Danfoss had not publicly confirmed that its systems were the target).
      CLAIMS AND GAPS. No source names the access vector, an actor, a claim of responsibility or a ransom demand. BleepingComputer, The Record and Help Net Security each say
      it is not known whether the flaws Claroty Team82 published on 2026-08-09 were used. Predicta Lab's chief reported, via X as relayed by BleepingComputer,
      2,752 Danfoss systems reachable online, 1,590 of them in France; The Record cites Claroty for more than 2,700 exposed devices.
      CONTEXT (Claroty, Danfoss). Claroty found thousands of internet-exposed AK-SM 800A management interfaces and three flaws in that web console: a hidden code-of-the-day
      authentication bypass (CVE-2025-41450), a post-authentication command injection in alarm-email fields (CVE-2025-41451) and a post-authentication Nginx-configuration
      injection (CVE-2025-41452); Danfoss's DSA-2025-08-01 lists AK-SM 8xxA Series prior to 4.3.1 as affected by the last two and fixes them in 4.3.1. The store already carries the Claroty research.
      INFERENCE (not a source claim): the one demonstrated way to reach this class of device from outside is an exposed web management interface; whether that was the path here is unestablished.
    region_nexus: "France (neighbouring country; SRF reports it in Switzerland); no Swiss victim named; Swiss install base of Danfoss controllers and Swiss exposure counts unknown"
    primary_sector_nexus: "indirect: commercial food retail. The class (internet-reachable refrigeration and building-supervision web consoles, supplier-managed remote access) also serves hospital, canteen, prison and cold-chain facilities of public bodies (inference; no source states a Swiss public-sector deployment)"
