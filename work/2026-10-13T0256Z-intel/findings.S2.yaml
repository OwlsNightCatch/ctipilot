    summary: |
      GitLab released critical patch versions 19.4.2, 19.3.5 and 19.2.8 on 2026-10-12 for GitLab Community and Enterprise Edition. CVE-2026-97229 (CVSS 3.1 10.0, AV:N/AC:L/PR:N/UI:N) is an integer
      overflow in the CI/CD regular-expression compiler: "under certain conditions" an unauthenticated user could execute arbitrary code on the GitLab server through a specially crafted regular
      expression in a CI/CD configuration. Affected per the vendor: all versions from 19.2 before 19.2.8, 19.3 before 19.3.5 and 19.4 before 19.4.2; GitLab.com is already patched and GitLab Dedicated needs no action.
      The NCSC.ch hub (advisory 13051, 2026-10-12 13:38Z) rates exploitation status as unknown and lists five further high-severity flaws fixed in the same release (CVE-2026-92883 XSS 8.7, CVE-2026-16301
      protected-branch pipeline authorisation 8.5, CVE-2026-14814 cache poisoning exposing protected variables 8.2, CVE-2026-81839 7.7, CVE-2026-96893 prompt-injection attribution 7.3). Reported by joaxcar through HackerOne.
      Context: CVE-2026-85706, the September maximum-severity GitLab path traversal, was added to CISA KEV one day after its fix (BleepingComputer), so a short exploitation lag is plausible for this class of flaw (inference).
      No KEV listing for CVE-2026-97229 in the window (main agent kev-window file shows no additions since 2026-10-12). Version note: BleepingComputer states 19.3 before 19.3.4; the vendor table says before 19.3.5 because 19.3.4 carried a merge-request page bug, so the vendor figure governs.
