    extended_notes: |
      Defender angle, each point source-bound unless marked: (1) inventory every refrigeration, cold-chain and building-supervision controller whose web management is
      reachable from the internet, including through a maintenance supplier's remote access (Claroty: technicians administer these consoles remotely; thousands were exposed);
      (2) for Danfoss AK-SM 8xxA the vendor fix is 4.3.1 (DSA-2025-08-01), but Danfoss says the equipment hit was legacy without updates, so replacement or network isolation is the only lever for those units;
      (3) detection concept: controller and reverse-proxy access logs for the management port, configuration audit entries for defrost schedules and temperature setpoints, and alarm-email configuration changes (the CVE-2025-41451 field);
      The Record relays Claroty's finding that a compromised controller can switch cooling off while still reporting normal temperatures, so (inference) an independent temperature sensor or logger is the only reading that survives a controller compromise.
      Mismatch to resolve: the existing store entry gives CVE-2025-41450 fixed in build 4.2, BFMTV says "before version 4"; Danfoss's advisory page fetched here covers CVE-2025-41451/41452 and 4.3.1 only.
      Not connected by any source: Ahold Delhaize's 2026-10-12 'security issue' in Dutch and Belgian stores (BleepingComputer: no evidence the two are connected).
      Swiss angle: SRF carried the story on 2026-10-12 22:16; cash.ch/AWP carried a Keystone-style wire; no BACS or Swiss retailer statement found. Alternative handling: fold as an update on 2026-08-28/claroty-danfoss-ak-sm-800a-code-of-the-day-rce if the main agent judges the exploitation of the product class the same finding; the incident (hundreds of victims, prosecutor, fires) reads as a distinct finding that builds on it.

