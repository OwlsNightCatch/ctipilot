  - {claim_id: 14f747936f, verdict: ok, source_url: "https://thehackernews.com/2026/10/sonicwall-patches-cvss-100-pre.html", passage: "the appliance restarts when the installation finishes. No workaround is listed."}
  - {claim_id: 8fc6993975, verdict: ok, source_url: "https://security-hub.ncsc.admin.ch/#/posts/13034", passage: "Update 12.10.26 Current exploitation status: Actively exploited; Defused and Previdian honeypot attempts"}
  - {claim_id: 61caf41877, verdict: ok, source_url: "https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2026-0017", passage: "four CVEs (102255-102258) for SMA1000; THN: models 6210, 7210 and 8200v; advisory dated October 6"}
  - {claim_id: 544369e6aa, verdict: ok, source_url: "https://thehackernews.com/2026/10/sonicwall-patches-cvss-100-pre.html", passage: "editorial framing; supported by THN third-time-this-year line"}
