  - {claim_id: aa2a173ab6, verdict: ok, source_url: "https://www.publica.ch/de/cyberangriff-auf-softwarelieferanten", passage: "Name, Vorname, Geburtsdatum, AHV-Nummer, Adresse, Telefonnummer, E-Mailadresse, Vorsorgedaten (Lohn, versicherter Verdienst), Zivilstand, Ehepartner, IBAN; nicht ausschliessen"}
