  - {claim_id: ea3d7f4f12, verdict: ok, source_url: "https://www.watson.ch/schweiz/digital/228405160-pensionskasse-des-bundes-cyberangriff-auf-publica-softwarefirma", passage: "Publica ... nicht ausschliessen, dass moeglicherweise abgeflossene Personendaten missbraucht wuerden ... aufmerksam bei ungewoehnlichen E-Mails, Anrufen oder Nachrichten"}
