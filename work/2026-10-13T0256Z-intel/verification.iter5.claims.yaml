  - {claim_id: f1644f1c98, verdict: ok, source_url: "https://cyber.gc.ca/en/alerts-advisories/sonicwall-security-advisory-av26-1017", passage: "Version 12.4.3-03670 (platform-hotfix) and prior; Version 12.5.0-03082 (platform-hotfix) and prior"}
  - {claim_id: 457d0af338, verdict: ok, source_url: "https://www.bleepingcomputer.com/news/security/sonicwall-warns-of-max-severity-ssrf-flaw-in-sma1000-gateways/", passage: "Shadowserver currently tracks over 400 Internet-exposed SMA1000 appliances, although some may have already been patched ... used by government agencies, MSSPs ... VPN access to internal apps"}
  - {claim_id: 1209a484c1, verdict: ok, source_url: "https://security-hub.ncsc.admin.ch/#/posts/13034", passage: "history: Published 2026-10-07; Edited 2026-10-12 \"updated with Active exploitation claims\"; Defused since oct. 8th; Previdian since oct. 9th"}
