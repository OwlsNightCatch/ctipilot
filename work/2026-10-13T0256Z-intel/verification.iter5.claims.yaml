  - {claim_id: 93e35218bb, verdict: ok, source_url: "https://www.publica.ch/de/cyberangriff-auf-softwarelieferanten", passage: "Stand: 08.10.2026 ... Zivilstand; Angaben zu Ehepartnerin ... IBAN; vermutlich Personendaten ... abgeflossen; Dass Ihre persoenlichen Daten tatsaechlich abgeflossen sind, laesst sich ... nicht ausschl"}
