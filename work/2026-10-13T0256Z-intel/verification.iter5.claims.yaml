  - {claim_id: 8da27d79f0, verdict: ok, source_url: "https://forum.mikrotik.com/t/7-23-8-long-term-is-released/273689", passage: "7.23.8 [long-term] is released! What's new in 7.23.8 (2026-10-08) ... includes CVE-2026-84411; 6.49.23 [long-term] (2026-10-07); notice: long-term - release pending"}
