  - {claim_id: 0a895aa60d, verdict: ok, source_url: "https://www.publica.ch/de/cyberangriff-auf-softwarelieferanten", passage: "derived: Publica \"vermutlich ... abgeflossen\" vs supplier \"noch nicht bekannt, ob Personendaten\"; IBAN listed on Publica page"}
