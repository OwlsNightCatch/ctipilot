  - {claim_id: 51e3ab398d, verdict: ok, source_url: "https://www.watson.ch/schweiz/digital/228405160-pensionskasse-des-bundes-cyberangriff-auf-publica-softwarefirma", passage: "Ob Loesegeldforderungen vorliegen ... wollte Publica mit Verweis auf die laufenden Ermittlungen ... nicht sagen."}
