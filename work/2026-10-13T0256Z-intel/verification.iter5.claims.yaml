  - {claim_id: 2b5e0a5a12, verdict: ok, source_url: "https://blvk.ch/wp-content/uploads/2026/10/20261008_Cyberangriff-auf-Softwarelieferant-von-der-BLV.pdf", passage: "externer Softwarelieferant der BLVK ... Opfer eines Cyberangriffs; BLVK notice does not name PK Softech (entry says so in sourcing_note)"}
