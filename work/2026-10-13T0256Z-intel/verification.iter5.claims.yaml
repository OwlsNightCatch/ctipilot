  - {claim_id: 25ec7cdbd4, verdict: ok, source_url: "https://www.bleepingcomputer.com/news/security/max-severity-sonicwall-sma1000-flaw-now-exploited-in-attacks/", passage: "Previdian has not yet established \"whether those attempts would have successfully compromised any systems.\""}
  - {claim_id: c6e5b576e5, verdict: ok, source_url: "https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2026-0017", passage: "live read 2026-10-13: There is currently no evidence any of the vulnerabilities addressed in this release are being exploited in the wild."}
