  - {claim_id: 20fbc39b35, verdict: ok, source_url: "https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2026-0017", passage: "CVE-2026-102255 - Pre-authentication SSRF via unintended forward-proxy; CWE-441 Unintended Proxy or Intermediary"}
  - {claim_id: 9ee34335a1, verdict: ok, source_url: "https://thehackernews.com/2026/10/sonicwall-patches-cvss-100-pre.html", passage: "told customers to check their appliances for indicators of compromise and, if any were found, to re-image or redeploy ... change user and administrator passwords ... reset the TOTP tokens. It has give"}
