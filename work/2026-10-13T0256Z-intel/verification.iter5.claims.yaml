  - {claim_id: ced64ff09d, verdict: ok, source_url: "https://www.securityweek.com/critical-sonicwall-vulnerability-exploited-days-after-disclosure/", passage: "Defused said that the first exploitation attempts reached its SMA decoys on October 8, only two days after public disclosure."}
