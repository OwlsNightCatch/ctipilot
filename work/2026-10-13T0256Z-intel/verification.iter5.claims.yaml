  - {claim_id: d27727af7a, verdict: ok, source_url: "https://www.publica.ch/de/cyberangriff-auf-softwarelieferanten", passage: "vermutlich Personendaten ... abgeflossen; data list incl. Zivilstand, Angaben zu Ehepartner, IBAN; cash.ch: eher kleine Datenmenge, Geschaeftsdaten; admin.ch headline Datenabfluss bestaetigt"}
  - {claim_id: 1e357e2b07, verdict: ok, source_url: "https://www.bpk.ch/fileadmin/redaktion/3_Kundenservice/3.4_Mitteilungen/Cybervorfall_Softwarelieferantin_BPK_D.pdf", passage: "BPK: keine Hinweise, dass Daten der BPK gestohlen wurden. Jedoch kann dies nicht restlos ausgeschlossen werden; BLVK: prueft ... ob und in welchem Umfang Daten betroffen sind"}
  - {claim_id: 1069b3cd86, verdict: ok, source_url: "https://www.publica.ch/de/cyberangriff-auf-softwarelieferanten", passage: "Publica: dass dabei vermutlich Personendaten von versicherten Personen abgeflossen sind; BPK no indication; BLVK/PK Post Abklaerungen; PK Softech: muss davon ausgegangen werden, dass Daten abgeflossen"}
  - {claim_id: a0e3760c1a, verdict: ok, source_url: "https://www.admin.ch/de/newnsb/FjG4XOIms04s", passage: "Cyberangriff auf Softwarelieferant von Publica: Datenabfluss bestaetigt ... weitere Kunden informiert ... Bundesanwaltschaft hat Ermittlungen aufgenommen. Keine anderen Bundesstellen pflegen Geschaeft"}
  - {claim_id: 1c402b99da, verdict: ok, source_url: "https://pksoftech.ch/de/newsreader/Cyberangriff-auf-die-PKSoftechAG", passage: "Unbekannte haben sich mithilfe von Schadsoftware ... Zugang zu einem Teil unserer IT-Infrastruktur verschafft ... muss davon ausgegangen werden, dass Daten abgeflossen sind (footer: 4153 Reinach)"}
