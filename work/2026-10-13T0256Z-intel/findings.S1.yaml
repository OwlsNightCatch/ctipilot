    discovery_trace: "first seen at: bsi-de, URL https://wid.cert-bund.de/content/public/securityAdvisory/rss ([NEU] [hoch] 'OTRS: Mehrere Schwachstellen', WID-SEC-2026-3872, 2026-10-12 11:54 GMT; bsi-rss) and enisa-euvd critical search (euvdservices.enisa.europa.eu/api/search, EUVD-2026-97258, same record) -> primary: OTRS advisory, URL https://otrs.com/release-notes/otrs-security-advisory-2026-18/ (extract; the URL was the reference in the EUVD record) -> pivot: BSI CSAF WID-SEC-2026-3872 (bsi-csaf) -> pivot: Znuny advisory list, URL https://www.znuny.org/en/advisories (url --direct; found by searching the fork's name, page returned a table of ZSA ids)"
    summary: |
      OTRS AG's advisory OSA-2026-18 (2026-10-12) describes CVE-2026-93582 (CVSS 3.1 9.4, CVSS 4.0 9.2): the HTTP Basic Authentication modules in ((OTRS)) Community Edition 6 and earlier take the
      authenticated username from REMOTE_USER or HTTP_REMOTE_USER, so in CGI and mod_perl deployments an unauthenticated remote attacker who sends a crafted Remote-User request header is treated as that
      user and can authenticate through the Generic Interface as an existing agent or customer without the password; the resulting access depends on the impersonated account. Exploitation requires
      HTTP Basic Authentication to be configured as an authentication backend and a web-server setup that exposes request headers as HTTP_* environment variables. OTRS 7 and later are not affected and the unused
      HTTP_REMOTE_USER fallback was removed there; for the 6.x line the vendor offers no patch and says 6.x and earlier are vulnerable and that products based on the Community Edition are very likely affected. Znuny, the maintained
      fork of the Community Edition, lists ZSA-2026-14 "Unauthenticated Login via HTTP Basic Auth Modules" (severity high, 2026-09-16, CVE requested), which matches by title; the advisory body was not fetched, so treat the match as probable.
      The advisory is one of a batch (OSA-2026-11 to 2026-18) that BSI flags as high. No exploitation or public proof of concept was found; FIRST EPSS is 0.0039 (2026-10-12).
    region_nexus: "DACH: OTRS and Znuny are common help-desk systems in German-speaking administrations (no Swiss deployment figure sourced); BSI rated the batch high"
    primary_sector_nexus: "indirect: help-desk and ticketing systems of public bodies on legacy OTRS 6 or Znuny"
