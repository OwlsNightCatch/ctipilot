  - title: "GitLab CE/EE CVE-2026-97229: CVSS 10.0 unauthenticated code execution through a crafted CI/CD regular expression, fixed in 19.4.2, 19.3.5 and 19.2.8; the 19.4.1 fix of 23 September does not close it"
    sources:
      - { url: "https://docs.gitlab.com/releases/patches/patch-release-gitlab-19-4-2-released/", publisher: "GitLab (Critical Patch Release 19.4.2, 19.3.5, 19.2.8)", date: "2026-10-12", role: "primary" }
      - { url: "https://cert.europa.eu/publications/security-advisories/2026-016/", publisher: "CERT-EU", date: "2026-10-12", role: "corroborating" }
      - { url: "https://security-hub.ncsc.admin.ch/#/posts/13051", publisher: "NCSC Switzerland (Cyber Security Hub post 13051)", date: "2026-10-12", role: "corroborating" }
      - { url: "https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-1294/", publisher: "CERT-FR", date: "2026-10-12", role: "corroborating" }
      - { url: "https://www.bleepingcomputer.com/news/security/gitlab-warns-of-max-severity-rce-flaw-in-regex-compiler-engine/", publisher: "BleepingComputer", date: "2026-10-12", role: "corroborating" }
      - { url: "https://docs.gitlab.com/releases/patches/patch-release-gitlab-19-4-1-released/", publisher: "GitLab (Critical Patch Release 19.4.1, 19.3.3, 19.2.7)", date: "2026-09-23", role: "context" }
    discovery_trace: "first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/13051 (ncsc-csh recent 25; post created 2026-10-12T13:38Z) and cert-eu, URL https://cert.europa.eu/publications/security-advisories/2026-016/ (cert-eu recent 15) -> primary: GitLab patch release page, URL https://docs.gitlab.com/releases/patches/patch-release-gitlab-19-4-2-released/ (extract) -> corroboration: CERT-FR AVI-1294 (anssi-fr avis-recent), BleepingComputer URL https://www.bleepingcomputer.com/news/security/gitlab-warns-of-max-severity-rce-flaw-in-regex-compiler-engine/ (BleepingComputer feed), CVE record and ENISA EUVD-2026-98214 read through euvdservices.enisa.europa.eu search API and cveawg.mitre.org (identifier check, not cited) -> context: GitLab 19.4.1 page https://docs.gitlab.com/releases/patches/patch-release-gitlab-19-4-1-released/ for the earlier authenticated regex flaws"
    summary: |
      GitLab released 19.4.2, 19.3.5 and 19.2.8 on 2026-10-12 (24 fixes). The lead flaw, CVE-2026-97229 (CVSS 3.1 10.0, vector AV:N/AC:L/PR:N/UI:N/S:C),
      is an integer overflow (CWE-190) in the CI/CD regular-expression compiler: GitLab says that "under certain conditions" an unauthenticated user could
      execute arbitrary code on the GitLab server through a specially crafted regular expression in a CI/CD configuration. Affected are self-managed CE and
      EE from 19.2 before 19.2.8, 19.3 before 19.3.5 and 19.4 before 19.4.2; GitLab.com already runs the fix and Dedicated customers need no action. The
      vendor page lists no workaround and no exploitation statement, NCSC Switzerland records the exploitation status as unknown, the flaw is not in CISA
      KEV (catalog 2026.10.08) and no public proof of concept was found; GitLab publishes issue detail 90 days after release. The same reporter (joaxcar)
      and the same component produced CVE-2026-93577 (integer overflow when compiling a regular expression) and CVE-2026-89078 (double free in the regex parser)
      in the 19.4.1 release of 2026-09-23, both CVSS 9.9 but requiring an authenticated user (PR:L); CVE-2026-97229 appears to remove that requirement, and its
      CVE record was reserved on 2026-09-24, so a 19.4.1, 19.3.3 or 19.2.7 instance is still vulnerable. Ambiguity to carry: the vendor and the CVSS vector say
      PR:N, NCSC Switzerland states the prerequisite as network access plus "delivery of a crafted regular expression through CI/CD configuration", and the CVE record tags its two HackerOne
      references "permissions-required"; no source states which feature lets an unauthenticated visitor get a configuration evaluated. Version discrepancy: CERT-EU, CERT-FR and BleepingComputer cite 19.3.4 as the 19.3 fix
      but the vendor page now lists 19.3.5 and says 19.3.4 carried a merge-request page bug, so 19.3.4 is treated as unfixed.
    region_nexus: "global; self-managed GitLab is common in public-sector software delivery (no Swiss deployment figure sourced); NCSC Switzerland and CERT-EU both issued advisories within hours"
    primary_sector_nexus: "indirect: software-delivery and CI/CD infrastructure of public bodies and their suppliers"
    sector: "public-sector"
    cves: [CVE-2026-97229]
    techniques: [T1190]
    affected_products: ["GitLab Community Edition", "GitLab Enterprise Edition"]
    entity_keys: ["product:gitlab", "product:gitlab-ce", "product:gitlab-ee", "product:gitlab-ci"]
    new_entities: []
