    novelty: new
    borderline: true
    borderline_reason: "CVSS 9.4 and unauthenticated, but configuration-gated (HTTP Basic backend plus header-to-environment mapping), end-of-life 6.x, no exploitation, and Znuny listed the matching fix on 2026-09-16; Swiss deployment unestablished"
    evidence:
      - quote: "Please note that ((OTRS)) Community Edition 6.x and before are vulnerable."
        attribution: "OTRS AG (OSA-2026-18)"
        source_url: "https://otrs.com/release-notes/otrs-security-advisory-2026-18/"
      - quote: "Exploitation requires HTTP Basic Authentication to be configured as an authentication backend"
        attribution: "OTRS AG (OSA-2026-18)"
        source_url: "https://otrs.com/release-notes/otrs-security-advisory-2026-18/"
      - quote: "Products based on the ((OTRS)) Community Edition also very likely to be affected"
        attribution: "OTRS AG (OSA-2026-18)"
        source_url: "https://otrs.com/release-notes/otrs-security-advisory-2026-18/"
      - quote: "Update to latest version of OTRS (2026.7.1. or later)."
        attribution: "OTRS AG (OSA-2026-18)"
        source_url: "https://otrs.com/release-notes/otrs-security-advisory-2026-18/"
      - quote: "Unauthenticated Login via HTTP Basic Auth Modules"
        attribution: "Znuny (advisory list)"
        source_url: "https://www.znuny.org/en/advisories"
    extended_notes: |
      Exposure: an OTRS CE 6.x or Znuny system whose authentication backend is Apache or mod_perl HTTP Basic (SSO-style setups), reachable from the attacker; OTRS 7+ and the
      current OTRS releases are unaffected. Detection concept: web-server access logs for requests to the Generic Interface (and agent/customer entry points) that carry a Remote-User
      or Remote_User header from clients, and ticket-system audit entries for logins by a user whose password was not presented; a legitimate SSO front end sets that value server-side, so
      client-sent headers at the origin are the discriminator. Hardening: strip or reject client-supplied Remote-User headers at the reverse proxy, restrict the Generic Interface, migrate off 6.x.
      Possibly not worth an entry on its own (hence borderline); would fold into a DACH help-desk note if the store ever carries one.

