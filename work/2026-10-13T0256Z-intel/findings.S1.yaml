  - title: "((OTRS)) Community Edition 6 and forks: unauthenticated login as any agent or customer through a spoofed Remote-User header when HTTP Basic Authentication is the backend (CVE-2026-93582, CVSS 9.4); no fix for the end-of-life 6.x line, Znuny listed a matching advisory on 2026-09-16"
    sources:
      - { url: "https://otrs.com/release-notes/otrs-security-advisory-2026-18/", publisher: "OTRS AG (OSA-2026-18)", date: "2026-10-12", role: "primary" }
      - { url: "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-3872", publisher: "BSI CERT-Bund (WID-SEC-2026-3872)", date: "2026-10-12", role: "corroborating" }
