    evidence:
      - quote: "GitLab has remediated an issue that, under certain conditions, could have allowed an unauthenticated user to execute arbitrary code on the GitLab server via a specially crafted regular expression in a CI/CD configuration, due to insufficient regular expression validation."
        attribution: "GitLab (Critical Patch Release 19.4.2, 19.3.5, 19.2.8)"
        source_url: "https://docs.gitlab.com/releases/patches/patch-release-gitlab-19-4-2-released/"
      - quote: "all versions from 19.2 before 19.2.8, 19.3 before 19.3.5, and 19.4 before 19.4.2"
        attribution: "GitLab (Critical Patch Release 19.4.2, 19.3.5, 19.2.8)"
        source_url: "https://docs.gitlab.com/releases/patches/patch-release-gitlab-19-4-2-released/"
      - quote: "19.3.4 had a bug that affected merge request pages when the Ona integration was enabled. This is fixed in 19.3.5."
        attribution: "GitLab (Critical Patch Release 19.4.2, 19.3.5, 19.2.8)"
        source_url: "https://docs.gitlab.com/releases/patches/patch-release-gitlab-19-4-2-released/"
      - quote: "could have allowed an authenticated user to execute arbitrary code on the GitLab server due to an integer overflow issue when compiling a specially crafted regular expression in a CI/CD configuration"
        attribution: "GitLab (Critical Patch Release 19.4.1, 19.3.3, 19.2.7)"
        source_url: "https://docs.gitlab.com/releases/patches/patch-release-gitlab-19-4-1-released/"
      - quote: "CERT-EU strongly recommends upgrading self-managed GitLab CE/EE instances to a fixed version as soon as possible, starting with internet-facing instances."
        attribution: "CERT-EU"
        source_url: "https://cert.europa.eu/publications/security-advisories/2026-016/"
      - quote: "Network access to an affected self-managed instance and delivery of a crafted regular expression through CI/CD configuration"
        attribution: "NCSC Switzerland (Cyber Security Hub post 13051)"
        source_url: "https://security-hub.ncsc.admin.ch/#/posts/13051"
      - quote: "GitLab warned users today to immediately patch a maximum-severity vulnerability in the CI/CD Regular Expression Compiler that could let remote attackers run arbitrary code on targeted instances."
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/gitlab-warns-of-max-severity-rce-flaw-in-regex-compiler-engine/"
    extended_notes: |
      Suggested classification A2 (GitLab is the first-hand authority and national CERTs relay it, but exploitation is unreported and the unauthenticated precondition is
      the vendor's own claim). Same release also fixes CVE-2026-92883 (8.7, stored XSS via syntax highlighting, authenticated), CVE-2026-16301 (8.5, Developer role runs
      downstream pipelines on protected branches), CVE-2026-14814 (8.2, repository raw-file cache poisoning can expose protected CI/CD variables), CVE-2026-81839 (7.7,
      EE scheduled-pipeline-policy privilege leak after project transfer) and CVE-2026-96893 (7.3, EE Duo Agent Platform prompt injection); upgrading closes all of them.
      Exposure: self-managed CE/EE on 19.2.x, 19.3.x or 19.4.x below the fixed builds; the vendor's Impacted Versions start at 19.2, so earlier branches are not listed
      (absence in a vendor table, not a statement about older branches). Instances reachable from the internet, or by any untrusted internal network, come first (CERT-EU).
      Detection (inference from the mechanism, no source gives indicators): process-creation telemetry for shells, interpreters or network tools whose parent is the
      GitLab Rails/Puma/Sidekiq worker tree; crashes or restarts of those workers around pipeline creation; pipeline-creation and CI-lint requests from accounts or
      sources that have not used the instance before. Post-patch compromise check: as the attack needs a crafted CI configuration evaluated by the server, review
      recently created pipelines and CI configuration changes before the upgrade, and rotate runner registration tokens, CI/CD variables and deploy keys if any host
      showed the process pattern above. Hardening lever: upgrade; GitLab names no workaround. Triage: ordinary CI jobs legitimately run shells under runners, so only
      shells spawned by the GitLab application server processes themselves match this flaw, not runner-side job processes.
      Prior store coverage of GitLab: 2026-09-12 CVE-2026-85706 (KEV) and the 2026-09-24 fire's borderline-drop of CVE-2026-89078/93577 as authenticated; this CVE is a distinct finding
      (no CVE overlap) but the entry should reference the 19.4.1 relationship.
    priority_suggestion: high

