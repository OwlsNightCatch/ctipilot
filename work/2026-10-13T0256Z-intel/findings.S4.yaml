    extended_notes: |
      DETECTION CONCEPTS (telemetry class first; only what the sources support or follow mechanically from the mechanism):
      - Controller-side event/audit records: setpoint, defrost-schedule or defrost-termination changes and new/changed accounts on the supervisory
        controller outside a maintenance window (CERT-FR tells operators to verify existing accounts, which implies account tampering is in scope).
      - Network telemetry (firewall / ISP / provider VPN logs): inbound connections to the controller management interface from addresses that are
        not the refrigeration service provider (CERT-FR: restrict access to the providers only).
      - Temperature alarms from the controller are NOT sufficient on their own: Claroty's August research, as relayed by Infosecurity, showed a
        compromised AK-SM 800A could disable cooling while falsifying readings. Independent temperature probes are a logical inference, not a
        source statement.
      TRIAGE / BENIGN LOOKALIKE (BFM): a defrost cycle is a normal scheduled function (sector professionals quoted by BFM: programmed for about two hours
      per 24 hours). The attack signature in the reporting is a forced, continuous defrost with a 50 degC setpoint held for hours, starting around midnight
      in some stores; a Danfoss display still read above 26 degC on Monday morning (cyberattaque.org describing BFM footage).
      POST-INCIDENT COMPROMISE CHECK (CERT-FR, verbatim list in the alert): filter network access to maintenance providers only; factory reset; apply all
      available security fixes; rotate secrets; verify existing accounts; reconfigure the device overall. A patch alone does not evict a controller that was
      already taken over.
      HARDENING: remove internet exposure of AK-SM / AK-SC management interfaces (CERT-FR); for AK-SM 8xxA move to firmware R4.3.1 or later per Danfoss
      advisory DSA-2025-08-01 (advisory index fetched); Danfoss told AFP it has long advised migrating legacy models to current-generation ones, i.e. the AK-SM800
      and AK-SC355 receive no fixes and can only be isolated or replaced (cyberattaque.org adds that Danfoss declared the AK-SM 800 end of life in May 2021; not
      independently verified).
      UNVERIFIED / NOT CARRIED: cyberattaque.org says a Danfoss note of October 2025 documents earlier attacks on 16 stores in Russia (2022) and 40 in Israel; I could
      not find that note, so it is not carried. Infosecurity says stores in Belgium and the Netherlands were 'reportedly' affected; BleepingComputer says there is no
      evidence the Ahold Delhaize incident is connected. Flying Penguin (commentary) speculates on motive and CRA liability; not used for facts.
      SWISS ANGLE: none reported. Blick (AFP) shows Swiss press picked up the story on 2026-10-12. NCSC.ch security-hub feed (fetched 2026-10-13) carries no Danfoss post yet.
    actions_candidates:
      - "Inventory every Danfoss AK-SM / AK-SC (and other ADAP-KOOL system managers) in facilities you own or that a refrigeration contractor manages for you, and confirm none has a management interface reachable from the internet; if one is, filter it to the provider's addresses or take it offline and work CERT-FR's compromise checklist (factory reset, patch, rotate secrets, review accounts)."

