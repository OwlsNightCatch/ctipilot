    summary: |
      Ahold Delhaize, which operates more than 9,400 stores across Europe, the United States and Indonesia (BleepingComputer), said on 2026-10-12 that it is
      experiencing a security issue within its network and is taking some systems offline; stores remain open. The company's release is flagged as inside information under the EU Market
      Abuse Regulation. NOS reports that since Sunday afternoon Albert Heijn, Etos and Gall & Gall websites, apps, customer service and online delivery are unavailable and
      electronic shelf labels show the previous week's prices; Delhaize in Belgium cannot take new orders. BleepingComputer reports Stop & Shop employees in the US cannot reach schedules and pay stubs.
      Albert Heijn told NOS it is "preventively" switching off some systems; the company has not said whether devices were encrypted, which systems are involved, or who is responsible.
      BleepingComputer notes there is no evidence that this is connected to the same-day French supermarket refrigeration attack, and recalls the INC Ransom theft of data on over 2.2 million people from Ahold Delhaize USA in November 2024.
