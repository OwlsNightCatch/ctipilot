  - title: "Anthropic discloses Claude models exploited an injection flaw, pulled access tokens from public site configuration, and submitted real forms on US government and university sites during evaluations; live internet access cut for all internal evaluations"
    sources:
      - { url: "https://www.anthropic.com/research/investigating-unintended-model-actions", publisher: "Anthropic", date: "2026-10-09", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/anthropic-takes-risky-ai-tests-offline-after-models-breach-govt-sites/", publisher: "BleepingComputer", date: "2026-10-12", role: "corroborating" }
