    discovery_trace: "first seen at: bleepingcomputer feed, URL https://www.bleepingcomputer.com/feed/ -> article https://www.bleepingcomputer.com/news/security/cyberattack-shuts-down-refrigerators-at-french-supermarkets/ -> pivot: BFM Business, URL https://www.bfmtv.com/economie/consommation/la-temperature-est-montee-jusqu-a-50-degres-une-cyberattaque-contre-les-systemes-frigorifiques-provoque-la-destruction-de-produits-frais-dans-des-centaines-d-intermarche-et-de-super-u_AN-202610120327.html -> pivot: AFP, URL https://www.afp.com/en/french-supermarket-chains-say-cyberattack-forced-refrigerator-shutdown (also seen via databreaches-net feed https://databreaches.net/feed/ -> https://databreaches.net/2026/10/12/french-supermarket-chains-say-cyberattack-forced-refrigerator-shutdown/) -> pivot: Infosecurity, URL https://www.infosecurity-magazine.com/news/french-supermarket-chains/ -> primary: CERT-FR alert feed https://www.cert.ssi.gouv.fr/alerte/feed/ -> https://www.cert.ssi.gouv.fr/alerte/CERTFR-2026-ALE-012/ ; vendor context: Danfoss advisory index https://danfoss.com/en/service-and-support/coordinated-vulnerability-disclosure/danfoss-security-advisories/"
    summary: |
      Overnight on 11-12 October 2026 attackers remotely drove refrigeration supervisory controllers in hundreds of French
      supermarkets into forced, continuous defrost with a temperature setpoint of 50 degC, destroying fresh and frozen stock.
      Victim statements to AFP: at least 300 Intermarche/Netto stores, more than 100 (Cooperative U says "fewer than one hundred" to BFM)
      Cooperative U outlets, several E. Leclerc stores; a Carrefour spokesperson told Infosecurity 80 of 6,000 stores and Groupe Casino
      said about 5% of Monoprix stores were affected. BFM reports EUR 270,000 of losses at two Haguenau stores alone; the Intermarche
      chief executive put the national loss at tens of millions of euros (AFP/Blick). The Paris prosecutor opened an investigation
      entrusted to the national anti-cybercrime office (OFAC) citing food losses and equipment that began to catch fire.
      Danfoss told AFP that most affected units are legacy products that no longer receive software or security updates, naming the
      AK-SM800 and AK-SC355 regulators, a version of the former on outdated firmware. BFM reports the targeted software was
      versions older than version 4. An Intermarche spokesperson told Infosecurity the attackers targeted outdated versions on consoles with
      remote-control capability that lacked an adequately secured communication channel. A person close to the French Prime Minister
      said ANSSI had identified a vulnerability in software from a Danish company, had contacted the vendor and was liaising with
      European counterparts because other countries may be affected. CERT-FR alert CERTFR-2026-ALE-012 states it is aware of numerous
      compromises of Danfoss AK-SM and AK-SC series devices, says exposing a management interface to the internet is contrary to good
      practice, advises disconnecting or filtering access, and, where compromise is suspected, lists: restrict network access to the
      maintenance providers only, factory reset, apply all available fixes, rotate secrets, verify existing accounts, reconfigure the device.
      No source read names an actor or a claim of responsibility, and none names the specific flaw or credential weakness used (flyingpenguin
      commentary calls it unclaimed and unattributed; ANSSI's source speaks of "a vulnerability"). Danfoss's advisory index (fetched 2026-10-13)
      lists no advisory for this event; its earlier AK-SM advisories are DSA-2023-08-01 (AK-SM 800A below 3.3), DSA-2025-03-01
      (CVE-2025-41450, AK-SM 8xxA prior to 4.2) and DSA-2025-08-01 (CVE-2025-41451, CVE-2025-41452, prior to 4.3.1); no source links
      this attack to any of them. Exposure data: Predicta Lab's CEO counted 2,752 Danfoss systems reachable online on Monday, 1,590 in France
      (BleepingComputer); Infosecurity cites a Shodan count of 3,726 AK-SM 800A controllers on 19 August.
    region_nexus: "France (hundreds of stores confirmed by retailers); ANSSI says other European countries may be affected; Infosecurity reports Belgian/Dutch stores as 'reportedly' affected but BleepingComputer finds no link to the separate Ahold Delhaize incident, so that is unverified. No Swiss victim named in any fetched source."
    primary_sector_nexus: "indirect: retail / food cold chain; no public-sector victim reported. The transferable exposure is internet-reachable refrigeration and building-management supervisory controllers, including ones managed by service contractors (hospital kitchens, cold stores, canteens are the public-sector analogue - an inference, not source-stated)."
