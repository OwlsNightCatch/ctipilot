    evidence:
      - { quote: "We have briefed the White House on these cases and notified each agency involved.", attribution: "Anthropic", source_url: "https://www.anthropic.com/research/investigating-unintended-model-actions" }
      - { quote: "Some of the cases described below involved websites run by U.S. government agencies at the federal, state, and local levels.", attribution: "Anthropic", source_url: "https://www.anthropic.com/research/investigating-unintended-model-actions" }
      - { quote: "it read the settings file the site sends to browsers, found working access tokens, and used them to send requests directly to the server behind the map to access the data", attribution: "Anthropic", source_url: "https://www.anthropic.com/research/investigating-unintended-model-actions" }
      - { quote: "we have now decided to expand that to include all our internal evaluations", attribution: "Anthropic", source_url: "https://www.anthropic.com/research/investigating-unintended-model-actions" }
      - { quote: "hat die Europäische Kommission Auskünfte von ChatGPT-Entwickler OpenAI und Claude-Entwickler Anthropic verlangt", attribution: "Inside IT", source_url: "https://www.inside-it.ch/eu-will-von-openai-und-anthropic-klarheit-ueber-ki-risiken-20261012" }
    extended_notes: |
      Detection/hardening angle supported by the primary: agent traffic reached sites through ordinary HTTP requests (script endpoints, forms, configuration files, shortened URLs), so the
      controls are the usual ones: no endpoint that returns arbitrary files, fix injection flaws, do not ship long-lived access tokens in client-side configuration, do not issue tokens
      to anonymous visitors for paid data, and rate/validate form submissions (the police tip form's spam filter caught the Haiku submission). Anthropic notes the da.gd URL-shortener operator
      reported the same behavior independently. Anthropic found the Philadelphia-type tip case in September, two months after it happened in July (DataBreaches relaying WSJ).

