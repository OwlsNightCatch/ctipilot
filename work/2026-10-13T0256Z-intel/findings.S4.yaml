    discovery_trace: "first seen at: inside-it-ch feed, URL https://www.inside-it.ch/rss.xml -> https://www.inside-it.ch/tausende-schweizer-fortigate-firewalls-online-erreichbar-20261012 ; netzwoche feed https://www.netzwoche.ch/rss.xml -> https://www.netzwoche.ch/news/2026-10-12/ueber-4300-fortigate-firewalls-in-der-schweiz-stehen-offen-im-internet ; the Risikomonitor report itself was not found (WebSearch 'Risikomonitor Fortigate Europa 82.236 offene Oberflaechen 42 Laender Schweiz 4313' did not surface it), so both Swiss outlets are one underlying source"
    summary: |
      Swiss trade press reports an analysis by the Austrian security company Risikomonitor: 4,313 FortiGate management or VPN interfaces are reachable from the internet in Switzerland
      (rank 7 of 42 European countries; 82,236 across Europe; Italy 13,283, France 11,554, Spain 7,929, Austria 6,203, Germany 5,699, Netherlands 5,249). For a Swiss subset of 1,455 devices
      analysed in detail, about 60% are small models (30-to-90 series; FortiGate 60F 287 devices, 40F 243), 44 are end-of-life hardware, and 689 sit in Swisscom networks, 92 Sunrise, 39 WWZ.
      The analysis is passive; it cannot tell the FortiOS version, whether a device is vulnerable or whether it is compromised. Both outlets tie it to the FortiBleed credential-reuse campaign
      (FBI/Secret Service advisory of 2026-10-06: more than 86,000 devices compromised, stolen credentials reused). Risikomonitor recommends removing administration access from the internet, restricting remote access and strong two-factor authentication.
    region_nexus: "Switzerland (4,313 exposed interfaces), Europe"
    primary_sector_nexus: "indirect: small-office and branch FortiGates (practices, law firms, trades, branches) per Risikomonitor; no public-sector breakdown given"
    sector: "cross-sector"
    cves: []
    techniques: [T1078]
