  - claim_id: 28f26d61df
    entry: 2026-10-10/cve-2026-84411-mikrotik-routeros-web-management-preauth-rce
    surface: "summary"
    kind: frontmatter
    text: "MikroTik's notice of 2026-10-06 describes CVE-2026-84411, an integer underflow in HTTP request body handling of the RouterOS web management service (WebFig, on the www and www-ssl ports) that one crafted request sent without logging in can use to crash the service or run code on the router with full privileges; CISA scores it CVSS 3.1 9.8. RouterOS before 7.24, v6 included, is affected where an attacker can reach the web interface; 7.24 fixes the v7 stable channel and MikroTik's changelogs list the fix in 7.23.8 (v7 long-term, 2026-10-08) and 6.49.23 (v6 long-term, 2026-10-07), although its notice still shows both long-term releases as pending; MikroTik says the default firewall already blocks the web interface from the internet, and CISA records no known public exploitation."
