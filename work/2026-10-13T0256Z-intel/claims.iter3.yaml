  - claim_id: d08f9600ba
    entry: 2026-10-13/cve-2026-97229-gitlab-ci-regex-compiler-unauthenticated-rce
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** upgrade to 19.4.2, 19.3.5 or 19.2.8 now, starting with internet-facing instances as CERT-EU advises ("
    urls: ["https://cert.europa.eu/publications/security-advisories/2026-016/"]
  - claim_id: 8224325ff2
    entry: 2026-10-13/cve-2026-97229-gitlab-ci-regex-compiler-unauthenticated-rce
    surface: "body"
    kind: cited
    text: "); GitLab's release page lists no workaround as of 2026-10-13, so an instance that cannot be upgraded this week should be kept off untrusted networks; on a single-node instance the upgrade causes downtime, because migrations must finish before GitLab can start, so schedule the window now ("
    urls: ["https://docs.gitlab.com/releases/patches/patch-release-gitlab-19-4-2-released/"]
  - claim_id: 759a4d907c
    entry: 2026-10-13/cve-2026-97229-gitlab-ci-regex-compiler-unauthenticated-rce
    surface: "body"
    kind: derived
    text: "**Detection:** GitLab and NCSC publish no indicators, so this is a hunt for the mechanism: in process-creation telemetry, shells, interpreters or network tools started as children of the GitLab application server processes, and in GitLab's audit and application logs, recently created or changed CI/CD configurations that carry unusual regular expressions, from accounts or addresses that have not used the instance before."
  - claim_id: b4631e46cc
    entry: 2026-10-13/cve-2026-97229-gitlab-ci-regex-compiler-unauthenticated-rce
    surface: "body"
    kind: derived
    text: "A server where that turns up needs its CI/CD variables, runner registration tokens and deploy keys treated as exposed."
  - claim_id: a7edfd5272
    entry: 2026-10-13/cve-2026-97229-gitlab-ci-regex-compiler-unauthenticated-rce
    surface: "body"
    kind: derived
    text: "**Triage:** ordinary CI jobs run shells under the runners; only a shell spawned by the GitLab application server processes themselves matches this flaw, not one started inside a runner job."
