  - claim_id: 457d0af338
    entry: 2026-10-08/cve-2026-102255-sonicwall-sma1000-workplace-ssrf
    surface: "body"
    kind: cited
    text: "Shadowserver tracks over 400 internet-exposed SMA1000 appliances, some of which may already be patched, and BleepingComputer says government agencies and managed service providers use the product to give VPN access to internal applications ("
