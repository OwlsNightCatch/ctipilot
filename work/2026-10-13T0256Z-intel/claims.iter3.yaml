claims:
  - claim_id: b74cb735dd
    entry: 2026-10-08/cve-2026-102255-sonicwall-sma1000-workplace-ssrf
    surface: "headline"
    kind: frontmatter
    text: "NCSC.ch now rates the SonicWall SMA1000 pre-auth SSRF actively exploited; SonicWall still reports no evidence"
  - claim_id: 3ef3e747c1
    entry: 2026-10-08/cve-2026-102255-sonicwall-sma1000-workplace-ssrf
    surface: "summary"
    kind: frontmatter
    text: "SonicWall's advisory SNWLID-2026-0017 (2026-10-06) fixes four SMA1000 flaws, led by CVE-2026-102255, a pre-authentication server-side request forgery in the Work Place interface (CVSS 3.0 10.0) that affects 12.4.3-03526 and 12.5.0-02952, the hotfixes issued for the September zero-days; fixed builds are 12.4.3-03670 and 12.5.0-03082. Two honeypot operators report exploitation attempts against the flaw, Defused from 2026-10-08 and Previdian from 2026-10-09, and NCSC Switzerland recorded it as actively exploited on 2026-10-12, without anyone establishing that an attempt would have compromised a system; SonicWall's advisory still says it has no evidence of exploitation. The two earlier unauthenticated Work Place SSRF flaws this year were exploited, each paired with an administrator-only command-execution flaw."
  - claim_id: 6c550100da
    entry: 2026-10-08/cve-2026-102255-sonicwall-sma1000-workplace-ssrf
    surface: "body"
    kind: cited
    text: "CVE-2026-102255 (CVSS 3.0 10.0) is a pre-authentication server-side request forgery in the Work Place interface, attributed to an unintended alternate access path, through which a remote unauthenticated attacker can direct the appliance to issue requests on their behalf, reach internal functionality and perform unauthorized operations ("
    urls: ["https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2026-0017"]
  - claim_id: df542a5634
    entry: 2026-10-08/cve-2026-102255-sonicwall-sma1000-workplace-ssrf
    surface: "body"
    kind: cited
    text: "The other three flaws need a login: an OS command injection that lets an administrator execute commands (CVE-2026-102256, 7.8), a Zip Slip in the Appliance Management Console that leads to code execution (CVE-2026-102257, 7.2) and a stored cross-site scripting flaw in that console (CVE-2026-102258, 5.5) ("
    urls: ["https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2026-0017"]
  - claim_id: 257e752e74
    entry: 2026-10-08/cve-2026-102255-sonicwall-sma1000-workplace-ssrf
    surface: "body"
    kind: cited
    text: "SonicWall's advisory says there is currently no evidence that any of them is exploited ("
    urls: ["https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2026-0017"]
  - claim_id: 103c2c99c8
    entry: 2026-10-08/cve-2026-102255-sonicwall-sma1000-workplace-ssrf
    surface: "body"
    kind: cited
    text: "The Hacker News counts it as the third time this year that SonicWall has fixed a 10.0-rated Work Place SSRF that needs no login; in July and September SonicWall said it had investigated attacks on the earlier pairs (\"multiple cases\" and \"a case\"), each pair combining an SSRF that needs no login with a second flaw that lets a logged-in administrator run commands ("
    urls: ["https://thehackernews.com/2026/10/sonicwall-patches-cvss-100-pre.html"]
  - claim_id: ec00308474
    entry: 2026-10-08/cve-2026-102255-sonicwall-sma1000-workplace-ssrf
    surface: "body"
    kind: cited
    text: "CERT-FR notes that such pairs have been actively exploited several times this year on this product ("
    urls: ["https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-1275/"]
  - claim_id: 167c6d6e7d
    entry: 2026-10-08/cve-2026-102255-sonicwall-sma1000-workplace-ssrf
