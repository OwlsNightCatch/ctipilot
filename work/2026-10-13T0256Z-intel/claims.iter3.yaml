  - claim_id: 1209a484c1
    entry: 2026-10-08/cve-2026-102255-sonicwall-sma1000-workplace-ssrf
    surface: "body"
    kind: cited
    text: "NCSC Switzerland published an advisory on 2026-10-07 and on 2026-10-12 changed its exploitation status from unknown to actively exploited, citing honeypot attempts reported by Defused from 2026-10-08 and by Previdian from 2026-10-09 ("
    urls: ["https://security-hub.ncsc.admin.ch/#/posts/13034"]
  - claim_id: 8e422a790a
    entry: 2026-10-08/cve-2026-102255-sonicwall-sma1000-workplace-ssrf
    surface: "body"
    kind: cited
    text: "**Exposure:** SMA1000 6210, 7210 and 8200v whose Work Place interface is reachable from untrusted networks, on 12.4.3-03526 or older or 12.5.0-02952 or older, which includes appliances that already took the September hotfix; the SMA 100 series and SSL-VPN on SonicWall firewalls are not affected ("
    urls: ["https://thehackernews.com/2026/10/sonicwall-patches-cvss-100-pre.html"]
  - claim_id: 20fbc39b35
    entry: 2026-10-08/cve-2026-102255-sonicwall-sma1000-workplace-ssrf
    surface: "body"
    kind: cited
    text: "**Detection:** SonicWall's advisory title calls the access path an unintended forward proxy, so the telemetry is the Work Place web access log, looking for requests that name internal hosts or services as the destination, and connections that the appliance itself opens to internal management endpoints without a user session behind them ("
    urls: ["https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2026-0017"]
  - claim_id: 9ee34335a1
    entry: 2026-10-08/cve-2026-102255-sonicwall-sma1000-workplace-ssrf
    surface: "body"
    kind: cited
    text: "On an appliance that was exposed before the September hotfix, SonicWall's earlier guidance still applies: check for indicators of compromise and, if any are found, re-image or redeploy the appliance, change user and administrator passwords and reset the TOTP tokens; SonicWall has given no such instruction for the new flaws ("
    urls: ["https://thehackernews.com/2026/10/sonicwall-patches-cvss-100-pre.html"]
  - claim_id: 0f871e6406
    entry: 2026-10-08/cve-2026-102255-sonicwall-sma1000-workplace-ssrf
    surface: "body"
    kind: cited
    text: "Previdian's reported attempts are OPTIONS requests to the Work Place Extraweb interface that try to reach the appliance's internal CouchDB service on the loopback address, port 5984, traverse into a design document and invoke its _rewrite function, with an HTTP Basic Authorization header carrying a default-style administrator credential, so the same web access log is the place to look for OPTIONS requests that carry an Authorization header and name a loopback address ("
    urls: ["https://www.bleepingcomputer.com/news/security/max-severity-sonicwall-sma1000-flaw-now-exploited-in-attacks/"]
  - claim_id: 14f747936f
    entry: 2026-10-08/cve-2026-102255-sonicwall-sma1000-workplace-ssrf
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** install 12.4.3-03670 or 12.5.0-03082 (or higher) on every SMA1000 this week, including appliances already on the September hotfix; the hotfix restarts the appliance and SonicWall lists no workaround ("
    urls: ["https://thehackernews.com/2026/10/sonicwall-patches-cvss-100-pre.html"]
  - claim_id: 8fc6993975
    entry: 2026-10-08/cve-2026-102255-sonicwall-sma1000-workplace-ssrf
    surface: "body"
    kind: cited
    text: "), so plan the maintenance window now, because two honeypot operators report attempts against the flaw and NCSC Switzerland rates it actively exploited ("
    urls: ["https://security-hub.ncsc.admin.ch/#/posts/13034"]
