  url_or_quote: "summary: \"attackers drove Danfoss AK-SM and AK-SC refrigeration controllers into forced defrost in hundreds of French supermarkets, which Coopérative U, Intermarché and E. Leclerc confirmed to AFP\""
  summary: "Title and summary state forced defrost of AK-SM/AK-SC controllers as established fact and tie it to the retailers' confirmation. AFP (https://www.afp.com/en/french-supermarket-chains-say-cyberattack-forced-refrigerator-shutdown): retailers 'confirmed to AFP they suffered a cyberattack'; forced defrost is 'BFM TV said hackers managed to remotely trigger the forced defrosting'; Infosecurity says 'reportedly'; the CERT-FR alert mentions neither supermarkets nor defrost. Body hedges correctly ('BFMTV reports'); title/summary should say 'reportedly' and attribute."
