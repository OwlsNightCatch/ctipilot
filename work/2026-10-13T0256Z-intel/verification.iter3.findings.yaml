  item: "runs/2026-10-13/2026-10-13T0256Z-intel.md, Verification & coverage notes"
  url_or_quote: "Iteration 2 (truth 4, advisory 4) found one false negative in the Danfoss Exposure line, a registry summary stating the defrost as fact, and two more hedges; all were fixed. // (3) Danfoss: ... the entry carries AFP's figure and says counts differ by outlet."
