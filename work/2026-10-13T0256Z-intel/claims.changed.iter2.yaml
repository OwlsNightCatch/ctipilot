  - claim_id: 175b9ec582
    entry: 2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack
    surface: "summary"
    kind: frontmatter
    text: "Coopérative U, Intermarché and E. Leclerc confirmed to AFP a cyberattack on their refrigeration systems overnight on 11 to 12 October 2026, which BFMTV reports as a remotely forced defrost at hundreds of stores, and CERT-FR's alert of 2026-10-12 reports numerous compromises of Danfoss AK-SM and AK-SC series devices and advises disconnecting or filtering access. Danfoss says most affected units are legacy products that no longer receive security updates; no source names an actor, the flaw or how the attackers got in, and the Paris prosecutor is investigating."
