  - title: "ClickFix kit on compromised WordPress sites delivers a trojanised Fileside Electron file manager whose C2 domain rotates weekly by DGA"
    sources:
      - { url: "https://blog.report-uri.com/a-fake-captcha-a-trojanised-file-manager-and-a-year-of-ioc-c2-domains/", publisher: "Report URI", date: "2026-10-08", role: "primary" }
    discovery_trace: "first seen at: report-uri-blog, URL https://blog.report-uri.com/rss/ (2026-10-08 item) → primary (no pivot needed): Report URI article, URL https://blog.report-uri.com/a-fake-captcha-a-trojanised-file-manager-and-a-year-of-ioc-c2-domains/ (extract returned raw HTML for this host; text read from the page's gh-content section)"
    summary: |
      Report URI's threat-intelligence pipeline flagged on 7 October a script injected into compromised WordPress sites that fingerprints the visitor (screen size, timezone, automation), suppresses the lure for bots and repeat visitors, and injects a full-screen fake Cloudflare "verify you are human" page. The page copies a PowerShell command to the clipboard and tells the visitor to paste it into the Run dialog; the command hides its window, downloads a 111 MB zip to %TEMP%, unpacks it and runs Fileside.exe. The zip holds Fileside 1.9.6, a legitimate Electron file manager in which every binary is the genuine build and only resources/app.asar has been rebuilt, so the victim sees a working application. About 313 KB of obfuscated JavaScript is prepended to the app's main.js: it registers the app to start at every login, stores a random victim ID in %APPDATA%\daemons.log, reads an affiliate tag from a readme.txt beside the executable (Report URI infers several partners distribute the dropper), POSTs victim ID, computer name, username and affiliate tag to the C2 every three minutes with TLS certificate checks disabled, and runs whatever returns: JavaScript with full Node.js access or a bundle of files, with the executable launched. Report URI assesses it is a foothold for later payloads, not a stealer itself. The C2 hostname comes from a DGA seeded by the current Unix-epoch week and changes at 00:00 UTC each Thursday; Report URI says it ran the obfuscated function to enumerate the domains from October 2025 to April 2027, found 13 registered (one per week since mid-July 2026, five registrars, behind Cloudflare, bought on the day they go live) and none of the future ones yet.
    region_nexus: "global; Switzerland not named. Delivery rides compromised WordPress sites, which any site owner can be"
    primary_sector_nexus: "indirect: end-user ClickFix exposure; transferable as a detection pattern"
    sector: "cross-sector"
    cves: []
    techniques: [T1189, T1204.004, T1059.001, T1059.007, T1036, T1547, T1568.002, T1071.001]
    affected_products: ["Fileside (legitimate Electron file manager, trojanised copy)", "WordPress (compromised sites hosting the lure)"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    lookback: true
    borderline: true
    borderline_reason: "Single vendor source (Report URI, first-hand but a JS-integrity vendor), ClickFix is heavily covered in the store, and Swiss nexus is only generic. Kept as borderline for two transferable behaviours: a legitimate signed Electron app with a rebuilt app.asar as the implant carrier, and a weekly DGA the vendor enumerated in advance."
    evidence:
      - quote: "The zip contains Fileside 1.9.6, a legitimate Electron file manager."
        attribution: "Report URI"
        source_url: "https://blog.report-uri.com/a-fake-captcha-a-trojanised-file-manager-and-a-year-of-ioc-c2-domains/"
      - quote: "The C2 hostname comes from a domain generation algorithm (DGA) seeded by the current week."
        attribution: "Report URI"
        source_url: "https://blog.report-uri.com/a-fake-captcha-a-trojanised-file-manager-and-a-year-of-ioc-c2-domains/"
      - quote: "This code doesn't steal anything by itself, it appears to just be a foothold for additional payloads that come later, and the operator decides what to deliver through it."
        attribution: "Report URI"
        source_url: "https://blog.report-uri.com/a-fake-captcha-a-trojanised-file-manager-and-a-year-of-ioc-c2-domains/"
    extended_notes: |
      Detection concepts: process-creation telemetry for powershell.exe with a hidden window launched from the Run dialog path (explorer parent) that downloads a large archive to %TEMP% and starts an unfamiliar Electron application from there; an Electron application started from %TEMP% or an extraction directory, with a user-profile persistence entry created at first run, whose main process makes periodic outbound HTTPS POSTs (about every three minutes) to a newly registered .com domain that changes every Thursday 00:00 UTC; Node.js-capable child processes from a file-manager binary are anomalous. Benign lookalike discriminator that follows from the stated mechanism: a legitimately installed Fileside would not run from %TEMP% and would not beacon with the victim ID and affiliate tag. Hardening: Windows Run-dialog/PowerShell paste-and-execute restrictions, application control on unsigned or relocated Electron apps, and treating any host that ran the chain as compromised (Report URI: the operator can run arbitrary code with the application's privileges).
      Not carried: the lure, C2 and future-DGA domain lists and file hashes (IOC rule).
