  - title: "Ghostscript CVE-2026-39919: a crafted PDF with a JPEG 2000 image gives unauthenticated remote code execution wherever an uploaded PDF is rendered to a thumbnail; fixed upstream in 10.08.0, distribution backports still landing (CVSS 9.8)"
    sources:
