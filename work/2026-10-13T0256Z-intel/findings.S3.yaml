    summary: |
      iVerify reports a previously unseen DarkSword variant it calls P7 DarkSword (named for the actor's "p7_" variable prefix), found in August 2026 while investigating an alert on a customer's device and then hunted for in the wild on the Validin platform. DarkSword is the iOS 18.4-18.7 full-chain exploit kit that Google GTIG disclosed in March 2026: a Safari JavaScriptCore remote code execution, a sandbox escape through the GPU process into the mediaplaybackd service, a kernel exploit, and an implant injected into SpringBoard. GTIG lists six vulnerabilities and says all were patched with iOS 26.3 (most earlier); Apple's iOS 18.7.7 note says the DarkSword fixes "first shipped in 2025" and was made available to more iOS 18 devices on 1 April 2026. GTIG's March report tied the chain to commercial surveillance vendors and a suspected Russian espionage cluster; the kit later leaked publicly (BleepingComputer, TechCrunch cited therein).

      iVerify's assessment is that P7 is a deliberate, competent rework: it removes debug logging over HTTP and syslog, reduces process injections, uses browser localStorage to avoid re-exploiting the same device, extracts the keychain data on the phone into JSON before exfiltration (earlier variants copied and shipped the keychain database for processing on the attacker's infrastructure), and adds two-way C2. The implant polls a tasking endpoint every 15 seconds (interval changeable by the operator) and supports file listing and download, photo and Apple Notes exfiltration, installed-app inventory, wallet scanning with a dedicated imToken routine, a recursive disk scan, and arbitrary JavaScript execution inside the implant runtime. All C2 requests are HTTP/1.0 POSTs carrying one hardcoded Safari-on-iOS-18.5 User-Agent over HTTPS without strict certificate validation, and the implant stages files such as keychain dumps and Notes database copies under /private/var/tmp.

      Separately, Report URI recovered a DarkSword chain served from a re-registered expired domain of a defunct Czech e-commerce analytics startup (re-registered 15 September 2026): shops that never removed the tag now load a ~2 KB cloaking redirector (data-centre and VPN addresses get empty responses) that sells visitors to traffic brokers; one buyer is a fake "AI crypto quant trading" site whose hidden page loads the exploit chain for Safari on iOS 18.4.0 to 18.7.2 with no further interaction. Report URI's own caveat: that is the loader's targeting range, not a tested exploitable range. On 9 October it updated the post after matching the implant to P7 (two embedded modules byte-for-byte identical to iVerify's samples), noting its recovered build looks newer, reports to different infrastructure and targets more crypto wallets. Both vendors judge the motive financial; neither names an operator. iVerify also told The Hacker News it has seen DarkSword and Coruna bundled together on rare occasions ("DarkCoruna"), and its September proliferation post reports, in its Coruna section, that live and historic attacks against devices on vulnerable iOS versions affect 5% of devices in its telemetry (up from 1.5% in August); that figure is vendor telemetry about Coruna, not about P7.
    region_nexus: "global; no Switzerland-specific victimisation reported. Relevant wherever iPhones on iOS 18 are in use as work devices"
