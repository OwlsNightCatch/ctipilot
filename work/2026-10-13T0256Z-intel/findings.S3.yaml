    extended_notes: |
      cve_table-style record (S3 supplies it because the source is research, not a vendor bulletin): CVE-2026-39919 · product Artifex Ghostscript · CVSS 3.1 9.8 / 4.0 9.3 (Ubuntu, Wordfence) · EPSS 0.00784 (percentile 0.548, FIRST, 2026-10-12) · KEV no (catalogue 2026.10.08) · exploited: no public evidence (Wordfence) · affected 9.21-10.07.1 (OpenJPEG path) · fixed 10.08.0 upstream; distro fixes per the summary · type heap overflow, JPEG 2000 sub-byte output · vector file upload to server-side PDF rendering · auth none.
      Exposure: all four must hold: a visitor or low-privilege user can upload a PDF; something requests a preview/thumbnail; Imagick/ImageMagick or another Ghostscript caller exists; Ghostscript unfixed. WordPress Site Health Media Handling can show whether Imagick recognises PDF but does not show the Ghostscript patch level; check `dpkg -s ghostscript` / `rpm -q ghostscript` against the distro advisory, rebuild containers from an updated base image rather than restarting.
      Detection concepts: crashes of Ghostscript child processes (segfault entries in system logs, abnormal exits of gs spawned by php-fpm/apache via ImageMagick convert/magick) correlated with PDF upload requests; Wordfence measured one gs process for a harmless PDF and two for a crashing PDF (WordPress core retries with a different setting), and in its form test failed attempts still returned an upload-success response, so the web log alone looks clean and the process/crash telemetry is the signal. Repeated PDF uploads from one source are the attacker's retry pattern against build-specific exploits. Post-patch check: code execution would run as the account processing the PDF (not automatically root), so after patching review that account's web root for new files and scheduled tasks if a PDF upload path was exposed while unpatched. This last sentence is a derived hygiene step, the source states only the privilege level.
      Hardening if patching lags (all Wordfence): stop accepting PDFs from visitors and low-privilege users; disable PDF reads in ImageMagick's security policy (also disables PDF previews); limit files per submission and rate-limit upload forms (reduces attempts, does not fix); run conversion in a separate locked-down service without access to site secrets. -dSAFER is not a fix.
      Context: Wordfence links this to its own libheif finding (September) and to Hacktron's HEIF Heist research as evidence that build-specific heap overflows in upload-reachable native libraries are being turned into working exploits with AI assistance; that framing is Wordfence's assessment, not an observed exploitation timeline. Suggested priority notable (high if the main agent weighs the CVSS 9.8 plus unauthenticated upload exposure of public portals); Admiralty B1 (Wordfence first-hand; Ubuntu/Debian/Artifex confirm the CVE, fix and patch state).
