    extended_notes: |
      Suggested handling: kind threat (not a new vulnerability; no CVE is new); suggested priority notable, not critical: the vulnerabilities are patched and exposure is confined to iOS 18.x devices that were not updated. Suggested Admiralty B2 (iVerify, device forensics first-hand; independent Report URI recovery of the same implant; Google GTIG primary for the base kit).
      Exposure / how to tell: read the iOS/iPadOS version from MDM or mobile EDR inventory; the loader's targeting range per Report URI is Safari on iOS 18.4.0 to 18.7.2 and the exploit modules per iVerify cover iOS 18.4-18.7. Google's remedy is the latest iOS and, where an update is not possible, Lockdown Mode. BleepingComputer lists the devices eligible for iOS 18.7.7 (iPhone XR, XS, XS Max, 11 through 16, 16e, SE 2nd and 3rd gen and many iPads). Source conflict: Apple's iOS 18.7.7 security-content list does not name CVE-2026-20700 (the dyld pointer-authentication bypass GTIG says was fixed in iOS 26.3); I could not resolve from fetched pages whether that fix reached the iOS 18 branch, so moving managed devices to iOS 26.x is the unambiguous path.
      Detection concepts (behaviour only): (1) MDM / mobile-EDR compliance drift on iOS version; (2) managed-device proxy or NDR traffic showing a periodic (15 s) HTTP/1.0 POST tasking poll carrying a fixed Safari-on-iOS-18.5 User-Agent that does not match the device's real OS version, to a host the user never visited; (3) mobile forensics / sysdiagnose / encrypted-backup review for the SpringBoard-injected implant's staging artefacts under /private/var/tmp (keychain-dump JSON, Apple Notes database copies, debug logs); (4) iVerify credits an investigation of a partial, heuristic detection for the discovery, so partial mobile-EDR hits on iOS 18 warrant full forensic follow-up. Cloaking note: Report URI saw data-centre and VPN addresses get empty responses, so detonation from sandboxes will often miss the chain.
      Web-owner angle (Report URI): audit third-party script tags for vendors that no longer exist; an expired vendor domain that is re-registered turns every site still loading the tag into a delivery channel, and fingerprinting scripts or restricting script sources via Content-Security-Policy limits that blast radius.
      Not carried: all indicators (domains, IPs, hashes, file names) deliberately omitted per the no-IOC rule; both vendor posts contain them for anyone who needs the lists.
