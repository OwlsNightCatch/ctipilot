  - title: "Magecart fake Stripe card form now loaded via an Ethereum Sepolia smart-contract dead drop on dozens of WooCommerce, PrestaShop and Magento shops; the same on-chain loader pattern is also resolving ClickFix lures on compromised sites"
    sources:
      - { url: "https://blog.report-uri.com/the-fake-stripe-card-form-skimming-online-shops/", publisher: "Report URI", date: "2026-10-12", role: "primary" }
      - { url: "https://blog.confiant.com/p/skimming-on-the-blockchain-a-magecart", publisher: "Confiant", date: "2026-08-28", role: "corroborating" }
      - { url: "https://www.levelblue.com/blogs/spiderlabs-blog/inside-phantompolia-remus-stealer-delivery-via-donut-shellcode-in-clickfix-campaign", publisher: "LevelBlue SpiderLabs", date: "2026-10-07", role: "corroborating" }
    discovery_trace: "first seen at: report-uri-blog, URL https://blog.report-uri.com/rss/ (2026-10-12 item) → primary: Report URI article, URL https://blog.report-uri.com/the-fake-stripe-card-form-skimming-online-shops/ → pivot: Confiant, URL https://blog.confiant.com/p/skimming-on-the-blockchain-a-magecart (cited as the Magecart precedent in LevelBlue's post) → corroboration: LevelBlue, URL https://www.levelblue.com/blogs/spiderlabs-blog/inside-phantompolia-remus-stealer-delivery-via-donut-shellcode-in-clickfix-campaign (first seen at trustwave-spiderlabs listing, URL https://www.levelblue.com/blogs/spiderlabs-blog)"
    summary: |
      Report URI, from its CSP-report threat-intelligence feed, describes a Magecart skimming kit that replaces a shop's chosen payment option with a fake form copied from Stripe's Card Element (placeholder text, CVC icon and card-brand images loaded from Stripe's own host), live on dozens of WooCommerce, PrestaShop and Magento shops and served from 55 attacker hosts detected so far (Report URI, 2026-10-12). The loader sits in the page head wrapped in Google Tag Manager comments with a made-up container ID; it does not contain the skimmer's hostname but asks an Ethereum Sepolia smart contract, through public JSON-RPC relays, where the next stage lives, so changing the contract moves every infected shop to a new host. Each shop gets its own script and a per-shop configuration naming the payment option to attack, the element to replace and the place-order button; on order placement card data and billing details are POSTed to a PHP endpoint on the same host or a WebSocket, the genuine checkout proceeds, the fake form is removed and a flag stops the shopper being shown it again.

      Report URI lists three possible entry routes (admin accounts without a second factor, abandoned or vulnerable plugins and modules, stolen hosting or FTP credentials) and, finding no single component common to the victim shops, leans towards stolen access, one shop at a time; that is its inference. Confiant documented an earlier on-chain Magecart cluster on 2026-08-28 (40+ storefronts, one owner wallet, 144 Sepolia contracts) and Report URI does not say its kit is the same cluster. LevelBlue (2026-10-07) shows the same Sepolia dead-drop technique, with Ethers.js loaded from public CDNs and eth_call reads, resolving the C2 for a ClickFix lure (PhantomPolia) on compromised websites that ends in Remus Stealer. The store already covers EtherHiding-style C2 resolution in ClickFix delivery; the delta here is its application to payment-page skimming and the shared detection hook.
    region_nexus: "global; Switzerland not named. Relevant to any public body that runs a WordPress/PrestaShop/Magento payment or fee-collection page, or whose WordPress sites could be compromised to host ClickFix lures"
