    discovery_trace: "first seen at: gap sweep of research-category RSS feeds, URL https://www.wordfence.com/feed/ (item 2026-10-12T18:10Z) → primary: Wordfence article, URL https://www.wordfence.com/blog/2026/10/wordfence-argus-discovers-critical-vulnerability-in-ghostscript-the-program-that-turns-uploaded-pdfs-into-thumbnails-on-your-server/ → pivot (References): Ubuntu URL https://ubuntu.com/security/CVE-2026-39919 and Debian URL https://security-tracker.debian.org/tracker/CVE-2026-39919 → DSA URL https://security-tracker.debian.org/tracker/DSA-6516-1 → Debian source-package tracker URL https://security-tracker.debian.org/tracker/source-package/ghostscript → upstream release URL https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/tag/gs10080. KEV status checked on the cisa-kev bridge (catalogVersion 2026.10.08, CVE absent); EPSS read from api.first.org 2026-10-12."
    summary: |
      Wordfence (its Argus AI-assisted testing system, during a WordPress 7.1 assessment) published on 12 October a technical account of CVE-2026-39919, a heap buffer overflow in the JPEG 2000 output adapter of Artifex Ghostscript (base/sjpx_openjpeg.c). A PDF containing a JPEG 2000 image with sub-byte sample precision and mismatched component subsampling makes the non-same-scale output path allocate a packed row buffer but write a full byte per output column, overflowing the allocation and corrupting chunk-allocator metadata. Affected upstream: 9.21 through 10.07.1 where the OpenJPEG decoder path is present; fixed in Ghostscript 10.08.0 (released 2026-09-08; the 10.08.0 release candidate reports the same version string and is not fixed). CVSS 3.1 9.8 and CVSS 4.0 9.3; the CVE was published 15 September. The overflow occurs even under -dSAFER, which Wordfence says is no mitigation.

      Wordfence demonstrated unauthenticated code execution on a purpose-built WordPress test site via the chain upload, then WordPress core Imagick PDF preview, then ImageMagick, then Ghostscript, running as the web-server account. Its two proof-of-concept exploits were build-specific: across ten other Linux package environments they failed in 10,240 attempts, yet a matching exploit kept working on four setups sharing the exact Ghostscript executable. Wordfence says it found no public evidence of exploitation today; the CVE is not in CISA KEV (catalogue 2026.10.08) and FIRST EPSS reads 0.0078 (2026-10-12). A 1,029-byte minimal test file that triggers the overflow is described as public. This is not WordPress-specific: any path that hands untrusted PDFs to an affected Ghostscript (document management systems, print services, invoice processors, preview generators, mail gateways, conversion APIs) is exposed, and the dependency is usually hidden behind ImageMagick, so grepping for "Ghostscript" can miss it.

      Patch state is uneven: Ubuntu fixed 22.04 (9.55.0~dfsg1-0ubuntu5.14), 24.04 (10.02.1~dfsg1-0ubuntu7.9) and 26.04 (10.06.0~dfsg-3ubuntu1.1) with USN-8791-1, while 20.04 and older are "needs evaluation" on Ubuntu's page; Debian trixie is fixed (DSA-6516-1 lists 10.05.1~dfsg-1+deb13u2; the trixie security repository currently carries +deb13u3), forky and sid are fixed and bookworm (10.0.0~dfsg-11+deb12u8) is listed vulnerable on Debian's tracker; Wordfence reports AlmaLinux 10 fixed on 2 October, and, as of 9 October, Fedora 44 and Alpine 3.22/3.23 still on older revisions. The official WordPress Docker image snapshot Wordfence tested (Ghostscript 10.05.1, Imagick present) was vulnerable. Because distributions backport, gs --version can still show the old number after the fix, so the package revision is what to check.
