- code: F8
  category: needs-more-research
  section: entries/2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack
  item: "Danfoss AK-SM and AK-SC refrigeration controllers compromised ..."
  url_or_quote: "No source names an actor or the flaw or states how the attackers got in"
  summary: "(low confidence) The retailers' own statements frame the attack as hitting a refrigeration service provider or supplier, and the entry drops it: Intermarché to BleepingComputer 'Following a cyberattack reportedly affecting a service provider that manages refrigeration systems in stores' (https://www.bleepingcomputer.com/news/security/cyberattack-shuts-down-refrigerators-at-french-supermarkets/), the same statement to BFMTV 'une cyberattaque qui aurait touché un prestataire de la gestion des systèmes frigorifiques', and E. Leclerc to AFP 'a cyberattack affected one of its refrigeration equipment suppliers' resulting in 'repercussions on the operation of refrigeration systems in several stores'. The first sentence ('Coopérative U, Intermarché and E. Leclerc confirmed to AFP a cyberattack on their refrigeration systems') reads these as direct attacks, and the takeaway 'filter it to the contractor's addresses' assumes the contractor is not the compromised party. AFP also carries the Paris prosecutor's reference to 'the outbreak of fires', absent from the entry. Add one cited sentence on the provider/supplier framing (attributed to the retailers) and the fires, and note that provider-side remote access is in scope."
- code: F11
  category: editorial-advisory
  section: entries/2026-10-08/cve-2026-102255-sonicwall-sma1000-workplace-ssrf
  item: "cves[CVE-2026-102255].status and tags"
  url_or_quote: "status: [patch-available]; tags: [vulnerabilities, pre-auth, patch-available]"
  summary: "(low confidence) Store convention differs for the same evidence class: entries/2026-10-06/cve-2026-21589-atlassian-data-center-arbitrary-file-access.md carries status [exploited, patch-available, poc-public] and tag actively-exploited on honeypot attempts (Previdian, SANS ISC) with no compromise reported, whereas this entry keeps patch-available and no actively-exploited tag although NCSC Switzerland, the Canadian Cyber Centre, BleepingComputer, The Hacker News and SecurityWeek all describe exploitation. The body explains the choice, so this is a consistency note only; a status or tag filter will treat the two flaws differently."
- code: F11
  category: editorial-advisory
  section: entries/2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack
  item: "headline"
  url_or_quote: "CERT-FR: numerous Danfoss refrigeration controllers compromised; hundreds of French supermarkets lost stock"
  summary: "(low confidence) The colon attributes both clauses to CERT-FR, whose alert (https://www.cert.ssi.gouv.fr/alerte/CERTFR-2026-ALE-012/) names only 'numerous compromises of Danfoss AK-SM and AK-SC series devices' and mentions neither refrigeration nor supermarkets; the lost-stock clause comes from AFP and BFMTV. Facts are right, attribution is loose; leave or split the clause."
