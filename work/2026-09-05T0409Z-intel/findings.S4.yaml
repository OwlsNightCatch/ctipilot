items:
  - title: "SQL injection against the French national mayors' association (AMF) exposes plaintext passwords and a detailed org chart of municipal officials across France"
    sources:
      - { url: "https://www.cyberattaque.org/association-des-maires-de-france-114-000-lignes-en-fuite-apres-une-cyberattaque/", publisher: "Cyberattaque.org", date: "2026-09-04", role: "primary" }
    discovery_trace: "first seen at: cyberattaque-org, URL https://www.cyberattaque.org/feed/ → primary: Cyberattaque.org (victim-corroborated investigative report), URL https://www.cyberattaque.org/association-des-maires-de-france-114-000-lignes-en-fuite-apres-une-cyberattaque/ (WebFetch summary returned no body text — trafilatura fell back to raw HTML on this SPA-hydrated page — re-fetched via jina reader to recover the full article body)"
    summary: |
      A threat actor using the handle Alduin claims to have exploited a UNION-based SQL injection against amf.asso.fr, the website of the Association des maires de France et des présidents d'intercommunalité (AMF) — France's national association representing over 34,000 mayors and intercommunality presidents across 102 departmental associations — and extracted roughly 114,000 database rows. Cyberattaque.org obtained and analysed the leaked files: one table stores subscriber profiles (name, professional/personal email, job title, municipality/intercommunality/public-body affiliation, subscription dates); a second table holds account credentials hashed with bcrypt; a third table stores login credentials in plaintext. The AMF confirmed the breach after Cyberattaque.org's publication, acknowledged the exfiltration of more than 100,000 records including identity/contact data, professional functions and elected-official/collectivity references, confirmed the presence of the plaintext-password table among the affected data, filed with France's CNIL, and is auditing to identify exactly who is affected before individual notification. AMF has not itself confirmed the SQL-injection vector or Alduin's identity — the technical mechanism remains the discloser's own claim. The exposed dataset spans mayors, deputy mayors, municipal councillors, DGS (general service directors), HR managers, payroll administrators, legal officers, and staff at other French state services and public bodies who were merely registered as AMF contacts — their own systems are not implicated by inclusion in this list.
    region_nexus: "France (not Switzerland) — but AMF is the direct French-sector analogue of Swiss cantonal/communal government associations, and the exposed population is municipal/intercommunal administrative staff"
    primary_sector_nexus: "direct — a national municipal-government membership association; the exposed population is the same professional class (mayors, DGS, HR/finance/legal officers) that populates Swiss cantonal and communal administrations"
    sector: "public-sector"
