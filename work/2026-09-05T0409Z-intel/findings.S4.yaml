  - title: "Manchester Airports Group breach update: FulcrumSec publishes the full ~550GB dataset (8.67M customer profiles, 1.16B email events, vehicle-plate and future-booking data), and Have I Been Pwned adds the breach"
    sources:
      - { url: "https://securityaffairs.com/198447/data-breach/crooks-behind-manchester-airports-group-hack-leaked-data-of-8-8-million-people.html", publisher: "Security Affairs", date: "2026-09-04", role: "primary" }
      - { url: "https://haveibeenpwned.com/Breach/ManchesterAirportsGroup", publisher: "Have I Been Pwned", date: "2026-09-04", role: "corroborating" }
    discovery_trace: "first seen at: securityaffairs, URL https://securityaffairs.com/ → primary: Security Affairs, URL https://securityaffairs.com/198447/data-breach/crooks-behind-manchester-airports-group-hack-leaked-data-of-8-8-million-people.html (cites and links Have I Been Pwned's processed breach entry)"
    summary: |
      Update to the existing entry on Manchester Airports Group's (MAG) data breach. The extortion group FulcrumSec — which this pipeline's prior coverage already recorded as claiming credit via airport-specific Iterable marketing-platform API credentials hardcoded in each of MAG's three airport websites' client-side JavaScript (manchesterairport.co.uk, stanstedairport.com, eastmidlandsairport.com) — has now actually published the full dataset rather than merely claiming it, and the scale is substantially larger than the ~86GB previously claimed: roughly 550GB uncompressed, comprising 8,672,291 customer profiles (email, name, mobile, home town/postal region, last-connection IP address), 1,169,302,811 platform events (over 1.16 billion of them email-channel sends/opens/clicks/bounces), 2,482,763 historical parking/lounge/Fast-Track purchase records (an analysed subset of 1,154,675 transactions from 877,754 purchasers totals £83.4 million), 461,433 SMS messages containing booking date/car-park/vehicle-registration in plaintext, 108,077 distinct UK vehicle registration plates tied to owner contact and booking details, and the complete Iterable platform configuration (campaigns, segments, templates) as live JSON. FulcrumSec's leak-site post claims it withheld roughly 190,849 records of upcoming passenger travel schedules (142,755 tied to vehicle registrations) that it says would otherwise reveal when a victim's home will be empty, and claims the dataset includes government, judicial, military, police, NHS and defence-industry employees among the exposed customers — both claims are the extortion group's own framing and are not independently verified. Have I Been Pwned has processed the published dataset and added it to its breach database, confirming approximately 8.8 million unique email addresses and phone numbers plus names, IP addresses, user-agent strings, geographic data, purchase history and vehicle registration plates.
    region_nexus: "United Kingdom — no direct Swiss nexus; update to a previously covered story"
    primary_sector_nexus: "indirect"
    sector: "public-sector"
