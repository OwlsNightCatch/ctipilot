  - title: "Thomson Reuters' C-Track court case-management platform breach reaches at least 13 US states, the US Virgin Islands and three Ontario courts — sealed and confidential records exposed, no access vector disclosed, and courts learn their data lived in vendor backup copies they never knew existed"
    sources:
      - { url: "https://therecord.media/thomson-reuters-cyberattack-data", publisher: "The Record (Recorded Future News)", date: "2026-09-03", role: "primary" }
      - { url: "https://www.techtimes.com/articles/326594/20260904/sealed-court-records-breached-when-thomson-reuters-lost-control-its-cloud.htm", publisher: "Tech Times", date: "2026-09-04", role: "corroborating" }
      - { url: "https://thehackernews.com/2026/09/thomson-reuters-court-software-breach.html", publisher: "The Hacker News", date: "2026-09-04", role: "corroborating" }
      - { url: "https://www.ctracknotification.com/", publisher: "C-Track / West Publishing Corporation (Thomson Reuters)", date: "2026-09-02", role: "primary" }
      - { url: "https://www.ontariocourts.ca/en/public-statement-cybersecurity.htm", publisher: "Chief Justices of Ontario's Court of Appeal, Superior Court of Justice and Court of Justice", date: "2026-09-03", role: "primary" }
    discovery_trace: "first seen at: WebSearch (\"Thomson Reuters C-Track breach access vector mechanism state courts\") → pivot: The Record, URL https://therecord.media/thomson-reuters-cyberattack-data → pivot: Tech Times, URL https://www.techtimes.com/articles/326594/20260904/sealed-court-records-breached-when-thomson-reuters-lost-control-its-cloud.htm → pivot: The Hacker News, URL https://thehackernews.com/2026/09/thomson-reuters-court-software-breach.html → primary: C-Track/West Publishing's own notification, URL https://www.ctracknotification.com/ → primary: Ontario's three Chief Justices' joint statement, URL https://www.ontariocourts.ca/en/public-statement-cybersecurity.htm"
    summary: |
      Thomson Reuters' West Publishing subsidiary disclosed on 2026-09-02 that an unauthorized party obtained files from C-Track, its court case-management SaaS platform, between March 2026 and June 30, 2026 (roughly four months' dwell time before detection). West Publishing's own notice names 24 affected court bodies: appellate courts in Alabama, Kentucky, Montana, Nevada, New Hampshire, North Dakota, Ohio (10 of 12 appellate districts), Pennsylvania (several county-level courts, one former client), South Carolina, Tennessee, Wyoming, and the U.S. Virgin Islands Supreme and Superior Courts, plus three Ontario courts (Court of Appeal, Superior Court of Justice, Court of Justice) disclosed in a parallel Canadian notice. Minnesota's Judicial Branch disclosed independently that its appellate courts were also affected — a court Thomson Reuters' own published notice omits, a gap the company has not explained. Potentially exposed data includes names, Social Security numbers, driver's license numbers, dates of birth, medical information and health insurance information; the company states "certain confidential, redacted or sealed information may have been impacted for certain affected courts." Neither Thomson Reuters, law enforcement, nor any affected court has disclosed the intrusion technique, initial-access vector, or attacker identity as of 2026-09-04. What individual court statements do reveal is that the exposure was architecturally inconsistent across jurisdictions: Alabama's Chief Justice said West Publishing told her court its data existed as an undisclosed backup copy inside Thomson Reuters' cloud environment that the court "neither requested nor knew about"; Montana's court said the accessed data was likewise backup/troubleshooting database copies supplied to the vendor; but the Supreme Court of Ohio said Thomson Reuters Court Management Solutions told it the access "took place on the Court's production platform" — the live system hosting current filing data for Ohio's ten affected appellate districts, not a backup. Minnesota's Judicial Branch responded by terminating Thomson Reuters' access to its court systems outright and forcing a password reset for all C-Track users. North Dakota confirmed an active criminal investigation. Thomson Reuters is offering 12 months of Experian (US) or TransUnion (Canada) credit monitoring; it states C-Track remains fully operational and that outside experts have reviewed unspecified new security measures, though Ohio's court says it has not yet received the details of those measures.
    region_nexus: "United States and Canada — no direct Swiss nexus, but the incident is a SaaS-vendor-backup governance failure affecting judicial/court-records systems specifically, the closest functional analogue to Swiss cantonal/federal judicial and prosecutorial case-management platforms"
    primary_sector_nexus: "direct via sector analogue — public-sector judicial administration; the core lesson (a case-management SaaS vendor holding undisclosed backup/troubleshooting copies of sealed records outside the court's visibility or control) applies unchanged to any Swiss cantonal court, prosecutor's office or police records system that outsources case management to a third-party platform"
    sector: "public-sector"
