        attribution: "Have I Been Pwned, cited by Security Affairs"
        source_url: "https://securityaffairs.com/198447/data-breach/crooks-behind-manchester-airports-group-hack-leaked-data-of-8-8-million-people.html"
    extended_notes: |
      This is the material development the existing entry's changelog should record: the prior entry covered FulcrumSec's claim of ~86GB with the client-side-API-credential access vector; that vector is unchanged, but the actual publication (550GB, precise record counts, HIBP corroboration) confirms the claim was not inflated and substantially raises the scale of confirmed exposure. No new access-vector information here — recorded purely as a scale/corroboration update.

