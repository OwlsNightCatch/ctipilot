    extended_notes: |
      Backlog item #6 from the spawn message: prior fires found the Reuters/Thomson-Reuters original reporting paywalled/CAPTCHA-blocked and no stated mechanism. This fire found the story had moved substantially via a different transport (extract/jina on The Record, Tech Times and The Hacker News, plus direct primary fetches of the C-Track notice and Ontario's court statement) — richer scope, timeline and architecture detail, but the actual initial-access vector into Thomson Reuters' environment is STILL undisclosed by any party as of 2026-09-04. Recorded here as a genuine new finding (not merely a backlog non-update) because the material now on record — the Alabama/Ohio divergence between undisclosed-backup and live-production exposure, the 64-day gap between discovery (June 30) and public disclosure (Sept 2), Minnesota's unilateral access termination, and the sealed-record/domestic-violence-victim safety angle — is itself the operationally important lesson for any public-sector body evaluating SaaS case-management vendor contracts, independent of whether the initial intrusion technique is ever named. techniques[] is limited to T1530 (Data from Cloud Storage) because that is the only behavior any source actually states (data was accessed/exfiltrated from a cloud/SaaS storage environment); no initial-access technique is asserted by any party and none is inferred here.
