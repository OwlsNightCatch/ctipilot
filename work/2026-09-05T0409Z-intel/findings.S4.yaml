    extended_notes: |
      Single-source (Cyberattaque.org, Admiralty C reliability per the source list — but the item includes victim-side confirmation, which is what lifts credibility above a bare leak-site claim). No English-language or second independent outlet found reporting this as of fetch time; worth a corroboration check on a subsequent run (Le Monde/franceinfo/ZATAZ pickup likely within days given AMF's national profile). Transferable lesson for Swiss cantonal/communal IT: (1) UNION-based SQLi against a membership/association web platform is a mundane, well-understood technique (T1190) that nonetheless yielded a plaintext-credential table years into what should be routine hashing hygiene; (2) the exposed org-chart-with-role data (who is DGS, who is HR, who is the mayor's chief of staff) is itself a CEO-fraud/BEC targeting dataset independent of any password reuse; (3) any Swiss cantonal/communal association, umbrella body or member portal (e.g. Verband Schweizerischer Gemeinden equivalents) that stores member-official contact and credential data is a structurally identical target.
