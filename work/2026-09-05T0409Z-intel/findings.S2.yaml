      - quote: "Demnach behauptet die Gruppierung, rund 1,44 Millionen Dateien erbeutet zu haben. Darunter sollen sich neben mehr als 5.000 Personalakten, Bußgeldvorgängen und Gehaltsabrechnungen auch vertrauliche Unterlagen aus Bundesratsausschüssen sowie Schwachstellenanalysen zur Berliner Trinkwasserversorgung befinden."
        attribution: "heise online (kbe/dpa)"
        source_url: "https://www.heise.de/news/Berliner-Senat-zahlt-nicht-sensible-Daten-jetzt-im-Darknet-11442286.html"
      - quote: "Nach dem, was ich jetzt hier sehen kann, haben sie den kompletten Datensatz für alle zur Einsicht live gestellt"
        attribution: "Joachim Selzer, Chaos Computer Club spokesperson, via dpa"
        source_url: "https://www.heise.de/news/Berliner-Senat-zahlt-nicht-sensible-Daten-jetzt-im-Darknet-11442286.html"
    extended_notes: |
      Defender angle for Swiss cantonal/communal IT: a shared multi-department government network (Landesnetz-equivalent — many Swiss cantons run a single shared network across cantonal offices and sometimes affiliated communes) concentrates blast radius so that a single phishing-driven compromise reaches unrelated departments, including ones holding OT/critical-infrastructure vulnerability documentation that should never have been reachable from a general administrative segment. The drinking-water vulnerability-analysis exposure is the standout transferable lesson: any assessment or pentest report documenting weaknesses in physical/OT critical infrastructure needs to be stored and access-controlled separately from general administrative file shares, not just protected by the same perimeter as payroll or HR data.
