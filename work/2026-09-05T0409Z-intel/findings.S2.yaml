items:
  - title: "Berlin Landesnetz breach: Rhysida publishes the full 1.44M-file dataset after the Senate refuses to pay, exposing drinking-water vulnerability analyses and plaintext administration credentials"
    sources:
      - { url: "https://www.heise.de/news/Berliner-Senat-zahlt-nicht-sensible-Daten-jetzt-im-Darknet-11442286.html", publisher: "heise online", date: "2026-09-04", role: "primary" }
      - { url: "https://www.tagesspiegel.de/berlin/notfallplane-und-passworter-erbeutet-wegner-weist-erpresser-ultimatum-zuruck--hacker-fordern-laut-medienbericht-zwei-millionen-euro-15984600.html", publisher: "Der Tagesspiegel", date: "2026-08-28", role: "corroborating (existing entry's primary)" }
    discovery_trace: "first seen at: heise-sec RSS feed, URL https://www.heise.de/security/feed.xml (item published 2026-09-04T15:37Z) → primary: heise online full article, URL https://www.heise.de/news/Berliner-Senat-zahlt-nicht-sensible-Daten-jetzt-im-Darknet-11442286.html (fetched via jina reader per the documented heise recipe)"
    summary: |
      The Rhysida ransomware group's ultimatum against Berlin's state administration expired on 2026-09-04 at roughly 15:35 local time; the Senate had publicly committed not to pay the 30 BTC (~EUR 2M) demand, and about an hour after the deadline the group published the full stolen dataset on its darknet leak site, replacing the prior partial "auction" listing. Chaos Computer Club spokesperson Joachim Selzer confirmed the complete dataset is now browsable by anyone. The attackers claim roughly 1.44 million files were taken, including more than 5,000 personnel files, disciplinary/fine (Bußgeld) case records, payroll data, confidential Bundesrat-committee documents, and — the most consequential item for critical-infrastructure defenders — vulnerability analyses of Berlin's drinking-water supply system (Trinkwasserversorgung). The group also claims to hold plaintext credentials and passwords for administration databases and payment-service-provider systems. This confirms and extends the entry already tracked here: the underlying intrusion reached the shared Landesnetz via a phishing-email click (per Tagesspiegel, previously reported) and Berlin's state criminal police (LKA) and Germany's BSI remain engaged in the response. No technical root-cause detail beyond the phishing vector has been disclosed by the Senate itself.
    region_nexus: "Germany (Berlin state government); transferable to any Swiss cantonal/communal administration running a shared, multi-department government network"
    primary_sector_nexus: "direct — public-sector government administration; a shared-network compromise with critical-infrastructure (drinking water) vulnerability data exposed"
