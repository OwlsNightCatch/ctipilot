  - title: "Switzerland hardens E-ID online issuance against AI-enabled malware injection and deepfakes, and reaffirms open-source transparency, pentesting and bug bounties as standing controls"
    sources:
      - { url: "https://www.eid.admin.ch/en/20260903-beirat-digitale-schweiz-sicherheit-und-ver-trauen-stehen-an-oberster-stelle-e", publisher: "Federal Office of Justice / eid.admin.ch (official)", date: "2026-09-03", role: "primary" }
      - { url: "https://www.inside-it.ch/treffen-digitale-schweiz-im-zeichen-der-e-id-20260904", publisher: "Inside IT Switzerland", date: "2026-09-04", role: "corroborating (fresh in-window pickup)" }
    discovery_trace: "first seen at: inside-it-ch RSS feed, URL https://www.inside-it.ch/rss.xml (item \"Treffen Digitale Schweiz im Zeichen der E-ID\", published 2026-09-04T13:14:03Z) → primary: eid.admin.ch official press release, URL https://www.eid.admin.ch/en/20260903-beirat-digitale-schweiz-sicherheit-und-ver-trauen-stehen-an-oberster-stelle-e"
    summary: |
      At the 3 September 2026 meeting of the Advisory Council Digital Switzerland (Beirat Digitale Schweiz), chaired by Justice Minister Beat Jans with Federal Chancellor Viktor Rossi participating, the Federal Department of Justice and Police stated that, in light of recent developments in artificial intelligence, security in the E-ID's online issuance process is currently being further strengthened: additional technical safeguards are being added specifically to make it harder to introduce malware onto end devices during issuance, and deepfake-detection capability in the identity-verification step is being reinforced. This is a direct, named threat-model update to the E-ID trust infrastructure this store already tracks (the entry covering the AWS trust-infrastructure veto on digital-sovereignty grounds) — the programme's standing security controls (open-source code transparency, penetration testing, bug-bounty programmes) were reaffirmed as the mechanism for finding these gaps, and Jans explicitly defended the programme's history of revising previously communicated deadlines when security issues surface rather than holding a schedule at the expense of security.
    region_nexus: "Switzerland — federal E-ID programme (Federal Office of Justice, Federal Office of Informatics and Telecommunications)"
    primary_sector_nexus: "direct — federal e-government identity infrastructure underpinning citizen-facing digital services across all levels of Swiss public administration"
    sector: "public-sector"
    cves: []
    techniques: []
    affected_products: []
    entity_keys: ["policy:swiss-e-id-trust-infrastructure"]
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "update-of:2026-09-02/swiss-eid-trust-infrastructure-aws-veto-digital-sovereignty"
    evidence:
      - quote: "In light of the latest developments in the field of artificial intelligence, security in the online issuance process for the E-ID is currently being further strengthened. In particular, through the use of additional technical safeguards, it should become harder to introduce malware onto end devices, and the detection of deepfakes should be strengthened."
        attribution: "Federal Department of Justice and Police, eid.admin.ch official press release"
        source_url: "https://www.eid.admin.ch/en/20260903-beirat-digitale-schweiz-sicherheit-und-ver-trauen-stehen-an-oberster-stelle-e"
      - quote: "To ensure security and stability, various measures have therefore always been implemented in the E-ID programme. Worth mentioning in particular are transparency through open source, the conducting of penetration tests, and bug bounty programmes."
        attribution: "Justice Minister Beat Jans, eid.admin.ch official press release"
        source_url: "https://www.eid.admin.ch/en/20260903-beirat-digitale-schweiz-sicherheit-und-ver-trauen-stehen-an-oberster-stelle-e"
    extended_notes: |
      No technical specification of the "additional technical safeguards" (e.g. attestation, device-integrity checks, liveness-detection method) has been published; this is a policy-level commitment, not yet an implementation detail defenders can act on. Worth a follow-up check in a future run once the E-ID programme publishes the actual technical controls (the programme's stated practice of open-sourcing code suggests the mechanism will eventually be publicly reviewable).
