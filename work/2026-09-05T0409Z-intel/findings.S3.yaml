items:
  - title: "Toy Ghouls swaps commodity tooling for two custom backdoors that use HiveMQ's public MQTT broker and the Matrix/Element messaging protocol as command-and-control"
    sources:
      - { url: "https://securelist.com/toy-ghouls-new-hivemq-and-element-backdoors/121270/", publisher: "Kaspersky Securelist (GERT)", date: "2026-09-04", role: "primary" }
    discovery_trace: "first seen at: WebSearch (\"Kaspersky Securelist new research September 2026\") → primary: Kaspersky Securelist, URL https://securelist.com/toy-ghouls-new-hivemq-and-element-backdoors/121270/ (confirmed via securelist.com/feed/ RSS entry dated 2026-09-04T10:00:05Z)"
    summary: |
      Kaspersky's GERT team documents two previously undocumented backdoor variants — internally named
      mqtt-bird-agent and matrix-bird-agent — fielded by Toy Ghouls, a financially motivated extortion
      cluster this store already tracks (actor:toy-ghouls, aliases Bearlyfy/Labubu/Laboo.boo) that has
      targeted Russian organisations since 2025 and previously relied on third-party encryptors before
      fielding its own GenieLocker ransomware (already registered as malware:genielocker). The MQTT
      variant uses the public HiveMQ broker (broker.hivemq.com) as its command-and-control channel; the
      second variant instead uses an attacker-controlled Matrix/Element homeserver (meet.element[.]tw).
      Both are pushed onto already-compromised Windows hosts over WinRM using the open-source tools
      Evil-WinRM and WinRM-fs — this is a lateral-movement/deployment step onto hosts the group already
      controls, not an initial-access vector. Each backdoor installs as a Windows service for persistence,
      protects its own configuration with ChaCha20-Poly1305 keyed to a value derived from the local
      HKLM\Software\Microsoft\Cryptography\MachineGuid registry value (binding the config to the specific
      machine), and executes operator tasking through hidden PowerShell.exe sessions launched with
      `-NonInteractive -NoProfile -Command`. The reusable defender takeaway is architectural rather than
      indicator-based: both variants route C2 through legitimate, widely-trusted internet services (a
      public IoT message broker; a public chat federation protocol) specifically to blend into normal
      egress traffic and evade domain/IP-based blocking — the same class of resilience this store has
      recently tracked in blockchain dead-drop C2 (GoCaracal, GraphSpy-adjacent malware) and FTP-banner
      dead-drop resolvers (E4del/PINHOLE).
      Prerequisites: the group must already hold a foothold and valid credentials on the target Windows
      environment before WinRM-based deployment is possible — this is a post-compromise toolset upgrade,
      not a new intrusion vector.
      Detection concept (telemetry class first): outbound TLS/TCP sessions to a public MQTT broker
      (typically port 8883/1883) or to a Matrix homeserver's federation/client API endpoints from a host
      that has no legitimate business reason to speak either protocol is anomalous and a strong pivot
      point — most enterprise environments have near-zero baseline MQTT or Matrix egress, making protocol
      allow-listing / anomaly detection on egress traffic a high-yield control. On the endpoint side:
      WinRM-based remote command/file-transfer activity (Windows Remote Management event logs, Sysmon
      process-creation events for wsmprovhost.exe / winrm.cmd spawning new services) landing a new Windows
      service that then spawns hidden, non-interactive PowerShell children is the deployment signature;
      PowerShell launched with `-NonInteractive -NoProfile -Command` and no visible window from a
      service-hosting process is a further discriminator. Hardening: restrict or monitor WinRM usage
      between workstations/servers that have no operational need for it (WinRM is itself the group's
      chosen lateral-movement rail, per Kaspersky, using Evil-WinRM/WinRM-fs); egress-filter or alert on
      MQTT and Matrix/federation protocol traffic from endpoints outside designated IoT/chat-infrastructure
      segments.
    region_nexus: "Russia (named victimology); technique and tooling are directly transferable to any environment — MQTT/Matrix-as-C2 evasion pattern has no geographic restriction"
