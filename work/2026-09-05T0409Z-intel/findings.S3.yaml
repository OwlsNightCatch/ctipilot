    summary: |
      Not returned as a finding — included only for the record. Forescout's Vedere Labs used Claude Code
      (terminal + Ghidra access) to port a public CVE-2021-31886 pre-auth Nucleus FTP-server RCE from one
      WAGO 750 PLC model to a related but distinct model; the port succeeded but needed sustained
      researcher steering across an 8h32m session costing $535.74 in API usage, and a follow-on attempt to
      build a C2 implant permanently bricked the test PLC. Published 2026-09-01 — three days outside this
      run's 26h window with no fresh in-window development found (checked IT Pro's "in wake of Siemens
      advisories" framing; that framing dates to the same 2026-09-01 cycle, not a new Siemens event).
