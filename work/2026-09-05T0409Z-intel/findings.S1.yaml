  - title: "Dirty Frag / Fragnesia — Linux kernel page-cache corruption in IPsec ESP and RxRPC networking paths turns local read access into root; Microsoft reports limited real-world activity (CVE-2026-43284, CVE-2026-43500, CVE-2026-46300)"
    sources:
      - { url: "https://www.aikido.dev/blog/dirty-frag", publisher: "Aikido Security", date: "2026-09-04", role: "primary" }
    discovery_trace: "first seen at: WebSearch/blog-sweep of aikido-security (spawn-assigned source slice), URL https://www.aikido.dev/blog → primary: Aikido Security technical write-up, URL https://www.aikido.dev/blog/dirty-frag → verified: MITRE CVE Record, URL https://cveawg.mitre.org/api/cve/CVE-2026-43284 → verified: MITRE CVE Record, URL https://cveawg.mitre.org/api/cve/CVE-2026-43500 → verified: MITRE CVE Record, URL https://cveawg.mitre.org/api/cve/CVE-2026-46300"
    summary: |
      Aikido Security's 2026-09-04 write-up collects three Linux kernel CVEs under the name "Dirty Frag" and documents an active-exploitation signal and public PoC status that make the (already-patched, months-old) CVEs newly actionable. The mechanism: Linux keeps recently read file data in the page cache, and some kernel paths (functions using splice()) hand networking code a direct pointer into that cache rather than a private copy, on the assumption that nothing downstream will write through it. CVE-2026-43284 (CWE class: missing copy-on-write before in-place modification, CVSS 3.1 8.8, kernel path: xfrm/esp — the IPsec ESP encrypted-VPN decrypt path, functions esp_input / esp4 / esp6) and CVE-2026-43500 (CVSS 7.8, kernel path: net/rxrpc — the RxRPC protocol used by the AFS network filesystem, functions rxrpc_input_call_event / rxrpc_verify_response) both fail to check whether an skb's fragments are marked SKBFL_SHARED_FRAG (i.e., externally/page-cache-owned) before decrypting or processing in place. An attacker who can run code locally as a low-privileged user or workload feeds a privileged, read-only binary such as /usr/bin/su into the vulnerable decrypt/verify path, corrupting the in-memory (page-cache) copy of that binary; the file on disk is untouched, but any subsequent execution of it — including by root — reads the tampered copy and hands the attacker root. CVE-2026-46300 ("Fragnesia", CVSS 7.8, kernel path: net/core/skbuff.c skb_try_coalesce()) is a follow-on variant: the original Dirty Frag fix relies on a marker showing a fragment is shared, but a thirteen-year-old (2013) bug in the packet-fragment-coalescing code silently drops that marker, reopening the same root path even on hosts patched against the first two CVEs. All three are fixed upstream (Linux kernel networking maintainers, patches merged and CVEs published May 2026) and backported by RHEL and Ubuntu under distribution-specific version numbers — a patched RHEL 8 host can still legitimately report kernel version 4.18. Red Hat states CVE-2026-43500 does not affect its products but confirms CVE-2026-43284 and CVE-2026-46300 affect supported RHEL kernels. Because containers share the host kernel, a compromised container or workload that can reach the vulnerable code path (governed by seccomp, pod security policy and user-namespace settings) can escalate to root on the node; researchers have already published working Kubernetes-context proof-of-concept exploits. Aikido reports that Microsoft has observed limited real-world activity using this escalation pattern (an unknown binary being dropped and then su being invoked), while cautioning this activity may reflect Dirty Frag or its 2026-04 predecessor "Copy Fail" (CVE-2026-31431, previously covered by CERT-EU advisory 2026-005) — the two are described as difficult to distinguish from process-execution logs alone.
    region_nexus: "global"
    primary_sector_nexus: "indirect"
    sector: "public-sector"
    cves: [CVE-2026-43284, CVE-2026-43500, CVE-2026-46300]
    techniques: [T1068, T1611]
    affected_products: ["Linux kernel"]
    entity_keys: []
    new_entities:
      - { key: "trend:dirty-frag-linux-kernel-page-cache-lpe", type: trend, name: "Dirty Frag / Fragnesia", aliases: ["Dirty Frag", "Fragnesia"],
          summary: "Aikido Security's collective name for a Linux kernel local-privilege-escalation attack class (CVE-2026-43284, CVE-2026-43500, CVE-2026-46300) in which unmarked shared page-cache fragments reach in-place modification via the IPsec ESP and RxRPC networking decrypt/verify paths, letting a local attacker corrupt a privileged read-only binary's in-memory copy and gain root; Microsoft reports limited real-world activity using the pattern, though attribution between Dirty Frag and its April-2026 predecessor 'Copy Fail' (CVE-2026-31431) is not yet distinguishable from process logs alone (Aikido Security, 2026-09-04)." }
    relation_suggestions: []
    verification: SINGLE-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "Dirty Frag (CVE-2026-43284, CVE-2026-43500 and CVE-2026-46300) gets the Linux kernel to edit its cached copy anyway."
        attribution: "Aikido Security"
        source_url: "https://www.aikido.dev/blog/dirty-frag"
      - quote: "Running su reads the tampered copy and hands the attacker root access, even though they were only ever allowed to read that file."
        attribution: "Aikido Security"
        source_url: "https://www.aikido.dev/blog/dirty-frag"
      - quote: "Proof-of-concept code is already public. Microsoft has reported limited real-world activity where an attacker escalates privileges using su, though it's careful to note this may be Dirty Frag or its predecessor Copy Fail, since the two are hard to tell apart from process logs alone."
        attribution: "Aikido Security"
        source_url: "https://www.aikido.dev/blog/dirty-frag"
      - quote: "In the Linux kernel, the following vulnerability has been resolved:\n\nxfrm: esp: avoid in-place decrypt on shared skb frags"
        attribution: "MITRE CVE Record (Linux CNA)"
        source_url: "https://cveawg.mitre.org/api/cve/CVE-2026-43284"
    extended_notes: |
      [SINGLE-SOURCE for the "Dirty Frag" framing and the Microsoft limited-exploitation claim specifically — Aikido Security is the only source found tying these three CVEs together under this name and reporting Microsoft's observation this run; the three underlying CVEs themselves are independently confirmed on MITRE's CVE record (CNA: Linux), so CVE identity/mechanism is MULTI-SOURCE even though the "active exploitation" framing is not.] Detection concept (telemetry class first): process-creation / audit-framework events showing an unknown or freshly-dropped ELF binary executed immediately followed by invocation of a setuid binary (su or equivalent) — Linux audit framework execve + setuid-transition records are the concrete anchor Aikido names. Additional signal: esp4/esp6/rxrpc kernel modules loading on a host with no legitimate IPsec VPN or AFS use case, especially co-occurring with other suspicious activity (`lsmod | grep -E 'esp4|esp6|rxrpc'`). Exposure check: compare `uname -r` against the distribution vendor's fixed package version, NOT the upstream kernel version number (backports mean a patched RHEL/Ubuntu host can report an old-looking version string); `sysctl user.max_user_namespaces` above zero indicates the common route into the ESP path (RxRPC does not require namespaces, so zero is not full coverage). Hardening beyond the kernel patch: run workloads as non-root, enable the RuntimeDefault seccomp profile, enforce restricted pod security policies, and limit unprivileged user-namespace creation — these reduce reachability but do not fix the underlying flaw. If exploitation is suspected, run integrity checks from a trusted external environment, since blocking the vulnerable kernel modules does not undo page-cache corruption already made.
    borderline: false

