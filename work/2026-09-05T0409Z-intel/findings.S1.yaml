items:
  - title: "GeoNetwork: unauthenticated formatter-upload + unsafe Saxon XSLT config chain to unauthenticated RCE on government geoportal backends (CVE-2026-63219, CVE-2026-58400)"
    sources:
      - { url: "https://github.com/geonetwork/core-geonetwork/security/advisories/GHSA-mh22-prqr-vf42", publisher: "GeoNetwork (GitHub Security Advisory)", date: "2026-08-31", role: "primary" }
      - { url: "https://github.com/geonetwork/core-geonetwork/security/advisories/GHSA-x898-729x-cc3r", publisher: "GeoNetwork (GitHub Security Advisory)", date: "2026-08-31", role: "primary" }
      - { url: "https://ethiack.com/info-hub/research/geonetwork-preauth-RCE", publisher: "Ethiack (Rafael Castilho)", date: "2026-08-31", role: "primary" }
      - { url: "https://thehackernews.com/2026/09/geonetwork-fixes-unauthenticated-rce.html", publisher: "The Hacker News", date: "2026-09-02", role: "corroborating" }
    discovery_trace: "first seen at: bsi-de (WID-SEC-2026-3174 RSS entry, 'GeoNetwork: Schwachstelle ermöglicht Manipulation von Dateien'), URL https://wid.cert-bund.de/content/public/securityAdvisory/rss → pivot: enisa-euvd recent exploited, URL https://euvd.enisa.europa.eu/ (EUVD-2026-70647, aliases CVE-2026-63219) → primary: GeoNetwork GitHub Security Advisory, URL https://github.com/geonetwork/core-geonetwork/security/advisories/GHSA-mh22-prqr-vf42 → primary: GeoNetwork GitHub Security Advisory (Saxon RCE), URL https://github.com/geonetwork/core-geonetwork/security/advisories/GHSA-x898-729x-cc3r → primary: Ethiack researcher write-up (full chain + PoC video), URL https://ethiack.com/info-hub/research/geonetwork-preauth-RCE → corroborating: The Hacker News, URL https://thehackernews.com/2026/09/geonetwork-fixes-unauthenticated-rce.html"
    summary: |
      Two chained GeoNetwork flaws let an unauthenticated attacker reach remote code execution on a widely deployed open-source geospatial metadata catalog application used behind government open-data portals, environmental agencies, national geoportals (the European INSPIRE geoportal is named as a deployment) and enterprise GIS platforms. CVE-2026-63219 (CVSS 3.1 8.6) is a missing-authorization flaw on the formatter-creation API endpoint (POST /geonetwork/srv/api/formatters): the admin-only endpoint was never guarded by GeoNetwork's own @PreAuthorize checks, so any unauthenticated caller can upload arbitrary .xsl or .zip "formatter" files, writing them straight into the server's formatter directory. CVE-2026-58400 (CVSS 3.1 9.1, CVSS text-labelled Critical by the vendor) is a second-order flaw in how GeoNetwork configures its Saxon XSLT processor: the engine (common/src/main/java/org/fao/geonet/utils/Xml.java) runs without FEATURE_SECURE_PROCESSING and without disabling ALLOW_EXTERNAL_FUNCTIONS, so any stylesheet GeoNetwork loads can call java.lang.Runtime.exec() or java.lang.ProcessBuilder directly. Chained, an attacker uploads a malicious .xsl formatter through the unauthenticated endpoint, then triggers it with a simple unauthenticated GET against any public record (the formatter name and a public record UUID are both attacker-discoverable through GeoNetwork's own search API), achieving unauthenticated remote code execution as the GeoNetwork process user. Ethiack researcher Rafael Castilho, who reports discovering the chain independently and in collision with another researcher, published a reverse-shell proof-of-concept demonstration against GeoNetwork 4.4.11. Both flaws affect every GeoNetwork 4.3.x/4.4.x release up to 4.4.11 and every 4.2.x release up to 4.2.16; both are fixed in 4.4.12 and 4.2.17 (released 2026-07-08). The same researcher also found and reported a related unauthenticated SSRF in the buildSLD endpoint and a reflected-XSS-to-account-takeover chain via the non-HttpOnly XSRF-TOKEN cookie and an unescaped uiconfig parameter reflected into an inline gnGlobalSettings.init() script call — GeoNetwork rated the XSS Medium, the researcher argues High given the unauthenticated, one-click account-takeover impact. No source (the vendor's own advisories, the discovering researcher, or The Hacker News) reports confirmed in-the-wild exploitation of the RCE chain; CISA's ADP Vulnrichment SSVC assessment on the Saxon CVE record (as of 2026-09-03) explicitly lists Exploitation as "none". ENISA's EU Vulnerability Database, however, lists the file-upload half alone (CVE-2026-63219 / EUVD-2026-70647) on its exploited feed with an exploitedSince date of 2026-09-02 — a claim no other source corroborates and that contradicts the "none" SSVC assessment on the companion CVE in the same chain; treat the EUVD exploited flag here with the same scepticism this pipeline has already applied to a comparable EUVD/vendor mismatch on CVE-2026-69836.
    region_nexus: "global; explicitly names the European INSPIRE geoportal as a deployment, so EU/EEA government geodata infrastructure is directly in scope"
    primary_sector_nexus: "direct"
    sector: "public-sector"
    cves: [CVE-2026-63219, CVE-2026-58400]
    techniques: [T1190]
    affected_products: ["GeoNetwork opensource"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "An unauthenticated attacker can upload arbitrary .xsl or .zip formatter files to the server."
        attribution: "GeoNetwork Security Advisory (GHSA-mh22-prqr-vf42)"
        source_url: "https://github.com/geonetwork/core-geonetwork/security/advisories/GHSA-mh22-prqr-vf42"
      - quote: "Any stylesheet loaded by GeoNetwork can therefore invoke java.lang.Runtime.exec() or java.lang.ProcessBuilder directly, achieving arbitrary command execution as the GeoNetwork process user."
        attribution: "GeoNetwork Security Advisory (GHSA-x898-729x-cc3r)"
        source_url: "https://github.com/geonetwork/core-geonetwork/security/advisories/GHSA-x898-729x-cc3r"
      - quote: "As you may expect, we can chain the Unauthorised Upload vulnerability with the unsafe XSLT processing vulnerability and get unauthenticated Remote Code Execution."
        attribution: "Ethiack (Rafael Castilho)"
        source_url: "https://ethiack.com/info-hub/research/geonetwork-preauth-RCE"
      - quote: "The Hacker News found no reference to the GeoNetwork flaws in CISA's Known Exploited Vulnerabilities catalog as of the disclosure, and no public reporting of exploitation in the wild."
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/09/geonetwork-fixes-unauthenticated-rce.html"
    extended_notes: |
      Detection concept: web-server / reverse-proxy access logs for POST requests to /geonetwork/srv/api/formatters from unauthenticated sessions (any hit is anomalous — the vendor's own interim mitigation is to deny POST/PUT/PATCH to that path at the proxy layer), followed by a GET to the record-view endpoint referencing a newly created formatter name; process-creation telemetry on the GeoNetwork host for any child process spawned by the Java process hosting GeoNetwork (Tomcat/the app server), which should never legitimately fork OS commands. Hardening: upgrade to 4.4.12 / 4.2.17; where upgrade is not immediate, block POST/PUT/PATCH to srv/api/formatters at the reverse proxy (Apache httpd or Nginx snippets are in the vendor advisory) — but note this also disables the legitimate formatter-management admin UI, which shares the same endpoint. Swiss relevance: GeoNetwork and GeoNetwork-derived catalog software are common building blocks behind INSPIRE-compliant cantonal and federal geoportals in Europe; any Swiss public-sector geodata catalog service should be checked against this version range specifically.
    borderline: false

  - title: "VMware Workstation & Fusion: guest-to-host code execution via VMXNET3 integer overflow and HGFS stack overflow (CVE-2026-59346, CVE-2026-59347)"
    sources:
      - { url: "https://www.securityweek.com/vmware-workstation-and-fusion-updates-patch-critical-vulnerability/", publisher: "SecurityWeek", date: "2026-09-04", role: "corroborating" }
      - { url: "https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/SecurityAdvisories/0/38288", publisher: "Broadcom (VMware PSIRT)", date: "2026-09-04", role: "primary" }
    discovery_trace: "first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/12912 ('[Advisory] VMware Workstation & Fusion: Guest-to-Host Code Execution (CVE-2026-59346)', published 2026-09-04T13:41Z) → primary: Broadcom Security Advisory, URL https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/SecurityAdvisories/0/38288 → corroborating: SecurityWeek, URL https://www.securityweek.com/vmware-workstation-and-fusion-updates-patch-critical-vulnerability/"
    summary: |
      Broadcom shipped VMware Workstation and Fusion 26H1u1 on 2026-09-04 fixing two guest-to-host escape flaws distinct from the vCenter/ESX/Workstation/Fusion bulletin (VMSA-2026-0006, CVE-2026-59309/59310/47876/41703/41709) this pipeline already covered on 2026-07-30. CVE-2026-59346 (CVSS 3.1 9.3) is an integer overflow in the VMXNET3 virtual network adapter that a guest VM administrator can trigger to execute arbitrary code on the host — the same vulnerability class (VMXNET3 out-of-bounds write) as CVE-2026-47876 in the July bulletin, but a newly assigned, separately patched flaw. CVE-2026-59347 (CVSS 8.1) is a stack-based buffer overflow in the Host Guest File System (HGFS) that reaches code execution in the host-side VMX process. Both require local administrative privileges inside the guest VM as a starting point; CVE-2026-59346 additionally requires the VM to be configured with a VMXNET3 virtual network adapter. Both were reported privately to Broadcom; NCSC-CH's advisory and Broadcom's own bulletin record the exploitation status as unknown/not observed. Fixed in Workstation and Fusion 26H1u1; versions 25H2 and 26H1 are affected.
