  - title: "CERT-FR CERTFR-2026-AVI-0631 — Stormshield Network Security (SNS) DoS vulnerability (CVE-2025-9086); ANSSI advisory for French public-sector firewall appliance"
    sources:
      - { url: "https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-0631/", publisher: "CERT-FR / ANSSI", date: "2026-05-22", role: "primary" }
      - { url: "https://advisories.stormshield.eu/2026-010", publisher: "Stormshield PSIRT", date: "2026-05-21", role: "primary" }
    discovery_trace: "first seen at: cert-fr-avis (bridge, cert-fr avis-recent 40), CERTFR-2026-AVI-0631 published 2026-05-22, URL https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-0631/ → primary vendor advisory: Stormshield advisory 2026-010, URL https://advisories.stormshield.eu/2026-010"
    summary: |
      ANSSI / CERT-FR issued advisory CERTFR-2026-AVI-0631 on 2026-05-22, tracking Stormshield Security Bulletin
      2026-010 (published 2026-05-21). The vulnerability (CVE-2025-9086) affects Stormshield Network Security (SNS)
      — a French-made next-generation firewall appliance used extensively across French public administration,
      defence-adjacent networks, and EU government environments with French procurement standards. The flaw enables
      an unauthenticated remote attacker to cause a denial-of-service condition. Affected versions: SNS 4.3.x prior
      to 4.3.43, SNS 4.4.x through 4.8.x prior to 4.8.16, SNS 5.x prior to 5.0.6. Patches are available from
      Stormshield; CERT-FR directs affected organisations to the vendor's security bulletin for remediation.
      No exploitation in the wild reported. The CH/EU nexus is direct: Stormshield appliances are procurement-
      preferred in French ministries, OIV (Opérateurs d'Importance Vitale) environments, and Belgian government
      networks; Switzerland uses Stormshield in some federal procurement environments where ANSSI certification
      is specified. MITRE ATT&CK: T1499 (Endpoint Denial of Service). Defender action: patch SNS to the versions
      above before public PoC development; verify SNS is not internet-exposed on management interfaces;
      check Stormshield advisory 2026-010 for specific attack-surface details.
    ch_eu_nexus: "Direct — Stormshield SNS is a French-made NGFW used across French and Belgian public administration and OIV networks, and in some Swiss federal procurement contexts where ANSSI certification is required"
    public_sector_nexus: "direct"
    sector: "government, defence-adjacent, critical infrastructure"
