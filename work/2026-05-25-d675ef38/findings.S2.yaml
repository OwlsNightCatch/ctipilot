        attribution: "CERT-FR / ANSSI (CERTFR-2026-AVI-0609)"
        source_url: "https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-0609/"
      - quote: "A technician can read arbitrary files inside the GLPI_DOC_DIR. Fixed in 10.0.25 / 11.0.7."
        attribution: "GLPI Project (GHSA-58j6-94cf-gcx5)"
        source_url: "https://github.com/glpi-project/glpi/security/advisories/GHSA-58j6-94cf-gcx5"
    extended_notes: |
      The GLPI advisory cluster is particularly relevant given that an older critical unauthenticated SQL injection
      (CVE-2026-26263) was patched in March 2026 and followed by this moderate-severity pair in May 2026. Security
      teams should ensure they are fully current (11.0.7+ or 10.0.25+) given the ongoing advisory cadence in 2026.
      CERT-FR advisory page does not cite a new GLPI blog post for these May 2026 fixes; the canonical fix reference
      is the GitHub Security Advisories.

