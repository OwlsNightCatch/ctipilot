  - title: "GLPI GHSA-58j6-94cf-gcx5 / GHSA-cg63-qchq-q626 (CVE-2026-32312 / CVE-2026-42320) — arbitrary-file read by technician and unauthorised form export; CERT-FR CERTFR-2026-AVI-0609; patch to 11.0.7 / 10.0.25"
    sources:
      - { url: "https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-0609/", publisher: "CERT-FR / ANSSI", date: "2026-05-19", role: "primary" }
      - { url: "https://github.com/glpi-project/glpi/security/advisories/GHSA-58j6-94cf-gcx5", publisher: "GLPI Project (GitHub Security Advisory)", date: "2026-05-18", role: "primary" }
      - { url: "https://github.com/glpi-project/glpi/security/advisories/GHSA-cg63-qchq-q626", publisher: "GLPI Project (GitHub Security Advisory)", date: "2026-05-18", role: "corroborating" }
    discovery_trace: "first seen at: cert-fr-avis (bridge, cert-fr avis-recent 40), CERTFR-2026-AVI-0609 published 2026-05-19, URL https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-0609/ → primary: GLPI GitHub security advisories, URL https://github.com/glpi-project/glpi/security/advisories/GHSA-58j6-94cf-gcx5"
    summary: |
      CERT-FR published CERTFR-2026-AVI-0609 on 2026-05-19 covering two GLPI security advisories (GHSA-58j6-94cf-gcx5
      and GHSA-cg63-qchq-q626, published 2026-05-18) assigning CVE-2026-32312 and CVE-2026-42320 respectively.
      GLPI (Gestionnaire Libre de Parc Informatique) is the open-source IT asset management and service-desk
      platform deployed as a standard across French public administration (including ministries, hospitals, and
      municipal governments), many Belgian and Swiss cantonal IT departments, and EU institutional IT teams.
      GHSA-58j6-94cf-gcx5 (CVE-2026-42320): A technician-level authenticated user can read arbitrary files inside
      the GLPI_DOC_DIR path — the directory where GLPI stores uploaded documents, which may include scanned ID
      documents, contracts, and internal policies in government deployments. CVSS: 5.9 (Moderate). Affected: GLPI
      >= 0.50 and < 11.0.7; also affects 10.x below 10.0.25. GHSA-cg63-qchq-q626 (CVE-2026-32312): An
      authenticated user with forms READ permission can export the structure of forms they are not authorised to
      access (information disclosure). Fixed in 11.0.7. CVSS: 5.1 (Medium). Neither flaw allows unauthenticated
      access; both require a valid GLPI account. However, in public-sector environments where GLPI is federated
      with Active Directory or LDAP and many users have basic technician roles, the arbitrary file read
      (CVE-2026-42320) represents meaningful lateral-information escalation. The separate older CVE-2026-26263
      (unauthenticated time-based blind SQL injection in GLPI 11.0.0–11.0.5 Search engine, fixed in 11.0.6,
      CVSS 8.1 HIGH) was already patched in the March 2026 release wave. MITRE ATT&CK: T1083 (File and Directory
      Discovery via arbitrary file read), T1213 (Data from Information Repositories — form structure export).
      Upgrade to GLPI >= 11.0.7 or >= 10.0.25 immediately; apply access-control principle of least privilege for
      technician-role assignments; audit GLPI_DOC_DIR contents for sensitive government documents.
    ch_eu_nexus: "Direct — GLPI is standard French public-administration ITSM platform; widely deployed in Swiss cantons, Belgian municipalities, and EU institutions"
    public_sector_nexus: "direct"
    sector: "government, healthcare, education"
    cves: [CVE-2026-32312, CVE-2026-42320]
    actors_campaigns_malware: []
