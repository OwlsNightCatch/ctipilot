items:
  - title: "UPDATE: ShinyHunters lists Charter Communications (Spectrum) — 42M records claimed; victim issues partial denial; broader Salesforce-credential campaign now spanning telco sector"
    sources:
      - url: "https://cyberinsider.com/charter-communications-confirms-data-breach-as-hackers-threaten-leak-of-42-million-records/"
        publisher: "CyberInsider"
        date: "2026-05-23"
        role: "primary"
      - url: "https://www.troyhunt.com/weekly-update-505/"
        publisher: "Troy Hunt (weekly update 505)"
        date: "2026-05-24"
        role: "corroborating"
    discovery_trace: >
      first seen at: troyhunt feed, URL https://www.troyhunt.com/weekly-update-505/ (published 2026-05-24,
      references ShinyHunters 3 new victims including Charter) → pivot: CyberInsider, URL
      https://cyberinsider.com/charter-communications-confirms-data-breach-as-hackers-threaten-leak-of-42-million-records/
      (2026-05-23, Charter victim statement) → corroborating: WebSearch confirms SEC EDGAR filings for Charter
      and multiple journalism sources corroborate (blog.rankiteo.com, redpacketsecurity.com)
    summary: |
      ShinyHunters listed Charter Communications (operating as Spectrum brand — one of the largest US cable
      and ISP operators) on its leak site on or around May 22-23 2026, claiming over 42 million records
      containing PII were exfiltrated. The group set a May 27 negotiation deadline before threatening public
      release. Charter issued a limited statement confirming it is "following security protocols" and
      "alerting appropriate authorities," but explicitly denies that "sensitive personal information (PI) or
      customer proprietary network information (CPNI)" was exfiltrated — language calibrated to US telecom
      regulatory requirements (CPNI is an FCC-protected category). No SEC Item 1.05 8-K has been identified
      as filed; the prior Charter 8-K filings in EDGAR (dated May 15 and January 2026) relate to debt and
      compensation matters.

      The attack pattern is consistent with the broader ShinyHunters Salesforce-targeting campaign that
      previously claimed 7-Eleven (600K franchise records, confirmed — covered 2026-05-19), Vimeo,
      Instructure (Canvas LMS, ransom reportedly paid), Medtronic, Wynn Resorts, and others. The campaign
      exploits misconfigured Salesforce environments: exposed OAuth credentials, authentication tokens,
      and improperly secured API integrations rather than a vulnerability in Salesforce itself. Charter's
      Spectrum brand operates large-scale B2C customer data environments that would contain billing,
      account, and contact PII at scale.

      Defenders with Salesforce deployments should audit OAuth app permissions, review Community/Experience
      Cloud guest-user access, rotate long-lived connected-app credentials, and enable Salesforce Shield
      Event Monitoring (EventLogFile) to detect anomalous bulk object queries — a `SELECT *` on Account or
      Contact at scale is the data-exfiltration pattern. Detection: Salesforce Shield audit logs for
      QueryResult volumes exceeding normal per-user baseline; EDR telemetry for sfdc-cli or unofficial
      Salesforce API client processes; network monitoring for large outbound transfers to non-corporate
      S3-like endpoints from Salesforce IP ranges.
    ch_eu_nexus: "indirect — ShinyHunters campaign is global; Charter is US-domiciled but campaign methodology applies to any enterprise Salesforce deployment including Swiss/EU entities"
    public_sector_nexus: "indirect — campaign targets enterprise SaaS; many EU public bodies use Salesforce for CRM"
    sector: "telco, enterprise SaaS"
    cves: []
    actors_campaigns_malware: ["ShinyHunters"]
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: "update-to-prior:2026-05-19"
    evidence:
      - quote: "We are aware of the situation, following our security protocols, and are in the process of alerting appropriate authorities. No sensitive personal information (PI) or customer proprietary network information (CPNI) data was exfiltrated by the threat actor."
        attribution: "Charter Communications spokesperson, via CyberInsider"
        source_url: "https://cyberinsider.com/charter-communications-confirms-data-breach-as-hackers-threaten-leak-of-42-million-records/"
      - quote: "ShinyHunters having gone quiet since the massive haul that would have been the Instructure ransom [...] ShinyHunters Claims 3 New Victims [including Charter Communications]"
        attribution: "Troy Hunt, Weekly Update 505"
        source_url: "https://www.troyhunt.com/weekly-update-505/"
    extended_notes: |
      The 7-Eleven ShinyHunters Salesforce breach (confirmed, 600K records) was covered on 2026-05-19.
      Charter's listing represents the campaign's first confirmed telco/ISP victim issuing a public statement.
      Note: ShinyHunters' claim of 42M records has not been independently verified; the actual scope may be
      significantly smaller if Charter's denial of "sensitive PI" exfiltration holds. CPNI specifically
      covers call records, network usage, and service details — its exclusion from the denial may indicate
      other non-CPNI PII (billing name, address, email) was accessed.

      May 27 2026 is the stated deadline before ShinyHunters threatens data release. Defenders should
      monitor the group's leak site activity and prepare incident-response runbooks if they have Salesforce
      environments with connected apps using long-lived credentials.

  - title: "Oncology Institute Inc. (NASDAQ: TOI) files SEC Item 1.05 8-K — third-party software vendor breach escalates to material cybersecurity disclosure; multi-provider cascade confirmed [SINGLE-SOURCE]"
    sources:
      - url: "https://www.sec.gov/Archives/edgar/data/0001799191/000107997326000721/toi_8k.htm"
        publisher: "SEC EDGAR / The Oncology Institute Inc."
        date: "2026-05-22"
        role: "primary"
      - url: "https://www.minichart.com.sg/2026/05/23/the-oncology-institute-reports-cybersecurity-incident-affecting-software-vendor-form-8-k-filing-may-2026/"
        publisher: "MiniChart (aggregator)"
        date: "2026-05-23"
        role: "corroborating"
    discovery_trace: >
      first seen at: sec-edgar bridge subcommand (query Item 1.05, 2026-05-20 to 2026-05-25) →
      returned filing for Oncology Institute Inc. CIK 0001799191, ADSH 0001079973-26-000721, filed 2026-05-22 →
      WebSearch "Oncology Institute TOI SEC 8-K cyber incident data breach May 2026" confirmed filing URL
      https://www.sec.gov/Archives/edgar/data/0001799191/000107997326000721/toi_8k.htm →
      corroborating journalism: MiniChart 2026-05-23, ComplianceHub.wiki 2026-05-23
    summary: |
      The Oncology Institute Inc. (NASDAQ: TOI), a multi-state US oncology services chain, filed an SEC
      Form 8-K under Item 1.05 (Material Cybersecurity Incidents) on May 22 2026. The filing escalates a
      prior voluntary disclosure (Item 8.01, November 6 2025) from immaterial to material. The root event
      is a breach at an unnamed third-party software vendor whose systems were accessed by an unauthorised
      party. On May 20 2026, Kroll (the vendor's third-party administrator / breach response firm) notified
      TOI that the vendor's investigation had confirmed unauthorised access to systems affecting patient data.

      Key structural lessons for defenders:
      1. **Third-party vendor breach → bilateral cascade**: the unnamed vendor serves "various other
         healthcare service providers" — a classic billing/EHR/practice management vendor with multi-tenant
         SaaS architecture where a single breach propagates to all tenants. The vendor set up a patient
         notification portal, implying breach scope was finalized enough for mass notification.
      2. **Materiality determination delay**: TOI made its initial disclosure (Item 8.01, non-material)
         on November 6 2025, then waited six months before the same incident crossed the SEC materiality
         threshold. This is the escalation pattern regulators are scrutinising under the December 2023 SEC
         cyber disclosure rule — defenders should track that their vendor's incident notifications can
         trigger your own disclosure obligations with a four-business-day clock.
      3. **Kroll as breach admin**: Kroll Information Assurance LLC is explicitly named as the vendor's
         third-party breach-response administrator. Kroll's role here is notification management, not
         security response — meaning the actual vendor's security failure occurred months before any
         notification to affected downstream providers.

      For EU-nexus defenders: the pattern (billing/EHR vendor → multiple healthcare clients → late
      notification → regulatory cascade) mirrors the Unimed/German university hospital billing-processor
      breach covered 2026-05-24. Third-party healthcare software vendors with multi-tenant EU deployments
      face GDPR Art. 33 72-hour notification obligations that interact with US HIPAA 60-day notification
      windows — a compliance gap that can catch EU-domiciled US vendor subsidiaries.
    ch_eu_nexus: "low direct — TOI is US-domiciled; structural pattern (multi-tenant vendor breach, delayed notification, materiality escalation) is directly relevant to EU healthcare and public-sector procurement risk assessment"
    public_sector_nexus: "indirect — healthcare supply-chain pattern applies to public-sector hospitals using SaaS vendors"
    sector: "healthcare, software supply chain"
    cves: []
    actors_campaigns_malware: []
    verification: SINGLE-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Kroll, the third-party administrator for the Vendor, notified the Company that the Vendor had detected unauthorized access by a third party to certain information systems of the Company, including systems affecting data of patients"
        attribution: "The Oncology Institute Inc., SEC Form 8-K Item 1.05, 2026-05-22"
        source_url: "https://www.sec.gov/Archives/edgar/data/0001799191/000107997326000721/toi_8k.htm"
      - quote: "The Company believes that the cybersecurity incident has affected various other healthcare service providers, and the Vendor has set up a patient portal through which it intends to provide information and responses to inquiries"
        attribution: "The Oncology Institute Inc., SEC Form 8-K Item 1.05, 2026-05-22"
        source_url: "https://www.sec.gov/Archives/edgar/data/0001799191/000107997326000721/toi_8k.htm"
    extended_notes: |
      SINGLE-SOURCE caveat: The SEC filing (Item 1.05) is the primary disclosing authority for this event;
      journalism coverage is minimal and aggregator-only at the time of this run. The underlying vendor's
      identity has not been disclosed publicly.

      The prior voluntary disclosure (November 6 2025) was filed under Item 8.01 (not 1.05), meaning TOI
      had determined at that stage that the incident was not yet material. The transition to 1.05 six
      months later suggests the investigation concluded with confirmed patient data exposure, triggering
      the four-business-day material disclosure clock under SEC Rule 13a-11.

      West Pharmaceutical Services (WST) 8-K/A was covered on 2026-05-22 as a prior item — this is a
      different company and a different incident.

