entries:
- entry: 2026-05-15/windows-bitlocker-yellowkey-and-ctfmon-greenplasma-zero-days
  verdict: factual-error
  defects:
  - where: headline / title / summary
    claim: public PoC, no patch, TPM-only BitLocker bypassed ; Windows BitLocker "YellowKey" zero-day (no CVE) ... no patch available
    defect: 'Superseded and, for "no CVE", contradicted by the entry itself: the 2026-05-20 section records CVE-2026-45585, and Microsoft shipped the YellowKey fix in the June 2026 updates. The body never
      records GreenPlasma''s CVE or fix either.'
    ground_truth: 'MSRC CVE-2026-45585 revision 2 (2026-06-09): "Added links to June 2026 Windows security updates. Microsoft recommends installing this updates as soon as possible." Fixed builds in the
      MSRC table: KB5094125 (Windows Server 2025, 10.0.26100.32995), KB5094126 (Windows 11 24H2 10.0.26100.8655, 25H2 10.0.26200.8655), KB5095051 (Windows 11 26H1, 10.0.28000.2269). GreenPlasma is CVE-2026-45586
      (CTFMON EoP, CWE-59, CVSS 7.8), released 2026-06-09. BleepingComputer 2026-06-10: "On Tuesday, Microsoft fixed the GreenPlasma, MiniPlasma, and YellowKey security vulnerabilities as part of its June
      2026 Patch Tuesday updates".'
    ground_truth_url: https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-45585
    fix: 'Through a changelog record, move headline, summary and actions to the current state: YellowKey = CVE-2026-45585, fixed 2026-06-09; GreenPlasma = CVE-2026-45586, fixed 2026-06-09; drop "no CVE"
      and "no patch".'
    class: factual-error
  - where: cves[CVE-2026-45585]
    claim: 'status: [poc-public, mitigation-only]; affected: null; fixed: null'
    defect: A security update has been available since 2026-06-09, so mitigation-only is false; MSRC publishes the affected products and fixed builds. id and cvss 6.8 and physical vector / pre-auth (PR:N)
      are correct.
    ground_truth: 'MSRC record: baseScore 6.8, vector CVSS:3.1/AV:P/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H/E:P/RL:W/RC:C, exploited "No", publiclyDisclosed "Yes", "Exploitation More Likely"; remediation table lists
      Windows 11 24H2/25H2/26H1 and Windows Server 2025 only (no Windows Server 2022). Not in CISA KEV (catalogue 2026.10.20).'
    ground_truth_url: https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-45585
    fix: Set status to patch-available (poc-public may stay), fill affected and fixed from the MSRC table; exploited stays No.
    class: factual-error
  - where: actions[0] and actions[1]
    claim: YellowKey (no CVE) bypasses TPM-only BitLocker ... Disable WinRE access where operationally viable (`reagentc /disable`). ; Microsoft's WinRE `BootExecute` registry mitigation is per-device and
      fragile under Windows feature updates that re-stage WinRE ... Public PoC, no patch (MSRC CVE-2026-45585)
    defect: '"No CVE" and "no patch" are stale, and the MSRC page cited for "no patch" now links the June 2026 updates; the reagentc /disable advice and the claim that the mitigation is fragile under feature
      updates appear in no cited source (MSRC''s own script uses reagentc to mount, then disable and re-enable WinRE to re-seal BitLocker trust).'
    ground_truth: 'BleepingComputer: Beaumont "recommended using a BitLocker PIN and a BIOS password"; NCSC-CH #12574: "Implement BIOS passwords and setting a BitLocker PIN mitigates the current public
      PoC". MSRC FAQ: "if you are using TPM+PIN the vulnerability is not exploitable." No source mentions feature updates re-staging WinRE.'
    ground_truth_url: https://www.bleepingcomputer.com/news/security/windows-bitlocker-zero-day-gives-access-to-protected-drives-poc-released/
    fix: Replace both actions with one task derived from the sources (BitLocker PIN plus BIOS password on TPM-only laptops, or install the June 2026 update); delete reagentc /disable and the fragility claim.
    class: factual-error
  - where: body paragraph 1
    claim: Microsoft states it is "actively investigating."
    defect: The quoted phrase is in none of the cited sources (BleepingComputer, The Register, NCSC-CH, MSRC); it is an invented quotation.
    ground_truth: 'BleepingComputer: a Microsoft spokesperson "stated that the company is committed to investigating reported security issues, "and update impacted devices to protect customers as soon as
      possible.""'
    ground_truth_url: https://www.bleepingcomputer.com/news/security/windows-bitlocker-zero-day-gives-access-to-protected-drives-poc-released/
    fix: Quote the BleepingComputer statement verbatim or remove the quotation marks.
    class: factual-error
  - where: body paragraph 1
    claim: bringing the total of unpatched Nightmare Eclipse Windows zero-days to four
    defect: No cited source states four. BleepingComputer says two unpatched flaws and says RedSun was silently patched; The Register counts five zero-days this year with RedSun and UnDefend unfixed. Four
      is the entry's own subtraction over sources that disagree on RedSun.
    ground_truth: 'The Register 2026-05-13: "YellowKey and GreenPlasma are the latest in a series of five Microsoft zero-day bugs the researcher has exposed this year ... Both RedSun and UnDefend remain
      unfixed"; BleepingComputer: "Microsoft silently patched the RedSun vulnerability".'
    ground_truth_url: https://www.theregister.com/security/2026/05/13/disgruntled-researcher-releases-two-more-microsoft-zero-days/5239758
    fix: Drop the total, or attribute it to The Register and note the BleepingComputer disagreement on RedSun.
    class: imprecision
  - where: body paragraph 1 (YellowKey mechanism and affected scope)
    claim: crafted `FsTx` folder contents placed on a USB drive or the EFI partition are replayed by WinRE ... The current public PoC defeats TPM-only BitLocker configurations on Windows 11 and Windows
      Server 2022/2025; the researcher asserts the full bypass also defeats TPM+PIN but the unpublished variant is unconfirmed.
    defect: 'Three omissions: (1) Dormann could reproduce only with the USB drive, not the EFI partition; (2) Microsoft states TPM+PIN is not exploitable and Dormann says the public exploit does not work
      with TPM+PIN, a researcher-versus-vendor contradiction the entry never surfaces; (3) MSRC lists Windows 11 24H2/25H2/26H1 and Windows Server 2025 only, so "Windows Server 2022" is the researcher''s
      and BleepingComputer''s claim, not the vendor''s affected list.'
    ground_truth: 'BleepingComputer: Dormann "could not reproduce the bug using the EFI partition"; "the current YellowKey exploit does not work in a TMP+PIN environment". MSRC FAQ: "No, if you are using
      TPM+PIN the vulnerability is not exploitable."'
    ground_truth_url: https://www.bleepingcomputer.com/news/security/windows-bitlocker-zero-day-gives-access-to-protected-drives-poc-released/
    fix: State USB confirmed, EFI-partition variant claimed but not reproduced; add a Contradiction line (researcher claims TPM+PIN bypass, Microsoft says not exploitable); scope the product list to the
      MSRC table.
    class: imprecision
  - where: body paragraph 1
    claim: deleting `winpeshl.ini` — the file that suppresses the recovery shell
    defect: 'No source says what winpeshl.ini does, and the BleepingComputer quotation implies the opposite: with the file deleted, WinRE opens a command prompt instead of the recovery environment, so the
      file is what launches the recovery environment.'
    ground_truth: 'Dormann (BleepingComputer): "The result of this is that the X:\Windows\System32\winpeshl.ini is deleted, and when Windows Recovery is entered, rather than launching the actual Windows
      Recovery environment, it pops up a CMD.EXE. With the disk still unlocked".'
    ground_truth_url: https://www.bleepingcomputer.com/news/security/windows-bitlocker-zero-day-gives-access-to-protected-drives-poc-released/
    fix: Say "deleting winpeshl.ini, so WinRE opens CMD.EXE with the disk unlocked instead of the recovery environment".
    class: imprecision
  - where: body paragraph 1 (ATT&CK) and frontmatter techniques[]
    claim: 'MITRE ATT&CK: T1542.001 (Pre-OS Boot: System Firmware), T1006 (Direct Volume Access). ; techniques: []'
    defect: 'techniques[] is empty while the body names four ids. T1542.001 names a behavior no source describes: YellowKey replays NTFS transaction logs in WinRE and no firmware is modified. All four ids
      are active in ATT&CK v20 (checked: T1542.001, T1006, T1134, T1068); T1006 is also a weak fit (low confidence).'
    ground_truth: 'Dormann (BleepingComputer): "Windows looks for \System Volume Information\FsTx directories on attached drives, and will replay any NTFS logs".'
    ground_truth_url: https://www.bleepingcomputer.com/news/security/windows-bitlocker-zero-day-gives-access-to-protected-drives-poc-released/
    fix: Drop T1542.001 from the prose and carry the supported mapping in techniques[].
    class: imprecision
  - where: body paragraph 1 (Immediate mitigations)
    claim: set BIOS/UEFI boot password and disable USB/external-media boot; disable WinRE where operationally viable (`reagentc /disable`)
    defect: The cited sources give a BitLocker PIN and a BIOS password only; disabling USB/external-media boot and `reagentc /disable` are uncited.
    ground_truth: 'BleepingComputer: "He recommended using a BitLocker PIN and a BIOS password as a mitigation." NCSC-CH: "Implement BIOS passwords and setting a BitLocker PIN".'
    ground_truth_url: https://security-hub.ncsc.admin.ch/#/posts/12574
    fix: Cite a source for the extra items or delete them.
    class: imprecision
  - where: section 2026-05-20T05:00:11Z
    claim: Microsoft's interim mitigation requires per-endpoint work on every device using TPM-only BitLocker ... mount the WinRE image, remove the `autofstx.exe` entry ... ; add a BitLocker PIN or password
      protector ... The WinRE registry edit is fragile and breaks on Windows feature updates
    defect: MSRC says Microsoft "recommends that you consider" the mitigation, not that it is required on every device; MSRC replaced the manual steps with a script on 2026-05-21 (revision 1.2), so the
      described manual procedure is superseded; no source says feature updates break the edit; MSRC names TPM+PIN, not a "password protector".
    ground_truth: 'MSRC revision 1.2 (2026-05-21): "Added a script to implement a mitigation and removed the manual mitigations." FAQ: "Microsoft recommends that you consider implementing these mitigations
      if you are concerned your devices and data are at risk of being compromised or stolen."'
    ground_truth_url: https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-45585
    fix: Describe the MSRC script, say it is recommended where theft risk exists, and drop the fragility claim and "password protector".
    class: imprecision
  - where: frontmatter
    claim: 'classification: null ; affected_products: [] ; sectors: [public-sector, defense, education] ; event_date: 2026-05-14'
    defect: No Admiralty rating and no affected_products although the body names Windows 11 and Windows Server; the sectors appear in no cited source; event_date is a day after the primary's publication.
    ground_truth: BleepingComputer datePublished 2026-05-13T12:37:49-04:00; no cited source names a sector.
    ground_truth_url: https://www.bleepingcomputer.com/news/security/windows-bitlocker-zero-day-gives-access-to-protected-drives-poc-released/
    fix: Add classification and affected_products, drop the unsupported sectors, align event_date with 2026-05-13.
    class: imprecision
  - where: priority
    claim: 'priority: high'
    defect: 'Context only: on today''s facts the flaw is a physical-attack-only bypass (CVSS 6.8, AV:P), MSRC lists it exploited "No", it is not in CISA KEV and has been fixed since 2026-06-09, so it no
      longer meets the high bar.'
    ground_truth: 'MSRC: exploited "No"; "bypass a security feature with a physical attack".'
    ground_truth_url: https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-45585
    fix: Re-grade when the entry is brought to the current state.
    class: imprecision
- entry: 2026-05-30/nightmare-eclipse-chaotic-eclipse-microsoft-s-digital-crimes
  verdict: factual-error
  defects:
  - where: title / headline
    claim: Microsoft's Digital Crimes Unit threatens criminal action
    defect: Overstates the statement and silently picks the stronger of two source readings. Microsoft wrote that its Digital Crimes Unit "will continue bringing cases"; The Record says Microsoft "stopped
      short of directly threatening legal action"; heise reads it as threatening lawsuits and the police. No cited source says "criminal action" (the words "criminal activity" describe the researchers'
      targets, the attackers).
    ground_truth: 'MSRC blog 2026-05-27: "Our Digital Crimes Unit will continue bringing cases against these actors and those that enable their criminal activity – coordinating as needed with law enforcement
      around the world." The Record: "The company stopped short of directly threatening legal action". heise: "The company is threatening lawsuits and the police."'
    ground_truth_url: https://therecord.media/microsoft-calls-zero-day-releases-never-justifiable-as-researcher-threatens-more
    fix: 'Headline: "Microsoft warns its Digital Crimes Unit will keep bringing cases"; add a Contradiction line that The Record and heise read the statement differently.'
    class: factual-error
  - where: summary / body paragraph 1
    claim: Microsoft's Digital Crimes Unit issued a formal public statement on 28–29 May 2026
    defect: Wrong date and issuer. The statement is a Microsoft Security Response Center blog post dated 2026-05-27 (a Wednesday), with the Digital Crimes Unit named in one sentence; The Record and heise
      reported it on 2026-05-29.
    ground_truth: 'MSRC blog "A shared responsibility: Protecting customers through Coordinated Vulnerability Disclosure", date 2026-05-27. The Record 2026-05-29: "In a blogpost on Wednesday, Microsoft
      said".'
    ground_truth_url: https://www.microsoft.com/en-us/msrc/blog/2026/05/a-shared-responsibility-protecting-customers-through-coordinated-vulnerability-disclosure
    fix: Write "Microsoft (MSRC) published a statement on 27 May 2026, reported by The Record on 29 May".
    class: factual-error
  - where: body paragraph 1
    claim: responded by threatening a new vulnerability release on 14 July 2026 (the next Patch Tuesday)
    defect: 14 July is the Patch Tuesday after next (the next one after 29 May was 9 June 2026), and The Record gives no causal link between Microsoft's statement and the threat.
    ground_truth: 'The Record: "The researcher threatened a further release on July 14 — the date scheduled for Microsoft''s Patch Tuesday". BleepingComputer 2026-06-10: Microsoft fixed the flaws "On Tuesday
      ... as part of its June 2026 Patch Tuesday updates" (9 June).'
    ground_truth_url: https://therecord.media/microsoft-calls-zero-day-releases-never-justifiable-as-researcher-threatens-more
    fix: Drop "responded" and "the next"; write "threatened a further release on 14 July 2026, the July Patch Tuesday".
    class: factual-error
  - where: body paragraph 3
    claim: 'Next Patch Tuesday: 10 June 2026.'
    defect: June 2026 Patch Tuesday was 9 June 2026 (second Tuesday), not 10 June.
    ground_truth: 'BleepingComputer 2026-06-10: "On Tuesday, Microsoft fixed the GreenPlasma, MiniPlasma, and YellowKey security vulnerabilities as part of its June 2026 Patch Tuesday updates"; MSRC revisions
      dated 2026-06-09.'
    ground_truth_url: https://www.bleepingcomputer.com/news/microsoft/microsoft-patches-yellowkey-greenplasma-miniplasma-zero-days/
    fix: Change to 9 June 2026, or drop the sentence now that the date has passed.
    class: factual-error
  - where: cves[CVE-2026-45585]
    claim: 'cvss: n/a; type: lpe; vector: local; auth: post-auth; status: [poc-public, no-patch]'
    defect: CVE-2026-45585 is YellowKey, a BitLocker security feature bypass by physical attack with CVSS 6.8 and PR:N, not a local privilege escalation; the body itself calls it a "BitLocker bypass ...
      requiring physical access". It has also been patched since 2026-06-09, so no-patch is false.
    ground_truth: 'MSRC: "Windows BitLocker Security Feature Bypass Vulnerability", CVSS:3.1/AV:P/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H, "bypass a security feature with a physical attack"; revision 2 (2026-06-09):
      "Added links to June 2026 Windows security updates".'
    ground_truth_url: https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-45585
    fix: 'Correct the record (security feature bypass, physical, 6.8, pre-auth, patched) or drop the cves[] record: the entry is about Microsoft''s disclosure statement, and YellowKey has its own entry.'
    class: factual-error
  - where: title / cves[].status / body paragraph 2
    claim: GreenPlasma and MiniPlasma (cldflt.sys SYSTEM escalation) remain unpatched ; YellowKey ..., GreenPlasma (LPE class), and MiniPlasma remain unpatched as of 30 May 2026
    defect: 'Undated in the title and in cves[].status, and false today: Microsoft fixed all three on 2026-06-09. The body sentence is true only as of 30 May 2026 and the entry carries no update.'
    ground_truth: 'YellowKey = CVE-2026-45585 (KB5094125 Server 2025 10.0.26100.32995; KB5094126 Windows 11 24H2 10.0.26100.8655 / 25H2 10.0.26200.8655; KB5095051 26H1 10.0.28000.2269). GreenPlasma = CVE-2026-45586,
      CTFMON EoP, CWE-59, CVSS 7.8, released 2026-06-09 (e.g. Server 2022 10.0.20348.5256 KB5094128). MiniPlasma = addressed by the 2026-06-09 re-release of CVE-2020-17103: "To comprehensively address the
      vulnerability identified by CVE-2020-17103 and recently publicly referred to as "Mini-Plasma" Microsoft recommends installing the June 2026 updates". None of the three is in CISA KEV.'
    ground_truth_url: https://www.bleepingcomputer.com/news/microsoft/microsoft-patches-yellowkey-greenplasma-miniplasma-zero-days/
    fix: Record the 2026-06-09 fixes through a changelog record and remove "remain unpatched" from the title and status.
    class: factual-error
  - where: headline
    claim: GreenPlasma and MiniPlasma (cldflt.sys SYSTEM escalation)
    defect: cldflt.sys is the MiniPlasma component only; GreenPlasma is a CTFMON flaw. The cited heise article conflates them ("both tracing back to CVE-2020-17103").
    ground_truth: 'BleepingComputer: GreenPlasma is a "Windows CTFMON Arbitrary Section Creation Elevation of Privileges Vulnerability"; MiniPlasma "impacts the ''cldflt.sys'' Cloud Filter driver". MSRC
      CVE-2026-45586: "Windows Collaborative Translation Framework (CTFMON) Elevation of Privilege".'
    ground_truth_url: https://www.bleepingcomputer.com/news/microsoft/new-windows-miniplasma-zero-day-exploit-gives-system-access-poc-released/
    fix: Tie cldflt.sys to MiniPlasma only.
    class: imprecision
  - where: body paragraph 2
    claim: the root cause is assessed as an incomplete remediation of CVE-2020-17103 (no CVE yet assigned to MiniPlasma itself)
    defect: 'Uncited and unattributed: the incomplete-fix claim is the researcher''s (BleepingComputer 2026-05-17), later confirmed in effect by Microsoft''s re-release of CVE-2020-17103; "assessed" hides
      who assessed it.'
    ground_truth: 'BleepingComputer 2026-05-17: Chaotic Eclipse says "the exact same issue that was reported to Microsoft by Google project zero is actually still present, unpatched". MSRC CVE-2020-17103
      revision 2 (2026-06-09): "This CVE has been re-released to comprehensively address the vulnerability identified by CVE-2020-17103".'
    ground_truth_url: https://www.bleepingcomputer.com/news/microsoft/new-windows-miniplasma-zero-day-exploit-gives-system-access-poc-released/
    fix: Attribute to the researcher and cite BleepingComputer; add the June 2026 fix.
    class: imprecision
  - where: summary / body / sourcing_note
    claim: 'UPDATE (originally covered 2026-W21) ; migration: update target unresolved (no originally-covered date in v2 body) ; summary ends "(The Record …"'
    defect: Workflow-internal text in reader-facing fields, a reference to a weekly entry that no longer exists, and a summary cut off mid-sentence.
    ground_truth: n/a (entry text)
    ground_truth_url: https://therecord.media/microsoft-calls-zero-day-releases-never-justifiable-as-researcher-threatens-more
    fix: Rewrite in plain prose and complete the summary.
    class: imprecision
  - where: body paragraph 3
    claim: Defenders on Windows 11 estates should monitor for `cldflt.sys`-related anomalies and consider AppLocker/WDAC policies blocking unsigned executables from low-privileged user sessions while patches
      are pending.
    defect: Uncited; the only detection guidance in the sources is ThreatLocker's registry-key monitoring (BleepingComputer 2026-05-17 update), and the advice is now moot because MiniPlasma was fixed on
      2026-06-09.
    ground_truth: 'BleepingComputer: ThreatLocker "organizations should monitor the following Registry keys for modifications using their EDR platform to detect exploitation".'
    ground_truth_url: https://www.bleepingcomputer.com/news/microsoft/new-windows-miniplasma-zero-day-exploit-gives-system-access-poc-released/
    fix: Cite the source detection guidance or drop the sentence when the entry is brought to the current state.
    class: imprecision
  - where: frontmatter
    claim: 'classification absent; techniques absent; affected_products absent; sectors: []'
    defect: No Admiralty rating, no ATT&CK mapping and no affected products although the body names Windows 11 and its components.
    ground_truth: n/a (frontmatter)
    ground_truth_url: https://therecord.media/microsoft-calls-zero-day-releases-never-justifiable-as-researcher-threatens-more
    fix: 'Add classification (multi-source: The Record, heise, MSRC) and the structured fields.'
    class: imprecision
- entry: 2026-05-25/ghost-cms-cve-2026-26980-clickfix-the-cms-compromise-to-endp
  verdict: imprecision
  defects:
  - where: body, Exposure line
    claim: '**Exposure:** self-hosted Ghost from 3.24.0 to 6.19.0'
    defect: The cited advisory gives the range without any hosted or self-hosted distinction; no cited source says Ghost(Pro) was unaffected or patched server-side, so "self-hosted" is an uncited qualifier
      on the exposure.
    ground_truth: 'Ghost advisory: "This vulnerability is present in Ghost v3.24.0 to v6.19.0." BleepingComputer: "many sites failed to install the security update."'
    ground_truth_url: https://github.com/TryGhost/Ghost/security/advisories/GHSA-w52v-v783-gw97
    fix: Write "Ghost from 3.24.0 to 6.19.0" and say how to tell (the running Ghost version), without "self-hosted" unless a Ghost statement is found.
    class: imprecision
  - where: summary
    claim: XLab counts more than 700 sites whose Admin API keys were stolen and whose posts were injected
    defect: XLab counts more than 700 poisoned victim domains (confirmed in its 2026-05-17 enumeration); the Admin API key theft is described for the observed chain, and XLab does not say how the second
      actor it found gained access, so "whose Admin API keys were stolen" is not XLab's count. The body's "more than 700 by its report of 2026-05-21" is true but the as-of date of the figure is 2026-05-17.
    ground_truth: 'XLab: "we have cumulatively identified more than 700 poisoned victim domains"; timeline: "2026-05-17: Second Round of Compromised Site Enumeration Completed: 700+ victim domains confirmed".'
    ground_truth_url: https://blog.xlab.qianxin.com/ghost-cms-mass-compromised-via-cve-2026-26980-now-fueling-clickfix-attacks/
    fix: Say "more than 700 poisoned domains, per XLab's 2026-05-17 enumeration".
    class: imprecision
  - where: updates[0].summary (2026-10-11 correction)
    claim: the file name, the 2024 ClickFix history, the region and sector, the Ghost(Pro) statement and the self-quoted evidence had no source
    defect: 'Five of the six items are right (checked: no source for the 2024 history, region, sector or Ghost(Pro)), but the file name did have a source: BleepingComputer and XLab both name the Electron
      payload; it was removed under the no-file-name-indicator rule, not for lack of a source (low confidence on which file name the record means).'
    ground_truth: 'BleepingComputer: "an Electron-based malware sample named UtilifySetup.exe"; XLab: "UtilifySetup.exe is an installation file packaged with Inno Setup".'
    ground_truth_url: https://www.bleepingcomputer.com/news/security/ghost-cms-sql-injection-flaw-exploited-in-large-scale-clickfix-campaign/
    fix: Say the file name was removed because the store carries no file-name indicators.
    class: imprecision
  - where: cves[CVE-2026-26980].cvss
    claim: 'cvss: "9.4"'
    defect: Correct per the vendor advisory (GitHub CNA, CVSS 3.1 AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:L); the scorer is not named and NVD's own score differs (7.5), which a machine consumer comparing against
      NVD will see.
    ground_truth: 'Ghost advisory page: "Critical 9.4 CVSS overall score"; NVD API: security-advisories@github.com 9.4 (C:H/I:H/A:L), nvd@nist.gov 7.5 (CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N).'
    ground_truth_url: https://github.com/TryGhost/Ghost/security/advisories/GHSA-w52v-v783-gw97
    fix: Note the scorer ("9.4 per the vendor/GitHub CNA; NVD 7.5").
    class: imprecision
- entry: 2026-05-25/large-scale-clickfix-campaign-mass-compromises-self-hosted-g
  verdict: factual-error
  defects:
  - where: body, "Why it matters to us"
    claim: self-hosted Ghost is used across EU/CH universities, NGOs and independent media — exactly the named victim profile
    defect: No cited source says Ghost is used across EU or Swiss institutions, and the "named victim profile" (Harvard, Oxford, Auburn, DuckDuckGo) is not EU/CH; XLab's victim table is 48.1% personal blogs,
      14.8% software/SaaS blogs, 2.7% education, 2.1% nonprofit.
    ground_truth: 'XLab victim table rows: Personal Blog / Independent Site 368 (48.1%); Education / Academia 21 (2.7%); Nonprofit / Religion / Community 16 (2.1%); no country or region analysis in XLab
      or BleepingComputer.'
    ground_truth_url: https://blog.xlab.qianxin.com/ghost-cms-mass-compromised-via-cve-2026-26980-now-fueling-clickfix-attacks/
    fix: Delete the EU/CH usage claim; if a nexus is wanted, say the victim mix is mostly personal and software blogs and cite the table.
    class: factual-error
  - where: body, "Why it matters to us"
    claim: while *every visitor* to a compromised site is a ClickFix target
    defect: 'Contradicted by the cloaking mechanism: only visitors who pass the fingerprinting see the lure; researchers and crawlers see a harmless page.'
    ground_truth: 'XLab: "real victims will receive the malicious payload, while security researchers or crawlers will only see a harmless "safe page""; BleepingComputer: "Visitors passing the verification
      are served a fake Cloudflare prompt".'
    ground_truth_url: https://blog.xlab.qianxin.com/ghost-cms-mass-compromised-via-cve-2026-26980-now-fueling-clickfix-attacks/
    fix: Say "visitors who pass the cloaking script's fingerprinting".
    class: factual-error
  - where: body, "Why it matters to us"
