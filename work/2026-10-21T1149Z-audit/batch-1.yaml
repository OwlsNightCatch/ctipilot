  legacy_duty: false
  legacy_queue_now: reviewed
  em_dashes_in_reader_text: []
  verdict_blocks:
  - entry_as_read: 2026-05-08/amazon-ses-weaponised-for-authenticated-phishing-and-bec-kas
    current_entry: 2026-05-08/amazon-ses-weaponised-for-authenticated-phishing-and-bec-kas
    folded: false
    truth_pass: 2026-10-18T1307Z-audit/truth-L
    verdict: factual-error
    defects:
    - where: sources[0].url
      claim: https://securelist.com/amazon-ses-bec-campaign-2026/
      defect: The sole cited source URL does not exist (Securelist 'Page not found'); it was invented. The real Kaspersky report is at a different
        URL.
      ground_truth: 'Fetching the cited URL returns ''Title: Page not found | Securelist''. The actual report is ''Phishing campaigns and BEC
        attacks through Amazon SES'' by Roman Dedenok, dated 2026-05-04.'
      ground_truth_url: https://securelist.com/amazon-ses-phishing-and-bec-attacks/119623/
      fix: Replace the source URL with https://securelist.com/amazon-ses-phishing-and-bec-attacks/119623/ (publisher 'Kaspersky Securelist', 2026-05-04);
        optionally add BleepingComputer https://www.bleepingcomputer.com/news/security/researchers-report-amazon-ses-abused-in-phishing-to-evade-detection/
        (2026-05-04) as corroboration.
      class: factual-error
    - where: body, sentence 5
      claim: Kaspersky observed targeting of finance departments at European manufacturing firms.
      defect: No source names a European or manufacturing victim set; the sector and region of the targets are not stated anywhere. Invented specificity.
      ground_truth: 'Securelist: BEC email ''was sent as if from that employee to the company''s finance department, requesting urgent payment'';
        Kaspersky press release: ''often sent to finance departments''. Neither names manufacturing or Europe.'
      ground_truth_url: https://securelist.com/amazon-ses-phishing-and-bec-attacks/119623/
      fix: Delete the sentence (or replace with 'BEC lures were addressed to the target organisation's finance department').
      class: factual-error
    - where: body, sentence 2
      claim: SPF and DKIM authentication passes and messages evade most email security gateway filters based on sender reputation.
      defect: 'Imprecise: source says SPF, DKIM and DMARC pass and the sending IP is unlikely to be on reputation blocklists; ''evade most email
        security gateway filters'' is not stated.'
      ground_truth: These emails utilize SPF, DKIM, and DMARC authentication protocols, passing all standard provider checks ... Because this
        is legitimate infrastructure, the sender's IP address won't end up on reputation-based blocklists.
      ground_truth_url: https://securelist.com/amazon-ses-phishing-and-bec-attacks/119623/
      fix: 'Say: messages pass SPF, DKIM and DMARC and come from IP addresses unlikely to be blocklisted; blocking SES IPs would block all SES
        mail.'
      class: imprecision
    - where: body, sentence 3
      claim: Attackers obtain SES API credentials from publicly exposed AWS configuration files (S3 bucket misconfigurations, leaked GitHub repositories).
      defect: 'Imprecise: what leaks is AWS IAM access keys (not ''SES API credentials''), found in GitHub repos, ENV files, Docker images, config
        backups and public S3 buckets, harvested with TruffleHog-based bots.'
      ground_truth: attackers gain access to Amazon SES through leaked IAM (AWS Identity and Access Management) access keys ... public GitHub
        repositories, ENV files, Docker images, configuration backups, or even in publicly accessible S3 buckets ... automated bots based on the
        open-source utility TruffleHog
      ground_truth_url: https://securelist.com/amazon-ses-phishing-and-bec-attacks/119623/
      fix: Replace 'SES API credentials' with 'leaked AWS IAM access keys' and list the source's exposure locations.
      class: imprecision
    - where: body, sentence 6
      claim: This report is approximately 96 hours old at publication; first coverage in this brief series.
      defect: Pipeline narration in reader-facing text ('brief series') and a staleness note, not a fact about the threat; headline also carries
        '~96 h' as a title element.
      ground_truth: Securelist article dated 2026-05-04; BleepingComputer 2026-05-04; Kaspersky press release 2026-05-11.
      ground_truth_url: https://securelist.com/amazon-ses-phishing-and-bec-attacks/119623/
      fix: Drop the sentence and the '~96 h' headline tail; set event_date to 2026-05-04.
      class: imprecision
