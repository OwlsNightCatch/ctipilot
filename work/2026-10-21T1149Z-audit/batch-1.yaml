- entry: 2026-05-08/cert-fr-certfr-2026-act-016-agentic-ai-tools-introduce-promp
  rows:
  - W1-D
  last_record:
  - - '2026-10-11T14:16:35Z'
    - 2026-10-11T1307Z-audit
    - correction
  legacy_duty: false
  legacy_queue_now: reviewed
  em_dashes_in_reader_text: []
  verdict_blocks:
  - entry_as_read: 2026-05-08/cert-fr-certfr-2026-act-016-agentic-ai-tools-introduce-promp
    current_entry: 2026-05-08/cert-fr-certfr-2026-act-016-agentic-ai-tools-introduce-promp
    folded: false
    truth_pass: 2026-10-18T1307Z-audit/truth-L
    verdict: factual-error
    defects:
    - where: summary and body sentence 1
      claim: deploying agentic AI orchestration platforms (LLM-driven workflows with tool-calling, MCP server integration, or autonomous execution
        capabilities) introduces novel attack vectors
      defect: 'Misstates the advisory''s scope: it concerns autonomous personal AI assistants (OpenClaw, Claude Cowork, open-source equivalents)
        on user workstations and mobiles, not orchestration platforms or MCP integrations; the word MCP does not occur in the advisory.'
      ground_truth: 'Objet : Vulnérabilités et risques des produits d''automatisation par IA agentique sur les postes de travail ... les assistants
        personnels autonomes de type OpenClaw, Claude Cowork et d''autres solutions en sources ouvertes connaissent une adoption particulièrement
        soutenue.'
      ground_truth_url: https://www.cert.ssi.gouv.fr/actualite/CERTFR-2026-ACT-016/
      fix: 'Rewrite: CERT-FR bulletin of 2026-04-13 on agentic AI desktop-automation products (autonomous personal assistants such as OpenClaw
        and Claude Cowork) on workstations.'
      class: factual-error
    - where: body sentence 2
      claim: 'The advisory identifies three risk classes: prompt-injection via processed documents or websites ...; MCP server supply-chain compromise
        (a malicious or compromised Model Context Protocol server can issue instructions to all connected agents); and insufficient sandboxing
        of agent execution environments'
      defect: 'The three classes and the MCP supply-chain mechanism are not in the advisory. Its Risques list is: workstation compromise via vulnerabilities
        in these (mostly beta) tools; sensitive-data leakage to uncontrolled external resources; excessive access rights across the user''s office
        applications; sharing of login secrets with agents and their leakage; loss of control and destructive actions. Prompt injection is mentioned
        only as an example vector (''injections de prompt ou des détournements de messages''); plugins loaded dynamically and run as trusted code
        with the application''s privileges are the supply-chain point.'
      ground_truth: des greffons (plugins) peuvent être chargés dynamiquement et selon le modèle d'intégration, exécutés comme du code de confiance,
        avec les mêmes privilèges que ceux de l'application.
      ground_truth_url: https://www.cert.ssi.gouv.fr/actualite/CERTFR-2026-ACT-016/
      fix: Replace with the advisory's actual five risks and the plugin/extension supply-chain point; delete the MCP sentence.
      class: factual-error
    - where: body sentence 3
      claim: CERT-FR recommends input/output guardrails, strict allowlisting of permitted tool calls, human-in-the-loop gates for high-impact
        actions, and treating all AI agent outputs as untrusted until validated.
      defect: 'Misses the advisory''s headline recommendation and invents others: CERT-FR says such assistants must not be deployed on workstations
        and their use must be prohibited until the product is stabilised; limit to isolated test sandboxes with no sensitive data; hardening is
        the main lever. Guardrail prompts are said to be bypassable; there is no ''outputs untrusted'' or tool-call allowlist statement (the allowlists
        concern communication channels / interlocutors).'
      ground_truth: les assistants personnels autonomes tels qu'OpenClaw ne doivent pas être déployés sur des postes de travail et leur usage
        doit être proscrit, tant que le produit n'est pas stabilisé et éprouvé du point de vue de la sécurité.
      ground_truth_url: https://www.cert.ssi.gouv.fr/actualite/CERTFR-2026-ACT-016/
      fix: State the prohibition on workstation deployment, test-only sandbox use without sensitive data, mandatory human validation for system
        commands or side-effect actions, process isolation, channel/interlocutor allowlists with explicit @mention activation.
      class: factual-error
    - where: body sentence 4
      claim: Relevant for organisations deploying Claude Agents, Microsoft Copilot Studio, AutoGen, or similar agentic frameworks for workflow
        automation.
      defect: Only OpenClaw and Claude Cowork are named; Copilot Studio and AutoGen are not mentioned, and the scope is desktop personal assistants,
        not workflow-automation frameworks.
      ground_truth: assistants personnels autonomes de type OpenClaw, Claude Cowork et d'autres solutions en sources ouvertes
      ground_truth_url: https://www.cert.ssi.gouv.fr/actualite/CERTFR-2026-ACT-016/
      fix: Name OpenClaw and Claude Cowork as the advisory does; drop Copilot Studio and AutoGen.
      class: factual-error
    - where: event_date / frontmatter
      claim: 'event_date: null; entities campaign:certfr-2026-act-016'
      defect: The bulletin carries initial and only version date 13 avril 2026 (about 25 days before the entry); it is a guidance bulletin, not
        a campaign, so a campaign entity key is a mis-typing.
      ground_truth: Date de la dernière version 13 avril 2026 / Version initiale
      ground_truth_url: https://www.cert.ssi.gouv.fr/actualite/CERTFR-2026-ACT-016/
      fix: 'Set event_date 2026-04-13; drop the campaign: entity (keep report:).'
      class: imprecision
  groups: []
- entry: 2026-05-08/glpi-certfr-2026-avi-0551-seven-cves-including-ssrf-and-xss
  rows:
  - W1-D
  last_record:
  - - '2026-10-11T14:17:26Z'
    - 2026-10-11T1307Z-audit
    - correction
  legacy_duty: false
  legacy_queue_now: reviewed
  em_dashes_in_reader_text: []
  verdict_blocks:
  - entry_as_read: 2026-05-08/glpi-certfr-2026-avi-0551-seven-cves-including-ssrf-and-xss
    current_entry: 2026-05-08/glpi-certfr-2026-avi-0551-seven-cves-including-ssrf-and-xss
    folded: false
    truth_pass: 2026-10-18T1307Z-audit/truth-L
    verdict: factual-error
    defects:
    - where: body sentence 2 (type per CVE)
      claim: SSRF (CVE-2026-32312), stored and reflected XSS (CVE-2026-42317, CVE-2026-42318, CVE-2026-42320, CVE-2026-42321), security policy
        bypass (CVE-2026-5385), and data integrity compromise (CVE-2026-40108)
      defect: 'The CERT-FR advisory lists risk classes only and never pairs them to CVE ids; the pairing is positional invention and wrong for
        six of seven ids. Per-CVE authority (GLPI GHSAs and release notes): 32312 unauthorized export of form structure; 40108 stored XSS in ITIL
        costs; 42317 arbitrary file deletion by a technician; 42318 arbitrary item deletion via planning; 42320 arbitrary file read inside GLPI_DOC_DIR;
        42321 stored XSS in asset locks; 5385 stored XSS in the knowledge base. The SSRF is a separate low-severity issue (Unauthorized Webhook
        CRA Validation SSRF) with no CVE in the release notes.'
      ground_truth: '[SECURITY - Medium] Unauthorized export of form structure (CVE-2026-32312) / [SECURITY - Medium] Arbitrary files access (CVE-2026-42320)
        / [SECURITY - High] Stored XSS in knowledge base (CVE-2026-5385) / Stored XSS in ITIL Costs (CVE-2026-40108) / Arbitrary item deletion
        via planning (CVE-2026-42318) / Arbitrary files deletion by technician (CVE-2026-42317)'
      ground_truth_url: https://github.com/glpi-project/glpi/releases/tag/11.0.7
      fix: Rewrite the type list per id as in ground truth; say CERT-FR names SSRF, XSS, integrity and policy-bypass risks collectively and none
        of the seven ids is the SSRF.
      class: factual-error
    - where: cves[] vector field
      claim: 'vector: user-interaction (all seven records)'
      defect: Only the three stored-XSS flaws (40108, 42321, 5385) need user interaction (CVSS 4.0 UI:A). 32312, 42317, 42318, 42320 are UI:N,
        authenticated (PR:H) logic/authorisation flaws.
      ground_truth: CVE-2026-42317 CVSS:4.0/AV:N/AC:L/AT:N/PR:H/UI:N/VC:N/VI:H/VA:H ... 7.0; CVE-2026-42318 ... PR:H/UI:N ... 7.0; CVE-2026-42320
        ... PR:H/UI:N/VC:H ... 5.9; CVE-2026-32312 ... PR:H/UI:N/VC:L ... 5.1
      ground_truth_url: https://github.com/glpi-project/glpi/security/advisories/GHSA-jf72-cvjh-px5w
      fix: Set vector to network/authenticated-technician (no user interaction) for 32312, 42317, 42318, 42320; keep user-interaction for the
        XSS ids.
      class: factual-error
    - where: cves[] cvss / affected / fixed
      claim: 'cvss: n/a; affected: null; fixed: null (all seven)'
      defect: Per-CVE authorities publish CVSS 4.0 scores and branch-specific ranges; 'n/a' and null drop them. Notably 40108, 5385 and 32312
        affect only 11.x (fixed 11.0.7) and 42321 only 10.x from 10.0.4 (fixed 10.0.25), while 42317, 42318, 42320 affect both branches.
      ground_truth: 'Scores: 32312 5.1, 40108 7.1, 42317 7.0, 42318 7.0, 42320 5.9, 42321 8.4, 5385 8.4 (CVSS 4.0). Ranges per GHSA ''vulnerable_version_range''
        / ''patched_versions''.'
      ground_truth_url: https://api.github.com/repos/glpi-project/glpi/security-advisories?per_page=100
      fix: Populate cvss (v4.0 base), affected and fixed per CVE from the GHSAs; note GHSA-2fg5 limits 5385 to 11.x while the 10.0.25 release
        notes also list it.
      class: imprecision
    - where: summary
      claim: the open-source IT Service Management platform widely deployed in European public-sector organisations and healthcare networks
      defect: No cited source states GLPI's deployment base or sectors.
      ground_truth: 'CERT-FR advisory only says ''Multiples vulnérabilités dans GLPI''; affected: GLPI versions antérieures à 10.0.25 and 11.0.7.'
      ground_truth_url: https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-0551/
      fix: Delete the deployment claim or source it.
      class: imprecision
    - where: body sentence 6
      claim: Swiss federal and cantonal administrations and hospitals using GLPI as their ITSM are advised to schedule patching within the standard
        change window.
      defect: Uncited advice attributed to no one; no source mentions Swiss users. All seven flaws need an authenticated account (technician /
        forms-read) per GHSAs, which supports a normal-cycle judgement but not the sentence as written.
      ground_truth: 'GHSA impacts: ''A technician can delete arbitrary files ...'', ''An authenticated user with forms READ permission can export
        the structure of unauthorized forms.'''
      ground_truth_url: https://github.com/glpi-project/glpi/security/advisories/GHSA-cg63-qchq-q626
      fix: Restate as the entry's own judgement and tie it to the authenticated-user precondition, or drop.
      class: imprecision
  groups: []
- entry: 2026-05-08/kaspersky-q1-2026-exploits-and-vulnerabilities-report-docume
  rows:
