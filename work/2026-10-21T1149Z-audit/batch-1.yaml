  legacy_duty: false
  legacy_queue_now: reviewed
  em_dashes_in_reader_text: []
  verdict_blocks:
  - entry_as_read: 2026-05-08/kaspersky-q1-2026-exploits-and-vulnerabilities-report-docume
    current_entry: 2026-05-08/kaspersky-q1-2026-exploits-and-vulnerabilities-report-docume
    folded: false
    truth_pass: 2026-10-18T1307Z-audit/truth-L
    verdict: factual-error
    defects:
    - where: sources[0].url
      claim: https://securelist.com/exploits-vulnerabilities-q1-2026/
      defect: The sole source URL is invented (Securelist 'Page not found'). The real report is 'The vulnerability landscape in Q1 2026' by Alexander
        Kolesnikov, 2026-05-07.
      ground_truth: 'Fetch of the cited URL returns ''Title: Page not found | Securelist''.'
      ground_truth_url: https://securelist.com/vulnerabilities-and-exploits-in-q1-2026/119733/
      fix: Replace with https://securelist.com/vulnerabilities-and-exploits-in-q1-2026/119733/ and retitle the entry to the report's real title.
      class: factual-error
    - where: headline / summary / body sentence 1
      claim: document-based exploits resurge ... marked resurgence in document-based exploit delivery, with Microsoft Office and PDF readers accounting
        for the largest share of initial-access exploit deployments
      defect: Not in the report. It says exploit kits expanded with new Office, Windows and Linux exploits, but for Linux 'we observed a decrease
        in the number of detected exploits'; veteran Equation Editor / Office / WinRAR-type CVEs hold the largest detection share; PDF readers
        are not mentioned.
      ground_truth: In the first quarter of 2026, we observed a decrease in the number of detected exploits; however, the detection rates are
        on the rise relative to the same period last year.
      ground_truth_url: https://securelist.com/vulnerabilities-and-exploits-in-q1-2026/119733/
      fix: Rewrite the headline and summary from the report's actual findings (see verified_core).
      class: factual-error
    - where: body sentence 2
      claim: The most exploited CVE class involved Office Protected View bypass chains (multiple CVEs published in January 2026 Patch Tuesday).
      defect: 'Contradicted: the report calls the long-standing CVEs (CVE-2018-0802, CVE-2017-11882, CVE-2017-0199, CVE-2023-38831, CVE-2025-6218,
        CVE-2025-8088) the ones that ''consistently account for the largest share of detections''; the Protected View bypasses (CVE-2026-21509,
        CVE-2026-21514) are ''newcomers'' chained with MSHTML CVE-2026-21513. The ''January 2026 Patch Tuesday'' provenance is not stated.'
      ground_truth: 'we first examine the list of veteran vulnerabilities that consistently account for the largest share of detections: CVE-2018-0802
        ... CVE-2017-11882 ...'
      ground_truth_url: https://securelist.com/vulnerabilities-and-exploits-in-q1-2026/119733/
      fix: State the veteran-CVE list as the largest share and the 21509/21514/21513 chain as new.
      class: factual-error
    - where: body sentences 3-5
      claim: Browser exploitation via V8 memory corruption grew 34% quarter-on-quarter. ... ransomware-as-a-service operators are increasingly
        acquiring zero-day exploits directly from private brokers ... The report includes Excel macro delivery via cloud storage abuse as an emerging
        initial-access technique.
      defect: None of the three statements (the 34% V8 figure, RaaS buying zero-days from brokers, Excel macro delivery via cloud storage abuse)
        appears in the report.
      ground_truth: 'Report sections: registered-vulnerability statistics, exploitation statistics (Windows and Linux), published exploits, vulnerability
        exploitation in APT attacks, C2 frameworks, notable vulnerabilities, conclusion.'
      ground_truth_url: https://securelist.com/vulnerabilities-and-exploits-in-q1-2026/119733/
      fix: Delete all three; replace with the report's C2 framework ranking and notable vulnerabilities.
      class: factual-error
  groups: []
- entry: 2026-05-08/muddywater-iran-mois-deploys-chaos-ransomware-as-false-flag
  rows:
  - W1-D
  last_record:
  - - '2026-10-11T14:21:21Z'
    - 2026-10-11T1307Z-audit
    - correction
  legacy_duty: false
  legacy_queue_now: reviewed
  em_dashes_in_reader_text: []
  verdict_blocks:
  - entry_as_read: 2026-05-08/muddywater-iran-mois-deploys-chaos-ransomware-as-false-flag
    current_entry: 2026-05-08/muddywater-iran-mois-deploys-chaos-ransomware-as-false-flag
    folded: false
    truth_pass: 2026-10-18T1307Z-audit/truth-L
    verdict: factual-error
    defects:
    - where: sources[0] (url and publisher) and body last sentence
      claim: https://www.deepinstinct.com/blog/muddywater-2026 ; 'Deep Instinct Threat Intelligence — MuddyWater 2026 Campaign' ; 'This is a single-source
        threat-intelligence vendor disclosure.'
      defect: 'The cited Deep Instinct URL is a 404 (''Page Not Found | Deep Instinct''); the research is Rapid7''s ''Muddying the Tracks: The
        State-Sponsored Shadow Behind Chaos Ransomware'' (Alexandra Blia, Ivan Feigl; 2026-05-06), covered the same day by The Hacker News and
        later by SC World and Cybersecurity Dive. Publisher, URL and the single-source claim are wrong.'
      ground_truth: 'Rapid7: ''In early 2026, a sophisticated intrusion initially appearing to be a standard Chaos ransomware attack was assessed
        to be consistent with a targeted state-sponsored operation.'''
      ground_truth_url: https://www.rapid7.com/blog/post/tr-muddying-tracks-state-sponsored-shadow-behind-chaos-ransomware/
      fix: Set primary source to the Rapid7 post (2026-05-06), add The Hacker News https://thehackernews.com/2026/05/muddywater-uses-microsoft-teams-to.html
        as corroboration, set verification multi-source or keep single-source with the Rapid7 provenance.
      class: factual-error
    - where: headline / body sentence 2
      claim: MuddyWater (Iran/MOIS) deploys Chaos ransomware as false flag ... The campaign deploys Chaos ransomware payloads
      defect: 'Rapid7 reports no encryption at all: the actor used the Chaos RaaS brand, extortion emails and a leak-site posting while ''forgoing
        file encryption in favor of data exfiltration and long-term persistence''. The MuddyWater link is stated ''with moderate confidence'',
        not as fact. The false-flag purposes (complicate attribution, delay triage) are Rapid7 assessments (''may'', ''likely'').'
      ground_truth: Notably, the apparent absence of file encryption, despite the presence of Chaos ransomware artifacts, represents a deviation
        from typical ransomware behavior.
      ground_truth_url: https://www.rapid7.com/blog/post/tr-muddying-tracks-state-sponsored-shadow-behind-chaos-ransomware/
      fix: 'Headline: ''MuddyWater (moderate confidence) ran a Teams social-engineering intrusion under the Chaos ransomware brand without encrypting
        files (Rapid7)''.'
      class: factual-error
    - where: summary / body sentence 1
      claim: targeting government contractors and defence-adjacent organisations in Europe and the Middle East
      defect: Rapid7 describes one intrusion at an unnamed victim; no sector or European/Middle East targeting is stated (the report mentions
        Western and Middle Eastern networks for MuddyWater generally, 'particularly in the US' for prepositioning, and Chaos victims mostly in
        the US).
      ground_truth: MuddyWater is increasingly leveraging the cybercriminal ecosystem to provide plausible deniability for geopolitical espionage
        and prepositioning, particularly in the US.
      ground_truth_url: https://www.rapid7.com/blog/post/tr-muddying-tracks-state-sponsored-shadow-behind-chaos-ransomware/
      fix: Delete the targeting clause; say the victim was a single unnamed organisation.
      class: factual-error
    - where: body sentence 3
      claim: A parallel social-engineering vector uses Microsoft Teams external-access invitations to gain remote-assistance sessions under a
        helpdesk pretext, after which credentials are harvested and used for further access via legitimate cloud services.
      defect: 'The Teams contact is the initial access of the same intrusion, not a parallel vector: one-on-one external Teams chats, interactive
        screen-sharing, credentials typed into local text files, MFA changed to add attacker devices, then compromised accounts used to reach
        internal systems incl. a domain controller over RDP, persistence with DWAgent and AnyDesk, a custom RAT. ''Legitimate cloud services''
        is not stated.'
      ground_truth: The TA achieved initial access through social engineering conducted via Microsoft Teams, where they initiated one-on-one chats
        with users from a controlled account. During these interactions, the TA established screen-sharing sessions
      ground_truth_url: https://www.rapid7.com/blog/post/tr-muddying-tracks-state-sponsored-shadow-behind-chaos-ransomware/
      fix: Describe the single intrusion chain as in verified_core; drop 'parallel' and 'legitimate cloud services'.
      class: factual-error
    - where: body sentence 4 (ATT&CK ids in prose)
      claim: 'Observed ATT&CK techniques: T1566.004 (Spearphishing via Teams), T1649 (Steal or Forge Authentication Certificates), T1486 (Data
        Encrypted for Impact).'
      defect: T1486 is contradicted (no encryption observed); T1649 is unsupported (the signing certificate was used to sign malware, nothing
        in the report steals or forges authentication certificates); T1566.004 is Spearphishing Voice in the pinned v20 dataset, and a Teams chat
        is T1566.003 Spearphishing via Service. Also a bare id list in prose with no techniques[] in frontmatter.
      ground_truth: forgoing file encryption in favor of data exfiltration and long-term persistence via remote management tools like DWAgent
      ground_truth_url: https://www.rapid7.com/blog/post/tr-muddying-tracks-state-sponsored-shadow-behind-chaos-ransomware/
      fix: Delete the sentence; populate techniques[] from supported_techniques below.
      class: factual-error
  groups: []
