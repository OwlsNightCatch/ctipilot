  em_dashes_in_reader_text: []
  verdict_blocks:
  - entry_as_read: 2026-05-09/enisa-expands-cve-root-four-new-european-organisations-onboa
    current_entry: 2026-05-09/enisa-expands-cve-root-four-new-european-organisations-onboa
    folded: false
    truth_pass: 2026-10-18T1307Z-audit/truth-L
    verdict: factual-error
    defects:
    - where: body sentence 4 and entities[]
      claim: 'This is part of the EU Cyber Resilience Act (CRA) implementation framework: the CRA designates ENISA as the EU-level coordination
        body for harmonised vulnerability reporting, and the CVE Root transfer is the operational mechanism. (entity campaign:eu-cyber-resilience-act)'
      defect: The cited ENISA press release does not mention the CRA. It places the CVE Root role in ENISA's support to the CSIRTs Network (ENISA
        became CVE Root for European entities in November 2025, serving national and EU authorities and CSIRTs Network members) and refers to
        proposed capacity in the Cybersecurity Act 2. Calling the CVE Root transfer the CRA's 'operational mechanism' is the entry's own claim.
      ground_truth: ENISA became a CVE Root for European entities in November 2025. As such, ENISA serves as the central point of contact within
        the CVE Program for national and EU authorities, EU CSIRTs Network members, and cooperative partners under ENISA's mandate.
      ground_truth_url: https://www.enisa.europa.eu/news/new-cve-numbering-authorities-under-enisa-root
      fix: Delete the CRA sentence and the campaign:eu-cyber-resilience-act entity, or cite a CRA source and label it context; keep 'ENISA became
        CVE Root in November 2025'.
      class: factual-error
    - where: body last sentence
      claim: an increasing proportion of EU-discovered CVEs will be assigned and initially coordinated through ENISA-supervised channels, which
        may affect advisory publication timing and format compared to MITRE Root coordination — particularly for products made by EU software
        vendors
      defect: Uncited speculation; the press release says the aim is more consistent, timely and coordinated vulnerability identification across
        Europe, gives no effect on advisory format or vendor-specific impact, and stresses ENISA is 'reinforcing, rather than fragmenting' the
        CVE backbone.
      ground_truth: It also reflects ENISA's wider objective of reinforcing, rather than fragmenting, the shared global vulnerability identifier
        backbone on which governments, vendors, researchers, and defenders rely.
      ground_truth_url: https://www.enisa.europa.eu/news/new-cve-numbering-authorities-under-enisa-root
      fix: Delete the sentence or mark it explicitly as the analyst's judgement.
