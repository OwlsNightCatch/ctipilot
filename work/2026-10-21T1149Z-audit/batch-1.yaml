- entry: 2026-05-09/daemon-tools-lite-supply-chain-quic-rat-deployed-via-signed
  rows:
  - W1-D
  last_record:
  - - '2026-10-11T14:29:53Z'
    - 2026-10-11T1307Z-audit
    - correction
  legacy_duty: false
  legacy_queue_now: reviewed
  em_dashes_in_reader_text: []
  verdict_blocks:
  - entry_as_read: 2026-05-09/daemon-tools-lite-supply-chain-quic-rat-deployed-via-signed
    current_entry: 2026-05-09/daemon-tools-lite-supply-chain-quic-rat-deployed-via-signed
    folded: false
    truth_pass: 2026-10-18T1307Z-audit/truth-L
    verdict: factual-error
    defects:
    - where: title, headline
      claim: QUIC RAT deployed via signed installer; EU governments among targeted victims
      defect: No EU government target is reported. The targeted second-stage payloads reached about a dozen government, scientific, manufacturing
        and retail organisations 'located in Russia, Belarus, and Thailand'; QUIC RAT itself reached one educational institution in Russia. Germany,
        France, Spain and Italy appear only among the top countries of infection attempts, which were mostly home users (about 10% of systems
        were organisations').
      ground_truth: the other backdoor payload, which is more complex, has been observed only on a dozen machines of government, scientific, manufacturing,
        and retail organizations located in Russia, Belarus, and Thailand.
      ground_truth_url: https://securelist.com/daemon-tools-backdoor/119654/
      fix: 'Retitle: ''DAEMON Tools Lite supply-chain compromise: signed trojanized installers since 2026-04-08; targeted payloads limited to
        about a dozen organisations in Russia, Belarus and Thailand''. Drop the EU-government claim, the ''china-nexus'' tag (only Chinese-language
        strings; no attribution) and re-test the priority.'
      class: factual-error
    - where: body sentence 3 (QUIC RAT capabilities)
      claim: QUIC RAT, an advanced implant that injects into notepad.exe and conhost.exe, supports C2 over QUIC (evading proxy inspection), and
        implements shell execution, file management, process injection, keylogging, SOCKS proxy, and TCP tunnelling
      defect: Securelist states only that QUIC RAT is C++, obfuscated with control-flow flattening, statically linked with WolfSSL, embeds msquic.dll,
        supports HTTP, UDP, TCP, WSS, QUIC, DNS and HTTP/3 for C2, and can inject payloads into notepad.exe and conhost.exe; 'analysis is still
        ongoing'. The shell execution, file management, keylogging, SOCKS proxy, tunnelling and proxy-evasion statements are not in any cited
        source (the shell/download/shellcode features belong to the separate minimalistic backdoor).
      ground_truth: This backdoor supports a variety of C2 communication protocols, including HTTP, UDP, TCP, WSS, QUIC, DNS and HTTP/3. While
        its analysis is still ongoing, we have identified that QUIC RAT is able to inject payloads into notepad.exe and conhost.exe processes.
      ground_truth_url: https://securelist.com/daemon-tools-backdoor/119654/
      fix: Replace with the sourced capabilities; attribute shell/file download/shellcode execution to the minimalistic backdoor.
      class: factual-error
    - where: body sentence 5
      claim: Targeted QUIC RAT deployment was limited to approximately a dozen machines in government, scientific, manufacturing, and retail sectors
        — indicating selective activation consistent with intelligence-collection objectives.
      defect: The dozen machines received the minimalistic backdoor; QUIC RAT was seen once, at a Russian educational institution. Kaspersky says
        the intent (cyberespionage or big-game hunting) is unclear, so 'consistent with intelligence-collection objectives' contradicts the source.
      ground_truth: their intent — whether it is cyberespionage or big game hunting — is currently unclear.
      ground_truth_url: https://securelist.com/daemon-tools-backdoor/119654/
      fix: 'Say: minimalistic backdoor on about a dozen organisations in RU/BY/TH; QUIC RAT on one Russian educational institution; intent unclear.'
      class: factual-error
    - where: body ATT&CK coverage line
      claim: T1036.004 Masquerade Task or Service (kworker/ksoftirqd masquerade); T1573.002 Asymmetric Cryptography / QUIC
      defect: No Linux kworker/ksoftirqd masquerade is described anywhere (the implants are Windows); the id list is also a bare prose list. T1573.002
        is not tied to QUIC by any source (WolfSSL and msquic.dll are mentioned, protocol list otherwise).
      ground_truth: This RAT is coded in C++, obfuscated with control flow flattening and statically linked with the WolfSSL library. It also
        includes the body of the legitimate msquic.dll library in its .data section.
      ground_truth_url: https://securelist.com/daemon-tools-backdoor/119654/
      fix: Delete T1036.004 and the masquerade parenthesis; move supported ids to techniques[] (see supported_techniques).
      class: factual-error
    - where: body sentence 6
      claim: The clean release is version 12.6.0.2445 (released 2026-05-06).
      defect: The vendor says version 12.6 was released on May 5 (within 12 hours of notification at about 07:00 GMT on May 5); the vendor's blog
        post is dated 2026-05-06.
      ground_truth: Version 12.6 of DAEMON Tools Lite, which does not contain the suspected compromised files, was released on May 5.
      ground_truth_url: https://blog.daemon-tools.cc/eng/post/security-incident
      fix: Change to 2026-05-05 and cite the vendor post.
      class: imprecision
    - where: Defender takeaway (detection lines)
      claim: outbound QUIC (UDP 443) to non-sanctioned destinations. Sysmon EID 1 with parent-process image path filters for notepad.exe or conhost.exe
        spawning child processes will surface post-injection activity.
      defect: Derived, not sourced. QUIC is one of seven C2 protocols QUIC RAT supports, and the primary observable in every source is the trojanized
        signed installer with a startup beacon (GET to a typosquat of daemon-tools.cc, then PowerShell WebClient download to C:\Windows\Temp).
        Process-creation detection of the PowerShell/cmd child of the DAEMON Tools helper binaries (DTHelper.exe, DiscSoftBusServiceLite.exe,
        DTShellHlp.exe) is the sourced behavior.
      ground_truth: In response to the requests sent, the server may return a shell command to be executed through the cmd.exe process. ... cmd.exe
        /c powershell -NoProfile -Command "$wc=New-Object System.Net.WebClient;$wc.DownloadFile(...)"
      ground_truth_url: https://securelist.com/daemon-tools-backdoor/119654/
      fix: Lead the detection with DAEMON Tools helper binaries spawning cmd.exe/powershell and downloading executables; keep version check; drop
        the notepad/conhost parent-process rule.
      class: imprecision
    - where: summary
      claim: QUIC RAT delivered via signed, legitimate-looking Lite installer since 8 April 2026 ... (Kaspersky Securelist, 2026-05-05 updated
        2026-05-08)
      defect: The trojanized installers have circulated since 8 April; QUIC RAT was delivered once. Kaspersky's blog (2026-05-05) carries an update
        note dated 'March 6' (a typo) about the vendor fix; no 2026-05-08 update is visible. The entry cites Kaspersky's blog while calling it
        Securelist; the technical write-up is the separate Securelist post.
      ground_truth: Securelist 'Popular DAEMON Tools software compromised' (Igor Kuznetsov et al.) and Kaspersky blog 'Supply chain attack via
        DAEMON Tools' dated 2026-05-05.
      ground_truth_url: https://securelist.com/daemon-tools-backdoor/119654/
      fix: Cite the Securelist article as primary and the blog/HNS/The Record as corroboration; fix dates.
      class: imprecision
