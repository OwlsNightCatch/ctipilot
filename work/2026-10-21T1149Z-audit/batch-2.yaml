      is an unsurfaced difference). CVSS 4.0 9.2 (AV:N/AC:H/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H) and CVSS 3.1 8.1 (AV:N/AC:H/...). Trigger (CNA text):
      ''the rewrite directive is followed by a rewrite, if, or set directive and an unnamed PCRE capture (for example, $1, $2) with a replacement
      string that includes a question mark (?)''; root cause per depthfirst: is_args set by ngx_http_script_start_args_code is never reset, the
