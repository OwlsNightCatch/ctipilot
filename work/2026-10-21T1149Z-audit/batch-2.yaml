    folded: true
    truth_pass: 2026-10-18T1307Z-audit/truth-D1
    verdict: factual-error
    defects:
    - where: summary
      claim: prompt-injection-to-RCE in the AI agent orchestration framework that backs Azure AI Foundry, Copilot Studio and many self-hosted
        agents
      defect: No cited source says Semantic Kernel backs Azure AI Foundry or Copilot Studio.
      ground_truth: 'Microsoft blog: "Semantic Kernel is Microsoft''s open-source framework for building AI agents and integrating AI models into
        applications." (no Foundry / Copilot Studio statement anywhere in the post or the GHSAs)'
      ground_truth_url: https://www.microsoft.com/en-us/security/blog/2026/05/07/prompts-become-shells-rce-vulnerabilities-ai-agent-frameworks/
      fix: Drop "that backs Azure AI Foundry, Copilot Studio and many self-hosted agents"; say "Microsoft's open-source AI agent framework".
      class: factual-error
    - where: summary / body paragraph 1
      claim: '`SessionsPythonPlugin.DownloadFileAsync` and `SessionsPythonPlugin.UploadFileAsync` carry a `[KernelFunction]` attribute that should
        not have been applied'
      defect: Only DownloadFileAsync was wrongly exposed as a kernel function; UploadFileAsync is intentionally a kernel function (it received
        path validation, not attribute removal).
      ground_truth: 'Blog: "DownloadFileAsync was accidentally marked with a [KernelFunction] attribute". Fix PR #13478 diff removes `[KernelFunction,
        Description("Downloads a file ...")]` from DownloadFileAsync only; the UploadFileAsync `[KernelFunction, Description("Uploads a file ...")]`
        line is retained; its unit test asserts "Only ExecuteCode, UploadFile, and ListFiles should be exposed".'
      ground_truth_url: https://api.github.com/repos/microsoft/semantic-kernel/pulls/13478/files
      fix: State that the unintended [KernelFunction] was on DownloadFileAsync (host-side file write via localFilePath); upload_file lacked path
        validation (host-file read into the sandbox).
      class: factual-error
    - where: body paragraph 1
      claim: An f-string composes the LINQ-like filter expression directly from an LLM-controlled parameter ... bypasses with the well-known `__class__.__bases__[0].__subclasses__()`
        class-hierarchy traversal pattern ... `os.system`-equivalent execution
      defect: 'Mechanism misdescribed: the filter is a Python lambda string executed via eval(); bypass traversed the type system from tuple()
        to BuiltinImporter and used load_module/system; no f-string, LINQ, or __bases__[0] chain in the source.'
      ground_truth: 'Blog: "The default filter function ... is implemented as a Python lambda expression executed using eval()"; "kwargs[param.name]
        is AI model-controlled and not sanitized"; payload "traversed Python''s class hierarchy to locate BuiltinImporter, and used it to dynamically
        load os and call system()"; blocklist missed __name__, load_module, system, BuiltinImporter.'
      ground_truth_url: https://www.microsoft.com/en-us/security/blog/2026/05/07/prompts-become-shells-rce-vulnerabilities-ai-agent-frameworks/
      fix: 'Rewrite: unsanitised model-controlled parameter interpolated into a lambda filter evaluated with eval(); AST blocklist bypassed via
        class-hierarchy traversal to BuiltinImporter.'
      class: factual-error
    - where: body paragraph 2
      claim: Microsoft characterises both flaws as systemic of agentic-AI patterns that "trust LLM-controlled parameters without explicit validation"
      defect: The quoted phrase is not on the cited page (invented quote); AutoGen is also not named by Microsoft as likely affected.
      ground_truth: 'Blog: "The vulnerability lies in how the framework and tools trust the parsed data."; "frameworks like Semantic Kernel, LangChain,
        and CrewAI ... a single vulnerability in how they map AI model outputs to system tools carries systemic risk." No "without explicit validation"
        string; AutoGen not mentioned.'
      ground_truth_url: https://www.microsoft.com/en-us/security/blog/2026/05/07/prompts-become-shells-rce-vulnerabilities-ai-agent-frameworks/
      fix: Remove the quotation marks or quote the blog sentence verbatim; name only LangChain and CrewAI as the blog does, and label wider spread
        as analyst inference.
      class: factual-error
    - where: cves[] CVE-2026-26030 / CVE-2026-25592 auth
      claim: 'auth: pre-auth; affected: null; fixed: null'
      defect: CVSS vectors of both GHSAs carry PR:L (low privileges required), so "pre-auth" contradicts the authority; affected/fixed left null
        although the GHSAs give them.
      ground_truth: 'GHSA-xjw9-4gw8-4rqx: CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H (9.9), vulnerable "< 1.39.4", first patched 1.39.4; GHSA-2ww3-72rp-wpp4:
        same vector, nuget "< 1.71.0" first patched 1.71.0, pip "< 1.39.3" first patched 1.39.3.'
      ground_truth_url: https://api.github.com/advisories/GHSA-xjw9-4gw8-4rqx
      fix: 'Set affected/fixed per GHSA; drop or qualify auth: pre-auth (attack needs a prompt-injection channel into the agent, not an unauthenticated
        network exploit of the SDK).'
      class: imprecision
    - where: sources[] publisher labels / body citation labels
      claim: GitHub Security Advisory GHSA-xjw9-4gw8-4rqx, 2026-05-07 ; GitHub Security Advisory GHSA-2ww3-72rp-wpp4, 2026-05-07
      defect: The GHSAs were published 2026-02-19 and 2026-02-06; 2026-05-07 is the Microsoft blog date.
      ground_truth: 'API: GHSA-xjw9-4gw8-4rqx published_at 2026-02-19T19:34:14Z (NVD 2026-02-19); GHSA-2ww3-72rp-wpp4 published_at 2026-02-06T18:37:24Z
        (NVD 2026-02-06).'
      ground_truth_url: https://api.github.com/advisories/GHSA-2ww3-72rp-wpp4
      fix: Correct the dates in the sources[] publisher strings and the body link labels; note the CVEs predate the May blog by 2-3 months.
      class: imprecision
    - where: summary / body last sentence
      claim: Full breakdown in § 5. / Full deep dive in § 5.
      defect: Dangling pointer to a section of the migrated brief that does not exist in this entry.
      ground_truth: Entry body has no section 5; the deep dive is a separate entry.
      ground_truth_url: https://www.microsoft.com/en-us/security/blog/2026/05/07/prompts-become-shells-rce-vulnerabilities-ai-agent-frameworks/
      fix: Remove the "§ 5" references.
      class: imprecision
    - where: priority
      claim: 'priority: high'
      defect: No in-the-wild exploitation, not in CISA KEV (catalog 2026.10.16), exploitation needs a prompt-injection vector plus a specific
        default-config component; research disclosure, a high-bar disqualifier.
      ground_truth: Blog frames both as researcher-found, "have since been fixed"; no exploitation statement; neither CVE in KEV.
      ground_truth_url: https://www.microsoft.com/en-us/security/blog/2026/05/07/prompts-become-shells-rce-vulnerabilities-ai-agent-frameworks/
      fix: 'Context only: priority should be notable/routine unless a constituency product exposure is shown.'
      class: imprecision
  - entry_as_read: 2026-05-10/microsoft-semantic-kernel-cve-2026-26030-cve-2026-25592-prom
    current_entry: 2026-05-10/microsoft-semantic-kernel-cve-2026-26030-cve-2026-25592-prom
    folded: false
    truth_pass: 2026-10-18T1307Z-audit/truth-D1
    verdict: factual-error
    defects:
    - where: body "Why this matters"
      claim: Semantic Kernel is the open-source orchestration SDK behind Azure AI Foundry, Copilot Studio, and a growing fraction of self-hosted
        enterprise AI agents in EU government modernisation pilots.
      defect: 'Unsupported: no cited source links Semantic Kernel to Foundry/Copilot Studio or to EU government pilots.'
      ground_truth: 'Blog: "Semantic Kernel is Microsoft''s open-source framework for building AI agents ... With over 27,000 stars on GitHub".'
      ground_truth_url: https://www.microsoft.com/en-us/security/blog/2026/05/07/prompts-become-shells-rce-vulnerabilities-ai-agent-frameworks/
      fix: Delete the Foundry/Copilot Studio/EU-pilot claims.
      class: factual-error
    - where: body CVE-2026-26030 section
      claim: composes its LINQ-like filter expression by f-string interpolation ... The SDK applies a string-blocklist validator ... the validator
        is a denylist on the *literal text*
      defect: Validator is AST-based (parses filter string into an AST, rejects dangerous Name/Attribute nodes, runs eval with empty __builtins__);
        not a literal-text scan; no f-string/LINQ.
      ground_truth: 'Blog: "implemented a validator that parses the filter string into an Abstract Syntax Tree (AST) before execution"; "scans
        every element in the code for dangerous identifiers and attributes (for example, strings like eval, exec, open, __import__ ...)"; "If
        the code passes both checks, it is executed in a restricted environment where Python''s built-in functions ... are deliberately removed."'
      ground_truth_url: https://www.microsoft.com/en-us/security/blog/2026/05/07/prompts-become-shells-rce-vulnerabilities-ai-agent-frameworks/
      fix: Describe it as an AST identifier/attribute blocklist; bypass worked because __name__, load_module, system, BuiltinImporter were not
        blocked and ast.Subscript was unchecked.
      class: factual-error
    - where: body CVE-2026-26030 section
      claim: '"".__class__.__bases__[0].__subclasses__()[<index>]("...") — walking `object`''s subclass list to reach an arbitrary class ... (typically
        `subprocess.Popen` or a `os` reference reached via reflection)'
      defect: 'Not the cited payload: it started from tuple(), located BuiltinImporter and called load_module/system; subprocess.Popen is not
        mentioned.'
      ground_truth: 'Blog: "it started with tuple() ... and crawled through Python''s type system"; "traversed Python''s class hierarchy to locate
        BuiltinImporter, and used it to dynamically load os and call system()".'
      ground_truth_url: https://www.microsoft.com/en-us/security/blog/2026/05/07/prompts-become-shells-rce-vulnerabilities-ai-agent-frameworks/
      fix: Replace the generic idiom and the subprocess.Popen aside with the blog's BuiltinImporter/load_module/system chain, or drop the snippet.
      class: factual-error
    - where: body CVE-2026-26030 prerequisites
      claim: default for self-hosted Semantic Kernel agents until a customer wires in a different vector backend ; indirect prompt injection via
        retrieved documents or tool output is sufficient; a direct user-input vector is not required
      defect: Source states the condition as "Search Plugin backed by In-Memory Vector Store functionality using the default configuration"; the
        "default for self-hosted agents" and indirect-vs-direct statements are uncited.
      ground_truth: 'Blog: "The targeted agent must have the Search Plugin backed by In-Memory Vector Store functionality using the default configuration";
        "The attacker must have a prompt injection vector, allowing influence over the agent''s inputs".'
      ground_truth_url: https://www.microsoft.com/en-us/security/blog/2026/05/07/prompts-become-shells-rce-vulnerabilities-ai-agent-frameworks/
      fix: Use the blog wording; drop the unsupported default-for-self-hosted aside.
      class: factual-error
    - where: body CVE-2026-25592 section
      claim: Two of its methods — `DownloadFileAsync` and `UploadFileAsync` — were mistakenly annotated with `[KernelFunction]`
      defect: Only DownloadFileAsync was mistakenly annotated.
      ground_truth: 'Blog: "DownloadFileAsync was accidentally marked with a [KernelFunction] attribute"; PR #13478 removes [KernelFunction] from
        DownloadFileAsync only (UploadFileAsync keeps it, gains path validation).'
      ground_truth_url: https://api.github.com/repos/microsoft/semantic-kernel/pulls/13478/files
      fix: Say only DownloadFileAsync was mis-annotated.
      class: factual-error
    - where: body CVE-2026-25592 section
      claim: (a) call `UploadFileAsync` to write attacker-chosen bytes to an attacker-chosen path *on the host* ... and (b) call `DownloadFileAsync`
        symmetrically to read host-side files back into the agent context.
      defect: 'Directions are reversed: DownloadFileAsync is the host-side file-write primitive; upload_file is the host-file-read/exfiltration
        primitive into the sandbox.'
      ground_truth: 'Blog: DownloadFileAsync''s "localFilePath parameter, which dictates exactly where File.WriteAllBytes() saves data on the
        host device, was now entirely AI controlled"; "upload_file() ... accepted any local file path without validation, allowing prompt injections
        to exfiltrate sensitive host files ... directly into the sandbox"; chain writes the script to the host Windows Startup folder.'
      ground_truth_url: https://www.microsoft.com/en-us/security/blog/2026/05/07/prompts-become-shells-rce-vulnerabilities-ai-agent-frameworks/
      fix: 'Swap: DownloadFileAsync = arbitrary host file write (Startup-folder code execution on next sign-in); upload_file = arbitrary host
        file read into the sandbox (Python and .NET).'
      class: factual-error
    - where: body hardening
      claim: implement a Function Invocation Filter (the SDK-supported hook documented in the Microsoft research post) ... reduces the Python-side
        blast radius even if the validator is bypassed
      defect: The Function Invocation Filter workaround is documented in GHSA-2ww3-72rp-wpp4 for the .NET flaw, not in the Microsoft post; no
        source offers it as a Python-side mitigation. Python GHSA workaround is "Avoid using InMemoryVectorStore for production scenarios". "patched
        releases also include the upstream test additions" is uncited.
      ground_truth: 'GHSA-xjw9: "Workarounds: Avoid using InMemoryVectorStore for production scenarios."; GHSA-2ww3: "Users can create a Function
        Invocation Filter which checks the arguments being passed to any calls to DownloadFileAsync or UploadFileAsync and ensures the provided
        localFilePath is allow listed."'
      ground_truth_url: https://api.github.com/advisories/GHSA-xjw9-4gw8-4rqx
      fix: Attribute the filter workaround to the .NET GHSA only and add the Python GHSA workaround (avoid InMemoryVectorStore in production);
        drop the Python-blast-radius and test-additions sentences.
      class: factual-error
    - where: cves[] / ATT&CK mapping
      claim: T1565.001 Stored Data Manipulation (write primitive)
      defect: 'The documented write primitive drops a script in the Windows Startup folder for code execution at next sign-in; stored-data manipulation
        for integrity impact is not what the source describes. Also auth: pre-auth contradicts PR:L; affected/fixed null.'
      ground_truth: 'Blog: "writes it directly to the host''s Windows\Start Menu\Programs\Startup folder"; "On the next user sign-in, the script
        runs, granting full host compromise." GHSA vectors PR:L.'
      ground_truth_url: https://www.microsoft.com/en-us/security/blog/2026/05/07/prompts-become-shells-rce-vulnerabilities-ai-agent-frameworks/
      fix: Map to Startup-folder autostart persistence/execution instead of T1565.001; qualify auth; fill affected/fixed.
      class: imprecision
    - where: body (analysis paragraphs)
      claim: EDR vendors classify this under hunt-pack categories ...; Many self-hosted agent deployments do not log plugin-method calls ...;
        The same class of bug is highly likely to exist in LangChain, CrewAI, AutoGen, Haystack, LlamaIndex; Both bypass any of the existing prompt-side
        mitigations ...; The deployment surface inside an EU public-sector tenant ...
      defect: Uncited generalisations stated as fact; the Microsoft post names only LangChain and CrewAI and says prompt-layer guardrail bypass
        needs host-level detection, not that all prompt-side mitigations are bypassed.
      ground_truth: 'Blog: "frameworks like Semantic Kernel, LangChain, and CrewAI"; "If an attacker bypasses the AI model guardrails, traditional
        endpoint defense must be in place".'
      ground_truth_url: https://www.microsoft.com/en-us/security/blog/2026/05/07/prompts-become-shells-rce-vulnerabilities-ai-agent-frameworks/
      fix: Mark as analyst inference or remove.
      class: imprecision
    - where: sources[] publisher labels / header links
      claim: GitHub GHSA ... 2026-05-07
      defect: GHSA publication dates are 2026-02-19 and 2026-02-06 (not 2026-05-07).
      ground_truth: GHSA-xjw9 published_at 2026-02-19T19:34:14Z; GHSA-2ww3 published_at 2026-02-06T18:37:24Z.
      ground_truth_url: https://api.github.com/advisories/GHSA-xjw9-4gw8-4rqx
      fix: Correct dates.
      class: imprecision
  groups:
  - pass: D1
    members:
    - 2026-05-10/cve-2026-26030-cve-2026-25592-microsoft-semantic-kernel-prom
    - 2026-05-10/microsoft-semantic-kernel-cve-2026-26030-cve-2026-25592-prom
    same_finding: true
    survivor: 2026-05-10/microsoft-semantic-kernel-cve-2026-26030-cve-2026-25592-prom
    current_state: 'Microsoft Semantic Kernel (open-source AI agent framework), two flaws disclosed by the Microsoft Defender Security Research
      Team blog 2026-05-07 (MS blog: https://www.microsoft.com/en-us/security/blog/2026/05/07/prompts-become-shells-rce-vulnerabilities-ai-agent-frameworks/
      ; discoverers Uri Oren, Amit Eliahu, Dor Edry). (1) CVE-2026-26030 = Python SDK (PyPI semantic-kernel) InMemoryVectorStore filter RCE, CWE-94,
      CVSS 3.1 9.9 (AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H), vulnerable < 1.39.4, fixed 1.39.4, GHSA-xjw9-4gw8-4rqx published 2026-02-19 (https://api.github.com/advisories/GHSA-xjw9-4gw8-4rqx);
      fix PR #13505; workaround ''Avoid using InMemoryVectorStore for production scenarios''; exploitation needs a prompt-injection vector plus
      a Search Plugin backed by the In-Memory Vector Store in default configuration; mechanism per blog: default filter is a Python lambda executed
      with eval() with an unsanitised model-controlled parameter, AST blocklist bypassed (names __name__, load_module, system, BuiltinImporter
      not blocked) -> BuiltinImporter -> os.system. (2) CVE-2026-25592 = .NET SDK SessionsPythonPlugin arbitrary file write, CWE-22, CVSS 9.9
      same vector, nuget Microsoft.SemanticKernel.Core/Plugins.Core vulnerable < 1.71.0 fixed 1.71.0 (GHSA structured data also lists pip semantic-kernel
      < 1.39.3 first patched 1.39.3), GHSA-2ww3-72rp-wpp4 published 2026-02-06 (https://api.github.com/advisories/GHSA-2ww3-72rp-wpp4); DownloadFileAsync
      was accidentally marked [KernelFunction] so the localFilePath passed to File.WriteAllBytes() on the host became model-controlled; chain:
      ExecuteCode creates a script in the Container Apps sandbox, DownloadFileAsync writes it to the Windows Startup folder, runs at next sign-in;
      separately upload_file() (Python and .NET) accepted any local path (host-file read into the sandbox); fix PR #13478 removed [KernelFunction]
      from DownloadFileAsync and added path validation (UploadFileAsync keeps the attribute with validation); workaround: Function Invocation
      Filter allow-listing localFilePath for DownloadFileAsync/UploadFileAsync. Exploitation/KEV: neither CVE is in CISA KEV (catalog 2026.10.16,
      https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json); no source reports in-the-wild exploitation. Public
      CTF challenge reproducing CVE-2026-26030: https://github.com/amiteliahu/AIAgentCTF/tree/main/CVE-2026-26030.'
    facts_only_in_duplicates:
    - fact: '.NET flaw workaround: Function Invocation Filter allow-listing localFilePath for DownloadFileAsync/UploadFileAsync (present in B
        only, wrongly attributed to the Microsoft post)'
      entry: 2026-05-10/microsoft-semantic-kernel-cve-2026-26030-cve-2026-25592-prom
      verified: true
      source_url: https://api.github.com/advisories/GHSA-2ww3-72rp-wpp4
      passage: Users can create a Function Invocation Filter which checks the arguments being passed to any calls to DownloadFileAsync or UploadFileAsync
        and ensures the provided localFilePath is allow listed.
    - fact: 'Python flaw workaround: avoid InMemoryVectorStore for production (in neither entry)'
      entry: (neither)
      verified: true
      source_url: https://api.github.com/advisories/GHSA-xjw9-4gw8-4rqx
      passage: Avoid using InMemoryVectorStore for production scenarios.
    - fact: CVE-2026-25592 GHSA also lists Python semantic-kernel first patched 1.39.3 (both entries)
      entry: both
      verified: true
      source_url: https://api.github.com/advisories/GHSA-2ww3-72rp-wpp4
      passage: 'API vulnerabilities[0]: ecosystem pip, name semantic-kernel, vulnerable_version_range "< 1.39.3", first_patched_version "1.39.3"'
    - fact: B detection/hunting concepts (process ancestry, file creation outside sandbox, dispatcher logging) are analyst suggestions; Microsoft
        supplies Defender hunting queries for child processes of Semantic Kernel hosts (dotnet.exe/semantic-kernel command line spawning shells)
        and mentions scripts dropped in Startup folders
      entry: 2026-05-10/microsoft-semantic-kernel-cve-2026-26030-cve-2026-25592-prom
      verified: true
      source_url: https://www.microsoft.com/en-us/security/blog/2026/05/07/prompts-become-shells-rce-vulnerabilities-ai-agent-frameworks/
      passage: detect anomalous behavior, such as an AI agent process suddenly spawning command lines or dropping scripts into Startup folders.
    note: Same finding (identical CVEs, sources, run 2026-05-10-001); B (deep dive) is the better carrier but both carry the same uncited/incorrect
      statements (Foundry/Copilot Studio backing, [KernelFunction] on both methods, reversed upload/download roles, fabricated quote). GHSA publication
      dates are 2026-02-19/2026-02-06, so the finding is a May write-up of Feb-disclosed CVEs. No KEV listing, no ITW exploitation reported; priority
      high (A) vs notable (B) disagree; high fails the bar (research, no ITW).
