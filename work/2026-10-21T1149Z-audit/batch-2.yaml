      in SAP Commerce Cloud (Data Hub Adapter)'', Critical, CVSS 10.0 (COM_CLOUD 2211, 2211-JDK21), fix = patch to the fixed release levels then
      rebuild and redeploy, interim IP Filter Set (Onapsis https://onapsis.com/blog/sap-security-patch-day-august-2026/, datePublished 2026-08-11);
      Defused reported first exploitation attempts on its honeypots on 2026-08-14 with no public PoC (BleepingComputer 2026-08-14), NCSC-NL NCSC-2026-0302
      (2026-08-15 09:41) relays active scanning; SAP spokesperson: aware and investigating; not in CISA KEV (2026-10-16). Other items: CVE-2026-44772
      (Note 3765948, 9.9, post-patch Secure Transformer allowed-hosts property per Onapsis), CVE-2026-44758 (Note 3758900, 9.1, patch removes
      servlet), CVE-2026-34265 (Note 3714806, 9.8, DIAG memory corruption), CVE-2026-58243 (Note 3772411, 8.8). CVE-2026-42945 appears only as
      SAP Note 3773203, ''Potential buffer overflow vulnerability affects SAP Commerce Cloud in public-cloud deployments with NGINX'', High, CVSS
      8.1 (COM_CLOUD 2211, 2211-JDK21, DHUB_CLOUD 2211, 2211-JDK21); Onapsis: ''The patch is present on all SAP Commerce Cloud in the Public Cloud
      systems and customers can consume the patch by building and deploying their SAP Commerce Cloud applications''.'
