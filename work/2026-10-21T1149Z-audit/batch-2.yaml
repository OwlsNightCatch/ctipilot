      claim: no permanent patch ; Active Exploitation Without a Patch ; Permanent fixes are forthcoming ; mitigation-only
      defect: 'Superseded: Microsoft released the CVE-2026-42897 fix in the June 2026 Exchange Security Updates on 2026-06-09 (SE RTM publicly;
        2019 CU14/CU15 and 2016 CU23 only for Period 2 ESU customers); the July 2026 SUs (2026-07-14) are also recommended by MSRC.'
      ground_truth: 'Exchange Team 2026-06-09: "The June 2026 SUs address ... CVE-2026-42897"; FAQ: "When CVE-2026-42897 mitigations were released
        ... Are those solved in the CVE-2026-42897 fix (June 2026 SU)? Yes". MSRC rev 2 2026-06-09 "Added links to June 2026 Exchange Server security
        updates"; Learn M2 "Highest version applicable ... June 2026 SU".'
      ground_truth_url: https://techcommunity.microsoft.com/blog/exchange/released-june-2026-exchange-server-security-updates/4524491
      fix: 'Rewrite headline, summary, labelled lines and actions for the current state: fix available since 2026-06-09, mitigation removable
        after the July SU, exploitation by TA488 documented 2026-07-28.'
      class: factual-error
    - where: title / headline / immediate_action / body
      claim: stored XSS in OWA ; a stored / reflected cross-site scripting flaw
      defect: No source characterises the flaw as stored (or reflected); Microsoft says "cross-site scripting" with spoofing impact.
      ground_truth: 'MSRC: "Microsoft Exchange Server Spoofing Vulnerability ... Improper neutralization of input during web page generation (''cross-site
        scripting'')"; Proofpoint: "the server does not adequately sanitize HTML in the message body".'
      ground_truth_url: https://api.msrc.microsoft.com/sug/v2.0/sugodata/v2.0/en-US/vulnerability/CVE-2026-42897
      fix: Say "cross-site scripting (spoofing) in OWA".
      class: factual-error
    - where: body (mitigation / EEMS)
      claim: enabled by default on Exchange 2016 SP1 and later and auto-applies without requiring a service restart ; EEMS Mitigation M2
      defect: The EM service applies from the September 2021 CU (2016 CU22 / 2019 CU11) and can only fetch new mitigations on builds from March
        2023 or later; "2016 SP1" does not exist as a threshold; the no-restart statement and the "M2" (rule M2.1.x) naming are not as sourced.
      ground_truth: 'Exchange Team: "EM Service will not be able to check for new mitigations if your server is running Exchange Server version
        older than March 2023"; Learn: M2 lowest version "Exchange 2016: RTM" but EM service from "September 2021 CU"; mitigation ID "M2.1.x".'
      ground_truth_url: https://techcommunity.microsoft.com/blog/exchange/addressing-exchange-server-may-2026-vulnerability-cve-2026-42897/4518498
      fix: State the real prerequisites (September 2021 CU or later; build from March 2023 or later for new mitigations; officeclient.microsoft.com:443)
        and drop the restart claim.
      class: factual-error
    - where: actions[0]; body (verification)
      claim: Run `Get-ExchangeDiagnosticInfo -Server <name> -Process MSExchangeHMWorker -Component EemsMitigation -SettingName MitigationsApplied`
        ; look back to 2026-05-09
      defect: The command appears in no cited source (Microsoft documents Get-ExchangeServer | fl Name,MitigationsApplied, Get-Mitigations.ps1
        and the Health Checker); the 2026-05-09 lookback has no basis (Proofpoint dates the actor infrastructure to March 2026).
      ground_truth: 'Learn: "Get-ExchangeServer -Identity <ServerName> | Format-List Name,MitigationsApplied"; Exchange Team: run Exchange Health
        Checker.'
      ground_truth_url: https://learn.microsoft.com/en-us/exchange/plan-and-deploy/post-installation-tasks/security-best-practices/exchange-emergency-mitigation-service
      fix: Use the Microsoft-documented checks; drop or justify the lookback date.
      class: factual-error
    - where: body (Detection)
      claim: IIS access logs ... `/owa/` URLs containing `<script>` fragments ... in query strings; Exchange Application Event Log EID 4 ...;
        EDR alerts on browser processes spawning unexpected children from OWA sessions
      defect: 'Does not fit the documented mechanism: the payload is JavaScript in the email body run in the browser with no host footprint; no
        source supports these log fields.'
      ground_truth: 'Proofpoint: "OWAReaper runs inside the OWA browser context, operating as a stealthy implant with no host footprint"; detections:
        Default-user folder grants, EWS add-in tokens, IndexedDB/localStorage.'
      ground_truth_url: https://www.proofpoint.com/us/blog/threat-insight/cleaning-out-inboxes-ta488-comes-outlook-another-half-click-exploit
      fix: Replace with source-supported detections (mailbox folder-permission grants to Default, add-in token abuse, GetClientAccessToken, OWA
        localStorage/IndexedDB artefacts).
      class: imprecision
    - where: body ("three tiers")
      claim: Exploitation Detected (the highest of its three exploitation-status tiers)
      defect: Microsoft's exploitability assessments are Exploitation Detected / More Likely / Less Likely / Unlikely (four).
      ground_truth: MSRC records show "Exploitation Detected", "Exploitation More Likely", "Exploitation Less Likely", "Exploitation Unlikely".
      ground_truth_url: https://api.msrc.microsoft.com/sug/v2.0/sugodata/v2.0/en-US/vulnerability/CVE-2026-42897
      fix: Drop the tier count.
      class: imprecision
    - where: body (first paragraph)
      claim: disclosed by Microsoft on 2026-05-14 alongside the May 2026 Patch Tuesday cycle
      defect: 'Patch Tuesday was 2026-05-12; the CVE was an out-of-band disclosure on Thursday 2026-05-14 (NCSC-NL: "out-of-band update").'
      ground_truth: 'MSRC release 2026-05-14T07:00-07:00; NCSC-NL NCSC-2026-0159: mitigations "middels een out-of-band update".'
      ground_truth_url: https://api.msrc.microsoft.com/sug/v2.0/sugodata/v2.0/en-US/vulnerability/CVE-2026-42897
      fix: Say out-of-band disclosure on 2026-05-14, two days after Patch Tuesday.
      class: imprecision
    - where: evidence[1]
      claim: Microsoft is supplying a temporary mitigation for this vulnerability through the Exchange Emergency Mitigation Service. We are working
        on developing and testing a more permanent fix.
      defect: (low confidence) The sentence is on neither the current MSRC page nor the Exchange blog (both revised since); cannot be verified
        verbatim today.
      ground_truth: MSRC record revised 2026-05-18, 2026-06-09, 2026-07-14; current FAQ has no such sentence.
      ground_truth_url: https://api.msrc.microsoft.com/sug/v2.0/sugodata/v2.0/en-US/vulnerability/CVE-2026-42897
      fix: Replace with a quote verifiable on the current page, or drop.
      class: imprecision
    - where: body / actions[1]
      claim: See § 5 (Deep Dive, "Permanent-patch availability" paragraph)
      defect: Dangling pointer to a section of the migrated brief that does not exist in this entry.
      ground_truth: n/a
      ground_truth_url: https://api.msrc.microsoft.com/sug/v2.0/sugodata/v2.0/en-US/vulnerability/CVE-2026-42897
      fix: Remove.
      class: imprecision
