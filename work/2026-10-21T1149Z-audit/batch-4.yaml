      EBS instances (nearly 200 in the US and Europe) on 2026-06-29. CISA KEV: added 2026-07-15 (due 2026-07-18, forensic triage flagged, ransomware
      use Unknown; catalogue 2026.10.16) (https://www.cisa.gov/news-events/alerts/2026/07/15/cisa-adds-two-known-exploited-vulnerabilities-catalog).
