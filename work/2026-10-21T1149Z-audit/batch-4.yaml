    current_entry: 2026-05-29/forticlient-ems-cve-2026-35616-ekz-infostealer-kill-chain
    folded: true
    truth_pass: 2026-10-18T1307Z-audit/truth-D2
    verdict: factual-error
    defects:
    - where: frontmatter cves[].cvss; summary
      claim: CVSS 9.1
      defect: 9.1 is Fortinet's temporal score; the vendor base score is 9.8 (CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H)
      ground_truth: 'Fortinet PSIRT: ''CVSSv3 Score 9.8 CVSSv3 Temporal Score 9.1''; NVD (Fortinet CNA): 9.8 CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H'
      ground_truth_url: https://fortiguard.fortinet.com/psirt/FG-IR-26-099
      fix: cvss 9.8 (temporal 9.1)
      class: imprecision
    - where: body paragraph 1
      claim: The vulnerable code path trusts the `X-SSL-CLIENT-VERIFY` HTTP header set by a fronting reverse proxy or load balancer instead of
        validating client-certificate state itself
      defect: 'No fronting proxy is involved: EMS''s own Apache mod_ssl sets the trusted WSGI variables; the Django middleware also accepts user-supplied
        X-SSL-CLIENT-VERIFY / X-SSL-CLIENT-CERT headers and checks the chain by DN strings only'
      ground_truth: 'Bishop Fox: "The Django authentication middleware accepts client certificate information from both trusted WSGI environment
        variables (set by Apache mod_ssl) and user-controllable HTTP request headers, and Apache was never configured to strip the user-controllable
        variants."'
      ground_truth_url: https://bishopfox.com/blog/api-authentication-bypass-in-forticlient-ems-7-4-5-7-4-6-cve-2026-35616
      fix: Describe the Django/Apache header-trust and DN-only chain validation per Bishop Fox
      class: factual-error
    - where: summary; body paragraph 1
      claim: as a fake FortiEndpoint_Patch.exe signed under the legitimate fortitray.exe parent
      defect: 'Nothing is described as signed; the payload is launched on VPN tunnel establishment via a Remote Access Profile on_connect script:
        fortitray.exe or ipsec.exe -> cmd.exe -> powershell.exe -> FortiEndpoint_Patch.exe'
      ground_truth: 'AW: "fortitray.exe or ipsec.exe └── cmd.exe └── powershell.exe (download script) └── FortiEndpoint_Patch.exe (credential
        stealer)"'
