      (AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H), supported versions affected 12.2.3-12.2.15; fixed in Oracle''s May 2026 Critical Security Patch Update
      (CSPU), Rev 1 initial release 2026-05-28 (https://www.oracle.com/security-alerts/cspumay2026.html); same CSPU also carries sibling CVE-2026-46818
      (Oracle Payments / File Transmission, HTTPS, 7.4) and CVE-2026-46819 (Oracle Internet Procurement Connector, 9.1). Weakness labels (via
      Help Net Security and CISA KEV): improper privilege management, improper authentication, missing authentication for a critical function
      (CWE-269/287/306). Exploitation: Defused honeypots recorded the first in-the-wild exploitation on 2026-06-27 (single source, unauthenticated
      file read through the ibytransmit endpoint of the Payments File Transmission component reading /etc/passwd; Defused: ''a targeted proof-of-concept,
      not broad scanning''; no public PoC; reported on X 2026-06-29 (BleepingComputer https://www.bleepingcomputer.com/news/security/new-oracle-e-business-suite-flaw-now-exploited-in-attacks/),
