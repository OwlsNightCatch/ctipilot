  - claim_id: 7147add68c
    entry: 2026-05-09/cve-2026-31431-copy-fail-cisa-kev-deadline-2026-05-15-approa
    surface: "summary"
    kind: frontmatter
    text: "CVE-2026-31431 (Copy Fail, CVSS 7.8) lets an unprivileged local user make a controlled 4-byte write into the page cache through the kernel's AF_ALG crypto socket interface and splice(), corrupting a setuid binary to gain root. Xint published a portable exploit on 2026-04-29 that works unchanged on Ubuntu, Amazon Linux, RHEL and SUSE; CISA added the flaw to its KEV catalog on 2026-05-01. Until a fixed kernel is installed, blacklisting the algif_aead module blocks it where the module is loadable; on RHEL it is built into the kernel, and Red Hat gives a boot argument that blocks it instead."
  - claim_id: de879886e8
    entry: 2026-05-09/cve-2026-31431-copy-fail-cisa-kev-deadline-2026-05-15-approa
    surface: "body"
    kind: cited
    text: "); Red Hat states that all its fixes are available ("
    urls: ["https://access.redhat.com/security/vulnerabilities/RHSB-2026-002"]
  - claim_id: 35ed9df14f
    entry: 2026-05-09/cve-2026-31431-copy-fail-cisa-kev-deadline-2026-05-15-approa
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** a public, distribution-portable root exploit for local users puts every multi-user, container or web-facing Linux host on the patch-now list; where a fixed kernel cannot be deployed immediately, blocking AF_ALG socket creation with seccomp or blacklisting `algif_aead` closes the path ("
    urls: ["https://xint.io/blog/copy-fail-linux-distributions"]
  - claim_id: 96b4d476cd
    entry: 2026-05-09/cve-2026-31431-copy-fail-cisa-kev-deadline-2026-05-15-approa
    surface: "body"
    kind: cited
    text: "On RHEL the module is built into the kernel and cannot be blocklisted, so Red Hat gives the boot argument `initcall_blacklist=algif_aead_init` instead, warning that it may affect the performance of functionality that uses kernel cryptographic functions ("
    urls: ["https://access.redhat.com/security/vulnerabilities/RHSB-2026-002"]
  - claim_id: c0a5420371
    entry: 2026-05-09/cve-2026-31431-copy-fail-cisa-kev-deadline-2026-05-15-approa
    surface: "section 2026-10-21T12:08:24Z"
    kind: cited
    text: "Blacklisting `algif_aead` does not work on Red Hat Enterprise Linux: Red Hat states that the module \"cannot be blocklisted due to being built into the kernel\" and gives the boot argument `initcall_blacklist=algif_aead_init` to block the affected functions, with `initcall_blacklist=af_alg_init` as an alternative that blocks the AF_ALG interface itself; it warns of possible performance impact on functionality that uses kernel cryptographic functions, and states that all its fixes are available ("
    urls: ["https://access.redhat.com/security/vulnerabilities/RHSB-2026-002"]
  - claim_id: 46f04fdc0f
    entry: 2026-05-09/cve-2026-31431-copy-fail-cisa-kev-deadline-2026-05-15-approa
    surface: "section 2026-10-21T12:08:24Z"
    kind: cited
    text: "Xint also gives blocking AF_ALG socket creation with seccomp as an interim measure ("
    urls: ["https://xint.io/blog/copy-fail-linux-distributions"]
  - claim_id: b5d5aaf38c
    entry: 2026-05-09/cve-2026-31431-copy-fail-cisa-kev-deadline-2026-05-15-approa
    surface: "record 2026-10-21T12:08:24Z"
    kind: record-summary
    text: "The interim mitigation was given as a module blacklist for every distribution, but Red Hat builds algif_aead into its kernel, where it cannot be blocklisted; Red Hat's boot argument that blocks the affected functions is now given for RHEL, together with Xint's seccomp option and Red Hat's statement that all its fixes are available."
