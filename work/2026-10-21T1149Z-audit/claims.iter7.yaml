  - claim_id: 1cbb1b82ba
    entry: 2026-09-12/japan-digital-agency-gss-vpn-breach-maintenance-account
    surface: "record 2026-10-21T12:08:54Z"
    kind: record-summary
    text: "The Jiji Press article on nippon.com is no longer online, so it is no longer listed as a source, its quotes are dropped and the Digital Agency's own 2026-09-11 notice now carries the detection timeline and the record count. The notice adds the split between about 189,000 records on government staff and public servants and about 57,000 on contractors and individuals, and a commitment to improve how connections from outside are made. GSS is now described as the cited reporting describes it. An earlier section's statement that it was undisclosed whether the flaw was known before the intrusion is withdrawn: the minister said at the 2026-09-11 press conference that the agency knew of it beforehand."
