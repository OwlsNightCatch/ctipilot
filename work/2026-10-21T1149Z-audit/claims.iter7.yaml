    surface: "summary"
    kind: frontmatter
    text: "Pwn2Own Berlin 2026 (14 to 16 May, OffensiveCon) ended with $1,298,250 awarded for 47 unique zero-days and DEVCORE as Master of Pwn with 50.5 points. Results included a three-bug SYSTEM code execution chain on Microsoft Exchange, a VMware ESXi memory-corruption exploit with cross-tenant code execution, SharePoint, Edge and Windows 11 exploits, and wins against OpenAI Codex, Cursor, LM Studio, LiteLLM, Chroma and NVIDIA targets in ZDI's AI and NVIDIA categories. The bugs went to the vendors under a 90-day patch window."
