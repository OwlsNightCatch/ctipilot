    text: "CVE-2026-26980, an unauthenticated SQL injection in the Ghost CMS Content API (3.24.0 to 6.19.0, fixed in 6.19.1), is exploited at scale: XLab confirmed more than 700 poisoned domains by 2026-05-17. In the chain it traced, attackers stole each site's Admin API key and injected a loader that shows selected visitors a fake Cloudflare check and talks them into running a command that installs a stealer. Upgrading does not remove injected content or revoke stolen keys."
