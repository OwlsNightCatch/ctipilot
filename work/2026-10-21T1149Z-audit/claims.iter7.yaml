  - claim_id: ea243be7d7
    entry: 2026-05-09/cve-2026-42208-litellm-proxy-pre-authentication-sql-injectio
    surface: "summary"
    kind: frontmatter
    text: "CVE-2026-42208 (CVSS 4.0 9.3) is a SQL injection in LiteLLM Proxy's API-key verification, reachable without credentials from any LLM API route in versions 1.81.16 to 1.83.6 and fixed in 1.83.7. Sysdig saw the first exploitation attempt 36 hours after the advisory, with queries against the tables holding virtual keys, stored provider credentials and proxy configuration, but no follow-on use of extracted keys; CISA added it to its KEV catalog on 2026-05-08."
  - claim_id: 6ed574e291
    entry: 2026-05-09/cve-2026-42208-litellm-proxy-pre-authentication-sql-injectio
    surface: "body"
    kind: cited
    text: "Sysdig saw no follow-through: no authenticated calls with exfiltrated keys, no virtual-key minting through `/key/generate` and no reuse of provider credentials, so its finding is the speed and precision of the enumeration rather than a confirmed compromise; it still advises treating any internet-facing instance on a vulnerable version as compromised ("
    urls: ["https://www.sysdig.com/blog/cve-2026-42208-targeted-sql-injection-against-litellms-authentication-path-discovered-36-hours-following-vulnerability-disclosure"]
