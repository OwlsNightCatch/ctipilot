    kind: cited
    text: "Defused reported exploitation over the weekend before 2026-06-23 from a single IP address, using `file://` payloads to create files on the device in what appears to be a check for vulnerable systems; after that disclosure SSD Secure Disclosure, which reported the flaw to Cisco, published a technical write-up and proof-of-concept exploit ("
