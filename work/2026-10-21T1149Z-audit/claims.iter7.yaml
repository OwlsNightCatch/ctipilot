    entry: 2026-05-18/cve-2026-42897-exchange-owa-em-service-auto-mitigation-depen
    surface: "record 2026-10-21T12:07:16Z"
    kind: record-summary
    text: "Microsoft's May guidance says the Exchange Emergency Mitigation Service cannot check for new mitigations on a server running a build older than March 2023, so such a server never received the automatic mitigation. Proofpoint's two credential behaviours, browser-autofill harvesting and OAuth token theft through mailbox add-ins, are now mapped as credentials from web browsers and stolen application access tokens rather than unsecured credentials."
