    surface: "body"
    kind: cited
    text: "SSD's chain reads the node's true hostname from an unauthenticated WebDialer page, then abuses an unauthenticated cluster-install status endpoint as the SSRF, passing a full path in place of a node hostname to write a file that registers a new web service, and uses that service to write a JSP web shell ("
