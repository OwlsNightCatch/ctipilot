    surface: "section 2026-10-21T12:11:29Z"
    kind: cited
    text: "DENIC's final report of 2026-06-11 confirms the findings of its initial analysis of 2026-05-08 and lists its short-term measures: additional alerts based on better visibility of errors, including those in the continuously running testing and validation tools; an accelerated procedure to provide a valid zone backup in an emergency; partial validation of the zone before deployment; no further ZSK rollover until further measures are complete, including a more secure software development process and a test environment with higher coverage; and an external security and process analysis ("
