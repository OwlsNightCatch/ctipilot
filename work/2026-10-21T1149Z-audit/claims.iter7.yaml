    text: "CERT-FR: keep autonomous AI assistants off workstations; use them only in isolated sandboxes holding no sensitive data"
  - claim_id: cfca70237e
    entry: 2026-05-08/cert-fr-certfr-2026-act-016-agentic-ai-tools-introduce-promp
    surface: "summary"
    kind: frontmatter
    text: "CERT-FR's advisory of 2026-04-13 on autonomous personal assistants such as OpenClaw and Claude Cowork, which run commands, drive the browser, handle files and send mail on chat-message triggers, says they must not be deployed on workstations or in production until stabilised and proven, and limits their use to isolated test sandboxes without sensitive data. Its risk list covers workstation compromise through flaws in these mostly beta tools, data leakage to uncontrolled external resources, excessive access to office applications, leakage of login secrets shared with the agents, and destructive actions beyond the user's control."
  - claim_id: 68e45da4cb
    entry: 2026-05-08/cert-fr-certfr-2026-act-016-agentic-ai-tools-introduce-promp
    surface: "body"
    kind: cited
    text: "The advisory's risk list has five items: compromise of the user's workstation through a vulnerability in these tools, most of them still in beta; leakage of sensitive data by the agents to uncontrolled external resources; excessive access rights over all of the user's office applications (mail, calendar, file manager, business and HR applications); sharing of login credentials with the agents and their potential leakage; and loss of control over the agents' actions on the workstation, including destructive actions that damage the integrity or availability of business applications or data ("
    urls: ["https://www.cert.ssi.gouv.fr/actualite/CERTFR-2026-ACT-016/"]
