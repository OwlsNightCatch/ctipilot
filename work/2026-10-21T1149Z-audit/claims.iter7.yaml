  - claim_id: cbc95f2f3a
    entry: 2026-06-24/cve-2026-20230-cisco-unified-cm-webdialer-ssrf-to-arbitrary
    surface: "body"
    kind: cited
    text: "**Detection:** in the Unified CM web tier's access logs, the request sequence of SSD's chain: an unauthenticated GET of `/webdialer/Version.jws?wsdl`, then `/cmplatform/installClusterStatusExecute` with `action=clusterNodeInstallStatus` and a hostname parameter carrying a percent-encoded full path with XML markup instead of a bare node name, then calls to a new service under `/webdialer/services/` and to new JSP files under `/platform-services/axis2-web/` ("
