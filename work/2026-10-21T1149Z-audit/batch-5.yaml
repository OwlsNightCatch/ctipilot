run_id: 2026-10-21T1149Z-audit
batch: repair-5
note: 'W4 members. truth_T1 is this wave''s fresh truth pass (2026-10-21, read on the current text): apply it. leads_2026_10_18 are the older
  verdicts, read before later corrections: re-derive before acting.'
entries:
- entry: 2026-05-15/windows-bitlocker-yellowkey-and-ctfmon-greenplasma-zero-days
  role: 'Row W4-01 and W1-D. Survivor of the CVE-2026-45585 thread. Legacy duties apply. Bring it to the current state: CVE-2026-45585 fixed in
    the 2026-06-09 Windows updates (MSRC revision 2) and GreenPlasma fixed as CVE-2026-45586 the same day; that is a development after the entry''s
    last record, so the record type is `update`. Fix the T1 defects where they stand (invented quote, ''no CVE'', ''four'', uncited mitigations,
    empty techniques with ids in prose, the 2026-05-20 section''s superseded procedure where it misstates MSRC). Re-derive actions[] to the do-now
    bar (a physical-access bypass fixed four months ago probably leaves none). Priority by the bar on today''s facts.'
  legacy_duty: true
  last_record:
  - - '2026-05-20T05:00:11Z'
    - 2026-05-20-a0f7b07f
    - update
  truth_T1:
  - entry: 2026-05-15/windows-bitlocker-yellowkey-and-ctfmon-greenplasma-zero-days
    verdict: factual-error
    defects:
    - where: headline / title / summary
      claim: public PoC, no patch, TPM-only BitLocker bypassed ; Windows BitLocker "YellowKey" zero-day (no CVE) ... no patch available
      defect: 'Superseded and, for "no CVE", contradicted by the entry itself: the 2026-05-20 section records CVE-2026-45585, and Microsoft shipped
        the YellowKey fix in the June 2026 updates. The body never records GreenPlasma''s CVE or fix either.'
      ground_truth: 'MSRC CVE-2026-45585 revision 2 (2026-06-09): "Added links to June 2026 Windows security updates. Microsoft recommends installing
        this updates as soon as possible." Fixed builds in the MSRC table: KB5094125 (Windows Server 2025, 10.0.26100.32995), KB5094126 (Windows
        11 24H2 10.0.26100.8655, 25H2 10.0.26200.8655), KB5095051 (Windows 11 26H1, 10.0.28000.2269). GreenPlasma is CVE-2026-45586 (CTFMON EoP,
        CWE-59, CVSS 7.8), released 2026-06-09. BleepingComputer 2026-06-10: "On Tuesday, Microsoft fixed the GreenPlasma, MiniPlasma, and YellowKey
        security vulnerabilities as part of its June 2026 Patch Tuesday updates".'
      ground_truth_url: https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-45585
      fix: 'Through a changelog record, move headline, summary and actions to the current state: YellowKey = CVE-2026-45585, fixed 2026-06-09;
        GreenPlasma = CVE-2026-45586, fixed 2026-06-09; drop "no CVE" and "no patch".'
      class: factual-error
    - where: cves[CVE-2026-45585]
      claim: 'status: [poc-public, mitigation-only]; affected: null; fixed: null'
      defect: A security update has been available since 2026-06-09, so mitigation-only is false; MSRC publishes the affected products and fixed
        builds. id and cvss 6.8 and physical vector / pre-auth (PR:N) are correct.
      ground_truth: 'MSRC record: baseScore 6.8, vector CVSS:3.1/AV:P/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H/E:P/RL:W/RC:C, exploited "No", publiclyDisclosed
        "Yes", "Exploitation More Likely"; remediation table lists Windows 11 24H2/25H2/26H1 and Windows Server 2025 only (no Windows Server 2022).
        Not in CISA KEV (catalogue 2026.10.20).'
      ground_truth_url: https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-45585
      fix: Set status to patch-available (poc-public may stay), fill affected and fixed from the MSRC table; exploited stays No.
      class: factual-error
    - where: actions[0] and actions[1]
      claim: YellowKey (no CVE) bypasses TPM-only BitLocker ... Disable WinRE access where operationally viable (`reagentc /disable`). ; Microsoft's
        WinRE `BootExecute` registry mitigation is per-device and fragile under Windows feature updates that re-stage WinRE ... Public PoC, no
        patch (MSRC CVE-2026-45585)
      defect: '"No CVE" and "no patch" are stale, and the MSRC page cited for "no patch" now links the June 2026 updates; the reagentc /disable
        advice and the claim that the mitigation is fragile under feature updates appear in no cited source (MSRC''s own script uses reagentc
        to mount, then disable and re-enable WinRE to re-seal BitLocker trust).'
      ground_truth: 'BleepingComputer: Beaumont "recommended using a BitLocker PIN and a BIOS password"; NCSC-CH #12574: "Implement BIOS passwords
        and setting a BitLocker PIN mitigates the current public PoC". MSRC FAQ: "if you are using TPM+PIN the vulnerability is not exploitable."
        No source mentions feature updates re-staging WinRE.'
      ground_truth_url: https://www.bleepingcomputer.com/news/security/windows-bitlocker-zero-day-gives-access-to-protected-drives-poc-released/
      fix: Replace both actions with one task derived from the sources (BitLocker PIN plus BIOS password on TPM-only laptops, or install the June
        2026 update); delete reagentc /disable and the fragility claim.
      class: factual-error
    - where: body paragraph 1
      claim: Microsoft states it is "actively investigating."
      defect: The quoted phrase is in none of the cited sources (BleepingComputer, The Register, NCSC-CH, MSRC); it is an invented quotation.
      ground_truth: 'BleepingComputer: a Microsoft spokesperson "stated that the company is committed to investigating reported security issues,
        "and update impacted devices to protect customers as soon as possible.""'
      ground_truth_url: https://www.bleepingcomputer.com/news/security/windows-bitlocker-zero-day-gives-access-to-protected-drives-poc-released/
      fix: Quote the BleepingComputer statement verbatim or remove the quotation marks.
      class: factual-error
    - where: body paragraph 1
      claim: bringing the total of unpatched Nightmare Eclipse Windows zero-days to four
      defect: No cited source states four. BleepingComputer says two unpatched flaws and says RedSun was silently patched; The Register counts
        five zero-days this year with RedSun and UnDefend unfixed. Four is the entry's own subtraction over sources that disagree on RedSun.
      ground_truth: 'The Register 2026-05-13: "YellowKey and GreenPlasma are the latest in a series of five Microsoft zero-day bugs the researcher
        has exposed this year ... Both RedSun and UnDefend remain unfixed"; BleepingComputer: "Microsoft silently patched the RedSun vulnerability".'
      ground_truth_url: https://www.theregister.com/security/2026/05/13/disgruntled-researcher-releases-two-more-microsoft-zero-days/5239758
      fix: Drop the total, or attribute it to The Register and note the BleepingComputer disagreement on RedSun.
      class: imprecision
    - where: body paragraph 1 (YellowKey mechanism and affected scope)
      claim: crafted `FsTx` folder contents placed on a USB drive or the EFI partition are replayed by WinRE ... The current public PoC defeats
        TPM-only BitLocker configurations on Windows 11 and Windows Server 2022/2025; the researcher asserts the full bypass also defeats TPM+PIN
        but the unpublished variant is unconfirmed.
      defect: 'Three omissions: (1) Dormann could reproduce only with the USB drive, not the EFI partition; (2) Microsoft states TPM+PIN is not
        exploitable and Dormann says the public exploit does not work with TPM+PIN, a researcher-versus-vendor contradiction the entry never surfaces;
        (3) MSRC lists Windows 11 24H2/25H2/26H1 and Windows Server 2025 only, so "Windows Server 2022" is the researcher''s and BleepingComputer''s
        claim, not the vendor''s affected list.'
      ground_truth: 'BleepingComputer: Dormann "could not reproduce the bug using the EFI partition"; "the current YellowKey exploit does not
        work in a TMP+PIN environment". MSRC FAQ: "No, if you are using TPM+PIN the vulnerability is not exploitable."'
      ground_truth_url: https://www.bleepingcomputer.com/news/security/windows-bitlocker-zero-day-gives-access-to-protected-drives-poc-released/
      fix: State USB confirmed, EFI-partition variant claimed but not reproduced; add a Contradiction line (researcher claims TPM+PIN bypass,
        Microsoft says not exploitable); scope the product list to the MSRC table.
      class: imprecision
    - where: body paragraph 1
      claim: deleting `winpeshl.ini` — the file that suppresses the recovery shell
      defect: 'No source says what winpeshl.ini does, and the BleepingComputer quotation implies the opposite: with the file deleted, WinRE opens
        a command prompt instead of the recovery environment, so the file is what launches the recovery environment.'
      ground_truth: 'Dormann (BleepingComputer): "The result of this is that the X:\Windows\System32\winpeshl.ini is deleted, and when Windows
        Recovery is entered, rather than launching the actual Windows Recovery environment, it pops up a CMD.EXE. With the disk still unlocked".'
      ground_truth_url: https://www.bleepingcomputer.com/news/security/windows-bitlocker-zero-day-gives-access-to-protected-drives-poc-released/
      fix: Say "deleting winpeshl.ini, so WinRE opens CMD.EXE with the disk unlocked instead of the recovery environment".
      class: imprecision
    - where: body paragraph 1 (ATT&CK) and frontmatter techniques[]
      claim: 'MITRE ATT&CK: T1542.001 (Pre-OS Boot: System Firmware), T1006 (Direct Volume Access). ; techniques: []'
      defect: 'techniques[] is empty while the body names four ids. T1542.001 names a behavior no source describes: YellowKey replays NTFS transaction
        logs in WinRE and no firmware is modified. All four ids are active in ATT&CK v20 (checked: T1542.001, T1006, T1134, T1068); T1006 is also
        a weak fit (low confidence).'
      ground_truth: 'Dormann (BleepingComputer): "Windows looks for \System Volume Information\FsTx directories on attached drives, and will replay
        any NTFS logs".'
      ground_truth_url: https://www.bleepingcomputer.com/news/security/windows-bitlocker-zero-day-gives-access-to-protected-drives-poc-released/
      fix: Drop T1542.001 from the prose and carry the supported mapping in techniques[].
      class: imprecision
    - where: body paragraph 1 (Immediate mitigations)
      claim: set BIOS/UEFI boot password and disable USB/external-media boot; disable WinRE where operationally viable (`reagentc /disable`)
      defect: The cited sources give a BitLocker PIN and a BIOS password only; disabling USB/external-media boot and `reagentc /disable` are uncited.
      ground_truth: 'BleepingComputer: "He recommended using a BitLocker PIN and a BIOS password as a mitigation." NCSC-CH: "Implement BIOS passwords
        and setting a BitLocker PIN".'
      ground_truth_url: https://security-hub.ncsc.admin.ch/#/posts/12574
      fix: Cite a source for the extra items or delete them.
      class: imprecision
    - where: section 2026-05-20T05:00:11Z
      claim: Microsoft's interim mitigation requires per-endpoint work on every device using TPM-only BitLocker ... mount the WinRE image, remove
        the `autofstx.exe` entry ... ; add a BitLocker PIN or password protector ... The WinRE registry edit is fragile and breaks on Windows
        feature updates
      defect: MSRC says Microsoft "recommends that you consider" the mitigation, not that it is required on every device; MSRC replaced the manual
        steps with a script on 2026-05-21 (revision 1.2), so the described manual procedure is superseded; no source says feature updates break
        the edit; MSRC names TPM+PIN, not a "password protector".
      ground_truth: 'MSRC revision 1.2 (2026-05-21): "Added a script to implement a mitigation and removed the manual mitigations." FAQ: "Microsoft
        recommends that you consider implementing these mitigations if you are concerned your devices and data are at risk of being compromised
        or stolen."'
      ground_truth_url: https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-45585
      fix: Describe the MSRC script, say it is recommended where theft risk exists, and drop the fragility claim and "password protector".
      class: imprecision
    - where: frontmatter
      claim: 'classification: null ; affected_products: [] ; sectors: [public-sector, defense, education] ; event_date: 2026-05-14'
      defect: No Admiralty rating and no affected_products although the body names Windows 11 and Windows Server; the sectors appear in no cited
        source; event_date is a day after the primary's publication.
      ground_truth: BleepingComputer datePublished 2026-05-13T12:37:49-04:00; no cited source names a sector.
      ground_truth_url: https://www.bleepingcomputer.com/news/security/windows-bitlocker-zero-day-gives-access-to-protected-drives-poc-released/
      fix: Add classification and affected_products, drop the unsupported sectors, align event_date with 2026-05-13.
      class: imprecision
    - where: priority
      claim: 'priority: high'
      defect: 'Context only: on today''s facts the flaw is a physical-attack-only bypass (CVSS 6.8, AV:P), MSRC lists it exploited "No", it is
        not in CISA KEV and has been fixed since 2026-06-09, so it no longer meets the high bar.'
      ground_truth: 'MSRC: exploited "No"; "bypass a security feature with a physical attack".'
      ground_truth_url: https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-45585
      fix: Re-grade when the entry is brought to the current state.
      class: imprecision
  groups_T1:
  - &id001
    group: T1-nightmare-yellowkey
    pass: T1
    members:
    - 2026-05-15/windows-bitlocker-yellowkey-and-ctfmon-greenplasma-zero-days
    - 2026-05-30/nightmare-eclipse-chaotic-eclipse-microsoft-s-digital-crimes
    same_finding: false
    survivor: 2026-05-15/windows-bitlocker-yellowkey-and-ctfmon-greenplasma-zero-days
    note: Distinct findings. The 2026-05-15 entry is the technical disclosure of YellowKey and GreenPlasma (12-13 May); the 2026-05-30 entry is
      Microsoft's 27 May disclosure-dispute statement, the researcher's July threat and a roll-up of the six drops. They share the researcher
      entity and CVE-2026-45585, which the 2026-05-30 entry models wrongly (LPE, local, post-auth, cvss n/a, no-patch). Link them (references[]
      both ways); the 2026-05-30 entry should drop its cves[] record or correct it, and the 2026-05-15 entry is the survivor for the CVE thread
      and needs the 2026-06-09 patch state and GreenPlasma/MiniPlasma outcomes.
    current_state: 'YellowKey = CVE-2026-45585, MSRC "Windows BitLocker Security Feature Bypass Vulnerability", released 2026-05-19, CWE-77, CVSS
      6.8 (CVSS:3.1/AV:P/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H; temporal 6.3 with E:P/RL:W/RC:C), publiclyDisclosed Yes, exploited No, "Exploitation
      More Likely"; mitigation script added 2026-05-21 (revision 1.2, manual steps removed); revision 2 (2026-06-09) "Added links to June 2026
      Windows security updates"; fixed builds KB5094125 (Windows Server 2025 10.0.26100.32995), KB5094126 (Windows 11 24H2 10.0.26100.8655, 25H2
      10.0.26200.8655), KB5095051 (Windows 11 26H1 10.0.28000.2269); Windows Server 2022 is not in MSRC''s product table; MSRC FAQ: "if you are
      using TPM+PIN the vulnerability is not exploitable". Not in CISA KEV (catalogue 2026.10.20). GreenPlasma = CVE-2026-45586, "Windows Collaborative
      Translation Framework (CTFMON) Elevation of Privilege Vulnerability", released 2026-06-09, CWE-59, CVSS 7.8 (AV:L/AC:L/PR:L, temporal 6.8,
      E:U), exploited No, publiclyDisclosed Yes, "Exploitation More Likely"; fixed builds include Windows Server 2019 10.0.17763.8880 (KB5094123),
      Server 2022 10.0.20348.5256 (KB5094128), Windows 10 21H2/22H2 10.0.19044.7417/10.0.19045.7417 (KB5094127), Windows 11 23H2 10.0.22631.7219
      (KB5093998), 24H2 10.0.26100.8655 and 25H2 10.0.26200.8655 (KB5094126), Server 2025 10.0.26100.32995 (KB5094125); not in KEV. MiniPlasma
      (cldflt.sys, Cloud Files Mini Filter Driver) = addressed by the 2026-06-09 re-release of CVE-2020-17103 (MSRC revision 2: "This CVE has
      been re-released to comprehensively address the vulnerability identified by CVE-2020-17103"; CVSS 7.0 AV:L/AC:H; exploited No; MSRC gives
      no structured fixed-build table, only "installing the June 2026 updates"); not in KEV. The researcher''s earlier drops are KEV-listed: BlueHammer
      CVE-2026-33825 (added 2026-04-22), UnDefend CVE-2026-45498 and RedSun CVE-2026-41091 (both 2026-05-20); MSRC marks the last two exploited
      Yes.'
    facts_only_in_duplicates:
    - entry: 2026-05-30/nightmare-eclipse-chaotic-eclipse-microsoft-s-digital-crimes
      fact: Microsoft statement that uncoordinated disclosures "are never justifiable" and its Digital Crimes Unit "will continue bringing cases"
      passage: '"Uncoordinated disclosures that put proof-of-concept code for unpatched vulnerabilities into the hands of bad actors are never
        justifiable and have real-world consequences. ... Our Digital Crimes Unit will continue bringing cases against these actors and those
        that enable their criminal activity – coordinating as needed with law enforcement around the world."'
      source_url: https://www.microsoft.com/en-us/msrc/blog/2026/05/a-shared-responsibility-protecting-customers-through-coordinated-vulnerability-disclosure
      verified: true
      note: True to the MSRC blog post dated 2026-05-27; the entry's "28-29 May" and "formal DCU statement" are wrong, and The Record says Microsoft
        "stopped short of directly threatening legal action"
    - entry: 2026-05-30/nightmare-eclipse-chaotic-eclipse-microsoft-s-digital-crimes
      fact: Researcher threatened a further release on 14 July 2026
      passage: '"The researcher threatened a further release on July 14 — the date scheduled for Microsoft''s Patch Tuesday"'
      source_url: https://therecord.media/microsoft-calls-zero-day-releases-never-justifiable-as-researcher-threatens-more
      verified: true
      note: The entry's "responded by" and "the next Patch Tuesday" are unsupported/wrong (next was 9 June 2026)
    - entry: 2026-05-30/nightmare-eclipse-chaotic-eclipse-microsoft-s-digital-crimes
      fact: BlueHammer, UnDefend and RedSun patched and exploited in the wild; all on CISA KEV
      passage: '"have been exploited in live intrusions, according to Microsoft''s own patch advisories. All three appear on the U.S. Cybersecurity
        and Infrastructure Security Agency''s (CISA) catalog of known exploited vulnerabilities."'
      source_url: https://therecord.media/microsoft-calls-zero-day-releases-never-justifiable-as-researcher-threatens-more
      verified: true
      note: 'KEV catalogue 2026.10.20: CVE-2026-33825 added 2026-04-22; CVE-2026-45498 and CVE-2026-41091 added 2026-05-20; MSRC exploited Yes
        for the last two'
    - entry: 2026-05-30/nightmare-eclipse-chaotic-eclipse-microsoft-s-digital-crimes
      fact: Six vulnerabilities released since early April
      passage: '"The first three of the six vulnerabilities — known as BlueHammer, UnDefend and RedSun, all disclosed in April"'
      source_url: https://therecord.media/microsoft-calls-zero-day-releases-never-justifiable-as-researcher-threatens-more
      verified: true
    - entry: 2026-05-30/nightmare-eclipse-chaotic-eclipse-microsoft-s-digital-crimes
      fact: MiniPlasma abuses cldflt.sys for a SYSTEM shell on fully patched Windows 11; reported as incomplete fix of CVE-2020-17103
      passage: '"the flaw impacts the ''cldflt.sys'' Cloud Filter driver ... which was originally reported to Microsoft by Google Project Zero
        researcher James Forshaw in September 2020" ; Chaotic Eclipse: "the exact same issue that was reported to Microsoft by Google project
        zero is actually still present, unpatched"'
      source_url: https://www.bleepingcomputer.com/news/microsoft/new-windows-miniplasma-zero-day-exploit-gives-system-access-poc-released/
      verified: true
      note: Uncited in the entry; the incomplete-fix claim is the researcher's, and Microsoft later re-released CVE-2020-17103 on 2026-06-09
    - entry: 2026-05-30/nightmare-eclipse-chaotic-eclipse-microsoft-s-digital-crimes
      fact: '"responded by threatening a new vulnerability release ... (the next Patch Tuesday)" and "Next Patch Tuesday: 10 June 2026"'
      passage: 'BleepingComputer 2026-06-10: "On Tuesday, Microsoft fixed the GreenPlasma, MiniPlasma, and YellowKey security vulnerabilities
        as part of its June 2026 Patch Tuesday updates"'
