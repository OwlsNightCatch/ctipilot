      verified: false
    - entry: 2026-05-15/windows-bitlocker-yellowkey-and-ctfmon-greenplasma-zero-days
      fact: 'YellowKey mechanism: FsTx contents replayed by WinRE, winpeshl.ini deleted, CMD with the volume unlocked'
      passage: '"Windows looks for \System Volume Information\FsTx directories on attached drives, and will replay any NTFS logs." ; "the X:\Windows\System32\winpeshl.ini
        is deleted, and when Windows Recovery is entered, rather than launching the actual Windows Recovery environment, it pops up a CMD.EXE.
        With the disk still unlocked"'
