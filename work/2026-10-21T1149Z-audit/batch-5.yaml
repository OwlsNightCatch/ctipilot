- entry: 2026-05-25/large-scale-clickfix-campaign-mass-compromises-self-hosted-g
  role: 'Fold twin: read-only for you. Its verified facts are listed in the T1 group on the Ghost CMS survivor; the main agent folds this file
    after you return.'
  legacy_duty: false
  last_record: []
  truth_T1:
  - entry: 2026-05-25/large-scale-clickfix-campaign-mass-compromises-self-hosted-g
    verdict: factual-error
    defects:
    - where: body, "Why it matters to us"
      claim: self-hosted Ghost is used across EU/CH universities, NGOs and independent media — exactly the named victim profile
      defect: No cited source says Ghost is used across EU or Swiss institutions, and the "named victim profile" (Harvard, Oxford, Auburn, DuckDuckGo)
        is not EU/CH; XLab's victim table is 48.1% personal blogs, 14.8% software/SaaS blogs, 2.7% education, 2.1% nonprofit.
      ground_truth: 'XLab victim table rows: Personal Blog / Independent Site 368 (48.1%); Education / Academia 21 (2.7%); Nonprofit / Religion
        / Community 16 (2.1%); no country or region analysis in XLab or BleepingComputer.'
      ground_truth_url: https://blog.xlab.qianxin.com/ghost-cms-mass-compromised-via-cve-2026-26980-now-fueling-clickfix-attacks/
      fix: Delete the EU/CH usage claim; if a nexus is wanted, say the victim mix is mostly personal and software blogs and cite the table.
      class: factual-error
    - where: body, "Why it matters to us"
      claim: while *every visitor* to a compromised site is a ClickFix target
      defect: 'Contradicted by the cloaking mechanism: only visitors who pass the fingerprinting see the lure; researchers and crawlers see a
        harmless page.'
      ground_truth: 'XLab: "real victims will receive the malicious payload, while security researchers or crawlers will only see a harmless "safe
        page""; BleepingComputer: "Visitors passing the verification are served a fake Cloudflare prompt".'
      ground_truth_url: https://blog.xlab.qianxin.com/ghost-cms-mass-compromised-via-cve-2026-26980-now-fueling-clickfix-attacks/
      fix: Say "visitors who pass the cloaking script's fingerprinting".
      class: factual-error
    - where: body, "Why it matters to us"
      claim: '`cmd.exe` / `powershell.exe` spawned from a browser process tree following a Run-dialog paste'
      defect: 'No source gives the process lineage. XLab''s chain is a WIN+R paste of `cmd /c move ... && tar -xf ... && start /min update.bat`;
        a Run-dialog launch is parented by the shell, not the browser, so a hunt keyed to a browser process tree would miss it (low confidence:
        reasoning from how the Run dialog launches, not from a cited page).'
      ground_truth: 'XLab: "1. Use the WIN+R shortcut to open the command window 2. Use Ctrl+V to paste the command 3. Press Enter to execute
        the command."'
      ground_truth_url: https://blog.xlab.qianxin.com/ghost-cms-mass-compromised-via-cve-2026-26980-now-fueling-clickfix-attacks/
      fix: Describe the sourced chain (Run-dialog command extracting an archive and starting a batch file, then hidden PowerShell and rundll32)
        without asserting a browser parent.
      class: imprecision
    - where: body paragraph 1 (citation adjacency)
      claim: instructing them to paste a supplied command into the Windows Run dialog, which drops DLL loaders, JavaScript droppers, or an Electron-based
        sample (`UtilifySetup.exe`) ; ... plus DuckDuckGo
      defect: 'The Run-dialog detail belongs to XLab; BleepingComputer, the page cited, says "on their Windows command prompt". DuckDuckGo is
        named by BleepingComputer only: the XLab report (fetched in full) does not mention it. The payload file name is a file-name indicator
        the store excludes.'
      ground_truth: 'BleepingComputer: "The page instructs victims to verify that they are human by pasting a provided command on their Windows
        command prompt"; "threat actors planted malicious code on the websites of Harvard University, Oxford University, Auburn University, and
        DuckDuckGo." XLab names "Harvard University, Oxford University, Auburn University, etc." and no DuckDuckGo.'
      ground_truth_url: https://www.bleepingcomputer.com/news/security/ghost-cms-sql-injection-flaw-exploited-in-large-scale-clickfix-campaign/
      fix: Cite XLab for the Run-dialog step, attribute DuckDuckGo to BleepingComputer, and drop the file name.
      class: imprecision
    - where: frontmatter
      claim: 'cves: [] ; regions: [global, europe] ; sectors: [education, media, technology, public-sector] ; classification and techniques absent'
      defect: CVE-2026-26980 is named in the title, summary and body but cves[] is empty; "europe" and "public-sector" appear in no cited source
        (education, media and technology do match XLab's victim table); no Admiralty rating and no ATT&CK mapping.
      ground_truth: 'XLab victim table has no public-sector category and no regional breakdown; Ghost advisory: CVE-2026-26980, fixed 6.19.1.'
      ground_truth_url: https://blog.xlab.qianxin.com/ghost-cms-mass-compromised-via-cve-2026-26980-now-fueling-clickfix-attacks/
      fix: Fold into the rewritten entry (the survivor); only verified facts move.
      class: imprecision
