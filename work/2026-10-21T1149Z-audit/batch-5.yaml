    - entry: 2026-05-30/nightmare-eclipse-chaotic-eclipse-microsoft-s-digital-crimes
      fact: 'cves[]: CVE-2026-45585 as LPE, local, post-auth, cvss n/a, no-patch'
      passage: 'MSRC: "Improper neutralization of special elements used in a command (''command injection'') in Windows BitLocker allows an unauthorized
