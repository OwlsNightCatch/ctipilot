  - claim_id: b55daeb831
    entry: 2026-05-17/pwn2own-berlin-2026-master-of-pwn-outcomes-the-new-ai-agents
    surface: "summary"
    kind: frontmatter
    text: "Pwn2Own Berlin 2026 wraps — 47 unique zero-days, $1,298,250 awarded. DEVCORE's Orange Tsai chained three undisclosed Exchange bugs to SYSTEM-level unauthenticated RCE on Day 2 ($200K, 90-day embargo); STARLabs SG burned a memory-corruption ESXi hypervisor escape for another $200K on Day 3; the new AI Agents category produced exploits or collisions across all entered targets — OpenAI Codex (Compass Security CWE-150, $40K), Cursor (Compass Security, $15K), LM Studio (OtterSec code-injection Day 2; STARLabs SG separately ran an SSRF+code-injection 5-bug chain on Day 1), LiteLLM (k3vg3n SSRF+code-injection), with Claude Code, Chroma, Megatron Bridge and Ollama producing collisions (ZDI Day 3, 2026-05-16)."
  - claim_id: 18777fbbd3
    entry: 2026-05-17/pwn2own-berlin-2026-master-of-pwn-outcomes-the-new-ai-agents
    surface: "actions[0]"
    kind: frontmatter
    text: "**Inventory AI agent / inference deployments on developer endpoints** (LM Studio, Ollama, LiteLLM, Cursor, OpenAI Codex, Claude Code, vLLM gateways) and apply network egress controls so the agent runtime cannot reach RFC-1918 internal ranges. Pwn2Own Berlin 2026 demonstrated `T1190 → T1090 → T1059` chains on every AI Agents target; SSRF-pivot to internal endpoints is the load-bearing technique. Require tool-plugin code signing where supported; ensure EDR coverage extends to the agent runtime processes (`node`, `python`, `electron` child processes spawned by agent UIs). Reference: § 5 deep dive — AI Agents section."
