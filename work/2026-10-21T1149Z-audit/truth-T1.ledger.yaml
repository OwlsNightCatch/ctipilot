  - claim_id: 1c9264e88a
    entry: 2026-05-17/pwn2own-berlin-2026-master-of-pwn-outcomes-the-new-ai-agents
    surface: "body"
    kind: uncited
    text: "Across three days: 47 unique zero-days, $1,298,250 paid out — ZDI's largest Berlin payout to date."
  - claim_id: 5988934e86
    entry: 2026-05-17/pwn2own-berlin-2026-master-of-pwn-outcomes-the-new-ai-agents
    surface: "body"
    kind: uncited
    text: "**Exchange — compounding the in-the-wild picture.** The DEVCORE three-bug chain attacks a different surface from CVE-2026-42897 (yesterday's deep dive) — OWA stored XSS is browser-context exploitation against authenticated users; the DEVCORE chain achieves SYSTEM-level direct RCE without authentication."
  - claim_id: 84905a12ea
    entry: 2026-05-17/pwn2own-berlin-2026-master-of-pwn-outcomes-the-new-ai-agents
    surface: "body"
    kind: uncited
    text: "Technique-class map: `T1190` Exploit Public-Facing Application → `T1059.003` Windows Command Shell → `T1068` Exploitation for Privilege Escalation, with the EWS / RPC / RemotePS attack surface as the most plausible target set given Orange Tsai's prior ProxyLogon / ProxyShell / ProxyNotShell work."
  - claim_id: c7d613377e
    entry: 2026-05-17/pwn2own-berlin-2026-master-of-pwn-outcomes-the-new-ai-agents
    surface: "body"
    kind: uncited
    text: "Embargo window: ZDI rules require vendors to ship patches within 90 days; expect Microsoft advisories around 2026-08-14, possibly bundled into August Patch Tuesday."
  - claim_id: 4f325455f8
    entry: 2026-05-17/pwn2own-berlin-2026-master-of-pwn-outcomes-the-new-ai-agents
    surface: "body"
    kind: uncited
    text: "Operational implication for the next ~12 weeks: on-premises Exchange faces (a) the currently-exploited XSS without permanent patch, (b) an unpatched unauthenticated SYSTEM RCE class proven viable on hardened production builds, and (c) the residual ProxyShell/NotShell attack surface that the FamousSparrow Azerbaijani campaign covered in the 2026-05-14 deep dive showed is still being weaponised against unpatched installs."
  - claim_id: 08d4af6d2b
    entry: 2026-05-17/pwn2own-berlin-2026-master-of-pwn-outcomes-the-new-ai-agents
    surface: "body"
    kind: uncited
    text: "The defender posture published with the 2026-05-16 deep dive (verify EEMS service, monitor OWA access patterns, restrict ECP/EWS from the internet, accelerate Exchange Online migration where possible) becomes harder to argue against given the Pwn2Own evidence."
  - claim_id: 659a183f08
    entry: 2026-05-17/pwn2own-berlin-2026-master-of-pwn-outcomes-the-new-ai-agents
    surface: "body"
    kind: uncited
    text: "**AI Agents category — the new public-vulnerability surface for dev toolchains.** Pwn2Own Berlin 2026 was the first year ZDI ran an AI Agents track."
  - claim_id: 8da5417b29
    entry: 2026-05-17/pwn2own-berlin-2026-master-of-pwn-outcomes-the-new-ai-agents
    surface: "body"
    kind: uncited
    text: "The result across the AI-Agents and adjacent inference-stack targets — OpenAI Codex, Cursor, LM Studio, LiteLLM, Claude Code, Claude Desktop, Chroma, Megatron Bridge, Ollama — was that the entries either landed exploits or collided with bugs ZDI already had on file (the latter still confirms the vuln exists)."
  - claim_id: e097fc1e0c
    entry: 2026-05-17/pwn2own-berlin-2026-master-of-pwn-outcomes-the-new-ai-agents
    surface: "body"
    kind: uncited
    text: "The recurring pattern across LiteLLM, LM Studio, Cursor and the OpenAI Codex attempts is **agent-instruction-injection → server-side request forgery → arbitrary code execution**, mapped to `T1059.007` (JavaScript / scripting) and `T1090` (Proxy abuse) — the agent runtime takes adversary-supplied content (a tool invocation, a file the agent is asked to summarise, a URL), treats it as a privileged instruction, and either fetches an attacker-controlled resource SSRF-style from inside the corporate network or executes attacker-shaped code in the agent's runtime container."
  - claim_id: f84612d891
    entry: 2026-05-17/pwn2own-berlin-2026-master-of-pwn-outcomes-the-new-ai-agents
    surface: "body"
    kind: uncited
    text: "STARLabs SG's five-bug LM Studio chain (Day 1) and k3vg3n's LiteLLM chain (Day 1) both follow exactly that pattern — SSRF→code-injection."
  - claim_id: 5c8aac6141
    entry: 2026-05-17/pwn2own-berlin-2026-master-of-pwn-outcomes-the-new-ai-agents
    surface: "body"
    kind: uncited
    text: "OtterSec's Day 2 LM Studio pop was a code-injection bug only (no SSRF prefix), demonstrating the same target falls to two distinct attack-class roots."
  - claim_id: 91b89867ef
    entry: 2026-05-17/pwn2own-berlin-2026-master-of-pwn-outcomes-the-new-ai-agents
    surface: "body"
    kind: uncited
    text: "The OpenAI Codex CWE-150 vulnerability Compass Security exploited centres on improper neutralisation of special characters in tool-invocation arguments."
  - claim_id: 687a699753
    entry: 2026-05-17/pwn2own-berlin-2026-master-of-pwn-outcomes-the-new-ai-agents
    surface: "body"
    kind: uncited
    text: "Defender concepts that translate without IOCs: (1) treat self-hosted inference services (Ollama, LM Studio, LiteLLM, vLLM gateways) as untrusted public-facing applications even when bound to localhost — they are reachable from any browser tab the developer opens; (2) constrain outbound egress from inference containers to only the model-update endpoints they need (RFC-1918-range alerts from agent containers are a high-signal SSRF indicator); (3) require code-signing on tool plugins loaded by Cursor / Codex / Claude Code; (4) inventory developer endpoints that have agent tooling installed and ensure EDR coverage extends to the agent's runtime processes — these are not yet routinely covered by SOC tooling baselines."
  - claim_id: 30315373b0
    entry: 2026-05-17/pwn2own-berlin-2026-master-of-pwn-outcomes-the-new-ai-agents
    surface: "body"
    kind: uncited
    text: "For Swiss/EU public-sector environments specifically: agentic coding tools are entering federal and cantonal developer workflows ahead of any procurement-grade evaluation; the Pwn2Own results give a documented evidence base for SOC managers asking developer-tooling owners for inventory and egress controls."
  - claim_id: e826ff04d4
    entry: 2026-05-17/pwn2own-berlin-2026-master-of-pwn-outcomes-the-new-ai-agents
    surface: "body"
    kind: uncited
    text: "**Capacity-overflow rejected-researcher PoC wave.** A distinctive feature of Berlin 2026: Pwn2Own contest slots filled before all submitted research could be staged."
  - claim_id: 2807a6cfdc
    entry: 2026-05-17/pwn2own-berlin-2026-master-of-pwn-outcomes-the-new-ai-agents
    surface: "body"
    kind: uncited
    text: "ZDI's response — public disclosure of full PoC chains by researchers whose submissions were rejected for slot reasons — produced an unprecedented PoC release wave covering Firefox full-chain RCE, additional Ollama / LM Studio exploitation, NVIDIA driver chains, and at least one researcher's Claude Code exploitation attempt."
  - claim_id: 82d698a7a8
    entry: 2026-05-17/pwn2own-berlin-2026-master-of-pwn-outcomes-the-new-ai-agents
    surface: "body"
    kind: uncited
    text: "Operationally, defenders cannot rely on the standard Pwn2Own embargo for any of these — the technical detail is in the wild now."
