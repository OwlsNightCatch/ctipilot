    entry: 2026-05-17/pwn2own-berlin-2026-master-of-pwn-outcomes-the-new-ai-agents
    surface: "body"
    kind: uncited
    text: "**Background.** Pwn2Own Berlin (run alongside OffensiveCon, 2026-05-14 → 2026-05-16) is the second Berlin edition since Trend Micro / Zero Day Initiative moved the European event off the Vancouver-only schedule in 2025."
  - claim_id: f004fd63bd
    entry: 2026-05-17/pwn2own-berlin-2026-master-of-pwn-outcomes-the-new-ai-agents
    surface: "body"
    kind: uncited
    text: "It runs the standard Pwn2Own rules: original-research, full-chain, time-boxed in-room exploitation against current-patched production targets, with vendor-disclosure happening within minutes of a successful pop and a 90-day Pwn2Own embargo before ZDI publishes technical detail."
  - claim_id: 40ea354949
    entry: 2026-05-17/pwn2own-berlin-2026-master-of-pwn-outcomes-the-new-ai-agents
    surface: "body"
    kind: uncited
    text: "The Berlin contest historically draws a heavier European researcher field than Vancouver — relevant this year because Swiss firm Compass Security fielded a five-researcher team and took prizes against multiple AI agent targets."
  - claim_id: d2cf7b67bd
    entry: 2026-05-17/pwn2own-berlin-2026-master-of-pwn-outcomes-the-new-ai-agents
    surface: "body"
    kind: uncited
    text: "Prior Pwn2Own competitions established the cadence: bugs popped in May surface as advisory-tagged CVEs in vendor August or September advisories."
  - claim_id: d3aab99ffd
    entry: 2026-05-17/pwn2own-berlin-2026-master-of-pwn-outcomes-the-new-ai-agents
    surface: "body"
    kind: uncited
    text: "The May 2026 contest is meaningful for European public-sector defenders for three reasons covered below — the DEVCORE Exchange chain landing while CVE-2026-42897 is actively exploited, the new AI Agents category dragging dev-toolchain inference platforms into the public-vulnerability ecosystem, and the contest's capacity overflow which produced an unprecedented wave of *rejected-researcher* public PoC releases."
  - claim_id: e9bd7c8752
