    entry: 2026-05-15/windows-bitlocker-yellowkey-and-ctfmon-greenplasma-zero-days
    surface: "body"
    kind: uncited
    text: "Neither vulnerability has been assigned a CVE nor received a Microsoft patch as of 2026-05-15; Microsoft states it is \"actively investigating.\" A previous drop by the same researcher (BlueHammer, CVE-2026-33825, now patched) was confirmed used in real-world intrusions by Huntress in April 2026, demonstrating that this researcher's PoCs are operationally adopted."
