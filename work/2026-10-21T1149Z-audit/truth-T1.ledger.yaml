    surface: "body"
    kind: cited
    text: "Researcher \"Nightmare Eclipse\" published two new unpatched Windows zero-days on 2026-05-12–13 as full-disclosure drops after a disclosure dispute with Microsoft, bringing the total of unpatched Nightmare Eclipse Windows zero-days to four ("
