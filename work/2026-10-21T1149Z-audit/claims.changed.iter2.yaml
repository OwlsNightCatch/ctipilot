    text: "Upgrade every Catalyst SD-WAN Controller, Manager and Validator to its first fixed release (20.9.9.2, 20.12.7.2, 20.15.4.5 or 20.15.5.3, 20.18.3.1 or 26.1.1.2) after collecting request admin-tech from each control component, then verify the configuration of every edge device."
  - claim_id: d20166c713
    entry: 2026-06-06/cve-2026-20245-cisco-catalyst-sd-wan-manager-actively-exploi
    surface: "record 2026-10-21T12:10:28Z"
    kind: record-summary
    text: "Cisco's indicators cover three CLI upload scripts, not only the tenant-list one, and Cisco has seen exploitation push configuration changes to edge devices, which it asks customers to verify; its Live Protect shield is only temporary partial protection. Detection now carries Mandiant's authentication-log, rollback-file and command-history traces, which outlast the actor's cleanup of its root account, in place of the check for UID-0 accounts in /etc/passwd and /etc/shadow, which that cleanup can undo. The action now collects admin-tech before the upgrade and ends with the edge-device configuration check instead of the UID-0 account check."
