  - claim_id: 6964be3f36
    entry: 2026-05-29/forticlient-ems-cve-2026-35616-ekz-infostealer-kill-chain
    surface: "body"
    kind: cited
    text: "The payload, disguised as a Fortinet patch executable, is EKZ Infostealer, which exports credentials, cookies and autofill data from Chromium and Firefox browsers to a log file; for Chromium it copies itself into the browser's `Application` directory and relaunches from there to pass Chromium Elevation Service path validation before decrypting the browser's master key, and stolen cookies can let attackers reuse sessions without triggering MFA ("
    urls: ["https://arcticwolf.com/resources/blog/forticlient-ems-exploited-via-cve-2026-35616-to-deliver-ekz-infostealer-disguised-as-a-fortinet-patch/"]
  - claim_id: fa8eb6c626
    entry: 2026-05-29/forticlient-ems-cve-2026-35616-ekz-infostealer-kill-chain
    surface: "body"
    kind: cited
    text: "**Detection:** in EMS logs, a request rejected with \"Certificate not found in request header\" followed by a Fabric-device certificate update, and unexpected edits to the Remote Access Profile or endpoint policy; on endpoints, `fortitray.exe` or `ipsec.exe` starting `cmd.exe` with a GUID-named script from the FortiClient trace folder, then encoded PowerShell; in file and process telemetry, the fake patch executable running from the shared `ProgramData` folder, a copy of it written into a browser's `Application` directory, and a log file in that folder that PowerShell reads, sends out by HTTP POST and then deletes along with the payload ("
    urls: ["https://arcticwolf.com/resources/blog/forticlient-ems-exploited-via-cve-2026-35616-to-deliver-ekz-infostealer-disguised-as-a-fortinet-patch/"]
  - claim_id: 875b98d1d0
    entry: 2026-05-29/forticlient-ems-cve-2026-35616-ekz-infostealer-kill-chain
    surface: "section 2026-10-21T12:07:28Z"
    kind: cited
    text: "On Chromium browsers EKZ copies itself into the browser's `Application` directory and relaunches from there to pass Chromium Elevation Service path validation; Arctic Wolf's hunts also cover the payload running from the shared `ProgramData` folder and a log file there that PowerShell reads, posts out over HTTP and deletes together with the payload ("
    urls: ["https://arcticwolf.com/resources/blog/forticlient-ems-exploited-via-cve-2026-35616-to-deliver-ekz-infostealer-disguised-as-a-fortinet-patch/"]
  - claim_id: 44a14f7898
    entry: 2026-05-29/forticlient-ems-cve-2026-35616-ekz-infostealer-kill-chain
    surface: "record 2026-10-21T12:07:28Z"
    kind: record-summary
    text: "Fortinet's base score is CVSSv3 9.8, with 9.1 its temporal score. The Chromium step now reads as Arctic Wolf states it, a self-copy into the browser's Application directory to pass Elevation Service path validation, and the detection guidance adds Arctic Wolf's ProgramData staging and log-file exfiltration hunts. The payload and log file names are replaced by descriptions of the behaviour."
