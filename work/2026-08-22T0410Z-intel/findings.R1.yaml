side_referrals:
- item: Fourteen trojanized npm packages dropping the RedC2 4.0 Linux implant (2026-08-21)
  assessment: 'WORTH AN ENTRY, subject to reaching the discovering vendor''s own write-up - the reportable
    novelty is the execution trigger, not the packages: no install hook at all, the payload launches from
    the package entry file on MODULE LOAD, so a single transitive import detonates it and install-script scanners
    and --ignore-scripts see nothing. That is a clean complement to the crates.io build-time item (two different
    pre-runtime execution triggers in one window) and a direct answer to the ''we don''t ship that dependency
    to production'' reflex. Caveat: only an aggregator (The Hacker News, https://thehackernews.com/2026/08/14-trojanized-npm-packages-drop-redc2.html)
    surfaced in this run''s search - pivot to the originating vendor before composing, and check the store''s
    existing npm-wave coverage for dedup.'
- item: isolated-vm advisory GHSA-864f-rcv7-6rh4 (2026-08-20)
  assessment: 'WORTH AN ENTRY, and arguably the stronger of the two - a type confusion in ExternalCopy''s
    transferList handling lets guest JavaScript corrupt host process memory and escape the V8-isolate sandbox
    toward host code execution (T1611-class boundary break); fixed in 6.2.0 and 7.0.1, all versions up to
    and including 7.0.0 affected, no CVE assigned, discovered by Endor Labs (https://www.endorlabs.com/learn/ghsa-864f-rcv7-6rh4-critical-type-confusion-vulnerability-in-isolated-vm).
    Relevance driver: isolated-vm IS the sandbox that AI-agent and workflow-automation platforms (n8n, Activepieces,
    Mastra) rely on to run untrusted user-supplied code, so the failed control is the one those deployments
    treat as their trust boundary - directly on-point for public-sector self-hosted automation. Note GHSA-864f-rcv7-6rh4
    returns 404 from the OSV API, so pull the advisory from GitHub or the vendor write-up; verify affected/fixed
    versions against the GHSA itself before composing (version detail above comes from secondary reporting,
    not a fetched primary).'
