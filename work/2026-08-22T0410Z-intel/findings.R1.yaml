  affected_and_fixed_versions: 'Compromised legitimate crates (malicious versions hard-DELETED from crates.io,
    not merely yanked; RustSec records ''no patched versions'' for each, so the remediation is to pin the
    last clean release, not to upgrade): arrayref 0.3.10 malicious, unaffected <= 0.3.9 (RUSTSEC-2026-0260);
    internment 0.8.7 malicious, unaffected <= 0.8.6 (RUSTSEC-2026-0266); append-only-vec 0.1.9 malicious,
    unaffected <= 0.1.8 (RUSTSEC-2026-0262). The attacker also yanked arrayref 0.3.5-0.3.9 (and equivalent
    releases of the other two); crates.io has since REVERSED those yanks, so the clean versions are warning-free
    again. Attacker-owned crates, ALL versions deleted and to be treated as untrusted at any version: proc-macro1
    (1.0.106 clean decoy published 01:55:34 UTC, 1.0.107 weaponised 07:11:15 UTC - RUSTSEC-2026-0265), proc-macro-en
    (single version, same build script - RUSTSEC-2026-0264), arone (7 versions, last 2026-08-18) and aronenao
    (11 versions, last 2026-08-18), both with malicious build scripts (RUSTSEC-2026-0261 covers aronenao),
    aovine, and tinymember (2 versions, 27 downloads, no malicious code but same owner - RUSTSEC-2026-0263).
    NOT affected: the genuine proc-macro2 crate is not compromised in any way (StepSecurity, SafeDep). Checksums
    for the deleted internment, append-only-vec and proc-macro-en releases are not recoverable - they were
    purged from crates.io, the sparse index and docs.rs before archival.'
