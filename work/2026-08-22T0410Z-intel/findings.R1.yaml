  summary: 'On 2026-08-20 an attacker used the compromised crates.io publishing account of a long-standing
    Rust maintainer (droundy) to publish poisoned releases of three low-level utility crates - arrayref 0.3.10,
    internment 0.8.7 and append-only-vec 0.1.9 - within 23 minutes. Each poisoned release left the crate''s
    library source untouched and added exactly one new dependency: proc-macro1, a same-day typosquat of the
    ubiquitous proc-macro2 crate, whose build.rs reassembled a payload URL from base64 fragments, fetched
    a platform-specific second stage over TLS with certificate validation explicitly disabled, wrote it to
    a temp path named to look like a Rust toolchain installer, and spawned it detached (the child handle abandoned
    in-source to escape Cargo''s job object). Because Cargo compiles and runs build scripts on the machine
    performing the build with the building user''s full privileges, one cargo build or cargo update that resolved
    a poisoned version was sufficient to execute the payload on a developer workstation or CI runner - the
    crate''s code never had to be called, the build step concluded success and the compiler exited cleanly
    (T1195.001, T1105). Twenty-four seconds after publishing arrayref 0.3.10 the same account yanked 0.3.9
    back to 0.3.5 in a scripted burst, weaponising Cargo''s own ''yanked version'' warning so the responsible-looking
    fix (cargo update -p arrayref) resolved to the single remaining non-yanked release; the original reporter
    states this is how they were hit. The Rust Security Response Team, alerted at 07:54 UTC by the research
    team at Nextron Systems GmbH (Germany), deleted the three malicious versions after 86, 90 and 107 minutes
    online, removed six attacker-owned crates including a spare second dropper carrying the same build script
    (proc-macro-en), locked the accounts and reversed the yanks; it assesses the maintainer''s computer or
    credentials as compromised rather than the maintainer as acting maliciously (T1078). RustSec records that
    arrayref 0.3.10 was downloaded 2,285 times, under 10% of the crate''s traffic across all versions, because
    most consumers had older versions pinned in lockfiles - the decisive exposure question is the resolved
    lockfile entry, not the Cargo.toml range (arrayref = "0.3" matches 0.3.10), and a warm ~/.cargo/registry
    cache or committed vendor/ directory keeps building the payload offline even though the versions no longer
    exist in the registry. Wiz''s analysis of the stage-two implant (retrieved from Google Threat Intelligence)
    describes an HTTPS-POST beaconing backdoor with per-OS persistence, host and installed-application enumeration,
    browser-profile enumeration, four operator commands including remote script execution, and a DGA fallback,
    and assesses that its infrastructure substantially overlaps operations attributed to recent North Korean
    actors - an overlap assessment by Wiz, not an established attribution.'
  region_nexus: 'global - the exposure is any host that built Rust code in the 07:11-09:25 UTC window on 2026-08-20,
    with no geographic targeting claimed by any source. The European nexus is on the discovery side: the Rust
    Security Response Team credits the research team at Nextron Systems GmbH (Germany) with finding and reporting
    it. No European or public-sector consumer or victim is named by any source.'
  primary_sector_nexus: 'indirect - no public-sector victim is named. Relevance to the constituency is the
    build-host exposure class: administrations, CI operators and public-sector technology suppliers that compile
    Rust in-house or accept Rust build artefacts from suppliers, plus anyone whose CI runners hold cloud credentials,
    signing keys or deployment secrets. Rust sits under widely used GUI, hashing and blockchain toolchains,
    so exposure can be entirely transitive.'
