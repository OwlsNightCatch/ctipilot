  extended_notes: "WHO IS EXPOSED (the load-bearing question for a defender, all source-stated):\n- Exposed:\
    \ any developer workstation, CI runner or container build that CREATED or REFRESHED a lockfile\n  (cargo\
    \ update / cargo add / fresh cargo build with no committed Cargo.lock / cache-busted runner) between\n\
    \  07:11 and 09:25 UTC on 2026-08-20 and resolved arrayref 0.3.10, internment 0.8.7, append-only-vec 0.1.9,\n\
    \  or any version of proc-macro1 / proc-macro-en / aovine / arone / aronenao / tinymember (StepSecurity).\n\
    - NOT exposed by the registry event: builds with a pre-existing lockfile pinning clean versions - StepSecurity\n\
    \  states plainly that these \"kept compiling the clean, yanked-but-downloadable code, since yanking alone\
    \ never\n  breaks a locked build\". RustSec's 2,285-download figure and its \"less than 10% of arrayref\
    \ download traffic\"\n  framing is the quantitative expression of the same fact.\n- BUT: a Cargo.toml\
    \ semver pin is NOT protection (arrayref = \"0.3\" matches 0.3.10) - only the resolved lockfile\n  version\
    \ matters; and a warm ~/.cargo/registry cache or a committed vendor/ directory keeps building the\n  deleted\
    \ payload offline. Deletion from crates.io does not clean local caches (StepSecurity).\n- internment itself\
    \ depends on append-only-vec, so a single internment resolve in the window could pull two\n  poisoned\
    \ crates into one tree (StepSecurity).\n\nTOOLING GAP AND ITS CLOSURE (delta worth stating): StepSecurity\
    \ wrote on 2026-08-20 that because the malicious\nversions were DELETED rather than yanked and the RustSec\
    \ advisories were still pending, cargo audit reported\nclean for a project that pinned a poisoned version\
    \ (\"Automated tooling will not flag this for you.\"). This run\nverified that the RustSec records now\
    \ exist and are complete: RUSTSEC-2026-0260 (arrayref), -0261 (aronenao),\n-0262 (append-only-vec), -0263\
    \ (tinymember), -0264 (proc-macro-en), -0265 (proc-macro1), -0266 (internment) -\nall issued 2026-08-20,\
    \ last modified 2026-08-21, all with \"no patched versions\" and unaffected ranges <=0.3.9 /\n<=0.8.6\
    \ / <=0.1.8. Advisory-DB-driven scanners therefore now have coverage; teams that concluded \"cargo audit\n\
    clean\" on 20 August should re-run against a refreshed advisory database.\n\nBLAST-RADIUS FIGURES, each\
    \ with the source that states it (no computed or estimated numbers):\n- arrayref: \"245.2M all-time downloads,\
    \ 53.7M in the last 90 days. 406 dependent crate versions\" (StepSecurity).\n  BleepingComputer independently\
