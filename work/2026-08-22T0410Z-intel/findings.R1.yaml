  technique_mapping_basis: 'T1195.001 Compromise Software Dependencies and Development Tools - RustSec: ''A
    new version of the arrayref crate was published with a direct dependency on proc-macro1, which would execute
    a malicious build script.'' | T1078 Valid Accounts - Rust Security Response Team: the releases were published
    from the legitimate owner account, whose ''computer or credentials are likely compromised''; StepSecurity
    adds that the publish came from the owner''s crates.io credentials (a long-lived API token or stolen session)
    rather than the project''s normal workflow. (T1528 Steal Application Access Token is a plausible precursor
    but no source establishes how the token was obtained - do not map it.) | T1036.005 Match Legitimate Resource
    Name or Location - proc-macro1 is a typosquat of proc-macro2 shipping the genuine proc-macro2 source,
    published by an account one transposed letter from a well-known Rust author, with forged author metadata
    and a repository URL that 404s (StepSecurity, SafeDep, Wiz). | T1105 Ingress Tool Transfer - Wiz: the
    build script ''Downloads a platform-specific payload based on OS and architecture'' and executes it. |
    T1027 Obfuscated Files or Information - Wiz: ''Reconstructs a C2 URL from Base64 fragments''; StepSecurity:
    ''The payload infrastructure is split into base64 fragments so no string match on the raw source reveals
    a URL.'' | T1059.001 PowerShell and T1059.005 Visual Basic - BleepingComputer: ''On Windows, it creates
    %TEMP%\\rust-setup.ps1 and uses a hidden wscript.exe and VBS launcher to keep the process running'' (StepSecurity
    same, naming the .vbs wrapper). | T1547.001 Registry Run Keys / Startup Folder, T1543.001 Launch Agent,
    T1543.002 Systemd Service - Wiz: ''Persists via Registry Run key (Windows), LaunchAgent (macOS), or systemd
    user service (Linux)''. | T1082 System Information Discovery and T1518 Software Discovery - Wiz: ''Collects
    hostname, username and operating system details, enumerates installed applications''. | T1217 Browser
    Information Discovery - Wiz (as corrected by its own edit note): the implant ''reads Chrome, Brave and
    Edge profiles for saved logins and extension settings, querying the browsers'' SQLite credential stores
    directly'', but ''The queries only enumerate saved logins, they do not retrieve the encrypted credential
    material.'' NOTE: T1555.003 Credentials from Web Browsers is what the pre-correction Wiz text and BleepingComputer''s
    relay of it support; after the correction it is NOT established - map T1217 and describe the enumeration,
    do not claim browser credential theft. | T1071.001 Web Protocols and T1041 Exfiltration Over C2 Channel
    - Wiz: ''Beacons to C2 via HTTPS POST ..., exfiltrating host info and stolen credentials as Base64-encoded
    JSON''. | T1568.002 Domain Generation Algorithms - Wiz: ''Falls back to a Domain Generation Algorithm
    if the primary C2 is unreachable, generating 10 algorithmic .com domains every 5 days.'' All ids checked
    active in the pinned ATT&CK 19.2 dataset; note T1036.005 is now named ''Match Legitimate Resource Name
    or Location'' in v19.2.'
  detection_and_triage: 'TELEMETRY CLASS FIRST. (1) CI/CD egress and build-step network telemetry: StepSecurity
    reproduced the attack in a monitored GitHub Actions job and observed the build step open one outbound
    connection to a destination never seen in any prior run of that workflow, flagged as anomalous against
    the workflow''s own baseline, while the step still concluded success and the job went green - so the detection
    signal is destination novelty during a compile step, not a job failure. Legitimate Rust build traffic
    in that same run went only to the registry, index, docs and toolchain endpoints. (2) Process-creation
    telemetry with build-script lineage: a child process spawned by a build script that OUTLIVES the build
    step - StepSecurity notes the dropper abandons the child handle in-source specifically to escape Cargo''s
    job object, so a detached descendant of a cargo/build-script process that survives job completion is the
    anchor. On Windows the concrete shape is a script interpreter (wscript.exe) parented into a build tree
    launching a PowerShell script from the user temp directory with no window; on Unix, a file written to
    a temp directory by a build script, made executable and spawned detached with stdio nulled. (3) Manifest
    and lockfile review as telemetry: a first-ever dependency appearing in a crate that has had none for a
    decade, and build-kind dependencies that constitute a downloader toolkit (a base64 codec, a TLS stack
    and an HTTP client) in a library with no reason to make network calls - StepSecurity states the registry
    metadata alone proves the capability before the script is read, and Wiz''s hardening advice is to review
    any new or changed build-dependencies entry. (4) Host persistence artefacts (third-party-reported for
    stage two): an HKCU Run entry, a macOS LaunchAgent, or a systemd USER service registered to restart a
    payload, plus unexpected user-config directories and temp-directory executables. (5) Retrospective hunt
    scope: build logs for jobs that created or refreshed a lockfile between 07:11 and 09:25 UTC on 2026-08-20
    (cargo update, cargo add, fresh cargo build with no committed lockfile, cache-busted or ephemeral runners)
    - StepSecurity notes an ephemeral runner destroyed after the job still exfiltrated whatever secrets that
    job held. TRIAGE / BENIGN LOOKALIKES: an outbound connection during a compile step is not by itself malicious
    - networking crates legitimately appear in some build-dependency sets (Wiz''s own advice is to scrutinise
    them ''in a crate with no reason to make network calls'', which implies the benign case exists). The discriminators
    the sources support are: destination unseen in the workflow''s own prior-run baseline; a detached child
    process that outlives the build; TLS to an endpoint with certificate validation explicitly disabled (the
    dropper installs an accept-all certificate verifier because its endpoint has no valid certificate); and
    a dependency edge that has no corresponding source-level import. Conversely, a green build, a passing
    test suite and clean compiler output are NOT evidence of absence - the poisoned crates shipped genuine
    upstream source, so everything built and passed. HARDENING LEVERS named by the sources: commit Cargo.lock
    and build with --locked in CI, and review lockfile diffs in pull requests (a new dropper dependency is
    unmissable in review); registry cooldown policies that admit only crate versions older than N days would
    have made an 86-107-minute exposure a non-event; purge matching .crate files from ~/.cargo/registry/cache,
    drop CI cache entries and rebuild vendor/ directories from clean sources, because deletion from crates.io
    does not clean local caches; replace long-lived publishing tokens with scoped short-lived tokens / trusted-publishing
    OIDC flows (one stolen token poisoned three crates in 23 minutes); pin the clean releases explicitly (=0.3.9,
    =0.8.6, =0.1.8) and verify the resolved lockfile version rather than trusting the absence of a yank warning;
    and treat a sudden yank of multiple stable versions of a long-lived crate as a signal to investigate rather
    than a chore to clear (Wiz: ''Do not resolve yank warnings by upgrading blindly'').'
