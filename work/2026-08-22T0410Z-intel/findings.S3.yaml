  - title: "Unit 42: 99% of chat-phishing alerts and a 4x rise in Teams/Slack-borne compromise mean collaboration platforms now carry the identity attack that email controls cannot see"
    sources:
      - { url: "https://unit42.paloaltonetworks.com/communication-channel-identity-risks/", publisher: "Palo Alto Networks Unit 42", date: "2026-08-20", role: "primary" }
    discovery_trace: "first seen at: unit42 (S3 core source), URL https://unit42.paloaltonetworks.com/ (listing, item 'Identity Abuse Through Trusted Communication Channels' dated 2026-08-20) → pivot: WebSearch (\"Unit 42 'Identity Abuse' trusted communication channels August 2026\") → primary: Unit 42 blog post, URL https://unit42.paloaltonetworks.com/communication-channel-identity-risks/"
    summary: |
      Unit 42 (Bill Batchelor) documents identity abuse conducted entirely inside trusted collaboration
      platforms — Microsoft Teams, Slack, Google Meet/Workspace — where security controls built around
      email and authentication events have little visibility. Cortex telemetry shows chat-phishing alerts
      from collaboration tools rose from 30% to 42% of all phishing alerts in Cortex over four months, and
