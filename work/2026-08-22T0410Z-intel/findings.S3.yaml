      MalwareHunterTeam (a single X/Twitter post) for that one narrow claim only — not used as sole
      sourcing for the technical analysis. Triage/hunt concept: outbound FTP connections (port 21) to
      previously-unseen or non-business FTP hosts are inherently rarer and more anomalous in most
      enterprise egress baselines than web or DNS traffic, which is the discriminator SOCRadar/BleepingComputer
      both flag as making this channel stand out once an analyst knows to look for it — network egress
