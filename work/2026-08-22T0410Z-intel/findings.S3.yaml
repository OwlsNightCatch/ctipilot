  - title: "Google GTIG: three Russian-nexus clusters (UNC6293, UNC7005, UNC5976) built dedicated OAuth-token-theft and device-code-phishing infrastructure to hit European and US government, aerospace/defense, academia and think-tank targets"
    sources:
      - { url: "https://cloud.google.com/blog/topics/threat-intelligence/distinct-clusters-target-individuals-of-interest-to-russia/", publisher: "Google Threat Intelligence Group (GTIG)", date: "2026-08-20", role: "primary" }
    discovery_trace: "first seen at: mandiant-gtig (S3 core source), URL https://feeds.feedburner.com/threatintelligence/pvexyqv7v0v (RSS item published 2026-08-20T14:00:00Z) → primary: GTIG blog post, URL https://cloud.google.com/blog/topics/threat-intelligence/distinct-clusters-target-individuals-of-interest-to-russia/ (no pivot needed)"
    summary: |
      GTIG (Gabby Roncone, Wesley Shields) documents three distinct clusters it assesses with high
      confidence share a Russian nexus, each weaponizing a different legitimate authentication or
      communication flow rather than a technical exploit. UNC6293 — a sub-cluster of ICE RELIC (GTIG's
      APT29/Midnight Blizzard designation) — impersonates the US State Department and, since June 2026,
      runs OAuth device-code phishing: after the target performs a genuine third-party login, UNC6293 asks
      them to share the resulting verification code or URL, handing over account access without ever
      touching a password. UNC7005 (aka Storm-2945, also ICE RELIC-linked) runs the widest tradecraft set:
      Microsoft device-code phishing behind elaborate fake-conference registration pages carrying browser
      fingerprinting JavaScript; WhatsApp device-linking abuse where a legitimate linking QR/code is
      displayed on an attacker page and escalates to audio/video capture via a hidden MediaRecorder
      upload endpoint (`/api/code/<session>/recording`); OS-conditional malware delivery (VIDAR on
      Windows, ATOMIC/AtomicStealer on macOS); OAuth-token theft via redirects into attacker-controlled,
      unverified Google Cloud projects that scrape the token straight out of the redirect URL; and DNS
      poisoning of hospitality captive portals to serve fake Microsoft 365/OWA pages (previously reported
      by ReliaQuest). UNC5976 runs the same unverified-cloud-project OAuth-token-theft pattern from
      fake file-sharing landing pages and, after Google disruption action, migrated the token-capture
      infrastructure to non-Google cloud providers; it also delivers the HEADRUSH malicious Excel
      plugin against Ukrainian aerospace companies via spoofed-institute domains. None of the three
      clusters need to defeat MFA technically — each abuses a flow the identity provider designed to be
      convenient (app-specific passwords, device codes, QR-code device linking, OAuth redirects) and gets
      the victim to complete it.
    region_nexus: "Europe (government, aerospace/defense, academia, think tanks), Ukraine, US, NATO-aligned states — GTIG names Finland explicitly"
