  - title: "Microsoft's own Entra ID advisory said CVE-2026-69836 was exploited, then quietly said it wasn't — after a reporter asked why"
    sources:
      - { url: "https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-69836", publisher: "Microsoft Security Response Center", date: "2026-08-21", role: "primary" }
      - { url: "https://thehackernews.com/2026/08/microsoft-entra-id-flaw-cvss-100.html", publisher: "The Hacker News", date: "2026-08-21", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/microsoft/microsoft-warns-of-max-severity-entra-id-flaw-exploited-in-attacks/", publisher: "BleepingComputer", date: "2026-08-21", role: "corroborating" }
      - { url: "https://www.helpnetsecurity.com/2026/08/21/microsoft-entra-id-vulnerability-cve-2026-69836/", publisher: "Help Net Security", date: "2026-08-21", role: "corroborating" }
    discovery_trace: "first seen at: socradar (S3 core source), URL https://socradar.io/blog/ (listing, item 'CVE-2026-69836: Microsoft Entra ID RCE Exploited', dated 2026-08-21) → pivot: WebSearch (\"CVE-2026-69836 Microsoft Entra ID\") → primary: Microsoft Security Response Center CVRF/CVE record, URL https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-69836 (fetched via the msrc bridge subcommand, api.msrc.microsoft.com data) → corroboration: The Hacker News, URL https://thehackernews.com/2026/08/microsoft-entra-id-flaw-cvss-100.html (documents the correction) → corroboration: BleepingComputer, URL https://www.bleepingcomputer.com/news/microsoft/microsoft-warns-of-max-severity-entra-id-flaw-exploited-in-attacks/"
    summary: |
      CVE-2026-69836 is a CVSS 3.1 base-10.0 deserialization-of-untrusted-data flaw (CWE-502) in Microsoft
      Entra ID, discovered internally by Microsoft principal security engineer Robert Fitzpatrick and
      published on 2026-08-20 (revision 1, 07:00 Pacific). Microsoft's own record initially marked the
      Exploited field "Yes", and outlets including The Hacker News, BleepingComputer, The Register and
      Help Net Security published on 2026-08-21 reporting active in-the-wild exploitation of a
      maximum-severity, unauthenticated, zero-interaction RCE in the identity backbone underneath
      Microsoft 365, Azure and every connected enterprise application. Revision 1.1, dated the same day
      (2026-08-21, 07:00 Pacific), silently changed the Exploited field to "No" with the note "This is an
      informational change only" — a correction The Hacker News states Microsoft made only "after The
      Hacker News contacted the company for comment". Because Entra ID is a Microsoft-operated cloud
      service, the flaw was already fully mitigated server-side before any of this reporting ran; no
      customer patch exists or was ever required, and no proof-of-concept exploit code is public. The
      operational lesson is about the CVE record itself, not the exploitation: the "Exploited" field on a
      cloud-service CVE is not settled at publication and a same-day silent revision can invalidate a
      headline that already ran across the trade press — the field that triage decisions were built on
      changed under them without an announcement, and readers who did not check the MSRC revision history
      directly inherited a false alarm. For an Entra ID-dependent estate (federal/cantonal tenants
      included) this closes as a non-event operationally, but it is the second CVE-record-reliability
      failure this pipeline has tracked in eight days (the LLM-fabricated SQLite CVE wave was the first).
    region_nexus: "global; Entra ID underlies Microsoft 365/Azure authentication for any tenant, including Swiss federal and cantonal government estates"
