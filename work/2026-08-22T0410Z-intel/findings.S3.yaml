      abuse, where an attacker (Unit 42 names APT29 in this role) initiates a Teams conversation
      impersonating IT support and requests approval of a credential-harvesting page or an MFA
      confirmation from inside a chat the target has no reason to distrust; fully staged fake Slack/Teams
