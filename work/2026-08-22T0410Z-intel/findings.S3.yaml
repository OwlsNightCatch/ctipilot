      social engineering start-to-finish inside a platform the target believes is internal; malware
      delivered as file transfers through the platform itself (RAR archives carrying DLL-sideloading
      payloads); and native Slack webhook integrations misused post-compromise to exfiltrate credentials
      through what looks like ordinary outbound app traffic. Because the attacker operates with the
      identity and session of an already-compromised or successfully-impersonated user, the resulting
      activity reads as normal collaboration traffic to any control still scoped to email and login events.
