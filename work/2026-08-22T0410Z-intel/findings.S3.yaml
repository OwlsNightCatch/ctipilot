  - title: "BTR Reforged: Check Point turns Windows Defender's own signed remediation driver into a Ring-0 file/registry primitive — no exploit, no CVE, and Microsoft says it doesn't meet the bar for a fix"
    sources:
      - { url: "https://research.checkpoint.com/2026/btr-reforged-weaponizing-defenders-remediation-driver-as-a-kernel-operation-primitive/", publisher: "Check Point Research", date: "2026-08-20", role: "primary" }
    discovery_trace: "first seen at: checkpoint-research (S3 core source), URL https://research.checkpoint.com/feed/ (RSS item published 2026-08-20T13:07:13Z) → primary: Check Point Research blog post, URL https://research.checkpoint.com/2026/btr-reforged-weaponizing-defenders-remediation-driver-as-a-kernel-operation-primitive/ (no pivot needed)"
    summary: |
      Check Point researcher Jiří Vinopal shows that BTR.sys — the "Boot-Time Removal" driver embedded as
      a PE resource inside Windows Defender's MpEngine.dll, used legitimately during boot-time malware
      cleanup — exposes a kernel-mode file-delete/move and registry-set/delete primitive that requires no
      vulnerability, no memory corruption and no exploit: only its own designed, Microsoft-signed
      functionality, invoked in a way its authors did not anticipate. The driver has no standard IOCTL
      interface; instead it reads an RC4-encrypted transaction blob from the `Args` value of its own
      Service Registry key (populated via an Alternate Data Stream), so a caller who understands the
      internal transaction protocol can construct arbitrary file and registry operations and execute them
      at Ring 0 by loading the driver through `NtLoadDriver` as a boot-start ("Boot Bus Extender" group)
      service. The only prerequisite is `SeLoadDriverPrivilege` — i.e., an attacker already has local
      administrative access before this technique does anything for them, which is why Check Point states
      MSRC confirmed the finding "do not meet the criteria for immediate servicing." Check Point published
      BTR_CLI, an MIT-licensed research tool (github.com/Dump-GUY/BTR_CLI) that constructs valid encrypted
      transactions to exercise the driver. Because BTR.sys is a legitimate, signed, built-in Windows
      component, it functions as a LOLDriver by design rather than by vulnerability — the same abuse class
      LOLDrivers.io and Elastic's July 2026 800+-rule vulnerable-driver detection push exist to catch, but
      this is a signed security-vendor driver already present on every Windows Defender install rather than
      a third-party driver an attacker has to bring.
    region_nexus: "global"
    primary_sector_nexus: "indirect"
    sector: "all sectors running Windows Defender"
    cves: []
    techniques: [T1685, T1543.003]
    affected_products: ["Windows Defender", "Microsoft Windows"]
    entity_keys: []
    new_entities: []
    verification: SINGLE-SOURCE-OTHER
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "What if a trusted security component could be repurposed into an attacker-controlled kernel primitive? What if a signed Microsoft remediation driver could be instructed to execute arbitrary file and registry operations from Ring 0 – without exploits, vulnerabilities, or memory corruption?"
        attribution: "Check Point Research (Jiří Vinopal)"
        source_url: "https://research.checkpoint.com/2026/btr-reforged-weaponizing-defenders-remediation-driver-as-a-kernel-operation-primitive/"
      - quote: "The driver does not expose a standard IOCTL interface. Instead, it reads a configuration blob pointed to by the Args value in its Service Registry Key"
        attribution: "Check Point Research"
        source_url: "https://research.checkpoint.com/2026/btr-reforged-weaponizing-defenders-remediation-driver-as-a-kernel-operation-primitive/"
      - quote: "MSRC confirmed that these findings do not meet the criteria for immediate servicing, as the technique relies on pre-existing administrative privileges (SeLoadDriverPrivilege)."
        attribution: "Check Point Research, relaying Microsoft Security Response Center's determination"
        source_url: "https://research.checkpoint.com/2026/btr-reforged-weaponizing-defenders-remediation-driver-as-a-kernel-operation-primitive/"
    extended_notes: |
      Detection concepts (Sysmon-anchored, from the source): Event ID 15 (ADS creation) on a `.sys` file
      carrying a `:changelist` stream; Event ID 6 (DriverLoad) for BTR.sys followed by Event ID 23 (File
      Delete) from PID 4 (System) targeting security binaries; Event ID 12/13 service-registry creation
      with Group=`Boot Bus Extender` and an Args value containing a `:changelist` ADS reference, with no
      corresponding Event ID 7045 (expected service-install event) — an absence that is itself the tell;
      Event ID 11 for rapid create-then-delete of `\SystemRoot\Temp\BootClean.log` by the System process.
      Triage note: this whole class assumes prior admin access, so it reads as post-compromise
      defense-impairment/anti-forensics tradecraft, not an initial-access or privesc primitive on its own.

  - title: "UAT-10147: a Chinese-speaking BadIIS operator ships a cross-platform SPECTRE implant with a Linux rootkit and BYOVD EDR-blinding — and AI tooling that writes its own exploitation runbooks"
    sources:
      - { url: "https://blog.talosintelligence.com/uat-10147-deploys-spectre-a-cross-platform-implant-with-linux-rootkit-and-byovd-capabilities/", publisher: "Cisco Talos", date: "2026-08-20", role: "primary" }
      - { url: "https://blog.talosintelligence.com/uat-10147-chinese-speaking-adversary-integrates-agentic-ai-into-post-compromise-operations/", publisher: "Cisco Talos", date: "2026-08-20", role: "primary" }
    discovery_trace: "first seen at: talos (S3 core source), URL https://blog.talosintelligence.com/ (listing, two items dated 2026-08-20T06:00) → primary: Cisco Talos, URL https://blog.talosintelligence.com/uat-10147-deploys-spectre-a-cross-platform-implant-with-linux-rootkit-and-byovd-capabilities/ and companion post URL https://blog.talosintelligence.com/uat-10147-chinese-speaking-adversary-integrates-agentic-ai-into-post-compromise-operations/ → corroboration: WebSearch (\"Talos UAT-10147 SPECTRE Linux rootkit BYOVD\")"
    summary: |
      Cisco Talos (Joey Chen) publishes two companion pieces on UAT-10147, a Chinese-speaking commodity
      intrusion actor whose monetization path is BadIIS-based SEO fraud against compromised IIS web
      servers (target list of roughly 170,000 URLs across Brazil, Bolivia, China, Canada and Vietnam;
      confirmed victims span government, education, media, technology and gaming). Two elements are
      transferable beyond this one actor. First, SPECTRE: a custom C backdoor built for both Windows (45
      commands — screenshots, credential theft, keylogging, token impersonation, process injection,
      in-memory .NET execution, privilege escalation) and Linux (29 commands, deploying a companion kernel
      rootkit). The Windows BYOVD component downloads either RTCore64.sys (MSI, CVE-2019-16098) or
      DBUtil_2_3.sys (Dell, CVE-2021-21551) from its C2 and performs targeted kernel writes that unlink
      each registered EDR callback from its doubly-linked list, blinding kernel-callback-dependent
      security products to new process creation, thread creation and image-load events. The Linux rootkit
      loads as `acpi_pad.ko`, persists via a fraudulent `hardware-monitor.service` systemd unit configured
      with `Before=sysinit.target` so it starts ahead of security tooling on every boot, and communicates
      with userland over signal-based IPC using `kill()` calls against magic PID `0x7A69` (31337) with
      specific real-time signal numbers. Talos independently assesses SPECTRE's source code shows
      hallmarks of AI-generated authorship (a feature-list header reading like a prompt response, uniform
      section-separator formatting, and inline "Method 1/2/3" comment patterns). Second, the companion
      post documents UAT-10147 using agentic AI tooling operationally rather than just for code generation:
      the actor's AI assistant produces a fully documented README instructing an operator how to weaponize
      a ViewState deserialization RCE with ysoserial, and performs its own quality-assurance pass to
      validate the exploit works before use — AI as an autonomous step in the exploitation pipeline
      (reconnaissance, payload generation, validation, and persistence workflows), not merely a
      code-writing aid.
    region_nexus: "targets confirmed in Brazil, Bolivia, China, Canada, Vietnam; BadIIS-class targeting is opportunistic against internet-facing IIS, so any European IIS estate is in the addressable target set"
