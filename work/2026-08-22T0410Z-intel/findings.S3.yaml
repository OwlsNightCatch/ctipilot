  - title: "E4del and PINHOLE: two new RATs hide their C2 in FTP server banners, Pinterest pins and SurveyMonkey questions"
    sources:
      - { url: "https://socradar.io/blog/ftp-banners-new-dead-drop-resolver-rats/", publisher: "SOCRadar Threat Research Unit", date: "2026-08-21", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/hackers-abuse-ftp-server-banners-to-deliver-new-windows-malware/", publisher: "BleepingComputer", date: "2026-08-21", role: "corroborating" }
    discovery_trace: "first seen at: socradar (S3 core source), URL https://socradar.io/blog/ (listing, item 'FTP Banners: The New Dead Drop Resolver Delivering Novel RATs' dated 2026-08-21) → primary: SOCRadar STRU, URL https://socradar.io/blog/ftp-banners-new-dead-drop-resolver-rats/ → corroboration: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/hackers-abuse-ftp-server-banners-to-deliver-new-windows-malware/ (which itself cites the SOCRadar report and an original MalwareHunterTeam post as the discovery credit for the FTP-banner technique itself)"
    summary: |
      SOCRadar's Threat Research Unit, corroborated the same day by BleepingComputer, documents an LNK-based
      infection chain (delivered via a ZIP, likely phishing) that retrieves its next-stage command not from
      a web page or blockchain — the dead-drop-resolver classes defenders now watch for — but from the
      banner text an FTP server sends before login, active since early July 2026 with new infrastructure
      as recent as August 2026. Because the initial response of an FTP handshake is not normally inspected
      as a content channel, embedding a command in it evades the DNS/web/blockchain-focused detections
      built for the more common dead-drop-resolver variants (MITRE ATT&CK T1102.001 covers the general
      class; this is a protocol-adjacent variant SOCRadar credits MalwareHunterTeam with first spotting).
      The chain delivers two previously undocumented RATs. E4del is an Electron/Node.js RAT that replaces
      the core application logic inside the `resources/app.asar` archive of a legitimately signed
      Discord.exe, giving it persistent shell execution, screenshot capture, WebSocket desktop streaming
      and payload download/execution while presenting as a trusted, digitally-signed process. PINHOLE is a
      shellcode-based RAT built for EDR evasion specifically: it implements Halo's Gate to dynamically
      recover System Service Numbers from unhooked neighboring functions and issue direct syscalls that
      bypass userland EDR hooks, uses shellcode fluctuation to keep only a single 4KB section of its
      payload resident in memory at any time, and injects its final stage into a suspended
      `ApplicationFrameHost.exe` process via Early Bird APC injection. PINHOLE's command-and-control
      configuration is not fetched from attacker infrastructure at all — it is stored as delimited text
      inside Pinterest pins and SurveyMonkey survey questions, then proxied through Cloudflare Workers,
      giving the operators takedown resistance through legitimate multi-tenant platforms rather than
      bulletproof hosting.
