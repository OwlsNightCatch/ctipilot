    \ municipality's own use of \"cyberattack\", inside the citizen-advice block:\n    ES: \"...mencionando\
    \ el ciberataque comunicado por el Ayuntamiento de Velilla de San Antonio...\"\n    EN: \"...mentioning\
    \ the cyberattack reported by the Ayuntamiento de Velilla de San Antonio...\"\n\nEXPLICITLY NOT CONFIRMED\
    \ by the municipality:\n 1. Data access or exfiltration -- the load-bearing sentence:\n    ES: \"\
    La investigacion continua abierta y, por el momento, no se puede confirmar que se haya\n        producido\
    \ un acceso o extraccion efectiva de datos.\"\n    EN: \"The investigation remains open and, for the\
