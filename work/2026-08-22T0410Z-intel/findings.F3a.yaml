    \ CornFlake,\n    ChocoShell and the Entra device-code phishing. The in-window DELTA that is genuinely\
    \ new is: (a) GTIG's\n    independent linkage of that infrastructure to UNC7005's separate authentication-abuse\
    \ and malware\n    operations back to April 2026, (b) GTIG's Safe Browsing blocklisting from late\
    \ April, (c) the CHERRYPIE\n    = ChocoShell name equivalence with GTIG's LLM-generation observation,\
    \ and (d) the ICE RELIC\n    moderate-confidence linkage. Everything else about captive portals is\
    \ covered ground.\n 5. Genuinely NEW entities this post supports: actor:unc6293, actor:unc5976, and\
    \ (optionally)\n    malware:headrush, malware:enginelight. VIDAR and ATOMIC/AtomicStealer are commodity\
    \ MaaS families --\n    register only if the pipeline wants them as standing entities.\n 6. Novelty\
    \ framing: this is best composed as a NEW entry (the three-cluster authentication-abuse\n    picture,\
    \ UNC6293 and UNC5976 are new to the store) that REFERENCES the 2026-08-01 CaptiveCrunch entry\n \
    \   rather than an update_of it -- the bulk of the post is not captive-portal content.\n\n=== ATT&CK\
    \ MAPPING NOTE ===\n GTIG publishes NO ATT&CK mapping in this post -- zero occurrences of \"ATT&CK\"\
    , \"MITRE\", or any T-id\n (checked over the full fetched body). Every id in techniques[] is therefore\
    \ an analyst mapping by this\n sub-agent against the pinned dataset (attack_version 19.2), each tied\
    \ below to the GTIG sentence that\n describes the behaviour. Two dataset facts the composer must respect:\n\
    \  - **T1656 Impersonation is REVOKED in v19.2, superseded by T1684.001** (Social Engineering:\n \
    \   Impersonation). Use T1684.001. Mapping a State-Department/GLOBSEC/FOC impersonation to T1656 would\n\
    \    trip the check_run.py revoked-id warning.\n  - There is NO ATT&CK technique for \"device code\
    \ phishing\" or for \"app password\" as such (searched the\n    full 858-technique dataset for both).\
    \ Device-code phishing is expressed as the composite\n    T1566.002 -> T1528 -> T1550.001 (+ T1098.005\
    \ where it ends in device registration); app-password\n    abuse is expressed as T1556.006, which\
    \ is the closest active fit rather than an exact match.\n Sentence support per id:\n  T1684.001 --\
    \ \"UNC6293 has continued to impersonate State Department officials\"; \"spoofing the\n    legitimate\
    \ GLOBSEC forum\"; \"registered domains spoofing the legitimate Finnish Operations Center\n    (FOC)\"\
    ; \"a domain that impersonated a research institute in Ukraine\".\n  T1566.002 -- \"UNC7005 initially\
    \ delivers Microsoft device code phishing attempts via email... The\n    emails contain links to these\
    \ attacker websites\"; \"UNC7005 distributed malicious URLs through\n    phishing emails\".\n  T1566.001\
    \ -- the app-password instructions were carried in an attachment: \"a PDF lure document that\n   \
    \ contained the exact same screenshots as observed in June 2025\".\n  T1204.001 -- victim action on\
    \ the lure link: clicking \"Get Access\" or \"Sign in With Google\"; clicking\n    \"Continue with\
    \ Google\" on the fake file-sharing page.\n  T1204.002 -- \"If the target clicked the button to download\
    \ a 'Summit Companion App'... they were\n    served infostealer malware based on the OS indicated\
    \ in the target's User Agent.\"\n  T1528 -- \"The cloud project hosted malicious scripts that retrieve\
    \ the authentication token from the\n    URL and save it for the operator to later retrieve\"; \"\
    likely used to steal authentication tokens\".\n  T1550.001 -- \"authentication tokens that grant the\
    \ attacker access to the target account\"; \"By\n    providing the requested verification code the\
    \ target would grant UNC6293 access to the account.\"\n  T1556.006 -- \"attackers attempt to convince\
    \ targets to set specific app passwords on their accounts,\n    which the attackers then use to gain\
    \ access to those accounts without needing two-factor\n    authentication (2FA)\". Closest active\
    \ fit; not an exact ATT&CK match (see note above).\n  T1098.005 -- \"lure targets into linking their\
    \ WhatsApp accounts with an attacker controlled device\";\n    \"After the target successfully links\
    \ their account to the attacker's WhatsApp device\".\n  T1671 -- attacker-created OAuth/cloud-project\
    \ integrations: \"UNC5976 purchased domains... and then\n    created a cloud project related to that\
    \ domain\"; \"an attacker-controlled, testing mode, unverified\n    cloud project\".\n  T1123 + T1125\
    \ -- \"malicious JavaScript to record target audio and video is triggered... while the\n    audio\
    \ and video are recorded.\"\n  T1041 -- \"The recording would then be sent to the attacker command-and-control\
    \ (C2) endpoint\n    /api/code/<unique user session id>/recording when the call 'fails'.\"\n  T1555.003\
    \ + T1539 -- \"VIDAR... primarily targets sensitive information stored in browsers, such as\n    credentials,\
    \ stored payment information, cookie information, and saved addresses\".\n  T1497.001 -- \"UNC7005\
    \ included a script in the main registration page to attempt to detect and evade\n    automated analysis\
    \ efforts\" (navigator.webdriver / headless-Chrome checks); \"the target's system is\n    fingerprinted,\
    \ likely to check for an automated scanner accessing the page\".\n  T1583.001 -- \"UNC5976 purchased\
    \ domains, usually using file sharing related domain names\";\n    \"UNC7005 registered three Microsoft\
    \ Outlook Web Access (OWA) themed domains\".\n  T1583.006 -- registering the cloud-project web service\
    \ used to host the token-capture scripts and the\n    phishing pages. (T1583.007 Serverless is the\
    \ alternative if the composer prefers it; GTIG does not\n    say Apps Script, so T1583.006 is the\
    \ safer id.)\n  T1585.002 -- attacker-controlled mail accounts used for registration and for sending:\
    \ \"the\n    attacker-controlled account bounce@chamber-ua.org\"; gmail registrant addresses.\n  T1137.006\
    \ -- \"UNC5976 leverage a malicious Excel plugin, which we named HEADRUSH\". Caveat: GTIG\n    describes\
    \ delivery/execution, not confirmed Office add-in startup persistence; the id is the only\n    active\
    \ Office-add-in technique.\n  T1218.005 -- mechanism-derived, flagged: GTIG states the sample \"ultimately\
    \ led to an HTML Application\n    (HTA) downloader\"; mshta is the Windows host for HTA execution.\
    \ GTIG does not name mshta. Include\n    only if the composer is comfortable with mechanism-derived\
    \ mapping; drop it otherwise.\n  T1059.001 -- \"the CHERRYPIE PowerShell infostealer\".\n  T1588.001\
    \ -- \"VIDAR is an infostealer operated as a Malware as a Service (MaaS)\"; \"we suspect\n    CHERRYPIE\
    \ may be based on an infostealer purchased from MaaS operators\" (hedged).\n  T1588.007 -- \"Samples\
    \ of the CHERRYPIE PowerShell infostealer (also known as ChocoShell) contain\n    numerous artifacts\
    \ suggesting the malware is generated by a large language model (LLM).\" Preserve\n    \"suggesting\"\
    \ -- GTIG does not assert LLM generation as fact.\n  T1090.002 -- \"All clusters heavily rely on commercial\
    \ residential proxies for post-compromise\n    activity.\" (External proxy fits the definition better\
    \ than T1090.003 Multi-hop Proxy; GTIG says\n    nothing about chaining.)\n  T1078.004 -- \"presents\
    \ opportunities for the attacker to further phish targets of interest from\n    compromised, legitimate\
    \ accounts.\"\n\n=== STRATEGIC / DEFENDER-VANTAGE LINES WORTH CARRYING ===\n - The visibility gap,\
    \ in GTIG's words: \"The accounts these groups target are often personal, rather\n   than corporate\
    \ domain-joined accounts, creating a visibility gap for monitoring compromise from an\n   organizational\
    \ perspective.\" Direct consequence for a government SOC: the intrusion begins outside\n   your telemetry\
    \ and comes back inside via a trusted human.\n - \"The likely use of encrypted messenger applications\
    \ instead of email for initial outreach also\n   presents a challenge to defenders hoping to track\
    \ and remediate abuse.\"\n - Google's stated hardening levers, quotable: \"App passwords are not recommended\
    \ and unnecessary in\n   most cases.\"; \"Participation in the APP prevents accounts from creating\
    \ app passwords due to higher\n   security requirements.\"; \"Enterprise customers of Google Cloud\
    \ can disable App Specific Passwords by\n   restricting 2-Step verification to 'Only Security Keys'\
    \ or enrolling users into the Advanced\n   Protection Program.\"; and for messengers, \"Establish\
    \ routine device audit checks for 'linked devices'\n   on both corporate and personal devices\" and\
    \ \"Enforcing registration locks and two factor\n   authentication where possible to prevent an adversary\
    \ from registering an account via stolen SMS\n   verification codes\".\n - Benign lookalikes / triage\
    \ discriminators supported by the mechanism (for the entry's Triage line):\n   an app-specific password\
    \ created by a user genuinely configuring a legacy mail client, a device-code\n   grant from a real\
    \ conference-room or IoT enrolment, a WhatsApp linked device from the user's own\n   laptop, an unverified\
    \ OAuth app that is a legitimate internal dev project. Discriminators GTIG's\n   mechanics supply:\
    \ (a) the ASP/device-code/link event follows inbound external outreach within\n   minutes-to-hours;\
    \ (b) the ASP label names an external organisation or event rather than a device or\n   mail client;\
    \ (c) the OAuth grant's redirect target is cloud-project-hosted infrastructure unrelated\n   to the\
    \ app's claimed publisher; (d) camera/microphone permission granted to a non-conferencing origin\n\
    \   in the same session as a messenger device-link; (e) post-event authentication arrives from a\n\
    \   residential-proxy ASN with no interactive sign-in of its own.\n"
- title: Kairos claims 77.6 GB from the Ayuntamiento de Velilla de San Antonio; the municipality confirms
    a security incident but explicitly cannot confirm that data was accessed or extracted -- the second
    Community of Madrid municipality Kairos has claimed since May 2026
