    \ the corresponding information will be provided through official channels.\"\nABSENT from the municipality's\
    \ statement entirely (state as absences, do not fill in): the name Kairos;\n any data volume; any\
    \ data category list; any affected-person count; any access vector; any mention of\n the AEPD (Spanish\
