  summary: 'GTIG published "Going with the Flow(s): Distinct Clusters Target Individuals of Interest to

    Russia" on 2026-08-20 (authors Gabby Roncone, Wesley Shields), documenting three separately-tracked

    suspected Russian espionage clusters whose common denominator is that none of them defeats

    authentication technically -- each drives the target through a legitimate, vendor-designed

    authentication or account-linking flow and harvests the resulting credential material. GTIG assesses

    the Russian nexus at HIGH confidence for all three clusters; the ICE RELIC (formerly APT29) linkage

    for UNC6293 and UNC7005 is MODERATE confidence only, and UNC5976 is held distinct with GTIG raising

    "potential alignment with alternative Russian intelligence services".


    UNC6293 (moderate-confidence ICE RELIC sub-cluster, initial access) continues the app-specific-password

    lure first reported June 2025, still impersonating US State Department officials and still shipping
    the

    same PDF screenshots -- but the 2026 variant no longer asks the victim to email the app password back;

    it asks the victim to type it into an authentication form on an otherwise legitimate-looking website.

    Since June 2026 UNC6293 also runs OAuth phishing in which the target performs a genuine login at an

    external provider and is then asked to hand back the full redirect URL or the "verification code";

    supplying the code grants UNC6293 account access. Campaigns are deliberately tiny -- usually fewer

    than five users at a time -- with diplomatic and conference themes.


    UNC7005, which GTIG explicitly labels "aka STORM-2945", is the broadest toolset: per-target app

    passwords; Microsoft device-code phishing behind elaborate spoofed-conference registration pages

    (GLOBSEC, embassy-invite) carrying browser fingerprinting and, in a revised template, headless-browser

    detection; WhatsApp device-linking abuse that displays a genuine WhatsApp QR/linking code to the

    victim and, once linked, offers a fake voice call whose JavaScript records the victim''s camera and

    microphone and POSTs the WebM to /api/code/<session>/recording; OS-conditional infostealer delivery

    (VIDAR on Windows, ATOMIC on macOS) behind a fake "Summit Companion App"; and, from 31 July 2026,

    Google OAuth phishing via domains spoofing the Finnish Operations Center against European

    defence-industry targets, where authenticating redirects the victim into an attacker-controlled,

    testing-mode, unverified cloud project GTIG assesses is "likely used to steal authentication tokens".


    UNC5976 industrialises the same unverified-cloud-project pattern: purchase a file-sharing-themed

    domain, create a matching cloud project, host a fake file-sharing page that pops a Google login, and

    have the cloud project''s scripts scrape the auth token straight out of the post-authentication redirect

    URL and store it for later operator retrieval. It also delivered HEADRUSH, a malicious Excel plugin

    leading to an HTA downloader, from a domain impersonating a Ukrainian research institute. GTIG

    disabled the cloud projects; UNC5976 spun up at least twelve new domains within roughly three months

    and GTIG now assesses it is migrating part of its phishing infrastructure off Google to other providers.


    The strategic point for a government SOC is GTIG''s own framing of the visibility gap: the targeted

    accounts are usually personal rather than corporate domain-joined, and initial outreach increasingly

    arrives over encrypted messengers rather than corporate mail -- so the organisation often has no

    telemetry covering either the lure or the account that gets compromised, while the compromised

    personal account is then used to phish colleagues from a legitimate, trusted identity.

    '
  region_nexus: 'Europe generally, and the United States. Named in the post: Ukraine (targeting geography
    for UNC7005 and UNC5976; location of the impersonated research institute), Armenia (UNC5976), Finland
    (only as the spoofed Finnish Operations Center, a NATO-context defence-industry support body), Poland
    (only as a credited partner, SKW). Switzerland is NOT named; the Swiss nexus is profile-match to GTIG''s
    stated European target set (government, academia, defence, think tanks), not a named victim.'
