- target: findings.S4.yaml
  item: Kairos / Velilla
  field: summary (ransomware vs data-theft-only)
  severity: medium
  s4_says: characterises Kairos as data-theft-only, "no encryptor/locker binary has ever been confidently
    linked to it"
  primary_says: 'An unresolved contradiction inside EscudoDigital''s own May article: its headline is
    "Un ataque de ransomware al Ayuntamiento de Valdemoro..." and the Velilla article repeats "el ataque
    de ransomware contra el Ayuntamiento de Valdemoro", while the same May article''s body cites Ransomware.live
    saying the group "se centra en el robo de datos sin encriptacion". Valdemoro''s own quoted communique
    describes a network incident and precautionary server disconnection, never encryption.'
  fix: Do NOT silently resolve this in either direction. Report that EscudoDigital labels Valdemoro a
    ransomware attack while its own cited background describes Kairos as encryption-free, and note that
    precautionary server disconnection produces the same outage symptoms as encryption -- the likely origin
    of the label. The registry's data-theft-only characterisation is defensible but should be attributed.
