  evidence:
  - quote: Google Threat Intelligence Group (GTIG) is tracking three distinct suspected Russian cyber
      espionage threat clusters abusing legitimate authentication flows to target individuals working
      in academia, aerospace and defense, governments and think tanks across Europe, as well as academia
      and think tanks within the United States.
    attribution: Google Threat Intelligence Group
    source_url: https://cloud.google.com/blog/topics/threat-intelligence/distinct-clusters-target-individuals-of-interest-to-russia/
  - quote: UNC7005 (aka STORM-2945) is a threat cluster identified in February 2026 that primarily targets
      academia, diplomatic, and nonprofit personnel across Ukraine, Western Europe, and the US
    attribution: Google Threat Intelligence Group
    source_url: https://cloud.google.com/blog/topics/threat-intelligence/distinct-clusters-target-individuals-of-interest-to-russia/
  - quote: GTIG assesses with high confidence that these three threat clusters - UNC6293, UNC7005, and
      UNC5976 - possess a Russian nexus, based on high-level targeting patterns, phishing themes, and
      shared operational techniques.
    attribution: Google Threat Intelligence Group
    source_url: https://cloud.google.com/blog/topics/threat-intelligence/distinct-clusters-target-individuals-of-interest-to-russia/
  - quote: We assess with moderate confidence that UNC6293 is a sub cluster of ICE RELIC (formerly APT29)
      responsible for initial access operations
    attribution: Google Threat Intelligence Group
    source_url: https://cloud.google.com/blog/topics/threat-intelligence/distinct-clusters-target-individuals-of-interest-to-russia/
  - quote: Similarly we assess with moderate confidence that UNC7005 is another initial access cluster
      connected to ICE RELIC.
    attribution: Google Threat Intelligence Group
    source_url: https://cloud.google.com/blog/topics/threat-intelligence/distinct-clusters-target-individuals-of-interest-to-russia/
  - quote: UNC5976 remains distinct from the UNC6293 and UNC7005 clusters, potentially reflecting differing
      strategic mandates and potential alignment with alternative Russian intelligence services.
    attribution: Google Threat Intelligence Group
    source_url: https://cloud.google.com/blog/topics/threat-intelligence/distinct-clusters-target-individuals-of-interest-to-russia/
  - quote: In cases of app password phishing, attackers attempt to convince targets to set specific app
      passwords on their accounts, which the attackers then use to gain access to those accounts without
      needing two-factor authentication (2FA).
    attribution: Google Threat Intelligence Group
    source_url: https://cloud.google.com/blog/topics/threat-intelligence/distinct-clusters-target-individuals-of-interest-to-russia/
  - quote: While in 2025, the attacker requested that the victims share the app password back to them
      via email, in these newer operations, the attacker asked for it to be entered into an authentication
      form on an otherwise legitimate looking website.
    attribution: Google Threat Intelligence Group
    source_url: https://cloud.google.com/blog/topics/threat-intelligence/distinct-clusters-target-individuals-of-interest-to-russia/
  - quote: By providing the requested verification code the target would grant UNC6293 access to the account.
    attribution: Google Threat Intelligence Group
    source_url: https://cloud.google.com/blog/topics/threat-intelligence/distinct-clusters-target-individuals-of-interest-to-russia/
  - quote: UNC7005 also conducts device code phishing operations for both Microsoft and WhatsApp accounts.
    attribution: Google Threat Intelligence Group
    source_url: https://cloud.google.com/blog/topics/threat-intelligence/distinct-clusters-target-individuals-of-interest-to-russia/
  - quote: Upon accessing the webpage, the target’s system is fingerprinted, likely to check for an automated
      scanner accessing the page.
    attribution: Google Threat Intelligence Group
    source_url: https://cloud.google.com/blog/topics/threat-intelligence/distinct-clusters-target-individuals-of-interest-to-russia/
  - quote: This time, UNC7005 included a script in the main registration page to attempt to detect and
      evade automated analysis efforts.
    attribution: Google Threat Intelligence Group
    source_url: https://cloud.google.com/blog/topics/threat-intelligence/distinct-clusters-target-individuals-of-interest-to-russia/
  - quote: The phone number is used to create a legitimate WhatsApp device link request with the attacker
