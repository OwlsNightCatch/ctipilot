- title: 'GTIG: three Russian-nexus clusters (UNC6293, UNC7005/Storm-2945, UNC5976) compromise European
    government, defence and academic targets by walking victims through legitimate authentication flows
    -- app passwords, device codes, WhatsApp device linking and OAuth redirects into unverified cloud
    projects'
  sources:
