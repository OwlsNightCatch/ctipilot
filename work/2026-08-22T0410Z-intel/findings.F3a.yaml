quote_verification:
  method: Every quote in this file was checked as a contiguous literal substring (Python 'in', equivalent
    to grep -F) against the body fetched in this run and saved to disk. No ellipses, no splicing of non-adjacent
    sentences, no re-hedging or de-hedging.
  reference_bodies:
    gtig: work/2026-08-22T0410Z-intel/gtig_inline.txt (tag-stripped from gtig_full.html with inline elements
      kept contiguous, so quotes spanning a hyperlink verify correctly; gtig_text.txt breaks link-spanning
      sentences onto separate lines and gives false negatives)
    velilla_ayto: work/2026-08-22T0410Z-intel/velilla_inline.txt (tag-stripped from velilla_ayto.txt)
    escudo_velilla: work/2026-08-22T0410Z-intel/escudo_body.txt (JSON-LD articleBody -- the article body
      is NOT in the server-rendered HTML on this host; the tag-stripped page yields only the title)
    escudo_valdemoro: work/2026-08-22T0410Z-intel/valdemoro_body.txt (JSON-LD articleBody, same reason)
  results: 68 GTIG candidate quotes checked, 67 PASS; 28 Spanish candidate quotes checked, 27 PASS. Both
    failures were deliberate apostrophe/quote-mark probes and both resolved the trap the spawn warned
    about (see character_traps). Every quote carried in items[].evidence PASSED.
  character_traps_found:
  - GTIG uses a STRAIGHT apostrophe in "the attacker's WhatsApp device" -- the same sentence retyped with
    a curly apostrophe FAILS. Verified both directions.
  - GTIG uses CURLY apostrophes in "the target’s system is fingerprinted", "the target’s field", "the
    target’s User Agent", "the group’s geographic targeting", "UNC7005’s use of MaaS", "GTIG’s observation"
    -- these must stay curly.
  - GTIG uses CURLY double quotes around “verification code”, “fails”, “unverified app”, “linked devices”,
    “Summit Companion App”, “embassy invite”, “Only Security Keys”, “Embassy security policy”.
  - 'The attribution sentence uses PLAIN HYPHENS as dashes: "these three threat clusters - UNC6293, UNC7005,
    and UNC5976 - possess a Russian nexus". An em dash FAILS.'
  - GTIG has a missing full stop after "Ukraine, Western Europe, and the US" (the source reads "...and
    the US Although this group shares..."). The quote carried here stops at "the US" -- do not add a period
    inside the quotation.
  - EscudoDigital's Valdemoro article uses STRAIGHT double quotes around "informacion personal y sensible";
    the curly variant FAILS. The evidence quote carried here stops before that clause to avoid the trap
    entirely.
  - EscudoDigital bodies contain non-breaking spaces; none fall inside the quotes carried here (all verified).
  - EscudoDigital's Valdemoro article contains the source's own typos "consitorio" (for consistorio) and,
    in the Velilla article, "el Ayuntamiento,q ue ha confirmado" -- preserve verbatim if quoted, or avoid.
  spelling_notes:
  - GTIG spells the vendor "Reliaquest" (not ReliaQuest) and "sub cluster" as two words in the UNC6293
    sentence, "subcluster" as one word in the ICE RELIC section. Quote as printed.
  - The Velilla claimed volume is "77,6 GB" in Spanish notation = 77.6 GB. The article's URL slug reads
    "776-gb" -- a slug artefact, not a second figure.
  - The Valdemoro claimed volume is written "1,8TB" with no space = 1.8 TB.
