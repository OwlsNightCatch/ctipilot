    \   (DNS) requests showing captive portal redirects to attacker-controlled login pages spoofing\n\
    \   Microsoft authentication resources. Later, on July 31, 2026, Microsoft detailed Midnight Blizzard\n\
    \   activity leveraging captive portals on hospitality sector networks to serve malware or gain access\n\
    \   to Microsoft accounts via device code phishing.\"\n - GTIG's own added contribution (this is the\
