  summary: 'The Ayuntamiento de Velilla de San Antonio, a municipality in the Community of Madrid, published
    a

    statement on 2026-08-21 confirming that it "has detected a security incident that could have allowed

    the exposure of certain information hosted in its computer systems" -- and explicitly declining to

    confirm the theft: "The investigation remains open and, for the time being, it cannot be confirmed

    that effective access to or extraction of data has occurred." Municipal services are stated to be

    running normally, security protocols were activated, protection and monitoring measures reinforced,

    and the incident was reported "to the Centro Criptologico Nacional and to the competent authorities".

    The Madrid regional cybersecurity agency (Agencia de Ciberseguridad de la Comunidad de Madrid) is

    described as having OFFERED technical and coordination support under the regional incident-response

    model -- not as a notified authority. The statement names no threat actor, no data volume, no data

    categories, no affected-person count and no access vector, and commits to updating as information

    becomes available. It also carries a citizen-advice block (phishing caution, password changes, bank

    contact, INCIBE helpline 017, police report) which itself refers to "the cyberattack reported by the

    Ayuntamiento de Velilla de San Antonio" -- so the municipality does use the word cyberattack while

    withholding confirmation of data exfiltration.


    The volume and data categories come solely from the criminal claim, relayed by EscudoDigital

    (2026-08-21, byline Juan Carlos De la Torre): Kairos claims to have accessed the municipal

    infrastructure and taken 77.6 GB (Spanish notation "77,6 GB"; the article''s own URL slug renders
    it as

    "776-gb"), allegedly including administrative and personnel records, electronically signed official

    documents, municipal motions, personal data and national identity documents (DNI). EscudoDigital is

    explicit that the claim reached it via threat-monitoring platforms rather than its own view of a leak

    site, and that it contacted the Ayuntamiento and subsequently obtained the official communication
    --

    i.e. original reporting, not a rewrite.


    The prior Kairos claim against another Community of Madrid municipality is confirmed, but from a

    DIFFERENT EscudoDigital article (2026-05-12) than the one cited in findings.S4.yaml: the Ayuntamiento

    de Valdemoro detected a network incident affecting its servers on 5 May 2026, disconnected servers
    as

    a precaution, fell back to manual paper registry work, and notified the CCN; its own communique

    disclosed neither the nature of the data nor the number of people affected. Kairos claimed 1.8 TB

    there, allegedly including police reports, citizens'' DNIs, administrative files and official municipal

    documents. EscudoDigital itself cautions that the shared actor and shared region "does not by itself

    allow any relationship to be established between the two incidents". Note an internal contradiction
    in

    that May article that must not be smoothed over: its headline calls Valdemoro a ransomware attack,

    while its body cites Ransomware.live describing Kairos as focused on data theft without encryption.

    No source in either case states an access vector.

    '
