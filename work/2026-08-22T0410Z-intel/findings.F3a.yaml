  extended_notes: "\n=== THE MUNICIPALITY'S OWN WORDS -- WHAT IS AND IS NOT CONFIRMED ===\nSource: https://ayto-velilla.es/posible-exposicion-de-informacion-en-los-sistemas-del-ayuntamiento-de-velilla-de-san-antonio/\n\
    Title: \"Posible exposicion de informacion en los sistemas del Ayuntamiento de Velilla de San Antonio\"\
    \nDated on page: \"21 Ago, 2026\" | Categories: Atencion al ciudadano, Noticias\n\nCONFIRMED by the\
    \ municipality (Spanish verbatim -> faithful English):\n 1. Detection of an incident, with the exposure\
    \ framed as a possibility only:\n    ES: \"El Ayuntamiento de Velilla de San Antonio ha detectado\
    \ una incidencia de seguridad que podria\n        haber permitido la exposicion de determinada informacion\
    \ alojada en sus sistemas informaticos.\"\n    EN: \"The Ayuntamiento de Velilla de San Antonio has\
    \ detected a security incident that could have\n        allowed the exposure of certain information\
    \ hosted in its computer systems.\"\n 2. Scoping work under way:\n    ES: \"En estos momentos se estan\
    \ realizando las actuaciones necesarias para determinar el alcance y\n        la naturaleza de la\
    \ informacion potencialmente afectada.\"\n    EN: \"The necessary actions are currently being carried\
    \ out to determine the scope and the nature of\n        the potentially affected information.\"\n\
    \ 3. Notification (subheading and body):\n    ES: \"La incidencia ya ha sido notificada al Centro\
    \ Criptologico Nacional.\"\n    EN: \"The incident has already been reported to the National Cryptologic\
    \ Centre.\"\n    ES: \"Todo ello ha sido notificado al Centro Criptologico Nacional y a las autoridades\
    \ competentes.\"\n    EN: \"All of this has been reported to the National Cryptologic Centre and to\
    \ the competent authorities.\"\n 4. Service continuity and containment:\n    ES: \"La incidencia no\
