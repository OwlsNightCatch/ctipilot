    aliases: []
    summary: GTIG-tracked initial-access cluster that GTIG assesses with MODERATE confidence is a sub
      cluster of ICE RELIC (formerly APT29). Impersonates US State Department officials in small-volume
      campaigns (usually fewer than five users at a time) with diplomatic and conference themes; phishes
      app-specific passwords via PDF lures carrying settings screenshots, and since June 2026 also runs
      OAuth phishing in which the target is asked to hand back the post-login redirect URL or verification
      code (Google Threat Intelligence Group, 2026-08-20).
  - key: actor:unc5976
    type: actor
    name: UNC5976
    aliases: []
    summary: Suspected Russian cyber-espionage cluster with an authentication focus, tracked by GTIG since
      March 2026 and held DELIBERATELY DISTINCT from the ICE RELIC-linked clusters, with GTIG noting 'potential
      alignment with alternative Russian intelligence services'. Automates OAuth token collection by buying
      file-sharing-themed domains, creating matching cloud projects, and hosting scripts that scrape the
      authentication token out of the post-authentication redirect URL for later operator retrieval. Also
      delivered the HEADRUSH malicious Excel plugin. Uses dedicated post-compromise infrastructure rather
      than residential proxies and carries a heavier malware footprint. Targeting centred on military,
      aerospace, defence industrial base and NGOs/think tanks, geographically on Ukraine and Armenia (Google
      Threat Intelligence Group, 2026-08-20).
