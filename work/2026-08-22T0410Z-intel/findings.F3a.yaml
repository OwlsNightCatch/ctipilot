    attribution: Google Threat Intelligence Group
    source_url: https://cloud.google.com/blog/topics/threat-intelligence/distinct-clusters-target-individuals-of-interest-to-russia/
  - quote: After the target successfully links their account to the attacker's WhatsApp device, the phishing
      page displays an additional prompt to the user to either join a voice call, encrypted chat, or download
