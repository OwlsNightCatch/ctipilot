    attribution: Google Threat Intelligence Group
    source_url: https://cloud.google.com/blog/topics/threat-intelligence/distinct-clusters-target-individuals-of-interest-to-russia/
  - quote: If the target joins the voice call, malicious JavaScript to record target audio and video is
      triggered. The webpage presents a fake voice call with a ring for a limited amount of time while
