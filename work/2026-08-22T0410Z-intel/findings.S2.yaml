          summary: "Compromise of the Martigny-Combe (Valais, Switzerland) communal secretariat email account, initial access ~2026-08-10, detected 2026-08-18, used to mass-mail a fraudulent message to municipal contacts; ~300 emails with sensitive data reportedly taken (Le Nouvelliste, ICTjournal, 2026-08-20/21)." }
    relation_suggestions: []
