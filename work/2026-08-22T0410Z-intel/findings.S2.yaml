      - quote: "La messagerie du secrétariat communal de Martigny-Combe a été piratée. Des courriels ont été récupérés et un message frauduleux a été massivement envoyé à des contacts de la commune le 18 août."
        attribution: "Le Nouvelliste"
        source_url: "https://www.lenouvelliste.ch/valais/bas-valais/martigny-district/martigny-combe-commune/cyberattaque-a-la-commune-de-martigny-combe-300-courriels-contenant-des-donnees-sensibles-ont-ete-voles-1511002"
      - quote: "L'attaque remonte au 10 août."
        attribution: "Le Nouvelliste (image caption)"
        source_url: "https://www.lenouvelliste.ch/valais/bas-valais/martigny-district/martigny-combe-commune/cyberattaque-a-la-commune-de-martigny-combe-300-courriels-contenant-des-donnees-sensibles-ont-ete-voles-1511002"
    extended_notes: |
      Triage-relevant pattern: an eight-day gap between initial mailbox compromise (10 Aug) and
      the detection-triggering event (the mass fraudulent send on 18 Aug) is the operationally
      interesting fact — the attacker had standing access to a live municipal mailbox for over a
      week before doing anything that produced an alertable signal, meaning normal recipients would
      have had no indicator during that window. Hunt concept: for small-municipality mail
      environments without dedicated SOC coverage, the discriminating signal is anomalous
      send-volume/recipient-fan-out from a single mailbox (a "the whole address book at once"
      pattern) against that mailbox's historical baseline, plus any mail-rule or forwarding-rule
      creation in the days prior — neither confirmed present here but a standard BEC-persistence
      check. This is the second disclosed Valais communal-administration compromise in 2026,
      following the Vétroz ransomware incident, reinforcing that Swiss small-municipality IT
      remains a soft, resource-constrained target even where no ransomware is deployed.
    watchlist: []
    borderline: false

