  - title: "Kairos data-extortion actor claims a second Madrid-region municipal government in three months — Ayuntamiento de Velilla de San Antonio confirms 'possible exposure', not yet a confirmed breach"
    sources:
      - { url: "https://ayto-velilla.es/posible-exposicion-de-informacion-en-los-sistemas-del-ayuntamiento-de-velilla-de-san-antonio/", publisher: "Ayuntamiento de Velilla de San Antonio (victim's own statement)", date: "2026-08-21", role: "primary" }
