      - { url: "https://www.adslzone.net/noticias/seguridad/ayuntamiento-velilla-madrid-hackeo-dni/", publisher: "ADSLZone", date: "2026-08-21", role: "corroborating" }
    discovery_trace: "first seen at: ransomware-live (core slice), URL https://api.ransomware.live/v2/recentvictims (leak-site entry: 'Ayuntamiento de Velilla de San Antonio' claimed by 'kairos', attackdate 2026-08-20T00:00:00Z) → pivot: WebSearch (\"Ayuntamiento Velilla San Antonio ciberataque kairos ransomware\") → primary: victim's own statement, URL https://ayto-velilla.es/posible-exposicion-de-informacion-en-los-sistemas-del-ayuntamiento-de-velilla-de-san-antonio/ → corroborating: EscudoDigital, URL https://www.escudodigital.com/ciberseguridad/kairos-asegura-haber-robado-776-gb-de-datos-del-ayuntamiento-de-velilla-de-san-antonio.html"
    summary: |
      Kairos, a data-theft-only extortion actor tracked in this registry as actor:kairos-extortion (leverage rests entirely on the threat to publish exfiltrated data — no encryptor/locker binary has ever been confidently linked to it), claimed on its leak site around 2026-08-20 to have exfiltrated 77.6 GB from the Ayuntamiento de Velilla de San Antonio, a municipality of roughly 7,000 residents in the Community of Madrid, Spain. The claimed data includes administrative and personnel records, electronically-signed official documents, municipal council motions, and citizens' national identity documents (DNI). The municipality's own statement, published 2026-08-21, confirms it detected "a security incident that could have allowed exposure of information in its computer systems" but is explicit that "the investigation remains open and, for now, effective data access or extraction cannot be confirmed" — i.e. incident detection is confirmed, data theft is not. The municipality has notified Spain's Centro Criptológico Nacional (CCN) and the Madrid Regional Cybersecurity Agency, reinforced monitoring, and states municipal services continue operating normally. This is Kairos's second confirmed Madrid-region municipal target in three months: EscudoDigital's own reporting places an earlier Kairos claim against the Ayuntamiento de Valdemoro in May 2026, where the group claimed 1.8 TB including police reports, DNIs and municipal documentation. No entry vector has been disclosed for either incident. No CVE applies — this is a threat-actor targeting pattern against small/mid-size municipal administrations rather than a specific software flaw.
    region_nexus: "Spain (EU member state); actor has now targeted two Community of Madrid municipal governments within three months — directly transferable to Swiss cantonal/communal administration, which shares the same profile (small IT teams, resident PII including national-ID-equivalent data, statutory disclosure duties)"
