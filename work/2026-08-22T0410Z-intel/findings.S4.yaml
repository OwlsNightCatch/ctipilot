    extended_notes: |
      Defender takeaway for cantonal/communal IT: Kairos's documented model (per Ransom-ISAC's 2026-07-03 case study of a ~$1M payout by a small US county government, cited in the existing registry entry) is to buy initial access from brokers rather than exploit a named vulnerability, then exfiltrate before any extortion contact — meaning the detection surface is anomalous outbound data-transfer volume from line-of-business/records-management systems and unfamiliar authenticated sessions, not a patchable CVE. Neither Velilla nor Valdemoro has disclosed an entry vector, which itself is a detection gap worth naming: municipalities with small security teams may not have the log retention to reconstruct initial access after the fact. Triage note: a "possible exposure, not confirmed" victim statement combined with a specific claimed data volume on a leak site is the expected early shape of a data-theft-only extortion case (no encryption to trigger immediate detection) — treat the absence of ransomware/encryption symptoms as consistent with, not contrary to, an active Kairos-style intrusion.
