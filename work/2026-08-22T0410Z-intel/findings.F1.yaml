# ============================================================
# F1-e. misp-stix CVEs (CIRCL)
# ============================================================
  - id: F1-e
    title: "misp-stix three CVEs — mechanism, fields and 100MB cap all confirmed verbatim from GHSA/NVD text; third CVE (CVE-2026-77761) has NO GHSA record found, only an NVD/CIRCL CNA container; no tagged release since 2026.7.8 confirmed independently via GitHub Releases AND PyPI"
    sources:
      - { url: "https://github.com/advisories/GHSA-pqpx-w6cx-7q9c", publisher: "GitHub Security Advisory / CIRCL — CVE-2026-77710", date: "2026-08-21", role: "primary" }
      - { url: "https://github.com/advisories/GHSA-65gx-wjvj-88j8", publisher: "GitHub Security Advisory / CIRCL — CVE-2026-77755", date: "2026-08-21", role: "primary" }
      - { url: "https://nvd.nist.gov/vuln/detail/CVE-2026-77761", publisher: "NVD / CIRCL CNA — CVE-2026-77761", date: "2026-08-21", role: "primary" }
      - { url: "https://github.com/MISP/misp-stix/releases", publisher: "GitHub Releases (MISP/misp-stix)", date: "2026-08-22 (checked)", role: "corroborating" }
      - { url: "https://pypi.org/project/misp-stix/#history", publisher: "PyPI release history", date: "2026-08-22 (checked)", role: "corroborating" }
    discovery_trace: "attempted api.github.com JSON for GHSA-pqpx-w6cx-7q9c and GHSA-65gx-wjvj-88j8 (403 after the first successful PTC call, rate-limited) → fell back to WebFetch directly on the github.com/advisories HTML pages (succeeded, full description text extracted) → WebSearch for the third CVE's GHSA id ('\"CVE-2026-77761\" GHSA misp-stix github advisories') found none → checked the repo's own Security Advisories tab (github.com/MISP/misp-stix/security/advisories — shows zero published advisories, confirming these GHSA ids were populated via the GitHub Advisory Database curation pipeline from the CVE record, not natively authored in-repo) → fell back to NVD's CIRCL-sourced CNA container for CVE-2026-77761 as the authoritative primary instead → checked GitHub Releases and PyPI independently for the current tagged-release state"
    mechanism_confirmed: |
      CVE-2026-77710 trust-decision bypass — CONFIRMED, GHSA-pqpx-w6cx-7q9c (fetched via WebFetch, full description read): the parser-selection logic decided "MISP-native" origin from attacker-controlled markers (STIX2 MISP-specific tool labels; STIX1 document title) — both fully producer-controlled and therefore untrustworthy (CWE-807: untrusted value drives a security-relevant trust decision). When classified as MISP-native, the code copied the ENTIRE x_misp_attributes dictionary directly into misp_object.add_attribute() with no allow-list (CWE-915: dynamically assigning externally-supplied object properties without restricting to an expected set) — confirmed explicitly naming the three requested fields plus a fourth catch-all: "a crafted STIX bundle could supply fields that were not part of the expected STIX-to-MISP round-trip format, including security-sensitive properties such as distribution, sharing_group_id, tags, or other MISP attribute fields." Two commits referenced: github.com/MISP/misp-stix/commit/3e5e7bda and .../66c654b9. CVSS4.0 6.9 MODERATE, vector CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:L/VI:L/VA:N/SC:N/SI:N/SA:N (matches S1's cve_table figure). CWE tags: BOTH CWE-915 and CWE-807 (S1 only cited "CWE-915/CWE-807" in its title parenthetical for the wrong CVE grouping — worth double-checking against the published entry draft that these two CWEs stay attached to CVE-2026-77710 specifically).
      CVE-2026-77755 DoS — CONFIRMED, GHSA-65gx-wjvj-88j8 (WebFetch, full description read): sys.exit() calls on parse-failure paths raise SystemExit (subclasses BaseException, not Exception) so callers' normal exception handlers don't catch it — confirmed verbatim. Separately, no input-size limit was enforced before parsing, so "processing could consume approximately two to seven times the input size in memory" (verbatim). Fix: "replace process-terminating sys.exit() calls with catchable exceptions such as STIXLoadingError and MissingSTIXContentError" and "enforces an input-size limit before parsing. The default maximum is 100 MB, can be adjusted by callers, and can explicitly be disabled when required" (verbatim) — CONFIRMS S1's "100MB" figure exactly, sourced to the advisory's own fix description, not an inference. CVSS4.0 8.7 HIGH (matches S1). CWE-400 (Uncontrolled Resource Consumption). Two commits: .../commit/66119552 and .../commit/e8e732ad.
      CVE-2026-77761 parser-state contamination — CONFIRMED via NVD's CIRCL-sourced CNA container (no GHSA record locatable this run — see below): galaxy/galaxy-cluster data, passive-DNS bookkeeping, package titles, dates and timestamps can survive parser reuse across independent STIX documents; affects only long-lived-parser-reuse callers of the misp-stix API directly, NOT normal one-parser-per-file conversion entry points (explicitly stated, grep-verified). CVSS4.0 6.3 MEDIUM (CVSS-B, per CNA=CIRCL), vector CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:L/VI:L/VA:N/SC:N/SI:N/SA:N — matches S1's cve_table figure (6.3) exactly. CWE-459 (Incomplete Cleanup) — NOT previously stated by S1. Three commits: .../commit/ad4f0a65.patch, .../commit/f08373dd, .../commit/f6593931. Structured affected-range from the CNA container: {version: "0", lessThanOrEqual: "2026.7.8", status: "affected"} — i.e. ALL released versions up to and including the current latest tag (2026.7.8) are affected.
    third_ghsa_not_found: |
      Could not locate a GHSA id for CVE-2026-77761 this run despite (a) a targeted WebSearch for the CVE id plus 'GHSA misp-stix github advisories' and (b) checking the misp-stix repository's own Security Advisories tab directly (github.com/MISP/misp-stix/security/advisories), which currently shows "There aren't any published security advisories" for the repo — indicating these three CVEs' GHSA records (where they exist) were populated via GitHub's separate Advisory Database curation pipeline rather than natively authored in-repo, and CVE-2026-77761 in particular may not have been mirrored into GHSA at all as of this run. NVD's CIRCL-sourced CNA container is used as the primary instead — this is itself a first-party CNA source (CIRCL is the CVE Numbering Authority for MISP-project vulnerabilities and Luxembourg's national CERT), not a downgrade in source quality.
    release_state_confirmed: |
      Independently confirmed via BOTH GitHub Releases (github.com/MISP/misp-stix/releases) and PyPI (pypi.org/project/misp-stix/#history): the current, most recent tagged/published release remains 2026.7.8 (released 8 July 2026 per GitHub Releases' own date and PyPI's own upload-history date — note this is 8 July, not 9 July as S1's finding stated; S1 was off by one day). No release newer than 2026.7.8 exists as of this run (2026-08-22), and neither release history mentions any of the three CVEs by number. This means NONE of the three fixes (CVE-2026-77710, -77755, -77761) are in any pip-installable release yet — confirmed independently rather than inferred from the advisories' own silence on a fixed version, strengthening S1's claim to a dual-source confirmation.
    corrections:
      - "misp-stix's last tagged release date is 8 July 2026, not 9 July 2026 as S1 stated (minor, but worth fixing for precision) — confirmed independently via both GitHub Releases and PyPI, which agree with each other."
      - "No GHSA record for CVE-2026-77761 could be located this run; use the NVD/CIRCL CNA container as the primary source for that CVE instead of implying a third GHSA exists to be found."
      - "CVE-2026-77761's CWE is CWE-459 (Incomplete Cleanup) — not previously stated by S1."
      - "The 100MB default input-size cap IS the advisory's own stated fix detail, not an inference — confirmed verbatim in GHSA-65gx-wjvj-88j8's fix description, alongside the 2-7x memory-multiplier figure, also verbatim."
    verification: MULTI-SOURCE
    confidence: HIGH
    evidence:
      - quote: "A parser state isolation vulnerability in misp-stix could cause data from a previously processed STIX document to be retained and incorporated into the MISP event generated from a subsequent document when the same parser instance is reused."
        attribution: "NVD / CIRCL CNA (CVE-2026-77761 description)"
        source_url: "https://nvd.nist.gov/vuln/detail/CVE-2026-77761"
        grep_check: "MATCH — verified against nvd_77761_text.txt"
      - quote: "The issue primarily affects applications using the misp-stix API directly and reusing parser instances across independent STIX documents. Normal conversion entry points that instantiate a new parser for each file are not affected by this particular reuse scenario."
        attribution: "NVD / CIRCL CNA (CVE-2026-77761 description)"
        source_url: "https://nvd.nist.gov/vuln/detail/CVE-2026-77761"
        grep_check: "MATCH — verified against nvd_77761_text.txt"
      - quote: "a crafted STIX bundle could supply fields that were not part of the expected STIX-to-MISP round-trip format, including security-sensitive properties such as distribution, sharing_group_id, tags"
        attribution: "GitHub Security Advisory GHSA-pqpx-w6cx-7q9c (CIRCL)"
        source_url: "https://github.com/advisories/GHSA-pqpx-w6cx-7q9c"
        grep_check: "NOT grep-verified — WebFetch extraction only (raw HTML unobtainable this run: direct fetch 403, jina pool credit-exhausted)."
      - quote: "Because SystemExit inherits from BaseException rather than Exception, these failures bypassed the exception handlers used by callers of the library."
        attribution: "GitHub Security Advisory GHSA-65gx-wjvj-88j8 (CIRCL)"
