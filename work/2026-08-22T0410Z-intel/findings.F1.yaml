    discovery_trace: "fetched BSI CSAF JSON via tools/fetch_source.py bsi-csaf WID-SEC-2026-2963 (structured product_tree/product_status/vulnerabilities read directly) → attempted GHSA HTML pages via tools/fetch_source.py url (403 direct + jina pool exhausted, both failed) → escalated to WebFetch tool directly on the same github.com/advisories URLs (succeeded) and api.github.com/advisories/<id> JSON (succeeded for one, then rate-limited/403'd on repeats) → OSV lookups attempted for all three GHSA ids and all three CVE ids (all HTTP 404 — PTC Windchill is not an OSV-tracked ecosystem) → WebSearch for a Cl0p linkage found none"
    bsi_csaf_structured_findings: |
      BSI's CSAF product_tree gives ONE concrete, version-bound answer: CVE-2026-77644 → product_status.known_affected = T058482 = "PTC Windchill Risk and Reliability (WRR) Enterprise Edition <13.1.0.1"; the product_tree separately lists a sibling entry T058482-fixed = "Risk and Reliability (WRR) Enterprise Edition 13.1.0.1" (BSI's standard '-fixed' product-id convention denoting the remediating version, though this record carries no formal remediations[] block). THIS CORRECTS S1's blanket "not confirmed this run (vendor portal auth-gated)" for at least CVE-2026-77644 — the fixed version (13.1.0.1) WAS obtainable this run via BSI's structured CSAF data, without needing PTC's auth-gated portal.
      For CVE-2026-77645 and CVE-2026-77646, BSI's product_status.known_affected references ONLY generic, version-less product identifiers (T058484 "PTC FlexPLM" cpe:/a:ptc:flexplm:-, T058483 "PTC Windchill" cpe:/a:ptc:windchill:-, T058485 "PTC Windchill PDMLink" cpe:/a:ptc:windchill:pdmlink) — no version range and no fixed-version sibling entry exists in this CSAF record for either CVE. So for these two, "not confirmed this run" remains accurate even after the deep read.
    ghsa_structured_findings: |
      Confirmed via the GitHub Advisory REST API JSON directly (api.github.com/advisories/GHSA-5hvp-9mcx-5245): the advisory's "vulnerabilities" array — the field that would normally carry package/ecosystem/vulnerable_version_range/first_patched_version — is EMPTY for all three PTC GHSA records (confirmed for GHSA-5hvp-9mcx-5245 via direct API JSON; GHSA-qxmv-9q88-wwmw and GHSA-2698-qwmx-3r6f confirmed the same via the rendered HTML page, which showed "Affected Versions: Unknown / Patched Versions: Unknown"). This is a genuine, structural gap in PTC's own advisory data — not a fetch failure or summarisation artefact — because PTC published these as non-ecosystem/custom GHSA records with no package registry to bind a version range to. PTC's own support articles (CS474818 for CVE-2026-77644; CS474826 covering BOTH CVE-2026-77645 AND CVE-2026-77646 — note ONE article covers two CVEs) remain the only place with real fixed-version numbers, and remain unreachable this run (OIDC-gated; direct fetch 403, jina exhausted).
      CVSS confirmed per-CVE from the GHSA record itself (CNA = PTC):
        CVE-2026-77644: CVSS4.0 9.3 CRITICAL, vector CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N/.../U:Red. CWE-306 (Missing Authentication for Critical Function) — matches S1.
        CVE-2026-77645: CVSS4.0 9.2 CRITICAL, vector CVSS:4.0/AV:N/AC:H/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:L/SI:L/SA:L/.../U:Red. CWE tag is CWE-20 ONLY (Improper Input Validation) — S1 hedged "CWE-20/CWE-502"; the GHSA's own structured cwe_ids array carries only CWE-20, even though the free-text description says the flaw "may be exploited through the deserialization of untrusted data" (the CWE-502 mechanism). Correction: report CWE-20 as the advisory's own classification, and note the deserialization mechanism as description text, not as a second official CWE tag.
        CVE-2026-77646: CVSS4.0 7.7 HIGH, vector CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:N/SC:H/SI:N/SA:N/.../U:Red. CWE-502 (Deserialization of Untrusted Data) — matches S1.
      CORRECTION on the "Urgency: Red" flag: this is a CVSS4.0 Supplemental Metric (U:Red = Provider Urgency: Red) baked into the CNA's (PTC's) own published vector string — it appears on ALL THREE CVEs identically (U:Red on 77644, 77645, AND 77646), not a unique NVD-added annotation on CVE-2026-77645 alone as S1's summary implied ("NVD's supplemental CVSS metadata separately flags it 'Urgency: Red'"). It is PTC's own supplemental metric, common to all three, not NVD-specific and not unique to one CVE.
    clop_link_check: |
      No source found linking any of these three new CVEs to the Cl0p extortion campaign. A targeted WebSearch for the three CVE ids alongside "Cl0p" returned only unrelated hits and one explicit statement (search-engine synthesis of results, treat as directional not a citable quote) that the ongoing Cl0p campaign's exploited vulnerability remains the previously-known CVE-2026-12569, distinct from these three 2026-08-20 disclosures. This CONFIRMS the main agent's planned "no confirmed link" framing is correct and can be stated with confidence rather than hedged as an open question.
    corrections:
      - "CVE-2026-77644's fixed version (13.1.0.1) IS available this run via BSI's structured CSAF product_tree — S1's blanket 'not confirmed this run (vendor portal auth-gated)' should be narrowed to apply only to CVE-2026-77645 and CVE-2026-77646, which genuinely remain unconfirmed after this deep read too."
      - "CVE-2026-77645's advisory-tagged CWE is CWE-20 only, not 'CWE-20/CWE-502' — the deserialization mechanism is description prose, not a second official CWE classification on this GHSA record."
      - "The CVSS4.0 'U:Red' (Provider Urgency: Red) supplemental metric is common to all three CVEs' PTC-published vectors, not a unique NVD-added flag on CVE-2026-77645 alone."
      - "Confirmed (not merely assumed): no source ties these three new CVEs to the ongoing Cl0p Windchill extortion campaign, which remains anchored to the earlier CVE-2026-12569."
