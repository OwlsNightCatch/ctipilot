        attribution: "SPIP maintenance team (4.4.21 blog post)"
        source_url: "https://blog.spip.net/Mise-a-jour-critique-de-securite-sortie-de-SPIP-4-4-21.html"
        grep_check: "MATCH — verified against spip_blog.txt"
      - quote: "Cette version corrige une vulnérabilité universelle (sans conditions) pré-authentification RCE qui touche toutes les versions de SPIP."
        attribution: "SPIP maintenance team (4.4.20 blog post)"
        source_url: "https://blog.spip.net/Mise-a-jour-critique-de-securite-sortie-de-SPIP-4-4-20.html"
