# ============================================================
# F1-a. TrueConf Server CVE-2026-72529 + CVE-2026-72530
# ============================================================
items:
  - id: F1-a
    title: "TrueConf Server pre-auth RCE chain — deep-read verification of Kaspersky ICS CERT primaries"
    sources:
      - { url: "https://ics-cert.kaspersky.com/advisories/2026/08/11/trueconf-server-missing-authentication-for-critical-function/", publisher: "Kaspersky ICS CERT (KLCERT-26-057)", date: "2026-08-11", role: "primary" }
      - { url: "https://ics-cert.kaspersky.com/advisories/2026/08/11/trueconf-server-breakout-from-isolated-environment/", publisher: "Kaspersky ICS CERT (KLCERT-26-058)", date: "2026-08-11", role: "primary" }
      - { url: "https://ics-cert.kaspersky.com/publications/reports/2026/08/12/head-mare-exploits-vulnerabilities-in-trueconf-server-to-deliver-phantomcore-malware/", publisher: "Kaspersky ICS CERT (exploitation report)", date: "2026-08-12", role: "primary" }
      - { url: "https://trueconf.com/blog/news/security-fixes-updates-and-advisories", publisher: "TrueConf (vendor own security-advisory table)", date: "2026-08-11" , role: "primary" }
      - { url: "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json", publisher: "CISA KEV JSON feed", date: "2026-08-21", role: "primary" }
    discovery_trace: "re-fetch of S1 primaries per F1 scoped-read tasking → Kaspersky KLCERT-26-057/-058 advisory pages fetched raw via tools/fetch_source.py url → Kaspersky exploitation report fetched raw → pivoted to TrueConf's own vendor security-bulletin page (trueconf.com/blog/news/security-fixes-updates-and-advisories, linked from the CISA KEV JSON 'notes' field) for independent CNA-side confirmation → NVD CVE-2026-72529/72530 pages read for the CNA (Kaspersky Labs) CVSS container → CISA KEV JSON re-fetched directly for dateAdded/dueDate ground truth"
    cve_mapping_confirmed: |
      CVE-2026-72529 = KLCERT-26-057 = "Missing authentication for critical function" (CWE-306). Confirmed via the KLCERT-26-057 advisory page itself (title + "CVE 2026-72529" field) AND independently via TrueConf's own vendor table (row "CVE-2026-72529 / Missing Authentication / Other identifiers: KLCERT-26-057"). NOT positional — both KLCERT advisory pages carry a single CVE each with no ambiguity.
      CVE-2026-72530 = KLCERT-26-058 = "Breakout from isolated environment" (CWE-94, Code Injection). Confirmed the same way (TrueConf vendor table row: "CVE-2026-72530 / Sandbox Escape / Code Injection / Other identifiers: BDU:2026-11247; KLCERT-26-058").
    cvss_detail: |
      Both KLCERT-26-057 and KLCERT-26-058 advisory PAGES display "CVSS v3 Base Score: 0.0" literally in the static HTML fetch — this is a rendering artefact (the page populates the number via client-side JS from the vector string; the raw vector strings ARE present and correct). The TRUE scores, cross-confirmed independently by (a) NVD's CNA container attributed to "Kaspersky Labs" and (b) TrueConf's own vendor security-bulletin table, are:
        CVE-2026-72529: CVSS 3.1 = 9.8 CRITICAL (vector CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H) — confirmed identically by NVD/Kaspersky-Labs-CNA container and TrueConf's own table.
        CVE-2026-72529: CVSS 4.0 = 9.3 CRITICAL (vector CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N) — NVD CNA container only (TrueConf's table shows only a v3.1-equivalent "9.8" column, no v4).
        CVE-2026-72530: CVSS 3.1 = 9.0 CRITICAL (vector CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:C/C:H/I:H/A:H) — confirmed identically by NVD/Kaspersky-Labs-CNA and TrueConf's own table.
        CVE-2026-72530: CVSS 4.0 = 9.5 CRITICAL (vector CVSS:4.0/AV:N/AC:H/AT:P/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H) — NVD CNA container only.
      Note the CVSS3.1-vs-CVSS4.0 ranking INVERTS between the two CVEs: under v3.1 the missing-auth flaw (72529, AC:L) outscores the sandbox-breakout flaw (72530, AC:H); under v4.0 the breakout flaw (72530, which also gets AT:P and "Subsequent System" High impact) outscores the missing-auth flaw. S1's cve_table numbers (9.3/9.5, CVSS4.0) were correct as CVSS4.0 figures but should be labelled precisely as CVSS4.0, not left ambiguous — and the CVSS3.1 figures (9.8/9.0) belong alongside them since Kaspersky's own advisory pages lead with CVSS v3.
    affected_and_fixed: |
      TrueConf's own vendor table (structured, per-CVE):
        CVE-2026-72529 affected: "<5.3; 5.3.x<5.3.9; 5.4.x<5.4.9; 5.5.x<5.5.5" — fixed: "5.3.9 / 5.4.9 / 5.5.5". Affected component named: "Service on 4307/TCP".
        CVE-2026-72530 affected: "<5.3.9; 5.4.x<5.4.9; 5.5.x<5.5.5" (note: NO "<5.3" catch-all range listed here) — fixed: "5.3.9 / 5.4.9 / 5.5.5". Affected component named: "Isolated execution environment / code generation".
      DISCREPANCY (see corrections below): Kaspersky's own KLCERT-26-058 advisory page lists identical affected-version text for BOTH CVEs, INCLUDING "All versions before 5.3" for CVE-2026-72530 too — which TrueConf's own vendor table does not carry for that specific CVE.
      Kaspersky's exploitation report separately states, in its general technical-details section covering the exploit chain as a whole (not scoped to one CVE): "our internal analysis showed that all TrueConf server versions released since 2022 are vulnerable" — this is Kaspersky's OWN internal-analysis finding, broader than either KLCERT advisory's stated range, and broader again than TrueConf's own 72530 range.
      Fix release date confirmed exact: "released on June 18, 2026" (Kaspersky exploitation report, verbatim, grep-verified) — S1 had only "released June 2026."
    port_4307_attribution: |
      RESOLVED: Kaspersky's exploitation report explicitly attributes the "open by default" characterisation to TrueConf's OWN documentation, not its own judgement — verbatim (grep-verified): "via port 4307/TCP (open by default, according to TrueConf documentation)". I could not locate the specific TrueConf documentation page Kaspersky is citing within this run's time budget (TrueConf's own security-bulletin page, fetched and read in full, does not itself state a default-open-port fact); so the claim is confirmed as Kaspersky's direct citation of TrueConf's docs, not independently re-verified against that underlying TrueConf documentation page.
    post_exploitation_sequence: |
      Confirmed component-by-component from the Kaspersky exploitation report (grep-verified quotes below):
        1. Unauthenticated call to an undocumented server function via port 4307/TCP → arbitrary script execution inside an isolated environment lacking io/os libraries (CVE-2026-72529 / KLCERT-26-057).
        2. Chained exploitation of CVE-2026-72530 / KLCERT-26-058 escapes that sandbox → arbitrary code execution as NT AUTHORITY\SYSTEM.
        3. Attackers overwrite the file C:/Program Files/TrueConf Server/httpconf/site/public/js/locale.php with a malicious PHP web shell, AND delete TrueConf event-log records related to the exploit's own operation (anti-forensics step distinct from the web-shell drop).
        4. The web shell is used to (a) gather IT-infrastructure information about the victim org, (b) gain privileged access to the TrueConf Server database, and (c) replace the legitimate TrueConf client installer file C:\Program Files\TrueConf Server\ClientInstFiles\trueconf_windows_client_x64.exe with a trojanized copy — served to ALL conference participants with x64 systems via the guest join page.
        5. Separately (via the same web shell, run through remotely-executed PowerShell scripts), attackers install a TWO-COMPONENT Windows backdoor persisted as services SysExcSvc (communication module — C2 is a Microsoft OneDrive cloud storage account, via Microsoft Graph API) and SysReadSvc (execution module — reads/executes commands, writes results). Kaspersky states this backdoor is installed "as a backup command and control channel because all subsequent actions are carried out by remotely running PowerShell scripts via a web shell" — i.e. the PhantomCore/PhantomGraph service pair is a FALLBACK C2, not the primary attacker access path.
        6. SEPARATELY, on *nix TrueConf servers, attackers install a DIFFERENT backdoor that (a) hides its files, (b) intercepts TrueConf's own network functions to listen for attacker commands sent via the TrueConf protocol itself, and ALSO a distinct backdoor using GitHub as its C2 channel. This *nix tooling is architecturally separate from the Windows PhantomCore/OneDrive chain — S1's summary described only the Windows path and did not surface the *nix GitHub-C2 backdoor or protocol-hijacking backdoor at all.
        7. On the compromised workstation side: the trojanized installer deploys the legitimate TrueConf client AND drops PhantomCore malware to %LOCALAPPDATA%\TrueConf\Client\api-ms-win-crt-time-l1-1-0-2.dll, persisting via registry key HKEY_CURRENT_USER\Software\Classes\CLSID\{0340F119-A598-4ed9-B0AC-6F6A12D3E755}\InprocServer32.
    victims_and_poc: |
      Kaspersky's exploitation report states the investigation was "an attack on Russian organizations" — that is the ONLY victim-geography statement in the report. Neither KLCERT advisory nor the exploitation report mentions Belarus anywhere (grep-confirmed zero hits across all three fetched Kaspersky documents). S1's background sentence describing Head Mare as historically targeting "Russia and Belarus" is general actor-history context, NOT a statement about THIS campaign's victims — the report does not state or imply any victim outside Russia, but it also does not affirmatively rule one out; treat this as an open question the source is silent on, not a confirmed "Russia/Belarus only."
      No source fetched this run (either KLCERT advisory or the exploitation report) mentions a public PoC, proof-of-concept, or exploit code being available — grep-confirmed zero hits for "PoC"/"proof of concept"/"public exploit" across all three documents. This should be reported as "no source states a public PoC exists," not as a confirmed absence of one anywhere.
    corrections:
      - "S1's cve_table CVSS figures (9.3 for CVE-2026-72529, 9.5 for CVE-2026-72530) are correct but were CVSS4.0-only and left unlabelled/ambiguous against the CVSS3.1 numbers Kaspersky's own advisory pages actually lead with (9.8 and 9.0 respectively). Both scales should be carried, explicitly labelled, since the ranking inverts between them."
      - "The Kaspersky advisory pages' own displayed 'CVSS v3 Base Score: 0.0' field is a page-rendering artefact, not a real score of zero — worth flagging so nobody cites '0.0' from the page directly."
      - "TrueConf's own vendor table gives a NARROWER affected-version range for CVE-2026-72530 (no 'all versions before 5.3' entry) than Kaspersky's KLCERT-26-058 advisory (which does include 'all versions before 5.3' for that CVE) — a genuine vendor-vs-researcher discrepancy on this one CVE's version floor, not previously surfaced by S1."
      - "S1's summary conflated the Windows PhantomCore/PhantomGraph OneDrive-C2 backdoor with the separate *nix backdoor (GitHub C2 + TrueConf-protocol-hijacking backdoor) — these are two architecturally distinct implants for two different OS families and should not be merged into a single 'PhantomCore/PhantomGraph' description in the published entry."
      - "S1's claim that Head Mare 'active since 2023 against Russian and Belarusian targets' should not be read as this report confirming Belarusian victims of the TrueConf campaign specifically — the exploitation report names only 'Russian organizations.'"
      - "Fix release date is now precisely dated: 18 June 2026 (S1 only had 'June 2026')."
    verification: MULTI-SOURCE
    confidence: HIGH
    evidence:
