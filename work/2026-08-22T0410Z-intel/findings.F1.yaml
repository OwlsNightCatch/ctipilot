        attribution: "GitHub Security Advisory GHSA-5hvp-9mcx-5245 (PTC CNA)"
        source_url: "https://github.com/advisories/GHSA-5hvp-9mcx-5245"
        grep_check: "NOT independently grep-verified this run — obtained via WebFetch tool extraction (raw HTML unobtainable: direct fetch 403, jina pool credit-exhausted); the api.github.com JSON call independently corroborates the same text field for this one GHSA ID, giving moderate but not byte-level confidence."
      - quote: "The vulnerability may be exploited through the deserialization of untrusted data."
        attribution: "GitHub Security Advisory GHSA-qxmv-9q88-wwmw (PTC CNA)"
