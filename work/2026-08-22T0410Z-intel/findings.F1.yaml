# F1-b. SPIP CMS pre-auth RCE — MAJOR CORRECTION
# ============================================================
  - id: F1-b
    title: "SPIP: TWO consecutive unconditional pre-auth RCE emergency releases three days apart (4.4.20 and 4.4.21), not one — CVE-2026-77647 is the 4.4.20 fix, the 4.4.21 fix remains unassigned"
    sources:
      - { url: "https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-1063/", publisher: "CERT-FR / ANSSI", date: "2026-08-21", role: "primary" }
      - { url: "https://blog.spip.net/Mise-a-jour-critique-de-securite-sortie-de-SPIP-4-4-21.html", publisher: "SPIP maintenance team (4.4.21 release note)", date: "2026-08-20", role: "primary" }
      - { url: "https://blog.spip.net/Mise-a-jour-critique-de-securite-sortie-de-SPIP-4-4-20.html", publisher: "SPIP maintenance team (4.4.20 release note)", date: "2026-08-17", role: "primary" }
      - { url: "https://nvd.nist.gov/vuln/detail/CVE-2026-77647", publisher: "NVD / MITRE CNA", date: "2026-08-20", role: "primary" }
    discovery_trace: "re-read of S1's already-fetched local HTML (spip.html = CERT-FR advisory, spip_blog.html = 4.4.21 blog post) → gap identified (no 4.4.20 blog post read yet) → WebSearch ('\"SPIP 4.4.20\" blog.spip.net sortie mise à jour sécurité') → fetched https://blog.spip.net/Mise-a-jour-critique-de-securite-sortie-de-SPIP-4-4-20.html directly → fetched NVD CVE-2026-77647 to resolve which release it belongs to"
    corrections:
      - "MAJOR: 4.4.20 (released Monday 17 August 2026, three days before 4.4.21) was ALSO a critical security release fixing its own separate 'unconditional (no-prerequisites) pre-authentication RCE' — described in nearly identical language to the 4.4.21 release note: also reported anonymously via ANSSI, also NOT caught by SPIP's security screen, also with vendor-stated in-the-wild exploitation attempts already observed. S1's finding treated 4.4.20 only as a version-number boundary and did not surface that it was itself a critical emergency security release for the SAME bug class."
      - "CVE-2026-77647 IS the CVE for the 4.4.20 fix (confirmed via NVD: the CVE's own reference list cites https://blog.spip.net/Mise-a-jour-critique-de-securite-sortie-de-SPIP-4-4-20.html directly, and its structured 'Affected' field is {version:0, lessThan:4.4.20} — i.e. all versions before 4.4.20). Root cause per NVD's MITRE-sourced description: 'incorrect identification of <?php blocks, and var_export's mishandling of certain cases such as presence of a \"<\" character' (CWE-94, CVSS 3.1 9.8 CRITICAL per CNA=MITRE, vector CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H). NVD's own description text states outright: 'as exploited in the wild in August 2026' — this is NVD/MITRE's own wording, not a hedge."
      - "The 4.4.21 flaw (still uncredited with any CVE as of this run, per CERT-FR) is therefore a SEPARATE, NEWER bug specifically scoped by the vendor to 'la version 4.4.20 de SPIP' (i.e. code as it existed IN the 4.4.20 release, after the CVE-2026-77647 fix landed) — not a re-statement of the same flaw. The vendor has NOT stated whether this is a bypass of the 4.4.20 patch or an unrelated flaw of the same general shape; per the tasking instruction, no root cause is asserted for the 4.4.21 flaw since none has been published."
      - "CERT-FR's stated affected range 'SPIP versions antérieures à 4.4.21' (versions before 4.4.21) is technically defensible in aggregate — SPIP < 4.4.20 needs the CVE-2026-77647 fix, and 4.4.20 itself needs the 4.4.21 fix — but is broader than the 4.4.21 vendor bulletin's own narrower framing ('touche la version 4.4.20 de SPIP'). Both statements should be carried side by side, not treated as contradictory or resolved to one."
      - "4.4.20's release note additionally credits a security researcher by handle: 'Un grand merci à Glop pour son aide à l'analyse et au correctif de la faille' (a researcher named 'Glop' helped analyse/fix the CVE-2026-77647 flaw) — not previously surfaced."
      - "CERT-FR attributes the active-exploitation claim explicitly to the vendor, not itself, in both instances: for the 4.4.21 flaw, CERT-FR's advisory text reads 'L'éditeur indique que cette vulnérabilité est activement exploitée' (verbatim, grep-verified) — 'the publisher/vendor states' — confirming S1's characterisation was correct on this specific point."
    exact_quotes_resolution: |
      CERT-FR CERTFR-2026-AVI-1063: "Systèmes affectés: SPIP versions antérieures à 4.4.21" (versions before 4.4.21 — the BROADER framing).
      SPIP 4.4.21 vendor blog: "Cette version corrige une vulnérabilité universelle (sans conditions) pré-authentification RCE qui touche la version 4.4.20 de SPIP." (affects version 4.4.20 specifically — the NARROWER framing).
      SPIP 4.4.20 vendor blog: "Cette version corrige une vulnérabilité universelle (sans conditions) pré-authentification RCE qui touche toutes les versions de SPIP." (affects ALL versions of SPIP).
      Both blog posts contain the IDENTICAL follow-on sentence: "Cette faille n'est pas prise en charge par l'écran de sécurité. Il est impératif de mettre très rapidement votre site à jour, des tentatives d'exploitation de la faille ont déjà été constatées dans la nature." (not caught by the security screen; update immediately; exploitation attempts already observed in the wild) — this sentence is word-for-word identical across both the 4.4.20 and 4.4.21 release notes.
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Systèmes affectés SPIP versions antérieures à 4.4.21"
        attribution: "CERT-FR / ANSSI (CERTFR-2026-AVI-1063)"
