    novelty: new
    evidence:
      - quote: "This enables them to replace one of the TrueConf server files with their own web shell. This web shell is later used to gather information about the IT infrastructure of the attacked organization, gain privileged access to the TrueConf Server database, and replace the legitimate client installers mentioned earlier."
        attribution: "Kaspersky ICS CERT"
        source_url: "https://ics-cert.kaspersky.com/publications/reports/2026/08/12/head-mare-exploits-vulnerabilities-in-trueconf-server-to-deliver-phantomcore-malware/"
