      Microsoft disclosed CVE-2026-69836, a CVSS 10.0 "Microsoft Entra ID Remote Code Execution Vulnerability" (CWE-502, deserialization of untrusted data allowing an unauthorized attacker to execute code over a network), on 2026-08-20. Entra ID (formerly Azure AD) is Microsoft's cloud identity service — sign-in, Conditional Access, privileged-role and app-registration control plane — so the exposure surface is every tenant, not an on-prem asset a customer patches. Microsoft's own bulletin states the vulnerability "has already been fully mitigated by Microsoft" server-side and "there is no action for users of this service to take"; the CVE exists purely for transparency. The exploitation-status field is the notable part: MSRC's initial 2026-08-20 publication marked "Exploited: Yes," and multiple outlets (and CERT-FR's advisory, which cites Microsoft directly) reported active in-the-wild exploitation on that basis; on 2026-08-21 Microsoft revised the field to "Exploited: No," describing it as "an informational change only." No details on who exploited it, when, or what attackers did have ever been published in either version of the advisory, and no public PoC exists. Discovered by Microsoft's own principal security engineer Robert Fitzpatrick.
