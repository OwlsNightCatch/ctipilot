    confidence: HIGH
    novelty: new
    evidence:
      - quote: "A missing bound check in the text annotator allowed an attacker to send crafted messages that would write attacker-supplied code past the intended buffer"
        attribution: "SecurityWeek"
        source_url: "https://www.securityweek.com/zoom-patches-zero-click-code-execution-vulnerability/"
      - quote: "Successful exploitation could allow an attacker participating in a meeting to execute arbitrary code on another participant's device, without requiring them to click a malicious link or download a file."
        attribution: "Centre for Cybersecurity Belgium (CCB)"
        source_url: "https://ccb.belgium.be/advisories/warning-zero-click-remote-code-execution-zoom-clients-patch-immediately"
