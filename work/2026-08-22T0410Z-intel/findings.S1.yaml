  - title: "SPIP CMS: unconditional pre-authentication RCE, already exploited in the wild — no CVE assigned, bypasses SPIP's own built-in WAF-like 'security screen'"
    sources:
      - { url: "https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-1063/", publisher: "CERT-FR / ANSSI", date: "2026-08-21", role: "primary" }
      - { url: "https://blog.spip.net/Mise-a-jour-critique-de-securite-sortie-de-SPIP-4-4-21.html", publisher: "SPIP maintenance team (vendor bulletin)", date: "2026-08-20", role: "primary" }
    discovery_trace: "first seen at: anssi-fr, URL https://www.cert.ssi.gouv.fr/avis/feed/ (CERTFR-2026-AVI-1063, 'Vulnérabilité dans SPIP', published 2026-08-21) → primary: SPIP vendor bulletin, URL https://blog.spip.net/Mise-a-jour-critique-de-securite-sortie-de-SPIP-4-4-21.html"
    summary: |
      SPIP — an open-source French CMS widely used by French government ministries, municipalities and cultural institutions, and more broadly across francophone public administration — shipped an emergency release (4.4.21) on 2026-08-20 fixing what its own maintainers describe as "une vulnérabilité universelle (sans conditions) pré-authentification RCE" (an unconditional, no-prerequisites, pre-authentication remote code execution vulnerability) affecting version 4.4.20. The flaw was reported anonymously through ANSSI's vulnerability-declaration channel. Critically, the vendor states "cette faille n'est pas prise en charge par l'écran de sécurité" — the flaw is not caught by SPIP's built-in "security screen," a request-filtering protection layer site operators rely on as a compensating control against exactly this class of bug. The vendor bulletin states plainly that exploitation attempts have already been observed in the wild ("des tentatives d'exploitation de la faille ont déjà été constatées dans la nature") and urges immediate upgrade. CERT-FR's advisory (CERTFR-2026-AVI-1063, 2026-08-21) repeats the active-exploitation statement as sourced to the vendor and confirms no CVE identifier has been assigned to this specific flaw. Note: this is distinct from the separate, earlier CVE-2026-77647 (SPIP <4.4.20, a var_export()/<?php-block-detection injection bug, also publicly written up around 2026-08-20) — the 4.4.21 release fixes a second, newer unconditional pre-auth RCE found in the 4.4.20 codebase itself.
