    extended_notes: |
      Detection concept: crash/exception telemetry from Zoom client processes during active meetings (EDR process-crash or fault-reporting events correlated to zoom.exe / ZoomRooms / meeting-SDK-embedding hosts) in the window since the June 2026 discovery date is the closest portable hunt signal available, since no IOC-level detail was published. Hardening: patch all five affected product lines to the versions above; Zoom Rooms and kiosk-style unattended deployments (common in government meeting spaces) are a higher-value target class since they cannot be "socially engineered" into caution the way an individual user might.

  - title: "misp-stix (the STIX-import library behind MISP, maintained by CIRCL): three CVEs — a trust-decision bypass letting a malicious STIX document forge MISP-native distribution/sharing metadata, a DoS via uncaught SystemExit plus unbounded memory use, and cross-document parser-state contamination — fixes exist only as unreleased commits"
    sources:
      - { url: "https://github.com/advisories/GHSA-pqpx-w6cx-7q9c", publisher: "GitHub Security Advisories / CIRCL", date: "2026-08-21", role: "primary" }
      - { url: "https://github.com/advisories/GHSA-65gx-wjvj-88j8", publisher: "GitHub Security Advisories / CIRCL", date: "2026-08-21", role: "primary" }
    discovery_trace: "first seen at: enisa-euvd, URL https://euvd.enisa.europa.eu/ (EUVD-2026-63850, EUVD-2026-63881, EUVD-2026-63883, assigner CIRCL, published/updated 2026-08-21) → primary: GitHub Security Advisories, URL https://github.com/advisories/GHSA-pqpx-w6cx-7q9c and https://github.com/advisories/GHSA-65gx-wjvj-88j8 → pivot: misp-stix GitHub releases page, URL https://github.com/MISP/misp-stix/releases (confirms no tagged release since 2026.7.8 / 2026-07-09 incorporates these fixes)"
    summary: |
      CIRCL (Luxembourg's national CERT and MISP's maintaining organization) published three CVEs on 2026-08-21 against misp-stix, the Python library MISP instances use to import/export STIX 1 and STIX 2 threat-intel documents — directly relevant to any CERT, SOC or ISAC that ingests external STIX feeds into MISP. CVE-2026-77710 (CVSS 4.0: 6.9, CWE-915/CWE-807) is the most structurally interesting: the STIX-import logic decided whether to treat an incoming document as "MISP-native" purely from attacker-controlled metadata (STIX2 tool labels, or the STIX1 document title) — an untrusted value driving a security-relevant trust decision. When a document was classified as MISP-native, the parser copied an entire attacker-controlled `x_misp_attributes` dictionary directly into `misp_object.add_attribute()` with no allow-list, letting a crafted STIX bundle inject or override security-sensitive MISP attribute fields including `distribution`, `sharing_group_id` and `tags` — able to cause an org's own MISP instance to mis-classify or over-share imported intelligence contrary to policy. CVE-2026-77755 (CVSS 8.7, availability) is a denial-of-service: the importer used Python's `sys.exit()` on several parse-failure paths, which raises `SystemExit` (a `BaseException`, not `Exception`) and so is not caught by callers' normal exception handlers — a single malformed STIX document can kill a long-running import process; separately, no input-size limit was enforced before parsing, so a large document could consume 2-7x its size in memory before validation, enabling resource exhaustion. CVE-2026-77761 (CVSS 6.3) is a parser-state-isolation bug: STIX1/STIX2 parser components retained per-document state (galaxy/galaxy-cluster data, passive-DNS records, titles, timestamps) across reuse of the same parser instance, so a second document parsed on a long-lived parser could inherit and blend in data from an unrelated prior document — a correctness/confidentiality issue in environments where sequential documents carry different distribution scopes. All three fixes exist only as individual GitHub commits referenced in the advisories; as of this run the misp-stix GitHub Releases page and PyPI package history show no tagged release since 2026.7.8 (2026-07-09), meaning no pip-installable fixed version is yet available — mitigation requires manually applying the referenced commits or pinning to a post-fix git ref.
    region_nexus: "global; MISP is the CTI-sharing platform standard across European national CERTs, ISACs and this pipeline's own peer ecosystem"
    primary_sector_nexus: "direct"
    sector: "public-sector"
    cves: [CVE-2026-77710, CVE-2026-77755, CVE-2026-77761]
    techniques: [T1565.001, T1499]
    affected_products: ["MISP (misp-stix library)"]
    entity_keys: []
    new_entities: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "the parser choice was previously based solely on labels or header titles that any producer could write"
        attribution: "ENISA EUVD, quoting the misp-stix fix commit description"
        source_url: "https://euvd.enisa.europa.eu/"
      - quote: "The STIX import code used sys.exit() to handle several parsing and loading failures. Because SystemExit inherits from BaseException rather than Exception, these failures bypassed the exception handlers used by callers of the library."
        attribution: "GitHub Security Advisory GHSA-65gx-wjvj-88j8 / CIRCL"
        source_url: "https://github.com/advisories/GHSA-65gx-wjvj-88j8"
    extended_notes: |
      Detection/hardening angle for MISP operators: until a tagged release ships, apply an explicit input-size cap ahead of any misp-stix import workflow (the fix defaults to 100MB), avoid reusing a single long-lived parser instance across documents from different trust/distribution contexts, and treat any newly-ingested STIX document that unexpectedly changes an existing attribute's `distribution` or `sharing_group_id` as suspect pending the allow-list fix. This is a supply-chain-adjacent finding for CTI tooling itself — the class of infrastructure this pipeline and its peers depend on to exchange threat intelligence.
    borderline: false

