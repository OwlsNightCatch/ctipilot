    summary: |
      TP-Link's own August 2026 advisory (referenced by BSI CERT-Bund WID-SEC-2026-2964, published 2026-08-20/21) discloses three new CVEs in TP-Link Omada Gateway routers/firewalls (ER605, ER7206, ER7212PC, ER7406, ER707-M2, ER7412-M2, ER8411, ER706W/ER706W-4G — the SMB/branch-office SD-WAN gateway line). The headline flaw, CVE-2026-19586 (CVSS 4.0: 9.3, CWE-78 OS command injection), is a pre-authentication bug in the gateway's OpenVPN-server implementation: insufficient validation of client-supplied data during OpenVPN connection establishment lets an unauthenticated remote attacker execute arbitrary OS commands before authentication completes, with full device compromise possible whenever OpenVPN Server is enabled and network-reachable. CVE-2026-9033 (CVSS 6.0, CWE-306) lets an unauthenticated attacker with access to the device's captive-portal service forcibly terminate active sessions. CVE-2026-19683 (CVSS 6.3, CWE-319) has the gateway transmitting Dynamic DNS (DDNS) authentication credentials in cleartext, letting anyone with network visibility intercept them and interfere with DDNS/DNS-record operations. Fixed firmware is already published per-model (e.g. ER605 v2 before 2.4.4 Build 20260630, ER7206 v2 before 2.3.5 Build 20260625, ER7212PC v2 before 2.4.3 Build 20260722) — note several fix builds predate the 2026-08-20 CVE assignment, so silent firmware updates may already have shipped weeks before the public advisory. No exploitation has been reported as of this run, and the vendor's own advisory page (JS-rendered SPA) could not be retrieved directly this run; NVD/TP-Link CNA records supplied the technical detail instead.
