  - title: "TrueConf Server pre-auth RCE chain reaches CISA KEV — Head Mare APT already used it to plant PhantomCore web-shell backdoors on conference servers"
    sources:
      - { url: "https://ics-cert.kaspersky.com/publications/reports/2026/08/12/head-mare-exploits-vulnerabilities-in-trueconf-server-to-deliver-phantomcore-malware/", publisher: "Kaspersky ICS CERT", date: "2026-08-12", role: "primary" }
      - { url: "https://ics-cert.kaspersky.com/advisories/2026/08/11/trueconf-server-breakout-from-isolated-environment/", publisher: "Kaspersky ICS CERT (KLCERT-26-058)", date: "2026-08-11", role: "primary" }
      - { url: "https://ics-cert.kaspersky.com/advisories/2026/08/11/trueconf-server-missing-authentication-for-critical-function/", publisher: "Kaspersky ICS CERT (KLCERT-26-057)", date: "2026-08-11", role: "primary" }
      - { url: "https://www.securityweek.com/cisa-urges-immediate-patching-of-exploited-trueconf-vulnerabilities/", publisher: "SecurityWeek", date: "2026-08-21", role: "corroborating" }
    discovery_trace: "first seen at: cisa-kev, URL https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json (catalogVersion 2026.08.21, CVE-2026-72529/72530 added 2026-08-20) → primary: Kaspersky ICS CERT advisories KLCERT-26-057 and KLCERT-26-058, URL https://ics-cert.kaspersky.com/advisories/2026/08/11/trueconf-server-missing-authentication-for-critical-function/ and https://ics-cert.kaspersky.com/advisories/2026/08/11/trueconf-server-breakout-from-isolated-environment/ → primary: Kaspersky ICS CERT exploitation report, URL https://ics-cert.kaspersky.com/publications/reports/2026/08/12/head-mare-exploits-vulnerabilities-in-trueconf-server-to-deliver-phantomcore-malware/ → corroborating: SecurityWeek, URL https://www.securityweek.com/cisa-urges-immediate-patching-of-exploited-trueconf-vulnerabilities/"
    summary: |
      CISA added CVE-2026-72529 and CVE-2026-72530 to its KEV catalogue on 2026-08-20 — this pipeline's first coverage of a chain Kaspersky ICS CERT had already tied to live exploitation. Both flaws sit in TrueConf Server (Windows and Linux), a video-conferencing/UC platform marketed as a self-hosted Microsoft Teams alternative, reachable on port 4307/TCP which TrueConf's own documentation leaves open by default. Kaspersky's internal analysis found every TrueConf Server release since 2022 vulnerable. CVE-2026-72529 (CWE-306, missing authentication) lets an unauthenticated caller invoke an undocumented server function to run an arbitrary script; that script executes inside an isolated sandbox missing io/os and other hazardous libraries, so CVE-2026-72530 (CWE-94, code injection, "breakout from isolated environment") is chained to escape the sandbox and run arbitrary code as NT AUTHORITY\SYSTEM. Kaspersky observed the Head Mare APT group (active since 2023 against Russian and Belarusian targets) using exactly this chain to overwrite the legitimate TrueConf file C:/Program Files/TrueConf Server/httpconf/site/public/js/locale.php with a PHP web shell, delete the TrueConf event-log entries the exploit itself generated, and use the shell to install a two-component PhantomCore/PhantomGraph backdoor (persisted as Windows services SysExcSvc and SysReadSvc) and to replace legitimate TrueConf client installers served from the compromised server with trojanized copies that also drop PhantomCore on connecting workstations. Fixed in TrueConf Server 5.3.9, 5.4.9 and 5.5.5 (released June 2026); CISA's federal deadlines are 2026-08-23 (CVE-2026-72529) and 2026-09-03 (CVE-2026-72530).
    region_nexus: "Head Mare's confirmed targeting is Russia/Belarus, but the vulnerable component and internet-reachable default port are global; any European org running an internet-facing TrueConf Server is equally exposed to independent re-use of the same public PoC-grade chain"
    primary_sector_nexus: "indirect"
    sector: "telco, public-sector"
    cves: [CVE-2026-72529, CVE-2026-72530]
    techniques: [T1190, T1611, T1685.005, T1505.003, T1543.003]
    affected_products: ["TrueConf Server"]
