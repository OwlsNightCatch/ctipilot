    extended_notes: |
      Detection hook: TrueConf event-log gaps or deletions coinciding with unexpected outbound connections to port 4307; unexpected modification timestamp on httpconf/site/public/js/locale.php; new Windows services named SysExcSvc or SysReadSvc; TrueConf client installers served from the org's own TrueConf server exhibiting a different hash/signature than the vendor's published release. Hardening: TrueConf Server should not expose port 4307/TCP to the internet; treat any internet-reachable instance as compromised-until-proven-otherwise if unpatched since 2022.

  - title: "TP-Link Omada Gateway: unauthenticated pre-auth OS command injection via OpenVPN (CVSS 9.3) plus a cleartext-DDNS-credential leak — three fresh CVEs, no exploitation confirmed yet"
