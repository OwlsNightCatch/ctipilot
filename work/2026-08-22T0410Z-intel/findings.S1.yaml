  - title: "Zoom 'Zoomsday': a stack buffer overflow in the meeting-annotation protocol lets any participant corrupt every other participant's client memory (CVE-2026-53413, CVSS 8.3) — patched, no confirmed in-the-wild exploitation"
    sources:
      - { url: "https://ccb.belgium.be/advisories/warning-zero-click-remote-code-execution-zoom-clients-patch-immediately", publisher: "Centre for Cybersecurity Belgium (CCB)", date: "2026-08-20", role: "primary" }
      - { url: "https://www.zoom.com/en/trust/security-bulletin/ZSB-26015/", publisher: "Zoom (vendor security bulletin ZSB-26015)", date: "2026-08-11", role: "primary" }
      - { url: "https://securityaffairs.com/197042/hacking/zoom-patches-zoomsday-zero-click-flaw-enabling-remote-code-execution.html", publisher: "Security Affairs", date: "2026-08-11", role: "corroborating" }
    discovery_trace: "first seen at: ccb-belgium, URL https://ccb.belgium.be/advisories (dated row 20/08/2026) → primary: CCB advisory, URL https://ccb.belgium.be/advisories/warning-zero-click-remote-code-execution-zoom-clients-patch-immediately → primary: Zoom vendor bulletin, URL https://www.zoom.com/en/trust/security-bulletin/ZSB-26015/ → corroborating: Security Affairs, URL https://securityaffairs.com/197042/hacking/zoom-patches-zoomsday-zero-click-flaw-enabling-remote-code-execution.html"
    summary: |
      CCB Belgium issued a "Patch Immediately" advisory on 2026-08-20 for CVE-2026-53413, publicly dubbed "Zoomsday" by discoverer A Security (researcher Idan Levcovich, who found it analysing Zoom's Android client on 2026-06-08 and privately reported it 2026-06-10; Zoom patched and disclosed on 2026-08-11). The vulnerable component is the Zoom Clients text-annotator function, specifically a missing bounds check in `CAnnoFormatBlock::Deserialize`, which accepts client-supplied 32-bit character counts without validating them against fixed 128-byte buffers — a classic stack buffer overflow (CWE-787, out-of-bounds write). Because annotation messages are exchanged directly between meeting participants over Zoom's proprietary protocol, an attacker who joins or hosts a meeting can send a malformed annotation message and corrupt another participant's client memory, potentially achieving arbitrary code execution on their device — no link click or file download needed from the target. Affected: Zoom Workplace (all platforms before 7.1.0/7.0.6 depending on branch), Zoom Workplace VDI Client for Windows (before 7.0.11/6.6.16), Zoom Rooms (before 7.1.0), Meeting SDK (before 7.1.0), Video SDK (before 2.6.0). Two related flaws in the same annotator disclosed alongside it: CVE-2026-53414 (buffer over-read / DoS) and CVE-2026-53415 (use-after-free). Zoom's own CVSS vector records UI:R (user interaction required) despite the "zero-click" framing used across coverage — the "zero-click" claim specifically means no malicious-link-click or file-download is needed, not that literally zero interaction of any kind occurs; treat that nuance as an open question the vendor bulletin does not resolve. No in-the-wild exploitation has been reported; this was a coordinated, privately-disclosed research finding.
    region_nexus: "global; Zoom is in broad use across Swiss/European public-sector and CI organizations for meetings"
    primary_sector_nexus: "indirect"
