    extended_notes: |
      Composer guidance. (1) The strongest defender takeaway is the pairing of two independent
      "arrive before the defender is watching" patterns in one toolkit — Windows kernel-callback
      unlinking, and Linux systemd ordering before sysinit.target. Both make the endpoint sensor a
      non-witness; both are detectable at the INSTALL moment and, afterwards, only by absence-of-
      telemetry reasoning. That pairs naturally with the Check Point item above (F3b-a) as a
      same-day theme: 2026-08-20 produced two independent research reports whose common lesson is that
      signed-code trust and hash blocklists do not cover the moment before security tooling is live.
      (2) The AI angle is the newsworthy hook but the WEAKER evidence — Talos's rootkit-authorship case
      is stylistic and explicitly medium confidence. If the entry leads on AI, it must lead on the
      assessment language. Consider leading instead on BYOVD/EDR-blinding, where the evidence is
