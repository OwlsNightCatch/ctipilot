    extended_notes: |
      Composer guidance. (1) This entry's value is detection engineering ahead of weaponisation, not an
      active threat — the headline and priority must not imply exploitation. Check Point explicitly
      observed none. (2) The single highest-value line for the body is the absence-based tell: service
      key written + load-order group set to the earliest system-start group + no service-installation
      event. That inversion (alert on what is MISSING) is rare enough in published research to be the
      entry's spine. (3) The false-positive origin story is the benign-lookalike discriminator and should
      be stated as such — Check Point's own analysts mis-read genuine Defender remediation as malicious
      first. (4) Keep the trust-model lesson: signature-based trust and hash-based driver blocklists both
      fail against a functionally-intended, currently-shipping Microsoft driver; only load context and
      lineage work. (5) Do not compose any `actions[]` item beyond, at most, monitoring/limiting
