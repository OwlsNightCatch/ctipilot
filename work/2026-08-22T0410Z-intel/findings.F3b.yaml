  # ==================================================================== F3b-c
  - title: "FTP pre-login banners as a dead-drop resolver: SOCRadar's STRU documents two new RATs — E4del, which swaps the resource archive inside a legitimately signed Electron app, and PINHOLE, which parks its C2 config in Pinterest pins and SurveyMonkey questions"
    sources:
      - { url: "https://socradar.io/blog/ftp-banners-new-dead-drop-resolver-rats/", publisher: "SOCRadar Threat Research Unit (STRU)", date: "2026-08-21", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/hackers-abuse-ftp-server-banners-to-deliver-new-windows-malware/", publisher: "BleepingComputer (Bill Toulas)", date: "2026-08-21", role: "relaying — NOT independent" }
    discovery_trace: "first seen at: findings.S3.yaml item (S3 surfacing pass, this run), primary URL https://socradar.io/blog/ftp-banners-new-dead-drop-resolver-rats/ → both the primary and the relaying article re-fetched in full for this deep read via `tools/fetch_source.py url` specifically to settle which publisher performed the analysis"
    summary: |
      WHO ANALYSED WHAT — settled explicitly, because it decides the entry's source rating. SOCRadar's
      Threat Research Unit (STRU) performed the original work: it identified the technique during its own
      investigation, ran its own internet-wide infrastructure hunting to establish the technique was
      still live, and reverse-engineered both malware families it found, naming them itself ("two
      previously undocumented Remote Access Trojans (RATs), which we have named E4del and PINHOLE").
      BleepingComputer is RELAYING, and says so in its own text — "In a report shared with
      BleepingComputer, SOCRadar says..." — with no independent analysis, no independent telemetry, and
      no additional primary evidence; every technical statement in the article traces to the SOCRadar
      report. Consequences the composer must apply: (a) for THIS item SOCRadar is the originating
      research source (Admiralty reliability B — original research, though a commercial platform with a
      promotional tail in the same post; not A, which is reserved for first-party authorities), and
      BleepingComputer is C FOR THIS ITEM (competent editorial standards but purely re-reporting here),
      which is the INVERSE of the ratings the S3 pass assigned; (b) the two sources are NOT INDEPENDENT,
      so this does not clear the two-source bar in substance — treat as effectively single-source with
      credibility 2, not 1. Separately, DISCOVERY CREDIT for the FTP-banner dead-drop technique itself
      belongs to neither: SOCRadar states in its own words that "a post from MalwareHunterTeam ... was
      the first to document the capability of LNK files (likely spread through phishing) to use FTP
      banners as a DDR for fetching commands", and SOCRadar's contribution was to hunt onward from that
      post after the originally described infrastructure had gone dark. Note that NEITHER primary states
      the platform MalwareHunterTeam posted on (verified: no occurrence of X/Twitter/tweet in either
      body) — so the entry must not name one.

      The dead-drop channel, in general terms only. A dead-drop resolver is a legitimate service or
      protocol abused to hold the attacker's addresses or commands, so the delivered stager never
      carries them itself. The novelty here is the CHANNEL: the stager reads its next instruction from
      the greeting text an FTP server emits BEFORE LOGIN — the pre-authentication banner. Why that
      evades controls built for other resolver channels: web-service resolvers (code-hosting, social,
      video platforms), DNS-based resolvers and blockchain-transaction resolvers are all channels the
      security industry has built inspection, reputation and takedown workflows around; an FTP
      handshake's opening response is normally treated as connection metadata, not as content to
      inspect, and it is retrieved without ever authenticating, so no credential or session artefact is
      produced. But SOCRadar is unusually candid that the trade-off cuts the other way on the network
      side, and this is the single most useful line in the report for a SOC: because legitimate
      enterprise traffic to arbitrary internet FTP servers is rare, "this method is less stealthy than
      traditional web-based DDRs, as security teams are more likely to flag FTP connections to unknown
      servers as anomalous." That is the detection concept, stated by the researchers themselves:
      egress-connection telemetry for outbound port-21/FTP control connections to hosts outside a known
      business baseline is a low-volume, high-yield hunt in almost every enterprise — precisely the
      opposite of the haystack problem web-service resolvers create. SOCRadar established the technique
      has been in use since early July 2026 with new infrastructure as recently as August 2026, assesses
      the two RATs as separate clusters using the same delivery technique, and states evidence is
      currently insufficient for actor attribution. Initial access is assessed, not proven: a ZIP
      archive containing a shortcut file, with SOCRadar noting the initial compromise likely occurs
      through phishing — and warning the same channel could be adapted to ClickFix-style social
      engineering.

      E4del AND WHAT IT DOES TO A SIGNED APPLICATION'S RESOURCE ARCHIVE — the signature-trust lesson.
      E4del is a Node.js RAT that abuses the architecture of Electron desktop applications. An Electron
      app's own JavaScript logic does not live in the signed executable; it lives in a resource archive
      alongside it (app.asar). The actors ship a LEGITIMATE, DIGITALLY SIGNED vendor executable (a chat
      application) together with the runtime DLLs it expects, and REPLACE THE CONTENTS OF THAT RESOURCE
      ARCHIVE with their own logic. The consequence, in SOCRadar's words: "the operating system
      identifies a digitally signed Discord.exe loading trusted dependencies, effectively masking the
      malicious code residing in app_bootstrap/index.js." What that means for signature-based trust,
      and it generalises far beyond one app: an Authenticode signature covers the executable, NOT the
      interpreted application code the executable loads at runtime. Any signed interpreter-hosting
      application — Electron, and by the same logic any signed host that loads script or bytecode from
      a sibling resource file — can be turned into a trusted-looking launcher WITHOUT breaking or
      forging a single signature, and with the process name, publisher and certificate all checking out
      in an allowlist. Detection surface that follows: file-modification telemetry on the resource
      archives and sibling runtime files of installed signed applications (a legitimate app rewrites its
      own .asar only during a vendor update, so a write from anything other than the vendor's updater
      is anomalous); process-creation telemetry showing a signed consumer desktop application running
      from a non-standard install path, launched with unexpected arguments, or spawning shell children;
      and autostart-configuration telemetry, since E4del persists by registering the signed host binary
      as a login item rather than by dropping anything new. Behavioural discriminators SOCRadar's
      analysis surfaces: the RAT runs the app with switches that suppress any window, so a chat
      application is resident with no GUI ever rendered; it enumerates installed security products
      before beaconing; it refuses to run unless invoked with an argument matching the intended victim's
      username (an anti-sandbox check, and incidentally a reason a sandbox verdict may come back clean);
      and it varies its check-in interval across three activity states. E4del also has an escalation
      command that loads a separate native add-on module that SOCRadar could not retrieve — so the
      privilege-escalation route is UNKNOWN, not merely undescribed, and the entry should say so.

      PINHOLE — evasion techniques at the level the sources name them, and the injection target. The
      second RAT reaches its final stage through a multi-stage chain and is built for endpoint-sensor
      evasion. Techniques the sources name: Halo's Gate, to obtain syscall numbers from neighbouring
      unhooked functions and issue direct syscalls, defeating user-mode API hooking in ntdll; SHELLCODE
      FLUCTUATION, keeping only a single 4 KB page of the payload decrypted and executable at a time so
      a process memory dump captured at an arbitrary moment yields one readable page and the rest
      encrypted; configuration storage in NTFS ALTERNATE DATA STREAMS — specifically on desktop.ini
      files, holding its build token, its resolver encryption key, resolver URLs and installation paths;
      sandbox detection by inspecting DLL export tables for stub patterns; layered encoding/encryption
      of stage payloads including base64 wrapped in fake certificate headers; and EARLY BIRD APC
      INJECTION of the final stage into a suspended process — the process it targets for injection is
      ApplicationFrameHost.exe, a legitimate Windows component. Detection surface: process-creation
      telemetry for that host process created in a suspended state or with an unexpected parent (it is
      normally started by the shell to host packaged-app windows, so a script host, an office
      application or an unknown binary as parent is the anomaly); memory-region telemetry for
      small executable private regions whose protections change repeatedly in one process (the
      fluctuation pattern is itself a signal even though any single snapshot looks nearly clean);
      file-stream-creation telemetry for Alternate Data Streams on desktop.ini files, which is a
      genuinely rare event in a normal estate; and unhooked-syscall / direct-syscall detection where
      the EDR supports it. This is also the reason to state plainly that memory-forensics-only triage
      will UNDER-CALL this implant.

      CONSUMER WEB PLATFORMS AS C2 CONFIGURATION HOLDERS, AND WHAT THAT COSTS A TAKEDOWN DEFENCE.
      PINHOLE resolves its C2 by fetching ordinary content from ordinary consumer platforms — Pinterest
      pins and SurveyMonkey survey questions — where the operator has parked encoded configuration
      inside the page content, and it then proxies the resulting traffic through a serverless-function
      platform. BleepingComputer's framing of the cost is accurate and quotable: this is "a tactic that
      offers versatility and resilience to take-downs." The defensive point to make in the entry: a
      defence built on blocking or taking down attacker-controlled infrastructure has almost nothing to
      act on. The platforms are high-reputation, in most organisations legitimately reachable, and
      TLS-protected, so domain reputation, DNS blocking and abuse-report takedowns all fail or lag; the
      operator can move configuration by editing a pin, and the outer traffic terminates on a
      serverless-platform hostname rather than on anything attributable. What still works is
      behavioural: WHICH PROCESS is talking to the consumer platform. A pinboard or a survey tool being
      fetched by a browser is normal; the same fetch issued by a non-browser process, a script host, or
      a suspended-then-resumed system host process is not — so egress telemetry correlated with process
      identity, rather than destination reputation, is the durable control, alongside application
      control to stop the unapproved host binary running at all. SOCRadar's own recommendation is the
      same shape: "security teams should restrict unapproved software through application controls, and
      inspect network traffic for stealthy abuse of trusted platforms and standard services."

      Campaign maturity: SOCRadar notes the PINHOLE delivery script had recorded only 11 execution
      events at analysis time, which it reads as an early-stage campaign — worth carrying, because it
      sets expectations correctly (this is a technique-first finding, not a mass-compromise event).
      SOCRadar publishes indicators of compromise; recorded as existing only, nothing reproduced.
