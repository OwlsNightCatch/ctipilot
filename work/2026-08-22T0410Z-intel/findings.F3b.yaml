  # ==================================================================== F3b-a
  - title: "Check Point reverse-engineers Windows Defender's own signed boot-time remediation driver into a Ring-0 file and registry primitive — no exploit, no CVE, MSRC declines servicing, and the abuse tell is a MISSING service-install event"
    sources:
      - { url: "https://research.checkpoint.com/2026/btr-reforged-weaponizing-defenders-remediation-driver-as-a-kernel-operation-primitive/", publisher: "Check Point Research", date: "2026-08-20", role: "primary" }
    discovery_trace: "first seen at: findings.S3.yaml item (S3 surfacing pass, this run), primary URL https://research.checkpoint.com/2026/btr-reforged-weaponizing-defenders-remediation-driver-as-a-kernel-operation-primitive/ → primary re-fetched in full for this deep read via `tools/fetch_source.py url` (no pivot needed; single-source-by-nature original vendor research)"
    summary: |
      Check Point researcher Jiri Vinopal published the first full reverse-engineering of BTR.sys, the
      Windows Defender "Boot Time Removal" driver. Component and legitimate purpose: BTR.sys is not a
      standalone product but a driver Microsoft ships EMBEDDED AS A PE RESOURCE INSIDE MpEngine.dll (the
      Defender scanning engine). Defender drops it to disk under System32\drivers with a randomised
      8-lowercase-letter filename, and a matching randomly named service, ONLY when a remediation action
      requires a reboot to complete — for example deleting a file that is locked while Windows is running.
      It is a one-shot driver: it loads, performs a list of remediation transactions, reports status, and
      requests its own unload. It exposes no IOCTL interface; it reads its work list from a
      configuration blob referenced by the Args value of its own service key, stored in an NTFS Alternate
      Data Stream on the driver file. That ADS-based configuration mechanism is what drew Check Point's
      attention: the research began as a FALSE-POSITIVE INVESTIGATION during an incident response
      engagement, where the analysts initially hypothesised an attacker had abused the driver and then
      established the activity was legitimate Defender remediation.

      Privilege prerequisite and where this sits in an intrusion — the decisive framing for defenders:
      nothing here is reachable without administrative privilege that includes SeLoadDriverPrivilege.
      There is no exploit, no vulnerability and no memory corruption; the technique is entirely a matter
      of instructing a legitimate signed driver to do what it was built to do. That makes this
      POST-COMPROMISE tradecraft — defence impairment, anti-forensics and persistence staging by an
      attacker who has ALREADY won local admin — and explicitly NOT an initial-access or
      privilege-escalation primitive. Check Point states the trust problem in exactly those terms: the
      issue is "not a vulnerability in the traditional sense, but rather an architectural trust boundary
      that can be crossed if an attacker already has administrative privileges".

      Microsoft's determination, as Check Point reports it: following responsible disclosure, MSRC
      confirmed the findings do not meet the criteria for immediate servicing, because the technique
      relies on pre-existing administrative privileges (SeLoadDriverPrivilege). NO CVE WAS ASSIGNED —
      the report contains no CVE identifier anywhere. Check Point's own reading of that determination is
      that BTR.sys therefore stands as a "Living-off-the-Land" driver (LOLDriver) which, unlike
      third-party drivers that the Microsoft Vulnerable Driver Blocklist neutralises or the LOLDrivers
      project tracks, is an essential built-in Windows component that "remains fully allowed and
      operational".

      Classes of operation the primitive can and cannot perform. Can (the report enumerates six action
      classes): kernel-level file deletion that bypasses exclusive file locks; empty-directory deletion;
      file move/quarantine, which Check Point notes doubles as an arbitrary file write/move into
      otherwise protected locations; registry key deletion including subkeys; registry value deletion;
      and registry value creation/write, which Check Point notes can be used either to establish
      persistence or to disable security controls. Cannot: the report describes NO kernel-memory
      read/write and NO kernel code-execution action — the primitive is confined to file and registry
      operations. It also cannot run as a true boot-start (Start=0) driver: Check Point's empirical
      testing found a hard architectural constraint, because the driver performs file I/O in its
      DriverEntry at a point in Phase 0 boot where the object-manager path it needs does not yet exist.
      The abuse therefore has to run in the same system-start slot Defender itself uses, which is the
      interval Check Point calls the "Golden Window" — filesystem already mounted, Defender's user-mode
      service not yet started. Because the driver runs post-ELAM, ELAM boot-driver evaluation does not
      apply to it.

      Scope and in-the-wild status. Check Point de-duplicated Defender engine builds from public
      repositories and identified 18 unique 64-bit Microsoft-signed BTR.sys versions, all of which share
      the same hard-coded configuration key, with the configuration structure stable and backward
      compatible across Windows 7 through Windows 11 25H2 (as of July 2026) — i.e. a >15-year-stable
      internal interface. A research tool, BTR_CLI, was released publicly under the MIT licence, with
      source AND ready-to-run x64 and x86 executables that embed a fallback copy of the driver; the
      barrier to reuse is therefore low, which is the material risk fact for defenders (the repository
      path is in the report; it is not reproduced here). Against that, Check Point states it observed no
      real-world abuse of BTR.sys in this manner across its samples and telemetry, and frames the window
      as an opportunity: "making proactive detection engineering feasible before weaponization appears
      in the wild".

      DETECTION AND HUNTING SURFACE — the most valuable part, and the reason this is worth an entry
      despite zero observed exploitation. Check Point's own detection work is anchored on Sysmon
      telemetry classes. (1) File-stream-creation telemetry (Sysmon Event ID 15, FileCreateStreamHash) is
      the high-fidelity anchor: reliance on an Alternate Data Stream for configuration is the single most
      distinctive operational characteristic, and the configuration stream name is identical for
      legitimate and abusive use — so the stream's EXISTENCE is not the discriminator, the surrounding
      context is. (2) The feedback-write destination IS a discriminator: legitimate Defender directs the
      driver's status report to a standalone file under Defender's own protected ProgramData scan path,
      whereas the research tool directs it into a second ADS on the driver file itself — so an ADS other
      than the configuration stream appearing on a .sys file is anomalous. (3) File-deletion telemetry
      (Sysmon Event ID 23) attributes the deletion to the kernel, not to the tool that requested it:
      "Sysmon logs the File Delete (Event ID 23), but the Image performing the deletion is recorded as
      System (PID 4), not the user-mode tool that triggered it." The hunt is therefore a correlation —
      System-context deletion of security binaries closely following a driver-load event — not a
      single-event rule. (4) Driver-load telemetry (Sysmon Event ID 6) plus PROCESS LINEAGE: a Microsoft-
      signed load of this driver is expected when a Defender process staged it, and anomalous when
      whatever dropped it sits outside the Defender ecosystem (a shell, a script host, an unknown
      binary). (5) THE ABSENCE-BASED DETECTION, which is the highest-value concept in the report:
      legitimate staging goes through the Service Control Manager, which produces the standard Windows
      service-installation record in the System log (Event ID 7045); the abuse path writes the service
      registry keys directly and loads the driver via a native call, so — in Check Point's words — "This
      bypasses SCM, meaning Event ID 7045 will not trigger." The detection is therefore registry-event
      telemetry (Sysmon Event ID 12/13) showing creation of a service key whose Args value references
      the configuration stream and whose load-order Group is set to the earliest practical system-start
      group, UNACCOMPANIED by the service-installation event that a legitimate install would always
      produce. A missing 7045 alongside a present service-key write is the tell. (6) Anti-forensics
      telemetry: the driver hard-codes creation of a boot-clean log under the system Temp path
      regardless of caller, so rapid create-then-delete of that log by the System process (Sysmon Event
      ID 11 followed by 23) is observable — and its absence where the log should exist is itself
      suspicious. Hardening levers Check Point names: treat SeLoadDriverPrivilege assignment and use as
      a monitored, least-privilege-controlled right (it is the sole precondition); write behavioural EDR
      logic that alerts on security-tool drivers loading outside their expected process lineage
      REGARDLESS of digital signature; and recognise explicitly that the Microsoft Vulnerable Driver
      Blocklist / WDAC does not help here, because this is a functionally-intended driver rather than a
      vulnerable one — so the control has to be load CONTEXT and ADS creation, not driver hashes.

      Benign-lookalike discriminator (directly from the report's own origin story, which is the best
      possible evidence for it): a real Defender remediation that needs a reboot produces almost the
      whole signal set — a randomly named signed driver appearing under System32\drivers, a randomly
      named service key, the configuration ADS, self-cleanup afterwards. Check Point's analysts initially
      read exactly that as malicious kernel-loader behaviour and were wrong. The discriminators are
      therefore: which process staged the driver (Defender engine vs. anything else), whether the
      service-installation event accompanies the service-key write, where the feedback report was
      written (protected Defender path vs. a second stream on the driver), and whether the subsequent
      System-context file/registry operations target security-product components.
