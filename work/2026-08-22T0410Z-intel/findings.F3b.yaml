process_notes: |
  1. F3 (Sonnet-pinned) terminated on a content-safety classifier while reading this same material and
     wrote no findings file. F3b (Opus 5, explicit override) completed the read with the offensive-detail
     exclusions applied at extraction time rather than at composition time — recording that a report
     publishes a transaction format, a tool invocation syntax or an exploitation procedure and then
     moving directly to the detection surface, instead of summarising the procedure first. That framing
     is worth carrying into the agent definition: a deep read of offensive research should state its
     exclusion set BEFORE the first fetch, not filter afterwards.
  2. TRANSPORT / TOOLING FINDING worth folding into prompts. The pre-existing btr_text.txt in this run's
     work dir was produced by an extractor that converted inline <code> elements to newlines, which
     silently splits sentences mid-quote and makes every literal quote check fail on otherwise-correct
     quotes. F3b wrote work/2026-08-22T0410Z-intel/flatten.py, which removes inline tags WITHOUT
     inserting whitespace, maps block tags to a single space, collapses all whitespace runs including
     U+00A0 to one ASCII space, and PRESERVES curly quotes and apostrophes so a retyped quote fails
     loudly. All 79 literal checks in this return pass grep -F against those flattened bodies (50 evidence quotes + 29 technique-supporting sentences), and the method
     also caught all six S3 quote defects (four ellipsis-splices or rewordings, one re-capitalisation,
     one tense change). Recommend promoting a flatten-for-quote-check helper into tools/ so quote
     verification is deterministic across runs rather than re-implemented per sub-agent.
  3. The jina reader pool was not needed: `tools/fetch_source.py url` returned full bodies for all
     four hosts (Check Point, Talos x2, SOCRadar, BleepingComputer) on the first attempt, including
     BleepingComputer, which is often anti-bot gated. No reader credit spent.
  4. ATT&CK v19 revocation check performed against the pinned attack/enterprise-attack.json (v19.2):
     T1562.001 -> REVOKED, forwards to T1685; T1215 -> REVOKED, forwards to T1547.006. Neither Talos
     post publishes an ATT&CK table at all; SOCRadar's published table uses no revoked ids. The only
     v19 exposure in this run's material is therefore in OUR OWN mappings, which is where the two
     substitutions above were applied.
