  # ==================================================================== F3b-b
  - title: "Cisco Talos: UAT-10147's SPECTRE implant blinds EDR by unlinking kernel callbacks via two long-known vulnerable third-party drivers, and persists on Linux as a fake ACPI kernel module ordered to start before any security tooling"
    sources:
      - { url: "https://blog.talosintelligence.com/uat-10147-deploys-spectre-a-cross-platform-implant-with-linux-rootkit-and-byovd-capabilities/", publisher: "Cisco Talos", date: "2026-08-20", role: "primary" }
      - { url: "https://blog.talosintelligence.com/uat-10147-chinese-speaking-adversary-integrates-agentic-ai-into-post-compromise-operations/", publisher: "Cisco Talos", date: "2026-08-20", role: "primary" }
    discovery_trace: "first seen at: findings.S3.yaml item (S3 surfacing pass, this run), primary URLs https://blog.talosintelligence.com/uat-10147-deploys-spectre-a-cross-platform-implant-with-linux-rootkit-and-byovd-capabilities/ and https://blog.talosintelligence.com/uat-10147-chinese-speaking-adversary-integrates-agentic-ai-into-post-compromise-operations/ → both companion posts re-fetched in full for this deep read via `tools/fetch_source.py url` (no pivot needed; both are the originating lab's own posts, author Joey Chen)"
    summary: |
      Two companion Cisco Talos posts, same author and date, cover one actor: UAT-10147, characterised
      by Talos as "a highly capable Chinese-speaking intrusion actor operating a multi-platform
      post-exploitation ecosystem targeting IIS and Linux servers".

      Monetisation model and confirmed victimology. Talos states the group "engages in multiple criminal
      activities, including search engine optimization (SEO) fraud and data theft" — i.e. financially
      motivated crime, with revenue from SEO/search-ranking fraud delivered by BadIIS malware-as-a-service
      and a C# ASHX SEO handler installed on compromised IIS servers, plus data theft. Confirmed
      geographies from Talos's investigation: affected servers in BRAZIL, BOLIVIA, CHINA, CANADA and
      VIETNAM. Confirmed sectors: GOVERNMENT, UNIVERSITIES/EDUCATION, MEDIA, TECHNOLOGY and GAMING. A
      target list of roughly 170,000 URLs was recovered from an open directory on actor infrastructure,
      so intended targeting is far broader than confirmed victimology. NOTE FOR THE ENTRY: no European
      or Swiss victim is named. The relevance to this constituency is (a) sector match — government and
      universities are among the confirmed victim sectors, (b) the exposure class — internet-facing
      Windows/IIS and Linux web servers reached through publicly disclosed vulnerabilities, and (c) the
      transferability of the two defence-impairment techniques below, which are actor-agnostic.

      Implant platform coverage and capability classes, in general terms. SPECTRE is a cross-platform
      backdoor written in C, with Windows and Linux builds sharing a common structure (the Linux build a
      statically linked ELF x86-64). The Windows build is described as diverging from a stock offensive
      framework through custom post-exploitation and defence-evasion capability compiled into the binary.
      Capability classes, no procedure: runtime-only API resolution and per-string compile-time
      encryption, so static indicators are largely absent from the binary's code and data sections; a
      weighted anti-analysis scoring routine that evaluates host characteristics (process names, RAM,
      CPU cores, disk, sleep acceleration, sandbox host and user names) and self-terminates above a
      threshold; three process-injection modalities including hollowing into a common service host
      process by default and an automatic self-hollow into a Windows shell-broker process at startup;
      credential theft and token theft; HTTP-based C2 with a hard-coded fallback domain and, in one
      observed build, C2 configuration read from an NTFS Alternate Data Stream on a system file so the
      operator can re-point C2 without recompiling; a large command set (Talos counted 45 Windows
      commands, part plaintext and part encrypted-and-decrypted-per-dispatch); and on Linux, an
      integrated kernel rootkit with its own command group.

      THE BYOVD STEP AS A DEFENDER SEES IT — the highest-value part for detection. Talos states SPECTRE
      retrieves one of two long-known vulnerable third-party drivers from its C2 — RTCore64.sys from MSI
      (CVE-2019-16098) or DBUtil_2_3.sys from Dell (CVE-2021-21551) — writes it to a temporary location,
      and installs it as a transient kernel service. What a defender observes is therefore an ordinary,
      well-understood sequence: a new driver file appearing in a user-writable temp path, a short-lived
      kernel-mode service being created and started, and a kernel driver load of a signed but
      contextually absurd component (a graphics-card overclocking utility driver or a Dell firmware
      utility driver on a web server). What follows is the part that matters: using the arbitrary
      kernel read/write those drivers expose, the implant locates the kernel image and, from a
      per-build offset table Talos says covers 13 Windows versions, resolves the addresses of the three
      process-, thread- and image-load notification callback routines and unlinks each registered EDR
      callback. Talos's own words for the effect on endpoint-sensor visibility: "kernel-callback-dependent
      security products such as CrowdStrike Falcon, SentinelOne, Microsoft Defender, and other
      well-known EDR vendors are rendered completely blind to new process creations, thread creations,
      and image load events for the remainder of the session, successfully neutralizing EDR visibility
      on the target machine." Detection consequence, stated plainly: after this step the endpoint sensor
      stops being a witness. The detectable moment is the driver install and load — before the blinding
      — and, after it, the SILENCE ITSELF: an agent that remains "healthy"/checked-in while emitting no
      process-creation, thread-creation or image-load events for a host that is demonstrably still doing
      work is the anomaly. That makes sensor-health and event-rate-per-host telemetry (a class most SOCs
      hold but few alert on) the durable detection, alongside the driver-load telemetry class with
      lineage and load-context, exactly as in the Check Point item above. Hardening lever: vulnerable-
      driver blocklisting (WDAC / Microsoft Vulnerable Driver Blocklist / HVCI) does apply here, because
      unlike the BTR.sys case these ARE third-party vulnerable drivers with known CVEs — this is the
      textbook case the blocklist exists for.

      LINUX PERSISTENCE AS STATED — module name, unit, and the ordering property. The rootkit component,
      which Talos calls Specter, is deployed as a loadable kernel module DISGUISED AS "acpi_pad.ko",
      impersonating the legitimate ACPI processor-power-management module. Persistence is a fraudulent
      systemd unit named "hardware-monitor.service" carrying the description "Hardware Performance
      Monitor". The ordering property that makes this dangerous, in Talos's words: the service "is
      configured with 'Before=sysinit.target', ensuring the rootkit executes on every system boot prior
      to the initialization of any security tooling." So on Linux the same "get in before the defender
      wakes up" idea as the Windows boot-window case, expressed through systemd ordering rather than
      driver load groups. Observable rootkit behaviour: rather than patching the syscall table, the
      module hooks six syscall handlers through the kernel's own ftrace instrumentation framework with
      the instruction-pointer-modify flag; it can hide processes by removing a task from the kernel PID
      list (making the corresponding /proc entry vanish) and hide itself from lsmod by unlinking its own
      module entry from the kernel module list; user-mode-to-kernel control uses signals sent to a magic
      PID. Detection concepts that follow: module-load audit telemetry (a kernel module named after a
      legitimate ACPI module but loading from an unexpected path, unsigned, or at a time no firmware/
      power event explains); systemd unit-file creation/enablement telemetry, with unit-ordering
      directives that place a non-security unit before sysinit.target as the specific anomaly;
      inconsistency-based hunting for the hiding itself (processes visible to one enumeration path but
      absent from /proc, or a loaded module absent from lsmod); and kernel taint/ftrace-hook state, which
      Talos notes the rootkit's own source comments discuss. Benign lookalike to discriminate: legitimate
      hardware-monitoring and power-management agents DO ship kernel modules and systemd units with
      similar names — the discriminators are module provenance (package-managed path and signature vs.
      dropped file), whether a package database owns the unit and the module, and the ordering directive
      itself, which legitimate monitoring agents rarely need.

      Initial access and privilege escalation (from the companion post — patch-relevant exposure).
      Talos: "The actor leveraged publicly disclosed vulnerabilities to gain initial access at scale."
      Named for RCE: CVE-2022-27925 (Zimbra Collaboration), CVE-2019-18935 (Telerik UI for ASP.NET
      AJAX), CVE-2021-23758 (AjaxPro deserialization), and CVE-2021-29441 / CVE-2021-29442 which Talos
      characterises jointly as arbitrary code execution in the Nacos framework. Named for Linux local
      privilege escalation: CVE-2022-0847 (Dirty Pipe), CVE-2022-0995, CVE-2021-3156 (Baron Samedit),
      CVE-2015-5287, CVE-2015-3246, CVE-2010-3904. On Windows the escalation route is the Potato family
      of token-impersonation tools against IIS worker processes holding SeImpersonatePrivilege. Talos
      also identifies one clean, non-obvious hardening lever for the ASP.NET ViewState path: "the threat
      actor's success is entirely dependent on key material exposure making MachineKey confidentiality
      the most critical defensive control" — i.e. rotate and protect ASP.NET machine keys, and assume
      any key present in a public leaked-key database is compromised.

      THE AI-AUTHORSHIP CLAIM — what is demonstrated versus what is assessed. This must be carried as an
      ASSESSMENT, not a fact, and Talos itself is careful about it. Demonstrated (artefacts Talos
      recovered): AI-driven offensive frameworks installed on the actor's own management/C2 server;
      AI-generated operational documentation, including a step-by-step exploitation guide with a
      prerequisites section, companion automation scripts, and a findings log recording confirmed
      exploitation and reconnaissance results; and a build path containing an "AI" directory in
      custom-compiled privilege-escalation tooling. Assessed, with Talos's modality preserved: (a)
      "Talos assesses with moderate-to-high confidence that UAT-10147 is among an emerging class of
      financially motivated intrusion operators leveraging agentic AI systems to operationalize
      offensive tradecraft at scale"; (b) on the rootkit source, "Talos investigated the source code of
      the Specter rootkit and assesses with medium confidence that UAT-10147 leveraged a combination of
      AI-assisted development and human expertise in the creation of this rootkit" — the evidence being
      STYLISTIC, not technical: a product-spec-shaped feature list reading as a response to a prompt,
      machine-uniform decorative separators across 10+ sections, a pedagogical tone explaining basic
      concepts to nobody, and three alternative implementations labelled "Method 1/2/3" which Talos
      calls an AI "completeness reflex"; (c) explicitly NOT observed — "While we have not directly
      observed the actor exploiting vulnerabilities discovered by DeepAudit in victim environments, we
      did observe the framework installed on their management server", with Talos assessing intent at
      high confidence and additionally raising the alternative that the actor may use the same tool
      defensively on its own infrastructure. That last passage is the model for how the entry should
      handle the whole AI angle: Talos separates observation from inference and offers a competing
      explanation, and the entry must not flatten that. Talos's forward-looking judgement is also an
      assessment: integrating AI-generated exploitation guidance, automation and validation "enables
      threat actors to scale complex attacks more efficiently while reducing the expertise traditionally
      required for advanced post-compromise operations".

      Talos's own ATT&CK mapping: NEITHER post publishes an ATT&CK mapping table. Verified by searching
      both fetched bodies for "MITRE" and "ATT&CK" — zero matches in either. The technique mapping in
      this return is therefore F3b's own, sentence-anchored, not carried from the source.

      Detection content and IOCs: both posts publish vendor detection content (antivirus signature names
      and network-IPS rule identifiers) and both link a full indicator file in the vendor's public IOC
      repository. Recorded here as EXISTING ONLY — no signature names, rule identifiers, indicator
      values or repository links are reproduced, per the no-IOC / no-rule-content policy.
