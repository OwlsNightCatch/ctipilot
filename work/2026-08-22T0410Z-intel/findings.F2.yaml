    discovery_trace: "first seen at: findings.S1.yaml item 3 (this run) → pivot: Cisco PSIRT HTML advisories, URL https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-hardening-crosswork-UzDTU9Vh and https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-hardening-csw1-shSvndWP → primary: each advisory's own CSAF 2.0 JSON export (linked from the HTML page's 'Download CSAF' button), URL https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-hardening-crosswork-UzDTU9Vh/csaf/cisco-sa-hardening-crosswork-UzDTU9Vh.json and https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-hardening-csw1-shSvndWP/csaf/cisco-sa-hardening-csw1-shSvndWP.json → corroborating: NCSC-NL independent CSAF record for the Secure Workload cluster, URL https://advisories.ncsc.nl/advisory?id=NCSC-2026-0323 (per-CVE vectors match Cisco's CSAF exactly)"
    summary: |
      Cisco's own CSAF 2.0 JSON exports for both advisories (linked from each HTML page's "Download
      CSAF" control) carry per-CVE CVSS v3.1 vectorStrings that the HTML advisory pages and the S1
      surfacing pass did not have (the HTML page's "Details" table shows only a numeric score per CWE
      grouping, not the vector). Reading them precisely settles the authentication question the task
      specifically asked about. Crosswork (Data Gateway, Network Controller, Planning, Workflow
      Manager — 7.2.1 and earlier / 2.1.1 and earlier, fixed in 7.2.1-SP / 2.1.1-SP for all four):
      CVE-2026-20030 (CWE-89 SQLi) CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H = 10.0, unauthenticated;
      CVE-2026-20357 (CWE-306 missing authentication) same vector, 10.0, unauthenticated; CVE-2026-20358
      (CWE-73 external control of filesystem) CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:N/I:H/A:H = 10.0,
      unauthenticated; CVE-2026-20359 (CWE-522 insufficiently protected credentials)
      CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H = 9.9 — PR:L, i.e. this one REQUIRES low-privilege
      access, not unauthenticated. Secure Workload (SaaS and on-prem; 3.10 and earlier fixed in
      3.10.9.1, 4.0 fixed in 4.0.4.16): CVE-2026-20231 (CWE-74 injection)
      CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H = 9.9 — PR:L, low-privilege required; CVE-2026-20315
      (CWE-284 improper access control) CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H = 10.0,
      unauthenticated; CVE-2026-20317 (CWE-287 improper authentication)
      CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:N/I:H/A:H = 10.0, unauthenticated; CVE-2026-20318 (CWE-20
      improper input validation) CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:N/I:H/A:H = 9.6 — PR:L,
      low-privilege required; CVE-2026-20319 (CWE-119 buffer restriction)
      CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H = 7.5, unauthenticated. Net: SIX of the nine CVEs
      (20030, 20357, 20358, 20315, 20317, 20319) are unauthenticated (PR:N); THREE (20359, 20231,
      20318) require low-privilege access (PR:L) — the two credential/input-validation-class bugs on
      Secure Workload and the one credentials-class bug on Crosswork are the PR:L outliers. NCSC-NL's
      independently-published CSAF record for the Secure Workload cluster carries the identical five
      vectors, confirming Cisco's own numbers rather than a transcription artifact. Cisco's advisory
      text confirms the grouping methodology explicitly: "Cisco has grouped these issues by their
      underlying vulnerability class — Common Weakness Enumeration (CWE) — and assigned a single
      Common Vulnerabilities and Exposures Identifier (CVE ID) to each CWE grouping," and further
      states "The CVSS score that is assigned to each CVE ID represents the maximum potential
      severity of the single most impactful underlying vulnerability within that specific CWE
      category" — i.e. one CVE can bundle multiple underlying bugs of the same CWE class, scored at
      the worst one's severity, the identical shape this pipeline previously saw in Cisco's August IOS
      XE hardening release (not independently re-verified against that release this run for time
      reasons, but the advisory's own wording is the same "grouped by CWE, one CVE per class"
      construction). Both advisories confirm verbatim: "The Cisco PSIRT is not aware of any public
      announcements or malicious use of the vulnerabilities that are described in this advisory" and
      "There are no workarounds that address these vulnerabilities" — patching is the only path.
      New detail beyond the S1 summary: both advisories' "Source" sections state "These
      vulnerabilities were found during internal security testing using existing testing processes as
      well as frontier AI models" — Cisco is crediting AI-assisted internal testing tooling, not a
      named human researcher or external report, as (partial) provenance for the discovery. Also new:
      the Secure Workload advisory's Fixed Software note states "The Cluster, Agent, and Connector
      software of Cisco Secure Workload need to be upgraded to resolve all of these vulnerabilities.
      For SaaS deployments, Cisco has upgraded the Cluster software, and customers need to upgrade
      only the Agent and Connector software" — SaaS customers still have client-side work to do
      (Agent/Connector upgrade), it is not a fully server-side fix. Finally, both HTML advisories'
      header metadata show "First Published: 2026 August 19 16:00 GMT" — TWO DAYS before the
      2026-08-21 date the S1 surfacing pass (via NCSC-CH Security Hub) picked the story up on; the
      Crosswork advisory's header additionally shows "Last Updated: 2026 August 21 16:54 GMT" under
      "Version 2.0: Final" — meaning 21 August was a revision/finalization of an advisory that had
      already been public for two days, a distinction relevant to the main agent's in-window
      recency call.
