    summary: |
      TP-Link's own advisory (document 132084, titled "Security Advisory: Multiple Vulnerabilities in
      Omada Gateways (CVE-2026-9033, CVE-2026-19586, CVE-2026-19683)", dated 08-20-2026) was recovered
      this run via the bridge fetcher against the specific document-ID URL BSI CERT-Bund's CSAF
      "references" section names as its external source — the JS-only SPA landing the S1 surfacing
      pass hit is a different, non-content-bearing path. The vendor's own text gives per-CVE CVSS v4.0
      vectors that the S1 pass did not have: CVE-2026-19586 (Pre-Authentication OS Command Injection
      in Omada Gateways on OpenVPN Server) is CVSS v4.0 9.3/Critical, vector
      CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:L/SI:L/SA:L — network-reachable, no attack
      requirements beyond reachability, unauthenticated. TP-Link's own root-cause text: "insufficient
      validation of client-supplied data during OpenVPN connection establishment" with the explicit
      precondition "Exploitation requires the OpenVPN Server feature to be enabled, VPN service must
      be reachable by the attacker, and the attacker must be able to initiate an OpenVPN connection
      attempt." CVE-2026-9033 (Unauthenticated Captive Portal Session Termination and Forced Logout)
      is CVSS v4.0 6.0/Medium, vector CVSS:4.0/AV:A/AC:L/AT:P/PR:N/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:N —
      note AV:A (adjacent network, i.e. the attacker needs network access to the captive-portal
      segment, not raw internet reach) and AT:P (attack requirements present), a nuance NVD's record
      did not surface. CVE-2026-19683 (Unencrypted Credential Transmission in Omada Gateway Dynamic
      DNS Authentication) is CVSS v4.0 6.3/Medium, vector CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:N/VC:L/VI:L/
      VA:N/SC:N/SI:N/SA:N. The vendor's per-model, per-hardware-version fixed-firmware table is
      substantially LARGER than the S1 surfacing pass's list of eight models: it names 19 rows across
      17 distinct model names plus split hardware versions on two of them (ER706W-4G v1 fixed at
      1.2.11 Build 20260723 Rel.41567 vs. ER706W-4G v2 fixed at 2.1.11 Build 20260723 Rel.41624 — two
      different fixed builds for the SAME model name depending on hardware revision). The additional
      models the S1 pass's list omitted: ER706WP-4G (v1, fixed 1.1.11 Build 20260723 Rel.41624),
      ER703WP-4G-Outdoor (v1, fixed 1.1.7 Build 20260723 Rel.41712), DR3220v-4G (v1, fixed 1.2.0 Build
      20260630 Rel.82652), DR3650v (v1, fixed 1.2.0 Build 20260630 Rel.83311), DR3650v-4G (v1, fixed
      1.2.0 Build 20260630 Rel.83347), ER603WP-4G-Outdoor (v1, fixed 1.0.2 Build 20260723 Rel.43271),
      DR3150 (v1, fixed 1.0.1 Build 20260722 Rel.16854), ER701-5G-Outdoor (v1, fixed 1.0.3 Build
      20260723 Rel.40931), and ER605W (v2, fixed 2.0.4 Build 20260723 Rel.43763). The vendor's stated
      workaround is narrow and CVE-specific: "If immediate firmware upgrade is not possible, users
      should disable the OpenVPN Server feature until the fixed firmware can be applied. If OpenVPN
      Server must remain enabled, restrict access to the OpenVPN service to trusted networks or
      trusted source IP addresses only, and ensure the service is not exposed to the public
      Internet unless required." No source reached this run — not TP-Link's own advisory, not BSI's
      CSAF record — states whether the OpenVPN Server feature is enabled by default or must be
      manually turned on; this remains an open gap. No source states exploitation, scanning activity,
      or a public PoC for any of the three CVEs.
