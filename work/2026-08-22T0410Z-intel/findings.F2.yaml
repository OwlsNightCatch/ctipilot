  - title: "Cisco Crosswork + Secure Workload hardening release: per-CVE CVSS vectors from Cisco's own CSAF show SIX of nine CVEs are unauthenticated (PR:N) and THREE require low-privilege access (PR:L) — not a uniform unauthenticated set; advisories were FIRST published 2026-08-19, not 2026-08-21"
