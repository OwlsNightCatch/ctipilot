    summary: |
      Zoom publishes one bulletin per CVE, not one combined bulletin for "Zoomsday." Reading all three
      directly: ZSB-26015 (CVE-2026-53413, "Zoom Clients - Buffer Over-write") is CVSS 8.3/High, vector
      CVSS:3.1/AV:N/AC:H/PR:N/UI:R/S:C/C:H/I:H/A:H, description "Missing bounds check in the annotator
      function of Zoom Clients allows buffer over-write, which may allow a meeting participant to
      achieve remote code execution of another participant via network access," reported by "Idan
      Levcovich, A Security." Affected/fixed: Zoom Workplace before 7.1.0 and 7.0.6 (branch-dependent),
      Zoom Workplace VDI Client for Windows before 7.0.11 and 6.6.16, Zoom Rooms before 7.1.0, Zoom
      Meeting SDK before 7.1.0, Zoom Video SDK before 2.6.0. ZSB-26016 (CVE-2026-53414, "Zoom Clients -
      Buffer Over-read") is CVSS 6.5/Medium, vector CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:N/I:N/A:H
      (denial-of-service impact only — A:H with C:N/I:N), same "Idan Levcovich, A Security" credit,
      IDENTICAL affected/fixed table to ZSB-26015. ZSB-26017 (CVE-2026-53415, "Zoom Clients - Use After
      Free") is CVSS 8.3/High, the SAME vector as CVE-2026-53413
      (CVSS:3.1/AV:N/AC:H/PR:N/UI:R/S:C/C:H/I:H/A:H), description "Use after Free in the annotator
      function of Zoom Clients may allow a meeting participant to achieve remote code execution of
      another participant via network access" — BUT its affected/fixed table is DIFFERENT and HIGHER:
      Zoom Workplace before 7.1.5 (not 7.1.0) and 7.0.6, Zoom Rooms before 7.1.5 (not 7.1.0), Zoom
      Meeting SDK before 7.1.5 (not 7.1.0), Zoom Video SDK before 2.6.5 (not 2.6.0); VDI Client is the
      same 7.0.11/6.6.16. This means a fleet patched only to the 7.1.0-line version that closes
      CVE-2026-53413/-53414 is NOT yet patched against CVE-2026-53415 — a defender needs the 7.1.5 /
      2.6.5 floor to close all three. ZSB-26017's "Reported by" field reads "Zoom Offensive Security" —
      Zoom's OWN internal red team, not A Security. CCB Belgium's advisory ("Warning: Zero-Click Remote
      Code Execution in Zoom Clients, Patch Immediately!," 2026-08-20) covers ONLY CVE-2026-53413: its
      "CVE/CVSS" field lists a single entry, "CVE-2026-53413: 8.3 (CVSS:3.1/AV:N/AC:H/PR:N/UI:R/S:C/
      C:H/I:H/A:H)," and the word "53414" / "53415" does not appear anywhere in the advisory body — CCB
      says nothing about the other two CVEs. CCB states no in-the-wild exploitation claim of any kind
      — the only occurrences of "exploit"/"wild" in its text are the hypothetical "may protect against
      future exploitation" and the caveat "it does not remediate historic compromise," never a claim
      of observed activity. On the UI:R vs. "zero-click" tension the task asked to be reported
      precisely: Zoom's OWN CVSS vector for both RCE-capable CVEs (53413, 53415) carries UI:R (User
      Interaction: Required) — yet CCB titles its advisory "Zero-Click," and A Security's own framing
      is "No click, no download, and nothing required of the victim but being in the meeting." No
      source — not Zoom, not CCB, not A Security — explicitly reconciles this: the most defensible
      reading, unstated by any source, is that CVSS UI:R is apparently being scored for the victim's
      mere presence as a participant whose client automatically parses incoming annotation protocol
      data (a passive, non-consensual "interaction" in the everyday sense), not for an explicit action
      like clicking a link — but no cited source says this in so many words, so this reading is offered
      as an unattributed inference, not a sourced fact. The vulnerable function, per A Security's own
      reverse-engineering write-up: "CAnnoFormatBlock::Deserialize" — "a small header followed by four
      fixed 128-byte buffers... The wire supplies a character count per buffer, and the parser copies
      2 × count bytes into it... Each count is a 32-bit value taken straight off the wire, and each
      buffer is a fixed 128 bytes. There is no bounds check to stop a count from exceeding the buffer
      length." A separate factory-level design flaw enables reaching it from either meeting seat:
      Zoom's protocol dispatches on a numeric PDU opcode (AddObj = 0x10001, AddObjAck = 0x10002) with,
      per A Security, "no sender-role or origin check" — an ack-type PDU is allowed to carry a full
      object body, so a participant can inject an "AddObj" where only an acknowledgement is expected.
      Disclosure timeline, per A Security: 2026-06-08 vulnerability discovered; 2026-06-09 zero-click
      RCE confirmed on Zoom client v7.0.5 (all platforms); 2026-06-10 reported to Zoom; 2026-06-11 Zoom
      acknowledges receipt; 2026-06-22 Zoom ships client-side fix in v7.1.0 covering CVE-2026-53413 and
      CVE-2026-53414; 2026-07-15 Zoom deploys a server-side mitigation for still-unpatched clients;
      2026-07-20 Zoom ships client-side fix in v7.1.5 covering CVE-2026-53415; 2026-08-11 public
      disclosure. A genuine, unreconciled three-way contradiction on CVE-2026-53415's provenance: (1)
      A Security's own Executive Summary states "A third vulnerability, CVE-2026-53415, was reported
      but had already been found and fixed by Zoom before our report" — implying Zoom found it
      independently; (2) A Security's own later, detailed section is titled "CVE-2026-53415: The
      Sequel — A Second, Independent RCE" and states "The same AI-assisted research surfaced a second,
      independent flaw in the very same engine... Lidor Elias identified and triaged this bug" —
      implying A Security's OWN research team found it; (3) Zoom's bulletin ZSB-26017 itself credits
      "Zoom Offensive Security," not A Security, as the reporter. These three statements are not
      reconcilable as written and are reported here exactly as each source states them, without
      resolving which is correct. Finally, on the specific mitigation question the task asked to be
      checked precisely: no source states "disable in-meeting annotation via account/group policy" as
      a mitigation for these specific CVEs. A Security's actual stated interim mitigation for
      unpatched fleets is different and more specific: keep Zoom's default "enhanced encryption"
      setting (i.e. do NOT enable end-to-end encryption) so that "Zoom's server-side mitigation" —
      which filters malicious annotation messages before they reach clients — can still operate; per A
      Security, "E2EE removes it, because a server cannot inspect what it cannot read. E2EE would not
      have stopped this attack anyway: the attacker sits in the meeting, holding the keys." Separately,
      in a forward-looking "reduce attack surface" section unrelated to this specific bug, A Security
      does suggest organizations more generally "consider locking annotation, file transfer,
      whiteboarding, remote control and third-party apps, and limiting screen sharing to hosts" — but
      frames this as general hardening advice for the NEXT vulnerability class, not as the stated fix
      for Zoomsday specifically.
