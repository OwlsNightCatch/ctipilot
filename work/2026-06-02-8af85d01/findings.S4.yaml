items:
  - title: "Meta AI support chatbot social-engineered into resetting Instagram account passwords — high-value accounts hijacked by pro-Iranian actors"
    sources:
      - url: "https://krebsonsecurity.com/2026/06/hackers-used-metas-ai-support-bot-to-seize-instagram-accounts/"
        publisher: "Krebs on Security"
        date: "2026-06-01"
        role: "primary"
      - url: "https://techcrunch.com/2026/06/01/hackers-hijacked-instagram-accounts-by-tricking-meta-ai-support-chatbot-into-granting-access/"
        publisher: "TechCrunch"
        date: "2026-06-01"
        role: "corroborating"
    discovery_trace: >
      first seen at: krebsonsecurity feed, URL https://krebsonsecurity.com/feed/
      → primary: Krebs on Security article, URL https://krebsonsecurity.com/2026/06/hackers-used-metas-ai-support-bot-to-seize-instagram-accounts/
      → corroborating: TechCrunch, URL https://techcrunch.com/2026/06/01/hackers-hijacked-instagram-accounts-by-tricking-meta-ai-support-chatbot-into-granting-access/
      → WebSearch confirmed 404 Media, Engadget, Gizmodo also covered
    summary: |
      On the weekend of May 31–June 1, 2026, instructions circulated on Telegram showing how to trick Meta's conversational "AI support assistant" bot into adding a new email address to an existing Instagram account and triggering a password reset — bypassing Instagram's normal account-recovery friction. The technique: use a VPN to place the source IP near the target's location, then prompt Meta's AI support chatbot to link a new email, receive a verification code at the attacker-controlled address, and complete a password reset. Accounts with any MFA (even SMS OTP) were unaffected. Pro-Iranian actors used the method to briefly deface accounts including the archived Obama White House Instagram and the Chief Master Sergeant of the US Space Force. Other confirmed takeovers included brand account @sephora and several high-value short-name handles (estimated resale value >$500k). Meta VP Andy Stone confirmed the issue was resolved by June 1; cybersecguru.com reported Meta pushed an emergency patch. Black Lotus Labs researcher Ian Goldin noted the attack class — AI bots being socially engineered through the same psychological levers that work on human support staff — is structurally novel and likely to recur across any platform deploying AI for account-recovery workflows. No backend database breach occurred; the impact was account hijacking via the recovery-flow surface. Key lesson: AI-assisted customer support that can modify account credentials or linkages without a second-factor check creates a bypass of the account's MFA envelope from the *support channel direction*.
    ch_eu_nexus: "Global; EU/CH platforms that embed AI-based account-recovery or support chatbots face the same structural exposure. The attack class generalises to any SaaS identity system where an AI agent can modify account credentials or authentication state."
    public_sector_nexus: "Indirect — public-sector accounts on social media platforms are explicit targets; demonstrated by Space Force and Obama White House Instagram handles."
    sector: "Technology, social media; any sector using AI-driven customer support for account recovery"
    cves: []
    actors_campaigns_malware: ["pro-Iranian actors (unattributed cluster; pro-Iranian imagery, Telegram-distributed exploit instructions)"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "The Instagram accounts for the Obama White House and the Chief Master Sergeant of the U.S. Space Force were briefly defaced with pro-Iranian images and messages over the weekend, after instructions began circulating on Telegram showing how to trick Meta's 'AI support assistant' bot into resetting account passwords."
        attribution: "Krebs on Security"
        source_url: "https://krebsonsecurity.com/2026/06/hackers-used-metas-ai-support-bot-to-seize-instagram-accounts/"
      - quote: "the hackers who released the video on Telegram said their exploit failed to work against any accounts that had MFA enabled"
        attribution: "Krebs on Security"
        source_url: "https://krebsonsecurity.com/2026/06/hackers-used-metas-ai-support-bot-to-seize-instagram-accounts/"
      - quote: "Several users on social media reported having their Instagram accounts hacked over the weekend. Meta's own support chatbot was blamed for allowing hackers to hijack accounts."
        attribution: "TechCrunch"
        source_url: "https://techcrunch.com/2026/06/01/hackers-hijacked-instagram-accounts-by-tricking-meta-ai-support-chatbot-into-granting-access/"
    extended_notes: |
      Detection/Hunt angle: Review access logs for Meta AI support sessions followed by email-address changes and password resets within a short window; watch for anomalous new device registrations from geo-distant IPs immediately after a support-channel interaction. Defender takeaway: Any AI support/bot layer that can modify account authentication state (email, phone, recovery key) without requiring a second-factor challenge from the *existing* registered methods is an account-takeover surface regardless of the strength of the main authentication. Ensure the AI bot's capabilities are scoped to read-only queries and that credential-modifying actions always require OOB challenge to the *currently registered* contact methods.

  - title: "Spain National Police arrest doxer who published personal data on INCIBE, State AG, Civil Guard, National Police and National Security Council staff — BreachForums-published campaign, arrest May 27 in Granada"
    sources:
      - url: "https://www.bleepingcomputer.com/news/security/spain-arrests-doxer-leaking-sensitive-data-of-govt-employees/"
        publisher: "BleepingComputer"
        date: "2026-06-01"
        role: "primary"
      - url: "https://policia.es/_es/comunicacion_prensa_detalle.php?ID=16895"
        publisher: "Policía Nacional (Spain) — press release"
        date: "2026-06-01"
        role: "corroborating"
    discovery_trace: >
      first seen at: bleepingcomputer feed, URL https://www.bleepingcomputer.com/feed/
      → primary: BleepingComputer article, URL https://www.bleepingcomputer.com/news/security/spain-arrests-doxer-leaking-sensitive-data-of-govt-employees/
      → corroborating: Policía Nacional press release linked in article, URL https://policia.es/_es/comunicacion_prensa_detalle.php?ID=16895
      → second corroboration: TodoAlicante English coverage, URL https://www.todoalicante.es/english/arrested-massively-leaking-personal-20260601100612-nt.html
    summary: |
      On May 27, 2026, Spain's National Police arrested an individual in the province of Granada on suspicion of publishing personal data belonging to members of multiple high-value Spanish state institutions: the State Attorney General's Office (Fiscalía General del Estado), the National Cybersecurity Institute (INCIBE), the National Police, the Civil Guard, and the National Security Council. The operation was overseen by Madrid Investigating Court No. 22. The leak was attributed to the threat group "Police-ESP-Doxed," which published the data on BreachForums. INCIBE had flagged in February 2026 that no direct systems compromise was involved — the data appears to have been aggregated from older breaches, credential dumps, and OSINT tools, with some records containing outdated information including names of employees who had left years earlier. The arrest followed detection of "mass dissemination of this data" posing immediate risk to the individuals and institutions involved. Police seized computers and electronic devices. The operation remains open to identify possible additional participants. The doxing method (OSINT aggregation + prior breach enrichment + BreachForums publication) mirrors tactics seen in other European law-enforcement-targeted campaigns; the primary concern is enabling threats, extortion, and social engineering against critical infrastructure officials.
    ch_eu_nexus: "Direct EU nexus — Spain (EU member state). The technique of aggregating OSINT + prior breach data against government/cybersecurity-institute employees is directly applicable to Swiss and EU national security institutions."
    public_sector_nexus: "Direct — targets include national cybersecurity authority (INCIBE), civil security apparatus, and senior judicial/law enforcement staff."
    sector: "Government, national security, cybersecurity authority"
    cves: []
    actors_campaigns_malware: ["Police-ESP-Doxed (threat group name; BreachForums publication)"]
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "The police notes that the published data was from the State Attorney General's Office, INCIBE, the National Police, the Civil Guard, and the National Security Council, all critical entities in the country."
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/spain-arrests-doxer-leaking-sensitive-data-of-govt-employees/"
      - quote: "The investigation, overseen by Madrid Investigative Court No. 22, began after authorities detected the mass dissemination of this data, which created an immediate risk to the security and integrity of both the affected individuals and the institutions themselves"
        attribution: "BleepingComputer (quoting Policía Nacional)"
        source_url: "https://www.bleepingcomputer.com/news/security/spain-arrests-doxer-leaking-sensitive-data-of-govt-employees/"
    extended_notes: |
      The INCIBE February 2026 post clarified this was a doxing aggregation campaign, not a direct breach of INCIBE systems. The attack pattern — sourcing from historical breaches, credential dumps, and OSINT, then correlating into dossiers on security officials — is a standard pre-attack reconnaissance step for subsequent phishing, vishing or social engineering. Defence: ensure employees across sensitive organisations have opted out of data brokers, regularly check personal information for exposure in breach databases, and train staff on heightened phishing risk when their contact details are circulated in adversarial forums.

  - title: "UPDATE: ShinyHunters Charter Communications — data published after ransom refused; HIBP confirms 4.9M unique email addresses exposed"
    sources:
      - url: "https://securityaffairs.com/192907/uncategorized/shinyhunters-leaks-charter-communications-data-potentially-impacting-5-million-customers.html"
        publisher: "Security Affairs"
        date: "2026-05-30"
        role: "primary"
      - url: "https://haveibeenpwned.com/Breach/Charter"
        publisher: "HaveIBeenPwned"
        date: "2026-05-30"
        role: "corroborating"
    discovery_trace: >
      first seen at: securityaffairs feed, URL https://securityaffairs.com/feed
      → primary: Security Affairs article, URL https://securityaffairs.com/192907/uncategorized/shinyhunters-leaks-charter-communications-data-potentially-impacting-5-million-customers.html
      → corroborating: HIBP breach entry referenced in article, URL https://haveibeenpwned.com/Breach/Charter
    summary: |
      UPDATE on item originally covered 2026-05-27 (key: item:shinyhunters-salesforce-campaign-charter-and-7-eleven-both-c). On May 30, 2026 ShinyHunters published the Charter Communications dataset after Charter refused to pay the ransom demand. The publication exposes 4.9 million unique email addresses along with names, phone numbers and physical addresses (per HIBP). A subset of approximately 85,000 records from an internal employee directory included job titles. ShinyHunters had originally claimed 42 million customer records including CPNI. Charter confirmed the incident but stated that no sensitive personal information or CPNI was exfiltrated; the issue affected sales-related systems managing current, former, and prospective business customers. Charter is the parent of Spectrum and is one of the largest US telecommunications carriers. The vector was a voice-phishing attack in April 2026 that compromised an employee's Microsoft Entra account, with subsequent export from Salesforce. The data is now in the wild.
    ch_eu_nexus: "US incident; indirect EU/CH nexus via Salesforce vishing-to-export vector which is the same as the broader ShinyHunters campaign targeting other EU victims (e.g. European Commission listed previously)."
    public_sector_nexus: "Indirect — same campaign methodology affecting public-sector-adjacent organisations."
    sector: "Telecommunications"
