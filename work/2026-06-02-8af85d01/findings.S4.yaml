  - title: "Dashlane password manager accounts targeted in credential-stuffing / brute-force campaign — automated lockouts triggered, Dashlane confirms no backend compromise"
    sources:
      - url: "https://www.bleepingcomputer.com/news/security/dashlane-password-manager-users-locked-out-by-brute-force-attacks/"
        publisher: "BleepingComputer"
        date: "2026-06-01"
        role: "primary"
    discovery_trace: >
      first seen at: bleepingcomputer feed, URL https://www.bleepingcomputer.com/feed/
      → primary: BleepingComputer article, URL https://www.bleepingcomputer.com/news/security/dashlane-password-manager-users-locked-out-by-brute-force-attacks/
    summary: |
      On June 1, 2026, multiple Dashlane users reported being locked out of their accounts following brute-force attacks that attempted logins from geographically distant locations and unknown devices. Dashlane confirmed to BleepingComputer: "We can confirm that certain Dashlane user accounts were targeted in a brute force attack by an external party, resulting in the suspension of those accounts as part of Dashlane's built-in security controls. The affected accounts have now been unsuspended." Dashlane explicitly stated there is "no evidence of compromise of Dashlane's systems." Affected users received emails containing verification codes for new device registration — the standard Dashlane new-device enrollment flow — sent by attackers attempting to register attacker-controlled devices to captured accounts. Dashlane's status page logged an investigation from 15:19 UTC May 31 to 22:30 UTC May 31. The brute-force surface is Dashlane's web / API login endpoint; accounts protected by the Dashlane master password plus a second factor were not taken over. The incident is consistent with credential-stuffing using passwords sourced from unrelated prior breaches.
    ch_eu_nexus: "Global; Dashlane is a French-origin password manager widely used across EU and Switzerland, including in enterprise and public-sector deployments."
    public_sector_nexus: "Indirect — password managers are widely deployed in public-sector IT."
    sector: "Technology, identity and access management"
    cves: []
    actors_campaigns_malware: []
    verification: SINGLE-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "We can confirm that certain Dashlane user accounts were targeted in a brute force attack by an external party, resulting in the suspension of those accounts as part of Dashlane's built-in security controls. The affected accounts have now been unsuspended."
        attribution: "BleepingComputer (quoting Dashlane Senior Director Jordan Fylolenko)"
        source_url: "https://www.bleepingcomputer.com/news/security/dashlane-password-manager-users-locked-out-by-brute-force-attacks/"
      - quote: "Our team is actively engaged in this issue and taking measures to further protect customers. There is no evidence of compromise of Dashlane's systems."
        attribution: "BleepingComputer (quoting Dashlane)"
        source_url: "https://www.bleepingcomputer.com/news/security/dashlane-password-manager-users-locked-out-by-brute-force-attacks/"
    extended_notes: |
      Detection/Hunt angle for enterprise Dashlane deployments: watch for Dashlane support emails with device-registration verification codes delivered to employee inboxes from unexpected IPs or geographies; also watch the Dashlane admin console for new device enrollment from unknown locations. Hardening: ensure all Dashlane accounts require a second factor (TOTP or hardware key) for new device enrollment — this blocks the attack even if the master password is correct.

