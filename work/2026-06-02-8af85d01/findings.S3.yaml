    summary: |
      Seqrite Labs disclosed Operation Dragon Weave on June 1, 2026: a China-linked espionage campaign delivering spearphishing ZIP attachments with two infection chains targeting government, research, academic, technology and financial-services organisations in the Czech Republic and Taiwan. Chain 1 executes a malicious LNK disguised as a PDF via PowerShell; chain 2 drops and executes a binary directly. In both cases a Rust-based dropper (RUSTCLOAK) DLL-side-loads a malicious library that deploys the final payload AZUREVEIL — an AdaptixC2 (open-source C2 framework) agent compiled with 36 post-exploitation commands covering file operations, shell execution, process management, and BOF injection. The dead-drop C2 pattern routes all operator commands through Microsoft Azure Blob Storage, blending malicious traffic with legitimate Azure traffic — standard HTTPS to *.blob.core.windows.net. Attribution is to a China-based cluster; the report links tooling overlaps to prior SteppeDriver and UNC5221 activity documented by Cato Networks and ESET. MITRE technique highlights: T1566.001 (Spearphishing Attachment), T1059.001 (PowerShell), T1574.002 (DLL Side-Loading), T1102.001 (Dead Drop Resolver via Azure Blob), T1071.001 (Web Protocols for C2). Detection: PowerShell spawning from non-standard parent processes; `RUSTCLOAK`-pattern Rust PE headers; outbound HTTPS to `*.blob.core.windows.net` from non-Azure-native hosts; `AdaptixC2` beacon patterns in network captures.
