    summary: |
      GoDaddy Security (researcher Krasimir Konov, May 28, 2026) documented a novel C2 evasion technique in a WordPress malware campaign affecting approximately 1,980 compromised sites: the malware encodes C2 payload URLs using six invisible Unicode characters (zero-width non-joiner U+200C, joiner U+200D, function application U+2061, invisible times U+2062, invisible separator U+2063, invisible plus U+2064) embedded in benign-looking profile comments on Steam Community pages. The first-stage PHP backdoor on compromised WordPress installations fetches the specific Steam profile, extracts and decodes the Unicode-steganographic content to reconstruct a URL pointing to a malicious JavaScript file disguised as a legitimate library (e.g., jquery.min.js). A second-stage PHP backdoor accepts base64-encoded PHP payloads via HTTP POST authenticated by a specific cookie value, providing persistent arbitrary code execution on the server. Initial access vectors identified: stolen FTP/SFTP credentials, vulnerable plugins or themes, supply-chain compromise. The Steam Community service serves as an unblockable legitimate domain for C2 resolution — most web application firewalls and proxy filters allowlist *.steampowered.com by default. Detection: JavaScript tags in WordPress pages loading from unexpected paths or domains; PHP files in wp-content/uploads with `@eval(base64_decode(...))`; outbound HTTPS GET requests from the web server to `steamcommunity.com` profile pages; unexpected `Content-Type: application/x-www-form-urlencoded` POST traffic to `.php` files with cookie-based auth tokens.
