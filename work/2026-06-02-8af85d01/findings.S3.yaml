    summary: |
      Sekoia's Threat Detection & Research team published part 1 of a three-part Gamaredon (ACTINIUM / UAC-0010) series on June 1, 2026, describing a January 2026 campaign against Ukrainian government and military entities. The report introduces unified naming for two new capability clusters: GammaPhish (the infection funnel from spearphishing through GammaLoad deployment) and GammaWorm (the propagation layer, subsuming what was previously called LitterDrifter, PteroLNK and PterodoUSB). The infection chain begins with weaponised xHTML files exploiting CVE-2025-8088 (WinRAR path-traversal) to drop HTA payloads into Windows Startup directories via mshta.exe — no user interaction beyond opening the archive. GammaWorm is a 20,000+ line VBScript worm that: (1) achieves persistence via scheduled tasks (`HKCU\Software\Microsoft\Windows NT\CurrentVersion\Windows\RunOnce` and `\Microsoft\Windows\CurrentVersion\Run`) and NTFS Alternate Data Streams (Zone.Identifier streams on legitimate files); (2) enumerates and propagates across USB drives and mapped network shares using Ukrainian-language social-engineering lures; (3) communicates C2 via Dead Drop Resolvers on Telegram (channel scraping), Telegra.ph, Teletype.in, Supabase and Cloudflare Workers — embedding victim fingerprints in randomised HTTP headers. Real-time file monitoring harvests and exfiltrates documents to S3-compatible cloud storage. Key defender telemetry: `mshta.exe` with HTA argument spawning wscript; `wscript.exe` executing >5,000-line obfuscated VBScript from AppData; scheduled tasks pointing into %APPDATA% with randomised GUID names; ADS presence on %TEMP% / %APPDATA% files; outbound HTTPS to Telegra.ph / Supabase / Workers endpoints; drive enumeration by a script process (Sysmon EID 11 flood on removable media).
