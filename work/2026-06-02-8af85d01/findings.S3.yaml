  - title: "Miasma supply-chain worm compromises 32 Red Hat Cloud Services npm packages via CI/CD OIDC token abuse — new Mini Shai-Hulud variant targets GCP and Azure identities"
    sources:
      - { url: "https://www.aikido.dev/blog/red-hat-npm-packages-compromised-credential-stealing-worm", publisher: "Aikido Security", date: "2026-06-01", role: "primary" }
      - { url: "https://socket.dev/blog/mini-shai-hulud-campaign-hits-red-hat-cloud-services-npm-packages", publisher: "Socket", date: "2026-06-01", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/red-hat-npm-packages-compromised-to-steal-developer-credentials/", publisher: "BleepingComputer", date: "2026-06-01", role: "corroborating" }
      - { url: "https://www.wiz.io/blog/miasma-supply-chain-attack-targeting-redhat-npm-packages", publisher: "Wiz", date: "2026-06-01", role: "corroborating" }
    discovery_trace: "first seen at: hackernews feed item (THN RSS, 2026-06-01) 'Miasma Supply Chain Attack Compromises Red Hat npm Packages' → primary: Aikido Security, URL https://www.aikido.dev/blog/red-hat-npm-packages-compromised-credential-stealing-worm → corroborating: Socket, URL https://socket.dev/blog/mini-shai-hulud-campaign-hits-red-hat-cloud-services-npm-packages → corroborating: Wiz URL https://www.wiz.io/blog/miasma-supply-chain-attack-targeting-redhat-npm-packages"
    summary: |
      On June 1, 2026, threat actor group TeamPCP used a compromised Red Hat employee GitHub account to inject malicious CI/CD workflows into 32 packages under the @redhat-cloud-services npm namespace, poisoning 96 package releases cumulatively downloaded ~80,000 times weekly. The attack exploited GitHub Actions OIDC trusted publishing — the CI/CD pipeline itself was compromised, not individual developer accounts directly — to publish backdoored packages containing obfuscated preinstall hooks. The 4.2 MB malicious payload (Miasma, a new Mini Shai-Hulud variant) performs a broad credential sweep: GitHub Actions secrets, npm tokens, AWS keys, GCP and Azure identity tokens, SSH keys, HashiCorp Vault tokens, Kubernetes cluster credentials, Docker daemon socket secrets, and Bitwarden vault tokens are all harvested via enumerate-all-cloud-providers logic. New additions in this Miasma variant include dedicated collectors for GCP service-account and Azure managed-identity tokens, signalling an attacker pivot from developer machine compromise toward cloud-account takeover. Exfiltration uses encrypted channels to attacker-controlled endpoints; the worm component attempts to propagate by weaponizing stolen npm and GitHub tokens to further infect dependent packages. IDE hooks targeting Claude Code and VS Code establish persistence across interactive developer sessions. Detection: `preinstall` scripts in package.json that spawn `node -e <obfuscated-base64>` chains; `child_process.exec` calls reaching out to non-npm infrastructure; unexpected `GITHUB_TOKEN` reads in CI logs; new OIDC token grants to packages not previously publishing via Actions.
    ch_eu_nexus: "global; Red Hat packages have broad Swiss and European public-sector DevOps footprint (OpenShift, OpenStack tooling); any European government or enterprise using @redhat-cloud-services npm packages in CI/CD is directly exposed"
    public_sector_nexus: "direct — Red Hat OpenShift widely deployed in EU public-sector Kubernetes estates"
    sector: "all sectors with developer / CI/CD pipelines; government, cloud, finance"
