    discovery_trace: "first seen at: Elastic Security Labs RSS feed, URL https://www.elastic.co/security-labs/rss/feed.xml item 'PHANTOMPULSE: anatomy of a hijackable blockchain-C2 RAT' (2026-05-22) → primary: Elastic Security Labs article URL same as above — single-source primary (high-reliability research lab)"
    summary: |
      Elastic Security Labs published on May 22, 2026 a deep reverse-engineering analysis of PHANTOMPULSE, a RAT delivered by the DPRK-aligned REF6598 intrusion set against cryptocurrency-sector targets. The malware implements three distinct process-injection chains (PhantomInject using debug API state machines, DbgNexum via hardware breakpoint VEH, and ManualMap PE manual mapping), AMSI/WLDP/ETW bypass, UAC bypass via IElevatedFactoryServer COM interface (schuac), and four-layer XOR obfuscation. Command-and-control relies entirely on blockchain resolution: the implant queries Ethereum/Base/Optimism smart contracts for the current C2 URL, encoding the owner's address in a contract parameter. The critical defensive insight: because the blockchain C2 resolver has no sender-address verification, a defender with one blockchain transaction can overwrite the C2 URL for every active PHANTOMPULSE implant globally, effectively sinkholing the entire botnet. MITRE techniques: T1055 (Process Injection), T1548.002 (UAC Bypass), T1574.002 (DLL Side-Loading), T1547.001 (Registry Autostart), T1573 (Encrypted Channel), T1102 (Web Service — blockchain). Detection: YARA rule `Windows_Trojan_PhantomPulse.yar` released by Elastic at https://github.com/elastic/protections-artifacts/blob/main/yara/rules/Windows_Trojan_PhantomPulse.yar; behavioural: LZNT1-compressed PE blobs injected via suspended-thread resume; `wscript.exe` or `msiexec.exe` spawning unexpected child processes with direct syscall patterns; outbound HTTPS to `*.blockscout.com` or direct Ethereum RPC endpoints from non-crypto-native host processes. The report also flags strong AI-assisted code generation fingerprints in the binary — structured step numbering and verbose diagnostic logging patterns consistent with LLM-assisted development.
    ch_eu_nexus: "global; DPRK-linked REF6598 has previously targeted EU cryptocurrency exchanges and fintech; technique set (blockchain C2) novel across the threat landscape"
