  - title: "CIFSwitch (CVE-2026-46243) — 19-year-old Linux kernel CIFS LPE: forged cifs.spnego key requests allow unprivileged user to load malicious NSS modules and gain root on RHEL 9-family, SLES 15 SP7, Linux Mint, Kali"
    sources:
      - { url: "https://heyitsas.im/posts/cifswitch/", publisher: "Asim Viladi Oglu Manizada (SpaceX security engineer)", date: "2026-05-27", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/new-cifswitch-linux-flaw-gives-root-on-multiple-distributions/", publisher: "BleepingComputer", date: "2026-05-30", role: "corroborating" }
    discovery_trace: "first seen at: BleepingComputer feed item 'New CIFSwitch Linux flaw gives root on multiple distributions' (2026-05-30) → primary: researcher blog, URL https://heyitsas.im/posts/cifswitch/ → corroborating: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/new-cifswitch-linux-flaw-gives-root-on-multiple-distributions/"
    summary: |
      SpaceX security engineer Asim Viladi Oglu Manizada disclosed CVE-2026-46243 (CIFSwitch) on May 27, 2026: a local privilege escalation in the Linux kernel's CIFS/SMB client introduced approximately 19 years ago. The root cause is that the kernel fails to verify whether `cifs.spnego` key requests originate from a legitimate kernel CIFS client — an unprivileged user in a user namespace can forge these requests to trigger the SPNEGO Kerberos authentication workflow, loading an attacker-controlled NSS module that executes arbitrary code in a SYSTEM context, yielding root. Exploitation requires: (1) a kernel version including vulnerable `cifs.spnego.c` logic, (2) `cifs-utils` package installed, and (3) user namespaces enabled (default on most distributions). Confirmed affected: Linux Mint 21.3/22.3, CentOS Stream 9, Rocky Linux 9, AlmaLinux 9, Kali Linux, SLES 15 SP7. Ubuntu and Debian are NOT vulnerable in default configurations due to differing user-namespace policy. PoC available at https://github.com/manizada/CIFSwitch. The upstream kernel fix is commit 3da1fdf4efbc490041eb4f836bf596201203f8f2 in `fs/smb/client/cifs_spnego.c`. Detection: unexpected `spnego_key_init`/`cifs_spnego_key_get` calls from non-CIFS-mount contexts; unexpected NSS module loads (monitor `/etc/nsswitch.conf` modifications and `dlopen()` calls to non-standard paths from low-privileged processes via `auditd` or eBPF); `keyctl` invocations with `cifs.spnego` key type by non-root UIDs. Hardening: update `cifs-utils` and kernel to patched versions; restrict user namespaces via `sysctl kernel.unprivileged_userns_clone=0` where operationally feasible; audit systems running RHEL 9 derivatives or openSUSE SLES 15.
    ch_eu_nexus: "global; SLES 15 SP7 (SUSE) and RHEL 9 derivatives are widely deployed in Swiss and German public-sector server infrastructure"
    public_sector_nexus: "direct — SLES 15 and CentOS Stream 9 / Rocky Linux 9 broadly deployed across Swiss federal and cantonal IT"
    sector: "all sectors running Linux server infrastructure"
