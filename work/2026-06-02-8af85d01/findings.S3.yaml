  - title: "CVE-2026-41089 — Windows Netlogon stack-based buffer overflow RCE (CVSS 9.8) now actively exploited: domain controllers at risk"
    sources:
      - { url: "https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-41089", publisher: "Microsoft MSRC", date: "2026-05-12", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/microsoft/critical-windows-netlogon-remote-code-execution-flaw-now-exploited-in-attacks/", publisher: "BleepingComputer", date: "2026-06-01", role: "primary" }
      - { url: "https://www.helpnetsecurity.com/2026/06/01/windows-netlogon-rce-exploited-cve-2026-41089/", publisher: "Help Net Security", date: "2026-06-01", role: "corroborating" }
      - { url: "https://ccb.belgium.be/advisories/warning-microsoft-patch-tuesday-may-2026-patches-118-vulnerabilities-16-critical-102", publisher: "Centre for Cybersecurity Belgium", date: "2026-05-30", role: "corroborating" }
    discovery_trace: "first seen at: bleepingcomputer feed, URL https://www.bleepingcomputer.com/news/microsoft/critical-windows-netlogon-remote-code-execution-flaw-now-exploited-in-attacks/ → primary: MSRC advisory, URL https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-41089 → corroborating: CCB Belgium advisory"
    summary: |
      CVE-2026-41089 is a stack-based buffer overflow (CWE-121) in the Windows Netlogon service (lsass.exe / netlogon.dll) that allows an unauthenticated attacker to send a specially crafted network request to a domain controller and achieve remote code execution at SYSTEM level. CVSS 9.8 (CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H). Microsoft credited its Windows Attack Research & Protection (WARP) team with internal discovery; the CVE was patched in May 2026 Patch Tuesday. At time of patch Microsoft assessed exploitation as "Less Likely"; the Centre for Cybersecurity Belgium (CCB) issued an urgent advisory on 30 May 2026 flagging the flaw for immediate patching, and BleepingComputer / Help Net Security reported active exploitation by June 1. All currently supported Windows Server versions including Windows Server 2025 are affected. Attack path: Netlogon port (TCP/445 or TCP/135 via MS-NRPC) reachable from network → crafted RPC request → stack overflow → SYSTEM code execution on the DC — no prior authentication required, no user interaction needed. Defender priorities: apply May Patch Tuesday cumulative updates immediately; enforce Netlogon firewall rules to restrict MS-NRPC (port 49152-65535 or named pipe \PIPE\NETLOGON) to trusted DC-to-DC and domain-member traffic only; monitor 4769/4776 authentication events for anomalous source IPs; check for unexpected LSASS child processes (Sysmon EID 1 / Windows EID 4688 with `ParentProcessName=lsass.exe`).
    ch_eu_nexus: "global Windows Server; every CH/EU Active Directory domain controller is affected — highest-priority patch for any Swiss federal or cantonal LDAP estate"
