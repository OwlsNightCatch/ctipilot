  - title: "CVE-2026-41089 — Windows Netlogon RCE (CVSS 9.8) confirmed actively exploited; CCB Belgium urges emergency DC patching"
    sources:
      - { url: "https://www.bleepingcomputer.com/news/microsoft/critical-windows-netlogon-remote-code-execution-flaw-now-exploited-in-attacks/", publisher: "BleepingComputer", date: "2026-06-01", role: "primary" }
      - { url: "https://www.helpnetsecurity.com/2026/06/01/windows-netlogon-rce-exploited-cve-2026-41089/", publisher: "Help Net Security", date: "2026-06-01", role: "corroborating" }
      - { url: "https://www.securityweek.com/critical-windows-netlogon-vulnerability-in-attackers-crosshairs/", publisher: "SecurityWeek", date: "2026-06-01", role: "corroborating" }
      - { url: "https://www.heise.de/news/Codeausfuehrung-moeglich-kritische-Luecke-in-Windows-Server-wird-aktiv-ausgenutzt-11314404.html", publisher: "heise Security", date: "2026-06-01", role: "corroborating" }
    discovery_trace: |
      first seen at: heise-sec feed, URL https://www.heise.de/news/Codeausfuehrung-moeglich-kritische-Luecke-in-Windows-Server-wird-aktiv-ausgenutzt-11314404.html
      → pivot: BleepingComputer article, URL https://www.bleepingcomputer.com/news/microsoft/critical-windows-netlogon-remote-code-execution-flaw-now-exploited-in-attacks/
      → corroboration: Help Net Security, URL https://www.helpnetsecurity.com/2026/06/01/windows-netlogon-rce-exploited-cve-2026-41089/
      → corroboration: SecurityWeek, URL https://www.securityweek.com/critical-windows-netlogon-vulnerability-in-attackers-crosshairs/
      → MSRC API: CVE detail confirmed via bridge msrc cve CVE-2026-41089 (exploited field shows "No" as of patch date 2026-05-12; CCB Belgium independently confirmed exploitation on or around 2026-05-30 to 2026-06-01)
    summary: |
      CVE-2026-41089 is a stack-based buffer overflow (CWE-121) in the Windows Netlogon RPC service, disclosed and patched in Microsoft's May 2026 Patch Tuesday (2026-05-12). The vulnerability allows an unauthenticated remote attacker to send a specially crafted CLDAP Locator Ping packet (UDP/389) with an oversized username field to any Windows Server acting as a domain controller, triggering a stack buffer overflow in netlogon.dll that achieves remote code execution as SYSTEM without any credential prerequisite. The CVSS 3.1 base score is 9.8 (AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H). Belgium's Centre for Cybersecurity (CCB) confirmed active in-the-wild exploitation on approximately 2026-05-30/06-01, and BleepingComputer, Help Net Security, and SecurityWeek all reported exploitation on June 1. Proof-of-concept code is publicly available. ACROS Security (0patch) released micropatches for legacy Windows Server versions not receiving official updates. Detection: monitor for Netlogon service crashes (Windows Application EID 1000 with fault module netlogon.dll), LSASS service anomalies, CLDAP (UDP/389) packets with anomalously large User attribute fields from non-domain-member source addresses, and Netlogon traffic from sources other than peer DCs. All Windows Server 2016, 2019, 2022, and 2025 are affected. No actor attribution provided in sources.
    ch_eu_nexus: "global; domain controllers in every EU/CH public-sector Windows environment are exposed; CCB Belgium issued the exploitation warning"
    public_sector_nexus: "direct — domain controllers are the authentication backbone of public-sector Windows environments; unauthenticated DC compromise yields credential access to entire AD forest"
    sector: "government, public-administration, defence, critical-infrastructure"
    cves: [CVE-2026-41089]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Belgium's Centre for Cybersecurity (CCB) confirmed active in-the-wild exploitation"
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/microsoft/critical-windows-netlogon-remote-code-execution-flaw-now-exploited-in-attacks/"
      - quote: "Windows Netlogon RCE exploited, domain controllers at risk"
        attribution: "Help Net Security"
        source_url: "https://www.helpnetsecurity.com/2026/06/01/windows-netlogon-rce-exploited-cve-2026-41089/"
      - quote: "Stack-based buffer overflow in Windows Netlogon allows an unauthorized attacker to execute code over a network"
        attribution: "Microsoft MSRC"
        source_url: "https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-41089"
    extended_notes: |
      Attack path: unauthenticated UDP packet to port 389 (LDAP) carrying a CLDAP Locator Ping with oversized User attribute triggers the overflow. Domain controllers listening on UDP/389 by default. No prior authentication, no user interaction. The Heise article specifically names the overflow field as the username parameter in LDAP CLDAP packets. WARP (Windows Attack Research & Protection) team and Synack have published analysis. This is the highest-priority patching item in May 2026 Patch Tuesday given exploitation confirmation.

  - title: "Anthropic Mythos Preview / Project Glasswing — ENISA becomes first EU authority to join AI-powered zero-day scanner; 10,000+ vulns found in systemically-important software"
    sources:
      - { url: "https://www.bloomberg.com/news/articles/2026-06-01/anthropic-to-give-eu-s-cybersecurity-agency-access-to-mythos", publisher: "Bloomberg", date: "2026-06-01", role: "primary" }
      - { url: "https://thenextweb.com/news/anthropic-mythos-eu-enisa-cybersecurity-access", publisher: "The Next Web", date: "2026-06-01", role: "corroborating" }
      - { url: "https://www.heise.de/en/news/Anthropic-opens-Mythos-EU-cyber-agency-to-gain-access-11314343.html", publisher: "heise online (EN)", date: "2026-06-01", role: "corroborating" }
    discovery_trace: |
      first seen at: heise-sec feed, URL https://www.heise.de/news/Anthropic-oeffnet-Mythos-EU-Cyberagentur-soll-Zugriff-erhalten-11314320.html
      → pivot: Bloomberg primary, URL https://www.bloomberg.com/news/articles/2026-06-01/anthropic-to-give-eu-s-cybersecurity-agency-access-to-mythos
      → corroboration: The Next Web, URL https://thenextweb.com/news/anthropic-mythos-eu-enisa-cybersecurity-access
      → corroboration: heise online EN, URL https://www.heise.de/en/news/Anthropic-opens-Mythos-EU-cyber-agency-to-gain-access-11314343.html
    summary: |
      Bloomberg reported on June 1, 2026 that Anthropic will grant ENISA (the EU's cybersecurity agency) access to Mythos, its AI model capable of autonomously identifying security vulnerabilities in complex codebases. ENISA becomes the first EU authority to join Project Glasswing — a controlled-access initiative that previously included approximately 50 US organisations, select US government entities, and UK financial institutions (including the British AI Security Institute). Mythos, launched in April 2026 as "Claude Mythos Preview," can generate working exploits on the first attempt in over 83% of cases and autonomously discovered more than 10,000 high- or critical-severity vulnerabilities in "the most systemically important software in the world" in its first month (cited from Anthropic's May 22 disclosure). The geopolitical context is significant: EU finance ministers, the European Central Bank, and multiple member states demanded access after learning Mythos had found vulnerabilities in systems underpinning European banks, governments, and critical-infrastructure operators, while no European institution could access the findings. The final terms of ENISA's access remain under negotiation, with sticking points including data sovereignty provisions, restrictions on sharing findings with EU member states, and scope of testable systems. This episode also strengthened arguments for a sovereign European AI cybersecurity capability (Mistral and BNP Paribas working on a competing model). The model operates at $25/M input tokens and $125/M output tokens. No specific disclosed vulnerability details from EU-related systems were made public.
    ch_eu_nexus: "direct — ENISA will have access to findings on EU-deployed software, including systems used by Swiss federal government and critical-infrastructure operators given the overlap in software supply chains"
    public_sector_nexus: "direct — European Commission, ECB, and member-state critical-infrastructure systems were explicitly named as having Mythos-discovered vulnerabilities; ENISA as EU CSIRT/NIS coordination body is the receiving entity"
    sector: "government, public-administration, finance, critical-infrastructure, telco"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Anthropic is set to give the European Union's cybersecurity body ENISA access to Mythos, the first EU agency to get access to the powerful artificial intelligence tool"
        attribution: "Bloomberg"
        source_url: "https://www.bloomberg.com/news/articles/2026-06-01/anthropic-to-give-eu-s-cybersecurity-agency-access-to-mythos"
      - quote: "Mythos had found more than 10,000 'high- or critical-severity vulnerabilities' in 'the most systemically important software in the world'"
        attribution: "The Next Web"
        source_url: "https://thenextweb.com/news/anthropic-mythos-eu-enisa-cybersecurity-access"
    extended_notes: |
      Detection/hunt angle: Mythos access for ENISA may accelerate patch prioritisation for EU public-sector environments if ENISA can share findings — but the access conditions include restrictions on sharing with member states, creating a potential triage bottleneck. Swiss NCSC (GovCERT.ch) is not an EU body and would only receive findings via voluntary ENISA disclosure or independent discovery. SOC managers should treat undisclosed Mythos-found vulnerabilities in widely-used software as a class-level risk and intensify vulnerability-management cadence on internet-facing systems. No IOCs; this is a policy/intelligence development, not an active campaign alert.

  - title: "CVE-2026-44825 — Apache Solr hardcoded BasicAuth template credentials allow unauthenticated remote admin access (CVSS 8.1, no patch available yet)"
    sources:
      - { url: "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-1740", publisher: "BSI CERT-Bund", date: "2026-06-01", role: "primary" }
      - { url: "https://cve.threatint.eu/CVE/CVE-2026-44825", publisher: "THREATINT CVE Database", date: "2026-06-01", role: "corroborating" }
    discovery_trace: |
      first seen at: bsi-rss bridge subcommand, RSS item title "[NEU] [hoch] Apache Solr: Schwachstelle ermöglicht Erlangen von Administratorrechten"
      → bridge bsi-csaf WID-SEC-2026-1740 → full CSAF with CVE ID CVE-2026-44825 and Apache mailing-list reference
      → corroboration: WebSearch → THREATINT entry confirming affected versions and workaround
    summary: |
      CVE-2026-44825 is a hardcoded-credentials vulnerability (CWE-798 / CWE-1188) in Apache Solr's `bin/solr auth enable` BasicAuth bootstrap tool, first published by BSI CERT-Bund on 2026-06-01. The tool creates a fixed set of template accounts (superadmin, admin, search, index) with well-known default credentials in `security.json` alongside the operator-specified admin account, and these template accounts are not removed or randomised after bootstrap. An unauthenticated remote attacker with network access to the Solr REST API (HTTP/8983 by default) can authenticate using the published default credentials to gain full administrative control over the Solr cluster — accessing all cores/collections, modifying configurations, and potentially executing server-side scripts. Affected versions: 9.4.0–9.10.1 and 10.0.0. Fixed versions 9.11.0 and 10.1.0 are not yet released. Immediate workaround: delete the four template users from `security.json` or change all template passwords. Deployments where `bin/solr auth enable` was never used, or where template user passwords were rotated immediately post-bootstrap, are not affected. The vulnerability was discovered by Naveen Sunkavally of Horizon3.ai; disclosure was coordinated via Apache's oss-security mailing list.
    ch_eu_nexus: "global; Apache Solr is widely deployed in EU public-sector search and content-management backends (courts, archives, intranet portals)"
    public_sector_nexus: "indirect — Solr backs many EU public-sector document-management and search deployments; admin access to Solr typically yields the document corpus and can pivot to underlying application credentials"
    sector: "government, public-administration, legal, education"
    cves: [CVE-2026-44825]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Ein entfernter, anonymer Angreifer kann eine Schwachstelle in Apache Solr ausnutzen, um Administratorrechte zu erlangen" (English: a remote anonymous attacker can exploit a vulnerability in Apache Solr to gain administrative rights)
        attribution: "BSI CERT-Bund WID-SEC-2026-1740"
        source_url: "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-1740"
      - quote: "The vulnerability involves 'Hardcoded credentials in the Basic Authentication setup tool (bin/solr auth enable)' that creates template user accounts with insecure default passwords"
        attribution: "THREATINT"
        source_url: "https://cve.threatint.eu/CVE/CVE-2026-44825"
    extended_notes: |
      Detection: Solr admin API requests authenticated with the four known template-account usernames (superadmin, admin, search, index) from unexpected source IPs; Solr access-log pattern matching on the AdminHandler paths (/admin/cores, /admin/collections, /admin/configsets). Hardening: rotate all Solr credentials immediately; verify security.json lacks the four template entries; consider placing Solr behind an internal-only network segment. Since no patch is available and the workaround is manual, this requires active remediation now rather than waiting for an update cycle.

  - title: "CVE-2026-8931 — Disig Web Signer RCE (CVSS 9.4): qualified eIDAS electronic-signature client exploitable without authentication"
    sources:
      - { url: "https://www.disig.sk/en/news/important-update-of-the-web-signer-application/", publisher: "Disig a.s. (vendor advisory)", date: "2026-06-01", role: "primary" }
      - { url: "https://euvd.enisa.europa.eu/enisa/eu_vulnerability_database/EUVD-2026-33648", publisher: "ENISA EUVD (EUVD-2026-33648)", date: "2026-06-01", role: "corroborating" }
    discovery_trace: |
      first seen at: bridge enisa-euvd recent lastvulnerabilities → EUVD-2026-33648 with assigner SK-CERT, baseScore 9.4, aliases CVE-2026-8931
      → primary: Disig vendor advisory, URL https://www.disig.sk/en/news/important-update-of-the-web-signer-application/
      → ENISA EUVD entry as corroborating source: EUVD-2026-33648
    summary: |
      CVE-2026-8931 is a critical RCE vulnerability (CVSS 4.0: 9.4; vector AV:N/AC:L/AT:N/PR:N/UI:P/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H) in Disig Web Signer versions 2.0.3 through 2.5.3, published by SK-CERT and ENISA on June 1, 2026. Disig is the primary qualified trust service provider in Slovakia (under eIDAS) and its Web Signer application is the standard client-side component for generating and applying qualified electronic signatures — legally binding under EU Regulation 910/2014 (eIDAS) — in Slovak government portals (slovensko.sk), banking, healthcare, and notarial systems. The vulnerability class is RCE with no authentication prerequisite (UI:P indicates user interaction required, likely via a malicious document/page triggering the signing workflow). The researcher is Marek Alakša of Binary House. The fix is in version 2.5.5, available via automatic update prompt or the official download portal. No exploitation in the wild was reported at disclosure time.
    ch_eu_nexus: "EU-direct — Disig Web Signer is used across Slovak and Czech public-sector and regulated-private-sector environments for legally binding eIDAS-qualified signatures; Slovak government services (slovensko.sk) rely on it"
    public_sector_nexus: "direct — mandated eIDAS qualified-trust-service component in Slovak government e-service infrastructure; exploitable via malicious documents delivered to government employees performing official signing workflows"
    sector: "government, public-administration, finance, healthcare, legal"
    cves: [CVE-2026-8931]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "A critical Remote Code Execution (RCE) vulnerability exists in Disig Web Signer versions 2.0.3 through 2.5.3"
        attribution: "ENISA EUVD EUVD-2026-33648"
        source_url: "https://euvd.enisa.europa.eu/enisa/eu_vulnerability_database/EUVD-2026-33648"
    extended_notes: |
      The CVSS 4.0 score of 9.4 includes high impact on Subsequent Systems (SC:H/SI:H/SA:H), which reflects that exploitation through the signing client can cascade to the underlying government service environment. The scope parameter in CVSS 4.0 indicates the exploited component can affect systems beyond the vulnerable one — in this case, the signing workflow integrated into government-portal backends. No public exploit code. Defensive priority: verify all Disig Web Signer deployments on government employee workstations are updated to 2.5.5; check software inventory tools for older versions; this is particularly acute in Slovak and Czech government environments but relevant to any EU organisation using eIDAS-compliant signing where Disig is the chosen QTSP client.

  - title: "CVE-2026-42251 — KS-SOMED Polish medical-software supply-chain attack: hardcoded FTP credentials allow malicious update injection (CERT-PL, CVSS 8.7)"
    sources:
      - { url: "https://cert.pl/en/posts/2026/06/CVE-2026-42251/", publisher: "CERT Polska", date: "2026-06-01", role: "primary" }
      - { url: "https://euvd.enisa.europa.eu/enisa/eu_vulnerability_database/EUVD-2026-33642", publisher: "ENISA EUVD (EUVD-2026-33642)", date: "2026-06-01", role: "corroborating" }
    discovery_trace: |
      first seen at: bridge enisa-euvd recent lastvulnerabilities → EUVD-2026-33642 with assigner CERT-PL, baseScore 8.7, aliases CVE-2026-42251
      → primary: CERT-PL post, URL https://cert.pl/en/posts/2026/06/CVE-2026-42251/
      → corroboration: ENISA EUVD entry EUVD-2026-33642
    summary: |
      CVE-2026-42251 (CWE-798, CVSS 4.0: 8.7) is a hardcoded-credentials vulnerability in KAMSOFT's KS-SOMED healthcare practice management software, disclosed by CERT Polska on June 1, 2026. The `KSPLUPDFTP.exe` component (through version 30.00.00.056) and `ANEKSKLIENT.EXE` (through version 29.00.02.026) contained hard-coded FTP credentials for the server hosting the application's update packages. An unauthenticated network attacker with knowledge of these credentials could upload a malicious update file that would then be distributed to and automatically installed on client machines as a legitimate vendor update — a classic supply-chain delivery mechanism. The vendor (KAMSOFT, Poland) has removed the hardcoded credentials and changed the update process; previously exposed credential access was subsequently limited to read-only. KAMSOFT's KS-SOMED is a widely-deployed practice management system in the Polish National Health Service (NFZ) environment; this vulnerability was relevant to public healthcare infrastructure. Discoverer: Wojciech Giełda (coordinated via CERT-PL CVD process).
    ch_eu_nexus: "EU-direct — Polish national healthcare supply chain; KS-SOMED is deployed across NFZ-contracted practices; update mechanism compromise would affect all connected installations simultaneously"
    public_sector_nexus: "direct — primary victim class is National Health Service-contracted practices in Poland; public healthcare administration directly affected"
    sector: "healthcare, public-administration"
    cves: [CVE-2026-42251]
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Use of hard-coded credentials in KS-SOMED allowed an unauthorized attacker access to FTP server that hosted the application's update packages. The attacker with these credentials could upload a malicious update file, which then may have been distributed and installed on client machines as a legitimate update."
        attribution: "ENISA EUVD EUVD-2026-33642"
        source_url: "https://euvd.enisa.europa.eu/enisa/eu_vulnerability_database/EUVD-2026-33642"
    extended_notes: |
      Technique class: T1195.002 (Compromise Software Supply Chain) via hardcoded update-server credentials. The affected components are the update client binaries (KSPLUPDFTP.exe, ANEKSKLIENT.EXE), not the core clinical application itself. Attack path: attacker discovers hardcoded FTP credentials (likely via binary reverse-engineering or credential-stuffing), uploads trojanised update package, waits for auto-update distribution to all connected KS-SOMED installations. Detection: network monitoring for unexpected FTP connections to KAMSOFT update server from non-KAMSOFT source IPs; endpoint EDR alerts on unsigned binary replacement in KS-SOMED installation directories. KAMSOFT has patched; defenders should verify no malicious updates were distributed during the exposure window.

  - title: "Vodafone source code breach — Lapsus$ leaks 7.1 GB including hardcoded PostgreSQL credentials after extortion fails; EU telecom supply chain exposed"
    sources:
      - { url: "https://www.heise.de/news/Vorfall-bei-Vodafone-Cybergang-Lapsus-klaut-Software-Quellcodes-11313709.html", publisher: "heise Security", date: "2026-06-01", role: "primary" }
      - { url: "https://opsecinsider.com/vodafone-source-code-leak-2026/", publisher: "OpsecInsider", date: "2026-06-01", role: "corroborating" }
    discovery_trace: |
      first seen at: heise-sec feed, URL https://www.heise.de/news/Vorfall-bei-Vodafone-Cybergang-Lapsus-klaut-Software-Quellcodes-11313709.html
      → WebSearch for primary source → cybernews.com (403 blocked) → OpsecInsider analysis with technical detail
    summary: |
      Heise Security reported on June 1, 2026 that Lapsus$ (now operating within a loose "Scattered Lapsus$ Hunters" federation with Scattered Spider and ShinyHunters) publicly dumped approximately 7.1 GB of Vodafone's internal source code on May 12, 2026, following a failed 15-day extortion ultimatum. The breach occurred in March 2026 via a compromised third-party development software account (Vodafone attributed it to a compromised internal GitHub account). The leaked dataset includes source code and testing environments for Vodafone OnePortal and Cyberhub, a full GitHub repository tree map, and crucially, hardcoded PostgreSQL database credentials embedded in multiple source files. Vodafone stated no customer data was directly exposed, but the hardcoded production credentials represent direct secondary risk. Vodafone is a major pan-European telecommunications operator with significant infrastructure in Germany, Italy, Spain, the UK, and across the EU. Germany's federal data protection authority (BfDI) fined Vodafone €45 million in June 2025 for prior data-protection failures; the hardcoded credentials could constitute an independent Article 32 GDPR compliance failure. No confirmed customer or network infrastructure breach from the credential exposure as of June 1.
    ch_eu_nexus: "EU-direct — Vodafone is a major EU telecom; the leak affects German, Italian, Spanish and UK operations; hardcoded credentials in internal portals could expose EU customer or infrastructure data if rotated credentials were not acted upon"
    public_sector_nexus: "indirect — Vodafone provides telecoms services to EU public-sector organisations; source code exposure for internal portals could facilitate targeted social-engineering or API abuse against government clients"
    sector: "telco"
    cves: []
    actors_campaigns_malware: ["Lapsus$"]
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "Cybergang Lapsus$ klaut Software-Quellcodes" (EN: Cybergang Lapsus$ steals software source code) — Heise Jun 1 2026
        attribution: "heise Security"
        source_url: "https://www.heise.de/news/Vorfall-bei-Vodafone-Cybergang-Lapsus-klaut-Software-Quellcodes-11313709.html"
      - quote: "The leaked code contained hardcoded PostgreSQL database credentials that could enable unauthorized backend access"
        attribution: "OpsecInsider"
        source_url: "https://opsecinsider.com/vodafone-source-code-leak-2026/"
    extended_notes: |
      The Cybernews primary reporting (started May 21) was behind a 403 paywall. The OpsecInsider analysis and Heise report from June 1 serve as the in-window corroborating sources. Lapsus$ is tracked as a financially-motivated extortion group with prior history against Vodafone (2022 breach of ~200 GB source code). This is the group's second successful Vodafone compromise in 4 years. Hardcoded credentials in source code is a recurring pattern across Lapsus$ targets. Any organisation integrating with Vodafone APIs or using Vodafone managed services should verify their integration credentials have not been exposed.

