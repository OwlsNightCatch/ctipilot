  - title: "Operation Dragon Weave — China-linked espionage campaign targets Czech Republic and Taiwan government/research sectors via RUSTCLOAK loader and AZUREVEIL AdaptixC2 over Azure Blob Storage C2"
    sources:
      - url: "https://www.seqrite.com/blog/operation-dragon-weave-uncovering-a-china-linked-campaign-targeting-czech-republic-and-taiwan-using-azure-cloud-c2/"
        publisher: "Seqrite Labs"
        date: "2026-05-29"
        role: "primary"
      - url: "https://thehackernews.com/2026/06/china-aligned-groups-ramp-up-attacks.html"
        publisher: "The Hacker News"
        date: "2026-06-01"
        role: "corroborating"
    discovery_trace: "first seen at: hackernews feed, item https://thehackernews.com/2026/06/china-aligned-groups-ramp-up-attacks.html → primary: Seqrite Labs, URL https://www.seqrite.com/blog/operation-dragon-weave-uncovering-a-china-linked-campaign-targeting-czech-republic-and-taiwan-using-azure-cloud-c2/"
    summary: |
      Seqrite Labs (published 2026-05-29) documented Operation Dragon Weave, a China-linked espionage campaign active since 2025 and most recently reported targeting government, research, academic, technology, and financial-services sectors in the Czech Republic and Taiwan. The campaign was attributed with moderate confidence to a China-based threat actor based on TTPs, tooling, and targeting patterns.

      Initial access is via spear-phishing emails carrying ZIP archives containing either (a) a Windows shortcut (LNK) masquerading as a PDF, or (b) an executable masquerading as a legitimate file. A script-based dropper chain (Stage 2) decrypts and executes RUSTCLOAK, a Rust-compiled loader (Stage 3), which decrypts and runs the final payload: an AdaptixC2 agent dubbed AZUREVEIL. AZUREVEIL is distinctive in routing its C2 traffic through Microsoft Azure Blob Storage (dead-drop C2 channel), blending attacker communications with legitimate cloud-service traffic. In a January 2026 iteration, the campaign swapped AdaptixC2 for Cobalt Strike and expanded geographically to Cambodia and South Korea.

      MITRE ATT&CK mapping: T1566.001 (Spearphishing Attachment), T1204.002 (User Execution: Malicious File), T1027 (Obfuscated Files), T1105 (Ingress Tool Transfer), T1071.002 (Application Layer Protocol: File Transfer Protocols, for Azure Blob Storage dead-drop), T1583.006 (Acquire Infrastructure: Web Services — Azure Blob Storage). Detection: EDR parent-process chains showing LNK → cmd/wscript → Rust executable; Azure audit logs for blob storage containers accessed from endpoints that don't normally use Azure Storage APIs; network proxy/firewall telemetry for unusual polling patterns to `*.blob.core.windows.net` endpoints from workstations.
    ch_eu_nexus: "direct CH/EU nexus — Czech Republic is a direct target; campaign TTPs are applicable to neighbouring EU member states; Switzerland's government and research institutions are in a comparable profile"
    public_sector_nexus: "direct"
    sector: "government, research, academic, technology, finance"
    cves: []
    actors_campaigns_malware: ["Operation Dragon Weave", "RUSTCLOAK", "AZUREVEIL", "AdaptixC2", "Cobalt Strike"]
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "A new cyber espionage campaign codenamed Operation Dragon Weave has been observed targeting officials and citizens in the Czech Republic and Taiwan to deliver an AdaptixC2 agent. According to Seqrite Labs, targets of the campaign include government, research, academic, technology, and financial services sectors."
        attribution: "The Hacker News (citing Seqrite Labs)"
        source_url: "https://thehackernews.com/2026/06/china-aligned-groups-ramp-up-attacks.html"
      - quote: "One of the unique aspects of this campaign is its use of Microsoft Azure Blob Storage as a dead-drop C2 channel. Instead of talking to a normal C2 server, the malware blends its traffic with regular cloud activity, which makes it much harder to notice."
        attribution: "Seqrite Labs"
        source_url: "https://www.seqrite.com/blog/operation-dragon-weave-uncovering-a-china-linked-campaign-targeting-czech-republic-and-taiwan-using-azure-cloud-c2/"
    extended_notes: |
      Attribution confidence stated as "moderate" by Seqrite Labs; not yet publicly corroborated by a major Western threat-intelligence vendor (MSTIC, Mandiant, Crowdstrike, Recorded Future). Treat the China-alignment as a working hypothesis pending additional independent corroboration. The AdaptixC2 framework is an open-source C2 that has been used by multiple groups, so tooling alone is not sufficient for attribution. The dead-drop Azure Blob Storage C2 technique was also observed in the HAFNIUM cluster and STORM-0558 and represents a growing evasion trend where C2 traffic is laundered through legitimate cloud infrastructure.

