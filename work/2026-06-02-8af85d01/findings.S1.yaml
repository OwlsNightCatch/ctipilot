    novelty: new
    evidence:
      - quote: "Oracle WebLogic contains an unspecified vulnerability that could allow an unauthenticated attacker with network access via T3, IIOP to compromise Oracle WebLogic Server. Successful attacks of this vulnerability can result in unauthorized access to critical data or complete access to all Oracle WebLogic Server accessible data."
        attribution: "CISA KEV"
        source_url: "https://www.cisa.gov/known-exploited-vulnerabilities-catalog"
