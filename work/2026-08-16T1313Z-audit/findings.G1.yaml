  # BORDERLINE — Johnson Controls C-CURE 9000 / victor: CVSS 9.6
  # unauthenticated RCE on a physical access-control platform, never
  # covered even at its original 2026-07-23 disclosure. Only the
  # 2026-08-11 "Update A" revision falls inside this window.
  # ---------------------------------------------------------------
  - title: "Johnson Controls C-CURE 9000 / victor: unauthenticated adjacent-network RCE on physical access-control servers (CVE-2026-21655, CVSS 9.6) — never covered, in-window update only"
    sources:
      - { url: "https://www.cisa.gov/news-events/ics-advisories/icsa-26-204-01", publisher: "CISA (ICS Advisory icsa-26-204-01, Update A)", date: "2026-08-11", role: primary }
    discovery_trace: >
      first seen at: cisa-advisories (attempted via `cisa csaf-recent 80`, this run) → primary: CISA,
      URL https://www.cisa.gov/news-events/ics-advisories/icsa-26-204-01 (structured CSAF JSON fetched
      via `python3 tools/fetch_source.py cisa csaf icsa-26-204-01`, this run). Cross-checked: no entry
      anywhere under entries/ mentions "C-CURE" or "victor application server"; the original 2026-07-23
      disclosure was never covered either, so this is a store-wide gap surfaced only by the in-window
      "Update A" revision (2026-08-11, changed affected products and mitigations).
    summary: >
      CISA republished Johnson Controls' C-CURE 9000 / victor application server advisory as "Update A"
      on 2026-08-11 (initial CISA republication 2026-07-23, from Johnson Controls' own JCI-PSA-2026-07/
      -13/-16). CVE-2026-21655 (CVSS 3.1 base 9.6 / SSVC E:N) lets an unauthenticated attacker on a
      network adjacent to C-CURE 9000 or the victor application server achieve arbitrary code execution
      on the server and, per the vendor, potentially compromise connected client workstations used by
      physical-security personnel — "such attack could impact physical security controls." A second
      flaw, CVE-2026-21653, allows server-side request forgery from the victor web application, reaching
      internal network services. A third, CVE-2026-34496 (CVSS 8.0), lets low-privileged users view
      users/logs pages beyond their intended access. No public exploitation has been reported to CISA.
      The affected product runs badge/door-access control and video for physical-security operations
      centres, including government facilities, which is why the vendor calls out impact to "physical
      security controls" specifically.
    region_nexus: "worldwide; used across government and critical-manufacturing facilities' physical-security operations"
    primary_sector_nexus: "direct"
    sector: "public-sector, critical-manufacturing"
    cves: [CVE-2026-21655, CVE-2026-21653, CVE-2026-34496]
    techniques: [T1210]
    affected_products: ["Johnson Controls C-CURE 9000", "Johnson Controls victor application server"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE-NATIONAL-CERT
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "Under certain circumstances, successful exploitation of this vulnerability could allow an unauthenticated attacker on an adjacent network to achieve arbitrary code execution on the C-CURE 9000, victor application server and victor, as well as connected clients (e.g., workstations of physical security personnel). Such attack could impact physical security controls."
        attribution: "CISA (citing Johnson Controls' own vulnerability summary)"
        source_url: "https://www.cisa.gov/news-events/ics-advisories/icsa-26-204-01"
    extended_notes: >
      Marked borderline because the profile requires "adjacent network" access rather than internet
      exposure and carries no PoC/scanning evidence (SSVC E:N — exploitation not observed), so it does
      not cleanly clear the daily imminent-exploitation bar on its own. Flagging it because it is a
      CVSS 9.6 unauthenticated RCE on a product class (physical access control / badge systems) that
      is otherwise entirely unrepresented in the store, and the only reason it surfaced this window is
      an administrative "Update A" revision rather than fresh news — the original 2026-07-23 disclosure
      was a pure miss with no in-window trigger at all.
    borderline: true
    borderline_reason: "adjacent-network prerequisite (not internet-facing) and no observed exploitation; flagged for the store-wide gap (product class never covered) rather than daily imminent-exploitation profile"

  # ---------------------------------------------------------------
  # BORDERLINE — Zalktis (Latvian accounting/e-invoicing) SQLi via
  # PEPPOL/UBL e-invoice parsing. Niche single-vendor product but an
  # EU e-invoicing interoperability parsing-flaw class.
  # ---------------------------------------------------------------
  - title: "Zalktis (Latvian accounting software): unauthenticated SQL injection via PEPPOL/UBL e-invoice import (CVE-2026-59109)"
    sources:
      - { url: "https://cvd.cert.lv/disclosed/vuln-all-631428755", publisher: "CERT.LV", date: "2026-08-13", role: primary }
      - { url: "https://offseq.com/en/research/zalktis-cve-2026-59109", publisher: "OffSeq (discovering researcher)", date: "2026-08-13", role: primary }
    discovery_trace: >
      first seen at: enisa-euvd (bridge `enisa-euvd recent lastvulnerabilities`, this run) → primary:
      ENISA EUVD advisory EUVD-2026-58133 (bridge `enisa-euvd advisory EUVD-2026-58133`) → references:
      CERT.LV disclosure page and OffSeq researcher write-up (URLs cited in the EUVD record's
      `references` field; not independently re-fetched this run due to time budget — flagged for a
      follow-up fetch).
    summary: >
      A SQL injection in Zalktis, a Latvian accounting application (SIA "Zalktis Programmas"), affects
      versions before 2026.1.586 and before 2026.2.592. Trading-partner-controlled text fields in
      received electronic invoices (UBL/PEPPOL e-invoices or e-commerce export data) are concatenated
      directly into SQL statement text without parameterisation or escaping — the application's own
      escaping helper is not invoked on this code path — letting any counterparty that sends an invoice
      break out of the string literal and alter query logic. CVSS 4.0 base 8.7 (AV:N/AC:L/AT:N/PR:N/
      UI:P). Disclosed via Latvia's national CERT (CERT.LV) coordinated-disclosure programme.
    region_nexus: "Latvia-specific vendor, but the underlying parsing surface (PEPPOL/UBL e-invoicing) is EU-wide interoperability infrastructure under the e-invoicing directive"
    primary_sector_nexus: "indirect"
    sector: "finance, public-sector"
    cves: [CVE-2026-59109]
    techniques: [T1190]
    affected_products: ["Zalktis"]
    entity_keys: []
    new_entities: []
    verification: SINGLE-SOURCE-OTHER
    confidence: LOW
    novelty: new
    borderline: true
    borderline_reason: "single niche Latvian accounting vendor with limited Swiss/EU-wide install base; included only as an illustrative PEPPOL/UBL e-invoice parsing-flaw class, not because Zalktis itself is a relevant product for this constituency — recommend dropping unless the e-invoicing parsing class is judged independently newsworthy"

