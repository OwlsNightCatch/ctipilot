  # ---------------------------------------------------------------
  # GAP 1 — Adobe ColdFusion APSB26-90 (CVSS 10.0 pre-auth OS command
  # injection). Published/updated 2026-08-11, flagged by NCSC-CH's own
  # advisory 12841 on 2026-08-12 (essential-tier home-CERT source, in
  # this run's slice), and covered by The Hacker News the same day.
  # Zero hits anywhere in entries/ for any of its 15 CVEs — a genuine,
  # store-wide miss, not merely an in-window one. The pipeline's own
  # established convention (2026-07-02 and 2026-07-08 entries for the
  # prior APSB26-68/69 ColdFusion/Campaign wave) shows this class of
  # disclosure normally gets its own dedicated entry.
  # ---------------------------------------------------------------
  - title: "Adobe ColdFusion APSB26-90: pre-auth OS command injection (CVE-2026-48362, CVSS 10.0) — 15 CVEs, none of which reached the pipeline"
    sources:
      - { url: "https://helpx.adobe.com/security/products/coldfusion/apsb26-90.html", publisher: "Adobe PSIRT", date: "2026-08-11", role: primary }
      - { url: "https://security-hub.ncsc.admin.ch/#/posts/12841", publisher: "NCSC Switzerland (Cyber Security Hub, post 12841)", date: "2026-08-12", role: primary }
      - { url: "https://thehackernews.com/2026/08/adobe-patches-three-cvss-100-coldfusion.html", publisher: "The Hacker News", date: "2026-08-12", role: corroborating }
    discovery_trace: >
      first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/12841
      (bridge `ncsc-csh recent 30`, fetched this run) → primary: Adobe PSIRT, URL
      https://helpx.adobe.com/security/products/coldfusion/apsb26-90.html (fetched via bridge `url`,
      full CVE/CVSS/affected-version table read from the raw body) → corroborating: The Hacker News,
      URL https://thehackernews.com/2026/08/adobe-patches-three-cvss-100-coldfusion.html (fetched via
      WebFetch, 2026-08-16). Cross-checked store-wide: zero hits for any of the 15 CVE ids anywhere
      under entries/.
    summary: >
      Adobe published APSB26-90 on 2026-08-11 for ColdFusion 2025 (2025.0.11 and earlier, fixed in
      2025.0.12) and ColdFusion 2023 (2023.0.22 and earlier, fixed in 2023.0.23), resolving 15 CVEs.
      The headline flaw, CVE-2026-48362 (CWE-78 OS Command Injection, CVSS 3.1 base 10.0,
      AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H), lets a remote unauthenticated attacker execute arbitrary
      operating-system commands with no user interaction. A second critical flaw, CVE-2026-48273
      (CWE-95 Eval Injection, CVSS 9.9, AV:N/AC:L/PR:L/UI:N), needs only a low-privileged account and
      also yields arbitrary code execution. A third, CVE-2026-71384 (CWE-863 Incorrect Authorization,
      CVSS 9.6, AV:A), causes an application-wide denial of service from the adjacent network. Adobe
      rated the update Priority 1 — "vulnerabilities that have a higher risk of being targeted by
      malicious cyber attacks" — and Adobe itself states no in-the-wild exploitation has been observed
      as of publication. ColdFusion carries a strong prior history of rapid weaponisation once a
      command-injection-class flaw is public (this pipeline's own registry already tracks the July
      2026 wave, trend:adobe-coldfusion-campaign-apsb26-68-69, one of whose CVEs — CVE-2026-48282 —
      reached confirmed KEV-listed exploitation within days of disclosure), so an unauthenticated
      CVSS 10.0 OS command injection on an internet-facing enterprise web-application server is squarely
      inside this pipeline's imminent-exploitation profile even absent a KEV/EPSS signal yet.
    region_nexus: "global; ColdFusion is broadly deployed across EU/Swiss public-sector and enterprise web estates"
    primary_sector_nexus: "direct"
    sector: "public-sector, finance, technology"
    cves: [CVE-2026-48362, CVE-2026-48273, CVE-2026-71384, CVE-2026-71386, CVE-2026-21273, CVE-2026-71387, CVE-2026-71385, CVE-2026-34635, CVE-2026-48440, CVE-2026-21279, CVE-2026-25652, CVE-2026-48386, CVE-2026-71383, CVE-2026-48375, CVE-2026-48376, CVE-2026-48384]
    techniques: [T1190, T1059]
    affected_products: ["Adobe ColdFusion 2025", "Adobe ColdFusion 2023"]
    entity_keys: ["trend:adobe-coldfusion-campaign-apsb26-68-69"]
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Adobe has released a security update for ColdFusion versions 2025 and 2023. This update resolves critical and important vulnerabilities that could result in arbitrary code execution, privilege escalation, security feature bypass, application denial-of-service, and memory exposure."
        attribution: "Adobe PSIRT"
        source_url: "https://helpx.adobe.com/security/products/coldfusion/apsb26-90.html"
      - quote: "Although there is no evidence of these flaws being exploited in the wild, administrators are recommended to install the update as soon as possible, preferably within 72 hours."
        attribution: "The Hacker News"
        source_url: "https://thehackernews.com/2026/08/adobe-patches-three-cvss-100-coldfusion.html"
    extended_notes: >
      This is a store-wide gap, not merely an in-window one: no entry anywhere under entries/ cites any
      of these 15 CVE ids. The NCSC-CH post that carries this bulletin (12841, "SAP: multiple critical
      vulnerabilities" — actually titled for the Adobe wave, bundling ColdFusion, Campaign Classic and
      Commerce together) also carried Adobe Commerce's CVE-2026-71362, which the pipeline DID cover as
      its own dedicated entry on 2026-08-16 (cve-2026-71362-adobe-commerce-customer-account-takeover) —
      via Sansec's exploitation-status reporting, not via the NCSC-CH post. This suggests the sub-agent
      that caught Commerce found it through a different lead (Sansec) and never opened the sibling
      ColdFusion/Campaign Classic bulletins referenced in the same NCSC-CH post.

