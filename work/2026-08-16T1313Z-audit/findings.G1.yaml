  - title: "Adobe Campaign Classic APSB26-123 — the third wave of unauthenticated CVSS 10.0 code-execution flaws this quarter, never picked up"
    sources:
      - { url: "https://helpx.adobe.com/security/products/campaign/apsb26-123.html", publisher: "Adobe PSIRT", date: "2026-08-11", role: primary }
      - { url: "https://security-hub.ncsc.admin.ch/#/posts/12841", publisher: "NCSC Switzerland (Cyber Security Hub, post 12841)", date: "2026-08-12", role: primary }
      - { url: "https://thehackernews.com/2026/08/adobe-patches-three-cvss-100-coldfusion.html", publisher: "The Hacker News", date: "2026-08-12", role: corroborating }
    discovery_trace: >
      first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/12841
      (bridge `ncsc-csh recent 30`) → primary: Adobe PSIRT, URL
      https://helpx.adobe.com/security/products/campaign/apsb26-123.html (bridge `url`, full CVE table
      read from raw body) → corroborating: The Hacker News, URL
      https://thehackernews.com/2026/08/adobe-patches-three-cvss-100-coldfusion.html. Cross-checked
      against prior_coverage.json and store-wide grep: the two 2026-08 Campaign Classic entries already
      published (APSB26-114 on 2026-08-02, APSB26-120 "second wave" on 2026-08-07) do not carry any of
      this bulletin's three CVE ids.
    summary: >
      Adobe published APSB26-123 on 2026-08-11 for Adobe Campaign Classic v7 (7.4.3 build 9399 and
      earlier, on-premise and the on-premise components of hybrid deployments), fixed in 7.4.4 build
      9400. Three CVEs: CVE-2026-71398 and CVE-2026-27302, both CWE-863 Incorrect Authorization, CVSS
      3.1 base 10.0 (AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H) — a remote unauthenticated attacker reaches
      arbitrary code execution with no privileges and no interaction — and CVE-2026-48381, a CWE-89 SQL
      injection also escalating to code execution, CVSS 9.0 (AC:H, so requiring some attack complexity).
      Adobe states it is not aware of active exploitation and rated the update Priority 1. This is the
      same product line and the same unauthenticated-RCE pattern this pipeline has already named twice
      this quarter — APSB26-114 (2026-08-02) and APSB26-120 (2026-08-07, "second wave... and landed a
      pattern") — making APSB26-123 effectively the third documented wave, and the first of the three
      the pipeline did not cover.
