    remaining exposed" — the entry's two figures exactly; the Kaseya comparison "60 of Kaseya's direct
    customers before subsequently hitting around 1,500 downstream businesses"; and the 2024 ScreenConnect
    targeting. The fixed build 2026.3.1.10 (Hotfix 2) traces to N-able's own status-page advisory via the
    2026-08-09 parent entry; the CVE record's "2026.3.1.7 unaffected" reflects Hotfix 1 and is superseded
    by the vendor's later Hotfix 2 requirement, which is precisely the delta the parent entry carried.
    KEV confirms CVE-2026-18577 added 2026-08-03. verification: single-source with a sourcing_note
    naming Microsoft as the originating assessor and the other outlets as additional publishers of one
    assessment is the correct call, and classification B/2 matches it.
