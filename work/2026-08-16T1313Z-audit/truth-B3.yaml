- entry: entries/2026-08-11/cve-2026-65400-screensharingd-remote-root-two-preauth-bugs.md
  verdict: imprecision
  defect: >
    cves[] carries `cvss: "7.1"` for CVE-2026-65400, and neither of this entry's two cited sources
    states any CVSS at all — Calif does not score it and Huntress does not score it. Apple, the owning
    vendor, publishes no score. The public authority score is NVD's 9.8. The 7.1 is inherited from the
    2026-08-08 parent entry, where it was correctly attributed to NCSC-NL in the sourcing_note; this
    update entry carries it forward with no attribution, and it now sits under a body whose entire
    argument is that the flaw is pre-authentication remote ROOT — a severity the 7.1 understates and
    the entry's own analysis contradicts.
  ground_truth: >
    NVD CVE-2026-65400: CVSS 3.1 9.8, CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H, source
    nvd@nist.gov, published 2026-08-06. Apple's CNA record carries a description but no metrics:
    "An authentication issue was addressed with improved state management. This issue is fixed in macOS
    Sequoia 15.7.9, macOS Sonoma 14.8.9, macOS Tahoe 26.6.1." — which confirms the entry's affected/fixed
    strings exactly, and independently supports Calif's "state machine desync" reading over the
    stale-return attribution. Everything else verified clean: Calif (10 Aug 2026) states screensharingd
    "runs as `root`, the account that can do anything" (backticks are a markdown artefact, not a quote
    mismatch), the four-hour exploit build, "Where the first bug is a stale return value, the second is
    a state machine desync.", @osxreverser credited with the first bug, and the ~40k exposed-host scan
    ("around 40k open screen sharing hosts on the internet, almost half in the US, most are residential
    IPs but there are many juicy hosts in Murican universities, some companies"). Huntress (7 Aug 2026)
    states verbatim both of its quoted sentences, the RSA-SRP vs SRP authentication_type discriminator,
    the Censys "tens of thousands of potentially vulnerable hosts" figure, and the same fixed versions.
    The `verification: contradicted` value and the sourcing_note's handling of the two incompatible root
    causes are accurate to what the two sources actually say.
  ground_truth_url: https://services.nvd.nist.gov/rest/json/cves/2.0?cveId=CVE-2026-65400

