- entry: entries/2026-08-12/n-able-n-central-storm-1175-stormencryptor.md
  verdict: clean
  defect: null
  ground_truth: >
    The Record (Alexander Martin, 10 August 2026) re-fetched. Both evidence quotes verbatim: "the
    Storm-1175 group began deploying a new ransomware strain on August 2 called StormEncryptor" and
    "Microsoft has not formally confirmed the access vector, but noted that StormEncryptor deployments
    began the same day the flaw was disclosed". Also confirmed: Storm-1175 described as China-linked and
