- entry: entries/2026-08-10/natjack-nat-trust-assumption-attack-class-two-cves.md
  verdict: factual-error
  defect: >
    The entry asserts "Two CVEs were assigned and both name the downstream-spoofing hijack specifically"
    and that "the other three primitives carry no identifier and no vendor fix at all"; the primary
    source natjack.io now lists THREE assigned CVEs, and the second primitive (TCP hijacking via
    upstream spoofing) carries its own Microsoft identifier, CVE-2026-56179 — so both the count and the
    "no identifier" characterisation of that primitive are wrong as the source now reads. The
    sourcing_note compounds it by presenting the two-CVE mapping as taken from "the researcher's own
    explicit statement". (Secondary, non-load-bearing: cves[] records cvss null for CVE-2026-63913
    while the Linux CNA record carries CVSS 3.1 8.2.)
  ground_truth: >
    natjack.io CVE list, verbatim mapping: CVE-2026-56181 — Microsoft Windows NAT (Hyper-V), downstream
    spoofing; CVE-2026-56179 — Microsoft Windows NAT (Hyper-V), UPSTREAM spoofing; CVE-2026-63913 —
    Linux Kernel Netfilter, downstream-spoofing mitigation. CVE-2026-56179 is confirmed in the CVE
    record: assigner microsoft, "Origin validation error in Windows Network Address Translation (NAT)
    allows an unauthorized attacker to perform spoofing over an adjacent network.", CVSS 3.1 8.3
    (AV:A/AC:H/PR:N/UI:N/S:C/C:H/I:H/A:H), affecting Windows Server 2025 and Windows 11 24H2/25H2/26H1 —
    i.e. the same product surface the entry already covers.
    TIMING CAVEAT the auditor must weigh: CVE-2026-56179 was published 2026-08-11T17:07Z (August Patch
    Tuesday), one day AFTER this entry's run (2026-08-10T0411Z); it may not have been on natjack.io at
    compose time. Suggested remediation is a superseding UPDATE entry adding CVE-2026-56179, not a
    retraction. Everything else verified clean: the five named primitives match the source's list
    (downstream TCP hijack, upstream TCP hijack, UDP DNS hijack, victim IP/port disclosure, denial of
    service); CVE-2026-56181 CVSS 8.3 and the Windows Server 2025 / Win11 24H2-26H1 range match
    Microsoft's record exactly; "Linux 7.1 plus seven stable and long-term point releases" is exactly
    right (5.10.259, 5.15.210, 6.1.176, 6.6.143, 6.12.93, 6.18.35, 7.0.12, plus 7.1); the
    "every evaluated NAT implementation" claim matches "All tested routers and network infrastructure
    devices performing any form of network address translation have been found to be vulnerable to some
    or all of the NatJack attacks."; all four evidence quotes are verbatim (the "_not a complete fix_"
    underscores in the source are a markdown-extraction artefact, not a quote mismatch).
  ground_truth_url: https://natjack.io/

