- source_id: anssi-fr
  reason: 'recipe update: `cert-fr avis-recent N` returns at most 40 items (about two days). Older items in a week''s lookback: `url --direct https://www.cert.cyber.gouv.fr/avis/page/<n>/` (10 per page, newest first; parse alert-item__title, alert-item__date and the CERTFR-2026-AVI id); pages 1-10 reached 2026-11-02 in this run'
- source_id: bsi-de
  reason: 'recipe update: `bsi-csaf WID-SEC-2026-<n>` works on sequential ids; calibrate id to date from a few probes (4400 = 2026-11-08, 4571 = 2026-11-12) and fetch the range in parallel (xargs -P 10) instead of reading the 815-row changes.csv; the CSAF scores array is empty, so severity comes from aggregate_severity and the referenced vendor page'
- source_id: enisa-euvd
  reason: 'recipe update: `url --direct ''https://euvdservices.enisa.europa.eu/api/search?fromScore=9&toScore=10&fromDate=D&toDate=D&size=100''` per day, plus `&page=1` for the second 100 when total exceeds 100; per-record page `https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-...`; `recent exploited` and `/api/exploitedvulnerabilities` returned the same 4 records'
- source_id: msrc-update-guide
  reason: 'recipe update: the revised-CVE OData sweep works against base https://api.msrc.microsoft.com/sug/v2.0/en-US/vulnerability with $filter=latestRevisionDate ge <ISO> and isMariner eq false and releaseDate lt <window start>, $orderby, $top=300 (the .../sug/v2.0/sugodata/v2.0/... path answers 403 on `url --direct`); `msrc cvrf 2026-Nov` (33 MB) parses in seconds with python json'
