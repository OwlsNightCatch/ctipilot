  discovery_trace: 'first seen at: bsi-de CSAF WID-SEC-2026-4525 (Node.js: Mehrere Schwachstellen, 16 CVEs, 2026-11-11) via changes.csv + bsi-csaf and advisories-ncsc-nl NCSC-2026-0492 (2026-11-12, `ncsc-nl csaf NCSC-2026-0492`) -> WebSearch ("Node.js November 2026 security releases high severity CVE nodejs.org blog vulnerability") -> primary: Node.js advisory, URL https://nodejs.org/en/blog/vulnerability/november-2026-security-releases (extract) -> release notes v24.22.3/v26.13.1/v22.23.5 on newreleases.io (extract) for the fixed builds'
  summary: 'The Node.js project''s 2026-11-11 security release fixes 16 flaws across the 22.x, 24.x and 26.x lines, the worst rated high. Unauthenticated, network-reachable: CVE-2026-123864 (CVSS 8.1 per NCSC-NL''s CSAF record, AC:H), a zero-length TLS write issued from JavaScript inside the HTTP parser''s on_body callback re-enters llhttp_execute(), giving a use-after-free and heap over-read that copies freed or unrelated heap into the request body and can leak other connections'' data including TLS private keys and other users'' requests; it needs a handler that calls res.flushHeaders() before the request body ends and later res.end() with a non-empty chunk, and a route that echoes or stores the body (cleartext node:http not affected). CVE-2026-123863 (8.2), -123865, -123866, -123874 and -126051 are HTTP/2 or TLS server aborts, session/FD leaks and a use-after-free that sends freed response memory to the peer, reachable by any unauthenticated client against default http2 servers. CVE-2026-123872 (8.1, PR:L) lets a TLS 1.2 client change the server name on renegotiation or resumption to bypass client-certificate authentication; CVE-2026-123867 and -123877 are further mTLS and Agent certificate-policy bypasses. Fixed builds, from the project release notes: 24.22.3, 26.13.1 and 22.23.5 (the NCSC-NL text lists older numbers and should not be used). Brotli is also updated to 1.2.1 in the same build. No exploitation or public proof of concept is stated by any source read. Not in the store.'
