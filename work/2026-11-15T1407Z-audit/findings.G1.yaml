  discovery_trace: 'first seen at: cisa-kev bridge (python3 tools/fetch_source.py cisa-kev; CVE-2026-20320 dateAdded 2026-11-10, not in store) -> CISA alert, URL https://www.cisa.gov/news-events/alerts/2026/11/10/cisa-adds-six-known-exploited-vulnerabilities-catalog (WebFetch) -> primary: Cisco advisory with revision table, URL https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-bworks-xxe-uwUd7CEt (extract)'
  summary: 'Cisco''s advisory describes an out-of-band blind XML external entity injection in the Open Client Interface - Provisioning (OCI-P) XML parser of Cisco BroadWorks: external entity resolution is allowed by default, so an unauthenticated remote attacker sending a crafted XML message to the OCI-P service (and the Open Client Server and OCIOverSoap) can read sensitive files from the filesystem with the privileges of the BroadWorks process. CVSS 3.1 7.5 (AV:N/AC:L/PR:N/UI:N/C:H); affected are the BroadWorks Application Delivery Platform, Application Server, Profile Server and Xtended Services Platform earlier than RI.2026.07, fixed in RI.2026.07, with no workaround. Initial publication was 2026-08-19; CISA added the flaw to KEV on 2026-11-10. Cisco''s revision history is the contradiction to carry: version 1.1 (2026-11-12) said it was updated ''to reflect known active exploitation'', version 1.2 (2026-11-13) was ''corrected to state that this vulnerability was added to the CISA KEV'' and that Cisco has no direct evidence of active exploitation. The exploitation status therefore rests on CISA''s listing alone, not on a Cisco or third-party sighting. BroadWorks is carrier and UCaaS provisioning software, so exposure in the Swiss public sector would be through telecom suppliers rather than own estates.'
