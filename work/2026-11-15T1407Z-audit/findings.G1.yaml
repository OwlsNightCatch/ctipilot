  summary: 'Oracle''s pre-release announcement of 2026-11-12 states that the Critical Security Patch Update (CSPU) of Tuesday 2026-11-17 addresses 652 new security patches. Counts and top scores per family, as Oracle states them: Database Server 7 patches, 3 unauthenticated, highest CVSS 9.9, affecting 19.3-19.33, 21.3-21.24 and 23.4.0-23.26.4; APEX 2 patches, both unauthenticated, 9.8; REST Data Services 9 patches, 5 unauthenticated, 9.8; Autonomous Health Framework 3, all unauthenticated, 9.1; Fusion Middleware 71 patches, 53 unauthenticated, 10.0 (Access Manager, ADF, HTTP Server, Managed File Transfer, SOA Suite, Service Bus, WebCenter Content among the named products); E-Business Suite 72, 22 unauthenticated, 9.8; Enterprise Manager 5, 3 unauthenticated, 9.1; Communications 28, 18 unauthenticated, 9.8; MySQL 8 patches, 2 unauthenticated, 9.1; Java SE 11, all unauthenticated, highest 8.1; Analytics 10.0; Hyperion and Supply Chain 9.9; PeopleSoft 9.3. Oracle warns the content may change before the advisory and gives no CVE ids, exact flaw descriptions or exploitation statements yet. The store carries the September 2026 CSPU entry but nothing for November; this is advance notice that sizes the maintenance window needed on 2026-11-17 for Oracle estates in cantonal and federal administration.'
