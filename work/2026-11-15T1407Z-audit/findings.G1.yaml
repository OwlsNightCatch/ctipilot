  summary: 'The covered entry names Cisco only through Duo Network Gateway and RoomOS and says a longer list is dated to 2027. Cisco''s advisory is now at version 1.13 (2026-11-13, ''Updated products under investigation, vulnerable products, and products confirmed not vulnerable''): the priority-product table marks NX-OS Software as impacted while Catalyst SD-WAN, ISE, IOS XE, IOS XR, ASA, FMC and FTD are not impacted; Nexus 3000 and Nexus 9000 Series switches in standalone NX-OS (Guest Shell) are listed under bug CSCwx56979 with fixes Guestshell 4.9 or NX-OS 9.3.19 (Jan 2027), 10.3.11 (Dec 2026), 10.4.9 (Feb 2027), 10.5.7 (Jan 2027), 10.6.5 (Feb 2027) and 10.7.1 (Jan 2027); Duo Network Gateway 3.4.2 and Duo Authentication Proxy Local Manager for Windows 6.8.1 (Nov 2026); Catalyst Center, NFVIS, Crosswork Hierarchical Controller, HyperFlex and others stay under investigation. The advisory also covers the three Node.js TLS/DNS CVEs (CVE-2026-105482, -105483, -106069). Fortinet''s FG-IR-26-187 (published 2026-10-26, revised 2026-11-13) lists FortiDAST, FortiEDR, FortiFone, FortiPAM, FortiRecon, FortiSandbox PaaS, FortiSwitch, FortiSwitch NMS, FortiSwitchAX(-Chassis) and FortiVoice as still under investigation for the Node.js and Brotli CVEs, with FortiOS, FortiMail, FortiManager, FortiAnalyzer, FortiWeb and others confirmed not impacted. Apple''s tvOS 27.2.1 (2026-11-13) fixes the brotli component (CVE-2026-111497); the entry lists iOS, iPadOS, macOS, watchOS, visionOS and HomeView but not tvOS. Palo Alto''s portfolio page (PAN-OS 12.2, 12.1, 11.2 affected) is already in the Node2Shell entry; its revision of 2026-11-09 only added remediated cloud products.'
