- title: 'Oracle announces its 2026-11-17 Critical Security Patch Update: 652 patches, unauthenticated flaws in Database Server (up to 9.9), APEX (9.8), REST Data Services, Fusion Middleware (10.0), E-Business Suite (9.8), Java SE and MySQL (9.1)'
