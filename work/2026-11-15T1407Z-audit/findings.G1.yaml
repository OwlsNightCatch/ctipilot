  extended_notes: 'Detection concept: web/app logs of the OCI-P and OCIOverSoap listeners for XML bodies carrying DOCTYPE or ENTITY declarations; outbound DNS/HTTP from the BroadWorks hosts to unusual destinations (out-of-band blind XXE). Hardening: restrict OCI-P to provisioning clients, upgrade to RI.2026.07. CISA marked forensicTriage: No.'
- title: 'CVE-2026-102895 GPUStack loopback auto-admin authentication bypass (GHSA-gj9m-f8ph-pmhr): unauthenticated administrator, API-key minting and code execution on workers, exploited in the wild with reverse-shell backends; CISA KEV 2026-11-09, fixed in 2.2.0'
  sources:
  - url: https://github.com/gpustack/gpustack/security/advisories/GHSA-gj9m-f8ph-pmhr
    publisher: GPUStack project (GitHub security advisory)
    date: '2026-07-31'
    role: primary
