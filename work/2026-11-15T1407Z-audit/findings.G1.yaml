- title: 'CVE-2026-20320 Cisco BroadWorks OCI-P XML external entity flaw (CVSS 7.5, unauthenticated file read): CISA lists it as exploited on 2026-11-10, while Cisco withdrew its own ''known active exploitation'' wording on 2026-11-13'
