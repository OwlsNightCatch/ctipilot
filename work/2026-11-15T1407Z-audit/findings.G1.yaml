    role: corroborating
  discovery_trace: 'first seen at: enisa-euvd bridge (python3 tools/fetch_source.py enisa-euvd recent exploited; EUVD-2026-119377, exploitedSince 2026-11-13, not in store) -> CISA KEV 2026-11-13 via cisa-kev bridge and alert URL https://www.cisa.gov/news-events/alerts/2026/11/13/cisa-adds-two-known-exploited-vulnerabilities-catalog (WebFetch) -> WebSearch ("UnrealIRCd 6.2.7.1 CVE-2026-114713 labeled-response server-to-server command injection exploited") -> primary: oss-security post carrying the advisory, URL https://seclists.org/oss-sec/2026/q4/576 (extract; the forum URL answered 403 on WebFetch and empty on extract)'
  summary: 'UnrealIRCd''s IRCv3 labeled-response module does not escape the ''label'' message tag when echoing it into replies, so a user can inject newlines into server-to-server traffic on any network with two or more linked servers and issue commands with server authority (KILL, GLINE and more). Maintainer Bram Matthys calls it the most critical issue found in UnrealIRCd in 15 years; versions 6.0.0 through 6.2.7 are affected (EUVD: CVSS 3.1 8.6, AV:N/PR:N/S:C), fixed in 6.2.7.1 of 2026-11-07, which also fixes eight other issues (crashes, hangs, a user decloaking flaw). A hot-patch applies without restart on UnrealIRCd 6 networks, and a SPAMFILTER rule blocking invalid label tags is the interim protection (only if all servers are 6.0.4 or newer); 3.2.x, 4 and 5 are end of life. The exploitation statement is the project''s (''we are seeing bad guys exploiting this issue on the internet right now'', as relayed by search results; the oss-sec text itself does not carry it) plus CISA''s KEV listing on 2026-11-13; no independent sensor report was read. IRC servers are rare in public administration, so this is an awareness item only.'
