  extended_notes: 'Detection concept: process restarts/crashes of Node.js http2 and TLS servers (assertion aborts), connections lingering in CLOSE_WAIT with memory growth (CVE-2026-123865), and unexpected request-body content in HTTPS handlers. If an HTTPS app matches the handler pattern and ran an affected build, treat the TLS private key as exposed and reissue after patching. Hardening: upgrade to the fixed builds and restart services; disable http2 where not needed.'
- title: CVE-2026-126187 React Server Components typed-array flaw gives unauthenticated code execution in rare Flight payloads (Next.js 16.0.0-16.4.0 App Router with Cache Components); public proof of concept, no exploitation reported; CVE assigned 2026-11-10
  sources:
  - url: https://github.com/advisories/GHSA-xqc2-xf4c-x3h3
    publisher: GitHub Advisory Database (React advisory GHSA-xqc2-xf4c-x3h3)
    date: '2026-11-10'
    role: primary
  - url: https://radar.cloudflare.com/security/zero-wire/rsc-typed-array-rce
    publisher: Cloudflare Radar (Zero Wire)
    date: '2026-11-11'
    role: corroborating
  discovery_trace: 'first seen at: bsi-de CSAF WID-SEC-2026-4467 (React: Schwachstelle ermoeglicht Codeausfuehrung, 2026-11-10) via changes.csv + bsi-csaf -> its reference https://github.com/advisories/GHSA-xqc2-xf4c-x3h3 (extract) -> WebSearch ("CVE-2026-126187 React Server Components unauthenticated remote code execution typed arrays 19.3.1 Next.js") -> Cloudflare Radar, URL https://radar.cloudflare.com/security/zero-wire/rsc-typed-array-rce (extract)'
  summary: 'React''s Flight protocol for Server Components can be driven to run code on the server when a response carries several large typed arrays that share one underlying buffer and an attacker-controlled value: the writer frames the stream incorrectly and the reader treats attacker bytes as protocol rows that call a Server Action with attacker-chosen arguments (Hash Security''s analysis as relayed by Cloudflare Radar); command execution needs a Server Action that does something dangerous with those arguments. React calls the affected cases ''extremely rare'' and Vercel says there is no workaround. Affected: react-server-dom-webpack, -turbopack and -parcel 19.0.0-19.0.8, 19.1.0-19.1.9, 19.2.0-19.2.8 and 19.3.0 (fixed 19.0.9, 19.1.10, 19.2.9, 19.3.1); Next.js 16.0.0-16.4.0 apps using the App Router with Cache Components (fixed 16.4.1; Next.js 15.5.28 carries the transport fix; updating React alone does not fix Next.js because it bundles its own copy). Cloudflare states a public proof of concept exists and that React, Vercel and CISA had not reported exploitation as of 2026-11-11. One aggregator scores it 9.5; no vendor score was read, so severity is unconfirmed. Timing caveat: the React and Next.js advisories date from 2026-10-14; the in-window events are the CVE assignment and GitHub Advisory Database entry of 2026-11-10 and BSI''s WID-SEC note of the same day. Lineage: the same framework area as the December 2025 React2Shell flaw.'
