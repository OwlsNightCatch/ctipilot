- title: 'Node.js 2026-11-11 security releases: unauthenticated heap disclosure including TLS private keys through HTTPS (CVE-2026-123864), HTTP/2 aborts and leaks, TLS 1.2 renegotiation bypass of client-certificate auth; fixed in 22.23.5, 24.22.3 and 26.13.1'
  sources:
