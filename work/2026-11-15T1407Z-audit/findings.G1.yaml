  summary: 'CERT-FR''s advisory of 2026-11-12 cites SonicWall bulletin SNWLID-2026-0021 of 2026-11-10 for SonicOS versions before 7.3.4-7015 and before 8.2.3-8015 and names confidentiality and integrity impact; no CVE id is given in the CERT-FR text. The covered entry for CVE-2026-19868 gives SNWLID-2026-0014 and the fixed builds 7.3.4-7013 (Gen7) and 8.2.3-8015 (Gen8). A Gen7 bound of 7015 against the entry''s 7013 suggests a second SonicOS advisory with a newer minimum build, which would change the ''upgrade to'' target for Gen7 firewalls; this is unverified because the vendor page was unreadable. Recommended follow-up for the main agent: read SNWLID-2026-0021 through a browser-capable reader and compare. Low confidence, flagged as a lead, not a finding.'
