  summary: 'Azul (Payara''s CNA) published two records on 2026-11-12, both CVSS 4.0 9.3 (AV:N/AC:L/PR:N): CVE-2026-110003, where the administration REST interface lets a remote unauthenticated attacker bypass the secure-admin remote-access restriction by sending any value in the X-GlassFish-authToken header, because the header''s presence waives the remote-rejection check before the token is validated and an invalid token then falls through to password authentication, which succeeds without credentials on default domains whose administrative password is empty, granting arbitrary administrative commands; and CVE-2026-90908, where the GenericAdminAuthenticator accepts a spoofed client host address on JMX/RMI, granting access to the MBean server and code execution (Payara Micro only when its JMX connector is enabled). Fixes are in Payara Server 7.6.0, 6.44.0, 5.93.0 and 4.1.2.191.61 and Payara Community 7.2026.11; the 6.44.0 release notes list FISH-14855 ''Remote Admin Authentication Bypass via Unvalidated Auth Token Header'' and FISH-14190 ''Remote Code Execution in JMX'' as security fixes. No exploitation, KEV listing or public proof of concept is stated. Exposure is any Payara/GlassFish-style Java application server whose admin REST or JMX listener is reachable from untrusted networks, a common misconfiguration in older e-government application estates. Release dates are not on the vendor pages; the EUVD timestamps (2026-11-12) are the in-window anchor.'
