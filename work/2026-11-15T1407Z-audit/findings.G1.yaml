  borderline_reason: exploited and KEV-listed with unauthenticated admin to RCE, but GPUStack is niche AI infrastructure with no shown Swiss public-sector footprint; the audit may keep it only as a short awareness item for research institutions
  extended_notes: 'Detection concept: reverse-proxy and application access logs for unauthenticated requests reaching admin routes (users, api-keys, inference-backends/from-yaml) and for the X-GPUStack-Real-IP header arriving from the internet; new custom inference backends and new admin API keys created outside change windows; worker hosts spawning shells from the GPUStack service account. Post-patch check: rotate admin API keys and worker/cloud-provider secrets because minted keys survive the upgrade.'
