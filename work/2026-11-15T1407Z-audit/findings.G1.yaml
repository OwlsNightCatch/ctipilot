  discovery_trace: 'first seen at: vulncheck (WebFetch of https://www.vulncheck.com/blog; `extract` on the listing returns a stale 2022 snapshot) -> primary: VulnCheck post, URL https://www.vulncheck.com/blog/microsoft-secret-hunter (extract); overlaps the G3 research sweep'
  summary: 'VulnCheck reports that the address Microsoft Threat Intelligence tied on 2026-11-05 to agentic GitHub secret hunting and Entra ID/Azure Key Vault access (successful service-principal sign-ins from 2026-10-28) also hit VulnCheck canaries by another route: it exploited Langflow to pull credentials from the host, over 36 minutes with 11 payloads that look like an agent working the problem rather than an exploit kit, 25 events from 13 distinct requests. Todyl and Huntress are cited for the same address signing into Entra ID with stolen app secrets (Todyl: at least 27 organisations; Huntress: Azure tokens in four customer tenants). The post bridges the secret-leak campaign and opportunistic exploitation of exposed AI-workflow tooling; no Swiss victim is named. Scope note: this is research/attribution content for the G3 sweep; the covered store entries on exposed application credentials and ARTEX do not mention Langflow exploitation.'
