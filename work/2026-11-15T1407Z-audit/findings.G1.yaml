    publisher: CISA (KEV alert)
    date: '2026-11-09'
    role: corroborating
  discovery_trace: 'first seen at: cisa-kev bridge (python3 tools/fetch_source.py cisa-kev; CVE-2026-102895 dateAdded 2026-11-09, not in store) -> CISA alert, URL https://www.cisa.gov/news-events/alerts/2026/11/09/cisa-adds-four-known-exploited-vulnerabilities-catalog (WebFetch) -> primary: KEV ''notes'' link to the project advisory, URL https://github.com/gpustack/gpustack/security/advisories/GHSA-gj9m-f8ph-pmhr (extract)'
  summary: 'GPUStack, an open-source GPU-cluster and model-serving manager, trusts the network source of a request as an authentication signal: in gpustack/api/auth.py, get_current_user promotes any request whose client IP resolves to loopback to the built-in administrator when force_auth_localhost is False (the default). Behind the canonical same-host reverse proxy (proxy_pass to 127.0.0.1) every remote request arrives from a loopback peer, and a forged X-GPUStack-Real-IP: 127.0.0.1 header does the same, so an unauthenticated network attacker obtains full admin: enumerate and change users, models and workers, mint persistent admin API keys valid from any IP, read worker credentials and cloud-provider secrets, and reach code execution on worker hosts through POST /v2/inference-backends/from-yaml. The project advisory states the flaw ''has been observed exploited in the wild against a v2.1.1 deployment (attacker-created custom backends running reverse shells)'', credited to Javier Sixto (ulex.fr); CISA added it to KEV on 2026-11-09 (due 2026-11-12, forensic triage marked yes). Fixed in 2.2.0 (loopback auto-admin path removed, client-IP header handling hardened); workarounds are force_auth_localhost=true, stripping the X-GPUStack-Real-IP header at the proxy, and keeping the API off untrusted networks. The advisory page dates from 2026-07-31; the in-window event is the KEV listing.'
  region_nexus: global; AI/GPU infrastructure tooling, no stated Swiss public-sector deployment (universities and research institutes are the plausible constituency overlap)
