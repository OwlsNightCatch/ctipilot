- title: VulnCheck canaries tie the IP behind Microsoft's agentic GitHub-secret hunting campaign to Langflow exploitation (11 payloads in 36 minutes), extending the ARTEX/Storm-0940 entries
  update_target: 2026-11-06/exposed-app-credentials-entra-signins-msp-clients-artex
