- entry: 2026-07-25/certighost-cve-2026-54121-ad-cs-dc-impersonation-poc
  verdict: imprecision
  findings:
  - code: F3
    claim_id: c11ffbfdab
    where: body para 2, sentence citing CybersecurityNews (low confidence)
    defect: A low-privileged domain user, using a machine account it can self-register under the default `ms-DS-MachineAccountQuota` or one it controls, stands up rogue LDAP/LSA services ... ([CybersecurityNews, 2026-07-24])
    ground_truth: 'CybersecurityNews carries only: "Combined with a machine account created through the default ms-DS-MachineAccountQuota setting (which lets any user register up to 10 machine accounts)". "or a machine account already controlled by the attacker" is stated by the Microsoft Defender post (techcommunity ... 4542861), which is not the citation of that clause.'
    ground_truth_url: https://cybersecuritynews.com/certighost-active-directory-cs-flaw/
    fix: Add the Microsoft Defender citation to the clause, or drop "or one it controls".
  - code: F16
    claim_id: null
    where: 'priority: high (low confidence)'
    defect: priority high on an update whose new fact is Kaspersky reporting that the Citrus ransomware group "attempted to exploit" Certighost.
    ground_truth: 'Bar element (b) is weak: the patch has been available since 2026-07-14 and the PoC public since 2026-07-24, so the decision is the ordinary patch decision, not an out-of-band one; MSRC revision history still lists only "1.0 Jul 14, 2026 Information published" and Exploitability "Exploited No"; Kaspersky says Citrus attacks "Russian companies only" and never says an attempt succeeded; the flaw needs EDITF_ENABLECHASECLIENTDC on the CA plus a machine-template enrollment path. Bar element (c) in-window development holds (Kaspersky 2026-11-11). Doubt resolves to notable.'
    ground_truth_url: https://securelist.com/citrus-ransomware/121879/
    fix: Consider notable, or keep high only if a specific constituency exposure (Enterprise CAs without the July 2026 CU with the chase flag set) is stated.
  length_note: null
  notes:
  - 'Verified: CVE-2026-54121 CVSS 3.1 8.8 and affected products (Windows 10 1607/1809, Server 2012-2025) in the MSRC CVRF; not in CISA KEV (catalogue 2026.11.13); evidence quotes verbatim; techniques T1649, T1003.006, T1078.002 active in pin; updated_at mirrors the 2026-11-12 record.'
