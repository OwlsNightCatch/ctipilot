  - code: F3
    claim_id: 0396dda0f9
    where: body para 3, Veeam sentence (low confidence)
    defect: '"Veeam''s KB4966 says its Software and Infrastructure Appliances, workers, helper appliances and recovery media include an affected kernel, delivered fixed through Veeam Updater"'
    ground_truth: 'KB4966 delivers the fix per product: appliances and public-cloud plug-in appliances through Veeam Updater; "Workers automatically update on launch"; Windows-based Backup & Replication helper appliances through a private fix; recovery media by downloading new media.'
    ground_truth_url: https://www.veeam.com/kb4966
