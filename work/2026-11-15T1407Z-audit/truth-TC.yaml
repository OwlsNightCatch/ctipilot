- entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
  verdict: imprecision
  findings:
  - code: F4
    claim_id: 1f07ace98e, 9fa744ca09, 2716d80919, 1709787bd0, bcb01da631
    where: headline; summary; cves[].fixed (both CVEs); actions[0]; Defender takeaway (publisher revision after the 2026-11-10 record)
    defect: 'headline: "the hotfixes are partner-only"; summary: "the fixes are the hotfixes v10.3.4.45 (v10) and v9.15.2.70 (v7, v8 and v9), available only to partners with a portal login"; fixed: "hotfixes available only through the Ahsay partner portal"; actions[0]: "apply the hotfix v10.3.4.45 ... ask the integrator or Ahsay for the build".'
    ground_truth: 'Ahsay has since shipped later hotfixes and standard (non-partner) releases. Announcements: 2026-10-27 "The latest v10 official hotfix version is v10.3.4.55" and "AhsayCBS v9.15.2.78 official hotfix" (v9.17.0 to follow "incorporated into the official installer and available as part of the standard release"); 2026-11-03 "New Ahsay v10.3.6.1 Released ... AhsayCBS security hardening updates"; 2026-11-12 "New Ahsay v9.17.0 Released ... Ahsay Security Patchset for CVE-2026-105133 and CVE-2026-105134 ... Disabled remote API access by default ... Disabled the JSP engine"; release notes "AhsayCBS (DIY) v9.17.0 Release Notes (12-Nov-2026)"; 2026-11-13 v10.3.6.14. Fix is therefore no longer partner-only and the named hotfix builds are not the newest.'
    ground_truth_url: https://www.ahsay.com/en/company/announcements
    fix: 'Add a changelog update: Ahsay released v9.17.0 (2026-11-12, patchset for both CVEs, JSP engine disabled, remote API off by default), v10.3.6.1 (2026-11-03) and later hotfixes v10.3.4.55 / v9.15.2.78; reword headline, summary, fixed fields and actions[0] so the partner-only hotfix is not presented as the only route.'
  - code: F9
    claim_id: null
    where: Improvement section 2026-10-18, CVE-2026-105134 root cause (low confidence)
    defect: The section gives Horizon3's mechanism for CVE-2026-105134 (receiver created through an auth-bypassed call, upload path escapes the denylist, JSP written, runs as LocalSystem/root) without noting that the CNA record and CISA classify it as OS command injection via the random parameter of /rps/api/json/UpdateReceivers.do.
    ground_truth: 'CISA KEV for CVE-2026-105134: "contains a command injection vulnerability ... via manipulation of the random parameter in the Replication Receiver component''s /rps/api/json/UpdateReceivers.do endpoint"; CNA (VulDB) title "UpdateReceivers.do os command injection"; Bitdefender: "OS command injection (CWE-77 and CWE-78)". Horizon3: "CVE-2026-105134 - A file write path traversal leading to remote code execution".'
    ground_truth_url: https://horizon3.ai/attack-research/attack-blogs/ahsaycbs-cve-2026-105133-cve-2026-105134-technical-analysis/
    fix: 'Add a Contradiction line: CNA/CISA label it command injection, Horizon3''s source analysis shows a path-traversal file write.'
  - code: F18
    claim_id: null
    where: actions[1] (low severity)
    defect: actions[1] bundles a compromise check, re-imaging and credential rotation and repeats the body's Detection list (.jsp files, replication receivers, administrator accounts, OpenSSH) inside the task.
    ground_truth: 'Body Detection and Update 2026-11-10 already carry these artifacts; Huntress: "we recommend a full re-image from a trusted backup and rotating credentials stored on or reachable from the server".'
    ground_truth_url: https://www.huntress.com/blog/ahsaycbs-webshells
    fix: 'Shorten to the task: compromise-check every AhsayCBS server exposed since 2026-10-04, re-image on a finding, rotate stored credentials; leave the artifact list to the body.'
  length_note: main analysis 705 words (bound 550); headline 127 characters (bound 120)
  notes:
  - Verified against Huntress (2026-10-08 with 10/12 update; 2026-11-09 follow-up), Bitdefender (2026-10-15), Horizon3 (2026-10-14), CISA alert and KEV (both added 2026-10-14), Ahsay announcement (October 12, 2026), CNA records (CVSS 3.1 7.3 and 10.0, CVSS 4.0 6.9 and 10.0 as the internal correction states). high stays defensible (in-window Huntress follow-up, KEV).
