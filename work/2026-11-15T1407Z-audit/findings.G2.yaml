    date: '2026-11-09'
    role: primary
  discovery_trace: 'first seen at: cert-fr-cti, URL https://cert.cyber.gouv.fr/cti/ (url --direct) listing CERTFR-2026-CTI-009 ''Publie le 09 novembre 2026'' -> primary: URL https://cert.cyber.gouv.fr/cti/CERTFR-2026-CTI-009/ (extract) -> PDF URL https://www.cert.ssi.gouv.fr/uploads/CERTFR-2026-CTI-009.pdf (pdf)'
  summary: The C4 crisis cell (ANSSI, COMCYBER, DGA, DGSE, DGSI) says in the report's opening statement that it can impute several destabilisation attacks against French interests to two cyber-offensive units of the IRGC electronic and cyber centre, Shahid Shoostari and Shahid Kaveh. The refrigeration-controller attack of 11-12 October 2026 is called unprecedented in scale and aggression and is added to attacks observed since at least 2020, among them destabilisation attacks on Charlie Hebdo in 2023 and on a French video-display firm in 2024 around the Paris Olympics. Per the PDF (broken spacing), the refrigeration case rests on indicators tied to Shahid Kaveh, while Shahid Shoostari, also documented in open sources as Iliyanet or Emennet Pasargad, is credited with the Charlie Hebdo targeting (2020 plan revealed by Lab Dookhtegan, defacement and database exfiltration on 2023-01-04) and with compromising the video-display management firm from 2024-07-20. The published entry and the registry (actor:shahid-kaveh) name only Kaveh; the report's lead sentence names both units, and the history is the only part of the report that says what the sponsor unit did before 2026.
