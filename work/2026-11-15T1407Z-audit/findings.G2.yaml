  summary: Head of Government Brigitte Haas, answering a small question in the Landtag, said Liechtenstein has an internationally active audit firm investigate the attack on the beneficial-ownership register; the award was decided in early November, the firm is not yet named because of the statutory standstill period, the award sum of CHF 1.65 million is a cost ceiling, and results are expected in the first half of 2027. The investigation is to analyse the incident, review selected IT systems and examine their governance and management. Inside IT restates that the attack at the end of July copied data on about 31,000 legal entities, that who was behind it is still unclear, and that the government has no indication of misuse of the data. This is a governance and oversight delta (a comparable item was dropped on 2026-11-13 as governance-only); it adds no technical fact. The published entry already carries the Landtag exchange and the incident facts.
