- title: 'Canton Vaud''s CYBER26 exercise: about 170 cantonal and communal entities (580 people in 168 crisis cells) played a four-hour ransomware crisis on 2026-11-12, run by the cantonal CSIRT; the canton''s reporting route is the police number 117'
