  summary: 'On 2026-11-12 nearly 170 Vaud entities, among them communes, inter-communal associations and social-cohesion partners, took part in the second edition of the cantonal cyber crisis-management exercise, now a four-hour online serious game: about 580 people in 168 crisis cells faced a fictitious cyberattack run by the cantonal CSIRT and the DGNSI security team that blocked their key services. The exercise trained coordination and communication in a cyber crisis and the newly elected municipal officials. The release restates the escalation path: in a cyberattack, call 117; the police cyber experts then contact the DGNSI''s cantonal intervention force, which can deploy against a commune, a state or para-state entity, or a private organisation whose compromise could affect the state or the population. No threat intelligence and no incident; a communal-level preparedness and reporting-route item. It follows the canton''s school IT-support breach, which the store tracks.'
