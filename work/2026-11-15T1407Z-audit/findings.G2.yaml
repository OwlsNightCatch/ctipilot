coverage_gaps:
- source_id: lab52
  reason: All direct transports reset the connection and the jina reader pool is exhausted (HTTP 402); WebSearch found nothing in window. No working recipe.
- source_id: anssi-cyber-gouv-actualites
  reason: extract fell through to the exhausted reader, WebFetch returned an empty page; WebSearch found no item dated 2026-11-08 or later. No working recipe.
- source_id: news-admin-ch
  reason: Listing ignores the start_date/end_date parameters and returns only the newest 12 releases, so the window 2026-11-08..12 is not enumerable; Curia Vista OData used as the substitute route.
- source_id: europol-newsroom
  reason: 'Release bodies are JavaScript-only (extract returns the shell, WebFetch empty). Recipe that works: feed for titles, `url --direct <item>` and grep datePublished for dates, press relays (Inside IT, heise, police partners) for the text.'
- source_id: prodaft
  reason: No dated listing on any transport; WebSearch found nothing in window.
- source_id: brusselstimes.com and bsky.app (cited leads, not slice records)
  reason: JS shells; WebFetch returns a summary only (Brussels Times) or the page header (Bluesky), so Microsoft Threat Intelligence's own post could not be read.
recipe_notes:
- source_id: inside-it-ch
  note: The RSS holds only about 20 items (2.5 days). For a week-long lookback `python3 tools/fetch_source.py url --direct https://www.inside-it.ch/sitemaps/sitemap-72.xml` lists every article slug with the -YYYYMMDD suffix (41 in 2026-11-08..13); article bodies come from `url --direct <article>` and the __NEXT_DATA__ JSON (props.pageProps.post.post.managed.published.elements[0].data.rawState.blocks[*].text).
- source_id: le-monde-info
  note: 'Re-platformed to Next.js: `url https://www.lemondeinformatique.fr/securite-informatique-3.html` is a shell whose hrefs are /cybersecurite-conformite/<slug> (only some slugs carry a date); `extract <article URL>` returns clean text with a date in the metadata. The earlier latin-1 note no longer applies to the section page.'
- source_id: vd-grand-conseil
  note: The record URL is the session page of 2026-11-03. https://www.vd.ch/gc/seances-du-grand-conseil (url --direct) lists session ids (2026-11-10 = 1033715, 2026-11-17 = 1033716); `extract .../detail-seance/seance-gc/<id>` reads each agenda with decisions.
- source_id: cert-fr-cti
  note: '`url --direct https://cert.cyber.gouv.fr/cti/` lists reports with Publie le dates; the report page /cti/CERTFR-2026-CTI-009/ extracts but its metadata date is stale (2024-04-08); the full text is the PDF on www.cert.ssi.gouv.fr/uploads/ read with `pdf` (broken spacing).'
- source_id: ncsc-ch-focus / ncsc-ch-incidents / bacs-press
  note: Card split recipe confirmed; the title now sits inside `class="card__title"` as `<!--[--><h3 class="">...` so the regex must tolerate the wrapper (my parse returned the date, title text and href with a small regex on the h3).
- source_id: fuitesinfos
  note: '`url --direct https://fuitesinfos.fr/articles/` (trailing slash) returns raw HTML containing /article/YYYY-MM-DD-slug hrefs (not markdown links); `extract <article>` reads each.'
- source_id: cisa-news / fbi-cyber-alerts / cisa-directives
  note: WebFetch returned dated listings for cisa.gov/news-events/news (10 items) and ic3.gov/PSA (28 items); the directives page shows no dates.
