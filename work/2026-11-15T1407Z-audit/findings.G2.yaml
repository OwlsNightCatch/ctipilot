  summary: 'Per Europol as relayed by Inside IT and heise, law enforcement from nine countries (named: Germany, the Netherlands, the United Kingdom, the United States; heise adds Canada) took down infrastructure behind three malware families: 14 servers and 218 domains for the Gootloader dropper (spread through manipulated, often compromised WordPress sites; 681 infected sites cleaned), 120 servers and 39 domains for the CastleRAT remote-access trojan, and 102 servers for the StealC infostealer, where the investigation has run since June 2026. More than 6.4 million stolen credentials were found in the infrastructure and shared with Have I Been Pwned, DIVD, NoMoreLeaks, CheckJeHack, Sekoia, the Shadowserver Foundation and NCSC-NL so affected users can be told; Europol advises WordPress operators to renew credentials, enable multi-factor authentication and patch known flaws. No Swiss authority is named as a participant in either relay, and neither relay says Swiss victims are in the datasets. Defender relevance is the notification channels (a Swiss public body can check its domains with Have I Been Pwned and Shadowserver reporting) and Gootloader''s reliance on compromised WordPress sites; the prior fires dropped it for lack of a Swiss defender step.'
