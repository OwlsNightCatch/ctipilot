- title: CERT-FR C4 report CERTFR-2026-CTI-009 also attributes earlier destabilisation attacks against France to a second IRGC-CEC unit, Shahid Shoostari (open-source names Emennet Pasargad / Iliyanet), which the Danfoss entry and the registry do not carry
