  discovery_trace: 'first seen at: watson.ch digital listing, URL https://www.watson.ch/digital (url --direct, 2026-11-15) -> pivot: watson.ch article, URL https://www.watson.ch/digital/international/546128888-kuehlanlagen-angriffe-auch-belgien-sieht-spuren-in-den-iran -> pivot: The Brussels Times via WebFetch, URL https://www.brusselstimes.com/2402132/iran-cyberattacks-belgium-is-taking-the-french-information-very-seriously (WebSearch ("Belgium interior minister Quintin Iran link supermarket freezer cyberattacks sanctions Belga") surfaced it; no Belga primary reachable)'
  summary: 'On 2026-11-12 Keystone-SDA/dpa (watson.ch) relayed Belgian Interior Minister Bernard Quintin to the Belga agency: Belgian security services speak of indications of possible links to known Iranian actors, the prosecutor''s office is examining these indications more closely, he said there is no reason to panic, and Belgium should clearly support the call for European sanctions against states that run cyberattacks on its territory. This is a shift from two days earlier: The Brussels Times (2026-11-10, read only through a WebFetch summary) reported that Belgian officials said they had no evidence allowing them to attribute responsibility to Iran or any other actor and could not tie the Belgian incidents to the French ones, with Foreign Minister Prevot calling targeted sanctions an important tool. The published Danfoss entry says the French and C4 attribution covers only the 11-12 October campaign and that the later waves are not covered, and carries no Belgian statement and no sanctions track. What is still missing: the Belgian statement is an indication relayed by an agency, not an attribution, no technical basis is given, and the minister''s own words reach us only through a German-language wire relay of Belga. The same watson article adds, as a second-hand political track and not as evidence: France announced it wants to impose new sanctions on those responsible, and Germany''s interior minister Dobrindt called the attacks a hybrid attack at ''next level'' and said Germany is creating the legislative conditions to ''strike back in cyberspace''. Neither changes a Swiss defender''s action.'
  region_nexus: europe (Belgium, France, Germany); Switzerland affected by the same controller population
