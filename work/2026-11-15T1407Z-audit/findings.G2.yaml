  summary: heise's iX interviews Sascha Herzog of NSIDE ATTACK LOGIC, which analyses the Rhysida leak of the Berlin Senate administrations for clients. He says Rhysida's stated 5.79 TB and 1.44 million files compare with 5.25 TB, 1.431 million files and about 150,480 folders in his firm's download, which took two and a half weeks over Tor, with Rhysida changing the file structure three times; he rates the data authentic with very high probability (99 percent, his estimate) and thinks about 70 to 80 percent of Rhysida's claims about content are accurate, assuming the group used AI to triage. He judges the leak's explosiveness very high and relevant beyond Berlin, since known e-mail addresses and earlier message threads help attackers write credible phishing mail, and he reports data on critical-infrastructure operators who are not his clients; he recommends opening the files only in a sandbox. heise also restates that the Senate chancellery confirmed outflow from the mobility and urban-development administrations and that Rhysida had access from 7 to 12 August. The published entry already carries the vector, the 5.7 to 5.8 TB figure and the refusal to pay; the new elements are the independent size figure, a vendor's authenticity estimate and the downstream-phishing and sandbox advice. Interview claims are the firm's, not a government finding.
