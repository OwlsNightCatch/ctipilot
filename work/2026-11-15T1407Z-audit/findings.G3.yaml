    Talos https://blog.talosintelligence.com/artex-and-beyond/ (talos feed https://blog.talosintelligence.com/rss/), Unit 42 https://unit42.paloaltonetworks.com/artex-and-ai-powered-red-teaming-tools/ (unit42
    feed), GitGuardian https://blog.gitguardian.com/ai-pentesting-tools-beyond-artex/ (gitguardian feed)'
  published_at: '2026-11-09'
  summary: 'Datadog reports in-the-wild activity by operators of ARTEX, the agentic penetration-testing framework already tracked in the store, against several AWS environments in October 2026, with a focus
    on financial data. Every session it reviewed opened with unauthenticated S3 reads (CloudTrail identity type AWSAccount, account id anonymous) and, where S3 hosted a web front end, the agent read build
    manifests and runtime configuration; Datadog and Wiz both describe a request for a deliberately non-existent object or path just before a burst of guesses. Where a valid long-term access key was held,
    the most frequent call was CloudWatch Logs FilterLogEvents, always with limit 1000, first searching names of crypto firms, funds and invoicing terms and on a later day widening to storage links, internal
    addresses, passwords and AKIA-style access keys inside log text. Where no key was held, the agent went after public Cognito user pools: repeated SignUp (some with the tool named in the user agent) against
    a PreSignUp Lambda that validated a tenant domain, then InitiateAuth, RespondToAuthChallenge, GetUser, a token-for-credentials exchange that shows in CloudTrail under the CognitoIdentityCredentials
    role session name, and a burst of read-only discovery calls (buckets, secrets, parameters, topics, log groups, REST APIs, repositories, functions) that all failed because the identity pool''s authenticated
    role was narrow. Datadog says it tied ARTEX activity to a hosted console and found hundreds of further exposed consoles, often Chinese-language; it states the distributions it studied carry no cloud
    playbook of their own, so behavior depends on the model behind them. Elastic, reading the source of five agentic frameworks, adds that none enforces authorization in code, that ARTEX and CyberStrikeAI
    change route when blocked, that revoking credentials does not stop an agent instantly because of documented propagation and token-lifetime delays, and that behavior-anchored detections (tempo per identity,
    sequence across sessions) outlast framework fingerprints. Facts are Datadog''s own telemetry (single first-hand source for the AWS sightings); the Cognito pattern and the non-existent-path habit are
    independently stated by Wiz.'
  region_nexus: global; AWS accounts of any region. Store entries already tie ARTEX to government ministries (VAPOR PANDA) and to MSP/Entra tenants; Datadog says some versions ship a default blocklist for
    .gov, .gov.cn, .edu and .edu.cn, which would not cover Swiss .admin.ch or cantonal .ch domains (inference, not a source statement)
  primary_sector_nexus: 'indirect: cloud tenants of cantonal/federal bodies and their suppliers that run AWS with long-lived IAM keys or public Cognito pools; no Swiss victim or Swiss-specific targeting
    is stated'
  sector: public-sector (indirect), cloud/IT suppliers
