  exposure: AWS accounts that hold long-lived IAM user access keys reachable from code, logs or developer machines; Cognito user pools that allow self-registration without a strict PreSignUp check; identity-pool
    authenticated roles broader than read-only; S3 buckets that serve web front ends with build manifests or runtime configuration; secrets and keys written into CloudWatch log text.
  detection: 'Telemetry class: cloud control-plane audit logs. (1) Unauthenticated S3 reads (CloudTrail userIdentity.type AWSAccount with accountId anonymous: GetObject/ListObjects) followed by a request
    for an object name that cannot exist, immediately before a burst of guessed keys. (2) FilterLogEvents from a long-term access key with limit 1000, repeated filter terms naming organisations plus Fund/Invoice/Billing/LLC,
    then terms for s3://, presigned, pdf/xlsx/csv, password, AKIA, internal address ranges. (3) Cognito sequence SignUp -> InitiateAuth -> RespondToAuthChallenge -> GetUser -> tokens exchanged for credentials
    (role session name CognitoIdentityCredentials) then many read-only discovery calls returning AccessDenied. (4) Large volumes of permission-denied errors, instance-role credentials used from a non-AWS
    address, and tempo per identity (many distinct sensitive actions in seconds). Post-incident check: revocation lags (AWS and Entra document propagation and token-validity delays), so pair a block with
    credential rotation and check for the same requests returning from new addresses and user agents.'
  triage: 'Benign lookalikes: authorised red-team use of the same open-source frameworks and log tooling that legitimately calls FilterLogEvents. Discriminators: a user-agent string that names the framework
    or an ''authorized pentest'' label, a constant limit of 1000, search terms that enumerate financial names and secret patterns, an identity-pool role session that probes dozens of unrelated services
    in a burst, and a source address outside the organisation''s known egress ASNs.'
  defender_takeaway: Retire or rotate long-lived IAM user keys, close self-sign-up on Cognito pools that do not need it and validate in PreSignUp, make identity-pool authenticated roles least-privilege,
    keep secrets out of CloudWatch text and front-end bundles in S3, and add a per-identity burst rule across S3, CloudWatch Logs and Cognito events.
  extended_notes: 'Datadog lists tool-named user agents and hosting-provider addresses in its appendix; deliberately not carried (no IOCs). Datadog says the ARTEX developer made the repository closed-source
    on 2026-10-08 after 12,000 forks; Elastic notes none of five frameworks enforces authorization in code and only ARTEX and CyberStrikeAI ship .gov blocklists. Talos, Unit 42 and GitGuardian published
    parallel ARTEX-class landscape posts the same week (Talos: 700 reachable PentAGI instances; GitGuardian: about 45 frameworks, 1,428 ARTEX-family Shodan services on 2026-11-07); both are inventory material,
    not a new campaign. Fires dropped the Elastic/Talos/Unit 42/Sophos internals on 2026-11-13 to 2026-11-15 as ''class already covered''; Datadog''s AWS post was never seen.'
- title: 'Huntress: beyond the clipboard, four ClickFix chains seen in incidents (ClickFix to WinRM on a domain controller with reverse SSH tunnels, payloads rebuilt from PNG pixel data, browser-cache-seeded
    launch, Node.js RAT posing as an RMM tool)'
  recommendation: BORDERLINE, lean include at routine priority (or hold to two sentences). Unseen by any fire. Roundup of Huntress's own incidents; the technique is commodity and the store has no generic
    ClickFix tradecraft entry, but the ClickFix-to-domain-controller chain and the cache-seeded 'for /r' launch give concrete hunts.
  related_entries:
  - 2026-10-04/chatgpt-custom-gpt-clickfix-sideloaded-in-memory-rat
  - 2026-11-13/huntress-teams-booking-device-code-phishing-encrypted-kit
  sources:
  - url: https://www.huntress.com/blog/the-evolving-tradecraft-of-clickfix
    publisher: Huntress
    date: '2026-11-10'
    role: primary
  discovery_trace: 'first seen at: huntress, feed https://www.huntress.com/blog/rss.xml (item ''Beyond the clipboard: The evolving tradecraft of ClickFix'', 2026-11-10) -> primary (no pivot needed): https://www.huntress.com/blog/the-evolving-tradecraft-of-clickfix'
  published_at: '2026-11-10'
  summary: 'Huntress''s SOC summarises how ClickFix is being used beyond a single pasted download command. Delivery runs through malvertising (typosquat of a legal-research service, SEO-poisoned LinkedIn
    lookalikes) and compromised legitimate sites, with a fake ''verify you are human'' turnstile and, newly, terminal output that mimics a verification process and even an error message that prompts a retry.
    Four chains are described. (1) An early-September incident where the pasted command unpacked a ZIP into a ProgramData folder with a batch file and a sideloaded DLL named like a certificate-enrolment
    control, ran native reconnaissance (nltest, net, whoami, findstr), planted a private key and a reverse SSH tunnel, then used WinRM to reach the primary domain controller, created a user and tried to
    add it to local administrators, and opened a second tunnel; earlier incidents used PsExec and SMBExec through administrative shares after a Matanbuchus or Potemkin loader. (2) A chain that rebuilds
    full executables from PNG pixel data after a signed Microsoft binary sideloads a rogue DLL. (3) A browser-cache-seeded chain on a compromised dental-practice site: a 17,635-byte file saved in the browser
    cache is found by a pasted cmd ''for /r'' loop over the Firefox, Chrome or Brave profile directory and run as a batch file. (4) MSI installers that drop a Node.js RAT dressed as an RMM tool, persisting
    through a Run key and calling out over a raw TCP port. The post carries IOCs (not reproduced) and generic advice: stop-the-paste training, execution control from user-writable paths, and chain detection;
    it says the variants come from unconnected actors, not one group.'
  region_nexus: global; no Swiss or European targeting stated
  primary_sector_nexus: 'indirect: any Windows desktop in any sector, including municipal and cantonal staff on work laptops'
  sector: cross-sector
