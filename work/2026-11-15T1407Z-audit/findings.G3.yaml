  exposure: Any managed Windows endpoint whose users can open a Run dialog or terminal and that allows execution from ProgramData, Temp or browser-cache paths; domain controllers reachable over WinRM from
    ordinary workstations.
  detection: 'Telemetry class: process-creation events with parent lineage plus registry and scheduled-task audit. Browser or explorer launching cmd/PowerShell with a pasted one-liner; cmd ''for /r'' enumerating
    a browser profile directory and copying a cache file to Temp as a batch file; a ProgramData folder with a sideloaded DLL beside a signed binary; nltest/net/whoami/findstr burst from a user context;
    new Run key plus scheduled task with identical names; WinRM from a workstation to a domain controller followed by a new local account; an SSH client or key file appearing under ProgramData with a new
    scheduled task. Post-incident check: look for the second tunnel and rogue accounts on the domain controller, not only the first host.'
  triage: 'Benign lookalikes: administrators running nltest/net during troubleshooting and legitimate WinRM management. Discriminators: parentage from a browser or the Run dialog, user context rather than
    an admin workstation, a ProgramData folder named with random hex, and the reverse SSH tunnel''s scheduled task.'
  defender_takeaway: Block execution from user-writable paths with application control, alert on browser-profile enumeration through cmd, restrict WinRM to admin hosts, and treat a ClickFix hit as a possible
    domain-controller lateral-movement case.
  extended_notes: Several Huntress ClickFix posts since August are already referenced in the store only indirectly; the Berlin Landesnetz entry carries campaign:terminalfix-clickfix-reverse-tunnel-2026,
    which is the closest ClickFix-to-tunnel precedent.
  borderline: true
  borderline_reason: roundup of the vendor's own earlier incidents on a commodity technique; value is the concrete DC-lateral and cache-seeded hunts; no Swiss, European or sector targeting stated
