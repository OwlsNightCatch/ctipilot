  published_at: '2026-11-11'
  summary: 'Proofpoint''s regional report covers July 2025 to September 2026 telemetry. Its stated findings: phishing detections up 4.5x year over year in Europe against 1.5x worldwide (3.2x per million
    inbound messages), 8.3 clicks per 100 delivered threat messages in Europe against 2.0 worldwide, callback phishing against European healthcare up 257%, and 64% of European organisations hit by ''precision''
    cloud attacks (phishing, session hijacking) showing impact against 33% for brute force. On state-aligned activity Proofpoint says South Asian actors (TA395 named) are widening into Western Europe and
    assesses that LLMs very likely accelerated their kit development; Russian actor TA488 has used half-click exploits against Outlook, Zimbra and other webmail, and Russian device-code and app-specific-password
    phishing (UNK_AcademicFlare) continued against government, education and think-tank targets in Europe in 2026; Chinese-aligned actors use webmail and browser exploitation and Evilginx-class adversary-in-the-middle
    kits and have widened to AI-policy targets. Cybercrime items include localised campaigns against freight and logistics, a French health-insurance portal impersonation, and TA2730, which targets retail
    investors in the UK, Switzerland, Germany and others with localised W-8BEN lures impersonating Swissquote, Binance and Interactive Brokers through a real-time phishing kit. It also reports exploitation
    attempts against open-source AI components (Langflow, LiteLLM) up 4.6x between consecutive 90-day windows. The figures are Proofpoint telemetry and are not independently corroborated.'
