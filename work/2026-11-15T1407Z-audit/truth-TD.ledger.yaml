    text: "The researcher's second exploit set, 4EverAble2Shell, chains Apache Axis CVE-2026-90436 with a root escalation, works against Hotfix 2 when the Legacy API is on and is exploited on at least 21 production servers per Huntback, with attempts recorded on Previdian's honeypot; N-able has no fix yet and says it has seen no signs of compromise."
  - claim_id: a1913b615c
