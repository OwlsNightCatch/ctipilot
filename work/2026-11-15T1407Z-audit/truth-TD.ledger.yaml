  - claim_id: 2ba22d0a9b
    entry: 2026-11-11/cve-2026-124194-outlook-forced-authentication-exploited-kev
    surface: "body"
    kind: derived
    text: "**Exposure:** every Outlook desktop below those builds; the build shows under File, Office Account, and the delivery path is mail or a download that carries a message file, which the user must open."
  - claim_id: d85000ec50
    entry: 2026-11-11/cve-2026-124194-outlook-forced-authentication-exploited-kev
    surface: "body"
    kind: derived
    text: "**Detection:** outbound connections to non-corporate addresses over SMB (TCP 445), WebDAV or HTTPS from OUTLOOK.EXE or from the user's session shortly after a message-file attachment is opened, authentication events carrying the user's identity toward an external address, and mail-gateway logs for message-file attachments from unknown senders."
  - claim_id: fb4de186d2
    entry: 2026-11-11/cve-2026-124194-outlook-forced-authentication-exploited-kev
    surface: "body"
    kind: derived
    text: "Because the credential material may already have been captured before the patch, the check also covers the weeks before it."
  - claim_id: 575f8fbc85
    entry: 2026-11-11/cve-2026-124194-outlook-forced-authentication-exploited-kev
    surface: "body"
    kind: derived
    text: "The disclosed material is the user's NTLMv2 hash, which can be cracked offline or used to impersonate the user, so also watch for later logons by the account from unfamiliar hosts."
  - claim_id: ebed1279a5
    entry: 2026-11-11/cve-2026-124194-outlook-forced-authentication-exploited-kev
    surface: "body"
    kind: derived
    text: "**Triage:** Outlook legitimately contacts SharePoint, OneDrive and corporate file servers; the discriminator is an external, non-corporate destination preceded by the opening of a message file."
  - claim_id: 2650f8470e
    entry: 2026-11-11/cve-2026-124194-outlook-forced-authentication-exploited-kev
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** install the November Office update now rather than in the normal cycle, because the flaw is exploited and a patched machine still leaves earlier captured credentials valid; reset the accounts of users whose Outlook reached an external destination."
  - claim_id: 071dc5ddd5
    entry: 2026-11-11/cve-2026-125350-chrome-xml-use-after-free-exploited-kev
