  - claim_id: bd79f22022
    entry: 2026-11-10/n-able-n-central-33-unpatched-flaws-public-pocs-offline
    surface: "summary"
    kind: frontmatter
    text: "An independent researcher published proof-of-concept code on 2026-11-08 and 2026-11-09 for what Huntress counts as 33 critical flaws in N-able's N-central remote monitoring and management appliance, and N-able released 2026.4 Hotfix 2 (build 2026.4.1.26) on 2026-11-10 with seven CVE ids; on-premises customers must upgrade their servers, then Agents and Probes. On 2026-11-12 the researcher published a second chain, 4EverAble2Shell, that pairs an Apache Axis 1.x flaw (CVE-2026-90436) with a separate root escalation and works against Hotfix 2 when the Legacy API is turned on and reachable: Huntback reports at least 21 production servers, 19 of them on Hotfix 2, running a cryptominer, Previdian's honeypot recorded attempts at the chain, and Huntress's latest guidance is that a Hotfix 2 server with the Legacy API disabled is not exposed to it. The same disclosure includes Agent2Shell, whose chains give an unauthenticated attacker who can reach the server SYSTEM commands on managed Windows endpoints and which N-able confirms also needs the Legacy API; N-able has published indicators of compromise for customers that have not disabled it, has no fix for the new claims and plans a follow-up hotfix; the Legacy API is off by default and keeping it disabled is the stated protection."
  - claim_id: 64b87f6778
    entry: 2026-11-10/n-able-n-central-33-unpatched-flaws-public-pocs-offline
    surface: "actions[0]"
    kind: frontmatter
    text: "Confirm on every on-premises N-central server, yours or your IT provider's, that the Legacy API is disabled and not reachable from the internet, and keep Hotfix 2 (build 2026.4.1.26) and the Agent and Probe upgrades in place; on any server that had the Legacy API on, check the web logs for POST requests to the Axis endpoint /dms/services/ServerUI carrying a SOAP fault and the host for a symlink at the N-central flag file path, and treat a hit as a full compromise, because Hotfix 2 does not fix the chain and 19 of the 21 compromised servers Huntback found already ran it."
