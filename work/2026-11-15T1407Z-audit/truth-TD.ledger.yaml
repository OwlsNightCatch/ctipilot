    entry: 2026-11-11/cve-2026-124194-outlook-forced-authentication-exploited-kev
    surface: "headline"
    kind: frontmatter
    text: "Outlook zero-day CVE-2026-124194 exploited: a crafted message file leaks authentication data; install the Office update"
  - claim_id: 4f72da5c2a
    entry: 2026-11-11/cve-2026-124194-outlook-forced-authentication-exploited-kev
    surface: "summary"
    kind: frontmatter
    text: "Microsoft's November 2026 Patch Tuesday fixes CVE-2026-124194, an Outlook spoofing flaw (CVSS 3.1 6.5) that Microsoft marks as exploited and not publicly disclosed and that CISA added to its Known Exploited Vulnerabilities catalog on 2026-11-10: a user who opens a crafted message file lets Outlook connect to an attacker-controlled location without the usual external-content warning, which can disclose authentication information. The Preview Pane is not an attack vector; BleepingComputer reports that the disclosed credential is the user's NTLMv2 hash, and no source names the actor or the victims."
  - claim_id: c1cad07b5f
    entry: 2026-11-11/cve-2026-124194-outlook-forced-authentication-exploited-kev
    surface: "actions[0]"
    kind: frontmatter
    text: "Install the November 2026 Office updates on every Outlook installation now (Office LTSC 2024 to 16.0.17932.21140, Office LTSC 2021 to 16.0.14334.21048, Microsoft 365 Apps through its update channel), then check proxy and firewall logs back to the earliest message-file delivery you can find for Outlook connections to external SMB, WebDAV or HTTP destinations, and reset the accounts of any user whose session authenticated to one."
  - claim_id: 8483cfbad7
    entry: 2026-11-11/cve-2026-124194-outlook-forced-authentication-exploited-kev
    surface: "cves[CVE-2026-124194]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-124194\", \"cvss\": \"6.5\", \"status\": [\"exploited\", \"cisa-kev\", \"patch-available\"], \"affected\": \"Outlook in Microsoft 365 Apps for Enterprise, Office LTSC 2024 before 16.0.17932.21140 and Office LTSC 2021 before 16.0.14334.21048\", \"fixed\": \"Office LTSC 2024 16.0.17932.21140; Office LTSC 2021 16.0.14334.21048; Microsoft 365 Apps through the Office security-update channel\", \"auth\": \"pre-auth\", \"vector\": \"user-interaction\"}"
  - claim_id: d92c4bcdca
    entry: 2026-11-11/cve-2026-124194-outlook-forced-authentication-exploited-kev
    surface: "body"
    kind: cited
    text: "Microsoft's November 2026 Patch Tuesday fixes CVE-2026-124194, an Outlook spoofing flaw (CWE-356, the product does not warn the user of an unsafe action) scored CVSS 3.1 6.5, which the Security Update Guide marks as exploited and not publicly disclosed ("
    urls: ["https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-124194"]
  - claim_id: 39f2d7fa7c
    entry: 2026-11-11/cve-2026-124194-outlook-forced-authentication-exploited-kev
    surface: "body"
    kind: cited
    text: "Microsoft's FAQ says an unauthenticated attacker sends a crafted message file and convinces the user to open it, whereupon Outlook may connect to an attacker-controlled network location without showing the usual external-content warning, \"potentially disclosing authentication information that could be used to impersonate the user\"; the Preview Pane is not an attack vector, so the file has to be opened ("
    urls: ["https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-124194"]
  - claim_id: fcefe90f4e
    entry: 2026-11-11/cve-2026-124194-outlook-forced-authentication-exploited-kev
    surface: "body"
    kind: cited
    text: "CISA added the flaw to its Known Exploited Vulnerabilities catalog on 2026-11-10 ("
    urls: ["https://www.cisa.gov/news-events/alerts/2026/11/10/cisa-adds-six-known-exploited-vulnerabilities-catalog"]
  - claim_id: 395d4c648a
    entry: 2026-11-11/cve-2026-124194-outlook-forced-authentication-exploited-kev
    surface: "body"
    kind: cited
    text: "), and BleepingComputer counts it as the one actively exploited zero-day of this Patch Tuesday ("
    urls: ["https://www.bleepingcomputer.com/news/microsoft/microsoft-november-2026-patch-tuesday-fixes-1-235-flaws-outlook-zero-day/"]
  - claim_id: 51b9356e13
    entry: 2026-11-11/cve-2026-124194-outlook-forced-authentication-exploited-kev
    surface: "body"
    kind: cited
    text: "The affected products are Outlook in Microsoft 365 Apps for Enterprise, Office LTSC 2024 (fixed in 16.0.17932.21140) and Office LTSC 2021 (fixed in 16.0.14334.21048); Microsoft 365 Apps take the fix through the Office security-update channel ("
    urls: ["https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-122310"]
  - claim_id: 9063f82494
    entry: 2026-11-11/cve-2026-124194-outlook-forced-authentication-exploited-kev
    surface: "body"
    kind: cited
    text: "BleepingComputer calls it an NTLM credential disclosure flaw: opening the attachment makes Windows connect to an attacker-controlled share and expose the user's NTLMv2 hash, which can be captured and cracked offline ("
    urls: ["https://www.bleepingcomputer.com/news/microsoft/microsoft-november-2026-patch-tuesday-fixes-1-235-flaws-outlook-zero-day/"]
  - claim_id: 2f518f3120
    entry: 2026-11-11/cve-2026-124194-outlook-forced-authentication-exploited-kev
    surface: "body"
    kind: uncited
