    surface: "body"
    kind: cited
    text: "**Exposure:** Chrome desktop below 157.0.8103.50, Chrome Extended Stable below 156.0.8078.96, Edge for Android below 157.0.4341.53, and any other Chromium-based browser (Edge desktop, Brave, Opera, Vivaldi) until its vendor ships the fix; the build shows in chrome://version or in the managed-browser inventory, and Google rolls the release out over days to weeks, so a pending relaunch leaves a patched machine still running the old code ("
