    entry: 2026-11-11/cve-2026-125350-chrome-xml-use-after-free-exploited-kev
    surface: "summary"
    kind: frontmatter
    text: "Google's Stable-channel update of 2026-11-09 says an exploit for CVE-2026-125350, a high-severity use-after-free in Chromium's XML component, exists in the wild; CISA added it to its Known Exploited Vulnerabilities catalog on 2026-11-10 and no source describes the attacks. The fix is in Stable 157.0.8103.50 (Linux) and 157.0.8103.50 or .51 (Windows, macOS) and in Extended Stable 156.0.8078.96, all of 2026-11-09, later Stable and Extended Stable builds of 2026-11-11 include it, and Microsoft's notes list the fix in Edge for Android 157.0.4341.53 while no Edge desktop release names it yet."
  - claim_id: 1deb7f0114
    entry: 2026-11-11/cve-2026-125350-chrome-xml-use-after-free-exploited-kev
    surface: "actions[0]"
    kind: frontmatter
    text: "Update Chrome to the current Stable build, 157.0.8103.78 or later (157.0.8103.50 is the first fixed build), and Extended Stable to 156.0.8078.100 or later on every managed endpoint, force the browser relaunch now, update Edge for Android to 157.0.4341.53, and install the Edge desktop and other Chromium-browser updates as soon as each vendor lists CVE-2026-125350 as fixed."
