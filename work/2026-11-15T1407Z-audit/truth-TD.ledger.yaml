    surface: "body"
    kind: cited
    text: "SAP Web Dispatcher and the Internet Communication Manager of NetWeaver AS ABAP share a memory corruption that could allow arbitrary code execution (CVE-2026-89126, note 3778556; CVE-2026-76964, note 3778530) ("
    urls: ["https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-120674", "https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-120656"]
