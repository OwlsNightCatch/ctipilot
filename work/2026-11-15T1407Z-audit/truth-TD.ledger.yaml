  - claim_id: a3268cf873
    entry: 2026-11-11/vates-xen-orchestra-vsa-2026-062-auth-bypass-exploited
    surface: "headline"
    kind: frontmatter
    text: "Xen Orchestra auth bypass is exploited: Admin and root on XCP-ng hosts; update xo-server to 5.213.1 or 5.211.2"
  - claim_id: 47c4c623e3
    entry: 2026-11-11/vates-xen-orchestra-vsa-2026-062-auth-bypass-exploited
    surface: "summary"
    kind: frontmatter
    text: "Vates advisory VSA-2026-062 of 2026-11-10 rates Critical an authentication bypass in Xen Orchestra and the Xen Orchestra Appliance, the web management plane for XCP-ng pools: a login cookie that parses to an empty object authenticates as the owner of the first stored token, giving Admin rights, code execution on managed pools and root on XCP-ng nodes. Vates says a threat actor is actively exploiting it; the fixes are xo-server 5.213.1 (latest channel) and 5.211.2 (stable channel), and no CVE id or CVSS score exists yet."
  - claim_id: c2a46665ca
    entry: 2026-11-11/vates-xen-orchestra-vsa-2026-062-auth-bypass-exploited
    surface: "actions[0]"
    kind: frontmatter
    text: "Update every Xen Orchestra and Xen Orchestra Appliance to xo-server 5.213.1 (latest channel) or 5.211.2 (stable channel) now, and until then keep its web and REST interface off every network but a dedicated management one."
  - claim_id: ec387e8f0d
    entry: 2026-11-11/vates-xen-orchestra-vsa-2026-062-auth-bypass-exploited
    surface: "actions[1]"
    kind: frontmatter
    text: "On every Xen Orchestra instance that was reachable from an untrusted network, search the XCP-ng hosts for the artefacts Vates lists (a VM whose platform parameter binds a file to the serial port, an unexpected VM, cron files written by the actor and the dynamic-linker preload file Vates lists), and where compromise is confirmed reinstall from scratch and rotate every secret the Vates stack held, because Vates says cleanup alone cannot guarantee the removal of backdoors."
  - claim_id: aa31377a91
    entry: 2026-11-11/vates-xen-orchestra-vsa-2026-062-auth-bypass-exploited
    surface: "body"
    kind: cited
    text: "Vates published advisory VSA-2026-062 on 2026-11-10, rated Critical, for Xen Orchestra and the Xen Orchestra Appliance (XOA), the web management plane for XCP-ng pools; no CVE id or CVSS score has been assigned ("
    urls: ["https://docs.vates.tech/security-advisories/advisories/2026/vates-sa-2026-062/", "https://www.bleepingcomputer.com/news/security/critical-xen-orchestra-auth-bypass-flaw-exploited-to-hijack-vm-servers/"]
  - claim_id: afb08b8ad5
    entry: 2026-11-11/vates-xen-orchestra-vsa-2026-062-auth-bypass-exploited
    surface: "body"
    kind: cited
    text: "Vates says a threat actor is actively exploiting the flaw, that an adversary can bypass authentication and act with Admin privilege, and that a compromise can lead to arbitrary code execution on managed pools and a full takeover of XCP-ng nodes as root ("
    urls: ["https://docs.vates.tech/security-advisories/advisories/2026/vates-sa-2026-062/"]
  - claim_id: 34a52df95a
    entry: 2026-11-11/vates-xen-orchestra-vsa-2026-062-auth-bypass-exploited
    surface: "body"
    kind: cited
    text: "The mechanism, per Vates: the REST cookie parser turns an authenticationToken cookie of j:%7B%7D into an empty object, the REST authentication path hands that object to the token provider without requiring a string, the token lookup treats it as unfiltered and returns the first token, and the provider authenticates as that token's owner if the token has not expired; the authenticated token-listing route then returns reusable login token ids ("
    urls: ["https://docs.vates.tech/security-advisories/advisories/2026/vates-sa-2026-062/"]
  - claim_id: 7ec9d6937e
    entry: 2026-11-11/vates-xen-orchestra-vsa-2026-062-auth-bypass-exploited
    surface: "body"
    kind: cited
    text: "Xen Orchestra before 6.9.2 (stable) and before 6.10.1 (latest) is affected, and the fixes are xo-server 5.211.2 on the stable channel and 5.213.1 on the latest channel; a source install must move to the latest master ("
    urls: ["https://docs.vates.tech/security-advisories/advisories/2026/vates-sa-2026-062/"]
  - claim_id: 265a190b55
    entry: 2026-11-11/vates-xen-orchestra-vsa-2026-062-auth-bypass-exploited
    surface: "body"
    kind: cited
    text: "BleepingComputer gives different release numbers, so check the installed xo-server version rather than the release label ("
    urls: ["https://www.bleepingcomputer.com/news/security/critical-xen-orchestra-auth-bypass-flaw-exploited-to-hijack-vm-servers/"]
  - claim_id: 91d89e7bd6
