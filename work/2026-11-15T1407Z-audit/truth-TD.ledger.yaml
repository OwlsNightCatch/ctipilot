    kind: derived
    text: "**Defender takeaway:** update internet-facing servers that serve HTTP/2 to 2.4.71 or the distribution's fixed package and restart, and where no fix is available yet remove h2 and h2c from Protocols until it is, because Red Hat describes an unauthenticated path and a public exploit while the project describes neither."
