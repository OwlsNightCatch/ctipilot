    text: "N-able released N-central 2026.4 Hotfix 2 (build 2026.4.1.26) on 2026-11-10 with seven CVE ids, which replaces the entry's statements that no fix, no CVE ids and no affected or fixed builds existed, and reports scanning activity associated with the public proof-of-concept code but no evidence of successful exploitation; on-premises servers must be upgraded and every Agent and Probe upgraded too."
  - claim_id: 9ea336d08b
