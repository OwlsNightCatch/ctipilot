    surface: "body"
    kind: cited
    text: "), and SAP Gateway activates its default access control list with high privileges, so an external attacker is treated as an internal application server (CVE-2026-89103, note 3798345) ("
    urls: ["https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-120662"]
  - claim_id: 025408d43a
    entry: 2026-11-10/sap-november-2026-cna-records-four-unauth-cvss-10-rows
    surface: "body"
    kind: cited
    text: "Onapsis, which found and reported the Web Dispatcher, ICM and Gateway flaws, names the first pair ICM2SHELL: a memory corruption in the shared kernel code that reassembles fragmented WebSocket messages, reachable on the HTTP or HTTPS port with no credentials, and \"WebSocket support is enabled by default, whether or not it is used\" ("
    urls: ["https://onapsis.com/blog/icm2shell-cve-2026-76964-cve-2026-89126-sap-netweaver-web-dispatcher-threat-advisory/"]
  - claim_id: 7ce7cc49b5
    entry: 2026-11-10/sap-november-2026-cna-records-four-unauth-cvss-10-rows
    surface: "body"
    kind: cited
    text: "Onapsis provided SAP a working unauthenticated code-execution exploit that runs commands as the system's <sid>adm user, a single connection crashes the process on every kernel it tested, and it has not observed attacks; NCSC Switzerland lists the exploitation status as unknown ("
    urls: ["https://onapsis.com/blog/icm2shell-cve-2026-76964-cve-2026-89126-sap-netweaver-web-dispatcher-threat-advisory/", "https://security-hub.ncsc.admin.ch/#/posts/13167"]
  - claim_id: 4becaf417c
    entry: 2026-11-10/sap-november-2026-cna-records-four-unauth-cvss-10-rows
    surface: "body"
    kind: cited
    text: "The fixed patch levels are 7.53 PL 1616 or 1617, 7.54 PL 710, 7.77 PL 914, 7.93 PL 401 or 420, 9.16 PL 111, 9.18 PL 37 and 9.20 PL 11 or 13 ("
    urls: ["https://onapsis.com/blog/icm2shell-cve-2026-76964-cve-2026-89126-sap-netweaver-web-dispatcher-threat-advisory/"]
  - claim_id: 9925ec3636
    entry: 2026-11-10/sap-november-2026-cna-records-four-unauth-cvss-10-rows
    surface: "body"
    kind: cited
    text: "ProxyGate lets an unauthenticated attacker with network access run operating system commands as `<sid>adm` on the Gateway, and its exploitability depends on the proxy access list: a permissive prxyinfo file, or none with gw/acl_mode_proxy at its default of 0, leaves the system exposed, so \"neither a version check nor patching alone tells you whether you are safe\"; on most releases SAP's fix combines the kernel patch with gw/acl_mode_proxy = 1, and Onapsis lists the minimum patch level for each kernel release, for example 7.53 PL 1625 and 7.54 PL 718 ("
    urls: ["https://onapsis.com/blog/proxygate-cve-2026-89103-sap-netweaver-gateway-threat-advisory/"]
  - claim_id: 4fd7c21b22
    entry: 2026-11-10/sap-november-2026-cna-records-four-unauth-cvss-10-rows
    surface: "body"
    kind: cited
    text: "**Exposure:** a system that runs one of the components and lets an untrusted network reach its Web Dispatcher, Internet Communication Manager, Gateway or SAML2 endpoint; the SAML2 flaw applies under certain configurations of the SAML 2.0 service provider ("
    urls: ["https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-120700"]
  - claim_id: e573466577
    entry: 2026-11-10/sap-november-2026-cna-records-four-unauth-cvss-10-rows
    surface: "body"
    kind: cited
    text: "**Detection:** Onapsis expects every exploitation attempt against ICM2SHELL to crash the ICM or Web Dispatcher at least once, so unexpected restarts of either process outside maintenance deserve investigation; requests with status 101 in the ICM or Web Dispatcher HTTP log show whether WebSocket is in use before anyone considers disabling it ("
    urls: ["https://onapsis.com/blog/icm2shell-cve-2026-76964-cve-2026-89126-sap-netweaver-web-dispatcher-threat-advisory/"]
  - claim_id: 0144fe6bc9
