    surface: "body"
    kind: uncited
    text: "SAP's November Patch Day of 2026-11-10 fixes four flaws that SAP scores CVSS 3.1 10.0, each reachable over the network without privileges or user interaction and with changed scope."
  - claim_id: 77d60eb5f0
    entry: 2026-11-10/sap-november-2026-cna-records-four-unauth-cvss-10-rows
