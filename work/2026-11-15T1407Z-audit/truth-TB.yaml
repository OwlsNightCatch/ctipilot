- entry: 2026-10-29/check-point-php2shell-sk1000302-portal-and-vpn-gateways
  verdict: imprecision
  findings:
  - code: F8
    claim_id: 891f6faff8
    where: '**Exposure:** line and cves[CVE-2026-109618/109619].affected (R82.20 listed as plainly exposed)'
    defect: Exposure and the CVE records treat every gateway on R81.20, R82, R82.10 and R82.20 with a portal or VPN feature in use as exposed; the sk1000302 hotfix note that R82.20 gateways already carry
      built-in IPS protection is dropped.
    ground_truth: 'sk1000302 Important Notes: "Check Point Firewalls R82.20 protect themselves through the Check Point IPS signatures "PHP Remote Code Execution" even when IPS is not enabled and HTTPS Inspection
      is not active on these Check Point Firewalls." (sk lastModified 2026-11-12)'
    ground_truth_url: https://support.checkpoint.com/results/sk/sk1000302
    fix: 'Add one clause to Exposure/Defender takeaway: Check Point states R82.20 gateways are protected by the built-in "PHP Remote Code Execution" IPS signature even with IPS disabled, so R82.20 is the
      lowest-risk release until the Jumbo take is installed (low severity; no source says the signature is a complete mitigation).'
  - code: F8
    claim_id: 0f23bbdafc
    where: '**Detection:** line'
    defect: Detection names only the dynamicCli.log wrapper check and refers to "the web-shell, listener and SSH-to-ESXi behavior above"; the exploitation-phase observables Check Point Research describes
      (bursts of segmentation faults in the Mobile Access portal Apache/PHP workers, PHP session files left by the exploit, the backdoor listening on all IPv4 interfaces) are not stated.
    ground_truth: 'CPR: "During the same window, the portal''s Apache/PHP workers experienced hundreds of segmentation faults, providing additional evidence of repeated exploitation attempts against the
      service."; "TSGA listens on all IPv4 interfaces" (TCP port 11072)'
    ground_truth_url: https://research.checkpoint.com/2026/php2shell-exploitation-on-check-point-gateway/
    fix: Add the behavioural signal (repeated crashes of the portal web workers on a gateway with Mobile Access, then a new listener on the gateway) to Detection without file names or hashes (low severity).
  length_note: main analysis 549 words (link text stripped); headline 112 chars - within bounds
