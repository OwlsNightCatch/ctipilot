- entry: 2026-11-07/cve-2026-111497-brotli-desigo-cc-mitel-openscape-cisco-duo
  verdict: imprecision
  findings:
  - code: F8
    claim_id: 5e0913c5b9
    where: summary, cves[CVE-2026-111497].fixed, affected_products, "Update - 2026-11-13T03:56:37Z" and its record summary (Apple release list)
    defect: Apple fix list stops at iOS/iPadOS, macOS, watchOS, visionOS and HomeView Software; Apple posted tvOS 27.2.1 on 2026-11-13 with the same Brotli entry, after the entry's last record, so tvOS
      is neither in the fix list nor in affected_products.
    ground_truth: 'Apple "About the security content of tvOS 27.2.1" (Released November 13, 2026): "brotli - Available for: Apple TV 4K 2nd generation and later - Impact: Processing maliciously crafted
      input may lead to memory corruption - Description: An out-of-bounds write issue was addressed with improved input validation. CVE-2026-111497"'
    ground_truth_url: https://support.apple.com/en-us/149721
    fix: Add tvOS 27.2.1 (Apple TV 4K 2nd generation and later, 2026-11-13) to the Apple fix list, the Exposure line and affected_products (Apple tvOS), via a changelog update.
  - code: F3
    claim_id: fc10fabc08
    where: body paragraph on Cisco ("version 1.12 of 2026-11-12"), Update 2026-11-13 ("now at version 1.12") and its record summary
    defect: The entry names Cisco advisory version 1.12 of 2026-11-12 as current; the advisory has since been revised.
    ground_truth: 'Cisco revision history: "1.13 Updated products under investigation, vulnerable products, and products confirmed not vulnerable. Summary and Affected Products Interim 2026-NOV-13" (1.12
      is 2026-NOV-12). Every Cisco statement the entry makes (PoC known, no malicious use, ISE/IOS XE/IOS XR/ASA/FMC/FTD not impacted, Duo Network Gateway 3.4.2, RoomOS fixes) still holds on v1.13.'
    ground_truth_url: https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-oct2026-node-js-Jj3SQ19u
    fix: Update the version/date to 1.13 of 2026-11-13 at the next changelog update (low severity; no fact changed).
  length_note: main analysis 549 words; headline 113 chars - within bounds
- entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
  verdict: imprecision
  findings:
  - code: F3
    claim_id: cd3db5794b
    where: actions[2] ("its eMudhra advisory (version 1.9)") and sourcing_note ("Cisco's advisory is at version 1.9")
    defect: Cisco's eMudhra advisory is named as being at version 1.9; it has been revised twice since the entry's last record. The products the action lists (IOS XE guide, ASA/FTD/FMC guidance, Secure
      Email updatenow, Duo Access Gateway 3.2.0, Duo Network Gateway 3.4.1, Duo Agentic Authorization Connector 1.0.1, ThousandEyes Application-hosting Agent 5.2.2) are all still listed.
    ground_truth: 'Cisco history: "1.11 Updated products under investigation, impacted, and not impacted. Affected Products Interim 2026-NOV-13; 1.10 ... 2026-NOV-12; 1.9 ... 2026-NOV-10". MDS 9000 and
      Nexus 3000/9000 now sit in the "Impacted Products with Software Fixes" table with bug IDs CSCwx45599/CSCwx36440, where the 2026-11-08 section reports "no remediation yet" (release strings not shown).'
    ground_truth_url: https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-emudhra-info-ScS22A1r
    fix: Cite version 1.11 (2026-11-13) and re-read the MDS 9000 / Nexus rows for the current remediation state (low severity).
  - code: F3
    claim_id: 5d2088cf79
    where: '"Update - 2026-11-11T03:55:02Z" ("Microsoft''s post carries an update of 2026-11-10") and the Defender takeaway citation "Microsoft, 2026-11-10"'
    defect: The Microsoft post is dated as an update of 2026-11-10; the post now carries an "Update (November 12, 2026)" note with the same content plus an extended product table (two days of drift; low
      confidence because the 2026-11-10 wording cannot be re-read).
    ground_truth: '"Update (November 12, 2026): ... Microsoft is removing the remaining eMudhra root certificates across its products and services, starting November 16, 2026." Table adds Azure CLI 2.93.0
      (11/16), VS Code 1.147.0 (11/18), .NET SDK December 2026, APIM self-hosted gateway.'
    ground_truth_url: https://www.microsoft.com/en-us/msrc/blog/2026/10/microsoft-response-to-compromised-emudhra-certificate-authority-keys
    fix: Date the note 2026-11-12 (or say the post was updated 2026-11-10 and again 2026-11-12) in the section and the Defender takeaway citation.
  - code: F5
    claim_id: 929351cfad
    where: Defender takeaway, last sentence ("Certificates from the eight revoked RSA G2B and G2C issuers are revoked and eMudhra says its subscribers were migrated")
    defect: A factual attribution to eMudhra with no inline citation in that sentence or its paragraph.
    ground_truth: 'eMudhra full incident report: "Subscriber migration arising from the RSA G2C revocations is complete." (Mozilla bug 2083449, comment 82, 2026-11-10)'
    ground_truth_url: https://bugzilla.mozilla.org/show_bug.cgi?id=2083449
    fix: Append the Mozilla bug 2083449 citation to the sentence (the claim itself is supported).
  - code: F14
    claim_id: 1c9bb3cb9b
    where: record summary of 2026-10-25T03:36:20Z ("removes four root CAs")
    defect: The record summary gives a count of four root CAs for Oracle's CVE-2026-114820 update; the body section says only "the impacted root CA certificates".
    ground_truth: 'Oracle: "providing Java updates that remove the set of impacted root CA certificates related to eMudhra" (no count). "Four" appears only as the four cacerts aliases (emsignrootcag1, emsignrootcag2,
      emsigneccrootcag3, comodoaaaca) in OpenJDK''s fallback instructions.'
    ground_truth_url: https://www.oracle.com/security-alerts/alert-cve-2026-114820.html
    fix: 'Low severity: record summaries are audit trail only; say "removes the impacted root CAs" if the record is ever amended.'
  - code: F11
    claim_id: null
    where: title and summary ("eight RSA intermediates were revoked ... ; browsers block them"; "Browsers and the Apple, Microsoft and Google trust stores block the intermediates")
    defect: (low confidence) "them" / "the intermediates" can be read to include the eight RSA G2B/G2C issuers, which the entry's own closing sentence says no read vendor page names or blocks.
    ground_truth: Google, Mozilla, Microsoft, Apple and tracker pages name only the eight ECDSA G3B/G3C intermediates; G2B/G2C appear only in the Mozilla bug and eMudhra's report (revoked 07 Nov 2026).
    ground_truth_url: https://emudhra.we-have-a-problem.com/
    fix: Say "browsers and platforms block the eight ECDSA intermediates; the eight RSA intermediates are revoked by eMudhra".
  length_note: main analysis 895 words (over the 550-word bound for a non-deep-dive entry); headline 112 chars - within bound. Six claims about superseded revisions (Cisco v1.1/v1.8, Apple 2026-10-30 page,
    OpenJDK 2026-10-21 wording) are marked unreadable in the claims file because no current page carries them.
- entry: 2026-10-23/fortinet-hardening-release-fortios-fortimanager-fortimail
  verdict: factual-error
  findings:
  - code: F4
    claim_id: ad4c246977
    where: cves[CVE-2026-126229].affected ("all 7.2 and 7.0") and .fixed ("7.2 and 7.0 migrate to a fixed release")
    defect: The record says all FortiAnalyzer/FortiManager 7.2 are affected with no fixed build and 7.2 must migrate. The advisory lists 7.2.0 through 7.2.12 as affected and gives 7.2.13 as the fix; only
      7.0 is told to migrate.
    ground_truth: 'FG-IR-26-244 table: "FortiAnalyzer 7.2 | 7.2.0 through 7.2.12 | Upgrade to 7.2.13 or above"; "FortiManager 7.2 | 7.2.0 through 7.2.12 | Upgrade to 7.2.13 or above"; Cloud 7.2 "7.2.1 through
      7.2.12 | Upgrade to 7.2.13 or above"; "FortiAnalyzer 7.0 / FortiManager 7.0 | 7.0 all versions | Migrate to a fixed release"'
    ground_truth_url: https://fortiguard.fortinet.com/psirt/FG-IR-26-244
    fix: 'affected: "... 7.4.0 through 7.4.11, 7.2.0 through 7.2.12 and all 7.0"; fixed: "8.0.2, 7.6.8, 7.4.12 or 7.2.13; 7.0 migrates to a fixed release".'
