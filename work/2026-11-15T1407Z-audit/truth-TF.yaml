entries:
  - entry: 2026-11-10/bluephishing-entra-agent-blueprint-consent-phishing-poc
    verdict: imprecision
    findings:
      - code: F4
        claim_id: b3d9ebb0c0
        where: "headline ('default users can soon create blueprints'), summary, Defender takeaway ('before the November 2026 default lets default Entra users create agent blueprints')"
        defect: "(low confidence) The entry frames Microsoft's default change as upcoming. The change was already rolling out when the entry was written (2026-11-10), and the entry names no control to restrict it."
        ground_truth: "Microsoft Message Center MC1506733 (published 2026-10-13, read on the mc.merill.net archive; the admin-center original is login-gated): 'Starting November 4, default users will be able to create new agent blueprints unless an administrator turns off Users can create agent blueprints.' Rollout: 'Beginning in early November 2026 and expected to complete by late November 2026.' Control path: Entra ID > Users > User settings > Default user role permissions. Proofpoint's 'from November 2026' is consistent with this, so the entry is faithful to its cited page but stale against the primary."
        ground_truth_url: "https://mc.merill.net/message/MC1506733"
        fix: "Say the default is rolling out from 2026-11-04 and completes by late November 2026, and name the 'Users can create agent blueprints' toggle as the restriction lever; or keep the Proofpoint-relayed wording and drop 'soon' / 'before'."
    length_note: null
  - entry: 2026-11-11/copperdragon-silentdelivery-fake-certificate-watering-holes
    verdict: imprecision
    findings:
      - code: F4
        claim_id: eec5b7a032
        where: "Triage: 'SoftEther is legitimate software, but not under a system-process name in a non-system path'"
        defect: "(low confidence) The path discriminator does not follow from the cited mechanism. Check Point says the DarkWire operators placed their tools in existing system paths, so a 'non-system path' test would not fire on their copies."
        ground_truth: "'To minimize their footprint, the operators deliberately avoided creating new directories on disk, instead placing their tools within existing system paths.' Observed paths include C:\\Windows\\debug, C:\\Windows\\System32, C:\\ProgramData\\vmware\\logs. SoftEther was 'renamed to names like vmtoolsd.exe and csrss.exe'; the page gives no path for those copies."
        ground_truth_url: "https://research.checkpoint.com/2026/not-all-that-glitters-is-gold-tracking-copperdragons-sparrow-framework-around-the-globe/"
        fix: "Make the discriminator the name/signer/parent mismatch (SoftEther binary or config under a system-process or VMware-tools name) and drop the 'non-system path' clause."
      - code: F11
        claim_id: null
        where: "techniques[]: T1003.001, T1056.001, T1021.001"
        defect: "(advisory, low confidence) Check Point supports all three, but the body never describes LSASS memory dumping (CopperLsass), the keylogger (CopperLogger) or RDP logons; the body is at 549 words."
        ground_truth: "Check Point: 'CopperLsass ... create a full LSASS memory dump'; 'CopperLogger, a Raw Input-based keylogger'; 'attempted to log in to several Windows machines over RDP'."
        ground_truth_url: "https://research.checkpoint.com/2026/not-all-that-glitters-is-gold-tracking-copperdragons-sparrow-framework-around-the-globe/"
        fix: "One clause naming each behaviour in the OceanGate/DarkWire sentence, or leave as is given the word bound."
    length_note: null
  - entry: 2026-11-11/ghostframe-esxi-post-exploitation-framework-tag-218
    verdict: imprecision
    findings:
      - code: F4
        claim_id: faf59f5eb1
        where: "Triage: 'a binary under /opt named vmhostd where the genuine daemon is vmware-hostd'"
        defect: "(low confidence) The on-disk binary is not named vmhostd. Insikt names the file vmhostd-core under /opt; vmhostd is the process name the implant presents."
        ground_truth: "'establishes persistence by copying itself to /opt/vmhostd-core' ... 'the implant appears as vmhostd, a name that resembles VMware's legitimate vmware-hostd daemon, by modifying its process name and command-line representation.' Mitigations: 'the presence of /opt/vmhostd-core or a vmhostd process'."
        ground_truth_url: "https://www.recordedfuture.com/blog/ghostframe-esxi-implant-settra-ransomware"
        fix: "'a vmhostd-core file under /opt, or a process presenting as vmhostd where the genuine daemon is vmware-hostd'."
      - code: F3
        claim_id: ecc6cc0554
        where: "body para 2: 'run the open-source VMkatz against VM memory snapshots, virtual disks or whole datastores to recover NTLM hashes, Kerberos tickets, SAM and LSA secrets and NTDS.dit data without running anything inside the guest'"
        defect: "(low confidence) Insikt's wording is interface-derived and hedged ('may be able to'; methods 'associated with'); the entry states the no-in-guest-execution outcome flatly and as recovered data."
        ground_truth: "'These methods are associated with NTLM hashes, WDigest credentials, Kerberos tickets, SAM and LSA secrets, and credential data from NTDS.dit. Together, these capabilities suggest that an operator controlling an ESXi host may be able to obtain credentials from hosted Windows systems without first deploying conventional credential-stealing malware inside each VM.'"
        ground_truth_url: "https://www.recordedfuture.com/blog/ghostframe-esxi-implant-settra-ransomware"
        fix: "'which Insikt says suggests an operator may be able to obtain guest credentials without first deploying credential-stealing malware inside each VM'."
    length_note: null
