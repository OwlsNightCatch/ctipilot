    surface: "record 2026-11-15T15:00:49Z"
    kind: record-summary
    text: "Sophos's advisory, now at version 5 of 2026-11-12, adds SD-RED firmware 3.0.012 as a manual patch for Sophos UTM (2026-11-10) and says end-of-life RED models get no fix; Ubuntu's tracker of 2026-11-14 lists most HWE, Azure, NVIDIA and Raspberry Pi variant kernels as fixed; Veeam's KB4966 of 2026-11-13 adds Recovery Orchestrator 13.1 and gives the delivery route per component; and Debian's current trixie security build is 6.12.117-1."
