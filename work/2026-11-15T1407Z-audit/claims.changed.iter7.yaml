    surface: "record 2026-11-15T14:53:24Z"
    kind: record-summary
    text: "VulnCheck reports two XWEB EVO flaws exploited by opportunistic scanners: the unauthenticated configuration write CVE-2026-124014 (CVSS 4.0 8.8) from 2026-11-12 and root-command probes against CVE-2026-124010 from 2026-11-13. It says the injection and backdoor flaws are fixed on the current firmware branch, so the unfixed exposure is the pre-2021 fleet plus the predictable-password flaws; its blog and its CNA record disagree on whether CVE-2026-124014 reaches 5.8.8."
