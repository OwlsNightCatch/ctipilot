    surface: "record 2026-11-15T15:05:50Z"
    kind: record-summary
    text: "Microsoft's post now carries an update dated 2026-11-12 whose table adds VS Code 1.147.0 (2026-11-18), Azure CLI 2.93.0 (2026-11-16), which removes two more eMudhra roots, the .NET SDK update in December 2026 and the API Management self-hosted gateway and Microsoft Build of OpenJDK after the Mozilla release of 2026-11-16 to the products that drop the eMudhra roots."
