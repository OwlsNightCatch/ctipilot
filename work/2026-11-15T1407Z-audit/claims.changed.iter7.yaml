    surface: "record 2026-11-15T15:02:13Z"
    kind: record-summary
    text: "Check Point says the operators placed their tools in existing system directories and renamed SoftEther VPN to system-process names such as vmtoolsd.exe and csrss.exe, so the name, not the path, is the discriminator."
