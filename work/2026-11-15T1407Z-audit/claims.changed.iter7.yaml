    entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
    surface: "record 2026-11-15T14:59:12Z"
    kind: record-summary
    text: "Ahsay's standard releases v9.17.0 (2026-11-12) and v10.3.6 (2026-11-02) list its patchset for both exploited CVEs and turn remote API access and the JSP engine off by default, so the fix no longer depends on the partner-only hotfixes, whose latest builds are v9.15.2.78 and v10.3.4.55 (2026-10-27); the current v10 build, v10.3.6.14 of 2026-11-13, also stops the Redirector logging the CBS password in readable form. CISA's catalog calls CVE-2026-105134 command injection, while Horizon3's source analysis shows a path-traversal file write."
