    entry: 2026-11-15/gentlemen-affiliate-vpn-no-mfa-da-gpo-locker-failed
    surface: "body"
    kind: cited
    text: "**Detection:** in KDC and authentication logs, RC4 or DES advertised against an AES-only account, bursts of SMB logon failures from one client (expired-password answers show valid credentials) and null-session logons with random sixteen-character workstation names followed by a dormant local account's logon on a legacy host; in directory change records, a new GPO linked enforced at the domain root or a Preferences task file written into SYSVOL outside the management console; on servers, a Run value named like a browser updater, `node.exe` fed its script on standard input by a `node.exe` parent, resolution of three or more public Ethereum RPC providers and antivirus preference changes that disable real-time monitoring ("
    urls: ["https://ransom-isac.org/blog/the-gentlemen-incident-locked-out/"]
  - claim_id: c5cd9e9b84
    entry: 2026-11-15/gentlemen-affiliate-vpn-no-mfa-da-gpo-locker-failed
    surface: "body"
    kind: cited
    text: "**Triage:** scanners and inventory tools also sweep SMB anonymously and legacy applications use null sessions (the finding is a dormant account logging on right after); developers resolve Ethereum RPC providers, so scope that rule to servers; administrators edit GPOs, so correlate with the change calendar ("
    urls: ["https://ransom-isac.org/blog/the-gentlemen-incident-locked-out/"]
