    surface: "body"
    kind: cited
    text: "**Defender takeaway:** Ransom-ISAC concludes that the actor needed one credential without MFA and one end-of-life server to reach Domain Admin ("
    urls: ["https://ransom-isac.org/blog/the-gentlemen-incident-locked-out/"]
