    entry: 2026-11-15/gentlemen-affiliate-vpn-no-mfa-da-gpo-locker-failed
    surface: "body"
    kind: cited
    text: "The call that declares the Preferences extension reached a domain controller the GPO had not replicated to, the script suppressed the error and no client read the task: antivirus was off estate-wide but the locker ran on one host, which wiped its logs ("
    urls: ["https://ransom-isac.org/blog/the-gentlemen-incident-locked-out/"]
