    entry: 2026-11-15/polinrider-forged-commits-npm-hijacks-fake-recruiter
    surface: "summary"
    kind: frontmatter
    text: "Apiiro found the PolinRider loader in at least 7,609 GitHub repositories owned by 2,330 accounts, where stolen GitHub access force-pushes a copy of the owner's own commit, with the same author, message and date, plus a loader hidden after hundreds of spaces in a build configuration file. Sonatype found the same loader in 12 hijacked npm releases and JFrog in a fake employer's take-home test and scripted camera check; none relies on an npm install script, the server address is read from an Ethereum wallet, and removing the code does not revoke the access that pushed it."
