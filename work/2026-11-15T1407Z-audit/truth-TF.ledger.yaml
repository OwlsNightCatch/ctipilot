    kind: cited
    text: "), so MFA on every SSL-VPN account and retiring or isolating the legacy host with its dormant local administrator each remove a link; Ransom-ISAC advises that a GPO of this shape found in a domain be unlinked and deleted, with its Preferences task file, before hosts are cleaned or credentials rotated ("
