    entry: 2026-11-15/gentlemen-affiliate-vpn-no-mfa-da-gpo-locker-failed
    surface: "headline"
    kind: frontmatter
    text: "Ransom-ISAC: Gentlemen affiliate, VPN without MFA to Domain Admin in an hour; GPO locker likely lost a replication race"
  - claim_id: cc0694834b
    entry: 2026-11-15/gentlemen-affiliate-vpn-no-mfa-da-gpo-locker-failed
    surface: "summary"
    kind: frontmatter
    text: "Ransom-ISAC's incident-response report describes an early-August 2026 intrusion by a Gentlemen ransomware affiliate that began with an SSL-VPN account without MFA and reached Domain Admin in under an hour, most likely with credentials taken from an end-of-life Windows Server 2003 host that a dormant local administrator account opened, then used a Rust credential harvester and the EtherRAT implant. The locker's GPO disabled antivirus across the estate but the task that runs it most likely never reached clients because of a replication race, so the locker ran on one host; the report names the telemetry at each step. Single source, no victim named."
  - claim_id: 90c0b316c7
    entry: 2026-11-15/gentlemen-affiliate-vpn-no-mfa-da-gpo-locker-failed
    surface: "body"
    kind: cited
    text: "Ransom-ISAC reconstructs an early-August 2026 intrusion into a small company by a Gentlemen ransomware affiliate from forensic images of two domain controllers, event logs of 41 hosts and firewall logs ("
    urls: ["https://ransom-isac.org/blog/the-gentlemen-incident-locked-out/"]
  - claim_id: 1bb328b8bd
    entry: 2026-11-15/gentlemen-affiliate-vpn-no-mfa-da-gpo-locker-failed
    surface: "body"
    kind: cited
    text: "The actor then pushed a Rust credential harvester, which takes the DPAPI domain backup key, and EtherRAT, a Node.js implant that reads its command address from an Ethereum smart contract and never reached it; data left through the VPN tunnel over about two days of a weekend ("
    urls: ["https://ransom-isac.org/blog/the-gentlemen-incident-locked-out/"]
