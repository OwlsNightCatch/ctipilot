Update; WinCC OA V3.20 P17.1, BRAUMAT and SISTAR V8.2 Update 5, no fix planned for the SIMATIC Profiling Tool and no fix available for the other products added on 2026-11-10 (SSA-242944 products: Brotli disabled at the application or proxy layer and an IIS request-filtering rule on UMC; SSA-678870: knowledge-base mitigations for Teamcenter and Opcenter, a firewall block of Brotli for HyperLynx, PADS and Xpedition, none listed for Innexis, Insights Hub, PAVE360 and Simcenter); Gridscale X DSA V5.4, Gridscale X PSS®E V36.8.0; Industrial Edge: Data Flow Monitoring V3.0.18, Flow Creator Configurator V1.15.1 and four further configurators, Common Configurator no fix; Mitel: updates planned (OpenScape SBC V11R3.4.5, SESAP V2 R1.1.10, Contact Center V12R0FR8), none released; Cisco: fixes listed in its combined advisory for Duo Network Gateway 3.4.2 and RoomOS on-premises 11.41.2.3 and 26.7.4.3, not tied to one CVE; Apple (2026-11-09): iOS and iPadOS 27.2.1 and 26.7.3, macOS Golden Gate 27.2.1, macOS Tahoe 26.7.3, macOS Sequoia 15.8.3, watchOS 27.2.1, visionOS 27.2.1, HomeView Software 27.2 (2026-11-12); Cisco Nexus 3000 and 9000 Series in standalone NX-OS (Guest Shell): Guestshell 4.9 or NX-OS 10.3.11 (December 2026), 9.3.19, 10.5.7 and 10.7.1 (January 2027) or 10.4.9 and 10.6.5 (February 2027), not tied to one CVE; Apple tvOS 27.2.1 (2026-11-13)\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
