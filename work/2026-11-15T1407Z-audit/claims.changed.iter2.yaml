  - claim_id: 700748e528
    entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
    surface: "summary"
    kind: frontmatter
    text: "Huntress observed from 2026-10-07 23:20 UTC attackers chaining two AhsayCBS flaws, CVE-2026-105133 (authentication bypass) and CVE-2026-105134 (code execution as SYSTEM through the Replication Receiver API), against internet-exposed servers of the backup management console that managed service providers and system integrators mainly use, dropping JSP webshells and an XMRig cryptominer; Bitdefender MDR investigated three intrusions through the same chain, and CISA added both flaws to its Known Exploited Vulnerabilities catalog on 2026-10-14. Ahsay now says its earlier patches v9.15.2.59 and v10.3.4.0 did not fully address the flaws, so servers on them are still exposed; v9.17.0 of 2026-11-12, a standard release, carries Ahsay's patchset for both CVEs and turns remote API access and the JSP engine off by default, the v10 standard release v10.3.6 of 2026-11-02 lists the same patchset, the partner hotfixes v9.15.2.70 and v10.3.4.45 remain an option, and a server that was reachable before the fix needs a compromise check."
  - claim_id: b6b063fab7
    entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
    surface: "actions[0]"
    kind: frontmatter
    text: "Find every AhsayCBS server your organisation or your managed-service suppliers run, including those on v10.3.4.0 or v9.15.2.59, and install v9.17.0 on v9 or v10.3.6 on v10, or the partner hotfix (v9.15.2.70 for v7 to v9, v10.3.4.45 for v10), now, then reboot it; until then keep the management web interface behind a VPN or an allowlist of trusted addresses."
