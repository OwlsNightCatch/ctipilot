    entry: 2026-11-06/cve-2026-123158-openssh-musl-no-pam-password-bypass-sshole
    surface: "summary"
    kind: frontmatter
    text: "OpenSSH Portable 10.6p2 of 2026-11-05 works around CVE-2026-123158, a password-authentication bypass on Linux systems that use musl libc and run sshd without PAM, Alpine's default OpenSSH server and OpenWrt among them: a password of 257 to 1,024 bytes logs in to an account whose password field is *. NCSC Switzerland published an advisory the same day and has rated the flaw actively exploited since 2026-11-10; Alpine shipped fixed packages for every branch back to 3.16. CISA added the flaw to its Known Exploited Vulnerabilities catalog on 2026-11-09, and GreyNoise records hands-on logins on its gridpoints from 2026-11-07 that ended in a dropped Python implant; SANS ISC's sensors record attempts from 2026-11-05 and Previdian's from 2026-11-06, QNAP says its NAS systems are not affected, and no source reports a compromised production host."
