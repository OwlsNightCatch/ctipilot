    text: "Ahsay's standard releases now carry the fix: the release notes of v9.17.0 (2026-11-12) and v10.3.6 (2026-11-02) list its patchset for both exploited CVEs and turn remote API access and the JSP engine off by default, so the fix no longer depends on the partner-only hotfixes; the title, headline, summary, fixed versions, actions and takeaway now say so. CISA's catalog calls CVE-2026-105134 command injection, while Horizon3's source analysis shows a path-traversal file write."
