claims:
  - claim_id: 11aabf3805
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "headline"
    kind: frontmatter
    text: "PK Softech apparently kept Publica data it had promised in writing to delete; Tamedia says Akira holds about 100 GB"
  - claim_id: bad16c4df4
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "summary"
    kind: frontmatter
    text: "PK Softech AG, the software supplier of Publica and other Swiss pension funds, says unknown attackers used malware to reach part of its IT and that data must be assumed to have left; the Federal Prosecutor's Office is investigating and has added the case to its criminal proceeding against Akira. Tamedia reports that Akira holds about 100 GB and demands ransom, while PK Softech and the federal bodies say no concrete ransom demand reached them; Publica and several other funds say their insured persons' personal data has presumably left. Cantonal police warn that criminals could use leaked personal and financial data for investment-fraud calls."
  - claim_id: 54a5e2b17a
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "actions[0]"
    kind: frontmatter
    text: "Tell the helpdesk, HR and payroll teams of every body whose staff are insured with Publica (including the federal administration and the ETH domain) or with the Pensionskasse Stadt Zürich, which says data of its insured persons and pensioners was stolen, that AHV number, date of birth, address, salary and IBAN may now be known to criminals and must not count as proof of identity, and route requests that quote them, a request to change a payout account included, to a call-back on a known number; for staff insured with Pensionskasse Post, the Bernische Pensionskasse (which can neither confirm nor rule out that its insured persons' data left), the Ticino cantonal fund IPCT (which found data of about 1,800 of its insured persons on the attacked server and writes to all its insured because it cannot exclude more), the Pensionskasse der Stadt Zug (which reports an elevated but unconfirmed risk that its insured persons' data left), a fund administered or advised by Libera AG or the Bernische Lehrerversicherungskasse apply the same rule until those funds report the scope; also tell insured staff that cantonal police warn of investment-fraud calls from people who know their salary and pension details, which prove nothing about the caller."
  - claim_id: c16511653c
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "actions[1]"
    kind: frontmatter
    text: "If your organisation's pension administration, HR or payroll runs on PK Softech software, is being migrated to it or tested on it, or your staff are insured with Pensionskasse Post, ask the supplier or the fund in writing whether your data, test data included, was in the affected environment, project, test and migration copies included, and what it holds outside the productive system."
