    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-21T03:47:07Z"
    kind: cited
    text: "Tamedia's Tages-Anzeiger reported on 2026-10-20 that the Akira ransomware group stole about one hundred gigabytes of compressed pension fund data, that data on well over a hundred thousand current and former federal employees is affected, that special agents and elite soldiers could be identified from it, and that Akira now demands ransom (translated from German;"
    urls: ["https://www.tagesanzeiger.ch/akira-gruppe-alt-bundesraete-von-hacker-angriff-betroffen-181002064025"]
  - claim_id: f2a1e33984
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-21T03:47:07Z"
    kind: cited
    text: "Inside IT, summarising the investigation, adds that the data sets contain employer details of people who work under a cover identity for fedpol or the Federal Intelligence Service (NDB), that an internal assessment sees a danger to life and limb for individual persons, that the NDB is forgoing certain operations for now without recalling agents from abroad, that the State Secretariat for Security Policy has already seen first fraudulent contact attempts connected with Publica, and that State Secretary Markus Mäder set up a task force under the federal information security officer Anne Rivera (translated from German;"
    urls: ["https://www.inside-it.ch/datenleck-bei-publica-gefaehrdet-auch-sicherheitsbehoerden-20261020"]
  - claim_id: 821d2da577
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-21T03:47:07Z"
    kind: cited
    text: "It says the involved federal bodies assume Akira is responsible and that the group holds the data and threatens to publish or sell it if unpaid, and that at that date neither the Confederation nor Publica had confirmed the perpetrator or an alleged ransom demand ("
    urls: ["https://www.inside-it.ch/datenleck-bei-publica-gefaehrdet-auch-sicherheitsbehoerden-20261020"]
  - claim_id: f1638fc8af
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-21T03:47:07Z"
    kind: cited
    text: "Inside IT recalls that Akira was also behind the attack on a US subsidiary of the state-owned arms company Ruag a year ago, where Ruag paid the ransom, and that the Federal Prosecutor's Office, fedpol and the Federal Office for Cybersecurity warned in October 2025 of stepped-up Akira activity in Switzerland ("
    urls: ["https://www.inside-it.ch/datenleck-bei-publica-gefaehrdet-auch-sicherheitsbehoerden-20261020"]
  - claim_id: fc67fee2bc
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-21T03:47:07Z"
    kind: cited
    text: "Publica's page, updated on 2026-10-20, says it is still examining whether data left its holdings and whose, still has no indication that data was published on the darkweb, and has updated its list of questions and answers ("
    urls: ["https://www.publica.ch/de/cyberangriff-auf-softwarelieferanten"]
  - claim_id: f57ea57b73
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-22T03:47:53Z"
    kind: cited
    text: "Netzwoche updated its running story on 2026-10-21, relaying the paywalled article that Tamedia's Tages-Anzeiger published on 2026-10-20: the Federal Council and the security authorities now assume that data on practically all current and former employees of the Confederation and of federally affiliated bodies left, among them federal judges, former Federal Council members (the sitting members are said to be spared), intelligence-service staff, elite soldiers and cleaning staff (translated from German;"
    urls: ["https://www.tagesanzeiger.ch/akira-gruppe-alt-bundesraete-von-hacker-angriff-betroffen-181002064025", "https://www.netzwoche.ch/news/2026-10-08/bundespensionskasse-publica-meldet-datenabfluss"]
  - claim_id: f227a4555d
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-22T03:47:53Z"
    kind: cited
    text: "According to the paper, an on-site inspection at PK Softech on 2026-10-07 established the outflow of security-relevant federal data, and Publica's letter to its insured persons mentions neither Akira nor the ransom demand ("
    urls: ["https://www.netzwoche.ch/news/2026-10-08/bundespensionskasse-publica-meldet-datenabfluss"]
  - claim_id: 810c3ef191
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-22T03:47:53Z"
    kind: cited
    text: "This is one chain of reporting, and the article quotes no confirmation of the actor, the ransom demand or the scope from the Confederation, Publica or PK Softech ("
    urls: ["https://www.netzwoche.ch/news/2026-10-08/bundespensionskasse-publica-meldet-datenabfluss"]
  - claim_id: 49637d1430
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-23T03:40:13Z"
    kind: cited
    text: "Tamedia's Tages-Anzeiger reported on 2026-10-21 that PK Softech AG had confirmed in writing to Publica that it deleted the data, and that this apparently did not happen: its summary says the company reported in January that it had deleted the information on former Federal Councillors and agents, \"but this was false\" (translated from German;"
    urls: ["https://www.tagesanzeiger.ch/akira-hacker-erpressen-loesegeld-mit-publica-daten-654128340841"]
  - claim_id: 72c2dd6dd4
