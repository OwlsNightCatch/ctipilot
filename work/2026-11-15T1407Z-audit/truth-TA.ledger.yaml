    surface: "section 2026-10-23T03:40:13Z"
    kind: cited
    text: "). 20 Minuten reports the same sequence and notes that PK Softech received the data in 2019 in a migration for Publica ("
    urls: ["https://www.20min.ch/story/daten-gau-trotz-loeschbestaetigung-bundesdaten-landeten-bei-hackern-103653740"]
  - claim_id: d9bfe55eed
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-23T03:40:13Z"
    kind: cited
    text: "Inside IT also relays, from Tamedia, that the Federal Prosecutor's Office confirmed that data was extracted by the Akira ransomware group, which still threatens to publish or sell it; 20 Minuten writes that according to findings so far Akira stole the data ("
    urls: ["https://www.inside-it.ch/publica-wollte-pensionskassendaten-loeschen-lassen-20261022", "https://www.20min.ch/story/daten-gau-trotz-loeschbestaetigung-bundesdaten-landeten-bei-hackern-103653740"]
  - claim_id: a5900b9a57
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-23T03:40:13Z"
    kind: cited
    text: "This is a reported confirmation of the actor by an authority, but it reaches the reader second-hand through the paywalled Tamedia article: the Federal Prosecutor's Office is not quoted directly, and Publica's own page, in its entry of 2026-10-20, still says it is clarifying whether data of Publica left and whose ("
    urls: ["https://www.publica.ch/de/cyberangriff-auf-softwarelieferanten"]
  - claim_id: af1d5a21f2
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-23T03:40:13Z"
    kind: cited
    text: "The Ticino cantonal pension fund IPCT says through Corriere del Ticino, relayed by Ticinonline on 2026-10-20, that potentially all of its insured could be involved but that there is no evidence yet that their data was actually taken; it has filed a complaint with the Federal Prosecutor's Office and is preparing a letter to the insured warning of telephone and e-mail fraud ("
    urls: ["https://www.tio.ch/ticino/cronaca/1958050/informazioni-ticino-dati-ipct-attacco"]
  - claim_id: 2dd8bdd0d7
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-23T03:40:13Z"
    kind: cited
    text: "TicinoNews adds, from its own information, that a folder labelled IPCT with the data of a few hundred insured persons was on the supplier's server, while IPCT, which has about 27,000 affiliated persons, says it has no certainty yet that data of its insured is involved ("
    urls: ["https://www.ticinonews.ch/ticino/hackeraggio-casse-pensioni-centinaia-di-ticinesi-a-rischio-445085"]
  - claim_id: 01a35751a0
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-24T03:41:16Z"
    kind: cited
    text: "The Ticino cantonal pension fund IPCT has put numbers on its exposure in a letter of 2026-10-23 to its roughly 17,000 active insured and 10,000 pensioners ("
    urls: ["https://www.ipct.ch/Attacco-informatico-criminale-presso-un-fornitore-di-software-dell-IPCT-Lettera-inviata-a-tutti-gli-assicurati-IPCT-b03fe500?i=1"]
  - claim_id: 241fcc32f5
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-24T03:41:16Z"
    kind: cited
    text: "PK Softech told it in the late afternoon of 2026-10-14 that the authorities had established that personal data were taken from the supplier's servers, without saying which funds the data belonged to, and the fund's checks to date found among the documents on the attacked server data of about 1,800 persons, held there for two ongoing projects of spot checks and recalculations ("
    urls: ["https://www.ipct.ch/Attacco-informatico-criminale-presso-un-fornitore-di-software-dell-IPCT-Lettera-inviata-a-tutti-gli-assicurati-IPCT-b03fe500?i=1"]
  - claim_id: 2870e21ed7
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-24T03:41:16Z"
    kind: cited
    text: "About 1,700 are persons who left the fund through resignation or death in 2024 and 2025: surname, first name, postal address, date of birth, AHV number and insured number, the exit-benefit amount and the receiving fund with its bank account (IBAN), and the personal IBAN for about 50 who were paid out directly, with no e-mail address or telephone number ("
    urls: ["https://www.ipct.ch/Attacco-informatico-criminale-presso-un-fornitore-di-software-dell-IPCT-Lettera-inviata-a-tutti-gli-assicurati-IPCT-b03fe500?i=1"]
  - claim_id: 3b21f5aada
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-24T03:41:16Z"
    kind: cited
    text: "About 80 are insured persons on a disability pension whose passive pension data was being updated: name, date of birth, AHV number, insured number, passive insured salary, passive retirement assets, degree and start of invalidity, with no contact data ("
    urls: ["https://www.ipct.ch/Attacco-informatico-criminale-presso-un-fornitore-di-software-dell-IPCT-Lettera-inviata-a-tutti-gli-assicurati-IPCT-b03fe500?i=1"]
  - claim_id: b529fa4a99
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-24T03:41:16Z"
    kind: cited
    text: "The fund says it has no certain evidence that these data were taken but that it appears plausible, that savings capital and pensions of all insured are untouched, that the cantonal administration's IT centre hosting the fund's infrastructure was not breached, and that it filed a criminal complaint against unknown persons and was recognised as private plaintiff, while the Federal Prosecutor's Office and the federal police investigate ("
    urls: ["https://www.ipct.ch/Attacco-informatico-criminale-presso-un-fornitore-di-software-dell-IPCT-Lettera-inviata-a-tutti-gli-assicurati-IPCT-b03fe500?i=1", "https://www.tio.ch/ticino/attualita/1958742/dati-stati-cantone-istituto-ticino-attacco-pensioni-casse-previdenza"]
  - claim_id: 0ceced170a
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-24T03:41:16Z"
    kind: cited
    text: "It decided to send the letter to all insured because its information is partial, the analyses are still evolving and it may never have certainty, and it asks them to watch for unexpected e-mails, calls and messages over the coming weeks and never to disclose passwords, access data or personal data unless sure of the requester ("
    urls: ["https://www.ipct.ch/Attacco-informatico-criminale-presso-un-fornitore-di-software-dell-IPCT-Lettera-inviata-a-tutti-gli-assicurati-IPCT-b03fe500?i=1"]
  - claim_id: f1f30cee3f
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-24T03:41:16Z"
    kind: cited
    text: "The letter names PK Softech's other customers as Publica, large cantonal public funds such as Bern and Zurich and company funds such as Migros and Post, for hundreds of thousands of insured persons in total ("
    urls: ["https://www.ipct.ch/Attacco-informatico-criminale-presso-un-fornitore-di-software-dell-IPCT-Lettera-inviata-a-tutti-gli-assicurati-IPCT-b03fe500?i=1"]
  - claim_id: 64e2090483
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-25T03:37:54Z"
    kind: cited
    text: "The Federal Data Protection and Information Commissioner (EDÖB) says PK Softech notified it of the cyberattack on its IT infrastructure on 2026-10-08, that the affected pension funds also reported to it, that it started an informal preliminary inquiry at Publica on 2026-10-14 and that on 2026-10-22 it opened a formal investigation against PK Softech AG on suspicion of data-protection violations ("
    urls: ["https://www.edoeb.admin.ch/de/edoeb-leitete-nach-cyberangriff-auf-softwarelieferant-abklaerungen-ein"]
  - claim_id: 5dc63e3966
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-25T03:37:54Z"
    kind: cited
    text: "Its release states that data of several important occupational pension institutions, Publica among them, was exfiltrated in the attack; the investigation is to give an overall picture of the personal data the funds handed to the software supplier and to clarify the legal framework of those transfers, how they were actually implemented and the scope of the data that left, and the EDÖB gives no further information on pending proceedings ("
    urls: ["https://www.edoeb.admin.ch/de/edoeb-leitete-nach-cyberangriff-auf-softwarelieferant-abklaerungen-ein"]
  - claim_id: 310041a1ad
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-25T03:37:54Z"
    kind: cited
    text: "Der Bund relays the step and adds that besides Publica the pension funds of Migros, Post and the City of Zurich obtain software from PK Softech ("
    urls: ["https://www.derbund.ch/cyberangriff-auf-pk-softech-bund-eroeffnet-untersuchung-985784970943"]
  - claim_id: 7c70e95f73
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-25T03:37:54Z"
    kind: uncited
    text: "The release names neither the actor nor the number of insured persons."
  - claim_id: 05641b021a
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-30T03:55:40Z"
    kind: cited
    text: "Publica's own newsletter of 2026-10-22 says that the hacker group Akira is being associated with the attack, referring readers to the Federal Office for Cybersecurity's description of the group's methods, and that Publica filed a criminal complaint with the Federal Prosecutor's Office on 2026-10-15 ("
    urls: ["https://www.publica.ch/de/dokumente/newsletter-22102026-cyberangriff-was-wir-wissen-und-was-nicht"]
  - claim_id: add486ec9d
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-30T03:55:40Z"
    kind: cited
    text: "The same newsletter says Publica must assume that data left the supplier and that whether and to what extent Publica's personal data is among it is still being investigated ("
    urls: ["https://www.publica.ch/de/dokumente/newsletter-22102026-cyberangriff-was-wir-wissen-und-was-nicht"]
  - claim_id: f9d27d143b
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-10-30T03:55:40Z"
    kind: uncited
    text: "The ransom demand and the Federal Prosecutor's Office confirmation of the exfiltration by Akira remain press reports."
  - claim_id: 142f1c7d25
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-11-04T03:32:27Z"
    kind: cited
    text: "The Pensionskasse Stadt Zürich's foundation board suspended the introduction of PK Softech's administration system planned for early 2027 because of the supplier's cyberattack and will keep operating its existing system in 2027; it will decide whether, when and under what conditions to introduce a new system only once the attack and the possible data loss are worked through (translated from German) ("
    urls: ["https://www.inside-it.ch/pensionskasse-zuerich-sistiert-softwaremigration-20261103"]
  - claim_id: 0ad118106b
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-11-04T03:32:27Z"
    kind: cited
    text: "PK Softech, quoted by watson.ch, says it cannot rule out that non-pseudonymised data was temporarily present in project-related work, and the Federal Prosecutor's Office confirmed to watson.ch that a notorious extortion gang is behind the attack and has added the case to its criminal proceeding against the Akira group, open since April 2024 (translated from German) ("
    urls: ["https://www.watson.ch/schweiz/digital/705538861-pk-softech-ag-und-publica-ransomware-attacke-wirft-neue-fragen-auf"]
  - claim_id: 0f0f0f2a2d
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-11-08T14:03:55Z"
    kind: cited
    text: "The Bernische Pensionskasse's own notices say it does not know (2026-10-15) and can neither confirm nor rule out (2026-10-30) whether personal data of its insured persons left PK Softech; what it assumes, after the press reports of 2026-10-20, is that more data left the supplier than first thought (translated from German) ("
    urls: ["https://bpk.ch/hauptnavigation/cybervorfall"]
  - claim_id: c99f241eff
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-11-08T14:03:55Z"
    kind: cited
    text: "The NZZ's report of 2026-10-17 quoted the fund more broadly, as saying personal data must be assumed to have left ("
    urls: ["https://www.nzz.ch/wirtschaft/immer-mehr-betroffene-pensionskassen-die-daten-von-ueber-100-000-versicherten-koennten-nun-bei-cyberkriminellen-sein-ld.10035090"]
  - claim_id: 1b6819bfe7
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-11-08T14:03:55Z"
    kind: cited
    text: "Its notice also dates the supplier incident to 2026-09-29, says software that encrypts data (ransomware) was installed and that the data theft became known on 2026-10-08, and says BPK filed its own criminal complaint on 2026-10-19 (translated from German) ("
    urls: ["https://bpk.ch/hauptnavigation/cybervorfall"]
  - claim_id: 58c5fe49d8
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-11-08T14:03:55Z"
    kind: cited
    text: "A month after the attack watson.ch found no PK Softech entry on Akira's leak site, so the group's possession of the data and its demand still rest on press reports and the Federal Prosecutor's statement as relayed ("
    urls: ["https://www.watson.ch/schweiz/digital/705538861-pk-softech-ag-und-publica-ransomware-attacke-wirft-neue-fragen-auf"]
  - claim_id: 6f6cd458c6
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-11-08T14:03:55Z"
    kind: cited
    text: "Inside IT names the supplier's customers in its own voice; the AWP agency is its source only for PK Softech's statement ("
    urls: ["https://www.inside-it.ch/weitere-pensionskassen-pruefen-datenabfluesse-20261009"]
  - claim_id: e6f10b30f2
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-11-10T03:43:46Z"
    kind: cited
    text: "The Pensionskasse der Stadt Zug said on 2026-11-09 that its administration is outsourced to the consultancy Libera AG, which uses software from PK Softech; the fund says it was first informed of the incident in mid-October, believed it was not affected, and received only last week the information that data of its insured persons could be affected, an \"elevated risk\" that is not yet confirmed (translated from German) ("
    urls: ["https://www.inside-it.ch/auch-pensionskasse-zug-von-pk-softech-hack-betroffen-20261109"]
  - claim_id: 654e9c95e9
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-11-10T03:43:46Z"
    kind: cited
    text: "It says names, AHV numbers, birth dates, addresses and salary details, in part also phone numbers and e-mail addresses, were stored at the supplier, that it has informed its insured persons and the Federal Data Protection and Information Commissioner, that retirement assets are safe and that particularly sensitive data such as documents on incapacity to work or disability are not affected ("
    urls: ["https://www.inside-it.ch/auch-pensionskasse-zug-von-pk-softech-hack-betroffen-20261109"]
  - claim_id: d458f13f63
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-11-11T03:54:22Z"
    kind: cited
    text: "PK Softech said on its homepage on 2026-11-10, \"because of media speculation\", that no concrete ransom demand has reached it and that it has at no time contacted the attackers; its investigation continues ("
    urls: ["https://pksoftech.ch/de/newsreader/Information-zum-Cyberangriff-auf-die-PKSoftechAG"]
  - claim_id: b946e8b3fd
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-11-11T03:54:22Z"
    kind: cited
    text: "A spokeswoman of the State Secretariat for Security Policy told Keystone-SDA the same day that the federal bodies handling the incident know of no concrete ransom demand addressed to them and that the Confederation paid no ransom, that, as she put it, a demand to the supplier was \"not made concrete with an amount or deadline\" (translated from German), and that the Secretariat still has no indication that data from the attack was published on the darkweb; Publica said it also received no demand, is not in contact with the hackers and does not know whether other organisations or individuals are being extorted, which the Federal Prosecutor's Office is investigating ("
    urls: ["https://www.watson.ch/schweiz/datenschutz/664513749-nach-daten-klau-keine-loesegeldforderung-von-hackern-an-publica-softwarelieferan"]
  - claim_id: 388401d925
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-11-11T03:54:22Z"
    kind: uncited
    text: "This qualifies the press report that Akira demands ransom: watson.ch's headline and lead say no demand reached the supplier or the Confederation, while the spokeswoman's wording leaves a non-specific demand to the supplier open, and neither the supplier nor the federal authorities confirm a concrete demand, and the Akira attribution and the data volume remain press-sourced."
  - claim_id: 3bf57d6e3a
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-11-12T04:28:00Z"
    kind: cited
    text: "Publica's own page, in a correction headed \"Stand: 10.11.2026\", says that according to current knowledge the affected software supplier received general extortion letters immediately after the attack, which have not since been made concrete with an amount or a payment deadline; that the federal bodies involved know of no concrete ransom demand; that Publica received no demand itself and is in no contact with the attacker group; and that it knows of no case of persons demonstrably contacted or harmed and has no indication of publication on the darkweb ("
    urls: ["https://www.publica.ch/de/cyberangriff-auf-softwarelieferanten"]
  - claim_id: cdc543b8c8
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-11-12T04:28:00Z"
    kind: cited
    text: "PK Softech's own page of 2026-11-10 mentions no extortion letter and does not name the attackers ("
    urls: ["https://pksoftech.ch/de/newsreader/Information-zum-Cyberangriff-auf-die-PKSoftechAG"]
  - claim_id: 18d35a2abb
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-11-12T04:28:00Z"
    kind: cited
    text: "). watson.ch reports that PK Softech confirmed on enquiry that it ignores the prompt Akira left in its network to contact it through an anonymous chat and does not want to negotiate a ransom; watson's reading that the denials mean only that nobody opened the link, and that the firm and the Confederation knew early that Akira was behind the attack, is its own inference ("
    urls: ["https://www.watson.ch/schweiz/digital/929554930-bund-verschwieg-details-zu-ransomware-attacke-von-akira-das-wissen-wir"]
  - claim_id: c3e74c0a5b
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "section 2026-11-12T04:28:00Z"
    kind: cited
    text: "SRF reported on 2026-11-10, citing several sources, that the perpetrators demanded ransom and threatened to publish or resell the data, while PK Softech and Publica told SRF that no ransom demand reached them ("
    urls: ["https://www.srf.ch/news/schweiz/heikle-daten-gestohlen-hacker-fordern-loesegeld-nach-angriff-auf-publica-lieferantin"]
  - claim_id: f38696e5c5
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "record 2026-10-10T03:48:33Z"
    kind: record-summary
    text: "The supplier's customers are now named: the Bernische Pensionskasse (canton of Bern staff and three cantonal universities) says its supplier is the same company that serves Publica, the Bernische Lehrerversicherungskasse and Pensionskasse Post report the supplier incident, and Inside IT lists Migros-Pensionskasse and Syngenta Pensionskasse among the customers. None of the funds has confirmed which member data left."
  - claim_id: a5d5fdfb04
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "record 2026-10-13T03:38:20Z"
    kind: record-summary
    text: "Publica's own page of 2026-10-08 lists civil status and the IBAN among the data that could be affected and says its investigation indicates personal data of insured persons has presumably left. The AWP agency relays the software firm's position that it knows data left but not yet whether personal data is among it, that it may be business data, and that the volume is rather small."
  - claim_id: 81f7397d2d
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "record 2026-10-15T03:48:00Z"
    kind: record-summary
    text: "The Pensionskasse Stadt Zürich, the City of Zurich's pension fund, says on 2026-10-13 that it currently uses another provider, plans to move to PK Softech's system in early 2027 and is checking whether data from migration tests was affected. Publica's page says as of 2026-10-14 that it has no indications that data from the attack was published on the darkweb."
  - claim_id: 1b1c82eff0
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "record 2026-10-16T04:11:00Z"
    kind: record-summary
    text: "Cantonal police warn that criminals could use the leaked salary and pension data to phone insured persons with investment-fraud offers, SwissCybersecurity.net ties the warning to PK Softech, and the Zurich cantonal fund BVK says its PK Softech software runs in its own data centre so it is not directly affected; PK Softech can neither confirm nor rule out further affected customers, and the Ticino fund listed as a customer has made no statement."
  - claim_id: f9b5c80f72
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "record 2026-10-17T03:35:30Z"
    kind: record-summary
    text: "The Pensionskasse Stadt Zürich, the City of Zurich's pension fund, now says in its notice of 2026-10-15 that its inquiries indicate personal data of its insured persons and pensioners, handed to PK Softech as test data for a planned 2027 switch, was stolen, and that which fields were taken is still being clarified. Pensionskasse Post says in its notice of the same date that personal data did leave and no longer repeats its earlier anonymisation statement, though it is still unclear whether its insured persons' data is among it."
  - claim_id: 10acaaa5a7
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "record 2026-10-18T14:00:04Z"
    kind: record-summary
    text: "The 2026-10-10 update said each of the five pension funds Inside IT lists is checking with PK Softech for a possible data outflow; Inside IT says only some of them have so far announced such a check."
  - claim_id: 5d8e29958c
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "record 2026-10-20T03:39:20Z"
    kind: record-summary
    text: "SonntagsBlick reports, from a confidential federal information note, that the Confederation rates the incident as serious and says the security organs of the Confederation are particularly affected, which it glosses as the Federal Intelligence Service, the Defence Group and fedpol, that the Federal Council was briefed on 2026-10-14 and that the cantons were informed; the Finance Department confirms only the briefing. NZZ adds that the pension consultancy Libera AG is also affected, that the Bernische Pensionskasse now says it must be assumed personal data left, and that Publica ran no regular on-site audits at the supplier."
  - claim_id: cd4a00676f
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "record 2026-10-21T03:47:07Z"
    kind: record-summary
    text: "Tamedia reports, and Inside IT relays, that the Akira ransomware group holds about 100 GB of the pension data of well over 100,000 current and former federal employees, with employer details of staff under cover identity among it, and demands ransom; neither the Confederation nor Publica confirms the actor or the demand."
  - claim_id: 8e54eb9379
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "record 2026-10-22T03:47:53Z"
    kind: record-summary
    text: "Netzwoche, relaying Tages-Anzeiger, reports that the Federal Council and the security authorities now assume data on practically all current and former federal and federally affiliated staff left, federal judges and former Federal Council members among them, and that an on-site inspection at PK Softech on 2026-10-07 established the outflow of security-relevant data; neither the Confederation nor Publica has confirmed the actor, the demand or the scope."
  - claim_id: 5266f48158
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "record 2026-10-23T03:40:13Z"
    kind: record-summary
    text: "The supplier's written pledge to delete Publica's 2019 migration data was apparently not kept, Inside IT relays that the Federal Prosecutor's Office confirmed Akira exfiltrated data, though that is second-hand and neither the Confederation nor Publica has itself named the actor, and the Ticino cantonal fund IPCT says all its insured could potentially be involved but has no evidence yet that data was taken."
  - claim_id: 722605f3ff
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "record 2026-10-24T03:41:16Z"
    kind: record-summary
    text: "The Ticino cantonal fund IPCT says in a letter of 2026-10-23 that data of about 1,800 of its insured persons (about 1,700 who left in 2024 and 2025, with exit-benefit amounts and IBANs, and about 80 on disability pensions) sat on the attacked supplier server for two ongoing projects; it has no certain evidence the data were taken but finds it plausible, and it writes to all insured because it cannot exclude more."
  - claim_id: 3b6a4524a0
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "record 2026-10-25T03:37:54Z"
    kind: record-summary
    text: "The Federal Data Protection and Information Commissioner (EDÖB) opened a formal investigation against PK Softech on 2026-10-22, after an informal inquiry at Publica on 2026-10-14, and states that data of several pension funds, Publica among them, was exfiltrated; the investigation is to establish which personal data the funds handed to the supplier, on what legal basis, and how much left."
  - claim_id: 5cc3e07119
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "record 2026-10-30T03:55:40Z"
    kind: record-summary
    text: "The entry said that neither the Confederation nor Publica had named the actor. Publica's own newsletter of 2026-10-22 says the Akira group is being associated with the attack, and that Publica filed a criminal complaint with the Federal Prosecutor's Office on 2026-10-15; the summary, the sourcing note and the paragraph on the Akira reporting now say so, a population figure was trimmed from the analysis, and the demand and the Prosecutor's Office confirmation still rest on press reports."
  - claim_id: 5b36c122a8
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "record 2026-11-04T03:32:27Z"
    kind: record-summary
    text: "The Pensionskasse Stadt Zürich suspended its planned 2027 move to PK Softech's administration system; PK Softech, quoted by watson.ch, cannot rule out that non-pseudonymised data was temporarily present in project work, and the Federal Prosecutor's Office has added the case to its criminal proceeding against the Akira group."
  - claim_id: e49ed3c813
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "record 2026-11-08T14:03:55Z"
    kind: record-summary
    text: "The Bernische Pensionskasse's own notices say it does not know, and can neither confirm nor rule out, whether its insured persons' data left, and it assumes only that more data left the supplier than first thought, while the NZZ quoted it more broadly; its letter also says ransomware was installed at the supplier on 2026-09-29, and watson.ch found no PK Softech entry on Akira's leak site a month after the attack. Inside IT names the supplier's customers in its own voice, citing AWP only for PK Softech's statement, and the September 2025 deletion request is Publica's statement to watson.ch."
  - claim_id: 02435644c4
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "record 2026-11-10T03:43:46Z"
    kind: record-summary
    text: "The Pensionskasse der Stadt Zug, whose administrator Libera AG uses PK Softech software, said on 2026-11-09 that there is an elevated, not yet confirmed risk that its insured persons' data left the supplier, and has informed its insured persons and the Federal Data Protection and Information Commissioner."
  - claim_id: df367b70a3
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "record 2026-11-11T03:54:22Z"
    kind: record-summary
    text: "PK Softech and the State Secretariat for Security Policy said on 2026-11-10 that no concrete ransom demand reached the supplier or the federal bodies, that the supplier never contacted the attackers, that the Confederation paid nothing and that there is still no indication of publication on the darkweb, which qualifies the press report that Akira demands ransom."
  - claim_id: 9d1a78431f
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "record 2026-11-12T04:28:00Z"
    kind: record-summary
    text: "Publica's own page of 2026-11-10 says the supplier received general extortion letters immediately after the attack, never made concrete with an amount or payment deadline, while PK Softech's page names no letter; watson.ch reports that PK Softech ignores the negotiation-chat prompt Akira left in its network, and SRF's report of a concrete demand with a threat to publish remains unconfirmed by the supplier, Publica and the federal bodies."
  - claim_id: e961961e60
    entry: 2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack
    surface: "headline"
    kind: frontmatter
    text: "Danfoss AK-SM 800A: six unpatched pre-auth RCE flaws, Strict mode does not remove them; France blames IRGC"
  - claim_id: f3b813240d
    entry: 2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack
    surface: "summary"
    kind: frontmatter
    text: "Coopérative U, Intermarché and E. Leclerc confirmed a cyberattack on their refrigeration systems overnight on 11 to 12 October 2026, a remotely forced defrost at hundreds of French stores, and on 2026-11-09 France's foreign ministry attributed that campaign, and only that campaign, to the Iranian unit Shahid Kaveh. More followed: more than 115 stores in at least six more countries and the first German shops on 2026-11-02, altered cold-room settings at three sites of the French blood service through a supplier, and, per SRF on 2026-11-05, a Köniz butcher and three Volg stores in Switzerland. CERT-FR reports numerous compromises of Danfoss AK-SM and AK-SC controllers and of Copeland xweb and Dixell xweb, and NCSC Switzerland rates the activity actively exploited. On 2026-11-11 Midnight Blue reported six pre-authentication remote-code-execution flaws in all Danfoss AK-SM 800A firmware up to 5.3.2, with no CVE identifier or fixed version and no known exploitation (BSI); CCB says updating, new passwords and Strict mode are insufficient, so removing internet exposure comes first, and BACS's statement of 2026-11-10 that updates fix the known flaws predates the report and does not cover the six."
  - claim_id: 77cd5c82bc
    entry: 2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack
    surface: "actions[0]"
    kind: frontmatter
    text: "Find every Danfoss AK-SM and AK-SC, Copeland xweb and Dixell xweb refrigeration controller, and any other refrigeration controller with a remote management interface because not every second-wave site's vendor is confirmed, in facilities you own or that a contractor manages for you and take its management interface off the internet now, restoring access only through a secure VPN or protected network (filtering to the contractor's source addresses is an emergency stop-gap, and CERT-FR asks you to check your insurance conditions before cutting the contractor's data uplink); an end-of-life unit that gets no fixes needs replacing, because a factory reset leaves it vulnerable and probably compromised again."
  - claim_id: 451c50f45d
    entry: 2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack
    surface: "actions[1]"
    kind: frontmatter
    text: "On every such controller that was reachable from the internet, check the whole configuration, defrost ranges, alarm thresholds and notification recipients included, against the intended one, verify the actual temperatures and test that alarms reach staff; for a Danfoss unit that may have been taken over, restart it or otherwise factory-reset it, restore access only through a secure VPN or protected network and reconfigure it for service, then update its firmware, set the security level to Strict and replace the default and any weak passwords, which do not close the six unpatched AK-SM 800A flaws that Midnight Blue and CCB report, so the interface stays off the internet; change all credentials where compromise is suspected and check the devices attached to the controllers, as BSI advises; and on every Copeland or Dixell XWEB unit confirm the factory Admin password was changed and give each contractor a named account with an expiry date."
