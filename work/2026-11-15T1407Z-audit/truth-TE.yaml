- entry: 2026-11-09/llmjacking-stolen-cloud-keys-enable-model-services-resale
  verdict: imprecision
  findings:
  - code: F9
    claim_id: 9e8f28f38c, 9f7dbc0aab
    where: body paragraph 2 (LiteLLM /key/regenerate sentence) and Defender takeaway 'patch model gateways such as LiteLLM'; cves[] is empty
    defect: (low confidence) The cited GTIG post names CVE-2026-40217 for the LiteLLM /key/regenerate user-ID rebind that lifted virtual keys to PROXY_ADMIN; the entry drops the id, gives no fixed version, and does not say that the CVE record for that id describes a different LiteLLM flaw, so a reader cannot act on 'patch LiteLLM'.
    ground_truth: 'GTIG: "The actor exploited a user ID rebind vulnerability in the /key/regenerate endpoint (CVE-2026-40217) to elevate standard Virtual Keys into full PROXY_ADMIN master administrative credentials" and "ensuring rapid patching against privilege escalation and authentication bypass flaws (such as CVE-2026-40217)". CVE record CVE-2026-40217 (MITRE CNA, published 2026-04-10): "LiteLLM through 2026-04-08 allows remote attackers to execute arbitrary code via bytecode rewriting at the /guardrails/test_custom_code URI." An earlier store entry (2026-06-16/obsidian-security-a-three-cve-chain...) already carries this id.'
    ground_truth_url: https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models ; https://cveawg.mitre.org/api/cve/CVE-2026-40217 (read only)
    fix: 'Improvement record: name CVE-2026-40217 as GTIG''s reference, add a Contradiction line that the CVE record describes a different LiteLLM defect, and point to the earlier LiteLLM entry in references[]; no new claim needed.'
  length_note: null
- entry: 2026-11-11/qubole-vendor-aws-identity-assumes-integration-roles
  verdict: imprecision
  findings:
  - code: F14
    claim_id: 7894a3cb15, 562f4bdcaa
    where: summary "Inside each account the actor listed resources, read Secrets Manager ..."; body paragraph 2 "Inside each account the actor enumerated resources, read Lambda function configuration ..."
    defect: (low confidence) Absolute 'each account' for the in-account activity chain.
    ground_truth: 'Wiz: "Once inside multiple victim AWS environments, the threat actor enumerated resources, collected configuration and secrets, accessed S3 data, and validated additional credentials"; "Once inside an environment, the threat actor enumerated broadly across services"; only the S3 sequence is ''consistent across environments'' and whole-bucket downloads happened ''in some cases''. Sentra: ''More than a dozen organizations hacked'', ''Dozens of Qubole customers were impacted''.'
    ground_truth_url: https://www.wiz.io/blog/qubole-cross-account-access-abused-in-the-wild
    fix: Replace 'Inside each account' with 'Inside the affected accounts' / 'In the environments Wiz observed'.
  - code: F8
    claim_id: null
    where: Attribution / sourcing_note (publisher revision after the entry)
    defect: (low confidence) Wiz added an update on 2026-11-11 about a claim of responsibility, and BleepingComputer added an AWS statement the same day; neither is in the entry, whose attribution wording ('no tie to other reported activity') now omits that an actor has claimed it.
    ground_truth: 'Wiz: "Update, November 11, 2026: Catalin Cimpanu, of the Risky Business newsletter has reported that an actor calling themselves \"n0n\" has claimed responsibility for this intrusion." BleepingComputer "Update 11/11": AWS spokesperson: "AWS services were not compromised by this issue and operated as designed."'
    ground_truth_url: https://www.wiz.io/blog/qubole-cross-account-access-abused-in-the-wild ; https://www.bleepingcomputer.com/news/security/hackers-exploit-trusted-aws-access-to-breach-multiple-cloud-environments/
    fix: 'Update record (non-internal) only if the claim is judged worth carrying: ''a self-described actor, n0n, claimed the intrusion (reported via Risky Business; unverified)'' plus the AWS statement that its services were not compromised; otherwise note in sourcing_note.'
