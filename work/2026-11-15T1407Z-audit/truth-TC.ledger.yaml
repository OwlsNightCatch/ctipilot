    entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
    surface: "body"
    kind: cited
    text: "CVE-2026-105133, an improper-authentication flaw in the checkSysPwd function of the API, is used first to bypass authentication; CVE-2026-105134, in the /rps/api/json/UpdateReceivers.do endpoint of the Replication Receiver component, then gives code execution as NT AUTHORITY\\SYSTEM, after which the attacker configured a malicious receiver and dropped a JSP webshell into the directory the application serves ("
    urls: ["https://www.huntress.com/blog/ahsaycbs-flaws-exploit"]
  - claim_id: cd5bd10fd0
    entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
    surface: "body"
    kind: cited
    text: "BleepingComputer reports that the activity targeted at least five organizations on 7 October and that CVE-2026-105133 has a public exploit ("
    urls: ["https://www.bleepingcomputer.com/news/security/unpatched-ahsaycbs-flaws-exploited-to-deploy-webshells-mine-crypto/"]
  - claim_id: a430b72203
    entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
    surface: "body"
    kind: cited
    text: "Follow-on activity, per Huntress: commands spawned by the AhsayCBS service process fetch payloads over HTTP from cloud object storage into a Temp folder with curl and certutil; an XMRig Monero miner renamed to look like a Microsoft Edge binary runs as SYSTEM through a service that mimics the Edge updater and a renamed copy of the NSSM service manager; and a PowerShell script hides the miner while Task Manager is open ("
    urls: ["https://www.huntress.com/blog/ahsaycbs-flaws-exploit"]
  - claim_id: 7297bc0129
    entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
    surface: "body"
    kind: cited
    text: "The earlier patches did not close the flaws: public records had listed AhsayCBS up to 10.3.2 as affected ("
    urls: ["https://www.securityweek.com/unpatched-ahsaycbs-vulnerabilities-exploited-in-the-wild/"]
  - claim_id: 903a7b2f84
    entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
    surface: "body"
    kind: cited
    text: "), Huntress found on 2026-10-08 that 10.3.4 is also affected ("
    urls: ["https://www.huntress.com/blog/ahsaycbs-flaws-exploit"]
  - claim_id: 3303e899cc
    entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
    surface: "body"
    kind: cited
    text: "), and Ahsay's release notes for 10.3.4 list no security fix ("
    urls: ["https://www.ahsay.com/en/support/help-centre/release-notes/cbs/v10.3.4"]
  - claim_id: 9a0d74318b
    entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
    surface: "body"
    kind: cited
    text: "**Exposure:** AhsayCBS servers (on Windows a service run from cbssvcX64.exe or cbssvcX86.exe; Horizon3 shows the same chain on the Linux build, where the service runs as root ("
    urls: ["https://horizon3.ai/attack-research/attack-blogs/ahsaycbs-cve-2026-105133-cve-2026-105134-technical-analysis/"]
  - claim_id: 9f55462d74
    entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
    surface: "body"
    kind: cited
    text: ")), whose management web interface is reachable from untrusted networks and that run a v7 to v10 build below the hotfixes v10.3.4.45 or v9.15.2.70, which includes v10.3.4.0 and v9.15.2.59 ("
    urls: ["https://www.ahsay.com/en/company/announcements/patch-cve-105133-105134-update", "https://www.huntress.com/blog/ahsaycbs-flaws-exploit"]
  - claim_id: f9ab58fb9d
    entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
    surface: "body"
    kind: cited
    text: "Huntress published four Sigma rules ("
    urls: ["https://www.huntress.com/blog/ahsaycbs-flaws-exploit"]
  - claim_id: 5471760e7d
    entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
    surface: "body"
    kind: cited
    text: "Horizon3's source-level analysis adds checks on the server itself: new .jsp files under webapps/rps, webapps/cbs or any served application directory, especially ones that answer 404 unless a specific parameter is supplied; replication receivers whose home directory sits under the install directory and that were created outside a change window (a \"Created new receiver\" entry in the system log); unexpected system administrator accounts and API logon entries for accounts nobody provisioned; and requests to the JSON .do endpoints or the receiver upload path that carry a FromServlet field or X-RSW-Request headers from untrusted sources ("
    urls: ["https://horizon3.ai/attack-research/attack-blogs/ahsaycbs-cve-2026-105133-cve-2026-105134-technical-analysis/"]
  - claim_id: fdfa967406
    entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
    surface: "body"
    kind: cited
    text: "Huntress's later forensics adds webshells hidden in an uploaded PNG, which leave no command parameter in access logs, a miner relaunched every minute by a SYSTEM scheduled task, Python started from a Run key, Defender exclusions covering the service process and, on a Veeam server, a WMI-launched PowerShell command reading its credential database ("
    urls: ["https://www.huntress.com/blog/ahsaycbs-webshells"]
  - claim_id: c3a3e0949a
    entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
    surface: "body"
    kind: cited
    text: "**Triage:** AhsayCBS legitimately spawns its own startup and maintenance commands, so a child process alone is weak; the discriminators Huntress gives are a child of the service that downloads files into a Temp folder, and an Edge-named binary run as SYSTEM from a Temp folder under a service that mimics the Edge updater ("
    urls: ["https://www.huntress.com/blog/ahsaycbs-flaws-exploit"]
  - claim_id: 31f543c78f
    entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** apply the hotfix v10.3.4.45 or v9.15.2.70 to every AhsayCBS server, including those on the earlier patches, and reboot it ("
    urls: ["https://www.ahsay.com/en/company/announcements/patch-cve-105133-105134-update"]
  - claim_id: c87e6d5312
    entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
    surface: "body"
    kind: cited
    text: "); ask your backup suppliers whether they run it, because the hotfixes sit behind a partner login, and until it is applied keep the management interface on trusted addresses or a VPN, since the exploit targets the externally reachable web application ("
    urls: ["https://www.huntress.com/blog/ahsaycbs-flaws-exploit"]
  - claim_id: fd90b829e5
    entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
    surface: "body"
    kind: cited
    text: "); where an indicator of compromise turns up, re-image the host from a trusted backup, since Huntress says attackers hid secondary backdoors for extended persistence ("
    urls: ["https://www.huntress.com/blog/ahsaycbs-flaws-exploit"]
  - claim_id: b77d198e92
    entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
    surface: "body"
    kind: derived
    text: "**Detection:** process-creation telemetry with parent lineage: children of the AhsayCBS service process (the CBS JVM on Linux) outside its normal startup and maintenance commands, because commands from an uploaded JSP webshell appear as direct children of the service, and curl or certutil from that lineage writing into a Temp folder; service inventory: a service named like the Edge update service running an Edge-named binary from a Temp folder as SYSTEM; PowerShell script-block logs: a script that checks for Task Manager and stops or starts a service to match; command lines that name WinRing0 next to a URL; and new .jsp files in the application directory."
  - claim_id: da16ab61fc
    entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
    surface: "section 2026-10-16T04:09:30Z"
    kind: cited
    text: "Ahsay now says its previous patches v9.15.2.59 and v10.3.4.0 \"did not fully address\" the two flaws, and tells partners to apply the AhsayCBS v10.3.4.45 hotfix on v10 and the v9.15.2.70 hotfix on v7, v8 and v9, both from the partner portal (a valid partner login is required), then to reboot the server ("
    urls: ["https://www.ahsay.com/en/company/announcements/patch-cve-105133-105134-update"]
  - claim_id: 9eb0bbf306
    entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
    surface: "section 2026-10-16T04:09:30Z"
    kind: cited
    text: "The announcement is dated 2026-10-12; Huntress, in an update of the same day to its report, dates the hotfix release to that day and says it independently verified that the v10.3.4.45 hotfix mitigates the initial entry point of the chain, which was still open on earlier v10 versions ("
    urls: ["https://www.huntress.com/blog/ahsaycbs-flaws-exploit"]
  - claim_id: b7857797ae
    entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
    surface: "section 2026-10-16T04:09:30Z"
    kind: cited
    text: "CISA added both flaws to its Known Exploited Vulnerabilities catalog on 2026-10-14 \"based on evidence of active exploitation\" ("
    urls: ["https://www.cisa.gov/news-events/alerts/2026/10/14/cisa-adds-four-known-exploited-vulnerabilities-catalog"]
  - claim_id: d98d5f6786
    entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
    surface: "section 2026-10-16T04:09:30Z"
    kind: cited
    text: "Bitdefender MDR reports three intrusions through the chain, the first two beginning around 7 to 8 October and a third identified on 14 October; in the first, attackers validated access through JSP webshells, staged PowerShell payloads, tried to stage payloads as command files in C:\\Users\\Public and tried to establish persistence; in the second they deployed JSP files, tried the same command-file staging, searched for stored credentials, elevated an account to SYSTEM and used obfuscated PowerShell to install and configure OpenSSH, which gives a way back that does not depend on the vulnerable web service, so patching alone does not end the incident; across its incidents the follow-on PowerShell scripts were staged on a subdomain of a public static-site hosting service; it attributes the activity to no named actor, and notes that the file names, tools and binaries differed from one incident to the next, so the dependable signal is how the server behaves after the exploit fires ("
    urls: ["https://www.bitdefender.com/en-us/blog/businessinsights/technical-advisory-ahsaycbs-exploitation-chain-cve-2026-105133-cve-2026-105134"]
  - claim_id: 806e23b8fb
    entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
    surface: "section 2026-10-18T03:34:00Z"
    kind: cited
    text: "Horizon3.ai published a source-level analysis of both flaws on 2026-10-14, working from the Linux installer, and says its proof of concept for the chain, from authentication bypass to a webshell, is on its GitHub ("
    urls: ["https://horizon3.ai/attack-research/attack-blogs/ahsaycbs-cve-2026-105133-cve-2026-105134-technical-analysis/"]
  - claim_id: 0a226b63c8
    entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
    surface: "section 2026-10-18T03:34:00Z"
    kind: cited
    text: "For CVE-2026-105133, every action of the JSON API extends a base class whose administrator password check is skipped when the request body carries a FromServlet flag that the caller sets, so the JSON API is reachable without credentials, and the AddSysUser action, which creates a system administrator, never consults the caller ("
    urls: ["https://horizon3.ai/attack-research/attack-blogs/ahsaycbs-cve-2026-105133-cve-2026-105134-technical-analysis/"]
  - claim_id: a82abd9387
    entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
    surface: "section 2026-10-18T03:34:00Z"
    kind: cited
    text: "For CVE-2026-105134, an authentication-bypassed call creates a replication receiver whose home directory the attacker chooses; the system-folder denylist that screens that directory at creation is not applied to the upload path later built from two attacker-supplied headers, in which only the percent and colon characters are escaped, so a traversal sequence walks the write location into a served web application, and one upload of a .jsp file then runs as LocalSystem on Windows and as root on Linux ("
    urls: ["https://horizon3.ai/attack-research/attack-blogs/ahsaycbs-cve-2026-105133-cve-2026-105134-technical-analysis/"]
  - claim_id: ac1e64a0de
    entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
    surface: "section 2026-10-18T03:34:00Z"
    kind: cited
    text: "Horizon3 says Ahsay released its hotfixes on 12 October 2026 ("
    urls: ["https://horizon3.ai/attack-research/attack-blogs/ahsaycbs-cve-2026-105133-cve-2026-105134-technical-analysis/"]
  - claim_id: fbc0dcee5b
    entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
    surface: "section 2026-11-10T03:45:06Z"
    kind: cited
    text: "Huntress's follow-up covers an organisation whose AhsayCBS servers were exploited between 8 and 11 October 2026, before Ahsay's hotfixes; Huntress verified that 10.3.4.45 blocks the entry point it saw and ties the intrusion to the first campaign by webshell location, an exploit source address and matching files ("
    urls: ["https://www.huntress.com/blog/ahsaycbs-webshells"]
  - claim_id: 18fa2289f4
    entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
    surface: "section 2026-11-10T03:45:06Z"
    kind: cited
    text: "The operator planted five JSP webshell families under the console's web application directories ("
    urls: ["https://www.huntress.com/blog/ahsaycbs-webshells"]
  - claim_id: 6d2528f99d
    entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
    surface: "section 2026-11-10T03:45:06Z"
    kind: cited
    text: "); Huntress reads the Linux-style copies, in directories such as /opt, /usr/local and /home, as showing that the exploit simply tried every likely location ("
    urls: ["https://www.huntress.com/blog/ahsaycbs-webshells"]
  - claim_id: a756de61cf
    entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
    surface: "section 2026-11-10T03:45:06Z"
    kind: cited
    text: "One family hides an AES-encrypted Java class in the least-significant bits of an uploaded PNG's pixels and runs it in memory, so no command parameter appears in access logs; another is a signed-API shell with command execution and chunked upload and download of up to 4 GB per file, a ready exfiltration channel on a backup host; a third can delete itself and any path it is given, so a missing file does not prove it was never there ("
    urls: ["https://www.huntress.com/blog/ahsaycbs-webshells"]
  - claim_id: c8d6f38dc1
    entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
    surface: "section 2026-11-10T03:45:06Z"
    kind: cited
    text: "Huntress also found a second XMRig miner kept alive by a SYSTEM scheduled task with a backdated start time that runs every minute, an embedded Python distribution under the SYSTEM profile started from a Run key whose wrapper only runs if a marker file named for the SHA-256 of the host's MachineGuid exists and which then loads a DLL whose strings are consistent with DNS-over-HTTPS lookups, the tunnelling tools gost and chisel, the remote access tools AnyDesk, Atera and Splashtop, a rogue local account, a Mimikatz package and Microsoft Defender exclusions that include the AhsayCBS service process ("
    urls: ["https://www.huntress.com/blog/ahsaycbs-webshells"]
  - claim_id: 6e44817125
    entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
    surface: "section 2026-11-10T03:45:06Z"
    kind: cited
    text: "On a Veeam server in the same environment it saw a command consistent with NetExec's Veeam credential-theft module, a PowerShell script launched through WMI that queried the VeeamBackup database for stored credentials and decrypted them; it cannot say how many credentials were retrieved, has not identified the implant family and cannot say what, if anything, was taken through the webshell's download action ("
    urls: ["https://www.huntress.com/blog/ahsaycbs-webshells"]
  - claim_id: ce55d4df3e
    entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
    surface: "section 2026-11-10T03:45:06Z"
    kind: cited
    text: "For any server exposed before the hotfix, Huntress recommends a full re-image from a trusted backup and rotating the credentials stored on or reachable from the server, including those saved in AhsayCBS and in any backup software on the same network ("
    urls: ["https://www.huntress.com/blog/ahsaycbs-webshells"]
  - claim_id: 766a3b7566
    entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
    surface: "record 2026-10-16T04:09:30Z"
    kind: record-summary
    text: "Ahsay says its previous patches v9.15.2.59 and v10.3.4.0 did not fully fix the flaws and names the hotfixes v10.3.4.45 and v9.15.2.70, available only to partners; Huntress verified the v10 hotfix, CISA added both flaws to its Known Exploited Vulnerabilities catalog on 2026-10-14, and Bitdefender MDR describes three intrusions through the chain. Hotfixes now cover v10 and v7 to v9, through the partner portal."
  - claim_id: 2373a65535
    entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
    surface: "record 2026-10-18T03:34:00Z"
    kind: record-summary
    text: "Horizon3.ai's source-level analysis of 2026-10-14 gives the root cause of both flaws (a caller-set flag that skips the administrator credential check, and an upload path that escapes the folder denylist), shows the chain runs as root on Linux, and lists server-side hunt artifacts: new .jsp files in served application directories, replication receivers created outside a change window, unexpected system administrator accounts, and requests carrying the bypass field or the receiver upload headers."
