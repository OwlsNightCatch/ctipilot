- code: F4
  category: hallucinated-fact
  section: entries/2026-11-12/cve-2026-119618-apache-httpd-mod-http2-assign-headers-rce
  item: "Apache httpd mod_http2 main analysis, paragraph 'The upstream fix is 2.4.71 ...'"
  url_or_quote: "Debian's tracker lists apache2 2.4.71-1~deb12u1 for bookworm (DLA-4902-1) and 2.4.71-1~deb13u1 for trixie (DSA-6620-1) as fixed while forky is still vulnerable ([Debian Security Tracker, 2026-11-13](https://security-tracker.debian.org/tracker/CVE-2026-119618))"
  summary: "Supersession (4c-h). The undated main-analysis paragraph, which this fire edited for SUSE, still asserts forky is vulnerable. The Debian tracker read this iteration lists '| forky, sid | 2.4.71-1 | fixed |', and this fire's own section, cves[].fixed and actions[1] all say forky and sid are fixed. New evidence relative to the declined 2026-11-13 dated section: this is the main analysis, which a later fire is told to fix where it stands. Suggested fix: reword the clause to 'bookworm, trixie, and forky and sid (2.4.71-1) as fixed' in the main analysis; leave the dated 2026-11-13 section as the record of that reading."
- code: F3
  category: claim-not-supported
  section: entries/2026-10-23/fortinet-hardening-release-fortios-fortimanager-fortimail
  item: "Fortinet hardening release, opening paragraph (claim d366ad3ae1)"
  url_or_quote: "The advisories withheld until Patch Tuesday, published on 2026-11-10, state no exploitation, and NCSC.ch listed the status as unknown ([NCSC.ch, 2026-10-22](https://security-hub.ncsc.admin.ch/#/posts/13092))"
  summary: "(low confidence) Adjacency. The one citation ends a sentence that chains two facts: that the 2026-11-10 advisories state no exploitation and that NCSC.ch listed the status unknown. NCSC post 13092 was created 2026-10-22 and carries only 'Current exploitation status: UNKNOWN' about the October release; it cannot carry anything about the 2026-11-10 advisories. The first clause is supported by the PSIRT pages themselves (FG-IR-26-268 and FG-IR-26-244 each show 'Known Exploited No'), which are not cited in that sentence. Suggested fix: cite a PSIRT advisory (for example FG-IR-26-219) for the first clause and keep NCSC for its own clause."
- code: F8
  category: needs-more-research
  section: entries/2026-11-07/cve-2026-111497-brotli-desigo-cc-mitel-openscape-cisco-duo
  item: "Brotli flaw entry, Exposure and Defender takeaway versus the 2026-11-15T15:04:45Z section"
  url_or_quote: "**Exposure:** ... a Cisco Duo Network Gateway or RoomOS device that Cisco lists in its combined advisory, below the builds above, or an iPhone, iPad, Mac, Apple Watch or Vision Pro below the 2026-11-09 releases."
  summary: "(low confidence) The new section and cves[] carry Cisco Nexus 3000 and 9000 switches in standalone NX-OS with Guest Shell (bug CSCwx56979, fixed by Guestshell 4.9, which Cisco's table lists without a date, or by NX-OS releases due December 2026 to February 2027) and Apple tvOS 27.2.1 (2026-11-13). Neither the Exposure line nor the Defender takeaway names them: the takeaway lists Apple iPhone, iPad, Mac, Watch and Vision Pro installs and the Duo Network Gateway 3.4.2 update only. A Nexus owner or an Apple TV fleet reading the labelled lines would miss the new rows (HomeView Software 27.2 from the earlier update is also absent). Suggested fix: add the Nexus Guest Shell rows (Guestshell 4.9 is the only dated-nothing fix available now) and tvOS to Exposure and the takeaway."
- code: F8
  category: needs-more-research
  section: entries/2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
  item: "AhsayCBS entry, Defender takeaway and fixed fields name v10.3.6 as the v10 standard release"
  url_or_quote: "install v9.17.0 or v10.3.6, whose release notes list the patchset for both CVEs, or the latest partner hotfix v9.15.2.78 or v10.3.4.55"
  summary: "(low confidence) Ahsay's announcement listing (https://www.ahsay.com/en/company/announcements, the page used to date v10.3.6.1 and the hotfix advisory) lists v10.3.6.14 on 13 November, after the entry's newest v10 reference, and its release notes (v10.3.6.14, 13-Nov-2026) list Security fixes including 'Redirector logged CBS password in the access log in readable form'. The entry never mentions v10.3.6.14, so a v10 owner may stop at v10.3.6 or v10.3.6.1. The CVE fix itself is in v10.3.6 as stated; the point is the current v10 build and an access-log credential exposure a compromise check should also cover. Suggested fix: name v10.3.6.14 as the current v10 standard build (one clause, cited to its release notes)."
- code: F11
  category: editorial-advisory
  section: entries/2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
  item: "AhsayCBS headline"
  url_or_quote: "AhsayCBS chain exploited and in CISA KEV: standard releases v9.17.0 and v10.3.6 now patch both flaws"
  summary: "(advisory, low confidence) The release notes only list 'Ahsay Security Patchset for CVE-2026-105133 and CVE-2026-105134' and no third party has verified the standard releases (Huntress verified only the v10.3.4.45 hotfix), after Ahsay twice shipped incomplete patches. The body and summary hedge ('list', 'carries Ahsay's patchset'); the headline states the outcome as fact. Optional: 'now list a patchset for both flaws'."
