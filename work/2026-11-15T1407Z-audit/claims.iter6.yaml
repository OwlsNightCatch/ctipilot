  - claim_id: 27e5aec605
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "summary"
    kind: frontmatter
    text: "The private keys of eight eMudhra intermediate CA certificates were so weak that anyone could recover them and forge trusted HTTPS certificates for any site, and eMudhra's incident report of 2026-11-10 adds eight RSA intermediates revoked on 2026-11-07 because it cannot show their keys were handled as its policy requires. Browsers and the Apple, Microsoft and Google trust stores block the eight ECDSA intermediates, and Microsoft removes the remaining eMudhra roots from Windows, Edge and WebView2 from 2026-11-16. Software with its own trust store or no revocation checking stays exposed until updated (Go, GitLab, Python, Java, macOS command-line tools, SonicWall DPI-SSL, Cisco IOS XE and ISE), and no exploitation is reported."
  - claim_id: 9e872db0bc
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "actions[2]"
    kind: frontmatter
    text: "Apply Cisco's remediation now for the products its eMudhra advisory (version 1.11) lists with a fix or a procedure available: the CA-trust distrust guide for IOS XE and the guidance for Secure Firewall ASA, FTD and FMC, Secure Email Gateway and Secure Email and Web Manager (run the updatenow command where updates are manual), Duo Access Gateway 3.2.0, Duo Network Gateway 3.4.1, Duo Agentic Authorization Connector 1.0.1 and ThousandEyes Enterprise Agent (Application-hosting Agent 5.2.2)."
  - claim_id: fe3d5235de
