    text: "Google's Stable-channel update of 2026-11-09 says an exploit for CVE-2026-125350, a high-severity use-after-free in Chromium's XML component, exists in the wild; CISA added it to its Known Exploited Vulnerabilities catalog on 2026-11-10 and no source describes the attacks. The fix is in Stable 157.0.8103.50 (Linux) and 157.0.8103.50 or .51 (Windows, macOS) and in Extended Stable 156.0.8078.96, all of 2026-11-09, later Stable and Extended Stable builds of 2026-11-11 include it, and Microsoft's notes list the fix in Edge 157.0.4341.46 of 2026-11-09 and in Edge for Android 157.0.4341.53."
