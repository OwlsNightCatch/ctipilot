    text: "ARTEX in AWS: CloudWatch log searches for secrets, Cognito self-sign-up for credentials; hunt CloudTrail for both"
  - claim_id: f63a438f42
    entry: 2026-11-15/artex-aws-cloudwatch-log-secret-hunting-cognito-self-signup
    surface: "summary"
    kind: frontmatter
    text: "Datadog Security Labs reports that in October 2026 operators of the ARTEX agentic penetration-testing framework worked against several AWS environments with a focus on financial data: sessions opened with anonymous S3 reads, a stolen long-term IAM key drove CloudWatch Logs FilterLogEvents searches for company names, passwords and access keys, and where no key was held the agent self-registered in a public Cognito user pool and traded the tokens for AWS credentials. Datadog says the distributions it studied do not appear to carry a cloud playbook of their own, so the steps follow the model behind them."
  - claim_id: 73613c8f6a
    entry: 2026-11-15/artex-aws-cloudwatch-log-secret-hunting-cognito-self-signup
    surface: "body"
    kind: cited
    text: "Datadog Security Labs reports that in October 2026 operators of ARTEX, the agentic penetration-testing framework Microsoft ties to Storm-0940, worked against several AWS environments with a focus on financial data, and that every session it reviewed opened with unauthenticated S3 reads, which CloudTrail records with a userIdentity type of AWSAccount and an accountId of anonymous, calling GetObject, ListObjects and similar read APIs ("
    urls: ["https://securitylabs.datadoghq.com/articles/artex-agentic-attacks-aws-environments/"]
  - claim_id: d118eb149a
    entry: 2026-11-15/artex-aws-cloudwatch-log-secret-hunting-cognito-self-signup
    surface: "body"
    kind: cited
    text: "Where S3 hosted a web front end, the agent read build manifests and runtime configuration, and it requested objects named like placeholders just before bursts of key guesses ("
    urls: ["https://securitylabs.datadoghq.com/articles/artex-agentic-attacks-aws-environments/"]
  - claim_id: 9c44db7dd9
    entry: 2026-11-15/artex-aws-cloudwatch-log-secret-hunting-cognito-self-signup
    surface: "body"
    kind: cited
    text: "), the habit Wiz saw as a request for a path that should not exist before each fuzzing run ("
    urls: ["https://www.wiz.io/blog/artex-in-the-wild-storm-0940-expands-targeting-of-it-and-software-vendors"]
  - claim_id: e3b2b55e28
    entry: 2026-11-15/artex-aws-cloudwatch-log-secret-hunting-cognito-self-signup
    surface: "body"
    kind: cited
    text: "With a valid long-term IAM access key, the agent's most frequent call was CloudWatch Logs FilterLogEvents, always with a limit of 1,000 events: it first searched log text for the names of cryptocurrency firms, hedge funds and invoicing terms and, in a later session on 2026-10-20, for storage links, internal addresses, database references, passwords and AKIA-style access keys ("
    urls: ["https://securitylabs.datadoghq.com/articles/artex-agentic-attacks-aws-environments/"]
  - claim_id: 6869e843e1
    entry: 2026-11-15/artex-aws-cloudwatch-log-secret-hunting-cognito-self-signup
    surface: "body"
    kind: cited
    text: "Without a key, the agent self-registered in a public Cognito user pool, iterating against a PreSignUp Lambda that checked a tenant domain, then ran InitiateAuth, RespondToAuthChallenge, GetUser and GetTokensFromRefreshToken and traded the tokens for short-term AWS credentials, which CloudTrail shows under the CognitoIdentityCredentials role session name; some SignUp calls named the tool in the user agent ("
    urls: ["https://securitylabs.datadoghq.com/articles/artex-agentic-attacks-aws-environments/"]
  - claim_id: 0ce3d9f3da
    entry: 2026-11-15/artex-aws-cloudwatch-log-secret-hunting-cognito-self-signup
    surface: "body"
    kind: cited
    text: "It then tried read-only discovery calls such as ListBuckets, ListSecrets, DescribeParameters, ListTopics, DescribeLogGroups, GetRestApis, DescribeRepositories and ListFunctions, all of which failed because the identity pool's authenticated role was narrow ("
    urls: ["https://securitylabs.datadoghq.com/articles/artex-agentic-attacks-aws-environments/"]
  - claim_id: d92d6e31c9
    entry: 2026-11-15/artex-aws-cloudwatch-log-secret-hunting-cognito-self-signup
    surface: "body"
    kind: cited
    text: "Datadog found hundreds of internet-exposed ARTEX consoles, often in Mandarin, and says the distributions it analysed do not appear to carry a cloud methodology of their own, so the post-exploitation playbook depends on the model in use; some versions block .gov, .gov.cn, .edu and .edu.cn targets by default ("
    urls: ["https://securitylabs.datadoghq.com/articles/artex-agentic-attacks-aws-environments/"]
  - claim_id: b195ceae23
    entry: 2026-11-15/artex-aws-cloudwatch-log-secret-hunting-cognito-self-signup
    surface: "body"
    kind: cited
    text: "**Detection:** in CloudTrail and S3 access logs, anonymous read bursts that include requests for placeholder-named objects; FilterLogEvents calls with a fixed limit of 1,000 from a long-term user key; Cognito SignUp spikes with PreSignUp failures, followed by CognitoIdentityCredentials sessions issuing broad read-only discovery calls that end in access-denied errors; and instance-role credentials used from an address outside AWS, which Datadog lists among the unusual patterns to hunt ("
    urls: ["https://securitylabs.datadoghq.com/articles/artex-agentic-attacks-aws-environments/"]
  - claim_id: 7b92fb9512
    entry: 2026-11-15/artex-aws-cloudwatch-log-secret-hunting-cognito-self-signup
    surface: "body"
    kind: derived
    text: "**Exposure:** AWS accounts with long-term IAM access keys that may have leaked, applications whose public Cognito user pools allow self-registration with identity pools that vend AWS credentials to authenticated users, and S3 buckets that serve web front ends without authentication."
  - claim_id: 7e3a5f20cd
    entry: 2026-11-15/artex-aws-cloudwatch-log-secret-hunting-cognito-self-signup
    surface: "body"
    kind: derived
    text: "**Triage:** FilterLogEvents is a routine call for log tooling and engineers; the discriminator is a long-term user key searching log text for credentials, internal addresses or company names at a constant page limit, from an address that key does not normally use."
  - claim_id: d1f4af7ba0
    entry: 2026-11-15/artex-aws-cloudwatch-log-secret-hunting-cognito-self-signup
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** check which Cognito user pools allow open self-registration and what their identity pools' authenticated roles can read, rotate long-term IAM keys found in code or logs, and hunt CloudTrail for the sequences above; a narrow authenticated role is what stopped the Cognito path in the case Datadog describes."
