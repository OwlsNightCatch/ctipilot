  - claim_id: 4ba150db41
    entry: 2026-11-11/ghostframe-esxi-post-exploitation-framework-tag-218
    surface: "body"
    kind: cited
    text: "It copies itself to /opt/vmhostd-core, edits the ESXi boot script /etc/rc.local.d/local.sh and runs /sbin/auto-backup.sh to keep the change across reboots, masquerades as vmhostd, and about every five seconds disables the ESXi firewall and the execInstalledOnly control that restricts execution of unsigned binaries, so an administrator who re-enables them is undone ("
    urls: ["https://www.recordedfuture.com/blog/ghostframe-esxi-implant-settra-ransomware"]
  - claim_id: 7c6d9c0edb
    entry: 2026-11-11/ghostframe-esxi-post-exploitation-framework-tag-218
    surface: "body"
    kind: cited
    text: "Its command channel opens simultaneous TCP connections to one address on ports 53, 2222, 3389, 4444, 8443 and 9443, keeps the first that succeeds and retries after a random delay of 5 to 12 seconds, which Insikt notes is a network detection opportunity; the implant is mainly an in-memory shellcode loader ("
    urls: ["https://www.recordedfuture.com/blog/ghostframe-esxi-implant-settra-ransomware"]
  - claim_id: 8db24ca862
    entry: 2026-11-11/ghostframe-esxi-post-exploitation-framework-tag-218
    surface: "body"
    kind: cited
    text: "From the hypervisor the panel can list registered VMs, change power state, create or delete snapshots, enable VNC on a guest, run a SOCKS5 proxy for pivoting, intercept ESXi logins, and run the open-source VMkatz against VM memory snapshots, virtual disks or whole datastores which Insikt says may let an operator obtain NTLM hashes, Kerberos tickets, SAM and LSA secrets and NTDS.dit credentials without deploying malware inside each VM ("
    urls: ["https://www.recordedfuture.com/blog/ghostframe-esxi-implant-settra-ransomware"]
  - claim_id: d3828dbc93
    entry: 2026-11-11/ghostframe-esxi-post-exploitation-framework-tag-218
    surface: "body"
    kind: derived
    text: "**Detection:** in ESXi file-integrity and shell-audit telemetry, changes to local.sh, a process masquerading as the host daemon or an unexpected executable under /opt, and repeated firewall-off and execInstalledOnly resets; in network telemetry, six near-simultaneous SYNs from the hypervisor management address to one destination on those ports, and any outbound command traffic from a hypervisor; in vCenter and ESXi logs, snapshot creation or deletion, VNC enablement and power-state changes outside change windows; in datastore telemetry, reads of VM memory-snapshot and virtual-disk files by an identity that is not the backup service."
  - claim_id: dade68034d
    entry: 2026-11-11/ghostframe-esxi-post-exploitation-framework-tag-218
    surface: "body"
    kind: derived
    text: "**Triage:** administrators legitimately edit local.sh, create snapshots and use VNC; the discriminators are a firewall-off and execInstalledOnly loop, a /opt/vmhostd-core file or vmhostd process where the genuine daemon is vmware-hostd, and snapshot-file reads by a non-backup account."
  - claim_id: 3b12ed3ca5
