    text: "**Triage:** WinDivert is legitimate in VPN and firewall products, so the signal is a parent that is a sideloaded DLL or backdoor rather than the vendor's signed service; SoftEther running under a system-process name such as vmtoolsd.exe is not legitimate; a genuine Chrome SSL warning is never cleared by installing an MSI."
