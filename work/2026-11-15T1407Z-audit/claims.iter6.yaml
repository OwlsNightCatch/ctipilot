    kind: cited
    text: "On Macs, update to macOS 27.2.1, 26.7.3 or 15.8.3, which block them in the command-line tools; where that is not possible, remove emSign ECC Root CA - G3 from that file as Apple describes ("
    urls: ["https://support.apple.com/de-de/149555"]
