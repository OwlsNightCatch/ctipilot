    text: "VulnCheck, as CNA, published 14 CVEs on 2026-11-12 for XWEB EVO, the end-of-service Copeland and Dixell web supervisor for refrigeration and cold-chain equipment, seven of them scored CVSS 4.0 9.2 to 9.3: unauthenticated command injection that runs as root, a hard-coded Administrator password, and Administrator and root passwords computed from the device MAC address and date. VulnCheck's sensors recorded exploitation of an unauthenticated configuration write (CVE-2026-124014) from 2026-11-12 and root-command probes against CVE-2026-124010 from 2026-11-13, by opportunistic scanners it does not tie to the October refrigeration attacks. The injection flaws are fixed on the current firmware branch, while the password flaws reach the last firmware, 5.8.8, and stay unfixed because Copeland ended software support on 2026-03-16; Copeland tells operators to remove all XWEB EVO units from the public internet."
