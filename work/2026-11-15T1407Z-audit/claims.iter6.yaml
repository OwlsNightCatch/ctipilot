    entry: 2026-11-10/bluephishing-entra-agent-blueprint-consent-phishing-poc
    surface: "headline"
    kind: frontmatter
    text: "BluePhishing: a consented rogue Entra agent blueprint gives tenant access; Entra users get blueprint rights in November"
  - claim_id: 936dbba7ba
    entry: 2026-11-10/bluephishing-entra-agent-blueprint-consent-phishing-poc
    surface: "summary"
    kind: frontmatter
    text: "Proofpoint describes BluePhishing, a research proof of concept that extends OAuth consent phishing to Microsoft Entra Agent ID: a victim who consents to an attacker's multi-tenant agent blueprint gets a blueprint principal with an agent-creation permission that Proofpoint says cannot be revoked, and the attacker then creates agent identities, up to 250 per blueprint, that inherit the consented permissions, which Microsoft's documentation says neither the Entra portal nor Microsoft Graph shows. Proofpoint has identified no in-the-wild activity, and Microsoft 365 message MC1506733 says default Entra users can create agent blueprints from 2026-11-04, in a rollout due to complete by late November, unless an administrator turns that right off."
  - claim_id: fd7b8e3dd1
    entry: 2026-11-10/bluephishing-entra-agent-blueprint-consent-phishing-poc
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** review the tenant's user consent settings and permission classifications and decide whether default users keep the right to create agent blueprints, which Microsoft's change rolling out through November 2026 grants unless the Users can create agent blueprints setting is turned off ("
    urls: ["https://mc.merill.net/message/MC1506733"]
  - claim_id: ca751f37be
    entry: 2026-11-10/bluephishing-entra-agent-blueprint-consent-phishing-poc
    surface: "section 2026-11-15T15:03:29Z"
    kind: cited
    text: "Microsoft's Message Center item MC1506733 says that starting 2026-11-04 default users will be able to create new agent blueprints unless an administrator turns off \"Users can create agent blueprints\", with the worldwide rollout beginning in early November 2026 and expected to complete by late November 2026; the setting sits under Entra ID user settings, Default user role permissions, and users assigned the Agent ID Developer role keep the right regardless ("
    urls: ["https://mc.merill.net/message/MC1506733"]
  - claim_id: 9855918461
    entry: 2026-11-10/bluephishing-entra-agent-blueprint-consent-phishing-poc
    surface: "record 2026-11-15T15:03:29Z"
    kind: record-summary
    text: "Microsoft's message MC1506733 schedules the change that lets default Entra users create agent blueprints from 2026-11-04, with the rollout due to finish by late November, unless an administrator turns off the \"Users can create agent blueprints\" setting; the headline, summary and takeaway now give that schedule and name the setting as the lever."
