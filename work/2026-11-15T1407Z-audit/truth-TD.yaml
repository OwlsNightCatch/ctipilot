- entry: 2026-11-11/cve-2026-125350-chrome-xml-use-after-free-exploited-kev
  verdict: factual-error
  findings:
  - code: F4
    claim_id: 071dc5ddd5
    where: headline, summary, title ("Edge desktop and other Chromium browsers are still to follow"), cves[].affected/fixed, actions[0], Exposure, Defender takeaway, main-analysis sentence on Microsoft's
      Edge notes, update section 2026-11-12 and its record summary
    defect: 'Entry says: "Edge for Android fixed, Edge desktop pending"; "no Edge desktop release names it yet"; "Microsoft''s Edge release notes ... list no Edge desktop release that names the CVE and
      still say Microsoft is working on a security fix"; update section: "the newest Edge desktop release on the page is 157.0.4341.42 of 2026-11-05 and names no CVE". Publisher revision since the last
      record (2026-11-12T04:16Z): Microsoft''s Edge notes now list a desktop fix, and MSRC published its own record on 2026-11-13.'
    ground_truth: 'Edge security release notes now carry "## November 9, 2026 — Microsoft released the latest Microsoft Edge for Stable (Version 157.0.4341.46) ... The Chromium team reported that CVE-2026-125350
      has an exploit in the wild, and this update contains a fix for it." MSRC Security Update Guide API for CVE-2026-125350: releaseDate 2026-11-13T01:09:27-08:00, revision 1.1 2026-11-13T08:00:00-08:00
      "Added Microsoft Edge software to the Security Updates table", product "Microsoft Edge (Chromium-based)" productStatus "fixed", fixedBuildNumber "157.0.4341.46" and "156.0.4314.80".'
    ground_truth_url: https://learn.microsoft.com/en-us/deployedge/microsoft-edge-relnotes-security
    fix: 'Record an update/correction: Edge desktop Stable 157.0.4341.46 (and 156.0.4314.80 for the extended line) carry the fix; rewrite headline, summary, title, cves[].affected/fixed, action, Exposure,
      Defender takeaway and the Edge sentences accordingly; keep only other Chromium browsers (Brave, Opera, Vivaldi) as pending-vendor.'
  - code: F4
    claim_id: 655eaff3a6
    where: cves[CVE-2026-125350].cvss (null) and sourcing_note ("no CVSS score appears on the cited pages" / "Microsoft's Security Update Guide returned no record for the CVE")
    defect: cvss is null and the sourcing note says Microsoft has no record; Microsoft now has one with a score.
    ground_truth: 'MSRC SUG record CVE-2026-125350: baseScore "8.8", vectorString "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H", vectorStringSource "CISA ADP", cweList "CWE-416: Use After Free", issuingCna
      "Chrome" (released 2026-11-13).'
    ground_truth_url: https://api.msrc.microsoft.com/sug/v2.0/en-US/vulnerability/CVE-2026-125350
    fix: Set cvss 8.8 (CISA ADP via MSRC, 3.1) and correct the sourcing note; do not cite the API endpoint, cite the MSRC update-guide page for the CVE instead.
  - code: F3
    claim_id: d210291fc4
    where: '## Update — 2026-11-12T04:16:00Z, sentence on Edge desktop'
    defect: '(low confidence) "the newest Edge desktop release on the page is 157.0.4341.42 of 2026-11-05 and names no CVE": the current page has a Nov 9 desktop row 157.0.4341.46 that names the CVE; either
      Microsoft backfilled it after 2026-11-12 or the earlier read missed it.'
    ground_truth: '"## November 9, 2026 Microsoft released the latest Microsoft Edge for Stable (Version 157.0.4341.46) ... CVE-2026-125350 has an exploit in the wild, and this update contains a fix for
      it." (also "## November 13, 2026 ... Stable (Version 157.0.4341.57) ... CVE''s will be added as soon as available.")'
    ground_truth_url: https://learn.microsoft.com/en-us/deployedge/microsoft-edge-relnotes-security
    fix: Covered by the correction above; no separate edit needed once the entry is updated.
  length_note: Google Stable/Extended Stable builds, reporters, KEV 2026-11-10 (catalogue 2026.11.13), NCSC-CH "Actively Exploited", SecurityWeek, the 83/72 security-fix counts and the CVE-2026-125346 bug-sharing
    observation all verified.
