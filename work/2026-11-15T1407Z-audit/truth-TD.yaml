- entry: 2026-11-10/n-able-n-central-33-unpatched-flaws-public-pocs-offline
  verdict: imprecision
  findings:
  - code: F3
    claim_id: 96c0359e67
    where: '## Update — 2026-11-11T03:49:03Z, first sentence (and the summary clause "on-premises customers must upgrade their servers, then Agents and Probes")'
    defect: (low confidence) "every customer must upgrade Agents first and then Probes" presents the order as mandatory.
    ground_truth: 'N-able release notes: "All customers, both hosted and on-premises, must upgrade their Agents and Probes." and, separately, "To maintain uninterrupted Agent-to-Probe communication, upgrade
      Agents first, followed by Probes. If a Probe is upgraded first, Agent-to-Probe communication may be temporarily interrupted but will be restored once the Agents are upgraded." The order is a recommendation,
      only the upgrade itself is required.'
    ground_truth_url: https://status.n-able.com/2026/11/10/n-central-2026-4-hf2-release-notes/
    fix: Say customers must upgrade Agents and Probes, and that N-able recommends Agents first to avoid a temporary Agent-to-Probe interruption.
  - code: F11
    claim_id: null
    where: frontmatter evidence[] records 1 (Huntress) and 4 (Censys)
    defect: '(low confidence, advisory) Two evidence quotes are superseded states kept without their as-of context in the record itself: "As of November 9, 2026, N-able has published no mechanism detail,
      affected versions, or fixed versions." (disproved by Hotfix 2, build 2026.4.1.26, 2026-11-10) and "N-able said it has not seen active exploitation of the vulnerabilities as of November 9 at 15:15:00
      UTC." (disproved by the Huntback/Previdian exploitation reports of 2026-11-12). Both are verbatim on their pages and carry an as-of date, so they are accurate as quoted.'
    ground_truth: 'Release notes of 2026-11-10 give build 2026.4.1.26 and seven CVEs; BleepingComputer 2026-11-12: "researchers reporting at least 21 affected systems, including 19 running the company''s
      latest security update".'
    ground_truth_url: https://status.n-able.com/2026/11/10/n-central-2026-4-hf2-release-notes/
    fix: 'Optional: drop the two superseded quotes from evidence[] or leave them; no reader-facing statement is false.'
  length_note: 'Every other claim verified against fresh primaries (EUVD CNA records for all seven CVEs incl. CVSS 4.0 vectors, Huntress, Huntback, Previdian, N-able release notes, Tenable, Apache oss-security
    post, KEV catalogue 2026.11.13: none of the seven N-able CVEs nor CVE-2026-90436 listed; status.n-able.com shows no Hotfix 3 as of 2026-11-15). Main analysis 546 words (bound 550); title ~560 chars
    and summary ~1,350 chars are very long but not over any stated bound.'
- entry: 2026-11-10/sap-november-2026-cna-records-four-unauth-cvss-10-rows
  verdict: imprecision
  findings:
  - code: F3
    claim_id: c94f141892
    where: cves[CVE-2026-89126].affected
    defect: (low confidence) "WEBDISP 7.53, 7.54, 7.77, 7.93, 9.16, KERNEL 7.53, 9.18, 9.20, KRNL64UC 7.53, ..." lists only KERNEL 7.53, 9.18 and 9.20.
    ground_truth: 'SAP Patch Day table, note 3778556: "HDB 2.00, KRNL64UC 7.53, WEBDISP 7.53, 7.54, 7.77, 7.93, 9.16, XS_ADVANCED_RUNTIME 1.00, SAP_EXTENDED_APP_SERVICES 1, KERNEL 7.53, 7.54, 7.77, 7.93,
      9.16, 9.18, 9.20" (KERNEL 7.54, 7.77, 7.93 and 9.16 are also listed).'
    ground_truth_url: https://support.sap.com/en/my-support/knowledge-base/security-notes-news/november-2026.html
    fix: List KERNEL 7.53, 7.54, 7.77, 7.93, 9.16, 9.18, 9.20 as SAP does.
  - code: F3
    claim_id: 77dd095ea3
    where: cves[CVE-2026-89103].affected
    defect: (low confidence) "KRNL64NUC 7.22, 7.22EXT, KRNL64UC 7.22, 7.53, 8.04, KERNEL 7.22, 7.54, 7.77, 7.93, 9.16, 9.20, 9.21" omits KRNL64UC 7.22EXT and KERNEL 7.53 and 8.04.
    ground_truth: 'SAP Patch Day table, note 3798345: "KRNL64NUC 7.22, 7.22EXT, KRNL64UC 7.22, 7.22EXT, 7.53, 8.04, KERNEL 7.22, 7.53, 7.54, 7.77, 7.93, 8.04, 9.16, 9.20, 9.21".'
    ground_truth_url: https://support.sap.com/en/my-support/knowledge-base/security-notes-news/november-2026.html
    fix: Reproduce the SAP list in full.
  length_note: Main analysis 548 words (bound 550). All CVSS 3.1 10.0 scores/vectors, note numbers, Onapsis patch levels, exploit and no-exploitation statements, NCSC-CH status "UNKNOWN" and the five further
    Critical rows verified.
- entry: 2026-11-11/adobe-connect-apsb26-191-five-unauthenticated-cvss-10-rows
  verdict: imprecision
  findings:
  - code: F3
    claim_id: 01f2d8341f
    where: headline
    defect: (low confidence) "five unauthenticated CVSS 10.0 flaws fixed in 12.12.a and earlier" reads as if builds up to 12.12.a are the fixed ones.
    ground_truth: 'Bulletin: Affected Versions "Adobe Connect 12.12 and earlier (Windows)"; Updated versions "12.12.a, 12.11.i, 12.10.f, 12.9.a, 12.8.a" (12.12 itself is affected, 12.12.a is the fix).'
    ground_truth_url: https://www.adobe.com/trust/security/products/connect/apsb26-191
    fix: Reword, e.g. "affect Connect 12.12 and earlier; fixed in 12.12.a (and 12.11.i, 12.10.f, 12.9.a, 12.8.a)".
  length_note: CVE ids, CVSS scores/vectors (5 x 10.0 PR:N/UI:N; 121902 9.4; 121355 9.1), 24-CVE count, priority 2, no-exploit statement verified on the bulletin HTML table (the plain-text extraction drops
    the CVE ids; read from raw HTML).
