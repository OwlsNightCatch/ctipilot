- entry: 2026-11-12/cve-2026-119618-apache-httpd-mod-http2-assign-headers-rce
  verdict: factual-error
  findings:
  - code: F4
    claim_id: 38923cb9b9
    where: main analysis ("and SUSE lists the issue as pending"), actions[0] ("where no fixed package exists yet, as on Debian forky and SUSE, remove h2 and h2c ..."), update section 2026-11-13 ("while
      SUSE lists the issue as pending")
    defect: SUSE is presented as having no fix; SUSE shipped fixed apache2 packages after the last record (2026-11-13T03:49Z).
    ground_truth: 'SUSE CVE page (last modified Sat Nov 14 20:56:22 2026) lists "SUSE-SU-2026:5231-1 ... published Sat Nov 14 17:03:56 CET 2026" (also 5234-1, 5235-1, 5236-1) and fixed packages "SUSE Linux
      Enterprise Server 15 SP7 ... apache2 >= 2.4.71-150700.4.30.1", "SUSE Linux Enterprise Server 16.0 ... apache2 >= 2.4.71-160000.1.1", "SLES 12 SP5-LTSS apache2 >= 2.4.66-35.87.1", "openSUSE Tumbleweed
      apache2 >= 2.4.71-1.1"; table status "Released" for openSUSE Leap 15.4 and 15.6, "Affected"/"In progress" for other products (the page headline still reads "Overall state of this security issue: Pending").'
    ground_truth_url: https://www.suse.com/security/cve/CVE-2026-119618/
    fix: 'Record an update: SUSE released fixes on 2026-11-14 for SLE 15 SP7, SLE 16.0, SLES 12 SP5 LTSS and 15 SP4-SP6 LTSS lines, openSUSE Tumbleweed/Leap; remaining SUSE products stay pending; narrow
      the action to "no fixed package yet (Debian forky, remaining SUSE products)".'
  - code: F4
    claim_id: 1068585a2b
    where: actions[0]
    defect: Action names SUSE among platforms with no fixed package ("as on Debian forky and SUSE").
    ground_truth: 'Same SUSE page: fixed apache2 packages published 2026-11-14 for several SUSE products (see previous finding).'
    ground_truth_url: https://www.suse.com/security/cve/CVE-2026-119618/
    fix: Replace with "where your vendor has no fixed package yet (Debian forky, SUSE products still listed Affected)".
  - code: F9
    claim_id: 5f2bff3efd
    where: cves[CVE-2026-119618].cvss and body paragraph 1 ("Red Hat scores it CVSS 3.1 9.8")
    defect: 'Only the 9.8 scores (Red Hat, SUSE) are shown; the second authority score listed in the very pages cited is omitted: CISA-ADP rates the flaw 8.1 with attack complexity High, and its SSVC entry
      reads Exploitation none, Automatable no, Technical Impact total (2026-11-13).'
    ground_truth: 'Red Hat CVE page table "Base Score | Red Hat 9.8 | NVD N/A | cve.org 8.1" with "cve.org: CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H"; SUSE table "CNA (CISA-ADP) 8.1 | SUSE 9.8"; cve.org
      record CISA-ADP container dateUpdated 2026-11-14T04:56:47Z: baseScore 8.1, SSVC {"Exploitation":"none"},{"Automatable":"no"},{"Technical Impact":"total"}.'
    ground_truth_url: https://access.redhat.com/security/cve/CVE-2026-119618
    fix: 'State both scores (Red Hat/SUSE 9.8 AC:L; CISA-ADP 8.1 AC:H) and add a Contradiction line; the CISA SSVC "Exploitation: none" supports the no-exploitation framing.'
  length_note: Apache project page, Red Hat CVE page and both RHSAs (package versions 2.0.26-7.el9_9.1 and 2.0.29-5.el10_3.1), Debian (bookworm, trixie fixed; forky vulnerable), Ubuntu USN-9090-1, Alpine
    3.21-3.24, Wiz, Wordfence and the researcher repository verified. Main analysis 548 words (bound 550).
