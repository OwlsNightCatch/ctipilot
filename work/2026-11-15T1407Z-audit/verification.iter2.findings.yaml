  summary: "(low confidence) The clause attributes a 9 October notice to the BPK and ends in the AWP citation; the notice of 9 October is on https://bpk.ch/hauptnavigation/cybervorfall, which this clause does not cite (the next clause does). AWP carries only the same-company fact and 'Cyberangriff von Ende September'. Suggested remediation: cite the BPK page after the notice clause and the AWP article after the same-company clause."
