  item: "2026-11-12/cve-2026-119618-apache-httpd-mod-http2-assign-headers-rce"
  url_or_quote: "where no fixed package exists yet, as on Debian forky and the SUSE products still in progress, remove h2 and h2c from the Protocols directive"
  summary: "Debian tracker (https://security-tracker.debian.org/tracker/CVE-2026-119618, read this iteration) lists 'forky, sid | 2.4.71-1 | fixed'; the do-now action (edited by this fire) and the main analysis ('forky is still vulnerable', labelled 2026-11-13) still name forky as lacking a fixed package. Suggested remediation: drop forky from the action and say in the main analysis that the tracker now lists forky and sid 2.4.71-1 as fixed (an `update` or `correction` record, fields actions and body)."
