  - claim_id: 51e85f6790
    entry: 2026-10-29/php2shell-trend-micro-apex-quest-kace-netapp-ontap
    surface: "summary"
    kind: frontmatter
    text: "Trend Micro posted Critical Patch build 7351 for Apex Central and build 20113 for Apex One Service Pack 1 on 2026-11-11, each upgrading PHP to 8.2.35 (the Apex One readme does not name the flaw), and its advisory, updated 2026-11-12, now names both patches and lists Mobile Security for Enterprise (due on 2026-11-17) and Deep Discovery Analyzer (due on 2026-11-18) as impacted, with critical patches for Deep Discovery Inspector and Email Inspector; Quest says all KACE SMA and SDA versions are affected, with SMA 15.0 CU5 and 15.1 CU2 and the SDA 9.3 hotfix out and advice to block ports 80, 443 and 52230 until applied; and NetApp's advisory lists ONTAP 9 as affected only by CVE-2026-109618, with attacker access as the www user restricted to the PHP jail and hotfix builds from 9.12.1P20HF1 to 9.19.1P4. NetApp says it is aware of public discussion of the vulnerability and none of the three vendors reports an exploited case on its page, although CISA lists both flaws as exploited."
  - claim_id: 13986d3bd4
    entry: 2026-10-29/php2shell-trend-micro-apex-quest-kace-netapp-ontap
    surface: "actions[0]"
    kind: frontmatter
    text: "Install Trend Micro's Apex Central Critical Patch build 7351 and Apex One Service Pack 1 Critical Patch build 20113 (both released 2026-11-11; the Apex One readme updates PHP to 8.2.35 without naming the flaw) on every server now and keep their consoles on administrator networks until done; for Mobile Security for Enterprise (patch due 2026-11-17, mitigation from Trend Micro support) and Deep Discovery Analyzer (due 2026-11-18) keep the interim mitigation until the patch ships; install the critical patches the table lists for Deep Discovery Inspector and Email Inspector."
