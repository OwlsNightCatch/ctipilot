claims:
  - claim_id: 3a03d46dd2
    entry: 2026-10-29/check-point-php2shell-sk1000302-portal-and-vpn-gateways
    surface: "headline"
    kind: frontmatter
    text: "Check Point gateways exploited (PHP2Shell, root escalation): Jumbo R81.20 t174, R82 t132, R82.10 t52, R82.20 t14"
  - claim_id: 73b7ea46df
    entry: 2026-10-29/check-point-php2shell-sk1000302-portal-and-vpn-gateways
    surface: "summary"
    kind: frontmatter
    text: "Check Point Research reports that from 2026-10-30 an attacker exploited unpatched Check Point gateways through the Mobile Access portal with PHP2Shell (CVE-2026-109618 and CVE-2026-109619), escalated to root with CVE-2026-123039 (CVSS 7.8, a local flaw in the dynamic_server process that Check Point says was exploited against a couple of dozen customers), installed a persistent backdoor and in the first wave deleted files on a VMware ESXi host. The fix for both is in Jumbo Hotfix Accumulator R81.20 take 174, R82 take 132, R82.10 take 52 and R82.20 take 14 or later, with none listed for R81.10 or R81, and the standalone PHP hotfix is not stated to cover CVE-2026-123039; sk1000302 itself carries no statement on exploitation."
  - claim_id: 25ad0f57f2
    entry: 2026-10-29/check-point-php2shell-sk1000302-portal-and-vpn-gateways
    surface: "actions[0]"
    kind: frontmatter
    text: "Install a Jumbo Hotfix Accumulator at or above R81.20 take 174, R82 take 132, R82.10 take 52 or R82.20 take 14 on every Check Point gateway, management server, log server, Multi-Domain server and Maestro, because it carries both the PHP2Shell fix and the fix for CVE-2026-123039, and until it is in apply the cp-httpd.conf mitigation and stop the dynamic_server process; replace R81.10 and R81 systems, for which no fix for CVE-2026-123039 is listed."
  - claim_id: 5454b9a4c3
    entry: 2026-10-29/check-point-php2shell-sk1000302-portal-and-vpn-gateways
    surface: "actions[1]"
    kind: frontmatter
    text: "On every gateway that ran Mobile Access, SSL Network Extender, SAML-realm VPN, the captive portal, UserCheck or Zero Phishing before the hotfix, search /var/log/dynamicCli.log for commands that do not use the legitimate Clish wrapper and the Mobile Access login-template directory for PHP files nobody deployed, and treat a hit as a compromise, because the implant has backup and snapshot persistence and one attacker moved from a gateway to an ESXi host."
