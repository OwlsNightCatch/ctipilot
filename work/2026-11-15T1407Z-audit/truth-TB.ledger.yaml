    urls: ["https://support.apple.com/de-de/149555"]
  - claim_id: a459f153c1
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "section 2026-11-08T03:30:49Z"
    kind: cited
    text: "Administrators can remove emSign ECC Root CA - G3 from the file and, as an optional step, AAA Certificate Services to stop the six Sectigo cross-signed certificates as well, which Apple warns can leave tools that read only that file unable to verify some websites whose chains run through unaffected intermediates; a macOS software update can replace the file with Apple's version, so the check has to be repeated after each update until the one that carries Apple's change ("
    urls: ["https://support.apple.com/de-de/149555"]
  - claim_id: fa1f3fbd87
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "section 2026-11-08T03:30:49Z"
    kind: cited
    text: "). heise reports that macOS 27.2, which brought no fix, undid the workaround for users who had applied it, that the macOS 27.3 developer beta replaces the file, and that the final release will take at least until December ("
    urls: ["https://www.heise.de/news/macOS-27-3-Apple-behebt-letztes-eMudhra-Leck-aber-es-wird-dauern-11513443.html"]
  - claim_id: 67f2d82328
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "section 2026-11-08T03:30:49Z"
    kind: cited
    text: "Google's post now carries an update of 2026-11-04: Chrome 153 and higher will no longer trust by default TLS server certificates that validate to emSign Root CA - G1 when their earliest Signed Certificate Timestamp is dated after 2026-11-16 23:59:59 UTC, and certificates whose earliest SCT is on or before that time are unaffected ("
    urls: ["https://blog.google/security/protecting-chrome-and-android-users-from-compromised-emudhra-intermediate-ca-certificates/"]
  - claim_id: 82f10064ed
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "section 2026-11-08T03:30:49Z"
    kind: cited
    text: "Apple's page dates its block of the twelve intermediate certificates to 2026-10-19, three days before the 2026-10-22 the incident tracker and BleepingComputer gave for Apple devices, and its block of the emSign ECC Root CA - G3 root to 2026-10-23 ("
    urls: ["https://support.apple.com/de-de/149555"]
  - claim_id: 131efeb8ac
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "section 2026-11-08T03:30:49Z"
    kind: uncited
    text: "Cisco's advisory is at version 1.8 of 2026-11-06 (1.6 on 2026-11-04 and 1.7 on 2026-11-05)."
  - claim_id: 6694712d7c
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "section 2026-11-11T03:55:02Z"
    kind: cited
    text: "SonicWall's informational advisory SNWLID-2026-0021 of 2026-11-10, which has no CVE and no workaround, says SonicOS appliances with Client DPI-SSL enabled continued to trust certificate chains issued by the compromised eMudhra intermediate CAs because the firewall's local certificate store trusted the underlying roots, and that the firewall then re-signed traffic from the impacted servers with its local DPI-SSL CA certificate, preventing client browsers from rejecting connections signed by the untrusted intermediates ("
    urls: ["https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2026-0021", "https://psirtapi.global.sonicwall.com/api/v1/vulndetail/?advisory_id=SNWLID-2026-0021"]
  - claim_id: 4f53360a5e
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "section 2026-11-11T03:55:02Z"
    kind: cited
    text: "Affected are Gen7 hardware firewalls (TZ 270 to TZ 670, NSa 2700 to 6700, NSsp 10700 to 15700) and Gen7 NSv up to 7.3.4-7013, fixed in 7.3.4-7015 and higher, and Gen8 hardware (TZ 80 to TZ 680, NSa 2800 to 5800) and Gen8 NSv up to 8.2.2-8015, fixed in 8.2.3-8015 and higher; a Gen7 firewall that took only 7.3.4-7013 is therefore still affected ("
    urls: ["https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2026-0021"]
  - claim_id: 271315fd3b
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "section 2026-11-11T03:55:02Z"
    kind: cited
    text: "Apple revised its support page on 2026-11-10: from macOS 27.2.1 the command-line tools no longer accept the twelve intermediate certificates, and the two roots they chain to, with three more eMudhra roots, leave /etc/ssl/cert.pem; macOS 26.7.3 and 15.8.3 carry the same protection, and after updating the manual removal need not be repeated ("
    urls: ["https://support.apple.com/de-de/149555"]
  - claim_id: 5d2088cf79
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "section 2026-11-11T03:55:02Z"
    kind: cited
    text: "Microsoft's post carries an update of 2026-11-10: the remaining eMudhra roots leave Microsoft products starting 2026-11-16, the ten remaining roots leave the Windows trusted root list through the automatic certificate-trust update, Edge and WebView2 drop default trust for emSign Root CA - G1, C1, ECC Root CA and Root TLS CA - G1 on the same date, Azure Linux images follow that day, and the .NET container images and the Microsoft Build of OpenJDK follow upstream releases ("
    urls: ["https://www.microsoft.com/en-us/msrc/blog/2026/10/microsoft-response-to-compromised-emudhra-certificate-authority-keys"]
  - claim_id: d806b931f7
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "section 2026-11-11T03:55:02Z"
    kind: cited
    text: "Cisco's advisory is at version 1.9 of 2026-11-10, which updates the products under investigation, impacted and not impacted ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-emudhra-info-ScS22A1r"]
  - claim_id: aba3e4f923
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "section 2026-11-11T03:55:02Z"
    kind: uncited
    text: "SonicWall removed the affected root certificates from the SonicOS certificate store and added blocking logic for the compromised chain."
  - claim_id: 074cd1ce9a
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "section 2026-11-11T03:55:02Z"
    kind: uncited
    text: "The revised page no longer carries the block dates of its 2026-10-30 version, so the 2026-10-22 date of the tracker and BleepingComputer stands for Apple's block."
  - claim_id: 091edafa0b
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "section 2026-11-12T04:26:05Z"
    kind: cited
    text: "eMudhra posted its full incident report in the Mozilla bug on 2026-11-10 ("
    urls: ["https://bugzilla.mozilla.org/show_bug.cgi?id=2083449"]
  - claim_id: b0f27fac44
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "section 2026-11-12T04:26:05Z"
    kind: cited
    text: "For the eight RSA-4096 issuers (G2B and G2C) it says the key integrity is intact, all signatures verifying, but that during re-import the private-key material was handled in the volatile memory of a Python process on the ceremony host, which is not consistent with its certification practice statement, so the RSA issuers are treated as not meeting it; it adds that logs cannot reliably establish or exclude how that material was handled ("
    urls: ["https://bugzilla.mozilla.org/show_bug.cgi?id=2083449"]
  - claim_id: e057c99cfd
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "section 2026-11-12T04:26:05Z"
    kind: cited
    text: "It identified this in early November after a root-program discussion, revoked the eight issuers on 2026-11-07 with the reason cessationOfOperation, not the compromise reason used for the ECDSA set, and had written on 2026-10-19 that the RSA issuers were not impacted ("
    urls: ["https://bugzilla.mozilla.org/show_bug.cgi?id=2083449", "https://bugzilla.mozilla.org/show_bug.cgi?id=2083449#c11"]
  - claim_id: d0368d51a8
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "section 2026-11-12T04:26:05Z"
    kind: cited
    text: "The G2C issuers were put into production in May 2026 and issued end-entity certificates, the last on 2026-11-03, after which issuance from them stopped; BleepingComputer reports that eMudhra says the affected customer certificates were replaced or migrated, and that the company has not detected malicious use of the keys ("
    urls: ["https://bugzilla.mozilla.org/show_bug.cgi?id=2083449", "https://www.bleepingcomputer.com/news/security/emudhra-revokes-8-more-ca-certificates-after-private-key-mishap/"]
  - claim_id: f1ae6d7242
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "section 2026-11-12T04:26:05Z"
    kind: cited
    text: "). eMudhra also decided to exit public TLS, with all issuance from its emSign Root CA - G1 hierarchy to stop before 2026-11-16 and an independent review due 2026-12-04 ("
    urls: ["https://bugzilla.mozilla.org/show_bug.cgi?id=2083449"]
  - claim_id: 9354651f3a
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "section 2026-11-12T04:26:05Z"
    kind: uncited
    text: "No page read from Google, Microsoft, Apple, Mozilla or the incident tracker names the G2B or G2C issuers or says a vendor blocked them."
  - claim_id: 2d3edabec8
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "record 2026-10-23T03:43:28Z"
    kind: record-summary
    text: "Standalone Java runtimes keep their own trust store: Oracle's Security Alert CVE-2026-91403 (CVSS 3.1 9.1) and the OpenJDK advisory of 2026-10-21 ship the distrust update, the tracker lists the fixed builds, replacing blocked.certs or enabling revocation checking is the stop-gap, and NCSC.ch lists the exploitation status as unknown."
  - claim_id: 1c9bb3cb9b
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "record 2026-10-25T03:36:20Z"
    kind: record-summary
    text: "Oracle's second Security Alert of 2026-10-24, CVE-2026-114820 (CVSS 3.1 9.1), removes four root CAs and lists Java SE builds such as 27.0.1.0.2 as affected, and OpenJDK says even a runtime updated in the past few days needs it, so a standalone Java runtime updated on 2026-10-21 needs the new update or the same stop-gap again; OpenJDK now says Debian, Devuan and Ubuntu packages need the keystore recreated by hand. Python announces a built-in ssl denylist (CVE-2026-115557) without naming a release, so pip 26.2.2 is the Python fix to apply now; Cisco lists the products it has fixes for; and eMudhra is leaving the global TLS business, and standard ACME clients do not replace the affected certificates outside their renewal window unless they support ACME Renewal Information."
  - claim_id: f68395d276
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "record 2026-11-01T03:32:20Z"
    kind: record-summary
    text: "Microsoft removed seven eMudhra-hierarchy certificates from the Windows trust list in an out-of-band update of 2026-10-26 and from the Edge trust list on 2026-10-27; Cisco's advisory reached version 1.5 on 2026-10-30 with ISE fixes dated December 2026 and April 2027; GitLab's releases of 2026-10-29 distrust the eight intermediates, with GitLab Runner and the AI Gateway needing separate updates; Python's releases of 2026-10-26 carry the built-in denylist; and Oracle's revision of 2026-10-30 extends the Java alert to Oracle Database Server, Autonomous Health Framework and OPatch. Certificates that chain to the removed roots need replacing, and disconnected Windows devices need the updated trust lists."
  - claim_id: 97f1aae27c
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "record 2026-11-01T13:46:55Z"
    kind: record-summary
    text: "Python 3.15.1, 3.14.9 and 3.13.17, which the 2026-10-25 section listed as patched, predate the ssl denylist; the protected releases are 3.15.2, 3.14.10, 3.13.18, 3.12.16 and 3.11.18, and the tracker clause that carried the earlier versions is removed."
  - claim_id: 9f0677050d
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "record 2026-11-08T03:30:49Z"
    kind: record-summary
    text: "Cisco's eMudhra advisory reached version 1.8 on 2026-11-06 with a CA-trust distrust guide for IOS XE and NX-OS and MDS releases listed as impacted without a remediation; Apple's own page confirms that the curl, git, python3 and openssl that ship with macOS keep trusting the intermediates until a future update, and heise reports that macOS 27.2 undid the manual workaround and that Apple's change is not expected before December. Google's post adds that Chrome 153 and higher will stop trusting by default certificates under emSign Root CA - G1 whose earliest SCT is after 2026-11-16, and Apple's page dates its blocks to 2026-10-19 and 2026-10-23."
  - claim_id: 1b837ec779
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "record 2026-11-08T14:08:21Z"
    kind: record-summary
    text: "CVE-2026-111943, which the title and analysis already name for Go and GitLab, now has its structured record with the fixed Go and GitLab releases; the Python Insider and GitLab pages do carry their dates, so the notes saying otherwise are removed."
  - claim_id: 23cf8d163c
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "record 2026-11-11T03:55:02Z"
    kind: record-summary
    text: "SonicWall's advisory of 2026-11-10 says SonicOS firewalls with Client DPI-SSL enabled kept trusting the compromised eMudhra chains and re-signed them for clients; fixed in SonicOS 7.3.4-7015 (Gen7) and 8.2.3-8015 (Gen8), so a Gen7 unit on 7.3.4-7013 is still affected. Apple's macOS 27.2.1, 26.7.3 and 15.8.3 now block the certificates in the command-line tools, Microsoft removes the remaining eMudhra roots from Windows, Edge and WebView2 from 2026-11-16, and Cisco's advisory is at version 1.9."
  - claim_id: 1155a3a08f
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "record 2026-11-12T04:26:05Z"
    kind: record-summary
    text: "eMudhra's full incident report of 2026-11-10 says eight RSA-4096 issuers (G2B and G2C) were revoked on 2026-11-07 with the reason cessationOfOperation because their keys were handled in the memory of a Python script, so eMudhra cannot show compliance with its policy; it had said on 2026-10-19 that they were not impacted, no source says the keys leaked, and the G2C issuers had issued end-entity certificates."
  - claim_id: d57e2e6e5c
