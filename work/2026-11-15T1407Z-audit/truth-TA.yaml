    verdict: imprecision
    findings:
      - code: F1
        claim_id: 79a82b2499
        where: "body paragraph 1 ('The Bernische Pensionskasse says its supplier is the same company'), body Exposure line (BPK link), section 2026-10-10T03:48:33Z (BPK notice of 2026-10-09; claims ec07f178c6, 261c171cc0), sources[] BPK record, evidence[3] and evidence[4]"
        defect: "The cited BPK notice https://www.bpk.ch/fileadmin/redaktion/3_Kundenservice/3.4_Mitteilungen/Cybervorfall_Softwarelieferantin_BPK_D.pdf no longer resolves, and the quote 'The supplier is the same company that also supplies the federal pension fund Publica' (evidence[3], section 2026-10-10) can no longer be checked on any BPK page. Claims 79a82b2499, d016a535d8, ec07f178c6 and 261c171cc0 bind to this URL."
        ground_truth: "HTTP 301 from www.bpk.ch to bpk.ch, then HTTP/2 404 (nginx) on https://bpk.ch/fileadmin/redaktion/3_Kundenservice/3.4_Mitteilungen/Cybervorfall_Softwarelieferantin_BPK_D.pdf, read 2026-11-15; the notice page https://bpk.ch/hauptnavigation/cybervorfall now holds BPK's notices of 8, 9, 14, 15, 20 and 30 October, its 9 October text ('Eine externe Softwarelieferantin der BPK stellte Ende September 2026 einen Cybervorfall fest ... Zum jetzigen Zeitpunkt gibt es keine Hinweise, dass Daten der BPK gestohlen wurden. Jedoch kann dies nicht restlos ausgeschlossen werden.') carries the no-indications sentence but no 'same company as Publica' sentence. The same-company fact appears only in cash.ch/AWP ('Bei der Softwarelieferantin handelt es sich um dieselbe Firma, die auch die Pensionskasse des Bundes Publica zu ihren Kunden zählt'), not attributed there to BPK."
        ground_truth_url: "https://bpk.ch/hauptnavigation/cybervorfall"
        fix: "Re-point the BPK citations for the 'no indications' statements and evidence[4] to https://bpk.ch/hauptnavigation/cybervorfall (Mitteilung vom 9. Oktober); support the same-company fact with the cash.ch/AWP article (cited elsewhere in the entry) and drop evidence[3] or state it as AWP's wording; remove the dead PDF from sources[]."
      - code: F4
        claim_id: null
        where: "evidence[49] (watson.ch / Keystone-SDA), field original"
        defect: "original: 'weiterhin keine Hinweise darauf vor, dass Daten aus dem Angriff im Darkweb veröffentlicht wurden' is not verbatim: the page says Darknet."
        ground_truth: "Auch lägen dem Staatssekretariat für Sicherheitspolitik, das dem Verteidigungsdepartement VBS unterstellt ist, weiterhin keine Hinweise darauf vor, dass Daten aus dem Angriff im Darknet veröffentlicht wurden."
        ground_truth_url: "https://www.watson.ch/schweiz/datenschutz/664513749-nach-daten-klau-keine-loesegeldforderung-von-hackern-an-publica-softwarelieferan"
        fix: "Set original to '... im Darknet veröffentlicht wurden'; the English quote may keep 'darkweb' only if the translation note is accepted, otherwise 'darknet'."
      - code: F4
        claim_id: f2b4f1aca0
        where: "section 2026-10-20T03:39:20Z, sentence on the Bernische Pensionskasse and the NZZ (low confidence)"
        defect: "'The Bernische Pensionskasse told the NZZ that, contrary to the supplier's earlier information, it must be assumed that personal data left, which replaces its earlier statement that it had no indication of theft' keeps the reading that the NZZ quote replaced BPK's own no-indications statement. The entry's own 2026-11-08 correction says the NZZ 'quoted the fund more broadly', but this sentence (and the 2026-10-20 record summary) were left as written."
        ground_truth: "NZZ: BPK 'dass entgegen vorherigen Informationen der PKS davon ausgegangen werden muss, dass Personendaten abgeflossen sind' (about PK Softech's data in general). BPK notice of 15 Oct: 'Ob auch Daten von versicherten Personen der BPK abgeflossen sind, ist uns nach wie vor nicht bekannt.'; of 30 Oct: 'können wir derzeit weder bestätigen noch ausschliessen, dass Personendaten von versicherten Personen der BPK abgeflossen sind.'"
        ground_truth_url: "https://bpk.ch/hauptnavigation/cybervorfall"
        fix: "Drop 'which replaces its earlier statement that it had no indication of theft' (or say BPK moved from 'no indications' to 'not known')."
      - code: F9
        claim_id: f2a1e33984
        where: "section 2026-10-21T03:47:07Z vs section 2026-11-12T04:28:00Z (low confidence)"
        defect: "The 2026-10-21 section relays that the State Secretariat for Security Policy 'has already seen first fraudulent contact attempts connected with Publica'; the 2026-11-12 section relays Publica's page that it 'knows of no case of persons demonstrably contacted or harmed'. The two are never set against each other and no Contradiction line says which scope each statement has."
        ground_truth: "Inside IT 2026-10-20: 'Gemäss Bericht hat das Staatssekretariat für Sicherheitspolitik bereits erste betrügerische Kontaktversuche im Zusammenhang mit Publica festgestellt.' Publica page Stand 10.11.2026: 'Bis heute sind Publica keine Fälle bekannt, in denen Personen nachweislich im Zusammenhang mit dem Cyberangriff kontaktiert oder geschädigt wurden.'"
        ground_truth_url: "https://www.publica.ch/de/cyberangriff-auf-softwarelieferanten"
        fix: "Add one Contradiction sentence: second-hand report of attempts connected with Publica (unconfirmed by Publica) versus Publica's own statement of no demonstrable cases."
