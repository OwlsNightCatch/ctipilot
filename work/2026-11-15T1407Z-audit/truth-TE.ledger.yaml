    kind: cited
    text: "**Triage:** a malware-analysis sandbox detonating a ScreenConnect installer also creates guest sessions; per Huntress, a sandbox session sends a key and JPEG screenshots of the analysis VM, while these send no key, reuse seven screenshot families and randomise hardware and OS details ("
    urls: ["https://www.huntress.com/blog/fake-crypto-exchange-sessions-screenconnect"]
