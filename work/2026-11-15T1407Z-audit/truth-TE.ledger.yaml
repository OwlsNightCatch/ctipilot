    entry: 2026-11-12/screenconnect-sckit-toolkit-pushed-to-hundreds-of-endpoints
    surface: "body"
    kind: cited
    text: "**Detection:** ScreenConnect instance audit logs, Run Command and Toolbox history for mass executions nobody started and RMM+ requests with no matching login ("
    urls: ["https://www.huntress.com/blog/sckit-worm-rogue-screenconnect"]
  - claim_id: 4a8859c2d7
    entry: 2026-11-12/screenconnect-sckit-toolkit-pushed-to-hundreds-of-endpoints
    surface: "body"
    kind: cited
    text: "), and file-transfer-and-run events (event ID 201, per Blackpoint) ("
    urls: ["https://blackpointcyber.com/blog/screenconnect-attack-sckit/"]
  - claim_id: d7755afe50
    entry: 2026-11-12/screenconnect-sckit-toolkit-pushed-to-hundreds-of-endpoints
