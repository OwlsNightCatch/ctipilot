    text: "{\"id\": \"CVE-2026-110697\", \"cvss\": \"9.9\", \"status\": [\"patch-available\", \"no-patch\"], \"affected\": \"Red Hat Quay before 3.9.28, 3.10.28, 3.12.24, 3.14.10, 3.15.9, 3.16.7, 3.17.7 and 3.18.3 on each branch; Red Hat Quay 5 and mirror registry for Red Hat OpenShift 2 affected\", \"fixed\": \"3.9.28, 3.10.28, 3.12.24, 3.14.10, 3.15.9, 3.16.7, 3.17.7, 3.18.3; none for Quay 5 and mirror registry for Red Hat OpenShift 2\", \"auth\": \"post-auth\", \"vector\": \"zero-click\"}"
  - claim_id: 4534dbe1ba
    entry: 2026-11-14/red-hat-quay-signing-key-takeover-cve-2026-123710
    surface: "body"
    kind: cited
    text: "Red Hat's record for CVE-2026-123710 says an unauthenticated client of Red Hat Quay can obtain an anonymous registry token with an audience it chooses, present it to the service-key rotation endpoint and install its own approved signing key with no expiry ("
    urls: ["https://access.redhat.com/security/cve/cve-2026-123710"]
