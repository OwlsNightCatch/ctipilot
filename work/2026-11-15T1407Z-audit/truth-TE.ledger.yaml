    kind: cited
    text: "**Exposure:** a Red Hat Quay registry, standalone, deployed by the Quay Operator on OpenShift or as the mirror registry for Red Hat OpenShift, whose /keys endpoint untrusted clients can reach, and for the second flaw a multi-tenant registry where an account can create namespaces ("
    urls: ["https://access.redhat.com/solutions/7149923", "https://security-hub.ncsc.admin.ch/#/posts/13178"]
