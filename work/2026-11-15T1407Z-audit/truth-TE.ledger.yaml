    entry: 2026-11-14/red-hat-quay-signing-key-takeover-cve-2026-123710
    surface: "body"
    kind: cited
    text: "NCSC Switzerland summarises the impact as letting network attackers with anonymous or low-privileged access read, overwrite or poison private container images and steal registry credentials, compromising the software supply chain ("
    urls: ["https://security-hub.ncsc.admin.ch/#/posts/13178"]
  - claim_id: 2da6737427
    entry: 2026-11-14/red-hat-quay-signing-key-takeover-cve-2026-123710
    surface: "body"
    kind: cited
    text: "The condition is that the /keys endpoint is reachable by untrusted clients ("
