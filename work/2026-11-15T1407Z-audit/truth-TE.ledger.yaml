  - claim_id: 96d9ed089f
    entry: 2026-11-14/red-hat-quay-signing-key-takeover-cve-2026-123710
    surface: "body"
    kind: cited
    text: "); for token theft, registry pulls or pushes that do not match expected robot-account usage ("
    urls: ["https://access.redhat.com/security/cve/cve-2026-110697"]
  - claim_id: cda26a2b25
    entry: 2026-11-14/red-hat-quay-signing-key-takeover-cve-2026-123710
