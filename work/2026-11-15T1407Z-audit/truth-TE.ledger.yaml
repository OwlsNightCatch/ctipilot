  - claim_id: 1972c8a452
    entry: 2026-11-14/red-hat-quay-signing-key-takeover-cve-2026-123710
    surface: "body"
    kind: cited
    text: "); anonymous access is on by default, and turning it off does not protect, because any valid Quay account can still exploit the flaw ("
    urls: ["https://access.redhat.com/solutions/7149923"]
  - claim_id: 44a07d5edf
    entry: 2026-11-14/red-hat-quay-signing-key-takeover-cve-2026-123710
    surface: "body"
    kind: cited
    text: "CVE-2026-110697 lets an attacker who creates a namespace containing an underscore match and retrieve robot accounts and their decrypted tokens from other tenants' namespaces; Red Hat says it needs no elevated privileges or victim interaction and that, where Quay is OpenShift's integrated registry, stolen robot credentials can inject malicious images into CI/CD pipelines ("
    urls: ["https://access.redhat.com/security/cve/cve-2026-110697"]
  - claim_id: 989e66593d
    entry: 2026-11-14/red-hat-quay-signing-key-takeover-cve-2026-123710
    surface: "body"
    kind: cited
    text: "Red Hat's page for the second flaw lists the fixed builds 3.9.28, 3.10.28, 3.12.24, 3.14.10, 3.15.9, 3.16.7, 3.17.7 and 3.18.3 and says Quay.io is already fixed ("
