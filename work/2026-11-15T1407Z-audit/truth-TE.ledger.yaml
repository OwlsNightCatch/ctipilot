    surface: "body"
    kind: cited
    text: "Huntress counted 2,223 fake guest sessions on 118 self-hosted ScreenConnect servers across 109 MSP and organisation accounts, enrolled between 2026-11-03 and 2026-11-13: always-online \"computers\" named after crypto exchanges (an exchange word joined to a role word) with a trading-desktop thumbnail ("
    urls: ["https://www.huntress.com/blog/fake-crypto-exchange-sessions-screenconnect"]
