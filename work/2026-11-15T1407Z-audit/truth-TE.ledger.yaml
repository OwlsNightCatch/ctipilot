    entry: 2026-11-13/signdrop-windows-clfs-authentication-lpe-public-poc-no-patch
    surface: "body"
    kind: cited
    text: "**Exposure:** any Windows host on which an attacker can already run code as a standard user and whose CLFS authentication Mode is 0 or 1; Cyderes tells defenders to read the Mode value on every host to size the population ("
    urls: ["https://www.cyderes.com/howler-cell/signdrop-zero-day"]
