  - claim_id: de69adeeb6
    entry: 2026-11-13/signdrop-windows-clfs-authentication-lpe-public-poc-no-patch
    surface: "body"
    kind: derived
    text: "**Detection:** file-creation telemetry for hid.dll in the ink directory, which Cyderes counts, with the Defender signature-update RPC call, among its two highest-signal observables because the file does not ship in that directory; that RPC called from a process outside the Defender service tree; symbolic-link churn under \\BaseNamedObjects\\Restricted\\ correlated with Defender RPC activity; consent.exe loading a DLL from the ink directory; and a SYSTEM conhost.exe on the interactive desktop right after a hid.dll write."
