    kind: frontmatter
    text: "PTC's CNA record, restated by NCSC Switzerland and BSI, says CVE-2026-126325 lets a remote, unauthenticated attacker run code on PTC Windchill and FlexPLM through deserialization of untrusted data (CVSS 4.0 9.2, high attack complexity), in eleven Windchill and ten FlexPLM release lines. PTC announced a patch on 2026-11-11 (its advisory sits behind a customer login, so no fixed release is public) and has already patched PTC-hosted environments; no source reports exploitation of this flaw, although CISA listed an earlier Windchill and FlexPLM RCE as exploited in June."
