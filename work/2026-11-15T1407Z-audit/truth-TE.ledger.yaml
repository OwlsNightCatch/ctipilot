  - claim_id: e87e5034e9
    entry: 2026-11-12/plone-security-hotfix-20261110-anonymous-rce-chain
    surface: "headline"
    kind: frontmatter
    text: "Plone anonymous RCE chain: update or install the 20261110 hotfix, block portal_modifier, check modifier conditions"
  - claim_id: bca59f7383
    entry: 2026-11-12/plone-security-hotfix-20261110-anonymous-rce-chain
    surface: "summary"
    kind: frontmatter
    text: "The Plone and Zope security team released fixes on 2026-11-10 for a chain of issues that together let an anonymous visitor run code on the server in Plone 6.0, 6.1 and 6.2 and, per the team, back to at least 4.3; the entry point is a CMFEditions flaw rated 9.8 with no privileges required, and its advisory says a working proof of concept exists. The team's fixes are the updated packages or the hotfix package Products.PloneHotfix20261110, a workaround that blocks URLs containing portal_modifier has applied since the 2026-11-02 pre-announcement, CVE ids are requested and no source reports exploitation."
  - claim_id: e305f69e58
    entry: 2026-11-12/plone-security-hotfix-20261110-anonymous-rce-chain
    surface: "actions[0]"
    kind: frontmatter
    text: "On every Plone site, update to CMFPlone 6.2.3, 6.1.6 or 6.0.16 with the helper packages the Plone team lists, or install Products.PloneHotfix20261110 on any version from 4.3 to 6.2, restart all Zope instances, keep blocking URLs that contain portal_modifier at the front web server, and then check the modifier conditions with @@check-modifier-conditions or the hotfix's startup warning, because an anonymous request can already have stored a malicious condition that survives the fix."
  - claim_id: 448a9933e2
    entry: 2026-11-12/plone-security-hotfix-20261110-anonymous-rce-chain
    surface: "body"
    kind: cited
    text: "The Plone and Zope security team says the fixes it released on 2026-11-10 close a chain of several issues that together let an anonymous visitor run code on the server, in all supported Plone versions (6.0, 6.1 and 6.2) and in older ones back to at least 4.3 ("
    urls: ["https://community.plone.org/t/plone-security-hotfix-20261110/23313"]
  - claim_id: a64c5ed1a6
    entry: 2026-11-12/plone-security-hotfix-20261110-anonymous-rce-chain
    surface: "body"
    kind: cited
    text: "The anonymous entry point is Products.CMFEditions: the conditional modifiers in portal_modifier had no security declarations, so an anonymous visitor could change a modifier's TALES condition and then run it, and the condition is also evaluated when an editor saves versioned content ("
    urls: ["https://community.plone.org/t/plone-security-hotfix-20261110/23313"]
  - claim_id: 3aa15fdcb3
    entry: 2026-11-12/plone-security-hotfix-20261110-anonymous-rce-chain
    surface: "body"
    kind: cited
    text: "Products.CMFPlone, Products.MimetypesRegistry and plone.batching opened whole modules to restricted code, which let TALES expressions and Python scripts escape the sandbox and reach modules such as os, and plone.restapi opened the json module ("
    urls: ["https://community.plone.org/t/plone-security-hotfix-20261110/23313"]
  - claim_id: 28ec070535
    entry: 2026-11-12/plone-security-hotfix-20261110-anonymous-rce-chain
    surface: "body"
    kind: cited
    text: "The CMFEditions advisory rates its flaw 9.8 with no privileges required and states that a working proof of concept exists; the team says details are public and that with current AI tools it may not take long to turn them into a working exploit, and no source reports exploitation ("
    urls: ["https://github.com/plone/Products.CMFEditions/security/advisories/GHSA-67qm-q795-jh7h", "https://community.plone.org/t/plone-security-hotfix-20261110/23313"]
  - claim_id: c596fc58a8
    entry: 2026-11-12/plone-security-hotfix-20261110-anonymous-rce-chain
    surface: "body"
    kind: cited
    text: "The fixed packages are CMFPlone 6.2.3, 6.1.6 and 6.0.16 with the helper package versions the announcement lists, or the hotfix Products.PloneHotfix20261110, which covers Plone 4.3 to 6.2, and all Zope instances must be restarted afterwards ("
    urls: ["https://community.plone.org/t/plone-security-hotfix-20261110/23313"]
  - claim_id: 656f9f7852
    entry: 2026-11-12/plone-security-hotfix-20261110-anonymous-rce-chain
    surface: "body"
    kind: cited
    text: "The team's pre-announcement of 2026-11-02 already gave the workaround, to block any URL containing portal_modifier at the web server at any path depth, which only helps if Zope's own port cannot be reached directly; the team advises keeping it after updating ("
    urls: ["https://community.plone.org/t/pre-announcement-plone-security-fix-20261110/23303"]
  - claim_id: a0353eacc3
    entry: 2026-11-12/plone-security-hotfix-20261110-anonymous-rce-chain
    surface: "body"
    kind: cited
    text: "After the fix, restricted code can import only the names Plone itself needs from the closed modules, so custom scripts that import others now get an Unauthorized error ("
    urls: ["https://community.plone.org/t/plone-security-hotfix-20261110/23313"]
  - claim_id: 3afb6e64be
    entry: 2026-11-12/plone-security-hotfix-20261110-anonymous-rce-chain
    surface: "body"
    kind: cited
    text: "**Detection:** web-server access logs for anonymous requests whose path contains portal_modifier; and the stored state, which survives the update: a changed modifier condition stays in the database, so as Manager open @@check-modifier-conditions on the site root, or read the hotfix's startup log line that reports modified versioning conditions, and treat the server as compromised if a condition is not recognised, although defaults have changed over time so a difference alone is not an attack ("
    urls: ["https://community.plone.org/t/plone-security-hotfix-20261110/23313"]
  - claim_id: f02bc05067
    entry: 2026-11-12/plone-security-hotfix-20261110-anonymous-rce-chain
    surface: "body"
    kind: derived
    text: "**Exposure:** any Plone site reachable by anonymous visitors, on a version below the fixed packages; no source states a non-default setting that the anonymous path needs, and Plone 5.2 and older are out of security support, with the fix released as an exception."
  - claim_id: e8dc49b284
    entry: 2026-11-12/plone-security-hotfix-20261110-anonymous-rce-chain
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** update or install the hotfix and restart now on every internet-facing Plone site, keep the portal_modifier block in place, and run the modifier-condition check afterwards, because the fix does not remove a condition an anonymous request already stored."
  - claim_id: e3b1798851
    entry: 2026-11-12/screenconnect-sckit-toolkit-pushed-to-hundreds-of-endpoints
    surface: "headline"
    kind: frontmatter
    text: "ScreenConnect SCKit: second wave hits on-prem; disable RMM+, update technician clients to 26.6.5+"
  - claim_id: 6378d5be34
    entry: 2026-11-12/screenconnect-sckit-toolkit-pushed-to-hundreds-of-endpoints
    surface: "summary"
    kind: frontmatter
    text: "Huntress saw an operator use access to several cloud-hosted ScreenConnect panels on 2026-11-11 to run Run Command as SYSTEM on groups of managed endpoints, installing an attacker-controlled second ScreenConnect client and the SCKit toolkit on at least 288 hosts at 48 organisations within 90 minutes; Sophos independently saw the same client deployments. Huntress later said the activity seems related to the third-party RMM+ extension, whose versions 1.0.31 and 1.0.32 accepted a blank access key; ConnectWise's CNA record CVE-2026-127063 (CVSS 4.0 9.3) says the extension uses a static API secret by default, names no fix and gives disabling as the mitigation, while a Huntress spokesperson says the panel-access vector is still unclear and Blackpoint calls the extensions' role unresolved. A second wave on 2026-11-13 hit 205 hosts at 41 organisations (Huntress) and appears to target on-premises instances with mitigations pending (Blackpoint); Microsoft describes a rogue client built to deliver a payload to the technician who connects, which ConnectWise says ScreenConnect clients 26.6.5 and later block."
  - claim_id: 163731741c
    entry: 2026-11-12/screenconnect-sckit-toolkit-pushed-to-hundreds-of-endpoints
    surface: "actions[0]"
    kind: frontmatter
    text: "On every ScreenConnect instance your organisation or its IT providers run, disable the RMM+ extension immediately, verify it stays disabled and do not re-enable or reinstall it (on-premises instances by hand; ConnectWise removed it from cloud-hosted ones), review Run Command and Toolbox history and the instance audit logs for executions nobody started, including before 2026-11-11, and check managed endpoints for a second ScreenConnect client service; open no interactive session to a suspect host, use EDR live response or WinRM, because a session can trigger the toolkit to spread to the technician's workstation; update every technician host client to ScreenConnect 26.6.5 or later, because a cloud-console update does not update them."
  - claim_id: 09473488cd
    entry: 2026-11-12/screenconnect-sckit-toolkit-pushed-to-hundreds-of-endpoints
    surface: "cves[CVE-2026-127063]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-127063\", \"cvss\": \"9.3 (CVSS 4.0, ConnectWise as CNA)\", \"status\": [\"no-patch\", \"mitigation-only\"], \"affected\": \"DataComm RMM+ extension for ConnectWise ScreenConnect, all versions that keep the default API secret (Huntress: versions 1.0.31 and 1.0.32 with a blank key); the ScreenConnect server and client are not affected\", \"fixed\": \"none announced; ConnectWise disabled and removed the extension from cloud-hosted instances; on-premises: disable it immediately, verify it stays disabled, do not re-enable or reinstall\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
  - claim_id: 9577bc88ff
    entry: 2026-11-12/screenconnect-sckit-toolkit-pushed-to-hundreds-of-endpoints
    surface: "body"
    kind: cited
    text: "On 2026-11-11 Huntress observed an operator using access to several cloud-hosted ScreenConnect panels to run commands as SYSTEM on groups of managed endpoints through the Run Command feature, hitting at least 288 hosts at 48 organisations within 90 minutes ("
    urls: ["https://www.huntress.com/blog/sckit-worm-rogue-screenconnect"]
  - claim_id: 542a89c712
    entry: 2026-11-12/screenconnect-sckit-toolkit-pushed-to-hundreds-of-endpoints
    surface: "body"
    kind: cited
    text: "Each host installed an attacker-controlled second client and fetched SCKit, a 16-file toolkit delivered encrypted that sets the legitimate client to manual start so the attacker's copy replaces it and runs a per-host executable from a scheduled task ("
    urls: ["https://www.huntress.com/blog/sckit-worm-rogue-screenconnect"]
  - claim_id: 5b9549b05b
    entry: 2026-11-12/screenconnect-sckit-toolkit-pushed-to-hundreds-of-endpoints
    surface: "body"
    kind: cited
    text: "A second wave on 2026-11-13 hit 205 hosts at 41 organisations with no follow-on executions observed ("
    urls: ["https://www.huntress.com/blog/sckit-worm-rogue-screenconnect"]
  - claim_id: 176c2fc4e6
    entry: 2026-11-12/screenconnect-sckit-toolkit-pushed-to-hundreds-of-endpoints
    surface: "body"
    kind: cited
    text: "), and Blackpoint says it appears to target on-premises instances where mitigations are still pending ("
    urls: ["https://blackpointcyber.com/blog/screenconnect-attack-sckit/"]
