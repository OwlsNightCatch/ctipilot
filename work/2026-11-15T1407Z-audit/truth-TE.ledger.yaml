    entry: 2026-11-12/screenconnect-sckit-toolkit-pushed-to-hundreds-of-endpoints
    surface: "body"
    kind: cited
    text: "Huntress's later update says the activity seems related to RMM+, a third-party extension that bypasses ScreenConnect's accounts, roles and MFA: versions 1.0.31 and 1.0.32 accepted a blank access key when an administrator had never set one ("
    urls: ["https://www.huntress.com/blog/sckit-worm-rogue-screenconnect"]
