    kind: cited
    text: "); process-creation telemetry with the ScreenConnect client service as parent of cmd, PowerShell or msiexec, curl or PowerShell downloads followed by a silent msiexec install (the Sophos pattern) ("
    urls: ["https://www.sophos.com/en-us/blog/malicious-screenconnect-deployments-observed"]
  - claim_id: cfdb8e76c6
    entry: 2026-11-12/screenconnect-sckit-toolkit-pushed-to-hundreds-of-endpoints
    surface: "body"
    kind: cited
    text: "), a scheduled-task PowerShell watcher that compiles an executable with the .NET compiler ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/11/13/sckit-abuses-screenconnect-deploy-remote-access-target-technician-sessions/"]
  - claim_id: 09db6d7a10
    entry: 2026-11-12/screenconnect-sckit-toolkit-pushed-to-hundreds-of-endpoints
    surface: "body"
    kind: cited
    text: "), and a client service named like a Windows component ("
    urls: ["https://www.huntress.com/blog/sckit-worm-rogue-screenconnect"]
  - claim_id: 66619e53ff
    entry: 2026-11-12/screenconnect-sckit-toolkit-pushed-to-hundreds-of-endpoints
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** treat Run Command or Toolbox executions you did not start as a compromise; disable RMM+ and the four other extensions the first notice named, update every technician host client to 26.6.5 or later, rotate ScreenConnect credentials and revoke active sessions and the browser and identity-provider sessions the toolkit could steal, and keep hosts and technician workstations out of service until the rogue client and persistence are gone ("
    urls: ["https://www.huntress.com/blog/sckit-worm-rogue-screenconnect", "https://www.microsoft.com/en-us/security/blog/2026/11/13/sckit-abuses-screenconnect-deploy-remote-access-target-technician-sessions/"]
  - claim_id: 95fa9dbfce
    entry: 2026-11-12/screenconnect-sckit-toolkit-pushed-to-hundreds-of-endpoints
    surface: "body"
    kind: cited
    text: "Removing the rogue client alone leaves the persistence and the web sessions, and the cleanup script found in the kit must not be used ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/11/13/sckit-abuses-screenconnect-deploy-remote-access-target-technician-sessions/"]
  - claim_id: 019eb089c7
    entry: 2026-11-12/screenconnect-sckit-toolkit-pushed-to-hundreds-of-endpoints
    surface: "body"
    kind: derived
    text: "**Exposure:** a ScreenConnect instance whose panel can run commands on managed endpoints, run by the organisation or an IT provider; an RMM+ extension at any version, since ConnectWise's record names a static default secret, with versions 1.0.31 and 1.0.32 and a blank key as the condition Huntress describes; a technician host client older than 26.6.5; an endpoint with a second client service pointing at a foreign relay."
