    surface: "body"
    kind: derived
    text: "**Detection:** in the server session database, new guest sessions with ClientType 1 (Windows), an empty guest public key, empty company or site fields and crypto-site thumbnails (guest version 25.3.4.9288 is context, not unique on its own); in web or relay logs, many new Access guests from one external address in a short window; on technician workstations, `ScreenConnect.WindowsClient.exe` starting `cmd.exe`, `powershell.exe`, `wscript.exe` or `msiexec.exe` on a file under a Documents Temp folder, which Huntress calls the host-side shape of CVE-2026-84869 exploitation."
  - claim_id: def6a4b730
    entry: 2026-11-12/gsocket-relay-client-keeps-access-after-linux-web-patch
    surface: "headline"
    kind: frontmatter
    text: "Microsoft: GSocket relay clients on exploited Linux web servers survive the patch; hunt the host, not the app"
  - claim_id: 2f8861b2c6
    entry: 2026-11-12/gsocket-relay-client-keeps-access-after-linux-web-patch
    surface: "summary"
    kind: frontmatter
    text: "Microsoft Defender telemetry shows multiple unrelated threat actors deploying GSocket, an open-source remote access tool that connects both ends outbound through a public relay, on Linux servers after exploiting an internet-facing web application, with kernel-thread-like process names and layered persistence through cron, systemd and shell profiles. Because the client runs independently of the exploited application, patching does not remove it, and blocking an address or domain is unlikely to cut off access."
  - claim_id: f2c64453c2
    entry: 2026-11-12/gsocket-relay-client-keeps-access-after-linux-web-patch
    surface: "body"
    kind: cited
    text: "Microsoft observed several unrelated threat actors deploy GSocket, an open-source remote access tool, on Linux servers after exploiting an internet-facing web application, and says it kept access after the exploited vulnerabilities were remediated ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/11/11/global-socket-how-threat-actors-weaponizing-gsocket-stealthy-c2/"]
  - claim_id: 84b6ae3581
    entry: 2026-11-12/gsocket-relay-client-keeps-access-after-linux-web-patch
    surface: "body"
    kind: cited
    text: "The chain starts with command execution as a child of the web server or application runtime, where curl fetches an installation script that bash runs; the script profiles the host, picks a client matching the architecture, stages it as a hidden, executable file in a writable or memory-backed path such as /dev/shm and opens encrypted outbound command and control through the Global Socket Relay Network ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/11/11/global-socket-how-threat-actors-weaponizing-gsocket-stealthy-c2/"]
  - claim_id: 2481226e34
    entry: 2026-11-12/gsocket-relay-client-keeps-access-after-linux-web-patch
    surface: "body"
    kind: cited
    text: "The client is then disguised with kernel-thread-like process names (bash exec -a), persisted through cron, systemd units, shell profiles, watchdogs and redundant copies, and the staging files are removed ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/11/11/global-socket-how-threat-actors-weaponizing-gsocket-stealthy-c2/"]
  - claim_id: 60d847642e
    entry: 2026-11-12/gsocket-relay-client-keeps-access-after-linux-web-patch
    surface: "body"
    kind: cited
    text: "In a few incidents the actors afterwards attempted the Linux kernel flaw CVE-2026-43284, known as Dirty Frag, to reach root; Microsoft gives no success statement and no affected or fixed versions ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/11/11/global-socket-how-threat-actors-weaponizing-gsocket-stealthy-c2/"]
  - claim_id: 044d17fe6b
    entry: 2026-11-12/gsocket-relay-client-keeps-access-after-linux-web-patch
    surface: "body"
    kind: cited
    text: "Both the compromised host and the operator connect outbound to the public relay, so the host needs no inbound listener, inbound firewall rules do not see the traffic and a shared secret, not an address, pairs the endpoints, which lets the operator reconnect later from any compatible client; Microsoft therefore says that blocking an address or domain is unlikely to cut off access, while egress filtering and outbound monitoring can see it ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/11/11/global-socket-how-threat-actors-weaponizing-gsocket-stealthy-c2/"]
  - claim_id: 79c2d7569b
    entry: 2026-11-12/gsocket-relay-client-keeps-access-after-linux-web-patch
    surface: "body"
    kind: cited
    text: "Microsoft's telemetry is concentrated on web applications and hosting; education and research and technology and telecommunications were the largest shares of affected organisations, which Microsoft says reflect exposure more likely than deliberate sector selection ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/11/11/global-socket-how-threat-actors-weaponizing-gsocket-stealthy-c2/"]
  - claim_id: 1a4cbea2f4
    entry: 2026-11-12/gsocket-relay-client-keeps-access-after-linux-web-patch
    surface: "body"
    kind: cited
    text: "After patching, remove the client, its persistence and staged files, and verify that the outbound relay connections stopped, because persistence is layered and stopping the process alone does not remove access ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/11/11/global-socket-how-threat-actors-weaponizing-gsocket-stealthy-c2/"]
  - claim_id: 8dfaadd026
    entry: 2026-11-12/gsocket-relay-client-keeps-access-after-linux-web-patch
    surface: "body"
    kind: cited
    text: "**Triage:** Microsoft notes that the same relay model also serves legitimate remote administration, and says a match must be judged on process ancestry, execution context, persistence changes and related network activity; a client started from a web-service process tree, from a writable or memory-backed path and under a kernel-thread-like name is the pattern it describes ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/11/11/global-socket-how-threat-actors-weaponizing-gsocket-stealthy-c2/"]
  - claim_id: f6cb84c5e7
    entry: 2026-11-12/gsocket-relay-client-keeps-access-after-linux-web-patch
    surface: "body"
    kind: derived
    text: "**Exposure:** any Linux web, CMS or hosting server whose internet-facing application was exploited, patched or not, in the months before the patch; Microsoft says the same persistence problem applies when initial access came through remote access services or cloud shell sessions."
  - claim_id: d3d470dd34
    entry: 2026-11-12/gsocket-relay-client-keeps-access-after-linux-web-patch
    surface: "body"
    kind: derived
    text: "**Detection:** process-creation telemetry with parent lineage, where a web-server or application-runtime process starts curl and then bash, followed by a long-lived process whose name imitates a kernel thread but whose executable sits in a hidden or memory-backed path; file events in /dev/shm and /tmp; new cron entries and systemd units with plausible service names created in the same window as the download; shell startup file changes; and long-lived outbound sessions to a public relay from servers that have no reason to initiate them."
  - claim_id: 2a6c9da4a6
    entry: 2026-11-12/gsocket-relay-client-keeps-access-after-linux-web-patch
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** treat every Linux web server whose application was exploited as possibly holding a relay client, not only web shells, and hunt it on the host after patching; Microsoft's hardening steps are deny-by-default egress with monitoring of relay connections, non-executable mounts for temporary and memory-backed directories, and a review of cron entries, systemd units and shell startup files."
