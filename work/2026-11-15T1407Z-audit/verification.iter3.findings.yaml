- code: F3
  category: claim-not-supported
  section: entry
  item: "2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig"
  url_or_quote: "actions[0]: \"... install v9.17.0 on v9 or v10.3.6 on v10, or the latest partner hotfix ..., now, then reboot it\"; Defender takeaway: \"install v9.17.0 or v10.3.6 ... and reboot it ([Ahsay, 2026-11-12] ... [Ahsay, 2026-10-12])\"; cves[].fixed: \"reboot the server after applying\""
  summary: "(low confidence) The only reboot instruction in the cited Ahsay pages is the 2026-10-12 hotfix advisory (\"After applying the hotfix, please reboot your server.\"). The v9.17.0 and v10.3.6 release notes and the 2026-10-27 advisory carry no reboot statement, yet the action and the takeaway bind 'then reboot it' to the standard releases as well. Suggested fix: scope the reboot to the partner hotfixes ('reboot after a hotfix, as Ahsay's 2026-10-12 advisory says') or drop it for the standard releases."
- code: F14
  category: quantifier-without-source
  section: entry
  item: "2026-11-07/cve-2026-111497-brotli-desigo-cc-mitel-openscape-cisco-duo"
  url_or_quote: "summary: \"Cisco's combined advisory lists Duo Network Gateway (3.4.2), RoomOS and, since version 1.13, Nexus 3000 and 9000 switches running Guest Shell among its products with fixes\""
  summary: "(low confidence) Cisco's advisory (https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-oct2026-node-js-Jj3SQ19u) lists the Nexus 3000/9000 Guest Shell rows (CSCwx56979) and its revision table says 1.13 'Updated products under investigation, vulnerable products, and products confirmed not vulnerable', but no page text says which revision added the Nexus rows; the base entry read 1.12 and never named Nexus. 'since version 1.13' (and 'now lists' in the record summary) is a version-specific claim no source states. Suggested fix: say 'in version 1.13 (2026-11-13) the advisory lists' only if confirmed, otherwise drop the version binding."
