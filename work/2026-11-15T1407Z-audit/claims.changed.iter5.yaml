  - claim_id: 03f0bca0ec
    entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** install v9.17.0 or v10.3.6 (current build v10.3.6.14), whose release notes list the patchset for both CVEs, or the latest partner hotfix v9.15.2.78 or v10.3.4.55 followed by a reboot, on every AhsayCBS server, including those on the earlier patches ("
    urls: ["https://www.ahsay.com/en/support/help-centre/release-notes/cbs/v9.17.0", "https://www.ahsay.com/en/support/help-centre/release-notes/cbs/v10.3.6", "https://www.ahsay.com/en/support/help-centre/release-notes/cbs/v10.3.6.14", "https://www.ahsay.com/en/company/announcements/release-915278-103455", "https://www.ahsay.com/en/company/announcements/patch-cve-105133-105134-update"]
  - claim_id: 692f73c0c5
    entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
    surface: "section 2026-11-15T14:59:12Z"
    kind: cited
    text: "The current v10 build, v10.3.6.14 of 2026-11-13, lists among its security fixes that the Redirector logged the CBS password in readable form in its access log, so access logs from earlier builds can hold that password ("
    urls: ["https://www.ahsay.com/en/support/help-centre/release-notes/cbs/v10.3.6.14"]
  - claim_id: 84225c6906
    entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
    surface: "record 2026-11-15T14:59:12Z"
    kind: record-summary
    text: "Ahsay's standard releases now carry the fix: the release notes of v9.17.0 (2026-11-12) and v10.3.6 (2026-11-02) list its patchset for both exploited CVEs and turn remote API access and the JSP engine off by default, so the fix no longer depends on the partner-only hotfixes, whose latest builds are v9.15.2.78 and v10.3.4.55 (2026-10-27); the current v10 build, v10.3.6.14 of 2026-11-13, also stops the Redirector logging the CBS password in readable form. CISA's catalog calls CVE-2026-105134 command injection, while Horizon3's source analysis shows a path-traversal file write."
