    text: "Find every AhsayCBS server your organisation or your managed-service suppliers run, including those on v10.3.4.0 or v9.15.2.59, and install v9.17.0 on v9 or v10.3.6 (current build v10.3.6.14) on v10, or the latest partner hotfix (v9.15.2.78 for v7 to v9, v10.3.4.55 for v10) and reboot after it, now; until then keep the management web interface behind a VPN or an allowlist of trusted addresses."
