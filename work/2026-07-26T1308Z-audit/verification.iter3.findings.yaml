  section: trending-vulnerabilities
  item: "2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave"
  url_or_quote: "sourcing_note: \"... CVSS values are left unset except where the disclosure states one.\""
  summary: "Contradicted by both cited disclosures. Gridbox (https://mysites.guru/blog/gridbox-critical-authentication-bypass/, raw): 'Disclosure and Severity 10.0 CVSS 4.0 Critical Our own assessment; tracked as CVE-2026-61425' and 'CVSS 4.0 10.0 (Critical), our own assessment' — yet cves[] CVE-2026-61425 carries cvss: null. EasyStore states the Joomla CNA's scores for all three of its CVEs ('the SQL injection (CVE-2026-65761) at 9.3 and the cross-customer invoice disclosure (CVE-2026-65760) at 9.2, with the order forgery (CVE-2026-65759) at 8.7, High') — all three carry cvss: null. Four of the entry's six CVEs have a stated score that was dropped, and the discloser's CVSS 4.0 10.0 on an anonymous-single-request-to-Super-User bypass is precisely the triage number a reader needs. Either carry the scores (noting Gridbox's is the discloser's own assessment, not a CNA score) or correct the sourcing note."
