  category: hallucinated-fact
  section: trending-vulnerabilities
  item: "2026-07-26/oracle-july-2026-cpu-fusion-middleware-cvss10-unauth"
  url_or_quote: "Access Manager, HTTP Server, WebCenter Content, Unified Directory, the WebLogic Server Proxy Plug-in, Data Integrator and Coherence are the families carrying the nine unauthenticated CVSS-10.0 fixes"
  summary: "The actions[] item enumerates seven product families as THE families carrying the nine CVSS-10.0 fixes; Oracle's own risk matrix (the entry's cited source) puts them across NINE. Parsed from Oracle's CSAF (https://www.oracle.com/docs/tech/security-alerts/cpujul2026csaf.json, all baseScore==10.0 records): CVE-2026-47056 Oracle Data Integrator (Rest Service), CVE-2026-60217 Oracle Coherence (Core), CVE-2026-60358 Oracle Access Manager, CVE-2026-60360 Oracle Unified Directory, CVE-2026-60365 Oracle HTTP Server AND Oracle Weblogic Server Proxy Plug-in, CVE-2026-60366 **Oracle Platform Security for Java** (Centralized Thirdparty Jars), CVE-2026-60379 + CVE-2026-60389 **Service Delivery Platform** (Messaging Enabler), CVE-2026-60644 Oracle WebCenter Content. The action omits Platform Security for Java and Service Delivery Platform — three of the nine CVEs — so a team working the aggregated Action Items list would not triage them. The body's own paragraph ('The remaining maximum-severity cases sit across Oracle Access Manager, HTTP Server, Platform Security for Java, WebCenter Content, Service Delivery Platform, Unified Directory and the WebLogic Server Proxy Plug-in') names all nine correctly, so the frontmatter contradicts the body. Add the two missing families to the action."
- code: F4
  id: F4.3
  category: hallucinated-fact
  section: trending-vulnerabilities
  item: "2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave"
  url_or_quote: "cves[]: CVE-2026-65759 type: sqli / auth: pre-auth · CVE-2026-65760 type: logic-flaw / auth: pre-auth · CVE-2026-65761 type: info-disclosure / auth: post-auth"
  summary: "The three EasyStore CVE ids are rotated against the cited disclosure. https://mysites.guru/blog/easystore-security-disclosure/ (fetched raw via the bridge) states it four separate times, including in a scored table: 'CVE-2026-65759 for the order forgery, CVE-2026-65760 for the cross-customer invoice disclosure and CVE-2026-65761 for the SQL injection'; 'Unauthenticated order/payment forgery CVE-2026-65759 ... 8.7 High | Unauthenticated SQL injection (full DB read) CVE-2026-65761 ... 9.3 Critical | Cross-customer order/invoice IDOR CVE-2026-65760 ... 9.2 Critical'; and 'the third, cross-customer order and invoice disclosure, is an insecure direct object reference (CWE-639) reachable by any authenticated customer'. Correct mapping: 65759 = order/payment forgery (logic-flaw, pre-auth), 65760 = cross-customer invoice IDOR (info-disclosure; mySites.guru's own read is authenticated-customer, the CNA scored PR:N), 65761 = unauthenticated SQL injection (sqli, pre-auth). The entry assigns sqli to 65759, logic-flaw to 65760 and info-disclosure/post-auth to 65761 — every one wrong, and auth wrong on 65761. state/cves_seen.json carries the same rotation ('CVE-2026-65759 — unauthenticated SQL injection', 'CVE-2026-65760 — unauthenticated order-forgery on the repayment endpoint', 'CVE-2026-65761 — cross-customer invoice/order IDOR'), so the store's CVE index is poisoned too. Machine-surface defect: automated triage consumers read cves[].type/auth."
- code: F4
