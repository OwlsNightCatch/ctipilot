  item: "2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave"
  url_or_quote: "cves[] CVE-2026-62415 — fixed: \"not stated in the cited disclosure\" · affected: \"Membership Pro for Joomla — see vendor release\""
  summary: "Contradicted by the cited disclosure. https://mysites.guru/blog/membership-pro-unauthenticated-file-upload/ (fetched raw) names the fixed release repeatedly: 'Update to 4.6.2, then run the cleanup tool', '4.6.2 automatically disables the upload endpoint when your site does not use any File custom fields', 'JoomDonation emailed customers that 4.6.2 was \"a security improvement rather than a vulnerability\"', and it references 4.6.1 as the preceding release. So fixed should be 'Membership Pro 4.6.2' and affected 'before 4.6.2'. This is the exact defect class this audit documents in its own § Imprecisions ('five OT CVEs shipping fixed: \"not stated in advisory\" when the advisory's own CSAF remediation block ... name lib60870 2.4.1') and ships a v3.29 Phase 2 fix for — reproduced in the audit's own recovered entry."
- code: F4
  id: F4.5
  category: hallucinated-fact
  section: research
  item: "2026-07-26/teleshim-bindcloak-volume-serial-keying-government-espionage"
  url_or_quote: "an ISO delivers a legitimate ASUSTek-signed binary that side-loads a malicious DLL to execute inside a trusted signed process ... so the first code to run does so inside a signed, reputable process, and application-allowlisting or signature-based controls see a trusted binary ... the ASUSTek-signed binary is genuinely signed"
  summary: "The sole cited source never states the binary is code-signed. Raw fetch of https://www.zscaler.com/blogs/security-research/targeted-attack-government-entities-middle-east-part-1 contains only TWO occurrences of 'sign*': the site-navigation 'Sign In' and 'a portable executable (PE) file with the \"MZ\" signature stripped off'. What Zscaler actually says is 'The attack chain begins with an ISO file containing a legitimate RegSchdTask.exe file from ASUSTek that sideloads a malicious DLL named AsTaskSched.dll' — legitimate, not signed. Signing is asserted four times (title 'signed-binary side-loading', summary, body, and most strongly in the Triage line 'is genuinely signed') and it carries the entry's defender takeaway about signature-based controls and application allowlisting. This is a single-source entry, so nothing else backs it. Secondary defect in the same clause: 'an ISO containing a legitimate ASUSTek-signed executable, renamed' misplaces the rename — the source puts it at the staging step ('The legitimate executable ( RegSchdTask.exe ) is copied to this path as shimgen.exe'), not in the ISO."
- code: F4
