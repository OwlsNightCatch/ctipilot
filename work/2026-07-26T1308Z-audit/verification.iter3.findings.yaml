  item: "2026-07-26/fakeagent-claude-artifact-lure-sectoprat-dll-sideloading"
  url_or_quote: "https://www.bleepingcomputer.com/news/security/fake-claude-app-promoted-by-bing-ads-pushes-sectoprat-malware/ cited as date: \"2026-07-25\" and inline as ([BleepingComputer, 2026-07-25])"
  summary: "Citation date wrong by two days. The article's own metadata (raw fetch): \"datePublished\": \"2026-07-23T15:48:30-04:00\", \"dateModified\": \"2026-07-24T01:14:48-04:00\", visible dateline 'July 23, 2026'. Two or more days is F3 per truth check 2(e). Fix sources[].date and the inline citation to 2026-07-23; the audit report's completeness item 5 ('the corroborating coverage (07-23, 07-25)') needs the same correction. The claim the citation carries is otherwise supported: BleepingComputer states 'SectopRAT, also known as ArechClient2, has been active since 2019 and is an information-stealer with HVNC (Hidden Virtual Network Computing) functionality. It allows remote hands-on operations and real-time interaction with the compromised system.'"
- code: F3
  id: F3.2
  category: claim-not-supported
  section: incidents
  item: "2026-07-26/ifage-geneva-dragonforce-data-published-student-records"
  url_or_quote: "Publication therefore cannot be read as retaliation for a refused payment; on the cited record it followed the expiry of the threat the group made a week earlier."
  summary: "Both cited sources cut against this. The primary's own lede (https://www.20min.ch/fr/story/...-103608147, raw fetch) is: 'Si la rançon demandée n'était pas payée, les pirates informatiques qui s'en sont pris en avril à l'Ifage (Fondation pour la formation des adultes à Genève) promettaient de mettre en ligne les données dérobées. C'est chose faite depuis jeudi, selon « Le Temps ».' — i.e. 20 minutes itself frames the publication as the consequence of an unpaid demanded ransom, and refers to 'la rançon demandée'. The co-cited ICTjournal (https://www.ictjournal.ch/news/2026-07-17/..., raw fetch, 'Ven 17.07.2026 - 11:30') is more explicit: 'Une rançon est désormais exigée', 'Le groupe cybercriminel DragonForce affirme avoir dérobé 850 gigaoctets de données à l'Ifage et réclame désormais une rançon', 'les pirates menacent de publier les fichiers au terme de l'ultimatum affiché sur leur site du dark web'. The foundation's own statement that no demand reached it is accurately quoted and should stay, but the entry resolves the conflict silently in the victim's favour and then asserts a causal negative. Surface it instead (a `Contradiction:` line: the leak-site ultimatum names a ransom the foundation says never reached it) and drop or hedge the 'cannot be read as retaliation' clause. Everything else in this entry verified: both French evidence quotes are exact substrings, 'C'est chose faite depuis jeudi' with a 2026-07-24 dateline gives Thursday 2026-07-23 (confirmed: 07-23 is a Thursday, 07-24 a Friday), and the expert's 'des milliers de documents, sur plusieurs années, jusqu'en 2026' backs the multi-year claim."
