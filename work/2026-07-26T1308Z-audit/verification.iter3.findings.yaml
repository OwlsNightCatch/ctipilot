  item: "2026-07-26/fakeagent-claude-artifact-lure-sectoprat-dll-sideloading, 2026-07-26/teleshim-bindcloak-volume-serial-keying-government-espionage (run record entities_added: [])"
  url_or_quote: "entities: [] on both; run record `entities_added: []`; report: 'no registry additions (all nine link only to existing canonical keys)'"
  summary: "Advisory. Five named clusters enter the store with no registry key and no entity link: the campaign name FakeAgent and the malware family SectopRAT/ArechClient2 (grep of entities/registry.yaml returns no match for either), and TELESHIM / MIXEDKEY / BINDCLOAK. Both entries name them in title and headline. The audit's own new watch item ('Zscaler TELESHIM series Part 2 ... Part 2 publishes → an update_of delta on the recovered entry') depends on that entry being findable by cluster name, and the /graph/ and per-entity timeline surfaces get nothing. No mislinking occurred, so this is advisory rather than a truth defect; consider registering malware:sectoprat and the TELESHIM toolkit cluster (or record the deliberate decision not to)."
