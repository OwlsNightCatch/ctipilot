  item: "docs/audits/2026-07-26-weekly-quality-audit.md § Verdict/§ Findings + runs/2026-07-26/2026-07-26T1308Z-audit.md § Soundness and sub_agents.truth-B4.telemetry"
  url_or_quote: "Of 57 truth-pass records, 56 returned `machine_surface: false`; the one `machine_surface: true` — on `weekly-w29-exploited-internet-facing-enterprise-software`"
  summary: "Contradicted by the artifact. grep of work/2026-07-26T1308Z-audit/truth-B*.yaml gives 46 `machine_surface: false` and 11 `machine_surface: true`, not 56/1. All 11 true values are in truth-B4.yaml, which used the field with INVERTED polarity — 10 of the 11 sit on records whose verdict is `clean` with `defect: null` (ai-tradecraft-accelerant, clickfix-crimeware-macos-coercion, eu-ci-resilience-regulatory-deadlines, vuln-status-rollup, looking-ahead, npm-supply-chain, ot-ics-advisory-wave, russia-state-nexus, thegentlemen-storm2697-status, third-party-mediated-breaches). truth-B1/B2/B3 carry `false` on all 43 of their records including their 20 non-clean ones. Iteration 1 flagged this same sentence and the remediation substituted a new unsupported number (56/1) instead of the artifact's real counts; the run record's truth-B4 telemetry `machine_surface_flagged: 1, machine_surface_confirmed: 0` is wrong the same way. The audit's substantive conclusion (no machine-surface defect survived) may still hold, but the stated counts and the B4 field's polarity must be described as they actually are."
- code: F4
