    summary: |
      MATERIAL UPDATE to the tracked IFAGE Geneva incident (entry incident:ifage-geneva-dragonforce-leak-claim-2026-07, first published 2026-07-14 as an unconfirmed DragonForce leak-site listing claiming 850 GB). On 2026-07-24, DragonForce actually published the stolen data after IFAGE (Fondation pour la formation des adultes à Genève, a Geneva adult-education foundation) declined to pay the ransom demand made on 2026-07-14. The published leak includes identity-document photos, email/postal addresses, phone numbers, and — critically — multi-year student exam results through 2026, directly contradicting IFAGE's earlier public assurance (per its May 2026 disclosure of a narrower April-2026 incident) that only employee data, not student/pedagogical data, was affected. Per Le Temps (cited within the 20 minutes report), an expert estimated thousands of documents spanning several years were exposed, and the disclosure covers both employees and beneficiaries (students, partner companies). IFAGE has filed a criminal complaint and is cooperating with cantonal police, Fedpol and judicial authorities; it maintains it received no ransom demand communication it would act on and would refuse to pay regardless.
