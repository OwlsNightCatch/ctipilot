    summary: |
      ZATAZ (French independent cybersecurity/data-breach news outlet, publishing 2026-07-26) reports that a hacker published a dossier of personal data on 24 French political figures — including MEPs Nadine Morano, Raphaël Glucksmann, Bernard Guetta, Nathalie Loiseau, Pascal Canfin and François-Xavier Bellamy — framed as protest against "Chat Control 1.0," the EU's temporary derogation from ePrivacy rules permitting detection of child-sexual-abuse-material content in electronic communications, whose renewal cleared a European Parliament procedural vote (276-286-30, insufficient to block, per ZATAZ) on 2026-07-10. The published data (photos, home addresses, phone numbers, emails, dates of birth, administrative identifiers, and for some targets banking details) was not obtained via a fresh intrusion against these individuals or the European Parliament; per the hacker's own claim (relayed uncritically by ZATAZ), it was assembled by aggregating data from prior, unrelated breaches of French public and private organizations — a doxing/data-fusion technique that converts previously-scattered breach exposure into a targeted intimidation dossier against named policymakers. ZATAZ notes the author is "known for having disclosed about ten data leaks concerning French companies," implying a track record, though the outlet does not name the handle explicitly in this piece and no independent corroboration of the hacker's identity was found.
