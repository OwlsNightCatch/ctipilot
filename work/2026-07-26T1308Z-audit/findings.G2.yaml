    summary: |
      MATERIAL UPDATE to the tracked ANCPI Romania cadastre incident (entries 2026-07-19/ancpi-romania-cadastre-cyberattack-bytetobreach and 2026-07-21/ancpi-romania-cadastre-databases-not-affected-update). Romania's National Directorate for Cybersecurity (DNSC) published an interim technical report (DNSC-T66, dated 2026-07-22, reported in Romanian tech press 2026-07-24) that supersedes the vague "databases not affected" framing with a detailed, DNSC-confirmed attack chain: attackers compromised ANCPI authentication servers, penetrated VMware vCenter (the virtualization-administration plane), enumerated all 1,083 virtual machines, executed lateral movement, deleted approximately 100 VMs, and encrypted ESXi hypervisor hosts with ransomware. Attackers also extracted GitLab source code (eTerra, GIS, ePayment, security modules, API documentation) and — the key new fact — exfiltrated approximately two million user records (names, emails, internal identifiers, encrypted password hashes) from the ePayment platform plus administrative credentials. DNSC's report DOES corroborate the narrower "core database intact" claim specifically for the Oracle Exadata database (no indication of compromise; data preserved via periodic replication to a Brașov site) — but this is a materially different and more precise claim than the store's current headline ("databases not affected"), since a separate payment-platform database with real personal data WAS confirmed exfiltrated. Root cause per DNSC: legacy/known vulnerabilities, no antivirus on production servers (Bitdefender ran only on employee workstations), and a web-application firewall retaining connection logs for only seven minutes. DNSC's director had said on 2026-07-18 the attack "could have been easily prevented" and initially found no confirmed personal-data theft; the 2026-07-24 interim report escalates that assessment substantially.
