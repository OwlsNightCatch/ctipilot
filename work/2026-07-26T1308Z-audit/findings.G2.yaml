    summary: |
      Cyberattaque.org (a C-reliability community breach-claim tracker) relayed three distinct hacker self-claims against French state/local-government-adjacent platforms within the audit window, all attributed to overlapping handles ("misere", "ChimeraZ", "Snufkxn") already associated in June 2026 with the confirmed breach of Tchap, France's sovereign government messaging platform (tracked in the registry as incident:tchap-french-government-messenger-breach; SecurityWeek and Cybernews reported ~73,000 government accounts affected). The July claims: (1) 2026-07-20, hacker "misere" (with "Snufkxn"/"ChimeraZ") claims compromise of banatic.interieur.gouv.fr — the Interior Ministry's database of intercommunal-cooperation-body (EPCI) officials — extracting 91,213 records of elected local-government representatives, denying an IDOR vulnerability was used without disclosing the actual vector; (2) 2026-07-26 (today), "misere"/CuteSec claims 111,528 records of "agents liés à différents services de l'État" (internal IDs, names, professional/personal emails), framed as protest against the EU "Chat Control" legislation; (3) 2026-07-24/25, actor "ChimeraZ" claims ~4,800 personnel profiles and 34+ GB from four French SDIS (fire-and-rescue departments: Alpes-Maritimes, Marne, Alpes-de-Haute-Provence, Landes). In EVERY case, the French Ministry of Interior and the named SDIS departments have NOT issued public confirmation, and no Admiralty A/B-grade journalism corroborating the specific July claims was found despite repeated targeted searches. This is reported as an unconfirmed claims cluster, not a confirmed breach — its value is the pattern (a named, previously-confirmed actor cluster continuing a campaign against French public-sector platforms) rather than any single claim's veracity.
