      This is the direct answer to the carried-forward ANCPI watch item. Ground truth as of 2026-07-26: the store's current position ("databases not affected") is PARTIALLY superseded — it remains true only for the specific core Oracle Exadata database; DNSC's own interim report confirms actual data theft (2 million payment-platform user records) that the store's existing entries do not reflect. Recommend a new update-of entry rather than editing the existing ones (entries are immutable). Classification suggestion: reliability B (DNSC is Romania's national cybersecurity authority — Admiralty A tier — but this finding is sourced via journalism reprints of its report rather than a directly fetched DNSC first-party page, so B is the conservative call), credibility 1 (corroborated across three independent Romanian outlets citing the same DNSC document).

