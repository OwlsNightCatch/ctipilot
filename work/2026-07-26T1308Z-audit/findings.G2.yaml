  - title: "Wave of unconfirmed leak-site claims against French government-adjacent platforms in the audit window (BANATIC/Interior Ministry local-government database, Interior Ministry agent/gendarme claim, four SDIS fire-and-rescue departments) — same actor cluster as the already-tracked Tchap breach, NONE officially confirmed"
