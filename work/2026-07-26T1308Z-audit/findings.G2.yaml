  - title: "Hacker doxes 24 French politicians who backed the EU 'Chat Control' compromise text, assembling banking/ID data from prior unrelated breaches as a pressure campaign"
    sources:
      - { url: "https://www.zataz.com/chat-control-un-pirate-cible-24-responsables-politiques-francais/", publisher: "ZATAZ", date: "2026-07-26", role: "primary" }
