- entry: entries/2026-07-19/weekly-w29-identity-trust-relationship-abuse.md
  verdict: imprecision
  defect: "Body attributes BOTH the password reset AND the '(over multiple attempts) its 2FA' reset to the TfL helpdesk-vishing social-engineering act ('socially engineered a TfL helpdesk worker into resetting an employee account's password and, over multiple attempts, its 2FA'). The Register's actual text separates these: the 2FA reset via multiple attempts is attributed to using the PURCHASED STOLEN CREDENTIALS directly ('purchased partial TfL credentials ... and used those to reset the 2FA on employee accounts, a process that took multiple attempts'), while the helpdesk social-engineering is stated only for the PASSWORD reset ('impersonated an employee and socially engineered a TfL helpdesk worker into resetting the password'). The entry's single combined clause overstates the helpdesk's role in the 2FA reset."
  ground_truth: "The Register, 2026-07-16: 'Flowers and Jubair purchased partial TfL credentials from well-known criminal forums and used those to reset the 2FA on employee accounts, a process that took multiple attempts. Woolwich Crown Court heard that the pair impersonated an employee and socially engineered a TfL helpdesk worker into resetting the password for their account.'"
  ground_truth_url: "https://www.theregister.com/cyber-crime/2026/07/16/brit-scattered-spider-duo-handed-tickets-to-prison-over-transport-for-london-attack/5272446"
  machine_surface: false
