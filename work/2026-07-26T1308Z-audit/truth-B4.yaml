- entry: entries/2026-07-19/weekly-w29-exploited-internet-facing-enterprise-software.md
  verdict: factual-error
  defect: "The ShareFile sentence conflates two DIFFERENT vulnerabilities as one continuous story: it names CVE-2026-2699 (pre-auth auth bypass, patched earlier in the year per BankInfoSecurity, already fixed in SZC 5.12.4 per the referenced operational entry's own cves[] block) as the vulnerability actively exploited the same day as the shutdown, then says 'Progress later named a path-traversal root cause and shipped 5.12.5/6.0.2' -- but BleepingComputer (fetched, full text) states the path-traversal flaw behind the shutdown has its OWN separate, still-unpublished reserved CVE ('Progress says a CVE identifier has been reserved for the vulnerability, and it will be published in two weeks'), and never mentions CVE-2026-2699. So the 5.12.5/6.0.2 patch and the path-traversal root cause do NOT belong to CVE-2026-2699 -- the entry incorrectly implies they do by placing both facts in one CVE-labelled sentence chain."
  ground_truth: "BleepingComputer: 'Progress says its investigation identified a high-severity path traversal vulnerability affecting all 5.x and 6.x versions... Progress says a CVE identifier has been reserved for the vulnerability, and it will be published in two weeks.' BankInfoSecurity (on CVE-2026-2699): 'a critical authentication bypass vulnerability the vendor patched earlier this year' -- a distinct, already-patched CVE being separately exploited via honeypot telemetry, unrelated to the July shutdown's root cause."
  ground_truth_url: "https://www.bleepingcomputer.com/news/security/progress-confirms-sharefile-zero-day-flaw-behind-storage-zone-shutdown/"
  machine_surface: true
