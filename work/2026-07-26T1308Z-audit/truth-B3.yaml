- entry: entries/2026-07-24/laundry-bear-zimbra-zero-click-cve-2025-66376.md
  verdict: imprecision
  defect: >-
    Per-fact mis-attribution: the sentence "a stored cross-site-scripting flaw in the Zimbra Collaboration
    Suite (ZCS) Classic Web Client caused by improper sanitisation of CSS @import directives in HTML email"
    is cited to Unit 42, whose post contains neither the CSS @import mechanism nor "Classic Web Client";
    the fact belongs to the co-cited CISA advisory. Secondary: the body cites The Hacker News inline for
    the "does not revoke what the last one left behind" quote, but thehackernews.com is not in sources[].
  ground_truth: >-
    Unit 42's post says only "the group leveraged zero-click phishing emails that exploit a vulnerability in
    the Zimbra Collaboration Suite (ZCS) webmail platform (CVE-2025-66376)" and "Threat actors continue to
    actively target unpatched ZCS instances using CVE-2025-66376" (evidence quote verbatim); zero
    occurrences of "@import", "Cascading" or "Classic". CISA AA26-204A carries the mechanism verbatim.
    All machine-surface facts verified correct: CVE-2025-66376 CNA CVSS 7.2 / NVD 6.1; EPSS 0.12009 as of
    2026-07-23 (= 12.01%); CISA KEV dateAdded 2026-03-18; affected ZCS 10.0<10.0.18, 10.1<10.1.13; both
    CISA evidence quotes verbatim; 20 SearchGalRequest batches of 77; NCSC-UK 16 nations and sector list;
    all 10 techniques[] active in ATT&CK v19.1.
  ground_truth_url: https://unit42.paloaltonetworks.com/russian-webmail-espionage/
  machine_surface: false

- entry: entries/2026-07-24/mitel-micollab-awv-unauth-command-injection.md
  verdict: imprecision
  defect: >-
    The uncited claim that carries the entry's inclusion justification — "an earlier MiCollab unauthenticated
    RCE was exploited in the wild in 2025" (repeated in sourcing_note) — misstates the vulnerability class,
    and the KB000128275 backport-patch detail is cited to CERT-FR, which does not mention it.
  ground_truth: >-
    The 2025 in-the-wild-exploited MiCollab flaws are CVE-2024-41713 and CVE-2024-55550, both added to CISA
    KEV on 2025-01-07 and both catalogued as "Mitel MiCollab Path Traversal Vulnerability" — unauthenticated
    file read / auth bypass, not RCE. CERTFR-2026-AVI-0911 (23 juillet 2026) contains no occurrence of
    "KB000128275", "backport" or "retroportage"; the backport patches and KB number are stated by Mitel
    MISA-2026-0006. Note also a source conflict the entry does not surface: Mitel lists 10.2 SP1 FP2
    (10.2.1.205) as affected, CERT-FR lists "MiCollab versions 10.2.x anterieures a 10.2 SP1 FP2
    (10.2.1.205)". Verified correct: CVSS 9.8 AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H, MTLVULN-1694, CVE
    requested-not-assigned, fix 10.3.0.18, both evidence quotes, no exploitation reported.
  ground_truth_url: https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-0911/
  machine_surface: false

