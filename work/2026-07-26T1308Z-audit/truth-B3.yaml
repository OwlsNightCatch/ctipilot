    ("updating to the latest build"). All five CVSS pairs verified exactly against the advisories:
    CVE-2026-49035 8.1/9.2, CVE-2026-50039 7.5/8.7, CVE-2026-50032 7.5/8.7, CVE-2026-50103 6.5/7.1,
    CVE-2026-16002 8.2/8.8; affected ranges (libIEC61850 1.0.0-1.6.1, lib60870 <=2.4.0), the CVE-to-mechanism
    mapping (50103 = L2 GOOSE/R-GOOSE TLV, 50032 = MMS Write Named Variable List empty listOfData) and both
    evidence quotes are all correct.
