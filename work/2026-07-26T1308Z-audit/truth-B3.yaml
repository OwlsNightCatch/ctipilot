- entry: entries/2026-07-25/laundry-bear-zimreaper-app-password-persistence.md
  verdict: imprecision
  defect: >-
    The headline and summary attribute to Proofpoint a persistence property Proofpoint never states — that the
    "ZimbraWeb" app-specific password "survives both a user password reset and the CVE-2025-66376 patch"
    ("Proofpoint adds the mechanics ... including a persistence trick patching doesn't remove"); the body
    presents it as the entry's own inference, but the frontmatter ships it as a cited finding. The CISA
    source is also dated 2026-07-24 in sources[] while AA26-204A is dated 2026-07-23.
  ground_truth: >-
    Proofpoint's post says "ZimReaper also uses CreateAppSpecificPasswordRequest to set up an app-specific
    password under the name 'ZimbraWeb' for persistent access to the mailserver. This password allows attacker
    access via IMAP, POP3, or SMTP without needing two-factor authentication" — the page contains no
    occurrence of "survive" or "password reset". CISA AA26-204A likewise only says Application Passcodes
    "may still be necessary and should be monitored closely" and that a ZimbraWeb-named passcode is "almost
    certainly malicious". (The survival property is asserted by The Hacker News, cited in the parent entry,
    not by either source of this one.) Verified correct: both evidence quotes verbatim including the source's
    own ellipsis in <svg onload="eval(atob('...'))">, the taskmasters/deconfliction hedge, "no TA488 activity
    since February 2026", DNS Base32 exfiltration, update_of target, registry alias ZimReaper.
  ground_truth_url: https://www.proofpoint.com/us/blog/threat-insight/ta488-targets-zimbra-mailservers-half-click-exploits
  machine_surface: false

- entry: entries/2026-07-25/microsoft-email-threat-landscape-q2-2026-teams-vishing-surge.md
  verdict: imprecision
  defect: >-
    The entry's second headline finding over-generalises scope and invents a cause: the title/summary/body
    present the PDF-to-DOC/DOCX drift as a shift in "attachment lures" / "attachment-based phishing"
    "following the disruption of the Tycoon2FA adversary-in-the-middle kit", but the report's percentages are
    shares of QR-code attacks only, and the report ascribes the swap to routine format rotation, not to the
    Tycoon2FA takedown.
  ground_truth: >-
    The report states "The delivery methods used in QR code attacks shifted notably during Q2. PDF attachments
    ... peaked at 79% of QR code attacks in April before falling to 59% in May and 58% in June ... DOC/DOCX
    attachments ... reached 40% of QR code attacks. This swap between PDF and DOC/DOCX dominance is a pattern
    that has recurred throughout the past year, as operators appear to rotate between delivery formats."
    Separately, "HTML and PDF attachments remained the two most common malicious payload types across the
    quarter" — i.e. no PDF-to-DOCX shift is claimed for payloads overall. The Tycoon2FA disruption is linked
    in the report to the collapse in CAPTCHA-gated and QR volumes, not to attachment-type choice. Verified
    correct: both evidence quotes verbatim; 4-6% malware share; 14:00-20:00 UTC Mon-Fri with near-zero
    weekends; email-embedded QR codes "dropped to near-zero"; the SES/Python-MIME BEC campaign (67,000 users,
    42,000 orgs, under three hours, 1x1 open-tracking pixel) and the EML/multi-tenant-Entra/BAT-dropper chain;
    FIDO2-Windows Hello and ZAP guidance. No vendor vanity metrics were carried into the entry.
  ground_truth_url: https://www.microsoft.com/en-us/security/blog/2026/07/23/email-threat-landscape-q2-2026-trends-and-insights/
  machine_surface: false

- entry: entries/2026-07-25/stiftung-autismuslink-bern-inc-ransom-breach.md
  verdict: imprecision
  defect: >-
    The body's closing analytical claim — "a relatively rare case of same-day victim self-disclosure and
    leak-site claim converging" — is contradicted by the victim notice's own publication date: it went online
    roughly two weeks before the INC Ransom listing, and the entry's own frontmatter dates the statement only
    to "2026-07" with no day, so there was no basis for "same-day".
  ground_truth: >-
    The victim PDF returns HTTP 200 with "last-modified: Thu, 09 Jul 2026 14:22:03 GMT"; Ransomware.live
    states "discovered on 2026-07-24 that autismuslink.ch has been claimed by Incransom" — a ~15-day gap.
    Everything else verified verbatim against the notice: both German evidence quotes; detection Monday
    29.06.2026 with immediate internet disconnection; Infoguard engaged the same day; federal authorities
    informed and a police report filed; "Backupsysteme ... sind nicht vom Angriff betroffen"; the data
    classes (Leistungsvereinbarungen mit der IV und der BKD, Vertraege von Lehrpersonen, Arztzeugnisse,
    Gesamtes Klient*innen Dossier Archiv 2016 bis 2023). No IOCs; registry key actor:inc-ransom correct.
  ground_truth_url: https://autismuslink.ch/wp-content/uploads/2026_07_Informationsschreiben_zum_Serverausfall_Extern.pdf
  machine_surface: false

- entry: entries/2026-07-25/ta458-roundpress-webmail-zero-days-sogo-cve-2026-8496.md
  verdict: imprecision
  defect: >-
    The freshness framing of CVE-2026-8496 is wrong: the title ("a fresh SOGo flaw"), summary ("newly
    disclosed") and body ("Proofpoint's 2026-07-23 report is the first to ... disclose a previously-unknown
    SOGo flaw within it") present the vulnerability as first disclosed in-window, when it had been public and
    patched for roughly ten weeks — what is actually new is TA458's attributed use of it.
  ground_truth: >-
    CVE-2026-8496 was published on 2026-05-13 by cret@cert.org (CERT/CC), described as an XSS in "Alinto SOGo,
    version 5.12.7" via a crafted ICS calendar invitation, CVSS 3.1 6.1 (UI:R); the fix shipped in the SOGo
    5.12.8 release of 12 May 2026, which the entry itself cites. Proofpoint's own wording is "In March 2026,
    Proofpoint discovered TA458 exploiting a zero-day vulnerability in the SOGo webmail platform, which we
    reported to the vendor, Alinto; it was patched as CVE-2026-8496 in version 5.12.8." Verified correct: the
    full five-CVE set (CVE-2025-27915 Zimbra, CVE-2025-3929 mDaemon, CVE-2023-43770 and CVE-2024-42009
    Roundcube, CVE-2026-8496 SOGo), the no-CVE Kerio flaw found March 2026, CVE-2025-49113 with the
    Crypt_GPG_Engine deserialization gadget and PHP webshells, the Albania/Greece/Moldova/Tuerkiye targeting,
    all three evidence quotes verbatim, the TA422 no-overlap hedge, and the ESET 2025-05-15 Sednit attribution.
  ground_truth_url: https://services.nvd.nist.gov/rest/json/cves/2.0?cveId=CVE-2026-8496
  machine_surface: false

