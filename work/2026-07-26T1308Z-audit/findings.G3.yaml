  - title: "FakeAgent: a malvertising campaign hosted a fake Claude Desktop installer on Anthropic's own claude.ai domain to deliver SectopRAT via DLL side-loading, hitting 29 organisations"
    sources:
      - { url: "https://www.huntress.com/blog/fakeagent-claude-desktop-malvertising-ends-in-dotnet-rat", publisher: "Huntress", date: "2026-07-22", role: "primary" }
      - { url: "https://www.helpnetsecurity.com/2026/07/23/anthropic-claude-artifacts-download-malware/", publisher: "Help Net Security", date: "2026-07-23", role: "corroborating" }
      - { url: "https://www.bleepingcomputer.com/news/security/fake-claude-app-promoted-by-bing-ads-pushes-sectoprat-malware/", publisher: "BleepingComputer", date: "2026-07-25", role: "corroborating" }
    discovery_trace: "first seen at: WebSearch (\"Huntress blog research July 2026 threat\") -> pivot: itsecurityguru.org, URL https://www.itsecurityguru.org/2026/07/23/fakeagent-campaign-malicious-claude-artifact-used-to-distribute-sectoprat-to-29-organisations/ -> primary: Huntress, URL https://www.huntress.com/blog/fakeagent-claude-desktop-malvertising-ends-in-dotnet-rat"
    summary: |
      Huntress documents (2026-07-22) a malvertising campaign it names FakeAgent: victims searching Bing for "Claude Desktop app" were served a sponsored ad pointing to a legitimate claude.ai domain, but the link resolved to a public, user-created Claude Artifact (viewed 7,100 times before Anthropic removed it) built to imitate the official Claude Desktop download page — abusing the platform's own trusted domain to host a convincing lure (T1583.008 Malvertising, T1204.001 Malicious Link). The artifact redirected to attacker-controlled infrastructure serving a fake installer, ClaudeDesktop.exe. Execution DLL-side-loads a repurposed JetBrains Chromium-Embedded-Framework helper (jcef_helper.exe replaced/renamed, sideloading a trojanised libcef.dll packed with VMProtect) for initial execution, and a secondary persistence mechanism abuses an IBM SPSS binary (sslconf.exe sideloading tempdir.dll) that adds GPU-based anti-VM checks and decrypts its payload via a compiled DirectX shader routine (T1574.001, T1027.002). The delivered payload is SectopRAT (aka ArechClient2), an information-stealer/RAT active since 2019 with HVNC hands-on-keyboard capability that targets browser credentials, cookies, autofill, credit-card data, FTP credentials and Discord/Telegram session data; C2 infrastructure is hosted via an Ethereum-blockchain-based resolution scheme ("EtherHiding", T1102.002) for takedown resilience. Huntress confirms at least 29 organisations were compromised between 2026-07-21 and 2026-07-22, and links the operator (tracked since December 2025) to an earlier Docker-based malware-distribution campaign and a possible StealC-operator connection via a previously-seized domain.
    region_nexus: "global; any organisation whose staff search for AI-assistant desktop apps is exposed — directly relevant to Swiss/EU public-sector and enterprise users adopting Claude Desktop"
    primary_sector_nexus: "indirect"
    sector: "all sectors (identity/endpoint, AI-tool supply chain)"
    cves: []
    techniques: [T1583.008, T1204.001, T1574.001, T1027.002, T1102.002]
    affected_products: ["Claude Desktop (Anthropic)", "JetBrains Chromium Embedded Framework runtime", "IBM SPSS"]
    entity_keys: []
    new_entities:
      - { key: "malware:sectoprat", type: malware, name: "SectopRAT", aliases: ["ArechClient2"], summary: "Information-stealer/RAT active since 2019 with HVNC hands-on-keyboard capability, targeting browser credentials, cookies, autofill/credit-card data, FTP and Discord/Telegram session data; delivered in the 2026-07-21/22 FakeAgent Claude Desktop malvertising campaign (Huntress)." }
      - { key: "campaign:fakeagent-claude-desktop-malvertising-2026", type: campaign, name: "FakeAgent", aliases: [], summary: "Huntress-named malvertising campaign (2026-07-21/22) that abused a public Claude.ai Artifact and Bing ads to distribute a trojanised ClaudeDesktop.exe delivering SectopRAT via DLL side-loading to at least 29 organisations." }
    relation_suggestions:
      - { subject: "campaign:fakeagent-claude-desktop-malvertising-2026", object: "malware:sectoprat", basis: "Huntress: the campaign delivered SectopRAT via a DLL-sideloaded VMProtect-packed payload (Huntress, 2026-07-22)" }
