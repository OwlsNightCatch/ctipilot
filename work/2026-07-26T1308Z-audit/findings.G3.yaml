  - title: "An exposed WebDAV malware-delivery lab reveals AI-assisted, factory-style testing of CVE-2025-33053 (.url/.lnk working-directory hijack) and ClickFix lure generation, with an active campaign against Mexico"
    sources:
      - { url: "https://www.rapid7.com/blog/post/tr-exposed-webdav-malware-delivery-lab-analysis/", publisher: "Rapid7", date: "2026-07-20", role: "primary" }
      - { url: "https://thehackernews.com/2026/07/exposed-server-reveals-ai-assisted.html", publisher: "The Hacker News", date: "2026-07-20", role: "corroborating" }
    discovery_trace: "first seen at: rapid7-research, URL https://www.rapid7.com/blog/ (listing sweep) -> primary: Rapid7, URL https://www.rapid7.com/blog/post/tr-exposed-webdav-malware-delivery-lab-analysis/"
    summary: |
      Rapid7's MDR practice pivoted from a single WebDAV-based rundll32 execution alert to discovering a fully operational, exposed malware-testing server containing 1,048 artifacts arranged like a QA/development workspace: 453 shortcut-based delivery launchers, 236 file-name-spoofing tests, 146 URL/trusted-Windows-tool execution tests, 89 encrypted droppers, plus ClickFix HTML pages and internal operator documentation. The operator was systematically testing CVE-2025-33053, a flaw in how Windows resolves a shortcut (.url) file's working directory that lets a legitimate binary be tricked into loading/executing a similarly-named file from an attacker-controlled remote WebDAV share rather than the local filesystem (T1105 Ingress Tool Transfer via WebDAV, chained through T1204.002 Malicious File). Delivery combines WebDAV over HTTP/HTTPS with search-ms: URIs to invoke remote .scr executables disguised as documents, and ClickFix pages impersonating Cloudflare, Adobe and Discord to socially-engineer victims into pasting/running commands themselves (T1204.004 Malicious Copy and Paste). LLM-generated README documentation and bulk-created lure variants (invoice and salary-statement themes) evidence the operator using generative AI to run the operation "like a modern software product team" rather than hand-crafting each lure. One theme was already live: a CURP (Mexican national ID) phishing campaign recorded 2,384 launches of a disguised .scr file delivering PureRAT 4.4.3 to victims in Mexico.
    region_nexus: "global tradecraft (CVE-2025-33053 WebDAV working-directory hijack, ClickFix social engineering, AI-assisted lure factories) directly transferable to Swiss/EU phishing-defence and endpoint-detection tuning; the confirmed live campaign targets Mexico"
