  - title: "TELESHIM/MIXEDKEY/BINDCLOAK — an East-Asia-linked actor's DLL-sideload espionage toolkit against Middle East government entities, with Telegram-API C2 and volume-serial-number environmental keying"
    sources:
      - { url: "https://www.zscaler.com/blogs/security-research/targeted-attack-government-entities-middle-east-part-1", publisher: "Zscaler ThreatLabz", date: "2026-07-20", role: "primary" }
    discovery_trace: "first seen at: WebSearch (\"Zscaler ThreatLabz research report July 2026\") -> primary: Zscaler ThreatLabz, URL https://www.zscaler.com/blogs/security-research/targeted-attack-government-entities-middle-east-part-1 (no pivot needed)"
    summary: |
      Zscaler ThreatLabz documents (Part 1, published 2026-07-20) a previously undocumented toolkit — TELESHIM, MIXEDKEY and BINDCLOAK — deployed against Middle East government entities by an actor ThreatLabz assesses with moderate-to-high confidence operates out of East Asia (basis: IP geolocation, configured system locale, and operational hours matching regional working timeframes). Initial access begins with an ISO file containing a legitimate ASUSTek-signed binary (renamed to shimgen.exe) that DLL-side-loads a malicious library (AsTaskSched.dll) to gain execution inside a trusted, signed process — T1574.001. The first-stage backdoor TELESHIM persists via scheduled tasks and communicates with C2 by abusing the Telegram Bot API so traffic blends with legitimate internet traffic (T1102.002). TELESHIM and the reflective loader MIXEDKEY use heavy anti-analysis obfuscation — control-flow flattening, mixed boolean arithmetic and opaque predicates (T1027) — and the final BINDCLOAK implant is only decrypted using a key derived from the victim machine's volume serial number (environmental keying, T1480.001), ensuring the payload only executes on the intended target and frustrating sandbox/analyst detonation.
    region_nexus: "victim geography is Middle East government entities; the technique class (trusted-binary DLL side-loading via ISO delivery, Telegram-API C2, environmental-keying anti-sandbox payload gating) is directly transferable to espionage tradecraft hunting against Swiss/EU government targets"
