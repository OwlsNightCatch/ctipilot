  - title: "Google Threat Intelligence Group retires legacy Mandiant/TAG actor-naming systems for a unified cryptonym schema"
    sources:
      - { url: "https://cloud.google.com/blog/topics/threat-intelligence/updated-cyber-threat-actor-naming-system/", publisher: "Google Cloud / Mandiant (GTIG)", date: "2026-07-24", role: "primary" }
    discovery_trace: "first seen at: mandiant-gtig, URL https://feeds.feedburner.com/threatintelligence/pvexyqv7v0v (feed sweep) -> primary: Google Cloud Blog / GTIG, URL https://cloud.google.com/blog/topics/threat-intelligence/updated-cyber-threat-actor-naming-system/ (no pivot needed)"
    summary: |
      Google Threat Intelligence Group (GTIG) announced (2026-07-24) that it is retiring the separate Mandiant and Google Threat Analysis Group (TAG) tracking taxonomies in favour of one unified, cryptonym-based naming system across the merged organisation. The new schema uses memorable two-word combinations where the first word is a free-form identifier and the second word encodes actor category/origin (examples given: CASTLE for PRC-nexus, ION for Iran-nexus, NEPTUNE for DPRK-nexus, RELIC for Russia-nexus, COMET for cybercriminal), replacing sequential/alphanumeric designators. GTIG states prior designations (including legacy APT-numbered and UNC-prefixed clusters) remain searchable in the Google Threat Intelligence platform with mappings preserved, and that "uncategorized" (UNC) designations continue for early-stage, insufficiently-characterized clusters pending promotion. For defenders and CTI teams that maintain their own entity-registry mappings against Mandiant/GTIG-sourced clusters, this is an operationally material naming-convention change: existing internal aliases, detection-rule tags, and threat-actor dashboards keyed to old Mandiant/TAG identifiers will need a mapping-table update as GTIG republishes historical reporting under new cryptonyms.
    region_nexus: "global; affects every organisation that maps internal threat-actor tracking to Mandiant/GTIG designations, including Swiss/EU CTI teams and this pipeline's own entity registry"
    primary_sector_nexus: "indirect"
    sector: "all sectors (CTI/threat-intelligence tradecraft)"
    cves: []
    techniques: []
    affected_products: []
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Today, Google Threat Intelligence Group (GTIG) will begin rolling out a unified naming schema for tracking threat actors."
        attribution: "Google Cloud / Mandiant (GTIG)"
        source_url: "https://cloud.google.com/blog/topics/threat-intelligence/updated-cyber-threat-actor-naming-system/"
      - quote: "The new naming convention aligns with industry standard threat actor naming systems."
        attribution: "Google Cloud / Mandiant (GTIG)"
        source_url: "https://cloud.google.com/blog/topics/threat-intelligence/updated-cyber-threat-actor-naming-system/"
      - quote: "Because no two organizations have the exact same visibility into the threat landscape, direct, apples-to-apples comparisons between threat actors are rarely possible."
        attribution: "Google Cloud / Mandiant (GTIG)"
        source_url: "https://cloud.google.com/blog/topics/threat-intelligence/updated-cyber-threat-actor-naming-system/"
    extended_notes: |
      Single-source (GTIG's own announcement of its own internal taxonomy — a first-party statement about the source's own convention, not a third-party claim needing corroboration). No specific old-name-to-new-name mapping table was published in this initial post; GTIG says historical reporting will be republished progressively under the new cryptonyms. Worth a light registry-hygiene note for this pipeline: existing entity_keys sourced from Mandiant/GTIG reporting (e.g. any UNC-prefixed keys) may eventually need an alias-only update (never a rename) once GTIG republishes under the new schema — flagged for W1's watchlist/registry sweep, not an action for this run.
