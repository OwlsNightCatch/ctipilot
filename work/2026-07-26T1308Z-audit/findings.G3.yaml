      Detection angle worth carrying into composition: the discovery began from a single MDR alert on WebDAV-based rundll32 execution — a concrete, vendor-neutral telemetry hook (process-creation events showing rundll32.exe or a trusted binary with a WebClient/UNC-path command line, or DNS/network telemetry showing outbound WebDAV (HTTP PROPFIND/registered davclnt.dll usage) to unusual destinations) that any SOC could replicate as a hunt query independent of Rapid7's own tooling.
