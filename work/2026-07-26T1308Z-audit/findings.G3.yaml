      - quote: "By maliciously modifying that function in the DLL, an adversary can achieve execution in the context of a trusted and signed executable"
        attribution: "Huntress"
        source_url: "https://www.huntress.com/blog/fakeagent-claude-desktop-malvertising-ends-in-dotnet-rat"
      - quote: "the malware's decryption routine isn't a typical CPU-based decryption routine: instead, it is a compiled DirectX shader"
        attribution: "Huntress"
        source_url: "https://www.huntress.com/blog/fakeagent-claude-desktop-malvertising-ends-in-dotnet-rat"
    extended_notes: |
      Strong candidate for a `**Triage:**` benign-lookalike note in composition: legitimate Claude Artifacts are explicitly user-generated/unverified content per Anthropic's own on-page disclaimer ("Content is user-generated and unverified"), so the discriminator for defenders is NOT the domain (claude.ai is genuine) but the artifact being a software-download page at all — Anthropic's real Claude Desktop distribution never routes through a public Artifact link. Multi-source corroborated (Huntress primary + Help Net Security + BleepingComputer picked up the story within days, all still in-window).
