- entry: entries/2026-07-22/langflow-cve-2026-0770-exploited-ncsc-nl-15-cve-batch.md
  verdict: factual-error
  defect: >-
    Two errors on the entry's central remediation guidance: (a) the CVE-2026-0770 record asserts an
    AUTO_LOGIN=true + unchanged-default-credentials precondition and "no version patch — mitigated by
    disabling AUTO_LOGIN / rotating default credentials", both contradicted by the discloser's per-CVE
    advisory; (b) the body and the action item state all 15 NCSC-2026-0251 CVEs are "fixed in 1.10.1", but
    CVE-2026-14499 in that same advisory is affected THROUGH 1.10.1 and requires 1.10.2.
  ground_truth: >-
    ZDI-26-036, the discloser's per-vulnerability advisory for CVE-2026-0770 (CVSS 9.8,
    AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H, published 2026-01-09; identical text in the PUBLISHED CVE record):
    "This vulnerability allows remote attackers to execute arbitrary code on affected installations of
    Langflow. Authentication is not required to exploit this vulnerability. The specific flaw exists within
    the handling of the exec_globals parameter provided to the validate endpoint." No AUTO_LOGIN,
    default-credential or deployment-configuration precondition appears anywhere in the ZDI advisory or in
    the CISA KEV record; KEV's vendor-remediation note for CVE-2026-0770 points at the langflow v1.9.0
    release, not at a configuration change. The AUTO_LOGIN -> /api/v1/validate/code exec() chain the entry
    attributes to CVE-2026-0770 is in fact IBM's own CVE-2026-9103 ("issues long-lived superuser bearer
    tokens without requiring authentication when the AUTO_LOGIN configuration is enabled (enabled by
    default)"), CVE-2026-8481 (validate/code exec() without sandboxing) and CVE-2026-9198 (the chain of the
    two) — all three fixed by IBM in Langflow OSS 1.10.1.
    On (b): IBM security bulletin node 7279996 (2026-07-14) for CVE-2026-14499, one of the 15 CVEs listed in
    NCSC-2026-0251, reads "Affected Product(s) Version(s) Langflow OSS 1.0.0-1.10.1" and "IBM strongly
    recommends addressing the vulnerability now by upgrading Langflow OSS to version 1.10.2". An estate that
    follows this entry's action item and stops at 1.10.1 remains exposed to it.
    Verified CORRECT in this entry: the 15-CVE count in NCSC-2026-0251; the CISA KEV addition on 2026-07-21
    and the KEV vulnerability name quoted verbatim; the ZDI evidence quote verbatim; CVSS 9.8 / 9.9 / 9.9 and
    the 1.0.0-1.10.0 affected + 1.10.1 fixed boundaries for CVE-2026-9202, CVE-2026-8859 and CVE-2026-9135
    against IBM bulletins 7278929 / 7278924 / 7278920; the pre-auth vs post-auth split (PR:N vs PR:L); and
    the CVE-2026-7754 SSRF and CVE-2026-7755 MCP-config-RCE mappings. One further small mapping slip: the
    apply_tweaks() parameter-override reachability the entry attaches to CVE-2026-8476 is IBM's
    CVE-2026-8056; IBM's CVE-2026-8476 text covers only the AsyncDiskCache pickle.loads() deserialization
    (NCSC-NL bundles both flaws in a single bullet, which is the likely origin).
  ground_truth_url: https://www.zerodayinitiative.com/advisories/ZDI-26-036/
  machine_surface: false

- entry: entries/2026-07-22/south-korea-knda-elearning-zero-day-breach.md
