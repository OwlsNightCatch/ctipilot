- entry: entries/2026-07-22/xentry-team-bitlocker-lotl-extortion-rmm-gpo.md
  verdict: imprecision
  defect: >-
    The frontmatter summary states "Both demanded small ransoms (~USD 3,000)"; Kaspersky gives a ransom
    figure for only one of the two incidents.
  ground_truth: >-
    The Securelist report contains exactly one monetary figure across the whole article: "The communication
    with the attackers revealed a demand for just $3,000", in the first (Colombia, June, internet-exposed
    RDP) case. No ransom amount is stated for the Mexico / "XEntry Team" case. The entry's body attributes
    the $3,000 correctly to the Colombia case only — the overstatement is confined to the frontmatter
    summary, which is the machine-consumed surface. Everything else verified: all three evidence quotes are
    contiguous verbatim substrings; two incidents (Colombia June, Mexico May); MSSQL 2019 misconfigured to
    allow OS command execution via xp_cmdshell; ManageEngine Endpoint Central, Mesh Agent and Tactical RMM;
    the mid-May GPO deployment of BitLocker activation/encryption tasks; "Hacked by XEntry Team" displayed on
    a blue screen; ransom notes printed on office printers; the ShrinkLocker lineage; and Kaspersky's explicit
    hedge that the notes "do not reveal a clear connection between the actors". Not a defect but worth noting
    for completeness: Kaspersky adds that the MSSQL credentials came from code insecurely published on
    GitHub, a detail the entry omits.
  ground_truth_url: https://securelist.com/new-extortion-scheme-printers-bitlocker/120718/
  machine_surface: false

- entry: entries/2026-07-22/zimbra-10-1-20-snmp-command-injection-rce-plus-stored-xss.md
  verdict: imprecision
  defect: >-
    The entry characterises all four Classic Web Client XSS issues as stored ("four Classic Web Client
    stored-XSS bugs"; "Four **stored** cross-site-scripting bugs"); Zimbra labels only one of the four as
    stored and leaves the other three uncharacterised.
  ground_truth: >-
    Zimbra's 10.1.20 post lists "A stored cross-site scripting (XSS) vulnerability in the Classic Web Client
    that could allow malicious attachment filenames to execute script under specific conditions" and then
    three items worded only as "A XSS vulnerability in the Classic Web Client where ..." with no
    stored/reflected characterisation. Everything else verified: nine security issues; release date
    2026-07-20; both evidence quotes contiguous verbatim, including the parenthetical "(Permanent fix for the
    vulnerability disclosed in our security advisory on 26th June 2026)"; the withholding note ("In line with
    industry best practices, information disclosure is limited for security vulnerability fixes."); the
    Nextcloud-integration SSRF; the EWS access-control and mailbox-delegation items; CVE-2026-50055 mapped to
    the mail-forwarding bypass by The Hacker News (2026-07-21, which also states none of the flaws is flagged
    as actively exploited); CVE-2026-50055 / CVE-2026-10631 / CVE-2026-50054 all confirmed state=RESERVED in
    the CVE Services registry; NCSC-CH post 12782 published 2026-07-21 with "Current exploitation status:
    UNKNOWN". Two further minor points: the BSI advisory carries "Datum 20.07.2026 / Stand 21.07.2026", so
    the inline "[BSI CERT-Bund, 2026-07-21]" is its revision rather than publication date, and the BSI CVE
    tab could not be rendered by any transport this pass, so the -10631 / -50054 ids rest on the entry's own
    (honestly declared) BSI reading. "pending wider patch adoption" is the entry's gloss; Zimbra states only
    that disclosure is limited.
  ground_truth_url: https://blog.zimbra.com/2026/07/patch-release-update-zimbra-10-1-20/
  machine_surface: false

