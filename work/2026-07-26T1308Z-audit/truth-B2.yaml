    Check Point's advisory table cell for CVE-2026-16232 reads: "R81.10, R81.20, R82, R82.10 (older versions
    impacted as well)". An administrator on a pre-R81.10 Management Server would read this entry as
    out-of-scope. Everything else on the entry checks out: Check Point prints CVSS 9.3 and NVD carries 9.1
    with exactly the vector the entry quotes (CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N), so the
