- entry: entries/2026-07-24/cyberav3ngers-plc-aa26-097a-schneider-siemens-expansion.md
  verdict: imprecision
  defect: >-
    The sentence carrying the campaign's most operationally significant claim — modification/deletion of PLC
    logic including Add-On Instructions, and disabling of shutdown and alarm logic so systems enter unsafe
    states without operator notification — is inline-cited to the CISA News release, which does not contain
    any of it; the joint advisory does. The same unsourced-to-its-citation claim is repeated in actions[].
  ground_truth: >-
    The words "shutdown", "alarm", "unsafe", "delete" and "Add-On" do not appear anywhere on the CISA News
    release. They appear in the joint advisory's Impact section (marked "(Updated, July 22, 2026)"): "the FBI
    and CISA identified the modification and deletion of project file logic, to include Add-On Instructions
    (AOIs) and data manipulation on HMI and SCADA displays [T1565]. Additionally, the changes disabled
    critical shutdown and alarm logic, allowing systems to enter unsafe conditions without notifying
    operators of the anomalies." So the fact is fully supported — by the entry's other primary source, which
    the entry also cites elsewhere in the same paragraph; the defect is the citation attachment, not the
    claim. Everything else verified: the seven authoring agencies (FBI, CISA, NSA, EPA, DOE, USCYBERCOM-CNMF,
    Treasury); the 2026-07-22 update to an advisory "originally published in April 2026"; the scope expansion
    to "Schneider Electric, Siemens and possible other PLC manufacturers"; the targeted device list
    (Rockwell CompactLogix and Micro850, Schneider BMX P34/Modicon M340, Siemens S7-1200); ports 44818, 2222,
    102, 502 plus 22 on modems with Dropbear; Studio 5000 / EcoStruxure Control Expert / TIA Portal; the
    SD1771 programming-protection lever; and evidence quote 1 as a contiguous verbatim substring of the CISA
    News release with evidence quote 2 contiguous verbatim in the advisory (bold markup aside). The entry's
    T1565 mapping matches the advisory's own ATT&CK reference.
  ground_truth_url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-097a
  machine_surface: false
