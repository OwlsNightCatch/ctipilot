  - title: "mySites.guru's Joomla third-party-extension disclosure wave continues past the tracked file-upload pattern — a critical unauthenticated cookie-forged Super User bypass (Gridbox, CVE-2026-61425) and five more component-specific flaws disclosed this week"
    summary: |
      The sustained mySites.guru research campaign already tracked by this pipeline as trend:joomla-extension-file-upload-rce-wave produced a further six disclosures inside this audit window (2026-07-20 through 2026-07-23), extending beyond the original CWE-434 file-upload pattern into a new technique class: **CVE-2026-61425** in Balbooa's Gridbox page builder is a critical unauthenticated authentication bypass — the plugin trusts a client-supplied cookie value as proof of identity, so setting an administrator's username in that cookie logs the requester in as that user with no password, no login form and no existing session; a Joomla Super User can edit templates, which is PHP execution, so this is full site/server compromise from a single anonymous request. Fixed in Gridbox 2.20.1 (2026-07-20); the vulnerable code had shipped since the prior release in October 2025 (~9 months). mySites.guru withheld the exact cookie/endpoint and any PoC (responsible-disclosure "fix first, publish second" policy), so there is no public exploitation signal. The same week also produced: EasyStore for Joomla (JoomShaper) — cross-customer invoice/order IDOR plus an unauthenticated order-forgery and an unauthenticated SQL injection reading the entire site database (CVE-2026-65759/-65760/-65761, two rated critical, fixed 2.0.2); Events Booking for Joomla — unauthenticated invoice IDOR exposing GDPR-scoped personal/financial data by walking sequential IDs (CVE-2026-63047, fixed 5.8.2); Membership Pro (same developer/codebase as Events Booking) — an unauthenticated file-upload endpoint reachable even on sites that never used the affected feature (CVE-2026-62415, CVSS 9.1, fixed 4.6.2); PageBuilder CK — the vendor's June fix for CVE-2026-56290 (CVSS 10.0 unauthenticated file-upload RCE) turned out incomplete: the file-type check stayed commented out through 3.6.2, regressing the bug from unauthenticated to "any Editor-role account" RCE, now correctly fixed in 3.6.3; and Regular Labs — a coordinated, quiet security-hardening release across ~30 extensions (Cache Cleaner's SSRF-to-internal-networks and an OS-command-injection reaching a shell on SiteGround hosts is the most serious, no CVEs assigned). None of the new disclosures carries confirmed in-the-wild exploitation — all were found via responsible disclosure with PoC withheld — but the trend entity's prior members (SP Page Builder, iCagenda, Balbooa Forms) were exploited as zero-days and reached CISA KEV within days of disclosure, so the pattern of rapid weaponization after publication is established for this ecosystem. Any Swiss/European municipal or public-sector site running Joomla with these extensions should prioritise the update queue even absent a PoC.
    sources:
