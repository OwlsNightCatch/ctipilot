    extended_notes: |
      NCSC-NL published this as its own advisory series (NCSC-2026-0252 through -0264, several tied to the same cpujul2026 reference) only on 2026-07-22, six days after Oracle's own page timestamp — the CERT-relay delta is what brings this inside the audit window. CERT-FR independently ran its own multi-advisory batch on 2026-07-23. Distinguish carefully from CVE-2026-21962 (WebLogic Server Proxy Plug-in path-traversal/header-manipulation auth bypass): that flaw was patched in Oracle's *January* 2026 CPU and was already under active scanning/exploitation months ago — several aggregator posts sloppily attached it to the July cycle as "already exploited," which is not accurate for the July-2026-introduced CVEs.
    borderline: true
    borderline_reason: "Quarterly Oracle CPUs are normally 'regular patch cycle' and out of scope absent exploitation; inclusion here rests on the unauthenticated/network-reachable CVSS-10.0 concentration in widely-deployed middleware plus two national CERTs (NL, FR) treating it as advisory-worthy with NCSC-NL explicitly forecasting imminent mass exploitation — no ITW exploitation of the new CVEs is confirmed yet."

  - title: "CVE-2021-27137 (DD-WRT UPnP buffer overflow) added to CISA KEV — confirms the C0XMO Gafgyt botnet exploitation this pipeline flagged in June"
    summary: |
      CISA added CVE-2021-27137 to its Known Exploited Vulnerabilities catalog on 2026-07-21 (batch also included the WordPress wp2shell and Langflow CVEs, both already covered this window). The flaw is a stack buffer overflow in DD-WRT's UPnP/SSDP handling (ssdp_msearch, an unsafe strcpy on an oversized ST:uuid: value in a crafted M-SEARCH request to UDP 1900) — the exact mechanism this pipeline's 2026-06-08 entry on the C0XMO Gafgyt-derived botnet described, at a time when the CVE identifier did not yet resolve on NVD/MITRE. The KEV addition is the first CISA-confirmed, government-attested exploitation status for this flaw and gives it a due date under BOD 26-04 (2026-07-24 for federal agencies). No new technical detail beyond what the June entry already covered; this is a status confirmation, not a new campaign.
    sources:
      - { url: "https://securityaffairs.com/195782/security/u-s-cisa-adds-dd-wrt-langflow-and-wordpress-flaws-to-its-known-exploited-vulnerabilities-catalog.html", publisher: "SecurityAffairs", date: "2026-07-22", role: primary }
