  - title: "Progress Telerik UI for AJAX — cookie-persistence deserialization RCE (CVE-2026-13185, CVSS 8.1) flagged by CCB Belgium; non-default configuration required, no confirmed exploitation"
    summary: |
      Progress published an advisory for CVE-2026-13185 in Telerik UI for AJAX: when an application explicitly configures RadPersistenceManager to use CookieStateStorageProvider, or sets RadDockLayout.LayoutPersistenceRepositoryType to Cookies, the cookie-backed persistence state is deserialized without validation, allowing a remote attacker to achieve code execution. Applications using only server-side, database, or session-based persistence are not affected. CCB Belgium (Centre for Cybersecurity Belgium) issued a "Patch Immediately" advisory on 2026-07-23 noting Progress is not aware of active exploitation as of that date, but flagging that Telerik UI components have a documented history of APT targeting (citing CISA's 2023 advisory AA23-074A on historical Telerik UI deserialization exploitation by a Vietnam-based intrusion set). Mitigation without patching: stop using CookieStateStorageProvider / set LayoutPersistenceRepositoryType away from Cookies.
    sources:
      - { url: "https://ccb.belgium.be/advisories/warning-high-rated-vulnerability-progress-telerik-ui-ajax-can-lead-remote-code-execution", publisher: "CCB Belgium (CERT.be)", date: "2026-07-23", role: primary }
      - { url: "https://www.telerik.com/products/aspnet-ajax/documentation/knowledge-base/kb-security-persistence-cookie-deserialization-cve-2026-13185", publisher: "Progress/Telerik", date: "2026-07-23", role: primary }
