items:
  - title: "Oracle's record-breaking July 2026 Critical Patch Update (1,449 patches, ten unauthenticated CVSS 10.0 flaws in Fusion Middleware) went unpublished this window"
    summary: |
      Oracle's July 2026 Critical Patch Update (advisory page last-updated 2026-07-16, but only broadly relayed by national CERTs and press inside this audit window on 2026-07-21 through 2026-07-24) is the largest in company history: 1,449 patches covering ~1,434 CVEs across 334 products in 32 product families. Fusion Middleware alone carries 355 of those fixes, 219 of which are remotely exploitable without authentication, and ten reach a perfect CVSS 10.0 — every one reachable over a standard network protocol (HTTP, LDAP, SOAP, or in Oracle Coherence's case raw TCP) with zero authentication. The two flaws NCSC-NL singled out by name: CVE-2026-47056 (Oracle Data Integrator REST Service — unauthenticated full takeover over HTTP) and CVE-2026-60217 (Oracle Coherence Core — unauthenticated takeover over TCP, affecting 12.2.1.4.0/14.1.1.0.0/14.1.2.0.0/15.1.1.0.0). The other eight CVSS-10.0 Fusion Middleware flaws (CVE-2026-60358, -60360, -60365, -60366, -60379, -60389, -60644, and one more in the same batch) sit across Oracle Access Manager, Oracle HTTP Server, Oracle Platform Security for Java, Oracle WebCenter Content, Oracle Service Delivery Platform, Oracle Unified Directory and the WebLogic Server Proxy Plug-in. Database Server also carries two remotely-reachable critical flaws: CVE-2026-61211 (CVSS 9.9, DBMS_CLOUD privilege abuse to full server control) and CVE-2026-47040 (CVSS 9.1, Connection Manager). NCSC-NL's own advisory (NCSC-2026-0252, Fusion Middleware) states it considers large-scale exploitation highly likely in the short term given the number and severity of unauthenticated flaws, and separately urged immediate deployment given the absence of any authentication requirement. CERT-FR published a parallel batch of advisories the same week (CERTFR-2026-AVI-0914 through -0920, 23 July 2026) covering Oracle Database Server, Java SE, MySQL, PeopleSoft, Systems, Virtualization and WebLogic. No confirmed in-the-wild exploitation of any of the new July-2026 CVEs has been reported as of this writing (distinct from CVE-2026-21962, an older January-2026-patched WebLogic Proxy Plug-in flaw some secondary coverage conflated with this cycle — that one was already fixed and publicly exploited six months ago and carries no fresh development here). Given the unauthenticated, network-reachable nature of the Fusion Middleware flaws and the breadth of Oracle middleware/identity/ERP deployment in Swiss and European government and enterprise back-offices (Access Manager and Identity Manager underpin SSO/IAM; PeopleSoft and E-Business Suite underpin HR/finance; WebCenter Content underpins document management), this Critical Patch Update itself — not any single downstream campaign — is the actionable item: it never received its own entry this window despite two national CERTs (NL, FR) treating it as advisory-worthy and multiple independent outlets (SOCRadar, The Register, CSOonline, InfoWorld) covering it as the largest CPU ever shipped.
    sources:
