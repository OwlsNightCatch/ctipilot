- entry: entries/2026-07-21/gpt56-autonomous-wordpress-wp2shell-exploit-chain.md
  verdict: imprecision
  defect: >-
    Autonomy overstated relative to the cited source: the entry says the model ran "autonomously for up to 10 hours per
    session" and that "Without human guidance beyond the initial task, the model recursively chained batch API requests
    ... ending with an unauthorised admin account". Searchlight's own account describes an operator-prompted escalation
    across several stages, and the "just over 10 hours" is the total production time for the whole exploit, not a
    per-session autonomous run.
  ground_truth: >-
    Searchlight Cyber, 2026-07-20: "I took the prompt and adapted it, then pointed it at WordPress and asked it to use
    4 agents for at least 6 hours"; "Still not fully believing it, I installed a stock WordPress instance on a remote
    server and asked it to steal the administrator's email"; "From there, I asked Sol if this could be escalated to an
    RCE. About 4 hours later, Sol responded in the affirmative"; "This full exploit was produced in just over 10 hours."
    Both evidence[] quotes are otherwise verbatim ("Total usage: 50% of weekly usage. Pro-rata total cost on the $200
    subscription: ~ $25 USD." and, mid-sentence, "no security researcher could have found and completed this exploit
    chain in 10 hours without AI"), and the oEmbed / cache-poisoning / parse_request chain description matches the post.
  ground_truth_url: https://slcyber.io/research-center/exploit-brokers-pay-500000-for-a-wordpress-rce-i-found-one-with-gpt5-6/
  machine_surface: false

