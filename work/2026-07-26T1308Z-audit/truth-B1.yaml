- entry: entries/2026-07-18/wordpress-core-wp2shell-preauth-rce-chain-cve-2026-63030.md
  verdict: imprecision
  defect: >-
    The body states "the CISA-ADP secondary assessment carried by NVD and EUVD inverts the pair at 7.5 and 9.1
    ([ENISA EUVD, 2026-07-18](https://euvd.enisa.europa.eu/vulnerability/EUVD-2026-45280))" — the cited EUVD record
    carries neither score (only the WPScan 9.8) and was published 2026-07-17, not 07-18; the 7.5/9.1 pair exists only
    in NVD's CISA-ADP metrics. Secondary: the actions[] item attributes the "/wp-json/batch/v1 and ?rest_route=/batch/v1
    at a WAF" mitigation to NCSC-NL, which only refers readers to "de mitigerende maatregelen ... door beveiligingsbedrijf
    Searchlight Cyber" — the endpoint paths are Searchlight's wording.
  ground_truth: >-
    EUVD-2026-45280 (fetched via the ENISA API and via jina): baseScore 9.8 CVSS:3.1 (assigner WPScan), published
    "Jul 17, 2026, 7:14:12 PM", no 7.5 and no 9.1 anywhere in the record. NVD API for CVE-2026-63030 returns
    cvssMetricV31 contact@wpscan.com 9.8 AND 134c704f-... (CISA-ADP) 7.5; for CVE-2026-60137, WPScan 5.9 and
    CISA-ADP 9.1. The cves[] ids and the CNA scores carried in frontmatter (9.8 / 5.9) match the authority exactly.
    NCSC-2026-0250 CSAF: Kans "high", Schade "medium" (the entry's "likelihood high" is correct); its Oplossingen note
    defers the endpoint mitigation to Searchlight Cyber.
  ground_truth_url: https://euvd.enisa.europa.eu/vulnerability/EUVD-2026-45280
  machine_surface: false

- entry: entries/2026-07-18/moodle-local-o365-jwt-forgery-admin-takeover-cve-2026-54733.md
  verdict: imprecision
  defect: >-
    evidence[] quote 2 — "An unauthenticated remote attacker who knows (or can enumerate) any O365-authenticated user's
    email address can forge a JWT with an arbitrary upn claim." — is not a contiguous substring of the cited GHSA: it
    splices the Impact lead-in sentence (which ends in a colon) onto the first bullet of the list beneath it.
  ground_truth: >-
    GHSA-hqjh-93qv-47v5 reads: "An unauthenticated remote attacker who knows (or can enumerate) any O365-authenticated
    user's email address can:" followed by bullets "* Forge a JWT with an arbitrary `upn` claim", "* Submit it to the
    Teams SSO endpoint", "* Obtain a fully authenticated Moodle session as that user". Everything else verified:
    evidence quote 1 verbatim; affected <4.5.6 / >=5.0.0 <5.0.5 / >=5.1.0 <5.1.1 and patched 4.5.6/5.0.5/5.1.1 match;
    CVSS 4.0 9.3 CRITICAL is in the CNA (GitHub_M) container of the CVE record, so "GitHub CNA scores it 9.3" is
    correct (CISA-ADP added only SSVC); BSI WID-SEC-2026-2400 CSAF aggregate_severity "hoch" and the German evidence
    quote are verbatim.
  ground_truth_url: https://github.com/microsoft/o365-moodle/security/advisories/GHSA-hqjh-93qv-47v5
  machine_surface: false

