  defect: >-
    "filed data-breach notifications with the California and Vermont Attorneys General on 2026-07-15" collapses two
    filings onto one date: the Vermont filing is dated 2026-07-16, and no source cited by the entry mentions a Vermont
    filing at all (the OAG report page carries no filing date either).
  ground_truth: >-
    Vermont AG security-breach-notice list: "Ernst & Young LLP | Other Commercial | 13 | Social Security Numbers,
    Financial Account Codes, Credit and Debit Account Info | 7-16-2026". California OAG breach list row:
    "Ernst & Young LLP | 03/28/2026, 04/23/2026 | 07/15/2026" — so the California date is right. The OAG report page
    itself shows only Sample of Notice / Organization Name / Date(s) of Breach, in exactly the order the entry's
    evidence[] quote reproduces (quote verified contiguous); BleepingComputer ("between March 28 and April 12",
    "On April 23, 2026, EY identified anomalous activity within that platform", 24 months Experian) and CyberInsider
    ("Support tickets submitted through the platform may include documents containing client tax information.")
    are verbatim.
  ground_truth_url: https://ago.vermont.gov/categories/security-breach-notices
