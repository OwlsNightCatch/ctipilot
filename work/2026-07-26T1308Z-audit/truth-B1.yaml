- entry: entries/2026-07-21/servicenow-ai-platform-cve-2026-6875-active-exploitation.md
  verdict: imprecision
  defect: >-
    Exploitation-onset date off by one day: the summary says "with in-the-wild activity reported from 2026-07-18" and
    the body "attributing the in-the-wild observation to threat-intelligence firm Defused from around 2026-07-18",
    while the cited BleepingComputer article places the first observed attempts on Friday 2026-07-17 (the Defused
    tweet, on Saturday 2026-07-18, is the report, not the onset).
  ground_truth: >-
    BleepingComputer, published Monday 2026-07-20: "Over the weekend, Defused security researchers confirmed that
    attackers have begun exploiting the vulnerability in the wild, with the first attempts being observed on Friday."
    (Friday = 2026-07-17; Saturday tweet = 2026-07-18.) Same article: "ServiceNow addressed the flaw across hosted
    instances starting in April and released CVE-2026-6875 security updates for self-hosted instances one week ago,
    on July 13th" — consistent with the entry's hosted-vs-self-hosted framing. NCSC-CH post 12778 (created
    2026-07-20T12:04Z) carries "**Current exploitation status**: Actively exploited" and "CVE-2026-6875 CVSS 9.5
    (CRITICAL)", matching the entry's evidence quote and cves[] score; the Searchlight sandbox-escape quote is verbatim.
  ground_truth_url: https://www.bleepingcomputer.com/news/security/critical-servicenow-code-execution-flaw-now-exploited-in-attacks/
  machine_surface: false

- entry: entries/2026-07-21/cve-2026-2291-dnsmasq-heap-overflow-rce-exodus.md
  verdict: imprecision
  defect: >-
    Exploitation prerequisite understated: "No local access is needed: the attacker only requires a client behind the
    vulnerable resolver to look up an attacker-influenced name." Exodus's demonstrated chain requires the resolver to
    be pointed at an attacker-controlled upstream DNS server, a materially stronger precondition that the entry states
    only parenthetically earlier ("resolved via an attacker-influenced upstream response").
  ground_truth: >-
    Exodus Intelligence, 2026-07-20: "we exploited it to gain remote code execution on a OpenWRT target that is
    configured with a malicious upstream DNS server" and "The target system is configured to use our malicious server
    as the upstream DNS server. To exploit the vulnerability a client makes a series of DNS requests to the target:
    alloc.me, overflow.me, and overwrite.me." (three names — the entry's "three attacker-controlled domain names" is
    correct). Root-cause quote, really_insert()/src/cache.c, the 1,025-byte bigname buffer, the ld.so function-pointer
    write-what-where and the 2.92rel2/2.93 fix on 11 May 2026 all verified. NVD's 7.3 (CVSS:3.1/AV:N/AC:L/PR:N/UI:N/
    S:U/C:L/I:L/A:L) is a CISA-ADP secondary metric on a record still "Awaiting Analysis" — the low-impact vector the
    entry describes is accurate.
  ground_truth_url: https://blog.exodusintel.com/2026/07/20/dnsmasq-dns-remote-heap-buffer-overflow/
  machine_surface: false

