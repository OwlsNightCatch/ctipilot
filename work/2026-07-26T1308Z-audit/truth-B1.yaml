- entry: entries/2026-07-19/ancpi-romania-cadastre-cyberattack-bytetobreach.md
  verdict: imprecision
  defect: >-
    Per-fact attribution: the sentence "posted ANCPI data for sale on a dark-web forum on 15 July, claiming to hold ...
    a copied GitLab server carrying the source code for e-Terra and RENNS ... ([Help Net Security, 2026-07-16])"
    attributes two facts to Help Net Security that Help Net Security does not carry — the 15 July sale date and the
    e-Terra/RENNS naming. Both are in the co-cited Public Record investigation.
  ground_truth: >-
    Help Net Security says only "They claim to have compromised data of Romanian citizens and various ANCPI databases,
    made a copy of the agency's GitLab servers and the source code contained within, and deployed ransomware" — no
    date for the sale posting, no product names. Public Record (2026-07-17) carries both: "există și o copie a
    serverelor GitLab care conțin codul sursă al tuturor sistemelor lor, precum Eterra, RENNS" and "Scurgerea de date
    de la ANCPI a fost scoasă la vânzare pe 15 iulie". All other checked facts hold (institutional email offline,
    ~1.5 m lei / 48-month contract, 24/7 call-centre and annual audit clauses, the eMAG "licence provider" quote,
    ANAR December 2025 with "Aproximativ 1.000 de sisteme IT" affected); the KELA and HNS evidence quotes are verbatim.
  ground_truth_url: https://publicrecord.ro/2026/07/17/atac-cibernetic-ancpi/
  machine_surface: false

- entry: entries/2026-07-19/ernst-young-third-party-itsm-platform-breach-client-tax-data.md
