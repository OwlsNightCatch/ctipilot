  - entry: entries/2026-08-28/doj-fbi-qscan-qtrouter-prc-hacking-as-a-service-takedown.md
    verdict: factual-error
    defect: >
      The evidence[] quote attributed to "U.S. Department of Justice" — "Among the victims of
      QTFY computer intrusion activity are the National Aeronautics and Space Administration,
      Federal Reserve, Department of Energy, Department of Justice, Department of Health and
      Human Services, National Institutes of Health, and the U.S. Senate." — is NOT a verbatim
      match to the DOJ press release. The actual sentence reads "Among the targets of QTFY are
      the National Aeronautics and Space Administration..." — DOJ's own wording is "targets", not
      "victims", and the phrase "computer intrusion activity" appears nowhere on the page (full
      text grepped). "Target" and "confirmed victim of intrusion" are materially different claims;
      this altered quote appears twice, once in frontmatter evidence[] and once reproduced
      identically in the body's blockquote. Separately, the "at least 2018" date in the DOJ
      release is stated about a distinct FBI/NSA cybersecurity advisory covering general QTFY
      activity ("providing indicators-of-compromise by QTFY based on their analysis of QTFY
      malicious cyber activity dating back to at least 2018"), not specifically about the named
      US-agency victim list; the entry's own body correctly hedges this as "in a separate
      statement in the same release" so this second point is not itself a defect, but the title's
      phrasing ("named among the victims of activity DOJ dates to at least 2018") reads as if the
      two facts are one causal chain.
    ground_truth: >
      justice.gov (fetched verbatim, full text grepped for "victim" — zero matches; for
      "computer intrusion activity" — zero matches): "Among the targets of QTFY are the National
      Aeronautics and Space Administration, Federal Reserve, Department of Energy, Department of
