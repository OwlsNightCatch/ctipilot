  - item: owncloud/Hunt.io ZKTeco BioTime Key Finding
    adjudication: stands
    note: >
      Confirmed present on the live page under "## Key Findings": "A 192 MB SQL dump from a
      ZKTeco BioTime attendance and personnel database, recovered from the same server,
      referenced multiple related Philippine science and research organizations, indicating a
