  - entry: entries/2026-08-28/unisoc-volte-mpu-isolation-bypass-android-kernel.md
    verdict: factual-error
    defect: >
      The title, affected_products[], and body all state the flaw affects "Unisoc T606/T612/T7250"
      and that the three named test devices map one-to-one to those three chipsets ("confirmed on
      the Motorola E13 (T606), Realme C33 (T612) and Xiaomi Redmi A5 (T7250)"). Neither cited
      secondary source (Dark Reading, Infosecurity Magazine) states this mapping. Both sources
      name only Unisoc T612 as the affected chipset throughout, and both confirm three devices
      (Realme C33, Motorola E13, Xiaomi Redmi A5) were used/tested — but Realme C33 is the only
      device either source explicitly ties to a chipset ("a Realme C33 running Android with the
      Unisoc T612" — Dark Reading). Neither article contains the strings "T606" or "T7250"
      anywhere. The primary (SSD Secure Disclosure) remains unreachable (confirmed again this
      pass — anti-bot challenge page on direct fetch, url fetch, and jina for the landing page
      and both named post URLs), so this specific chipset-to-device mapping cannot be traced to
      any source the entry cites or that this pass could reach.
    ground_truth: >
      Dark Reading (verbatim): "Researchers at SSD Secure Disclosure...demonstrated the attack
      chain in a controlled setting against a Realme C33 smartphone... SSD confirmed the
      vulnerability on a Xiaomi Redmi A5 running the January 2026 Android security patch and a
      Motorola E13 running the February 2025 patch." No chipset model given for the latter two
      devices. grep of both fetched articles for "T606" and "T7250": zero matches in either.
    ground_truth_url: "https://www.darkreading.com/mobile-security/video-call-exploit-chains-two-flaws-unisoc-modems ; https://www.infosecurity-magazine.com/news/unisoc-modem-flaw-rce-calls/"

