- entry: entries/2026-08-06/endlessdoors-zbtlink-router-factory-shipped-root-backdoor.md
  verdict: factual-error
  defect: >
    The entry's summary and body state "Zbtlink has offered nothing" and the 2026-08-29 update
    section states VulnCheck's original device-replacement guidance "is the only remediation
    position on record for this supply chain" with no vendor notification "since there is no
    fix to coordinate." This is contradicted by the entry's OWN cited corroborating source: the
    heise article (2026-08-28, cited in this entry's sources[]) reports that Zbtlink publicly
    responded to ENDLESSDOORS by announcing it would suspend sales of the affected routers and
    pull the affected firmware from its site while working on updates. This public vendor
    response (dated on/around 2026-08-06, syndicated widely via Reuters) predates even the
    entry's original 2026-08-06 publication and was still live in the source cited by the
    2026-08-29 update, yet neither version of the entry reflects it.
  ground_truth: >
    heise (2026-08-28): "ZBTlink hat als Reaktion auf 'EndlessDoors' angekündigt, den Verkauf
    betroffener Router auszusetzen und die betroffene Software offline zu nehmen, während an
    Updates gearbeitet werde." (= "ZBTlink announced, in response to 'EndlessDoors', that it
    will suspend sales of affected routers and take the affected software offline while working
    on updates.") Corroborated via search of Reuters-syndicated coverage (Nikkei Asia, AOL,
    IDN Financials, varindia.com, published ~2026-08-06): "Zbtlink said in a statement on its
    website that it was suspending sales of routers found to contain a backdoor and pulling the
    affected software from its website while it developed updates to address the issue."
  ground_truth_url: "https://www.heise.de/news/OEM-China-Router-von-ZBT-mit-Backdoors-11433072.html"

