- entry: entries/2026-08-28/taiwan-agentic-ai-intrusion-openclaw-hermes-guardrail-bypass.md
  verdict: imprecision
  defect: >
    Two findings. (1) The Taiwan Administration for Cyber Security quote is translated from
    Traditional/Simplified Chinese but carries no "original:" field with the source-language
    text and no "(translated from Chinese)" marker anywhere in body or evidence — the same run's
    own SUEZ entry does this correctly, so the omission is inconsistent within the batch.
    Additionally the body's inline quote ("AI Agent can rapidly chain multiple attack methods
    together and utilize backup and testing secondary systems as springboards, giving attacks
    characteristics of high speed, low cost, and large scale") and the evidence[] quote ("AI
    Agent can quickly chain together multiple attack methods, and utilize backup and test
    secondary systems as springboards, giving attacks the characteristics of fast speed, low
    cost and large scale") are two different English translations of the same Chinese sentence.
    (2) The Attribution paragraph states Tenable's cluster is "tracked since November 2025" —
    Tenable's own article states tracking began "since late July 2026" / "since July 21, 2026";
    November 2025 is only the earliest incident date within the cluster's date span, not the
    tracking start date — a date spliced from one figure onto another figure's context.
  ground_truth: >
    Chinese original (moda.gov.tw): "AI Agent可快速串聯多種攻擊手法，並利用備援、測試等次要系統作為跳板，
    使攻擊具備速度快、成本低及規模大的特性。" — no such field exists on this entry's evidence record.
    Tenable's own text: "Tenable's RSO team has been tracking a cluster of agentic AI threat
    activity since late July 2026" and "...an intelligence cluster since July 21, 2026. That
    cluster now encompasses seven confirmed incidents... spanning November 2025 through August
    2026" — tracking start and incident-span start are two different dates the entry conflates.
  ground_truth_url: "https://www.tenable.com/blog/the-agentic-ai-threat-cluster-seven-incidents-three-actors-and-what-they-mean"

