items:
  - title: "Third DDoS attack in three months takes down Norway's shared government identity gateway (ID-porten), cascading into health, tax and business-registry logins"
    sources:
      - { url: "https://status.digdir.no", publisher: "Digdir (Norwegian Digitalisation Agency) — status page", date: "2026-08-27", role: "primary" }
      - { url: "https://therecord.media/norway-cyberattack-ddos-government", publisher: "The Record (Recorded Future News)", date: "2026-08-25", role: "corroborating" }
      - { url: "https://www.bleepingcomputer.com/news/security/massive-ddos-attack-disrupts-norways-government-digital-services/", publisher: "BleepingComputer", date: "2026-08-25", role: "corroborating" }
      - { url: "https://www.infosecurity-magazine.com/news/ddos-attack-hits-norwegian/", publisher: "Infosecurity Magazine", date: "2026-08-26", role: "corroborating" }
    discovery_trace: "first seen at: infosec-magazine, URL https://www.infosecurity-magazine.com/rss/news/ (feed item, drilled to https://www.infosecurity-magazine.com/news/ddos-attack-hits-norwegian/) → pivot: WebSearch (\"Digdir DDoS ID-porten status August 2026 pressemelding\") → pivot: The Record, URL https://therecord.media/norway-cyberattack-ddos-government → pivot: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/massive-ddos-attack-disrupts-norways-government-digital-services/ → primary: Digdir's own incident status page, URL https://status.digdir.no (also cited via the mirror https://testmiljo.status.digdir.no/incidents/ntvftz0nwhl6 linked from both news pieces)"
    summary: |
      A sustained DDoS campaign against the infrastructure of Norway's Digitalisation Agency (Digdir) and its
      operations partner Vivicta took down or degraded ten shared government digital services for roughly 64
      hours, from 03:38 CEST Monday 2026-08-24 to about 19:30 CEST Wednesday 2026-08-26 (Digdir's own status
      page). The primary target, ID-porten — the single sign-on identity gateway that more than 4.5 million
      Norwegians use to authenticate into thousands of downstream public services (tax, health records,
      welfare, business registries) — was completely unavailable for short periods and remained partially
      degraded (slow logins, failed connections) for most of the window; eSignering (digital signatures) and
      MinID were also hit. Because so many unrelated services front-end through the same identity gateway,
      the outage cascaded into Norway's electronic-prescription and online-pharmacy systems (flagged
      separately by the national health-network status page) and into Altinn (the business/citizen/government
      communication hub) and the tax authority Skatteetaten's own login pages, neither of which was itself
      targeted. Digdir states no indication of a security breach or personal-data compromise — this was
      pure availability denial, not intrusion. This is the third DDoS incident against Digdir's shared
      infrastructure since June 2026 (after one in June and one on 2026-08-03), and Digdir's press officer
      described this one as "two to three times larger" than the prior incidents — an escalating pattern
      against the same chokepoint rather than an isolated event. No official attribution has been made;
      Norwegian media (VG) have speculated Russian involvement, which Digdir itself does not confirm — that
      speculation is reported as media commentary, not established fact. Norway's National Security Authority
      (NSM) and Data Protection Authority (Datatilsynet) were notified.
    region_nexus: "Norway (EEA/Nordic public sector); direct architectural analog to Switzerland's centralised eID/SSO push (Agov/CH-Login, which this same week crossed 2 million users per swisscybersecurity.net, 2026-08-26) — the transferable lesson is that concentrating authentication for an entire public sector behind one gateway makes that gateway a single point of failure requiring DDoS-defense investment proportional to everything behind it, not just the gateway itself."
    primary_sector_nexus: "direct"
    sector: "public-sector"
    cves: []
    techniques: [T1498]
    affected_products: ["ID-porten (Digdir eID gateway)", "Altinn", "MinID", "eSignering"]
    entity_keys: []
    new_entities:
      - { key: "incident:norway-digdir-ddos-2026-08", type: incident, name: "2026-08 DDoS campaign against Norway's Digdir shared government infrastructure", aliases: ["ID-porten DDoS August 2026"],
          summary: "Third in a series of DDoS attacks since June 2026 against Norway's Digitalisation Agency (Digdir) and its operations partner Vivicta, disrupting ID-porten and nine other shared government digital services for ~64 hours from 2026-08-24 to 2026-08-26; no data breach, no official attribution (Digdir status page; The Record; BleepingComputer, 2026-08-25/26)." }
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "The affected services have been completely unavailable for short periods. For most of the time, they have been partially available, but have experienced operational disruptions, where, for example, logging in has taken longer than usual"
        attribution: "Digdir (quoted via Infosecurity Magazine)"
        source_url: "https://www.infosecurity-magazine.com/news/ddos-attack-hits-norwegian/"
      - quote: "It is the third DDoS incident to affect Digdir's services since June, according to Norwegian media. \"What is special about this latest attack, which has now been ongoing for a day, is that it is two to three times larger than what we experienced last time,\" Digdir press officer Are Kvistad told Norwegian public broadcaster NRK."
        attribution: "The Record (Recorded Future News)"
        source_url: "https://therecord.media/norway-cyberattack-ddos-government"
      - quote: "Angrepet startet natt til mandag kl. 03.38 og stoppet ved 19.30-tiden onsdag kveld."
        attribution: "Digdir status page (own incident log)"
        source_url: "https://status.digdir.no"
      - quote: "Digdir said the attackers had not gained access to sensitive information stored in the affected systems."
        attribution: "The Record (Recorded Future News)"
        source_url: "https://therecord.media/norway-cyberattack-ddos-government"
    extended_notes: |
      No volumetric/technical detail (attack vector, botnet, reflection/amplification type) was disclosed by
      any source — map only T1498 Network Denial of Service at the parent level; do not assume a
      sub-technique. The repeated-targeting angle (three hits in under three months, each larger) is the
      operationally interesting thread for a defender running a similar centralised-identity architecture:
      it argues for DDoS-capacity headroom sized to the peak of an escalating series, not the first incident,
      and for dependency-mapping so that services which merely *consume* the identity gateway (Altinn,
      Skatteetaten, the health network) know to publish their own status pages the moment the gateway degrades
      rather than leaving users to conclude their own service is broken.

  - title: "OFAC sanctions five Mabna Institute members (Iranian hacking-for-hire group indicted for compromising 144 US and 178 foreign universities plus government agencies) under a new Iran-sanctions package"
    sources:
      - { url: "https://www.infosecurity-magazine.com/news/us-sanctions-mabna-institute/", publisher: "Infosecurity Magazine", date: "2026-08-25", role: "primary" }
      - { url: "https://home.treasury.gov/news/press-releases/sb0613", publisher: "US Treasury / OFAC press release", date: "2026-08-24", role: "primary" }
      - { url: "https://www.trmlabs.com/resources/blog/operation-economic-outcast-treasury-sanctions-nearly-60-iran-linked-targets-and-names-digital-assets-a-sanctionable-sector", publisher: "TRM Labs", date: "2026-08-24", role: "corroborating" }
    discovery_trace: "first seen at: infosec-magazine, URL https://www.infosecurity-magazine.com/rss/news/ (feed item, drilled to https://www.infosecurity-magazine.com/news/us-sanctions-mabna-institute/) → primary: US Treasury OFAC press release, URL https://home.treasury.gov/news/press-releases/sb0613 (linked from the article; not independently re-fetched this run due to time) → corroborating: TRM Labs blockchain-forensics blog, URL https://www.trmlabs.com/resources/blog/operation-economic-outcast-treasury-sanctions-nearly-60-iran-linked-targets-and-names-digital-assets-a-sanctionable-sector"
    summary: |
      On 2026-08-24 the US Treasury announced "Operation Economic Outcast," a package of sanctions against
      nearly 60 Iran-linked individuals and entities. Among them are five individuals tied to the Mabna
      Institute, a private Iranian hacking-for-hire operation the DoJ separately indicted 17 members of on
      2026-08-18 for cyber-espionage intrusions dating to at least 2013 against 144 US-based universities,
      178 foreign universities, 42 US-based and 11 foreign private-sector companies, five US federal/state
      government agencies, and at least two NGOs. OFAC's designations name 30 cryptocurrency addresses
      (Bitcoin, Ethereum, TRON) tied to four of the defendants, holding roughly $16.8M accumulated since 2018;
      blockchain-forensics firm TRM Labs assesses one defendant (Keyvan Fayaz) likely served as a financial
      hub for Mabna's hacking-for-hire proceeds. The sanctions package also makes new sectoral designations
      (digital assets, technology, gold, aviation, shipping) that TRM Labs states expand secondary-sanctions
      exposure for any institution processing transactions for Iranian exchanges — a compliance-relevant
      delta beyond the Mabna angle specifically.
    region_nexus: "Global/US-centric; the historic Mabna Institute victim set is overwhelmingly academic and includes government agencies as a named category, giving the group's playbook (spear-phishing academics for VPN/library-proxy credentials to resell/pivot) a transferable relevance to any public-sector or public-university-adjacent defender, though no European or Swiss victim is named in this reporting."
    primary_sector_nexus: "indirect"
    sector: "public-sector"
    cves: []
    techniques: [T1566]
    affected_products: []
    entity_keys: []
    new_entities:
