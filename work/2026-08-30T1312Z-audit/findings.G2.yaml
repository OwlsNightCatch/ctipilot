          summary: "Iranian private hacking-for-hire enterprise, DoJ-indicted 2026-08-18 (17 members) for cyber-espionage intrusions since at least 2013 against 144 US and 178 foreign universities, government agencies and private companies; five members sanctioned by OFAC 2026-08-24 (US Treasury; Infosecurity Magazine, 2026-08-25)." }
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "The DoJ claimed that, since at least 2013, the 17 had carried out intrusions at 144 US-based universities, 178 foreign universities, at least 42 US-based private sector companies, 11 foreign private sector companies, five US federal and state government agencies, and at least two non-governmental organizations (NGOs)."
        attribution: "Infosecurity Magazine"
        source_url: "https://www.infosecurity-magazine.com/news/us-sanctions-mabna-institute/"
    extended_notes: |
      Marked borderline — the sanctions/indictment nexus to the profiled Swiss public-sector constituency is
      thin (US-centric law-enforcement/Treasury action, no Swiss or DACH victim named in the reporting this
      run surfaced). Returning it because the S2 mission explicitly lists "sanctions / law-enforcement actions
      against publicly-known threat infrastructure" as in-scope for the regulatory watch, and because a
      state-sponsored actor targeting academic/government credential theft at this historical scale (322
      universities) is a named threat class worth the registry even where no direct incident touches this
      constituency yet. Main agent should weigh whether this clears the bar or is better left as a registry
      note only.
    borderline: true
    borderline_reason: "Global/US-centric sanctions and law-enforcement action with no direct Swiss/DACH victim or incident nexus in the sources found this run; included per S2's explicit sanctions/enforcement mandate but weight is genuinely marginal."

