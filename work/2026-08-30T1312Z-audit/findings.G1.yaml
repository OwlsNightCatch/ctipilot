  - title: "CVE-2026-21962 — Oracle HTTP Server / WebLogic Server Proxy Plug-in: unauthenticated access-control bypass added to CISA KEV, exploited since January against government infrastructure"
    sources:
      - { url: "https://www.cisa.gov/news-events/alerts/2026/08/24/cisa-adds-one-known-exploited-vulnerability-catalog", publisher: "CISA", date: "2026-08-24", role: "primary" }
      - { url: "https://www.securityweek.com/cisa-warns-of-exploited-oracle-weblogic-vulnerability/", publisher: "SecurityWeek", date: "2026-08-25", role: "primary" }
      - { url: "https://www.netspi.com/blog/executive-blog/critical-vulnerability/oracle-weblogic-server-proxy-plugin-cve-2026-21962-overview-takeaways/", publisher: "NetSPI", date: "2026-01-22", role: "corroborating" }
      - { url: "https://socradar.io/blog/snowlight-government-chinese-campaign/", publisher: "SOCRadar", date: "2026-07-31", role: "background" }
    discovery_trace: "first seen at: bridge:cisa-kev, URL https://www.cisa.gov/known-exploited-vulnerabilities-catalog (KEV JSON feed, entries dated >= 2026-08-24) → primary: CISA alert, URL https://www.cisa.gov/news-events/alerts/2026/08/24/cisa-adds-one-known-exploited-vulnerability-catalog → pivot: SecurityWeek, URL https://www.securityweek.com/cisa-warns-of-exploited-oracle-weblogic-vulnerability/ → pivot: NetSPI technical write-up, URL https://www.netspi.com/blog/executive-blog/critical-vulnerability/oracle-weblogic-server-proxy-plugin-cve-2026-21962-overview-takeaways/ → background: SOCRadar SNOWLIGHT report, URL https://socradar.io/blog/snowlight-government-chinese-campaign/"
    summary: |
      CISA added CVE-2026-21962 to its Known Exploited Vulnerabilities catalog on 2026-08-24 — an improper-access-control flaw (CVSS 3.1 base 10.0) in the WebLogic Server Proxy Plug-in for Apache HTTP Server and Microsoft IIS, and in Oracle HTTP Server, which bundles the plug-in. The flaw is remotely exploitable over HTTP with no authentication, no privileges and no user interaction: an attacker sends malformed proxy-forwarding requests that bypass the plug-in's access controls, gaining unauthorized read/write access to data the proxy handles and a pivot path into backend WebLogic clusters — a component that vendor guidance (NetSPI) notes typically sits in a DMZ acting as a trusted gateway, so the flaw undermines exactly the boundary organizations rely on it for. Oracle patched the flaw in its January 2026 Critical Patch Update; CloudSEK's honeypots recorded exploitation attempts beginning 22 January 2026, immediately after a public PoC appeared, and SOCRadar's July 2026 analysis of an exposed China-nexus (UNC5174/UNC6586, SNOWLIGHT malware family) operator's staging server lists CVE-2026-21962 among nine weaponized CVEs used in a campaign SOCRadar states prioritized government-sector targets (>85% of the reconnaissance list resolved to second-level government domains across 100+ countries). SecurityWeek's 2026-08-25 coverage of the KEV listing states it is unclear which specific attacks triggered the addition. CISA instructed FCEB agencies to remediate by 2026-08-27 (BOD 26-04).
    region_nexus: "global; SOCRadar's background reporting on the exploiting operator's target list names government infrastructure across 100+ jurisdictions as the prioritized sector — directly transferable to Swiss federal/cantonal public-sector estates running Oracle HTTP Server / WebLogic as an internet-facing proxy tier"
    primary_sector_nexus: "direct — SOCRadar's cited campaign explicitly prioritizes government-sector (.gov-class) domains; CISA's own KEV listing targets FCEB (federal government) remediation"
    sector: "public-sector"
