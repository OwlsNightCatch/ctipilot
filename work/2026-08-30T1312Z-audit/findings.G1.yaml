    extended_notes: |
      This is a coverage GAP for the audit: not present anywhere in prior_coverage.json. Priority recommendation: high (CVSS 10.0, pre-auth, unauthenticated, months of confirmed exploitation, fresh KEV addition in-window, government-sector nexus in background reporting). Detection concept: web/proxy access logs on Oracle HTTP Server / WebLogic Proxy Plug-in hosts for malformed or anomalous forwarding requests targeting the proxy path (path traversal / header manipulation patterns per multiple secondary sources); hardening: apply Oracle's January 2026 CPU, and treat any DMZ-fronting WebLogic proxy plug-in instance as a priority patch target regardless of whether the backend WebLogic cluster itself is patched.
    priority_recommendation: high

  - title: "CVE-2026-60004 — Gitea diffpatch endpoint: unauthenticated/low-privilege Git-hook code injection added to CISA KEV, exploited to deploy crypto-mining payloads"
    sources:
      - { url: "https://www.cisa.gov/news-events/alerts/2026/08/25/cisa-adds-one-known-exploited-vulnerability-catalog", publisher: "CISA", date: "2026-08-25", role: "primary" }
      - { url: "https://www.helpnetsecurity.com/2026/08/26/gitea-cve-2026-60004-exploited-in-the-wild/", publisher: "Help Net Security", date: "2026-08-26", role: "primary" }
      - { url: "https://github.com/go-gitea/gitea/security/advisories/GHSA-rcr6-4jqh-j84m", publisher: "Gitea (GitHub Security Advisory)", date: "2026-07-28", role: "primary" }
    discovery_trace: "first seen at: bridge:cisa-kev, URL https://www.cisa.gov/known-exploited-vulnerabilities-catalog (KEV JSON feed, dateAdded 2026-08-25) → primary: CISA alert, URL https://www.cisa.gov/news-events/alerts/2026/08/25/cisa-adds-one-known-exploited-vulnerability-catalog → pivot: Help Net Security, URL https://www.helpnetsecurity.com/2026/08/26/gitea-cve-2026-60004-exploited-in-the-wild/ → primary: Gitea GHSA advisory, URL https://github.com/go-gitea/gitea/security/advisories/GHSA-rcr6-4jqh-j84m"
    summary: |
      CISA added CVE-2026-60004 (CVSS 9.8) to its KEV catalog on 2026-08-25: a code-injection flaw in Gitea's diffpatch endpoint (services/repository/files/patch.go), which applies attacker-controlled patches inside a shared bare temporary clone. Submitting the same patch twice creates an add/add collision; Git's three-way merge fallback checks out the indexed path even under `--cached`, and because the repository root in a bare clone is $GIT_DIR, an executable file entry named as a Git hook path becomes a live hook. Git invokes that hook while writing the index, executing repository-controlled shell commands as the Gitea OS/service account. Exploitation needs only ordinary repository write access — with Gitea's default open registration, an unauthenticated visitor obtains that by self-registering and creating a repository, making this effectively unauthenticated against a default install. Help Net Security's 2026-08-26 report of a compromised self-hosted instance (via a developer's own incident writeup on Habr) shows an automated scanner registering an account, creating a repository and triggering the exploit chain end to end: the attacker wrote a "proof" of RCE into a Git branch, then downloaded a universal shell-loader followed by a crypto-miner-like dropper; the whole active phase of the attack took roughly 11 seconds. Depending on deployment isolation, exploitation can expose Gitea's main configuration file, process-environment secrets, database credentials/contents and OAuth/integration credentials. Fixed in Gitea 1.27.1 (28 July 2026); CISA ordered FCEB remediation by 2026-08-28.
    region_nexus: "global; self-hosted Gitea instances are common in government/public-sector development and DevOps estates as a lower-cost alternative to GitHub/GitLab Enterprise"
    primary_sector_nexus: "indirect — no sector-specific targeting reported; relevance is the self-hosted developer-tooling attack surface common across public-sector IT and software-development units"
    sector: "public-sector"
    cves: ["CVE-2026-60004"]
    techniques: ["T1190"]
    affected_products: ["Gitea"]
    entity_keys: ["product:gitea"]
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "An attacker with ordinary write access to a repository can execute arbitrary shell commands as the Gitea OS user."
        attribution: "Gitea maintainers (GitHub Security Advisory)"
        source_url: "https://github.com/go-gitea/gitea/security/advisories/GHSA-rcr6-4jqh-j84m"
      - quote: "With open registration enabled, the attack can be performed by an unauthenticated visitor after registering a normal account and creating a repository."
        attribution: "Gitea maintainers (GitHub Security Advisory)"
        source_url: "https://github.com/go-gitea/gitea/security/advisories/GHSA-rcr6-4jqh-j84m"
      - quote: "Gitea was running in Docker, so after the RCE the code ended up inside its container. The container wasn't privileged, and after restarts the process with the miner-like payload didn't survive the restart."
        attribution: "compromised-instance operator, via Help Net Security"
        source_url: "https://www.helpnetsecurity.com/2026/08/26/gitea-cve-2026-60004-exploited-in-the-wild/"
    extended_notes: |
      Coverage GAP — not in prior_coverage.json. Priority recommendation: high (KEV-confirmed exploitation, CVSS 9.8, effectively unauthenticated on default-configured instances, common self-hosted developer-tooling target). Detection concept: process-creation telemetry on Gitea hosts/containers for the git service account spawning shells/loaders shortly after a diffpatch/PR-diff API call; Git-hook-path anomalies (executable entries named as hook filenames appearing via patch content rather than administrator action). Hardening: upgrade to Gitea >= 1.27.1; disable open self-registration or require email confirmation/CAPTCHA on any internet-reachable instance; restrict outbound network access from the Gitea container/host.
    priority_recommendation: high

  - title: "WatchGuard Fireware OS: eleven CVEs including two pre-authentication remote-code-execution flaws in the IKE daemon (iked) and one in the deprecated Mobile Security epm endpoint — vendor 'immediate action required', no exploitation observed"
    sources:
      - { url: "https://www.watchguard.com/wgrd-blog/immediate-action-required-update-your-firebox-now", publisher: "WatchGuard Technologies", date: "2026-08-27", role: "primary" }
      - { url: "https://psirt.watchguard.com/CVE-2026-19313/", publisher: "WatchGuard PSIRT", date: "2026-08-27", role: "primary" }
      - { url: "https://psirt.watchguard.com/CVE-2026-19315/", publisher: "WatchGuard PSIRT", date: "2026-08-27", role: "primary" }
      - { url: "https://psirt.watchguard.com/CVE-2026-13086/", publisher: "WatchGuard PSIRT", date: "2026-08-27", role: "primary" }
    discovery_trace: "first seen at: bsi-csaf (bridge), URL https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-3068 (BSI CERT-Bund WID-SEC-2026-3068, published 2026-08-28) → primary: WatchGuard vendor blog, URL https://www.watchguard.com/wgrd-blog/immediate-action-required-update-your-firebox-now → primary: WatchGuard PSIRT per-CVE pages, URL https://psirt.watchguard.com/CVE-2026-19313/ and https://psirt.watchguard.com/CVE-2026-19315/ and https://psirt.watchguard.com/CVE-2026-13086/"
    summary: |
      WatchGuard published Fireware OS 2026.2.2 / 12.12.2 / 12.5.20 on 2026-08-27 fixing eleven reserved CVEs, titled by the vendor's own blog "Immediate Action Required — Update Your Firebox Now." Two of the flaws are pre-authentication remote-code-execution bugs in iked, the IKE daemon that handles IPsec VPN negotiation on the Firebox firewall/VPN appliance: CVE-2026-19313 is a heap buffer overflow triggered by specially crafted network traffic reaching the daemon before authentication, and CVE-2026-19315 is a type confusion reached by sending an IKE_AUTH message containing two EAP payloads, causing an out-of-bounds read followed by a free() call on an attacker-influenced pointer — WatchGuard's own advisory states this "may also present potential for further memory corruption and remote code execution beyond denial of service." CVE-2026-19314 is a related integer underflow in iked causing unauthenticated denial of service. A separate flaw, CVE-2026-13086, is a stack-based buffer overflow, reachable without authentication over JSON-RPC, in the epm (Endpoint Protection Manager) service used only by the deprecated Mobile Security feature; WatchGuard's own advisory notes the binary lacks a stack canary and is non-PIE, making return-oriented-programming exploitation "straightforward." WatchGuard states plainly it has "not seen any indication that these vulnerabilities have been exploited" and reserved the CVE IDs itself under responsible disclosure ahead of any public researcher report; credit for CVE-2026-13086 is given to Mat Powell of TrendAI Zero Day Initiative. Germany's BSI CERT-Bund relayed the advisory the following day (WID-SEC-2026-3068, rated "hoch").
    region_nexus: "global; WatchGuard Firebox is a widely deployed SMB/enterprise/public-sector firewall and SSL-VPN appliance — internet-facing by design"
    primary_sector_nexus: "indirect — no sector-specific targeting reported; relevance is the internet-exposed VPN/firewall attack surface"
    sector: "public-sector"
    cves: ["CVE-2026-19313", "CVE-2026-19315", "CVE-2026-19314", "CVE-2026-13086"]
    techniques: ["T1190"]
    affected_products: ["WatchGuard Firebox (Fireware OS)"]
    entity_keys: []
    new_entities:
      - { key: "product:watchguard-fireware-os", type: product, name: "WatchGuard Fireware OS", aliases: ["WatchGuard Firebox"], summary: "Firmware for WatchGuard Firebox firewall/UTM/SSL-VPN appliances; patched 2026-08-27 for eleven vendor-reserved CVEs including two pre-auth RCEs in the iked IKE daemon (WatchGuard, 2026-08-27)." }
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "We have not seen any indication that these vulnerabilities have been exploited."
        attribution: "WatchGuard Technologies"
        source_url: "https://www.watchguard.com/wgrd-blog/immediate-action-required-update-your-firebox-now"
      - quote: "Because the flaw results in an out-of-bounds read followed by a free() call on an attacker-influenced pointer value, it may also present potential for further memory corruption and remote code execution beyond denial of service."
        attribution: "WatchGuard PSIRT"
        source_url: "https://psirt.watchguard.com/CVE-2026-19315/"
      - quote: "The lack of a stack canary and use of a non-PIE binary make exploitation via return-oriented programming straightforward"
        attribution: "WatchGuard PSIRT"
        source_url: "https://psirt.watchguard.com/CVE-2026-13086/"
    extended_notes: |
      Coverage GAP — not in prior_coverage.json. No confirmed exploitation, so priority recommendation is high rather than critical, but the pre-auth RCE class on an internet-facing VPN/firewall appliance plus the vendor's own "immediate action" framing puts this in the same class the store has previously prioritized for other VPN/firewall vendors (Citrix, SonicWall, Ivanti). Detection concept: iked process crash/respawn frequency on Firebox appliances (a pre-crash artifact of failed exploitation attempts against CVE-2026-19313/19315/19314); network telemetry for anomalous or malformed IKE_AUTH exchanges with duplicate/unexpected EAP payloads reaching the WAN-facing VPN interface. Hardening: upgrade to Fireware OS 2026.2.2 / 12.12.2 / 12.5.20; disable the deprecated Mobile Security feature (removes the epm/CVE-2026-13086 attack surface entirely) where not in active use.
    priority_recommendation: high

