    remediate these vulnerabilities in all affected legacy Player V2 versions. Customers
    using legacy players, including self-hosted legacy player deployments (html5lib v2.x),
    should update to the patched version or, preferably, migrate to the newer and currently
    supported Kaltura Player V7 platform." Also: "Notably, only versions of the legacy
    player (Player V2) are vulnerable; these issues do not affect any versions of the
    currently supported Kaltura Player V7." The page's own "Date Last Updated: 2026-08-28
    19:59 UTC" is after this run's research window (04:09 UTC) and after the no-network
    audit pass (15:00 UTC same day), which is presumably why neither caught it — but as of
    this truth pass (2026-08-30) the entry's "no patch" claim is stale and should be
    corrected via a changelog update.
  ground_truth_url: "https://kb.cert.org/vuls/id/308749"

