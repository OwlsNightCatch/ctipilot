- entry: cve-2026-53362-linux-kernel-ipv6-udp-fraggap-kev.md
  verdict: factual-error
  defect: >
    Frontmatter cves[0].auth is "pre-auth", but the entry's own body quotes the CVSS 3.1
    vector as "AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H" — PR:L means the attacker must already
    hold low-level (unprivileged local user) access, which is the opposite of "pre-auth"
    (no privileges required, PR:N). The frontmatter contradicts the entry's own cited
    vector.
  ground_truth: >
    The upstream kernel fix commit (mirrored at gregkh/linux, since git.kernel.org itself
    returns an Anubis anti-bot JS challenge to every fetch rung) and two independent CVE
    aggregators (strix.ai, app.opencve.io) both give CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/
    I:H/A:H, score 7.8 — "Exploitation requires only local access; any user who can open a
    UDPv6 socket [with] MSG_MORE and MSG_SPLICE_PAGES flags simultaneously" (opencve.io),
    i.e. an already-present unprivileged local user, not an unauthenticated remote actor.
  ground_truth_url: "https://github.com/gregkh/linux/commit/14200d435af9a9eeb444f529fc2f689a236b7962"

