- entry: cncmachinerms-babadeda-loader-enumtimeformats-shellcode.md
  verdict: factual-error
  defect: >
    Two evidence quotes attributed to LevelBlue are not contiguous verbatim substrings of
    the source. (1) "A ClickFix lure launches a legitimately signed IBM SPSS IDE
    executable, whose scripting engine is abused to load a malicious DLL." drops ",
    WinWrapIDE.exe," and changes "that launches" to "launches." (2) "It takes a screenshot
    on first contact, then beacons every 600 seconds, with seven persistence mechanisms."
    is a fabricated composite splicing one sentence from a bullet list ("It takes a
    screenshot on first contact, then beacons every 600 seconds.") with a phrase from a
    separate, later paragraph's different list ("...a local account backdoor, seven
    persistence mechanisms, and twenty typed commands...") as if it were one continuous
    quoted sentence.
  ground_truth: >
    LevelBlue's article reads: "Infection starts with a ClickFix lure that launches a
    legitimately signed IBM SPSS IDE executable, WinWrapIDE.exe, whose scripting engine is
    abused to load a malicious DLL." Separately, under "A few other details": "It takes a
    screenshot on first contact, then beacons every 600 seconds." appears as its own bullet,
    and "seven persistence mechanisms" appears only in an unrelated earlier sentence: "The
    1,200+ strings we decoded from the binary describe an interactive shell, a file
