  verdict: factual-error
  defect: >
    The entry's central framing — headline "no vendor response, no patch"; frontmatter
    cves[].status: [no-patch] and fixed: "None available" for both CVE-2026-19912 and
    CVE-2026-19913; body: "no vendor response or patch exists as of 2026-08-28" — is
    contradicted by the entry's own second, cited source (CERT/CC VU#308749), whose
    Solution section states a vendor patch now exists. The entry also omits CERT/CC's
    scoping clarification that only the legacy Player V2 line is affected, not the
    currently supported Kaltura Player V7.
  ground_truth: >
    kb.cert.org/vuls/id/308749 (successfully fetched via jina after extract/url both
