- code: F3
  category: claim-not-supported
  section: basel-landschaft-improvement
  item: "2026-11-21/basel-landschaft-97000-cross-border-work-permits-stolen, ## Improvement 2026-11-22T04:35:05Z (claim 034170c417) and the matching record summary (claim a5d1b1f541)"
  url_or_quote: "the Alertswiss warning of the night that the emergency numbers 112, 117 and 118 might be restricted was withdrawn a few hours later as a precaution, a government spokesperson said ([watson.ch, 2026-11-18](https://www.watson.ch/schweiz/digital/951471601-20-kantonale-applikationen-von-cyberangriff-im-baselbiet-betroffen)); record summary: \"an Alertswiss warning that the emergency numbers might be restricted was withdrawn within hours as a precaution\""
  summary: "watson.ch (fetched this pass) says 'Wenige Stunden spaeter gab es Entwarnung. Die Erreichbarkeit der Notrufnummern sei gewaehrleistet gewesen, sagte Regierungssprecher Nic Kaufmann. Doch habe man die Warnung als Vorsichtsmassnahme herausgegeben, da man nicht gewusst habe, ob noch weitere Server vom Internet isoliert werden muessten.' The precaution was issuing the warning, not withdrawing it, and the spokesperson's point was that the numbers had stayed reachable. The entry hangs the precaution on the withdrawal and drops the reachability statement, which an emergency-services reader would act on. Fix in the section and by amending the record summary: 'was lifted a few hours later; a government spokesperson said the numbers had stayed reachable and the warning had been issued as a precaution because it was unclear whether more servers would have to be isolated'."
- code: F3
  category: claim-not-supported
  section: monai-detection
  item: "2026-11-22/monai-label-path-traversal-zero-day-found-by-cairn-ai-agents, **Detection:** line (claim c1ec8a4892)"
  url_or_quote: "...which the fix neutralises or rejects, and for tar uploads to `PUT /session/` with `uncompress=true`; unexpected creation or change of `sitecustomize.py`, `authorized_keys` or cron entries by the service account; ... ([Project MONAI, 2026-11-18](https://github.com/Project-MONAI/MONAILabel/security/advisories/GHSA-qc22-rmgc-vg94); [Amazon Threat Intelligence, 2026-11-20](https://aws.amazon.com/blogs/security/chinese-nexus-actors-cairn-ai-agents-found-a-zero-day-on-their-own/))"
  summary: "The citation that closes the Detection line is the GHSA advisory plus Amazon. Neither mentions session upload, uncompress=true or tar archives (fetched this pass); that clause is carried only by the 0.8.6 release notes (release notes: 'PUT /session/?uncompress=true extracted uploaded tar archives without checking member names'), which this line does not cite. Fix: add the release-notes link (https://github.com/Project-MONAI/MONAILabel/releases/tag/0.8.6) to the Detection citation. The datastore-endpoint, sitecustomize.py and training-endpoint clauses are supported by the cited pages."
- code: F11
  category: editorial-advisory
  section: java4shell-debian-dating
  item: "2026-11-18/cve-2026-114938-java4shell-openjdk-avx512-base64-decoder-rce, ## Improvement 2026-11-22T04:45:27Z Debian clause, sources[] Debian record, run-record note (claim d10390786f)"
  url_or_quote: "As of 2026-11-22 Debian's tracker lists fixed security builds 17.0.21.1+2-1~deb12u1 for bookworm ... ([Debian security tracker, 2026-11-22](https://security-tracker.debian.org/tracker/CVE-2026-114938)); run note: \"the Debian bookworm fix for Java4Shell is undated on the tracker\""
  summary: "(low confidence, optional) The clause is true as read today and the 'as of' wording is honest, but the link label and sources[].date still carry the processing date of an undated living page. The fixes are dated and the dates are now readable: Debian Security Advisory DSA-6639-1 (openjdk-21, header 'Thu, 19 Nov 2026 11:07:21 +0000', https://lists.debian.org/debian-security-announce/2026/msg00561.html, covers CVE-2026-114938) and Debian LTS Advisory DLA-4917-1 (openjdk-17, header 'Thu, 19 Nov 2026 17:22:15 +0100', https://lists.debian.org/debian-lts-announce/2026/11/msg00042.html, lists CVE-2026-114938); all fetched this pass. This also confirms the record type `improvement` is right (the fixes predate the previous fire) and lets the run note say 'dated 2026-11-19' instead of 'undated'. Fix if the main agent wants it: cite the two announcements with 2026-11-19, keep the tracker for the forky rows."
