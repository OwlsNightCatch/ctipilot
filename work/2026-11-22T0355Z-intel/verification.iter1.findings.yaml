  item: "(low confidence) 'Cisco's advisory of 2026-10-14 describes CVE-2026-76519, a relative path traversal in the Advanced Malware Protection feature' (body) and summary 'a relative path traversal in the Advanced Malware Protection (file reputation) path'"
