  item: "Update 2026-11-19: 'Tenable adds that as of 2026-11-18 Red Hat and Ubuntu had released no fix and Debian had fixed only its unstable branch, so hosts on those distributions had no stable vendor build yet' vs the new Improvement section"
  url_or_quote: "https://ubuntu.com/security/CVE-2026-114938 : USN-9155-1, USN-9156-1, USN-9157-1, USN-9158-1 all '18 November 2026'; https://www.tenable.com/blog/java4shell-cve-2026-114938-frequently-asked-questions-about-openjdk-rce-vulnerability now reads 'Ubuntu released fixes for its openjdk-17, openjdk-21, openjdk-25 and openjdk-27 packages on November 18' and 'As of November 19, Red Hat has released fixed OpenJDK packages for Red Hat Enterprise Linux'"
  summary: "The newest section lists Ubuntu and Debian fixes but leaves the older 'no fix yet' sentence standing and says nothing about Red Hat, which Tenable's updated page reports as fixed on 2026-11-19. Add a one-clause reconciliation (the earlier status was superseded; Red Hat has fixed packages) so the entry does not carry both."
