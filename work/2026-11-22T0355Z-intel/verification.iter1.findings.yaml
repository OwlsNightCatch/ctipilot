- code: F4
  category: hallucinated-fact
  section: entries/2026-11-22/monai-label-path-traversal-zero-day-found-by-cairn-ai-agents
  item: "MONAI Label path traversal entry: title, summary, actions[0], Exposure, Defender takeaway, cves[], sourcing_note"
  url_or_quote: "title: 'a flaw with no CVE id ... the project's fix is merged but not yet in a release'; actions[0]: 'because the project's fix is not yet in a release'; Exposure: 'the advisory names no affected version range and no released fixed version'; takeaway: 'the project's three workarounds are the control until a release ships'; cves: []. Contradicted by https://github.com/Project-MONAI/MONAILabel/releases (MONAI Label 0.8.6, 'This is a security release. All MONAI Label server deployments should upgrade', CVE-2026-133968 / GHSA-qc22-rmgc-vg94, 'Affects all versions up to and including 0.8.5', release timestamp 2026-11-22T01:29:24Z) and the MITRE record https://cveawg.mitre.org/api/cve/CVE-2026-133968 (published 2026-11-20, CVSS 3.1 9.8, 'monailabel (aka MONAI Label) through 0.8.5 ... as exploited in the wild starting in September 2026')"
  summary: "A fixed release (0.8.6) and CVE-2026-133968 both existed before the run started (03:55Z) and before the entry was composed (04:42Z); the entry tells defenders there is no CVE, no fixed version and that workarounds are the only control. Rewrite title/summary/actions/Exposure/takeaway/sourcing_note, add the cves[] record (affected <=0.8.5, fixed 0.8.6), drop the no-patch tag, cite the release notes. The GHSA page text itself still says 'next release', which is why the stale reading was easy to make, but the release page is public."
- code: F4
  category: hallucinated-fact
  section: entries/2026-11-22/monai-label-path-traversal-zero-day-found-by-cairn-ai-agents
  item: "MONAI Label summary: 'and reused it against a second university network'"
  url_or_quote: "https://aws.amazon.com/blogs/security/chinese-nexus-actors-cairn-ai-agents-found-a-zero-day-on-their-own/ : 'The server that the proxy connected to was running the same vulnerable software, and we infer the actor had used the zero-day to compromise it and establish the tunnel.'"
  summary: "Amazon states the second-network compromise as an inference; the summary states it as fact. The body paragraph is neutral ('gave the agents a proxy into a second university network that ran the same software'), the summary is not; restore the hedge."
- code: F3
  category: claim-not-supported
  section: entries/2026-11-22/monai-label-path-traversal-zero-day-found-by-cairn-ai-agents
  item: "(low confidence) Detection: 'parent-directory sequences, which the fix rejects with an error, so legitimate uploads do not need them'"
  url_or_quote: "https://github.com/Project-MONAI/MONAILabel/security/advisories/GHSA-qc22-rmgc-vg94 : 'The /datastore/image endpoint also reduces the image ID to its basename and rejects empty or dot-prefixed IDs with HTTP 400.' and 'reject any path outside the datastore image/labels directories'"
  summary: "The advisory says the endpoint reduces the ID to its basename (a '../x' value is neutralised, not necessarily answered with an error); only the datastore functions and empty or dot-prefixed IDs are rejected. The inference 'legitimate uploads do not need them' is the entry's own. Soften to what the advisory states."
