      Related items already in the store: ARTEX entries of 2026-10-22, 2026-11-06, 2026-11-15, 2026-11-18 (Barracuda, ARTEX-consistent); the FBI FLASH-2026-1113-001 itself (13 November) is not the subject of any prior entry that this run's prior_coverage lists by that name: S3/S1 may carry it as research.
