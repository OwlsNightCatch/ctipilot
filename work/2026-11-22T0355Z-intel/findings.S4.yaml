  - title: "Rackspace Spot: leaked credentials let an unauthorized party act as legitimate users in some customer organisations on 2026-11-17, create pods, read Kubernetes Secrets and list nodes and volumes"
    sources:
      - { url: "https://www.bleepingcomputer.com/news/security/rackspace-spot-breach-let-hackers-access-customer-kubernetes-secrets/", publisher: "BleepingComputer", date: "2026-11-21", role: "primary" }
    discovery_trace: "first seen at: bleepingcomputer, URL https://www.bleepingcomputer.com/feed/ (feed item 'Rackspace Spot breach let hackers access customer Kubernetes secrets', 2026-11-21) → primary reporting: BleepingComputer article, URL https://www.bleepingcomputer.com/news/security/rackspace-spot-breach-let-hackers-access-customer-kubernetes-secrets/ (Rackspace's customer notification obtained by BleepingComputer). WebSearch ('Rackspace Spot unauthorized party leaked credentials Kubernetes Secrets November 17 2026 customers') found no second outlet; the Reddit thread BleepingComputer cites was not fetched."
    summary: |
      Facts per Rackspace's customer notification as quoted by BleepingComputer: an unauthorized party used leaked credentials to access parts of Rackspace Spot between about 00:20 and 22:00 UTC on 2026-11-17; Rackspace learned of it on 2026-11-18 from a customer report and confirmed that customer's organisation was affected the same day. The intruder could act as legitimate users in some customer organisations: create pods in Kubernetes clusters, read Kubernetes Secrets, and list nodes and volumes, so any Secret in an affected user's clusters and any Spot API or refresh token held by that user must be treated as readable. Rackspace revoked tokens and sessions, removed the unauthorized pods, rotated keys and tightened access controls and monitoring, and tells affected customers to reissue Spot API tokens, replace refresh tokens in automation, download fresh Kubernetes configuration files, rotate credentials stored in cluster Secrets, and review logs of databases, container registries, Git repositories, cloud storage and third-party services back to 2026-11-17. The Spot console was down for an extended period because the platform and Platform9, which co-developed it, shut access while sanitising the environment; service was restored on 2026-11-21 (Platform9's co-founder, via a Reddit post BleepingComputer quotes). Rackspace has not said how many customers were affected or whether data was stolen. The notice shares indicators (an IP address, a range and pod-name prefixes) that are deliberately not repeated here.
    region_nexus: "global cloud platform; no Swiss nexus stated"
    primary_sector_nexus: "indirect at most: Kubernetes secrets as the pivot into databases, registries, Git and cloud storage"
    sector: "technology / cloud"
    cves: []
    techniques: [T1078.004, T1552.007]
    affected_products: ["Rackspace Spot"]
    entity_keys: []
    new_entities: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    classification_suggestion: { reliability: B, credibility: 2 }
    novelty: new
    borderline: true
    borderline_reason: "no Swiss or public-sector nexus and single-source (BleepingComputer relaying Rackspace's customer notice); transferable TTP only (leaked credential used as a legitimate tenant user to read Kubernetes Secrets, detected through a customer report); the main agent should drop unless a Swiss customer appears or a source links it to the same-day Bell intrusion; no source links them"
    evidence:
      - quote: "On 17 November 2026 (about 00:20–22:00 UTC), an unauthorized party used leaked credentials to access parts of Rackspace Spot"
        attribution: "BleepingComputer (quoting Rackspace's notification)"
        source_url: "https://www.bleepingcomputer.com/news/security/rackspace-spot-breach-let-hackers-access-customer-kubernetes-secrets/"
      - quote: "Rackspace warned that the attackers could have read any Secret stored in an affected user's clusters, as well as any Spot API tokens or refresh tokens held by that user."
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/rackspace-spot-breach-let-hackers-access-customer-kubernetes-secrets/"
    extended_notes: |
      Technique check: T1078.004 (Cloud Accounts) and T1552.007 (Unsecured Credentials: Container API) are both active in the pinned dataset (checked in this run); T1613 (Container and Resource Discovery) is also active and fits the node and volume listing if the main agent wants a third id.

