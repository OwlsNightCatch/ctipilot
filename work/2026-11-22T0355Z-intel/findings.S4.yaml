  - title: "Microsoft Entra Connect Health: an API flaw live from 2026-07-23 to the 2026-11-19 server-side fix let unauthorized parties read tenant metadata, administrator e-mail addresses included; Microsoft is notifying tenants and says no customer patch is needed"
    sources:
      - { url: "https://www.bleepingcomputer.com/news/security/microsoft-entra-connect-health-flaw-exploited-to-steal-tenant-data/", publisher: "BleepingComputer", date: "2026-11-21", role: "primary" }
      - { url: "https://www.neowin.net/news/after-outage-microsoft-confirms-another-july-bug-that-led-to-entra-data-breach/", publisher: "Neowin", date: "2026-11-21", role: "corroborating" }
      - { url: "https://windowsforum.com/news/microsoft-entra-connect-health-api-flaw-exposed-admin-emails-and-tenant-data.453553/", publisher: "WindowsForum", date: "2026-11-21", role: "corroborating" }
    discovery_trace: "first seen at: bleepingcomputer, URL https://www.bleepingcomputer.com/feed/ (feed item 'Microsoft Entra Connect Health flaw exploited to steal tenant data', 2026-11-21) → primary reporting: BleepingComputer article, URL https://www.bleepingcomputer.com/news/security/microsoft-entra-connect-health-flaw-exploited-to-steal-tenant-data/ (cites the Microsoft customer notification shared on Reddit, https://www.reddit.com/r/sysadmin/comments/1y1of2u/important_security_notification_regarding/ — not fetchable from any transport; plus a Microsoft spokesperson statement to BleepingComputer) → WebSearch ('Entra Connect Health API flaw tenant metadata exposed notification admins phishing-resistant MFA') → Neowin, URL https://www.neowin.net/news/after-outage-microsoft-confirms-another-july-bug-that-led-to-entra-data-breach/ and WindowsForum, URL https://windowsforum.com/news/microsoft-entra-connect-health-api-flaw-exposed-admin-emails-and-tenant-data.453553/. Microsoft's own notice (Azure Service Health message) not publicly fetchable; no MSRC/Learn page found."
    summary: |
      Facts per Microsoft's customer notification as quoted by BleepingComputer and Neowin: Microsoft detected on 2026-11-09 a vulnerability in the Microsoft Entra Connect Health API that had been introduced on 2026-07-23, deployed a server-side fix on 2026-11-19 and concluded its investigation on 2026-11-20, finding that unauthorized read-only access to tenant-level metadata had occurred for the notified organisations and that no unauthorized configuration change was identified. The API returned email addresses of tenant technical contacts and administrator accounts; tenant ID, display name, initial domain name, country code and region scope; Entra license tier; directory-synchronization status including whether sync is enabled and the last sync timestamp; Connect Health onboarding status; and an expired certificate once used to register Connect Health agents with an internal Microsoft service decommissioned in late 2024 (no longer in use but still held in Connect Health storage and returned by the API). Microsoft says passwords, password hashes, authentication tokens, valid cryptographic keys, on-premises server and Active Directory topology, and Azure subscription information were not exposed, and that no software update or other customer remediation is required. Microsoft's advice, as relayed by BleepingComputer: alert security teams to targeted phishing and social engineering aimed at the exposed administrator addresses, make sure privileged accounts use phishing-resistant MFA, review Connect Health configurations and examine Entra audit and sign-in logs; Microsoft also published a PowerShell script that shows the types of tenant metadata that could have been exposed, but BleepingComputer notes it displays current configuration values, not what was accessed. Unknown: how many tenants were affected, who exploited the flaw, and when exploitation began (July 23 is only the earliest possible date); MSPs report separate notices for several customer tenants. Microsoft declined further detail to BleepingComputer. Assessment (WindowsForum, not Microsoft): the data lets an attacker write a convincing "Entra sync failure" lure addressed to the right administrator; it names the vulnerable call as GetTenant, which Microsoft has not confirmed.
    region_nexus: "global SaaS control-plane incident; Swiss public-sector tenants running hybrid identity (Entra Connect / Connect Health agents) are plausible recipients of the notice, but no Swiss recipient is named in any source"
    primary_sector_nexus: "indirect: administrator and technical-contact addresses of government tenants are the exposed asset; the follow-on risk is targeted phishing of identity administrators"
    sector: "public-sector, cross-sector"
    cves: []
    techniques: [T1190, T1589.002]
    affected_products: ["Microsoft Entra Connect Health"]
    entity_keys: ["product:microsoft-entra-id"]
    new_entities:
      - { key: "product:microsoft-entra-connect-health", type: product, name: "Microsoft Entra Connect Health", aliases: ["Azure AD Connect Health"],
          summary: "Cloud monitoring service in the Microsoft Entra admin center for the health, performance and alerts of on-premises identity infrastructure (BleepingComputer, 2026-11-21)." }
      - { key: "incident:microsoft-entra-connect-health-api-tenant-metadata-2026-11", type: incident, name: "Microsoft Entra Connect Health API tenant-metadata exposure (July to November 2026)",
          aliases: [],
          summary: "Microsoft says an API flaw introduced 2026-07-23 and fixed server-side on 2026-11-19 let unauthorized parties read tenant-level contact and configuration metadata, administrator e-mail addresses included; notifications began 2026-11-20 (BleepingComputer, Neowin, 2026-11-21)." }
    relation_suggestions:
