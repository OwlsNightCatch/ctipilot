    extended_notes: |
      DEDUP NOTE (found after drafting): the existing ARTEX entry already has an update record (2026-11-20T05:12:58Z) and a body paragraph on this Commission campaign, cited to the European Commission's midday-briefing transcript (https://audiovisual.ec.europa.eu/en/media/video/I-298222, not fetched in this run), Politico and Cyber Security News; prior_coverage.json shows only the entry headline, so the match was invisible at the headline level. Treat this item as a duplicate and use it only as optional enrichment. Residual details not in that paragraph: The Record quotes Regnier that the Commission has had three disclosed incidents this year (Ivanti in January, cloud infrastructure in March; not linked by officials) and that it saw 'no hiding whatsoever'; Politico adds Sysper's second crash on 2026-11-18, the translation-service hit on 2026-11-17, the Corporate Management Board's urgent meeting, the digital services department's stepped-up security checks, salaries paid but timesheets and leave requests blocked, and an IT reply to staff that cited a general Sysper problem without naming an attack. The existing paragraph says the Commission confirmed detection on 2026-10-22 and confirmation on 2026-10-26 (from the EC transcript); The Record gives only the 2026-10-22 detection date.
      Technique mapping: T1595.002 follows from Politico's description of ARTEX as a tool built to identify vulnerabilities; T1190 is the tool's documented purpose (FBI FLASH, SentinelOne comment), not a Commission-specific fact: no source states the Commission's initial access vector, so the entry should say so and keep the mapping hedged.
