    discovery_trace: "first seen at: inside-it-ch RSS, URL https://www.inside-it.ch/rss.xml (item 'Publica lässt Cybervorfall extern prüfen', 2026-11-19) → pivot: Inside IT article, URL https://www.inside-it.ch/publica-laesst-cybervorfall-extern-pruefen-20261119 → primary: Publica event page, URL https://www.publica.ch/de/cyberangriff-auf-softwarelieferanten (2026-11-19 'Stand' section; body of that section only readable through WebFetch, which surfaced the two links below) → primary: Publica press page, URL https://publica.ch/de/ueber-uns/aktuell/cyberangriff-auf-softwarelieferanten-publica-laesst-umgang-mit-personendaten-und-sicherheitskontrollen-extern-untersuchen and Publica newsletter PDF, URL https://publica.ch/de/dokumente/publica-laesst-sicherheitsvorkehrungen-unabhaengig-ueberpruefen"
    summary: |
      New in Publica's own words (press page and newsletter, both dated 2026-11-19): Publica says it must assume personal data of insured, former and retired persons left "from the test environment at the software supplier" (aus der Testumgebung beim Softwarelieferanten) and that its production systems were not affected; the Kassenkommission, its highest body, ordered an independent external review of how a possible data outflow could occur despite existing safeguards, whether responsibilities were properly exercised and where improvements are needed, including the Kassenkommission's own supervision. The review has four areas: procurement and contracts (selection of the supplier, agreed data-protection and information-security requirements); handling of personal data (transfer, processing, protection, access rights); controls (security requirements, effectiveness of existing controls); and leadership and oversight (responsibilities, information paths, decisions between the commission, committees and management). The approach is to be fixed by the end of January 2027 and a first report is planned by the end of March 2027; the external firm must report immediately any security risk that needs instant action. The review excludes the criminal investigation and the investigation at the supplier, which Publica leaves to the Federal Prosecutor's Office and the Federal Data Protection and Information Commissioner. The newsletter tells insured persons to assume their own data may be affected as a precaution; Publica still cannot say which data left or whose, knows of no person demonstrably harmed, and has no indication of publication on the darkweb. The entry's existing statements on actor, ransom demand and customers are untouched.
