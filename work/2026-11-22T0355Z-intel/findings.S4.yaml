    novelty: new
    evidence:
      - quote: "On 20 November 2026, we concluded our investigation and determined that unauthorized read-only access to tenant-level metadata associated with your organization had occurred."
        attribution: "BleepingComputer (quoting Microsoft's customer notification)"
        source_url: "https://www.bleepingcomputer.com/news/security/microsoft-entra-connect-health-flaw-exploited-to-steal-tenant-data/"
      - quote: "We deployed a fix on November 19, 2026, and have notified impacted customers through Azure Service Health, providing guidance and support"
        attribution: "BleepingComputer (quoting a Microsoft spokesperson)"
        source_url: "https://www.bleepingcomputer.com/news/security/microsoft-entra-connect-health-flaw-exploited-to-steal-tenant-data/"
      - quote: "The notification says no software updates or other customer remediation are required to address the vulnerability."
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/microsoft-entra-connect-health-flaw-exploited-to-steal-tenant-data/"
      - quote: "Microsoft has not disclosed who exploited the vulnerability, how many tenants were impacted, or when the attacks first began."
        attribution: "BleepingComputer"
        source_url: "https://www.bleepingcomputer.com/news/security/microsoft-entra-connect-health-flaw-exploited-to-steal-tenant-data/"
    extended_notes: |
      Exposure: the notice reaches tenants through Azure Service Health; a tenant that never ran Connect Health agents may still hold onboarding data. Detection (telemetry class first): mail-gateway logs for messages that impersonate Microsoft Entra or a Connect Health alert and are addressed to tenant technical-contact or Global Administrator mailboxes; identity sign-in and audit logs for privileged accounts (Microsoft's own advice). There is no post-patch eviction step because Microsoft says no credential, token or key was exposed and no configuration change was seen; the residual risk is social engineering with correct tenant details. WindowsForum quotes SecurityOnline advising administrators to open the Azure portal directly to verify any such notice instead of following links in e-mail: that is the outlet's advice, not Microsoft's. Context only: Neowin ties the story to a Microsoft 365 outage in the same week that Microsoft traced to a July software defect; the sources do not link the two. aka.ms/ConnectHealth/scripts (Microsoft's script link) resolved to a GitHub page that was not read.
      No Triage line: no source offers a discriminator beyond verifying the notice in the portal.
      Admiralty suggestion: source B (BleepingComputer), credibility 2: the underlying document is Microsoft's own notification, confirmed to the press by a Microsoft spokesperson, but the notice itself could not be read first-hand.

