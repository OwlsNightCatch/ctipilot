    discovery_trace: "first seen at: inside-it-ch RSS, URL https://www.inside-it.ch/rss.xml (item 'EU-Kommission bestätigt Cyberangriff', 2026-11-19) → pivot: Inside IT article, URL https://www.inside-it.ch/eu-kommission-bestaetigt-cyberangriff-20261119 → primary reporting: Politico Brussels Playbook, URL https://www.politico.eu/newsletter/brussels-playbook/cyberattack-hits-the-commission/ → WebSearch ('CERT-EU ARTEX AI tool threat advisory European Commission cyberattack Sysper') → The Record, URL https://therecord.media/european-commission-confirms-cyberattack-using-ai (carries the Commission spokesperson's own briefing statements) → Netzwoche, URL https://www.netzwoche.ch/news/2026-11-20/kriminelle-greifen-systeme-der-eu-kommission-mit-ki-tool-an → FBI FLASH via Borncity link, URL https://www.ic3.gov/CSA/2026/261113.pdf (read with the pdf transport). No CERT-EU page naming the Commission case could be fetched; The Register body was nav-only on every transport."
    summary: |
      Facts (Commission spokesperson Thomas Regnier, as reported by The Record from a 2026-11-19 briefing): the first signs of the attack were detected on 2026-10-22; the Commission calls it an "AI-generated cyber campaign" and did not name the tool or the attackers' motive; several services were taken offline as a protective measure, affected individuals were notified, other systems are being checked preventively, CERT-EU and the European Data Protection Supervisor are in the loop, investigators found no evidence of a data breach affecting staff broadly and know of no ransom demand, and the investigation is open. Reporting (Politico, from an anonymous EU official and a leaked internal mail): disruption lasted over ten days; the HR platform Sysper (payslips, leave, timesheets) and the medical-reimbursement system MyPMO were restored earlier in the week although Sysper crashed again on 2026-11-18, translation services were hit on 2026-11-17, salaries were paid but some staff could not submit timesheets or request leave, the Corporate Management Board met urgently and the digital services department ordered stepped-up security checks; the same official says CERT-EU detected that international hackers used ARTEX, an openly available AI tool built to find vulnerabilities, and that investigators do not yet know whether staff personal data was compromised. The Commission itself did not confirm ARTEX; the tool attribution rests on Politico's anonymous source citing CERT-EU, and no initial access vector or actor has been named. Assessment owner: SentinelOne's Shaun Williams (via The Record) reads the case as showing that tools like ARTEX let actors find and exploit flaws in internet-facing devices faster, cheaper and with less skill, not as proof of any one actor. Context from the FBI's 2026-11-13 FLASH: since at least August 2026 a variety of actors have used ARTEX against government and other sectors, some intrusions going from initial targeting to privileged access in under three hours, and the framework favours overlooked peripheral systems such as partner and supplier portals and self-service applications. Disclosure lag: detection on 2026-10-22, first public report on 2026-11-19; the Commission says it did not hide the incident and that publicising defensive measures could weaken them. The Commission's third disclosed incident this year (Ivanti in January, cloud infrastructure in March); officials have not linked them (The Record).
