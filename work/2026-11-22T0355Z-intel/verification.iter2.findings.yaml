- code: F3
  category: claim-not-supported
  section: java4shell-improvement
  item: "2026-11-18/cve-2026-114938-java4shell-openjdk-avx512-base64-decoder-rce, ## Improvement 2026-11-22T04:45:27Z and sources[]"
  url_or_quote: "([Ubuntu, 2026-11-20](https://ubuntu.com/security/CVE-2026-114938)) ... ([Debian security tracker, 2026-11-22](https://security-tracker.debian.org/tracker/CVE-2026-114938))"
  summary: "(low confidence) Citation dates. Ubuntu page: 'Publication date 18 November 2026 / Last updated 20 November 2026' (USNs 9155-9158 dated 18 November), label is 2026-11-20. Debian tracker has no dateline (DSA/DLA pages carry none either), so 2026-11-22 is the run's processing date, which the dating rule forbids. The run-record note 'every fact they add predates the window' then rests on an undated Debian page: Tenable (as of 2026-11-19) listed Debian 12 openjdk-17 as still vulnerable and the tracker now shows DLA-4917-1 fixed, with no date for that fix. Fix: date Ubuntu 2026-11-18 and either date the Debian row from DSA-6639/6640 and DLA-4917 or drop its date claim; if the bookworm fix post-dates 2026-11-21T01:55Z the record should be type update."
- code: F3
  category: claim-not-supported
  section: cisco-esa-body
  item: "2026-10-15/cve-2026-76519-cisco-secure-email-gateway-file-write-root, first body sentence"
  url_or_quote: "Cisco's advisory of 2026-10-14 describes CVE-2026-76519, a relative path traversal ([CISA, 2026-10-14](https://www.cisa.gov/news-events/alerts/2026/10/14/cisa-adds-four-known-exploited-vulnerabilities-catalog))"
  summary: "(low confidence) The remediation co-cited the weakness name to CISA, but the sentence still credits Cisco's advisory with it. Cisco's advisory (title 'Arbitrary File Write Vulnerability', fetched this pass) never says 'path traversal' or names a CWE; the term comes from CISA's KEV line 'CVE-2026-76519 Cisco Secure Email Gateway Relative Path Traversal Vulnerability' and BleepingComputer. Fix: 'CVE-2026-76519, which CISA's catalog lists as a relative path traversal' or move the term out of the Cisco-attributed clause."
- code: F4
  category: hallucinated-fact
  section: basel-landschaft-summary
  item: "2026-11-21/basel-landschaft-97000-cross-border-work-permits-stolen, summary"
  url_or_quote: "with names, addresses, birth dates, nationality, occupation, the ZEMIS identification number and employers' contact details"
  summary: "(low confidence) Both readable relays of the canton's communique list the fields as 'Name, Wohnadresse, Geburtsdatum, Zivilstand, Berufsfunktion und ... ZEMIS ... sowie Kontaktdaten von Arbeitgebern' (Polizeiticker; Inside IT identical). 'Zivilstand' is civil status; neither relay mentions nationality. The canton FAQ page, which may list nationality, returned 403 on every transport this pass, so it could not be checked. Fix: replace 'nationality' with 'civil status' unless the FAQ text is confirmed to say nationality."
- code: F10
  category: missed-angle
  section: coverage
  item: "Synology DSM OAuth API, Synology-SA-26:21, CVE-2026-120382"
  url_or_quote: "https://www.synology.com/en-global/support/security/Synology_SA_26_21"
  summary: "(low confidence) SA-26:21 (published 2026-11-19, revised 2026-11-20): unauthenticated CWE-88 argument injection in the DSM OAuth API, CVSS 3.1 9.8 (AV:N/AC:L/PR:N), arbitrary file read/write, mitigation 'Deactivate the OAuth Service package', same fixed builds 7.4.1-90080-2 and 7.3.2-86009-6, 7.2.x/7.1/BeeStation ongoing. The nginx2root entry now carries the weaker SA-26:20 DSM row and an action to update DSM to those builds, while the run record calls SA-26:21 'a missed item' and defers it to the audit; the store already carries two Synology DSM pre-auth entries. No exploitation reported (web search: none), so this is a gate judgement; if kept out, the deferral is defensible, but a reader acting on the nginx DSM action is not told the same builds fix a 9.8 flaw. Suggested query: 'Synology-SA-26:21 CVE-2026-120382 DSM OAuth'. A new entry (references to the two earlier Synology entries) or a changelog record on the closest Synology entry, not the nginx2root entry."
- code: F11
  category: editorial-advisory
  section: monai-sourcing-note
  item: "2026-11-22/monai-label-path-traversal-zero-day-found-by-cairn-ai-agents, sourcing_note"
  url_or_quote: "are from the CVE record, which was read for the id and the score."
  summary: "Process narration ('was read for the id and the score') and four sentences where two of provenance suffice; the CVE record is also the only source of 'exploited from September 2026' in the title, headline and summary yet is not linked anywhere a reader can follow (Amazon's post, which links the project advisory, documents the September activity). The CVE record's own CISA ADP SSVC block says Exploitation: none while the CNA text says exploited in the wild. Fix: name the CVE record as the basis of the score and the exploitation statement in one sentence and keep the Amazon-inference sentence; drop 'which was read for'. Optional."
- code: F11
  category: editorial-advisory
  section: basel-landschaft-faq-unverified
  item: "2026-11-21/basel-landschaft-97000-cross-border-work-permits-stolen, FAQ-only claims"
  url_or_quote: "https://www.baselland.ch/politik-und-behorden/direktionen/sicherheitsdirektion/amt_fuer_migration/bewilligungen/faq-data/"
  summary: "Five ledger claims (efe749b6fa, 82fcad3fbc, c8497938f4, b15ed84420, e8e8862f40) could not be checked against the canton FAQ page: extract returned an empty body, url failed on both transports (jina credit exhausted), WebFetch 403. Polizeiticker corroborates the forensic finding, the permit-G database, 97'000 records, the 28 November 2016 start, employer contact data, the criminal complaint and the platform shutdown, but not 'cannot establish which records / assumes all', the completed-procedures retention, the uploaded-documents statement or the employer-directed phishing warning. Verdict unreadable, not ok; the evidence[] quotes (FAQ originals) were not re-checked by this pass either (the gate's quote-literal check passed them)."
