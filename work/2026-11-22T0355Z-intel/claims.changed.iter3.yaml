    entry: 2026-10-15/cve-2026-76519-cisco-secure-email-gateway-file-write-root
    surface: "summary"
    kind: frontmatter
    text: "Cisco's advisory of 2026-10-14 fixes CVE-2026-76519, an arbitrary file write in the Advanced Malware Protection (file reputation) path of Cisco Secure Email Gateway that lets an unauthenticated attacker who sends one crafted attachment through the device write files and run commands as root (CVSS 9.8); Cisco says its PSIRT became aware of exploitation in October 2026, and CISA listed the flaw in KEV the same day. Only gateways with File Reputation enabled on a mail policy and Content Scanner Tools earlier than 25.3.0.5525 are exposed; there is no workaround, and the fix ships as a Content Scanner Tools update that needs no restart or upgrade, and in AsyncOS 15.5.5-014 and 16.5.0-780; a public Metasploit exploit module has existed since 2026-11-05."
