- title: 'Ruby2Shell follow-up: Veria Labs table revised 2026-11-21 shows Chatwoot patched (4.20.1) and only GitHub Enterprise Server without a fix; GitLab''s own critical patch release 19.6.1, 19.5.8 and
    19.4.10 confirms the Ruby fix; Rails proof of concept still announced for 25 November'
