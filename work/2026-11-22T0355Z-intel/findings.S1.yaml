  summary: Rapid7's Metasploit wrap-up of 2026-11-20 lists a new exploit module for CVE-2026-76519, the Cisco Secure Email Gateway Advanced Malware Protection (File Reputation) arbitrary file write that
    Cisco and CISA already treat as exploited; the pull request merged on 2026-11-05. Per the author, processing a TAR archive that contains a PAX archive lets the attacker force an existing file to be
    overwritten; the module overwrites an existing script that a cron job executes every five minutes, giving remote code execution with root privileges, and it was tested against a gateway on 15.5.1-055
    with the AMP File Reputation feature enabled for inbound mail. The covered entry (published 2026-10-15, never updated) describes the flaw as exploited and fixed through Content Scanner Tools but does
    not mention that a public, working module now exists; the same author's SQL-injection modules for CVE-2026-76461 were added to that CVE's entry on 2026-11-07. CVE-2026-76519 carries EPSS 0.062 (2026-11-21).
