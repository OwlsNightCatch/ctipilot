  summary: WatchGuard published fifteen advisories for WatchGuard Dimension, its log and reporting appliance, on 2026-11-19; every one lists Dimension 2.0 up to but excluding 2.3.2 as affected and Dimension
    2.3.2 as the solution, and each states WatchGuard is not aware of exploitation in the wild. CVE-2026-86130 (listing score 9.3, CVSS 4.0 vector AV:N/AC:L/AT:N/PR:N/UI:N per the Watchtower mirror) is
    a missing-authentication flaw in the log collection service that lets a remote, unauthenticated attacker execute arbitrary SQL statements and ultimately code as the Dimension WebUI process user by sending
    crafted network requests. CVE-2026-93911 (SQL injection in the log collector) and CVE-2026-93912 (code injection in log notification processing, both 8.7) give code execution to an authenticated managed
    device or anyone holding a valid device logging key. CVE-2026-84322 and CVE-2026-86094 (both 9.3) let a low-privileged Dimension Administrator read the session identifiers of logged-in Super Administrators
    from a management API response or the diagnostic log and take their accounts over; CVE-2026-86126 (8.6) is a CSRF that creates a persistent Super Administrator when an authenticated Super Administrator
    visits a malicious page; CVE-2026-93917 (8.6) lets the holder of one enrolled device's credentials take over another managed device's identity. The remaining rows are file-write, command-injection,
    CRLF-injection, snapshot-restore and authorization flaws between 5.3 and 8.6. The listing also carries WatchGuard's NGINX2Root bulletin WGSA-2026-0034 (informational, 2026-11-18) and the Fireware OS
    batch of 2026-10-27, which the store already covers in 2026-10-29/watchguard-fireware-2026-4-three-preauth-rows-at-9-2; no Dimension row is in the store apart from the kernel bulletin WGSA-2026-0033.
  region_nexus: global; no Swiss-specific source; WatchGuard Firebox fleets are the management context for Dimension
