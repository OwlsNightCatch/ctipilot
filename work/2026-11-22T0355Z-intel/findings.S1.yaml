  discovery_trace: 'first seen at: covered-entry follow-up check of 2026-11-20/ruby-4-0-10-regexp-case-conversion-memory-flaws (named by the main agent: Ruby 25 Nov exploit) → primary: Veria Labs page,
    URL https://verialabs.com/ruby2shell/ (raw HTML dateModified 2026-11-21T03:52:00Z, self-hosted table now shows Chatwoot Patched) → WebSearch ("Ruby2Shell CVE-2026-132825 GitHub Enterprise Server fix
    Rails proof of concept November 25", no on-point hit) → CERT-FR avis CERTFR-2026-AVI-1591 via cert-fr avis-recent (GitLab, 20 Nov 2026) → primary: GitLab patch release page, URL https://docs.gitlab.com/releases/patches/patch-release-gitlab-19-6-1-released/
    → primary: Chatwoot releases, URL https://github.com/chatwoot/chatwoot/releases'
  summary: 'Three vendor-side changes to the Ruby2Shell (CVE-2026-132825) picture. Veria Labs revised its page at 2026-11-21 03:52 UTC: its self-hosted software table now lists Chatwoot 4.20.0 and earlier
    as fixed in 4.20.1 and Patched (the entry says Chatwoot had no fixed release), alongside GitLab (19.6.1, 19.5.8, 19.4.10), Mastodon (4.7.6, 4.6.12, 4.5.22, 4.4.29), OpenProject (17.9.8, 17.8.3) and
    the Discourse base image (2.0.20261119-0203), all Patched; GitHub Enterprise Server 3.22.5 and earlier is the only product still shown with no fixed release and status Vulnerable. Veria still says it
    will publish a proof of concept for remote code execution on stock Rails on 25 November 2026, or later if major vendors have not shipped a fix by then. GitLab''s own bulletin, titled a Critical Patch
    Release and dated 2026-11-20, fixes CVE-2026-132825 in 19.6.1, 19.5.8 and 19.4.10, says the fix is a patch to Ruby, that official Linux packages and container images already include the patched Ruby,
    that self-compiled installations must rebuild Ruby 3.3.14 or 3.4.13 or later in the same series, and that GitLab.com and Dedicated are already patched. Chatwoot''s releases page (dated 2026-11-20) shows
    v4.20.1 upgrading to Ruby 3.4.13 and states that non-Docker installations now require Ruby 3.4.13. No source reports exploitation; watchTowr (cited by the entry) records none as of 2026-11-19.'
