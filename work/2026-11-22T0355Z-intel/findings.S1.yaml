    source_url: https://www.synology.com/en-global/support/security/Synology_SA_26_20
  extended_notes: 'Exposure: the sources tie CVE-2026-120382 to the OAuth Service package (the mitigation is deactivating it) and CVE-2026-123007 to the DSM HTTP/2 setting; neither states which interface
    must be reachable, and neither gives detection guidance, so none is carried. Synology''s DSM 7.2.x and 7.1 fix lines are ''OnGoing'', so appliances on those branches have an unpatched critical row today
    and only the mitigation. Context for the composer: the store already holds Synology-SA-26:19 (Auth API, 2026-11-11) and the C3RB3R/KEV thread (CVE-2024-10441); this is a third distinct Synology critical
    in two weeks, with a different component (OAuth API).'
