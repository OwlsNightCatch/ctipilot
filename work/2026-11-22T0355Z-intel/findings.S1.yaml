    (date header)'
  summary: 'Four changes since the entry''s last record. Cisco''s interim advisory is now version 1.1 (2026-11-21, ''Update affected products''): the priority table marks UCS Director Affected with the
    release to be determined (the entry recorded it as under investigation), Identity Services Engine only release 3.5 (3.5 Patch 5, December 2026), NX-OS Software fix 10.7.2F (December 2026), and IOS XE
    and IOS XR still under investigation; the affected-products table also names AI PODs for Collaboration (1.0.3, December 2026), Smart PHY (27.1.0, March 2027), License (Smart Software Manager) On-Prem
    (10-202701, February 2027), NextFusion Platform and Unified Contact Center Express (both release to be determined), Intersight Virtual Appliance (1.1.9-0, December 2026), Cloud Hosted Services Intersight
    (1.30.7 and 1.31.f) and Vulnerability Management (1.30.7, November 2026), Webex Assistant for Meetings (1.15.16, November 2026), CX GC AIOps and CX SmartLog (December 2026) and Finesse (15.0 US3, date
    to be determined); Cisco still reports proof-of-concept code known and no malicious use. Fortinet''s FG-IR-26-279 timeline carries ''2026-11-21: Products not impacted list updated'': FortiOS, FortiProxy,
    FortiMail, FortiNAC, FortiPAM and others are confirmed not impacted, while FortiManager, FortiAnalyzer, FortiAuthenticator, FortiADC, FortiWeb, FortiSIEM, FortiSandbox and others (51 product names in
    all) remain under investigation; Fortinet states none of its products use NGINX Plus and lists ten nginx CVEs, one more high-rated row (CVE-2026-118899) than the entry''s five. nginx.org shows ten advisories
    fixed in 1.31.9 and 1.30.7: beyond the five in the entry, CVE-2026-118899 (infinite loop reading a client request body over TLS 1.3, nginx severity ''major'', vulnerable 1.13.0-1.31.8, EPSS 0.038),
    CVE-2026-120967 (SNI bypass with client certificate validation in the stream module, medium, 1.25.5-1.31.8), CVE-2026-125283 (buffer overflow with alias and try_files, minor), CVE-2026-123640 (stream
    ssl_preread validation, minor) and CVE-2026-120993 (NULL dereference with PROXY protocol v2, minor, 1.31.4-1.31.8, fixed in 1.31.9 only); the entry''s CVE-2026-123007 has EPSS 0.299 on 2026-11-21. Distribution
    fixes exist: Ubuntu USN-9159-1 (2026-11-19) ships backported nginx builds for 16.04 ESM to 26.10 (24.04 noble 1.24.0-2ubuntu7.20, 22.04 jammy 1.18.0-6ubuntu14.23, 26.04 1.28.3-2ubuntu1.13; 14.04 not
    affected) and Debian DSA-6642-1 (2026-11-19) fixes trixie in 1.26.3-3+deb13u11 for nine of the ten CVEs (all but CVE-2026-120993), with the tracker also listing DLA-4918-1; both carry the old upstream
    version string, which the entry already warns about. Synology''s matching advisory SA-26:20 is covered in the separate Synology item.'
