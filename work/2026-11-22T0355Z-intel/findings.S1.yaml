    of the covered entries 2026-09-22/cve-2026-13684-synology-dsm-unauth-file-read-write and 2026-11-11/synology-dsm-sa-26-19-preauth-sqli-auth-api-rsync-bypass → publication stamps from Synology advisory
    RSS, feed https://www.synology.com/api/rssfeed/security/en-global (SA-26:20 and SA-26:21 both Thu, 19 Nov 2026 15:47 +0800) → primary: Synology-SA-26:21, URL https://www.synology.com/en-global/support/security/Synology_SA_26_21
    → primary: Synology-SA-26:20, URL https://www.synology.com/en-global/support/security/Synology_SA_26_20 → CVE record check: https://cveawg.mitre.org/api/cve/CVE-2026-120382 returned HTTP 404 and ENISA
    EUVD returned no record → corroborating aggregator: https://securityonline.info/cve-watchtower/cve-2026-120382/'
  summary: 'Synology published two critical DSM advisories on 2026-11-19 and revised both on 2026-11-20 (''Update fix status for DSM 7.3 and DSM 7.4''). SA-26:21 covers CVE-2026-120382, an improper neutralization
    of argument delimiters (CWE-88) in the DSM OAuth API that Synology says allows remote attackers to read or write arbitrary files and conduct denial of service; Synology scores it CVSS 3.1 9.8 (AV:N/AC:L/PR:N/UI:N).
    Affected per the advisory table: DSM 7.4, 7.3, 7.2.2, 7.2.1, 7.1 and BeeStation OS 1.5; APM, SRM and DSM Enterprise are listed not affected. The table names fixed builds DSM 7.4.1-90080-2 and 7.3.2-86009-6
    and marks DSM 7.2.2, 7.2.1, 7.1 and BeeStation OS ''OnGoing'' (for 7.2.x it recommends moving to 7.3.2-86009-6 or above); the description text, however, names 7.1.1-42962-10, 7.2.1-69057-14 and 7.2.2-72806-11
    as builds before which DSM is vulnerable, which does not match ''OnGoing'', so the 7.2.x and 7.1 fix state is unresolved. Synology''s interim measure is to deactivate the OAuth Service package. SA-26:20
    (NGINX2Root) lists CVE-2026-123007 against DSM 7.4, 7.3, 7.2.2, 7.2.1, 7.1, DSM Enterprise 1.0, BeeStation OS 1.5 and APM 2.0 and 1.2 (SRM not affected) with the same two fixed DSM builds and the mitigation
    ''Disable HTTP/2 under Control Panel > Network > Connectivity''; the page headline severity is Critical while the CVE detail is rated Important, CVSS 3.1 8.1. Neither advisory states exploitation. CVE-2026-120382
    is not yet in the CVE List (CVE.org API 404) and not in ENISA EUVD at fetch time, so the identifier and score rest on Synology''s own advisory, which is the CNA record for its product.'
  region_nexus: global; Synology DSM is the NAS platform already tracked in the store for ransomware targeting (entries cve-2026-13684-synology-dsm-unauth-file-read-write and synology-dsm-sa-26-19-preauth-sqli-auth-api-rsync-bypass);
    no Swiss-specific source in this item
