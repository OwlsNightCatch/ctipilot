- title: 'Synology DSM: OAuth API flaw CVE-2026-120382 (unauthenticated arbitrary file read/write, CVSS 3.1 9.8) and the NGINX2Root flaw CVE-2026-123007 fixed in DSM 7.4.1-90080-2 and 7.3.2-86009-6; DSM
    7.2.x, 7.1 and BeeStation OS fixes still ongoing'
