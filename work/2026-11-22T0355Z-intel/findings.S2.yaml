  summary: >-
    The canton's first communiqué on the cyberattack, which the covered entry could not read, says diverse attacks on the cantonal IT structure have been under way 'since Sunday' (the report is of Wednesday 2026-11-18, so Sunday 2026-11-15); the cybersecurity sub-staff of the cantonal command staff is deployed and individual servers were isolated from the internet, so outages in cantonal digital applications were possible. Keystone-SDA via watson.ch reports the Landeskanzlei's Wednesday-evening update: about twenty cantonal applications (for example the since-replaced tax calculator) were affected, they run on six servers that are being reinstalled, and the authorities and organisations for rescue and security (BORS) confirmed their IT systems were never affected. The warning app Alertswiss said in the night to Wednesday that the emergency numbers 112, 117 and 118 in the canton could be restricted because of technical problems and gave the all-clear a few hours later; the government spokesperson said the numbers had been reachable and the notice was a precaution because it was not known whether more servers would have to be isolated from the internet. Netzwoche's 20 November update adds that the canton informed the federal cyber office (BACS), the data-protection supervisory body (ASD), the foreign ministry (EDA) and the embassies of Germany and France. The canton still names no entry point, tool or actor; the 97,000-record permit-G data theft stays as the covered entry states it.
