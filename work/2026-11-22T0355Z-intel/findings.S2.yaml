  - url: https://cert.europa.eu/blog/from-penetration-testing-to-cyber-threat-beware-of-artex
    publisher: CERT-EU (blog)
    date: '2026-11-05'
    role: primary
  discovery_trace: >-
    first seen at: heise-sec, feed https://www.heise.de/security/feed.xml -> https://www.heise.de/news/Cyberangriff-auf-EU-Kommission-Verdacht-auf-KI-Tool-Artex-tagelange-Ausfaelle-11531596.html (also Inside IT feed item https://www.inside-it.ch/eu-kommission-bestaetigt-cyberangriff-20261119) -> WebSearch ("Politico Brussels Playbook European Commission cyberattack CERT-EU Sysper hackers AI tool") -> pivot: The Record https://therecord.media/european-commission-confirms-cyberattack-using-ai (quotes the Commission spokesperson; links Politico's Brussels Playbook, not fetched) -> primary for the ARTEX context: CERT-EU blog https://cert.europa.eu/blog/from-penetration-testing-to-cyber-threat-beware-of-artex (linked from heise). The Commission's midday-briefing video and the Politico newsletter were not read.
  summary: >-
    At the Commission's midday briefing on 2026-11-19 spokesperson Thomas Regnier confirmed an 'AI-generated cyber campaign' whose first signs were detected on 22 October; he did not name the tool or the attackers' motive, said investigators had found no evidence of a data breach affecting staff broadly and knew of no ransom demand, and said the investigation is open (The Record). The Commission took several services offline as a protective measure, notified affected individuals, is preventively checking other systems and is in contact with CERT-EU and the European Data Protection Supervisor (The Record). Claims relayed from Politico, which the Commission has not confirmed: CERT-EU identified the attackers' use of ARTEX, the open-source LLM-driven penetration-testing platform the FBI warned about a week earlier; the personnel platform Sysper (payroll, leave, working time), the medical-reimbursement system MyPMO and internal translation services were disrupted for more than ten days (heise adds that Sysper crashed again on Wednesday); an anonymous EU official feared staff personal data could be compromised, while the spokesperson said, per heise, that no personal information has leaked as of now. Sources disagree on detection: the spokesperson's date is 22 October (heise adds confirmation on 26 October) while Inside IT, citing Politico, says CERT-EU discovered the attack in early November. CERT-EU's own advisory of 2026-11-05 says it has observed AI-driven activity against its constituency that 'highly likely involved the use of ARTEX', assesses that public availability will likely accelerate adoption and maps ARTEX activity to active scanning, tool acquisition and exploitation of public-facing applications. The Record notes this is the Commission's third disclosed incident of 2026 after breaches involving Ivanti software in January and its cloud infrastructure in March, and that officials have not linked them. No actor is named. Assessment owner: the ARTEX link is Politico's sourcing, not an official finding.
  region_nexus: >-
    EU institution (Brussels); government administration compromise with AI-automated tooling; no Swiss entity reported affected
  primary_sector_nexus: >-
    indirect (government administration; transferable lesson for federal, cantonal and communal HR and administrative platforms)
  sector: public-sector
