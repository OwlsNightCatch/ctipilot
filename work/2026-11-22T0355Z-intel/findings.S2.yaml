- title: >-
    CSIRT Italia October 2026 operational summary: events +42%, local administrations the main DDoS victims, impact in about 8% of 249 hacktivist events, 285,000 PHP services on potentially vulnerable versions
  lookback: true
  sources:
  - url: https://www.acn.gov.it/portale/w/operational-summary-ottobre-2026
    publisher: ACN / CSIRT Italia
    date: '2026-11-20'
    role: primary
  discovery_trace: >-
    first seen at: csirt-acn-it, feed https://www.acn.gov.it/portale/feedrss/-/journal/rss/20119/723192 (fetched with feed, 30 items) -> primary (no pivot needed): https://www.acn.gov.it/portale/w/operational-summary-ottobre-2026 (extract; the PDF attached to the page was not read)
  summary: >-
    Italy's national CSIRT (ACN) published its monthly operational summary for October 2026 on 2026-11-20. It records 691 events (+42% on September's 487) and 394 incidents (271 in September); the most frequent threats were DDoS, web-based attacks and mailbox compromise, and the sectors with most victims were technology, local public administration and telecommunications, with local administrations hit mainly by DDoS. A hacktivist campaign against Italy began on 5 October and touched Italian targets on 23 days of the month, up to 13 consecutive days (18 to 30 October), mostly transport companies, local and central administrations, digital service providers and logistics operators; of 249 recorded events ACN established impact in only about 8%, generally slowdowns or temporary unavailability of web services, without generalised compromise or data loss. ACN also reports hacktivist activity in Europe concentrated on Italy and France, with further actions against the Czech Republic and Germany (Switzerland is not named). Exploitation of vulnerabilities was the main initial-access vector, followed by already-compromised valid credentials and e-mail; for ransomware cases ACN lists previously compromised valid credentials, e-mail and compromise of other parties in the supply chain as the initial-access routes. For the PHP2Shell flaws ACN scanned the Italian PHP estate: of over 740,000 PHP services about 285,000 ran potentially vulnerable versions, 82% of those whose version could be identified, and the domain operators were alerted; infostealer-log analysis identified 473 compromised accounts of institutional bodies, which were alerted. The summary is statistics-heavy; its transferable value for Swiss public-sector defenders is the neighbouring authority's measured low impact of hacktivist DDoS against administrations, the exposure-scan approach, and the infostealer-credential notification practice.
  region_nexus: >-
    Italy (neighbouring national authority; Ticino and the Italian border region); local public administration named as a top victim sector; Switzerland not named
  primary_sector_nexus: indirect (local public administration victim sector; transferable)
  sector: public-sector
  cves: []
  techniques:
  - T1498
  - T1190
  - T1078
  - T1566
  - T1195
  technique_note: >-
    T1498 hacktivist DDoS; T1190 exploitation of exposed services (incl. PHP2Shell, CMS plugins); T1078 compromised valid credentials; T1566 e-mail phishing; T1195 supply-chain compromise among ransomware initial-access routes (all as stated by ACN).
  affected_products:
  - PHP
  entity_keys: []
  new_entities: []
  verification: SINGLE-SOURCE-NATIONAL-CERT
  sourcing_note: >-
    ACN/CSIRT Italia is the issuing authority for its own statistics (national-CERT carve-out, single source). The statistics are ACN's measurements and are not independently checkable. Admiralty suggestion A2.
  confidence: MEDIUM
  novelty: new
  borderline: true
  borderline_reason: >-
    Monthly statistics summary with no new technique or Swiss nexus; published 2026-11-20 inside the CSIRT Italia record's 145 h lookback but outside the 26 h window. Kept because it measures hacktivist DDoS impact on local administrations and PHP2Shell exposure in a neighbouring state.
  admiralty_suggestion: A2
  evidence:
  - quote: of 249 recorded events, impacts were established in only about 8% of cases. (translated from Italian)
    attribution: ACN / CSIRT Italia
    source_url: https://www.acn.gov.it/portale/w/operational-summary-ottobre-2026
    original: a fronte di 249 eventi censiti, sono stati accertati impatti soltanto in circa l’8% dei casi
  - quote: >-
      The attacks mainly affected transport companies, local and central administrations, digital service providers and logistics operators. (translated from Italian)
    attribution: ACN / CSIRT Italia
    source_url: https://www.acn.gov.it/portale/w/operational-summary-ottobre-2026
    original: >-
      Gli attacchi hanno interessato prevalentemente società di trasporti, amministrazioni locali e centrali, fornitori di servizi digitali e operatori della logistica.
  - quote: >-
      The consequences were generally limited and mostly confined to slowdowns or temporary unavailability of websites and web services, with no generalised evidence of system compromise or data loss. (translated from Italian)
    attribution: ACN / CSIRT Italia
    source_url: https://www.acn.gov.it/portale/w/operational-summary-ottobre-2026
    original: >-
      Le conseguenze sono risultate generalmente limitate e prevalentemente circoscritte a rallentamenti o temporanee indisponibilità di siti e servizi web, senza evidenze generalizzate di compromissione dei sistemi o perdita di dati.
  - quote: >-
      The operators of the potentially affected domains were consequently alerted so that they could carry out the necessary checks and promptly adopt mitigation measures. (translated from Italian)
    attribution: ACN / CSIRT Italia
    source_url: https://www.acn.gov.it/portale/w/operational-summary-ottobre-2026
    original: >-
      I gestori dei domini potenzialmente interessati sono stati conseguentemente allertati per consentire le necessarie verifiche e la tempestiva adozione delle misure di mitigazione.
  extended_notes: >-
    Detection/hardening framing: ACN's figures say a hacktivist DDoS wave against administrations mostly produces slowdowns, so availability runbooks (upstream scrubbing, static fallbacks) matter more than forensics; the infostealer-log notification shows an inexpensive control, namely matching your own domains and institutional accounts against stealer-log feeds and forcing resets.
- title: >-
    BundID: Der Spiegel quotes the operator's own site notice - e-mail two-factor code activated for all password sign-ins on 16 November (confirms what the covered entry could only attribute to an aggregator)
  sources:
  - url: >-
      https://www.spiegel.de/netzwelt/web/bundid-hacker-attackieren-konten-zweifaktor-authentifizierung-aktiviert-a-305b6f61-70ac-4a83-8b2c-62c4d98d13c4
    publisher: Der Spiegel
    date: '2026-11-16'
    role: primary
  - url: >-
      https://idtechwire.com/germany-adds-email-codes-to-bundid-logins-after-wave-of-automated-attacks-on-citizen-accounts/
    publisher: ID Tech Wire
    date: '2026-11-17'
    role: corroborating
  discovery_trace: >-
    first seen at: WebSearch ("BundID Passwort-Login abgeschaltet Brute-Force gesperrte Konten Bundesregierung Update") -> pivot: ID Tech Wire https://idtechwire.com/germany-adds-email-codes-to-bundid-logins-after-wave-of-automated-attacks-on-citizen-accounts/ -> primary reporting of the operator notice: Der Spiegel https://www.spiegel.de/netzwelt/web/bundid-hacker-attackieren-konten-zweifaktor-authentifizierung-aktiviert-a-305b6f61-70ac-4a83-8b2c-62c4d98d13c4 (cited by ID Tech Wire; the BundID homepage notice itself is not a citable page)
  summary: >-
    Der Spiegel reports that on Monday afternoon 2026-11-16 the BundID website itself said there were 'numerous unauthorised login attempts on BundID accounts' and that, against this background, two-factor authentication had been activated for all BundID accounts: every sign-in with username and password now sends an additional security code by e-mail that must be entered before the sign-in succeeds, while sign-in with the online ID card (eID) and the Elster certificate stays possible. ID Tech Wire (2026-11-17) reports the same notice, including that the operator advises users not to switch the second factor off. This confirms the e-mail-code step that the covered entry attributes only to an aggregator ('no primary source read confirms it'), and it means the containment was two-stage: password sign-in was cut on the morning of 16 November (Handelsblatt, as the covered entry cites) and returned the same afternoon behind a mandatory e-mail code. BSI's statements are unchanged: the attack was repelled and no compromise of accounts is evidenced. No Swiss portal is reported affected.
  region_nexus: Germany (federal citizen account for e-government services); no Swiss portal reported affected
  primary_sector_nexus: >-
    indirect (public-sector citizen portal; credential-stuffing containment lesson transferable to cantonal and communal portals)
  sector: public-sector
  cves: []
  techniques: []
  affected_products:
  - BundID
  entity_keys:
  - incident:bundid-credential-stuffing-account-lockouts-2026-11
  new_entities: []
  verification: MULTI-SOURCE
  sourcing_note: >-
    Der Spiegel reports the operator's site notice first-hand; ID Tech Wire is a second outlet reporting the same notice (cites Der Spiegel among others), so independence is limited. Both are dated 2026-11-16/17, outside the 26 h window and the 72 h developing window; this is a sourcing improvement of a covered entry, not a new development. Admiralty suggestion B2.
  confidence: MEDIUM
  novelty: update-of:2026-11-17/bundid-automated-mass-logins-lock-federal-citizen-accounts
  suggested_record_type: improvement
  borderline: true
  borderline_reason: >-
    Delta sources are dated 2026-11-16/17, outside the 26 h window; included because it upgrades an explicitly unconfirmed statement in a covered entry (the e-mail one-time code) to a confirmed one. Drop if the main agent holds the window strictly.
  delta_vs_existing_entry: >-
    The covered entry says an aggregator reports password sign-in returned the same afternoon behind a mandatory e-mail one-time code and that no primary source read confirms it. Der Spiegel (2026-11-16) now quotes the BundID site notice announcing the activation of two-factor authentication for all accounts, with the e-mail code on every username-and-password sign-in; the entry's 'switched off' headline state is therefore only the morning containment.
  admiralty_suggestion: B2
  evidence:
  - quote: >-
      Against this background, two-factor authentication had been activated for all BundID accounts. (translated from German)
    attribution: Der Spiegel
    source_url: >-
      https://www.spiegel.de/netzwelt/web/bundid-hacker-attackieren-konten-zweifaktor-authentifizierung-aktiviert-a-305b6f61-70ac-4a83-8b2c-62c4d98d13c4
    original: Vor diesem Hintergrund sei für alle BundID-Konten eine Zwei-Faktor-Authentifizierung aktiviert worden.
  - quote: >-
      additionally a security code by e-mail, which you must enter before the sign-in succeeds. (translated from German; the operator's notice as quoted by Der Spiegel)
    attribution: Der Spiegel
    source_url: >-
      https://www.spiegel.de/netzwelt/web/bundid-hacker-attackieren-konten-zweifaktor-authentifizierung-aktiviert-a-305b6f61-70ac-4a83-8b2c-62c4d98d13c4
    original: zusätzlich einen Sicherheitscode per E-Mail, den Sie vor erfolgreicher Anmeldung eingeben müssen
  - quote: >-
      the government has now switched it on for all existing BundID accounts that sign in with a username and password.
    attribution: ID Tech Wire
    source_url: >-
      https://idtechwire.com/germany-adds-email-codes-to-bundid-logins-after-wave-of-automated-attacks-on-citizen-accounts/
  extended_notes: >-
    Defender angle: the lever the operator used after a credential-stuffing wave was to make the password path require a second factor by e-mail code for every existing account rather than keeping it off; lockout-after-failures alone converts the attack into lockouts and reset mail.
