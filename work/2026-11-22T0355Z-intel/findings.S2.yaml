  suggested_record_type: update
  delta_vs_existing_entry: >-
    The covered entry's latest developments run to 2026-11-12 (ransom-demand clarification). New: the 2026-11-19 decision on an independent review of procurement, data handling, controls and oversight, the March 2027 first-report date, and Publica's explicit statement that the exfiltrated personal data came from the supplier's test environment.
  admiralty_suggestion: A2
  evidence:
  - quote: >-
      The Kassenkommission, Publica's highest body, has the handling of personal data, the existing security controls and the exercise of its own oversight reviewed. (translated from German)
    attribution: Publica
    source_url: >-
      https://www.publica.ch/de/ueber-uns/aktuell/cyberangriff-auf-softwarelieferanten-publica-laesst-umgang-mit-personendaten-und-sicherheitskontrollen-extern-untersuchen
    original: >-
      Die Kassenkommission als oberstes Organ von Publica lässt den Umgang mit Personendaten, die bisherigen Sicherheitskontrollen sowie die Wahrnehmung ihrer eigenen Aufsicht überprüfen.
  - quote: A first investigation report is planned by the end of March 2027. (translated from German)
    attribution: Publica
    source_url: >-
      https://www.publica.ch/de/ueber-uns/aktuell/cyberangriff-auf-softwarelieferanten-publica-laesst-umgang-mit-personendaten-und-sicherheitskontrollen-extern-untersuchen
    original: Ein erster Untersuchungsbericht ist bis Ende März 2027 vorgesehen.
  - quote: >-
      We must assume that personal data of insured, former insured and pension-drawing persons of Publica left from the test environment at the software supplier. (translated from German)
    attribution: Publica
    source_url: >-
      https://www.publica.ch/de/ueber-uns/aktuell/cyberangriff-auf-softwarelieferanten-publica-laesst-umgang-mit-personendaten-und-sicherheitskontrollen-extern-untersuchen
    original: >-
      Wir müssen davon ausgehen, dass Personendaten von versicherten, ehemals versicherten und rentenbeziehenden Personen von Publica aus der Testumgebung beim Softwarelieferanten abgeflossen sind.
  - quote: >-
      The criminal investigations and the investigations at the software supplier are not part of this mandate. (translated from German)
    attribution: Publica
    source_url: >-
      https://www.publica.ch/de/ueber-uns/aktuell/cyberangriff-auf-softwarelieferanten-publica-laesst-umgang-mit-personendaten-und-sicherheitskontrollen-extern-untersuchen
    original: >-
      Die strafrechtlichen Ermittlungen sowie Untersuchungen beim Softwarelieferanten sind nicht Teil dieses Auftrags.
  extended_notes: >-
    Defender angle (supplier governance, from the four review areas Publica itself lists): the questions the review will answer are the ones a public body can ask of its own suppliers now, namely what data class is allowed into supplier test environments, which access permissions the supplier holds, how the contractual security requirements are verified, and who in the governing body owns the oversight. Cantonal and communal pension funds and administrations using PK Softech should treat the review as the likely source of generalisable findings in spring 2027.
