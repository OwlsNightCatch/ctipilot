- title: >-
    European Commission confirms an 'AI-generated cyber campaign' that took HR and other internal systems offline for over ten days; Politico reports CERT-EU identified ARTEX, the Commission has not confirmed the tool
  sources:
  - url: https://therecord.media/european-commission-confirms-cyberattack-using-ai
    publisher: The Record (Recorded Future News)
    date: '2026-11-19'
    role: primary
  - url: >-
      https://www.heise.de/news/Cyberangriff-auf-EU-Kommission-Verdacht-auf-KI-Tool-Artex-tagelange-Ausfaelle-11531596.html
