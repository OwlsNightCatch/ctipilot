  extended_notes: >-
    Defender angle from CERT-EU's own recommendations: inventory and cut internet exposure, isolate management and control panels, emergency-patch internet-facing assets, sanitise error responses that fingerprint the stack, keep non-severe findings in the remediation cycle because agentic tooling chains minor misconfigurations, and hunt web and application logs for automated scanning patterns. The impact surface here was administrative back-office platforms (HR, reimbursement, translation), which are the kind of internal portals that cantonal and communal administrations also run.
- title: >-
    ANNUAL REPORT - BSI Lagebericht 2026: Germany's situation rated 'angespannt bis kritisch', time to first exploitation down to 8 days in Q2 2026, exploitation attacks on internet-reachable systems up 48%
  sources:
  - url: https://www.bsi.bund.de/DE/Service-Navi/Presse/Pressemitteilungen/Presse2026/261119_Lagebericht.html
    publisher: BSI (Bundesamt für Sicherheit in der Informationstechnik)
    date: '2026-11-19'
    role: primary
