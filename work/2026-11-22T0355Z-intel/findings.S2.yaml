- title: >-
    Publica commissions an independent review of its own supplier governance after the PK Softech breach; first report due end of March 2027
  sources:
  - url: >-
      https://www.publica.ch/de/ueber-uns/aktuell/cyberangriff-auf-softwarelieferanten-publica-laesst-umgang-mit-personendaten-und-sicherheitskontrollen-extern-untersuchen
    publisher: Publica (Pensionskasse des Bundes)
    date: '2026-11-19'
    role: primary
  - url: https://www.publica.ch/de/cyberangriff-auf-softwarelieferanten
    publisher: Publica (incident page, status 19.11.2026)
    date: '2026-11-19'
    role: primary
  - url: https://www.inside-it.ch/publica-laesst-cybervorfall-extern-pruefen-20261119
    publisher: Inside IT
    date: '2026-11-19'
    role: corroborating
  discovery_trace: >-
    first seen at: inside-it-ch, feed https://www.inside-it.ch/rss.xml -> article https://www.inside-it.ch/publica-laesst-cybervorfall-extern-pruefen-20261119 (fetched with url --direct) -> WebSearch ("Publica Medienmitteilung externe Untersuchung Cybervorfall PK Softech Untersuchungsbericht März 2027") -> pivot: Publica incident page https://www.publica.ch/de/cyberangriff-auf-softwarelieferanten (status 19.11.2026 entry links the release) -> primary: https://www.publica.ch/de/ueber-uns/aktuell/cyberangriff-auf-softwarelieferanten-publica-laesst-umgang-mit-personendaten-und-sicherheitskontrollen-extern-untersuchen
  summary: >-
    On 2026-11-19 Publica, the federal pension fund, said its governing body (Kassenkommission) has decided on an independent external review of how it handled personal data around the PK Softech supplier breach. Publica names four areas: procurement and contracts (supplier selection, agreed data-protection and information-security requirements); handling of personal data (transmission, processing, protection, access permissions); the effectiveness of existing security controls; and leadership and oversight (responsibilities, information paths and decisions between the Kassenkommission, its committees and the management office). The reviewer must report any security risk that needs immediate action at once; the procedure is to be fixed by the end of January 2027 and a first report is planned by the end of March 2027. The criminal investigation and any investigation at the supplier are explicitly outside the mandate (Federal Prosecutor's Office and the FDPIC are responsible). Publica states it must assume that personal data of insured, former insured and pensioned persons left from the test environment at the supplier, that its own productive systems were not affected, and that technical analysis of exactly which data left is still running. The tender for the external review is still open (Publica incident page, status 19.11.2026). Fact vs claim: the scope, timetable and the 'test environment' wording are Publica's own statements; no source names an access vector or the data volume.
  region_nexus: >-
    Switzerland: federal pension fund (Confederation); the same supplier serves cantonal and municipal pension funds
  primary_sector_nexus: direct (federal public sector; supplier-risk governance lesson for cantonal and communal bodies)
  sector: public-sector
  cves: []
  techniques: []
  affected_products: []
