    date: '2026-11-19'
    role: primary
  - url: https://www.bsi-lagebericht.de/node/4
    publisher: BSI (Lagebericht 2026, Bedrohungslage)
    date: '2026-11-19'
    role: primary
  - url: https://www.heise.de/news/BSI-aendert-Lagebewertung-auf-angespannt-bis-kritisch-11530831.html
    publisher: heise online
    date: '2026-11-19'
    role: corroborating
  discovery_trace: >-
    first seen at: heise-sec, feed https://www.heise.de/security/feed.xml -> https://www.heise.de/news/BSI-aendert-Lagebewertung-auf-angespannt-bis-kritisch-11530831.html -> WebSearch ("BSI Lagebewertung \"angespannt bis kritisch\" Cyberlage November 2026") -> primary: BSI press release https://www.bsi.bund.de/DE/Service-Navi/Presse/Pressemitteilungen/Presse2026/261119_Lagebericht.html (linked from heise) -> report pages https://www.bsi-lagebericht.de/node/32 and https://www.bsi-lagebericht.de/node/4 (linked from the press release / report site)
  summary: >-
    Germany's BSI presented its annual report 'Die Lage der IT-Sicherheit in Deutschland 2026' on 2026-11-19 and rates the situation 'angespannt bis kritisch' (tense to critical), a tightening from the previous report; BSI gives the geopolitical situation and rapid AI development as the reason, and introduces a BSI Cyber Index (average 170 points, +50% on the previous period). BSI reports about 160 new vulnerabilities a day (+35%) and a mean time from disclosure to first known exploitation of 53 days in the previous period, 25 days in this period and 8 days in the second quarter of 2026; it adds that attackers often know a flaw before disclosure or patch. In the report's attack score the measure for exploitation attacks on internet-reachable systems rose 48% to 133 points while mass and targeted espionage and cybercrime attacks stayed roughly constant, and attacker reconnaissance rose 57%. BSI again names small and medium enterprises and municipalities (Kommunen) as particularly vulnerable targets. Per heise's account of the press conference, BSI sees perimeter systems that separate internal and external networks as a likely entry point, observed mostly with Chinese actors and often through previously unknown flaws, and says client-side exploits delivered by spear-phishing attachments have become rare. heise also relays BSI figures on Android-based consumer-device botnets (BadBox, Vo1d), on information-security-management compliance at critical infrastructures and a warning on 'store now, decrypt later' quantum risk. The report is a German national assessment with no Swiss-specific content; its value for Swiss federal, cantonal and communal defenders is the neighbouring authority's measured shortening of the patch window for internet-facing systems and the explicit mention of municipalities.
  region_nexus: >-
    Germany (DACH neighbour national authority); municipalities named as a vulnerable target group; no Swiss entity addressed
  primary_sector_nexus: >-
    direct (federal administration and municipalities are covered by the report; transferable to Swiss public sector)
  sector: public-sector
  cves: []
  techniques:
  - T1190
  - T1595
  technique_note: >-
    T1190 from BSI's exploitation-attack measure on internet-reachable systems; T1595 from the stated rise in attacker reconnaissance of internet targets.
