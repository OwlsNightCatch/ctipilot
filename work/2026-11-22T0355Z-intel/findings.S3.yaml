        attribution: "Amazon Threat Intelligence (AWS Security Blog)"
        source_url: "https://aws.amazon.com/blogs/security/chinese-nexus-actors-cairn-ai-agents-found-a-zero-day-on-their-own/"
      - quote: "so in the default configuration any network client that can reach the server can exploit this"
        attribution: "Project MONAI (GitHub Security Advisory)"
        source_url: "https://github.com/Project-MONAI/MONAILabel/security/advisories/GHSA-qc22-rmgc-vg94"
      - quote: "The fix will be included in the next MONAI Label release."
        attribution: "Project MONAI (GitHub Security Advisory)"
        source_url: "https://github.com/Project-MONAI/MONAILabel/security/advisories/GHSA-qc22-rmgc-vg94"
    extended_notes: |
      Exposure: any MONAI Label server reachable from untrusted networks; read the running configuration for MONAI_LABEL_AUTH_ENABLE (False is the default per the advisory). Affected range: the CSA re-report states monailabel 0.8.5 and earlier and that 0.8.5 (PyPI, November 2024) was still the newest installable release on 2026-11-21 with the fix merged to the source tree on 2026-10-19; I could not confirm either on PyPI (Fastly client challenge) and the advisory page read does not list the range, so treat the range and release status as CSA-reported, to be checked against the project.
      Detection (derived from the described mechanics): web or reverse-proxy access logs for PUT requests to the two datastore endpoints whose image query parameter carries parent-directory sequences or a leading dot (the fix rejects such IDs with HTTP 400, so legitimate annotation uploads do not need them); unexpected creation or modification of sitecustomize.py, ~/.ssh/authorized_keys or cron entries by the MONAI Label service account; a Python interpreter spawned by the service after a training-endpoint call that makes an outbound connection. Post-patch/post-hardening check: turning authentication on afterwards does not evict an attacker already in, so inspect those write targets on every instance that was reachable.
      Hardening named by the advisory: enable authentication and withhold ANNOTATOR from untrusted users, keep the server off untrusted networks, run it unprivileged with write access limited to the datastore directory. Amazon's defender guidance: prioritise high-confidence detections that trigger automated response, because agents ran 16 hours without breaks and compress the triage window.
      Triage: Amazon states the agents that failed against hardened targets still ran continuously; high-volume, adaptive probing of exposed Redis, Qdrant, SSH and portals from one source is the campaign's footprint, but the MONAI traversal itself is a single successful request pattern.
      Context for the composer: the store already carries the Gambit Security report on Cairn (registry tool:cairn-exploitation-engine; CSA's note of 2026-10 on Cairn control panels is also a lead). This item is the first-party Amazon observation that adds the zero-day-discovery and espionage-use facts; do not merge with the ARTEX entries (different tool). The stored Zammad/DIVD entry (2026-10-02) is a different case: DIVD says its attacker used AI agents after reaching root, whereas here Amazon says agents found the zero-day. Registry note: tool:cairn-talos is the unrelated Cisco Talos CAIRN toolkit.
  - title: "Unit 42 on Com-affiliated vishing extortion since August 2026: IT-support callers send staff to adversary-in-the-middle SSO pages, enrol their own MFA device within minutes, exfiltrate Microsoft 365 data through scripts and Graph, and extort by Teams message; two new clusters, Vortex and Cinder"
    sources:
      - { url: "https://unit42.paloaltonetworks.com/com-affiliate-vishing-attacks/", publisher: "Palo Alto Networks Unit 42", date: "2026-11-20", role: "primary" }
    discovery_trace: "first seen at: unit42 (standing major-lab check), feed URL https://unit42.paloaltonetworks.com/feed/ (item 'Dialing for Data: Inside the Com’s High-Profile Heists', 2026-11-20 22:00 UTC) -> primary (no pivot needed): https://unit42.paloaltonetworks.com/com-affiliate-vishing-attacks/ (read with extract; its outbound references to Google GTIG UNC6671, ReliaQuest Helix, Microsoft passkey-themed social engineering and Push Security were not separately fetched)"
    summary: |
      Unit 42 reports numerous waves of vishing by Com-affiliated actors since August 2026, drawn from its telemetry and incident-response cases: Bling Libra (ShinyHunters), the clusters CL-CRI-1116 (Redact, formerly BlackFile), CL-CRI-1147 (Pink), CL-CRI-1182 (Falcon), CL-CRI-1192 (Helix) and two it newly describes, CL-CRI-1264 (Vortex, September 2026, mostly healthcare, pharmaceutical and medical organisations) and CL-CRI-1274 (Cinder, September 2026), the latter two overlapping what Google tracks as UNC6671. The common chain: a caller poses as internal IT support and directs the employee to an organisation-specific lookalike SSO, MFA or passkey page on a throwaway apex domain with short-lived per-target subdomains; the page is an adversary-in-the-middle proxy that relays credentials and MFA approvals in real time (in one financial case telemetry showed a full sequence to an MFA number-match prompt). The attackers then enrol their own MFA device within minutes (CL-CRI-1264 reused one device name across accounts), replay a persistent "keep me signed in" token from proxy infrastructure so Duo does not re-prompt (CL-CRI-1274), authenticate through residential proxy networks and commercial VPNs, and use native cloud utilities rather than custom tools: scripted python-httpx or python-requests access and the Microsoft Graph SDK against mailbox, OneDrive and SharePoint content, Rclone, SaaS-to-SaaS transfers, extra OAuth applications, mailbox-rule and calendar changes and clearing of security alert events. Extortion arrives as internal email or Teams messages from a compromised account pointing to a Tor negotiation site, without encryption. In one CL-CRI-1192 case the actor had the victim sideload a malicious extension named Google Chrome from an attacker server with Developer Mode, giving keylogging, cookie and storage theft, QR-code capture and chrome.debugger-based remote control; Unit 42 assesses with moderate confidence it was built as an alternative way to pull credentials from desktops. Targeting moved from financial services to healthcare in September 2026, US organisations dominate, Australian share of observed subdomains rose from under 1 percent to about 13 percent in October, and actors return weeks after a failed attempt. Unit 42 recommends tighter help-desk verification, phishing-resistant MFA (FIDO2/passkeys), browser-extension allow-lists, visibility into identity actions and alerts on unauthorised data exports. Attribution is Unit 42's cluster-level assessment from infrastructure and tradecraft overlap, not an identity claim.
    region_nexus: "US, UK, Australia primarily; transferable to any Microsoft 365 or Okta-centred organisation with a help desk and distributed workforce, including Swiss administrations"
    primary_sector_nexus: "indirect (healthcare, finance and legal are the stated targets; public bodies share the identity and help-desk exposure)"
    sector: "healthcare; financial services; legal (public-sector transferable)"
