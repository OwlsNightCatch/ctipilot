  - title: "Microsoft Threat Intelligence: high-volume phishing on 13 November used Microsoft 365 outage notices as the lure, a day after the 12 November Exchange Online disruption; link-based, likely credential phishing, no actor named"
    sources:
      - { url: "https://www.microsoft.com/en-us/security/blog/2026/11/16/high-volume-phishing-campaign-uses-microsoft-365-outage-lures-target-multiple-industry-sectors-2/", publisher: "Microsoft Threat Intelligence", date: "2026-11-16", role: "primary" }
