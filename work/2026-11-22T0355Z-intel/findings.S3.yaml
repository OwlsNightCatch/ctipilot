    techniques: [T1204.002, T1218, T1218.005, T1127.001, T1105, T1547.001, T1102.001, T1567, T1555.003, T1056.001, T1113, T1090, T1620, T1036.005]
    affected_products: ["Microsoft Windows", "Microsoft Defender Antivirus (MpCmdRun.exe abused)", "Windows Recovery Environment (persistence)"]
    entity_keys: ["tool:overlord-rat", "campaign:unk-deaddrop-2026", "actor:lazarus-group", "product:microsoft-windows"]
