  - title: "Talos tracks UAT-12643, a suspected low-confidence North Korea-aligned cluster using the Overlord RAT with C2 URLs hidden in Solana transaction memos, and publishes the defender view on blockchain dead drops"
    sources:
      - { url: "https://blog.talosintelligence.com/uat-12643-suspected-north-korea-aligned-actor-blends-blockchain-resilience-with-targeted-infostealing/", publisher: "Cisco Talos", date: "2026-11-18", role: "primary" }
