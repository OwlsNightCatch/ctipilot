    novelty: new
    lookback: true
    evidence:
      - quote: "During this period, the group has infected dozens of organizations in Russia, Italy, the Philippines, Hong Kong, Senegal, Finland and China."
        attribution: "Kaspersky (Securelist)"
        source_url: "https://securelist.com/auditteam-opsagent-forced-audit/122031/"
      - quote: "An antivirus/endpoint detection and response (AV/EDR) killer module installs a digitally signed Beijing Jiangmin Antivirus driver to terminate security products."
        attribution: "Kaspersky (Securelist)"
        source_url: "https://securelist.com/auditteam-opsagent-forced-audit/122031/"
      - quote: "Its command-and-control domains use Amazon CloudFront subdomains, which OpsAgent discovers via a public GitHub repository."
        attribution: "Kaspersky (Securelist)"
