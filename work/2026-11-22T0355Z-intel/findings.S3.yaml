    summary: |
      Cisco Talos found malicious infrastructure of a financially motivated cluster it tracks as UAT-12643, whose payloads are the Go-based Overlord RAT, a Python infostealer labelled Good Game (a publicly available stealer, repackaged with PyInstaller; the actor is not its developer) and a multi-cryptocurrency clipboard hijacker; an operational-security failure left the staging server's root folder exposed, which gave Talos the toolset. Lure and payload names suggest targeting of cryptocurrency holders, gaming-account owners, VoIP softphone users and finance and accounting staff, and the stealer's file harvesting matches English, French, Spanish and Portuguese keywords, so Talos considers European victims possible. Talos did not observe delivery; the three initial-access artefacts are a fake-PDF shortcut that downloads the payload with Defender's MpCmdRun.exe -DownloadFile (saved as RuntimeBroker.exe) or with certutil -urlcache, an HTA run by mshta that writes the payload to a temp file through ADODB.Stream, and an MSBuild project file whose inline C# task runs in memory and downloads with a spoofed BITS user agent. The Overlord variant requires admin rights and SeDebugPrivilege, marks itself a critical process through NtSetInformationProcess (ProcessBreakOnTermination) so that killing it bluescreens the host, persists through a per-user Run key and through Windows Recovery Environment OEM scripts registered in ResetConfig.xml (so it survives Reset this PC), exposes 35 commands (keylogging, webcam and audio capture, file operations, script execution, a reverse SOCKS tunnel, in-memory plug-ins), and finds its C2 by walking a wallet's Solana transactions with getSignatures and getTransaction for a memo of exactly 43 characters, the length of an AES-encrypted Base58 WebSocket URL, so the operator moves C2 by posting a new transaction. Stolen data goes to gofile with a Discord webhook notification. Talos assesses with low confidence that UAT-12643 is North Korea-aligned from TTP overlap, notably the UNK_DeadDrop cluster's earlier Overlord use (Proofpoint, June 2026) and the Solana-memo technique first reported for Lazarus in March 2026, while also noting other actors use Overlord and Solana hosting. In its companion piece Talos argues that blockchain dead drops (Bitcoin, EVM contracts via EtherHiding, TRON, Solana memos) defeat domain seizure and sinkholing, and recommends baselining and flagging automated, high-frequency read-only RPC calls (eth_call, getTransaction, getSignaturesForAddress) to node providers such as Infura, QuickNode and Tatum, inspecting JSON-RPC payloads for unexpected base-encoded data and lengths, blocking those providers where the business does not need them, and prioritising endpoint detection of lightweight in-memory decrypters.
    region_nexus: "Europe possible (document-harvest keywords in English, French, Spanish, Portuguese); no Swiss victim or Swiss-language keyword stated; technique class transferable"
    primary_sector_nexus: "indirect (finance and accounting staff and VoIP environments are named lure targets; crimeware cluster, not a government-targeting campaign)"
    sector: "financial services; telecom/VoIP users; cryptocurrency and gaming users"
