    techniques: [T1055, T1685, T1486, T1490, T1489, T1102.001, T1071.001, T1090, T1134.001, T1550.002, T1056.001, T1113]
    affected_products: ["Microsoft Windows", "Amazon CloudFront (abused as C2 front)", "GitHub (abused as C2 address store)", "Beijing Jiangmin Antivirus driver (signed driver abused)"]
