    discovery_trace: "first seen at: csa-labs, URL https://labs.cloudsecurityalliance.org/research/ (listing via extract; research note 'MONAI Label Zero-Day: AI Agents Exploit Medical Imaging Research Servers', 2026-11-21) -> pivot: CSA research note, URL https://labs.cloudsecurityalliance.org/research/csa-research-note-monai-label-agent-discovered-zero-day-2026/ (its References list) -> primary: AWS Security Blog, URL https://aws.amazon.com/blogs/security/chinese-nexus-actors-cairn-ai-agents-found-a-zero-day-on-their-own/ -> primary: Project MONAI advisory, URL https://github.com/Project-MONAI/MONAILabel/security/advisories/GHSA-qc22-rmgc-vg94 -> fix PR, URL https://github.com/Project-MONAI/MONAILabel/pull/1915. A WebSearch (\"Amazon Threat Intelligence MONAI Label zero-day autonomous AI agents Cairn framework exploited\") did not surface the post, and the Register article fetched (URL https://www.theregister.com/security/2026/11/20/china-attackers-deployed-ai-agents-that-autonomously-found-and-exploited-a-0-day-to-take-over-a-university-server/5311382) returned only page chrome, so it is not cited."
    summary: |
      Amazon Threat Intelligence reports that a Chinese-nexus operator ran Cairn, the open-source autonomous AI penetration-testing framework (also documented by Gambit Security in a criminal retail campaign), from a server left publicly reachable without authentication, which exposed the project configurations, prompts and AI output; Amazon found it on 2026-09-10. In an approximately 48-hour run from 2026-09-08 the agents were pointed at IP addresses of East Asian universities outside mainland China with variations of the goal "obtain shell access". Hardened targets held: roughly 16 hours and 148 actions against an unauthenticated Redis instance (replication abuse, scripting-sandbox escape, config-file writes, memory corruption, a Log4Shell attempt, then an SSRF in a co-located Qdrant instance to map the Docker network and credential sprays), and more than 30,000 credential combinations against a GPU server using about 80 usernames the agents compiled from faculty directories, lab sites and archived pages. Against a medical-imaging annotation server the agents identified the framework, mapped the API, found an upload endpoint whose filename parameter allowed path traversal, and in about 11 minutes went from API mapping to arbitrary file write; in a later session they wrote a Python reverse shell to sitecustomize.py and triggered a training endpoint to spawn a new interpreter, which imported it and gave a root shell. In another session the operator stepped in, supplied a proxy tunnelled into a second university network (the same vulnerable software ran there) and directed the agents at other hosts. Amazon assesses with high confidence the flaw was a zero-day (no fix, issue, advisory or prior mention) and with moderate confidence the actor is Chinese-nexus (Simplified Chinese prompts, China Standard Time script timestamps, targeting of universities of likely strategic interest). The project advisory GHSA-qc22-rmgc-vg94 describes the flaw in MONAI Label's PUT /datastore/image and PUT /datastore/label (LocalDatastore.add_image() and save_label() join a caller-controlled image ID into a filesystem path without checking it stays inside the datastore); authentication is off by default so any client that can reach the server can exploit it, and with authentication on the ANNOTATOR role suffices. The advisory lists workarounds only and states the fix (PR #1915) "will be included in the next MONAI Label release"; the advisory page read carries no CVE identifier and says it was re-reported to generate one. AWS notified the maintainers and, because the affected organisations were not AWS customers, worked with a government partner to notify them. The agent-autonomy characterisation (agents, not the operator, chose each step and found the flaw) is Amazon's own assessment from the exposed operator logs and rests on that single first-party source; the project advisory independently confirms the flaw, its mechanics and the pending fix.
    region_nexus: "global; targeted East Asian universities; any internet-reachable MONAI Label server worldwide is exposed (Swiss university hospitals and research groups running medical-imaging AI tooling are in the exposure class)"
    primary_sector_nexus: "indirect (public universities, research institutes and university hospitals that run research-grade AI tooling with default settings)"
    sector: "public-sector (education, research, healthcare)"
