    summary: |
      ANNUAL REPORT — Check Point Research, The State of Ransomware Q3 2026 (quarterly periodic). Check Point counts 2,830 victims published on leak sites in Q3 2026 (July 964, August 1,042, September 824), the highest-volume quarter on record, and reports an increasingly fragmented ecosystem: the top ten groups' share of victims fell from 71 percent in Q1 to 58 percent in Q2 and 49 percent in Q3, so for the first time groups outside the top ten account for the majority; 117 brands claimed at least one victim, up from 91 in Q2, with 51 returning after a Q2 gap and 42 making first-ever claims. Qilin stayed first by a narrow margin over The Gentlemen (which overtook it in September), and LockBit declined each quarter and fell out of the top ten. Check Point lists Stadler Rail, the Berlin state government and Manchester Airports Group among organisations that publicly refused high-value demands, reports that average payments fell 45 percent quarter over quarter to just over one million dollars while the median rose 167 percent to 400,000 dollars, and notes the ShinyHunters-Clop dispute, in which ShinyHunters reportedly breached and defaced Clop's leak site, alongside higher law-enforcement pressure. Only the landing-page key findings were read; the full report is gated, and the counts are leak-site postings (criminal claims, not victim-confirmed incidents), so the figures show brand and posting trends rather than confirmed compromise.
