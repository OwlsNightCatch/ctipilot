  - title: "Amazon: a Chinese-nexus operator's Cairn AI agents found and exploited an unpatched path traversal in MONAI Label on their own, going from API mapping to arbitrary file write in about 11 minutes and on to a root shell"
    sources:
      - { url: "https://aws.amazon.com/blogs/security/chinese-nexus-actors-cairn-ai-agents-found-a-zero-day-on-their-own/", publisher: "Amazon Threat Intelligence (AWS Security Blog)", date: "2026-11-20", role: "primary" }
      - { url: "https://github.com/Project-MONAI/MONAILabel/security/advisories/GHSA-qc22-rmgc-vg94", publisher: "Project MONAI (GitHub Security Advisory)", date: "2026-11-18", role: "primary" }
