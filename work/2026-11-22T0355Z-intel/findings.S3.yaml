        attribution: "Kaspersky (Securelist)"
        source_url: "https://securelist.com/auditteam-opsagent-forced-audit/122031/"
    extended_notes: |
      Why a lookback item: Securelist published 2026-11-18; the kaspersky-securelist record's last successful fetch was 2026-11-14; the store has no AuditTeam entry.
      Exposure: Windows servers and endpoints where signed third-party AV drivers can be loaded by a SYSTEM-level process; mixed backup, database and EDR agents on the same hosts (all in the kill list); estates that allow outbound traffic to arbitrary CloudFront subdomains and to GitHub.
      Detection (telemetry class first): driver-load events for an AV-vendor driver (kvcore.sys, KvCorePortX0 filter port) on hosts that do not run that product, and Service Control Manager or kernel-driver install events for it; sudden termination of Sysmon, SIEM forwarders, EDR and backup services across hosts; process-creation with msiexec.exe or notepad.exe as a host for injected shellcode and named-pipe creation between them; shadow-copy deletion plus database-process kills preceding mass file modification; outbound requests from a server process to a GitHub raw or README page followed by a connection to a CloudFront subdomain; ransom note formatted as an audit log. A signed legitimate driver is the reason application-control and driver block-lists (vulnerable-driver block rules) matter here.
