    extended_notes: |
      Why a lookback item: both Talos posts are dated 2026-11-18; the talos record's last successful fetch was 2026-11-15; the store has no UAT-12643 or Solana-memo entry (registry carries tool:overlord-rat from a Jamf macOS report and campaign:unk-deaddrop-2026).
      Exposure: Windows endpoints where users can run LNK/HTA files and where certutil, mshta, MSBuild and MpCmdRun.exe may reach the internet; any estate that allows direct egress to public blockchain RPC endpoints from non-developer hosts.
      Detection (telemetry class first): process-creation events with parent lineage: a shortcut-launched MpCmdRun.exe with -DownloadFile or certutil -urlcache writing an executable named like a system process (RuntimeBroker.exe) into a user-writable path; mshta spawning a script that writes a binary via ADODB.Stream; msbuild.exe loading a project file from a user path and making a BITS-like network request; persistence artefacts: a randomly named Run-key value pointing into the user's Network folder, new files under %SystemDrive%\Recovery\OEM and a modified ResetConfig.xml; network telemetry: non-developer hosts making repeated Solana (getSignatures/getTransaction) or EVM JSON-RPC calls, and gofile uploads plus Discord webhook posts after a stealer run. Post-removal check: inspect the WinRE OEM folder and ResetConfig.xml on any host that ran the RAT, since a Reset this PC would re-run the payload.
      Triage: certutil and MpCmdRun.exe download switches appear in some admin scripts; the discriminators are a shortcut or HTA as parent, a double-extension document lure, and the downloaded file being renamed to a system-process name. Blockchain RPC calls are normal for crypto, developer and Web3 teams; elsewhere they are anomalous.
