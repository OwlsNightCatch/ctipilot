  - title: "Kaspersky: AuditTeam's OpsAgent implant turns ransomware into a paid 'forced audit', abuses a signed Jiangmin antivirus driver to kill about 220 security and backup processes, and finds C2 through a GitHub repository, with victims including Italy and Finland"
    sources:
      - { url: "https://securelist.com/auditteam-opsagent-forced-audit/122031/", publisher: "Kaspersky (Securelist)", date: "2026-11-18", role: "primary" }
    discovery_trace: "first seen at: kaspersky-securelist (standing major-lab check), feed URL https://securelist.com/feed/ (item 'The forced audit: how AuditTeam’s OpsAgent framework masks ransomware as consulting', 2026-11-18 07:00 UTC) -> primary (no pivot needed): https://securelist.com/auditteam-opsagent-forced-audit/122031/ (read with extract; the dbdigest and DeXpose leak-site reports it cites were not separately fetched)"
    summary: |
      Kaspersky reports that AuditTeam, active at least from January through October 2026, compromises organisations in at least seven countries and territories with the OpsAgent framework, and has infected dozens in Russia, Italy, the Philippines, Hong Kong, Senegal, Finland and China; the leak site claims seven more countries. The group's ransom note demands an Audit and Consulting fee in return for a vulnerability report instead of leaking the stolen archive; Kaspersky notes the note does not mention encryption but is dropped by the cryptor module, so a victim who sees it already has encrypted files. OpsAgent, built to resemble a penetration-testing tool and described as rivalling Cobalt Strike, offers file and process management, shellcode injection through named pipes, token theft and creation, pass-the-hash and Mimikatz launched as remotely delivered shellcode, keylogging, screenshots and SMB or HTTP pivoting; commands run as jobs in separate processes (msiexec.exe by default, notepad.exe for monitoring). Loaders moved from a C injector (April 2026) to a .NET APC-queue loader (June) and an in-process Rust loader (September), and the implant was rewritten from C++ to Rust with an HTTP-then-WebSocket-over-TLS channel. C2 domains are Amazon CloudFront subdomains that the implant can read from a public GitHub repository (the Rust version stores the address with reworked encryption); Kaspersky notes shared CloudFront IP space makes IP blocking impractical, that the repository was removed in November 2026 and that the newest Rust implants carry the GitHub feature disabled, so the campaign is not over. An AV/EDR-killer module installs a digitally signed driver disguised as a Beijing Jiangmin antivirus product that terminates about 220 named processes on command, covering major security products, Sysmon, splunkd and wazuh-agent, remote-access tools, Veeam, Acronis and database services; the cryptor uses AES-CBC or ChaCha20 with X25519 key exchange, kills database processes and backup services, deletes shadow copies and overwrites files before deletion. Kaspersky attributes the campaign to AuditTeam with high confidence from the unique note format and the leak site, and says code patterns suggest LLM-assisted development, which it reads as lowering the barrier for ransomware crews to build APT-grade multi-module tooling. Kaspersky is the sole source and the telemetry owner; the victim countries are its observations plus the group's own leak-site claims.
    region_nexus: "Europe (Italy and Finland among victims), Asia, Africa, Russia; no Swiss victim stated"
    primary_sector_nexus: "indirect (victims span industries; Italy is a Swiss neighbour, and the BYOVD-style EDR kill and shadow-copy destruction apply to every Windows estate)"
    sector: "cross-sector"
