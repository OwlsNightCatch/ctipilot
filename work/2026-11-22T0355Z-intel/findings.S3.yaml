    summary: |
      Microsoft Threat Intelligence observed a coordinated, high-volume phishing campaign on 2026-11-13 that disguised emails as Microsoft 365 service-health notifications, telling recipients that mail had been held during a service disruption (one sample cited an Exchange Online incident on 12 November) and would be deleted within 24 hours unless they acted. Subjects follow a pattern of Outage followed by a random token, display names combine a three-character organisation-style prefix with Outage Notification or Service Health, bodies contain a fake hidden email conversation (an apparent filter-evasion measure), and a prominent restore-messages call to action leads through recipient-specific click-tracking links to a common non-Microsoft destination. The samples were link-based only (no QR codes, attachments or payloads). Microsoft assesses the activity was likely credential phishing but says the evidence does not include the final page, credential-submission telemetry or any post-compromise activity, and it has not attributed the campaign to a named actor or family. It says Defender for Office 365 blocks and quarantines the messages and that no indicators of compromise from the attack were seen in protected environments, and advises searching mail telemetry for the sender-domain, display-name, subject and tracking-host patterns, identifying users who clicked, and for anyone who may have entered credentials resetting the password, revoking sessions and refresh tokens and verifying MFA registrations.
