      - { url: "https://blog.gitguardian.com/react2steal-hijacked-github-accounts-exploit-react2shell-and-publish-stolen-secrets/", publisher: "GitGuardian", date: "2026-11-20", role: "corroborating" }
    discovery_trace: "first seen at: gitguardian, feed URL https://blog.gitguardian.com/rss/ (item 'React2STEAL: Hijacked GitHub Accounts Exploit React2Shell and Publish Stolen Secrets', 2026-11-20 09:03 UTC) -> pivot: GitGuardian post, URL https://blog.gitguardian.com/react2steal-hijacked-github-accounts-exploit-react2shell-and-publish-stolen-secrets/ -> primary: OpenSourceMalware, URL https://opensourcemalware.com/blog/react2steal-github-actions (read with extract)"
    summary: |
      OpenSourceMalware, working from a lead by CTI analyst Karina Reaño, reports React2STEAL, an end-to-end automated framework in which 45 repositories (set up in three waves since 2026-10-22, with in-code dated comments suggesting the pipeline ran at volume from at least 2026-09-10) each carry a GitHub Actions workflow that uses GitHub-hosted runners to scan for Next.js servers and attempt React2Shell (CVE-2025-55182), the Next.js middleware header authorisation bypass (CVE-2025-29927) and an SSRF through the image-optimisation route aimed at cloud metadata credentials. On success a script collects environment variables, .env and config files, cloud and Kubernetes credentials and AI provider keys, and the workflow commits the loot into the same public repository, so the repositories are both attack infrastructure and drop site; OpenSourceMalware counts at least 1,281 victim hostnames across about 1,100 domains and says new results were still being committed about every 11 minutes at publication, with the most common secrets being database URLs, Stripe keys and AI provider keys. The repositories sit on victims' own hijacked GitHub accounts and most carry the probe file used by the separate wfx-loot campaign (stolen-token CI secret stealer running since 2026-11-10), and the same accounts appear in both; who runs React2STEAL and how the tokens were obtained are unknown. GitGuardian's write-up repeats the figures and adds the defender position: patch the long-fixed flaws, then treat every secret the server process could reach as exposed and rotate it, because deleting a repository does not undo the exposure and forks, clones and scrapers may retain copies (OpenSourceMalware advises searching public GitHub by file content rather than repository name); owners of hijacked accounts must revoke the credentials the attacker used.
    region_nexus: "global; any internet-facing Next.js or React Server Components application, including public-sector web front ends"
    primary_sector_nexus: "indirect (exposure depends on whether administrations run unpatched Next.js or React Server Components applications on the internet)"
