      Exposure: Next.js applications on versions affected by CVE-2025-55182 (React2Shell) or CVE-2025-29927, particularly with cloud instance-metadata access and secrets in environment variables or .env files. Detection (derived): web-server logs for the seven React2Shell request variants, the X-Middleware-Subrequest header and image-route SSRF requests to metadata addresses; searching public GitHub commits for your own hostnames and key formats; GitHub audit logs for unfamiliar workflows or pull requests on accounts and for token use from new addresses. Post-patch check: rotate every credential the application process could read, since the stolen files are publicly readable. This item overlaps the covered wfx-phantom entry (2026-11-13) only through the shared hijacked accounts; the exploit campaign itself is distinct.
  - title: "Microsoft lab research: a phished OAuth device-code approval can steer a GitHub Copilot CLI session, plant agent memory, read synced sessions and reach private repositories (proof of concept, not observed in the wild)"
    sources:
      - { url: "https://www.microsoft.com/en-us/security/blog/2026/11/17/the-risks-of-device-code-authentication-for-ai-coding-agents/", publisher: "Microsoft Security Research", date: "2026-11-17", role: "primary" }
    discovery_trace: "first seen at: msft-ti, listing URL https://www.microsoft.com/en-us/security/blog/topic/threat-intelligence/ (raw url fetch; card dated 2026-11-17) -> primary (no pivot needed): https://www.microsoft.com/en-us/security/blog/2026/11/17/the-risks-of-device-code-authentication-for-ai-coding-agents/ (read with extract)"
    summary: |
      Microsoft Security Research extends device-code phishing to AI coding agents in a controlled lab simulation using GitHub Copilot CLI as the example: the attacker starts a device-flow sign-in with a client it controls and persuades the victim, for instance under an IT-request or licence-check pretext, to approve the short code on GitHub's genuine verification page, after which the attacker's client signs in with the scopes the attacker chose. Microsoft analysed four outcomes: steering an active Copilot CLI session remotely (if the user enabled remote control and organisation policy allows it) so the agent runs commands on the user's machine subject to local permissions and approvals; adding misleading entries to the agent's memory; reading Copilot CLI sessions synchronised to the cloud; and accessing the account's private repositories. Microsoft says these are proof-of-concept results of existing features working as designed, not attacks observed in the wild, that the technique applies to any public client that supports the device flow, and that Defender helps by connecting phishing attempts with GitHub authentication activity. Earlier device-code campaigns it cites are Storm-2372, an AI-enabled 2026 campaign and EvilTokens (disrupted in September 2026).
