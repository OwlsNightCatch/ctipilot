    extended_notes: |
      Why a lookback item: Unit 42's post is dated 2026-11-20 22:00 UTC, about four hours before the 26-hour window opens, and the unit42 record's last successful fetch was 2026-11-18, so no earlier fire has read it; nothing in the store covers this post (UNC6671 and Helix entries exist from GTIG and ReliaQuest reporting, registry actor:unc6671 and actor:helix-extortion).
      Exposure: Microsoft 365 or Okta tenants with SSO, a help desk that resets or re-enrols MFA by phone, staff on personal mobile devices, Duo-protected apps, and browser-extension installation not restricted by policy.
      Detection (telemetry class first): Entra/Okta sign-in logs showing a sign-in then an authentication-method or device registration within minutes from a new residential-proxy or VPN address; the same registered-device name appearing across several accounts; python-httpx or python-requests user agents and Microsoft Graph SDK access to mail, OneDrive and SharePoint at bulk-download volume; new OAuth application consents or data-sync tools; mailbox-rule, calendar and alert-clearing changes; Teams messages from a compromised internal account carrying extortion text; proxy or DNS logs for newly registered lookalike SSO/MFA/passkey domains; endpoint telemetry for an unpacked, sideloaded extension named Google Chrome and the Chrome 'started debugging this browser' banner. Post-compromise check: revoke refresh tokens and sessions and review registered MFA devices and OAuth grants, since the persistence is the enrolled device and the replayed session token, not malware.
      Triage: help-desk-initiated MFA re-enrolment and passkey enrolment campaigns are normal admin activity; the discriminators are that the employee was called (not ticket-initiated), the destination is a lookalike apex domain rather than the real IdP, and a second device is enrolled within minutes of the first sign-in from an unfamiliar network.
      Hardening named by Unit 42: help-desk verification, FIDO2/passkeys, browser-extension allow-lists, identity-action visibility, alerts on unauthorised data exports. Reliability: telemetry is Unit 42's own; the ShinyHunters-member arrests it mentions are cited from Reuters and Krebs in the post, not independently fetched here.
  - title: "Huntress reverses MS-SNTP on a patched Server 2025 DC: timeroasting leaves no authentication event, the 120-byte extended authenticator that modern clients send has no public cracker, and the detection that holds is a host asking for a RID other than its own"
    sources:
      - { url: "https://www.huntress.com/blog/detecting-timeroasting", publisher: "Huntress", date: "2026-11-19", role: "primary" }
      - { url: "https://cybersecurity.bureauveritas.com/uploads/whitepapers/Secura-WP-Timeroasting-v3.pdf", publisher: "Secura (Bureau Veritas Cybersecurity) whitepaper, Tom Tervoort", date: "2023", role: "corroborating" }
    discovery_trace: "first seen at: huntress (standing major-lab check), feed URL https://www.huntress.com/blog/rss.xml (item 'Detecting Timeroasting the Hard Way', 2026-11-19 14:00 UTC) -> primary (no pivot needed): https://www.huntress.com/blog/detecting-timeroasting (read with extract) -> background pivot from its Research section: Secura whitepaper, URL https://cybersecurity.bureauveritas.com/uploads/whitepapers/Secura-WP-Timeroasting-v3.pdf (read with the pdf subcommand; confirms the original unauthenticated-RID technique)"
    summary: |
      Huntress researcher Andrew Schwartz reads w32time.dll and netlogon.dll from a live, fully patched Windows Server 2025 domain controller (build 26100.33438) to show how timeroasting, the unauthenticated MS-SNTP abuse that Secura's Tom Tervoort published in 2023, works in its two authenticator forms. A client names an account by RID in an NTP request and the DC returns a password-derived MAC that can be cracked offline. The legacy form is 68 bytes with an MD5 MAC and is the only one hashcat mode 31300, timeroast.py and NetExec handle; the extended form is 120 bytes, uses a SP800-108 counter-mode KDF (label "sntp-ms" including its null, the RID as little-endian context) and HMAC-SHA512, is the form modern Windows clients send by default, and is live on patched DCs (it answered extended requests carrying the old-key flag, five times out of five; the current-key timeout he saw is an open observation he does not explain). He supplies a verified reference implementation, a hash format and a hashcat module that only needs an upstream mode number. The DC signs only for computer, server-trust and interdomain-trust accounts, so plain users get no reply unless an attacker with write access first flips a user to a machine-looking account (a trailing $ and a workstation-trust userAccountControl), the loud targeted variant that Defender for Identity's Suspicious SAM Account Name Change alert covers; the quiet unauthenticated RID sweep has no identity-product coverage. Defender claims, all from the author's own lab validation: timeroasting produces no 4768, 4769, 4624 or 4776 for the targeted account; it is visible as UDP/123 connections accepted by w32time (Windows Filtering Platform audit event 5156 on the DC) and as host EDR network connections; packet size is a baseline question, not a signal (modern members send 120 bytes and the public tools only 68); the signal that holds for both sizes, even for a single packet, is the requested RID versus the source system (a member normally asks for its own computer account; DCs legitimately use trust RIDs and need an allow-list), with many distinct RIDs per source in a short window as the weaker fallback. Mitigations named: limit UDP/123 on DCs to trusted networks, keep automatic machine-account password rotation, fix predictable pre-Windows 2000 computer-account passwords, monitor authenticated NTP for anomalous sources and RIDs, and roll over the AZUREADSSOACC Kerberos key at least every thirty days where Seamless SSO is enabled.
    region_nexus: "global; any on-premises Active Directory estate, which includes Swiss federal, cantonal and communal domains"
    primary_sector_nexus: "direct (Active Directory domain controllers are the standard identity backbone of public administrations)"
    sector: "public-sector"
    cves: []
    techniques: [T1110.002]
    affected_products: ["Microsoft Windows Server (Active Directory domain controllers, Windows Time service MS-SNTP)"]
    entity_keys: ["product:microsoft-windows"]
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    lookback: true
    evidence:
      - quote: "Timeroasting leaves no authentication event for the targeted account."
        attribution: "Huntress"
        source_url: "https://www.huntress.com/blog/detecting-timeroasting"
      - quote: "The signal that actually holds, for both sizes and even for a single packet, is the requested RID relative to the source system."
        attribution: "Huntress"
        source_url: "https://www.huntress.com/blog/detecting-timeroasting"
      - quote: "Do not build on packet size."
        attribution: "Huntress"
        source_url: "https://www.huntress.com/blog/detecting-timeroasting"
      - quote: "the extended form is live on a fully patched DC"
        attribution: "Huntress"
        source_url: "https://www.huntress.com/blog/detecting-timeroasting"
    extended_notes: |
      Why a lookback item: published 2026-11-19 14:00 UTC; Huntress's record was last fetched 2026-11-18, so no earlier fire read it; the store has no timeroasting entry.
      This is a technique and detection note, not a vulnerability: the behaviour is by design in MS-SNTP and Huntress reports no patch. Verification is the author's reverse engineering and live-DC proof (single researcher, own lab), with the underlying 2023 technique independently documented by Secura; the extended-form cracking claims and the old-key/current-key behaviour are the author's alone and he flags the current-key timeout as unexplained. The Secura whitepaper (read via pdf extraction) confirms that the client need not authenticate and can pick any RID.
      Exposure check: which domain members send 120-byte versus 68-byte authenticated NTP requests in your fleet (baseline before alerting), which DCs expose UDP/123 to non-server networks, and which computer/trust accounts have never-rotated or predictable passwords (image-built machines, hand-set trusts, non-Windows joins are the crackable population the author names).
      Detection concept: per-source role-aware check of NTP authenticator RID against the source host's own computer-account RID using DHCP/DNS-to-account mapping, DCs allow-listed for trust RIDs; fallback a many-distinct-RIDs-per-source rate. Telemetry hooks: DC Windows Filtering Platform audit (Event ID 5156) for w32time UDP/123, EDR DeviceNetworkEvents-style records of UDP/123 from non-time-service processes, and Defender for Identity's SAM-account-name-change alert for the targeted variant.
      Triage: normal domain-member time sync also produces authenticated NTP requests to the DC; what separates an attacker is a request for an RID that is not the sender's own account (not packet size, not volume alone) and, on an attacker host, a process other than the Windows time service sending UDP/123 to a DC.
      Defender takeaway: authentication-log analytics are blind to this technique; add network-level or host-network telemetry for UDP/123 to DCs and rotate or randomise any machine-account password that is not auto-rotated.
  - title: "Kaspersky's Operation ShadowCloud: MeshAgent-dropped GitDoor and GraphDoor backdoors hide C2 in GitHub, Microsoft Graph/SharePoint and Ably against government networks in Asia and Africa, with overlaps to FamousSparrow and CopperTurtle staging"
    sources:
