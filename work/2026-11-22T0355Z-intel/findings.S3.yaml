      - { key: "malware:opsagent", type: malware, name: "OpsAgent", aliases: ["OpsAgent-rs"], summary: "Cobalt Strike-class implant framework of the AuditTeam group, rewritten from C++ to Rust in 2026, with a signed-driver AV/EDR killer module and a cryptor module; C2 via CloudFront subdomains discovered through a public GitHub repository (Kaspersky, 2026-11-18)." }
