  - claim_id: ecece81993
    entry: 2026-11-22/monai-label-path-traversal-zero-day-found-by-cairn-ai-agents
    surface: "headline"
    kind: frontmatter
    text: "MONAI Label CVE-2026-133968 exploited since September: upgrade to 0.8.6; authentication is off by default"
  - claim_id: 81a0d53657
    entry: 2026-11-22/monai-label-path-traversal-zero-day-found-by-cairn-ai-agents
    surface: "summary"
    kind: frontmatter
    text: "The MONAI Label 0.8.6 security release of 2026-11-22 fixes CVE-2026-133968, a path traversal in the PUT /datastore/image and PUT /datastore/label endpoints of the medical-imaging annotation server that writes files anywhere the server process can write, reachable without credentials in the default configuration; the CVE record says it was exploited from September 2026. Amazon Threat Intelligence reports that a Chinese-nexus operator's Cairn AI agents found it as a zero-day, went from API mapping to arbitrary file write in about 11 minutes and later to a root shell on a university server."
  - claim_id: 2eb2ddd12b
    entry: 2026-11-22/monai-label-path-traversal-zero-day-found-by-cairn-ai-agents
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade every MONAI Label server to 0.8.6 (pip install -U monailabel==0.8.6, or the projectmonai/monailabel:0.8.6 image), because CVE-2026-133968 is exploited and every version through 0.8.5 is affected."
  - claim_id: 9551cb7ebc
    entry: 2026-11-22/monai-label-path-traversal-zero-day-found-by-cairn-ai-agents
    surface: "actions[1]"
    kind: frontmatter
    text: "On every MONAI Label 0.8.5 or older server that was reachable from an untrusted network, review it for unexpected file changes before it returns to service, starting with sitecustomize.py, authorized_keys and cron entries that the service account wrote and nobody deployed, because the upgrade does not evict an attacker who is already in."
  - claim_id: b94108bc2c
    entry: 2026-11-22/monai-label-path-traversal-zero-day-found-by-cairn-ai-agents
    surface: "cves[CVE-2026-133968]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-133968\", \"cvss\": \"9.8\", \"status\": [\"exploited\", \"patch-available\"], \"affected\": \"MONAI Label through 0.8.5; authentication is off by default, and with authentication on the ANNOTATOR role is enough\", \"fixed\": \"0.8.6\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
  - claim_id: 4249b02faf
    entry: 2026-11-22/monai-label-path-traversal-zero-day-found-by-cairn-ai-agents
    surface: "body"
    kind: cited
    text: "MONAI Label 0.8.6, released on 2026-11-22 as a security release, fixes CVE-2026-133968, rated critical: `PUT /datastore/image` and `PUT /datastore/label` built the destination path from the image ID and label tag without confining it to the datastore, so a caller could write files anywhere the server process can write, in all versions up to and including 0.8.5 ("
    urls: ["https://github.com/Project-MONAI/MONAILabel/releases/tag/0.8.6"]
  - claim_id: e3d9d0f7dc
    entry: 2026-11-22/monai-label-path-traversal-zero-day-found-by-cairn-ai-agents
    surface: "body"
    kind: cited
    text: "The project's advisory adds that arbitrary file write can lead to remote code execution, for example through application code, `authorized_keys` or cron, that authentication is off by default and that with authentication on the ANNOTATOR role is enough ("
    urls: ["https://github.com/Project-MONAI/MONAILabel/security/advisories/GHSA-qc22-rmgc-vg94"]
  - claim_id: bb88462dfd
    entry: 2026-11-22/monai-label-path-traversal-zero-day-found-by-cairn-ai-agents
    surface: "body"
    kind: cited
    text: "The same release fixes a second path traversal in session upload: `PUT /session/?uncompress=true` extracted uploaded tar archives without checking member names, and session IDs were used as paths without validation, in all versions up to and including 0.8.5 ("
    urls: ["https://github.com/Project-MONAI/MONAILabel/releases/tag/0.8.6"]
  - claim_id: af95d396a6
    entry: 2026-11-22/monai-label-path-traversal-zero-day-found-by-cairn-ai-agents
    surface: "body"
    kind: cited
    text: "The operator later gave the agents a proxy into a second university network that ran the same software, which Amazon infers it had reached through the same flaw, and Amazon assesses with moderate confidence that the actor is Chinese-nexus; the same agents ran 16 hours against a hardened Redis instance and tried more than 30,000 credential combinations against a GPU server without success ("
    urls: ["https://aws.amazon.com/blogs/security/chinese-nexus-actors-cairn-ai-agents-found-a-zero-day-on-their-own/"]
  - claim_id: 71eedbdcda
    entry: 2026-11-22/monai-label-path-traversal-zero-day-found-by-cairn-ai-agents
    surface: "body"
    kind: cited
    text: "**Exposure:** any MONAI Label server through 0.8.5 that untrusted clients can reach; authentication is off by default (`MONAI_LABEL_AUTH_ENABLE=False`), so any client that can connect can write files, and with authentication on the ANNOTATOR role is enough ("
    urls: ["https://github.com/Project-MONAI/MONAILabel/releases/tag/0.8.6", "https://github.com/Project-MONAI/MONAILabel/security/advisories/GHSA-qc22-rmgc-vg94"]
  - claim_id: c1ec8a4892
    entry: 2026-11-22/monai-label-path-traversal-zero-day-found-by-cairn-ai-agents
    surface: "body"
    kind: cited
    text: "**Detection:** web or reverse-proxy access logs for PUT requests to the two datastore endpoints whose `image` parameter carries parent-directory sequences or a leading dot, which the fix neutralises or rejects, and for tar uploads to `PUT /session/` with `uncompress=true`; unexpected creation or change of `sitecustomize.py`, `authorized_keys` or cron entries by the service account; and a Python interpreter started by the service after a training-endpoint call that then opens an outbound connection ("
    urls: ["https://github.com/Project-MONAI/MONAILabel/security/advisories/GHSA-qc22-rmgc-vg94", "https://aws.amazon.com/blogs/security/chinese-nexus-actors-cairn-ai-agents-found-a-zero-day-on-their-own/"]
  - claim_id: 740d1d61f3
    entry: 2026-11-22/monai-label-path-traversal-zero-day-found-by-cairn-ai-agents
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** upgrade to 0.8.6, which the project calls a security release for every deployment, and whatever the version keep the server off untrusted networks, turn authentication on with roles only for trusted users and run it as an unprivileged account that can write only to the datastore; on a 0.8.5 or older server that was reachable from an untrusted network, the project asks for a review for unexpected file changes before it returns to service ("
    urls: ["https://github.com/Project-MONAI/MONAILabel/releases/tag/0.8.6"]
  - claim_id: e5a037a4dc
    entry: 2026-11-22/monai-label-path-traversal-zero-day-found-by-cairn-ai-agents
    surface: "body"
    kind: cited
    text: "Amazon's own advice is to favour high-confidence detections that trigger automated response, because the agents ran for hours without a break ("
    urls: ["https://aws.amazon.com/blogs/security/chinese-nexus-actors-cairn-ai-agents-found-a-zero-day-on-their-own/"]
