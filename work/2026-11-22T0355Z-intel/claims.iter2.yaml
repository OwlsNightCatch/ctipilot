claims:
  - claim_id: 87a6dea7c2
    entry: 2026-10-15/cve-2026-76519-cisco-secure-email-gateway-file-write-root
    surface: "summary"
    kind: frontmatter
    text: "Cisco's advisory of 2026-10-14 fixes CVE-2026-76519, a relative path traversal in the Advanced Malware Protection (file reputation) path of Cisco Secure Email Gateway that lets an unauthenticated attacker who sends one crafted attachment through the device write files and run commands as root (CVSS 9.8); Cisco says its PSIRT became aware of exploitation in October 2026, and CISA listed the flaw in KEV the same day. Only gateways with File Reputation enabled on a mail policy and Content Scanner Tools earlier than 25.3.0.5525 are exposed; there is no workaround, and the fix ships as a Content Scanner Tools update that needs no restart or upgrade, and in AsyncOS 15.5.5-014 and 16.5.0-780; a public Metasploit exploit module has existed since 2026-11-05."
  - claim_id: 9ea14e0559
    entry: 2026-10-15/cve-2026-76519-cisco-secure-email-gateway-file-write-root
    surface: "cves[CVE-2026-76519]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-76519\", \"cvss\": \"9.8\", \"status\": [\"exploited\", \"cisa-kev\", \"poc-public\", \"patch-available\"], \"affected\": \"Cisco Secure Email Gateway (physical and virtual) with the File Reputation service enabled and assigned to a mail policy and Content Scanner Tools earlier than 25.3.0.5525\", \"fixed\": \"Content Scanner Tools 25.3.0.5525 or later (no software upgrade or restart); AsyncOS 15.5.5-014 (15.5), 16.5.0-780 (16.5); 16.0 must migrate to a fixed release; no workaround\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
  - claim_id: 7e9a2292ad
    entry: 2026-10-15/cve-2026-76519-cisco-secure-email-gateway-file-write-root
    surface: "body"
    kind: cited
    text: "Cisco's advisory of 2026-10-14 describes CVE-2026-76519, a relative path traversal ("
    urls: ["https://www.cisa.gov/news-events/alerts/2026/10/14/cisa-adds-four-known-exploited-vulnerabilities-catalog"]
  - claim_id: d9217de20e
    entry: 2026-10-15/cve-2026-76519-cisco-secure-email-gateway-file-write-root
    surface: "body"
    kind: cited
    text: ") in the Advanced Malware Protection feature of Cisco Secure Email Gateway: improper handling of email attachments when the file reputation service is enabled lets an unauthenticated remote attacker who sends a crafted attachment through the device write arbitrary files on the underlying operating system and run commands as root, and Cisco rates it CVSS 3.1 9.8 ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-esa-afw-zqYJkjxp"]
  - claim_id: 9b1631149d
    entry: 2026-10-15/cve-2026-76519-cisco-secure-email-gateway-file-write-root
    surface: "body"
    kind: cited
    text: "Cisco states that in October 2026 its PSIRT became aware of active exploitation, and that it has directly contacted Cisco Secure Email Cloud customers on whose devices indicators of possible compromise were identified ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-esa-afw-zqYJkjxp"]
  - claim_id: 1ceb1ca755
    entry: 2026-10-15/cve-2026-76519-cisco-secure-email-gateway-file-write-root
    surface: "body"
    kind: cited
    text: "); CISA added the flaw to its Known Exploited Vulnerabilities catalog the same day ("
    urls: ["https://www.cisa.gov/news-events/alerts/2026/10/14/cisa-adds-four-known-exploited-vulnerabilities-catalog"]
  - claim_id: 98422b64de
    entry: 2026-10-15/cve-2026-76519-cisco-secure-email-gateway-file-write-root
    surface: "body"
    kind: cited
    text: "Cisco gives no workaround; the fix is distributed through the Content Scanner Tools package for every supported AsyncOS release and needs no software upgrade or restart, and it is also in AsyncOS 15.5.5-014 and 16.5.0-780, while release 16.0 must migrate to a fixed release ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-esa-afw-zqYJkjxp"]
  - claim_id: 3016b41c2b
    entry: 2026-10-15/cve-2026-76519-cisco-secure-email-gateway-file-write-root
    surface: "body"
    kind: cited
    text: "It is the second exploited root-level flaw in this product in about four weeks: BleepingComputer notes that last month Cisco warned of CVE-2026-76461, which also lets unauthenticated remote attackers run commands as root ("
    urls: ["https://www.bleepingcomputer.com/news/security/cisco-patches-actively-exploited-secure-email-gateway-zero-day/"]
  - claim_id: 98c0331980
    entry: 2026-10-15/cve-2026-76519-cisco-secure-email-gateway-file-write-root
    surface: "body"
    kind: cited
    text: "**Exposure:** a physical or virtual Cisco Secure Email Gateway is exposed when both conditions hold: the File Reputation service is enabled and assigned to a mail policy (web interface, Mail Policies, Incoming or Outgoing Mail Policies, Advanced Malware Protection, \"Enable File Reputation\" ticked), and the Content Scanner Tools version, shown by the `contentscannerstatus` command, is earlier than 25.3.0.5525; Secure Email and Web Manager and Secure Web Appliance are not affected, and Cisco Secure Email Cloud Gateway customers need take no action ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-esa-afw-zqYJkjxp"]
  - claim_id: 8d0869afca
    entry: 2026-10-15/cve-2026-76519-cisco-secure-email-gateway-file-write-root
    surface: "body"
    kind: cited
    text: "The attack arrives as an email attachment passing through the appliance, so exposure does not depend on its management interface being reachable ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-esa-afw-zqYJkjxp"]
  - claim_id: 1ad6ef3557
    entry: 2026-10-15/cve-2026-76519-cisco-secure-email-gateway-file-write-root
    surface: "body"
    kind: cited
    text: "**Detection:** start with the appliance's own logs: Cisco's self-check is `grep \"System Security\" system_logs` on each cluster member, which returns \"Suspected compromise indicator was found\", \"Security scan did not complete\" or \"No compromise indicator was found\" ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-esa-afw-zqYJkjxp"]
  - claim_id: 75bd66bd5a
    entry: 2026-10-15/cve-2026-76519-cisco-secure-email-gateway-file-write-root
    surface: "body"
    kind: cited
    text: "Cisco warns that an attacker with root may remove or hide evidence, so it also recommends cross-checking network and firewall logs outside the device for unexpected uploads from the appliance to external addresses or downloads from malicious addresses ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-esa-afw-zqYJkjxp"]
  - claim_id: 055843c769
    entry: 2026-10-15/cve-2026-76519-cisco-secure-email-gateway-file-write-root
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** confirm Content Scanner Tools 25.3.0.5525 or later on every gateway today, since automatic updates deliver it and only gateways with updates disabled need the manual update, and run the log check on every one; for a virtual appliance with a compromise indicator, Cisco says to keep forensic data before upgrading, because upgrading a compromised instance destroys it, then deploy a new virtual machine on a fixed release, rebuild the configuration without importing an old file and renew credentials and cryptographic material (a physical appliance goes to Cisco TAC), and strongly recommends restoring every member of a cluster that contains a compromised appliance, since the cluster's SSH private keys could be accessed ("
    urls: ["https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-esa-afw-zqYJkjxp"]
  - claim_id: d6e763fa94
    entry: 2026-10-15/cve-2026-76519-cisco-secure-email-gateway-file-write-root
    surface: "section 2026-11-22T04:34:04Z"
    kind: cited
    text: "Rapid7's Metasploit wrap-up of 2026-11-20 lists a public exploit module for CVE-2026-76519: processing a TAR file that contains a PAX archive forces an existing file to be overwritten, and the module overwrites /data/bin/core_watch.sh, a script that a cron job runs every five minutes, which gives code execution as root ("
    urls: ["https://www.rapid7.com/blog/post/pt-metasploit-wrap-up-breaking-zimbra-s-identity-boundaries/"]
  - claim_id: fe7a8b89fb
    entry: 2026-10-15/cve-2026-76519-cisco-secure-email-gateway-file-write-root
    surface: "section 2026-11-22T04:34:04Z"
    kind: cited
    text: "The module's pull request, merged on 2026-11-05, builds the PAX archive and sends it by email to a recipient the gateway accepts ("
    urls: ["https://github.com/rapid7/metasploit-framework/pull/22028"]
  - claim_id: 2a070a60c2
    entry: 2026-10-15/cve-2026-76519-cisco-secure-email-gateway-file-write-root
    surface: "section 2026-11-22T04:34:04Z"
    kind: uncited
    text: "A gateway with File Reputation enabled on a mail policy and still below Content Scanner Tools 25.3.0.5525 is therefore open to anyone who runs the module; comparing that script with a known-good copy is a suggested check that neither Cisco nor Rapid7 gives."
  - claim_id: 86fa6d4386
    entry: 2026-10-15/cve-2026-76519-cisco-secure-email-gateway-file-write-root
    surface: "record 2026-11-22T04:34:04Z"
    kind: record-summary
    text: "A public Metasploit exploit module for CVE-2026-76519, merged on 2026-11-05 and listed in Rapid7's wrap-up of 2026-11-20, turns the flaw into a one-email path to root for anyone who runs it against a gateway with File Reputation enabled and Content Scanner Tools below 25.3.0.5525."
  - claim_id: 9a65b96585
    entry: 2026-11-18/cve-2026-114938-java4shell-openjdk-avx512-base64-decoder-rce
    surface: "actions[0]"
    kind: frontmatter
    text: "On every x86-64 host with an AVX-512 VBMI processor that runs Java 17, 21, 25 or 27, update the JDK to 17.0.21.1, 21.0.13.1, 25.0.5.1 or 27.0.1.1 (Oracle builds; Ubuntu and Debian packages carry the same fixes under their own build numbers, other distributions use theirs) or 8u513-perf, then restart the Java processes and rebuild containers, internet-reachable applications and the identity, build and artifact servers Calif names (Keycloak, Jira, Confluence, Artifactory, Jenkins, PingFederate) first; where that waits, start the JVM with -XX:-UseBASE64Intrinsics, or with -XX:UseAVX=2 on x86-64 hosts only."
  - claim_id: a33731800f
    entry: 2026-11-18/cve-2026-114938-java4shell-openjdk-avx512-base64-decoder-rce
    surface: "body"
    kind: cited
    text: "Oracle's Critical Security Patch Update and the OpenJDK advisory of 2026-11-17 list CVE-2026-114938 in the hotspot compiler component, which Oracle rates CVSS 3.1 8.1 with high attack complexity ("
    urls: ["https://www.oracle.com/security-alerts/cspunov2026.html", "https://openjdk.org/groups/vulnerability/advisories/2026-11-17"]
  - claim_id: d5a4d69806
    entry: 2026-11-18/cve-2026-114938-java4shell-openjdk-avx512-base64-decoder-rce
    surface: "body"
    kind: cited
    text: "Calif, which found it, says HotSpot's x86-64 Base64 intrinsic, which uses AVX-512 VBMI instructions, calculates a negative output length for a short padded input and that length becomes a full 64-byte write that sends 62 bytes past the end of the array; only the landing position of the write is controllable, a misplaced write can crash the JVM ("
    urls: ["https://calif.io/java4shell"]
  - claim_id: cd7aec42fd
    entry: 2026-11-18/cve-2026-114938-java4shell-openjdk-avx512-base64-decoder-rce
    surface: "body"
    kind: cited
    text: "It scores the flaw CVSS 4.0 9.2 and reports pre-authentication code execution in the default configurations of Keycloak, Jira, Confluence, Artifactory, Jenkins and PingFederate, authenticated execution in several further server products, and a client-side path in which a Java program that opens a TLS connection to a malicious server is compromised ("
    urls: ["https://calif.io/java4shell"]
  - claim_id: bbdf35acf4
    entry: 2026-11-18/cve-2026-114938-java4shell-openjdk-avx512-base64-decoder-rce
