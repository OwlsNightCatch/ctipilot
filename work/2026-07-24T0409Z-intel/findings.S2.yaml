  - title: "Joint 20-nation advisory: Russian state actor 'LAUNDRY BEAR' (Void Blizzard/TA488/CL-STA-1114) used a zero-click Zimbra webmail exploit (CVE-2025-66376) to steal government email at scale, AI-assisted tooling"
    sources:
      - { url: "https://www.ncsc.gov.uk/news/uk-and-partners-expose-russian-state-supported-actors-for-new-zero-click-phishing-campaign", publisher: "NCSC-UK (GCHQ)", date: "2026-07-23", role: "primary" }
      - { url: "https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-204a", publisher: "CISA / NSA / FBI joint advisory AA26-204A", date: "2026-07-22", role: "primary" }
      - { url: "https://thehackernews.com/2026/07/russian-espionage-group-exploited.html", publisher: "The Hacker News", date: "2026-07-23", role: "corroborating" }
    discovery_trace: "first seen at: ncsc-uk (essential slice source), URL https://www.ncsc.gov.uk/api/1/services/v1/all-rss-feed.xml (fetched via bridge, item dated 2026-07-23) → primary: NCSC-UK advisory page, URL https://www.ncsc.gov.uk/news/uk-and-partners-expose-russian-state-supported-actors-for-new-zero-click-phishing-campaign → pivot: CISA/NSA/FBI 20-agency joint Cybersecurity Advisory AA26-204A (full technical write-up), URL https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-204a (fetched via `python3 tools/fetch_source.py cisa page <url>`, never WebFetched directly) → corroborating: The Hacker News technical recap citing Unit 42 / Proofpoint, URL https://thehackernews.com/2026/07/russian-espionage-group-exploited.html"
    summary: |
      A 20-agency joint Cybersecurity Advisory (AA26-204A, US NSA/FBI/CISA/DoD/Treasury lead, co-sealed by NL AIVD/MIVD, UK NCSC/GCHQ, ANSSI/DGSI France, AISE/AISI Italy, and 12 further national agencies; NCSC-UK's own release 2026-07-23) exposes a Russian state-supported actor tracked as LAUNDRY BEAR (aka Void Blizzard, CL-STA-1114, TA488/formerly UNK_PitStop) using a genuinely zero-click exploit against Zimbra Collaboration Suite (ZCS) Classic Web Client webmail since at least July 2025. The vulnerability, CVE-2025-66376 (CWE-79 stored XSS, CVSS ~6.1-7.2 depending on scorer), lets a crafted HTML email's CSS @import directives smuggle a Base64-encoded, XOR-encrypted JavaScript payload inside an SVG <onload> attribute; merely viewing the email in a vulnerable ZCS Classic UI session (no click, no attachment) executes the script inside the victim's authenticated webmail session. It was a true zero-day when first exploited in July 2025 — Synacor (Zimbra's vendor) did not patch it until ZCS 10.0.18 / 10.1.13 in November 2025, and the CVE was only published 5 January 2026.
      The payload ("Ulej", Russian for "beehive") runs a 12-stage asynchronous collection routine that pulls a CSRF token from localStorage and issues Zimbra SOAP calls to harvest: the last 90 days of the victim's email (via repeated GET .../home/~/?fmt=tgz&meta=0&query=date:-{N}d), the organization's full Global Address List (brute-forced two-character SearchGalRequest batches), any browser-autocompleted password (via two invisible injected login form fields), OAuth consumer info, device-sync status, and — critically for persistence — it issues CreateAppSpecificPasswordRequest to mint a new IMAP application passcode (bypassing ZCS's lack of 2FA support for IMAP) and GetScratchCodesRequest to steal 2FA backup codes, then flips zimbraPrefImapEnabled to true. Both the SOAP-call sequence and the resulting app-specific password survive a subsequent password reset — patching stops the next email from firing but does not revoke access already established.
      Exfiltration runs over both DNS (Base32-encoded A-record queries to actor infrastructure, RFC-1035-compliant chunking) and HTTPS (to a self-hosted, Dockerized "Flowerbed" framework — Catcher/Certbot/Nginx/Gardener containers, Let's Encrypt certs via Cloudflare DNS challenge, Mullvad-VPN-fronted VPS infrastructure rotated every 7-60 days). CISA states the simplistic Flowerbed codebase shows indications AI played a role in its development — an operational-tradecraft data point, not spectacle. LAUNDRY BEAR's targeting spans the Defense Industrial Base, federal/local government, education, energy, law enforcement, media, NGOs and technology sectors; the advisory explicitly notes the technique was extensively trialled against Ukrainian victims before deployment against NATO-member organizations, continuing the pattern of Ukraine as testbed for Russian cyber capability before Western use. No CH-specific targeting is named in the advisory, but Zimbra Classic Web Client is common self-hosted webmail across Swiss and EU public-sector and SME estates (this store has separately tracked two other unrelated July 2026 ZCS Classic Web Client issues), making exposure assessment directly relevant regardless of the co-signer list.
      Detection: audit /opt/zimbra/log/audit.log for CreateAppSpecificPasswordRequest and GetScratchCodesRequest SOAP calls outside expected admin workflows; alert on ModifyPrefsRequest toggling zimbraPrefImapEnabled; watch DNS telemetry for long, high-entropy A-record subdomain lookups (the exfil scheme prefixes victim-identifier chunks with "d-"); inspect inbound mail for @import-chained CSS directives preceding an SVG element with a Base64 onload payload (a documented YARA-able pattern per Proofpoint's TA488 write-up); and treat any newly created ZCS application password as a persistence indicator requiring revocation, not just a post-patch password reset.
    region_nexus: "NATO/EU member-state government and DIB organizations (advisory co-signed by France/ANSSI/DGSI, Italy/AISE/AISI, Netherlands/AIVD/MIVD, Poland, Spain, Sweden, Czech Republic, Denmark, Estonia, Finland, Moldova, plus Five Eyes); extensively trialled against Ukraine first. Switzerland not named as a co-signer or confirmed victim, but ZCS Classic Web Client is common self-hosted webmail across Swiss/EU public-sector and SME estates already tracked in this store."
