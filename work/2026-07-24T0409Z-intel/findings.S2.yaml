    extended_notes: |
      This store already tracks two unrelated July 2026 Zimbra Classic Web Client issues (a no-CVE crafted-email code-exec flagged by NCSC-CH on 2026-07-10, fixed in ZCS 10.1.19; and an SNMP command-injection RCE plus stored-XSS bugs in ZCS 10.1.20 flagged by NCSC-CH/BSI on 2026-07-21/22). CVE-2025-66376 is a THIRD, distinct Classic-UI stored-XSS flaw (patched Nov 2025, well before either of those) — the delta here is the joint 20-nation attribution advisory, not the vulnerability's disclosure date. Any Swiss/EU public-sector or SME operator running Zimbra Classic Web Client should treat this as a reason to (a) confirm ZCS is on 10.0.18+/10.1.13+ specifically for this CVE (separate from the other two patch cycles), and (b) audit for and revoke any unexpected application-specific passwords or newly-enabled IMAP access on webmail accounts, since patching alone does not undo prior compromise.
      Full IOC sets (STIX) are published by CISA but are out of scope for this entry per the no-IOC policy; defenders should pull the advisory's STIX bundle directly if hunting.

  - title: "Saxony-Anhalt state administration: reported IT-security incidents more than doubled H1 2026 vs H1 2025, ministry cites attackers deliberately timing intrusions to summer/holiday staffing gaps"
    sources:
      - { url: "https://www.heise.de/news/Cyberattacken-auf-Landesverwaltung-nehmen-weiter-zu-11374292.html", publisher: "heise online", date: "2026-07-23", role: "primary" }
    discovery_trace: "first seen at: heise-sec (essential-adjacent DE regional press, part of standard rotation slice), URL https://www.heise.de/security/rss/news-atom.xml → primary (no further pivot found; article itself relays the Saxony-Anhalt Ministry for Infrastructure and Digital Affairs' own reporting, no separate ministry press release located)"
    summary: |
      Saxony-Anhalt's Ministry for Infrastructure and Digital Affairs reported 30 IT-security incidents against the state administration in H1 2026, versus 14 in H1 2025 (more than double). Of the 30: 16 phishing attacks, 2 DDoS attacks, 2 system intrusions, and 9 cases of stolen/lost IT hardware. The ministry states impact to date has been limited to short-lived outages of a few hours (affected largely individual stolen devices and temporary unreachability of web presences after DDoS). The ministry's stated pattern of note: attackers deliberately exploit vacation periods when staff levels are reduced, on the theory that thinner administrative coverage widens the response window. No named threat actor or CVE is attached to this specific reporting period (the pipeline separately tracks NoName057(16) DDoS activity against German state portals from prior summers, but this report does not attribute the current wave to that or any other named cluster). This is a low-technical-depth, statistics-and-trend item rather than a TTP disclosure — flagged borderline given the audience's technical-depth bar.
