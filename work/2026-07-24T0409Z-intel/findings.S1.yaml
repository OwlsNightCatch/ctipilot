self_evolution_notes: |
  Systemic issue observed this run: multiple RSS/Atom feed fetches via `python3 tools/fetch_source.py feed <url> N` fell through to the jina-reader fallback (because 3 of 4 configured jina API keys report balance-exhausted/HTTP 402, "rotating to the next credential" printed on every call) and then returned {"count": 0, "items": []} even though a live key (4th, ~9.05M balance per `jina-usage`) was apparently reached. This happened for chromereleases.googleblog.com, keycloak.org/security/rss.xml, sansec.io/research/feed, and msrc.microsoft.com/blog/rss — i.e. every feed URL that required the jina fallback this run. A direct (`--direct`) GET of chromereleases.googleblog.com confirmed the page itself renders fine as HTML with content, so this looks like the bridge's feed-parsing path not understanding the markdown/text the jina reader returns for a feed URL (as opposed to an HTML article page, which the reader handles fine per the CISA/Mitel fetches above). Recommend: either have `feed` fall back to a raw-HTML scrape of the blog index when the jina-parsed result is empty, or exclude jina as a `feed` fallback entirely and only apply it to `url` fetches of individual articles. Also worth noting for the operator: 3 of 4 jina keys are fully exhausted (negative balance) — worth rotating in fresh credit or pruning dead keys from the pool.
