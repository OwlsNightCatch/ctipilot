    evidence:
      - quote: "LAUNDRY BEAR's latest campaign leverages a view-based exploit that only requires a user to view a malicious email within a vulnerable version of the webmail service."
        attribution: "CISA/NSA/FBI/MIVD/AIVD joint advisory (AA26-204A)"
        source_url: "https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-204a"
      - quote: "A patch for CVE-2025-66376 was released for both 10.1.13 and 10.0.18 versions of ZCS."
        attribution: "CISA/NSA/FBI/MIVD/AIVD joint advisory (AA26-204A)"
        source_url: "https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-204a"
      - quote: "Threat actors continue to actively target unpatched ZCS instances using CVE-2025-66376."
        attribution: "Palo Alto Networks Unit 42"
        source_url: "https://unit42.paloaltonetworks.com/russian-webmail-espionage/"
      - quote: "Unlike traditional phishing campaigns, 'beehive' allows the threat actors to gain extensive and sustained access to emails without requiring a user's input."
        attribution: "NCSC-UK"
        source_url: "https://www.ncsc.gov.uk/news/uk-and-partners-expose-russian-state-supported-actors-for-new-zero-click-phishing-campaign"
    extended_notes: |
      Framing discrepancy worth flagging: CISA's own advisory calls the exploit "view-based" (requires the message to be opened/rendered in the vulnerable Classic Web Client, no click), while Unit 42 and NCSC-UK both describe it as "zero-click." Both describe the same underlying mechanism (CSS @import-triggered script execution on message render) — treat "zero-click" as the industry shorthand for "requires only opening/viewing," not literal no-interaction.
      CVSS is contested between databases: MITRE scores CVE-2025-66376 7.2 (UI:N — no interaction needed for the CVSS model), NVD scores it 6.1 (UI:R). ENISA EUVD mirrors MITRE's 7.2 and lists EPSS 12.01% (as of 2026-07-23) and exploitedSince 2026-03-18 (the KEV addition date), confirming this is not a fresh CVE — the news value is the campaign attribution, not the flaw.
      High-value detection artifacts named in the advisory: (1) Zimbra mailbox.log (/opt/zimbra/log/mailbox.log) showing bursts of SearchGalRequest SOAP calls from a single user in a short window (GAL brute-force uses ~20 batches of ~77 two-character queries each); (2) CreateAppSpecificPasswordRequest SOAP calls creating an Application Passcode literally named "ZimbraWeb" (there is no legitimate reason for this name — ZCS webmail supports native 2FA and does not require an app passcode); (3) GetScratchCodesRequest SOAP calls (2FA scratch-code harvesting); (4) browser localStorage entries keyed zd_comp_YYYY-MM-DD on the ZCS webmail origin (LAUNDRY BEAR's own de-duplication marker for already-exfiltrated days, persists post-compromise since the script never cleans up); (5) network signal — DNS queries with long randomized subdomains resolving to non-organizational VPS providers, and HTTPS destinations reached via Mullvad VPN egress ranges. LAUNDRY BEAR primarily used ProtonMail for initial delivery but has, since ~November 2025, pivoted to sending phishing emails from already-compromised victim mailboxes (observed sender domains include isofts.kiev[.]ua and navs.edu[.]ua), which will evade sender-reputation-based filtering.
      Mitigation per CISA: patch to ZCS ≥10.0.18 / ≥10.1.13; if patching is not immediately feasible, move users off the Classic Web Client (Modern client and non-web IMAP/desktop clients are not exposed to this XSS vector) as an interim isolation control; revoke/rotate any Application Passcodes and 2FA scratch codes for any account suspected compromised; consider a passkey-supporting third-party auth broker in front of ZCS since ZCS itself lacks native passkey support.

  - title: "Mitel MiCollab AWV component: unauthenticated command injection to full system compromise (CVSS 9.8, no CVE assigned yet)"
    sources:
      - { url: "https://www.mitel.com/support/security-advisories/mitel-product-security-advisory-misa-2026-0006", publisher: "Mitel PSIRT (MISA-2026-0006)", date: "2026-07-22", role: "primary" }
