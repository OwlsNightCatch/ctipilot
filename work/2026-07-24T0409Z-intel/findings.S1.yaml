        attribution: "CISA (ICSA-26-204-07)"
        source_url: "https://www.cisa.gov/news-events/ics-advisories/icsa-26-204-07"
    extended_notes: |
      Neither CISA advisory page (as fetched) states an available fixed version or patch — this is an honest gap, not confirmed no-fix; operators should check MZ Automation's own channels and the CSAF JSON (https://github.com/cisagov/CSAF/blob/develop/csaf_files/OT/white/2026/icsa-26-204-06.json and .../icsa-26-204-07.json) for remediation guidance before assuming no fix exists. CISA's standard OT guidance applies with elevated weight given the pre-auth RCE profile: minimize internet exposure of any device embedding libIEC61850/lib60870, segment control-system networks behind firewalls from business networks, and prefer up-to-date VPNs over direct exposure for any required remote access. Reporters: Abhinav Agarwal (libIEC61850 CVEs) and Lars Tray (lib60870 CVE).

