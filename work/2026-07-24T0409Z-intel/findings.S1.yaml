    discovery_trace: "first seen at: anssi-fr bridge (cert-fr avis-recent), URL https://www.cert.ssi.gouv.fr/avis/feed/ → https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-0911/ → primary: Mitel PSIRT, URL https://www.mitel.com/support/security-advisories/mitel-product-security-advisory-misa-2026-0006"
    summary: |
      Mitel published PSIRT advisory MISA-2026-0006 (2026-07-22, republished by CERT-FR as CERTFR-2026-AVI-0911 on 2026-07-23) for a critical command-injection vulnerability (internal tracking id MTLVULN-1694; CVE requested but not yet assigned) in the Audio, Web, and Video Conferencing (AWV) component of Mitel MiCollab, an on-premises unified-communications/conferencing platform. Per Mitel, insufficient parameter sanitization in the AWV component allows an unauthenticated attacker to inject and execute arbitrary OS commands, rated Critical with CVSS 3.1 9.8 (AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H) — no authentication, no user interaction, network-reachable. Affected versions run from 10.0.0.26 up to and including 10.2 SP1 FP2 (10.2.1.205) and 9.8 SP3 FP2 (9.8.3.203) and earlier; the fix ships in MiCollab 10.3.0.18, with Mitel-provided backport patches also available for the 10.2 SP1 FP2 and 9.8 SP3 FP2 branches (KB000128275). Mitel credits Hoang Tai of VNPT Cyber Immunity for the finding; no exploitation has been reported by either Mitel or CERT-FR at time of publication. A second, lower-severity advisory (MISA-2026-0007 / MTLVULN-1618, CVSS 3.1 8.0) published the same day covers a reflected XSS in the related OpenScape UC application requiring authentication and user interaction, fixed in V11 R1 FR2 / V10 R6 FR18.
