items:
  - title: "Joint 18-nation advisory: Russian APT 'LAUNDRY BEAR' weaponized a Zimbra zero-day (CVE-2025-66376) into a view-based, near-zero-click mailbox-exfiltration capability, still exploited today"
    sources:
      - { url: "https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-204a", publisher: "CISA / NSA / FBI / MIVD / AIVD + 14 allied agencies (joint CSA AA26-204A)", date: "2026-07-23", role: "primary" }
      - { url: "https://www.ncsc.gov.uk/news/uk-and-partners-expose-russian-state-supported-actors-for-new-zero-click-phishing-campaign", publisher: "NCSC-UK", date: "2026-07-23", role: "primary" }
      - { url: "https://unit42.paloaltonetworks.com/russian-webmail-espionage/", publisher: "Palo Alto Networks Unit 42", date: "2026-07-23", role: "corroborating" }
    discovery_trace: "first seen at: cisa-advisories bridge feed, URL https://www.cisa.gov/cybersecurity-advisories/all.xml → https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-204a → primary (no pivot needed; itself a 18-agency joint primary) → corroboration: ncsc-uk RSS, URL https://www.ncsc.gov.uk/api/1/services/v1/all-rss-feed.xml → https://www.ncsc.gov.uk/news/uk-and-partners-expose-russian-state-supported-actors-for-new-zero-click-phishing-campaign → further corroboration via the advisory's own cited reference: https://unit42.paloaltonetworks.com/russian-webmail-espionage/"
    summary: |
      A joint Cybersecurity Advisory (AA26-204A) from NSA, FBI, CISA and 15 further national agencies (incl. NCSC-UK, AIVD/MIVD Netherlands, ANSSI/DGSI France, five other EU member-state services) discloses that the Russian state-supported actor "LAUNDRY BEAR" (aka Void Blizzard/Microsoft, CL-STA-1114/Unit 42, TA488 formerly UNK_PitStop/Proofpoint) has run a sustained email-exfiltration campaign against Zimbra Collaboration Suite (ZCS) webmail since at least July 2025, continuing to the present. The actor exploited CVE-2025-66376 (CWE-79, stored XSS via unsanitized CSS @import directives in HTML email; MITRE CVSS 3.1 7.2, NVD 6.1) as an undisclosed zero-day for roughly four months before Zimbra's fix (ZCS 10.0.18 / 10.1.13, released November 2025) and continues to exploit unpatched instances today. The exploit requires only that the victim view a malicious email in a vulnerable ZCS webmail client (no click, no attachment) — CISA calls it "view-based," Unit 42 and NCSC-UK frame it as "zero-click." The payload is a Base64/SVG-onload-hidden, XOR-obfuscated JavaScript ("Ulej"/"beehive," assessed as AI-assisted in its development) that runs 12 asynchronous collection stages via Zimbra SOAP API calls: it harvests the victim's last 90 days of email, the organization's Global Address List (brute-forced via ~1,540 two-character SearchGalRequest batches), 2FA scratch codes, and creates a persistent Application Passcode named "ZimbraWeb" to bypass native 2FA for IMAP access. Exfiltration runs over both DNS A-record queries (Base32-encoded, RFC-1035-compliant) and HTTPS to a Dockerized "Flowerbed" collection stack (Catcher/Nginx/Certbot/Gardener containers) fronted by Let's Encrypt TLS on short-lived (7–60 day) VPS infrastructure, mostly reached via Mullvad VPN. Targeting spans the Defense Industrial Base, federal/local government, education, energy, law enforcement, media, NGOs and technology sectors across NATO/Western states, with earlier and heavier targeting of Ukraine. CVE-2025-66376 was already added to CISA KEV in March 2026; the new in-window content is the attribution, campaign mechanics and detection guidance, not the underlying flaw's disclosure.
    region_nexus: "global NATO/Western targeting with explicit government, energy, defense-industrial-base, law-enforcement and education victimology named by 18 co-authoring agencies including 6 EU member-state services (France, Italy, Poland, Spain, Sweden, Netherlands) and NCSC-UK — direct relevance to any Swiss/European public-sector or critical-infrastructure operator running on-premises Zimbra"
