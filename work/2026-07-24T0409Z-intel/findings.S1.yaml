  - title: "MZ Automation libIEC61850 (IEC 61850 substation-automation library): unauthenticated heap-overflow RCE via crafted MMS Initiate request (CVE-2026-49035) among four CVEs; sibling lib60870 SCADA-protocol library gets a separate DoS fix (CVE-2026-16002)"
    sources:
      - { url: "https://www.cisa.gov/news-events/ics-advisories/icsa-26-204-06", publisher: "CISA (ICSA-26-204-06)", date: "2026-07-23", role: "primary" }
      - { url: "https://www.cisa.gov/news-events/ics-advisories/icsa-26-204-07", publisher: "CISA (ICSA-26-204-07)", date: "2026-07-23", role: "primary" }
    discovery_trace: "first seen at: cisa-advisories bridge feed, URL https://www.cisa.gov/cybersecurity-advisories/all.xml → https://www.cisa.gov/news-events/ics-advisories/icsa-26-204-06 → primary (no pivot needed; CISA ICS-CERT is the sole authority for this advisory) — companion advisory https://www.cisa.gov/news-events/ics-advisories/icsa-26-204-07 reached via the same feed listing"
    summary: |
      CISA published ICS advisory ICSA-26-204-06 (initial release 2026-07-23) for four vulnerabilities in MZ Automation's open-source libIEC61850 (versions >=1.0.0 to <=1.6.1), a widely embedded C library implementing IEC 61850 (MMS/GOOSE) substation-automation protocols used in energy-sector protection, control and visibility functions worldwide. The most severe, CVE-2026-49035 (CWE-122 heap-based buffer overflow, CVSS 3.1 8.1 / CVSS 4.0 9.2 CRITICAL, AV:N/AC:H(v3) network-adjacent, no auth, no user interaction), is triggered by a crafted MMS Initiate request; CISA states remote code execution has been demonstrated when ASLR is disabled, with memory corruption/DoS in ASLR-enabled configurations. Three companion flaws in the same release: CVE-2026-50039 (CWE-121 stack-based buffer overflow via a crafted ReadRequest, CVSS 3.1 7.5/4.0 8.7); CVE-2026-50103 (CWE-228, NULL pointer dereference in the shared L2 GOOSE/R-GOOSE parser via a malformed TLV in a GOOSE frame, network-adjacent DoS, CVSS 3.1 6.5/4.0 7.1); and CVE-2026-50032 (CWE-476, NULL pointer dereference in the MMS Write Named Variable List handler via a WriteRequest with an empty listOfData field, CVSS 3.1 7.5/4.0 8.7). A companion advisory, ICSA-26-204-07 (also 2026-07-23), covers MZ Automation's sibling library lib60870 (versions <=2.4.0, implementing IEC 60870-5-104 SCADA telecontrol, used in Chemical/Energy/Water-Wastewater sectors): CVE-2026-16002 (CWE-125 out-of-bounds read causing a parser crash/DoS, CVSS 3.1 8.2/4.0 8.8). CISA states no known public exploitation of any of these five CVEs has been reported to CISA at time of publication, and neither advisory text (as retrieved) states a fixed/patched version number — operators should consult MZ Automation directly and the linked CSAF JSON for remediation status.
    region_nexus: "worldwide; libIEC61850/lib60870 are embedded OEM components in substation-automation and SCADA telecontrol gear used across the European electricity-transmission/distribution and water-utility sectors — direct relevance to Swiss/European energy and water operators"
    primary_sector_nexus: "indirect"
    sector: "energy, water, critical-manufacturing, chemical"
    cves: [CVE-2026-49035, CVE-2026-50039, CVE-2026-50103, CVE-2026-50032, CVE-2026-16002]
