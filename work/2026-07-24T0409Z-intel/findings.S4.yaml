items:
  - title: "BravoX ransomware breaches a Vaud fiduciary firm, exposing tax and administrative data of ~15 Swiss municipalities and a cantonal minister"
    sources:
      - { url: "https://www.letemps.ch/suisse/vaud/le-piratage-d-une-fiduciaire-vaudoise-expose-sur-le-dark-web-100-000-dossiers-de-clients-dont-celui-d-un-conseiller-d-etat", publisher: "Le Temps", date: "2026-07-22", role: "primary" }
      - { url: "https://www.20min.ch/fr/story/vaud-fiduciaire-piratee-des-communes-et-un-conseiller-d-etat-touches-103607546", publisher: "20 minutes (CH)", date: "2026-07-23", role: "corroborating" }
      - { url: "https://www.24heures.ch/cyberattaque-les-donnees-fiscales-de-vassilis-venizelos-fuitent-454052188828", publisher: "24 heures", date: "2026-07-23", role: "corroborating" }
      - { url: "https://socradar.io/blog/dark-web-profile-bravox-ransomware/", publisher: "SOCRadar (BravoX threat profile, background)", date: "2026-01-26", role: "background" }
    discovery_trace: "first seen at: inside-it-ch, URL https://www.inside-it.ch/rss.xml (item: 'Cyberangriff legt Westschweizer Behördendaten offen', 2026-07-23) → pivot: WebSearch (\"cyberattaque communes romandes données publiées juillet 2026\") → primary: Le Temps, URL https://www.letemps.ch/suisse/vaud/le-piratage-d-une-fiduciaire-vaudoise-expose-sur-le-dark-web-100-000-dossiers-de-clients-dont-celui-d-un-conseiller-d-etat → corroborating: 20 minutes, URL https://www.20min.ch/fr/story/vaud-fiduciaire-piratee-des-communes-et-un-conseiller-d-etat-touches-103607546 → corroborating: 24 heures, URL https://www.24heures.ch/cyberattaque-les-donnees-fiscales-de-vassilis-venizelos-fuitent-454052188828 → background on actor: SOCRadar, URL https://socradar.io/blog/dark-web-profile-bravox-ransomware/"
    summary: |
      BravoX — a Russian-speaking-convention Ransomware-as-a-Service operation first observed on the RAMP underground
      forum in January 2026, per SOCRadar's profile explicitly avoiding CIS-based targets — breached an accounting/
      fiduciary services firm based in Yverdon-les-Bains (canton Vaud) around 30 June 2026. The firm's own account
      (relayed by Le Temps) describes only a "connection problem to our server" that triggered its IT provider to
      isolate affected systems, revoke compromised access, and restore from an external backup; no negotiation took
      place and no ransom was paid. BravoX published roughly 220 GB of data — over 100,000 files — on its Tor leak
      site on 18 July 2026 (already ~250 recorded downloads within days). The dataset spans individuals, businesses
      and institutions plus administrative/tax records of some fifteen Vaud municipalities in the Nord Vaudois
      district (named: Corcelles-près-Concise, Belmont-sur-Yverdon), and the personal tax file of Vaud State
      Councillor (cantonal government minister) Vassilis Venizelos and his spouse. The fiduciary filed a criminal
      complaint and notified both the cantonal data-protection commissioner and the Federal Office for Cybersecurity
      (BACS/OFCS) — the mandatory Swiss critical-incident reporting channel. This is a textbook third-party/
      trusted-relationship exposure: the compromised entity is not government itself, but a supplier holding
      regulatory/tax data on behalf of cantonal and municipal public administration, illustrating that municipal
      third-party accounting/fiduciary providers are a viable pivot into government-held personal data even without
      compromising any government network directly.
    region_nexus: "Switzerland — canton Vaud cantonal government and multiple municipalities directly affected via a third-party supplier"
