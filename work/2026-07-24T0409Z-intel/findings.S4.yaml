    extended_notes: |
      Recurrence pattern: a near-identical incident shape (a Morges-district fiduciary serving ~a dozen Vaud
      municipalities breached, no ransom paid) already occurred in October 2021 (GRF Société fiduciaire SA,
      unrelated actor) — confirmed as a distinct, older case via WebFetch of the 2021 20min.ch article, not a
      duplicate of this BravoX story. The recurrence across two unrelated incidents five years apart suggests Vaud's
      municipal outsourcing model for fiduciary/accounting services is a structurally recurring exposure point.

  - title: "Joint NSA/FBI/CISA advisory, co-sealed by ~20 NATO/EU intelligence and cyber agencies: Russian 'LAUNDRY BEAR' exploits a Zimbra zero-click XSS (CVE-2025-66376) against Western government, energy, defense and education targets"
    sources:
      - { url: "https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-204a", publisher: "CISA (joint advisory AA26-204A, co-authored by NSA, FBI, and Dutch, UK, French, Italian, Polish, Spanish, Swedish, Czech, Danish, Estonian, Finnish, Moldovan intelligence/cyber agencies)", date: "2026-07-23", role: "primary" }
      - { url: "https://therecord.media/zimbra-webmail-zero-click-phishing-russia-laundry-bear", publisher: "The Record", date: "2026-07-23", role: "corroborating" }
      - { url: "https://www.cisa.gov/news.xml", publisher: "CISA News (feed confirming 2026-07-23 publication)", date: "2026-07-23", role: "corroborating" }
    discovery_trace: "first seen at: therecord, URL https://therecord.media/feed (item: 'International alert spotlights Russia-linked attacks on Zimbra webmail', 2026-07-23) → primary: CISA advisory AA26-204A, URL https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-204a → corroborating: CISA News feed, URL https://www.cisa.gov/news.xml"
    summary: |
      CISA, NSA, FBI and co-sealing agencies from the Netherlands (AIVD, MIVD), UK (NCSC), France (ANSSI, DGSI),
      Italy (AISE, AISI), Poland (AW, SKW), Spain (CNI), Sweden (NCSC-SE), Czech Republic (NÚKIB), Denmark (DDIS),
      Estonia (EFIS), Finland (FDI, SUPO), Moldova (SIS), Australia, Canada and New Zealand published a joint
      advisory (AA26-204A, 2026-07-23) on a Russian state-supported actor tracked as LAUNDRY BEAR (aka Void
      Blizzard/Microsoft, CL-STA-1114/Palo Alto Unit 42, TA488 formerly UNK_PitStop/Proofpoint). Since at least
      July 2025 the group has exploited CVE-2025-66376 — improper sanitization of CSS @import directives in the
      Zimbra Collaboration Suite (ZCS) Classic Web Client (CWE-79, XSS) — as a zero-click, "view-based" exploit:
      a victim need only preview/open a malicious email for embedded JavaScript, smuggled via a base64+XOR-encoded
      payload inside an SVG element's onload attribute, to execute immediately in the webmail session. The payload
      runs a 12-stage asynchronous collection routine exfiltrating the victim's last 90 days of email, the Global
      Address List, passwords (via SOAP GetIdentitiesRequest/ZimbraAccount calls and password-manager interception),
      2FA tokens, and a newly minted IMAP "Application Passcode" that lets the actor bypass MFA and log in via IMAP
      going forward. Data exfiltrates via both DNS and HTTPS to LAUNDRY BEAR's custom "Ulej" (Улей, "beehive")
      exfil/aggregation capability, hosted in a "Flowerbed" Docker stack (Catcher: DNS+HTTP collection server;
      Certbot: automated Let's Encrypt via Cloudflare DNS challenge; Nginx: HTTPS reverse proxy validating the SNI
      contains "*.i.*" before forwarding; Gardener: health-check) on short-lived (7-60 day) VPS infrastructure
      accessed over Mullvad VPN. Since November 2025 the group has been sending the phishing emails FROM previously
      compromised victim accounts to defeat anti-phishing training and heuristics. The exploit was a true zero-day
      when first used (July 2025); Synacor patched ZCS 10.1.13 and 10.0.18 in November 2025, but active exploitation
      of unpatched instances continues as of this advisory. CISA/NSA assess (per prior related advisories) the
      group previously relied on password spraying, phishing and pass-the-cookie AiTM (via a modified Evilginx2)
      against Microsoft Exchange cloud mail before pivoting to this more technical ZCS exploit; the advisory notes
      indications AI assisted the "Flowerbed" codebase's development. Targeting spans the Defense Industrial Base,
      federal/local government, education, energy, law enforcement, media, NGOs and technology sectors across NATO
      allies and Ukraine — the extensive multi-nation European co-sealing (including several EU member states'
      intelligence services) signals this is assessed as directly relevant to those nations' own constituencies, not
      solely a US warning relayed for awareness.
    region_nexus: "NATO/EU member states explicitly named as co-sealing authorities (France, Italy, Poland, Spain, Sweden, Czechia, Denmark, Estonia, Finland, Netherlands, UK) — direct European government/critical-infrastructure relevance"
    primary_sector_nexus: "direct"
    sector: "public-sector, government, energy, defense-industrial-base, education"
    cves: ["CVE-2025-66376"]
    techniques: [T1566, T1203, T1027.017, T1114, T1098, T1556.006, T1078, T1048.003, T1608, T1199]
    affected_products: ["Zimbra Collaboration Suite (ZCS) — Classic Web Client"]
    entity_keys: []
    new_entities:
