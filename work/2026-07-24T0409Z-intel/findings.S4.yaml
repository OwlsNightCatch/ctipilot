        attribution: "Le Temps"
        source_url: "https://www.letemps.ch/suisse/vaud/le-piratage-d-une-fiduciaire-vaudoise-expose-sur-le-dark-web-100-000-dossiers-de-clients-dont-celui-d-un-conseiller-d-etat"
      - quote: "Le 18 juillet, quelque 220 Go de données y ont été publiées, soit plus de 100 000 dossiers."
