    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "A group of Russian state-supported cyber actors has been targeting and compromising various Western government and commercial organizations using the Zimbra Collaboration Suite (ZCS) software since at least July 2025."
        attribution: "CISA/NSA/FBI joint advisory AA26-204A"
        source_url: "https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-204a"
      - quote: "Unlike traditional phishing campaigns that persuade a user into taking an action, such as clicking a link or opening a file, LAUNDRY BEAR's latest campaign leverages a view-based exploit that only requires a user to view a malicious email within a vulnerable version of the webmail service."
        attribution: "CISA/NSA/FBI joint advisory AA26-204A"
        source_url: "https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-204a"
      - quote: "A patch for CVE-2025-66376 was released for both 10.1.13 and 10.0.18 versions of ZCS."
        attribution: "CISA/NSA/FBI joint advisory AA26-204A"
        source_url: "https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-204a"
      - quote: "The covert and persistent nature of this activity, along with the absence of any known financial extortion, almost certainly indicates this group's involvement in espionage activities with Russian government backing."
        attribution: "CISA/NSA/FBI joint advisory AA26-204A"
        source_url: "https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-204a"
    extended_notes: |
      Domain-overlap note for the composer: this item carries a mapped CVE and active-exploitation status that also
      squarely fits S1's mission (trending/exploited vulnerabilities). Surfaced here under S4 because the advisory's
      substance is fundamentally a victim-targeting/incident disclosure (named sectors and countries affected, a
      named actor, financial-motive ruled out) rather than a single technical flaw write-up; if S1 independently
      surfaced the same CVE, treat as the same item / dedupe on CVE-2025-66376.
      Prior pipeline coverage note: an EARLIER, unrelated Zimbra Classic Web Client XSS issue (no CVE assigned) was
      already covered on 2026-07-10 (entry id in prior_coverage: 2026-07-10/zimbra-classic-web-client-code-exec-ncsc-ch,
