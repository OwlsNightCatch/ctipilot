      10.1.13/10.0.18) — confirmed not a duplicate.

  - title: "CISA/FBI/EPA update a joint advisory on Iranian-affiliated PLC intrusions: new project-file-tampering detection guidance, targeting scope expands to Schneider Electric and Siemens controllers"
    sources:
      - { url: "https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-097a", publisher: "CISA/FBI/NSA/EPA/DOE/CNMF/Treasury (joint advisory AA26-097A, updated)", date: "2026-07-22", role: "primary" }
      - { url: "https://www.cisa.gov/news-events/news/cisa-fbi-epa-and-us-government-partners-update-warning-iran-affiliated-threat-actors-targeting", publisher: "CISA News", date: "2026-07-22", role: "corroborating" }
    discovery_trace: "first seen at: databreaches-net, URL https://databreaches.net/feed/ (item: 'Iranian-Affiliated Cyber Actors Exploit Programmable Logic Controllers Across US Critical Infrastructure', relayed 2026-07-23) → primary: CISA advisory AA26-097A, URL https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-097a → corroborating: CISA News release, URL https://www.cisa.gov/news-events/news/cisa-fbi-epa-and-us-government-partners-update-warning-iran-affiliated-threat-actors-targeting"
    summary: |
      CISA, FBI, NSA, EPA, DOE, US Cyber Command's Cyber National Mission Force and Treasury updated (22 July 2026)
      their joint advisory AA26-097A — originally published April 2026 — on Iranian-affiliated APT actors' ongoing
      exploitation of internet-connected, misconfigured programmable logic controllers (PLCs). The update's
      substantive additions: (1) targeting scope, previously centered on Rockwell Automation/Allen-Bradley
      CompactLogix and Micro850 controllers, is now confirmed to include Schneider Electric BMX P34/Modicon M340 and
      Siemens S7-1200 series PLCs — both vendors with large installed bases in European water and energy utilities;
      (2) the actors are opportunistically discovered via port scanning of common ICS protocol ports (44818, 2222,
      102, 502) and modem SSH (port 22, frequently running Dropbear), then accessed using the PLC manufacturers' OWN
      engineering software (Rockwell Studio 5000 Logix Designer, Schneider EcoStruxure Control Expert, Siemens TIA
      Portal) run from leased third-party infrastructure to pull down device project files (ladder logic + I/O
      configuration); (3) new detection guidance instructs defenders to compare the running PLC program against a
      known-good baseline and check Add-On Instructions (AOIs) for unauthorized modifications, since the actors have
      been observed modifying/deleting project-file logic to disable shutdown and alarm interlocks — letting
      HMI/SCADA displays mask unsafe operating conditions from operators. Affected US sectors: Water and Wastewater
      Systems, Energy, and Government Services and Facilities (explicitly including local municipalities), with
      "operational disruption and financial loss" reported in some cases. No specific CVE underlies this campaign —
      the exploited condition is direct internet exposure of PLC management interfaces, not a single software flaw.
      The advisory frames this as related to (but does not firmly re-attribute to) the previously documented
      CyberAv3ngers/IRGC Cyber Electronic Command activity (aka Shahid Kaveh Group, Hydro Kitten, Storm-0784, Bauxite,
      UNC5691) that targeted Unitronics PLCs from November 2023.
    region_nexus: "US-focused advisory; the newly confirmed Schneider Electric and Siemens targeting is directly transferable to European water/energy operators running the same controller families"
    primary_sector_nexus: "indirect"
    sector: "energy, water, public-sector"
    cves: []
    techniques: [T1595, T1078, T1219, T1041, T1565]
    affected_products: ["Rockwell Automation CompactLogix", "Rockwell Automation Micro850", "Schneider Electric BMX P34 / Modicon M340", "Siemens S7-1200"]
    entity_keys: ["actor:cyberav3ngers"]
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE-NATIONAL-CERT
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "The update provides new guidance to detect malicious changes in reusable code modules used within Rockwell Automation PLC programs. It also expands the manufacturer scope to include observed targeting of Schneider Electric, Siemens and possible other PLC manufacturers."
        attribution: "CISA News release"
        source_url: "https://www.cisa.gov/news-events/news/cisa-fbi-epa-and-us-government-partners-update-warning-iran-affiliated-threat-actors-targeting"
      - quote: "The Iranian-affiliated activity outlined in this advisory has disrupted PLCs across several U.S. critical infrastructure sectors by attempting to download malicious project files and manipulate data on human machine interface (HMI) and supervisory control and data acquisition (SCADA) displays, resulting in operational disruption and financial loss for affected organizations."
        attribution: "CISA News release"
        source_url: "https://www.cisa.gov/news-events/news/cisa-fbi-epa-and-us-government-partners-update-warning-iran-affiliated-threat-actors-targeting"
      - quote: "Review project files running on PLCs for unauthorized changes. Use vendor-provided integrity checking tools and visually compare the running program to known good logic."
        attribution: "CISA/FBI/EPA/NSA/DOE/CNMF/Treasury joint advisory AA26-097A"
        source_url: "https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-097a"
    extended_notes: |
      Borderline call: this advisory is US-focused (explicitly "warning U.S. organizations") with no confirmed
      European victims stated. Included because the newly confirmed Schneider Electric / Siemens targeting scope is
      concretely transferable to Swiss/EU water and energy operators running the same controller families, and the
      detection guidance (project-file/AOI integrity comparison) is vendor-agnostic and directly actionable for them.
    borderline: true
    borderline_reason: "US-focused CISA advisory with no stated European victims; included for transferable TTP/detection value to Schneider Electric and Siemens PLC operators in the constituency's energy/water sectors."

