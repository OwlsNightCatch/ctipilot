  - claim_id: 56f2e5454c
    entry: 2026-10-10/ghostaction-fake-audit-workflow-git-history-credential-theft
    surface: "actions[0]"
    kind: frontmatter
    text: "Run an organisation-scoped GitHub code search in every organisation your teams and suppliers administer for workflow files under .github/workflows that present themselves as a security audit or check and were added since 2026-08-31; any hit means assume breach: revoke the credential that committed it and rotate every secret found anywhere in the repository's git history, not only the configured Actions secrets."
  - claim_id: ac80a1630a
    entry: 2026-10-10/ghostaction-fake-audit-workflow-git-history-credential-theft
    surface: "body"
    kind: cited
    text: "StepSecurity reports that on 2026-10-08 the GhostAction GitHub Actions credential-theft campaign used the accounts of two open-source maintainers to push a workflow disguised as a security improvement to 345 repositories in two automated sweeps, among them an Uber-owned repository that one maintainer could still write to ("
    urls: ["https://www.stepsecurity.io/blog/ghostaction-returns"]
  - claim_id: 70103fddc1
    entry: 2026-10-10/ghostaction-fake-audit-workflow-git-history-credential-theft
    surface: "body"
    kind: cited
    text: "**Exposure:** any GitHub account whose token or session credential has leaked, and every repository it can write to; StepSecurity says a workflow posing as a security audit or check that appeared in a repository you maintain since 2026-08-31 means treat it as a confirmed breach ("
    urls: ["https://www.stepsecurity.io/blog/ghostaction-returns"]
  - claim_id: 29be652033
    entry: 2026-10-10/ghostaction-fake-audit-workflow-git-history-credential-theft
    surface: "body"
    kind: cited
    text: "**Detection:** source-control audit logs: workflow files added straight to default branches without a pull request by a maintainer identity, unsigned commits landing in many repositories within minutes; an organisation-scoped code search with StepSecurity's published content-marker queries, and a check of your repositories for workflow files presented as security audits or checks; runner egress logs: an HTTP POST to a bare IP address with no preceding DNS lookup ("
    urls: ["https://www.stepsecurity.io/blog/ghostaction-returns"]
  - claim_id: c6c0bb26a0
    entry: 2026-10-10/ghostaction-fake-audit-workflow-git-history-credential-theft
    surface: "body"
    kind: cited
    text: "Removing the workflow does not undo the theft: StepSecurity says any secret ever committed to a repository must be treated as compromised, so treat each run as an exfiltration, scan the full history and rotate every credential found ("
    urls: ["https://www.stepsecurity.io/blog/ghostaction-returns"]
