claims:
  - claim_id: 6c30bebe80
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "summary"
    kind: frontmatter
    text: "PaperCut NG and PaperCut MF (all versions) carry an unauthenticated remote-code-execution chain — CVE-2026-81578 (auth bypass, CVSS4.0 8.8) and CVE-2026-82078 (unsafe dynamic class loading, CVSS4.0 9.4) — that PaperCut confirmed under active exploitation on 2026-08-27, before any CVE or patch existed. Fully tested maintenance releases 26.0.5, 25.0.13 and 24.1.10 (10 September 2026) replace the emergency patches and are the vendor's recommended build; servers still on Emergency Patch Release 1 or 2 need to upgrade now. There is no fix for v23 and earlier, and Huntress estimates 47% of the PaperCut installs it tracks run v23 or older. GreyNoise now documents an AI-agent-orchestrated mass-exploitation campaign against this same chain, compromising at least 440 instances across 395 identified organizations since 31 August 2026, reaching full domain admin in as little as five minutes via legacy Active Directory escalation paths. watchTowr's write-up of 2026-10-09 shows the 28 August emergency build could still be taken without authentication through the Setup Wizard forms, and names CVE-2026-82077, an administrator-only Scan-to-Fax code-execution flaw that the vendor lists as fixed only in 26.0.5 and 25.0.13."
  - claim_id: ff68d1afa8
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "immediate_action"
    kind: frontmatter
    text: "Get every PaperCut NG/MF server onto a fixed build now, or take internet-facing servers offline: PaperCut NG and MF are under active exploitation via an unauthenticated request-routing chain that reaches remote code execution as the PaperCut server process; PaperCut now confirms a second, more sophisticated wave of attacks against servers that remain unpatched and internet-facing. Any v24/25/26 Application Server, Site Server or secondary/print server that is unpatched or on Emergency Patch Release 1 or 2 goes to the security maintenance release for its line (26.0.5, 25.0.13 or 24.1.10) now; one already on Emergency Patch Release 3 is protected against the unauthenticated chain and moves to the maintenance release through normal change control; 26.0.5 and 25.0.13 also close the administrator-only Scan-to-Fax flaw CVE-2026-82077, and the vendor's September bulletin names no 24.x fix for it. For v23 and earlier there is no fix at all: restrict the Application Server to trusted/internal IP addresses right now, and treat any internet-facing instance as potentially compromised until proven otherwise."
  - claim_id: d02c5fb466
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade every PaperCut NG/MF Application Server, Site Server and secondary/print server to the security maintenance release for its line (26.0.5, 25.0.13 or 24.1.10), starting with any still on Emergency Patch Release 1 or 2, and note that the emergency builds do not carry the fix for CVE-2026-82077, an administrator-only Scan-to-Fax code-execution flaw that the vendor's September bulletin lists as fixed in 26.0.5 and 25.0.13 and does not list for 24.1.10; for v23 and earlier, immediately restrict the Application Server's web interface to trusted/internal IP addresses only; no patch exists for that line."
