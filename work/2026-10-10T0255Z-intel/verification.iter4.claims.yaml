  - {claim_id: 212afad0e3, verdict: ok, source_url: "https://cert.europa.eu/publications/security-advisories/2026-011/", passage: "CVE-2026-44756 (CVSS 10.0) ... nicknamed \"OVERPASS\" by the Onapsis Research Labs (ORL), which discovered and responsibly disclosed it. The second, CVE-2026-58240 (CVSS 9.8)"}
