  - {claim_id: 3b7bd25376, verdict: ok, source_url: "https://onapsis.com/blog/s4get-cve-2026-58240-sap-message-server-threat-advisory/", passage: "it succeeds even when secure communications are strictly enabled and the ACLs defenders normally rely on (secinfo, reginfo, ms/acl_info) are flawlessly configured."}
  - {claim_id: d8328722fb, verdict: ok, source_url: "https://onapsis.com/blog/sap-overpass-remediation/", passage: "A single kernel patch closes all exploitation vectors. ... specific workarounds to prevent exploitation over HTTP traffic in note 3756304."}
  - {claim_id: e4ac5bcf6a, verdict: ok, source_url: "https://onapsis.com/blog/sap-overpass-remediation/", passage: "it is routinely reachable across the internal network because every SAP GUI user needs it."}
  - {claim_id: 73c84e5727, verdict: ok, source_url: "https://onapsis.com/blog/sapmap/", passage: "On September 15th, a group of researchers publicly released an open-source SAP discovery and exploitation toolkit (dubbed “SAPMAP”)."}
  - {claim_id: b796aa609e, verdict: ok, source_url: "https://onapsis.com/blog/sapmap/", passage: "Defenders should operate under the assumption that OVERPASS exploit PoCs have been made publicly available."}
  - {claim_id: 585cfd2b3e, verdict: ok, source_url: "https://onapsis.com/blog/sapmap/", passage: "public PoC releases can often jumpstart attack campaigns within days or weeks."}
  - {claim_id: ff07b58e21, verdict: ok, source_url: "https://blog.senthorus.ch/posts/sapmap_threat_assessment/", passage: "Public code establishes that a capability is available; an incident report establishes that someone used it against a victim."}
  - {claim_id: 2a2a2dffa7, verdict: ok, source_url: "https://onapsis.com/blog/sapmap/", passage: "the Onapsis Research Labs have not observed active exploitation by threat actors using SAPMAP yet"}
