  - {claim_id: ec8bd5835e, verdict: ok, source_url: "https://onapsis.com/blog/sap-overpass-remediation/", passage: "identifies more than 10,000 unique Internet-facing IP addresses presenting an SAP web interface reachable from the public Internet, and that figure is conservative."}
  - {claim_id: 2d1c462a9b, verdict: ok, source_url: "https://onapsis.com/blog/s4get-cve-2026-58240-sap-message-server-threat-advisory/", passage: "Exploitation requires no credentials, no certificate, and no pre-existing misconfiguration. A successful attack yields full remote code execution as <sid>adm"}
  - {claim_id: 408ae5ef75, verdict: ok, source_url: "https://onapsis.com/blog/sap-overpass-remediation/", passage: "History also shows attackers can reverse-engineer SAP patches within 72 hours, as with RECON (CVE-2020-6287), and that window keeps shrinking now with AI-assisted tooling."}
