claims:
  - {claim_id: 6c30bebe80, verdict: ok, source_url: "https://www.papercut.com/kb/Main/security-bulletin-27-aug-2026-urgent-security-advisory/", passage: "PaperCut NG/MF **26.0.5, 25.0.13 and 24.1.10** are now available."}
