  - {claim_id: e89dbc4b75, verdict: ok, source_url: "https://www.greynoise.io/blog/ai-orchestrated-campaign-against-papercut-ng-mf", passage: "Where domain admin was achieved, the adversary’s fastest time was five minutes and the longest time was 144 minutes."}
  - {claim_id: 21860ac90c, verdict: ok, source_url: "https://www.papercut.com/kb/Main/security-bulletin-27-aug-2026-urgent-security-advisory/", passage: "if you are on Emergency Patch Release 3 you are protected against the issues described in this advisory and can schedule this upgrade normally."}
  - {claim_id: f73fdda954, verdict: ok, source_url: "https://www.papercut.com/kb/Main/security-bulletin-27-aug-2026-urgent-security-advisory/", passage: "if you are on Emergency Patch Release 3 you are protected against the issues described in this advisory and can schedule this upgrade normally."}
  - {claim_id: 20c268438b, verdict: ok, source_url: "https://www.papercut.com/kb/Main/security-bulletin-sep-2026/", passage: "CVE-2026-82077 ... Fixed in: PaperCut NG/MF 26.0.5; 25.0.13 for the 25.x branch. | 7.3 (HIGH)"}
  - {claim_id: 69f8c5e55b, verdict: ok, source_url: "https://www.rapid7.com/blog/post/etr-papercut-ng-mf-critical-zero-day-exploited-in-the-wild/", passage: "in 2023, CVE-2023-27350 was broadly exploited in the wild by multiple threat-actor groups, including ransomware operators."}
  - {claim_id: b391a6dffe, verdict: ok, source_url: "https://labs.watchtowr.com/death-by-a-thousand-papercuts-papercut-pre-auth-rce-chain-and-patch-bypasses-wt-2026-0141-0144-cve-2026-82077-cve-2026-82078-cve-2026-81578/", passage: "PaperCut publishes an advisory concerning a vulnerability being exploited in the wild targeting 26.0.3. Advisory comes with no patch"}
  - {claim_id: acafea0f07, verdict: ok, source_url: "https://www.rapid7.com/blog/post/etr-papercut-ng-mf-critical-zero-day-exploited-in-the-wild/", passage: "information supplied by a university customer’s security team and digital forensics and incident response team enabled its security response team to reproduce the vulnerability"}
  - {claim_id: 5fd7186016, verdict: ok, source_url: "https://www.rapid7.com/blog/post/etr-papercut-ng-mf-critical-zero-day-exploited-in-the-wild/", passage: "PaperCut validates access only to the displayed page. By selecting either the public Error page or Exception page for display, an attacker can bypass authentication"}
  - {claim_id: 2f444ec8f9, verdict: ok, source_url: "https://www.rapid7.com/blog/post/etr-papercut-ng-mf-critical-zero-day-exploited-in-the-wild/", passage: "An attacker first uses the ConfigEditor requests to modify four external user-lookup settings"}
  - {claim_id: 333994c528, verdict: ok, source_url: "https://www.rapid7.com/blog/post/etr-papercut-ng-mf-critical-zero-day-exploited-in-the-wild/", passage: "H2 processes an inline INIT statement that creates a JavaScript-backed database trigger. PaperCut includes the Nashorn JavaScript engine"}
  - {claim_id: 73c5d03654, verdict: ok, source_url: "https://www.papercut.com/kb/Main/security-bulletin-27-aug-2026-urgent-security-advisory/", passage: "CWE-306 Missing authentication for critical function. | CWE-470 Use of Externally-Controlled input to select classes or code ('unsafe reflection')"}
  - {claim_id: 00bee77116, verdict: ok, source_url: "https://www.huntress.com/blog/papercut-actively-exploited", passage: "This second exploited instance was running PaperCut MF version 24.1.5.71847, and was exploited before Emergency Patch Release 2 was publicly available."}
  - {claim_id: bb7847dc91, verdict: F3, source_url: "https://www.huntress.com/blog/papercut-actively-exploited", passage: "After exploitation, the .class file deletes its own `Udydn.out` file, as well as the server's `server.log` file. [first incident only; the second: 'the logs revealed another .class file payload']"}
  - {claim_id: 4e97a48625, verdict: ok, source_url: "https://www.huntress.com/blog/papercut-actively-exploited", passage: "invoke an observable `charmap.exe` process running as SYSTEM spawned under the `pc-app.exe` PaperCut Application Server."}
  - {claim_id: 0e1508796d, verdict: ok, source_url: "https://www.rapid7.com/blog/post/etr-papercut-ng-mf-critical-zero-day-exploited-in-the-wild/", passage: "the first emergency patch could be bypassed by using the Home page for display, however the newest version of the vendor patch correctly remediates this bypass."}
  - {claim_id: 26182ef731, verdict: ok, source_url: "https://www.papercut.com/kb/Main/security-bulletin-27-aug-2026-urgent-security-advisory/", passage: "1 September 2026, 6:22pm (AEST) | Published Emergency Patch Release 3 ... 10 September 2026, 2:00pm (AEST) | Published security maintenance releases. (Last updated September 10, 2026)"}
  - {claim_id: 4a99fa97af, verdict: ok, source_url: "https://www.papercut.com/kb/Main/security-bulletin-27-aug-2026-urgent-security-advisory/", passage: "There are no emergency patches or maintenance releases for version 23 or earlier. To get to a patched build you will need to upgrade to a currently supported version line"}
  - {claim_id: 37b63e7eb9, verdict: ok, source_url: "https://www.huntress.com/blog/papercut-actively-exploited", passage: "47% of the approximately 2,500 PaperCut installations Huntress tracks are running v23 or older"}
  - {claim_id: fc4262ed0b, verdict: ok, source_url: "https://www.huntress.com/blog/papercut-actively-exploited", passage: "A second log entry of booting Derby with this irregular name includes the timestamp just before code execution and acts a very high-confidence indicator of compromise."}
  - {claim_id: d8f40c11b9, verdict: ok, source_url: "https://www.papercut.com/kb/Main/security-bulletin-27-aug-2026-urgent-security-advisory/", passage: "Note that these files may be cleaned up by the attacker as activity progresses, so their absence does not rule out compromise."}
  - {claim_id: b4650d80c9, verdict: ok, source_url: "https://www.huntress.com/blog/papercut-actively-exploited", passage: "After exploitation, the .class file deletes its own `Udydn.out` file, as well as the server's `server.log` file."}
  - {claim_id: c902325eed, verdict: ok, source_url: "https://labs.watchtowr.com/death-by-a-thousand-papercuts-papercut-pre-auth-rce-chain-and-patch-bypasses-wt-2026-0141-0144-cve-2026-82077-cve-2026-82078-cve-2026-81578/", passage: "we can navigate directly to every stage of the Setup Wizard form by accessing it through the `Home` page, even though the product has already been deployed."}
  - {claim_id: f71b867e3a, verdict: ok, source_url: "https://www.rapid7.com/blog/post/etr-papercut-ng-mf-critical-zero-day-exploited-in-the-wild/", passage: "PaperCut uses the Apache Tapestry framework, whose \"complex direct\" request format can identify one page to display and a different page containing the component to execute."}
  - {claim_id: b37b17fe62, verdict: ok, source_url: "https://www.papercut.com/kb/Main/security-bulletin-27-aug-2026-urgent-security-advisory/", passage: "This advisory applies to **all versions** of: PaperCut NG, PaperCut MF"}
  - {claim_id: ec0064c0a1, verdict: ok, source_url: "https://www.papercut.com/kb/Main/security-bulletin-27-aug-2026-urgent-security-advisory/", passage: "observed behaviour includes the `pc-app.exe` (or `pc-app`) process launching child shell processes (`cmd.exe`) and running `whoami & ver`"}
  - {claim_id: 86f8dfb7e4, verdict: ok, source_url: "https://www.rapid7.com/blog/post/etr-papercut-ng-mf-critical-zero-day-exploited-in-the-wild/", passage: "The attack uses HTTP POST requests to the following URIs ... /app?service=direct/1/Error/ConfigEditor/quickFindForm"}
  - {claim_id: 6b0ccd9260, verdict: ok, source_url: "https://www.papercut.com/kb/Main/security-bulletin-27-aug-2026-urgent-security-advisory/", passage: "Missing, unexpectedly truncated, or deleted PaperCut `server.log` files. (Huntress: the .class file deletes ... the server's `server.log` file)"}
  - {claim_id: b34bec7428, verdict: ok, source_url: "https://www.papercut.com/kb/Main/security-bulletin-27-aug-2026-urgent-security-advisory/", passage: "Take this action now, even if you have not observed suspicious activity."}
  - {claim_id: 09ac458289, verdict: ok, source_url: "https://labs.watchtowr.com/death-by-a-thousand-papercuts-papercut-pre-auth-rce-chain-and-patch-bypasses-wt-2026-0141-0144-cve-2026-82077-cve-2026-82078-cve-2026-81578/", passage: "Death By A Thousand PaperCuts (PaperCut Pre-Auth RCE Chain and Patch Bypasses WT-2026-0141-0144/CVE-2026-82077/CVE-2026-82078/CVE-2026-81578) [dated 2026-10-09]"}
  - {claim_id: f06376c606, verdict: ok, source_url: "https://labs.watchtowr.com/death-by-a-thousand-papercuts-papercut-pre-auth-rce-chain-and-patch-bypasses-wt-2026-0141-0144-cve-2026-82077-cve-2026-82078-cve-2026-81578/", passage: "PaperCut releases a new patch, 26.0.4-PO build 76530. Patch contains a fix for: WT-2026-0143 (Authentication Bypass) ... 26.0.5 ... Patch contains a fix for: WT-2026-0144/CVE-2026-82077"}
  - {claim_id: d14ddfe8a5, verdict: ok, source_url: "https://labs.watchtowr.com/death-by-a-thousand-papercuts-papercut-pre-auth-rce-chain-and-patch-bypasses-wt-2026-0141-0144-cve-2026-82077-cve-2026-82078-cve-2026-81578/", passage: "it was still possible to abuse the Setup Wizard forms, since they had been completely ignored in the patches delivered up to that point."}
  - {claim_id: 7b25c92f10, verdict: ok, source_url: "https://labs.watchtowr.com/death-by-a-thousand-papercuts-papercut-pre-auth-rce-chain-and-patch-bypasses-wt-2026-0141-0144-cve-2026-82077-cve-2026-82078-cve-2026-81578/", passage: "While the DAG does not execute the full chain, it determines exposure to the Authentication Bypass vulnerabilities we’ve discussed above."}
  - {claim_id: bbff07688d, verdict: ok, source_url: "https://www.papercut.com/kb/Main/security-bulletin-sep-2026/", passage: "allows an **authenticated** administrator to execute arbitrary commands ... Fixed in: PaperCut NG/MF **26.0.5**; **25.0.13** for the 25.x branch. | 7.3 (HIGH)"}
  - {claim_id: 6936d89bd3, verdict: ok, source_url: "https://www.papercut.com/kb/Main/security-bulletin-27-aug-2026-urgent-security-advisory/", passage: "Emergency Patch Release 3 adds further hardening that closes off additional attack vectors we have observed being exploited in the wild."}
