    surface: "body"
    kind: cited
    text: "**Triage:** the audit-log pattern separates this from a team adding a scanning workflow: no pull request, unsigned commits across many repositories, and a manual dispatch right after creation ("
    urls: ["https://www.stepsecurity.io/blog/ghostaction-returns"]
  - claim_id: a50e1109fb
    entry: 2026-10-10/ghostaction-fake-audit-workflow-git-history-credential-theft
