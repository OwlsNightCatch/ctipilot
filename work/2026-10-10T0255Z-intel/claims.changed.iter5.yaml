  - claim_id: c579f5f4cc
    entry: 2026-09-10/sap-september-2026-overpass-s4get-preauth-rce
    surface: "body"
    kind: cited
    text: "OVERPASS is a memory-corruption flaw in the SAP kernel's processing of the Extended Passport, a tracing structure attached to requests and parsed before session authentication; because the handling code is shared, the flaw is reachable via three independent unauthenticated routes: the Internet Communication Manager/Web Dispatcher (HTTP/HTTPS, Fiori/WebGUI/APIs), the SAP Dispatcher (the SAP GUI logon protocol), and RFC connections between systems, each with a single crafted request corrupting memory to reach arbitrary OS command execution as the account that owns the SAP installation ("
    urls: ["https://onapsis.com/blog/sap-overpass-remediation/", "https://cert.europa.eu/publications/security-advisories/2026-011/"]
  - claim_id: 62d75f934a
    entry: 2026-09-10/sap-september-2026-overpass-s4get-preauth-rce
    surface: "body"
    kind: cited
    text: "S4GET is a distinct logic flaw in the SAP NetWeaver Message Server (kernel lines 9.16-9.20, native to S/4HANA and S/4HANA Cloud Private Edition) reachable through the same public port every SAP GUI client connects to: a crafted packet gets an arbitrary IP address accepted as a trusted internal node, and the Message Server propagates that false trust across the cluster so the Gateway admits the attacker as internal and the attacker can invoke RFC-callable programs to reach code execution as `<sid>adm` on every application server: \"exploitation requires no credentials, no certificate, and no pre-existing misconfiguration\" ("
    urls: ["https://onapsis.com/blog/s4get-cve-2026-58240-sap-message-server-threat-advisory/"]
  - claim_id: 35f0b88936
    entry: 2026-09-10/sap-september-2026-overpass-s4get-preauth-rce
    surface: "body"
    kind: cited
    text: "Neither flaw is confirmed exploited as of publication, but Onapsis notes SAP patches have historically been reverse-engineered into working exploits within 72 hours, as happened with the RECON vulnerability (CVE-2020-6287), and that window keeps shrinking with AI-assisted tooling, while a comparable pre-auth SAP disclosure (CVE-2025-31324) became 2025's most-exploited CVE by Mandiant's count ("
    urls: ["https://onapsis.com/blog/sap-overpass-remediation/"]
  - claim_id: cc4fb3bda6
    entry: 2026-09-10/sap-september-2026-overpass-s4get-preauth-rce
    surface: "body"
    kind: cited
    text: "**Triage:** an SAP Gateway admitting a connection as internal from an IP address that is not a known application server, followed by invocations of RFC-callable programs from it, is the S4GET trust-abuse pattern Onapsis describes ("
    urls: ["https://onapsis.com/blog/s4get-cve-2026-58240-sap-message-server-threat-advisory/"]
  - claim_id: 48ea2cf115
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "actions[0]"
    kind: frontmatter
    text: "Tell the helpdesk, HR and payroll teams of every body whose staff are insured with Publica (including the federal administration and the ETH domain) that AHV number, date of birth, address and salary may now be known to criminals and must not count as proof of identity, and route requests that quote them to a call-back on a known number; for staff insured with the Bernische Pensionskasse or the Bernische Lehrerversicherungskasse apply the same rule until those funds report the scope, because the Bernische Pensionskasse says it has no indication of theft but cannot exclude it and the Bernische Lehrerversicherungskasse is still checking whether and to what extent its data is affected."
  - claim_id: aa4e234793
    entry: 2026-10-10/ghostaction-fake-audit-workflow-git-history-credential-theft
    surface: "actions[0]"
    kind: frontmatter
    text: "Run an organisation-scoped GitHub code search in every organisation your teams and suppliers administer for workflow files under .github/workflows that present themselves as a security audit or an Actions security workflow and were added since 2026-08-31; any hit means assume breach: revoke the credential that committed it and rotate every secret found anywhere in the repository's git history, not only the configured Actions secrets."
  - claim_id: 424f4a7693
    entry: 2026-10-10/ghostaction-fake-audit-workflow-git-history-credential-theft
    surface: "body"
    kind: cited
    text: "**Exposure:** any GitHub account whose token or session credential has leaked, and every repository it can write to; StepSecurity says a workflow posing as a security audit or an Actions security workflow that appeared in a repository you maintain since 2026-08-31 means treat it as a confirmed breach ("
    urls: ["https://www.stepsecurity.io/blog/ghostaction-returns"]
  - claim_id: 751623a1d0
    entry: 2026-10-10/ghostaction-fake-audit-workflow-git-history-credential-theft
    surface: "body"
    kind: cited
    text: "**Detection:** source-control audit logs: workflow files added straight to default branches without a pull request by a maintainer identity, unsigned commits landing in many repositories within minutes; an organisation-scoped code search with StepSecurity's published content-marker queries for workflow files presented as security audits or Actions security workflows; runner egress logs: an HTTP POST to a bare IP address with no preceding DNS lookup ("
    urls: ["https://www.stepsecurity.io/blog/ghostaction-returns"]
