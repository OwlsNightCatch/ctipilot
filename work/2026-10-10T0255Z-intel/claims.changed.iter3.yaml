  - claim_id: 11e5a2a2e2
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "record 2026-10-10T03:46:27Z"
    kind: record-summary
    text: "watchTowr published on 2026-10-09 how the emergency patches were bypassed in turn: the 28 August emergency build could still be taken without authentication through the Setup Wizard forms, and a new administrator-only Scan-to-Fax code-execution flaw, CVE-2026-82077, is fixed only in 26.0.5 and 25.0.13, not in the emergency builds. No source names exploitation of either, though PaperCut says Emergency Patch Release 3 closes off further attack vectors it has seen exploited. Priority moves from critical to high: the exploitation wave PaperCut describes has slowed and the patches are weeks old, so the entry no longer meets the stop-and-act bar. Earlier statements the cited sources do not support were corrected where they stood: the 2023 precedent, the university-customer statement, the emergency-patch chronology and the detection wording."
  - claim_id: 491d7ca20d
    entry: 2026-09-10/sap-september-2026-overpass-s4get-preauth-rce
    surface: "record 2026-10-10T03:47:22Z"
    kind: record-summary
    text: "An open-source SAP exploitation toolkit, SAPMAP, publicly released on 2026-09-15, carries proof-of-concept exploits for both flaws, including OVERPASS exploits that the maintainers first said they were withholding. Onapsis had not observed attackers using it when it wrote, and no exploitation is reported. The OVERPASS routes were re-cited to Onapsis and an unsupported discriminator in the triage line was removed."
  - claim_id: 5ec7ff8ea6
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "actions[0]"
    kind: frontmatter
    text: "Copy the application and network logs of every self-hosted Zammad instance, then upgrade it to Zammad 7.2.2 (6.5 and older receive no security fixes, and 7.2.0 is affected by the 27 advisories Zammad published on 2026-10-06) or take it offline if it cannot be upgraded."
  - claim_id: d7f3609240
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "actions[1]"
    kind: frontmatter
    text: "On every instance that was internet-reachable on 6.3.0 to 6.5.4 since 2026-09-21, run DIVD's log-check script and look for packages installed through the admin interface that you did not install and for a mail view template that overrides the built-in password-reset email, the route Horizon3's public exploit takes; on a DEB or RPM install where code ran as the zammad account, also treat the host as possibly root-compromised, because Zammad's advisory says an attacker with that foothold could have escalated to root within seconds, and look for root-owned files, services and processes you did not create."
