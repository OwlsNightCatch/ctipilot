    text: "**Detection:** source-control audit logs: workflow files added straight to default branches without a pull request by a maintainer identity, unsigned commits landing in many repositories within minutes; an organisation-scoped code search with StepSecurity's published content-marker queries, and a check of your repositories for workflow files presented as security audits; runner egress logs: an HTTP POST to a bare IP address with no preceding DNS lookup ("
    urls: ["https://www.stepsecurity.io/blog/ghostaction-returns"]
