  - claim_id: fa2cf5af87
    entry: 2026-10-10/ahsaycbs-cve-2026-105133-105134-exploited-webshells-xmrig
    surface: "body"
    kind: derived
    text: "**Detection:** process-creation telemetry with parent lineage: children of the AhsayCBS service process outside its normal startup and maintenance commands, because commands from an uploaded JSP webshell appear as direct children of the service, and curl or certutil from that lineage writing into a Temp folder; service inventory: a service named like the Edge update service running an Edge-named binary from a Temp folder as SYSTEM; PowerShell script-block logs: a script that checks for Task Manager and stops or starts a service to match; command lines that name WinRing0 next to a URL; and new .jsp files in the application directory."
  - claim_id: f071a5d911
    entry: 2026-10-10/ghostaction-fake-audit-workflow-git-history-credential-theft
    surface: "actions[0]"
    kind: frontmatter
    text: "Run an organisation-scoped GitHub code search in every organisation your teams and suppliers administer for workflow files under .github/workflows that present themselves as a security audit and were added since 2026-08-31; any hit means assume breach: revoke the credential that committed it and rotate every secret found anywhere in the repository's git history, not only the configured Actions secrets."
  - claim_id: 6606a25eb4
    entry: 2026-10-10/ghostaction-fake-audit-workflow-git-history-credential-theft
    surface: "body"
    kind: cited
    text: "StepSecurity reports that on 2026-10-08 the GhostAction GitHub Actions credential-theft campaign used the accounts of two open-source maintainers to push a workflow disguised as a security improvement to 345 repositories in two automated sweeps lasting minutes, among them an Uber-owned repository that one maintainer could still write to ("
    urls: ["https://www.stepsecurity.io/blog/ghostaction-returns"]
  - claim_id: 4f9c23e469
    entry: 2026-10-10/ghostaction-fake-audit-workflow-git-history-credential-theft
    surface: "body"
    kind: cited
    text: "The operator holds a maintainer's GitHub credential, which StepSecurity assesses as most plausibly a personal access token leaked through infostealer logs or credential dumps, then commits a workflow titled to look like a security audit straight to the default branch under the victim's own identity, unsigned and without a pull request; that push runs it, and nothing in an audit log looks anomalous unless the content is read ("
    urls: ["https://www.stepsecurity.io/blog/ghostaction-returns"]
  - claim_id: 85745ddd41
    entry: 2026-10-10/ghostaction-fake-audit-workflow-git-history-credential-theft
    surface: "body"
    kind: cited
    text: "**Exposure:** any GitHub account whose token or session credential has leaked, and every repository it can write to; StepSecurity says a workflow disguised as a security audit that appeared in a repository you maintain since 2026-08-31 means treat it as a confirmed breach ("
    urls: ["https://www.stepsecurity.io/blog/ghostaction-returns"]
  - claim_id: df5baad9d9
    entry: 2026-10-10/ghostaction-fake-audit-workflow-git-history-credential-theft
