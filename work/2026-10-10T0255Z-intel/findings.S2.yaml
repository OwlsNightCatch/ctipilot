  - title: "SAPMAP: an open-source SAP exploitation toolkit published 2026-09-15 carries proof-of-concept code for the September SAP pre-auth flaws OVERPASS (CVE-2026-44756) and S4GET (CVE-2026-58240); Swiss SOC provider Senthorus reassesses the patch timetable"
    sources:
      - { url: "https://blog.senthorus.ch/posts/sapmap_threat_assessment/", publisher: "Senthorus SOC Research Blog", date: "2026-10-06", role: "primary" }
      - { url: "https://onapsis.com/blog/sapmap/", publisher: "Onapsis Research Labs", date: "2026-09-24", role: "primary" }
    discovery_trace: "first seen at: senthorus-ch, URL https://blog.senthorus.ch/ (extract; newest post, page date 2026-10-06) -> https://blog.senthorus.ch/posts/sapmap_threat_assessment/ (hrefs read with url --direct; WebFetch rewrites them to a non-resolving host) -> primary for the toolkit: Onapsis, URL https://onapsis.com/blog/sapmap/ (linked from the Senthorus post)"
    summary: |
      Update-shaped development on the covered SAP September Patch Day entry (OVERPASS CVE-2026-44756, CVSS 10.0, SAP Note 3747649; S4GET CVE-2026-58240, CVSS 9.8, SAP Note 3759472),
      which still says neither flaw is exploited and that reverse-engineering of patches is expected. Onapsis says that on 15 September a group of researchers publicly released SAPMAP,
      an open-source (GPL 3.0) SAP discovery and exploitation toolkit with proof-of-concept exploits for those two flaws, plus ten standalone pre-authentication exploit files, post-authentication,
      lateral-movement and Windows privilege-escalation modules, an SAP ransomware proof of concept and a one-click chained "scan, exploit, enrich, propagate" loop (the toolkit was originally gated before it went public on GitHub), and that, as of its article, it had not
      observed threat actors using SAPMAP "yet". Senthorus (2026-10-06, public information reviewed that day) relays that Onapsis found OVERPASS-related code in the repository history despite an initial indication that it was being withheld, gives its own
      assessment that packaging the capabilities could reduce the preparation an intrusion needs, separates that from evidence of use (none reported), lists the S4GET kernel releases 9.16, 9.18, 9.19 and 9.20 from SAP's bulletin, and recommends
      an owner / kernel build / security note / reachable-networks inventory shared by SOC and SAP team. No in-the-wild exploitation report was found in a search on 2026-10-10.
    region_nexus: "global; Swiss relevance is indirect (Swiss SOC provider's assessment; the sources name no Swiss public-sector SAP estate)"
    primary_sector_nexus: "indirect: ERP/finance/HR estates run on SAP in public administrations; the existing entry already carries sector public-sector"
