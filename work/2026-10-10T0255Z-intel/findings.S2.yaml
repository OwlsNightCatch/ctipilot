    summary: |
      Delta on the already-covered Publica / PK Softech incident: the supplier's customer base is now named and it includes
      cantonal-level public-law institutions. The Bernische Pensionskasse (BPK) states, in a notice dated 2026-10-09, that an external
      software supplier of the BPK suffered a cyber incident at the end of September 2026 and that this is "the same company that also supplies
      the federal pension fund Publica"; the supplier filed a criminal complaint and informed the relevant federal offices and affected
      customers, the BPK among them; various federal offices are clarifying with the supplier which data is affected and the Federal
      Prosecutor's Office has opened an investigation. The BPK says there are currently no indications that BPK data was stolen but that this
      cannot be excluded entirely, that it is in contact with the supplier and the relevant cantonal authorities, and that insured persons are
      being informed. Netzwoche reports that the BPK insures, among others, canton of Bern staff and the personnel of the three cantonal
      universities (42,145 active insured and 18,321 pensioners at 2025-12-31). The Bernische Lehrerversicherungskasse (BLVK, 21,417 active
      insured per Netzwoche) published a notice (PDF file dated 2026-10-08) that its external software supplier was hit at the end of September, that
      the supplier took the affected environment off the network, brought in external specialists, informed the authorities and filed a criminal
      complaint, and that supplier and BLVK are still checking whether and to what extent BLVK data is affected; it does not name the supplier.
      Pensionskasse Post (a private-law foundation for Swiss Post staff) names PK Softech, says it buys software for administering insured
      persons' data from it, that whether and which data left is under review, and (its own claim, not independently verified) that its data at
      PK Softech is anonymised and that particularly sensitive personal data such as IV files is not stored there. Inside IT, working from AWP, lists the
      BLVK, BPK, Migros-Pensionskasse, Pensionskasse Post and Syngenta Pensionskasse as customers of the manufacturer and says the funds have
      reported to the authorities and filed criminal complaints; Netzwoche adds that PK Softech's site (and archived pages from last year) mention
      both Bernese funds. Still not public in any source read: the access vector, the actor, which data left, and the full customer list; PK Softech itself says
      it must be assumed data left its systems and that it has been fully available to customers again since 2 October.
    region_nexus: "Switzerland: federal (Publica, already covered) and canton of Bern (BPK, BLVK) public-law pension institutions; Pensionskasse Post is Swiss Post staff (Confederation-owned employer)"
    primary_sector_nexus: "direct: cantonal staff, cantonal universities' personnel and Bernese teachers are insured with the two named funds; a software supplier to the public-sector pension layer"
