    cves: [CVE-2026-44756, CVE-2026-58240]
    techniques: [T1190, T1210]
    affected_products: ["SAP NetWeaver Application Server ABAP", "SAP Kernel", "SAP NetWeaver Message Server"]
    entity_keys: []
    new_entities:
      - { key: "tool:sapmap", type: tool, name: "SAPMAP", aliases: ["SAP exploitation toolkit SAPMAP"],
          summary: "Open-source SAP discovery and exploitation toolkit publicly released on 2026-09-15 that includes proof-of-concept exploits for the September 2026 SAP flaws OVERPASS (CVE-2026-44756) and S4GET (CVE-2026-58240), SAP ransomware PoCs and a chained automation loop; Onapsis had not observed active use at the time of its analysis (Onapsis, 2026-09-24)." }
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: "update-of:2026-09-10/sap-september-2026-overpass-s4get-preauth-rce"
