    discovery_trace: "first seen at: inside-it-ch, URL https://www.inside-it.ch/cybervorfall-bei-online-auktionshaus-ricardo-20261009 (rss.xml 2026-10-09 13:20Z) -> corroborating: srf-news feed item https://www.srf.ch/news/schweiz/online-marktplatz-gehackt-keine-erpressung-ricardo-meldet-datenleck-bei-890-000-konten -> primary: SMG media-release listing https://swissmarketplace.group/media-releases/ (title 'Ricardo fixes security vulnerability affecting user data', 2026-10-09), href found with url --direct -> https://swissmarketplace.group/media-release/ricardo-fixes-security-vulnerability/"
    summary: |
      Ricardo, the Swiss online marketplace run by SMG Swiss Marketplace Group, says it detected suspicious activity on its servers on 2026-10-07, closed
      the security vulnerability that allowed the access, and established that personal data relating to about 890,000 user accounts was exposed: names,
      postal addresses and telephone numbers, plus company names for business users; e-mail addresses and passwords were not affected. Ricardo is
      informing the affected users, has notified the Federal Data Protection and Information Commissioner (FDPIC), will file a criminal complaint and report the incident to the
      National Cyber Security Centre (BACS). According to SRF/AWP the SMG spokesperson says the data was at no time freely accessible, that there has been neither extortion nor a ransom demand so far, and
      that no unauthorised access to personal data linked to orders was found; the company's own release and Netzwoche, however, open with "unauthorised access to personal data linked to orders", so the sources
      differ on that point. The vulnerability class, the access path and the actor are not named by any source.
    region_nexus: "Switzerland (Swiss consumer marketplace; the release does not give a per-country split)"
    primary_sector_nexus: "indirect at most: private-sector consumer platform; exposed attributes (name, postal address, telephone number) are the ones used for post, callback and SMS/WhatsApp lures against Swiss residents, public-sector staff included"
    sector: "retail"
