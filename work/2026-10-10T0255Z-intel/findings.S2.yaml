    extended_notes: |
      Facts vs claims vs inferences. Facts (first-party): BPK says its supplier is the one that serves Publica; BLVK and PK Post confirm they are affected as
      customers; Publica/Confederation and PK Softech statements are already in the existing entry. Claims: BPK and BLVK "no indications / under review"
      statements and PK Post's "anonymised, no particularly sensitive data" statement are the funds' own and not independently verified; the supplier itself
      says data must be presumed to have left. Inference (Netzwoche): the supplier behind the BLVK/BPK notices is PK Softech, which the BPK's own wording ("same company that supplies Publica")
      supports.
      Suggested wording changes for the existing entry: the sentence that the supplier "informed its other customers, whom the sources do not name" can now name
      BPK, BLVK, Pensionskasse Post, Migros-Pensionskasse and Syngenta Pensionskasse (the last two via Inside IT only; neither fund's own notice was found). Region stays Switzerland;
      add canton of Bern as a nexus. Headline unchanged. Existing T1199 mapping holds (no vector named by any source).
      Exposure (for the composer): organisations whose pension administration, HR or payroll data sits with PK Softech (the supplier's site lists a core system PK/S plus PK/S.Live,
      PK/S.Open, PK/S.FZ - none of which any source names as the intrusion path) and bodies whose staff are insured in a fund that runs it; confirmed customers are in the list above.
      A body that is neither named nor notified cannot conclude it is unaffected from these notices (the Confederation says it informed customers; the other customers are not all named).
      Detection: no new IOC-class material in any source. The BLVK notice asks members to stay careful with unusual calls or messages and to hand over no personal details, passwords or codes
      to unknown callers or senders; telemetry to watch is unchanged from the existing entry (mail-gateway and helpdesk/HR/payroll contact records quoting AHV number, salary or partner data).
      Defender takeaway: a "no indications" statement from a fund is not an all-clear while the supplier says data left; ask the supplier in writing, in the same terms as the existing entry's action.
      Windows: BPK notice dated 09.10.2026 (in window); BLVK file dated 2026-10-08 (outside the 26 h window but the same story, used only as the primary for the BLVK statement).
