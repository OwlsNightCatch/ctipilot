        attribution: "SMG Swiss Marketplace Group"
        source_url: "https://swissmarketplace.group/media-release/ricardo-fixes-security-vulnerability/"
      - quote: "The exposed data was limited to names, postal addresses and telephone numbers and, for business users, company names."
        attribution: "SMG Swiss Marketplace Group"
        source_url: "https://swissmarketplace.group/media-release/ricardo-fixes-security-vulnerability/"
      - quote: "Auch habe der Cyberangriff bislang weder eine Erpressung noch Lösegeldforderungen zur Folge gehabt, so die Sprecherin."
        original: "Auch habe der Cyberangriff bislang weder eine Erpressung noch Lösegeldforderungen zur Folge gehabt, so die Sprecherin."
        attribution: "SRF"
        source_url: "https://www.srf.ch/news/schweiz/online-marktplatz-gehackt-keine-erpressung-ricardo-meldet-datenleck-bei-890-000-konten"
    extended_notes: |
      Return as a borderline item only. T1190 is the composer's call: the release says only that a "security vulnerability" on the servers allowed the access; no source says the flaw was in an internet-facing service.
      If the main agent keeps it, the lessons are limited to: (a) a Swiss consumer platform that notified the FDPIC within two days of detection and announced a BACS report, (b) the same attribute set (name, postal address, phone) that
      the BACS weekly reviews flag as raw material for callback fraud, (c) SMG's own advice to treat unexpected post, calls, SMS and WhatsApp messages asking for card, bank or TWINT log-ins with care.
    borderline: true
