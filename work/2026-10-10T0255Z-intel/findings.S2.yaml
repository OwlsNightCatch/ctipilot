    reason: "consilium.europa.eu pages (sanctions-against-cyber-attacks, timeline) return HTTP 403 on direct, trafilatura, jina and WebFetch on 2026-10-10; only search snippets reach it. Recipe missing for the EU cyber-sanctions watch."
  - source_id: blvk.ch (BLVK) and be.ch
    reason: "direct egress to blvk.ch resets the connection (pdf and url --direct fail); WebFetch reads the homepage and the PDF binary, and the PDF text can then be read from the path WebFetch prints with pdftotext. extract on blvk.ch silently fell to jina (credit spent). be.ch media-release listing URL returns 404, so the canton of Bern's own release was not found."
  - source_id: swisspost-cybersecurity
    reason: "listing is raw HTML with no dates and only promotional posts (Swiss Threat Landscape report 2026-06-23 newest substantive); nothing in the 96 h horizon."
  - source_id: scip-ch
    reason: "RECIPE UPDATE: the record has rss_url null and fetch_method webfetch, but the page head advertises https://www.scip.ch/?rss.labs and `feed https://www.scip.ch/?rss.labs 8` parses on the direct transport with dated items (newest 2026-10-08, then 2026-09-30, 2026-09-10); `extract https://www.scip.ch/?labs.<YYYYMMDD>` reads the article. Suggest fetch_method rss."
  - source_id: ncsc-ie
    reason: "RECIPE NOTE: `extract https://www.ncsc.gov.ie/news/` returns the dated advisory list with CVE ids (newest 09-10-2026); the page also advertises RSS and Atom links. Current record says webfetch."
  - source_id: netzwoche / ictjournal-ch
    reason: "(outside the S2 slice, used as gap-fill) both RSS feeds read on the direct transport (netzwoche https://www.netzwoche.ch/rss.xml 20 items newest 2026-10-09T16:37; ictjournal https://www.ictjournal.ch/rss.xml 20 items, some sponsored items carry future dates 2026-10-12). Netzwoche's PK Softech article is edited in place (URL keeps the 2026-10-08 slug, title changes), so poll it for updates."
  - source_id: presseportal-ch
    reason: "probe only: Swiss ots wire (carried the SRG statement) has RSS feeds (https://www.presseportal.ch/de/rss/st/IT.rss2?langid=1 etc.); the IT topic feed is mostly marketing, so not proposed as a candidate."
  - source_id: bacs-press
    reason: "quiet window, not a failure: `url https://www.bacs.admin.ch/de/medienmitteilungen` returns dated cards (newest 2026-10-01, Cyber Security Month); `extract https://www.bacs.admin.ch/de/im-fokus` lists the weekly reviews (week 40 published 2026-10-06; week 41 expected Tuesday 2026-10-13); the incidents page is undated and unchanged."
