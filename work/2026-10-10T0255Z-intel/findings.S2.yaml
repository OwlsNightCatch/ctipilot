        attribution: "Onapsis Research Labs"
        source_url: "https://onapsis.com/blog/sapmap/"
      - quote: "This toolkit contains multiple exploits for various known SAP vulnerabilities and offensive security capabilities for targeting SAP systems, also including proof-of-concept (PoC) exploits for critical SAP vulnerabilities patched by SAP earlier this month."
        attribution: "Onapsis Research Labs"
        source_url: "https://onapsis.com/blog/sapmap/"
      - quote: "At publication, Onapsis said it had not observed threat actors actively using SAPMAP."
        attribution: "Senthorus"
        source_url: "https://blog.senthorus.ch/posts/sapmap_threat_assessment/"
    extended_notes: |
      Overlap with S1: this is an exploit-availability delta on an entry S1 already owns; S1's own sweep may carry it with better exploitation evidence. Timing caveat: the toolkit is 25 days old; the Senthorus
      post (page date 2026-10-06, 00:00Z, public information "reviewed on October 6th") sits at the edge of the record's 96 h lookback and the Onapsis page is dated 2026-09-24. Nothing here is new exploitation.
      Defender angle (from the sources): the exposure question is which source networks can reach SAP HTTP(S), dispatcher (SAP GUI) and RFC services, and what a compromised workstation or partner link could reach;
      S4GET is a trust-establishment flaw, so tightening user authorisations does not repair it; kernel build and security-note status decide affected versus unaffected, not the "S/4HANA" product label.
    borderline: true
    borderline_reason: "overlaps S1's remit and the existing entry; the delta (public PoC toolkit) is real but 25 days old, no exploitation reported, and the freshest source is at the lookback edge"
