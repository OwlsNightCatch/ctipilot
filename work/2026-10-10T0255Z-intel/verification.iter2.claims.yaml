claims:
  - {claim_id: 6c30bebe80, verdict: ok, source_url: "https://www.greynoise.io/blog/ai-orchestrated-campaign-against-papercut-ng-mf", passage: "compromise at least 440 instances of PaperCut MF/NG hosted by 395 identified victim organizations in 48 countries; fastest domain admin five minutes; bulletin: 'applies to all versions'; watchTowr/Sep"}
  - {claim_id: ff68d1afa8, verdict: ok, source_url: "https://www.papercut.com/kb/Main/security-bulletin-27-aug-2026-urgent-security-advisory/", passage: "EPR3 FAQ: 'If you are on Release 1 or 2, upgrade now'; EPR3 'protected against the issues'; Sep bulletin: 82077 fixed in 26.0.5/25.0.13, no 24.x release named; v23: no patch"}
  - {claim_id: d02c5fb466, verdict: ok, source_url: "https://www.papercut.com/kb/Main/security-bulletin-sep-2026/", passage: "CVE-2026-82077 'Fixed in: 26.0.5; 25.0.13 for the 25.x branch'; Aug bulletin lists 26.0.5, 25.0.13, 24.1.10 for the two exploited CVEs; watchTowr: 1 Sept patch fixes WT-2026-0143 only"}
  - {claim_id: 5deb5971b9, verdict: ok, source_url: "https://www.papercut.com/kb/Main/security-bulletin-27-aug-2026-urgent-security-advisory/", passage: "'Windows Service \"Remote Access Service\" installed (SimpleHelp agent ... SimpleService.exe'; 'unexpected AnyDesk installations'; Huntress: Booting Derby ... internal\\pwn"}
  - {claim_id: bda9d876e0, verdict: F14, source_url: "https://www.greynoise.io/blog/ai-orchestrated-campaign-against-papercut-ng-mf", passage: "GreyNoise: fastest domain admin 'five minutes and the longest time was 144 minutes'; 'multiple-day delays between initial access and ... domain admin'; action says 'within minutes of initial compromis"}
  - {claim_id: 4a2c31dc1f, verdict: ok, source_url: "https://www.papercut.com/kb/Main/security-bulletin-27-aug-2026-urgent-security-advisory/", passage: "CVE-2026-81578 8.8 (HIGH) CVSS:4.0; maintenance releases 26.0.5, 25.0.13, 24.1.10 replace emergency patches; v23: no releases (EPR3 base versions not restated on the live page; watchTowr: 26.0.4-PO bu"}
  - {claim_id: 225f3d2a56, verdict: ok, source_url: "https://www.papercut.com/kb/Main/security-bulletin-27-aug-2026-urgent-security-advisory/", passage: "CVE-2026-82078 9.4 (CRITICAL) CVSS:4.0 PR:H; same fixed-in text as CVE-2026-81578"}
  - {claim_id: 20c268438b, verdict: ok, source_url: "https://www.papercut.com/kb/Main/security-bulletin-sep-2026/", passage: "CVE-2026-82077 7.3 (HIGH) CVSS:4.0 E:P; 'authenticated administrator'; Fixed in 26.0.5; 25.0.13; bulletin names no 24.x release; CVE record: <25.0.13, 26.0.0-<26.0.5"}
  - {claim_id: 69f8c5e55b, verdict: ok, source_url: "https://www.rapid7.com/blog/post/etr-papercut-ng-mf-critical-zero-day-exploited-in-the-wild/", passage: "PaperCut has been targeted in the past; in 2023, CVE-2023-27350 was broadly exploited in the wild by multiple threat-actor groups, including ransomware operators. This prior history increases the urge"}
  - {claim_id: b391a6dffe, verdict: ok, source_url: "https://labs.watchtowr.com/death-by-a-thousand-papercuts-papercut-pre-auth-rce-chain-and-patch-bypasses-wt-2026-0141-0144-cve-2026-82077-cve-2026-82078-cve-2026-81578/", passage: "27 August 2026 PaperCut publishes an advisory ... exploited in-the-wild; 'At this time, no CVEs were assigned, and only IOCs were published (no vulnerability details, no patch was available)'"}
  - {claim_id: acafea0f07, verdict: ok, source_url: "https://www.rapid7.com/blog/post/etr-papercut-ng-mf-critical-zero-day-exploited-in-the-wild/", passage: "information supplied by a university customer's security team and digital forensics and incident response team enabled its security response team to reproduce the vulnerability"}
  - {claim_id: 5fd7186016, verdict: ok, source_url: "https://www.rapid7.com/blog/post/etr-papercut-ng-mf-critical-zero-day-exploited-in-the-wild/", passage: "Tapestry 'complex direct' ... PaperCut validates access only to the displayed page. By selecting either the public Error page or Exception page ... (Home page for the first emergency patch)"}
  - {claim_id: 2f444ec8f9, verdict: ok, source_url: "https://www.rapid7.com/blog/post/etr-papercut-ng-mf-critical-zero-day-exploited-in-the-wild/", passage: "three POST URIs /app?service=direct/1/Error/ConfigEditor/quickFindForm, $Form, UserList/$QuickFind.$Form; four settings user-lookup.db-driver/db-url/id-to-username-sql/enabled"}
  - {claim_id: 333994c528, verdict: ok, source_url: "https://www.rapid7.com/blog/post/etr-papercut-ng-mf-critical-zero-day-exploited-in-the-wild/", passage: "Derby CALL ... foreignViews opens an attacker-controlled H2 JDBC URL; inline INIT creates a JavaScript-backed trigger; Nashorn starts an operating-system process; UserList search activates the lookup"}
  - {claim_id: 73c5d03654, verdict: ok, source_url: "https://www.papercut.com/kb/Main/security-bulletin-27-aug-2026-urgent-security-advisory/", passage: "CVE-2026-82078 CWE-470 unsafe reflection ... execute arbitrary Java bytecode; CVE-2026-81578 CWE-306 Missing authentication ... modify certain system configurations"}
  - {claim_id: 00bee77116, verdict: ok, source_url: "https://www.huntress.com/blog/papercut-actively-exploited", passage: "incident on August 26 lasted under two minutes, version 25.0.10.75465; second on August 27, MF 24.1.5.71847, exploited before Emergency Patch Release 2 was publicly available"}
  - {claim_id: bb7847dc91, verdict: ok, source_url: "https://www.huntress.com/blog/papercut-actively-exploited", passage: "base64 d2hvYW1pICYgdmVy = whoami & ver; ...tasklist variant; .class deletes its own Udydn.out and the server's server.log; OS-agnostic .class"}
  - {claim_id: 4e97a48625, verdict: ok, source_url: "https://www.huntress.com/blog/papercut-actively-exploited", passage: "Huntress recreated a working proof of concept ... observable charmap.exe process running as SYSTEM spawned under the pc-app.exe PaperCut Application Server"}
  - {claim_id: 0e1508796d, verdict: ok, source_url: "https://www.rapid7.com/blog/post/etr-papercut-ng-mf-critical-zero-day-exploited-in-the-wild/", passage: "emergency patches released 28 August 02:10 AEST for v25/v26, later the same day for v24; first emergency patch could be bypassed using the Home page, newest patch remediates"}
  - {claim_id: 26182ef731, verdict: ok, source_url: "https://www.papercut.com/kb/Main/security-bulletin-27-aug-2026-urgent-security-advisory/", passage: "Release 3 published 1 Sept supersedes earlier; 'These releases replace the emergency patches' (maintenance releases 10 Sept)"}
  - {claim_id: 593c212987, verdict: F3, source_url: "https://www.huntress.com/blog/papercut-actively-exploited", passage: "Huntress: '47% of the approximately 2,500 ... v23 or older, for which no patch is currently available' (28 Aug); the 'PaperCut's guidance ... upgrade to a supported version' clause is in PaperCut's bu"}
  - {claim_id: fc4262ed0b, verdict: ok, source_url: "https://www.huntress.com/blog/papercut-actively-exploited", passage: "server.log line DB URL: jdbc:derby:memory:pwn; derby.log 'Booting Derby version ... memory:C:\\Program Files\\PaperCut MF\\server\\data\\internal\\pwn'"}
  - {claim_id: d8f40c11b9, verdict: ok, source_url: "https://www.papercut.com/kb/Main/security-bulletin-27-aug-2026-urgent-security-advisory/", passage: "'Note that these files may be cleaned up by the attacker as activity progresses, so their absence does not rule out compromise.'"}
  - {claim_id: b4650d80c9, verdict: ok, source_url: "https://www.huntress.com/blog/papercut-actively-exploited", passage: "'the .class file deletes its own Udydn.out file, as well as the server's server.log file'"}
  - {claim_id: c902325eed, verdict: ok, source_url: "https://labs.watchtowr.com/death-by-a-thousand-papercuts-papercut-pre-auth-rce-chain-and-patch-bypasses-wt-2026-0141-0144-cve-2026-82077-cve-2026-82078-cve-2026-81578/", passage: "'/app?service=direct/1/Home/SetupAdmin/$Form' reaches setup pages pre-auth via Home even though system.setup-completed is true"}
  - {claim_id: f71b867e3a, verdict: ok, source_url: "https://www.rapid7.com/blog/post/etr-papercut-ng-mf-critical-zero-day-exploited-in-the-wild/", passage: "PaperCut uses the Apache Tapestry framework, whose 'complex direct' request format can identify one page to display and a different page containing the component to execute (same paragraph cites Rapid"}
  - {claim_id: b37b17fe62, verdict: ok, source_url: "https://www.huntress.com/blog/papercut-actively-exploited", passage: "'PaperCut currently treats all NG and MF versions as potentially affected'; bulletin: 'This advisory applies to all versions'"}
  - {claim_id: ec0064c0a1, verdict: ok, source_url: "https://www.huntress.com/blog/papercut-actively-exploited", passage: "Preserve evidence: 'Endpoint process trees where the parent execution originates from pc-app.exe'; 'pc-app.exe or Java process spawning command shells or system-discovery utilities'"}
  - {claim_id: 86f8dfb7e4, verdict: ok, source_url: "https://www.rapid7.com/blog/post/etr-papercut-ng-mf-critical-zero-day-exploited-in-the-wild/", passage: "URIs /app?service=direct/1/Error/..., 'the Error path segment may also be the Exception or Home path segment'"}
  - {claim_id: 7c5f0b1093, verdict: ok, source_url: "https://www.papercut.com/kb/Main/security-bulletin-27-aug-2026-urgent-security-advisory/", passage: "IOC list: 'Missing, unexpectedly truncated, or deleted PaperCut server.log files'; Huntress: payload deletes server.log (analytic framing as 'high-confidence' is the entry's own)"}
  - {claim_id: b34bec7428, verdict: ok, source_url: "https://www.papercut.com/kb/Main/security-bulletin-27-aug-2026-urgent-security-advisory/", passage: "'These releases replace the emergency patches ... If you have not yet patched, upgrade now'; 'restrict web access to ... trusted addresses only' (derived takeaway)"}
  - {claim_id: 09ac458289, verdict: ok, source_url: "https://labs.watchtowr.com/death-by-a-thousand-papercuts-papercut-pre-auth-rce-chain-and-patch-bypasses-wt-2026-0141-0144-cve-2026-82077-cve-2026-82078-cve-2026-81578/", passage: "watchTowr Labs post dated 2026-10-09 walks the patch bypasses build by build"}
  - {claim_id: f06376c606, verdict: ok, source_url: "https://labs.watchtowr.com/death-by-a-thousand-papercuts-papercut-pre-auth-rce-chain-and-patch-bypasses-wt-2026-0141-0144-cve-2026-82077-cve-2026-82078-cve-2026-81578/", passage: "build 76508 fixes WT-2026-0141/0142; WT-2026-0143 bypass; WT-2026-0144 now CVE-2026-82077; 1 Sept build 76530 fixes WT-2026-0143; 10 Sept 26.0.5 fixes CVE-2026-82077"}
  - {claim_id: d14ddfe8a5, verdict: ok, source_url: "https://labs.watchtowr.com/death-by-a-thousand-papercuts-papercut-pre-auth-rce-chain-and-patch-bypasses-wt-2026-0141-0144-cve-2026-82077-cve-2026-82078-cve-2026-81578/", passage: "setup pages ignored by patches; 'we can navigate directly to every stage of the Setup Wizard form by accessing it through the Home page'; SetupAdmin changes the admin password"}
  - {claim_id: 7b25c92f10, verdict: ok, source_url: "https://labs.watchtowr.com/death-by-a-thousand-papercuts-papercut-pre-auth-rce-chain-and-patch-bypasses-wt-2026-0141-0144-cve-2026-82077-cve-2026-82078-cve-2026-81578/", passage: "'While the DAG does not execute the full chain, it determines exposure to the Authentication Bypass vulnerabilities'"}
  - {claim_id: bbff07688d, verdict: ok, source_url: "https://www.papercut.com/kb/Main/security-bulletin-sep-2026/", passage: "CVE-2026-82077 RCE via Scan2Fax, authenticated administrator, 7.3 (HIGH), Fixed in 26.0.5; 25.0.13; 'If you have already upgraded to the latest release ... already addressed'"}
  - {claim_id: 6936d89bd3, verdict: ok, source_url: "https://www.papercut.com/kb/Main/security-bulletin-27-aug-2026-urgent-security-advisory/", passage: "FAQ (superseded): 'Emergency Patch Release 3 adds further hardening that closes off additional attack vectors we have observed being exploited in the wild.'"}
  - {claim_id: 060557130b, verdict: ok, source_url: "https://labs.watchtowr.com/death-by-a-thousand-papercuts-papercut-pre-auth-rce-chain-and-patch-bypasses-wt-2026-0141-0144-cve-2026-82077-cve-2026-82078-cve-2026-81578/", passage: "1 Sept build 76530 'Patch contains a fix for: WT-2026-0143'; 10 Sept 26.0.5 'fix for WT-2026-0144/CVE-2026-82077'; bulletin: 82077 needs authenticated administrator"}
  - {claim_id: 06ab480dba, verdict: ok, source_url: "https://www.papercut.com/kb/Main/security-bulletin-sep-2026/", passage: "Sep bulletin FAQ: 'We have no evidence that any of these issues have been exploited'; watchTowr shows no in-the-wild use of WT-2026-0143/82077"}
  - {claim_id: a06f967aad, verdict: ok, source_url: "https://labs.watchtowr.com/death-by-a-thousand-papercuts-papercut-pre-auth-rce-chain-and-patch-bypasses-wt-2026-0141-0144-cve-2026-82077-cve-2026-82078-cve-2026-81578/", passage: "record summary matches the section: build 76508 bypass via Setup Wizard, CVE-2026-82077 fixed in 26.0.5/25.0.13; EPR3 FAQ sentence on exploited vectors"}
  - {claim_id: b85b53d955, verdict: ok, source_url: "https://onapsis.com/blog/sapmap/", passage: "10,000 IPs (OVERPASS page); SAPMAP released Sept 15 with PoCs for OVERPASS and S4GET; CERT-EU: CVE-2026-44756 10.0, CVE-2026-58240 9.8; no exploitation observed"}
  - {claim_id: 2b52329a64, verdict: ok, source_url: "https://onapsis.com/blog/sapmap/", passage: "'Prioritize applying notes to SAP systems exposed to the internet, then work inwards ... affected components are commonly accessible even through internal firewalls'"}
  - {claim_id: 1b703d1b1c, verdict: ok, source_url: "https://cert.europa.eu/publications/security-advisories/2026-011/", passage: "CVE-2026-44756 affected: KRNL64NUC 7.22/7.22EXT; KRNL64UC ...; KERNEL ... 9.20; WEBDISP 9.16-9.20; Note 3747649; Onapsis: workaround note 3756304"}
  - {claim_id: 75fffb20dc, verdict: ok, source_url: "https://onapsis.com/blog/s4get-cve-2026-58240-sap-message-server-threat-advisory/", passage: "Note 3759472; patch levels 9.16 PL100, 9.18 PL32, 9.19 PL17, 9.20 PL7; KERNEL 9.16-9.20 (CERT-EU)"}
  - {claim_id: 212afad0e3, verdict: ok, source_url: "https://cert.europa.eu/publications/security-advisories/2026-011/", passage: "8 Sept Patch Day; OVERPASS 10.0, S4GET 9.8; Onapsis 'discovered and responsibly disclosed' OVERPASS and 'also reported' S4GET; 'Both are remotely exploitable without authentication'"}
  - {claim_id: 54a9d6ff32, verdict: ok, source_url: "https://onapsis.com/blog/sap-overpass-remediation/", passage: "three access vectors: ICM/Web Dispatcher, SAP Dispatcher (SAP GUI protocol), RFC layer; EPP processed before authentication; CERT-EU: memory corruption, OS commands as owning account"}
  - {claim_id: ec8bd5835e, verdict: ok, source_url: "https://onapsis.com/blog/sap-overpass-remediation/", passage: "'more than 10,000 unique Internet-facing IP addresses ... that figure is conservative ... materially undercounts the SAP Web Dispatcher ... returns no distinguishing SAP banner'"}
  - {claim_id: 2d1c462a9b, verdict: ok, source_url: "https://onapsis.com/blog/s4get-cve-2026-58240-sap-message-server-threat-advisory/", passage: "'Exploitation requires no credentials, no certificate, and no pre-existing misconfiguration'; IP treated as trusted, propagated across cluster, Gateway admits as internal, RFC-callable programs, <sid>"}
  - {claim_id: 408ae5ef75, verdict: ok, source_url: "https://onapsis.com/blog/sap-overpass-remediation/", passage: "'attackers can reverse-engineer SAP patches within 72 hours, as with RECON (CVE-2020-6287) ... shrinking now with AI-assisted tooling'; CVE-2025-31324 most exploited per Mandiant M-Trends 2026"}
  - {claim_id: 40cf1e2d06, verdict: ok, source_url: "https://onapsis.com/blog/s4get-cve-2026-58240-sap-message-server-threat-advisory/", passage: "unauthenticated attacker has an IP treated as trusted; connects to the Gateway, admitted as internal, invokes RFC-callable external programs (CERT-EU: registers unauthorised components)"}
  - {claim_id: 3b7bd25376, verdict: ok, source_url: "https://onapsis.com/blog/s4get-cve-2026-58240-sap-message-server-threat-advisory/", passage: "'succeeds even when ... the ACLs defenders normally rely on (secinfo, reginfo, ms/acl_info) are flawlessly configured. None of them sits in this path.'"}
  - {claim_id: d8328722fb, verdict: ok, source_url: "https://onapsis.com/blog/sap-overpass-remediation/", passage: "'A single kernel patch closes all exploitation vectors'; workarounds for HTTP in note 3756304; S4GET page: PL 100/32/17/7"}
  - {claim_id: e4ac5bcf6a, verdict: ok, source_url: "https://onapsis.com/blog/sap-overpass-remediation/", passage: "SAP Dispatcher 'routinely reachable across the internal network because every SAP GUI user needs it'; S4GET public port 'cannot be firewalled away without breaking the end-user logon'"}
  - {claim_id: 73c84e5727, verdict: ok, source_url: "https://onapsis.com/blog/sapmap/", passage: "released Sept 15, GPL 3.0, 'Standalone Pre-Authentication Exploits 10 files', ransomware PoC, SCAN->EXPLOIT->ENRICH->PROPAGATE loop; page datePublished 2026-09-18 (JSON-LD), modified 2026-09-24"}
  - {claim_id: b796aa609e, verdict: ok, source_url: "https://onapsis.com/blog/sapmap/", passage: "maintainers 'initially indicated that related exploits were being withheld' ... Onapsis detected them in repository commits; 'all clones ... include'; 'assumption that OVERPASS exploit PoCs have been "}
  - {claim_id: 585cfd2b3e, verdict: ok, source_url: "https://onapsis.com/blog/sapmap/", passage: "'have not observed active exploitation by threat actors using SAPMAP yet ... public PoC releases can often jumpstart attack campaigns within days or weeks'"}
  - {claim_id: ff07b58e21, verdict: ok, source_url: "https://blog.senthorus.ch/posts/sapmap_threat_assessment/", passage: "'packaging capabilities together could reduce the preparation needed'; 'an incident report establishes that someone used it against a victim' (reviewed 6 Oct 2026)"}
  - {claim_id: 2a2a2dffa7, verdict: ok, source_url: "https://blog.senthorus.ch/posts/sapmap_threat_assessment/", passage: "'A specific organization or actor has used SAPMAP maliciously. This requires incident evidence; the cited toolkit analysis does not establish it.'"}
  - {claim_id: c1fe046093, verdict: ok, source_url: "https://onapsis.com/blog/sapmap/", passage: "record summary matches section: SAPMAP released 2026-09-15, PoCs for both flaws, OVERPASS first withheld, no observed use at writing"}
  - {claim_id: f5c21ac663, verdict: ok, source_url: "https://github.com/zammad/zammad/security/advisories/GHSA-p97w-927q-8vxq", passage: "GHSA: CVE ID CVE-2026-102490, patched 7.2.2, affected <= 7.2.1, 'Only installations from the DEB and RPM packages'; Horizon3 PoC repo for CVE-2026-102489"}
  - {claim_id: b182035e7d, verdict: ok, source_url: "https://csirt.divd.nl/DIVD-2026-00015", passage: "6.3.0 to 6.5.4 RCE; NCSC-NL 'sinds 21 september 2026 actief misbruikt'; KEV dateAdded 2026-10-02 both; 27 advisories (2 crit/12 high/10 med/3 low, none with cve_id) via API"}
  - {claim_id: 70d413930e, verdict: ok, source_url: "https://github.com/zammad/zammad/security/advisories/GHSA-p97w-927q-8vxq", passage: "7.2.2 patched; Zammad: 6.5 and older no security updates; 27 advisories <= 7.2.0; DIVD script; Horizon3: package installation endpoint + password-reset view template (action is a compound task, see F1"}
  - {claim_id: 75a8c74564, verdict: ok, source_url: "https://github.com/zammad/zammad/security/advisories/GHSA-p97w-927q-8vxq", passage: "'An attacker holding that foothold could have escalated within seconds, because the affected services were restarted automatically whenever they stopped'"}
  - {claim_id: 79dabb93db, verdict: ok, source_url: "https://csirt.divd.nl/cves/CVE-2026-102489", passage: "CVSS 4.0 8.7 (scenario 1) / 9.4 chained; >= 6.3.0 to < 6.5.4; EPSS 0.01396 (FIRST 2026-10-05); Zammad: 7.2.0 hardens; 7.2.2 release page 2026-10-08, no 7.2.3 (404)"}
  - {claim_id: 753819a487, verdict: ok, source_url: "https://csirt.divd.nl/cves/CVE-2026-102490", passage: "8.5 alone / 9.4 chained; Affected >= 1.5.0 to < 7.2.2; Unaffected >= 7.2.2; GHSA patched 7.2.2; EPSS 0.00629; Zammad advisory page 10-05 'working on a solution'"}
  - {claim_id: 37acbdcff3, verdict: F3, source_url: "https://csirt.divd.nl/cases/DIVD-2026-00014/", passage: "content supported ('breached ... using two zero-day vulnerabilities', first access 21 Sep) but citation date 2026-10-01 does not match page: 'Last modified 09 Oct 2026 20:01 CEST'; timeline '29 Sep 20"}
  - {claim_id: 2e3fa45658, verdict: ok, source_url: "https://csirt.divd.nl/cases/DIVD-2026-00014/public_statements_on_hack/", passage: "Statement #4 (30 Sep): 'two zero-days in Zammad that together allowed session hijacking, remote code execution and privilege escalation from the Zammad user to root, in seconds'"}
  - {claim_id: 4f3de1ed76, verdict: ok, source_url: "https://csirt.divd.nl/cases/DIVD-2026-00014/public_statements_on_hack/", passage: "#4: 'Thanks to proper network segmentation ... we were able to stop the attackers from going deeper'; #5: 'volunteer data got out, such as DIVD email addresses and possibly contact details'"}
  - {claim_id: 58e7061bef, verdict: ok, source_url: "https://csirt.divd.nl/cases/DIVD-2026-00014/public_statements_on_hack/", passage: "#2: attacker's scripts 'contain notes where the agent justifies its own actions ... agentic AI powered attack'; #3: 'We see no link to any known public threat actor'"}
  - {claim_id: a03b8b036c, verdict: ok, source_url: "https://csirt.divd.nl/DIVD-2026-00015", passage: "'Zammad versions 6.3.0 to 6.5.4 ... session hijack ... remote code execution as the zammad user ... also present in 7.0.0 to 7.1.3, but not exploitable due to environment conditions'"}
  - {claim_id: 5bf3603018, verdict: ok, source_url: "https://www.ncsc.nl/alerts/actief-misbruik-van-zeroday-kwetsbaarheden-in-zammad-update-nu", passage: "'maakt het mogelijk dat een aanvaller zonder in te loggen op afstand schadelijke code kan uitvoeren' (CVE-2026-102489)"}
  - {claim_id: e86f7e914c, verdict: ok, source_url: "https://csirt.divd.nl/cves/CVE-2026-102489", passage: "Base score 8.7 HIGH, vector ...UI:P (passive user interaction), published 29 Sep 2026"}
  - {claim_id: d34988376c, verdict: ok, source_url: "https://csirt.divd.nl/DIVD-2026-00015", passage: "'In all versions of Zammad including the latest alpha has an vulnerability which enables the local zammad user to escalate privileges to root'"}
  - {claim_id: 453d0da021, verdict: ok, source_url: "https://github.com/zammad/zammad/security/advisories/GHSA-p97w-927q-8vxq", passage: "'Only installations from the DEB and RPM packages were affected - installations from source or the official container images were not. All released packaged versions were affected.'"}
  - {claim_id: 06195ef0db, verdict: ok, source_url: "https://csirt.divd.nl/cves/CVE-2026-102490", passage: "chained scenario base score 9.4 CRITICAL"}
