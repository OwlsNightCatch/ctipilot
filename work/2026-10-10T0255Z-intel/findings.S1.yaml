- title: >-
    AnyDesk for Linux 8.0.2: a working public exploit (AnyPwn) for a pre-approval heap overflow that gives root over direct TCP 7070; silently fixed in 8.0.3 in June, no CVE and no advisory
  novelty: new
  borderline: true
  borderline_reason: >-
    public working exploit for a pre-authentication root RCE in a remote-access tool, but Linux only, probabilistic, tuned to the single build 8.0.2, fixed since 2026-06-23, no CVE, no exploitation reported and no public-sector deployment shown
  sources:
  - url: https://thehackernews.com/2026/10/researchers-publish-working-exploit-for.html
    publisher: The Hacker News
    date: '2026-10-09'
    role: primary
  - url: https://github.com/v12-security/pocs/tree/main/anydesk
    publisher: V12 security (AnyPwn PoC README)
