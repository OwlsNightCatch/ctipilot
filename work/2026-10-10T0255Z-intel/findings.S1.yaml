    role: corroborating
  discovery_trace: >-
    first seen at: backlog re-gate (state/coverage_backlog.md row 2026-09-30, condition 'MikroTik names the fixed builds') -> WebSearch ('MikroTik RouterOS CVE-2026-84411 web interface integer underflow 7.24 exploit') -> primary: https://mikrotik.com/supportsec/cve-2026-84411 (pattern taken from the real MikroTik CVE-2025-42611 page that BSI WID-SEC-2026-3815 links) -> CISA CSAF ICSA-26-272-06 via 'cisa csaf icsa-26-272-06' and https://www.cisa.gov/news-events/ics-advisories/icsa-26-272-06
  summary: >-
    MikroTik's own notice (dated 2026-10-06) confirms an integer underflow in HTTP request body handling of the RouterOS web management service (the service behind WebFig on the www and www-ssl ports), rated critical and assigned CVE-2026-84411: one crafted unauthenticated request can crash the service or run code on the router with full privileges. Affected: RouterOS before 7.24, including v6, on devices where the web interface is reachable by the attacker. Fix status per MikroTik: v7 stable fixed since 7.24; v7 long-term and v6 long-term releases pending. MikroTik says that in the default configuration the firewall already blocks the web interface from the internet, so a default-firewall device is reachable only from the local network; if upgrading is not possible, restrict www and www-ssl under IP > Services to trusted addresses or disable them and manage the router over WinBox, SSH or a VPN such as WireGuard. CISA's advisory ICSA-26-272-06 (initial 2026-09-29, revision A 2026-09-30 fixed
    an upgrade-version typo) scores it CVSS 3.1 9.8 and 4.0 9.3, recommends 7.24 or later, records SSVC exploitation 'none' and automatable 'yes', and states no known public exploitation. This resolves the earlier contradiction in CISA's text (affected < 7.24 but update to 7.23 or later): the long-term v7 channel (7.23.x) is not yet named fixed. Re-gate result (2026-10-10): not in CISA KEV (catalog 2026.10.08), no public proof of concept or exploitation report found, EPSS 0.0095. The store already covers the distinct MikroTrick SSH chain (CVE-2026-67276 / 86060, exploited); do not conflate. This CVE is separate and unexploited.
  region_nexus: global; RouterOS is widely deployed edge and branch routing; no source names a Swiss deployment.
