  discovery_trace: >-
    first seen at: bsi-de, bsi-rss feed https://wid.cert-bund.de/content/public/securityAdvisory/rss ([NEU] WID-SEC-2026-3839 'Zammad: Schwachstelle ermoeglicht Privilegienerweiterung', fetched with the bsi-csaf subcommand, references list GHSA-p97w-927q-8vxq and the zammad.com 7.2.2 release) -> primary: https://zammad.com/en/product/releases/7-2-2 -> primary: https://github.com/zammad/zammad/security/advisories/GHSA-p97w-927q-8vxq (listing at https://github.com/zammad/zammad/security/advisories confirms publication 2026-10-08) -> corroborating: DIVD CNA record https://csirt.divd.nl/cves/CVE-2026-102490
  summary: >-
    Zammad's release page for 7.2.2 (2026-10-08) calls it an important security update that addresses a vulnerability affecting only DEB/RPM packages built with packager.io; SaaS customers need no action and self-hosted installations are told to upgrade immediately. Zammad's GitHub advisory GHSA-p97w-927q-8vxq (published 2026-10-08, rated High, credit DIVD) describes a local privilege escalation to root: packaged services started as root and executed files that were owned and writable by the unprivileged zammad account before dropping privileges, and the installation directory was writable by that account, so an attacker already holding code execution (or file-system write) as zammad could reach root within seconds because the services restart automatically. Installations from source and the official container images are not affected; every released packaged version was. The advisory text on the page read carries no CVE identifier; the mapping to CVE-2026-102490 comes from DIVD's CNA record,
    which lists the same GHSA as a reference and shows the affected range >= 1.5.0 and < 7.2.2 with 7.2.2 unaffected (DIVD's page title says 'v1.5.0 to v7.2.2'; the structured range is the one used here), and from BSI's WID-SEC-2026-3839. DIVD scores it CVSS 4.0 8.5 alone and 9.4 chained with CVE-2026-102489. This closes the gap the covered entry records ('no fix named for the root flaw'). Zammad's own advisory page for both CVEs is still dated 2026-10-05 and still says its team is working on a solution, so the vendor's pages disagree on status. Unchanged: CVE-2026-102489 (the session-hijack code execution) affects only 6.5 and older, which receive no security fixes; both CVEs were reported exploited since 2026-09-21 (NCSC-NL, per the covered entry) and are KEV-listed (2026-10-02).
  region_nexus: global; Zammad is a helpdesk and ticketing platform (Zammad GmbH, Germany); no source read names a Swiss deployment.
