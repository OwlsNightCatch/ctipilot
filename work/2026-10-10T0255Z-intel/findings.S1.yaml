    feed URL answers HTTP 302 on direct fetch and the reader returns no items; `extract` of the 'Stable updates' label page and of the month archive returns only the newest post (ChromeOS), so the desktop Chrome 155 post was not read from Google; dates and the no-exploitation statement came from deskmodder and WebSearch. Recipe gap, no working command found for desktop stable posts.
- source_id: cisa-advisories
  reason: >-
    `feed https://www.cisa.gov/cybersecurity-advisories/all.xml` auto-falls to the jina reader (credit) and lists ICS items only; the WebFetch listing of /news-events/cybersecurity-advisories (10 items with dates) plus `cisa csaf-recent` is the working recipe, as the 2026-09-30 note says. Consider recording that `feed` on this URL spends credit.
- source_id: wordfence
  reason: >-
    `extract` of the weekly report article served via jina (357 KB, credit spent for a database digest with no on-point item); the feed alone is enough for this source.
- source_id: sonicwall-psirt
  reason: >-
    `extract` of both psirt.global.sonicwall.com pages served via jina; the reader text of SNWLID-2026-0017 omits the fixed-version table, so fixed builds were taken from the covered entry.
- source_id: mozilla-mfsa
  reason: >-
    `extract` of the advisories index drops the list items under most date headings (empty headings for 2026-10-06 and 2026-09-16 etc.); WebFetch of the index returned the 2026-10-06 advisory (MFSA 2026-104). Use WebFetch for this index.
- source_id: drupal-security-contrib (not in slice)
  reason: >-
    direct fetch of https://www.drupal.org/security/contrib returns a 'Client Challenge' page through `extract`; WebFetch reads it (26 advisories with risk ratings). Worth recording as a webfetch-only recipe if Drupal advisories enter a slice.
- source_id: jina reader pool
  reason: >-
    one `extract` of advisories.ncsc.nl/advisory?id=NCSC-2026-0392 reported the jina key balance exhausted; use `ncsc-nl csaf` as the first rung, as the 2026-10-02 note says.
- source_id: previdian
  reason: >-
    candidate source already registered; this fire it supplied the first-hand exploitation claim for CVE-2026-102255 (and CVE-2026-21589 earlier). Its per-CVE pages read with `extract` (trafilatura-direct). Promotion evidence.
recipe_notes:
- >-
  mikrotik-routeros-changelog (candidate): MikroTik vendor notices live at https://mikrotik.com/supportsec/cve-<year>-<id> (read with `extract`, trafilatura-direct); /supportsec itself is only the disclosure policy. The URL was reached from the real CVE-2025-42611 link in BSI's WID-SEC-2026-3815, then confirmed for CVE-2026-84411.
- >-
  BSI csaf subcommand `bsi-csaf WID-SEC-2026-NNNN` returns structured CSAF with references and CVE ids; useful to resolve a CVE for a vendor page that carries none (Zammad GHSA-p97w mapped to CVE-2026-102490 through it).
- >-
  kev_window_diff.py persists its output to work/<run-id>/kev-window.txt: my wider-window rerun (--window-hours 200) overwrote the main agent's 26 h file; I restored the original three-line content (0 additions since 2026-10-09).
