  discovery_trace: >-
    first seen at: news-feed gap sweep, The Hacker News RSS (https://feeds.feedburner.com/TheHackersNews, item of 2026-10-09 18:29Z 'Researchers Publish Working Exploit for Pre-Auth AnyDesk Linux Flaw That Gives Root Access') -> https://thehackernews.com/2026/10/researchers-publish-working-exploit-for.html -> primary: V12 PoC repository README https://github.com/v12-security/pocs/tree/main/anydesk -> vendor changelog https://anydesk.com/en/changelog/linux (8.0.3, Jun 23, 2026: 'Fixed a bug that could lead to a crash')
  summary: >-
    V12's security team (Rick de Jager) published a full exploit, AnyPwn, on 2026-10-08 for a pre-approval remote code execution in AnyDesk for Linux 8.0.2. The session protocol's mode-5 stream packet handler adds a 16-byte object header to an attacker-declared payload length in 32-bit arithmetic without an overflow check, so a declared length of 0xFFFFFFF0 wraps to a zero-byte allocation while the object keeps the large length, and copying even one byte overflows the heap. The published PoC demonstrates the full chain only over the direct TCP connection on port 7070, where the service normally runs as root on Linux, giving root command execution before anyone approves the session. It is probabilistic (heap grooming; otherwise the service crashes), its offsets target exactly AnyDesk Linux 8.0.2 (x86_64), and other builds need different offsets. V12 says the same code path is reachable through AnyDesk's relay servers, validated with a Frida trigger, but did not demonstrate the full chain
    over relays. Vendor side: AnyDesk fixed it in 8.0.3 (changelog dated 2026-06-23, worded only as 'Fixed a bug that could lead to a crash'); per The Hacker News, AnyDesk said in June that the issue is limited to direct connections on Linux and that Windows and macOS are not affected, no CVE had been assigned as of 2026-10-09, AnyDesk has issued no security advisory, and the 8.0.2 build has disappeared from the download page. The latest Linux release is 8.1.0 (2026-09-23). Administrators who cannot update can restrict TCP 7070. No exploitation in the wild is reported in any source read.
