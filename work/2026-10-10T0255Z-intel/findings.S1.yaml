    attribution: BleepingComputer
    source_url: https://www.bleepingcomputer.com/news/security/unpatched-ahsaycbs-flaws-exploited-to-deploy-webshells-mine-crypto/
  extended_notes: >-
    Detection (Huntress): process-creation events where the AhsayCBS service binary (cbssvcX64.exe or cbssvcX86.exe) spawns children outside its normal startup and maintenance commands, because commands from an uploaded JSP webshell appear as direct children of the service; a service named MicrosoftEdgeUpdateSvc (the real Edge updater is edgeupdate) running an Edge-named binary from a Temp folder as SYSTEM; PowerShell script blocks that check for Task Manager and stop or start a service to match; a command line naming WinRing0 alongside a URL. Huntress published four Sigma rules in its threat-intel repository. Triage lookalike: legitimate AhsayCBS maintenance commands also spawn from the service; the discriminators are a shell, curl or certutil child, output written to Temp, and Edge-named binaries outside the browser's install path. Hardening (Huntress): restrict the management interface to trusted addresses or a VPN; if compromise is confirmed, re-image the host from a trusted backup because
    secondary backdoors may persist. Exposure check: AhsayCBS version (all through 10.3.4 per Huntress) and whether the web application is reachable from the internet. Contradiction to surface: CNA records say 10.3.4 mitigates, Huntress says it does not. The CNA record URLs are MITRE API pages and are deliberately not cited as sources.
