  summary: >-
    watchTowr (Piotr Bazydlo, 2026-10-09) documents two further bugs it found while diffing PaperCut's emergency patches, which together give an unauthenticated chain against Emergency Patch Release 2 (26.0.4-PO build 76508). WT-2026-0143 (no CVE) is an authentication bypass: Apache Tapestry accepts a chain of pages in the service parameter (for example direct/1/Home/SetupAdmin/$Form), authorization is checked only for the root page (Home, reachable before login), so the Setup Wizard form pages can be invoked after setup completed, and four POSTs (SetupAdmin, SetupOrgType, SetupUserSource, SetupVerify) reset the administrator password. WT-2026-0144, which is CVE-2026-82077, is a post-authentication RCE in the Scan-to-Fax feature: the attacker-controlled fax connector name is appended to the connector directory without validation (relative path traversal to an arbitrary executable) and the arguments come from the system.scan.fax.send.command-args configuration value, editable in the Config
    Editor, executed when a scan-to-fax job runs. watchTowr says it is releasing a Detection Artefact Generator to test exposure. Fix timeline per watchTowr: Emergency Patch Release 3 (build 76530, 2026-09-01) fixes WT-2026-0143; 26.0.5 (2026-09-10) fixes WT-2026-0144 / CVE-2026-82077. PaperCut, the CNA, published CVE-2026-82077 on 2026-09-24 with CVSS 4.0 7.3 (administrator required, exploit maturity proof of concept) and affected versions below 25.0.13 and 26.0.0 up to below 26.0.5; PaperCut's bulletin (last updated 2026-09-10) names only CVE-2026-82078 and CVE-2026-81578, so the bulletin is silent on this CVE and on whether 24.1.x is affected. Delta for the covered entry: (1) CVE-2026-82077 exists and only the maintenance releases close it, so Emergency Patch Release 3 breaks the unauthenticated chain at the authentication bypass but is not a full substitute for 26.0.5 or 25.0.13; (2) public technical detail and a checker now exist for the Release 2 build. The exploited pair keeps very
    high EPSS (CVE-2026-81578 0.856, CVE-2026-82078 0.635); CVE-2026-82077 is 0.007. No exploitation of the two new bugs is reported.
