  discovery_trace: >-
    first seen at: news-feed gap sweep, BleepingComputer RSS (https://www.bleepingcomputer.com/feed/, item of 2026-10-09 08:32Z 'Max severity SonicWall SMA1000 flaw now exploited in attacks') -> https://www.bleepingcomputer.com/news/security/max-severity-sonicwall-sma1000-flaw-now-exploited-in-attacks/ -> pivot: Previdian per-CVE page https://previdian.com/CVE-2026-102255 (first-hand honeypot observer) -> vendor primary re-read: https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2026-0017 (standing duty on the covered SonicWall entry)
  summary: >-
    SonicWall advisory SNWLID-2026-0017 (2026-10-06) fixes CVE-2026-102255, a pre-authentication server-side request forgery in the Work Place interface of SMA1000 6210, 7210 and 8200v appliances (CVSS 3.0 10.0); the SMA 100 series and SSL-VPN on SonicWall firewalls are not affected. New claim, 2026-10-09: Previdian, which runs a honeypot network, told BleepingComputer that its sensors detected exploitation attempts consistent with CVE-2026-102255. Previdian describes crafted OPTIONS requests to the Work Place Extraweb interface that reach the appliance's internal CouchDB service on 127.0.0.1:5984, try to traverse into a CouchDB design document and invoke its _rewrite function, and carry an HTTP Basic Authorization header with the credentials admin:admin. Previdian rates the observation medium confidence (first observed 2026-10-09) and says it has not established whether the attempts would have compromised any system. The vendor page, re-read in this run, still states that there is currently
    no evidence of exploitation of any flaw in the release, and the PSIRT list shows the advisory last updated 2026-10-06, so the vendor has not confirmed the claim. The CISA KEV catalog read in this run (version 2026.10.08) does not list the CVE; Previdian's page also says not in KEV. EPSS 0.0048 (FIRST, 2026-10-09). BleepingComputer adds that Shadowserver tracks more than 400 exposed SMA1000 appliances (an exposure count, patched or not), and recalls that two earlier Work Place SSRF flaws on this product line were exploited this year. BleepingComputer and Previdian's page trace to one first-hand observer, so the exploitation claim is single-source and attributed, not independently corroborated.
  region_nexus: >-
    global; SMA1000 is a remote-access gateway BleepingComputer says managed service providers and government agencies use; NCSC Switzerland issued an advisory on 2026-10-07 (exploitation status unknown then). No source read names a Swiss deployment.
  primary_sector_nexus: direct (remote-access gateway class used by government agencies per BleepingComputer)
