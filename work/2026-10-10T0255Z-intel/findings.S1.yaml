    attribution: BleepingComputer (quoting Previdian founder Ryan Dewhurst)
    source_url: https://www.bleepingcomputer.com/news/security/max-severity-sonicwall-sma1000-flaw-now-exploited-in-attacks/
  - quote: Previdian has not yet established "whether those attempts would have successfully compromised any systems."
    attribution: BleepingComputer
    source_url: https://www.bleepingcomputer.com/news/security/max-severity-sonicwall-sma1000-flaw-now-exploited-in-attacks/
  - quote: Previdian sensors observed exploitation attempts with medium confidence.
    attribution: Previdian
    source_url: https://previdian.com/CVE-2026-102255
  - quote: There is currently no evidence any of the vulnerabilities addressed in this release are being exploited in the wild.
    attribution: SonicWall PSIRT
    source_url: https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2026-0017
  extended_notes: >-
    Delta for the covered entry: its title says no exploitation reported and its status is patch-available only; add exploitation attempts (single-source, Previdian) as a non-internal update. Fixed builds recorded in the covered entry are 12.4.3-03670 and 12.5.0-03082; the PSIRT page text fetched this run (reader transport) omits the version table, so confirm them on the vendor page before restating. Detection concept (from Previdian's description only): web or reverse-proxy access logs for the Work Place Extraweb interface showing OPTIONS requests that carry an Authorization: Basic header and reference a loopback address, port 5984 or a CouchDB _rewrite path. Triage: a legitimate OPTIONS preflight from a browser would not carry admin:admin credentials or point at the appliance's own loopback services. The sources state no post-patch compromise check; Previdian says success is unknown. Priority suggestion: keep high, raise the statement of exploitation to 'attempts reported, unconfirmed
    by the vendor'.
- title: >-
    Zammad 7.2.2 (2026-10-08) fixes CVE-2026-102490, the root escalation the covered entry records as unfixed; only DEB/RPM (packager.io) installations are affected
