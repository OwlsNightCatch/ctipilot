  summary: >-
    The Contao comments bundle lets an unauthenticated front-end visitor post a comment that carries a script injection; the victim is any back-end user who opens the Comments module, and moderation makes exposure certain because unpublished comments are still inserted and a moderator must open the list. The Contao back end sends no Content-Security-Policy header, so nothing mitigates the inline handler. The script runs in the back-end origin under that user's session, with no click, so it can read any module the user reaches, create an administrator or edit a template, which the advisory calls a documented path from back-end write access to code execution. Affected: contao/comments-bundle >= 4.0.0 and < 5.3.50, and >= 5.4.0-RC1 and < 5.7.12 (GitHub advisory database listing); fixed in 5.3.50 and 5.7.12. CVSS 3.1 vector AV:N/AC:L/PR:N/UI:R/S:C/C:H/I:H/A:N. No exploitation is reported.
