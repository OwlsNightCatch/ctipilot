    publisher: Ahsay (AhsayCBS 10.3.4 release notes, 05-Aug-2026)
    date: '2026-08-05'
    role: context
  discovery_trace: >-
    first seen at: news-feed gap sweep, BleepingComputer RSS (https://www.bleepingcomputer.com/feed/, item of 2026-10-09 13:17Z 'Unpatched AhsayCBS flaws exploited to deploy webshells, mine crypto'; also THN and SecurityWeek feeds) -> https://www.bleepingcomputer.com/news/security/unpatched-ahsaycbs-flaws-exploited-to-deploy-webshells-mine-crypto/ -> primary: Huntress https://www.huntress.com/blog/ahsaycbs-flaws-exploit -> Ahsay release notes https://www.ahsay.com/en/support/help-centre/release-notes/cbs/v10.3.4 (no security fix listed); CVE records read through the CVE.org API (CNA VulDB, published 2026-10-04) for the affected-range claim
  summary: >-
    Huntress (first-hand telemetry, 2026-10-08) reports that from 2026-10-07 23:20 UTC threat actors exploited two AhsayCBS flaws, chained, against internet-exposed servers: CVE-2026-105133 (improper authentication in the checkSysPwd function of com/ahsay/obs/api/ApiStructsAction.java, rated medium by Huntress) is used first to bypass authentication, then CVE-2026-105134 (/rps/api/json/UpdateReceivers.do in the Replication Receiver component; Huntress says an API authentication bypass lets a random token substitute valid credentials) gives unauthenticated code execution as NT AUTHORITY\SYSTEM. Post-exploitation seen: a malicious replication receiver configured and JSP webshells dropped into the directory the CBS application serves; payloads fetched to the user Temp folder by curl and certutil from a cloud object-storage bucket; an XMRig miner renamed edge.exe, run as a SYSTEM service named MicrosoftEdgeUpdateSvc through a modified copy of the NSSM service manager renamed msedge.exe; a PowerShell
    script (assessed by Huntress as AI-assisted) that stops the miner while Task Manager is open and kills Task Manager at 18:00 local time or after an hour overnight; in one case the vulnerable WinRing0x64.sys driver downloaded for the miner. BleepingComputer and SecurityWeek, relaying Huntress, say at least five organizations were targeted as of 2026-10-08. Patch status is contested: the CVE records (CNA VulDB, 2026-10-04, saying a public exploit exists) list AhsayCBS up to 10.3.2 as affected and 10.3.4 as unaffected, and Huntress's first version advised updating to 10.3.4; Huntress's update of 2026-10-08 18:00 ET says 10.3.4 is also affected, that it has told Ahsay, and that until a patch exists owners should restrict the management interface and investigate. Ahsay's 10.3.4 release notes (2026-08-05) list no security fix, and BleepingComputer had not heard back from Ahsay. BleepingComputer's description of which CVE is the authentication bypass differs from Huntress's; Huntress's account
    is used here. AhsayCBS is primarily used by MSPs and system integrators to administer backup operations (Huntress). Not in CISA KEV (catalog 2026.10.08); EPSS 0.0038 for CVE-2026-105133 and 0.0184 for CVE-2026-105134.
  region_nexus: >-
    global; no region stated. AhsayCBS consoles are run by MSPs and integrators, so a compromise can reach their customers' backups.
