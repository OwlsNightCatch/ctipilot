      The service normally runs as root on Linux, so successful exploitation yields root command execution before desktop-control approval.
    attribution: V12 security (README)
    source_url: https://github.com/v12-security/pocs/tree/main/anydesk
  extended_notes: >-
    Exposure: AnyDesk for Linux 8.0.2 or earlier with the service reachable on TCP 7070 (direct connections); check the installed version and listening sockets for the anydesk --service process. Detection concept: a crash or restart of the AnyDesk service (heap layout misses crash it) and inbound sessions to TCP 7070 from unexpected sources, followed by a root child process of the service; sources state no detection guidance, this follows from the stated mechanism. Hardening: AnyDesk 8.0.3 or later (8.1.0 current), restrict or block TCP 7070 at the host firewall.
- title: >-
    Contao comments bundle CVE-2026-107845: an unauthenticated visitor's comment executes script in the back-end origin of whoever opens the Comments module (CVSS 3.1 9.3; fixed 5.3.50 and 5.7.12)
  novelty: new
