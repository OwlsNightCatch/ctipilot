- title: >-
    SonicWall SMA1000 CVE-2026-102255: exploitation attempts against the unauthenticated Work Place SSRF reported three days after the patch; the vendor advisory still says no evidence
  novelty: update-of:2026-10-08/cve-2026-102255-sonicwall-sma1000-workplace-ssrf
