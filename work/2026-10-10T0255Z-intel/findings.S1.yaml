    Exposure check: RouterOS version below 7.24 (any v6), and www or www-ssl reachable from an untrusted network (IP > Services; default firewall blocks WAN access). Detection: no source states detection guidance; RouterOS web-service crashes or restarts after unauthenticated requests would be the observable symptom of failed attempts (inference from the stated crash outcome, not a source statement). Priority suggestion: notable at most (not exploited, CVSS 9.8, default config LAN-only). Note the long-term channel is the one many managed estates track, and it is not yet fixed.
- title: >-
    AhsayCBS backup management server: unauthenticated RCE chain (CVE-2026-105133 plus CVE-2026-105134) exploited since 2026-10-07 to drop JSP webshells and an XMRig miner; Huntress says the latest 10.3.4 is also affected and no patch exists
  novelty: new
  borderline: true
  borderline_reason: >-
    exploited in the wild with a public exploit and no confirmed fix, but no Swiss or public-sector nexus is stated; AhsayCBS is an MSP-oriented backup console (supply-chain vector) and the observed payload is a cryptominer
  sources:
  - url: https://www.huntress.com/blog/ahsaycbs-flaws-exploit
    publisher: Huntress
    date: '2026-10-08'
    role: primary
  - url: https://www.bleepingcomputer.com/news/security/unpatched-ahsaycbs-flaws-exploited-to-deploy-webshells-mine-crypto/
