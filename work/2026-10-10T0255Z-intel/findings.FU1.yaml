items:
  - title: >-
      GhostAction returns: stolen maintainer credentials push a fake "Security Audit" workflow into the victims' own repositories,
      now sweeping the full git history for cloud, AI and registry credentials
    sources:
      - { url: "https://www.stepsecurity.io/blog/ghostaction-returns", publisher: "StepSecurity", date: "2026-10-09", role: "primary" }
      - { url: "https://socket.dev/blog/ghostaction-cloud-credentials", publisher: "Socket", date: "2026-10-09", role: "primary" }
      - { url: "https://blog.gitguardian.com/ghostaction-github-actions-supply-chain-attack-returns/", publisher: "GitGuardian", date: "2026-10-07 (updated 2026-10-09)", role: "corroborating" }
      - { url: "https://thehackernews.com/2026/10/credential-stealing-github-actions.html", publisher: "The Hacker News", date: "2026-10-10", role: "lead" }
    discovery_trace: >-
      first seen at: cross-domain lead from S3/S4/S1 (The Hacker News 2026-10-10 headline) → fetched via extract, URL
      https://thehackernews.com/2026/10/credential-stealing-github-actions.html → pivot: StepSecurity, URL
      https://www.stepsecurity.io/blog/ghostaction-returns (primary: run-log forensics, hunting queries) → pivot: Socket, URL
      https://socket.dev/blog/ghostaction-cloud-credentials (independent analysis of the same 2026-10-08 burst; carries the 'tens of thousands' update line) →
      pivot: GitGuardian, URL https://blog.gitguardian.com/ghostaction-github-actions-supply-chain-attack-returns/ (Aug 31 to Sep 30 wave statistics, approval-gate data)
    summary: |
      GhostAction, the CI/CD secret-theft campaign GitGuardian first documented in September 2025, was still running through 2026 and escalated on
      2026-10-08. The operator holds a maintainer's GitHub credential (StepSecurity and GitGuardian assess most plausibly a personal access token
      leaked through infostealer logs or credential dumps; Socket did not observe how it was obtained) and commits a workflow named "Security Audit"
      (security-audit.yml) or "Github Actions Security" (github_actions_security.yml) directly to the default branch of every repository that account can
      write to. The commit carries the victim's own identity, is unsigned and bypasses pull-request review, so the workflow runs in the victims' own
      repositories and organisations, not in attacker-controlled ones; StepSecurity notes nothing in an audit log looks anomalous unless the workflow content is read.
      The workflow triggers on workflow_dispatch and on any push to any branch or tag. The original payload POSTs the repository's named Actions secrets
      (the names are templated in after the attacker scanned the repository's existing workflows for secrets references). The October variant checks out with
      fetch-depth 0, then greps the working tree and the entire git history (git log -p --all) for 13 credential patterns (AWS key IDs, secret keys and session tokens,
      with two lines of context so key pairs can be rebuilt; Anthropic, OpenAI and OpenRouter keys; GitHub and GitLab tokens; Google/Firebase, Slack and SendGrid keys)
      and sends everything in one HTTP POST to a bare IP address over plain HTTP, so no DNS lookup occurs. StepSecurity read the Actions run log of an Uber-owned
      repository and confirms the exfiltration request was acknowledged four seconds after the run started; the run's GITHUB_TOKEN was scoped contents: read, so
      escalation depends on what is stolen. On 2026-10-08 the accounts of the author of the pyxel game engine (27 repositories; the payload named his PyPI and
      crates.io publishing credentials and a PAT) and of the original author of Uber's athenadriver (318 repositories, 279 of them forks, plus an Uber organisation
      repository he could still write to) were used; StepSecurity and Socket count 345 and 346 repositories. Neither saw a malicious package release published
      from the stolen credentials so far. GitGuardian's own data covers the preceding wave: 772 public repositories of 373 users and organisations hit between
      2026-08-31 and 2026-09-30, targeting 2,577 secrets (SSH keys, Azure, registry, database, AWS, FTP credentials and others), and in 92 cases the attacker re-pointed
      workflows left over from earlier waves; GitHub held most of those runs for approval (499 of 3,669 collected runs executed, in 32 repositories).
      Scale conflict, held rather than averaged: a one-line Socket update says more than 500 accounts committed the workflow to "tens of thousands of repositories" since
      2026-10-07, with no method or list, while Socket's own body counts 346 repositories and StepSecurity's GitHub code search on 2026-10-09 finds 378 default-branch
      repositories (forks excluded; its marker-based counts are approximate). Carry the tens-of-thousands figure only as Socket's unexplained claim, never as fact.
      The remediation scope has also moved: because the payload reads history, rotating the current Actions secrets no longer covers the exposure.
    region_nexus: "global; no Swiss, DACH or public-sector victim is named in any source; relevance rests on GitHub-hosted developer and CI/CD estates of public bodies and their suppliers"
    primary_sector_nexus: "indirect (developer and CI/CD estates; open-source maintainers and enterprises; no public-sector victim reported)"
