    exposure_notes: |
      Exposed: any GitHub account (user or organisation member) whose personal access token or session credential was leaked, and every repository, fork and organisation repository that account
      can write to. Telling: organisation-scoped GitHub code search for the two workflow file names under .github/workflows and for the payload's request-body marker (StepSecurity publishes the
      queries); organisation audit log for default-branch pushes adding workflow files directly (no pull request) from a maintainer identity, unsigned rapid-fire commits across many repositories within
      minutes, workflow_dispatch events on freshly created 'audit' workflows; commit messages 'Add security audit workflow', 'Update security audit workflow', 'Add Github Actions Security workflow'
      (Socket, StepSecurity). StepSecurity's stated trigger for treating it as a breach: a workflow with either name appearing in any repository you maintain since 2026-08-31.
    detection_notes: |
      Telemetry classes: source-control audit log (direct pushes of workflow files to default branches, unsigned commits, bursts across many repositories); Actions run history (runs of the two workflow names,
      including manual dispatch immediately after a file update, which StepSecurity saw on pyxel); runner egress logs (an HTTP POST to a bare IP address with no preceding DNS lookup, including from
      self-hosted runner ranges). Post-removal compromise check: treat every completed run as successful exfiltration; scan full history (git log -p --all, branches and tags, including forks) and rotate
      every credential found in all 13 pattern classes, not only configured Actions secrets; revoke (not rotate) the injecting PAT, its sessions, OAuth grants and SSH keys; review AWS CloudTrail for the
      exposure window and for new IAM users, keys and regions; review package registry release history for unexpected versions; check forks of affected repositories before enabling Actions on them (Socket, StepSecurity, GitGuardian).
    triage_notes: |
      Benign lookalike: a legitimate security-scanning workflow added by a team. Discriminators the sources give: direct push to the default branch under a maintainer identity with no pull request and no signature,
      the same file landing in tens or hundreds of repositories within minutes (including decade-dormant repositories and forks, consistent with automated enumeration), fetch-depth 0 plus a history-wide grep, and an HTTP
      POST of the result to a bare IP. A single reviewed workflow with a known scanner action is not this pattern.
    hardening_notes: |
      Levers the sources name: require approval for workflow runs (StepSecurity: the single control observed stopping exfiltration; GitGuardian: GitHub held most September runs for approval); protect
      .github/workflows/* with branch protection or rulesets so workflow changes need pull-request review; egress allowlist on runners; GitHub secret scanning with push protection; phishing-resistant MFA and
      re-enrolment for the compromised account (Socket); enumerate every repository the account can write to, by permission rather than expectation.
    proposed_action: >-
      Run an organisation-scoped GitHub code search in every organisation your teams and suppliers administer for security-audit.yml and github_actions_security.yml under .github/workflows; any hit means
      assume breach, revoke the committing credential and rotate every secret in the repository's full history. (Do-now bar: concrete, derived from this finding's mechanics; composer to judge.)
    extended_notes: |
      The store already carries two CI/CD credential-theft entries (the 2026-10-07 Gentlemen affiliate entry; the May Megalodon mass-poisoning); GhostAction is a different operator and mechanism (account takeover plus a templated workflow,
      no malicious package release observed) and no CVE is involved, so check_run's CVE-overlap rule does not apply. GitGuardian also reports that stolen GitHub credentials are traded and reused: 13 GhostAction victim
      repositories were also used for cryptomining by at least four unrelated campaigns (and one DevOpsGPT miner commit that GitGuardian does not attribute to the GhostAction operator), which is why revoking the injecting credential matters.
      Source reliability note: StepSecurity, Socket and GitGuardian are vendors with commercial products in this space; the claims used here rest on run logs, commit metadata and counts they describe in detail, not on product statements.
