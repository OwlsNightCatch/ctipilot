    entry: 2026-10-10/ghostaction-fake-audit-workflow-git-history-credential-theft
    surface: "summary"
    kind: frontmatter
    text: "StepSecurity and Socket report that on 2026-10-08 the GhostAction campaign used the GitHub credentials of two open-source maintainers to commit a workflow disguised as a security audit straight to the default branch of 345 to 346 repositories, including one of an Uber-owned organisation, and that the workflow now sends the credentials found in the working tree and in the entire git history, besides the named Actions secrets, to a hardcoded address over plain HTTP. StepSecurity read a run log showing the exfiltration was acknowledged four seconds after the run started; no malicious package release from the stolen credentials has been seen yet."
