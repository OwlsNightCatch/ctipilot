  - claim_id: 153f9fc01d
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "summary"
    kind: frontmatter
    text: "The Confederation, in a release headlined \"data outflow confirmed\", said on 2026-10-08 that a software supplier of Publica detected a cyberattack at the end of September, and the supplier PK Softech AG (Reinach BL) says unknown attackers used malware to reach part of its IT infrastructure and that it must be assumed data left its systems; the Federal Prosecutor's Office is investigating. Publica insures, among others, staff of the federal administration and the ETH domain, about 70,000 active members and 41,600 pensioners at the end of 2025, and says name, date of birth, AHV number, address, contact details, salary and pension data and partner details could have been taken. On 2026-10-09 the Bernische Pensionskasse, which insures canton of Bern staff and cantonal university personnel, said its supplier is the same company, and the Bernische Lehrerversicherungskasse and Pensionskasse Post reported the supplier incident too; none of the funds has yet confirmed which member data left, and the access vector and the actor are not public."
  - claim_id: 1d87ab8ccb
    entry: 2026-10-09/publica-pk-softech-supplier-malware-intrusion-data-outflow
    surface: "actions[0]"
    kind: frontmatter
    text: "Tell the helpdesk, HR and payroll teams of every body whose staff are insured with Publica (including the federal administration and the ETH domain) that AHV number, date of birth, address and salary may now be known to criminals and must not count as proof of identity, and route requests that quote them to a call-back on a known number; for staff insured with the Bernische Pensionskasse or the Bernische Lehrerversicherungskasse apply the same rule until those funds report the scope, because they say they see no indication of theft but cannot exclude it."
  - claim_id: 69f9f0e8c3
