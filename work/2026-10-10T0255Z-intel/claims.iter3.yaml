    surface: "body"
    kind: cited
    text: "SAP's 8 September 2026 Security Patch Day fixed CVE-2026-44756 (\"OVERPASS\", CVSS 10.0) and CVE-2026-58240 (\"S4GET\", CVSS 9.8), both discovered and responsibly disclosed by Onapsis Research Labs, both remotely exploitable pre-authentication ("
    urls: ["https://cert.europa.eu/publications/security-advisories/2026-011/"]
  - claim_id: 54a9d6ff32
    entry: 2026-09-10/sap-september-2026-overpass-s4get-preauth-rce
    surface: "body"
    kind: cited
    text: "OVERPASS is a memory-corruption flaw in the SAP kernel's processing of the Extended Passport, a tracing structure attached to requests and parsed before session authentication; because the handling code is shared, the flaw is reachable via three independent unauthenticated routes — the Internet Communication Manager/Web Dispatcher (HTTP/HTTPS, Fiori/WebGUI/APIs), the SAP Dispatcher (the SAP GUI logon protocol), and RFC connections between systems — with a single crafted request corrupting memory to reach arbitrary OS command execution as the account that owns the SAP installation ("
    urls: ["https://onapsis.com/blog/sap-overpass-remediation/", "https://cert.europa.eu/publications/security-advisories/2026-011/"]
  - claim_id: ec8bd5835e
    entry: 2026-09-10/sap-september-2026-overpass-s4get-preauth-rce
    surface: "body"
    kind: cited
    text: "Onapsis's own internet-wide fingerprinting found more than 10,000 unique internet-facing IPs presenting an SAP web interface, a figure it calls conservative since it structurally undercounts the SAP Web Dispatcher, which returns no distinguishing banner ("
    urls: ["https://onapsis.com/blog/sap-overpass-remediation/"]
  - claim_id: 2d1c462a9b
    entry: 2026-09-10/sap-september-2026-overpass-s4get-preauth-rce
    surface: "body"
    kind: cited
    text: "S4GET is a distinct logic flaw in the SAP NetWeaver Message Server (kernel lines 9.16-9.20, native to S/4HANA and S/4HANA Cloud Private Edition) reachable through the same public port every SAP GUI client connects to: a crafted packet gets an arbitrary IP address accepted as a trusted internal node, and the Message Server propagates that false trust across the cluster so the attacker can register with the Gateway as internal and invoke RFC-callable programs to reach code execution as `<sid>adm` on every application server — \"exploitation requires no credentials, no certificate, and no pre-existing misconfiguration\" ("
    urls: ["https://onapsis.com/blog/s4get-cve-2026-58240-sap-message-server-threat-advisory/"]
  - claim_id: 408ae5ef75
    entry: 2026-09-10/sap-september-2026-overpass-s4get-preauth-rce
    surface: "body"
    kind: cited
    text: "Neither flaw is confirmed exploited as of publication, but Onapsis notes SAP patches have historically been reverse-engineered into working exploits within 72 hours — as happened with the RECON vulnerability (CVE-2020-6287) — and that window keeps shrinking with AI-assisted tooling, while a comparable pre-auth SAP disclosure (CVE-2025-31324) became 2025's most-exploited CVE by Mandiant's count ("
    urls: ["https://onapsis.com/blog/sap-overpass-remediation/"]
  - claim_id: 40cf1e2d06
    entry: 2026-09-10/sap-september-2026-overpass-s4get-preauth-rce
    surface: "body"
    kind: cited
    text: "**Triage:** an SAP Gateway or Message Server accepting an application-server registration from an IP address that is not a known application server, followed by invocations of RFC-callable programs from it, is the S4GET trust-abuse pattern Onapsis describes ("
    urls: ["https://onapsis.com/blog/s4get-cve-2026-58240-sap-message-server-threat-advisory/"]
  - claim_id: 3b7bd25376
    entry: 2026-09-10/sap-september-2026-overpass-s4get-preauth-rce
    surface: "body"
    kind: uncited
    text: "Because the flaw abuses the Gateway's trust-membership decision rather than its ACLs, the standard `secinfo`/`reginfo`/`ms/acl_info` hardening does not intercept it."
  - claim_id: d8328722fb
    entry: 2026-09-10/sap-september-2026-overpass-s4get-preauth-rce
    surface: "body"
    kind: uncited
    text: "Fixed via SAP Security Note 3747649 (OVERPASS, a single kernel patch closing all three routes, with an HTTP-only interim workaround in Note 3756304) and Note 3759472 (S4GET, kernel patch levels 9.16 PL100/9.18 PL32/9.19 PL17/9.20 PL7)."
  - claim_id: e4ac5bcf6a
    entry: 2026-09-10/sap-september-2026-overpass-s4get-preauth-rce
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** patch now rather than relying on network segmentation — both flaws are reachable through ports every normal SAP GUI/RFC deployment already exposes internally, so a \"not internet-facing\" argument does not close OVERPASS's Dispatcher/RFC routes or S4GET's Message Server port."
  - claim_id: 73c84e5727
    entry: 2026-09-10/sap-september-2026-overpass-s4get-preauth-rce
    surface: "section 2026-10-10T03:47:22Z"
    kind: cited
    text: "Onapsis Research Labs reports that on 2026-09-15 a group of researchers publicly released SAPMAP, an open-source (GPL 3.0) SAP discovery and exploitation toolkit that contains proof-of-concept exploits for both flaws, alongside ten standalone pre-authentication exploit files, post-authentication modules including an SAP ransomware proof of concept, and an automation loop that chains scanning, exploitation, enrichment and propagation ("
    urls: ["https://onapsis.com/blog/sapmap/"]
  - claim_id: b796aa609e
    entry: 2026-09-10/sap-september-2026-overpass-s4get-preauth-rce
    surface: "section 2026-10-10T03:47:22Z"
    kind: cited
    text: "The maintainers first indicated that the OVERPASS exploits were being withheld, but Onapsis found them in the repository commits, says every clone since the original publication includes them and tells defenders to assume the OVERPASS proofs of concept are public ("
    urls: ["https://onapsis.com/blog/sapmap/"]
  - claim_id: 585cfd2b3e
    entry: 2026-09-10/sap-september-2026-overpass-s4get-preauth-rce
    surface: "section 2026-10-10T03:47:22Z"
    kind: cited
    text: "Onapsis had not observed threat actors using the toolkit when it wrote, and notes that public proof-of-concept releases can often jumpstart attack campaigns within days or weeks ("
    urls: ["https://onapsis.com/blog/sapmap/"]
  - claim_id: ff07b58e21
    entry: 2026-09-10/sap-september-2026-overpass-s4get-preauth-rce
    surface: "section 2026-10-10T03:47:22Z"
    kind: cited
    text: "Senthorus assesses on 2026-10-06 that packaging the capabilities together could reduce the preparation an intrusion needs, and separates that from evidence of use, which would need incident reporting ("
    urls: ["https://blog.senthorus.ch/posts/sapmap_threat_assessment/"]
  - claim_id: 2a2a2dffa7
    entry: 2026-09-10/sap-september-2026-overpass-s4get-preauth-rce
    surface: "section 2026-10-10T03:47:22Z"
    kind: uncited
    text: "No source read reports exploitation of either flaw, and the fixes are unchanged: SAP Security Notes 3747649 and 3759472."
  - claim_id: 491d7ca20d
    entry: 2026-09-10/sap-september-2026-overpass-s4get-preauth-rce
    surface: "record 2026-10-10T03:47:22Z"
    kind: record-summary
    text: "An open-source SAP exploitation toolkit, SAPMAP, publicly released on 2026-09-15, carries proof-of-concept exploits for both flaws, including OVERPASS exploits that the maintainers first said they were withholding. Onapsis had not observed attackers using it when it wrote, and no exploitation is reported. The OVERPASS routes were re-cited to Onapsis and an unsupported discriminator in the triage line was removed."
  - claim_id: f5c21ac663
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "headline"
    kind: frontmatter
    text: "Zammad 7.2.2 fixes the exploited zammad-to-root escalation on DEB and RPM installs; the session-leak RCE has a public exploit"
  - claim_id: b182035e7d
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "summary"
    kind: frontmatter
    text: "DIVD, the Dutch vulnerability-disclosure CSIRT, says attackers entered its network on 2026-09-21 through two Zammad flaws it calls previously unknown: CVE-2026-102489, a session hijack leading to code execution as the zammad user in versions 6.3.0 to 6.5.4, and CVE-2026-102490, a local escalation from that user to root. NCSC-NL states both have been exploited since 21 September and CISA listed both in KEV on 2026-10-02; Zammad says the code-execution flaw is exploitable only on 6.5 and older, which receive no security fixes, and Horizon3 published the root cause and a working exploit for it on 2026-10-07. Zammad 7.2.2 (2026-10-08) fixes the root escalation, which affects only DEB and RPM (packager.io) installations; it follows 7.2.1 (2026-10-06), which fixed 27 newly published advisories in 7.2.0 and earlier, two rated critical, none with a CVE id and none reported exploited."
  - claim_id: 5ec7ff8ea6
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "actions[0]"
    kind: frontmatter
    text: "Copy the application and network logs of every self-hosted Zammad instance, then upgrade it to Zammad 7.2.2 (6.5 and older receive no security fixes, and 7.2.0 is affected by the 27 advisories Zammad published on 2026-10-06) or take it offline if it cannot be upgraded."
  - claim_id: d7f3609240
    entry: 2026-10-02/zammad-cve-2026-102489-102490-exploited-divd-breach
    surface: "actions[1]"
    kind: frontmatter
    text: "On every instance that was internet-reachable on 6.3.0 to 6.5.4 since 2026-09-21, run DIVD's log-check script and look for packages installed through the admin interface that you did not install and for a mail view template that overrides the built-in password-reset email, the route Horizon3's public exploit takes; on a DEB or RPM install where code ran as the zammad account, also treat the host as possibly root-compromised, because Zammad's advisory says an attacker with that foothold could have escalated to root within seconds, and look for root-owned files, services and processes you did not create."
