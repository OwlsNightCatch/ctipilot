    kind: cited
    text: "watchTowr Labs published a write-up on 2026-10-09 that follows the emergency patches build by build ("
    urls: ["https://labs.watchtowr.com/death-by-a-thousand-papercuts-papercut-pre-auth-rce-chain-and-patch-bypasses-wt-2026-0141-0144-cve-2026-82077-cve-2026-82078-cve-2026-81578/"]
  - claim_id: f06376c606
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "section 2026-10-10T03:46:27Z"
    kind: cited
    text: "Its timeline: the patch released on 28 August (26.0.4-PO build 76508) fixed two bypasses watchTowr had reported; watchTowr then bypassed the fix for the authentication bypass again (tracked internally as WT-2026-0143, no CVE assigned) and found a new post-authentication code-execution flaw in Scan-to-Fax (WT-2026-0144, now CVE-2026-82077), which together gave a full unauthenticated chain against build 76508; the patch released on 1 September (build 76530) fixes WT-2026-0143, and 26.0.5, released on 10 September, fixes CVE-2026-82077 ("
    urls: ["https://labs.watchtowr.com/death-by-a-thousand-papercuts-papercut-pre-auth-rce-chain-and-patch-bypasses-wt-2026-0141-0144-cve-2026-82077-cve-2026-82078-cve-2026-81578/"]
  - claim_id: d14ddfe8a5
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "section 2026-10-10T03:46:27Z"
    kind: cited
    text: "The authentication bypass abuses the Setup Wizard forms, which the earlier patches had ignored: every stage can be reached through the `Home` page even after setup is complete, and watchTowr shows it modifies the administrator password ("
    urls: ["https://labs.watchtowr.com/death-by-a-thousand-papercuts-papercut-pre-auth-rce-chain-and-patch-bypasses-wt-2026-0141-0144-cve-2026-82077-cve-2026-82078-cve-2026-81578/"]
  - claim_id: 7b25c92f10
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "section 2026-10-10T03:46:27Z"
    kind: cited
    text: "). watchTowr also publishes a Detection Artefact Generator that tests a server's exposure to the authentication bypasses but does not run the full chain ("
    urls: ["https://labs.watchtowr.com/death-by-a-thousand-papercuts-papercut-pre-auth-rce-chain-and-patch-bypasses-wt-2026-0141-0144-cve-2026-82077-cve-2026-82078-cve-2026-81578/"]
  - claim_id: bbff07688d
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "section 2026-10-10T03:46:27Z"
    kind: cited
    text: "PaperCut's September security bulletin lists CVE-2026-82077 as a code-execution flaw in the Scan-to-Fax component that needs an authenticated administrator, rated CVSS 4.0 7.3, fixed in 26.0.5 and 25.0.13, and says servers already on the latest release are covered ("
    urls: ["https://www.papercut.com/kb/Main/security-bulletin-sep-2026/"]
  - claim_id: 6936d89bd3
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "section 2026-10-10T03:46:27Z"
    kind: cited
    text: "PaperCut says Emergency Patch Release 3 closes off additional attack vectors it has observed being exploited in the wild, without naming them ("
    urls: ["https://www.papercut.com/kb/Main/security-bulletin-27-aug-2026-urgent-security-advisory/"]
  - claim_id: 060557130b
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "section 2026-10-10T03:46:27Z"
    kind: uncited
    text: "The unauthenticated chain watchTowr describes is closed by the 1 September patch, but an administrator-level foothold still reaches code execution through Scan-to-Fax until the maintenance release is installed."
  - claim_id: 06ab480dba
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "section 2026-10-10T03:46:27Z"
