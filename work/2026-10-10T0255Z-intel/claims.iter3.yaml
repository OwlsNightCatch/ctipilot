  - claim_id: 69f8c5e55b
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "body"
    kind: cited
    text: "PaperCut has been targeted before: Rapid7 notes that in 2023 CVE-2023-27350 was broadly exploited in the wild by multiple threat-actor groups, including ransomware operators, which raises the urgency of this new zero-day ("
    urls: ["https://www.rapid7.com/blog/post/etr-papercut-ng-mf-critical-zero-day-exploited-in-the-wild/"]
  - claim_id: b391a6dffe
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "body"
    kind: cited
    text: "PaperCut disclosed on 27 August 2026 that it was investigating active exploitation of a new flaw in the same product line, before any CVE, patch or public technical detail existed ("
    urls: ["https://labs.watchtowr.com/death-by-a-thousand-papercuts-papercut-pre-auth-rce-chain-and-patch-bypasses-wt-2026-0141-0144-cve-2026-82077-cve-2026-82078-cve-2026-81578/"]
  - claim_id: acafea0f07
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "body"
    kind: cited
    text: "); Rapid7 relays PaperCut's statement that information supplied by a university customer's security team and its digital forensics and incident response team enabled PaperCut to reproduce the vulnerability ("
    urls: ["https://www.rapid7.com/blog/post/etr-papercut-ng-mf-critical-zero-day-exploited-in-the-wild/"]
  - claim_id: 5fd7186016
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "body"
    kind: cited
    text: "PaperCut's own authorization check validates only the page selected for rendering, not the component that runs behind it — so a request that asks Tapestry to render the public, unauthenticated Error, Exception, or Home page while invoking the administrative `ConfigEditor` or `UserList` component bypasses authentication entirely ("
    urls: ["https://www.rapid7.com/blog/post/etr-papercut-ng-mf-critical-zero-day-exploited-in-the-wild/"]
  - claim_id: 2f444ec8f9
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "body"
    kind: cited
    text: "Through three such POST requests — `/app?service=direct/1/Error/ConfigEditor/quickFindForm`, `.../ConfigEditor/$Form`, and `.../UserList/$QuickFind.$Form` — an unauthenticated attacker rewrites four external card/ID lookup settings (`user-lookup.db-driver`, `user-lookup.db-url`, `user-lookup.id-to-username-sql`, `user-lookup.enabled`) that normally point PaperCut at an administrator-configured external card database ("
    urls: ["https://www.rapid7.com/blog/post/etr-papercut-ng-mf-critical-zero-day-exploited-in-the-wild/"]
  - claim_id: 333994c528
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "body"
    kind: cited
    text: "Redirected instead to an attacker-controlled JDBC target through PaperCut's bundled Apache Derby driver and its `foreignViews` feature, the connection reaches an attacker-controlled H2 database whose inline `INIT` statement creates a JavaScript-backed trigger; PaperCut's bundled Nashorn JavaScript engine then executes that trigger to launch an operating-system process — full remote code execution as the PaperCut server, triggered the moment the forged `UserList` search runs the malicious lookup ("
    urls: ["https://www.rapid7.com/blog/post/etr-papercut-ng-mf-critical-zero-day-exploited-in-the-wild/"]
  - claim_id: 73c5d03654
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "body"
    kind: cited
    text: "This is a two-CVE chain: CVE-2026-81578 (CWE-306, missing authentication) is the pre-auth entry that gains write access to the server configuration; CVE-2026-82078 (CWE-470, unsafe dynamic class loading) is the flaw that turns a reconfigured database connection into arbitrary Java bytecode execution once that write access is held ("
    urls: ["https://www.papercut.com/kb/Main/security-bulletin-27-aug-2026-urgent-security-advisory/"]
  - claim_id: 00bee77116
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "body"
    kind: cited
    text: "Huntress observed two live customer exploitations: one on 26 August lasting under two minutes against version 25.0.10.75465, and a second on 27 August against version 24.1.5.71847 — before Emergency Patch Release 2 extended coverage to the v24 line ("
    urls: ["https://www.huntress.com/blog/papercut-actively-exploited"]
  - claim_id: bb7847dc91
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "body"
    kind: cited
    text: "In both cases the attacker ran base64-encoded discovery commands (`whoami & ver`, and separately `whoami & ver & tasklist`) via a dropped, OS-agnostic Java `.class` file that wrote its output to a temporary file and then deleted both that file and the server's own `server.log` ("
    urls: ["https://www.huntress.com/blog/papercut-actively-exploited"]
  - claim_id: 4e97a48625
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "body"
    kind: cited
    text: "Huntress's own proof-of-concept reproduced the full chain against a stock PaperCut NG install and observed the code execution surface as an observable `charmap.exe` process running as SYSTEM, spawned under the PaperCut Application Server's own `pc-app.exe` process ("
    urls: ["https://www.huntress.com/blog/papercut-actively-exploited"]
  - claim_id: 0e1508796d
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "body"
    kind: cited
    text: "PaperCut released an initial emergency patch for v25 and v26 on 28 August and patches for v24 later the same day, and Rapid7 says the first patch could be bypassed by using the Home page for display while the newest version of the vendor patch remediates that bypass ("
    urls: ["https://www.rapid7.com/blog/post/etr-papercut-ng-mf-critical-zero-day-exploited-in-the-wild/"]
  - claim_id: 26182ef731
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "body"
    kind: cited
    text: "PaperCut then superseded the earlier emergency patches with Emergency Patch Release 3 on 1 September 2026 and replaced all three emergency patches on 10 September with fully tested maintenance releases (see the updates below) ("
    urls: ["https://www.papercut.com/kb/Main/security-bulletin-27-aug-2026-urgent-security-advisory/"]
  - claim_id: 4a99fa97af
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "body"
    kind: cited
    text: "There is no fix for v23 and earlier; PaperCut's guidance for that line is to upgrade to a supported version ("
    urls: ["https://www.papercut.com/kb/Main/security-bulletin-27-aug-2026-urgent-security-advisory/"]
  - claim_id: 37b63e7eb9
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "body"
    kind: cited
    text: "), and Huntress estimates 47% of the roughly 2,500 PaperCut installations it tracks still run v23 or older ("
    urls: ["https://www.huntress.com/blog/papercut-actively-exploited"]
  - claim_id: fc4262ed0b
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "body"
    kind: cited
    text: "Two log artifacts are near-unique indicators: a `server.log` line reading `DB URL: jdbc:derby:memory:pwn`, and a corresponding `derby.log` entry recording Derby booting an in-memory database directory whose name ends in the literal string `pwn` ("
    urls: ["https://www.huntress.com/blog/papercut-actively-exploited"]
  - claim_id: d8f40c11b9
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "body"
    kind: cited
    text: "PaperCut stresses that the absence of its file artifacts does not rule out compromise because the attacker may clean them up ("
    urls: ["https://www.papercut.com/kb/Main/security-bulletin-27-aug-2026-urgent-security-advisory/"]
  - claim_id: b4650d80c9
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "body"
    kind: cited
    text: "), and Huntress observed the payload deleting the server's own `server.log` ("
    urls: ["https://www.huntress.com/blog/papercut-actively-exploited"]
  - claim_id: c902325eed
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "body"
    kind: cited
    text: "The later authentication bypass that watchTowr documents reaches the Setup Wizard pages through the `Home` page, so requests whose `service` parameter routes through `Home` to a setup page such as `SetupAdmin` on a server whose setup is long complete are the matching pattern ("
    urls: ["https://labs.watchtowr.com/death-by-a-thousand-papercuts-papercut-pre-auth-rce-chain-and-patch-bypasses-wt-2026-0141-0144-cve-2026-82077-cve-2026-82078-cve-2026-81578/"]
  - claim_id: f71b867e3a
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "body"
    kind: uncited
    text: "PaperCut's Application Server runs on the Apache Tapestry web framework, whose \"complex direct\" request format lets a single HTTP request name one page to render and a different page's component to actually execute."
  - claim_id: b37b17fe62
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "body"
    kind: uncited
    text: "PaperCut treats **all versions** of NG and MF as potentially affected."
  - claim_id: ec0064c0a1
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "body"
    kind: uncited
    text: "Detection, telemetry class first: alert on any child process spawned from `pc-app.exe` or the PaperCut Application Server's Java process, the lineage under which the observed exploitation ran its discovery commands."
  - claim_id: 86f8dfb7e4
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "body"
    kind: uncited
    text: "Web-access logs for the PaperCut Application Server should be checked for POST requests to `/app?service=direct/*/{Error,Exception,Home}/ConfigEditor/*` or `.../UserList/$QuickFind.$Form` from unauthenticated or external sources — this URL shape is not a pattern ordinary PaperCut administration produces."
  - claim_id: 7c5f0b1093
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "body"
    kind: uncited
    text: "**Triage:** an unexpectedly truncated, gapped, or missing `server.log` on a PaperCut Application Server is not normal application behavior — legitimate log rotation does not delete mid-file — and is itself a high-confidence signal worth investigating even where no other artifact survives."
  - claim_id: b34bec7428
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
    surface: "body"
    kind: uncited
    text: "**Defender takeaway:** any PaperCut NG/MF Application Server that has ever been reachable from the public internet should be assumed targeted; upgrade it to the maintenance release for its line immediately, and where v23 or earlier cannot yet be replaced, remove public exposure entirely rather than relying on detection alone."
  - claim_id: 09ac458289
    entry: 2026-08-29/papercut-ng-mf-tapestry-request-confusion-preauth-rce
