    entry: 2026-10-10/cve-2026-84411-mikrotik-routeros-web-management-preauth-rce
    surface: "summary"
    kind: frontmatter
    text: "MikroTik's notice of 2026-10-06 describes CVE-2026-84411, an integer underflow in HTTP request body handling of the RouterOS web management service (WebFig, on the www and www-ssl ports) that one crafted request sent without logging in can use to crash the service or run code on the router with full privileges; CISA scores it CVSS 3.1 9.8. RouterOS before 7.24, v6 included, is affected where an attacker can reach the web interface; 7.24 fixes the v7 stable channel, the v7 and v6 long-term releases are pending, MikroTik says the default firewall already blocks the web interface from the internet, and CISA records no known public exploitation."
  - claim_id: 2f615cabf5
    entry: 2026-10-10/cve-2026-84411-mikrotik-routeros-web-management-preauth-rce
    surface: "actions[0]"
    kind: frontmatter
    text: "Find every RouterOS device whose www or www-ssl service answers from a network you do not trust and upgrade v7 stable devices to 7.24 or later; where the v7 or v6 long-term release is still pending, restrict www and www-ssl under IP > Services to trusted addresses or disable them and manage the router over WinBox, SSH or a VPN."
