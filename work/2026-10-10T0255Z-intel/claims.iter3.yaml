  - claim_id: 717c44dc62
    entry: 2026-10-08/cve-2026-102255-sonicwall-sma1000-workplace-ssrf
    surface: "summary"
    kind: frontmatter
    text: "SonicWall's advisory SNWLID-2026-0017 (2026-10-06) fixes four SMA1000 flaws, led by CVE-2026-102255, a pre-authentication server-side request forgery in the Work Place interface (CVSS 3.0 10.0) that affects 12.4.3-03526 and 12.5.0-02952, the hotfixes issued for the September zero-days; fixed builds are 12.4.3-03670 and 12.5.0-03082. On 2026-10-09 the honeypot operator Previdian told BleepingComputer it had detected exploitation attempts against the flaw, without establishing whether any would have compromised a system, while SonicWall's advisory still says it has no evidence of exploitation; the two earlier unauthenticated Work Place SSRF flaws this year were exploited, each paired with an administrator-only command-execution flaw."
  - claim_id: bffd45574a
    entry: 2026-10-08/cve-2026-102255-sonicwall-sma1000-workplace-ssrf
    surface: "actions[0]"
    kind: frontmatter
    text: "Install SonicWall's platform hotfix 12.4.3-03670 or 12.5.0-03082 (or higher) on every SMA1000 6210, 7210 and 8200v, internet-reachable appliances first and including appliances already on the 12.4.3-03526 or 12.5.0-02952 hotfix from September; the appliance restarts when the installation finishes and no workaround is listed."
  - claim_id: 34f17819f8
    entry: 2026-10-08/cve-2026-102255-sonicwall-sma1000-workplace-ssrf
    surface: "actions[1]"
    kind: frontmatter
    text: "On every SMA1000 whose Work Place interface was internet-reachable before the hotfix, check its web access log back to 2026-10-06, the day the advisory was published, for the requests Previdian describes and, on a hit, run the compromise check SonicWall's earlier guidance describes."
