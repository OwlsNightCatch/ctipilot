    text: "Huntress observed from 2026-10-07 23:20 UTC attackers chaining two AhsayCBS flaws, CVE-2026-105133 (authentication bypass) and CVE-2026-105134 (code execution as SYSTEM through the Replication Receiver API), against internet-exposed servers of the backup management console that managed service providers and system integrators mainly use, dropping JSP webshells and an XMRig cryptominer; BleepingComputer reports at least five organizations targeted and a public exploit for the first flaw. Public records listed versions up to 10.3.2 as affected, but Huntress found on 2026-10-08 that 10.3.4, which BleepingComputer calls the latest version, is also affected, and no fixed release is named, so restricting the management interface is the interim control."
