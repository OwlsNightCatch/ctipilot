items:
  - title: "PK Softech supply-chain intrusion widens: Bernische Pensionskasse (cantonal staff and three cantonal universities) and BLVK (teachers) confirm the same supplier as Publica, and Migros, Post and Syngenta pension funds are reviewing outflow"
    sources:
      - { url: "https://www.bpk.ch/fileadmin/redaktion/3_Kundenservice/3.4_Mitteilungen/Cybervorfall_Softwarelieferantin_BPK_D.pdf", publisher: "Bernische Pensionskasse (BPK)", date: "2026-10-09", role: "primary" }
