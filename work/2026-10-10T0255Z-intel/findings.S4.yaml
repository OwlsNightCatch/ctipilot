      - { url: "https://www.netzwoche.ch/news/2026-10-08/bundespensionskasse-publica-meldet-datenabfluss", publisher: "Netzwoche", date: "2026-10-09", role: "corroborating" }
      - { url: "https://pksoftech.ch/de/newsreader/Cyberangriff-auf-die-PKSoftechAG", publisher: "PK Softech AG", date: "2026-10-08", role: "corroborating" }
    discovery_trace: "first seen at: inside-it-ch RSS, URL https://www.inside-it.ch/rss.xml (item 'Weitere Pensionskassen pruefen Datenabfluesse', fetched at https://www.inside-it.ch/weitere-pensionskassen-pruefen-datenabfluesse-20261009) -> pivot: Netzwoche live update, URL https://www.netzwoche.ch/news/2026-10-08/bundespensionskasse-publica-meldet-datenabfluss (adds the Canton of Bern notice) -> pivot: BPK website, URL https://www.bpk.ch/ -> primary: BPK notice PDF dated 09.10.2026, URL https://www.bpk.ch/fileadmin/redaktion/3_Kundenservice/3.4_Mitteilungen/Cybervorfall_Softwarelieferantin_BPK_D.pdf; supplier notice re-read at https://pksoftech.ch/de/newsreader/Cyberangriff-auf-die-PKSoftechAG"
    summary: |
      Delta on the already-covered PK Softech AG (Reinach BL) intrusion, which the 2026-10-09 entry carried as a Publica-only supply-chain incident with the supplier's other customers unnamed. FACTS from first-party statements: the Bernische Pensionskasse (BPK) states in a notice dated 2026-10-09 that an external software supplier detected a cyberattack at the end of September 2026 and that "the supplier is the same firm that also supplies the federal pension fund Publica"; the supplier filed a criminal complaint, informed the relevant federal bodies and its customers, various federal bodies are working with it to establish which data is affected, and the Federal Prosecutor's Office has opened an investigation. BPK says there are at present no indications that BPK data was stolen but that this cannot be ruled out entirely, and that insured persons are being informed. Netzwoche (live update of 2026-10-09) relays that the Canton of Bern announced the attack on an unnamed external software supplier of pension funds and names the Bernische Pensionskasse and the Bernische Lehrerversicherungskasse (BLVK) as concretely affected; per Netzwoche BPK insures the cantonal personnel and the personnel of the three cantonal universities (42,145 active insured and 18,321 pensioners at 2025-12-31) and BLVK the Bernese teaching staff (21,417 active and 10,259 pensioners). inside-it.ch, relaying the AWP agency, reports that PK Softech's customers include, among others, BLVK, BPK, Migros-Pensionskasse, Pensionskasse Post and Syngenta Pensionskasse (roughly 75,500, 37,500 and 5,000 insured for the last three), that these funds are checking with PK Softech for possible data outflow, have informed the competent authorities and filed criminal complaints, and that each stresses insured persons currently need take no action. PK Softech's own notice (2026-10-08) says it must be assumed data left its systems, type and scope still under investigation, and that since 2 October 2026 it is again fully available to customers. UNKNOWN in every source: which data classes belong to which fund, the access vector (PK Softech says only 'malware'), the actor, and whether a ransom was demanded. INFERENCE (Netzwoche's, not an assessment of any authority): it calls the Bern-to-PK-Softech link 'obvious' because the supplier's site names both funds; BPK's own notice removes the need for that inference by stating the supplier is Publica's.
    region_nexus: "Switzerland: first confirmed cantonal-level (Canton of Bern) and Swiss Post-adjacent exposure in a supplier incident that began as a federal (Publica) one; the federal release says no other federal office has a business relationship with the supplier"
    primary_sector_nexus: "direct"
    sector: "public-sector"
