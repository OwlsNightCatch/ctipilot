    extended_notes: |
      Why this is an update and not a new entry: same finding (one supplier, one intrusion), same entity key; what changed is the exposed population (cantonal and teacher pension funds, and private-sector funds, added to the federal one) and the supplier-customer list becoming public. The BPK PDF is the first-party statement; the Canton of Bern's own press release was not located on any fetchable cantonal page (be.ch media-release index returned 404, fin.be.ch carried no item), so the cantonal statement rests on Netzwoche's relay and on BPK's own notice. The BLVK carries a homepage banner dated about 2026-10-08 ('Cyberangriff auf Softwarelieferant', 'Ein externer Softwarelieferant der BLVK wurde Opfer eines Cyberangriffs', asks members to stay careful with unusual calls or messages); the BLVK notice PDF reset the connection on a repeat fetch so it is not cited. Pensionskasse Post (pkpost.ch news item dated 09.10.2026) and Migros-Pensionskasse (mpk.ch Mitteilungen item dated 08.10.2026) each carry a short notice naming PK Softech; both are listing-level pages and are not cited. Defender framing the composer may use: (1) bodies whose staff are insured with BPK or BLVK (Canton of Bern administration, the three cantonal universities, Bernese schools) should expect the same social-engineering exposure the Publica entry already describes (AHV number, salary and pension data as call-back lures); (2) every other canton, commune or public institution that runs pension-fund, HR or payroll administration on PK Softech software (the 'PK/S' product line named on the supplier's site) should ask the supplier in writing whether its data was in the affected environment, because the public customer list is explicitly 'among others'; (3) the supplier says it has been fully available again since 2 October, so service restoration is not evidence that the investigation of data outflow is complete.
