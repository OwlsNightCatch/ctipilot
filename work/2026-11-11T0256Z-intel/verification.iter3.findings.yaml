- code: F3
  category: claim-not-supported
  section: vulnerabilities
  item: "2026-10-31/cve-2026-98432-linux-kernel-tcp-uaf-mptcp-remote-root: title, summary, cves[].affected, Defender takeaway, section 2026-11-11T03:55:45Z, record summary"
  url_or_quote: "https://ubuntu.com/security/CVE-2026-98432 | \"Ubuntu 20.04 and older and its HWE, cloud and FIPS kernels were not out on 2026-11-10\" | \"the HWE, cloud and FIPS kernels were still in progress\" | \"the HWE, cloud, FIPS and Raspberry Pi kernels still in progress\""
  summary: "Tracker (last updated 10 November 2026, read live): linux-aws, linux-azure, linux-gcp, linux-oracle are Fixed on 22.04, 24.04, 26.04 and 26.10 (e.g. linux-aws 22.04 Fixed in 5.15.0-1120.127, linux-azure 24.04 Fixed in 6.8.0-1073.82), linux-aws-fips/linux-azure-fips/linux-gcp-fips are Fixed, linux-raspi is Fixed on 22.04, 24.04 and 26.10 (only 26.04 is in progress). Only some variants are in progress (linux-hwe-6.8, linux-hwe-7.0, linux-azure-7.0, linux-azure-fde 24.04, linux-azure-nvidia, linux-fips, linux-nvidia, linux-raspi 26.04). The blanket 'HWE, cloud, FIPS (and Raspberry Pi) kernels in progress' tells Ubuntu cloud users nothing is out when it is. Scope to the named in-progress variants (or say 'some HWE, FIPS, NVIDIA and Azure 24.04 variant kernels') and drop 'cloud' and 'Raspberry Pi' as categories."
