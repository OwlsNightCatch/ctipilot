- code: F8
  category: needs-more-research
  section: vulnerabilities
  item: "2026-11-10/sap-november-2026-cna-records-four-unauth-cvss-10-rows: ProxyGate paragraph, summary, cves[CVE-2026-89103].type"
  url_or_quote: "ProxyGate is a kernel flaw whose exploitability depends on the Gateway's proxy access list ... (https://onapsis.com/blog/proxygate-cve-2026-89103-sap-netweaver-gateway-threat-advisory/)"
  summary: "Onapsis states 'PROXYGATE is a pre-authentication remote code execution vulnerability in the SAP Gateway. An unauthenticated attacker with network access runs operating system commands as <sid>adm (gaining complete control of the SAP system) with no credentials and no user interaction.' The entry gives the impact only for ICM2SHELL and describes ProxyGate as an access-list categorisation (type auth-bypass), so a reader cannot see that the Gateway flaw is also unauthenticated command execution as <sid>adm. Add the impact sentence with the Onapsis citation and reconsider the cves[] type."
