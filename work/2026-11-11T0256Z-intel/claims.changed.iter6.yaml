  - claim_id: 4a77512999
    entry: 2026-11-11/adobe-connect-apsb26-191-five-unauthenticated-cvss-10-rows
    surface: "summary"
    kind: frontmatter
    text: "Adobe's priority 2 bulletin APSB26-191 of 2026-11-10 fixes 24 CVEs in Adobe Connect on Windows 12.12 and earlier, five of them scored CVSS 3.1 10.0 with no privileges and no user interaction (SSRF, path traversal, incorrect authorization and CRLF injection) and two more unauthenticated rows at 9.4 (SQL injection) and 9.1. The fixed builds are 12.12.a, 12.11.i, 12.10.f, 12.9.a and 12.8.a; Adobe is not aware of exploitation and the bulletin gives no root-cause detail."
  - claim_id: c6b49295c9
    entry: 2026-11-11/adobe-connect-apsb26-191-five-unauthenticated-cvss-10-rows
    surface: "actions[0]"
    kind: frontmatter
    text: "Update every Adobe Connect server on Windows to the fixed build of its train (12.12.a, 12.11.i, 12.10.f, 12.9.a or 12.8.a), those reachable from the internet first, because five flaws need no privileges and no user interaction and Adobe names no mitigation."
