- title: >-
    CNIL sanctions ten French local authorities and one public body for cybersecurity failings: no MFA for administrators, permanent or shared
    supplier access, unused logs, flat networks, unsupported server systems (fines EUR 3,000 to 20,000)
  sources:
  - url: https://www.cnil.fr/fr/sanctions-cybersecurite-collectivites-territoriales
    publisher: CNIL
    date: '2026-11-09'
    role: primary
  - url: https://www.zataz.com/cybersecurite-la-cnil-sanctionne-dix-collectivites/
    publisher: ZATAZ
    date: '2026-11-09'
    role: corroborating
  discovery_trace: >-
    first seen at: zataz feed, URL https://www.zataz.com/feed/ (item 'Cybersécurité : la CNIL sanctionne dix collectivités') -> pivot: ZATAZ article,
    URL https://www.zataz.com/cybersecurite-la-cnil-sanctionne-dix-collectivites/ -> primary: CNIL press release found on the CNIL news listing
    (url bridge of https://www.cnil.fr/fr/actualites), URL https://www.cnil.fr/fr/sanctions-cybersecurite-collectivites-territoriales. Not in
    prior_coverage.json.
  summary: >-
    The CNIL says that in November 2026 it pronounced ten simplified-procedure sanctions against territorial authorities and one public establishment
    for cybersecurity failings under GDPR Article 32, after a 2025 inspection theme on local-authority security that also covered their suppliers.
    The failings it lists: remote-access authentication too weak, notably no multi-factor authentication for administrators; software suppliers
    with permanent access to the authority's network, not authorised case by case, or using accounts shared between employees; ineffective detection
    (incomplete logging, no real-time or short-term use of logs); insufficient network segmentation that can spread a breach across segments;
    server operating systems no longer maintained by the vendor; weak, plaintext-transmitted or insecurely stored passwords. Several decisions
    also note that online-service systems had no security accreditation (RGS homologation) before go-live, and several authorities were sanctioned
    for missing data-protection impact assessments for school-activity portals for parents and for public-road video surveillance. Fines range
    from EUR 3,000 to 20,000, the legal maximum of the procedure; the CNIL says some inspected authorities had suffered breaches that adequate
    measures could have prevented, and that it devotes half of its 2026 inspection and enforcement effort to data security.
  region_nexus: France; no Swiss nexus stated, directly comparable communal and cantonal IT estate
  primary_sector_nexus: 'indirect: regulator findings on local-authority security that mirror Swiss communal exposure'
  sector: public-sector; local government
  cves: []
  techniques: []
  technique_notes: Regulatory enforcement; no attacker behaviour.
  affected_products: []
  entity_keys: []
  new_entities: []
  relation_suggestions: []
  verification: SINGLE-SOURCE-OTHER
  confidence: HIGH
  admiralty_suggestion:
    reliability: A
    credibility: '2'
    why: the regulator is first-hand for its own decisions; ZATAZ only relays the release
  novelty: new
  borderline: true
  borderline_reason: >-
    Regulator enforcement abroad (France), dated 2026-11-09 by the CNIL page (page metadata 2026-11-10), at the edge of the 26 h window, and a
    policy/obligations item that the S2 lane may also return; no Swiss link stated. Worth a place only if the brief carries a communal-security-baseline
    item today.
  evidence:
  - quote: >-
      En novembre 2026, la CNIL a prononcé dix sanctions simplifiées à l’encontre de collectivités territoriales et d’un établissement public,
      pour des manquements relatifs à la cybersécurité.
    attribution: CNIL
    source_url: https://www.cnil.fr/fr/sanctions-cybersecurite-collectivites-territoriales
    english_gloss: In November 2026 the CNIL pronounced ten simplified sanctions against territorial authorities and one public establishment
      for cybersecurity failings.
  - quote: absence d’authentification multifacteur pour les administrateurs
    attribution: CNIL
    source_url: https://www.cnil.fr/fr/sanctions-cybersecurite-collectivites-territoriales
    english_gloss: no multi-factor authentication for administrators
  - quote: >-
      certains prestataires extérieurs (par exemple, des éditeurs de logiciels) pouvaient accéder au réseau des collectivités de manière permanente,
      sans y être autorisés au cas par cas, ou via des comptes partagés entre plusieurs salariés
    attribution: CNIL
    source_url: https://www.cnil.fr/fr/sanctions-cybersecurite-collectivites-territoriales
    english_gloss: >-
      some outside providers (for example software vendors) could access the authorities' network permanently, without case-by-case authorisation,
      or through accounts shared among several employees
  extended_notes: >-
    Why it matters to defenders: the CNIL list is a regulator-tested baseline for a commune or canton: MFA on every remote and privileged login,
    supplier access that is per-intervention and attributable, logs that are read, segmentation, and no unsupported server systems. No Swiss enforcement
    equivalent is claimed.
