  summary: >-
    PK Softech published on 2026-11-10, 'because of media speculation', that no concrete ransom demands have reached the company and that it never
    contacted the attackers; its investigation continues. Keystone-ATS, relayed by tio.ch, reports that the spokesperson of the State Secretariat
    for Security Policy (SEPOS), Ursina Bentele, said the federal authorities involved know of no concrete ransom demand addressed to them, that
    the Confederation has paid no ransom, and that SEPOS has no indication that the stolen data has been published on the darknet. The same wire
    report also says the supplier received a demand without amount or deadline, which contradicts PK Softech's own statement of the same day;
    the supplier's statement is the first-hand one. The delta qualifies the existing entry's Tamedia-sourced claim that Akira holds about 100
    GB and demands ransom: the supplier and SEPOS now publicly say no concrete demand is known to them, while the Akira attribution and the data
    volume remain press-sourced and unconfirmed by the authorities.
