    French) found nothing newer: the search index lags.
  summary: >-
    VRT NWS reports that on the afternoon of 2026-11-10 the Brussels university hospital UZ Brussel (Jette) was the first of several Belgian hospitals
    to report network problems that hit its IT infrastructure and telephone system: the electronic patient record cannot be read or written, appointments
    and phone contact fail, only urgent interventions run, and the emergency department is diverted until at least 2026-11-11, with ambulances
    going to neighbouring hospitals (AZ Jan Portaels in Vilvoorde reported all emergency beds occupied). AZ Monica (Antwerp), Heilig Hart (Lier)
    and Sint-Andries (Tielt) were affected because they run the same patient-record software, developed at UZ Brussel (PrimUZ, per the VRT live
    blog) with data on UZ Brussel servers; AZ Monica diverted its mobile emergency and paramedic intervention teams, Lier and Tielt went to paper.
    AZ Jan Palfijn (Ghent) says it was disconnected from UZ Brussel's servers in time and has no impact, and AZ Rivierenland and AZ Sint-Elisabeth
    (Zottegem) host their own PrimUZ servers and are unaffected. The cause is unknown; UZ Brussel's spokesperson said repeatedly that there are
    no indications of a cyberattack, and the hospital's IT staff were working through the night, with resolution by 2026-11-11 uncertain.
