- title: >-
    Five Japanese bulk-email SaaS providers breached between 11 and 27 October 2026: tens of millions of recipient addresses taken and delivery
    functions abused for millions of phishing emails; Cuenote's third report adds session theft and abuse of the legitimate CSV export
  sources:
  - url: https://www.cuenote.jp/support/news-incident.html
    publisher: Ymir Link (Cuenote)
    date: '2026-11-11'
    role: primary
  - url: https://info.blastmail.jp/information_20261021.html
