    date: '2026-11-09'
    role: corroborating
  discovery_trace: >-
    first seen at: piyolog (slice record), URL https://piyolog.hatenadiary.jp/ (url bridge lists entry URLs) -> pivot: Piyolog compile, URL https://piyolog.hatenadiary.jp/entry/2026/11/09/230435
    -> primary: Ymir Link Cuenote third report (updated 2026-11-11 10:00 JST), URL https://www.cuenote.jp/support/news-incident.html; RAX Light
    Cloud Blastmail notice (updated 2026-11-10 18:40 JST), URL https://info.blastmail.jp/information_20261021.html; Arcadia SpeeCAN RAIDEN blog,
    URL https://raiden.site.ktaiwork.jp/archives/4597. Alara Message and Y-Mail (Igreks) are cited through the Piyolog compile only (their own
    notices were not read in full).
  summary: >-
    Five Japanese bulk-email and notification SaaS providers published breaches within about two weeks (first activity 11 to 27 October 2026);
    per Piyolog's compile of their notices, none of the vendors relates its incident to the others. Ymir Link's third Cuenote report (2026-11-11)
    says a program vulnerability let attackers plant malware, reach the database directly and move through the internal management network using
    shared maintenance and QA accounts, and that a second method stole the session information of logged-in legitimate users and then used the
    console's normal CSV download to take data, which looked like ordinary admin work and was found only by a retrospective session-log audit
    that raised the affected Cuenote FC systems from 5 to 49; it counts 47,864,147 recipient-list records. RAX Light Cloud's notice of 2026-11-10
    says the information of all Blastmail contractors was taken from its sales-management system, with some recipient lists also leaked, the service
    has been down since 2026-10-21, the external investigation finished that day with no further leakage found, and the service restarts on 2026-11-11;
    per Piyolog its earlier notice said two API servers were entered and commands run before the sales system and service database were reached.
    Per Piyolog, Alara Message (web-server flaw plus an environment weakness) had its delivery function abused for up to about 7.13 million phishing
    mails and lost about 81.3 million address records; Arcadia's SpeeCAN RAIDEN, a service that handles disaster information and sits alongside
    its NET119 emergency-report system, lost its inter-service secret key through a directory-traversal flaw in a media server, was backdoored
    through a WordPress plugin and sent 1,423,428 phishing mails on 13 October and again on 22 to 23 October through the send API; Igreks' Y-Mail
    lost portal setup scripts that led into customers' delivery environments and sent about 1.34 million phishing mails. Cuenote applied IP restriction
    to every console and API on 2026-10-18 after finding environments that had none, and Arcadia added two-factor login from 2026-10-22; Igreks
    regenerated every customer's DKIM private key and moved to a DMARC reject policy (per Piyolog). Public-sector customers are among the affected
    Japanese bodies (Blastmail and Alara arranged proxy reporting to the data-protection regulator for administrative bodies and local governments,
    per Piyolog).
  region_nexus: Japan; no Swiss or European nexus stated
  primary_sector_nexus: 'indirect: public-sector and emergency-notification customers of the vendors in Japan; transferable SaaS-vendor TTP'
  sector: technology; email and notification SaaS; public-sector customers
