  evidence:
  - quote: >-
      Working with Sentra and Mandiant, Wiz observed a threat actor using IAM credentials from an AWS account associated with Qubole between October
      14 and October 26, 2026.
    attribution: Wiz
    source_url: https://www.wiz.io/blog/qubole-cross-account-access-abused-in-the-wild
  - quote: Every AssumeRole request we attributed to the threat actor included an External ID, and every one succeeded.
    attribution: Wiz
    source_url: https://www.wiz.io/blog/qubole-cross-account-access-abused-in-the-wild
  - quote: In this activity, a source IP condition alone would have blocked every role assumption we observed.
    attribution: Wiz
    source_url: https://www.wiz.io/blog/qubole-cross-account-access-abused-in-the-wild
  - quote: Dozens of Qubole customers were impacted.
    attribution: Sentra
    source_url: https://sentra.io/blog/breaches/inside-the-qubole-supply-chain-attack
  - quote: BleepingComputer could not find a public announcement from Qubole about this incident.
    attribution: BleepingComputer
    source_url: https://www.bleepingcomputer.com/news/security/hackers-exploit-trusted-aws-access-to-breach-multiple-cloud-environments/
  extended_notes: >-
    Exposure: any AWS account holding an IAM role whose trust policy names the Qubole vendor account, including roles left behind after Qubole
    stopped being used; read the roles' trust policies and last-used data. Detection: CloudTrail AssumeRole events whose calling identity is the
    vendor account but whose source address is not AWS infrastructure (Wiz: all legitimate platform traffic came from AWS infrastructure); role-session
    names with a fixed vendor-unrelated prefix (Wiz publishes it); sequences of ListBuckets, ListObjects, HeadObject, GetObject from an assumed
    integration role; ListSecrets/GetSecretValue, SSM GetParameter and Lambda GetFunctionConfiguration bursts; GetCallerIdentity calls from many
    keys within seconds and Entra ID or Okta sign-ins by service principals or clients right after (credential validation). Object reads are absent
    from management events: S3 data events or S3 server access logs must be on, and in several victim environments missing logs meant responders
    could not see what was read (Wiz). Wiz advises reviewing CloudTrail from 1 October 2026 in every account holding an integration role. Post-incident:
    the actor harvested the victims' own AWS keys, Entra ID client secrets and Okta client credentials, so rotation has to cover those and the
    External ID, not only the role. Hardening (Wiz): delete integration roles for vendors no longer used; narrow the trusted principal from the
    account root to the vendor's specific principal; add aws:SourceIp or aws:SourceVpce conditions to the vendor's documented ranges; treat the
    External ID as non-secret (it is logged in plaintext in CloudTrail); trim vendor-role permissions on Lambda configuration, Secrets Manager,
    SSM and broad S3 read; alert on role assumption from a vendor account through a VPN or hosting provider; keep an organisation trail across
    all accounts and regions. Swiss note: no Swiss or public-sector victim is named. The lesson transfers to any cantonal or communal cloud tenant
    that granted a vendor or integrator a cross-account role, and to the supplier relationships (PK Softech pattern) where the vendor's own identity
    is the weak point. The S3 sub-agent may also return Wiz's post; dedup on the Qubole entity.
