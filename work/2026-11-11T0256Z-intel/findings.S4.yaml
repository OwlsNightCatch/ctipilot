- title: >-
    Qubole: a stolen vendor AWS identity assumed customers' integration roles and bulk-read S3 data, secrets and Lambda configuration in more
    than a dozen organisations (14 to 26 October 2026)
  sources:
  - url: https://www.wiz.io/blog/qubole-cross-account-access-abused-in-the-wild
    publisher: Wiz
    date: '2026-11-09'
    role: primary
  - url: https://sentra.io/blog/breaches/inside-the-qubole-supply-chain-attack
    publisher: Sentra
    date: '2026-11-09'
    role: primary
  - url: https://www.bleepingcomputer.com/news/security/hackers-exploit-trusted-aws-access-to-breach-multiple-cloud-environments/
    publisher: BleepingComputer
    date: '2026-11-10'
    role: corroborating
  - url: https://www.securityweek.com/over-a-dozen-organizations-hit-in-qubole-supply-chain-attack/
    publisher: SecurityWeek
    date: '2026-11-10'
    role: corroborating
  discovery_trace: >-
    first seen at: bleepingcomputer feed, URL https://www.bleepingcomputer.com/feed/ (item 'Hackers exploit trusted AWS access to breach multiple
    cloud environments') -> pivot: BleepingComputer article, URL https://www.bleepingcomputer.com/news/security/hackers-exploit-trusted-aws-access-to-breach-multiple-cloud-environments/
    -> primary: Wiz research post, URL https://www.wiz.io/blog/qubole-cross-account-access-abused-in-the-wild -> co-discoverer: Sentra post, URL
    https://sentra.io/blog/breaches/inside-the-qubole-supply-chain-attack -> corroborating: SecurityWeek, URL https://www.securityweek.com/over-a-dozen-organizations-hit-in-qubole-supply-chain-attack/.
    Not in prior_coverage.json (no Qubole match).
  summary: >-
    Wiz, working with Sentra (which noticed the activity in its own customers' environments and reported it) and Mandiant, reports that between
    14 and 26 October 2026 a threat actor used credentials of two IAM users in an AWS account associated with the big-data platform Qubole to
    call sts:AssumeRole on the cross-account integration roles that customers had created to trust Qubole's account. Every request presented the
    correct External ID and succeeded; in most affected environments the roles had otherwise been idle (Sentra: dormant since spring), and all
    activity came from a rented hosting server and commercial VPN exits, not from the AWS infrastructure Qubole's platform normally uses. Inside
    each environment the actor listed resources, pulled secrets from Secrets Manager and SSM Parameter Store, read Lambda environment variables
    (Sentra adds EC2 user data), used TruffleHog to check harvested AWS keys, Entra ID client secrets and Okta client credentials, and then downloaded
    S3 data opportunistically, in some cases whole buckets in one session; Sentra counts no write actions. Wiz finds no tie to other reported
    activity and judges the targeting opportunistic rather than state-style, and it does not know how the Qubole IAM users were compromised. Sentra
    counts 'dozens' of impacted customers in one passage and 'more than a dozen organizations' in another, BleepingComputer says tens of companies,
    no victim is named, and BleepingComputer found no public Qubole statement. Wiz also reports a separate 8 to 11 October use of customer-owned
    AWS access keys created for Qubole integrations, which it cannot link to the role-assumption activity, and a bootable Linux image on the actor's
    server that polls for shell scripts, with no deployment seen.
  region_nexus: global; no victim named, no stated Swiss or European public-sector victim
  primary_sector_nexus: 'indirect: any public-sector AWS tenant that gave a data or analytics vendor a cross-account role (the exposure is dormant
    integrations, not Qubole use as such)'
  sector: technology; cloud supply chain
