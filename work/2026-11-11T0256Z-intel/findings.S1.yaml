    source_url: https://www.bleepingcomputer.com/news/microsoft/microsoft-november-2026-patch-tuesday-fixes-1-235-flaws-outlook-zero-day/
  extended_notes: 'Exposure: domain controllers (Kerberos, LDAP, DNS), DNS/DHCP servers, Exchange servers (Windows Search indexing of attachments), SQL Server hosts that run Integration Services packages
    against external endpoints. Microsoft''s records list no mitigation or workaround for any of them. Detection: no exploitation observed, so detection is hardening-grade: crash or restart of dns.exe,
    the DHCP Server service or lsass.exe on DCs after patch cycles; unusual Kerberos AP-REQ or LDAP bursts from workstation VLANs to DCs; Exchange transport or content-indexing worker crashes after inbound
    mail with odd attachments; inventory of which DCs and Exchange servers have KB5131291/5131085/5131090/5131080 installed. Hardening: patch domain controllers and Exchange first; segment who can talk
    Kerberos/LDAP/DNS/DHCP to DCs; Exchange hosts should not index attachments of untrusted senders any longer than the patch gap. Triage: Microsoft''s own phrasing for DNS, DHCP, iSCSI and Media Foundation
    (''in-network attacker calling arbitrary endpoints'') says network adjacency or reach to the service is the precondition; the severity inflates the real-world risk where those services are not exposed
    beyond the server VLAN.'
