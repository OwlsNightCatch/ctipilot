- title: 'SonicWall SNWLID-2026-0021: SonicOS firewalls with Client DPI-SSL kept trusting the compromised eMudhra chains and re-signed them for clients; fixed in SonicOS 7.3.4-7015 and 8.2.3-8015'
  sources:
  - url: https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2026-0021
    publisher: SonicWall PSIRT (SNWLID-2026-0021)
    date: '2026-11-10'
    role: primary
  - url: https://psirtapi.global.sonicwall.com/api/v1/vulndetail/?advisory_id=SNWLID-2026-0021
    publisher: SonicWall PSIRT API (SNWLID-2026-0021 record)
    date: '2026-11-10'
    role: primary
  discovery_trace: 'first seen at: sonicwall-psirt RSS (python3 tools/fetch_source.py feed https://psirtapi.global.sonicwall.com/api/v1/feed/rss.xml 10) -> advisory https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2026-0021
    -> structured record via url --direct https://psirtapi.global.sonicwall.com/api/v1/vulndetail/?advisory_id=SNWLID-2026-0021'
  summary: 'SonicWall''s informational advisory of 2026-11-10 (no CVE, no CVSS, no workaround) says SonicOS appliances with Client DPI-SSL enabled kept trusting certificate chains issued by the compromised
    eMudhra intermediate CAs because the firewall''s local store trusted the underlying roots; the firewall then re-signed traffic from impacted servers with the local SonicWall DPI-SSL CA certificate,
    so client browsers could not reject connections that carried an untrusted intermediate. SonicWall removed the affected root certificates from the SonicOS certificate store and added blocking logic for
    the compromised intermediate chain. Affected: Gen7 hardware firewalls (TZ 270 to TZ 670, NSa 2700 to 6700, NSsp 10700 to 15700) and Gen7 NSv up to 7.3.4-7013, fixed in 7.3.4-7015 and higher; Gen8 hardware
    (TZ 80 to TZ 680, NSa 2800 to 5800) and Gen8 NSv up to 8.2.2-8015, fixed in 8.2.3-8015 and higher. This is a firewall-side trust gap: the intermediates can be forged by anyone, so a DPI-SSL firewall
    without the fix would have hidden a forged certificate from users behind it.'
  region_nexus: global; SonicWall NGFWs with DPI-SSL are used in Swiss administrations and schools
