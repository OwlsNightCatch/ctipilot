    class first): FortiMail web access logs for unauthenticated requests to the IBE/webmail endpoints and the HA join port; FortiAuthenticator authentication logs for successful logins without a corresponding
    credential check or from the hard-coded identity; FortiOS OSPF neighbour and LSA events from routers that are not configured neighbours; FortiManager FGFM connection logs from unknown device serials.
    Post-patch: FortiMail 7.2 has no fix and must be replaced; because FortiMail IBE takeover exposes encrypted-mail content, treat IBE recipient mailboxes as possibly read on unpatched hosts. Assessment:
