  extended_notes: 'Detection (from Onapsis, ICM2SHELL): every exploitation attempt is likely to crash the ICM or Web Dispatcher at least once, so unexpected restarts logged in the work-directory dev_icm
    or dev_webdisp files and a changing process id of icman outside maintenance deserve investigation; check whether WebSocket is in use by looking for status 101 in the ICM/WD HTTP log (enabled by default
    from kernel 7.73 and in XS Advanced, explicit configuration on 7.54 and lower and XS Classic) before disabling it. Workarounds from SAP FAQ note 3778788: icm/HTTP/support_websocket_upgrade=FALSE plus
    restart (significant impact on interactive scenarios), or a Web Dispatcher on 7.53 PL 1629, 7.54 PL 723, 7.93 PL 430 or 9.16 PL 200 shielding backends reached only through it (not with PROT=ROUTER).
    ProxyGate has no official workaround; restrict prxyinfo and set gw/acl_mode_proxy=1. Hardening order from Onapsis: internet-facing Web Dispatchers and ICMs first, then production systems, every application
    server and every Web Dispatcher needs the kernel; standalone Web Dispatchers, HANA XS Web Dispatchers and unmaintained kernels are the ones that get missed. Fixed releases and notes still require an
    SAP login; the kernel levels above come from Onapsis, not SAP''s public page. Assessment: the entry''s earlier statement that the fixed releases were not publicly stated is now answered; its ''SAP''s
    Patch Day page was not yet published'' caveat is obsolete.'
