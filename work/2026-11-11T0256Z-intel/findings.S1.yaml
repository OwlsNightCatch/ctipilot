  discovery_trace: 'first seen at: anssi-fr (python3 tools/fetch_source.py cert-fr avis-recent 30: CERTFR-2026-AVI-1489, 2026-11-10) -> https://www.cert.cyber.gouv.fr/avis/CERTFR-2026-AVI-1489/ -> primary:
    https://roundcube.net/news/2026/11/09/security-updates-1.6.21-and-1.7.6 (extract)'
  summary: 'Roundcube published security releases 1.6.21 (LTS) and 1.7.6 on 2026-11-09 with 17 fixes: an open redirect through IMAP error recovery on attachment fetch; trusted-host handling in the Received
    header and in resolve_url(); managesieve destructive actions that could be triggered cross-site via GET; Sieve script injection through a rule operator and through set/include modifiers; mail header
    injection via a message-disposition-notification subject; HTTP request injection through the spell-check ATD backend; IMAP command injection through CRLF in the _uid parameter when the messages cache
    is enabled; an SSRF in the CSS proxy through an incomplete is_local_url() check (nip.io/sslip.io) and a second is_local_url() bypass using 6to4 addresses; CSRF validation bypasses for file-only POST
    requests and for mail purge and expunge; a disabled_actions bypass; unsafe attachment content passed to ImageMagick; a CPU loop in session unserialisation; and stricter IMAP host validation. Most are
    credited to one group of reporters. CERT-FR lists code execution, SSRF, CSRF, security-policy bypass and denial of service as risks for 1.6.x before 1.6.21 and 1.7.x before 1.7.6. The project ''strongly
    recommends'' updating all production installations and warns that the four-year-old 1.6 branch is to be discontinued ''rather soon''. No exploitation is reported.'
