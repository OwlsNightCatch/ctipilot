  summary: 'Google''s Stable-channel update to 157.0.8103.50/.51 (Windows, macOS) and 157.0.8103.50 (Linux) fixes nine vulnerabilities and says ''Google is aware that an exploit for CVE-2026-125350 exists
    in the wild''. The flaw is a high-severity use-after-free in Chromium''s XML component, reported anonymously on 2026-11-06; Google shares no details of the attacks. CISA added it to KEV on 2026-11-10
    (due date 2026-11-24, ransomware use unknown) describing code execution inside the sandbox through a crafted web page; assessment (not stated by the sources): a sandboxed renderer bug is normally the
    first stage of a chain that still needs a sandbox escape. NCSC Switzerland rates the status as actively exploited and notes that other Chromium-based browsers (Microsoft Edge, Brave, Opera, Vivaldi)
    were still working on their patches; Microsoft''s Security Update Guide returned no record for CVE-2026-125350 at the time of reading, so Edge is not yet confirmed fixed. SecurityWeek counts it as the
    eighth Chrome zero-day of 2026. The same release also fixes a second XML use-after-free (CVE-2026-125346, reported by Neonix Security) and WebGL, FileSystem, compositing, GPU and V8 high-severity bugs
    reported by Google.'
