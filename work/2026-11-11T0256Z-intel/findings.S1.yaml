  extended_notes: 'Exposure: Outlook for Microsoft 365 Apps, Office LTSC 2024 below 16.0.17932.21140 and Office LTSC 2021 below 16.0.14334.21048 (read the build under File > Office Account). Users must
    open a message file (.msg-class attachment), so the delivery path is mail or download. Detection (telemetry class first): outbound SMB (445), WebDAV or HTTP(S) connections from OUTLOOK.EXE or from the
    user''s session to non-corporate addresses shortly after a message-file attachment is opened; authentication events (Windows 4648/4624 type 3 and NTLM audit events) carrying the user''s identity from
    an external address; mail-gateway logs for message-file attachments from unknown senders. Post-patch check: because credential material may already have been captured, review NTLM authentications to
    external destinations since the earliest delivery you can find and reset affected accounts. Hardening (not from the sources, standard controls): block outbound SMB/WebDAV at the perimeter, restrict
    NTLM, quarantine message-file attachments at the mail gateway. Triage: Outlook legitimately contacts SharePoint/OneDrive and corporate file servers; the discriminator is an external, non-corporate destination
    and a preceding message-file open.'
