  extended_notes: 'Exposure: Chrome desktop below 157.0.8103.50 (Windows, macOS 157.0.8103.51 also), Chromium-based browsers (Edge, Brave, Opera, Vivaldi) until each vendor ships the Chromium 157 fix; check
    chrome://version or the managed-browser inventory. Rollout ''over the coming days/weeks'' per Google, so the update may need a forced relaunch. Detection: Google and CISA publish no indicators; defender
    telemetry is browser version inventory plus renderer-process crash reports and EDR alerts for a browser child process spawning an unexpected process after a visit to an unfamiliar site. A use-after-free
    that only reaches the renderer sandbox normally shows as a renderer crash before a successful chain. Hardening: enforce the Chrome auto-update policy and a relaunch deadline; keep Edge on its own update
    channel and re-check when Microsoft lists the CVE. Triage: a browser renderer crash is common and benign; weight it up when the same user then shows a browser-spawned shell, a new scheduled task or
