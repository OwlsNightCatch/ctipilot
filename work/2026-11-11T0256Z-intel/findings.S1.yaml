  summary: 'N-able published N-central 2026.4 Hotfix 2, build 2026.4.1.26, on 2026-11-10 (20:48 UTC) as a critical security update that supersedes 2026.4 (2026.4.0.27) and Hotfix 1 (2026.4.0.32): it strengthens
    authentication and permission checks, removes legacy mobile device management, adds validation for file upload and log handling, hardens server components, Agent-Probe communication and web/sign-in
    protections, and updates the server OS and third-party components. Hosted N-central servers are upgraded by N-able; on-premises customers must upgrade their own servers; all customers, hosted and on-premises,
    must upgrade Agents and Probes (Agents first, then Probes; a Probe on 2026.4.1.26 cannot talk to Agents or PME below that level, so the offline patch cache stops until both are upgraded). Known issue:
    the built-in remote control is temporarily disabled; Take Control still works. N-able''s CNA records (CVE ids now assigned) name: CVE-2026-125883 multiple XXE (CVSS 9.3), CVE-2026-125881 schema-hint
    SSRF via service-import schema validation (9.3), CVE-2026-125878 multiple OGNL injection flaws leading to RCE (8.7), CVE-2026-125882 RCE via file-repository upload path traversal (8.6, credited to Sprocket
    Security), CVE-2026-125879 local privilege escalation to root via a writable syslog-ng config (8.6), CVE-2026-125880 stored XSS via MMS3 patch metadata (8.3), CVE-2026-91000 insecure IPC channels leading
    to local privilege escalation (8.4) and CVE-2026-125958 root RCE via unsigned NSP upgrade package upload (7.5, ''through 24.6.1''). The CNA text says ''before 26.4.1'' for most (one says 2026.4.1),
    the build number is 2026.4.1.26, so verify by build. These eight records do not map one-to-one to the 33 flaws the researcher published, so the public CVE list is likely a consolidation; N-able and
    Huntress still report no active exploitation (the last stated check is 2026-11-09 15:15 UTC), and the public proof-of-concept code from the researcher remains available.'
