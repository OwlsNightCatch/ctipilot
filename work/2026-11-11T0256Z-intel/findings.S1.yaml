  extended_notes: 'What the update changes for the existing entry: it can now carry CVE ids and per-flaw severity (it had none), move FortiMail, FortiAuthenticator and FortiManager from ''critical and high
    fixes, details withheld'' to named unauthenticated rows, and tighten the action to the exposed management/IBE/FGFM/OSPF surfaces. Exposure: FortiMail on 8.0.0-8.0.1, 7.6.0-7.6.6, 7.4.0-7.4.8 or any
