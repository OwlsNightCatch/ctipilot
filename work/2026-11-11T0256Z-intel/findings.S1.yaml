  summary: 'Microsoft''s November 2026 Patch Tuesday fixes CVE-2026-124194, an Outlook spoofing flaw (CWE-356, product UI does not warn the user of an unsafe action; CVSS 3.1 6.5, vector AV:N/AC:L/PR:N/UI:R
