    and Office LTSC 2021 fixed in 16.0.14334.21048 (32 and 64 bit each). No source names the actor, the victims or the exact credential type; the FAQ says only ''authentication information''. Assessment
    (not stated by the sources): the described behaviour matches forced authentication to a remote SMB/WebDAV/HTTP location, which in a Windows domain means NTLM material that can be relayed or cracked;
    treat that as the working hypothesis when hunting, not as a confirmed fact.'
