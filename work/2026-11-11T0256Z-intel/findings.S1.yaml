  summary: 'SAP''s November Patch Day page lists 35 new notes plus 4 GitHub advisories and nine Critical rows, the four CVSS 10.0 notes the entry already covers (3849308 SAML2, 3778556 Web Dispatcher, 3778530
    ICM, 3798345 Gateway) and five more: CVE-2026-109803 NetWeaver Knowledge Management XML Forms code injection (9.9, authenticated, note 3809153), CVE-2026-76965 ABAP application server OS command injection
    (9.9, low-privileged, note 3792735, kernel 7.22 to 9.16), CVE-2026-109795 S4CRM missing authorization check (9.9, low privileges through remote-enabled function modules, note 3834842), CVE-2026-89119
    and CVE-2026-120014 CSRF in Web Dispatcher and ICM (9.6, note 3804858) and CVE-2026-109798 BusinessObjects Web Intelligence XXE (9.1, authenticated, note 3799117). Onapsis counts 43 new and updated
    notes with 12 HotNews notes, including two earlier Business AI Platform notes (PHP2Shell note 3846599 and the Node.js Brotli note 3843368, both CVSS 9.8). New technical facts from Onapsis, which found
    and reported the 10.0 flaws: ICM2SHELL (CVE-2026-76964 ICM and CVE-2026-89126 Web Dispatcher) is a memory corruption in the shared kernel code that reassembles fragmented WebSocket messages (size and
    length fields of WebSocket control frames are not validated), reachable over the HTTP/HTTPS port with no credentials; WebSocket support is on by default whether or not it is used, and SAP S/4HANA ships
    ICF services that accept WebSocket connections without authentication; Onapsis gave SAP a working end-to-end unauthenticated exploit that runs commands as <sid>adm, and the denial of service reproduced
    on every kernel tested. It applies to any ABAP system on kernel 7.40 or higher and to every Web Dispatcher including the one embedded in HANA XS; AS Java alone is not affected, dual-stack is; kernel
    7.22 is not affected; unmaintained kernels (7.40, 7.41, 7.42, 7.45, 7.49, 7.73, 7.81, 7.85, 7.89) are affected and may get no fix. Fixed patch levels: 7.53 PL 1616/1617, 7.54 PL 710, 7.77 PL 914, 7.93
    PL 401 or 420 (PL 419 is still affected), 9.16 PL 111, 9.18 PL 37, 9.20 PL 11 or 13; HANA 2.00.079.11 and 2.00.089.05; XS Advanced SP05 patch 4. ProxyGate (CVE-2026-89103) abuses the SAP Gateway''s
    CPI-C layer so an outside caller is treated as an internal application server; whether it is exploitable depends on the proxy ACL: a permissive prxyinfo file, or no prxyinfo file with gw/acl_mode_proxy
    at its default 0 (allow all), leaves the system exposed, so a kernel patch alone is not enough; SAP''s fix combines the kernel patch with gw/acl_mode_proxy = 1 (kernels 7.93 and 9.16 already support
    the parameter). Required minimum patches: 7.22 EXT/EX2/EX3 PL 1612, 7.53 PL 1625, 7.54 PL 718, 7.77 PL 915, 8.04 PL 244, 9.20 PL 16, 9.21 PL 4; Gateway also runs in AS Java, dual-stack and standalone
    installations. Exploitation: NCSC Switzerland lists the status as unknown and Onapsis says it has not observed in-the-wild exploitation of either; no public exploit code is reported.'
