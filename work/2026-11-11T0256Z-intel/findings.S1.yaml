  extended_notes: 'Exposure: any XO or XOA instance whose web/REST port is reachable from an untrusted network and which runs xo-server below 5.213.1 (latest) or 5.211.2 (stable); Vates'' first mitigation
    is a dedicated management network, never the internet. Detection (telemetry class first): successful exploitation writes no XO log, so detection is on the wire or reverse proxy: HTTP requests whose
    authenticationToken cookie is an empty JSON object in either encoded or literal form (Vates warns a naive WAF regex can be bypassed by other encodings). On XCP-ng hosts the attacker left a virtual machine
    whose platform parameter binds a file to the serial port (xe vm-list platform parameters; xensource.log lines with a serial file), a pivot VM, and new cron.d entries or an ld.so.preload change (T1053.003).
    Vates says these artefacts cover only the known campaign; absence of IOCs does not prove absence of compromise. Post-patch compromise check: Vates recommends rotating every secret held by the Vates
    stack (proxy, backup remotes NFS/S3/Azure/SMB, root and pool secret, user accounts, OTP secrets, mail-server config) and a full reinstall after confirmed compromise because cleanup cannot guarantee
    backdoor removal. Triage: legitimate XO sessions carry a string token (or the XO session cookie); an empty-object value is never produced by the XO client, so any hit is hostile. Serial-to-file VM settings
    are rare administrative changes and warrant review even when no cookie hit exists. Hardening: management-network only, block/alert on the cookie pattern at the reverse proxy, restrict egress from XO
    hosts.'
