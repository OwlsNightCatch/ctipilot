coverage_gaps:
- source_id: connectwise-trust-center
  reason: advisories page 403 on extract, url (direct + reader), url --direct and WebFetch; status.connectwise.com reads via url --direct and shows only operational incidents (x360Sync, x360Recover) and
    no security incident; WebSearch found no bulletin after 2026-09-08 (ScreenConnect 26.6.5). Keep fetch_method blocked.
- source_id: ivanti hub advisories (not a slice record)
  reason: 'recipe gap: hub.ivanti.com advisory pages are a Salesforce JavaScript app; extract returned a 1 MB shell, WebFetch a loading placeholder, jina pool has a negative balance. Working substitute:
    ENISA EUVD per-record pages carry Ivanti''s CNA text (python3 tools/fetch_source.py url ''https://euvdservices.enisa.europa.eu/api/search?vendor=Ivanti&fromDate=2026-11-09&toDate=2026-11-12&size=100'').'
- source_id: n-able me.n-able.com security advisories (not a slice record)
  reason: 'recipe gap: Salesforce JavaScript app (extract returns a 570 KB shell); substitute is status.n-able.com release notes (extract reads them) plus ENISA EUVD CNA records filtered with vendor=N-able.'
- source_id: fortinet-psirt
  reason: the RSS feed returns at most 50 items; the 2026-11-10 batch filled all 50, so advisories beyond them may exist; per-advisory pages read with extract (tables) and url --direct (raw HTML carries
