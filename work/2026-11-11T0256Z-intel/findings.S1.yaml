  summary: 'Vates published VSA-2026-062 on 2026-11-10, rated Critical (CVE id and CVSS 4.0 score not yet assigned), for Xen Orchestra and the Xen Orchestra Appliance (XOA), the web management plane for
    XCP-ng pools. Mechanism per Vates: the REST cookie parser turns authenticationToken=j:%7B%7D into an empty object, the REST authentication path hands that object to the XO token provider without requiring
    a string, the token collection treats it as an unfiltered lookup and returns its first token, and the provider authenticates as that token''s owner if the token is unexpired; the authenticated /rest/v0/users/me/authentication_tokens
    route then returns reusable login token ids. Impact per Vates: Admin privilege, arbitrary code execution on managed pools and root takeover of XCP-ng nodes. Vates states the flaw is being actively exploited
    by one threat actor and lists the attacker''s artefacts; BleepingComputer relays the same IOCs. Affected: Xen Orchestra before 6.9.2 (stable) and before 6.10.1 (latest); fixes are xo-server 5.211.2
    (stable channel) and 5.213.1 (latest channel); a source install must move to the latest master. BleepingComputer names releases 6.9.1 and 6.10.0 instead, which contradicts the Vates advisory (6.9.2
    and 6.10.1); the xo-server package numbers agree, so verify the installed xo-server version rather than the XO release label. Prerequisite: network reach to the XO web/REST interface and at least one
    unexpired token in the XO database; no credentials, no user interaction.'
  region_nexus: global; XCP-ng/XOA is deployed by European hosting providers, public-sector IT shops and SMEs (Vates is French); no Swiss-specific exposure statement in the sources
