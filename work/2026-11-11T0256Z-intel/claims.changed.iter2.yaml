  - claim_id: daf4d2f588
    entry: 2026-10-31/cve-2026-98432-linux-kernel-tcp-uaf-mptcp-remote-root
    surface: "summary"
    kind: frontmatter
    text: "The Linux kernel CVE team published CVE-2026-98432 on 2026-10-15, a use-after-free in the IPv4 TCP connection setup path that dates to Linux 4.4 and is reached by a SYN packet carrying IP options; the CNA scores it CVSS 9.8. Anthropic reports that Claude wrote an exploit giving a remote, unauthenticated attacker root on servers with a multipath TCP (MPTCP) listener, which CloudLinux's kernel team could not reproduce; the Go team says the bug is not specific to MPTCP and Akamai that disabling MPTCP does not prevent exploitation, and no source reports attacks. Citrix rates its XenServer 8.4 and 9 bulletin Critical and names fixes for Workload Balancing and Conversion Manager, XCP-ng released a kernel fix, MikroTik's RouterOS 7.25.1 and 7.24.6 list the CVE, Red Hat, Debian, CIQ and Amazon Linux kernels are fixed, Ubuntu has fixed 22.04 to 26.10 while 20.04 and older were still in progress on 2026-11-10, and Sophos has shipped a Firewall hotfix and SD-RED firmware, while WatchGuard (Fireware OS, AP, Dimension) and Fortinet list their products as unresolved or under investigation without a fixed build, Fortinet offering an IPS virtual patch."
  - claim_id: f3c26d707b
    entry: 2026-10-31/cve-2026-98432-linux-kernel-tcp-uaf-mptcp-remote-root
    surface: "actions[0]"
    kind: frontmatter
    text: "On every internet-facing Linux server and every XenServer or XCP-ng host with its Workload Balancing and Conversion Manager appliances, install the vendor's fix and reboot as soon as it ships, then confirm the running version; Red Hat, Debian, CIQ, Amazon Linux, Ubuntu 22.04 to 26.10, XCP-ng, MikroTik, Citrix and Sophos (Firewall hotfix HF110626.1, SD-RED firmware 3.0.012) updates are out, and XCP-ng says that a host which cannot reboot at once should take its iptables-based mitigation first and the update later; on Veeam appliances run Veeam Updater for kernel 5.14.0-570.60.1+27.2.el9_6_ciq, redeploy the virtual labs and Azure helper appliances that stay deployed and replace recovery media made before the update."
