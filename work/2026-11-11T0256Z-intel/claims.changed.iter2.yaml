    surface: "actions[0]"
    kind: frontmatter
    text: "On every ESXi host that sits behind a SonicWall, Palo Alto Networks or Fortinet VPN appliance that was compromised or unpatched since late August, check for a /opt/vmhostd-core file, a process named vmhostd, changes to /etc/rc.local.d/local.sh, and an ESXi firewall or execInstalledOnly setting that switches itself back off, because Insikt reports the implant resets both controls about every five seconds and re-enabling them without removing its persistence is futile."
