    entry: 2026-11-11/ghostframe-esxi-post-exploitation-framework-tag-218
    surface: "body"
    kind: derived
    text: "**Detection:** in ESXi file-integrity and shell-audit telemetry, changes to local.sh, a vmhostd process or an /opt/vmhostd-core file, and repeated firewall-off and execInstalledOnly resets; in network telemetry, six near-simultaneous SYNs from the hypervisor management address to one destination on those ports, and any outbound command-style traffic from a hypervisor at all; in vCenter and ESXi logs, snapshot creation or deletion, VNC enablement and power-state changes outside change windows; in datastore telemetry, reads of VM memory-snapshot and virtual-disk files by an identity that is not the backup service."
  - claim_id: 7894a3cb15
    entry: 2026-11-11/qubole-vendor-aws-identity-assumes-integration-roles
    surface: "summary"
    kind: frontmatter
    text: "Wiz, working with Sentra and Mandiant, reports that between 2026-10-14 and 2026-10-26 an actor used IAM credentials from an AWS account associated with the data platform Qubole to assume customers' cross-account integration roles, each call carrying the correct External ID; most roles had otherwise been idle. Inside each account the actor listed resources, read Secrets Manager, Parameter Store and Lambda configuration, tested harvested AWS, Entra ID and Okta credentials with TruffleHog and downloaded S3 data, in some cases whole buckets; no victim is named, the counts range from more than a dozen to dozens, and how the vendor identities were compromised is not known."
