items:
  - title: "Cisco Meraki security hardening release (cisco-sa-hardening-meraki-os-drbEX9GH): seven CWE-class CVEs, highest CVSS 9.6 adjacent-network and unauthenticated, across MX, MR, MS, MG, MV and Campus Gateway; no workaround, no known exploitation; advisory v1.3 of 2026-11-09 still shows Campus Gateway 33.1.4 as mid-November"
    sources:
      - { url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-hardening-meraki-os-drbEX9GH", publisher: "Cisco PSIRT (cisco-sa-hardening-meraki-os-drbEX9GH, version 1.3 of 2026-11-09; first published 2026-10-07)", date: "2026-11-09", role: "primary" }
      - { url: "https://www.esecurityplanet.com/vulnerabilities/news-cisco-meraki-security-hardening/", publisher: "eSecurityPlanet", date: "2026-10-12", role: "corroborating" }
      - { url: "https://www.bleepingcomputer.com/news/microsoft/microsoft-november-2026-patch-tuesday-fixes-1-235-flaws-outlook-zero-day/", publisher: "BleepingComputer (Patch Tuesday roundup, the lead)", date: "2026-11-10", role: "context" }
    discovery_trace: "first seen at: verifier finding F10 (work/2026-11-11T0256Z-intel/verification.iter1.findings.yaml), which cites BleepingComputer URL https://www.bleepingcomputer.com/news/microsoft/microsoft-november-2026-patch-tuesday-fixes-1-235-flaws-outlook-zero-day/ (fetched with extract; the Cisco line links only the PSIRT listing) -> Cisco PSIRT RSS python3 tools/fetch_source.py feed https://sec.cloudapps.cisco.com/security/center/psirtrss20/CiscoSecurityAdvisory.xml 40 (lists the Meraki advisory with last-updated 2026-11-09 and Impact Critical) -> primary: Cisco advisory URL https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-hardening-meraki-os-drbEX9GH (fetched with extract and with url --direct for the fixed-release tables and header block) -> corroboration WebSearch (\"Cisco Meraki Security Hardening Release October 2026 CVE-2026-76464 critical\") -> eSecurityPlanet URL https://www.esecurityplanet.com/vulnerabilities/news-cisco-meraki-security-hardening/ (extract)"
    summary: |
      Cisco PSIRT advisory cisco-sa-hardening-meraki-os-drbEX9GH (Impact Critical, CVSS 3.1 base 9.6, vector AV:A/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H) was first published 2026-10-07 and last updated 2026-11-09 (version 1.3). It is a hardening release: Cisco groups internally discovered vulnerabilities by CWE class and assigns one CVE id per class, and states that the score on each id is the maximum potential severity of the single most impactful underlying vulnerability in that class, so the per-id scores are ceilings, not seven separately confirmed critical bugs. The ids: CVE-2026-76463 (CWE-284 improper access control, 8.8), CVE-2026-76464 (CWE-119 memory-buffer errors, 9.6), CVE-2026-76467 (CWE-664 resource lifetime, 7.5), CVE-2026-76468 (CWE-20 input validation incl. path traversal, 8.2), CVE-2026-76469 (CWE-691 control flow incl. race conditions, 7.4), CVE-2026-76470 (CWE-682 incorrect calculation, 8.8), CVE-2026-76472 (CWE-74 injection, 8.8). Cisco does not say which product or service carries which class and names no vulnerable service. The 9.6 vector is adjacent-network (not internet-reachable by that vector), no privileges, no user interaction, scope changed. Affected "regardless of device configuration": Campus Gateways, Meraki MG cellular gateways, MR wireless access points, MS series switches, MV smart cameras, MX security and SD-WAN appliances. No workaround. Fixed releases per Cisco: Campus Gateway 32.2 -> 32.2.5 and 33.1 -> 33.1.4 (annotated "mid-Nov 2026", i.e. not yet shipped when v1.3 was published); MG 4.1 -> 4.1.4 (MG21/E only) and 26.1 -> 26.1.4; MR 30.7 -> 30.7.3 (Wi-Fi 5 Wave 2 only), 31.1 -> 31.1.8.1 (MR45/55 only), 32.2 -> 32.2.5, 33.1 -> 33.1.3; MS 17.2 and 18.1 -> 18.1.9, IOS XE 17.15 -> 17.15.6, IOS XE 17.18 -> 17.18.4.1, IOS XE 26.1 -> 26.1.2; MV 7 -> 8.0; MX 18.1 -> 18.107.14 (contact Meraki support if not offered), 19.2 -> 19.2.9 (recommended only for Z3), 26.1 -> 26.1.7, 26.2 -> 26.2.3. Cloud-configured Catalyst devices managed through the Meraki Dashboard are covered by Cisco's separate IOS XE hardening advisory of August 2026 (cisco-sa-hardening-iosxe-V8NMuMZJ). Exploitation: Cisco PSIRT "is not aware of any public announcements or malicious use"; found in internal testing "as well as frontier AI models"; FIRST EPSS for all seven ids is at or below 0.0027 (data of 2026-11-10); none of the ids is in the CISA KEV catalog (catalogVersion 2026.11.10, 1779 entries). Revision history: 1.0 2026-10-07; 1.1 2026-10-08 (MX 18.1 fix added); 1.2 2026-10-15 (Campus Gateway product name, MS and MG affected-release information, MR 32.2.5 and MS 18.1.9 availability); 1.3 2026-11-09 ("Updated information about fixed release availability"). The 2026-11-09 revision is the only in-window change; Cisco does not state which row changed, and the only row still carrying a future date at v1.3 is Campus Gateway 33.1.4 (mid-Nov 2026). Cisco's 2026-11-04 advance notice also says Cisco plans no further hardening advisories for the rest of calendar 2026 (next planned 2027-01-20).
    region_nexus: "global; Meraki MX/MR/MS are common in public administrations, schools and municipal networks, but no source here states Swiss deployment"
    primary_sector_nexus: "indirect: plausible product presence (cloud-managed branch networking at cantonal and communal level); nothing in the sources ties the flaws to the public sector"
    sector: public-sector
    cves: [CVE-2026-76463, CVE-2026-76464, CVE-2026-76467, CVE-2026-76468, CVE-2026-76469, CVE-2026-76470, CVE-2026-76472]
    techniques: [T1210]
    technique_basis: "INFERRED, not source-stated: mapped from CVSS AV:A/PR:N (unauthenticated adjacent-network remote-service flaw); Cisco names no vulnerable service. T1190 would apply only if the service were internet-reachable, which Cisco does not say. Composer may leave techniques empty for a dropped item."
    affected_products: ["Cisco Meraki MX Security and SD-WAN Appliance", "Cisco Meraki MR Wireless Access Point", "Cisco Meraki MS Series Switch", "Cisco Meraki MG Cellular Gateway", "Cisco Meraki MV Smart Camera", "Cisco Campus Gateway"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER   # Cisco PSIRT is the vendor primary for its own product (A); eSecurityPlanet only re-reports it, so this is vendor-authority single source
    confidence: HIGH   # for the facts as stated by Cisco; no exploitation claim to doubt
    novelty: new   # never carried by the store; but see borderline_reason (disclosure 2026-10-07, in-window change is a fix-availability revision only)
    classification_suggestion: "A2 (vendor PSIRT, content consistent across Cisco advisory and eSecurityPlanet)"
    evidence:
      - quote: "The Cisco PSIRT is not aware of any public announcements or malicious use of the vulnerabilities that are described in this advisory."
        attribution: "Cisco PSIRT"
        source_url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-hardening-meraki-os-drbEX9GH"
      - quote: "represents the maximum potential severity of the single most impactful underlying vulnerability within that specific CWE category"
        attribution: "Cisco PSIRT"
        source_url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-hardening-meraki-os-drbEX9GH"
      - quote: "These vulnerabilities affect the following Cisco products, regardless of device configuration:"
        attribution: "Cisco PSIRT"
        source_url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-hardening-meraki-os-drbEX9GH"
      - quote: "There are no workarounds that address these vulnerabilities."
        attribution: "Cisco PSIRT"
        source_url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-hardening-meraki-os-drbEX9GH"
      - quote: "1.3 Updated information about fixed release availability. Fixed Software Final 2026-NOV-09"
        attribution: "Cisco PSIRT"
        source_url: "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-hardening-meraki-os-drbEX9GH"
    extended_notes: |
      Prior handling in the store: the run record runs/2026-10-10/2026-10-10T0255Z-intel.md lists "Cisco 2026-10-07 security release (NX-OS, APIC, License On-Prem, Meraki, IOS XE)" as borderline-drop, "assessed and dropped by two earlier fires". NCSC-CH post 13044 (2026-10-09) relays only the Nexus and License On-Prem criticals, not Meraki; none of the 25 most recent NCSC-CH security-hub posts (read 2026-11-11) concerns Meraki, SD-WAN or Secure Email Gateway. Meraki also appears as a recipient of two other Cisco notices already in the store (Snort 3 package auto-updated on Meraki models, entries/2026-10-22/cve-2026-76466-cisco-expressway-cluster-unauth-root-rce.md; eMudhra informational advisory, Meraki MV firmware fix dated 2026-11-18, entries/2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates.md); those are different findings and not duplicates.
      Detection / hunt concept (only what follows mechanically from the advisory): none supported. Cisco publishes no exploit mechanics, no service name and no log indicator, so no telemetry hook can be named honestly; the only defender action is firmware-version inventory against the table above.
    borderline: true
    borderline_reason: "Below the strict relevance/actionability bar as a standalone entry: (1) first disclosed 2026-10-07 and already assessed and dropped by two earlier fires, the only in-window event is a v1.3 fix-availability revision whose changed row Cisco does not name; (2) no exploitation or PoC (Cisco: not aware), not in KEV, EPSS at or below 0.0027 for all seven ids; (3) the 9.6 headline is a per-CWE-class ceiling on an adjacent-network (AV:A) vector, Cisco gives no per-bug detail, no service name, no workaround and no detection hook, so the only possible action is the generic 'upgrade to the fixed release'; (4) most fixes have shipped since 2026-10-07 to 2026-10-15. Recommended disposition: DROP from entries; record in the run record's dropped/borderline list with the Cisco advisory URL. If the operator wants Meraki coverage anyway, the only reader-relevant sentence is that Campus Gateway 33.1.4 was still dated mid-November at v1.3 and that Meraki MX, MR, MS, MG, MV and Campus Gateway have fixed trains listed in the advisory."

