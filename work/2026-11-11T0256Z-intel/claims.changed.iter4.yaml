  - claim_id: ec387e8f0d
    entry: 2026-11-11/vates-xen-orchestra-vsa-2026-062-auth-bypass-exploited
    surface: "actions[1]"
    kind: frontmatter
    text: "On every Xen Orchestra instance that was reachable from an untrusted network, search the XCP-ng hosts for the artefacts Vates lists (a VM whose platform parameter binds a file to the serial port, an unexpected VM, cron files written by the actor and the dynamic-linker preload file Vates lists), and where compromise is confirmed reinstall from scratch and rotate every secret the Vates stack held, because Vates says cleanup alone cannot guarantee the removal of backdoors."
