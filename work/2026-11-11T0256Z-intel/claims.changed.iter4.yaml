    kind: record-summary
    text: "Veeam's KB4966 of 2026-11-10 adds the Veeam Software and Infrastructure Appliances, workers, Linux-based helper appliances and recovery media to the affected products, with the fixed CIQ kernel delivered through Veeam Updater since 2026-11-02 and a private fix for helper appliances managed from Windows servers; Ubuntu's tracker now lists the generic 22.04, 24.04 and 26.04 LTS kernels as fixed while 20.04 and older and some variant kernels remain in progress, and the body states again that the CNA and upstream score the flaw differently."
