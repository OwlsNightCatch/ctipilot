    text: "ProxyGate lets an unauthenticated attacker with network access run operating system commands as `<sid>adm` on the Gateway, and its exploitability depends on the proxy access list: a permissive prxyinfo file, or none with gw/acl_mode_proxy at its default of 0, leaves the system exposed, so \"neither a version check nor patching alone tells you whether you are safe\"; on most releases SAP's fix combines the kernel patch with gw/acl_mode_proxy = 1, and Onapsis lists the minimum patch level for each kernel release, for example 7.53 PL 1625 and 7.54 PL 718 ("
    urls: ["https://onapsis.com/blog/proxygate-cve-2026-89103-sap-netweaver-gateway-threat-advisory/"]
