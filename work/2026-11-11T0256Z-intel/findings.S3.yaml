  - title: "GhostFrame: Recorded Future's Insikt Group finds an ESXi post-exploitation framework (vmhostd-core implant, VM control panel, VMkatz credential theft) used by TAG-218, whose activity overlaps Settra ransomware and which targeted SonicWall, Palo Alto Networks and Fortinet VPN appliances in the US and Europe"
    sources:
      - { url: "https://www.recordedfuture.com/blog/ghostframe-esxi-implant-settra-ransomware", publisher: "Recorded Future Insikt Group", date: "2026-11-10", role: "primary" }
      - { url: "https://unit42.paloaltonetworks.com/active-exploitation-of-pan-os-cve-2026-0257/", publisher: "Palo Alto Networks Unit 42 (independent observation of the VPN-to-hypervisor pivot in CVE-2026-0257 intrusions, updated 2026-10-20)", date: "2026-10-20", role: "corroborating" }
      - { url: "https://www.huntress.com/blog/new-settra-ransomware-variant", publisher: "Huntress (MeshAgent RMM in Settra intrusions, cited by Insikt)", date: "2026-09-17", role: "corroborating" }
    discovery_trace: "first seen at: recordedfuture-insikt feed, URL https://www.recordedfuture.com/feed (fetched via tools/fetch_source.py feed) -> primary: https://www.recordedfuture.com/blog/ghostframe-esxi-implant-settra-ransomware (extract) -> pivot: Unit 42 page linked from the Insikt text, URL https://unit42.paloaltonetworks.com/active-exploitation-of-pan-os-cve-2026-0257/ -> pivot: Huntress page linked from the Insikt text, URL https://www.huntress.com/blog/new-settra-ransomware-variant"
    summary: |
      Insikt Group describes GhostFrame, a previously undocumented command-and-control and post-exploitation framework for compromised VMware ESXi hosts. A web operator panel (Sessions and Builder) generates an ELF implant named vmhostd-core; operators must already hold root on the host, because the implant does not exploit a vulnerability. Persistence: the implant copies itself to /opt/vmhostd-core, edits the ESXi boot script /etc/rc.local.d/local.sh and /sbin/auto-backup.sh to survive reboots, masquerades as "vmhostd" (resembling VMware's vmware-hostd), and in a loop about every five seconds disables the ESXi firewall and the execInstalledOnly control (which restricts execution of unsigned binaries), so an administrator re-enabling them is undone. C2: the sample opens simultaneous TCP connections to one address on ports 53, 2222, 3389, 4444, 8443 and 9443, keeps the first that succeeds, and retries after a random 5 to 12 s delay; Insikt notes the six near-simultaneous SYNs are a network detection opportunity. The implant is mainly an in-memory shellcode loader with a /bin/sh reverse-shell fallback.
      From the hypervisor the panel can enumerate registered VMs, change power state, create or delete snapshots, enable VNC on a guest and relay the graphical session, expose the ESXi HTML Host Client through an operator tunnel, run a SOCKS5 proxy component (gfsox) for pivoting, intercept ESXi logins with a credential interceptor (sdkmon), and run the open-source VMkatz against VM memory snapshots, virtual disks or all VMs on a datastore to recover NTLM hashes, WDigest, Kerberos tickets, SAM and LSA secrets and NTDS.dit data without running a stealer inside each guest.
      Insikt links GhostFrame to TAG-218, a group whose operations overlap Settra ransomware: victim-facing TAG-218 servers targeted VPN appliances (predominantly SonicWall, Palo Alto Networks and Fortinet) in the US and Europe between late August and October 2026, four of those organisations later appeared on the Settra leak site, and on 2026-10-12 a victim Fortinet appliance beaconed to both a GhostFrame server and a MeshCentral server that Huntress had earlier tied to Settra. Insikt says available evidence does not show the framework is exclusive to Settra and assesses it "highly likely" other financially motivated actors adopt it (an assessment, not an observation). Unit 42, independently, reports that after CVE-2026-0257 exploitation attackers moved from the VPN gateway to vCenter and ESXi, disabled execInstalledOnly and dumped domain-controller credentials offline from its virtual disk; Insikt calls this consistent with GhostFrame but does not claim Unit 42's case used it.
