  - title: "Qubole: an attacker used vendor-account IAM credentials to assume dormant cross-account integration roles in dozens of customer AWS accounts, then harvested secrets and validated Entra ID and Okta client credentials (Wiz and Sentra, 14 to 26 October)"
    sources:
      - { url: "https://www.wiz.io/blog/qubole-cross-account-access-abused-in-the-wild", publisher: "Wiz (CIRT and Research)", date: "2026-11-09", role: "primary" }
