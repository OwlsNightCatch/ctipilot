      - { url: "https://www.bleepingcomputer.com/news/security/hackers-exploit-trusted-aws-access-to-breach-multiple-cloud-environments/", publisher: "BleepingComputer (notes no Qubole statement found)", date: "2026-11-10", role: "secondary" }
    discovery_trace: "first seen at: securityweek feed, URL https://www.securityweek.com/feed/ ('Over a Dozen Organizations Hit in Qubole Supply Chain Attack') -> pivot: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/hackers-exploit-trusted-aws-access-to-breach-multiple-cloud-environments/ -> primary: Wiz, URL https://www.wiz.io/blog/qubole-cross-account-access-abused-in-the-wild -> second primary: Sentra, URL https://sentra.io/blog/breaches/inside-the-qubole-supply-chain-attack (also surfaced in Risky Bulletin 2026-11-11, https://news.risky.biz/risky-bulletin-france-blames-iran-for-the-october-supermarket-fridge-hacks/)"
    summary: |
      Wiz, working with Sentra and Mandiant, reports that between 2026-10-14 and 2026-10-26 an actor used IAM credentials from an AWS account associated with the Qubole data platform to call sts:AssumeRole against integration roles that customers had created to trust Qubole. Two Qubole IAM users were used; every call carried the correct External ID and succeeded, and in most affected environments the roles were otherwise unused, so the trust policies still worked and the attacker's requests were the only AssumeRole activity from the vendor account in October. The traffic came from Mullvad VPN exits and an OVH VPS, not from AWS infrastructure where legitimate Qubole traffic originates.
      Inside each account the actor enumerated broadly (role session names with a consistent prefix), read Lambda function configuration (environment variables), Secrets Manager and SSM Parameter Store, ran TruffleHog to test discovered AWS access keys, Entra ID service-principal client secrets and Okta client credentials, and downloaded S3 data opportunistically, sometimes whole buckets in one session. Sentra reports it made no write actions, collected about 100 passwords and keys in seven minutes, and counts dozens of customers affected; counts differ across outlets (Sentra "dozens"/"more than a dozen", BleepingComputer "tens of companies", SecurityWeek "over a dozen"), and Wiz does not give a number. Wiz also found a bootable ISO on the attacker's VPS that gathers host information and polls for shell commands for 90 minutes before a hard reboot, but has not seen it deployed, and a separate, unlinked set of October 8 to 11 activity using customer-owned AWS keys created for Qubole integrations. How the Qubole IAM users were compromised is not stated; BleepingComputer found no public Qubole statement. Wiz has not tied the activity to publicly reported actors and calls the targeting opportunistic.
    region_nexus: "global; no country named"
    primary_sector_nexus: "indirect (relevant to any public body that grants SaaS or data-platform vendors cross-account access in AWS)"
