        attribution: "Palo Alto Networks Unit 42"
        source_url: "https://unit42.paloaltonetworks.com/active-exploitation-of-pan-os-cve-2026-0257/"
    extended_notes: |
      EXPOSURE: ESXi hosts whose root credentials, SSH or ESXi shell, or vCenter are reachable after an edge compromise; the entry chain Insikt observed starts at SonicWall, Palo Alto Networks and Fortinet VPN appliances, so an organisation that runs both and has not isolated hypervisor management is exposed. No ESXi vulnerability is involved (root is a precondition), so patching ESXi does not address it.
      DETECTION (telemetry class first): (1) ESXi host file-integrity and shell-audit telemetry: changes to /etc/rc.local.d/local.sh and /sbin/auto-backup.sh, a file or directory /opt/vmhostd-core, a process named vmhostd, and repeated firewall-disable and execInstalledOnly resets at about five-second intervals (re-enabling the control without removing the persistence is futile, per Insikt). (2) Network telemetry from the ESXi management address: six near-simultaneous TCP SYNs to one destination on 53, 2222, 3389, 4444, 8443 and 9443, and any outbound C2-like traffic from a hypervisor at all. (3) vCenter and ESXi management logs: unexpected snapshot creation or deletion, VNC enablement on a guest, power-state changes outside change windows. (4) Datastore access telemetry for reads of VM memory snapshot and virtual-disk files by a non-backup identity, which is how VMkatz gets guest credentials without touching the guest. (5) VPN gateway telemetry: logins without MFA or from unexpected sources shortly before hypervisor administration activity.
      TRIAGE: administrators legitimately edit local.sh, create snapshots and use VNC; the discriminators are a firewall-off plus execInstalledOnly=0 loop, a binary under /opt named vmhostd (the genuine daemon is vmware-hostd), and datastore reads of snapshot files by an account that is not the backup service.
      DEFENDER TAKEAWAY: treat a VPN appliance compromise as a possible hypervisor compromise and check ESXi persistence files and execInstalledOnly state before declaring the incident closed; restrict ESXi and vCenter management to dedicated administration hosts, and keep execInstalledOnly enforced with monitoring for it being switched off.
      LIMITS: Insikt does not say which VPN flaw TAG-218 used (its Fortinet, SonicWall and Palo Alto targeting is described as targeting; Unit 42's CVE-2026-0257 case is separate); technique T1190 is carried as the access class from the VPN-appliance targeting, an inference rather than an Insikt-stated mapping. IOCs and a sample hash exist in the Insikt post (not carried).
