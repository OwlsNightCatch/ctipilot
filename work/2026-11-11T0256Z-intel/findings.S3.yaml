  - title: "Turla's Cereal toolset turns a compromised on-premises Exchange server into the command channel and mail collector at Kazakh and Romanian government bodies, with no attacker infrastructure and no new transport agent registered (ESET)"
    sources:
      - { url: "https://www.welivesecurity.com/en/eset-research/exchange-for-breakfast-turlas-cereal-tricks-are-not-for-kids/", publisher: "ESET Research (WeLiveSecurity)", date: "2026-11-10", role: "primary" }
      - { url: "https://web-assets.esetstatic.com/wls/en/papers/white-papers/turla-cereal-tricks.pdf", publisher: "ESET Research white paper", date: "2026-11-10", role: "primary" }
      - { url: "https://securityaffairs.com/202800/apt/russia-linked-apt-turla-turned-exchange-servers-into-their-own-control-room.html", publisher: "Security Affairs (rewrite of the ESET post)", date: "2026-11-10", role: "secondary" }
    discovery_trace: "first seen at: securityaffairs feed, URL https://securityaffairs.com/feed (fetched via tools/fetch_source.py feed) -> https://securityaffairs.com/202800/apt/russia-linked-apt-turla-turned-exchange-servers-into-their-own-control-room.html -> primary: ESET blog https://www.welivesecurity.com/en/eset-research/exchange-for-breakfast-turlas-cereal-tricks-are-not-for-kids/ (extract; note the eset RSS feed was stale at 2026-11-04, the site listing https://www.welivesecurity.com/en/eset-research/ carried it) -> white paper PDF https://web-assets.esetstatic.com/wls/en/papers/white-papers/turla-cereal-tricks.pdf (tools/fetch_source.py pdf)"
    summary: |
      ESET found a previously undocumented .NET toolset, which it names Cereal, on a Kazakh government organisation's Exchange server on 2025-11-28 and, after tuning detections, on a Romanian government organisation's Exchange server compromised from 2025-12-23; in Romania the email-collection module was configured to select messages to or from NATO and European Union institutional addresses. ESET attributes Cereal to Turla (which ESET describes as widely assessed to be part of Russia's FSB; the registry carries it as Secret Blizzard) with high confidence, on the co-occurrence of another component publicly linked to Turla and conceptual similarity to the older Neuron backdoor. ESET could not determine the initial access method (white paper: "We were unable to determine the initial access method"; it suspects exploitation of the internet-facing Exchange servers is possible), so there is no CVE to patch against.
      The command channel is the victim's own Exchange server: CerealNeuron runs on the compromised server and passively waits for requests on web paths made to look like Outlook Web Access, Autodiscover and ActiveSync traffic (observed paths include /owa/sdds/, /AUTODISCOVER/PROXYSERVICE/ and /MICROSOFT-SERVER-ACTIVESYNC/INTEGRATED/API/); a correctly encrypted, integrity-checked request is treated as a command, a bad one gets a normal-looking Exchange error page, and ESET found no operator-controlled server and could not identify ingress IP addresses. CerealHermit is a network-less variant that reads encrypted command files from disk, so some victims had two independent access paths. Each task is delivered as its own small compiled .NET assembly inside a CerealRunner (EWS mailbox retrieval, Active Directory queries, WMI queries, LSA secrets extraction, file listing, reading and deletion), which ESET reads as evidence of an automated build framework.
      Execution tradecraft: CerealLoader, the only component written to disk in recognisable .NET form, abuses .NET VTable fixups so native code runs before any managed code, and is placed where trusted processes load it, such as ncobjapi.dll or wbemcomn.dll in C:\Windows\System32\wbem\ (loaded by WMI) and in the .NET native image cache under names such as Microsoft.Exchange.Search.Mdb.ni.dll (in one sample active only when the parent is the Exchange search service). CerealBox, which ESET calls a novel technique, is injected into EdgeTransport.exe, finds the transport agents already loaded, wraps their handlers with its own code and leaves the original flow intact, so no new agent appears in Exchange configuration; it keeps messages that carry .doc, .docx or .pdf attachments and match hard-coded sender, recipient, subject or attachment-name lists, then stages them compressed and encrypted on disk for later exfiltration through CerealNeuron commands.
    region_nexus: "Europe and Central Asia (Romania, Kazakhstan confirmed); ESET's own profile notes Turla's 2014 breach of the Swiss defence company RUAG; no Swiss victim reported"
    primary_sector_nexus: "direct (government mail infrastructure; correspondence with NATO and EU institutions targeted)"
