    summary: |
      Check Point Research's year-long investigation groups three intrusion sets under one malware-supply entity it calls CopperDragon, assessed as a possible "digital quartermaster" for China-nexus actors that use the cross-platform Sparrow framework (Check Point lists FamousSparrow, Earth Estries, TropicTrooper, UAT-9244 "and others"). Check Point itself cautions that shared backdoors or C2 infrastructure "does not necessarily mean" the same actor ran two intrusions, so CopperDragon is a supplier hypothesis, not an operator attribution.
      SilentDelivery (since early 2026, Europe and Asia) is the part nearest the constituency: legitimate government, shipping, IT and research websites are compromised (one through XSS on an unsanitised input field) and injected with heavily obfuscated JavaScript that fingerprints the visitor, then replaces the page with a language-localised fake Google Chrome SSL warning urging a "Certificate Fix" utility. The MSI comes from compromised S3 buckets and installs the new SquadC backdoor (or a SparrowDoor variant); SquadC can be configured to run only while a browser process is alive, persists through a Run key named WindowsUpdateAssist, and offers directory listing, file write/delete, command execution, systeminfo and screenshots. Check Point telemetry names the Czech Republic, Germany, France, Taiwan, Nepal, Hong Kong and Indonesia; Check Point also found a second delivery route for SquadC, a spear-phishing RAR with an LNK that abuses ftp.exe (uploaded to VirusTotal from Indonesia, same C2 as the watering-hole chain). Positive Technologies independently documented the same fake-certificate chain (it calls the backdoor SquawkDoor) with victims in Taiwan, Germany, Indonesia and the Czech Republic.
      OceanGate (Asia, 2025-2026) starts with exploitation of an internet-facing Linux server, then AnnobinDoor (Go) and SparrowShell (Linux counterpart of SparrowDoor, same C2 and RC4 keys, plugin loaded with dlopen, optional Reptile-derived kernel rootkit loaded through init_module), trojanised ssh/sshd that log passwords and key passphrases, FRP and Chisel, then RDP password attempts against Windows administrators and a custom Windows toolset (hidden local admin account creation with LocalAccountTokenFilterPolicy set to 1, an LSA security-package credential interceptor, a Raw Input keylogger). SparrowDoor variants embed the WinDivert driver to become a passive backdoor that shares an existing service port such as 443 and rewrites packets to a high internal port. Check Point assesses CopperDragon also maintains and supplies Melofee variants (rootkit code and self-signed certificate overlap). DarkWire (mid-2025, Latin America telecom and government incl. foreign affairs and justice) uses the in-memory CopperDoor (the backdoor ESET calls SparroWocky) and CopperDNS (DNS MX tunnelling) loaded by CopperLoader through DLL sideloading of uncommon signed executables, SoftEther VPN renamed to system-process names, an LSASS memory dumper registered as a security package, and wmiexec lateral movement.
