    evidence:
      - quote: "Kali365 and VoidProxy are separate phishing-as-a-service (PhaaS) platforms, both designed to bypass or defeat MFA checks."
        attribution: "Push Security"
        source_url: "https://pushsecurity.com/blog/ai-themed-fake-event-campaign-analysis"
      - quote: "We think this operator is most likely a customer of both."
        attribution: "Push Security"
        source_url: "https://pushsecurity.com/blog/ai-themed-fake-event-campaign-analysis"
      - quote: "The operator moved from Zoom to Anthropic to OpenAI, SpaceX, and Claude between October 20 and October 30."
        attribution: "Push Security"
        source_url: "https://pushsecurity.com/blog/ai-themed-fake-event-campaign-analysis"
      - quote: "Since September 2026, threat actors have been sending emails that appear to be an invitation to a private Anthropic AI meeting, but are actually attempts to steal Google and Microsoft login credentials."
        attribution: "Cofense Intelligence"
        source_url: "https://cofense.com/blog/would-your-employees-join-a-fake-anthropic-ai-preview"
    extended_notes: |
      EXPOSURE: Users able to complete a Microsoft device-code sign-in (the default unless Conditional Access blocks the device-code flow) and Google accounts without phishing-resistant MFA. Check: whether a Conditional Access policy blocks or limits the device-code authentication flow, and whether device-code sign-ins occur at all in sign-in logs.
      DETECTION (telemetry class first): identity-provider sign-in logs with the device-code authentication protocol followed within minutes by a second interactive sign-in from a hosting-provider or unfamiliar network for the same user (the VoidProxy capture); token issuance to an unexpected client application after a device-code grant; web proxy or DNS logs for visits to look-alike event domains after a mail or chat link that passed through c.gle, share.google, zpr.io or an x.com logout redirect; browser-side detection of the device-code page or reverse-proxy rendering where a browser agent is deployed (Push's own approach). Post-incident: revoke refresh tokens and sessions, not only the password, since both a token and a cookie are captured.
      TRIAGE: legitimate device-code logins exist for TVs, kiosks and CLI tools; the discriminator is a user on a managed laptop with a normal browser who was just on an event page, and a follow-on sign-in from a different network.
      DEFENDER TAKEAWAY: block the device-code flow where unused; require phishing-resistant MFA for Google and Microsoft sign-ins; extend user awareness to "invitation to an AI event requiring a work-account sign-in".
