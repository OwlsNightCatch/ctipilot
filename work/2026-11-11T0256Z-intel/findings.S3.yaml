    summary: |
      Risky Bulletin reports that the pro-Russian hacktivist group NoName057(16) published, on a dark-web portal it launched this year after Europol seized its server infrastructure last year, the personal information of 18 people: Italian Foreign Minister Antonio Tajani, the Eurojust president, the head of Europol's European Cybercrime Centre, the German Federal Criminal Police Office (BKA) president, the chief of Italy's Postal Police, a Frankfurt prosecutor and three German journalists who investigated Russian hackers. ANSA (7 November) adds the Rome public prosecutor and the mayor of Aviano (the town hosting a US base) to those on whom the group had offered a payment for personal information for about two weeks, describes profiles with private phone numbers, e-mail and home addresses, and notes the Italian data-protection authority is monitoring circulation of the data; the Russian embassy in Italy denied involvement. Risky says the portal runs a bug-bounty-like programme asking others to contribute personal data on people involved in the takedown and on anti-Russia politicians across Europe. The Italian prime minister blamed pro-Russian hackers; Tajani said the data was being spread on the dark web and that he and his family were exposed to threats.
      Context from Risky and DarkOwl: since the DDoSia botnet seizure the group shifted mainly to psychological operations and some ICS tampering of exposed control panels; Risky notes the group claimed the European refrigeration-controller attacks and that few experts believe the claim (France attributed the 11-12 October campaign to an Iranian IRGC-CEC unit; that is already covered). The group's own portal was not accessed.
