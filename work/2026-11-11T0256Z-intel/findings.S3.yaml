    extended_notes: |
      EXPOSURE: Any organisation that runs Microsoft Exchange on premises with the Mailbox or Edge Transport role reachable from the internet (the web paths are the control channel). ESET names no affected version and no vulnerability, so exposure is the deployment model, not a build number; a Swiss federal, cantonal or communal body with an internet-facing Exchange server is in the class ESET describes.
      DETECTION (telemetry class first; items marked [inference] follow from the described mechanism rather than an ESET-stated rule): (1) File/integrity telemetry on the Exchange host: unexpected DLLs in %windir%\System32\wbem\ (ncobjapi.dll, wbemcomn.dll named by ESET) and files in the .NET native image cache whose hash or signature does not match the Microsoft originals (names such as Microsoft.Exchange.Search.Mdb.ni.dll, Microsoft.Exchange.Data.Transport.ni.dll) [inference on the integrity check]. (2) Module and injection telemetry for EdgeTransport.exe: unsigned or non-Microsoft assemblies loaded into the transport service, while Get-TransportAgent shows nothing new (this is the point of CerealBox) [inference]. (3) Web server telemetry: IIS or HTTP.sys log entries for the observed paths from clients with no corresponding legitimate mailbox flow; encrypted request bodies that return a generic Exchange error page; because there is no external C2, IP blocklists are of little use and ESET could not identify ingress addresses. (4) Mailbox and EWS audit telemetry: EWS calls that retrieve whole mailboxes from the server's own context, and staged compressed encrypted files on the server disk. (5) Outbound telemetry from the Exchange server itself (ESET saw no external C2, so unexpected egress would indicate a different tool). Post-patch note: there is nothing to patch, so a compromise assessment of every internet-facing Exchange server (and a fresh look at servers that were exposed during 2025) is the check.
      TRIAGE: Legitimate third-party anti-spam, DLP and archiving products also inject into the transport service and register transport agents; the discriminator is that those are vendor-signed and appear in the Exchange transport-agent configuration, whereas CerealBox is unsigned, in memory only and absent from configuration. NGEN legitimately regenerates .ni.dll files after .NET updates, so a changed timestamp alone is not a signal; a file that does not hash-match the Microsoft binary or that loads only under one parent process is.
      DEFENDER TAKEAWAY: treat internet-facing Exchange servers as Tier 0 with EDR coverage, restrict their egress, and baseline the native image cache and wbem directory; the lack of attacker infrastructure means network-only detection will not find this.
      ABSENCES / LIMITS: initial access unknown (stated by ESET); no data on whether other European governments are affected beyond the two victims; ESET publishes hashes and other indicators on its GitHub repository (not carried here).
