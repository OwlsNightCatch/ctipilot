    novelty: new
    overlap_note: "S4 (incidents) will likely surface the same story from the news side; the primaries here are the Wiz and Sentra write-ups."
    evidence:
      - quote: "Working with Sentra and Mandiant, Wiz observed a threat actor using IAM credentials from an AWS account associated with Qubole between October 14 and October 26, 2026."
        attribution: "Wiz"
        source_url: "https://www.wiz.io/blog/qubole-cross-account-access-abused-in-the-wild"
      - quote: "Most of the roles the threat actor assumed were not otherwise in use."
        attribution: "Wiz"
        source_url: "https://www.wiz.io/blog/qubole-cross-account-access-abused-in-the-wild"
      - quote: "In this activity, a source IP condition alone would have blocked every role assumption we observed."
        attribution: "Wiz"
        source_url: "https://www.wiz.io/blog/qubole-cross-account-access-abused-in-the-wild"
      - quote: "CloudTrail management events record the role assumption and the bucket listing, but not the object reads that make up the data exfiltration."
        attribution: "Wiz"
        source_url: "https://www.wiz.io/blog/qubole-cross-account-access-abused-in-the-wild"
      - quote: "Dozens of Qubole customers were impacted."
        attribution: "Sentra"
        source_url: "https://sentra.io/blog/breaches/inside-the-qubole-supply-chain-attack"
    extended_notes: |
      EXPOSURE: Any AWS account holding an IAM role whose trust policy allows a Qubole account (or any other vendor account) to assume it, including roles left over from finished integrations. Check: list roles whose trust policy names an external account and note which have had no legitimate AssumeRole traffic for months (Wiz: dormant roles still accepted the attacker's calls). Wiz publishes the vendor account identifier, the two IAM principals and the attacker network ranges for a CloudTrail hunt back to 2026-10-01; reference the Wiz post rather than reproducing them.
      DETECTION (telemetry class first): cloud control-plane audit logs (CloudTrail management events) for AssumeRole into integration roles from the vendor account where the source IP is not an AWS address; role session names with a consistent attacker-chosen prefix; GetCallerIdentity from a TruffleHog user agent paired with the same sources; identity-provider sign-in logs (Entra ID, Okta) showing the same user agent against service principals or OAuth clients; S3 data events or server access logs for object reads (management events do not show GetObject, so the exfiltration is invisible unless enabled). Post-incident: rotating a credential does not end temporary STS sessions already issued, so revoke role sessions as well, and rotate every secret, parameter and Lambda environment variable the role could read (Wiz).
      TRIAGE: legitimate vendor traffic originates from the vendor's AWS infrastructure (Wiz saw nothing legitimate from other networks); the correct External ID does NOT discriminate, because Wiz notes it is logged in plaintext and often stored by the vendor. A vendor role assumed through a consumer VPN or a hosting provider the vendor has never used is the high-signal case.
      DEFENDER TAKEAWAY: inventory third-party trust relationships; delete roles of ended integrations; pin the trust to the specific vendor principal and add an aws:SourceIp or aws:SourceVpce condition (Wiz: this alone would have blocked every observed assumption); keep integration roles away from Secrets Manager, SSM and Lambda configuration unless required; enable S3 data events on sensitive buckets.
      LIMITS: the compromise route into the vendor is unknown; the number of victims is unknown; no government victim is reported; an unlinked October 8-11 customer-key activity cluster is also described by Wiz.
