  - title: "iOS 'worse_query' sandbox escape: a public proof of concept lets an app read other apps' containers on iOS 26 and 27; Binance warns of seed-phrase exposure and Apple's iOS 27.2.1 notes list no fix"
    sources:
      - { url: "https://securityaffairs.com/202788/hacking/ios-sandbox-escape-is-public-and-apple-hasnt-confirmed-a-fix.html", publisher: "Security Affairs", date: "2026-11-10", role: "primary" }
      - { url: "https://thehackernews.com/2026/11/binance-warns-of-ios-sandbox-escape.html", publisher: "The Hacker News", date: "2026-11-10", role: "corroborating" }
      - { url: "https://github.com/forcequitOS/worse_query", publisher: "forcequitOS (researcher repository README)", date: "2026-11-08", role: "primary" }
      - { url: "https://support.apple.com/en-us/149715", publisher: "Apple Security (iOS 27.2.1 and iPadOS 27.2.1 content)", date: "2026-11-09", role: "context" }
    discovery_trace: "first seen at: securityaffairs feed, URL https://securityaffairs.com/feed -> https://securityaffairs.com/202788/hacking/ios-sandbox-escape-is-public-and-apple-hasnt-confirmed-a-fix.html -> pivot: researcher repository, URL https://github.com/forcequitOS/worse_query -> pivot: Apple security content, URL https://support.apple.com/en-us/149715 -> corroboration: THN, URL https://thehackernews.com/2026/11/binance-warns-of-ios-sandbox-escape.html"
    summary: |
      Binance warned on 10 November of a public iOS sandbox escape, 'worse_query', that lets one app read local files of other apps on iOS 26.7.1, 27.0.1 and 27.2 (seed phrases, keys and credentials in other apps' containers). The researcher forcequitOS published a proof of concept on GitHub (README: a sandbox escape for iOS 26 and 27, successor to bad_query; the code "isn't useful by itself" and needs an App Group container set up for the app). Other developers have already built installable tools on it (WQ Files, installed by sideloading with AltStore or SideStore). Apple released iOS and iPadOS 27.2.1 on 2026-11-09, the day before the Binance warning and after the PoC; the page text read here (about 5.6 KB, ten CVE rows) contains nothing that describes this issue (the nearest wording, 'An app may be able to access sensitive user data' under App Intents, is a different credited bug), and The Hacker News and Security Affairs both say Apple's updates list no fix, so no fix is confirmed. Neither Binance nor the researcher reports attacks or theft, and The Hacker News notes nobody has said whether an App Store app could use the technique. No CVE exists.
    region_nexus: "global"
    primary_sector_nexus: "indirect (iPhones with sideloaded or enterprise-signed apps)"
    sector: "cross-sector"
    cves: []
    techniques: [T1068]
    affected_products: ["Apple iOS", "Apple iPadOS"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    related_entries: []
    verification: MULTI-SOURCE
    sourcing_note: "Two outlets plus the researcher's repository and Apple's own release notes (absence of a fix is read from the notes, a negative claim); Binance's warning itself was read through the outlets (an X post)."
    confidence: MEDIUM
    admiralty_suggestion: "C2"
    novelty: new
    borderline: true
    borderline_reason: "Vulnerability lead with no CVE, no exploitation reported, and a precondition (a sideloaded or manually signed app) that managed fleets normally block; S1 may also see it. Included so the public PoC and Apple's missing fix statement are not lost; drop if S1 carries it or if sideloading is blocked by policy."
    evidence:
      - quote: "On 10 November, Binance warned users about a public iOS sandbox escape that lets one app read the files of other apps."
        attribution: "Security Affairs"
        source_url: "https://securityaffairs.com/202788/hacking/ios-sandbox-escape-is-public-and-apple-hasnt-confirmed-a-fix.html"
      - quote: "The good news is that neither Binance nor the researcher has reported any attacks or data theft."
        attribution: "Security Affairs"
        source_url: "https://securityaffairs.com/202788/hacking/ios-sandbox-escape-is-public-and-apple-hasnt-confirmed-a-fix.html"
    extended_notes: |
      EXPOSURE: iOS 26.7.x, 27.0.x and 27.2 (tested versions named by Binance; the researcher gives a wider range); the technique needs an app with an App Group container, so the practical route is sideloading (AltStore, SideStore) or manually signed apps; whether an App Store app could do it is unconfirmed.
      DEFENDER TAKEAWAY: confirm that sideloading and untrusted-developer profiles are blocked on managed iPhones; remove apps from untrusted sources (Binance's advice); watch Apple's security page for a later entry.
      LIMITS: no CVE; no exploitation reported; Apple's non-confirmation is inferred from release notes.
