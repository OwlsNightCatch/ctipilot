  - title: "ANNUAL REPORT — iVerify Advanced Mobile Threat Report 2026: criminals, not states, account for about 75% of its iPhone exploit-kit detections, including a DarkSword variant served through an Instagram ad, and an exploit toolkit shipped inside an App Store app (FomoPeek)"
    sources:
      - { url: "https://www.iverify.com/advanced-mobile-threat-report-2026", publisher: "iVerify (report landing page)", date: "2026-11-09", role: "primary" }
      - { url: "https://www.iverify.com/blog/half-click-attacks-iphone-ads", publisher: "iVerify blog (half-click ad delivery case study)", date: "2026-11-10", role: "primary" }
      - { url: "https://therecord.media/spyware-cyber-crime-iverify", publisher: "The Record (independent reporting with vendor interview)", date: "2026-11-10", role: "secondary" }
    discovery_trace: "first seen at: iverify-blog slice record, URL https://www.iverify.com/blog (url --direct, relative ./blog/<slug> links; per-post extract for dates) -> https://www.iverify.com/blog/half-click-attacks-iphone-ads -> report landing page https://www.iverify.com/advanced-mobile-threat-report-2026 -> corroboration: The Record, URL https://therecord.media/spyware-cyber-crime-iverify (surfaced from the news-feed sweep, https://therecord.media/feed)"
    summary: |
      iVerify published its 2026 Advanced Mobile Threat Report (the full report sits behind a form; findings are taken from the landing page, the vendor's blog and The Record's interview). iVerify says about 75% of this year's detections were criminals using the leaked Coruna and DarkSword iOS exploit kits to steal credentials and cryptocurrency, the remainder mercenary spyware such as Pegasus, and that every enterprise case it confirmed involved an employee below managing-director level. Prevalence is reported as 1.07 infections per 1,000 consumer scans and 0.7 per 1,000 enterprise scans (the population iVerify monitors, not all iPhones; iVerify attributes the lower enterprise rate to enforced patching and on-device detection).
      The delta for defenders: iVerify telemetry recorded a DarkSword variant served through an Instagram ad while the user was scrolling, with a second, different DarkSword variant reaching the same person later through a clicked link; ad platforms let a buyer target by device, OS version, location and interest, so the exploit is shown only to phones it works on. iVerify says every DarkSword-chain flaw was fixed by iOS 26.3 and most earlier, that DarkSword supports iOS 18.4 to 18.7, and that to its knowledge no confirmed Coruna or DarkSword victim received an Apple threat notification. The report also cites FomoPeek, an App Store app whose versions 1.1 and 1.2 (September) carried a hidden iOS exploitation toolkit (disclosed by SlowMist, not by iVerify), and three Android remote-access trojans (HyperRat, Cellik, Octagon) reported with Play Protect flagging fewer than half of the devices where iVerify found a malicious app. The ad-delivery mechanism and the expired-analytics-tag route are already in the store (Adfection/Candiru ad delivery, DeadTag); what is new here is iVerify's own telemetry on criminal ad-delivered use.
