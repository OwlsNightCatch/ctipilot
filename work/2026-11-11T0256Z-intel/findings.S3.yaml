    discovery_trace: "first seen at: push-security slice record, URL https://pushsecurity.com/blog (WebFetch with a title/date/href prompt, since extract returns an undated list) -> primary: https://pushsecurity.com/blog/ai-themed-fake-event-campaign-analysis (extract) -> pivot: Cofense report linked from the Push text, URL https://cofense.com/blog/would-your-employees-join-a-fake-anthropic-ai-preview"
    summary: |
      Push Security detected and blocked visits (late October 2026) to fake event-registration pages for an OpenAI Academy livestream, a private SpaceX briefing and Anthropic at AWS re:Invent that ask for a work-account sign-in to claim a reward. The page offers two buttons: "Continue with Microsoft" starts a Microsoft device-code login through Kali365 (the visitor pastes a code into the genuine login.microsoftonline.com device-login page and Microsoft issues tokens to the operator's session), then hands the visitor to a VoidProxy Microsoft sign-in proxy for a second capture of password and session cookie; "Continue with Google" opens a VoidProxy reverse proxy of Google sign-in that captures password, MFA response and session cookie. Kali365 and VoidProxy are separate phishing-as-a-service platforms that Push says are both built to defeat MFA; the operator that builds the lure pages (tracked by Push as ZoomMock for the fake Zoom pages from May to October and MSDRoot from 2026-10-22) is, Push thinks, most likely a customer of both, and links the two kits at medium-high confidence through one shared domain.
      Delivery evades reputation checks: invitations route through Google short links (c.gle, share.google), Zapier's zpr.io and an x.com logout redirect, earlier ones through GoTo Webinar's mail sender or real Zoom event pages; a Cloudflare managed challenge hides the lure domain from scanners and the Microsoft proxies show scanners real business news sites. The operator rotated brand lures (Zoom, Anthropic, OpenAI, SpaceX, Claude) between 2026-10-20 and 2026-10-30 and domains every few weeks; marketing staff are the stated target group. Cofense independently reports the Anthropic-themed email wave since September 2026, using GoTo Webinar and zpr.io, CAPTCHAs and a credential-harvesting Google/Microsoft sign-in.
    region_nexus: "global; no country named (Swiss relevance: the same device-code technique is in the Vaud M365 campaign covered 2026-11-05)"
    primary_sector_nexus: "indirect (marketing and communications staff in any organisation with Microsoft 365 or Google Workspace)"
