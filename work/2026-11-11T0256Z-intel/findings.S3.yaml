        attribution: "Positive Technologies"
        source_url: "https://medium.com/@dzaripova1177/the-sparrow-that-chirped-too-loud-famoussparrow-attacks-using-updated-sparrowdoor-and-the-new-29ac2d90544d"
    extended_notes: |
      EXPOSURE: Staff of public bodies, shipping, IT and research organisations who browse peer-organisation websites (the lure is a browser certificate error that a legitimate Chrome never resolves by offering an MSI), and web teams whose sites accept unsanitised input (one confirmed XSS foothold). Windows endpoints that let a standard user run an MSI from a browser download. Internet-facing Linux servers with SSH are the OceanGate entry point; Check Point does not name the exploited flaw.
      DETECTION (telemetry class first): (1) Endpoint process and file telemetry: an MSI named like a certificate repair utility executed from the browser download directory shortly after a page-content replacement; a browser must be running for SquadC to execute, so the sequence browser -> msiexec -> new Run key value (WindowsUpdateAssist) is the anchor. (2) Module-load telemetry for DLL sideloading using rarely abused signed executables Check Point names (ncptrcw.exe, fsptool.exe, vlc.exe with libvlccore.dll, gethwid.exe, zCrashReport64.exe) and tool staging in existing system paths such as C:\Windows\debug and C:\ProgramData\USOShared. (3) Registry telemetry: LocalAccountTokenFilterPolicy set to 1, a new local administrator account plus an inbound firewall rule for TCP 445 in one burst. (4) Driver-load telemetry: WinDivert loaded by a process that is not a VPN, firewall or tunnelling product. (5) Linux: init_module calls from user-space backdoors, ssh and sshd binaries that differ from the package-manager hashes, frpc and chisel binaries, and unexpected cron or systemd units. (6) DNS telemetry: MX-query volume or unusual MX responses from servers that do not send mail (CopperDNS). Post-compromise: the actors are in place for long periods, so a clean patch state does not remove them.
      TRIAGE (benign lookalikes where the mechanism supports them): WinDivert is legitimate in VPN and firewall tools; the discriminator is the parent (a backdoor or sideloaded DLL rather than the vendor's signed service) plus packet rewriting that forwards one source address's traffic from a shared service port to a high local port. SoftEther VPN is legitimate software; renamed to vmtoolsd.exe or csrss.exe in a non-system path it is not. A Chrome SSL warning cannot legitimately be dismissed by installing an MSI.
      DEFENDER TAKEAWAY (concept, not rule code): treat a browser page that asks for a "certificate fix" installer as an incident trigger; restrict MSI execution for standard users; inventory which Linux servers expose SSH and verify ssh/sshd integrity; web teams of government and research sites should check for injected third-party script and input-handling flaws, because a compromised site becomes a delivery vehicle for peers.
      ABSENCES / LIMITS: Check Point does not name the Linux server flaw, does not say any Swiss body was targeted, and gives CopperDragon as a hypothesis. IOCs exist in the report (hashes, domains, IPs) and are intentionally not carried.
