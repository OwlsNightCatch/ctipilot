    entry: 2026-11-11/vates-xen-orchestra-vsa-2026-062-auth-bypass-exploited
    surface: "summary"
    kind: frontmatter
    text: "Vates advisory VSA-2026-062 of 2026-11-10 rates Critical an authentication bypass in Xen Orchestra and the Xen Orchestra Appliance, the web management plane for XCP-ng pools: a login cookie that parses to an empty object authenticates as the owner of the first stored token, giving Admin rights, code execution on managed pools and root on XCP-ng nodes. Vates says a threat actor is actively exploiting it; the fixes are xo-server 5.213.1 (latest channel) and 5.211.2 (stable channel), and no CVE id or CVSS score exists yet."
