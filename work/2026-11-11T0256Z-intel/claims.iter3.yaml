  - claim_id: a88d124145
    entry: 2026-11-11/ivanti-epm-cve-2026-121653-unauthenticated-sqli-rce
    surface: "body"
    kind: derived
    text: "**Detection:** no indicator is published; the signals that follow from the mechanism are SQL syntax or errors in requests to the Core's web service, child processes of that service, and trusted-certificate entries nobody approved."
  - claim_id: b7c2b28220
    entry: 2026-11-11/ivanti-epm-cve-2026-121653-unauthenticated-sqli-rce
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** upgrade the Core to 2024 SU8 or later and confirm the Cloud Services Application's fixed build with Ivanti before relying on 5.0.8; an endpoint-management server is a software-distribution channel to the whole estate, so an unauthenticated path to code execution on it warrants an out-of-cycle update even without reported exploitation."
