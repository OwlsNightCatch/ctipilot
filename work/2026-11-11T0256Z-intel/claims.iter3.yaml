    surface: "body"
    kind: cited
    text: "Onapsis, which found and reported the Web Dispatcher, ICM and Gateway flaws, names the first pair ICM2SHELL: a memory corruption in the shared kernel code that reassembles fragmented WebSocket messages, reachable on the HTTP or HTTPS port with no credentials, and \"WebSocket support is enabled by default, whether or not it is used\" ("
