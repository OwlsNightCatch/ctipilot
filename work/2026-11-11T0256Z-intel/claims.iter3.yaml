    surface: "body"
    kind: uncited
    text: "The first is fixed in 2024 SU8; the second record names 5.0.8 as the affected version in its text and again in its patch field, so it does not settle which build fixes it."
  - claim_id: d0aa425941
    entry: 2026-11-11/ivanti-epm-cve-2026-121653-unauthenticated-sqli-rce
    surface: "body"
    kind: uncited
    text: "Neither record states exploitation, and Ivanti's advisory pages, which would carry the exploitation statement and mitigations, could not be read, so the whole account rests on the two CNA records."
  - claim_id: 5a82bc67ef
    entry: 2026-11-11/ivanti-epm-cve-2026-121653-unauthenticated-sqli-rce
    surface: "body"
    kind: derived
    text: "**Exposure:** an Ivanti Endpoint Manager Core server below 2024 SU8 that an attacker can reach; the records do not say which port or interface carries the injectable request."
  - claim_id: 4ab84d6d55
    entry: 2026-11-11/ivanti-epm-cve-2026-121653-unauthenticated-sqli-rce
    surface: "body"
    kind: derived
