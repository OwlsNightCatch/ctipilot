    text: "{\"id\": \"CVE-2026-121653\", \"cvss\": \"9.8\", \"status\": [\"patch-available\"], \"affected\": \"Ivanti Endpoint Manager before 2024 SU8\", \"fixed\": \"2024 SU8\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
  - claim_id: e1a4cfb405
    entry: 2026-11-11/ivanti-epm-cve-2026-121653-unauthenticated-sqli-rce
    surface: "body"
    kind: cited
