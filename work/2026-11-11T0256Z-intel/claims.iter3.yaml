    entry: 2026-11-10/sap-november-2026-cna-records-four-unauth-cvss-10-rows
    surface: "body"
    kind: cited
    text: "The fixed patch levels are 7.53 PL 1616 or 1617, 7.54 PL 710, 7.77 PL 914, 7.93 PL 401 or 420, 9.16 PL 111, 9.18 PL 37 and 9.20 PL 11 or 13 ("
