    surface: "body"
    kind: derived
    text: "**Exposure:** domain controllers (Kerberos, LDAP, DNS), DNS and DHCP servers, Exchange servers that receive mail from the internet, and SQL Server hosts that run Integration Services packages against endpoints an attacker could control; the installed cumulative update shows in the update history of each host."
  - claim_id: c34d2466a0
    entry: 2026-11-11/microsoft-november-2026-patch-tuesday-preauth-9-8-rows
    surface: "body"
    kind: derived
    text: "**Detection:** no exploitation is reported, so detection is hardening-grade: crashes or restarts of the DNS Server, DHCP Server and LSASS processes on domain controllers, Kerberos or LDAP bursts from workstation networks toward domain controllers, content-indexing or transport worker crashes on Exchange after inbound mail with unusual attachments, and an inventory of which domain controllers and Exchange servers already carry the November update."
  - claim_id: a5497a3ccb
    entry: 2026-11-11/microsoft-november-2026-patch-tuesday-preauth-9-8-rows
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** put the November update on domain controllers and internet-facing Exchange servers first; Microsoft's records give an unauthenticated attacker a relay to a domain controller and a mail-borne path to code execution on Exchange, and the DNS, DHCP and iSCSI rows are reachable by an in-network attacker, so keep those services off untrusted segments until they are patched."
