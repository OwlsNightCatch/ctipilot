    text: "It copies itself to /opt/vmhostd-core, edits the ESXi boot script /etc/rc.local.d/local.sh and runs /sbin/auto-backup.sh to keep the change across reboots, masquerades as vmhostd (resembling VMware's vmware-hostd), and about every five seconds disables the ESXi firewall and the execInstalledOnly control that restricts execution of unsigned binaries, so an administrator who re-enables them is undone ("
    urls: ["https://www.recordedfuture.com/blog/ghostframe-esxi-implant-settra-ransomware"]
  - claim_id: ecc6cc0554
    entry: 2026-11-11/ghostframe-esxi-post-exploitation-framework-tag-218
    surface: "body"
    kind: cited
    text: "From the hypervisor the panel can list registered VMs, change power state, create or delete snapshots, enable VNC on a guest, run a SOCKS5 proxy for pivoting, intercept ESXi logins, and run the open-source VMkatz against VM memory snapshots, virtual disks or whole datastores to recover NTLM hashes, Kerberos tickets, SAM and LSA secrets and NTDS.dit data without running anything inside the guest ("
    urls: ["https://www.recordedfuture.com/blog/ghostframe-esxi-implant-settra-ransomware"]
  - claim_id: bc14f5ee7e
    entry: 2026-11-11/ghostframe-esxi-post-exploitation-framework-tag-218
    surface: "body"
    kind: cited
    text: "Insikt ties TAG-218's victim-facing servers to VPN-appliance targeting across the US and Europe between late August and October 2026, \"predominantly SonicWall, Palo Alto Networks, and Fortinet devices\", and says four of those organisations later appeared on the Settra leak site; it assesses that other financially motivated actors are highly likely to adopt the framework, which is an assessment, not an observation ("
    urls: ["https://www.recordedfuture.com/blog/ghostframe-esxi-implant-settra-ransomware"]
  - claim_id: 5bfb750726
    entry: 2026-11-11/ghostframe-esxi-post-exploitation-framework-tag-218
    surface: "body"
    kind: cited
    text: "Unit 42 independently reports that after CVE-2026-0257 exploitation attackers pivot from the VPN gateway directly to the virtualization layer ("
    urls: ["https://unit42.paloaltonetworks.com/active-exploitation-of-pan-os-cve-2026-0257/"]
  - claim_id: f3740baac7
    entry: 2026-11-11/ghostframe-esxi-post-exploitation-framework-tag-218
    surface: "body"
    kind: uncited
    text: "Its command channel opens simultaneous TCP connections to one address on ports 53, 2222, 3389, 4444, 8443 and 9443, keeps the first that succeeds and retries after a random delay of 5 to 12 seconds, which Insikt notes is a network detection opportunity; the implant is mainly an in-memory shellcode loader with a reverse-shell fallback."
  - claim_id: 7ff52f2fa5
    entry: 2026-11-11/ghostframe-esxi-post-exploitation-framework-tag-218
    surface: "body"
    kind: derived
    text: "**Exposure:** ESXi hosts whose root credentials, SSH or shell, or vCenter are reachable after an edge compromise; no ESXi vulnerability is involved, so patching ESXi does not address it, and an estate that runs both a SonicWall, Palo Alto Networks or Fortinet VPN appliance and ESXi without isolated hypervisor management is in the pattern Insikt describes."
  - claim_id: 0a8f6a631b
    entry: 2026-11-11/ghostframe-esxi-post-exploitation-framework-tag-218
    surface: "body"
    kind: derived
    text: "**Detection:** in ESXi file-integrity and shell-audit telemetry, changes to local.sh, a process masquerading as the host daemon or an unexpected executable under /opt, and repeated firewall-off and execInstalledOnly resets; in network telemetry, six near-simultaneous SYNs from the hypervisor management address to one destination on those ports, and any outbound command-style traffic from a hypervisor at all; in vCenter and ESXi logs, snapshot creation or deletion, VNC enablement and power-state changes outside change windows; in datastore telemetry, reads of VM memory-snapshot and virtual-disk files by an identity that is not the backup service."
  - claim_id: faf59f5eb1
    entry: 2026-11-11/ghostframe-esxi-post-exploitation-framework-tag-218
    surface: "body"
    kind: derived
    text: "**Triage:** administrators legitimately edit local.sh, create snapshots and use VNC; the discriminators are a firewall-off and execInstalledOnly loop, a binary under /opt named vmhostd where the genuine daemon is vmware-hostd, and snapshot-file reads by a non-backup account."
  - claim_id: 3fdf0b35c5
    entry: 2026-11-11/ghostframe-esxi-post-exploitation-framework-tag-218
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** treat a VPN-appliance compromise as a possible hypervisor compromise and check the ESXi persistence files and the execInstalledOnly state before declaring the incident closed; restrict ESXi and vCenter management to dedicated administration hosts."
  - claim_id: 77f34502b3
    entry: 2026-11-11/qubole-vendor-aws-identity-assumes-integration-roles
    surface: "headline"
    kind: frontmatter
    text: "Stolen Qubole vendor credentials assumed customers' idle AWS integration roles; a source-IP condition stops it"
  - claim_id: 7894a3cb15
    entry: 2026-11-11/qubole-vendor-aws-identity-assumes-integration-roles
    surface: "summary"
    kind: frontmatter
    text: "Wiz, working with Sentra and Mandiant, reports that between 2026-10-14 and 2026-10-26 an actor used IAM credentials from an AWS account associated with the data platform Qubole to assume customers' cross-account integration roles, each call carrying the correct External ID; most roles had otherwise been idle. Inside each account the actor listed resources, read Secrets Manager, Parameter Store and Lambda configuration, tested harvested AWS, Entra ID and Okta credentials with TruffleHog and downloaded S3 data, in some cases whole buckets; no victim is named, the counts range from more than a dozen to dozens, and how the vendor identities were compromised is not known."
  - claim_id: 267a000034
    entry: 2026-11-11/qubole-vendor-aws-identity-assumes-integration-roles
    surface: "actions[0]"
    kind: frontmatter
    text: "In every AWS account, list the IAM roles whose trust policy names an external vendor account, delete those of finished integrations, pin the rest to the vendor's specific principal with an aws:SourceIp or aws:SourceVpce condition, and search CloudTrail from 2026-10-01 for AssumeRole calls into them from non-vendor network addresses, using the account identifier and session-name prefix Wiz publishes, because the actor's calls carried the correct External ID and succeeded on roles nobody was using."
  - claim_id: 0ec5bbe29f
    entry: 2026-11-11/qubole-vendor-aws-identity-assumes-integration-roles
    surface: "body"
    kind: cited
    text: "Wiz, working with Sentra and Mandiant, observed a threat actor using IAM credentials from an AWS account associated with Qubole, a big-data platform, between 2026-10-14 and 2026-10-26 ("
    urls: ["https://www.wiz.io/blog/qubole-cross-account-access-abused-in-the-wild"]
  - claim_id: cbfd813a4a
    entry: 2026-11-11/qubole-vendor-aws-identity-assumes-integration-roles
    surface: "body"
    kind: cited
    text: "The actor used two Qubole IAM users to call sts:AssumeRole on the cross-account integration roles that customers had created to trust Qubole's account; \"every AssumeRole request we attributed to the threat actor included an External ID, and every one succeeded\", most of the roles were otherwise not in use, and the traffic came from a rented hosting server and commercial VPN exits, not the AWS infrastructure where legitimate platform traffic originates ("
    urls: ["https://www.wiz.io/blog/qubole-cross-account-access-abused-in-the-wild", "https://sentra.io/blog/breaches/inside-the-qubole-supply-chain-attack"]
  - claim_id: 562f4bdcaa
    entry: 2026-11-11/qubole-vendor-aws-identity-assumes-integration-roles
    surface: "body"
    kind: cited
    text: "Inside each account the actor enumerated resources, read Lambda function configuration, Secrets Manager and Systems Manager Parameter Store, ran TruffleHog to test AWS access keys, Entra ID service-principal client secrets and Okta client credentials it found, and then downloaded S3 data opportunistically, in some cases whole buckets in one session ("
    urls: ["https://www.wiz.io/blog/qubole-cross-account-access-abused-in-the-wild"]
  - claim_id: a0b90bc188
    entry: 2026-11-11/qubole-vendor-aws-identity-assumes-integration-roles
    surface: "body"
    kind: cited
    text: "Sentra writes that dozens of Qubole customers were impacted, and BleepingComputer could not find a public Qubole announcement ("
    urls: ["https://sentra.io/blog/breaches/inside-the-qubole-supply-chain-attack", "https://www.bleepingcomputer.com/news/security/hackers-exploit-trusted-aws-access-to-breach-multiple-cloud-environments/"]
  - claim_id: f232160b34
    entry: 2026-11-11/qubole-vendor-aws-identity-assumes-integration-roles
    surface: "body"
    kind: cited
    text: "**Exposure:** any AWS account holding an IAM role whose trust policy lets a Qubole account, or any other vendor account, assume it, including roles left from integrations that ended; the roles' trust policies and last-used data show them, and Wiz publishes the vendor account identifier, the two principals and the attacker address ranges for a CloudTrail hunt back to 2026-10-01 ("
    urls: ["https://www.wiz.io/blog/qubole-cross-account-access-abused-in-the-wild"]
  - claim_id: abe22aa336
    entry: 2026-11-11/qubole-vendor-aws-identity-assumes-integration-roles
    surface: "body"
    kind: cited
    text: "Object reads are absent from CloudTrail management events, so S3 data events or server access logs must be on, and Wiz says missing logs left responders unable to see what was read ("
    urls: ["https://www.wiz.io/blog/qubole-cross-account-access-abused-in-the-wild"]
  - claim_id: c7923cfd48
    entry: 2026-11-11/qubole-vendor-aws-identity-assumes-integration-roles
    surface: "body"
    kind: uncited
    text: "Wiz found no tie to other reported activity and judges the targeting opportunistic; how the Qubole IAM users were compromised is not stated."
  - claim_id: b679b55dfc
    entry: 2026-11-11/qubole-vendor-aws-identity-assumes-integration-roles
    surface: "body"
    kind: uncited
    text: "No Swiss or public-sector victim is named, but the exposure is shared by any account that gave a data or analytics vendor a cross-account role and left it in place."
  - claim_id: 293a78b745
    entry: 2026-11-11/qubole-vendor-aws-identity-assumes-integration-roles
    surface: "body"
    kind: derived
    text: "**Detection:** in cloud control-plane audit logs, AssumeRole events into integration roles whose calling identity is the vendor account but whose source address is not AWS infrastructure, and session names with a consistent attacker-chosen prefix; GetCallerIdentity calls from many keys within seconds and Entra ID or Okta sign-ins by service principals or clients right after, as the actor validates credentials; ListSecrets, GetSecretValue, Parameter Store and Lambda configuration reads in bursts."
  - claim_id: f1b80e1f90
    entry: 2026-11-11/qubole-vendor-aws-identity-assumes-integration-roles
    surface: "body"
    kind: derived
    text: "**Triage:** legitimate vendor traffic comes from the vendor's own AWS infrastructure; the correct External ID does not discriminate, because it is logged in plaintext and often stored by the vendor, while a vendor role assumed from a consumer VPN or a hosting provider the vendor has never used is the high-signal case."
  - claim_id: 86ac3f0bbb
    entry: 2026-11-11/qubole-vendor-aws-identity-assumes-integration-roles
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** inventory third-party trust relationships, delete the roles of ended integrations, narrow each trusted principal to the vendor's specific principal and add a source-address or endpoint condition, which Wiz says alone would have blocked every observed assumption; after an incident, revoke the issued role sessions and rotate every secret, parameter, Lambda variable and identity-provider credential the role could read."
