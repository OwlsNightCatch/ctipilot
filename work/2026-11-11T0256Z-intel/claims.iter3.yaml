    text: "**Detection:** neither Google nor CISA publishes an indicator, so the controls are the browser-version inventory and the browser's own crash and child-process telemetry: a renderer crash followed, for the same user, by a browser-spawned shell or script interpreter, a new scheduled task or a connection to a newly registered domain is the sequence to weigh up."
