    surface: "summary"
    kind: frontmatter
    text: "Fortinet's coordinated hardening release of 2026-10-22 fixed critical and high-severity flaws in FortiOS, FortiManager, FortiAnalyzer, FortiMail and FortiAuthenticator, and the advisories withheld until Patch Tuesday were published on 2026-11-10: unauthenticated FortiMail path traversal and command injection to code execution (CVE-2026-126147 and CVE-2026-126148, CVSS 9.8) and SQL injection (CVE-2026-126164, 9.4), FortiMail IBE webmail account takeover (CVSS 9.1), two FortiAuthenticator authentication bypasses (9.0 and 9.1), a FortiOS OSPF flaw (9.3) and unauthenticated code execution through the FortiManager FGFM port (9.0). The fixed versions are unchanged and no Fortinet page states exploitation; NCSC.ch listed the status as unknown, and the FortiMail builds are also the ones that fix the exploited CVE-2026-104286."
