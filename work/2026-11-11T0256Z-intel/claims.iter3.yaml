    text: "Synology's advisory SA-26:19 of 2026-11-10 (severity Critical, no mitigation) fixes two DSM flaws reachable without credentials: an SQL injection in the Auth API that lets remote attackers read or write arbitrary files and cause denial of service (CVE-2026-76954, CVSS 9.8), and an authentication bypass in the rsync service that lets remote attackers read specific files, write arbitrary files and cause limited denial of service (CVE-2026-85101, 8.6). The fixed builds are DSM 7.4.1-90080-1, 7.3.2-86009-5, 7.2.2-72806-10 and 7.2.1-69057-13; no exploitation or public proof of concept is mentioned."
