    surface: "body"
    kind: cited
    text: "**Detection:** Onapsis expects every exploitation attempt against ICM2SHELL to crash the ICM or Web Dispatcher at least once, so unexpected restarts of either process outside maintenance deserve investigation; requests with status 101 in the ICM or Web Dispatcher HTTP log show whether WebSocket is in use before anyone considers disabling it ("
    urls: ["https://onapsis.com/blog/icm2shell-cve-2026-76964-cve-2026-89126-sap-netweaver-web-dispatcher-threat-advisory/"]
  - claim_id: 0144fe6bc9
