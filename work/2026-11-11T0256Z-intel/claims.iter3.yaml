    surface: "body"
    kind: cited
    text: "A second record, CVE-2026-121683, describes missing authentication in Ivanti Cloud Services Application version 5.0.8 that lets a remote unauthenticated attacker add and delete arbitrary trusted EPM Core certificate entries, scored 9.4 ("
    urls: ["https://euvdservices.enisa.europa.eu/api/enisaid?id=EUVD-2026-121155"]
  - claim_id: 43a3e14cef
