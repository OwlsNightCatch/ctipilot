    text: "Upgrade every on-premises N-central server to 2026.4 Hotfix 2 (build 2026.4.1.26), keeping it offline until the upgrade is complete as N-able advises, then upgrade every Agent and, after the Agents, every Probe, hosted or not; ask each IT provider that manages your endpoints through N-central whether it runs a server on premises and has done this, because the researcher's proof-of-concept code is public and N-able has seen scanning for it."
