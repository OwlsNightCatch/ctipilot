    entry: 2026-11-11/adobe-connect-apsb26-191-five-unauthenticated-cvss-10-rows
    surface: "body"
    kind: derived
    text: "**Detection:** the bulletin supplies none, so the signal is behavior at the web tier: unauthenticated requests that return content from administrative or API paths, outbound connections from the Connect server to internal addresses that suggest request forgery, and unexpected files in web-served directories."
  - claim_id: 6f7a0b427f
