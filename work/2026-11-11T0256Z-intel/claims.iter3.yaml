  - claim_id: 46934a655d
    entry: 2026-11-10/n-able-n-central-33-unpatched-flaws-public-pocs-offline
    surface: "summary"
    kind: frontmatter
    text: "An independent researcher published write-ups and proof-of-concept code on 2026-11-08 and 2026-11-09 for what Huntress counts as 33 critical flaws in N-able's N-central remote monitoring and management appliance, tested on pre-release build 2026.4.0.31, which chain into four exploits, three to remote code execution and one to root; one chain starts with an unauthenticated XML external entity flaw. N-able took hosted N-central offline on 2026-11-09 and on 2026-11-10 released 2026.4 Hotfix 2, build 2026.4.1.26, which hosted servers already run; on-premises customers must upgrade their servers, and every customer must upgrade Agents and then Probes. N-able's status page reports scanning activity associated with the published proof-of-concept code but no evidence of a successful exploitation of any customer environment, and seven CVE ids have been assigned."
