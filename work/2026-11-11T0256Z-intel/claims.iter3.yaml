    surface: "body"
    kind: cited
    text: "SquadC can be set to run only while a browser process is alive, persists through a Run key named WindowsUpdateAssist, and offers file operations, command execution and screenshots; A second route is a spear-phishing RAR whose LNK abuses ftp.exe, with the same C2 ("
    urls: ["https://research.checkpoint.com/2026/not-all-that-glitters-is-gold-tracking-copperdragons-sparrow-framework-around-the-globe/"]
  - claim_id: 9425e1b875
