    surface: "summary"
    kind: frontmatter
    text: "Google's Stable-channel update of 2026-11-09 fixes nine vulnerabilities in Chrome 157 and says an exploit for CVE-2026-125350, a high-severity use-after-free in Chromium's XML component, exists in the wild; CISA added it to its Known Exploited Vulnerabilities catalog on 2026-11-10 and no source describes the attacks. The fixed builds are 157.0.8103.50 (Linux) and 157.0.8103.50 or .51 (Windows, macOS), and NCSC Switzerland notes that Chromium-based browsers such as Microsoft Edge were still preparing their patches."
