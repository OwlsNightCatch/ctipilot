    entry: 2026-11-11/cve-2026-124194-outlook-forced-authentication-exploited-kev
    surface: "summary"
    kind: frontmatter
    text: "Microsoft's November 2026 Patch Tuesday fixes CVE-2026-124194, an Outlook spoofing flaw (CVSS 3.1 6.5) that Microsoft marks as exploited and not publicly disclosed and that CISA added to its Known Exploited Vulnerabilities catalog on 2026-11-10: a user who opens a crafted message file lets Outlook connect to an attacker-controlled location without the usual external-content warning, which can disclose authentication information. The Preview Pane is not an attack vector; BleepingComputer reports that the disclosed credential is the user's NTLMv2 hash, and no source names the actor or the victims."
  - claim_id: c1cad07b5f
    entry: 2026-11-11/cve-2026-124194-outlook-forced-authentication-exploited-kev
    surface: "actions[0]"
    kind: frontmatter
    text: "Install the November 2026 Office updates on every Outlook installation now (Office LTSC 2024 to 16.0.17932.21140, Office LTSC 2021 to 16.0.14334.21048, Microsoft 365 Apps through its update channel), then check proxy and firewall logs back to the earliest message-file delivery you can find for Outlook connections to external SMB, WebDAV or HTTP destinations, and reset the accounts of any user whose session authenticated to one."
