  - claim_id: 555200d885
    entry: 2026-10-13/danfoss-ak-sm-ak-sc-french-supermarket-refrigeration-attack
    surface: "summary"
    kind: frontmatter
    text: "Coopérative U, Intermarché and E. Leclerc confirmed to AFP a cyberattack on their refrigeration systems overnight on 11 to 12 October 2026, a remotely forced defrost at hundreds of French stores, and on 2026-11-09 France's foreign ministry and the C4 crisis cell attributed that campaign to the Iranian unit Shahid Kaveh, affiliated with the Revolutionary Guard's electronic and cyber centre, CERT-FR calling its case a bundle of indicators. The French documents cover that campaign only: more than 115 stores in at least six more countries and the first German shops followed on 2026-11-02, the French blood service reported altered cold-room settings at three sites the same day, and SRF reported on 2026-11-05 the first publicly known Swiss cases, a Köniz butcher and three Volg stores. CERT-FR reports numerous compromises of Danfoss AK-SM and AK-SC controllers and of Copeland xweb and Dixell xweb; NCSC Switzerland rates the activity actively exploited but says the public information does not establish a common attack method or confirm exploitation of the Danfoss CVEs it lists, and ANSSI says controllers directly on the internet and weak passwords were exploited. CISA, FBI, HHS, USDA and DOT published a joint warning on refrigeration and cold-chain controllers that names no vendor. BACS repeated its warning publicly on 2026-11-10 and says security updates fixing the known flaws exist for the Danfoss AK-SM 800A and 8xxA family. ENISA, the European Commission, Europol and the CSIRTs Network advised immediate action on 2026-11-04, and Ransom-ISAC's log of one Copeland XWEB Pro compromise shows 743 parameter writes in two administrator sessions."
