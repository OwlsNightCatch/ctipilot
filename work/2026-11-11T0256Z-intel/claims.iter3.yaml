  - claim_id: 4dac982563
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "headline"
    kind: frontmatter
    text: "Eight eMudhra CA keys were guessable; Windows drops the rest on 2026-11-16; Java, Python, Go, GitLab need updates"
  - claim_id: 804bc4bb4d
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "summary"
    kind: frontmatter
    text: "On 2026-10-17 a researcher reported that the private keys of eight eMudhra intermediate CA certificates had been generated with too little randomness, so anyone could recover them and forge trusted HTTPS certificates for any site. Firefox, Chrome, Apple and Microsoft platforms block the intermediates and eMudhra revoked them; Microsoft went further on 2026-10-26 and removed seven eMudhra-hierarchy certificates from the Windows trust list, and from the Edge trust list on 2026-10-27. Software that keeps its own trust store or does not check revocation stays exposed until updated: Go fixed it in 1.27.3 and 1.26.10 as CVE-2026-111943, GitLab in its releases of 2026-10-29, Python added a built-in denylist as CVE-2026-115557, and Java needs the second update of 2026-10-24 (CVE-2026-114820, CVSS 3.1 9.1) even on a runtime updated in the past few days. Chrome's removal of the emSign ECC Root CA - G3 root was due on 2026-10-27; Cisco's advisory, now at version 1.9, gives IOS XE a distrust guide and dates its ISE fixes to December 2026 and April 2027; the curl, git, python3 and openssl that ship with macOS trust the intermediates until macOS 27.2.1, 26.7.3 or 15.8.3, Microsoft removes the remaining eMudhra roots from Windows, Edge and WebView2 from 2026-11-16, Chrome 153 and higher will stop trusting by default certificates under emSign Root CA - G1 whose earliest SCT is after 2026-11-16, and no exploitation is reported. SonicWall's SonicOS firewalls with Client DPI-SSL enabled kept trusting the chains and re-signed them for clients until SonicOS 7.3.4-7015 (Gen7) and 8.2.3-8015 (Gen8)."
  - claim_id: 393f77aa43
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "actions[0]"
    kind: frontmatter
    text: "Update every non-browser TLS client that keeps its own CA bundle or does not check revocation to a fixed version: standalone Java runtimes, including those already updated on 2026-10-21, to the update of Oracle's Security Alert CVE-2026-114820 or OpenJDK (Oracle Database Server, Autonomous Health Framework and OPatch installations too), Python 3.15.2, 3.14.10, 3.13.18, 3.12.16 or 3.11.18 together with pip 26.2.2 or later, Go 1.27.3 or 1.26.10, self-managed GitLab to a fixed patch release together with GitLab Runner 19.5.1, and SonicWall Gen7 firewalls with Client DPI-SSL enabled to SonicOS 7.3.4-7015 or later and Gen8 to 8.2.3-8015 or later; then confirm with curl against the incident tracker's test host that the client rejects the certificate; on managed Macs update to macOS 27.2.1, 26.7.3 or 15.8.3, or where that is not possible remove emSign ECC Root CA - G3 from /etc/ssl/cert.pem as Apple describes (AAA Certificate Services is optional and can stop tools that read only that file from verifying some unaffected sites)."
  - claim_id: 6b253fce8e
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "actions[1]"
    kind: frontmatter
    text: "Replace, by hand where the ACME client does not support ACME Renewal Information, every TLS certificate your organisation holds that chains to emSign ECC Root CA - G3 or to another of the seven certificates Microsoft removed from the Windows and Edge trust lists, because Chrome's removal of the G3 root was due on 2026-10-27 and the Windows change takes effect when the trust-list update reaches a device; deliver the updated Disallowed Certificate Trust List and the trust-list changes Microsoft describes, including its out-of-band update of 2026-10-26, to Windows devices that do not receive automatic certificate-trust updates; do not renew or reissue under emSign Root CA - G1 after 2026-11-16, because Chrome 153 and higher will not trust by default a certificate under it whose earliest SCT is later, and Windows, Edge and WebView2 stop trusting the remaining eMudhra roots on 2026-11-16 as Microsoft's update of 2026-11-10 describes."
  - claim_id: cd3db5794b
    entry: 2026-10-21/emudhra-intermediate-ca-keys-recoverable-trust-store-updates
    surface: "actions[2]"
    kind: frontmatter
    text: "Apply Cisco's remediation now for the products its eMudhra advisory (version 1.9) lists with a fix or a procedure available: the CA-trust distrust guide for IOS XE and the guidance for Secure Firewall ASA, FTD and FMC, Secure Email Gateway and Secure Email and Web Manager (run the updatenow command where updates are manual), Duo Access Gateway 3.2.0, Duo Network Gateway 3.4.1, Duo Agentic Authorization Connector 1.0.1 and ThousandEyes Enterprise Agent (Application-hosting Agent 5.2.2)."
