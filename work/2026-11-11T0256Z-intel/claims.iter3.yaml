    kind: cited
    text: "**Exposure:** Chrome desktop below 157.0.8103.50 and any Chromium-based browser (Edge, Brave, Opera, Vivaldi) until its vendor ships the Chromium 157 fix; the build shows in chrome://version or in the managed-browser inventory, and Google rolls the release out over days to weeks, so a pending relaunch leaves a patched machine still running the old code ("
