  - claim_id: f534b44d94
    entry: 2026-11-11/copperdragon-silentdelivery-fake-certificate-watering-holes
    surface: "body"
    kind: cited
    text: "Compromised government, shipping, IT and research websites, one through cross-site scripting in an unsanitised input field, carry obfuscated JavaScript that fingerprints the visitor and replaces the page with a language-localised fake Google Chrome SSL warning urging a \"Certificate Fix\" utility; the MSI, served from compromised cloud storage buckets, installs the new SquadC backdoor or a SparrowDoor variant ("
    urls: ["https://research.checkpoint.com/2026/not-all-that-glitters-is-gold-tracking-copperdragons-sparrow-framework-around-the-globe/"]
  - claim_id: 514a0688a2
