  - claim_id: 508a2d744f
    entry: 2026-11-10/sap-november-2026-cna-records-four-unauth-cvss-10-rows
    surface: "body"
    kind: cited
    text: "ProxyGate is a kernel flaw whose exploitability depends on the Gateway's proxy access list: a permissive prxyinfo file, or none with gw/acl_mode_proxy at its default of 0, leaves the system exposed, so \"neither a version check nor patching alone tells you whether you are safe\"; on most releases SAP's fix combines the kernel patch with gw/acl_mode_proxy = 1, and the required minimum patches are 7.22 EXT, EX2 and EX3 PL 1612, 7.53 PL 1625, 7.54 PL 718, 7.77 PL 915, 8.04 PL 244, 9.20 PL 16 and 9.21 PL 4 ("
    urls: ["https://onapsis.com/blog/proxygate-cve-2026-89103-sap-netweaver-gateway-threat-advisory/"]
