  - claim_id: acec4e4ae5
    entry: 2026-11-10/sap-november-2026-cna-records-four-unauth-cvss-10-rows
    surface: "headline"
    kind: frontmatter
    text: "SAP Patch Day: four unauthenticated CVSS 10.0 flaws; Onapsis names ICM2SHELL and the fixed kernel levels"
  - claim_id: e19d631802
    entry: 2026-11-10/sap-november-2026-cna-records-four-unauth-cvss-10-rows
    surface: "summary"
    kind: frontmatter
    text: "SAP's Patch Day of 2026-11-10 fixes four flaws it scores CVSS 3.1 10.0, reachable over the network with no privileges or user interaction: an authentication bypass in the SAML2 service provider of NetWeaver AS ABAP and the ABAP Platform that lets an attacker impersonate any user under certain configurations, memory corruption in SAP Web Dispatcher and in the NetWeaver ABAP Internet Communication Manager that Onapsis calls ICM2SHELL, and a Gateway flaw Onapsis calls ProxyGate in which the default proxy access list treats an external attacker as an internal application server. Onapsis gave SAP a working unauthenticated code-execution exploit for ICM2SHELL and has not observed attacks on either; the fixes are SAP Security Notes 3849308, 3778556, 3778530 and 3798345, the kernel patch levels are listed below, and ProxyGate also needs the parameter gw/acl_mode_proxy set to 1."
  - claim_id: 31710cc4e6
    entry: 2026-11-10/sap-november-2026-cna-records-four-unauth-cvss-10-rows
    surface: "actions[0]"
    kind: frontmatter
    text: "Apply SAP Security Notes 3778556 and 3778530 to every Web Dispatcher and every ABAP application server (kernel 7.40 or higher, including the Web Dispatcher embedded in SAP HANA XS) to at least the fixed patch levels Onapsis lists, internet-facing Web Dispatchers and Internet Communication Managers first, and apply note 3849308 on systems that use the SAML2 service provider, because Onapsis gave SAP a working unauthenticated code-execution exploit."
  - claim_id: 3d5d24250e
    entry: 2026-11-10/sap-november-2026-cna-records-four-unauth-cvss-10-rows
    surface: "actions[1]"
    kind: frontmatter
    text: "On every SAP Gateway apply note 3798345 together with gw/acl_mode_proxy = 1 and a restrictive prxyinfo file, because Onapsis says a version check or the kernel patch alone does not show whether the Gateway is safe."
