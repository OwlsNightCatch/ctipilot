  - claim_id: 418b79c735
    entry: 2026-11-11/copperdragon-silentdelivery-fake-certificate-watering-holes
    surface: "summary"
    kind: frontmatter
    text: "Check Point Research groups three China-nexus intrusion sets under a malware-supply entity it calls CopperDragon, a possible supplier to actors that use the cross-platform Sparrow framework; shared tooling, Check Point cautions, does not prove one operator. The nearest to the constituency is SilentDelivery, which injects script into compromised government, shipping, IT and research websites to replace the page with a fake Chrome certificate warning that pushes a \"Certificate Fix\" installer carrying the SquadC backdoor, with the Czech Republic, Germany and France among the countries in Check Point's telemetry."
  - claim_id: b8763175a7
    entry: 2026-11-11/copperdragon-silentdelivery-fake-certificate-watering-holes
    surface: "body"
    kind: cited
    text: "Check Point Research's year-long investigation groups three intrusion sets under one malware-supply entity it calls CopperDragon, a possible \"digital quartermaster\" for China-nexus actors that use the cross-platform Sparrow framework (FamousSparrow and Earth Estries among them); Check Point itself cautions that the use of the same backdoor or C2 infrastructure \"does not necessarily mean\" the same actor ran two intrusions, so this is a hypothesis ("
