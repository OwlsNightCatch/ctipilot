  - claim_id: f35b8b30f2
    entry: 2026-11-04/cve-2026-116606-barracuda-esg-auth-bypass-root-rce
    surface: "summary"
    kind: frontmatter
    text: "Barracuda's advisory of 2026-11-02 covers CVE-2026-116606, a pre-authentication authorization bypass in the Email Security Gateway (CVSS 9.3) that lets an unauthenticated remote attacker restore a crafted backup archive through the configuration-import function, and CVE-2026-111560, a command injection in the timezone field (8.6) that also affects the Load Balancer ADC, Message Archiver, WAF Control Center, Web Application Firewall and Web Security Gateway; chained, they give root. watchTowr Labs showed on 2026-11-05 that the chain needs no account, one unauthenticated request to the login handler reaching the restore function, and Barracuda changed its advisory the same day to say authentication is not required for CVE-2026-116606, only that the administrative interface must be reachable; watchTowr published a detection tool. Barracuda added on 2026-11-09 that it has identified exploitation activity affecting a small number of organizations, without naming the flaw, the Canadian Cyber Centre says open-source reporting indicates CVE-2026-116606 is exploited in the wild, and CISA added both flaws to its Known Exploited Vulnerabilities catalog on 2026-11-10 and marks both for forensic triage. Barracuda names firmware 9.4.0.029 as the fixed build while the CVE record lists builds before 9.4.0.030 as affected."
  - claim_id: a9e18a50c9
    entry: 2026-11-04/cve-2026-116606-barracuda-esg-auth-bypass-root-rce
    surface: "actions[0]"
    kind: frontmatter
    text: "Restrict the administrative interface of every Barracuda Email Security Gateway, Load Balancer ADC, Message Archiver, WAF Control Center, Web Application Firewall and Web Security Gateway to trusted internal networks now, update every Email Security Gateway to firmware 9.4.0.029 or later, the build Barracuda names (the CVE record lists builds before 9.4.0.030 as affected), and apply Barracuda's patch to each of the other products (BNADC-16586 for the Load Balancer ADC and the Web Application Firewall, BNMA-32468, BNWF-60060, BNYF-24789), confirming that automatic patching is on."
  - claim_id: f53ded1376
    entry: 2026-11-04/cve-2026-116606-barracuda-esg-auth-bypass-root-rce
    surface: "actions[1]"
    kind: frontmatter
    text: "On every Email Security Gateway whose interface was reachable before the patch, check its configuration for a restore nobody made and its timezone setting for anything other than a timezone name, because watchTowr's single unauthenticated request can reach both and CISA lists both flaws as exploited and requires forensic triage."
