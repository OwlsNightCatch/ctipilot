    surface: "body"
    kind: derived
    text: "**Exposure:** staff of public bodies, shipping, IT and research organisations who browse peer websites, web teams whose sites accept unsanitised input, and Windows endpoints that let a standard user run an MSI from a browser download."
  - claim_id: e7ae337127
    entry: 2026-11-11/copperdragon-silentdelivery-fake-certificate-watering-holes
    surface: "body"
    kind: derived
    text: "**Detection:** in endpoint telemetry, a browser followed by msiexec running an installer named like a certificate repair utility and a new Run key value with an update-themed name; in module-load telemetry, DLL sideloading by rarely abused executables, and the WinDivert driver loaded by a process that is not a VPN or firewall product; in account telemetry, a new local administrator account; on Linux, ssh and sshd binaries that differ from the package-manager copy and frpc or chisel binaries; in DNS, MX-query volume from servers that send no mail."
  - claim_id: eec5b7a032
    entry: 2026-11-11/copperdragon-silentdelivery-fake-certificate-watering-holes
    surface: "body"
    kind: derived
    text: "**Triage:** WinDivert is legitimate in VPN and firewall products, so the signal is a parent that is a sideloaded DLL or backdoor rather than the vendor's signed service; SoftEther is legitimate software, but not under a system-process name in a non-system path; a genuine Chrome SSL warning is never cleared by installing an MSI."
  - claim_id: 22ade0cf7b
    entry: 2026-11-11/copperdragon-silentdelivery-fake-certificate-watering-holes
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** treat a browser page that offers a \"certificate fix\" installer as an incident trigger and stop standard users running MSI installers from a browser download; web teams of government and research sites should check for injected third-party script and input-handling flaws, because a compromised site becomes a delivery vehicle for its peers."
  - claim_id: 1e0c695222
    entry: 2026-11-11/turla-cereal-exchange-server-c2-and-mail-collector-gov
    surface: "headline"
    kind: frontmatter
    text: "ESET: Turla's Cereal runs the victim's own Exchange server as C2 and wraps transport agents to collect mail"
  - claim_id: 50480d3182
    entry: 2026-11-11/turla-cereal-exchange-server-c2-and-mail-collector-gov
    surface: "summary"
    kind: frontmatter
    text: "ESET found a previously undocumented .NET toolset, Cereal, on a Kazakh government organisation's Exchange server in November 2025 and on a Romanian government organisation's from December 2025, and attributes it to Turla with high confidence. The compromised Exchange server is the command channel, answering requests on web paths that imitate Outlook Web Access, Autodiscover and ActiveSync, and a module injected into the transport service wraps existing transport agents to collect mail, in Romania configured to select messages to or from NATO and EU addresses; ESET could not determine the initial access method."
  - claim_id: 17f3caacd8
    entry: 2026-11-11/turla-cereal-exchange-server-c2-and-mail-collector-gov
    surface: "actions[0]"
    kind: frontmatter
    text: "On every internet-facing Exchange server, compare ncobjapi.dll and wbemcomn.dll in C:\\\\Windows\\\\System32\\\\wbem\\\\ and the Microsoft.Exchange .ni.dll files in the .NET native image cache with the Microsoft originals and list the non-Microsoft assemblies loaded into EdgeTransport.exe, because ESET places the Cereal loader at those locations and Get-TransportAgent shows nothing new."
  - claim_id: dac7310604
    entry: 2026-11-11/turla-cereal-exchange-server-c2-and-mail-collector-gov
    surface: "body"
    kind: cited
    text: "ESET found a previously undocumented .NET toolset, Cereal, on a Kazakh government organisation's Exchange server on 2025-11-28 and, after tuning its detections, on a Romanian government organisation's Exchange server compromised from 2025-12-23; in Romania the mail-collection module was configured to identify messages to or from NATO and EU institutional addresses ("
    urls: ["https://www.welivesecurity.com/en/eset-research/exchange-for-breakfast-turlas-cereal-tricks-are-not-for-kids/"]
  - claim_id: 14617a1ba5
    entry: 2026-11-11/turla-cereal-exchange-server-c2-and-mail-collector-gov
    surface: "body"
    kind: cited
    text: "ESET attributes Cereal to Turla with high confidence, on the concurrent use of another component publicly linked to Turla and conceptual similarity to older Turla malware, and could not determine the initial access method, although it considers a vulnerability exploit possible because the servers are reachable from the internet ("
    urls: ["https://web-assets.esetstatic.com/wls/en/papers/white-papers/turla-cereal-tricks.pdf"]
  - claim_id: 5036315692
    entry: 2026-11-11/turla-cereal-exchange-server-c2-and-mail-collector-gov
    surface: "body"
    kind: cited
    text: "CerealNeuron runs on the compromised server and passively waits for requests on web paths made to look like Outlook Web Access, Autodiscover and ActiveSync traffic; a correctly encrypted request is treated as a command and a bad one gets a normal-looking Exchange error page, and ESET found no operator-controlled server and could not identify ingress addresses ("
    urls: ["https://www.welivesecurity.com/en/eset-research/exchange-for-breakfast-turlas-cereal-tricks-are-not-for-kids/"]
  - claim_id: 0abdaf01bc
    entry: 2026-11-11/turla-cereal-exchange-server-c2-and-mail-collector-gov
    surface: "body"
    kind: cited
    text: "CerealHermit is a network-less variant that reads encrypted command files from disk, and each task runs as a small .NET assembly inside a CerealRunner (mailbox retrieval, Active Directory and WMI queries, LSA secrets extraction, file operations) ("
    urls: ["https://www.welivesecurity.com/en/eset-research/exchange-for-breakfast-turlas-cereal-tricks-are-not-for-kids/"]
  - claim_id: 90a9bb07ec
    entry: 2026-11-11/turla-cereal-exchange-server-c2-and-mail-collector-gov
    surface: "body"
    kind: cited
    text: "CerealLoader, the only component written to disk in recognisable .NET form, abuses .NET VTable fixups so native code runs before managed code and is placed where trusted processes load it: the System32 wbem directory (ncobjapi.dll, wbemcomn.dll, loaded by WMI) and the .NET native image cache ("
    urls: ["https://www.welivesecurity.com/en/eset-research/exchange-for-breakfast-turlas-cereal-tricks-are-not-for-kids/"]
  - claim_id: d1adb7fd2f
    entry: 2026-11-11/turla-cereal-exchange-server-c2-and-mail-collector-gov
    surface: "body"
    kind: cited
    text: "CerealBox, injected into EdgeTransport.exe, wraps the handlers of transport agents already loaded, so \"no new agent appears anywhere in Exchange's configuration\"; it keeps messages with .doc, .docx or .pdf attachments that match hard-coded sender, recipient, subject or attachment-name lists and stages them compressed and encrypted on disk for exfiltration through CerealNeuron ("
    urls: ["https://www.welivesecurity.com/en/eset-research/exchange-for-breakfast-turlas-cereal-tricks-are-not-for-kids/"]
  - claim_id: a56611c428
    entry: 2026-11-11/turla-cereal-exchange-server-c2-and-mail-collector-gov
    surface: "body"
    kind: uncited
    text: "The command channel is the victim's own Exchange server."
  - claim_id: 50bb008a32
    entry: 2026-11-11/turla-cereal-exchange-server-c2-and-mail-collector-gov
    surface: "body"
    kind: derived
    text: "**Exposure:** any organisation that runs Microsoft Exchange on premises with a role reachable from the internet; ESET names no vulnerable version, so exposure is the deployment model."
  - claim_id: e0bf6e0e9b
    entry: 2026-11-11/turla-cereal-exchange-server-c2-and-mail-collector-gov
    surface: "body"
    kind: derived
    text: "**Detection:** file-integrity telemetry on the Exchange host for DLLs in the System32 wbem directory and .NET native image cache files that do not match the Microsoft originals; module telemetry for non-Microsoft assemblies loaded into EdgeTransport.exe while Get-TransportAgent lists nothing new; web-server logs for requests to the Outlook Web Access, Autodiscover and ActiveSync look-alike paths from clients with no matching mailbox flow, whose encrypted bodies return a generic error page; and Exchange Web Services mailbox retrievals made from the server's own context."
  - claim_id: f876e814b4
    entry: 2026-11-11/turla-cereal-exchange-server-c2-and-mail-collector-gov
    surface: "body"
    kind: derived
    text: "With no external C2 and no known entry vector, the check is a compromise assessment of every internet-facing Exchange server."
  - claim_id: 4bc462771d
    entry: 2026-11-11/turla-cereal-exchange-server-c2-and-mail-collector-gov
    surface: "body"
    kind: derived
    text: "**Triage:** third-party anti-spam, data-loss-prevention and archiving products also inject into the transport service, but they are vendor-signed and appear in the transport-agent configuration, which CerealBox does not; the native image cache regenerates legitimately after .NET updates, so a changed timestamp alone is weak, while a file that does not match the Microsoft binary is the signal."
  - claim_id: 32f970e9e8
    entry: 2026-11-11/turla-cereal-exchange-server-c2-and-mail-collector-gov
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** treat internet-facing Exchange servers as top-tier assets with endpoint detection and restricted egress, baseline the wbem directory and the native image cache, and run the compromise assessment now, because network-only detection will not find a channel that rides the victim's own web paths."
  - claim_id: 025a684349
    entry: 2026-11-11/ghostframe-esxi-post-exploitation-framework-tag-218
    surface: "headline"
    kind: frontmatter
    text: "Insikt: GhostFrame implant re-disables ESXi execInstalledOnly every five seconds and steals guest credentials"
  - claim_id: fbb65518be
    entry: 2026-11-11/ghostframe-esxi-post-exploitation-framework-tag-218
    surface: "summary"
    kind: frontmatter
    text: "Recorded Future's Insikt Group describes GhostFrame, a command-and-control and post-exploitation framework for VMware ESXi hosts that operators must already hold root on: its vmhostd-core implant persists through ESXi boot scripts, disables the ESXi firewall and the execInstalledOnly control about every five seconds, and a web panel controls guest VMs and runs VMkatz against memory snapshots and virtual disks to recover Windows credentials. Insikt links it to TAG-218, whose activity overlaps Settra ransomware and whose servers targeted SonicWall, Palo Alto Networks and Fortinet VPN appliances in the US and Europe from late August to October 2026."
  - claim_id: b964cb749e
    entry: 2026-11-11/ghostframe-esxi-post-exploitation-framework-tag-218
    surface: "actions[0]"
    kind: frontmatter
    text: "On every ESXi host that sits behind a SonicWall, Palo Alto Networks or Fortinet VPN appliance that was compromised or unpatched since late August, check for an unexpected executable under /opt, a process masquerading as the ESXi host daemon, changes to /etc/rc.local.d/local.sh, and an ESXi firewall or execInstalledOnly setting that switches itself back off, because Insikt reports the implant resets both controls about every five seconds and re-enabling them without removing its persistence is futile."
  - claim_id: 4009079fe6
