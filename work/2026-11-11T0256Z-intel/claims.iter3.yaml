    entry: 2026-11-11/vates-xen-orchestra-vsa-2026-062-auth-bypass-exploited
    surface: "actions[1]"
    kind: frontmatter
    text: "On every Xen Orchestra instance that was reachable from an untrusted network, search the XCP-ng hosts for the artefacts Vates lists (a VM whose platform parameter binds a file to the serial port, an unexpected VM, cron files written by the actor and a changed dynamic-linker preload file), and where compromise is confirmed reinstall from scratch and rotate every secret the Vates stack held, because Vates says cleanup alone cannot guarantee the removal of backdoors."
  - claim_id: aa31377a91
    entry: 2026-11-11/vates-xen-orchestra-vsa-2026-062-auth-bypass-exploited
    surface: "body"
    kind: cited
    text: "Vates published advisory VSA-2026-062 on 2026-11-10, rated Critical, for Xen Orchestra and the Xen Orchestra Appliance (XOA), the web management plane for XCP-ng pools; no CVE id or CVSS score has been assigned ("
    urls: ["https://docs.vates.tech/security-advisories/advisories/2026/vates-sa-2026-062/", "https://www.bleepingcomputer.com/news/security/critical-xen-orchestra-auth-bypass-flaw-exploited-to-hijack-vm-servers/"]
  - claim_id: afb08b8ad5
    entry: 2026-11-11/vates-xen-orchestra-vsa-2026-062-auth-bypass-exploited
    surface: "body"
    kind: cited
    text: "Vates says a threat actor is actively exploiting the flaw, that an adversary can bypass authentication and act with Admin privilege, and that a compromise can lead to arbitrary code execution on managed pools and a full takeover of XCP-ng nodes as root ("
    urls: ["https://docs.vates.tech/security-advisories/advisories/2026/vates-sa-2026-062/"]
  - claim_id: 34a52df95a
    entry: 2026-11-11/vates-xen-orchestra-vsa-2026-062-auth-bypass-exploited
    surface: "body"
    kind: cited
    text: "The mechanism, per Vates: the REST cookie parser turns an authenticationToken cookie of j:%7B%7D into an empty object, the REST authentication path hands that object to the token provider without requiring a string, the token lookup treats it as unfiltered and returns the first token, and the provider authenticates as that token's owner if the token has not expired; the authenticated token-listing route then returns reusable login token ids ("
    urls: ["https://docs.vates.tech/security-advisories/advisories/2026/vates-sa-2026-062/"]
  - claim_id: 7ec9d6937e
    entry: 2026-11-11/vates-xen-orchestra-vsa-2026-062-auth-bypass-exploited
    surface: "body"
    kind: cited
    text: "Xen Orchestra before 6.9.2 (stable) and before 6.10.1 (latest) is affected, and the fixes are xo-server 5.211.2 on the stable channel and 5.213.1 on the latest channel; a source install must move to the latest master ("
    urls: ["https://docs.vates.tech/security-advisories/advisories/2026/vates-sa-2026-062/"]
  - claim_id: 265a190b55
    entry: 2026-11-11/vates-xen-orchestra-vsa-2026-062-auth-bypass-exploited
    surface: "body"
    kind: cited
    text: "BleepingComputer gives different release numbers, so check the installed xo-server version rather than the release label ("
    urls: ["https://www.bleepingcomputer.com/news/security/critical-xen-orchestra-auth-bypass-flaw-exploited-to-hijack-vm-servers/"]
  - claim_id: 91d89e7bd6
    entry: 2026-11-11/vates-xen-orchestra-vsa-2026-062-auth-bypass-exploited
    surface: "body"
    kind: cited
    text: "**Exposure:** any Xen Orchestra or XOA instance below those versions whose web or REST port is reachable from an untrusted network; Vates' first mitigation is a dedicated management network, never the internet ("
    urls: ["https://docs.vates.tech/security-advisories/advisories/2026/vates-sa-2026-062/"]
  - claim_id: 5eb2946854
    entry: 2026-11-11/vates-xen-orchestra-vsa-2026-062-auth-bypass-exploited
    surface: "body"
    kind: cited
    text: "**Detection:** a successful exploit leaves no Xen Orchestra log, so the signal is on the wire or at a reverse proxy: HTTP requests whose authenticationToken cookie is an empty JSON object in the encoded or the literal form, and Vates warns that a rule written as a regular expression can be bypassed with other encodings ("
    urls: ["https://docs.vates.tech/security-advisories/advisories/2026/vates-sa-2026-062/"]
  - claim_id: 578f375f70
    entry: 2026-11-11/vates-xen-orchestra-vsa-2026-062-auth-bypass-exploited
    surface: "body"
    kind: cited
    text: "On the XCP-ng hosts Vates lists a VM that sends its serial console to a file, a VM with an unexpected name, cron files written by the actor and the dynamic-linker preload file, and says these cover only the known campaign, so their absence does not prove a clean host ("
    urls: ["https://docs.vates.tech/security-advisories/advisories/2026/vates-sa-2026-062/"]
  - claim_id: 135388bade
    entry: 2026-11-11/vates-xen-orchestra-vsa-2026-062-auth-bypass-exploited
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** update now and take the interface off any untrusted network; for an instance that was exposed, treat the stack as possibly compromised, rotate every secret it held (backup remotes, the root and pool secrets, user and OTP secrets, mail-server passwords) and reinstall where compromise is confirmed ("
    urls: ["https://docs.vates.tech/security-advisories/advisories/2026/vates-sa-2026-062/"]
  - claim_id: b32184a06b
    entry: 2026-11-11/vates-xen-orchestra-vsa-2026-062-auth-bypass-exploited
    surface: "body"
    kind: uncited
    text: "The attacker needs network reach to the interface and an unexpired first token in the Xen Orchestra token store, and no credentials or user interaction."
