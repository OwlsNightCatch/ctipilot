    kind: cited
    text: "Onapsis provided SAP a working unauthenticated code-execution exploit that runs commands as the system's <sid>adm user, a single connection crashes the process on every kernel it tested, and it has not observed attacks; NCSC Switzerland lists the exploitation status as unknown ("
    urls: ["https://onapsis.com/blog/icm2shell-cve-2026-76964-cve-2026-89126-sap-netweaver-web-dispatcher-threat-advisory/", "https://security-hub.ncsc.admin.ch/#/posts/13167"]
