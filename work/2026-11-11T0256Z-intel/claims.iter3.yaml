    entry: 2026-11-11/ivanti-epm-cve-2026-121653-unauthenticated-sqli-rce
    surface: "headline"
    kind: frontmatter
    text: "Ivanti EPM Core: unauthenticated SQL injection to RCE, fixed in 2024 SU8; Cloud Services cert flaw too; none exploited"
  - claim_id: 48493683c8
    entry: 2026-11-11/ivanti-epm-cve-2026-121653-unauthenticated-sqli-rce
    surface: "summary"
    kind: frontmatter
    text: "Ivanti's CNA records of 2026-11-10 describe CVE-2026-121653, an SQL injection in the Core of Ivanti Endpoint Manager before 2024 SU8 that lets a remote unauthenticated attacker reach remote code execution (CVSS 3.1 9.8), and CVE-2026-121683, missing authentication in Ivanti Cloud Services Application 5.0.8 that lets a remote unauthenticated attacker add and delete trusted EPM Core certificate entries (9.4). The records state no exploitation; Ivanti's own advisory pages could not be read, so the fixed Cloud Services Application build is not known."
  - claim_id: 34771b1833
    entry: 2026-11-11/ivanti-epm-cve-2026-121653-unauthenticated-sqli-rce
    surface: "actions[0]"
    kind: frontmatter
    text: "Upgrade every Ivanti Endpoint Manager Core server to 2024 SU8 or later, and read Ivanti's advisory for the fixed Cloud Services Application build before treating 5.0.8 as patched, because the CNA record gives an unauthenticated path to code execution on the server that distributes software to the managed endpoints."
  - claim_id: 8fb58623b4
