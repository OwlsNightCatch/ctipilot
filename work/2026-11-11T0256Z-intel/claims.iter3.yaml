    surface: "body"
    kind: cited
    text: "**Exposure:** a system that runs one of the components and lets an untrusted network reach its Web Dispatcher, Internet Communication Manager, Gateway or SAML2 endpoint; the SAML2 flaw applies only where the SAML 2.0 service provider is configured ("
