  - title: "Chur medical centre Gleis D and pharmacy Medi Porta: patient and staff data copied from local storage; Cloak claims 87 GB"
    sources:
      - { url: "https://www.inside-it.ch/cyberangriff-auf-buendner-gesundheitszentrum-20261106", publisher: "Inside IT", date: "2026-11-06", role: "primary" }
      - { url: "https://www.swisscybersecurity.net/news/2026-11-09/cyberkriminelle-erbeuten-patienten-und-mitarbeiterdaten-von-churer", publisher: "SwissCybersecurity.net", date: "2026-11-09", role: "corroborating" }
    discovery_trace: "first seen at: swisscybersecurity-net, URL https://www.swisscybersecurity.net/ (extract of the home page; headline dated 09.11.2026) -> article https://www.swisscybersecurity.net/news/2026-11-09/cyberkriminelle-erbeuten-patienten-und-mitarbeiterdaten-von-churer (extract) -> pivot: Inside IT https://www.inside-it.ch/cyberangriff-auf-buendner-gesundheitszentrum-20261106 (url --direct, text from the __NEXT_DATA__ JSON). The centre's own notice was not located (WebSearch for it found only ransomware trackers)."
    lookback: true
    summary: |
      The Medizinisches Zentrum Gleis D and the pharmacy Medi Porta in Chur (canton Graubünden) say they were hit by a cyberattack: the IT partner and external specialists stopped it and secured the systems, but an outflow of patient and staff data could not be fully prevented. According to the centre, as Inside IT and SwissCybersecurity.net relay it, local data storage was affected and names, addresses, prescriptions and X-ray images left, plus staff data; the electronic patient record, kept in a separate application, was spared; diagnosis and treatment were not affected and operations continue. The centre filed a criminal complaint and reported the incident to BACS and the Federal Data Protection and Information Commissioner (EDÖB), and warns patients of fraud attempts. The ransomware group Cloak claims the attack and says on the darknet it took 87 GB, including identity documents and financial records; the centre would not tell Inside IT whether a ransom is demanded. No source gives the access route, the date of the intrusion or whether files were encrypted; a ransomware tracker lists mediporta.ch as a Cloak claim dated about 24 October 2026 but that is not carried here as fact.
    region_nexus: "Switzerland / canton Graubünden"
    primary_sector_nexus: "indirect - private healthcare provider (outpatient centre and pharmacy), not a public body; held in the same extortion pattern as earlier Swiss health-provider cases"
    sector: "healthcare"
    cves: []
    techniques: []
    affected_products: []
    entity_keys: []
