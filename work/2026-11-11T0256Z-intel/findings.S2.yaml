    verification: SINGLE-SOURCE-NATIONAL-CERT
    confidence: HIGH
    novelty: new
    classification_hint: { reliability: A, credibility: 2 }
    borderline: true
    borderline_reason: "Enforcement by a French regulator with no direct Swiss legal effect. It clears the bar only as a transferable audit list for communal and cantonal defenders (admin MFA, vendor access, logging, segmentation, unsupported servers); the main agent should drop it if it judges the Swiss lens not met. ZATAZ only restates CNIL, so the item is effectively single-source on the regulator's own page."
    evidence:
