  # ---------------------------------------------------------------------------
  - title: "Publica / PK Softech: federal security-policy secretariat, supplier and pension fund say no concrete ransom demand reached them and no data is known on the darkweb"
    sources:
      - { url: "https://www.watson.ch/schweiz/datenschutz/664513749-nach-daten-klau-keine-loesegeldforderung-von-hackern-an-publica-softwarelieferan", publisher: "watson.ch (Keystone-SDA wire text)", date: "2026-11-10", role: "primary" }
      - { url: "https://www.tio.ch/svizzera/cronaca/1962152/riscatto-attacco-publica-fornitore-richiesta-hacker", publisher: "Ticinonline (Keystone-ATS wire text, Italian)", date: "2026-11-10", role: "corroborating" }
    discovery_trace: "first seen at: tio-ch-attacco-informatico, URL https://www.tio.ch/temi/attacco-informatico (url --direct topic listing; headline 'Attacco hacker al fornitore di Publica: «Nessuna richiesta di riscatto»') -> Keystone-ATS article https://www.tio.ch/svizzera/cronaca/1962152/riscatto-attacco-publica-fornitore-richiesta-hacker -> WebSearch (\"PK Softech keine konkrete Lösegeldforderung Sepos Keystone-SDA Bentele Publica Darknet keine Hinweise\" and a domain-restricted follow-up) -> watson.ch German Keystone-SDA text https://www.watson.ch/schweiz/datenschutz/664513749-nach-daten-klau-keine-loesegeldforderung-von-hackern-an-publica-softwarelieferan; PK Softech's own homepage notice of 2026-11-10 is cited only through the wire (its page at https://pksoftech.ch/de/newsreader/Cyberangriff-auf-die-PKSoftechAG still showed the 2026-10-08 text when fetched)"
    summary: |
      On Tuesday 2026-11-10 the Keystone news agency published statements from three first-hand parties about the extortion side of the PK Softech incident. A spokeswoman of the State Secretariat for Security Policy (Sepos, a VBS body), Ursina Bentele, said that no concrete ransom demands addressed to the federal bodies involved in handling the incident are known and that the Confederation paid no ransom; the software supplier, by contrast, did receive a demand, but one 'not made concrete with an amount or deadline'. Sepos also said it still has no indication that data from the attack was published on the darkweb. PK Softech said on its homepage that no concrete ransom demands reached it and that it never contacted the attackers, and that its investigation continues; Publica said it also received no ransom demand, is not in contact with the hackers, and that no insured person has come forward as contacted or harmed, and that it does not know whether other organisations or individuals are being extorted, which is the subject of the Federal Prosecutor's Office investigation. This is the first on-the-record statement by federal authorities and the supplier on the ransom question; it sits against Tamedia's earlier reporting (relayed by Inside IT) that Akira holds about 100 GB and demands ransom, which the covered entry attributes to Tamedia. The two accounts are not strictly contradictory: Sepos says the supplier received a demand without amount or deadline, while PK Softech says none that is concrete. Nothing here changes the confirmed facts (malware intrusion, data outflow, Federal Prosecutor's investigation including Akira, EDÖB formal investigation).
    region_nexus: "Switzerland (federal administration, federally affiliated bodies, cantonal and city pension funds)"
