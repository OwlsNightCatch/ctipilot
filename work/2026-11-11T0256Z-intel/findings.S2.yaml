      - { key: "incident:gleis-d-medi-porta-chur-cloak-2026-10", type: incident, name: "Medizinisches Zentrum Gleis D and Medi Porta (Chur) data theft, Cloak claim", aliases: ["Gleis D Chur cyberattack"], summary: "Cyberattack on a Chur medical centre and pharmacy with patient and staff data copied from local storage; the Cloak group claims 87 GB (Inside IT, 2026-11-06)." }
    relation_suggestions:
      - { subject: "actor:cloak-ransomware", object: "incident:gleis-d-medi-porta-chur-cloak-2026-10", basis: "Inside IT: Cloak claims the attack and says it holds 87 GB (a leak-site claim relayed by Inside IT, not an authority attribution)" }
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    classification_hint: { reliability: C, credibility: 3 }
    borderline: true
    borderline_reason: "Private health provider with no public-sector tie, no stated vector or technique and a leak-site claim for the 87 GB figure; S4 may return it too. It matters to the Swiss health and pharmacy lens only if the main agent applies the precedent of the Groupe 3R entry. The victim's confirmation of the incident and data classes is first-hand but reached us through trade press (Admiralty C), and the two sources are one story."
    evidence:
      - quote: "Die Ransomware-Gruppe Cloak bekennt sich zu dem Cyberangriff auf das Gesundheitszentrum."
        attribution: "Inside IT"
        source_url: "https://www.inside-it.ch/cyberangriff-auf-buendner-gesundheitszentrum-20261106"
      - quote: "Auf die Frage, ob eine Lösegeldforderung vorliegt, äussert sich das Medizinische Zentrum auf Anfrage von inside-it.ch nicht."
        attribution: "Inside IT"
        source_url: "https://www.inside-it.ch/cyberangriff-auf-buendner-gesundheitszentrum-20261106"
      - quote: "Da der Angriff den lokalen Datenspeicher getroffen hat, seien die elektronischen Patientendokumentationen, die in einer separaten Umgebung gespeichert sind, verschont geblieben."
        attribution: "Inside IT"
        source_url: "https://www.inside-it.ch/cyberangriff-auf-buendner-gesundheitszentrum-20261106"
      - quote: "Die Ransomware-Bande Cloak behauptet, 87 Gigabyte an Daten gestohlen zu haben."
        attribution: "SwissCybersecurity.net"
        source_url: "https://www.swisscybersecurity.net/news/2026-11-09/cyberkriminelle-erbeuten-patienten-und-mitarbeiterdaten-von-churer"
      - quote: "Das Gesundheitszentrum hat den Vorfall nach eigenen Angaben dem Bundesamt für Cybersicherheit (BACS) und dem Eidgenössischen Datenschutz- und Öffentlichkeitsbeauftragten (EDÖB) gemeldet sowie Strafanzeige erstattet."
        attribution: "SwissCybersecurity.net"
        source_url: "https://www.swisscybersecurity.net/news/2026-11-09/cyberkriminelle-erbeuten-patienten-und-mitarbeiterdaten-von-churer"
    extended_notes: |
      Technique mapping left empty on purpose: the sources say data left and a ransomware group claims it, but state neither encryption, nor an access method, nor an exfiltration channel. If the main agent must map, T1657 or T1486 would be inference from the actor type, not from the sources.

