  # 1. UPDATE-OF the Danfoss/Copeland refrigeration entry: BACS public warning
  # ---------------------------------------------------------------------------
  - title: "BACS publishes a public warning on cold-chain controllers: identify them, update AK-SM 800A firmware, take end-of-life units off the internet"
    sources:
      - { url: "https://www.bacs.admin.ch/de/warnung-kuehlanlagen-de", publisher: "BACS / NCSC.ch (Im Fokus warning 'Kühl- und Kältesteuerungen: Systeme identifizieren, aktualisieren und schützen')", date: "2026-11-10", role: "primary" }
    discovery_trace: "first seen at: ncsc-ch-focus, URL https://www.bacs.admin.ch/de/im-fokus (url --direct, card list, dated 10. November 2026; the same card is on https://www.bacs.admin.ch/de/aktuelle-vorfaelle) -> primary: https://www.bacs.admin.ch/de/warnung-kuehlanlagen-de (extract)"
    summary: |
      On 2026-11-10 the Swiss Federal Office for Cybersecurity (BACS) published a public-facing warning on its Im Fokus / current-incidents pages, the first BACS statement on the refrigeration campaign outside the Cyber Security Hub advisory 13054 that the entry already cites. BACS says the attacks of recent weeks show Switzerland is affected too, that it had already warned critical-infrastructure operators through the Cyber Security Hub after the French incidents, and that it is repeating the warning because the systems are widespread among small and medium-sized businesses. Per BACS, attackers reach management interfaces that are directly reachable from the internet and then change temperatures, defrost cycles, alarm thresholds or notification settings remotely, which can spoil food, medicines and other temperature-sensitive goods; health-sector incidents abroad are mentioned. Systems named: the end-of-life Danfoss AK-SM 800 System Manager and AK-SC 355, the current AK-SM 800A / 8xxA family when it runs outdated firmware, and later Copeland/Dixell XWEB. New against the entry: BACS states that security updates fixing the known flaws are available for the AK-SM 800A / 8xxA family and that newer firmware activates additional protections and enforces encrypted HTTPS communication; it widens the exposed population beyond retail to butchers and food producers, restaurants and hotels, pharmacies, doctors' practices and laboratories, logistics and warehouses, industry and farms, and notes that many operators do not know their cooling plants are reachable from the internet or run by external service providers. Recommendations: identify the controllers (including those run by contractors), install vendor updates, restrict unsupported systems to trusted networks or VPN, restrict remote access through one centrally managed access point and replace default passwords, and replace end-of-life products. BACS does not name an attacker, an exploited CVE or a count of Swiss victims here.
    region_nexus: "Switzerland (national authority warning); the same controllers are in use across Swiss retail, health and logistics"
    primary_sector_nexus: "indirect - pharmacies, doctors' practices and laboratories named as users; public-sector bodies running cold rooms (hospitals, blood and vaccine storage) fall in scope"
