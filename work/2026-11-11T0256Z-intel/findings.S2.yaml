  # 4. NEW (borderline): CNIL ten simplified sanctions against local authorities
  # ---------------------------------------------------------------------------
  - title: "CNIL fines ten French local authorities for cybersecurity failures: no admin MFA, permanent and shared vendor access, weak logging, flat networks, unsupported servers"
    sources:
      - { url: "https://www.cnil.fr/fr/sanctions-cybersecurite-collectivites-territoriales", publisher: "CNIL (Commission nationale de l'informatique et des libertés)", date: "2026-11-09", role: "primary" }
      - { url: "https://www.zataz.com/cybersecurite-la-cnil-sanctionne-dix-collectivites/", publisher: "ZATAZ", date: "2026-11-09", role: "corroborating" }
    discovery_trace: "first seen at: zataz, feed https://www.zataz.com/feed/ (item 'Cybersécurité : la CNIL sanctionne dix collectivités', 2026-11-09) -> ZATAZ article https://www.zataz.com/cybersecurite-la-cnil-sanctionne-dix-collectivites/ -> pivot: CNIL actualités listing https://www.cnil.fr/fr/actualites (url --direct) -> primary: https://www.cnil.fr/fr/sanctions-cybersecurite-collectivites-territoriales (extract)"
    lookback: true
    summary: |
      In November 2026 (page dated 9 November) the French data-protection authority CNIL announced ten simplified-procedure sanctions against local authorities (communes, departments, regions) and one public establishment for cybersecurity failings found in its 2025 control theme on local-authority security. Fines run from 3,000 to 20,000 euros (20,000 is the legal maximum for this procedure; ZATAZ restates the range) and weigh the number and gravity of failings, data categories (minors, bank details), the authority's budget and the people affected. CNIL lists the sanctioned failings under GDPR article 32: remote authentication for staff, notably teleworkers, that was not robust enough, with no multifactor authentication for administrators; outside vendors such as software publishers with permanent network access that was not authorised case by case, or through accounts shared between several employees; ineffective anomaly detection (incomplete logs, or no real-time or short-term review); insufficient network segmentation that could extend a breach across several segments; servers on operating systems their publisher no longer maintains; weak passwords sent in clear text to users or stored unsafely. Several decisions add that systems used for online exchange with citizens had no security accreditation under the RGS before going live, and several authorities were fined for skipping a data-protection impact assessment (school and after-school parent portals, public-space video surveillance). CNIL says some inspected authorities had already suffered one or more breaches that proper measures could have prevented, that other procedures are open, and that it frames the work as preparation for NIS2, which will put new security requirements on local authorities.
    region_nexus: "France (peer-authority enforcement); transferable to Swiss communal and cantonal administrations, which face the same supplier-access and unsupported-server patterns"
    primary_sector_nexus: "indirect - French local government; no Swiss legal effect (Swiss data-protection law and cantonal laws differ)"
    sector: "public-sector"
    cves: []
    techniques: []
    affected_products: []
    entity_keys: []
    new_entities:
