  - title: "ANNUAL REPORT - ENISA State of Cybersecurity in the Union 2026: EU Cybersecurity Index 71.53, national CVD policies up from 7 to 17"
    sources:
      - { url: "https://www.enisa.europa.eu/news/enisa-reveals-the-state-of-cybersecurity-in-the-union", publisher: "ENISA", date: "2026-11-10", role: "primary" }
    discovery_trace: "first seen at: enisa, URL https://www.enisa.europa.eu/news (extract of the listing, then extract of the item page for its date) -> primary: https://www.enisa.europa.eu/news/enisa-reveals-the-state-of-cybersecurity-in-the-union"
    summary: |
      ENISA published the 2026 edition of its biennial Report on the State of Cybersecurity in the Union on 2026-11-10, prepared under article 18 of NIS2 with the European Commission and the NIS Cooperation Group. The Union-level assessment says the level of cyber threats to the EU remains substantial and that intrusion activity stayed significant and diverse in 2025 and 2026, ideology is the main driver of incidents, hacktivists dominate by volume and AI is accelerating vulnerability discovery and exploitation. The EU Cybersecurity Index, developed under NIS2 article 18(3), averages 71.53 points of 100: policy implementation 66.72, supply-chain management of essential and important entities 89.91, CSIRT maturity 54.76 (uneven), higher-education cybersecurity presence 73.59 versus 55.44 for primary and secondary, national certification ecosystems 55.56. The report sets five directions: effective implementation (smoothing cross-border and cross-legislation burdens), operational crisis capacity (the 2025 Blueprint, information sharing), critical-infrastructure preparedness (regulatory compliance is the main investment driver at 70%), EU-level supply-chain and cross-border risk (national coordinated-vulnerability-disclosure policies rose from 7 to 17 Member States), and long-term awareness and skills. ENISA's director names the refrigeration-system incidents as a sign of operational gaps. The 2026 ENISA Threat Landscape (2026-09-22, outside this window) found public administration the most targeted sector at 32% of incidents, 82% of which were ideology-driven DDoS.
    region_nexus: "EU (Switzerland is not an EU Member State and is not covered by the index; useful as peer context for the NIS2-aligned obligations Swiss suppliers to EU entities meet)"
