    extended_notes: |
      Social-engineering TTP precedent: Scattered Spider's documented attack path into TfL involved vishing calls to IT helpdesk staff and likely SIM-swapping or credential theft to pass MFA. UK defenders in transit, health, and local government sectors should treat the Jubair/Flowers conviction as a named-and-convicted instance of the same social-engineering playbook seen in broader Scattered Spider campaigns against EU targets. Defender prioritisation: harden helpdesk authentication (verify-caller-by-callback protocols, phishing-resistant MFA for helpdesk overrides), monitor for SIM-swap telemetry in identity logs, train staff to resist urgency-framed access requests.

  - title: "CRA Article 28 conformity-body notification deadline passed 11 June — 75-day runway to 11 September vulnerability/incident reporting obligation"
    sources:
      - url: "https://www.enisa.europa.eu/topics/product-security-and-certification/single-reporting-platform-srp"
        publisher: "ENISA"
        date: "2026-06"
        role: "primary"
      - url: "https://www.crowell.com/en/insights/client-alerts/eu-cyber-resilience-act-countdown-11-september-2026-incidentvulnerability-reporting-deadline-is-less-than-100-days-away"
        publisher: "Crowell & Moring (law firm)"
        date: "2026-06"
        role: "corroborating"
    discovery_trace: "first seen at: WebSearch ('ENISA CRA Cyber Resilience Act Single Reporting Platform June 2026') → primary: ENISA SRP page https://www.enisa.europa.eu/topics/product-security-and-certification/single-reporting-platform-srp → corroborating: Crowell countdown advisory https://www.crowell.com/en/insights/client-alerts/eu-cyber-resilience-act-countdown-11-september-2026-incidentvulnerability-reporting-deadline-is-less-than-100-days-away"
    summary: |
      The EU Cyber Resilience Act's first enforcement milestone — Article 28 (notification of conformity assessment bodies to the Commission) — entered application on 11 June 2026. The next milestone is 11 September 2026, when CRA Articles 14/15 mandatory reporting of actively exploited vulnerabilities and severe security incidents to ENISA's Single Reporting Platform (SRP) becomes binding on all manufacturers of products with digital elements placed on the EU market. The SRP is being built and operated by ENISA; as of late June 2026, ENISA has stated it will provide registration instructions, training materials, and dry-run support during the remainder of June–August 2026 window. No dry-run schedule has been formally published yet. The SRP will accept both mandatory manufacturer/CSIRT reports and voluntary third-party reports. The platform is HTTPS-only with structured JSON submissions per CRA Article 14. Public-sector IT procurement officers and ICT vendors supplying EU public-sector buyers must confirm their CRA compliance posture: if their products contain digital elements and are sold in the EU single market, the 11 September vulnerability-reporting clock applies regardless of whether the product is sold to a public-sector or private buyer.
    ch_eu_nexus: "direct EU — affects all manufacturers (including Swiss) selling digital products in the EU; ENISA SRP is the operational tool Swiss vendors must register with by 11 September"
    public_sector_nexus: "indirect — public-sector procurement of CRA-covered products will require vendor CRA compliance statements; affects supply chain security posture"
    sector: "technology, manufacturing, procurement"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "The Single Reporting Platform (SRP) provided for in the Cyber Resilience Act (CRA) shall become a technical tool to use for the reporting of actively exploited vulnerabilities and incidents impacting products with digital elements"
        attribution: "ENISA"
        source_url: "https://www.enisa.europa.eu/topics/product-security-and-certification/single-reporting-platform-srp"
      - quote: "The EU Cyber Resilience Act countdown: 11 September 2026 incident/vulnerability reporting deadline is less than 100 days away"
        attribution: "Crowell & Moring"
        source_url: "https://www.crowell.com/en/insights/client-alerts/eu-cyber-resilience-act-countdown-11-september-2026-incidentvulnerability-reporting-deadline-is-less-than-100-days-away"
    extended_notes: |
      Switzerland is not in the EU and has no direct CRA obligation, but the Swiss Federal Council's August 2025 mandate to BACS/BAKOM/SECO to draft a Swiss cyber resilience law (consultation draft expected autumn 2026) is explicitly modelled on CRA. Swiss IoT and software manufacturers exporting to EU buyers are directly subject to CRA requirements from 11 September 2026 (reporting) and full product requirements from December 2027. Swiss public-sector buyers of IoT/digital products should begin inserting CRA compliance attestations into procurement specifications.

