  - title: "Netherlands Cyberbeveiligingswet (NIS2) enters force 1 July 2026 — first EU laggard crosses the line"
    sources:
      - url: "https://ucomply.cloud/en/blog/cyberbeveiligingswet-1-juli-2026-wat-moet-u-nu-regelen/"
        publisher: "uComply (Netherlands compliance advisory)"
        date: "2026-06"
        role: "primary"
      - url: "https://www.nldigitalgovernment.nl/nis2-directive-cyberbeveiligingswet-cbw/"
        publisher: "NL Digital Government"
        date: "2026"
        role: "corroborating"
    discovery_trace: "first seen at: WebSearch ('Netherlands Cyberbeveiligingswet NIS2 July 2026 entry into force') → primary: uComply advisory blog, URL https://ucomply.cloud/en/blog/cyberbeveiligingswet-1-juli-2026-wat-moet-u-nu-regelen/ → corroborating: NL Digital Government https://www.nldigitalgovernment.nl/nis2-directive-cyberbeveiligingswet-cbw/"
    summary: |
      The Dutch Cyberbeveiligingswet (Cbw) — the Netherlands' NIS2 transposition — enters into force on 1 July 2026, reducing the list of non-transposing EU Member States from five to four (France, Ireland, Luxembourg, Spain remain). The Tweede Kamer passed the bill on 15 April 2026. The supervisory authority is NCSC-NL. Essential entities (energy, transport, banking, healthcare, drinking/waste water, digital infrastructure, government, space) face proactive supervision and penalties up to €10 million or 2% annual turnover; important entities face reactive supervision up to €7 million or 1.4%. The law applies to organisations with ≥50 employees or ≥€10 million annual turnover. Incident-notification obligations follow the NIS2 three-step protocol: 24-hour early warning, 72-hour initial report, one-month final report. Board members bear personal liability for approving security measures. The law mandates 10 cybersecurity domains: risk analysis, access management, business continuity, incident response, cyber hygiene, network security, supply chain security, cryptography, MFA, and periodic evaluation. Switzerland-based entities with Dutch operations or cross-border digital service delivery into the Netherlands should confirm registration obligations apply to them.
    ch_eu_nexus: "direct EU — NIS2 compliance; relevant to Swiss entities with Dutch operations or cross-border EU digital services"
    public_sector_nexus: "direct — government is explicitly listed as essential-entity sector in the Cbw"
    sector: "government, energy, transport, banking, healthcare, digital-infrastructure"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "update-to-prior:2026-W25 (W25 listed Netherlands as still incomplete; now crossed the line)"
    evidence:
      - quote: "The Cyberbeveiligingswet enters into force on 1 July 2026"
        attribution: "uComply"
        source_url: "https://ucomply.cloud/en/blog/cyberbeveiligingswet-1-juli-2026-wat-moet-u-nu-regelen/"
      - quote: "Board members must approve security measures and are personally responsible for oversight and training"
        attribution: "uComply"
        source_url: "https://ucomply.cloud/en/blog/cyberbeveiligingswet-1-juli-2026-wat-moet-u-nu-regelen/"
    extended_notes: |
      France (Loi Résilience / NIS2 transposition via projet de loi résilience) remains delayed further: the Assemblée nationale's extraordinary session opening 1 July 2026 did not include the bill on its agenda, despite Senate adoption in March 2025. Infringement proceedings by the European Commission (escalated to reasoned opinions 7 May 2025) are running against France, Spain, and the Netherlands (the latter now resolved). Ireland and Luxembourg remain outstanding. The French ReCyF (Référentiel Cyber France) published 17 March 2026 gives entities a bridging compliance framework, but the law itself is expected no earlier than autumn 2026.

  - title: "EU Commission proposes Europol and Eurojust mandate expansion with Police Shared Data Space and doubled budget"
    sources:
      - url: "https://commission.europa.eu/news-and-media/news/commission-proposes-new-measures-better-tackle-cross-border-crime-and-terrorism-2026-06-24_en"
        publisher: "European Commission"
        date: "2026-06-24"
        role: "primary"
      - url: "https://home-affairs.ec.europa.eu/news/commission-strengthens-europol-step-fight-against-cross-border-crime-and-terrorism-2026-06-24_en"
        publisher: "EU DG Home Affairs"
        date: "2026-06-24"
        role: "corroborating"
      - url: "https://protectnotsurveil.eu/resources/press-release-europol-mandate-overhault-2026/"
        publisher: "Protect Not Surveil (civil-society coalition)"
        date: "2026-06-24"
        role: "corroborating"
    discovery_trace: "first seen at: WebSearch ('Europol Regulation reform proposal June 24 2026 Commission') → primary: European Commission press release, URL https://commission.europa.eu/news-and-media/news/commission-proposes-new-measures-better-tackle-cross-border-crime-and-terrorism-2026-06-24_en → corroborating: DG Home Affairs https://home-affairs.ec.europa.eu/news/commission-strengthens-europol-step-fight-against-cross-border-crime-and-terrorism-2026-06-24_en → civil-society response https://protectnotsurveil.eu/resources/press-release-europol-mandate-overhault-2026/"
    summary: |
      On 24 June 2026 the European Commission published COM(2026) 580 final proposing a new Europol Regulation alongside a revised Eurojust Regulation, revisions to the European Investigation Order, and amendments to the EU Data Protection Regulation for Union bodies. Key operational expansions: (1) automated real-time information sharing between Member State law enforcement and Europol, underpinned by a new "Police Shared Data Space" secure cloud; (2) Europol Support Offices staffed by seconded Europol officers physically embedded in Member State law enforcement agencies; (3) a technology-and-innovation hub for EU-wide law enforcement capability assessment; (4) Eurojust's mandate extended explicitly to cybercrime, gender-based violence, and other emerging crime areas; (5) budget approximately doubled to €3 billion. The Commission's framing explicitly cites organised cybercrime and AI-enabled attacks as drivers. Civil-society coalition Protect Not Surveil criticised the proposal as introducing systematic data upload from national databases to Europol without adequate data-categorisation safeguards, and warned of automated surveillance of persons with no criminal nexus. The proposal now enters EU co-decision (European Parliament + Council). Timeline: no earlier than late 2026 or 2027 for adoption. For Swiss-context public-sector defenders: a stronger Europol with real-time access to Member State cybercrime data is net-positive for operational coordination (e.g. takedowns like Endgame), but raises questions about data-sovereignty and cross-border intelligence-sharing boundaries for non-EU states.
    ch_eu_nexus: "direct EU — structural change to the EU law-enforcement architecture for cybercrime; indirect CH as Europol partner"
    public_sector_nexus: "indirect — Europol's cybercrime mandate directly supports public-sector incident response and threat intelligence across EU"
    sector: "government, law-enforcement, finance, critical-infrastructure"
    cves: []
    actors_campaigns_malware: []
    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "Crime is becoming more sophisticated, international and digital. The Commission proposed new measures to strengthen the EU's response to an evolving criminal landscape."
        attribution: "European Commission"
        source_url: "https://commission.europa.eu/news-and-media/news/commission-proposes-new-measures-better-tackle-cross-border-crime-and-terrorism-2026-06-24_en"
      - quote: "The proposed reform dangerously erodes privacy, automates surveillance, and sidelines oversight"
        attribution: "Protect Not Surveil"
        source_url: "https://protectnotsurveil.eu/resources/press-release-europol-mandate-overhault-2026/"
    extended_notes: |
      The full proposal PDF is at https://home-affairs.ec.europa.eu/document/download/70698b35-392c-451a-adef-3d863386c8a8_en?filename=Europol+Proposal.pdf (COM(2026) 580 final). The existing Europol Regulation (EU) 2016/794 and its 2022 amendment remain in force until superseded. The proposal's automatic/systematic upload of national police data to Europol's cloud is the most controversial element — prior reform iterations faced EDPS pushback on the absence of a separate legal basis per data category. Defenders should monitor the Parliament's LIBE committee rapporteur appointment as the first signal of the political direction on data-protection guardrails.

  - title: "Scattered Spider members plead guilty over Transport for London hack — sentencing 16 July"
    sources:
      - url: "https://www.nationalcrimeagency.gov.uk/news/cyber-criminals-who-hacked-into-transport-for-londons-computer-network-are-convicted"
        publisher: "UK National Crime Agency"
        date: "2026-06-23"
        role: "primary"
      - url: "https://www.helpnetsecurity.com/2026/06/23/transport-london-cyberattack-scattered-spider-members-plead-guilty/"
        publisher: "Help Net Security"
        date: "2026-06-23"
        role: "corroborating"
      - url: "https://therecord.media/guilty-plea-tfl-cyberattack-scattered-spider-members"
        publisher: "Recorded Future News"
        date: "2026-06-23"
        role: "corroborating"
    discovery_trace: "first seen at: WebSearch ('Scattered Spider guilty plea sentencing follow-up June 2026') → primary: NCA press release https://www.nationalcrimeagency.gov.uk/news/cyber-criminals-who-hacked-into-transport-for-londons-computer-network-are-convicted → corroborating: Help Net Security, Recorded Future News"
    summary: |
      Thalha Jubair (20, East London) and Owen Flowers (18, Walsall, West Midlands) pleaded guilty on the first day of their trial at Woolwich Crown Court (22-23 June 2026) to conspiracy to commit unauthorised acts under the UK Computer Misuse Act against Transport for London's network. The September 2024 attack cost TfL £29 million in losses and recovery costs, forced all 28,000 employees to reset passwords in person, compromised the Oyster smart-ticketing refund system, and disrupted youth/child Oyster photocard applications. Flowers additionally admitted to separate Computer Misuse Act offences against US healthcare providers SSM Health Care Corporation and Sutter Health. Both were arrested September 16, 2024. Sentencing is scheduled for 15-16 July 2026. NCA Deputy Director Paul Foster: "Cyber crime may appear faceless and distant compared to other crime types, but the infiltration of TfL's systems shows it has real-world consequences." The broader Scattered Spider collective's law enforcement accountability picture: Noah Urban serving 10 years (sentenced August 2025); Tyler Buchanan sentencing scheduled October 2026; Jubair and Flowers July 2026; further US-side defendants pending. The TfL case is notable as the first UK-based conviction of Scattered Spider members for the September 2024 transit disruption and the first UK court verdict establishing that vishing-based SIM-swap/social-engineering attacks on critical public-transport infrastructure constitute serious criminal harm.
    ch_eu_nexus: "UK/EU — law enforcement precedent relevant to European transport-sector defenders; Scattered Spider SIM-swap and vishing TTPs documented across European targets"
    public_sector_nexus: "direct — victim was a public-sector transport authority (TfL)"
    sector: "transport, public-sector, healthcare"
