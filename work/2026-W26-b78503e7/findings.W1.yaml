    summary: |
      Five independent research publications across W26 converge on a single structural observation: attackers in 2026 are no longer primarily breaking perimeters — they are breaking the trust chains that connect developer tools, CI/CD pipelines, SaaS integrations, and AI coding agents. The Klue/Icarus breach (stale OAuth credential from 2022) and the Miasma worm (compromised developer credential from April infostealer logs weaponised in June via npm and AI agent SessionStart hooks) both exploit the accumulation of unaudited delegated access. Cordyceps (Legit Security / June 25) showed that pull_request_target misconfiguration in GitHub Actions is systematically exploitable for secrets theft from main-branch workflows. The Unit42 OpenClaw/ClawHub research (June 24) showed malicious skill payloads in AI agent marketplaces bypass the framework sandboxes entirely. The Tenable "Developer Credential Economy" model is the cross-cutting lens: a three-layer structure of credential generation (infostealer), distribution (underground markets, 7-week dwell), and weaponisation (supply-chain or CI/CD injection) operates with zero CVEs and bypasses EDR. Defenders should: audit all OAuth grants and integration service accounts older than 12 months and deactivate those with no recent usage; restrict AI coding tool SessionStart hook configuration to read-only paths; implement SLSA Level 3+ for internal package registries; and treat CI/CD pipeline token scope as a principal requiring the same review as human identity.
