    summary: |
      While not an explicitly labelled "annual report," ESET's June 26 GentleKiller paper is the most substantive mid-year documentation of the RaaS tooling ecosystem published in W26, and should be read alongside the W25 Check Point State of Ransomware Q1 2026. The paper's structural contribution is documenting that the RaaS EDR-killer model is now multi-source and modular: operators maintain an in-house tool (GentleKiller) while incorporating EDR killers from rival gangs (HexKiller from Warlock, ThrottleBlood from MedusaLocker/DragonForce, HavocKiller discovered by Huntress), applying a shared defence-evasion standardisation layer (fake vendor impersonation, copied certificates) and distributing the complete package to affiliates. New PoCs are operationalised within days. Three structural trends from this paper that detection engineers should register: (1) RaaS operators are diversifying kernel-driver abuse across eight distinct driver/product combinations making driver-allow-listing insufficient without process-injection chain detection; (2) cross-gang tool sharing (HexKiller appearing in Gentlemen alongside Warlock origins) means tooling overlap alone no longer implies operational overlap; (3) OxideHarvest — a credential stealer attributed to a specific Gentlemen affiliate — targets host lists via command line, suggesting pre-compiled target lists sourced from FortiGate credential databases (the FortiBleed link). Background: GentleKiller first hypothesised by ESET in February 2026; Group-IB and Check Point independently corroborated. The leaked internal data is the first public confirmation from primary gang communications.
