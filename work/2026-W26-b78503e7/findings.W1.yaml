  - title: "W26 research synthesis: AI coding agents and SaaS integration trust boundaries are the week's dominant attack surface — a pattern across five distinct research items"
    novelty: new
    sources:
      - { url: "https://www.tenable.com/blog/what-the-miasma-campaign-reveals-about-the-new-supply-chain-threat-model-and-the-underground", publisher: "Tenable", date: "2026-06-23", role: "primary" }
