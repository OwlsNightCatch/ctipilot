  # ============================================================
  # ITEM 3 — ToxicPanda 2.0 (Zimperium zLabs)
  # ============================================================
  - title: "ToxicPanda 2.0 automates wireless-debugging (ADB) pairing via Accessibility Service abuse to self-escalate to shell-level access; overlay/PIN-theft scope expands to 349 apps in 16 countries"
    sources:
      - { url: "https://zimperium.com/blog/the-toxicpanda-never-sleeps-toxicpanda-2.0-prepares-its-next-strike-on-mobile", publisher: "Zimperium zLabs — Vishnu Pratapagiri", date: "2026-08-19", role: "primary" }
    discovery_trace: "assigned primary (already triaged), URL https://zimperium.com/blog/the-toxicpanda-never-sleeps-toxicpanda-2.0-prepares-its-next-strike-on-mobile (no pivot needed)"
    summary: |
      WIRELESS-DEBUGGING PRIVILEGE-ESCALATION CHAIN (step by step, as stated): ToxicPanda 2.0
      abuses Android's Wireless Debugging framework (an Android-11+ feature letting a developer
      run ADB commands over Wi-Fi without a physical USB connection) to obtain "shell" user
      capabilities entirely through Accessibility Service-driven UI automation, with no genuine
      user interaction. Phase 1 — Enabling Developer Options: the malware checks whether
      Developer Options are already enabled; if not, it launches the system's "About Phone /
      Device Info" settings screen, uses the Accessibility Service to query the accessibility
      node hierarchy for the "Build number" list item, and simulates seven rapid tap events on
      it in quick succession — the standard (human) gesture to unlock Developer Options,
      performed here entirely by the malware itself. Phase 2 — Navigating to Wireless Debugging:
      once Developer Options exist, the malware fires an intent to open the
      APPLICATION_DEVELOPMENT_SETTINGS view, again uses the Accessibility node hierarchy to find
      the "Wireless debugging" toggle, and switches it ON. Phase 3 — Triggering and scraping the
      pairing code: the malware interacts with the "Pair device with pairing code" option (which
      initiates Android's SPAKE2-based TLS pairing flow) and then continuously polls the layout
      hierarchy of the resulting modal dialog to read off the generated 6-digit pairing PIN and
      the dynamic connection port that Android displays for a human to read and type in
      manually — here scraped programmatically instead. Phase 4 — Cryptographic authenticated
      pairing: using the extracted PIN and port, the app itself instantiates a local SPAKE2
      pairing handler, authenticates a generated keypair against the local ADB daemon listening
      on loopback (127.0.0.1), establishes a TLS-encrypted channel, and completes the SPAKE2 key
      exchange using the scraped PIN, finalizing the pairing without any human ever seeing or
      entering the code. Phase 5 — Shell-level post-pairing privilege escalation: once paired,
      the malware holds ADB "shell" user privileges — a materially higher privilege tier than a
      normal installed app's sandboxed permission set — and uses it to run commands directly
      through the ADB daemon that "bypass standard Android runtime consent prompts to grant
      itself broad permissions, neutralize OS background restrictions, silently enable critical
      components, and enforce persistence." In short: the entire flow that Android designed to
      require a human physically viewing an on-screen code (as a proof of device possession/
      intent) is fully mechanized by Accessibility-driven UI scraping, and the payoff is
      permission grants and persistence actions that would otherwise require explicit runtime
      user consent dialogs the malware can now simply skip.

      PREREQUISITE: the malware must already hold Accessibility Service permission (granted
      earlier in the infection chain, not itself part of this escalation) — the wireless-
      debugging chain is entirely downstream of that initial Accessibility grant, and requires
      no separate exploit or vulnerability; it is 100% living-off-the-OS abuse of legitimate
      developer/debugging UI plus a legitimate device-pairing protocol.

      OVERLAY/CREDENTIAL-CAPTURE MECHANISM: On install, the malware enumerates every installed
      application on the device and reports package identity + icon to the C2 server so the
      operator can identify installed banking/financial apps present on that specific device.
      ToxicPanda 2.0 supports phishing overlays for 349 banking, financial, e-wallet and
      cryptocurrency applications across 16 countries (vs. only 16 banking applications
      supported in the prior version Cleafy documented — a ~22x expansion in targeted-app
      count). Overlays are not bundled statically; when the victim launches a targeted app, the
      malware requests the matching malicious HTML overlay from the C2 server at that moment,
      and the overlay closely replicates that app's genuine login/transaction screen to capture
      credentials, PINs and other sensitive data, which is then exfiltrated. A separate,
      dedicated PIN-harvesting workflow runs continuously via the Accessibility Service: it
      monitors the foreground app, and when it matches the configured target list, deploys an
      invisible transparent overlay purely to capture the touch coordinates/input the victim
      enters (distinct from the visible phishing-overlay mechanism above) — i.e., two separate
      overlay techniques serve two separate purposes (visible spoofed-UI credential phishing,
      and invisible touch-capture PIN theft on the REAL banking app UI). The malware also
      supports a remote command to dynamically replace its target package/keyword lists with
      attacker-supplied values pushed from C2, letting the operator retarget the malware without
      a new build. Separately, the malware can steal device lock-screen credentials (PIN,
      pattern, password) via a full-screen overlay that mimics the native Android lock screen,
      and can display a fake "system update" full-screen overlay (rendered from local HTML
      templates bundled in the app's assets/resources) purely to conceal ongoing malicious
      activity from the victim.

      OTHER NEWLY-OPERATIONAL CAPABILITIES vs. the Cleafy-documented prior version: an OEM
      permission-automation routine that auto-navigates vendor-specific permission dialogs,
      battery-optimization prompts and auto-start configuration screens across multiple Android
      OEM skins by parsing OEM-customized layout trees and matching localized button text (e.g.
      "Allow," "Don't Optimize"); a Device Administrator-abuse path that issues the
      ADD_DEVICE_ADMIN system intent using a social-engineering lure prompt reading "System
      service requires administrator privileges," and — once granted — a second capability that
      calls the legitimate DevicePolicyManager.resetPassword() Device Administrator API to
      force-overwrite the device's local lock-screen PIN/password with an attacker-defined
      value, enabling outright device lockout/hijacking; a full-screen WebView command that
      loads an attacker-controlled URL for phishing/deception (newly implemented, absent from
      prior versions); and an OEM auto-start bypass that queries Build.MANUFACTURER to identify
      the device OEM (naming Xiaomi, OPPO, Vivo, Samsung and Huawei specifically) and then, via
      Accessibility Service, whitelists itself in that vendor's proprietary battery/auto-start
      management UI (e.g., Xiaomi's MIUI Security Center, Samsung's Smart Manager) to survive
      aggressive OEM background-process killing.

      DROPPER / DEFENSE-EVASION SEQUENCE: the malware first requests VPN service privileges via
      a fake installation UI shown in a WebView (used to obtain the victim's grant), and then
      uses that VPN capability specifically to block network communication from Google Play and
      Google Play Services on the device — evading Play Protect scanning/reporting — before
      decrypting and installing the real payload from the app's own assets folder.

      C2: initial HTTPS request establishes a persistent WebSocket connection for low-latency
      bidirectional command/data exchange; the channel is secured with AES encryption in ECB
      mode using a key embedded in source code (derived from a static byte array converted to a
      string at runtime). The C2 panel itself displays a "v2" version marker, which Zimperium
      reads as the developers' own signal of a new iteration. The full command set now spans 167
      remote commands.

      GEOGRAPHIC SCOPE — EXACT TEXT, NO INFERENCE (this is the load-bearing fact for EU
      relevance and it does NOT resolve cleanly): the article states ToxicPanda is "the Android
      banking Trojan known to have primarily targeted Europe" (framing the malware FAMILY's
      historical reputation, not necessarily this 2.0 wave specifically) and that this update
      "substantially expands its targets globally." Separately: "ToxicPanda 2.0 significantly
      expands its targeting scope, supporting phishing overlays for 349 banking, financial,
      e-wallet, and cryptocurrency applications across 16 countries," and "Figure 6 summarizes
      the location of targeted financial institutions across the 16 targeted countries." I
      confirmed by inspecting the fetched page's raw HTML (including all <img alt="..."> text)
      that the 16 country names are NEVER listed in the article's text — they appear ONLY inside
      Figure 6, an embedded image with no descriptive alt-text, which is not extractable from
      the fetched HTML/markup. I CANNOT confirm from text whether any European country —
      including whether Europe generally — is among the current 16-country target list for
      version 2.0. The article's only textual geography claims are the historical "known to have
      primarily targeted Europe" framing and the "expands its targets globally" claim; neither
      confirms or rules out continued/expanded European targeting in this specific version. This
      is a material gap for the main agent's inclusion/relevance and Region/Sector-tag decision
      — flagging as borderline for this reason.

      ATTRIBUTION: Zimperium does NOT name any threat actor, group, or cluster designation
      anywhere in the article — it refers throughout only to "the malware," "the malware
      developers," or "threat actors" in the generic sense. The only named prior researcher
      reference is Cleafy, cited solely as the source of the PRIOR ToxicPanda version's analysis
      ("Several commands previously identified as unimplemented in Cleafy's analysis are now
      fully operational") — this establishes that Zimperium considers this update to be a new
      iteration of the SAME ToxicPanda family Cleafy previously documented, not a link to any
      specific named campaign or actor.

      DISTRIBUTION SHIFT: Zimperium states ToxicPanda 2.0 samples are being delivered through
      Amazon AWS-hosted storage buckets, which it characterizes as the attackers "leveraging
      cloud infrastructure for malware delivery" — a shift from prior distribution methods (not
      otherwise specified in the article).

      DETECTION ANGLES (Zimperium's own, source-stated, vendor-neutral framing added): dropper
      detection before payload decryption/installation from the assets folder, including
      detecting droppers masquerading behind a fake VPN-permission screen; network-layer
      blocking of the AWS-hosted delivery pathway and of the AES-encrypted WebSocket C2 channel;
      behavioral/telemetry detection of automated UI manipulation, unauthorized ADB pairing
      activity, and targeted HTML-overlay delivery specifically during sessions with a targeted
      financial app in the foreground; and detection of Device Administrator-privilege abuse
      plus automated circumvention of OEM battery-optimization/auto-start policies, and of
      deceptive full-screen interfaces (fake system updates, spoofed lock screens).

      TRIAGE / BENIGN-LOOKALIKE DISCRIMINATOR (derived from the mechanism, not separately
      stated by Zimperium): legitimate developers do use Accessibility Services and do
      legitimately pair over Wireless Debugging — the discriminator is the SEQUENCE and SPEED:
      a fully automated, sub-second chain of Accessibility-driven taps that (a) opens Settings,
      (b) taps "Build number" seven times, (c) opens Wireless Debugging, (d) opens pairing, and
      (e) completes SPAKE2 pairing by reading a dialog it never displayed to a human — versus a
      genuine developer's much slower, visually-observable, deliberate manual navigation with
      the pairing code actually read by a human off the phone screen.
