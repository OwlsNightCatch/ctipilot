  # ============================================================
  # ITEM 1 — "Ransom Busters" rogue ransomware affiliate
  # ============================================================
  - title: "\"Ransom Busters\" — rogue ransomware affiliate poses as third-party recovery firm to double-extort DragonForce/Settra/Anubis victims"
    sources:
      - { url: "https://www.guidepointsecurity.com/blog/beware-ransom-busters/", publisher: "GuidePoint Security GRIT", date: "2026-08-18", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/rogue-ransomware-affiliate-ransom-busters-poses-as-recovery-firm/", publisher: "BleepingComputer (Lawrence Abrams)", date: "2026-08-19", role: "corroborating" }
    discovery_trace: "assigned primary (already triaged), URL https://www.guidepointsecurity.com/blog/beware-ransom-busters/ → corroborating: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/rogue-ransomware-affiliate-ransom-busters-poses-as-recovery-firm/ (BleepingComputer independently obtained a Coveware corroboration/quote not in the GuidePoint post)"
    summary: |
      MECHANISM / TIMELINE OF OUTREACH: An entity calling itself "Ransom Busters LTD" emails
      ransomware victim organizations at their own domain email addresses, specifically
      requesting contact with the victim's CEO or IT leadership. The critical anomaly GRIT
      flags is TIMING: outreach arrives BEFORE the underlying ransomware attack becomes public
      knowledge — i.e., before the intrusion is disclosed on a leak site or otherwise reported,
      which is what makes the sender's foreknowledge suspicious. This is explicitly contrasted
      with the normal, non-suspicious pattern of legitimate recovery-service solicitation, which
      "is generally done only after the attack becomes public knowledge."

      CLAIM AND DEMAND: The email identifies the sender as "a representative of a project that
      assists victims of cyberattacks" claiming multi-year (3+ years) unauthorized access to /
      infiltration of criminal-group servers, and claims to have found the victim's stolen data
      on a compromised RaaS server. It offers to (a) return the victim's stolen files, (b)
      "destroy all backups held by the group," and (c) — because it claims access to the RaaS
      operator's "encryption key storage" — help restore encrypted files. In follow-up
      conversation, the actor claimed exploitation of vulnerabilities in RaaS "administrative
      panels" (the backend of the ransomware operation's affiliate portal), asserting control
      over "almost all" of a RaaS operation's infrastructure. The demand is a fee of
      $20,000–$60,000 to delete the victim's stolen data from the ransomware group's servers.
      GRIT notes the claimed offensive actions (unauthorized access/deletion on a criminal
      server) would themselves plausibly violate the U.S. Computer Fraud and Abuse Act — a
      point GRIT raises to argue a genuine, law-abiding recovery firm would not present itself
      this way, nor charge a fee for it.

      NAMED RaaS BRANDS: GuidePoint observed this specifically during incident response to
      attacks by DragonForce, Settra, and Anubis (named as the RaaS brands whose "administrative
      panel" access was claimed / whose victims were targeted with this outreach).

      CROSS-INCIDENT TOOLING OVERLAP (the evidentiary basis for the assessment): Responding to
      two Ransom Busters-linked incidents, GuidePoint's DFIR/GRIT teams found overlapping
      artefacts across environments that would not be expected from independent affiliates
      following merely a shared RaaS playbook: (1) the same internal-reconnaissance tool
      (SoftPerfect Network Scanner) in both cases; (2) the same cloud-exfiltration tool, s5cmd,
      used to exfiltrate data to cloud storage via AWS; (3) the same remote-monitoring-and-
      management (RMM) tool, "Remotely," installed via a PowerShell script; (4) a locally
      created backdoor account using an IDENTICAL, fixed password reused across both
      intrusions (a strong correlator precisely because password choice is otherwise
      unconstrained); and (5) an identical attacker-controlled workstation hostname recurring
      across both intrusions. GuidePoint explicitly weighs and rejects the alternative
      explanation (a standardized affiliate playbook / distributed VM image shared within one
      RaaS program) because the SAME overlap pattern recurred across SEVERAL DISTINCT RaaS
      operations where "Ransom Busters" intervened — an operator-level correlator, not a
      program-level one.

      STATED CONFIDENCE AND WHAT IS ASSESSED VS. ESTABLISHED: GRIT's conclusion is explicitly
      qualified as "moderate confidence" — GRIT assesses (not confirms/establishes) that "Ransom
      Busters" is not a genuine third-party recovery firm but a single ransomware affiliate with
      cross-RaaS employment, using its affiliate-level access to divert/steal ransom-payment
      discussions from the RaaS operation it works for. This is an ASSESSMENT built on
      circumstantial tooling/artefact correlation, not a confirmed identity or a confirmed
      technical intrusion into the RaaS backend infrastructure — GuidePoint never independently
      verified the claimed "administrative panel" compromise, only that the actor demonstrated
      knowledge of the same stolen dataset the RaaS affiliate possessed.

      WHAT THE SOURCE DOES NOT CLAIM: GuidePoint does NOT identify a specific individual or
      state which RaaS operation(s) the affiliate is "native" to (only that they observed
      overlap "across several distinct RaaS programs"). GuidePoint does NOT confirm the claimed
      "administrative panel" vulnerability/access is real — only that the actor could reproduce
      knowledge consistent with dataset access. GuidePoint does NOT report any victim having
      paid Ransom Busters (BleepingComputer separately confirms GRIT told them no victim
      payment to Ransom Busters has been observed, and that in one incident the victim instead
      paid the underlying RaaS operator). GuidePoint does not claim the stolen data was leaked
      by Ransom Busters outside the RaaS environment.

      GUIDANCE TO VICTIMS: Report any such contact to the incident-response team immediately;
      treat unsolicited "help" offers requiring a fee with significant skepticism; law
      enforcement and reputable IR firms remain the most reliable resource; there is no
      guarantee that any criminal party (RaaS operator or a rogue affiliate posing as
      "Busters") will actually delete stolen data after payment, and researchers have separately
      observed threat actors retaining copies of stolen data for re-extortion.

      BLEEPINGCOMPUTER ADDITIONAL CORROBORATION: Ransomware-negotiation firm Coveware
      confirmed to BleepingComputer that it independently responded to at least one incident
      involving contact from "the same group or individual" — an independent corroborating data
      point from a second incident-response vendor, not merely a re-report of GuidePoint's post.
      Coveware's Elizabeth Cookson (Senior Director of IR) distinguishes this from run-of-the-
      mill "ambulance chaser" recovery-service solicitation (which targets only already-public
      victims) specifically because of the non-public-incident foreknowledge, and Coveware
      separately assesses that rising distrust within RaaS ecosystems could drive more
      affiliates toward this kind of off-book, revenue-diverting extortion behavior.

      DETECTION ANGLE (source-supported): The tooling/behavior overlap that grounds GuidePoint's
      assessment is itself the hunt signal for defenders responding to a ransomware incident:
      (a) internal network-reconnaissance activity from a network-scanning utility, (b) cloud-
      object-storage CLI (s5cmd-class tooling) used for outbound data transfer to attacker-
      controlled cloud storage, (c) an RMM tool deployed via a PowerShell installation routine
      as a secondary persistence/RMM channel distinct from the primary ransomware toolkit, (d)
      creation of a new local account as a backdoor persistence mechanism. None of these are
      unique to this actor in isolation, but GuidePoint's own reasoning is that the CO-
      OCCURRENCE of this specific artefact set across otherwise-unrelated RaaS incidents is the
      correlator worth flagging to a hunt team investigating a ransomware case with an unusual,
      "too good to be true" outreach.
