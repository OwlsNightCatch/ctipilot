  # ============================================================
  # ITEM 2 — Grandoreiro DLL-sideloading campaign (Acronis TRU)
  # ============================================================
  - title: "Grandoreiro's Mexico-focused fork abuses Duplicate Files Finder for DLL sideloading, gates C2 behind inverted sandbox-fingerprint logic"
    sources:
      - { url: "https://www.acronis.com/en/tru/posts/grandoreiro-goes-north-from-brazil-to-mexico-with-a-new-dll-sideloading-campaign/", publisher: "Acronis Threat Research Unit (TRU) — Santiago Pontiroli", date: "2026-08-19", role: "primary" }
    discovery_trace: "assigned primary (already triaged), URL https://www.acronis.com/en/tru/posts/grandoreiro-goes-north-from-brazil-to-mexico-with-a-new-dll-sideloading-campaign/ (no pivot needed)"
    summary: |
      SIDELOAD CHAIN (exact, as stated): The campaign abuses the legitimate Windows application
      "Duplicate Files Finder" (DFF), renamed to a randomly generated filename to obscure its
      purpose. On execution, DFF loads a genuine, legitimate dependency, dupfdll.dll. That
      genuine DLL in turn attempts to load ITS next dependency, mingwm10.dll — and it is this
      second dependency that is a malicious replacement (mingwm10.dll is, in normal usage, a
      legitimate MinGW runtime library filename, which is precisely why substituting a malicious
      binary under that name is effective camouflage: an EDR/analyst seeing "mingwm10.dll" as a
      loaded module has no a priori reason to suspect it). Acronis flags a PE-compilation-
      timestamp mismatch as corroborating evidence: the legitimate parent DFF binary carries a
      2008-06-01 compile timestamp, while the malicious mingwm10.dll implant carries a much more
      recent 2026-05-01 timestamp. Acronis explicitly caveats that PE timestamps are trivially
      forgeable and should not be treated as authoritative alone, but combined with the sideload
      chain and dependency mismatch, states it assesses "with high confidence" that a benign
      binary is being abused as a loader. Because DFF is normally a GUI application, the
      malicious implant's first action is to hide the application window to avoid drawing
      attention — i.e., execution begins with GUI-suppression (Hidden Window) before any other
      malicious activity.

      ANTI-ANALYSIS GATE — STRUCTURE AND THE INVERTED-LOGIC CHECK: Before any attempt to contact
      C2, the loader runs a staged sequence of environment checks: (1) a system-uptime check
      (threshold 180,000 ms / 3 minutes — the host must have been running at least that long,
      defeating sandboxes that begin analysis from a fresh boot); (2) an INVERTED sandbox
      fingerprint check that is the standout technique here — rather than checking for the
      PRESENCE of sandbox/analysis artefacts as most malware does, this check inspects the
      victim desktop for shortcuts to seven specific mainstream consumer applications (Google
      Chrome, CCleaner, Firefox, FileZilla Client, Acrobat Reader DC, Microsoft Edge, Skype),
      and if ALL SEVEN shortcuts are simultaneously present, the malware concludes it is running
      in an analysis/sandbox environment (rather than the more typical inverse assumption that
      such a common, "clean" software bundle indicates a real user) and terminates — Acronis
      assesses with moderate confidence this targets a specific automated-sandbox image that
      ships this exact software combination; (3) host-profiling checks (installed physical
      memory via GlobalMemoryStatusEx, processor count, free disk space on C:\, screen
      resolution via GetSystemMetrics, recently-opened-document history as a proxy for genuine
      user activity); (4) VM-artefact checks for VirtualBox/VMware driver files and BIOS-
      registry values (SystemManufacturer / SystemProductName / BIOSVendor) against a
      virtualization-keyword blacklist, plus a VMware Tools registry-key check; (5) a 49-entry
      process blacklist spanning debuggers, disassemblers, packet-capture/network-analysis
      tools and EDR/monitoring-adjacent processes; (6) an IP-geolocation lookup (via a public
      IP-geolocation API) with a small country blacklist (Czechia, Russia, Netherlands) that
      Acronis assesses with low-to-moderate confidence reflects a desire to avoid traffic
      disproportionately originating from security researchers/AV vendors/sandbox providers,
      rather than the more typical "patriotic" pay-per-install country-avoidance pattern; (7)
      username/hostname pair-matching against a list of known default sandbox-environment
      identifiers (Acronis explicitly notes one of the blacklisted values is the default Windows
      Sandbox account name); and (8) checks for the presence of specific analyst-tool
      directories. If the system is flagged as a sandbox, the loader displays a Spanish-language
      fake error dialog ("There was an error viewing your document, restart your computer and
      try again.") instead of proceeding.

      C2 RESOLUTION AND TRANSPORT: Only after passing every check does the malware resolve its
      hardcoded C2 server's IP address — and it does so via Google's DNS-over-HTTPS (DoH)
      resolver rather than standard OS DNS, sending a resolve request carrying the hardcoded C2
      domain. In the analyzed sample the C2 server was offline at analysis time, so Acronis
      states explicitly it could NOT interact with the live C2 infrastructure — everything
      Acronis reports about the C2 protocol comes from STATIC analysis of the binary, not
      observed live traffic. Per that static analysis: once a C2 IP is resolved, the malware
      issues an HTTP GET request over TCP port 6432 to fetch the second-stage payload; the
      request itself is encrypted and embeds host-specific identifying information. Decoded
      (per Acronis's static decryption), the protocol uses a fixed vocabulary of uppercase
      command/status tokens for the request/response handshake — Acronis calls out one such
      token specifically as a viable hunting signal in egress traffic or memory (withheld here
      per the no-IOC constraint, as it functions as a literal string match).

      TELEMETRY GEOGRAPHY (verbatim, load-bearing for EU relevance): Acronis's own 30-day
      telemetry (collected over "the last 30 days of June 2026" per the article's Summary
      section, despite the article publishing 2026-08-19 — flagged below) states: "This
      distribution highlights a clear concentration of activity in Mexico, which accounts for
      the largest share of observed samples. Spain and several Latin American countries follow,
      forming a secondary cluster of detections. Overall, the data suggests that Grandoreiro
      activity remains primarily focused on Latin American regions, with limited but notable
      presence in Europe (mostly Spain) and North America." Spain is the ONLY European country
      Acronis names explicitly, and it is folded into a "secondary cluster" alongside multiple
      Latin American countries (not singled out as a standalone European cluster) — overall
      European presence is characterized by Acronis itself as "limited but notable," not
      primary. Separately and notably, Acronis states that despite the malware's Portuguese-
      speaking authorship, "no telemetry observed targets in Brazil or Portugal" — which Acronis
      says "is consistent with public reporting that the post-takedown Grandoreiro codebase
      forked, with a 'light' variant now focused on Mexican targets." This is a reference to
      generic, unnamed "public reporting" of a prior codebase fork — Acronis does NOT cite a
      specific report, does NOT name a specific prior Acronis campaign, and does NOT attribute
      this wave to any specific named actor or cluster designation. The link is to a claimed
      historical fact about the malware's evolution, not to a named threat-intel entity.

      WHAT THE SOURCE EXPLICITLY DOES NOT CLAIM: (1) initial delivery vector — Acronis
      explicitly states "the initial delivery vector could not be conclusively confirmed" and
      only assesses "with moderate confidence" (based on the invoice-styled archive filename
      and historical Grandoreiro distribution patterns) that delivery was via a spam campaign;
      (2) live C2 interaction/observed traffic — none, server was offline, all C2-protocol
      detail is from static analysis; (3) any specific named actor, cluster ID, or link to a
      specific prior report/campaign — only "public reporting" in the generic sense; (4) the
      T1071.004 (DNS) ATT&CK mapping is explicitly hedged by Acronis itself — its own mapping
      table lists it "only if the DoH observation is substantiated," i.e., Acronis flags this
      mapping as provisional given the lack of live-traffic confirmation.

      DETECTION AND HUNTING (Acronis's own, source-stated): (a) a renamed copy of the Duplicate
      Files Finder executable loading mingwm10.dll from the same directory — the sideload chain
      itself is the highest-signal artefact; (b) a process resolving a domain via Google's DoH
      endpoint immediately followed by an outbound TCP/6432 connection (conditional on the DoH
      behavior being confirmed in the wild); (c) the fixed C2-protocol command token appearing
      in egress traffic or process memory; (d) a GUI process that suppresses its own window and
      then, in quick succession, queries a public IP-geolocation service and the
      HARDWARE\DESCRIPTION\System\BIOS registry path — this specific sequence (silent GUI
      process → geolocation lookup → BIOS registry read, all within moments of launch) is the
      behavioral fingerprint Acronis calls out as high-signal for hunting, distinguishing this
      from ordinary DFF usage (which does not silently suppress its window or query BIOS/geo
      data at all).
