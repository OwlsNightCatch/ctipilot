  - title: "Citrix NetScaler ADC/Gateway: new critical memory-overflow and authentication-bypass pair (CVE-2026-19489, CVE-2026-19490) — patched, not yet observed exploited"
    sources:
      - { url: "https://cert.europa.eu/publications/security-advisories/2026-010/", publisher: "CERT-EU", date: "2026-08-19", role: "primary" }
      - { url: "https://www.rapid7.com/blog/post/etr-cve-2026-19490-critical-vulnerability-affecting-citrix-netscaler-adc-and-netscaler-gateway/", publisher: "Rapid7", date: "2026-08-19", role: "corroborating" }
      - { url: "https://support.citrix.com/support-home/kbsearch/article?articleNumber=CTX696939", publisher: "Citrix (vendor advisory, JS-rendered — content not independently retrievable this run)", date: "2026-08-19", role: "vendor-reference" }
    discovery_trace: "first seen at: anssi-fr/cert-eu essential-mandatory sweep, URL https://cert.europa.eu/publications/security-advisories/2026-010/ → primary: CERT-EU own advisory (2026-010) citing Citrix KB CTX696939, URL https://support.citrix.com/support-home/kbsearch/article?articleNumber=CTX696939 (Citrix's Wolken support portal is a JS shell to our fetch — content not retrievable) → corroborating: Rapid7 analysis, URL https://www.rapid7.com/blog/post/etr-cve-2026-19490-critical-vulnerability-affecting-citrix-netscaler-adc-and-netscaler-gateway/"
    summary: |
      On 19 August 2026 Citrix published a new security bulletin (CTX696939) for two vulnerabilities distinct from
      the CVE-2026-8451/8452 SAML SignedInfo overflow chain this pipeline covered on 2026-08-15. CVE-2026-19490
      (CVSS 9.3) is an authentication-bypass-via-alternate-path affecting NetScaler configured as a Gateway (SSL VPN,
      ICA Proxy, CVPN, RDP Proxy) or as an AAA virtual server, with particular relevance when SAML actions are
      configured — an unauthenticated remote attacker can circumvent the authentication control with no user
      interaction. CVE-2026-19489 (CVSS 8.8) is a memory-overflow vulnerability (improper restriction of operations
      within memory-buffer bounds) that requires SIP ALG to be enabled inside a Large Scale NAT (LSN) group
      configuration, and can cause unpredictable behaviour or denial of service rather than code execution. Fixed
      versions are NetScaler ADC/Gateway 14.1-73.32 and later, and 13.1-63.21 and later of the 13.1 branch. Rapid7
      states it has not observed in-the-wild exploitation of CVE-2026-19490 as of the advisory date, but flags that
      Citrix perimeter products are historically exploited within days of disclosure (CitrixBleed, CitrixBleed 2, the
      July 2026 SAML SignedInfo chain). No public PoC is confirmed yet. Given the auth-bypass CVE requires zero
      privileges and no interaction and sits on internet-facing VPN/AAA infrastructure, this is a same-day patch
      priority independent of confirmed exploitation.
    region_nexus: "global; CERT-EU advisory covers EU institutions directly, and NetScaler Gateway/AAA is a common remote-access control point in Swiss and EU government and CI networks"
    primary_sector_nexus: "direct"
    sector: "public-sector, energy, finance, healthcare, telco"
