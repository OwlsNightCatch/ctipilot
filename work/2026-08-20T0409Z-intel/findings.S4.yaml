  - title: "Latvia's vehicle-registration authority CSDD loses records on two-thirds of the population — and its 24/7-outsourced monitoring provider never caught it"
    sources:
      - { url: "https://therecord.media/latvia-cyberattack-vehicle-data", publisher: "The Record (Recorded Future News)", date: "2026-08-19", role: "primary" }
      - { url: "https://cert.lv/lv/2026/08/csdd-saskaries-ar-kiberdrosibas-incidentu", publisher: "CERT.LV (Latvia national CERT)", date: "2026-08-18", role: "primary" }
