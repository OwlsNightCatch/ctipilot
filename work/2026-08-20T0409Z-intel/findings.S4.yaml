  - title: "A rogue ransomware affiliate runs its own fake 'recovery firm' to skim ransom payments across three RaaS brands"
    sources:
      - { url: "https://www.guidepointsecurity.com/blog/beware-ransom-busters/", publisher: "GuidePoint Security (GRIT — Research and Intelligence Team)", date: "2026-08-18", role: "primary" }
      - { url: "https://www.bleepingcomputer.com/news/security/rogue-ransomware-affiliate-ransom-busters-poses-as-recovery-firm/", publisher: "BleepingComputer", date: "2026-08-19", role: "corroborating" }
      - { url: "https://databreaches.net/2026/08/19/beware-the-ransomware-rescuer-ransom-busters/", publisher: "DataBreaches.net", date: "2026-08-19", role: "corroborating" }
    discovery_trace: "first seen at: databreaches-net, URL https://databreaches.net/2026/08/19/beware-the-ransomware-rescuer-ransom-busters/ → primary: GuidePoint Security GRIT, URL https://www.guidepointsecurity.com/blog/beware-ransom-busters/ → corroboration: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/rogue-ransomware-affiliate-ransom-busters-poses-as-recovery-firm/"
    summary: |
      GuidePoint's Research and Intelligence Team (GRIT) documents "Ransom Busters," an entity that emails
      ransomware victims proactively — before the incident becomes public, targeting CEO and IT-leadership
      addresses — falsely posing as an independent data-recovery service with "three years of experience,"
      claiming pre-existing unauthorized access to the attacking RaaS operation's own leak-site
      infrastructure and administrative panels, and offering to hand over decryption keys and delete stolen
      data for USD 20,000-60,000. GRIT assesses with moderate confidence that Ransom Busters is not a third
      party at all but a single ransomware affiliate skimming payments from multiple RaaS programs it
      already works for — DragonForce, Settra and Anubis observed to date. The evidence is a cross-incident
      tooling and infrastructure fingerprint found identical across two ostensibly unrelated victim
      environments: SoftPerfect Network Scanner for internal reconnaissance, the "Remotely" remote-management
      tool deployed via a PowerShell script for persistent remote access, s5cmd used to bulk-exfiltrate data
      to attacker-controlled AWS cloud storage, and — the strongest pivot — a backdoor local account using
      the identical fixed password "Numlock!123" launched from the identical attacker hostname
      "DESKTOP-BBETH6K," reused across incidents nominally attributed to different RaaS brands. Ransomware
      negotiator Coveware (via BleepingComputer) called this interference on a still-private, undisclosed
      incident "much more concerning" than a post-disclosure copycat scam targeting already-public victims.
      GuidePoint's guidance: report any such unsolicited pre-disclosure outreach to the incident-response team
      immediately, treat it as adversarial rather than a rescue offer, and never pay — payment provides no
      assurance data is actually deleted, since ransomware operators routinely retain copies for
      re-extortion regardless of what is promised.
    region_nexus: "global — directly actionable for any Swiss/European IR team currently handling an undisclosed ransomware incident, since the outreach targets victims specifically because they are mid-incident"
    primary_sector_nexus: "indirect"
    sector: "cross-sector"
    cves: []
    techniques: [T1046, T1219, T1567.002, T1136.001, T1657]
    affected_products: []
    entity_keys: []
    new_entities:
      - { key: "actor:ransom-busters", type: actor, name: "Ransom Busters", aliases: [],
          summary: "Rogue ransomware-affiliate persona posing as an independent data-recovery/rescue firm to intercept ransom negotiations and skim payments from victims of multiple RaaS operations before their incidents become public (GuidePoint GRIT, 2026-08-18)." }
      - { key: "actor:anubis-ransomware", type: actor, name: "Anubis", aliases: [],
          summary: "Ransomware-as-a-service operation; one of the RaaS brands whose victims GuidePoint GRIT found targeted by the Ransom Busters rogue-affiliate scheme (GuidePoint, 2026-08-18)." }
      - { key: "actor:settra", type: actor, name: "Settra", aliases: [],
          summary: "Ransomware-as-a-service operation; one of the RaaS brands whose victims GuidePoint GRIT found targeted by the Ransom Busters rogue-affiliate scheme (GuidePoint, 2026-08-18)." }
    relation_suggestions:
      - { subject: "actor:ransom-busters", object: "actor:dragonforce", basis: "GuidePoint GRIT: identical backdoor password/hostname/tooling fingerprint ties Ransom Busters activity to a DragonForce RaaS incident (GuidePoint, 2026-08-18)" }
      - { subject: "actor:ransom-busters", object: "actor:anubis-ransomware", basis: "GuidePoint GRIT: same fingerprint observed in an Anubis RaaS incident (GuidePoint, 2026-08-18)" }
      - { subject: "actor:ransom-busters", object: "actor:settra", basis: "GuidePoint GRIT: same fingerprint observed in a Settra RaaS incident (GuidePoint, 2026-08-18)" }
    verification: MULTI-SOURCE
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "GRIT assesses with moderate confidence that 'Ransom Busters' is not a bona fide third-party victim services firm, but rather a single ransomware affiliate."
        attribution: "GuidePoint Security GRIT"
        source_url: "https://www.guidepointsecurity.com/blog/beware-ransom-busters/"
      - quote: "the use of identical tools in multiple environments suggest[s] the same operator."
        attribution: "GuidePoint Security GRIT"
        source_url: "https://www.guidepointsecurity.com/blog/beware-ransom-busters/"
      - quote: "This type of interference on a non-public incident is much more concerning"
        attribution: "Elizabeth Cookson, Coveware (via BleepingComputer)"
        source_url: "https://www.bleepingcomputer.com/news/security/rogue-ransomware-affiliate-ransom-busters-poses-as-recovery-firm/"
    extended_notes: |
      Triage discriminator for readers: a legitimate ransomware-negotiation/recovery firm is retained BY the
      victim after the victim's own outreach (via counsel or an IR firm); it does not cold-email the victim
      organization before the incident is public, and it does not claim pre-existing access to the attacker's
      own leak-site panel. The fixed backdoor password and attacker hostname are usable cross-incident IR
      pivots (behavioral, not IOC) for correlating "unrelated" ransomware cases handled by the same team.

