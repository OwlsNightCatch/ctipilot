    discovery_trace: "first seen at: databreaches-net, URL https://databreaches.net/2026/08/19/doj-secures-indictment-of-17-iranians-accused-of-massive-cyber-theft-campaign/ → primary: DOJ OPA, URL https://www.justice.gov/opa/pr/17-iranians-charged-conducting-massive-cyber-theft-campaign-behalf-islamic-revolutionary → corroboration: Nextgov/FCW, URL https://www.nextgov.com/cybersecurity/2026/08/doj-charges-17-iranians-cybertheft-campaign/415511/ → corroboration: BleepingComputer, URL https://www.bleepingcomputer.com/news/security/us-charges-iranian-hackers-over-34-billion-intellectual-property-theft/ → background: CFR Cyber Operations Tracker (2018 predicate case), URL https://www.cfr.org/cyber-operations/indictment-of-officials-from-the-mabna-institute"
    summary: |
      DOJ unsealed a 14-count superseding indictment on 2026-08-18 adding eight new defendants (17 total)
      to the 2018 case against Iran's Mabna Institute, an IRGC-linked hacking-for-hire company active since
      roughly 2013. The group's core tradecraft is spearphishing links against university faculty/researchers
      that lead to cloned library-login pages harvesting institutional credentials, which are then reused as
      valid accounts to pull journals, dissertations, e-books and other subscription content wholesale from
      institutional information repositories. DOJ states the campaign reached 144 U.S. and 178 foreign
      universities, at least 42 U.S. and 11 foreign private companies, five U.S. federal/state agencies and
      two NGOs, extracting roughly 31.5 TB of data DOJ now values at approximately $3.4 billion; stolen
      material was resold to Iranian universities and government clients through two operator-run websites.
      The superseding indictment's new charges cover activity by the eight newly added defendants that
      continued "well after" the 2018 filing. This is not a one-off US story for a European/Swiss reader: the
      2018 predicate case (background, not itself in-window) explicitly named a Switzerland-based company
      among the 11 foreign private-sector victims, alongside companies in Germany, Italy, Sweden and the UK,
      and the 178 foreign universities span more than 21 countries — this actor has a documented, direct
      Swiss/European academic and private-sector victim footprint, not just a US one.
    region_nexus: "global; the 2018 predicate case named a Switzerland-based company among its foreign private-sector victims (also Germany, Italy, Sweden, UK), and 178 foreign universities across 21+ countries"
