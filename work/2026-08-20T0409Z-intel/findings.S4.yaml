    discovery_trace: "first seen at: therecord (always-sweep), URL https://therecord.media/ → article https://therecord.media/latvia-cyberattack-vehicle-data → primary: CERT.LV advisory, URL https://cert.lv/lv/2026/08/csdd-saskaries-ar-kiberdrosibas-incidentu → corroboration: inbox.eu (IT-provider Tet's on-record response), URL https://news.inbox.eu/150n4c8-why-tet-did-not-warn-csdd-about-the-cyberattack-the-company-commented-on-the-situation-for-the-first-time"
    summary: |
      Latvia's Road Traffic Safety Directorate (CSDD) — the national vehicle-registration and
      driver-licensing authority — suffered a targeted, reconnaissance-preceded intrusion in the window
      8-10 August 2026 that CERT.LV's deputy head Varis Teivans assesses as showing genuine "technical
      competence" on the attacker's part. The Record reports the attacker reached an internet-exposed CSDD
      system on which "several mandatory cybersecurity requirements were unmet" (specifics not disclosed),
      and extracted historical payment-receipt records dating back to 2008: personal ID codes, names,
      payment amounts/dates, vehicle registration plates and physical addresses for roughly 1.2 million
      individuals (about two-thirds of Latvia's population) and 200,000 legal entities. Account usernames,
      passwords, phone numbers and email addresses were not compromised. CSDD's own specialists — not its
      outsourced IT provider — discovered and stopped the intrusion within hours on 7-8 August; the provider,
      Tet (itself subcontracting to Corporate Systems and Kyndryl Latvia), held a contractual round-the-clock
      monitoring obligation but neither detected the breach nor alerted CSDD, and has since limited its
      admitted responsibility to "the part of the systems specified in the contract." The fallout: CSDD's
      entire supervisory board resigned, and agency chief Aivars Aksenoks says he intends to resign once the
      investigation concludes; President Edgars Rinkevics said the incident undermined "public trust in this
      institution." CERT.LV's guidance to affected individuals is itself a discriminator worth propagating:
      never approve a Smart-ID or eParaksts authentication push you did not yourself initiate, and verify any
      "official" communication about the breach by navigating directly to e.csdd.lv rather than following a
      link.
