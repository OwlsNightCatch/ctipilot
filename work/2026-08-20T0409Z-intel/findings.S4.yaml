  - title: "Berlin isolates two state ministries from its government network after a cyberattack — BSI and state police called in, no technical detail disclosed"
    sources:
      - { url: "https://therecord.media/berlin-cuts-two-state-ministries-off-government-breach", publisher: "The Record (Recorded Future News)", date: "2026-08-18", role: "primary" }
      - { url: "https://www.berlin.de/rbmskzl/aktuelles/pressemitteilungen/2026/pressemitteilung.1703898.php", publisher: "Berlin Senate Chancellery (official press release)", date: "2026-08-18", role: "primary" }
    discovery_trace: "first seen at: therecord (always-sweep), URL https://therecord.media/ → article https://therecord.media/berlin-cuts-two-state-ministries-off-government-breach → primary: Berlin Senate Chancellery press release, URL https://www.berlin.de/rbmskzl/aktuelles/pressemitteilungen/2026/pressemitteilung.1703898.php"
    summary: |
      On 17 August 2026, forensic investigation established that the shared Berlin state network
      ("Landesnetz Berlin") had been compromised ("eine Inkriminierung des Landesnetzes Berlin"). Two
      Senate administrations — Urban Development, Building and Housing; and Mobility, Transport, Climate
      Protection and Environment — were isolated from the state network as a precaution, cutting staff off
      from email and internet access and disrupting public-facing services including housing-benefit
      applications. Berlin's official statement says attackers "allegedly exploited a vulnerability in the
      IT systems of one of the affected ministries" but withholds every further technical detail "for
      investigative-tactics reasons" ("aus ermittlungstaktischen Gründen"). The state's Criminal Police
      Office (LKA), the Berlin state prosecutor, the federal BSI, and an ICT emergency crisis task force led
      by the state's information-security commissioner are all involved. No actor attribution, ransom
      demand, or data-exfiltration claim has been made public. Because the government will not confirm
      whether the exploited system was internet-facing, the ATT&CK mapping below reflects only the
      confirmed abstraction ("a vulnerability was exploited for access") and should not be read as
      confirming an internet-exposed entry point.
