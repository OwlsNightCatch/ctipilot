    extended_notes: |
      Prerequisite-detection concept: on any NetScaler appliance in scope, the config strings `add lsn group.*sipalg.*`
      (CVE-2026-19489 precondition) and `add authentication samlAction.*` / `add authentication vserver .*` / `add vpn
      vserver .*` (CVE-2026-19490 precondition, version-dependent) are exactly what CERT-EU's advisory instructs
      operators to grep their own running-config for — a fast triage step ahead of a full version audit. This is the
      fourth distinct NetScaler CVE family this pipeline has tracked in 2026 (CitrixBleed 2/DragonForce IAB chain;
      the July SAML-IDP memory-disclosure pair CVE-2026-8451/8452; now this auth-bypass/DoS pair), reinforcing
      NetScaler's standing as a recurrently-exploited edge-appliance class for this constituency's internet-facing
      remote-access layer.
