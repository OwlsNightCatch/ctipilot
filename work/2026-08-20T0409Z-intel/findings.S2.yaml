items:
  - title: "CERT-EU flags two new Citrix NetScaler ADC/Gateway CVEs — a CVSS 9.3 unauthenticated auth bypass on Gateway/AAA vservers and a SIP-ALG memory overflow"
    sources:
      - { url: "https://cert.europa.eu/publications/security-advisories/2026-010/", publisher: "CERT-EU", date: "2026-08-19", role: "primary" }
      - { url: "https://www.rapid7.com/blog/post/etr-cve-2026-19490-critical-vulnerability-affecting-citrix-netscaler-adc-and-netscaler-gateway/", publisher: "Rapid7", date: "2026-08-19", role: "corroborating" }
    discovery_trace: "first seen at: cert-eu, URL https://cert.europa.eu/publications/security-advisories/2026-010/ (fetched via bridge structured recipe `cert-eu recent 8`) → primary: CERT-EU's own advisory 2026-010, URL https://cert.europa.eu/publications/security-advisories/2026-010/ → corroboration: Rapid7, URL https://www.rapid7.com/blog/post/etr-cve-2026-19490-critical-vulnerability-affecting-citrix-netscaler-adc-and-netscaler-gateway/ (vendor advisory itself at https://support.citrix.com/support-home/kbsearch/article?articleNumber=CTX696939 is an unreachable Wolken-portal SPA shell — cited via CERT-EU and Rapid7's mirroring of its content instead)"
    summary: |
      On 19 August 2026 Citrix published a security advisory (CTX696939) addressing two new vulnerabilities in
      NetScaler ADC and NetScaler Gateway, and CERT-EU issued its own advisory (2026-010) the same day recommending
      EU-constituency organisations patch immediately. CVE-2026-19490 (CVSS v4.0 9.3, CWE-288 Authentication Bypass
      Using an Alternate Path) lets an unauthenticated network attacker bypass authentication on an appliance
      configured as a Gateway (SSL VPN, ICA Proxy, CVPN, RDP Proxy) or as an AAA virtual server — no user interaction,
      no elevated privileges required. On builds 14.1-43.56 / 13.1-61.28 and later the flaw is reachable only when a
      SAML authentication action is configured (`add authentication samlAction.*` in the running config); on earlier
      builds and on 13.1 FIPS, any Gateway or AAA vserver configuration is sufficient — a materially larger blast
      radius than the version numbers alone suggest. CVE-2026-19489 (CVSS 8.8) is a memory-overflow condition in the
      appliance's handling of SIP ALG (Session Initiation Protocol Application Layer Gateway) when configured on a
      Large Scale NAT (LSN) group (`add lsn group.*sipalg.*`), leading to unpredictable behaviour or denial of
      service. Fixed versions are NetScaler ADC/Gateway 14.1-73.32 and 13.1-63.21 (plus the corresponding FIPS/NDcPP
      builds); versions before those are affected. As of 19 August 2026 Rapid7 reports no observed in-the-wild
      exploitation of CVE-2026-19490, but flags NetScaler as a historically high-value target for rapid post-disclosure
      weaponisation (CitrixBleed, CitrixBleed 2 and the July 2026 SharePoint-adjacent NetScaler SAML-IDP memory
      disclosure this pipeline has already tracked). NetScaler Gateway/AAA vservers are widely deployed as the
      internet-facing SSL VPN / remote-access layer for Swiss and European government and critical-infrastructure
      networks, making this advisory directly actionable for the constituency regardless of confirmed exploitation
      status.
    region_nexus: "EU/CH — CERT-EU's own advisory recommends immediate patching across its EU-institution and member-state constituency; NetScaler Gateway is a common SSL-VPN/remote-access layer in Swiss and European government and CI networks"
