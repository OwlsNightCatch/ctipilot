  - title: "Balonx Sistema — subscription PhaaS bundles a real-time WebSocket MFA-relay panel, an Android RAT and a GPT-4o-mini/ElevenLabs AI-vishing module against 20+ Mexican banks"
    sources:
      - { url: "https://www.group-ib.com/blog/balonx-sistema-mexico-phaas/", publisher: "Group-IB", date: "2026-08-19", role: "primary" }
      - { url: "https://www.group-ib.com/blog/rss.xml", publisher: "Group-IB (blog feed)", date: "2026-08-19", role: "corroborating" }
    discovery_trace: "first seen at: group-ib, URL https://www.group-ib.com/blog/rss.xml → primary: Group-IB, URL https://www.group-ib.com/blog/balonx-sistema-mexico-phaas/ (no pivot needed)"
    summary: |
      Group-IB documents Balonx Sistema, a subscription phishing-as-a-service platform ("Individual" tier 3,000 MXN/week,
      "Office" tier 6,000 MXN/week, payment automated via the Bitso exchange API) targeting more than 20 Mexican financial
      institutions. The phishing panel maintains a persistent, bidirectional WebSocket session between the victim's browser
      and the operator's control panel: when a victim submits banking credentials, the operator relays them live to the real
      bank portal, receives the resulting MFA challenge, and pushes one of 14 pre-built screen types (matched to the specific
      OTP/SMS channel the bank uses) back to the victim to capture the code before it expires — a live adversary-in-the-middle
      credential-and-OTP relay rather than a static credential-harvesting kit. The operation bundles a Spyroid-derived Android
      RAT (APK "BankProtect," package sacred.explosion) distributed via fake bank security-alert lures, which opens a
      persistent TCP connection to a hardcoded C2 (196.251.84.11:7771) for keylogging and screen capture. A parallel module
      called CallFlow automates outbound vishing calls: GPT-4o-mini generates the conversational dialogue in real time,
      ElevenLabs synthesizes the voice, and OpenAI Whisper transcribes the victim's spoken responses, all running on a
      FreePBX PBX instance with 30 concurrent SIP channels. Group-IB traces the operation (aliased "Aclaraciones Bancarias")
      to a first domain registered in 2019 and has now identified 350+ domains, all pointing to the same centralized Neon
      PostgreSQL backend so that victim sessions and affiliate accounts persist across domain takedowns. Group-IB assesses
      1,100+ victim credential sets harvested since at least October 2025, and ties the operation to roughly $1.73M MXN in
      estimated affiliate earnings across 12 active operator accounts.
    region_nexus: "Mexico / Latin America primary; the AiTM-relay + AI-vishing technique combination is directly transferable to European retail-banking phishing kits"
