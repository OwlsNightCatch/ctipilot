    discovery_trace: "first seen at: intel471, URL https://www.intel471.com/blog/feed → primary: Intel 471, URL https://www.intel471.com/blog/a-new-era-of-bulletproof-hosting-providers-emerge (no pivot needed)"
    summary: |
      Intel 471 tracks how bulletproof-hosting (BPH) demand redistributes rather than disappears after law-enforcement
      action: following the disruption/exposure of established operators yalishanda (Alexander Volosovik), ccweb and
      whost (Mykhaylo Rytikov) through 2025-2026 US Treasury sanctions, DOJ indictments and an FBI operation (Operation
      Riptide), roughly 80% of yalishanda's ~2,240 tracked customer domains remained operational into June 2026, some
      migrating onto legitimate cloud providers (Cloudflare, Amazon, DigitalOcean) to blend in rather than to a
      replacement BPH brand. Emerging services named by Intel 471 — OtusCloud, reming's fast-flux proxy service, and
      fluxy's "VIP FAST FLUX" offering — support the same customer base (malware C2, ransomware leak sites, phishing
      infrastructure, carding shops, credential-harvesting pages) using disposable cloud VPS rental, frequent IP
      rotation, layered reseller relationships and fast-flux DNS to raise the cost and latency of takedown-by-domain or
      takedown-by-IP.
