    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "In this campaign, the authors use the legitimate Duplicate Files Finder application but rename it to a randomly generated filename to obscure its purpose. When executed, it first loads another legitimate dependency, dupfdll.dll. This DLL then attempts to load its next dependency, mingwm10.dll, which is not legitimate."
        attribution: "Acronis Threat Research Unit"
        source_url: "https://www.acronis.com/en/tru/posts/grandoreiro-goes-north-from-brazil-to-mexico-with-a-new-dll-sideloading-campaign/"
      - quote: "If shortcuts for all seven applications are present on the desktop, the malware classifies the system as a sandbox environment and terminates execution."
        attribution: "Acronis Threat Research Unit"
        source_url: "https://www.acronis.com/en/tru/posts/grandoreiro-goes-north-from-brazil-to-mexico-with-a-new-dll-sideloading-campaign/"
      - quote: "it is notable that, although the malware appears to have been developed by Portuguese-speaking authors, no telemetry observed targets in Brazil or Portugal. This is consistent with public reporting that the post-takedown Grandoreiro codebase forked, with a light variant now focused on Mexican targets."
        attribution: "Acronis Threat Research Unit"
        source_url: "https://www.acronis.com/en/tru/posts/grandoreiro-goes-north-from-brazil-to-mexico-with-a-new-dll-sideloading-campaign/"
    extended_notes: |
      TRU's own hunting leads (directly usable): a renamed Duplicate Files Finder executable loading mingwm10.dll from
      the same directory; a process resolving a domain via https://dns.google/resolve?name= immediately followed by an
      outbound TCP/6432 connection; the literal token CLIENT_SOLICITA_DDS_MDL in egress traffic or process memory; a GUI
      process that suppresses its own window then queries ip-api.com and HKLM\HARDWARE\DESCRIPTION\System\BIOS in quick
      succession. The sandbox-fingerprint-by-presence-of-all-seven-tools logic (rather than absence-of-tools) is itself
      a useful triage signal: a real analyst workstation with all seven installed will trip the malware's own evasion
      logic and silently no-op rather than alert.
    borderline: false

  - title: "ToxicPanda 2.0: Android banking trojan automates ADB Wireless Debugging enablement via Accessibility Service abuse to reach shell-level privilege without USB access, expanding to 349 targeted apps across 16 countries"
    sources:
      - { url: "https://zimperium.com/blog/the-toxicpanda-never-sleeps-toxicpanda-2.0-prepares-its-next-strike-on-mobile", publisher: "Zimperium zLabs", date: "2026-08-19", role: "primary" }
    discovery_trace: "first seen at: zimperium-zlabs, URL https://zimperium.com/blog → primary: Zimperium zLabs, URL https://zimperium.com/blog/the-toxicpanda-never-sleeps-toxicpanda-2.0-prepares-its-next-strike-on-mobile (no pivot needed)"
    summary: |
      Zimperium zLabs documents ToxicPanda 2.0, a substantial evolution of the Android banking trojan first disclosed by
      Cleafy in late 2024. The headline mechanism is privilege escalation without physical USB access: abusing the
      Accessibility Service, the malware automates a five-step chain — enabling Developer Options, navigating to Wireless
      Debugging, extracting the SPAKE2 pairing code the OS displays for wireless-ADB pairing, completing the SPAKE2
      cryptographic handshake programmatically, and issuing high-privilege commands directly through the resulting ADB
      shell session. Once at shell level, several remote commands that Cleafy's original analysis had flagged as
      unimplemented placeholders are now fully functional. Overlay-based credential theft remains the core fraud
      mechanism: transparent full-screen WebViews (the `transparent` command) capture PINs, patterns and passwords over
      both banking-app login screens and the device lock screen itself, now covering 349 banking/financial/e-wallet/crypto
      applications across 16 countries (up from a narrower initial target list), including 140+ apps specifically targeted
      for PIN theft during active-session overlay capture. C2 remains AES-ECB-encrypted over a persistent WebSocket, but
      payload delivery has moved to AWS-hosted buckets. New OEM-specific commands (`catAllViewSwitch`, `admSet`/`admPwd`
      for Device Administrator abuse, `autoBoot` for battery-optimization-whitelist bypass) are tailored per-vendor for
      Xiaomi, OPPO, Vivo, Samsung and Huawei devices, reflecting the fragmented background-execution restrictions each
      OEM applies. Zimperium does not attribute the operation to a named actor or group.
    region_nexus: "Global — 16 countries with active targeting; technique (accessibility-driven wireless-ADB abuse) is platform-generic and not region-specific"
    primary_sector_nexus: "indirect"
    sector: "finance, telco"
    cves: []
    techniques: [T1111, T1056, T1071.001]
    affected_products: []
    entity_keys: []
    new_entities:
      - { key: "malware:toxicpanda", type: malware, name: "ToxicPanda", aliases: [],
          summary: "Android banking trojan first documented by Cleafy (late 2024); version 2.0 (Zimperium zLabs, 2026-08-19) adds automated ADB Wireless Debugging abuse via Accessibility Service to reach shell-level device control without USB access, and expands overlay-phishing coverage to 349 apps across 16 countries." }
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "ToxicPanda 2.0 significantly expands its targeting scope, supporting phishing overlays for 349 banking, financial, e-wallet, and cryptocurrency applications across 16 countries."
        attribution: "Zimperium zLabs"
        source_url: "https://zimperium.com/blog/the-toxicpanda-never-sleeps-toxicpanda-2.0-prepares-its-next-strike-on-mobile"
      - quote: "The malware abused the Accessibility Service enabling wireless debugging to get shell user capabilities to run some commands on the device."
        attribution: "Zimperium zLabs"
        source_url: "https://zimperium.com/blog/the-toxicpanda-never-sleeps-toxicpanda-2.0-prepares-its-next-strike-on-mobile"
      - quote: "Several commands previously identified as unimplemented in Cleafy's analysis are now fully operational, expanding the malware's remote control and fraud capabilities."
        attribution: "Zimperium zLabs"
        source_url: "https://zimperium.com/blog/the-toxicpanda-never-sleeps-toxicpanda-2.0-prepares-its-next-strike-on-mobile"
    extended_notes: |
      Note for MDM/BYOD-relevant defenders: because ADB Wireless Debugging must be enabled via Developer Options before
      it can be abused, an MDM/EMM policy that disables Developer Options (or alerts on its runtime toggle) on
      corporate-enrolled Android devices removes this specific privilege-escalation path outright, independent of
      whether the app-vetting layer catches the initial dropper. Full command reference published by Zimperium at
      https://github.com/Zimperium/IOC/blob/master/2026-08-ToxicPanda/commands.md.
    borderline: true
    borderline_reason: "Consumer/BYOD mobile-banking malware with no stated enterprise or government targeting; included for the transferable ADB-privilege-escalation technique and MDM hardening lever, which is genuinely new to this pipeline's coverage of ToxicPanda."

  - title: "UPDATE — Block traces the Coldcard Wave 1 attacker to a paid account at a blockchain data provider via query-log fingerprinting, handing law enforcement a lead"
    sources:
      - { url: "https://www.cryptotimes.io/2026/08/19/block-and-galaxy-research-give-lead-to-law-enforcement-in-111m-coldcard-bitcoin-theft/", publisher: "CryptoTimes", date: "2026-08-19", role: "primary" }
