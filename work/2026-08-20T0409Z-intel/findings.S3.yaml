  - title: "Grandoreiro's operators sideload through a renamed 'Duplicate Files Finder' binary, gate execution behind a ~50-check anti-analysis routine, and resolve C2 via Google DoH — full ATT&CK mapping and hunting leads published"
    sources:
      - { url: "https://www.acronis.com/en/tru/posts/grandoreiro-goes-north-from-brazil-to-mexico-with-a-new-dll-sideloading-campaign/", publisher: "Acronis Threat Research Unit (TRU)", date: "2026-08-19", role: "primary" }
      - { url: "https://www.acronis.com/en-us/tru/feed.xml", publisher: "Acronis TRU (blog feed)", date: "2026-08-19", role: "corroborating" }
    discovery_trace: "first seen at: acronis-tru, URL https://www.acronis.com/en-us/tru/feed.xml → primary: Acronis TRU, URL https://www.acronis.com/en/tru/posts/grandoreiro-goes-north-from-brazil-to-mexico-with-a-new-dll-sideloading-campaign/ (no pivot needed)"
    summary: |
      Acronis TRU (Santiago Pontiroli) documents a May-2026 Grandoreiro banking-trojan wave that survives the January 2024
      Polícia Federal/INTERPOL infrastructure takedown and now concentrates on Mexico rather than Grandoreiro's historic
      Brazil/Portugal base. Delivery is a ZIP (assessed moderate-confidence as spam-delivered given the invoice-styled
      filename, "Fac-BH22DC0608_RevMQKSAC.zip") containing a renamed copy of the legitimate Duplicate Files Finder (DFF)
      executable; DFF loads its genuine dependency dupfdll.dll, which in turn loads mingwm10.dll — in this chain a
      malicious replacement rather than the legitimate library (T1574.001 DLL side-loading; the parent binary carries a
      2008 compile timestamp against the malicious mingwm10.dll's 2026 timestamp). Before any C2 contact, the loader runs
      an extensive anti-analysis gate: a system-uptime check (>=180,000 ms), a check for desktop shortcuts to seven named
      analyst/AV tools that — if ALL present — is read as a sandbox fingerprint rather than a real user machine, hardware
      profiling (RAM, CPU count, free disk, screen resolution, recent-documents list), VM-artifact checks (VBox/VMware
      driver files, BIOS-string blacklist, VMware Tools registry key), a 49-name process blacklist covering debuggers,
      disassemblers and network-analysis tools, an ip-api.com geolocation call that blacklists CZ/RU/NL, and a
      username+hostname blacklist. Only after all checks pass does the malware resolve its hardcoded C2 domain
      (b744156103040828396040.nhlfan[.]net) via Google's DNS-over-HTTPS endpoint (hxxps://dns[.]google/resolve?name=) and
      issue an HTTP GET on TCP/6432 carrying an encrypted, host-fingerprinted request beginning with the literal token
      CLIENT_SOLICITA_DDS_MDL. Strings are protected with a custom Base64+XOR scheme; TRU built and published a Python
      decoder since no public one existed. TRU's own 30-day telemetry places the largest share of current detections in
      Mexico, with a secondary cluster in Spain, and notes the Portuguese-speaking developer origin no longer correlates
      with any Brazil/Portugal telemetry — consistent with public reporting that the post-takedown codebase forked into a
      Mexico-focused "light" variant. TRU publishes its own MITRE ATT&CK mapping and IoCs (samples and five C2 domains).
    region_nexus: "Latin America primary (Mexico-concentrated); secondary cluster in Spain, limited North America/Europe detections"
    primary_sector_nexus: "indirect"
    sector: "finance"
