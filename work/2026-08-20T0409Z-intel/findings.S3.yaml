    discovery_trace: "first seen at: cryptotimes, URL https://www.cryptotimes.io/2026/08/19/block-and-galaxy-research-give-lead-to-law-enforcement-in-111m-coldcard-bitcoin-theft/ → primary: Bitcoin Magazine, URL https://bitcoinmagazine.com/technical/hunting-down-the-coldcard-hacker-wave-1-thief-may-be-known-to-fbi"
    summary: |
      Block's engineering team (lead Clay Garrett) says it identified an unusual on-chain pattern in the sweep
      transactions draining Coldcard-generated Bitcoin addresses (the March-2021 hardware-TRNG-to-software-PRNG firmware
      regression this pipeline covered on 2026-08-02) and traced it to a paid account the Wave 1 operator held at a named
      blockchain-data-services provider. The provider's internal query logs matched the suspected workflow "with
      extraordinary specificity, including the number, timing and sequence of requests" — i.e., the forensic technique is
      correlating on-chain address-lookup query patterns against a commercial data provider's own request logs, not
      on-chain analysis alone. Block says it shared this evidence with law-enforcement authorities; Galaxy Research
      (separately) says it has been supplying confirmed attacker- and victim-address lists to law enforcement, exchanges
      and compliance firms, and its analyst states investigators "may already" know the Wave 1 attacker's identity. As of
      CryptoTimes' 19 August figure, roughly 1,531 of the total 1,778.84 BTC Galaxy Research now attributes to the
      campaign remain unmoved in attacker-controlled addresses. No arrest or charge is reported; this is a lead, not a
      confirmed identification.
