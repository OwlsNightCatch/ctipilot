    extended_notes: |
      Detection angle for defenders outside Mexico: the interesting transferable piece is not the region but the pattern —
      a phishing kit built as a live operator console (persistent WebSocket channel between a browser session and a
      back-end panel) rather than a static credential-harvesting page, paired with an off-the-shelf AI-vishing stack
      (commodity LLM + commercial TTS + ASR) callable by a non-technical operator over ordinary VoIP trunking. Both
      elements — the always-on relay channel and the AI call-center pattern — are template-portable to any bank's OTP
      flow, including SMS-OTP and app-push flows used by European retail banks. Hunt angle: outbound long-lived WebSocket
      connections from consumer-facing anti-fraud/monitoring tooling to unfamiliar hosts immediately following a login
      event, and inbound VoIP call volume anomalies tied to newly registered SIP trunks.
