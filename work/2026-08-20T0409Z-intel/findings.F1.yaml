  # 1. BERLIN STATE MINISTRIES CYBERATTACK
  # ============================================================
  - item_id: berlin-landesnetz
    title: "Berlin isolates two Senate administrations from state network after ICT incident (IKT-Vorfall im Landesnetz Berlin)"
    correction_to_brief: >
      DATE CORRECTION: the Berlin Senate Chancellery's own press release
      (pressemitteilung.1703898.php) is dated 17.08.2026 (Monday), NOT
      2026-08-18 as stated in the task brief. The Record's article
      (published Monday, Aug 17 per its own "on Monday" phrasing) reports on
      this same 17.08 release. A SECOND, later Berlin.de item exists and
      should be considered for the entry: a dpa/BerlinOnline news article
      "Hackerangriff auf Landesnetz: Arbeit mit Hochdruck an Lösungen"
      (berlin.de/aktuelles, published + last-updated 19.08.2026) reporting
      on a press conference held Wednesday 19 Aug 2026 by Mayor Kai Wegner,
      Interior Senator Iris Spranger, CDO Florian Hauer and the State
      Information-Security Commissioner Dr. Olaf Kroll-Peters — this is the
      most current official information as of run time and materially
      updates the picture (no sensitive data confirmed leaked; election
      unaffected). A press-briefing invitation
      (pressemitteilung.1704576.php, 19.08.2026) confirms this briefing was
      scheduled for 16:00 at the Rotes Rathaus. No newer Berlin statement
      found beyond the 19.08 briefing coverage (checked via WebSearch as of
      2026-08-20).
    sources:
      - url: "https://www.berlin.de/rbmskzl/aktuelles/pressemitteilungen/2026/pressemitteilung.1703898.php"
        publisher: "Senatskanzlei Berlin (Berlin Senate Chancellery)"
        date: "2026-08-17"
        role: primary
        note: "Original press release, title 'IKT-Vorfall im Landesnetz Berlin', dated 'Pressemitteilung vom 17.08.2026' verbatim on page."
      - url: "https://therecord.media/berlin-cuts-two-state-ministries-off-government-breach"
        publisher: "The Record (Recorded Future News)"
        date: "2026-08-18"
        role: corroborating
      - url: "https://www.berlin.de/aktuelles/10581479-958090-hackerangriff-auf-landesnetz-arbeit-mit-.html"
        publisher: "Berlin.de (dpa/BerlinOnline wire copy hosted on the official Berlin.de portal)"
        date: "2026-08-19"
        role: corroborating
        note: "Reports on the 19 Aug press conference; published + last-updated 19.08.2026 per page metadata."
      - url: "https://www.berlin.de/rbmskzl/aktuelles/pressemitteilungen/2026/pressemitteilung.1704576.php"
        publisher: "Senatskanzlei Berlin"
        date: "2026-08-19"
        role: corroborating
        note: "Press-briefing invitation ('Presseeinladung') confirming the 19 Aug 16:00 briefing at Rotes Rathaus; scheduling only, no new substantive facts."
      - url: "https://www.blogspan.net/berlin-landesnetz-angriff-nicht-migrierte-it/"
        publisher: "blogspan.net (independent IT/security blog, author Alexander Baumgärtner)"
        date: "2026-08-18"
        role: supplementary
        note: "LOWER RELIABILITY — single-author blog. Relays and analyses RBB's reporting; states the vulnerability was in the IT of the Senatsverwaltung für Stadtentwicklung, Bauen und Wohnen (urban-development ministry) specifically, and that this ministry's IT was never migrated to the centrally-hardened ITDZ environment. This is an inference/analysis piece built on RBB's reporting, not an independent primary — treat as color, not as an established fact."
    confirmed_facts:
      - "Two Senate administrations affected, named by the Senate Chancellery itself: Senatsverwaltung für Stadtentwicklung, Bauen und Wohnen (Senate Dept. for Urban Development, Construction and Housing) and Senatsverwaltung für Mobilität, Verkehr, Klimaschutz und Umwelt (Senate Dept. for Mobility, Transport, Climate Action and Environment)."
      - "Both administrations were isolated from the Landesnetz (Berlin state network) 'seit vergangenem Freitag' (since last Friday) for security reasons — i.e. since Friday 2026-08-14, per the Senate Chancellery's own 17.08 statement."
      - "The Senate Chancellery's own statement uses the word 'Inkriminierung' (compromise/incrimination) found during forensic investigations — it does NOT itself say a 'vulnerability' was exploited. The specific claim that 'attackers exploited a vulnerability in the IT systems of one of the affected ministries' is sourced by The Record to German public broadcaster RBB, 'citing government sources' — it is RBB's/The Record's characterization, not a direct quote from the Senate Chancellery's own press release."
      - "Authorities/bodies explicitly named as involved by the Senate Chancellery: Landeskriminalamt (LKA, state criminal police), Staatsanwaltschaft Berlin (Berlin public prosecutor's office), and the Bundesamt für Sicherheit in der Informationstechnik (BSI, federal information-security office)."
      - "An 'IKT-Notfallkrisenstab' (ICT emergency crisis team) was established as of 17.08.2026, led by the Landesbevollmächtigter für Informationssicherheit (State Commissioner for Information Security, named in the later briefing invitation as Dr. Olaf Kroll-Peters)."
      - "The 17.08 statement explicitly withholds further detail: 'Aus ermittlungstaktischen Gründen können derzeit keine weiteren konkreten Informationen zu Ausmaß und Hintergründen gegeben werden' (for investigative-tactical reasons, no further concrete information on scope and background can currently be provided)."
      - "Per The Record (attributing to RBB): ITDZ Berlin, the state-owned central IT service provider, was NOT affected — the two ministries operate part of their IT infrastructure independently of ITDZ. Employees lost email/internet access and had to communicate by phone, SMS and fax. Housing-benefit (Wohngeld) applications and payouts, and education/participation-assistance applications at some district offices, were disrupted (district-office disruption specifically because those services rely on systems run by the urban-development ministry)."
      - "Per the 19 Aug press conference (Berlin.de/dpa): Mayor Kai Wegner stated 'Berlin wurde Opfer eines Hackerangriffs' (Berlin was the victim of a hacker attack) and that the incident 'war ernst und ist ernst' (was serious and is serious); per current knowledge ('Nach aktuellem Kentnisstand' [sic, page's own typo for Kenntnisstand]) NO sensitive data had been exfiltrated in the attack on the state network. Wohngeld application AND payout both remain unavailable; the administration is working at high pressure on a fix."
      - "Interior Senator Iris Spranger stated the 20 September 2026 state election is NOT endangered by the attack; there was a separate disruption since Monday evening (17 Aug) in access to the electronic postal-vote-documents request form, but current findings show no connection to the hacker attack."
      - "Officials have not said who was behind the attack, how access was gained, whether any data was stolen (per Senate Chancellery/Record as of 18 Aug), how long disconnection will last, or exactly when the intrusion itself occurred (only that isolation began Friday 14 Aug and forensic findings were confirmed by Monday 17 Aug)."
    mechanism_or_access_path: >
      Not stated by the Senate Chancellery itself. RBB (via The Record, and
      corroborated in framing by blogspan.net's analysis) reports, citing
      government sources, that attackers exploited a vulnerability in the IT
      systems of one of the two affected ministries specifically — no CVE,
      product, or vendor is named in any fetched source. blogspan.net's
      unverified analysis (single-source, lower reliability) further
      specifies the urban-development ministry (Stadtentwicklung, Bauen und
      Wohnen) as the one with the vulnerable, non-centrally-migrated IT
      environment, framing this as legacy/non-ITDZ-migrated infrastructure —
      this attribution to a specific ministry is NOT corroborated by the
      Senate Chancellery or by The Record's own reporting and should be
      flagged as single-source, if used at all.
    quotes:
      - quote: "Im Zuge forensischer Untersuchungen hat sich eine Inkriminierung des Landesnetzes Berlin ergeben."
        gloss_en: "In the course of forensic investigations, a compromise of the Berlin state network was established."
        attribution: "Senatskanzlei Berlin"
        source_url: "https://www.berlin.de/rbmskzl/aktuelles/pressemitteilungen/2026/pressemitteilung.1703898.php"
      - quote: "Die Senatsverwaltung für Stadtentwicklung, Bauen und Wohnen sowie die Senatsverwaltung für Mobilität, Verkehr, Klimaschutz und Umwelt sind als betroffene Verwaltungen aus Sicherheitsgründen seit vergangenem Freitag vom Landesnetz isoliert worden."
        gloss_en: "The Senate Dept. for Urban Development, Construction and Housing and the Senate Dept. for Mobility, Transport, Climate Action and Environment, as the affected administrations, have for security reasons been isolated from the state network since last Friday."
        attribution: "Senatskanzlei Berlin"
        source_url: "https://www.berlin.de/rbmskzl/aktuelles/pressemitteilungen/2026/pressemitteilung.1703898.php"
      - quote: "eingebunden sind auch das Landeskriminalamt, die Staatsanwaltschaft Berlin und das Bundesamt für Sicherheit in der Informationstechnik (BSI)."
        gloss_en: "also involved are the State Criminal Police Office, the Berlin Public Prosecutor's Office, and the Federal Office for Information Security (BSI)."
        attribution: "Senatskanzlei Berlin"
        source_url: "https://www.berlin.de/rbmskzl/aktuelles/pressemitteilungen/2026/pressemitteilung.1703898.php"
      - quote: "German public broadcaster RBB reported, citing government sources, that attackers allegedly exploited a vulnerability in the IT systems of one of the affected ministries."
        attribution: "The Record (Recorded Future News), attributing to RBB"
        source_url: "https://therecord.media/berlin-cuts-two-state-ministries-off-government-breach"
      - quote: "Both ministries remain operational, but employees have been cut off from their usual IT systems, including email and internet access, forcing them to communicate by telephone, text message and fax, according to RBB."
        attribution: "The Record (Recorded Future News), attributing to RBB"
        source_url: "https://therecord.media/berlin-cuts-two-state-ministries-off-government-breach"
      - quote: 'Der Regierende Bürgermeister von Berlin, Kai Wegner, erklärte am Mittwoch im Rahmen einer Pressekonferenz: "Berlin wurde Opfer eines Hackerangriffs". Der Vorfall "war ernst und ist ernst".'
        gloss_en: 'Berlin''s Governing Mayor Kai Wegner stated Wednesday at a press conference: "Berlin was the victim of a hacker attack." The incident "was serious and is serious."'
        attribution: "Berlin.de (dpa/BerlinOnline)"
        source_url: "https://www.berlin.de/aktuelles/10581479-958090-hackerangriff-auf-landesnetz-arbeit-mit-.html"
      - quote: "Nach aktuellem Kentnisstand seien bei den Angriff auf das Landesnetz aber keine sensiblen Daten abgeflossen, betonte er."
        gloss_en: "According to current knowledge, however, no sensitive data had leaked in the attack on the state network, he [Wegner] emphasized."
        attribution: "Berlin.de (dpa/BerlinOnline)"
        source_url: "https://www.berlin.de/aktuelles/10581479-958090-hackerangriff-auf-landesnetz-arbeit-mit-.html"
      - quote: "Wie die Innensenatorin Iris Spranger mitteilte, ist die Durchführung der Wahlen am 20. September 2026 durch den Angriff nicht gefährdet."
        gloss_en: "As Interior Senator Iris Spranger stated, the holding of the 20 September 2026 elections is not endangered by the attack."
        attribution: "Berlin.de (dpa/BerlinOnline)"
        source_url: "https://www.berlin.de/aktuelles/10581479-958090-hackerangriff-auf-landesnetz-arbeit-mit-.html"
    techniques: []
