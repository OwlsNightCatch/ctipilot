  - item_id: castilla-la-mancha-panzer
    title: "Castilla-La Mancha regional government confirms cyberattack after Panzer extortion group claims theft of student/family data; claim unverified"
    correction_to_brief: >
      No correction needed to the brief's framing — confirmed as described.
      Adds: a second, independent-appearing source was found (apdnoticies.com,
      published 2026-08-19, one day after EscudoDigital's 2026-08-18 piece)
      that corroborates the core facts in its own wording and adds one new
      claimed detail (Panzer's own stated intrusion date, per the article: 17
