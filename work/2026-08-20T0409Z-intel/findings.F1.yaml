    confirmed_facts:
      - "WHAT IS NEW: a 14-count SUPERSEDING (S2) indictment was unsealed 18 Aug 2026, charging 17 total members of the Mabna Institute. Nine of the 17 were previously charged in the original 7-count indictment announced in March 2018; the S2 indictment adds EIGHT new defendants, named explicitly by BleepingComputer as: Saeid Houshyar; Behzad Mesri (aka 'Skote Vahshat'); Manouchehr Hashemloo; Keyvan Fayaz (aka 'Achilles'/'The Joker'/'bc.monster'); Amir Barati; Saber Shahbazi Ballojeh; Arman Kahzadian; Mojtaba Galekuhi (aka 'Mojtaba Ghaleh Koui')."
      - "PERIOD COVERED: DOJ states the Mabna Institute campaign as a whole ran 'since at least 2013'; the university spearphishing campaign specifically 'started in approximately 2013, continued through at least December 2017.' The S2 indictment's NEW conduct/additional-defendant material centers on: (a) the HBO intrusion — Mesri was already separately charged in 2017 (United States v. Behzad Mesri, 17 Cr. 689) for hacking HBO and attempting to extort ~$6M in Bitcoin; the S2 indictment newly charges Houshyar, Hashemloo, Fayaz, Ballojeh and Kahzadian as also directly involved in that same HBO intrusion; and (b) intrusions into private-sector companies and at least two governmental entities via PASSWORD SPRAY attacks, credited to Galekuhi, Fayaz and Ballojeh, which DOJ says caused victims 'in excess of $20 million in costs to investigate and remediate.'"
      - "TRADECRAFT AS DOJ ITSELF DESCRIBES IT: for the university campaign — 'members of the conspiracy used stolen account credentials to obtain unauthorized access to victim professor accounts, which they used to steal research, and other academic data and documents.' DOJ's OWN press release, AS FETCHED, does NOT contain the phrase 'spearphishing → cloned login pages → valid-account reuse' as a described chain — it uses the term 'spearphishing campaign' once (targeting IRGC-directed intrusions) and separately describes 'stolen account credentials' being reused; the 'cloned login pages' framing is NOT present in the DOJ OPA text as fetched. Nextgov's corroborating description (its own words, not a DOJ quote) is: Mabna 'employed or contracted with hackers who carried out phishing attacks, searched for vulnerable systems and traded credentials for compromised accounts' — again no 'cloned login page' language. Barati's specific role per DOJ: 'tracking the progress of the spearphishing campaigns, exchanging login credentials for compromised accounts with other co-conspirators, creating targeting lists, conducting computer network reconnaissance, and crafting phishing messages.' For the private-sector/government intrusions specifically, DOJ names PASSWORD SPRAY ATTACKS as the method (Galekuhi, Fayaz, Ballojeh)."
      - "VICTIM BREAKDOWN (DOJ, S2 indictment allegations): 144 U.S.-based universities; 178 foreign universities; at least 42 U.S.-based private-sector companies; at least 11 foreign private-sector companies; at least 5 U.S. federal/state government agencies; at least 2 NGOs. University campaign targeted 100,000+ professor accounts, compromising ~8,000; U.S. universities spent >$3.4 billion to procure/access the stolen-equivalent data/IP (DOJ does not characterize this figure as the financial-loss amount). Data stolen: 'more than 31 terabytes' (elsewhere in the same release, 'at least approximately 31.5 terabytes') of academic data/IP. Named government/NGO victims: U.S. Department of Labor, Federal Energy Regulatory Commission, State of Hawaii, State of Indiana, the United Nations, UNICEF. Stolen university data was sold on two websites, Megapaper.ir and Gigapaper.ir, both linked to defendant Abdollah Karima ('Vahid Karima')."
      - "CRITICAL — EUROPEAN/SWISS VICTIM NEXUS: the DOJ's OWN FRESH (2026-08-18) press release for the S2 indictment EXPLICITLY NAMES SWITZERLAND TWICE: (1) among the countries hosting the '178 universities located in foreign countries' compromised by the spearphishing campaign — the full list given is 'Australia, Canada, China, Denmark, Finland, Germany, Ireland, Israel, Italy, Japan, Malaysia, Netherlands, Norway, Poland, Saudi Arabia, Singapore, South Korea, Spain, Sweden, Switzerland, Turkey and the United Kingdom'; and (2) among the 'at least 11 foreign companies' whose employee email accounts were compromised, listed as 'based in Germany, Italy, Switzerland, Sweden, and the United Kingdom.' IMPORTANT NUANCE: this Swiss/European footprint is a HISTORICAL fact (the underlying university spearphishing campaign ran 2013 through at least Dec 2017, and the DOJ text does not date the specific foreign-company intrusions but frames them as part of the same multi-year conspiracy) — it is NOT a new 2026 intrusion. But it IS stated directly, in-window, by DOJ's own freshly-unsealed 2026 S2-indictment press release — it is NOT merely carried over from 2018-era news coverage of the original case; neither Nextgov nor BleepingComputer (both fetched) name any specific foreign country for the 178 universities or 11 foreign companies — only the DOJ press release itself provides the country list. This is the load-bearing fact for framing Swiss/European relevance: cite the DOJ OPA release directly for it, not the 2018 predicate case."
      - "REWARDS: State Department's Rewards for Justice program is offering up to $10 million for information leading to the location of 5 named defendants: Mesri, Galekuhi, Kahzadian, Fayaz, and Ballojeh (all part of the newly-added 8) — via a Tor-based tips channel."
      - "Case assigned to U.S. District Judge Jesse M. Furman (SDNY); prosecution led by AUSAs Nicholas W. Chiuchiolo, Connie L. Dang, and Adam Sowlati, with National Security Division support; investigative credit to the FBI and assistance from the UK's National Crime Agency (NCA), OFAC and the RFJ program."
    mechanism_or_access_path: >
