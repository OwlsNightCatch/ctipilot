  # 2. LATVIA CSDD BREACH
  # ============================================================
  - item_id: latvia-csdd
    title: "Latvia's CSDD (Road Traffic Safety Directorate) confirms cyberattack exposing payment-receipt data of 1.2M individuals and 200K legal entities; supervisory board resigns"
    correction_to_brief: >
      No major correction to the brief's framing; adds precision. Note a
      minor DISCREPANCY between sources on the exact intrusion date: CERT.LV
      / CSDD's own official update (18.08.2026) states the attacker obtained
      the data "laika posmā no 2026. gada 8. līdz 10. augustam (ieskaitot)"
      — in the period from 8 to 10 August 2026 inclusive (a Sat–Mon window).
      A secondary Latvian source (news.inbox.eu, translating Tet chairman
      Uldis Tatarčuks's framing) states "The cyberattack occurred on the
      night of August 7 to 8" — one day earlier than CERT.LV/CSDD's stated
      window. Attribute the Aug 8–10 window to CERT.LV/CSDD (the more
      authoritative, first-party source); attribute the "night of Aug 7–8"
      claim specifically to news.inbox.eu's reporting, not to CERT.LV.
    sources:
      - url: "https://cert.lv/lv/2026/08/csdd-saskaries-ar-kiberdrosibas-incidentu"
        publisher: "CERT.LV (Latvia's national CERT)"
        date: "2026-08-13 (initial); updated 2026-08-18"
        role: primary
        note: "Mirrors CSDD's own two statements verbatim, dated [Informācija publicēta: 13.08.2026] and [Informācija papildināta: 18.08.2026], each sourced back to csdd.lv press releases (csdd.lv/jaunumi/csdd-saskaries-ar-kiberdrosibas-incidentu and csdd.lv/jaunumi/noslegusies-csdd-kiberincidenta-izguto-datu-analize)."
      - url: "https://therecord.media/latvia-cyberattack-vehicle-data"
        publisher: "The Record (Recorded Future News)"
        date: "2026-08-19"
        role: primary
      - url: "https://news.inbox.eu/150n4c8-why-tet-did-not-warn-csdd-about-the-cyberattack-the-company-commented-on-the-situation-for-the-first-time"
        publisher: "inbox.eu (Latvian news aggregator/portal; English machine/edited translation of a Latvian-language piece, original also cross-published at en.bb.lv)"
        date: "2026-08-19"
        role: corroborating
    confirmed_facts:
      - "INTRUSION WINDOW (CERT.LV/CSDD, 18.08 update, the authoritative figure): the attacker obtained payment-receipt data during 8–10 August 2026 inclusive; the data obtained itself covers historical payment receipts dating back to 2008 ('laika periodā no 2008. gada')."
      - "RECORD COUNTS (CERT.LV/CSDD, 18.08 update, and independently stated by The Record): 1.2 million natural persons ('1,2 miljonu fizisko personu') and 200,000 legal entities ('200 tūkstošu juridisko personu') affected. Latvia's population is just over 1.8 million (The Record) — i.e. roughly two-thirds of the population."
      - "DATA CATEGORIES TAKEN (CERT.LV/CSDD): personal ID code or company registration number; name/surname or company name; payment amount; payment date; vehicle license-plate number; address registered at the time of service (e.g. as listed on the vehicle registration certificate)."
      - "DATA CATEGORIES EXPLICITLY NOT TAKEN (CERT.LV/CSDD, 18.08 update): customer contact information — phone number and email address — was NOT affected; address information obtained is 'not complete in all cases.' The FIRST (13.08) CSDD statement additionally states customer usernames and passwords were not compromised ('Klientu lietotāju vārdi un paroles nav skarti')."
      - "DETECTION (per The Record, attributing to CSDD chief Aivars Aksenoks / inbox.eu, attributing to Aksenoks): CSDD's own IT staff discovered and stopped the intrusion themselves within several hours; the outsourced monitoring/security provider, Tet, did NOT detect the intrusion or alert CSDD, despite (per Aksenoks) the five-year CSDD–Tet contract stipulating round-the-clock infrastructure monitoring including 'some firewall and incident-monitoring functions.'"
      - "OUTSOURCED PROVIDER (Tet) — its own response, per inbox.eu quoting Tet chairman Uldis Tatarčuks: Tet says it is 'too early to draw conclusions about the causes of the incident' and that it is necessary to first establish how/when the attack occurred and which systems were affected; Tet states its contractual responsibility covers only 'certain parts of CSDD's IT infrastructure, not the agency's entire network,' and it has not disclosed further contract details. Tet confirmed it engaged two named subcontractors — Corporate Systems and Kyndryl Latvia — to help fulfill the contract, without disclosing how responsibilities were split. Per inbox.eu, citing Latvia's Electronic Procurement System, the five-year CSDD–Tet contract for servicing the state vehicle register's IT infrastructure was signed in 2022 for close to €9 million (ex VAT), increased to €9.043 million in 2025."
      - "RESIGNATIONS: per The Record, CSDD's supervisory board ('padome') submitted its resignation Wednesday morning (19 Aug), following public calls to resign from President Edgars Rinkevics and MP Andris Kulbergs; CSDD chief Aivars Aksenoks (a former Riga mayor) said Wednesday he intends to resign once he has helped complete the investigation and address the consequences. Per inbox.eu's own (differently sequenced) account: 'the board [valde] first announced its resignation, and then the CSDD council [padome] did as well' — i.e. inbox.eu frames the executive board as resigning before the supervisory council; The Record frames only the supervisory board's resignation as confirmed and the chief's as intended/pending. Treat these as two distinct, not fully reconciled, accounts of the resignation sequence and attribute each to its own source."
      - "CERT.LV's own assessment/advisory (13.08 statement by deputy head Varis Teivāns): the attack was targeted and preceded by prior preparation, and the attackers showed technical competence. CERT.LV/CSDD (18.08 update) also disclosed that CSDD faced ANOTHER attempted, targeted cyberattack over the same (third) weekend [after the 13.08 disclosure], which was blocked thanks to the security improvements already made."
      - "MECHANISM/ACCESS PATH: per The Record, citing CERT.LV's statement to Latvian public broadcaster LSM specifically (not stated in CERT.LV's own bulletin text as fetched): the hackers exploited a vulnerability in a CSDD system exposed to the internet, and several mandatory cybersecurity requirements had not been met. No CVE, product or vendor is named in any fetched source."
      - "CERT.LV's own guidance to affected individuals (from the CERT.LV bulletin itself): warns of downstream social-engineering/fraud risk using the leaked personal-ID-code + name + vehicle-plate + address + prior-payment combination to craft more convincing, personalized phishing SMS/email/calls; specifically flags risk to Smart-ID / eParaksts mobile authentication (personal ID code doubles as the eParaksts mobile user-identifier for many users) and advises never approving an authentication request the user did not themselves initiate; advises eParaksts mobile users whose 'lietotāja numurs' (user number) is their personal ID code to change it to a randomly-generated 7-digit number; advises verifying any communication independently via e.csdd.lv / official channels rather than links in messages."
      - "CSDD notified Latvia's Data State Inspectorate (Datu valsts inspekcija) and preserved all available information for that authority's assessment; day-to-day CSDD services (in-person and e-CSDD) were NOT disrupted."
    quotes:
      - quote: "laika posmā no 2026. gada 8. līdz 10. augustam (ieskaitot) kiberuzbrucējs ir ieguvis informāciju par maksājumu kvītīs ietvertiem datiem laika periodā no 2008. gada. CSDD norāda, ka ietekmēti 1,2 miljonu fizisko personu un 200 tūkstošu juridisko personu dati."
        gloss_en: "in the period from 8 to 10 August 2026 (inclusive), the cyberattacker obtained information contained in payment receipts covering the period from 2008 onward. CSDD states that 1.2 million natural persons' and 200,000 legal entities' data were affected."
        attribution: "CERT.LV, mirroring CSDD's own statement"
        source_url: "https://cert.lv/lv/2026/08/csdd-saskaries-ar-kiberdrosibas-incidentu"
      - quote: "Papildus CSDD informē, ka kiberuzbrukuma rezultātā CSDD klientu kontaktinformācija (tālruņa numurs un e-pasta adrese) nav ietekmēta, kā arī izgūtā informācija par adresi ne visos gadījumos ir pilnīga."
        gloss_en: "CSDD additionally informs that, as a result of the cyberattack, CSDD customer contact information (phone number and email address) was not affected, and the obtained address information is not complete in all cases."
        attribution: "CERT.LV, quoting CSDD IT department head Māris Puriņš"
        source_url: "https://cert.lv/lv/2026/08/csdd-saskaries-ar-kiberdrosibas-incidentu"
      - quote: "Arī šajās brīvdienās CSDD saskārās ar mērķētu kiberuzbrukumu, tomēr, pateicoties veiktajiem drošības uzlabojumiem, tas tika bloķēts"
        gloss_en: "Also this past weekend CSDD faced a targeted cyberattack, however, thanks to the security improvements made, it was blocked"
        attribution: "CERT.LV, quoting CSDD IT department head Māris Puriņš"
        source_url: "https://cert.lv/lv/2026/08/csdd-saskaries-ar-kiberdrosibas-incidentu"
      - quote: "CERT.LV later told Latvian public broadcaster LSM the hackers had exploited a vulnerability in a CSDD system exposed to the internet and that several mandatory cybersecurity requirements had not been met."
        attribution: "The Record (Recorded Future News), attributing to CERT.LV via LSM"
        source_url: "https://therecord.media/latvia-cyberattack-vehicle-data"
      - quote: "He said Tet did not detect the intrusion or alert the agency. Instead, CSDD employees discovered the attack themselves and stopped it within several hours."
        attribution: "The Record (Recorded Future News), attributing to CSDD chief Aivars Aksenoks"
        source_url: "https://therecord.media/latvia-cyberattack-vehicle-data"
      - quote: "On Wednesday morning, the agency’s supervisory board submitted its resignation."
        attribution: "The Record (Recorded Future News)"
        source_url: "https://therecord.media/latvia-cyberattack-vehicle-data"
      - quote: "Tet also confirmed that it engaged two subcontractors—Corporate Systems and Kyndryl Latvia—to fulfill the contract."
        attribution: "news.inbox.eu"
        source_url: "https://news.inbox.eu/150n4c8-why-tet-did-not-warn-csdd-about-the-cyberattack-the-company-commented-on-the-situation-for-the-first-time"
      - quote: "The cyberattack occurred on the night of August 7 to 8."
        attribution: "news.inbox.eu (its own framing — one day earlier than CERT.LV/CSDD's stated Aug 8-10 data-exfiltration window; do not merge with the CERT.LV figure)"
        source_url: "https://news.inbox.eu/150n4c8-why-tet-did-not-warn-csdd-about-the-cyberattack-the-company-commented-on-the-situation-for-the-first-time"
