  - title: "Kiteworks lifts its precautionary shutdown; BSI and NCSC-CH now name the vulnerable component as Kiteworks Advanced Forms, fixed in 9.5.1 — still no CVE"
    sources:
      - { url: "https://www.kiteworks.com/company/press-releases/kiteworks-precautionary-shutdown-advisory/", publisher: "Kiteworks", date: "2026-09-27", role: "primary" }
      - { url: "https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-3602", publisher: "BSI CERT-Bund (WID-SEC-2026-3602)", date: "2026-09-27", role: "primary" }
      - { url: "https://security-hub.ncsc.admin.ch/#/posts/12985", publisher: "NCSC Switzerland — Cyber Security Hub / GovCERT.ch", date: "2026-09-28", role: "corroborating" }
    discovery_trace: "first seen at: bsi-de, URL https://wid.cert-bund.de/content/public/securityAdvisory/rss (BSI CERT-Bund WID RSS, item WID-SEC-2026-3602 appearing in-window at 2026-09-28T11:46 GMT) → pivot: BSI CSAF detail, URL https://wid.cert-bund.de/portal/wid/securityadvisory?name=WID-SEC-2026-3602 → primary: Kiteworks press release, URL https://www.kiteworks.com/company/press-releases/kiteworks-precautionary-shutdown-advisory/ → corroborating: NCSC-CH Security Hub post 12985, URL https://security-hub.ncsc.admin.ch/#/posts/12985"
    summary: |
      Update on the 2026-09-26 entry covering Kiteworks' precautionary customer-wide shutdown advisory. Kiteworks' own press release,
      updated 2026-09-27, states the shutdown recommendation has now been lifted for all customers, all Kiteworks-hosted systems have
      been restarted and are operating normally, and the company has "no indication that Kiteworks or our customers' systems have been
      compromised" — the advisory is characterised as preventative rather than a response to a confirmed breach. Separately, Germany's
      BSI published advisory WID-SEC-2026-3602 (initial release, appearing in the BSI RSS feed on 2026-09-28) naming the specific
      vulnerable component for the first time: Kiteworks Advanced Forms versions below 9.5.1, fixed in 9.5.1, referencing the Kiteworks
      press release as its external source; the BSI record still carries no CVE identifier or vulnerability class description ("nicht
      näher spezifizierten Angriff"). NCSC Switzerland's Cyber Security Hub advisory (originally published 2026-09-25) was updated
      2026-09-28 with the same lifted-shutdown quote from Kiteworks. No CVE has been assigned to date; Kiteworks states its current
      release, 9.5.1, "has accounted for all known vulnerabilities."
