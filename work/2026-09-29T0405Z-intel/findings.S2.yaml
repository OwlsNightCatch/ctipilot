          summary: "Joint BACS/BAFU/cantonal-enforcement-body pilot using BACS's CyRA questionnaire to assess and improve cyber resilience oversight of Swiss major-accident-hazard (Störfallvorsorge) facilities (BACS, 2026-09-28)." }
