      tool over hazardous-substance/OT facilities, and because BACS states it intends to hand the CyRA-based approach to regulators for
      independent future use. Borderline against the "ships only when it changes obligations" bar — included as awareness of a maturing
      oversight mechanism cantonal administrations may soon be asked to operate themselves.
    borderline: true
    borderline_reason: "voluntary pilot, not yet a binding obligation — included for cantonal-Vollzugsstellen relevance and BACS's stated intent to operationalise it"

  - title: "Germany's BDBOS moves emergency-services digital radio (Behördenfunk/Digitalfunk BOS) from TETRA to open-standard 5G/LTE broadband by 2030, excluding high-risk vendors and flagging a satellite kill-switch risk"
    sources:
      - { url: "https://www.heise.de/news/Digitalfunk-Bund-schliesst-kritische-Anbieter-beim-Umstieg-auf-Breitband-aus-11468803.html", publisher: "Heise Online", date: "2026-09-28", role: "primary" }
    discovery_trace: "first seen at: heise-sec, URL https://www.heise.de/security/feed.xml (Heise Security RSS) → primary: Heise Online article, URL https://www.heise.de/news/Digitalfunk-Bund-schliesst-kritische-Anbieter-beim-Umstieg-auf-Breitband-aus-11468803.html (no further pivot; article cites an SZ-Dossier interview and a Bundestag document not independently fetched this run)"
    summary: |
      The new president of Germany's BDBOS (Bundesanstalt für den Digitalfunk der Behörden und Organisationen mit Sicherheitsaufgaben —
      the federal agency running the shared digital radio network for police, fire brigades and emergency medical services) confirmed
      that active network elements for the coming broadband generation of Behördenfunk (BOS emergency-services radio) will consistently
      exclude vendors from designated risk states such as China (naming Huawei), to prevent data exfiltration, undetected backdoors or
      supply-chain disruption during a crisis. By 2030 Germany plans to move from the current proprietary TETRA standard — which has
      previously suffered documented encryption weaknesses — to open international standards (ETSI/3GPP, i.e. LTE/5G), retaining the
      existing TETRA network as a fallback until at least 2040. The transition initially depends on commercial mobile networks (Deutsche
      Telekom, Vodafone, Telefónica) before a dedicated, state-controlled core network is built to the security requirements of the
      security agencies; end-to-end encryption is planned to be integrated into the 5G architecture from the ground up rather than
      bolted on as with TETRA's BSI-developed scheme. The BDBOS chief separately warned against over-reliance on commercial satellite
      services such as Starlink for supplementary comms, citing the risk that a single provider's "kill switch" could endanger the whole
      system. Germany's interior ministry continues to withhold public detail on the root cause of prior widespread Digitalfunk outages,
      citing reasons of state (Staatswohl).
    region_nexus: "Germany (DACH neighbor) — federal emergency-services communications infrastructure"
    primary_sector_nexus: "direct"
    sector: "public-sector"
    cves: []
    techniques: []
    affected_products: []
