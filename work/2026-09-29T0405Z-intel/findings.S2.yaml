items:
  - title: "NCSC-CH/BAFU pilot project validates a cyber-resilience oversight approach for Switzerland's major-accident-hazard facilities, using cantonal enforcement bodies as the delivery channel"
    sources:
      - { url: "https://www.bacs.admin.ch/de/26-stoerfallbetriebe-de", publisher: "BACS (NCSC Switzerland)", date: "2026-09-28", role: "primary" }
    discovery_trace: "first seen at: ncsc-ch-focus, URL https://www.bacs.admin.ch/de/im-fokus (Im Fokus teaser listing, resolved via the page's embedded Nuxt payload) → primary: BACS article, URL https://www.bacs.admin.ch/de/26-stoerfallbetriebe-de (no pivot needed, single-source national-authority article)"
    summary: |
      Switzerland's Federal Office for Cybersecurity (BACS/NCSC-CH), the Federal Office for the Environment (BAFU) and the cantonal
      enforcement bodies (Vollzugsstellen) responsible for major-accident-hazard oversight (Störfallvorsorge under the StFV/major-accident
      ordinance) jointly piloted a new supervisory approach for cybersecurity in "Störfallbetriebe" — facilities handling hazardous
      substances or dangerous goods where a cyberattack, technical manipulation or IT/OT malfunction could endanger the population or
      environment. The pilot used BACS's own CyRA (Cyber-Resilienz-Assessment) questionnaire in structured interviews to raise awareness
      of cyber risk, surface IT/OT dependencies of business-critical processes, identify concrete improvement measures, and gather threat
      intelligence on the sector. BACS states the approach proved practical and low-effort, and intends to further develop it so cantonal
      enforcement bodies and regulators can run it independently going forward. No new binding obligation exists yet; this is a validated
      voluntary-engagement model, not a regulatory mandate.
    region_nexus: "Switzerland — federal (BACS, BAFU) and cantonal enforcement bodies for major-accident-hazard facilities"
