    new_entities:
      - { key: "policy:germany-bdbos-digitalfunk-5g-migration-2026", type: policy, name: "Germany BDBOS Digitalfunk TETRA-to-5G/LTE broadband migration", aliases: ["Behördenfunk 5G migration", "BOS-Digitalfunk Breitband"],
          summary: "BDBOS-led plan to migrate Germany's shared police/fire/EMS digital radio network from TETRA to open-standard 5G/LTE broadband by 2030, excluding high-risk vendors and retaining TETRA as fallback until 2040 (Heise/SZ-Dossier interview with BDBOS president Christoph Hübner, 2026-09-28)." }
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: MEDIUM
    novelty: new
    evidence:
      - quote: "Für aktive Netzelemente schließe die Behörde Anbieter aus bestimmten Risiko-Staaten wie China konsequent aus"
        attribution: "Christoph Hübner, BDBOS president (via Heise/SZ-Dossier)"
        source_url: "https://www.heise.de/news/Digitalfunk-Bund-schliesst-kritische-Anbieter-beim-Umstieg-auf-Breitband-aus-11468803.html"
      - quote: "Eine zu starke Kopplung an kommerzielle US-Dienste wie Starlink berge Gefahren, da ein potenzieller „Kill Switch\" eines einzelnen Anbieters das Gesamtsystem gefährden könnte."
        attribution: "Heise Online, reporting BDBOS president's remarks"
        source_url: "https://www.heise.de/news/Digitalfunk-Bund-schliesst-kritische-Anbieter-beim-Umstieg-auf-Breitband-aus-11468803.html"
    extended_notes: |
      Transferable-lesson item for Swiss defenders: Switzerland's own emergency-services radio network (Polycom, used by cantonal/
      communal police, fire and EMS plus civil protection) is also TETRA-based. Germany's stated rationale for migrating away from
      TETRA (documented past encryption weaknesses, desire for vendor-neutral open standards, sovereignty concerns over both Chinese
      network-equipment vendors and US satellite-comms providers) is directly relevant background for any future Swiss Polycom
      modernisation discussion. Single-source this run (only Heise fetched); the article itself cites an SZ-Dossier interview and a
      Bundestag document that were not independently fetched.
    borderline: true
    borderline_reason: "Germany, not Switzerland — included as a DACH-neighbor transferable lesson directly on point for the constituency's own emergency-services (police/fire/EMS) communications infrastructure, which shares the same TETRA/Polycom technology base"

  - title: "SRG SSR discloses a 2020 cyberattack, only now confirmed to have exfiltrated contact and organisational data of about 340 current and former SRF employees"
    sources:
      - { url: "https://www.srf.ch/news/schweiz/zugriff-auf-daten-srg-von-cybervorfall-betroffen", publisher: "SRF (Schweizer Radio und Fernsehen)", date: "2026-09-28", role: "primary" }
      - { url: "https://www.kleinreport.ch/news/von-340-srf-mitarbeitenden-daten-abgeflossen-108635/", publisher: "Klein Report", date: "2026-09-29", role: "corroborating" }
    discovery_trace: "first seen at: inside-it-ch, URL https://www.inside-it.ch/rss.xml (RSS listing headline; article-detail page returned HTTP 429 both direct and via jina, matching this source's documented Vercel-challenge failure mode) → primary: SRF's own statement, URL https://www.srf.ch/news/schweiz/zugriff-auf-daten-srg-von-cybervorfall-betroffen → corroborating: Klein Report, URL https://www.kleinreport.ch/news/von-340-srf-mitarbeitenden-daten-abgeflossen-108635/"
    summary: |
      SRG SSR (the Swiss public-service broadcasting corporation operating under federal concession, whose regional unit SRF runs
      Swiss-German public radio and television) disclosed on 2026-09-28 that it identified a cyber incident in which unauthorized
      parties accessed data belonging to SRF employees. Klein Report's corroborating report states the underlying cyberattack actually
      occurred in 2020 and is only being disclosed now. The exposed dataset comprises contact and organisational data from 2020 —
      names, job functions, and business (and in some cases private) contact details — for roughly 340 current and former employees,
      almost entirely from SRF's "Information" content unit; no other SRG business or regional unit is affected. SRG states there is no
      indication that personal passwords, financial/banking data, journalistic sources, research material or communication content were
      affected, and no evidence to date that the data has been published or misused. SRG deactivated the affected access credentials,
      implemented additional security measures, notified affected individuals directly, filed a criminal complaint, and is investigating
      with internal and external specialists in coordination with the responsible authorities. No intrusion mechanism, vector or actor
      has been disclosed.
    region_nexus: "Switzerland — SRG SSR / SRF, the federally-mandated public-service broadcaster"
