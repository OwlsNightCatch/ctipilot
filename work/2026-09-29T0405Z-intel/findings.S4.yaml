  - title: "Bitget: suspected North Korea-linked actor exploited a third-party security-product flaw to obtain internal credentials, spoof wallet-approval data, and steal $388M in one of 2026's largest crypto-exchange hacks"
    sources:
      - { url: "https://www.bitget.com/academy/bitget-security-incident-what-happened-timeline-impact-response", publisher: "Bitget (vendor, official incident page)", date: "2026-09-27 (continuously updated)", role: primary }
      - { url: "https://www.trmlabs.com/resources/blog/bitget-loses-usd-3516-million-in-hot-wallet-breach-in-likely-north-korea-attack", publisher: "TRM Labs", date: "2026-09-25", role: primary }
      - { url: "https://thehackernews.com/2026/09/bitget-says-attacker-exploited-third.html", publisher: "The Hacker News", date: "2026-09-28", role: corroborating }
      - { url: "https://thehackernews.com/2026/09/bitget-says-suspected-north-korean.html", publisher: "The Hacker News", date: "2026-09-25", role: corroborating }
    discovery_trace: "first seen at: hackernews (news_corroboration source-id), URL https://feeds.feedburner.com/TheHackersNews -> https://thehackernews.com/2026/09/bitget-says-attacker-exploited-third.html -> primary: Bitget's own incident page, URL https://www.bitget.com/academy/bitget-security-incident-what-happened-timeline-impact-response -> corroborating pivot via outbound link: TRM Labs, URL https://www.trmlabs.com/resources/blog/bitget-loses-usd-3516-million-in-hot-wallet-breach-in-likely-north-korea-attack -> corroborating: earlier The Hacker News coverage, URL https://thehackernews.com/2026/09/bitget-says-suspected-north-korean.html (also links Elliptic's corroborating analysis, not independently fetched)."
    summary: |
      FACT (Bitget's own incident page, continuously updated, first published 2026-09-25 and updated through 2026-09-28/29): at 18:31 UTC on 2026-09-24, unauthorized transfers occurred from a portion of Bitget's hot and warm wallet infrastructure across 11 blockchains (Ethereum, XRP Ledger, TRON, Arbitrum, Optimism, Base, BNB Smart Chain, Avalanche, Algorand, Celestia and Zcash). Per Bitget's own investigation, "the attacker may have exploited a vulnerability in a third-party security product to potentially obtain high-level internal credentials," then used those credentials "to impersonate authorized activity and send fraudulent withdrawal commands to the wallet system," causing abnormal transfers that bypassed existing risk controls. Bitget states private-key compromise was ruled out and cold wallets were unaffected; the vulnerable third-party product's vendor was notified and the affected functionality disabled pending a fix.
      FACT: total loss is now estimated at approximately $388M (revised up from an initial ~$351.6M on-chain estimate) across 12 wallet addresses; Bitget's ~$464M User Protection Fund will cover the loss, customer account balances/deposits/trading were unaffected, and withdrawals — paused at detection — are being resumed in phases starting with BTC on 2026-09-28.
      CLAIM (Bitget CEO Gracy Chen, via multiple outlets): North Korean involvement is "very likely," based on IP addresses her team's preliminary investigation linked to VPN services associated with a North Korean hacking group.
      ASSESSMENT (TRM Labs, blockchain-forensics firm, 2026-09-25): on-chain tracing shows the wallets laundering Bitget's stolen funds overlap with wallets previously used to launder proceeds from the Bybit (2025) and AFX Bridge hacks, both attributed to the DPRK-linked TraderTraitor cluster (this store's actor:jade-sleet, aliases TraderTraitor/UNC4899/PUKCHONG); TRM states these overlaps "point toward TraderTraitor" but stops short of definitive attribution, explicitly noting "another actor carrying out the theft remains technically possible." Elliptic separately reported similar wallet-overlap findings with the 2025 Bybit hack (not independently fetched by this agent — cited within The Hacker News' corroborating coverage).
      Response: Bitget revoked and reissued internal login credentials, restructured access to highly sensitive systems, now requires multiple approvals for critical operations, engaged Mandiant and SlowMist for independent forensics, and notified law enforcement and financial-intelligence units.
    region_nexus: "global (Bitget is a major international exchange); suspected North Korea-linked actor with a documented history of targeting exchanges and financial infrastructure worldwide. No direct Swiss public-sector nexus, but of genuinely global scale/significance (one of the largest crypto thefts of 2026) and a transferable lesson for any organization granting a third-party security product high-privilege internal access."
    primary_sector_nexus: "none direct"
    sector: "financial-services"
