  - title: "ShinyHunters' FBI breach escalates: the bureau confirms the compromise, stolen data reportedly names counterintelligence-relevant staff, and a Dutch arrest surfaces an internal power struggle over the ShinyHunters brand"
    sources:
      - { url: "https://krebsonsecurity.com/2026/09/dutch-police-arrest-reformed-hacker-in-shiny-hunters-investigation/", publisher: "Krebs on Security", date: "2026-09-28", role: primary }
      - { url: "https://cyberscoop.com/fbi-data-breach-shinyhunters-agent-safety-risk/", publisher: "CyberScoop", date: "2026-09-28", role: primary }
      - { url: "https://www.bleepingcomputer.com/news/security/shinyhunters-hacks-clop-leak-site-threatens-to-extort-ransomware-gang/", publisher: "BleepingComputer", date: "2026-09-19 (updated 2026-09-21)", role: "background — outside window, cited only to explain the pre-existing ShinyHunters/Cl0p feud that the in-window reporting references" }
    discovery_trace: "first seen at: krebs (news_corroboration source-id), URL https://krebsonsecurity.com/feed/ -> primary: krebsonsecurity.com, URL https://krebsonsecurity.com/2026/09/dutch-police-arrest-reformed-hacker-in-shiny-hunters-investigation/ -> corroborating: cyberscoop (news_corroboration source-id), URL https://cyberscoop.com/feed/ -> https://cyberscoop.com/fbi-data-breach-shinyhunters-agent-safety-risk/ -> background pivot (for the Cl0p feud context, dated outside window): https://www.bleepingcomputer.com/news/security/shinyhunters-hacks-clop-leak-site-threatens-to-extort-ransomware-gang/ -> unreachable primary referenced by both in-window sources: FBI's own press release at https://www.fbi.gov/news/press-releases/fbi-statement-on-compromise-of-fbijobsgov-portal-and-alleged-impact-to-fbi-employee-pii (403 on every transport tried; logged as a fetch failure, covered_anyway via Krebs+CyberScoop quoting it directly)."
    summary: |
      This is a material update to the existing entry on ShinyHunters' claimed FBI PeopleSoft breach (2026-09-24, last updated 2026-09-27). FACT: the FBI has now issued its own press release (referenced and quoted by both Krebs and CyberScoop, 2026-09-28) confirming the compromise of the fbijobs.gov portal and "alleged impact" to FBI employee PII, and stating it is "actively and aggressively investigating" the incident, its root cause and scope — a status change from the prior "aware of claims... investigating" holding statement. The FBI still has not confirmed the exact scope, the additional zero-day ShinyHunters separately claims, or attributed the breach to ShinyHunters by name.
      CLAIM (attributed to 404 Media and Reuters, via Krebs): the stolen data includes Social Security numbers and personal information on more than 5,000 FBI officials, including job titles and team assignments (special agent, threat intake examiner, major cybercrimes unit, and personnel investigating foreign state-backed cyber threats), and — per Reuters' own review of documents ShinyHunters shared with journalists — sensitive psychiatric and medical files of FBI staff.
      ASSESSMENT (attributed, via CyberScoop): security researchers Jon DiMaggio (Arkem Cyber) and Cynthia Kaiser (former FBI official, now at Halcyon) warn the data creates counterintelligence and physical-safety exposure for agents working sensitive cases, and that data already shared as "proof samples" with journalists is irretrievably disseminated regardless of any leak-site takedown ("once data is disseminated, you can't pull it back and delete all copies").
      FACT: ShinyHunters states the FBI attack's motive is not financial — it is coercive, intended to force the FBI to retract or amend a May 2026 public service announcement (PSA260515) characterizing the group's operations, affiliations and tactics; the group specifically disputes affiliation with "The Com" cybercrime ecosystem and denies using sextortion-style threats, and set a Monday (2026-09-28) deadline for the FBI to act.
      FACT: Dutch police publicly confirmed, via a statement on X on 2026-09-28, the arrest of a 24-year-old suspect in connection with the ShinyHunters investigation. Multiple sources identify the suspect to Krebs as Pepijn van der Stap, a previously convicted cybercriminal (hacker alias "Umbreon") who had volunteered at the Dutch Institute for Vulnerability Disclosure (DIVD) and worked as offensive-security lead at a Dutch security firm; the arrest (on or around 2026-09-16) is tied to a separate investigation into a February 2026 social-engineering intrusion at Dutch telecom Odido (already tracked in this store as incident:odido-telecom-breach-netherlands-2026).
      ASSESSMENT (attributed to "multiple sources close to the investigation," via Krebs): the FBI defacement image reused van der Stap's old "Umbreon" Pokémon artwork, and sources say this — together with the group's abrupt pivot to high-risk, non-financially-motivated operations — reflects an internal leadership dispute: a Jordan-based teenage cybercriminal known as "Rey," who leads a collective calling itself "ScatteredLapsussHunters" (SLSH, described by sources as an amalgamation of Scattered Spider, LAPSUS$ and ShinyHunters), is reported to have taken effective control of the ShinyHunters brand, and sources speculate the Umbreon imagery was an attempt to pin the FBI hack on the arrested Dutch hacker. CyberScoop separately quotes DiMaggio's independent assessment that "ShinyHunters" today "operates as a criminal brand used by a fluid network" rather than a single fixed group — corroborating the brand-fragmentation picture without confirming the specific SLSH/Rey narrative.
      BACKGROUND (dated 2026-09-19/21, outside this run's window, included only to explain what "extorting Cl0p" refers to in the in-window reporting): ShinyHunters separately claims to have breached rival extortion group Cl0p's own Tor data-leak site — via what it describes as an unauthenticated file-upload vulnerability in Grav CMS — defacing it, and claiming to have stolen Cl0p's server logs, source code and the private keys to its onion service; ShinyHunters is demanding an eight-figure Bitcoin payment from Cl0p and threatening to publish records of which companies paid Cl0p ransoms, how much, and the Bitcoin addresses used. BleepingComputer independently confirmed the defacement but not the further data-theft claims.
    region_nexus: "global / US federal law enforcement and a Dutch national investigation — no direct Swiss nexus, but ShinyHunters/SLSH is a high-volume, prolific extortion actor already tracked in this store with demonstrated government-sector targeting (e.g. this store's NAIC PeopleSoft and DHS HSIN entries), making its internal structure and its data-handling risk to a national police/security service's own staff PII a directly transferable concern for any national law-enforcement or defense IT estate, including Swiss federal and cantonal police services."
