  - title: "Kaspersky GERT: PAYLOAD ransomware achieves domain-wide extortion impact with zero ransomware binary, zero file encryption and zero endpoint persistence -- entirely via a malicious Group Policy Object linked at the domain root"
    sources:
      - { url: "https://securelist.com/tr/payload-ransomware-via-group-policy/121335/", publisher: "Kaspersky Securelist (Kaspersky GERT)", date: "2026-09-21", role: "primary" }
    discovery_trace: "first seen at: kaspersky-securelist (rss), URL https://securelist.com/feed/, re-confirmed live this run -> primary: Kaspersky Securelist, URL https://securelist.com/tr/payload-ransomware-via-group-policy/121335/ (no pivot needed)"
    summary: |
      Kaspersky's Global Emergency Response Team (GERT) reconstructs an April 2026 incident at a Middle East manufacturing organization in which an attacker authenticated to a FortiGate SSL VPN using a compromised credential of unconfirmed provenance, obtained GPO-write privileges via an unconfirmed escalation path, and authored a malicious Group Policy Object named "PAYLOAD" linked at the domain root. Rather than deploying an encryptor, the GPO used only native client-side extensions: Files CSE dropped a read-only ransom note to every desktop and drive root; Registry CSE rewrote the Windows logon legal-notice banner to ransom text; the Personalization/Desktop policy set a SYSVOL-hosted ransom image as every machine's lock screen and wallpaper; and Security Settings CSE (GptTmpl.inf) disabled the local Administrator account fleet-wide, alongside a second GPO disabling Windows Firewall domain-wide. Because computer-configuration GPO settings apply only on reboot or policy refresh, the malicious policy sat cached and dormant for a full day between authoring (13 April) and mass visible impact (14 April) -- during which data exfiltration from file servers proceeded unnoticed. Forensic confirmation found no files encrypted, no malware binary resident on disk, and no endpoint persistence anywhere: a detection program keyed on ransomware executables or process behavior would have produced zero alerts until the ransom wallpaper appeared post-reboot.
    region_nexus: "Middle East manufacturing victim; technique is domain/AD-architecture-generic and directly transferable to any Windows Active Directory environment, including government AD estates"
    primary_sector_nexus: "indirect"
