  - title: "Push Security: ClickFix and its derivatives now drive 52-67% of monthly browser-based-attack detections, dominated by search-engine (not email) delivery and a rotating 20+-LOLBin execution surface"
    sources:
      - { url: "https://pushsecurity.com/blog/the-state-of-clickfix-by-detection-data", publisher: "Push Security", date: "2026-09-23", role: "primary" }
      - { url: "https://www.bacs.admin.ch/en/clickfix-en", publisher: "NCSC Switzerland / BACS", date: "2026", role: "corroborating (home-region authority warning, live)" }
    discovery_trace: "first seen at: push-security (rss), URL https://pushsecurity.com/rss.xml, re-confirmed live this run -> primary: Push Security, URL https://pushsecurity.com/blog/the-state-of-clickfix-by-detection-data -> corroboration: NCSC Switzerland/BACS live ClickFix advisory, URL https://www.bacs.admin.ch/en/clickfix-en (found via WebSearch \"NCSC-CH ClickFix Warnung 2026\")"
    summary: |
      Push Security's H2 2026 detection-data review reports ClickFix and its derivatives averaging 52% of Push's monthly browser-based-attack detections through Q2 2026, rising to 67% in August 2026 -- ahead of AiTM and device-code phishing. Three phishing kits (ERRTRAFFIC, plus two Push-internal-named kits TURNTIP and NOCHAIN) account for 73% of detections, ERRTRAFFIC alone 34% in August. Four in five 2026 ClickFix payloads were reached via search engines (Google/Bing) rather than email -- via compromised sites, malvertising and SEO poisoning -- meaning the technique largely bypasses email security controls. Push observed 84 distinct ClickFix command forms across 20+ trusted binaries (PowerShell, cmd, bash/zsh, mshta, rundll32, msiexec, pcalua, wmic, certutil, schtasks and others), a deliberate LOLBin-rotation strategy to outpace endpoint detection rules; the major kits fetch payload/lure configuration from a remote contract at load time rather than embedding it in the served page, so the page itself stays static while payloads and lures rotate freely. Push notes standard EDR baseline-and-alert-on-anomaly guidance for LOLBin monitoring suffers a high false-positive rate because legitimate IT automation, MDM tooling and admin scripts generate similar-looking telemetry.
    region_nexus: "global technique with direct home-region relevance -- NCSC Switzerland/BACS maintains a live public advisory on the exact ClickFix fake-CAPTCHA technique, reporting a rise in compromised Swiss websites (mostly WordPress) serving it"
