  - title: "Huntress: a signed Windows AppX host (WWAHost.exe) turns Microsoft's own OAuth sign-in dialog into a token-theft primitive that fully survives MFA -- no phishing page, no lookalike domain, no browser involved"
    sources:
      - { url: "https://www.huntress.com/blog/stealing-oauth-tokens-through-microsofts-front-door", publisher: "Huntress", date: "2026-09-23", role: "primary" }
    discovery_trace: "first seen at: huntress (rss), URL https://www.huntress.com/blog/rss.xml, re-confirmed live this run -> primary: Huntress, URL https://www.huntress.com/blog/stealing-oauth-tokens-through-microsofts-front-door (no pivot needed)"
    summary: |
      A Huntress researcher found that WWAHost.exe (Windows Web App Host), a Microsoft-signed binary that renders web content for AppX packages, grants any JavaScript it loads full Windows Runtime API access -- including the legacy WebAuthenticationBroker OAuth handler -- when the package manifest's ContentUriRules declares WindowsRuntimeAccess="all". Any standard user can sideload such a package via `Add-AppxPackage -Register` provided Developer Mode is enabled (or the enterprise AllowAllTrustedApps sideloading policy is set) -- the sole prerequisite, with no further admin rights, no UAC prompt, no SmartScreen check and no code-signing requirement once set (registration otherwise fails closed with error 0x80073CFF, which names both gating conditions in its error text). The PoC calls WebAuthenticationBroker.authenticateAsync() using Microsoft Office's own first-party client ID (d590ed36-52b3-4102-aeff-aad2292ab01c) and the urn:ietf:wg:oauth:2.0:oob redirect URI, which routes the resulting authorization code directly to the attacker's JavaScript instead of a browser; the user sees and completes a completely genuine login.microsoftonline.com dialog including real MFA, rendered inside the trusted signed process with no address bar or other indicator of compromise. Tested end-to-end against a live Entra ID tenant with MFA enabled and default security configuration, the captured access and refresh tokens carried Office's full delegated scope set (including Chat/Channel/Calendar/Contacts Graph scopes and AuditLog.Create); absent revocation, the refresh token lets the attacker silently mint new access tokens from any location for the token's lifetime, fully surviving the MFA the user just completed.
    region_nexus: "global technique; relevant to any organization managing developer/CI machines or any sideloading-policy exception in its device fleet, including government development and DevOps environments"
    primary_sector_nexus: "indirect"
    sector: "public-sector"
    cves: []
    techniques: [T1550.001, T1528, T1218, T1078.004]
    affected_products: ["Microsoft Windows (WWAHost.exe / AppX sideloading)", "Microsoft Entra ID"]
    entity_keys: []
    new_entities: []
    relation_suggestions: []
    verification: SINGLE-SOURCE-OTHER
    confidence: HIGH
    novelty: new
    evidence:
      - quote: "declare WindowsRuntimeAccess=\"all\" and the remote JavaScript it renders doesn't just run, it inherits the full Windows Runtime API surface, including the API that drives OAuth sign-in"
        attribution: "Huntress"
        source_url: "https://www.huntress.com/blog/stealing-oauth-tokens-through-microsofts-front-door"
      - quote: "Developer Mode must be enabled. This is the primary prerequisite and the main constraint on this attack. Without it, Add-AppxPackage -Register fails immediately with 0x80073CFF."
        attribution: "Huntress"
        source_url: "https://www.huntress.com/blog/stealing-oauth-tokens-through-microsofts-front-door"
      - quote: "The tokens arrive with the scope set of Microsoft Office. The refresh token persists until it is revoked... Absent one of those, the attacker can silently generate new access tokens from any location for the lifetime of the token."
        attribution: "Huntress"
        source_url: "https://www.huntress.com/blog/stealing-oauth-tokens-through-microsofts-front-door"
    extended_notes: |
      Recovered from the 2026-09-27 audit's G3 sweep, re-verified live this run by re-fetching the full article. Hardening lever the researcher names: disable Developer Mode fleet-wide via GPO and scope any enterprise sideloading-policy exception away from AllowAllTrustedApps -- both prerequisite paths close with that single change. Single-sourced to the discovering researcher's own vendor write-up (Admiralty B); no second independent source exists yet for this specific finding since it was disclosed by only one researcher.
    borderline: false

