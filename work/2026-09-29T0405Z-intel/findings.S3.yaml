    discovery_trace: "first seen at: malware-news (rss), URL https://malware.news/latest.rss -> primary: Nextgov/FCW, URL https://www.nextgov.com/cybersecurity/2026/09/shinyhunters-says-it-wont-publish-fbi-data/416280/ (no further pivot needed; Krebs link followed from within that article)"
    summary: |
      ShinyHunters (UNC6240) told Nextgov/FCW on 2026-09-28 that it will not publish the FBI employee data it claims to have stolen, calling its earlier week's demand -- that the FBI retract a May advisory describing the group's extortion tactics -- a "marketing campaign," while declining to say whether the data has been deleted. This is a material development on the already-tracked ShinyHunters Oracle PeopleSoft campaign (entry 2026-06-11, last updated 2026-09-27 to reflect UNC6240's resumed mass exploitation of CVE-2026-35273 and expanded government-sector targeting): ShinyHunters told 404 Media it used a previously unknown (unconfirmed, not independently verified) PeopleSoft flaw to gain initial access before reaching servers inside the FBI's Amazon Web Services GovCloud environment -- a considerably higher-sensitivity target class than the group's prior education-sector PeopleSoft victims. Reuters and the BBC separately reported the stolen sample includes psychiatric/medical evaluations and blood/urine test results for FBI personnel, and Nextgov's own review of a ~5,000-entry sample found employee data tied to counter-Russia, counter-China, Hezbollah and cartel intelligence work, plus personnel from the Bureau's Remote Operations Unit (which builds computer/network-intrusion tools) -- a direct counterintelligence-exposure risk. Separately, Google/Mandiant confirmed (per the same article) that ShinyHunters/UNC6240 has resumed widespread PeopleSoft exploitation using WAF-rule-evading request modifications, consistent with the URL-encoded bypass and new SIDEEYE backdoor already covered in this entry's most recent changelog. Krebs on Security additionally reported that Dutch police arrested a suspected ShinyHunters associate earlier in the month, preceding the group's FBI-intrusion claim.
    region_nexus: "US federal law-enforcement target (FBI); directly transferable concern for any government agency running Oracle PeopleSoft, and a reminder that GovCloud/high-sensitivity-tenant hosting is not itself a barrier to this actor"
