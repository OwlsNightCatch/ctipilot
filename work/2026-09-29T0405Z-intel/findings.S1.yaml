items:
  - title: "watchTowr's root-cause writeup on Citrix NetScaler CVE-2026-88771 reveals the pre-auth command injection lives in a log-parsing crash-monitor script, not the usual nsppe binary, and ships a public detection/PoC tool"
    novelty: "update-of:2026-09-28/cve-2026-88771-citrix-netscaler-preauth-rce-zero-day-kev"
    sources:
      - { url: "https://labs.watchtowr.com/oh-look-the-foot-gun-went-off-again-citrix-netscaler-preauth-command-injection-cve-2026-88771/", publisher: "watchTowr Labs", date: "2026-09-28", role: "primary" }
      - { url: "https://security-hub.ncsc.admin.ch/#/posts/13005", publisher: "NCSC Switzerland CSH", date: "2026-09-28", role: "corroborating" }
      - { url: "https://www.ncsc.gov.uk/news/exploitation-of-vulnerabilities-affecting-citrix-netscaler-adc-and-citrix-netscaler-gateway", publisher: "NCSC UK", date: "2026-09-28", role: "corroborating" }
      - { url: "https://cert.europa.eu/publications/security-advisories/2026-014/", publisher: "CERT-EU", date: "2026-09-27", role: "corroborating" }
      - { url: "https://www.cert.ssi.gouv.fr/avis/CERTFR-2026-AVI-1235/", publisher: "CERT-FR (ANSSI)", date: "2026-09-28", role: "corroborating" }
    discovery_trace: "first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/13005 → cited watchTowr technical analysis link → primary: watchTowr Labs, URL https://labs.watchtowr.com/oh-look-the-foot-gun-went-off-again-citrix-netscaler-preauth-command-injection-cve-2026-88771/ ; corroborated via NCSC-NL feed URL https://advisories.ncsc.nl/rss/advisories (NCSC-2026-0394), NCSC-UK feed URL https://www.ncsc.gov.uk/api/1/services/v1/all-rss-feed.xml, CERT-EU feed URL https://cert.europa.eu/publications/security-advisories-rss, and CERT-FR feed URL https://www.cert.ssi.gouv.fr/avis/feed/"
    summary: |
      watchTowr Labs published a full root-cause analysis of CVE-2026-88771 on 2026-09-28, one day after Citrix's CTX697096
      bulletin, that materially changes what defenders should hunt for. The vulnerable component is NOT the nsppe packet
      engine binary that has carried most historical NetScaler CVEs — it is ns_monuploadd_err.pl, a Perl script that
      periodically (a cron-style job, up to a 24-hour delay, or force-triggerable via
      `/netscaler/ns_monuploadd_err.pl -WR`) scans NetScaler system logs for Pitboss "PPE unexpectedly died" crash
      messages to recover a core-dump filename. The pre-patch script extracted the filename with an unsanitized
      grep|sed|awk shell pipeline and then re-interpolated that attacker-influenced string, unsanitized, into a second
      Perl backtick command (`find $OFF_DIR/var/core -name ${WR_PPE_COREFILE_NAME}* -print | tail -1`) — a two-stage
      log-poisoning-to-shell-command-injection chain that executes as root, because "pretty much everything on a Citrix
      NetScaler runs as root" (watchTowr).
      The trigger is pre-authentication and not limited to a single endpoint: watchTowr demonstrates it via the
      username field of the SSLVPN/AAA login form (POST /nf/auth/doAuthentication.do, login=<crafted Pitboss-style
      string with a shell command substitution>), but states "any endpoint or port that logs data controlled in an HTTP
      header can trigger this" — failed logins, rate-limited requests, arbitrary request parameters and User-Agent
      headers can all poison the log that the monitor script later parses.
      Citrix's fix (in 14.1-73.37 / 13.1-64.23 and later) replaces the unsafe pipeline with a strict regex capture
      (`qr/pitboss.*(NSPPE-\d{2})\s*\((\d+)\).*(missed too many heartbeats|unexpectedly died)/`) that only accepts a
      well-formed PPE name and numeric PID, executes `find` via Perl's list form (no shell interpolation), and validates
      the resulting path against an allowlist regex before it is used in any later backtick command.
      watchTowr also clarifies exploitation-status granularity across the eight-CVE bulletin: only CVE-2026-88771
      (this command injection) and CVE-2026-88772 (a DTLS-reachable memory overflow, VPN vServer default) are confirmed
      exploited in the wild; CVE-2026-88773 (HTTP request smuggling, CVSS4 9.3) and CVE-2026-88774 through -88778
      (memory overflows and a predictable-ISN issue, CVSS4 7.0–8.8) are patched but not reported exploited. watchTowr has
      published a detection-artefact/PoC tool on GitHub and criticizes Citrix for not proactively notifying customers
      directly — national CERTs (NCSC-UK, published 2026-09-28; CERT-FR CERTFR-2026-AVI-1235, 2026-09-28) and CERT-EU
      (2026-09-27) all independently confirmed active exploitation and urged compromise assessment, adding to the
      NCSC-CH advisory already covered.
    region_nexus: "global; NetScaler ADC/Gateway is widely deployed as VPN/remote-access front door across Swiss and EU public-sector networks"
    primary_sector_nexus: "direct"
    sector: "public-sector"
    cves: ["CVE-2026-88771", "CVE-2026-88772", "CVE-2026-88773", "CVE-2026-88774", "CVE-2026-88775", "CVE-2026-88776", "CVE-2026-88777", "CVE-2026-88778"]
    techniques: ["T1190", "T1059.004", "T1005"]
    affected_products: ["Citrix NetScaler ADC", "Citrix NetScaler Gateway"]
    entity_keys: ["product:citrix-netscaler"]
    new_entities: []
    relation_suggestions: []
    verification: MULTI-SOURCE
    confidence: HIGH
    evidence:
      - quote: "The Command Injection happens in the next line, when Perl interpolates that string into another backtick command"
        attribution: "watchTowr Labs"
        source_url: "https://labs.watchtowr.com/oh-look-the-foot-gun-went-off-again-citrix-netscaler-preauth-command-injection-cve-2026-88771/"
      - quote: "It is worth mentioning that this is not limited to a single endpoint. Any endpoint or port that logs data controlled in an HTTP header can trigger this vulnerability."
        attribution: "watchTowr Labs"
        source_url: "https://labs.watchtowr.com/oh-look-the-foot-gun-went-off-again-citrix-netscaler-preauth-command-injection-cve-2026-88771/"
      - quote: "CVE-2026-88773 | HTTP request smuggling (inconsistent interpretation of HTTP requests). Depends on specific configurations. | 9.3 Critical | Not reported"
        attribution: "watchTowr Labs"
        source_url: "https://labs.watchtowr.com/oh-look-the-foot-gun-went-off-again-citrix-netscaler-preauth-command-injection-cve-2026-88771/"
    extended_notes: |
      Detection concept (telemetry class first, platform anchor second): monitor NetScaler AAA/authentication and web-
      access logs for authentication-field or header values containing shell metacharacters (`;`, backticks, `` ` ``)
      combined with Pitboss-style substrings ("PPE", "unexpectedly died", "NSPPE") in fields that should only ever carry
      a username/credential — this is the log-poisoning precursor, observable before the delayed-trigger command
      executes. Forensic triage: unexpected root-owned files under /var/tmp or /var/core with anomalous names/timestamps
      on NetScaler appliances (CISA's KEV entry already directs forensic triage per BOD 26-04). Benign lookalike: crash-
      monitor scripts on NetScaler legitimately process real Pitboss core-dump messages with names matching
      `NSPPE-\d{2}-\d+`; any deviating characters (semicolons, backticks, redirection) in that specific log field are
      the discriminator watchTowr's own patch diff describes.
      Hardening: apply Citrix's fixed builds; because the trigger depends on log content rather than a single reachable
      endpoint, endpoint/ACL mitigations (restricting AAA login exposure) reduce but do not eliminate the log-poisoning
      surface — full patching is the only complete fix. CTX697096 also flags patching alone may not remove attacker
      access gained pre-patch; preserve forensic evidence before upgrading (per NCSC-CH CSH post 13005).

  - title: "Oracle's September 2026 CSPU broadens beyond Fusion Middleware: eight further unauthenticated CVSS 9.8 flaws confirmed across E-Business Suite, Business Intelligence, Enterprise Manager and Communications — no exploitation reported"
    novelty: "update-of:2026-09-20/oracle-september-2026-cspu-five-unauthenticated-cvss-10"
    sources:
      - { url: "https://www.oracle.com/security-alerts/cspusep2026.html", publisher: "Oracle", date: "2026-09-10", role: "primary" }
    discovery_trace: "first seen at: coverage-backlog re-check (state/coverage_backlog.md), directly re-fetched Oracle's own risk-matrix page → primary: Oracle, URL https://www.oracle.com/security-alerts/cspusep2026.html (no pivot needed)"
    summary: |
      Re-fetching Oracle's own September 2026 Critical Security Patch Update (CSPU) risk-matrix page — the same
      release the existing entry covers for six unauthenticated CVSS 10.0 Fusion Middleware flaws — confirms eight
      further unauthenticated, network-exploitable CVSS 9.8 flaws (Privileges Required: None, User Interaction: None,
      Attack Vector: Network) across four additional product families that the existing entry does not name:
      Oracle E-Business Suite (159 new patches, 19 remotely exploitable without authentication) carries three:
      CVE-2026-83327 (Oracle Applications Framework / Personalization, reachable via SOAP, versions 12.2.3-12.2.15),
      CVE-2026-83452 (Oracle Document Management and Collaboration / Internal Operations, HTTP, 12.2.3-12.2.15), and
      CVE-2026-83462 (Oracle Mobile Application Server / MWA Terminal Server, TCP, 12.2.3-12.2.15).
      Oracle Analytics (50 new patches, 8 remotely exploitable without authentication) carries CVE-2026-83283 (Oracle
      Business Intelligence Enterprise Edition / Platform Security, HTTP, version 12.2.1.4.0).
      Oracle Enterprise Manager carries CVE-2026-41635 (Enterprise Manager Base Platform / Agent Next Gen — Apache
      Mina, HTTP, versions 13.5/24.1; the same patch also addresses CVE-2026-41409 and CVE-2026-42779) and
      CVE-2026-83355 (Enterprise Manager for Fusion Middleware / Metrics, HTTP, versions 13.5/24.1).
      Oracle Communications (31 new patches, 23 remotely exploitable without authentication) carries CVE-2026-44024
      (Unified Assurance / Core-Fluentd, HTTP, versions 6.1.1-7.0.0; patch also addresses CVE-2026-44025, CVE-2026-44160
      and CVE-2026-44161) and CVE-2026-17544 (Unified Assurance / Core-PHP, HTTP, version 7.0.0).
      Oracle's advisory carries no exploitation claim for any of these eight, none appear in the CISA KEV catalog
      (checked against the catalog version 2026.09.27, most recent addition 2026-09-27), and a targeted search found
      no independent exploitation reporting. Given E-Business Suite's history as Cl0p's mass-exploitation target in
      2025, the three new EBS pre-auth CVSS 9.8 flaws (Applications Framework Personalization, Document Management,
      Mobile Application Server) are the highest-priority patch items in this broadened set for any organization
      running EBS 12.2.3-12.2.15, even absent confirmed exploitation.
    region_nexus: "global; Oracle E-Business Suite and Enterprise Manager are common in Swiss public-sector ERP/IT-management estates"
    primary_sector_nexus: "indirect"
    sector: "public-sector"
    cves: ["CVE-2026-83327", "CVE-2026-83452", "CVE-2026-83462", "CVE-2026-83283", "CVE-2026-41635", "CVE-2026-83355", "CVE-2026-44024", "CVE-2026-17544"]
    techniques: ["T1190"]
