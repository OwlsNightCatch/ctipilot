    discovery_trace: "first seen at: ncsc-ch-security-hub, URL https://security-hub.ncsc.admin.ch/#/posts/12985 → primary: Kiteworks, URL https://www.kiteworks.com/company/press-releases/kiteworks-precautionary-shutdown-advisory/"
    summary: |
      Kiteworks updated its own press release on 2026-09-27 to state: "As of September 27th, the shutdown
      recommendation is now lifted for all customers. If you have not already restarted, you may bring your Kiteworks
      system back online... All systems Kiteworks hosts on customers' behalf have been brought back up and are
      operating normally." The company reiterates it has "no indication that Kiteworks or our customers' systems have
      been compromised," calling the advisory "preventative rather than a response to a confirmed breach," and states
      current release 9.5.1 "has accounted for all known vulnerabilities." No CVE was ever assigned to the underlying
      threat-intelligence tip. Subsidiaries Zivver, DRACOON, totemo, ownCloud, WAMNET, Maytech, Bonfy.ai and
      123FormBuilder were never in scope of the shutdown advisory.
