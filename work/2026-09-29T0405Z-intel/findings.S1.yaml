      - { key: "product:oracle-business-intelligence-enterprise-edition", type: product, name: "Oracle Business Intelligence Enterprise Edition", aliases: ["OBIEE", "Oracle Analytics"], summary: "Oracle's BI platform; carried an unauthenticated CVSS 9.8 flaw (CVE-2026-83283) in the September 2026 CSPU risk matrix (Oracle, 2026-09-10)." }
      - { key: "product:oracle-communications-unified-assurance", type: product, name: "Oracle Communications Unified Assurance", aliases: [], summary: "Oracle's telco-assurance platform; carried multiple unauthenticated CVSS 9+ third-party-component CVEs (CVE-2026-44024, CVE-2026-17544, others) in the September 2026 CSPU (Oracle, 2026-09-10)." }
