    confidence: HIGH
    evidence:
      - quote: "This Critical Security Patch Update contains 159 new security patches for Oracle E-Business Suite.  19 of these vulnerabilities may be remotely exploitable without authentication"
        attribution: "Oracle"
        source_url: "https://www.oracle.com/security-alerts/cspusep2026.html"
      - quote: "CVE-2026-83327 | Oracle Applications Framework | Personalization | SOAP | Yes | 9.8 | Network | Low | None | None"
        attribution: "Oracle"
        source_url: "https://www.oracle.com/security-alerts/cspusep2026.html"
    extended_notes: |
      This item resolves an open coverage-backlog row (state/coverage_backlog.md) asking for exactly this
      re-verification. Single-source is Oracle's own CPU/CSPU risk-matrix page (a vendor PSIRT primary for its own
      product, acceptable single-source per the carve-out policy for the vendor's own advisory); no independent
      exploitation reporting was found despite a targeted search, and the CISA KEV catalog (fetched fresh this run,
      catalogVersion 2026.09.27) does not list any of the eight CVEs. Recommend the main agent fold this into the
      existing entry as an `update` record broadening its scope and CVE list, not a new entry, per the CVE-overlap
      dedup rule.
    borderline: true
    borderline_reason: "no confirmed exploitation for any of the 8 CVEs; inclusion is justified mainly by explicit backlog-duty verification and E-Business Suite's history as a mass-exploitation target, not by fresh in-window disclosure (Oracle's advisory itself is dated 2026-09-10/09-15, outside the 26h window)."

  - title: "Kiteworks lifts its precautionary global shutdown advisory; no compromise found, current release already covers all known vulnerabilities"
    novelty: "update-of:2026-09-26/kiteworks-precautionary-shutdown-imminent-zero-day-warning"
    sources:
      - { url: "https://www.kiteworks.com/company/press-releases/kiteworks-precautionary-shutdown-advisory/", publisher: "Kiteworks", date: "2026-09-27", role: "primary" }
