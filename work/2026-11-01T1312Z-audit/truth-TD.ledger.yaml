    kind: record-summary
    text: "Rapid7 reported on 2026-10-13 that it reproduced arbitrary code execution on GitLab CE 19.4.1, published a proof of concept, and found no confirmed exploitation in the wild. The demonstrated path needs push access to a public project and then an unauthenticated CI lint request, so instances with open sign-up or public projects that untrusted users can write to are the exposed case."
