    kind: cited
    text: "CVE-2026-59309 (CVSS 9.8) is an authentication bypass in the VMware Directory Service, and Broadcom's own attack-vector text is unambiguous about the prerequisite: \"a malicious actor with network access to vCenter may exploit this issue to bypass authentication and gain unauthorized access to the system\" ("
    urls: ["https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/SecurityAdvisories/0/38017"]
  - claim_id: 2a30e27781
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "body"
    kind: cited
    text: "CVE-2026-59310, also CVSS 9.8, is a directory-traversal flaw in vCenter's Syslog server that reaches arbitrary code execution through manipulated file and directory paths ("
    urls: ["https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/SecurityAdvisories/0/38017"]
  - claim_id: 24aef85a40
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "body"
    kind: cited
    text: "Non VMXNET3 virtual adapters are not affected by this issue\" ("
    urls: ["https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/SecurityAdvisories/0/38017"]
  - claim_id: 2ba3cc2da8
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "body"
    kind: cited
    text: "CVE-2026-41703 is an out-of-bounds read that Broadcom scores differently by product: 7.6 on ESX, where it says a denial of service of the host process is the more likely outcome than information disclosure, against 2.7 on Workstation and Fusion, where it restricts the impact to information disclosure ("
    urls: ["https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/SecurityAdvisories/0/38017"]
  - claim_id: 0ee127bc9a
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "body"
    kind: cited
    text: "CVE-2026-41709 is insufficient logging on ESX that allows an administrator to act without the action being recorded ("
    urls: ["https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/SecurityAdvisories/0/38017"]
  - claim_id: beac9f4660
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "body"
    kind: cited
    text: "Two product families beyond the obvious ones are in scope and are easy to miss on a first read of the advisory: Broadcom lists VMware Telco Cloud Platform and VMware Telco Cloud Infrastructure as impacted, with their own knowledge-base fix path rather than the vCenter and ESXi build numbers below ("
    urls: ["https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/SecurityAdvisories/0/38017"]
  - claim_id: 58c5787f25
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "body"
    kind: cited
    text: "Fixed builds differ per flaw and per track. vCenter takes 9.1.0.0300, 9.0.2.0100 or 8.0 U3k, with Cloud Foundation 5.x served by an async patch to 8.0 U3k; the VMXNET3 escape is fixed in ESXi-9.1.0.0200, ESXi-9.0.2.0100 and ESXi80U3k ("
    urls: ["https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/SecurityAdvisories/0/38017"]
  - claim_id: 72f267ef6b
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "body"
    kind: cited
    text: "Broadcom states the vulnerabilities \"were privately reported to Broadcom\" and credits Atredis Partners, Nguyen Hoang Thach of STARLabs SG working with Pwn2Own held by the Zero Day Initiative, an independent researcher, and CrowdStrike ("
    urls: ["https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/SecurityAdvisories/0/38017"]
  - claim_id: d7d2ea8851
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "body"
    kind: cited
    text: "On hardening, NCSC-NL is the source that spells out the architectural control: access to ESX and vCenter should be made available only from a separated management environment and not reachable directly from the internet or external networks ("
    urls: ["https://advisories.ncsc.nl/advisory?id=NCSC-2026-0269"]
  - claim_id: a421c67bd7
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "body"
    kind: uncited
    text: "Two of the five sit on vCenter and need no credentials."
  - claim_id: 1e9d8f0768
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "body"
    kind: uncited
    text: "CVE-2026-59310 has since been exploited in the wild, as the updates below record."
  - claim_id: d5cf036381
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "body"
    kind: uncited
    text: "The third flaw crosses the isolation boundary in the other direction."
  - claim_id: 51b8f71a51
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "body"
    kind: uncited
    text: "CVE-2026-47876 (CVSS 9.3) is an out-of-bounds write in the VMXNET3 virtual network adapter, and Broadcom scopes it precisely: \"a malicious actor with local administrative privileges on a virtual machine with VMXNET3 virtual network adapter may exploit this issue to execute code on the host."
  - claim_id: 81866fb35b
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "body"
    kind: uncited
    text: "That precondition is the useful part of the triage: exposure is determined by adapter configuration rather than by ESX version alone, so the inventory question is which guests run VMXNET3 and how much you trust whoever administers them."
  - claim_id: acb30a3a1f
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "body"
    kind: uncited
    text: "Two lower-severity issues complete the advisory."
  - claim_id: 3526136df4
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "body"
    kind: uncited
    text: "Any telco operator running those stacks needs to follow that path rather than assuming the vSphere builds cover them."
  - claim_id: 35fa8a8b78
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "body"
    kind: uncited
    text: "Broadcom records no workaround for any of the five, which removes the usual option of mitigating while the maintenance window is arranged."
  - claim_id: 2184c91884
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "body"
    kind: uncited
    text: "At first publication nothing here was reported exploited."
  - claim_id: 54002f8dd6
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "body"
    kind: uncited
    text: "What earned this out-of-cycle attention at publication was the reachability profile rather than an exploitation signal: two anonymous network paths into a virtualization control plane, with no interim control available."
  - claim_id: 7ef52e4e63
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "body"
    kind: uncited
    text: "CVE-2026-59310 and CVE-2026-41709 have since been reported exploited, as the updates below record."
  - claim_id: 83cbb945bb
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "body"
    kind: uncited
    text: "Detection on the vCenter side means watching the two named services rather than the appliance generally: authentication events from the Directory Service, where a successful bind that no operator session accounts for is the signal, and Syslog-server request logging, where path-traversal sequences in a requested file or directory path have no legitimate counterpart."
  - claim_id: 4ff93b3521
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "body"
    kind: uncited
    text: "For the guest-to-host escape the telemetry is host-side — hypervisor crash and process-fault records on ESX hosts running VMXNET3 guests, since a failed escape attempt is far more likely to surface as an anomalous fault than as a clean compromise."
  - claim_id: b870829cb4
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "body"
    kind: uncited
    text: "Broadcom's own advisory offers no hardening section and records \"Workarounds: None\" against every one of the five."
  - claim_id: 97265ce1fd
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "section 2026-08-13T04:58:00Z"
    kind: cited
    text: "QUIRSO, a German security firm, reports that an incident-response engagement gave it visibility into an exploitation campaign against internet-accessible vCenter systems using CVE-2026-59310, the CVSS 9.8 directory traversal in the vCenter Syslog server that reaches arbitrary code execution from network access alone ("
    urls: ["https://medium.com/@quirso_de/active-exploitation-of-cve-2026-59310-361-victim-ips-across-47-countries-9783187cc6ff"]
  - claim_id: e01e41906d
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "section 2026-08-13T04:58:00Z"
    kind: cited
    text: "The timeline is the part that should reset patch priorities: \"Compromised systems identified by QUIRSO were found to first establish contact with the attacker's domains on August 3, five days after Broadcom publicly disclosed the flaw\" ("
    urls: ["https://thehackernews.com/2026/08/attackers-exploit-vmware-vcenter.html"]
  - claim_id: b2ea62d1ef
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "section 2026-08-13T04:58:00Z"
    kind: cited
    text: "By 5 August, 343 of the 361 addresses had already appeared — the campaign reached roughly 95 per cent of its observed footprint within three days of starting ("
    urls: ["https://medium.com/@quirso_de/active-exploitation-of-cve-2026-59310-361-victim-ips-across-47-countries-9783187cc6ff"]
  - claim_id: 0d79a9f8f9
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "section 2026-08-13T04:58:00Z"
    kind: cited
    text: "Switzerland's NCSC updated its own VMSA-2026-0006 advisory on 12 August, setting \"Current exploitation status: **Actively Exploited**\" and citing QUIRSO's report ("
    urls: ["https://security-hub.ncsc.admin.ch/#/posts/12814"]
  - claim_id: e6816a1a0c
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "section 2026-08-13T04:58:00Z"
    kind: cited
    text: "The chain reported is path-traversal activity consistent with the flaw, \"followed by the deployment of a malicious cron job to establish persistence on the host using reverse_ssh\" ("
    urls: ["https://thehackernews.com/2026/08/attackers-exploit-vmware-vcenter.html"]
  - claim_id: 01143bc05e
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "section 2026-08-13T04:58:00Z"
    kind: cited
    text: "The choice is a deliberate one about direction of travel: the control channel is established outbound from the appliance, which sidesteps controls built to stop unsolicited inbound access ("
    urls: ["https://medium.com/@quirso_de/active-exploitation-of-cve-2026-59310-361-victim-ips-across-47-countries-9783187cc6ff"]
  - claim_id: 688e2a8260
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "section 2026-08-13T04:58:00Z"
    kind: cited
    text: "QUIRSO's co-founder Denis Szadkowski told the outlet there is not enough evidence to correlate that scanning with the intrusion set behind CVE-2026-59310, adding that \"the forensic evidence strongly points toward CVE-2026-59310 as the initial access vector\" for the compromises QUIRSO investigated ("
    urls: ["https://thehackernews.com/2026/08/attackers-exploit-vmware-vcenter.html"]
  - claim_id: 9da4fd97ef
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "section 2026-08-13T04:58:00Z"
    kind: uncited
    text: "The entry on Broadcom's VMSA-2026-0006 recorded five vCenter, ESX, Workstation and Fusion flaws, noted that none was reported exploited and that all had been reported privately to Broadcom."
  - claim_id: 40b1bfc170
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "section 2026-08-13T04:58:00Z"
    kind: uncited
    text: "One of them has now been confirmed in use against real estates."
  - claim_id: 5c7c504bfc
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "section 2026-08-13T04:58:00Z"
    kind: uncited
    text: "QUIRSO records 361 unique victim IP addresses across 47 countries, with Germany, the United States, Turkey, Iran and France the most affected and 185 of the 361 addresses in those five countries; it is explicit that an address does not correspond to an organisation, since some belong to hosting providers and shared infrastructure."
  - claim_id: 3517c7f848
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "section 2026-08-13T04:58:00Z"
    kind: uncited
    text: "QUIRSO assesses that while the attacker might have had prior knowledge of the flaw, the correlation with disclosure suggests the advisory itself was the campaign's starting point."
  - claim_id: 357e5a31ef
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "section 2026-08-13T04:58:00Z"
    kind: uncited
    text: "QUIRSO says a follow-up publication examining the attacker's tradecraft, infrastructure and post-exploitation activity is planned, and that further detection content is being released in coordination with law-enforcement partners."
  - claim_id: b8432afa52
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "section 2026-08-13T04:58:00Z"
    kind: uncited
    text: "A second, separate signal sits alongside it and should not be merged with the first."
  - claim_id: e79a4c533c
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "section 2026-08-13T04:58:00Z"
    kind: uncited
    text: "The Hacker News reports Defused Cyber observing a spike in scanning against vCenter — version probes and walks of the single-sign-on flow — that it associates with CVE-2026-59309, the unauthenticated Directory Service authentication bypass from the same advisory."
  - claim_id: 39b2015fb1
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "section 2026-08-13T04:58:00Z"
    kind: uncited
    text: "Two flaws in one advisory are drawing attention independently; only one has confirmed compromises behind it."
  - claim_id: 64345ee38d
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "section 2026-08-13T04:58:00Z"
    kind: uncited
    text: "**Detection concepts, telemetry class first.** The behaviours worth hunting are all unusual for a management appliance rather than unusual in general."
  - claim_id: 4510bbdb12
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "section 2026-08-13T04:58:00Z"
    kind: uncited
    text: "In egress and flow records, an SSH-protocol session initiated *from* a vCenter appliance to an external destination inverts the normal direction of vCenter traffic, which is inbound administrative access and outbound management of hosts."
  - claim_id: de2f307495
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "section 2026-08-13T04:58:00Z"
    kind: uncited
    text: "In configuration and scheduling state on the appliance, cron or scheduled entries that no platform-engineering change record accounts for are the persistence artefact reported here."
  - claim_id: fa91917329
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "section 2026-08-13T04:58:00Z"
    kind: uncited
    text: "In process telemetry, execution lineage descending from the Syslog service is the exploitation artefact."
  - claim_id: d618f68643
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "section 2026-08-13T04:58:00Z"
    kind: derived
    text: "**Triage:** administrators do legitimately place scheduled jobs on appliances and do run SSH from jump hosts, so neither artefact alone resolves."
  - claim_id: aa3fb1e0b6
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "section 2026-08-13T04:58:00Z"
    kind: derived
    text: "What separates this activity is the appliance being the SSH *client* toward an external network, a scheduled entry created outside a change window and not present in the platform team's configuration baseline, and either appearing on a vCenter whose build predates the VMSA-2026-0006 fixes."
  - claim_id: 9fd0cd0cba
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "section 2026-08-13T04:58:00Z"
    kind: derived
    text: "On an appliance patched before 29 July none of the three should be present at all."
  - claim_id: 1f299be3b7
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "section 2026-08-13T04:58:00Z"
    kind: derived
    text: "**Defender takeaway:** vCenter is a single control point over an entire virtual estate, and this flaw needs nothing but network reach to it."
  - claim_id: 015af4fa11
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "section 2026-08-13T04:58:00Z"
    kind: derived
    text: "Broadcom offers no workaround, so version state is the only preventive control — but for any appliance that was reachable and unpatched between 29 July and now, the five-day disclosure-to-exploitation gap and the three-day saturation curve mean an upgrade closes the door without answering whether anyone already walked through it."
  - claim_id: dfcb52263c
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "section 2026-08-13T04:58:00Z"
    kind: derived
    text: "Treat that window as a compromise-assessment scope, not a patching backlog item."
  - claim_id: 971c79088a
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "section 2026-08-28T05:20:00Z"
    kind: cited
    text: "QUIRSO's continued work on the campaign this entry has tracked since 13 August now attributes the activity to a suspected China-nexus actor and reports that Babuk-derived ransomware was deployed against ESXi hosts in at least one investigated case ("
    urls: ["https://thehackernews.com/2026/08/suspected-china-nexus-actor-exploits.html"]
  - claim_id: ef42a43666
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "section 2026-08-28T05:20:00Z"
    kind: cited
    text: "Infosecurity Magazine reports the same assessment: \"the digital forensics company assessed a suspected advanced persistent threat (APT) actor was responsible, counting 361 victim IP addresses across 47 countries\" ("
    urls: ["https://www.infosecurity-magazine.com/news/vcenter-cve-2026-59310-exploited/"]
  - claim_id: 8d233c9ba8
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "section 2026-08-28T05:20:00Z"
    kind: cited
    text: "The ransomware deployment (`.babyk` extension) is assessed by QUIRSO as plausibly a smokescreen rather than the operation's goal: the deployment of \"the locker\", the Babuk-derived payload, \"may not have been the primary objective of the campaign\" ("
    urls: ["https://thehackernews.com/2026/08/suspected-china-nexus-actor-exploits.html"]
  - claim_id: a5add2ac2e
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "section 2026-08-28T05:20:00Z"
    kind: uncited
    text: "CISA added CVE-2026-59310 to its Known Exploited Vulnerabilities catalog on 2026-08-18 — a jurisdiction-agnostic confirmation of active exploitation, independent of any US-FCEB remediation deadline, layered on top of NCSC-CH's own actively-exploited determination already recorded above."
  - claim_id: bf5be8c8d3
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "section 2026-08-28T05:20:00Z"
    kind: uncited
    text: "Both findings warrant the same caveat this entry already applies to the CVE-2026-59309 scanning correlation: every outlet surveyed (The Hacker News, Infosecurity Magazine, and further security-press pickup) cites QUIRSO's own Medium write-ups as the sole source for the China-nexus attribution (built on a UTC+08:00 activity pattern, Chinese-language code artefacts, and reuse of a Chinese security publication) at QUIRSO's own stated moderate confidence, and for the ransomware finding."
  - claim_id: 5324f494ea
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "section 2026-08-28T05:20:00Z"
    kind: uncited
    text: "Two outlets reporting one firm's conclusion is wide distribution of a single assessor's work, not independent corroboration of it — the attribution and the ransomware-deployment finding should be read as QUIRSO's own assessment, not as cross-verified intelligence, and are recorded here on that basis rather than folded into this entry's overall A/1 rating, which reflects the multi-CERT-corroborated vulnerability and initial-exploitation facts."
  - claim_id: ab882fbecb
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "section 2026-08-28T05:20:00Z"
    kind: uncited
    text: "Nothing in this update changes the remediation guidance already given above: patch every internet-reachable vCenter to the fixed builds, and treat any instance that was internet-reachable and unpatched between 29 July and 3 August as a compromise-assessment candidate rather than a patch-and-close item — that assessment should now explicitly include a check for Babuk-derived (`.babyk`) file extensions on any ESXi hosts the appliance manages, alongside the reverse_ssh persistence and cron-entry artefacts already described."
  - claim_id: 397c41e82c
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "section 2026-09-29T23:38:24Z"
    kind: cited
    text: "CVE-2026-59310, the vCenter Syslog traversal, has been exploited in the wild since before the update of 2026-08-13, and CISA added it to its Known Exploited Vulnerabilities catalog on 2026-08-18 ("
    urls: ["https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"]
  - claim_id: e077519256
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "section 2026-09-29T23:38:24Z"
    kind: cited
    text: "On one compromised vCenter appliance that QUIRSO analysed, the evidence shows malicious activity consistent with exploitation of CVE-2026-59309 as early as 2026-08-01, followed by the creation of an administrative account on vCenter, with no login events for the legitimate administrator account used to create it ("
    urls: ["https://thehackernews.com/2026/08/suspected-china-nexus-actor-exploits.html"]
  - claim_id: a400bc4bba
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "section 2026-09-29T23:38:24Z"
    kind: uncited
    text: "The patch guidance is unchanged, and the compromise check in the actions applies to any vCenter that was exposed and unpatched."
  - claim_id: 3ba6f23385
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "section 2026-09-29T23:38:24Z"
    kind: uncited
    text: "The Directory Service authentication bypass may not be far behind."
  - claim_id: d2b2122855
