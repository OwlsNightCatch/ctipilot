  - claim_id: 32f32caa69
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "record 2026-08-13T04:58:00Z"
    kind: record-summary
    text: "CVE-2026-59310, the CVSS 9.8 directory-traversal-to-code-execution flaw in the VMware vCenter Syslog server that Broadcom fixed in VMSA-2026-0006 and that this pipeline covered on 2026-07-30 as reported unexploited, is under active exploitation. German firm QUIRSO, working an incident-response engagement, identified 361 unique victim IP addresses across 47 countries whose first contact with attacker infrastructure came on 3 August — five days after public disclosure — with persistence established through a cron entry launching the open-source reverse_ssh tool for an outbound control channel. Switzerland's NCSC updated its VMSA-2026-0006 advisory to actively exploited on 12 August. No workaround exists; patching is the only remediation, and an unpatched internet-reachable vCenter now warrants a compromise assessment rather than an upgrade alone."
  - claim_id: 8fadc23a12
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "record 2026-08-28T05:20:00Z"
    kind: record-summary
    text: "CISA added CVE-2026-59310 to its Known Exploited Vulnerabilities catalog on 2026-08-18. QUIRSO's continued investigation of the exploitation campaign this entry already tracks now reports a suspected China-nexus attribution and, in at least one case, deployment of Babuk-derived ransomware against ESXi hosts — but both findings trace to QUIRSO's own investigation alone; no independent assessor has corroborated either, and they are recorded here as QUIRSO's assessment rather than established fact."
  - claim_id: 0f9ca35dda
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "record 2026-09-29T23:38:24Z"
    kind: record-summary
    text: "The summary still said none of the five flaws was reported exploited; CVE-2026-59310 has been exploited in the wild since before the 2026-08-13 update and was added to CISA's KEV catalog on 2026-08-18. The Hacker News quotation, in the evidence and in the 2026-08-17 analysis, now carries the article's own sentence instead of a bracketed insertion. A duplicated vCenter patch action is folded into the one that also carries the compromise check. The sourcing note dates its no-exploitation statement to first publication. The analysis sentence on out-of-cycle handling is dated the same way. QUIRSO's single-appliance finding of activity consistent with exploitation of CVE-2026-59309, reported on 2026-08-17 and missing from the entry, is added and attributed. The 2026-08-28 attribution clause now cites The Hacker News, which carries it, ahead of the Infosecurity Magazine quotation."
  - claim_id: 06f259c467
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "record 2026-10-29T04:53:00Z"
    kind: record-summary
    text: "CISA added the ESX insufficient-logging flaw CVE-2026-41709 to its Known Exploited Vulnerabilities catalog on 2026-10-28, and CrowdStrike says the actor WARP PANDA exploited it as a zero-day in vCenter-environment intrusions as late as early 2026; Broadcom's advisory still carries no exploitation statement. The CVE record moves to exploited and KEV-listed, and ESX audit logs can no longer be treated as a complete record of administrator activity."
