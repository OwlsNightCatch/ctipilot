    text: "Dream Research updated its report on 2026-10-29 to say that the firewalls rooted with a custom PHP2Shell build chained to this kernel flaw run Palo Alto Networks PAN-OS, and counts 25 rooted PAN-OS firewall and management servers; Unit 42 says it independently verified the attacker's tooling and confirmed the reported results ("
    urls: ["https://dreamgroup.com/blog/chained-php2shell-exploit-roots-25-servers", "https://unit42.paloaltonetworks.com/cve-2026-109618-cve-2026-109619/"]
  - claim_id: 6e27592548
    entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
    surface: "section 2026-11-01T03:28:54Z"
    kind: uncited
    text: "The earlier description above of an unnamed vendor is superseded."
  - claim_id: b76bb27a1b
    entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
    surface: "record 2026-09-05T05:10:00Z"
    kind: record-summary
    text: "CVE-2026-46300's CVSS score has now been published (7.8) and Red Hat's own bulletin confirms RHEL kernels are affected (unlike sibling CVE-2026-43500, which Red Hat states does not affect its products). Public proof-of-concept exploits now target Kubernetes specifically, and Red Hat's bulletin groups this CVE under the collective \"Dirty Frag\" name alongside CVE-2026-43284/CVE-2026-43500, confirming the ESP-in-TCP exploitation path this entry already described and the coalescing-marker root cause are the same flaw."
  - claim_id: 0f3aefc434
    entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
    surface: "record 2026-09-30T07:16:53Z"
    kind: record-summary
    text: "The CVSS 7.8 figure came from the MITRE CVE record rather than from a cited advisory. It now cites Red Hat's CVE page, which publishes the same 7.8 score, and an evidence quote taken from the MITRE record is removed. The main text and action now carry the sourced interim mitigation (block esp4, esp6 and rxrpc, or disable unprivileged user namespaces) and the sourced patch status and discovery credits. Unsupported module names, a CAP_NET_ADMIN restriction, a kernel version range, wider patch coverage and a leftover table of three unrelated CVEs are removed, as is an unrelated actor link. The 2026-09-05 section now attributes the 7.8 score to Red Hat and cites Aikido for its container and detection guidance, which no longer says a module listing confirms IPsec use."
  - claim_id: 00dd2c3c98
    entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
    surface: "record 2026-10-21T08:18:40Z"
    kind: record-summary
    text: "Aikido's statement that working Kubernetes proof-of-concept exploits have been published concerns the Dirty Frag family as a whole, not CVE-2026-46300 specifically; the summary and the 2026-09-05 section now attribute it that way, and no source describes a Kubernetes exploit for this CVE. Detection and triage lines are added from Wiz's description of the public exploit and Red Hat's list of legitimate user-namespace uses."
  - claim_id: 7bbee09c5e
    entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
    surface: "record 2026-10-29T04:52:00Z"
    kind: record-summary
    text: "CISA added CVE-2026-46300 to its Known Exploited Vulnerabilities catalog on 2026-10-28 and says it can be chained with the PHP2Shell flaws to implant PHP webshells and run commands as root; Dream Research describes such a chain used against 24 firewalls of one unnamed vendor and a US government-affiliated network. The CVE record moves to exploited, the priority from notable to high, and the earlier statement that no source reports exploitation of this CVE is replaced. Removed from the text: the sentence that an attacker can modify any file the user can read (the Detection line still carries it) and, from the summary, the clause on Aikido's report of working Kubernetes exploits for the Dirty Frag family."
  - claim_id: 5e2d007b04
    entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
    surface: "record 2026-11-01T03:28:54Z"
    kind: record-summary
    text: "Dream Research's updated report names Palo Alto Networks PAN-OS as the product in the chain that paired the PHP2Shell flaws with this kernel flaw, and counts 25 rooted PAN-OS firewall and management servers; Unit 42 says it independently verified the tooling and results."
  - claim_id: a9d13556a7
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "headline"
    kind: frontmatter
    text: "The Joomla extension disclosure wave adds a cookie-forgery auth bypass — one anonymous request reaches Super User, and Super User means PHP"
  - claim_id: d32f1f3f8e
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "summary"
    kind: frontmatter
    text: "The mySites.guru research campaign against Joomla third-party extensions produced six further disclosures between 2026-07-20 and 2026-07-23, and one of them changes technique class: the Balbooa Gridbox page builder (CVE-2026-61425) trusts a client-supplied cookie value as proof of identity, so setting an administrator's username in that cookie authenticates the requester as that user with no password and no existing session. A Joomla Super User can edit templates, which is PHP execution, so this is full site compromise from a single anonymous request. Fixed in Gridbox 2.20.1; the vulnerable code had shipped since October 2025. The same week added unauthenticated SQL injection and order-forgery flaws in EasyStore, an invoice IDOR in Events Booking, and a critical unauthenticated upload in Membership Pro. A follow-up audit of Gridbox produced eleven more CVEs, fixed in 2.20.2, four of them exploited in the wild, and Gridbox 2.20.3.1 (21 September) fixes a further unauthenticated SQL injection present in every earlier build. Gridbox 2.20.4.2 (27 October) fixes two more unauthenticated SQL injections, CVE-2026-102788 and CVE-2026-102789, with no exploitation reported."
  - claim_id: 6a5baa4618
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "actions[0]"
    kind: frontmatter
    text: "Inventory Joomla sites for the Balbooa Gridbox page builder and update every one to 2.20.4.2, which also closes two unauthenticated SQL injections, CVE-2026-102788 and CVE-2026-102789, and the unauthenticated blind SQL injection in the front-end blog author parameter fixed in 2.20.3.1, present in every earlier build, 2.20.3 and 2.20.2.3 included. Anything below 2.20.2 is also exposed to the exploited follow-up batch, which 2.20.1 does not close, and the vulnerable code has shipped since the October 2025 release."
  - claim_id: 67acbedf03
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "actions[1]"
    kind: frontmatter
    text: "On any site that ran Gridbox 2.20.1 or earlier while internet-reachable, review the Super User list and administrator-group members, remove accounts that entered an admin group through self-registration rather than an explicit administrative action, and review template files and the web root for changes, with particular attention to files written since 27 July."
