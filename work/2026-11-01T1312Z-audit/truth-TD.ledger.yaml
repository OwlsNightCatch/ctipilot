  - claim_id: e8c32d8bc1
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "section 2026-10-28T03:52:00Z"
    kind: derived
    text: "**Detection:** in web access and database query logs, store or category list requests whose sort-by value is not one of the known sort keys, repeated anonymous calls to the Gridbox editor's blog-post task, and slow-query bursts from the web account; because the flaws only read, the post-patch check is credential hygiene on a site that was exposed, starting with administrator accounts nobody created, since the password hashes can be worked on offline."
  - claim_id: d5c6391893
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "record 2026-07-31T04:09:14Z"
    kind: record-summary
    text: "A follow-on source-code audit of the Balbooa Gridbox page builder for Joomla, commissioned by the vendor after an earlier authentication-bypass disclosure, found 23 further vulnerabilities in the single component. Two now carry CVEs: CVE-2026-65884 (CVSS 4.0 10.0) because the registration handler adds the usergroup IDs a visitor asks for instead of replacing them, letting an anonymous user create an administrator account outright, and CVE-2026-65885 (CVSS 4.0 9.4), an authenticated arbitrary file upload that turns the first into end-to-end unauthenticated remote code execution. The Joomla CNA marks both as attacked, and the researcher reports server-log evidence of exploitation plus 92 planted administrator accounts on one connected site. Every release from 1.0.0 to 2.20.1 is affected; the complete fix is Gridbox 2.20.2."
  - claim_id: f8561ea476
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "record 2026-09-29T23:37:59Z"
    kind: record-summary
    text: "All eleven Joomla CNA records for the Gridbox 2.20.2 batch have now published. Seven are Critical, and four carry the exploit maturity Attacked: besides CVE-2026-65884 and CVE-2026-65885, already recorded here, CVE-2026-65887 resets the password of any account except Super Users and CVE-2026-65888 logs the caller in as any user through the social login method, both CVSS 4.0 10.0. Both are added. Balbooa has since shipped 2.20.2.3, a hardening release with no CVE, and 2.20.3.1, which fixes an unauthenticated blind SQL injection in the blog author parameter present in every earlier build, so the action now points at 2.20.3.1. The sourcing note reflects the exploitation now recorded and which parts rest on one source. The mySites.guru quotation follows the round-up's current text and names the page it comes from, and one phrase about how the coverage was produced is reworded. The summary mentions the follow-up releases, and verification is recorded as multi-source now that the vendor's release notes are among the sources."
  - claim_id: b776e53c67
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "record 2026-10-28T03:52:00Z"
    kind: record-summary
    text: "Balbooa released Gridbox 2.20.4.2 on 2026-10-27, fixing two unauthenticated read-side SQL injections, CVE-2026-102788 (the sort-by parameter of store and category post lists) and CVE-2026-102789 (an editor task without a permission check), both scored CVSS 4.0 9.3 by the Joomla CNA and affecting every release up to 2.20.4.1. No exploitation is reported, Joomla 3 sites have no fix, and the action now points at 2.20.4.2."
  - claim_id: af64e6ab5e
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "headline"
    kind: frontmatter
    text: "Broadcom patches two pre-auth CVSS 9.8 flaws in vCenter and a VM escape in the VMXNET3 adapter — no workaround exists for any of the five"
  - claim_id: d93654e755
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "summary"
    kind: frontmatter
    text: "Broadcom's VMSA-2026-0006 (2026-07-29) fixes five flaws across VMware ESX, vCenter, Workstation and Fusion, and NCSC-CH, NCSC-NL and BSI CERT-Bund all carried it across 2026-07-28 and 2026-07-29. CVE-2026-59309 (CVSS 9.8) is an authentication bypass in vCenter's Directory Service reachable with nothing but network access to vCenter, and CVE-2026-59310 (CVSS 9.8) is a directory traversal in vCenter's Syslog server that reaches arbitrary code execution. CVE-2026-47876 (CVSS 9.3) is an out-of-bounds write in the VMXNET3 virtual network adapter that lets a guest administrator execute code on the ESX host, affecting only VMs using that adapter. No workaround exists for any of the five, so patching is the only control. All were reported privately to Broadcom, one of them through Pwn2Own, and CVE-2026-59310 has since been exploited in the wild and was added to CISA's KEV catalog on 2026-08-18; CISA also listed the ESX logging flaw CVE-2026-41709 as exploited on 2026-10-28, the day CrowdStrike said the actor WARP PANDA used it as a zero-day."
  - claim_id: 4168995716
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "actions[0]"
    kind: frontmatter
    text: "Inventory which guest VMs use the VMXNET3 adapter and patch the ESX hosts carrying them to ESXi-9.1.0.0200, ESXi-9.0.2.0100 or ESXi80U3k: the escape is reachable from guest administrative privilege, which makes any tenant-operated or lower-trust VM on a shared host a path to the hypervisor."
  - claim_id: 22936c9563
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "actions[1]"
    kind: frontmatter
    text: "Patch vCenter to 9.1.0.0300, 9.0.2.0100 or 8.0 U3k/U2f as applicable — there is no workaround — and on any appliance that was network-reachable and unpatched between 29 July and today, check the appliance's own scheduled-task and cron configuration for entries the platform team did not create, and its egress records for outbound SSH sessions from the appliance itself."
  - claim_id: 928e8de22e
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "actions[2]"
    kind: frontmatter
    text: "On the ESX hosts of any vCenter estate that was exposed or compromised, install the build that fixes CVE-2026-41709 and review administrator activity from vCenter task and event records and from syslog forwarded off the host, because Broadcom says the flaw lets an administrator act without being logged and CrowdStrike reports it used as a zero-day."
