    text: "CISA added CVE-2026-46300 to its Known Exploited Vulnerabilities catalog on 2026-10-28 and says in the entry that the flaw can be chained with CVE-2026-109618 and CVE-2026-109619 to implant PHP webshells and run commands as root, naming no actor or victim ("
