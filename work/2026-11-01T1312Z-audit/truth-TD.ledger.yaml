  - claim_id: 4dee1efb67
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "section 2026-09-29T23:37:59Z"
    kind: uncited
    text: "On a site that ran an earlier build while internet-facing, unexpected password resets and social-login sessions for existing accounts belong in the same review as the attacker-registered administrator accounts described above."
  - claim_id: 274ca98e24
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "section 2026-09-29T23:37:59Z"
    kind: uncited
    text: "Balbooa has shipped three releases since 2.20.2."
  - claim_id: b16ebb66d9
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "section 2026-09-29T23:37:59Z"
    kind: uncited
    text: "Version 2.20.3.1 (21 September) fixes an unauthenticated time-based blind SQL injection in the front-end blog `author` parameter, which went into a database query without being cast to a number."
  - claim_id: b84205f5ea
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "section 2026-09-29T23:37:59Z"
    kind: uncited
    text: "Every build below 2.20.3.1 is affected, 2.20.3 and 2.20.2.3 included, and there is no CVE or CVSS score yet."
  - claim_id: 5732940f66
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "section 2026-09-29T23:37:59Z"
