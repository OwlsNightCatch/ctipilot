  - claim_id: c62c234d11
    entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
    surface: "body"
    kind: cited
    text: "The primitive can rewrite any file the user can read, so a check limited to `su` misses variants ("
    urls: ["https://www.helpnetsecurity.com/2026/05/14/fragnesia-cve-2026-46300-linux-lpe-vulnerability/"]
  - claim_id: 0bcaf082d9
