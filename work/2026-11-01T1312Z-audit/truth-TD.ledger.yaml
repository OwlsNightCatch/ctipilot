    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "section 2026-09-29T23:37:59Z"
    kind: uncited
    text: "In web-server access telemetry, requests to the Gridbox blog view whose `author` value is not a plain number are the signal, and by inference from the time-based technique, ones that take several seconds to answer are the likelier successful probes."
  - claim_id: 1c675c1806
