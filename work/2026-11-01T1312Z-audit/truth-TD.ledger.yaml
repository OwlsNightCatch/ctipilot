  - claim_id: 20be16d7d8
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "body"
    kind: cited
    text: "In Balbooa's Gridbox page builder, \"A critical unauthenticated authentication bypass in Gridbox let anyone become a Super User on a Joomla site by setting a single browser cookie\" ("
    urls: ["https://mysites.guru/blog/gridbox-critical-authentication-bypass/"]
  - claim_id: fd4f3a6d1d
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "body"
    kind: cited
    text: "EasyStore for Joomla carried an unauthenticated SQL injection able to read the whole site database (CVE-2026-65761, scored 9.3 by the Joomla CNA) plus an order-forgery flaw (CVE-2026-65759, 8.7) where \"An anonymous request to the order-repayment endpoint could mark any order paid with no login, no token, and no contact with any payment gateway\" ("
    urls: ["https://mysites.guru/blog/easystore-security-disclosure/"]
  - claim_id: 17cbd2d688
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "body"
    kind: cited
    text: "Events Booking exposed invoices containing personal and financial data to anonymous requests that simply walked sequential identifiers, fixed in 5.8.2 ("
    urls: ["https://mysites.guru/blog/events-booking-invoice-idor/"]
  - claim_id: 10ee58bf86
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "body"
    kind: cited
    text: "The Joomla CNA disagreed\" and it was assigned CVE-2026-62415 at 9.1 critical, fixed in Membership Pro 4.6.2 ("
    urls: ["https://mysites.guru/blog/membership-pro-unauthenticated-file-upload/"]
  - claim_id: fe06ee4fa1
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "body"
    kind: uncited
    text: "The Joomla third-party-extension disclosure wave covered here since early July has been a file-upload story: unauthenticated uploads reaching code execution, several of which were weaponised and CISA-KEV-listed within days of disclosure."
  - claim_id: 2d23f4ae22
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "body"
    kind: uncited
    text: "The batch mySites.guru published between 2026-07-20 and 2026-07-23 adds a different and more direct failure."
  - claim_id: ce213a1e1e
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "body"
    kind: uncited
    text: "The extension treats a client-supplied cookie value as proof of identity rather than as an assertion to be validated against server-side session state, so an anonymous requester who places an administrator's username in that cookie is served the site as that administrator — no password, no login form, no pre-existing session."
  - claim_id: a811447ba5
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "body"
    kind: uncited
    text: "Because a Joomla Super User can edit templates, and templates are PHP, the practical outcome is code execution on the web server from a single unauthenticated request."
  - claim_id: 4ad00ca3ef
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "body"
    kind: uncited
    text: "Gridbox 2.20.1 fixes it; the vulnerable code had shipped since the previous release in October 2025, roughly nine months of exposure."
  - claim_id: e6bccd96f6
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "body"
    kind: uncited
    text: "The rest of the week's batch is the same research campaign continuing on its original axis, with two flaws that matter beyond the site itself."
  - claim_id: a40b7a51c5
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "body"
    kind: uncited
    text: "There is no public exploitation signal for any of these: the researcher withholds the exact cookie name, endpoints and proof-of-concept code under a fix-first policy."
  - claim_id: 3d535d8124
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "body"
    kind: uncited
    text: "The reason to act ahead of the routine extension-update cycle is the wave's own track record rather than current telemetry — earlier members of this same disclosure series moved from publication to confirmed in-the-wild exploitation within days once the mechanism became public, and a cookie-forgery bypass is trivially rediscovered by anyone who diffs the 2.20.1 release against its predecessor."
  - claim_id: a837d02f0c
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** Joomla is common in European public-sector, municipal and education web estates, and this class of flaw sits in third-party extensions that rarely appear in vulnerability-management inventories keyed on the CMS core version."
  - claim_id: d2a80502bc
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "body"
    kind: derived
    text: "Enumerate installed extensions and their versions as first-class inventory, not as a property of the Joomla install, and prioritise Gridbox given the nine-month exposure window and the anonymous-to-admin outcome."
  - claim_id: 0244729a85
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "body"
    kind: derived
    text: "**Triage:** a cookie-forgery bypass leaves little at the network layer to distinguish it — the request is well-formed and returns HTTP 200."
  - claim_id: 10a70872a3
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "body"
    kind: derived
    text: "The observable is the mismatch between authentication and privilege: administrative actions in Joomla's action log attributed to a Super User account with no preceding successful login event for that account, and no session-establishment record."
  - claim_id: e2f002b9d7
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "body"
    kind: derived
    text: "Legitimate administrator activity is preceded by an authentication event from a consistent source; forged-cookie access produces privileged actions that appear without one."
  - claim_id: e39ac6c393
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "body"
    kind: derived
    text: "On sites running affected Gridbox versions, template-file modification timestamps postdating the October 2025 release, with no corresponding administrator login, are the artefacts worth reviewing."
  - claim_id: 18c20e409f
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "section 2026-07-31T04:09:14Z"
    kind: cited
    text: "Balbooa's response was to commission the same researcher to audit the whole component, and that audit found 23 further vulnerabilities in this one extension ("
    urls: ["https://mysites.guru/blog/gridbox-23-critical-vulnerabilities/"]
  - claim_id: 2824c6f2b7
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "section 2026-07-31T04:09:14Z"
    kind: cited
    text: "The researcher describes the defect precisely: the registration handler \"adds the default group to whatever groups the visitor asks for, instead of replacing them,\" so \"anyone can register a normal account and place themselves straight into an administrator group\" ("
    urls: ["https://mysites.guru/blog/gridbox-23-critical-vulnerabilities/"]
  - claim_id: 83ebd39a04
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "section 2026-07-31T04:09:14Z"
    kind: cited
    text: "Both published records give the affected range as 1.0.0 to 2.20.1 — every version the extension has ever shipped up to the fix — and both are marked with an exploit maturity of attacked and an urgency of red by the Joomla CNA that assigned them ("
    urls: ["https://mysites.guru/blog/gridbox-23-critical-vulnerabilities/"]
  - claim_id: d9d44ad167
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "section 2026-07-31T04:09:14Z"
    kind: cited
    text: "The researcher reports holding server access logs showing the exploitation requests arriving and describes 92 planted administrator accounts on a single connected Joomla site, created in batches from 27 July, with usernames following one generator's pattern of a fixed prefix plus a few hex characters paired to matching webmail addresses ("
    urls: ["https://mysites.guru/blog/gridbox-23-critical-vulnerabilities/"]
  - claim_id: 58058933a7
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "section 2026-07-31T04:09:14Z"
    kind: cited
    text: "Balbooa's own release page corroborates attack traffic indirectly, referring to a recent increase in automated attacks and telling customers to remove the temporary web-server rules it had advised adding to block attacks against Gridbox endpoints ("
    urls: ["https://www.balbooa.com/blog/gridbox/gridbox-2-20-2-security-release"]
  - claim_id: 47ff4053ef
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "section 2026-07-31T04:09:14Z"
    kind: cited
    text: "The researcher's account of the coordinated-disclosure process records that the vendor's first proposed fix left several reported findings live, including an anonymous SQL injection returning password hashes that had been patched at only one of several identical reachable entry points, and that the second closed that and the actively-exploited routes but still left a forgeable payment-gateway callback signature and a SQL injection reachable by a low-privilege authenticated user ("
    urls: ["https://mysites.guru/blog/gridbox-23-critical-vulnerabilities/"]
  - claim_id: b499def9f3
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "section 2026-07-31T04:09:14Z"
    kind: cited
    text: "Only 2.20.2, released 2026-07-29, closes all of it, and the vendor states the build was given to the reporting researcher for independent verification before release ("
    urls: ["https://www.balbooa.com/blog/gridbox/gridbox-2-20-2-security-release"]
  - claim_id: e448cc3a7f
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "section 2026-07-31T04:09:14Z"
    kind: uncited
    text: "The earlier entry covered CVE-2026-61425, the Gridbox flaw that accepted a client-supplied cookie as proof of identity, fixed in 2.20.1."
  - claim_id: c97490f504
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "section 2026-07-31T04:09:14Z"
    kind: uncited
    text: "The delta that matters is that 2.20.1 — the version the previous entry pointed operators at — is itself vulnerable to a worse flaw than the one it fixed, and that flaw is being exploited."
  - claim_id: df43773dd5
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "section 2026-07-31T04:09:14Z"
    kind: uncited
    text: "CVE-2026-65884 carries a CVSS 4.0 base score of 10.0 for a reason that requires no exploit skill at all: the registration handler adds the usergroup IDs supplied in the request to the default group rather than replacing them, so an anonymous visitor can register an ordinary account and place it directly into an administrator group."
  - claim_id: 9eca1e8920
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "section 2026-07-31T04:09:14Z"
    kind: uncited
    text: "CVE-2026-65885, scored 9.4, is an authenticated arbitrary file upload, and it becomes remote code execution when chained with the first because the attacker can create the account the upload requires."
  - claim_id: db2e7640cb
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "section 2026-07-31T04:09:14Z"
    kind: uncited
    text: "Exploitation is not an inference."
  - claim_id: fdf5ce8e8a
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "section 2026-07-31T04:09:14Z"
    kind: uncited
    text: "Getting to a fixed build took three attempts, which is itself operationally relevant for anyone who applied an interim Gridbox update this month."
  - claim_id: 47abd52902
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "section 2026-07-31T04:09:14Z"
    kind: uncited
    text: "The remaining 21 findings are described only by shape, with nine further CVE IDs reserved but unpublished, so the public picture of this component's exposure is not yet complete."
  - claim_id: 6dded85d60
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "section 2026-07-31T04:09:14Z"
    kind: uncited
    text: "**Detection.** Both halves of the chain leave records in places most Joomla operators already keep."
  - claim_id: 766eeac75a
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "section 2026-07-31T04:09:14Z"
    kind: uncited
    text: "For the privilege escalation, the artifact is a user account whose administrator-group membership was established at creation time rather than by a later administrative change — visible in the user table and in Joomla's own action logs as a registration event that produced an elevated account, with no corresponding admin action."
  - claim_id: 8400dfd26d
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "section 2026-07-31T04:09:14Z"
    kind: uncited
    text: "Cluster it by timing: automated abuse of this flaw produces accounts in batches minutes apart, not the trickle of genuine sign-ups."
  - claim_id: 587d71bb96
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "section 2026-07-31T04:09:14Z"
    kind: uncited
    text: "For the upload half, the signal is a file appearing in a web-reachable directory with a server-executable extension, written by the web server user, followed by requests to that path from a small number of sources — and in web-server access logs, POST requests to the extension's registration and upload endpoints from addresses with no prior browsing history on the site."
  - claim_id: 5850a9ffcd
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "section 2026-07-31T04:09:14Z"
    kind: derived
    text: "**Triage:** a public Joomla site with open registration collects spam accounts constantly, so a new unrecognised user is not the signal."
  - claim_id: 6a5a3fc5f4
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "section 2026-07-31T04:09:14Z"
    kind: derived
    text: "The discriminator is the group membership: ordinary registration spam lands in the default registered-users group and stays there, while these accounts sit in an administrator group from the moment they were created."
  - claim_id: f13ac0a35a
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "section 2026-07-31T04:09:14Z"
    kind: derived
    text: "Any self-registered account holding administrative rights on a Gridbox site should be treated as planted rather than misconfigured."
  - claim_id: d1788f59bc
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "section 2026-07-31T04:09:14Z"
    kind: derived
    text: "**Defender takeaway:** this is the second time in ten days that a widely-installed Joomla page-builder extension has turned out to accept the attacker's own claim about who they are, and the pattern across this wave is that the fix version from one disclosure is the vulnerable version in the next."
  - claim_id: 8269a9fb39
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "section 2026-07-31T04:09:14Z"
    kind: derived
    text: "A Joomla estate — common across European municipal, cantonal and education sites — needs an extension inventory that can answer \"which of our sites run Gridbox, at what version\" quickly, because patching here is fast and the compromise-assessment afterwards is what takes the time."
  - claim_id: 1dea3b0f69
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "section 2026-09-29T23:37:59Z"
    kind: cited
    text: "Every one lists Gridbox 1.0.0 to 2.20.1 as affected, seven are rated Critical, and four carry the exploit maturity Attacked with an urgency of Red ("
