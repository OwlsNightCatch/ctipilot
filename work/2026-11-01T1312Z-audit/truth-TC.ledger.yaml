claims:
  - claim_id: 4a83d481a0
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "headline"
    kind: frontmatter
    text: "Node2Shell Brotli flaw is now on CISA KEV, with exploit traffic seen against Node.js 24.22.0; update now"
  - claim_id: c32b575282
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "summary"
    kind: frontmatter
    text: "CISA added CVE-2026-111497, an out-of-bounds write in the Brotli decoder bundled with Node.js, to its Known Exploited Vulnerabilities catalog on 2026-10-27 on evidence of active exploitation, and ELLIO's sensors recorded exploit traffic against Node.js 24.22.0 on 2026-10-26, though its own copy of the attacker's chain got no shell. Node.js 22.23.4, 24.22.1 and 26.12.1 fix it, and because the flaw is in Google's decoder the PyPI packages Brotli (1.2.1) and brotlicffi (1.2.1.0), Envoy, Microsoft .NET, PHP for Windows, Ubuntu and, with Brotli inspection and TLS decryption enabled, PAN-OS 12.2, 12.1 and 11.2 firewalls carry it too; Palo Alto and Cisco report no malicious use against their own products. Broadcom lists VMware Cloud Foundation's SDDC Manager 9.1.1.x as critically affected (CVSS 3.1 9.8), with the patch pending and only workarounds available."
  - claim_id: 524ae395b4
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "actions[0]"
    kind: frontmatter
    text: "Update every Node.js 22.x, 24.x and 26.x runtime to 22.23.4, 24.22.1 or 26.12.1, including the Node binary inside container images (a Dockerfile that pins 24.22.0 keeps the flaw until the pin changes), and upgrade the PyPI Brotli package to 1.2.1 and brotlicffi to 1.2.1.0 wherever either is installed; judge a Node.js build by its release version, because process.versions.brotli reads 1.2.0 on patched builds too, and move any application on an end-of-life Node.js line to a supported release."
  - claim_id: 67450cd92a
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "actions[1]"
    kind: frontmatter
    text: "Update every Envoy proxy that has the Brotli decompressor configured to v1.40.0, v1.39.3, v1.38.6, v1.37.8 or v1.36.12; the advisory names v1.39.2, v1.38.5, v1.37.7 and v1.36.11 as vulnerable. On every VMware Cloud Foundation SDDC Manager apply Broadcom's workaround, KB460732 on 9.1.1 and KB460734 on 9.1.0, 9.0.x and 5.2.x, until its patch ships."
  - claim_id: db4549048d
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "actions[2]"
    kind: frontmatter
    text: "On every PA-Series and VM-Series firewall on PAN-OS 12.2, 12.1 or 11.2 that has TLS decryption enabled, run show system setting brotli and, where it returns Enabled: yes, run set system setting brotli-encoding disable until the hotfix for the release is installed; Palo Alto's timeline of 2026-10-29 lists every PAN-OS hotfix for this flaw as released."
  - claim_id: 785bb06a14
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "cves[CVE-2026-111497]"
    kind: frontmatter
    text: "{\"id\": \"CVE-2026-111497\", \"cvss\": \"9.2 (CVSS 4.0)\", \"status\": [\"exploited\", \"cisa-kev\", \"poc-public\", \"patch-available\"], \"affected\": \"Node.js 22.x, 24.x and 26.x before 22.23.4, 24.22.1 and 26.12.1; Google Brotli 1.0.3 to 1.2.0; PyPI Brotli up to 1.2.0; PyPI brotlicffi up to 1.2.0.2; Bun 1.0.21 to before 1.4.4; Istio before 1.29.9, 1.30.6 and 1.31.2; Envoy v1.39.2, v1.38.5, v1.37.7 and v1.36.11 with the Brotli decompressor configured; .NET before 8.0.33, 9.0.22 and 10.0.14 where Brotli data from untrusted parties is decompressed; PAN-OS 12.2 before 12.2.4-h1, 12.1 before 12.1.4-h13, 12.1.7-h11 and 12.1.10-h3, and 11.2 before 11.2.4-h23, 11.2.7-h23, 11.2.10-h17, 11.2.13-h4 and 11.2.16-h1, on PA-Series and VM-Series firewalls with Brotli inspection and TLS decryption enabled (PAN-OS 11.1 and 10.2 and the management interface are not affected); PHP for Windows builds without the -1 suffix, through the cURL extension when automatic decompression is enabled; Ubuntu, Debian and Alpine brotli packages and the Ruby brotli gem before the fixed builds listed; VMware Cloud Foundation SDDC Manager 9.1.1 (critical, CVSS 3.1 9.8) and 9.1.0, 9.0.x and 5.2.x (important, 7.5)\", \"fixed\": \"Node.js 22.23.4, 24.22.1, 26.12.1; Google Brotli 1.0.10, 1.1.1, 1.2.1; PyPI Brotli 1.2.1; PyPI brotlicffi 1.2.1.0; Bun 1.4.4; Istio 1.29.9, 1.30.6, 1.31.2; Envoy v1.40.0, v1.39.3, v1.38.6, v1.37.8, v1.36.12; .NET 8.0.33, 9.0.22, 10.0.14; PAN-OS hotfixes 12.2.4-h1, 12.1.4-h13, 12.1.7-h11, 12.1.10-h3, 11.2.4-h23, 11.2.7-h23, 11.2.10-h17, 11.2.13-h4 and 11.2.16-h1 (all released, as read on 2026-10-29); PHP for Windows 8.5.12-1, 8.4.27-1, 8.3.36-1, 8.2.35-1; Ubuntu brotli 1.2.0-4ubuntu0.1 (26.10), 1.2.0-3ubuntu0.1 (26.04), 1.1.0-2ubuntu0.1 (24.04), 1.0.9-2ubuntu0.1 (22.04), ESM 1.0.7-6ubuntu0.1+esm1 (20.04, whose nodejs package stays vulnerable); Debian brotli 1.0.9-2+deb12u1 (bookworm) and 1.1.0-2+deb13u1 (trixie); Alpine brotli 1.2.1-r0 (edge, 3.24, 3.23) and 1.1.1-r0 (3.21); Ruby brotli gem 0.9.1 and 0.9.2; SDDC Manager none yet, patch pending, workarounds KB460732 (9.1.1) and KB460734 (9.1.0, 9.0.x, 5.2.x)\", \"auth\": \"pre-auth\", \"vector\": \"zero-click\"}"
  - claim_id: 13c835c243
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "body"
    kind: cited
    text: "Node.js shipped security releases on 2026-10-21 for CVE-2026-111497, an out-of-bounds write in the Brotli decoder it bundles: an invalid block switch was reported as a need for more input instead of a format error, so the streaming decoder kept appending input to an eight-byte internal buffer ("
    urls: ["https://nodejs.org/en/blog/vulnerability/october-2026-security-releases"]
  - claim_id: f34eca57bd
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "body"
    kind: cited
    text: "An attacker who can supply Brotli data that an application decompresses with node:zlib can corrupt process memory, which can lead to a crash, disclosure of process memory or remote code execution ("
    urls: ["https://nodejs.org/en/blog/vulnerability/october-2026-security-releases"]
  - claim_id: 762f3ebce4
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "body"
    kind: cited
    text: "Imperva ran code carried in Brotli data against the official 24.22.0 image in its laboratory, through fetch() and through Express 5 and body-parser 2 request parsers, and the fixed 24.22.1 rejected the same input ("
    urls: ["https://www.imperva.com/blog/node2shell-from-brotli-data-to-remote-code-execution/"]
  - claim_id: cf1f29df76
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "body"
    kind: cited
    text: "CISA added the flaw to its Known Exploited Vulnerabilities catalog on 2026-10-27 \"based on evidence of active exploitation\", naming no actor or victim ("
    urls: ["https://www.cisa.gov/news-events/alerts/2026/10/27/cisa-adds-two-known-exploited-vulnerabilities-catalog"]
  - claim_id: 0c5031c93d
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "body"
    kind: cited
    text: "The only first-hand attack telemetry found is ELLIO's: on 2026-10-26 its sensors recorded one Brotli-coded request body of about 23 MB built against Node.js 24.22.0 on x86-64, although the chain got no shell against ELLIO's own copy of that build ("
    urls: ["https://ellio.tech/en/blog/node2shell-cve-2026-111497-rce-on-stock-nodejs-builds/"]
  - claim_id: 2cfddce93a
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "body"
    kind: cited
    text: "Tenable relays the report without confirming it, and Cisco and Palo Alto say they know of no malicious use against their own products ("
    urls: ["https://www.tenable.com/blog/brotli2shell-frequently-asked-questions-for-google-brotli-decoder-cve-2026-111497", "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-oct2026-node-js-Jj3SQ19u", "https://security.paloaltonetworks.com/CVE-2026-111497"]
  - claim_id: 966c26a5ef
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "body"
    kind: cited
    text: "Fixes are in Node.js 22.23.4, 24.22.1 and 26.12.1; end-of-life lines are always affected, and because Node.js cherry-picked the fix without bumping the bundled version string, process.versions.brotli reads 1.2.0 on patched and vulnerable builds alike ("
    urls: ["https://nodejs.org/en/blog/vulnerability/october-2026-security-releases", "https://ellio.tech/en/blog/node2shell-cve-2026-111497-rce-on-stock-nodejs-builds/"]
  - claim_id: deece90afb
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "body"
    kind: cited
    text: "The decoder is Google's, so Bun (fixed in 1.4.4), Istio, the PyPI packages Brotli (fixed in 1.2.1) and brotlicffi (1.2.1.0), Envoy and Microsoft .NET carry the flaw too ("
    urls: ["https://ellio.tech/en/blog/node2shell-cve-2026-111497-rce-on-stock-nodejs-builds/", "https://www.tenable.com/blog/brotli2shell-frequently-asked-questions-for-google-brotli-decoder-cve-2026-111497", "https://opensourcemalware.com/blog/node2shell-affects-python", "https://github.com/envoyproxy/envoy/security/advisories/GHSA-3wvj-j6qm-62mr", "https://devblogs.microsoft.com/dotnet/dotnet-october-2026-oob-security-updates/"]
  - claim_id: 447b7a5eae
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "body"
    kind: cited
    text: "**Exposure:** a service on Node.js 22.x, 24.x or 26.x below the fixed releases that decodes Brotli from an untrusted party, either request bodies inflated by Express 5 or body-parser 2 or compressed responses that fetch() consumes from a server an attacker influences ("
