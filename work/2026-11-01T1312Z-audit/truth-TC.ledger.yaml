    surface: "section 2026-10-22T03:46:23Z"
    kind: cited
    text: "It counts attempted sign-ins to more than 2,250 tenants and links the activity to an automated cross-tenant password spray between 2026-10-10 and 2026-10-14 against 327 accounts at eight organizations, from the same network range and including an address that ConnectWise's advisory later listed among its indicators; the spray peaked on 2026-10-11 at 2,900 failed logons a minute and produced no successful authentication ("
