  - claim_id: 0da932030c
    entry: 2026-10-18/connectwise-cloud-backup-skykick-m365-app-credential-abuse
    surface: "section 2026-10-27T03:46:02Z"
    kind: cited
    text: "It says its telemetry aligns with Microsoft's Storm-0940 and ARTEX account without independently confirming it, that it is highly confident an operator, a person or an LLM, adapted the tooling between runs, and that its confidence that an LLM was involved in the escalation tooling is low to medium on its own telemetry and medium to high once Microsoft's attribution is included ("
    urls: ["https://www.huntress.com/blog/connectwise-attack-ai"]
  - claim_id: 2d7216051d
    entry: 2026-10-18/connectwise-cloud-backup-skykick-m365-app-credential-abuse
    surface: "section 2026-10-27T03:46:02Z"
    kind: cited
    text: "Its evidence for adaptation: a certificate upload that failed on a thumbprint mismatch ended one run with no retry, and the next run 55 seconds later retried the same error with growing waits until it worked; in a second tenant that refused removal of the Global Administrator role, the actor granted a different role to a sibling principal and the original service principal was then deleted ("
    urls: ["https://www.huntress.com/blog/connectwise-attack-ai"]
  - claim_id: 7f0a5b858c
    entry: 2026-10-18/connectwise-cloud-backup-skykick-m365-app-credential-abuse
    surface: "section 2026-10-27T03:46:02Z"
    kind: cited
    text: "Microsoft Graph reads are not recorded in the Entra audit log and no victim Huntress knows of had Graph activity logging enabled, so a clean audit log does not show that no Graph access took place ("
    urls: ["https://www.huntress.com/blog/connectwise-attack-ai"]
  - claim_id: 20e655836a
    entry: 2026-10-18/connectwise-cloud-backup-skykick-m365-app-credential-abuse
    surface: "section 2026-10-27T03:46:02Z"
    kind: cited
    text: "Huntress recommends alerting when a service principal assigns itself Global Administrator or Privileged Role Administrator, deletes itself, or when one vendor principal grants a role to a sibling, and turning on Graph activity logs where licensing allows ("
    urls: ["https://www.huntress.com/blog/connectwise-attack-ai"]
  - claim_id: 997babe9cd
    entry: 2026-10-18/connectwise-cloud-backup-skykick-m365-app-credential-abuse
    surface: "section 2026-10-27T03:46:02Z"
    kind: uncited
    text: "Huntress published its analysis of what drove the 2026-10-15 activity on 2026-10-26, working from Entra sign-in and directory audit logs in the tenants it monitors."
  - claim_id: 3818cbad4f
    entry: 2026-10-18/connectwise-cloud-backup-skykick-m365-app-credential-abuse
    surface: "section 2026-10-29T04:59:00Z"
    kind: cited
    text: "ConnectWise's status page announced on 2026-10-28 at 17:09 UTC, after restoration in controlled phases had begun on 2026-10-21, that it is beginning phased restoration for partners, starting with Microsoft 365 backups and restores through a new, security-hardened application, with other features returning in phases over the coming days ("
    urls: ["https://status.connectwise.com/pages/incident/619cf82551fec9053d612f09/6ad263692dc48705ab3da2cb"]
  - claim_id: 0eb0e834b4
    entry: 2026-10-18/connectwise-cloud-backup-skykick-m365-app-credential-abuse
    surface: "section 2026-10-29T04:59:00Z"
    kind: cited
    text: "Partners must re-authorize each Microsoft 365 tenant using the new application, “ConnectWise Cloud Backup for M365”, to resume backup and restore operations, and ConnectWise points to its Trust Center for the detailed instructions ("
    urls: ["https://status.connectwise.com/pages/incident/619cf82551fec9053d612f09/6ad263692dc48705ab3da2cb"]
  - claim_id: 2e58eaf60a
    entry: 2026-10-18/connectwise-cloud-backup-skykick-m365-app-credential-abuse
    surface: "section 2026-10-29T04:59:00Z"
    kind: cited
    text: "Before that, from 2026-10-26, it had said it would first enable a process to restore data from existing backups and then phased re-enrollment, and it still told partners to keep affected connections disabled until instructions applied to their service ("
    urls: ["https://status.connectwise.com/pages/incident/619cf82551fec9053d612f09/6ad263692dc48705ab3da2cb"]
  - claim_id: 4f62918bee
    entry: 2026-10-18/connectwise-cloud-backup-skykick-m365-app-credential-abuse
    surface: "record 2026-10-19T03:47:00Z"
    kind: record-summary
    text: "ConnectWise's update of 2026-10-18 01:00 UTC took SaaS Security and Cloud Management offline in addition to Cloud Backup, which had been suspended since 2026-10-17, so its monitoring and alerting is out of service, and its latest update (2026-10-19 01:15 UTC) gives no restoration time; Todyl and SpecterOps say a token issued before an app is disabled stays valid for up to 90 minutes, and ConnectWise says previously issued tokens may remain usable until they expire; and Todyl says to find every SkyKick and ConnectWise app in a tenant, inherited ones included, while Todyl and SpecterOps point to the apps owned by ConnectWise's vendor tenant."
  - claim_id: cb6f996a79
    entry: 2026-10-18/connectwise-cloud-backup-skykick-m365-app-credential-abuse
    surface: "record 2026-10-20T03:57:49Z"
    kind: record-summary
    text: "Huntress's update of 2026-10-19 reports a second tenant with scripted post-compromise activity (the application granting itself Global Administrator and planting a secret on other applications, the choice of applications apparently random), bounds the sign-in activity to the morning of 2026-10-15 UTC with the last successful sign-in at 08:44 UTC, and says Graph directory reads leave no audit record; the secret check therefore has to cover every application."
  - claim_id: 23f60c0967
    entry: 2026-10-18/connectwise-cloud-backup-skykick-m365-app-credential-abuse
    surface: "record 2026-10-21T03:47:47Z"
    kind: record-summary
    text: "Sophos X-Ops reports the same token sweep from its own telemetry, from a single server in ascending tenant order and including tenants with no active backup subscription, and found no planted secrets, applications, consents or role assignments in the tenants it reviewed, unlike Huntress's two tenants."
  - claim_id: 43f8935fdb
    entry: 2026-10-18/connectwise-cloud-backup-skykick-m365-app-credential-abuse
    surface: "record 2026-10-22T03:46:23Z"
    kind: record-summary
    text: "Microsoft Threat Intelligence assesses that Storm-0940, a China-state aligned actor, was responsible for the compromise, using the ARTEX agentic-AI framework to attempt sign-ins to more than 2,250 tenants after an automated password spray from the same network range, and warns that credential changes planted in tenants can persist after the vendor application is remediated. ConnectWise itself says it appears a China state-aligned group was responsible and began restoring services in controlled phases on 2026-10-21."
  - claim_id: fc758327b5
    entry: 2026-10-18/connectwise-cloud-backup-skykick-m365-app-credential-abuse
    surface: "record 2026-10-25T13:43:07Z"
    kind: record-summary
    text: "Corrects the 2026-10-22 update: Microsoft's 2,900-a-minute figure is the peak of failed logons in the separate 10 to 14 October password spray, not the rate of the ARTEX sign-ins to more than 2,250 tenants."
  - claim_id: b7d59d496f
    entry: 2026-10-18/connectwise-cloud-backup-skykick-m365-app-credential-abuse
    surface: "record 2026-10-27T03:46:02Z"
    kind: record-summary
    text: "Huntress's analysis of 2026-10-26 reads the activity as scripted tooling steered by an operator, rates LLM involvement low to medium on its own telemetry, adds a detection for service principals that assign themselves or a sibling a directory role, and notes that Graph reads leave no Entra audit record."
  - claim_id: cfadce8e56
    entry: 2026-10-18/connectwise-cloud-backup-skykick-m365-app-credential-abuse
    surface: "record 2026-10-29T04:59:00Z"
    kind: record-summary
    text: "ConnectWise's status page of 2026-10-28 opens partner re-authorisation of Microsoft 365 backup and restore through a new application that each partner must consent in every tenant, with instructions on its Trust Center (restoration in controlled phases had begun on 2026-10-21); the earlier advice to keep the old connections disabled until restoration instructions exist is replaced. The text on the vendor tenant is corrected: the name 'ConnectWise S-K LLC' and the claim that Todyl says all SkyKick apps come from one vendor tenant are removed. Removed from the text: the heise restoration sentence and the SaaS Security outage clause."
  - claim_id: f402f34160
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "headline"
    kind: frontmatter
    text: "Microsoft: Storm-0940 runs ARTEX at machine speed; Mandiant now sees agent frameworks in incident-response cases"
  - claim_id: 1099e3074e
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "summary"
    kind: frontmatter
    text: "Microsoft reports that since at least September 2026 Storm-0940, a China-state aligned actor, has used ARTEX, an open-source multi-agent LLM penetration-testing framework, to automate scanning, password spraying and OAuth-application abuse against hundreds of organizations across many industries including government, reaching privileged cloud access in under three hours in several cases; Expel saw the same infrastructure create its own accounts through Okta self-service registration. Google Threat Intelligence Group and Mandiant report on 2026-10-31 that since late August they have seen ARTEX, PentAGI and CAIRN operated in incident-response cases, with ARTEX adopted by extortion groups and suspected PRC-nexus clusters whose victims include US government organizations, and that the original ARTEX repository was taken down in October while forks keep it in circulation. CrowdStrike and Recorded Future document another actor using the framework, and Seoul police referred a criminal group's leader to prosecutors on 2026-10-23 for extorting 38 of more than 90 organizations, with the same framework according to BleepingComputer."
  - claim_id: 9bd6ee185f
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "actions[0]"
    kind: frontmatter
    text: "In every Okta org that allows self-service registration, review the accounts created since 2026-10-13 and every Okta Verify enrollment on them, and remove self-created accounts that nobody provisioned."
  - claim_id: a5eeae5fcb
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "Microsoft Threat Intelligence reports that as early as September 2026 Storm-0940, a China-state aligned actor active since 2021, used the agentic penetration-testing framework ARTEX to automate attacks on hundreds of organizations across many industries, government and military among them ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/10/21/storm-0940-uses-artex-agentic-ai-connectwise-supply-chain-compromise/"]
  - claim_id: 0054f6f66c
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "ARTEX is an open-source multi-agent LLM system that can use any AI model and runs a penetration test from reconnaissance to exfiltration with little human involvement ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/10/21/storm-0940-uses-artex-agentic-ai-connectwise-supply-chain-compromise/"]
  - claim_id: eeb0bb5d15
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "Microsoft says ARTEX accelerated the abuse of compromised applications already granted access to Microsoft 365 tenants ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/10/21/storm-0940-uses-artex-agentic-ai-connectwise-supply-chain-compromise/"]
  - claim_id: 58f1d8575e
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "), and Expel adds that it is not a vulnerability and only speeds up familiar techniques such as password spraying and OAuth-application abuse ("
    urls: ["https://expel.com/blog/storm-0940-artex-attacks-connectwise-app-abuse-and-okta-sign-ups/"]
  - claim_id: 7c0408f67d
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "); most targeting failed, yet several cases went from first targeting to privileged cloud access in under three hours ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/10/21/storm-0940-uses-artex-agentic-ai-connectwise-supply-chain-compromise/"]
  - claim_id: 404a1df459
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "Microsoft assesses the same actor was behind the ConnectWise Cloud Backup application-credential abuse ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/10/21/storm-0940-uses-artex-agentic-ai-connectwise-supply-chain-compromise/"]
  - claim_id: dafb9278f4
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "Expel saw Storm-0940 infrastructure scan a customer and, from 2026-10-13, abuse its Okta self-service registration with no ConnectWise application involved: the attacker created five accounts of its own, enrolled Okta Verify on three of them about a minute after activation, made 50 single sign-on logins with more than 100 OAuth tokens issued and ran a password spray that Okta ThreatInsight blocked ("
    urls: ["https://expel.com/blog/storm-0940-artex-attacks-connectwise-app-abuse-and-okta-sign-ups/"]
  - claim_id: 2ed4adeac1
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "Expel says the shared source address is its only link to Storm-0940, the activity alone does not prove ARTEX was used, and it had not seen the technique reported before ("
    urls: ["https://expel.com/blog/storm-0940-artex-attacks-connectwise-app-abuse-and-okta-sign-ups/"]
  - claim_id: 7d55fabb7c
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "Other actors use it: CrowdStrike analysed an unnamed, probably Chinese-speaking and financially motivated actor that ran ARTEX against South Korean financial institutions from late September ("
    urls: ["https://www.crowdstrike.com/en-us/blog/unknown-threat-actor-uses-artex-to-target-south-korean-finance/"]
  - claim_id: 56c61ed5bd
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "), and Recorded Future, which tracks that activity as TAG-217, says use of ARTEX and other AI penetration-testing tools is not limited to it ("
    urls: ["https://www.recordedfuture.com/blog/tag-217-artex-south-korean-banks"]
  - claim_id: 8e9f927275
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "Wiz Research independently reports that throughout October 2026 it tracked an actor using ARTEX-associated tooling, overlapping with Storm-0940, against IT and software vendors, focused on identity providers (Okta, Entra, Cognito) and Microsoft 365 integrations, and says that most attempts failed and that none of the techniques is novel ("
    urls: ["https://www.wiz.io/blog/artex-in-the-wild-storm-0940-expands-targeting-of-it-and-software-vendors"]
  - claim_id: 00ba73e031
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "It describes a consistent sequence: downloading JavaScript bundles, exposed source maps, runtime configuration and OpenAPI documents, then calling internal API routes by name minutes later; fabricated authorization codes and malformed state values against Microsoft OAuth callbacks; unsigned JWTs tried against more than 60 SSO route variants in two minutes; and account-recovery, sign-up and Cognito calls such as InitiateAuth, ForgotPassword and ResendConfirmationCode ("
    urls: ["https://www.wiz.io/blog/artex-in-the-wild-storm-0940-expands-targeting-of-it-and-software-vendors"]
  - claim_id: 3cd9fdcb64
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "Its password sprays against Entra and Okta hit hundreds of users, mainly software engineers, in bursts of 20 to 60 minutes with a unique user agent per burst, a median gap of one second between attempts and new source addresses within minutes of a block ("
    urls: ["https://www.wiz.io/blog/artex-in-the-wild-storm-0940-expands-targeting-of-it-and-software-vendors"]
  - claim_id: 4bde764d50
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "**Exposure:** any tenant that relies on password sign-in or grants OAuth consent to applications, and any Okta org with self-service registration enabled; not using ConnectWise does not exclude exposure ("
    urls: ["https://expel.com/blog/storm-0940-artex-attacks-connectwise-app-abuse-and-okta-sign-ups/"]
  - claim_id: 50c37af9af
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "**Detection:** in the authentication logs of every identity provider in use, bursts of failed logons and lockouts spread over many accounts; in the Okta system log, newly self-registered accounts that enrol Okta Verify and start single sign-on within minutes; and in the Entra audit log, credentials or certificates added to applications that nobody on your team created and any application that assigns itself a directory role ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/10/21/storm-0940-uses-artex-agentic-ai-connectwise-supply-chain-compromise/", "https://expel.com/blog/storm-0940-artex-attacks-connectwise-app-abuse-and-okta-sign-ups/"]
  - claim_id: 297a697100
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "A clean audit log is not proof of no access, because Microsoft Graph directory reads leave no Entra audit record ("
    urls: ["https://expel.com/blog/storm-0940-artex-attacks-connectwise-app-abuse-and-okta-sign-ups/"]
  - claim_id: 08571f196b
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "In web access logs of an application exposed to the same actor, Wiz points to source-map and OpenAPI downloads followed minutes later by calls to internal routes that appear only in those files, and to sign-in telemetry showing a new user agent for each burst of attempts at a one-second cadence ("
    urls: ["https://www.wiz.io/blog/artex-in-the-wild-storm-0940-expands-targeting-of-it-and-software-vendors"]
  - claim_id: b553d7b4b1
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "**Triage:** Python and curl user agents match common legitimate automation, so Expel treats them as supporting evidence only, and a Python user agent on an application that normally calls Microsoft Graph with a .NET SDK is the anomaly ("
    urls: ["https://expel.com/blog/storm-0940-artex-attacks-connectwise-app-abuse-and-okta-sign-ups/"]
  - claim_id: d048ad9945
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** Expel's reading is that the framework adds speed, not a new vulnerability, so the levers are the identity controls it runs into: least privilege on multi-tenant application permissions and consent grants, alerting on credential additions and privileged role assignments by applications, and a review of self-registered Okta accounts since 2026-10-13 ("
    urls: ["https://www.microsoft.com/en-us/security/blog/2026/10/21/storm-0940-uses-artex-agentic-ai-connectwise-supply-chain-compromise/", "https://expel.com/blog/storm-0940-artex-attacks-connectwise-app-abuse-and-okta-sign-ups/"]
  - claim_id: be0ca9831d
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "section 2026-10-24T03:45:02Z"
    kind: cited
    text: "Wiz Research reports an actor using ARTEX-associated tooling, overlapping with Storm-0940, against IT and software vendors throughout October 2026, focused on Okta, Entra and Cognito and on Microsoft 365 integrations, with most attempts failing ("
    urls: ["https://www.wiz.io/blog/artex-in-the-wild-storm-0940-expands-targeting-of-it-and-software-vendors"]
  - claim_id: a88f89c6d6
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "section 2026-10-24T03:45:02Z"
    kind: cited
    text: "It describes the log signatures of the agent: source-map and OpenAPI downloads followed minutes later by calls to internal routes that appear only in those files, fabricated OAuth callback values, unsigned JWTs tried against more than 60 SSO route variants in two minutes, account-recovery and sign-up calls, and password-spray bursts of 20 to 60 minutes against Entra and Okta with a unique user agent per burst and a median gap of one second between attempts ("
    urls: ["https://www.wiz.io/blog/artex-in-the-wild-storm-0940-expands-targeting-of-it-and-software-vendors"]
  - claim_id: d81618e283
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "section 2026-10-24T03:45:02Z"
    kind: cited
    text: "Wiz says chaining, automatic adaptation to rate limits and blocks, and tests against heavily scrutinised Microsoft OAuth flows separate the agent from a human operator ("
    urls: ["https://www.wiz.io/blog/artex-in-the-wild-storm-0940-expands-targeting-of-it-and-software-vendors"]
  - claim_id: ff80356130
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "section 2026-10-27T03:45:25Z"
    kind: cited
    text: "Seoul Metropolitan Police announced on 2026-10-26 that it referred a 32-year-old gang leader to prosecutors on 2026-10-23, with six accomplices investigated without detention, for taking 8.2 million personal-data records and internal files from more than 90 organizations since September 2025, among them cram schools, hospitals, golf courses, universities and large-company affiliates, and for sending extortion e-mails ("
    urls: ["https://www.yna.co.kr/view/AKR20261026075100004"]
  - claim_id: 186bac2b43
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "section 2026-10-27T03:45:25Z"
    kind: cited
    text: "BleepingComputer, citing local media, reports that the group demanded 360 million won (about USD 270,000) in 38 of the incidents in exchange for not leaking the data, that the police say the leader used the ARTEX framework, the same system used in the attacks on South Korean banks, and that he moved from conventional tools to AI utilities in late August 2026 ("
    urls: ["https://www.bleepingcomputer.com/news/security/former-pentester-used-artex-ai-to-steal-82-million-data-records/"]
  - claim_id: a11db9ae2a
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "section 2026-10-27T03:45:25Z"
    kind: cited
    text: "Yonhap counts 60 of the victims as hacked with AI and describes the system as the AI autonomous penetration-testing system used in the recent financial-sector data thefts without naming it, so the ARTEX name is BleepingComputer's ("
    urls: ["https://www.yna.co.kr/view/AKR20261026075100004"]
  - claim_id: 0f00324a5a
    entry: 2026-10-22/artex-storm-0940-agentic-llm-pentest-spraying-oauth-abuse
    surface: "section 2026-10-27T03:45:25Z"
    kind: cited
    text: "No encryption step is reported, and the police say AI lowered the barrier to entry and call this the first arrest in Korea in a large-scale hacking and personal-data theft case that exploited generative AI ("
