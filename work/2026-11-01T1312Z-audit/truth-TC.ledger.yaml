    text: "{\"id\": \"CVE-2026-115557\", \"cvss\": \"9.4 (CVSS 4.0)\", \"status\": [\"patch-available\"], \"affected\": \"CPython 3.15.0 before 3.15.2, 3.14.0 before 3.14.10, 3.13.0 before 3.13.18, 3.12.0 before 3.12.16, every release before 3.11.18, and 3.16.0a1 before 3.16.0 per ENISA's record\", \"fixed\": \"Python 3.15.2, 3.14.10, 3.13.18, 3.12.16 and 3.11.18 carry the ssl denylist (Python Insider, 2026-10-26), which the post says makes normal uses of pip safe even if pip is not updated; Christian Heimes says in the announcement thread that pip before 26.2.2 keeps trusting the compromised intermediates whatever the system trust store holds, because it always loads its own vendored certifi\", \"auth\": \"pre-auth\", \"vector\": \"user-interaction\"}"
