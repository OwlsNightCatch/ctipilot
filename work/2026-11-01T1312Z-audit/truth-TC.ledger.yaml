  - claim_id: ff207ac458
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "body"
    kind: cited
    text: "**Detection:** in web server, proxy and WAF logs, requests that carry a Brotli content encoding to endpoints that parse bodies, followed by worker crashes or restarts; in ELLIO's lab most of 400 attempts against Express crashed the worker instead of returning a shell, and a patched build answers at once with HTTP 400 and ERR__ERROR_FORMAT_BLOCK_SWITCH ("
    urls: ["https://ellio.tech/en/blog/node2shell-cve-2026-111497-rce-on-stock-nodejs-builds/"]
  - claim_id: 829ef5da7d
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "body"
    kind: cited
    text: "Where systemd-coredump is enabled, each forced crash writes a core file that can hold other visitors' session cookies, tokens and key material, so restrict who can read it ("
    urls: ["https://ellio.tech/en/blog/node2shell-cve-2026-111497-rce-on-stock-nodejs-builds/"]
  - claim_id: bafc530f4f
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "body"
    kind: cited
    text: "**Defender takeaway:** replace the runtime, the two Python packages and any Envoy with the decompressor configured now, because CISA lists the flaw as exploited; where an update has to wait, reject Content-Encoding: br as NCSC Switzerland advises ("
    urls: ["https://security-hub.ncsc.admin.ch/#/posts/13105"]
  - claim_id: 2d85dd28e6
    entry: 2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi
    surface: "body"
    kind: cited
    text: ") and, if the application accepts no compressed request bodies, set the body-parser inflate option to false ("
