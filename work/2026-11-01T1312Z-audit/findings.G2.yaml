    discovery_trace: "first seen at: WebSearch (\"Informationssicherheitsgesetz ISG Bund Kantone Gemeinden Verordnung Bundesrat Cybersicherheit Meldepflicht Bussen Oktober 2026\") -> Netzwoche, URL https://www.netzwoche.ch/news/2026-09-11/update-berner-cybersicherheitsgesetz-kommt-im-november -> primary: KAIO page, URL https://www.kaio.fin.be.ch/de/start/themen/rechtliche-grundlagen/ICSG.html (fetched with extract on 2026-11-01, page date 2026-10-30) -> pivot: Stadt Bern Gemeinderat reply, URL https://www.bern.ch/politik-und-verwaltung/gemeinderat/vernehmlassungsantworten-des-gemeinderats/28-januar-2026-i-finanzdirektion-des-kantons-bern-fin/antwort-des-gr-zu-verordnung-uber-die-informations.pdf/download (pdf subcommand)"
    summary: |
      The covered entry (2026-09-11) treats 2026-11-01 as a forward date and rests its commune-scope sentence on the KAIO page of 2026-09-09. The KAIO page as it
      stands on 2026-11-01 (page date 2026-10-30) states: the ICSG and its ordinance IDSV enter into force on 2026-11-01; the old directorate ordinance (ISDS DV)
      lapses that day; the new baseline directive "Grundschutz BE" is still in preparation and expected in Q1 2027, the current ICSGW directive (status 27.10.2026)
      stays valid until then; the "AGB ISDS BE" general terms (status 27.10.2026) must be agreed by the cantonal administration in every contract that involves the
      processing of information or personal data (a supplier-facing obligation the entry does not mention); and the canton's reporting platform for security incidents,
      vulnerabilities, data-security breaches and cyberattacks has no published details yet ("will be published here once available"), although the 24 h / 72 h duty
      (Regierungsrat release of 2026-09-10 as relayed by Netzwoche and Plattform J) starts on 2026-11-01. Commune scope: the KAIO text says communes and other public-task
      bodies are bound only insofar as they process cantonal or federal information, use their ICT resources "oder Personendaten bearbeiten" (or process personal data);
      the covered entry narrows the last limb to personal data "on the canton's behalf", which the KAIO text does not say. The Bern city council's own reading of the draft
      (Jan 2026, a commune's view, not the canton's) is that because practically all communes use cantonal ICT resources the IDSV applies to nearly all communes in full.
      Plattform J and Netzwoche both relay the Regierungsrat's statement that communes apply the data-security principles and need not classify their own information.
