    extended_notes: |
      Plattform J's page title is "Ab November | 10. September 2026" while its extract metadata says 2026-10-22; the text says the Regierungsrat wrote "am Donnerstag"
      (Thursday 2026-09-10). Plattform J calls the IDSV a revised data-protection ordinance, Netzwoche calls it the ordinance on information and data security; the KAIO page
      settles it (IDSV = Verordnung über die Informations- und Datensicherheit; the KDSG/KDSV data-protection revision has applied since 2026-09-01).
