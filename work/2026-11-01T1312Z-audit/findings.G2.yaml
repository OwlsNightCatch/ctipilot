    update_delta:
      new: ["in force today 2026-11-01 (entry still reads as forward-looking)", "Grundschutz BE expected Q1 2027, ICSGW stays valid until then, ISDS DV lapses 2026-11-01", "AGB ISDS BE must be agreed in contracts that involve processing information or personal data", "reporting platform details still unpublished as of the KAIO page state of 2026-10-30"]
