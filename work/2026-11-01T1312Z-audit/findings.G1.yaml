    (extract). The 2026-10-30 intel run dropped it as outside its 26 h window (run record runs/2026-10-30/2026-10-30T0255Z-intel.md); the audit window reaches it.'
  summary: 'Sophos published advisory sophos-sa-20261028-utm-rce on 2026-10-28 (severity Critical, workaround: none): a path traversal in Sophos UTM that, per the vendor, lets an unauthenticated remote adversary execute arbitrary commands as
    root after winning a race condition by sustaining repeated attacks for a few minutes when the email proxy is used with scanning enabled. It affects all Sophos UTM versions; UTM is end of life, so the patch must be installed manually following
    Sophos KBA-000049692, and the remediation path is a move to a supported Sophos Firewall. Customers still using the Email Protection features are told to patch as soon as possible. It came through the Sophos bug bounty from an external researcher
    (Sam Pizzey); no exploitation, proof of concept or write-up was found (Sophos is silent on exploitation; a search for the researcher''s write-up returned none), and BSI relays the advisory at severity hoch. EPSS is 0.006 (FIRST, 2026-10-31).'
