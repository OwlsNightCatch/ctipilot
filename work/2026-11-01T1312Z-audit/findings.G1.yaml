    Store check: no entry or cves_seen record carries APSB26-162 or any of the eight ids; the store holds the earlier Campaign Classic waves (2026-08-02, 2026-08-07, 2026-08-28, 2026-10-02 entries).'
  summary: 'Adobe published bulletin APSB26-162 on 2026-10-27, an off-cycle priority 2 update for Adobe Campaign Classic v7 that addresses eight vulnerabilities all rated Critical: CVE-2026-105781 (SQL injection, CVSS 3.1 9.8, AV:N/PR:N, so reachable
    without credentials), four authenticated flaws at 9.9 (code injection CVE-2026-104351, OS command injection CVE-2026-104353, incorrect authorization CVE-2026-105780, SQL injection CVE-2026-105489; PR:L), a reflected XSS at 9.3 (CVE-2026-104350,
    needs user interaction) and two SQL injections at 9.1 (CVE-2026-104354 PR:H, CVE-2026-105779 PR:L). Affected is ACC v7 7.4.4 build 9402 and earlier on Windows and Linux; the fixed build is 7.4.4 build 9403. Build 9402 is the build the store
    records as the fix for the September wave (APSB26-142), so an installation that followed that advice is affected again. Adobe states it is not aware of exploits in the wild for any of the issues. It is the eighth Campaign Classic bulletin
    in the 2026 Adobe bulletin listing (APSB26-66, -69, -114, -120, -123, -134, -142, -162); the page read states no deployment-type scoping (the 2026-10-02 entry records on-premise and hybrid on-premise scoping for the earlier bulletin).'
