coverage_gaps:
- source_id: bsi-de
  reason: 'RECIPE (works, not in the record): the bsi-rss feed reaches back only about two days. Week lookback: `python3 tools/fetch_source.py url --direct https://wid.cert-bund.de/.well-known/csaf/white/changes.csv` lists every CSAF id with
    its last-modified stamp (14,420 rows; newest 2026-10-29T23:00 at the time), then `bsi-csaf WID-SEC-2026-<n>` per id returns the CSAF with initial_release_date, aggregate_severity and the "Angriff" note (145 ids fetched with 6 workers in about
    two minutes; 117 first published in the window). Use initial_release_date, not changes.csv time, to find new advisories.'
- source_id: msrc-update-guide
  reason: 'RECIPE (works): revised-CVE sweep: `$filter=latestRevisionDate ge <ISO>`, `$orderby=latestRevisionDate desc`, `$top=300`, `$skip=n` through fs._msrc_fetch_strict_json (1531 records since 2026-10-24, five pages); `msrc cve <id>` returns
    revisions[] with the revision text, and the CVRF month (29.7 MB) is readable with fs.fetch(max_bytes=120000000) for per-product FixedBuild rows. This surfaced the Edge addition on CVE-2026-96951 that no feed shows.'
- source_id: morphisec
  reason: 'RECIPE: `extract https://www.morphisec.com/blog/` returns dated rows (author, DD Mon YYYY) without titles; `url --direct https://www.morphisec.com/blog/` returns post hrefs of the form https://www.morphisec.com/blog/<slug>/ (absolute)
    and `extract <post>` carries the date. The 2026-10-28 PHP2Shell Windows/IIS post was on the listing and no earlier slice had read it.'
- source_id: f5-security (K000163821)
  reason: 'F5 K-article my.f5.com/manage/s/article/K000163821 returns the Salesforce shell on every transport (extract direct-raw 722 KB, no article text); the BIG-IP release notes (techdocs.f5.com relnote-supplement-bigip-21-1-0-4.html, "Updated
    Date : 10/24/2026") are the readable substitute, as the entry already records.'
- source_id: broadcom-sepm
  reason: 'Per-product Broadcom advisories 39411, 39421 and 39475 redirect to access.broadcom.com sign-in (served through the reader, one credit each); only the umbrella advisory 39404 is readable and carries the revision list (last: 2026-10-30
    12:00 PT, Content Analysis and Malware Analysis moved to Affected).'
- source_id: juniper-support-portal
  reason: supportportal.juniper.net PHP2Shell reference advisory returns the Salesforce community shell (599 KB, no text) on direct-raw; NCSC-NL and the HPE bulletin are the readable relays.
- source_id: citrix-community-blog
  reason: community.citrix.com techzone blog (PHP2Shell mitigation) fails on both bridge transports; WebFetch of support.citrix.com/external/article/CTX697263 reads the bulletin with its changelog (initial 2026-10-22, last 2026-10-27).
- source_id: tp-link-omada-psirt
  reason: Bridge listing HTML carries bulletin links but no parseable dates (MM-DD-YYYY strings absent from the cards read); `extract <bulletin>` returns the date in metadata (newest bulletins 136187/136188 dated 2026-10-14).
- source_id: cisa-advisories
  reason: WebFetch listing of /news-events/cybersecurity-advisories returns exactly 10 items per page (5108 total); in-window items were five KEV alerts and no AA-series advisory. `cisa csaf-recent 15` read the ICS side.
