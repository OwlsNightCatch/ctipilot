- title: 'PHP2Shell: Morphisec reports the first confirmed post-exploitation chain on Windows IIS with PHP-CGI (w3wp.exe to php-cgi.exe to a command shell to a packed in-memory payload with a reverse shell)'
  sources:
  - url: https://www.morphisec.com/blog/php2shell-is-hitting-windows-servers-in-the-wild-we-stopped-it/
    publisher: Morphisec (Tommy Perniciaro, threat research blog)
    date: '2026-10-28'
    role: primary
  discovery_trace: 'first seen at: morphisec, URL https://www.morphisec.com/blog/ (listing via extract: dated rows 01 Nov, 30 Oct, 28 Oct x2, 21 Oct, 19 Oct) and the raw listing via `url --direct https://www.morphisec.com/blog/` (post hrefs)
    -> primary: https://www.morphisec.com/blog/php2shell-is-hitting-windows-servers-in-the-wild-we-stopped-it/ (extract, dated 2026-10-28). Store check: no entry cites Morphisec; the PHP entry (2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619,
    updated 2026-11-01T04:10Z) says nothing on Windows, IIS, w3wp.exe or php-cgi.exe.'
  summary: 'Morphisec (an endpoint-protection vendor; its slice record is rated C) says it confirmed PHP2Shell post-exploitation activity against Windows servers running IIS with PHP-CGI, where every public proof of concept and previously reported
    exploitation targeted Apache with mod_php on Linux. Its agent blocked a payload on one customer''s Windows server: the IIS worker process spawned the PHP-CGI handler, which executed a command shell, which launched a packed binary that resolved
    networking libraries by walking the PEB and tried to open a reverse shell to an external address. Morphisec says its product did not detect PHP2Shell itself and acted only at the in-memory shellcode stage, and it gives no victim, sector,
    region, date of the event or actor, so this is single-vendor telemetry from one customer (assessment: PHP2Shell exploitation is not Linux-only). The post also cites Qualys (167 million PHP package installations in its customer base, 110 million
    on end-of-life branches 8.1 and older) and OX Security (93.6 percent of 2.2 million Shodan-visible PHP instances still on vulnerable versions five days after disclosure); both are relayed numbers the post does not source to a page the store
    can check.'
  region_nexus: global; the source gives no region or sector
  primary_sector_nexus: indirect
  sector: technology
  cves:
  - CVE-2026-109618
  - CVE-2026-109619
  techniques:
  - T1190
  - T1059.003
  - T1027.002
  affected_products:
  - PHP
  - Microsoft IIS
  entity_keys:
  - tool:php2shell
  - product:php
  new_entities: []
  verification: SINGLE-SOURCE-OTHER
  confidence: MEDIUM
  novelty: update-of:2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
  update_target: 2026-10-21/php-critical-release-pre-announced-cve-2026-109618-109619
  update_target_note: 'Adds a Windows host class and a process-lineage behaviour that the entry''s Detection and Triage lines (Linux web-server children, mod_php) do not carry: IIS worker process (w3wp.exe) with php-cgi.exe as child and a command
    shell below it is not normal for a PHP site that does not shell out. Credibility 3 (single vendor, one customer, product-marketing context); attribute to Morphisec, do not generalise.'
  evidence:
  - quote: Morphisec has confirmed that PHP2Shell post-exploitation activity is targeting Windows servers running IIS with PHP-CGI.
    attribution: Morphisec
    source_url: https://www.morphisec.com/blog/php2shell-is-hitting-windows-servers-in-the-wild-we-stopped-it/
  - quote: the IIS worker process spawned the PHP-CGI handler, which executed a command shell, which launched a packed binary that attempted to establish a reverse shell to an external command-and-control address.
    attribution: Morphisec
    source_url: https://www.morphisec.com/blog/php2shell-is-hitting-windows-servers-in-the-wild-we-stopped-it/
  - quote: Morphisec did not detect PHP2Shell itself.
    attribution: Morphisec
    source_url: https://www.morphisec.com/blog/php2shell-is-hitting-windows-servers-in-the-wild-we-stopped-it/
  extended_notes: 'Hunt concept (follows from the stated chain): process-creation events where the parent image is the IIS worker process or the PHP-CGI handler and the child is cmd.exe, then an unsigned or freshly written binary in a web-writable
    or temp path, then an outbound connection from that binary to a non-corporate address. Benign lookalike: PHP applications that deliberately call exec()/system() (backup, image-conversion or deployment scripts) show the same parent-child pair;
    the discriminators are an interactive shell child with no matching application feature and a following unsigned binary.'
- title: 'Contact Form 7 6.2.4: unauthenticated arbitrary file upload in versions 6.2 to 6.2.3 (WordPress, 10,000,000+ installs), no CVE yet, no exploitation reported'
  sources:
  - url: https://contactform7.com/2026/10/29/contact-form-7-624/
    publisher: Contact Form 7 / Rock Lobster (vendor release announcement)
    date: '2026-10-29'
    role: primary
  - url: https://mysites.guru/blog/contact-form-7-6-2-4-file-upload-fix/
    publisher: mySites.guru (Phil E Taylor)
    date: '2026-10-29'
    role: corroborating
  discovery_trace: 'first seen at: mysites-guru, URL https://mysites.guru/rss.xml (item dated 2026-10-29T12:20Z) -> primary: https://contactform7.com/2026/10/29/contact-form-7-624/ (extract, served through the reader fallback) -> corroborating:
    https://mysites.guru/blog/contact-form-7-6-2-4-file-upload-fix/ (extract). Store check: no entry, run record or cves_seen mention of Contact Form 7.'
  summary: 'Rock Lobster released Contact Form 7 6.2.4 on 2026-10-29 (6.2.4.1 about two hours later) to close an unauthenticated arbitrary file upload that, in the vendor''s words, chains multiple flaws in 6.2 to 6.2.3 to upload files that validation
    should block and to keep files that should be removed right after submission. The vendor says only forms with a file-upload field are in scope and, theoretically, those hosted on an HTTP server configured to list directory contents publicly;
    the plugin is on 10,000,000+ WordPress sites per wordpress.org. Versions before 6.2 are not affected, the vulnerable line was current for 24 days (6.2 on 2026-10-05, 6.2.3 on 2026-10-21), and mySites.guru finds more than half of its monitored
    Contact Form 7 installs on the affected line. The fix changes wpcf7_antiscript_file_name() from a blocklist to a safelist of extensions, so forms that accept doc, docx, xls, xlsx, odt, rtf, csv or zip will rename those uploads with a _.txt
    suffix until the wpcf7_file_extension_safelist filter is extended. It was reported through WPScan by Shinya Murakami and Jakub Herman; no CVE is assigned yet, it is not in CISA KEV, and the vendor does not say it is exploited. Inference from
    the stated conditions, not a vendor recommendation: switching off public directory listing on the uploads path or removing the file field from public forms narrows the exposure until the update is installed.'
  region_nexus: global; no Swiss-specific source
  primary_sector_nexus: indirect
  sector: public-sector
