    entry: 2026-10-02/adobe-campaign-classic-apsb26-142-134-unauth-cvss10
    surface: "summary"
    kind: frontmatter
    text: "Adobe's Priority 1 bulletin APSB26-142 for on-premise Adobe Campaign Classic v7 was published on 2026-09-08 with one CVE and revised on 2026-09-22 to eighteen Critical CVEs, ten needing no privileges, eight of them CVSS 10.0; builds 9401 and earlier are affected and build 9402 is the fix. The earlier bulletin APSB26-134 (build 9401, 2026-08-25) fixed three more unauthenticated CVSS 10.0 flaws. On 2026-10-27 the Priority 2 bulletin APSB26-162 fixed eight further Critical flaws in build 9402 and earlier, one needing neither privileges nor user interaction (CVE-2026-105781, SQL injection, 9.8), so build 9403 is now the fix. Adobe is not aware of exploitation of either bulletin's flaws and none of the CVEs is in CISA KEV."
