  - claim_id: 8aa75969bd
    entry: 2026-09-11/canton-bern-icsg-cybersecurity-law-2026-11-01
    surface: "headline"
    kind: frontmatter
    text: "Bern's cantonal cybersecurity law is in force: 24h/72h incident reporting and a named accountable officer per agency"
  - claim_id: 630239c5c9
    entry: 2026-09-11/canton-bern-icsg-cybersecurity-law-2026-11-01
    surface: "summary"
    kind: frontmatter
    text: "Canton Bern's government council confirmed on 2026-09-10 that its new Gesetz über Informations- und Cybersicherheit (ICSG) and implementing ordinance (IDSV) enter into force on 1 November 2026. From that date, every cantonal administrative unit must report cyberattacks and security incidents within 24 hours (72 hours where personal data is affected), classify ICT assets by protection need, and name each agency's top leadership as the accountable security officer. The baseline directive Grundschutz BE follows in the first quarter of 2027, and its general terms on information security and data protection (AGB ISDS BE) must be agreed in cantonal contracts that cover processing information or personal data."
  - claim_id: 35ac52184a
    entry: 2026-09-11/canton-bern-icsg-cybersecurity-law-2026-11-01
    surface: "body"
    kind: cited
    text: "Canton Bern's government council (Regierungsrat) confirmed on 2026-09-10 that the cantonal Gesetz über Informations- und Cybersicherheit (ICSG), passed by the Grand Council on 12 June 2025 ("
    urls: ["https://www.kaio.fin.be.ch/de/start/themen/rechtliche-grundlagen/ICSG.html"]
  - claim_id: a1175e5d1b
    entry: 2026-09-11/canton-bern-icsg-cybersecurity-law-2026-11-01
    surface: "body"
    kind: cited
    text: "), and its implementing Verordnung über die Informations- und Datensicherheit (IDSV) enter into force on 1 November 2026 ("
    urls: ["https://ch.headtopics.com/news/kanton-bern-verscharft-cyberschutz-bei-angriffen-gilt-ab-87600698"]
  - claim_id: 2f7350f24d
    entry: 2026-09-11/canton-bern-icsg-cybersecurity-law-2026-11-01
    surface: "body"
    kind: cited
    text: "Municipal bodies and other public-task carriers in the canton are bound by the ICSG/IDSV only to the extent they process cantonal or federal information, use cantonal or federal ICT resources, or process personal data; the cantonal rules otherwise apply to them only as a recommendation ("
    urls: ["https://www.kaio.fin.be.ch/de/start/themen/rechtliche-grundlagen/ICSG.html"]
  - claim_id: 3845adee12
    entry: 2026-09-11/canton-bern-icsg-cybersecurity-law-2026-11-01
    surface: "body"
    kind: cited
    text: "The canton is also standing up a dedicated platform for reporting security incidents, vulnerabilities and data-security breaches, whose details KAIO had still not published on 2026-11-01 ("
    urls: ["https://www.kaio.fin.be.ch/de/start/themen/rechtliche-grundlagen/ICSG.html"]
  - claim_id: c46c201302
    entry: 2026-09-11/canton-bern-icsg-cybersecurity-law-2026-11-01
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** the obligations apply from 1 November 2026: cantonal Bern administrative units and any body handling cantonal or federal Bern information or ICT resources need a named SIVE (Sicherheitsverantwortliche/r) and a working 24-hour/72-hour incident-reporting path now, ICT-asset classification scheduled within the transition window, and, for suppliers, the AGB ISDS BE terms in contracts that cover processing information or personal data."
