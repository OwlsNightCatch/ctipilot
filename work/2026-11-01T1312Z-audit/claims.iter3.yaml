    surface: "summary"
    kind: frontmatter
    text: "privatim, the conference of the Swiss data-protection authorities, revised its guidance on cloud-specific risks for public bodies on 2026-10-02 (version 3.02, replacing the version of 3 February 2022). For particularly sensitive personal data the public body must encrypt with keys only it can use, outsourcing such data or data under a statutory duty of confidentiality to SaaS solutions of large international providers is in most cases inadmissible, and the body's top management is to confirm the residual risk in writing."
