  - claim_id: fd02bc6366
    entry: 2026-10-10/ghostaction-fake-audit-workflow-git-history-credential-theft
    surface: "summary"
    kind: frontmatter
    text: "StepSecurity and Socket report that on 2026-10-08 the GhostAction campaign used the GitHub credentials of two open-source maintainers to commit a workflow disguised as a security audit straight to the default branch of 345 to 346 repositories, including one of an Uber-owned organisation, and that the workflow now sends the credentials found in the working tree and in the entire git history, besides the named Actions secrets, to a hardcoded address over plain HTTP. GitGuardian's own data puts the wave of 8 to 12 October at more than 30,000 repositories reached through about 1,900 compromised GitHub accounts, and says GitHub has prevented the workflow from running since 9 October. Between 13 and 21 October the operator pushed at least 72,026 further commits with the same unrevoked tokens, including a stealer disguised as a font file that a hidden VS Code task runs on developer machines, outside GitHub's workflow hold, and a cron job that survives cleaning the repository."
  - claim_id: e055a43568
    entry: 2026-10-10/ghostaction-fake-audit-workflow-git-history-credential-theft
    surface: "actions[0]"
    kind: frontmatter
    text: "Run an organisation-scoped GitHub code search in every organisation your teams and suppliers administer for workflow files under .github/workflows that present themselves as a security audit, a security check or an Actions security workflow and were added since 2026-08-31; any hit means assume breach: revoke the credential that committed it, rotate every secret found anywhere in the repository's git history, not only the configured Actions secrets, and check the crontab of every developer machine and self-hosted runner that opened or ran the repository since 2026-10-14 for a five-minute job that runs a remote script."
