    text: "{\"id\": \"CVE-2026-41709\", \"cvss\": \"2.7\", \"status\": [\"exploited\", \"cisa-kev\", \"patch-available\"], \"affected\": \"ESX only: insufficient logging that lets an administrator perform actions without those actions being recorded.\", \"fixed\": \"ESXi-9.1.0.0, ESXi-9.0.2.0100, ESXi80U3j and 5.2.4.\", \"auth\": \"admin-required\", \"vector\": \"zero-click\"}"
  - claim_id: 9194971ecd
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "body"
    kind: cited
    text: "Two further product families are in scope: Broadcom lists VMware Telco Cloud Platform and VMware Telco Cloud Infrastructure as impacted, with their own knowledge-base fix path rather than the vCenter and ESXi build numbers below ("
    urls: ["https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/SecurityAdvisories/0/38017"]
  - claim_id: c6f7315d8f
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "body"
    kind: cited
    text: "Fixed builds differ per flaw and per track. vCenter takes 9.1.0.0300, 9.0.2.0100, 8.0 U3k or, on the U2 branch, 8.0 U2f, with Cloud Foundation 5.x served by an async patch to 8.0 U3k; the VMXNET3 escape is fixed in ESXi-9.1.0.0200, ESXi-9.0.2.0100, ESXi80U3k and ESXi80U2f, and the 7.0 lines are served only under Broadcom extended support ("
    urls: ["https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/SecurityAdvisories/0/38017"]
  - claim_id: 743583ca39
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "body"
    kind: cited
    text: "Broadcom states the vulnerabilities \"were privately reported to Broadcom\" and credits Atredis Partners, Nguyen Hoang Thach of STARLabs SG working with Pwn2Own held by the Zero Day Initiative, Maxim Suhanov, and CrowdStrike ("
    urls: ["https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/SecurityAdvisories/0/38017"]
  - claim_id: cdadb192d3
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "body"
    kind: uncited
    text: "For the guest-to-host escape the telemetry is host-side: hypervisor crash and process-fault records on ESX hosts running VMXNET3 guests, since a failed escape attempt is far more likely to surface as an anomalous fault than as a clean compromise."
  - claim_id: 86fd97a767
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "section 2026-08-13T04:58:00Z"
    kind: cited
    text: "By 5 August, 343 of the 361 addresses had already appeared: the campaign reached roughly 95 per cent of its observed footprint within three days of starting ("
    urls: ["https://medium.com/@quirso_de/active-exploitation-of-cve-2026-59310-361-victim-ips-across-47-countries-9783187cc6ff"]
  - claim_id: 6e90ba8b23
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "section 2026-08-13T04:58:00Z"
    kind: uncited
    text: "One of the five VMSA-2026-0006 flaws, none of which was reported exploited at disclosure, has now been confirmed in use against real estates."
  - claim_id: b833cfaea1
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "section 2026-08-13T04:58:00Z"
    kind: uncited
    text: "The Hacker News reports Defused Cyber observing a spike in scanning against vCenter (version probes and walks of the single-sign-on flow) that it associates with CVE-2026-59309, the unauthenticated Directory Service authentication bypass from the same advisory."
  - claim_id: 8fc4ce752d
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "section 2026-08-13T04:58:00Z"
    kind: derived
    text: "Broadcom offers no workaround, so version state is the only preventive control; but for any appliance that was reachable and unpatched between 29 July and now, the five-day disclosure-to-exploitation gap and the three-day saturation curve mean an upgrade closes the door without answering whether anyone already walked through it."
  - claim_id: 759afe968d
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "section 2026-08-28T05:20:00Z"
    kind: cited
    text: "QUIRSO's continued work on the campaign now attributes the activity to a suspected China-nexus actor and reports that Babuk-derived ransomware was deployed against ESXi hosts in at least one investigated case ("
    urls: ["https://thehackernews.com/2026/08/suspected-china-nexus-actor-exploits.html"]
  - claim_id: 8ce71f40aa
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "section 2026-08-28T05:20:00Z"
    kind: cited
    text: "Infosecurity Magazine had reported only QUIRSO's earlier assessment that \"a suspected advanced persistent threat (APT) actor was responsible\" ("
    urls: ["https://www.infosecurity-magazine.com/news/vcenter-cve-2026-59310-exploited/"]
  - claim_id: 8abe22be35
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "section 2026-08-28T05:20:00Z"
    kind: cited
    text: "The ransomware deployment is assessed by QUIRSO as plausibly a smokescreen rather than the operation's goal: the deployment of \"the locker\", the Babuk-derived payload, \"may not have been the primary objective of the campaign\" ("
    urls: ["https://thehackernews.com/2026/08/suspected-china-nexus-actor-exploits.html"]
  - claim_id: dddc145a75
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "section 2026-08-28T05:20:00Z"
    kind: uncited
    text: "CISA added CVE-2026-59310 to its Known Exploited Vulnerabilities catalog on 2026-08-18, a jurisdiction-agnostic confirmation of active exploitation, independent of any US-FCEB remediation deadline, layered on top of NCSC-CH's own actively-exploited determination already recorded above."
  - claim_id: e4d82392df
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "section 2026-08-28T05:20:00Z"
    kind: uncited
    text: "Both findings warrant the same caveat as the CVE-2026-59309 scanning correlation: every outlet surveyed (The Hacker News, Infosecurity Magazine, and further security-press pickup) cites QUIRSO's own Medium write-ups as the sole source for the China-nexus attribution (built on a UTC+08:00 activity pattern, Chinese-language code artefacts, and reuse of a Chinese security publication) at QUIRSO's own stated moderate confidence, and for the ransomware finding."
  - claim_id: 7d6e590992
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "section 2026-08-28T05:20:00Z"
    kind: uncited
    text: "Two outlets reporting one firm's conclusion is wide distribution of a single assessor's work, not independent corroboration of it: the attribution and the ransomware-deployment finding should be read as QUIRSO's own assessment, not as cross-verified intelligence; the multi-CERT corroboration covers the vulnerability and initial-exploitation facts only."
  - claim_id: 50cf707ea4
    entry: 2026-07-30/vmware-vmsa-2026-0006-vcenter-auth-bypass-vmxnet3-escape
    surface: "section 2026-08-28T05:20:00Z"
    kind: uncited
    text: "Nothing in this update changes the remediation guidance already given above: patch every internet-reachable vCenter to the fixed builds, and treat any instance that was internet-reachable and unpatched between 29 July and 3 August as a compromise-assessment candidate rather than a patch-and-close item; that assessment should now explicitly include a check for Babuk-derived encrypted files on any ESXi hosts the appliance manages, alongside the reverse_ssh persistence and cron-entry artefacts already described."
  - claim_id: 8466ef522b
