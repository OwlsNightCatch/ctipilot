  - claim_id: 58b9827d07
    entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
    surface: "section 2026-10-29T04:52:00Z"
    kind: cited
    text: "Dream Research describes a chain of this kind from artifacts its tooling recovered: a custom, non-public PHP2Shell build, tailored to the PAN-OS management web server, which runs PHP 8.0.30, gives code execution as the nobody user, and the Fragnesia exploit then overwrites /etc/pam.d/su in the page cache so that su root succeeds without a password; Dream says SELinux confines the web server's domain from modifying system files and that the whole chain runs in one HTTP request in under 15 minutes ("
    urls: ["https://dreamgroup.com/blog/chained-php2shell-exploit-roots-25-servers"]
  - claim_id: cce33243bc
    entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
    surface: "section 2026-10-29T04:52:00Z"
    kind: cited
    text: "From about 19,000 internet-facing PAN-OS firewalls that it found through a search engine, the attacker narrowed to 240 in the United States, Japan, Taiwan and South Korea, rooted 24 and planted a PHP webshell on each; on the second of two firewalls of a US government-affiliated organization (the first crashed) it set up an outbound SSH tunnel kept up by a systemd service and an rc.local entry, rooted the organization's firewall management server through the tunnel, decrypted the LDAP service-account password with root access and sprayed passwords against a domain that had no lockout threshold ("
    urls: ["https://dreamgroup.com/blog/chained-php2shell-exploit-roots-25-servers"]
  - claim_id: 6684c51d6c
    entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
    surface: "section 2026-10-29T04:52:00Z"
    kind: cited
    text: "Dream says the recovered artifacts confirm credential extraction and directory enumeration but could not tell whether the password spray succeeded, calls the campaign apparently Chinese and AI-assisted and does not attribute it to a named actor ("
    urls: ["https://dreamgroup.com/blog/chained-php2shell-exploit-roots-25-servers"]
  - claim_id: 54c63ea713
    entry: 2026-05-15/cve-2026-46300-linux-kernel-local-privilege-escalation-via-x
