    urls: ["https://mysites.guru/blog/membership-pro-unauthenticated-file-upload/"]
  - claim_id: c9a8f33f73
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "body"
    kind: cited
    text: "The researcher's follow-up of 2026-07-29 prints the cookie, and the further Gridbox flaws its full audit found were exploited while the complete fix was still being finalised, so anything on 2.20.1 or earlier is still exposed ("
    urls: ["https://mysites.guru/blog/gridbox-23-critical-vulnerabilities/"]
  - claim_id: ba59f6bc51
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "body"
    kind: cited
    text: "**Triage:** a cookie-forgery bypass leaves little at the network layer to distinguish it: the request is perfectly well formed and contains no payload to detect ("
    urls: ["https://mysites.guru/blog/gridbox-critical-authentication-bypass/"]
  - claim_id: b15a67e9d4
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "body"
    kind: uncited
    text: "The batch of Joomla extension disclosures mySites.guru published between 2026-07-20 and 2026-07-23 includes a direct authentication failure."
  - claim_id: 4864e74b3a
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "body"
    kind: uncited
    text: "The extension treats a client-supplied cookie value as proof of identity rather than as an assertion to be validated against server-side session state, so an anonymous requester who places an administrator's username in that cookie is served the site as that administrator, with no password, no login form and no pre-existing session."
  - claim_id: 3650a37999
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "body"
    kind: derived
    text: "**Defender takeaway:** inventory Joomla extensions and their versions, not only the Joomla core version, and treat every Gridbox below 2.20.4.2 as exposed; on a site that ran 2.20.1 or earlier while internet-facing, the account and template review matters as much as the update."
  - claim_id: 6c5cecfe41
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "body"
    kind: derived
    text: "On sites running affected Gridbox versions, template-file modifications with no corresponding administrator login are the artefacts worth reviewing."
