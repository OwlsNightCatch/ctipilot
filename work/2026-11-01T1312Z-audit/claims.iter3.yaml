  - claim_id: c5d2da08a3
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "section 2026-07-31T04:09:14Z"
    kind: uncited
    text: "For the privilege escalation, the artifact is a user account whose administrator-group membership was established at creation time rather than by a later administrative change, visible in the user table and in Joomla's own action logs as a registration event that produced an elevated account, with no corresponding admin action."
  - claim_id: b26e2f421c
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "section 2026-07-31T04:09:14Z"
    kind: uncited
    text: "For the upload half, the signal is a file appearing in a web-reachable directory with a server-executable extension, written by the web server user, followed by requests to that path from a small number of sources; in web-server access logs, look for POST requests to the extension's registration and upload endpoints from addresses with no prior browsing history on the site."
  - claim_id: f4d89f8879
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "section 2026-07-31T04:09:14Z"
    kind: derived
    text: "**Defender takeaway:** this is the second time in ten days that Gridbox, a widely used Joomla page builder, has turned out to accept the attacker's own claim about who they are (a cookie on 20 July, requested group IDs on 29 July)."
  - claim_id: a7653def3d
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "section 2026-07-31T04:09:14Z"
    kind: derived
    text: "A Joomla estate needs an extension inventory that can answer \"which of our sites run Gridbox, at what version\" quickly, because patching here is fast and the compromise-assessment afterwards is what takes the time."
  - claim_id: 871663a7eb
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "section 2026-10-28T03:52:00Z"
    kind: cited
    text: "mySites.guru reads both flaws as read-side, although the CNA's vector also rates integrity and availability High: an anonymous visitor can extract the Joomla user table, with its password hashes, and every other table the site's extensions created. mySites.guru says about 95% of the Gridbox sites it monitors ran an affected version on the morning of the release, that sites on the Joomla 3 line stop at Gridbox 2.17.0.2, which has no fix for this year's flaws, and that there is no public report of exploitation yet ("
    urls: ["https://mysites.guru/blog/gridbox-2-20-4-2-sql-injection-fixes/"]
  - claim_id: 76eeeea77b
    entry: 2026-07-26/joomla-gridbox-cookie-forged-super-user-auth-bypass-wave
    surface: "section 2026-10-28T03:52:00Z"
    kind: derived
    text: "**Detection:** in web access and database query logs, store or category list requests whose sort-by value is not one of the known sort keys, repeated anonymous calls to the Gridbox editor's blog-post task, and slow-query bursts from the web account; since the reported impact is data read out, the post-patch check is credential hygiene on a site that was exposed, starting with administrator accounts nobody created, since the password hashes can be worked on offline."
