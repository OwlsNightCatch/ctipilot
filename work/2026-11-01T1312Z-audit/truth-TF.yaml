    ground_truth: 'CNA record unaffected-version rows: "5.10.272 (<=5.10.*)", "5.15.223", "6.1.190", "6.6.159", "6.12.113", "6.18.56", "7.2.10"; CIQ: "The same fix was backported to stable series 5.10.272, 5.15.223, 6.1.190, 6.6.159, 6.12.113, 6.18.56, and 7.2.10." Anthropic: "patched upstream and backported to all maintained stable kernel branches".'
