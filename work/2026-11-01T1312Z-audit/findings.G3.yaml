    verification: MULTI-SOURCE
    confidence: HIGH
    novelty: "update-of:2026-10-10/ghostaction-fake-audit-workflow-git-history-credential-theft"
    classification_suggested: { reliability: B, credibility: 2 }
    evidence:
      - quote: "Between Oct. 13 and Oct. 21, 2026, the GhostAction operator pushed 72,000 commits to 23,000 public repositories. 8,000 of them are new victims."
        attribution: "GitGuardian"
        source_url: "https://blog.gitguardian.com/ghostaction-x-polinrider/"
      - quote: "However, the PolinRider-styled infostealer, part of the GhostAction campaign, was not meant to run in the CI. As such, GitHub’s security measures couldn’t prevent it from executing on the developer endpoints."
        attribution: "GitGuardian"
        source_url: "https://blog.gitguardian.com/ghostaction-x-polinrider/"
      - quote: "Three families install a cron job that runs a script from the command-and-control (C2) server every five minutes. Cleaning the repository does not remove it."
        attribution: "GitGuardian"
        source_url: "https://blog.gitguardian.com/ghostaction-x-polinrider/"
      - quote: "1,382 of the 1,792 compromised accounts had already been used on Oct. 8, so the same stolen tokens keep working."
        attribution: "GitGuardian"
        source_url: "https://blog.gitguardian.com/ghostaction-x-polinrider/"
      - quote: "Restrict OIDC trust policies to specific repositories and branches, and require approval for workflow changes."
        attribution: "GitGuardian"
        source_url: "https://blog.gitguardian.com/ghostaction-x-polinrider/"
      - quote: "which makes VS Code autorun a credential stealer and install a cron job that runs whatever the attacker’s server sends, every five minutes."
        attribution: "OpenSourceMalware"
        source_url: "https://opensourcemalware.com/blog/ghostaction-copycats-polinrider-by-hiding-a-stealer-in-a-fake-font-file"
    triage_note: |
      Benign lookalike discriminator the sources support: a folder-open task in .vscode/tasks.json is normal for linters, but this one is hidden (no terminal reveal), its command runs node on a file
      under public/fonts, and that "font" is readable JavaScript; the commits that add the pair carry messages such as "Add font assets" and "Add editor task" and land in many repositories of one
      account within minutes. On a host, a crontab line that pipes a remote script to a shell every five minutes is the persistence.
    extended_notes: |
      OpenSourceMalware's 2026-10-26 update is the earlier of the two primaries (the font-file stage was already public on 2026-10-16, four days before the entry's last update), so the 2026-10-20
      audit update could have carried it. The Dark Reading item is a relay and not a source of new facts. Registry already tracks tasks.json folder-open abuse under other campaigns
      (campaign:jfrog-vscode-folderopen-task-npm-go-supply-chain-infostealer and a DPRK UNK_DeadDrop record), so the technique class is known to the store; PolinRider itself is not registered.
