    borderline: true
    borderline_reason: "Previously dropped (covered technique, commodity capability, no victimology). The German-language lure and intermediary pages are the only constituency-adjacent signal, and no source names Swiss or DACH victims; the store already carries Kali365, helix, token-spray and calendar-invite entries with the same Conditional Access device-code-flow lever."
    sources:
