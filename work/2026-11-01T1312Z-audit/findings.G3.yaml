  - title: "Node2Shell (CVE-2026-111497): Datadog's behavioural detection layers and what does not work, and Zscaler Deception's first-day exploitation telemetry"
    update_target: "2026-10-24/cve-2026-111497-node2shell-brotli-decoder-rce-nodejs-pypi"
    update_type_suggested: improvement
    sources:
      - { url: "https://securitylabs.datadoghq.com/articles/node2shell-cve-2026-111497-nodejs-brotli-decoder/", publisher: "Datadog Security Labs (Sebastian Obregoso)", date: "2026-10-29", role: "primary" }
      - { url: "https://www.zscaler.com/blogs/security-research/cve-2026-111497-node2shell-http2shell-vulnerability-may-allow-rce", publisher: "Zscaler ThreatLabz", date: "2026-10-28", role: "corroborating" }
    discovery_trace: "first seen at: datadog-security-labs, feed URL https://securitylabs.datadoghq.com/rss/feed.xml (item 2026-10-29) -> primary (no pivot needed): https://securitylabs.datadoghq.com/articles/node2shell-cve-2026-111497-nodejs-brotli-decoder/ ; second source: zscaler-threatlabz, feed URL https://www.zscaler.com/blogs/feeds/security-research (item 2026-10-28) -> https://www.zscaler.com/blogs/security-research/cve-2026-111497-node2shell-http2shell-vulnerability-may-allow-rce"
    summary: |
      The published entry (updated through 2026-10-29) carries KEV listing and ELLIO's lab traffic, and its Detection line holds only ELLIO's crash-and-HTTP-400 hook and a core-dump caution; neither
      Datadog nor Zscaler is cited. Datadog, which reproduced the bug on Node.js, says there are no conventional indicators because no attacker infrastructure is involved and lays out three
      behavioural layers to correlate. Decoder error signals: a vulnerable Node.js build returns Z_BUF_ERROR "unexpected end of file" (which benign truncated input also produces), a patched build
      returns ERR__ERROR_FORMAT_BLOCK_SWITCH and patched Python returns "brotli: decoder is unhealthy". Process signals: a worker that exits with signal 139 right after a Brotli transfer is a crash
      attempt, a process pinned at 100% CPU inside a decompression call is the spin arm, and the strongest signal is a shell or new outbound connections from the same workload (correlate on
      container, pod or service identity, not on process id). Disclosure channel: decompressed output that contains bytes the client never sent is the read primitive, so list endpoints that echo,
      preview, convert or proxy decompressed content. Datadog states what does not work: payload byte signatures (the attacker-controlled parts change per target and the exploit is the decode
      itself), content matching at a WAF (the web server forwards compressed bytes and never decodes them) and body-size limits (the tested middleware counts decompressed bytes, so the 23 MB
      compressed trigger still reaches the decoder). Zscaler reports from its Deception decoy mesh that in the first 24 hours after disclosure 20 source addresses produced 402 events against 12
      customers, 40% reconnaissance and 60% exploitation attempts, a second vendor's telemetry beside ELLIO's. Both are vendor reproductions and decoy telemetry with product pitches attached; no
      source here reports a successful compromise of a production system.
    delta_vs_entry: "Detection line gains the decoder-error, process and disclosure-channel signals and the three controls that do not work (WAF content rules, body-size limits, byte signatures); the in-the-wild status gains Zscaler Deception as a second independent telemetry source. No change to the patch list."
    region_nexus: "global; Node.js, Express 5, body-parser 2 and Koa services and any client that auto-decodes Brotli, in cantonal and federal web applications and supplier products"
