    discovery_trace: "first seen at: group-ib, feed URL https://www.group-ib.com/blog/rss.xml (item 2026-10-29) -> primary (no pivot needed)"
    summary: |
      Group-IB describes a device-code phishing kit it names MadApe: business-themed PDF attachments with an embedded link to a click-and-wait intermediary page (a SharePoint-style access page or a
      human-verification challenge, a configurable redirector), then a page that shows a device code supplied by the backend, copies it on click and sends the victim to the legitimate Microsoft
      device-login portal to complete authentication, so no password is collected on any phishing page. Templates impersonate SharePoint, OneDrive, Teams, Adobe Acrobat and DocuSign; Group-IB found
      localised PDF and intermediary pages in English, German, Portuguese and Hebrew (Hebrew emails first), 155 root domains in the expanded set and device-code components on 97 of them, and an
      operator panel login exposed on the phishing hosts. Its recommendations: inventory legitimate device-code use through the Entra sign-in logs' authentication protocol filter, block the flow
      with a Conditional Access authentication-flows policy where unneeded (report-only first), keep Continuous Access Evaluation on and revoke sessions on suspicion, and detonate PDFs in a sandbox
      that follows click-dependent redirects. Already-issued tokens may stay usable until expiry after a blocking policy is enabled.
    region_nexus: "global; German-language lures named, no victim region stated"
    primary_sector_nexus: "indirect"
    sector: "public-sector"
    cves: []
    techniques: [T1566.001, T1566.002, T1528, T1078.004]
