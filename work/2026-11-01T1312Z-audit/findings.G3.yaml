    borderline_reason: "Commodity Windows stealer with no constituency nexus; dropped by the 2026-11-01 fire as effort-displacement novelty with no decision change. The one concrete hardening hook (Chrome launched with --headless from a non-developer parent, the App-Bound Encryption bypass path) is generic stealer guidance."
    sources:
