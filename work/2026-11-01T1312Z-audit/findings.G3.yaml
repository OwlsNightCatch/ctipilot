  - title: "Coruna and DarkSword iPhone kits beyond DeadTag: Zimperium counts 608 delivering domains, two exploit chains chosen by iOS version, native modules that change code-signing state and purge crash logs, and delivery through a hijacked npm package"
    update_target: "2026-10-28/deadtag-expired-tag-domains-coruna-darksword-iphone-kits"
    update_type_suggested: update
    borderline: true
    borderline_reason: "Marginal increment on a notable entry that already says to keep iPhones current, use Lockdown Mode for targeted staff and audit third-party tags; the new facts (608 domains, dependency-borne delivery, native-module clean-up behaviour) change no decision beyond those, and the art-template route is documented as offline since early July."
    sources:
      - { url: "https://zimperium.com/blog/inside-coruna-and-darksword-chains-from-web-lures-to-ios-exploitation", publisher: "Zimperium zLabs (Santiago Rodriguez)", date: "2026-10-29", role: "primary" }
      - { url: "https://safedep.io/art-template-npm-supply-chain-compromise/", publisher: "SafeDep", date: "2026-05-20 (updated 2026-07-03)", role: "corroborating" }
    discovery_trace: "first seen at: zimperium-zlabs, WebFetch of https://zimperium.com/blog (listing with dates; the post is dated October 29, 2026) -> primary (no pivot needed): https://zimperium.com/blog/inside-coruna-and-darksword-chains-from-web-lures-to-ios-exploitation -> pivot to the independent npm analysis it cites: https://safedep.io/art-template-npm-supply-chain-compromise/"
    summary: |
      Zimperium's zLabs reports that through October 2026 it identified 608 domains delivering Coruna-family code, with recovered configurations on 93 of them mapping to 21 tracking collectors, and that
      the recovered infrastructure now serves two exploit chains conditioned on the device's iOS version: the legacy Coruna framework to iOS 17.2.1 and earlier and a DarkSword-derived chain to later
      builds. The lures span dating, AI-companion, cryptocurrency and streaming pages, some compromised legitimate sites that load the kit through hidden iframes, and some pages that push TikTok users
      to "open in Safari". The recovered native modules include kernel memory read and write routines and code that changes state used by code-signing enforcement (AMFI), process-memory reads through
      task ports, and routines that delete crash logs and Safari website data; Zimperium calls unexpected code-signing changes a high-priority integrity signal and says exploit chains purge
      post-exploitation artefacts, so diagnostic logs should be collected continuously for high-risk users. SafeDep, which Zimperium names as independent confirmation, reported in May that the npm
      package art-template (versions 4.13.3 to 4.13.7, after an acquisition-fraud takeover of the maintainer accounts) loaded external script from a third-party domain that served the Coruna kit to
      iPhones; SafeDep's update of 3 July says that infrastructure was offline and the payload had become a gambling redirect, and it could not verify that any end user was hit. Zimperium scopes its
      attribution to the code base and delivery infrastructure only and does not name an operator; it recommends current iOS, Lockdown Mode for "public-sector personnel" among other high-risk groups,
      EOL-device replacement and web filtering that covers in-app browsers. Zimperium does not mention DeadTag or Report URI, so the link to the stored entry is the store's inference (same kits),
      not a source claim.
    region_nexus: "global; Brazil, Nigeria and Indonesia localisations named for dating lures; public-sector staff on iPhones named by Zimperium as a Lockdown Mode audience"
