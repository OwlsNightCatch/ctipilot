    summary: |
      Talos reports a builder-model Windows stealer that harvests browser data, sessions, OAuth tokens, SSH and cloud keys and wallet vaults, enriches the victim profile through stolen sessions, then
      POSTs a JSON evidence bundle to OpenRouter's chat-completions endpoint with a system prompt asking for a target assessment ranked by monetisation value, failing over across three models if one
      refuses. It deletes itself and uses only third-party infrastructure. Talos's countermeasure: application control that restricts which processes may launch Chrome with --headless blocks the
      App-Bound Encryption decryption path, and a timestamped harvest log in the user profile survives for forensics. The assessment that AI mainly displaces operator effort is Talos's.
